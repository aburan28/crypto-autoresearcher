idea:
  id: IDEA-20260816-046ca8
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: 'Census the base rate of accidental speciality: enumerate the forward map from bounded polynomials
    and bases to primes, count how many primes below a bound lie in the class C(d,H) anyway, and report
    the fibre-size distribution, since this number is the false-positive floor of every detector'
  class: measurement
  claim: '(A) EVERY DETECTOR''S FALSE-POSITIVE RATE IS BOUNDED BELOW BY A NUMBER NOBODY HAS COMPUTED.
    A detector for C(d,H) that is correct cannot have a false-positive rate below the fraction of
    ordinary primes that happen to lie in C(d,H), because those primes are genuinely in the class
    and a correct detector must fire on them. Call that fraction the accidental base rate, beta(X,d,H)
    = #{p <= X prime, p in C(d,H)} divided by pi(X). Until beta is known, every reported false-positive
    rate in this campaign is uninterpretable, because it cannot be told from the floor. (B) THE FORWARD
    MAP MAKES IT COMPUTABLE. Rather than testing primes for membership, enumerate the map Phi from
    pairs (f,m) with deg f = d, coefficients bounded by H, and m in the admissible range, to the integer
    f(m), and retain the primes. This is a complete construction of the in-class population below
    X, so beta is counted rather than estimated, and the enumeration is affordable exactly when (2H+1)^(d+1)
    times the base range is. (C) THE FIBRE STRUCTURE IS THE SECOND DELIVERABLE AND IT IS NOT A DETAIL.
    The map Phi is far from injective: reversing the sign of every coefficient and negating nothing,
    or rescaling, or the reciprocal polynomial, all produce distinct pairs with related values, and
    distinct unrelated pairs can collide. The distribution of fibre sizes matters because a prime
    with many witnesses is easier to detect than one with a single witness, so the detection problem
    is not uniform over the class and the fibre distribution is what quantifies the non-uniformity.
    (D) THE COUNTING PREDICTION IS TESTABLE. A naive heuristic says the number of in-class primes
    below X should be about the number of admissible pairs producing values below X, divided by the
    average number of witnesses per prime, times the density of primes near X. Comparing the counted
    beta against that prediction tests whether the class behaves like a random set of the same size,
    and a large discrepancy is itself informative about the structure of the class. (E) WHAT IS NOT
    CLAIMED. No detector, no separation, no attack, no security consequence, and no extrapolation
    of beta to sizes not enumerated. beta at 30 bits is not beta at 1024 bits and the contract forbids
    treating it as such. Nothing here concerns any real, published or deployed prime.'
  mechanism: 'STAGE ONE, zero compute: derive the count of admissible pairs and the naive prediction
    for beta, and derive the trivial fibre symmetries so that they can be quotiented out rather than
    discovered as if they were results. STAGE TWO: implement the forward enumerator over all coefficient
    tuples and all bases, evaluating f(m) with Horner in exact integers, filtering to values in the
    target range, and testing primality. STAGE THREE: accumulate a dictionary from prime to the set
    of witnesses producing it, which gives beta and the fibre-size distribution in one pass. STAGE
    FOUR: compare counted beta against the naive prediction and report the ratio. STAGE FIVE: quotient
    the fibre by the derived trivial symmetries and report both the raw and the reduced fibre distribution,
    since a fibre inflated by symmetry says nothing about detectability while a fibre with genuinely
    distinct witnesses does. STAGE SIX: sweep d and H and record how beta scales, which is the only
    part with any predictive content, and state the scaling as a fitted law with its residuals rather
    than as an asymptotic. STAGE SEVEN: cross-validate against the backward direction by taking a
    random sample of primes below X and deciding membership by base sweep, which must reproduce beta
    within sampling error; a mismatch means one of the two implementations is wrong. The census is
    complete when beta, the fibre distribution and the forward-backward agreement are all recorded.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: RQ-SNFS-005666 and GOAL-SNFS-001, neither of which mentions a base rate.
      Read docs/inventor-protocol.md sections 3 to 5. Greps: grep -ril -E ''base rate|prevalence''
      ledger/proposals/ was subsumed by the broader detectability grep; grep -ril -E ''detectab''
      ledger/proposals/ ledger/hypotheses/; grep -ril -E ''trapdoor|SNFS|special number field'' ledger/proposals/;
      grep -ril -E ''special.form|SNFS'' ledger/hypotheses/, empty. Inspected the near-neighbour headers
      IDEA-20260814-c3af09, IDEA-20260807-070d03, IDEA-20260811-565915.'
    results: No record in this repository computes a prevalence or base rate for any structural class
      of integers or primes. The detectability grep returns records under RQ-ECTD-001, RQ-VOLC-f6253b
      and ECDLP questions, none of which counts a class. The batch briefing names IDEA-20260815-f9e978,
      P(decomp) as a distribution rather than a scalar, and IDEA-20260815-fa56e7, relation-collection
      duplicate accounting, as owned lanes; both are named in discriminated_from because this record
      also insists on a distribution rather than a scalar and also counts duplicates, but the object
      there is index-calculus decomposition over a curve and the counting is of relations, not of
      a prime class. Those two records are the reason this proposal is careful to state its object
      explicitly.
    verdict: 'UNVERIFIED. Nothing about external literature is asserted. Claimed new relative to this
      repository: the accidental base rate beta(X,d,H) as an explicitly named quantity that floors
      every detector''s false-positive rate, counted by exhaustive forward enumeration, together with
      the symmetry-quotiented fibre-size distribution and the forward-backward cross-validation. Assembled
      from known parts: forward enumeration is trivial, prime counting is standard, and the general
      principle that a classifier cannot beat class prevalence is elementary. What is offered is that
      the number is computed for this specific class and made a prerequisite for the campaign''s other
      results.'
  object_first_candidate:
    tracked_object: 'The fibre structure of the forward map Phi(f,m) = f(m) restricted to prime values:
      for each prime in range, the set of admissible witness pairs mapping to it, projected to that
      set''s cardinality. The object followed is the multiset of fibre sizes over the in-class prime
      population, together with its total, which is beta.'
    lossiness: 'Genuinely lossy. Each prime''s fibre, a set of coefficient tuples and bases, is projected
      to a single integer count, discarding which witnesses and all their arithmetic. The count still
      propagates because the operation that matters, enlarging the box by raising H or d, adds witnesses
      to fibres in a way that depends only on the box and not on which witnesses were already there.
      The honest limitation, and it is a real one: the count conflates trivially related witnesses
      with genuinely distinct ones, which is exactly why the symmetry quotient is a required stage
      rather than an optional refinement. Without the quotient the projection would be lossy in the
      wrong direction, throwing away the distinction that carries the meaning.'
    propagation: One step of the target operation is H maps to H+1. The number of admissible coefficient
      tuples grows by a factor ((2H+3)/(2H+1))^(d+1), which for large H is about 1 + (d+1)/H, so the
      in-class population and hence beta grow by approximately that factor, provided the added witnesses
      land on new primes rather than enlarging existing fibres. The measured ratio between the actual
      growth of beta and this predicted factor is therefore a direct measurement of how much of the
      box growth is absorbed by fibre inflation, which is the quantity that decides whether widening
      the class widens detection or merely duplicates it.
    survival_score: The census survives as far as the forward enumeration is affordable, which is
      while (2H+1)^(d+1) times the base range stays within a few times 10^9 evaluations. At d = 3
      and H = 8 with bases up to 2^10 that is about 17^4 times 10^3, roughly 8 times 10^7 evaluations,
      comfortably affordable; at d = 5 and H = 16 it is about 33^6 times the base range, which is
      not. The concrete boundary is therefore a surface in (d,H,X), and the specification enumerates
      only cells inside it and records the rest as out of budget rather than as measured.
  null_object_control: A random set of the same cardinality as the in-class prime population, drawn
    uniformly from the primes below X, subjected to the identical fibre-counting and identical downstream
    analysis. The null must show fibre sizes of exactly one for essentially every element, since a
    random prime has no reason to carry multiple witnesses, and it must reproduce the same population
    size by construction. If the in-class fibre distribution matches the null's, then the class is
    behaving like a random set of the same size, beta is fully explained by counting alone, and no
    structural statement about the class is available from this measurement. That is a complete and
    honest outcome. A second null, the same enumeration with the primality filter replaced by a random
    filter of the same acceptance rate, isolates how much of the fibre structure comes from primality
    rather than from the polynomial box.
  discriminated_from:
  - 'IDEA-20260815-f9e978, P(decomp) as a distribution rather than a scalar, named as an owned lane
    in the batch briefing: shares the methodological insistence on a distribution, but its object
    is decomposition probability in index calculus over a curve. This counts prime class membership
    and its object is a fibre multiset.'
  - 'IDEA-20260815-fa56e7, relation-collection duplicate accounting: also counts duplicates, but of
    relations in a sieve. Here duplicates are witnesses of a prime and the symmetry quotient is algebraic
    rather than combinatorial.'
  - 'The three detector contracts in this batch: each measures a false-positive rate. This measures
    the floor beneath all of them, so it must run first or their numbers cannot be read.'
  - 'The interval-derivation contract in this batch: that bounds the search a detector must perform.
    This counts how many primes are in the class at all. One is about cost, the other about prevalence,
    and they use the same interval for different purposes.'
  assumptions:
  - Exhaustive forward enumeration over the declared box is complete, which is true by construction
    and is verified by re-deriving the pair count analytically and comparing it to the loop count.
  - Miller-Rabin primality is reliable at the tested sizes and the identical routine is used in both
    directions of the cross-validation.
  - The derived trivial symmetries are the only systematic sources of fibre inflation; any residual
    structure appears as unexplained fibre mass and is reported rather than assumed away.
  - The backward membership decision by base sweep is complete over the derived interval, which depends
    on the interval derivation from a sibling contract and is stated as a dependency.
  predictions:
  - metric: counted accidental base rate beta(X,d,H) at X = 2^30, d = 3, H = 8
    direction: different
    minimum_effect: 'no pre-commitment: this is the quantity being measured for the first time in
      this program, and predicting it would be inventing the result the campaign needs'
  - metric: ratio of counted beta to the naive counting prediction
    direction: different
    minimum_effect: within a factor of 3 of 1, since the class is a projection of a box and should
      not behave wildly unlike a random set of the same size
  - metric: median symmetry-quotiented fibre size over in-class primes
    direction: different
    minimum_effect: 1, that is most in-class primes should carry a single essentially distinct witness
  - metric: forward-backward agreement on beta over a random prime subsample
    direction: different
    minimum_effect: agreement within sampling error at 95 percent confidence; disagreement indicates
      an implementation error in one direction
  minimal_test:
    design: 'Fix d = 3, H = 8, and X = 2^30. Enumerate all 17^4 coefficient tuples with nonzero leading
      coefficient, and for each, all bases m from 2 up to the largest with |f(m)| below X, evaluating
      by Horner in exact integers. Keep values that are positive primes below X, accumulating a dictionary
      from prime to its witness list. That single pass yields the in-class prime count, hence beta
      against pi(2^30), and the raw fibre-size distribution. Apply the derived symmetry quotient to
      get the reduced distribution. Then draw 10000 random primes below X and decide membership by
      sweeping the derived admissible base interval, and check that the observed in-class fraction
      matches beta within sampling error. The discrimination needs no model: both directions count
      the same thing, and agreement validates both implementations while disagreement localises the
      bug. Cost is under 10^8 Horner evaluations plus primality tests on a small fraction, minutes
      to tens of minutes in pure Python.'
    controls:
    - The random-prime-set null with identical fibre counting, which must show fibres of size one.
    - The random-filter null replacing primality at the same acceptance rate, isolating primality's
      contribution to fibre structure.
    - The forward-backward cross-validation on a random prime subsample.
    - An analytic pair-count check against the loop count, confirming the enumeration is complete.
    - A symmetry-quotient audit on a hand-checked sample of fibres, confirming the quotient removes
      exactly the derived symmetries and nothing else.
    required_metrics:
    - in-class prime count below X and beta against pi(X)
    - raw and symmetry-quotiented fibre-size distributions
    - ratio of counted beta to the naive counting prediction
    - forward-backward agreement and its sampling interval
    - growth of beta under H and d sweeps with residuals against the predicted factor
    - enumeration completeness check, loop count against analytic pair count
  falsification_conditions:
  - Forward and backward counts of beta disagree beyond sampling error, meaning at least one implementation
    is wrong and neither number may be used.
  - The loop count disagrees with the analytic pair count, meaning the enumeration is incomplete.
  - The symmetry quotient removes more or fewer fibre elements than the derived symmetries account
    for, meaning the quotient is misimplemented.
  - The random-prime null shows fibres larger than one at material rate, meaning the fibre counter
    is broken.
  - Counted beta departs from the naive prediction by orders of magnitude with no identified structural
    explanation, which does not falsify the census but does falsify the naive model and must be reported
    as such.
  confounders:
  - Sign and scaling symmetries inflate raw fibre sizes and would be mistaken for genuine multi-witness
    structure if the quotient were skipped.
  - Restricting to values below X truncates fibres for primes near the top of the range, biasing the
    fibre distribution by size.
  - Small bases produce many values and dominate the enumeration, so the class is not uniformly sampled
    across the base range.
  - The leading-coefficient nonzero condition interacts with the degree definition and can silently
    include degree-lower polynomials if not enforced.
  - Primality testing cost is value dependent, so wall-clock profiling can mislead about where the
    enumeration spends time.
  interpretation_limits:
  - beta is a floor on false-positive rate for correct detectors of this class and nothing more; it
    is not a detectability statement in either direction.
  - beta at the enumerated sizes does not transfer to larger sizes and the contract forbids extrapolating
    it.
  - The fibre distribution describes the class as constructed, and a different parameterisation of
    speciality would give a different distribution.
  - Nothing here concerns any real, published or deployed prime, and no such statement may be derived
    from a census.
  target_complexity:
    time_exponent: No attack exponent is claimed. Enumeration cost is (2H+1)^(d+1) times the base
      range Horner evaluations plus primality tests on the surviving values, so the exponent is in
      the box parameters rather than in log p, and the affordability boundary is stated explicitly
      as a surface in (d,H,X).
    memory_exponent: No attack memory exponent is claimed. The witness dictionary holds one entry
      per in-class prime with its witness list, so memory is O(in-class count times mean fibre size),
      which at the stated parameters is tens of megabytes and is capped by the specification.
    best_known: 'The incumbent is nothing: no record in this repository states a prevalence for any
      structural class of primes, and the detectability question does not mention one. The nearest
      methodological neighbours are IDEA-20260815-f9e978 and IDEA-20260815-fa56e7, which count distributions
      and duplicates in a different setting. No external baseline is asserted.'
    hidden_overhead: 'The symmetry quotient is where the honesty lives and it is easy to skip: raw
      fibre sizes look like structure and are mostly bookkeeping. The affordability boundary is the
      other overhead, since the box grows as (2H+1)^(d+1) and the census silently becomes impossible
      one parameter step beyond where it is comfortable, which invites reporting a small-box beta
      as though it were the class''s beta.'
  dominated_by: n/a for attack claims, none is made. As a measurement, I checked every record the
    greps surfaced plus the two counting-flavoured records named in the batch briefing, IDEA-20260815-f9e978
    and IDEA-20260815-fa56e7, and none counts a prime class prevalence, so no row dominates. Against
    the alternative of estimating beta by sampling primes and deciding membership backward, forward
    enumeration dominates on completeness and is dominated on memory, since sampling is O(1) in storage
    while the census holds the whole witness dictionary; both rows are checked and the cross-validation
    stage runs the sampling method anyway.
  sota_delta: No attack; measurement contribution only. Quantitatively the delta is from an undefined
    and uncomputed quantity to a counted beta with its fibre-size distribution, its symmetry quotient
    and a forward-backward agreement check, at a cost of under 10^8 integer evaluations. Every false-positive
    rate elsewhere in this campaign becomes interpretable only against it, which is the contribution;
    no attack figure changes and none is claimed to.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That beta is countable at d = 3, H = 8, X = 2^30 within budget: about
    0.9, since the box size is derived and the enumeration is straightforward. That forward and backward
    counts agree, validating both implementations: about 0.75, with the risk concentrated in the backward
    interval derivation, which is a dependency on a sibling contract. That the symmetry quotient leaves
    most in-class primes with a single essentially distinct witness: about 0.7. That counted beta
    matches the naive prediction within a factor of three: about 0.5, and a mismatch would be the
    most interesting outcome here because it would say the class is not behaving like a random set
    of its size. That beta at these sizes informs anything at cryptographic sizes: not claimed, and
    the contract forbids it.'
