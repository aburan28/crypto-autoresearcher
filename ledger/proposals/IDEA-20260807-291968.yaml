  - IDEA-20260727-003
  - IDEA-20260806-20f6ab
  - KN-FIND-007
  - KN-OPEN-006
  discriminated_from:
  - 'IDEA-20260727-003: fits a FLOOR under a free decomposition oracle. This record measures the
    matrix''s structure on real harvested relations.'
  - 'H-STR-002: measured one derived scalar (displacement rank alpha) of a relation matrix; DEC-20260727-009
    weakened it. Oversampling, rank profile, weight distribution and memory are untouched by it.'
  - 'KN-OPEN-006: asks whether DESIGNED arithmetic-progression supports give a low-displacement-rank
    matrix. This record measures the supports index calculus actually produces, designed by nothing.'
