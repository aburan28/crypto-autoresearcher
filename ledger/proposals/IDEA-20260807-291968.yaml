idea:
  id: IDEA-20260807-291968
  question_id: RQ-ECDLP-002
  added: '2026-08-07'
  title: 'The relation matrix has never been measured as an object over prime fields, although
    FINDING-PF-IC-001 says the linear-algebra stage DOMINATES the cost: the dominating term of
    the program''s own central negative is an assumption everywhere it is used'
  class: measurement
  claim: 'FINDING-PF-IC-001 states the prime-field index-calculus cost ''is dominated by the |F|-size
    linear algebra over the membership-quotient ring, not by the solving degree''. The only end-to-end
    prime-field index-calculus run in the corpus, EV-SEMAEV-b3db54 at p = 1009, records exactly
    one linear-algebra datum: ''45/54 FB discrete logs solved (Gaussian elimination mod N). Underdetermined
    system (9 FB points unsolvable) ... Adding more relations would fix this.'' That observation
    was never followed up at any p. No record measures, over prime fields, the oversampling factor
    (how many harvested relations before the B x B matrix reaches rank B-1), the row-weight distribution,
    the rank profile as relations accumulate, the measured sparse-solve exponent on real harvested
    matrices, or the matrix''s memory footprint. Every ICEX and ECDLP cost comparison in this
    repository carries an assumed c_LA * B^omega term.'
  mechanism: 'Harvest genuine verified relations at beta = 1/m on toy prime-field curves at bits
    12-24 until rank B-1 is reached, recording the matrix as a first-class artifact rather than
    as an intermediate. The measured quantities are properties of the matrix that the cost model
    already assumes: relations-per-independent-relation, row weight histogram, rank-versus-relations
    curve, peak memory, and the solve exponent against a support-matched random-matrix null of
    the same size and weight. The null is what separates ''this matrix is structured'' from ''sparse
    matrices of this shape behave this way''.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    grep_results:
    - 'IDEA-20260727-003 (priority high, filed 2026-07-27) is the nearest record and was never
      converted: no hypothesis and no experiment cites it as its source. It frames a FLOOR (a
      fitted omega_LA under a free decomposition oracle), not the matrix''s structure -- it does
      not touch oversampling, rank profile, weight distribution or memory.'
    - IDEA-20260806-20f6ab records as forward guidance 'any representation lever on the linear-algebra
      stage, which nobody has attempted'; IDEA-20260806-3b91c7 records 'the relation matrix is
      not obviously chainable and nobody has tried'. Both name the gap inside other proposals;
      neither proposes it.
    conclusion: Named repeatedly as forward guidance, proposed by nobody.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: solving degree, first-fall
      degree, factor-base geometry, summation-polynomial structure -- i.e. every axis this program
      has already concentrated on. The object is the MATRIX.'
    tracked_object: The harvested relation matrix, tracked as the triple (rank, row-weight distribution,
      peak memory) as relations accumulate.
    one_step_propagation_rule: Appending one relation adds one row; rank increases by 0 or 1 and
      the weight histogram updates by one observation. Both are deterministic given the relation.
    newness_score: Nil as mathematics. As a measurement in this corpus it is the dominating term
      of the standing negative, measured for the first time.
  lossy_projection_identifiability_audit:
    projection: the relation set -> (rank profile, weight histogram, memory).
    what_is_discarded: Which factor-base points appear in which relation; the matrix's identity
      is not recoverable from the summary statistics.
    is_it_only_a_change_of_coordinates: 'NO -- the summary is far smaller than the matrix. Honest
      caveat: this is a WEAK object. It can produce cost constants and distributions, never a
      mathematical statement about ECDLP, and the record''s class is measurement precisely for
      that reason.'
    mirror_failure_check: CHECKED. The failure would be summary statistics that are the same for
      every matrix of that shape -- which is exactly what the support-matched random null tests.
      If null and real agree on every statistic, the record's honest output is 'the relation matrix
      is generic for its shape', which is itself a usable cost-model input.
  null_object_control:
    primary_null: A random sparse matrix over Z/N with the SAME dimensions and the SAME row weight
      distribution as the harvested one. Every statistic is reported as real-versus-null. Matching
      nulls mean the cost model may use generic sparse-matrix theory; departures are the interesting
      case and must survive replication.
    secondary_nulls:
    - 'REGRESSION: reproduce EV-SEMAEV-b3db54''s 45/54 at p = 1009 before extending.'
    - 'FORCED VALUE: rank must be exactly B-1 at saturation, never B, because the all-ones relation
      is in the kernel. A run reporting rank B is broken.'
  assumptions:
  - Genuine verified relations can be harvested at bits 12-24 in the existing harness (EV-SEMAEV-b3db54
    shows they can at p = 1009).
  - Certificates for each relation are re-verified independently per docs/claims-and-verification.md,
    so no fabricated relation enters the matrix.
  predictions:
  - metric: oversampling factor (relations harvested per independent relation at saturation)
    direction: higher
    minimum_effect: Any value stably above 1.0 across sizes; the cost model currently charges
      none.
  - metric: measured sparse-solve exponent on harvested matrices versus the support-matched random
      null
    direction: different
    minimum_effect: A difference in fitted exponent outside the null's replication envelope at
      three sizes.
  minimal_test:
    design: At bits 12, 16, 20 and 24 on toy prime-field curves, harvest verified relations until
      rank B-1, logging rank after each relation. Report the five metrics with the random null
      and the p = 1009 regression.
    controls:
    - support-matched random sparse matrix
    - EV-SEMAEV-b3db54 regression
    - rank B-1 forced-value gate
    required_metrics:
    - oversampling factor
    - row-weight histogram
    - rank-versus-relations curve
    - peak matrix memory
    - measured solve exponent with CI
  falsification_conditions:
  - 'Every statistic matches the support-matched null: the relation matrix is generic for its
    shape, the assumed c_LA * B^omega term is justified, and the gap closes on a measurement.'
  - 'Oversampling is ~1.0 and independent of size: the currently uncharged term really is free.'
  - 'Relations cannot be harvested to saturation at bits >= 20 in budget: recorded as censored
    infrastructure, never as evidence about the matrix (AGENTS.md rule 3).'
  confounders:
  - Factor-base size B and the harvest parameter beta interact; hold beta = 1/m fixed and vary
    B only through the field size.
  - Gaussian elimination and sparse solvers have very different memory profiles; report both and
    name the solver.
  - At bits 12 the matrix is small enough that constants dominate any exponent fit.
  interpretation_limits:
  - Toy scale, bits <= 24. No cryptographic-scale claim.
  - A measured c_LA replaces an assumed one in cost comparisons; it is not an attack and moves
    no exponent.
  - Nothing here revises FINDING-PF-IC-001's headline; it measures the term that finding says
    dominates.
  heuristic_assumptions:
  - id: HEUR-RELMAT-1
    statement: Row-weight and rank behaviour at bits 12-24 is directionally representative of
      larger B at matched beta.
    rigorous_support: None.
    validation_plan: Fit across four sizes and report the trend with its CI rather than a point
      value.
  target_complexity:
    time_exponent: Measures the omega in c_LA * B^omega; claims none.
    memory_exponent: Measures peak matrix memory, currently uncharged.
    best_known: Pollard rho at exponent 1/2 for the end-to-end problem.
    hidden_overhead: Relation verification cost, charged explicitly.
    tradeoff_note: A measured omega can move cost comparisons in EITHER direction, including against
      index calculus.
  dominated_by: 'Pollard rho at exponent 1/2. Rows checked across time, memory and data/queries
    before writing: Pollard rho (p^{1/2}, O(1) memory); BSGS (p^{1/2}, p^{1/2}); vOW parallel
    rho (p^{1/2}/w); Semaev index calculus at total exponent ~2.05 per target (FINDING-PF-IC-001,
    toy scale). Queries 0 on every row.'
  sota_delta: ZERO. Deliverable is a measured replacement for the assumed c_LA * B^omega term
    in every ICEX/ECDLP comparison, and the prerequisite for any claim about trading index calculus's
    memory.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the measurement completes at bits <= 20 and yields usable
    constants. 0.35 that any statistic departs from the support-matched null in a way that replicates
    -- structured relation supports are plausible but the program's own KN-FIND-007 (decomposition-yield
    conservation) argues factor-base geometry redistributes rather than creates. 0.05 that a departure
    is large enough to move a cost comparison's direction.
  source_refs:
