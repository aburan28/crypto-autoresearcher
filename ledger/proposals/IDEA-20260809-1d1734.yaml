idea:
  id: IDEA-20260809-1d1734
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    Pairing-friendly primes are polynomials in a seed — quantify what that
    special form gives the sieve, and check whether the deployed estimate uses
    the special variant at all
  class: mechanism
  claim: >-
    Constructions in the BLS and BN families define the prime as a fixed
    low-degree polynomial evaluated at a seed. That is precisely the structure
    the special number field sieve exploits, and specialized tower variants
    exist. The claim is twofold: first, that the special form's advantage for
    the target field can be quantified here as a concrete cost difference at
    calibration sizes; second, that whether a given published security level was
    computed with the special variant or the general one is a determinable fact
    about that paper, and the answer materially changes the number.
  mechanism: >-
    Construct the polynomial pair both ways — general selection versus selection
    exploiting the seed polynomial — at the same calibration parameters, run
    relation collection for both, and measure the yield difference directly
    rather than comparing asymptotic exponents.
  why_not_a_renamed_known_approach: >-
    Special variants of the tower sieve are published and the special form of
    these primes is well known. What this record does is MEASURE the difference
    on this program's own runs at calibration size, and treat "which variant
    does the quoted number use" as an auditable property of each filed source
    rather than an assumption.
  predictions:
  - observable: relation yield per unit sieving time, special versus general selection
    metric: ratio at fixed sieving budget
    predicted: Special strictly better. A ratio of one would mean the seed structure gives nothing at these sizes and would be a strong, surprising negative.
  - observable: for each filed published estimate, whether the special variant was used
    metric: categorical, per source, with the passage cited or 'undetermined'
    predicted: >-
      At least one source will be undetermined from its own text. Undetermined
      is recorded as undetermined and is a finding about the literature's
      reproducibility, not about the curve.
  minimal_test: >-
    At two calibration sizes with seed-polynomial primes of the same shape, run
    both selections and both sieves at equal budget, report the yield ratio, and
    separately audit each filed source for which variant it used.
  controls:
  - 'MATCHED-BUDGET CONTROL: both variants get identical sieving budgets, regions and implementations apart from the selection, or the ratio measures the implementation rather than the mechanism.'
  - 'NON-SPECIAL NULL: repeat with a random prime of the same size that has no seed-polynomial form; the special selection must lose its advantage there, which is what identifies the seed structure as the cause.'
  falsification_conditions:
  - No yield advantage at either calibration size with matched budgets.
  - The advantage persists on the non-special null, proving the measurement is capturing an implementation artifact rather than the structure.
  interpretation_limits: >-
    A yield advantage at calibration size is not a security level. This record
    makes no statement about whether any deployed curve is weaker than quoted,
    and the audit's 'undetermined' cells are statements about documents.
  sota_delta: >-
    No attack. Delta: a measured advantage attributable to seed structure, plus
    a per-source determination of which variant each quoted level assumes.
  dominated_by: Not dominated by any corpus record. GOAL-SNFS-001 owns special-form primes for FACTORING and for the separate question of trapdoor detectability; no transfer of conclusions in either direction.
  estimated_cost: Implementation medium; compute moderate.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for special form / SNFS: GOAL-SNFS-001 only, different question. WEB NOT CHECKED.'
  source_refs:
  - exTNFS and special-variant references -- RECALLED, REQUIRED READS.
  - BLS and BN curve construction papers -- RECALLED, REQUIRED READS.
