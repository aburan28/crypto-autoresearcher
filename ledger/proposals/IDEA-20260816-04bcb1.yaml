idea:
  id: IDEA-20260816-04bcb1
  question_id: RQ-QRE-6dba8c
  added: '2026-08-16'
  title: A logical-layer circuit score is used as a proxy for physical cost, but whether it preserves
    the ordering of two circuits depends on the error-correction model it is quoted from; map the
    region of a named surface-code parameter space where the logical ranking and the physical ranking
    disagree, and report the boundary rather than a number.
  class: theory
  claim: '(A) Every quantum resource statement in this bucket is a model output, and the model has
    two layers: a logical layer that counts gates and qubits, and an error-correction layer that converts
    those counts into physical qubits and time. The imported ALECF score is a pure logical-layer quantity,
    the product of Toffoli count and peak qubit width, and it is used as though it ordered circuits
    the way physical cost would. (B) The claim is that whether it does is a decidable question about
    a named error-correction model, and that the answer is a region rather than a yes or no: for a
    stated surface-code cost function mapping (Toffoli count, peak logical qubits, depth, target logical
    error rate, physical error rate, cycle time, distillation scheme) to (physical qubits, wall-clock
    time), there is a subset of parameter space where the logical product ranks two circuits one way
    and the physical space-time volume ranks them the other, and that subset has a boundary that can
    be computed. (C) The claim is that the two committed ALECF resource vectors, (1316081 Toffoli,
    1152 qubits) and (1423723 Toffoli, 1141 qubits), are a concrete instance: they differ by plus
    8.18 percent in Toffoli count and minus 0.95 percent in peak width, so any physical cost function
    that weights width more than about nine times as heavily as gate count reverses their order, and
    whether a named surface-code model does that is arithmetic. (D) The claim is that the honest deliverable
    is the boundary surface plus a statement of which side each model input pushes toward, including
    at least one direction in which the model flatters the attacker (for instance by charging idle
    logical qubits nothing) and one in which it flatters the defender (for instance by assuming a
    distillation overhead quoted from a single scheme). (E) WHAT IS NOT CLAIMED: no claim that any
    error-correction model is correct, no reproduction of any published headline total, no claim about
    which circuit is actually cheaper on any machine, no timeline, forecast or feasibility statement
    of any kind, and no attack. The output is a boundary in the parameter space of a model that the
    record itself declares to be a model.'
  mechanism: 'STAGE 1: write the cost function explicitly. Implement a surface-code cost map with
    every constant named in code and sourced to a filed entry or derived in the record, taking (T,
    Q, depth, target logical error rate, physical error rate, cycle time, distillation scheme parameters)
    and returning (physical qubits, wall-clock time, space-time volume). Refuse to run on an unsourced
    constant. STAGE 2: define the two orderings. The logical ordering is the ALECF product; the physical
    ordering is space-time volume from STAGE 1. STAGE 3: solve for the boundary. For a fixed pair
    of resource vectors, the set of model parameters where the two orderings disagree is defined by
    a single inequality; sweep the parameter space on a grid and also solve the boundary analytically
    where the cost function permits, reporting both and requiring agreement. STAGE 4: instantiate
    on real vectors. Use the two committed ALECF vectors as one instance and a synthetic population
    as the general case, reporting the disagreement volume as a fraction of the swept parameter box.
    STAGE 5: run the null arm, resource-vector pairs drawn to match the marginals but with the axes
    decoupled, to check that the disagreement region is not simply what any pair of nearby vectors
    produces. STAGE 6: report the boundary, the per-input direction of movement, and an explicit two-sided
    statement of how the model flatters each party.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-QRE-6dba8c in full, including its constraint that every constant must be derived
      or cited to a filed source and its prohibition on dates, timelines and policy recommendations.
      Read the titles and claim openings of all ten proposals referencing it. Read the ALECF README's
      scoring definition and recomputed both committed scores. Grepped ledger/proposals/ for 'surface
      code', 'code distance', 'distillation', 'logical error' and 'space-time'.
    results: 'Three existing records are close and each is distinct. IDEA-20260809-5a9246 measures
      the elasticity of pipeline outputs to the assumed physical error rate, which enters through
      the code distance; that is a sensitivity derivative of one output, whereas this proposal asks
      whether an ORDERING between two circuits is preserved, which is a different functional of the
      same model. IDEA-20260809-5d88bd measures the magic state factory''s share of resources and
      how it moves with the distillation scheme; the distillation scheme appears here only as one
      axis of the parameter box whose effect on ordering is measured, not as a share to be apportioned.
      IDEA-20260809-61bedf argues for reporting space-time volume rather than a qubit-count/runtime
      pair; this proposal takes space-time volume as given and asks where it disagrees with a logical
      product score. IDEA-20260815-f4c398 reproduces a 256-bit headline estimate and ranks assumptions
      by sensitivity, which this proposal explicitly does not do: no headline total is reproduced.'
    verdict: 'UNVERIFIED. Surface-code cost modelling is an active external subject and nothing is
      asserted about its published content, including whether the specific ordering question has been
      posed elsewhere. What is claimed new here is the framing of proxy validity as an order-preservation
      question with a computable boundary, instantiated on this repository''s own two committed ALECF
      resource vectors, with a marginal-matched null and a required two-sided flattery statement.
      Assembled from known parts: surface-code cost functions, space-time volume, grid sweeps, and
      rank-preservation analysis.'
  object_first_candidate:
    tracked_object: 'The ordered pair of resource vectors together with the model parameter point:
      ((T1, Q1, D1), (T2, Q2, D2), theta), where theta ranges over the error-correction model''s input
      space. The tracked quantity is the sign of the disagreement indicator between the logical ordering
      and the physical ordering, followed as theta moves.'
    lossiness: 'The projection is lossy twice over and deliberately so. From a circuit it keeps only
      three integers, discarding structure entirely, which is compatible with the operation because
      the cost map consumes only those integers by construction. From the pair of vectors and theta
      it keeps a single bit, the sign of the disagreement, discarding the magnitudes of both costs;
      that is the aggressive discard, and it is compatible with the operation of interest because
      the question is ordering, not magnitude. What survives and propagates deterministically is the
      boundary: the disagreement bit changes only when theta crosses the zero set of one explicit
      inequality, so the retained bit is piecewise constant with a computable interface, which is
      exactly the structure the experiment reads off.'
    propagation: 'One step of the target operation is moving a single model input, say the physical
      error rate, holding the rest fixed. Acting on the tracked bit, such a step changes nothing until
      theta crosses the boundary surface, at which point the bit flips exactly once if the cost function
      is monotone in that input, or several times if it is not. Monotonicity is therefore itself a
      measurable property of the model and is reported per input: an input whose sweep flips the bit
      more than once has non-monotone influence and any single-point sensitivity quoted for it is
      misleading. That per-input flip count is a second deliverable that falls out of the same sweep.'
    survival_score: 'The structure survives the whole sweep as a well-defined bit and dissolves only
      where the cost function''s own domain of validity ends, for example where the required code
      distance exceeds what the assumed physical error rate can support, or where the distillation
      scheme''s stated regime is exited. Those are nameable walls rather than gradual decay, and the
      experiment reports the fraction of the swept box that lies inside the model''s declared validity
      domain. Concretely, the survival statement takes the form: of the swept parameter box, X percent
      is inside the declared validity domain, and within that part the orderings disagree on Y percent,
      with the boundary described by one inequality.'
  null_object_control: 'The null object is a population of resource-vector pairs whose per-axis marginals
    match the measured population but whose axes are independently drawn, so that the correlation
    between Toffoli count and peak width induced by real circuit design is destroyed. The identical
    boundary computation and disagreement-volume measurement runs on the null pairs over the identical
    parameter box in the same invocation. For the signal arm to mean anything the null must show a
    DIFFERENT disagreement volume: if arbitrary decoupled pairs disagree over the same fraction of
    parameter space, then the disagreement volume measures the geometry of the cost function alone
    and says nothing about circuits, which is a legitimate and reportable finding but a different
    one from the claimed result.'
  discriminated_from:
  - 'IDEA-20260809-5a9246 (elasticity of outputs to the assumed physical error rate via code distance):
    measures a derivative of a single output; this measures whether an ordering between two circuits
    survives, which is a different functional and yields a boundary rather than an elasticity.'
  - 'IDEA-20260809-5d88bd (magic state factory share and its dependence on distillation scheme): apportions
    resources within one estimate; here the distillation scheme is one axis of a box swept for order
    preservation and no share is apportioned.'
  - 'IDEA-20260809-61bedf (report space-time volume instead of a qubit/runtime pair): proposes a reporting
    change; this takes space-time volume as the physical ordering and asks where a logical product
    score disagrees with it.'
  - 'IDEA-20260815-f4c398 (reproduce the 256-bit ECDLP estimate and rank assumptions by sensitivity):
    reproduces a headline total; this contract reproduces no total, quotes no headline number, and
    would run identically if no published estimate existed.'
  - 'The scalarization contract elsewhere in this batch: that one compares scalarizations within the
    logical layer only; this one compares a logical scalarization against a physical cost model, so
    it necessarily carries an error-correction model and its flattery statement.'
  assumptions:
  - A surface-code cost map of the declared form is a legitimate model to reason with, without any
    claim that it is correct; the contract's honesty requirement is that it is named and that its
    constants are sourced or derived.
  - Space-time volume is an acceptable physical ordering for the purposes of this contract; alternative
    physical orderings are a declared variant, not the default.
  - Depth can be assigned to the two committed ALECF vectors only as a swept unknown, because the
    committed artifacts record Toffoli, Clifford, qubits and ops but not depth; depth is therefore
    treated as a parameter and its influence on the boundary reported.
  - The parameter box swept is wide enough to contain the boundary; if it does not, the result is
    that no disagreement occurs in the box, which is reported as such rather than extrapolated.
  predictions:
  - metric: fraction of the swept parameter box, restricted to the model's declared validity domain,
      on which the logical product ordering and the space-time-volume ordering disagree for the two
      committed ALECF vectors
    direction: higher
    minimum_effect: 0.05
  - metric: number of model inputs for which the disagreement bit flips more than once across a monotone
      sweep of that input
    direction: higher
    minimum_effect: 1
  - metric: agreement between the analytically solved boundary and the grid-swept boundary, measured
      as the fraction of grid cells classified identically
    direction: higher
    minimum_effect: 0.98
  - metric: difference in disagreement volume between the measured resource-vector population and
      the marginal-matched decoupled null
    direction: different
    minimum_effect: No pre-commitment to a sign. Whether real circuit design correlates T and Q positively
      or negatively at this scale is unknown to this repository, and the sign of the difference follows
      from that correlation, so pre-committing would be a guess.
  minimal_test:
    design: The cheapest discriminating measurement uses exactly two resource vectors and needs no
      circuits at all. Take the two committed ALECF vectors, (T equal to 1316081, Q equal to 1152)
      and (T equal to 1423723, Q equal to 1141), treat depth as a swept unknown over a declared range,
      and implement the surface-code cost map with all constants named. Sweep a coarse grid over six
      model inputs, classify each grid point by whether the two orderings agree, and record the disagreement
      volume restricted to the validity domain. In the same invocation, solve the boundary inequality
      analytically where the cost map allows and check that the analytic and grid classifications
      agree on at least 98 percent of cells, which is the instrument check. Then repeat the identical
      computation on 200 marginal-matched decoupled vector pairs for the null. The discriminating
      outputs are the disagreement volume, the analytic-versus-grid agreement, and the null comparison.
      Compute is seconds; the work is entirely in writing the cost map with sourced constants and
      refusing to proceed on an unsourced one.
    controls:
    - Marginal-matched decoupled resource-vector pairs as the null population, computed over the identical
      parameter box in the same invocation.
    - Analytic boundary solution cross-checked against the grid sweep, with a declared minimum agreement
      threshold acting as an instrument check.
    - 'Identical-vector control: two identical resource vectors must produce zero disagreement volume
      everywhere, by construction.'
    - 'Dominating-pair control: a vector pair where one dominates the other on every axis must produce
      zero disagreement volume in the entire validity domain, since no monotone physical cost function
      can reverse a dominance.'
    - 'Unsourced-constant gate: the cost map refuses to evaluate if any constant lacks a derivation
      or a filed source, which is a control on the record rather than on the arithmetic.'
    required_metrics:
    - disagreement volume within the validity domain
    - validity-domain fraction of the swept box
    - per-input flip count across monotone sweeps
    - analytic-versus-grid classification agreement
    - null-population disagreement volume
    - boundary inequality in closed form where available
  falsification_conditions:
  - The dominating-pair control shows nonzero disagreement volume, which falsifies the cost map's
    monotonicity and voids the run.
  - The identical-vector control shows nonzero disagreement volume, falsifying the instrument.
  - Analytic and grid boundaries agree on fewer than 98 percent of cells, indicating one of the two
    is wrong.
  - The disagreement volume is zero throughout the declared validity domain, meaning the logical product
    is order-preserving for these vectors under this model over the swept box.
  - The validity domain covers less than 10 percent of the swept box, meaning the box was chosen badly
    and the volume fraction is uninterpretable.
  confounders:
  - Depth is not recorded in the committed ALECF artifacts, so treating it as a swept unknown means
    the disagreement volume mixes genuine model dependence with ignorance about the circuits; the
    contract must report volumes at fixed depth slices as well as integrated.
  - The choice of parameter box determines the volume fraction, so the number is meaningless without
    the box, and a box chosen after seeing the boundary would be circular; the box is therefore pre-registered.
  - Different distillation schemes may have disjoint validity domains, so the swept box may be partitioned
    rather than continuous and volume fractions across schemes are not directly comparable.
  - Space-time volume as the physical ordering already embeds a modelling choice about whether idle
    logical qubits are charged, which is exactly the flattery direction the contract must state rather
    than resolve.
  interpretation_limits:
  - A boundary in a model's parameter space is a statement about the model, not about any machine;
    no conclusion about real physical cost is licensed.
  - No headline resource estimate is reproduced, so nothing here bears on whether any published total
    is correct.
  - The two committed ALECF vectors are used as an arithmetic instance; nothing follows about the
    circuits behind them, whose source is not in this repository.
  - Per RQ-QRE-6dba8c's own constraints, no date, timeline, arrival probability or policy recommendation
    may be derived from this contract, and none is.
  target_complexity:
    time_exponent: No attack exponent is claimed. The contract computes an order-preservation boundary
      for a cost model.
    memory_exponent: No attack memory exponent is claimed. Physical qubit counts appearing in the
      cost map are model outputs for the two given logical vectors and are not attack memory costs.
    best_known: The incumbent is the implicit use of a logical-layer score as a stand-in for physical
      cost, instantiated concretely by the imported ALECF scoring functional. The contract does not
      beat that practice; it measures the region where it fails to preserve order under one named
      error-correction model.
    hidden_overhead: 'The hidden cost is the constant table: writing a surface-code cost map with
      every constant either derived in the record or cited to a filed source is slow, and the unsourced-constant
      gate guarantees that the slow path is the only path. Lower-order terms hide in the depth axis,
      which the committed artifacts do not record at all, so a substantial part of the swept box represents
      ignorance rather than model uncertainty and that must be reported separately or the volume fraction
      flatters the analysis.'
  dominated_by: n/a (no result claimed). I checked the committed frontier rows in this bucket, the
    two ALECF logical vectors (1316081, 1152) and (1423723, 1141), and this contract adds no circuit
    and no row to either. No attack, algorithm or speedup is proposed, so there is no time/memory/data
    frontier on which it could be dominated.
  sota_delta: 'no attack; conceptual/measurement contribution only. The only quantitative comparison
    is internal to the two given vectors: a plus 8.18 percent difference in Toffoli count against
    a minus 0.95 percent difference in peak width, so a physical cost function must weight width more
    than roughly nine times as heavily as gate count to reverse the logical ordering, and whether
    the named model does so is what the sweep decides.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part (C), the arithmetic that the two committed vectors differ by plus
    8.18 percent and minus 0.95 percent and therefore require roughly a nine-to-one weighting to reverse:
    0.95, since it is recomputed from committed files. Part (B), that a disagreement region exists
    and has a computable boundary for some named surface-code model within a reasonable parameter
    box: 0.6, with the main risk being that plausible models weight gate count so heavily that no
    realistic box contains the boundary, which would itself be the reportable answer. That the analytic
    and grid boundaries agree above 98 percent: 0.8. That the null population differs measurably in
    disagreement volume: 0.4. That the constant-sourcing gate can actually be satisfied in this environment,
    where external literature is unreachable and constants must therefore be derived in-record: 0.45,
    which is the largest practical risk to the contract.'
