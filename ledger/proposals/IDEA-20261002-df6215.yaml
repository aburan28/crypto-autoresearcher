  title: >-
    AT MATCHED WALL BUDGET, DOES NAGAO DISJOINT-COSET YIELD BEAT CHAINED S_3
    ON TOY BINARY CELLS? On n∈{17,19,23} with frozen V (dim ℓ∈{3,4}), compare
    relations_per_charged_second of Nagao disjoint-coset vs chained S_3
    against a frozen ratio ρ.

  class: heuristic_validation

  claim: >-
    RQ-BINSTD names Nagao's disjoint-coset decomposition and Semaev's chained
    S_3 as alternative relation sources, but recent ideation raced S_4 vs two
    S_3 (IDEA-20261001-161102) and n−1 vs two S_3 (IDEA-20261002-5ebfcd) —
    not Nagao vs chained S_3 at a matched wall budget. CLAIM: for each
    admitted toy cell n∈{17,19,23} with frozen V of dim ℓ∈{3,4}, across
    N_rep seeded budgets B, the ratio
    R := (rels/sec)_Nagao / (rels/sec)_chainedS3 satisfies R ≥ ρ with ρ
    frozen at Stage 0 — OR the race fails and is recorded as
    chained-S3-still-faster at this scale. CLAIM TIER: heuristic_validation.
    NO break. NO exponent. NO n≥131 transfer. Distinct from 161102 (S_4),
    5ebfcd (n−1), 3f2d06 (crossbred vs XOR-SAT), and 5c936b (Karabina vs
    XOR-SAT).

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V}; Operation A: Nagao
    disjoint-coset decomposition attempts within wall budget B; Operation B:
    chained S_3 attempts within the same B; Observable: relations per
    charged second and their ratio R. Trichotomy: Class I instrument
    (relation-source race). Lossy-projection: R discards which cosets
    produced relations; null is a matched random-search baseline that burns
    the same B with no algebraic decomposition (yield ≈ 0). OFF-LIMITS:
    S_4 vs two S_3 (161102); n−1 vs two S_3 (5ebfcd); PDP engine races
    (3f2d06/5c936b). WHAT IS NEW: a frozen ρ race of Nagao disjoint-coset
    vs chained S_3 on RQ-BINSTD toys.

