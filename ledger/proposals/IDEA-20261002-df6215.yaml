  heuristic_assumptions:
    - id: HEUR-BINSTD-df6215-H1
      formal_statement: >-
        FORALL n∈{17,19,23} and ℓ∈{3,4}:
        (rels/sec)_Nagao / (rels/sec)_chainedS3 ≥ ρ with ρ frozen at Stage 0
        across N_rep seeded budgets B.
      random_model_justification: >-
        Rigorous: Nagao partitions the search into disjoint cosets so that
        each successful decomposition is unique under the partition, while
        chained S_3 reuses S_3 oracles in a tree; their attempt costs and
        success probabilities differ. Classical: if coset filtering removes
        wasted collisions faster than the extra bookkeeping costs, Nagao
        wins on rels/sec; if bookkeeping dominates at toys, the band fails.
        The ρ band is a pre-registered transfer hypothesis — not a claim
        that either source beats rho.
      supporting_results:
        - KR-IC-5a43e5
        - KR-IC-081a58
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        R < ρ at a completed (n,ℓ) cell (chained-S3-still-faster), OR either
        source absent (infrastructure stop), OR zero relations on both arms
        after budgeted B (inconclusive; expand B or stop).

  predictions:
    - metric: nagao_over_chained_rels_per_sec_ratio
      direction: lower_bounded
      minimum_effect: '≥ ρ at each (n,ℓ) cell'
    - metric: relations_per_charged_second_each_arm
      direction: recorded
      minimum_effect: 'both arms report rels/sec under same B'
    - metric: null_random_search_yield
      direction: near_zero
      minimum_effect: 'null yield ≈ 0 under same B'

