idea:
  id: IDEA-20260816-f05ef2
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: 'Grinding as a counted object: with a budget of G counter values a forger does not obtain
    G fresh uniform challenges but the IMAGE of a fixed function on G points, so measure that image''s
    coverage, its repeat structure and the realized maximum-over-image, against the fresh-uniform
    model the accounting assumes.'
  class: measurement
  claim: '(A) THE GRINDING MODEL IS A COUPON-COLLECTOR MODEL, NOT A FRESH-SAMPLE MODEL. A forger grinding
    a counter c evaluates a fixed function ch = H(prefix, c) for c in a budget of G values. What the
    forger obtains is the IMAGE of that map, a multiset of size G drawn with replacement from the
    challenge space of size C. The accounting practice that charges the forger G attempts and credits
    G independent trials is exactly right in the limit G much smaller than C and increasingly wrong
    as G approaches C. Part (A) claims the relevant quantity is the expected number of DISTINCT challenges,
    C times (1 minus (1 minus 1/C) to the power G), and that the relative shortfall against G exceeds
    one part in a hundred once G exceeds C/50. (B) THE SHORTFALL IS MEASURABLE WITH A REAL HASH AND
    MATCHES THE IDEAL BALLS-IN-BINS PREDICTION OR IT DOES NOT. Part (B) claims that with SHAKE-256
    as the challenge derivation, the measured distinct-count, the collision multiplicity histogram
    and the maximum bin occupancy all match the balls-in-bins prediction to within sampling error
    at every tested (C, G), and that any deviation is attributable to a NAMED implementation feature
    of the derivation, such as rejection sampling or modular reduction bias, rather than to the hash.
    (C) THE OBJECT IS PARADIGM-LEVEL. Nothing here depends on syndrome decoding, AES or MQ; the challenge
    space enters only as its cardinality and the derivation only as a function to be evaluated. Any
    effect measured belongs to the Fiat-Shamir-with-grinding paradigm shared by the whole family.
    (D) WHAT IS NOT CLAIMED. No forgery, no break, no speedup, no security consequence, and no claim
    that any scheme''s grinding budget is mis-set, since no specification has been read and the grinding
    parameters swept here are declared illustrative. It is NOT claimed that a coverage shortfall helps
    an attacker: a shortfall reduces the forger''s distinct trials, which if anything favours the
    defender, and the record refuses to present it as an attack. It is also NOT claimed that SHAKE-256
    has any deviation from uniformity; the run measures, and the expected outcome is agreement.'
  mechanism: 'STAGE 1 fixes a challenge space of cardinality C and a derivation ch = reduce(SHAKE-256(prefix,
    c)) with the reduction rule declared explicitly, both the biased modular form and a rejection-sampling
    form, because the two are the named candidate sources of deviation. STAGE 2 grinds: for each of
    many independent prefixes, evaluate the derivation at c equal to 0 through G-1 and record the
    resulting multiset. STAGE 3 measures the counted state: number of distinct challenges, the multiplicity
    histogram, the maximum bin occupancy, and the empty-bin fraction. STAGE 4 compares against the
    exact balls-in-bins expectations, which are closed-form and computed in exact rational arithmetic,
    and reports standardized deviations. STAGE 5 runs the null object: the identical measurement pipeline
    fed by a declared-seed pseudorandom generator emitting uniform values in the same range, bypassing
    the hash entirely. The null must reproduce the balls-in-bins expectations; if it does not, the
    measurement pipeline is broken and no statement about the hash arm is admissible. STAGE 6 runs
    the second null: a deliberately BIASED derivation with a known, hand-computable bias, which the
    pipeline must detect at the declared sensitivity. A pipeline that returns clean results for the
    uniform null but fails to flag the known-biased null has no detection power, and reporting agreement
    from it would be meaningless. STAGE 7 sweeps G/C from 1/1000 to 4 so the regime where the fresh-sample
    model is exactly right and the regime where it visibly fails are both inside the same figure,
    with the crossover read off rather than asserted.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: grinding, Fiat-Shamir, soundness error, repetition,
      MPCitH. Read titles and class of IDEA-20260805-bf6448, IDEA-20260808-95a21c, IDEA-20260808-e8586d,
      IDEA-20260805-7abf04, IDEA-20260731-002, IDEA-20260805-59fa23. Read RQ-WFS-e776b6 in full, including
      its grinding-curve target and its constraint that no third-party system be examined.'
    results: IDEA-20260805-bf6448 computes the interior optimum of a two-strategy forgery cost and
      asks whether the grinding term is charged, in exact rational arithmetic and with zero compute.
      IDEA-20260808-e8586d computes the optimal multi-stage forgery split including grinding, treating
      non-convexity in the grinding parameter. IDEA-20260808-95a21c argues the per-attempt charge
      should be a last-block hash rather than a full transcript hash, i.e. it revises the COST of
      an attempt. All three treat the number of attempts as delivering that many effective trials.
      No record was found measuring the IMAGE of the derivation under a finite counter budget, its
      collision multiplicity, or the G-over-C crossover. RQ-WFS-e776b6 explicitly names a measured
      grinding curve as a target and no proposal was found filling it.
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; balls-in-bins analyses of
      grinding may well be standard there. Assembled from known parts: coupon collector, balls-in-bins
      occupancy, and hash-output uniformity testing are all elementary and long established. Claimed
      new relative to THIS repository only: treating the grinding counter''s image as the tracked
      counted object and measuring the crossover where the fresh-sample accounting stops describing
      it, with a known-biased null that gives the pipeline demonstrated detection power rather than
      assumed power.'
  object_first_candidate:
    tracked_object: 'The multiset of challenges produced by the derivation over the counter budget:
      M(prefix, G) = multiset{ H(prefix, c) : c in 0..G-1 }, followed as G increases by one.'
    lossiness: Genuinely lossy. The multiset discards which counter produced which challenge, the
      prefix content, the hash internal state, and all ordering; it retains only occupancy. It propagates
      because the accounting quantity of interest, the forger's number of effective distinct trials
      and hence the maximum over trials of any success indicator, is a function of occupancy alone.
      The discard is compatible with the target operation because incrementing the budget adds one
      ball to one bin regardless of anything discarded. If instead one tracked the full counter-to-challenge
      list, nothing would be discarded and the object would be a change of coordinates; occupancy
      is strictly coarser and that is what makes it an object.
    propagation: 'One step of the target operation is one additional grinding attempt. Under it the
      multiset gains one element sampled, under the ideal model, uniformly from the challenge space,
      so occupancy performs a Polya-free balls-in-bins walk: distinct-count increases by one with
      probability equal to the current empty fraction and stays put otherwise. The whole measurement
      is a test of whether the real derivation walks that way.'
    survival_score: The fresh-sample description survives while the empty fraction is near one, and
      dissolves as it decays. Concretely the run reports the G/C ratio at which the measured distinct-count
      falls below G by one part in a hundred, by one part in ten, and by half, giving three named
      dissolution points instead of one adjective. Under the ideal model these are approximately G/C
      equal to 0.02, 0.21 and 1.59, and the run reports the measured values against them.
  null_object_control: 'Two nulls, both executed in the same invocation. NULL-UNIFORM: the identical
    occupancy pipeline fed by a declared-seed pseudorandom uniform generator instead of the hash.
    It must reproduce the balls-in-bins expectations within sampling error; if not, the pipeline measures
    itself and the hash arm is void. NULL-BIASED: the identical pipeline fed by a derivation with
    a hand-computed known bias of a declared magnitude. It must be FLAGGED by the same statistics
    at the declared sensitivity; if it is not, the pipeline has no detection power and an agreement
    result from the hash arm carries no information. Both nulls are required for the signal arm to
    mean anything, and the second is the one usually omitted.'
  discriminated_from:
  - 'IDEA-20260805-bf6448, grinding slack as the interior optimum of a two-strategy cost: a zero-compute
    exact-rational audit of whether a cost term is charged. This evaluates a real derivation many
    times and measures occupancy; no cost optimum is computed.'
  - 'IDEA-20260808-e8586d, optimal multi-stage forgery split with a non-convex grinding parameter:
    an optimisation over stage boundaries. The number of attempts is its decision variable; here the
    number of attempts is the independent variable and the effective distinct trials is the measured
    output.'
  - 'IDEA-20260808-95a21c, per-attempt cost as last-block versus full-transcript hashing: revises
    the price of an attempt. This record leaves the price entirely alone and revises the yield.'
  - A generic hash uniformity test. That asks whether the hash is uniform; this asks how far the fresh-sample
    ACCOUNTING abstraction tracks a finite image, and would produce the same crossover curve even
    for a perfectly uniform hash, which is precisely why the uniform null is the control and not the
    target.
  - RQ-WFS-e776b6's own state-restoration grinding target. That measures an attack cost against a
    reference protocol; this measures a combinatorial property of the derivation with no protocol
    attached and no forgery attempted.
  assumptions:
  - The challenge derivation is a deterministic function of prefix and counter. Derivations that consume
    additional entropy are outside scope and are named as such.
  - SHAKE-256 is available in hashlib. Measured availability is checked at Stage 0 and the run halts
    if absent rather than substituting silently.
  - The challenge space is a set of cardinality C with a declared reduction from hash output. Two
    reductions, biased-modular and rejection, are both run because the choice is a named candidate
    confounder rather than a detail.
  - Prefixes are independent across trials, so trial-level statistics can be pooled. Enforced by generating
    prefixes from a declared seed with no shared structure.
  - Balls-in-bins closed forms are the correct ideal reference. They are computed in exact rational
    arithmetic and checked at small C against brute-force enumeration.
  predictions:
  - metric: relative shortfall of measured distinct-count against G at G/C equal to 0.02
    direction: higher
    minimum_effect: 0.01
  - metric: standardized deviation of measured distinct-count from the balls-in-bins expectation,
      hash arm
    direction: lower
    minimum_effect: 3.0
  - metric: detection flag on the known-biased null at the declared bias magnitude
    direction: higher
    minimum_effect: 1
  - metric: difference in measured occupancy statistics between biased-modular and rejection reductions
      at C not a power of two
    direction: higher
    minimum_effect: 'refuse to pre-commit a magnitude: the modular bias depends on the exact ratio
      of hash output range to C, which is a swept parameter, so a single forced number would be arbitrary'
  minimal_test:
    design: Fix C equal to 65537, a prime so that modular reduction bias is nonzero and computable.
      Take 2000 independent prefixes from a declared seed. For each, grind counters 0 through G-1
      for G in a geometric ladder from 2^6 to 2^19, evaluating ch equal to SHAKE-256(prefix, c) reduced
      by both rules. Record distinct-count, multiplicity histogram, maximum occupancy and empty fraction
      at each G. Compute exact balls-in-bins expectations in Fractions and report standardized deviations.
      Run NULL-UNIFORM and NULL-BIASED through the identical pipeline in the same invocation, with
      the biased null constructed to overweight one residue by a declared factor. Read the three dissolution
      points off the distinct-count curve. This is a few core-minutes, involves no protocol, no witness
      and no forgery, and yields a crossover curve plus a demonstrated detection sensitivity in one
      artifact.
    controls:
    - 'NULL-UNIFORM: declared-seed uniform generator through the identical occupancy pipeline.'
    - 'NULL-BIASED: derivation with hand-computed known bias, which the pipeline must flag.'
    - Two reduction rules, biased-modular and rejection, run at identical (C, G) so the reduction
      is separated from the hash.
    - C a power of two versus C prime, where modular bias is exactly zero in the first case by construction.
    - 'Small-C brute force: at C equal to 16 and G up to 32, enumerate the exact occupancy distribution
      and check the closed forms against it.'
    required_metrics:
    - distinct-count mean and variance per (C, G, reduction, arm)
    - multiplicity histogram
    - maximum bin occupancy
    - empty-bin fraction
    - standardized deviation from balls-in-bins expectation
    - the three dissolution G/C ratios
    - detection flag status on NULL-BIASED
  falsification_conditions:
  - NULL-UNIFORM fails to reproduce the balls-in-bins expectations, voiding the pipeline.
  - NULL-BIASED is not flagged at the declared bias, showing the pipeline has no detection power and
    making any agreement result uninformative.
  - The measured distinct-count shortfall is below one part in a hundred at G/C equal to 0.02 even
    in the uniform null, falsifying the closed-form reference rather than the hash.
  - Small-C brute force disagrees with the closed forms.
  - The biased-modular and rejection reductions are indistinguishable at C prime with a large output-range
    ratio, falsifying the claim that the reduction rule is a named separable confounder.
  confounders:
  - Prefix structure inducing correlation across trials. Mitigated by independent declared-seed prefixes
    and by reporting per-prefix as well as pooled statistics.
  - The reduction rule producing all the observed deviation while being read as a hash property. Mitigated
    by running both rules at identical parameters and by the power-of-two C control where modular
    bias vanishes.
  - Counter encoding length changing the hash input block structure across the G ladder. Mitigated
    by fixing a constant-width counter encoding across all G.
  - Pooling across G values with different sample counts, which would bias variance estimates. Mitigated
    by fixing the prefix count and reporting per-G separately.
  interpretation_limits:
  - A coverage shortfall is an accounting observation about effective distinct trials. It is NOT an
    attack and, if anything, reduces a forger's yield; the record forbids reading it as a weakness.
  - Results describe the declared derivation and reduction rules at the declared C and G, not any
    scheme's actual grinding construction, which has not been read.
  - Agreement of the hash arm with the ideal reference is a statement bounded by the demonstrated
    sensitivity of NULL-BIASED, and is reported with that sensitivity attached rather than as unqualified
    uniformity.
  - No protocol, witness, signature or forgery exists anywhere in this run, so nothing here bears
    on any scheme's soundness.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs O(prefixes times G) hash evaluations.
    memory_exponent: No attack exponent is claimed. Memory is O(C) counters per prefix batch, bounded
      by the declared C ladder.
    best_known: The incumbent is the fresh-uniform-trial accounting used in grinding cost models,
      which within this repository appears in IDEA-20260805-bf6448, IDEA-20260808-e8586d and IDEA-20260808-95a21c.
      No external incumbent is asserted.
    hidden_overhead: 'The lower-order term is the counter encoding and its effect on hash input blocks,
      which is invisible in the accounting and is fixed by fiat here. Human cost hides in the known-biased
      null: constructing a bias of exactly known magnitude that the pipeline should detect is more
      work than the signal arm.'
  dominated_by: n/a (no result claimed). Every frontier row was considered across time, memory and
    query axes; this record places no point on any of them because it attempts no forgery and solves
    no instance.
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), the coupon-collector shortfall exceeding one part in a hundred
    once G exceeds C/50: 0.95, this is arithmetic and the only risk is an off-by-one in the threshold.
    Part (B), that a real SHAKE-256 derivation matches balls-in-bins to within sampling error: 0.85,
    with the residual risk sitting entirely in the reduction rule rather than the hash. That the biased-modular
    versus rejection difference is detectable at the declared sample sizes: 0.6. Part (C), that the
    object is genuinely paradigm-level: 0.9, since nothing in the design touches any relation. Part
    (D) is scoping and carries no probability.'
