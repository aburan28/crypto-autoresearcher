idea:
  id: IDEA-20261006-f6419e
  question_id: RQ-CLGRP-66ab7f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The only reduced form of discriminant -91 with leading
    coefficient 1 is (1, 1, 23)
  class: control
  claim: >-
    Use the reduction convention for positive-definite binary
    quadratic forms: |b| <= a <= c, and if |b| = a or a = c then
    b >= 0. Let F be the set of reduced primitive forms of
    discriminant -91. The claim is that (1, 1, 23) is in F and
    that it is the only form in F with leading coefficient 1.
    The opposite form (1, -1, 23) is not in F. No class number is
    asserted, and no index-calculus cost is asserted. If (1, 1, 23)
    is rejected by the convention, the claim is false.
  mechanism: >-
    The tracked object is the set of reduced forms with leading
    coefficient 1. The representation is the triple (a, b, c) of
    integers. The operation is the reduction convention, not
    composition. One-line reason: opposite forms (a, b, c) and
    (a, -b, c) are one class, and the sign rule keeps one of them.
    Lossy-projection test: the projection keeps the forms with
    a = 1 and discards every other reduced form. The cardinality
    of that slice is the output. Composition is not evaluated.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega of
        the square root of the group order. A form list is not
        that algorithm, and the class group is a different group.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over prime fields does not beat
        generic methods. This record builds no summation polynomial.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  assumptions:
    - Discriminant -91 is fixed. No other discriminant is scored.
    - Primitive means gcd(a, b, c) = 1.
    - The sign rule b >= 0 when |b| = a is part of the claim, not an optional normalisation.
  predictions:
    - metric: number of reduced forms with leading coefficient 1
      direction: lower
      minimum_effect: exactly 1
    - metric: indicator that (1, 1, 23) is reduced
      direction: higher
      minimum_effect: exactly 1
  minimal_test:
    design: >-
      Enumerate the integers a, b, c with a > 0, gcd(a, b, c) = 1,
      b^2 - 4*a*c = -91, and the reduction inequalities. Count the
      forms with a = 1. Check that (1, 1, 23) meets the inequalities
      and that (1, -1, 23) does not. Record the list of forms with
      a = 1.
    controls:
      - >-
        (1, -1, 23) has the same discriminant and is rejected by
        b >= 0. Accepting it voids the convention.
      - >-
        The form (1, 0, 23) does not have discriminant -91.
        Accepting it voids the discriminant check.
      - >-
        A form with gcd(a, b, c) > 1 is not primitive. Counting one
        voids the run.
    required_metrics:
      - the list of reduced forms with a = 1
      - whether (1, 1, 23) is reduced
      - whether (1, -1, 23) is rejected
  falsification_conditions:
    - A second reduced primitive form of discriminant -91 has leading coefficient 1.
    - (1, 1, 23) fails the reduction inequalities.
    - (1, -1, 23) is accepted as reduced.
  confounders:
    - >-
      Dropping the sign rule and counting both opposite forms makes
      the count 2 and is not this convention.
    - >-
      Imprimitive forms of a different discriminant can show a = 1
      and are not in F.
    - >-
      The class number, the size of all of F, is not the metric.
      Reporting only that integer does not score the claim.
  interpretation_limits:
    - >-
      One principal form does not give an index-calculus cost and
      does not anchor a deployed discriminant.
    - >-
      The result is discriminant -91 only. It does not say that
      every fundamental discriminant has a unique reduced form of
      leading coefficient 1.
    - >-
      No exponent moves. A list of triples is not a runtime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Under the stated reduction convention there is exactly one
        reduced primitive form of discriminant -91 with leading
        coefficient 1, and that form is (1, 1, 23). The convention
        is a normalisation, not a distribution on class groups.
      rigorous_support: >-
        The discriminant identity 1 - 4*1*23 = -91 is arithmetic
        and is checked in the test. KR-RHO-13bf67 and KR-IC-5931ee,
        opened in this session, do not list forms of discriminant
        -91. Genus theory is not used. No file opened here proves
        uniqueness of the reduced form.
      validation_plan: >-
        The quantity sampled is the set of reduced primitive forms
        with a = 1 at discriminant -91, one discriminant, the full
        set rather than a sample. The comparison is the cardinality
        against 1 and the identity of the form against (1, 1, 23).
        The tail check is whether any accepted form has a > 1 and
        is then wrongly counted in the a = 1 slice. The parameter
        is discriminant -91. Transfer assumption: none. The count
        is not scaled to a cryptographic discriminant.
  target_complexity:
    time_exponent: >-
      unchanged. No discrete-logarithm exponent in the class group
      is stated. KR-RHO-13bf67 is the generic exponent 1/2 on a
      prime-order group, which this form list is not.
    memory_exponent: >-
      unchanged. The output is a short list of integer triples.
    best_known: >-
      KR-IC-5931ee, the prime-field Semaev lower bound, which does
      not apply to this form, and KR-RHO-13bf67. Neither row is
      improved.
    hidden_overhead: >-
      None. No o(1) in an exponent is claimed.
    tradeoff_note: >-
      No time-memory tradeoff. Storing one form does not replace a
      relation matrix.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-IC-5931ee
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The row is the generic square-root bound for a prime-order
          group. This record outputs one reduced form at discriminant
          -91 and does not run a generic algorithm. The exponent
          delta is zero.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: orthogonal
        delta: >-
          The row says naive Semaev index calculus over prime fields
          does not beat generic methods. This record builds no
          summation polynomial. The exponent delta is zero.
    searched:
      corpus_grep:
        - discriminant -91
        - "(1, 1, 23)"
        - question_id: RQ-CLGRP-66ab7f
      web: []
      blocked: []
  dominated_by: >-
    Dominated as an algorithm by generic discrete log at exponent
    1/2 (KR-RHO-13bf67) on any prime-order group, and by the
    prime-field Semaev bound KR-IC-5931ee on elliptic curves. A
    single reduced form beats neither row. The class-group
    index-calculus cost model is not measured here.
  sota_delta: >-
    Zero change to the 1/2 exponent. The predicted gap is a count
    of 1 against a count other than 1, for reduced forms of
    discriminant -91 with leading coefficient 1.
  proof_search_map:
    not_applicable_reason: >-
      This is one form at one discriminant. It does not propose a
      class-number theorem, an index-calculus bound, or a closure
      of genus theory.
