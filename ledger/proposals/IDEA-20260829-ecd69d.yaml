  novelty_screen:
    method: >-
      Retrieval this session was Grep over the repository plus first-hand reads;
      the crypto-kb MCP index's availability was not re-checked and is not
      relied on. Grep of ledger/proposals (glob *MLKEM*) for
      `re-encrypt|reencrypt|decrypt|message bit|Compress|Decompress|coins`,
      case-insensitive: NO MATCHES across all eleven filed RQ-MLKEM-002
      proposals. Read in full or in their claim/mechanism/object blocks this
      session: RQ-MLKEM-002, RQ-MLKEM-001, RQ-MLKEM-003, IDEA-20260724-001,
      IDEA-20260724-002, IDEA-20260805-1beeca, IDEA-20260805-3c957e,
      IDEA-20260805-ee2018, IDEA-20260821-121612, IDEA-20260821-13b667,
      IDEA-20260821-25d3ca, IDEA-20260828-033cb3, IDEA-20260828-40db79,
      IDEA-20260828-edec21, EV-MLKEM-005 (full), and the committed
      RUN-MLKEM-007 summary.json (full) and raw.json (lines 374-570 only).
      No web retrieval was performed for this record; FIPS 203 was not fetched.
    results: >-
      EV-MLKEM-005 states the mechanism in a single clause and gives the 20/9/3
      partition as an observation; it derives nothing and predicts nothing.
      IDEA-20260821-13b667 builds the lane's containment law on the MUTATION
      support and states its own domain as OR-of-XOR accumulates, never
      considering that the second operand of the Algorithm-18 comparison is
      itself a function of the mutation. IDEA-20260805-3c957e and -1beeca use
      L = 32*(du*k + dv) as a LENGTH identity only and never use du, dv as
      bit-packing parameters. No record in this repository mentions
      ByteEncode_dv bit weights, message-bit stability, or the FO transform as
      a filter on probe power. Outside the repository, the general fact that
      FO re-encryption rejects ciphertexts that decrypt differently is
      textbook, and the general sensitivity of Kyber's message bits to
      compressed-coefficient perturbations is the standard basis of published
      decryption-failure and plaintext-checking-oracle literature; NO SEARCH
      for that literature was performed this session and no external novelty is
      claimed. A reviewer with retrieval should chase it, because the
      arithmetic here is elementary and may well be written down somewhere as
      an attack primitive rather than as an instrument-power statement.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: treating the FO
      re-encryption as a second, comparator-independent silent-set filter T;
      deriving T's closed form on c2 from the ByteEncode_dv bit weight; the
      forced residue classes i = 1 mod 5 (reject) and i = 4 mod 5 (coin) at
      ML-KEM-1024; the resulting forced 7/19/6 partition of the archived silent
      tail and its consistency with EV-MLKEM-005's 20/9/3; the qualitatively
      opposite dv = 4 prediction; and the correction
      P_hit = Pr[D subset of (S intersect T)] to the lane's decapsulation-level
      power form. ASSEMBLED FROM KNOWN PARTS: the length identity is
      IDEA-20260805-3c957e's; the containment law is IDEA-20260821-13b667's;
      the archived numbers are EV-MLKEM-005's and RUN-MLKEM-007's; the FO
      transform's re-encrypt-and-compare shape and the ByteEncode/Compress
      definitions are FIPS 203's and are RECALLED, not fetched.

  object_first_candidate:
    tracked_object: >-
      T, THE MESSAGE-STABILITY SET: T = {i in [0, L) : the probe at index i
      leaves the decrypted message m' equal to m}, together with its
      key-independent certificate, the bit-weight map
      b(i) = ((8*(i - |c1|)) mod dv) defined on the c2 region. What is followed
      through the computation is not a set of comparator byte positions but the
      map from a probe's byte index to the ARITHMETIC WEIGHT of the coefficient
      bit it disturbs.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens per
      inventor-protocol section 1: (a) the comparator's silent set S and its
      size, profile and periodicity (IDEA-20260805-1beeca, -ee2018); (b) the
      length residue L mod w (IDEA-20260805-3c957e); (c) the generator's
      difference support D and its containment law (IDEA-20260821-13b667);
      (d) compiled-artifact stride and coverage determinacy
      (IDEA-20260821-121612, IDEA-20260828-033cb3); (e) downstream primitives,
      select coverage and finalize value maps (IDEA-20260828-40db79, -edec21);
      (f) control-arm wiring and baseline-invisibility (IDEA-20260724-001,
      -002); (g) every cryptanalytic and physical-side-channel lens, excluded
      by RQ-MLKEM-002. S enters this record only as the set T is intersected
      with, never as the thing tracked.
    lossiness: >-
      Genuinely lossy, and lossy in a direction no prior object in this lane
      uses. The full state at an Algorithm-18 probe is (dk, c, i, delta, the
      whole re-encryption arithmetic). The projection retains only the integer
      b(i) in [0, dv) -- the intra-coefficient bit index the probe disturbs --
      discarding the key, the message, the noise polynomial, the affected
      coefficient's identity, and the sign of the perturbation. The fibre is
      enormous and non-singleton: all 256/dv-many byte offsets sharing a
      residue, across every key and every message, map to one value of b, and
      the archived data realizes at least seven distinct byte indices in the
      single fibre b = 4. It is not a change of coordinates: the probe index i
      is NOT recoverable from b, and neither is anything about the key.
      COMPATIBILITY with the target's operation is exactly where the projection
      earns its keep and exactly where it fails, and both are stated in
      advance. It propagates deterministically for b = dv - 1 (a shift of q/2
      flips the codeword unconditionally) and for small b (a shift below the
      noise-to-boundary margin never flips it); it does NOT propagate
      deterministically at b = dv - 2, where the shift lands on the decision
      boundary and the discarded information -- the sign of the decryption
      noise -- is exactly what decides the outcome. That is a declared,
      located, measurable failure of the projection at one residue class, not a
      caveat: the record predicts a coin there rather than a value.
    propagation: >-
      One step of the operation of interest is "apply the probe, decapsulate,
      observe accept or reject". The law is:
      probe at c2 offset t flips bitstream bit 8t + e (for xor of 2^e), hence
      coefficient floor((8t+e)/dv) at intra-coefficient bit b = (8t+e) mod dv,
      hence perturbs v by 2^b * q/2^dv, hence flips that message bit iff the
      shift crosses the Compress_1 decision boundary. Composing with the
      comparator: accept iff (message unchanged) AND (i in S). Deterministic
      except at the single residue class b = dv - 2.
    survival_score: >-
      Survives two steps and dies at a stated third. Step 1, byte index to
      coefficient bit weight: survives exactly, by the ByteEncode packing rule.
      Step 2, bit weight to message-flip verdict: survives at b = dv - 1 and at
      b <= dv - 3, dies at b = dv - 2 where the answer depends on discarded
      state -- and this record predicts a coin rather than pretending
      otherwise. Step 3, ANY STATEMENT ABOUT c1: DIES DELIBERATELY. A probe in
      c1 perturbs one compressed coefficient of u, whose effect on the message
      is spread across all 256 message positions through multiplication by the
      secret s; the projection to a single bit weight is not sufficient there
      and this record makes no claim about c1, which is its declared method
      ceiling.

  discriminated_from:
    - >-
      IDEA-20260821-13b667 derives P_hit = Pr[D subset of S] for the difference
      support D under an OR-of-XOR accumulate, and its whole apparatus assumes
      the comparison's two operands are the honest and mutated ciphertexts.
      This record's object is the OTHER operand: at the Algorithm-18 boundary
      c' is recomputed from the mutated input, so D is not the mutation
      support. The two records meet at one point and the meeting is an
      amendment, not an overlap -- 13b667's form is correct at the primitive
      level and is not re-read, re-scored, or contradicted there.
    - >-
      IDEA-20260805-ee2018 and -1beeca track the comparator's silent set S: its
      size, its profile across parameter sets, its period, its suffix shape.
      Every one of those is a property of the COMPARATOR. T is a property of
      the SCHEME and is identical across every implementation of FIPS 203; no
      comparator fix changes a single element of it.
    - >-
      IDEA-20260805-3c957e uses L = 32*(du*k + dv) as a length identity to
      derive L mod w. This record uses du and dv as BIT-PACKING widths to
      derive an intra-coefficient bit index. The two derivations share one
      formula and nothing else: 3c957e's conclusion is about which comparator
      strides leave a tail, this record's is about which probe positions the FO
      transform silences.
    - >-
      IDEA-20260828-40db79 and -edec21 open the select and finalize primitives
      DOWNSTREAM of the comparator's verdict. This record's filter acts
      UPSTREAM of the comparator, on whether the probe survives to reach it at
      all. No claim of either record depends on this one and this record
      depends on neither.
    - >-
      RQ-MLKEM-001's H-MLKEM-232843 mutates the PRIVATE KEY dk and reads
      decapsulation as a black box. This record never touches dk, mutates only
      the ciphertext, and derives a key-independent encoding law; the
      key-dependent part is explicitly declared a nuisance and is not inverted.

