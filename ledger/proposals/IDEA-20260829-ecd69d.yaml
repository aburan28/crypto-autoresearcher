idea:
  id: IDEA-20260829-ecd69d
  question_id: RQ-MLKEM-002
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    The FO re-encryption is a SECOND silent-set filter that this lane has
    treated as pass-through. At ML-KEM-1024 a decapsulation-level xor_0x01
    probe at c2 byte index i flips a coefficient bit of weight
    2^((3(i-1408)) mod 5), so the probe is FORCED to be rejected exactly when
    i = 1 mod 5 and is a free coin exactly when i = 4 mod 5 -- a
    parameter-free law that accounts for the archived 20/9/3 partition
    EV-MLKEM-005 called "mechanism-consistent" and never derived
  class: mechanism

  claim: >-
    (A) THE ARCHIVED NUMBER NOBODY DERIVED. EV-MLKEM-005 observation 6 records
    that the Algorithm-18 integration arm of EXP-MLKEM-002 "accepted a mutated
    ciphertext on 43 of 64 index/seed pairs (20 indices on both seeds, 9 on
    neither, 3 seed-dependent)" over the 32 archived AVX2 pre-fix silent
    indices {1536..1567} at ML-KEM-1024, and explains it in one clause -- "a
    mutation in the uncompared tail that changes the decrypted message produces
    a re-encryption differing inside the compared prefix, so the FO comparison
    still rejects" -- with no derivation, no partition, and no prediction. No
    proposal filed against RQ-MLKEM-002 has returned to that number. This
    record derives it.
    (B) THE MECHANISM, EXACT AND KEY-INDEPENDENT. Algorithm 18 does not compare
    the received ciphertext c* against a fixed reference; it compares c*
    against c' = Encrypt(ek, m', r') where m' is what c* decrypts to. If the
    mutation leaves m' = m, then r' = G(m || H(ek)) is unchanged, c' is
    BIT-IDENTICAL to the honest c, and the comparison's difference support is
    exactly the mutation support {i}. If the mutation changes m', then c' is a
    freshly derived ciphertext differing from c* at essentially every position,
    the difference support is the whole buffer, and the comparison rejects NO
    MATTER WHAT the comparator's silent set is. Therefore the effective silent
    set at the Algorithm-18 boundary is not S but S intersect T, where
    T = {i : a probe at i leaves the decrypted message unchanged}. T is a
    property of the SCHEME's encoding, not of the comparator, and this lane has
    implicitly assumed T = [0, L).
    (C) T IS COMPUTABLE IN CLOSED FORM ON c2, AND IT IS PERIODIC WITH PERIOD 5.
    At ML-KEM-1024 the ciphertext is c = (c1, c2) with |c1| = 32*du*k =
    32*11*4 = 1408 and |c2| = 32*dv = 32*5 = 160, so c2 occupies byte range
    [1408, 1568) and the archived silent tail {1536..1567} lies ENTIRELY inside
    c2. ByteEncode_5 lays the 256 five-bit compressed coefficients of v into a
    little-endian bit array, so byte offset t = i - 1408 carries bitstream
    positions [8t, 8t+8). The archived integration probe is `xor_0x01` at every
    index (read first-hand from the committed raw.json this session), which
    flips exactly bitstream position 8t. That bit belongs to coefficient
    floor(8t/5) at intra-coefficient bit index (8t mod 5) = (3t mod 5), so the
    flip perturbs that coefficient's compressed value by exactly
    +/- 2^((3t) mod 5) units, i.e. v is perturbed by
    Delta = 2^((3t) mod 5) * q/32 in {q/32, q/16, q/8, q/4, q/2}.
    A message bit is recovered by Compress_1 of w = v - s^T u, whose decision
    boundaries are q/4 apart from the two codewords 0 and q/2. THEREFORE:
      b = 4  (Delta = q/2)  -- the bit ALWAYS flips, for every key, every
                              message and every noise value, because a shift by
                              exactly half the code period maps each codeword
                              onto the other. The probe is FORCED to be
                              rejected. T excludes i, unconditionally.
      b = 3  (Delta = q/4)  -- the shift lands exactly on the decision
                              boundary; the outcome is decided by the sign of
                              the decryption noise at that coefficient, i.e. it
                              is a key-and-message-dependent near-coin.
      b <= 2 (Delta <= q/8) -- the shift flips the bit only when the decryption
                              noise already exceeds q/8 at that coefficient,
                              which is far outside ML-KEM's operating regime.
                              The probe is essentially always accepted.
    Converting t = i - 1408 back to i: b = 4 iff t = 3 mod 5 iff i = 1 mod 5;
    b = 3 iff t = 1 mod 5 iff i = 4 mod 5.
    (D) THE FORCED PARTITION OF THE ARCHIVED 32 INDICES, WITH NO FREE
    PARAMETER. Over i in {1536,...,1567}: seven indices satisfy i = 1 mod 5
    ({1536, 1541, 1546, 1551, 1556, 1561, 1566}) and are FORCED-REJECT; six
    satisfy i = 4 mod 5 ({1539, 1544, 1549, 1554, 1559, 1564}) and are FREE
    COINS; the remaining nineteen are FORCED-ACCEPT. This partition (7 forced
    reject / 19 forced accept / 6 free) is derived from dv = 5 and the
    bit-packing rule alone, with nothing fitted. It implies, before any further
    data is read, that EV-MLKEM-005's "neither" count must lie in [7, 13], its
    "both seeds" count in [19, 25], and
    (neither - 7) + (both - 19) + seed_dependent = 6 exactly. The archived
    triple (both = 20, neither = 9, seed_dependent = 3) satisfies this with
    (1, 2, 3) as the realization of the six coins -- a consistent and
    unremarkable multinomial outcome -- and it is the ONLY account this lane
    has that reproduces all three numbers at once.
    (E) WHAT WAS ACTUALLY READ THIS SESSION, STATED EXACTLY SO IT IS NOT
    MISTAKEN FOR THE PROPOSED TEST. This session read
    experiments/EXP-MLKEM-002/runs/RUN-MLKEM-007/raw.json lines 374-570 only:
    the BUILD-PREFIX-AVX2 integration block, seed 1, indices 1536 through 1559
    inclusive, mutation `xor_0x01`. Within that window every one of the five
    forced-reject indices (1536, 1541, 1546, 1551, 1556) records
    integration_accept_on_mutation = false, every one of the fourteen
    forced-accept indices records true, and the five free-coin indices
    (1539, 1544, 1549, 1554, 1559) are mixed. That is 19 of 19 deterministic
    predictions consistent on a partial read of ONE seed. THE REMAINING ROWS
    (indices 1560-1567 on seed 1, and all of seed 2) WERE NOT READ AND ARE THE
    PROPOSED TEST. No number in this record is a measurement made by this
    session.
    (F) THE CROSS-PARAMETER-SET DISCRIMINATOR, WHICH IS WHY THIS IS NOT A
    CURVE-FIT. At ML-KEM-512 and ML-KEM-768 the compression parameter is
    dv = 4, and 4 divides 8, so 8t mod 4 = 0 for EVERY byte offset t: the
    xor_0x01 probe flips the least significant bit of a coefficient at every
    index without exception, Delta = q/16 everywhere, and the periodic
    structure vanishes identically. The model therefore predicts NO forced
    rejects and NO free coins in c2 at dv = 4, i.e. a completely flat
    acceptance profile -- a qualitatively different prediction at a different
    parameter set, derived from the same one-line rule, and one that a
    post-hoc fit to the ML-KEM-1024 numbers could not have produced.
    (G) THE CONSEQUENCE FOR THE GATE, WHICH IS THE POINT. Every
    decapsulation-level (Algorithm-18) differential probe in this lane has
    per-index power multiplied by 1{i in T}. At ML-KEM-1024, one index in five
    inside c2 has power EXACTLY ZERO against ANY comparator silent set, however
    defective the comparator: a mutation there is rejected by the FO transform
    before the comparator's verdict can matter. This is a
    null-that-cannot-fail (KN-TECH-1a5b7e mode 1) located in the SCHEME'S OWN
    ALGEBRA -- not in the control arm (IDEA-20260724-001/-002), not in the
    generator's support law (IDEA-20260821-13b667), and not in the ciphertext
    length arithmetic (IDEA-20260805-3c957e). It also corrects the containment
    law the lane now runs on: IDEA-20260821-13b667 computes
    P_hit = Pr[D subset of S] with D the MUTATION support; at the Algorithm-18
    boundary the operative support is D_eff = supp(c* xor c'), which equals D
    only on T and is essentially the whole buffer off T. The correct
    decapsulation-level form is P_hit = Pr[D subset of S and D subset of T].
    (H) WHAT IS NOT CLAIMED, AND THE STOPPING RULE. No attack, no oracle, no
    exploitation path, no attack-cost estimate, no timing/power/EM/cache/fault
    measurement, no statement about MLWE hardness or ML-KEM security at any
    parameter set. This record deliberately derives and tests only the
    KEY-INDEPENDENT half of T -- the bit-weight law fixed by ByteEncode_dv --
    and treats the key-and-message-dependent half (which way a b = 3 coin
    lands) as an irreducible nuisance term reported as a seed-variance count
    and never inverted. STOPPING RULE, BINDING ON THE EXECUTOR: if any stage
    begins to resolve per-key or per-coefficient decryption-margin structure
    from acceptance outcomes, the stage halts and escalates to the coordinator,
    because that is decryption-failure/oracle territory belonging to
    RQ-MLKEM-001 and forbidden by RQ-MLKEM-002's constraints. Any newly
    observed conformance defect escalates to the coordinator and is published
    by no agent.

  mechanism: >-
    STAGE 0 -- FREEZE THE FORCED TABLE BEFORE READING ANY UNREAD ROW. Under a
    frozen script, emit for every i in [1408, 1568) the triple
    (t = i - 1408, b = (3t) mod 5, class in {FORCED_REJECT, FREE, FORCED_ACCEPT})
    using class = FORCED_REJECT iff b = 4, FREE iff b = 3, FORCED_ACCEPT
    otherwise. Commit and hash this table. It contains no measured input and no
    fitted parameter: its only inputs are dv = 5 and the ByteEncode bit-packing
    rule. Emit the dv = 4 table for ML-KEM-512/768 in the same script, where
    every index is FORCED_ACCEPT.
    STAGE 1 -- THE ZERO-COMPUTE ARCHIVE CHECK, WHICH IS THE WHOLE MINIMAL TEST.
    Parse the committed
    experiments/EXP-MLKEM-002/runs/RUN-MLKEM-007/raw.json integration block for
    BUILD-PREFIX-AVX2 in full -- all 64 index/seed pairs, both seeds, indices
    1536-1567 -- and score every row against the frozen Stage-0 table. Report
    three counts: deterministic agreements, deterministic violations, and free
    rows. Recover the (both, neither, seed_dependent) triple independently from
    the rows and check it reproduces EV-MLKEM-005's (20, 9, 3); a mismatch
    there is a discrepancy between the evidence record's prose and its own raw
    data and is REPORTED, not adjudicated (AGENTS.md retrieval policy).
    STAGE 2 -- THE NULL ARM, WHICH THE ARCHIVE ALREADY CONTAINS. The same
    committed summary.json records integration_accept_counts of 0 for
    BUILD-PREFIX-SCALAR, BUILD-POSTFIX-SCALAR and BUILD-POSTFIX-AVX2. Those are
    builds whose comparator has an EMPTY silent set, so S intersect T is empty
    regardless of T, and the forced value is 0 accepts at every index including
    the 19 forced-accept ones. This is the null object the model must not
    explain away: if the model predicted acceptance on a complete comparator it
    would be predicting a defect where none exists. Scoring it is free and it
    can fail -- a nonzero count on any post-fix build would mean the archived
    null is not what the record says it is.
    STAGE 3 -- THE CROSS-PARAMETER-SET ARM, WHICH SEPARATES LAW FROM FIT. The
    archived corpus has no ML-KEM-512/768 integration arm on a silent set,
    because those parameter sets had empty pre-fix silent sets. So the dv = 4
    prediction is tested on a PLANTED comparator: build a comparator whose
    silent set is a declared 32-byte window inside c2 at ML-KEM-768
    (c2 = [960+... , 1088), computed under the frozen script from
    |c1| = 32*10*3 = 960), drive the identical xor_0x01 probe through a full
    decapsulation, and confirm the forced flat profile (no forced-reject
    index). Then repeat at ML-KEM-1024 with a planted silent window inside c2
    and confirm the period-5 profile reappears. Two parameter sets, opposite
    qualitative predictions, one probe.
    STAGE 4 -- THE BIT-WEIGHT LADDER, THE GRADED CONTROL. Replace xor_0x01 by
    xor_0x02, xor_0x04, ..., xor_0x80 at a fixed index and at ML-KEM-1024. Byte
    bit e flips bitstream position 8t + e, hence intra-coefficient bit
    ((8t + e) mod 5) and coefficient floor((8t+e)/5), so the forced class of a
    probe is a function of (t, e) through (3t + e) mod 5 -- the SAME law with a
    shifted argument. The graded prediction is that the forced-reject residue
    class SHIFTS by one position for each increment of e, cycling with period 5
    in e as well as in t. This is the arm that makes the law falsifiable in a
    way a single residue class is not: a period-5 pattern in t alone could be
    an artifact of any period-5 phenomenon, but a jointly period-5 pattern in
    (3t + e) is specific to the ByteEncode_5 packing.
    STAGE 5 -- THE CORRECTED POWER FORM, HANDED TO THE GATE. Emit, per
    parameter set and per generator, the decapsulation-level per-index power
    multiplier 1{i in T} and the corrected closed form
    P_hit = Pr[D subset of (S intersect T)], as an amendment to
    IDEA-20260821-13b667's primitive-level form. State explicitly that
    13b667's form is UNCHANGED and correct at the PRIMITIVE level (where the
    comparator is called directly on two buffers and no re-encryption
    intervenes), and that the amendment applies only at the Algorithm-18
    boundary. This record does not re-read or restate 13b667's verdict.

