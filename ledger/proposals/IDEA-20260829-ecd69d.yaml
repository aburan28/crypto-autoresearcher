  minimal_test:
    design: >-
      STAGE 0 plus STAGE 1 ARE THE WHOLE MINIMAL DISCRIMINATING TEST AND THEY
      REQUIRE NO BUILD, NO LIBRARY, NO COMPILER AND NO KEY GENERATION: emit and
      hash the forced (t, b, class) table from dv alone; then parse the
      committed RUN-MLKEM-007 raw.json integration block in full and score
      every one of the 64 rows against it. That is minutes of arithmetic
      against data already committed to this repository, and it either produces
      52 consecutive deterministic agreements with zero violations or it
      produces a violation that kills the law outright. Stages 2 (the archived
      post-fix null arm) and the EV-MLKEM-005 triple recomputation are also
      zero-compute and run in the same pass. STAGES 3-4 (the dv = 4 flatness
      arm and the bit-weight ladder) require planted comparators and full
      decapsulation runs and are the confirmatory, non-minimal half; they are
      bounded by a few thousand decapsulations at three parameter sets, well
      under a CPU-minute of actual cryptographic work plus build time. Every
      planted arm uses the GNU ld --wrap interposition admitted by EV-MLKEM-010
      and never the call-site macro interposition refuted by EV-MLKEM-009.
    controls:
      - >-
        NULL OBJECT, ALREADY IN THE ARCHIVE AND ABLE TO FAIL: the three
        archived builds with an empty comparator silent set
        (BUILD-PREFIX-SCALAR, BUILD-POSTFIX-SCALAR, BUILD-POSTFIX-AVX2), whose
        forced acceptance count is 0 at every index including the 19
        forced-accept ones. If the model or the scoring script predicts any
        acceptance there, it is predicting a defect where the archive records
        none and no candidate reading is admissible.
      - >-
        MUST-FIRE ARM: a planted comparator at ML-KEM-1024 with a declared
        silent window placed inside c2 at indices spanning at least two full
        residue periods, driven by xor_0x01. The period-5 forced-reject pattern
        must appear. Without a demonstrated appearance on a comparator whose
        silent set is known by construction, a pattern found on an archived
        build is uninterpretable.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST REPORT OUT OF DOMAIN: the
        c1 region. The predicate must refuse to assign a forced class there and
        must say why (delocalized message effect through the secret), never
        emit a residue table for it.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE CONCLUSION MUST INVERT: ML-KEM-768,
        dv = 4, where the same script must emit a flat all-forced-accept table
        and the measurement must show no periodicity.
      - >-
        STRUCTURAL-TELL CHECK (inventor protocol section 3): the forced-reject
        pattern must be INVARIANT under the parameter that destroys every
        comparator-side explanation -- namely, replacing the comparator with a
        different defective one having a different silent set placed over the
        same residue classes. A pattern that moves when the comparator changes
        is a comparator artifact, not an FO filter, and the record is withdrawn.
        Conversely a pattern that survives comparator replacement is the
        signature this record claims.
      - >-
        ORDERING CONTROL: the Stage-0 forced table is committed and hashed
        before any unread archived row is parsed, so no residue class can be
        selected after seeing the data. The rows this session did read
        (seed 1, 1536-1559) are declared in claim (E) and are excluded from
        counting as confirmations in the scored result.
      - >-
        ARCHIVE CHECK (zero compute): recompute EV-MLKEM-005's (20, 9, 3)
        triple from the raw rows and report agreement or disagreement between
        the evidence record's prose and its own run artifact, without
        adjudicating which is right.
    required_metrics:
      - the frozen (t, b, class) forced table for dv in {4, 5}, with script and hash
      - per-row scoring of all 64 archived integration rows against it, with violation counts by class
      - the (both, neither, seed_dependent) triple recomputed from raw rows, beside EV-MLKEM-005's stated triple
      - archived post-fix and scalar acceptance counts recomputed from raw rows
      - planted-comparator measured acceptance profiles at ML-KEM-768 (dv=4) and ML-KEM-1024 (dv=5), per index
      - the bit-ladder phase table over e in {0..7}
      - the comparator-replacement invariance check outcome
      - every build configuration, seed, and pinned commit used

  falsification_conditions:
    - >-
      Any archived row with i = 1 mod 5 in the silent range records
      integration_accept_on_mutation = true. The unconditional half of the law
      is false and the record is withdrawn in that part immediately.
    - >-
      Any archived row with b(i) in {0,1,2} records reject. Either H2's noise
      margin or the encoding rule is wrong; the record reports which by the b
      value of the violating rows and does not patch the model to fit.
    - >-
      The recovered (both, neither, seed_dependent) triple violates
      (both - 19) + (neither - 7) + seed_dependent = 6 with non-negative terms.
      The forced partition is wrong.
    - >-
      The ML-KEM-768 planted arm shows periodic structure in c2. dv = 4 should
      make the effect vanish identically; periodicity there means the
      mechanism is not the ByteEncode bit weight and the entire derivation is
      an accident of ML-KEM-1024's numbers.
    - >-
      The bit ladder shows periodicity in t but no phase shift in e. The
      period-5 structure is real but is not the packing, and the mechanism is
      misidentified.
    - >-
      The forced-reject pattern moves when the comparator is replaced by a
      different defective one over the same residue classes. The pattern is a
      comparator artifact and this record's central claim -- that the filter is
      comparator-independent -- is false.
    - >-
      FIPS 203's actual ByteEncode bit order is most-significant-bit-first
      rather than least-significant-bit-first, or dv at ML-KEM-1024 is not 5.
      The residue classes shift or the law dissolves; this is the recalled
      input most likely to be wrong and Stage 0 checks it before anything else.
    - >-
      Build, fetch or parse failures. INFRASTRUCTURE outcome under AGENTS.md
      rule 3, never mathematical evidence; the archive check still completes
      because it reads only committed files.

  confounders:
    - >-
      THE ARCHIVED ROWS THIS SESSION ALREADY READ CANNOT BE COUNTED TWICE. 19
      deterministic predictions were checked against seed-1 rows 1536-1559 in
      the course of writing this record, and the model was written knowing
      EV-MLKEM-005's 20/9/3 headline. The residue law itself has no fitted
      parameter, but the honest position is that the record is PART
      RETRODICTION, and only the unread rows (seed 1 indices 1560-1567, all of
      seed 2), the dv = 4 arm, and the bit ladder are genuine predictions. The
      scored result must separate the two.
    - >-
      A NEAR-BOUNDARY SHIFT IS NOT A CLEAN COIN. At b = dv - 2 the shift is
      q/4, exactly the distance to the decision boundary, so the outcome is
      decided by the sign of a small noise term whose distribution is not
      symmetric in general. Predicting "about half" is a modelling convenience;
      the record predicts only that this class is NOT deterministic and does
      not rest any conclusion on the rate.
    - >-
      COEFFICIENT STRADDLING. A byte's eight bits span two or three
      coefficients under dv = 5, so a MULTI-BIT probe disturbs more than one
      coefficient and the single-weight law does not apply. This record is
      confined to single-bit probes, which is what the archive used; extending
      to multi-byte generators requires a different derivation and is not
      attempted.
    - >-
      SILENT SET AND FILTER ARE OBSERVED THROUGH ONE BIT. Every archived row
      reports acceptance only. Attribution of a reject to the comparator versus
      to the filter is possible only through the crossed design of Stages 2-4,
      never from a single build's rows.
    - >-
      SCOPE OF THE ARCHIVE. One experiment, one library, two seeds, one
      parameter set with a nonempty silent set. Whatever the scoring returns is
      a statement about those rows.
    - >-
      PROXIMITY TO FORBIDDEN TERRITORY. The mechanism analysed here is the same
      arithmetic that underlies published decryption-failure and
      plaintext-checking-oracle work. The record's scope discipline -- derive
      only the key-independent encoding half, report key dependence as a
      variance count, never invert it -- is what keeps it inside
      RQ-MLKEM-002, and the stopping rule in claim (H) is binding on any
      executor.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST
      ESTIMATE, NOT A STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY
      PARAMETER SET. RQ-MLKEM-002's constraints bind unchanged; any newly
      observed conformance defect escalates to the coordinator and is published
      by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for any hypothesis, or
      for any archived evidence or decision record. Deriving the mechanism
      behind an archived observation is not re-reading that record's verdict.
    - >-
      A confirmed law says NOTHING about whether any implementation's
      comparator is correct. It says which probe positions could never have
      told you either way at the Algorithm-18 boundary. That makes some
      archived nulls weaker than they read, and it makes no archived null
      stronger.
    - >-
      Claim tier laboratory/toy, not raisable by citation. The scoring is over
      committed laboratory conformance rows at three standardized ciphertext
      lengths and is never crypto-scale or MLWE evidence.
    - >-
      The c1 region, multi-byte probes, and the direction of any individual
      near-boundary coin remain untested by this record and are named as open
      rather than closed. Premature closure is a failure mode symmetric with
      overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        BIT-WEIGHT LOCALITY ON c2. FOR ALL byte offsets t in [0, 32*dv) of the
        c2 region and FOR ALL e in [0, 8), the probe c2[t] xor 2^e flips
        exactly bitstream position 8t + e of the ByteEncode_dv bit array,
        hence perturbs exactly the single compressed coefficient
        floor((8t+e)/dv) by exactly +/- 2^((8t+e) mod dv) units, hence perturbs
        v at that coefficient by exactly 2^((8t+e) mod dv) * q/2^dv and
        perturbs no other coefficient of v and no coefficient of u.
      rigorous_support: >-
        Not a distributional heuristic: a rigorous consequence of ByteEncode_dv
        being a bijective little-endian bit-packing and of Decompress_dv being
        multiplication by q/2^dv followed by rounding. It imitates no classical
        distribution theorem and is not presented as one. It rests on the
        recalled FIPS 203 bit order (least-significant-bit-first), which is the
        single input this record cannot corroborate internally and which
        Stage 0 verifies before anything is scored. It is FALSE for multi-bit
        probes spanning a coefficient boundary, and that exclusion is part of
        the statement.
      validation_plan: >-
        Verify symbolically against the standard or against a primary
        implementation's ByteEncode/ByteDecode by round-tripping a probe:
        encode a known coefficient vector, flip byte t bit e, decode, and check
        that exactly one coefficient changed and that it changed by exactly
        2^((8t+e) mod dv). Run this at dv in {4, 5} over all t in [0, 32*dv)
        and all e in [0, 8) -- 1280 and 1024 cases respectively, exhaustive,
        milliseconds, no key material. Any case where two coefficients change,
        or where the delta is not the predicted power of two, falsifies H1 for
        that (t, e) and those cells are excluded rather than approximated. No
        sampling at cryptographic scale is required; this is an exhaustive
        check over a small finite domain.
    - id: H2
      statement: >-
        NOISE-MARGIN SEPARATION. FOR the ML-KEM parameter sets and FOR
        honestly generated keys and ciphertexts, the per-coefficient decryption
        statistic w = v - s^T u lies within q/8 of its intended codeword
        (0 or q/2) with probability at least 1 - epsilon for a small epsilon;
        consequently a perturbation of magnitude at most q/8 does not cross a
        decision boundary, a perturbation of exactly q/4 crosses it with
        probability governed by the sign of the residual noise, and a
        perturbation of exactly q/2 crosses it always.
      rigorous_support: >-
        The q/2 case is rigorous and unconditional (a shift by half the code
        period maps each codeword to the other regardless of noise) and is the
        only case this record's deterministic reject prediction uses. The
        q/8-and-below case is DISTRIBUTIONAL and imitates the standard
        decryption-correctness argument for ML-KEM: the same noise budget that
        makes ML-KEM's decryption-failure rate negligible is what makes a
        sub-q/8 perturbation harmless, since a failure would require the noise
        to have already consumed most of the q/4 margin. This record does NOT
        re-derive the failure-rate bound, does not cite a specific numerical
        value for it, and does not claim any number for epsilon.
      validation_plan: >-
        Measured directly and cheaply on planted keys the experimenter
        generates: over at least 2000 honest (key, message) pairs per parameter
        set, apply a synthetic +/- q/8 shift to one randomly chosen coefficient
        of v before decryption and record the empirical message-flip rate; the
        prediction is a rate at or near zero, and the tail check is that the
        maximum observed number of flipped bits over all trials is small.
        Repeat at +/- q/4 (prediction: an intermediate rate, no value
        predicted) and +/- q/2 (prediction: exactly one flipped bit in every
        trial, zero tolerance -- this is the arm that must be perfect). The
        sampled parameters (key generation seed set, parameter set, coefficient
        index distribution) are recorded, and the transfer assumption is stated
        explicitly: rates measured on laboratory-generated keys are not claimed
        to transfer to any deployed key distribution, and the only quantity any
        conclusion of this record rests on is the +/- q/2 arm, which is
        rigorous and key-independent.

  target_complexity:
    time_exponent: >-
      n/a -- no exponent is moved and no attack is proposed; RQ-MLKEM-002
      forbids attack-cost estimation and this record does not perform one. The
      deliverable is a closed-form, parameter-free law scored against committed
      data. Stated plainly rather than dressed up, per the idea-generator
      contract's requirement that a non-asymptotic proposal say so.
    memory_exponent: n/a
    best_known: >-
      n/a -- no competing statement of an Algorithm-18-boundary probe filter
      exists in this repository. Whether one exists in the external
      decryption-failure literature was NOT searched this session and is an
      open novelty question, flagged rather than settled.
    hidden_overhead: >-
      n/a for the minimal test, which is arithmetic over 64 committed rows.
      For the confirmatory stages, the dominant cost is building planted
      comparators and running a few thousand decapsulations; there is no
      superpolynomial overhead and nothing hides in an o(1).
    tradeoff_note: >-
      n/a. No time-memory tradeoff arises. The one scaling remark worth making
      is that the forced table's size is 32*dv entries per parameter set, i.e.
      160 at ML-KEM-1024, so the method's cost is independent of the number of
      probes and of the key size.

