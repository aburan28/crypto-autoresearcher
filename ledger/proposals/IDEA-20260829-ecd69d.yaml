  assumptions:
    - >-
      The archived integration probe is xor_0x01 at every index (read
      first-hand for indices 1536-1559, seed 1; assumed for the unread rows and
      CHECKED in Stage 1 rather than assumed at scoring time).
    - >-
      The AVX2 pre-fix comparator's silent set is exactly {1536..1567} at
      ML-KEM-1024, so that acceptance at index i is equivalent to
      "the message was unchanged" for i in that range. Taken from EV-MLKEM-005
      and RUN-MLKEM-007; if the silent set were larger or smaller the index
      range changes but the residue law does not.
    - >-
      The decryption noise at a single coefficient is, in the ML-KEM operating
      regime, well below q/8 with overwhelming probability, so that a shift of
      q/8 or less does not cross a decision boundary. This is what makes
      b <= dv - 3 forced-accept; it is stated as heuristic H2 with its own
      validation route rather than assumed silently.
    - >-
      No conclusion transfers beyond the parameter sets, probe forms, and
      archived runs actually scored. The c1 region is out of scope by
      construction, and nothing here is claimed for multi-byte probes.

  proof_search_map:
    bottleneck: >-
      The step from "the probe flips a coefficient bit of weight 2^b" to "and
      therefore the decrypted message does or does not change". That step is
      unconditional at b = dv - 1 (a q/2 shift), conditional on the noise
      magnitude at b <= dv - 3, and undetermined at b = dv - 2. Everything the
      record claims deterministically lives on the first and third of those,
      and the middle is where a wrong noise model would show up.
    baseline_embedding:
      parameter_slice: >-
        Restricted to dv = 4 (ML-KEM-512 and ML-KEM-768), the law collapses to
        b = 0 at every index, which is the lane's existing implicit assumption
        T = [0, L) -- i.e. the prior model is recovered exactly as the dv | 8
        slice of this one. That is a genuine embedding: the previous account is
        not contradicted at the parameter sets where it was implicitly applied,
        it is derived as a special case, and the new content is confined to
        dv = 5.
      reproduction_check: >-
        Under the frozen Stage-0 script, evaluate (8t) mod dv for dv = 4 over
        t in [0, 160) and confirm it is identically 0, reproducing the flat
        profile, before any ML-KEM-1024 row is read. A nonzero value would
        indict the script.
    observation_collision:
      observable: >-
        The single bit integration_accept_on_mutation per (index, seed).
      distinct_preimage_search: >-
        A REJECT at index i has two distinct ground-truth preimages that this
        observable cannot separate: (i) the comparator SAW the difference
        (i is outside S), and (ii) the comparator never got the chance because
        the FO re-encryption changed (i is outside T). This is a genuine
        collision and it is the reason the archived 43/64 was reported as
        "mechanism-consistent rather than universal" without a mechanism. The
        separating condition is that arm (i) is a property of the build and
        arm (ii) is a property of the residue class: Stage 2 holds the residue
        class fixed and varies the build (post-fix builds must reject
        everywhere), and Stage 3/4 hold the build fixed and vary the residue
        class. Neither alone identifies the mechanism; the crossed design does.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The bit-weight residue b(i) = (8*(i - |c1|)) mod dv, standing in for
          the entire decryption computation on the c2 region.
        predicted_gain: >-
          Reduces "will this probe change the decrypted message" from a
          full decapsulation to one modular arithmetic step, deterministically
          on 26 of 32 archived indices, at zero compute.
      - transform: observable_fiber
        proposed_object: >-
          The accept bit held fixed at REJECT, with the forgotten structure
          (which of comparator-saw-it versus FO-filtered-it) varied.
        predicted_gain: >-
          Names the intrinsic invariant separating the two preimages -- the
          residue class of i, which is invariant under every comparator change
          -- and thereby converts an unidentifiable observation into an
          identifiable one.
    quantifier_order: >-
      FOR the ML-KEM-1024 parameter set, FOR ALL keys, FOR ALL messages, FOR
      ALL c2 byte indices i with i = 1 mod 5, and FOR the xor_0x01 probe, the
      decrypted message changes -- no witness is allowed to depend on the key
      or the seed, which is exactly what makes this half falsifiable by a
      single counterexample row. The complementary statement at b <= dv - 3 is
      weaker and is written as such: FOR ALL such i, THERE IS a bound (the
      noise-to-boundary margin) such that FOR ALL keys whose noise at the
      affected coefficient respects that bound, the message is unchanged. The
      b = dv - 2 class carries NO universal quantifier and is predicted as a
      per-(key, seed) coin.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the c2 region of a stated parameter set and a stated single-bit
        probe, this method certifies exactly which probe positions are
        FORCED to be rejected at the Algorithm-18 boundary independently of the
        comparator, which are forced to be accepted subject to the stated noise
        bound, and which are undetermined. It certifies NOTHING about the c1
        region, nothing about multi-byte probes, nothing about which way an
        undetermined coin lands, and nothing about any implementation's
        comparator.
      nearby_object_control: >-
        The c1 region, where the desired conclusion FAILS: a probe there
        perturbs one compressed coefficient of u, whose message effect is
        delocalized across all 256 positions through the secret polynomial, so
        no single bit weight determines the outcome. The method must report
        c1 as OUT OF DOMAIN rather than assigning it a residue class. A
        pipeline that emits a period-5 forced table over c1 has learned to
        print the law rather than to apply it, and that is the specific failure
        the control exists to catch.
    proof_obligations:
      - claim: A shift of exactly q/2 in v flips the Compress_1 bit for every key and message.
        responsibility: correctness
      - claim: Byte offset t of c2 carries bitstream positions [8t, 8t+8) under ByteEncode_dv.
        responsibility: encoding
      - claim: The forced 7/19/6 partition of {1536..1567} follows from dv = 5 with nothing fitted.
        responsibility: size
      - claim: No deterministic prediction is violated on any archived row, over both seeds.
        responsibility: baseline
      - claim: Nothing transfers to c1, to multi-byte probes, or to unscored parameter sets.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        forced_reject_violations: over all 64 archived (index, seed) rows of
        the BUILD-PREFIX-AVX2 integration block, the number with i = 1 mod 5
        and integration_accept_on_mutation = true
      direction: lower
      minimum_effect: >-
        EXACTLY 0, with no tolerance, over all 14 such rows (7 indices x 2
        seeds). Any single violation refutes the unconditional half of the law
        and the record is withdrawn in that part. Five of the seven indices
        were read on seed 1 this session and are consistent; the remaining
        nine rows are the test.
    - metric: >-
        forced_accept_violations: the number of archived rows with
        b(i) in {0, 1, 2} (equivalently i not congruent to 1 or 4 mod 5) and
        integration_accept_on_mutation = false
      direction: lower
      minimum_effect: >-
        EXACTLY 0 over all 38 such rows (19 indices x 2 seeds). A nonzero count
        falsifies heuristic H2 (the noise-margin bound) rather than the
        encoding law, and the record says which by reporting the violating
        rows' b values: violations concentrated at b = 2 indict the margin
        bound, violations at b = 0 indict the encoding.
    - metric: >-
        free_class_containment: whether every seed-dependent index and every
        non-forced reject in EV-MLKEM-005's partition lies in the residue class
        i = 4 mod 5
      direction: different
      minimum_effect: >-
        MUST HOLD for all 3 seed-dependent indices and for exactly
        (9 - 7) = 2 of the never-accept indices. Equivalently the recovered
        triple must satisfy (both - 19) + (neither - 7) + seed_dependent = 6
        with all three terms non-negative. The archived (20, 9, 3) satisfies it
        as (1, 2, 3). A recovered triple violating the identity refutes the
        partition.
    - metric: >-
        dv4_flatness: at ML-KEM-768 with a planted 32-byte silent window inside
        c2, the number of probe indices whose acceptance is forced to reject by
        the bit-weight law
      direction: lower
      minimum_effect: >-
        EXACTLY 0, and the MEASURED acceptance profile must show no residue-5
        or residue-4 periodicity at all -- a flat profile. This is the arm that
        separates a derived law from a curve fitted to ML-KEM-1024, and it
        predicts the OPPOSITE qualitative behaviour at a different parameter
        set from the same one-line rule.
    - metric: >-
        bit_ladder_phase: over probes xor_2^e for e in {0,...,7} at fixed
        indices, the position of the forced-reject residue class as a function
        of e
      direction: different
      minimum_effect: >-
        MUST SHIFT by exactly one residue per unit increment of e, cycling with
