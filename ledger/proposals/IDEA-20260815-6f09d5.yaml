idea:
  id: IDEA-20260815-6f09d5
  question_id: RQ-ICEX-001
  added: '2026-08-15'
  title: >-
    THE ICEX COMPARISON WILL BE READ AS AN EXPONENT AND WILL BE FITTED OVER
    FOUR TOY SIZES: measure how many sizes are needed before a fitted
    exponent distinguishes 1/2 from 1/3 at all
  class: cost-model

  claim: >-
    The lane's decision target is whether a charged exponent's confidence
    interval excludes 1/2. That is a statistical question about the fit
    before it is a question about index calculus. Simulating fits on
    synthetic data with known exponents shows how many sizes and what per-
    point precision are needed to separate 1/2 from 1/3, and whether the
    lane's planned ladder can ever do it.

  mechanism: >-
    Generate synthetic cost data with known exponent and realistic per-point
    noise. Fit over ladders of varying length and spacing. Report the ladder
    configuration at which the interval reliably excludes the wrong value.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of RQ-ICEX-001's decision target; grep 'confidence interval',
      'exponent fit', 'statistical power'.
    results: >-
      The lane's decision target is phrased as an interval excluding 1/2;
      no record checks whether the planned ladder has the power to produce
      such an interval.
    verdict: >-
      ADAPTATION. Power analysis for a regression is elementary; applying
      it to the lane's own decision target before spending on measurement
      is what is missing.

  object_first_candidate:
    tracked_object: >-
      THE FITTED EXPONENT'S CONFIDENCE INTERVAL as a function of ladder
      length, spacing and per-point noise.
    lossiness: >-
      A fitted exponent projects a whole cost curve to one number, and the
      interval is what says whether that projection is informative at all.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives entirely in simulation; its realism depends on the assumed
      per-point noise, which is swept rather than fixed.

  null_object_control: >-
    NULL 1 -- synthetic data with exponent exactly 1/2, where the interval
    must contain 1/2 and must not spuriously exclude it at the nominal rate.
    NULL 2 -- pure noise with no trend, where no exponent should be
    resolvable.

  discriminated_from:
    - >-
        The lane's planned measurement protocol, which this record does
        not replace; it checks whether that protocol's ladder can answer
        the question it is designed for.
    - >-
        The optimistic-instantiation record in this series, which bounds
        the verdict; this one bounds the measurement's resolving power.

  assumptions:
    - >-
        Per-point noise can be estimated from existing toy runs; where it
        cannot, it is swept across a plausible range and the answer
        reported per level.
    - >-
        The cost curve is a power law over the tested range, which is the
        lane's own modelling assumption and is inherited rather than
        tested here.

  predictions:
    - metric: >-
        exponent-exactly-one-half null
      direction: different
      minimum_effect: >-
        FORCED: interval contains 1/2 at the nominal rate; spurious
        exclusion means the fit is over-confident.
    - metric: >-
        pure-noise null
      direction: different
      minimum_effect: >-
        FORCED: no exponent resolvable.
    - metric: >-
        ladder length needed to separate 1/2 from 1/3
      direction: different
      minimum_effect: >-
        The deliverable; if it exceeds the lane's planned ladder, the
        planned measurement cannot answer its own decision target.

  minimal_test:
    design: >-
      Simulation only. Sweep ladder length, spacing and noise; run both
      nulls.
    controls:
      - >-
          Exponent-exactly-one-half null at nominal rate.
      - >-
          Pure-noise null.
      - >-
          Noise level swept rather than assumed, with the answer
          reported per level.
    required_metrics:
      - >-
          Required ladder length per noise level to separate 1/2 from
          1/3.
      - >-
          False-exclusion rate under the 1/2 null.
      - >-
          Comparison against the lane's planned ladder.

  falsification_conditions:
    - >-
        The 1/2 null spuriously excludes 1/2 above the nominal rate. The
        fitting procedure is over-confident and would manufacture a
        positive.
    - >-
        Pure noise yields a resolvable exponent. Procedure broken.
    - >-
        The required ladder exceeds what the lane can afford. The decision
        target is unreachable as specified and must be restated before
        money is spent.
    - >-
        The planned ladder suffices. The lane's design is sound and this
        record confirms it cheaply.

  confounders:
    - >-
        NOISE UNDERESTIMATION: assuming less per-point variance than
        reality gives an optimistic ladder requirement, which is the
        direction that would let an under-powered measurement proceed.
    - >-
        POWER-LAW ASSUMPTION: if the true cost curve is not a power law
        over the tested range, the fitted exponent is not the quantity
        anyone thinks it is.

  interpretation_limits:
    - >-
        A simulation about measurement design; produces no evidence about
        index calculus.
    - >-
        Conclusions bind the assumed noise model and the power-law form.
    - >-
        A sufficient-ladder result is about resolving power, not about
        what the measurement will find.

  heuristic_assumptions:
    - id: HEUR-ICEX-POW-1
      statement: >-
        Per-point cost noise in the lane's toy runs is well approximated
        by the variance observed in existing runs of the same shape.
      rigorous_support: >-
        Rigorous ingredient: existing toy runs supply an empirical
        variance estimate. THE GAP: variance typically grows with
        problem size, and estimating it from the smallest sizes -- which
        is where existing runs concentrate -- systematically understates
        it at the sizes that drive the fit.
      falsification_condition: >-
        Measured variance at the largest ladder rung exceeding the
        extrapolated estimate.
      validation_plan: >-
        SAMPLE: variance estimated from existing runs at every available
        size. COMPARISON: variance trend against size. TAIL CHECK: the
        largest available size, reported separately since it anchors the
        extrapolation. TRANSFER: stated and unjustified.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Simulation only; seconds of compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent power analysis exists for this lane; the planned
      protocol specifies a ladder without checking its resolving power.
    hidden_overhead: >-
      The noise model does all the work, so a record that fixes one noise
      level rather than sweeping would be nearly worthless.
    tradeoff_note: >-
      A longer ladder buys resolving power and costs measurement; this
      record prices that trade before the lane commits.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing. As a design check
    for the lane's decision target: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the ladder length and per-
    point precision required for the lane's own decision target to be
    answerable, checked against its planned ladder, plus a false-exclusion
    rate for the fitting procedure.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that the simulation runs and the nulls behave. 0.5 that per-point
    noise can be estimated well enough from existing runs. 0.45 that the
    required ladder exceeds the planned one, which would mean the lane's
    decision target is currently unreachable and would be the most useful
    thing this record could find.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
