idea:
  id: IDEA-20260904-ca8865
  question_id: RQ-ECDLP-002
  handoff_id: TASK-20260904-300a32
  goal_id: null
  added: '2026-09-04'

  title: >-
    THE TWO CORRECTIONS THIS PROGRAM HAS APPLIED TO ITS OWN BASELINE HAVE NEVER
    BEEN COMPOSED, AND COMPOSING THEM COLLAPSES ONE OF THEM - at the memory-optimal
    advice size the CHARGED total cost of preprocessed discrete logarithm over M
    targets is 2 sqrt(M n), which is EXACTLY batch Pollard rho, identically in M
    and in n; so IDEA-20260806-3b91c7's tightened bar N^{1/2 - sigma/2} is an
    ONLINE-time bar only, the total-cost bar is unmoved at sqrt(Mn) for every
    target count, and every "beats rho" threshold in this ledger is ambiguous until
    it declares which of the two it means

  class: measurement

  claim: >-
    (A) THE TWO ROWS, BOTH ALREADY ON FILE, NEVER MULTIPLIED TOGETHER.
      ROW P (preprocessing/advice). IDEA-20260806-3b91c7 derives, for a FIXED public
      curve, an achievable stored-walk construction with memory S = n^{sigma},
      online time T = Theta(sqrt(n/S)) = n^{(1-sigma)/2}, offline time
      Theta(sqrt(nS)) = n^{(1+sigma)/2}, landing exactly on the committed generic
      lower bound S T^2 = Omega-tilde(n) of Corrigan-Gibbs and Kogan (KN-TECH-005,
      KN-LIT-013 as that record cites them), and concludes that the program's bar
      is "too generous by n^{sigma/2}".
      ROW M (multi-target). The Kuhn-Struik batch-rho row, used throughout this
      corpus (IDEA-20260808-f7e6e7, IDEA-20260815-284aff), solves M discrete
      logarithms on one curve in Theta(sqrt(M n)) total group operations.
    NEITHER RECORD COMPOSES WITH THE OTHER, and the composition is one line.

    (B) THE COMPOSITION, DERIVED AT ZERO COMPUTE. Preprocessing on a fixed curve is
    target-independent, so its cost is paid once and shared across M targets. The
    fully charged total is
      C_prep(M, sigma) = n^{(1+sigma)/2}  +  M * n^{(1-sigma)/2}.
    This is convex in sigma; the two terms are equal when n^{sigma} = M, i.e.
    sigma* = log M / log n, and at that point
      C_prep(M, sigma*) = 2 * n^{1/2} * M^{1/2} = 2 sqrt(M n).
    THAT IS BATCH RHO, TO THE FACTOR 2, FOR EVERY M AND EVERY n. The optimal advice
    size is exactly M words - one stored walk endpoint per target - which is also
    exactly what batch rho stores. The two rows are not two points of a frontier;
    at their own optima they are ONE point, and preprocessing's entire content is a
    TIME SHIFT of half the work from online to offline plus a memory charge of
    n^{sigma*} = M.

    (C) THE CONSEQUENCE FOR THIS PROGRAM'S ADMISSION RULE, WHICH IS THE POINT.
    A candidate mechanism in this ledger is admitted or rejected by comparing it
    against "rho". After (B) there are exactly THREE distinct bars, and they differ
    by powers of n -
      BAR 1, TOTAL CHARGED COST, single target - 0.886 n^{1/2} group operations at
        polylog memory. Unmoved by preprocessing, by (B) at M = 1 where
        sigma* = 0.
      BAR 2, TOTAL CHARGED COST, M targets - 2 sqrt(M n), i.e. sqrt(n/M) per target.
        A candidate that is not multi-target-amortisable must clear THIS bar if the
        deployment threat model has M keys on one standardized curve, and it is
        LOWER than Bar 1 by M^{1/2} per target.
      BAR 3, ONLINE TIME ONLY, preprocessing free - n^{(1-sigma)/2} at memory
        n^{sigma}, which is 3b91c7's bar and which reaches n^{1/3} at
        sigma = 1/3. Applicable only when the attacker is permitted an uncharged
        offline phase, which contradicts this program's own full-path charging rule
        unless it is declared.
    THE CLAIM IS THAT THE LEDGER DOES NOT CONSISTENTLY DECLARE WHICH BAR IT MEANS,
    and that at least one committed threshold cites a bar its own charging rule
    forbids. That is a checkable statement about existing records, not an opinion.

    (D) THE SHARP COROLLARY, STATED AGAINST THIS RECORD'S OWN INTEREST. (B) says
    charged generic preprocessing NEVER beats batch rho on total cost, at any M -
    so the CGK N^{1/3}-online result, which is real and is correctly cited across
    this corpus, is NOT a reduction in attack cost under the program's own rules; it
    is a reduction in ONLINE latency. Anyone quoting "ECDLP with preprocessing runs
    in N^{1/3}" as evidence that the ECDLP is weaker than sqrt(n) is quoting Bar 3
    while charging Bar 1, and this record's deliverable is the audit that finds
    where that has happened.

    (E) WHAT WOULD FALSIFY (B). Either an advice-based algorithm with
    S T^2 = o(n) - which would contradict the committed CGK lower bound and is
    therefore the strongest possible falsifier - or a preprocessing construction
    whose OFFLINE cost is below Theta(sqrt(nS)), i.e. asymptotically cheaper than
    3b91c7's stored-walk construction at the same S. The second is NOT excluded by
    any theorem this program holds, because CGK bounds S and T and says nothing
    about the preprocessing time; that gap is real, it is named here, and it is the
    one place the composition could break.

  mechanism: >-
    THE TRACKED OBJECT is the three-coordinate charged cost vector
    (offline time, online time, memory) of a discrete-logarithm attack, followed
    through the operation of AMORTISATION over targets. The projection that this
    program currently uses - report a single scalar "time" - is lossy, and it is
    lossy INCOMPATIBLY with amortisation, because amortisation acts differently on
    the three coordinates (it divides the offline coordinate by M, leaves the online
    coordinate alone, and leaves the memory coordinate alone). A scalar therefore
    does NOT propagate deterministically under the operation the program performs
    when it compares a multi-target attack against a single-target baseline. THAT
    INCOMPATIBILITY IS THE BUG, and it is exactly the lossy-projection test of
    docs/inventor-protocol.md section 2 applied to a cost model rather than to an
    algebraic object - the retained scalar is not a function of the retained scalar
    after amortisation, so the projection is invalid, not merely coarse.

    WHY THE COLLAPSE IN (B) IS FORCED AND NOT A COINCIDENCE. Any preprocessing
    scheme on the CGK frontier satisfies S T^2 = Theta(n) and, in every construction
    known to this corpus, builds its advice by covering S*T points, so offline time
    = S*T. Then total = S T + M T with S = n/T^2, i.e. total = n/T + M T, whose
    minimum over T is 2 sqrt(M n) at T = sqrt(n/M). The 2 sqrt(Mn) is therefore a
    consequence of the frontier equation alone and does not depend on the
    construction. The ONLY escape is an offline cost below S*T, which is (E).

    STAGE STRUCTURE. Stage 0 derives (B) and (C) at zero compute and is the hard
    gate. Stage 1 is the LEDGER AUDIT - mechanically extract, from every committed
    record that states a "beats rho" threshold, which of Bar 1, Bar 2 or Bar 3 it is
    using, and report the distribution together with the records that cite a bar
    incompatible with their own charging statement. Stage 2 is a small MEASURED
    calibration at toy scale that checks the three cost coordinates are what the
    derivation says, using the program's own charged-unit harness, with parallel rho
    and BSGS as the matched incumbents. Stage 3 produces the FRONTIER TABLE - one
    machine-readable file listing every row with its three coordinates and its
    provenance - so that future dominated_by fields are read off a table instead of
    re-derived per record.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval EMPTY, not called. Screening by (i) the 255-title ECDLP
      dedup digest read in full; (ii) PD-1 greps over ledger/proposals for
      'Corrigan-Gibbs', 'Kuhn-Struik', 'S T^2', 'Mihalcik', 'preprocessing'; (iii)
      reading the first 55 lines of IDEA-20260806-3b91c7, which is the record the
      greps identify as nearest; (iv) title-level reads of IDEA-20260808-f7e6e7,
      IDEA-20260815-284aff, IDEA-20260815-f81c17 and IDEA-20260823-9696cd from the
      digest and from an earlier grep of 9696cd's citation block.
    results: >-
      IDEA-20260806-3b91c7 holds the SINGLE-TARGET half in full - the stored-walk
      construction, S T^2 = Theta(n) exactly, the offline cost Theta(sqrt(nS)), the
      calibration against the committed CGK lower bound, and the conclusion that the
      program's bar is too generous by n^{sigma/2}. IDEA-20260808-f7e6e7 and
      IDEA-20260815-284aff hold the multi-target half. IDEA-20260823-9696cd cites
      CGK and the 3SUM/kSUM-indexing literature as retrieved sources for a different
      question. NO RECORD MULTIPLIES THE TWO HALVES, none states
      C_prep(M, sigma*) = 2 sqrt(Mn), and none observes that the optimal advice size
      is exactly M. The three-bar taxonomy of (C) and the ledger audit of Stage 1 are
      not present anywhere the greps reached.
    verdict: >-
      UNVERIFIED. The composition is elementary algebra performed in-session on two
      rows this corpus already holds, and the author's own reading is that (B) is
      folklore in the time-memory-tradeoff literature; the CGK bound and the
      Mihalcik/Bernstein-Lange constructions are cited SECOND-HAND from
      IDEA-20260806-3b91c7 rather than opened, so no label above unverified is
      admissible under AGENTS.md rule 9. THE ACT THAT WOULD LICENSE A HIGHER LABEL -
      open KN-LIT-013 (or the Corrigan-Gibbs-Kogan eprint) and one
      Bernstein-Lange source on small discrete logarithms, and record the
      verification. It is likely that (B) is known outside this program; the value
      claimed here is the CONSEQUENCE FOR THIS LEDGER'S ADMISSION RULE, which is
      internal and is verifiable by the Stage 1 audit regardless of external novelty.

