  assumptions:
    - >-
      The curve is fixed and public and the advice is curve-specific; M targets are
      distinct public keys on that one curve. NO LIVE KEY, WALLET OR DEPLOYED SYSTEM
      is targeted - the audit is over this repository's own records and the
      calibration uses self-generated toy instances.
    - >-
      Every preprocessing construction considered builds its advice by covering S*T
      group elements, so offline time equals S*T. This is true of every construction
      this corpus records and it is the assumption (E) isolates as the escape.
    - >-
      M is at most about sqrt(n), the range in which the batch-rho asymptotic
      Theta(sqrt(Mn)) is stated; outside that range both rows need restating and the
      record does not claim there.
    - >-
      Charged units - group operations for time, machine words for memory, with
      serialisation and transfer of the advice charged at one unit per word, per this
      program's full-path rule.

  proof_search_map:
    bottleneck: >-
      The offline-cost assumption. Every number in (B) follows from
      offline = S*T together with the frontier equation S T^2 = Theta(n); if some
      construction preprocesses in less than S*T the collapse in (B) fails and Bar 3
      becomes a genuine total-cost row. No theorem in this corpus excludes that, and
      naming the gap is half the record's value.
    baseline_embedding:
      parameter_slice: >-
        M = 1. Then sigma* = 0, the advice is O(1) words, and
        C_prep(1, 0) = 2 n^{1/2} - plain rho, up to the factor 2. The composition
        must reproduce the single-target incumbent exactly at that slice, and it
        does.
      reproduction_check: >-
        SYMBOLIC AND FROZEN - substitute M = 1 into C_prep and check it returns
        2 sqrt(n); substitute sigma = 1/3 and M = 1 and check it returns
        n^{2/3} + n^{1/3}, i.e. that a n^{1/3}-online scheme costs n^{2/3} in total,
        which is WORSE than rho by n^{1/6} at one target - the number that makes (D)
        concrete. A second fixture - at M = n^{1/3}, both rows must return
        Theta(n^{2/3}).
    observation_collision:
      observable: >-
        The scalar "attack time" as reported in this ledger's threshold statements.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, AND THE COLLISION IS THE FINDING - two
        attacks with the SAME reported scalar time and different (offline, online,
        memory) vectors, for example n^{1/3} online with n^{2/3} offline versus
        n^{1/3} total. If the ledger contains a threshold that cannot distinguish
        them, the scalar observable is not identifying and the audit has found its
        target. This is an observation collision used constructively - the collision
        is what the record is looking FOR, not what it must avoid.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar cost by the three-vector (offline, online, memory) and
          require every threshold statement to name which coordinate it bounds.
          The stronger state is what survives amortisation; the scalar does not.
        predicted_gain: >-
          Makes every dominated_by field in this program mechanically checkable
          against one table rather than re-derived per record, and removes an
          ambiguity that currently sits in an unknown number of committed thresholds.
      - transform: specialization_pack
        proposed_object: >-
          Build the frontier as a machine-readable table with one row per algorithm
          and one column per charged coordinate, with each row's provenance and its
          validity range, adding rows only over disjoint, separately sourced blocks.
        predicted_gain: >-
          A reusable artifact; the per-record cost of an honest dominated_by field
          drops from a derivation to a lookup.
    quantifier_order: >-
      FOR ALL n, FOR ALL M at most sqrt(n), FOR ALL sigma in [0,1], the charged total
      is at least 2 sqrt(Mn) with equality at sigma = log M / log n, ASSUMING the
      offline cost equals S*T. The witness sigma* depends on (M, n) and on nothing
      else. THE CONVERSE IS NOT CLAIMED - the record does not assert that no
      preprocessing scheme has offline cost below S*T; it asserts that none in this
      corpus does, and marks the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - "under the stated offline-cost assumption, charged generic
        preprocessing and batch rho coincide at 2 sqrt(Mn) for every M, so the
        program's total-cost admission bar is unmoved by preprocessing; and here is
        the list of committed records whose thresholds do not say which bar they
        use". It can NEVER certify a lower bound on the ECDLP, it says nothing about
        non-generic advice, and it says nothing about whether any candidate mechanism
        clears any bar.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS is a problem whose
        preprocessing is genuinely cheap relative to its advice - for instance
        function inversion for a function that is cheap to enumerate but expensive to
        invert, where a table can be built in time equal to its size rather than S*T.
        A cost model that cannot distinguish that case from the discrete logarithm
        has not identified the load-bearing structure, and the distinguishing feature
        is named - here the advice is built by WALKING, which costs T per stored
        entry.
    proof_obligations:
      - claim: >-
          C_prep(M, sigma) = n^{(1+sigma)/2} + M n^{(1-sigma)/2} is minimised at
          n^{sigma} = M with value 2 sqrt(Mn).
        responsibility: correctness
      - claim: >-
          The M = 1 slice reproduces 2 sqrt(n).
        responsibility: baseline
      - claim: >-
          Offline cost equals S*T in every construction this corpus records.
        responsibility: scope
      - claim: >-
          The measured three coordinates at toy scale match the derived ones within
          the stated tolerance.
        responsibility: feasibility
      - claim: >-
          The Stage 1 audit's classification of each threshold statement is
          reproducible from the record text alone by a stated rule.
        responsibility: interface
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The charged cost three-vector (offline time, online time, memory) of an attack,
      followed through amortisation over targets.
    lossiness: >-
      The three-vector is itself a lossy projection of a full cost model (it forgets
      communication, energy, and the parallel profile), and it is lossy COMPATIBLY
      with amortisation, which acts coordinatewise. The SCALAR projection that the
      ledger currently uses is lossy INCOMPATIBLY - it does not propagate under
      amortisation - and demonstrating that is the record's technical content. So the
      test is used here in the negative direction, to condemn an existing projection
      rather than to bless a new one, which is a legitimate and under-used mode of
      the test.
    propagation: >-
      The three-vector propagates deterministically under amortisation, under
      parallelisation (divide online by processors), and under composition of
      independent phases (add coordinatewise). The scalar does not propagate under
      the first of these.
    survival_score: >-
      Survives every operation the program performs on cost statements. It dissolves
      only at the boundary where memory access ceases to be unit cost - the area-time
      and mesh models - which is named as an open direction and is NOT claimed here.

  null_object_control: >-
    NULL-1, THE SHUFFLED-LEDGER AUDIT (blocking). Run the Stage 1 classification rule
    over a set of records with their threshold statements RANDOMLY PERMUTED among
    them. The rule must classify the shuffled corpus differently from the true one;
    if the reported distribution of bars is the same, the classification rule is
    reading its own defaults rather than the records, and the audit result is void.
    NULL-2, THE SHAM ALGORITHM (blocking). A construction with a deliberately
    mis-specified offline cost (offline = S rather than S*T) run through the same
    accounting; it must produce a DIFFERENT total (n^{sigma} + M n^{(1-sigma)/2},
    minimised well below 2 sqrt(Mn)), demonstrating that the accounting is sensitive
    to the assumption (E) isolates. If the accounting returns 2 sqrt(Mn) for the sham
    too, the collapse in (B) is an artifact of the algebra and not of the frontier.
    COMPARATOR 1 (blocking) - parallel Pollard rho with distinguished points and the
    negation map, measured in the program's charged units on the toy ladder, with its
    three coordinates reported.
    COMPARATOR 2 (blocking) - BSGS, measured on the identical instances with its
    three coordinates reported; BSGS is the row where the memory coordinate is
    largest and it is the sharpest test that the vector is being measured rather than
    assumed.
    POSITIVE CONTROL (blocking) - a stored-walk preprocessing implementation at
    sigma = 1/3 on the toy ladder, whose measured online time must be n^{1/3} within
    the stated tolerance and whose measured offline time must be n^{2/3}. An
    accounting that cannot see a 1/3-online scheme it built itself cannot audit
    anyone else's.

  predictions:
    - metric: >-
        P1 - the fitted exponents of measured offline time, online time and memory
        for the stored-walk positive control at sigma in {0, 1/6, 1/3, 1/2}, over six
        prime orders from 2^17 to 2^27
      direction: different
      minimum_effect: >-
        Online exponent (1-sigma)/2 within 0.03, offline exponent (1+sigma)/2 within
        0.05, memory exponent sigma within 0.03, at every sigma. Deviation beyond
        that in the OFFLINE exponent is the informative outcome, because the offline
        cost is the assumption (E) isolates and a measured offline cost below S*T
        would break the collapse in (B).
    - metric: >-
        P2 - the measured total charged cost of the positive control at sigma* versus
        the measured total of batch rho, at M in {1, 8, 64, 512}
      direction: different
      minimum_effect: >-
        Ratio in [0.5, 2.0] at every M records the collapse of (B) as validated in
        scope. A ratio below 0.5, reproduced at three or more M and decreasing in n,
        would mean charged preprocessing genuinely beats batch rho and is the LEAD -
        it would also contradict the derivation, so it routes to independent review
        before any interpretation.
    - metric: >-
        P3 - the fraction of committed ledger records stating a "beats rho" threshold
        that unambiguously name which of Bar 1, Bar 2, Bar 3 they use
      direction: different
      minimum_effect: >-
        Reported whatever its value, with the full classified list as an artifact. A
        fraction above 0.9 means the ambiguity this record posits is not real and the
        audit half of the proposal returns a clean negative, which is a complete and
        useful outcome. A fraction below 0.5 means the program's central comparison is
        under-specified and the frontier table of Stage 3 is the remedy.
    - metric: >-
        P4 - the number of committed records that cite an ONLINE-time bar while
        stating a full-path charging rule
      direction: different
      minimum_effect: >-
        Reported with record ids. Zero is a clean negative. One or more is a concrete,
        actionable integrity finding, and it is routed to the Coordinator as a
        correction candidate rather than acted on here.
    - metric: >-
        P5 - NULL-1 and NULL-2 outcomes
      direction: different
      minimum_effect: >-
        NULL-1 must classify the shuffled corpus differently; NULL-2 must return a
        total below 2 sqrt(Mn). Failure of either voids the corresponding half of the
        record.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, HARD GATE, ONE HOUR). Derive (B), run the two
      reproduction fixtures (M = 1 returns 2 sqrt(n); sigma = 1/3 at M = 1 returns
      n^{2/3}), and run NULL-2 the sham algorithm. If M = 1 does not reproduce rho
      the algebra is wrong and the record stops.
      STAGE 1 (HOURS, NO COMPUTE BEYOND TEXT PROCESSING). The ledger audit - state
      the classification rule, apply it to every committed record containing a
      threshold statement, and run NULL-1 the shuffled-ledger control. Emit the
      classified list as an artifact with record ids.
      STAGE 2 (HOURS). The calibration - implement the stored-walk positive control
      and measure P1 and P2 against parallel rho and BSGS on the identical toy
      instances in the identical charged units, six prime orders from 2^17 to 2^27,
      M in {1, 8, 64, 512}, 10 instances per cell.
      STAGE 3 (HOURS). Emit the frontier table - one machine-readable file, one row
      per algorithm, columns (offline, online, memory, targets, advice, validity
      range, provenance), so that dominated_by fields become lookups.
      NO LIVE KEY, WALLET OR DEPLOYED SYSTEM. Self-generated toy instances only. The
      audit reads this repository's own records and nothing else.
    controls:
      - Parallel Pollard rho with distinguished points and negation, three coordinates reported, identical instances and units (blocking matched control)
      - BSGS, three coordinates reported, identical instances and units (blocking matched control)
      - NULL-1 shuffled-ledger audit (blocking, same shape)
      - NULL-2 sham algorithm with mis-specified offline cost (blocking)
      - POSITIVE CONTROL stored-walk preprocessing at sigma = 1/3 (blocking)
      - M = 1 reproduction fixture returning 2 sqrt(n) (blocking)
      - Classification rule stated before the audit is run, and applied by a script rather than by judgement (blocking)
    required_metrics:
      - Measured offline time, online time and peak memory, in charged units and bytes, per (n, sigma, M)
      - Fitted exponents with residuals for each of the three coordinates
      - Measured total for the positive control against measured batch rho, per M
      - The classified threshold list with record ids and the classification rule text
      - NULL-1 and NULL-2 outcomes
      - The frontier table file with per-row provenance
      - Certificate - every toy discrete logarithm solved during calibration is emitted with its scalar and re-verified independently by the harness toy-curve verifier

  falsification_conditions:
    - >-
      F1. The M = 1 fixture does not reproduce 2 sqrt(n). The algebra is wrong; the
      record stops at zero compute.
    - >-
      F2. NULL-2 returns 2 sqrt(Mn) for the sham algorithm as well. The collapse in
      (B) is an artifact of the accounting rather than of the frontier equation, and
      no conclusion about preprocessing may be drawn.
    - >-
      F3. P1 measures an offline exponent significantly below (1+sigma)/2. The
      offline-cost assumption is false for the implemented construction, Bar 3 may be
      a genuine total-cost row, and the record's central claim is refuted. THIS IS
      THE MOST INFORMATIVE NEGATIVE AVAILABLE and it costs a few CPU-hours.
    - >-
      F4. P2 shows charged preprocessing beating batch rho by more than a factor 2 at
      three or more M. Either the derivation or the implementation is wrong; routes
      to independent review before interpretation.
    - >-
      F5. NULL-1 classifies the shuffled corpus the same as the true one. The audit
      rule is reading its own defaults; P3 and P4 are void.
    - >-
      F6. All predictions hold. The PREDICTED outcome - the two rows coincide, the
      three-bar taxonomy stands, the audit reports where the ledger is ambiguous, and
      the frontier table exists. It changes NO mathematical fact about the ECDLP and
      it makes at least one class of future claim harder rather than easier, which is
      why it is filed.
    - >-
      F7. Budget exhaustion before the calibration resolves. INFRASTRUCTURE outcome
      under AGENTS.md rule 3.

  confounders:
    - >-
      Toy-scale constants. At 17 to 27 bits the constants in Theta(sqrt(Mn)) and in
      the stored-walk construction are comparable to the effects being measured; P2's
      tolerance is set at a factor 2 for exactly that reason and a tighter reading is
      not licensed.
    - >-
      The distinguished-point parameter. Batch rho's measured cost depends on the DP
      rate, and a badly chosen rate makes rho look worse than it is. The rate must be
      tuned for rho with the same effort spent tuning the positive control, and the
      tuning budget must be reported.
    - >-
      Second-hand citation of IDEA-20260806-3b91c7. Only its first 55 lines were
      read. If its later sections already compose the two rows, this record is a
      duplicate and should be withdrawn; the Coordinator should confirm before
      scheduling.
    - >-
      The audit's classification rule is itself a judgement encoded as a script; two
      reasonable rules could classify differently. The rule text is an artifact and
      the audit must be re-runnable under an alternative rule.
    - >-
      Memory is charged at unit cost per word. Under an area-time or mesh model the
      three-vector is not the right object and the collapse in (B) may not hold;
      that is named as an open direction and is explicitly outside scope.

  interpretation_limits:
    - >-
      This record proves NOTHING about the ECDLP. It is a cost-model composition and
      an audit of this repository's own records.
    - >-
      (B) is conditional on the offline-cost assumption, which is a property of known
      constructions and not a theorem. Every citation of (B) must carry that
      condition.
    - >-
      The CGK bound and the batch-rho asymptotic are both `recalled` here, quoted
      second-hand from internal records. Nothing above unverified may rest on them.
    - >-
      An audit finding is a CORRECTION CANDIDATE, not a correction. Changing any
      committed record's status or content is the Coordinator's authority and no such
      change is proposed, implied or performed here.
    - >-
      Toy tier for the calibration; the exponent fits are measured at 17 to 27 bits
      and their extrapolation is explicitly unjustified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Every preprocessing construction for the discrete logarithm on the CGK
        frontier builds its advice by covering S*T group elements, so its offline
        time is Theta(S*T) = Theta(n/T) at S T^2 = Theta(n).
      rigorous_support: >-
        The rigorous half is the CGK LOWER bound S T^2 = Omega-tilde(n) (recalled,
        second-hand), which fixes the relation between S and T but says NOTHING about
        offline time. The classical statement it imitates is Hellman's table
        construction for function inversion, where building a table of S chains of
        length T costs S*T evaluations. WHAT IS ASSUMED is that no construction does
        better, and the record states plainly that no theorem it holds excludes one.
        H1 is therefore a genuine heuristic and it is the record's single point of
        failure.
      validation_plan: >-
        SAMPLE - implement the stored-walk construction at four values of sigma and
        six prime orders, and MEASURE the offline group-operation count directly
        rather than assuming it; 10 independent builds per cell. COMPARISON
        DISTRIBUTION - the derived Theta(sqrt(nS)) with its fitted exponent.
        SHORTCUT - none needed; the construction is cheap at toy scale, which is
        exactly why this is the affordable half of the record. TAIL CHECK - the
        cheapest observed build across all cells against the derived bound; a build
        below it by more than a factor 2 is the F3 refutation. TRANSFER ASSUMPTION -
        measured at 17 to 27 bits only, and the record does not claim that no
        construction at cryptographic n does better.
    - id: H2
      statement: >-
        Batch rho on M targets costs Theta(sqrt(Mn)) total group operations for
        M at most sqrt(n), with the implied constant stable across the tested ladder.
      rigorous_support: >-
        The rigorous half is the birthday-collision analysis of the multi-target
        random walk (Kuhn-Struik, recalled), whose classical distribution statement is
        the coupon-collector/birthday law for M targets sharing one distinguished-point
        table. WHAT IS ASSUMED is constant stability at toy scale, which is exactly
        what the calibration measures.
      validation_plan: >-
        SAMPLE - 10 independent batch-rho runs per (n, M) cell over six prime orders
        and four values of M. COMPARISON - the fitted exponent against 1/2 in both n
        and M, and the fitted constant against its value at M = 1. TAIL CHECK - the
        slowest observed run per cell against the exponential tail of the collision
        time. TRANSFER ASSUMPTION - toy scale only.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The record's output is that the CHARGED TOTAL
      exponent of the incumbent family is 1/2 in n and 1/2 in M - specifically
      2 sqrt(Mn) - for every advice size, so the bar a candidate must clear is
      n^{1/2} M^{1/2} in total charged cost and n^{(1-sigma)/2} in online time only.
    memory_exponent: >-
      The memory-optimal advice size is exactly M words, i.e. memory exponent
      sigma* = log M / log n, which for any realistic M is far below n^{1/2}. This is
      the coordinate the scalar cost model discards and it is the reason the record
      exists.
    best_known: >-
      Parallel Pollard rho at about 0.886 n^{1/2} group operations with small memory
      (KN-TECH-006, second-hand); BSGS at 2 n^{1/2} time and n^{1/2} memory; batch rho
      at Theta(sqrt(Mn)); generic preprocessing at S T^2 = Theta(n) with offline
      Theta(sqrt(nS)); Pohlig-Hellman fixing n as the largest prime factor.
    hidden_overhead: >-
      The Theta in both rows hides constants that are comparable at toy scale, which
      is why P2's tolerance is a factor 2. There is no o(1) and no superpolynomial
      term anywhere in this record - it is a constant-and-exponent accounting and it
      claims nothing asymptotically new.
    tradeoff_note: >-
      THE RECORD IS ABOUT THE TRADEOFF. The frontier S T^2 = Theta(n) is a curve, not
      a point, and its total-cost projection is flat at 2 sqrt(Mn); parallelisation
      divides the online coordinate by the processor count and leaves the offline
      coordinate parallelisable to the same degree, so no coordinate of the vector is
      immune and the flatness survives parallelisation.

  dominated_by: >-
    n/a as an attack - no algorithm is proposed and no attack is mounted. The
    frontier was nevertheless walked row by row for the COST STATEMENT this record
    makes. (1) Parallel rho - is the Bar 1 row itself, so the record does not compete
    with it, it recomputes it. (2) BSGS - a distinct point of the same frontier,
    included as a matched control precisely because its memory coordinate is the
    largest. (3) Automorphism-discounted rho - multiplies Bar 1 by |Aut|^{-1/2} and
    changes no conclusion. (4) Batch rho - is the Bar 2 row. (5) Generic
    preprocessing - is shown here to coincide with Bar 2 on total cost. (6)
    Pohlig-Hellman - not comparable, n prime. (7) Transfers - dominate on their curve
    families and are outside the generic accounting entirely. (8) Prime-field index
    calculus - at or above n^{1/2} in this corpus. AS A METHODOLOGY CONTRIBUTION the
    nearest incumbent is IDEA-20260806-3b91c7, which DOMINATES this record on the
    single-target half (it derives the construction; this record only cites it) and
    is DOMINATED here on the multi-target composition and on the audit, neither of
    which it contains.
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data or queries. The quantitative deltas actually
    claimed are (i) the identity C_prep(M, sigma*) = 2 sqrt(Mn), which says the
    charged total-cost bar is UNMOVED by preprocessing at every M and is therefore a
    correction of size zero to Bar 1 and of size n^{sigma/2} to the reading of
    Bar 3 - i.e. it partially UNDOES a previously filed tightening, which is stated
    plainly rather than avoided; (ii) the observation that the optimal advice size is
    exactly M words, which is a concrete number where the corpus had a free
    parameter; (iii) the three-bar taxonomy and a measured count of how many committed
    thresholds fail to declare which bar they use; (iv) a machine-readable frontier
    table replacing per-record re-derivation of dominated_by. No exponent moves and
    none is claimed.

  discriminated_from:
    - >-
      IDEA-20260806-3b91c7 is the NEAREST record and holds the entire single-target
      half - the stored-walk construction, S T^2 = Theta(n), the offline cost, the
      CGK calibration and the tightened online bar. THIS RECORD ADDS exactly one
      thing to it, the multiplication by the multi-target row, and that one thing
