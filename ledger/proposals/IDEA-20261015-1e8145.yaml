  title: Auxiliary finite-coset isogeny bases priced by verified quotient-rank yield
  class: composition
  claim: 'R1/R2 membership/relation/LA comparison: price identical auxiliary finite-coset bases as list, expanded
    map and low-degree chain per new verified orbit-reduced rank. Useful density and solver cost remain unknown.'
