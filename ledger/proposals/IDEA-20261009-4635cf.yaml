    source_text: Silverman AEC ch. IV and VII
    provenance: kb
    claim: |-
      formal group of E over a local field is pro-p; reduction exact sequence; canonical heights
    verified_by: intake-session-20261009 (coordinator role) opened KN-LIT-7621
