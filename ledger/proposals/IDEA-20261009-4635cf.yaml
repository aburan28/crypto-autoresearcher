  title: The computable canonical point lift to E(Q_p) carries no DLP information
  class: control
  claim: |-
    The section is independent of the chosen lift, is a homomorphism, satisfies [N] section(P) = O to precision p^k, and log([N] Qtilde)/N mod p for Q = [k]P is uniform over random lifts with zero mutual information about k.
  mechanism: |-
    For p not dividing N = #E(F_p), 0 -> Ehat(pZ_p) -> E(Q_p) -> E(F_p) -> 0 splits because Ext(Z/N, Z_p) = Z_p / N Z_p = 0. The torsion section is P -> Ptilde - exp(log([N]Ptilde) / N). It is a homomorphism onto an isomorphic copy, so it linearizes nothing. Every p-adic kernel (formal group over any finite extension of Q_p) is pro-p, so only the p-part could ever transfer (Smart).
  novelty_status: known
