      nothing in its deliverable rests on them: the Bezout statement used is
      KN-OPEN-020's (read), sigma = 1 is measured by Stage 4, and the C(p) null band
      is computed in-run.
    - >-
      Toy tier throughout; every number is scoped to the tested (p, E, t0, base,
      routine, budget).

  heuristic_assumptions:
    - id: H1
      statement: >-
        The set J_t0 = { j : t(j) = plus or minus t0 } meets the x-coordinate set x(G)
        as a random subset of F_p of the same size would: |x^{-1}(J_t0) intersect G|
        = 2 * |J_t0| * (1/2) * (1 + O(|J_t0|^{-1/2})), uniformly for |J_t0| between
        p^{1/4} and p^{1/2}.
      rigorous_support: >-
        RIGOROUS BOUND: Schoof's exact count |J_t0| = H(4p - t0^2), and the exact
        density 1/2 of x-coordinates of E among F_p (Hasse). CLASSICAL DISTRIBUTION
        IMITATED: the quadratic residuosity of x^3 + a x + b on a structured set J
        behaves as a fair coin, the same statement the Weil bound proves for J
        algebraic of low degree (character sum over J bounded by deg(J) sqrt p, which
        is vacuous here because deg J is about |J|) -- so the heuristic is exactly
        that the CM j-set is not correlated with the quadratic character of E's cubic.
      validation_plan: >-
        SAMPLE: every j in J_t0 at p in {2^12, 2^16, 2^20}, nine (E, t0) cells per p,
        no shortcut needed. COMPARISON DISTRIBUTION: the count of j in J_t0 with
        x^3 + a x + b a square against Binomial(|J_t0|, 1/2). TAIL CHECK: the maximum
        absolute deviation over cells against the binomial 3-sigma bound, and its
        scaling as |J|^{1/2}. SAMPLED PARAMETERS RECORDED: p, E, t0, H, seed.
        TRANSFER ASSUMPTION: none needed for (S5); the toy data checks Y1 only.
    - id: H2
      statement: >-
        F_t0 is log-random: the discrete logarithms of its elements with respect to
        a generator of G are distributed, for the purposes of arity-3 representation
        counts and of the maximal Fourier coefficient, as those of a uniformly random
        subset of Z/N of the same size, uniformly for sizes between p^{1/4} and
        p^{1/2}. (This is the E1 prediction stated as a heuristic so that its
        refutation is E2.)
      rigorous_support: >-
        RIGOROUS BOUND: the exact mean identity of KN-FIND-007 for representation
        counts, which holds for every subset. CLASSICAL DISTRIBUTION IMITATED: the
        Poisson law of representation counts and the extreme-value law of the maximal
        Fourier coefficient for a random subset of a cyclic group. The gap between
        bound and distribution is exactly KN-FIND-c93d45's DL circularity: no
        algebraic method bounds these Fourier coefficients, so H2 is genuinely a
        heuristic and is what Stages 2 and 3 measure.
      validation_plan: >-
        SAMPLE: 200 targets per cell for counts and all |F| logarithms per cell for
        C(p), at p in {2^16, 2^20}, brute-force logs (toy). COMPARISON DISTRIBUTION:
        Poisson with the KN-FIND-007 mean for counts; the in-run extreme-value law of
        NULL-1 replicates for C(p); and NULL-2's empirical distributions. TAIL CHECK:
        maximum per-target count and maximum Fourier coefficient against equal
        numbers of NULL-1 replicates. DECAY PARAMETER: p at fixed beta; a flat excess
        is an artifact. SAMPLED PARAMETERS RECORDED: p, E, t0, |F|, generator, seeds.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED. If F_t0 were used in prime-field index calculus, its
      exponent would be that of IDEA-20260808-812554 at its (beta, m, sigma), with
      beta >= 1/4 forced by (S2) and sigma = 1 predicted by (S4): total m! N,
      exponent 1, worse than rho by N^{1/2}. Nothing below N^{1/2} is claimed.
      LEMMA DECOMPOSITION for the record's own statements: (S1) size, (S3) runtime of
      membership, (S4) correctness of the description, (S5) assembly.
    memory_exponent: >-
      |F_t0| = N^{beta}, beta in [1/4, 1/2], for the base and relation matrix; the
      membership test needs O(log p) working memory. At the edge beta = 1/4 the
      linear-algebra cost B^2 = N^{1/2} equals rho's time, which is the boundary the
      base sits on.
    best_known: >-
      Parallel Pollard rho with distinguished points and negation, 0.886 sqrt(N),
      O(1) memory per processor (KN-TECH-006); BSGS 2 sqrt(N) time, sqrt(N) memory;
      kangaroo on an interval; automorphism-discounted rho (KN-TECH-018);
      Pohlig-Hellman (KN-TECH-030); generic preprocessing at S T^2 = N.
    hidden_overhead: >-
      The o(1) in H(D) = |D|^{1/2 + o(1)} is Siegel's ineffective constant, replaced
      by exact class numbers at toy scale; SEA's O~ hides (log p)^{O(1)} and the
      heuristic Elkies-prime assumption, neither of which matters for a polylog
      membership claim. Nothing superpolynomial is hidden because nothing is claimed.
    tradeoff_note: >-
      None proposed. The base's only tunable is t0 (size), and (S2) says the size
      cannot be pushed below the boundary of the admissible region.

  dominated_by: >-
    n/a (no result claimed). ROWS CHECKED: (1) parallel rho with negation -- dominates
    any index calculus over F_t0 at sigma = 1 on time and memory; (2) BSGS --
    dominates on time; (3) kangaroo -- not comparable; (4) automorphism-discounted
