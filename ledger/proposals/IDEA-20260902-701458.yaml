  sota_delta: >-
    +0 on time, memory and queries. Quantified deltas claimed: (i) one closed
    Bezout-tight base per size in [p^{1/4}, p^{1/2}] with polylog membership, at
    zero compute, populating a KN-OPEN-020 cell; (ii) a floor beta >= 1/4 for single
