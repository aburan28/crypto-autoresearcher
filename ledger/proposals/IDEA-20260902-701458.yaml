    - metric: >-
        Y4 -- F4 solve cost on the membership-adjoined Semaev ideal divided by the
        charged exhaustive pair-enumeration cost on the same targets, per base
      direction: different
      minimum_effect: >-
        Ratio >= 0.5 for F_t0 and NULL-1 at every size (sigma = 1 up to constants);
