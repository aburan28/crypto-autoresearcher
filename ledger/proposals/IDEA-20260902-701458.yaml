  assumptions:
    - >-
      E ordinary, G of prime order, toy curves per KN-TECH-034; x(P) in {0, 1728}
      excluded from the base (at most four points).
    - >-
      t0 chosen with p not dividing t0 and D0 not in {-3, -4} times a square, so the
      weights in Schoof's count are the generic ones; the special discriminants are
      excluded, not handled.
    - >-
      Membership is charged at one point count per test; a yield count that omits it
      is a count, not a cost.
    - >-
      Toy scale only: p at most 2^20 for exhaustive construction and brute-force
      discrete logarithms.

  proof_search_map:
    bottleneck: >-
      The decomposition solver over F_t0 (sigma). Everything else in the record --
      size, membership, description -- is settled by (S1)-(S4); the exponent question
      lives entirely at sigma, and (S5) says that is where KN-OPEN-020 must go.
    baseline_embedding:
      parameter_slice: >-
        The Kummer base at equal size is the known inhabitant of the cheap-membership
        family and is run as an arm at every cell; the record must reproduce
        KN-FIND-007's mean on it, 726aa3's membership cost x^{(p-1)/e}, and the
        exhaustiveness bdca13 predicts. Second slice: the Bezout bound with
        d = deg M = |F_t0| must be met, not exceeded.
      reproduction_check: >-
        Frozen fixture: at p = 2^12, the full trace histogram over j in F_p must equal
        the Kronecker class numbers computed independently, to the point (Stage 0);
        and the Kummer arm's |F| must equal the direct count of e-th-power residues
        among x(G).
    observation_collision:
      observable: >-
        The membership predicate value 1_{F_t0}(P), together with the three
        statistics (yield, C(p), solve cost) of the base.
      distinct_preimage_search: >-
        EXPECTED AND DESIGNED FOR: two different traces t0, t0' with equal class
        number give two different bases of equal size with the same predicate cost;
        E1 predicts their statistics coincide with each other and with the random
        null. That collision is the null of this record. The collision that would
        matter is the opposite one: F_t0 and NULL-1 having DIFFERENT statistics at
        equal size, which is E2.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the size and membership cost fixed and vary the auxiliary structure:
          random subset, second trace, Kummer, interval. Any intrinsic invariant
          separating them in the E-side statistics is the finding.
        predicted_gain: >-
          Converts KN-OPEN-020's prose cell into four numbers per size.
      - transform: representation_reduction
        proposed_object: >-
          Represent membership as a point count rather than as a degree-p^beta
          polynomial evaluation. Encoding: exact (complete splitting). Completeness
          and soundness: exact. Cost: polylog per test, charged.
        predicted_gain: >-
          Shows description degree and membership cost are decoupled, which is the
          structural content of (S5).
    quantifier_order: >-
      (S1)-(S4): FOR ALL p, FOR ALL beta in [1/4, 1/2], THERE EXISTS a public,
      target-independent t0 (depending on p and beta only) such that F_t0 has size
      p^{beta + o(1)}, polylog membership, and a completely split membership
      polynomial of degree |F_t0|(1 + o(1)). The witness t0 depends on p, which the
      claim permits; it does not depend on the instance (P, Q). (S5): FOR ALL
      no-go arguments that rest only on membership cost or description degree, F_t0
      is a counterexample to universality. NOT CLAIMED: anything about sigma below 1.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: 'the implicit-membership cell of KN-OPEN-020 contains, at every size
        in [p^{1/4}, p^{1/2}], a closed Bezout-tight base with polylog membership;
        on the tested toy cells its yield, C(p) and Groebner cost matched the random
        null within [these] bands, as did the Kummer and second-trace arms'. It
        cannot certify that no solver exploits the class-group structure.
      nearby_object_control: >-
        The object where a closed algebraic base DOES admit sigma < 1: the
        Frobenius-defined base of an extension-field curve E/F_{p^n} under Weil
        descent (Gaudry, Diem; KN-LIT-002's warning, recalled). There the auxiliary
        structure (Frobenius) is an endomorphism of E and acts on relations; here the
        auxiliary structure (Cl(O) on j-values) does not act on E. A method that could
        not tell these apart would be measuring the wrong thing; Stage 4 tells them
        apart by construction because sigma < 1 shows in the solve-cost ratio.
    proof_obligations:
      - claim: >-
          The number of j with t(j) = plus or minus t0 equals H(4p - t0^2) with the
          quoted weights, for p not dividing t0.
        responsibility: size
      - claim: >-
          Every root of the ring class polynomials of the orders between Z[pi] and
          O_K is in F_p.
        responsibility: correctness
      - claim: >-
          One SEA point count decides membership; cost polylog and charged.
        responsibility: runtime
      - claim: >-
          The four comparison bases have equal size within 5 percent and run through
          byte-identical routines.
        responsibility: interface
      - claim: >-
          The Kummer arm reproduces 726aa3's count and the predicted exhaustiveness.
        responsibility: baseline
      - claim: >-
          No cell claims anything beyond the tested (p, E, t0, base, routine).
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      Named because the contract asks; not this record's lens. The object is the
      auxiliary trace t(x(P)), a function from G minus {O, x = 0, x = 1728} to the
      Hasse interval [-2 sqrt p, 2 sqrt p].
    lossiness: >-
      Genuinely lossy: about 4 sqrt p values, with fibres of size about
      2 H(4p - t^2) each, so nothing about P beyond its fibre is retained. It is NOT
      compatible with the group law of E: t(x(P + Q)) is not a function of t(x(P))
      and t(x(Q)); it is a coordinate-dependent predicate in IDEA-20260806-c5d183's
      trichotomy, like every factor-base membership test, and the record uses it
      only as a predicate.
    propagation: >-
      None under addition on E. Under the Cl(O)-action on the auxiliary j-line the
      fibre {j : t(j) = t0} is a union of orbits and propagates exactly; that action
      is computable (PEGASIS, snippet depth) but never touches E, which is the whole
      point of E1.
    survival_score: >-
      Survives as a KN-OPEN-020 datum at every size in [p^{1/4}, p^{1/2}]; dies as an
      attack at the solver axis, disclosed.

  null_object_control: >-
    NULL-1 (blocking, all arms): a uniformly random subset of G of size |F_t0|,
    freshly sampled per replicate, through byte-identical routines.
    NULL-2 (blocking, structure-versus-size): the base F_t0' for a second trace with
    equal class number; E1 predicts it is indistinguishable from F_t0 and from NULL-1.
    COMPARISON ARM (blocking): the Kummer base at equal size, the known cheap-
    membership inhabitant, which must reproduce 726aa3's count and the predicted
    exhaustiveness (positive control for the solver arm's ability to detect
    sparsity effects without calling them exponents).
    REFERENCE ARM: the interval-x base for the C(p) statistic, whose constant near 3
    is recorded in KN-FIND-c93d45's evidence; its null band is computed in-run from
    NULL-1 replicates.
    KNOWN-ANSWER CALIBRATION (blocking): the full trace histogram at p = 2^12 against
    Kronecker class numbers, exact.
    ARTIFACT TELL: any deviation must persist at the next p and must be absent on
    NULL-2; a deviation shared by NULL-2 is a property of size, not of structure.

  discriminated_from:
    - >-
