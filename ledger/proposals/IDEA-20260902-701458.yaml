idea:
  id: IDEA-20260902-701458
  question_id: RQ-ECDLP-002
  added: '2026-09-02'
  title: >-
    KN-OPEN-020'S IMPLICIT-MEMBERSHIP CELL IS INHABITED, AND NOT BY A KUMMER SET: the
    CM-TRACE FACTOR BASE F_t0 = { P in G : the auxiliary curve with j-invariant x(P)
    has Frobenius trace plus or minus t0 } is a CLOSED, BEZOUT-TIGHT algebraic set of
    degree H(4p - t0^2) = |F_t0|(1 + o(1)) -- the product of the ring class polynomials
    of the orders between Z[pi] and O_K -- whose membership test is ONE point count
    (SEA, polylog), whose size is tunable to p^{beta} for every beta in [1/4, 1/2] by
    choosing t0 near the Hasse edge, and whose Galois structure is a class-group
    action on auxiliary j-invariants rather than a multiplicative subgroup or a
    composed rational map; so the universal algebraic-factor-base no-go cannot go
    through membership cost or description degree and must go through the solver
    axis, and the discriminating toy test is whether this base is log-random (yield,
    H-PSEUDO statistic, Groebner exhaustiveness) exactly like the random null
  class: control

  claim: >-
    Setting: E/F_p ordinary, p > 3, G a subgroup of E(F_p) of prime order N, x the
    x-coordinate map, 2-to-1 on G minus O. For j in F_p minus {0, 1728} let E'_j be
    the fixed representative curve y^2 = x^3 + 3 k x + 2 k with k = j / (1728 - j),
    and let t(j) denote its trace of Frobenius, so that #E'_j(F_p) = p + 1 - t(j) and
    its quadratic twist has trace -t(j). Fix an integer t0 with t0^2 < 4p, p not
    dividing t0, and D0 = t0^2 - 4p. Define the CM-TRACE FACTOR BASE
        F_t0 = { P in G : x(P) not in {0, 1728} and t(x(P)) in {t0, -t0} }.
    The condition is twist-invariant by construction, so the choice of representative
    E'_j does not matter. Five statements.

    (S1) SIZE (Deuring-Schoof, unconditional count; one independence heuristic H1 for
    the intersection with x(G)). The number of j in F_p with t(j) = plus or minus t0
    equals the number of F_p-isomorphism classes of elliptic curves with trace t0,
    which by Schoof's theorem (1987) is the Kronecker class number
    H(4p - t0^2) = sum over conductors f with f^2 dividing (D0 / d_K) of h(D0 / f^2)
    (with the standard weights at the special orders). Each such j is the
    x-coordinate of a point of G with probability about 1/2 and then of exactly two
    points, so |F_t0| = H(4p - t0^2) (1 + o(1)) under H1. By Siegel-Brauer,
    H(D) = |D|^{1/2 + o(1)}, so |F_t0| = |D0|^{1/2 + o(1)}.

    (S2) TUNABLE SIZE, WITH A FLOOR AT beta = 1/4. Writing t0 = floor(2 sqrt p) - s
    for an integer s >= 1, one has |D0| = (2 sqrt p - t0)(2 sqrt p + t0) which is
    about 4 s sqrt p, hence |F_t0| = p^{1/4 + o(1)} * (4 s)^{1/2 + o(1)}. Thus every
    beta in [1/4, 1/2] is realised by s of order p^{2 beta - 1/2}, and NO single trace
    condition realises beta < 1/4: the Hasse interval has length 4 sqrt p, the
    smallest nonempty trace class near its edge has class number of order p^{1/4},
    and this is the floor. The index-calculus admissible region beta < 1/4
    (IDEA-20260808-812554) is therefore reachable only at the edge beta = 1/4 + o(1),
    or by intersecting F_t0 with a second cheap predicate, and the record says so
    rather than hiding it.

    (S3) MEMBERSHIP. Deciding P in F_t0 is one point count of E'_{x(P)}: Schoof-Elkies-
    Atkin in O~((log p)^4) bit operations (heuristic SEA; Schoof's rigorous
    O((log p)^8) suffices for the polylog claim). No class polynomial is ever
    evaluated. This is the same cost class as the Kummer test x^{(p-1)/e} = 1 and as
    the Petit-Kosters-Messeng root-extraction tower, and it is obtained from a
    completely different structure.

    (S4) DESCRIPTION. F_t0 is x^{-1} of the zero set of Pi_f H_{D0 / f^2}(j), the
    product of the ring class polynomials of the orders between Z[pi] and O_K; its
    degree is H(4p - t0^2) = |F_t0| (1 + o(1)), and every root is F_p-rational because
    p = N(pi) splits completely in each ring class field. Hence F_t0 is a CLOSED
    algebraic factor base that is BEZOUT-TIGHT in the sense of the bound
    |F| <= 3 d that KN-OPEN-020 reproduces from IDEA-20260801-021 -- met here with
    |F| about d -- and whose membership polynomial splits completely over F_p, exactly
    the hypothesis of IDEA-20260829-bdca13's Chinese-remainder argument (a RECALLED
    pointer in this record, not opened) that a Groebner solver over the membership
    quotient is exhaustive.

    (S5) THE CONSEQUENCE FOR KN-OPEN-020, which is the claim this record exists to
    test. KN-OPEN-020 lists "implicit membership or source-recovery algorithms" among
    the reasons the universal no-go is open. F_t0 shows that cell is inhabited at
    every size p^beta, beta in [1/4, 1/2], by a closed Bezout-tight set with polylog
    implicit membership whose structure is neither multiplicative (Kummer) nor a
    composed map (PKM) but a class-group action on the auxiliary j-line. Therefore a
    universal no-go for prime-field index calculus cannot be proved on the membership-
    cost axis or on the description-degree axis; it must be proved on the SOLVER axis,
    where (S4) plus bdca13 predicts sigma = 1 for full-solution-set solvers on this
    base -- a prediction Stage 4 measures rather than assumes. The two explanations
    the test discriminates: E1 (predicted) -- F_t0 is log-random: its exact
    decomposition yield, its H-PSEUDO statistic
    C(p) = max_k |sum_{P in F} e(2 pi i k log_G(P) / N)| / sqrt(|F|), and its
    Groebner solve cost all match the random-subset null within pre-registered bands,
    so the class-group structure of the auxiliary j-values leaves no trace in the
    group law of E; E2 -- one of those statistics deviates, reproducibly, and not for
    the null, which would be the first coordinate-defined base in this corpus with a
    measurable additive signal in the discrete-log coordinate. E1 closes the
    membership axis of KN-OPEN-020 with a mechanism; E2 is a lead to be controlled.

  mechanism: >-
    INGREDIENT-FIRST, per this lane's contract. The external ingredients converted
    are: (i) Schoof's count of curves with prescribed trace by Kronecker class numbers
    (the size law), (ii) Schoof-Elkies-Atkin point counting as a polylog implicit
    membership oracle for a degree-p^beta closed set (the membership device), and
    (iii) the complete splitting of ring class polynomials at p = N(pi) (the
    description and the bdca13 hypothesis). The generic conversion is "predicate on an
    auxiliary object indexed by a coordinate", the same shape as the Kummer base
    (predicate: x is an e-th power) with the auxiliary object changed from the
    multiplicative group of F_p to the moduli of elliptic curves. A 2025 ingredient is
    noted and NOT converted: PEGASIS (eprint 2025/401, snippet depth) makes the full
    class group Cl(O) act on curves with the Frobenius orientation in polynomial time,
    so the set of auxiliary j-values underlying F_t0 carries a computable transitive
    group action; but that action moves auxiliary curves, not points of E, so it
    induces no symmetry of E-relations (unlike Frobenius on an extension-field base),
    and this is the reason E1 is predicted.

    STAGE 0 (zero compute, HARD GATE). Write (S1) with Schoof's theorem quoted in the
    exact form used, including the weights at j = 0 and 1728 and at the orders of
    discriminant -3 and -4, and the p-not-dividing-t0 condition. Write (S2)'s edge
    computation. Write (S4)'s complete-splitting claim from the theory of complex
    multiplication (p splits completely in the ring class field of O iff p = N(alpha)
    for alpha in O, applied to alpha = pi). Check (S1) against the object where it is
    exact: at a toy p, compute t(j) for EVERY j in F_p by point counting and verify
    that the trace histogram equals the Kronecker class numbers to the point; this is
    the known-answer calibration and is blocking.

    STAGE 1 (instrument, hours). In Sage: for p in {2^12, 2^16, 2^20} and three
    prime-order curves E per p (KN-TECH-034 exclusions), choose t0 at three shifts s
    giving |F_t0| about p^{1/4}, p^{1/3}, p^{1/2}; build F_t0 by point-counting
    E'_{x(P)} for every P in G (exhaustive at toy scale; Sage's trace_of_frobenius);
    record |F_t0| against H(4p - t0^2) computed independently by Sage's class number
    routines. Build the matched comparison bases at equal size: NULL-1 (uniform random
    subset of G), NULL-2 (F_t0' for a second trace t0' with H(4p - t0'^2) equal to
    H(4p - t0^2) within 5 percent), KUMMER (x(P) an e-th power, e chosen for equal
    size), and INTERVAL (x(P) < |F_t0|, the H-PSEUDO reference base).

    STAGE 2 (yield arm). For 200 uniform targets per cell, exact arity-3 decomposition
    counts over each base by pair enumeration and closing-point membership, with the
    membership cost charged. Report mean, variance, coverage.

    STAGE 3 (H-PSEUDO arm). Compute log_G(P) for every P in each base by brute force
    (toy), then C(p) as defined in (S5) by an FFT of length N, for each base; compare
    against the extreme-value law of a matched random subset, computed in-run from
    NULL-1 replicates (the normalisation IDEA-20260805-c4f675 argues for, recalled).

    STAGE 4 (solver arm, the one that bears on sigma). Form the membership polynomial
    M(x) = product over x-values of F_t0 of (x - x_i) by interpolation from the set
    (no CM theory needed at toy scale), and run F4 on the ideal
    < S_4(x_1, x_2, x_3, x_R), M(x_1), M(x_2), M(x_3) > for 20 targets per cell;
    record wall-clock, first-fall degree and the number of solutions, against the
    exhaustive pair enumeration on the same targets. Do the same for KUMMER with
    M = x^e - 1 (sparse) and for NULL-1 (dense M from a random set). The prediction is
    ratio >= 1 for all three (sigma = 1), with the Kummer sparse case possibly faster
    by a polynomial factor that is NOT an exponent.

    STAGE 5 (decay and artifact check). Any deviation is re-run at the next larger p
    and against NULL-2; a deviation that does not persist, or that NULL-2 shares, is a
    controlled null.

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE: CRYPTO_KB_QDRANT_URL is ':memory:' and the derived
      index is empty in this container; search_knowledge was NOT called. Screening by
      Read and Grep over knowledge/, ledger/, analysis/ and ideas/ for 'Hilbert class
      polynomial|class polynomial|H_D(|CM j-invariant|trace condition|prescribed
      trace|same trace as|given trace' (30-plus hits, overwhelmingly the JINV, VOLC
      and MONO lanes about the target curve's OWN CM, not opened beyond titles), for
      the proximity pattern 'factor base ... (auxiliary curve|curve with j-invariant
      x(|trace of the curve|class polynomial)' (one hit, ideas/rejected/ECDLP-IDEA-276,
      a Riemann-Kempf theta idea by title, NOT opened), for 'SEA|Schoof' in
      ledger/proposals (30-plus hits, none opened; the term is ubiquitous in
      point-counting contexts), and for 'factor base ... (Schoof|point count|modular
      polynomial|X_1(|X_0()' (no hits). Full reads of KN-OPEN-020, KN-FIND-9d2f56,
      KN-FIND-c93d45, KN-FIND-5c1a03, IDEA-20260808-726aa3, IDEA-20260829-4b34c5
      (first 140 lines), IDEA-20260808-812554 (first 70 lines), and the compiled
      prior-proposal list; IDEA-20260801-021, IDEA-20260803-e2f5bd,
      IDEA-20260808-c31f1c, IDEA-20260806-0c9de1, IDEA-20260805-c4f675 and
      IDEA-20260829-bdca13 were NOT opened and are known only at the claim-excerpt
      level of that list (or, for the Bezout bound, through KN-OPEN-020's summary),
      so they are cited as recalled. External: the WebSearch queries recorded in the
      session accounting; no source for Schoof's count or SEA was opened.
    results: >-
      No record found that uses a trace or class-number condition on an AUXILIARY
      curve indexed by x(P) as a factor-base predicate. The corpus's CM records
      (H-STR-002, the RQ-JINV-8fc13a lane, IDEA-20260812-c49409) all concern the
      endomorphism ring of the TARGET curve acting on its own points; none defines a
      base on a generic curve through auxiliary curves. The nearest objects are the
      Kummer base (726aa3, 4b34c5) and the composed-map base (KN-LIT-025), both named
      in the claim as what this base is NOT. IDEA-20260806-0c9de1 places the INSTANCE
      (E, P) on X_1(N); it does not use moduli of other curves as a predicate.
      KN-OPEN-020 names the implicit-membership cell as open and this record is the
      first to populate it. All absences are floors.
    verdict: >-
      UNVERIFIED. The base is elementary once stated and it is entirely possible it
      appears in the prime-field index-calculus literature as a remark; the external
      literature was not opened. The record's value does not rest on the base being
      unpublished but on what it does to KN-OPEN-020's axes.

