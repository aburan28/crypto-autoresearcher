        intersection plus the o(1) of the twist count). Outside at two consecutive p:
        (S1) or H1 is wrong as stated.
    - metric: >-
        Y2 -- ratio of mean exact arity-3 decomposition counts, F_t0 over NULL-1, and
        the same for NULL-2 and Kummer
      direction: different
      minimum_effect: >-
        Within 1 plus or minus 3 sqrt(1 / (200 lambda)), lambda the KN-FIND-007 mean;
