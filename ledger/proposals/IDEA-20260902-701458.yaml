        three sizes, absent for NULL-1, is E2 on the solver axis and triggers
        independent review.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): (S1)-(S4) written with the quoted theorems
      and the full trace histogram calibration at p = 2^12. STAGE 1 (hours): bases at
      p in {2^12, 2^16, 2^20}, three curves per p, three sizes per curve, with the
      four comparison arms. STAGE 2 (hours): yield arm, 200 targets per cell.
      STAGE 3 (hours): brute-force logs and C(p) per base by FFT. STAGE 4 (hours):
      solver arm, 20 targets per cell, F4 versus charged enumeration.
      STAGE 5: only on a band excess, one larger p and NULL-2. No deployed parameter
      is touched; all instances are toy and self-generated.
    controls:
      - NULL-1 random subset of equal size, byte-identical routines (blocking)
      - NULL-2 second trace with equal class number (blocking)
      - Kummer base of equal size as the known cheap-membership comparison (blocking)
      - interval-x base as the C(p) reference with its recorded constant (calibration)
      - full trace histogram against Kronecker class numbers at p = 2^12 (blocking known-answer)
      - membership cost charged as one point count per test and reported beside every count (blocking accounting check)
      - exclusion of anomalous, smooth-order and special-j toy curves per KN-TECH-034; exclusion of t0 with p dividing t0 or special D0
    required_metrics:
      - '|F_t0| and H(4p - t0^2) per cell, with the ratio Y1'
      - mean, variance and coverage of exact arity-3 counts for all five bases, with bootstrap intervals
      - C(p) per base with the in-run null extreme-value band and the interval calibration
      - F4 wall-clock, first-fall degree and solution count versus charged enumeration, per base and size, with the fitted sigma
      - per-test membership cost per base in field operations
      - pass or fail of every blocking control; wall-clock and peak memory per stage

  falsification_conditions:
    - >-
      G1. Stage 0 calibration fails: the trace histogram does not match the class
      numbers. The instrument or the quoted theorem is wrong; nothing is reported.
    - >-
      G2. Y1 outside its band at two p: (S1) or H1 is wrong; the size law is
      re-derived before any other arm is read.
    - >-
      G3. Y2 or Y3 excess for F_t0, absent on NULL-1 and NULL-2, persisting at the
      next p: E2 -- a coordinate-defined closed base with an additive signal in the
      discrete-log coordinate. Lead outcome; routed to independent review; still no
      attack.
    - >-
      G4. Y4 gives fitted sigma below 0.9 for F_t0 at three sizes and not for NULL-1:
      E2 on the solver axis -- the split-quotient exhaustiveness prediction does not
      capture this base's solve, which would be the first such instance and must be
      understood before it is called a gain.
    - >-
      G5. All bands met (predicted): E1 -- the membership axis of KN-OPEN-020 is
      closed with a mechanism (implicit membership decouples cost from degree and
      yields nothing on the E side), and the honest headline is 'the universal no-go,
      if it exists, is a statement about solvers'.
    - >-
      G6. A blocking control fails: the run set is void.
    - >-
      G7. Budget exhaustion: infrastructure outcome under AGENTS.md rule 5.

  confounders:
    - >-
      Twist and j = 0, 1728 weights in Schoof's count: a wrong weight convention
      looks like a Y1 miss. Stage 0 fixes the convention by exact calibration.
    - >-
      Point-counting cost at toy p is not representative of SEA at cryptographic p;
      the membership cost is charged as a count of point counts, not as wall-clock,
      so that the polylog claim is read from the literature and the toy run only
      checks the count.
    - >-
      The x-coordinate intersection (H1): if x(G) were correlated with the CM j-set,
      Y1 would drift; NULL-2 at a second trace separates a global bias from a
      t0-specific one.
    - >-
      The solver arm's F4 on a dense degree-|F| membership polynomial is memory-heavy
      at |F| near 2^10; the cell is capped at p = 2^20 and the ratio, not the absolute
      time, is the metric.
    - >-
      Brute-force logs for C(p) are exact at toy scale; using a different generator
      changes k but not the max.

  interpretation_limits:
    - >-
      (S5) is a statement about which AXES a universal no-go may use; it is not a
      no-go and not an attack, and E1 does not close KN-OPEN-020, only its
      membership-cost and description-degree readings.
    - >-
      The base's floor beta >= 1/4 means it never enters the strict interior of the
      sigma-threshold's admissible region on its own; the record claims nothing about
      composite predicates beyond naming them.
    - >-
      All theorem citations are recalled; Stage 0 is where they are quoted and
      checked, and the calibration is what makes the size law load-bearing at toy
      scale.
    - >-
      Three internal records this record leans on for framing -- IDEA-20260801-021
      / IDEA-20260803-e2f5bd (Bezout bound), IDEA-20260829-bdca13 (split-quotient
      exhaustiveness) and IDEA-20260805-c4f675 (extreme-value normalisation) -- were
