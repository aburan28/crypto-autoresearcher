idea:
  id: IDEA-20260903-f7e8a6
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-dc126c
  added: '2026-09-03'
  title: >-
    THE SYMMETRIZED S_4 SYSTEM OF H002 HAS NEVER HAD ITS OWN NULL, AND THE
    NULL ABSORBS THE WHOLE 6:1 - the S_3-invariant Hilbert series of the
    membership complete intersection is (1/6)[((1-z^B)/(1-z))^3 +
    3((1-z^{2B})/(1-z^2))((1-z^B)/(1-z)) + 2(1-z^{3B})/(1-z^3)], whose value
    at z = 1 is binom(B+2, 3), the orbit count, and whose standard-graded
    semi-regular reference for the (e1, e2, e3) system with generators of
    e-degree (B-2, B-2, B-2, 4) is d_reg^sym = ceil((3B-5)/2) against the
    raw ceil((3B+9)/2): the same slope 3/2 in B and a constant offset of
    exactly 7, so symmetrization is exponent-neutral BY THE NULL and H002's
    "6:1, about 10x per doubling in both arms" has no residual to explain;
    the one measurement worth making is whether the symmetrized system's
    graded solving degree falls BELOW ceil((3B-5)/2) by an amount growing
    in B
  class: control

  claim: >-
    (A) THE SYSTEM H002 SOLVED. From inputs/h100_session/h002_symmetrized_
    gb.json: m = 3 (four-point summation polynomial S_4), raw system in
    (x1, x2, x3) with three univariate memberships of degree B (fs = 8, 12,
    16, 32, 64) and S_4 of per-variable degree 4 and total degree 12;
    symmetrized system in the elementary symmetric functions e1, e2, e3 of
    (x1, x2, x3), with S_4 rewritten as one generator of e-degree 4 with 35
    monomials (dense, binom(7,3) = 35), and membership encoded as "remainder
    of M(t) mod the e-cubic t^3 - e1 t^2 + e2 t - e3 equals 0", i.e. three
    polynomials r_0, r_1, r_2 in (e1, e2, e3) of e-degree B - 2 (recorded
    degrees 6, 10, 14, 30, 62). The recorded verdict: a horizontal shift of
    an exponentially growing trajectory, quotient dimension about 6x
    smaller, wall about 10x per doubling in both arms, exponent unchanged.
    No null for the symmetrized arm was written down.
    (B) THE INVARIANT-RING NULL, EXACT. The raw membership ideal
    J = (f_V(x1), f_V(x2), f_V(x3)) is S_3-invariant and its top-form
    quotient F_p[x]/(x1^B, x2^B, x3^B) has the monomial basis {x^alpha :
    alpha_i < B}, permuted by S_3. By Molien's theorem for the invariants of
    a graded representation (the equivariant Hilbert series averaged over
    the group; p not dividing 6), the Hilbert series of the S_3-invariant
    part is H_inv(z) = (1/6) sum_g trace(g | graded pieces) = (1/6)[ H_id +
    3 H_tau + 2 H_sigma ] with H_id = ((1-z^B)/(1-z))^3 (all monomials),
    H_tau = ((1-z^{2B})/(1-z^2)) ((1-z^B)/(1-z)) (monomials fixed by a
    transposition: alpha_1 = alpha_2), H_sigma = (1-z^{3B})/(1-z^3)
    (monomials fixed by a 3-cycle: alpha_1 = alpha_2 = alpha_3). At z = 1:
    (1/6)[B^3 + 3B^2 + 2B] = B(B+1)(B+2)/6 = binom(B+2, 3), the number of
    multisets of size 3 from V, i.e. the number of S_3-orbits on V^3 counted
    correctly at the diagonals. THIS IS H002's 6:1: the ratio
    B^3 / binom(B+2, 3) tends to 6 from above (216/120 = 1.8 at B = 8 is
    the wrong comparison because H002's "6:1" is the solution multiplicity
    6 = 3! of a planted decomposition with distinct summands versus 1, not
    the quotient dimensions; both are the same orbit-counting fact) and it
    is entirely a statement about the invariant subring. Adding the
    invariant generator S_4^sym of x-weight 12 as one shifted subtraction
    gives the weighted null [H_inv(z)(1 - z^{12})]_+, whose leading term
    (1/6) x (the raw series) makes its first non-positive coefficient sit
    at the raw d_reg in x-weight up to O(1): in WEIGHT units the
    symmetrization changes multiplicities by 1/6 and the turning degree not
    at all.
    (C) THE SOLVER'S NULL, EXACT, IN e-DEGREE. The solver grades e1, e2, e3
    all in degree 1. The three membership remainders have e-degree B - 2
    (their top e-forms contain e1^{B-2}, from t^B mod the cubic) and are a
    zero-dimensional complete intersection cutting out Sym^3(V) - so their
    top forms are a regular sequence with Hilbert series
    ((1 - z^{B-2})/(1-z))^3 - and S_4^sym has e-degree 4. Applying
    IDEA-20260808-093497's box-convolution argument verbatim with B -> B-2
    and D_S -> 4: d_reg^sym = ceil((3(B-3) + 4)/2) = ceil((3B - 5)/2). The
    raw null is d_reg^raw = ceil((3(B-1) + 12)/2) = ceil((3B + 9)/2). Since
    3B - 5 and 3B + 9 have the same parity, the difference is EXACTLY 7 for
    every B: 3 from the membership degree drop (2 per variable, times 3,
    halved) and 4 from the summation degree drop (12 -> 4, halved). Slope
    3/2 in both. At H002's sizes: B = 8: raw 17, sym 10; B = 16: raw 29,
    sym 22; B = 32: raw 53, sym 46; B = 64: raw 101, sym 94.
    (D) WHAT H002's OBSERVATIONS BECOME UNDER THIS NULL. "Quotient about 6x
    smaller": the invariant-ring dimension binom(B+2,3) against B^3, fully
    absorbed by (B). "About 10x per doubling in both arms": the null
    predicts the same slope 3/2 in the graded degree for both arms, so
    equal growth rates in the wall-time proxy are what a matched null
    predicts, not a finding. "Exponent unchanged": correct, and now BY
    DERIVATION. "Wall shift from about 25 to about 110 in B": a constant
    degree offset of 7 is a constant-factor saving in binom(3 + d, 3)^omega,
    consistent with a horizontal shift. RESIDUAL TO EXPLAIN: NONE at the
    level of the semi-regular null. The h002 JSON's "max_total_degree" of
    the OUTPUT basis (1, 2, 1, 2, 5) is the saturated proxy IDEA-20260807-
    1354d8 warns about and cannot be compared with either null.
    (E) THE ONE MEASUREMENT LEFT. Compute the graded solving degree
    d_solve^sym (exact rank, 093497's definition) of H002's symmetrized
    instances on a B-ladder and compare against ceil((3B-5)/2); do the same
    for the raw arm against ceil((3B+9)/2). TWO OUTCOMES: (I) both arms
    track their own nulls within a constant: symmetrization is a constant-
    factor lever, closed with a derivation and a measurement; (II) the
    symmetrized arm falls below its null by an amount GROWING in B while the
    raw arm tracks its null: the symmetric coordinates expose structure of
    the S_4 system the raw coordinates hide, which would be new and would
    have to survive the equal-ideal control below before belief.

  mechanism: >-
    WHY THE STANDARD-GRADED CI NULL IS THE SOLVER'S NULL AND THE WEIGHTED
    MOLIEN SERIES IS THE ORBIT-COUNTING NULL, AND WHY BOTH ARE NEEDED. The
    solver's Macaulay matrix at e-degree D has binom(D + 3, 3) columns and
    its rank behaviour under semi-regularity is governed by the e-graded
    Hilbert series of the top e-forms, which is (C). The 6:1 is a statement
    about dimensions of quotients, which is (B). The two nulls answer two
    different questions and H002 conflated them by reading a quotient-
    dimension ratio as evidence about solving cost. A weight-w monomial
    e1^a e2^b e3^c has e-degree a + b + c between w/3 and w, so the weighted
    turning degree d_reg^w (which equals the raw one up to O(1)) bounds the
    e-degree turning point between d_reg^w / 3 and d_reg^w; the standard-
    graded computation in (C) pins it at slope 3/2, the upper end, because
    the membership remainders are NOT weighted-homogeneous (f_V is not
    homogeneous, so r_j mixes weights up to B - j) and their top e-forms
    carry e1^{B-2}, the maximal-e-degree monomial of weight B - 2. A
    weighted-homogeneous membership encoding does not exist for a generic
    V, so the slope-1/2 lower end is not available; this is stated so that
    nobody reads d_reg^w / 3 as an achievable degree.
    THE EQUAL-IDEAL CONTROL. The symmetrized ideal J_sym is the vanishing
    ideal of Sym^3(V) intersected with S_4^sym = 0 (radical, split, by the
    CRT argument of cb8e46 transported to the e-coordinates, since
    Sym^3(V) is a finite set of F_p-points and the r_j generate its
    vanishing ideal - to be verified at Stage 0 by comparing dimensions).
    So, as in IDEA-20260830-ad0be4, any measured degree is a generating-set
    invariant and the sharp control is a second generating set of the SAME
    ideal with the same e-degrees and different generators (a random
    e-degree-4 polynomial vanishing on exactly the same subset of
    Sym^3(V)); if its d_solve equals the Semaev arm's, the symmetric
    coordinates expose nothing about S_4 and every number is a statistic
    of the orbit set.
    STAGE 0 CHECKS THAT COST NOTHING. (i) Evaluate H_inv at z = 1 and
    confirm binom(B+2,3) for B = 8, 16, 32, 64 (120, 816, 5984, 45760).
    (ii) Confirm that the top e-form of each r_j has e-degree B - 2 by
    computing t^B mod the cubic symbolically for B = 8. (iii) Evaluate
    both null formulas on H002's B-ladder (the table in (C)). (iv) Check
    that the h002 JSON's per-cell monomial counts for the r_j are
    consistent with weight-mixing (r_j has monomials of every weight up to
    B - j); the recorded 17/24/23 at B = 8 are NOT reconciled here and the
    reconciliation is a required Stage 0 output, not an assumption.

