  citations:
    - ref: 'inputs/h100_session/h002_symmetrized_gb.json and HYPOTHESES_100.md H002'
      provenance: internal
      claim: >-
        The exact systems, degrees, monomial counts, quotient dimensions,
        wall times and the recorded verdict of H002; no null recorded.
      verified_by: idea-generator lane C, TASK-20260903-dc126c (both read in full)
    - ref: IDEA-20260808-093497
      provenance: internal
      claim: >-
        The box-convolution derivation d_reg = ceil((m(B-1) + D_S)/2) for m
        univariate memberships of degree B and one generator of degree D_S;
        reused here with (B, D_S) -> (B-2, 4) for the symmetrized system.
      verified_by: idea-generator lane C, TASK-20260903-dc126c (read in full)
    - ref: >-
        Molien's theorem (Molien 1897; standard form in Sturmfels,
        "Algorithms in Invariant Theory", or Derksen-Kemper): the Hilbert
        series of the invariant ring of a finite group G with |G| invertible
        is the group average of 1/det(1 - z g), and the same averaging gives
        the Hilbert series of the invariants of any graded G-module
      provenance: recalled
      claim: >-
        The averaging formula used in (B) for the invariant part of the
        top-form quotient; the finite-dimensional version is elementary
        (average of the permutation characters on each graded piece).
      verified_by: null
    - ref: KN-TECH-012 and KN-LIT-031
      provenance: internal
      claim: >-
        Isotypic block decomposition of an invariant relation matrix and
        Faugere-Svartz character grading for commutative groups; named as
        what this record is not (it quotients to the invariant ring rather
        than splitting into blocks).
      verified_by: idea-generator lane C, TASK-20260903-dc126c (both read in full)
    - ref: IDEA-20260830-1a08f9
