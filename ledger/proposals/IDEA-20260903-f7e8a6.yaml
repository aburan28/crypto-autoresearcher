  assumptions:
    - >-
      p > 3 and p does not divide 6, so Molien averaging is valid; V has
      no repeated x-coordinate and no 2-torsion x-coordinate.
    - >-
      The membership remainders r_0, r_1, r_2 generate the vanishing ideal
      of Sym^3(V) (checked at Stage 0 by dimension count); if they generate
      a larger set (spurious solutions at the diagonals), the null is
      re-derived with the measured dimension.
    - >-
      The graded solving degree is 093497's exact-rank definition, never
      the output-basis degree.

  proof_search_map:
    bottleneck: >-
      The identification of the 6:1 with the invariant-ring dimension
      binom(B+2,3) / B^3 -> 1/6, which is the step converting an observed
      ratio into an orbit count with no residual.
    baseline_embedding:
      parameter_slice: >-
        The raw arm, whose null is 093497's formula at m = 3, D_S = 12; and
        the trivial group, where H_inv reduces to H_id and the offset
        vanishes.
      reproduction_check: >-
        Hand evaluation of both null formulas at B = 8 (raw 17, sym 10) and
        of H_inv(1) = 120 at B = 8; the box-convolution verification cells of
        093497 reproduced with (B-2, 4).
    observation_collision:
      observable: >-
        d_solve^sym minus ceil((3B-5)/2) as a function of B.
      distinct_preimage_search: >-
        The equal-ideal second generating set (a random e-degree-4
        polynomial with the same zero set in Sym^3(V)) is predicted to give
        the same d_solve; if it does, the observable is an orbit-set
        statistic. A collision between the Semaev arm and the random-
        support null (different zero set) at every B would say the same
        thing more weakly.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the symmetrized system is easier" by the exact statement
          "its semi-regular reference is the raw one shifted by 7 at slope
          3/2", so that any residual is a measured departure from an
          integer formula.
        predicted_gain: >-
          Converts H002's verdict from a wall-time impression into a
          derivation plus a two-outcome test.
    quantifier_order: >-
      DERIVED: FORALL B >= 4, d_reg^raw - d_reg^sym = 7 under the two
      standard-graded semi-regular nulls, and dim of the invariant top-form
      quotient = binom(B+2,3). MEASURED: FORALL cells of the B-ladder, the
      residual d_solve^sym - ceil((3B-5)/2) with a seed interval. NOT
      CLAIMED: anything about a solver that grades e_i by weight, or about
      arity above 3.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the standard grading, the symmetrized m = 3 system's
        semi-regular reference is the raw one minus 7 at every B, the 6:1
        is the invariant-ring dimension, and on the tested ladder the
        measured residual against the symmetrized null is [value]." It
        cannot certify anything at m >= 4 (invariant ring of S_4 on four
        variables, different series) or about weighted solvers.
      nearby_object_control: >-
        A random NON-symmetric S_4-shaped polynomial pushed through the same
        e-encoding (which is ill-posed) is not available; the nearby object
        is instead the symmetrized system with a random symmetric
        generator of e-degree 4 and the same zero set, on which the
        conclusion "symmetric coordinates expose S_4 structure" must fail.
    proof_obligations:
      - claim: >-
          H_inv(z) as stated, with H_inv(1) = binom(B+2,3).
        responsibility: correctness
      - claim: >-
          Top e-forms of r_0, r_1, r_2 have e-degree B - 2 and form a regular
          sequence.
        responsibility: correctness
      - claim: >-
          d_reg^sym = ceil((3B-5)/2) and the offset from the raw null is 7.
        responsibility: baseline
      - claim: >-
          The equal-ideal control reproduces the Semaev arm's d_solve or does
          not, reported either way.
        responsibility: interface
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The residual d_solve^sym(B) - ceil((3B-5)/2), and behind it the
      S_3-equivariant Hilbert series of the raw membership quotient.
    lossiness: >-
      Lossy: the equivariant series keeps only the character-multiplicity
      data of the graded quotient (three traces per degree) and the residual
      keeps one integer per B. Not a change of coordinates: the raw and
      symmetrized systems have different solution counts (6 : 1) and
      different generator degrees, and the null records exactly how much of
      that difference is forced.
    propagation: >-
      Deterministic: the equivariant series is computed from the box by
      counting fixed monomials per permutation type; the residual is read
      off one exact rank per degree.
    survival_score: >-
      Survives to any B and any curve at m = 3; dies at m >= 4 (different
      group and series) and under a weighted grading (different null).

  null_object_control: >-
    NULL-1 (the record's deliverable): the standard-graded semi-regular
    reference ceil((3B-5)/2) for the symmetrized system, forced offset 7
    from the raw null. NULL-2 (blocking, measured): random same-support
    replacement of S_4^sym with the r_j unchanged; predicted to track
    NULL-1 within a constant. EQUAL-IDEAL CONTROL (blocking): a second
    e-degree-4 generator with the same zero set in Sym^3(V); predicted to
    reproduce the Semaev arm's d_solve exactly if the observable is an
    orbit-set statistic. RAW ARM (calibration): must track ceil((3B+9)/2).
    STRUCTURAL TELL: a symmetrized residual that is the same integer at
    every B is a constant-factor effect and is the pre-registered expected
    reading; only a residual growing in B is a candidate signal.

  discriminated_from:
    - >-
      KN-TECH-012: isotypic decomposition of the RELATION matrix (linear
      algebra stage); this record concerns the decomposition ideal's
      Hilbert series and the Groebner stage.
    - >-
      IDEA-20260830-1a08f9: Galois monodromy of the m = 3 tower over the
      symmetric base; no degree, no null, no cost. Shares only the
      observation that S_{m+1} descends to the symmetric base.
    - >-
      IDEA-20260807-1ea327 and IDEA-20260807-5ddccf: invariant coordinate
      u = x^r for the CM automorphism at j = 0 and j = 1728 (a different
      group acting by scalars on one variable, invariant ring F_p[x^r]);
      here the group is S_3 permuting variables and the invariant ring is
      F_p[e1, e2, e3]. 1ea327's degree bookkeeping (norm inflation r versus
      candidate deflation r^2) is the analogue of the offset computed here,
      in a different group.
    - >-
      Lane A corner A3 (symmetrization versus smallness under lattice
      windows): not filed on; this record has no lattice, no smallness and
      no Coppersmith condition.
    - >-
      IDEA-20260808-093497: supplies the raw null; this record supplies the
      symmetrized one by the same argument and claims no priority on the
      argument.

  predictions:
    - metric: >-
        H_inv(1) at B in {8, 16, 32, 64}
      direction: different
      minimum_effect: >-
        EXACTLY 120, 816, 5984, 45760. Arithmetic; any other value is a
        transcription error in the series.
    - metric: >-
        d_reg^raw - d_reg^sym from the two null formulas, every B
      direction: different
      minimum_effect: >-
        EXACTLY 7 at every B >= 4. Zero tolerance.
    - metric: >-
        graded d_solve of the raw arm on H002's instances against ceil((3B+9)/2)
      direction: different
      minimum_effect: >-
        Within a constant c_raw in {-2, ..., 2} across the ladder
        (calibration of the instrument on the arm whose null is committed).
    - metric: >-
        graded d_solve of the symmetrized arm against ceil((3B-5)/2)
      direction: different
      minimum_effect: >-
        OUTCOME I when the residual is constant in B within seed noise
        (expected). OUTCOME II when the residual is negative and its
        magnitude grows with B over at least three sizes with the equal-
        ideal control NOT reproducing it. A residual that the equal-ideal
        control reproduces is an orbit-set statistic and is Outcome I.
    - metric: >-
        Stage 0 reconciliation of the r_j monomial counts (17, 24, 23 at B = 8)
      direction: different
      minimum_effect: >-
        Reported. A count that cannot be reproduced from the remainder
        construction means the H002 encoding differs from the one derived
        here and the null must be re-derived for the encoding actually
        solved.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the deliverable): the series, the orbit-count
      identity, the two null tables on H002's ladder, the e-degree of the
      r_j top forms, and the monomial-count reconciliation. STAGE 1 (hours):
      regenerate H002's five instances from the recorded (p, a, b, factor
      base, planted x, xR) - the JSON records all of them - and compute the
      graded solving degree of both arms by exact rank (093497's
      instrument), with NULL-2 and the equal-ideal control per cell, at
      B in {8, 12, 16} where the raw arm is affordable and at B in {32, 64}
      for the symmetrized arm alone. STAGE 2 (zero compute): residual table,
      outcome label. The cheapest valid discriminator is Stage 0 plus the
      B = 8 and B = 12 cells: they already fix whether the symmetrized arm
      sits at its null (10, 16) or below it.
    controls:
      - 'raw-arm calibration against the committed null (blocking)'
      - 'NULL-2 random same-support symmetric generator (blocking)'
      - 'equal-ideal second generating set with the same zero set (blocking)'
      - 'H002 instance regeneration checked against the recorded quotient dimensions'
      - 'exact-rank d_solve only; the output-basis degree is recorded but never compared'
    required_metrics:
      - 'H_inv(1) and both null values per B'
      - 'graded d_solve per arm per cell with seed interval'
      - 'residual per arm per B'
      - 'equal-ideal control d_solve per cell'
      - 'Stage 0 monomial-count reconciliation'
      - 'column counts, peak RSS, wall time'

  falsification_conditions:
    - >-
      The orbit-count identity or the offset-7 arithmetic fails at Stage 0.
      The derivation is wrong and is restated before anything runs.
    - >-
      The raw arm does not track ceil((3B+9)/2). The instrument or the
      committed null is off and no symmetrized number is read.
    - >-
      OUTCOME I (expected): the symmetrized residual is constant; H002's
      6:1 is closed as orbit counting and symmetrization is a constant
      offset of 7 degrees at m = 3.
    - >-
      OUTCOME II: a residual growing in B, not reproduced by the equal-
      ideal control; routed to independent review as a candidate
      symmetric-coordinate structure, with lane A's A3 and KN-LIT-004 as
      the records to reconcile before belief.
    - >-
      The equal-ideal control reproduces any residual: orbit-set statistic;
      no coordinate claim.

  confounders:
    - >-
      WEIGHT MIXING. The r_j are not weighted-homogeneous; the standard-
      graded null is the right one for the solver, but a weight-aware
      solver would see a different null, and the record says which is
      which.
    - >-
      DIAGONAL SOLUTIONS. Sym^3(V) includes multisets with repeated
      elements, which the raw system also has (x_i = x_j); the dimension
      count at Stage 0 detects any mismatch between the r_j's zero set and
      Sym^3(V).
    - >-
      TOY VARIETIES. H002's own caveat: planted decompositions plus a
      handful of accidental ones; the graded degrees are generating-set
      properties of tiny-variety ideals (cb8e46) and are read as such.
    - >-
      SINGLE SEED. H002 used one instance per size; Stage 1 adds seeds.

  interpretation_limits:
    - >-
      A null for one presentation at m = 3; no attack, no exponent, no
      yield statement. The offset 7 is a constant-factor saving in a method
      already dominated by rho.
    - >-
      Standard grading only; m = 3 only; toy scale.
    - >-
      No status change to any H002-derived record; the closure of the 6:1
      is a derivation offered to the Coordinator.

  heuristic_assumptions:
    - id: H1
      statement: >-
