idea:
  id: IDEA-20260812-c49409
  question_id: RQ-ECDLP-912694
  added: '2026-08-12'
  proposed_by: idea-generator
  status: proposed
  class: measurement

  title: >-
    The automorphism locus of an ordinary F_p-isogeny class is ONE vertex, it is
    reached by VERTICAL ascent rather than horizontal search, and the sqrt(3)
    rho discount waiting there survives charging exactly when the CM conductor is
    smooth - which makes it the only known within-class ECDLP cost difference and
    puts a Dickman-de Bruijn density on its availability.

  object: >-
    TRACKED OBJECT. The automorphism-order function E prime -> |Aut_{F_p}(E prime)|
    on the F_p-isogeny class, carried together with the vertical (conductor)
    coordinate of each vertex. The projection keeps one integer in {2, 4, 6} per
    vertex plus the vertex's level in the volcano; everything else about the
    curve is discarded. Established families declared off-limits as the primary
    lens - isogeny transfer to a weak destination (EV-ECDLP-b3e847, closed), the
    graph spectrum (IDEA-20260806-bcbcf5, wrong null), Semaev heavy-tail screens
    (IDEA-20260731-016), the isogeny-graph query model (IDEA-20260806-d5a34e),
    minimum-height representatives (IDEA-20260726-009). Candidate objects
    enumerated and scored on (new / one-step propagation definable and measurable
    / survival depth) - the j-invariant (repackaging / testable / dissolves, it
    is a label with no cost content); the endomorphism ring as an order
    (known, this is Kohel's volcano / testable / survives the whole class but is
    already fully mapped); the group order (class-invariant by Tate, dead on
    arrival); the AUTOMORPHISM-ORDER FUNCTION with its vertical coordinate (new
    as a cost object here / testable, its one-step propagation under an
    ell-isogeny is decided by whether the step lands on the crater / survives the
    whole class and is a delta function on it, which is the finding); the
    Weierstrass coefficient vector (tested and closed by ISO-EXP-A2). The
    automorphism-order function is the lens. KN-OPEN-019 records that no written
    object-enumeration for the ECDLP exists in this programme, so the above is a
    sketch and not a taxonomy.

  lossy_projection_test: >-
    The projection E prime -> (|Aut(E prime)|, volcano level) is violently lossy -
    it keeps about four bits per vertex out of a full curve equation. What it
    discards is discarded COMPATIBLY with the operation the target performs - an
    ell-isogeny step changes the volcano level by a determined amount (up, down or
    sideways, decided by Kohel's criterion on the kernel), and |Aut| is determined
    by whether the resulting level is the crater AND the fundamental discriminant
    is -3 or -4. So the retained part propagates deterministically under isogeny
    steps. It is not a change of coordinates - one cannot recover the curve from
    two small integers. NOTE that this is exactly the shape IDEA-20260811-10eacc
    calls a functional on a Cl(O)-torsor; here the functional is a delta function
    supported on one vertex, which is the most structured possible case and the
    reason it is worth measuring rather than Fourier-analysing.

  claim: >-
    Let E/F_p be ordinary with prime N = #E(F_p), Delta = t^2 - 4p = f^2 * D_K
    with D_K the fundamental discriminant. Four statements, D1-D4.

    (D1) LOCUS SIZE. The F_p-isogeny class of E contains a vertex with extra
    automorphisms if and only if D_K is -3 or -4, and in that case it contains
    EXACTLY ONE such vertex - the unique crater vertex - because h(-3) = h(-4) = 1.
    So the automorphism locus of a class is either empty or a single point out of
    a class of size of order h(Z[pi]) = p^{1/2 + o(1)}.

    (D2) LEAVING THE LOCUS, WHICH IS RQ-ECDLP-912694 STATED EXACTLY. From the
    j = 0 crater vertex (D_K = -3, p congruent to 1 mod 3), every F_p-rational
    isogeny of odd prime degree ell leaves the automorphism locus - the codomain
    has |Aut| = 2 - EXCEPT for the isogeny whose kernel is the ramified prime
    ideal above 3, which is principal (generated by an element of norm 3) and
    therefore returns to j = 0. The predicted exceptional-prime boundary is
    therefore ell = 3 and nothing else among the odd degrees, and for the
    j = 1728 vertex (D_K = -4) the analogous ramified prime is 2, which is even
    and hence outside this question's declared odd-degree scope, so NO odd
    exceptional degree is predicted there. This is a finite, exactly checkable
    prediction at the question's own declared bit sizes.

    (D3) REACHING THE LOCUS COSTS A VERTICAL ASCENT, NOT A HORIZONTAL SEARCH.
    Because the crater carries a single vertex, an attacker handed an arbitrary
    class member does NOT have to solve a vectorization problem to find the
    special-j curve - ascending the volcano suffices, and ascent is a local,
    greedy procedure (Kohel's criterion at each step) of length sum over ell
    dividing f of v_ell(f), at a per-step cost governed by ell. The reach cost is
    therefore controlled by the SMOOTHNESS OF f, not by the class size
    p^{1/2}. This is the structural point of the record and it is what
    distinguishes this cell from every other within-class question.

    (D4) THE CHARGED SAVING, AND WHEN IT SURVIVES. Transport of the DLP instance
    along the ascent is injective on the prime-order group (every ell dividing f
    is coprime to N), so the instance is preserved. On the crater vertex Pollard
    rho may be run modulo the full automorphism group, giving a step count lower
    by exactly sqrt(3) for j = 0 and sqrt(2) for j = 1728 relative to the
    negation-only baseline. The end-to-end charged saving is therefore POSITIVE
    exactly when the ascent cost plus the cost of extracting f from
    4p - t^2 is below (1 - 1/sqrt(3)) * 0.886 * sqrt(N)/sqrt(2) charged field
    multiplications, and NEGATIVE when f carries a prime factor large enough that
    one vertical step exceeds that budget. Since f is of size about sqrt(4p/3),
    the availability of the saving is governed by a smoothness probability and
    is predicted to follow the Dickman-de Bruijn rho function.

    WHAT THIS IS AND IS NOT. It is a CONSTANT FACTOR of at most 1.733. It moves
    no exponent and it is not an attack. Its value is that it is, as far as this
    corpus records, the ONLY within-class ECDLP cost difference that exists at
    all, so it is the precise counterexample that obstruction 4 of EV-ECDLP-b3e847
    must be phrased to survive - the correct statement of obstruction 4 is
    "no member is cheaper BY AN EXPONENT", not "no member is cheaper". It does
    NOT apply to P-256, whose fundamental discriminant is about -2^258 and whose
    conductor is 1 (ISO-EXP-001), and it does not apply to P-224 for the same
    reason.

  mechanism: >-
    Two independent facts collide. First, the class number of the two special
    discriminants is one, so the automorphism locus cannot be spread across the
    crater - it is a single vertex, and a single vertex on a crater with one
    element is reachable without any horizontal search at all. Second, the only
    within-class quantity that is NOT fixed by the Frobenius trace and that has a
    direct effect on rho's step count is |Aut|, because the rho step count
    depends on the size of the quotient of the group by the cheap maps available,
    and every other cheap-map source (the group order, the embedding degree, the
    CM field) is class-invariant by Tate. Putting the two together - the one
    non-invariant cost quantity sits at exactly one vertex, and that vertex is
    reachable by ascent whose cost is a smoothness question about f. The
    mechanism therefore predicts a sharp dichotomy driven by a number-theoretic
    smoothness statistic rather than by anything about the DLP.

  novelty_status: adaptation
  novelty_note: >-
    CORPUS CHECKED, WEB NOT AVAILABLE. WebSearch returned a backend model error
    for every query this session; no external source was verified and no KN-LIT
    entry is written. Near neighbours checked individually. IDEA-20260726-010
    (hidden-CM curves) measures the DENSITY of a small square-free part of
    t^2 - 4p and asks whether such curves are weaker via the Semaev meter; it
    does not observe that the automorphism locus is a single vertex, does not
