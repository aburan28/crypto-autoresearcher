    external literature - the assembly D1 + D3 + D4 into a charged within-class
    cost statement, and the Dickman-de Bruijn availability law for it.

  assumptions:
    - >-
      E/F_p ordinary with prime N = #E(F_p) so that the DLP instance transports
      injectively along every ell-isogeny with ell dividing f (all such ell are
      coprime to N). Composite N is out of scope.
    - >-
      p congruent to 1 mod 3 for the D_K = -3 arm and p congruent to 1 mod 4 for
      the D_K = -4 arm, so that the extra automorphisms are F_p-RATIONAL. An
      automorphism defined only over an extension gives no rho discount over
      F_p, and the extension-field special-j controls named in RQ-ECDLP-912694's
      scope are included exactly to demonstrate that.
    - >-
      Kohel's criterion for identifying the ascending ell-isogeny at a vertex is
      implemented and independently checked against the computed endomorphism
      ring at each level, rather than trusted.
    - >-
      The cost arm (D4) requires N large enough for a rho step count to be
      measurable, i.e. roughly 20 to 28 bits, which EXCEEDS RQ-ECDLP-912694's
      declared bit sizes of 7, 8 and 9. THIS IS FLAGGED, NOT ASSUMED - the
      structural arm (D1, D2) fits the question's declared scope exactly and can
      be run alone; the cost arm needs an explicit Coordinator scope decision and
      must not be executed under the existing scope by default.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks;
      every claimed solve carries an independently re-verified certificate.

  proof_search_map:
    bottleneck: >-
      The reach cost. Everything else here is bookkeeping - the discount is
      classical and the locus size is a class-number fact. What decides whether
      the cell is a real within-class cost difference or a curiosity is whether
      the special vertex can be reached for less than the discount is worth, and
      that is a smoothness question about f that nobody in this corpus has
      charged.
    baseline_embedding:
      parameter_slice: >-
        Setting D_K outside {-3, -4} empties the locus and the whole record
        collapses to "no within-class difference", which is exactly the standing
        claim of EV-ECDLP-b3e847 obstruction 4. The standing closure is therefore
        recovered as an exact parameter slice of this frame rather than being
        contradicted by it.
      reproduction_check: >-
        Frozen regression fixture - on a class with D_K outside {-3, -4} the
        measured |Aut| must be exactly 2 at every vertex and the measured rho
        step count must be flat across vertices within the seed band. This is
        computed and frozen before the special-j arm is read, and it is the same
        prediction EXP-ISOU-2ac81f makes for its generic band, so the two
        instruments can be cross-checked against each other.
    observation_collision:
      observable: >-
        The pair (|Aut| at a vertex, charged cost of reaching that vertex from a
        given class member).
      distinct_preimage_search: >-
        Search for two vertices with the same observable but different end-to-end
        cost - which would mean |Aut| and reach cost do not determine the saving
        and some third quantity is at work. Search also for two classes with the
        same D_K but different f-smoothness and hence different availability; if
        their end-to-end costs coincide, the smoothness mechanism is not
        operative and D4 is wrong. Both searches are executed on the sampled
        classes, not argued.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The subfamily D_K in {-3, -4} with f smooth, specialised out of the
          general ordinary family, measured, and packed back as a stated
          exception to the within-class uniformity claim.
        predicted_gain: >-
          A constant factor of at most sqrt(3) = 1.733 on rho, available on a
          subfamily of density about 1/sqrt(p) among random curves and further
          restricted by the smoothness of f. Explicitly not an exponent.
      - transform: boundary_lift
        proposed_object: >-
          The exceptional-prime boundary ell = 3 for the j = 0 locus, lifted from
          "the isogeny may or may not leave the locus" to "the isogeny leaves the
          locus unless its kernel is the ramified prime above 3".
        predicted_gain: >-
          It answers RQ-ECDLP-912694's decision target - the split/non-split and
          exceptional-prime boundary - with a finite check rather than a survey.
    quantifier_order: >-
      FOR ALL ordinary classes with D_K in {-3, -4}, FOR ALL class members E
      prime, THERE EXISTS a vertex (the unique crater vertex) with |Aut| > 2 and
      a path to it of length sum of v_ell(f); and FOR ALL odd primes ell and ALL
      F_p-rational ell-isogenies from that vertex, the codomain has |Aut| = 2
      UNLESS ell = 3 and the kernel is the ramified ideal. The order matters -
      the class is fixed first by the given curve, and the exceptional degree is
      quantified over ALL odd primes rather than exhibited for a convenient one.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale, certificate-carrying, complete-class statement for the
        sampled classes - the locus has one vertex, the exceptional odd degree is
        exactly 3 for j = 0, and the measured end-to-end saving is positive
        exactly on the smooth-f cells with the measured threshold. It cannot
        certify anything about cryptographic p, cannot certify a density law from
        a finite sample (only consistency with one), and cannot be read as
        evidence about P-256 or P-224, neither of which is in the covered family.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS - crater curves
        with D_K in {-7, -8, -11}, which have a SMALL-DEGREE endomorphism (norm 2
        or 3) but |Aut| = 2. They are the sharpest possible control - a
        small-degree endomorphism is present and no rho discount is predicted,
        because the discount needs an INVERTIBLE map and not merely a cheap one.
        A measurement that shows a discount there is measuring something other
        than |Aut| and the whole reading is void. A second nearby object -
        special-j curves over an extension field where the named automorphism is
        NOT F_p-rational, which RQ-ECDLP-912694's own scope already names.
    proof_obligations:
      - claim: h(-3) = h(-4) = 1 hence the locus is a single crater vertex
        responsibility: size
      - claim: >-
          Every odd-degree rational isogeny from j = 0 leaves the locus except
          the ramified prime above 3
        responsibility: strictness
      - claim: >-
          The crater vertex is reachable by greedy vertical ascent with no
          horizontal search
        responsibility: feasibility
      - claim: >-
          The DLP instance transports injectively along the ascent, so the
          instance is preserved
        responsibility: correctness
      - claim: >-
          Ascent cost plus the cost of extracting f is below the discount exactly
          on smooth-f cells
        responsibility: runtime
      - claim: >-
          The instrument shows NO discount at D_K in {-7, -8, -11}
        responsibility: feasibility

  predictions:
    - metric: >-
        number of vertices with |Aut| > 2 in a complete F_p-isogeny class with
        D_K in {-3, -4}
      direction: same
      minimum_effect: >-
        Exactly 1, on every sampled class, with zero exceptions. Two or more
        falsifies D1 and indicts either the class-number computation or the
        F_p-isomorphism deduplication (twists share j and must not be merged).
    - metric: >-
        fraction of F_p-rational odd-degree ell-isogenies from the j = 0 vertex,
        over ell in {3, 5, 7, 11, 13}, whose codomain still has |Aut| = 6
      direction: same
      minimum_effect: >-
        Exactly the isogenies with ell = 3 whose kernel is the ramified ideal,
        and no others. Any ell greater than 3 producing a codomain with |Aut| = 6
        falsifies D2 and is the interesting outcome for RQ-ECDLP-912694.
    - metric: >-
        measured Pollard rho group-operation count at the crater vertex divided
        by the count at a matched floor vertex of the same class, both on
        identical seeds and in a common coordinate system
      direction: lower
      minimum_effect: >-
        1/sqrt(3) = 0.577 plus or minus 0.08 for the j = 0 arm and
        1/sqrt(2) = 0.707 plus or minus 0.08 for the j = 1728 arm. A ratio of
        1.00 means the discount is not being realised by the implementation and
        the cost arm is void; a ratio below 0.4 means something beyond the
        automorphism quotient is happening and requires independent review.
    - metric: >-
        end-to-end charged cost (ascent + crater solve) divided by floor-vertex
        solve cost, split by whether f is B-smooth for the measured B
      direction: different
      minimum_effect: >-
        Below 1.0 on the smooth-f cells (a real saving) and above 1.0 on the
        rough-f cells (the ascent eats the discount), with the split explained by
        the largest prime factor of f. A single sign across both cells falsifies
        D4's mechanism.
    - metric: >-
        measured rho ratio at the D_K in {-7, -8, -11} control vertices
      direction: same
      minimum_effect: >-
        1.00 plus or minus 0.08. Any discount there means the meter is not
        measuring |Aut| and every other reading is void.

  minimal_test:
    design: >-
      TWO ARMS, separable, and the first fits RQ-ECDLP-912694's declared scope
      exactly. ARM S (structural, bit sizes 7-9, degrees ell in {3,5,7,11,13},
      exact enumeration). Enumerate ordinary curves over primes of 7 to 9 bits
      with D_K in {-3, -4}; for each, enumerate the complete F_p-isogeny class up
      to F_p-ISOMORPHISM by exact point enumeration and odd-degree Velu
      quotients; count vertices with |Aut| > 2; from the special vertex, compute
      every F_p-rational ell-isogeny for each ell and record the codomain's
      |Aut| and whether the kernel is the ramified ideal; every kernel and
      quotient carries an independent curve-membership certificate as
      RQ-ECDLP-912694 requires. ARM C (cost, REQUIRES A COORDINATOR SCOPE
      DECISION because it needs 20-28 bit primes). For at least six classes with
      D_K in {-3, -4} spanning smooth and rough f - freeze one DLP instance,
      transport it to the crater vertex along the greedy ascent, run matched
      Pollard rho at the floor vertex (negation only) and at the crater vertex
      (full automorphism quotient) on identical seeds and in a common coordinate
      system, and charge the ascent in field multiplications including the
      extraction of f from 4p - t^2. Report the three ratios and the smoothness
      split.
    controls:
      - >-
        NULL OBJECT, MANDATORY - crater vertices with D_K in {-7, -8, -11}, which
        possess a small-degree endomorphism but |Aut| = 2. The identical
        measurement must show NO rho discount there. This is the object of the
        same shape (a crater vertex with distinguished endomorphism structure)
        that should show no effect, and it discriminates "the discount comes from
        |Aut|" from "the discount comes from being on the crater".
      - >-
        SECOND NULL - a complete class with D_K outside {-3, -4} entirely, where
        the locus is empty and the rho count must be flat across vertices within
        the seed band. This is also the baseline_embedding reproduction fixture
        and it cross-checks against EXP-ISOU-2ac81f's predicted generic null.
      - >-
        POSITIVE CONTROL, BLOCKING - the crater vertex measured against ITSELF
        with the automorphism quotient switched off. The ratio must come out
        1/sqrt(3) purely from switching the quotient on, on the same curve and
        the same seeds. This proves the meter can see an automorphism discount
        before any between-vertex comparison is read.
      - >-
        EXTENSION-FIELD CONTROL, named in RQ-ECDLP-912694's own scope - special-j
        curves where the automorphism is not F_p-rational; no discount predicted
        over F_p.
      - >-
        SEED DISPERSION BAND computed on the floor vertex under all 16 seeds and
        frozen before any between-vertex comparison.
      - >-
        MODEL NORMALISATION - the rho ratio is measured with both vertices in ONE
        common coordinate system, so the group-operation count cannot be
        contaminated by model choice; the per-operation field cost is reported
        separately. Mixing the two is the primary way this measurement could
        report a fake saving, and EXP-ISOU-2ac81f's Q1/Q2 separation is adopted
        verbatim.
      - >-
        CERTIFICATE CONTROL - every claimed solve and every isogeny edge
        independently re-verified by code sharing no state with the producer.
    required_metrics:
      - vertices with |Aut| > 2 per class, with the F_p-isomorphism deduplication log
      - >-
        per-degree table of codomain |Aut| from the special vertex, with kernel
        identification (ramified / split / inert / descending)
      - >-
        exact conductor f, its complete factorisation, and its largest prime
        factor, per class
      - >-
        matched rho group-operation counts at floor and crater vertices, per seed,
        with the seed band
      - >-
        charged ascent cost in field multiplications, itemised by step, plus the
        charged cost of extracting f
      - end-to-end ratio with the smoothness split
      - the same metrics on both null objects and the positive control
      - certificate verification fraction; must be 1.0

  falsification_conditions:
    - >-
      A class with D_K in {-3, -4} containing two or more vertices with
      |Aut| > 2. D1 is false; the class-number fact or the deduplication is
      wrong.
    - >-
      An F_p-rational isogeny of odd degree ell greater than 3 from the j = 0
      vertex whose codomain still has |Aut| = 6. D2 is false and
      RQ-ECDLP-912694's exceptional-prime boundary is not where predicted - which
      is a direct, useful answer to that question in the unexpected direction.
    - >-
      The measured rho ratio at the crater vertex is 1.00 within the seed band
      while the positive control shows the discount. The discount exists on the
      curve but is not realised by transport - meaning the instance transport or
      the quotient implementation is defective, and the cost arm is void.
    - >-
      The end-to-end ratio has the same sign on smooth-f and rough-f cells. D4's
      mechanism is wrong; the reach cost is not governed by the smoothness of f.
    - >-
      Any discount at the D_K in {-7, -8, -11} null. The meter is not measuring
      |Aut| and every reading is void.
    - >-
      The end-to-end ratio falls below 1/sqrt(3) on any cell. Something beyond
      the automorphism quotient is contributing, which would be a genuine
      within-class finding and requires independent review before description.

  confounders:
    - >-
      Twists share a j-invariant and have different traces; deduplicating class
      vertices by j alone will both merge distinct vertices and drag in curves
      from other classes, corrupting D1 in both directions.
    - >-
      The rho discount at |Aut| = 6 requires fruitless-cycle handling; a naive
      implementation loses the discount to cycle escapes and will report ratio
      1.00 for an implementation reason. The positive control exists to catch
      exactly this, and fruitless-cycle incidence is counted and reported.
    - >-
      The a = -3 Jacobian model may be reachable at one vertex and not the other,
      which changes field multiplications per group operation by a constant and
      would contaminate a wall-clock or field-op ratio. Group operations are
      compared in a common coordinate system and per-operation cost is reported
      separately (EXP-ISOU-2ac81f's Q1/Q2 separation).
    - >-
      Extracting f from 4p - t^2 requires factoring an integer of size about
      sqrt(p); at toy scale this is free and at cryptographic scale it is
      subexponential. Charging it as free at toy scale and quietly extrapolating
      would be the single most misleading thing this record could do, and the
      charge is reported as a separate line item with its scaling stated.
    - >-
      Classes with D_K in {-3, -4} are rare (density about 1/sqrt(p) among random
      curves); a sample selected by searching for them is NOT a random sample and
      no density claim may be read off the cost arm.
    - >-
      At 7-9 bits the class may be so small that "ascent" is a single step or
      none, making D3's mechanism untestable in Arm S alone. Arm S tests D1 and
      D2 only; D3 and D4 belong to Arm C and this separation is structural, not
      cosmetic.

  interpretation_limits:
    - >-
      Toy scale, claim tier toy. Nothing here is evidence about P-256 or P-224,
      neither of which has D_K in {-3, -4}; both are explicitly outside the
      covered family.
    - >-
      The saving is a CONSTANT FACTOR of at most 1.733. It moves no exponent and
      is not an attack. Its role is to make obstruction 4 of EV-ECDLP-b3e847
      precise - "no member is cheaper by an exponent" survives, "no member is
      cheaper" does not.
    - >-
      A positive end-to-end result on smooth-f cells is a statement about a
      subfamily of density about 1/sqrt(p) that is further thinned by the
      smoothness condition. It is not a statement about deployed curves and must
      not be reported as one.
    - >-
      Arm C exceeds RQ-ECDLP-912694's declared bit sizes and requires an explicit
      Coordinator scope decision. Running it without one would silently widen a
      question's declared scope, which this record refuses to do.
    - >-
      Timeouts, crashes and infrastructure failures are never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H-AUT-1
      statement: >-
        For ordinary curves with D_K in {-3, -4}, the conductor
        f = sqrt((4p - t^2)/|D_K|) behaves like a uniformly random integer of its
        size with respect to smoothness, so the probability that f is B-smooth is
        rho(u) with u = log f / log B, rho the Dickman-de Bruijn function. The
        availability of the charged saving is therefore rho(u) at the B for which
        the ascent budget is met.
      rigorous_support: >-
        Rigorous ingredients - f is determined exactly by (p, t) through
        4p - t^2 = |D_K| f^2, so f is an explicitly computable integer of size
        about sqrt(4p/|D_K|), and the ascent length is exactly the sum of
        v_ell(f) with per-step cost a known function of ell. Distribution
        imitated - the Canfield-Erdos-Pomerance / Dickman-de Bruijn smoothness
        law for uniformly random integers of a given size, which is the same
        imitation Wesolowski's p^{1/3+o(1)} argument makes for its degree
        splitting (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md).
      validation_plan: >-
        Enumerate ALL (p, t) with D_K in {-3, -4} over primes in [2^16, 2^28]
        (this is a thin but completely enumerable family, since 4p = t^2 + 3f^2
        parametrises it), factor each f completely, and compare the empirical CDF
        of u = log f / log B against rho(u) for B in a declared grid, by a
        Kolmogorov-Smirnov statistic. Tail check - the SMOOTHEST observed f in
        the sample against the rho(u) prediction for the sample size; an excess of
        smooth conductors would mean the saving is more available than predicted
        and is the interesting direction. Sampled parameters and the enumeration
        bounds are recorded. TRANSFER ASSUMPTION STATED EXPLICITLY - f here is
        constrained by a quadratic form (4p = t^2 + |D_K| f^2) and is therefore
        NOT a uniformly random integer; the record predicts consistency with
        Dickman but flags the constraint as the most likely source of deviation,
        and a measured deviation is a finding rather than a defect.
    - id: H-AUT-2
      statement: >-
        Pollard rho on the crater vertex quotiented by the full automorphism
        group of order 2m has expected step count 0.886*sqrt(N/m)*(1 + o(1)), so
        the discount relative to the negation-only baseline is exactly sqrt(m) -
        sqrt(3) for j = 0 and sqrt(2) for j = 1728 - once fruitless cycles are
        handled.
      rigorous_support: >-
        Rigorous ingredient - the automorphism group acts freely on the nonzero
        points of a prime-order group, so the quotient has exactly (N-1)/(2m)
        elements. Distribution imitated - the birthday bound under the
        idealisation that the quotient walk is a random function, i.e. the
        classical automorphism-quotient analysis relayed by KN-TECH-018
        (Wiener-Zuccherato, Duursma-Gaudry-Morain; attributions NOT re-verified
        this session).
      validation_plan: >-
        Measured on the positive control before any between-vertex comparison -
        the same curve with the quotient on and off, 16 seeds, and the measured
        ratio compared against the point prediction 1/sqrt(3) with a 15 percent
        band. Fruitless-cycle incidence counted and reported separately, because
        the escape mechanism is itself a charged cost. Tail check - the fastest
        and slowest seeds against the birthday dispersion. Toy scale; no transfer
        claimed.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED. The claim is a constant factor of at most sqrt(3) = 1.733
      on the rho constant, available on a subfamily of density about 1/sqrt(p)
      thinned further by the smoothness of f. This is stated as a limitation and
      as the reason the record is not target-class under
      docs/target-result-profile.md; it is offered as a building block that makes
      the standing closure's phrasing correct, not as an exponent result.
    memory_exponent: >-
      O(1) for the rho arms; sqrt(N) for the matched BSGS baseline. The ascent
      needs O(log f) memory.
    best_known: >-
      Pollard rho with negation at 0.886*sqrt(N)/sqrt(2) group operations and
      O(1) memory (KN-TECH-001, KN-TECH-006). On the crater vertex the best known
      is already the automorphism-discounted variant (KN-TECH-018) - this record
      does not beat that, it measures whether the discounted vertex is REACHABLE
      for less than the discount is worth, which is the part nobody has charged.
    hidden_overhead: >-
      Three disclosed items - extracting f requires factoring an integer of size
      about sqrt(p), free at toy scale and subexponential at cryptographic scale;
      the ascent cost per step scales like a modular-polynomial evaluation at the
      step's degree, so one large prime factor of f can dominate everything; and
      the sqrt(3) figure assumes fruitless cycles are handled at negligible cost,
      which is measured rather than assumed.
    tradeoff_note: >-
      van Oorschot-Wiener parallelisation applies unchanged at both vertices, so
      the constant-factor comparison is parallelisation-neutral. The ascent is a
      one-time preprocessing cost per curve and therefore AMORTISES over multiple
      DLP instances on the same curve - which is the one regime where this
      constant is worth more than it looks, and it is called out here rather than
      left implicit.

  dominated_by: >-
    On the crater vertex the automorphism-discounted Pollard rho (KN-TECH-018) is
    the incumbent and this record does not beat it - it charges the path to it.
    On the floor vertex plain rho with negation dominates. Frontier rows checked
    as recorded in this corpus - BSGS (sqrt(N) time / sqrt(N) memory); van
    Oorschot-Wiener parallel rho; the multi-target frontier sqrt(L*N)
    (Kuhn-Struik, relayed via IDEA-20260802-005); the preprocessing frontier
    S*T^2 = Omega(epsilon*N) (Corrigan-Gibbs and Kogan, relayed via
    IDEA-20260802-005). Every row dominates on the exponent, so `null` is not
    available and is not written. The two external frontier citations were NOT
    independently re-verified this session because web search was unavailable.
  sota_delta:
    time_exponent: >-
      0 (no change). not_applicable as an exponent claim, said plainly.
    memory_exponent: 0 (no change).
    data_or_query_exponent: >-
      0. The ascent is preprocessing on public data with no oracle queries; it
      amortises over instances on the same curve, which is recorded in the
      tradeoff note rather than converted into a query exponent.
    note: >-
      The quantitative delta is a constant factor of at most 1.733 in the rho
      step count, available only on classes with D_K in {-3, -4} and only when
      the conductor is smooth enough that the ascent is cheaper than the saving.
      Dressing this as an exponent would be dishonest and it is not done. The
      delta that matters is evidentiary - it supplies the one measured
      counterexample that fixes the phrasing of obstruction 4 in EV-ECDLP-b3e847.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    Arm S at 7-9 bits is exact enumeration and runs in seconds; it is the arm
    that answers RQ-ECDLP-912694 as declared. Arm C at 20-28 bits with 16 seeds
    and six classes is a few CPU-hours at most and requires the scope decision
    flagged above. The conductor-smoothness enumeration for H-AUT-1 over
    [2^16, 2^28] is a bounded sieve plus factorisations of sqrt(p)-sized
    integers - minutes to an hour.
  recommended_priority: medium

  relation_to_existing_records:
    measures_the_cell_segregated_by: >-
      EXP-ISOU-2ac81f control special_j_segregation, which excludes j = 0 and
      j = 1728 members from its generic band precisely because their automorphism
      discount would manufacture a false positive. This record measures that
      excluded cell on purpose, and the two must be read together for the census
      to mean what it says.
    sharpens: >-
      EV-ECDLP-b3e847 obstruction 4, by supplying the exact exception its phrasing
      must survive.
    distinct_from: >-
      IDEA-20260726-010 (hidden-CM density and Semaev weakness);
      IDEA-20260731-017 (vertical Semaev meter discontinuity);
      IDEA-20260805-38aebb (vertical conservation law).
