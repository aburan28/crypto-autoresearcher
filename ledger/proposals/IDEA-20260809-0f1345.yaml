idea:
  id: IDEA-20260809-0f1345
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    Measure the official test vectors' coverage of the divergence space — the
    number that explains why this class of defect survives every conformance
    suite
  class: measurement
  claim: >-
    The official Ed25519 test vectors exercise approximately none of the
    enumerated divergence classes: their coverage, measured as the fraction of
    predicate-lattice pairs that any vector separates, is near zero. That number
    is the mechanistic explanation for why divergent verification survives
    conformance testing everywhere, and it is directly computable once the
    candidate space and the predicate lattice exist.
  mechanism: >-
    For each official vector, compute its predicate outcome vector. A vector
    separates two lattice points only if its outcomes differ between them.
    Coverage is the fraction of lattice-point pairs separated by at least one
    official vector.
  why_not_a_renamed_known_approach: >-
    Test-suite coverage is a standard software concept; applying it to a
    CRYPTOGRAPHIC SEMANTIC LATTICE rather than to code lines is the move. The
    output is not "the tests are incomplete" but an exact fraction over a
    well-defined space, which is what makes it a finding rather than an opinion.
  predictions:
  - observable: fraction of lattice-point pairs separated by at least one official vector
    metric: fraction in [0,1]
    predicted: >-
      Below 0.1. A high fraction would falsify the explanation and would mean
      divergence persists despite adequate vectors, which would be a more
      interesting result pointing at process rather than at coverage.
  - observable: number of additional vectors needed to reach full separation
    metric: integer, from a minimal set cover over the enumerated candidates
    predicted: Small -- on the order of the number of predicates -- since each predicate can be exercised by one well-chosen object.
  minimal_test: >-
    Compute predicate vectors for all official test vectors, compute pairwise
    separation coverage, then solve the minimal set cover over the enumerated
    candidate space to produce a proposed supplementary vector set. Emit that set
    as a reusable artifact.
  controls:
  - 'SELF-CHECK: the supplementary set must, by construction, achieve full pairwise separation when re-measured; failure indicates a bug in the coverage computation.'
  - 'ORDERING CONTROL: coverage must be computed against the anchored lattice points only as well as against the full lattice, since coverage of unimplemented readings is a weaker statement and the two numbers must be reported separately.'
  falsification_conditions:
  - Official vectors already separate most lattice pairs, falsifying the coverage explanation.
  - The minimal cover is large, indicating the divergence space is not efficiently testable and that a supplementary vector set is not a practical remedy.
  interpretation_limits: >-
    Low coverage explains why divergence is not caught; it does not establish
    that any particular implementation diverges. The proposed supplementary
    vectors are an artifact of this program and carry no standing.
  sota_delta: >-
    No attack. Delta: an exact coverage number plus a minimal supplementary
    vector set, which is a directly usable output for anyone testing an
    implementation.
  dominated_by: Not dominated by any corpus record; depends on IDEA-20260809-0e919c for the lattice and IDEA-20260809-022eb5 for the object space.
  estimated_cost: Implementation small; compute negligible except the set cover, which is small.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for test vector coverage: no records. WEB NOT CHECKED.'
  source_refs:
  - RFC 8032 test vectors -- REQUIRED READ, NOT YET READ.
