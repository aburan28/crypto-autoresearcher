idea:
  id: IDEA-20260808-baf8bc
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  title: The memory-capped ISD collapse test - compute the constrained frontier T_V(mu) and
    ask whether MMT, BJMM and May-Ozerov optima coincide EXACTLY with Dumer/Stern below a
    threshold, which would make the representation lineage a pure memory-for-time trade with
    no structural content
  class: algorithm
  claim: 'Define T_V(mu) as the minimum asymptotic time exponent of ISD variant V over its
    internal parameters subject to memory exponent at most mu, at fixed rate R and relative
    weight omega. The folklore that advanced-ISD gains evaporate once memory is charged is
    qualitative. The sharp alternatives are: CLAIM A - there is mu*(R, omega) with T_MMT(mu)
    = T_BJMM(mu) = T_MO(mu) = T_Dumer(mu) exactly for all mu <= mu*, so below mu* the memory-charged
    ISD frontier is a ONE-PARAMETER family and the representation technique contributes nothing;
    CLAIM B - the optima separate for some mu < mu*, so representations have structural value
    beyond buying memory and every charged baseline must carry four curves. Either way the
    deliverable is the frontier itself, which GOAL-MCE-001 criterion 2, GOAL-HQC-001 and GOAL-SDITH-001
    all name and none has built.'
  mechanism: Advanced variants realise a representation gain only when lists are large enough
    that the expected number of surviving representations of the target exceeds one after
    filtering. A memory cap caps list size, which caps representation multiplicity, which
    drives the optimiser toward smaller p and shallower merge trees - and the terminus of
    that drive is the Dumer/Stern configuration (depth 1, no representations). Claim A asserts
    the terminus is reached exactly rather than approached asymptotically. The test is numerics
    on the published exponent formulas with the constraint mu_V <= mu added.
  why_not_a_renamed_known_approach: IDEA-20260805-43d6df addresses the RE-OPTIMISATION ERROR
    of charging a published free-memory optimum after the fact (6-10 bits, one direction).
    IDEA-20260805-554b9d fixes the COMPARATOR under Wiener full cost (tau + mu rather than
    tau). IDEA-20260805-baa4da derives a forced survival inequality at HQC's key-recovery
    parameters. All three evaluate at a point or fix a scalar; none computes the constrained
    frontier as a function, and none asks whether the four families' constrained optima coincide
    identically - coincidence is a structural statement about the algorithms, not a convention.
  predictions:
  - observable: T_V(mu) for Prange, Stern/Dumer, MMT, BJMM, May-Ozerov.
    metric: Time exponent versus memory exponent at R = 0.5 (HQC, SDitH) and R about 0.78
      (Classic McEliece), at both full-distance and sublinear weight.
    predicted: At Classic McEliece's sublinear weight the curves collapse toward Prange for
      all mu, consistent with KN-LIT-fa9bc8; at R = 0.5 with linear weight they are distinct
      at large mu and the question is whether they merge at a single mu* or cross gradually.
  - observable: mu*(R, omega), the merge point.
    metric: Memory exponent, converted to bits at deployed n.
    predicted: If mu* n exceeds about 80 bits at deployed n, Dumer/Stern IS the memory-charged
      baseline everywhere that matters operationally.
  - observable: Identity of the argmin configuration at the merge point.
    metric: Which variant and which internal parameters attain T(mu).
    predicted: Dumer/Stern. A different configuration would be a genuinely new memory-constrained
      variant and the more interesting outcome.
  minimal_test: Implement the five published asymptotic exponent formulas as constrained optimisation
    problems in (p, l, depth, representation splits), add mu_V <= mu, and sweep mu on a grid
    at the four (R, omega) points named. Cross-validate at mu = infinity against the published
    unconstrained exponents before believing any constrained number. Budget under 1000 core-seconds;
    no cryptographic computation at all.
  controls:
  - UNCONSTRAINED REPRODUCTION - at mu = infinity every curve must reproduce its published
    exponent to three decimals, else the transcription is wrong and no constrained number
    may be reported.
  - MONOTONICITY CONTROL - T_V(mu) must be non-increasing in mu; a non-monotone curve is an
    optimiser artifact, not a finding.
  - SUBLINEAR-WEIGHT NULL - at t about n / log n the curves must converge toward Prange independently
    of mu (KN-LIT-fa9bc8); if they do not, the weight regime is mis-specified.
  confounders:
  - Published exponents differ in whether memory access is charged, whether nearest-neighbour
    subroutines are included, and in asymptotic conventions; mixing conventions manufactures
    a merge or a separation.
  - These optimisation landscapes are non-convex; multi-start is mandatory and the number
    of starts must be reported.
  - Asymptotic merging says nothing about concrete merging at n = 3488 to 57637.
  falsification_conditions:
  - The constrained optima separate at every mu > 0, so Claim A is false and representations
    retain structural value under memory caps.
  - The unconstrained reproduction check fails, blocking the exercise until the formulas are
    re-transcribed from primary text.
  - mu* is below the memory any implementation needs anyway, making the distinction operationally
    empty.
  interpretation_limits: Asymptotic exponents at fixed (R, omega) are not concrete security.
    This is ACCOUNTING for published algorithms in the sense of H-MCE-efa9b2's scope statement,
    not an attack, and no claim about Classic McEliece, HQC or SDitH security follows from
    it.
  assumptions:
  - The five variants' asymptotic formulas are correctly transcribed from primary text.
  - Memory exponent is defined uniformly as log2(peak list size) / n across variants.
  heuristic_assumptions:
  - id: HA-1
    statement: Each variant's exponent formula remains valid when its internal parameters
      are pushed to the boundary of the memory constraint, not only at the unconstrained optimum
      where it was derived.
    rigorous_ingredient: The formulas derive from list-size and collision counts that are
      parametric in the internal parameters, not evaluated only at the optimum.
    distribution_imitated: The standard random-code heuristic that list intersections behave
      as uniform random draws of the predicted expected size.
    validation_route: TOY SCALE, LABELLED AS SUCH - implement Dumer and one representation-based
      variant at n = 200-400 with certificates (recovered error reproduces the syndrome),
      run at several memory caps, and compare the measured list-size-versus-time curve against
      the parametric prediction. This validates the parametric formula, never the crypto-scale
      exponent.
    tail_checks: Check that the number of representations surviving the filter matches prediction
      in the smallest-memory cell, where the prediction is most fragile.
  target_complexity:
    time_exponent: Produces T(mu) versus the published free-memory exponents. If Claim A holds,
      the memory-charged exponent for every code-based scheme in this program collapses to
      Dumer/Stern's constrained curve, which is strictly weaker as an attack than the free-memory
      BJMM figure usually quoted.
    memory_exponent: The independent variable, swept.
    best_known_baseline: Free-memory optima as published (Prange through May-Ozerov), plus
      KN-LIT-fa9bc8's sublinear collapse and this program's 43d6df / 554b9d / baa4da.
    hidden_overhead_disclosure: Every published ISD exponent hides polynomial factors worth
      tens of bits at n = 3488-57637; the frontier is asymptotic and must not be quoted concretely
      without them.
    time_memory_tradeoff: The deliverable IS the tradeoff curve, including its parallelisation
      note - Prange-like configurations parallelise with no communication while deep merge
      trees do not.
  sota_delta: Turns folklore into the frontier function and supplies the object three goals
    name as a deliverable. If Claim A holds, every memory-charged code-based baseline in this
    program becomes one formula instead of a five-way comparison.
  dominated_by: 'PARTIALLY DOMINATED by the memory-constrained ISD literature, which I believe
    exists - Bernstein-Lange-Peters ball-collision decoding argues BJMM''s advantage shrinks
    under realistic memory, and Esser and co-authors have written on memory-efficient ISD
    and subset-sum time-memory tradeoffs. BOTH RECALLED FROM MEMORY AND UNVERIFIED, with no
    web access this session. Inside the corpus nothing dominates: 43d6df, 554b9d and baa4da
    were each read in full and none computes T_V(mu). This is a partial null, honestly marked.'
  estimated_cost: Implementation MEDIUM (five formula families, constrained optimisation,
    multi-start). Compute LOW.
  recommended_priority: medium
  honest_prior_of_survival: About 0.85 that the frontier is built correctly; about 0.35 that
    Claim A holds exactly rather than approximately. Approximate merging is still usable.
  novelty_status: unverified
  novelty_screen: Screened against IDEA-20260805-43d6df, 554b9d, baa4da, IDEA-20260807-c3267e,
    H-MCE-31d438, H-MCE-efa9b2, H-HQC-1d9b21, H-SDITH-d37289, KN-LIT-fa9bc8, KN-TECH-035,
    KN-TECH-044, KNOWLEDGE_BARRIERS.txt. External unscreened.
  discriminated_from: IDEA-20260805-43d6df (re-optimisation error at a point), 554b9d (the
    tau + mu comparator), baa4da (a forced survival inequality at one parameter set). This
    computes the constrained frontier as a function and tests family coincidence on it.
  source_refs:
  - KN-LIT-fa9bc8 (Canto Torres and Sendrier, sub-linear error weight ISD analysis)
  - KN-TECH-035, KN-TECH-044 (full-cost accounting; memory charged in lattice attacks)
  - GOAL-MCE-001 completion criterion 2
  proof_search_map:
    bottleneck: The unconstrained optimisation that every published ISD exponent reports;
      removing free memory from it is the single step that changes the ranking.
    baseline_embedding:
      parameter_slice: mu = infinity recovers the published exponents exactly; that is the
        old-method boundary.
      reproduction_check: Frozen regression fixture reproducing each published exponent to
        three decimals at mu = infinity before any constrained value is emitted.
    observation_collision:
      observable: The pair (time exponent, memory exponent) at the constrained optimum.
      distinct_preimage_search: Two different internal configurations of BJMM can share a
        (tau, mu) pair while differing in concrete cost by large polynomial factors; the frontier
        therefore under-determines the algorithm and the argmin must be reported alongside
        the value.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: The constrained optimisation problem itself, specialised to each (R,
        omega) point of the three schemes.
      predicted_gain: Replaces a five-way qualitative comparison with a single frontier plus
        a merge point.
    quantifier_order: FOR ALL (R, omega) in the four named points and FOR ALL mu in the sweep,
      THERE EXISTS a variant V attaining T(mu); Claim A asserts that FOR ALL mu <= mu* that
      V may be taken to be Dumer/Stern.
    method_ceiling:
      strongest_certifiable_claim: An asymptotic constrained frontier and a merge point, both
        conditional on the transcribed formulas being right.
      nearby_object_control: In the sublinear-weight regime the frontier is nearly flat in
        mu, so the method certifies almost nothing there - which is the correct answer for
        Classic McEliece and is a check that the method is not manufacturing structure.
    proof_obligations:
    - claim: Each variant's exponent formula is parametric and valid off the unconstrained
        optimum.
      responsibility: baseline
    - claim: The constrained optimum exists and is attained.
      responsibility: feasibility
    - claim: The optima coincide below mu*, or do not.
      responsibility: strictness
    - claim: Memory exponent is measured identically across variants.
      responsibility: interface
    not_applicable_reason: null
