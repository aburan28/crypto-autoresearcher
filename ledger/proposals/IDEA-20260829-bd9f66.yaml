  proof_search_map:
    bottleneck: >-
      The single step whose removal changes what may be CLAIMED rather than what
      may be computed: the emission of a verdict label without its attainable
      set. Every negative this lane can report passes through that emission, and
      an entailed label carries no information regardless of how many curves fed
      it.
    baseline_embedding:
      parameter_slice: >-
        The unmodified committed pipeline on the frozen slice p = 4001, traces
        {30, -30, 18, -18}, fb_m2 = 40, fb_m3 = 13, window = 400, targets = 400,
        seed = 20260807 -- exactly RUN-ICINV-p4001-a. Reporting the attainable
        set alongside each verdict must change NO verdict.
      reproduction_check: >-
        FROZEN FIXTURE, two parts, both exact and both able to fail. (a) Re-run
        analyse() on the committed rows and require the seven per-class verdict
        labels to match the committed ones exactly, class for class. (b) Re-run
        permutation_null at the committed seeds and iteration counts and
        reproduce the committed NULL-C and window_decay p-values digit for digit.
        A mismatch halts the audit and is reported as a reproducibility defect of
        the committed run, not worked around.
    observation_collision:
      observable: >-
        The verdict triple (verdict label, null_variance, ratio) emitted by
        exact_null_verdict, and the float returned by permutation_null.
      distinct_preimage_search: >-
        COLLISION ALREADY PRESENT IN COMMITTED CODE, and it is this record's
        strongest single finding because it costs no compute. The observable
        (`invariant`, 0.0, 1.0) is produced by P1 class-invariance from isogeny
        structure, P2 an arithmetic identity independent of the class (order),
        P3 constancy by code construction (any factor_base_fixed_size-derived
        size), and P4 a measurement fault collapsing the functional. A fifth
        collision sits on the permutation null, where p = 1.0 is produced both by
        "no class effect" and by "the statistic is constant on the permutation
        orbit". SEPARATING CONDITION, and it is two integers plus a set: report
        per verdict the attainable-outcome set, the distinct-value count of the
        input (which exact_null_verdict already computes and discards into a
        string), and the orbit size of the statistic under the declared
        randomization. That converts a non-identifiable label into an
        identifiable one, which is exactly the repair IDEA-20260829-9aaa40
        prescribes for the symmetric frontier.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed at (`invariant`, 0.0, 1.0) and vary the
          forgotten structure: exhibit, from the committed run, one verdict whose
          input has distinct-value count 1 for an entailed arithmetic reason
          (order) and one whose input has distinct-value count 1 for no entailed
          reason, if such a pair exists.
        predicted_gain: >-
          MODELED, NOT MEASURED. A counterexample pair from the committed record
          establishing that the verdict label is non-identifiable, plus the
          three-part invariant restoring identifiability. If no such pair exists
          -- if every zero-variance verdict is entailed -- the finding is
          stronger, not weaker: every `invariant` in the committed run is a
          restatement of arithmetic.
      - transform: specialization_pack
        proposed_object: >-
          The depth-1 blocking lattice as a resource measure: for each candidate
          blocking (free permutation, twist-pair blocked, N-band blocked), count
          the orbit size of the statistic and the attainable p-value set, and
          charge each blocking only over the comparisons it newly forbids.
        predicted_gain: >-
          MODELED, NOT MEASURED. A three-point curve of validity gained against
          attainable evidence lost, which is the honest way to present
          IDEA-20260807-34754f's recommendation rather than as a free repair.
          Charges are disjoint only at depth 1; deeper blocking is not attempted.
    quantifier_order: >-
      THE CLAIM UNDER TEST is the campaign's own implicit reading of its verdict,
      written out: FOR ALL curves E in the class, C(E) equals a common value.
      That universal is a THEOREM, not a measurement, when C is a function of the
      trace alone, and its emitted label is then a tautology. THIS RECORD CLAIMS:
      FOR the committed pipeline, THERE EXISTS at least one emitted verdict whose
      attainable-outcome set is a singleton, and THERE EXISTS at least one
      functional for which the twist-blocked permutation test has power equal to
      its size. NOT CLAIMED: that all verdicts are entailed, that any measured
      value is wrong, or that any hypothesis moves.
    method_ceiling:
      strongest_certifiable_claim: >-
        For the committed pipeline at a named commit and the committed run: the
        exact attainable-outcome set, distinct-value count and statistic-orbit
        size of every emitted verdict, and a proof-by-arithmetic that named
        verdicts are entailed. The method can NEVER certify that a non-entailed
        `invariant` is a genuine isogeny-class fact, can NEVER certify anything
        about untested functionals or untested p, and can NEVER convert an
        entailed verdict into evidence in either direction.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE HOPED-FOR CONCLUSION MUST FAIL, and it must be
        run: `two_torsion_x`, which the committed docstring and
        IDEA-20260807-c015f5 both record as VARYING within a class (Var(z) about
        1.0 at p = 4001). Its attainable-outcome set must come out as size 2 and
        its distinct-value count must exceed 1. An auditor that flags
        two_torsion_x as entailed is measuring its own conservatism and every row
        of its table is void. Symmetrically it must flag `order`. A method that
        cannot separate that pair has identified nothing.
    proof_obligations:
      - claim: >-
          N is exactly constant within an F_p isogeny class, so the `order`
          verdict is entailed.
        responsibility: correctness
      - claim: >-
          The verdict labels emitted with the attainable set attached are
          identical to the committed labels on the frozen slice.
        responsibility: baseline
      - claim: >-
          The distinct-value count reported as a field equals len(set(values)) as
          computed inside exact_null_verdict's detail string.
        responsibility: correctness
      - claim: >-
          For an exactly twist-invariant functional under twist-pair blocking,
          the observed statistic equals the null mean identically, so the test's
          power equals its size.
        responsibility: success_probability
      - claim: >-
          Every conclusion is scoped to the named commit, the frozen slice and
          the seven committed functionals, with concurrent-edit risk disclosed.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        number of the 28 per-class verdicts of RUN-ICINV-p4001-a (4 classes times
        7 functionals) whose attainable-outcome set has cardinality exactly 1,
        with the entailment argument named per row
      direction: higher
      minimum_effect: >-
        At least 4 -- the four `order` rows, which are entailed by N = p + 1 - t
        alone. Predicted at least 8, the extra four being `s3_support`, which
        IDEA-20260807-efc8de argues depends only on which of a, b vanish and is
        therefore constant on any class containing no j=0 and no j=1728 curve.
        FEWER THAN 4 FALSIFIES claim (A) and this record is withdrawn.
    - metric: >-
        distinct-value count reported as a committed field, per verdict, over the
        28 per-class verdicts
      direction: different
      minimum_effect: >-
        Exactly 1 for every `order` row and strictly greater than 1 for every
        `two_torsion_x` row. The second half is the nearby-object control: if
        two_torsion_x also reports 1, the auditor is broken and no row is
        reportable.
    - metric: >-
        attainable_p_min for each committed permutation cell, computed as the
        maximum of the Monte Carlo floor 1/(B+1) and the reciprocal of the
        statistic's orbit size under the declared blocking
      direction: higher
      minimum_effect: >-
        Report the exact value per cell beside the reported p-value. Predicted:
        at least one cell in a twist-blocked design has attainable_p_min above
        the multiplicity-corrected threshold 0.05/m at IDEA-20260807-caf061's
        declared m = 14, i.e. above 3.571e-3, so that cell can never reject at
        the campaign's own declared level. If no cell exceeds it, the interaction
        this record predicts between the two committed proposals does not bite
        and that is reported as such.
    - metric: >-
        empirical power of the twist-pair-blocked permutation test against a
        planted TWIST-SYMMETRIC class effect (an offset applied identically to
        class t and class -t), at the declared level, over at least 200 draws
      direction: lower
      minimum_effect: >-
        Indistinguishable from the nominal alpha of 0.05 within a binomial
        interval, at every planted magnitude swept, INCLUDING magnitudes far
        above the observed within-class spread. That is the zero-power signature.
        Contrast arm, required in the same run: the same blocked test against a
        planted ASYMMETRIC per-class offset, which must reach power 0.8 at some
        finite magnitude. If the symmetric arm reaches 0.8 anywhere, claim (D) is
        FALSE and is withdrawn.
    - metric: >-
        number of verdict labels that CHANGE when the attainable-set fields are
        added
      direction: lower
      minimum_effect: >-
        Exactly 0. Any change means the audit altered the decision rather than
        its evidence, and the run is void until explained.

  minimal_test:
    design: >-
      Read-only recomputation over committed source and committed run artifacts;
      no new curve enumeration and no network.
      STAGE 0, ZERO COMPUTE AND IT IS THE WHOLE CHEAP CORE. Read
      harness/run_icinv.py::analyse and harness/exp_icinv.py::exact_null_verdict
      at the execution-time commit and confirm or refute, by inspection, that the
      group order is routed through a zero-variance threshold and that
      len(set(values)) is written only into a format string. Record the commit.
      This settles claims (A) and (B) with no execution whatsoever.
      STAGE 1, minutes. Reproduce the frozen fixture: re-run analyse() on the
      committed rows and permutation_null at the committed seeds, and require
      digit-for-digit agreement with the committed verdicts and p-values. HALT
      AND REPORT if either fails.
      STAGE 2, minutes. For each of the 28 per-class verdicts, emit the triple
      (attainable-outcome set, distinct-value count, statistic orbit size) and
      a named entailment argument or the word NONE. Include the nearby-object
      control rows.
      STAGE 3, minutes. For every permutation cell, compute attainable_p_min and
      attainable_p_max under the free permutation and under twist-pair blocking,
      and print them beside the reported p-value.
      STAGE 4, under an hour. The two-arm power measurement of prediction 4:
      plant a twist-SYMMETRIC offset and a twist-ASYMMETRIC offset of matched
      magnitude on the already-measured value vectors, sweep magnitude over a
      declared geometric grid, and record detection probability over at least 200
      independent draws per cell under the twist-blocked test.
      Every stage's output is reported whether or not the predictions hold.
    controls:
      - >-
        NEARBY-OBJECT CONTROL, blocking: `two_torsion_x` must be reported with
        distinct-value count above 1 and an attainable-outcome set of size 2,
        while `order` must be reported entailed. An auditor failing that pair
        reports nothing.
      - >-
        NULL AUDITOR: an auditor that labels every verdict entailed, run on the
        same rows. It must disagree with the real auditor on at least the
        two_torsion_x rows; if the two auditors agree everywhere, the audit is
        measuring nothing.
      - >-
        NON-INTERFERENCE CONTROL: verdict labels with and without the added
        fields, compared row by row; agreement must be exactly 1.0.
      - >-
        FROZEN-FIXTURE BASELINE (Stage 1), which can fail and which halts the run
        if it does.
      - >-
        CONTRAST ARM in Stage 4: the twist-ASYMMETRIC planted offset, which must
        reach power 0.8, so that the symmetric arm's flat curve is a measured
        absence of power and not a broken harness.
      - >-
        SINGLETON-GROUP PROBE: run permutation_null on a grouping in which every
        group has size 1 and confirm it returns p = 1.0, so that the p = 1.0
        preimage is exhibited rather than argued.
    required_metrics:
      - "per-verdict attainable-outcome set, with cardinality, over all 28 per-class verdicts"
      - "per-verdict distinct-value count, as a field and not a string"
      - "per-verdict entailment argument, or the literal NONE"
      - "statistic orbit size and attainable_p_min / attainable_p_max per permutation cell, free and twist-blocked"
      - "detection probability versus planted magnitude, symmetric and asymmetric arms, with binomial intervals"
      - "verdict-label agreement rate with and without the added fields (must be 1.0)"
      - "the commit sha of the harness at execution time, recorded with every source claim"
      - "reproduction status of the frozen fixture, per verdict and per permutation cell"

  falsification_conditions:
    - >-
      The frozen fixture fails: recomputed verdicts or permutation p-values do
      not match the committed ones. The audit is not run and the mismatch is
      reported as a reproducibility defect; this record's numeric claims are
      withdrawn for that slice.
    - >-
      Stage 0 does not reproduce -- the group order is not routed through
      exact_null_verdict at the execution-time commit, or the verdict function
      does not threshold at zero variance. Claim (A) is withdrawn outright.
    - >-
      Fewer than 4 verdicts have singleton attainable-outcome sets. The entailment
      claim is false and this record is superseded rather than amended.
    - >-
      `two_torsion_x` is reported entailed. The auditor fails its own nearby-object
      control and every row it produced is void.
    - >-
      The twist-symmetric planted arm reaches power 0.8 at some magnitude under
      twist-pair blocking. Claim (D) is FALSE, IDEA-20260807-34754f's blocking
      loses no power on that functional, and this record says so.
    - >-
      Adding the fields changes any verdict label. The audit is interfering and is
      void until the interference is explained.
    - >-
      A reader exhibits a committed FIELD that already separates the four
      preimages. Claim (B) collapses to a restatement of existing practice.

  confounders:
    - >-
      ENTAILMENT IS AN ARGUMENT, NOT A MEASUREMENT. "Constant by arithmetic" for
      `order` is a theorem; for `s3_support` it is a prediction resting on
      IDEA-20260807-efc8de's reading of s3_monomial_support, which this session
      did NOT read in source. Rows must carry their argument and rows whose
      argument is a prediction must be labelled as such, never pooled with the
      proved ones.
    - >-
      SMALL DISTINCT-VALUE SUPPORT IS NOT THE SAME AS ENTAILMENT. An
      integer-valued functional with three attainable values (z in {0,1,3}) has a
      coarse but non-degenerate distribution. Reporting it as entailed would be a
      false positive of this audit; the distinct-value count is reported raw so a
      reader can see the difference.
    - >-
      CONCURRENT EDITS TO THE HARNESS. A source-level claim measured against a
      tree that has since changed is a claim about nothing. Every stage records
      the commit and any item that fails to reproduce is withdrawn.
    - >-
      THE TWIST-SYMMETRY ARGUMENT ASSUMES EXACT TWIST-INVARIANCE. It is exact for
      two_torsion_x by the substitution x -> d x on x^3 + a d^2 x + b d^3, and it
      is only approximate for functionals that are nearly twist-invariant, where
      the power is small rather than zero. The report must give the measured
      power curve, not the algebraic idealisation.
    - >-
      THIS AUDIT CANNOT SEE A VERDICT NOBODY EMITTED. It covers the seven
      committed functionals of one committed run. A lane that emits a different
      verdict shape inherits none of its coverage, and the record says so rather
      than implying campaign-wide coverage.

  interpretation_limits:
    - >-
      Scoped to harness/run_icinv.py and harness/exp_icinv.py at the recorded
      execution-time commit, to RUN-ICINV-p4001-a's frozen slice at p = 4001, and
      to the seven committed functionals. Toy tier under
      docs/claims-and-verification.md; nothing here is evidence about any curve of
      cryptographic size.
    - >-
      AN ENTAILED VERDICT IS NOT A WRONG VERDICT. `order` is `invariant` and that
      is true. What is claimed is that the statement carries no information about
      isogeny structure and must not be counted as a test in any multiplicity
      family, not that any number in the committed run is incorrect.
    - >-
      A measured zero power for the twist-blocked test on a twist-invariant
      functional is a statement about that DESIGN and that FUNCTIONAL. It is not a
      criticism of blocking in general, and it is not evidence that any class
      effect exists or does not exist.
    - >-
      This record asserts nothing about H-STR-002, phi_alpha or any verdict in
      DEC-20260727-009, and moves no hypothesis. An adverse finding about a
      committed record is routed to the Coordinator as a proposed supersession and
      is never applied as an edit.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Attainable-set coverage.) For each committed verdict, the attainable-
        outcome set computed by holding the measured input multiset fixed and
        varying only the declared randomization equals the set of outcomes the
        verdict would take under independent re-measurement at the same p with a
        different seed, up to the outcomes forbidden by an entailment argument.
        Formally: for verdict V with statistic T and randomization group G,
        {V(T(g.x)) : g in G} equals {V(T(x')) : x' a re-measurement at the same p}
        whenever no entailment argument applies to V.
      rigorous_support: >-
        RIGOROUS HALF, and it is the load-bearing one: where an entailment
        argument exists the attainable set is a singleton by theorem, with no
        modelling at all -- N = p + 1 - t is exact, and the identity
        #liftable = (#E - 1 + z)/2 verified on every row of RUN-ICINV-p4001-a
        (per IDEA-20260807-c015f5) is exact. The permutation distribution's
        discreteness and its 1/N granularity are likewise standard and exact
        (retrieved this session). CLASSICAL RESULT IMITATED: the exchangeability
        theory of randomization tests, under which the permutation distribution is
        the exact conditional null given the sufficient statistic -- so the
        attainable set is exactly the conditional support. THE MODELLED HALF is
        the extension from the conditional support to re-measurement support,
        which requires exchangeability across seeds and is NOT proved here.
      validation_plan: >-
        WHAT TO SAMPLE: for each of the seven functionals, at least 30 independent
        re-measurements of the same class at the same p under different target
        and factor-base seeds, recording the emitted verdict each time. SCALE: 7
        functionals times 4 classes times 30 seeds = 840 verdict emissions,
        minutes at p = 4001 for the cheap functionals and bounded by the O(p)
        group_structure cost for the expensive one, which may be sampled at 10
        seeds instead and reported as such. PREDICTED DISTRIBUTION: the empirical
        set of emitted verdicts equals the computed attainable set for every
        non-entailed functional, and is the singleton for every entailed one.
        TAIL CHECK: the single seed producing the most unusual verdict is inspected
        directly; a verdict outside the computed attainable set falsifies H1 at
        once and is the most informative single observation available. TRANSFER
        ASSUMPTION, STATED: this validates the attainable set at p = 4001 on four
        classes only, and transfers to no other p and no other functional.
    - id: H2
      statement: >-
        (Zero power under symmetric blocking.) Let C be a functional with
        C(E) = C(E^d) for the quadratic twist E^d, and let the permutation blocks
        be the twist pairs {class(t), class(-t)}. Then the value multisets of the
        two classes in a block are equal, the observed mean-within-group variance
        equals the expectation of the block-permuted statistic, and the test's
        rejection probability equals its nominal level for every twist-symmetric
        alternative.
      rigorous_support: >-
        PROVEN INGREDIENT FIXING THE QUANTITY: exact twist-invariance of the
        2-torsion x-count follows from x^3 + a d^2 x + b d^3 = d^3 f(x/d), an
        identity IDEA-20260807-34754f states and this record does not re-derive;
        equality of the two class sizes is consistent with the committed run
        (138, 138 and 98, 98) and is stated there as a checkable prediction, not
        a quoted theorem. CLASSICAL RESULT IMITATED: the exactness of
        randomization tests under exchangeability -- the same theorem that makes
        the blocked test VALID is what makes it POWERLESS when the block is the
        only place the alternative lives. That duality is the whole content of
        H2 and is why the assumption is stated rather than assumed away.
      validation_plan: >-
        WHAT TO SAMPLE: the two-arm planted sweep of prediction 4 -- twist-
        symmetric and twist-asymmetric offsets of matched magnitude, on the
        already-measured value vectors, so no new curve work is needed. SCALE: a
        declared geometric grid of at least 8 magnitudes spanning 1/16 to 4 of
        the observed within-class standard deviation, times 200 independent draws
        of the offset, per functional. PREDICTED DISTRIBUTION: the symmetric arm's
        rejection rate is flat at the nominal alpha with a binomial interval
        containing it at every magnitude; the asymmetric arm rises monotonically
        to at least 0.8. TAIL CHECK: the largest symmetric magnitude tested must
        still not reject; a rejection there falsifies H2 and is reported before
        any other number from the run. TRANSFER ASSUMPTION: measured on exactly
        twist-invariant functionals at p = 4001; nearly-invariant functionals have
        small rather than zero power and are reported separately.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED, and none could be: the record's
      output is a table. Auditor cost: computing the attainable set for a verdict
      is O(n) for the distinct-value count and O(B) for the orbit probe, over
      n <= 138 values and B <= 2000 draws, i.e. under 10^6 scalar operations for
      the whole 28-verdict table -- milliseconds. The Stage 4 power sweep is
      8 magnitudes times 200 draws times B permutations times 4 classes, about
      10^7 statistic evaluations, i.e. minutes in Python and requiring NO new
      curve enumeration, because the planting is additive on already-measured
      vectors.
    memory_exponent: >-
      O(n) floats per verdict plus O(B) for the null draws, kilobytes. No memory
      pressure and no time-memory tradeoff is relevant. Stated beside time because
      docs/claims-and-verification.md's asymptotic-form-honesty rule requires it
      even when the answer is trivial.
    best_known: >-
      There is no incumbent measurement. exact_null_verdict computes
      len(set(values)) and DISCARDS it into a format string; no committed field in
      any run record carries an attainable-outcome set, a distinct-value count or
      a statistic orbit size, so the incumbent value on this record's metrics is
      UNDEFINED rather than zero. The nearest committed practice is
      IDEA-20260807-caf061's proposal to print the Monte Carlo floor 1/(B+1)
      beside every p-value, which covers ONE of the two floors this record
      identifies and none of the entailment analysis. The attack frontier is
      untouched: parallel rho at 0.886*sqrt(N) time with O(1) memory, the
      automorphism-discounted variant on CM curves, and BSGS at sqrt(N) time and
      sqrt(N) memory, all unchanged and uncontested.
    hidden_overhead: >-
      DISCLOSED, three items. (i) The entailment argument is HUMAN JUDGEMENT for
      every row except `order`, and judgement does not scale: a campaign with
      fourteen lanes would need one argument per functional per lane, and that
      cost is real and is charged here rather than absorbed. (ii) The
      attainable-outcome set is an UPPER bound on what the verdict can express and
      never a lower bound on what it does express -- a verdict with two attainable
      outcomes may still be uninformative for reasons this audit cannot see.
      (iii) H1's transfer from conditional support to re-measurement support has
      no proof and its validation is 30 seeds at one p.
    tradeoff_note: >-
      The tradeoff this record exposes is VALIDITY AGAINST ATTAINABLE EVIDENCE,
      and the deliverable is the curve rather than a recommendation. Refining the
      blocking of a permutation null removes nuisance (validity gained) and
      shrinks the statistic's orbit (attainable evidence lost), monotonically in
      both directions; at the limit of complete blocking the test is perfectly
      valid and completely powerless. The report emits the three-point curve over
      {free, twist-blocked, N-band-blocked} and explicitly declines to recommend a
      blocking, which is a Coordinator decision. Parallelization is irrelevant at
      this scale and is not claimed.

  dominated_by: >-
    AS AN ATTACK: n/a, no attack is mounted, no discrete logarithm is computed,
    and there is no axis on which this competes. Every row of the prime-field
    frontier dominates it trivially across time, memory and data/queries.
    AS A MEASUREMENT, checked row by row against the eighteen proposals already
    filed under RQ-INSTR-f8faa0 and against the committed code, rather than
    asserted. (1) IDEA-20260807-caf061 DOMINATES the Monte Carlo half of
    prediction 3 outright: it already derives the floor 1/(B+1), already computes
    B > m/alpha - 1 at m = 14, 37 and 200, and already prescribes printing the
    floor. This record adds only the SECOND floor -- the orbit-size floor, which
    survives B -> infinity -- and must be written as an extension of caf061, not
    as a fresh finding. (2) IDEA-20260807-34754f is NOT dominated and is not
    dominating: it designs the blocking; this measures what the blocking costs in
    attainable evidence. Its record contains both facts claim (D) combines and
    combines neither. (3) IDEA-20260807-efc8de is complementary: it measures
    delta* (the smallest effect detectable), this measures which verdicts can vary
    at all. A functional with a singleton attainable set has no finite delta* and
    efc8de's sweep would report that as "unusable", so the two agree where they
    overlap and this record reaches the four entailed rows more cheaply.
    (4) IDEA-20260807-f6137c is the nearest neighbour and the domination is
    PARTIAL AND IN ITS FAVOUR on constructibility: its two-bit test asks whether a
    planted signal and a matched null CAN be built. It does not ask whether an
    already-built verdict CAN VARY, which is a different bit and is the one
    measured here. (5) IDEA-20260829-9aaa40 is the source of the failure shape and
    is not dominated -- it operates on a symmetric-cryptanalysis frontier, outside
    this question's scope, and shares no object. DISCLOSED LIMIT: eleven of the
    eighteen filed proposals (1c14d7, 257001, 899c5e, 8aaddb, 90c7ab, b3c97b,
    faf43c, c4a653, e0b239, 1c2177, acdc1d) were NOT read in full this session and
    are known only by the one-line titles in the prior-art file, so the domination
    argument for those rows rests on their titles. A validator should check them
    rather than accept this. EXTERNALLY: dominated conceptually and admittedly so
    by standard permutation-test theory, which has known the granularity fact for
    decades; nothing about the fact is claimed new, only its application.
  sota_delta: >-
    No attack, no exponent, zero delta on every attack cost axis at every field
    size. Quantitatively, against this campaign's own instrument: the committed
    pipeline reports 37 verdicts per run and reports the number of them that could
    have come out otherwise as, literally, nothing; this record targets exact
    integers for (a) the attainable-outcome set of all 28 per-class verdicts,
    predicted to contain at least 4 and probably 8 singletons, (b) the
    distinct-value count as a field where it currently exists only inside a format
    string, (c) attainable_p_min per permutation cell under two blockings, of
    which the orbit-size component is currently unreported at any B, and (d) a
    two-arm power curve establishing whether the recommended twist blocking has
    zero power against twist-symmetric alternatives. If prediction 1 holds at 8,
    IDEA-20260807-caf061's multiplicity denominator falls from 37 to 29, which
    loosens its Holm threshold from 1.351e-3 to 1.724e-3 -- a 28 percent change in
    the campaign's own declared detection floor, computed from committed numbers.
    Against docs/target-result-profile.md this is explicitly NON-target-class: no
    asymptotic exponent moves and none could. It is proposed as a BUILDING BLOCK
    under Idea Generator search heuristic 1, because it decides whether the
    verdicts against which every future negative in this lane would be scored can
    carry information at all.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Stages 0 to 3 are reading and arithmetic on committed artifacts. Stage 4
      plants additively on already-measured vectors and needs no new curve
      enumeration, so the O(p^2) cost that dominates this lane is not incurred.

  recommended_priority: high

  discriminated_from:
    - >-
      IDEA-20260807-caf061, which controls the ERROR RATE across many tests. This
      asks whether a given test has more than one possible answer. A perfectly
      multiplicity-corrected family that contains four entailed rows is corrected
      against the wrong denominator.
    - >-
      IDEA-20260807-34754f, which fixes the null's VALIDITY. This measures the
      null's ATTAINABLE EVIDENCE, and predicts that its recommended fix costs all
      of it on one class of functionals.
    - >-
      IDEA-20260807-efc8de, which measures the smallest DETECTABLE effect. This
      measures which verdicts admit any effect at all, and reaches the degenerate
      rows without running a sweep.
    - >-
      IDEA-20260807-f6137c, whose two-bit test is about whether a control can be
      CONSTRUCTED. This is about whether a verdict already emitted can VARY.
    - >-
      IDEA-20260829-bd9f66's sibling IDEA-20260829-28e420, which measures the
      power of the campaign's control battery against deliberately broken
      instruments. That tracks the instrument; this tracks the verdict.

