idea:
  id: IDEA-20260829-bd9f66
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    FOUR OF THIS LANE'S COMMITTED VERDICTS HAVE EXACTLY ONE ATTAINABLE OUTCOME,
    SO `invariant` IS NOT IDENTIFIABLE: harness/run_icinv.py::analyse routes the
    group order N = p + 1 - t through exact_null_verdict, whose verdict is
    `invariant` iff the variance is exactly zero, and N is constant within an
    isogeny class by Tate -- measure the ATTAINABLE-OUTCOME SET and the
    distinct-value count of every emitted verdict and promote them from a
    free-text `detail` string to two committed fields

  class: measurement

  claim: >-
    (A) THE STRUCTURAL CLAIM, ZERO COMPUTE, READ OFF COMMITTED SOURCE.
    harness/run_icinv.py::analyse (lines 168-197, read in full this session)
    emits seven per-class verdicts, five of them through
    harness/exp_icinv.py::exact_null_verdict, whose verdict is
    `"invariant" if obs == 0.0 else "over-dispersed"` where obs is
    statistics.variance of the supplied values (lines 447-457, read in full).
    One of the five is `verdicts["order"]`, the group order. Within an F_p
    isogeny class the order is N = p + 1 - t, exactly constant by the definition
    of the class. So that verdict is `invariant`, with null_variance 0.0 and
    ratio 1.0, WITH PROBABILITY ONE, for every class, at every p, forever. Its
    attainable-outcome set has cardinality 1. It is an experiment with no
    possible negative outcome -- the exact thing agents/idea-generator.md
    forbids proposing -- and it is already in the campaign's committed run.

    (B) THE IDENTIFIABILITY CLAIM, AND IT IS THE POINT. The emitted observable
    (verdict `invariant`, null_variance 0.0, ratio 1.0) has AT LEAST FOUR
    distinct ground-truth preimages, and no committed FIELD separates them:
      P1  the functional is class-invariant as a consequence of isogeny
          structure -- the finding lane L1 exists to look for;
      P2  the functional is constant by an arithmetic identity that has nothing
          to do with the class grouping (order = p + 1 - t);
      P3  the functional is constant BY CODE CONSTRUCTION -- for example any
          functional derived from harness/exp_icinv.py::factor_base_fixed_size,
          which returns exactly `size` elements for every curve by definition
          (lines 43-57, read in full);
      P4  the functional collapsed to a constant because of a measurement fault.
    exact_null_verdict ALREADY computes the separating datum -- it evaluates
    len(set(values)) -- and writes it into a free-text `detail` string
    (`f"distinct values: {len(set(values))}"`). THE SEPARATING DATUM IS PRESENT
    AS PROSE AND ABSENT AS DATA. This is the same defect shape recorded for the
    symmetric frontier in IDEA-20260829-9aaa40, where a schema computes a
    per-row hash but no field for the fibre; here a verdict function computes
    the fibre size but no field for it.

    (C) THE SAME DEFECT ON THE PERMUTATION NULL, WITH A DIFFERENT MECHANISM.
    harness/exp_icinv.py::permutation_null (lines 460-490, read in full) returns
    p = worse / iterations with worse counting `v <= observed`. Two of its
    attainable values are floors rather than measurements:
      p = 0.0 -- the Monte Carlo resolution floor already named by
        IDEA-20260807-caf061, and reported at five of six windows of
        RUN-ICINV-p4001-a as quoted by IDEA-20260807-c015f5;
      p = 1.0 -- attained whenever the mean-within-group-variance statistic is
        CONSTANT on the permutation orbit, which happens exactly when every
        pooled value is equal, and also when every group is a singleton (the
        statistic skips groups of size 1 and returns 0.0, so v == observed == 0
        on every draw). p = 1.0 then means "the randomization had no support",
        which is not the same fact as "the class grouping carries no
        information", and the emitted float is the same in both cases.

    (D) THE SHARPEST PREDICTION, AND IT IS ABOUT A FIX THIS LANE HAS ALREADY
    PROPOSED. IDEA-20260807-34754f recommends blocking the label permutation on
    the quadratic-twist pairing {t, -t}, and the SAME record documents that
    several functionals are exactly twist-invariant, quoting
    Var(two_torsion_x) = 1.0053951126626468 in BOTH class 30 and class -30 and
    0.9896907216494846 in BOTH class 18 and class -18. Put those two facts
    together, which no committed record does. For an exactly twist-invariant
    functional, the curves of class t and class -t carry the SAME value multiset,
    so within a twist-pair block the class label is not a function of the
    measured value at all: the permutation null hypothesis is TRUE BY THEOREM
    inside every block, the observed statistic equals the null mean identically,
    and the test's power equals its size against EVERY alternative. The
    recommended fix removes the N confound and, on that class of functionals,
    removes the test's entire capacity to detect anything. It cannot support a
    negative, which is RQ-INSTR-f8faa0's own disqualifying criterion. THIS
    PROPOSAL DOES NOT SAY THE BLOCKING IS WRONG -- it says the blocked test's
    attainable evidence must be reported per functional, and that for the
    twist-invariant ones the honest report is "zero power by construction".

    (E) WHAT EACH OUTCOME MEANS. If most verdicts have attainable-outcome sets of
    size 2 or more and the distinct-value counts are large, the lane's verdicts
    are identifiable and this record's concern is small and localised to the
    `order` row -- a real and welcome negative. If a substantial fraction are
    entailed, the campaign's reported verdict count (37 in one run, per
    IDEA-20260807-caf061) overstates its evidence by that fraction, and every
    multiplicity calculation built on that count is computed against the wrong
    denominator.

  mechanism: >-
    THE STRUCTURAL DIAGNOSIS. A verdict function is a threshold map on a
    statistic, and this lane has only ever asked what value the statistic took.
    The prior question -- what values the statistic COULD have taken, given the
    arithmetic constraints on its input and the declared randomization -- has
    never been asked, and where the answer is "one", the emitted label is a
    tautology wearing the clothes of a measurement. That is not a defect of any
    number in the committed run; every number there is correct. It is a defect
    of what the label is allowed to mean, and it is invisible in the emitted
    artifact by construction, because a label with one attainable value and a
    label with two look identical once printed.
    THE MECHANISM IS TO COMPUTE THE ATTAINABLE SET BEFORE READING THE OUTCOME,
    AND IT IS THREE QUANTITIES PER VERDICT. First, the DISTINCT-VALUE COUNT of
    the input multiset, which exact_null_verdict already evaluates as
    len(set(values)) and discards into a format string; promoting it to a field
    is a one-line change and separates preimages P1 and P2 from P4 immediately,
    because a functional that collapsed through a fault and one that is constant
    by arithmetic differ in nothing else the record retains. Second, the ORBIT
    SIZE of the statistic under the declared randomization -- for permutation_null,
    the number of distinct values the mean-within-group variance takes as the
    labels range over the permitted relabellings -- whose reciprocal is the
    smallest p-value the design can ever attain, independently of the Monte Carlo
    budget B. Third, the ENTAILMENT ARGUMENT, a named reason the attainable set is
    a singleton or the literal word NONE; for `order` the argument is
    N = p + 1 - t and it is a theorem, for the full-field liftable count it is the
    identity #liftable = (#E - 1 + z)/2 that the committed run verifies on every
    row, and for the rest it is an open question this record measures rather than
    assumes.
    WHY THE THREE QUANTITIES ARE THE RIGHT ONES AND NOT AN ARBITRARY TRIPLE. They
    are exactly the separating condition for the observation collision in claim
    (B): the four preimages of (`invariant`, 0.0, 1.0) are pairwise distinguished
    by (distinct-value count, entailment argument) except for the pair P1/P4,
    which the nearby-object control separates by exhibiting a functional known to
    vary. The triple is therefore not a diagnostic wish-list; it is the minimal
    addition that makes the emitted label identifiable, and it is the same shape
    of repair IDEA-20260829-9aaa40 prescribes for a boolean whose fibre contains
    two ground truths.
    WHY THE PERMUTATION HALF NEEDS THE ORBIT AND NOT JUST THE BUDGET.
    IDEA-20260807-caf061 already prints the Monte Carlo floor 1/(B+1), and that
    floor vanishes as B grows. The orbit-size floor does not: it is a property of
    the randomization group and the statistic, it survives B tending to infinity,
    and it is the floor that BINDS once a design is blocked. This is why claim (D)
    is a consequence of the mechanism rather than a separate observation --
    refining the blocking passes to a subgroup, the orbit can only shrink, and at
    the limit where the statistic is constant on the orbit the test is perfectly
    valid and completely powerless.
    HOW THE OBJECT PROPAGATES, WHICH IS WHAT MAKES IT AN OBJECT. The lane's one
    admissible operation on a null design is REFINEMENT of the blocking. Under it
    the randomization group passes to a subgroup, so the statistic's orbit is
    non-increasing and the attainable p-value set is non-decreasing in coarseness
    -- a monotone, deterministic, one-step rule, measurable at depth 1 exactly as
    IDEA-20260829-9aaa40's coarsening lattice is measurable at depth 1. That
    monotonicity is what turns "report two integers" into a tracked object with a
    propagation law, and it is what the three-point curve over
    {free, twist-blocked, N-band-blocked} measures.
    THE LOSSY-PROJECTION ARGUMENT, IN ONE LINE HERE AND IN FULL IN ITS OWN FIELD.
    The projection from (curves, functional, measured values, randomization) to
    (attainable-outcome set, distinct-value count, orbit size) throws away all the
    mathematics and keeps only what the verdict function consumes, which is why it
    is genuinely lossy and why what it keeps still propagates deterministically
    under refinement. See lossy_projection_test.
    WHAT THE AUDIT DOES NOT DO. It recomputes; it does not re-decide. Every verdict
    label emitted with the three fields attached must equal the committed label,
    and prediction 5 makes that a pass/fail gate rather than an aspiration. An
    audit that changes a verdict has stopped auditing.

  tracked_object: >-
    THE ATTAINABLE-OUTCOME SET of an emitted verdict: the exact set of values
    the verdict function can return, given the declared randomization or
    null model and the arithmetic constraints on its input, BEFORE any datum is
    measured. Carried as a triple (attainable-outcome set, distinct-value count
    of the input, orbit size of the statistic under the declared randomization).

  lossy_projection_test: >-
    PASSES, and the check is algebraic and costs nothing. The projection sends
    (curves, functional, measured values, randomization) to a finite set of
    labels plus two integers. It discards the curves, the arithmetic, every
    measured value, and the mathematics the functional was meant to express;
    two verdicts of completely different mathematical content have the same
    attainable-outcome set, which is the point. What it discards is discarded
    COMPATIBLY with the operation the instrument performs, because the verdict
    functions committed here are threshold maps on a single statistic
    (exact_null_verdict thresholds at variance == 0; permutation_null counts
    orbit members at or below the observed value), so the attainable set is
    determined by the statistic's orbit and by nothing else that was discarded.
    Deterministic propagation is exhibited by the lane's own admissible
    operation: REFINING THE BLOCKING passes to a subgroup of the randomization
    group, so the orbit of the statistic can only shrink and the attainable
    p-value set can only coarsen -- a monotone one-step rule, measurable at
    depth 1 exactly as IDEA-20260829-9aaa40's coarsening lattice is. It is NOT a
    change of coordinates: nothing about the curves, the functional or the
    values can be reconstructed from the triple, and the fibre over
    ({invariant}, 1, 1) is exactly the set of entailed verdicts, which is the
    object of interest.

  scope_verdict: >-
    IN SCOPE. Every object touched is inside RQ-INSTR-f8faa0's declared scope:
    toy ordinary prime-field short-Weierstrass curves enumerated by isogeny
    class, prime fields, p = 4001 (about 12 bits, under the declared ~32-bit
    ceiling), the campaign's own null objects and certificates.
    SEPARATELY, AND STATED BECAUSE THE DISPATCHING BRIEF ASKED FOR IT: the three
    cross-lane failures that motivated this record (IDEA-20260829-9aaa40 on the
    symmetric frontier, IDEA-20260829-9e6650 on differential paths,
    IDEA-20260829-c7472b on rank certification) are OUTSIDE this question's
    declared scope on all three scope axes at once -- none involves an elliptic
    curve over a prime field of at most about 32 bits, and two involve no
    elliptic curve at all. This record imports only the FAILURE SHAPE from
    IDEA-20260829-9aaa40 and instantiates it on in-scope objects; it files no
    claim about those lanes and asks for no widening. The scope gap itself --
    that this question's title and decision_target are program-general while its
    `scope` block is bound to GOAL-ENDO-001's lane, and that several already
    filed proposals under this question (for example IDEA-20260816-2f049b, whose
    object is a side-channel leak detector, read in full this session) are
    already outside that block -- is a defect of the QUESTION RECORD and its
    repair is a clause-scoped correction record, which only the Coordinator may
    create. This proposal proposes that such a record is needed and does not
    create one.

