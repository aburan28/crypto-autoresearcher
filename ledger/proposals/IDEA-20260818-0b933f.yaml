  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the primary lens: (i) enumerate the ambiguous
      forms (IDEA-20260809-83cbc7's lens); (ii) search for low-order elements
      directly (IDEA-20260809-87c235's lens); (iii) sweep and fit a cost curve;
      (iv) parameter provenance. This record's lens is the l-torsion SUBGROUP as
      a tracked object with a findability exponent, which is none of these.
    tracked_object: >-
      Cl(D)[l], the l-torsion subgroup, together with its rank r, tracked as l
      ranges over small primes and D over the discriminant family.
    lossiness: >-
      LOSSY-PROJECTION TEST, AND THIS IS THE CLEANEST INSTANCE IN THIS SESSION.
      The map Cl(D) -> Cl(D)[l] discards the entire prime-to-l part of the group
      and every higher l-power layer above the first. It is massively
      non-invertible: from Cl(D)[l] one cannot recover h(D), cannot recover the
      group structure, and cannot recover any element of order coprime to l. So
      it is not a change of coordinates. AND WHAT IT DISCARDS IS DISCARDED
      COMPATIBLY WITH THE TARGET'S OPERATION: Cl(D)[l] is a SUBGROUP, so the
      composition of forms restricts to it exactly, and the projection is
      functorial -- the retained part propagates deterministically under the
      group law with no leakage from the discarded part. This is precisely the
      structure the inventor protocol's test asks for, and it is why the l-rank,
      not the class number, is the right coordinate for the low-order
      assumption.
      CONTRAST WITH A PROJECTION THAT FAILS: tracking the pair
      (h(D) mod l, h(D) div l) discards nothing recoverable and is a change of
      coordinates on h; it would be worthless.
    propagation: >-
      One-step propagation is exactly the group law restricted to the subgroup,
      and it is measurable: given a candidate g, verify g^l = 1 and g != 1 in
      two compositions and a comparison. The object's rank r is measurable
      wherever the full group is computable, which anchors the map empirically
      at reachable sizes.
    survival: >-
      Survives for every l and every D as a mathematical object. It DISSOLVES as
      a USEFUL object exactly where its rank is 0, which for l = 2 and D = -p
      prime is always -- and that dissolution IS the countermeasure. Recording
      where an object dies is as informative as recording where it lives, and
      here the death is total, provable and cheap to certify.
    scoring: >-
      GENUINELY NEW OR REPACKAGING: the object is classical; treating its RANK
      as the free parameter of a findability exponent, and deriving the rank
      threshold at which it would matter, is not present in this corpus.
      CONCRETELY TESTABLE: yes -- rank is computable at reachable sizes, and the
      routes to an element are timeable.
      SURVIVAL: to rank 0, which is where the deployed convention puts it for
      l = 2 and where Cohen-Lenstra puts it about 56 percent of the time for
      l = 3.

  proof_search_map:
    bottleneck: >-
      Producing ONE nontrivial element of Cl(D)[l] without computing h(D). Every
      known odd-l route computes h(D) first; removing that dependency is what
      would separate the low-order assumption from the order-computation
      assumption, and nothing else needs to change for that separation to occur.
    baseline_embedding:
      parameter_slice: >-
        l = 2 with t >= 2 prime divisors. In this slice the answer is known to
        be polynomial (ambiguous forms from the factorization), so the exponent
        map must return 0 there. That is the baseline the map must reproduce.
      reproduction_check: >-
        FROZEN FIXTURE: for a list of composite fundamental discriminants with
        known factorizations, the pipeline must construct an element of order
        exactly 2 in time independent of |D| beyond arithmetic cost, and must
        return "no such element" for D = -p with p = 3 mod 4. Both directions
        asserted. If the pipeline cannot reproduce the classical l = 2 case it
        cannot be trusted on l = 3.
    observation_collision:
      observable: >-
        "A nontrivial element g with g^l = 1", i.e. the certificate the
        low-order assumption is about.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE RECORD'S SHARPEST POINT. The observable
        does not distinguish (i) a group whose l-torsion is trivial, from
        (ii) a group whose l-torsion is nontrivial but whose elements were not
        found within budget. Absence of the certificate is compatible with both.
        FOR l = 2 THE COLLISION IS BROKEN by genus theory, which certifies
        ABSENCE in polynomial time. FOR ODD l IT IS NOT BROKEN BY ANYTHING
        KNOWN: there is no cheap certificate of "Cl(D)[3] is trivial" short of
        computing h(D). So the low-order assumption for odd l is not merely
        unproven -- it is not even cheaply CHECKABLE in the negative direction,
        and that asymmetry between checkable-for-2 and uncheckable-for-3 is a
        statement about the assumption that this corpus does not contain.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "search Cl(D) for an l-torsion element" by "enumerate reduced
          binary cubic forms of discriminant D" (l = 3), moving from a group
          search to an exact Diophantine condition on four bounded integers.
        predicted_gain: >-
          PREDICTED NEGATIVE: |D|^{3/4+o(1)} pointwise, against |D|^{1/4} for
          the generic route -- i.e. the transform LOSES by half an exponent. It
          is proposed because the loss has never been measured here and because
          the same enumeration is cheap in AMORTIZED form across a sweep, where
          it becomes the cheapest known way to populate 3-rank statistics.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable ("no l-torsion element found") fixed and vary the
          hidden structure (rank 0 versus rank >= 1 with a failed search),
          seeking an intrinsic invariant that separates them cheaply for odd l.
        predicted_gain: >-
          If such an invariant existed it would be a cheap negative certificate
          for the low-order assumption -- a defender-side tool, not an attack.
          None is known. Naming the search is the deliverable; finding one would
          be a genuine result and is not expected.
    quantifier_order: >-
      THE LOW-ORDER ASSUMPTION, WRITTEN WITH EXPLICIT ORDER:
      FOR ALL probabilistic polynomial-time A, FOR ALL sufficiently large
      security parameters, FOR the discriminant D sampled by the declared
      procedure, THE PROBABILITY over A's coins that A(D) outputs (g, l) with
      g != 1, l > 1, l bounded, and g^l = 1, is negligible.
      NOTE WHAT MOVES. D is sampled ONCE and is PUBLIC FOR THE LIFETIME OF THE
      DEPLOYMENT, so A may depend on D through unbounded preprocessing. The
      assumption as usually quantified does not grant that, and the gap between
      "polynomial-time in the security parameter" and "years of preprocessing
      against one fixed public D" is a quantifier gap, not a constant. This
      record does not exploit it and does not claim it is exploitable; it
      records it, and hands it to the preprocessing direction named in
      IDEA-20260818-170937 forward guidance item F4.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is: over the tested discriminants and
        the enumerated routes, the measured cost of producing an l-torsion
        element matches the derived exponent map, and no route cheaper than
        whole-group computation was found for odd l. It CANNOT certify that no
        such route exists, and no record under this proposal may say so.
      nearby_object_control: >-
        Apply the identical machinery to l = 2 with t >= 2, where a cheap route
        DOES exist and the conclusion "no route cheaper than whole-group
        computation" MUST FAIL. If the machinery reports l = 2 as hard, it is
        not detecting structural shortcuts and its odd-l negative is worthless.
        THIS CONTROL IS FREE AND BLOCKING.
    proof_obligations:
      - claim: "2-rank = t-1 for fundamental discriminants; D = -p, p = 3 mod 4 gives 2-rank 0 and odd h."
        responsibility: baseline
      - claim: "Random search for an l-torsion element costs h/l^r group operations."
        responsibility: runtime
      - claim: "l^r > |D|^{1/4} is the threshold for random search to beat the generic route."
        responsibility: strictness
      - claim: "Threshold values 161.5 (l=3, 1024 bits), 323.0 (l=3, 2048), 110.2 (l=5, 1024), 257.1 (l=3, 1024, vs index calculus)."
        responsibility: feasibility
      - claim: "Cohen-Lenstra divisibility probabilities 0.4399 / 0.2396 / 0.1632 for l = 3/5/7."
        responsibility: success_probability
      - claim: "Pointwise cubic-form enumeration costs |D|^{3/4+o(1)}."
        responsibility: runtime
      - claim: "Claims are scoped to the tested discriminants and the enumerated routes only."
        responsibility: scope

  null_object_control: >-
    NULL 1 (KNOWN-ANSWER POSITIVE NULL). Composite fundamental discriminants
    with t >= 2, where an element of order 2 must be produced in polynomial time
    from the public factorization. The pipeline MUST succeed instantly. Failure
    voids everything.
    NULL 2 (KNOWN-ANSWER NEGATIVE NULL). D = -p with p = 3 mod 4, where
    Cl(D)[2] is provably trivial. The pipeline MUST certify absence in
    polynomial time via genus theory, NOT by exhausting a search budget. A
    pipeline that reports "not found within budget" here is reporting an
    infrastructure outcome as a mathematical one, which AGENTS.md rule 3
    forbids, and the design must make the distinction machine-checkable.
    NULL 3 (STRUCTURELESS TWIN). For each Cl(D) whose structure is computed,
    build a black-box abelian group with the SAME invariant factors and no
    arithmetic, and run the random-search route on it. Prediction: identical
    cost, since random search uses nothing but the group law. A DIFFERENCE means
    the search is exploiting class-group arithmetic and the derived h/l^r
    exponent is not what is being measured.
    NULL 4 (RANK-CALIBRATION NULL). Sample enough discriminants at a reachable
    size to measure the empirical frequency of 3 | h(D), and compare against the
    recomputed Cohen-Lenstra value 0.439874. If the empirical frequency does not
    match, either the sampler is biased or Cohen-Lenstra does not describe the
    tested family, and either way the exponent map's third term is being
    evaluated at the wrong rank distribution.

  predictions:
    - metric: >-
        empirical frequency of l | h(D) over >= 2000 sampled prime discriminants
        D = -p, p = 3 mod 4, at a reachable size, for l in {3, 5, 7}
      direction: different
      minimum_effect: >-
        Predicted 0.4399, 0.2396, 0.1632 respectively (recomputed from the
        Cohen-Lenstra product in this session), each within +/- 0.025 at n =
        2000. A deviation beyond 3 sigma for any l is a finding about the
        deployed discriminant family, not about the heuristic, and must be
        reported as such.
    - metric: >-
        measured wall clock of pointwise cubic-form enumeration for Cl(D)[3],
        fitted exponent in log|D|
      direction: different
      minimum_effect: >-
        Predicted 0.75 +/- 0.10. An exponent below 0.30 would mean the
        structural route beats the generic whole-group route and would be a
        scoped methodological finding about the low-order assumption's
        independence -- reported at that width and no wider, escalated to
        adversarial review, and explicitly NOT reported as a break.
    - metric: >-
        3-rank distribution over the sampled discriminants; maximum observed
      direction: different
      minimum_effect: >-
        Predicted rank 0 with probability about 0.56 and rank 1 with most of the
        remainder; maximum observed rank over 2000 samples predicted <= 3. An
        observed rank >= 6 in a uniform sample at reachable size would
        contradict Cohen-Lenstra badly enough to be the report's headline.
    - metric: >-
        derived rank threshold at which random search beats the generic route,
        recomputed symbolically for l in {3,5,7} and log2|D| in {1024, 2048, 3072}
      direction: different
      minimum_effect: >-
        FORCED by arithmetic: 161.5 and 323.0 and 484.5 for l = 3; 110.2 for
        l = 5 at 1024 bits. The margin against the largest CONSTRUCTED 3-rank
        (recalled as single-digit; the record must be verified) is predicted to
        exceed a factor of 20. A verified constructed 3-rank above 40 would
        shrink that margin enough to matter and would be the item to escalate.
    - metric: >-
        cost of certifying ABSENCE of l-torsion, l = 2 versus l odd
      direction: different
      minimum_effect: >-
        Predicted polynomial for l = 2 (genus theory) and no route below
        min(L[1/2,c], |D|^{1/4}) for odd l -- an exponent gap of 1/4 in the
        certification direction. If a cheap odd-l absence certificate is found,
        that is a DEFENDER-SIDE result of real value and should be pursued
        rather than filed.

  minimal_test:
    design: >-
      THREE STAGES, THE FIRST TWO NEARLY FREE.
      STAGE A (ZERO COMPUTE, HOURS). Recompute the Cohen-Lenstra probabilities
      and the rank thresholds symbolically for l in {3,5,7} and log2|D| in
      {1024, 2048, 3072}, as a frozen fixture. Primary-read Ellenberg-Venkatesh
      for the 3-torsion exponent and arXiv:2505.00611 for the current pointwise
      bound; verify or correct the recalled single-digit record for constructed
      imaginary quadratic 3-rank. Run the l = 2 nearby-object control.
      STAGE B (LOW COMPUTE, DAYS). Sample >= 2000 prime discriminants D = -p,
      p = 3 mod 4, at a size where the class group is computable in seconds
      (about 2^{60} to 2^{80}). Compute Cl(D) fully; record h, the l-rank for
      l in {3,5,7}, and the invariant factors. Compare against Cohen-Lenstra
      (Null 4). Run Nulls 1, 2 and 3.
      STAGE C (MODERATE COMPUTE, DAYS). At 4 sizes spanning 2^{48} to 2^{96},
      on discriminants VERIFIED in Stage B to have 3-rank >= 1 so a target
      exists, RACE three routes to a nontrivial element of Cl(D)[3]:
      (R1) full index-calculus computation then g^{h/3};
      (R2) generic order/structure computation then g^{h/3};
      (R3) pointwise reduced-binary-cubic-form enumeration of discriminant D.
      Fit each route's exponent. Report the map eps(l, r, |D|) with measured and
      derived entries distinguished typographically.
    controls:
      - Null 1 known-answer positive (l = 2, t >= 2), blocking.
      - Null 2 known-answer negative (l = 2, D = -p), blocking, and it must
        certify absence rather than exhaust a budget.
      - Null 3 structureless twin for the random-search route.
      - Null 4 rank calibration against Cohen-Lenstra.
      - >-
        TARGET-EXISTENCE CONTROL: Stage C runs only on discriminants where
        Stage B has already PROVED an element of order 3 exists. Racing routes
        on a group with no target measures nothing, and a "not found" there is
        an infrastructure outcome (AGENTS.md rule 3).
      - >-
        AMORTIZED-VERSUS-POINTWISE CONTROL: route R3 is timed both pointwise
        (single target D) and amortized (enumerate a range and harvest all
        discriminants in it), and the two are reported separately and never
        pooled. Conflating them is the specific error this record exists to
        prevent.
    required_metrics:
      - Empirical P(l | h) for l in {3,5,7} with binomial intervals, n >= 2000.
      - l-rank distribution and maximum observed, per l.
      - Wall clock and operation counts for R1, R2, R3 per discriminant per size.
      - Fitted exponent per route with interval.
      - Cost of certifying absence, l = 2 versus odd l.
      - The eps(l, r, |D|) map with derived and measured entries marked.
      - Null 1-4 outcomes.
      - Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
      The l = 2 nearby-object control reports l = 2 as hard. The machinery does
      not detect structural shortcuts; its odd-l negative is worthless and the
      record is void until the control passes.
    - >-
      Null 2 reports absence by budget exhaustion rather than by genus-theory
      certificate. Design error; fix before any odd-l result is recorded.
    - >-
      Empirical P(3 | h) deviates from 0.439874 by more than 3 sigma at
      n = 2000. Either the sampler is biased or the tested family is not
      Cohen-Lenstra-generic; the exponent map's rank distribution is then
      unsupported and must be re-derived from the measured distribution.
    - >-
      Route R3's fitted exponent is below 0.30. The structural route beats the
      whole-group route for l = 3; the low-order assumption has a cheaper path
      than believed for that l. SCOPED METHODOLOGICAL FINDING ONLY -- it is a
      statement about Cl(D), not about any deployed system, and it must be
      escalated to adversarial review before any wider phrasing is used.
    - >-
      Route R3's fitted exponent is above 1.0. Worse even than predicted; the
      route is not competitive and the map's entry is filled with the measured
      value. This is the expected and useful negative.
    - >-
      A verified constructed imaginary quadratic 3-rank above 40 is found in the
      literature. The margin between constructible ranks and the derived
      threshold shrinks by more than an order of magnitude and the steering
      question of IDEA-20260815-beb144 becomes materially more urgent.
    - >-
      A cheap certificate of odd-l torsion ABSENCE is found. Defender-side
      positive; pursue rather than file.
    - >-
      A primary read shows the eps map or the rank threshold is already stated
      in the hidden-order-group literature. novelty_status becomes `known`; the
      measurement retains value.

  obstruction:
    statement: >-
      A CLAIM ABOUT THE OBJECT: for odd l there is no known map from public data
      about D (its size, its primality, its factorization) to a nontrivial
      element of Cl(D)[l], and no known cheap certificate of that subgroup's
      triviality. Both exist for l = 2 via genus theory, and the reason is that
      the 2-torsion is determined by the discriminant's factorization while the
      odd part is Cohen-Lenstra-generic. The obstruction is therefore an
      ASYMMETRY between l = 2 and odd l, measurable as the gap between the two
      certification costs.
    quantity: >-
      absence_certificate_exponent(l) := log_{|D|} of the cheapest measured cost
      of certifying that Cl(D)[l] is trivial, for l in {2, 3, 5, 7}; and
      findability_exponent(l, r) for the positive direction.
    value: >-
      NOT MEASURED. Predicted 0 for l = 2 (polynomial) and min(1/4, subexp) for
      odd l -- a derived gap of about 1/4. These are DERIVATIONS and must not be
      written into this field; it is filled from Stage B and C runs or left
      empty.
    measured_by: []
    scope: >-
      To be stated as: prime discriminants D = -p with p = 3 mod 4 at the tested
      sizes, l in {2,3,5,7}, the three enumerated routes, and the named
      implementations. Claimed for no other l, no other discriminant family, and
      explicitly not for adversaries permitted D-dependent preprocessing.
    resource_check:
      examined: true
      reading: >-
        READ THE OTHER WAY ROUND, AND IT TAKES STRONGLY. (1) "There is no cheap
        certificate that Cl(D)[3] is trivial" is a statement that blocks an
        AUDIT, not an attack -- and read as a resource it is the hypothesis of a
        DEFENDER-SIDE research direction this program has not named: cheap
        negative certificates for hidden-order-group assumptions. A construction
        that let a deployer publish "this discriminant has trivial 3-torsion,
        verifiable in polynomial time" would be directly useful and is not ruled
        out by anything here; the l = 2 case shows such certificates can exist.
        (2) The same asymmetry is the hypothesis of a REDUCTION: if odd-l
        low-order and adaptive-root both collapse onto order computation, then
        the deployed assumption set is thinner than it appears -- one hard
        problem, not three -- which SIMPLIFIES the security argument and is a
        positive contribution to it, not a criticism of it. That reading is the
        opposite in sign from how obstructions are usually read here and is
        recorded deliberately.
        (3) The l-rank as a coordinate is the hypothesis of the steerability
        analysis of IDEA-20260815-beb144, which currently has an unenumerated
        property list; this obstruction hands it one named property with a
        rigorous bound and a numerical threshold.
      spawned_ids: []

  confounders:
    - >-
      TARGET NON-EXISTENCE MASQUERADING AS HARDNESS. About 56 percent of
      discriminants have no 3-torsion at all. Racing routes on such a
      discriminant measures nothing, and a naive design would record the null
      result as evidence of hardness. The target-existence control exists for
      exactly this and is blocking.
    - >-
      SMALL-SIZE RANK DEGENERACY. At 2^{48} the class number is only about
      2^{24}, so l-rank statistics and route timings are both dominated by
      small-number effects. The lowest size is reported separately, never pooled
      into a fit.
    - >-
      AMORTIZED-POINTWISE CONFLATION for route R3. Belabas-style enumeration is
      cheap per field over a RANGE and expensive for one target. Reporting the
      amortized figure as the pointwise cost would invert this record's
      conclusion, and the control forbids it.
    - >-
      IMPLEMENTATION ASYMMETRY across the three routes, exactly as in
      IDEA-20260818-ec1740: operation counts are required alongside wall clock.
    - >-
      COHEN-LENSTRA IS A HEURISTIC, and the deployed family (prime D = -p,
      p = 3 mod 4) is a sub-family it is applied to by convention. The
      calibration null measures the convention rather than assuming it.

  interpretation_limits:
    - >-
      Scoped to the tested discriminants, the tested l, the enumerated routes
      and the named implementations. Every statement is about the group Cl(D)
      and none is about any system that uses it, per the RQ's
      claim_tier_ceiling.
    - >-
      Toy and small-moderate discriminants only. The rank thresholds at 1024 and
      2048 bits are DERIVED from the cost model, not measured, and are not
      security estimates.
    - >-
      A negative for route R3 closes exactly that route at exactly those sizes.
      It says nothing about the existence of a better pointwise l-torsion
      algorithm, and the record may not be cited as if it did.
    - >-
      The l = 2 content is classical. Its inclusion is for completeness of the
      map and confers no novelty on the record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (COHEN-LENSTRA FOR THE ODD PART.) For imaginary quadratic fields with
        fundamental discriminant D, the odd part of Cl(D) is distributed as a
        random finite abelian group weighted inversely by the size of its
        automorphism group; in particular P(l | h(D)) = 1 - prod_{i>=1}(1-l^{-i})
        and the l-rank is 0 or 1 with probability approaching 1 as l grows,
        uniformly over the family of prime discriminants D = -p, p = 3 mod 4, at
        the tested sizes.
      rigorous_support: >-
        Rigorous ingredient: the average size of Cl(D)[3] over imaginary
        quadratic fields is known unconditionally (Davenport-Heilbronn), and
        Ellenberg-Venkatesh give pointwise upper bounds on |Cl(D)[3]|. Classical
        distribution statement imitated: the Cohen-Lenstra measure on finite
        abelian groups. THE GAP: Cohen-Lenstra is a heuristic, the rank
        distribution's TAIL is exactly what a steering adversary would exploit,
        and 2000 samples cannot see it.
      falsification_condition: >-
        Empirical P(l | h) deviates from the predicted value by more than 3
        sigma at n = 2000 for any l in {3,5,7}, or an l-rank above 3 is observed
        in a uniform sample.
      validation_plan: >-
        SAMPLE: >= 2000 prime discriminants D = -p, p = 3 mod 4, at 2^{60} to
        2^{80} where full class group computation takes seconds -- THE SHORTCUT
        THAT MAKES SCALE POSSIBLE is that rank statistics need many small
        computations rather than few large ones, so this heuristic can be
        validated at a sample size the cost-curve programme can never reach.
        COMPARISON: empirical frequencies against 0.439874 / 0.239600 /
        0.163180, with binomial intervals; full rank histogram against the
        Cohen-Lenstra rank distribution. TAIL CHECK: the maximum observed rank
        per l against its predicted probability, in the style of the exemplar's
        smoothest-sample check. TRANSFER ASSUMPTION, STATED: that rank
        statistics at 2^{60}-2^{80} transfer to 1024+ bits. UNJUSTIFIED and
        recorded as unjustified.
    - id: H2
      statement: >-
        (RANDOM-SEARCH COST MODEL.) The expected number of uniformly random
        group elements examined before finding a nontrivial element of
        Cl(D)[l] is h(D)/(l^r - 1) up to a factor 1+o(1), and each examination
        costs O(log h) compositions.
      rigorous_support: >-
        Rigorous: exact for a uniform sampler on a finite abelian group. The
        heuristic content is only that the sampler used (random products of
        small prime forms) is close to uniform.
      falsification_condition: >-
        Measured random-search cost on the structureless twin (Null 3) differs
        from measured cost on the real class group beyond sampling error.
      validation_plan: >-
        SAMPLE: 10^4 searches per discriminant on both the real group and the
        twin. COMPARISON: mean and variance of trials-to-success against
        h/(l^r - 1). TAIL CHECK: the longest search observed against the
        geometric tail. TRANSFER: none.
    - id: H3
      statement: >-
        (SAMPLER MIXING.) Products of O(log|D|) uniformly chosen prime forms of
        norm below the Bach bound are statistically close to uniform on Cl(D),
        so the random-search cost model applies.
      rigorous_support: >-
        Rigorous companion: the rapid-mixing theorem for random walks on the
        Arakelov class group under the Riemann Hypothesis for Hecke
        L-functions (de Boer-Ducas-Pellet-Mary-Wesolowski), used in the same
        form by ePrint 2025/1514 Corollary 6.5. NOT primary-read for the
        imaginary quadratic specialization; constants unchecked.
      falsification_condition: >-
        The distribution of walk endpoints over the computed group's cyclic
        decomposition deviates from uniform beyond sampling error at any tested
        walk length. Note this check is only available where the group has been
        fully computed, which is why it runs at Stage B sizes.
      validation_plan: >-
        SAMPLE: 10^5 walk endpoints per discriminant per length in {4,8,16,32},
        on Stage B discriminants where the full structure is known so endpoints
        can be expressed in the invariant-factor basis. COMPARISON: chi-squared
        against uniform. TAIL CHECK: least-visited coset. TRANSFER: none.
    - id: H4
      statement: >-
        (GRH.) GRH holds, underwriting the Bach bound used by the sampler, the
        subexponential and |D|^{1/4} route costs used in the exponent map, and
        the conditional half of the Ellenberg-Venkatesh l-torsion bounds.
      rigorous_support: >-
        Unproved; unconditional analogues with worse exponents exist, so its
        contribution is quantifiable. Numbered because the exponent map inherits
        it in three places.
      falsification_condition: >-
        Not falsifiable here. Testable proxy: computed h(D) must match the
        ERH-interval analytic estimate at every Stage B discriminant.
      validation_plan: >-
        SAMPLE: all Stage B discriminants. COMPARISON: computed h against the
        truncated Euler product with the ERH error term. TAIL CHECK: largest
        relative deviation. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND THE RECORD PREDICTS ITS OWN CANDIDATE
      ROUTE LOSES. The derived map is
      eps(2, 0, .) = absence, certified in polynomial time;
      eps(2, r>=1, .) = 0 (polynomial from the public factorization);
      eps(l odd, r, |D|) = min(1/4, subexponential, 1/2 - r log l/log|D|),
      with the third term relevant only above the derived rank thresholds 161.5
      (l = 3, 1024 bits), 323.0 (l = 3, 2048 bits), 110.2 (l = 5, 1024 bits),
      and 257.1 (l = 3, 1024 bits, against index calculus rather than the
      generic route). Route R3 (pointwise cubic forms) is predicted at
      |D|^{3/4+o(1)}, i.e. strictly worse than both incumbents.
    memory_exponent: >-
      Route R1 inherits index calculus's subexponential memory (see
      IDEA-20260818-ffeddf). Route R2 is low memory. Route R3 is essentially
      memory-free: it enumerates a box and tests a Diophantine condition, needing
      O(1) storage beyond the output, which is its ONE genuine advantage and is
      the reason it deserves timing despite the predicted exponent loss -- on the
      (time, memory) Pareto frontier it occupies a corner neither incumbent
      does, at |D|^{3/4} time and polynomial memory. Whether that corner is ever
      useful depends on the memory-bounded analysis of IDEA-20260818-ffeddf.
    best_known: >-
      FRONTIER ROWS CHECKED FOR THE SPECIFIC TASK "produce a nontrivial element
      of Cl(D)[l]", ON TIME, MEMORY AND DATA/QUERIES:
      (1) via full index calculus then exponentiation: L[1/2, 3/sqrt(8)] time
      under GRH, subexponential memory.
      (2) via generic order/structure computation then exponentiation: Booker
      |D|^{1/4} under GRH with polynomial memory, or Sutherland
      O((N/loglog N)^{1/2}) generic operations.
      (3) random search: |D|^{1/2}/l^r time, O(1) memory.
      (4) l = 2 only: polynomial time and memory from genus theory and the
      public factorization -- STRICTLY DOMINATES EVERY OTHER ROW FOR l = 2 ON
      ALL AXES, which is why the countermeasure targets exactly it.
      (5) pointwise cubic forms, l = 3: |D|^{3/4+o(1)} time, O(1) memory
      (this record's candidate; RECALLED exponent, to be measured).
      (6) quantum, Hallgren: polynomial time and space for quadratic fields,
      dominating rows (1)-(3) and (5) outright.
      NOT CHECKED, AND NAMED AS UNCHECKED: whether a dedicated pointwise
      l-torsion algorithm better than (5) exists in the cubic-fields literature.
    hidden_overhead: >-
      The o(1) in row (5) is unquantified and could easily be a factor of 10^3
      at the tested sizes, since the enumeration's inner loop solves a quartic
      condition per candidate triple. The exponent map's subexponential entry
      carries the same large o(1) discussed in IDEA-20260818-ec1740. The l = 2
      entry's "polynomial" hides only ordinary arithmetic and is the one honest
      constant in the table.
    tradeoff_note: >-
      The three odd-l routes sit at three different Pareto corners:
      subexponential time with subexponential memory; |D|^{1/4} time with
      polynomial memory; |D|^{3/4} time with constant memory. NONE DOMINATES THE
      OTHERS ON BOTH AXES, so the "cheapest route" is a function of the
      adversary's memory bound -- which is exactly the c(W) framing of
      IDEA-20260818-ffeddf applied to a different task, and is the reason these
      two records should be read together. Random search parallelizes perfectly
      with no memory; the cubic enumeration parallelizes perfectly by splitting
      the box; index calculus does not parallelize on its linear-algebra leg.
      An adversary with many low-memory cores faces a very different ordering
      from the one a single-machine cost model implies.

  dominated_by: >-
    CHECKED AGAINST EVERY ROW IN `target_complexity.best_known` ON TIME, MEMORY
    AND DATA/QUERIES.
    AS AN ALGORITHM: the candidate route (5) is DOMINATED ON TIME by rows (1),
    (2) and (3) for all realistic ranks, and this record says so up front -- it
    predicts its own route loses by half an exponent. It is NOT dominated on
    MEMORY by rows (1) or (2), and it ties row (3) there, so it is not Pareto-
    dominated outright; it occupies a distinct corner. For l = 2 it is dominated
    on every axis by row (4).
    AS AN ASSUMPTION AUDIT: the incumbent in this corpus is
    IDEA-20260809-83cbc7, which enumerates sub-cases and countermeasures. This
    record does not dominate it -- 83cbc7 covers structural cases this record
    does not enumerate -- and 83cbc7 does not dominate this, since it produces
    no exponent map. IF THE COORDINATOR JUDGES THE OVERLAP TOO LARGE, THE
    HONEST DISPOSITION IS TO MERGE THIS INTO 83cbc7 RATHER THAN RUN BOTH.
    AS A MEASUREMENT: no incumbent measures the pointwise cubic-form route or
    the rank distribution at n >= 2000 in this corpus.
    QUANTUM: row (6) dominates everything classical here and is recorded.
    NOT NULL ON ANY AXIS.
  sota_delta: >-
    NO ATTACK, NO EXPONENT IMPROVEMENT, AND THE CANDIDATE ROUTE IS PREDICTED TO
    LOSE. Quantitatively delivered: (i) the eps(l, r, |D|) findability map,
    replacing a qualitative assumption with a function; (ii) derived rank
    thresholds -- 3-rank > 161.5 at 1024 bits and > 323.0 at 2048 bits for the
    l-rank route to beat the generic route, and > 257.1 to beat index calculus
    -- against a recalled largest-constructed 3-rank in the single digits, a
    margin of roughly a factor of 25 stated as a number for the first time here;
    (iii) recomputed Cohen-Lenstra divisibility probabilities 0.4399 / 0.2396 /
    0.1632 with a 2000-sample empirical calibration; (iv) the first timing of
    the pointwise cubic-form route, predicted |D|^{3/4+o(1)}, filling a cell of
    the frontier table that is currently RECALLED rather than measured; (v) the
    certification asymmetry -- polynomial-time absence certificate for l = 2,
    none known below |D|^{1/4} for odd l -- and its reading as a defender-side
    open direction.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the l = 2 controls pass (classical mathematics).
    0.8 that empirical Cohen-Lenstra frequencies match within 3 sigma.
    0.85 that route R3 fits an exponent in [0.6, 0.9], i.e. loses as predicted.
    0.08 that route R3 comes in below 0.30, which is the outcome that would
    matter and is the reason to run it at all.
    0.5 that the exponent map or the rank threshold turns out to be stated
    already in the hidden-order-group literature, degrading novelty to `known`.
    0.4 that the Coordinator judges the overlap with IDEA-20260809-83cbc7 large
    enough to merge rather than run separately, which this record endorses.

