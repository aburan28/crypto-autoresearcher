idea:
  id: IDEA-20260818-0b933f
  question_id: RQ-CLGRP-66ab7f
  added: '2026-08-18'
  title: >-
    THE LOW-ORDER ASSUMPTION IS NOT AN EXISTENCE CLAIM: track Cl(D)[l] as an
    object, derive the findability exponent as a function of l and the l-rank,
    show that the l=2 countermeasure is exact while every odd l has no known
    route cheaper than computing the whole group, and measure the one route
    nobody has timed
  class: representation

  claim: >-
    Hidden-order constructions over class groups rest on a LOW-ORDER assumption
    and an ADAPTIVE ROOT assumption. Both are routinely discussed as if they
    said "the group has no small-order elements". For odd l that reading is
    false, and the difference is quantifiable.
    (A) SMALL-ORDER ELEMENTS USUALLY EXIST. Under Cohen-Lenstra the probability
    that l divides h(D) is 1 - prod_{i>=1}(1 - l^{-i}), recomputed in this
    session as 0.4399 for l = 3, 0.2396 for l = 5 and 0.1632 for l = 7. A
    deployed class group very probably CONTAINS an element of order 3. The
    assumption's content is entirely about FINDABILITY.
    (B) l = 2 IS THE ONLY CASE WITH A STRUCTURAL SHORTCUT, AND THE DEPLOYED
    COUNTERMEASURE REMOVES IT EXACTLY. Genus theory gives 2-rank = t - 1 where t
    is the number of prime divisors of the fundamental discriminant. For
    D = -p with p prime, p = 3 mod 4, t = 1, so the 2-rank is 0, h(D) is odd and
    Cl(D)[2] is TRIVIAL -- not merely hard to search, but empty. For p = 1 mod 4
    the fundamental discriminant is -4p with t = 2, the 2-rank is 1, and an
    ambiguous form giving an element of order exactly 2 is written down in
    polynomial time from the factorization, which is public. THE
    CONGRUENCE CONDITION IS THE WHOLE COUNTERMEASURE, and its failure mode is
    immediate rather than gradual.
    (C) FOR ODD l THERE IS NO KNOWN SHORTCUT AT ALL. The cheapest known routes
    to a nontrivial element of Cl(D)[l] for odd l are (i) compute the whole
    group and take g^{h/l}, at min(L[1/2,c], |D|^{1/4+o(1)}), or (ii) random
    search, at h/|Cl(D)[l]| = |D|^{1/2+o(1)}/l^r group operations where r is the
    l-rank. DERIVED IN THIS RECORD: random search beats the generic whole-group
    route only when l^r > |D|^{1/4}, i.e. for l = 3 at a 1024-bit discriminant
    only when the 3-rank exceeds 161.5, and it beats index calculus only when
    the 3-rank exceeds 257.1. Constructed imaginary quadratic 3-ranks are in the
    single digits. The margin is a factor of order 25 in rank, and it is a
    NUMBER this program can state where the literature states a belief.
    (D) THE ASSUMPTION CASCADE COLLAPSES TO ONE PROBLEM. For odd l both the
    low-order and the adaptive root assumptions have, as far as is known, no
    attack that does not go through order computation. Stating that as an
    explicit map -- which sub-case each countermeasure removes, and which
    assumptions collapse onto which single hard problem -- is exactly the
    verified map RQ-CLGRP-66ab7f names as its decision target, and it does not
    currently exist in this corpus.
    (E) THE ONE UNTIMED ROUTE. Nontrivial elements of Cl(D)[3] correspond to
    cubic fields of discriminant D (Hasse / Davenport-Heilbronn), reachable by
    enumerating reduced binary cubic forms of discriminant D. NOBODY IN THIS
    PROGRAM HAS TIMED IT. This record proposes to, and predicts it loses.
    NOTHING HERE IS A BREAK OF ANY DEPLOYED CONSTRUCTION. Every statement is
    about the group Cl(D), not about any system using it, per the RQ's
    claim_tier_ceiling.

  mechanism: >-
    THE OBJECT IS Cl(D)[l], THE l-TORSION SUBGROUP, AND THE QUESTION IS ITS
    FINDABILITY EXPONENT.
    WHY l = 2 IS DIFFERENT, MECHANISTICALLY. Genus theory supplies an explicit
    isomorphism between Cl(D)/Cl(D)^2 and a group of characters indexed by the
    prime divisors of D, and the ambiguous forms realizing the 2-torsion are
    written directly from a factorization D = D_1 * D_2. The shortcut exists
    because the 2-torsion is DETERMINED BY DATA THAT IS PUBLIC -- the
    discriminant's factorization. There is no odd-l analogue: no character
    group indexed by the primes dividing D computes Cl(D)[3], and Cohen-Lenstra
    predicts the odd part behaves as if random. That asymmetry, and not the size
    of l, is what makes l = 2 the only structurally attackable case.
    THE FINDABILITY EXPONENT MAP. Define eps(l, r, |D|) as the log_{|D|} of the
    cheapest known cost of producing a nontrivial element of Cl(D)[l], where
    r is the l-rank. Then, under this record's cost model:
      eps(2, 0, .) = +infinity (no such element exists; genus theory certifies
        absence in polynomial time, which is a stronger statement than any
        search bound);
      eps(2, r>=1, .) = 0 (polynomial, from the public factorization);
      eps(l odd, r, .) = min( 1/4, [subexponential], 1/2 - r*log l/log|D| ).
    THE THIRD TERM IS THE ONLY ONE THAT DEPENDS ON THE DISCRIMINANT'S
    ARITHMETIC, and it is the term a discriminant-selection adversary would
    target. Setting it below 1/4 requires r*log l > (1/4) log|D|: at
    log2|D| = 1024 and l = 3 that is r > 1024/(4*log2 3) = 161.5; at
    log2|D| = 2048, r > 323.0; for l = 5 at 1024 bits, r > 110.2. Setting it
    below the index-calculus exponent 104.5/512 at 1024 bits requires
    3^r > 2^{407.5}, i.e. r > 257.1.
    WHY THAT NUMBER IS THE RESULT. The largest 3-ranks exhibited for imaginary
    quadratic fields are single-digit (RECALLED, and verifying the record is a
    named test item). So the derived threshold sits roughly 25 times above the
    best constructed rank. THIS IS A REASSURING RESULT AND IT IS STATED AS ONE:
    the record's expected outcome is that the l-rank route is nowhere near
    competitive, and the value of running it is that the margin becomes a
    measured number with a stated scope instead of an unexamined belief. A
    program that only proposes ideas whose success would be alarming is not
    auditing an assumption; it is hunting.
    THE UNTIMED ROUTE, IN DETAIL. By the Hasse correspondence, nontrivial
    3-torsion classes of Cl(D) correspond to cubic fields of discriminant D, and
    those correspond to classes of reduced irreducible binary cubic forms
    (a,b,c,d) of discriminant D under GL_2(Z). Julia/Hermite reduction bounds
    the coefficients of a reduced form by O(|D|^{1/4}), so a naive enumeration
    ranges over (a,b,c) in a box of side |D|^{1/4} and solves the quartic
    discriminant relation for d, giving |D|^{3/4+o(1)} candidate triples. THAT
    IS WORSE THAN BOTH INCUMBENT ROUTES, which is the prediction. Belabas's
    algorithm lists all cubic fields of discriminant up to X in time
    X^{1+o(1)} -- AMORTIZED over about X fields, so it does not transfer to a
    single target discriminant, and the distinction between the amortized and
    the pointwise cost is precisely what has never been checked here.
    WHAT WOULD MAKE THE ROUTE INTERESTING. The amortized bound is cheap per
    field. A measurement programme that needs MANY discriminants -- which is
    exactly what this RQ's cost-curve sweep is -- can use the amortized form.
    So the cubic-form route may be worthless as an attack on one deployed
    discriminant and simultaneously the cheapest available way to populate a
    3-rank statistic across a sweep. Both readings are recorded.

