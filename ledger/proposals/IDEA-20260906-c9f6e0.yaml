    ],
    "claim": "For a block of k simultaneous independent affine normalizations inside a fixed CSIDH action circuit, a reversible zero-masked product-tree inverter reduces Toffoli count relative to k separate inversions when its reversible multiplication, flag and uncomputation bill is below (k-1) inversion costs.",
    "mechanism": "Replace each denominator z_i by z_i' = z_i if nonzero and 1 otherwise, compute their product, invert it once, and recover individual inverses through the product tree. Keep coherent zero flags to select the specified infinity/failure representation, then reverse the tree after copying the legal outputs. All paths have fixed shape independent of secret amplitudes. Inversions that depend on previous normalized outputs cannot be grouped. The representation loses no information until uncomputation; it is a circuit arithmetic improvement, not a lossy ECDLP projection. Classical batch inversion is baseline prior art, with the coherent exceptional-case semantics and scheduling as the proposed addition.",
