  assumptions:
    - >-
      The factor base has B distinct x-coordinates and the group has prime order
      N, or the accounting is restated with the order of the subgroup the sums
      actually live in -- the denominator correction IDEA-20260829-c6e7a4 derives
      for a sibling lane applies here verbatim and is adopted rather than
      re-derived.
    - >-
      The table is keyed by x-coordinate with O(1) expected lookup. A sorted array
      with binary search adds a log factor to the online term and moves no
      exponent; that variant is reported alongside.
    - >-
      k <= t-1, because the target-independent part of a t-chain contains at most
      t-1 summands. A table over all t summands would already contain the answer
      for every target and is not target-independent.
    - >-
      The linear-algebra charge is c_LA B^2. The conclusion is a power of N and
      survives any linear-algebra exponent in [1, 2], because at every k >= 2 the
      linear-algebra term is already subdominant at the optimum.
    - >-
      Relations needed is taken as B rather than (B/m) ln B. The coupon-collector
      log factor multiplies the first term, and omitting it is UNFAVOURABLE to
      this record's negative reading, which is the safe direction.

  proof_search_map:
    bottleneck: >-
      The size of the reusable object. Every claim in this record turns on the
      single question "how many words must a target-independent precomputation
      occupy", and the exact step whose removal would change the theorem is
      "materialise the solution set of S_struct".
    baseline_embedding:
      parameter_slice: >-
        k = 1, where the "table" is the factor base itself and the online charge
        is the full enumeration B^{t-1}. The formula must then reproduce the
        algebra-free brute-force decomposition cost, total = t! N, i.e. worse
        than rho by N^{1/2} -- the same figure IDEA-20260829-b5a2c8 reaches for
        m = 2 as actually built. Agreement at k = 1 is the embedding check.
      reproduction_check: >-
        Symbolic identity, plus a numerical check to 1e-12 that
        min over B of (t! N B^{1-k} + B^k + c_LA B^2) has exponent k/(2k-1) for
        k = 2..12, and that at k = 1 the optimum is degenerate with total
        Theta(N). Any deviation is an algebra error and halts the record.
    observation_collision:
      observable: >-
        The pair (time exponent, memory exponent) of a reusable-precomputation
        index-calculus scheme.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, which is the record's sharpest content. The
        Macaulay row space of IDEA-20260829-fa8235, an FGLM multiplication-matrix
        engine for the fixed ideal, and a plain hash table of W all produce the
        SAME observable at (N^{2/3}, N^{2/3}) when k = 2 -- because all three are
        explicit representations of one finite scheme of degree Theta(B^{t-1}).
        The collision is not a defect of the observable; it IS the theorem, and
        it is what licenses the screening rule in part (E). The separation, if
        any exists, must therefore come from an object that is NOT an explicit
        representation of that scheme, which is the forward guidance.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "what is a reusable algebraic dependency worth" by "how large
          is the finite scheme it represents", turning an open cost question into
          a degree count. Obligations kept separate -- encoding (S_struct plus
          membership has finite solution set), completeness (W is the whole
          projection), soundness (membership in W is exactly the structural
          condition, by Theorem C of KN-FIND-a8990a), size (degree
          Theta(B^{t-1})), transfer (fails for implicit representations, stated),
          cost loss (none).
        predicted_gain: >-
          A closed-form frontier for an entire family, at zero compute, replacing
          a Phase-C measurement programme. NO ATTACK EXPONENT IS MOVED.
      - transform: boundary_lift
        proposed_object: >-
          Let the table build be FREE and the lookup be O(1) -- better than any
          implementation -- and re-run the optimisation. The result
          N^{k/(2k-1)} still exceeds N^{1/2} for every finite k, so the negative
          survives every future improvement of the precomputation.
        predicted_gain: >-
          A conclusion robust to engineering, which a measurement of today's code
          could never deliver.
      - transform: observable_fiber
        proposed_object: >-
          Hold the frontier point fixed and vary the representation of the
          reusable object -- table, Groebner basis, multiplication matrix, row
          space -- looking for an invariant that separates them. Predicted: none
          exists, because all are explicit representations of one scheme.
        predicted_gain: >-
          A precise statement of what the reuse lane cannot buy, which is the
          content of the screening rule.
    quantifier_order: >-
      CLAIMED. FORALL t >= 3, FORALL k with 1 <= k <= t-1, FORALL factor bases of
      size B, FORALL factor-base geometries, the k-fold-table reusable
      decomposition scheme has total cost at least
      min over B of (t! N B^{1-k} + B^k + c_LA B^2) = Theta(N^{k/(2k-1)}) with
      memory Theta(N^{k/(2k-1)}). The FORALL over geometry is delivered by
      KN-FIND-007's conservation identity, not assumed -- that is the one place
      where a weaker "EXISTS a geometry" reading would gut the claim.
      NOT CLAIMED, and the distinction is load-bearing. FORALL reusable objects.
      This bounds EXPLICIT representations of the finite scheme cut out by
      S_struct. It says nothing about implicit predicates, about compressed
      filters, or about any algorithm outside the point-decomposition family.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Explicit table-based reuse of the target-independent part of a chained
        point-decomposition system attains exactly (N^{k/(2k-1)},
        N^{k/(2k-1)}) and is Pareto-dominated by Pollard rho on both axes at
        every k." It can NEVER certify anything about implicit representations,
        about the algebraic solve cost D, about ECDLP hardness, or about
        algorithms outside this family. Any summary dropping the word EXPLICIT
        is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE EXTENSION-FIELD INSTANTIATION, and it is blocking. Re-run the
        identical accounting at N = q^n, B = q, t = n. It must NOT return "worse
        than rho at every n" for the ALGEBRAIC variant, because Gaudry-style and
        Diem-style index calculus demonstrably work there. Part (D) reports that
        it does not -- the algebraic variant gives O-tilde(q^2), beating rho for
        n >= 5 -- but that arithmetic is a required Stage 0 check and not an
        assertion, and if it fails the whole accounting is wrong and nothing here
        may be reported. Second nearby object: the SIDON-BASE variant, where the
        table has no repeated sums; KN-FIND-007 measures such a base at coverage
        ratio 1.1071 and the frontier must be unchanged, because the frontier
        depends on cardinality and not on multiplicity.
    proof_obligations:
      - claim: >-
          S_struct plus membership has a finite solution set of degree
          Theta(B^{t-1}).
        responsibility: size
      - claim: >-
          Any explicit representation of a degree-d zero-dimensional scheme costs
          Omega(d) words.
        responsibility: strictness
      - claim: >-
          The three-term total and its optimum B = N^{1/(2k-1)},
          TIME = MEMORY = Theta(N^{k/(2k-1)}).
        responsibility: correctness
      - claim: >-
          N^{k/(2k-1)} > N^{1/2} for every finite k, strictly.
        responsibility: correctness
      - claim: >-
          The k = 1 slice reproduces the brute-force total Theta(N).
        responsibility: baseline
      - claim: >-
          The extension-field instantiation does NOT return a no-go for the
          algebraic variant.
        responsibility: scope
      - claim: >-
          The measured toy-scale total operation counts track N^{k/(2k-1)} across
          a ladder rather than a different shape.
        responsibility: feasibility
      - claim: >-
          Every recovered logarithm carries an independently re-verified
          certificate.
        responsibility: interface

