idea:
  id: IDEA-20260829-66a876
  question_id: RQ-SBRG-f31cb2
  added: '2026-08-29'
  title: >-
    THE NULL OBJECT FOR "REUSABLE ALGEBRAIC DEPENDENCY" IS A HASH TABLE, AND IT
    HAS A CLOSED-FORM FULLY CHARGED FRONTIER: the target-independent part of a
    chained decomposition system cuts out a ZERO-DIMENSIONAL variety whose degree
    is Theta(B^{t-1}), so any explicit reusable representation of it costs that
    many words -- the k-fold sumset table realises exactly that bound and lands
    the whole family at (time N^{k/(2k-1)}, memory N^{k/(2k-1)}), Pareto-dominated
    by Pollard rho on BOTH axes for every k and sitting at S*T^2 = N^{3k/(2k-1)}
    which is above the generic preprocessing frontier S*T^2 = Omega-tilde(N) --
    and the same accounting shows the table is UNAFFORDABLE in the extension-field
    regime where index calculus actually works, which localises the only live
    target for this question to a compressed representation

  class: control

  claim: >-
    (A) THE TARGET-INDEPENDENT PART IS A FINITE SCHEME AND ITS DEGREE IS THE
    PRICE OF REUSE. In the chained representation of EXP-SBRG-60c55e the
    structural system S_struct constrains x_1,...,x_{t-1} to lie in the factor
    base and the auxiliary node coordinates to be the chain partial sums.
    Its solution set is therefore FINITE, of cardinality Theta(B^{t-1}) up to the
    sign and x-collision factors -- one point for every admissible (t-1)-tuple.
    Consequently every EXPLICIT reusable representation of that solution set --
    a lookup table, a Groebner basis of its vanishing ideal, an FGLM
    multiplication matrix, a quotient-ring normal-form engine -- has size bounded
    BELOW by its degree Theta(B^{t-1}) words. THE MACAULAY ROW SPACE OF
    IDEA-20260829-fa8235 AND THE SUMSET TABLE OF THIS RECORD ARE THEREFORE THE
    SAME OBJECT AT DIFFERENT RESOLUTIONS, and the table is the cheapest way to
    hold it. That single sentence is the reason this record exists.
    (B) THE FRONTIER, DERIVED. Precompute the k-fold sumset table
    U_k = { x(P_{i1} + ... + P_{ik}) } for k <= t-1, keyed by x-coordinate.
    Cost to build, Theta(B^k) group operations and Theta(B^k) memory, charged
    ONCE. Online, per target, enumerate the remaining t-k summands and look up,
    at Theta(B^{t-k}) per trial. With the exact conservation mean of KN-FIND-007
    the trial count to obtain B relations is t! N B^{1-t}, so
      total = t! N B^{1-k}  +  B^k  +  c_LA B^2.
    In the free-B regime, balancing the first two gives B = N^{1/(2k-1)} and
      TIME = Theta(N^{k/(2k-1)}),  MEMORY = Theta(N^{k/(2k-1)}),
    with the linear-algebra term B^2 = N^{2/(2k-1)} subdominant for every
    k >= 2. Instances: k=2 gives N^{2/3}; k=3 gives N^{3/5}; k=4 gives N^{4/7};
    the limit as k grows is N^{1/2} FROM ABOVE and is never attained.
    (C) THE DOMINATION, STATED AS A TWO-AXIS PARETO FACT. Against Pollard rho at
    0.886*sqrt(N) time and O(1) memory, the family is worse on time by
    N^{k/(2k-1) - 1/2} = N^{1/(2(2k-1))} for every finite k -- N^{1/6} at k=2,
    N^{1/10} at k=3 -- AND worse on memory by N^{k/(2k-1)} against O(1). It is
    dominated on both axes simultaneously, so no time-memory interpolation
    rescues it. Read as a preprocessing algorithm with advice size S and online
    time T for one discrete logarithm, it sits at S*T^2 = N^{3k/(2k-1)}, which
    exceeds the generic frontier S*T^2 = Omega-tilde(N) recorded in KN-TECH-005
    by a factor of at least N^{1/2}. A GENERIC preprocessing algorithm -- one
    that knows nothing about elliptic curves -- therefore beats the entire
    table-based reusable-dependency family, on both axes, at every k.
    (D) THE ESCAPE HATCH, AND IT IS THE POINT OF THE RECORD. Instantiate the SAME
    accounting in the extension-field regime that RQ-SBRG-f31cb2 actually
    targets: F_{q^n} with the subfield-style factor base forcing B = q, t = n,
    N = q^n. Then total = n! q^{n+1-k} + q^k + c_LA q^2, and the best admissible
    k = n-1 gives Theta(q^{n-1}) -- dominated by the TABLE ITSELF and worse than
    rho at q^{n/2} for every n >= 3. But the ALGEBRAIC route, which spends
    D = poly(n, log q) per trial instead of enumerating, gives
    n! q D + c_LA q^2 = O-tilde(q^2), which BEATS rho for every n >= 5. So the
    accounting does NOT return a no-go where index calculus is known to work --
    it passes the nearby-object gate that IDEA-20260829-b5a2c8 sets for itself --
    and it localises the value of the whole lane with precision: THE ONLY THING
    THAT MATTERS IN THE EXTENSION-FIELD REGIME IS THAT D IS POLYNOMIAL RATHER
    THAN ENUMERATIVE, AND NO TABLE CAN DELIVER THAT BECAUSE THE TABLE IS TOO BIG.
    (E) WHAT THIS DECIDES FOR RQ-SBRG-f31cb2. A reusable dependency is worth
    filing only if it beats the table AT MATCHED MEMORY. That is a screening
    rule with a number attached, and it is the analogue for this question of
    KN-FIND-007's "higher mean yield at matched size is refuted on sight".
    Combined with IDEA-20260829-fa8235's ceiling of t-1 on row-space reuse, the
    two records leave exactly one live class: a reusable object whose SIZE is
    subexponential in the degree of the finite scheme it represents, i.e. a
    compressed or implicit representation. IDEA-20260829-57b1eb is the cheapest
    probe of that class. This is forward guidance under the inventor protocol's
    closure standard, not a closure of the question.

  mechanism: >-
    THE TRACKED OBJECT AND THE LOSSY-PROJECTION TEST, APPLIED BEFORE ANY
    EXPERIMENT. The tracked object is W, the PROJECTION of the target-independent
    solution set onto the auxiliary node coordinate -- the set of x-coordinates
    reachable as chain partial sums of factor-base points, with all the tuples
    that produce each value forgotten. It is genuinely lossy: from W one cannot
    recover which (t-1)-tuple produced a given element, nor the factor base, nor
    the curve, nor the field basis; a set of size about B^{t-1}/(t-1)! is
    retained from a tuple space of size B^{t-1}, and the fibres are discarded
    entirely. It is lossy COMPATIBLY with the operations of the target, which is
    the load-bearing half: the final chain equation queries the structural part
    ONLY through membership -- the decomposition exists exactly when
    x(R - P_t - ... ) lies in W -- so the discarded fibre data is never consulted
    by the operation the algorithm performs, and the retained set propagates
    deterministically under it. The projection that FAILS the test, and is
    deliberately not used, is the tuple list itself, which loses nothing and is a
    storage layout rather than a new object.
    WHY THE LOWER BOUND ON REPRESENTATION SIZE IS FORCED. S_struct together with
    the factor-base membership conditions has a FINITE solution set, because each
    of the t-1 free coordinates ranges over a finite factor base and the
    auxiliaries are determined by them. A zero-dimensional ideal of degree d
    requires d standard monomials, so its quotient ring, its FGLM multiplication
    matrices and its reduced Groebner basis all have size at least d in the
    natural measure; and an information-theoretic argument gives the same for a
    membership structure -- answering exact membership for a set of size s inside
    a universe of size u needs Omega(s log(u/s)) bits. Both routes land on
    Theta(B^{t-1}) up to logarithms. So "precompute the reusable structure" has a
    price that no amount of algebra reduces, unless the representation is not
    explicit.
    WHY THE ACCOUNTING IS AN IDENTITY AND NOT AN ESTIMATE. The trial count uses
    KN-FIND-007's exact conservation mean, which holds for EVERY factor base of a
    given size with measured deviation exactly 0 over 144 cells, so the
    t! N B^{1-t} factor carries no geometry assumption at all. The online charge
    B^{t-k} is an enumeration count, exact by construction. The table build cost
    B^k is exact. The only estimated quantity is c_LA, and the conclusion is a
    power of N and survives any c_LA.
    WHERE THE ARGUMENT STOPS, STATED HERE AND NOT HIDDEN. It stops at IMPLICIT
    representations, where the reusable object is not a list of the points of W
    but a predicate that decides membership without storing them -- the class
    IDEA-20260829-57b1eb probes. It also stops if the factor base is chosen so
    that W has a group or subspace structure making membership testable in
    polylog space, which is exactly the structured-base direction KN-FIND-007
    warns collapses coverage (its H017 small-multiples base reaches coverage
    ratio 0.0021), so that escape is bought at a cost the same finding prices.

  novelty_status: unverified

