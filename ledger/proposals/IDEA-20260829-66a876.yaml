  confounders:
    - >-
      OPERATION-COUNTING CONVENTION. Group operations, field multiplications and
      hash probes are not interchangeable. The rho arm and the table arm must be
      counted under ONE convention frozen before any cell runs; a mismatch
      manufactures a factor of order 10 in either direction.
    - >-
      x-COORDINATE AND SIGN COLLISIONS. A point and its negative share an
      x-coordinate, so the table's cardinality carries factors of 2 that are
      constants at fixed t but compound with growing t. KN-FIND-c41ea9's scope
      note that a per-fibre factor of 2 compounding with m is NOT a constant
      applies and is respected: the frontier is stated at fixed t.
    - >-
      SMALL-N SATURATION. At N = 2^12 with B near its optimum the conservation
      mean can exceed 1, degenerating the trial count to 1 and flattening the
      measured curve for reasons unrelated to the exponent. Cells are screened
      before the run.
    - >-
      LADDER RANGE. Four points over 6 bits of N cannot separate asymptotic forms
      in general. This is a stated limit of the measurement arm, which is why the
      load-bearing content is the zero-compute derivation and the measurement is
      an achievability and constant check.
    - >-
      MODEL-RELATIVITY. "Dominated within the stated cost model" is not
      domination in fact. The model omits the coupon-collector log factor and
      pins c_LA without deriving it; both are disclosed and both move the
      conclusion in the safe direction for a negative reading, so no POSITIVE
      reading may be taken from this record.
    - >-
      THE GENERIC-FRONTIER COMPARISON IS CONDITIONAL. Part (C)'s domination by a
      generic preprocessing algorithm relies on the ACHIEVABILITY of
      S*T^2 = O-tilde(N), recalled from memory and not verified this session. If
      only the lower bound is established, the honest statement weakens to "the
      table family does not saturate the generic barrier".

