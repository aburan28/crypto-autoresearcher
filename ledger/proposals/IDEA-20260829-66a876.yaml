      direction: higher
      minimum_effect: >-
        PREDICTED N^{3k/(2k-1)}, i.e. at least N^{3/2} for every k, which exceeds
        the frontier N by at least N^{1/2}. This prediction can fail only by an
        arithmetic error, and it is quoted CONDITIONALLY on the achievability of
        the generic frontier, which this session did not verify.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Instantiate the extension-field
      nearby-object control FIRST, for both the enumerative and the algebraic
      variants. If the accounting returns a no-go for the algebraic variant, stop
      and report the accounting as broken. Then run the Sidon-base control: the
      frontier must be unchanged.
