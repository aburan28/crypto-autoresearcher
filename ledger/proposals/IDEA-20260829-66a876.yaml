  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V of B points and k <= t-1, the k-fold signed sumset
        has cardinality |U_k| = binom(B+k-1, k) * 2^k * (1 + o(1)) / rho_coll,
        where rho_coll is a collision correction of size 1 + O(B^{2k}/N); that
        is, distinct k-multisets give distinct x-coordinates except for the
        forced sign identification, so the table size is Theta(B^k) with an
        explicit constant rather than an unknown one.
      rigorous_support: >-
        The RIGOROUS ingredients are two and both are already committed here.
        KN-FIND-007's conservation double count fixes the TOTAL multiplicity
        exactly -- the sum over targets of the k-multiset count is
        binom(B+k-1,k) with deviation measured at exactly 0 over 144 cells -- and
        Theorem C of KN-FIND-a8990a forces the fibre over a good factor-base
        tuple to be exactly the signed-sum set, verified on 16107 of 16107 good
        samples, so the factor 2^k is exact and not estimated. The CLASSICAL
        DISTRIBUTION IMITATED is the birthday/occupancy model: the
        binom(B+k-1,k) sums are assumed to behave like independent uniform draws
        from the x-coordinate set with respect to collisions, which is the same
        imitation that makes the Gaudry-Diem 1/n! decomposition probability equal
        the conservation mean. THE GAP is that additive structure in the base
        creates repeated sums, which KN-FIND-007 both warns about and measures --
        its H017 small-multiples base collapses coverage to 0.0021 -- so H1 is
        FALSE by construction for structured bases and the record's frontier is
        quoted for random bases with the structured case reported separately.
      validation_plan: >-
        SAMPLE. Exhaustive enumeration of U_k over the COMPLETE group at
        N in {2^12, 2^14} (every element, not a sample) and 2000 random targets
        at N in {2^16, 2^18}, for 12 generated prime-order curves, B swept over a
        16x range, 5 base seeds, k in {2, 3}. COMPARISON DISTRIBUTION. The exact
        occupancy prediction for binom(B+k-1,k)*2^k balls in |X| bins, with |X|
        the true number of rational x-coordinates computed from the curve order
        rather than approximated by N/2 -- the trace term is the whole content of
        the check at these sizes. TAIL CHECKS. (a) The maximum observed
        multiplicity against the occupancy upper tail at the 1/1000 level;
        (b) the observed count of unreached x-coordinates against exp(-mean),
        which is KN-FIND-007's coverage bound instantiated; (c) the
        variance-to-mean ratio, whose departure from 1 measures directly the
        algebraic dependence the assumption ignores, reported with every table
        size rather than smoothed. STRUCTURED-BASE ARM. The identical statistics
        for a small-multiples base and for a Bose-Chowla Sidon base, so the
        H017 collapse and the 1.1071 ceiling are both reproduced as instrument
        power checks. SAMPLED PARAMETERS RECORDED. N, curve coefficients, curve
        order, trace, |X|, B, k, seed, base geometry. TRANSFER ASSUMPTIONS. NONE.
        Nothing above N = 2^18 is claimed and the exponent statements are
        derivations, not measurements.
    - id: H2
      statement: >-
        The per-trial online charge is Theta(B^{t-k}) group operations with an
        O(1) expected hash lookup, and successive trials are independent for the
        purpose of the trial-count accounting, so the expected number of trials
        to collect B relations is t! N B^{1-t} up to a constant.
      rigorous_support: >-
        The RIGOROUS ingredient is that rerandomisation R_j = [a_j]P + [b_j]Q is
        an exactly uniform map onto a prime-order group, so target uniformity is
        exact rather than heuristic, and the conservation mean of KN-FIND-007
        then fixes the expected yield exactly. What is HEURISTIC is only
        independence ACROSS trials at a fixed factor base -- successive targets
        share one table, so the events are correlated. The CLASSICAL STATEMENT
        IMITATED is the geometric waiting time for a Bernoulli process with the
        conservation mean as its parameter.
      validation_plan: >-
        SAMPLE. The full trial sequence of every Stage 3 cell. COMPARISON. The
        empirical distribution of trials-to-first-relation against
        Geometric(conservation mean) by Kolmogorov-Smirnov at the 1 percent
        level, plus the empirical variance of the total trial count against the
        independent prediction. TAIL CHECK. The 99th percentile trial count
        against the geometric tail, and the worst single seed reported
        individually rather than averaged. Over-dispersion beyond a factor 2 in
        variance means the shared table induces correlation strong enough to move
        the constant and must be reported with every operation count. TRANSFER.
        None.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT IS CLAIMED; the deliverable is a frontier in the opposite
      direction. Stated exactly: explicit k-fold-table reuse at arity t gives
      TIME = Theta(N^{k/(2k-1)}) in the free-B regime -- N^{2/3} at k=2, N^{3/5}
      at k=3, N^{4/7} at k=4, approaching N^{1/2} from above and never reaching
      it. In the extension-field regime with B = q forced, the same family gives
      Theta(q^{n-1}) at the best admissible k, while the ALGEBRAIC variant that
      the table cannot replace gives O-tilde(q^2).
    memory_exponent: >-
      Theta(N^{k/(2k-1)}), equal to the time exponent at the optimum, because the
      table dominates and its size is the balancing term. It cannot be traded
      below the degree of the finite scheme it represents without abandoning
      explicit representation entirely, which is exactly the surviving class.
      This is the axis on which the family is dominated even where the time axis
      is arguable.
    best_known: >-
      Pollard rho at 0.886*sqrt(N) group operations with O(1) memory
      (KN-TECH-005 records the matching generic lower bound); BSGS at N^{1/2}
      time and N^{1/2} memory; van Oorschot-Wiener golden collision at
      sqrt(A^3/w) time with memory w; generic DLP with preprocessing at
      S*T^2 = O-tilde(N), for instance S = T = N^{1/3}, recalled and NOT verified
      this session. For extension fields, Gaudry-style and Diem-style index
      calculus, also recalled and not verified. Inside this program, the standing
      positions are KN-FIND-007's conservation identity, KN-FIND-8f2c90's
      1.5-1.7x BKK constant, and IDEA-20260829-b5a2c8's two-term optimum. This
      record improves none of them.
    hidden_overhead: >-
      DISCLOSED IN FULL. (i) The coupon-collector factor ln B / t on relations
      needed is omitted; its omission favours the table arm, which is the safe
      direction for a negative reading and the UNSAFE direction for any positive
      reading, so no positive reading may be taken from this record. (ii) c_LA is
      pinned but not derived; the conclusion is a power of N and survives it.
      (iii) The 2^k signed factor and the sign/x-collision corrections are
      constants at fixed t and compound with growing t, which is why every
      statement is quoted at fixed t. (iv) "Within the three-term model" is the
      whole of the remaining overhead and the model is not tight. (v) The
      generic-frontier comparison rests on a recalled achievability result.
    tradeoff_note: >-
      The family IS a time-memory tradeoff curve and that is the point: k is the
      tradeoff parameter, and the curve (N^{k/(2k-1)}, N^{k/(2k-1)}) lies
      entirely on the diagonal, strictly above and to the right of rho's
      (N^{1/2}, O(1)) and strictly above BSGS's (N^{1/2}, N^{1/2}) in time. Van
      Oorschot-Wiener interpolation applies to the collision-search family and
      not to the linear-algebra stage, so it does not move this curve.
      Parallelisation: table construction and online enumeration are both
      embarrassingly parallel with linear speedup on 14 cores; the linear-algebra
      stage is Krylov-bound and its serial fraction caps the total speedup. None
      of this moves the exponent.

  dominated_by: >-
    CHECKED ROW BY ROW, ACROSS TIME, MEMORY AND DATA/QUERIES. Pollard rho
    (N^{1/2}, O(1)) DOMINATES this family on both axes at every k -- worse in
    time by N^{1/(2(2k-1))} and worse in memory by N^{k/(2k-1)} against O(1).
    Multi-target rho (sqrt(KN) total, O(1)) likewise. BSGS (N^{1/2}, N^{1/2})
    dominates on time at every k and ties or wins on memory for k >= 2. Van
    Oorschot-Wiener golden collision (sqrt(A^3/w), w) dominates at matched
    memory. Generic DLP with preprocessing at S*T^2 = O-tilde(N) dominates on
    both axes CONDITIONAL on the recalled achievability. The two-term
    index-calculus optimum of IDEA-20260829-b5a2c8 is the same accounting and
    agrees where the two overlap, so it neither dominates nor is dominated -- it
    is the same row. IDEA-20260829-fa8235's row-space reuse is dominated BY this
    record whenever its carrier exceeds the table, which is the normal case.
    Against the ALGEBRAIC extension-field route this family is dominated by
    q^{n-1} against O-tilde(q^2), which is the whole content of part (D). Not
    null on any axis.
