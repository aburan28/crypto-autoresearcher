    - >-
      Measured operation counts on the ladder deviate from N^{2/3} by more than a
      factor 4 in either direction across N = 2^12..2^18. The k = 2 accounting is
      falsified at the tested scale and the deviation's direction says which term
      is mis-charged.
    - >-
      Measured peak memory grows materially slower than B^2. x-collisions are
      collapsing the table and the cardinality Theta(B^{t-1}) is wrong, which
      would WEAKEN the lower bound on representation size and is the most
