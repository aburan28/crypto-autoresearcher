    - metric: >-
        the extension-field gate -- the same accounting at N = q^n, B = q, t = n,
        for the enumerative and the algebraic variants separately
      direction: different
      minimum_effect: >-
        FORCED. The enumerative variant must give Theta(q^{n-1}) at the best
