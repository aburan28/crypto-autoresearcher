  design_choice_and_power_equivalence: >-
    CHOSEN DESIGN - ONE 2^32 t=1 arm (fresh seed 531003) + one matched-exposure 2^32 dead anchor,
    i.e. exactly the named successor. QUANTITATIVE COMPARISON against the power-equivalent
    alternative (4 x 2^30 arms at 4 fresh seeds, joint test of the summed S): CONDITIONAL ON THE
    TOTAL HIT COUNT N AND COMPOSITION, the two designs have IDENTICAL rejection regions and power
    functions -- S is a sum of independent per-hit contributions, so arm-grouping does not change
    the null or effect distribution of the sum, and the total miss-trial mass for rate estimation is
    also identical (2^32). COST AXES: total trials equal (2^32); sequential wall-clock equal under
    the binding baseline (4 x 27 min ~= 1 x 108 min); memory equal (O(1) per trial). Neither design
    dominates on cost. EVIDENTIAL DIFFERENCES: (a) realized N -- the single arm draws N from one
    seed's hit process (observed 2^30 seed variance 14 vs 19 hits, ~ +/-16% about 16.5), the
    4-arm total averages 4 seeds (tighter about E[N] ~= 66, but E[N] itself unestimated); the power
    tables below bracket N = 56-96 so the single arm's N-uncertainty is priced, not hidden; (b)
    seed-variance measurability -- only the 4-arm design measures it directly; the single arm
    recovers part of it at zero cost via the preregistered joint-LR convolution with the committed
    G5 reading (seed 531002); (c) analysis/gate surface -- the 4-arm design needs a cross-arm joint
    null (four run-internal rate sets, cross-receipt DP) that has never been validated, while the
    single arm is a strict scale-up of the G5 machinery whose analysis path the validator confirmed
    digit-for-digit. DECISION: single 2^32 arm chosen for instrument/analysis continuity and
    named-successor fidelity; the pooled multi-seed design is NOT dominated -- it survives as the
    named PX-WEAK successor (the escalation path if the single arm lands in the weak band), recorded
    honestly rather than spent now.

