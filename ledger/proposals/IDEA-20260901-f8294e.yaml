    design_time_power_composition_sensitivity: >-
      n = 76, G5-RATIO composition 48 inactive / 28 active (exact DP): null mean 4.0 exactly,
      cutoff c = 9 (size 0.021131; P(S>=8) = 0.050784 > 0.05), P(S>=10) = 0.008003 -- this is the
