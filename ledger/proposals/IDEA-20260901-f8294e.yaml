  powered_statistic_and_power_tables:
    statistic_inherited: >-
      X(h) = Ze(h) - F(h), S = sum over hits, exact DP against the per-mask-subclass run-internal
      conditional null (classes D0/D1/O), one-sided toward extra zeros, subclass readings co-primary
      per seed never pooled -- ALL inherited verbatim from IDEA-20260901-026d6a repaired_statistic /
      null_model. No statistic change in this record; only exposure, seed, cutoff bookkeeping, and
      the decision cascade are new.
    effect_model_preregistered: >-
      E-rho: each hit independently gains EXACTLY ONE extra zero with probability rho (X_eff =
      X_null + Bernoulli(rho)) -- the model matching the committed residual's shape (all nonzero X
      at 531001 were X = 1; red team RT-A). Power tables are stated under E-rho; the per-byte-rate
      alternative agrees to first order in the per-hit mean shift (disclosed confounder). Executor
      reports power under E-rho at the realized N and composition.
