  minimal_test: >-
    CHEAPEST DISCRIMINATING SUBSET: the anchor + the single alive arm + gates -- nothing cheaper
    adjudicates the weak region. Zero-run options are already exhausted by EV-AES-241790: the
    two-seed joint at 2^30 is provably nearly uninformative for rho <= 0.15 (LR 0.57-1.45), so the
    exposure itself must increase; no analysis of existing receipts can substitute. Stage 1 of the
    ramp is NOT part of this record's minimal test and stays gated.

  stages_and_budget:
    stage_p:
      batch_shape: >-
        one producer, 8 binary invocations (at the 8-run precedent cap), ~4.5 h wall clock under
        the BINDING baseline (each 2^32 analysis arm charged 4x the ~27 min 2^30 4-thread handoff
        baseline = ~108 min; the Gate-0 rebuild charged at the ~54 min 2-thread baseline); measured
        campaign hardware ~14 min total (155 s rebuild + ~376 s anchor + ~314 s alive + gates) --
        flagged OPTIMISTIC-RELATIVE; the binding baseline is the budget contract
      runs:
        - {id: P0, content: 'write-once preregistration file (statistic inheritance, class partition, null construction, cutoff rule, branch cascade WITH precedence clause, anchor order, stop rule, power tables, effect model, seat tuples, allowed-diff list incl. hit_log_cap), mtime before first arm', cost: 'seconds, 0 runs'}
        - {id: P1a, content: 'KAT pins on the cap-256 build (pin)', cost: 'seconds'}
        - {id: P1b, content: 'KAT pins identity (pinidentity)', cost: 'seconds'}
        - {id: P2, content: 'GATE-0 EXTENDED REBUILD - (aes, r5, amask=1, smask=1, 2^30, seed 531001, armid 1, threads 2): field-by-field identity vs L1-AES-R5-P30 + hit_e_detail identity vs G3 receipt; proves non-perturbation of the cap delta', cost: '~54 min baseline'}
        - {id: P3, content: 'FRESH DEAD ANCHOR AT MATCHED EXPOSURE - (aes, r6, amask=1, smask=1, 2^32, seed 531003, armid 1, threads 4): ANALYZED FIRST; gate p_extra > 0.05 AND hits <= 32; tripwire >= 33 (F6)', cost: '~108 min baseline (4x 2^30)'}
        - {id: P4, content: 'POWERED ALIVE ARM J5-2-P32 - (aes, r5, amask=1, smask=1, 2^32, seed 531003, armid 1, threads 4): X statistic, run-internal null, realized-composition cutoff, overdispersion audit, subclass co-primary, joint-LR with G5; admitted ONLY if P3 anchor passed', cost: '~108 min baseline (4x 2^30)'}
        - {id: P5a, content: 'determinism double A - cap-256 build, log2N=20, threads=4, seed 531001, identical command', cost: 'seconds-minutes'}
        - {id: P5b, content: 'determinism double B - identical command again; byte-identical receipt required incl. all counters and zero_mask_e', cost: 'seconds-minutes'}
        - {id: P6, content: 'post-arm digest re-verification of the frozen table-freeze file + source-diff audit record (diff must consist ONLY of the HIT_LOG_CAP constant 64 -> 256)', cost: 'seconds'}
      decides: >-
        Whether weak excess-zero effects rho >= rho_80(N_realized) survive at t=1 at 2^32
        (PX-ALIVE / PX-WEAK / PX-DEAD); instrument validity of the cap-256 build; the seed-531003
        dead-arm anchor at matched exposure. Does NOT decide the ramp (Stage 1 stays gated on this
        outcome AND a Coordinator decision), does NOT spend Stage 1a/1b, does NOT touch effects
        below rho_50.
    budget_honesty: >-
      BINDING BASELINE, stated per DEC-20260901-600997's direction and the 026d6a handoff
      convention: one 2^32 analysis-bearing arm is charged as 4x the measured 2^30 4-thread
      baseline (~27 min x 4 ~= 108 min), NOT at the optimistic campaign-hardware rate (measured
      2^30 arms were 94-155 s; the handoff baseline is the budget contract exactly because campaign
      hardware is not guaranteed). Baseline total: ~54 min (P2) + ~108 min (P3) + ~108 min (P4) +
      gates ~= 4.5-4.6 h; DECLARED WALL-CLOCK CAP 18000 s (5 h) stamped in budget_stamps.jsonl;
      maximum_runs 8 (planned invocations P1a, P1b, P2, P3, P4, P5a, P5b, P6 = 8 at cap; P0 is
      0 runs; analysis scripts are not runs); memory_gb 4 (observed RSS ~1.6 MB + ~12 KB cap
      delta). Measured-hardware estimate ~14 min disclosed OPTIMISTIC-RELATIVE. Every stage
      boundary is a stopping point with a committed reading (halt after P2 = instrument-validation
      result; after P3 = anchor result; rule 5: budget exhaustion reported as such, never as a
      result about e). Stage 1a/1b of 363851 (~4-4.5 h, 2 producer batches) is EXPLICITLY NOT
      spent by this record.

  preregistered_decision_rule: >-
    Committed in P0 before any fresh arm. ORDERING (BINDING): the P3 anchor is run and ANALYZED
    BEFORE P4; the alive reading is admitted ONLY if the anchor passes; anchor failure halts the
    batch with no alive reading admitted and no statement about e (rule 5). BRANCH CASCADE --
    exhaustive, evaluated in this FIXED ORDER, which IS the branch-precedence clause: (1)
    PX-GATE-FAIL: any integrity gate fails (P1a/P1b KAT, P2 Gate-0 identity, P5a/P5b determinism,
    P6 digest/diff, or hit_overflow > 0 on an analysis-bearing receipt) -> invalid_measurement;
    HALT; repair (rule 5); never evidence about e. (2) PX-ANCHOR-FAIL: P3 reads p_extra <= 0.05
    under its run-internal null (the repaired statistic FIRES ON THE DEAD ARM at 2^32) -> statistic
    indicted at this exposure (proves-too-much recurrence; FX4-P); HALT and repair; NO alive
    reading admitted; never evidence about e (rule 5). (3) PX-F6: anchor hits >= 33 (scaled
    tripwire, 4x the 2^30 band of 8) -> F6 escalation to claim-changing review per the frozen
    taxonomy; HALT in-batch flow; alive reading not admitted in this batch. (4) PX-ALIVE: anchor
    passes AND at P4 p_extra <= 0.05 AND S_obs above its run-internal null mean -> the excess-zero
    signature RESURRECTS at t=1 at 2^32, fresh seed 531003; EV-AES-241790's non-replication is
    converted into a measured seed-variance event; escalation to a claim-changing review round
    (Coordinator writes review_plan before any reviewer runs); Stage 1 spend stays GATED on that
    review and a new decision (this record recommends nothing automatically). (5) PX-DEAD: anchor
    passes AND p_extra > 0.15 at P4 AND S_obs at or below its null mean -> weak excess-zero
    effects FALSIFIED at t=1 for rho >= rho_80(N_realized, composition_realized) at 80% power
    within statistic/cell/exposure/seeds (FX1-P); STOP RULE (non-replication branch): two
    monotone null readings at increasing exposure (531002@2^30 S = 0; 531003@2^32 S <= mean) with
    rising power close the t=1 lane of the X statistic -- no further t=1 exposure escalation
    without a NEW proposal; the obstruction block records the measured exclusion frontier
    rho_80(N_realized); effects rho < rho_50 remain named-unmeasured with the concrete revisit
    condition (only a pooled multi-seed design or larger exposure can touch them). (6) PX-WEAK:
    RESIDUAL branch -- anchor passes AND neither PX-ALIVE nor PX-DEAD (at design composition this
    is S in {4..7}: direction above the mean with 0.05 < p_extra <= 0.15, or S above the mean with
    p_extra > 0.15) -> weak-signal SURVIVAL, not closure; STOP RULE (survival branch): name the
    pooled multi-seed successor (second 2^32 arm at a fresh seed OR 4 x 2^30 joint analysis, joint
    LR decision), report the joint LR with G5 NOW (0 runs), and return to the Coordinator for
    re-rank; the lane stays OPEN. PRECEDENCE CLAUSE (repairing the RX-WEAK-b2/RX-DEAD overlap of
    IDEA-20260901-026d6a per TASK-20260901-281b77 RT-B, applied prospectively to this record's OWN
    rule): (a) the cascade is exhaustive and ordered -- every outcome matches EXACTLY ONE branch,
    because PX-WEAK is defined as the residual and the ALIVE/DEAD conjuncts (p_extra <= 0.05 vs
    p_extra > 0.15; S above vs at/below null mean) are disjoint; no two branches can both literally
    match, so the 026d6a ambiguity cannot recur; (b) should any future RESTATEMENT of these data
    match both a weak/non-replication description and a dead description, the DEAD branch governs
    the SIGNATURE verdict (it adds the strictly more specific conjunct S_obs <= null mean) and the
    weak-branch successor SURVIVES as a named revisit condition -- never silently preempted; (c) at
    realized compositions where the computed cutoff c <= null mean (degenerate; not met at any
    design-time composition, executor re-verifies c > mean), PX-ALIVE's mean conjunct is decisive
    and the outcome falls to the PX-WEAK residual -- recorded, never smoothed. NOTE: because
    c > null mean at every examined composition, p_extra <= 0.05 implies S above the mean
    automatically; both conjuncts are retained for frozen-rule continuity. Budget halts are
    resource_exhaustion, NEVER readings (rule 5). Thresholds: alpha_extra = 0.05 one-sided, weak
    band (0.05, 0.15], dead band p_extra > 0.15 with S at/below null mean -- inherited from 026d6a.
    Subclass readings per seed whatever the outcome, never pooled.

  branch_precedence_clause: >-
    RESTATED STANDALONE (the mandatory clause): This record's decision rule is an EXHAUSTIVE ORDERED
    CASCADE (PX-GATE-FAIL > PX-ANCHOR-FAIL > PX-F6 > PX-ALIVE > PX-DEAD > PX-WEAK-residual) committed
    in P0 before any arm runs. By construction no two branches can literally match the same outcome:
    PX-WEAK is the declared complement of all other branches, and the ALIVE/DEAD p_extra and
    S-vs-mean conjuncts are disjoint. This repairs the IDEA-20260901-026d6a defect in which RX-WEAK
    branch 2 and RX-DEAD both literally matched the G5/r0 numbers (EV-AES-241790 OBS-5ED-6;
    TASK-20260901-281b77 RT-B), adopting the red team's repair wording: whenever a dead-branch and a
    weak-branch description both fit, the DEAD branch governs the signature verdict as the strictly
    more specific conjunct, and the weak branch's named successor SURVIVES as the revisit condition
    and is never silently preempted. The clause binds this record's own rule and is carried verbatim
    into the P0 preregistration file.

  test_boundary: >-
    Toy tier; r=5 alive arm (one r=6 known-dead anchor), both at 2^32; one probe cell (amask=1,
    smask=1); fresh seed 531003 (anchor and alive share it); bijective tables only; one key per seed
    family (key co-varies with the table by pinned convention). The strongest licensed sentences:
    'within the tested probe cell at toy tier, weak excess-zero effects rho >= rho_80(N_realized)
    are absent at t=1 at exposure 2^32, seed 531003' (if PX-DEAD) and 'the excess-zero signature
    resurrects at t=1 at 2^32 at seed 531003' (if PX-ALIVE) -- NEVER 'any S-box', never 'e is/is
    not the carrier in general', never effects below rho_50 from a PX-DEAD outcome, never anything
    about full-round or deployed AES; no published-frontier comparison in either direction (R3).

  falsification_conditions:
    - >-
      FX1-P (MAIN - falsifies WEAK excess-zero effects, not the instrument). PX-DEAD fires: anchor
      passes, p_extra > 0.15 at seed 531003 with S_obs at/below its null mean. Then weak effects
      rho >= rho_80(N_realized) (design-time bracket 0.083-0.109; exact value reported) are
      falsified at t=1 within this statistic/probe cell/exposure/seeds at 80% power -- the scoped
      successor to EV-AES-241790's FX1, which reached only rho >= 0.225. Effects rho < rho_50
      (~0.05) are NOT falsified (BF calibration in stop_rule_bayes_factors); they remain
      named-unmeasured. Complete result; the record's most valuable negative.
    - >-
      FX3-P (WEAKENS, does not falsify). PX-WEAK fires: direction above the mean but marginal
      (0.05 < p_extra <= 0.15) or otherwise residual. Recorded as measured weak-signal survival
      with the weakening located; pooled multi-seed successor named; joint LR with G5 reported.
    - >-
      FX4-P (BLOCKING - statistic indictment). The repaired statistic fires toward extra zeros on
      the known-dead arm at 2^32 (p_extra <= 0.05 at P3). Proves-too-much recurrence at this
      exposure; HALT and repair; NO alive reading admitted; never evidence about e (rule 5).
    - >-
      FX5-P (BLOCKING - gate/instrument). Gate-0 rebuild identity fails (the cap delta perturbs the
      trial map or hit_e_detail), determinism fails, KAT pins fail, the source-diff finds ANY
      change beyond the HIT_LOG_CAP constant, digest re-verification fails, or hit_overflow > 0 on
      an analysis-bearing receipt. invalid_measurement; repair (rule 5); never evidence about e.
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); arms with n_hits < 5 (power floor, recorded,
      never tested); timeouts/crashes (rule 5); the F6 tripwire (anchor hits >= 33) is an
      escalation to claim-changing review per the frozen taxonomy, not a defect of this record.

  controls:
    - >-
      DEAD-ARM ANCHOR AT MATCHED EXPOSURE, ANALYZED FIRST (preregistered, BINDING ORDER): the fresh
      r=6 seed-531003 arm at 2^32 is run and ANALYZED BEFORE the alive arm; if it fires (p_extra <=
      0.05) or trips F6 (hits >= 33), the batch HALTS and NO alive reading is admitted. This is the
      exact inverse of the Stage-0 failure mode, now at the same exposure as the claim it guards;
      anchor power quantified (rejects systematic firing at S >= 3 of ~10 hits, P = 0.0142).
    - >-
      GATE-0 EXTENDED REBUILD (P2): the cap-256 build must reproduce L1-AES-R5-P30 field-by-field
      and the committed G3 hit_e_detail exactly (14 records) with hit_overflow = 0 before any 2^32
      arm runs -- proving the cap delta is non-perturbing on the same lineage Gate-0 already
      validated.
    - >-
      RUN-INTERNAL CONDITIONAL NULL (inherited): the arm's null baseline comes from its own ~2^32
      miss trials (class-wise exact rationals; relative SE ~7e-5, half the 2^30 value); the test
      auto-calibrates to the seat's zero-byte geometry.
    - >-
      OVERDISPERSION AUDIT (mandatory here, inherited trigger n_hits >= 50): expected ~66-76 hits
      FIRE the audit -- first two per-hit X moments against the null mean/variance, reported
      whatever the outcome; polices the Bernoulli-independence assumption that the 2^30 arms were
      too small to audit (026d6a confounders; red team RT-C control).
    - >-
      ZERO-COST JOINT-LR CROSS-SEED CONTROL (PR-P4): the new arm convolved with committed G5
      (531002) under E-rho, exact arithmetic, 0 runs -- the seed-variance reading the single-arm
      design recovers for free; design-time calibration table committed in P0.
    - >-
      PROVES-TOO-MUCH RECHECK (inherited FX4-P semantics): the statistic must read null on every
      known-dead object -- both committed r=6 arms, G4, and the new 2^32 dead arm; any firing
      toward extra zeros on a dead object indicts the statistic, never reads as carrier signal.
      Known-false seat (amask=15, 363851 Stage 1b) stays the named second false-positive control,
      NOT spent here.
    - >-
      SEED-DISCIPLINE AND HYPOTHESIS-GENERATING SPLIT: fresh untouched seed 531003 for the decision;
      the 531001/531002 data are committed and inspected -- they enter ONLY through the preregistered
      joint-LR control and the power calibration, never as confirmatory evidence; readings per seed,
      never pooled (OBS-B16-3 / J-C discipline).
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST: statistic inheritance, cutoff rule, cascade with
      precedence clause, anchor order, stop rule, effect model, power tables, seat tuples,
      allowed-diff list committed write-once in P0 with mtime BEFORE the first fresh arm,
      re-verified post-arm (V-804-2; BATCH-fe0bdc precedent).

  confounders:
    - >-
      EFFECT-MODEL DEPENDENCE OF THE POWER TABLE: rho_80 is stated under E-rho (per-hit +1 zero).
      The natural alternative (per-byte rate increase) agrees to first order in the per-hit mean
      shift; clustered-zero effects would reduce power (variance inflation). Mitigation: the
      overdispersion audit fires at this arm's expected n and detects clustering; the power claim
      is stated under the preregistered model and reported as such, never smoothed.
    - >-
      REALIZED HIT-COUNT UNCERTAINTY: N at 2^32 is a draw from one seed's hit process (observed 2^30
      range 14-19 -> expected 56-76 at 2^32). Priced, not hidden: power tables bracket N = 56/66/
      76/96; the binding claim uses the worst case rho_80 <= 0.109 (N = 56). If N < 5, the arm is
      recorded and never tested (power floor); if N < 56, the realized rho_80 is reported and the
      shortfall disclosed, not repaired post-hoc.
    - >-
      INDEPENDENCE ASSUMPTION IN H0-X (inherited): within-hit Bernoulli independence of non-forced
      bytes; positive correlation inflates Var(X). Now policed EMPIRICALLY at this arm (the
      overdispersion audit fires), where at 2^30 it could only be disclosed.
    - >-
      ANCHOR POWER LIMIT (inherited, requantified): ~8-12 dead hits catch systematic firing
      (P(reject | dead) = 0.0142 at S >= 3), not subtle variance/deficit miscalibration; disclosed,
      amask=15 seat remains the named second control (unspent).
    - >-
      HIT-LOG CAP DELTA: the ONLY instrument change (64 -> 256) is pure logging capacity, but any
      logging change is policed as if it were not: source-diff audit must show the single constant,
      Gate-0 rebuild must reproduce the trial map and the 14 committed hit records exactly, and
      hit_overflow = 0 is a hard gate on analysis-bearing receipts.
    - >-
      KEY-SCHEDULE CO-VARIATION, THREAD-COUNT PINNING, SHARED-HARNESS BUGS: inherited unchanged from
      026d6a/363851 confounders (same instrument lineage); the r=6 anchor and Gate-0 police them as
      there. Z-field semantics (Z counts zeros of q0^q1, not e) inherited and unchanged.

  interpretation_limits:
    - >-
      claim_tier toy. PX-ALIVE licenses 'within the tested probe cell at toy tier, the r=5 excess
      hits carry extra zero bytes of e beyond the forced envelope at seed 531003, exposure 2^32' --
      never 'any S-box', never 'e is the only carrier', never anything about full-round or deployed
      AES. PX-DEAD licenses the powered exclusion AT rho >= rho_80(N_realized) ONLY -- never
      absence of effects below rho_50, never absence at other seeds/cells/statistics/exposures.
    - >-
      PX-ALIVE at t=1 is NOT carrier confirmation: the causal reading (excess rides on e) still
      requires joint decay along the ramp (026d6a C2), which stays unmeasured and gated; the red
      team's J-D stands against any one-point carrier language at any exposure.
    - >-
      The X statistic remains blind to effects acting only through the envelope's extent and to the
      one-sided linear candidate (04606c route (ii)) -- both stay live, named, unmeasured whatever
      the outcome; the campaign-level carrier-closure standard (>= 2 adequately-powered points,
      prior boundary item 4) is NOT met by one arm at any exposure.
    - >-
      No published-frontier comparison in either direction (R3); recalled references are pointers,
      never support. Timeouts, crashes, infrastructure failures are never negative mathematical
      evidence (rule 5).

  heuristic_assumptions:
    - id: H1-P
      statement: >-
        WEAK EXCESS-ZERO SURVIVAL AT t=1. A per-hit extra-zero effect rho in (0, ~0.15] persists at
        exposure 2^32 under the repaired X statistic at fresh seed 531003 -- i.e., PX-ALIVE fires
        (S above its null mean, p_extra <= 0.05).
      rigorous_support: >-
        RIGOROUS PART - the statistic, null, cutoffs, sizes, and power tables are exact conditional
        computations (fresh-code DP this session, cross-validated digit-for-digit against the red
        team's independent n=19 table); the anchor-first order and precedence-repaired cascade make
        the outcome determinate. WHAT IS HEURISTIC is the effect itself: every committed reading
        points null (G5 S = 0; residual unreplicated; strong form disfavored at BF ~97), and only
        the weak band rho <= 0.15 survives the 2^30 exposure nearly uninformative (joint LR
        0.57-1.45). DISTRIBUTION IMITATED - none named; the 2^32 arm IS the validation, stated so a
        PX-ALIVE outcome is recognized as the assumption winning.
      validation_plan: >-
        Stage P: P3 anchor at matched exposure (analyzed first), then P4 powered alive arm at
        531003; joint-LR control with G5 reported whatever the outcome.
      falsification_condition: >-
        FX1-P (PX-DEAD at stated power rho >= rho_80); FX3-P (PX-WEAK weakening branch records
        survival without confirmation).

  obstruction:
    quantity: >-
      The minimum detectable per-hit extra-zero rate rho at 80% power under the repaired X
      statistic at t=1, as a function of realized hit count N at exposure 2^32 -- the powered
      exclusion frontier this record measures.
    measured_value: >-
      Design-time (this session, fresh exact/float DP; executor re-derives): rho_80 = 0.083 at
      N = 76 design composition (cutoff 8, size 0.0429); 0.096 at N = 76 G5-ratio composition
      (cutoff 9, size 0.0211 -- the red team's value, recovered as a composition case); <= 0.109
      uniformly over N >= 56 (worst case N = 56, cutoff 7). Compare the standing frontier measured
      by EV-AES-241790: rho_80 = 0.225 at N = 19 (2^30). Error bars: exact sizes at stated N;
      N-uncertainty bracketed, not smoothed; effect-model dependence disclosed (E-rho).
    runs_read_from: >-
      Design-time computation from committed parameters (EV-AES-241790 tested_parameters; G5
      committed rationals; observed hit rates 14/19 per 2^30); to be replaced by the realized
      reading of runs P3/P4 (this record's stage P).
    scope_claimed: >-
      Toy tier, one probe cell (amask=1, smask=1), r=5 alive / r=6 dead anchor, seed 531003,
      exposure 2^32, repaired X statistic. No claim beyond.
    resource_check:
      examined: true
      reading: >-
        The obstruction is read as an ASSET by two downstream consumers. (i) If PX-DEAD fires, the
        measured exclusion frontier rho_80(N) becomes the sensitivity floor for the ramp-shape
        question (363851 C3, RANK 2): a shape-only reduced Stage 1 must state, point by point, what
        rho it can exclude before claiming anything -- the obstruction becomes its control reading,
        exactly as EV-AES-241790's S = 0 became this record's baseline. (ii) The pooled multi-seed
        successor (PX-WEAK path) consumes the same per-arm power curve as its joint-power kernel.
        If PX-ALIVE fires, the frontier converts into a measured effect size and the ramp's tracked
        coordinate. All three readings named in advance; no fourth found unexamined.

  target_complexity:
    time_exponent: >-
      No attack, no exponent. Stage P: 8 binary invocations; ~4.5-4.6 h wall clock under the
      BINDING baseline (2^32 arms charged 4x the ~27 min 2^30 4-thread baseline; Gate-0 rebuild at
      the ~54 min 2-thread baseline); declared cap 18000 s; measured campaign hardware ~14 min
      (optimistic-relative, disclosed).
    memory_exponent: >-
      O(1) per trial (table-driven; fixed histograms; class counters; per-hit detail capped at 256
      records ~= 12 KB additional over the observed 1.62 MB RSS). Exact-test DP O(S_max * n_hits),
      seconds at n <= 2000 (frozen cap; n ~ 66-76 here).
    best_known: >-
      The committed endpoints are the baseline (S = 0 at 2^30; power ceiling rho_80 = 0.225). The
      only improvement claimed is evidential: minimum detectable effect rho_80 lowered to
      0.083-0.109 at 4x exposure. No improvement claimed on any cost axis.
    hidden_overhead: >-
      Disclosed: the cap delta is a one-constant source change, policed by three gates; the binding
      baseline hides the machine difference vs measured campaign rates (flagged optimistic-relative,
      binding as stated); the power tables hide the effect-model choice (E-rho preregistered,
      alternative first-order-equivalent, confound disclosed).
    tradeoff_note: >-
      Evidential tradeoff stated: 4x exposure at ONE new seed buys the weak-band decision at
      rho_80 ~ 0.08-0.11 for ~2 analysis-bearing arms (~4.5 h baseline); seed-variance resolution
      beyond the joint-LR control costs the pooled design, named but NOT spent. No time-memory
      tradeoff in content.

  dominated_by: >-
    CHECKED ROW BY ROW across time, memory, and data/queries. ROW 1 - EV-AES-241790: measured the
    2^30 null with power ceiling rho_80 = 0.225 and NAMES this successor as its unresolved confound
    -- this record is its strict power extension, not dominated by it (a record that names a
    successor does not execute it). ROW 2 - TASK-20260901-281b77 red_team_report: computed the 2^32
    power table (cutoff 9, rho_80 = 0.096) as analysis only -- no spec, no anchor order, no
    decision rule, no budget, no instrument delta; this record consumes and cross-validates it
    (fresh DP reproduces its n=19 table digit-for-digit and locates cutoff 9 as the G5-ratio
    composition case) -- consumption of a named control is succession, not domination. ROW 3 -
    IDEA-20260901-026d6a RX-WEAK-b2: names 'one 2^32 t=1 arm' without a design; this record is that
    design's execution. ROW 4 - IDEA-20260901-363851 Stage 1a/1b: different question (ramp shape),
    ~4-4.5 h, gated, and cannot adjudicate weak t=1 effects under a statistic proven tautological
    until this lane's statistic is spent -- no domination; explicitly NOT consumed here. ROW 5 -
    the 4 x 2^30 pooled design: POWER-EQUIVALENT conditional on total N (identical rejection region
    and power function -- S is a sum of independent per-hit contributions) and EQUAL on all cost
    axes (total trials 2^32, sequential wall-clock, memory); neither dominates: the pooled design
    measures seed variance directly (advantage), this record keeps the validated single-arm
    analysis path and recovers partial seed variance via the free joint-LR control (advantage); the
    pooled design survives as the named PX-WEAK successor, written honestly rather than spent. ROW
    6 - IDEA-20260901-04606c route (ii) / 69912d / 02f7c4 / 054dd4 / bcb117 / ec54fe: different
    statistics or coordinates (one-sided perturbation, layer autopsy, cross-lineage battery,
    cell-unit, hit-rate discriminator, affine census) -- orthogonal, no domination either way. ROW
    7 - EV-AES-ec53f1 / b2910a / 732f71: sealed verdict, battery, Stage-0 measurement -- consumed
    inputs. Every row checked; none dominates; null written honestly. Published frontier
    unadjudicable (R3); no margin claimed.
  sota_delta:
    time_exponent: '0 (no attack)'
    memory_exponent: '0 (no attack)'
    data_or_query_exponent: '0 (no attack)'
    note: >-
      Evidential delta: moves the weak-effect exclusion frontier from rho_80 = 0.225 (2^30, n = 19)
      to rho_80 = 0.083-0.109 (2^32, N = 56-76) -- a 2.1-2.7x improvement in minimum detectable
