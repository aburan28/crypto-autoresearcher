  title: >-
    POWERED 2^32 SUCCESSOR - weak excess-zero carrier effects SURVIVE the 2^30 RX-DEAD reading of
    EV-AES-241790: that arm rejected only at S >= 4 (size 0.01875), had 80% power only at per-hit
    extra-zero probability rho >= 0.225, and the two-seed joint likelihood ratio stays 0.57-1.45 for
    rho in [0.02, 0.15] -- nearly uninformative (TASK-20260901-281b77 RT-A/RT-E). DEC-20260901-600997
    RANK 1 therefore routes here: ONE 2^32 t=1 arm under the repaired envelope-relative X statistic
    of IDEA-20260901-026d6a, fresh seed 531003, preceded by a fresh r=6 dead-arm ANCHOR at the same
    2^32 exposure analyzed FIRST, with an exhaustive ordered branch cascade whose precedence clause
    repairs the RX-WEAK-b2/RX-DEAD overlap of the frozen 026d6a rule (red-team RT-B wording, applied
    prospectively). Design-time exact DP (this session, fresh code; the n=19 cross-check reproduces
    the red team's table digit-for-digit): at ~76 hits the null mean is 3.86-4.0, the
    realized-composition cutoff is c = 8 (design composition, size 0.0429) to c = 9 (G5-ratio
    composition, size 0.0211 -- the red team's cutoff), rho_50 ~= 0.050 and rho_80 ~= 0.083-0.096,
    power 0.875-0.9997 across rho = 0.096-0.214; the design is robust to the observed hit-count seed
    variance (N = 56-96 bracketed). One additive instrument delta is required and disclosed:
    HIT_LOG_CAP 64 -> 256 (per-hit detail cap; expected ~66-76 hits at 2^32 exceed 64; pure logging
    constant, policed by source-diff audit + Gate-0 re-proof). Budgeted at the BINDING handoff
    baseline (each 2^32 analysis arm charged 4x the ~27 min 2^30 4-thread baseline; ~4.5 h baseline
    total; 18000 s wall-clock cap); measured campaign hardware would run it in ~14 min
    (optimistic-relative, disclosed). Stage 1a/1b and the full ramp of IDEA-20260901-363851 are
    EXPLICITLY NOT spent. Toy tier only; no deployed-AES claim; no published-cryptanalysis
    comparison in either direction (R3).

  object: >-
    TRACKED OBJECT - THE WEAK-EFFECT REGION rho in (0, ~0.15] LEFT OPEN BY EV-AES-241790. The
    repaired X statistic (IDEA-20260901-026d6a) falsified the excess-zero SIGNATURE at t=1 at 2^30
    (S_obs = 0 at seed 531002, p_extra = 1 exact), but at a disclosed power ceiling: 80% power only
    against rho >= 0.225, and the two-seed joint cannot discriminate the pure null from weak effects
    (joint LR 0.57-1.45 for rho in [0.02, 0.15]). The carrier clause of e is WEAKENED /
    NON-REPLICATED, not dead; both the red team's boundary statement (item 1) and the RX-WEAK-b2
    successor name exactly one adjudicant: a 2^32 t=1 arm (80% power at rho ~= 0.096). This record
    is that adjudicant, fully specified: it moves the minimum-detectable per-hit effect from
    rho_80 = 0.225 (2^30) to rho_80 ~= 0.083-0.109 (2^32, across the realized hit-count bracket),
    a 2.1-2.7x improvement in effect sensitivity at 4x exposure, and installs the first
    precedence-repaired decision rule in this lane. The ramp coordinate (363851 Stage 1 / C3) stays
    gated and is NOT consumed here.

  lossy_projection_test: >-
    Inherits the X statistic's own projection losses (byte positions of extra zeros discarded apart
    from zero_mask_e; non-hit trials reduced to class-wise baselines; blind to effects acting only
    through the envelope's extent -- 026d6a lossy_projection_test). NEW losses this record owns:
    (i) ONE fresh seed at 2^32 -- seed-specific effects at untested seeds remain out of scope; the
    projection is partially repaired at zero cost by the preregistered joint-LR convolution with the
    committed G5 reading (seed 531002, different exposure), reported whatever the outcome; (ii) the
    power statement is conditional on the preregistered Bernoulli effect model (each hit gains
    exactly one extra zero with probability rho -- the model matching the committed residual's shape,
    all nonzero X at 531001 being X = 1); the natural alternative (per-byte rate increase) agrees to
    first order in the per-hit mean shift, and the confound is disclosed, not smoothed. Genuinely
    lossy; the fibres are named.

  claim: >-
    Three statements C1P-C3P, with the survival clause carried as heuristic H1-P below, never as
    established.

    (C1P) DECIDABILITY AT POWER. The preregistered cascade returns EXACTLY ONE branch for the 2^32
    arm (exhaustive by construction: PX-WEAK is the declared residual), under an anchor-first
    binding order, at disclosed size/power: cutoff c = smallest integer with exact-DP tail
    P(S >= c | realized mask multiset, run-internal rates) <= 0.05 (design-time bracket c in {8,9},
    sizes 0.0429/0.0211; composition extremes {8,10} at n = 76); rho_50 ~= 0.050; rho_80 ~=
    0.083 (design composition) to 0.109 (N = 56 low-hits bound); power >= 0.98 for rho >= 0.139.

    (C2P) POWERED EXCLUSION (if PX-DEAD fires). Weak excess-zero effects are FALSIFIED at t=1 for
    rho >= rho_80(N_realized) at 80% power within the tested statistic/probe cell/exposure/seeds
    (FX1-P) -- the exact scoped successor to EV-AES-241790's RX-DEAD, which excluded only
    rho >= 0.225. Effects rho < rho_50 (~0.05) remain named-unmeasured, not falsified (honest
    scope; at S_obs = 0 the Bayes factor against rho = 0.05 is ~49 and against rho = 0.02 only ~4.6).

    (C3P) RESURRECTION (if PX-ALIVE fires). The excess-zero signature is RESURRECTED at t=1 at 2^32
    at a fresh seed (p_extra <= 0.05, S above its null mean -- the red team's boundary item 1
    revival condition), converting EV-AES-241790's non-replication into a measured seed-variance
    event; escalation to a claim-changing review round, no automatic Stage 1 spend.

    (WHAT IS NOT CLAIMED) No statement about full-round or deployed AES; no published-frontier
    comparison in either direction (R3); no claim that X exhausts the carrier question (the
    one-sided linear candidate IDEA-20260901-04606c route (ii) stays out of scope, named); no claim
    about the ramp shape (363851 C3 stays gated, unspent); no claim that PX-DEAD (if it fires)
    touches effects below rho_50 or other seeds, cells, statistics, or exposures.

  mechanism: >-
    Same candidate mechanism as 026d6a H1 in its weak-effect restatement: RESIDUAL-CARRIER COUPLING
    (IDEA-20260901-04606c H2) -- the nonlinear S-box layer makes the identity law fail on the trial
    mass, rare excess hits concentrate on accidentally affine-compatible trajectories, and the
    cipher-touch appears as extra zero bytes of e beyond the forced envelope at a per-hit rate rho
    ABOVE the mask-conditional null. EV-AES-241790 removed the strong form of this mechanism at t=1
    (S = 0 at seed 531002; the 531001 point estimate rho = 3/14 = 0.214 disfavored at BF ~ 97); what
    survives is precisely the weak form rho <= 0.15 that the 2^30 exposure could not see. ADVERSE
    EVIDENCE ON RECORD, stated up front: two consecutive null-direction readings at increasing
    exposure would be the natural expectation under the pure null, and G5's S_obs = 0 already
    disfavors a uniform effect at rho = 0.10 by BF ~ 7.4 ((1-0.10)^-19); the design's value is that
    it makes the weak-effect question DECIDABLE either way at stated power, not that it expects to
    find signal. The rival branch (hits are word-vanishing events with random residual bytes) is
    the preregistered null H0-X, inherited unchanged from 026d6a.

