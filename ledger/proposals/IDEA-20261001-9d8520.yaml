  assumptions:
    - Frozen V, B₀, α, seeds, and relation-collection pin before any run.
    - Toy Koblitz cell and collector already admitted or cell is
      failed_infrastructure (do not provision Magma/Sage/curve libs mid-tick).
    - Absorption fraction ≠ Frobenius-closed yield (0fcbe2).
    - Absorption ≥α ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-9d8520-H1
      formal_statement: >-
        FORALL admitted toy cells n∈{17,23,31} with frozen (V,ℓ,B₀,α): if
        N_orph ≥ N_min orphans are observed at B₀, then
        A := (# closed at 2B₀) / N_orph ≥ α.
      random_model_justification: >-
        Rigorous: classical double-large-prime analyses (KR-IC-a4dd54 /
        KR-IC-46d822) treat cofactors in (B₀, 2B₀] as recoverable with positive
        density under random-model smoothness. Classical: if toy-Koblitz
        relation cofactors behave like random integers of their bit length,
        raising the bound to 2B₀ should absorb a stable fraction α; if the
        binary relation distribution is heavily structured (or orphans are
        mostly non-semi-smooth noise), A may fall below α. The α band is the
        pre-registered transfer hypothesis at toys — not a claim that DLP
        beats rho.
      supporting_results:
        - KR-IC-a4dd54
        - KR-IC-46d822
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        A < α at a completed cell with N_orph ≥ N_min (DLP-absorption-weak),
        OR collector / toy cell absent (infrastructure stop), OR N_orph < N_min
        after the budgeted collection (inconclusive; raise budget or stop).

  predictions:
    - metric: orphan_absorption_fraction_A
      direction: lower_bounded
      minimum_effect: '≥ α at each completed cell with N_orph ≥ N_min'
    - metric: orphan_count
      direction: lower_bounded
      minimum_effect: 'N_orph ≥ N_min (frozen), else inconclusive'
    - metric: null_random_integer_absorption
      direction: different
      minimum_effect: 'null catalog A independent of relation structure'

  minimal_test: >-
    Stage 0: freeze V, ℓ∈{3,4}, B₀, α, N_min, seeds, collector pin.
    Stage 1: n=17 — collect at B₀; re-score orphans at 2B₀; report A.
    Stage 2: n∈{23,31} + random-integer null catalog. Budget: ≤8 CPU-hours.
    Stop if toy cell / collector absent (IMP, never evidence; do not provision).

  controls:
    - ctl_frozen_V_B0_alpha_Nmin
    - ctl_shared_collector_pin
    - ctl_orphan_definition_frozen
    - null_random_integer_matched_bitlength
    - ctl_no_posthoc_alpha_edit
    - ctl_no_midtick_lib_provision

  falsification_conditions:
    - Claiming practical binary IC from a toy absorption band (KR-IC-1fcdbc).
    - Equating absorption with τ-closed yield (0fcbe2).
    - Editing α after seeing A.
    - Transferring α to n≥131 without a new contract.
    - Provisioning Magma/Sage/curve libs mid-tick to force a run.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Relation-quality instrument only; absorption ≥α
      does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store orphan cofactor lists.
    best_known: >-
      KR-IC-a4dd54 (double-large-prime hyperelliptic); KR-IC-46d822 (Gaudry).
    hidden_overhead: Collection PIN constants; smoothness-test cost at 2B₀.
    tradeoff_note: >-
      Higher large-prime bounds raise matching cost; this meter reports
      absorption only, not net wall-time win.

  estimated_cost:
