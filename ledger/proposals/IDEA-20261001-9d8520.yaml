idea:
  id: IDEA-20261001-9d8520
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES DOUBLING THE LARGE-PRIME BOUND ABSORB ≥α OF ORPHANED SEMI-SMOOTH
    RELATION CANDIDATES AT TOY KOBLITZ? On stdlib (or already-admitted) toy
    Koblitz cells n∈{17,23,31}, collect relations under bound B₀ then re-score
    orphans at 2B₀ and test whether the absorbed fraction is ≥α (α frozen).

  class: heuristic_validation

  claim: >-
    Double-large-prime variants are standard in hyperelliptic / extension-field
    IC (KR-IC-a4dd54 / KR-IC-46d822) but are not calibrated as an absorption
    meter on RQ-BINSTD toy Koblitz cells. CLAIM: for each admitted toy cell
    n∈{17,23,31} with a frozen factor-base V (dim ℓ∈{3,4}) and smoothness
    bound B₀, among relation candidates that are semi-smooth at B₀ but fail
    to close as full relations (orphans), the fraction that become full
    relations when the large-prime bound is raised to 2B₀ is ≥α with α frozen
    at Stage 0 — OR absorption <α and is recorded as DLP-absorption-weak at
    this scale. CLAIM TIER: heuristic_validation. NO break. NO exponent.
    NO n≥131 transfer. Distinct from IDEA-20261001-0fcbe2 (τ-closed yield),
    cb6a72 (Frobenius orbit attempt counts), and solver-engine races.

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V} on a toy Koblitz cell;
    Operation: run a frozen relation-collection pin at smoothness B₀, classify
    orphans (semi-smooth but not fully smooth / not matching), then re-score
    the same candidates under large-prime bound 2B₀ (KR-IC-a4dd54-style
    double-large-prime bookkeeping adapted to the binary toy pin). Observable:
    absorption fraction A = (#orphans closed at 2B₀) / (#orphans at B₀).
    Trichotomy: Class I instrument (relation-quality meter). Lossy-projection:
    A discards which prime factors appear; null is a matched catalog of random
    integers of the same bit length whose 'orphan' labels are independent of
    the 2B₀ re-score by construction. OFF-LIMITS: Frobenius-closed yield
    (0fcbe2); usable_dimensions; PDP solver races; any claim that DLP beats
    rho. WHAT IS NEW: a frozen α absorption band for 2B₀ vs B₀ on RQ-BINSTD
    toys.

  novelty_status: unverified
