idea:
  id: IDEA-20261006-a984aa
  question_id: RQ-ECDLP-c1b7b1
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Precision-2 y-carry doubling defect on one ordinary curve versus one
    anomalous curve
  class: control
  claim: >-
    R1 coordinates in Z/p^2 Z; no attack stage is assigned a new charged
    cost, and no scalar is claimed as recovered. Let c_2(P) be the second
    digit (ỹ - y(P))/p in F_p of the y-coordinate of the precision-2
    Hensel lift of an affine point P, using the lift whose y-digit in
    {0,...,p-1} is the smallest nonnegative solution of the lifted curve
    equation. Let D(E) be the fraction of affine points P on E(F_p) for
    which 2P is also affine and c_2(2P) is not equal to 2 c_2(P) in F_p.
    The claim is that D(E_ord) >= D(E_an) + 1/4, where E_ord is the first
    short-Weierstrass curve found with prime order at a prime q in [5,40],
    and E_an is the first short-Weierstrass curve found with #E(F_p)=p at
    a prime p in [5,40]. A pass separates the ordinary digit from the
    anomalous calibration by that margin. It does not establish an ECDLP
    algorithm on the ordinary curve.
  mechanism: >-
    OBJECT FRAME. Representation of the point: R1, the affine coordinates
    lifted to Z/p^2 Z. Operation set Sigma: doubling, the set of maps
    P |-> 2P. Sigma does not contain the translation action. F5, a p-adic
    lift, is a named component: the digit is read from a Hensel lift. The
    quantity added is the doubling-defect fraction, compared between one
    ordinary prime-order curve and one anomalous curve, which is the
    question's calibration split for a cheap digit.
    TRICHOTOMY. Coordinate-dependent. Reason: c_2 is read from the chosen
    Z/p^2 chart. A different tie-break for the Hensel root is a different
    function of the same group element, so the label is a function of the
    representation.
    LOSSY-PROJECTION TEST. From the precision-2 point (x̃, ỹ), discard x̃
    and discard ỹ mod p, and retain only c_2 in F_p. The discard is
    compatible with Sigma in the sense under test: doubling acts on the
    lifted point, and the identity c_2(2P)=2 c_2(P) is exactly the
    statement that the retained digit commutes with that action. The
    projection is lossy in the representation used: a pair of Z/p^2
    coordinates is sent to one element of F_p, and many lifts share one
    carry. Whether it is also lossy on the set of group elements is the
    measured defect, not an assumption.
  novelty_status: unverified
  citations:
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C says exact sum-compatibility plus associativity forces a
        surjective homomorphism, impossible for prime order and a
        nontrivial lossy quotient. The doubling identity is a weaker test
        than full sum-compatibility, so a small defect does not by itself
        invoke that impossibility.
      verified_by: idea-generator, knowledge/findings/KN-FIND-ffe1df.md
    - ref: KN-OPEN-019
      provenance: internal
      claim: >-
        No closed object enumeration for the ECDLP is on file. The pair
        (Z/p^2 chart, doubling) is one sketch, with F5 named as a component.
      verified_by: idea-generator, knowledge/open-problems/KN-OPEN-019.md
    - ref: KN-OPEN-003
      provenance: internal
      claim: >-
        Whether a representation change lowers prime-field decomposition
        cost is open. This digit is not a decomposition-cost measurement.
      verified_by: idea-generator, knowledge/open-problems/KN-OPEN-003.md
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        On Koblitz curves, walking on Frobenius classes reduces parallel
        rho by sqrt(2m). This prime-field digit does not use that walk.
      verified_by: idea-generator, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
  assumptions:
    - >-
      F5 is a component. The anomalous curve is a calibration object, as
      the question file requires, and a recovered anomalous scalar is not
      a result.
    - >-
      The search window is the primes in [5,40]. If either curve is not
      found in that window, the cell is inconclusive.
    - >-
      Points at infinity and points where 2P is at infinity are omitted
      from the denominator of D(E). The denominator is reported.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: >-
        The second y-digit c_2, and the fraction of affine points that
        fail c_2(2P)=2 c_2(P).
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a two-curve defect comparison at precision 2, not a proof
      about succinct lifts. The strongest certified output is the sign of
      D(E_ord) - D(E_an) - 1/4 on the two curves the search returns. A
      nearby object where "every precision-2 digit leaks the scalar" is
      already the wrong reading is a uniform random map F_p -> F_p, whose
      doubling-defect fraction is (p-1)/p when 2P runs through affine
      points; that null is computed and is not the claim.
  predictions:
    - metric: D(E_ord) - D(E_an)
      direction: higher
      minimum_effect: >-
        Difference of fractions at least 1/4.
  minimal_test:
    design: >-
      Search primes in [5,40] in increasing order. E_an is the first curve
      y^2=x^3+A x+B with A,B in F_p, nonsingular, and #E(F_p)=p. E_ord is
      the first curve of prime order at a prime q in the same interval,
      q different from p. Compute c_2 on every affine point at precision 2.
      Recompute the same digit from a precision-3 lift truncated to
      precision 2.
    controls:
      - >-
        Precision-3 truncation must agree with the precision-2 digit on
        every point used in D. Disagreement voids the instrument.
      - >-
        On E_an, the question's calibration is in force: the known
        linear-time anomalous recovery must return a scalar m with
        [m]P=Q on one declared generator pair, or the instrument is void.
        That recovery is not part of D.
      - >-
        A uniform random function F_r -> F_r, r the field size, provides
        the noise fraction (r-1)/r. Both curve fractions are reported next
        to it.
    required_metrics:
      - identity of E_ord and E_an, including p, q, A, B, and group order
      - D(E_ord), D(E_an), both denominators
      - boolean, whether the precision-3 truncation agrees
      - boolean, whether D(E_ord) - D(E_an) >= 1/4
  falsification_conditions:
    - >-
      Both instruments are valid and D(E_ord) - D(E_an) < 1/4. This digit
      then fails to separate the ordinary curve from the anomalous curve
      by the declared margin. The negative closes only these two curves,
      this tie-break, and precision 2.
    - >-
      Truncation disagrees, or the anomalous scalar check fails. The run
      is void and is not a mathematical negative.
  confounders:
    - >-
      The smallest-nonnegative y-digit tie-break can differ from the
      formal-group parameter. A gap can be an artifact of that tie-break.
    - >-
      Omitting non-affine doubles changes the denominator. Both curves
      must use the same omission rule.
    - >-
      E_ord and E_an may sit at different primes. Fractions are comparable;
      raw counts are not.
  interpretation_limits:
    - >-
      Exponent delta 0 against prime-field Pollard rho at exponent 1/2.
      No ordinary-curve scalar recovery is claimed.
    - >-
      The anomalous linear-time recovery, if it succeeds, is the
      calibration the question already names.
    - >-
      Evidence at this window is a toy digit comparison. It does not
      decide the succinct-description dichotomy.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On the ordinary prime-order curve, the doubling-defect fraction of
        c_2 is within 1/10 of the random-map value (q-1)/q, while the
        anomalous curve's defect fraction is smaller by at least 1/4.
        This imitates a uniform random function F_q -> F_q for the ordinary
        digit, and it does not assert that the anomalous digit is linear.
      rigorous_support: >-
        KN-FIND-ffe1df Theorem C blocks an exactly sum-compatible lossy
        quotient on a prime-order group. Doubling-compatibility of one
        digit is a strictly smaller requirement, so Theorem C supplies the
        obstruction shape and not a numerical defect. The question file
        RQ-ECDLP-c1b7b1, which was read, names the anomalous curve as the
        linear calibration and requires a precision-(k+1) truncation check.
      validation_plan: >-
        Evaluate D on the full affine point set of each curve found in
        [5,40], and evaluate the random-map fraction (r-1)/r at the same
        r. Accept H1 at this window only if the ordinary fraction is within
        1/10 of (q-1)/q and the gap D(E_ord)-D(E_an) is at least 1/4.
        No second prime pair is implied.
  target_complexity:
    time_exponent: >-
      Exponent delta 0. Baseline not beaten: Pollard rho at exponent 1/2
      on a prime-order subgroup, the cost baseline named in
      RQ-ECDLP-c1b7b1.
    memory_exponent: >-
      Exponent delta 0. The census stores one digit per point, which is
      O(p) field elements at toy p and is not a sublinear memory claim.
    best_known: >-
      Pollard rho, time exponent 1/2, and the known linear-time anomalous
      calibration which the question file says is not a result when it
      succeeds.
    hidden_overhead: >-
      No o(1) term. Both groups have order at most 40 plus the trace bound.
    tradeoff_note: >-
      No time-memory tradeoff. The output is two fractions.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      The ECDLP frontier map read in knowledge/frontiers/ecdlp/README.md
      covers generic rho and index calculus. A precision-2 digit defect
      is a toy control and not an attack row on that map. KR-RHO-037e22
      was opened and is cited as a rho baseline this digit does not move.
    nearest:
      - ref: KN-FIND-ffe1df
