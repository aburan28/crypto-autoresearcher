idea:
  id: IDEA-20260801-005
  question_id: RQ-FAEST-001
  title: >-
    VOLEitH field-size round-trip check: reconstruct the FAEST soundness
    chain at toy fields and measure the per-round soundness error empirically
  class: measurement
  claim: >-
    FAEST's claimed security can be reconstructed as an explicit numbered
    chain (AES one-wayness -> VOLEitH soundness -> Fiat-Shamir -> forgery cost)
    whose per-round soundness error, if evaluated at a toy field size, is
    measurable: the empirical per-round error over many sampled prover
    transcripts either matches the claimed chain's prediction or exposes a
    step where the chain is loose. This measurement decides RQ-FAEST-001 at
    the toy tier and identifies which step cannot be the source of an attack.
  mechanism: >-
    VOLEitH per-round soundness is governed by the expected number of
    solutions to the multivariate relation each round admits; in the toy
    setting, the field and relation size are chosen so the expected count is
    small and the prover's distributions are empirically sampleable. Compare
    the empirical probability that a cheating prover survives a round to the
    chain's claimed error; any systematic gap localizes the loose step.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal reconstructs FAEST's chain at toy fields with an
        empirical per-round soundness measurement.
    conclusion: >-
      Reconstruction + toy measurement proposal; novelty unverified, no
      cryptanalytic claim.
  assumptions:
    - The FAEST chain's per-round error can be written as a closed-form
      function of field size and relation parameters.
    - Toy fields permit empirical sampling of cheating-transcript survival.
  predictions:
    - metric: empirical_vs_claimed_per_round_error
      direction: different
      minimum_effect: >-
        A ratio outside [0.5, 2] between empirical and claimed per-round
        error at 3+ field sizes is a loose-step signal requiring
        localization.
  minimal_test:
    design: >-
      Implement the toy VOLEitH relation; for each of 3+ field sizes, sample
      the empirical per-round soundness error over >= 10^5 cheating
      transcripts; compare to the chain's closed-form prediction; report which
      step's prediction is violated if any.
    controls:
      - Honest-transcript survival rate (must be ~1).
      - Closed-form prediction recomputed independently.
    required_metrics:
      - empirical per-round error per field size
      - claimed per-round error per field size
      - ratio and its confidence interval
  falsification_conditions:
    - Empirical error matches claimed error at all tested field sizes (chain
      tight at toy tier; no loose step found).
    - Empirical error departs from claimed error at some field size (loose
      step localized; candidate source of a below-claimed forgery).
  confounders:
    - Prover distribution misimplementation (use frozen reference prover).
    - Fiat-Shamir transcript-hash interactions outside the per-round model.
  interpretation_limits:
    - Toy-tier only; no crypto-scale forgery claim.
    - A matched empirical error does not prove crypto-scale tightness.
  heuristic_assumptions:
    - id: HEUR-FAEST-ERR-1
      statement: >-
        The per-round VOLEitH soundness error is a continuous, monotone
        function of field size, so toy measurements bound the direction of
        crypto-scale behavior.
      rigorous_support: >-
        Standard VOLEitH soundness arguments express error in terms of field
        size; the monotone-continuity assumption is heuristic and tested at
        the toy scale only.
      validation_plan: Fit the measured errors against the closed form across
        the tested field sizes; a consistent fit supports the extrapolation
        direction.
  target_complexity:
    time_exponent: n/a (measurement)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured per-round error curve and a
    loose-step localization for FAEST's chain at toy fields.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
