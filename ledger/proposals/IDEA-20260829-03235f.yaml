idea:
  id: IDEA-20260829-03235f
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-e72c0b
  title: >-
    Buy base rank from the object this program already owns: quadratic base change
    of the certified E8 rational elliptic surface into a K3, and measure the
    distribution of the anti-invariant rank r(D)

  class: composition

  claim: >-
    Let X/Q(t) be the pencil-of-cubics surface certified in EV-ECQ-0d142e -- deg c4
    = 4, deg c6 = 6, discriminant squarefree of degree 12, all twelve fibres
    irreducible I_1, Mordell-Weil rank over Qbar(t) exactly 8 and all eight
    sections Q-rational. Let D(t) in Q[t] be squarefree of degree 1 or 2 whose
    associated conic u^2 = D(t) has a rational point, and let Y_D be the pullback
    of X along the resulting degree-2 rational base change. THEN Y_D is an elliptic
    K3 surface over Q(u) (arithmetic genus chi = 2) and
    rank MW(Y_D / Q(u)) = 8 + r(D), where r(D) is the rank of X twisted by D over
    Q(t), because the deck involution splits the Mordell-Weil group into its
    invariant part (which is MW(X/Q(t)), rank 8) and its anti-invariant part (which
    is the Mordell-Weil group of the quadratic twist family). THE CLAIM UNDER TEST
    IS THE DISTRIBUTION OF r(D) OVER A DECLARED BOX, NOT ITS MAXIMUM. Two readings
    are pre-declared. If max r(D) is at least 2 over a box of at least 2000
    admissible D, this program owns for the first time a certified base rank
    strictly above 8 over Q(t), reachable with no external input, and every
    specialisation inherits it free. If max r(D) = 0 over that box while the null
    control behaves as predicted, the quadratic-base-change lever is measured to be
    weak ON THIS SURFACE in that box, which is a quantitative prior for the same
    lever applied at chi = 2 going to chi = 4 (IDEA-20260824-b26635) and would say
    that lever is not where the ladder comes from.

  mechanism: >-
    Base rank and sieve volume are not interchangeable, and EV-ECQ-0d142e's
    inference states exactly that: more sieving of a rational elliptic surface
    cannot supply base rank, because Shioda-Tate caps it at 10*chi - 2 = 8 and the
    squarefree discriminant makes the cap attained and exact. The only way out is
    to raise chi. Quadratic base change is the cheapest chi-raising operation that
    is DEFINED OVER Q and carries rank provably: chi doubles, the Shioda-Tate
    ceiling goes from 8 to 18 geometric, and the invariant part of the new
    Mordell-Weil group is the old one, so nothing is lost and the only question is
    how much the anti-invariant part contributes. The anti-invariant part is
    literally the Mordell-Weil group of the quadratic twist of the family by D, a
    rank that is computable from above by a single unconditional ellrank upper
    bound at a good specialisation (specialisation is injective for all but
    finitely many t, so the rank over Q(t) is at most the rank of any good fibre
    over Q) and from below by exhibiting sections. That two-sided computability is
    what makes the distribution of r(D) measurable rather than merely
    conjecturable. The gain is exponential in the currency the campaign runs on: if
    the excess distribution has tail exponent beta, then every unit of base rank is
    worth a factor exp(beta) of sieve volume, so an extra r(D) of base rank is
    worth exp(beta * r(D)) fibres that never have to be certified.

  tracked_object:
    object: >-
      The ANTI-INVARIANT PART of the Mordell-Weil group of the base-changed surface
      under the deck involution -- equivalently the Mordell-Weil group of the
      quadratic twist family -- indexed by the twisting polynomial D. NOT the
      fibres, NOT the specialisations, NOT the sieve.
    lossy_projection_test: >-
      PASSES. The projection sends the full arithmetic of the K3 surface Y_D (its
      Neron-Severi lattice, its 24 singular fibres, its j-map, all its
      specialisations) to a single non-negative integer r(D). It discards
      essentially everything, including the entire invariant summand, which is
      constant across all D and therefore carries zero information about the choice
      being made. It is discarded COMPATIBLY: the deck involution is an
      automorphism of Y_D over Q(u), so the Mordell-Weil group tensored with Q
      splits as a direct sum of its plus-one and minus-one eigenspaces, and the
      minus-one eigenspace is a well-defined Galois submodule that propagates
      deterministically under the operations the pipeline performs (further
      twisting, specialisation, restriction). It is NOT a change of coordinates:
      r(D) determines neither the twisted family nor Y_D nor any point on either.
    what_the_loss_costs: >-
      r(D) is a rank, so it cannot distinguish twists whose sections have wildly
      different heights, and KN-FIND-91f871 says exactly that height is what decides
      whether a family is usable. The design therefore records the naive height
      envelope of every candidate Y_D alongside r(D) rather than ranking on r(D)
      alone.

  novelty_status: unverified
  novelty_note: >-
    Classified as an adaptation on the strength of a record this session actually
    read, not on recollection. IDEA-20260824-b26635 (internal, claim block read via
    grep) proposes exactly this mechanism -- quadratic base change as "the one
    construction that provably carries rank across the descent from Qbar(t) to
    Q(t)", with a census of r(D) -- applied to the rank-17 K3 fibration to reach
    chi = 4. THE MECHANISM IS THEREFORE NOT NEW AND IS NOT CLAIMED AS NEW. What is
    different here is the INPUT OBJECT and hence the executability: b26635's input
    is the Elkies fibration, which GOAL-ECQ-2298dc records as unavailable and is
    blocked on; this idea's input is a surface certified inside this repository
    with all eight sections exhibited over Q(t) and content-hashed. The underlying
    splitting theorem (Shioda) is recalled only, so no stronger novelty label is
    available for the mathematics itself.

  citations:
    - ref: EV-ECQ-0d142e
      provenance: internal
      claim: >-
        OBS-1: the pencil through the eight listed rational points gives
        y^2 = x^3 - 27 c4(t) x - 54 c6(t) with deg c4 = 4, deg c6 = 6 and deg disc
        = 12, discriminant squarefree so all 12 fibres are irreducible I_1 and
        Shioda-Tate forces geometric Mordell-Weil rank EXACTLY 8; all 8 sections
        verified to satisfy the family IDENTICALLY over Q(t) as polynomial
        identities; the base locus is exactly nine points, verified by resultant.
        The obstruction block states that exceeding 8 over Q(t) requires a K3 or
        higher elliptic surface. qt_family.json (sha256 4646194...3f919b) is the
        committed witness carrying c4(t), c6(t), the discriminant and the eight
        sections -- the exact input this idea consumes.
      verified_by: >-
        idea-generator session 2026-08-29; FULL record read at
        ledger/evidence/EV-ECQ-0d142e.yaml
    - ref: IDEA-20260824-b26635
      provenance: internal
      claim: >-
        PRIOR ART FOR THE MECHANISM. States that the rank of the pullback over Q(u)
        equals the rank of E over Q(v) plus the rank of the D-twist over Q(v),
        equal to 17 + r(D) for the record fibration, on a surface of chi = 4 with
        Shioda-Tate ceiling at most 38 minus the root-lattice contribution; and
        that the claim under test is the DISTRIBUTION of r(D), not its maximum. Its
        input is the rank-17 fibration.
      verified_by: >-
        idea-generator session 2026-08-29; TITLE, class and claim block only, read
        via repository grep. The full record was not opened, so the exact design,
        controls and box of b26635 are NOT known to this session and any overlap
        beyond the claim text is unassessed.
    - ref: GOAL-ECQ-002
      provenance: internal
      claim: >-
        The objective text records, as a 2026-08-24 correction, that an elliptic K3
        has generic bound 18 over C and 17 over Q, that rank 18 over Q is
        impossible by a result of Elkies, and that a generic bound is never to be
        read as a budget. It also records C2 met at rank at least 11 for Mestre's
        family, delivered by a reviewer at derivation tier with no exhibited-point
        certificate.
      verified_by: >-
        idea-generator session 2026-08-29; FULL goal record read at
        ledger/goals/GOAL-ECQ-002/goal.yaml
    - ref: KN-FIND-e1b836
      provenance: internal
      claim: >-
        Every one of 13391 admissible families of Mestre's rank-12 quartic
        construction carries a multiplicative fibre at T = infinity of type I_4 or
        I_6, so its Shioda-Tate cap is 15 and never 18; the per-family ceiling is
        exactly 18 minus the root-lattice contribution on 13391 of 13391; only
        0.688 percent reach ceiling at least 13. The free pre-filter is one
        resultant on a degree-20 polynomial testing near-squarefreeness of the
        discriminant.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-e1b836.md
    - ref: KN-FIND-91f871
      provenance: internal
      claim: >-
        For an elliptic surface of degree d over P^1, the fibre naive height is
        12 d log|t| + O(1) and Shioda-Tate caps generic rank at 10d - 2, so a
        family of generic rank r has asymptotic height slope at least 1.2(r+2):
        buying generic rank buys a steeper height law. Candidate families should be
        ranked by the MEASURED lower envelope of minimal-model naive height, about
        two seconds and 1e5 fibres per family.
      verified_by: >-
        idea-generator session 2026-08-29; FULL knowledge record read at
        knowledge/findings/KN-FIND-91f871.md
    - ref: "arXiv:0709.2908"
      provenance: retrieved
      claim: >-
        Elkies, "Three lectures on elliptic surfaces and curves of high rank"
        (2007); the abstract page indicates an elliptic K3 surface over Q of
        Mordell-Weil rank 17 in Lecture II. This is the published art that any
        chi = 2 construction must be compared against.
      verified_by: >-
        idea-generator session 2026-08-29, WebFetch of the arXiv ABSTRACT PAGE
        ONLY; the full text was not read.
    - ref: >-
        Shioda, "On the Mordell-Weil lattices", Comment. Math. Univ. St. Pauli 39
        (1990), and the standard splitting of Mordell-Weil under a quadratic base
        change into invariant and anti-invariant (quadratic-twist) summands
      provenance: recalled
      claim: >-
        RECALLED AND LOAD-BEARING FOR THE DERIVATION that the pullback rank equals
        8 + r(D). The design therefore VERIFIES the identity numerically on the
        trivial-twist control and on at least one nontrivial D before any census
        number is reported, rather than relying on the recollection.
      verified_by: null

  assumptions:
    - >-
      D is chosen so that u^2 = D(t) is a conic with a rational point, so the
      double cover has function field Q(u) with u a rational parameter and the base
      change stays over the rational base. For D of degree 1 this is automatic; for
      degree 2 with two rational roots it is automatic. Irrational-root D are
      EXCLUDED from the box and the exclusion is recorded, because they would move
      the base curve.
    - >-
      The eight sections of X are Q-rational (certified) so the invariant summand
      contributes rank 8 over Q(u) and not merely over Qbar(u). Verified once by
      re-substituting the pulled-back sections into Y_D as polynomial identities
      in u.
    - >-
      PARI ellrank at a good specialisation returns an unconditional upper bound
      usable to bound r(D) from above. This is the same instrument EV-ECQ-0d142e
      used for its exceptional-fibre upper bounds and is subject to the same
      timeout behaviour.

  proof_search_map:
    bottleneck: >-
      Base rank 8 is a theorem about the object (Shioda-Tate on a squarefree
      degree-12 discriminant), so the bottleneck is not the search but chi. The
      step whose removal changes the cost is "raise chi from 1 to 2 over Q while
      keeping the eight certified sections". Quadratic base change is the candidate
      removal and r(D) is the quantity that decides whether it pays.
    baseline_embedding:
      parameter_slice: >-
        D a nonzero rational SQUARE (trivial twist). Then Y_D is X pulled back
        along an isomorphism-equivalent cover, the anti-invariant slot contributes
        nothing, and the correct baseline reading is that the construction returns
        the ORIGINAL rank 8 and nothing more. This is the exact old-method
        boundary.
      reproduction_check: >-
        Symbolic. Run the whole pipeline on D = 1 and on D = 4 and require it to
        report base rank exactly 8, with the eight pulled-back sections verified as
        polynomial identities in u. A pipeline that reports more than 8 on a
        trivial twist has a bug that would manufacture the headline result, so this
        check runs FIRST and is a stop condition.
    observation_collision:
      observable: >-
        The integer r(D), obtained as an exhibited-section lower bound together
        with an ellrank upper bound at a good t.
      distinct_preimage_search: >-
        COLLISION FOUND AND IT MATTERS. D and D times the square of any rational
        function give the SAME twist and the same r(D); so do D and c*D for c a
        nonzero rational square, and D(t) and D(at+b) up to the induced change of
        parameter. The census box must therefore be built from canonical
        representatives modulo the affine action on t and modulo squares, or the
        same object is counted many times and the distribution of r(D) is a
        distribution over a multiset with unknown multiplicities. A second, more
        dangerous collision: r(D) as measured is a pair of bounds, and when the two
        disagree the observable is an interval, not an integer -- intervals may not
        be silently collapsed to their lower end.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from "rank of a K3 over Q(u)" to "rank of a quadratic twist family
          over Q(t)", where the hypothesis becomes an exact rank equality with a
          two-sided computable certificate.
        predicted_gain: >-
          Turns an intractable Neron-Severi computation into about 2000 cheap
          ellrank calls plus a bounded section search.
      - transform: boundary_lift
        proposed_object: >-
          The certificate family enlarges from "sections of X" to "sections of X
          together with sections of the D-twist"; the strict inward improvement to
          be proved is r(D) at least 1 for at least one admissible D.
        predicted_gain: >-
          Base rank 8 becomes 8 + r(D) at every specialisation, worth
          exp(beta*r(D)) in sieve volume.
    quantifier_order: >-
      THERE EXISTS D admissible in the declared box SUCH THAT FOR ALL but finitely
      many u in Q, the rank of the specialised fibre over Q is at least 8 + r(D).
      Note the order carefully: the witness D is allowed to depend on the box (it
      is the thing being searched for), but the rank guarantee must then hold
      uniformly in u up to a finite bad set, which is exactly Silverman
      specialisation and is NOT assumed -- the design re-exhibits the 8 + r(D)
      sections on each tested u in exact arithmetic, as EV-ECQ-0d142e OBS-4
      required of its predecessor.
    method_ceiling:
      strongest_certifiable_claim: >-
        Base rank at most 8 + r(D), itself at most 17 over Q, since the geometric
        Shioda-Tate ceiling at chi = 2 is 18 and rank 18 over Q is recorded
        internally as impossible. So THIS ROUTE CANNOT REACH BASE RANK 32 AND
        CANNOT REACH THE GOAL'S TARGET BY BASE RANK ALONE, and no deliverable may
        present it as doing so. Realistically the route competes with Nagao's 13
        and Mestre-Kihara's 14 only if r(D) is at least 6.
      nearby_object_control: >-
        The same procedure applied to a rational elliptic surface of Mordell-Weil
        rank 0 or 1 over Q(t) (a family with many reducible fibres). If the
        distribution of r(D) is indistinguishable there, the measured distribution
        is a property of quadratic twisting in general and NOT of the E8 structure,
        and the framing that this program owns an E8 surface carries no weight.
    proof_obligations:
      - claim: The pullback rank equals 8 + r(D) with the invariant summand Q-rational.
        responsibility: correctness
      - claim: Y_D has chi = 2 for every admissible D in the box, by degree bookkeeping.
        responsibility: size
      - claim: ellrank at a good t is an unconditional upper bound for r(D).
        responsibility: strictness
      - claim: The census box contains canonical representatives only.
        responsibility: scope
      - claim: 2000 twists at the declared budget fit the compute allowance.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: max_r_D over the declared box of at least 2000 canonical admissible D
      direction: higher
      minimum_effect: >-
        at least 2, giving a certified base rank of at least 10 over Q(t) -- the
        first base rank above 8 exhibited inside this repository with an
        exhibited-section certificate. A measured max of 0 over 2000 is the
        pre-declared negative reading and is reportable as such.
    - metric: >-
        fraction of admissible D with r(D) at least 1, relative to the same
        fraction on the rank-0 nearby-object control surface
      direction: higher
      minimum_effect: >-
        ratio at least 3.0 with Fisher exact p below 0.01. A ratio near 1 means the
        E8 structure of the input surface contributes nothing and the framing is
        falsified even if some D with r(D) at least 1 is found.
    - metric: >-
        certified rank over Q at 100 random specialisations u of the best Y_D, by
        exhibited points in exact arithmetic
      direction: higher
      minimum_effect: >-
        at least 8 + max_r_D at 90 or more of the 100 u; anything less means the
        base rank is not actually inherited and the derivation is wrong somewhere
    - metric: >-
        measured lower height envelope of the best Y_D over 1e5 fibres, in the
        KN-FIND-91f871 convention
      direction: higher
      minimum_effect: >-
        reported, not thresholded. The prediction from the slope law is a doubling
        of the asymptotic slope (d going from 1 to 2, slope 12 to 24) and the
        number decides whether the base-rank gain is usable at small parameters or
        is paid back in height
    - metric: trivial_twist_control with D a rational square
      direction: different
      minimum_effect: >-
        exactly 8, never more. Any other value stops the experiment.

  minimal_test:
    design: >-
      STEP 0 (stop-gate, about 15 min). Rebuild X from qt_family.json, re-verify
      the eight sections as polynomial identities over Q(t), then run the whole
      pipeline on the trivial twists D = 1 and D = 4 and require base rank exactly
      8.
      STEP 1 (box construction, about 30 min). Enumerate canonical representatives
      of squarefree D of degree 1 and 2 with rational roots and coefficient height
      at most B, modulo rational squares and the affine action on t; target at
      least 2000 representatives; record the canonicalisation rule and the
      multiplicity of each class.
      STEP 2 (cheap upper bounds, about 3 CPU-hours). For each D, form the twisted
      family and call ellrank at three pre-declared good t values under a 20 s
      alarm; the r(D) upper bound is the minimum returned. Record every timeout as
      an OPERATIONAL censoring event with its coefficient sizes, never as r(D) = 0.
      STEP 3 (lower bounds where the upper bound allows, about 4 CPU-hours). For
      every D whose upper bound is at least 1, search for sections of the twisted
      family of bounded degree by solving the polynomial identity as a linear or
      Groebner system in the unknown coefficients, degree budget declared in
      advance. Exhibit every section found and verify it as an identity over Q(t)
      in exact arithmetic.
      STEP 4 (the nearby-object control, about 3 CPU-hours). Repeat STEP 2 and
      STEP 3 verbatim on a rational elliptic surface of Mordell-Weil rank 0 or 1
      over Q(t) with the same box size, to separate "E8 input" from "quadratic
      twisting".
      STEP 5 (payoff check, about 2 CPU-hours). For the best D, build Y_D over
      Q(u), re-exhibit 8 + r(D) sections, specialise at 100 random u, verify every
      point on the exact curve, and measure the height envelope over 1e5 fibres.
    controls:
      - >-
        TRIVIAL TWIST with D a rational square: must return base rank exactly 8.
        This is the "returns the known value on an object of known answer" control
        that EV-ECQ-0d142e OBS-8 made this program's standard.
      - >-
        NEARBY OBJECT: the same census on a rank-0 or rank-1 rational elliptic
        surface, which isolates whether E8 matters.
      - >-
        SILVERMAN-INHERITANCE CONTROL: on every tested specialisation, re-exhibit
        all 8 + r(D) points on the specialised curve in exact arithmetic. No rank
        is ever inherited from the generic fibre; this is the exact attack the
        validator ran 137 of 137 times in EV-ECQ-0d142e OBS-4.
      - >-
        POINT-FREE-BOUND CONTROL: no D may be reported with r(D) equal to an
        ellrank upper bound unless that many independent sections were actually
        exhibited. Where the bounds disagree the result is an interval.
      - >-
        CENSORING CONTROL: re-run a random 10 percent of the timed-out ellrank
        calls at a 120 s alarm and report how many change, so the censoring rate is
        measured rather than assumed benign. This is the CTRL-1 that EV-ECQ-0d142e
        UC-3 named as the highest-value unrun measurement of its round.
    required_metrics:
      - box size, canonicalisation rule, and per-class multiplicity
      - r(D) as an ORDERED PAIR of exhibited lower bound and ellrank upper bound, per D
      - histogram of r(D) for the treatment surface and for the nearby-object control
      - ellrank timeout count and rate per surface, with coefficient sizes
      - exhibited sections of the best twisted family, verified as identities over Q(t)
      - the 100 specialisation certificates for the best Y_D, exact on-curve verified
      - measured lower height envelope of the best Y_D over 1e5 fibres
      - wall clock and peak RSS per step

  falsification_conditions:
    - >-
      If the trivial-twist control returns anything other than base rank 8, the
      pipeline is wrong and no census number may be reported.
    - >-
      If max r(D) = 0 across at least 2000 canonical admissible D at an ellrank
      censoring rate below 20 percent, the lever is falsified IN THAT BOX ON THIS
      SURFACE. That is a scoped negative with a number, and it is a legitimate
      deliverable.
    - >-
      If the fraction of D with r(D) at least 1 on the E8 surface is within a
      factor 1.5 of the rank-0 control, the premise that this program owns a
      privileged E8 surface contributes nothing and must not be repeated in any
      downstream record.
    - >-
      If a Y_D with claimed base rank 8 + r(D) fails to yield 8 + r(D) exhibited
      independent points at more than 10 of 100 random specialisations, the
      derivation is wrong as implemented.
    - >-
      If the ellrank censoring rate exceeds 20 percent the census is CENSORED and
      the histogram is reported as a lower bound only, never as a distribution.

  confounders:
    - >-
      CENSORING BY COEFFICIENT SIZE. EV-ECQ-0d142e measured a Spearman correlation
      of +0.765 between log of the absolute a6 and timeout. Twisting by D of degree
      2 multiplies coefficient sizes and therefore pushes DIRECTLY into the
      censoring regime, and larger D means both larger coefficients and perhaps
      different r(D). Controlled by reporting r(D) against coefficient size, by the
      120 s re-run subsample, and by never recording a timeout as r(D) = 0.
    - >-
      MULTIPLICITY IN THE BOX. Without canonical representatives the same twist is
      counted many times and the histogram is meaningless. Controlled by publishing
      the canonicalisation rule and per-class multiplicities.
    - >-
      HEIGHT PAYBACK. KN-FIND-91f871 predicts the height slope doubles from 12 to
      24 when d goes from 1 to 2, so base rank bought here is partly paid back in
      fibre height, which is itself correlated with lower excess and with
      censoring. Measured explicitly in STEP 5 rather than assumed away; this is
      the same effect that IDEA-20260829-1348a3 is designed to quantify.
    - >-
      SELECTION ON THE UPPER BOUND. STEP 3 only searches for sections where the
      upper bound allows it, so any reported lower-bound histogram is conditioned
      on the upper-bound instrument. Reported as a conditional distribution with
      its conditioning denominator, following EV-ECQ-0d142e boundary B-5.

  interpretation_limits:
    - >-
      THIS ROUTE CANNOT REACH RANK 32 BY BASE RANK. Its ceiling is 8 + r(D), at
      most 17 over Q. Reaching 32 from a base of, say, 11 would require an excess
      of +21 from a single specialisation, and the largest excess this program has
      ever observed is +4. Nothing here is progress toward GOAL-ECQ-e72c0b's
      completion criteria unless a specialisation with 32 certified independent
      points is exhibited.
    - >-
      Even a successful r(D) = 4 leaves base rank 12, which is DOMINATED by
      published art (Nagao 13, Mestre-Kihara 14, Elkies 18 over Q(t) and a rank-17
      elliptic K3 over Q). The result would be an in-repo capability, not a record.
    - >-
      Scoped to this one pencil, this one box of D, PARI's ellrank at the declared
      alarms, and canonical representatives under the declared rule. It bounds no
      other surface and no other box.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (TWIST-RANK DISTRIBUTION.) Over canonical squarefree D of degree 1 or 2
        with rational roots and coefficient height at most B, the rank r(D) of the
        quadratic twist family behaves like the rank of a random elliptic surface
        of arithmetic genus 2 subject to its parity constraint: the probability
        that r(D) is at least k decays at least geometrically in k, with the
        probability that r(D) is at least 1 bounded below by a constant depending
        on the surface and not on B in the measured range.
      rigorous_support: >-
        RIGOROUS PART: the exact splitting giving pullback rank 8 + r(D) and the
        two-sided computability of r(D) (exhibited sections below, unconditional
        ellrank at a good fibre above), plus the hard Shioda-Tate ceiling of 10
        geometric and 9 over Q for r(D). DISTRIBUTION IMITATED: the classical
        Goldfeld and minimalist picture for ranks in quadratic twist families, in
        which rank is 0 or 1 for density one and higher ranks have rapidly decaying
        density. NOTHING HERE IS ASSERTED AS PROVED; the heuristic is that a family
        of twists of a FUNCTION-FIELD surface follows the same qualitative shape as
        the classical number-field picture.
      validation_plan: >-
        Sample: the full declared box of at least 2000 canonical D, with r(D)
        measured two-sidedly, plus the identical box on the rank-0 or rank-1
        nearby-object surface. Shortcut making this feasible: r(D) is bounded above
        by ONE ellrank call at a good specialisation, four orders of magnitude
        cheaper than a Neron-Severi computation. Compare: the empirical probability
        that r(D) is at least k for k = 1, 2, 3 against a fitted geometric law, and
        against the control surface's empirical law. Tail check: the largest
        observed r(D) against the fitted law's prediction for a box of that size,
        exactly as a smoothest-sample check. Report the parity split (even versus
        odd r(D)) since a distribution that ignores the parity constraint is
        misspecified. TRANSFER ASSUMPTION, STATED: nothing measured in this box
        transfers to larger B, to higher-degree D, to other surfaces, or to the
        chi = 2 going to chi = 4 case that IDEA-20260824-b26635 asks about; that
        last transfer is the one a reader will want to make and it is explicitly
        not licensed.
    - id: H2
      statement: >-
        (UPPER-BOUND TIGHTNESS.) For at least 80 percent of D with a
        non-timing-out ellrank call at the three declared good t, the returned
        upper bound equals the rank of the twist family, so the ordered pair of
        bounds collapses to an integer.
      rigorous_support: >-
        Specialisation injectivity for all but finitely many t makes the ellrank
        value at a good t an unconditional UPPER bound; the heuristic content is
        only that a good t exists among three declared choices and that the fibre's
        own excess is zero there. Imitates the empirical regime EV-ECQ-0d142e
        measured, where certified rank equalled the low and high ellrank bounds on
        all 54 completed descents.
      validation_plan: >-
        Sample: all D reaching STEP 3. Compare: the collapse rate, that is the
        fraction with equal lower and upper bounds, against the 80 percent
        prediction, stratified by coefficient size. Tail check: report every D where
        the interval stays open and its width; an open interval is published as an
        interval and never as its lower end. If the collapse rate falls below 50
        percent, H2 is falsified and every r(D) in the census becomes an interval,
        which weakens but does not void the distributional reading.

  target_complexity:
    time_exponent: >-
      NO COMPLEXITY EXPONENT IS MOVED. What moves is the campaign's own search
      exponent: with V(R) = exp(beta*(R - r_base)) fibres to certify for target
      rank R from base r_base, raising r_base by r(D) divides the required volume
      by exp(beta*r(D)). beta is NOT MEASURED by this program (that is
      IDEA-20260829-1348a3 and IDEA-20260824-95d8d8), so the payoff is stated as a
      formula with an unmeasured constant, which is the honest form.
    memory_exponent: >-
      Negligible and flat: about 2000 independent ellrank calls plus a bounded
      Groebner section search. Peak RSS budgeted at 2 GB, comparable to the 1.22 GB
      the predecessor campaign measured.
    best_known: >-
      Generic rank over Q(t): 18 (Elkies 2006, standing 20 years); an elliptic K3
      over Q of Mordell-Weil rank 17; Nagao 13 (1994); Mestre-Kihara 14 (2000-1);
      Mestre 11-12 (1991). In-repo certified best base rank: 8, with a proven
      ceiling of 8; the Mestre quartic construction in-repo is capped at 15 by
      measurement over 13391 families.
    hidden_overhead: >-
      Two things hide here and both are named. (1) The height payback: chi = 2
      doubles the asymptotic height slope, so the same parameter box yields much
      larger fibres and therefore more censoring and probably less excess -- the
      base-rank gain is NOT free even though the rank arithmetic makes it look
      free. (2) The census is conditioned on a timing-out upper-bound instrument,
      so any histogram is a censored one.
    tradeoff_note: >-
      Not a time-memory problem. The real trade is BOX WIDTH against CENSORING
      RATE: larger D reaches more twists but pushes coefficients into the regime
      where ellrank returns nothing, and a censored census is not a distribution.
      The declared box is chosen to keep the censoring rate below 20 percent and
      that threshold, not the box size, is the stopping rule.

  dominated_by: >-
    DOMINATED ON THE HEADLINE AXIS, STATED FIRST. On base rank over Q(t) this
    proposal's CEILING is 8 + r(D), at most 17, and its realistic outcome is 8 to
    12. Every one of the following published results dominates that outcome unless
    r(D) is at least 6: Elkies' generic rank 18 over Q(t) (2006); the elliptic K3
    over Q of Mordell-Weil rank 17; Mestre-Kihara 14; Nagao 13. It is also
    dominated by IDEA-20260824-b26635 on ambition, since the same mechanism applied
    at chi = 2 reaches chi = 4 with a ceiling of 38 minus the root-lattice
    contribution rather than 18 -- b26635 is strictly better IF its input ever
    becomes available, and it currently is not. Frontier rows checked across time,
    memory and data: published-family substitution (dominates on rank, loses on
    availability and on in-repo certification); Mestre-quartic families in repo
    (dominate on rank at 11-12, lose on ceiling at 15 and on the 0.688 percent
    density of the high-ceiling stratum measured in KN-FIND-e1b836); more sieving
    of X (dominated in advance and excluded by the research question). On the axes
    of "executable this week with a content-hashed in-repo input and an
    exhibited-section certificate", no row dominates it.
  sota_delta: >-
    QUANTITATIVELY. Against this program's own certified base rank: 8 becomes
    8 + r(D), that is +2 in the minimum-effect case, worth a factor exp(2*beta) in
    required sieve volume with beta unmeasured. Against published art on base rank
    over Q(t): 8 + r(D) - 18 = r(D) - 10, that is NEGATIVE for every attainable
    r(D), so the delta versus the world is at best -1 (if r(D) hit its Q-ceiling of
    9) and realistically -6 to -8. Against GOAL-ECQ-e72c0b's target of rank 32 over
    Q: no delta at all without a specialisation certificate, and the ceiling
    argument above shows the route cannot close the gap by base rank.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation reuses the predecessor's build_family, specialise and
      certify_rank paths plus a new twist constructor, a canonicalisation routine
      and a bounded-degree section solver. Compute is roughly 12 to 15 CPU-hours
      across five steps at the declared alarms, with STEP 2 and STEP 4 dominating;
      it fits comfortably inside a single batch at max_concurrent 1.

  recommended_priority: high
