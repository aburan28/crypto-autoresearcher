  assumptions:
    - >-
      The a-invariants of the rank-28 curve and of ICARM no. 273 are available in this
      repository. DEC-20260824-b7557b L3 records computed log|disc| and naive heights for both,
      which implies the a-invariants exist in
      coordination/goals/GOAL-ECQ-2298dc/inputs/RETRIEVAL-elkies-rank17.md; that file was NOT
      opened by this session and its content is an assumption checked in step 0. If only
      no. 302's invariants are available the design runs the calibration and reports that the
      record arm needs one further input.
    - >-
      Those invariants passed through a retrieval tool documented at DEC-20260824-b7557b L4 and
      L5 as silently dropping exponents. Every record-curve row is therefore run through the
      transcription-identity check first -- the curve's own listed point must satisfy the
      transcribed model identically in exact arithmetic, which L3's basis records was done for
      the rank-28 curve via its listed point P1 -- and a row that fails is excluded, not
      adjusted.
    - >-
      Trial division of a 450-decimal-digit discriminant by all primes up to B = 100000 is
      affordable. This is arithmetic on integers this program already holds and is checked by
      timing in step 0; it is expected to cost well under a second per curve.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the campaign's DECISION rather than its cost:
      deciding whether the published ladder is base-limited or search-limited. RQ-ECQ-e9b361's
      decision_target is exactly that choice, and lane L3 measured that nothing computable from
      the record curves alone decides it -- 0 of 2 statistics. Every route that would decide it
      otherwise passes through the unpublished fibration (L4, 0 of 5 sources). Removing the
      bottleneck means finding a statistic whose confound is structurally absent rather than
      argued away.
    baseline_embedding:
      parameter_slice: >-
        The two statistics lane L3 already ran, on the same three curves: the pairwise
        quadratic-twist test and the small-prime discriminant multiplicity vector. Those are the
        exact old-method boundary and this design REPRODUCES BOTH as its first act, on the same
        inputs, so the new statistic is compared against them under one accounting rather than
        against a description of them.
      reproduction_check: >-
        Frozen fixture from a committed record. Recompute log|disc| and the naive height for
        each of the three record curves and require agreement with L3's 381.2024 / 432.1249 /
        453.0469 and 393.6297 / 442.0854 / 468.2771 to 4 decimal places; recompute the
        small-prime multiplicities and require exact agreement with p=2 -> 15/16/15,
        p=3 -> 6/12/4, p=5 -> 6/8/4, p=7 -> 4/5/6, p=13 -> 4/5/5; and re-run the pairwise
        quadratic-twist test and require NEGATIVE on all three pairs. A pipeline that cannot
        reproduce an orchestrating-session computation may not extend it -- and note that L3's
        figures have NO COMMITTED RUN RECORD, so this reproduction is also the first
        independent check those numbers have ever had, which is worth the step on its own.
    observation_collision:
      observable: >-
        The exceptional profile P(E, B), a multiset over four twist-classes, and the pairwise
        profile distance between curves.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IS EXHIBITED IN ADVANCE, AND BOUNDS THE CLAIM. Two DIFFERENT
        families can produce identical profiles -- trivially, any two families whose Res(c4, c6)
        has no prime below B carrying an exceptional type both produce the EMPTY profile, and
        the empty profile is the single most likely observation for a family with squarefree
        discriminant and all fibres I_1. So the statistic is one-sided: a profile MISMATCH is
        evidence against a common family, while a profile MATCH is evidence for it only in
        proportion to the measured power, and an empty-versus-empty match is no evidence at
        all. The design therefore reports the EMPTY-PROFILE RATE on the ground-truth classes
        before anything else, and if the record curves' profiles are all empty the correct
        report is "the statistic does not apply to these curves", which is a fourth distinct
        outcome and is written into the falsification conditions rather than discovered later.
        A SECOND COLLISION: a curve submitted to the board may have been minimalised or twisted
        by its finder in a way that alters the model but not the class; the twist-class quotient
        handles quadratic twist and the design's minimality screen handles the rest, PARTIALLY
        and labelled partial, exactly as DEC-20260824-b7557b E3 requires.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the local data fixed and quotient by the group that acts on it -- quadratic
          twist -- so what remains is a genuine invariant of the object the hypothesis is about
          (the family up to twist) rather than of the representative that reached the board.
        predicted_gain: >-
          A statistic that is stable under the exact operation the standing hypothesis
          (IDEA-20260824-155411) allows, where lane L3's pairwise twist test was consumed by it.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the reduction TYPE at p rather than the discriminant VALUATION at p, which is
          all L3 carried. The type is strictly finer and, unlike the valuation, is not the
          quantity a rank sieve optimises.
        predicted_gain: >-
          Separates the two mechanisms L3 recorded as inseparable, because the confound acts on
          which primes are bad and the new invariant is computed after conditioning on that.
      - transform: representation_reduction
        proposed_object: >-
          Replace "is there a rational t0 with j_E(t0) = j(no. 302)", which requires the j-map,
          by "do these curves' local type multisets agree", which requires only their
          a-invariants.
        predicted_gain: >-
          Removes the unavailable input that closed lanes L3 and L4, at the cost of a weaker
          conclusion whose weakness is measured rather than assumed.
    quantifier_order: >-
      FROZEN BEFORE THE RECORD CURVES ARE TOUCHED. FOR ALL pairs (E1, E2) in the declared
      ground-truth set and FOR the frozen bound B and the frozen distance d(.,.) on profiles,
      THERE EXISTS a threshold tau, chosen ONLY on the ground-truth set, such that
      d(P(E1), P(E2)) < tau classifies same-family with the measured true-positive and
      false-positive rates reported. B, d and tau are NOT allowed to depend on the record
      curves and are frozen in the contract; the record arm is a SINGLE evaluation at the
      frozen tau with no retuning. Any adjustment of B, d or tau after the record curves are
      seen voids the measurement, and the coverage figures are reported as numerator over
      denominator with denominators recorded first, per RQ-ECQ-e9b361's constraints.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The exceptional profiles of these curves are consistent (or inconsistent) with a
        common family, at a measured true-positive rate and false-positive rate calibrated on
        in-repo families of known identity." That is a classification statement with error
        rates. It is NEVER an identification of a family, NEVER a proof that the ladder rungs
        share a base, NEVER a rank statement, and NEVER usable to reconstruct a model. Even a
        perfect match would leave the base rank behind the record unmeasured, which is
        IDEA-20260829-02418a's question and not this one's.
      nearby_object_control: >-
        The closest object where the desired conclusion must FAIL: two specialisations of
        DIFFERENT Mestre families from KN-FIND-e1b836's census with deliberately different
        reducible-finite-fibre counts, at matched coefficient size. The classifier must call
        those different-family. If it calls everything same-family, its true-positive rate is
        an artifact of a degenerate statistic and the AUC will show it.
    proof_obligations:
      - claim: The three published statistics of lane L3 are reproduced exactly before any new one is computed.
        responsibility: baseline
      - claim: The profile is invariant under quadratic twist, verified empirically on in-repo curves.
        responsibility: correctness
      - claim: Every exceptional prime observed on the pencil's fibres divides its resultant of c4 and c6.
        responsibility: correctness
      - claim: B, the distance and the threshold are frozen before the record curves are evaluated.
        responsibility: scope
      - claim: The classifier AUC and empty-profile rate are measured on ground truth first.
        responsibility: success_probability
      - claim: Trial division and Tate's algorithm at B = 100000 on 450-digit discriminants fit the budget.
        responsibility: runtime
    not_applicable_reason: null

  predictions:
    - metric: >-
        L3_reproduction -- agreement of recomputed log|disc|, naive height and small-prime
        discriminant multiplicities with the values recorded in DEC-20260824-b7557b lane L3 for
        the three record curves
      direction: different
      minimum_effect: >-
        log|disc| and naive height to 4 decimal places, multiplicities exactly, pairwise
        quadratic-twist test negative on all three pairs. Any disagreement is reported as a
        discrepancy against a committed record and stops the new statistic.
    - metric: >-
        twist_invariance -- change in the exceptional profile of an in-repo certified fibre
        under quadratic twist by each of at least 8 declared squarefree d
      direction: different
      minimum_effect: >-
        exactly zero change, on 8 of 8. Any change falsifies the object's defining property and
        stops the experiment.
    - metric: >-
        resultant_containment -- fraction of exceptional primes observed across the 137
        certified fibres of the pencil that divide the family's resultant of c4 and c6
      direction: higher
      minimum_effect: >-
        1.00, that is all of them. A counterexample falsifies the candidate-prime-set argument
        and the sieve-independence claim that rests on it.
    - metric: >-
        classifier_AUC -- area under the ROC curve for same-family versus different-family on
        the in-repo ground-truth pairs at B = 100000, with the positive class drawn from the
        137 pencil fibres and Mestre same-tuple pairs and the negative class from
        different-tuple Mestre pairs
      direction: higher
      minimum_effect: >-
        at least 0.80. AUC below 0.80 is the pre-declared "no power" reading: the statistic
        does not separate at this scale, lane L3's measured count moves from 0 of 2 to 0 of 3,
        and NO reading of the record curves may be reported.
    - metric: >-
        empty_profile_rate -- fraction of ground-truth curves whose exceptional profile is
        empty at B = 100000
      direction: lower
      minimum_effect: >-
        at most 0.5. Above that the statistic is mostly undefined and the AUC is being carried
        by a minority of curves; reported as a stratified AUC on the non-empty subset with its
        own denominator, and the empty subset reported separately as inconclusive.
    - metric: >-
        record_reading -- the same-family versus different-family call on the three pairs among
        the rank-28 curve, ICARM no. 273 and no. 302, at the FROZEN threshold, one evaluation
      direction: different
      minimum_effect: >-
        reported as three pairwise calls with the frozen true-positive and false-positive rates
        attached, or as "profiles empty, statistic inapplicable" if that is what the data says.
        BASE-LIMITED reading: all three pairs called same-family, which says the ladder from 28
        to 31 sits on one object and the 2026 jumps were bought with search, so the campaign's
        base-rank lever is aimed at the right quantity and its value is exactly what obtaining
        that one object would buy. SEARCH-LIMITED-BY-NEW-OBJECTS reading: at least one pair
        called different-family, which says the 2026 jumps came from new bases and reprices what
        any single family is worth.

  minimal_test:
    design: >-
      STEP 0 (input audit and freeze, about 2 h, negligible compute). Open
      coordination/goals/GOAL-ECQ-2298dc/inputs/RETRIEVAL-elkies-rank17.md and record which
      a-invariants it actually carries and with what provenance; re-read ICARM-302.json's
      `_provenance` field as the goal record instructs. Run the transcription-identity check on
      every record curve that has a listed point. FREEZE B = 100000, the profile distance, the
      threshold-selection rule, the ground-truth pair sets and their denominators, in a
      committed contract, BEFORE anything is computed on the record curves.
      STEP 1 (reproduction gate, about 30 min). Recompute L3's three statistics on the record
      curves and require agreement. STOP CONDITION, and also the first independent check those
      committed numbers have had.
      STEP 2 (object validation, about 1 CPU-hour). On in-repo certified fibres: verify twist
      invariance of the profile under at least 8 declared squarefree d; verify that every
      observed exceptional prime divides the family's exactly computed resultant of c4 and c6;
      report the empty-profile rate. STOP CONDITIONS on the first two.
      STEP 3 (power calibration, about 3 CPU-hours). Build the ground-truth pair sets --
      positives from the 137 pencil fibres and from same-tuple Mestre specialisations,
      negatives from different-tuple Mestre specialisations at matched coefficient size, with
      denominators recorded first -- compute profiles, and report the ROC curve, the AUC, and
      the threshold tau selected ON GROUND TRUTH ONLY. If AUC is below 0.80 the experiment ENDS
      HERE with the "0 of 3" result and the record curves are never evaluated.
      STEP 4 (the single evaluation, about 30 min). Compute the profiles of the three record
      curves and report the three pairwise calls at the frozen tau with the frozen error rates.
      ONE EVALUATION, NO RETUNING.
      STEP 5 (sieve-bias control, about 2 CPU-hours). Reproduce the confound L3 named: take the
      in-repo Mestre-Nagao-scored candidate pool, split it into top-scoring and bottom-scoring
      arms, and show that the exceptional profile distribution does NOT differ between arms
      while the small-prime discriminant multiplicity distribution DOES. That is the direct
      measurement of the claim that this statistic is sieve-independent where L3's was not, and
      a failure here voids the whole framing even if the AUC is high.
    controls:
      - >-
        REPRODUCTION CONTROL: L3's three committed statistics must come back. If they do not,
        nothing else runs, and the discrepancy is itself reportable against a record with no
        run behind it.
      - >-
        TWIST-INVARIANCE CONTROL: the profile must not change under quadratic twist by 8
        declared d. This is the object's defining property and is verified, not assumed.
      - >-
        RESULTANT-CONTAINMENT CONTROL: every exceptional prime on the pencil's fibres must
        divide its resultant of c4 and c6. This is the derivation the sieve-independence claim
        rests on.
      - >-
        SIEVE-BIAS CONTROL, THE LOAD-BEARING ONE: top-scoring versus bottom-scoring arms of the
        same Mestre-Nagao pool. The new statistic must be flat across arms and the old one must
        not. Without this the proposal is only an argument that the confound is absent.
      - >-
        NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL: pairs of specialisations of DIFFERENT
        Mestre families with different reducible-finite-fibre counts. Must be called
        different-family.
      - >-
        NULL PAIRS: two curves of unrelated provenance at matched size -- for instance a
        Cremona-table curve and a random small-coefficient curve. Must be called
        different-family, and if they are called same-family the threshold is too loose.
      - >-
        EMPTY-SUPPORT CONTROL: a curve of squarefree discriminant with no exceptional primes
        must return an EMPTY profile and the pipeline must report "inapplicable" rather than a
        distance of zero.
    required_metrics:
      - the input audit: which a-invariants exist, with provenance, and transcription-identity outcomes
      - recomputed L3 statistics against the committed values, per curve
      - profile before and after twist, per d, per test fibre
      - the pencil's resultant of c4 and c6, and the containment fraction for observed exceptional primes
      - ground-truth pair counts per class, recorded before any profile is computed
      - ROC curve, AUC, selected tau, and the true-positive and false-positive rates at tau
      - empty-profile rate overall and per class, with denominators
      - the three record pairwise calls at the frozen tau, with the frozen error rates attached
      - sieve-bias control: profile distribution and small-prime multiplicity distribution per arm
      - wall clock, peak RSS, and confirmation that no floating point entered any type determination

  falsification_conditions:
    - >-
      If L3's committed statistics are not reproduced, no new statistic may be reported and the
      discrepancy is the result.
    - >-
      If the exceptional profile CHANGES under quadratic twist on any of the 8 declared d, the
      object is not what this record defines and the idea is falsified outright.
    - >-
      If any exceptional prime observed on the pencil's fibres fails to divide the resultant of
      c4 and c6, the candidate-prime-set derivation is wrong and the sieve-independence claim
      built on it must be withdrawn.
    - >-
      If the ground-truth AUC is below 0.80, the statistic has no power at this scale, the
      record curves are NOT evaluated, and the reported result is that lane L3's count moves
      from 0 of 2 to 0 of 3 with the third statistic named and its failure mechanism recorded.
    - >-
      If the sieve-bias control shows the exceptional profile distribution DIFFERING between
      top-scoring and bottom-scoring arms, the statistic is confounded in the same way L3's was
      and no record reading may be reported regardless of AUC.
    - >-
      If all three record curves return empty profiles, the correct report is "statistic
      inapplicable to these curves at B = 100000", not "same family". This is written down
      before the data is seen precisely because it is the most likely single outcome.
    - >-
      A trial-division timeout, a Tate's-algorithm failure at a prime, or an input file that
      does not exist are OPERATIONAL conditions under AGENTS.md rule 3 and are never evidence
      about family membership.

  confounders:
    - >-
      MINIMALITY OF THE SUBMITTED MODEL. Reduction type is read from a minimal model, and
      DEC-20260824-b7557b E3 records that establishing minimality at record scale requires
      factoring discriminants of roughly 450 to 900 decimal digits and is UNSATISFIABLE as a
      flat requirement. Controlled with the three-tier rule that amendment installed: a PARTIAL
      screen labelled partial on every row, with the primes actually screened listed, and the
      profile computed only at primes where minimality was established. A profile computed at
      an unscreened prime is reported separately and never merged.
    - >-
      TRANSCRIPTION. Every record-curve a-invariant reached this program through a tool
      documented to drop exponents. A dropped exponent changes the discriminant and therefore
      every reduction type. Controlled by the transcription-identity check as a gate, and by
      excluding rather than adjusting any row that fails it.
    - >-
      SIEVE BIAS, WHICH IS THE CONFOUND THIS PROPOSAL CLAIMS TO ESCAPE AND THEREFORE THE ONE
      MOST DANGEROUS TO ASSUME AWAY. The argument is structural -- the sieve optimises a sum
      over p of a_p log p / p, which acts on multiplicative reduction, while the profile keeps
      only non-multiplicative types -- but an argument is not a measurement, which is why
      STEP 5 measures it directly on this program's own scored pool.
    - >-
      SMALL SUPPORT. If a family's resultant of c4 and c6 is smooth and small, its profile may
      be a single symbol, and a match on a single symbol carries almost no information. Reported
      as the profile SIZE alongside every call, and calls resting on a profile of size at most 1
      are labelled low-information regardless of the threshold.
    - >-
      THE GROUND TRUTH IS NOT THE TARGET. The calibration families are chi = 1 and chi = 2
      objects with coefficients of tens of digits; the record curves are unknown-chi objects
      with coefficients of 66 and 100 digits. Whether the classifier's power transfers across
      that gap is NOT measured by anything in this design, and the AUC is reported as measured
      on the calibration set only.
    - >-
      L3's OWN NUMBERS HAVE NO RUN RECORD. The reproduction gate is therefore comparing against
      an unreplicated computation. A disagreement does not automatically mean this pipeline is
      wrong, and the design reports both values rather than declaring a winner.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (SIEVE-ORTHOGONALITY OF THE EXCEPTIONAL PROFILE.) For candidate specialisations drawn
        from one family and scored by a Mestre-Nagao statistic S(N) = sum over p at most N of
        a_p(E_t) log p / p, the conditional distribution of the exceptional profile P(E_t, B)
        given the score decile is the same in every decile: the absolute difference in the
        expected profile size between the top and bottom deciles is at most 0.2 symbols, while
        the corresponding difference in the mean number of small primes dividing the
        discriminant is at least 1.0.
      rigorous_support: >-
        STRUCTURAL FACT (a derivation, checked in the design rather than cited): additive
        reduction at p forces p to divide both c4(t) and c6(t), hence p divides the family
        constant Res(c4, c6) up to leading-coefficient degeneracies, so the SET of primes
        available to the profile is fixed by the family and is not a function of t at all;
        whereas the number of small primes dividing the discriminant varies with t and is
        exactly what the score rewards. DISTRIBUTION IMITATED: the standard picture in which a
        rank sieve selects for split multiplicative reduction and large a_p at good primes,
        which is the same BSD-flavoured mechanism EV-ECQ-0d142e measured with a per-rank score
        shift matching sum over p at most 1000 of log p / p = 5.6095 to within 6 percent. THE
        HEURISTIC CONTENT is only that the residual dependence of the additive part on the
        score is small, and that is exactly what STEP 5 measures.
      validation_plan: >-
        Sample: the in-repo Mestre-Nagao-scored candidate pool -- 97,640 specialisations scored
        at 1.028 ms each in the pencil batch, plus the 34,740 scanned Mestre curves -- binned
        into score deciles with at least 200 curves per decile, denominators recorded first.
        Shortcut making this feasible: the scores are already committed, and the profile costs
        one trial-division pass per curve, so no new scoring and no descent is required.
        Compare: the mean profile size and the profile class distribution per decile against
        the flat prediction, and the mean small-prime discriminant divisor count per decile
        against the increasing prediction, with a Fisher exact or chi-squared test on the class
        distribution across deciles. Tail check: the TOP decile is where a sieve-driven effect
        must appear if it exists at all, so report the top decile against the pooled remainder
        separately and with its own p-value. If the top-versus-bottom profile difference exceeds
        0.2 symbols, H1 is FALSIFIED, the statistic is confounded exactly as L3's was, and the
        record arm does not run. TRANSFER ASSUMPTION, STATED: orthogonality measured on a
        chi = 1 pencil and on chi = 2 Mestre families, at coefficients of tens of digits, is not
        licensed to transfer to whatever sieve produced the record curves at 100 digits, and
        every record-arm call carries that untested transfer.
    - id: H2
      statement: >-
        (PROFILE INFORMATIVENESS AT RECORD SCALE.) For families of the kind that produce
        rank-28-and-above specialisations, the exceptional profile at B = 100000 is NON-EMPTY
        with probability at least 0.5, so the statistic is defined on at least half the
        relevant curves.
      rigorous_support: >-
        RIGOROUS PART: none. This is a genuine empirical unknown and it is the assumption most
        likely to be false -- a family with squarefree discriminant and all fibres I_1, which is
        exactly the shape of the pencil this program certified, has a small resultant of c4 and
        c6 and may produce empty profiles for every specialisation. WHAT MAKES IT PLAUSIBLE at
        record scale is the opposite fact: KN-FIND-e1b836 measured that every one of 13,391
        Mestre families carries a multiplicative fibre of type I_4 or I_6 at infinity and that
        reducible finite fibres are what varies between tuples, so higher-rank constructions in
        this program's experience are NOT the all-I_1 shape. Whether the record families are is
        unknown.
      validation_plan: >-
        Sample: all 137 pencil fibres and at least 500 specialisations drawn across at least 20
        distinct Mestre tuples spanning the measured ceiling range, including several from the
        90-family stratum of geometric ceiling at least 13. Compare: the empty-profile rate per
        family class against the 0.5 prediction, and the profile size distribution against the
        number of reducible finite fibres each family is already known to have from
        KN-FIND-e1b836's census -- a positive association there would be direct evidence the
        profile is reading fibre structure and not noise. Tail check: report the empty-profile
        rate for the families with the HIGHEST reducible-fibre counts separately, since those
        are the closest in shape to a high-rank base, and report the largest profile observed.
        If the empty rate exceeds 0.5, the AUC is reported on the non-empty stratum only, with
        its denominator, and the headline is scoped to that stratum. TRANSFER ASSUMPTION,
        STATED: nothing about empty rates on chi = 1 and chi = 2 families transfers to the
        record curves, whose chi is unknown to this program.

  target_complexity:
    time_exponent: >-
      NO ALGORITHMIC OR CRYPTOGRAPHIC EXPONENT IS CLAIMED OR MOVED, AND THE CONTRAST IS THE
      POINT. The alternative route to the same decision -- IDEA-20260824-155411's j-map match --
      requires the rank-17 fibration, which lane L4 measured as present in 0 of 5 named sources
      and which resume condition R1 makes contingent on a human sending an email. Its cost is
      therefore not large, it is UNDEFINED. This statistic costs one trial-division pass to
      B = 100000 over a 450-digit integer plus Tate's algorithm at the surviving primes, which
      is O(pi(B)) big-integer divisions per curve, roughly 10^4 operations on 1500-bit numbers,
      well under a second per curve on this class of box.
    memory_exponent: >-
      Negligible and flat: a prime list to 100000 and a handful of big integers per curve.
      Budget 1 GB peak RSS; expected orders of magnitude below.
    best_known: >-
      FOR THE QUESTION "are the ladder rungs specialisations of one family", the best known
      method is the j-map match, which is exact and requires an object this program does not
      have. IN THIS REPOSITORY the state of the art is lane L3's measured 0 of 2 statistics,
      from an orchestrating-session computation with no committed run record. This record
      proposes the third statistic and, unlike the first two, measures its power before using
      it.
    hidden_overhead: >-
      Three disclosures. (1) The statistic is ONE-SIDED: a mismatch is evidence against a
      common family, a match is evidence for it only in proportion to a measured AUC, and an
      empty-versus-empty match is no evidence at all. (2) The power is calibrated on chi = 1
      and chi = 2 families at tens of digits and applied to unknown-chi curves at 100 digits;
      that transfer is unmeasured and is the largest unquantified step. (3) The comparison
      baseline, L3's own figures, has never been independently reproduced, so the reproduction
      gate may itself produce a discrepancy that has nothing to do with this statistic.
    tradeoff_note: >-
      Not a time-memory problem. The real trade is B against POWER: a larger prime bound admits
      more primes into the profile and reduces the empty rate at linear cost, but B must be
      frozen before the record curves are evaluated or the threshold becomes a function of the
      outcome. B is therefore chosen on the ground-truth set alone and frozen, and any later
      wish for a larger B requires a new contract and a new evaluation, reported as such.
      Trivially parallel over curves and irrelevant at this scale.

  dominated_by: >-
    FRONTIER ROWS CHECKED ACROSS TIME, MEMORY AND DATA. (1) OBTAINING THE FIBRATION DOMINATES
    ENTIRELY -- resume condition R1's email, or any publication of the model -- because a j-map
    match is exact where this is statistical, and it is blocked on an action this program cannot
    take. (2) IDEA-20260824-155411 dominates on the strength of its conclusion (it would
    identify the family, not merely test consistency) and is dominated on input availability by
    the same measured 0 of 5. (3) IDEA-20260829-02418a, on the sibling question, dominates on
    what it delivers -- an estimate of the BASE RANK behind curve 302, which is the number
    RQ-ECQ-e9b361's decision target actually wants -- while costing roughly five CPU-hours
    against this record's seven and carrying a larger unquantified transfer; the two are
    complementary readings of the same curves and neither dominates the other outright. (4)
    IDEA-20260824-324dca dominates on the local-data machinery it would build, which this record
    would reuse rather than duplicate, and answers a different question (yield within a family).
    (5) Simply asking the record's authors dominates everything and is a human action. On the
    axis this record competes on -- a family-membership statistic computable from the record
    curves ALONE, with its power measured on in-repo ground truth and its confound measured
    rather than argued -- no row in this repository dominates it, and lane L3's own
    remaining_open field records the inverse problem as still open.
  sota_delta: >-
    QUANTITATIVELY. Delta on rank over Q: ZERO. Delta on the world record: ZERO -- rank at least
    31 over Q is a live claimed record held by others and this record treats those curves purely
    as data. Delta on any complexity exponent: ZERO. WHAT MOVES IS LANE L3's OWN MEASURED
    QUANTITY: "number of statistics computable from the record curves alone that separate common
    fibration from search bias" currently stands at 0 of 2 attempted, from an unreplicated
    orchestrating-session computation. After this experiment it stands at either 1 of 3 -- with
    a measured AUC, a frozen threshold, a measured sieve-orthogonality contrast and three
    pairwise calls carrying explicit error rates -- or at 0 of 3, with the third statistic named,
    its failure mechanism recorded (no power, or empty profiles, or a sieve dependence measured
    rather than argued), and the closure standard of docs/inventor-protocol.md section 4 met by
    an obstruction with a number instead of a count of attempts. Either way L3's figures get
    their first independent reproduction. Estimated cost roughly 7 CPU-hours on committed inputs
    with no new search, against a lane currently closed on 0 of 2.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is a correct Tate's algorithm over Z at small primes with an exact
      valuation routine, a partial minimality screen reusing the three-tier rule of
      PA-ECQ-f5af06-v2, a profile distance, an ROC harness and the score-decile control -- no
      new mathematics, but Tate's algorithm is fiddly and its correctness is the one place a
      silent bug would produce a plausible wrong answer, which is why the twist-invariance and
      resultant-containment controls are stop conditions rather than diagnostics. Compute is
      roughly 7 CPU-hours, dominated by STEP 3 and STEP 5 over a few thousand curves; the record
      arm itself is minutes.

  interpretation_limits:
    - >-
      THIS EXHIBITS NO CURVE, CERTIFIES NO RANK, AND IDENTIFIES NO FAMILY. It cannot advance
      GOAL-ECQ-2298dc C1 by a single point.
    - >-
      A PROFILE MATCH IS NOT A COMMON FAMILY. The statistic is one-sided and its positive
      direction carries only the measured power; any downstream text saying "the record ladder
      uses one base" on the strength of this alone is unsupported. An empty-versus-empty match
      carries no information whatever and must be reported as inapplicable.
    - >-
      Scoped to the frozen B, the frozen distance and threshold, the in-repo calibration
      families, and the record curves as transcribed with their summarising-fetch caveat. It
      says nothing about any other curve, any other family, or any B.
    - >-
      The power is calibrated at chi = 1 and chi = 2 with coefficients of tens of digits and
      applied at 100 digits and unknown chi. That transfer is unmeasured and every record call
      carries it.
    - >-
      Rank at least 31 over Q is a LIVE CLAIMED record held by others (ICARM curve no. 302,
      posted 2026-08-23). This program's earlier certification of 31 of its 31 points CONFIRMS
      AN EXTERNAL PARTY'S RESULT ON AN EXTERNAL PARTY'S CURVE and is not this program's rank
      result in any sense.
    - >-
      A "0 of 3" outcome REPRICES the forensics lane; it does not prove the lane closed.
      Premature closure is a failure mode symmetric with overclaiming, and lane L3's own
      remaining_open field keeps the inverse problem open.

  recommended_priority: medium
  recommended_priority_basis: >-
    Medium, not high, and the reason is one number: the empty-profile risk. The statistic is
    cheap, is the most direct answer in this set to RQ-ECQ-e9b361's stated decision target, and
    would independently reproduce a committed computation that has never been checked -- but
    its single most likely outcome is that the profiles are empty and the statistic is
    inapplicable, and the design correctly refuses to report anything in that case. It ranks
    above nothing and below the three proposals whose negative outcomes still deliver a number.

  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'
