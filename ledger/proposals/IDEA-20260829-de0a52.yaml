idea:
  id: IDEA-20260829-de0a52
  question_id: RQ-ECQ-e9b361
  goal_id: GOAL-ECQ-2298dc
  goal_id_note: >-
    ROUTING ONLY. GOAL-ECQ-2298dc is `blocked`; filing a proposal is not a dispatch and does
    not resume it. Any run needs its own Coordinator decision meeting a resume condition of
    DEC-20260824-b7557b. This idea consumes committed inputs only and runs no search.

  title: >-
    A family fingerprint that survives quadratic twist and does not need the j-map: the
    multiset of TWIST-CLASSES of Kodaira reduction types, proposed against lane L3's measured
    "0 of 2 statistics separate common fibration from search bias"

  class: control

  claim: >-
    DEC-20260824-b7557b lane L3 closed the record-curve forensics on a measured quantity:
    "number of statistics computable from the record curves alone that separate 'common
    fibration' from 'search bias'", value 0 of the 2 attempted. The two attempted were a
    pairwise quadratic-twist test (negative on all three pairs, and correctly recorded as
    refuting only the degenerate case) and shared small-prime divisibility in the discriminants
    (recorded as confounded, because a rank sieve selects curves with many points modulo small
    primes and therefore inflates small-prime divisibility on its own). THE CLAIM UNDER TEST IS
    THAT A THIRD STATISTIC EXISTS AND IS NOT CONFOUNDED IN THAT WAY. For an elliptic curve E
    over Q define its EXCEPTIONAL PROFILE P(E, B) = the multiset, over primes p at most B, of
    the quadratic-twist class of the Kodaira reduction type of E at p, restricted to the
    non-multiplicative classes {II or II*}, {III or III*}, {IV or IV*} and {I_0*}. Two
    structural facts make this the right object. FIRST, the profile is invariant under
    quadratic twist by construction, because twisting exchanges exactly II with II*, III with
    III*, IV with IV*, I_n with I_n*, and fixes I_0*, so a curve and any twist of it have the
    same profile -- which matters because the standing hypothesis about the record ladder
    (IDEA-20260824-155411) is "specialisations of one fibration UP TO QUADRATIC TWIST". SECOND,
    for a fixed family with c4, c6 in Z[t], a prime can carry non-multiplicative reduction at a
    specialisation only if it divides a family constant -- Res(c4, c6) together with the
    leading-coefficient data -- so the SET of primes available to the profile is bounded by the
    family and does not grow with the specialisation parameter. THE OPERATIONAL CLAIM: on
    in-repo ground truth where the family is known, the profile separates specialisations of
    the SAME family from specialisations of DIFFERENT families with a measured area under the
    ROC curve of at least 0.80 at B = 100000; and applied to the three record curves it
    returns a same-family versus different-family reading with that measured power attached.
    THE PRE-DECLARED READINGS ARE ALL THREE INFORMATIVE. Same profile across the ladder means
    the ladder is BASE-LIMITED, the 2026 jumps from 29 to 30 to 31 were bought with search on
    a fixed base, and this program's base-rank lane is aimed at the right quantity. Different
    profiles mean the ladder is not one object and the 2026 jumps came from NEW bases, which
    reprices what obtaining any single family would buy. AUC below 0.80 on ground truth means
    the statistic has no power at record scale, lane L3's count moves from 0 of 2 to 0 of 3,
    and that is a cleaner closure than the one currently recorded because it names the third
    thing that was tried and why it failed.

  mechanism: >-
    Lane L3's obstruction is precise and it is worth quoting the shape of it: shared
    small-prime divisibility in the discriminants "is produced equally by a common fibration
    (bad fibres over fixed t) and by sieve selection bias (a sieve selects curves with many
    points modulo small primes)". The confound acts on WHICH PRIMES divide the discriminant.
    It does not obviously act on WHAT KIND of bad reduction those primes carry, and the
    difference is exploitable because the two are computed from disjoint data. A Mestre-Nagao
    style sieve maximises a sum over p of a_p(E) log p / p, so it selects for split
    multiplicative reduction and for large a_p at good primes -- both of which push toward type
    I_n, the MULTIPLICATIVE classes, which this statistic discards entirely. What the statistic
    keeps is the additive part, and additive reduction at p requires p to divide both c4 and c6
    of the specialisation, which for a family with polynomial c4(t), c6(t) forces p to divide
    the resultant Res(c4, c6) -- a single integer fixed by the family, independent of t. So the
    candidate prime set is family-determined and sieve-independent by construction, and the
    exceptional profile is a projection of the curve onto exactly the part of its local data
    that the search cannot have chosen. The quadratic-twist invariance is the second half and
    is what makes the statistic usable at all here: quadratic twisting by d introduces additive
    reduction at every p dividing d and would destroy any naive additive-prime comparison, but
    it acts on Kodaira types by the involution I_n to I_n*, II to II*, III to III*, IV to IV*,
    fixing I_0*, so quotienting by that involution removes the twist and leaves a genuine
    family invariant. All of it is exact integer arithmetic -- p-adic valuations of c4, c6 and
    the discriminant by repeated division, then Tate's algorithm -- on integers this program
    already holds, with no floating point anywhere and no search.

  tracked_object:
    object: >-
      The multiset of QUADRATIC-TWIST CLASSES of Kodaira reduction types at primes p at most B,
      restricted to the non-multiplicative classes. NOT the curve, NOT the points, NOT the
      discriminant, NOT which primes carry the types, NOT the multiplicative types, NOT the
      exponent n in I_n.
    lossy_projection_test: >-
      PASSES, AND WHAT IT DISCARDS IS EXACTLY THE CONFOUNDED PART. The projection sends an
      elliptic curve over Q -- a-invariants of 66 and 100 decimal digits, a discriminant of 453
      log units, 31 rational points, its whole Mordell-Weil group, its j-invariant, its
      conductor and the identity of every prime in its bad locus -- to a multiset of at most a
      handful of symbols drawn from a four-element alphabet. From that multiset one cannot
      recover the curve, cannot recover a prime, cannot recover a point, cannot compute a rank,
      and cannot compute a height. The loss is total and one-directional. IT IS DISCARDED
      COMPATIBLY WITH THE OPERATIONS THE TARGET PERFORMS, and this is checkable rather than
      asserted: quadratic twist acts on Kodaira types by an involution that the classes are
      defined to quotient, so the profile is FIXED under twist, deterministically, in one step;
      and specialisation of a fixed family constrains which classes can appear, because a
      non-multiplicative type at p forces p to divide the family's fixed Res(c4, c6). The
      retained data therefore propagates deterministically under both operations that stand
      between a family and a record curve. AND IT IS NOT A CHANGE OF COORDINATES: the two
      statistics lane L3 tried are recoverable from the curve and this one is not recoverable
      from them, since neither the pairwise twist test nor small-prime discriminant
      multiplicities determines the reduction TYPE.
    what_the_loss_buys: >-
      Independence from the missing model, which is the input lanes L3 and L4 died for.
      IDEA-20260824-155411's j-map match needs the unpublished rank-17 fibration; this needs
      nothing but the a-invariants of the curves in question.
    what_the_loss_costs: >-
      The profile cannot identify WHICH family, only whether two curves are consistent with a
      common one; it cannot exclude a common family, since two different families can share a
      profile; and if the record family's Res(c4, c6) happens to have no prime below B carrying
      an exceptional type, the profile is EMPTY for every specialisation and the statistic has
      no power at all. That last failure mode is not hypothetical and is why the design measures
      power on ground truth BEFORE looking at the record curves.

  novelty_status: unverified
  novelty_note: >-
    CORPUS CHECK PERFORMED THIS SESSION, AND THE NEAREST PRIOR ART OVERLAPS ON THE RAW DATA AND
    NOT ON THE QUESTION. IDEA-20260824-324dca (title, class and claim block read via grep this
    session) proposes congruence-class sieving on the local data of a fibration -- the local
    root numbers w_p(E_t), the Tamagawa numbers c_p(E_t) and the global root number -- as a
    SEARCH device, claiming they depend on t only through congruences modulo a family-determined
    modulus M, and asking whether they carry rank information the Mestre-Nagao score does not.
    That record and this one both read local data at small primes; they differ in every other
    respect. 324dca predicts RANK from local data WITHIN a known family, quantified over t; this
    record infers FAMILY MEMBERSHIP from local data ACROSS curves whose family is unknown,
    quantified over pairs of curves, and its whole design is a power calibration rather than a
    yield measurement. IDEA-20260824-155411 is prior art for the QUESTION (are the ladder rungs
    specialisations of one fibration) and requires the fibration's j-map as an input, which
    DEC-20260824-b7557b L4 records as unavailable from 0 of 5 named sources. Neither the
    quadratic-twist-class quotient nor the Res(c4, c6) bound on the candidate prime set appears
    in any record this session's grep over ledger/ideas/, ledger/proposals/ and
    knowledge/findings/ returned. The MATHEMATICS is classical: Tate's algorithm, the Kodaira
    classification and the behaviour of types under quadratic twist are textbook, are RECALLED
    here rather than checked against a source this session, and are not claimed as new.
    External literature was NOT searched for prior use of reduction-type profiles as a
    family-membership statistic. `unverified` is the required label.

