# IDEA-20261003-b62a69
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-b62a69
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 9 has degree 81 and multiplication by 8 has degree 64
  class: measurement
  claim: >-
    Multiplication by 9 has degree 81. Multiplication by 8 has
    degree 64. Eighty-one exceeds sixty-four by 17. The product of
    the two degrees is 5184. Their sum is 145. The gap is a map
    degree, not an ECDLP exponent and not the degree pair 64 and 49.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Nine squared is 81. Eight squared is 64. Two maps of
    degree 64 have gap 0 and product 4096. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The multipliers 9 and 8 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 17.
    baseline_embedding:
      parameter_slice: The degrees 81 and 64.
      reproduction_check: >-
        Two readers must agree that 9 squared is 81 and that 8
        squared is 64.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 64 drops the gap. Two maps of
        degree 64 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 81 and 64.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The multipliers are fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degrees 81 and 64. Not the degree pair 64 and 49.
      nearby_object_control: >-
        Two maps of degree 64. The gap is 0 and the product is 4096.
    proof_obligations:
      - claim: Multiplication by 9 has degree 81.
        responsibility: size
      - claim: Multiplication by 8 has degree 64.
        responsibility: size
      - claim: The gap is not the degree pair 64 and 49.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: Eighty-one exceeds sixty-four by 17.
  minimal_test:
    design: >-
      Square 9 and square 8, then subtract 64 from 81. Do not map
      a curve point.
    controls:
      - Two maps of degree 64, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The degree of multiplication by 9 is not 81.
    - The product of the two degrees is not 5184.
  confounders:
    - The degree pair 64 and 49 belongs to multipliers 8 and 7.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic endomorphism.
    - This is not the degree pair 64 and 49.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen multiplication by 9 has degree 81, and the
        frozen multiplication by 8 has degree 64.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is a
        reading of two squares.
      validation_plan: >-
        Two independent squares. A mismatch voids the gap.
  target_complexity:
