    This is the named RANK 1 successor of DEC-20260901-6f9de3, incorporating the mandatory
    repair list R1-R8 of TASK-20260901-6b1a7f; it is not an imported method. What is new in
    this record relative to every committed predecessor: (i) the first design to run under the
    AMEND-1 counter-inconsistency gate, with the conjunct stated verbatim and its
    saturated/unsaturated evaluation rule pre-registered; (ii) the first k=4 arm of the frozen
    family, priced as a LOAD-BEARING transition locator (the predecessor explicitly withheld
    k=4 as refinement-only; the red team's R5 and the EV-AES-f2da41 resource_check re-read that
    withholding as the repair's central asset); (iii) a re-priced power table for the realized
    5-order regime the predecessor's table never covered (OBS-8 voidance), including the first
    count-level (tier-2) resolution rule with a disjoint-CI declaration, replacing the frozen
    band-only sentinel where the realized magnitudes support more; (iv) the joint-effect-scoping
    resolution of the R4 schedule confound on the structural fact that PIN-T0 fixes the AES
    schedule across ALL interior points, with the schedule-separated control surfaced as a
    pin-question successor rather than silently adopted; (v) a cascade re-authored for the
    realized regime - the predecessor's SH-GRADUAL conjunct is vacuous at h(1) >= 100 (red-team
    J6 finding), so this cascade makes the k=4 locator the branch selector and pre-registers a
    seed-disagreement branch the predecessor had no replication to support; (vi) the first
    overflow-path determinism double (R3). Statistics remain Poisson/Garwood counts at the
    campaign's own pinned comparator; no external method imported.

