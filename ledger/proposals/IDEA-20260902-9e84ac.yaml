  integrity_gate_amend1:
    status: BINDING - committed verbatim in the S0-1 preregistration file before any arm
    verbatim_conjunct: >-
      Per DEC-20260901-6f9de3 AMEND-1, the branch-1 conjunct 'hit_overflow > 0 on any
      analysis-bearing receipt -> invalid_measurement' is rescoped to 'counter INCONSISTENCY on
      an analysis-bearing receipt -> invalid_measurement', where counter inconsistency means
      (a) overflow != hits − threads×HIT_LOG_CAP, or (b) any cap-independent counter (hits, W,
      ewhist_hit) disagrees with its internal identities, or (c) any analysis-bearing quantity
      is derived from the capped detail log rather than the counters. Pure cap truncation of
      the detail log with all counter identities intact is NOT a gate failure.
    evaluation_rule: >-
      Saturation-aware evaluation of conjunct (a), pre-registered as the STRICTEST reading, not
      a relaxation: on every analysis-bearing receipt, overflow == hits − logged_detail_records
      EXACTLY, where logged_detail_records == threads×HIT_LOG_CAP when hits >
      threads×HIT_LOG_CAP (saturated; AMEND-1's verbatim form) and logged_detail_records ==
      hits with overflow == 0 otherwise (unsaturated; both forms coincide when saturated).
      Predicted saturation status: k=0 anchor saturated by construction (overflow 2^30 − 1024);
      k=1 and k=2 saturated (predicted overflows ~12,680,085 and ~148,347); k=4/k=8/k=16
      predicted unsaturated - if any realizes hits > 1024, truncation is legal under AMEND-1
      and the admissible set is unchanged.
    counter_identities_checked_per_receipt:
      - sum(whist) == nontrivial_trials
      - h == sum(whist[1:]) where h = W_ge1_nontrivial
      - moment identity sum(W_ge1_by_word) == sum(W * whist[W])
      - sum(zhist) == trials
      - sum(ewhist_all) == nontrivial_trials
      - sum(ewhist_hit) == h
      - sum(ewhist_miss) == nontrivial_trials − h
      - overflow == hits − logged_detail_records (saturation-aware form above)
    admissible_quantities_counter_derived: >-
      h(k), whist, W_ge1_by_word, zhist, all ewhist_*/ewbithist_*/ezdiag_*/ezoff_* class
      counters, hit_overflow, excess ratio h/excess_E under the frozen excess_E = 2^30
      convention, excess over the run-internal accidental-hit rate, Garwood 95% CIs (count and
      exposure only), band assignment, all identity checks. These survive cap truncation
      (source-verified, TASK-20260901-87a39b check_7).
    inadmissible_quantities_detail_log_derived: >-
      hit_e_detail records, hit_trials as a SAMPLE of hit structure, any distributional
      statement over hits derived from detail records (zero_mask_e distributions, per-hit
      diagnostics), any X-lane computation. On saturated receipts the logged records are the
      FIRST 256 hits per thread - biased toward early trials, not a random sample (red-team
      J2). These are retained as report-only enabling data under the no-reopen clause; NO
      branch conjunct consumes them, so AMEND-1(c) is satisfied by construction.
    raised_cap_option: >-
      CONSIDERED AND DECLINED. Under AMEND-1 integrity no longer requires raising the cap (the
      gate is counter inconsistency, not overflow per se); the detail log feeds no analysis
      quantity in this design, so a raised cap buys nothing admissible and costs a source
      change with the full battery (Gate-0x identity, KAT pins, freeze re-verification,
      source-diff audit, determinism - the R2/FS5 route). If a future design needs
      representative hit-detail samples, THAT design prices the cap elevation with the
      frozen-lineage source-diff audit discipline; this one does not.

  schedule_decision:
    choice: >-
      JOINT-EFFECT SCOPING (R4 option (a)); the schedule-separated control arm is a named
      successor, not spent
    structural_fact: >-
      Under PIN-T0 the key schedule is the AES schedule at EVERY interior point k >= 1 -
      constant across k in {1,2,4,8,16} (position 0 enters P_k at k=1; SubWord uses TPOS[0]).
      Therefore the decay of h(k) across interior points is a TABLE-DILUTION effect at fixed
      schedule: every interior-to-interior comparison this design makes - all branch conjuncts,
      the monotonicity question, the k=4 transition localization, the k=8/k=16 floor
      comparison - is schedule-clean by construction. The confound attaches ONLY to (i) the
      k=0 -> k=1 step, which co-varies the first dilution step with the identity->AES schedule
      switch, and (ii) counterfactual comparisons against an identity-schedule instrument that
      no committed arm instantiates.
    scoping_rule: >-
      Every statement about h(1), and every k=0->k=1 comparison, in this record and in any
      downstream record citing this batch, is scoped as the JOINT EFFECT of the schedule switch
      and the first dilution step. No dilution-only attribution of h(1) anywhere (EV-AES-f2da41
      OBS-7 / RT3-C binding; paraphrase_discipline block enforces). The k=0 ramp-zero anchor is
      consumed as the instrument's zero only, never as the first point of a dose-attributed
      decay.
    why_not_the_control_arm_now: >-
      The schedule-separated control arm (interior AES tables with identity schedule) requires
      a NEW Coordinator pin decision - PIN-T0 scopes the AES schedule to all k >= 1, so the
      control is a new schedule convention and a new instrument variant - plus a source change
      with the full battery (Gate-0x, KAT, freeze re-verification, source-diff audit,
      determinism) and at least one additional ~27 min arm. Its answer (how much of h(1) is
      schedule vs round table) is a MECHANISM question downstream of the shape question: if
      SH2-MONOTONE-DECAY or SH2-PLATEAU fires, the separated arm becomes a far better-informed
      priced successor; if SH2-DEAD-INTERIOR or SH2-NONMONO fires, the separated question
      changes form. Spending it before the shape verdict is premature; the shape verdict is
      fully decidable on the schedule-clean interior grid without it.
    coordinator_pin_question_surfaced: >-
      NOT assumed, surfaced for the Coordinator per the dispatch brief: if in-batch schedule
      attribution is wanted, a new pin decision is required. Proposed candidate for that
      decision: PINCTRL-1 - interior seats (1 <= k < 16) run SubWord with the identity table;
      the k=16 seat keeps the AES schedule and the k=0 seat the identity schedule, so BOTH
      endpoint re-seats remain receipt-exact while interior readings become a new instrument
      variant requiring the full battery. This record neither adopts nor budgets PINCTRL-1; the
      schedule-separated arm is the named successor under it.

  shape_statistic:
    primary_observable: >-
      h(k) = number of W>=1 hit trials among the nontrivial trials of the arm at family point
      k, fixed (r=5, amask=1, smask=1, log2N=30, seed family, 4 threads) - the SAME counter the
      committed lineage has always logged (whist / W_ge1_nontrivial); no new statistic is
      defined. REPORTED PER POINT, whatever the outcome: (i) h(k); (ii) excess ratio
      h(k)/excess_E under the frozen excess_E = 2^30 comparator convention; (iii) excess over
      the run-internal analytic null expectation (design-rate lambda_0 = 1.0 hit per 2^30,
      recomputed run-internally from the arm's own class counters and reported beside); (iv)
      exact Garwood 95% CI on the per-trial rate (Wilson-Hilferty convention of the campaign,
      executor re-derives); (v) W_ge1_by_word split (report-only enabling data; no branch
      conjunct consumes it); (vi) hit_overflow with its identity status (saturated/unsaturated,
      identity exact) - under AMEND-1 overflow is expected and legal at k=1/k=2, and the
      integrity content is the identity, not the zero. SECONDARY / REPORT-ONLY: every e field
      the instrument logs rides as enabling data under the NO-REOPEN clause: no excess-zero
      test is preregistered, computed, or reported at any point; the t=1 X lane is closed by
      EV-AES-896ef2 and stays closed; any downstream paraphrase reporting these fields as a
      carrier reading violates this record's scope.
    bands: >-
      FROZEN PER-POINT BANDS (inherited unchanged from 363851 Stage 1 via 582ea9): NULLBAND
      h <= 5; RESIDUAL-BAND 6 <= h <= 40; AMBIGUITY-BAND 41 <= h <= 99; GRADUAL-THRESHOLD
      h >= 100. bandrank: NULLBAND = 0, RESIDUAL = 1, AMBIGUITY = 2, THRESHOLD = 3.
    two_tier_resolution_declaration: >-
      TIER 1 (BAND LEVEL) is the resolution of every branch conjunct - the frozen sentinel
      granularity. TIER 2 (COUNT LEVEL) is admitted ONLY as reported content, under a
      pre-registered disjoint-CI rule: a consecutive pair (k_a, k_b) is COUNT-RESOLVED iff
      their Garwood 95% CIs are disjoint; if disjoint with h(k_b) < h(k_a) it is reported as
      COUNT-DECAY-RESOLVED with the ratio and propagated CI; if overlapping it is reported as
      COUNT-UNRESOLVED for that pair, declared, never smoothed. This tier replaces the frozen
      band-only monotonicity SENTINEL for reporting purposes only (the sentinel's band-level
      operation remains the branch-selection granularity), per R7's mandate to revisit
      band-granularity at the realized magnitudes where informative structure is within-band.
      Design-time expectation at the observed magnitudes: pairs (1,2) and (2,4)
      COUNT-DECAY-RESOLVED (CIs separated by ~2 orders), pairs (4,8) and (8,16)
      COUNT-UNRESOLVED (within-RESIDUAL overlap).
    band_level_monotonicity_sentinel: >-
      Inherited: the curve over tested interior points {1,2,4,8,16} is BAND-RISING iff there
      exist tested points k_a < k_b with bandrank(h(k_b)) > bandrank(h(k_a)). Within-band
      inversions do NOT fire the sentinel; it operates only at tier-1 resolution.

  k_point_design:
    selected_subset: [0, 1, 2, 4, 8, 16]
    second_seed_subset: [1, 4]
    justification: >-
      k=0 and k=16: re-seated BLOCKING anchors (ramp zero; known-alive seat with gate band
      [6,30]). k=1: the minimal-dose point, re-run under AMEND-1 - validates or supersedes the
      5-order observation; its magnitude is no longer a branch discriminator (any reading
      within orders of the observation is THRESHOLD-certain; the old STEP-vs-GRADUAL
      discrimination is void per OBS-8) but its exact rate anchors the decay curve and its
      second seed (R6) measures seed variance at the largest reading. k=2: re-run under
      AMEND-1; with k=1 it brackets the first interior decay ratio and guards the monotonicity
      conjunct. k=4: NEW, the LOAD-BEARING TRANSITION LOCATOR (R5) - the first measurement of
      that family point; the observations localize the THRESHOLD->RESIDUAL transition to (2,8),
      and k=4 is the unique frozen family point inside that interval, splitting it into (2,4]
      vs (4,8]. This arm is priced LOAD-BEARING, explicitly NOT refinement: branch selection
      between SH2-MONOTONE-DECAY and SH2-PLATEAU runs on its band reading. k=8: re-run under
      AMEND-1; floor point for question (iii) and the non-monotone sentinel's midpoint.
      EXCLUDED AND PRICED: k=3/5/6 (NOT family points - no committed freeze digests, build
      surface does not admit them; family extension is the named successor for sub-interval
      localization, priced in the obstruction block: Coordinator decision + new freeze
      commitment + surface-diff battery + ~27 min per arm); k=12 (frozen family point, armid 7
      reserved; no load-bearing question at band resolution sits between the two floor points
      k=8 and k=16 - a within-RESIDUAL comparison this design declares unresolved; named
      successor for floor-structure questions, not spent); k=2 second seed (R6 'preferably' -
      priced as named successor at ~27 min; the design seeds the two points whose readings
      select branches or carry the largest magnitude).
    trials_per_point: >-
      2^30 nontrivial trials per point, one arm each (power_statement below). 2^30 remains the
      correct exposure at k=1 DESPITE the huge reading: the branch decision no longer needs
      separation there (it is a rate-measurement and replication point), 2^30 keeps every
      reading directly comparable to the committed quantities at matched exposure without
      rescaling, and escalation buys only within-band resolution which is declared out of scope
      and priced. No pooling across points or seeds.

  design_time_power:
    computation_provenance: >-
      DESIGN-TIME COMPUTATION THIS SESSION (fresh python3, Poisson CDFs by direct summation,
      Garwood CIs by the campaign's Wilson-Hilferty chi-squared quantile convention; values
      overlapping TASK-20260901-87a39b's blind re-derivation reproduce it to all displayed
      digits). All regime predictions below are built on the BATCH-7b798d rule-8 OBSERVATIONS
      (flagged UNVALIDATED as shape evidence everywhere; AMEND-1 bars spending them as
      evidence); the batch's own re-runs under AMEND-1 are the only readings any verdict
      composes from. Executor re-derives all floors at each arm's run-internal null rate.
    regime_declaration: >-
      Realized-regime predictions (unvalidated priors): h(1) ~ 1.27e7 (excess ratio 0.0118,
      Garwood relative half-width 0.055%); h(2) ~ 1.49e5 (relative half-width 0.51%); h(4) ~
      20.7 by single-seed multiplicative extrapolation of the observed 84.9x per-step factor
      (h(2)/84.9^2; the same factor chain predicts ~4e-7 at k=8 vs observed 13 - the floor
      intervenes inside (2,8), confirming the interval is the informative one; the
      extrapolation is a prior, not a prediction the design bets on); h(8) ~ 13, h(16) ~ 12
      (relative half-widths ~59-62%).
    question_i_monotonicity: >-
      Does h decay monotonically across the interior grid {1,2,4,8,16}? BAND LEVEL (branch-
      selecting): at the predicted magnitudes band assignment is near-certain at k=1 (a band
      departure from THRESHOLD would require a >5-order swing, ~ -3500 sd) and at k=2 (even a
      +/-16% seed swing - the committed k=16 seed variance scale - leaves ~ -350 sd against the
      100 boundary); the fragile point is k=4 (scenario table below) and any true value sitting
      on a band boundary (lambda=40: P(h>=41) = 0.458; lambda=41: P(h<=40) = 0.479;
      lambda=100: P(41..99) = 0.487 - boundary-sitting values land ambiguous ~half the time;
      the SH2-RESIDUAL complement absorbs them, never force-binned). COUNT LEVEL (tier-2
      reporting): consecutive-pair decay is count-resolved where Garwood CIs are disjoint -
      design-time: (1,2) and (2,4) resolved at the predicted magnitudes, (4,8) and (8,16)
      unresolved (within-RESIDUAL); per-pair declarations reported whatever the outcome.
    question_ii_transition_location: >-
      Where in (2,8) does the transition sit? k=4 splits the interval: h(4) >= 100 ->
      transition at or after (4,8] (SH2-PLATEAU path); h(4) <= 40 -> transition at or before
      (2,4] (SH2-MONOTONE-DECAY path); h(4) in 41-99 -> ambiguous at the locator (declared
      complement). k=4 scenario table (exact Poisson this session): lambda=13 -> RESIDUAL
      0.989, NULL 0.011; lambda=20.7 (extrapolation) -> RESIDUAL 0.9999, NULL 4.2e-5, AMBIGUITY
      5.3e-5; lambda=30 -> RESIDUAL 0.968, AMBIGUITY 0.032; lambda=50 -> AMBIGUITY 0.914,
      RESIDUAL 0.086; lambda=100 -> AMBIGUITY 0.487, THRESHOLD 0.513; lambda >= 1259 ->
      THRESHOLD ~1. If the extrapolation prior holds, localization to (2,4] is near-certain at
      2^30; the design's honest exposure is that the TRUE lambda(4) is unknown, and all four
      bands are live branches. MAXIMAL RESOLUTION: (2,4] vs (4,8] is the finest localization
      the frozen family supports; sub-intervals need family extension (priced obstruction).
    question_iii_floor_vs_comparator: >-
      Does the k=8/k=16 floor differ from the comparator? Vs the ANALYTIC NULL (lambda_0 = 1.0
      per 2^30): YES-decidable at 2^30 - rejection h >= 6 has size 5.94e-4 at lambda=1 and
      power 0.989 at lambda=13; P(h >= 12 | lambda=1) = 8.3e-10 and P(h >= 13 | lambda=1) =
      6.4e-11, so floor readings of 12-13 are ~10+ sd above null in exact-Poisson terms. Vs
      the committed k=16 seats (14/19 on other streams) and floor MAGNITUDE questions (12 vs
      13 vs 14 vs 19): NOT resolvable at 2^30 single seed - Garwood CIs [6.2,21.0],
      [6.9,22.2], [7.6,23.5], [11.4,29.7] overlap pairwise; within-RESIDUAL comparison is
      below the per-point resolution, declared, priced, never smoothed.
    inherited_per_point_detection_floor: >-
      Re-derived this session, unchanged from 582ea9: one-sided rejection toward excess at
      h >= 6; size P(h >= 6 | lambda=1) = 5.94e-4; power 0.084 at lambda=3, 0.384 at 5, 0.554
      at 6, 0.699 at 7, 0.809 at 8, 0.933 at 10, 0.950 at 10.5, 0.989 at 13, 0.9998 at 19.
      DECLARED PER-POINT SENSITIVITY FLOORS: lambda_80 ~= 8.0, lambda_95 ~= 10.5 hits per
      2^30 - a NULLBAND reading excludes a per-point excess >= ~8-10.5 at 80-95% power and
      excludes NOTHING below that (a true lambda=6 point reads NULLBAND 45% of the time).
    seed_stability_power: >-
      Second seeds at k=1 and k=4 (R6). At k=1: under any seed swing of the committed +/-16%
      scale around 1.27e7, a band departure from THRESHOLD is a >3000-sd event - the k=1 second
      seed is a seed-VARIANCE measurement (exact-rate comparison, 0.055%-scale CIs), not a band
      gamble; SH2-SEED-DISAGREE at k=1 would be an instrument-level alarm. At k=4: under the
      extrapolation prior lambda=20.7, P(two independent seeds disagree in band) = 0.0002; the
      disagreement mass concentrates where the true value sits on a boundary (lambda=50: ~0.16;
      lambda=100: ~0.50), which is exactly the case the branch is designed to catch and record.
    priced_non_detections: >-
      DECLARED BEFORE ANY READING, never smoothed: (1) within-RESIDUAL floor magnitude (12 vs
      13 vs 14 vs 19) at 2^30 - overlapping Garwood CIs; 2^32 per point (~108 min baseline
      each) narrows relative half-widths only to ~30% and still does not separate 12-vs-13;
      4-seed pooling per point (~4 arms each) is the robust route - priced, named successor.
      (2) Seed variance of the k1->k2 decay ratio: the ratio itself is measurable per seed to
      ~0.5% (CI propagation) but its seed variance is unmeasured without a k=2 second seed
      (~27 min, named successor). (3) Transition sub-interval within (2,4] or (4,8] - family
      extension only (k=3/5/6 not family points), priced. (4) Schedule-vs-dilution
      decomposition at k=1 - new pin + battery + arm, priced. (5) Seed variance at
      k=2/k=8/k=16 - not seeded in this design; the k=16 re-seat adds one stream reading of
      the endpoint but no second seed there is budgeted. (6) Anything below the per-point
      floors lambda_80/95 at NULLBAND points.

  predictions:
    - id: PR-X1
      metric: >-
        STAGE S0 DEAD ANCHOR AT MATCHED EXPOSURE - (aes, r6, amask=1, smask=1, 2^30, seed
        531004, armid 1, threads 4) under the re-verified frozen build; run and ANALYZED
        BEFORE any alive reading (binding order)
      direction: null_direction
      minimum_effect: >-
        hits <= 8 (carried dead band at 2^30). Expected 0-4 (BATCH-7b798d re-seat precedent
        read 0; P(0) ~ 0.18 under the committed pooled r=6 rate ~1.72). Tripwire hits >= 9 is
        F6: boundary falsifier of the sealed verdict - HALT, escalate to claim-changing review
        (rule 12); no interior reading admitted. A 0-hit anchor passes with reduced assurance
        per the inherited precedent (direction-safe, rule 8).
    - id: PR-X2
      metric: >-
        STAGE S0 RAMP-ZERO ANCHOR - k=0 identity re-seat (S_0, r5, amask=1, smask=1, 2^30,
        seed 531001, armid 5, threads 4); BLOCKING ramp anchor analyzed before interior points
      direction: null_direction
      minimum_effect: >-
        hits = 2^30 exactly, T = 0, W = 3 on 100% of nontrivial trials, whist
        [0,0,0,2^30,0], excess ratio 1.0 exact; overflow = 2^30 − 1024
        saturated-by-construction with all counter identities exact - legal under AMEND-1
        (pure cap truncation). Any count-level departure is F3: ramp's zero void, every
        interior reading confounded, invalid_measurement, halt and repair.
    - id: PR-X3
      metric: >-
        STAGE S1 KNOWN-ALIVE RE-SEAT, analyzed FIRST within S1 - k=16 (S_16, r5, seed 531001,
        armid 8, threads 4)
      direction: different
      minimum_effect: >-
        h(16) in [6, 30] (residual band with headroom; committed seats 14/19 on other streams,
        prior re-seat 12). Outside is F5: indict THIS batch's table path, not the committed
        measurements; halt, no shape verdict. Also the floor point for question (iii) at the
        endpoint.
    - id: PR-X4
      metric: >-
        STAGE S1 PRIMARY GRID UNDER AMEND-1 - k=1 (S_1, armid 2), k=2 (S_2, armid 3), k=8
        (S_8, armid 6), seed 531001; admitted only after S0 anchors and the k=16 re-seat pass
      direction: different
      minimum_effect: >-
        Determinate band readings with full per-point tuples; overflow saturated and
        identity-exact at k=1/k=2 (predicted), unsaturated predicted at k=8; every counter
        identity verified per receipt. These re-runs VALIDATE or SUPERSEDE the BATCH-7b798d
        observations - the verdict composes from these readings alone.
    - id: PR-X5
      metric: >-
        STAGE S1 LOAD-BEARING TRANSITION LOCATOR - k=4 (S_4, r5, amask=1, smask=1, 2^30, seed
        531001, armid 4, threads 4); first measurement of this family point
      direction: different
      minimum_effect: >-
        A determinate band reading that selects between SH2-MONOTONE-DECAY (h(4) <= 40),
        SH2-PLATEAU (h(4) >= 100), and the ambiguity complement (41-99); a NULLBAND reading at
        k=4 with a RESIDUAL floor at k=8/k=16 is the NONMONO tell. Design-time prior from the
        unvalidated extrapolation: ~20.7 RESIDUAL (0.9999) - flagged as prior only; all four
        bands live.
    - id: PR-X6
      metric: >-
        STAGE S2 SECOND SEEDS (R6) - k=1 (S_1, seed 531002, armid 9 - the frozen 363851
        pre-specified replication seat) and k=4 (S_4, seed 531002, armid 4 - pre-registered by
        THIS record; no frozen pre-specification exists for that seat)
      direction: different
      minimum_effect: >-
        Per-seed tuples, never pooled. Band agreement with the primary seed at each point is
        the pre-registered verdict-stability condition (branch 5 SH2-SEED-DISAGREE on
        disagreement); at k=1 the exact-rate comparison additionally measures seed variance at
        the largest reading.
    - id: PR-X7
      metric: >-
        GATES AND ZERO-COST CONTROLS - build sha256 identity vs the BATCH-7b798d snapshot
        receipts (source and binary); KAT pins (pin + pinidentity); table-freeze
        re-verification vs committed R3_table_freeze.json; determinism double on an
        OVERFLOW-POSITIVE receipt (PR-X8); post-arm digest re-verification; post-arm
        source-diff audit (must be EMPTY vs the re-verified build)
      direction: null_direction
      minimum_effect: >-
        All gates pass; any failure is SH2-GATE-FAIL (invalid_measurement, halt, repair, rule
        5). If the build hash re-verification fails, the priced Gate-0x fallback runs before
        any reading arm (stages_and_budget).
    - id: PR-X8
      metric: >-
        DETERMINISM DOUBLE ON AN OVERFLOW-POSITIVE RECEIPT (R3) - (S_1, r5, amask=1, smask=1,
        log2N=20, seed 531001, armid 2, threads 4), identical command twice
      direction: null_direction
      minimum_effect: >-
        Byte-identical receipts modulo the preregistered timing strip set
        {elapsed_seconds_measured, measured_rate_trials_per_sec}; counter identities verified
        on the double receipt; realized overflow > 0 (predicted hits ~ 2^20 x 0.0118 ~ 12,400
        -> overflow ~ 11,400, from the flagged unvalidated observation). PRE-REGISTERED
        FALLBACK: if the realized receipt carries overflow = 0, the double re-runs at k=0
        (S_0, log2N=20, seed 531001, armid 5, threads 4) where overflow = 2^20 − 1024 > 0 by
        construction, and the regime deviation is recorded per rule 8. R3 is discharged only
        by a receipt that is overflow-positive IN FACT.

  minimal_test: >-
    CHEAPEST DISCRIMINATING SUBSET: Stage S0 alone decides instrument validity (build identity,
    KAT, freeze) and both anchors, but NOT the shape (no interior point). Stage S1 (5
    analysis-bearing arms + gates) decides the primary-grid shape content minus the replication
    condition; Stage S2 (2 second-seed arms) discharges the verdict-stability condition - the
    verdict composes only after S2. Nothing cheaper adjudicates the successor questions:
    zero-run options are exhausted by construction - the BATCH-7b798d readings cannot be spent
    as validated shape evidence (AMEND-1 bars post-hoc rescue), no committed receipt contains
    k=4, and the table-freeze file carries digests only. The carrier ramp (363851 Stages 1a/1b)
    is NOT part of this record's minimal test and stays gated/unspent.

  stages_and_budget:
    stage_s0:
      batch_shape: one producer, 4 binary invocations expected (+1 fallback), ~1 h wall under the binding baseline
      runs:
        - {id: S0-1, content: 'write-once preregistration file: AMEND-1 gate VERBATIM + saturation-aware evaluation rule, counter identities list, admissible/inadmissible quantity lists, SH2 cascade WITH precedence clause, anchor order, seat tuples (armids 1/2/3/4/5/6/8/9), joint-effect scoping rule, two-tier resolution rule, per-point sensitivity floors, seed-disagreement rule, no-reopen clause, timing strip set; mtime before first arm', cost: 'seconds, 0 runs'}
        - {id: S0-2, content: 'BUILD IDENTITY RE-VERIFICATION - sha256 of source and binary vs the BATCH-7b798d snapshot receipts (archives/TASK-20260901-56ecb6 S0 build; S1 copy byte-identical per that batch post-arm empty diff); EXPECTED PASS, zero source change in this design. PRICED FALLBACK on mismatch: full Gate-0x rebuild (aes, r5, 1, 1, 2^30, seed 531001, armid 1, threads 2) field-exact vs L1-AES-R5-P30 under the extended allowed-diff list, BEFORE any reading arm', cost: 'seconds expected; fallback ~54 min baseline'}
        - {id: S0-3, content: 'KAT pins on the re-verified build (pin + pinidentity)', cost: 'seconds'}
        - {id: S0-4, content: 'table-freeze re-verification - rerun freeze mode, compare against committed R3_table_freeze.json (digests, bijection, nestedness, cross_k_nesting all identical)', cost: 'seconds'}
        - {id: S0-5, content: 'DEAD ANCHOR - (aes, r6, amask=1, smask=1, 2^30, seed 531004, armid 1, threads 4): ANALYZED FIRST among reading-bearing arms; gate hits <= 8; tripwire >= 9 (F6)', cost: '~27 min baseline'}
        - {id: S0-6, content: 'RAMP-ZERO ANCHOR - k=0 re-seat (S_0, r5, 1, 1, 2^30, seed 531001, armid 5, threads 4): BLOCKING; hits = 2^30, W = 3 on 100% of nontrivial; excess ratio 1.0 exact; overflow 2^30 − 1024 legal under AMEND-1 with identities exact', cost: '~27 min baseline'}
      decides: >-
        Instrument validity of the unchanged frozen build; the dead-arm control at matched
        exposure; the ramp's zero. Does NOT decide the shape. A halt here is a committed
        instrument/anchor result, never a shape reading (rule 5).
    stage_s1:
