  title: >-
    SUCCESSOR SHAPE-ONLY DESIGN UNDER AMEND-1 - re-run the interior hit-count curve under the
    counter-inconsistency gate, spend k=4 as the load-bearing transition locator, and price the
    realized 5-order regime. BATCH-7b798d (IDEA-20260901-582ea9) made the first interior hit-count
    readings (k=1 = 12,681,109; k=2 = 149,371; k=8 = 13; k=16 = 12, all at 2^30, seed 531001,
    PIN-T0) and then fired SH-GATE-FAIL on its literal 'hit_overflow > 0' conjunct; no shape
    verdict was composed and those readings remain rule-8 OBSERVATIONS, unvalidated as shape
    evidence (EV-AES-f2da41, DEC-20260901-6f9de3). DEC-20260901-6f9de3 AMEND-1 prospectively
    rescopes branch 1 to 'counter INCONSISTENCY on an analysis-bearing receipt ->
    invalid_measurement' for successor batches under the frozen 582ea9 instrument lineage, and
    its RANK 1 next_action dispatches THIS record. The design: (R1) re-runs the interior grid
    {k=1,2,8,16} plus anchors under the AMEND-1 gate, stated verbatim in the preregistration
    spec; (R5) spends k=4 - the first measurement of that family point - as the LOAD-BEARING
    transition locator that splits the observation-localized transition interval (2,8) into
    (2,4] vs (4,8]; (R6) adds second seeds at k=1 (the frozen 363851 armid-9 pre-specified seat)
    and at k=4, with a pre-registered seed-disagreement branch; (R3) runs the determinism double
    on an overflow-positive receipt (k=1 at log2N=20, predicted ~1.2e4 hits >> 1024 cap; k=0
    fallback overflow-positive by construction); (R7) re-prices power for the realized regime
    (h(1) ~ 1.3e7, h(2) ~ 1.5e5, floor ~ 12-13) with per-question pricing and priced
    non-detections, never smoothed; (R4) adopts JOINT-EFFECT SCOPING for the PIN-T0 k=1 schedule
    confound on the structural fact that under PIN-T0 the key schedule is the AES schedule at
    EVERY interior point k >= 1 (constant across {1,2,4,8,16}), so all interior-to-interior
    comparisons are schedule-clean and only the k=0->k=1 step and identity-schedule
    counterfactuals are confounded - the schedule-separated control arm is surfaced as a named
    successor requiring a NEW Coordinator pin decision (PINCTRL-1 candidate), NOT assumed;
    (R8) carries the OBS-7 paraphrase discipline as a binding block. NEW exhaustive ordered SH2
    cascade (gate-fail > F6 > anchor-fail > reseat-fail > SEED-DISAGREE > DEAD-INTERIOR >
    NONMONO > MONOTONE-DECAY > PLATEAU > declared RESIDUAL complement) with explicit precedence
    clause and a checked overlap/vacuity audit against every curve shape the grid can produce,
    including non-monotone ones. The instrument is UNCHANGED (byte-identity re-verification
    against the BATCH-7b798d snapshot; the raised-cap option is considered and declined under
    AMEND-1). Toy tier; no deployed-AES claim; no published-cryptanalysis comparison in either
    direction; NO X statistic, no rho-exclusion, no carrier claim; Stages 1a/1b of
    IDEA-20260901-363851 stay unspent. Budget: three producer batches, 9 analysis-bearing 2^30
    arms + gates, ~4.1 h expected under the binding baseline (~27 min per 2^30 4-thread arm),
    declared cap 19800 s including the priced Gate-0x fallback.

  object: >-
    TRACKED OBJECT - THE SHAPE OF THE r=5 HIT-COUNT CURVE OVER THE FROZEN DILUTION FAMILY,
    MEASURED UNDER THE AMEND-1 COUNTER-INCONSISTENCY GATE, WITH THE TRANSITION LOCALIZED BY k=4.
    This record succeeds IDEA-20260901-582ea9 (shape-only reduced Stage 1) whose batch
    BATCH-7b798d closed as SH-GATE-FAIL with no verdict (DEC-20260901-6f9de3). The tracked
    object is unchanged in kind: the curve k -> h(k) = number of W>=1 hit trials at fixed
    (r=5, amask=1, smask=1, 2^30, seed family, PIN-T0) over the frozen nested position family
    S_k - but the design is re-built around what BATCH-7b798d OBSERVED (rule-8 observations,
    NOT validated shape evidence): a step curve localizing the THRESHOLD->RESIDUAL transition to
    the unmeasured interval k in (2,8), with a 5-order excess at k=1 far beyond the
    predecessor's priced regime. The grid is {0, 1, 2, 4, 8, 16}: k=0 ramp-zero anchor, k=16
    known-alive re-seat (blocking anchors), k=1/k=2/k=8 RE-RUNS under AMEND-1 (validating or
    replacing the prior observations), k=4 the NEW load-bearing transition locator (R5), second
    seeds at k=1 and k=4 (R6). Three open questions are priced (design_time_power): (i) does h
    decay monotonically across the interior grid; (ii) where in (2,8) the transition sits - k=4
    splits it into (2,4] vs (4,8], the maximal resolution the frozen family supports; (iii)
    whether the k=8/k=16 floor differs from the comparator (decidable vs the analytic null at
    2^30; NOT decidable in magnitude 12-vs-13-vs-14-vs-19 - priced obstruction). WHAT IS
    DELIBERATELY NOT THE OBJECT: the zero-byte content of e on hits (X-statistic lane closed at
    t=1 by EV-AES-896ef2; no-reopen clause); the hit-vs-miss wt(e) carrier split (363851 C1/C2,
    gated, unspent, not revived); schedule-separated attribution of h(1) (named successor under
    a new pin); finer-than-family points k=3/5/6 (not family points; family-extension
    successor, priced); other cells, other round counts, deployed AES.

  lossy_projection_test: >-
    Same projection as 582ea9, restated for this design: (S_k, key, seed, stream) -> h(k)
    discards everything about each trial beyond its W>=1 outcome; fibres are enormous; the loss
    is the point - this is the shape observable the excess-zero closures left open, measured
    with the coarsest statistic that can carry it. TWO SHARP EDGES THIS RECORD OWNS. (1)
    Resolution is declared in two tiers and the boundary between them is priced, not smoothed:
    TIER 1 (band level) uses the frozen bands (NULLBAND <= 5, RESIDUAL 6-40, AMBIGUITY 41-99,
    THRESHOLD >= 100) for every branch conjunct; TIER 2 (count level) is admitted ONLY as
    reported content for consecutive pairs whose Garwood 95% CIs are disjoint (pre-registered
    disjoint-CI rule) - at the observed magnitudes this resolves the (1,2) and (2,4) count
    decays per seed and declares the (4,8) and (8,16) within-RESIDUAL pairs UNRESOLVED.
    Within-tier-2-undecidable structure is the declared obstruction. (2) Under PIN-T0 the dose
    label k separates round-function tables only for interior-to-interior comparisons; the
    k=0->k=1 step co-measures the schedule switch (joint-effect scoping block), stated rather
    than absorbed. A third owned loss, inherited: with family surface {0,1,2,4,8,12,16} the
    transition can be localized to a half-interval but never to a sub-point without family
    extension (priced successor).

  claim: >-
    Three statements C1X-C3X, each with a determinate reading under the preregistered SH2
    cascade, and NO carrier clause anywhere.

    (C1X) VALIDATED INTERIOR CURVE UNDER AMEND-1. The interior grid {1,2,4,8,16} at 2^30,
    seed 531001, re-measured under the counter-inconsistency gate: every analysis-bearing
    quantity counter-derived (admissible list pre-registered), every counter identity verified
    per receipt, overflow accounted exactly (saturated or not). If the gates hold, these become
    the FIRST gate-valid interior hit-count readings of the frozen family; the BATCH-7b798d
    observations are then either reproduced (within seed variance) or superseded by this
    batch's own readings - either way the verdict composes from THIS batch alone, never from
    the prior observations.

    (C2X) THE TRANSITION LOCALIZATION (whichever branch fires). The cascade returns exactly one
    branch (exhaustive by construction; SH2-RESIDUAL is the declared complement).
    SH2-MONOTONE-DECAY: count excess at THRESHOLD at minimal dose decays with dilution to
    RESIDUAL-or-below by k=4, transition localized to (2,4] if h(2) >= 100, to (1,2] if
    h(2) <= 40, ambiguous-at-k=2 if h(2) in 41-99. SH2-PLATEAU: excess persists at THRESHOLD
    through k=4, first band drop at or after (4,8], transition reported in (4,8] or (8,16].
    SH2-NONMONO: band rise located. SH2-DEAD-INTERIOR: no excess at any tested interior point
    (joint-effect-scoped at k=1). SH2-SEED-DISAGREE: seed instability at a load-bearing point,
    no shape verdict. Every verdict scoped to the frozen family, one probe cell, toy tier,
    PIN-T0, at declared per-point floors.

    (C3X) THE HONEST OBSTRUCTIONS (always reported, priced, never smoothed). Per-point floors
    lambda_80 ~= 8.0, lambda_95 ~= 10.5 hits per 2^30 (re-derived this session) for NULLBAND
    exclusion; floor-vs-null decidable at 2^30 (power 0.989 at lambda=13, size 5.94e-4) but
    floor MAGNITUDE (12 vs 13 vs 14 vs 19) not resolvable at 2^30 (overlapping Garwood CIs;
    2^32 or 4-seed pooling priced); transition sub-interval ((2,3], (3,4], ...) not resolvable
    without family extension (k=3/5/6 are not frozen family points; priced successor);
    schedule-vs-dilution decomposition at k=1 not measurable without a new pin decision (priced
    successor); seed variance at k=2/k=8/k=16 unmeasured (k=2 second seed priced as successor).
    NO rho-exclusion of any kind at any interior point; the measured t=1 frontier rho_80 =
    0.1183 of EV-AES-896ef2 is carried as the standing closed-lane floor control reading,
    reported beside, never merged.

    (WHAT IS NOT CLAIMED) No statement about full-round or deployed AES; no published-frontier
    comparison in either direction (R3); no carrier clause of e in any form; no X statistic at
    any point; nothing from the BATCH-7b798d readings as validated shape evidence (design-time
    priors only, flagged); no dilution-only attribution of h(1) (joint-effect scoping); no
    claim that the grid exhausts the family (k=3/5/6 extension and k=12 are named successors);
    no reopening of 363851 Stages 1a/1b.

  mechanism: >-
    Inherited from 582ea9 with the realized-regime re-reading stated up front. The sealed
    verdict's single-factor contrast (EV-AES-ec53f1, hardened by EV-AES-b2910a) says
    death-vs-life at r=6 tracks the S-box within the tested subclass; it does not say how the
    surviving r=5 hit-count excess depends on the nonlinearity DOSE. The 582ea9 candidates:
    (M1) GLOBAL FRAGILITY (any nonlinear byte holds the law at residual level; predicts h(1)
    in 13-19); (M2) TUNABLE DOSE (each AES byte erodes the law finitely; h falls gradually as
    k falls); (M3) FULL-TABLE COLLECTIVITY (any dilution destroys the excess; h(1) <= 5).
    REALIZED-REGIME RE-READING (from unvalidated observations, stated as the design's
    motivation, NOT as evidence): the BATCH-7b798d k=1 observation (12,681,109 hits) is
    incompatible with M1's and M3's k=1 predictions IF it is ever validated under AMEND-1, and
    far beyond anything M2 was priced for (a 98.8% collapse of the affine law at the first
    diluted byte, then an 84.9x further collapse to k=2, then a floor near 12-13 by k=8). This
    batch therefore does not re-test M1/M2/M3 at the old thresholds; it VALIDATES the
    observation under the corrected gate and, if validated, measures the fine structure the
    observations localize: monotonicity, transition position via k=4, and the floor's relation
    to the comparator. A finding of MONOTONE-DECAY with transition in (2,4] or (4,8] is the
    tunable-dose reading with a located sensitive dose; PLATEAU names the persistence variant;
    NONMONO or DEAD-INTERIOR would re-open M3-flavored readings; every branch is a complete
    scoped result or a determinate instrument/seed finding. The mask-14 word-counter structure
    observed at k=1 (12,681,108 W=3 hits all at mask 14 plus one W=1 hit on word 0 -
    cap-independent counter derivation, red-team J2) rides as report-only per-point word-split
    enabling data; no branch conjunct consumes it and no carrier sentence is drawn from it.

