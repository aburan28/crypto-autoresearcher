      runs:
        - {id: S1-1, content: 'KNOWN-ALIVE RE-SEAT - k=16 (S_16, r5, 1, 1, 2^30, seed 531001, armid 8, threads 4): ANALYZED FIRST within S1; band [6,30] or F5 halt', cost: '~27 min baseline'}
        - {id: S1-2, content: 'AMEND-1 RE-RUN primary point - k=1 (S_1, armid 2): overflow predicted saturated (~12.68M hits); admissible quantities counter-derived', cost: '~27 min baseline'}
        - {id: S1-3, content: 'AMEND-1 RE-RUN - k=2 (S_2, armid 3): overflow predicted saturated (~149k hits)', cost: '~27 min baseline'}
        - {id: S1-4, content: 'LOAD-BEARING TRANSITION LOCATOR - k=4 (S_4, armid 4): first measurement; overflow predicted UNSATURATED (prior ~20 hits) - if realized hits > 1024 truncation legal under AMEND-1', cost: '~27 min baseline'}
        - {id: S1-5, content: 'AMEND-1 RE-RUN floor point - k=8 (S_8, armid 6)', cost: '~27 min baseline'}
        - {id: S1-6, content: 'DETERMINISM DOUBLE on an overflow-positive receipt (R3) - (S_1, r5, 1, 1, log2N=20, seed 531001, armid 2, threads 4) twice; byte-identical modulo timing strip set; k=0 fallback pre-registered if realized overflow = 0', cost: 'seconds-minutes, 2 invocations'}
        - {id: S1-7, content: 'post-arm digest re-verification of the table-freeze file + source-diff audit record (post-arm diff vs the re-verified build must be EMPTY)', cost: 'seconds'}
      decides: >-
        The primary-grid readings under AMEND-1 (k=1/2/4/8 + k=16 re-seat), the overflow-path
        determinism double, the post-arm instrument audit. Verdict NOT composed here (branch 5
        requires the second seeds).
    stage_s2:
      batch_shape: one producer, 2 binary invocations, ~1 h wall under the binding baseline
      runs:
        - {id: S2-1, content: 'SECOND SEED k=1 (R6) - (S_1, r5, 1, 1, 2^30, seed 531002, armid 9, threads 4): the frozen 363851 pre-specified replication seat', cost: '~27 min baseline'}
        - {id: S2-2, content: 'SECOND SEED k=4 - (S_4, r5, 1, 1, 2^30, seed 531002, armid 4, threads 4): pre-registered by THIS record at the seat-fixed armid convention (seat armid fixed, seed family varies, mirroring the committed k=16 531001/531002 seed-variance convention); the Coordinator may relabel to a disjoint armid at dispatch at zero cost - the relabel must then appear in the preregistration file', cost: '~27 min baseline'}
      decides: >-
        The verdict-stability (seed-agreement) condition; after S2 the SH2 verdict composes
        from all readings under the ordered cascade.
    budget_honesty: >-
      BINDING BASELINE per the handoff convention carried by 582ea9/026d6a/f8294e: each 2^30
      4-thread arm charged ~27 min; the fallback Gate-0x rebuild ~54 min. Expected total: 9 x
      ~27 min analysis-bearing arms + gates ~= 4.1 h across three producer batches (4 + 8 + 2
      invocations, each batch within the <= 8-run precedent). DECLARED WALL-CLOCK CAP 19800 s
      (5.5 h) total - includes the priced Gate-0x fallback (+~54 min) and headroom; per-batch
      caps S0 5400 s / S1 10000 s / S2 4400 s stamped in each producer's budget_stamps.jsonl;
      maximum_runs 8/8/4; memory_gb 4 (observed RSS ~1.62 MB; no new per-trial storage).
      Measured campaign hardware would run the nine 2^30 arms in ~15-25 min (94-155 s each) -
      flagged OPTIMISTIC-RELATIVE; the binding baseline is the budget contract. Every stage
      boundary is a stopping point with a committed reading (rule 5: budget exhaustion reported
      as such, never as a shape result). NOT budgeted and must not be spent without a new
      Coordinator decision: k=3/5/6 family extension, k=12, third seeds, any 2^32 arm, k=2
      second seed, and the schedule-separated control arm (any pin decision).

  preregistered_decision_rule: >-
    Committed in S0-1 before any arm. ORDERING (BINDING): S0-5 dead anchor is run and ANALYZED
    BEFORE any alive reading; S0-6 ramp-zero anchor before any interior point; within S1 the
    k=16 re-seat is ANALYZED FIRST, then k=1, k=2, k=4, k=8; S2 second seeds after S1; the SH2
    verdict is composed only after ALL arms including second seeds are read, under the cascade
    below. BRANCH CASCADE - exhaustive, evaluated in this FIXED ORDER, which IS the
    branch-precedence clause: (1) SH2-GATE-FAIL: any integrity gate fails (S0-2 build identity
    or its Gate-0x fallback, S0-3 KAT, S0-4 freeze re-verification, S1-6 determinism double,
    S1-7 digest/source-diff, or counter INCONSISTENCY on any analysis-bearing receipt). The
    counter-inconsistency conjunct is AMEND-1 VERBATIM: 'counter INCONSISTENCY on an
    analysis-bearing receipt -> invalid_measurement', where counter inconsistency means
    (a) overflow != hits − threads×HIT_LOG_CAP, or (b) any cap-independent counter (hits, W,
    ewhist_hit) disagrees with its internal identities, or (c) any analysis-bearing quantity is
    derived from the capped detail log rather than the counters. Pure cap truncation of the
    detail log with all counter identities intact is NOT a gate failure. Saturation-aware
    evaluation rule per integrity_gate_amend1 (strictest reading; coincides with the verbatim
    form on saturated receipts). -> invalid_measurement; HALT; repair (rule 5); never evidence
    about shape. (2) SH2-F6: dead anchor reads hits >= 9 -> boundary falsifier of the sealed
    verdict; HALT in-batch flow; escalate to claim-changing review (rule 12); no interior
    reading admitted. (3) SH2-ANCHOR-FAIL: k=0 re-seat fails (hits != 2^30, or any nontrivial
    trial with W != 3, or excess ratio != 1.0) -> F3 ramp-anchor indictment; HALT; no interior
    reading admitted; never evidence about shape (rule 5). (4) SH2-RESEAT-FAIL: k=16 re-seat
    reads outside [6, 30] -> F5 indictment of THIS batch's table path (committed measurements
    stand); HALT; interior readings recorded but no shape verdict composed; repair. (5)
    SH2-SEED-DISAGREE: branches 1-4 not fired AND (second-seed band at k=1 != primary-seed band
    at k=1, OR second-seed band at k=4 != primary-seed band at k=4) -> NO shape verdict
    composed; seed instability at a load-bearing point recorded with both per-seed tuples; a
    k=1 disagreement (a >2-order swing at the predicted magnitude) is additionally flagged as
    an instrument-level alarm; named successors: third seed at the disagreeing point and/or
    2^32 arm and/or instrument review; Coordinator re-rank. (6) SH2-DEAD-INTERIOR: h(1) <= 5
    AND h(2) <= 5 AND h(4) <= 5 AND h(8) <= 5 (primary-seed readings) -> no hit-count excess
    at any tested interior point; the r=5 count excess does not survive dilution within the
    tested family (it exists only at or near k=16, which passed the re-seat gate); the k=1
    conjunct is scoped as the JOINT EFFECT of the schedule switch and the first dilution step
    (schedule decision block); recorded with per-point floors and named successors (k=12 finer
    dose near the full table; schedule-separated control under a new pin if adopted). (7)
    SH2-NONMONO: not SH2-DEAD-INTERIOR, and the band sequence over {1, 2, 4, 8, 16} is
    BAND-RISING (some k_a < k_b with bandrank(h(k_b)) > bandrank(h(k_a))) -> non-monotone
    curve, recorded as measured with the rise located; named successor (family-extension point
    inside the rise interval, or instrument review if the rise is k=8 NULL -> k=16 RESIDUAL,
    which also trips F5-adjacent scrutiny of the midpoint table path). (8) SH2-MONOTONE-DECAY:
    band sequence non-rising AND h(1) >= 100 AND h(4) <= 40 -> the count excess at THRESHOLD
    at the minimal dose decays with dilution to RESIDUAL-or-below by k=4; tunable-dose reading
    within tested scope; transition localized: (2,4] if h(2) >= 100; (1,2] if h(2) <= 40;
    ambiguous-at-k=2 if h(2) in 41-99 (recorded); count-level localization reported per tier-2
    disjoint-CI pair; named successors: family extension to sub-localize the located interval
    (k=3/5/6, Coordinator decision), schedule-separated k=1 control (pin question), layer
    autopsy (IDEA-20260901-69912d) consumes the localization. (9) SH2-PLATEAU: band sequence
    non-rising AND h(1) >= 100 AND h(4) >= 100 -> the count excess persists at THRESHOLD
    through k=4 (persistence plateau); first band drop at or after (4,8]: transition reported
    in (4,8] if h(8) <= 40, in (8,16] if h(8) >= 100, ambiguous-at-k=8 if h(8) in 41-99
    (recorded); named successors: family extension or k=12 inside the located interval
    (Coordinator re-rank), schedule-separated control (pin question). (10) SH2-RESIDUAL:
    DECLARED COMPLEMENT - any outcome matching none of the above, never force-binned.
    Enumerated expected subcases: (a) h(1) in 41-99 (ambiguity at the minimal dose); (b) h(1)
    >= 100 with h(4) in 41-99 (ambiguity at the locator); (c) h(1) <= 40, not DEAD, band
    non-rising - the residual-level-from-first-dose curve (the 582ea9 SH-STEP / global-
    fragility outcome; a minority reading at the realized regime, a determinate complement
    outcome here); (d) any remaining pattern. Named successors per subcase: (a)/(b) third seed
    at the ambiguous point at 2^30 and/or one 2^32 arm at that point, Coordinator re-rank;
    (c) 2^32 k=1 arm and/or schedule-separated control under a new pin; (d) record as
    measured, Coordinator re-rank. Budget halts are resource_exhaustion, NEVER readings
    (rule 5). Per-point tuples, the joint-effect scoping rule, the paraphrase discipline, and
    the no-reopen clause apply in EVERY branch.

  branch_precedence_clause: >-
    RESTATED STANDALONE (mandatory clause, f8294e precedent carried): this record's decision
    rule is an EXHAUSTIVE ORDERED CASCADE (SH2-GATE-FAIL > SH2-F6 > SH2-ANCHOR-FAIL >
    SH2-RESEAT-FAIL > SH2-SEED-DISAGREE > SH2-DEAD-INTERIOR > SH2-NONMONO > SH2-MONOTONE-DECAY
    > SH2-PLATEAU > SH2-RESIDUAL) committed in S0-1 before any arm runs. By construction no
    two branches can be assigned the same outcome: branches 1-4 are halt conditions preceding
    all verdict composition; branch 5 consumes any seed-disagreement outcome before any shape
    branch composes; branches 6-9 are mutually disjoint on their conjuncts (SH2-DEAD-INTERIOR
    requires all four interior h <= 5; SH2-NONMONO requires a band rise AND not-DEAD and
    precedes the monotone-conditional branches; SH2-MONOTONE-DECAY requires h(4) <= 40 while
    SH2-PLATEAU requires h(4) >= 100, both under h(1) >= 100 and band non-rising);
    SH2-RESIDUAL is the declared complement. This cascade is RE-AUTHORED for the realized
    regime, not an amendment of the 582ea9 cascade (which remains bound to BATCH-7b798d,
    immutable); AMEND-1 governs the branch-1 rescoping, and the red-team J6 vacuity finding is
    answered by making the k=4 locator - not the vacuous band-non-rising conjunct - the branch
    selector between MONOTONE-DECAY and PLATEAU. The clause binds this record's own rule and
    is carried verbatim into the S0-1 preregistration file.

  cascade_overlap_check: >-
    CHECKED THIS SESSION against every curve shape the grid {1,2,4,8,16} can produce, including
    non-monotone ones (bandrank tuples over the 5 points with h(16) constrained to rank 1 by
    the re-seat gate). FINDINGS: (1) The DEAD tuple (0,0,0,0,1) is literally BAND-RISING
    (k=8 -> k=16 rank 0 -> 1), so SH2-DEAD-INTERIOR's outcome set intersects SH2-NONMONO's
    literal conjuncts; resolved by branch order (6 before 7) plus the explicit not-DEAD clause
    in branch 7 - the same documented resolution form the 582ea9 cascade used (SH-DEAD before
    SH-OTHER-NONMONO), inherited deliberately. (2) NONMONO vs branches 8/9: disjoint by
    conjunct, not merely by order - branches 8 and 9 carry explicit band-non-rising conjuncts.
    (3) Branches 8 vs 9 disjoint on h(4) <= 40 vs h(4) >= 100; h(4) in 41-99 falls to the
    complement by design. (4) Branch 5 vs 6-10: ordering resolves; a seed-disagreement outcome
    never also composes a shape verdict. (5) Non-monotone shapes spot-checked to branch 7:
    (3,0,1,1,1) rise at 2->4; (3,3,0,2,1) rise at 4->8; (0,3,3,1,1) rise at 1->2; (2,2,3,1,1)
    rise at 2->4; (0,0,0,0,1) absorbed by branch 6 first - all assigned uniquely. (6) VACUITY
    AUDIT (J6 inherited, disclosed not smoothed): when h(1) >= 100 the bandrank of k=1 is
    already maximal, so the band-non-rising conjuncts of branches 8/9 are AUTOMATICALLY
    satisfied and do NO selection work on that path - branch selection between 8/9/10(b) is
    done by the k=4 locator band alone; the conjuncts are retained for preregistration
    continuity and the vacuity is stated in the record. SH2-NONMONO is NOT vacuous at h(1) >=
    100: a rise among points k >= 2 (e.g. h(2) NULL -> h(4) RESIDUAL) remains possible and
    fires branch 7. (7) No reachable double assignment under ordered evaluation; the
    complement guarantees exhaustiveness.

  replication_determinism_plan: >-
    REPLICATION (R6): second seeds at k=1 (frozen 363851 armid-9 seat, seed 531002) and at k=4
    (this record's pre-registered seat, seed 531002), chosen because those are the two points
    whose readings select branches or carry the largest magnitude; per-seed readings, never
    pooled; band agreement is the pre-registered verdict-stability condition (branch 5);
    exact-rate comparisons at agreed bands report seed variance with propagated Garwood CIs.
    k=2/k=8/k=16 are single-seed in this design (priced successors, never smoothed).
    DETERMINISM (R3): the double runs at k=1, log2N=20 (overflow-positive in fact, predicted
    ~1.2e4 hits -> overflow ~1.1e4), exercising the truncation path the BATCH-7b798d double
    (0 hits at log2N=20) left untested; byte-identity modulo the preregistered timing strip
    set; counter identities verified on the double receipt; k=0 fallback overflow-positive by
    construction if the k=1 double receipt realizes overflow = 0 (rule-8 recorded). The legacy
    non-overflow double path is inherited transitively (byte-identical build passed it in
    BATCH-7b798d) and is not re-spent.

  test_boundary: >-
    Toy tier; r=5 for all ramp arms (one r=6 known-dead reference arm); the frozen nested
    position family S_k, subset {0, 1, 2, 4, 8, 16} - not the space of all S-boxes and not
    even all family points (k=12 reserved; k=3/5/6 require family extension, named
    successors); one probe cell (amask=1, smask=1); bijective tables only by construction; one
    key per seed family under PIN-T0 (the reading is about the cipher-with-pinned-schedule,
    stated; schedule-separated statements out of scope until the pin-question successor); the
    modified ciphers actually run, never AES beyond its own seat. The strongest licensed
    sentences: 'within the tested nested position family at the pinned probe cell, the r=5
    hit-count excess decays monotonically from THRESHOLD at the minimal dose to
    residual-or-below by k=4, with the transition in (2,4] or (4,8]' (if SH2-MONOTONE-DECAY),
    '...persists at THRESHOLD through k=4' (if SH2-PLATEAU), '...does not survive dilution at
    any tested interior point' (if SH2-DEAD-INTERIOR, joint-effect-scoped at k=1), '...is
    non-monotone with the rise at (located pair)' (if SH2-NONMONO) - NEVER 'any S-box', never
    a carrier sentence about e, never a rho-exclusion sentence, never a dilution-only
    attribution of h(1), never anything about full-round or deployed AES; no published-frontier
    comparison in either direction (R3).

  falsification_conditions:
    - >-
      FX1 (MAIN SHAPE FALSIFIER - falsifies the early-transition tunable-dose reading).
      SH2-PLATEAU fires: the excess persists at THRESHOLD through k=4. Then the transition
      does NOT sit in (2,4]; the early-transition decay reading is falsified within the tested
      scope and the persistence variant holds to k=4, with the located late transition naming
      the successor dose resolution. Complete result.
    - >-
      FX2 (MAIN SHAPE FALSIFIER - falsifies monotone decay). SH2-NONMONO fires: a band rise
      somewhere in the interior. Then monotone decay is falsified within the tested scope; the
      located rise names the successor (family extension inside the rise, or instrument review
      for the k=8 NULL -> k=16 RESIDUAL rise). Complete result.
    - >-
      FX3 (MAIN SHAPE FALSIFIER - falsifies survival-under-dilution). SH2-DEAD-INTERIOR fires:
      no excess at any tested interior point (joint-effect-scoped at k=1). Then the r=5
      hit-count excess does not survive dilution at any tested interior point within the
      per-point floors; the 5-order k=1 observation is superseded by this batch's own reading;
      M3-flavored and below-floor readings re-open, separated only by the named k=12
      successor. Complete result.
    - >-
      FX4 (OBSERVATION FALSIFIER). The batch's own k=1 or k=2 reading departs from the
      BATCH-7b798d observation by more than seed variance (e.g. reads below THRESHOLD): the
      design-time priors are falsified as predictions (they were never evidence), the cascade
      handles the realized readings, and the departure is recorded per rule 8 with the
      instrument gates re-examined.
    - >-
      FX5 (BLOCKING - ramp anchor). F3: k=0 re-seat fails -> invalid_measurement; halt;
      repair (rule 5). Cross-field: indicts the frozen build's identity path against the
      committed affine anchor.
    - >-
      FX6 (BLOCKING - gate/instrument, AMEND-1 form). Build identity fails (and the Gate-0x
      fallback fails), KAT pins fail, freeze re-verification fails, the overflow-positive
      determinism double fails, the post-arm digest/source-diff audit fails, or COUNTER
      INCONSISTENCY on any analysis-bearing receipt (AMEND-1 verbatim conjunct) ->
      invalid_measurement; repair (rule 5); never evidence about shape. Repair route named:
      instrument repair under the frozen lineage, or return to idea generation for a new
      instrument as a NEW proposal (lineage change = new frozen spec).
    - >-
      FX7 (ESCALATION TRIPWIRE, not a defect). F6: dead anchor >= 9 hits - boundary falsifier
      of the sealed verdict; halt, record, escalate to claim-changing review (rule 12).
    - >-
      FX8 (REPLICATION FALSIFIER). SH2-SEED-DISAGREE fires: the band structure at a
      load-bearing point is seed-unstable; no shape verdict composes; the instability itself
      is the scoped finding with named successors.
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); an ambiguity-band reading at k=1 or k=4
      (determinate SH2-RESIDUAL subcase with named successor, never a defect); within-band
      inversions (below declared tier-1 resolution); timeouts/crashes (rule 5); underpowered
      per-point readings below the declared floors (recorded, never tested beyond the band
      rule); a seed-disagreement at k=4 between two RESIDUAL-adjacent bands is a finding, not
      an instrument defect.

  controls:
    - >-
      DEAD-ARM ANCHOR AT MATCHED EXPOSURE, ANALYZED FIRST (inherited, re-seated at seed
      531004): the proves-too-much control for the COUNT observable - a table path or
      instrument that manufactures hits where the campaign sealed death is caught before it can
      manufacture a shape. Anchor power limit disclosed (committed r=6 rates 2-4 per 2^30; a
      0-hit re-seat passes direction-safe at reduced assurance, inherited precedent).
    - >-
      RAMP-ZERO BLOCKING ANCHOR (inherited): the k=0 identity re-seat (probability 1 per
      trial, W = 3, excess ratio 1.0 exact) in the same instrument as the interior points: an
      instrument that cannot reproduce its own zero measures nothing.
    - >-
      KNOWN-ALIVE IN-BLOCK RE-SEAT, ANALYZED FIRST WITHIN S1 (inherited): the k=16 seat must
      land in [6, 30] before any interior reading enters the verdict - polices the table path
      at the endpoint where committed readings exist; F5 on failure.
    - >-
      BUILD IDENTITY RE-VERIFICATION WITH PRICED GATE-0X FALLBACK: the frozen build must be
      byte-identical (sha256) to the BATCH-7b798d snapshot-certified build before any reading
      arm; behavioral re-proof (Gate-0x field-exact rebuild) is the priced fallback - together
      they police that ZERO instrument change enters this batch.
    - >-
      AMEND-1 COUNTER-IDENTITY SUITE ON EVERY ANALYSIS-BEARING RECEIPT: the integrity gate is
      also a control - ewhist_hit, an entirely uncapped second counter, corroborates h on
      every receipt, and the full identity list is checked per receipt (integrity_gate_amend1).
    - >-
      OVERFLOW-POSITIVE DETERMINISM DOUBLE (R3): the truncation path is determinism-tested
      where it actually fires (predicted overflow ~1.1e4 at k=1 log2N=20; k=0 fallback
      overflow-positive by construction).
    - >-
      SECOND-SEED VERDICT-STABILITY CONDITION (R6): the shape verdict composes only after band
      agreement at k=1 and k=4 across seeds; disagreement is a declared branch, never absorbed.
    - >-
      JOINT-EFFECT SCOPING AS THE SCHEDULE CONTROL (R4): the schedule-clean interior grid is
      its own control - every branch conjunct is an interior-to-interior comparison at fixed
      AES schedule; the single confounded step (k=0->k=1) is excluded from attribution and
      enters only as the anchor's zero; the separated control arm survives as the priced
      pin-question successor.
    - >-
      FROZEN TABLE-FREEZE RE-VERIFICATION: all interior tables are pinned by the committed
      R3_table_freeze.json (digests, bijection, nestedness, cross-k nesting); the freeze is
      re-run pre-arm and re-verified post-arm - no data-dependent table choice anywhere.
    - >-
      NO-REOPEN CLAUSE FOR THE CLOSED LANE (inherited): the X statistic is not tested,
      decided, or reported as a reading at any point; the instrument's e fields ride as
      enabling artifacts only. The t=1 frontier rho_80 = 0.1183 is carried as the standing
      sensitivity-floor control reading of the closed lane, reported beside the shape verdict,
      never merged (paraphrase discipline enforced).
    - >-
      SEED-DISCIPLINE (inherited): readings per seed, never pooled; ramp arms on the frozen
      armid streams at seed 531001; second seeds at 531002; dead anchor at 531004; the
      committed 531001/531002/531003 data enter only as endpoint references and power
      calibration, never as confirmatory interior evidence.
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST (inherited): bands, cascade with precedence clause,
      AMEND-1 gate verbatim, anchor order, seat tuples, admissible/inadmissible lists,
      scoping rule, resolution rule, floors, seed-disagreement rule, and the no-reopen clause
      committed write-once in S0-1 with mtime BEFORE the first arm, re-verified post-arm.

  confounders:
    - >-
      SCHEDULE CONFOUND AT k=1 (R4, handled by joint-effect scoping): under PIN-T0 the
      k=0 -> k=1 step co-varies the first dilution step with the identity->AES schedule
      switch; every k=1 statement is joint-effect-scoped; interior-to-interior comparisons are
      schedule-clean (the schedule is constant across k >= 1); the separated control is the
      named successor under a new pin. Stated, not absorbed.
    - >-
      OBSERVATION-AS-PRIOR RISK: every design-time power number is built on the unvalidated
      BATCH-7b798d observations; if they are wrong the priors are wrong, but the cascade is
      prior-free (branches are defined on realized readings, not on priors) and every prior
      usage is flagged in-line. The batch's verdict never composes from the prior
      observations.
    - >-
      SEED VARIANCE AT UNSEEDED POINTS: k=2/k=8/k=16 are single-seed; the committed k=16 seed
      variance is +/-16% (14 vs 19); the band-level conjuncts are robust to that scale at k=2
      (~ -350 sd against the THRESHOLD boundary) and at k=8/k=16 (band [6,30] headroom);
      floor-magnitude comparisons are declared unresolved, and k=2/k=8/k=16 seed variance is
      a priced successor, never smoothed.
    - >-
      PER-POINT RESOLUTION CEILING (inherited, re-priced): within-RESIDUAL trends are below
      the 2^30 per-point resolution; the tier-2 disjoint-CI rule declares exactly which
      consecutive comparisons are count-resolved; anything finer is priced in the obstruction
      block. Any claim finer than the declared tiers from this design's data is out of scope.
    - >-
      ANCHOR POWER LIMIT (inherited, requantified): the dead anchor at ~0-4 expected hits
      catches systematic hit manufacture (the failure mode that matters for a count
      observable), not subtle rate miscalibration; disclosed; the k=16 re-seat band [6,30] is
      the second guard.
    - >-
      POSITION-FAMILY SPECIFICITY (inherited): one frozen nested family; the dose label k does
      not isolate WHICH positions matter (the stratified order deliberately does not pursue
      that coordinate - family extension and the layer autopsy are the successor lanes;
      GRADUAL-flavored located transitions feed IDEA-20260901-69912d).
    - >-
      SHARED-HARNESS BUGS CONDITIONAL ON THE TABLE PATH (inherited): all ramp arms share the
      widened table-driven path; build identity + KAT pins + source-diff audit + freeze
      re-verification are the in-record mitigation; the cross-lineage battery
      (IDEA-20260901-02f7c4 B3) remains the programme-level mitigation, not discharged here.
    - >-
      NULL-RATE DRIFT AT INTERIOR POINTS (inherited): the analytic null lambda_0 = 1.0 is
      pinned at the endpoints; at interior points the accidental-hit rate is recomputed
      run-internally from the arm's own class counters and reported beside the design-rate
      value; the bands are stated at the design rate and the executor reports any
      realized-null shift (disclosed, never smoothed).

  interpretation_limits:
    - >-
      claim_tier toy. A shape verdict licenses a sentence about the COUNT curve within the
      tested nested position family at the pinned probe cell and PIN-T0 - never 'any S-box',
      never a carrier sentence about e, never a rho-exclusion, never a dilution-only
      attribution of h(1), never anything about full-round or deployed AES.
    - >-
      A shape verdict does NOT explain the MAGNITUDE of the k=1 excess (if validated), does
      NOT decompose schedule from table at k=1 (the pin question stands), does NOT resolve the
      floor's magnitude (priced obstruction), and does NOT revive the carrier clause in any
      form: the excess-zero lane stays closed at t=1, and 'the count is alive' is explicitly
      compatible with 'the zero-byte content is dead' - the two observables are independent
      and the record never merges them.
    - >-
      The BATCH-7b798d readings remain observations even if this batch reproduces them: the
      verdict composes from THIS batch's arms under AMEND-1; reproduction within seed variance
      is reported as agreement between the two records, never pooled into one evidence base.
    - >-
      The campaign-level carrier-closure standard and the pooled adjudication of rho < rho_50
      are untouched by this record; RANK 6 of DEC-20260901-6f9de3 remains gated on a proposal
      showing it dominates the shape-only route (domination checked below: it does not
      dominate for this question).
    - >-
      No published-frontier comparison in either direction (R3); recalled references are
      pointers, never support. Timeouts, crashes, infrastructure failures are never negative
      mathematical evidence (rule 5).

  paraphrase_discipline:
    status: BINDING on this record and every downstream citation of this batch (R8, inherited from EV-AES-f2da41 OBS-7 and RT2-E)
    never_say:
      - never 'ramp closed' or any closure sentence about the ramp-shape question beyond the scoped branch verdict
      - never a carrier sentence about e; never 'zeros again'; never report X-lane fields as readings
      - >-
        never a decay/survival sentence citing the BATCH-7b798d readings as validated evidence
        (they are observations; only THIS batch's own AMEND-1 readings may support such a
        sentence)
      - never an attribution of h(1) or the k=0->k=1 drop to dilution per se (joint-effect scoping)
      - >-
        never 'extinction by k=8' or 'floor reached at k=8' drawn from within-band comparisons
        (below declared resolution, single seed)
      - >-
        never present overflow at k=1/k=2 as a gate failure under AMEND-1 (the gate is counter
        inconsistency), and never present AMEND-1 as a retroactive validation of the
        BATCH-7b798d readings (no post-hoc rescue; the amendment is prospective only)
      - never present the k=4 arm as refinement (it is the load-bearing transition locator)
    always_carry_scope: >-
      cell (amask=1, smask=1), r=5, PIN-T0, 2^30 per point, frozen family subset
