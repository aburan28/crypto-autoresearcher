  title: |-
    Solinas number fields - does small root discriminant of K_f = Q[t]/(f) give E(K_f) anything a random field lacks?
  class: measurement
  claim: |-
    Over toy analogues p = f(2^k) prime with the four NIST f shapes and random low-weight f, rank E(K_f) - rank E(Q), the minimal new-point height divided by log p, and coverage of E(F_p) by K_f-points of height <= 20 log p all match random f of the same degree and coefficient bound within sampling error, and coverage is uncorrelated with the root discriminant of K_f. Alive if the coverage exponent on Solinas f exceeds the random-f null by > 0.2 across >= 3 primes.
  mechanism: |-
    Generalized Mersenne primes are p = f(2^k) for a low-weight f (P-192: t^3 - t - 1 at 2^64; P-224: t^7 - t^3 + 1 at 2^32; P-256: t^8 - t^7 + t^6 + t^3 - 1 at 2^32; P-384: t^12 - t^4 - t^3 + t - 1 at 2^32). K_f = Q[t]/(f) has small discriminant and a degree-one prime of norm p (t -> 2^k): it is the SNFS field for F_p^*. Small root discriminant means unusually many algebraic integers of small height, the resource a lift would want. The question is whether E(K_f) inherits anything (rank, height of new points, residues covered) relative to a random field of the same degree and coefficient size. F1 is the special case f = t^d - c.
