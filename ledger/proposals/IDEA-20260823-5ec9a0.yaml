    "claim": "Formula-level candidate only: in the reduced occurrence algebra, exact coefficient-tensor convolution followed by axiswise reduction modulo the public f_i gives a named separated binary-powering recurrence for g_R^(p-1); Newton-sum trace vectors give a charged contraction for all weighted Krylov values; and, if the target-specific squarefree minimal polynomial mu_R=Z h_R is actually constructed, e_R=h_R(g_R)/h_R(0) gives exact labelled source moments. The declared dense-coefficient/canonical-exact-recompression family is selected for REVISE, not dispatch: its target state includes d_R+1 recurrence coefficients and d_R values per requested weight, where d_R=deg(mu_R)=|image(g_R)|, and no source establishes the required d_R or exact recompression-rank envelope. Ordinary trace also fails to encode nilpotent source jets in the required nonreduced nearby-object control. This is not an impossibility claim for other representations.",
    "mechanism": {
      "algebra": "A=k[T_1,...,T_5]/(f_1(T_1),...,f_5(T_5)); distinct occurrence codes make each f_i squarefree and A reduced.",
      "coefficient_recurrence": "Write U=sum_a u_a T^a and V=sum_b v_b T^b in the rectangular monomial basis. Form c_gamma=sum_{a+b=gamma}u_a v_b. For each axis i let D_i[beta,gamma] be the unique public remainder coefficient [T_i^beta](T_i^gamma mod f_i). Then Mul_f(U,V)_beta=sum_gamma c_gamma product_i D_i[beta_i,gamma_i]. Exact canonical recompression is allowed only when its factors reconstruct every coefficient and its rank/pivots are recorded.",
      "binary_powering": "For bits epsilon_l of p-1 from least to most significant, b_0=g_R,z_0=1; b_{l+1}=Mul_f(b_l,b_l); z_{l+1}=Mul_f(z_l,b_l) when epsilon_l=1 and z_l otherwise. Every multiplication includes exact reduction and exact reconstruction-certified recompression. chi_R=1-z_final.",
      "charged_trace": "Precompute tau_i(m)=Tr_{k[T_i]/(f_i)/k}(T_i^m) from the coefficients of f_i by Newton identities. For U=sum_a u_a T^a, Tr_A(U)=sum_a u_a product_i tau_i(a_i). No Trace primitive is free.",
      "projector_recurrence": "For mu_R(Z)=Z^d+c_{d-1}Z^(d-1)+...+c_0, every weighted sequence s_{alpha,j}=Tr_A(T^alpha g_R^j) obeys s_{alpha,j+d}+sum_{q=0}^{d-1}c_q s_{alpha,j+q}=0. When mu_R=Z h_R with h_R(0) nonzero, Lambda_{R,alpha}=h_R(0)^(-1) sum_{q=0}^{d-1}h_q s_{alpha,q}.",
