idea:
  id: IDEA-20260816-4a70f7
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: 'Leakage on an arbitrary position set rather than a contiguous window: measure the contiguous-equivalent
    bit count of random subsets, arithmetic-progression subsets, and block-interleaved subsets of
    the prime''s bit positions, at moduli small enough for exhaustion to certify every cell.'
  class: representation
  claim: '(A) The textbook object in partial-information recovery is a contiguous window of known
    bits, high or low, because a contiguous window makes the unknown part a single small integer and
    the target polynomial univariate. A position set that is not contiguous is a genuinely different
    object: it splits the unknown into several small integers whose positions determine how many variables
    the polynomial has and what box constrains them, and the number of leaked bits alone does not
    determine it. (B) Define, for a position set P of size k at modulus size n, the contiguous-equivalent
    count c(P) as the number of bits in a contiguous window that achieves the same measured r_hat
    under the same construction family and the same budget. The claim is that c(P) is strictly less
    than k for every non-contiguous P tested, that the deficit k - c(P) grows with the number of maximal
    runs in P rather than with k itself, and that the deficit is measurable and stable at moduli where
    exhaustion independently certifies whether recovery was possible at all. (C) The claim includes
    a specific ordering: at equal k and equal number of runs, an arithmetic-progression position set
    with small common difference should behave worse than a block-interleaved set with the same run
    count, because the former forces a variable per residue class while the latter concentrates the
    unknown into few blocks. This ordering is the falsifiable content. (D) WHAT IS NOT CLAIMED: no
    attack and no security consequence; a leakage pattern this campaign supplies to itself is not
    a claim that any channel leaks that way, and no assertion is made that non-contiguous leakage
    occurs in any real system. No claim is made that the multivariate construction used for split
    positions is optimal, so a large deficit may be a property of the chosen construction rather than
    of the position set, and the design''s controls are what separate the two. No claim is made about
    position sets larger than those tested or about moduli beyond the tested range.'
  mechanism: 'Stage 1: define the position-set families exactly - contiguous baseline, random subset
    at fixed k, arithmetic progression with common difference in a declared list, and block-interleaved
    with a declared block length and run count. Stage 2: for each position set, mechanically derive
    the target polynomial system: the unknown bits between known runs become separate small integers,
    each with an explicit box bound, so the system is multivariate with a known Newton polytope, and
    the construction is instantiated by a declared rule rather than tuned per set. Stage 3: generate
    known-answer instances, reveal exactly the bits in P, and measure r_hat as the largest k at which
    recovery succeeds on at least 90 percent of the seeded sample, with everything else fixed. Stage
    4: invert the contiguous baseline curve to convert each r_hat into c(P). Stage 5: at n at most
    96 with total unknown at most 24 bits, run full exhaustion over the unknown positions to certify
    per cell whether recovery was possible in principle, which separates a construction failure from
    an information-theoretic one. Refutation route: if c(P) equals k within resolution for random
    subsets, the contiguity of the window is irrelevant at these sizes and the claim is dead; that
    outcome is itself a clean measured statement.'
  novelty_status: unverified
  novelty_screen:
    method: 'Base bucket screen. Additionally: grep -ril ''non-contiguous'' over ledger/proposals/
      returned 0 files; grep -ril ''noisy leakage'' returned 0 files; grep -rih for ''window'', ''leakage'',
      ''partial key exposure'' across ledger/proposals/ and reading the matching lines; read RQ-RSA-d46f02''s
      targets block in full, which names partial key exposure from known most- or least-significant
      bits and does not name any non-contiguous pattern.'
    results: ZERO proposals in the corpus contain the string non-contiguous, and zero contain noisy
      leakage. Windowed objects appear in the ECDLP lane, where KN-TECH-015 describes windowed Semaev
      relation finding and IDEA-20260808-e2315e uses a windowed decomposition; in both cases the window
      is a box in field coordinates, not a set of bit positions of a secret prime, and the tracked
      object is a relation, not a leakage pattern. RQ-RSA-d46f02 names most- and least-significant-bit
      leakage only. Nothing in the corpus defines a contiguous-equivalent bit count or varies the
      shape of a leaked position set.
    verdict: 'UNVERIFIED. Nothing asserted about external literature. Claimed new relative to this
      repository: the leaked position set as a first-class object with a declared family structure,
      and the contiguous-equivalent count c(P) as the reported quantity, with run count rather than
      bit count as the proposed explanatory variable. Assembled from known parts: multivariate small-root
      construction (KN-TECH-015), the known-answer discipline of RQ-RSA-d46f02, and the exhaustion
      cross-check made available by small moduli.'
  object_first_candidate:
    tracked_object: The leaked position set P as a subset of bit positions, carried together with
      its run decomposition - the number of maximal runs, their lengths, and the lengths of the gaps
      between them - and the measured c(P).
    lossiness: Genuinely lossy. The full state is the entire assignment of known and unknown bits,
      that is the leaked VALUES and their positions. The tracked object discards every value and keeps
      only the positions, and then further projects the positions onto the run decomposition. That
      discard is compatible with the target operation because the construction's shape - how many
      variables, what box bounds - is determined by the run decomposition alone and not by the values;
      the values enter only as coefficients. The retained part therefore propagates deterministically
      into a polynomial system. What the projection to run decomposition additionally discards, namely
      where the runs sit within the prime, is NOT obviously irrelevant, since a run at the top of
      the prime and a run at the bottom enter the modular relation differently. That is a known incompleteness
      of the projection and it is why position-of-run is retained as a secondary variable rather than
      dropped.
    propagation: 'One step of the target operation is adding one bit to P or moving one bit within
      P. Adding a bit inside an existing run shortens a gap and shrinks one box bound, which should
      improve reach smoothly. Adding a bit that splits a gap creates a new run and a new variable,
      which should hurt: the dimension needed grows and the determinant grows faster than the box
      shrinks. The object propagates as a run decomposition that changes discretely, and the prediction
      is that reach is piecewise smooth with downward jumps exactly at run-creating steps.'
    survival_score: The run decomposition should survive as a sufficient description while the number
      of runs is small, and dissolve once the number of variables makes the required lattice dimension
      exceed the budget - concretely, expected to survive to about four runs at n = 128 within a 900-second
      per-instance cap, and to become budget-bound rather than structure-bound beyond that. The dissolution
      point is itself the measurement.
  null_object_control: 'The identical measurement runs against a null in which the position set is
    identical but the revealed VALUES are drawn uniformly at random rather than taken from the true
    prime. Every arm must fail at every k, with an exact binomial upper bound. This is the control
    that makes c(P) mean anything: without it, a construction that appears to recover at large k might
    be recovering from the modulus alone. A second null holds the values true and permutes them among
    the positions of P, preserving the multiset of revealed bits and destroying the position assignment,
    which must also fail. A third arm is the information-theoretic null at n at most 96: exhaustion
    over all assignments of the unknown positions, which certifies whether any method could have recovered
    in that cell, so that a lattice failure is separable from an underdetermined instance.'
  discriminated_from:
  - 'Entry one of this bucket: measures reach for the contiguous window as a function of modulus size.
    This entry holds size fixed and varies the SHAPE of the leaked position set, and uses entry one''s
    contiguous curve only as the yardstick for converting r_hat into c(P).'
  - 'KN-TECH-015 and IDEA-20260808-e2315e windowed objects: those windows are boxes in field coordinates
    for Semaev relations, not sets of bit positions of a secret prime; different object, different
    operation, different setting.'
  - 'Entry five of this bucket (noisy leakage): that entry keeps the position set contiguous and corrupts
    the VALUES. Here the values are exact and the positions are the variable. The two nulls are deliberately
    arranged so that each entry''s design is the other''s control.'
  - 'A generic multivariate small-root experiment: this entry does not ask how well a multivariate
    construction performs in the abstract; it asks how the achievable bit count degrades as a declared
    position-set family departs from contiguity, with the contiguous arm run in the same invocation
    as the yardstick.'
  - 'Hidden-number-problem style partial-nonce work elsewhere in this repository: those track a modular
    linear relation with a bounded unknown per signature and aggregate across many samples. Here there
    is a single instance and a single secret with a structured position set, and no aggregation across
    samples exists.'
  assumptions:
  - A mechanical rule can derive a multivariate small-root system from an arbitrary run decomposition
    without per-set tuning; if it cannot, the comparison is confounded by human choice and the design
    fails.
  - The contiguous baseline curve is dense enough in k to invert into c(P) without interpolation error
    larger than the resolution floor.
  - At n at most 96 the exhaustion arm terminates within cap, requiring total unknown at most 24 bits.
  - The number of runs is the dominant explanatory variable; run positions are recorded so that this
    assumption is testable rather than assumed.
  predictions:
  - metric: c(P) for random subsets at fixed k, relative to k
    direction: lower
    minimum_effect: 'Forced value: c(P) <= k - 1 for every random subset with at least two runs. A
      stronger numeric deficit is not pre-committed because the size of the deficit is what the run
      measures.'
  - metric: deficit k - c(P) as the number of runs increases at fixed k
    direction: higher
    minimum_effect: 1.0
  - metric: c(P) for an arithmetic-progression set versus a block-interleaved set at equal k and equal
      run count
    direction: lower
    minimum_effect: 1.0
  - metric: random-value null recovery rate in every arm
    direction: lower
    minimum_effect: 0.0
  - metric: agreement between the lattice arm's failures and the exhaustion arm's certification at
      n <= 96
    direction: different
    minimum_effect: No pre-committed rate. The point of the exhaustion arm is to partition failures
      into information-theoretic and construction-bound, and the split is the result.
  minimal_test:
    design: 'Fix n = 96 so that exhaustion is available in the same run. Fix k at a single value near
      the contiguous baseline''s threshold. Run five position-set arms in one invocation: contiguous
      baseline, random subset with two runs, random subset with four runs, arithmetic progression
      with common difference two, and block-interleaved with four blocks. Use 40 paired known-answer
      instances per arm from recorded seeds. For each arm measure success at the fixed k, then bisect
      on k to obtain r_hat and hence c(P) against the contiguous arm measured in the same invocation.
      Run the random-value null and the permuted-value null across all five arms, and run the exhaustion
      arm on every instance so that each cell is certified. This discriminates because if c(P) equals
      k for the two-run random subset within resolution, the whole claim is refuted in one cell, and
      because the exhaustion arm makes every failure attributable. Expected cost a few CPU-hours plus
      bounded exhaustion.'
    controls:
    - 'Random-value null: same positions, wrong values, must fail in every arm, same invocation.'
    - 'Permuted-value null: true values, permuted positions, must fail.'
    - Contiguous baseline arm measured in the same invocation as the yardstick, not imported from
      another run.
    - Exhaustion arm at n <= 96 certifying information-theoretic recoverability per cell.
    - 'Run-count-matched pairs: arithmetic-progression and block-interleaved arms are compared only
      at equal k and equal run count.'
    required_metrics:
    - r_hat in k per position-set arm with exact binomial interval
    - c(P) per arm, obtained by inverting the same-invocation contiguous curve
    - deficit k - c(P) per arm
    - 'run decomposition per position set: run count, run lengths, gap lengths, run positions'
    - lattice dimension and exact log determinant per arm
    - exhaustion certification per cell at n <= 96
    - null-arm recovery rate with exact binomial upper bound
  falsification_conditions:
  - 'c(P) equals k within resolution for every non-contiguous arm: the contiguity claim is refuted
    at these sizes.'
  - 'The deficit does not increase with run count at fixed k: the proposed explanatory variable is
    wrong and the residual must be attributed elsewhere, with run position as the first candidate.'
  - 'The arithmetic-progression arm outperforms the block-interleaved arm at matched k and run count:
    the ordering prediction is refuted.'
  - 'Any null arm recovers: the run is void.'
  - 'Exhaustion certifies a cell as unrecoverable while the lattice arm reports success there: a generator
    or verifier bug, run void.'
  confounders:
  - The mechanical system-derivation rule may be better suited to some run decompositions than others,
    so a measured deficit may be a property of the rule; the rule is declared in advance and its dimension
    and determinant are reported per arm so this is visible.
  - Required lattice dimension grows with run count, so the budget binds harder on high-run arms;
    time-capped instances are reported separately and never merged into c(P).
  - Run POSITION within the prime is not controlled in the random-subset arms and may carry a real
    effect; it is recorded and examined as a secondary variable.
  - At small n the boxes are small enough that a lucky read-off can succeed for reasons unrelated
    to the construction; the exhaustion arm bounds this.
  - Inverting the contiguous curve to obtain c(P) imports that curve's own error, which is why the
    baseline runs in the same invocation on the same instances.
  interpretation_limits:
  - A deficit is measured against one mechanical construction rule; a better rule for split positions
    could reduce it, and nothing here bounds what such a rule could do.
  - No claim is made that any real leakage channel produces non-contiguous patterns; the pattern is
    supplied by this campaign to itself.
  - Results hold at the tested moduli and position-set families only; c(P) is not extrapolated.
  - Where the budget bound rather than the structure, the arm reports a budget outcome and not a mathematical
    one.
  target_complexity:
    time_exponent: No attack exponent is claimed. Lattice dimension grows with run count and reduction
      time is measured per arm; this is reported as instrument cost, not as an attack complexity.
    memory_exponent: No attack memory exponent is claimed. Peak resident memory is recorded per arm
      beside time, and the exhaustion arm's memory is negligible and recorded anyway.
    best_known: 'The incumbent is the contiguous-window treatment itself: RQ-RSA-d46f02 names most-
      and least-significant-bit leakage and nothing else, KN-TECH-015 records a windowed method, and
      the corpus contains zero records of any non-contiguous leakage object. The incumbent measurement
      of c(P) is that none exists.'
    hidden_overhead: The mechanical derivation of a multivariate system from an arbitrary run decomposition
      is the hidden human cost, and it is where an unfair comparison would enter. Machine-side, dimension
      growth with run count is superlinear and the exhaustion arm's cost is exponential in the unknown
      bit count, which is why it is confined to n at most 96 with at most 24 unknown bits.
  dominated_by: 'n/a (no result claimed). No attack point is asserted, so no time, memory or data
    frontier row applies. Stated explicitly rather than written as null: I did not check frontier
    rows because there is no claimed result to place on a frontier.'
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is a table
    of c(P) against run count and position-set family, where this repository currently holds no non-contiguous
    leakage object at all.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'A mechanical rule deriving a usable multivariate system from an arbitrary
    run decomposition: 0.55, the main engineering risk. c(P) strictly below k for two-run subsets:
    0.85, since a second variable must be paid for somehow. The deficit growing with run count rather
    than bit count: 0.65. The specific ordering prediction, arithmetic progression worse than block-interleaved
    at matched run count: 0.45, deliberately near even since the run-count match may already absorb
    the effect. The exhaustion arm terminating within cap and cleanly partitioning failures: 0.85.'
