  assumptions:
    - n prime, 2^m < n, and the toy realisation uses exact integer arithmetic so every operation count is exact and every certificate is checked by an independent scalar multiplication.
    - The step function g is a public hash of the group element into Omega; the walker never reads x, the planted seed, or the integer S of another walker.
    - Memory is counted in words of group elements plus indices, peak over the run, measured by the harness and never asserted.
    - One frozen operation counter for every arm and every row, as in EXP-ICEX-850e41.
    - Toy scale only; sqrt(C(m, w)) between 2^10 and 2^13 in the first ladder so that the kangaroo and MITM rows also complete.

  proof_search_map:
    bottleneck: >-
      Conjecture C1, the polynomial-slack version of Lemma 2 - that A
      contained in Z/n with |A| <= |W| m^c and |A meet (A + x)| >= |A| / m^c
      for every x in W(m, w) forces |A| >= 2^{m - 1} / m^{c'} - is the step
      that would turn Claim A from a family table into a model theorem. The
      transfer of W-popularity from A to the Balog-Szemeredi-Gowers subset is
      the exact obstruction.
    baseline_embedding:
      parameter_slice: >-
        Three slices must reproduce known costs symbolically before anything
        is read - Omega = (Z/n)^2 returns c sqrt(n) (rho); Omega = interval x
        {0, 1} returns c 2^{m/2 + 1.5} / sqrt(M)-order capped by sqrt(N),
        i.e. kangaroo; Omega_HS at w = m/2 returns log2 T / m = 0.717,
        the reported BCJ polynomial-memory exponent.
      reproduction_check: >-
        Frozen fixture, blocking - at l about 2^26 run rho on the vacuous
        promise and kangaroo on three intervals; measured cost within a factor
        2 of 0.886 sqrt(l) and 2 sqrt(L); the closed-form table of T_HS for
        every ladder cell is computed and hashed before any walk runs.
    observation_collision:
      observable: The pair (N, F) of a state set and the measured cost ratio T sqrt(M) F / N^{3/2}.
      distinct_preimage_search: >-
        REQUIRED. Two state sets with the same (N, F) but different structure
        (Omega_HS and a random subset of the plane with F planted coincident
        pairs) must give the same cost under H1; if the group set is faster,
        H1 fails favourably and the obstruction is void. Second collision -
        the plain-integer arm and the group arm have identical (N, F) and must
        give identical T, else the instrument leaks integer structure.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Charge every IDW walk to the single resource F sqrt(M) / N^{3/2}
          and pack the positional families into one computable table.
        predicted_gain: A frontier table per (m, w) instead of per-algorithm folklore.
      - transform: representation_reduction
        proposed_object: >-
          Reduce the sqrt(|W|) question to the additive-combinatorial
          statement C1 about popular differences of a set of size |W|.
        predicted_gain: Localises the open obligation to one named conjecture with a tiny-scale search as its falsifier.
    quantifier_order: >-
      FOR ALL n prime, FOR ALL (m, w), FOR ALL single-level Omega in the
      positional families, FOR ALL image-determined g and memory M, the
      expected cost on the worst x in W is at least the law's value (under
      H1). The favourable escape is EXISTS Omega of size |W| m^{O(1)} with
      rho_Omega(W) >= m^{-O(1)}, which C1 denies and which the tiny-scale
      search of the minimal test probes directly.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most - for the declared families, sizes, hash and memory, the
        measured costs follow the law within the band, and no tiny-scale
        popular-difference set of the forbidden size was found. It can NEVER
        certify that multi-level walks are bounded, nor anything about the
        ECDLP without the promise.
      nearby_object_control: >-
        W = an interval of the same size, where the law is met with equality
        by kangaroo (F of order N) and sqrt(|W|) IS attainable with polylog
        memory. A method that cannot separate the interval class from the
        weight class has not identified the load-bearing structure, which is
        the doubling constant of W.
    proof_obligations:
      - claim: Lemma 1 counting bound and Lemma 2 invariance.
        responsibility: correctness
      - claim: The three baseline slices reproduce rho, kangaroo and the 0.717 m figure.
        responsibility: baseline
      - claim: F_Omega_HS(x) = C(w, w/2) exactly for every x in W(m, w).
        responsibility: size
      - claim: The vOW multi-golden extension by 1/F, under H1.
        responsibility: runtime
      - claim: Peak memory of the DP walk is M + O(1) words.
        responsibility: memory
      - claim: Every solve carries a certificate re-verified by the wrapper.
        responsibility: interface
      - claim: Everything is scoped to single-level IDW walks at toy scale.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: The state set Omega with its fibre surplus F under pi, and the resource F sqrt(M) / N^{3/2}.
    established_families_off_limits: >-
      Off-limits as the primary lens - list-based representation solvers and
      the balance-law ratio R(W) (owned by H-ICEX-8f9ea2), Pollard rho on
      the whole group, and the reported nested Esser-May algorithm (control
      row only).
    lossiness: >-
      GENUINELY LOSSY - pi forgets the coefficient pair except on the F
      coincident pairs; the fibre over a group element is the set of states
      reaching it. Not a change of coordinates because the walker cannot
      invert pi (that is the DLP). Under the operation set Sigma of
      image-determined steps closed on Omega the group element propagates
      deterministically by construction. Under translation by arbitrary
      elements Omega is not closed, so this is a PARTIAL-ACTION object,
      Class I in the trichotomy of IDEA-20260806-c5d183.
    propagation: Exact under Sigma; the step rule and closure of Omega are the whole design freedom.
    survival_score: >-
      Survives every single-level family (the law is a computation); dies at
      multi-level state sets, where F is no longer a pair count and the
      nested analysis of KN-LIT-4794 takes over.

  null_object_control: >-
    NULL-1 (RANDOM-MAPPING NULL, BLOCKING) - iterate a random hash on N
    labels with exactly F planted coincident pairs, same M and same
    distinguished-point rule; its cost distribution must match the group walk
    on Omega_HS at every cell within the band. NULL-2 (MATCHED RANDOM CLASS)
    - replace W by a uniformly random subset of Z/l of the same size and Omega
    by a random subset of the plane of the same size; F is then 0 at almost
    every x and the walk must NOT solve within 20 T_HS; any solve is an
    instrument leak. DECAY PARAMETER q - replace a fraction q of the states of
    Omega_HS by random states; F falls as (1 - q)^2 and T must rise as
    (1 - q)^{-2} along q in {0, 0.25, 0.5, 0.75}; a T flat in q is the artifact
    tell of docs/inventor-protocol.md section 3 and voids the arm.

  discriminated_from:
    - >-
      H-ICEX-8f9ea2 / EXP-ICEX-850e41 (NEAREST). They treat W(m, w) as a
      promise class and measure T(W) as a ratio of two LIST-BASED solvers
      under one counter, with memory unbounded and reported beside in bytes.
      EXACT DELTA - here storage M is the independent variable, the solver is
      a deterministic distinguished-point walk, the predicted dependence is
      T proportional to M^{-1/2} and to F^{-1}, and the record's content is
      the floor of that law and the kangaroo boundary; the ICEX counter, the
      integer arm and the curve-free arm are reused unchanged.
    - >-
      IDEA-20260901-133fd3. The balance-law ratio R(W) = T(W)/sqrt(|W|) for
      re-randomisation attacks. Delta - no re-randomisation and no ratio over
      classes; one class, one walk model, and the memory axis.
    - >-
      KN-LIT-4794 (Esser-May). Multi-level nested walks with representations.
      Delta - this record bounds SINGLE-level walks and names nesting as the
      only escape; their algorithm is the required control row and is not
      claimed, reproduced or bounded here.
    - >-
      KN-LIT-2177 / KN-LIT-2135. Memory-rich splitting systems and BSGS
      variants for low-weight and product exponents. Delta - they sit on the
      memory-heavy row; this record explains the cost of removing the memory.

  predictions:
    - metric: M1 - baseline slices (rho, kangaroo, and the closed-form 0.717 m at w = m/2)
      direction: different
      minimum_effect: FORCED within a factor 2 of the known costs; otherwise the counter is wrong and nothing is read.
    - metric: M2 - scaling exponent of measured T_HS against N^{3/2}/F across the ladder at fixed M
      direction: different
      minimum_effect: >-
        Fitted slope 1.0 plus or minus 0.1 over five cells; slope below 0.8
        replicated on a second seed set falsifies the law as stated and is the
        favourable branch.
    - metric: M3 - memory exponent, slope of log T_HS against log M at fixed (m, w), M in {2^4, 2^6, 2^8, 2^10}
      direction: lower
      minimum_effect: Slope -0.5 plus or minus 0.1; a slope shallower than -0.3 means the DP machinery, not the law, is being measured.
    - metric: M4 - absolute ratio T_HS sqrt(M) F / N^{3/2} per cell
      direction: different
      minimum_effect: Inside the pre-registered band [0.6, 6] around the recalled constant 2.5; a value below 0.6 at three cells is the favourable falsifier of H1.
    - metric: M5 - kangaroo row versus sqrt(C(m, w)) m^2 across the ladder
      direction: different
      minimum_effect: Kangaroo meets the target at every cell with |w - m/2| <= sqrt(m) and misses it by at least 2^{m/2 - 0.75 log2 C(m, w)} at cells with w <= m/4; predicted per cell from exact binomials before any run.
    - metric: M6 - peak storage words of the DP walk versus M, and of the MITM row versus |Omega|/2
      direction: different
      minimum_effect: DP walk at most M + 64 words at every cell; MITM within a factor 2 of |Omega|/2. A DP run above 2M words is not low memory and its time is not read.
    - metric: M7 - group arm versus plain-integer arm at identical (N, F, M)
      direction: different
      minimum_effect: Ratio of mean costs within [0.5, 2]; outside it the instrument leaks structure and the cell is UNTESTED.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE) - check Lemma 1 and Lemma 2 by hand;
      compute and hash the closed-form table of N, F, T_HS, sqrt(|W|), the
      kangaroo and MITM predictions for the ladder (m, w) in {(24, 4),
      (32, 4), (32, 6), (40, 5), (48, 6)} with l the least prime above
      2^{m + 2}. STAGE 1 (minutes) - baseline slices M1. STAGE 2 (the
      discriminator, about one CPU-hour in C or a few hours in Python on
      (Z/l, +)) - 30 planted instances per cell, Omega_HS walk with
      distinguished points at M = 2^6, certificate [x]P = Q and popcount(x) =
      w re-verified by the wrapper, peak-words trace per run; NULL-1 and
      NULL-2 at every cell; the q-decay ladder at one cell; the memory sweep
      M3 at (32, 6). STAGE 3 (minutes) - the plain-integer arm at the same
      cells; the kangaroo, MITM and plain-rho rows on the same instances with
      their own storage traces; the reported Esser-May row is reproduced only
      if a readable implementation is available and is otherwise reported as
      NOT RUN, never as a number. STAGE 4 (zero compute) - apply the bands.
      TINY-SCALE C1 SEARCH (minutes) - at m = 8, w = 2, l = 307, hill-climb
      and exhaustive-over-structured-families search for A in Z/l with |A|
      <= 2 |W| = 56 and min over x in W of |A meet (A + x)| >= |A|/4; report
      the best popularity found. CHEAPEST VALID DISCRIMINATOR - Stage 2 at
      the single cell (32, 6) with NULL-1 - it decides M2/M4 for that cell in
      under ten CPU-minutes and, if the group walk beats the random-mapping
      null by more than the band, the obstruction is void and a lead exists.
    controls:
      - Memory-heavy half-split MITM at the same (m, w) on the same instances with its storage trace (RQ row 1).
      - Plain Pollard rho on Z/l ignoring the promise, 0.886 sqrt(l) expected (RQ row 2).
      - The reported Esser-May nested algorithm, reproduced if an implementation is available, else recorded NOT RUN (RQ row 3).
      - Plain-integer subset-sum arm with identical (N, F, M) as the dynamic-range control (RQ row 4).
      - Interval kangaroo on [0, 2^m) with polylog memory as the sharper outer baseline (added row 5).
      - NULL-1 random mapping with F planted coincidences, blocking; NULL-2 random class, blocking; q-decay ladder, blocking.
      - Curve arm at one cell on a self-generated prime-order toy curve to separate curve from cyclic-group contributions (as in EXP-ICEX-850e41 arm E).
    required_metrics:
      - hashed closed-form table of N, F, T_HS and every baseline per cell, written before any run
      - certified group-operation count per run under the frozen counter, mean and interquartile range per cell
      - peak storage words per run for every row
      - fitted slopes M2 and M3 with confidence intervals and per-seed replication
      - NULL-1 and NULL-2 cost distributions per cell
      - q-decay curve at one cell
      - kangaroo, MITM, rho and integer-arm rows on the same instance hashes
      - best tiny-scale popularity ratio found and the searched family list

  falsification_conditions:
    - F1. M1 slices miss by more than a factor 2. Counter or implementation fault; nothing is read.
    - F2. M2 slope below 0.8 or M4 below 0.6 at three cells, replicated on a second seed set, while NULL-1 obeys the law. H1 fails FAVOURABLY on the group; Claim A is void and the excess is the headline lead.
    - F3. NULL-1 itself departs from the law. The vOW multi-golden extension as stated is wrong; the record is superseded by the measured law.
    - F4. Kangaroo fails the target at a cell with |w - m/2| <= sqrt(m). Claim B is wrong or the kangaroo implementation is.
    - F5. The tiny-scale C1 search finds A with the forbidden size and popularity. C1 is false at that scale; the obligation is re-scoped, Claim A survives as a family table only.
    - F6. M7 outside [0.5, 2]. Instrument leak; every group-arm number is void for that cell.
    - F7. The q-decay curve is flat. Artifact; the arm is voided.

  confounders:
