      No corpus record treats storage as the independent variable on W(m, w)
      or states the fibre-surplus law, the counting bound of Lemma 1, or the
      kangaroo boundary of Claim B. The nearest is the ICEX pair, which
      measures time ratios of list-based solvers with memory unbounded.
    verdict: >-
      UNVERIFIED. The ingredients (vOW golden-collision cost, random-mapping
