idea:
  id: IDEA-20260906-ab08cb
  question_id: RQ-LHW-1877bb
  goal_id: null
  added: '2026-09-06'
  title: >-
    THE FIBRE-SURPLUS LAW FOR POLYNOMIAL-MEMORY WALKS ON THE LOW-WEIGHT CLASS -
    for any walk whose state is a known coefficient pair (S, T) carried as
    [S]P + [T]Q and whose step is a function of the group element alone, the
    expected cost with M words of memory is max(sqrt(N), N^{3/2} / (F sqrt(M)))
    up to a constant, where N is the number of distinct group elements the
    state set reaches and F is the number of useful coincident state pairs;
    the rigorous counting bound sum over x of F(x) <= |Omega|^2 / 2 puts the
    floor of this model at sqrt(|W|) with equality only for a state set that
    is invariant under translation by every element of W(m, w), which no set
    smaller than the group is; the interval kangaroo already meets the RQ
    target for w within sqrt(m) of m/2; and the single-level positional
    frontier is a computable table (2^{0.717 m} at w = m/2, reproducing the
    reported BCJ figure) - an obstruction proposal scoped to single-level
    image-determined walks, with the cheapest falsifying measurement
  class: mechanism

  claim: >-
    SETTING. Generic prime-order group G of order n, generator P, Q = [x]P with
    x in W(m, w) = {0 <= x < 2^m with popcount(x) = w}, and 2^m < n. Realised
    at toy scale as (Z/l, +) with l prime and as prime-order subgroups of toy
    curves.

    MODEL IDW(Omega, g, M), image-determined walks. A state is a pair (S, T) of
    KNOWN integers modulo n drawn from a declared finite set Omega contained in
    (Z/n)^2, carried as the group element y = [S]P + [T]Q. The step is a
    function g of y alone, g(y) in Omega, and the new element is recomputed
    from the new pair. Memory is M stored group elements (distinguished
    points). The walk succeeds when two DISTINCT states with T1 != T2 are found
    to share a group element, since then x = (S1 - S2) / (T2 - T1) mod n.
    Plain Pollard rho is IDW with Omega = (Z/n)^2; the interval kangaroo is IDW
    with Omega = [0, 2^m) x {0, 1}; the Coppersmith-Stinson half-split
    meet-in-the-middle, made memory-poor by van Oorschot-Wiener, is IDW with
    Omega_HS = (D x {0}) union (-D x {1}) where D is the set of weight-w/2
    integers below 2^m.

    LEMMA 1 (COUNTING, RIGOROUS). For a pair of states with T1 != T2 there is
    exactly one x in Z/n on whose line L_x = {(t x, t)} their difference lies.
    Hence, writing F_Omega(x) for the number of unordered useful pairs for
    logarithm x, sum over x in Z/n of F_Omega(x) <= |Omega|^2 / 2, and the
    worst x in W has F_Omega(x) <= |Omega|^2 / (2 |W|).

    LEMMA 2 (INVARIANCE, RIGOROUS). F_Omega(x) = |Omega| / 2 for every x in W
    with Omega = A x {0, 1} forces A + x = A for every x in W, hence A is a
    union of cosets of the subgroup generated by W, which is Z/n for n prime.
    So the uniform-popularity case is attained only by A = Z/n.

    HEURISTIC H1 (RANDOM-MAPPING LAW, stated in heuristic_assumptions). Under
    H1 the expected group-operation count of IDW(Omega, g, M) on logarithm x is
      T = c * max( sqrt(N), N^{3/2} / (F_Omega(x) sqrt(M)) ),
    N = number of distinct group elements reached by Omega, c an absolute
    constant pre-registered from the van Oorschot-Wiener analysis (recalled
    value 2.5, tolerance band declared below).

    COROLLARY (UNDER H1 + LEMMA 1). Let rho_Omega(W) = min over x in W of
    F_Omega(x) * 2|W| / |Omega|^2, a number in (0, 1]. Then for the worst x in
    W, T >= c * sqrt(|W| / (rho_Omega(W) * sqrt(M)))-order, and reaching
    sqrt(|W|) times m^{O(1)} with M = m^{O(1)} needs simultaneously
    rho_Omega(W) >= m^{-O(1)} and |Omega| <= |W| m^{O(1)}: a state set of the
    size of the class in which every element of W is a popular difference.
    Lemma 2 says exact popularity forces Omega to be the whole plane; the
    polynomial-slack version is CONJECTURE C1 below and is the record's open
    obligation, not its claim.

    CLAIM A (OBSTRUCTION, CONDITIONAL ON H1, SCOPED TO IDW). No single-level
    image-determined walk with a positional state set (any signed-digit family
    Omega_k = signed weight-k integers, any half-split, any window family)
    reaches sqrt(|W|) m^{O(1)} with polynomial memory on W(m, w) for w <= m/4;
    the half-split frontier is T_HS = c (2 C(m, w/2))^{3/2} / (C(w, w/2)
    sqrt(M)), which for w = o(m) is |W|^{3/4} 2^{-w/4} m^{O(1)} and at w = m/2
    is 2^{0.717 m}, matching the reported BCJ polynomial-memory exponent
    0.72 n that KN-LIT-4794 records as the pre-nesting baseline.

    CLAIM B (BOUNDARY, RIGOROUS GIVEN KANGAROO'S KNOWN COST). Pollard's
    kangaroo on [0, 2^m) costs about 2 * 2^{m/2} group operations with
    polylogarithmic memory and ignores the weight; since C(m, w) >= 2^m / m
    whenever |w - m/2| <= sqrt(m), the RQ target sqrt(C(m, w)) m^{O(1)} with
    polylog memory is ALREADY MET by kangaroo in that band, and the RQ's live
    regime is w <= m/2 - omega(sqrt(m)). The kangaroo row is therefore a
    mandatory fifth comparison row beside the four the RQ names.

    CLAIM C (ESCAPE ROUTE NAMED). The only mechanism in this model that beats
    the single-level frontier is to make F grow faster than N^{3/2} through
    multi-level (nested) state sets, which is the representation-plus-nesting
    route of KN-LIT-4794 (reported 2^{0.645 n} for subset sum); nothing here
    bounds multi-level walks, and the reported Esser-May DLP algorithm is the
    control row, not a target of the obstruction.

  mechanism: >-
    THE TRACKED OBJECT is the state set Omega together with its fibre surplus
    under the projection pi from Omega to G, pi(S, T) = [S]P + [T]Q. The
    projection is LOSSY exactly on the F coincident pairs and injective
    elsewhere; what it discards (the coefficient pair) is carried along by the
    walker, so the retained part (the group element) propagates
    deterministically under the operation set Sigma = image-determined steps
    that keep Omega closed. Rho works because the fibres of pi on (Z/n)^2 have
    size n, so every step-collision of the iterated map is a coincidence of
    distinct states; on a restricted Omega the fibres have average size
    1 + 2F/|Omega|, the iterated map on the image set is nearly injective in
    the coefficient sense, and van Oorschot-Wiener's golden-collision cost
    N^{3/2}/(F sqrt M) applies with F golden pairs. Memory-rich search
    escapes this because a stored list detects coincidences without merging,
    at cost N / sqrt(F) - the birthday count - which for Omega_HS is exactly
    sqrt(|W|). The whole time-memory gap of the RQ is the ratio of the two
    laws, sqrt(N / F) * (1 / sqrt M), and it closes only when F is of order N,
    i.e. when W consists of popular differences of a set no larger than W
    itself, which Lemma 2 forbids exactly and Conjecture C1 forbids up to
    polynomial slack.

