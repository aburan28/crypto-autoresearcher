  batch: EC-STRUCTURE-20260825
  cluster: 'C1-frame: what an instance actually reveals'
  title: 'THE (p, t) WEAKNESS LOCUS AND WHETHER IT IS CLOSED: write every published structural weakness
    of a prime-field curve as an explicit condition on the pair (p, t), measure the locus''s density,
    and ask the curve-level analogue of KN-OPEN-019 -- is the list of conditions closed, and what would
    closing it look like'
  class: audit
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: The individual conditions are all published and recalled. The locus assembly, its density,
    and the closure question posed at the level of (p, t) rather than at the level of algorithms are what
    this record proposes.
  claim:
    semantic_part: An ordinary prime-field curve is determined up to twist by (p, t), so every structural
      weakness is a condition on that pair; assembling the conditions gives an explicit locus whose complement
      is the program's actual target space.
    evaluator_part: 'Unestablished: that the assembled list is complete. Completeness is the whole question
      and this record explicitly does not assert it.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Enumerate the known conditions as predicates on (p, t): t = 1 (anomalous, N = p); t = 0 or p | t
    (supersingular); small embedding degree k, i.e. N | p^k - 1 for small k (MOV/Frey-Ruck); N | p - 1
    (k = 1 boundary); small |D| where D = t^2 - 4p, giving an efficiently computable automorphism or low-degree
    endomorphism; smooth N (Pohlig-Hellman); smooth twist order p + 1 + t (invalid-curve and fault settings);
    and the composite-cofactor conditions the SafeCurves lane already audits.'
  - Express each as a codimension and estimate the density of the union in the Hasse interval |t| <= 2
    sqrt(p).
  - 'Ask the closure question: is the union exhaustive? Name candidate conditions nobody has enumerated
    -- conditions on the CONDUCTOR of Z[pi] in O_K rather than on D itself; on the factorization pattern
    of the Hilbert class polynomial H_D mod p; on the volcano depth at small primes; on the class group''s
    exponent rather than its order.'
  - Cross-reference the locus against the deployed and challenge-sized curves so that each target's distance
    from each condition is explicit.
  lossy_projection_test:
    tracked_object: the pair (p, t) as a complete curve-level coordinate
    what_is_discarded: the twist and the choice of model
    propagation: 'not applicable: (p, t) is static data, not propagated'
    verdict: This is a curve-level (arity-0) object in the taxonomy of IDEA-20260825-9ad045 and the lossy-projection
      test does not bind on arity-0 objects; recorded here so the exemption is explicit rather than silent.
  predictions:
  - id: P1
    status: established_formula
    statement: An ordinary E/F_p is determined up to F_p-isomorphism and twist by (p, t) together with
      End(E).
  - id: P2
    status: unestablished
    statement: The union of known weakness conditions has density o(1) in the Hasse interval.
  - id: P3
    status: unestablished
    statement: At least one of the conductor / class-polynomial / volcano-depth condition families has
      never been screened for weakness in this program.
  minimal_discriminating_test:
    status: specified_not_run
    test: For a fixed toy p, enumerate all t in the Hasse interval, evaluate every predicate exactly,
      and report the locus and its density; repeat across several p to check the density trend.
    pass: Densities are computed exactly and the trend is stable across p.
    fail: A predicate that cannot be evaluated exactly at toy scale is recorded as such rather than estimated.
  controls:
  - Include p for which the answers are known independently (small p with complete curve tables) as a
    correctness check on the predicate implementations.
  - Include a deliberately weak curve in the sample so that a locus missing it is detected immediately.
  confounders:
  - Not every t in the Hasse interval occurs; the Deuring/Waterhouse conditions must be applied or the
    density is wrong.
  - '''Weak'' is relative to an attack cost; each predicate needs its cost threshold stated or the locus
    is not well defined.'
  - Density in a toy interval need not track density at cryptographic size.
  falsification:
    semantic: A published weakness that is NOT expressible as a condition on (p, t, End) falsifies the
      framing.
    evaluator: An error in any predicate scopes out that predicate's row only.
    not_falsification: The locus turning out to be sparse; that is the expected outcome and carries no
      information alone.
  why_this_is_not_a_variant: 'The SCURVE goals audit named criteria for named curves. This record inverts
    the quantifier: it asks about the whole parameter space at once and about whether the criterion LIST
    is closed, which no per-curve audit can answer.'
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No algorithmic improvement; a parameter-space census and a closure question.
    dominated_by:
    - Pollard rho on every realized end-to-end ECDLP cost in this ledger
    axes:
