    orientation and no compatibility with the action. Predicted exponent 1.00,
    identical to the honest one-sided arm. This is the control that separates
    "the datum acts" from "the datum is present", and without it a measured
    speedup could be the bookkeeping of having a label at all.
    NULL OBJECT TWO (blocking): the PROVES-TOO-MUCH control, the full non-abelian
