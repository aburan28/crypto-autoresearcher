idea:
  id: IDEA-20260904-31f1fa
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  handoff_id: TASK-20260904-9a7471
  added: '2026-09-04'

  title: >-
    KN-OPEN-015 ASKS WHICH AUXILIARY DATA COLLAPSES AN ISOGENY ASSUMPTION AND
    THIS PROGRAM HAS ONLY EVER USED IT AS A SCOPE FENCE: the answer proposed
    here is a SHARP DICHOTOMY ON SIDEDNESS -- a datum is worth a factor of two in
    the exponent exactly when it makes the relevant action evaluable on BOTH
    endpoints (orbit^{1/2} instead of orbit^{1}), it is worth a graded amount
    when it is a digest rather than an action, and it is worth everything when it
    is constructive -- which explains Delfs-Galbraith's second phase, CSIDH's
    p^{1/4} and the SIDH break as three rows of one table and turns "make the
    action two-sided" into a named design target with a price

  class: mechanism

  claim: >-
    STATED FIRST. No attack is proposed and no exponent is claimed to be beaten.
    The content is a CLASSIFICATION with a price per row, a discriminating
    measurement that can refute it, and the first quantitative content this
    program has ever given to KN-OPEN-015.

    (A) THE OPEN QUESTION AND ITS CURRENT STATE. KN-OPEN-015 asks for a general
    characterisation of which auxiliary data collapses an isogeny assumption.
    IDEA-20260807-7d8ba9 records that this program uses it ONLY as a scope fence
    -- to say that a given attack does not apply because the survivor publishes
    no torsion images -- and that its actual question is framed by no hypothesis,
    no experiment and no evidence record anywhere. A fence is not an answer.

    (B) THE PROPOSED ANSWER, IN ONE SENTENCE. An auxiliary datum's cryptanalytic
    value is determined by WHERE IT PUTS THE DATUM RELATIVE TO THE GROUP ACTION,
    and there are exactly three regimes:
      REGIME 0, ONE-SIDED. The attacker can evaluate the action on the reference
      endpoint only. The problem is a one-sided search over the orbit and costs
      |orbit|^{1+o(1)}. There is no meet-in-the-middle, because a
      meet-in-the-middle requires stepping BACKWARDS from the target and the
      target is a bare j-invariant.
      REGIME 1, TWO-SIDED. The datum makes the action evaluable on the TARGET
      endpoint as well. Then baby-step giant-step, kangaroo and van
      Oorschot-Wiener all apply and the cost drops to |orbit|^{1/2+o(1)}.
      THE ENTIRE GAIN IS A FACTOR OF TWO IN THE EXPONENT AND IT IS BOUGHT BY
      SIDEDNESS ALONE.
      REGIME 2, CONSTRUCTIVE. The datum determines the secret through an
      algebraic identity rather than a search -- torsion images plus Kani being
      the known instance. Cost collapses to polynomial.
    Between regimes 0 and 1 there is a graded band occupied by DIGESTS: data that
    partition the orbit without acting on it, worth max(|orbit|/R, |orbit|^{1/2})
    by the cost law of IDEA-20260901-871141 rather than a clean factor of two.

    (C) THE TABLE, WHICH IS THE DELIVERABLE. Every row is an auxiliary datum this
    program can name, with its regime and its price. |orbit| = h is the size of
    the relevant torsor.
      R1. Torsion images of a basis under the secret isogeny (SIDH/SIKE).
          REGIME 2. Polynomial, via Kani. THE SURVIVORS PUBLISH NONE OF THESE and
          this row is here only to anchor the scale.
      R2. F_p-rationality of both curves (CSIDH; Delfs-Galbraith phase two).
          REGIME 1, and the reason is worth stating precisely because this
          program has never stated it: the orientation is FROBENIUS, which is
          computable from the curve equation at zero cost, so the class-group
          action is evaluable on the TARGET as well as on the reference. Price:
          h^{1/2} = p^{1/4}. THIS IS WHY CSIDH IS p^{1/4} AND NOT p^{1/2}, and it
          is a statement about sidedness, not about the class group's size.
      R3. An orientation planted on the REFERENCE curve only -- e.g. a CM curve
          of known small discriminant obtained from a Hilbert class polynomial,
          which is exactly IDEA-20260807-a6a038's positive-control construction.
          REGIME 0. Price: h. A planted orientation on one side buys NOTHING in
          the exponent, and any experiment using such a control must not read its
          cost as an attack cost.
      R4. A known small-degree endomorphism ON THE TARGET (IDEA-20260725-002's
          "effective orientation"). REGIME 1 by construction, since it supplies
          the missing side. Price: h(D)^{1/2} = |D|^{1/4+o(1)} for the order of
          discriminant D it generates. THE VALUE OF THAT RECORD'S DATUM IS
          THEREFORE EXACTLY THE SIDEDNESS IT RESTORES, which that record does not
          say.
      R5. A self-pairing value (Castryck-Houben-Merz, KN-LIT-7489, via
          IDEA-20260806-b7fdc3). NOT an action -- it is a DIGEST. Graded band.
          Price max(h/R, h^{1/2}) with R the digest's effective size, per
          IDEA-20260901-871141's law. This record's contribution here is only to
          place the digest family in the classification and to note that a digest
          can never beat h^{1/2}, so a digest is at best a SECOND factor of two
          on top of sidedness, never a substitute for it.
      R6. The VALUE of delta_E (as opposed to the isogeny realising it).
          REGIME 0, PRICE h -- and this is the row that matters most for the
          program's current lane, because IDEA-20260904-ec17aa's whole alpha axis
          would, if it succeeded, deliver a DECISION about delta_E, not an
          orientation. Knowing delta_E = d tells you E lies in the stratum
          orientable by Z[sqrt(-p d)], an orbit of size about (p d)^{1/2}, but
          gives no way to ACT on E, so it is one-sided and buys no exponent by
          itself. THAT IS THE SHARPEST CONSEQUENCE OF THE CLASSIFICATION AND IT
          IS A WARNING TO THIS PROGRAM'S OWN MOST-FUNDED LANE.
      R7. The endomorphism ring itself. REGIME 2. Polynomial, via the connecting
          ideal (IDEA-20260904-6e8793's route 2).
      R8. The base curve's endomorphism ring in a trusted setup
          (IDEA-20260808-dfd76a). REGIME 2 for the scheme, polynomial.

    (D) WHY THIS IS FALSIFIABLE AND NOT A TAXONOMY EXERCISE. The classification
    makes a sharp, measurable prediction that a plausible competing account does
    not: it says the one-sided and two-sided costs differ by a factor of exactly
    TWO IN THE EXPONENT and nothing in between, for every orbit size, with no
    dependence on the arithmetic of the orbit. The competing account -- that
    sidedness is one of several ingredients and that structure in the orbit
    supplies partial credit -- predicts intermediate exponents. Toy oriented
    instances decide this directly: build an oriented torsor of known size,
    measure vectorization cost with the action supplied on both sides, on one
    side, and on neither, and fit the exponent in h. Predicted 1/2, 1, 1. A
    measured intermediate exponent refutes the dichotomy and is the more
    interesting outcome.

    (E) WHAT THE CLASSIFICATION IS FOR. Two things, both concrete.
      (i) A DESIGN RULE for survivors, stated as a checkable condition rather
      than a slogan: a scheme is safe from auxiliary-data collapse iff no
      published quantity makes the relevant action evaluable on the secret-side
      endpoint. This converts "does this scheme publish dangerous data?" from a
      judgement into an inspection with a defined answer.
      (ii) AN ATTACK TARGET WITH A PRICE: "make the action two-sided" is worth
      exactly a factor of two in the exponent, so an attack that spends up to
      h^{1/2} to manufacture the missing side breaks even. That budget is a
      number nobody has written down, and it immediately rules out a large class
      of would-be attacks that spend more than it.

    (F) NOT CLAIMED. That the dichotomy is original -- it is the standard reason
    baby-step giant-step needs an inverse, and it is certainly folklore. That any
    survivor publishes a regime-1 datum. That regime 0 is unbreakable: it is
    h^{1+o(1)} for the SEARCH, and a scheme in regime 0 can still fall to an
    entirely different attack.

  mechanism: >-
    TRACKED OBJECT: the SIDEDNESS of the auxiliary datum -- a three-valued label
    (which endpoints of the instance admit an efficiently evaluable action)
    attached to a published quantity, together with the orbit size it acts on.

    LOSSY-PROJECTION TEST (algebraic, zero compute). The projection sends a
    published quantity -- a torsion basis image, a curve equation, a pairing
    value, an integer -- to a label in {none, one-sided, two-sided,
    constructive} plus one number, the orbit size. It is extremely lossy: nothing
    about the datum survives except how it interacts with the action. What is
    discarded is discarded COMPATIBLY with the operation the attack applies,
    namely composing group elements: sidedness is preserved under composition
    (if you can act on an endpoint, you can act on everything you reach from it),
    so the label propagates deterministically along the attack and never has to
    be recomputed mid-way. That closure under the action is what makes the label
    an object rather than a taxonomy: it has a one-step propagation rule and the
    rule is checkable.
    IT IS NOT A CHANGE OF COORDINATES, and the reason is exhibited by row R6:
    knowing delta_E and knowing the isogeny realising it have THE SAME
    information content in the naive sense -- the isogeny determines delta and
    delta determines the stratum -- yet they receive DIFFERENT labels, because
    only one of them supports an action. A projection that separates two data of
    nominally similar content is discarding something real.

    HOW THE PRICE IS DERIVED, IN TWO LINES EACH.
      REGIME 0 -> h. The attacker holds E_1 = [a]E_0 and can compute [b]E_0 for
      any b. Finding a means hitting E_1, and the images [b]E_0 are essentially
      uniform over the orbit, so the expected number of trials is h. There is no
      collision to exploit, because collisions among the [b]E_0 are useless -- the
      action is free, so distinct b give distinct curves.
      REGIME 1 -> h^{1/2}. The attacker additionally computes [c]E_1 for any c,
      so two lists of size h^{1/2} collide by the birthday bound and
      [b]E_0 = [c]E_1 gives a = b c^{-1}. Distinguished points give the same
      exponent at tunable memory.
      REGIME 2 -> polynomial. The datum determines a by an identity; no search.
      THE GAP BETWEEN REGIMES 0 AND 1 IS THEREFORE EXACTLY THE BIRTHDAY BOUND,
      which is why the factor is precisely two and not some other constant.

  exponent_lever:
    is_exponent_moving: true
    axis: time
    assumption_attacked: >-
      The oriented / auxiliary-structure survivors of RQ-SSI-001 collectively --
      CSIDH and every class-group-action construction on the F_p-rational set,
      the oriented isogeny problem for an arbitrary orientation, and any scheme
      whose published data might supply a missing side.
    baseline: >-
      Regime 0, one-sided oriented search: h^{1+o(1)} where h is the orbit size,
      which for an orientation by a discriminant-D order is |D|^{1/2+o(1)}.
      Regime 1, two-sided: h^{1/2+o(1)} -- realised today by CSIDH at p^{1/4} and
      by Delfs-Galbraith's second phase.
    target: >-
      Not a new algorithm but a PRICE: any mechanism that converts a regime-0
      instance into a regime-1 instance at cost below h^{1/2} moves the exponent
      of that instance from 1 to 1/2 in h. The record names that budget and
      supplies the table of candidate converters; it exhibits no converter for
      any survivor and claims none.

