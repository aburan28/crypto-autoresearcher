  assumptions:
    - >-
      The action is free and transitive on the orbit, so distinct group elements
      give distinct curves and there are no useful internal collisions. This is
      what makes the regime-0 price exactly h rather than something smaller.
    - >-
      "Evaluable" means an efficient representation in the sense of the frozen
      source's Definition 2.1, i.e. polynomial-time evaluation. An action
      evaluable only for smooth-norm ideals is a weaker resource and is treated as
      a separate sub-case in the minimal test rather than folded into regime 1.
    - >-
      The orbit size h is known to the attacker or computable in p^{o(1)}. For
      class groups this is an L[1/2] precomputation and is charged in
      IDEA-20260904-6e8793 rather than here.
    - >-
      Memory is available at h^{1/2} for the regime-1 birthday argument, or the
      distinguished-point variant is used; the tradeoff is stated in
      target_complexity and is not hidden.

  proof_search_map:
    bottleneck: >-
      The absence of a backward step from the target endpoint. Every algorithm
      that beats the orbit size linearly needs to move from the target as well as
      towards it; supplying that move is the exact step whose presence or absence
      changes the exponent from 1 to 1/2.
    baseline_embedding:
      parameter_slice: >-
        TWO exact slices. (i) The F_p-rational CSIDH instance: orientation is
        Frobenius, regime 1, price h^{1/2} = p^{1/4} -- which must reproduce the
        program's own recorded CSIDH baseline (IDEA-20260901-871141) exactly.
        (ii) The Delfs-Galbraith second phase: same regime, same price, reached
        after the p^{1/2} walk to the locus -- which must reproduce the standard
        p^{1/2} + p^{1/4} = p^{1/2} total. A third slice anchors the other end:
        an oriented instance where the target's orientation is withheld must
        return h, and at h = p^{1/2} that is p^{1/2}, the pre-Delfs-Galbraith
        cost.
      reproduction_check: >-
        Symbolic, frozen before measurement: h^{1/2} with h = p^{1/2+o(1)} must
        return p^{1/4+o(1)}, and h^{1} must return p^{1/2+o(1)}. Then a toy
        fixture: on a constructed toy torsor of known size, the measured
        two-sided cost must fit exponent 1/2 in h and the one-sided cost exponent
        1, each across at least three orbit sizes spanning a factor of 2^{10},
        before any row of the table is quoted.
    observation_collision:
      observable: >-
        The sidedness label assigned to a published datum.
      distinct_preimage_search: >-
        THE COLLISION IS EXHIBITED AND IT IS ROW R6 VERSUS ROW R4. Two data with
        nominally equivalent information content receive different labels:
        knowing delta_E = d (regime 0, price h) and knowing the isogeny phi
        realising it (regime 1 via the induced orientation, price h^{1/2}). The
        first determines the second up to a finite set, and the second determines
        the first outright, so an information-theoretic observable CANNOT
        separate them -- yet their prices differ by a factor of two in the
        exponent. THE SEPARATING CONDITION IS COMPUTATIONAL, NOT INFORMATIONAL:
        it is whether the datum supports an efficiently evaluable action. Any
        version of this classification that scores data by bits rather than by
        action-support will collide these two rows and give the wrong price, and
        naming that is a substantial part of the record's content.
        A SECOND COLLISION, LESS OBVIOUS: a digest of size R = h (row R5 at full
        size) and a two-sided action (regime 1) both give h^{1/2} by their
        respective laws. They are genuinely different resources that happen to
        price the same at that one point, and the table must not be read as
        implying they are interchangeable elsewhere.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "does this auxiliary datum matter?" into the model where the
          hypothesis is an exact computational condition -- "the action is
          evaluable at the target endpoint in polynomial time" -- rather than an
          informal information count. Encoding: datum to sidedness label.
          Completeness and soundness: exact within the three regimes.
          Transfer: the orbit size. Cost loss: none, the classification is free.
        predicted_gain: >-
          Turns KN-OPEN-015 from an unframed open question into an inspection
          with a defined answer per published quantity, and gives each answer a
          price.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable fixed (the information content of the datum) and
          vary the forgotten structure (whether it supports an action), then find
          an intrinsic invariant separating the resulting objects. The invariant
          proposed is the sidedness label itself, and the fibre exhibiting the
          separation is the (delta_E value, delta_E isogeny) pair of row R6.
        predicted_gain: >-
          A counterexample to any information-theoretic scoring of auxiliary
          data, which is the natural and wrong way to attack KN-OPEN-015.
    quantifier_order: >-
      FOR ALL free transitive actions of an abelian group G on a set X with
      |G| = h, FOR ALL instances (x_0, x_1 = a . x_0): IF the action is
      polynomial-time evaluable at BOTH x_0 and x_1, THEN a is computable in
      h^{1/2+o(1)}; IF it is evaluable only at x_0, THEN the best known cost is
      h^{1+o(1)} and no better algorithm is known. NOTE CAREFULLY WHAT IS AND IS
      NOT A LOWER BOUND: the regime-1 statement is an upper bound with a matching
      generic lower bound (recalled); the regime-0 statement is ONLY an upper
      bound and a statement about what is known -- this record does NOT claim a
      lower bound for the one-sided case, and treating the table's regime-0 rows
      as proofs of security would be exactly the overclaim the quantifier order
      is written to prevent.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: the three regimes with their upper bounds, the two exact
        baseline slices, a measured exponent fit on toy torsors, and a table
        assigning each of eight named data types to a regime. It can NEVER
        certify that a regime-0 instance is hard -- that would be a lower bound
        against all algorithms -- and it certifies nothing about any datum not on
        the table.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE CONCLUSION FAILS: a NON-FREE action, or a
        non-abelian one. The full supersingular isogeny graph is the extreme case
        -- the "action" there is the non-commutative Brandt groupoid, the ball
        grows QUADRATICALLY in the radius rather than linearly, and neither the
        regime-0 nor the regime-1 price applies (the correct cost is p^{1/2} for
        a claw over a set of size p, not h^{1/2} for a torsor). A classification
        that assigned the full graph a regime would be proving too much, and the
        record must return "not applicable" there. Testing that it does is a
        blocking control.
    proof_obligations:
      - claim: Regime 1 costs h^{1/2+o(1)}; regime 0 costs h^{1+o(1)} by the best known method.
        responsibility: runtime
      - claim: The CSIDH and Delfs-Galbraith slices reproduce p^{1/4}.
        responsibility: baseline
      - claim: >-
          The gap between the regimes is exactly the birthday bound, hence a
          factor of exactly two in the exponent with no intermediate value.
        responsibility: strictness
      - claim: >-
          Sidedness is closed under composition, so the label propagates along an
          attack without recomputation.
        responsibility: correctness
      - claim: >-
          Row R6: knowing delta_E's VALUE is regime 0, so the alpha axis of
          IDEA-20260904-ec17aa delivers no exponent by itself.
        responsibility: scope
      - claim: >-
          The classification is not a lower bound and asserts no hardness.
        responsibility: scope
      - claim: >-
          The classification returns "not applicable" for non-free or
          non-abelian actions, including the full supersingular graph.
        responsibility: feasibility

  object_first_candidate:
    established_families_off_limits: >-
      Declared off-limits as the primary lens: torsion-image / Kani attacks,
      which are the BROKEN assumption and are on the table only as an anchor row;
      the smooth-ball endomorphism search and its alpha axis, which this record
      comments on (row R6) but does not use; SQIsign transcript statistics; the
      quantum cost-model family; and the digest/representation search structure of
      IDEA-20260901-871141, which is cited as the price of one row rather than
      used as the lens.
    tracked_object: >-
      The sidedness label of an auxiliary datum, with the orbit size it acts on.
    lossiness: >-
      A published quantity collapses to one of four labels plus one integer.
      Nothing about the quantity survives except its interaction with the action.
    propagation: >-
      Closed under the group action and under composition: acting on an endpoint
      you can act on leaves you at an endpoint you can act on. That is the
      one-step rule, it is checkable by inspection, and it is what allows the
      label to be assigned once per instance rather than per step.
    newness_score: >-
      As mathematics, expected to be folklore. As an organising object in this
      corpus, absent: the pool contains the rows and not the column. Row R6's
      consequence for the program's own alpha lane is the part most likely to be
      genuinely new and is also the part most likely to be unwelcome.
    testability_score: >-
      High and cheap: toy torsors with a synthetic action, three arms, exponent
      fits over three orbit sizes. No isogeny arithmetic is needed for the core
      measurement at all.
    survival_score: >-
      The label survives for every free transitive abelian action, which covers
      CSIDH, every oriented setting, and the ordinary-curve class-group lanes. It
      dissolves at the non-abelian supersingular graph, and that boundary is
      sharp, stated, and used as the proves-too-much control.

  predictions:
    - metric: >-
        M1 -- fitted exponent of vectorization cost in the orbit size h, measured
        on synthetic free transitive abelian torsors with the action supplied on
        BOTH endpoints, across orbit sizes spanning at least 2^{10}
      direction: lower
      minimum_effect: >-
        Predicted 0.50 +/- 0.05. A fitted exponent outside that band means the
        birthday argument is not what is being measured and the instrument is
        wrong.
    - metric: >-
        M2 -- the same fit with the action supplied on the REFERENCE endpoint
        only
      direction: higher
      minimum_effect: >-
        Predicted 1.00 +/- 0.05. AN INTERMEDIATE FITTED EXPONENT, ANYWHERE
        STRICTLY BETWEEN 0.55 AND 0.95, REFUTES THE DICHOTOMY AND IS THE MOST
        VALUABLE OUTCOME OF THE WHOLE RECORD, because it would mean sidedness is
        a matter of degree and the table's prices are wrong.
    - metric: >-
        M3 -- the same fit with a FAKE orientation: a random labelling of the
        orbit with the same cardinality and no compatibility with the action
      direction: higher
      minimum_effect: >-
        Predicted 1.00 +/- 0.05, identical to M2. If the fake orientation gives
        an exponent below 0.95 the measurement is detecting the labelling's
        bookkeeping rather than the action, and both M1 and M2 are void.
    - metric: >-
        M4 -- the smooth-only sub-case: action evaluable at the target ONLY for
        smooth-norm ideals
      direction: different
      minimum_effect: >-
        Predicted 0.50, i.e. the same as full regime 1, because smooth ideals
        generate and the giant steps can be taken with them. If the measured
        exponent is above 0.6 then evaluability-for-all-elements is genuinely
        required and the frozen source's references [17] and [18] are
        load-bearing for the CSIDH baseline in a way nobody here has said.
    - metric: >-
        M5 -- the proves-too-much control: applying the classification to the
        full non-abelian supersingular graph
      direction: different
      minimum_effect: >-
        The classification must return NOT APPLICABLE, and the measured cost
        there must be governed by the quadratic ball growth (p^{1/2} for a claw
        over p curves), NOT by any h^{1/2} formula. If the table appears to
        assign the full graph a regime and predict its cost, the argument proves
        too much and every row is suspect.

  minimal_test:
    design: >-
      THE CORE MEASUREMENT USES NO ISOGENY ARITHMETIC AT ALL, WHICH IS WHY IT IS
      CHEAP AND WHY IT ISOLATES SIDEDNESS FROM EVERY ARITHMETIC CONFOUND. Stage 0
      (zero compute): write the three regimes with their derivations, freeze the
      two baseline slices symbolically, and fill the eight-row table with each
      row's regime, price, and the record it comes from. Stage 1 (hours):
      implement synthetic free transitive actions of abelian groups of orders
      spanning 2^{16} to 2^{28} on abstract sets, and measure M1, M2, M3, M4 with
      operation counts and peak memory, fitting exponents in h. Stage 2 (hours):
      repeat the two-sided and one-sided arms on a REAL toy oriented instance --
      a small CSIDH-like F_p-rational supersingular set -- to check that the
      synthetic exponents survive contact with actual isogeny arithmetic, with
      the twist involution handled explicitly. Stage 3 (zero compute): the
      proves-too-much control M5. Stage 4 (zero compute): apply the table to the
      published data surface of each survivor named in RQ-SSI-001 and record,
      per quantity, its regime -- WITHOUT judging any scheme, since a table entry
      is an inspection result and not a verdict.
    controls:
      - >-
        FAKE-ORIENTATION NULL (blocking). A random labelling with matched
        cardinality and no action compatibility must give exponent 1. This is the
        control that separates "the datum acts" from "the datum is present".
      - >-
        BASELINE SLICES (blocking). h^{1/2} at h = p^{1/2} must return p^{1/4},
        reproducing the program's recorded CSIDH baseline; h^{1} must return
        p^{1/2}.
      - >-
        PROVES-TOO-MUCH CONTROL (blocking). The full non-abelian supersingular
        graph, where the conclusion is known false and the classification must
        decline to apply.
      - >-
        TWIST CONTROL for the real-instance arm. The quadratic twist inverts the
        action, so an implementation that conflates E with its twist will appear
        to gain a factor of sqrt(2) and, if careless, will misreport sidedness.
        The convention is fixed in writing before measurement.
      - >-
        MEMORY ARM. The regime-1 price is measured BOTH with h^{1/2} memory
        (birthday) and with distinguished points at low memory, so the table's
        price is not silently a high-memory-only price.
    required_metrics:
      - fitted exponent in h with confidence interval, per arm, over at least three orbit sizes
      - peak memory per arm
      - the eight-row table with regime, price, and source record per row
      - the real-instance arm's exponents against the synthetic arm's
      - the not-applicable verdict on the non-abelian control, recorded as a category

  falsification_conditions:
    - >-
      F1. M2 or M4 returns an exponent strictly between 0.55 and 0.95. The
      dichotomy is false, sidedness is graded, and the table's prices must be
      replaced by a curve. THIS IS THE OUTCOME THE RECORD MOST WANTS TO BE WRONG
      ABOUT and it must be reported prominently rather than smoothed.
    - >-
      F2. M3, the fake orientation, gives an exponent below 0.95. The instrument
      measures bookkeeping and all other arms are void.
    - >-
      F3. The baseline slices do not reproduce p^{1/4} and p^{1/2}. The pricing
      is wrong at the anchor and nothing is quotable.
    - >-
      F4. The classification assigns a regime to the full non-abelian graph and
      predicts its cost. It proves too much; the regimes are mis-specified.
    - >-
      F5. A reviewer establishes that a survivor publishes a regime-1 datum for
      its secret-side endpoint. That is a claimed exponent-halving against a
      deployed scheme and goes to independent review-breakthrough at max effort
      under AGENTS.md rule 12 before it is written anywhere outside the ledger.
      The record's prior on this is very low and it is written down so it cannot
      be quietly dropped.
    - >-
      F6. KN-OPEN-015, once opened, asks a different question than the one
      answered here. Then the record is a contribution to a question nobody
      asked and must be re-scoped rather than presented as closing an open
      problem.

  confounders:
    - >-
      C1. Synthetic torsors have no arithmetic, so the synthetic arms measure the
      COMBINATORICS of sidedness and nothing else. That is the point -- it is
      what isolates the variable -- but it also means a real instance could
      behave differently for arithmetic reasons, which is why Stage 2 exists and
      why its disagreement with Stage 1 would be a finding rather than noise.
    - >-
      C2. The one-sided price h is an upper bound from the best known method, not
      a lower bound. A cleverer one-sided algorithm would falsify the table
      without falsifying the two-sided row, and the record must never be quoted
      as evidence that a regime-0 instance is secure.
    - >-
      C3. Orbit size is not always the right measure. For a keyspace that is a
      BOX inside the group rather than the whole group -- which is exactly
      CSIDH's deployed shape per IDEA-20260901-871141 -- the relevant size is the
      box, and the table's h must be replaced by K throughout. A row quoted with
      the wrong size is off by a constant fraction of the exponent.
    - >-
      C4. Regime 1 as measured assumes h^{1/2} memory. With bounded memory the
      distinguished-point variant gives the same time exponent but the comparison
      against regime 0 -- which needs no memory at all -- becomes a two-axis
      comparison rather than a one-axis one, and a table with one number per row
      hides that. The memory arm is required for this reason.
    - >-
      C5. Row assignments for R3, R4 and R5 rest on RELAYED descriptions of
      records this session did not open. Each row is provisional until the owning
      record is read, and the table must carry that provenance per row rather
      than presenting itself as settled.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED, NO SCHEME IS JUDGED, AND NO SURVIVOR IS CLAIMED TO
      PUBLISH A DANGEROUS DATUM. Stage 4 produces an inspection table, not a
      verdict.
    - >-
      THE TABLE IS NOT A SECURITY ARGUMENT. Regime-0 rows carry upper bounds from
      known methods, never lower bounds, and quoting a regime-0 row as evidence
      of hardness would invert the record's own quantifier order.
    - >-
      The dichotomy is expected to be folklore as mathematics; the contribution
      claimed is organisational and quantitative and is confined to this program.
    - >-
      Row R6's warning -- that the alpha axis delivers a decision about delta_E
      and not an orientation, hence buys no exponent by itself -- is an argument,
      not a measurement, and it is stated so the program's own most-funded lane
      is tested by its own classification rather than exempted from it. It does
      NOT say the alpha lane is worthless: the alpha lane's value comes from
      IDEA-20260904-ec17aa's two-phase identity, which does not route through an
      orientation at all.
    - >-
      This record does not touch, cite, or depend on the frozen EXP-WESOVOW-001
      charging-law defect, the fitted_opt / PAPER_PAIRS anchor reconciliation,
      the P = 512 crossover, or the w = 2^80 sign.
    - >-
      SURVIVOR SCOPE. Row R1 (torsion images) describes the BROKEN SIDH/SIKE
      assumption and is present only to anchor the scale. Every survivor row
      concerns data those schemes actually publish, and no mechanism here assumes
      torsion-image access against a survivor.
    - Academic and defensive cryptanalysis only, per RQ-SSI-001's constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a free transitive action of an abelian group G, |G| = h, on a set X,
        and for a pseudorandom step function on X used by a
        distinguished-point search, the images [b].x_0 for b drawn from a
        pseudorandom sequence are equidistributed over X to within a factor
        1 + o(1), so the birthday bound applies with its usual constant and the
        two-sided cost is c h^{1/2} with c an absolute constant.
      rigorous_support: >-
        RIGOROUS SIDE. For b drawn UNIFORMLY from G, [b].x_0 is exactly uniform
        on X by freeness and transitivity -- this is an identity, not an
        assumption. The heuristic content is only that a pseudorandom WALK, which
        is what an implementation uses to avoid storing b, inherits that
        uniformity. CLASSICAL DISTRIBUTION STATEMENT IMITATED. The standard
        random-function model underlying Pollard rho and van Oorschot-Wiener, in
        which a deterministic iteration on a finite set is treated as a random
        function for the purpose of collision statistics.
      validation_plan: >-
        WHAT TO SAMPLE. The empirical collision time of the walk on synthetic
        torsors of known order, over at least 1000 independent seeds at each of
        at least four orbit sizes spanning 2^{16} to 2^{28}.
        COMPARISON DISTRIBUTION. The measured mean collision time against
        sqrt(pi h / 2), and the full distribution against the standard birthday
        distribution rather than only its mean, since a heavy tail would inflate
        the practical cost while leaving the exponent alone.
        TAIL CHECK. The 99th percentile of collision time against its predicted
        value; a fat right tail is the signature of a walk with short cycles and
        would mean the step function, not the action, is being measured.
        SCALE AND PARAMETERS RECORDED. Group order, group structure (cyclic
        versus a product of several factors, since a highly non-cyclic group can
        make a naive walk behave badly), step-function definition, seed policy.
        NO TRANSFER ASSUMPTION IS NEEDED for the synthetic arm: it is exact at
        every size tested. The transfer to real oriented instances is Stage 2 and
        is the only place a transfer assumption enters.
    - id: H2
      statement: >-
        A one-sided instance admits no algorithm asymptotically better than
        h^{1+o(1)} using only the action, so the regime-0 price is the true best
        known cost and not merely the price of the obvious method.
      rigorous_support: >-
        NONE, AND THIS IS DELIBERATELY THE WEAKEST ITEM. It is isolated so a
        reviewer can reject it without touching regime 1 or the classification's
        structure. What can be said: any algorithm restricted to computing
        [b].x_0 and comparing against x_1 is testing one point of the orbit per
        evaluation, so h evaluations are needed in that restricted model -- which
        is an argument about a model, not a lower bound about algorithms.
        Anything exploiting structure in X beyond the action is outside the model
        and outside this record.
      validation_plan: >-
        THIS HEURISTIC IS VALIDATED BY SEARCH, NOT BY SAMPLING, and the search is
        the honest deliverable. Enumerate every one-sided algorithm this program
        can name -- exhaustive forward search, forward search with a digest
        filter (IDEA-20260901-871141's law, which gives max(h/R, h^{1/2}) and
        therefore ESCAPES regime 0 as soon as R exceeds h^{1/2}, so the digest
        family is a genuine counterexample to a naive reading of H2 and is why
        the graded band exists in claim (B)), forward search with a
        self-pairing screen, and forward search with precomputation on the
        reference side. For each, record whether it stays at h and why. REPORT
        THE ENUMERATION AS A COUNT WITH MECHANISMS, and label the result
        unverified per docs/inventor-protocol.md section 4 -- a list of methods
        that stay at h is a fatigue report unless each carries its reason, and
        the digest row already shows the enumeration is not closed.
        TAIL CHECK, IN THE SEARCH SENSE: the digest escape means H2 is FALSE as
        literally stated whenever a digest of size above h^{1/2} exists, so the
        honest form of H2 is "no ACTION-ONLY one-sided algorithm beats h", and
        the record should adopt that narrower form if the enumeration confirms it.

  target_complexity:
    time_exponent: >-
      Regime 0: h^{1+o(1)}. Regime 1: h^{1/2+o(1)}. Regime 2: poly(log). Graded
      digest band: max(h/R, h^{1/2}) per IDEA-20260901-871141. Instantiated at
      the anchor: CSIDH and the Delfs-Galbraith second phase have
      h = p^{1/2+o(1)} and sit in regime 1 at p^{1/4+o(1)}; an oriented instance
      whose target-side orientation is withheld sits in regime 0 at
      p^{1/2+o(1)}. NO ROW IS AN IMPROVEMENT ON ANY PUBLISHED ALGORITHM; the
      table prices what is already known and names what a converter would be
      worth.
    memory_exponent: >-
      Regime 1 at h^{1/2} memory for plain baby-step giant-step, or tunable down
      to polynomial via distinguished points at the same time exponent -- so
      regime 1 dominates regime 0 on time and ties or beats it on the memory axis
      only in the distinguished-point form. Regime 0 needs no memory at all,
      which is worth stating because a table with one number per row would hide
      it and would make regime 0 look strictly worse than it is at bounded
      memory.
    best_known: >-
      Two-sided vectorization: h^{1/2+o(1)} with a matching generic lower bound
      (recalled). One-sided: h^{1+o(1)} by exhaustive forward search, with NO
      lower bound claimed. Torsion-image instances: polynomial (SIDH break,
      frozen source references [11], [31], [38]). Full non-abelian supersingular
      isogeny problem, for contrast and to mark the boundary: p^{1/3+o(1)}
      heuristic, p^{2/5+o(1)} unconditional, p^{1/2}(log p)^{O(1)} at polynomial
      memory -- none of which is an h^{1/2} formula, which is the
      proves-too-much control.
    hidden_overhead: >-
      The o(1) in each row hides the cost of EVALUATING the action once, which is
      polynomial for CSIDH-style smooth ideals and polynomial-but-with-large-
      constants for arbitrary ideals via the effective actions of the frozen
      source's references [17] and [18]. For an orbit whose group order must
      first be computed, an L[1/2] class-group precomputation hides in the same
      place and is charged in IDEA-20260904-6e8793 rather than here. A table
      quoted without those two disclosures would understate every row.
    tradeoff_note: >-
      Regime 1 interpolates on the van Oorschot-Wiener curve down to polynomial
      memory at the same time exponent, which is the standard behaviour for a
      torsor collision search. Regime 0 has no tradeoff to make. Parallelisation
      is linear in both regimes. This is the one place where the classification's
      single-number-per-row presentation is genuinely lossy and it is disclosed
      rather than smoothed.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES; NOT SET TO NULL. NO
    ALGORITHM IS PROPOSED, so every row of the frontier dominates this record;
    the comparison is recorded because the record PRICES those rows and must not
    misprice them.
    (i) Two-sided vectorization, h^{1/2} time, h^{1/2} memory (or polynomial
    memory with distinguished points at the same time), zero queries. This IS
    regime 1 and the record reproduces it rather than beating it.
    (ii) The generic group-action lower bound (recalled), which matches (i) and
    therefore CAPS everything the classification can offer inside the
    action-only model. The record cannot beat it and does not try.
    (iii) Self-pairing attacks at special discriminants, polynomial time. These
    DOMINATE every row of the table on exactly the instances where they apply,
    which is why row R5 is a graded band and not a regime.
    (iv) The SIDH break, polynomial. Dominates absolutely on torsion-image
    instances -- row R1 -- and is on the table only as an anchor.
    (v) For the non-abelian supersingular problem: p^{1/3} heuristic, p^{2/5}
    unconditional, p^{1/2} at polynomial memory, and the vOW interpolation. These
    are NOT comparable to the table's rows and the record's proves-too-much
    control exists to keep them apart.
    (vi) Data/queries: all rows use zero data and zero oracle queries; regime 2
    consumes the published auxiliary datum itself, which is the only data any row
    uses and is by definition free to the attacker.
  sota_delta: >-
    +0 on time, +0 on memory, +0 on data/queries. Nothing is improved; the record
    prices what exists.
    QUANTIFIED DELIVERABLES:
    (1) A three-regime classification with prices h, h^{1/2} and poly, and a
    graded digest band, with the gap between the first two shown to be exactly
    the birthday bound -- hence exactly a factor of two in the exponent, with no
    intermediate value, which is the falsifiable content.
    (2) An eight-row table assigning every auxiliary datum this program can name
    to a regime, with its price and its owning record.
    (3) A named, priced attack target: converting a regime-0 instance to a
    regime-1 instance is worth a factor of two in the exponent, so a converter
    costing less than h^{1/2} breaks even. That budget has never been written
    down here.
    (4) The first quantitative content for KN-OPEN-015, which
    IDEA-20260807-7d8ba9 records as having none.
    (5) A warning to this program's own alpha lane (row R6), derived from the
    classification rather than asserted, that a stratum DECISION is regime 0.

