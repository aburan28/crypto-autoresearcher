  minimal_test:
    design: >-
      STAGE 0 (zero compute, the whole deliverable): write the four lemmas and
      the headroom table; verify the baseline reproduction symbolically
      (sqrt(pi)/2 against 0.8862269254527579); verify the orbit-sum identity
      symbolically; state the Koblitz nearby-object control and confirm the
