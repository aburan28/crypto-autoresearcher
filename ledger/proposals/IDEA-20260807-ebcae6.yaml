      - claim: Ideal collision expectation on M states is sqrt(pi M / 2).
        responsibility: runtime
      - claim: The |Aut| = 2 row reproduces the frozen 0.886 convention.
        responsibility: baseline
      - claim: Every row names the curves it applies to and the exponent is
          unchanged in all of them.
        responsibility: scope

