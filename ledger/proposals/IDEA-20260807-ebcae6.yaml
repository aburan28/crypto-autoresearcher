      verify |Aut| in {2, 4, 6} matches the D_0 prediction, verify freeness by
      checking no nonzero point is fixed, and verify sum_{i<r}[lambda^i]A = O
      for the order-3 and order-4 scalars on those curves. This is a
      known-answer test of the derivation, not a measurement of a speedup, and
      it must be reported as such.
      STAGE 2 (zero compute): record the x-coordinate identifiability collision
      from the proof_search_map as a binding design constraint for
      IDEA-20260807-cbbcfd, -6355c6, -15b468.
    controls:
      - >-
        Baseline reproduction: sqrt(pi)/2 must equal the frozen 0.886
        convention to four decimals.
      - >-
        Nearby-object control: the argument must FAIL to bound Koblitz/subfield
        curves. An argument that bounds them is wrong.
      - >-
        Synthetic-lambda null with decay parameter r: derived charged gain must
        decay as 1/sqrt(r).
      - >-
        Freeness check on real toy curves at |Aut| = 4 and 6 (Stage 1).
    required_metrics:
      - "|Aut| enumerated explicitly per test curve, with D_0 recorded"
      - number of nonzero fixed points of each nontrivial automorphism (must be 0)
      - value of sum_{i<r} [lambda^i]A on each test curve (must be O)
      - the headroom table, with every entry shown as arithmetic on sqrt(pi/2)
      - explicit statement of which rows apply to which D_0

  falsification_conditions:
    - >-
      A prime-field curve with p > 3, prime-order G, and |Aut_{F_p}(E)| > 6.
      Lemma 1 is false and the ceiling is void.
    - >-
      A nontrivial automorphism fixing a nonzero point of a prime-order G.
      Lemma 2 is false, orbits are not equal-size, and the constant in Lemma 4
      does not apply.
    - >-
      An instance-independent O(1) canonicalisation for <[lambda]> with
      ord(lambda) large. (C2) is satisfiable beyond Aut, the ceiling is void,
      and this would be the most valuable single refutation in the lane. The
      quantifier_order block states that this record does NOT prove no such
      canonicalisation exists.
    - >-
      sqrt(pi)/2 failing to reproduce the frozen 0.886 convention. Then the
      program's convention means something other than what this record assumes
      and the headroom table is void until the convention is restated.
    - >-
      A measured fully-charged gain above the pre-registered row value on the
      matching family, surviving a matched-seed null (IDEA-20260807-cbbcfd).
      That would be the one interesting event in the lane and it is the
      outcome DECOMPOSITION.md section 4 flags as either an artifact or the
      lane's only real finding.

  confounders:
    - >-
      ENCODING SUBSTITUTION. Counting classes in x-coordinates instead of
      points makes |Aut| = 4 look like |Aut| = 2 (see observation_collision).
      Any downstream L6 number reported without stating whether classes were
      counted in points or in x is uninterpretable.
    - >-
      BASELINE SUBSTITUTION. Comparing against the UN-discounted 1.2533 rather
      than the program's 0.886 inflates every headroom by sqrt(2). The table
      states both columns for exactly this reason.
    - >-
      UNIT SUBSTITUTION. Step counts are not field multiplications. A quotient
      walk whose step costs more than the plain step can show a step-count gain
      and a charged loss. This record's table is in IDEAL STEP COUNTS and is
      therefore an UPPER bound on the achievable charged gain, never a
      prediction of one.
    - >-
      j-INVARIANT MIS-CLASSIFICATION. j = 0 requires D_0 = -3 AND p = 1 mod 3
      for the order-3 map to be F_p-rational; a curve with a = 0 over a prime
      p = 2 mod 3 has j = 0 but the extra automorphisms are not F_p-rational
      and |Aut_{F_p}| = 2. Any experiment must verify rationality, not just
      read j.

  interpretation_limits:
    - >-
      ANY MEASURED EXCESS OVER sqrt(|Aut|) IS A SUSPECTED INSTRUMENT ARTIFACT
      UNTIL A MATCHED-SEED NULL CONTROL SAYS OTHERWISE. This is the lane's
      standing rule (RQ-EWALK-8fa147 decision_target) and it applies to this
      record's own predictions: if a downstream run reports 2.0x on a j = 0
      curve, the first hypothesis is a broken harness, not a broken theorem.
    - >-
      This is a CEILING on one family, derived, not measured. It is not a lower
      bound on the ECDLP, not a statement that no attack beats rho, and not a
      closure of GOAL-ENDO-001 or of any other lane.
    - >-
      The exponent is 1/2 throughout and is fixed by KN-TECH-005. Nothing here
      moves it in either direction, and no summary may suggest otherwise.
    - >-
      Stage 1's checks are toy-scale known-answer tests of a derivation. They
      are not evidence about crypto-scale walk behaviour and may never be
      reported as such (AGENTS.md rule 7).
    - >-
      The |Aut| = 6 row applies to secp256k1 and is CLASSICAL. Nothing in this
      record is a new attack on it or on any deployed curve.

  reachability_gate: >-
    DOES NOT MOVE BETWEEN CURVES, AND THE GATE IS THE REASON THE HEADROOM TABLE
    IS NOT AN OPPORTUNITY. By T4 (DECOMPOSITION.md section 3) the isogeny class
    fixes t, hence D, hence D_0, hence whether j = 0 or j = 1728 occurs anywhere
    in the class: |Aut| is a CLASS INVARIANT up to the choice of curve within
    the class, and you cannot walk to a j = 0 curve from a class whose D_0 is
    not -3. So for a target curve with generic D_0 the |Aut| = 4 and 6 rows are
    unreachable at ANY cost -- not expensive, unreachable -- and the residual
    headroom is exactly 1.000. For a target already at j = 0 the row is
    available with no walking at all. There is therefore no reachability
    question in this lane: the answer is 0 steps or infinity, never something
    in between. This is stated because it makes the T5 gate trivial HERE while
    remaining the crux elsewhere in the campaign.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED. Explicitly: 1.2533*sqrt(N/|Aut|) group operations ideal,
      |Aut| <= 6, so the exponent is 1/2 and the constant is bounded below by
      0.5116*sqrt(N) over all prime-field curves. No exponent is claimed and
      none is available in this family.
    memory_exponent: >-
      O(1) per processor plus the distinguished-point table, unchanged from
      KN-TECH-006. The quotient does not change the memory exponent; it does
      change the DP density by a factor equal to the orbit size in the encoding
      the predicate reads, which is the subject of IDEA-20260807-15b468 and is
      NOT accounted for in the sqrt(|Aut|) folklore.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory, van Oorschot-Wiener parallelisation, fully
      charged (KN-TECH-001, KN-TECH-006), with the automorphism discount for
      CM curves (KN-TECH-018, KN-LIT-042). This record REPRODUCES that number
      and bounds it; it does not improve it.
    hidden_overhead: >-
      No o(1) term, because no asymptotic claim is made. What hides and is
      disclosed: (i) the fruitless-cycle overhead, which is strictly positive
      and makes sqrt(|Aut|) unattained; (ii) the DP-density inflation by the
      orbit size in the encoding; (iii) the curve model, worth a factor 2-3 in
      per-step field multiplications, which can swamp the entire sqrt(3)
      headroom.
    tradeoff_note: >-
      The distinguished-point granularity d is the memory/steps knob and is
      unaffected by the quotient EXCEPT through the DP-density inflation noted
      above. Parallelisation stays near-linear provided the canonicalisation is
      a function of the current class only (memorylessness, per KN-TECH-006);
      every escape rule in this lane must satisfy that or it is not comparable
      to the baseline at all.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and the answer is
    that this record MOUNTS NO ATTACK, so it is dominated on every axis by
    every row of the prime-field frontier:
      - parallel Pollard rho with DPs, 0.886*sqrt(N) time, O(1) memory per
        processor, no queries (KN-TECH-001, KN-TECH-006) -- dominates on time
        and memory;
      - the automorphism-discounted variant on CM curves, 0.886*sqrt(N/(|Aut|/2))
        time, same memory (KN-TECH-018, KN-LIT-042) -- dominates on time, and
        is precisely the object this record bounds rather than beats;
      - BSGS, sqrt(N) time and sqrt(N) memory (KN-TECH-031 as cited in
        IDEA-20260806-37eab9) -- dominates on time-only comparisons and is
        dominated on memory; either way it dominates a record that computes
        nothing;
      - Pollard kangaroo for intervals, and the Galbraith-Ruprai
        equivalence-class variant at a heuristic 1.36*sqrt(N) for groups with
        fast inversion (KN-LIT-7437) -- a different problem, listed because the
        frontier check must cover it and because it is the forward-guidance
        direction this record names as still open.
    On the data/query axis nothing here consumes queries, so no row is
    dominated there either. `null` would be a fabrication and is not used.
  sota_delta: >-
    ZERO speedup against every attack baseline; no run, no algorithm, no
    measurement. Stated quantitatively as an INFORMATION delta instead:
    converts an asserted constant (KN-TECH-018's "~sqrt(|Aut|), a constant not
    an exponent") into 4 lemmas, 1 unconditional bound |Aut| <= 6 over F_p, and
    a 3-row table whose entries are 1.0000 / 1.4142 / 1.7321 against the
