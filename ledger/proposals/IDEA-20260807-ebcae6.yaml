idea:
  id: IDEA-20260807-ebcae6
  question_id: RQ-EWALK-8fa147
  added: '2026-08-07'
  title: >-
    THE sqrt(|Aut|) CEILING, STATED AS A THEOREM RATHER THAN AS FOLKLORE: an
    equivalence-class rho walk on a prime-order subgroup can only be quotiented
    by a group that acts with equal-size orbits AND admits an O(1) canonical
    representative, that group is exactly the unit group of End_{F_p}(E), the
    unit group of an imaginary quadratic order has order at most 6, and the
    birthday constant on the resulting class set is 1.2533*sqrt(N/|Aut|) exactly
    -- so the whole L6 lane's maximum prize against this program's own
    already-negation-discounted baseline is a factor sqrt(3) = 1.732 on j = 0
    curves, sqrt(2) = 1.414 on j = 1728 curves, and EXACTLY 1.000 on every
    generic prime-field curve, with zero exponent movement in every case
  class: mechanism

  claim: >-
    (A) WHAT IS BEING CLOSED, AND WHAT IS NOT. This record asserts a CEILING on
    one family: rho-type collision walks that gain by identifying points of G
    under a group action computed from End_{F_p}(E). It asserts nothing about
    index calculus, nothing about isogeny transport, nothing about
    multi-target/preprocessing, and it is NOT an impossibility claim about the
    ECDLP. It is the lane's stated purpose (`RQ-EWALK-8fa147`,
    DECOMPOSITION.md L6) discharged as a derivation rather than as a
    measurement.

    (B) THE THREE CONDITIONS AN ADMISSIBLE QUOTIENT MUST MEET, TOGETHER. Let
    ~ be an equivalence on G = <P> of prime order N, and let the walk run on
    G/~ with the step defined by canonicalise-then-translate. For the walk to
    be a rho walk at all, three things must hold SIMULTANEOUSLY:
      (C1) EQUAL-SIZE ORBITS. The birthday law on G/~ is
        1.2533*sqrt(|G/~|) only when the classes are equinumerous; unequal
        classes make the induced stationary measure non-uniform and INCREASE
        the collision constant (a non-uniform distribution collides sooner in
        the heavy cells but the useful-collision yield falls; this is the
        standard second-moment effect and it never helps the fully charged
        cost).
      (C2) O(1) CANONICAL REPRESENTATIVE. Every step must map a class to a
        class deterministically, which requires computing a canonical element
        of the orbit in O(1) group operations. Without it the step cost scales
        with the orbit size.
      (C3) RELATION PRESERVATION. A collision of classes must yield a usable
        congruence in (a, b). This requires the action to be by GROUP
        AUTOMORPHISMS of G: if A ~ B means B = sigma(A) for sigma in a group
        Sigma of automorphisms, then a collision gives
        a_i P + b_i Q = sigma(a_j P + b_j Q) for a KNOWN sigma acting as a
        known scalar, hence a genuine congruence. An equivalence that is not
        by automorphisms gives a collision with no algebraic content.

    (C) THE THREE CONDITIONS ADMIT EXACTLY ONE FAMILY, AND IT IS SMALL. By
    (C3) Sigma must be a group of automorphisms of E acting on G. Over F_p
    with p > 3, Aut_{F_p}(E) is the group of units of End_{F_p}(E), which is
    an order O in the imaginary quadratic field K = Q(sqrt(t^2 - 4p)). The
    units of an order in an imaginary quadratic field are exactly the roots of
    unity it contains: {+-1} in general, {+-1, +-i} for Z[i] (D_0 = -4,
    j = 1728), and the six sixth-roots of unity for Z[zeta_3] (D_0 = -3,
    j = 0). Hence |Aut| in {2, 4, 6} and |Aut| <= 6 UNCONDITIONALLY for every
    prime-field curve with p > 3. The orbits of Aut on G \ {O} all have size
    |Aut| (Aut acts on the prime-order group by scalars of exact
    multiplicative order |sigma|, and no nonzero point is fixed by a nontrivial
    sigma because sigma acting as scalar s with s != 1 fixes A only if
    (s-1)A = O, impossible in a prime-order group for A != O and s != 1 mod N).
    So (C1) holds automatically and (C2) holds because the orbit has at most 6
    elements, each computable in O(1) field operations, and a minimum over at
    most 6 encodings is O(1).

    (D) WHY NO LARGER GROUP IS AVAILABLE. Suppose one tries Sigma = <[lambda]>
    for a non-unit endomorphism phi acting as the scalar lambda of
    multiplicative order r mod N. (C3) still holds. (C1) still holds. (C2)
    FAILS, and it fails in two independent ways that must both be named:
      (D1) ENUMERATION COST. The only general canonicalisation is to generate
        the orbit and take a minimum, costing r evaluations per step. The gain
        is sqrt(r) and the cost is r, so the charged ratio is r/sqrt(r) =
        sqrt(r) >= 1: strictly worse for every r >= 2. (This is the mechanism
        IDEA-20260802-005 proposes to MEASURE; here it is one of two legs of a
        derivation, and this record does not duplicate that measurement.)
      (D2) THE NATURAL O(1) INVARIANT DEGENERATES TO THE POINT AT INFINITY.
        The obvious candidate for an O(1) orbit invariant is the orbit sum
        S(A) = sum_{i=0}^{r-1} [lambda^i] A = [ (lambda^r - 1)/(lambda - 1) ] A.
        Since lambda^r = 1 and lambda != 1 with lambda - 1 invertible mod N
        (N prime), the bracket is 0 and S(A) = O for EVERY A. The invariant is
        constant, hence useless. This is not speculation: the r = 3 instance
        P + phi(P) + phi^2(P) = O was computed on a real curve
        (p = 4294967539, y^2 = x^3 + 7, N = 613557433) and returned the point
        at infinity, recorded in EV-ENDO-001 and KN-FIND-009 as a true relation
        yielding no discrete logarithm. (D2) is the point-level restatement of
        the eigenvalue-level Vieta degeneracy that KN-FIND-009 established.
      (D1) and (D2) are INDEPENDENT: (D1) says enumeration is too dear, (D2)
      says the cheapest non-enumerative route returns no information. Closing
      only one of them would leave the other open.

    (E) THE CONSTANT, EXACTLY. With Aut of order m in {2, 4, 6}, the class set
    has (N-1)/m + 1 elements, and the ideal random-walk collision law gives
    expected steps 1.2533*sqrt(N/m) = 1.2533*sqrt(N)/sqrt(m). Against the
    unquotiented ideal 1.2533*sqrt(N) that is exactly a factor sqrt(m).
    Against THIS PROGRAM'S BASELINE CONVENTION, which is 0.886*sqrt(N) and
    already contains the negation sqrt(2) (KN-TECH-006, KN-TECH-018), the
    residual headroom is sqrt(m/2): 1.000 at m = 2, sqrt(2) = 1.4142 at m = 4,
    sqrt(3) = 1.7321 at m = 6. THAT IS THE ENTIRE PRIZE OF LANE L6, and it is
    available only on curves with D_0 = -4 or D_0 = -3.

    (F) THE CEILING IS NEVER ATTAINED, AND THE SHORTFALL HAS A SIGN. The
    quotient step is canonicalise-then-translate, which is not equivariant for
    free: the canonicalisation re-injects an automorphism choice, creating
    fruitless cycles that must be detected and escaped. Detection and escape
    cost per-step arithmetic AND degrade the walk away from the ideal random
    map, so both terms push the achieved factor BELOW sqrt(m). The achieved
    factor is therefore <= sqrt(m) with equality only in the unattainable
    zero-overhead limit. How far below is an empirical question and is the
    subject of IDEA-20260807-6355c6 and IDEA-20260807-59f5b7, not of this
    record.

    (G) FORWARD GUIDANCE -- WHAT THIS DOES NOT CLOSE. Named explicitly because
    the closure standard requires it: (i) equivalences induced by ISOGENY
    transport between curves rather than by endomorphisms of one curve (R4,
    lane L10/L13) are untouched -- they are not automorphisms of G and (C3)
    does not apply in the same form; (ii) equivalence-class methods for the DLP
    in an INTERVAL, where Galbraith-Ruprai (KN-LIT-7437) report a heuristic
    1.36*sqrt(N) for groups with fast inversion, are a different cost
    functional and outside this ceiling; (iii) MULTI-TARGET and preprocessing
    settings (R8, lane L13) where the amortised per-target cost is the object;
    (iv) the MIXING-TIME axis, which changes the constant WITHIN the band
    [1.0, 1.2533] on a fixed class set and is not bounded by this argument
    (IDEA-20260807-59fed3, IDEA-20260807-06cc5d); (v) non-prime-order subgroups
    and extension fields, where Aut can be larger (Koblitz/subfield curves,
    Frobenius of order ~2m, KN-LIT-042) -- the |Aut| <= 6 bound is specific to
    E/F_p with p > 3.

  resource_label: >-
    R3 (End(E) as a ring -- specifically its UNIT GROUP and the multiplicative
    order of a non-unit eigenvalue mod N). No other resource is consumed.

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    INADMISSIBLE, AND THE RECORD IS FILED PRECISELY BECAUSE IT IS. Everything
    this family does with phi is apply it to points of G. G has prime order, so
    every endomorphism acts on G as multiplication by a scalar (H-ENDO-001),
    and an oracle returning phi(A) for points A of G is exactly Oracle D of
    KN-FIND-b7e091, which is generic-group simulable in O(log N) group
    operations and therefore closed at exponent 1/2 by Shoup's bound
    (KN-TECH-005). The lane is on the wrong side of the admissibility filter by
    construction (DECOMPOSITION.md section 4, L6). The deliverable is not an
    attack but the EXACT CONSTANT at which the closed family saturates, which
    is what every other lane in GOAL-ENDO-001 must charge against. Filing an
    inadmissible mechanism as a recorded closure with its obstruction named is
    the brief's stated legitimate outcome.

  discriminated_from:
    - >-
      KN-TECH-018, which RECORDS the sqrt(|Aut|) discount as an established
      technique with the sentence "the discount is a CONSTANT factor, not an
      exponent". That entry asserts the bound; it does not derive it, does not
      state which groups are admissible quotients, does not bound |Aut| over
      F_p, and does not compute the residual headroom against the program's own
      already-discounted baseline. This record supplies all four.
    - >-
      IDEA-20260802-005 (orbit-representative cost gate). That proposal is a
      CONTROL: it proposes to MEASURE the crossover r* at which orbit
      enumeration stops paying, using a free-representative calibrator. This
      record derives (D1) as one leg of a two-leg argument and adds the
      independent leg (D2), the degeneration of the orbit-sum invariant, which
      IDEA-20260802-005 does not contain. The two are complementary: if
      IDEA-20260802-005 runs, its measured r* is a check on (D1) and says
      nothing about (D2).
    - >-
      H-ENDO-001 and EV-ENDO-001 / KN-FIND-009. Those concern the WITNESS
      LATTICE W_r and the Vieta degeneracy of eigenvalue coordinates. The
      degeneracy in (D2) is the same algebra evaluated at the level of POINTS
      rather than eigenvalue vectors, and it is used for a different purpose:
      there it falsified a lattice prediction, here it closes a
      canonicalisation route. EV-ENDO-001's own forbidden-readings block
      states that R_2 is the GLV decomposition lattice underlying the
      automorphism-quotient walk -- i.e. it explicitly declines to close what
      this record closes.
    - >-
      IDEA-20260806-37eab9 and H-RHO-bc6ea6 / EXP-RHO-60da4f. Those derive the
      achievable BAND for iteration-function design ([1, ideal], factor under
      1.3) and measure the negation-quotient net gain for Aut = {+-1} only.
      This record derives the SPACE-SIZE ceiling across all admissible
      quotients, including |Aut| in {4, 6}, which H-RHO-bc6ea6 declares
      explicitly OUT OF SCOPE.
    - >-
      Not a restatement of Shoup (KN-TECH-005). Shoup bounds the exponent; this
      bounds the constant available to one specific structural device inside
      the exponent-1/2 regime.

  object_first_candidate:
    tracked_object: >-
      THE ADMISSIBLE QUOTIENT ITSELF: the pair (Sigma, canon) where Sigma is a
      group acting on G and canon is a class-representative function, followed
      as Sigma ranges over the subgroups of the scalar image of End_{F_p}(E) in
      (Z/N)^*. The tracked quantity per candidate is the triple (orbit size,
      per-step canonicalisation cost, collision constant on G/Sigma).
    lossiness: >-
      GENUINELY LOSSY AND THE TEST IS PASSED FOR Sigma = Aut, FAILED FOR THE
      NULL COMPARATOR. Projecting A to its Aut-orbit forgets exactly
      log2(|Aut|) bits -- which of the m orbit elements the walk is standing
      on. That is a real loss: from the class [A] one cannot recover A. Contrast
      the negative control of docs/inventor-protocol.md section 2: a projection
      that loses nothing is a change of coordinates. Here the discarded
      information is exactly the automorphism coordinate, and the retained
      information is the orbit, which is what the DLP relation depends on
      because sigma acts as a KNOWN scalar.
    propagation: >-
      DOES NOT PROPAGATE FOR FREE, AND THIS IS THE LANE'S CENTRAL STRUCTURAL
      FACT. The group law does not descend to orbits: [A] + [T] is not
      well-defined, because (sigma A) + T and A + T are not Aut-related for
      sigma != 1. Determinism is restored ONLY by the composite
      canonicalise-then-translate map, which is well-defined on classes by
      construction. The price of restoring determinism is that the canon step
      re-inserts an automorphism choice at every step, and the resulting map
      has 2-cycles. So the lossy projection propagates deterministically, but
      only through a repaired map whose repair is exactly the source of the
      fruitless-cycle overhead. The lossy-projection test is passed and the
      compatibility clause is passed only conditionally -- which is the honest
      reading and the reason the ceiling is never attained.
    survival_score: >-
      Survives: change of curve model, change of step table, change of DP
      granularity, parallelisation, change of r. Dies at: composite-order
      subgroups (Aut may fix nonzero points, breaking equal-size orbits), at
      extension fields and subfield/Koblitz curves (Frobenius enlarges the
      admissible Sigma and the |Aut| <= 6 bound is false there), and at any
      Sigma generated by a non-unit endomorphism (fails C2 by both D1 and D2).

  mechanism: >-
    ZERO COMPUTE. The deliverable is a written derivation with four
    single-responsibility lemmas and one arithmetic table.

    LEMMA 1 (SIZE / unit bound). For p > 3 and E/F_p, Aut_{F_p}(E) = O^* where
    O = End_{F_p}(E) is an order in an imaginary quadratic field; O^* is the
    group of roots of unity in O; hence |Aut| in {2, 4, 6}, with 4 only for
    D_0 = -4 (j = 1728) and 6 only for D_0 = -3 (j = 0). Responsibility: size.

    LEMMA 2 (FREENESS / equal orbits). Every nontrivial sigma in Aut acts on
    the prime-order group G as a scalar s != 1 mod N, and (s - 1) is
    invertible, so sigma fixes no point of G except O. Hence Aut acts freely on
    G \ {O} and all orbits have size exactly |Aut|. Responsibility:
    correctness.

    LEMMA 3 (COST / canonicalisation). A canonical representative of an
    |Aut|-element orbit is computable with at most |Aut| - 1 field
    multiplications and |Aut| - 1 comparisons on the encoding, hence O(1).
    For Sigma = <[lambda]> with lambda of multiplicative order r, no O(1)
    canonicalisation is known and two routes are closed: enumeration costs r
    (D1), and the orbit-sum invariant is identically O (D2, proved by the
    geometric-series identity and instantiated in EV-ENDO-001).
    Responsibility: runtime.

    LEMMA 4 (RUNTIME / the constant). The ideal random-walk first-collision
    expectation on a set of M states is sqrt(pi M / 2) = 1.2533*sqrt(M). With
    M = (N-1)/|Aut| + 1 this is 1.2533*sqrt(N/|Aut|) up to O(1/N).
    Responsibility: runtime.

    ASSEMBLY. Lemmas 1-3 say Sigma = Aut is the unique admissible choice and
    |Aut| <= 6. Lemma 4 turns that into the constant. The residual-headroom
    table against the program baseline 0.886*sqrt(N) follows by division:
      |Aut| = 2 -> 0.8862*sqrt(N), headroom 1.0000, curves: all
      |Aut| = 4 -> 0.6267*sqrt(N), headroom 1.4142, curves: D_0 = -4, j = 1728
      |Aut| = 6 -> 0.5116*sqrt(N), headroom 1.7321, curves: D_0 = -3, j = 0
    Every number in that table is arithmetic on 1.2533 = sqrt(pi/2) and is
    checkable by hand; none is a measurement and none is presented as one.

    SCOPE NOTE THAT MUST TRAVEL WITH THE TABLE. secp256k1 is y^2 = x^3 + 7,
    which has j = 0, so the |Aut| = 6 row is not hypothetical for deployed
    curves. This is CLASSICAL (Wiener-Zuccherato KN-LIT-042; Duursma-Gaudry-
    Morain as cited there; GLV as recorded in KN-TECH-018) and nothing new is
    claimed about it. It is stated so that no reader mistakes the |Aut| = 6 row
    for an unexploited opportunity.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/, analysis/ on 2026-08-07 for:
      "sqrt(|Aut|)", "automorphism.quotient", "equivalence-class rho",
      "unit group", "roots of unity", "orbit sum", "Duursma", "j = 0",
      "fruitless", "Wiener-Zuccherato". Records read in full before writing:
      KN-TECH-018, KN-TECH-006, KN-TECH-005, KN-TECH-001, KN-FIND-b7e091,
      KN-FIND-009, KN-LIT-042, KN-LIT-097, KN-LIT-7437, H-ENDO-001,
      EV-ENDO-001, H-RHO-bc6ea6, EXP-RHO-60da4f, IDEA-20260806-37eab9,
      IDEA-20260802-005, DECOMPOSITION.md, RQ-EWALK-8fa147.
    results: >-
      "sqrt(|Aut|)" / "automorphism quotient": 25 files, of which the
      substantive ones are KN-TECH-018 (asserts the constant, does not derive
      it or bound |Aut|), H-ENDO-001 (uses 0.886*sqrt(N/|Aut|) as an UNMEASURED
      calibration -- its own prediction 4 says "this campaign has never measured
      it"), IDEA-20260802-005 (the enumeration-cost leg), and the DECOMPOSITION
      itself. "orbit sum" as a canonicalisation invariant: ZERO hits. The
      identity sum_i [lambda^i]A = O appears in the corpus only at the
      eigenvalue level, in KN-FIND-009 / EV-ENDO-001, and only as a falsifier of
      a lattice prediction -- never as a closure of a canonicalisation route.
      The residual-headroom table (1.000 / 1.414 / 1.732 against 0.886) appears
      NOWHERE in the corpus. RQ-EWALK-8fa147 has zero proposals attached
      (grep over ledger/ returned only the goal record and the question).
    verdict: >-
      ADAPTATION. Lemmas 1, 2 and 4 are textbook (Silverman III.10 for the
      automorphism classification; the birthday law for the constant) and are
      claimed as new to NOBODY. What is new to THIS PROGRAM is the assembly
      into a stated ceiling with the three admissibility conditions made
      explicit, the (D2) invariant-degeneration leg, and the residual-headroom
      table against the program's own convention. No claim of novelty against
      the external literature is made; Wiener-Zuccherato and Duursma-Gaudry-
      Morain are the standing answers and this record is a restatement with the
      program's own baseline arithmetic attached.

  null_object_control: >-
    MANDATORY AND SUPPLIED, EVEN THOUGH THIS RECORD IS ZERO-COMPUTE. The
    matched null object is the SAME derivation run on a group Sigma that
    satisfies (C1) and (C3) but not (C2): Sigma = <[lambda]> for a synthetic
    lambda of multiplicative order r drawn uniformly from the divisors of
    N - 1. THE DECAY PARAMETER IS r. If the derivation is sound, the derived
    net charged gain must DECAY as 1/sqrt(r) as r increases -- i.e. the
    "speedup" turns into a loss, monotonically, and the crossover is at
    r = 1. A derivation that predicts a gain that does NOT decay as r grows is
    the canonical artifact tell (docs/inventor-protocol.md section 3) and would
    mean the cost model, not the mathematics, is doing the work. SECOND NULL,
    for the arithmetic: the |Aut| = 2 row must reproduce the program's frozen
    0.886 constant EXACTLY from 1.2533/sqrt(2) = 0.88623, not approximately. A
    table that cannot regenerate the program's own baseline is wrong.

  assumptions:
    - >-
      p > 3, E/F_p ordinary or supersingular but with G of PRIME order N, and
      Aut taken over F_p (not over the algebraic closure). Over Fbar_p a
      supersingular curve in characteristic 2 or 3 has larger automorphism
      group; that is excluded by p > 3 and by working over F_p.
    - >-
      N prime is load-bearing in Lemma 2 and in (D2): over a composite modulus
      (s - 1) need not be invertible, sigma can fix a nonzero point, orbits can
      have unequal size, and the orbit-sum need not vanish. Nothing here
      transfers to composite-order subgroups, and Pohlig-Hellman makes that
      case a different problem anyway.
    - >-
      The birthday constant 1.2533 = sqrt(pi/2) is the ideal random-map value.
      Real walks are at or above it (Teske's r-adding walks reach it,
      KN-TECH-006). Using the ideal value makes the ceiling GENEROUS to the
      quotient walk, which is the correct direction for a ceiling claim.
    - >-
      "O(1) canonicalisation" is measured in field operations on the encoding,
      not in wall clock. A curve model that makes the negation map non-free
      (e.g. some projective coordinate systems require a normalisation) shifts
      the constant but not the bound.

  proof_search_map:
    bottleneck: >-
      The canonicalisation step. Everything in the ceiling turns on whether a
      canonical orbit representative is computable in O(1); if it is, the
      quotient pays sqrt(|orbit|), and if it is not, the quotient loses.
      Removing that bottleneck -- exhibiting an O(1) canonicalisation for an
      orbit of unbounded size -- is exactly what would break the theorem.
    baseline_embedding:
      parameter_slice: >-
        |Aut| = 2, i.e. Sigma = {+-1}, canon = the point with y <= (p-1)/2.
        This slice must reproduce the program's frozen baseline convention
        0.886*sqrt(N) (KN-TECH-006) exactly.
      reproduction_check: >-
        SYMBOLIC, not a plot: sqrt(pi/2)/sqrt(2) = sqrt(pi)/2 = 0.8862269...,
        compared digit-for-digit against the 0.8862269254527579 recorded as
        `negation` in the staged artifact inputs/h100_session/h040_rho_const.json
        and against the 0.886 in KN-TECH-006. A mismatch in the fourth decimal
        means the convention is not what this record assumes and the whole
        headroom table is void.
    observation_collision:
      observable: >-
        The pair (|Sigma|, achieved collision constant). The claim is that the
        constant is determined by |Sigma| alone via 1.2533/sqrt(|Sigma|).
      distinct_preimage_search: >-
        REQUIRED, AND ONE COLLISION IS EXPECTED AND MUST BE DISCLOSED: on a
        j = 1728 curve, Sigma = {+-1} (order 2) and Sigma = {+-1, +-i} (order
        4) are DIFFERENT groups; but in the x-COORDINATE the order-4 group has
        orbits {x, -x} of size 2, identical in size to the negation orbits on a
        generic curve. So an instrument that measures classes in x-coordinates
        only cannot distinguish |Aut| = 4 from |Aut| = 2, and would report the
        j = 1728 gain as 1.000 rather than 1.414. THAT IS A REAL
        IDENTIFIABILITY FAILURE OF THE x-ONLY ENCODING and it is recorded here
        as a design constraint on every downstream L6 experiment: the class set
        must be counted in POINTS, not in x-values, or the |Aut| = 4 row is
        invisible. (The additional separating condition is the y-coordinate
        action of i, which is multiplication by a square root of -1.)
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "the speedup is sqrt(|Aut|)" with the stronger triple
          (orbit size, canonicalisation cost, collision constant), carried
          through the argument as a unit. The stronger state is what survives
          the change from Sigma = Aut to Sigma = <[lambda]>, where the first
          and third components look better and the second component kills it.
        predicted_gain: >-
          Makes the failure mode of every larger-Sigma proposal legible in
          advance, at zero compute, instead of requiring a measurement per
          proposal.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (achieved collision constant) fixed and vary the
          forgotten structure (which group Sigma produced it). The x-coordinate
          collision above is exactly such a fiber, and the intrinsic invariant
          that separates its two members is the action of Aut on y.
        predicted_gain: >-
          A named encoding constraint (count classes in points, not in x) that
          every L6 measurement must obey.
    quantifier_order: >-
      CLAIMED: FOR ALL p > 3, FOR ALL E/F_p, FOR ALL prime-order subgroups
      G <= E(F_p), FOR ALL groups Sigma acting on G satisfying (C1)-(C3) with
      an O(1) canonicalisation, THERE EXISTS m in {2,4,6} with Sigma <= Aut,
      |Aut| = m, and the ideal quotient-walk collision expectation equals
      1.2533*sqrt(N/m).
      NOT CLAIMED, and the distinction matters: FOR ALL Sigma THERE EXISTS a
      canonicalisation cost bound -- i.e. letting the canonicalisation depend
      on the instance. (D1)/(D2) close the two known instance-independent
      routes for Sigma = <[lambda]>; they do NOT prove that no instance-
      dependent O(1) canonicalisation exists for some special lambda, and this
      record does not claim they do. That gap is stated as the theorem's own
      escape hatch, and finding such a canonicalisation would be the single
      most interesting possible refutation.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the family of rho-type collision walks on G quotiented by a
        group action computed from End_{F_p}(E), with an instance-independent
        canonicalisation, the fully-charged speedup over unquotiented rho is at
        most sqrt(6) and at most sqrt(3) over this program's baseline, with
        zero exponent change." It can NEVER certify anything about index
        calculus, isogeny transport, multi-target amortisation, interval DLP,
        or extension fields.
      nearby_object_control: >-
        THE KOBLITZ / SUBFIELD CURVE, where Frobenius supplies an
        automorphism-like map of order ~2m and the sqrt(2m) factor recorded in
        KN-LIT-042 exceeds sqrt(6). The method MUST fail to bound that case,
        and it does, because Lemma 1's unit-group argument is specific to
        End_{F_p}(E) being an imaginary quadratic order acting on a
        prime-field curve. A version of this argument that "proved" sqrt(6) for
        Koblitz curves would be proving something false, and that is the check.
    proof_obligations:
      - claim: Aut_{F_p}(E) = O^* and |O^*| <= 6 for p > 3.
        responsibility: size
      - claim: Aut acts freely on G \ {O} when N is prime.
        responsibility: correctness
