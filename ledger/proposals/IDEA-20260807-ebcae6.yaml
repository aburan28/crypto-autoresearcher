    today. It additionally closes 2 named canonicalisation routes for
    larger-orbit quotients (enumeration at cost r; orbit-sum invariant,
    identically O) and produces 1 binding encoding constraint (count classes in
    points, not x) for the rest of the lane. It moves no exponent, no constant,
    and no hypothesis status.

