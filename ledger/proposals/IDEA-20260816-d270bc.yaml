idea:
  id: IDEA-20260816-d270bc
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-16'
  title: 'Treat the FrodoKEM IND-CCA bound not as a number but as a label field: over the grid of
    hash queries, decapsulation queries, failure rate, user count and ciphertext count, record only
    WHICH additive term is largest, and ask whether the resulting dominance partition has the small,
    piecewise-monotone cell structure a correctly transcribed reduction ledger must have.'
  class: representation
  claim: '(A) OBJECT. A Fujisaki-Okamoto style IND-CCA bound is a finite sum of additive terms, each
    of which is, at fixed parameter set, a product of powers of the inputs (hash query count qH, decapsulation
    query count qD, correctness error delta, user count U, ciphertext-per-user count C) times a constant.
    Define the DOMINANCE LABEL at a grid point as the index of the single largest term. The label
    field over a log-spaced grid is a lossy projection of the bound: it discards every magnitude and
    keeps only an argmax. (B) STRUCTURAL CLAIM. Because each term is a monomial in the logs of the
    inputs, the boundary between any two labels is a hyperplane in log-coordinates, so the partition
    must consist of finitely many convex cells and every label region must be monotone along each
    coordinate axis in a direction fixed by the sign of the exponent difference. This is a falsifiable
    structural prediction about the partition that does not depend on any numeric value being correct,
    only on the bound being a sum of monomials. (C) DIAGNOSTIC CLAIM. Because cell topology is determined
    by exponent DIFFERENCES rather than by constants, a transcription error that mistypes one exponent
    generically changes the number of cells or the orientation of a boundary, while a transcription
    error that mistypes one constant generically does not. The partition is therefore an exponent-level
    fingerprint of a transcription, obtainable before any bit-security figure is computed and usable
    to compare two independent transcriptions of the same printed bound. (D) WHAT IS NOT CLAIMED.
    No attack, no speedup, and no statement about deployed FrodoKEM. A dominance partition says which
    term of a PROOF is largest where; it says nothing about what any adversary can do, nothing about
    the hardness of plain LWE at Frodo dimensions, and nothing about whether a published security
    category is correct. A cell in which a delta-dependent term dominates is not evidence that decryption
    failures are exploitable. This proposal also does not claim that any published bound is wrong;
    it claims only that the partition is computable and diagnostic.'
  mechanism: STAGE 1, transcription. Once the primary FrodoKEM security-argument text is filed as
    a KN-LIT entry per RQ-FRODO-a2dbe2 constraint 1, transcribe the IND-CCA inequality as a machine-readable
    list of terms, each a dict of {constant, exponent on qH, exponent on qD, exponent on delta, exponent
    on U, exponent on C, and a symbolic reference to the OW-CPA or IND-CPA advantage}. Two agents
    transcribe independently and the two term lists are diffed. STAGE 2, structural audit at zero
    compute. Verify algebraically that every term is a monomial in the logs; any term that is not
    (for example a term containing a sum inside a square root) is split or flagged, because the convex-cell
    prediction only applies to monomials, and a non-monomial term is exactly the interesting case.
    STAGE 3, label field. Evaluate the argmax over a log-spaced grid in the five inputs using exact
    rational arithmetic on the logs where possible and certified interval arithmetic otherwise, so
    that a reported boundary is not a rounding artifact. Extract the cell count, the boundary normals,
    and monotonicity along each axis. STAGE 4, mutation. Perturb one exponent by one unit and recompute
    the partition; record whether cell count or boundary orientation changed. Perturb one constant
    by a factor of two and recompute; record the same. The diagnostic claim (C) is refuted if constant
    perturbations move the topology as often as exponent perturbations. STAGE 5, null. Run the identical
    pipeline on a synthetic sum of terms with exponents drawn uniformly at random from the same range,
    and compare cell counts and boundary structure.
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-FRODO-a2dbe2.yaml and RQ-FRODO-3260cc.yaml in full, ledger/goals/GOAL-FRODO-001.yaml
      and GOAL-FRODO-002.yaml, ledger/hypotheses/H-FRODO-e0c651.yaml and H-FRODO-8ea540.yaml. Ran
      grep -ril over ledger/proposals/ for the strings: Fujisaki, tightness, reduction tightness,
      QROM, multi-target, multi_target, salt, IND-CCA bound, HHK, OW-CPA, transform T, correctness
      error, decryption failure, Renyi, implicit rejection, explicit rejection, re-encryption, unstructured.
      Read the titles and question_id fields of the twenty-two nearest hits by yaml parse.'
    results: 'Six proposals sit on the two FRODO questions and none of them treats the reduction inequality
      as a structured object: IDEA-20260805-390957 (five exact identities of the thirteen-integer
      sampling table), IDEA-20260805-411b60 (mutation control with derived magnitude on the failure
      rate), IDEA-20260805-57fc49 (Renyi order read backwards as a sample-count receipt), IDEA-20260808-2df781
      (the error table as the solution of a finite integer program), IDEA-20260805-f16b44 (scale error
      versus tail-shape error in a failure rate), IDEA-20260808-dd4d30 (rank-nbar primal sublattice
      from the matrix secret). All six are about NUMBERS entering the bound; none is about the bound.
      The single hit on the exact string reduction tightness, IDEA-20260815-72c70d, is a CGL hash
      margin recomputation under an isogeny result and is unrelated. IDEA-20260813-6819af (MQOM, TCitH
      ROM/QROM game-hop saturation ledger) is the nearest methodological neighbour anywhere in the
      corpus: it enumerates game hops and hunts a matching adversary, which is an adversary-search,
      not a partition of a parameter grid by dominant term.'
    verdict: 'UNVERIFIED. This program cannot reach external literature and therefore cannot and does
      not assert that the dominance-partition representation is new outside this repository. What
      is claimed new INSIDE this repository: no existing record represents a security bound as an
      argmax label field, and no existing record uses cell topology as a transcription fingerprint.
      What is assembled from known parts: the mutation control is the discipline already fixed by
      RQ-FRODO-3260cc methods and sharpened by IDEA-20260805-411b60; the demand for a baseline reproduction
      before any swept table is RQ-FRODO-a2dbe2 methods verbatim; representing a formula as a term
      list is ordinary computer algebra. The novel move is only the projection to argmax and the structural
      prediction it licenses.'
  object_first_candidate:
    tracked_object: 'The dominance label field: the function from a point of the five-dimensional
      log-parameter grid (log qH, log qD, log delta, log U, log C) to the integer index of the largest
      additive term of the transcribed IND-CCA bound at that point, together with the induced partition
      of the grid into label cells.'
    lossiness: 'The projection discards the magnitude of every term, the value of the bound, and the
      resulting bit-security figure, retaining only an ordering decision. This is genuinely lossy:
      infinitely many bounds share a partition, because multiplying every term by a common factor,
      or changing any single constant by less than the gap to the runner-up, leaves the label unchanged.
      What survives propagates because the argmax of a sum of monomials is determined by exponent
      differences and the logs of constants alone, so moving one step in any input axis moves the
      label in a direction fixed in advance by the sign of an exponent difference. The retained part
      is therefore not merely a summary; it is closed under the operation of stepping through parameter
      space.'
    propagation: One step of the target operation is one multiplicative step in a single input, for
      example doubling qH. Under that step every term is multiplied by two raised to its own exponent
      on qH, so the log-gap between terms i and j changes by exactly (e_i minus e_j), the difference
      of their qH exponents. The label therefore either stays fixed or flips once, monotonically,
      in the direction of the larger exponent, and never oscillates along that axis. This gives a
      deterministic one-step propagation rule for the object with no numerics at all.
    survival_score: 'The structure survives exactly as long as every term is a monomial in the inputs.
      It dissolves at the first non-monomial term, and the standard candidates are named in advance:
      a square root of a sum, a term of the form qH times the square root of delta, a min or max of
      two expressions, or a term in which the OW-CPA advantage itself depends on qH. Concretely, the
      object is predicted to survive across the whole plausible deployment grid for the ROM-shaped
      terms and to dissolve at the first QROM term containing a square root of a sum. Where it dissolves
      is the interesting output, because that is exactly the location where a bound stops being ledger-like
      and starts being a genuine inequality.'
  null_object_control: A synthetic bound with the same number of terms and the same number of input
    variables, whose exponents are drawn uniformly at random from the integer range minus two to plus
    three and whose constants are drawn log-uniformly over the same span as the transcribed ones,
    evaluated by the IDENTICAL argmax pipeline on the IDENTICAL grid in the same invocation. The null
    must show materially MORE cells and boundary normals with no shared direction; if the random bound
    produces the same small cell count and the same near-axis-aligned boundaries as the transcribed
    bound, then the partition is a property of the grid and the pipeline rather than of FrodoKEM,
    and the signal arm means nothing. A second null runs the pipeline on a bound with a single term,
    which must return exactly one cell; failure there is a pipeline bug rather than a finding.
  discriminated_from:
  - 'IDEA-20260805-f16b44 (FRODO): asks what a failure-rate error is WORTH in bits, that is, it differentiates
    the bound with respect to one input. This proposal never evaluates the bound; it computes an argmax
    label and studies the topology of the resulting partition, which is invariant to the scaling that
    f16b44 measures.'
  - 'IDEA-20260805-411b60 (FRODO): a derived-magnitude mutation control on the decryption failure
    rate computation. Its object is a single scalar response; here the mutation control acts on EXPONENTS
    and its readout is a change in cell topology, which is exactly the quantity a scalar response
    cannot see.'
  - 'IDEA-20260813-6819af (MQOM): a reduction-loss saturation ledger that enumerates game hops and
    searches for matching adversaries or slack witnesses. That is an adversary-existence question;
    this is a representation question about an already-written inequality and deliberately searches
    for no adversary at all.'
  - Ordinary parameter sweeps of a security bound, which report a bit-security surface. A surface
    is the unprojected object; the whole content of this proposal is that discarding the surface and
    keeping the argmax yields a discrete invariant with a provable structure and a diagnostic use.
  - 'H-FRODO-8ea540: decomposes the Renyi divergence-to-bit-security conversion into two named loss
    terms and reasons about which rises and falls in the order a. That is a two-term analysis inside
    the sampling argument; this is a many-term analysis of the CCA bound and does not touch the divergence
    step.'
  assumptions:
  - The primary FrodoKEM security-argument text is filed as a KN-LIT entry with extraction damage
    marked, per RQ-FRODO-a2dbe2 constraint 1. Nothing here may run before that.
  - The transcribed bound is a finite sum of terms; a bound presented as a nested composition of lemmas
    is first flattened, and the flattening is recorded as a derivation step that a reviewer can check.
  - Log-space arithmetic on the grid is carried out with enough precision that a reported boundary
    is not a rounding artifact; interval arithmetic is used and intervals that straddle a tie are
    reported as ties rather than resolved.
  - The deployment-plausible grid ranges are chosen and FROZEN before the run, and are chosen wide
    enough to contain both the published evaluation point and several orders of magnitude on each
    side.
  - The OW-CPA or IND-CPA advantage term is carried as an opaque symbol with a swept placeholder value
    and is never estimated by this program, per RQ-FRODO-a2dbe2 constraint 2.
  predictions:
  - metric: number of distinct dominance cells over the frozen five-dimensional grid, signal arm
    direction: lower
    minimum_effect: 6
  - metric: number of distinct dominance cells, random-exponent null arm, same grid and same pipeline
    direction: higher
    minimum_effect: 12
  - metric: fraction of single-unit exponent mutations that change cell count or a boundary normal
    direction: higher
    minimum_effect: 0.5
  - metric: fraction of factor-of-two constant mutations that change cell count or a boundary normal
    direction: lower
    minimum_effect: 0.1
  - metric: number of grid axes along which some label region is non-monotone
    direction: lower
    minimum_effect: forced value 0 for any purely monomial transcription; a nonzero count is a direct
      falsifier of the monomial reading and must be reported as such rather than explained away
  minimal_test:
    design: 'The cheapest discriminating measurement needs no primary source at all and should be
      run first as an instrument check. Write the term-list evaluator and the argmax partition extractor.
      Instantiate it on a HAND-WRITTEN four-term toy bound whose partition is derivable on paper,
      and confirm the extractor recovers the paper answer exactly, including tie regions. Then run
      three arms in one invocation: the toy bound, a random-exponent bound with the same term count,
      and a single-term bound. Record cell counts, boundary normals, per-axis monotonicity, and the
      response of each to one-unit exponent mutations and factor-of-two constant mutations. This costs
      minutes of CPU and zero primary-source dependency, and it decides the only thing that matters
      before the real transcription arrives: whether the argmax projection is discriminative at all,
      or whether random bounds of the same shape look identical to structured ones. If the null arm
      is indistinguishable from the structured toy arm, the whole proposal is dead at that point and
      the measured cell-count distributions are the deliverable.'
    controls:
    - Random-exponent null bound with matched term count and matched constant span, run in the same
      invocation as the signal arm.
    - Single-term degenerate bound, which must yield exactly one cell.
    - Hand-derived toy bound with a paper-computable partition, used as the baseline reproduction
      gate before any other arm is reported.
    - Exponent mutation ladder at plus and minus one unit on each exponent in turn.
    - Constant mutation ladder at factors of one half and two on each constant in turn.
    - 'Grid-refinement control: re-run at twice the grid resolution and confirm cell count and boundary
      normals are stable, so that a reported cell is not a sampling artifact.'
    required_metrics:
    - cell count per arm
    - boundary normal vectors, as integer exponent-difference vectors
    - per-axis monotonicity flag per label region
    - fraction of tie points, that is, grid points whose interval argmax is ambiguous
    - topology-change rate under exponent mutation
    - topology-change rate under constant mutation
    - wall-clock and peak memory per arm, recorded for instrument accounting only
  falsification_conditions:
  - The random-exponent null produces a cell count within the signal arm's grid-refinement uncertainty,
    showing the projection is not discriminative.
  - Some label region is non-monotone along an axis while every term is verified monomial, which refutes
    the structural claim (B) outright.
  - Constant mutations change topology at a rate statistically indistinguishable from exponent mutations,
    which refutes the diagnostic claim (C).
  - The extractor fails to reproduce the hand-derived toy partition, which voids every downstream
    arm.
  - Cell count or boundary normals move under grid refinement, showing the partition is a sampling
    artifact.
  - More than a stated fraction of grid points are ties under interval arithmetic, in which case the
    argmax projection is not well defined on this grid and the object does not exist as described.
  confounders:
  - 'Grid range selection: a range chosen to sit inside one cell will report one cell for every arm,
    including the null. Ranges must be frozen before the run and reported.'
  - Log-space rounding, which can manufacture or erase a thin cell; mitigated by interval arithmetic
    and by reporting ties.
  - 'Flattening choices when a bound is presented as nested lemmas: two different flattenings can
    give different term counts and hence different partitions. The flattening is a recorded derivation,
    not an implementation detail.'
  - 'The opaque OW-CPA symbol: its swept placeholder range directly sets whether the OW-CPA term ever
    dominates, so any statement about that term is a statement about the placeholder.'
  - Two independent transcriptions that agree may agree because both readers made the same reading
    error on a damaged extraction, which is transcription agreement rather than correctness.
  interpretation_limits:
  - A dominance partition is a property of a written inequality. It is not a property of FrodoKEM,
    of plain LWE, or of any adversary.
  - A cell in which a delta-dependent term dominates is not evidence about decryption-failure exploitability
    and must never be reported as such.
  - Agreement between two transcriptions bounds transcription error, not analysis error; a bound that
    is mis-stated in the source is faithfully reproduced by this pipeline.
  - Cell counts are comparable only within one frozen grid; a cell count is not a scheme-independent
    quantity.
  target_complexity:
    time_exponent: No attack exponent is claimed. The pipeline itself costs O(G times T) elementary
      comparisons for G grid points and T terms, which is minutes at any grid this proposal would
      use.
    memory_exponent: No attack memory exponent is claimed. The pipeline stores one label per grid
      point, O(G) machine words, well under a gigabyte at the frozen resolution.
    best_known: The incumbent is the published FrodoKEM bit-security figure obtained by evaluating
      the published bound at the published inputs, as named in RQ-FRODO-a2dbe2 targets. This proposal
      does not attempt to beat it, replace it, or contradict it; it produces a different kind of object
      about the same inequality.
    hidden_overhead: 'The human cost dominates and is not small: two independent transcriptions of
      a security argument from a possibly extraction-damaged PDF, plus a recorded flattening derivation,
      plus a frozen grid specification. That is the expensive part, and it is the part that cannot
      be automated. Lower-order compute terms are negligible.'
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo over ledger/ returns goals, hypotheses, proposals, questions and one decision, and
    NO evidence record, so this program holds zero measured time/memory/data rows for FrodoKEM and
    there is no frontier row this could be dominated by. The nearest internal artifacts are the arithmetic-audit
    lane of GOAL-FRODO-001 and the reduction-ledger lane of GOAL-FRODO-002, neither of which sits
    on a cost frontier.'
  sota_delta: no attack; conceptual and measurement contribution only. Quantitatively the deliverable
    is a cell count, a set of integer boundary-normal vectors, and two mutation-response rates; none
    of these is comparable to any attack cost, and no bit-security figure moves as a result of this
    proposal.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part (A), that the argmax label field is well defined and computable:
    0.9, because it is definitional once the bound is a sum, with the only real risk being pervasive
    ties. Part (B), that every label region is monotone and boundaries are hyperplanes: 0.75 conditional
    on every term being monomial, but only about 0.45 unconditionally, because a QROM-shaped bound
    very plausibly contains a square root of a sum and then the prediction is simply false where it
    matters most; I regard the location of that dissolution as the most likely actual deliverable.
    Part (C), that exponent mutations move topology and constant mutations do not, at the separation
    stated in the predictions: 0.5, because the separation depends on how close the constants are
    to a tie, which nobody knows before the transcription exists. Probability that the null arm is
    discriminative, meaning random bounds look visibly different: 0.6, and this is the single cheapest
    thing to check and the one I would run first.'
