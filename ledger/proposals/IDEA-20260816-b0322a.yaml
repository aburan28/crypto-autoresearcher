idea:
  id: IDEA-20260816-b0322a
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: Run HQC's deployed concatenated Reed-Muller/Reed-Solomon decoder twice in one invocation
    - once over the quasi-cyclic ring and once over a matched non-circulant random-linear surrogate
    of identical length, rate, weight profile and sampler - and ask whether the block-failure-count
    distribution moves at all, separating quasi-cyclicity as exploitable object from quasi-cyclicity
    as keysize optimisation
  class: control
  claim: '(A) THE TWO HYPOTHESES. ''Quasi-cyclic structure'' admits two operationally distinguishable
    readings that GOAL-HQC-001 has never separated. Q1 (COMPRESSION-ONLY): the circulant form of the
    public h is a storage device - it compresses a public key from n^2 bits to n bits - and contributes
    nothing to the law of the error e'''' = x*r_2 + r_1*y + e that the concatenated decoder actually
    sees, so every failure statistic the campaign has measured would be reproduced by a non-circulant
    code of the same shape. Q2 (STRUCTURE-BEARING): the circulant form imposes measurable structure
    on e'''' beyond its coordinate marginal, so the failure statistics carry a circulant fingerprint.
    (B) THE MEASUREMENT. Hold every other degree of freedom fixed and vary only the ring. Signal arm:
    multiplication in R = F_2[X]/(X^n - 1), i.e. products by a circulant matrix. Null arm: replace
    that circulant by a uniformly random binary n-by-n matrix of the same row weight, drawn once per
    trial with the same seed ladder, everything downstream byte-identical - same fixed-weight samplers,
    same truncation to N = n_e*n_2, same inner ML decoder, same deterministic tie rule, same outer
    bounded-distance stage, same estimator, same trial count. The comparand is the whole distribution
    of S = sum_j F_j, not its mean. (C) WHY THE COMPARISON IS CLEAN. Both arms retain fixed-weight
    sampling, so the negative joint-moment deficit already measured under EV-HQC-b71230 is present
    in both and cannot masquerade as a circulant effect. The only difference between the arms is the
    algebra of the multiplication. (D) WHAT IS NOT CLAIMED. Nothing here claims a key recovery, a
    decryption-failure attack, a speedup or any security consequence, at any parameter set. A measured
    difference between the arms is a statement about the law of e'''' at the tested reduced parameters
    ONLY; it is not evidence that the difference is algorithmically exploitable, and no exploitation
    route is proposed. Symmetrically, agreement between the arms is NOT evidence that quasi-cyclicity
    is safe - it is a bound on how large a distributional effect the tested statistics could have
    detected, and the obstruction that would be recorded is exactly that bound with its error bars.
    Nothing here asserts what the literature contains, and no direction is declared impossible.'
  mechanism: 'STAGE 1, symbolic and free: establish the exact equivariance that makes the null arm
    matched rather than merely similar. Uniform-fixed-weight laws are invariant under the cyclic shift;
    the ring product commutes with the shift; therefore in the signal arm the law of e'''' is exactly
    shift-invariant. In the null arm it is exactly exchangeable in coordinates instead. Both are stationary,
    so per-block marginal failure rates must agree in both arms by symmetry alone - which turns the
    per-block marginal into a fail-closed validity gate rather than a result. STAGE 2: build both
    arms behind one interface so they consume the same seed stream and the same error vectors wherever
    the algebra permits, and record a bit-identity check on the shared prefix. STAGE 3: measure the
    full histogram of S at matched trial counts and compare with (i) a two-sample chi-square/Anderson-Darling
    test on the histogram, (ii) the pairwise joint moment mubar_2 already defined by H-HQC-18d1b4,
    computed identically in both arms, (iii) the block-separation profile of pairwise joint failures,
    which exists in the circulant arm by stationarity and must be flat in the random arm. STAGE 4:
    a positive control - inject a known circulant artefact (a planted low-autocorrelation support)
    into the signal arm and confirm the instrument fires on it, so an agreement result is a measured
    detection bound and not an untested instrument. Refutation: if the arms agree within the instrument''s
    demonstrated sensitivity, Q2 is bounded at that sensitivity and the bound is the deliverable.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from /home/user/crypto-autoresearcher: `grep -ril "hqc" --include=*.yaml --include=*.md
      .` (33 proposal files match), then extracted question_id and title for every one of those 33
      with a python3/yaml one-liner; `grep -ril "quasi-cyclic" ledger/proposals/` (8 files), `grep
      -ril "cyclic shift" ledger/proposals/` (7), `grep -ril "Reed-Solomon" ledger/proposals/` (2),
      `grep -ril "outer decoder" ledger/proposals/` (0), `grep -ril "syndrome weight" ledger/proposals/`
      (0), `grep -ril "local exponent" ledger/proposals/` (0), `grep -ril "failure boosting" ledger/proposals/`
      (7), `grep -ril "mutual information" ledger/proposals/` (15), `grep -ril "rejection sampling"
      ledger/proposals/` (19), `grep -ril "weight distribution" ledger/proposals/` (10), `grep -ril
      "SampleFixedWeight" ledger/proposals/` (3), `grep -ril "hypergeometric" ledger/proposals/` (8),
      `grep -ril "autocorrelation" ledger/proposals/` (8), `grep -ril "circulant" ledger/proposals/`
      (14), `grep -ril "Toeplitz" ledger/proposals/` (4), `grep -ril "maximum likelihood decoder"
      ledger/proposals/` (0), `grep -ril "margin distribution" ledger/proposals/` (0), `grep -ril
      "tie-break" ledger/proposals/` (8), `grep -ril "soft information" ledger/proposals/` (1), `grep
      -ril "differential testing" ledger/proposals/` (2). Read in full: ledger/questions/RQ-HQC-001.yaml,
      ledger/goals/GOAL-HQC-001.yaml (first 120 lines incl. batch_checkpoints and campaign_budget),
      the statement head of ledger/hypotheses/H-HQC-18d1b4.yaml, the id/title/objective/status blocks
      of experiments/EXP-HQC-982268, EXP-HQC-bd30c0 and EXP-HQC-50ebe9 specification.yaml, the observations
      blocks of EV-HQC-b71230, EV-HQC-469c08 and EV-HQC-927899, knowledge/open-problems/KN-OPEN-3f7a21.md,
      and docs/inventor-protocol.md sections 1-8. Listed the HQC literature entries by title: KN-LIT-b9e1a8
      (Hamming Quasi-Cyclic spec), KN-LIT-1c9474 (HQC-RMRS), KN-LIT-2141, KN-LIT-4c1133, KN-LIT-5677ae,
      KN-LIT-7565, KN-LIT-de5373.'
    results: 'Eight proposals mention ''quasi-cyclic'': IDEA-20260813-fe3c5e (quantum-walk BJMM/MMT
      at HQC''s weight regime), IDEA-20260813-a46301 (Quantum-DOOM, cyclic-shift-orbit folding), IDEA-20260813-c34e09
      (orbit-quotient continuous-time walk), IDEA-20260813-5a2aaa (CRT-residue hidden-shift screen),
      IDEA-20260805-db5afa (evaluation character of F_2[X]/(X^n-1) and the w(e'') parity identity),
      IDEA-20260805-baa4da and IDEA-20260808-a3bcf0 (memory-charged ISD baselines), IDEA-20260808-632866
      (SDitH d-split reduction). ALL of them treat quasi-cyclicity on the SOLVER side - as an ISD
      or quantum-walk symmetry to quotient by. NONE runs the decoder against a non-circulant surrogate.
      The campaign''s own measured object (EV-HQC-b71230: log2 A-hat_k negative at every order k =
      2..18, -42.7 SD at k = m = 17, with a matched NULL-P arm that fired 0 of 17 cells) was produced
      entirely inside the circulant arm; the null used there is an independence null, not a non-circulant
      null. EXP-HQC-982268''s four parameter sets all vary (n_e, m, p*, duplication) inside the ring
      and never leave it. `grep -ril "outer decoder"` and `grep -ril "syndrome weight"` return zero
      files.'
    verdict: 'UNVERIFIED. This environment cannot reach external literature, so nothing here is or
      may be a claim about what is published. What is claimed NEW relative to this repository''s committed
      state: the arm structure - one invocation, two rings, one estimator - and the use of a non-circulant
      surrogate as the null object for a DFR measurement. What is ASSEMBLED FROM KNOWN PARTS: the
      estimator mubar_k and its frozen prediction come verbatim from H-HQC-18d1b4; the sampler, truncation
      and inner decoder come from the same source; the discipline of a matched null in the same invocation
      is docs/inventor-protocol.md section 3, not an invention here; and the observation that the
      ring product commutes with the shift is elementary.'
  object_first_candidate:
    tracked_object: The block-failure indicator vector F = (F_1,...,F_{n_e}) in {0,1}^{n_e}, where
      F_j = 1 exactly when inner block j decodes to a non-zero Reed-Muller codeword - followed from
      the sampling of (x, y, r_1, r_2, e), through the ring product, through the truncation to N =
      n_e*n_2 coordinates, into the outer stage. The ring itself is the independent variable; F is
      what is tracked through it.
    lossiness: 'GENUINELY LOSSY, and the loss is large and named. The map e-tilde (N bits) -> F (n_e
      bits) discards which coordinates inside each block were flipped, which wrong codeword each failing
      block decoded to, and everything about (x, y, r_1, r_2, e) beyond the per-block verdict. At
      the sets contemplated here that is a reduction from roughly 2^12 bits to roughly 2^5 bits. Why
      the retained part still propagates DETERMINISTICALLY: the outer stage is bounded-distance, so
      its output depends on the inner stage only through which symbols are wrong - F is a sufficient
      statistic for the decryption-failure event given the outer decoder''s radius. Discarding the
      within-block detail is therefore compatible with the target operation, which is exactly the
      section-2 requirement.'
    propagation: 'One step of the target operation is one inner-block maximum-likelihood decode. It
      acts on the tracked object by writing a single coordinate: F_j := 1{the arg-max codeword for
      block j is non-zero}, resolved by the deployed deterministic tie rule at exact ties. The next
      step - the outer bounded-distance decode - acts on F by the threshold map F -> 1{sum_j F_j >
      delta}. Under the signal arm''s shift-invariance the joint law of (F_j, F_j'') depends only
      on j'' - j; under the null arm it is exchangeable. That difference in the propagation law, not
      the mean, is what the experiment reads.'
    survival_score: Two steps, concretely. F is fully informative entering the outer decode and collapses
      to one bit leaving it, so the structure survives depth 2 and no further. Within the tracked
      depth, the circulant fingerprint - if any - must survive the truncation to N coordinates, which
      is NOT shift-equivariant and is the step most likely to destroy it; the experiment therefore
      reads a graded truncation ladder N/n in {0.25, 0.5, 0.75, 0.98} and reports the value of N/n
      at which any arm difference falls below the instrument's demonstrated sensitivity. That number
      is the survival score and is a deliverable whether it is large or zero.
  null_object_control: 'The null object is the non-circulant surrogate: the same n, the same n_e and
    n_2, the same fixed-weight samplers at the same weights, the same truncation, the same decoder
    and tie rule, but products taken against a uniformly random binary matrix of matched row weight
    rather than a circulant. It runs in the SAME process invocation, off the same seed ladder, through
    the same estimator code path. FOR THE SIGNAL ARM TO MEAN ANYTHING THE NULL MUST SHOW: (i) the
    per-block marginal failure rate agrees between arms to within its own Monte-Carlo error - if it
    does not, the arms are not matched and no comparison is reportable; (ii) the block-separation
    profile of pairwise joint failures is FLAT in the null arm, since a random matrix has no separation
    to be a function of - a non-flat null profile means the estimator is manufacturing structure and
    the run is void; (iii) the planted-artefact positive control fires in the signal arm at the pre-declared
    magnitude, so that an agreement result carries a measured sensitivity rather than an assumed one.'
  discriminated_from:
  - IDEA-20260813-a46301 and IDEA-20260813-c34e09 treat the cyclic shift as a symmetry of the ISD
    SEARCH GRAPH to quotient by, i.e. quasi-cyclicity as a solver-side saving. This proposal never
    runs a solver; it varies the ring underneath the DECODER and reads the failure law. The two would
    not share a line of code.
  - IDEA-20260805-db5afa derives a zero-compute parity identity w(e') = w_e mod 2 from the evaluation
    character, i.e. one exact scalar consequence of the ring. This proposal makes no algebraic identity
    claim and instead measures the full histogram of S under an ablation of the ring; the parity identity
    would hold in the signal arm and fail in the null arm, which makes db5afa a useful cross-check
    on the ablation, not a duplicate of it.
  - EXP-HQC-982268 and H-HQC-18d1b4 vary (n_e, m, p*, duplication) INSIDE the quasi-cyclic ring and
    test the independence family mubar_k = q^k against an independence null. The ring is a fixed constant
    there and the independent variable here.
  - IDEA-20260805-baa4da and IDEA-20260808-a3bcf0 charge memory to ISD cost at fixed parameters; no
    decoding trial is run in either, and no failure distribution is measured.
  - A plain 'random code baseline' as normally understood compares CODE PERFORMANCE. Here both arms
    use the identical decoder and the comparand is the joint law of failures, so a rate or minimum-distance
    difference between the arms would be a confound to be removed by matching, not the result.
  assumptions:
  - n is prime with 2 primitive modulo n at every tested set; this is checked at run time by computing
    ord_n(2) and the run aborts if it is not n-1, so it is a gate rather than a belief.
  - The deployed inner decoder and its deterministic tie rule can be reimplemented faithfully from
    the transcription already committed under GOAL-HQC-001 BATCH-001; any divergence is an instrument
    defect and is hunted by the differential-testing arm proposed separately in this batch.
  - A uniformly random binary matrix of matched row weight is an acceptable non-circulant surrogate.
    This is an assumption about MATCHING, not about the literature; the per-block-marginal gate is
    what would detect its failure.
  - Monte-Carlo error at the declared trial counts is small relative to the pre-declared minimum effect;
    this is checked by the width of the reported confidence intervals and not asserted.
  - Results at reduced parameters are not transferred to deployed parameters by this proposal at all;
    any transfer would require its own numbered heuristic and none is offered.
  predictions:
  - metric: two-sample Anderson-Darling statistic on the histogram of S, signal arm versus non-circulant
      null arm, at N/n = 0.98
    direction: different
    minimum_effect: 'no pre-commitment to a magnitude, with reason: this program has never measured
      a circulant-versus-non-circulant DFR difference at any scale, so any number pre-committed here
      would be invented. What IS pre-committed is the decision rule: the arm difference is reported
      as detected only if it exceeds the planted-artefact positive control''s calibrated 5-sigma threshold,
      and otherwise the calibrated threshold is reported as the obstruction.'
  - metric: per-block marginal failure rate, signal arm minus null arm
    direction: different
    minimum_effect: 0.0
  - metric: slope of the block-separation profile of pairwise joint failures in the NULL arm
    direction: different
    minimum_effect: 0.0
  - metric: log2 mubar_2 / q^2 in the null arm relative to the signal arm's committed value of log2
      A-hat_2 = -6.031e-03 from EV-HQC-b71230
    direction: different
    minimum_effect: no pre-commitment; the point of the arm is that fixed-weight sampling is present
      in BOTH, so the prediction is that most of the committed deficit survives the ablation, and
      the fraction that survives is the measured quantity.
  minimal_test:
    design: The cheapest discriminating measurement is a single-parameter-set, two-arm run with no
      ladder. Fix n = 227 (prime, ord_n(2) checked at run time), inner Reed-Muller RM(1,5) of length
      32 with duplication 1, n_e = 7 blocks, N = 224, outer radius delta = 2, weights chosen so the
      measured per-block failure rate lands in [1e-3, 1e-2] where 10^6 trials give three significant
      figures. Run both arms off one seed ladder in one process, emit one histogram of S per arm plus
      the pairwise joint-failure matrix per arm, and compute the three gates and the two-sample statistic.
      Total cost is minutes of single-core CPU and no storage beyond a few megabytes. This discriminates
      because Q1 predicts the two histograms are one sample and Q2 predicts they are not, and because
      the null arm's block-separation profile is forced flat under Q1 and Q2 alike - so a non-flat
      null profile invalidates the instrument before any conclusion is drawn.
    controls:
    - Non-circulant surrogate arm, same invocation, same seed ladder, same estimator code path.
    - Per-block marginal equality gate between arms; failure aborts the comparison as unmatched.
    - Flat-block-separation-profile gate on the null arm; a non-flat profile voids the run.
    - Planted low-autocorrelation support as a positive control in the signal arm, with a pre-declared
      magnitude, so an agreement result carries a measured sensitivity.
    - Bit-identity check on the shared random prefix consumed by both arms, reported as pass/fail
      counts.
    required_metrics:
    - full histogram of S per arm at matched trial counts
    - per-block marginal failure rate vector, per arm
    - pairwise joint failure matrix P[F_j = F_j' = 1], per arm
    - block-separation profile derived from that matrix, per arm, with its flatness statistic
    - mubar_2 and log2 A-hat_2 per arm, computed by the estimator already committed under H-HQC-18d1b4
    - two-sample Anderson-Darling and chi-square statistics on the S histograms
    - positive-control detection magnitude and the derived 5-sigma sensitivity threshold
  falsification_conditions:
  - 'The two arms'' S histograms are one sample at the calibrated sensitivity across the whole truncation
    ladder: Q2 is bounded at that sensitivity and the bound is recorded as the obstruction.'
  - 'The per-block marginal gate fails: the arms are not matched, nothing is reportable, and the matching
    construction is the defect.'
  - 'The null arm shows a non-flat block-separation profile: the estimator manufactures structure
    and the instrument is void.'
  - 'The planted positive control does not fire: the instrument has no demonstrated sensitivity and
    no agreement result may be reported.'
  - 'The measured arm difference is fully explained by a rate or minimum-distance mismatch between
    the two codes rather than by the ring, as shown by re-matching on rate: the effect is a matching
    artefact.'
  confounders:
  - Rate and minimum-distance mismatch between the circulant code and the random surrogate, which
    would produce an arm difference having nothing to do with circulant structure.
  - Row-weight mismatch in the surrogate matrix changing the effective channel crossover probability.
  - Shared-seed coupling making the two arms correlated in a way that shrinks the apparent variance
    of their difference.
  - Truncation to N interacting with block boundaries differently in the two arms.
  - Monte-Carlo undersampling in the far tail of S, where the interesting behaviour lives and the
    counts are smallest.
  interpretation_limits:
  - A measured arm difference is a statement about the law of e-tilde at the tested reduced parameters
    and is not evidence of exploitability; no exploitation route is proposed or implied.
  - Agreement between the arms is a detection bound at a measured sensitivity, not a statement that
    quasi-cyclicity is harmless.
  - Nothing here transfers to HQC's deployed parameter sets; no numbered transfer heuristic is offered
    and none should be inferred.
  - The random surrogate is one choice of non-circulant object; a different surrogate could give a
    different bound, and the bound is scoped to the surrogate actually run.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement itself costs O(T * n_e * 2^m * m)
      bit operations for T trials with inner Reed-Muller length 2^m, which is linear in T and trivially
      parallel.
    memory_exponent: No attack memory exponent is claimed. The measurement holds O(n_e^2) joint-failure
      counters and O(n_e) histogram bins, i.e. kilobytes, plus one length-n vector per trial.
    best_known: The incumbent this must be compared against is the campaign's own committed independence-null
      measurement, EV-HQC-b71230 with EXP-HQC-982268, which established the sign and magnitude of
      the joint-moment deficit inside the circulant arm and fired 0 of 17 cells on its matched NULL-P
      arm. There is no incumbent non-circulant comparison in this repository.
    hidden_overhead: 'The construction of a genuinely matched non-circulant surrogate is the whole
      difficulty and it is human cost, not CPU cost: matching length, rate, row weight, effective
      crossover probability and truncation geometry simultaneously is fiddly, and the per-block-marginal
      gate exists precisely because the matching is the part most likely to be wrong. A second hidden
      cost is that the interesting behaviour is in the far tail of S, so the trial count needed for
      the tail is orders of magnitude above the trial count needed for the mean.'
  dominated_by: 'n/a (no result claimed). Stated honestly: there is no attack cost triple here to
    place on any Pareto frontier, so there is no frontier row to check and a bare ''null'' would be
    a fabrication. On the measurement axis the closest incumbent in this repository is EV-HQC-b71230,
    which dominates this proposal on trial count (1e7 versus the 1e6 proposed here) and on independent-arithmetic
    certification, and does not dominate it on the axis this proposal adds, because it never varied
    the ring.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: EV-HQC-b71230
    reports log2 A-hat_2 = -6.031e-03 and log2 A-hat_18 = -9.813e-01 inside the circulant arm with
    no non-circulant comparand; this proposal produces the same two numbers in a non-circulant arm,
    so the delta it adds is a two-arm ratio that currently has no value at all in the repository,
    not an improvement to an existing number.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Split by part. (i) That the two arms can be matched well enough for the
    per-block-marginal gate to pass: ~0.7 - matching is the hard part and it is a construction problem
    with a clear pass/fail test. (ii) That the instrument has demonstrable sensitivity via the planted
    positive control: ~0.85 - planting a low-autocorrelation support is straightforward and the control
    fires or it does not. (iii) That a circulant-versus-non-circulant DIFFERENCE is detected at 1e6
    trials: ~0.25 - the fixed-weight constraint plausibly dominates the joint-moment behaviour and
    is present in both arms, so the residual ring effect may well be below the sensitivity floor.
    (iv) That the run yields a usable recorded obstruction whichever way (iii) goes: ~0.9 - a calibrated
    detection bound on Q2 is a deliverable and this program has none. The value of the proposal rests
    on (iv), not on (iii).'
