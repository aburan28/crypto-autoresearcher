    verdict: >-
      UNVERIFIED, and internally an ADAPTATION. The CHM theorem is cited, not
      claimed. Deuring/Waterhouse/Kohel, the class number formula for a
      non-maximal order, Pohlig-Hellman, and the reduced-form bound are all
