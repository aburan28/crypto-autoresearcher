idea:
  id: IDEA-20260811-85cfe9
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  title: >-
    T5's EXPENSIVE SIDE IS NOT BLANKET, AND THE THING THAT WEAKENS IT IS VOLCANO
    DEPTH. The Castryck-Houben-Merz square-divisor self-pairing (KN-LIT-7489,
    key claim 3) makes class-group vectorization cost a discrete logarithm in a
    group of order m^2 whenever m^2 divides Delta_O -- and for an ordinary
    E/F_p that hypothesis is AUTOMATIC below the crater, since
    Delta_O = f_E^2 D_0, with m* = f_E maximal exactly on the j = 0 and
    j = 1728 families where f ~ p^{1/2}. On those families the counterfactual
    prize is an exponent move on vectorization, p^{1/4} -> poly(log p). The
    route is nevertheless closed, not by the GGM filter and not by H-ENDO-001,
    but by a NORM-BUDGET INEQUALITY: the theorem consumes the norm of the
    connecting ideal as advice, and supplying that advice by search costs
    ~sqrt(|Delta_O|)/3 ~ 0.67 p^{1/2}, a factor ~p^{1/4} WORSE than the
    0.62 p^{1/4} generic meet-in-the-middle it was meant to beat
  class: mechanism

  claim: >-
    (A) WHAT THE CAMPAIGN CURRENTLY ASSERTS. DECOMPOSITION.md T5 states the
    campaign's central dichotomy in blanket form: "reaching a SPECIFIED curve
    is the vectorization problem underlying CSIDH: hard, ~sqrt(h) ~ p^{1/4}
    classically at best." Every lane in GOAL-ENDO-001 carries T5 as a mandatory
    second gate, so if that blanket statement has exceptions, fourteen lanes
    inherit them. This record shows it HAS a named exception class, prices the
    exception, and then closes it on a different obstruction than the one T5
    relies on.

    (B) THE IMPORTED INGREDIENT. KN-LIT-7489 (Castryck, Houben, Merz, "Weak
    instances of class group action based cryptography via self-pairings"), as
    transcribed in this corpus, states as its third key claim: "if m^2 | Delta_O
    for some prime power m then given two primitively O-oriented elliptic curves
    (E, iota) and (E', iota') = [a](E, iota) connected by an unknown invertible
    ideal a contained in O, we can recover a essentially at the cost of a
    discrete logarithm computation in a group of order m^2, assuming the norm of
    a is given and is smaller than m^2", and adds "We give concrete instances,
    involving ordinary elliptic curves over finite fields, where this turns into
    a polynomial time attack." THIS CORPUS ALREADY USES KN-LIT-7489, but only
    its FIRST claim, m | Delta_O, and only on the point group G
    (IDEA-20260807-30868b). The third claim -- a VECTORIZATION statement about
    CURVES -- is cited by no ledger record in this repository.

    (C) THE HYPOTHESIS IS AUTOMATIC BELOW THE CRATER, WHICH IS THE POINT.
    For ordinary E/F_p with Frobenius pi, write D := disc(Z[pi]) = t^2 - 4p =
    f^2 D_0 with D_0 fundamental, and Delta_O := disc(End_{F_p} E) = f_E^2 D_0
    with f_E | f (Deuring/Waterhouse/Kohel). Then f_E^2 divides Delta_O
    IDENTICALLY. So CHM's square-divisor hypothesis is not an exotic side
    condition in the ordinary setting: it is satisfied, with m any prime power
    dividing f_E, by EVERY curve strictly below the crater of some ell-volcano.
    Define m*(E) := the largest prime power m with m^2 | Delta_O. Then
    m*(E) grows monotonically with volcano depth, is computable from
    (t, p) plus one factorization, and is exactly 1 on the crater when D_0 is a
    prime discriminant.

    (D) WHERE m* IS LARGEST: THE L3 FAMILY. Because |D| = f^2 |D_0| and
    |D| = 4p - t^2 <= 4p, the conductor f is largest exactly when |D_0| is
    smallest. For the j = 0 family (D_0 = -3) one has 4p = t^2 + 3f^2, so
    f <= (4p/3)^{1/2} ~ 1.155 p^{1/2}; for j = 1728 (D_0 = -4), f ~ p^{1/2}
    likewise. So THE SMALL-|D_0| CLASSES THAT LANE L3 (RQ-JINV-8fc13a) SINGLES
    OUT ARE PRECISELY THE CLASSES WITH THE LARGEST SQUARE DIVISOR OF Delta_O.
    L3's obstruction-to-beat is KN-TECH-018, the automorphism discount of at
    most sqrt(6), "a constant, never an exponent". This record supplies the
    first candidate mechanism in that lane that WOULD have been an exponent.

    (E) THE COUNTERFACTUAL PRIZE, COMPUTED. Take a bottom-level j = 0 curve
    whose Frobenius conductor f is a prime power ell^e with ell small (density
    of p for which f is prime is ~2/log p, so the family is not empty and is
    nameable). Then:
      - m* = f ~ 1.155 p^{1/2}, so m*^2 ~ 1.33 p;
      - CHM cost = a DL in a group of order m*^2 = ell^{2e}, which is an
        ell-group, so Pohlig-Hellman reduces it to 2e discrete logarithms in
        groups of order ell: O(e (sqrt(ell) + log ell)) group operations. With
        ell = O(1) and e ~ (1/2) log_ell p that is O(log p) -- POLYNOMIAL;
      - the incumbent: h(O) = f h(D_0) / [O_K^*:O^*] times
        prod_{ell | f} (1 - (D_0/ell)/ell), so for D_0 = -3, h ~ f/3 ~
        0.385 p^{1/2} and generic meet-in-the-middle vectorization costs
        ~sqrt(h) ~ 0.62 p^{1/4}.
    So the counterfactual is an EXPONENT MOVE ON VECTORIZATION,
    p^{1/4} -> poly(log p), on a nameable subfamily. That is why this is worth
    a record rather than a shrug.

    (F) THE OBSTRUCTION, AS AN INEQUALITY RATHER THAN A COST GUESS. The theorem
    consumes "the norm of a is given". In T5's use case the connecting ideal a
    is exactly what is unknown, and its norm is not advice. Supplying it by
    search costs the following, and this is the whole closure:
      - the number of integral ideals of O of norm at most X is
        ~ (2 pi h / (w sqrt|Delta_O|)) X, distributed over h classes, so a FIXED
        class contains ~ (2 pi / (w sqrt|Delta_O|)) X ideals of norm at most X;
      - requiring at least one forces X >= w sqrt|Delta_O| / (2 pi), i.e.
        X ~ sqrt|Delta_O| / 3 for w = 2, which for |Delta_O| ~ 4p is
        X ~ 0.67 p^{1/2}. The equivalent elementary statement is the reduced
        binary quadratic form bound a <= sqrt(|Delta|/3);
      - therefore norm-guessing costs ~0.67 p^{1/2} attempts, each attempt
        additionally paying one CHM recovery and one verification, against
        0.62 p^{1/4} for generic MITM vectorization. The norm-advice route is
        WORSE BY A FACTOR ~ p^{1/4}.
    Note which hypothesis is binding and which is not: the theorem also requires
    N(a) < m^2, and on the j = 0 family m^2 ~ 1.33 p exceeds the norm-search
    bound 0.67 p^{1/2} comfortably, so THE SIZE CONDITION IS NOT BINDING AND THE
    ADVICE CONDITION IS. The closure therefore rests on exactly one thing, which
    is the strongest form a closure can take.

    (G) WHERE NORM ADVICE IS ACTUALLY FREE, AND WHY IT DOES NOT HELP. Norm
    advice is free in precisely one situation: when the target curve was reached
    by a walk the attacker performed, in which case N(a) is the product of the
    step degrees. But then a itself is already known and there is nothing to
    recover. This is the same degeneracy T5's CHEAP side already describes
    (a uniformly random curve is reachable in O(log p) steps and its address is
    known by construction), so the CHM mechanism lands entirely inside the half
    of T5 that was never expensive.

    (H) WHAT THIS CHANGES IN THE CAMPAIGN'S OWN RECORDS, STATED AS CORRECTIONS
    TO BE MADE BY THE COORDINATOR AND NOT BY THIS RECORD.
      (H1) T5 should read "min over available mechanisms", not "sqrt(h)". The
           gate's safety on the small-|D_0| families does NOT rest on Delta_O
           being squarefree -- it provably is not -- but on norm-advice
           unavailability.
      (H2) DECOMPOSITION.md section 5 prediction 2 says "L2 is expected to show
           no effect stratified by volcano level". This record exhibits a
           quantity, m*(E), that IS level-dependent, monotone in depth, and
           computable. The prediction survives in its cost form and fails in its
           literal form, and the difference is worth recording.
      (H3) L3 (RQ-JINV-8fc13a) now has a named mechanism by which small |D_0|
           would have mattered beyond sqrt(|Aut|), tested and closed, rather
           than an absence of ideas.

    (I) THE RESIDUAL OPEN CLASS, NAMED. (I1) Any future result that removes or
    weakens the norm-advice hypothesis from CHM collapses T5's expensive side on
    the deep-volcano subfamily immediately; this is a concrete
    literature-watch item, not a speculation. (I2) Any publicly computable
    quantity that constrains N(a) to a set of size below ~p^{1/4} -- for
    instance a pairing-derived congruence on N(a) mod something -- restores the
    prize. (I3) The record closes the CHM mechanism only; it says nothing about
    other routes to vectorization.

  resource_label: >-
    R3 (End(E) as a ring: the discriminant Delta_O, its square divisors, the
    conductor f_E) composed with R4 (the class-group action on the isogeny
    class) and R7 (the self-pairing that carries the CHM recovery). None of the
    three is a group-operation output on G.
  admissibility: admissible
  admissibility_argument: >-
    Admissible and then closed, which is the strongest form of negative this
    campaign can produce. The resource is the square-divisor structure of
    disc(End_{F_p} E) together with a self-pairing on m-torsion for m | f_E.
    A generic group oracle for G cannot express "the largest prime power whose
    square divides the discriminant of the endomorphism ring", so KN-FIND-b7e091
    does not reach it. No endomorphism is ever applied to a point of G, so
    H-ENDO-001's scalar-action filter does not bite either. The mechanism is
    admitted on its face and is then defeated by an arithmetic inequality that
    is independent of both.

  discriminated_from:
    - >-
      IDEA-20260807-30868b, which cites the SAME source KN-LIT-7489 but its
      FIRST claim only (m | Delta_O), applied to the point group G, concluding
      N | Delta_O hence t = 2 hence embedding degree 1. That record's object is
      the self-pairing order on G; this record's object is the square-divisor
      budget m*(E) of Delta_O and the vectorization cost between CURVES. The two
      use disjoint claims of one paper and reach disjoint conclusions; 30868b's
      reachability_gate explicitly says T5 "does not arise" for its property
      because it is class-constant, whereas m*(E) is precisely NOT class-constant
      -- it varies with volcano level inside one class, which is why this record
      exists.
    - >-
      IDEA-20260807-bbdcf3, which prices the counterfactual ECDLP prize of a
      hypothetical bridge G -> Cl(O) at N^{1/4} and closes homomorphic bridges by
      the counting obstruction OBS-5. That record's counterfactual is about
      moving information from POINTS into the class group; this record makes no
      bridge claim at all and concerns the cost of moving between CURVES once one
      is already inside the class group. Its reachability_gate correctly charges
      sqrt(h) for reaching a specified curve; this record is the check on whether
      that charge is uniform, and finds it is not, while leaving OBS-5 untouched.
    - >-
      IDEA-20260808-ba4e37 (GOAL-ECTD-001), which reads the same self-pairing
      machinery as a trapdoor-DDH candidate for the ordinary class-group action.
      Different goal, different problem (decisional, not vectorization), and no
      cost accounting against T5.
    - >-
      IDEA-20260807-3c6bd8, which prices Kohel-style volcano-level identification
      and correctly attributes subexponentiality to the large-ell walk
      (KN-LIT-251, KN-LIT-309). That record prices KNOWING the level; this record
      asks what knowing it BUYS, and answers with m*(E). The two compose: the
      cost of computing m*(E) is exactly the cost that record schedules, and this
      record charges it in hidden_overhead rather than assuming it free.
    - >-
      IDEA-20260808-bba3dc, the torsion-rationality budget for Kani/Clapoti/
      PEGASIS on ordinary prime-field curves. That record closes the
      higher-dimensional TOOLBOX on a torsion-field-of-definition obstruction.
      The CHM recovery here is a pairing computation on m-torsion with m | f_E,
      not a higher-dimensional isogeny, so bba3dc's obstruction does not apply
      to it and does not pre-empt this record. Where the two meet is
      VERIFICATION: this record's norm-search attempts must each be verified by
      acting with the candidate ideal, and bba3dc says that action is NOT
      polynomial over ordinary F_p, which makes the norm-search cost in (F) an
      UNDERESTIMATE and the closure stronger, not weaker.

  object_first_candidate:
    tracked_object: >-
      m*(E), the largest prime power whose square divides
      Delta_O = disc(End_{F_p} E) -- followed along a walk inside one F_p-isogeny
      class, i.e. as the walk ascends and descends the ell-volcanoes.
    lossiness: >-
      Genuinely lossy and compatibly so. The projection discards the curve, its
      j-invariant, its points, every ideal, and the entire pairing, retaining one
      integer. It is not a change of coordinates: from m* one cannot recover
      Delta_O, let alone O or E -- many discriminants share a square divisor.
      What it discards is discarded compatibly with the operation set that
      matters, because the operation set here is "move within the isogeny class",
      and under an ell-isogeny End(E) changes only by the explicit conductor
      relation f_E -> f_E ell^{+-1} or f_E, so Delta_O changes by a known factor
      and m* propagates deterministically from (m*, direction, ell) without
      needing anything that was discarded.
    propagation: >-
      One-step propagation is defined and measurable. A horizontal ell-step fixes
      f_E and fixes m*. A descending step multiplies f_E by ell, so
      v_ell(Delta_O) increases by 2 and m* is recomputed from the updated
      valuation vector; an ascending step is the inverse. The one-step rule is
      therefore an update on the valuation vector of Delta_O, which is a finite
      vector of integers, and every step is verifiable by counting rational
      ell-isogenies (the standard level test).
    survival_score: >-
      Survives the entire volcano: m* is defined at every level and the update
      rule is exact at every step. It DISSOLVES at exactly one boundary, and the
      boundary is what closes the record: m* controls the cost of a recovery that
      also needs N(a), and N(a) is not a function of m* or of any level datum.
      So the object survives the geometry completely and dies at the advice
      channel. Naming the exact place a good object stops being useful is the
      deliverable, per docs/inventor-protocol.md section 5.

  mechanism: >-
    STEP 0 (zero compute, HARD GATE, BLOCKING). Obtain the primary text of
    Castryck-Houben-Merz and verify key claim 3 verbatim: the exact hypothesis
    on the orientation, whether "primitively O-oriented" covers an ordinary
    E/F_p oriented by its own End_{F_p}, the exact meaning of "essentially at
    the cost of a discrete logarithm in a group of order m^2", and above all
    whether the norm hypothesis is as transcribed. KN-OPEN-3f7a21 records that
    this corpus's citation_verified markings are unreliable, and KN-LIT-7489 is
    a bulk-seeded abstract relay. IF THE NORM HYPOTHESIS IS ABSENT OR WEAKER
    THAN TRANSCRIBED, THIS RECORD IS VOID AND THE LANE IS LIVE, and that is the
    single most consequential outcome available here.

    STEP 1 (zero compute). Write out (C) through (F) with quantifiers explicit:
    the identity Delta_O = f_E^2 D_0; the monotonicity of m* in volcano depth;
    the j = 0 and j = 1728 conductor bound f <= (4p/|D_0|)^{1/2}; the
    Pohlig-Hellman cost of a DL in an ell-group of order ell^{2e}; the class
    number formula for h(O) in terms of f and h(D_0); the ideal-counting bound
    forcing the norm search to sqrt|Delta_O|/3.

    STEP 2 (toy compute, THE CENSUS). For a ladder of toy primes, enumerate
    ordinary isogeny classes, factor D = t^2 - 4p, and record per class
    (t, D, D_0, f, h(D_0), h(Z[pi])) and per curve (f_E, Delta_O, m*(E),
    v_ell(Delta_O) for every ell | f). Produce the joint distribution of
    (m*, sqrt(h), level) and the empirical CDF of m*.

    STEP 3 (toy compute, THE DISCRIMINATOR -- ADVICE ON VERSUS ADVICE OFF).
    On the deepest available toy volcano, run the CHM recovery TWICE on the same
    instance pair, differing in exactly one input: arm ADVICE-ON is given N(a);
    arm ADVICE-OFF is not and must search norms. Count operations in one unit.
    The measured cost ratio IS the price of the advice, and it is the number the
    closure turns on.

    STEP 4 (toy compute, THE NULL). Run the identical pipeline on a CRATER curve
    of the same class, where f_E = 1 and (for prime-discriminant D_0) m* = 1, so
    the CHM hypothesis fails outright. The pipeline must FAIL to recover a, at
    any budget. A pipeline that "succeeds" there is not using the square divisor
    and every number it produced in Step 3 is void.

    STEP 5 (zero compute). Record the residual class (I1)-(I3) and the three
    corrections (H1)-(H3) as forward guidance for the Coordinator. This record
    changes no campaign document itself.

  predictions:
    - metric: >-
        fraction of curves strictly below the crater whose Delta_O admits a
        prime-power square divisor m > 1, over the toy census of Step 2
      direction: higher
      minimum_effect: >-
        Exactly 1.000, with no exceptions, because f_E > 1 forces f_E^2 |
        Delta_O by the identity Delta_O = f_E^2 D_0. A single below-crater curve
        reported with m* = 1 means the level classification or the discriminant
        computation is wrong; halt and repair rather than interpret. BASIS -
        derivation in (C); NOT measured anywhere in this campaign.
    - metric: >-
        Spearman correlation between volcano level (depth below crater) and
        log m*(E), within a single isogeny class
      direction: higher
      minimum_effect: >-
        Monotone non-decreasing with correlation at least 0.95 on every class
        with at least three levels. BASIS - derivation in (C); the tolerance 0.95
        rather than 1.0 is a PRE-REGISTERED allowance for ties at levels where
        the added ell does not change the largest prime power, and is an
        UNTESTED expectation.
    - metric: >-
        ratio of measured operation counts, arm ADVICE-OFF divided by arm
        ADVICE-ON, in the Step 3 discriminator
      direction: higher
      minimum_effect: >-
        At least sqrt|Delta_O| / (3 m*) at the largest completed toy size, i.e.
        the norm-search factor, within a factor 4 band. A ratio near 1 falsifies
        the closure: it would mean the norm hypothesis is not load-bearing, T5's
        expensive side is genuinely weakened on the deep-volcano subfamily, and
        the result must go to an independent review-adversarial session before
        any record states it. BASIS - derivation in (F); the factor-4 band is
        PRE-REGISTERED and UNTESTED.
    - metric: >-
        measured ADVICE-ON operation count against the predicted
        O(e (sqrt(ell) + log ell)) Pohlig-Hellman cost in the ell-group of order
        ell^{2e}
      direction: different
      minimum_effect: >-
        Within a factor 8 of the prediction. A measured cost far ABOVE the
        prediction means "essentially at the cost of a discrete logarithm" hides
        a dominant term the abstract does not name, and the counterfactual prize
        in (E) must be withdrawn until Step 0 resolves what that term is.
    - metric: >-
        recovery success rate of the pipeline on the crater null of Step 4
      direction: lower
      minimum_effect: >-
        Exactly zero, at any budget. Any success is an instrument failure, not a
        result, and voids Step 3.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): primary-text verification of
      KN-LIT-7489 key claim 3, especially the norm hypothesis. STAGE 1 (zero
      compute): the five derivations of Step 1. STAGE 2 (minutes): the toy census
      of Step 2 over primes from 2^14 to 2^24, all t in the Hasse interval,
      exact factorization of t^2 - 4p. STAGE 3 (hours, THE DISCRIMINATOR): the
      advice-on versus advice-off arms on the deepest toy volcano available,
      at least five instance pairs per class, seeds recorded. STAGE 4 (HARD
      GATE): the crater null. STAGE 5 (zero compute): residual class and
      forward guidance.
      THE CHEAPEST VALID DISCRIMINATOR IS STAGE 0 PLUS STAGE 3. Stage 0 alone
      can void the record at zero compute; Stage 3 is the only measurement that
      separates "the mechanism is cheap but needs advice" from "the mechanism is
      cheap", and the two arms differ in exactly one input, which is what makes
      the comparison clean.
    controls:
      - >-
        CRATER NULL - f_E = 1 with D_0 a prime discriminant, so m* = 1 and the
        CHM hypothesis fails. Recovery must fail at any budget. BLOCKING.
      - >-
        ADVICE-ON POSITIVE CONTROL - the same instrument, given N(a), must
        recover a. An instrument that cannot produce the positive cannot certify
        the negative.
      - >-
        DECAY PARAMETER - the depth of the instance below the crater. As depth
        decreases toward the crater, m* decreases and the ADVICE-ON cost must
        RISE toward and past the generic sqrt(h). A measured ADVICE-ON cost that
        does NOT rise as depth falls is the canonical artifact tell of
        docs/inventor-protocol.md section 3 and means the pipeline is not using
        the square divisor at all.
      - >-
        GENERIC BASELINE - matched meet-in-the-middle vectorization on the same
        instance pair, counted in the same operation unit, so the comparison in
        (E) and (F) is measured and not asserted.
      - >-
        RANDOM-DISCRIMINANT NULL - repeat Step 2's census with D replaced by
        uniformly random integers of the same size, to test whether the square
        part of t^2 - 4p behaves like that of a random integer. Values of a
        quadratic polynomial are NOT random integers and their small-prime
        divisibility is biased; measuring the difference is the control, and
        assuming it away is the error.
    required_metrics:
      - per class (t, D, D_0, f, h(D_0), h(Z[pi])); per curve (f_E, Delta_O, m*)
      - Spearman correlation of level against log m* within each class
      - operation counts for arms ADVICE-ON, ADVICE-OFF, and generic MITM, one unit
      - the advice-price ratio and its comparison against sqrt|Delta_O|/(3 m*)
      - pass or fail of every named control, including the decay curve in depth
      - empirical CDF of m* over the census, beside the random-integer null

  falsification_conditions:
    - >-
      STAGE 0 finds the norm hypothesis absent from CHM key claim 3, or finds it
      satisfiable from public data. THE CLOSURE IS VOID, T5's expensive side is
      weakened on the deep-volcano subfamily, and this is escalated to an
      independent review-adversarial session before any record states it. Under
      GOAL-ENDO-001 pause condition P3 this does not by itself exceed the
      automorphism-discounted rho baseline for ECDLP -- it is a vectorization
      result, not an ECDLP result -- but it changes a campaign gate and must not
      be reported casually.
    - >-
      The ADVICE-OFF to ADVICE-ON ratio measures near 1. Same consequence as
      above, reached empirically instead of textually.
    - >-
      Any below-crater curve with m* = 1 while the level classification passes
      its own control. That contradicts Delta_O = f_E^2 D_0 and indicates an
      implementation error; halt.
    - >-
      The ADVICE-ON arm costs far more than the Pohlig-Hellman prediction. The
      counterfactual prize in (E) is withdrawn; the closure in (F) is unaffected,
      since it does not depend on the prize being large.
    - >-
      The crater null recovers a. The run set is INVALID, not negative.
    - >-
      Toy-scale factorization or volcano construction exceeding budget before any
      deep-volcano instance is measured. INFRASTRUCTURE outcome under AGENTS.md
      rule 5, recorded as such, never as evidence about the mechanism.

  confounders:
    - >-
      TWO DISCRIMINANTS. disc(Z[pi]) = t^2 - 4p and disc(End_{F_p} E) =
      f_E^2 D_0 differ by (f/f_E)^2. m* is defined on the SECOND. Every reported
      divisibility must name which discriminant it used; conflating them inflates
      m* on crater curves and would manufacture the effect.
    - >-
      SELECTION BY CONDUCTOR. Deep volcanoes are found by SEARCHING for large f,
      so every statistic computed on them is conditional on that search and must
      say so. In particular the density of "f is a prime power" quoted in (E) is
      a statement about p, not about a uniformly drawn curve.
    - >-
      TOY-SCALE m* IS TINY. At 16 to 24 bits, f is small and a "deep" volcano may
      have two or three levels, so the Pohlig-Hellman advantage is not visible
      and the ADVICE-ON arm may be dominated by fixed overhead. The advice-price
      RATIO is the metric that survives this; absolute costs at toy scale must
      not be extrapolated.
    - >-
      UNIT MIXING. The CHM cost is quoted in group operations in a group of order
      m^2; the generic baseline is quoted in class-group action evaluations; the
      norm search additionally pays one verification per attempt, and per
      IDEA-20260808-bba3dc that verification is NOT polynomial over ordinary
      F_p. A ratio quoted across mixed units would be dishonest; the unit must be
      fixed and the conversion carried.
    - >-
      j = 0 AND j = 1728 CARRY EXTRA AUTOMORPHISMS. Those change the unit index
      [O_K^*:O^*] in the class number formula (3 and 2 respectively) and change
      the self-pairing normalisation. Those instances must be reported separately,
      never pooled with generic-|D_0| classes.

  interpretation_limits:
    - >-
      THIS IS A VECTORIZATION RESULT, NOT AN ECDLP RESULT. Nothing here moves,
      or could move, the ECDLP exponent: the mechanism acts on curves and the
      discrete logarithm k is information about a point. Any summary that quotes
      "poly(log p)" without the word "vectorization" is misreporting this record.
    - >-
      The closure covers the CHM mechanism only, and only as transcribed in
      KN-LIT-7489. Other routes to vectorization are untouched.
    - >-
      Toy scale for everything empirical, and the deep-volcano instances are
      constructed rather than natural. claim_tier toy.
    - >-
      The corrections (H1)-(H3) are proposed to the Coordinator as forward
      guidance. This record changes no campaign document, no hypothesis status,
      and no completion criterion.
    - >-
      The counterfactual prize in (E) is COUNTERFACTUAL. It prices a recovery
      that (F) says is not available without advice, and it must never be quoted
      as an achieved cost.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SQUARE-PART DISTRIBUTION. As t ranges over the Hasse interval
        |t| <= 2 sqrt(p) with gcd(t, p) = 1, the square part of D = t^2 - 4p
        behaves like that of a uniformly random integer of size 4p: formally,
        Prob[m^2 divides D] = 1/m^2 + o(1) uniformly for m <= p^{1/4}, hence
        Prob[m*(bottom level) >= y] = (1 + o(1))/y in the same range.
      rigorous_support: >-
        The upper bound is RIGOROUS and is what carries the record's ceiling: the
        number of integers n <= X divisible by m^2 is at most X/m^2, so
        sum_{m > y} X/m^2 < X/y unconditionally, and no distributional assumption
        is needed for the statement "large square divisors are rare". The
        classical distribution statement imitated is the density 6/pi^2 of
        squarefree integers together with the exact density 1/m^2 of multiples of
        m^2. H1 is used ONLY to predict the shape of the census in Step 2, never
        in the closure of (F), which is an inequality about the norm search and
        holds for every instance individually.
      validation_plan: >-
        SAMPLING: for ten toy primes on a ladder from 2^14 to 2^28, enumerate
        every t in the Hasse interval (about 4 sqrt(p) values, feasible to 2^28),
        factor |t^2 - 4p| exactly, and record the square part and m*.
        COMPARISON DISTRIBUTION: the empirical Prob[m* >= y] against the
        predicted (1 + o(1))/y, and against a MATCHED NULL of 4 sqrt(p) uniformly
        random integers in [1, 4p] processed identically -- the null is
        mandatory because values of a quadratic polynomial have biased
        small-prime divisibility (for instance the local density at ell depends
        on whether p is a square mod ell) and the bias is the thing to measure.
        TAIL CHECK: the largest observed m* over the whole interval against the
        prediction max ~ 4 sqrt(p) truncated at the arithmetic ceiling
        m* <= sqrt|D| <= 2 sqrt(p), and against the KNOWN extremal instances --
        the j = 0 and j = 1728 classes, where f ~ p^{1/2} is forced by
        4p = t^2 + |D_0| f^2 and is not a tail fluctuation at all. A census whose
        extreme is NOT the small-|D_0| class has mis-identified something.
        TRANSFER ASSUMPTION, STATED: |D| ~ 2^28 is not |D| ~ 2^256, and the
        comparison at toy size validates the instrument and the local-density
        bias, not the asymptotic.
    - id: H2
      statement: >-
        ADVICE-PRICE COMPOSITION. The cost of the ADVICE-OFF arm is
        (number of candidate norms) x (one CHM recovery + one verification), with
        no interaction term, so it equals the ADVICE-ON cost multiplied by the
        norm-search factor.
      rigorous_support: >-
        Pairs the RIGOROUS ideal-counting bound of (F) -- the number of ideals of
        norm at most X in a fixed class is (2 pi / (w sqrt|Delta_O|)) X + O(X^{1/2}),
        an unconditional consequence of the class number formula -- with the
        standard per-attempt-cost times number-of-attempts bookkeeping. The
        heuristic content is only the absence of an interaction term, i.e. that a
        failed guess costs the same as a successful one.
      validation_plan: >-
        SAMPLING: measure, on at least five deep-volcano toy instances per prime,
        the ADVICE-OFF cost directly and compare against the product of the
        measured ADVICE-ON cost and the measured number of candidate norms tried.
        COMPARISON: the two must agree within a pre-registered factor 2. TAIL
        CHECK: the distribution of the number of guesses until success against
        the geometric prediction with success probability
        (2 pi / (w sqrt|Delta_O|)) per unit norm, including the slowest observed
        instance. FAILURE MODE HUNTED: a failed guess that aborts early would make
        ADVICE-OFF cheaper than the product and would UNDERSTATE the advice price,
        which is the direction that would weaken the closure -- so the check is
        run in the direction that could refute the record, not confirm it.

  proof_search_map:
    bottleneck: >-
      The norm-advice channel. Everything else is arithmetic that either holds
      identically (Delta_O = f_E^2 D_0) or is a standard cost formula. If N(a),
      or any constraint pinning it to a set of size below ~p^{1/4}, becomes
      publicly computable from (E, E', O), the record's conclusion inverts and
      T5's expensive side collapses on the deep-volcano subfamily. Attacking the
      norm channel is the highest-value red-team action against this record.
    baseline_embedding:
      parameter_slice: >-
        m* = 1, the crater with D_0 a prime discriminant. The cost accounting
        must then degenerate exactly to the incumbent: generic meet-in-the-middle
        vectorization at ~sqrt(h) action evaluations, with the CHM term absent
        rather than merely large. If the general formula does not reduce to
        sqrt(h) at m* = 1, the accounting is wrong.
      reproduction_check: >-
        Frozen fixture: three crater instances on which matched MITM
        vectorization is run and its operation count checked against c sqrt(h)
        within 25 percent, with c measured once and then frozen. This validates
        the cost model before it is used to price anything.
    observation_collision:
      observable: >-
        The integer m*(E), the largest prime power whose square divides Delta_O,
        which is the quantity carrying the "this class is weak" conclusion.
      distinct_preimage_search: >-
        REQUIRED, AND EXPECTED TO SUCCEED, WHICH IS THE CONTENT. Two curves with
        the SAME m* but different (f_E, D_0, j, level, h) are abundant: m* is a
        single integer and Delta_O is not recoverable from it. Their existence
        establishes that m* alone does NOT determine the recovery cost -- the
        cost also depends on the prime ell underlying m* = ell^e through the
        Pohlig-Hellman term sqrt(ell), so a large m* with ell large is NOT cheap.
        Reporting "large m* implies weak" without having run this search is
        prohibited, and the corrected statement is "large m* with SMOOTH
        underlying prime implies cheap ADVICE-ON recovery".
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Specialise the isogeny class to its deepest level, where Delta_O has
          its largest square divisor, measure the recovery cost there, and pack it
          against the norm-search cost. This is the transform that produces both
          the counterfactual prize and the closing inequality, and running it
          explicitly is what makes each a number instead of an intuition.
        predicted_gain: >-
          Counterfactual: vectorization p^{1/4} -> poly(log p) on the smooth-
          prime-power-conductor subfamily. Predicted actual gain: zero, because
          the norm search costs ~p^{1/2}. The transform's value is that it prices
          both sides of the same inequality in one unit.
      - transform: boundary_lift
        proposed_object: >-
          Instances where the norm IS known -- constructed by walking from E to
          E' along a recorded path -- which is the boundary where the record's
          hypothesis lapses.
        predicted_gain: >-
          Either the ADVICE-ON arm is confirmed cheap there, which validates the
          instrument and confirms that the whole difficulty is the advice, or it
          is not, in which case "essentially at the cost of a DL in a group of
          order m^2" hides a dominant term and the counterfactual is withdrawn.
          Both outcomes are decisive and the second is the more useful.
    quantifier_order: >-
      WHAT THE CAMPAIGN'S T5 CURRENTLY ASSERTS, and which this record contradicts
      in its literal form: FORALL p, FORALL ordinary classes, FORALL pairs of
      curves in the class, reaching a specified one costs ~sqrt(h).
      WHAT THIS RECORD ASSERTS INSTEAD, and it is an inequality rather than a
      theorem about algorithms: FORALL p, FORALL ordinary E/F_p, FORALL primitive
      orientations by O = End_{F_p}(E), IF f_E > 1 THEN m*(E) > 1 and the CHM
      hypothesis holds; and FORALL such instances, ANY procedure that supplies
      N(a) by search over integral ideals of the connecting class must try at
      least w sqrt|Delta_O| / (2 pi) candidate norms in the worst case, because
      the class contains no ideal of smaller norm.
      NOT CLAIMED: that no procedure computes N(a) by other means (that is
      residual (I2)); that CHM is the only cheap vectorization mechanism; that
      anything here bears on ECDLP.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For ordinary E/F_p below the crater, the CHM square-divisor recovery
        solves vectorization at the cost of a discrete logarithm in a group of
        order m*^2 GIVEN the norm of the connecting ideal, and supplying that
        norm by ideal search costs at least ~sqrt|Delta_O|/3, which exceeds the
        generic sqrt(h) by a factor ~p^{1/4} on the small-|D_0| families." It can
        NEVER certify that vectorization is hard, that no cheap norm channel
        exists, or anything whatsoever about the ECDLP exponent. Dropping the
        phrase "by ideal search" from the second clause is the specific overclaim
        to guard against.
      nearby_object_control: >-
        THE WALKED-PATH FAMILY, where E' is reached from E by a recorded sequence
        of small-degree isogenies so that N(a) is known by construction. That is
        the closest object where the desired conclusion FAILS: there the recovery
        IS cheap. A version of the argument that also closes the walked-path
        family proves too much, has not identified the load-bearing structure
        (it would be assuming the advice unavailable rather than deriving its
        price), and is void. This control is what separates "the norm budget
        bites" from "CHM does not work".
    proof_obligations:
      - claim: Delta_O = f_E^2 D_0, hence f_E > 1 implies f_E^2 divides Delta_O.
        responsibility: correctness
      - claim: >-
          For the j = 0 and j = 1728 families, 4p = t^2 + |D_0| f^2, hence
          f <= (4p/|D_0|)^{1/2}.
        responsibility: size
      - claim: >-
          h(O) = f h(D_0) / [O_K^*:O^*] times prod_{ell | f} (1 - (D_0/ell)/ell),
          hence h ~ f/3 for D_0 = -3.
        responsibility: size
      - claim: >-
          A discrete logarithm in a group of order ell^{2e} costs
          O(e (sqrt(ell) + log ell)) group operations by Pohlig-Hellman.
        responsibility: runtime
      - claim: >-
          A fixed ideal class of O contains no integral ideal of norm below
          w sqrt|Delta_O| / (2 pi) - O(|Delta_O|^{1/4}).
        responsibility: size
      - claim: >-
          Generic meet-in-the-middle vectorization costs c sqrt(h) action
          evaluations with c measured and frozen.
        responsibility: baseline
      - claim: The crater null does not recover a.
        responsibility: interface
      - claim: >-
          The ADVICE-OFF cost equals the ADVICE-ON cost times the number of
          candidate norms, with no interaction term.
        responsibility: success_probability

  reachability_gate: >-
    T5 IS NOT MERELY RESPECTED HERE, IT IS THE SUBJECT. The record's entire
    content is a correction to T5's expensive side and then a re-closure of it on
    a different obstruction. Explicitly: T5's cheap side (a uniformly random
    curve is reachable in O(log p) steps, GRH-conditional rapid mixing) is
    untouched and is where the CHM mechanism turns out to live, because that is
    the only place norm advice is free. T5's expensive side is shown to rest, on
    the deep-volcano and small-|D_0| subfamilies, NOT on the discriminant being
    squarefree -- it provably is not -- but on the unavailability of N(a). The
    third branch this record adds to T5's dichotomy, and which
    DECOMPOSITION.md does not name, is: goodness identified by a global address
    IS cheaply reachable when the connecting ideal's NORM is separately
    available, and the campaign has no lane that asks whether it ever is.

  target_complexity:
    time_exponent: >-
      NO ECDLP EXPONENT IS CLAIMED OR MOVED; the standing ECDLP exponent remains
      1/2. For the VECTORIZATION subproblem the accounting is:
      counterfactual with norm advice, O(e (sqrt(ell) + log ell)) = poly(log p)
      when m* = ell^e with ell smooth, against the incumbent c sqrt(h) ~
      0.62 p^{1/4} on the j = 0 family -- an exponent move on that subproblem;
      actual without advice, at least ~0.67 p^{1/2} from the norm search, which
      is WORSE than the incumbent by ~p^{1/4}. The delivered exponent is
      therefore the incumbent p^{1/4}, unchanged.
    memory_exponent: >-
      ADVICE-ON: O(sqrt(ell) log p) group elements for the Pohlig-Hellman
      baby-step table, i.e. negligible. ADVICE-OFF: the same, times nothing --
      the norm search is sequential and needs no table, so the failure is purely
      in time. Incumbent MITM vectorization: sqrt(h) ~ p^{1/4} memory, or O(1)
      with a kangaroo/van Oorschot-Wiener variant at the usual sqrt(h^3/w)
      interpolation. NOTE THE INVERSION WORTH RECORDING: the closed mechanism is
      the MEMORY-CHEAP one, so an attacker memory-bound rather than time-bound
      would prefer it if the advice were ever available.
    best_known: >-
      Vectorization on an ordinary F_p isogeny class: ~sqrt(#Cl(O)) classical
      (KN-TECH-027; Galbraith-Hess-Smart lineage, KN-LIT-317 for the improved
      walk). Prime-field ECDLP: parallel rho with distinguished points at
      0.886 sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
      sqrt(N)/sqrt(N); automorphism-discounted rho at 0.886 sqrt(N/|Aut|) with
      |Aut| <= 6 (KN-TECH-018).
    hidden_overhead: >-
      Three items, all disclosed. (i) The poly(log p) of the ADVICE-ON arm hides
      the cost of computing m*(E) at all, which requires factoring Delta_O and
      determining the volcano level at every ell | f -- priced by
      IDEA-20260807-3c6bd8 as polynomial for small ell and SUBEXPONENTIAL for
      large ell (KN-LIT-251, KN-LIT-309). For m* = ell^e with ell small that is
      the cheap branch, which is fortunate for the counterfactual and is stated
      rather than assumed. (ii) The self-pairing evaluation itself, polynomial
      but with a real constant that Step 0 must extract from the primary text.
      (iii) Each norm-search attempt pays one verification by acting with the
      candidate ideal, and per IDEA-20260808-bba3dc that action is NOT polynomial
      over ordinary F_p -- so the ~0.67 p^{1/2} figure in (F) is a LOWER bound on
      the ADVICE-OFF cost and the closure is stronger than stated.
    tradeoff_note: >-
      The closed mechanism has negligible memory, so it does not participate in
      the time-memory tradeoff at all; the incumbent MITM does, interpolating to
      van Oorschot-Wiener sqrt(h^3/w) with memory w and parallelising linearly.
      This means a memory-constrained setting is exactly where the CHM route
      would have been most attractive, and the record says so rather than
      quoting only the time comparison.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY ROW OF THE
    FRONTIER; NOT NULL. As an ECDLP attack this record mounts none and is
    dominated by parallel rho (0.886 sqrt(N), O(1) memory; KN-TECH-001,
    KN-TECH-006), by BSGS (sqrt(N), sqrt(N); KN-TECH-031), by
    automorphism-discounted rho on CM curves (KN-TECH-018), and by kangaroo on a
    known interval. As a VECTORIZATION procedure the ADVICE-OFF arm is dominated
    on time by generic meet-in-the-middle vectorization at ~sqrt(#Cl)
    (KN-TECH-027, KN-LIT-317) by a factor ~p^{1/4}, and dominates it on memory
    (negligible against p^{1/4}) -- so on the Pareto frontier it is NOT strictly
    dominated on the memory axis, and that is disclosed rather than rounded away.
    The ADVICE-ON arm dominates everything on time but consumes DATA (the norm of
    the connecting ideal) that no frontier row consumes, which is exactly why it
    is priced as a counterfactual and not as a result.
  sota_delta: >-
    Zero speedup on ECDLP: 0.886 sqrt(N) before and after. Zero speedup on
    vectorization without advice: the incumbent ~sqrt(h) stands, and the imported
    mechanism is a factor ~p^{1/4} worse. The record's non-zero quantitative
    content is four numbers and a boundary: (i) the CHM hypothesis holds on
    100 percent of below-crater curves, by the identity Delta_O = f_E^2 D_0;
    (ii) m* is maximal, ~p^{1/2}, exactly on the small-|D_0| families L3 already
    singles out; (iii) the counterfactual with advice is poly(log p) against
    0.62 p^{1/4}, an exponent move on vectorization, so the foreclosed prize is
    large and worth recording; (iv) the closing inequality, norm search at
    >= 0.67 p^{1/2} against generic 0.62 p^{1/4}, a factor ~p^{1/4}, which is
    what forecloses it. The boundary: the closure holds for norm supplied BY
    IDEAL SEARCH and for no other norm channel.

