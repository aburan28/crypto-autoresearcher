    below the crater -- this is an identity. 0.97 that the small-|D_0| families
    carry the maximal conductor -- forced by 4p = t^2 + |D_0| f^2. 0.90 that the
    ideal-counting norm bound is correct as stated. 0.70 that Stage 0 confirms
