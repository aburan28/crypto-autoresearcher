  null_object_control: >-
    MANDATORY AND BLOCKING, in both directions, because the predicted result is a
    null.
    FORCED NULL - the crater curve with D_0 a prime discriminant, where m* = 1
    and the CHM hypothesis fails outright. Recovery must fail at any budget.
    PLANTED POSITIVE - the ADVICE-ON arm on a deep-volcano instance, which must
    recover a. An instrument that cannot produce the positive cannot certify the
    negative.
    DECAY PARAMETER - the depth below the crater. As depth decreases toward zero,
    m* decreases and the ADVICE-ON cost must RISE toward and past the generic
    sqrt(h). A cost that fails to rise as the parameter meant to destroy it
    decreases is the canonical artifact tell of docs/inventor-protocol.md
    section 3 and means the pipeline is not using the square divisor.
    MATCHED NULL OBJECT OF THE SAME SHAPE - the random-discriminant census arm of
    Step 2, which asks whether t^2 - 4p behaves like a random integer in its
    square part. This is the control for H1 and it is the one most likely to
    fail, because values of a quadratic polynomial have biased local densities.

