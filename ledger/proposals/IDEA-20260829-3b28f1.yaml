  assumptions:
    - >-
      The comparison's second operand is identifiable in each implementation's
      decapsulation function. Where inlining, LTO or macro expansion prevents
      it, the cell is reported UNMEASURABLE rather than classified.
    - >-
      A byte-exhaustive reference comparator can be built whose completeness is
      independently certified. Stage 3's P0/C0 and P0/C1 arms certify it; if
      the P0/C1 arm fails to decay, the reference is not complete and no
      attribution is reportable.
    - >-
      GNU ld --wrap interposition on the comparator symbol does not perturb the
      producer. This is checked by confirming S_native reproduces the
      unwrapped measurement on the P0/C1 arm and by wrap_call_counts attesting
      invocation.
    - >-
      No conclusion transfers beyond the pinned commits, toolchains and
      implementations actually read or built. A clean provenance map at one
      commit says nothing about another.

  proof_search_map:
    bottleneck: >-
      The attribution step: from "position i is silent at the Algorithm-18
      boundary" to "the comparator is responsible" or "the producer is
      responsible". Every existing instrument in this lane collapses those two
      into one observation, and the entire record exists to split them.
    baseline_embedding:
      parameter_slice: >-
        Restricted to implementations with W identically WRITTEN -- which is
        the case this lane has implicitly assumed throughout -- the ablation's
        two arms coincide (S_complete empty whenever S_native is
        comparator-caused) and every conclusion of the existing taxonomy is
        recovered unchanged. The proposal is a strict family extension along
        one previously fixed axis, and its baseline slice is the lane's
        current model, not a rival to it.
      reproduction_check: >-
        On the P0/C1 planted arm, S_native must equal the declared comparator
        window exactly and S_complete must be empty -- reproducing, under the
        new instrument, the qualitative result EV-MLKEM-005 already recorded
        for pre-fix versus post-fix wolfSSL. A failure of this check indicts
        the ablation harness before any candidate is read.
    observation_collision:
      observable: >-
        The silent set S measured at the Algorithm-18 boundary.
      distinct_preimage_search: >-
        A comparator with silent window R and a producer with inherited region
        R produce the IDENTICAL observable S = R on every input, at every
        parameter set, for every key. This is an exact, total collision on the
        lane's primary observable and it is the reason the class could exist
        undetected. The separating condition is the treatment, not a finer
        observable: substituting the comparator moves one preimage and not the
        other. Stage 3's P1/C1 arm, with the two windows placed at DIFFERENT
        ranges, is the direct test that the separation works rather than merely
        being argued.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The silent set held FIXED while the forgotten structure -- which of
          the two operands' handling produced it -- is varied by the
          comparator substitution.
        predicted_gain: >-
          Converts a collision that is total under passive observation into a
          separation under one intervention, at the cost of one extra run per
          implementation and no new instrument.
      - transform: stronger_invariant
        proposed_object: >-
          W, which preserves more state than the verdict requires: the verdict
          needs only byte agreement, W records why the bytes agree.
        predicted_gain: >-
          The extra state is exactly what survives the comparator substitution,
          which is why it, and not the verdict, is what recursion on the
          decapsulation pipeline should carry.
    quantifier_order: >-
      FOR EACH implementation I in the fetched population, FOR ALL byte
      positions i, IF W_I(i) = INHERITED THEN FOR ALL received ciphertexts the
      comparison agrees at i. The universal over ciphertexts is what
      distinguishes this from a probabilistic silent set and is what makes the
      must-not-decay arm a zero-tolerance check. The census claim is
      existential and per-implementation -- THERE EXISTS an implementation with
      a nonempty inherited region -- and is checked, never asserted uniformly.
    method_ceiling:
      strongest_certifiable_claim: >-
        For a stated, finite set of pinned implementations that were read and
        built, this method certifies whether the silent set observed at the
        Algorithm-18 boundary is attributable to the comparator or survives its
        substitution, and it certifies the source-level provenance map where
        source reading is unambiguous. It does NOT certify that a
        provenance-clean implementation is otherwise correct, does not
        establish the CAUSE of any inherited region, and says nothing about
        implementations not fetched.
      nearby_object_control: >-
        The P1/C0 arm -- a producer-side inherited region with a comparator
        that is complete by construction -- is the nearby object on which the
        hoped-for conclusion of the lane's existing taxonomy FAILS: every named
        comparator class predicts S empty there, and the truth is S = the
        inherited region. A method that reports "no comparator defect,
        therefore no defect" on that arm has not identified the load-bearing
        structure, and reporting it correctly is the pass criterion.
    proof_obligations:
      - claim: An inherited position is silent for every input, independent of the comparator.
        responsibility: correctness
      - claim: The substituted reference comparator is complete, certified by the P0/C1 decay arm.
        responsibility: interface
      - claim: An uninitialized position fails an honest round trip, so that branch is self-excluding.
        responsibility: feasibility
      - claim: The ablation separates a crossed producer/comparator pair with disjoint windows.
        responsibility: strictness
      - claim: Nothing transfers beyond the pinned commits read or built.
        responsibility: scope

  predictions:
    - metric: >-
        decay_on_P0C1: |S_complete| on the planted arm with a complete producer
        and a declared 32-byte comparator silent window
      direction: lower
      minimum_effect: >-
        EXACTLY 0, with no tolerance, while |S_native| is EXACTLY 32. This is
        the must-decay arm; if it does not decay, the substituted comparator is
        not complete or the interposition is not on the path, and NO
        attribution anywhere in the record is reportable.
    - metric: >-
        survival_on_P1C0: |S_complete| on the planted arm with a 32-byte
        inherited producer region and a comparator complete by construction
      direction: higher
      minimum_effect: >-
        EXACTLY 32, equal to |S_native|, with no tolerance. This is the
        must-not-decay arm and it is the record's central forced value: a
        decay here would mean the inherited region is not in fact silent and
        the mechanism in claim (B) is wrong.
    - metric: >-
        separation_on_P1C1: whether S_native equals the union of the two
        declared disjoint windows and S_complete equals the producer window
        alone
      direction: different
      minimum_effect: >-
        MUST HOLD exactly, set-for-set. A partial or fuzzy separation means the
        ablation detects but does not attribute, which is a weaker deliverable
        and must be reported as such rather than presented as attribution.
    - metric: >-
        kat_power: the number of standard known-answer-test vectors failed by
        the P1 (inherited) planted arm, and by a planted UNINITIALIZED variant
      direction: different
      minimum_effect: >-
        EXACTLY 0 for the inherited arm and STRICTLY POSITIVE for the
        uninitialized arm, with no tolerance on either. This is the pair that
        establishes conventional conformance testing has exactly zero power
        against the dangerous branch and full power against the harmless one,
        and it is the record's justification for the class mattering at all.
    - metric: >-
        census_inherited_count: over every implementation whose decapsulation
        function was read, the number with a nonempty inherited_deficit
      direction: different
      minimum_effect: >-
        No number is predicted and the refusal is deliberate: this is the
        record's discriminator. Zero is the expected and fully acceptable
        outcome -- a measured null over a non-empty, machine-decidable
        population, which is categorically stronger than the
        second_impl_unavailable disposition this lane has repeatedly recorded.
        Any nonzero count is a live conformance finding, escalates to the
        coordinator immediately, and is published by no agent.
    - metric: >-
        unmeasurable_fraction: the fraction of censused implementations whose
        provenance map cannot be classified from source or disassembly
      direction: lower
      minimum_effect: >-
        Below 0.5. Above that, the census is not executable as designed and is
        reported UNMEASURABLE for those cells rather than patched after seeing
        partial results; the ablation still runs on whatever builds.

  minimal_test:
    design: >-
      THE MINIMAL DISCRIMINATING VERSION IS STAGE 3 ALONE, ON PLANTED HARNESSES
      ONLY, AND IT NEEDS NO REAL LIBRARY: build the four crossed arms
      (P0/C0, P0/C1, P1/C0, P1/C1) as small standalone decapsulation harnesses
      over a reference ML-KEM implementation, run the single-byte differential
      probe through each under both the native and the interposed comparator,
      and check the four forced values. That is a few hundred lines of C, tens
      of minutes of build time, and seconds of compute, and it establishes
      whether the ablation attributes at all. Only if it does are Stages 1 and
      2 -- the source census and the ablation on real libraries, bounded by
      fetch and build budget -- worth running. Stage 4's KAT arm rides along at
      no extra cost. This ordering deliberately spends nothing on real
      libraries until the instrument has demonstrated the separation it claims.
    controls:
      - >-
        MUST-DECAY ARM (P0/C1): forced |S_complete| = 0 against
        |S_native| = 32. Without a demonstrated decay the substituted
        comparator is not certified complete and nothing is attributable.
      - >-
        MUST-NOT-DECAY ARM (P1/C0): forced |S_complete| = |S_native| = 32. This
        is the null object for the LANE'S EXISTING MODEL: every comparator-side
        class predicts 0 here, and the arm exists to show the existing model
        can be wrong in a way its instruments cannot see.
      - >-
        CROSSED ARM (P1/C1) with disjoint windows: the separation test proper.
      - >-
        NULL OBJECT (P0/C0): a wholly correct harness. Forced |S| = 0 on both
        arms. If the instrument reports any silent index on a construction that
        is complete on both sides, it is broken and no negative may be
        reported, mirroring IDEA-20260805-ee2018's own null discipline.
      - >-
        SELF-EXCLUSION CONTROL: a planted UNINITIALIZED variant, which must
        fail the honest round trip. This is the arm that keeps the record from
        claiming a dangerous class where the failure mode is actually
        self-announcing.
      - >-
        WRAP ATTESTATION: wrap_call_counts confirming the interposed symbol was
        actually invoked on every ablation run, per EV-MLKEM-010's admitted
        method; the call-site macro method refuted by EV-MLKEM-009 is never
        used.
      - >-
        ORDERING CONTROL: the four forced values are committed and hashed
        before any real implementation is read or built, so no census cell can
        be reclassified after the fact.
      - >-
        ARCHIVE CHECK (zero compute): confirm that EV-MLKEM-005's post-fix
        |S| = 0 is CONSISTENT WITH BOTH attributions and is not evidence for
        either, and say so in the report rather than recruiting it as support.
    required_metrics:
      - S_native and S_complete as explicit index sets, per arm and per implementation
      - the four planted arms' forced-versus-measured table with seeds
      - KAT pass/fail counts for the inherited and uninitialized planted variants
      - per-implementation provenance tuple (destination buffer, aliased?, seeded?, comparison length, inherited_deficit) with source excerpt
      - the list of implementations reported UNMEASURABLE, with the reason
      - wrap_call_counts per ablation run
      - every patch diff, build configuration and pinned commit used

  falsification_conditions:
    - >-
      The P0/C1 must-decay arm does not decay. The substituted comparator is
      not complete, or the interposition is not on the comparison path; no
      attribution, positive or negative, is reportable until repaired.
    - >-
      The P1/C0 must-not-decay arm decays. An inherited region is NOT silent
      under a complete comparator, the mechanism of claim (B) is wrong, and the
      record is withdrawn.
    - >-
      The P1/C1 crossed arm fails to separate the two windows. The ablation
      detects but does not attribute; the record's central claim is downgraded
      from attribution to detection and must be reported that way.
    - >-
      The inherited planted arm fails any known-answer test. The class is
      self-announcing after all, ordinary conformance testing does have power
      against it, and the record's justification for its importance collapses
      even if the mechanism is real.
    - >-
      Any fetched implementation is found with a nonempty inherited_deficit.
      This is a live, escalable conformance finding under RQ-MLKEM-002,
      reported to the coordinator and published by no agent -- not merely a
      positive result for this record.
    - >-
      The provenance map is UNMEASURABLE for a majority of censused
      implementations. The census is not executable as designed and says so.
    - >-
      Build or fetch failures. INFRASTRUCTURE outcome under AGENTS.md rule 3,
      never negative evidence about any implementation; the planted ladder
      still completes because it depends on no external library.

  confounders:
    - >-
      THE COLLISION IS TOTAL UNDER PASSIVE OBSERVATION AND THAT IS THE POINT.
      A comparator window and an inherited region of the same extent are
      indistinguishable on every input, at every parameter set, on every key.
      Any reading of a silent set as evidence about the comparator, anywhere in
      this lane's archive, carries this ambiguity, and the honest statement is
      that the archive is consistent with both and was never designed to
      separate them.
    - >-
      INTERPOSITION CAN PERTURB MORE THAN THE COMPARATOR. Wrapping a symbol
      changes linkage and can change inlining decisions around the call, which
      could in principle alter the producer's compiled form. The P0/C1 arm's
      reproduction of the unwrapped S_native is the check, and a discrepancy
      there voids the ablation for that build.
    - >-
      A STREAMING DESIGN BLURS PRODUCER AND CONSUMER. An implementation that
      re-encrypts and compares block by block has no single moment at which W
      is defined; such implementations are reported OUT OF POPULATION for the
      static map and are handled by the behavioural ablation alone, with the
      distinction stated per cell.
    - >-
      REACHABILITY IS NOT PRESENCE. A destination buffer seeded from the
      received ciphertext makes the class reachable; whether the re-encryption
      actually fails to cover the buffer is a further question, and the two are
      not conflated.
    - >-
      SELECTION BY FETCHABILITY AND BUILDABILITY. The census's population is
      whatever can be fetched and built within budget, and every count is a
      floor over that population, stated as such.
    - >-
      A CLEAN CENSUS IS THE LIKELY OUTCOME AND MUST NOT BE OVERSOLD. Separate
      comparison buffers are the ordinary pattern and the one implementation
      already in hand uses one. A null here closes a site; it does not close
      the isolation-versus-systemic question and must not be phrased as if it
      did.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST
      ESTIMATE, NOT A STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY
      PARAMETER SET. RQ-MLKEM-002's constraints bind unchanged; any newly
      observed conformance defect escalates to the coordinator and is published
      by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for any hypothesis, or
      for any archived evidence or decision record. Observing that an archived
      measurement is consistent with two attributions is not re-reading its
      verdict.
    - >-
      A clean provenance map at one pinned commit establishes exactly one fact
      about one buffer in one function. It does not establish that the
      implementation's comparison is correct, that its re-encryption is
      correct, or that any other implementation behaves the same way.
    - >-
      Claim tier laboratory/toy, not raisable by citation. Planted harnesses
      and laboratory library builds at three standardized ciphertext lengths
      are never crypto-scale or MLWE evidence.
    - >-
      A null census removes one candidate site from future search, not the
      search itself, and the CAUSE of any inherited region found remains
      untested by this record. Premature closure is a failure mode symmetric
      with overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        PROVENANCE FORCES AGREEMENT. FOR ALL decapsulation implementations,
        FOR ALL byte positions i, and FOR ALL received ciphertexts c*, if the
        comparison's second operand at position i is never assigned between the
        point at which it is set from c*[i] and the comparison call, then the
        two operands are byte-equal at i; consequently the comparison's verdict
        is independent of c*[i], and i lies in the observed silent set for
        every comparator whatsoever.
      rigorous_support: >-
        Not a distributional heuristic; a rigorous consequence of sequential
        semantics -- a memory location that is written once from a source and
        not written again holds that source's value at any later read. It
        imitates no classical distribution theorem and is not presented as one.
        Its preconditions are exactly the ones that can fail in practice and
        are named rather than assumed: no intervening write on ANY path
        (including error paths and compiler-inserted initialization), no
        aliasing that makes a different write cover the position, and a single
        well-defined comparison call. Where any precondition is undecidable
        from source, the cell is UNMEASURABLE.
      validation_plan: >-
        Validated by construction and by measurement together, at a scale where
        both are exhaustive rather than sampled: on the P1/C0 planted arm,
        probe EVERY byte position of the ciphertext with EVERY nonzero
        single-byte delta (255 * L probes, i.e. 255 * 1568 = 399,840 at
        ML-KEM-1024, seconds of compute) and confirm that the measured silent
        set equals the declared inherited region exactly, with zero indices in
        and zero out. The tail check is the strongest single disagreement
        observed, which must be none. Repeat at all three parameter sets and
        confirm the inherited region tracks its declared byte range rather than
        scaling with L, which distinguishes it from a reduction deficit. No
        transfer to unbuilt implementations is claimed: this validates the law,
        not any implementation's provenance.
    - id: H2
      statement: >-
        SUBSTITUTION COMPLETENESS. The interposed reference comparator has an
        empty silent set at every parameter set and for every input pair, so
        that any index remaining in S_complete is attributable to something
        other than the comparator.
      rigorous_support: >-
        Rigorous for a byte-at-a-time loop over the full length with an
        OR-of-XOR accumulate and a sign-safe zero test -- the construction is
        chosen precisely so that IDEA-20260805-3c957e's coverage arithmetic
        gives an empty deficit (stride 1 divides every length),
        IDEA-20260805-ee2018's reduction analysis gives phi = 1 (no lanes), and
        IDEA-20260828-edec21's finalize analysis gives an empty silent value
        set (unsigned negate-and-shift). The three prior derivations are USED
        as the completeness certificate rather than re-derived, and the
        argument is only as good as they are, which is stated rather than
        hidden.
      validation_plan: >-
        Exhaustive rather than sampled, at the scale where exhaustion is
        possible: drive the reference comparator with all 255 * L single-byte
        deltas at each parameter set and confirm zero silent indices, then with
        at least 10^5 random multi-byte difference supports of sizes 2, 4 and 8
        and confirm zero misses. Predicted distribution: the detection
        indicator is identically 1, so the comparison is against a degenerate
        distribution and the tail check is simply that the minimum observed
        detection over all probes is 1. Any single miss withdraws H2 and voids
        every attribution taken against that reference.

  target_complexity:
    time_exponent: >-
      n/a -- no exponent is moved and no attack is proposed; RQ-MLKEM-002
      forbids attack-cost estimation. Stated plainly. The deliverable is an
      attribution instrument plus a bounded source census, not an asymptotic
      result.
    memory_exponent: n/a
    best_known: >-
      n/a -- no competing statement of producer-side provenance exists in this
      repository. Whether one exists in the external literature on
      partially-initialized comparison buffers was NOT searched this session.
    hidden_overhead: >-
      n/a. The dominant cost is 255 * L single-byte probes per arm per
      parameter set -- under 400,000 decapsulation-boundary probes at
      ML-KEM-1024, each a small constant-time comparison -- plus build time for
      four planted harnesses and whatever libraries the census fetches. No
      superpolynomial term and nothing hidden in an o(1).
    tradeoff_note: >-
      n/a. The one scaling note is that the ablation doubles the probe budget
      of any existing measurement, since every arm is run twice; that factor of
      two is the entire price of attribution and is stated rather than absorbed.

  dominated_by: >-
    n/a (no result claimed as an algorithm; no time, memory or data/query cost,
    hence no Pareto point). Rows checked inside this repository on 2026-08-29
    for a prior treatment of the re-encryption's write footprint or of
    comparator substitution as an attribution instrument: all eleven filed
    RQ-MLKEM-002 proposals, read in full or in their claim/mechanism/object
    blocks; RQ-MLKEM-001 and RQ-MLKEM-003 in full; EV-MLKEM-005 in full;
    RUN-MLKEM-007 summary.json in full. The nearest row is
    IDEA-20260821-25d3ca, which reaches the same operand-agreement logic at a
    different site from a different cause and is credited in
    discriminated_from; the next nearest is IDEA-20260828-40db79, which audits
    a different buffer on the other side of the verdict. Neither dominates
    this record in the Pareto sense because neither measures this quantity at
    any cost. NO EXTERNAL SEARCH was performed and no external novelty is
    claimed.
  sota_delta: >-
    No attack; control and attribution contribution only. Quantitatively,
    against the lane's own state: every silent-set measurement in this lane's
    archive -- the pre-fix AVX2 {1536..1567}, the pre-fix NEON 384/544/784, the
    post-fix zeros, at three parameter sets and two backends -- is consistent
    with two disjoint attributions and was produced by an instrument with
    exactly ZERO power to separate them, because the instrument varies the
    library version rather than the comparator alone. This record supplies the
    separating intervention at a cost of one additional run per implementation
    (a factor of 2 on probe budget, no new instrument, reusing the ld --wrap
    method already admitted by EV-MLKEM-010), and it names one branch --
    inherited provenance -- against which known-answer testing has forced zero
    power, which is a class the program's entire defensive apparatus is
    currently blind to by construction.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
