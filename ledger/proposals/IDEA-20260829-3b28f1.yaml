idea:
  id: IDEA-20260829-3b28f1
  question_id: RQ-MLKEM-002
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    The lane has audited the CONSUMER of c' and never the PRODUCER. Track the
    write-provenance of the re-encrypted buffer, and settle comparator-side
    versus producer-side attribution with one ablation the lane has never run
    -- substitute a certified-complete comparator and ask whether the silent
    set decays to empty as it must
  class: control

  claim: >-
    (A) THE UNEXAMINED HALF OF THE COMPARISON. Algorithm 18 compares two
    buffers: the received ciphertext c*, and the re-encryption c' produced by
    the implementation itself. Every object this lane has tracked -- the silent
    set S (IDEA-20260805-1beeca, -ee2018), the length residue L mod w
    (IDEA-20260805-3c957e), the difference support D (IDEA-20260821-13b667),
    the compiled coverage set (IDEA-20260821-121612, IDEA-20260828-033cb3), the
    select's write coverage and the finalize's value map (IDEA-20260828-40db79,
    -edec21) -- is a property of the routine that READS those two buffers. Not
    one asks whether the SECOND BUFFER IS FULLY AND INDEPENDENTLY WRITTEN
    BEFORE THE READ. This record makes the producer's write footprint the
    tracked object.
    (B) THE MECHANISM, AND WHY IT IS INVISIBLE TO EVERY EXISTING INSTRUMENT.
    Define, for a decapsulation implementation, the write-provenance map
    W : [0, L) -> {WRITTEN, INHERITED, UNINITIALIZED}, where WRITTEN means the
    byte of the comparison's second operand is assigned by the re-encryption on
    every path, INHERITED means it retains a value copied from or aliased to
    the RECEIVED ciphertext, and UNINITIALIZED means it retains unrelated prior
    contents. The three provenances have three completely different observable
    signatures, and only one of them is dangerous:
      WRITTEN       -- ordinary; the comparison means what it says.
      UNINITIALIZED -- the compared byte is unrelated garbage, so HONEST
                       ciphertexts are rejected. This breaks the very first
                       known-answer test and cannot survive in any shipped
                       implementation. It is SELF-EXCLUDING, and saying so is
                       half the point.
      INHERITED     -- the compared byte is, by construction, equal to the
                       received byte. The comparison at that position is c*[i]
                       against c*[i]: it can never disagree. Honest ciphertexts
                       pass, every KAT passes, every conformance vector passes,
                       and the position is PERMANENTLY SILENT no matter how
                       perfect the comparator is.
    An INHERITED region is therefore a silent set that belongs to the producer,
    not to the comparator -- and it is exactly the object IDEA-20260821-25d3ca
    discovered at the encapsulation modulus check ("the two buffers cannot
    differ on the rho tail"), transported to the decapsulation site where this
    lane's decision target actually lives, and arising from an implementation
    choice rather than from the standard's structure.
    (C) THE ABLATION THAT ATTRIBUTES, AND IT IS ONE LINE. Every
    comparator-side mechanism class the lane has named -- C-COV, C-BND, C-RED,
    C-FIN, and by extension C-SEL -- shares one forced consequence: REPLACE THE
    COMPARATOR WITH A CERTIFIED-COMPLETE ONE AND THE SILENT SET MUST COLLAPSE
    TO EMPTY. A producer-side INHERITED region does not collapse; it is
    identical under any comparator, because the two operands agree there
    whatever is read. So the discriminating measurement is: measure S at the
    Algorithm-18 boundary; then, under the GNU ld --wrap interposition already
    admitted by EV-MLKEM-010, substitute a byte-exhaustive reference comparator
    for the library's own and measure S again. S collapsing to empty attributes
    the deficit to the comparator and CONFIRMS the lane's entire existing
    taxonomy at that implementation. S surviving unchanged attributes it to the
    producer and opens a class no instrument in this program has ever probed.
    Both outcomes are reachable, both are informative, and the measurement is
    the same measurement twice.
    (D) THIS IS THE INVENTOR PROTOCOL'S STRUCTURAL TELL, INSTANTIATED. Section
    3's canonical tell is a quantity that should decay with the parameter meant
    to destroy it and does not. Here the quantity is |S| at the Algorithm-18
    boundary and the parameter meant to destroy it is comparator completeness.
    The lane has run the parameter to its limit exactly once -- EV-MLKEM-005's
    post-fix builds show |S| = 0 -- but it ran it by changing the LIBRARY
    VERSION, which changes the comparator and the producer together, so the
    decay is uninformative about attribution. Substituting the comparator alone
    while holding the producer fixed is the ablation that separates them, and
    it has never been run.
    (E) WHAT MAKES THE CLASS NON-EMPTY RATHER THAN HYPOTHETICAL. The dangerous
    provenance requires a destination buffer that already holds the received
    ciphertext at the moment the re-encryption runs. That happens in at least
    three ordinary implementation patterns, each checkable by source reading:
    (i) an in-place or aliased design where the received ciphertext buffer is
    passed as the re-encryption destination to save an allocation; (ii) a
    design that memcpy's c* into the comparison buffer as a "safe default"
    before re-encrypting into it; (iii) a streaming design that re-encrypts and
    compares in blocks, where an early exit or a bound error leaves later
    blocks never produced and a pre-seeded buffer standing in for them. This
    record does not assert that any implementation does any of these. It
    asserts that the question has never been asked, that the answer is
    decidable by reading each implementation's decapsulation function, and that
    the ablation in (C) decides it behaviourally even where source reading is
    ambiguous. A census returning "every fetched implementation writes into a
    buffer with no inherited provenance" is a clean, reportable, expected null
    that closes a site.
    (F) A DISCLOSED NEGATIVE ON THE ONE IMPLEMENTATION ALREADY IN HAND. The
    PQClean AVX2 decapsulation quoted in this repository's own committed
    evidence file (experiments/EXP-MLKEM-009/analysis/pre-run/
    pqclean_mechanism_evidence.txt) and in IDEA-20260828-40db79's retrieved
    source uses a SEPARATE stack buffer for the re-encryption and passes it and
    the received ciphertext as two distinct pointers to `verify`. On the source
    read available to this session that buffer is not seeded from the received
    ciphertext, so its unwritten bytes -- if any -- would be UNINITIALIZED
    rather than INHERITED, which is the self-excluding provenance of (B). That
    implementation is therefore expected OUT OF THE DANGEROUS CLASS, and this
    record says so upfront rather than discovering it later. The class's
    interest lies entirely in the census and in the ablation, not in a
    pre-selected target.
    (G) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no
    attack-cost estimate, no timing/power/EM/cache/fault measurement, no
    statement about MLWE hardness or ML-KEM security at any parameter set. No
    claim that any implementation has an inherited-provenance region. An
    inherited region would be a functional conformance defect, and any newly
    observed conformance defect escalates to the coordinator per RQ-MLKEM-002
    and is published by no agent.

  mechanism: >-
    STAGE 0 -- DEFINE AND FREEZE THE PROVENANCE PREDICATE BEFORE ANY CANDIDATE
    IS READ. For a decapsulation function, identify the pointer passed as the
    comparison's second operand, and classify every byte position of the buffer
    it points to as WRITTEN, INHERITED or UNINITIALIZED by the static rule:
    WRITTEN if some assignment on every path from function entry to the
    comparison call writes it from re-encryption output; INHERITED if the
    buffer is aliased to, or copied from, the received ciphertext and no
    subsequent write covers the position; UNINITIALIZED otherwise. Emit
    inherited_deficit = |{i : W(i) = INHERITED}|. Where aliasing, macro
    expansion or LTO makes the classification undecidable from source, the cell
    is reported UNMEASURABLE, never guessed -- the same discipline
    IDEA-20260821-121612 requires of its own extractor, whose disassembly
    output is reused here where source alone is ambiguous.
    STAGE 1 -- THE SOURCE CENSUS, ZERO BUILD. For every implementation
    fetchable within budget, read the decapsulation function and record four
    fields: the destination buffer of the re-encryption; whether it aliases or
    is seeded from the received ciphertext; whether the comparison length
    equals the full ciphertext length; and the inherited_deficit. Report the
    per-implementation tuple with the source excerpt it was read from. This
    stage alone answers the class's existence question over the fetched
    population and costs nothing but reading.
    STAGE 2 -- THE COMPARATOR-SUBSTITUTION ABLATION, THE ATTRIBUTING
    MEASUREMENT. On each buildable implementation, run the existing
    single-byte differential probe at the Algorithm-18 boundary twice under
    identical seeds, keys and mutation schedule:
      ARM NATIVE    -- the library's own comparator, unmodified.
      ARM COMPLETE  -- the library's comparator symbol interposed via GNU ld
                       --wrap (EV-MLKEM-010's admitted instrument; never the
                       call-site macro method EV-MLKEM-009 refuted) with a
                       byte-exhaustive reference comparison whose completeness
                       is certified by the planted-comparator ladder of
                       Stage 3, and with wrap_call_counts attesting that the
                       wrapped symbol was actually invoked.
    Report S_native, S_complete, and the difference. FORCED: for every
    comparator-side class, S_complete is empty. Any i in S_complete is,
    by elimination over the classes named in this lane, not attributable to
    the comparator.
    STAGE 3 -- THE PLANTED LADDER, SO THAT BOTH ARMS ARE CALIBRATED. Build a
    small ladder of planted decapsulation harnesses with independently
    controlled producer and consumer defects:
      P0/C0 -- complete producer, complete comparator. Forced S empty on both
               arms.
      P0/C1 -- complete producer, comparator with a declared 32-byte silent
               window. Forced S_native = that window, S_complete = empty.
               This is the MUST-DECAY arm.
      P1/C0 -- producer with a declared 32-byte inherited region (destination
               pre-seeded with the received ciphertext, re-encryption writing
               only the first L-32 bytes), complete comparator. Forced
               S_native = S_complete = that region. This is the MUST-NOT-DECAY
               arm and it is the one the whole record turns on.
      P1/C1 -- both defects, with the two windows placed at DIFFERENT byte
               ranges. Forced S_native = the union, S_complete = the producer's
               window alone. This is the arm that shows the ablation
               SEPARATES rather than merely detects.
    STAGE 4 -- THE KAT SELF-EXCLUSION CHECK, WHICH IS WHY THE CLASS IS SUBTLE.
    On every planted arm, run the implementation's own known-answer tests and
    an honest encapsulate/decapsulate round trip. Forced: P1 (inherited)
    passes every KAT, because on an honest ciphertext the inherited bytes are
    the correct bytes; a planted UNINITIALIZED variant fails immediately.
    Recording that contrast is what establishes that ordinary conformance
    testing has exactly zero power against the inherited class -- a mode-1
    null located in the standard test suite rather than in this lane's
    generator.
    STAGE 5 -- CROSS-CHECK AGAINST THE ARCHIVE, ZERO COMPUTE. EV-MLKEM-005
    reports post-fix builds at |S| = 0 on both backends and all three
    parameter sets. Under this record's model that is consistent with either
    attribution, since the post-fix build changed the comparator and left the
    producer alone only if the producer was already complete. Report the
    archived numbers as CONSISTENT-WITH-BOTH rather than as support, which is
    the honest reading and the reason the ablation is needed at all.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over the repository plus first-hand reads; the crypto-kb MCP index's
      availability was not re-checked and is not relied on. Grep of
      ledger/proposals (glob *MLKEM*) for
      `re-encrypt|reencrypt|decrypt|message bit|Compress|Decompress|coins`,
      case-insensitive: NO MATCHES across all eleven filed RQ-MLKEM-002
      proposals, which is the strongest single indication that the PRODUCER
      side of the comparison has never been an object here. Grep of
      ledger (glob *MLKEM*) for `align|unaligned|alignment`, case-insensitive:
      the only hit inside this lane is EV-MLKEM-005's boundaries clause listing
      untested classes. Read in full or in their claim/mechanism/object blocks
      this session: all eleven RQ-MLKEM-002 proposals, RQ-MLKEM-002,
      RQ-MLKEM-001, RQ-MLKEM-003, EV-MLKEM-005 (full), RUN-MLKEM-007
      summary.json (full). No web retrieval was performed for this record.
    results: >-
      IDEA-20260821-25d3ca is the nearest prior art and the resemblance is
      instructive rather than disqualifying: it observes that at the
      ENCAPSULATION modulus check the two compared buffers CANNOT DIFFER on the
      32-byte rho tail, so a deficit there is unobservable. That is the same
      logical shape -- silence produced by operand agreement rather than by
      comparator blindness -- but it arises there from the STANDARD's structure
      at a DIFFERENT site, is derived by arithmetic over a fixed layout, and is
      not attributable to any implementation choice. This record's object
      arises from an IMPLEMENTATION's buffer handling at the DECAPSULATION
      site, varies across implementations, and is settled by an ablation rather
      than by arithmetic. IDEA-20260828-40db79 audits the write coverage of the
      SELECT primitive downstream of the verdict; this record audits the write
      coverage of the RE-ENCRYPTION upstream of it, and the two are different
      buffers, different primitives and different failure signatures. No record
      in this repository proposes substituting a certified-complete comparator
      as an attribution ablation; the corpus uses planted comparators only as
      controls on the instrument, never as a treatment on a real
      implementation. Outside the repository, buffer aliasing and
      partially-initialized comparison buffers are a generic C defect family;
      NO SEARCH was performed and no external novelty is claimed.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: the write-provenance
      map W as a tracked object; the three-way WRITTEN/INHERITED/UNINITIALIZED
      partition with its self-exclusion argument for the uninitialized branch;
      the comparator-substitution ablation as an ATTRIBUTION instrument rather
      than a control; the crossed P/C planted ladder with a must-decay and a
      must-not-decay arm; and the observation that ordinary KATs have exactly
      zero power against the inherited branch. ASSEMBLED FROM KNOWN PARTS: the
      operand-agreement logic is IDEA-20260821-25d3ca's, transported to another
      site and another cause; the ld --wrap instrument discipline is
      EV-MLKEM-010's; the planted-comparator ladder form is
      IDEA-20260805-ee2018's; the coverage-set vocabulary is
      IDEA-20260821-121612's.

  object_first_candidate:
    tracked_object: >-
      W : [0, L) -> {WRITTEN, INHERITED, UNINITIALIZED}, the write-provenance
      map of the comparison's SECOND operand, together with the derived scalar
      inherited_deficit = |W^{-1}(INHERITED)|.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens per
      inventor-protocol section 1: (a) the comparator's silent set, its size,
      profile, period and suffix shape; (b) the length residue L mod w;
      (c) the generator's difference support and its power law; (d) compiled
      stride, coverage determinacy and call-site specialization; (e) the
      select and finalize primitives downstream of the verdict; (f) control-arm
      wiring and baseline-invisibility; (g) every cryptanalytic and physical
      side-channel lens, excluded by RQ-MLKEM-002. S appears here only as the
      measured quantity the ablation moves, never as the tracked object.
    lossiness: >-
      Genuinely lossy and compatible with the operation of interest. The full
      state at the comparison call is (the entire decapsulation computation,
      the key, the received ciphertext, every intermediate polynomial, the two
      buffers' contents). W retains only, per byte position, WHICH SOURCE
      last assigned it -- discarding the values written, the re-encryption's
      entire arithmetic, the key, and the ciphertext. The fibre is enormous
      and non-singleton: every correct ML-KEM re-encryption in existence, on
      every key and every message, maps to the same all-WRITTEN map, and a
      memcpy-then-partial-rewrite design maps to the same INHERITED map
      whatever it computes. It is not a change of coordinates: nothing about
      the ciphertext or the key is recoverable from W.
      COMPATIBILITY: the comparison verdict is a function of the two operands'
      byte-wise agreement, and INHERITED provenance forces agreement at that
      position regardless of the comparator, so the retained part determines
      the operation's outcome at exactly the positions it classifies. That is
      what makes W propagate rather than merely summarize.
    propagation: >-
      One step of the operation of interest is "compare the two operands at
      position i". The law is deterministic and closed form:
      if W(i) = INHERITED then the operands agree at i for every received
      ciphertext, so i is silent independently of the comparator;
      if W(i) = WRITTEN then i is silent iff the comparator's own silent set
      contains i;
      if W(i) = UNINITIALIZED then i disagrees on honest inputs with
      probability 1 - 2^{-8} per byte, so the implementation fails its own
      round trip. Composing over the buffer: S_observed = S_comparator union
      W^{-1}(INHERITED), and substituting a complete comparator sends the first
      term to the empty set and leaves the second fixed. That identity is the
      whole design.
    survival_score: >-
      Survives two steps and stops at a boundary declared in advance. Step 1,
      "is this position forced silent by provenance": survives, by the law
      above. Step 2, "does substituting a complete comparator separate the two
      contributions": survives, and is what Stage 2 measures. Step 3, "WHY does
      the producer fail to cover that region" -- a bound error, an early exit,
      an aliasing mistake, a length mismatch: DIES here deliberately. W records
      that a region is inherited, not the cause, and diagnosing the cause is a
      separate audit this record does not perform and does not conflate with
      detection.

  discriminated_from:
    - >-
      IDEA-20260821-25d3ca derives, at the ENCAPSULATION modulus-check site,
      that the compared buffers cannot differ on the rho tail because rho
      passes through the re-encode unchanged -- a consequence of the STANDARD's
      key layout, identical in every conforming implementation, established by
      arithmetic over a fixed layout. This record's inherited regions are
      consequences of an IMPLEMENTATION's buffer handling at the DECAPSULATION
      site, differ between implementations, are not derivable from the
      standard, and are detected by an ablation rather than by arithmetic. The
      shared insight -- operands that cannot differ produce silence no
      comparator fix removes -- is credited to -25d3ca and is not re-derived
      here.
    - >-
      IDEA-20260828-40db79 tracks the write coverage of the SELECT primitive,
      which runs AFTER the verdict and writes the shared secret. This record
      tracks the write coverage of the RE-ENCRYPTION, which runs BEFORE the
      verdict and writes the comparison's operand. Different buffer, different
      primitive, opposite side of the verdict, and the two records' claims are
      independent in both directions.
    - >-
      IDEA-20260805-ee2018, -1beeca, -3c957e and IDEA-20260821-121612 all take
      the second operand as given and audit the routine that reads it. Their
      taxonomy (C-COV, C-BND, C-RED, C-FIN) is not restated or extended here;
      it is USED, as the set of classes whose common forced consequence --
      collapse under a complete comparator -- makes the ablation an attribution
      instrument rather than merely another detector.
    - >-
      IDEA-20260821-13b667 computes the probability that a generator's
      difference support lands inside a silent set. This record does not
      compute a probability at all: the inherited region is silent with
      probability exactly 1 for every input, and the question is attribution,
      not power. Where the two meet is that an inherited region enlarges the
      effective S in 13b667's formula, which is noted and not developed.
    - >-
      RQ-MLKEM-001's H-MLKEM-232843 mutates the private key and reads
      decapsulation as a black box. This record never touches key material and
      is a white-box audit of one buffer's write footprint.

