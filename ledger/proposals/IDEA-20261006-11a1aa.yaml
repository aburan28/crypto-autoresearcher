idea:
  id: IDEA-20261006-11a1aa
  question_id: RQ-EWALK-8fa147
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    r=4 versus r=16 step ratio on y^2 = x^3 + 2x + 5 over F_89
  class: measurement
  claim: >-
    On E: y^2 = x^3 + 2x + 5 over F_89, which this session counted as
    101 points including infinity, an r-adding walk with r=4 uses at
    least 1.15 times as many steps, on average over the 20 planted
    scalars 1..20, as the same walk with r=16, same generator, and the
    same start point. A finished ratio strictly below 1.15 falsifies
    the claim. Two r=16 walks on the same seeds have ratio 1. The
    curve is not a j=0 model, and the claim is not a count of
    fruitless-cycle lengths.
  mechanism: >-
    The tracked object is the number of adding steps until a planted
    scalar is recovered. The representation is the point. The operation
    set is Teske's r-adding step: from the current point, add one of r
    fixed multiples of a generator, with the branch equal to x mod r.
    KR-RHO-cd86f5 says r near 16 to 20 behaves like a random mapping
    and that a smaller r costs extra iterations. This idea pins that
    cost at 1.15 on one ordinary curve of prime order 101, where A and
    B are both nonzero, so the rational automorphism group is the
    negation pair and no order-3 canonicaliser is used. The walk does
    not quotient by an automorphism. A ratio below 1.15 means the
    smaller branch set did not cost the pinned fraction on this sample.
  assumptions:
    - The discriminant 4*8 + 27*25 = 707 is nonzero modulo 89, and #E is not 90, so the curve is ordinary. This session's count is 101.
    - The group of prime order is cyclic, and every non-identity point is a generator. The experiment freezes the first affine point in lexicographic order as the generator and checks its order.
    - Both walks are deterministic given r, the generator, and the scalar. No canonicaliser and no cycle escape is applied.
  predictions:
    - metric: r4_over_r16_mean_step_ratio
      direction: higher
      minimum_effect: >-
        The ratio of mean steps at r=4 to mean steps at r=16, on
        scalars 1..20, is at least 1.15.
    - metric: r16_repeat_ratio
      direction: different
      minimum_effect: >-
        Two r=16 walks with the same generator and the same scalars
        have step-sum ratio 1.
  minimal_test:
    design: >-
      Confirm the point count 101 and pick the lexicographically first
      affine point as generator. For each scalar s in 1..20, start both
      walks at that generator and stop when the current point equals
      s times the generator, or at 5000 steps. Record both step totals.
      Repeat the r=16 walk once.
    controls:
      - The repeated r=16 walk. Its step sum equals the first r=16 step sum.
      - A walk that is run with a canonicaliser is void. This claim has no orbit quotient.
      - BSGS on the same 20 scalars, as a walk-free check that s*G is the target.
    required_metrics:
      - mean steps at r=4 and at r=16
      - the ratio of those means
      - the repeated r=16 step sum
      - whether every scalar was found within 5000 steps
  falsification_conditions:
    - All 20 scalars are found on both walks and the ratio of means is strictly below 1.15.
    - The repeated r=16 step sum differs from the first. That voids the instrument.
    - The point count is not 101, so the order pin fails and the ratio is not scored.
  confounders:
    - An escape that rewrites a fruitless cycle changes the step count. This test uses no escape. Adding one would be a different experiment.
    - A generator that is not the lexicographic first point can change both means. The ratio is defined only for the frozen generator.
    - Twenty scalars in a group of order 101 is a small sample. A ratio of 1.14 would be this negative even if a larger sample sat above 1.15.
  interpretation_limits:
    - A ratio of at least 1.15 is a walk-constant comparison. It is not an automorphism speedup and it does not move the exponent 1/2.
    - Landing above 1.15 does not show that r=16 is optimal. Landing below 1.15 does not exhibit a new endomorphism.
    - The test is one prime and one curve. It does not transfer to a j=0 orbit walk or to a cryptographic group.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For this deterministic r-adding rule, the mean step count at
        r=4 exceeds the mean at r=16 by a factor of at least 1.15 on
        the 20 pinned scalars. The comparison distribution is the
        repeated r=16 walk, whose ratio is 1, not a fitted constant.
      rigorous_support: >-
        KR-RHO-cd86f5 records that r near 16 to 20 is close to a
        random mapping and that smaller r costs extra iterations. It
        does not state the factor 1.15 on this curve. KR-RHO-13bf67
        keeps the generic floor at exponent 1/2. Random-mapping
        constants beyond that row were not opened in this session.
      validation_plan: >-
        Run the 20 scalars at r=4 and at r=16 with a 5000-step cap.
        Compare the ratio of means with 1.15, and compare the repeated
        r=16 sum with the first. An unfound scalar is not a ratio.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Both walks are rho. A factor 1.15 is a
      constant on one toy group. This idea does not beat the generic
      floor.
    memory_exponent: >-
      Unchanged. Each walk stores the current point and r addends.
    best_known: >-
      Teske r-adding walks, KR-RHO-cd86f5, together with the generic
      floor KR-RHO-13bf67 and the automorphism constant KR-RHO-0528e7,
      which this curve does not use beyond negation. This idea does
      not beat those constants.
    hidden_overhead: >-
      No o(1) term is claimed. The number 1.15 is an explicit
      threshold, not a hidden cofactor.
    tradeoff_note: >-
      The walks are memoryless aside from the r addends. They do not
      interpolate toward a BSGS table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
  citations:
    - ref: ledger/questions/RQ-EWALK-8fa147.yaml
      provenance: internal
      claim: >-
        The question asks whether any endomorphism or automorphism
        walk exceeds the sqrt(|Aut|) ceiling. This idea does not use
        an automorphism quotient. It asks whether a smaller adding
        set costs a pinned factor.
      verified_by: ledger/questions/RQ-EWALK-8fa147.yaml
    - ref: KR-RHO-cd86f5
      provenance: internal
      claim: >-
        r-adding walks with r about 16 to 20 behave close to a random
        mapping, and smaller r costs extra iterations.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-cd86f5.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs Omega(sqrt(N)) group operations in
        a prime-order group.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m discounts iterations by about
        sqrt(m). This curve is not claimed to have m greater than 2.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-cd86f5
      - KR-RHO-13bf67
      - KR-RHO-0528e7
    nearest:
      - ref: KR-RHO-cd86f5
        provenance: internal
        relation: adjacent
        delta: >-
          That row says smaller r costs extra iterations and does not
          name a factor. This idea requires the r=4 mean to be at
          least 1.15 times the r=16 mean on 20 scalars in a group of
          order 101. The separator is that factor 1.15. The exponent
          movement is 0.
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: orthogonal
        delta: >-
          That row prices sqrt(|Aut|). This walk does not canonicalise
          an orbit. A cycle-length count is a different claim.
  dominated_by: >-
    Teske's r-adding walk at r about 16 to 20 is already the measured
    practice on KR-RHO-cd86f5, and rho already meets the generic floor
    up to a constant on KR-RHO-13bf67. A factor 1.15 on one toy group
    does not beat either baseline in time, memory, or queries.
  sota_delta: >-
    The quantitative separator is a step-count ratio of 1.15 against
    a repeated-walk ratio of 1, on a group of order 101. The distance
    to a sub-square-root algorithm is the full exponent 1/2, and this
    idea moves that exponent by 0.
