  heuristic_assumptions:
    - id: H1
      statement: >-
        A t-point summation-polynomial / Gaudry-Diem index calculus uses a factor
        base of dimension l ~ m/t, with the productive regime t in 2..6 for
        Gaudry-Diem / FGHR symmetrised Groebner and t in 7..12 for Semaev 2015; the
        IC-natural dimension for a given t is (m-1)/t up to the band width.
      rigorous_support: >-
        The Gaudry-Diem relation-yield balance: a t-point decomposition of a random
        target succeeds with probability ~ |B|^t / (t! . #E) = 2^{t l - m} / t!, which
        must exceed |B|^{-1} for relations to accumulate, pinning l near m/t. Semaev
        2015's m* column (EXP-SEMBIN-992e73) sits at t in 7..12; classical
        Gaudry-Diem/FGHR at t in 2..6.
      validation_plan: >-
        At m = 7..17 tabulate the yield 2^{t l - m}/t! versus l for each t and confirm
        the productive l tracks (m-1)/t across t = 2..6 and 7..12; check the tails
        where l leaves the band and the yield collapses. Counting form needs no
        solver.
    - id: H2
      statement: >-
        The dimension-ord Frobenius-stable subspace is a single p_j-primary component
        of R_m = F_2[T]/(T^m - 1), isomorphic to F_(2^{ord}) as an F_2[sigma]-module,
        with membership x in V iff p_j(sigma) x = 0 -- an F_2-linear predicate of ord
        equations.
      rigorous_support: >-
        T^m - 1 squarefree (m odd) gives R_m = product of F_2[T]/(factor) by CRT; the
        minimal ideal for factor p_j is that field component, and its elements are
