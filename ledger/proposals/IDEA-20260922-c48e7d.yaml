  assumptions:
    - >-
      m is an odd prime (all five FIPS binary degrees are). The IFF and the
      single-factor / CRT module structure are the prime-m case.
    - >-
      "IC-natural dimension for t-point decomposition" means l ~ m/t, so the
      single-factor stable dimension ord_m(2) = (m-1)/k realises t = k. A method
      wanting a different l reads the table at a different band.
    - >-
      Gaudry-Diem / FGHR operate at small t (2..6); Semaev 2015 at t in 7..12. Both
      regimes are in scope; the correction is precisely that the claim must name
      which.
    - >-
      Saving B (the m-fold factor-base symmetry) requires a Frobenius-stable
      subspace factor base, whose membership is the linear kernel test p_j(sigma)x=0.
      The claim is about subspace factor bases, the only shape with cheap linear
      membership at prime m.

  proof_search_map:
    bottleneck: >-
      Whether the Koblitz index-calculus saving can be instantiated at a given FIPS
      degree reduces to whether a Frobenius-stable subspace exists at the
      decomposition size t the attack uses -- which, by the IFF, is whether Phi_m
      has exactly t factors. The superseded record answered this at one band; the
      bottleneck removed here is answering it across the whole t range the method
      family spans, before any solver.
    baseline_embedding:
      parameter_slice: >-
        IDEA-20260918-9abf42's table at m = 131 (k = 1, poor) and the Semaev-band
        reading of the superseded record (only m = 233 in band). The corrected table
        must reproduce those as the t in 7..12 slice and extend to t in 2..6.
      reproduction_check: >-
        ARITHMETIC, ZERO COMPUTE. Recompute ord_m(2) = 162, 29, 94, 204, 114 and
        k = (m-1)/ord = 1, 8, 3, 2, 5; form subset sums; filter into [m/6,m/2] and
        [m/12,m/7]. The both-regime table in (B) must result. A reviewer redoes
        m = 283 (k = 3) and m = 571 (k = 5) as the informative small-t rows.
    observation_collision:
      observable: >-
        (Phi-factor count k; the set of IC-natural t = k' for which a single-factor
        stable dimension (m-1)/k' lands in an l-band) at each FIPS degree.
      distinct_preimage_search: >-
        Degrees with the same k share the observable (163 and 131 both k = 1, both
        with no IC-natural stable dimension). The dangerous preimage would be a
        stable dimension that is also a subfield; at prime m there are none, so a
        single-factor stable subspace is a field-like object WITHOUT being a
        subfield of F_(2^m) -- it is a copy of F_(2^{ord}) embedded F_2-linearly but
        not as a subfield. That distinction is the membership answer in E.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Lift the useful band from the single Semaev slice (t in 7..12) to the full
          decomposition range t in 2..12, and read the IFF across it.
        predicted_gain: >-
          Recovers the three small-t coincidences the superseded band hid and states
          the saving as the conditional it is.
      - transform: representation_reduction
        proposed_object: >-
          Identify the dimension-ord stable V as the p_j-primary component
          (field F_(2^{ord})) with the linear membership test p_j(sigma) x = 0.
        predicted_gain: >-
          Settles the KN-OPEN-020 class as implicit-membership-cheap (linear), so the
          small-t cases are priced on size and decomposition cost, not membership.
    quantifier_order: >-
      FORALL FIPS degrees m and FORALL t: a single-factor Frobenius-stable subspace
      of dimension (m-1)/t exists IFF Phi_m has exactly t irreducible factors. Hence
      EXISTS t (= k) for each of m = 233, 283, 409, 571 at which Saving B is
      instantiable, and FORALL t no such subspace exists at m = 163 except the
      non-decomposition t = 1. The superseded record wrote "FORALL m in
      {163,283,409,571}, Saving B = 1" -- true only after restricting t to 7..12,
      which is the hidden quantifier this record exposes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "A Frobenius-stable subspace factor base of the IC-natural dimension (m-1)/t
        exists iff Phi_m has t irreducible factors; among FIPS degrees this happens
        at t = 8 (233), 3 (283), 2 (409), 5 (571) and never at 163; the stable V of
        dimension ord_m(2) is a field-like p_j-primary component with a linear
        membership test." Certifies NOTHING about whether any of these is an attack
        (priced in E as mostly negative), nothing about the solving stage
        (equivariance prior), and nothing about Saving A.
      nearby_object_control: >-
        PROVES-TOO-MUCH: if the argument were read as "Saving B never exists on FIPS
        Koblitz curves", it is FALSE at K-283/409/571 (small t) and must fail there
        loudly -- the very failure the superseded record suffered. Conversely, if
        read as "Saving B makes these curves attackable", it is false because the
        binding decomposition cost (EXP-SEMBIN margins +42 at 163, +22 at 233, +6 at
        283, -38/-99 at 409/571 all conditional) is untouched by Frobenius. NULL
        OBJECT: a size-matched non-stable subspace of the same dimension at each t,
        against which any solving-stage difference must vanish (equivariance).
    proof_obligations:
      - claim: >-
          ord_m(2) = 162,29,94,204,114 and k = 1,8,3,2,5 at m = 163,233,283,409,571.
        responsibility: correctness
      - claim: >-
          Single-factor stable dimension = ord_m(2) = (m-1)/k, existing at IC-natural
          l iff k = t.
        responsibility: correctness
      - claim: >-
          The dimension-ord stable V is a single p_j-primary component (field
          F_(2^{ord})), with linear membership p_j(sigma) x = 0.
        responsibility: interface
      - claim: >-
          Factor-base sizes 2^{204}, 2^{94}, 2^{114}, 2^{29} at t = 2,3,5,8 and their
          linear-algebra costs against rho (priced in E).
        responsibility: size
      - claim: >-
          Saving B never reaches the solving stage (equivariance prior); the binding
          cost is decomposition, untouched by Frobenius.
        responsibility: success_probability
      - claim: >-
          Saving A and Saving B are distinct and not multiplied.
        responsibility: scope

