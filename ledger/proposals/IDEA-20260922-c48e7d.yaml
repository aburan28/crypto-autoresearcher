  question_id: RQ-NISTBIN-06157b
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  supersedes: IDEA-20260922-40003d
  why_superseded: >-
    IDEA-20260922-40003d asserted "the index-calculus Frobenius saving is exactly 1
    on four of five NIST Koblitz curves" as a UNIVERSAL, but its "useful band"
    silently fixed t in 7..12 (Semaev 2015's regime). The Coordinator check
    (2026-09-22, ord_m(2) table reproduced exactly) showed the claim is true for
    t in 7..12 and FALSE for the small-t regime t in {2,3,5} that Gaudry-Diem and
    FGHR-style symmetrised Groebner actually use: a Frobenius-stable V of dimension
    exactly (m-1)/t exists iff Phi_m has exactly t irreducible factors over F_2, and
    K-283, K-409, K-571 are precisely the cases t = 3, 2, 5. This record restates
    the claim as the conditional it is, with the exact table across BOTH regimes,
    the iff-characterisation, the three small-t coincidences named, the
    factor-base-size pricing, and the membership-cost (module-structure) answer.
  title: >-
    THE INDEX-CALCULUS FROBENIUS SAVING ON THE NIST KOBLITZ CURVES IS REGIME-
    DEPENDENT, AND EXACTLY ONE CURVE IS CLEAN IN BOTH REGIMES: for prime m,
    Phi_m splits over F_2 into (m-1)/ord_m(2) irreducibles of degree ord_m(2), so a
    Frobenius-stable F_2-subspace of dimension exactly (m-1)/t exists at an
    IC-natural dimension IFF Phi_m has exactly t irreducible factors. Across the
    FIPS degrees the factor counts are 1, 8, 3, 2, 5 at m = 163, 233, 283, 409, 571
    -- so K-283 (t = 3), K-409 (t = 2), K-571 (t = 5) each DO carry a stable factor
    base at their small-t Gaudry-Diem dimension (m-1)/t, K-233 carries one at the
    Semaev dimension 29 (t = 8) AND at small-t dimensions, and ONLY K-163 (Phi_163
    irreducible) has no stable V at any IC-natural dimension in either regime. But
    the small-t stable dimensions are (m-1)/t in {m/2, m/3, m/5}, giving factor
    bases of 2^204, 2^94, 2^114; at t = 2 that equals rho outright, and at every
    degree the binding cost is the decomposition/solving stage that Frobenius does
    not touch (the equivariance prior of IDEA-20260906-a77711). So the honest claim
    is: Saving B is the trivial up-to-m-fold factor-base symmetry, present at small
    t on 233/283/409/571 and absent only on 163, never the binding cost and never
    reaching the solving stage; and the membership predicate stays F_2-LINEAR (a
    single-irreducible-factor kernel, field-like), so the small-t cases do not
    escape into high-degree membership -- they die on factor-base SIZE and
    decomposition cost instead.
  class: mechanism

  mechanism: >-
    OBJECT FRAME. Representation: x(P) in F_(2^m) in a fixed F_2-basis, factor base
    B_V = {P : x(P) in V}, V an F_2-subspace of dimension l -- the Weil-restriction
    membership representation, R3 of RQ-ECDLP-623a32. Operation set Sigma: the
    2-power Frobenius sigma composed with the partial translation action of index
    calculus (Class I). Tracked object: the Frobenius orbit of a factor-base point.
    TRICHOTOMY PLACEMENT: BRANCHING (unchanged from the superseded record) -- Sigma
    adds the automorphism sigma to the partial translation action and is not in the
    partial-action closure (KN-FIND-ffe1df Theorem C).
    LOSSY-PROJECTION TEST against Sigma: projection (P) -> (Frobenius orbit as an
    unordered set), lossy and sigma-propagating IFF sigma(B_V) = B_V, i.e. V
    Frobenius-stable. Same test as the superseded record; what changed is WHICH
    dimensions admit a stable V, once t is allowed to range over the small-t regime.
    THE CORRECTION, STATED AS THE MECHANISM. IDEA-20260918-9abf42's correspondence
    (stable subspaces <-> monic divisors of T^m - 1) gives, for m prime,
    T^m - 1 = (T - 1) . Phi_m with Phi_m = product of k = (m-1)/ord_m(2) distinct
    irreducibles of degree ord_m(2). A stable subspace has dimension = a subset sum
    of the factor degrees {1, ord, ..., ord} (k copies). The SINGLE-FACTOR stable
    dimension is exactly ord_m(2) = (m-1)/k. Therefore a stable V of dimension
    exactly (m-1)/t -- the IC-natural factor-base dimension for a t-point
    decomposition -- exists as a single-factor kernel IFF k = t, i.e. IFF Phi_m has
    exactly t irreducible factors. The superseded record read the table only at the
    Semaev band t in 7..12, where among the FIPS degrees only m = 233 (k = 8) has a
    factor count in range; it missed that K-283 (k = 3), K-409 (k = 2) and K-571
    (k = 5) hit the IFF at the small t that Gaudry-Diem / FGHR actually run.
    FACTOR-BASE ESCAPE (KN-OPEN-020), CORRECTED. The stable V of dimension ord_m(2)
    is the p_j-primary component of R_m = F_2[T]/(T^m - 1) for one irreducible
    factor p_j -- by CRT a copy of the FIELD F_(2^{ord}), a simple F_2[sigma]-module
    (NOT a direct sum). Membership x in V is the F_2-LINEAR test p_j(sigma) . x = 0,
    cost O(ord . m) bit-operations: the implicit-membership-CHEAP class, a linear
    predicate. Larger stable dimensions (2 ord, 3 ord, ...) are direct sums of
    minimal ideals (products of factors), still with a linear kernel-membership
    test. So the small-t stable bases do NOT land in the high-degree membership
    class; the superseded record's implicit suggestion that Saving B fails for lack
    of cheap membership is WITHDRAWN. They fail, where they fail, on factor-base
    SIZE and on the decomposition-stage cost, priced below.
    TWO SAVINGS, TWO MEASUREMENTS (binding, corrected). Saving A (rho sqrt(m)),
    present on all five K-curves, charged as the baseline. Saving B (the up-to-m-fold
    Frobenius factor-base symmetry): PRESENT at small t on K-233/283/409/571, ABSENT
    at every IC-natural dimension only on K-163. Saving B is a linear-algebra /
    relation-count factor, never the binding cost and never a solving-stage change
    (equivariance prior). The two are never multiplied into one factor.

  claim: >-
    (A) THE IFF. For m an odd prime, a Frobenius-stable F_2-subspace of F_(2^m) of
    dimension exactly (m-1)/t, equal to a single-irreducible-factor kernel, exists
    IFF Phi_m has exactly t irreducible factors over F_2, i.e. IFF ord_m(2) =
    (m-1)/t. (Verified this session by ord_m(2) and factorisation counts.)
    (B) THE BOTH-REGIME TABLE at the FIPS degrees (exact, this session).
      m = 163: ord = 162, k = 1 factor. Stable dims {0,1,162,163}. Small-t band
        [m/6,m/2] = [27,82]: NONE. Semaev band [m/12,m/7] = [14,23]: NONE.
        --> no stable V at any IC-natural dimension in EITHER regime (Phi_163 is
        irreducible; the only t it could realise is t = 1, which is not a
        decomposition).
      m = 233: ord = 29, k = 8. Stable dims 0,1,29,30,58,59,87,88,116,117,...
        Small-t band [39,116]: 58 (t = 4), 59, 87, 88, 116 (t = 2). Semaev band
        [19,33]: 29 (t = 8), 30. --> stable V in BOTH regimes; the smallest is
        dim 29, a genuinely IC-useful factor base.
      m = 283: ord = 94, k = 3. Stable dims {0,1,94,95,188,189,282,283}.
        Small-t band [47,142]: 94 (t = 3), 95. Semaev band [24,40]: NONE.
        --> stable V only at t = 3 (l = 94 = (m-1)/3).
      m = 409: ord = 204, k = 2. Stable dims {0,1,204,205,408,409}.
        Small-t band [68,204]: 204 (t = 2). Semaev band [34,58]: NONE.
        --> stable V only at t = 2 (l = 204 = (m-1)/2).
      m = 571: ord = 114, k = 5. Stable dims {0,1,114,115,228,229,...}.
        Small-t band [95,286]: 114 (t = 5), 115, 228, 229. Semaev band [48,82]:
        NONE. --> stable V at t = 5 (l = 114 = (m-1)/5), plus the two-factor sum
        228 = 2 . 114.
    (C) THE THREE SMALL-t COINCIDENCES, NAMED. K-283 <-> t = 3, K-409 <-> t = 2,
    K-571 <-> t = 5, each because Phi_m has exactly that many factors. These are the
    Gaudry-Diem / FGHR decomposition sizes, NOT the Semaev band 7..12, which is why
    the superseded universal missed them. K-233 additionally realises the Semaev
    band (t = 8, dim 29). K-163 realises none.
    (D) SO THE SAVING-B STATEMENT, CORRECTED. Saving B (the up-to-m-fold Frobenius
    factor-base symmetry) is present at an IC-natural dimension on K-233, K-283,
    K-409, K-571 (each at the t equal to its Phi-factor count) and ABSENT at every
    IC-natural dimension only on K-163. It is NOT "exactly 1 on four of five". What
    IS true on all five: Saving B is a linear-algebra / relation-count factor, it
    never touches the binding decomposition/solving cost, and (equivariance prior)
    it never reaches the solving stage. The clean universal is negative and lives
    only at K-163; elsewhere the saving exists but is subordinate and mostly moot
    (pricing in E/F).

