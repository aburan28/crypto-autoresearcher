      universal -- the exact defect of the superseded record. The remedy is the
      both-band report.
    - >-
      Reading Saving B's presence at small t as an attack. The binding cost is
      decomposition; Frobenius does not touch it. See pricing (E) for why none of
      t = 2,3,5 is an attack shape.
    - >-
      Confusing the field-like stable V (a copy of F_(2^{ord}) embedded F_2-linearly)
      with a genuine subfield of F_(2^m). At prime m there are no subfields; the
      stable V is field-like as an F_2[sigma]-module only.
    - >-
