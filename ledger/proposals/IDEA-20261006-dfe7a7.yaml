    best_known: >-
      Pollard rho, time about 2^{n/2} group operations on E(F_{2^n}),
      memory negligible, as the comparison target named in KN-LIT-fa346d.
    hidden_overhead: >-
      No o(1) term is estimated. The count is a single cell of constant size.
    tradeoff_note: >-
      No time-memory tradeoff is claimed. Output is three densities.
