idea:
  id: IDEA-20261006-dfe7a7
  question_id: RQ-SEMBIN-fa2e3f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Degree-at-most-2 generator density for polynomial-basis V versus one
    random 3-plane, at n=7
  class: measurement
  claim: >-
    R1 boolean coordinates of Weil-descended x-coordinates; the attack
    stage is the input sparsity of the summation system, and no solving
    exponent is claimed. Let E be Y^2 + XY = X^3 + 1 over F_{2^7}. Let
    m=3, t=2, k=ceil(7/3)=3. Let V_poly be the F_2-span of {1, z, z^2}
    in a fixed polynomial basis of F_{2^7}, and let V_rand be one
    3-dimensional subspace drawn from a fixed public seed. Let d(V) be
    the number of nonzero coefficients of total degree at most 2 in the
    boolean generators of the descended summation system for that factor
    base, divided by the number of boolean monomials of degree at most 2
    in the indeterminates that appear. The claim is d(V_poly) + 0.05 <=
    d(V_rand). A pass is a density gap at this single cell. It does not
    establish Assumption 1, a memory crossover, or a break of any FIPS
    curve.
  mechanism: >-
    OBJECT FRAME. Representation of the point: R1, each factor-base
    x-coordinate written in boolean coordinates after Weil descent to
    F_2. Operation set Sigma: the Frobenius x |-> x^2 on F_{2^7}, acting
    as a permutation of a normal-basis labelling of those coordinates.
    Sigma does not contain translation on E. F2, factor-base
    decomposition, is a named component: the generators are the descended
    summation relations. The quantity added is the degree-at-most-2
    density gap between V_poly and one seeded V_rand at n=7, a cell
    smaller than the published table range named in the question.
    TRICHOTOMY. Coordinate-dependent. Reason: d(V) is a function of which
    boolean indeterminates the encoding keeps, not of a group element.
    A GL(v, F_2) rewriting can change the generator support while
    preserving the F_2-dimension of V.
    LOSSY-PROJECTION TEST. From the full list of generator coefficients,
    discard every coefficient of degree greater than 2 and discard the
    point that the relation would have decomposed, and retain the density
    of the remaining nonzeros. The discard is compatible with Sigma
    because Frobenius permutes a normal basis and preserves both the set
    of degrees and the zero/nonzero pattern up to that permutation. The
    projection is lossy: many generator lists share one density, and the
    boolean chart has already discarded y and the discrete log.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-fa346d
      provenance: internal
      claim: >-
        Assumption 1 is stated there as d_F4 <= 4 on the diagonal
        k=ceil(n/m), with first-fall degree proved equal to 4 and
        d_F4 <= d_ff the extra step. The same note records a wall-time
        and memory gap at n=17, m=t=3, k=6 between a low-degree
        polynomial V and a random subspace, and states that Table 3's
        asymptotic comparison omits memory.
      verified_by: idea-generator, knowledge/literature/KN-LIT-fa346d.md
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        Prime-field solving-degree growth is open. This cell is binary
        and does not measure d_F4, so it does not close that problem.
      verified_by: idea-generator, knowledge/open-problems/KN-OPEN-002.md
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        The row records that choosing an F_2-subspace V with small
        product-space dimension lowers degree and variable count after
        Weil descent. This idea does not claim that lowering.
      verified_by: idea-generator, knowledge/frontiers/ecdlp/index-calculus/KR-IC-73db3f.yaml
    - ref: "iacr:2015/310"
      provenance: recalled
      claim: >-
        Pointer only, already frozen in-repo according to KN-LIT-fa346d.
        This session read the knowledge note, not the eprint file.
  assumptions:
    - >-
      F2 is a component. No relation is collected and no Gröbner basis
      is run.
    - >-
      k=3 is the diagonal value ceil(n/m) at this cell. The comparison
      does not leave that diagonal.
    - >-
      If either system has no degree-at-most-2 monomials in its
      indeterminates, d(V) is undefined and the cell is inconclusive.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: >-
        The degree-at-most-2 nonzero density of the descended generators.
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
    not_applicable_reason: >-
      This is a sparsity count at one boolean cell, not a proof of
      Assumption 1 or of a complexity bound. The strongest certified
      output is the sign of d(V_rand) - d(V_poly) at n=7 for the declared
      seed. A nearby object on which a "polynomial bases are always
      sparser" reading is already false would be any seed whose random
      plane meets or beats V_poly; that seed falsifies the claim.
  predictions:
    - metric: d(V_rand) - d(V_poly)
      direction: higher
      minimum_effect: >-
        Absolute density gap at least 0.05, with d(V_poly) the smaller value.
  minimal_test:
    design: >-
      Build the boolean generators for V_poly and for V_rand at
      (n,m,t,k)=(7,3,2,3) on Y^2+XY=X^3+1 over F_{2^7}. Count nonzeros
      and monomials of degree at most 2. Do not run F4.
    controls:
      - >-
        Two further seeds for V_rand. The claim is about the first seed.
        The extra seeds are a stability check, reported separately.
      - >-
        The zero subspace is not a control. A second polynomial subspace,
        the span of {z^4, z^5, z^6} in the same basis, is the shifted
        polynomial control and is reported separately.
      - >-
        Identical V must give density gap 0. That is the instrument zero.
    required_metrics:
      - indeterminate count for each V
      - nonzero count and monomial count of degree at most 2
      - d(V_poly), d(V_rand), and their difference
  falsification_conditions:
    - >-
      d(V_rand) - d(V_poly) < 0.05. The polynomial basis is then not
      sparser by the declared margin at this cell and this seed. That
      negative closes only (n,m,t,k)=(7,3,2,3), this curve, and this seed.
    - >-
      The instrument zero on identical V is nonzero. The run is an
      instrument failure, not a density result.
  confounders:
    - >-
      A different boolean encoding, or a different elimination order
      before the count, changes which coefficients are visible.
    - >-
      One random plane can be atypically sparse. The extra seeds detect
      that; they are not pooled into the claim.
    - >-
      Degree greater than 2 is discarded, so a gap that lives only in
      higher degree is invisible.
  interpretation_limits:
    - >-
      Exponent delta 0 against Pollard rho's square-root time and against
      the note's 2^{c sqrt(n ln n)} time with c about 1.6986.
    - >-
      n=7 is below the question's published-cell list, which starts at
      n=12. This cell does not reproduce Table 1.
    - >-
      A density gap is not a d_F4 measurement and does not touch the FIPS
      conclusion.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Conditional on the summation relation being modelled as a symmetric
        random map, as KN-LIT-fa346d restates from the paper's Section 4.3,
        a uniform random 3-dimensional V and the polynomial span
        {1,z,z^2} have the same expected degree-at-most-2 generator density
        except for a nonnegative gap coming from linearised relations in
        the polynomial span. The claimed gap at this cell is at least 0.05.
      rigorous_support: >-
        KN-LIT-fa346d records the random-map success model and records an
        empirical wall-time gap for polynomial V versus random V at a
        larger cell. It does not prove a density gap. KR-IC-73db3f records
        that small product-space dimension can lower descended degree; that
        is a degree statement, used here only as the neighbouring baseline.
      validation_plan: >-
        Compute the three densities (polynomial span, first seed, two
        further seeds) exhaustively at n=7. Compare each random density
        with d(V_poly). If any extra seed reverses the sign, H1's uniform
        gap fails at n=7. No transfer to n>=12.
  target_complexity:
    time_exponent: >-
      Exponent delta 0. Baselines not beaten: Pollard rho at exponent 1/2,
      and the paper's c*sqrt(n ln n) time with c about 1.6986 as restated
      in KN-LIT-fa346d.
    memory_exponent: >-
      Exponent delta 0. The note already records stage-2 storage
      Theta(2^k) against rho's negligible memory; this count does not
