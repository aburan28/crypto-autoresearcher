idea:
  id: IDEA-20260828-b39886
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-28'
  title: >-
    THE MATCHED-ORDER FAMILY'S (a,b)-REPRESENTATIVE-SELECTION PROCEDURE MAY
    ITSELF CORRELATE WITH |D_0|, AND H-JINV-5a0b9e DOES NOT AUDIT IT: before
    the pending Stage 1/2 run reports a |D_0| trend in decomposition_rate,
    verify whether the harness's deterministic curve-construction algorithm
    (Cornacchia-derived, per the D_0 = -3 sextic-twist and O-module records)
    systematically produces SMALLER-height (a,b) coefficients for smaller
    |D_0|, which would let IDEA-20260828-2b2bb2's height axis masquerade as an
    endomorphism-norm effect inside the campaign's own flagship instrument.
  class: control

  claim: >-
    (A) THE GAP. H-JINV-5a0b9e's own proof_search_map names four distinct
    preimages for a |D_0| trend in decomposition_rate: (i) a genuine
    endomorphism-norm effect, (ii) a residual p covariate, (iii) an
    r-composition difference, (iv) a factor-base-construction artifact. It
    does NOT name a fifth: (v) the (a,b) REPRESENTATIVE chosen by the harness
    to instantiate each isomorphism class systematically differing in HEIGHT
    (max(|a|,|b|) or the naive height H(a,b)) as a function of |D_0|, because
    of how the curve-construction algorithm actually works. This gap exists
    because IDEA-20260828-2b2bb2 (this session, the same batch) is the first
    record in this lane to name curve-equation HEIGHT as an axis at all; it
    was structurally invisible to write before that idea existed.
    (B) WHY THIS IS A PLAUSIBLE, NOT A SPECULATIVE, CONFOUND. The campaign's
    own IDEA-20260807-778375 documents that for small |D_0| the curve
    construction goes THROUGH Cornacchia's algorithm (4p = t^2 + |D_0| f^2,
    an explicit small-coefficient decomposition), and for D_0 = -3 the
    canonical construction is LITERALLY a = 0 (the smallest possible height in
    one coordinate, by definition of j=0). If the harness's curve-selection
    step for OTHER small-|D_0| classes in the 51-class family also tends,
    for similar algorithmic reasons, toward smaller |a|,|b| than a
    "generic-D_0" class would get under the SAME construction procedure, then
    H-JINV-5a0b9e's P2 (decomposition_rate vs |D_0|) is measuring a MIXTURE of
    the endomorphism-norm effect it intends and IDEA-20260828-2b2bb2's height
    axis, with no way to separate them post hoc. (H-null) The harness's
    representative-selection height is |D_0|-INDEPENDENT (verified directly:
    no significant correlation between log H(a,b) and |D_0| across the
    51-class family), so no confound exists and H-JINV-5a0b9e's P2 measurement
    is clean on this axis. (H-confound) Height and |D_0| ARE significantly
    correlated in the harness's actual output, in which case P2's result must
    be re-read as height-confounded until a height-controlled re-run (holding
    log H(a,b) fixed while |D_0| varies, via an alternate representative
    within each isomorphism class) is available. (C) NOT CLAIMED. This record
    does not claim the confound IS present -- it is a zero-hypothesis audit,
    genuinely two-sided, that must be run BEFORE (or alongside) H-JINV-5a0b9e's
    Stage 2, at near-zero marginal cost since the family construction is
    already Stage 1's deliverable.

  mechanism: >-
    This is a CONTROL/AUDIT record, not a mechanism record about curves; the
    "mechanism" here is the audit procedure. For each of the 51 conductor-1
    classes in the N=19507 family (or whichever matched-order family
    H-JINV-5a0b9e's Stage 1 actually certifies), record the (a,b)
    coefficients the harness selects to instantiate the crater representative
    and compute H(a,b) = max(4|a|^3, 27b^2) using the same calibrated naive
    height as IDEA-20260828-2b2bb2. Regress log H(a,b) on log|D_0| across the
    51 classes. If the harness's construction algorithm is, as
    IDEA-20260807-778375 documents, DERIVED from Cornacchia decompositions of
    small integers tied to D_0, there is a concrete, checkable reason to
    suspect a monotone relationship (smaller |D_0| -> smaller Cornacchia
    solutions -> plausibly smaller |a|,|b|) -- but this is an empirical
    question about ONE PARTICULAR HARNESS'S CODE PATH, not a mathematical
    fact about elliptic curves in general (a different curve-construction
    algorithm could easily avoid the correlation entirely, e.g. by
    post-processing every representative to a canonical minimal-height twist
    per the parametrisation IDEA-20260828-2b2bb2 cites from arXiv:2506.18874).
    THE LOSSY-PROJECTION FRAMING. The tracked object is the harness's
    SELECTION FUNCTION itself: (isomorphism class) -> (a,b) representative
    chosen. This is not a claim about curves; it is a claim about the
    INSTRUMENT, in the same sense DECOMPOSITION.md's L14 and this lane's own
    IDEA-20260807-a3d644 (cofactor-confound null battery) are instrument
    audits rather than curve-mechanism records. It costs essentially nothing
    because H-JINV-5a0b9e's Stage 1 already produces the family; this record
    only asks that the (a,b) values be logged and one regression run before
    P2 is trusted.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Read IDEA-20260807-a3d644 in full (the lane's existing matched-null
      battery, which audits the COFACTOR confound in the "matched p, matched
      N" comparison) and H-JINV-5a0b9e's proof_search_map
      observation_collision section (which names exactly four preimages for
      the P2 trend and does not include representative-selection height).
      Grepped all 49 JINV proposals for "representative", "selection",
      "height" (see IDEA-20260828-2b2bb2's novelty_screen for the same height
      grep) and "Cornacchia" (hits only IDEA-20260807-778375 and -45af43,
      neither of which audits the selection procedure for a height bias).
    results: >-
      -a3d644 audits the COFACTOR as a confound in the null construction,
      not the (a,b)-selection HEIGHT inside the matched-order family itself.
      H-JINV-5a0b9e's own proof_search_map lists four named preimages for its
      P2 trend and does not name representative height as a fifth, which is
      the gap this record fills. This gap could not have been named before
      this session, since IDEA-20260828-2b2bb2 (this batch) is the first
      record to operationalise curve-equation height as an axis in this lane
      at all.
    verdict: >-
      UNVERIFIED. Distinct target (an instrument-selection confound, not a
      curve mechanism), and structurally dependent on IDEA-20260828-2b2bb2
      existing first (it names the axis this control audits). No novelty
      claimed beyond "this specific gap in H-JINV-5a0b9e's own stated
      preimage list."

  citations:
    - ref: IDEA-20260807-778375
      provenance: recalled
      claim: >-
        Documents that small-|D_0| curve construction in this campaign goes
        through Cornacchia's algorithm (4p = t^2 + |D_0|f^2), an explicit
        small-integer decomposition, and that D_0=-3 construction is
        canonically a=0.
      verified_by: null
    - ref: H-JINV-5a0b9e
      provenance: internal
      claim: >-
        proof_search_map observation_collision names exactly four preimages
        for the P2 |D_0| trend: endomorphism norm, residual p, r-composition,
        factor-base construction. Representative-selection height is not
        among them.
      verified_by: read directly in this session.
    - ref: arXiv:2506.18874
      provenance: retrieved
      claim: naive height definition H(a,b)=max(4|a|^3,27b^2) and minimal-height twist representatives per j-invariant
      verified_by: WebFetch of the arXiv abstract page, 2026-08-28.

  assumptions:
    - >-
      H-JINV-5a0b9e's Stage 1 (family construction) is executed under its own
      authorization before or alongside this audit; this record adds a
      logging/regression step to that output and does not request separate
      curve construction.
    - >-
      The audit is run on WHATEVER representative the harness actually
      selects, not on a hypothetical minimal-height representative, so it
      tests the actual instrument as built.

  proof_search_map:
    bottleneck: >-
      Whether log H(a,b) correlates with log|D_0| across the 51-class family
      as the harness actually constructs it. This is the single quantity
      deciding whether H-JINV-5a0b9e's P2 result, whichever way it comes out,
      needs a height-controlled re-run before it can be attributed to the
      endomorphism-norm mechanism.
    baseline_embedding:
      parameter_slice: >-
        The 51 conductor-1 classes of the N=19507 family exactly as
        H-JINV-5a0b9e's Stage 1 certifies them; no new curves are constructed.
      reproduction_check: >-
        The logged (a,b) per class reproduces the class's declared t, p, D_0
        via the standard Weierstrass-to-trace identities, confirming the
        logging step did not itself introduce an error before the regression
        is trusted.
    observation_collision:
      observable: log H(a,b) of the harness-selected representative, per class.
      distinct_preimage_search: >-
        A collision to separate: a correlation could arise from (i) a genuine
        algorithmic tendency of Cornacchia-derived construction, or (ii) an
        accident of the specific 51-class sample (e.g. one or two classes with
        atypically large |D_0| happening to also get large-height
        representatives for unrelated reasons). Separated by reporting the
        regression's robustness to leave-one-out class removal.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          If H-confound is found, the successor representation is a
          CANONICAL MINIMAL-HEIGHT twist representative per class (using the
          parametrisation of arXiv:2506.18874), decoupling height from |D_0|
          by construction, so P2 can be re-run height-controlled.
        predicted_gain: >-
          Removes the confound at its source rather than requiring a
          statistical adjustment, mirroring how H-JINV-5a0b9e's own design
          removed the #E confound by construction (fixing N) rather than by
          matching.
    quantifier_order: >-
      FOR the 51-class family as actually constructed, EXISTS or does not
      exist a significant correlation between log H(a,b) and log|D_0|. This
      is a single regression, not a claim about curve construction in general.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this specific harness's output for this specific family, height and
        |D_0| are or are not correlated. It cannot certify anything about
        curve-construction algorithms in general, and a null result here does
        not certify that NO possible construction procedure could confound
        height with |D_0| -- only that this one, as built, does not.
      nearby_object_control: >-
        A hand-constructed ALTERNATE representative for a subset of the same
        classes (e.g. via a different, non-Cornacchia twist search), checked
        for whether it shows the same height-vs-|D_0| pattern; if the pattern
        disappears under a different construction, it is confirmed to be an
        artifact of THIS harness's algorithm, not a fact about the classes.
    proof_obligations:
      - claim: Logged (a,b) per class reproduces the class's declared t, p, D_0.
        responsibility: correctness
      - claim: No new curve construction is performed; only Stage 1's existing output is logged and regressed.
        responsibility: interface
      - claim: A null result here does not certify that no construction procedure could confound height and |D_0| in general.
        responsibility: scope

  predictions:
    - metric: Pearson/Spearman correlation of log H(a,b) and log|D_0| across the 51 conductor-1 classes
      direction: different
      minimum_effect: >-
        No pre-registered sign (this is a genuine two-sided audit of an
        instrument, not a mechanism test); ANY significant correlation
        (p<0.05 with leave-one-out robustness) is H-confound and blocks P2
        from being read as endomorphism-norm evidence until re-run
        height-controlled.
    - metric: leave-one-out robustness of the regression coefficient
      direction: different
      minimum_effect: >-
        A coefficient that flips sign or loses significance under leave-one-out
        is reported as fragile, not as H-null or H-confound cleanly.

  minimal_test:
    design: >-
      STAGE 0 (zero compute beyond logging): add (a,b) logging to
      H-JINV-5a0b9e's Stage 1 family-construction run, or extract it from an
      already-completed Stage 1 artifact if one exists. STAGE 1: compute
      H(a,b) per class and regress against log|D_0|. STAGE 2: leave-one-out
      robustness check. THE CHEAPEST KILL is STAGE 1 alone: a flat regression
      with no significant slope closes the audit immediately.
    controls:
      - leave-one-out robustness across the 51 classes
      - reproduction check: logged (a,b) reproduces declared t, p, D_0
      - alternate-construction nearby object, if H-confound is found (successor step, not required for the base audit)
    required_metrics:
      - H(a,b) per class
      - regression slope, p-value, leave-one-out range
      - reproduction-check pass/fail per class

  falsification_conditions:
    - >-
      F1. Logged (a,b) fails to reproduce declared t, p, D_0 for any class.
      Logging defect; audit invalid until repaired.
    - >-
      F2 (MAIN RESULT, EITHER DIRECTION). A flat regression (H-null): P2 is
      certified clean of this specific confound and H-JINV-5a0b9e's Stage 2
      may proceed reading its |D_0| trend, if any, without this fifth
      preimage in play. A significant, leave-one-out-robust correlation
      (H-confound): H-JINV-5a0b9e's P2 result, whichever way it comes out,
      CANNOT be attributed to the endomorphism-norm mechanism without a
      height-controlled re-run, and this record's successor (the canonical
      minimal-height twist re-representation) is named as mandatory before
      that attribution can be made.
    - >-
      F3. The correlation is significant but not leave-one-out robust
      (driven by 1-2 classes). Reported as fragile; recommends re-running with
      a larger family (a second matched N) rather than either closing or
      escalating on this evidence alone.

  confounders:
    - >-
      This audit itself is subject to the SAME |D_0|-vs-p residual covariate
      H-JINV-5a0b9e already discloses (p=N+t-1 varies across the family even
      though N is fixed); reported alongside |D_0| in the regression, exactly
      as H-JINV-5a0b9e's own P4 does for its functionals.
    - A small family (51 classes) limits the power of the leave-one-out check; disclosed, not smoothed over.

  interpretation_limits:
    - claim_tier toy; N=19507 toy group order; nothing here is cryptographic-scale.
    - >-
      This is an audit of ONE harness's construction procedure, not a
      mathematical fact about elliptic curves; a null result does not
      generalise to other curve-construction algorithms or other campaigns.
    - >-
      This record does not itself measure decomposition_rate or any L1
      functional; it is strictly upstream of H-JINV-5a0b9e's P2 and produces
      no independent claim about the endomorphism-norm mechanism either way.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The harness's (a,b)-representative-selection procedure for the
        matched-order family, absent a specific mechanism forcing otherwise,
        selects representatives whose height is |D_0|-independent.
      rigorous_support: >-
        No rigorous support is claimed; this is the DEFAULT hypothesis for an
        audit whose entire purpose is to check whether a documented
        algorithmic tendency (Cornacchia-derived construction, per
        IDEA-20260807-778375) actually produces the correlation a naive
        reading of that documentation might suggest.
      validation_plan: >-
        Direct regression on the actual harness output, per minimal_test
        above; this IS the validation, since the question is empirical and
        instrument-specific rather than a mathematical fact with an external
        distribution to compare against.

  target_complexity:
    time_exponent: not applicable; this is a control/audit record, not an attack or a complexity claim.
    memory_exponent: not applicable.
    best_known: >-
      Not applicable in the usual sense; provided for schema completeness:
      0.886*sqrt(N) parallel rho with DPs (KN-TECH-001, KN-TECH-006) remains
      the frontier this entire campaign is measured against.
    hidden_overhead: none; no asymptotic claim is made.
    tradeoff_note: not applicable; no attack constructed.

  dominated_by: n/a (no result claimed; this is a pre-registration audit gate, not an attack or a measurement of curve behaviour)
  sota_delta: >-
    ZERO on every axis; none sought. Value delta: closes a gap in
    H-JINV-5a0b9e's own stated proof_search_map (a fifth preimage for its P2
    trend that could not have been named before this session's
    IDEA-20260828-2b2bb2 introduced curve-equation height as an axis), at
    near-zero marginal cost against an experiment this campaign has already
    authorized and is about to run.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

