# IDEA-20261004-9aedd8
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-9aedd8
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 21 has degree 441 and multiplication by 20 has degree 400
  class: measurement
  claim: >-
    Multiplication by 21 has degree 441. Multiplication by 20 has
    degree 400. Four hundred forty-one exceeds four hundred by 41.
    The product of the two degrees is 176400. Their sum is 841. The
    gap is a map degree, not an ECDLP exponent and not the degree
    pair 400 and 361.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty-one squared is 441. Twenty squared is 400. Two maps
    of degree 400 have gap 0 and product 160000. No point is mapped.
  novelty_status: unverified
  citations:
