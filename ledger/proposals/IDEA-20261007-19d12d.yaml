idea:
  id: IDEA-20261007-19d12d
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The 29-division polynomial of y^2 = x^3 + 1 over F_29 has formal
    derivative zero.
  class: measurement
  claim: >-
    Let p = 29 and let E be y^2 = x^3 + 1 over F_29. Let psi_29 be
    the 29-division polynomial of E in F_29[x]. The claim is that the
    formal derivative psi_29' is the zero polynomial. This is one
    polynomial identity in characteristic 29. It does not evaluate a
    Frobenius map on points, it does not count codomain j-invariants,
    and the exponent delta against the opened path-finding cost is 0.
  mechanism: >-
    A nonzero derivative means psi_29 has a simple root in an
    extension, hence a separable point of order 29. The zero
    derivative means no such simple root is visible in F_29[x].
    KN-OPEN-013, opened, records the endomorphism-ring problem as
    open. This idea does not compute an endomorphism basis and does
    not apply Frobenius to a point. OBJECT FRAME. Representation:
    the division polynomial in F_29[x]. Operation set Sigma: formal
    differentiation. TRICHOTOMY: a polynomial predicate. LOSSY-
    PROJECTION TEST: the coefficients are discarded and only the
    bit "derivative is zero" is kept.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note reports no sub-p^{1/4} generic path-finding
        attack. This idea does not claim one and does not state a
        division-polynomial derivative at p = 29.
      verified_by: coordinator, this session, via knowledge/open-problems/KN-OPEN-013.md
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states path-finding costs. It does not state
        the derivative of a division polynomial.
      verified_by: coordinator, this session, via knowledge/techniques/KN-TECH-024.md
  assumptions:
    - p = 29 is prime. The test checks that.
    - The discriminant of x^3 + 1 is nonzero. If it vanishes, psi_29 is not defined.
    - psi_29 is the standard division polynomial whose roots are the x-coordinates of the nontrivial 29-torsion. A different normalization that multiplies by a nonzero constant does not change whether the derivative is zero.
  predictions:
    - metric: degree of the formal derivative psi_29'
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      Confirm p = 29 is prime and the discriminant of y^2 = x^3 + 1
      is nonzero. Compute psi_29 in F_29[x] and its formal derivative.
      Set d to the degree of that derivative, or -1 if the derivative
      is the zero polynomial. The claim is d = -1. Do not apply
      Frobenius to any point. Do not compute a j-invariant census.
    controls:
      - The discriminant is nonzero. Vanishing invalidates d.
      - psi_29 is nonzero and has degree (29^2 - 1) / 2 = 420. Any other degree invalidates d.
      - Multiplying psi_29 by a nonzero constant in F_29 leaves the zero-or-not status of the derivative unchanged.
      - The same derivative bit on the quadratic twist model y^2 = x^3 + c^3, for one nonzero c, is recorded and is not required to match.
    required_metrics:
      - discriminant_nonzero
      - psi_degree
      - derivative_degree
  falsification_conditions:
    - discriminant_nonzero is true, psi_degree is 420, and derivative_degree is at least 0.
    - The discriminant is zero, so the polynomial is not defined.
    - psi_degree is not 420, so the polynomial is the wrong one and the derivative is not accepted.
  confounders:
    - Reducing the derivative modulo a proper divisor of psi_29 can hide a nonzero derivative. The derivative is computed in F_29[x] before any gcd.
    - Testing a single root instead of the polynomial can miss other simple roots. The metric is the whole derivative.
  interpretation_limits:
    - One curve at p = 29. No transfer to another prime.
    - A zero derivative is a torsion statement at this prime. It is not an endomorphism-ring basis.
    - A nonzero derivative rejects the claim in this scope only.
    - Exponent delta against Õ(p^{1/4}) in the opened notes is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p = 29 only, psi_p for y^2 = x^3 + 1 is modeled as a
        polynomial whose formal derivative vanishes. The model is not
        a theorem in the opened notes. The sample is one curve. No
        transfer is claimed.
      rigorous_support: >-
        KN-OPEN-013, opened, does not state this derivative. The
        degree check (29^2 - 1) / 2 = 420 is the instrument. The
        vanishing is the prediction.
      validation_plan: >-
        Compute the derivative once. The checks are a nonzero
        discriminant, degree 420, and invariance under scaling by a
        nonzero constant. Sample size one has no tail. No second
        prime is drawn.
  target_complexity:
    time_exponent: >-
      One division polynomial of degree 420 over the fixed field
      F_29. Polynomial in that degree. No p^{1/4} path search is run.
    memory_exponent: >-
      One polynomial of degree 420 and its derivative. Memory is
      O(p^2) at p = 29.
    best_known: >-
      KN-LIT-078, opened note: Õ(p^{1/2}) full-graph meet-in-the-middle
      and Õ(p^{1/4}) on the F_p subgraph. Those algorithms are not run.
    hidden_overhead: >-
      No o(1) term. The prime, the curve, and the degree 420 are
      explicit. The output is one degree, or -1 for the zero polynomial.
    tradeoff_note: >-
      No time-memory tradeoff and no collision search. One polynomial.
  estimated_cost:
