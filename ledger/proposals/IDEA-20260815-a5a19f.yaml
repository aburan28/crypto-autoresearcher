idea:
  id: IDEA-20260815-a5a19f
  question_id: RQ-EQIC-8cb959
  added: '2026-08-15'
  title: >-
    TWO ATTACK SYSTEMS THAT ARE EQUIVALENT SHOULD NOT BE SCREENED TWICE:
    define a computable equivalence on this program's proposed ECDLP systems
    and quotient the corpus by it
  class: theory

  claim: >-
    The corpus contains hundreds of proposed mechanisms, many of which are
    the same construction in different notation -- exactly the variant
    regression docs/inventor-protocol.md section 1 warns about. A computable
    equivalence, applied mechanically, would show how many distinct
    constructions there actually are and would stop the program re-screening
    one idea under several names.

  mechanism: >-
    Define equivalence by a normal form on the proposed system: variable
    count, degree sequence, defining ideal up to the declared symmetry
    group, and the oracle set consumed. Compute the normal form for the
    proposed mechanisms and report the quotient's size against the nominal
    count.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'equivalence', 'duplicate' (2 novelty_status hits), 'normal
      form', 'variant regression'; read of IDEA-20260813-f2a6e7 on syzygy
      fingerprints for system equivalence.
    results: >-
      IDEA-20260813-f2a6e7 proposes syzygy fingerprints for attack-system
      equivalence, which is the closest neighbour and is a fingerprint
      rather than a normal form. The corpus-wide quotient has not been
      computed.
    verdict: >-
      ADAPTATION. Normal forms for polynomial systems are standard and one
      fingerprint approach is already proposed here; the contribution is
      applying an equivalence corpus-wide to count distinct constructions.

  object_first_candidate:
    tracked_object: >-
      THE NORMAL FORM of each proposed attack system, and the quotient it
      induces on the corpus.
    lossiness: >-
      A normal form deliberately discards notation and presentation, which
      is exactly what makes two records recognisable as one construction.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives for records whose proposed system is specified concretely;
      records proposing a direction rather than a system are outside the
      quotient and are counted separately.

  null_object_control: >-
    NULL 1 -- a record compared with itself, which must be equivalent. NULL
    2 -- two records known to be genuinely different constructions, which
    must not be; an equivalence collapsing them is too coarse and would
    understate the corpus's real breadth.

  discriminated_from:
    - >-
        IDEA-20260813-f2a6e7, which fingerprints systems for equivalence;
        a fingerprint gives probable equality and a normal form gives
        decidable equality, and this record should consume that one's
        fingerprints as a fast pre-filter.
    - >-
        The novelty screens each record performs individually, which check
        against the corpus by keyword; this checks by structure and would
        catch variants that arrive in new notation.

  assumptions:
    - >-
        Enough proposed mechanisms specify their system concretely for the
        quotient to be meaningful; those that do not are counted
        separately rather than forced in.
    - >-
        The normal form is computable at the sizes involved, which for
        small declared systems it should be.

  predictions:
    - metric: >-
        self-comparison null
      direction: different
      minimum_effect: >-
        FORCED equivalent.
    - metric: >-
        known-different-pair null
      direction: different
      minimum_effect: >-
        FORCED not equivalent; collapsing them means the equivalence is
        too coarse.
    - metric: >-
        quotient size against nominal record count
      direction: lower
      minimum_effect: >-
        The deliverable; a quotient far below the nominal count means
        the corpus's breadth is overstated.
    - metric: >-
        count of records proposing no concrete system
      direction: different
      minimum_effect: >-
        Reported separately; a large share bounds what the quotient can
        conclude.

  minimal_test:
    design: >-
      The equivalence applied to the subset of records with concretely
      specified systems, both nulls first.
    controls:
      - >-
          Self-comparison and known-different-pair nulls.
      - >-
          Fingerprint pre-filter before the full normal form.
      - >-
          Records without concrete systems counted separately, never
          forced into the quotient.
    required_metrics:
      - >-
          Normal form per record.
      - >-
          Quotient size against nominal count.
      - >-
          Count of records outside the quotient.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        The known-different pair collapses. The equivalence is too coarse
        and would understate corpus breadth.
    - >-
        Most records propose no concrete system. The quotient covers a
        small share and cannot describe the corpus.
    - >-
        The quotient is far below the nominal count. The program has been
        screening the same constructions repeatedly, which is the variant
        regression the inventor protocol warns about and is the record's
        payoff.
    - >-
        The quotient matches the nominal count. The corpus's breadth is
        real, which is a reassuring and useful confirmation.

  confounders:
    - >-
        EQUIVALENCE CALIBRATION: too coarse understates breadth and too
        fine finds nothing, and only the two nulls constrain the choice.
    - >-
        SPECIFICATION VARIANCE: records specify systems at wildly
        different precision, so a normal form may fail on vague records
        for reasons unrelated to their content.

  interpretation_limits:
    - >-
        Counts distinct constructions; makes no judgement about any
        construction's value.
    - >-
        Scoped to records with concretely specified systems.
    - >-
        Equivalence under this normal form does not mean two records are
        scientifically redundant, only that their systems coincide.

  heuristic_assumptions:
    - id: HEUR-EQIC-1
      statement: >-
        The declared normal form separates genuinely distinct attack
        constructions and identifies notational variants of one
        construction.
      rigorous_support: >-
        Rigorous ingredient: two systems with the same defining ideal up
        to the declared symmetry group and the same oracle set define
        the same computational problem, which is exact. THE GAP: two
        records can propose the same system while differing in what they
        measure on it, and the normal form would call those equivalent
        when they are not scientifically redundant at all.
      falsification_condition: >-
        Two records with identical normal forms whose research content
        is genuinely different.
      validation_plan: >-
        SAMPLE: all records with concrete systems. TAIL CHECK:
        equivalence classes with several members, reviewed individually
        to check whether the collapse is real. TRANSFER: none; the
        quotient describes this corpus.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is normal-form computation per record.
    memory_exponent: >-
      Negligible per system at declared sizes.
    best_known: >-
      No incumbent corpus-wide equivalence exists; per-record novelty
      screens are keyword-based and would miss notational variants.
    hidden_overhead: >-
      Records specifying systems vaguely are the bulk of the difficulty
      and may leave the quotient covering too small a share to conclude
      anything.
    tradeoff_note: >-
      A finer equivalence preserves breadth and finds fewer duplicates; a
      coarser one finds more and may erase real distinctions.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cryptanalysis: nothing. As a corpus-wide
    structural deduplication: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a computable normal form
    applied across the corpus's concretely specified attack systems, the
    resulting quotient size against the nominal record count, and an
    explicit count of records too vague to place in it.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.5 that enough records specify systems concretely for the quotient to
    cover a useful share, which is the binding uncertainty. 0.8 that both
    nulls calibrate the equivalence. 0.55 that the quotient falls materially
    below the nominal count, which would confirm the variant-regression
    worry with a number.

  status: proposed
  proposed_by: claude-code-session
