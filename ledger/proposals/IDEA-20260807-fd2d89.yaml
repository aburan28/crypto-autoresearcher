idea:
  id: IDEA-20260807-fd2d89
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-07'
  title: >-
    THE CANONICAL-HEIGHT ORACLE IS NON-SIMULABLE AND QUANTITATIVELY USELESS, AND
    CM MAKES IT WORSE RATHER THAN BETTER: any lift in which the height data
    depends on k must satisfy h(Q~) = k^2 * h(P~), so its coordinates carry about
    N^2 bits and writing it down already costs more than solving the instance;
    and the CM constraint that lane L9 hoped would bite instead FIXES the curve,
    removing exactly the freedom Xedni used to force small-height lifts, so the
    minimal height of a global point reducing to a specified P grows like
    N^{2/r} with a rank r one no longer gets to choose
  class: mechanism

  claim: >-
    (A) THE ORACLE. CHT(h) returns the canonical height h_hat(h~) of a lift h~ of
    the handle h to a curve of characteristic zero, or the height pairing
    <P~, Q~> of the lifted basis. Resource R6 (lifts to Z_p or to a number
    field). This is the oracle form of DECOMPOSITION lane L9 and of the Xedni
    family.

    (B) THE FIRST ADJUDICATION. NON-SIMULABLE, in the (N-weak) sense: the answer
    is a function of characteristic-zero data -- which lift was chosen -- and not
    of the linear form lambda. A generic simulator cannot produce it.

    (C) THE SECOND ADJUDICATION, WHICH IS THE ONE THAT DECIDES. SELF-COMPUTABLE:
    the adversary chooses the lift, so it holds the lifted coordinates, and the
    canonical height of a rational point is computable in polynomial time by
    standard archimedean-plus-non-archimedean decomposition. Verdict PUB, cell
    (b) of IDEA-20260807-5876b8. The oracle framing is empty and the real
    question is whether the LIFTING ALGORITHM helps.

    (D) THE QUANTITATIVE CLOSURE, AND IT IS A NUMBER RATHER THAN AN INTUITION.
    Split on whether the lift respects the relation.
      CASE 1 -- THE LIFT DOES NOT RESPECT Q = [k]P. Then P~ and Q~ are two points
        chosen by the adversary with no relation between them, so the height
        pairing <P~, Q~> is a function of the adversary's own choices and of the
        lifted curve. It is INDEPENDENT OF k: the same lift is available for
        every k, and resampling k with the curve, P, Q~ and the lift held fixed
        changes no height. So the height data carries exactly zero bits about k.
        This is the same obstruction IDEA-20260807-413fcc names, applied to a
        handle-taking oracle whose answer nonetheless factors through
        adversary-chosen data.
      CASE 2 -- THE LIFT RESPECTS Q = [k]P, i.e. Q~ = [k]P~ in the global
        Mordell-Weil group. Then the canonical height is a quadratic form, so
          h_hat(Q~) = k^2 * h_hat(P~).
        With k of size about N, and h_hat(P~) bounded below by a positive
        constant for a non-torsion point (Lang's conjecture direction aside, any
        specific non-torsion point has a specific positive height), h_hat(Q~) is
        about N^2. Canonical height is essentially the logarithm of the
        coordinate size, so Q~ has coordinates of about N^2 bits. WRITING THE
        WITNESS DOWN COSTS ABOUT N^2 BITS, WHICH EXCEEDS THE 0.886*sqrt(N) GROUP
        OPERATIONS OF RHO BY A FACTOR OF ABOUT N^{1.5}. The oracle is
        realizable only at a cost that is worse than the baseline by an exponent
        of 1.5, not by a constant.
      THERE IS NO CASE 3. Either the lift encodes the relation, and then it is
      astronomically large; or it does not, and then it says nothing about k.
      That dichotomy IS the Xedni failure mechanism (Jacobson-Koblitz-Silverman-
      Stein-Teske, relayed via KN-LIT-020/021 and DECOMPOSITION L9), restated as
      an oracle adjudication with the exponent written out.

    (E) THE CM SHARPENING, WHICH IS WHAT L9 ACTUALLY ASKED AND WHICH GOES THE
    WRONG WAY. DECOMPOSITION L9 asks whether "the CM structure of the canonical
    lift constrains the lifted points enough to make height/regulator arguments
    bite", and demands that any variant "state how CM changes that specific
    quantity". It changes it ADVERSELY, for a structural reason:
      Xedni's whole device is to choose the CURVE to fit the POINTS -- lift the
      points first with small coordinates, then solve for a curve through them.
      That works because the curve has free coefficients.
      A CM CONSTRAINT REMOVES EXACTLY THAT FREEDOM. Requiring the lifted curve to
      have CM by a specified order pins its j-invariant to a root of the Hilbert
      class polynomial H_D, so the curve is determined up to twist and one can no
      longer solve for it through chosen points.
      The consequence is a counting statement. On a fixed curve over a number
      field K of Mordell-Weil rank r, the number of points of canonical height at
      most B grows like B^{r/2}. To find a global point reducing to a SPECIFIED
      point of E(F_p) one must search a set of size at least about N, hence
        minimal height about N^{2/r}.
      Xedni buys a large effective r by moving the curve; CM forbids that, and CM
      curves over their natural fields of definition have small rank -- rank
      zero occurs, in which case NO non-torsion global point exists at all and
      the reduction map's image is finite, so P and Q are simply not reductions
      of anything.
      SO THE HONEST ANSWER TO L9 IS: CM does not make heights bite, it removes
      the only lever Xedni had. Filed here because it is an ORACLE adjudication
      with a named quantity, which is what the lane asked for.
      [The Mordell-Weil counting asymptotic and the rank behaviour of CM curves
      are RELAYED standard facts, NOT re-derived here; the Serre-Tate canonical
      lift is p-adic and carries no archimedean canonical height at all, which is
      an independent reason the "canonical lift" reading of L9 does not connect
      to a height argument. Both flagged.]

    (F) WHAT WOULD REFUTE IT. Exhibit a lifting construction, CM-constrained or
    not, producing a global point of canonical height o(N^2) that reduces to a
    specified Q with Q = [k]P respected. By (D) Case 2 that contradicts the
    quadraticity of the canonical height, so a refutation must be a refutation of
    the height being a quadratic form -- which it is -- or must be using a
    different height, and naming which height is then the whole content. That is
    a sharp and unusually well-posed falsification target.

  resource_label: >-
    R6 (lifts to Z_p or characteristic zero), with R3 (End as a ring) in the CM
    variant. CLAIMED AND GENUINE -- the oracle really does consume
    characteristic-zero data. VERDICT: the resource is consumed and is
    quantitatively insufficient, by an exponent of 1.5 in Case 2 and by zero
    information in Case 1.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE: the oracle's answer is not a function of the group-operation
    transcript, it does not merely apply an endomorphism to points of G, and it
    consumes resource R6, which DECOMPOSITION section 2 lists as escaping the
    generic model ("a different group"). The admissibility filter passes it. The
    closure here is therefore NOT a genericity closure -- it is a COST closure,
    which is a different and stronger kind, and the record is careful to say so:
    the lane dies on arithmetic, not on the GGM.

  discriminated_from:
    - >-
      IDEA-20260807-413fcc's zero-information class, which covers oracles taking
      NO handle. CHT takes a handle. Case 1 of (D) reaches a similar conclusion
      by a different route -- the answer factors through adversary-chosen lift
      data rather than through curve data -- and the routes must not be conflated
      because Case 2 has no analogue there.
    - >-
      DECOMPOSITION lane L9's own statement of the Xedni obstruction ("lifted
      points have height ~N"). This record sharpens the exponent: the relation-
      respecting lift has height about N^2, not about N, because the canonical
      height is QUADRATIC in the multiplier. If L9's N is the height of P~ and
      the N^2 here is the height of Q~ = [k]P~, the two are consistent and this
      record supplies the missing square; if L9 intended N as the height of the
      relation-respecting lift, one of the two is wrong and that is worth
      settling before either is cited.
    - >-
      KN-TECH-033's note that the p-adic route (Satoh-Araki) "is the one place
      where lifting to characteristic zero is known to pay". That is PC1 of
      IDEA-20260807-5ddd98 and it pays only at trace one, where the formal-group
      logarithm is globally defined on the subgroup. This record does not touch
      that case and explicitly excludes it: the trace-one lift is a positive
      control, not a counterexample, and the difference is the named coincidence.
    - >-
      IDEA-20260807-5876b8's cell (b). CHT lands there, but the interesting
      content is not the cell -- it is the exponent 1.5 gap in Case 2, which the
      cell label does not carry. This is a concrete instance of that record's own
      warning that a cell label is not a ranking.

  object_first_candidate:
    tracked_object: >-
      The canonical height h_hat of a lifted point, a non-negative real number,
      followed as the point moves under the group law in the global Mordell-Weil
      group.
    lossiness: >-
      LOSSY: an entire algebraic point over a number field -- coordinates,
      field of definition, everything -- is projected onto one real number.
      Infinitely many points share any height value.
    propagation: >-
      DETERMINISTIC AND QUADRATIC, and the quadraticity is the entire content of
      the closure: h_hat([n]R) = n^2 * h_hat(R), and h_hat extends to a positive
      semi-definite quadratic form with the height pairing as its polarization.
      This propagates perfectly under the global group law. IT DOES NOT
      PROPAGATE UNDER REDUCTION MOD p, which is the map the ECDLP actually lives
      on -- two global points with wildly different heights can have the same
      reduction, and a point of E(F_p) has no height at all. THE PROJECTION IS
      COMPATIBLE WITH THE WRONG OPERATION, which is the precise reason the object
      cannot be used: the inventor-protocol section 2 test asks that what is
      discarded be discarded compatibly with the TARGET's operations, and
      reduction mod p is a target operation the height does not survive.
    survival_score: >-
      Survives the global group law perfectly and forever -- and that is useless,
      because the attack needs to cross the reduction map, where it dies
      immediately. The one place it crosses successfully is the trace-one case,
      where the formal-group logarithm gives a global additive structure on the
      subgroup (KN-TECH-033); everywhere else the crossing is exactly what fails.
      The object therefore scores high on survival under the wrong operation and
      zero under the right one, which is the most instructive kind of failure
      this lane can record.

  mechanism: >-
    STEP 1 (zero compute) -- THE TWO ADJUDICATIONS: non-simulable (N-weak),
    self-computable, verdict PUB. Two paragraphs.

    STEP 2 (zero compute) -- THE CASE SPLIT of (D). Write out
    h_hat([k]P~) = k^2 h_hat(P~), substitute k about N, convert height to
    coordinate bit-length, and state the N^2 figure and the N^{1.5} ratio against
    0.886*sqrt(N). Then write the Case 1 independence argument. State that the
    split is exhaustive.

    STEP 3 (zero compute) -- THE CM SHARPENING of (E). State that CM pins the
    j-invariant to a root of H_D, so the curve cannot be solved for through
    chosen points; state the B^{r/2} counting asymptotic and the resulting
    N^{2/r} minimal height; note the rank-zero degenerate case where the
    reduction map's image is finite. Flag the two relayed facts.

    STEP 4 (toy compute, <= 30 minutes) -- THE MEASUREMENT, AND IT IS A REAL ONE
    RATHER THAN A CONFIRMATION OF ARITHMETIC. At small p (p <= 2^14, small enough
    that global point searches terminate):
      ARM 1, NON-CM: take an elliptic curve over Q of known rank r with good
        reduction at p; for a specified point R in E(F_p), search for the
        smallest-height rational point reducing to R; record that minimal height
        as a function of p and r.
      ARM 2, CM: the same measurement on a CM curve over Q (j = 0 and j = 1728
        are the accessible cases, with D_0 = -3 and -4) of known rank.
      ARM 3, NULL: resample the target R uniformly with the curve and the lift
        machinery held fixed; the minimal-height DISTRIBUTION must be unchanged,
        confirming the quantity depends on the curve and not on which point was
        asked for. This is the canonical artifact control and it is the same one
        DECOMPOSITION prescribes for lane L7.
      ARM 4, PLANTED: choose a rational point S of known small height, reduce it
        to get R = S mod p, and ask for the minimal-height lift of R. The
        procedure must find something of height at most h_hat(S). A search that
        misses a planted small-height lift is broken and every large-height
        result it produced is void.
    PREDICTION: minimal height grows like p^{2/r} in both arms, with the CM arm
    no better and typically worse because its r is smaller; and no arm produces a
    relation-respecting lift at any height, because Case 2's N^2 is unreachable
    even at p = 2^14 (N^2 about 2^28 in the height exponent, i.e. coordinates
    with tens of millions of digits).

    STEP 5 (zero compute) -- WRITE THE L9 ANSWER: CM removes Xedni's lever rather
    than supplying a new one; forward guidance is that the only lifting route
    known to pay is the trace-one formal-group logarithm, whose coincidence is
    named and is out of the target family.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      ripgrep via the harness Grep tool (semantics of `grep -ril`), 2026-08-07,
      over knowledge/, ledger/, docs/, analysis/. Patterns: "Xedni|canonical
      height|Mordell|lift|Silverman"; "Serre-Tate|canonical lift"; "Hilbert class
      polynomial"; "Oracle A|Oracle B|Oracle C|Oracle D".
    results: >-
      The Xedni obstruction is recorded in DECOMPOSITION lane L9 ("Xedni fails
      because lifted points have height ~N", citing Jacobson-Koblitz-Silverman-
      Stein-Teske) and RQ-CANL-63098f restates it. KN-TECH-033 records the
      p-adic lift as the one place lifting is known to pay, at trace one. No
      record states the quadraticity argument giving N^2, the resulting N^{1.5}
      ratio against rho, or the CM-removes-the-lever argument, and none
      adjudicates a height oracle for simulability.
    verdict: adaptation
  novelty_screen_note: >-
    ADAPTATION. The Xedni failure is established literature and the campaign's
    own decomposition already names it; the quadraticity of the canonical height
    is textbook. What is proposed as new to this program is (i) the exponent --
    N^2 rather than N -- with its N^{1.5} consequence, (ii) the exhaustive
    two-case split that makes the closure an adjudication rather than a citation,
    and (iii) the CM direction-of-effect argument, which answers a question the
    campaign wrote down as open. No external novelty is claimed and the
    Jacobson-Koblitz-Silverman-Stein-Teske analysis was not read here.

  null_object_control: >-
    MANDATORY AND BLOCKING, and it is ARM 3 plus ARM 4.
    NULL DIRECTION (ARM 3): resample the target point R with the curve and the
    lift machinery fixed. The minimal-height distribution must be UNCHANGED,
    because by (D) Case 1 the height data does not depend on which point was
    asked for beyond its being a uniform residue. A measured dependence on R
    would mean the search is exploiting something about R and is the one result
    here that would be worth chasing.
    PLANTED DIRECTION (ARM 4): a point with a known small-height lift must have
    that lift found. A search that misses it cannot support any "no small lift
    exists" statement, and every such statement it produced is void.
    DECAY PARAMETER: p, over {2^8, 2^10, 2^12, 2^14}. The minimal height must
    GROW with p, like p^{2/r}. A minimal height that does NOT grow with p is the
    canonical artifact tell -- it would mean the search is finding torsion or is
    not actually constrained to reduce to R -- and it voids the arm.
    SECOND DECAY PARAMETER: the rank r, compared across curves of rank 0, 1, 2.
    Rank 0 must produce NO non-torsion lift at all; that is the sharpest single
    prediction in the record and it is cheap.

  assumptions:
    - >-
      The canonical height is a positive semi-definite quadratic form with
      h_hat([n]R) = n^2 h_hat(R), vanishing exactly on torsion. Textbook
      (Silverman AEC VIII), used without proof and load-bearing for (D) Case 2.
    - >-
      Canonical height is comparable to the logarithm of coordinate size up to
      bounded error (the difference between naive and canonical height is
      bounded). Used to convert height N^2 into coordinate bit-length about N^2;
      the bounded-difference constant does not affect the exponent.
    - >-
      The B^{r/2} counting asymptotic for points of bounded canonical height and
      the small-rank behaviour of CM curves are RELAYED and flagged. They support
      (E) only, not (D), and (D) is where the closure lives.
    - >-
      The Serre-Tate canonical lift is p-adic and has no archimedean canonical
      height. So the "canonical lift" reading of L9 and the "height argument"
      reading are about different objects, and this record addresses the height
      reading; the p-adic reading is KN-TECH-033's territory and is a positive
      control at trace one only.
    - >-
      Toy-scale global point searches terminate at p <= 2^14. If they do not, the
      measurement is reported as infeasible, not as a null.

  proof_search_map:
    bottleneck: >-
      (D) Case 2's exponent. The whole closure is the observation that the
      relation-respecting lift has height k^2 h_hat(P~) rather than
      k * h_hat(P~), which turns an N-sized obstruction into an N^2-sized one and
      makes the gap against rho an exponent rather than a factor. If that square
      is wrong -- if some other height is meant, or if the relation can be
      respected in a quotient where the form is linear -- the closure weakens
      substantially. Zero compute to audit, and it is where a reviewer should
      look first.
    baseline_embedding:
      parameter_slice: >-
        The Xedni construction itself at its published parameters, i.e. the
        original small-height lift attempt with the curve solved for through
        chosen points. At this slice the record must reproduce the known failure
        and must reproduce it FOR THE SAME REASON the literature gives, not for a
        new one.
      reproduction_check: >-
        SYMBOLIC: derive the published failure mode -- lifted points must have
        large height -- from (D) Case 2, and check that the derived exponent is
        consistent with what DECOMPOSITION L9 records. THE TWO CURRENTLY DISAGREE
        (L9 says height ~N, this record says ~N^2 for the relation-respecting
        lift), and reconciling them is a required output: either they refer to
        different points (P~ versus Q~), in which case both are right and this
        record supplies the missing square, or one is wrong. Resolving that is
        cheap and must be done before either number is cited downstream.
    observation_collision:
      observable: >-
        The canonical height, a single real number.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS TRIVIALLY: infinitely many rational points share
        any given canonical height, and in particular for any R in E(F_p) the
        entire coset of points reducing to R contains points of wildly different
        heights. So the observable does not identify the point, does not identify
        the residue, and cannot carry k. A MORE INFORMATIVE collision: the
        trace-one curve and a trace-two curve of the same size admit the same
        kind of lift and the same height machinery, yet one is broken in
        O(log p) and the other is not -- so the height observable cannot
        distinguish a broken curve from a hard one, and the separating condition
        is the trace, which is curve data. This is the same shape of limit that
        IDEA-20260807-413fcc records, arriving from the R6 side, and its
        recurrence across two independent records is itself worth noting.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the canonical height fixed and vary the point; the fiber is
          infinite and contains points reducing to every residue. Any intrinsic
          invariant separating them would have to be the point itself.
        predicted_gain: >-
          A clean demonstration that the height observable has no discriminating
          power over residues, which is what a lane proposing to use heights
          needs to know before it starts.
      - transform: specialization_pack
        proposed_object: >-
          Build the resource measure "minimal canonical height of a global point
          reducing to a specified residue" and realize it by specializing to CM,
          where the curve is pinned and the measure can only increase. Charges
          are added over the disjoint blocks {choice of curve} and {choice of
          point}; Xedni exploits the first block, CM removes it.
        predicted_gain: >-
          Converts L9's open question into a direction-of-effect statement with a
          named exponent N^{2/r} and a rank that CM does not let you choose. No
          attack; the gain is a settled lane.
    quantifier_order: >-
      THE CLOSURE CLAIM:
        FORALL lifts (E~, P~, Q~) over a number field with good reduction giving
        (E, P, Q), EITHER Q~ != [k]P~ in the global Mordell-Weil group -- and
        then FORALL k the height data is the same, so it carries no information
        about k -- OR Q~ = [k]P~, and then h_hat(Q~) = k^2 h_hat(P~) about N^2.
        The universal over lifts comes FIRST, which is what makes this a closure
        rather than an observation about one construction. Xedni-style tuning
        chooses a lift AFTER seeing the points, and it is still inside this
        universal, which is exactly why the closure covers it.
      THE CM CLAIM'S ORDER, weaker and flagged as such:
        FORALL CM discriminants D, FORALL curves E~/K with CM by O_D, the
        j-invariant is a root of H_D, so the curve is not free; hence the minimal
        height of a point reducing to a specified residue is at least about
        N^{2/r} with r = rank E~(K) NOT CHOSEN BY THE ADVERSARY. The dependence
        of r on the curve is the load-bearing part and it is where the relayed
        facts enter.
      NOT CLAIMED: FORALL lifting methods, no method works. The trace-one p-adic
      route works (KN-TECH-033) and is explicitly excluded by the good-reduction
      / archimedean-height hypotheses.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For lifts to number fields with archimedean canonical heights, either
        the lift is k-independent or it has height about N^2; and CM constrains
        the curve, so it cannot supply the freedom Xedni used." It can NEVER
        certify that no lifting attack exists -- the trace-one additive transfer
        is a lifting attack that works -- nor anything about p-adic methods,
        formal groups, or heights other than the canonical one.
      nearby_object_control: >-
        THE TRACE-ONE CURVE with the Satoh-Araki p-adic lift, which is the
        closest object where the desired conclusion FAILS: there, lifting to
        characteristic zero pays, and it pays in O(log p). The method must not
        kill that case, and it does not, because that route uses the formal-group
        logarithm rather than an archimedean height and requires #E = p. A method
        that could not tell these apart would not have identified the load-bearing
        structure; the separating condition is named and is the trace.
        A SECOND nearby object: a rank-zero CM curve, where the conclusion holds
        vacuously because no non-torsion global point exists at all. Vacuous
        confirmations are not confirmations and the measurement must exclude
        rank-zero curves from the main arms while keeping one as a control.
    proof_obligations:
      - claim: h_hat([n]R) = n^2 h_hat(R) and h_hat is a quadratic form.
        responsibility: correctness
      - claim: >-
          The case split (lift respects the relation / does not) is exhaustive.
        responsibility: correctness
      - claim: >-
          Case 1's height data is independent of k, verified by the resampling
          control.
        responsibility: correctness
      - claim: >-
          Case 2's coordinate bit-length is about N^2, giving a ratio about
          N^{1.5} against 0.886*sqrt(N).
        responsibility: size
      - claim: >-
          The derived exponent is reconciled with DECOMPOSITION L9's recorded
          "height ~N".
        responsibility: baseline
      - claim: >-
          CM pins the j-invariant, removing the curve-fitting freedom, and the
          minimal height scales as N^{2/r}.
        responsibility: strictness
      - claim: >-
          The planted small-height lift is found by the search.
        responsibility: interface
      - claim: >-
          The trace-one p-adic route is excluded by hypothesis and is not killed
          by the argument.
        responsibility: scope

  predictions:
    - metric: >-
        minimal canonical height of a rational point reducing to a specified
        point of E(F_p), as a function of p over {2^8, 2^10, 2^12, 2^14}
      direction: higher
      minimum_effect: >-
        Grows with p, consistent with a p^{2/r} scaling; the fitted exponent must
        be positive with the fit reported. A minimal height flat in p means the
        search is finding torsion or is not enforcing the reduction constraint,
        and the arm is void.
    - metric: >-
        minimal height, CM arm (j = 0, j = 1728) versus non-CM arm at matched p
        and matched rank
      direction: higher
      minimum_effect: >-
        CM arm no lower than the non-CM arm. PREDICTED: equal at matched rank and
        higher in practice because CM ranks are smaller. A CM arm reproducibly
        LOWER at matched rank would refute (E)'s direction-of-effect and would be
        the one interesting outcome available in this lane.
    - metric: >-
        number of non-torsion global points found on a rank-zero CM curve
      direction: different
      minimum_effect: >-
        Exactly zero. This is the cheapest prediction in the record and a nonzero
        count means the rank determination or the search is wrong.
    - metric: >-
        dependence of the minimal-height distribution on which target point R was
        requested, with the curve fixed
      direction: different
      minimum_effect: >-
        None detectable over 200 resampled targets. A detectable dependence
        contradicts (D) Case 1 and would be worth chasing, so it is
        pre-registered as the interesting negative rather than as an anomaly.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, 1 hour, HARD GATE): the two adjudications, the case
      split, the N^2 computation, and the reconciliation with DECOMPOSITION L9's
      recorded exponent. If the case split is not exhaustive, stop.
      STAGE 1 (zero compute): the CM direction-of-effect argument, with both
      relayed facts flagged and a Stage-0 literature obligation to confirm or
      drop them.
      STAGE 2 (toy compute, <= 10 min, HARD GATE): ARM 4, the planted
      small-height lift. The search must find it.
      STAGE 3 (toy compute, <= 20 min): ARMS 1 and 2 over the p ladder and the
      rank ladder, with rank-zero curves as a separate control.
      STAGE 4 (toy compute, included): ARM 3, the target-resampling null.
      STAGE 5 (zero compute): write the L9 answer and its forward guidance,
      naming the trace-one p-adic route as the one lifting mechanism that pays
      and its coincidence as the reason.
    controls:
      - >-
        planted small-height lift (ARM 4, blocking)
      - >-
        target resampling with curve fixed (ARM 3, the canonical artifact
        control, blocking)
      - >-
        p ladder {2^8, 2^10, 2^12, 2^14} as the decay test
      - >-
        rank ladder r in {0, 1, 2}, with rank 0 required to produce nothing
      - >-
        trace-one curve excluded from the arms and retained as the
        proving-too-much boundary check
      - >-
        good reduction at p verified per curve; factored group order recorded
    required_metrics:
      - minimal canonical height per (curve, p, target), with the search bound
      - fitted exponent of minimal height against p, per rank
      - CM versus non-CM comparison at matched p and rank
      - non-torsion point count on rank-zero curves
      - ARM 3 distribution comparison over 200 resampled targets
      - ARM 4 pass/fail

  falsification_conditions:
    - >-
      The case split is not exhaustive -- a third kind of lift is exhibited. The
      closure fails and the record is superseded.
    - >-
      The quadraticity argument is wrong for the height actually relevant, e.g.
      because a different height or a quotient makes the dependence linear. Then
      the N^2 becomes N and the gap against rho shrinks from an exponent to a
      factor, which materially weakens the closure without eliminating it.
    - >-
      ARM 4 fails: a planted small-height lift is not found. The search cannot
      support any "no small lift" statement and every large-height result is
      void.
    - >-
      ARM 3 shows a dependence on the requested target. (D) Case 1 is wrong;
      chase it.
    - >-
      The CM arm shows lower minimal heights than the non-CM arm at matched rank.
      (E)'s direction of effect is wrong, L9 reopens, and independent review is
      required before any record states it.
    - >-
      Global point searches do not terminate at p <= 2^14 within budget.
      INFRASTRUCTURE outcome under AGENTS.md rule 5, reported as such, never as a
      null.

  confounders:
    - >-
      TORSION. Torsion points have canonical height zero and reduce to specific
      residues. A search that returns torsion "solves" the minimal-height
      question trivially and meaninglessly. Torsion must be excluded explicitly
      and the exclusion recorded.
    - >-
      RANK DETERMINATION. Ranks of curves over Q are not always easy to compute
      and a wrong rank invalidates the matched comparison. Only curves with
      confidently known rank should be used, and the source of each rank
      recorded.
    - >-
      HEIGHT NORMALISATION. Canonical heights come in several normalisations
      differing by a factor of 2 or by the field degree. All arms must use one
      normalisation and it must be stated; a cross-arm comparison in mixed
      normalisations measures the normalisation.
    - >-
      VACUOUS CONFIRMATION AT RANK ZERO. A rank-zero curve confirms every
      no-small-lift statement by having no points at all. It is a control, not an
      arm, and mixing it into the arms would inflate the result.
    - >-
      RELAYED-FACT CREEP in (E). The B^{r/2} asymptotic and CM rank behaviour are
      flagged. If a downstream record cites them as established on the strength
      of this proposal, that is a citation failure originating here.

  interpretation_limits:
    - >-
      Scoped to lifts to number fields with archimedean canonical heights. Says
      nothing about p-adic methods, formal groups, or the trace-one additive
      transfer, which works and is out of scope by hypothesis.
    - >-
      The N^2 figure is a size bound on a witness, not a lower bound on any
      algorithm. It says a particular kind of certificate is too big to write,
      which is a cost closure and not a hardness result.
    - >-
      The CM direction-of-effect argument rests on two relayed facts and is the
      weakest part of the record. It should be read as an argued expectation, not
      as a settled statement, until the literature obligation is discharged.
    - >-
      All measurements are toy scale at p <= 2^14, which is smaller than the rest
      of the campaign because global point searches are the binding constraint.
      Nothing extrapolates.
    - >-
      A confirmation here closes an ORACLE and a lifting FAMILY at a stated cost.
      It does not close lane L9 in any sense that would forbid a p-adic proposal
      naming its coincidence.

  reachability_gate: >-
    APPLIES IN AN UNUSUAL FORM AND IS DISCHARGED BY COST. L9's analogue of T5 is
    "is a good LIFT reachable, and at what cost?" The answer from (D) Case 2 is
    quantitative: a relation-respecting lift exists mathematically -- the global
    Mordell-Weil group of a curve of positive rank contains [k]P~ -- but its
    coordinates carry about N^2 bits, so it is unreachable by an exponent of 1.5
    over the rho baseline, not by a constant. And (E) says the CM route, which
    might have been hoped to shrink the search, instead removes the freedom that
    made Xedni's search possible at all. Good objects exist and are astronomically
    far away; that is a cleaner disposition than "no good object exists" and it
    is the honest one.

  heuristic_assumptions:
    - id: H1
      statement: >-
        LIFT INDEPENDENCE. For a lift chosen without reference to Q, the height
        pairing <P~, Q~> is statistically independent of k, so no height
        statistic computed from such a lift correlates with k.
      rigorous_support: >-
        RIGOROUS IN THE STRICT CASE and heuristic only in the adaptive one. If
        the lift is chosen before Q is revealed, independence is immediate. If
        the adversary chooses the lift AFTER seeing Q -- which Xedni does -- then
        independence is an assumption, and the honest support is (D) Case 2: any
        lift whose choice actually uses Q in a way that respects the relation is
        forced to height N^2. So H1 is not load-bearing; it is the easy half of a
        dichotomy whose hard half is a size bound.
      validation_plan: >-
        ARM 3: resample the target 200 times with the curve and lift machinery
        fixed and compare minimal-height distributions; report the two-sample
        comparison rather than a point estimate. Toy scale (p <= 2^14), labelled
        as such, and it validates the independence at that scale only.
    - id: H2
      statement: >-
        COUNTING ASYMPTOTIC. The number of K-rational points of canonical height
        at most B on a curve of rank r grows like c * B^{r/2}, so hitting a
        specified residue class of size about N requires height about N^{2/r}.
      rigorous_support: >-
        RELAYED, not re-derived here; it is the standard lattice-point count for
        the Mordell-Weil lattice under the canonical height, and the classical
        statement it imitates is volume counting in a rank-r Euclidean lattice.
        It supports (E) only. If it fails, (E) weakens to a qualitative statement
        -- CM removes the curve-fitting freedom -- which is still enough to
        answer L9's question in the negative, so the closure does not depend on
        it.
      validation_plan: >-
        Measure it directly on the toy arms: count points of height at most B for
        a ladder of B on curves of rank 1 and 2, and fit the exponent against
        r/2. Comparison distribution: the predicted power law. Tail check: the
        largest B reached and whether the fit degrades there. Toy scale only,
        and the record does not use a toy fit to support a claim about
        cryptographic-size lifts, where the same asymptotic is standard but is
        validated by nothing here.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT IS CLAIMED; the record's content is a cost closure with an
      exponent. The relation-respecting lift of (D) Case 2 requires writing about
      N^2 bits, i.e. cost at least N^2, against the baseline 0.886*sqrt(N) --
      WORSE BY A FACTOR ABOUT N^{1.5}. The non-relation-respecting lift of Case 1
      costs whatever the lift costs and yields exponent infinity in the sense
      that it never solves the instance, carrying zero information about k.
    memory_exponent: >-
      Case 2's witness alone needs about N^2 bits of storage, which is the
      dominant term and is the closure. The toy measurement's memory is
      negligible.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); automorphism-
      discounted on CM curves (KN-TECH-018); BSGS at sqrt(N) time and memory
      (KN-TECH-031). On trace-one curves only, the additive transfer at
      O(log p) (KN-TECH-033) -- named because it is the lifting method that
      works and it must not be confused with anything here.
    hidden_overhead: >-
      The N^2 figure hides the constant h_hat(P~), which for a specific curve and
      point is a specific positive number and could in principle be small -- but
      it cannot be smaller than the Lang-type lower bounds for a non-torsion
      point on a curve of bounded conductor, and no choice of it changes the
      exponent. Second disclosure: the conversion from canonical height to
      coordinate bit-length carries a bounded additive error which is irrelevant
      at this scale but must not be dropped silently in a write-up.
    tradeoff_note: >-
      There is no useful time-memory tradeoff here: Case 2's obstruction is a
      SIZE bound on the witness, and size bounds do not trade against time. That
      is what makes this closure unusually robust compared with a cost estimate,
      and it is worth stating because a reader may expect a tradeoff argument and
      there is none to make.

  dominated_by: >-
    AS AN ATTACK: none mounted, and the record derives that the family it
    analyses is dominated by an exponent. Checked row by row across time, memory
    and data/queries: parallel rho with distinguished points (0.886*sqrt(N) time,
    O(1) memory, 0 queries) dominates the Case 2 lift by a factor about N^{1.5}
    on time and by about N^2 on memory; automorphism-discounted rho on CM curves
    (KN-TECH-018) dominates by a further factor up to sqrt(6); BSGS
    (KN-TECH-031) at sqrt(N) time and sqrt(N) memory also dominates on both axes.
    On trace-one curves only, KN-TECH-033's additive transfer at O(log p)
    dominates everything, and it is named here because it is the lifting method
    that works and the contrast is the record's forward guidance. `null` is not
    available.
    AS A CLOSURE: the incumbent is DECOMPOSITION L9's citation of the
    Jacobson-Koblitz-Silverman-Stein-Teske failure. This record dominates it on
    the exponent (N^2 versus the recorded ~N, pending the reconciliation the
    proof_search_map requires) and on covering the CM variant, which L9 leaves
    open; it is dominated by the incumbent on provenance, that being a cited
    published analysis and this a derivation.
  sota_delta: >-
    Zero speedup against any attack baseline: 0 time, 0 memory, 0 queries.
    Closure delta in numbers: sharpens the recorded Xedni obstruction from
    height about N to height about N^2 for the relation-respecting lift, giving a
    stated N^{1.5} ratio against the rho baseline where the corpus previously
    recorded no ratio at all; answers 1 open question from the frozen
    decomposition (L9's CM sharpening) with a direction-of-effect argument; and
    reduces the CM lifting route from "open" to "argued negative with two relayed
    facts flagged". Compute cost approximately 30 minutes at p <= 2^14.

  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    0.9 that the case split and the N^2 exponent are right -- quadraticity of the
    canonical height is textbook and the only risk is a reconciliation problem
    with DECOMPOSITION L9's recorded ~N, which I expect resolves as P~ versus Q~.
    0.6 that the CM direction-of-effect argument survives review, since it leans
    on two relayed facts and on a rank claim I have not verified. 0.45 that the
    toy measurement runs at all in pure Python without a computer-algebra system:
    searching for rational points of bounded height on a curve over Q is exactly
    the kind of thing the harness is not built for, and `estimated_cost.
    implementation: high` reflects that honestly. PRIORITY IS LOW for a specific
    reason: the mathematical closure is available at zero compute in Stage 0, the
    measurement adds little to it, and the lane it closes (L9) was already the
    campaign's least promising -- so the right disposition is to take the free
    argument and not schedule the experiment.

