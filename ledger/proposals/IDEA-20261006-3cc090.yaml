  dominated_by: >-
    As a security claim, dominated by the question's own ceiling:
    no bit level is admissible from this record. Compared with
    KR-RHO-13bf67, KR-RHO-ea34b8, and KR-RHO-755e35, each opened
    on 2026-10-06, none of which evaluates a truncated L-series.
    The infinite class-number formula, recalled and not opened,
    dominates the truncation as an identity. The truncation error
    at 30 terms is not dominated by any row opened here.
  sota_delta: >-
    Zero change to any hidden-shift exponent and zero change to
    any ECDLP exponent. The numerical output is one integer
    difference, predicted equal to 0.
  proof_search_map:
    not_applicable_reason: >-
      This is a finite comparison of one truncation with one form
      count. It does not propose a theorem, a bound on a quantum
      cost, a certificate beyond the two form enumerations and the
      rational interval, a reduction, or a closure of the
      class-number formula.
