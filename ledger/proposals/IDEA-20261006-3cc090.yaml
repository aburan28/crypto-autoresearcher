idea:
  id: IDEA-20261006-3cc090
  question_id: RQ-CSIDH-64343f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The nearest integer to a 30-term class-number truncation equals
    the form count at discriminant -83
  class: measurement
  claim: >-
    Let p = 83. Let h be the number of reduced positive-definite
    binary quadratic forms of discriminant -p. Let chi(n) be the
    Kronecker symbol (-p / n). Let L30 be the sum of chi(n)/n for
    n from 1 to 30. Let S be (sqrt(p) / pi) times L30, where pi is
    the circle constant, not a Frobenius endomorphism. Replace
    sqrt(p) and pi by rational bounds so that S is enclosed in a
    rational interval of length strictly less than 1/2. If that
    interval contains two integers, or meets an integer plus 1/2,
    the row is instrument_failure and no nearest integer is scored.
    Otherwise let r be the unique integer nearest to every point of
    the interval. The claim is r = h. A finished interval with
    r different from h is the concrete negative. This is not an
    invariant-factor count, it is not the congruence of a Frobenius
    endomorphism with 1 modulo a prime, and it states no security
    level.
  mechanism: >-
    The tracked object is the class number, read as a form count,
    against one partial sum of the Dirichlet series for L(1, chi).
    The representation is the set of reduced positive-definite
    binary quadratic forms of discriminant -83. The operation set
    Sigma is enumeration of that set, not composition and not
    elliptic translation. Class: coordinate-dependent, because h
    is a property of the whole set and is constant on forms.
    Lossy-projection test against Sigma: the forms are discarded
    and the integer h is kept. Many sets share a cardinality, so
    the projection is lossy. Two outcomes are separated before any
    run. r = h says this 30-term truncation, under the declared
    rational bounds, already names the form count. r different
    from h says the truncation has not settled. The question asks
    for a certified class-group order at a small CSIDH-like
    discriminant. The order is the product of the invariant
    factors, which a different record ignores. This record scores
    the order and ignores the factors.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-508
      provenance: kb
      claim: >-
        The note estimates a count of discriminants whose class
        number is not divisible by a fixed prime l. It does not
        evaluate a 30-term truncation at discriminant -83.
      verified_by: knowledge/literature/KN-LIT-508.md
    - ref: >-
        Dirichlet class-number formula for imaginary quadratic
        fields
      provenance: recalled
      claim: >-
        For the fundamental discriminant -p with p congruent to 3
        mod 4 and p greater than 3, the class number equals
        (sqrt(p) / pi) times L(1, chi), with w = 2. Not opened as
        a primary text in this session. The truncation at 30 terms
        is not that identity.
      verified_by: null
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega of
        the square root of the group order. This form count is not
        a generic discrete logarithm.
      verified_by: >-
        design session opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
  assumptions:
    - >-
      Discriminant -83 is fundamental, and the number of reduced
      positive-definite forms is the class number of
      Z[(1+sqrt(-83))/2].
    - >-
      The weight w in the recalled formula is 2 at this
      discriminant, so the factor in front of L(1, chi) is
      sqrt(p) / pi. If a later primary read shows a different
      weight, the row is instrument_failure rather than a
      mismatch.
    - >-
      The nearest integer is scored only when the rational
      interval has length strictly less than 1/2 and contains
      exactly one integer. A wider interval is not a mismatch.
    - >-
      No quantum oracle and no security level enter the claim.
  predictions:
    - metric: absolute difference between the nearest integer r and the form count h
      direction: lower
      minimum_effect: equal to 0
  minimal_test:
    design: >-
      Enumerate the reduced positive-definite forms of discriminant
      -83 and record h. Compute the Kronecker symbol (-83 / n) for
      n from 1 to 30 and the rational sum L30. Enclose sqrt(83) and
      the circle constant in rational intervals tight enough that
      the image interval for S has length strictly less than 1/2.
      If the enclosure fails that length, or meets a half-integer,
      record instrument_failure. Otherwise compare r with h.
    controls:
      - >-
        chi(1) = 1 and the partial sum L30 is a reduced rational.
        A non-reduced comparison voids the run.
      - >-
        The same form enumeration on discriminant -84 must be
        refused or must be labeled non-fundamental before any
        count is scored. Silent treatment of -84 as fundamental
        voids the run.
      - >-
        The invariant-factor list may be computed and must then be
        ignored. A write-up whose only outcome is that list is not
        this test.
    required_metrics:
      - the form count h
      - the rational interval for S
      - the nearest integer r, or instrument_failure
      - the absolute difference |r - h| when r is scored
  falsification_conditions:
    - >-
      The interval meets the length bound, r is scored, and r is
      different from h. That difference is the negative observation.
    - The form enumeration disagrees with a second enumeration of the same forms, and the disagreed h is then used.
    - Discriminant -84 is treated as fundamental.
  confounders:
    - >-
      A truncation at 30 terms can sit more than 1/2 away from the
      infinite sum. That distance is the quantity under test, not
      a defect to be repaired by adding terms after seeing h.
    - >-
      Rational bounds on the circle constant that are too loose
      make the interval long. A long interval is instrument_failure,
      not a mismatch.
    - >-
      Identifying opposite forms twice changes h. The reduced-form
      convention has to be fixed before the count.
  interpretation_limits:
    - >-
      Equality at 30 terms is not a proof of the class-number
      formula and is not a CSIDH-512 class number.
    - >-
      A mismatch closes only this discriminant and this truncation
      length. It does not refute the infinite sum.
    - >-
      The circle constant in the formula is not the Frobenius
      endomorphism, and the claim is not a congruence modulo the
      group order.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The tail of L(1, chi) after 30 terms, multiplied by
        sqrt(83) / pi, has absolute value strictly less than 1/2,
        so the nearest integer to the truncation equals the class
        number. The tail bound is the heuristic. The form count is
        the measurement.
      rigorous_support: >-
        The infinite-sum identity is recalled and was not opened.
        No theorem opened in this session bounds the tail at 30
        terms for this character. KN-LIT-508, as read, estimates
        how often a prime misses the class number, which is a
        different statistic.
      validation_plan: >-
        The quantity sampled is |r - h| at p = 83 and N = 30, one
        discriminant, not a random draw. The comparison is against
        0. The tail check is the length of the rational interval,
        which must be strictly less than 1/2 before r is scored.
        Transfer assumption: none. The integer is not used at a
        512-bit prime.
  target_complexity:
    time_exponent: >-
      unchanged. No hidden-shift exponent is stated. Generic
      discrete log in a prime-order group remains exponent 1/2
      (KR-RHO-13bf67) and is not this form count.
    memory_exponent: unchanged. The output is two integers.
    best_known: >-
      The question's structure input includes a certified class
      number at small discriminants. This record does not improve
      a published quantum cost.
    hidden_overhead: >-
      None in an exponent. The gap between discriminant -83 and a
      cryptographic class number is not an o(1) term and is not
      claimed as one.
    tradeoff_note: >-
      No time-memory tradeoff. The preprocessing bound of
      KR-RHO-ea34b8 is a different instrument and is not evaluated.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
