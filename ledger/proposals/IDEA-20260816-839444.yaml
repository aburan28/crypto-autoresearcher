idea:
  id: IDEA-20260816-839444
  question_id: RQ-ARGON-141710
  added: '2026-08-16'
  title: 'A depth-robustness ratio is defined by its denominator: run the identical measurement against
    a declared family of four different null graphs and report whether the sign and size of the effect
    survive the choice, because a conclusion that flips with the null is a fact about the comparison
    object rather than about Argon2.'
  class: control
  claim: '(A) H-ARGON-ef2f0b''s central prediction is a ratio rho = |S*_real| / |S*_unif|, where the
    denominator is a window-matched uniform-reference null. EV-ARGON-209ece records, as an explicit
    unresolved confound raised by the independent red team, that neither the producer nor either reviewer
    could establish whether a window-truncated null is the right comparison, as opposed to a construction
    with edges spanning the full prior history at multiple scales. That confound is currently blocking,
    unmeasured, and cheap to measure. (B) The claim is that the choice of null is a free parameter
    of the measurement, that the lane has fixed it by convention rather than by argument, and that
    its effect on the conclusion can be quantified directly by computing the same numerator against
    four structurally distinct denominators: the window-matched uniform null already specified; a
    full-history uniform null whose targets span all prior blocks; a matched-mean null whose back-distance
    distribution has the same mean as the real graph but a different shape; and a degree-preserving
    rewiring of the real graph, which is the strongest null because it preserves everything except
    which specific node each edge lands on. (C) It is claimed that these four nulls will not agree,
    and specifically that the full-history null will make Argon2 look far weaker and the degree-preserving
    rewiring will make it look far stronger, so that rho is not one number but an interval whose width
    is set by the analyst''s choice. The deliverable is that interval, plus a stated argument for
    which null answers which question. (D) WHAT IS NOT CLAIMED: no claim that any particular null
    is correct -- that would require reading a literature this environment cannot reach, and the record
    explicitly declines to assert what any published depth-robustness argument compares against. No
    claim about Argon2''s security, no attack, no parameter statement, and no claim that a wide interval
    invalidates the lane''s existing work; a wide interval means the existing prediction needs its
    denominator named in its statement, which is a repair rather than a refutation. (E) The named
    way the accounting flatters the defender: a null that is easier to shatter than the real graph
    makes rho look small and the design look strong, and choosing the null after seeing the numerator
    would do exactly that -- which is why all four are declared before any is run.'
  mechanism: 'STAGE 1: fix one numerator. Build the real per-lane Argon2 graph at p=1 for a declared
    (variant, t, q) grid and compute its removal-set size once, with the lane''s existing greedy heuristic
    and a declared threshold, so that every comparison shares an identical numerator and identical
    code. STAGE 2: build the four nulls. Window-matched uniform: same W(j), uniform target. Full-history
    uniform: target uniform over all prior blocks, ignoring the window. Matched-mean: target drawn
    from a distribution whose mean back-distance equals the real graph''s measured mean but whose
    shape is geometric rather than the RFC transform''s. Degree-preserving rewiring: same in-degree
    multiset, targets permuted subject to remaining backward. STAGE 3: run the identical removal-set
    computation on twenty independent draws of each null family. STAGE 4: report rho against each
    denominator with its null spread, and report the interval spanned by the four point estimates.
    STAGE 5: apply the structural tell from inventor-protocol section 3 -- as the parameter that should
    destroy the effect increases, here t, each rho should move in a direction, and the four nulls
    should move CONSISTENTLY if they are measuring the same thing. Four nulls whose rho values move
    in different directions with t are diagnosing four different quantities and the record says so.
    STAGE 6: state, for each null, which question it answers -- the window-matched null isolates the
    offset transform, the full-history null isolates the window itself, the matched-mean null isolates
    distribution shape at fixed mean, and the rewiring null isolates edge placement at fixed degree
    -- and note that no experiment can choose among them without an argument the environment cannot
    supply.'
  novelty_status: unverified
  novelty_screen:
    method: Read EV-ARGON-209ece in full, specifically the unresolved_confounds block, which names
      the null-versus-theory gap verbatim; read H-ARGON-ef2f0b in full including its predictions and
      falsification_conditions; read the objective block of experiments/EXP-ARGON-2608c2/specification.yaml;
      grep -l RQ-ARGON-141710 ledger/proposals/*.yaml and read all ten titles and classes, with IDEA-20260809-bcf891
      examined closely; grep -ril for null object, null control, denominator across ledger/proposals/
      and ledger/hypotheses/.
    results: 'EV-ARGON-209ece''s unresolved_confounds contains, as its first entry, the red team''s
      null-versus-theory gap: G_unif correctly isolates the within-window selection rule, but nobody
      could confirm whether a window-truncated null is the comparison the depth-robust-graph asymptotic
      literature itself makes, versus a construction with edges spanning the full prior history at
      multiple scales, and it records that this cannot be resolved until that literature is read.
      So this confound is already known, already recorded, and explicitly unresolved. IDEA-20260809-bcf891
      is the nearest proposal: it calibrates the measurement ALGORITHM against known-depth-robust
      and known-shallow families. That is a different axis -- it fixes the numerator''s accuracy,
      not the denominator''s identity. H-ARGON-ef2f0b specifies exactly one null and its falsification_conditions
      are stated entirely in terms of rho against that one null. No proposal under this question varies
      the null.'
    verdict: 'UNVERIFIED. This record explicitly declines to assert what any external literature compares
      against, which is the very gap EV-ARGON-209ece records as unresolvable in this environment.
      What is claimed new within this repository is treating the null as an independent variable and
      reporting rho as an interval over a declared null family, plus the consistency check that all
      four nulls must move in the same direction as t increases. Assembled from known parts: every
      one of the four nulls is a standard construction, the greedy numerator is the lane''s existing
      instrument, and inventor-protocol section 3 already requires a null. The contribution is the
      observation that requiring A null and requiring THE null are different requirements, and that
      the difference is measurable at low cost.'
  object_first_candidate:
    tracked_object: The removal-set-size ratio rho itself, followed not through a computation but
      across a family of denominators -- the object tracked is the measurement, and what is followed
      is how its value moves as the comparison object varies while the numerator is held byte-identical.
    lossiness: 'The projection here discards the graphs entirely and keeps one scalar per (numerator,
      denominator) pair. This is extremely lossy and, unusually for this batch, the losses are the
      point: two nulls that produce the same rho may be structurally unalike, and that is exactly
      the ambiguity being exposed. The record therefore reports, alongside each rho, the null''s own
      back-distance distribution and in-degree histogram, so a reader can see which structural coordinates
      each null preserved and which it destroyed. Without those the interval would be uninterpretable.
      Stating it plainly: rho alone is a lossy projection whose fibers are large, and this record
      measures the size of one fiber.'
    propagation: The operation whose action is followed is the substitution of one null for another,
      holding the numerator fixed. Each substitution changes exactly one structural coordinate --
      the window becomes unbounded, the shape changes at fixed mean, the placement is permuted at
      fixed degree -- and the induced change in rho is the measured response. The propagation is therefore
      a discrete finite-difference profile over structural coordinates, and it is exact in the sense
      that the numerator does not move at all between conditions; only the denominator does.
    survival_score: The concrete statement of survival is the width of the interval spanned by the
      four rho values, relative to the effect size H-ARGON-ef2f0b predicts. If the interval is narrower
      than the gap between that hypothesis's confirm threshold of 0.5 and its falsify threshold of
      0.8, the conclusion survives the null choice and the lane's existing prediction is well-posed
      as written. If the interval straddles both thresholds, the conclusion does not survive the null
      choice at all and the prediction is under-specified until its denominator is named in its statement.
      That comparison is the deliverable and it is a single sentence with a number in it.
  null_object_control: 'This record''s subject is nulls, so its own control must be a case where the
    answer is forced. Two are used, both run through the identical code path in the same invocation.
    FORCED CASE ONE: the numerator graph compared against ITSELF as denominator, which must return
    rho exactly 1.000 for every null-family code path; any deviation is a bug in the comparison harness
    and halts the run. FORCED CASE TWO: a chain-only graph as numerator against each of the four nulls,
    where the numerator''s removal-set size is known in closed form, so that any variation across
    nulls is attributable entirely to the denominators rather than to numerator noise. For the four-null
    interval to mean anything, case one must return 1.000 exactly and case two must reproduce its
    closed form. If the interval measured in the main arm is no wider than the spread within a single
    null family''s twenty draws, the correct record is a controlled null on this record''s own claim:
    the choice of null does not matter at these parameters, which would fully resolve the confound
    EV-ARGON-209ece leaves open and is the single most valuable outcome available here.'
  discriminated_from:
  - IDEA-20260809-bcf891 calibrates the greedy removal-set algorithm against families whose robustness
    is known independently, fixing the numerator's accuracy. This record holds the numerator and its
    algorithm completely fixed and varies only the denominator; the two are orthogonal and both are
    needed.
  - H-ARGON-ef2f0b and EXP-ARGON-2608c2 specify exactly one null and state their entire falsification
    condition in terms of rho against it. This record does not test that hypothesis; it measures how
    much of that hypothesis's answer is determined by a choice its statement does not mention.
  - IDEA-20260809-a915ea proposes direct measurement of the real graph. This record measures no property
    of the real graph beyond the one numerator it reuses, and produces no new statement about Argon2.
  - A generic robustness or sensitivity analysis. The four nulls are not arbitrary perturbations;
    each is chosen to hold a specific structural coordinate fixed and destroy exactly one other, so
    the finite-difference profile is interpretable rather than a scatter.
  - The companion live-set record in this batch, which also uses a degree-preserving rewiring null
    but for an exactly computed retention quantity rather than for a heuristically bounded removal
    set; the shared null construction is deliberate and lets the two records validate each other's
    rewiring sampler.
  assumptions:
  - The lane's existing greedy removal-set heuristic and its threshold are used unchanged, so the
    interval measured is the interval that applies to the lane's existing plans; its approximation
    error is a constant across conditions and therefore largely cancels in a ratio, though not exactly.
  - Twenty draws per null family is enough to separate the between-null interval from the within-null
    spread; if it is not, the run reports that and no interval is claimed.
  - The degree-preserving rewiring sampler mixes adequately, a requirement shared with the companion
    live-set record and validated the same way.
  - p=1 construction as elsewhere in this lane, with cross-lane edges excluded by construction.
  - The matched-mean null's geometric shape is one arbitrary choice among many with the same mean;
    it is declared before running and not tuned, and the record states that a different shape at the
    same mean could give a different rho.
  predictions:
  - metric: width of the interval spanned by the four rho point estimates at a fixed (variant, t,
      q) cell
    direction: higher
    minimum_effect: at least 0.30 in rho units, that is, wider than the 0.30 gap between H-ARGON-ef2f0b's
      own confirm threshold of 0.5 and falsify threshold of 0.8
  - metric: rho against the full-history uniform null, relative to rho against the window-matched
      uniform null
    direction: lower
    minimum_effect: at least 0.20 lower, since a full-history null has long-range edges the real graph
      lacks and should be much harder to shatter
  - metric: rho against the degree-preserving rewiring null
    direction: higher
    minimum_effect: at least 0.20 higher than rho against the window-matched uniform null, since the
      rewiring preserves the real graph's own back-distance degree structure and destroys only placement
  - metric: direction of movement of each rho as t increases from 1 to 3 to 6
    direction: different
    minimum_effect: 'REFUSAL TO PRE-COMMIT on magnitude, but a pre-committed consistency requirement:
      all four rho values must move in the SAME direction with t if they measure the same underlying
      quantity. Divergent directions are reported as evidence that the four nulls diagnose four different
      things, which is a finding about the measurement rather than a number about Argon2.'
  minimal_test:
    design: One numerator, four denominators, one code path. Fix p=1, variants Argon2i and Argon2id,
      t in {1, 3, 6}, q in {1024, 4096}. Compute the real graph's removal-set size once per cell with
      the lane's existing greedy heuristic at a declared depth threshold. Build twenty independent
      draws of each of the four null families per cell and compute their removal-set sizes with the
      identical function. Report rho against each denominator with its twenty-draw spread, the interval
      spanned by the four point estimates, and each null's own back-distance distribution and in-degree
      histogram so the reader can see what each preserved. Run the two forced cases -- self-comparison,
      which must return 1.000, and chain-only numerator, which must reproduce its closed form. Report
      the t-direction consistency check across all four. Total cost is eighty null graphs plus one
      real graph per cell, each measured by an O(q^2)-worst-case greedy pass, which at q=4096 is minutes
      per cell on one core.
    controls:
    - Self-comparison forced case returning rho exactly 1.000 through every null-family code path.
    - Chain-only numerator with a closed-form removal-set size, isolating denominator variation from
      numerator noise.
    - Twenty independent draws per null family, so the between-null interval is compared against the
      within-null spread rather than against nothing.
    - Each null's back-distance distribution and in-degree histogram reported alongside its rho, making
      the preserved and destroyed coordinates visible.
    - The t-direction consistency check, run as a diagnostic on the measurement rather than as a result
      about Argon2.
    required_metrics:
    - rho against each of the four denominators, per cell
    - within-family spread over twenty draws per null family
    - width of the interval spanned by the four point estimates
    - back-distance distribution and in-degree histogram of each null family
    - self-comparison forced-case value
    - direction of each rho's movement with t
  falsification_conditions:
  - The four-null interval is narrower than the within-family spread, meaning the null choice does
    not matter at these parameters and this record's central claim is wrong -- which resolves EV-ARGON-209ece's
    recorded confound in the reassuring direction and is the most valuable single outcome available.
  - The self-comparison forced case returns anything other than 1.000, halting the run as a harness
    defect.
  - The chain-only numerator fails to reproduce its closed form under any null family.
  - The full-history null gives a HIGHER rho than the window-matched null, contradicting the predicted
    direction and indicating that long-range edges do not make a graph harder to shatter in this regime,
    which would need explaining before any interval is reported.
  - The four rho values move in different directions with t, which is reported as the nulls diagnosing
    different quantities and forbids reporting a single interval as though it bracketed one number.
  confounders:
  - The greedy heuristic's approximation error is not constant across graph families, so it does not
    fully cancel in a ratio; the companion exact-DP record in this batch is the only way to bound
    this and its absence is a stated limitation here.
  - A poorly mixed degree-preserving rewiring sampler will resemble the real graph and shrink the
    interval for the wrong reason.
  - The matched-mean null's geometric shape is one arbitrary choice; a different shape at the same
    mean is a different null and the interval is only over the four declared.
  - Small q makes the window a large fraction of the array, so the window-matched and full-history
    nulls converge and the interval shrinks for a reason unrelated to the question.
  - Twenty draws may be too few at cells where the within-family spread is large, in which case the
    interval comparison is under-powered and must be reported as such rather than as a narrow interval.
  interpretation_limits:
  - No null is asserted to be the correct one; this record measures disagreement and explicitly cannot
    adjudicate it in an environment that cannot read the relevant literature.
  - A wide interval does not refute H-ARGON-ef2f0b; it means that hypothesis's statement must name
    its denominator, which is a repair.
  - All numbers are heuristic upper bounds inherited from the lane's existing greedy instrument and
    are not exact minima.
  - p=1 and toy q only; nothing here is at a recommended parameter set.
  - The interval is over exactly four declared nulls and is not a bound over all possible nulls.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement is one greedy pass per graph, O(q^2)
      worst case, times eighty-one graphs per cell.
    memory_exponent: No attack exponent is claimed. Each graph is O(q) integers and only one is held
      at a time.
    best_known: The incumbent is the single window-matched uniform null specified by H-ARGON-ef2f0b
      and EXP-ARGON-2608c2, whose adequacy EV-ARGON-209ece records as an explicit unresolved confound
      raised independently by the red team. There is no incumbent interval, because no record here
      has ever varied the null.
    hidden_overhead: 'The rewiring sampler and its mixing check are shared with the companion live-set
      record and are the main hidden implementation cost. The larger hidden cost is interpretive:
      producing four rho values without also producing the argument for which one answers which question
      would leave the lane worse off than one convention, so the stage-6 write-up is load-bearing
      and is not free.'
  dominated_by: 'n/a (no result claimed). Pareto check performed: the ten proposals under RQ-ARGON-141710
    were enumerated and read, EV-ARGON-209ece contains no measurement, and experiments/EXP-ARGON-2608c2/runs/
    is empty, so no time, memory or data/query frontier row exists under this question. On the measurement-validity
    axis, the incumbent is a single unvaried null with a recorded unresolved confound against it,
    which is not a frontier row this can be dominated by.'
  sota_delta: No attack; control and measurement-validity contribution only. The quantitative delta
    is the width of the rho interval in rho units, compared against the 0.30 gap between H-ARGON-ef2f0b's
    own confirm and falsify thresholds. If the interval is narrower than 0.30 the lane's existing
    predictions are well-posed and this record's cost buys that assurance; if it is wider, every rho
    in the lane is currently reported without the parameter that most determines it.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the four-null interval exceeds the within-family spread: high, around
    0.85, because the four nulls differ in structure far more than twenty draws of one null differ
    from each other. That the interval exceeds 0.30 rho units and therefore straddles H-ARGON-ef2f0b''s
    own thresholds: moderate, around 0.55 -- the full-history and rewiring nulls should sit far apart,
    but greedy-heuristic error could compress everything toward each other. That the predicted directions
    hold for the full-history and rewiring nulls specifically: around 0.7 each, independently. That
    all four move consistently with t: around 0.5, and a divergence there would be the most interesting
    single outcome, since it would show the lane has been calling four different quantities by one
    name.'
