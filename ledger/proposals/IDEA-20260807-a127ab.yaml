  recommended_priority: high

  honest_prior_of_survival: >-
    0.99 that the transport theorem and the certificate arm hold exactly -- it is
    elementary algebra and the only risk is an implementation bug. 0.90 that the
    Mode B cost independence from S reproduces. 0.60 that the Mode A crossover
    lands within a factor 4 of 0.207*N^{1/3} at toy scale, where the constants
    are not asymptotic. 0.02 that the family frontier product ever measures below
    N, and that outcome would be a measurement error before it was anything
    else. ~0.00 that any of it produces an attack improvement: the honest
    expected headline is "one table serves the class, exactly, cheaply, and it
    buys nothing anyone can use", which is a real result under
    docs/inventor-protocol.md section 4 and is filed as one.

