idea:
  id: IDEA-20260815-ad4b55
  question_id: RQ-SDEG-001
  added: '2026-08-15'
  title: >-
    SEMAEV SYSTEMS ARE SOLVED WITH ONE MONOMIAL ORDER BY CONVENTION AND
    SOLVING DEGREE IS ORDER-DEPENDENT: measure the spread across orders
    before fitting any scaling law to one of them
  class: measurement

  claim: >-
    Groebner solving degree and cost depend strongly on the monomial order,
    and the lane fixes one by convention. A scaling law fitted under one
    order describes that order. Measuring the spread across degrevlex, lex
    and block orders at fixed instance shows how much of the lane's cost
    model is a convention rather than a property of the system.

  mechanism: >-
    Solve the same frozen Semaev instances under several monomial orders,
    recording solving degree, operations and wall clock per order. Report
    the spread and whether the fitted scaling exponent differs across
    orders.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'monomial order', 'degrevlex', 'lex', 'block order'; read of
      the SDEG protocol's declared solver settings.
    results: >-
      Solver settings appear in run manifests; no record measures the
      spread across orders or fits the scaling law under more than one.
    verdict: >-
      ADAPTATION. Order-dependence of Groebner cost is textbook; the
      contribution is measuring its effect on this lane's cost model
      before that model is used in an exponent comparison.

  object_first_candidate:
    tracked_object: >-
      SOLVING DEGREE AND COST as functions of the monomial order, at fixed
      instance.
    lossiness: >-
      Fixing an order projects the system's difficulty onto one
      presentation, which is defensible only if the projection does not
      move the fitted exponent.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while several orders complete within budget; orders that
      time out are reported as unmeasured rather than as slow, per
      AGENTS.md rule 3.

  null_object_control: >-
    NULL 1 -- the same order run twice, bounding solver variance so that
    order differences below it are not read as real. NULL 2 -- a random
    dense system of matched shape under the same orders, giving the order-
    sensitivity expected without curve structure.

  discriminated_from:
    - >-
        The three-degree gap record in this series, which asks which
        degree quantity is reported; this asks which order it was measured
        under. Both are instrument questions about the same number.
    - >-
        The curve-model invariance record in this series, which varies the
        curve's presentation; this varies the solver's.

  assumptions:
    - >-
        Several monomial orders complete on the frozen instances within
        budget, which is uncertain for lex specifically.
    - >-
        Solving degree is comparable across orders, which holds by
        definition but whose interpretation differs since the degree means
        something different under each order.

  predictions:
    - metric: >-
        same-order repeated run
      direction: different
      minimum_effect: >-
        Bounds solver variance; order differences below it are not real.
    - metric: >-
        solving degree and cost spread across orders
      direction: different
      minimum_effect: >-
        The measurement; a large spread means the lane's cost model is
        order-specific.
    - metric: >-
        fitted scaling exponent under each order
      direction: different
      minimum_effect: >-
        The decision-relevant comparison; if the exponent moves across
        orders the lane must report which order its model belongs to.
    - metric: >-
        orders that time out
      direction: different
      minimum_effect: >-
        Reported as unmeasured, never as evidence that the system is
        hard under that order.

  minimal_test:
    design: >-
      Three orders on the lane's smallest frozen instance set, both nulls.
    controls:
      - >-
          Same-order variance null.
      - >-
          Random dense matched-shape null.
      - >-
          Timeouts recorded as unmeasured per AGENTS.md rule 3.
      - >-
          Order recorded in every run manifest so past runs can be
          placed retrospectively.
    required_metrics:
      - >-
          Solving degree, operations and wall clock per order and
          instance.
      - >-
          Spread across orders against solver variance.
      - >-
          Fitted exponent per order.
      - >-
          List of order-instance cells that timed out.

  falsification_conditions:
    - >-
        Solver variance swamps order differences. The comparison is
        underpowered and the required instance count must be reported.
    - >-
        The fitted exponent is stable across orders. The lane's convention
        is immaterial, which is a clean result that removes a whole class
        of objection to its cost model.
    - >-
        The fitted exponent moves across orders. The lane's cost model is
        order-specific and every downstream use must say which order it
        belongs to.
    - >-
        Only one order completes. The comparison cannot be made and the
        lane's convention is forced rather than chosen, which should be
        stated as such.

  confounders:
    - >-
        TIMEOUT ASYMMETRY: lex commonly times out where degrevlex
        completes, and treating that as evidence about difficulty rather
        than as a missing measurement would violate AGENTS.md rule 3.
    - >-
        DEGREE INCOMPARABILITY: solving degree under different orders is
        not the same quantity, so the spread must be interpreted alongside
        operations and wall clock rather than alone.

  interpretation_limits:
    - >-
        Measures an instrument convention; produces no cost model of its
        own.
    - >-
        Scoped to the tested orders, instances and solver implementation.
    - >-
        A stable exponent across orders supports the lane's convention at
        this scope only.

  heuristic_assumptions:
    - id: HEUR-SDEG-ORD-1
      statement: >-
        The scaling exponent fitted to Semaev decomposition cost is
        independent of the monomial order used to solve.
      rigorous_support: >-
        Rigorous ingredient: the ideal and its variety are order-
        independent, so the underlying problem does not change. THE GAP:
        solving degree and solver cost are properties of the algorithm
        and the presentation, not of the ideal, and the classical worst-
        case gap between lex and degrevlex cost is enormous -- so
        exponent stability is a genuinely open empirical question rather
        than a consequence.
      falsification_condition: >-
        Fitted exponents differing across orders beyond their confidence
        intervals.
      validation_plan: >-
        SAMPLE: >= 3 orders x the frozen instance set x >= 5
        repetitions. COMPARISON: fitted exponent per order with
        intervals. TAIL CHECK: the order with the highest cost, checked
        for timeout-induced censoring which would bias its fit.
        TRANSFER: none beyond the tested instances.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is the lane's existing solves repeated under
      additional orders.
    memory_exponent: >-
      Groebner-dominated; lex may exceed the memory budget entirely.
    best_known: >-
      The incumbent is the lane's single-order measurement, whose order-
      dependence this record quantifies.
    hidden_overhead: >-
      Lex is likely to time out or exhaust memory, which censors exactly
      the order whose cost differs most and biases any spread estimate.
    tradeoff_note: >-
      More orders buys a robustness result and costs solves that may not
      complete; timeouts are reported rather than interpreted.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As algebra: entirely dominated by the
    classical literature on order-dependence of Groebner cost. As a
    measurement on this lane's cost model: none exists. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: solving degree and cost
    measured across monomial orders on the lane's frozen instances, the
    fitted scaling exponent under each, and an explicit record of which
    order-instance cells could not be measured at all.

  estimated_cost:
    implementation: low
    compute: high
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that degrevlex and one block order complete. 0.3 that lex completes
    at all, which is the censoring risk. 0.6 that the fitted exponent is
    stable across the orders that do complete, which would remove a real
    objection to the lane's cost model.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-SDEG-001
    - KN-OPEN-002
    - GOAL-SDEG-001
    - GOAL-ICEX-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
