idea:
  id: IDEA-20260816-b0046a
  question_id: RQ-QRUOV-001
  added: '2026-08-16'
  title: 'One statistic, four schemes, one null: measure the rank distribution of uniformly random
    elements of the F_q-span of a public key''s coefficient matrices, and report it as a fingerprint
    per scheme against a matched random symmetric matrix space of identical dimension.'
  class: representation
  claim: '(A) A UOV-family public key is a space of quadratic forms, and the cheapest intrinsic thing
    one can say about a space of forms is how the rank of a random element is distributed. That single
    distribution is computable in seconds from a public key with no secret and no solver, it is invariant
    under change of basis in the equation space, and it is the common currency in which four schemes
    with four different compression mechanisms can be placed side by side. No record in this repository
    has computed it for any of them. (B) The claim under test is that the four schemes have visibly
    different rank fingerprints and that each deviates from the matched null - a uniformly random
    space of symmetric matrices of the same dimension over the same field - in a direction predicted
    by its transform: the quotient-ring and noncommutative-ring schemes should show rank quantisation,
    with ranks concentrated on multiples of the algebra dimension because every matrix in the span
    is built from ell by ell blocks that are themselves constrained; the whipped scheme should show
    a rank distribution shifted upward proportionally to k; and plain UOV should be indistinguishable
    from the null except for the deficiency forced by the oil space. (C) The deliverable is a fingerprint
    table and, more usefully, a statement of which schemes are distinguishable from a random form
    space by a computation that costs seconds and needs nothing secret. (D) NOT CLAIMED: distinguishability
    of a public key from a random form space is NOT a break, not an attack, and not a security consequence
    - for the structured schemes the structure is public by design, so a fingerprint reflecting it
    is expected, and the interesting content is the QUANTITATIVE shape and any deviation from what
    the transform alone predicts. No exponent and no statement about deployed parameters.'
  mechanism: 'STAGE 1, define the statistic. For a public key with m coefficient matrices P_1..P_m
    over F_q, draw a uniformly random c in F_q^m, form the combination sum c_i P_i, and record its
    rank. Repeat to build an empirical rank histogram; the statistic is that histogram, normalised.
    STAGE 2, closed-form null. The rank distribution of a uniformly random symmetric matrix over F_q
    is known in closed form as a q-analogue expression; the null arm is a uniformly random m-dimensional
    space of symmetric matrices, whose combination ranks should follow that law exactly. STAGE 3,
    four arms. Compute the histogram for a plain UOV key, a QR-UOV-shaped key, a SNOVA-shaped key,
    and a MAYO-shaped whipped key, all at matched flattened dimensions so the histograms are comparable,
    in one invocation with one rank routine. STAGE 4, predicted deviations. For each transform, write
    down before measuring what the transform alone forces: a block structure of size ell forces ranks
    divisible by ell in the pure cases; an oil space of dimension o forces rank at most n - o for
    some combinations; whipping forces a k-fold repetition of the underlying spectrum. STAGE 5, discrepancy.
    Report the measured histogram, the transform-forced prediction, and the residual. The residual
    is the object: it is whatever the public key shows that the transform alone does not explain.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-QRUOV-001 and H-QRUOV-e8ae3e in full. Grepped ledger/proposals/ for 'rank spectrum'
      (hits IDEA-20260808-d07cd4 and IDEA-20260805-bd8339, both QR-UOV) and 'rank distribution' (hits
      IDEA-20260808-0b3072, IDEA-20260813-28cf9c, IDEA-20260813-c9bec2, IDEA-20260727-007, IDEA-20260805-e5dd09,
      IDEA-20260805-bb9f73, IDEA-20260807-44ba75, IDEA-20260807-13c821 - only bb9f73 is in this bucket).
      Read titles of all multivariate-slice proposals from the family grep, in particular IDEA-20260808-348896,
      IDEA-20260808-ae175e and IDEA-20260805-54723a.
    results: IDEA-20260805-bd8339 and H-QRUOV-e8ae3e P1 give a closed-form rank law for the block
      algebra elements W*phi(a), namely ell - deg gcd(a, f) - that is the rank spectrum of a SINGLE
      BLOCK as a function of the quotient polynomial, not of a random combination of the m public
      matrices. IDEA-20260808-ae175e factors the whipped public form's rank as a product over a Kronecker
      decomposition, for MAYO only. IDEA-20260808-348896 defines a Frobenius twist-support profile
      as a publicly computable SNOVA invariant. IDEA-20260805-54723a computes the multiplier algebra
      as a SNOVA invariant with a matched null. All of these are single-scheme invariants; bd8339's
      is a per-block law rather than a distribution over the public span. No record computes the rank
      distribution of random elements of the public span, and none applies one statistic across all
      four schemes with a shared null.
    verdict: 'UNVERIFIED. No claim is made about published literature, where rank statistics of structured
      matrix spaces are a natural object and may well be treated. Assembled from known parts: the
      q-analogue rank law for random symmetric matrices is classical; the per-block rank law is H-QRUOV-e8ae3e''s;
      the Kronecker factorization is IDEA-20260808-ae175e''s. Claimed new relative to the in-repo
      corpus only: one statistic computed identically across four schemes plus a shared matched null,
      with a transform-forced prediction subtracted so that the reported object is the residual rather
      than the raw histogram.'
  object_first_candidate:
    tracked_object: The rank of a uniformly random F_q-combination of the public coefficient matrices,
      tracked as an empirical distribution over the equation-space coefficient vector, and the residual
      of that distribution after the transform-forced component is subtracted.
    lossiness: 'Lossy, heavily. From an m-dimensional space of n by n forms we retain a histogram
      over at most n+1 bins, discarding every eigenstructure, every kernel, the oil space, and all
      coordinates. This is compatible with the tracked operation because the rank of a combination
      is invariant under simultaneous congruence of all P_i and under change of basis in the equation
      space, so the histogram is a genuine invariant of the object rather than of its presentation
      - which is precisely why it can be compared across four schemes with different natural coordinates.
      Not a change of coordinates: n+1 numbers cannot rebuild an m-dimensional space of forms.'
    propagation: 'One step of the target operation is applying one transform to the key. Propagation
      rule on the histogram: an algebra of dimension ell replaces each scalar entry by an ell by ell
      block, so ranks are predicted to become divisible by ell; whipping by k concatenates k copies
      of the underlying space, so the predicted rank of a combination is k times the underlying rank
      for combinations that act uniformly across blocks; seed compression changes no coefficient matrix
      and is predicted to leave the histogram exactly invariant, which is the sharpest and cheapest
      falsifiable prediction in the set.'
    survival_score: 'The histogram survives the application of each transform with a predicted deformation,
      and the concrete statement is how many transform applications preserve identifiability: the
      experiment reports whether a doubly transformed key - say whipped and then ring-compressed,
      using the composites of the transform table - still has a histogram distinguishable from the
      null, and at which composite the fingerprint dissolves into the null.'
  null_object_control: The null object is a uniformly random m-dimensional space of symmetric n by
    n matrices over F_q, with no oil space and no algebra structure, sampled and measured by the identical
    rank routine in the same invocation. For any scheme's fingerprint to mean anything, the null arm
    must reproduce the closed-form q-analogue rank law for random symmetric matrices within its sampling
    interval; if it does not, the rank routine or the sampler is wrong. A second, sharper null is
    a random space of symmetric matrices constrained ONLY to have a common isotropic subspace of dimension
    o, which isolates the oil space's contribution from the compression's.
  discriminated_from:
  - 'IDEA-20260805-bd8339 and H-QRUOV-e8ae3e P1 (rank of W*phi(a) equals ell - deg gcd(a, f)): a per-block
    closed-form law for one algebra element; this measures the rank distribution of random combinations
    of the full public matrices, which the per-block law constrains but does not determine.'
  - 'IDEA-20260808-ae175e (Kronecker factorization of the whipped form''s rank): a MAYO-only structural
    factorization used to get a key-free distinguisher on the emulsifier; this is a cross-scheme distributional
    statistic and uses that factorization as one of its four transform-forced predictions rather than
    as its claim.'
  - 'IDEA-20260808-348896 (Frobenius twist-support profile) and IDEA-20260805-54723a (multiplier algebra):
    SNOVA-only invariants with different definitions; neither is a rank distribution and neither is
    computed for the other three schemes.'
  - 'MinRank attacks as named in RQ-QRUOV-001 and RQ-SNOVA-001: those SEARCH for a low-rank element
    and are cost claims; this samples uniformly and reports a distribution, makes no search, and would
    be a poor search if used as one.'
  - 'IDEA-20260808-2b4581 (structure-discount ledger): a cross-scheme cost table; this is a cross-scheme
    structural statistic with no cost content.'
  assumptions:
  - The rank of a random combination is computed exactly over F_q with no tolerance.
  - Matched flattened dimensions across arms make the histograms comparable; where an exact match
    is impossible the mismatch is reported rather than papered over.
  - The recalled transform definitions are correct in shape, since each transform-forced prediction
    depends on them.
  - Sampling 10^5 combinations per key is enough to resolve histogram differences of the predicted
    size, which the null arm's agreement with the closed-form law verifies directly.
  - Characteristic-2 alternating-versus-symmetric conventions are applied identically to every arm.
  predictions:
  - metric: null arm histogram versus the closed-form q-analogue rank law for random symmetric matrices
    direction: different
    minimum_effect: 'forced: agreement within the sampling interval, else the instrument is void'
  - metric: fraction of sampled combinations whose rank is divisible by ell, in the ring-structured
      arms versus the null
    direction: higher
    minimum_effect: 0.5
  - metric: histogram of a seed-compressed key versus the same key uncompressed
    direction: different
    minimum_effect: 'forced: exactly identical, since seed compression changes no coefficient matrix;
      any difference means the compression was implemented as something other than a representation
      change'
  - metric: total variation distance between each scheme's histogram and the isotropy-only null
    direction: higher
    minimum_effect: 0.05
  minimal_test:
    design: 'One field, four arms, one afternoon. Take q = 4 and flattened n = 12, m = 6, oil dimension
      o = 6 where applicable. Construct: a plain UOV key; a QR-UOV-shaped key with ell = 2 and deg
      f = 2; a SNOVA-shaped key with ell = 2; a MAYO-shaped whipped key with k = 2 over an underlying
      map with n = 6; a uniformly random symmetric 6-dimensional matrix space; and an isotropy-only
      random space with a common 6-dimensional isotropic subspace. For each, draw 10^5 uniform coefficient
      vectors, compute the rank of the combination exactly, and histogram. That is 6 by 10^5 rank
      computations on 12 by 12 matrices over F_4, a few minutes in pure Python. Report six histograms,
      the closed-form null law, the divisibility-by-ell fractions, and pairwise total variation distances.
      Discrimination is immediate: if the structured arms show rank quantisation and the null does
      not, the fingerprint exists; if all six histograms coincide, the statistic is blind at these
      parameters and that is a clean, reusable negative about the statistic itself.'
    controls:
    - Uniformly random symmetric matrix space of identical dimension, measured by the identical routine
      in the same invocation.
    - Isotropy-only null with a planted common isotropic subspace but no algebra structure, isolating
      the oil space's contribution.
    - 'Seed-compression invariance control: the same key with and without seed compression must give
      byte-identical histograms.'
    - 'Congruence-invariance control: apply a random invertible congruence to all P_i and confirm
      the histogram is unchanged, which is what makes it an invariant rather than a coordinate artifact.'
    - 'Equation-basis control: replace the P_i by a random invertible linear recombination of themselves
      and confirm the histogram is unchanged.'
    required_metrics:
    - normalised rank histogram per arm
    - closed-form q-analogue null law values
    - fraction of ranks divisible by the algebra dimension ell
    - pairwise total variation distances between arms
    - residual after subtracting the transform-forced prediction
    - invariance-control agreement
  falsification_conditions:
  - The null arm does not reproduce the closed-form q-analogue rank law, voiding the instrument.
  - The seed-compression invariance control shows any histogram difference at all.
  - The congruence or equation-basis invariance controls change the histogram, meaning the statistic
    is not an invariant.
  - All four scheme arms coincide with the isotropy-only null, falsifying the fingerprint claim and
    recording the statistic as blind at these parameters.
  - Rank quantisation modulo ell appears in the null arm, meaning the effect is a property of the
    dimensions rather than of the algebra.
  confounders:
  - Flattened dimensions not exactly matched across arms, producing histogram differences that are
    purely dimensional; mitigated by reporting the dimension of every arm and by excluding cells where
    an exact match is impossible.
  - Characteristic-2 conventions making 'symmetric' mean different things in different arms; mitigated
    by a single form-construction routine shared by all arms.
  - Sampling noise being read as a small tail difference; mitigated by the closed-form null check
    and by 10^5 samples with reported intervals.
  - Rank quantisation being forced by the block dimensions alone rather than by the algebra; mitigated
    by a block-shaped-but-algebra-free control if the Coordinator adds one, which is listed as a derivation
    gap.
  - Interpreting distinguishability as a weakness when the structure is public by design, which the
    claim ceiling forbids explicitly.
  interpretation_limits:
  - Distinguishing a structured public key from a random form space is expected and is not a security
    statement of any kind.
  - The histogram is one invariant among many; agreement between two arms does not mean the objects
    are equivalent.
  - All measurements are at toy flattened dimensions and do not transfer to deployed parameter sets.
  target_complexity:
    time_exponent: No attack exponent is claimed. The statistic costs one n by n rank computation
      per sample, so O(S * n^3) field operations for S samples, with n <= 16 and S = 10^5.
    memory_exponent: No attack memory exponent is claimed; one matrix and one histogram are held at
      a time.
    best_known: The incumbent invariants for these objects, in this repository, are IDEA-20260808-348896's
      Frobenius twist-support profile and IDEA-20260805-54723a's multiplier algebra, both SNOVA-only,
      and H-QRUOV-e8ae3e's per-block rank law, QR-UOV-only. There is no cross-scheme statistic and
      no attack incumbent applies, since none is proposed.
    hidden_overhead: 'The hidden cost is dimensional matching: making four schemes comparable requires
      choosing parameters where the flattened dimensions agree, and the set of such parameters is
      small and awkward, so the honest experiment reports a few cells rather than a clean grid. A
      second overhead is that rank quantisation may be forced by block dimensions rather than by algebra,
      and separating those needs an extra control that is not free to construct.'
  dominated_by: n/a (no result claimed). Checked against every attack frontier row named across RQ-QRUOV-001,
    RQ-SNOVA-001 and RQ-MAYO-001 - rectangular MinRank and its structure-aware refinements, wedge-product,
    group-action stability, intersection and reconciliation - on time, memory and query axes; none
    is comparable because a rank histogram is not a cost and this proposal supplies no search.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a normalised rank histogram per scheme with pairwise total variation distances against two nulls,
    plus a residual against each transform's forced prediction.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A (the statistic is a genuine invariant and is cheaply computable):
    0.9, since congruence and equation-basis invariance are immediate and the controls will confirm
    them. Part B, first half (the four schemes have visibly different fingerprints): 0.75, because
    the block structures are strong and should show up; the risk is that at matched flattened dimensions
    the differences shrink into sampling noise. Part B, second half (each deviation matches the transform-forced
    prediction, so the residual is zero): 0.3, low on purpose - I expect a nonzero residual somewhere,
    and that residual is the only part of this proposal that could turn into a new object rather than
    a confirmation.'
