idea:
  id: IDEA-20260901-949d55
  question_id: RQ-SHAONE-081e3a
  research_question: RQ-SHAONE-081e3a
  goal_id: GOAL-SHA1-001
  added: '2026-09-01'
  title: >-
    THE CHOSEN-PREFIX BIRTHDAY PHASE IS A NEAR-COLLISION SEARCH OVER r CONSTRAINED
    DIFFERENCE COORDINATES, SO ITS TRUE COST IS A TIME-MEMORY FRONTIER, NOT A
    POINT: apply Leurent's generic near-collision time-memory lower bound as the
    external structural ingredient to state the birthday phase's MEMORY EXPONENT
    and the time penalty of low-memory operation that the flat GPU-hour figure
    hides, and calibrate the frontier at MD5 and truncated scale where it is
    exhaustively verifiable.
  class: measurement
  claim: >-
    FIVE SEPARABLE CLAIMS. (A) THE OBJECT. The birthday phase of a chosen-prefix
    collision does not seek an exact collision; it seeks two chains whose
    chaining-value difference lands in the ALLOWABLE set of differences reducible
    to zero by the subsequent near-collision-block chain -- i.e. a collision on r
    constrained coordinates out of 160, which is exactly a near-collision search.
    (B) THE INGREDIENT. Leurent's generic near-collision complexity (KN-LIT-7165)
    gives, for a near-collision over r coordinates, a TIME-MEMORY FRONTIER: the
    memory-heavy regime attains the birthday time ~2^{r/2} but pays with 2^{r/2}
    memory accesses, while low-memory regimes (truncation-based and covering-code-
    based) attain a stated LARGER time for a stated SMALLER memory. This is the
    external structural fact that converts the birthday phase from a quoted time
    into a frontier T(M). (C) THE CHARGE. The Shambles chosen-prefix figure is
    quoted as a time with negligible memory; charging the birthday phase via the
    frontier states its memory exponent m (the distinguished-point table size that
    sets the operating point) and the TIME PENALTY of running at polynomial memory
    instead, plus the van Oorschot-Wiener interpolation position. The claim is that
    the memory-charged operating point differs from the quoted point by a stated
    amount in at least one of time or memory. (D) WHAT IS NOT CLAIMED: no attack,
    no new collision, no dollar figure, no assertion that the published time is
    wrong; the published time may sit exactly on the cheap end of the frontier,
    and demonstrating that IS a valid outcome. A memory exponent stated for the
    birthday phase is a statement about the birthday phase under the declared cost
    model, in SHA-1 compression-function evaluations with memory beside time. (E)
    The frontier is falsifiable where a point is not: measured T(M) at MD5 and
    truncated scale either matches Leurent's predicted frontier shape or it does
    not, independently of any SHA-1 number.
  mechanism: >-
    STAGE 0 (gating, per RQ constraint): the Shambles paper (for r, the allowable-
    set structure, and the quoted birthday-phase split) and Leurent's near-
    collision TMTO paper must be filed as KN-LIT at stated provenance; this session
    holds them at snippet level (WebSearch) and corpus-title level (KN-LIT-7165).
    STAGE 1: parameterize the birthday phase by r (number of constrained
    difference coordinates) and by the allowable-set structure (a coset/union of
    cosets of the DV-reachable difference lattice); state r from the published
    attack once primary text is filed. STAGE 2: instantiate Leurent's two low-
    memory regimes -- truncation-based and covering-code-based -- and the memory-
    heavy distinguished-point regime, writing each as an explicit T(M) with the
    cost model declared (compression-function evaluations for time; table entries,
    with a stated per-access cost, for memory). STAGE 3: at MD5 scale (via
    GOAL-MD5-001's pipeline) and at truncated-output analogue widths where the full
    function graph is enumerable, MEASURE T at several M and check against the
    predicted frontier, including the exhaustively-computed ideal near-collision
    complexity as the denominator. STAGE 4: report the memory exponent m of the
    quoted operating point, the time penalty T(poly-memory)/T(quoted-memory), and
    the van Oorschot-Wiener interpolation T ~ sqrt(N^3/w) position for target-set
    size N and memory w. STAGE 5, null control: run the identical frontier
    measurement against a near-collision over r RANDOM coordinates (uniform
    allowable set of matched size), so any deviation of the structured allowable
    set from the generic frontier is isolated from the generic near-collision cost
    itself. STAGE 6: verify every produced collision by direct recomputation and
    emit certificates only for objects actually computed (MD5-scale and truncated).
  novelty_status: unverified
  citations:
    - ref: KN-LIT-7165
      provenance: kb
      claim: >-
        Generic near-collision algorithms split into memory-heavy (attaining the
        birthday bound but with 2^{n/2} memory accesses) and low-memory regimes
        based on truncation or covering codes that trade more hash evaluations for
        less memory -- the time-memory frontier this record applies to the
        birthday phase.
      verified_by: >-
        Read the corpus entry (title/abstract level) this session; primary PDF not
        opened and must be filed as KN-LIT before STAGE 2.
    - ref: eprint 2020/014 (Leurent, Peyrin, SHA-1 is a Shambles)
      provenance: retrieved
      claim: >-
        Chosen-prefix collision at 2^63.4 quoted as GPU time; the birthday phase
        searches for a chaining-value difference in an allowable set (near-
        collision), and memory is reported as negligible.
      verified_by: >-
        WebSearch 2026-09-01 (eprint and USENIX abstract level); the r value and
        allowable-set structure must be read from primary text before use.
    - ref: van Oorschot and Wiener, Parallel collision search with cryptanalytic applications
      provenance: recalled
      claim: >-
        RECALLED, NOT OPENED. Distinguished-point parallel collision search with
        memory w attains time ~sqrt(N^3/w) for a golden-collision-style search,
        the interpolation used to place the frontier.
      verified_by: null
    - ref: KN-TECH-066
      provenance: internal
      claim: >-
        Frame for the near-collision-block chain that defines the allowable
        difference set the birthday phase must hit.
      verified_by: Read in full this session.
  novelty_screen:
    method: >-
      Filesystem and ledger screening only; crypto-kb index empty and not
      callable. Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full and the claim
      blocks of all 18 existing RQ-SHAONE proposals. Read in full
      IDEA-20260816-71d4dd (birthday-phase distinguished-point table efficiency
      eta), IDEA-20260828-521e40 (near-collision-block resident memory), and
      IDEA-20260816-962936 (elasticity cost model). Read KN-LIT-7165, KN-TECH-066,
      and the SHA-1 frontier rows.
    results: >-
      IDEA-20260816-71d4dd measures the achieved-versus-ideal EFFICIENCY eta of a
      distinguished-point search as a function of table memory, node count, and
      interconnect, at truncated scale; it charges the birthday phase's realized
      inefficiency but does NOT invoke a generic near-collision time-memory lower
      bound and does not state a memory EXPONENT or a T(M) frontier -- it measures
      a dimensionless efficiency at operating points, not the frontier those points
      lie on. IDEA-20260828-521e40 charges the near-collision-BLOCK search's
      resident memory, a different phase. IDEA-20260816-962936 takes memory price
      as a cost-model input. No corpus record applies Leurent's near-collision TMTO
      (truncation / covering-code regimes) to the birthday phase or states its
      memory exponent.
    verdict: >-
      UNVERIFIED. The van Oorschot-Wiener interpolation and distinguished-point
      search are standard, and IDEA-20260816-71d4dd already charges birthday-phase
      efficiency empirically, so the memory-charging DIRECTION is established in
      the corpus. What is new is the specific external ingredient -- Leurent's
      generic near-collision time-memory lower bound with its truncation and
      covering-code regimes -- used to state the birthday phase's memory exponent
      and the low-memory time penalty as a frontier, which no committed record
      carries. No primary source was opened; unverified is the honest label.
  object_first_candidate:
    tracked_object: >-
      THE OPERATING POINT (M, T) OF THE BIRTHDAY-PHASE NEAR-COLLISION SEARCH ON
      LEURENT'S TIME-MEMORY FRONTIER, followed as the memory budget M is varied.
      Established families declared OFF-LIMITS as the primary lens: the achieved-
      efficiency eta at fixed operating points; the near-collision-block resident
      footprint; the dollar/elasticity cost model. This record follows the FRONTIER
      the operating points lie on, not one point's efficiency.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The projection retains only (memory
      occupied, compression-function evaluations spent) and the constrained-
      coordinate count r, discarding trail contents, chaining values, and message
      words. It is compatible with the search's operation because the frontier is a
      function of r and M alone under a fixed algorithm family, so (M, T)
      propagates as the search runs. What is discarded -- the actual trails -- is
      recovered only for the certificate of any collision found, which is retained
      separately.
    propagation: >-
      One step is one compression-function evaluation; it advances T by one and
      leaves M at the declared budget (or grows the table until the budget caps
      it, forcing eviction that raises T). The frontier is traced by re-running at
      several M; the object's trajectory across M is the deliverable.
    survival_score: >-
      Survives across the full birthday phase at any tested scale. Dissolves as a
      clean single-phase object where birthday and near-collision-block phases
      interleave (a block-search restart forcing re-entry into the birthday
      phase), at which point (M, T) attribution to the birthday phase alone becomes
      ambiguous and must be resolved by a declared rule -- a boundary shared with
      IDEA-20260816-8e0b9c's phase-attribution object and reported, not assumed.
  proof_search_map:
    bottleneck: >-
      Whether the birthday phase's quoted negligible-memory time is a point on a
      time-memory frontier whose low-memory regime costs materially more time.
      Removing the "negligible memory" assumption converts the quoted figure into
      a memory-charged frontier, which is the RQ's second target.
    baseline_embedding:
      parameter_slice: >-
        The memory-heavy regime at M ~ 2^{r/2} must reproduce the birthday bound
        time ~2^{r/2} that the quoted figure uses, so the quoted point is the M ->
        large end of the frontier.
      reproduction_check: >-
        A frozen fixture at truncated scale: the memory-heavy operating point's
        measured T matches the exhaustively-computed ideal near-collision time
        within a pre-declared factor, anchoring the frontier's cheap end.
    observation_collision:
      observable: >-
        The pair (memory exponent m, time exponent t) of an operating point.
      distinct_preimage_search: >-
        Two allowable-set structures with the same r but different frontier shapes
        would show r alone does not determine the memory exponent; searching over
        allowable-set structures (single coset versus union of cosets) is the test,
        and a difference localizes the memory exponent to the set's structure, not
        just its size.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Recast the birthday phase as a generic near-collision search over r
          coordinates and import Leurent's frontier, with encoding (allowable set
          as constrained coordinates), transfer (structured versus generic set via
          the null arm), and cost-loss (per-memory-access charge) obligations kept
          separate.
        predicted_gain: >-
          Replaces a single negligible-memory time with a stated T(M) frontier and
          a memory exponent, chargeable and falsifiable at scale.
    quantifier_order: >-
      EXPLICIT. There EXISTS a memory budget M (polynomial, or a declared bound)
      at which the birthday-phase time is T(M) strictly above the quoted time by a
      stated factor -- established by measuring the frontier. The complementary
      positive form: for the quoted operating point, memory M equals the stated
      exponent m, scoped to the declared algorithm family and cost model.
    method_ceiling:
      strongest_certifiable_claim: >-
        The birthday phase's memory exponent and time-memory frontier under the
        declared algorithm family (distinguished-point, truncation, covering-code)
        and cost model, calibrated at MD5 and truncated scale. It cannot certify
        the absolute SHA-1 birthday-phase cost, nor rule out an unstated algorithm
        outside the family, nor say anything about the near-collision-block phase
        or the detector.
      nearby_object_control: >-
        A near-collision over r RANDOM coordinates (generic allowable set): the
        method must reproduce Leurent's generic frontier there, and a structured-
        set frontier is meaningful only as a deviation from it.
    proof_obligations:
      - claim: The memory-heavy regime reproduces the birthday-bound time.
        responsibility: baseline
      - claim: The measured T(M) matches the predicted frontier at truncated scale.
        responsibility: correctness
      - claim: The per-memory-access cost is stated and included in the charge.
        responsibility: memory
      - claim: Scope is the declared algorithm family, cost model, and scales.
        responsibility: scope
  assumptions:
    - >-
      The allowable difference set is a coset or union of cosets of the DV-
      reachable lattice, so the birthday phase is a near-collision over a well-
      defined r; r is read from primary text, not assumed.
    - >-
      Leurent's frontier regimes (truncation, covering-code) apply to the allowable
      set's structure; where the structure differs, the null arm measures the
      deviation rather than the assumption being hidden.
    - >-
      Truncated-output analogues admit exhaustive computation of the ideal near-
      collision complexity, providing an exact frontier denominator.
  predictions:
    - metric: >-
        birthday_memory_exponent m at the quoted operating point (log2 table
        entries)
      direction: different
      minimum_effect: >-
        Reported as a number with the cost model stated; a value materially above
        the "negligible" the quoted figure implies is the charge the RQ seeks.
    - metric: >-
        low_memory_time_penalty: T(polynomial memory) / T(quoted memory) from the
        measured frontier
      direction: higher
      minimum_effect: >-
        A stated factor greater than 1; a penalty near 1 means low-memory operation
        is nearly free and the negligible-memory quotation is defensible, which is
        a valid outcome.
    - metric: >-
        frontier_shape_agreement: measured T(M) versus Leurent's predicted frontier
        at truncated scale
      direction: different
      minimum_effect: >-
        Within a pre-declared factor across the M grid; systematic deviation
        falsifies the frontier model for this search at this scale, independently
        of any SHA-1 number.
    - metric: >-
        structured_versus_random_frontier gap (structured allowable set minus r
        random coordinates)
      direction: different
      minimum_effect: >-
        Reported; a non-zero gap localizes the memory exponent to the allowable
        set's structure, a zero gap says the generic frontier suffices.
  minimal_test:
    design: >-
      SIX STEPS. STEP 0 (gating): file the Shambles and Leurent TMTO papers as
      KN-LIT; read r and the allowable-set structure. STEP 1 (truncated scale):
      pick a truncated compression function where the ideal near-collision
      complexity over r coordinates is exhaustively computable; compute it as the
      frontier denominator. STEP 2: implement the memory-heavy, truncation, and
      covering-code regimes over a shared compression kernel and a shared
      evaluation counter. STEP 3: measure T at several M in each regime; trace the
      frontier and anchor its cheap end to the ideal (baseline fixture). STEP 4
      (MD5 scale): repeat via GOAL-MD5-001's pipeline where full collisions are
      producible and verifiable. STEP 5: report the memory exponent of the quoted
      operating point, the low-memory time penalty, and the van Oorschot-Wiener
      position. STEP 6: run the random-coordinate null and report the structured-
      versus-generic gap; verify every collision by direct recomputation.
    controls:
      - >-
        IDEAL-DENOMINATOR ANCHOR (blocking): the memory-heavy regime's time must
        match the exhaustively-computed ideal near-collision complexity at
        truncated scale, or the frontier is mis-anchored.
      - >-
        RANDOM-COORDINATE NULL: near-collision over r random coordinates,
        reproducing Leurent's generic frontier, isolating structure from generic
        cost.
      - >-
        SHARED-KERNEL-AND-COUNTER CONTROL: all regimes share one compression
        kernel and one evaluation counter so a frontier difference is not an
        artifact of differential optimization.
      - >-
        CERTIFICATE CONTROL: every produced collision recomputed directly; only
        computed objects carry certificates.
    required_metrics:
      - birthday-phase memory exponent m at the quoted operating point
      - low-memory time penalty T(poly)/T(quoted)
      - measured T(M) frontier versus predicted, across the M grid
      - ideal near-collision complexity (exhaustive) at truncated scale
      - structured-versus-random-coordinate frontier gap
      - van Oorschot-Wiener interpolation position for the declared N and w
      - per-memory-access cost assumption, stated and varied
      - artifact manifest with seeds, kernel hash, and rebuild receipt
  falsification_conditions:
    - >-
      The memory-heavy regime's measured time does not match the exhaustively-
      computed ideal near-collision complexity at truncated scale. The frontier is
      mis-anchored or the implementation is wrong; no memory exponent is
      admissible until fixed. Blocking gate.
    - >-
      Measured T(M) does not follow Leurent's predicted frontier shape at truncated
      scale across the M grid. The frontier model does not apply to this search at
      this scale -- a scoped negative that itself resolves the RQ's charging
      question in the direction "the generic frontier is the wrong model here."
    - >-
      The low-memory time penalty is within measurement error of 1. Low-memory
      operation is nearly free, the negligible-memory quotation is defensible for
      this search, and the RQ's memory-charge concern is answered in the negative
      for the birthday phase -- a real, reportable outcome.
    - >-
      The structured allowable set's frontier equals the random-coordinate null.
      The memory exponent is generic in r and carries no allowable-set-specific
      structure.
  confounders:
    - >-
      PER-ACCESS MEMORY COST. A frontier in "table entries" ignores that a memory
      access is not a compression evaluation; MITIGATION: state a per-access cost
      and report the frontier in both raw entries and access-cost-weighted units,
      varying the assumption.
    - >-
      PHASE INTERLEAVING. Birthday-phase restarts triggered by near-collision-block
      failures muddy (M, T) attribution; MITIGATION: a declared attribution rule
      and a reported re-entry rate, shared with the phase-attribution object of
      IDEA-20260816-8e0b9c.
    - >-
      r IS READ FROM PRIMARY TEXT. Guessing r fabricates the exponent; MITIGATION:
      the memory exponent is reported as a function of r over a declared range
      until r is filed as KN-LIT, never at a guessed point.
    - >-
      TRUNCATED-SCALE TRANSFER. The frontier shape may differ between truncated
      analogue and full width; MITIGATION: no numeric extrapolation of the exponent
      to full SHA-1; the deliverable is the frontier shape and its scale, not a
      SHA-1 memory figure.
  interpretation_limits:
    - >-
      The memory exponent and frontier are scoped to the declared algorithm family
      (distinguished-point, truncation, covering-code), the declared cost model,
      and the tested scales. An algorithm outside the family could sit elsewhere.
    - >-
      This charges the BIRTHDAY phase only; the near-collision-block phase's memory
      is charged separately (IDEA-20260828-521e40) and must bind to the same
      charging convention (GOAL-SHA1-001 non-duplication; GOAL-RSA-001's memory
      convention where the two goals meet).
    - >-
      No dollar figure and no statement about any deployed system, per RQ
      claim_tier_ceiling. Cost is in SHA-1 compression-function evaluations with
      memory beside time.
  heuristic_assumptions:
    - id: H1
      statement: >-
        NEAR-COLLISION FRONTIER APPLICABILITY. The chosen-prefix birthday phase's
        cost as a function of memory M follows the generic near-collision time-
        memory frontier for r constrained coordinates, T(M) equal to Leurent's
        regime value for the allowable set treated as a generic constrained target
        of size 2^{160-r}.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the birthday phase provably seeks a difference in the
        allowable set (a near-collision on r coordinates), an exact structural
        fact about the attack. CLASSICAL STATEMENT IMITATED: the allowable set
        behaves, for search-cost purposes, like a generic target of its size, so
        the generic near-collision frontier (KN-LIT-7165) applies. THE GAP: the
        allowable set is a coset structure, not a generic target; the random-
        coordinate null measures whether that structure moves the frontier.
      validation_plan: >-
        SAMPLE: the birthday search at several M in each regime, at multiple
        truncated widths and at MD5 scale, plus the random-coordinate null.
        SHORTCUT: truncated-output analogues make the ideal near-collision
        complexity exhaustively computable, providing an exact frontier denominator
        that full SHA-1 cannot supply. COMPARISON: measured T(M) against Leurent's
        predicted frontier per regime; the structured-set frontier against the
        random-coordinate frontier. TAIL CHECK: the smallest-memory operating point
        (the low-memory tail), where the time penalty is largest and the frontier
        model is most stressed. TRANSFER: all sampled parameters (width, r,
        allowable-set structure, per-access cost) recorded; no extrapolation of the
        memory exponent to full SHA-1.
  target_complexity:
    time_exponent: >-
      Birthday-phase time ~2^{r/2} at the memory-heavy end, rising to Leurent's
      stated low-memory value as M falls; the record's product is the frontier
      T(M), not a single exponent.
    memory_exponent: >-
      THE HEADLINE DELIVERABLE: the memory exponent m of the quoted operating
      point (the distinguished-point table size), which the Shambles figure reports
      as negligible and this record states explicitly, with the low-memory time
      penalty T(poly)/T(quoted) and the van Oorschot-Wiener interpolation
      T ~ sqrt(N^3/w) beside it.
    best_known: >-
      The published chosen-prefix birthday-phase cost is quoted as a time with
      negligible memory; the corpus (IDEA-20260816-71d4dd) charges its realized
      efficiency but states no memory exponent or frontier.
    hidden_overhead: >-
      The o(1)/constant hidden in "negligible memory" is exactly the memory
      exponent and the memory-access cost this record surfaces; the truncated-to-
      full transfer is disclosed and not numerically extrapolated.
    tradeoff_note: >-
      The whole point is the time-memory tradeoff: van Oorschot-Wiener interpolates
      between the memory-heavy birthday time and low-memory regimes, and Leurent's
      truncation/covering-code regimes give the frontier's interior; parallelization
      is the standard distinguished-point n-processor speedup.
  dominated_by: >-
    CHECKED ACROSS THE FRONTIER. As a SHA-1 attack: n/a (no result claimed) -- no
    collision or new cost point offered; null would be a fabrication. As a
    birthday-phase cost-charging object: NOT dominated -- IDEA-20260816-71d4dd
    charges realized efficiency at operating points but states no memory exponent
    or frontier, and this record adds both via an external structural ingredient it
    does not use. As a generic near-collision algorithm: DOMINATED by Leurent
    (KN-LIT-7165) itself, whose frontier this record applies rather than improves;
    the record claims only the application to the chosen-prefix birthday phase and
    the calibration, declared as such.
  sota_delta: >-
    +0 on the SHA-1 attack axis (no faster attack). What it moves, quantitatively:
    the birthday phase's memory cost goes from "negligible" (an unstated exponent)
    to a stated memory exponent m with a measured low-memory time penalty and a
    van Oorschot-Wiener interpolation position, in compression-function evaluations
    with memory beside time -- the charged-cost deliverable the RQ's second target
    names, which the corpus does not hold.
  discriminated_from:
    - >-
      IDEA-20260816-71d4dd measures the achieved-versus-ideal EFFICIENCY eta of a
      distinguished-point search at operating points as a function of table memory,
      node count, and interconnect. This record states the FRONTIER those points
      lie on and its memory EXPONENT using Leurent's generic near-collision bound,
      which 71d4dd does not invoke; 71d4dd's eta is an input to this record's charge.
    - >-
      IDEA-20260828-521e40 charges the near-collision-BLOCK search's resident
      memory; this record charges the BIRTHDAY phase, a structurally separate
      phase and memory quantity.
    - >-
      IDEA-20260816-962936 takes memory PRICE as a declared cost-model input; this
      record derives the memory EXPONENT (quantity), which that model would then
      price.
    - >-
      IDEA-20260816-8e0b9c measures the identical-prefix-to-chosen-prefix time
      ratio; different object (a cross-attack ratio), sharing only the phase-
      attribution boundary named as a confounder here.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.9 that the memory-heavy regime anchors to the exhaustive ideal at truncated
