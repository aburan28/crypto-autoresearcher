idea:
  id: IDEA-20260816-728064
  question_id: RQ-MAYO-001
  added: '2026-08-16'
  title: 'A zero-compute commuting-square audit of two transforms that both act on a UOV map: does
    whipping commute with Weil restriction to the prime field, and if the square fails to commute,
    is the discrepancy an object with its own parameter triple and its own oil module?'
  class: composition
  claim: '(A) MAYO''s whipping and Weil restriction of scalars are both structure-adding maps on the
    same category of objects, namely quadratic maps with a distinguished totally isotropic subspace.
    Whipping sends a map on (n, m, o) over F_q to a map on (k n, m, k o) over F_q. Weil restriction
    along F_q over F_p with q = p^e sends a map on (n, m, o) over F_q to a map on (e n, e m, e o)
    over F_p. Both are functorial-looking operations and the composition square has never been written
    down in this repository. (B) The claim under test is purely algebraic and costs no compute to
    settle: the square commutes on the parameter triple in both orders, giving (k e n, e m, k e o)
    either way, but it does NOT commute on the map itself unless the emulsifier coefficients lie in
    the prime field, because descending first replaces each F_q coefficient by an e by e matrix that
    need not commute with the emulsifier''s action. The discrepancy, when it exists, is a specific
    bilinear defect that is itself a quadratic map with a distinguished isotropic subspace, that is,
    an object of the same category. (C) The deliverable either way is a named obstruction with a number:
    either the square commutes and Weil descent is transparent to whipping, which fixes once and for
    all that F_2-level analyses of MAYO may be done in either order, or it does not, and the defect''s
    rank profile is the measured content of the failure. (D) NOT CLAIMED: no attack, no exponent,
    no claim that either order is cheaper to attack, and no statement about deployed parameters. In
    particular, a non-commuting square is NOT evidence of weakness; it is evidence that two published-style
    analyses done in different orders are analysing different objects, which is a statement about
    method hygiene and about this program''s own future contracts.'
  mechanism: 'STAGE 1, category and arrows, no compute. Fix the category: objects are triples (V,
    P, O) with V an F-vector space, P a quadratic map V -> F^m, and O a subspace with P|O identically
    zero. Whip_k and Res_{F_q/F_p} are both written as explicit constructions on such triples. STAGE
    2, both composites on parameter triples. Compute Whip_k after Res and Res after Whip_k on (n,
    m, o), showing both give (k e n, e m, k e o); this is bookkeeping and either agrees or exposes
    an error in one construction immediately. STAGE 3, both composites on the map. Expand each composite''s
    polar form in a fixed F_p-basis of F_q and subtract. The difference is zero identically iff every
    emulsifier coefficient acts F_p-linearly on the descended coordinates, which happens iff those
    coefficients lie in F_p. STAGE 4, the defect as an object. When nonzero, exhibit the difference
    as a quadratic map on the same descended space and compute the dimension of its common left kernel
    and its rank profile as a function of the emulsifier, symbolically for small e and k. STAGE 5,
    computational verification of the symbolic claim. At tiny (q, n, m, o, k, e) build both composites
    numerically over exact F_p and check equality or measure the defect''s rank, so that a claimed
    identity is subjected to computational refutation rather than trusted.'
  novelty_status: unverified
  novelty_screen:
    method: 'Grepped ledger/proposals/ for ''Weil'' (hits: IDEA-20260808-51e40f, IDEA-20260806-c5d183,
      IDEA-20260727-006, IDEA-20260807-c36472, IDEA-20260807-6eab6a, IDEA-20260811-626f00, IDEA-20260808-0e9fa1,
      IDEA-20260807-464ff8) and for ''commut'' (hits: IDEA-20260807-c36472, IDEA-20260805-6eac55,
      IDEA-20260808-b9a74c, IDEA-20260807-61049d, IDEA-20260807-464ff8, IDEA-20260805-530869, IDEA-20260807-9ecc6f,
      IDEA-20260813-87106b) and for ''composition table'' (hit: IDEA-20260807-63056d). Read the titles
      of every multivariate-slice proposal returned by the family grep. Read H-MAYO-2c6c34 for the
      dilation identities.'
    results: IDEA-20260808-51e40f applies Weil descent to characteristic-2 members of the MQ family
      under RQ-MQOM-001 and prices determined solves by the polynomial method; it descends, but it
      never composes descent with whipping and never asks about commutation. The other 'Weil' hits
      are in ECDLP-side areas, not multivariate. The 'commut' hits are about commutants of group actions
      (IDEA-20260807-9ecc6f) and unrelated commutation questions, none about a transform-composition
      square in the UOV family. IDEA-20260805-258212 gives whipping's action on the parameter triple,
      which is exactly one edge of the square proposed here and is cited as prior in-repo work rather
      than re-derived.
    verdict: 'UNVERIFIED. No claim is made about published literature. Assembled from known parts:
      Weil restriction is standard; the dilation edge is IDEA-20260805-258212''s; polar-form expansion
      in a basis is routine. Claimed new relative to the in-repo corpus: posing the two transforms
      as arrows in one category and auditing the square, and treating the non-commutation defect as
      an object of the same category with its own rank profile rather than as an error term.'
  object_first_candidate:
    tracked_object: The commuting-square defect D = (Whip_k after Res)(P) minus (Res after Whip_k)(P),
      read as a quadratic map on the descended whipped space, together with its rank profile and the
      dimension of its common left kernel.
    lossiness: Lossy, and the loss is exactly the part both composites agree on. From the full public
      map we retain only the difference of two constructions, discarding everything the two orders
      share, which is the bulk of the map including the entire underlying UOV structure. What survives
      propagates because the shared part cancels identically under subtraction for every input, so
      D is a well-defined map, not a residue that needs the discarded part to interpret. If D turns
      out to be identically zero the honest report is that the projection retained nothing and the
      square is a change of coordinates in both orders, which is a real and reportable outcome, not
      a failure.
    propagation: 'The target operation here is composition of transforms rather than iteration. One
      step is applying one transform. The rule is: Whip_k appends k blocks and multiplies the oil
      dimension by k; Res replaces each scalar by its e by e regular representation and multiplies
      every dimension by e. D propagates under a further whipping step by k'' as D -> the same construction
      with k replaced by k k'', which is the prediction that the defect is stable under further whipping
      up to relabelling, and it is falsifiable by direct computation.'
    survival_score: 'Survives exactly two composition steps by construction, which is its entire scope;
      the object is defined by a square and there is no third step. Concretely: the audit is complete
      at depth two, and the extension to towers F_p subset F_{p^d} subset F_q is stated as an open
      direction rather than claimed.'
  null_object_control: The null object is a quadratic map of identical shape (kn variables, m equations
    over F_q) with a uniformly random distinguished isotropic subspace of the same dimension and a
    uniformly random emulsifier, run through the identical two composites in the same invocation.
    For the signal arm to mean anything, the null must show a nonzero defect at the same rate whenever
    its emulsifier coefficients leave F_p, and a zero defect whenever they lie in F_p. If the null
    shows zero defect always, the defect computation is broken; if it shows nonzero defect always,
    including for prime-field emulsifiers, the criterion in Part B is wrong and must be reported as
    such.
  discriminated_from:
  - 'IDEA-20260808-51e40f (Weil descent for MQOM with polynomial-method pricing): that record descends
    a map and prices a solve; it never composes descent with another transform and makes no commutation
    claim, and its crossover condition c*log2(q) < 2*omega is a cost statement rather than an algebraic
    identity.'
  - 'IDEA-20260805-258212 (whipping as k-fold dilation): supplies one edge of the square and is cited,
    not repeated; the dilation identities alone cannot decide whether the square commutes on maps,
    only on triples.'
  - 'IDEA-20260808-ae175e (Kronecker factorization of the whipped form over the emulsifier''s splitting
    field): that works over an EXTENSION of F_q to factor a rank; this works over a SUBFIELD to test
    a composition, and the two directions answer different questions.'
  - 'Standard Weil restriction as used in ECDLP-side records: there it is a means of transporting
    a hard problem; here it is one arrow in a square whose commutation is itself the deliverable.'
  assumptions:
  - The recalled whipped-map form P-star with an emulsifier acting by F_q-coefficients is correct
    in shape; a different whipping definition changes the square.
  - q = p^e with e > 1, otherwise the square is trivial and the audit is vacuous, which is itself
    the e = 1 control.
  - Descent is taken along a fixed F_p-basis of F_q; a different basis changes D by conjugation but
    not its rank profile, and that invariance is a checkable prediction rather than an assumption
    to be trusted.
  - Exact arithmetic throughout, symbolic where possible.
  predictions:
  - metric: identity of the parameter triples produced by the two composites
    direction: different
    minimum_effect: 'forced value: both must give exactly (k e n, e m, k e o); any discrepancy means
      one construction is written wrong and the run stops'
  - metric: dimension of the common left kernel of D when the emulsifier has a coefficient outside
      F_p
    direction: lower
    minimum_effect: 'forced value: strictly less than e m, i.e. D is not identically zero, with the
      exact value reported per emulsifier'
  - metric: D when every emulsifier coefficient lies in F_p
    direction: different
    minimum_effect: 'forced value: identically zero at every tested cell; a nonzero D here falsifies
      Part B'
  - metric: rank profile of D under a change of F_p-basis of F_q
    direction: different
    minimum_effect: 'forced value: invariant, since a basis change conjugates D'
  minimal_test:
    design: 'Zero compute first, then a small confirmation. On paper, with p = 2, e = 2 so q = 4,
      k = 2, n = 3, m = 2, o = 1, write both composites'' polar forms in the basis {1, w} of F_4 over
      F_2 and subtract. This is a few dozen lines of symbolic algebra and settles Part B outright,
      because the only place the two orders can differ is where an emulsifier coefficient multiplies
      a descended coordinate. Then confirm computationally in the same invocation: build both composites
      numerically over exact F_2, compare them entrywise for 200 random keys with emulsifiers drawn
      from F_2 and 200 with emulsifiers drawn from F_4 minus F_2, and record the defect''s rank profile
      in each group. The discrimination is total: the prime-field group must show D identically zero
      on all 200, the non-prime-field group must show D nonzero on all 200, and any mixed outcome
      in either group refutes the criterion and is the more interesting result.'
    controls:
    - 'e = 1 control: with q = p the descent is the identity and D must vanish identically for every
      emulsifier, including non-prime-field ones, which cannot then exist; this is a forced-value
      sanity anchor.'
    - Prime-field emulsifier arm and non-prime-field emulsifier arm, both executed in the same invocation,
      which is the built-in signal/null contrast.
    - 'Random isotropic subspace null: replace the oil space by a uniformly random subspace of the
      same dimension with no isotropy imposed and confirm the defect computation still runs and gives
      the same rank profile, since D should not depend on the oil space at all.'
    - 'Basis-permutation control: recompute with a different F_p-basis of F_q and confirm the rank
      profile is unchanged.'
    - 'k = 1 control: with no whipping the square degenerates and D must vanish.'
    required_metrics:
    - 'boolean: is D identically zero, per key and per emulsifier class'
    - rank of D as a quadratic map, per key
    - dimension of the common left kernel of D
    - parameter triple produced by each composite, compared against the forced value
    - invariance check result under basis change
  falsification_conditions:
  - D is nonzero for some emulsifier with all coefficients in F_p, which falsifies the stated criterion.
  - D is identically zero for every emulsifier including those with coefficients outside F_p, which
    makes the square commute unconditionally and closes the question with a named obstruction rather
    than an open one.
  - The two composites disagree on the parameter triple, which means at least one construction is
    written wrong and no algebraic conclusion may be drawn.
  - The rank profile of D changes under a change of F_p-basis, which would mean the object is not
    basis-intrinsic and the whole framing is wrong.
  - The e = 1 or k = 1 degenerate controls produce a nonzero D.
  confounders:
  - An incorrectly recalled whipping definition; the entire square is only as good as the arrow definitions,
    and this is a reading risk not a measurement risk.
  - Basis choice conventions differing silently between the two composite implementations, which would
    manufacture a nonzero D out of bookkeeping; mitigated by the basis-invariance control and by sharing
    one basis object between both code paths.
  - Characteristic-2 conventions for polar forms (the alternating versus symmetric distinction) applied
    inconsistently in one order but not the other.
  - Reading a nonzero D as a security statement, which it is not, and which the claim ceiling forbids
    explicitly.
  interpretation_limits:
  - A non-commuting square is a statement about analysis order, not about the security of either scheme,
    and may not be reported as a weakness in any direction.
  - The audit is at depth two only; nothing follows about towers of subfields or about composing whipping
    with the QR-UOV or SNOVA transforms, which is a separate proposal.
  - All conclusions are conditional on the recalled definitions of both arrows and are void if either
    is wrong.
  target_complexity:
    time_exponent: No attack exponent is claimed. The audit is symbolic; its confirmation costs O(400)
      constructions of matrices with at most e k n = 24 rows.
    memory_exponent: No attack memory exponent is claimed; memory is that of a handful of small matrices.
    best_known: 'There is no incumbent to beat: the incumbent for this question is the absence of
      any in-repo record composing these two transforms, established by the greps recorded in the
      novelty screen. On the mathematics side, the relevant known objects are Weil restriction and
      the dilation identities of IDEA-20260805-258212, both used as inputs.'
    hidden_overhead: 'Almost all cost is human: writing both arrows carefully enough that a bookkeeping
      mismatch is not mistaken for a mathematical defect. The lower-order term that bites is characteristic-2
      polar-form convention, which is exactly the kind of silent inconsistency that manufactures a
      fake signal.'
  dominated_by: n/a (no result claimed). Every attack frontier row named in RQ-MAYO-001 and RQ-UOV-001
    - intersection, reconciliation, Kipnis-Shamir, and the direct/whipped forgery system - was checked
    for comparability and none applies, because this produces no cost figure on any axis.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a boolean per emulsifier class plus an integer rank profile for D, and a forced parameter-triple
    identity that either holds exactly or exposes a construction error.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A (both transforms are arrows on the same category and the square
    is well posed): 0.9, this is definitional and the only risk is a wrong recalled definition of
    whipping. Part B (the square commutes on triples but not on maps, with the prime-field criterion
    exactly as stated): 0.6 for the criterion holding exactly as written, because the interaction
    between the emulsifier''s F_q-multiplication and the descended coordinates is where a subtlety
    would hide, and a partial criterion (some non-prime-field emulsifiers still commuting) is a plausible
    and more interesting outcome. Part C (the defect is itself an object of the same category with
    a stable rank profile): 0.45, the weakest part, because D being a quadratic map is easy but D
    having an isotropic subspace inherited from O is not obviously forced and may fail.'
