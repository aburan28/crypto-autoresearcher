idea:
  id: IDEA-20261006-fc2714
  title: >-
    Orbit-normalised doubling-slope character gap between j=1728 and a
    matched-trace ordinary curve over F_29
  class: measurement
  claim: >-
    Over F_29 there exist an ordinary curve of j-invariant 1728 and an
    ordinary curve with j-invariant outside {0,1728}, with equal trace of
    Frobenius, whose orbit-normalised means of the quadratic character of
    the doubling slope differ by at least 0.10. The representation is the
    R2 short-Weierstrass model, the stage is collision structure, and the
    gap is not an automorphism-discounted rho speedup. The exponent stays 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R2: the short-Weierstrass model, either
    y^2=x^3+Ax with A≠0 (j=1728) or y^2=x^3+Ax+B with B≠0 and j outside
    {0,1728}. The tracked value is the Legendre symbol (λ/29) of the
    doubling slope λ=(3x^2+A)/(2y), not the character of a division
    polynomial. Operation set Sigma is affine doubling on S={P affine:
    2y(P)≠0}. Sigma is not the full translation action. Trichotomy:
    coordinate-dependent. An isomorphism (x,y)↦(u^2 x, u^3 y) multiplies λ
    by u^{-1}, and a nonsquare u flips (λ/29), so the symbol is not a
    function of the abstract group element. LOSSY-PROJECTION TEST against
    Sigma. The projection discards the point and retains ±1. The image has
    two values, so the projection is lossy on S whenever |S|>2. It is not a
    block system of the full translation group. Under doubling it is a
    branching bound unless (λ(2P)/29) is a function of (λ(P)/29) alone.
    The priced number is the absolute gap of orbit-normalised means at
    matched trace. Off-limits families F1–F7 are not the lens. F6 enters
    only as a named control: means are averaged on Aut-orbit
    representatives so a raw gap that is only |Aut|=4 versus |Aut|=2 is
    removed before the claim is scored. No walk is run. No factor base is
    proposed.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: idea-generator
  approved_by: null
  question_id: RQ-JINV-8fc13a
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m multiplies rho iterations by √m:
        √4 on j=1728 and √6 on j=0. The gain is a constant and does not
        change exponent 1/2. This idea uses that constant as the thing a
        slope gap must beat after orbit normalisation, and it does not claim
        to beat it.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
        on 2026-10-06
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        The rho baseline already charges √|Aut|. A prime-field advantage
        must beat that discounted baseline. This measurement asks whether a
        slope-character gap survives the discount's orbit identification.
      verified_by: >-
        idea-generator opened knowledge/techniques/KN-TECH-018.md
        on 2026-10-06
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Curves over a finite field are isogenous if and only if they have
        the same number of points, hence the same trace. Matched trace is
        the control that keeps the comparison inside one point-count.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
        on 2026-10-06
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        Weil descent of S_3 to F_2 has first fall degree 2 because the field
        trace of x is a group morphism to F_2. This idea's trace is the
        integer #E(F_29)-(29+1), used only to match curves, and the scored
        quantity is the character of the doubling slope.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        on 2026-10-06
    - ref: >-
        supersingularity of y^2=x^3+Ax when p≡3 mod 4
      provenance: recalled
      claim: >-
        Pointer only. F_29≡1 mod 4 is why this prime was chosen, but the
        test decides ordinariness by computing the trace, not by this recollection.
      verified_by: null
  assumptions:
    - >-
      Trace is #E(F_29)-(29+1), computed by enumerating points, and two
      curves are matched only when those integers are equal.
    - >-
      Orbit representatives are the orbits under the rational automorphism
      group actually present on that curve: {±1} when only negation is
      rational, and the full rational Aut when the extra automorphisms of
      j=1728 are rational over F_29.
    - >-
      F6 is a control component (orbit means), not the primary lens. F1 is
      not used.
  proof_search_map:
    bottleneck: >-
      Whether any matched-trace pair still has an orbit-normalised character
      gap of at least 0.10 after Aut-orbit means replace point means.
    baseline_embedding:
      parameter_slice: >-
        The √4 versus √2 constants in KR-RHO-0528e7 and KN-TECH-018. No rho
        walk is reproduced.
      reproduction_check: >-
        For a j=1728 curve, confirm the model is y^2=x^3+Ax, A≠0, and that
        each retained automorphism preserves the curve equation over F_29.
    observation_collision:
      observable: >-
        The orbit-normalised mean of (λ/29) on doubling-eligible
        Aut-orbit representatives.
      distinct_preimage_search: >-
        Two curves with the same trace and j-class whose means differ by
        at least 0.10 are the positive instance. Two same-j curves with the
        same trace whose means already differ by at least 0.10 show the
        threshold is inside same-j dispersion.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The Aut-orbit mean of the doubling-slope character, which
          strengthens a raw point mean by killing orbit multiplicity.
        predicted_gain: >-
          A gap of at least 0.10, or a falsification that no matched pair
          reaches 0.10.
    quantifier_order: >-
      Exists an ordinary E with j(E)=1728 and an ordinary E' with j(E') not
      in {0,1728}, both over F_29, such that trace(E)=trace(E') and the
      absolute difference of their orbit-normalised slope-character means
      is at least 0.10.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy gap or its absence on the finite set of curves over F_29.
        Not a rho speedup and not a statement at another prime.
      nearby_object_control: >-
        Pairs of ordinary curves with the same trace and the same j-class
        (both generic, or both j=1728). If those pairs already reach gap
        0.10, the cross-j claim is not separable from same-j scatter and
        is not scored.
    proof_obligations:
      - claim: Trace equality is an enumerated point count, not an isogeny walk.
        responsibility: correctness
      - claim: A gap of 0.10 at p=29 does not change exponent 1/2.
        responsibility: scope
    not_applicable_reason: >-
      This is a measurement of a character mean, not a theorem, bound,
      certificate, reduction, or closure.
  predictions:
    - metric: >-
        maximum, over matched-trace ordinary pairs with one j=1728 curve and
        one j outside {0,1728}, of the absolute difference of orbit-normalised
        means of (λ/29)
      direction: different
      minimum_effect: at least 0.10
    - metric: >-
        the same maximum restricted to pairs inside one j-class
      direction: lower
      minimum_effect: >-
        strictly below 0.10, otherwise the cross-j gap is not separable
        from same-j scatter
  minimal_test:
    design: >-
      Enumerate A≠0 for y^2=x^3+Ax and a complete set of (A,B) up to
      isomorphism representatives with B≠0 over F_29. Drop singular and
      supersingular curves. Compute the trace by point enumeration. On each
      ordinary curve, average (λ/29) over Aut-orbit representatives in S.
      Score the cross-j matched-trace maximum and the same-j matched-trace
      maximum. Do not run a walk.
    controls:
      - >-
        Same-j matched-trace pairs, as the dispersion control. If their gap
        already reaches 0.10, do not score the cross-j claim.
      - >-
        Raw point-mean gap reported beside the orbit-normalised gap. A raw
        gap that collapses under orbit means is the known |Aut| multiplicity,
        and it does not satisfy the claim.
      - >-
        Curve-equation check for every automorphism used to form orbits.
      - >-
        A supersingular j=1728 curve, if one appears, is excluded and not
        used as a stand-in.
    required_metrics:
      - number of ordinary j=1728 curves
      - number of matched-trace cross-j pairs
      - maximum orbit-normalised cross-j gap
      - maximum orbit-normalised same-j gap
      - whether each j=1728 curve used |Aut|=2 or |Aut|=4
  falsification_conditions:
    - Every matched-trace cross-j pair has orbit-normalised gap strictly below 0.10.
    - No ordinary j=1728 curve exists over F_29.
    - No ordinary curve with j outside {0,1728} shares a trace with an ordinary j=1728 curve.
    - >-
      The same-j matched-trace gap already reaches 0.10, so the threshold
      does not isolate j.
    - >-
      (λ(2P)/29) is a function of (λ(P)/29) alone on either curve, so the
      branching description of doubling is wrong for that curve and the mean
      is not the statistic the mechanism named.
  confounders:
    - >-
      |Aut|=4 versus |Aut|=2 changes how many representatives a point-mean
      would count. Orbit means are mandatory. A raw mean is a confounder.
    - >-
      Isomorphic models that rescale A change λ by a unit. Representatives
      must be frozen before means are compared, one model per isomorphism
      class in the census, or the gap can be a model choice.
    - >-
      p=29 makes |S| small. A 0.10 gap can be a few orbits. The same-j
      control is what stops that from being read as a j-effect.
  interpretation_limits:
    - >-
      A gap at or below the √|Aut| calibration is not an attack. This claim
      is about a character mean, not about iteration counts. KR-RHO-0528e7
      already fixes the iteration constant.
    - >-
      Toy scope is F_29 only. No transfer to a larger prime.
    - >-
      The character is of the doubling slope. It is not the Legendre symbol
      of a division polynomial, and a result here says nothing about that
      symbol.
    - >-
      Not a factor base and not a KN-OPEN-020 description.
    - >-
      KR-IC-f5c584 is a binary S_3 descent statement about first fall degree.
      This census does not form S_3 and does not report a fall degree. The
      word trace here is #E-(p+1), not Tr(x) onto F_2.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Inside one j-class and one trace, the orbit-normalised mean of a
        ±1 function on N_orb representatives disperses by about N_orb^{-1/2}
        if the signs were independent fair coins. This imitates a binomial
        and is checked inside the census; it is not extrapolated.
      rigorous_support: >-
        Binomial variance for independent fair signs on a fixed finite set.
        A Weil character-sum bound would be the classical theorem this
        imitates and is recalled only, not used as support. The opened note
        KN-TECH-018 supplies the orbit normalisation, not the variance.
      validation_plan: >-
        Sample every ordinary curve in the F_29 census. Compare the
        histogram of orbit-normalised means, within each j-class, to a
        centred binomial (or normal) with variance 1/N_orb for that curve's
        N_orb. Tail check: the most extreme same-j matched-trace gap versus
        the 0.99 quantile of the difference of two such binomials. If that
        same-j extreme gap is already ≥ 0.10, the cross-j comparison is not
        scored.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: unchanged O(1) rho memory; the census stores O(p^2) models at p=29
    best_known: >-
      automorphism-discounted rho, iteration factor √4 on j=1728 and √2 on
      generic ordinary curves, exponent still 1/2 (KR-RHO-0528e7, KN-TECH-018)
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No time-memory tradeoff. The census is a full enumeration at one prime.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    No opened row dominates the slope-character gap. Rows opened and not
    dominating that gap: KR-RHO-0528e7 (√|Aut| iteration constant; this idea
    does not count iterations), KR-RHO-fb88e6 (negation-map fruitless cycles;
    this idea does not walk), KR-RHO-13bf67 (matching exponent baseline),
    KR-RHO-755e35 (matched trace is Tate's point-count criterion, not a
    character mean), KR-IC-f5c584 (first fall degree 2 for binary S_3
    descent; this idea does not form S_3 or report a fall degree).
    KR-RHO-0528e7 dominates any attack reading that would treat a j=1728
    gap as a rho speedup beyond √4.
  sota_delta: >-
    Zero change to exponent 1/2. The iteration constants stay √4 on j=1728
    and √2 on generic ordinary curves. The new quantity is the maximum
    absolute gap, at matched trace over F_29, between orbit-normalised means
    of the Legendre symbol of the doubling slope.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-fb88e6
      - KR-RHO-13bf67
      - KR-RHO-755e35
      - KR-IC-f5c584
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          That row fixes a √4 iteration constant on j=1728 and states that
          the exponent remains 1/2. This idea does not change that constant.
          It measures an orbit-normalised slope-character gap at one prime.
      - ref: KR-IC-f5c584
        provenance: internal
        relation: orthogonal
        delta: >-
          That row states first fall degree 2 for Weil descent of S_3 on
          ordinary binary curves, because the field trace of x is a group
          morphism to F_2, and it bounds that fall degree independently of
          the extension degree under the Hodges–Petit–Schlather conditions.
          This measurement does not build S_3, does not descend to F_2, and
          does not report a fall degree. Curve matching uses the integer
          trace #E(F_29)-(29+1). The scored gap is an absolute difference of
          at least 0.10 between orbit-normalised means of (λ/29). The time
          exponent stays 1/2.
      - ref: KN-TECH-018
        provenance: internal
        relation: adjacent
        delta: >-
          The technique note says the discounted rho baseline is calibration.
          This measurement is scored only after orbit means, and a positive
          gap is still not charged as a speedup.
    searched:
      corpus_grep:
        - >-
          ledger/proposals IDEA-202610*.yaml for Edwards, Jacobi, quadratic
          character, Weil restriction
        - >-
          ledger/proposals for doubling-slope (IDEA-20260913-4efec0 is a
          fixture-artifact note, not this census)
      web: []
      blocked:
        - web search not run; novelty_status stays unverified
