idea:
  id: IDEA-20260809-cea528
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    The traditional half has its own binding failures — small-order and
    non-contributory inputs on the elliptic-curve side, measured in the hybrid
  class: mechanism
  claim: >-
    Attention to hybrid binding focuses on the post-quantum component, but the
    traditional component contributes shared secrets that can be forced to fixed
    values by supplying degenerate public inputs. The claim is that this gives a
    SECOND, independent family of binding certificates in the hybrid setting, that
    whether it applies depends on whether the combiner hashes the traditional
    public values, and that the two families together determine each combiner's
    row rather than the post-quantum one alone.
  mechanism: >-
    Supply a degenerate public value on the traditional side so the derived secret
    is a fixed known value regardless of the honest party's key; if the combiner
    does not hash the traditional public values, two different honest keys yield
    the same combined secret.
  why_not_a_renamed_known_approach: >-
    Degenerate-input behaviour on the traditional side is long known and is why
    implementations check for it. Its interaction with COMBINER binding — where the
    check's presence or absence changes a table cell — is the specific question,
    and it is not covered by the post-quantum-focused analyses.
  predictions:
  - observable: existence of a traditional-side binding certificate per combiner
    metric: boolean per combiner
    predicted: >-
      Present for combiners omitting the traditional public values, absent
      otherwise. If the specification mandates rejecting degenerate inputs, the
      family disappears and that is the cell's answer.
  - observable: whether the specification's mandated checks remove the family entirely
    metric: categorical with citation
    predicted: Likely yes for the deployed construction; the value is in checking rather than assuming, and the answer is a statement about the specification text.
  minimal_test: >-
    Attempt the construction against each implemented combiner with and without
    the specification's mandated input checks, recording certificates and the
    controlling specification passage per cell.
  controls:
  - 'SPECIFICATION-CHECK CONTROL: with mandated checks enabled the construction must fail; a certificate surviving mandated checks would be a significant finding requiring re-verification and disclosure before publication.'
  - 'INDEPENDENT VERIFICATION of any certificate.'
  falsification_conditions:
  - The construction fails even without the mandated checks.
  - Certificates survive with mandated checks enabled, which triggers re-verification and the disclosure rule.
  interpretation_limits: >-
    All keys self-generated; specification-level constructions only. No deployed
    implementation is tested, and the record makes no claim that any implementation
    omits a mandated check.
  sota_delta: 'Delta: a second binding-failure family that the post-quantum-focused framing omits, with its dependence on specification checks made explicit.'
  dominated_by: Complements IDEA-20260809-c8027c; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for small-order / degenerate inputs: GOAL-EDDSA-001 covers signature verification, a different object. WEB NOT CHECKED.'
