  novelty_screen:
    method: >-
      FILESYSTEM, LEDGER AND WEB, same procedure as IDEA-20260901-185ca5.
      Grepped knowledge/ and ledger/ for hidden sum, alternative operation,
      Civino, Calderini (no hits in SOURCES.md); read the 60-entry AES dedup
      list; WebSearch located eprint 2017/610 and the 2024 optimal-S-boxes
      paper; WebFetch retrieved 2017/610 and it was read in full as page
      images.
    results: >-
      THE CORPUS HAS NO ENTRY ON HIDDEN SUMS OR ALTERNATIVE OPERATIONS, and no
      filed AES proposal tracks an operation on the message space. The nearest
      filed objects are XOR-differential instruments (IDEA-20260807-3d9c9f
      overdispersion of a truncated-differential hit count; the
      GOAL-AES-003 yoyo and carrier lane), all in the off-limits differential
      family and all using the XOR difference. Externally, 2017/610 does not
      mention AES; whether Calderini-Sala or a later paper has applied
      hidden sums to the AES S-box or to MixColumns was NOT resolved this
      session -- the 2024 optimal-S-boxes title suggests S-box-level work on
      small S-boxes exists, and the executor must open it first.
    verdict: >-
      UNVERIFIED. The theory is Calderini-Sala and Blondeau-Civino-Sala; the
      closure lemma at MixColumns for byte-parallel operations is, as far as
      this session could determine, not in the corpus and not in the read
      paper, and is elementary enough that it may well be known to the
      authors of that line; the AES S-box o-DDT census is likewise not found.
      No novelty is claimed against the external literature, per RQ-AES-002
      provenance (c).

  object_first_candidate:
    tracked_object: >-
      THE ALTERNATIVE OPERATION o ITSELF -- equivalently the 2-elementary
      abelian regular subgroup T_o of AGL(128, 2) with T_+ < AGL_o -- and,
      derived from it, the o-difference x o y of a pair, followed through the
      AES layers. The primary lens is the OPERATION (which subgroup, what W_o,
      what U_o), not the difference: the record's verdict is about which
      operations make which layers affine, and the difference only appears in
      the S-box census. Established families declared OFF-LIMITS as the
      primary lens and not used: differential and truncated differential
      (the XOR-difference family, which this object is deliberately not, and
      which the record uses only as the comparison arm delta_+(S) = 4);
      linear and multidimensional linear; integral, square, division
      property; impossible differential; meet-in-the-middle and
      Demirci-Selcuk; boomerang and retracing boomerang; biclique; algebraic
      and Groebner; yoyo; mixture and exchange; subspace trail; partial sums.
    lossiness: >-
      PASSES, AND THE TEST IS THE CLOSURE MECHANISM. The projection
      (x, y) -> x o y discards the pair and retains one element; it
      propagates deterministically through a map f exactly when f is
      o-affine (then (f(x)) o (f(y)) = A(x o y) for the o-linear part A), and
      through XOR key addition only up to the error k.(x o y) in U_o
      (Theorem 5), deterministically iff k is a weak key. So the question
      "does the retained part propagate compatibly with the target's
      operations" is precisely "is each AES layer o-affine", and claim (B)
      answers it for MixColumns o ShiftRows: NO, for every byte-parallel o.
      The projection is genuinely lossy for the S-box layer too, since S is
      not o-affine for any o (an o-affine S would be +-affine composed with
      the bijection between the two structures, which fails the DDT). It
      cannot degenerate to a change of coordinates because o is a different
      group structure, not a relabelling of XOR (their Fig. 2 shows the two
      Cayley tables differ).
    propagation: >-
      ONE-STEP PROPAGATION IS DEFINED LAYER BY LAYER AND EACH IS MEASURED OR
      DERIVED: through the S-box by DDT_o (measured in the census); through
      key addition by Delta -> Delta + k.Delta (exact, Theorem 5); through
      MC o SR deterministically iff lambda is in H_o, which claim (B) settles
      negatively for byte-parallel o given the computed coefficient fact, and
      otherwise probabilistically with a transition table that the record
      names but does not compute (forward class).
    survival_score: >-
      For byte-parallel operations the object does not survive ONE
      MixColumns layer deterministically, at any round count, for any key --
      which is why the closure is round-count-independent and reaches the
      full round count for free. The object survives, in the sense of not
      being closed, in the non-parallel and probabilistic-diffusion classes,
      which are named open. The S-box census scores the object at the
      component level: a large max_o delta_o(S) would mean the surviving
      classes have a strong component to build on; a value at the random
      null would mean they do not.

  proof_search_map:
    bottleneck: >-
      For the attack: membership of the AES diffusion layer in H_o for some
      admissible o, which is what lets o-differentials pass the linear layer
      deterministically. For the closure: the coefficient fact that for every
      byte position j some a has m_{aj} m_{ja} outside GF(2^4) in the
      two-round linear layer, which converts Theorem 6 plus the field lemma
      into the non-membership for all byte-parallel o.
    baseline_embedding:
      parameter_slice: >-
        The paper's own 15-bit example: operation hat-o = (diamond, +, +, +,
        +) on five 3-bit bricks, S-box gamma' of Example 3, matrix lambda of
        Example 4. The exact slice that reproduces the baseline is: (i) the
        DDT_diamond of gamma' must show the entry 8 (their Fig. 4); (ii)
        lambda of Example 4 must be verified o-linear by our H_o membership
        test; (iii) a 3x3 GF(2^3)-MDS-like matrix over a field generator in
        place of lambda must FAIL the membership test by the same lemma.
      reproduction_check: >-
        A frozen fixture holding the two DDTs of Example 3 (+ and diamond)
        byte-for-byte as printed in their Fig. 4, the membership verdict on
        Example 4's lambda (must be in H_hat-o), and the per-round
        o-differential probability of the 5-round toy against their reported
        2^-14.296 within sampling error at 2^11 keys. Nothing about AES is
        computed until the fixture passes.
    observation_collision:
      observable: >-
        For the closure: the coefficient multiset {m_{aj} m_{ja}} of lambda^2
        and the verdict "lambda not in H_o for any byte-parallel o". For the
        census: delta_o(S) per operation.
      distinct_preimage_search: >-
        The closure observable is blind to the S-box, so a cipher with the
        AES linear layer and ANY byte-parallel S-box layer collides with AES
        on it -- correctly, because the closure is about the linear layer.
        The census observable delta_o(S) collides across S-boxes that are
        o-affine-equivalent, and the record checks that the inversion map
        and the full AES S-box (inversion followed by the GF(2)-affine L) can
        DIFFER on it, since L is +-affine but not o-affine; a difference
        between the two census values is predicted and is itself a
        KN-FIND-028-style localisation of where o-structure is destroyed.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the +-DDT of the S-box fixed (delta_+ = 4) and vary the
          operation o across the enumerable family; the fibre is the set of
          o-DDTs, and the record searches it for an intrinsic weakness the
          XOR-DDT does not see.
        predicted_gain: >-
          Either a measured maximal o-uniformity materially above the random
          null (a component-level fact the open classes could use) or a
          census showing the S-box is o-optimal across the family, which is
          a scoped negative with a number attached.
      - transform: representation_reduction
        proposed_object: >-
          Reduce H_o membership of lambda to a subspace-stability condition
          (W_o lambda = W_o) and then to a field-membership condition on
          coefficient products, with interface obligations: encoding
          (byte-parallel o gives W_o as a direct sum), completeness (Theorem
          6 is necessary), soundness (the field lemma), transfer (from
          lambda^2 to all powers), cost loss (none).
        predicted_gain: >-
          A one-line, key-independent, round-count-independent closure of
          the o-linear-diffusion class for AES.
    quantifier_order: >-
      CLOSURE: FOR ALL byte-parallel operations o with T_+ < AGL_o (over all
      choices of per-byte E-matrices and all d_j in [2, 6]) and FOR ALL keys
      and ALL round counts, MC o SR is not in H_o -- conditional on the
      computed coefficient fact, which is a single universal statement about
      the AES linear layer. The witness (the position a) is allowed to depend
      on j; nothing else depends on anything. CENSUS: FOR EACH o in the
      enumerated set, delta_o(S) is computed exactly; the maximum over the
      set is reported with the set's coverage stated (exhaustive for d = 5, 6;
      declared sample sizes for d <= 4). What is NOT claimed: anything about
      operations outside the byte-parallel family, or about the sampled
      strata beyond the sample.
    method_ceiling:
      strongest_certifiable_claim: >-
        That no byte-parallel alternative operation makes the AES diffusion
        layer o-linear, hence the Blondeau-Civino-Sala attack in its
        o-linear-diffusion form does not apply to AES at any round count; and
        the exact maximal o-differential uniformity of the AES S-box over the
        enumerated operations. It cannot certify anything about non-parallel
        operations, about probabilistic-diffusion o-differentials, or about
        any other attack class.
      nearby_object_control: >-
        AES WITH A BINARY MIXCOLUMNS: replace M by the GF(2)-valued
        self-inverse matrix Barkan-Biham give for the self-dual Rijndael
        variant (rows 1110, 1101, 1011, 0111), all of whose coefficient
        products lie in GF(2). On that object the lemma's hypothesis FAILS
        (mu = 1 generates nothing), byte-local proper subspaces CAN be
        preserved, and the H_o membership test must find operations for
        which the binary diffusion layer IS o-linear. The method must return
        OPEN on that object and CLOSED on AES; a method returning CLOSED on
        both has not identified the load-bearing structure.
    proof_obligations:
      - claim: >-
          The two-round coefficient matrix Lambda = (MC o SR)^2 over GF(2^8)
          is computed from the pinned constants and cross-checked against the
          harness on random states.
        responsibility: baseline
      - claim: >-
          The paper's Example 3 DDTs and Example 4 membership reproduce
          exactly.
        responsibility: baseline
      - claim: >-
          Field lemma: a GF(2)-subspace of GF(2^8) stable under
          multiplication by mu outside GF(2^4) is 0 or GF(2^8).
        responsibility: correctness
      - claim: >-
          For byte-parallel o, W_o is the direct sum of per-byte W_j and
          Theorem 6 applies to lambda^2.
        responsibility: interface
      - claim: >-
          For every j there exists a with m_{aj} m_{ja} not in GF(2^4)
          (computed; if false for some j the closure is scoped to the
          positions where it holds and the rest is open).
        responsibility: feasibility
      - claim: >-
          The census over d = 5, 6 is exhaustive and the d = 4 stratum is
          exhaustive or its sample is declared; runtime fits a producer slot
          in C or is scoped down with the coverage stated.
        responsibility: runtime
      - claim: >-
          Scope: byte-parallel operations, the AES linear layer and S-box as
          pinned, all round counts, all keys.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The pinned harness constants (MixColumns matrix, ShiftRows offsets,
      S-box, field polynomial 0x11B) are ground truth; the two-round
      coefficient matrix is derived from them and checked against harness
      output.
    - >-
      The restatements of Theorems 1, 2, 5 and 6 in 2017/610 are correct as
      read; each is re-derived in a short derivation note before use, and the
      field lemma is proved in-repo.
    - >-
      A C implementation is available for the census (gcc measured present
      under GOAL-AES-002's envelope receipt); if not, the census is scoped to
      d = 5, 6 in pure Python and the d = 4 stratum is recorded as
      out-of-envelope rather than estimated.

  predictions:
    - metric: >-
        coefficient_fact: for each byte position j, whether some a has
        m_{aj} m_{ja} outside GF(2^4) in Lambda = (MC o SR)^2
      direction: different
      minimum_effect: >-
        Predicted TRUE for all 16 positions (the entries of MC are 01, 02, 03
        and their two-round products are sums of products of these, which
        generically generate GF(2^8)); if it fails at any position the
        closure is scoped to the positions where it holds and the record says
        so. This is the pre-registered gate for claim (B).
    - metric: >-
        H_o_membership_AES: number of byte-parallel operations in the
        enumerated family for which MC o SR passes the direct W_o-stability
        test (an independent implementation of Theorem 6's necessary
        condition, run as a check on the lemma, not as its proof)
      direction: lower
      minimum_effect: >-
        EXACTLY 0 for AES over every enumerated operation, and STRICTLY
        POSITIVE for the binary-MixColumns nearby object. Any AES hit
        falsifies the lemma or its hypothesis and is the single most
        informative negative here.
    - metric: >-
        max_o_uniformity_AES_sbox: max over the enumerated o of delta_o(S)
        for the AES S-box, per stratum d
      direction: different
      minimum_effect: >-
        Reported against delta_+(S) = 4 and against the random-permutation
        null distribution (100 random 8-bit permutations, same operations).
        A value exceeding the null's 99th percentile by at least 4 is a
        component-level weakness handed to the open classes; a value within
        the null band records the S-box as o-optimal across the family. Both
        are results.
    - metric: >-
        inversion_vs_full_sbox_gap: max_o delta_o(Inv) minus
        max_o delta_o(S) over the same operations
      direction: different
      minimum_effect: >-
        Reported; a non-zero gap localises whether the GF(2)-affine L or the
        inversion carries the o-structure, in the manner of KN-FIND-028 Fact 2.
    - metric: >-
        positive_control_reproduction: the printed DDT_diamond of Example 3
        and the 5-round o-differential probability of the toy
      direction: different
      minimum_effect: >-
        Exact agreement on the DDT (entry 8 present); agreement with
        2^-14.296 within 2 standard errors at 2^11 keys.
    - metric: >-
        nearby_object_membership: number of operations for which the
        binary-MixColumns AES variant's diffusion layer IS o-linear
      direction: higher
      minimum_effect: >-
        At least 1. If zero, the membership test is broken and the AES zero
        is meaningless.

  minimal_test:
    design: >-
      FOUR STAGES. STAGE 0 (derivation, no compute): one-page derivation note
      re-deriving Theorems 1, 2, 5, 6 as restated in 2017/610, proving the
      field lemma, and stating claim (B) with its computed hypothesis named.
      STAGE 1 (seconds): compute Lambda = (MC o SR)^2 over GF(2^8) from the
      pinned constants, cross-check against the harness, evaluate the
      coefficient fact per position, and PRE-REGISTER the closure verdict.
      STAGE 2 (minutes): implement the operation family of Theorem 2 for
      n = 8, the direct W_o-stability test on 128-bit maps, the o-DDT routine;
      run the baseline fixture (Example 3 DDTs, Example 4 membership, toy
      probability), then the membership test on AES (expect 0 hits) and on
      the binary-MixColumns nearby object (expect hits). STAGE 3 (one producer
      slot, C if available): the o-DDT census of the AES S-box, the inversion
      map, and 100 random permutations, exhaustive for d = 5, 6, exhaustive or
      declared-sample for d = 4, sampled at 10^6 for d = 2, 3; report per
      stratum with coverage. Every stage commits its digest before the next
      reads it.
    controls:
      - >-
        BASELINE FIXTURE (blocking): the paper's Example 3 DDTs, Example 4
        membership and the toy's 5-round probability must reproduce.
      - >-
        NEARBY OBJECT (blocking): the binary-MixColumns variant must yield
        o-linear diffusion for some operations; if it does not, the
        membership test cannot be trusted to return 0 on AES.
      - >-
        RANDOM-PERMUTATION NULL for the census: 100 uniformly random 8-bit
        permutations under the identical operation set, giving the null
        distribution of max_o delta_o.
      - >-
        SIBLING CONTROL: the inversion map alone versus the full S-box, to
        isolate which factor carries any o-structure found.
      - >-
        PRE-REGISTRATION: the closure verdict is committed from Stage 1
        before Stage 2 runs; the census strata and sample sizes are declared
        before Stage 3 runs.
    required_metrics:
      - Lambda over GF(2^8) and the per-position coefficient fact, with the pre-registered verdict
      - membership counts for AES and for the nearby object over the enumerated family
      - o-DDT census per stratum for the AES S-box, the inversion map, and the random null, with coverage and seeds
      - the positive-control reproductions
      - derivation note and artifact manifest with hashes and a rebuild receipt

  falsification_conditions:
    - >-
      The coefficient fact fails at some position: claim (B) is scoped to the
      positions where it holds and the closure is NOT stated for the others;
      if it fails everywhere the closure is dead and the record reports the
      membership test results as the only content.
    - >-
      The membership test returns a hit on AES: either the lemma is wrong,
      its hypothesis was mis-evaluated, or the family implementation admits
      an operation outside Theorem 2's form; the hit is exhibited, the lemma
      is re-examined, and no closure is stated until the discrepancy is
      resolved.
    - >-
      The nearby object returns zero hits: the membership test is broken and
      the AES zero is void.
    - >-
      The baseline fixture fails: the o-DDT routine or the operation family
      is wrong and nothing about AES may be read.
    - >-
      The census finds max_o delta_o(S) far above the null: the S-box is
      o-weak for some byte-parallel operation; this does not revive the
      closed class but is the strongest possible input to the open classes
      and must be handed forward, not absorbed.

  confounders:
    - >-
      THE FAMILY IN THEOREM 2 IS PARAMETERISED WITH W_o IN A CANONICAL
      POSITION; operations with W_o in general position are conjugates under
      GL(8, 2). MITIGATION: the closure lemma is basis-free (it uses only
      that W_j is a proper non-trivial subspace); the census over the
      canonical family covers all operations up to conjugation only if the
      S-box is also conjugated, so the census is reported as a census over
      the canonical family and its GL-orbit coverage is stated explicitly
      rather than assumed.
    - >-
      SHIFTROWS MAKES THE PER-POSITION SUBSPACES INTERACT ACROSS COLUMNS;
      the lemma uses lambda^2 to reach every pair. MITIGATION: the fact is
      computed on lambda^2; if some pairs need lambda^3 the computation is
      extended and the exponent used is recorded.
    - >-
      THE INVERSION MAP AND THE FULL S-BOX MAY DIFFER ON THE CENSUS, and a
      reader might attribute a weakness of Inv to AES. MITIGATION: the two
      are reported side by side and the record's S-box statement is about
      the full S-box only.
    - >-
      SAMPLING IN THE d <= 4 STRATA CANNOT EXCLUDE A RARE WEAK OPERATION.
      MITIGATION: coverage is stated per stratum and the unsampled remainder
      is named OPEN.

  interpretation_limits:
    - >-
      CLAIM TIER toy under RQ-AES-002 R7. The closure is a derivation plus a
      finite computation; it asserts nothing about AES security beyond the
      named class and asserts no relation to the published state of the art.
    - >-
      THE CLOSED CLASS IS NARROW AND IS NAMED EXACTLY: byte-parallel
      alternative operations with o-linear diffusion. The paper's own scope
      restriction (page 4) is what makes the closure clean, and the same
      restriction is what leaves the non-parallel and probabilistic classes
      open.
    - >-
      NOTHING HERE MOVES AN EXPONENT; the record is a barrier instrument
      with a component-level census attached, and it says so.
    - >-
      Novelty of the lemma against the hidden-sum literature is unresolved;
      the elementary character of the argument makes prior knowledge likely,
      and the record does not claim otherwise.

  heuristic_assumptions:
    - id: H1
      statement: >-
        CENSUS-NULL HEURISTIC. For a uniformly random permutation pi of
        GF(2)^8 and a fixed alternative operation o, the o-differential
        uniformity delta_o(pi) is distributed as the maximum of the
        non-trivial entries of a DDT computed in a different but isomorphic
        vector-space structure, i.e. it has the same distribution as the
        +-differential uniformity of a random permutation (whose maximum
        entry is typically 8 to 12 for n = 8); and the AES S-box, unless it
        has o-structure, falls inside that distribution for every o.
      rigorous_support: >-
        RIGOROUS INGREDIENT: (V, o) is a vector space isomorphic to (V, +)
        (Theorem 2 gives the basis), so for a random permutation the o-DDT is
        the +-DDT of a conjugate random permutation and the two distributions
        coincide exactly. CLASSICAL DISTRIBUTION IMITATED: the known
        distribution of the differential uniformity of a random permutation
        of GF(2)^n (entries approximately Poisson with mean 1 per cell,
        maximum over 2^{2n} cells). THE GAP: for the AES S-box the operations
        are not random relative to the S-box, and that non-randomness is
        exactly what the census measures; H1 is the null, not a claim about
        AES.
      falsification_condition: >-
        The random-permutation census under some o differs from the +-DDT
        maximum distribution by more than sampling error: then the o-DDT
        routine is wrong (since the isomorphism makes them equal in law), and
        the census is void until fixed.
      validation_plan: >-
        SAMPLE: 100 uniformly random 8-bit permutations from a declared seed,
        each under the full d = 5, 6 operation set and the declared d = 4
        sample. SHORTCUT: none needed at n = 8. COMPARISON: empirical
        distribution of delta_o(pi) against the empirical distribution of
        delta_+(pi) over the same permutations, which must coincide within
        sampling error by the isomorphism argument. TAIL CHECK: the largest
        delta_o observed over all (pi, o) pairs versus the largest delta_+;
        their ratio must be near 1. TRANSFER: none; everything is at n = 8.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED AND NO EXPONENT IS MOVED; barrier instrument plus
      component census, stated as such. The closure costs one 16x16 GF(2^8)
      matrix computation; the census costs about 2^16 o-operations per
      (S-box, operation) pair times the number of operations enumerated
      (2^6 + 2^15 + up to 2^24), at most about 2^40 elementary operations in
      C, and is scoped down with coverage stated if the measured throughput
      does not fit a producer slot.
    memory_exponent: >-
      One 256x256 table per DDT, negligible; the census stores only per-
      operation maxima.
    best_known: >-
      Definitional reference: exhaustive key search at 2^{k-1} AES-k
      evaluations expected. For the obstruction: no committed record and no
      read paper computes H_o membership of the AES linear layer or the
      o-DDT of the AES S-box.
    hidden_overhead: >-
      None in the closure. In the census the d <= 4 strata may be sampled
      rather than exhausted, and the unsampled remainder is reported as
      open.
    tradeoff_note: >-
      Parallelisation of the census is trivial across operations and across
      the four cores; no time-memory trade exists.

