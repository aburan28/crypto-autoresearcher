idea:
  id: IDEA-20260901-1e3c7e
  question_id: RQ-AES-002
  research_question: RQ-AES-002
  goal_id: GOAL-AES-002
  added: '2026-09-01'
  title: >-
    HIDDEN SUMS AGAINST FULL-ROUND AES: the byte-parallel alternative
    operations of Calderini-Sala and Blondeau-Civino-Sala -- an attack object
    that is an OPERATION on the message space, not a difference -- are closed
    at MixColumns by a one-line field-generation lemma (a GF(2)-subspace of
    GF(2^8) stable under multiplication by an element outside GF(2^4) is
    trivial or everything), which makes the o-linear-diffusion class
    unavailable for AES at EVERY round count, full round included and
    unconditionally, given one computed coefficient fact; the second
    deliverable is the o-differential-uniformity census of the AES S-box over
    the enumerable byte-parallel operations against a random-permutation
    null, which decides whether the S-box side leaves anything for the open
    non-parallel and probabilistic-diffusion classes to feed on
  class: mechanism

  claim: >-
    FIVE SEPARABLE CLAIMS. (A) THE OBJECT AND ITS THEORY, VERIFIED FROM THE
    PRIMARY TEXT THIS SESSION. Blondeau, Civino and Sala (eprint 2017/610,
    read in full) define, for any 2-elementary abelian regular subgroup T_o of
    AGL_+(V) with T_+ < AGL_o, an alternative operation o on V = GF(2)^n, the
    weak-key subspace W_o = {k : x o k = x + k for all x} with
    2 - (n mod 2) <= dim W_o <= n - 2 (their Theorem 1, from
    Caranti-Dalla Volta-Sala and Calderini-Sala), the error set U_o with
    (x + k) o ((x o Delta) + k) = Delta + k.Delta in Delta + U_o (Theorem 5,
    so XOR key addition is o-affine only up to an error in U_o and exactly
    o-affine iff k is a weak key), and the group H_o = GL_+ intersect GL_o of
    maps linear w.r.t. both + and o, with W_o H_o = W_o (Theorem 6). Their
    attack is an o-differential attack on an SPN whose diffusion layer lambda
    lies in H_o, so that only the S-box and the key addition need
    probabilistic analysis; they restrict to operations applied in parallel
    on bricks (page 4) and exhibit a 15-bit SPN that is classically
    differential-secure and o-differential-weak. (B) THE CLOSURE LEMMA, DERIVED
    THIS SESSION AND MACHINE-CHECKABLE. Let o be byte-parallel on the AES
    state, o = (o^(1), ..., o^(16)) with per-byte weak-key subspaces
    W_j = W_{o^(j)} of dimension d_j in [2, 6]. If lambda = MC o SR were in
    H_o, then by Theorem 6 every power of lambda preserves the direct sum of
    the W_j. Write Lambda = lambda^2 as a 16x16 matrix over GF(2^8) with
    entries m_{ab}. Then m_{aj} W_j is contained in W_a for all a, j, and if
    m_{aj} and m_{ja} are both non-zero this forces dim W_a = dim W_j and
    W_j = m_{ja} m_{aj} W_j. A GF(2)-subspace of GF(2^8) stable under
    multiplication by mu is a GF(2)[mu]-submodule, hence a GF(2)[mu]-vector
    space; if mu lies outside the subfield GF(2^4) then GF(2)[mu] = GF(2^8)
    and W_j is 0 or all of GF(2^8), contradicting 2 <= d_j <= 6. THEREFORE:
    if for every byte position j there is a position a with m_{aj} m_{ja} not
    in GF(2^4) (a finite fact about the two-round AES linear layer, computed
    at the first gate), then MC o SR lies in H_o for NO byte-parallel
    alternative operation, and the Blondeau-Civino-Sala attack in its stated
    o-linear-diffusion form is unavailable against AES at any number of
    rounds. This is unconditional, key-independent, and costs one 16x16
    matrix computation over GF(2^8). (C) WHAT THE LEMMA DOES NOT CLOSE, NAMED
    AS FORWARD GUIDANCE. Non-parallel operations on the whole 128-bit state
    (the multi-byte-coupled class the Möbius-bridge closure in KN-LIT-7595
    also names as open), and the probabilistic-diffusion variant in which
    lambda is not o-linear and the linear layer is charged a transition
    probability. Both remain OPEN AND UNATTEMPTED, not closed. (D) THE S-BOX
    CENSUS, WHICH IS THE QUANTITY THOSE OPEN CLASSES WOULD NEED. For each
    byte-parallel operation o on GF(2)^8 with T_+ < AGL_o -- parameterised by
    Theorem 2 of the paper through matrices E_{e_i} with the constraints
    b_{i,i} = 0 and b_{i,j} = b_{j,i}, so that for weak-key dimension d there
    are exactly 2^{d x C(8-d, 2)} operations with W_o = span(e_{9-d..8}) --
    compute the o-difference distribution table of the AES S-box and its
    o-differential uniformity delta_o(S) = max over non-trivial (delta_I,
    delta_O) of DDT_o. Exhaustively for d = 6 (64 operations) and d = 5
    (2^15), exhaustively or by a declared sample for d = 4 (2^24), by sample
    for d = 3 and d = 2 (2^30 each). Report max_o delta_o(S) against the same
    census on 100 uniformly random 8-bit permutations and on the inversion
    map alone, and reproduce the paper's Example 3 (a 3-bit APN S-box with
    DDT_diamond entry 8) as the positive control. (E) WHAT IS NOT CLAIMED. NOT
    any attack or distinguisher on AES; NOT a closure of o-differential
    attacks in general, only of the byte-parallel o-linear-diffusion class;
    NOT any relation to the published state of the art, unadjudicable here;
    NOT novelty of the hidden-sum theory, which is Calderini-Sala's and
    Blondeau-Civino-Sala's.

  mechanism: >-
    An alternative operation is a different way of writing the message space
    as a vector space, chosen so that the cipher's XOR key addition is still
    affine w.r.t. it (up to the U_o error) and, ideally, its diffusion layer
    is linear w.r.t. it, so that a differential attack can be run in the new
    coordinates where the S-box may be far weaker (their APN example becomes
    8-uniform in the new operation). The whole construction stands on the
    weak-key subspace W_o, a proper non-trivial subspace that the diffusion
    layer must preserve. AES's MixColumns is an MDS matrix over GF(2^8) whose
    entries generate the field, and two rounds of MC o SR connect every byte
    to every byte with GF(2^8) coefficients whose products generate the
    field; a byte-local proper subspace cannot survive multiplication by a
    field generator. The obstruction is therefore not the S-box and not the
    branch number but the FIELD STRUCTURE of the coefficients -- the same
    place KN-FIND-028 located the collinearity-breaking factor (the
    GF(2)-affine L inside the S-box) but on the other side: here the
    GF(2^8)-linear MixColumns destroys GF(2)-structure rather than the
    reverse. The S-box census then asks the complementary question: is the
    inversion-based AES S-box, optimal for XOR, also o-optimal, or does some o
    make it weak enough that a non-parallel or probabilistic construction
    could be worth pursuing.

  novelty_status: unverified

