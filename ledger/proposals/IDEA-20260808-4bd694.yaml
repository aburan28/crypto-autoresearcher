idea:
  id: IDEA-20260808-4bd694
  title: Output-sensitive signed-partition pair-sum propagation with full-cost and clustered finite-sample gates
  record_version: 3
  class: composition
  mechanism_class: probabilistic-propagation
  novelty_status: unverified
  replaces: IDEA-20260808-6c2ddd
  predecessor_sha256: 5f44cd2c42b71ef45cbbea99190c8d2c9de0a93eb583fb85389d8c2f8005c4bb
  claim: >-
    Conditionally on H1-H5, a fixed public target-independent signed-y
    antisymmetric partition whose rooted cross-pair hit probability has exponent
    gamma_B permits an exact output-sensitive ECDLP candidate search with
    expected raw time N^(2/3-gamma_B+o(1)), memory N^(1/3+o(1)), and
    full cost T*S^(1/3)=N^(7/9-gamma_B+o(1)). It improves the raw rho/vOW
    exponent only if gamma_B>1/6 and the mandatory full-cost exponent only if
    gamma_B>5/18. No such gamma is claimed to exist or to have been observed.
  mechanism: >-
    A fixed public signed-y antisymmetric partition and two independent public
    roots generate two pair-sum lists A and B of size
    L=ceil(N^(1/3)). Each entry retains its exact full point and scalar
    witness. An output-sensitive full-point join probes Q-S_B against a hash
    multimap for the smaller deduplicated side, emits every matching witness
    tuple, derives k modulo N, and accepts only after [k]P=Q. The
    combinatorial denominator D=|A||B| is computed arithmetically and is never
    enumerated.
  provenance:
    authoring_control_plane_input: 9ae810debdd34ef00324d893ac0a4300c9cdea8b
    dispatch_head_input: ead1ab61d
    predecessor_output_snapshot_input: 339bfb2c284f8f9034309e229c9ce76abfcb8eb2
    proposed_output_snapshot: null
    proposed_output_snapshot_state: unknown_until_coordinator_archive
    batch: BATCH-8d4d64
    authoring_task: TASK-20260808-acf30f
    future_snapshot_task: TASK-20260808-3425ce
    future_review_task: TASK-20260808-203b3e
  authorship:
    role: idea-generator
    runtime: native-openai-codex
    resolved_model_id: gpt-5.6-sol
    reasoning_effort: max
    fallback_used: false
    degraded_requirements: []
    bedrock_contacted: false
    author_wrote_files: false
    author_ran_commands: false
    materializer: coordinator
  proposal_boundary:
    proposal_only: true
    experiment_record_created: false
    experiment_approved: false
    implementation_performed: false
    run_performed: false
    evidence_claimed: false
    official_status_changed: false
    commit_created: false
    push_performed: false

  notation:
    group: "G=<P> of odd prime order N; Q=[k]P with k uniform in Z_N"
    size_parameter: "b=ceil(log2 N)"
    list_size: "L=ceil(N^(1/3))"
    combinatorial_offset: "D=checked_u128(|A|*|B|)"
    tuple_multiplicity: "Y=number of exactly matching scalar-witness tuples emitted"
    distinct_successes: "X=number of distinct emitted point-sum keys whose derived scalar verifies [k]P=Q"
    primary_outcome: "I=1[X>=1]"
    maximum_multiplicity: "mmax=max witness-tuples attached to one verifying point-sum key, or 0 when X=0"

  join:
    point_key: >-
      Canonical SEC1-style full-point encoding: infinity is 0x00; otherwise the
      parity prefix and fixed-width big-endian x coordinate. Hash equality is
      followed by byte equality and group equality; x-only equality is forbidden.
    construction:
      - Build A and B once per curve/model/root, retaining canonical point, scalar modulo N, side, and witness index.
      - Stable-group equal full-point keys on each side while retaining all witnesses and recording scalar and pair-sum duplicates.
      - Build a hash multimap over the side with fewer distinct keys; ties build A.
      - Probe each key on the other side with its exact complement under Q and stream the Cartesian product of matching witness buckets.
      - Charge every emitted tuple and independently verify every derived scalar; never sample or truncate successful output silently.
    denominator_rule: "D is an arithmetic offset for H2 only; no loop, allocation, or work credit may be proportional to D unless collisions are actually emitted."
    work_accounting: >-
      Per root charge list construction, 24L group-equivalent base operations,
      deduplication, actual permutation evaluations, hash allocation/build,
      every probe, every emitted tuple, every verification, failed hash attempts,
      fallback sorting, fixed-base precomputation, and serialization. Hardware
      time and peak storage, not only group additions, determine full cost.
    hash_rule:
      load_factor: 0.70
      first_seed_domain: IDEA-20260808-4bd694/join/hash/attempt-0/v1
      retry_seed_domain: IDEA-20260808-4bd694/join/hash/attempt-1/v1
      probe_limit: "ceil(8*log2(max(L,2))) slots"
      fallback: >-
        After one fully charged retry, free or charge the failed table and use a
        stable canonical-key sort-merge join in
        O(L*log L + emitted-tuples) comparisons. The fallback result must be
        byte-identical to the hash-join result when both complete.
    heavy_output:
      cap: "C_emit=ceil(64*L*log2(max(L,2))) emitted witness tuples per root"
      action: >-
        Stop before emission C_emit+1, preserve counters and the triggering
        buckets, and mark the root invalid_heavy_output rather than I=0. No
        gamma fit may drop or reweight that root. An independent exact
        sort-merge replay distinguishes a reproducible H4 failure from an
        implementation fault; either outcome blocks the primary claim.
    exact_work_formula: >-
      W_root=24L+W_dedup+W_permutation+W_hash_build+W_probe+
      Y*(W_emit+W_verify)+W_fallback. D is absent from W_root.

  formal_assumptions:
    H1:
      name: regular_output_sensitive_work
      statement: >-
        Valid roots build O(L) entries, perform O(L polylog L+Y) non-group
        operations, exactly 24L base group-equivalent operations before
        emitted-collision verification, and use N^(1/3+o(1)) peak storage.
      rigorous_support: "Deterministic operation counters, the frozen join, and packed-entry memory accounting; no probabilistic work shortcut."
      validation_route: "Largest-cell exact-implementation calibration plus counter/replay equality."
    H2:
      name: distinct_hit_enrichment
      statement: >-
        Under the equal-weight curve/model/root distribution,
        E[X]/E[D]=N^(-1+gamma_X+o(1)), hence
        mu=E[X]=N^(-1/3+gamma_X+o(1)).
      rigorous_support: >-
        For uniform independent point keys the occupancy expectation is exactly
        D/N up to excluded diagonal terms, giving gamma_X=0. Any positive
        gamma_X is therefore a structural heuristic, not a counting identity.
      validation_route: "Count-model slope with N0, N1, exact quotient, planted-exponent, and duplicate controls."
    H3:
      name: bounded_second_factorial_moment
      statement: "E[X(X-1)]<=kappa*E[X]^2 for an N-independent finite kappa."
      rigorous_support: >-
        Since E[X^2]=E[X(X-1)]+mu, Paley-Zygmund gives
        P(X>0)>=mu/(1+kappa*mu), while Markov gives P(X>0)<=mu.
        Thus gamma_B=gamma_X below the constant-success endpoint when H3 holds.
        Independent Poisson occupancy has kappa=1; transfer to these lists is heuristic.
      validation_route: "The preregistered clustered kappa estimator and finite kappa0=8 decision."
    H4:
      name: subpolynomial_multiplicity
      statement: >-
        Y/max(X,1), mmax, scalar-collision excess, pair-sum-collision excess,
        and maximum pair-sum multiplicity are N^o(1); emitted work cannot hide
        an N^delta multiplicity factor.
      rigorous_support: >-
        Classical independent balls-into-bins occupancy has polylogarithmic
        maximum load in the relevant sparse regime. The structured lists need
        direct validation; the N^(1/12) multiplicity trap is a required
        falsification control.
      validation_route: "Clustered growth-slope and tail-violation rules below."
    H5:
      name: root_stream_independence_with_model_nesting
      statement: >-
        Conditional on curve, target, and fixed public model maps, distinct
        (model,root,list) domains generate independent random-oracle streams.
        The four isomorphic models share a curve and are never treated as four
        independent outer samples.
      rigorous_support: >-
        Domain separation gives independent streams in the SHAKE256
        random-oracle model; it does not make isomorphic curves independent.
      validation_route: "Seed-collision audit, cross-root correlation output, and curve/model nested inference."

  distribution_and_estimators:
    estimand_distribution: >-
      For each b, draw an independent eligible curve and uniform target scalar;
      take the uniform mixture over the four frozen public isomorphic models and
      the uniform mixture over that model's 32L public roots. Curves have equal
      weight, then models equal weight, then roots equal weight. Cross-curve,
      cross-model, and cross-root pairs are prohibited.
    per_curve_summaries:
      mu_c: "(1/4) sum_m (1/R_b) sum_r X_cmr"
      f2_c: "(1/4) sum_m (1/R_b) sum_r X_cmr(X_cmr-1)"
      ratio_c: "(1/4) sum_m mean_r Y_cmr/max(X_cmr,1)"
      duplicate_outputs: >-
        Within-list duplicate scalar count, cross-side duplicate scalar count,
        pair-sum excess |list|-|distinct full-point keys|, maximum pair-sum
        bucket, Y/max(X,1), and mmax, all by b/curve/model/root.
    H3_estimator:
      point: "mu_hat=mean_c(mu_c); f2_hat=mean_c(f2_c); kappa_hat=f2_hat/mu_hat^2"
      interval: >-
        Resample whole curves within size 20,000 times, retaining all nested
        models and roots. Use the domain-separated seed
        IDEA-20260808-4bd694/H3/cluster-bootstrap/v1 and simultaneous 99%
        max-statistic bounds over b in {21,24,27}. A resample with mu=0 gives
        kappa=+infinity; no pseudocount is allowed.
      survive: "all three upper bounds U_kappa(b)<=8, mu lower bounds >0, and no invalid/heavy root"
      fail: "any simultaneous lower bound L_kappa(b)>8, or exact replay confirms heavy output"
      inconclusive: "neither survive nor fail, any zero-denominator bound, or any fit/bootstrap failure"
    H4_estimator:
      transformed_metrics:
        - "log2(1+Y/max(X,1))"
        - "log2(1+mmax)"
        - "log2(1+cross-side scalar-duplicate excess)"
        - "log2(1+pair-sum duplicate excess)"
        - "log2(1+maximum pair-sum multiplicity)"
      slope_model: >-
        For each metric fit free intercept + delta*b +
        beta*2^(-b/3), with curve outer clusters and model nested effects;
        obtain simultaneous 99% curve-bootstrap bounds for delta.
      finite_tail: >-
        A curve is bad at b if any nested model/root has a metric above b^2.
        Estimate q_b as bad_curves/192 and use one-sided Clopper-Pearson bounds
        with Bonferroni alpha=0.01/3 over b in {21,24,27}.
      scalar_rule: >-
        Scalar witnesses must be unique within each side exactly. One
        within-side duplicate is both implementation-invalid and H4=FAIL.
        Cross-side duplicates are permitted only as a measured H4 metric.
      pair_sum_rule: >-
        Full-point pair-sum duplicates are retained as witness buckets, never
        discarded; their excess and maximum multiplicity enter H4 and all
        emitted Cartesian products enter work.
      survive: "all U_delta<=1/24, all U_q<=0.05, exact scalar uniqueness, and no heavy-output root"
      fail: "any L_delta>=1/16, any L_q>0.05, any within-side scalar duplicate, or replay-confirmed heavy output"
      inconclusive: "the gap between the survive/fail thresholds, missing bounds, or implementation-invalid data"
    interpretation: "H3/H4 survival is finite-range consistency only, not proof of asymptotic truth."

  primary_inference:
    sizes_b: [9, 12, 15, 18, 21, 24, 27]
    models_per_curve: 4
    roots_per_curve_model: "R_b=32L"
    primary_boolean_model: >-
      I_bcmr~Bernoulli(p_bcmr);
      cloglog(p_bcmr)=alpha+(gamma_B-1/3)*(b-18)*ln(2)
      +beta*(2^(-b/3)-2^(-6))+eta_m+u_bc+v_bcm.
      eta_m sums to zero, u_bc is a curve random intercept, and v_bcm is a
      model-within-curve random intercept.
    secondary_count_model: >-
      X=0 exactly when I=0; positive X uses a hurdle negative-binomial model
      with free alpha_X, gamma_X, beta_X, curve effect, and nested-model effect.
      Zeros remain zeros and no pseudocount, log(X+epsilon), or cross-pair
      observation is allowed.
    nested_fits:
      - "B0: free alpha and gamma_B"
      - "B1: B0 + free beta + four sum-zero model effects"
      - "B2 primary: B1 + curve and model-within-curve random effects"
      - "C2 secondary: corresponding exact-zero hurdle count model"
    test: >-
      One-sided H0:gamma_B<=5/18 versus H1:gamma_B>5/18. Advancement requires
      the one-sided 95% profile-likelihood lower bound from B2, calibrated by
      curve-level parametric bootstrap at the boundary, to exceed 5/18.
    fit_rules: >-
      Two independently initialized optimizers must agree on gamma_B within
      1e-6, maximum absolute gradient must be <=1e-6, and the identifiable
      Hessian eigenvalues must exceed 1e-8. A legitimate zero random-effect
      boundary is retained; other nonconvergence or singularity is
      INCONCLUSIVE. Exact-zero cells are not removed.

  prospective_power:
    status: analytic_design_calculation_not_observation
    null_gamma: "5/18"
    interior_alternative_gamma: "11/36"
    dgm: >-
      Use the full B2 Boolean model, p at b=18 and zero effects equal to 0.30,
      eta=(-0.15,-0.05,0.05,0.15), curve SD 0.55, nested-model SD 0.25, and
      composite curve-level cloglog SD bounded by 0.60 after the four-model
      average. Beta is fitted freely; deterministic simulation must cover
      beta in {-0.5,0,0.5}. Bernoulli zeros are generated and retained exactly.
    information: >-
      Residualizing x=(b-18)ln(2) against the intercept and 2^(-b/3) on the
      seven-size grid gives 27.77 units of slope information per independent
      curve at every size. With 42 curves per size,
      lambda=(1/36)*sqrt(42*27.77)/0.60=1.58 and one-sided alpha=0.05 power is
      Phi(1.58-1.644853626951)=0.474; the earlier 42 total clusters are still
      weaker and are rejected for this test.
    frozen_outer_design:
      curves_per_size: 192
      independent_outer_clusters_total: 1344
      rationale: >-
        lambda=(1/36)*sqrt(192*27.77)/0.60=3.38, giving prospective analytic
        power Phi(3.38-1.644853626951)=0.959 while retaining free beta and the
        full curve/model nesting.
    deterministic_confirmation:
      generator: "SHAKE256 counter stream; counters are unsigned 128-bit big-endian"
      seed_domain: IDEA-20260808-4bd694/power/B2/v1
      replicates_per_grid_cell: 20000
      nuisance_grid:
        beta: [-0.5, 0.0, 0.5]
        curve_sd: [0.25, 0.55]
        nested_model_sd: [0.0, 0.25]
      gate: >-
        Before any full run, the exact planned fitter must have one-sided
        Clopper-Pearson lower power >=0.90 at gamma_B=11/36, type-I point
        estimate <=0.05 with upper bound <=0.055 at gamma_B=5/18, and
        nonconvergence <=0.01 in every grid cell. Otherwise redesign is
        required; no outcome is imputed.

  schedule_and_resources:
    per_arm_roots_by_b:
      9: 196608
      12: 393216
      15: 786432
      18: 1572864
      21: 3145728
      24: 6291456
      27: 12582912
    per_arm_roots_total: 24969216
    accounting_rule: >-
      The 192-curve schedule is exactly 32 copies of the predecessor's
      six-curve-per-size accounting block. The following is a conservative
      exact upper envelope that repeats every prior charge, including
      calibration, 32 times; it is not an approval or runtime observation.
    group_equivalents_max: 412325249024
    integer_and_synthetic_ops_max: 1109569568768
    retained_bytes_max: 163603021824
    worker_seconds_max: 3168000
    largest_cell_calibration: >-
      Use the exact production join at b=27,L=512,R_b=16384. Each of at most
      32 workers receives three disjoint non-statistical curve/model cells, then
      all workers run one concurrent disjoint cell. Record per-worker and
      aggregate roots/s, group-equivalents/s, probes/s, emissions/s, wall time,
      and peak RSS. CV>0.10, aggregate efficiency<0.70, or predicted-versus-
      observed wall error>0.15 invalidates the schedule estimate.
    reuse:
      fixed_base: >-
        A target-independent width-8 fixed-base table may be reused only across
        roots of the same curve/model and charged once to that curve/model.
        Isomorphic models have separate tables. Cross-curve reuse is forbidden.
      statistical_lists: >-
        No list, root stream, hash table, emitted tuple, selected root, or
        calibration cell may be reused as statistical data across roots, arms,
        models, curves, or planted controls.

  deterministic_null_permutations:
    orbit_domain: >-
      Zero is fixed. For x!=0 let i=min(x,N-x)-1 in [0,H), H=(N-1)/2, and let
      s identify x versus -x. A signed-domain bijection maps
      (i,s) to (pi(i),s xor flip(i)) and therefore commutes with negation.
    seed_frame: >-
      UTF-8 domain, 0x00, U16BE(bitlen(N)), fixed-width big-endian N,
      32-byte canonical curve digest, U8(model), U8(control), and U32BE(replicate).
      Roots are deliberately absent: N0/N1 are global per curve/model/control.
    permutation:
      width: "W=2*ceil(ceil(log2 H)/2) bits; h=W/2; unsigned words"
      serialization: "ceil(W/8) bytes, big-endian, unused high bits zero and rejected if nonzero"
      construction: >-
        Ten-round balanced Feistel on [0,2^W). Round j maps
        (L,R) to (R,L xor F_j(R)); F_j is the low h bits of
        SHAKE256(seed || U8(j) || fixed-width-big-endian R). Restrict to [0,H)
        by cycle-walking.
      cycle_walk: >-
        The mathematical maximum is 2^W Feistel evaluations. The operational
        cap is 64; exceeding it marks the control invalid with no reseed,
        identity fallback, or dropped input. Charge every round and walk.
      inverse: "Reverse the ten Feistel rounds and apply the same cycle-walk restriction."
      work_storage: >-
        Each lookup charges 10 times its actual walk count SHAKE evaluations.
        Persistent storage is one 32-byte seed, W, and counters per
        curve/model/control; no O(N) table or Fisher-Yates array is permitted.
    N0: >-
      Derive flip(i) from domain IDEA-20260808-4bd694/N0/flip/v1 and assign
      opposite signed labels within every negation orbit. This is globally
      balanced exactly on nonzero scalars and antisymmetric exactly; imbalance
      tolerance is zero.
    N1: >-
      Use domain IDEA-20260808-4bd694/N1/permutation/v1 and define
      label_N1(x)=label_original(f(x)) for the global signed-domain bijection f.
      The complete scalar-label histogram must be byte-identical to the
      original and antisymmetry violations must be zero.
    test_vectors:
      shake256_empty_32_hex: 46b9dd2b0ba88d13233b3feb743eeb243fcd52ea62b81b82b50c27646ed5762f
      injected_round_kat: >-
        With W=4,H=5, ten rounds, and injected F_j(R)=1 for every j,R,
        cycle-walk inputs [0,1,2,3,4] must output [0,4,2,3,1] with walk counts
        [2,1,2,2,1].
      exhaustive_small_domains: >-
        For H in {5,11,127}, enumerate the test domain only and require exact
        bijection, inverse(forward(i))=i, N0 antisymmetry/balance, and N1
        histogram identity. Tolerance is zero.
      domain_separation: "All N0/N1, curve, model, control, and replicate seed digests must differ bytewise; tolerance zero."

  controls:
    N0: "Globally balanced antisymmetric labels from the scalable permutation above; identical pipeline and accounting."
    N1: "Histogram-preserving global signed scalar-negation-orbit bijection; identical pipeline and accounting."
    exact_quotient: >-
      In G=Z/(F*K)Z use q(x)=x mod K. The exact per-query hit probability is
      1/K. Require |p_hat-1/K|<=max(5*sqrt((1/K)*(1-1/K)/n),2^-20).
    planted_exponents: ["0", "1/6", "5/18", "11/36", "1/3"]
    planted_gate: >-
      Each planted truth must lie in its profile interval and
      |gamma_hat-gamma_truth|<=1/48; otherwise the corresponding inference
      route is invalid.
    multiplicity_trap: >-
      Replicate Y by ceil(N^(1/12)) without changing scalar values, point keys,
      X, or I. X and I must remain byte-identical, while the H4 growth lower
      bound must reach at least 1/16; otherwise multiplicity detection is invalid.
    null_gate: >-
      Neither N0 nor N1 may have a one-sided lower bound above 5/18, and each
      must have an upper bound <=1/6. The structured-minus-N1 gamma contrast
      must have a positive one-sided lower bound. Failure is artifact or
      inconclusive, never supporting evidence.
    same_shape_rule: "All nulls use the same sizes, curves, four models, root counts, join, cap, fitting, and resource accounting as the structured arm."

  model_persistence_and_selection:
    required_outputs:
      - "gamma_B estimate and profile interval for every model separately and for B2"
      - "per-model/per-size hit rate, zero fraction, kappa, H4 metrics, work, and peak memory"
      - "between-model range, nested-effect variance, pairwise contrasts, and cross-root correlations"
      - "fraction_crossing=(1/4)*sum_m 1[L_gamma_B,m>5/18]"
      - "fraction_point_crossing=(1/4)*sum_m 1[gamma_hat_B,m>5/18]"
    interpretation: "Fractions are heterogeneity diagnostics; four nested models are not four replications and no fraction alone can pass the claim gate."
    primary_selection: disabled
    optional_target_independent_selector: >-
      On disjoint pilot roots and without Q, score each model by the negative
      sum of normalized pair-sum duplication and measured work; choose the
      maximum score, breaking ties by the smallest public model index. Report
      all four models regardless. Pilot roots may not enter primary inference.
    selector_cost: >-
      If selector time is N^(tau+o(1)) and storage N^(sigma_sel+o(1)), then
      T_total=T_selector+T_main has exponent
      max(tau,2/3-gamma_B), peak-storage exponent
      max(sigma_sel,1/3), and full-cost exponent
      max(tau,2/3-gamma_B)+max(sigma_sel,1/3)/3. Tau is not added
      automatically to the main exponent.

  peak_memory:
    widths: >-
      Let pB=ceil(bitlen(p)/8), nB=ceil(bitlen(N)/8), ptB=1+pB, and
      align8(x)=8*ceil(x/8). Use packed widths
      w_list=align8(ptB+nB+8), w_dedup=align8(ptB+8+8),
      w_hash=align8(8+8+8+4+1), w_emit=align8(2*nB+8), and
      w_aff=align8(2*pB+1).
    per_worker_bound: >-
      M=2L*w_list+2L*w_dedup+ceil(L/0.70)*w_hash+
      2L*8+256*w_emit+255*w_aff+65536 bytes. This conservatively holds raw
      lists, both dedup arrays, one hash table, sort scratch, a streaming
      emission batch, a width-8 fixed-base table, and a 64-KiB control reserve.
    largest_cell: >-
      At b=27 with 27-bit p,N and L=512, widths are
      (24,24,32,16,16) and M=154480 bytes per worker. At 32 concurrent workers
      plus a 1-MiB shared ring, the derived algorithmic peak is 5991936 bytes.
      Actual RSS must also be measured; retained artifact bytes are not called
      peak memory.
    model_charge: "All four models are charged four times in work and retained storage; sequential model processing avoids an unreported factor four in per-worker peak."

  cost_model:
    convention: exponent_only_for_all_comparison_rows
    full_cost: "FC=T*S^(1/3), with T measured as complete hardware*time"
    rows:
      rho_vow: {raw_time_exponent: "1/2", storage_exponent: "0", full_cost_exponent: "1/2"}
      bsgs_full_memory: {raw_time_exponent: "1/2", storage_exponent: "1/2", full_cost_exponent: "2/3"}
      bsgs_memory_N13: {raw_time_exponent: "2/3", storage_exponent: "1/3", full_cost_exponent: "7/9"}
      candidate: {raw_time_exponent: "2/3-gamma_B", storage_exponent: "1/3", full_cost_exponent: "7/9-gamma_B"}
    constants_stripped: >-
      Every comparison row strips every constant, including rho/vOW 0.886,
      BSGS constants, candidate 24, expected-root constants, hashing, wiring,
      verification, and parallel efficiency. No mixed-constant concrete
      advantage is claimed.
    matched_concrete_requirement: >-
      Any future concrete table must instead use 0.886*sqrt(N) aggregate
      group operations for rho/vOW and candidate
      E[R]*(24L+W_dedup+W_permutation+W_hash+W_probe+
      Y*(W_emit+W_verify)+W_fallback), where E[R]=1/P(I=1), with the same
      hardware-time conversion. Before overhead,
      log2(24*N^(2/3-gamma_B)) adds exactly 4.5849625007 bits to candidate
      raw work and the corresponding full-cost row. Asymptotic FC cannot
      establish concrete constant advantage.
    hidden_costs:
      - "permutation and cycle-walk evaluations"
      - "deduplication, hash retries, sort fallback, emitted tuples, and exact verification"
      - "four model maps and target-independent selector, if enabled"
      - "fixed-base construction, inter-worker communication, retained outputs, and parallel inefficiency"
      - "profile/bootstrap fitting and failed or heavy-output roots"
