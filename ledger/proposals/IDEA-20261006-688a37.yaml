idea:
  id: IDEA-20261006-688a37
  question_id: RQ-ECDLP-4fcbd3
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Y-axis hit rate along the binary prefixes of scalar 11 on two
    ordinary curves over the 12-bit prime 2053
  class: measurement
  claim: >-
    REPRESENTATION AND STAGE. R1 is the affine x-coordinate on a short
    Weierstrass model, read from RQ-ECDLP-623a32. The attack stage is
    collision structure. The charged discrete-log cost of that stage is
    not claimed to change: the exponent delta versus Pollard rho is 0.
    Let p=2053. Let E1 be y^2=x^3+x+1 and E2 be y^2=x^3+x+2 over F_p.
    For m in {2,5,11}, which are the proper prefix scalars of the
    binary expansion 11=1011_2 after the leading 1, and for P in E_i(F_p),
    count a hit when [m]P is affine and has x-coordinate 0. Let Z_i be
    that hit count and N_i=#E_i(F_p). The claim is that the two integers
    Z_1*N_2 and Z_2*N_1 differ by at least 1, after both curves have been
    checked nonsingular and ordinary (N_i not equal to p+1). Two
    explanations are discriminated before the count is run. E-rate: the
    pullback size of the predicate x=0 under { [2],[5],[11] } depends on
    the cubic, so the cross products differ. E-balance: the two rates
    agree, including the case where both hit counts are 0, so the cross
    products are equal. Equality is the negative. This is not a discrete
    logarithm, not a trapdoor, and not a walk collision search.
  mechanism: >-
    OBJECT FRAME. The representation is the affine x-coordinate (R1).
    The operation set Sigma is { [2], [5], [11] }, three multiplication
    maps coming from one fixed binary chain, not the full translation
    action of the group. Trichotomy: branching. The predicate x=0 on
    [m]P is not a function of the predicate x=0 on P, so the label does
    not propagate deterministically along Sigma. LOSSY-PROJECTION TEST.
    The projection keeps only whether x([m]P) is 0 and discards y, the
    discrete log, and every nonzero x. Many points share the miss label,
    so the projection is lossy. The discard is compatible with Sigma
    only as a branching bound: each [m] pulls the y-axis back to a
    finite fiber whose size is what Z_i counts. It is not a block system
    of the full translation group. Families F1 through F7 are not the
    lens. The binary chain is a fixed multiplication schedule, not a
    rho, kangaroo, or distinguished-point collision search. PRICED OPEN
    NUMBER. The branching numerator is Z_i, and the integer the claim
    prices is |Z_1*N_2 - Z_2*N_1|. No factor base is proposed, so
    KN-OPEN-020's open classes are not entered.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: >-
        The question asks whether a coordinate bias of prime-field
        addition carries discrete-log information on ordinary curves,
        with toy exhaustive checks and a random-curve null.
      verified_by: idea-generator 2026-10-06 read ledger/questions/RQ-ECDLP-4fcbd3.yaml
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        R1 is a field representation of coordinates. Kummer-line and
        degree-d-function-on-E representations are closed at model
        lever 1. This record uses the x-coordinate only as the
        predicate x=0, not as a new point encoding.
      verified_by: idea-generator 2026-10-06 read ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. A coordinate count that does not exploit a
        non-generic operation does not move that exponent.
      verified_by: idea-generator 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: Silverman, The Arithmetic of Elliptic Curves, chord-and-tangent duplication
      provenance: recalled
      claim: >-
        Doubling and addition on a short Weierstrass model are rational
        maps, so each prefix [m]P is a definite point. The book was not
        opened in this session.
      verified_by: null
  assumptions:
    - >-
      p=2053 is prime. It was checked by trial division by every prime
      at most 43, which is enough because sqrt(2053) is about 45.3.
      Its bit length is 12, inside the question's field_bits window
      12 to 24.
    - >-
      For A=1 and B=1, 4A^3+27B^2=31, and 31 is not 0 in F_2053. For
      A=1 and B=2, 4A^3+27B^2=112, and 112 is not 0 in F_2053. Both
      models are nonsingular.
    - >-
      (0,1) and (0,-1) lie on E1 because both squares equal 1 and the
      right-hand side at x=0 is 1. No such substitution is asserted
      for E2.
    - >-
      The prefix scalars of 11=1011_2 after the leading 1 are exactly
      2, then 5, then 11. No other addition chain is used.
  proof_search_map:
    not_applicable_reason: >-
      This is one integer comparison of a coordinate hit rate on two
      named curves. It is not a proof that a coordinate predicate
      recovers a discrete logarithm, and it does not claim an
      exponent.
    bottleneck: >-
      The quantity that would have to move for this predicate to
      matter to collision structure is the cross-product gap
      |Z_1*N_2-Z_2*N_1|. Group order alone is a confounder and is
      cancelled by the cross product.
    baseline_embedding:
      parameter_slice: p=2053, scalar 11, prefixes {2,5,11}, models E1 and E2
      reproduction_check: >-
        Each hit is recomputed from the chord-and-tangent law and
        checked to satisfy the cubic. N_i is the point count, checked
        by enumerating affine solutions of the cubic plus the point
        at infinity.
    observation_collision:
      observable: the unordered pair of rates, represented by the two products Z_i*N_{3-i}
      distinct_preimage_search: >-
        E1 and E2 are two cubics at the same p. If the products agree,
        the same observable arises from both equations and E-balance
        holds.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the fiber of x=0 under each prefix map [m]
        predicted_gain: >-
          The cross products differ by at least 1, or the record
          reports that they do not.
    quantifier_order: >-
      Exists one prime p=2053 and two named ordinary nonsingular
      models such that |Z_1*N_2-Z_2*N_1|>=1. Not for all primes and
      not for all cubics.
    method_ceiling:
      strongest_certifiable_claim: >-
        At p=2053 the two rates differ, or they do not. No discrete
        logarithm and no sub-rho algorithm is certifiable from Z_i.
      nearby_object_control: >-
        The same maps on the additive group Z/N_iZ with a random
        injection of group elements to affine x-coordinates, using the
        same N_i, must be scored separately. If that random-label
        cross product has the same gap, the gap is the fiber-size
        arithmetic of a 2-to-1 coordinate, not a property of these
        cubics.
    proof_obligations:
      - claim: Z_i counts only affine points with x=0 on the named prefixes.
        responsibility: correctness
  predictions:
    - metric: absolute difference of the cross products Z_1*N_2 and Z_2*N_1
      direction: different
      minimum_effect: at least 1
  minimal_test:
    design: >-
      Enumerate both curves over F_2053. Reject the cell if either
      discriminant is 0 or either N_i equals 2054. For every point and
      each m in {2,5,11}, compute [m]P and increment Z_i when the
      result is affine with x=0. Emit Z_1, Z_2, N_1, N_2, and the two
      products.
    controls:
      - >-
        Ordinary control: N_i=p+1=2054 excludes that curve. The claim
        is not scored on a supersingular model.
      - >-
        Substitution control: (0,1) on E1 must be present and must
        contribute to Z_1 whenever some m in {2,5,11} sends a point
        to it. A census that misses (0,1) is an invalid instrument.
      - >-
        Random-label control: replace x-coordinates by a random
        bijection of the same multiset of x-values and recompute the
        cross product. The cubic claim is about the actual x, so this
        control is reported beside it and is not substituted for it.
      - >-
        Identity control: the prefix list is exactly {2,5,11}. A run
        that uses scalar 11 as a single multiplication and skips the
        prefixes does not measure Z_i.
    required_metrics:
      - N_1 and N_2
      - Z_1 and Z_2
      - absolute difference of Z_1*N_2 and Z_2*N_1
      - whether either N_i equals 2054
  falsification_conditions:
    - Either model is singular or either N_i equals 2054, so the ordinary pair is not available and the claim fails for this pin.
    - Z_1*N_2 equals Z_2*N_1. That integer equality is the negative and means the rates agree.
    - The census of E1 does not contain the point (0,1).
  confounders:
    - >-
      A difference of raw hit counts can be an artifact of N_1 not
      equal to N_2. The cross product is the metric so that equal
      rates do not look like a gap.
    - >-
      Points of order dividing m have smaller fibers. The count still
      includes them; it is not restricted to a prime-order subgroup
      unless a later protocol adds that cut.
    - >-
      The point at infinity is never a hit. An implementation that
      stores infinity as x=0 inflates Z_i.
  interpretation_limits:
    - >-
      A nonzero gap is a statement about one predicate on one chain at
      p=2053. It is not evidence that a coordinate distinguisher beats
      rho, and KR-RHO-13bf67 still bounds generic algorithms by
      Omega(sqrt(N)).
    - >-
      The question's decision target asks about leakage into key
      recovery. This record does not supply that leakage. A gap only
      separates E-rate from E-balance.
    - >-
      No factor base is defined. KN-OPEN-020 is not escaped and is
      not entered.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For these two cubics, the indicator that [m]P has x=0, as P
        runs through E_i(F_p), has mean Z_i/(3 N_i) within 1/N_i of
        the fraction of affine points with x=0, as it would for a
        uniformly random endomorphism of a set of size N_i.
      rigorous_support: >-
        Each [m] is a group endomorphism of degree m^2. The fiber of
        a point under [m] has size gcd(m, N_i) when the point is in
        the image. That is the proved fiber bound. The random-map
        mean is the distribution being imitated, not a theorem about
        these cubics.
      validation_plan: >-
        At p=2053, compute the exact fraction of points with x=0 and
        the exact hit rate Z_i/(3 N_i) for each curve. Compare them.
        Then repeat the same two rates at the next two primes above
        2053 for the same two coefficient pairs, still inside 16
        bits, and check whether the cross-product gap keeps the same
        sign. A gap that flips sign or collapses to 0 at the next
        prime is a failure of transfer off p=2053. No cryptographic
        size is claimed.
  target_complexity:
    time_exponent: >-
      The measurement enumerates E(F_p) in Theta(p) field operations.
      The discrete-log exponent stays 1/2. Delta versus Pollard rho
      is 0.
    memory_exponent: O(1) beyond the current point; the group need not be stored.
    best_known: Pollard rho at Theta(N^{1/2}) group operations, KR-RHO-13bf67.
    hidden_overhead: >-
      No o(1) term is claimed. There is no discrete-log algorithm in
      this record.
    tradeoff_note: >-
      No time-memory tradeoff and no parallel collision search. van
      Oorschot-Wiener does not apply to a one-pass census.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this census is dominated by Pollard rho.
    KR-RHO-13bf67, KR-RHO-fb88e6, KR-RHO-cd86f5, and KR-RHO-6239aa were
    read. Rho meets Omega(sqrt(N)) up to a constant; the negation map
    and r-adding walks change only constants; distinguished points
    change storage of a collision search. None of those rows states
    this y-axis prefix count, so they do not dominate the integer
    comparison. They do dominate any reading of Z_i as an attack.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. Rho
    remains Theta(N^{1/2}) group operations. This census is Theta(p)
    field operations and returns one integer gap, not a logarithm.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-cd86f5
      - KR-RHO-6239aa
      - KR-RHO-6654ba
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          Time-exponent delta versus the Omega(sqrt(p)) generic bound
          is 0. The new integer is the absolute difference of the
          cross products, which that row does not define.
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: orthogonal
        delta: >-
          The negation map changes rho's iteration count by a constant
          near sqrt(2). This record's iteration-count delta is 0. The
          measured integer is a prefix hit count, not a fruitless-cycle
          count.
      - ref: KR-RHO-cd86f5
        provenance: internal
        relation: adjacent
        delta: >-
          r-adding walks change the rho walk constant. The chain here
          is one scalar's three prefixes, and the walk-constant delta
          is 0.
      - ref: KR-RHO-6654ba
        provenance: internal
        relation: orthogonal
        delta: >-
          Point halving replaces addition steps on binary curves. This
          record is a prime-field census of the predicate x=0. The
          discrete-log exponent delta is 0, and no halving step is used.
          The frontier match ranked this row first on shared words; the
          objects differ.
    searched:
      corpus_grep:
        - >-
          ledger/proposals IDEA-*.yaml for y-axis visit, x-coordinate
          equals 0, prefix scalar, and binary prefix: no matches on
          this predicate
        - >-
          ledger/proposals IDEA-*.yaml for y-axis point: no matches
          on this predicate
