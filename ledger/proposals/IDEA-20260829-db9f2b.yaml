        Source of the FIPS 203 constants used in the arithmetic above
        (q = 3329, n = 256, k in {2,3,4}, sigma = 1 for CBD_2 and sqrt(3/2) for
        CBD_3).
      verified_by: >-
        idea-generator subagent read lines 1-70 in full on 2026-08-29.
        Remainder not read.
    - ref: >-
        IDEA-20260722-001, IDEA-20260805-690de8, IDEA-20260805-866eca
        (isometry-orbit lane)
      provenance: internal
      claim: >-
        The corpus's existing use of the 256 ring rotations, as batched samples
