idea:
  id: IDEA-20260829-db9f2b
  question_id: RQ-MLKEM-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed

  title: >-
    ML-KEM's primal instance has a dense rank-1 SUBMODULE that the scalar
    Kannan embedding destroys and the module Kannan embedding exposes: import
    the algebraic Pataki-Tural lemma of Karenin-Kirshanova and the Ducas-van
    Woerden fatigue analysis, both written for NTRU, and compute the
    Dense-Submodule-Discovery threshold q_fat(n, k, sigma) for module-LWE - the
    one failure mode that has historically broken published lattice estimates

  class: composition

  claim: >-
    (A) THE OBJECT, AND WHY IT IS INVISIBLE IN THE STANDARD ESTIMATE. Every
    published ML-KEM primal estimate embeds the BDD instance with the SCALAR
    Kannan embedding: one extra integer coordinate, one short target vector
    (s, e, 1), one unique-SVP instance. That embedding is a choice, and it is
    not the only one. The MODULE Kannan embedding appends a full ring
    coordinate, producing a lattice of R-rank 2k+1 (Z-rank 256(2k+1): 1280,
    1792, 2304 for ML-KEM-512/768/1024) which contains the entire rank-1
    R-submodule R.(s, e, 1). Because the ring is a power-of-two cyclotomic, all
    256 rotations X^i (s, e, 1) have EXACTLY the same Euclidean norm. So the
    module-embedded ML-KEM instance is not a unique-SVP instance with one short
    vector; it is a DENSE-SUBLATTICE instance with a rank-256 family of equally
    short vectors - structurally the same shape as NTRU, which is the one
    lattice family where the standard unique-SVP estimate is known to have been
    quantitatively WRONG, by the overstretched/Dense-Sublattice-Discovery
    mechanism.
    (B) THE FALSIFIABLE STATEMENT. Define the MLWE FATIGUE POINT q_fat(n, k,
    sigma) as the modulus at which, on the module-Kannan lattice, the
    Dense-Submodule-Discovery (DSD) event - insertion into the basis of a vector
    of R.(s, e, 1) that is not itself the secret - occurs at a strictly smaller
    blocksize than the Secret-Key-Recovery (SKR) event. The claim is that
    q_fat(n, k, sigma) is computable at the exact FIPS 203 parameters from the
    published machinery - the algebraic Pataki-Tural lemma of Karenin and
    Kirshanova (eprint 2024/844, AfricaCrypt 2024), which generalizes the
    Euclidean Pataki-Tural lemma to modules over any number field and defines
    the algebraic DSD event, plus the profile-crossing analysis by which Ducas
    and van Woerden located the NTRU fatigue point at q = n^(2.484+o(1)) - and
    that nobody has computed it for module-LWE. The fetched abstract of eprint
    2024/844 states the DSD event for NTRU viewed as a rank-2 module with a
    rank-1 dense submodule; ML-KEM is a rank-(2k+1) module with a rank-1 dense
    submodule, which is the SAME lemma at a different rank and a different
    determinant, and the rank is exactly the parameter the conclusion turns on.
    (C) THE TWO OUTCOMES, DEFINED IN ADVANCE.
    H_SAFE (predicted): q_fat(256, k, sigma) exceeds 3329 by a wide margin and
    INCREASES with k, because the dense submodule occupies only 1/(2k+1) of the
    ambient rank (1/5, 1/7, 1/9) against NTRU's 1/2, so the submodule must
    undercut the geometric mean of a much deeper and much lower tail of the
    reduced profile. Deliverable: a measured obstruction - the first quantified
    statement of how far ML-KEM sits from its own overstretched regime, with a
    number and error bars, valid for every future proposal that wants to argue
    "the module structure creates dense sublattices".
    H_LIVE (falsifying): q_fat(256, k, sigma) is at or below 3329 for some
    parameter set, in which case the dominant primal attack on that parameter
    set is DSD and not SKR, every published core-SVP blocksize for it is derived
    from the wrong event, and the security estimate is wrong in the direction
    that matters. This is not a hypothetical failure mode: it is precisely what
    happened to overstretched NTRU parameters.
    (D) EXPONENT POSITION. Under H_LIVE the classical core-SVP exponent moves
    from 0.292 * beta_SKR to 0.292 * beta_DSD with beta_DSD < beta_SKR, and the
    gain is whatever the profile crossing delivers - for overstretched NTRU the
    analogous gap is tens to hundreds of blocksize units. Under H_SAFE nothing
    moves and the record is a closure. The proposal does not predict a gain; it
    predicts a margin, and states the margin's minimum size in advance.

  mechanism: >-
    LOSSY-PROJECTION TEST. The tracked object is the DENSE RANK-1 SUBMODULE
    D = R.(s, e, 1) reduced to two scalars: its rank over R (which is 1, by
    construction) and its normalized covolume vol(D)^(1/n). The projection
    L |-> (rank D, vol(D)^(1/n)) discards the submodule's orientation, its
    individual vectors, the secret itself, and all of the ambient geometry
    outside D - it retains two numbers out of a 1792-dimensional object, so it
    is drastically lossy and is not a change of coordinates. It is discarded
    COMPATIBLY with the target's operations: lattice reduction acts by
    unimodular change of basis, under which a submodule maps to an isomorphic
    submodule with the SAME rank and the SAME covolume, so the projected pair is
    an invariant of the reduction process and propagates deterministically. That
    invariance is exactly what makes the Pataki-Tural inequality - which bounds
    products of Gram-Schmidt norms by submodule covolumes - a usable prediction
    rather than a description.
    THE CAUSAL MECHANISM. Pataki-Tural says that for any rank-m sublattice, the
    product of the m smallest Gram-Schmidt norms of any basis of the ambient
    lattice is at most the sublattice covolume. As BKZ pushes the profile down,
    the tail of the profile eventually falls below vol(D)^(1/n) and the
    inequality can only be maintained by the reduction actually INSERTING
    vectors of D into the basis - the DSD event. Whether that happens before or
    after SKR is a race between two crossings of the same falling profile, and
    both crossing points are computable from the GSA once three numbers are
    fixed: the ambient normalized covolume vol(Lambda)^(1/D), the dense
    submodule's normalized covolume vol(D)^(1/n), and the relative rank n/D.
    Instantiating at ML-KEM-768: vol(Lambda)^(1/1792) = q^(768/1792) = 3329^0.4286
    = 32.3, while vol(D)^(1/256) is approximately c * sigma * sqrt(n(2k+1)) =
    c * 42.3 with c a computable constant near 0.8 arising from the Gram
    determinant of the rotation basis of a random ring vector. The submodule's
    normalized covolume therefore sits ABOVE the ambient one by a factor around
    1.05, while DSD requires it to fall below the geometric mean of the LAST 256
    Gram-Schmidt norms - which under any decreasing profile is far below 32.3.
    That is the mechanism of the predicted margin, and it is arithmetic, not
    intuition.
    WHY THE RANK IS THE LOAD-BEARING PARAMETER. NTRU's dense sublattice is half
    the ambient rank; ML-KEM's is 1/(2k+1). The deeper the tail the submodule
    must undercut, the lower the profile must be pushed, the larger the
    blocksize, and the larger q must be before DSD wins. This predicts q_fat
    increasing in k, i.e. ML-KEM-1024 is the SAFEST against this attack and
    ML-KEM-512 the least safe - the opposite of the ordering people expect from
    a structural attack, which makes it a sharp and easily checked signature
    rather than a vague expectation.
    WHY THIS IS NOT A RENAMED KNOWN APPROACH. The corpus's isometry-orbit
    records (IDEA-20260722-001, IDEA-20260805-690de8, IDEA-20260805-866eca) use
    the 256 rotations as extra SAMPLES or as reusable work, tracking the sample
    set. This record does not use the rotations as samples at all; it uses the
    fact that they SPAN a submodule of a specific covolume, and the tracked
    quantity is that covolume. The rotations could be worthless as samples - as
    those records largely conclude - and the dense-submodule effect would be
    completely unaffected, because the covolume does not care whether the
    rotations are informative.

  novelty_status: adaptation

  citations:
    - ref: 'eprint 2024/844, Karenin and Kirshanova, "Finding Dense Submodules with Algebraic Lattice Reduction" (AfricaCrypt 2024)'
      provenance: retrieved
      claim: >-
        Proves an algebraic analogue of the Pataki-Tural lemma, generalizing it
        "from Euclidean lattices to modules over any number field", enabling
        NTRU to be viewed as a rank-2 module over cyclotomic number fields with
        a rank-1 dense submodule generated by the NTRU secret key; formulates
        the Dense Submodule Discovery (DSD) event and heuristically predicts
        when it happens; formulates an algebraic Geometric Series Assumption and
        verifies it with an implemented algebraic LLL.
      verified_by: >-
        WebFetch of https://eprint.iacr.org/2024/844 on 2026-08-29; abstract
        returned verbatim. Paper BODY NOT READ. The fetch tool additionally
        reported that module-NTRU and module-LWE variants are "not explicitly
        discussed" and that no explicit q/degree/rank threshold formula is
        given - that is the tool's reading of the landing page and is NOT a
        reliable negative; the body must be read before any priority claim.
    - ref: 'Ducas and van Woerden, "NTRU Fatigue: How Stretched is Overstretched?" (ASIACRYPT 2021)'
      provenance: retrieved
      claim: >-
        Locates the NTRU fatigue point - the modulus at which the overstretched
        regime begins - narrowing it for ternary NTRU from q <= n^(2.783+o(1))
        to q = n^(2.484+o(1)); characterizes DSD as the event in which a vector
        of the dense sublattice generated by the secret key is inserted into the
        basis, strictly longer than the secret key yet still leading to a
        successful attack, either because SKR follows quickly, or because DSD
        events cascade and generate the dense sublattice, or because the
        discovered vector alone suffices to decrypt fresh ciphertexts.
      verified_by: >-
        WebSearch on 2026-08-29 returned these statements, attributed to the
        Ducas-van Woerden ASIACRYPT 2021 paper and its authors' own posted PDF.
        The PDF ITSELF WAS NOT OPENED this session; the n^2.484 figure and the
        DSD characterization are quoted from the search-result summary. A
        reviewer should re-verify both against the paper before either is used
        as a load-bearing constant.
    - ref: 'eprint 2025/1904, Ducas, Engelberts, de Perthuis, "Predicting Module-Lattice Reduction"'
      provenance: retrieved
      claim: >-
        Module-BKZ over a power-of-two cyclotomic field requires a blocksize
        larger than unstructured BKZ by d - 1 + o(1). Cited here as the reason
        the algebraic DSD prediction must be evaluated under UNSTRUCTURED BKZ on
        the Z-lattice, not under algebraic reduction: the algebraic route is
        priced worse for exactly ML-KEM's field.
      verified_by: >-
        WebFetch of https://eprint.iacr.org/2025/1904 and
        https://arxiv.org/abs/2510.10540 on 2026-08-29; abstracts returned
        verbatim and agreeing. Bodies not read.
    - ref: IDEA-20260821-003cb0
