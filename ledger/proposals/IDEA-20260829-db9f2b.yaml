  assumptions:
    - >-
      The module Kannan embedding is a legitimate attack construction: appending
      a full ring coordinate with an embedding scale factor produces a lattice
      the attacker can actually build from the public key, and recovering any
      vector of R.(s, e, 1) yields the secret up to a rotation, which is
      invertible. Both are elementary but are stated because the whole record
      is void without them.
    - >-
      The relevant reduction is UNSTRUCTURED BKZ on the Z-lattice of Z-rank
      256(2k+1), not algebraic reduction - because IDEA-20260829-353361's
      subject, the module-BKZ penalty at power-of-two cyclotomic fields, prices
      the algebraic route strictly worse. The algebraic Pataki-Tural lemma is
      used as a PREDICTION tool about which vectors appear, not as a commitment
      to run algebraic reduction.
    - >-
      The GSA describes the profile of the module-Kannan lattice well enough for
      a crossing computation, with the q-vector head handled explicitly. This is
      the same assumption every published ML-KEM estimate already makes for the
      scalar-Kannan lattice, applied to a lattice of 256 more dimensions.
    - >-
      vol(D)^(1/n) for D the rotation module of a random vector with i.i.d.
      CBD entries concentrates: the constant c in
      vol(D)^(1/n) = c sigma sqrt(n(2k+1)) is well defined and computable. Its
      value is a proof obligation, not an assumption, and it is measurable
      directly at n = 256 with no scale-down because it needs only a
      determinant of a 256x256 integer matrix.

  proof_search_map:
    bottleneck: >-
      The exact step is the profile crossing: at which blocksize does the
      geometric mean of the last n Gram-Schmidt norms of the BKZ-reduced
      module-Kannan lattice fall below vol(D)^(1/n), and is that blocksize below
      or above the SKR blocksize. Everything else - the embedding, the covolume
      constants, the GSA - is settled or directly measurable.
    baseline_embedding:
      parameter_slice: >-
        Ternary NTRU at n in {113, ..., 251} with the moduli Ducas and van
        Woerden report. The pipeline, given NTRU's parameters (dense submodule
        rank n inside ambient 2n), must reproduce the published fatigue point
        q = n^(2.484+o(1)) to within the paper's own stated uncertainty. This is
        the exact old-method boundary and it is a hard numeric target, not a
        visual resemblance.
      reproduction_check: >-
        Frozen fixture: the pipeline's predicted fatigue exponent for ternary
        NTRU at 6 values of n, compared against 2.484, with a pass band declared
        BEFORE running. A pipeline that cannot reproduce the NTRU number is not
        permitted to emit an ML-KEM number.
    observation_collision:
      observable: >-
        The pair (relative rank n/D, normalized covolume ratio
        vol(D)^(1/n) / vol(Lambda)^(1/D)) - the two numbers the crossing
        computation consumes.
      distinct_preimage_search: >-
        Search for two lattices with the SAME observable pair but opposite DSD
        behaviour. The natural candidate pair is (i) an NTRU lattice and (ii) an
        MLWE module-Kannan lattice rescaled to match both numbers, differing in
        the q-vector head structure: MLWE's ambient lattice has a long q-vector
        plateau that NTRU's does not, and the plateau is exactly the part of the
        profile the crossing computation must not use. If the two behave
        differently under identical observables, the observable is incomplete
        and the head length must be added to it before any ML-KEM number is
        quoted. This is a direct, cheap, pre-compute falsifier of the framing.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The module-Kannan embedding, which converts the ML-KEM primal instance
          from a unique-SVP instance (hypothesis: one short vector) into a
          dense-submodule instance (hypothesis: an exact rank-1 R-submodule of
          exact covolume), i.e. into a model where the governing hypothesis is
          an exact rank-and-determinant condition rather than a gap.
        predicted_gain: >-
          Under H_LIVE, the attack blocksize drops from beta_SKR to beta_DSD.
          Under H_SAFE, no gain, and the deliverable is the measured margin.
          The transform's separate obligations - encoding (the embedding is
          constructible), completeness (any DSD vector yields the secret),
          soundness (no spurious short vectors from the extra 256 dimensions),
          transfer (GSA applies to the enlarged lattice), cost loss (256 extra
          dimensions raise beta_SKR itself) - are listed individually below.
      - transform: stronger_invariant
        proposed_object: >-
          Track the covolume of the rank-1 submodule rather than the norm of the
          single shortest vector - strictly more state than the recovery goal
          requires, which is what survives the recursion of BKZ tours.
        predicted_gain: >-
          Makes the DSD/SKR race computable at all; the norm of one vector
          cannot express the race.
    quantifier_order: >-
      FOR EACH ML-KEM parameter set in {512, 768, 1024} THERE EXISTS a threshold
      q_fat(256, k, sigma) SUCH THAT FOR ALL q < q_fat the SKR blocksize is
      strictly smaller than the DSD blocksize on the module-Kannan lattice. The
      claim being tested is 3329 < q_fat for all three sets. Note what is NOT
      claimed: no statement is made uniformly over n or over secret
      distributions, and q_fat is allowed to depend on sigma and k, which it
      does.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable statement is a GSA-and-Pataki-Tural-based
        prediction of the DSD/SKR crossing at ML-KEM parameters, validated
        against the published NTRU fatigue point and against direct small-scale
        experiments. It cannot certify that no OTHER dense submodule exists -
        only the one generated by the secret is analyzed - and it cannot
        certify anything about attacks that reach the submodule other than by
        basis reduction.
    nearby_object_control: >-
      The nearby object on which the desired conclusion fails is overstretched
      NTRU itself: same lemma, same profile machinery, opposite verdict. If the
      pipeline reports H_SAFE for overstretched NTRU it is broken. If it reports
      H_LIVE for ML-KEM but ALSO reports H_LIVE for a deliberately
      understretched NTRU instance, it is over-triggering. Both directions must
      be exercised.
    proof_obligations:
      - claim: >-
          The pipeline reproduces the published ternary-NTRU fatigue exponent
          2.484 within a pre-declared band.
        responsibility: baseline
      - claim: >-
          vol(D)^(1/n) = c sigma sqrt(n(2k+1)) with c measured directly at
          n = 256 over at least 10^4 random CBD ring vectors.
        responsibility: size
      - claim: >-
          Any vector of R.(s, e, 1) inserted into the basis yields the secret up
          to a rotation, and the rotation is recoverable in polynomial time.
        responsibility: correctness
      - claim: >-
          The 256 extra Z-dimensions of the module Kannan embedding raise
          beta_SKR relative to the scalar embedding, and by how much - this is
          the cost side of the transform and must be charged before any
          comparison.
        responsibility: runtime
      - claim: >-
          q_fat(256, k, sigma) is increasing in k, with the mechanism being the
          relative rank 1/(2k+1).
        responsibility: strictness
      - claim: >-
          No spurious short vectors are introduced by the module Kannan
          embedding beyond R.(s, e, 1) and the q-vectors.
        responsibility: success_probability

  predictions:
    - metric: >-
        q_fat(256, k, sigma) computed from the crossing analysis, at each of
        ML-KEM-512, -768, -1024
      direction: higher
      minimum_effect: >-
        At least 2^7 times larger than 3329 for every parameter set, i.e.
        q_fat >= 4.3e5. Anything below 2^2 times 3329 would put ML-KEM
        uncomfortably close to its own fatigue point and would be a major
        finding even without crossing it.
    - metric: monotonicity of q_fat in the module rank k
      direction: higher
      minimum_effect: >-
        q_fat(k=4) / q_fat(k=2) >= 2. A flat or decreasing dependence on k
        contradicts the stated mechanism (relative rank 1/(2k+1)) and means the
        crossing is being driven by something else, which must then be
        identified before any conclusion.
    - metric: >-
        normalized covolume ratio vol(D)^(1/n) / vol(Lambda)^(1/D) at
        ML-KEM-768
      direction: higher
      minimum_effect: >-
        Above 1.0; the arithmetic sketch in the mechanism gives about 1.05 with
        c near 0.8. A measured value below 1.0 would mean the dense submodule is
        already denser than the ambient average, which is the necessary (not
        sufficient) precondition for DSD and would substantially raise the
        priority of the full crossing computation.
    - metric: >-
        beta_DSD - beta_SKR on the module-Kannan lattice at ML-KEM parameters
      direction: higher
      minimum_effect: >-
        At least +100 blocksize units (DSD strictly harder). A negative value at
        any parameter set is H_LIVE and falsifies the published estimate for
        that set.
    - metric: >-
        beta_SKR on the module-Kannan lattice minus beta_SKR on the scalar
        Kannan lattice (the cost of the embedding itself)
      direction: higher
      minimum_effect: >-
        Strictly positive - the module embedding adds 255 Z-dimensions and must
        be charged. If this is measured as zero or negative the accounting is
        wrong.
    - metric: NTRU baseline reproduction, fitted fatigue exponent
      direction: different
      minimum_effect: >-
        Within a pre-declared band around 2.484. Outside the band, the run
        produces no ML-KEM conclusion of either sign.

  minimal_test:
    design: >-
      Analysis first, small-scale experiment second, no ML-KEM-scale compute.
      Step 1 (hours, zero compute risk) - measure the constant c: draw 10^4
      vectors v = (s, e, 1) with FIPS-203 CBD coefficients at n = 256 and
      k in {2,3,4}, build the 256x256(2k+1) rotation basis, compute the exact
      Gram determinant, and report the distribution of
      vol(D)^(1/n) / (sigma sqrt(n(2k+1))). Step 2 - implement the crossing
      computation: GSA profile of the module-Kannan lattice including its
      q-vector head, geometric mean of the last n Gram-Schmidt norms as a
      function of blocksize, crossing against vol(D)^(1/n), and separately the
      standard SKR condition; emit beta_DSD and beta_SKR. Step 3 - BASELINE GATE:
      run the identical pipeline on ternary NTRU and reproduce the published
      fatigue exponent within the pre-declared band. Do not proceed on failure.
      Step 4 - sweep q upward at fixed (n=256, k, sigma) to locate q_fat for
      each ML-KEM parameter set, and sweep k to test monotonicity. Step 5 -
      SMALL-SCALE DIRECT EXPERIMENT: at n in {8, 16, 32} and k in {2, 3}, build
      real module-Kannan lattices with planted CBD secrets over a q sweep that
      brackets the predicted q_fat for those small n, run BKZ with progressive
      blocksize, and record which event fires first by testing every inserted
      basis vector for membership in R.(s, e, 1). Compare observed crossover to
      predicted. Step 6 - report the extrapolation to n = 256 with its transfer
      assumption stated.
    controls:
      - >-
        NTRU BASELINE (positive control, known answer). The pipeline must place
        the ternary-NTRU fatigue point at the published exponent. This is the
        single most important control and it gates everything downstream.
      - >-
        UNDERSTRETCHED NTRU (negative control, known answer). At q well below
        the fatigue point the pipeline must report SKR first. A pipeline that
        reports DSD everywhere is not measuring the race.
      - >-
        NULL SUBMODULE. Replace the planted secret with a random ring vector of
        the SAME norm but drawn without the CBD structure, and separately run
        with no planted secret at all against a random q-ary module lattice. The
        predicted crossing depends only on rank and covolume, so it must be
        UNCHANGED by the first substitution; if it changes, the prediction is
        secretly using the secret's distribution and the covolume framing is
        wrong.
      - >-
        SCALAR-EMBEDDING CONTROL. Run the same instances under the scalar Kannan
        embedding, where no dense submodule exists. beta_SKR must come out at
        the published value for those parameters, confirming the harness agrees
        with the standard estimate where the standard estimate applies.
      - >-
        DECAY CONTROL. As k increases at fixed n and q, the predicted q_fat must
        move monotonically. A quantity that should change with the parameter
        that is supposed to drive it, and does not, is the signature of an
        artifact.
    required_metrics:
      - measured constant c with its full distribution, per k, at n = 256
      - beta_DSD and beta_SKR per parameter set, module-Kannan and scalar-Kannan
      - q_fat per parameter set, with the sweep resolution reported
      - NTRU baseline fatigue exponent from the same pipeline
      - small-scale observed-versus-predicted crossover table at n in {8,16,32}
      - per-run completion status, so timeouts are never read as DSD or as SKR

  falsification_conditions:
    - >-
      q_fat(256, k, sigma) <= 3329 for any ML-KEM parameter set, surviving the
      NTRU baseline gate and the null-submodule control, falsifies H_SAFE and
      means the published primal blocksize for that set is derived from the
      wrong event.
    - >-
      A measured normalized covolume ratio below 1.0 falsifies the arithmetic
      sketch in the mechanism and requires the full crossing computation to be
      re-derived before any margin is claimed.
    - >-
      q_fat flat or decreasing in k falsifies the stated relative-rank
      mechanism; the margin might still exist but the explanation offered here
      would be wrong and must be withdrawn.
    - >-
      Failure of the NTRU baseline gate voids all ML-KEM outputs of the run,
      in either direction.
    - >-
      If the small-scale direct experiment at n in {8,16,32} shows DSD firing at
      a q materially below the predicted q_fat for those n, the crossing
      computation systematically overestimates the margin and the n = 256
      extrapolation is not supportable.
    - >-
      If reading the body of eprint 2024/844 shows the module-LWE case is
      already treated with an explicit threshold, this record is a replication
      and its novelty status drops to known; the measurement still has value as
      an independent check but the priority drops.

  confounders:
    - >-
      The q-vector head. The module-Kannan lattice has a long plateau of
      q-vectors whose Gram-Schmidt norms are all exactly q. Including them in
      the "last n norms" geometric mean, or excluding them inconsistently
      between the ML-KEM arm and the NTRU baseline arm, shifts the predicted
      crossing by a large and arbitrary amount. This is the single most likely
      source of a false H_LIVE.
    - >-
      Embedding scale factor. The module Kannan embedding has a free scale on
      the appended ring coordinate. It changes vol(Lambda) and the norm of the
      dense-submodule generators in opposite directions, and an unoptimized or
      inconsistent choice can move the crossing either way. The scale must be
      optimized identically in both arms and reported.
    - >-
      DSD cascade versus single DSD. Ducas and van Woerden describe three
      distinct ways a DSD event converts to an attack. Counting a single
      inserted vector as "the attack succeeded" overstates DSD; requiring full
      submodule recovery understates it. The test must record which of the three
      routes fired at small scale rather than declaring one in advance.
    - >-
      Charging the 255 extra dimensions. The module embedding raises beta_SKR.
      Comparing DSD on the module-Kannan lattice against SKR on the SCALAR
      Kannan lattice would be an unmatched comparison and would flatter DSD.
      Both events must be evaluated on the same lattice.
    - >-
      Small-n finite-size effects. At n = 8 the ring has 8 rotations and the
      "dense submodule" is 8-dimensional; asymptotic profile arguments are weak
      there. The extrapolation must be checked for stability when the n = 8 row
      is dropped.

  interpretation_limits:
    - >-
      Only ABSTRACT-level material was read for both external ingredients:
      eprint 2024/844 by WebFetch and the Ducas-van Woerden fatigue result by
      WebSearch summary only. The n^2.484 constant in particular is quoted from
      a search summary and is not verified against the paper. It is used only to
      set the baseline gate's target, so an error there is caught by the gate
      rather than propagated - but it must be corrected before publication of
      any number.
    - >-
      A confirmation of H_SAFE closes the dense-submodule route FOR THE
      SUBMODULE GENERATED BY THE SECRET, under the GSA, at the exact FIPS 203
      parameters, on the module-Kannan embedding. It says nothing about other
      submodules, other embeddings, or non-reduction attacks, and it must not be
      phrased as "the module structure gives nothing".
    - >-
      The direct experiments are at n <= 32, which is toy tier under
      docs/claims-and-verification.md. The n = 256 statement is analytic plus
      extrapolation and carries that label everywhere it appears.
    - >-
      Non-overlap with the corpus's isometry-orbit lane is asserted at the level
      of the tracked quantity and was checked only against those records'
      TITLES, not their bodies. A reviewer with the records open should confirm
      that none of them already computes a submodule covolume.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Rotation-covolume concentration.) For v = (s, e, 1) with i.i.d. CBD_eta
        coordinates over a power-of-two cyclotomic ring of degree n, the
        normalized covolume of the rotation module R.v satisfies
        vol(R.v)^(1/n) = c * sigma * sqrt(n(2k+1)) * (1 + o(1)) with c a
        universal constant depending only on 2k+1, concentrated in the sense
        that the empirical distribution of the ratio has relative standard
        deviation below 0.05 at n = 256.
      rigorous_support: >-
        Pairs the rigorous identity vol(R.v) = |N_(K/Q)(v)| for a rank-1
        rotation module (the covolume of the ideal-like module generated by a
        ring vector equals the absolute norm of its "content") with the
        classical distribution statement it imitates: the coordinates of v in
        the canonical embedding are, for i.i.d. sub-Gaussian coefficients,
        asymptotically independent complex Gaussians of variance sigma^2 n, so
        log|N(v)| is a sum of n i.i.d. log-chi-square terms and concentrates by
        the law of large numbers with c = exp(E[log X]/2) for the appropriate
        chi-square X. This is the exact analogue of the smoothness heuristic's
        structure: a rigorous size identity composed with a classical
        distributional law for random objects of that size.
      validation_plan: >-
        Sampled directly at cryptographic size - no correspondence or shortcut
        is needed, because the quantity is a 256x256 integer determinant. Draw
        10^4 vectors per k in {2,3,4} at the exact FIPS 203 CBD parameters,
        compute vol(R.v)^(1/n) exactly, and compare the empirical CDF of
        log vol(R.v)^(1/n) against the predicted sum-of-log-chi-square law (the
        comparison distribution), reporting the Kolmogorov-Smirnov statistic.
        Tail checks: the 100 smallest observed covolumes are the ones that
        matter, because an attacker selecting over many public keys would use
        exactly those; report the smallest observed value against the predicted
        left-tail probability, in the same style as a smoothest-sample check.
        Sampled parameters recorded: n = 256, eta1 in {2,3}, k in {2,3,4},
        seeds. Transfer assumption: none - this is measured at the deployed
        parameters directly.
    - id: H2
      statement: >-
        (Crossing predictability.) On the module-Kannan lattice of a random MLWE
        instance, the blocksize at which the geometric mean of the last n
        Gram-Schmidt norms of the BKZ-reduced basis first falls below
        vol(D)^(1/n) predicts the observed DSD blocksize to within 10 percent,
        uniformly for n in [8, 256], k in {2,3,4} and q in [2^8, 2^24].
      rigorous_support: >-
        Pairs the rigorous Pataki-Tural inequality - in the algebraic form
        proved by Karenin and Kirshanova, which bounds the product of the
        smallest Gram-Schmidt norms by the submodule covolume and therefore
        makes the crossing a NECESSARY condition for the profile to continue
        falling without insertion - with the classical Geometric Series
        Assumption, the standard average-case distribution law for BKZ-reduced
        profiles. The inequality gives necessity rigorously; the GSA supplies
        the distributional half that turns necessity into a prediction.
      validation_plan: >-
        Validate at reachable scale and against a published answer. First, the
        NTRU baseline: the same crossing rule must reproduce the published
        ternary-NTRU fatigue exponent, which is an independent published
        prediction rather than a self-consistency check. Second, direct
        measurement at n in {8, 16, 32}, k in {2, 3}, over a q sweep of at
        least 8 points bracketing the predicted crossing, 100 instances per
        point, recording the observed first-event blocksize by testing every
        inserted basis vector for membership in R.(s, e, 1). Compare observed
        crossing blocksize to predicted (the comparison quantity) and report the
        relative error distribution. Tail checks: the earliest-firing 5 percent
        of instances per cell, since a best-of-many attacker uses the tail, and
        because a heavy left tail in the crossing blocksize would matter far
        more than the mean. Transfer assumption, stated explicitly: n <= 32
        results are extrapolated to n = 256 under the assumption that the
        relative error is flat in n, which the n sweep itself tests over a
        factor 4 and no further.

  target_complexity:
    time_exponent: >-
      Under H_SAFE: unchanged, 2^(0.292 * beta_SKR) with beta_SKR on the
      module-Kannan lattice slightly WORSE than the published scalar-Kannan
      value because of the 255 extra dimensions - so the honest report is a
      small regression plus a measured margin. Under H_LIVE:
      2^(0.292 * beta_DSD) with beta_DSD < beta_SKR; the size of the gain is not
      predicted in advance and is whatever the crossing delivers, with the
      overstretched-NTRU precedent suggesting tens to hundreds of blocksize
      units, i.e. up to 0.292 * 100 = 29 bits or more.
    memory_exponent: >-
      2^(0.2075 * beta) in either branch; no time-memory trade is introduced.
      Under H_LIVE the memory falls with the blocksize in lockstep, which is
      the usual behaviour of a blocksize-level result.
    best_known: >-
      ML-KEM-768 primal attack under the scalar Kannan embedding, classical
      core-SVP about 2^(0.292 * 623) = 2^182 time and 2^(0.2075 * 623) = 2^129
      memory (beta 623 recalled from the Kyber round-3 submission and
      recomputed in-test). No published estimate evaluates the module Kannan
      embedding or the DSD event for ML-KEM, which is the gap this record
      addresses.
    hidden_overhead: >-
      Two disclosures. First, the crossing prediction rests on the GSA, whose
      error at a 1792-dimensional lattice with a long q-vector head is not
      characterized here and could exceed the predicted margin in the worst
      case - the small-scale experiment bounds it only up to n = 32. Second,
      under H_LIVE the DSD event yields a submodule vector, not the secret;
      converting it to a key recovery costs an additional cascade or an SKR
      run whose cost is NOT included in beta_DSD and must be added before any
      speedup is claimed. Quoting beta_DSD alone would overstate the attack.
    tradeoff_note: >-
      Blocksize-level, so it composes with any SVP oracle without re-derivation
      and inherits that oracle's parallelization. Under H_LIVE the result would
      cascade automatically to the quantum sieve point of IDEA-20260828-411711
      and to the memory-charged model of IDEA-20260805-cdc87d. It would NOT
      cascade to ML-DSA or Falcon without separate work, because those have
      different rank structures and different dense-submodule geometry -
      naming that limit is part of the scope statement, not an omission.

  dominated_by: >-
    Under H_SAFE, dominated on every axis by the standard ML-KEM-768 primal
    attack at core-SVP 2^182 time / 2^129 memory / 768 samples - indeed strictly
    worse, since the module embedding adds dimensions. Checked against every
    frontier row this corpus tracks: classical sieve core-SVP, classical
    enumeration under the memory-charged model of IDEA-20260805-cdc87d, quantum
    sieve at 2^0.2653 beta, the October-2025 quantum 3-tuple point
    (2^0.2846 d time, 2^0.1887 d memory) recorded in IDEA-20260828-411711,
    dual/MATZOV variants, the hybrid/decoding lane, and the algebraic
    rank-reduction lane of IDEA-20260805-e805b6 / IDEA-20260828-e4fee5. Under
    H_LIVE it would dominate the primal row for the affected parameter set by
    0.292 * (beta_SKR - beta_DSD) bits and would leave the others unaffected
    except through the shared blocksize.
  sota_delta: >-
    Predicted (H_SAFE): no attack; the contribution is a quantified obstruction
    - q_fat at least 2^7 above 3329, i.e. ML-KEM sits at least 7 binary orders
    of magnitude in q below its own fatigue point, with q_fat increasing in k -
    plus a small measured REGRESSION (the module embedding costs 255 extra
    dimensions). Falsifying (H_LIVE): the published primal blocksize for the
    affected parameter set is wrong, by beta_SKR - beta_DSD blocksize units,
    i.e. 0.292 times that many classical bits, minus the unquantified cost of
    converting a DSD vector to a key.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
