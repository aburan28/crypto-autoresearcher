  assumptions:
    - >-
      Prime-order group of order N with x-coordinate factor base F of size B drawn
      from the |X| = Theta(N) rational x-coordinates; targets are rerandomised as
      R_j = [a_j]P + [b_j]Q_t, which is exactly uniform at prime order.
    - >-
      One charged operation is one group operation; hash-set probes and pool
      membership tests are charged at the same declared rate as in the rho arm, and
      the convention is frozen before any cell runs. Memory is charged in stored
      group elements and reported on every row.
    - >-
      The linear-algebra charge is c_LA*B^2. The conclusion is parameterised in the
      linear-algebra exponent lambda in [1, 2]: alpha(beta) = max((1+beta)/2,
      lambda*beta), whose infimum over beta > 0 is 1/2 for every lambda >= 1. No
      part of the headline depends on lambda = 2.
    - >-
      Combined relations have row weight 2 in the factor base plus the target
      coefficients, so B+1 independent relations suffice; rank deficiency is not
      modelled and can only raise the true cost, which is the safe direction for
      this record's negative limb and the unsafe direction for its positive limb.
    - >-
      Sign ambiguity from an x-only pool is a factor 2 resolved by one check per
      collision and is carried as a constant, never as an exponent.

  proof_search_map:
    bottleneck: >-
      The crediting rule that converts swept candidates into usable relations. The
      charged sweep cost Theta(B) per target is not in dispute and is shared by both
      models; the exact step whose replacement changes the theorem is
      "credit a candidate iff its residual lies in F" versus
      "store every residual and credit collisions".
    baseline_embedding:
      parameter_slice: >-
        beta -> 0 with the pool set to the whole x-coordinate set. The family
        degenerates to storing two residuals per step and detecting collisions, i.e.
        a birthday search at (N^{1/2}, N^{1/2}); applying the distinguished-point
        transform to that slice is Pollard rho at (N^{1/2}, O(1)). RHO IS THE
        BOUNDARY OF THIS FAMILY, not an external comparator, which is the strongest
        available form of the KN-TECH-080 baseline-reproduction audit.
      reproduction_check: >-
        Frozen regression fixture. The beta = 0 arm of the same implementation, run
        on the same instances with the same counters, must reproduce
        0.886*sqrt(N) group operations to within the seed spread for the
        distinguished-point variant, and c*sqrt(N) with c in [1.0, 1.6] for the
        plain stored-collision variant. If the beta = 0 arm does not reproduce the
        textbook rho constant, the counting convention is broken and no ratio from
        any other cell may be reported. Separately, setting the pool to empty must
        reproduce IDEA-20260829-b5a2c8's 2RN/B charge symbolically.
    observation_collision:
      observable: >-
        Total charged operations for a complete m=2 solve at one (p, B) cell.
      distinct_preimage_search: >-
        COLLISION EXHIBITED AND IT IS THE REASON THIS PROPOSAL EXISTS. At
        beta = 1/3 the corrected two-channel model and b5a2c8's FREE-ORACLE model
        both emit N^{2/3}, from completely different preimages -- one with a
        Theta(B) sweep and a partial-relation channel, the other with a
        Theta(1) oracle and no partial channel. A single N^{2/3} measurement
        therefore does not identify which mechanism produced it. THE SEPARATOR IS
        THE B-SWEEP, not the size ladder: the two-channel model predicts total
        operations RISING as sqrt(B) on the beta < 1/3 branch, while the
        full-relation-only model predicts FLAT in B. That is the discriminator the
        minimal test is built around, and it is available at one field size.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the 0/1 decomposability indicator with the residual point itself,
          carried as a collision key plus a bookkeeping vector -- preserving more
          state than the final goal requires, because that stronger state is what
          survives the failure of a candidate.
        predicted_gain: >-
          Moves the m=2 exponent from alpha = 1 (b5a2c8 part B2) to
          alpha = max((1+beta)/2, 2*beta), a gain of N^{1/3} at beta = 1/3 and up
          to N^{1/2} as beta -> 0. NO EXPONENT BELOW 1/2 IS CLAIMED OR REACHED.
      - transform: baseline_lift
        proposed_object: >-
          Read rho as the beta -> 0 boundary member of the family rather than as an
          external baseline, then ask whether the family improves strictly inward.
        predicted_gain: >-
          A negative answer with a mechanism: alpha(beta) is strictly increasing on
          beta > 0 in both branches, so the family provably does not improve inward.
          That is a closure at the docs/inventor-protocol.md section 4 standard
          rather than a fatigue report.
    quantifier_order: >-
      CLAIMED. FOR ALL prime N, FOR ALL beta in (0, 1], FOR ALL pool sizes
      W <= |X|, FOR ALL factor-base geometries of size B = N^beta, the two-channel
      charge satisfies T >= c * N^{max((1+beta)/2, beta*lambda)} for an absolute
      constant c, hence T = omega(N^{1/2}) for every fixed beta > 0. The FOR ALL
      over geometry is delivered for the full channel by KN-FIND-007's identity and
      for the partial channel by the birthday count over W keys, which is
      geometry-free.
      NOT CLAIMED, and the distinction is load-bearing. Not FOR ALL oracles: the
      derivation fixes the sweep oracle at Theta(B) per target. An oracle producing
      candidate decisions at rate omega(1) per charged operation is outside this
      quantifier and is exactly what interpretation_limits hands forward.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the two-channel cost model at arity m = 2 over a prime-order group
        with a rate-Theta(1) sweep oracle, the achievable exponent is
        alpha(beta) = max((1+beta)/2, lambda*beta), which is strictly above 1/2 for
        every beta > 0 and has infimum 1/2 at the degenerate boundary." It can NEVER
        certify anything about m >= 4, about algebraic oracles of rate omega(1),
        about the truth of the model, or about ECDLP hardness. Any summary dropping
        "rate-Theta(1) oracle" or "m = 2" is overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE EXTENSION-FIELD GATE, AND THIS PROPOSAL SHARPENS IT FROM A SIGN CHECK TO
        AN EXPONENT CHECK. Instantiate the identical two-channel accounting over
        F_{q^n} with the subfield-line base and the POLYLOG Groebner oracle, which
        has rate q^{n-1}/polylog rather than Theta(1). It must return an exponent
        that beats rho for n >= 3 and ties it at n = 2. A model that returns
        "worse than rho at every n" is broken; a model that returns the right SIGN
        but the wrong EXPONENT at n = 2 is exactly the failure this proposal
        attributes to the full-relation-only charge, and the same test must be
        applied to this proposal without mercy.
    proof_obligations:
      - claim: >-
          Two partials sharing a residual combine into a valid linear relation over
          the factor-base logarithms and the target logarithm, with sign ambiguity
          resolvable in O(1).
        responsibility: correctness
      - claim: >-
          P = Theta(sqrt(B*W)) partials suffice for B+1 combined relations.
        responsibility: success_probability
      - claim: >-
          T_rel = Theta(N*sqrt(B/W)) and memory Theta(sqrt(B*W)).
        responsibility: size
      - claim: >-
          alpha(beta) = max((1+beta)/2, lambda*beta) with infimum 1/2 on beta > 0.
        responsibility: runtime
      - claim: >-
          The beta = 0 boundary arm reproduces 0.886*sqrt(N).
        responsibility: baseline
      - claim: >-
          Setting the pool empty reproduces the committed 2RN/B charge.
        responsibility: baseline
      - claim: >-
          The extension-field instantiation ties rho at n = 2 and beats it at n >= 3.
        responsibility: scope

  predictions:
    - metric: >-
        total charged group operations of a complete m=2 solve, two-channel arm,
        at fixed p = 2^16 across B in {8, 16, 32, 64, 128, 256}
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED. On the beta < 1/3 branch the count must RISE as sqrt(B) --
        each doubling of B multiplies relation-collection operations by
        1.41 with a tolerance of plus or minus 25 percent. A count that is FLAT in
        B within a factor 1.2 across a 32x range of B falsifies the two-channel
        derivation and corroborates IDEA-20260829-b5a2c8 part (B2).
    - metric: >-
        ratio (full-relation-only arm operations) / (two-channel arm operations) at
        p = 2^16, B = 64, both arms on the identical frozen instance set
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION FROM THE CLOSED FORM. The full-relation-only
        arm needs about N/2 = 32768 operations; the two-channel arm needs about
        16 targets x 64 = 1024 operations and 2048 stored partials yielding exactly
        64 combined relations. Predicted ratio 32, required at least 10. A ratio
        below 3 falsifies the partial-relation channel as an exponent-moving term at
        the tested cell.
    - metric: >-
        partials produced per charged operation, measured directly, at every cell
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 2, invariant in B and in p to within 5 percent. This is
        the candidate-production-rate invariant the whole mechanism rests on. A
        measured rate that grows with B means the sweep is not being charged what
        the model charges it and every operation count is void.
    - metric: >-
        matched Pollard rho operations on the identical instances
      direction: different
      minimum_effect: >-
        FORCED. 0.886*sqrt(N) within the seed spread. A baseline arm that does not
        reproduce the textbook constant is not measuring a ratio and blocks the
        report.
    - metric: >-
        beta = 0 boundary arm of the same implementation
      direction: different
      minimum_effect: >-
        FORCED. Must land within a factor 2 of the matched rho arm. If the family's
        own boundary member does not reproduce rho, the claimed baseline embedding
        is false and the closure argument in the mechanism does not stand.
    - metric: >-
        symbolic value of alpha(beta) and mu(beta) at lambda in {1, 1.5, 2}
      direction: different
      minimum_effect: >-
        FORCED EXACT. inf over beta > 0 of alpha equals 1/2 at every lambda >= 1,
        verified to 1e-12 on a grid. Any deviation is an algebra error and halts the
        record.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Verify symbolically that the
      empty-pool slice reproduces KN-FIND-8f2c90's committed 2RN/B and that the
      beta -> 0 slice reproduces the birthday count. A mismatch halts everything.
      STAGE 1 (zero compute, one page). Emit alpha(beta) and mu(beta) on a grid of
      beta in [0, 1] at lambda in {1, 1.5, 2}, verify the branch crossover at
      beta = 1/3 with alpha = 2/3, and place every grid point on a (time, memory)
      plane against rho, BSGS and the corrected free-oracle point of
      IDEA-20260830-4ab603.
      STAGE 2 (low compute, pure Python, p in {2^12, 2^14, 2^16}, B <= 256, minutes
      per cell, well under 1 GB). Implement ONE sweep routine and THREE crediting
      rules over it, on one frozen instance set with one operation counter.
      Arm A: full relations only (the b5a2c8 charge). Arm B: two-channel, pool = all
      x-coordinates, stored partials in a hash table keyed by residual, pairwise
      combining, Gaussian elimination mod N, target recovery. Arm C: beta = 0
      boundary. Arm D: matched Pollard rho with the negation map disabled, same
      counter. Sweep B over a 32x range in Arm B at each p. Every recovered
      logarithm carries a certificate re-verified independently per
      docs/claims-and-verification.md.
      STAGE 3 (zero compute). Fit the B-dependence of Arm B at FIXED p -- this is a
      within-size fit and does not require the size ladder that this lane's own
      estimator audits (IDEA-20260805-bb4488, -c8524f, IDEA-20260815-6f09d5) show is
      not identifiable at four toy sizes. Report the A/B ratio, the measured rate,
      and the C-versus-D reproduction.
      STAGE 4 (zero compute). File the result as a correction-by-reference against
      IDEA-20260829-b5a2c8 part (B1)/(B2) for the Coordinator, never as an edit, and
      state the surviving conclusion in the alpha(beta) form.
      MEMORY DISCIPLINE. No Macaulay matrix and no Groebner basis is built. The
      largest object is a hash table of at most sqrt(B*N) ~ 2^12 residuals at
      p = 2^16 with B = 256, plus a B x B matrix over Z/N. Under 10 MB. This test
      cannot reproduce any resource_exhaustion stop because it never allocates a
      monomial space.
    controls:
      - >-
        BOUNDARY-REPRODUCTION CONTROL (blocking): Arm C must land within a factor 2
        of Arm D, and Arm D must reproduce 0.886*sqrt(N).
      - >-
        EMPTY-POOL CONTROL: Arm B with the pool disabled must reproduce Arm A
        operation-for-operation, isolating the crediting rule as the only difference.
      - >-
        NULL-OBJECT CONTROL (docs/inventor-protocol.md section 3): replace the group
        by a random bijection on the same key space with the same charged costs and
        rerun Arm B. The birthday branch MUST survive unchanged, because it is
        generic; the FULL-relation branch must collapse. A two-channel gain that
        survives the null in BOTH branches is generic collision finding wearing an
        index-calculus costume and must be reported as such -- this control is what
        prevents the proposal from being read as a structural discovery.
      - >-
        YIELD CONTROL: measured full-relation yield per target must equal
        4*binom(B+1,2)/N with deviation consistent with KN-FIND-007; a nonzero
        systematic deviation voids the cell.
      - >-
        SATURATION SCREEN: cells with mean full yield outside [0.05, 2] or with
        fewer than 4 targets are excluded BEFORE the run, not explained after.
      - >-
        SEED-INDEPENDENCE NULL: derived exponents are seed-free and must be
        bit-identical across seeds; only measured counts may vary.
    required_metrics:
      - 'total charged operations per arm, per (p, B, seed)'
      - 'relation-collection, combining and linear-algebra operations, separately'
      - 'partials produced per charged operation, per cell'
      - 'peak stored residuals and peak matrix memory, per arm, in group elements'
      - 'combined relations obtained versus the predicted P^2/(2W)'
      - 'measured full yield versus 4*binom(B+1,2)/N, per cell'
      - 'Arm C versus Arm D reproduction ratio, and Arm D versus 0.886*sqrt(N)'
      - 'certificate verification pass/fail for every recovered logarithm'
      - 'null-object rerun results for both branches'

  falsification_conditions:
    - >-
      Arm B operation counts are FLAT in B within a factor 1.2 over a 32x range. The
      two-channel derivation is falsified and IDEA-20260829-b5a2c8 part (B2) stands.
    - >-
      The A/B ratio at p = 2^16, B = 64 is below 3. The partial-relation channel is
      not exponent-moving at the tested cells and the headline is withdrawn.
    - >-
      Arm C does not reproduce Arm D within a factor 2. The claimed baseline
      embedding is false, the closure argument does not stand, and nothing else in
      the record may be reported.
    - >-
      The null-object rerun reproduces the two-channel gain in the FULL-relation
      branch as well as the birthday branch. The gain is generic, not structural,
      and the record must be re-described as a statement about collision search.
    - >-
      Combined relations fall short of P^2/(2W) by more than a factor 4. The
      birthday count over residual keys is wrong -- most likely because residuals are
      not equidistributed over X -- and H1 is falsified.
    - >-
      The extension-field instantiation does not tie rho at n = 2 and beat it at
      n >= 3. The two-channel accounting fails the same known-answer gate it accuses
      the full-relation-only model of failing, and the record is withdrawn rather
      than re-scoped.
    - >-
      Everything holds. Then RQ-ICEX-001's decision target has a structural answer at
      m = 2 -- alpha ranges over (1/2, 1] with infimum 1/2 at the degenerate boundary,
      so an interval excluding 1/2 from below is unreachable for this family -- and
      IDEA-20260829-b5a2c8 parts (B1) and (B2) both require correction by reference.

  confounders:
    - >-
      OPERATION-COUNTING CONVENTION. A group operation, a field multiplication and a
      hash probe are not interchangeable. The two-channel arm performs many more
      hash probes per group operation than the full-relation arm, so an unfair probe
      charge manufactures the entire claimed 32x. The convention must be frozen
      before any cell runs and a sensitivity row emitted at probe cost 0.1, 1 and 10
      group operations. If the A/B ratio drops below 3 at probe cost 10, the result
      is convention-dependent and must be labelled so.
    - >-
      MEMORY IS THE HIDDEN PRICE AND IT IS NOT SMALL. The two-channel arm stores
      Theta(sqrt(B*N)) residuals. At beta -> 0 that is N^{1/2}, which is BSGS memory,
      and rho pays O(1). Every quoted time row carries its memory row; a time-only
      comparison against rho is forbidden in any deliverable from this record.
    - >-
      SMALL-CELL DEGENERACY. At p = 2^12 with B = 256 the predicted target count
      falls below 4, where the birthday and Poisson approximations are meaningless.
      Such cells are excluded by the saturation screen, not explained afterwards.
    - >-
      RANK. Combined relations have weight 2 and can be rank-deficient in ways the
      count does not see -- in particular the combining graph's connected-component
      structure caps the usable equations. Measured rank, not measured relation
      count, is the credited quantity.
    - >-
      MODEL-RELATIVITY. "Achievable within the two-channel model" is not
      achievability in fact. This qualifier travels with every quoted row.

  interpretation_limits:
    - >-
      NOT AN ECDLP HARDNESS RESULT AND NOT A LOWER BOUND ON ANY ALGORITHM OUTSIDE THE
      FAMILY. It characterises one rate-Theta(1) family at one arity under one cost
      model. It does not interact with the generic-group bound, which bounds generic
      algorithms while this bounds a specific non-generic family.
    - >-
      SCOPED TO m = 2 AND TO RATE-Theta(1) ORACLES. FORWARD GUIDANCE, which is the
      part of this record with the most value to the next session: the tax argument
      says the factor base pays for itself only if the oracle decides asymptotically
      more candidate tuples than it performs operations. Every oracle this program
      has ever charged -- signed-sum sweep, enumeration, meet-in-the-middle -- has
      rate Theta(1) and is therefore inside the family and capped at
      inf alpha = 1/2. The classes that REMAIN OPEN are exactly the rate-omega(1)
      ones: algebraic solves at m >= 4 that decide B^{m-1} candidates in
      o(B^{m-1}) charged operations, and oracles exploiting factor-base structure so
      that membership in F + F is decidable without touching F. Measuring that rate
      is IDEA-20260830-2993a4; the m >= 4 cost cells are still empty
      (IDEA-20260807-32f96d).
    - >-
      NO ADVANTAGE OVER RHO IS CLAIMED ANYWHERE. The best point in the family ties
      rho in time and loses to it by N^{1/2} in memory. The record's positive content
      is that a live proposal's m = 2 exponent is wrong by up to N^{1/2}; its
      negative content is that correcting it does not produce an attack.
    - >-
      THE EXTERNAL LITERATURE IS NOT ADJUDICATED. The large-prime variation is
      classical in adjacent settings and IDEA-20260731-012 already cites KN-LIT-164
      for it; no novelty is claimed for the variation. What is claimed as new IN THIS
      CORPUS is the m = 2 instantiation, the unrestricted pool, and the closed form
      alpha(beta) with its boundary reading. A referee should chase the recalled
      Gaudry and double-large-prime citations before crediting any of it.
    - >-
      A CORRECTION IS NOT A VERDICT. Only a Coordinator decision may supersede or
      amend IDEA-20260829-b5a2c8, and the correction discipline forbids editing it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base F of size B and a uniform target R, the 2B residual
        x-coordinates x(R +/- P_v), v in F, behave as independent uniform draws from
        the set X of rational x-coordinates, |X| = (p - t - r)/2 with t the trace and
        r the number of roots of the curve polynomial in F_p. Consequently the number
        of residuals landing in a designated pool of size W is Binomial(2B, W/|X|) up
        to o(1), and P residuals collected over W pool slots produce
        P^2/(2W) * (1 + o(1)) coincident pairs.
      rigorous_support: >-
        The MEAN of the full-relation channel is not a heuristic at all -- it is the
        exact double count of KN-FIND-007, which holds for every base of every
        geometry with measured deviation exactly 0 over 144 cells, and the pool
        channel is the same count with F replaced by the pool. What is assumed is
        only that the 2B algebraically determined residuals behave like uniform draws
        from X with respect to pool membership. This is the classical
        independent-uniform imitation, the identical move by which the Gaudry-Diem
        1/n! decomposition probability is obtained, and KN-FIND-007 records that
        probability as being exactly this conservation mean. The birthday count over
        W keys is the same classical statement used for distinguished-point collision
        search, where it is verified at cryptographic scale in practice.
      validation_plan: >-
        SAMPLE. At p in {2^12, 2^14, 2^16}, over 12 generated prime-order curves and
        the complete target set of the group (exhaustive, not sampled, at p <= 2^14),
        record the empirical residual multiset and its pool-hit counts.
        COMPARISON DISTRIBUTION. Binomial(2B, W/|X|), with |X| computed exactly from
        the curve order rather than approximated by p/2, tested by chi-square at the
        1 percent level. Collision counts against P^2/(2W) with a Poisson
        approximation for the pair count.
        TAIL CHECKS. Maximum observed pool-hit count per target against the Binomial
        upper tail; the number of residual values occurring three or more times
        against the Poisson triple-coincidence rate, since an excess of multiple
        coincidences is the signature of residual concentration and would inflate the
        combining yield for a reason unrelated to the mechanism.
        TRANSFER. None claimed beyond p <= 2^16. The exponent statement alpha(beta)
        is a derivation within the cost model and is NOT validated at cryptographic
        scale by any part of this proposal.
    - id: H2
      statement: >-
        The combining graph on collected partials -- vertices the used pool residuals,
        edges the partials -- has, at P = Theta(sqrt(B*W)), at least B+1 independent
        cycles' worth of usable equations, i.e. the rank of the combined system is
        Theta(P^2/W) and not merely its number of connected components.
      rigorous_support: >-
        Rigorous for the EDGE COUNT (a pure double count). Heuristic only in the rank
        clause: the classical statement it imitates is the giant-component and
        cycle-space behaviour of the Erdos-Renyi random graph G(W, P), where the
        cycle rank is P - W + (number of components) and the relation matrix is full
        rank with probability 1 - o(1) once the average degree exceeds 1. The same
        assumption underlies every published large-prime variation, including the
        double-large-prime line cited above, and is stated here rather than hidden.
      validation_plan: >-
        SAMPLE. Every Stage 2 cell of Arm B, recording the full combining graph.
        COMPARISON. Measured rank of the combined system against P - W + components,
        and against the Erdos-Renyi cycle-rank prediction at the same (W, P).
        TAIL CHECKS. Degree distribution against Poisson(2P/W); the largest component
        size against the giant-component threshold. A measured rank shortfall of more
        than 20 percent against the cycle-rank prediction means the combining stage,
        not the collection stage, is the binding constraint, which would change the
        exponent and must be reported before any alpha is quoted.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT BELOW 1/2 IS CLAIMED. Stated exactly, at m = 2 with the
      achievable sweep oracle and a pool of size Theta(N), for a factor base of size
      B = N^beta and linear-algebra exponent lambda,
      alpha(beta) = max((1+beta)/2, lambda*beta). At lambda = 2 the branches cross at
      beta = 1/3 with alpha = 2/3. inf over beta > 0 is 1/2, approached but not
      attained; alpha = 1/2 exactly at beta = 0, where the pipeline is a birthday
      search. Against IDEA-20260829-b5a2c8 this is an improvement of up to N^{1/2}
      over its part (B2) value of alpha = 1, and it falsifies its part (B1) claim
      that N^{2/3} is a floor.
    memory_exponent: >-
      mu(beta) = max((1+beta)/2, beta) stored group elements, i.e. N^{1/2} at the
      boundary and N^{2/3} at beta = 1/3. Memory equals time along the entire lower
      branch, so this family traces the diagonal of the (time, memory) plane from the
      BSGS point outward. There is no point at which it holds rho's O(1) memory.
    best_known: >-
      Pollard rho at 0.886*sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006);
      BSGS at (N^{1/2}, N^{1/2}) (KN-TECH-031); van Oorschot-Wiener golden collision
      at sqrt(A^3/w) with memory w; multi-target rho at sqrt(K*N) total. In-lane
      positions: IDEA-20260803-fa9839's threshold d < (m-3)/4, IDEA-20260808-2ef5c8's
      two-regime alpha, IDEA-20260829-b5a2c8's m=2 pair (N^{2/3}, N).
    hidden_overhead: >-
      DISCLOSED IN FULL. (i) The combining stage's constant is not derived and its
      rank behaviour is H2, not a theorem. (ii) c_LA and c_rho are pinned, not
      derived. (iii) The sign ambiguity of an x-only pool costs a factor 2 per
      collision check. (iv) Coupon-collector and rank-deficiency corrections on the
      relation requirement are omitted; both raise the true cost, which is the safe
      direction for the negative limb and the UNSAFE direction for the claimed
      improvement over b5a2c8, so the improvement is stated as a within-model
      exponent and must be confirmed by the Stage 2 measurement before it is quoted.
      (v) "Within the two-channel model" is the whole of the remaining overhead; the
      model is not tight and is not claimed to be.
    tradeoff_note: >-
      CENTRAL, AND THE FAMILY LOSES ON IT. With a memory budget w the pool is capped
      at W = w and the time becomes Theta(N*sqrt(B/w)), i.e. Theta(N/sqrt(w)) at
      minimal B. That curve meets rho's sqrt(N) only at w = Theta(N) and is strictly
      worse for every w < N, while rho attains sqrt(N) at w = O(1). So rho dominates
      the family at every memory budget and ties it only at the extreme. BSGS
      dominates the entire lower branch. Parallelisation: residual production is
      embarrassingly parallel with linear speedup and the combining stage is a
      distributed hash join, so the family parallelises about as well as
      distinguished-point rho -- which is precisely why no advantage survives there
      either. None of this moves the exponent.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES AGAINST EVERY FRONTIER
    ENTRY THIS LANE ENUMERATES. As an ATTACK the family is dominated at every
    beta > 0 by: Pollard rho (N^{1/2}, O(1)) on both axes; BSGS (N^{1/2}, N^{1/2})
    on both axes for beta > 0 and tied at the beta = 0 boundary; multi-target rho
    sqrt(K*N) with O(1) memory; van Oorschot-Wiener at every memory budget w by the
    tradeoff curve above; and the preprocessing frontier S*T^2 = Omega-tilde(N),
    which this family does not approach. Against the algebra-free meet-in-the-middle
    index calculus at (N^{1/2+1/m}, N^{1/2}) the m = 2 comparison is not meaningful
    since that row starts at m >= 3. Data and queries: both arms are query-free, so
    no separation exists on that axis. NOT NULL ON ANY AXIS. As a COST-MODEL
    STATEMENT the incumbents are IDEA-20260829-b5a2c8's m = 2 pair and
    IDEA-20260808-2ef5c8's two-regime formula; this record contradicts the former's
    exponent and extends the latter's excluded scope rather than being dominated by
    either.
  sota_delta: >-
    Zero speedup against any attack baseline; no exponent moved in the favourable
    direction against rho. Quantified deliverables. (i) The m = 2 achievable exponent
    moves from alpha = 1 (IDEA-20260829-b5a2c8 part B2, "as actually built") to
    alpha = max((1+beta)/2, 2*beta), i.e. from N to N^{2/3} at beta = 1/3 and toward
    N^{1/2} below it -- an improvement of up to N^{1/2} (2^{128} at N = 2^256) over a
    live committed proposal's headline, obtained with NO change to the oracle.
    (ii) IDEA-20260829-b5a2c8 part (B1)'s N^{2/3} "free-oracle floor" is falsified as
    a floor: values below it are reached with the achievable Theta(B) oracle.
    (iii) The infimum of the family is pinned at exactly 1/2, attained only at
    beta = 0 where the pipeline is rho, which converts this question's decision target
    from an open measurement into a structural statement about which side of 1/2 the
    interval can possibly fall on. (iv) A 32x separation predicted at a single
    named toy cell, replacing an exponent fit across a ladder that this lane's own
    audits show is not identifiable.

