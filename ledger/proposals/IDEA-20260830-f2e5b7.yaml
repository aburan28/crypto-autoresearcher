idea:
  id: IDEA-20260830-f2e5b7
  question_id: RQ-ICEX-001
  added: '2026-08-30'
  title: >-
    THE RESIDUAL IS THE OBJECT, NOT THE COMPLETED DECOMPOSITION. IDEA-20260829-b5a2c8
    charges the m=2 sweep for computing 2B residual points per target and then credits
    only the O(B^2/N) of them that land in the factor base, discarding the rest.
    Keeping them (the classical large-prime channel, never costed at m=2 in this
    corpus) gives the closed form alpha(beta) = max((1+beta)/2, 2*beta) for a factor
    base of size B = N^beta, so the achievable m=2 exponent is N^{2/3} at beta = 1/3
    WITHOUT any free oracle and falls to N^{1/2} as beta -> 0, where the pipeline has
    degenerated into a birthday search. Consequence for this question: the family's
    achievable alpha set is (1/2, 1] with infimum 1/2 attained only at the degenerate
    boundary, so a confidence interval excluding 1/2 FROM BELOW is unreachable for
    every candidate-rate-Theta(1) pipeline, while alpha > 1/2 is the generic case.
  class: mechanism

  claim: >-
    (A) THE OMITTED CHANNEL, STATED AS A SPECIFIC DEFECT IN A LIVE PROPOSAL. At arity
    m = 2 over a prime-order group of order N, the signed-sum sweep against a factor
    base F of size B computes the 2B residual x-coordinates x(R +/- P_v) for one
    target R at a charged cost of Theta(B) group operations. IDEA-20260829-b5a2c8
    part (B2) credits this sweep only with the full relations, mean 4*binom(B+1,2)/N
    per target, and therefore derives a relation-collection charge of Theta(N)
    independent of B. The step that fails is the crediting step, not the arithmetic
    -- every residual that misses F is a PARTIAL relation R = P_v + Q with a single
    unknown point Q, and two partials sharing Q combine exactly into
    R_1 - R_2 = P_{v1} - P_{v2}, a linear equation over the factor-base logarithms
    and the target logarithm. Those partials are produced at rate 2 per charged
    operation and are thrown away.
    (B) THE CORRECTED TWO-CHANNEL ACCOUNTING. Let W be the size of the large-prime
    pool, W <= |X| = Theta(N). Per target the sweep costs B, yields 4*B^2/N full
    relations and 4*B*W/N partials. Collecting P partials over W pool slots yields
    P^2/(2W) combined relations, so B+1 relations require P = Theta(sqrt(B*W))
    partials, hence Theta(N*sqrt(1/(B*W))) targets and a relation-collection charge
    T_rel = Theta(N * sqrt(B/W)) with Theta(sqrt(B*W)) stored partials. The pool is
    free to be the whole x-coordinate set (membership is then a tautology and costs
    nothing to store), so W = Theta(N) is admissible and
    T = Theta(sqrt(N*B)) + c_LA*B^2, memory Theta(sqrt(N*B)).
    (C) THE CLOSED FORM AND THE THREE NUMBERS IT FORCES. With B = N^beta,
    alpha(beta) = max((1+beta)/2, 2*beta) and the memory exponent is
    mu(beta) = max((1+beta)/2, beta). Three consequences are stated as falsifiable
    predictions. (C1) At beta = 1/3, alpha = 2/3 -- b5a2c8's FREE-ORACLE floor is
    reached with the achievable sweep oracle and no oracle improvement whatsoever,
    so its part (B1) is not a floor. (C2) For beta < 1/3, alpha = (1+beta)/2 < 2/3,
    strictly below b5a2c8's free-oracle floor, so its part (B1) is falsified as a
    lower bound on the family. (C3) alpha(beta) > 1/2 for every beta > 0, with
    infimum 1/2 as beta -> 0; at beta = 0 the pipeline is two stored residuals per
    step with collision detection, i.e. a birthday search, and under the
    distinguished-point transform it is Pollard rho exactly.
    (D) WHAT THIS DECIDES FOR RQ-ICEX-001. The decision target asks whether a charged
    toy exponent's confidence interval EXCLUDES 1/2. Within this family the answer is
    structural and does not depend on the measurement: 1/2 is the infimum of the
    achievable alpha set and is attained only where B = Theta(1), which is outside any
    reasonable definition of an index-calculus pipeline. An interval excluding 1/2
    from below is therefore unreachable; an interval excluding 1/2 from ABOVE is the
    generic outcome and is the honest form of the decision. This is a sharper and
    strictly different conclusion from b5a2c8's, which asserts Theta(N) as built and
    Omega(N^{2/3}) at best.
    (E) THE KNOWN-ANSWER CONSISTENCY CHECK, WHICH THE FULL-RELATION-ONLY MODEL FAILS
    AND THIS ONE PASSES. A WebSearch summary obtained this session states the
    fixed-genus index-calculus complexity Otilde(q^{2-2/g}) and that generic methods
    remain faster for small extension degree. At n = 2 the expression 2 - 2/n equals
    1, i.e. q^1 = N^{1/2}, a TIE with rho -- exactly the boundary value this
    proposal derives for prime-field m = 2. The full-relation-only two-term model
    predicts q^{2n/(n+1)} = q^{4/3} = N^{2/3} at n = 2 and therefore misses the
    known-answer point by exactly N^{1/6}, which is exactly the shortfall b5a2c8
    quotes as its headline. THE SOURCE WAS NOT OPENED and this limb is recorded as
    a lead, never as support; adjudicating it is IDEA-20260830-3c0861.

  mechanism: >-
    THE TRACKED OBJECT AND ITS LOSSY-PROJECTION STATUS. The object followed is the
    RESIDUAL of a decomposition attempt -- the group element Q = R -/+ P_v left over
    when a candidate fails -- carried as the pair (collision key x(Q), bookkeeping
    vector of factor-base indices and target coefficients). This is a genuinely lossy
    projection of the swept candidate: it forgets which target produced it, which
    factor-base index was used at which enumeration position, and the sign branch. It
    is lossy COMPATIBLY because the retained key propagates deterministically under
    exactly the operation the pipeline performs -- two candidates with equal residual
    key compose, by group subtraction, into an exact linear relation whose
    coefficients are read off the retained bookkeeping alone, with the discarded sign
    branch re-entering only as a factor 2 resolved by one check.
    Contrast the projection actually used by IDEA-20260829-b5a2c8 and by every
    two-term charge in this lane, and the contrast IS the mechanism: those models
    project each candidate to the 0/1 indicator [residual in F]. That indicator is
    the coarsest possible function of the residual. It is not a change of coordinates
    -- it is a projection that discards so much that the retained part no longer
    propagates at all, because a 0 carries no information forward, and the model then
    charges full price for producing information it immediately deletes. Restoring
    the residual restores propagation and moves the exponent from 1 to (1+beta)/2.
    WHY THE CANDIDATE-PRODUCTION RATE IS THE INVARIANT. One sweep operation produces
    exactly one residual, so residuals arrive at rate Theta(1) per charged operation.
    A birthday search over Theta(N) keys needs Theta(sqrt(N)) keys, hence
    Theta(sqrt(N)) operations. That is why the family's infimum is exactly the
    birthday bound and why no rebalancing of B reaches below it: B controls only how
    many relations must be assembled (a pure penalty, raising the requirement to
    Theta(sqrt(N*B))) and how expensive the linear algebra is (a second pure
    penalty, c_LA*B^2). The factor base at m = 2 is a TAX, not a lever. This is a
    named obstruction with an argument and forward guidance rather than a fatigue
    report -- the guidance is in interpretation_limits and points at rate-omega(1)
    oracles at m >= 4, which is the only place the tax can be paid for.
    WHY IT DOES NOT CONTRADICT KN-FIND-007. KN-FIND-007 is an identity about the mean
    number of size-m multisets from F summing to a target, and it says in its own
    words that it is silent about the cost of FINDING a decomposition. Partial
    relations are not decompositions over F at all -- they are elements of the
    ORBIT F + G, which the conservation identity does not count. Nothing here
    disputes the identity; the point is that the identity was being used as if it
    bounded the relation supply, and it bounds only one of the two channels.
    WHY THE ARITHMETIC IS SMALL ENOUGH TO SEE AT TOY SCALE. At p ~ 2^16 with B = 64
    and W = |X| ~ 2^15, the corrected accounting predicts 16 targets, 1024 charged
    sweep operations, 2048 stored partials, and exactly B = 64 combined relations,
    against N/2 = 32768 operations for the full-relation-only arm. That is a 32x
    separation at one cell, which is why this is decidable in minutes rather than by
    an exponent fit across a ladder.

  novelty_status: unverified

