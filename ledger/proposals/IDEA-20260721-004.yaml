idea:
  id: IDEA-20260721-004
  title: BKKMV mixed-volume/Bezout ratio continued to the S_6..S_8 frontier
  class: representation
  claim: >-
    The mixed-volume/Bezout ratio of the target-sectioned Semaev system (H-BKKMV, confirmed
    below Bezout at m in {3,4,5}) keeps shrinking as m grows to {6,7,8}, fast enough that
    the sparse-elimination cost of the larger system does NOT grow monotonically in m.
  mechanism: >-
    Higher summation polynomials have sparser relative Newton support; if MV/Bezout falls
    faster than the variable count grows, a larger m could paradoxically be cheaper.
  novelty_status: adaptation
  assumptions:
    - S_6..S_8 Newton polytopes are computable (S_8 is the known ceiling)
    - mixed volume is exactly computable at these m
  predictions:
    - metric: MV/Bezout ratio and projected sparse-elimination cost vs m in {3..8}
      direction: lower
      minimum_effect: "projected cost non-monotone or decreasing in m at some m<=8"
  minimal_test:
    design: Compute Newton polytopes + exact mixed volume for m=3..8; project sparse-solve cost vs dense.
    controls: [dense Bezout baseline; F_p torus BKK cross-check where feasible]
    required_metrics: [MV, Bezout, MV/Bezout, projected solve cost per m]
  falsification_conditions:
    - "projected cost strictly increasing in m (sparsity gain never offsets larger system)"
  confounders: [polytope computation limits at m=8, projection model assumptions]
  interpretation_limits: [combinatorial/projected, not a runtime solve; toy]
  estimated_cost: {implementation: medium, compute: medium}
  recommended_priority: medium
  proposed_by: idea-generator
