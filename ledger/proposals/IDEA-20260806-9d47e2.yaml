idea:
  id: IDEA-20260806-9d47e2
  question_id: RQ-MONO-001
  added: '2026-08-06'
  title: >-
    KN-FIND-c41ea9's complete-splitting theorem is a COST identity that nobody
    has cashed: on the factor-base locus the summation fibre's roots are
    x(+-P_1 +- ... +- P_{m-1}), computable by m-1 group additions, so the
    decomposition oracle in the enumerate-and-test formulation costs
    Theta(m) charged group operations -- NOT a Groebner solve -- which pins the
    free parameter D_trial that the whole ICEX threshold turns on and tells
    SDEG, DREG and SIG which formulation they are actually measuring
  class: cost-model

  claim: >-
    (A) THE COST IDENTITY, WHICH IS A COROLLARY THE FINDING STATES AND DOES NOT
    CASH. KN-FIND-c41ea9 establishes, unconditionally and at every m: if
    x_1,...,x_{m-1} are x-coordinates of F_p-rational points P_1,...,P_{m-1},
    the roots of S_m(x_1,...,x_{m-1},T) are exactly x(+-P_1 +- ... +- P_{m-1}),
    all in F_p, and S_m splits completely there. THE COST COROLLARY: the root set
    of the summation fibre over any factor-base tuple is therefore obtainable BY
    GROUP ARITHMETIC ALONE. Concretely, with the base F closed under negation the
    full root set costs at most 2^{m-2} - 1 additions by an addition tree; with F
    NOT closed under negation and the target fixed, the only quantity needed is
    the single residual Q = R - (P_{i_1} + ... + P_{i_{m-1}}), which costs
    EXACTLY m-1 additions plus one hash lookup to test membership. In neither
    case is a polynomial root-find, resultant, or Groebner basis computed at all.
    D_trial IS PINNED.

    (B) WHY THIS IS THE DEADLOCK EXIT AND NOT A RESTATEMENT. GOAL-ICEX-001 exists
    to decide a charged index-calculus exponent against rho, and its threshold -
    IDEA-20260803-fa9839, now being frozen as EXP-ICEX-146ff5 - leaves the
    per-attempt oracle cost D_trial FREE. GOAL-SDEG-001, GOAL-DREG-001 and
    GOAL-SIG-001 have spent their entire measured output estimating a
    solving-degree cost, which is a candidate value for D_trial. (A) says: for
    the ENUMERATE-AND-TEST formulation D_trial = Theta(m) and no solving degree
    is involved, so those three goals' measurements are NOT measuring D_trial for
    that formulation; they are measuring it for the SOLVE formulation, in which
    the target is fixed and the tuple is unknown. THE TWO FORMULATIONS HAVE
    DIFFERENT D_trial BY MANY ORDERS OF MAGNITUDE AND THE CORPUS DOES NOT LABEL
    WHICH ONE ANY GIVEN NUMBER BELONGS TO. That labelling is a zero-compute
    deliverable and it tells the three blocked goals whether their measured
    degrees can land inside a winning window at all.

    (C) THE HONEST OTHER HALF, STATED IMMEDIATELY BECAUSE IT IS WHAT KEEPS THIS
    FROM BEING A SPEEDUP CLAIM. Cheap D_trial does NOT make index calculus win.
    The enumerate-and-test formulation pays B^{m-1} tuples (or B^{ceil(m/2)} with
    a meet-in-the-middle join) and cheap-per-attempt times many-attempts is
    exactly the algebra-free accounting that catalogue A1-2 derives as
    N^{1/2+1/m} - WORSE than rho at every finite m. So (A) does not produce an
    attack; it produces a DICHOTOMY: either you enumerate (D_trial cheap, attempt
    count enormous, algebra irrelevant) or you solve (attempt count small,
    D_trial governed by a solving degree, and the factor-base membership
    condition needs an algebraic description that IDEA-20260801-021's Bezout
    bound constrains to |F| <= 3 d_p). THE SUMMATION POLYNOMIAL DOES NO WORK IN
    THE FIRST BRANCH, AND IN THE SECOND BRANCH IT IS NOT THE BINDING OBJECT -
    THE MEMBERSHIP PREDICATE IS. Writing that dichotomy down, with a charged
    number on each side, is the deliverable.

    (D) WHAT THIS SAYS TO GOAL-MONO-001 SPECIFICALLY. MONO is paused as "a
    re-scoping question, not a measurement". KN-FIND-c41ea9 already closed the
    generic-fibre census as an instrument; the four committed MONO proposals hunt
    for a surviving Galois-flavoured statistic. This record proposes the opposite
    move: stop hunting a statistic on the cover and CASH THE STRUCTURAL THEOREM
    AS A COST NUMBER, which is the one consumer MONO has that is not blocked. It
    is a measurement in charged group operations, not in cycle types.

  object_first_candidate:
    tracked_object: >-
      THE CHARGED COST OF ONE DECOMPOSITION ATTEMPT, D_trial, as a function of
      the FORMULATION (enumerate-and-test versus solve-for-the-tuple) rather than
      of the curve. It is followed through the relation-collection loop and it is
      the single free parameter that the ICEX threshold multiplies. Every prior
      record in MONO tracks a property of the summation FIBRE (cycle type,
      splitting rate, monodromy group, root coincidence); this tracks the number
      of charged operations needed to obtain that fibre, which is a different
      quantity and is the one downstream goals consume.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: Galois and monodromy statistics of
      the summation cover, Frobenius cycle-type censuses, root-coincidence rates,
      and any generic-fibre statistic - all four are either closed as instruments
      by KN-FIND-c41ea9 or already claimed by the four committed MONO proposals.
      Also off-limits: factor-base geometry, isogeny and endomorphism leverage,
      lattice methods, Weil descent. NO ATTACK IS PROPOSED and no new
      decomposition mechanism is offered.
    newness_score: >-
      The structural theorem is KN-FIND-c41ea9's and NO novelty is claimed for
      it; the entry states it explicitly and even flags that the identity is
      "elementary and essentially classical". What the duplication audit did not
      find in the four committed MONO proposals, the six ICEX proposals, or the
      47 ECDLP catalogue entries is any record that converts complete splitting
      into a CHARGED OPERATION COUNT for D_trial, or that labels the corpus's
      solving-degree measurements as belonging to one formulation and not the
      other. Catalogue A1-2 derives the algebra-free exponent but does not
      attribute the algebra-freeness to the complete-splitting theorem and does
      not pin D_trial as an ICEX input.
    testability_score: >-
      Maximal. The forced values are exact integers (m-1 additions, or
      2^{m-2} - 1 for the signed base) and the verification is an operation
      count on a toy curve in pure Python - no numpy, no SageMath, no solver, no
      ECDLP solve. The formulation-labelling half is a reading pass over
      committed artifacts.
    survival_score: >-
      The identity survives to every m and every p > 3 unconditionally, because
      KN-FIND-c41ea9's factor-base-locus statement is unconditional. It
      DISSOLVES the moment the tuple is not entirely factor-base elements - the
      partial-large-prime locus, where one coordinate is free - and characterising
      that boundary is a stated deliverable rather than a caveat.

  mechanism: >-
    DERIVED IN THIS RECORD from a committed finding read in full. No external
    source is used.

    STEP 1 - THE TWO FORMULATIONS, WRITTEN DOWN SEPARATELY FOR THE FIRST TIME IN
    THIS CORPUS AS FAR AS THE AUDIT COULD SEE.
      FORMULATION E (enumerate-and-test). Loop over (m-1)-tuples from F; compute
      Q = R - sum; test Q in F. Attempts: ~C(B+m-2, m-1) ~ B^{m-1}/(m-1)!.
      D_trial: EXACTLY m-1 group additions and one O(1) membership test.
      FORMULATION S (solve-for-the-tuple). Fix R; solve
      S_{m+1}(x_1,...,x_m, x(R)) = 0 subject to x_i in x(F). Attempts: one per
      target (plus rerandomisations). D_trial: a polynomial-system solve whose
      cost is governed by a solving degree - the quantity SDEG, DREG and SIG
      measure.
    THE CONSERVATION IDENTITY IS THE SAME IN BOTH: mean solutions per target is
    C(B+m-1, m)/N exactly (KN-FIND-007), independent of formulation and of
    factor-base geometry. What differs is where the cost sits.

    STEP 2 - COMPLETE SPLITTING KILLS THE ALGEBRA IN FORMULATION E. One might
    think formulation E still needs S_m: to know which x-coordinates complete a
    partial tuple, root-find S_m(x_1,...,x_{m-1},T). KN-FIND-c41ea9 says the
    roots are x(+-P_1 +- ... +- P_{m-1}) - which are obtained by ADDING THE
    POINTS, not by root-finding. So the root-find is never necessary; the
    algebra is redundant. FORCED VALUE: D_trial(E) = m-1 additions with a fixed
    target, or at most 2^{m-2} - 1 additions for the full signed root set,
    against a polynomial root-find of degree 2^{m-2} that would cost
    O~(2^{m-2} log p) field operations by equal-degree factorisation. At m = 6
    that is 5 group additions versus a degree-16 factorisation over F_p - three
    to four orders of magnitude apart at cryptographic p, and BOTH numbers are
    computable exactly.

    STEP 3 - THE SUMMATION POLYNOMIAL IS NOT THE BINDING OBJECT IN FORMULATION S
    EITHER. In S the unknowns must be constrained to x(F). Over an extension
    field that constraint is FREE - it is a choice of variable domain, resolved by
    Weil restriction. Over F_p there is no proper subfield, so the constraint must
    be imposed as extra equations, and IDEA-20260801-021's Bezout bound gives
    |F| <= 3 d_p for a degree-d_p plane predicate. So formulation S's cost is
    governed by the MEMBERSHIP PREDICATE'S DEGREE, with S_m contributing a fixed
    2^{m-2} per variable that is the same over F_p and over F_{q^n}. The corpus
    has been measuring solving degrees of BOOLEAN WEIL-DESCENT systems, which are
    formulation-S systems for the EXTENSION-FIELD membership predicate - i.e. for
    the case where the predicate is free. THAT IS THE LABELLING FINDING, and it is
    a sharper version of the gap IDEA-20260805-0d2a21 identifies.

    STEP 4 - WHAT THE THRESHOLD DOES WITH A PINNED D_trial. fa9839's comparison
    balances relation collection (attempts x D_trial) against linear algebra
    (c_LA B^omega) and compares the total to rho. Substituting formulation E's
    values: relation cost ~ B x [m! N / B^m] x [B^{m-1}] x (m-1) after the
    conservation mean, which is the algebra-free accounting; substituting a
    meet-in-the-middle join replaces B^{m-1} by B^{ceil(m/2)} and gives catalogue
    A1-2's N^{1/2+1/m}. Substituting formulation S's values leaves D_trial free
    and the threshold is a threshold on it. SO THE THRESHOLD IS ONLY NON-VACUOUS
    FOR FORMULATION S, AND FORMULATION S IS ONLY DEFINED ONCE A MEMBERSHIP
    PREDICATE EXISTS. The contract being frozen this batch should emit a
    formulation label with every threshold row, and this record says exactly
    which label goes on which row.

    STEP 5 - THE ONE PLACE COMPLETE SPLITTING DOES NOT REACH, WHICH IS ALSO THE
    RECORD'S REACHABLE POSITIVE. KN-FIND-c41ea9's statement requires ALL of
    x_1,...,x_{m-1} to be x-coordinates of rational points. On the PARTIAL locus -
    m-2 factor-base coordinates and one free coordinate - the fibre is a curve,
    not a finite set, and complete splitting says nothing. That locus is exactly
    where large-prime / partial-relation variants operate
    (IDEA-20260731-012, and the price derived in IDEA-20260806-20f6ab). Whether
    the fibre over the partial locus is cheap to enumerate is OPEN, is not
    answered by c41ea9, and is a genuinely different question from the closed
    generic-fibre census. That is this record's forward guidance and its only
    route to something new.

  novelty_status: unverified

  literature_context:
    - >-
      knowledge/findings/KN-FIND-c41ea9.md READ IN FULL. The load-bearing
      sentence is quoted in the claim: "If x_1,...,x_{m-1} are x-coordinates of
      rational points P_1,...,P_{m-1}, the roots of S_m(x_1,...,x_{m-1},T) are
      x(+-P_1 +- ... +- P_{m-1}) - 2^{m-2} values, matching deg_T S_m - and every
      one lies in F_p." Verified at m = 4 in that entry by 193/193 complete
      splittings over F_211. The entry states the instrument consequence (a
      generic-fibre census measures a constant where the attack lives) and does
      NOT state the cost consequence; that is what this record adds.
    - >-
      knowledge/findings/KN-FIND-007.md READ IN FULL, used only for the
      formulation-invariant mean.
    - >-
      analysis/SSI-ECDLP-SYNTHESIS-20260803.md READ IN FULL for the deadlock
      description and for IDEA-20260803-fa9839's role in it.
    - >-
      ideas/catalogue-20260805/A1-index-calculus.md READ IN FULL: A1-2 derives
      the algebra-free meet-in-the-middle exponent and A1-11 derives the
      restriction-of-scalars disanalogy. Both are pre-ledger, mint no identifier,
      and are cited here as prior art rather than as sources.
    - >-
      PRIMARY SOURCES UNREACHABLE. Nothing is claimed novel and nothing is
      dismissed as known. The observation that summation polynomials are
      unnecessary in the enumerate formulation may well be standard; if a
      reviewer transcribes a source saying so, this record's honest status is
      `known` and the DELIVERABLE - the formulation labels on this corpus's own
      measurements - is unchanged.

  lossy_projection_identifiability_audit:
    projection: >-
      A full decomposition-attempt procedure -> its charged operation count
      D_trial, together with a two-valued formulation label in {E, S}.
    what_is_discarded: >-
      The entire procedure: which points, which order, which target, which
      curve, which solver. An integer and one bit are retained.
    why_genuinely_lossy: >-
      Maximally lossy; the fibre over (m-1, E) contains every enumerate-and-test
      implementation on every curve at that arity. Nothing is recoverable, so
      this is not the (Delta, Pi) failure of KN-LIT-7595.
    why_compatible_with_the_operations: >-
      The operation the object must survive is the RELATION-COLLECTION LOOP, and
      it does so deterministically: total collection cost = (attempt count) x
      D_trial, so the retained integer propagates through the loop by
      multiplication without consulting anything discarded, and the formulation
      label determines which attempt count applies. That is a complete
      deterministic propagation rule on the retained pair.
    is_it_only_a_change_of_coordinates: >-
      NO, and the honest weakness is recorded alongside. Not a change of
      coordinates (huge fibres); not constant (D_trial differs by orders of
      magnitude between E and S, which is the entire content). THE WEAKNESS: the
      pair is blind to SUCCESS PROBABILITY, and a cost model that charges
      D_trial without dividing by the per-attempt success probability
      double-counts or under-counts. The conservation identity supplies that
      probability exactly (C(B+m-1,m)/N per target), so the record requires
      D_trial and the success probability to be reported as a PAIR and never
      folded into one number - which is a specific, checkable discipline rather
      than a caveat.

  assumptions:
    - >-
      Charged units are group operations for formulation E and field operations
      for formulation S, with an explicit and declared conversion (one group
      addition = I + 2M + S, or the corpus's own convention if one exists). A
      comparison across formulations without a declared conversion is not
      licensed and the record refuses to make one.
    - >-
      Membership testing "is Q in F" is O(1). True for a stored hash table of
      size B (which costs B memory, charged) and for an interval predicate on x.
      False for any F requiring a solve to recognise.
    - >-
      The target is fixed during an attempt, so only the residual is needed. If
      an implementation instead enumerates the full signed root set, D_trial is
      2^{m-2} - 1 rather than m-1 and both values are reported.

  predictions:
    - metric: >-
        Measured charged group operations per decomposition attempt in
        formulation E, at m in {3,4,5,6,7,8}, p in {1009, 4001, 16001},
        >= 10^5 attempts per cell
      direction: lower
      minimum_effect: >-
        EXACTLY m-1 additions plus one membership test, with zero field
        inversions attributable to root-finding. FORCED AND FALSIFIABLE: any
        implementation showing a per-attempt cost growing with p, or showing
        polynomial-arithmetic operations, is not implementing formulation E and
        the cell is void.
    - metric: >-
        Measured root set of S_m over factor-base tuples versus the group-law
        prediction {x(+-P_1 +- ... +- P_{m-1})}, m in {3,4,5}, p in {211, 1009}
      direction: same
      minimum_effect: >-
        SET EQUALITY in 100 per cent of tested tuples, reproducing
        KN-FIND-c41ea9's committed 193/193 at m = 4 over F_211 as a frozen
        fixture before any new cell is read. A single mismatch means either the
        S_m construction is wrong or the finding is, and either is
        decision-relevant.
    - metric: >-
        Ratio D_trial(S)/D_trial(E) at matched (m, p), with D_trial(S) taken as
        the charged cost of the smallest actually-solvable formulation-S system
        in this corpus
      direction: higher
      minimum_effect: >-
        Report the number with both units declared. FORCED CONSEQUENCE STATED
        BEFORE THE RUN: if the ratio exceeds the attempt-count ratio
        B^{m-1}/(number of S-attempts), formulation E is cheaper in total and the
        entire solving-degree programme is costing the more expensive branch; if
        it is below, formulation S is the right branch and the solving-degree
        measurements are the right measurements. EITHER OUTCOME RANKS THREE
        BLOCKED GOALS, which is the deliverable.
    - metric: >-
        Formulation label assigned to every committed SDEG, DREG and SIG
        measurement cell, by reading the systems those cells actually solve
      direction: different
      minimum_effect: >-
        Every cell must receive E or S, plus the membership predicate its system
        encodes. PREDICTION: all of them are S with an EXTENSION-FIELD
        (Weil-descent, free) membership predicate, hence none of them measures
        D_trial for any prime-field formulation. A cell that is E, or that is S
        with a prime-field predicate, refutes that prediction and is the most
        valuable cell in those three goals.
    - metric: >-
        Partial-locus fibre cost: charged operations to enumerate the fibre of
        S_m over a tuple with m-2 factor-base coordinates and one free
        coordinate, m in {4,5}, p in {211, 1009}
      direction: different
      minimum_effect: >-
        Complete splitting does NOT apply there, so the fibre is a curve and the
        prediction is that enumeration requires genuine root-finding at cost
        O~(2^{m-2} log p) field operations per specialisation. If the partial
        fibre ALSO splits completely - which the finding does not claim and I do
        not expect - the large-prime locus is as cheap as the full one and that
        is a new structural fact worth its own record.

  minimal_test:
    design: >-
      Three stages, cheapest first, stage 0 decisive for the headline.
      STAGE 0 (paper plus reading, ZERO compute, ~2 hours). Write the two
      formulations; derive D_trial for each; write the E/S label for every
      committed SDEG, DREG, SIG and ICEX measurement cell by reading the systems
      those cells solve; state which threshold rows in fa9839 / EXP-ICEX-146ff5
      belong to which formulation.
      STAGE 1 (pure Python plus sympy resultants only, minutes). Reproduce
      KN-FIND-c41ea9's committed m = 4, F_211 fixture (193/193 complete
      splittings, root sets equal to {x(+-P1+-P2+-P3)}) BEFORE anything new is
      run. Then extend to m = 5 at p = 211 and 1009 and check set equality.
      STAGE 2 (pure Python, minutes). Instrument formulation E's attempt loop and
      count charged operations per attempt at m = 3..8; instrument the partial
      locus and count root-finding operations there. Report both against their
      forced values.
    controls:
      - >-
        KNOWN-ANSWER EDGE WITH NO HIDDEN COST (runs first). The m = 3 case, where
        S_3 has degree 2 in T and the two roots are x(P+Q) and x(P-Q) by the
        chord formula - an answer known for free from KN-FIND-c41ea9's own
        two-line derivation. The instrument must return exactly those two values
        and exactly 1 addition per attempt with a fixed target. An instrument
        built to find algebra-free shortcuts will find them everywhere unless it
        returns the textbook answer on the one case where the textbook answer is
        already written down.
      - >-
        COMMITTED-FIXTURE REPRODUCTION (CAN FAIL). KN-FIND-c41ea9's m = 4, F_211
        census: 193 specialisations, 193/193 splitting completely, root sets
        exactly {x(+-P1+-P2+-P3)}. Must be reproduced CELL FOR CELL before any
        new cell is read. If it fails, the S_m construction differs from the
        finding's and nothing else is interpretable.
      - >-
        NEGATIVE-LOCUS CONTROL (CAN FAIL, AND IS THE NULL). Specialise at
        x_1,...,x_{m-1} chosen UNIFORMLY IN F_p rather than on the factor-base
        locus. FORCED VALUE from the same finding: the split rate must be
        1/2 + O(1/p) at m = 3, NOT 1, and the root set must NOT be recoverable by
        group additions because the x_i are not x-coordinates of rational points
        for about half of them. If the generic locus also splits completely, the
        implementation is silently projecting onto the curve and the whole
        measurement is void.
      - >-
        DEGENERATE-PARAMETER CHECK THAT MUST FAIL. Set m = 2, where S_2 is
        x_1 - x_2 and there is no fibre to speak of. The instrument must report
        the degenerate case explicitly rather than returning a number.
      - >-
        UNIT-DECLARATION TRIPWIRE. Any comparison between D_trial(E) in group
        operations and D_trial(S) in field operations must fail loudly unless the
        conversion constant is declared in the contract. The record's own
        cross-formulation ratio is refused rather than estimated if the corpus
        has no committed conversion.
      - >-
        ARCHIVE CHECK (zero compute). Record, verbatim, KN-FIND-c41ea9's
        statement of the factor-base-locus theorem and its explicit disclaimer
        ("Nothing about ECDLP hardness, in either direction. No attack advantage
        over Pollard rho is claimed or implied"), and carry that disclaimer into
        every artifact this record produces. Under AGENTS.md retrieval policy
        item 7 the relationship to the four committed MONO proposals is reported;
        no status change to any of them is proposed.
    required_metrics:
      - D_trial(E) in charged group operations per attempt, per (m, p), with the unit declared
      - the m = 4 F_211 fixture reproduction, pass/fail, cell for cell
      - measured root sets versus group-law prediction, set equality per tuple
      - generic-locus split rate against 1/2 + O(1/p)
      - partial-locus root-finding operation count
      - the E/S label plus membership-predicate type for every committed SDEG/DREG/SIG cell
      - success probability per attempt reported BESIDE D_trial, never folded in

  falsification_conditions:
    - >-
      The m = 4 F_211 fixture does not reproduce. The construction differs from
      the finding's and nothing else is read.
    - >-
      The generic-locus control also splits completely. The implementation is
      projecting onto the curve; the measurement is void and no conclusion about
      the factor-base locus is licensed.
    - >-
      Measured D_trial(E) grows with p or shows polynomial-arithmetic operations.
      The implementation is not formulation E and the pinning claim is untested.
    - >-
      Stage 0 finds that some committed SDEG/DREG/SIG cell is formulation E, or
      is formulation S with a prime-field membership predicate. This record's
      labelling prediction is WRONG and those cells become the most valuable in
      the three goals - the reachable positive.
    - >-
      The partial locus also splits completely at m = 4 or 5. Complete splitting
      reaches further than the finding claims, the large-prime locus is cheap,
      and a new structural fact exists that this record did not predict.
    - >-
      fa9839 / EXP-ICEX-146ff5 turns out to charge formulation E explicitly. Then
      D_trial is already pinned in that contract, the labelling finding is void,
      and this record reduces to the partial-locus question alone.

  confounders:
    - >-
      UNIT INCOMMENSURABILITY. Group operations and field operations are not the
      same unit and the corpus has no single committed conversion. Any ratio
      between formulations is meaningless without one, and the record refuses the
      ratio rather than estimating it - which is the discipline
      IDEA-20260802-007 asks for and which this record adopts.
    - >-
      CHEAP PER ATTEMPT IS NOT CHEAP IN TOTAL. Formulation E's attempt count is
      B^{m-1} (or B^{ceil(m/2)} with a join), and the whole cost sits there. Any
      presentation of D_trial(E) = m-1 without the attempt count beside it is a
      misrepresentation, and the record requires both in every table.
    - >-
      MEMORY. The O(1) membership test presumes a stored hash table of size B,
      which is B memory - charged here, and unchargeable under a baseline that
      allows the candidate memory for free. Under IDEA-20260806-3b91c7's
      memory-matched baseline the comparison tightens; this record does not
      depend on that correction but any threshold it feeds should carry it.
    - >-
      SIGN CONVENTIONS. Whether F is closed under negation changes D_trial by a
      factor 2^{m-2}/(m-1) and changes the conservation mean by a factor
      approximately 2^m (catalogue A1-7's signed-multiset correction, which is
      pre-ledger and unfiled). Both conventions must be reported and neither
      assumed.
    - >-
      AUTHORSHIP: this record cashes someone else's theorem. The novelty claimed
      is only the cost corollary and the labelling, and the record states
      explicitly that the mathematics is KN-FIND-c41ea9's and that its
      reviewers, not its producer, contributed the m >= 4 generalisation.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED, AND NO CLAIM THAT PRIME-FIELD ECDLP IS
      WEAKENED. Cheap D_trial in formulation E is exactly compensated by the
      attempt count; the composed accounting is catalogue A1-2's N^{1/2+1/m},
      which is WORSE than rho at every finite m. Pollard rho at 0.886*sqrt(N)
      remains the baseline.
    - >-
      TOY TIER for every measurement (p <= 16001, m <= 8). KN-FIND-c41ea9's own
      largest exercised prime is 1601. The THEOREM is scale-independent; the
      measurements are not.
    - >-
      KN-FIND-c41ea9's own disclaimers travel with this record verbatim: it is a
      derivation at claim tier toy, no AGENTS.md rule 12 review exists for it,
      and it settles nothing about ECDLP hardness in either direction.
      KN-OPEN-009 is not closed by this record and is not touched by it.
    - >-
      No status change is proposed to any MONO, SDEG, DREG, SIG or ICEX record,
      and nothing here says EXP-ICEX-146ff5 is wrong. It says the contract should
      carry a formulation label per row, which is an addition, not a repair.
    - >-
      Forward guidance, mandatory. What remains open regardless of outcome:
      (a) the PARTIAL locus, where complete splitting does not apply and where
      large-prime variants operate - genuinely open and not answered by
      c41ea9; (b) whether any prime-field membership predicate exists that makes
      formulation S well-posed at all, which is IDEA-20260801-021's Bezout bound
      and KN-OPEN-020; (c) whether the solving degrees measured in this corpus
      transfer from the boolean Weil-descent systems to any prime-field system,
      which IDEA-20260805-0d2a21 targets and which this record does not answer.

  standing_screen_verdicts:
    kn_find_007_mean_yield:
      verdict: PASSES - USES THE MEAN AS A FORMULATION-INVARIANT, CLAIMS NOTHING
      reasoning: >-
        No factor base is proposed and no geometry is varied. The conservation
        mean C(B+m-1,m)/N is used only to state that the per-target solution
        count is THE SAME in both formulations, which is the direction the
        finding licenses. The record claims no yield advantage of any kind, and
        it explicitly requires the success probability to be reported beside
        D_trial rather than folded into it.
    kn_find_c41ea9_generic_fibre:
      verdict: >-
        PASSES BY CONSTRUCTION - THE OBSERVABLE IS DELIBERATELY NOT A
        GENERIC-FIBRE STATISTIC, AND THE SCREEN'S OWN THEOREM IS THE INPUT
      reasoning: >-
        The screen rejects proposals whose observable is a generic-fibre Galois
        or monodromy statistic, because such a statistic is constant on the
        factor-base sublocus where relation search operates. This record's
        observable is a CHARGED OPERATION COUNT on the factor-base sublocus
        itself, and its content is precisely that the sublocus's constancy is a
        COST FACT. It uses the screen's theorem as a premise rather than
        proposing a measurement the screen forbids. The generic-locus arm appears
        ONLY as a null control, with the finding's own 1/2 + O(1/p) as its forced
        value - which is the one legitimate use of a generic-fibre statistic
        under this screen.
    kn_find_002_ggm_simulable:
      verdict: NOT APPLICABLE - PASSES
      reasoning: >-
        No augmented oracle is proposed and no jet, endomorphism, elliptic-net or
        incidence family is reopened. Formulation E is a plain generic-group
        procedure (additions and equality tests) to which KN-TECH-005 applies in
        full, consistent with the record's statement that it moves no exponent;
        formulation S is a polynomial solve on public data and is not an oracle
        family at all. Nothing here requires defeating a simulation argument.

  discriminated_from:
    nearest_existing_idea: IDEA-20260805-90df50
    nearest_existing_read: >-
      Title read in full via the audit's E4 enumeration: "The one
      Galois-flavoured statistic that is NOT identically trivial on the
      factor-base sublocus: the root-coincidence rate of the summation fibre,
      whose forced value is exactly 6(tau-1)/N at m=4 and 16tau/N + 24(tau-1)/N
      at m=5, is driven by the rational 2-torsion, and at m >= 5 is literally a
      relation counter." Body NOT opened; stated so a reviewer can re-check.
    differing_observable: >-
      90df50's observable is the ROOT-COINCIDENCE RATE of the summation fibre - a
      dimensionless frequency with a forced value in units of 1/N, driven by
      rational 2-torsion, and it is a statistic OF the fibre. This record's
      observable is the NUMBER OF CHARGED GROUP OPERATIONS required to OBTAIN the
      fibre, an integer in units of group additions with forced value m-1 (or
      2^{m-2}-1), and it is a statistic of the PROCEDURE. They can be measured in
      the same harness and return unrelated numbers: at m = 4 90df50 predicts
      6(tau-1)/N and this record predicts 3. Neither implies the other, and one
      shared run separates them cleanly because 90df50's forced value is
      unaffected by how the roots are computed while this record's is entirely
      about how they are computed.
    second_and_third_records_checked:
      - >-
        IDEA-20260803-ff7415 (title read): decides KN-FIND-c41ea9's untaken
        2^{n-1} split-compounding clause over F_{q^n} - whether it is an
        exponent lever or a double count against the 1/n! conservation identity.
        That record cashes a DIFFERENT untaken clause of the same finding, in the
        EXTENSION-FIELD direction, and its observable is a compounding factor per
        summation fibre as n grows. This record cashes the factor-base-locus
        clause in the PRIME-FIELD direction and its observable is an operation
        count at fixed m. The two are complementary readings of one finding and
        neither subsumes the other; ff7415's positive branch would be
        exponent-moving and this record's explicitly is not.
      - >-
        IDEA-20260805-cf2d5a (title read): the summation cover is a 2-Kummer
        cover with geometric monodromy (Z/2)^{m-2} at every m, so KN-OPEN-009's
        "full symmetric/wreath" premise is false and the deferred m >= 4 census
        becomes unnecessary. That is a GROUP-THEORETIC statement about the cover
        with a monodromy group as its observable. This record makes no monodromy
        claim, uses no Galois theory, and would be unaffected if cf2d5a's
        monodromy computation were wrong - because complete splitting on the
        factor-base locus is proved by the group law, not by the monodromy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO HEURISTIC IS REQUIRED FOR THE CENTRAL COST IDENTITY. The
        factor-base-locus complete-splitting statement of KN-FIND-c41ea9 is
        unconditional for every m and every p > 3, and the operation count m-1
        follows from the group law alone. This item is numbered so the absence is
        explicit and cannot later be filled in by a reader.
      rigorous_support: >-
        The group law and KN-FIND-c41ea9's proof, which is elementary and was
        independently re-derived by two reviewers per that entry's own
        provenance note.
      validation_plan: >-
        Exhaustive reproduction of the committed m = 4 F_211 fixture (193
        specialisations) plus a fresh m = 5 census; complete verification at
        those sizes rather than a distributional comparison. TOY SCALE for the
        census; the identity itself is scale-independent.
    - id: H2
      statement: >-
        Membership "is Q in F" costs O(1) charged operations given B words of
        storage, and the storage is charged at B.
      rigorous_support: >-
        Standard hashing, with the usual caveat that O(1) hides a memory access
        whose real cost under an area-time model (KN-TECH-035's convention) is
        not constant. Rigorous as an operation count, heuristic as a cost.
      validation_plan: >-
        Report the measured lookups per attempt and the table size per cell; and
        report the same accounting under the area-time convention as a second
        column, so a reader can see how much of the "cheap" verdict is a RAM-model
        artifact. TOY SCALE only.
    - id: H3
      statement: >-
        The formulation label E or S can be assigned unambiguously to every
        committed SDEG, DREG, SIG and ICEX measurement cell by reading the system
        that cell solves.
      rigorous_support: >-
        NONE - it is an empirical claim about this repository's artifacts and it
        may simply be false if a cell's system is not recorded. It is stated
        formally because the labelling is a declared deliverable and a
        non-labellable cell is itself a finding about what those goals archive.
      validation_plan: >-
        Stage 0's reading pass. Report the count of labellable and non-labellable
        cells; a high non-labellable count is the useful result and must be
        reported as such rather than resolved by guessing.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS PROPOSED OR MOVED. What is pinned is a per-attempt constant:
      D_trial(E) = m-1 charged group additions plus one O(1) lookup, versus
      D_trial(S) = the charged cost of a polynomial solve at whatever solving
      degree SDEG/DREG/SIG measure. Composed with formulation E's attempt count
      the total is the algebra-free accounting: Theta(B^{ceil(m/2)}) per relation
      with a meet-in-the-middle join, hence Theta(N^{1/2+1/m}) end to end at the
      coverage-optimal B (catalogue A1-2's derivation, adopted unchanged) -
      STRICTLY WORSE than Pollard rho's N^{1/2} at every finite m and
      approaching it only as m -> infinity. Against BSGS's N^{1/2}: likewise
      worse.
    memory_exponent: >-
      Formulation E with a meet-in-the-middle join holds Theta(B^{floor(m/2)})
      stored entries = Theta(N^{1/2}) at the coverage optimum, plus B for the
      membership table. Against rho's O(1) and BSGS's N^{1/2}. Under
      IDEA-20260806-3b91c7's memory-matched baseline the bar at memory N^{1/2}
      is N^{1/4}, which formulation E misses by N^{1/4+1/m}. Multi-target: the
      membership table and any first-half list are target-independent, so T
      targets amortize them and pay T joins; this does not reach the committed
      sqrt(T*N) floor at any tested parameter.
    best_known: >-
      Pollard rho, 0.886*sqrt(N) group operations, O(1) memory. BSGS at
      (N^{1/2}, N^{1/2}). Prime-field index calculus has NO known advantage
      (KN-OPEN-001; EV-IC-002 retracted this program's only support verdict).
      Nothing here changes any of them.
    hidden_overhead: >-
      Disclosed. (i) The m-1 additions are group operations whose field-operation
      cost depends on coordinates and is not stated by the corpus's conventions.
      (ii) The O(1) membership test is a memory access, not free under an
      area-time model. (iii) Signed versus unsigned base changes D_trial by
      2^{m-2}/(m-1) and the mean by ~2^m, and both conventions must be reported.
      (iv) Formulation S's D_trial is not pinned by anything in this record; that
      is the point of the labelling, not a gap in it.
    tradeoff_note: >-
      The formulation choice IS a time-memory tradeoff and the record names it as
      one: E buys cheap attempts with B (or B^{floor(m/2)}) memory and an
      enormous attempt count; S buys few attempts with an expensive solve and
      whatever memory the Macaulay matrix needs - which
      IDEA-20260805-e732ed records that no DREG artifact charges. Parallelization:
      E's attempt loop is embarrassingly parallel with linear speedup; S's solve
      is not, which is a further asymmetry no threshold row in this corpus states.

  dominated_by: >-
    n/a for this RECORD (it proposes no algorithm and occupies no cost point) -
    but the FORMULATION it costs is dominated, and the frontier was checked row
    by row rather than left as an unchecked null. TIME: Pollard rho
    0.886*sqrt(N) = 2^{128} at N = 2^{256}, versus formulation E's
    N^{1/2+1/m} = 2^{192} at m = 4 - dominated by 64 bits; BSGS at N^{1/2} -
    same verdict; the memory-matched generic baseline sqrt(N/S)
    (IDEA-20260806-3b91c7) at S = N^{1/2} gives 2^{64} - dominated by 128 bits.
    MEMORY: rho at O(1) dominates formulation E's Theta(N^{1/2}) absolutely;
    BSGS ties it. DATA/QUERIES: all query-free on public parameters. MULTI-TARGET
    sqrt(T*N) (IDEA-20260731-013's floor): not reached at any tested T.
    PREPROCESSING S*T^2 = Omega~(N) (KN-TECH-005): formulation E sits far above
    it. Prime-field index calculus generally: no known advantage (KN-OPEN-001).
    No row was left unchecked, and no configuration this record costs is on the
    frontier.
  sota_delta: >-
    ZERO on every ECDLP attack axis - no solve, no relation at scale, no
    certificate, no exponent, no constant-factor speedup either. The delta is a
    PINNED PARAMETER AND A LABELLING: D_trial for the enumerate-and-test
    formulation is fixed at exactly m-1 charged group additions plus one O(1)
    lookup (or 2^{m-2}-1 additions for the full signed root set) where the
    corpus's threshold leaves it free - values 2, 3, 4, 5, 6, 7 at m = 3..8
    against a degree-2^{m-2} polynomial root-find that would cost
    O~(2^{m-2} log p) field operations, three to four orders of magnitude more
    at cryptographic p; a two-branch dichotomy in which the summation polynomial
    does no work in one branch and is not the binding object in the other; and an
    E/S label plus membership-predicate type for every committed SDEG, DREG and
    SIG measurement cell, which tells three blocked goals whether the quantity
    they measure can enter the ICEX threshold at all. That labelling is the
    deadlock exit, it costs one reading pass, and it is worth exactly zero as an
    attack.

