  assumptions:
    - >-
      The executor session has a shell and Python 3 with arbitrary-precision
      integers. C4 needs one squaring; C3 needs one modular inversion; the
      symbol chain needs three exponentiations; only the toy censuses need
      more.
    - >-
      No SEA, Sage or PARI. Nothing here needs one; the toy censuses count
      points by direct enumeration.
    - >-
      IDEA-20260829-b41d39's C1, C2 and C3 have passed their exhaustive toy
      census. C3's chain and C5's discussion are meaningless before that.
    - >-
      RFC 7748's printed values are read by the executor from
      inputs/SAFECURVES-20260825/specs/rfc7748.txt, NOT from this record. The
      135-digit d, the hexadecimal order and the base-point coordinates are
      deliberately not reproduced here, because a transcription error in a
      proposal is exactly the defect the campaign's next_action names.
    - >-
      Scope is prime fields, odd characteristic, the Edwards and Montgomery
      models named in RFC 7748 section 4.2. No claim is made about any other
      model or field.

  proof_search_map:
    bottleneck: >-
      Whether any instrument computed in one model may be reported as a
      property of a curve given in another. Every 2-adic record in this batch
      either converts models or refuses to, and none has established what the
      conversion preserves. The bottleneck is not a computation - the maps are
      printed in a standards document - but the absence of a stated
      preservation theorem and of any measurement of where it fails. Removing
      it decides whether IDEA-20260829-d052e6's Montgomery instrument may be
      applied to Edwards rows at all, which is a question five sibling records
      inherit.
    baseline_embedding:
      parameter_slice: >-
        Restricted to the identity map, C1's exceptional-set claim must be
        vacuous. Restricted to a curve with d a square, where the 2-Sylow is
        non-cyclic and E[2] has four points, C1 must report an exceptional set
        of the right larger size rather than silently reporting two - that is
        the boundary case the general claim must contain. And the C3 identity
        must reduce, when d_birational is substituted into
        A = 2(1 + d)/(1 - d), to A = 156326 exactly.
      reproduction_check: >-
        A frozen fixture asserting three things before anything else runs -
        that 39081 times the inverse of 39082 mod p equals the RFC's printed
        d digit for digit; that substituting that d back into
        2(1 + d)/(1 - d) returns 156326 exactly; and that the exceptional-set
        counter returns 2 on complete toy curves and 4 on non-complete ones.
    observation_collision:
      observable: >-
        The pair (order, 2-Sylow type), which is the certificate carrying
        every transfer conclusion.
      distinct_preimage_search: >-
        REQUIRED, AND THE ANSWER IS THE EXPERIMENT'S POINT. Search at toy
        scale for two curves with the SAME order and DIFFERENT 2-Sylow type
        that are 4-isogenous to each other. PREDICTED TO EXIST, since isogeny
        preserves order and not structure, and each exhibited pair is a
        DIRECT COUNTEREXAMPLE to transporting a halving-chain instrument
        across an isogeny. Finding NONE across an exhaustive toy census would
        mean 4-isogeny preserves the 2-Sylow type more often than the general
        theory suggests, which would be a genuine and reportable structural
        observation and would WEAKEN rather than strengthen the record's
        caution - the record must be willing to report that.
        A SECOND COLLISION, WHICH IS THE ONE THAT MATTERS FOR THE FAMILY -
        curve448, its birational Edwards partner, and edwards448 all have the
        same printed order and the same printed cofactor 4. Do all three have
        the same 2-Sylow type? The first two must, being isomorphic; the third
        need not, and whether it does is a concrete 448-bit question this
        record answers with three Legendre symbols.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the order fixed and vary the forgotten structure - the 2-Sylow
          type - across a 4-isogeny, and measure how often it changes. The
          fibre's behaviour under the isogeny IS the transfer theorem, stated
          empirically where it cannot be stated rigorously.
        predicted_gain: >-
          A per-instrument transfer rule - valuation instruments transportable
          across isogeny, chain instruments not - replacing the current
          blanket refusal in IDEA-20260829-d052e6's transfer note (c) with a
          measured distinction. That converts a caveat into a rule, which is
          what five sibling records need.
      - transform: representation_reduction
        proposed_object: >-
          Replace the 135-digit published Edwards parameter by the ratio of
          two four-digit integers, 39081/39082, and the ladder criterion by
          the single symbol chi(39082).
        predicted_gain: >-
          A 448-bit consistency check between two constants printed in the
          same standards document at the cost of one modular inversion, and a
          reduction of two criterion cells on two curves to one bit.
    quantifier_order: >-
      C1 IS CLAIMED UNIFORMLY AND CONDITIONALLY. FOR ALL odd p and FOR ALL d
      with chi(d) = -1, the birational map printed in RFC 7748 is defined
      exactly on the complement of E[2](F_p) in E_d(F_p), and that complement
      omits exactly two rational points.
      C2's FACTUAL PREMISE IS RETRIEVED, NOT CLAIMED. Its TRANSFER STATEMENT
      is claimed uniformly in one direction and existentially in the other -
      FOR ALL F_p-isogenies the order is preserved; THERE EXIST F_p-isogenies
      of degree 4 for which the 2-Sylow type is not preserved, and the
      experiment must exhibit one.
      C3 IS CLAIMED AS AN EXACT IDENTITY at one instance - FOR THIS p,
      39081 times the inverse of 39082 equals the RFC's printed d. And as an
      implication - IF edwards448 is complete and p is 3 mod 4 THEN
      chi(A^2 - 4) = chi(39082).
      C4 IS CLAIMED UNIFORMLY over a one-element set - FOR p = 2^448 - 2^224 - 1,
      (2^225 - 1)^2 = 5. NOT CLAIMED for any other prime, though the same
      argument applies verbatim to any p with 2^(2k) = 2^k + 1.
      C5 IS A COMPARISON OF HYPOTHESES, not a claim about either curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The birational map omits exactly the two rational 2-torsion points;
        curve448 and edwards448 are 4-isogenous per RFC 7748 and share an
        order but need not share a 2-Sylow type; the RFC's 135-digit Edwards
        parameter equals 39081/39082 mod p; sqrt(5) = 2^225 - 1 mod p; and
        Ed448's matched-cofactor conclusion is conditional where E-521's is
        not." It certifies NOTHING about the odd part, nothing about
        primality, nothing about the ladder's constant-time behaviour or any
        implementation property, and nothing about safety. In particular C3
        shows two criterion cells share a bit; it does NOT show either cell is
        wrong, and reading it as a criticism of SafeCurves would be a
        misreading.
      nearby_object_control: >-
        THE THREE-CURVE SET PRINTED IN RFC 7748 IS THE CONTROL AND IT IS
        UNUSUALLY GOOD, BECAUSE THE STANDARD SUPPLIES THE GROUND TRUTH.
        curve448 and its birational Edwards partner MUST agree on order and on
        2-Sylow type, being isomorphic; edwards448 must agree on order and may
        disagree on type. An implementation that reports a type difference
        between the first two has a bug, and an implementation that cannot
        even represent the possibility of a difference for the third has not
        implemented the distinction this record is about. A SECOND NEARBY
        OBJECT - E-521, whose forcing conclusion is unconditional while this
        row's is not, at s = 522 against 225; conflating them is the specific
        error this record and IDEA-20260829-512415 are jointly designed to
        prevent. A THIRD, CHEAPEST CONTROL - a curve over a prime that is NOT
        of golden-ratio shape, on which the C4 self-test must FAIL; a
        self-test that passes on every prime is testing nothing.
    proof_obligations:
      - claim: >-
          On E_d with d a non-square, the rational points with x = 0 are
          exactly (0, 1) and (0, -1), and no other rational point has y = -1.
        responsibility: correctness
      - claim: >-
          The RFC's birational map is defined and injective on the complement
          of those two points, and its image is the corresponding complement
          on the Montgomery side.
        responsibility: correctness
      - claim: >-
          An F_p-isogeny preserves the number of F_p-rational points.
        responsibility: correctness
      - claim: >-
          There exist 4-isogenous pairs over F_p with different 2-Sylow types,
          exhibited at toy scale.
        responsibility: feasibility
      - claim: >-
          d = (A - 2)/(A + 2) inverts A = 2(1 + d)/(1 - d) identically.
        responsibility: correctness
      - claim: >-
          39081 times the inverse of 39082 mod p equals RFC 7748's printed
          135-digit d, checked digit for digit.
        responsibility: interface
      - claim: >-
          (2^225 - 1)^2 = 5 in F_p for p = 2^448 - 2^224 - 1, and the identity
          FAILS for a prime not of that shape.
        responsibility: strictness
      - claim: >-
          s = 225 for this p and the Hasse bound permits v_2 up to 449, so the
          forcing hypothesis is not vacuous.
        responsibility: size
    not_applicable_reason: null

  predictions:
    - metric: '(2^225 - 1)^2 mod p for p = 2^448 - 2^224 - 1'
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 5. This is a full-size algebraic identity with no
        external data and no transcription, so a failure means the modulus is
        mis-transcribed or the modular arithmetic is wrong, and every 448-bit
        number in this campaign is then suspect. It costs one squaring and it
        is the cheapest full-size self-test available anywhere in this batch.
    - metric: >-
        the same identity evaluated at a prime not of golden-ratio shape, for
        example 2^414 - 17
      direction: different
      minimum_effect: >-
        PREDICTED NOT EQUAL TO 5. THIS IS THE REFUSAL CONTROL FOR C4 - a
        self-test that passes everywhere is testing nothing, and this one
        pass-fail pair is what makes the identity a test rather than an
        accident.
    - metric: >-
        39081 times the inverse of 39082 mod p, compared digit for digit
        against RFC 7748's printed 135-digit Edwards d
      direction: different
      minimum_effect: >-
        PREDICTED EXACT EQUALITY. Two independently printed constants in the
        same document, bound by a 448-bit identity that a random pair
        satisfies with probability about 2^-448. A mismatch means either the
        birational formula is not the one the RFC used or a printed constant
        is wrong - halt, re-read the RFC text, and escalate before any
        statement leaves the repository.
    - metric: 'chi(-39081), that is the completeness symbol for Ed448-Goldilocks'
      direction: different
      minimum_effect: >-
        PREDICTED -1, matching the mirror's complete cell and its count of
        exactly one point of order 2. Equivalently, since p is 3 mod 4 as RFC
        7748 states verbatim, chi(39081) = +1 - which is ALSO the exact
        condition for sqrt(156324) to exist, since 156324 = 4 times 39081, and
        hence for the RFC's own birational map to be defined over F_p. SO THE
        RFC'S MAP EXISTING AND THE CURVE BEING COMPLETE ARE THE SAME
        CONDITION, a second criterion dependency and one the RFC's own text
        makes checkable.
    - metric: 'chi(39082), that is chi(1 - d) for Ed448-Goldilocks'
      direction: different
      minimum_effect: >-
        PREDICTED -1, hence v_2(#E) = 2 and cofactor 2-part exactly 4,
        matching both the mirror's published 2^2 and RFC 7748's printed
        cofactor 4. AND, BY C3's CHAIN, PREDICTED TO EQUAL chi(A^2 - 4) FOR
        A = 156326, so the same symbol certifies that curve448's Montgomery
        ladder is complete by the 2006 Bernstein criterion. Computing
        chi(A^2 - 4) directly and comparing is a genuine cross-check with only
        p shared between the two routes.
    - metric: >-
        fraction of 4-isogenous curve pairs at toy scale that agree on the
        group order
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 1.000, exhaustive census. Anything below 1.000 means
        the isogeny implementation is wrong, since order preservation is a
        theorem, and nothing else in the census means anything until it is
        fixed.
    - metric: >-
        fraction of 4-isogenous curve pairs at toy scale that agree on the
        2-Sylow isomorphism type
      direction: lower
      minimum_effect: >-
        PREDICTED STRICTLY BELOW 1.000, with at least one exhibited
        disagreeing pair. THIS IS THE RECORD'S CENTRAL MEASUREMENT AND ITS TWO
        OUTCOMES MEAN DIFFERENT THINGS - below 1.000 means a chain instrument
        must NOT be transported across an isogeny and
        IDEA-20260829-d052e6's caution is vindicated and sharpened into a
        rule; exactly 1.000 across an exhaustive census would mean 4-isogeny
        preserves the 2-Sylow type far more reliably than the general theory
        suggests, which would be a real structural finding and would LOOSEN
        the rule rather than tighten it. The record commits to reporting
        either.
    - metric: >-
        size of the birational map's exceptional set at toy scale, split by
        whether d is a square
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 2 on every complete curve, and STRICTLY MORE on
        non-complete curves where E[2] is larger. A constant answer across
        both branches means the exceptional-set counter is not reading the
        curve.
    - metric: 's = 1 + v_2(p + 1) for this p, and whether the forcing hypothesis is vacuous'
      direction: different
      minimum_effect: >-
        PREDICTED s = 225, since p + 1 = 2^224(2^224 - 1) with 2^224 - 1 odd,
        against a Hasse bound permitting v_2 up to 449. So the hypothesis is
        NOT vacuous and the matched-cofactor conclusion is CONDITIONAL. An
        implementation reporting it as unconditional has confused this row
        with E-521 and every unconditional claim it makes is void.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE. Write out C1, C4 and C5. C1 is a two-line
      analysis of where a printed map is undefined, C4 is a three-line
      identity, C5 is one valuation compared against one bound. A failure here
      costs nothing.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR WITH COMPUTE, MILLISECONDS,
      AND IT IS THE ARITHMETIC SELF-TEST. Verify (2^225 - 1)^2 = 5 mod p, and
      verify it FAILS at 2^414 - 17. Then compute 39081 times the inverse of
      39082 mod p and compare against the RFC's printed d. Together these are
      one squaring, one inversion and one comparison, they use no curve
      arithmetic at all, and they either establish that the implementation
      does correct 448-bit modular arithmetic against a fact nobody
      transcribed or they kill everything downstream. Nothing else in this
      record is as cheap or as decisive.
      STAGE 2, milliseconds. The symbol chain - chi(-39081), chi(39082), and
      chi(A^2 - 4) for A = 156326 computed independently - and the check that
      C3's chain closes.
      STAGE 3, minutes. THE TOY ISOGENY CENSUS. At small primes, enumerate
      curves, compute 4-isogenous partners using the RFC's printed maps
      generalised, count points on both by direct enumeration, and compare
      orders and 2-Sylow types. The 2-Sylow type is obtained by counting
      solutions of 2^k P = O for small k, which is direct and needs no group
      structure algorithm.
      STAGE 4, minutes. THE EXCEPTIONAL-SET CENSUS. At small primes, for every
      d, apply the birational map to every rational point, count how many
      points it fails on, and compare against the rational 2-torsion.
      STAGE 5, seconds. The three-curve check at full size - curve448, its
      birational Edwards partner, and edwards448 - on order, cofactor and
      predicted 2-Sylow type.
    controls:
      - >-
        BLOCKING REFUSAL CONTROL FOR C4 - the golden-ratio identity must FAIL
        at a prime of a different shape. A self-test that passes everywhere is
        testing nothing and C4 is then withdrawn.
      - >-
        BLOCKING ORDER CONTROL FOR THE ISOGENY CENSUS - 4-isogenous pairs must
        agree on the order in 100 percent of cases, since that is a theorem.
        Any disagreement is an implementation defect and the type comparison
        means nothing until it is fixed.
      - >-
        POSITIVE, AND SUPPLIED BY THE STANDARD - curve448 and its birational
        Edwards partner must agree on order AND type, being isomorphic. This
        is a full-size positive control with ground truth printed in RFC 7748.
      - >-
        NEARBY-OBJECT CONTROL - E-521, whose forcing conclusion is
        unconditional. The implementation must classify the two rows
        differently and must say why.
      - >-
        NEGATIVE, PARAMETER-MATCHED - d' = -39081 + k for the smallest k
        making chi(d') = +1 over the same p, which must be reported not
        complete, and whose exceptional set must be reported larger than 2.
      - >-
        NULL, SAME SHAPE - 10^4 random d at the real p through the identical
        symbol chain, whose four sign patterns must each occur near 0.25. And
        10^4 random 448-bit values fed to the squaring self-test, of which
        none may return 5, confirming that the C4 identity is not an artifact
        of the squaring routine.
      - >-
        CROSS-IMPLEMENTATION - every Legendre symbol by Euler's criterion and
        by the binary Jacobi recursion; the modular inverse by extended
        Euclid and by Fermat exponentiation, required to agree.
      - >-
        MIRROR-INTEGRITY CONTROL - recompute the sha256 of every mirror file
        read and compare against source_record_addendum_01.yaml; and re-read
        the RFC section from specs/rfc7748.txt rather than from this record.
    required_metrics:
      - 'the C4 self-test result at this p and at the control prime'
      - '39081 times the inverse of 39082 mod p, and its digit-for-digit comparison against the RFC constant'
      - 'chi(-39081), chi(39082), chi(A^2 - 4) for A = 156326, and whether the chain closes'
      - 'per toy p, the isogeny census order-agreement fraction, exhaustive'
      - 'per toy p, the isogeny census 2-Sylow-type agreement fraction, with exhibited disagreeing pairs'
      - 'per toy p, the exceptional-set size split by whether d is a square'
      - 'the three-curve full-size comparison on order, cofactor and predicted 2-Sylow type'
      - 's = 1 + v_2(p + 1), the Hasse valuation bound, and the conditionality verdict'
      - 'the null symbol-pattern frequencies over 10^4 random d, with seeds'
      - 'the sha256 of every mirror file read and the RFC line numbers of every value used'

  falsification_conditions:
    - >-
      (2^225 - 1)^2 is not 5 mod 2^448 - 2^224 - 1. Either the modulus is
      mis-transcribed or the modular arithmetic is wrong; every 448-bit
      statement in this campaign is suspended until it is found. This is the
      most consequential single failure available in this record and it costs
      one squaring to check.
    - >-
      The C4 identity ALSO holds at a prime not of golden-ratio shape. The
      self-test has no resolving power and C4 is withdrawn.
    - >-
      39081 times the inverse of 39082 mod p does not equal RFC 7748's printed
      Edwards d. Either the birational formula is not the one used or a
      printed constant is wrong - halt, re-read the RFC section, and escalate
      to independent review before any statement leaves the repository. A
      transcription or formula error is far likelier than a defect in the RFC
      and must be excluded first.
    - >-
      chi(A^2 - 4) for A = 156326 does not equal chi(39082). C3's chain does
      not close, which means either IDEA-20260829-b41d39's C1 identity is
      wrong or the relation between the two curves is not what RFC 7748 says;
      both are serious and neither may be reported without resolution.
    - >-
      chi(-39081) = +1, contradicting the mirror's complete cell, or
      chi(39082) = +1, contradicting the published cofactor 2^2 and RFC 7748's
      printed cofactor 4. Halt and escalate.
    - >-
      Any 4-isogenous toy pair disagreeing on the group order. The isogeny
      implementation is wrong; the type census is void.
    - >-
      No 4-isogenous toy pair disagreeing on the 2-Sylow type across an
      exhaustive census. This is NOT a failure of the proposal - it is an
      informative outcome meaning 4-isogeny preserves the type more reliably
      than assumed, and it would LOOSEN the transfer rule this record
      proposes. It must be reported as such and not suppressed.
    - >-
      The exceptional-set size is not 2 on every complete toy curve. C1 is
      refuted as stated and the audit that five sibling records depend on has
      not been performed.
    - >-
      Any disagreement between the two Legendre implementations or the two
      inversion routines. Implementation failure; nothing is reported.

  confounders:
    - >-
      THE NAME IN THE CRITERION TABLE IS NOT THE CURVE THE CRITERION IS ABOUT.
      SafeCurves' ladder row reads "Ed448-Goldilocks", which RFC 7748
      identifies as edwards448, while the standardised ladder runs on
      curve448. Whether SafeCurves intended the row to cover the isogeny class
      or the specific curve is NOT determined by anything retrieved here, and
      the record must state that ambiguity rather than resolve it. C3's
      dependence claim is about the two CURVES and is correct either way; a
      claim about what the CELL means is not licensed.
    - >-
      ORDER EQUALITY IS NOT STRUCTURE EQUALITY. RFC 7748 prints the same order
      and cofactor 4 for all three curves, which many readers will take as
      meaning the groups are the same. They are the same SIZE. Two of the
      three are isomorphic and the third need not be, and conflating the two
      is precisely the error the record exists to prevent.
    - >-
      COFACTOR 4 DOES NOT PIN THE TYPE UNIQUELY IN GENERAL, THOUGH IT NEARLY
      DOES HERE. A group of order 4 times an odd prime with a cyclic 2-Sylow
      is Z/4 times the odd part; with a non-cyclic 2-Sylow it is
      (Z/2)^2 times the odd part. So on these specific curves the type is
      determined by one Legendre symbol, which weakens the toy census's direct
      relevance to this row while leaving the general transfer question - and
      hence the value to the other nineteen rows - untouched. That asymmetry
      must be stated, because a reader could otherwise take a toy
      disagreement as evidence about Ed448 specifically, which it is not.
    - >-
      THE GOLDEN-RATIO IDENTITY IS ABOUT THE FIELD, NOT THE CURVE. It
      certifies chi(5) = +1 and correct modular arithmetic and says nothing
      whatever about the group, the cofactor, or any criterion. It is a
      self-test, and presenting it as a structural finding about
      Ed448-Goldilocks would be an overstatement.
    - >-
      sqrt(156324) IS TWO SQUARE ROOTS. The RFC's birational maps are defined
      up to the choice of root, and the two choices give maps differing by a
      sign. An implementation that fixes different roots in the forward and
      inverse maps will find the composition is not the identity and may
      report a spurious exceptional point; the root choice must be fixed once
      and recorded.
    - >-
      THE MIRROR AND THE RFC COPY ARE BOTH REPOSITORY SNAPSHOTS. Neither is a
      live retrieval, both have recorded hashes, and the mirror's own addendum
      documents a defect in one derived view. Agreement with them is agreement
      with those snapshots.

  interpretation_limits:
    - >-
      NOTHING HERE IS A SECURITY STATEMENT. The question record's claim
      boundaries state that a failure of ladder availability or completeness
      is not by itself an ECDLP break, and no safety or vulnerability
      conclusion is authorised. A criterion dependence and a conversion audit
      are statements about the audit's own instruments.
    - >-
      C1, C4 and C5 are proved; C2's factual premise is retrieved from RFC
      7748 and its transfer statement is half theorem and half empirical
      measurement; C3 is an exact identity plus an implication whose
      hypothesis is checked by symbol.
    - >-
      THE ISOGENY CENSUS IS VALIDATED AT 13 TO 20 BITS AND ITS CONCLUSION IS
      A RULE ABOUT INSTRUMENTS, NOT ABOUT Ed448. That rule is what five
      sibling records need; the 448-bit statements in this record rest on
      symbols and identities, not on the census.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) C1's
      EXCEPTIONAL-SET AUDIT transfers FULLY to all six Edwards rows and is the
      audit IDEA-20260829-d052e6's transfer limit (c) requires before its
      Montgomery instrument may be applied to any of them; that is its
      principal family value. (b) THE ISOGENY-VERSUS-BIRATIONAL RULE transfers
      to every row and to every future model conversion in this campaign,
      including the Weierstrass conversions the nine non-complete rows would
      need. (c) C3's SPECIFIC IDENTITY transfers to NO other row, since no
      other row's standard prints three curves in one isogeny class; the
      METHOD of deriving a printed constant from a small one transfers to
      Curve25519, whose RFC 7748 section prints both a Montgomery A and an
      Edwards d for birationally equivalent curves. (d) C4's IDENTITY
      transfers to NO other row in the family, since no other modulus has the
      golden-ratio shape; the IDEA of a modulus-shaped full-size self-test
      transfers wherever such an identity exists and should be sought for each
      prime. (e) C5 is a comparison with exactly one other row,
      IDEA-20260829-512415's E-521.
    - >-
      C3 shows two criterion cells share one bit. It does not show either cell
      is wrong, does not criticise SafeCurves, and does not reduce the value
      of either criterion as a design requirement; it reduces the INFORMATION
      CONTENT of the published table by one bit on one row, which is a
      statement about the table.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Over a prime field F_p, a 4-isogeny between elliptic curves preserves
        the group ORDER exactly but changes the 2-Sylow ISOMORPHISM TYPE with
        probability bounded away from zero as p grows; formally, the fraction
        of 4-isogenous pairs with differing 2-Sylow type tends to a limit
        strictly between 0 and 1.
      rigorous_support: >-
        The ORDER half is a theorem, not a heuristic - isogenous curves over
        F_p have equal numbers of rational points, by Tate's theorem, and this
        record does not assume it but states it as a proof obligation and
        checks it. The TYPE half is genuinely heuristic. Its rigorous
        neighbour is the standard fact that an isogeny of degree 4 with kernel
        contained in E[2] or E[4] changes the 2-power structure in a way
        determined by the kernel, so the type is preserved exactly when the
        kernel meets the 2-Sylow in a prescribed way; the classical
        distribution statement being imitated is the Cohen-Lenstra and
        Gekeler-style heuristic that group structures within an isogeny class
        are distributed according to their automorphism-weighted counts. That
        heuristic is easier to state than to prove and the difficulty is
        recorded here rather than hidden.
      validation_plan: >-
        SAMPLING - an EXHAUSTIVE census at three small primes near 2^13 to
        2^15, over every curve and every 4-isogeny computable from the RFC's
        printed maps generalised, which is a complete population and not a
        sample; parameters and prime list recorded. COMPARISON DISTRIBUTION -
        the measured type-change fraction against the automorphism-weighted
        prediction computed independently from the curves' actual group
        structures, which is available at toy scale because the structures are
        computed directly. TAIL CHECK - the census must include curves whose
        2-Sylow has order 4, 8 and 16, since a type change is possible only
        when there is enough 2-power structure to change, and a census
        dominated by order-4 2-Sylows would find few changes for a trivial
        reason. TRANSFER - the measured fraction is NOT transferred to 448
        bits and no claim is made about it there; what transfers is the
        QUALITATIVE rule that a chain instrument must not be transported
        across an isogeny, and that rule needs only one counterexample.
    - id: H2
      statement: >-
        The repository copies inputs/SAFECURVES-20260825/specs/rfc7748.txt and
        the mirror tables faithfully reproduce RFC 7748 and the SafeCurves
        pages as published.
      rigorous_support: >-
        NONE as to fidelity to the published documents, and the record says
        so. What IS available is unusually strong for this kind of assumption
        and is INTERNAL TO THE DATA - C3 predicts that a 135-digit constant
        printed in the RFC equals a ratio of two four-digit constants printed
        elsewhere in the same RFC, and C4 predicts an identity that depends
        only on the modulus. If those hold, the RFC copy is internally
        consistent to about 448 bits at two independent points, which a
        corrupted copy would be very unlikely to be. That is a genuine
        self-validation and it is the reason C3 is worth running even though
        it establishes nothing about any curve.
      validation_plan: >-
        PARTIAL AND INDIRECT. (i) Recompute every mirror file's sha256 against
        source_record_addendum_01.yaml. (ii) Run C3 and C4 and treat their
        success as the internal-consistency evidence described above,
        reporting explicitly that it is evidence about the COPY and not about
        the source. (iii) Attempt one live fetch of the RFC and of
        safecurves.cr.yp.to and record the outcome whatever it is; a success
        settles H2 outright, and a failure is an operational observation and
        never mathematical evidence, per AGENTS.md rule 3. (iv) Cross-check
        the cofactor 4 printed in the RFC against the 2^2 printed in the
        mirror's twist table - two different documents, one value, and
        agreement is one bit of cross-source corroboration that costs nothing.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. Audit cost, itemised. C1, C4's derivation
      and C5 are zero compute. C4's verification is ONE modular squaring at
      448 bits, O(log^2 p) bit operations, microseconds. C3 is one modular
      inversion, O(log^2 p) with extended Euclid, plus one comparison. The
      symbol chain is three modular exponentiations, O(log^3 p) bit
      operations, microseconds. The toy isogeny census is O(p) per curve for
      point counting and O(p) curves per prime, so O(p^2) per prime - at
      p near 2^15 about 10^9 elementary steps, minutes across the 14 cores and
      the only nontrivial compute here. Verification of every full-size claim
      by a second implementation is at most three exponentiations - succinct.
    memory_exponent: >-
      O(log p) working memory for every full-size step; the toy census needs
      O(p) storage for a point list per curve, which at p near 2^15 is
      megabytes. Neither the 48 GB envelope nor the 14 cores is a binding
      constraint, though the cores materially shorten the census.
    best_known: >-
      For the exceptional set of a birational map, the best known method is to
      read where the map is undefined, which is what C1 does, so this TIES the
      best known and claims no advance. For the isogeny transfer question, no
      incumbent inside this program exists - the question has been named as a
      caveat and never measured. For the RFC constant, the best known method
      is to read it, which dominates C3 absolutely on cost; C3's value is that
      it BINDS two printed constants rather than that it produces one. Against
      the ECDLP attack frontier - KN-TECH-001, KN-TECH-006, KN-TECH-018,
      KN-TECH-031, KN-TECH-032, KN-TECH-033, KN-TECH-035 - this record is
      dominated by every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. The honest hidden costs are three.
      (i) The toy isogeny census's conclusion is qualitative and its measured
      fraction does not transfer to 448 bits, which is stated but is easy for
      a reader to forget. (ii) The square-root ambiguity in the RFC's maps
      means the implementation has a free choice that must be fixed and
      recorded, and a wrong fix produces a spurious exceptional point that
      looks like a finding. (iii) C4 tests the arithmetic layer only and
      cannot detect a defect in the curve arithmetic built on top of it.
    tradeoff_note: >-
      The tradeoff is between AUDITING A CONVERSION and AVOIDING ONE.
      IDEA-20260829-b41d39 avoids the conversion entirely by working in the
      Edwards model, at the cost of needing a fresh derivation per model;
      IDEA-20260829-d052e6 converts, at the cost of an unaudited step. This
      record makes the second option legitimate by paying the audit cost once,
      which is minutes of toy compute and a page of analysis, after which
      either route is available. That is the only sense in which it buys
      anything computational. There is no time-memory tradeoff and
      parallelisation matters only for the census.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW; `null` is not asserted. AS AN ATTACK
    it is dominated by rho (KN-TECH-001, KN-TECH-006), automorphism-discounted
    rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck
    (KN-TECH-032) and the trace-one transfer (KN-TECH-033) simultaneously on
    time, memory and data, because it is not an attack. AS A SOURCE OF ANY
    PUBLISHED VALUE it is dominated absolutely by RFC 7748 and by the
    SafeCurves mirror, both of which print the values for free and both of
    which are the objects under test. AS A COMPLETENESS OR COFACTOR TEST it is
    dominated by IDEA-20260829-b41d39, whose symbols it reuses rather than
    improves. AS A MODEL-CONVERSION AUDIT it is not dominated by any incumbent
    located - IDEA-20260829-d052e6 names the audit as a required dependency
    and does not perform it, IDEA-20260829-e37b52 inherits the same gap, and
    no external tool producing an exceptional-set census or an
    isogeny-transfer rule has been identified. AS A FULL-SIZE ARITHMETIC
    SELF-TEST, C4 is not dominated by anything in this batch, because every
    other record's full-size validation is either cross-implementation
    agreement or consistency with a transcription, and C4 is neither - it is
    agreement with a fact that follows from the modulus alone. Both
    non-dominations are narrow and are stated narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. AS DEPENDENCY
    CLOSURE, WHICH IS THE PRINCIPAL DELTA - IDEA-20260829-d052e6 states three
    times that its instrument does not transfer through an unaudited
    birational map and that the six Edwards rows therefore need an audit
    nobody has done; this record does that audit, so a blocking dependency for
    five sibling records and for the family's whole cross-model lane moves
    from open to closed at a cost of minutes. AS A NEW DISTINCTION - the
    program currently treats "convert the model" as one operation; this record
    splits it into birational equivalence, where both order and structure
    transfer but the map omits exactly the 2-torsion, and isogeny, where order
    transfers and structure need not, and supplies a per-instrument rule. That
    distinction does not exist anywhere in the corpus. AS VALIDATION QUALITY -
    every record in this batch carries the heuristic that an instrument
    validated at 13 to 20 bits is correct at cryptographic size with no
    rigorous support; C4 supplies the batch's only full-size test against a
    fact that was not transcribed, at a cost of one squaring, which is a small
    but genuine strengthening of a weakness every sibling record shares. AS
    INFORMATION STRUCTURE - two SafeCurves cells on two 4-isogenous curves are
    shown to reduce to one Legendre symbol, adding a second measured unit of
    criterion redundancy to the one IDEA-20260829-0daedf finds on Curve1174,
    against a corpus that currently holds zero.
  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is a few hundred lines - the birational and 4-isogeny
      maps with a fixed square-root convention, an exceptional-set counter, a
      2-Sylow type detector by counting solutions of 2^k P = O, and a toy
      census driver reusing IDEA-20260829-b41d39's point counter. Compute is
      microseconds for every full-size claim and minutes for the toy censuses
      across 14 cores. No network access is required, since RFC 7748 and the
      SafeCurves pages are both already in the repository.
  recommended_priority: high

