idea:
  id: IDEA-20260829-9954bc
  question_id: RQ-SCURVE-4c75e3
  goal_id: GOAL-SCURVE-15e805
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    ISOGENOUS IS NOT BIRATIONAL - Ed448-Goldilocks is the one SafeCurves row
    whose `ladder` cell and whose `complete` cell describe DIFFERENT CURVES,
    because RFC 7748's curve448 is 4-isogenous and not birationally
    equivalent to edwards448; audit the exceptional set of the birational map,
    which is exactly the rational 2-torsion, separate the instruments that
    survive a 4-isogeny from those that do not, derive RFC 7748's own
    135-digit Edwards parameter from two four-digit integers, and certify
    sqrt(5) = 2^225 - 1 exactly from the golden-ratio shape of the prime
  class: control

  claim: >-
    Ed448-Goldilocks is x^2 + y^2 = 1 - 39081 x^2 y^2 over
    p = 2^448 - 2^224 - 1. Five separable sub-claims, four of them anchored on
    text retrieved from a repository copy of RFC 7748 and one on the mirror's
    rigidity page.

    (C1) THE BIRATIONAL EXCEPTIONAL SET IS EXACTLY THE RATIONAL 2-TORSION.
    RIGOROUS, ZERO COMPUTE. RFC 7748 section 4.2 prints the birational maps
    between a Montgomery curve and an Edwards curve as
    (u, v) = ((y - 1)/(y + 1), sqrt(156324) u/x) and
    (x, y) = (sqrt(156324) u/v, (1 + u)/(1 - u)). The first is undefined
    exactly at y = -1 and at x = 0. On an Edwards curve x^2 + y^2 =
    1 + d x^2 y^2 with d a non-square, the rational points with x = 0 are
    (0, 1) and (0, -1) and there is no other rational point with y = -1;
    (0, 1) is the neutral element and (0, -1) is the unique rational point of
    order 2. SO THE EXCEPTIONAL SET OF THE CONVERSION IS PRECISELY E[2](F_p),
    which is precisely the subgroup that every 2-adic instrument in this batch
    tracks. That is not a coincidence to be noted and moved past - it is the
    exact reason IDEA-20260829-d052e6's transfer limit (c) says its
    Montgomery instrument does not transfer through an unaudited birational
    map to the Edwards rows, and it is the strongest available argument for
    IDEA-20260829-b41d39's decision to work in the Edwards model natively
    instead.

    (C2) ISOGENOUS IS NOT BIRATIONAL, AND ONLY SOME INSTRUMENTS SURVIVE THE
    DIFFERENCE. RFC 7748 section 4.2 states, verbatim, that curve448 with
    A = 156326 "is birationally equivalent to the Edwards curve" with a
    printed 135-digit d, and that "Both of those curves are also 4-isogenous
    to the following Edwards curve ... called edwards448" with d = -39081. It
    prints the same order and cofactor 4 for all three. THE SAFECURVES ROW IS
    edwards448; THE STANDARDISED MONTGOMERY LADDER CURVE IS curve448; AND THEY
    ARE 4-ISOGENOUS, NOT BIRATIONALLY EQUIVALENT. An F_p-isogeny preserves the
    group ORDER and therefore v_2(#E), so a valuation instrument transfers
    across it; it does NOT in general preserve the group STRUCTURE, so a
    halving-chain instrument does not. PREDICTED AND TESTABLE - at toy scale,
    4-isogenous pairs will always agree on the order and will SOMETIMES
    disagree on the 2-Sylow isomorphism type, and the fraction that disagree
    is a measurement this program has never made.

    (C3) A 135-DIGIT PUBLISHED CONSTANT IS DERIVABLE FROM TWO FOUR-DIGIT
    ONES, AND THE DERIVATION LINKS TWO SAFECURVES CRITERIA ACROSS THE ISOGENY.
    Inverting A = 2(1 + d)/(1 - d) gives d = (A - 2)/(A + 2), so the Edwards
    parameter birationally equivalent to curve448 is
    156324/156328 = 39081/39082 mod p. RFC 7748 also records
    a24 = (156326 - 2)/4 = 39081 for curve448/X448, and 39081 is exactly the
    absolute value of edwards448's d, while 39082 = 1 - d. THEREFORE
    d_birational = -d_Goldilocks/(1 - d_Goldilocks), an exact identity between
    the 135-digit printed constant and two four-digit integers, checkable by
    ONE modular inversion at 448 bits. ITS CONSEQUENCE IS THE INTERESTING
    PART. By IDEA-20260829-b41d39's C1, chi(A^2 - 4) = chi(d_birational)
    = chi(-1) chi(d_Goldilocks) chi(1 - d_Goldilocks); with p = 3 mod 4, which
    RFC 7748 states verbatim, and with edwards448 complete so that
    chi(d_Goldilocks) = -1, this collapses to
    chi(A^2 - 4) = chi(1 - d_Goldilocks) = chi(39082). The Montgomery ladder's
    completeness on curve448 requires A^2 - 4 to be a non-square, per the
    2006 Bernstein criterion quoted verbatim on SafeCurves' completeness page.
    SO THE `ladder` CELL FOR curve448 AND THE COFACTOR OF edwards448 ARE THE
    SAME LEGENDRE SYMBOL - chi(39082) = -1 forces both. Two SafeCurves cells
    on two 4-isogenous curves reduce to one bit, and the mirror's published
    cofactor 2^2 for Ed448-Goldilocks and its ladder cell True are therefore
    not independent data.

    (C4) THE GOLDEN-RATIO FIELD CERTIFICATE. RIGOROUS, ZERO EXPONENTIATIONS.
    Because p = 2^448 - 2^224 - 1, one has 2^448 = 2^224 + 1 in F_p, so
    phi = 2^224 satisfies phi^2 = phi + 1 and therefore
    (2 phi - 1)^2 = 4 phi^2 - 4 phi + 1 = 4(phi + 1) - 4 phi + 1 = 5.
    SO 2^225 - 1 IS A SQUARE ROOT OF 5 MODULO p, EXACTLY, VERIFIABLE BY ONE
    SQUARING AND NO MODULAR EXPONENTIATION. Two uses. First, chi(5) = +1 for
    this field is established for free, which no other row in the family gets.
    Second and more useful, it is an EXACT 448-BIT ALGEBRAIC IDENTITY THAT ANY
    CORRECT IMPLEMENTATION MUST SATISFY AND THAT REQUIRES NO EXTERNAL DATA
    AT ALL, so it is a full-size self-test for the modulus and the modular
    arithmetic that is independent of every transcription in this campaign.
    That is exactly what heuristic H2 of IDEA-20260829-d052e6 and of every
    sibling record here lacks, and this row is the only place the family
    provides one.

    (C5) THE CONDITIONALITY CONTROL. p + 1 = 2^448 - 2^224 = 2^224(2^224 - 1)
    with 2^224 - 1 odd, so v_2(p + 1) = 224 and s = 225. That is large but the
    Hasse bound permits v_2(#E) up to 449, so the hypothesis of
    IDEA-20260829-b41d39's forcing theorem is NOT vacuous here and the
    matched-cofactor conclusion is CONDITIONAL, unlike E-521's, where s = 522
    exceeds the bound and the conclusion is unconditional. Ed448-Goldilocks is
    therefore the sharp nearby-object control for IDEA-20260829-512415, and an
    implementation that reports both as unconditional has misunderstood which
    hypothesis a Mersenne prime discharges.

  mechanism: >-
    THE TRACKED OBJECT is the PAIR (group order, 2-Sylow isomorphism type) of
    a curve, followed along two different kinds of map - a birational
    equivalence and a 4-isogeny. The point of the object is that its two
    components have DIFFERENT propagation behaviour, and separating them is
    the whole content.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied
    BEFORE any compute.
    WHAT IS DISCARDED. The curve equation, the parameter, the base point, the
    j-invariant, every coordinate, and the entire odd part of the group except
    its order. A 448-bit curve collapses to one integer and one isomorphism
    type from a short list.
    IS IT A CHANGE OF COORDINATES? No. The fibre over a given (order, type)
    pair contains every curve in several isogeny classes with that order, a
    set of size Theta(sqrt(p)) at least by the Hurwitz class-number count, and
    no curve is recoverable from it.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Three
    operations, THREE DIFFERENT ANSWERS, and the differences are the result.
    (i) BIRATIONAL EQUIVALENCE OVER F_p. Both components propagate exactly -
    the curves are isomorphic as groups, so order and type are both preserved.
    But the MAP is undefined on E[2] by C1, so a computation that follows
    individual POINTS through it loses exactly the points the type is about,
    which is why the exceptional set must be audited even though the
    invariants transfer.
    (ii) 4-ISOGENY OVER F_p. The ORDER propagates exactly, by the standard
    fact that an F_p-isogeny preserves the number of rational points. The TYPE
    DOES NOT PROPAGATE IN GENERAL. So the projection is compatible in one
    component and incompatible in the other, and the honest conclusion is that
    the object must be SPLIT - a valuation instrument may be transported
    across the isogeny, a chain instrument may not.
    (iii) QUADRATIC TWISTING. Neither component propagates; what propagates is
    the sum of orders, which is IDEA-20260829-512415's object and not this
    one.
    WHERE THE STRUCTURE DISSOLVES, MEASURED AND STATED. At the 4-isogeny, for
    the type component, and that dissolution is not a defect of the record but
    its subject. The experiment MEASURES how often it dissolves rather than
    assuming it always or never does.

    WHY THIS ROW AND NOT ANOTHER. Every other complete SafeCurves row is
    given, as far as the retrieved material shows, in one model with a
    birationally equivalent partner. Ed448-Goldilocks is the one row where a
    standards document explicitly prints THREE curves with the same order -
    a Montgomery curve, an Edwards curve birationally equivalent to it, and a
    second Edwards curve 4-isogenous to both - and where the SafeCurves row is
    the third while the standardised ladder is the first. That makes it the
    only place in the family where the distinction between isogeny and
    birational equivalence is forced rather than hypothetical, and where the
    audit has a ground truth to check against.

    WHY THE GOLDEN-RATIO CERTIFICATE IS NOT DECORATION. Every record in this
    batch carries a heuristic of the form "an instrument validated at 13 to 20
    bits is correct at cryptographic size", and every one of them says it has
    no rigorous support. The available mitigations are cross-implementation
    agreement and consistency with transcribed values, neither of which is a
    full-size test against a KNOWN TRUTH. C4 supplies exactly that - an exact
    identity at 448 bits whose truth follows from the shape of the modulus and
    from nothing else, so an implementation that fails it is wrong and an
    implementation that passes it has demonstrated correct 448-bit modular
    arithmetic against a fact no one transcribed. It is one test, it covers
    only the arithmetic layer, and it is still the only one of its kind in
    this campaign.

    EXECUTION. Step 1, zero compute - write out C1, C4 and C5. Step 2, one
    squaring - verify (2^225 - 1)^2 = 5 mod p. Step 3, one modular inversion -
    compute 39081/39082 mod p and compare against RFC 7748's printed 135-digit
    d, digit for digit. Step 4, symbols - compute chi(-39081), chi(39082), and
    chi(A^2 - 4) for A = 156326, and check the C3 chain closes. Step 5, the
    TOY ISOGENY CENSUS - at small p, enumerate curves, compute 4-isogenous
    partners by the RFC's printed maps, and compare orders and 2-Sylow types.
    Step 6, the EXCEPTIONAL-SET CENSUS - at small p, verify that the
    birational map is a bijection off E[2] and that the two missing points are
    exactly E[2].

  novelty_status: unverified
  novelty_rationale: >-
    Every ingredient is standard - the exceptional set of the Edwards to
    Montgomery map, the invariance of point count under isogeny, the
    inversion d = (A - 2)/(A + 2), and the golden-ratio identity are all
    routine, and the honest mathematical label is `known`. The 4-isogeny
    relationship is stated verbatim in RFC 7748, which I read from a
    repository copy, so C2's central factual premise is retrieved rather than
    conjectured. NO EXTERNAL PAPER WAS OPENED IN THIS SESSION - the RFC text
    is a repository file, not a live fetch, and a live fetch of
    safecurves.cr.yp.to failed - so per agents/idea-generator.md the label is
    `unverified`. What is asserted as absent is confined to this program - no
    record anywhere audits a model conversion, distinguishes isogeny from
    birational equivalence for instrument transfer, or notes any identity
    special to this prime.
