idea:
  id: IDEA-20260829-bba3a8
  question_id: RQ-SCURVE-960dbd
  goal_id: GOAL-SCURVE-137bd9
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE SEED-DERIVATION CERTIFICATE AND THE VERIFIABILITY-COVERAGE COUNT -
    re-execute NIST SP 800-186 C.3.2 on P-224's published seed and emit a
    re-verifiable certificate binding seed to coefficient, then MEASURE, rather
    than assert, how many of the seven published quantities that verification
    actually binds. The answer is predicted to be exactly one, and that number is
    the honest content of the word "manipulatable".
  class: measurement

  claim: >-
    THE CAMPAIGN'S RIGIDITY LANE IS CURRENTLY A TRANSCRIPTION. The archived audit
    plan's lane L8-RIGID re-executes a generation rule for Curve25519 and records
    a closure - rigidity is a property of the design process, the counterfactual
    is not a computable object. That closure is correct and this record does NOT
    dispute it. What the closure does not license is the further step, taken
    nowhere yet and possible here, of MEASURING what the published verification
    procedure does bind. Four separable sub-claims of decreasing rigour.

    (C1) EXECUTABLE, DETERMINISTIC, NO HEURISTIC. NIST SP 800-186 section C.3.2
    specifies a total deterministic function from a 160-bit seed s and the field
    bit length l to an integer c, and a single verification predicate on the
    curve coefficient b. For P-224, l = 224, hdigest = 160, so
    v = floor((l - 1)/hdigest) = floor(223/160) = 1 and
    w = l - hdigest*v - 1 = 224 - 160 - 1 = 63. Hence c is the concatenation of
    the 63 rightmost bits of SHA-1(s) with SHA-1(s + 1 mod 2^160), and c has
    exactly 63 + 160 = 223 bits. TWO INDEPENDENT ROUTES TO c EXIST AND ARE NOT
    CURRENTLY COMPARED. Route A recomputes c from the published seed by two SHA-1
    calls. Route B reads the c that SP 800-186 publishes alongside the seed. They
    share only the document, not the computation.

    (C2) THE BINDING PREDICATE, WITH ITS SIGN AMBIGUITY DISCLOSED. The extracted
    text of SP 800-186 C.3.2 step 7 reads "Verify that b2 c { 27 mod p", where
    "{" is a mangled congruence sign and the sign of 27 is lost in extraction.
    Generation step 9 reads "c b2 { a3 mod p" with the note that the pseudorandom
    prime curves all have a = -3, and a^3 = -27. THE RECORD THEREFORE PREDICTS
    b^2 * c congruent to MINUS 27 modulo p, and treats the alternative +27 as a
    live second hypothesis that the executor settles by computing both. This is a
    genuine two-outcome test on a load-bearing detail, decided in microseconds,
    and it is exactly the kind of thing a transcription cannot decide.

    (C3) VERIFIABILITY COVERAGE, THE RECORD'S PRINCIPAL NEW NUMBER. The P-224
    intake tuple publishes seven quantities: p, a, b, Gx, Gy, n, h. The C.3.2
    predicate takes p, b and s as inputs and constrains exactly one of them, b.
    It says nothing about the prime p, nothing about a = -3 (which is a free
    choice explicitly permitted by generation step 9), nothing about the base
    point, and nothing about the group order. PREDICTED COVERAGE 1 OF 7. This is
    not rhetoric; it is a count over a specified predicate and it is falsifiable -
    if some other clause of SP 800-186 binds a second quantity to the seed, the
    count is 2 or more and the prediction is wrong.

    (C4) THE ENTROPY BOUND, RIGOROUS AND SEPARATE FROM ANY SEARCH-COST CLAIM. The
    seed space has exactly 2^160 elements. Therefore the set of b values reachable
    by the P-224 procedure has size at most 2^160, out of the roughly 2^224
    elements of F_p, so the reachable fraction is at most 2^{-64}. Sharper: c
    determines b only through b^2 congruent -27/c, which has a solution iff
    -27/c is a quadratic residue, so at most 2^161 values of b are reachable
    counting both square roots. NO STATEMENT ABOUT DESIGNER INTENT FOLLOWS FROM
    THIS AND NONE IS MADE.

  mechanism: >-
    THE TRACKED OBJECT is the DERIVATION-CHAIN RESIDUE of the curve: the single
    field element r(s, b, p) = b^2 * c(s, l) + 27 mod p, together with the
    Boolean r = 0. Everything else about the curve is discarded.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied BEFORE
    any compute, which is the point of the test.
    WHAT IS DISCARDED. A 224-bit prime, a 224-bit coefficient, a 160-bit seed and
    a 223-bit intermediate - roughly 830 bits - collapse to ONE BIT. The base
    point, the group order, the trace, the j-invariant and the entire group
    structure are discarded outright.
    IS IT A CHANGE OF COORDINATES? No. From the bit r = 0 nothing whatever is
    recoverable: the fibre over r = 0 contains, for each of the 2^160 seeds, every
    (p, b) pair satisfying the congruence, and the fibre over r != 0 is
    essentially everything else. This is the opposite of the (Delta, Pi) example
    of KN-LIT-7595, where the discarded pair was recoverable as roots of a
    quadratic.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Three
    operations, three answers, all deterministic and all checkable.
    (i) SEED INCREMENT s -> s + 1. c(s + 1) is a deterministic function of two
    SHA-1 evaluations, one of which, SHA-1(s + 1), is already computed for c(s).
    The residue therefore propagates deterministically along the seed chain at
    amortised one hash per step. (ii) COEFFICIENT NEGATION b -> -b. r is
    INVARIANT, because b appears squared. This is a genuine and useful loss: the
    predicate cannot distinguish a curve from its quadratic twist by -1, and that
    is disclosed here rather than discovered later. (iii) CHANGE OF a. The
    predicate is stated for a = -3; for general a the generation rule gives
    c b^2 congruent a^3, so the residue's constant changes and the object must be
    re-parameterised. The instrument must therefore CHECK a = -3 before firing,
    not assume it. THE RETAINED PART PROPAGATES DETERMINISTICALLY UNDER ALL
    THREE. PASSES.
    WHERE THE STRUCTURE DISSOLVES. At any curve with no published seed. For
    ANSSI FRP256v1 the object is undefined, not false, and the instrument must
    REFUSE rather than return a Boolean. That refusal is the boundary and it is
    measured, not assumed.

    WHY THIS IS NOT THE ARCHIVED PLAN'S LANE L8-RIGID. L8 re-executes RFC 7748's
    MINIMALITY rules for a fully rigid Montgomery curve, where the generation rule
    has no unexplained input at all and the audit question is "is A the smallest
    admissible value". This record audits a HASH-DERIVATION rule with a 160-bit
    unexplained input, where minimality is not even claimed and the audit question
    is "does the published seed actually produce the published coefficient, and
    what else does it produce". The two lanes share a criterion name and nothing
    else: L8's obstruction is a point-counting budget over ~121663 candidates,
    this record's obstruction is nil because the predicate is two hashes and one
    modular multiplication.

    WHY IT IS NOT IDEA-20260829-e37b52's LATTICE. That record binds five ORDER
    quantities by the Hasse-twist identity and never touches the seed. Its five
    fields and this record's three overlap in none. The two are complementary and
    the combined coverage count is the union, which the executor should publish.

    EXECUTION. Step 1, read the seed and c verbatim from the frozen package
    inputs/SAFECURVES-20260825/specs/sp800-186.txt and from
    inputs/SAFECURVES-20260825/specs/sec2-v1.txt, recording the two transcriptions
    separately and comparing them as integers. Step 2, implement C.3.1/C.3.2
    exactly as written, parameterised by (l, hdigest, HASH) so the same code
    serves P-256 and P-384. Step 3, run Route A and compare to Route B. Step 4,
    evaluate the predicate for BOTH signs. Step 5, run the null and refusal
    controls. Step 6, emit the certificate and the coverage count.

  novelty_status: unverified
  novelty_rationale: >-
    The mathematics is nil and the procedure is a published standard, so the
    honest mathematical label is `known`. What is claimed new is confined to this
    program: the corpus screen below finds no execution of the NIST seed
    verification anywhere in this repository, and no coverage count for any curve.
    The label is `unverified` and NOT `adaptation` because NO WEB SEARCH WAS
    PERFORMED IN THIS SESSION. Primary sources were read only as frozen local
    copies inside the repository, which is `internal` provenance, and the
    literature on curve-standard manipulation (BADA55 and successors) was not
    read in full. Per agents/idea-generator.md that forces the weaker label
    regardless of how routine the content is.
  novelty_screen:
    method: >-
      Run 2026-08-29 in this session. Grep over knowledge/ for
      "rigid|rigidity|seed|SHA-1|Brainpool|ANSSI|FRP256|verifiably random|
      P-224|P-256|P-384" case-insensitive (60-file cap hit); grep over ledger/
      for "rigid|Brainpool|ANSSI|FRP256|verifiably random"; grep over
      ledger/proposals/IDEA-2026082*.yaml for question_id/title/class. Full reads
      of RQ-SCURVE-960dbd, the intake blocks of the other five questions, all
      four prior SafeCurves proposals (IDEA-20260829-d052e6, e37b52, f5bcff,
      f89a3a), the L8-RIGID lane and the closures block of the archived audit
      plan, inputs/SAFECURVES-20260825/pages/rigid.txt in full, and SP 800-186
      C.3.1/C.3.2 in full.
    results: >-
      ledger/hypotheses/ contains no SafeCurves record. The only SafeCurves
      proposals in the ledger are the four filed earlier today against
      RQ-SCURVE-d9b7d2, all of which target Curve25519 and none of which touches
      a hash-derived seed; the other IDEA-20260829-* records belong to unrelated
      questions (RQ-ECQ, RQ-ALISO, RQ-ECDLP, RQ-MLKEM, RQ-MLDSA). The knowledge
      corpus holds KN-LIT-4290 (BADA55 white paper) at confidence `reported` with
      an explicit note that it was generated from the first two pages of a local
      PDF, and holds no seed, no c value and no verification procedure for any
      NIST curve. The repository therefore contains no execution of this
      procedure and no coverage count.

