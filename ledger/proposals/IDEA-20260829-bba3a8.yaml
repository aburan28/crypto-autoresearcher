  assumptions:
    - >-
      The executor session has a shell and a Python 3 interpreter with hashlib
      and arbitrary-precision integers. THIS IS THE ASSUMPTION THE ARCHIVED BATCH
      COULD NOT MAKE - its producer had no shell and performed no arithmetic, so
      every numeric relation in its dossier is a transcription plus a pending
      check. This environment has 14 cores and 48 GB and the whole of this
      proposal runs in under a second on one of them.
    - >-
      No point-counting backend is assumed and none is needed. Nothing in this
      record requires #E.
    - >-
      Parameters enter ONLY from the frozen package at
      inputs/SAFECURVES-20260825/, with the file path and byte offset recorded
      per field, and are cross-compared against the RQ intake tuple. No parameter
      is typed from memory.
    - >-
      hashlib.sha1 is the reference SHA-1. It is cross-checked against the
      published SHA-1 test vector for the empty string and for "abc" before any
      curve datum is processed; a hash library that fails those voids everything.
    - >-
      Scope is prime fields and short Weierstrass curves with a = -3. The binary
      case of SP 800-186 C.3.3 is out of scope and the instrument must refuse it.

  proof_search_map:
    bottleneck: >-
      That the `rigid` criterion cell for P-224 is an intake Boolean with no
      computation behind it anywhere in this repository, and that the archived
      plan's only rigidity lane is written for a MINIMALITY rule and does not
      apply to a hash-derivation rule at all. Removing this bottleneck changes no
      cost and no theorem; it changes whether the campaign's rigidity row is a
      transcription or a certificate.
    baseline_embedding:
      parameter_slice: >-
        With v = 0 - that is, for a hypothetical curve with l - 1 <= 160 - the
        procedure degenerates to a single SHA-1 truncation and the whole chain
        collapses to c = (l-1 rightmost bits of SHA-1(s)). The implementation must
        reproduce that degenerate case exactly, and must reproduce SP 800-186's
        OWN published c for P-224 bit for bit. Reproducing the document's c is
        the baseline embedding: the document is the incumbent and its number is
        the fixture.
      reproduction_check: >-
        A frozen regression fixture asserting integer equality between Route A's
        recomputed c and Route B's transcribed c for P-224, run before the
        predicate is evaluated at all. Plus the two published SHA-1 test vectors
        as a library check. Plus a bit-length assertion, c has exactly 223 bits,
        which is derivable from v and w before any hashing and is therefore a
        pre-registered prediction rather than a post-hoc observation.
    observation_collision:
      observable: >-
        The residue bit r = 0, i.e. "b^2 c + 27 congruent 0 mod p". This single
        bit is the entire certificate, so its identifiability must be attacked
        first.
      distinct_preimage_search: >-
        REQUIRED, AND COLLISIONS PROVABLY EXIST IN TWO DISTINCT WAYS, BOTH OF
        WHICH BOUND THE CLAIM. (i) SIGN COLLISION - b and -b give the same
        residue, so the certificate cannot distinguish the curve from its
        quadratic twist by -1. Since P-224's p is congruent to 1 mod 4 (predicted;
        p = 2^224 - 2^96 + 1 so p - 1 = 2^224 - 2^96 is divisible by 4), -1 is a
        square and the two are isomorphic, so the collision is HARMLESS HERE and
        the record says why rather than ignoring it. (ii) SEED COLLISION - the map
        s -> c is from 2^160 seeds into 2^223 values, so it is expected injective,
        but the map (s, p) -> r is massively non-injective: for each p, roughly
        half of all seeds yield a c for which -27/c is a residue, hence a
        reachable b. THE CONSEQUENCE THAT MUST BE WRITTEN INTO THE DELIVERABLE -
        a passing certificate proves that THIS seed produces THIS b; it does not
        prove that no other seed does, and it says nothing about which came first.
        The record pre-commits to never writing the second statement.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the unanswerable question "was P-224 generated honestly" by the
          answerable question "does the published seed reproduce the published
          coefficient under the published predicate, and how many published
          quantities does that predicate constrain".
        predicted_gain: >-
          Converts a criterion cell that this program has recorded as
          non-computable into TWO computable outputs - a re-verifiable certificate
          and an integer coverage count out of seven - at a cost of two SHA-1
          calls. Encoding, completeness and soundness obligations are listed
          separately below; the soundness obligation is carried by the certificate
          and by the perturbed-seed null, not by the derivation.
      - transform: observable_fiber
        proposed_object: >-
          Hold the residue bit fixed at r = 0 and vary the forgotten structure -
          the seed, the base point, the group order - to exhibit the fibre and
          thereby MEASURE the coverage rather than argue it.
        predicted_gain: >-
          A defensible integer, 1 of 7, replacing the adjective "manipulatable".
          The fibre exhibition is constructive: for a fixed p and b one can
          display curves with the same r and different base points, which is the
          direct demonstration that the seed binds no base point.
    quantifier_order: >-
      C1 and C2 are claimed FOR THE SPECIFIC INSTANCE, EXISTENTIALLY IN THE
      CERTIFICATE. FOR THE published P-224 tuple THERE EXISTS a transcript, namely
      the two SHA-1 outputs and the assembled c, such that b^2 c + 27 congruent 0
      mod p, exhibited and re-verifiable in two hashes. C4 is claimed UNIFORMLY
      AND RIGOROUSLY: FOR ALL seeds s in the 2^160-element space, the resulting b
      lies in a set of size at most 2^161, hence for ALL b outside that set no
      seed exists. NOT CLAIMED, and the difference is the whole limitation: FOR
      ALL rules R' consistent with the published pair, R' was fixed before P. The
      witness order between R and P is not observable and the record does not
      pretend otherwise.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The published P-224 seed, run through SP 800-186 C.3.2, yields a c
        matching the document's published c, and that c satisfies
        b^2 c congruent -27 mod p for the published b and p; the predicate
        constrains 1 of the 7 published quantities; and at most 2^161 of the
        roughly 2^224 possible b are reachable by any seed." IT CERTIFIES NOTHING
        about whether the seed was chosen before or after b, nothing about whether
        a search was performed, nothing about the base point or the order, and
        nothing whatsoever about the ECDLP on P-224.
      nearby_object_control: >-
        THE SHARPEST NEARBY OBJECT IS A SEED OFF BY ONE. Run the identical
        predicate on s + 1 and on s - 1 - same length, same document, same code
        path, one bit of difference in the input integer - and require FAILURE.
        A predicate that passes for a neighbouring seed is measuring nothing.
        SECOND NEARBY OBJECT, AND IT IS THE ONE THAT ISOLATES THE LOAD-BEARING
        STRUCTURE: brainpoolP256t1, which HAS a published seed but a DIFFERENT
        derivation (find_integer_2 with w = l - 160v - 1 feeding A directly rather
        than through b^2 c congruent a^3). The NIST predicate must FAIL on it. A
        method that cannot distinguish the NIST derivation from the Brainpool
        derivation has not identified which rule it is testing. THIRD - ANSSI
        FRP256v1, which has no seed at all; the instrument must REFUSE, not
        return false.
    proof_obligations:
      - claim: >-
          v = 1 and w = 63 for l = 224 and hdigest = 160, hence c has exactly 223
          bits, and the published c has exactly 223 bits.
        responsibility: size
      - claim: >-
          Route A's recomputed c equals Route B's transcribed c as integers.
        responsibility: baseline
      - claim: >-
          Exactly one of b^2 c congruent +27 and b^2 c congruent -27 mod p holds,
          and it is the one implied by a = -3 in generation step 9.
        responsibility: correctness
      - claim: >-
          The number of published quantities constrained by C.3.2 is 1, by
          inspection of the predicate's free variables.
        responsibility: scope
      - claim: >-
          The reachable b set has size at most 2^161, from the seed-space
          cardinality and the two square roots.
        responsibility: size
      - claim: >-
          The perturbed-seed null passes at rate 0 over 10^4 trials, against a
          predicted per-trial rate of about 2^{-223}.
        responsibility: strictness
      - claim: >-
          The certificate is re-verifiable by a second implementation in two SHA-1
          calls and one modular multiplication, from (p, b, s) alone.
        responsibility: interface
      - claim: >-
          The instrument REFUSES on curves with no published seed rather than
          returning a Boolean.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        integer equality between Route A's recomputed c and SP 800-186's published
        c for P-224
      direction: different
      minimum_effect: >-
        PREDICTED EXACT EQUALITY. A mismatch means either the SHA-1 chain is
        implemented wrongly, or v and w are misread, or the document's c is a
        transcription artifact of the PDF extraction. HALT and separate those three
        before reporting anything - a PDF-extraction defect is by far the likeliest
        and must be excluded first by re-reading the raw bytes.
    - metric: 'bit length of the recomputed c for P-224'
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 223, derived from v = 1 and w = 63 before any hashing.
        Any other value falsifies my reading of C.3.1 and the instrument is void
        until the reading is corrected.
    - metric: 'the value of sigma in b^2 * c congruent sigma * 27 mod p, sigma in {+1, -1}'
      direction: different
      minimum_effect: >-
        PREDICTED sigma = -1, from generation step 9 with a = -3 and a^3 = -27.
        THE TWO OUTCOMES MEAN DIFFERENT THINGS - sigma = -1 confirms that the
        extraction lost a minus sign and that the standard is self-consistent;
        sigma = +1 would mean my reading of step 9 is wrong and the coupling
        between generation and verification in SP 800-186 is not what it appears,
        which is a material documentation finding. NEITHER outcome permits a
        statement about P-224's security.
    - metric: >-
        number of the seven published P-224 quantities (p, a, b, Gx, Gy, n, h)
        constrained by the C.3.2 predicate
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 1. This is the record's headline number and the honest
        content of SafeCurves' "manipulatable" verdict. A count of 2 or more would
        mean I have missed a clause of SP 800-186 that binds a second quantity to
        the seed, which is the informative negative and would strengthen the
        standard's position rather than this record's.
    - metric: >-
        pass rate of the C.3.2 predicate over 10^4 perturbed seeds (uniform random
        160-bit strings, plus the published seed with each of its 160 bits flipped
        in turn)
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0 out of 10160, against a per-trial null of about
        2^{-223}. A SINGLE pass indicates the predicate is being evaluated modulo
        something small, or with truncation, or that b is being recomputed from c
        rather than read - and voids every certificate the instrument emits. THIS
        IS THE BLOCKING CONTROL.
    - metric: >-
        pass rate of the NIST predicate applied to brainpoolP256t1 and to
        brainpoolP256r1 with the RFC 5639 seeds
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0. The Brainpool derivation feeds the hash output to A
        directly and does not use the b^2 c congruent a^3 relation at all, so the
        NIST predicate should not fire. A pass would mean the two derivations
        coincide on these parameters, which would be a remarkable and immediately
        reportable coincidence requiring independent review before any statement.
    - metric: >-
        instrument verdict on ANSSI FRP256v1
      direction: different
      minimum_effect: >-
        PREDICTED EXPLICIT REFUSAL, with reason "no published seed located in the
        frozen package". A Boolean output here - true or false - is an instrument
        failure, because a predicate with an undefined input has no truth value.
        Recorded as a refusal, never as a pass and never as a fail.
    - metric: >-
        upper bound on the fraction of F_p reachable as a NIST-procedure b for
        P-224
      direction: lower
      minimum_effect: >-
        PREDICTED at most 2^161 / (2^224 - 2^96 + 1), that is below 2^{-62}. This
        is rigorous and needs no experiment; it is reported to bound, not to
        support, any manipulation narrative. A generator restricted to this
        procedure cannot reach an arbitrary b, and that is a fact about the
        procedure and not about the generator.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, MINUTES. Compute v and w for l = 224 by hand, predict
      the 223-bit length of c, and record both BEFORE running anything. A wrong
      prediction here is the cheapest possible negative.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR, UNDER ONE SECOND OF COMPUTE, AND
      IT ALONE SETTLES THE INSTRUMENT. Implement C.3.1/C.3.2 parameterised by
      (l, hdigest, HASH). Verify hashlib against two published SHA-1 test vectors.
      Recompute c for P-224 from the published seed (Route A). Compare as an
      integer against SP 800-186's published c (Route B). Evaluate b^2 c mod p and
      compare against both +27 and -27 mod p. Emit the transcript. This is two
      hashes and three big-integer operations; there is no cheaper valid test of
      this claim and no more expensive one is needed.
      STAGE 2, SECONDS. The blocking perturbed-seed null - 10^4 uniform random
      160-bit seeds with the seed recorded, plus all 160 single-bit flips of the
      published seed. Predicted 0 passes.
      STAGE 3, SECONDS. The nearby-object controls - s+1, s-1, brainpoolP256t1 and
      brainpoolP256r1 under the NIST predicate, and the refusal on FRP256v1.
      STAGE 4, SECONDS. The positive controls at other sizes - the SAME code on
      P-256 (v = 1, w = 95, c predicted 255 bits) and P-384 (v = 2, w = 63, c
      predicted 383 bits). An instrument that has only ever fired at one size
      cannot certify a size-dependent formula, and this is the control that
      exercises the v > 1 branch.
      STAGE 5, ZERO COMPUTE. The coverage count - enumerate the free variables of
      the predicate against the seven published quantities and publish the integer
      with the enumeration shown.
    controls:
      - >-
        BLOCKING NULL, PERTURBED SEED - 10^4 random 160-bit seeds plus all 160
        single-bit flips of the published seed, identical code path. Predicted 0
        passes out of 10160. Any pass voids every certificate.
      - >-
        POSITIVE, BLOCKING, MULTI-SIZE - the identical code on P-256 and P-384,
        which exercise w = 95 and the v = 2 loop respectively. The instrument must
        FIRE on all three. An instrument that has never fired at v = 2 cannot be
        trusted at v = 2.
      - >-
        NEARBY-OBJECT NEGATIVE, ONE BIT AWAY - seeds s+1 and s-1. Predicted
        failure.
      - >-
        NEARBY-OBJECT NEGATIVE, DIFFERENT RULE - brainpoolP256r1 and
        brainpoolP256t1 under the NIST predicate with the RFC 5639 seeds.
        Predicted failure. This is the control that isolates WHICH generation rule
        the instrument tests.
      - >-
        REFUSAL CONTROL - ANSSI FRP256v1, no published seed. The instrument must
        refuse.
      - >-
        CROSS-IMPLEMENTATION - c assembled twice, once by bit-string concatenation
        and once by the arithmetic identity c = h0 * 2^{160v} + sum_i h_i *
        2^{160(v-i)}. Disagreement on any input voids the run. This catches the
        single likeliest implementation defect, which is endianness or block order
        in the concatenation.
      - >-
        TRANSCRIPTION CONTROL - the P-224 b read from SP 800-186 compared as an
        integer against the b in the RQ-SCURVE-960dbd intake tuple. I compared
        these two decimal strings BY EYE this session and they appeared to match;
        that comparison is not machine-checked and must be redone by the executor
        before either is used.
    required_metrics:
      - 'v, w and the predicted and observed bit length of c, per curve'
      - 'Route A c and Route B c as exact integers, and their equality'
      - 'b^2 c mod p, and its comparison to +27 and to -27 mod p'
      - 'the sign sigma that holds, per curve'
      - 'the perturbed-seed pass count out of 10160, with seeds recorded'
      - 'per nearby-object control, pass or fail and the failure mode'
      - 'the coverage count with the free-variable enumeration shown'
      - 'the rigorous reachable-set bound as an exact fraction'
      - 'wall clock per stage and the exact SHA-1 library version'

  falsification_conditions:
    - >-
      Route A's c differs from Route B's c for P-224. Either the implementation,
      the reading of C.3.1, or the PDF extraction is wrong. HALT, re-read the raw
      bytes of the source, and do not report until the three are separated.
    - >-
      Neither +27 nor -27 satisfies the predicate for the published b, c and p.
      The seed does NOT derive the published coefficient under my reading of the
      standard. This is a material discrepancy about a deployed standard: halt,
      exclude implementation error and extraction error first, escalate to
      independent review, and make no statement outside the repository.
    - >-
      Any pass in the perturbed-seed null. Implementation failure; nothing is
      reported.
    - >-
      The instrument fails to fire on P-256 or P-384 after firing on P-224. A
      size-dependent defect in the v/w formula; the P-224 certificate is
      withdrawn until it is understood, because the same code produced it.
    - >-
      The NIST predicate passes on a Brainpool curve. The instrument is not
      testing the rule it claims to test; every verdict is void.
    - >-
      The instrument returns a Boolean for FRP256v1. It has confused "no seed"
      with "false seed" and its refusal logic is broken.
    - >-
      The coverage count exceeds 1 because a second clause of SP 800-186 binds
      another quantity. The headline number is wrong; correct it and report the
      correction, since it strengthens the standard.

  confounders:
    - >-
      PDF EXTRACTION IS THE DOMINANT ERROR SOURCE HERE AND IT IS ALREADY VISIBLE.
      The sp800-186.txt file has lost congruence signs, minus signs and subscripts
      throughout; I read "b2 c { 27 mod p" and "4c + 27 { 0 mod p" and had to
      reconstruct both from context. Every numeric literal taken from this file is
      at risk and must be cross-checked against SEC 2, against the RQ intake, or
      against internal arithmetic consistency. A discrepancy is far more likely to
      be an extraction artifact than a finding, and the record pre-commits to that
      ordering.
    - >-
      SHA-1's collision weakness is IRRELEVANT HERE AND MUST NOT BE INVOKED.
      Chosen-prefix collisions let an attacker find two messages with one digest;
      they do not let anyone invert the seed-to-b map, and no claim in this record
      depends on SHA-1 being collision resistant. A record that reaches for
      SHA-1's brokenness to strengthen a rigidity claim has changed the subject.
    - >-
      "SEED VERIFIES" IS NOT "CURVE VERIFIES". The predicate binds b. A reader who
      sees a passing certificate and concludes the curve is verified has
      overread it by a factor of seven, which is precisely why the coverage count
      is part of the deliverable and not a footnote.
    - >-
      THE PREDICATE IS INVARIANT UNDER b -> -b. For P-224, p congruent 1 mod 4 is
      PREDICTED, making -1 a square and the two curves isomorphic, so the
      invariance is harmless. For a curve with p congruent 3 mod 4 the two would be
      non-isomorphic and the invariance would be a genuine gap. The instrument must
      branch on p mod 4 and report which regime it is in, rather than assume.
    - >-
      THE FROZEN PACKAGE IS A SNAPSHOT, not the live standard. It is dated
      2026-08-25 and the SafeCurves page inside it is version 2013.10.25. Nothing
      here establishes that the live documents still say what these copies say,
      and the deliverable must date-stamp every citation.

  interpretation_limits:
    - >-
      RIGIDITY'S COUNTERFACTUAL IS NOT A COMPUTABLE OBJECT AND NOTHING IN THIS
      RECORD TOUCHES IT. The archived audit plan's closure stands verbatim: for
      any deterministic rule R with R(inputs) = P there are infinitely many R'
      with R'(inputs) = P, and the audit observes only the pair. This record makes
      NO claim about whether the P-224 seed was chosen before or after b, about
      whether a search was conducted, or about anyone's intent. It measures what
      the published predicate binds and what it leaves free. Anyone citing it
      otherwise has misused it.
    - >-
      A PASSING CERTIFICATE IS NOT A SECURITY STATEMENT. It says nothing about the
      ECDLP on P-224, nothing about the group order, and nothing about the twist.
      It is a statement about a hash chain.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER, same
      code, same predicate, different (l, v, w) - NIST P-256 (v = 1, w = 95) and
      NIST P-384 (v = 2, w = 63). Those two are run here as controls and their
      certificates are a by-product; the sibling goals GOAL-SCURVE-be9707 and
      GOAL-SCURVE-cef9f7 may cite them, and IDEA-20260829-0656b1 and
      IDEA-20260829-ff7823 build on them rather than repeat them. (b) NO TRANSFER
      OF THE PREDICATE, PARTIAL TRANSFER OF THE COVERAGE METHOD - brainpoolP256t1
      and brainpoolP384t1 have seeds but a different derivation; the coverage count
      transfers as a method and is predicted to come out HIGHER there, which is the
      quantitative form of "somewhat rigid", and is the subject of
      IDEA-20260829-b70376 and IDEA-20260829-494a63. (c) REFUSAL, NOT TRANSFER -
      ANSSI FRP256v1 has no published procedure; the coverage count is predicted 0
      of 7 and the predicate is undefined. See IDEA-20260829-85768f. (d) NO
      TRANSFER AT ALL - Curve25519, M-221, M-383, Curve383187, Curve1174, E-222,
      E-382, secp256k1, BN(2,254), Anomalous, Curve41417, Ed448-Goldilocks, M-511
      and E-521 are not hash-seed-derived per the SafeCurves rigid page, and this
      predicate is undefined for every one of them. The instrument must refuse all
      fourteen and record the refusal.
    - >-
      A REFUSAL IS A LEGITIMATE AND INFORMATIVE OUTPUT and must be recorded as a
      refusal, never as a pass and never as a failure.
    - >-
      This record does NOT adjudicate the intake's rigid = false cell. SafeCurves'
      rigid is a FOUR-LEVEL ORDINAL (fully rigid, somewhat rigid, manipulatable,
      trivially manipulatable) and the intake Boolean is a cut in that ordinal, as
      the frozen rigid.txt shows directly. Adjudication requires knowing where the
      cut sits, which is a separate question and is the business of
      IDEA-20260829-f5bcff's threshold machinery, not of this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The map from a 160-bit seed s to the assembled integer c(s, l) behaves,
        for the purpose of computing false-pass rates only, like a uniformly
        random draw from the set of integers with exactly 160v + w bits;
        formally, for a fixed p and b and a seed s drawn uniformly from
        {0,1}^160 independent of (p, b), Pr[b^2 c(s,l) congruent -27 mod p]
        equals 2^{-(160v + w)} times (1 + o(1)) as p tends to infinity, which for
        P-224 is 2^{-223} times (1 + o(1)).
      rigorous_support: >-
        The RIGOROUS half is that the identity is EXACT in the forward direction
        and needs no assumption at all: a failing predicate is unconditional proof
        that this seed does not produce this b under this rule. The heuristic is
        used ONLY in the reverse direction, to interpret a PASS as evidence, and
        it imitates the standard random-oracle idealisation of a hash function -
        the same "behaves like a uniformly random object of its size" family used
        throughout this program. No unconditional bound on SHA-1's output
        distribution exists and none is claimed; SHA-1's known collision
        weaknesses do not bear on this statement in either direction, which is
        stated so no reviewer has to work it out.
      validation_plan: >-
        SAMPLING - 10^4 uniform random 160-bit seeds with the RNG seed recorded,
        plus the 160 single-bit neighbours of the published seed, which is the
        adversarially nearest sample available and the one where any structure
        would surface first. SCALE AND PARAMETERS RECORDED - the seed count, the
        RNG seed, the exact (l, v, w) per curve. COMPARISON DISTRIBUTION - the
        observed pass rate against the exact prediction 2^{-223}; at that exponent
        the prediction is "zero observed in any feasible sample", so the test HAS
        NO POWER TO CONFIRM the exponent and CAN ONLY REFUTE IT. That asymmetry is
        stated rather than glossed: a single false pass refutes decisively, and
        zero passes confirms nothing beyond the absence of a gross implementation
        defect. TAIL CHECK - restrict a subsample to seeds agreeing with the
        published seed in their top 120 bits, where a truncating implementation
        would fail first; predicted still zero passes. TRANSFER - none. The null
        runs at the real bit lengths on the real curve and nothing is
        extrapolated.
    - id: H2
      statement: >-
        The frozen package at inputs/SAFECURVES-20260825/ faithfully reproduces
        the documents it is named for; that is, the seed, c and b read from
        specs/sp800-186.txt are the values NIST published, and the four-level
        classification read from pages/rigid.txt is what SafeCurves published.
      rigorous_support: >-
        NONE, AND THIS IS THE RECORD'S BINDING NON-MATHEMATICAL WEAKNESS. It is an
        assumption about the world and no computation discharges it. It is made
        materially worse here by the visible mangling of the PDF extraction, which
        is direct evidence that the package is a lossy rendering of its sources and
        not a faithful one at the character level.
      validation_plan: >-
        PARTIAL AND INDIRECT, THREE CHECKS, NONE OF WHICH DISCHARGES IT. (i)
        CROSS-DOCUMENT - the P-256 seed appears in BOTH specs/sec2-v1.txt and
        specs/sp800-186.txt, from two different standards bodies and two different
        extractions; compare them as integers. Agreement is genuine cross-body
        corroboration for that one field. (ii) CROSS-LAYER - the b values in
        specs/sp800-186.txt compared as integers against the independently supplied
        RQ intake tuples for all three NIST curves. I performed this comparison BY
        EYE this session for P-224, P-256 and P-384 and all three appeared to
        match; the executor must redo it mechanically. (iii) INTERNAL ARITHMETIC -
        the predicate itself binds seed, c, b and p together, so a corrupted read
        of ANY of the four is overwhelmingly likely to break the congruence. That
        makes a PASS weak evidence of faithful transcription of all four
        simultaneously, which is the strongest thing available here and is
        materially weaker than retrieval. No statistic is fabricated in the
        meantime and H2 is recorded as open.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND THIS RECORD IS NOT A BID AGAINST
      docs/target-result-profile.md. AUDIT COST - exactly v + 1 = 2 SHA-1
      evaluations, one 224-bit modular squaring and one 224-bit modular
      multiplication per verification, that is O(l^2) bit operations with
      schoolbook arithmetic and under 10 microseconds in Python. The full six-curve
      family sweep plus the 10160-trial null is under one second on one core. The
      certificate is (p, a, b, s) and verification by a second implementation costs
      the same two hashes - genuinely succinct, unlike the K = 10^6 multiplication
      verification cost of IDEA-20260807-98a970's embedding-degree bound.
    memory_exponent: >-
      O(l) working memory, a few hundred bytes; O(l) certificate size. The 14-core,
      48 GB envelope is not a binding constraint anywhere in this record and the
      cores buy nothing, since the whole computation is serial and microseconds
      long.
    best_known: >-
      For this exact task the best known method IS this procedure - it is the
      published verification algorithm of SP 800-186 C.3.2 and this record
      reproduces it rather than improving it. The record therefore TIES the
      incumbent on cost and claims no algorithmic improvement whatsoever. The best
      known method inside this program is a transcription of an intake Boolean,
      which is not a computation. Against the ECDLP attack frontier (rho at
      0.886*sqrt(N) with O(1) memory, KN-TECH-001 and KN-TECH-006;
      automorphism-discounted rho, KN-TECH-018; BSGS at sqrt(N) time and memory,
      KN-TECH-031, with n^{2/3+o(1)} full cost, KN-TECH-035; MOV and Frey-Ruck at
      small embedding degree, KN-TECH-032) this record is dominated by every row
      because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. Three honest hidden costs, all
      epistemic. (i) The reachable-set bound of 2^161 is an UPPER bound on
      reachability and says nothing about how many of those b pass the further
      acceptance criteria - that separate and much harder number is the subject of
      IDEA-20260829-0656b1 and is deliberately not claimed here. (ii) H2 is
      undischarged and the PDF extraction is visibly lossy. (iii) The coverage
      count is a count over MY reading of the predicate's free variables; a clause
      I did not read could change it, and the reading depth is disclosed in the
      citation rather than hidden.
    tradeoff_note: >-
      One genuine tradeoff and it is the lossy projection read as a cost. The
      instrument buys a factor of roughly 2^180 in time over any conceivable
      brute-force approach to the same question by answering a strictly weaker
      question - it certifies one bit and discards the curve. THERE IS NO SETTING
      OF ANY PARAMETER that recovers the base point, the order or the intent from
      this object; that irreversibility is exactly the lossy-projection test
      passing. No time-memory tradeoff exists and parallelisation is irrelevant.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` IS NOT
    ASSERTED. AS AN ATTACK it is dominated by every row simultaneously on time,
    memory and data, because it is not an attack: rho (KN-TECH-001, KN-TECH-006),
    automorphism-discounted rho (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035) and
    MOV/Frey-Ruck (KN-TECH-032) all apply to P-224 and this record does not.
    AS A VERIFICATION PROCEDURE it is EXACTLY TIED with NIST SP 800-186 C.3.2,
    which is the algorithm being executed; no improvement is claimed and the tie is
    stated as a tie. It is dominated on convenience by any computer-algebra system
    or any of the several public scripts that perform this check, and dominated on
    authority by SafeCurves' own published table.
    AS A DELIVERABLE INSIDE THIS PROGRAM it is not dominated on one narrow axis,
    and the narrowness is the point: no incumbent identified inside this repository
    produces a ledger-resident, re-verifiable seed-derivation certificate with
    per-field provenance, a blocking perturbed-seed null with a measured pass rate,
    and an explicit coverage count. That is a documentation and controls delta, not
    a mathematical one, and it is stated at that size.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis - time, memory, data,
    queries - and zero algorithmic improvement over the published verification
    procedure, which this record reproduces exactly. THE NONZERO DELTAS ARE THREE
    AND ALL ARE MEASURABLE.
    AS DATA - the corpus screen of 2026-08-29 finds no seed, no c value, no
    verification transcript and no coverage count for ANY curve anywhere in
    knowledge/ or ledger/. This would produce, for P-224, one certificate of four
    fields re-verifiable in two SHA-1 calls, one measured null pass rate over 10160
    trials, one coverage integer out of seven, and one rigorous reachable-set
    bound, where there are currently zero of each.
    AS COST - the P-224 rigidity row moves from "not computable, see the archived
    closure" to "two SHA-1 calls and one modular multiplication, under 10
    microseconds", an unavailable-to-trivial transition inside this environment.
    That transition is available only because this session has a shell, which the
    producing session of the archived batch did not.
    AS PRECISION - SafeCurves' verdict "manipulatable" is an adjective on a
    four-level ordinal scale. This record replaces it, for the one thing it can
    actually decide, with two integers: coverage 1 of 7, and reachable fraction at
    most 2^{-62}. Neither integer is a security statement and neither speaks to
    intent, and the record says so four times.
  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Implementation is one parameterised function of about 40 lines plus a null
      loop; the standard is read and the formulae are transcribed above.
      Compute is two hashes for the headline result and roughly 20000 hashes for
      the entire control battery, well under one second on one core. The binding
      cost is neither: it is the careful re-reading of a visibly mangled PDF
      extraction, which is human attention rather than machine time.
  recommended_priority: high

