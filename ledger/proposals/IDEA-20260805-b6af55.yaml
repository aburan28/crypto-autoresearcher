idea:
  id: IDEA-20260805-b6af55
  question_id: RQ-XEDN-002
  added: '2026-08-05'
  title: >-
    Reachable-range audit of the XEDN relation instrument: can the statistic
    that decided four goals ever take a falsifying value, and did the declared
    planted control ever have to recover a planted relation?
  class: control

  claim: >-
    Two properties of the EXP-XEDN-004 measurement apparatus are proposed as
    checkable facts about its source code, both of which bear directly on what
    "max_|coeff| = 1, slope 0" is entitled to mean.
    (A) RANGE. The falsification criterion of EXP-XEDN-004 and of H-XEDN-003 is
    "any verified shortest relation has infinity-norm >= 4". The primary
    instrument is shortest_relation_group_law in
    experiments/EXP-XEDN-004/implementation/run_census.sage, invoked with
    coeff_bound = 3 and max_support = 3, plus a support-4 sweep restricted to
    coefficients +-1. Reading that function, the set of values it can return is
    contained in {1, 2, 3, None}. If that reading is correct, NO EXECUTION OF
    THIS CONTRACT COULD HAVE PRODUCED ITS OWN FALSIFYING OBSERVATION: the
    criterion is unreachable by construction, and the recorded outcome
    "gate_falsified: false" is a property of the search bound, not of the
    surfaces. This is the control-that-cannot-fail pattern catalogued in
    KN-TECH-1a5b7e.
    (B) CENSORING. A surface on which the bounded search finds nothing is
    recorded with skip_reason "no_relation_in_observed_span" and contributes no
    value to the max. The archived raw-result.json is read as showing this for
    5 of the 10 surfaces counted eligible at p = 7 and 1 of 10 at p = 13, so the
    reported max_|coeff| at p = 7 is a maximum over the half of the population on
    which the bounded search succeeded. The censored surfaces are precisely the
    candidates for exceeding the bound, so the censoring is aligned with the
    hypothesis rather than orthogonal to it.
    (C) CONTROL VACUITY. The frozen contract declares "Planted / synthetic
    relation control: a known short relation among constructed sections must be
    recovered with correct coefficients." The implementation planted_control()
    is read as (i) planting no relation -- it solves for a surface through two
    random sections -- and (ii) computing its verdict as
    pass = j_nonconstant and n_slots >= 2 and ok_rel with
    ok_rel = (max_abs_coeff is not None and specialisation and
    specialisation["pass"]) or n_slots >= 2, whose second disjunct makes ok_rel
    true whenever the first conjunct already is. The archived control record is
    read as {n_slots: 2, max_abs_coeff: null, specialisation: null, pass: true} --
    i.e. PASSING WITHOUT HAVING RECOVERED ANY RELATION.
    EVERY ONE OF (A), (B) AND (C) IS A READING OF A FILE, NOT A RESULT. Each is
    stated so that a reviewer can check it in minutes and refute it if the
    reading is wrong, and the experiment's first stage is exactly that
    independent re-reading. No status change is proposed and no measurement is
    alleged to be numerically incorrect.

  object_first_candidate:
    tracked_object: >-
      The REACHABLE RANGE of the reported statistic -- the set of values the
      measurement procedure can emit as a function of its own parameters
      (coeff_bound, max_support, the early-return-on-inf-norm-1 rule, and the
      censoring rule for surfaces with no relation found) -- followed through
      the pipeline from source code, to per-surface record, to per-p maximum, to
      slope-vs-log-p, to the evidence record's claim boundary. The object is the
      instrument, not the surface.
    established_families_off_limits: >-
      Off-limits as the primary lens: xedni calculus and lifting pipelines;
      Semaev summation polynomials; index calculus with an x-coordinate factor
      base; isogeny/volcano and CM structure; generic square-root algorithms;
      GHS/Weil descent. Also off-limits: proposing any NEW mathematical
      mechanism for the surfaces. This record deliberately proposes no
      mathematics at all. Its whole content is the range and the controls of an
      existing apparatus, which is productive move 1 of the generation contract
      ("attack the measurement, not the target") and the one this program's XEDN
      lane has never applied to itself.
    newness_score: >-
      Partly anticipated and the record says so plainly. RT-XEDN-004 item 2
      reads "Search-bound honesty. Group-law short search is capped; state that
      bound." The red team saw the cap. What is not in any XEDN record is the
      consequence -- that the cap sits at 3 while the falsification threshold
      sits at 4, so the cap and the criterion are on opposite sides of the same
      integer -- nor the censoring in (B), nor the vacuity in (C). Novelty here
      is a single arithmetic comparison, and its being that cheap is the reason
      it is worth filing rather than a reason it is not.
    testability_score: >-
      Maximal, and it needs no elliptic curve at all. (A) and (C) are decided by
      reading two functions; (B) is decided by counting fields in an archived
      JSON. The only compute in the proposal is the planted-relation experiment
      that converts the reading into a demonstration.
    survival_score: >-
      As a statement about this contract, the object survives to the end of the
      pipeline trivially. As a REUSABLE screen it survives much further: the
      identical shortest_relation_group_law is inherited by EXP-XEDN-005,
      EXP-XEDN-006 and EXP-XEDN-007, so whatever the reading turns out to be
      applies to the sibling goals GOAL-XEDN-002 and GOAL-XEDN-003 as well.
      That inheritance is why this is filed as an audit and not a footnote.

  mechanism: >-
    There is no mathematical mechanism to derive; the mechanism is arithmetic on
    the instrument's own parameters, and it is stated so it can be checked.

    (A) Range. shortest_relation_group_law(E, pts, coeff_bound = 3,
    max_support = 3) iterates supp from 2 to max_support, and for each
    support-supp subset iterates coefficient tuples over
    {-3,-2,-1,1,2,3}^supp, recording the smallest infinity norm among those
    tuples that sum to O under the group law; it returns immediately on
    inf = 1. After that loop, if n <= 24 it sweeps support-4 subsets with
    coefficients in {-1,+1} only. Hence: every value it can return is the
    infinity norm of a tuple drawn from a set whose entries are bounded by 3 in
    absolute value, so the return is in {1, 2, 3}; and if no such tuple sums to
    O it returns None. The threshold in the falsification criterion is 4.
    3 < 4. The FORCED VALUE is therefore: the probability that this instrument
    emits a falsifying observation is exactly 0, for every surface, every p,
    every seed and every family, isotrivial or not. Nothing about elliptic
    surfaces is used in that derivation, which is the point -- a falsification
    criterion that can be shown unreachable without mentioning the object under
    study is not a falsification criterion.

    (B) Censoring. The eligible population is defined by non-isotriviality,
    nonzero discriminant, a passing height control and at least two slots; the
    reported statistic is the maximum of max_abs_coeff over the eligible
    surfaces THAT PRODUCED A VALUE. A surface where the bounded search returns
    None is tagged "no_relation_in_observed_span" and drops out. The maximum of a
    bounded quantity over the subpopulation on which a bounded search succeeded
    is bounded by the search bound twice over. Note carefully what this does NOT
    say: it does not say those surfaces have large-coefficient relations. It says
    the design cannot distinguish "no relation exists" from "no relation exists
    within |c| <= 3 and support <= 4", and the second is the interesting case.

    (C) Control vacuity. The specified control is a POSITIVE control -- a
    sensitivity demonstration whose purpose is to show the instrument can move.
    The implemented control tests only that a surface with two sections and
    non-constant j can be constructed. Its pass predicate is satisfied by
    n_slots >= 2 through both of its conjuncts, so the branch that would have
    required a recovered relation with correct coefficients is never binding.
    Under docs/inventor-protocol.md section 3 and KN-TECH-1a5b7e, an instrument
    with no demonstrated sensitivity is not entitled to report a negative, and
    "gate_falsified: false" is a negative.

    What follows from all three, IF the readings hold. The measurement
    max_|coeff| = 1 remains correct as far as it goes -- those relations were
    verified by group-law identity over F_p(t) and by specialisation at >= 20
    smooth fibres, and one surface was independently recomputed by
    TASK-20260725-005. What does not follow is the SLOPE claim. "Slope 0 vs
    log p with jackknife CI [0,0]" is computed from four points all equal to 1,
    where 1 is simultaneously the minimum possible value of an infinity norm of
    a nonzero integer vector and the value at which the search early-returns. A
    statistic pinned at the floor of its range with zero variance is consistent
    with bounded coefficients and equally consistent with an instrument that
    stops looking; those two are not separated by the data, and separating them
    is what the planted arm below does.

  novelty_status: unverified

  literature_context:
    - >-
      RT-XEDN-004, item 2, verbatim: "Search-bound honesty. Group-law short
      search is capped; state that bound." READ, at
      coordination/goals/GOAL-XEDN-001/batches/BATCH-001/tasks/TASK-20260725-006/
      objections.md. This proposal is the consequence the objection did not
      draw, and credits it. Items 1, 3 and 4 of the same objection list (do not
      claim B2 closure; thin p = 31 cell; raise the degree window) are respected
      and not re-litigated here.
    - >-
      KN-TECH-1a5b7e -- the corpus's catalogue of controls that pass without
      being able to fail, whose worked instance is the AES falsified-hint control
      returning the empty set (EV-AES-d33b1c, EV-AES-d8a13e). NOT READ in this
      session -- relayed from the 2026-08-05 scouting brief. Its obligation 3
      (name the comparator and declare the sensitivity threshold before the run)
      is adopted here verbatim in the controls below.
    - >-
      docs/inventor-protocol.md section 3, READ. "Any apparent signal is an
      artifact until a control says otherwise ... Ask what the measured quantity
      SHOULD do as the parameter that is supposed to destroy it increases." The
      parameter meant to destroy a coefficient bound is p; the quantity did not
      move; but the quantity also could not have moved past 3, so the tell is
      inconclusive as recorded and the graded arm below is what makes it
      conclusive.
    - >-
      DEC-20260724-021 publishes an eleven-sentence forbidden list for this
      lane, including "the multi-section or Mordell-Weil relation-source route is
      closed" and "no lifting-based relation source exists over F_p(t)". NOT READ
      in full this session -- relayed from the scouting brief, which quotes those
      two sentences. This proposal writes neither and asserts nothing about the
      route's viability in either direction.

  lossy_projection_identifiability_audit:
    projection: >-
      A surface together with its full set of enumerated sections and their true
      integer relation lattice is projected to a single integer: the infinity
      norm of the shortest relation the bounded search happened to find, or the
      symbol None.
    what_is_discarded: >-
      The rank of the relation lattice, every relation of support >= 5, every
      relation with a coefficient of absolute value >= 4, the number of
      independent relations, and the distinction between "no relation" and "no
      relation the search can see".
    why_genuinely_lossy: >-
      Genuinely and severely lossy -- three of the archived surfaces carry
      between 11 and 19 sections, on which the relation lattice has substantial
      rank, and all of that is collapsed to the single symbol 1.
    why_compatible_with_the_operations: >-
      NOT compatible, and that is this proposal's finding rather than a defect in
      the proposal. The retained part does not propagate: knowing the shortest
      relation's inf-norm on one surface tells you nothing deterministic about
      the next, and the projection is not equivariant for any operation on the
      family. The tracked object here is deliberately the instrument, not the
      mathematics, so the compatibility clause of the lossy-projection test is
      recorded as NOT SATISFIED and the object is not proposed as an attack lens.
    is_it_only_a_change_of_coordinates: >-
      Neither failure mode in its usual form. It is not the (Delta, Pi) failure
      (a great deal is discarded) and it is not literally constant across
      instances -- but it is EMPIRICALLY constant across all 24 archived surfaces
      and all four primes, at a value that is simultaneously the floor of its
      range and the early-return trigger of its own search. Which failure was
      checked for: the mirror failure (constant across instances, zero comparator
      spread). What the check returned: constant on 24 of 24 archived surfaces,
      with a derived upper bound of 3 and a derived lower bound of 1 on the whole
      range. That is the strongest form of the tell available short of proving
      constancy.

  assumptions:
    - >-
      That the file read at
      experiments/EXP-XEDN-004/implementation/run_census.sage is the code that
      produced RUN-XEDN-004-MAIN. The run manifest records a git commit; the
      audit's stage 1 must confirm the file at that commit matches, because a
      later edit would void every reading in this record.
    - >-
      That analyze_surface passes the default coeff_bound = 3 and
      max_support = 3 rather than overriding them at the call site. This is a
      one-line check and is listed because the entire (A) reading depends on it.
    - >-
      That "verified shortest relation" in the falsification criterion means the
      output of this instrument and not some other notion. If the criterion was
      intended to quantify over ALL integer relations, then it was never
      operationalised at all, which is a different and larger finding.

  predictions:
    - metric: >-
        reachable_range: the set of distinct non-None values that
        shortest_relation_group_law can return, determined by static reading and
        confirmed by exhaustive instrumentation over synthetic point sets
      direction: different
      minimum_effect: >-
        FORCED VALUE, derived before any run: {1, 2, 3}. Predicted maximum 3,
        against a falsification threshold of 4. If any synthetic input causes the
        function to return 4 or more, this proposal's (A) is falsified outright.
    - metric: >-
        planted_recovery_rate_at_infnorm_5: fraction of synthetic instances
        carrying a KNOWN relation of infinity norm exactly 5 and support 2 on
        which the frozen instrument reports that relation
      direction: lower
      minimum_effect: >-
        FORCED VALUE: 0 out of 20. This is the demonstration that converts the
        static reading into an observation. It can fail: if the instrument
        recovers even one, the reading of the coefficient loop is wrong.
    - metric: >-
        planted_recovery_rate_at_infnorm_2_and_3: fraction of synthetic instances
        carrying a known relation of infinity norm 2 (resp. 3) and support 2 or 3
        on which the instrument reports exactly that norm
      direction: higher
      minimum_effect: >-
        FORCED VALUE: 20 out of 20 at each of norm 2 and norm 3. THIS IS THE
        POSITIVE CONTROL AND IT GATES EVERYTHING ELSE. If the instrument cannot
        report a 2 when a 2 is planted, it is not a shortest-relation instrument
        at all and no reading in this record, positive or negative, may be
        reported.
    - metric: >-
        censored_fraction_by_p: number of surfaces counted eligible whose
        max_abs_coeff field is null, divided by n_eligible, per p, from the
        archived raw-result.json
      direction: higher
      minimum_effect: >-
        At least 0.5 at p = 7, read from the archive as 5 of 10. A recomputation
        finding 0 censored surfaces at p = 7 falsifies (B).
    - metric: >-
        planted_control_pass_under_a_deliberately_broken_instrument: verdict of
        the frozen planted_control() when the relation search is stubbed to
        return None unconditionally
      direction: different
      minimum_effect: >-
        FORCED VALUE: pass = true, i.e. UNCHANGED. If the frozen control's
        verdict changes when the instrument is disabled, then the control does
        test the instrument and (C) is falsified. This is the cleanest single
        experiment in the proposal and it takes one line of stubbing.

  minimal_test:
    design: >-
      This proposal shares an experiment with IDEA-20260805-9ad641: it is
      STAGE 2 of EXP-XEDN-affa94, deliberately ordered AFTER the zero-compute
      archive comparison and the source check and BEFORE any elliptic-surface
      recomputation, because it is the stage that can terminate the whole audit
      most cheaply. Sub-steps: (2a) confirm the source file at the run's recorded
      commit; (2b) enumerate the instrument's reachable range statically and
      instrument it dynamically; (2c) run the planted battery at infinity norms
      1, 2, 3, 4, 5 with supports 2, 3, 4 and 5; (2d) stub the instrument and
      re-run the frozen planted_control(); (2e) count censored surfaces in the
      archive. None of this requires SageMath if the point set is replaced by a
      synthetic abelian group -- see the comparability note in the controls.
    controls:
      - >-
        POSITIVE CONTROL (the effect MUST appear; gates every negative). Planted
        relations of infinity norm 2 and 3 at supports 2 and 3. FORCED VALUE
        derived pre-run: recovered 20/20 at each norm, with the reported norm
        equal to the planted norm. Declared threshold, fixed before the run:
        >= 19/20. If it is not met, the instrument is broken and NO conclusion,
        including this proposal's own, may be drawn.
      - >-
        NULL OBJECT of the same shape (CAN FAIL). Point sets of the same
        cardinality drawn so that NO relation of support <= 4 and inf-norm <= 3
        exists -- constructible by taking n elements algebraically independent
        over the relevant bound in a large cyclic group. FORCED VALUE: the
        instrument returns None on 20/20. If it returns a value, it is finding
        relations that are not there and the whole census is compromised in the
        opposite direction from the one this proposal argues.
      - >-
        GRADED CONTROL, 5 interior points, monotonicity reported. Plant relations
        of infinity norm k = 1, 2, 3, 4, 5 and report recovery rate as a function
        of k. Pre-registered prediction: 1.0, 1.0, 1.0, 0.0, 0.0 -- a step
        function with its edge between 3 and 4. A recovery rate that does NOT
        fall to 0 at k = 4 falsifies (A); one that falls before k = 3 means the
        instrument is weaker than its own parameters claim, which is a different
        and worse finding. Reporting the whole curve localises the edge instead
        of leaving "the search is capped".
      - >-
        ORDERING CONTROL. The reachable-range determination and the planted
        battery are recorded and hash-committed before the archived census
        numbers are re-read, so that no threshold is chosen after seeing them.
      - >-
        COMPARABILITY POLICY. The planted battery runs on a synthetic finite
        abelian group, not on an elliptic surface, because the property under
        test is a property of the coefficient loop and is independent of the
        group. That substitution must be declared, and any conclusion is scoped
        to "the search procedure", never to "the surfaces". If a reviewer holds
        that the substitution is illegitimate, the battery is re-run on
        E(F_p(t)) points and the cost rises from seconds to hours; the design
        must record which was done.
    required_metrics:
      - the reachable value set, from static reading and from instrumentation, reported separately
      - recovery rate vs planted infinity norm, k = 1..5, with seeds
      - verdict of the frozen planted_control() with the instrument live and stubbed
      - censored-surface count and fraction per p from the archive
      - the sha256 and git commit of the source file actually read

  falsification_conditions:
    - >-
      The instrument returns a value >= 4 on any input. (A) is wrong.
    - >-
      The frozen planted_control()'s verdict changes when the relation search is
      stubbed out. (C) is wrong.
    - >-
      No archived eligible surface has a null max_abs_coeff. (B) is wrong.
    - >-
      The source file at the run's recorded commit differs from the file read.
      Every reading in this record is void and must be redone against the right
      file.
    - >-
      The positive control fails at norms 2 and 3. Nothing at all may be
      reported.

  confounders:
    - >-
      READING-VS-EXECUTION GAP. Static reading of Python-in-Sage can be wrong:
      a call site may override defaults, and Sage preparsing changes integer
      literals. The dynamic instrumentation in (2b) exists to close this gap and
      must be reported alongside the reading, never in place of it.
    - >-
      SUBSTITUTED GROUP. Running the coefficient loop on a synthetic group is a
      soundness-preserving simplification for the range question and NOT for any
      question about surfaces. Conflating the two would be the exact error this
      record accuses the census of; it is named here so a reviewer can check that
      it was not committed.
    - >-
      CRITICISM IS CHEAP. An audit that finds a fault in someone else's control
      reads as rigour and costs almost nothing to produce. The gating positive
      control, the failable null, and the five falsification conditions exist to
      make the critical outcome cost something.
    - >-
      SCOPE INFLATION. The same instrument is inherited by EXP-XEDN-005/006/007.
      It is tempting to extend a finding to the sibling goals automatically. Each
      of those contracts must be read separately; their call sites may differ,
      and this record makes no claim about them beyond noting the shared
      provenance.

  interpretation_limits:
    - >-
      Confirming (A), (B) and (C) would NOT show that max_|coeff| is unbounded,
      would NOT show the census was numerically wrong, would NOT reopen candidate
      B2, and would NOT bear on crypto-scale ECDLP. It would show that one
      recorded outcome -- gate_falsified: false -- carries less information than
      its record implies, and that a wider search is needed to give it that
      information.
    - >-
      Confirming (C) specifically means the census lacked a working positive
      control, which under docs/inventor-protocol.md section 3 means the negative
      finding is not yet entitled to be reported as one. It does NOT mean the
      finding is false. The remedy is a control, not a retraction.
    - >-
      No status change to EXP-XEDN-004, H-XEDN-003, EV-XEDN-003,
      DEC-20260725-001, GOAL-XEDN-001 or any sibling record is proposed or
      implied. Only the Coordinator may make one (AGENTS.md rule 1). If the
      readings hold, the correct instrument is a superseding record under a new
      id, never an edit (AGENTS.md rule 4).

  heuristic_assumptions:
    - id: HEUR-XEDN-B1
      statement: >-
        NONE LOAD-BEARING. (A) is a statement about the range of a finite loop,
        (B) is a count of fields in a committed JSON file, and (C) is the truth
        table of a two-term disjunction. No distributional, asymptotic or
        random-model assumption enters. This entry exists to state that
        explicitly rather than leave the field empty.
      rigorous_support: >-
        max over a set of tuples whose entries lie in {-3,...,3} of the entrywise
        absolute value is at most 3; a disjunction whose second term is implied
        by a conjunct of the enclosing predicate is not binding.
      validation_plan: >-
        Dynamic instrumentation of the reachable range, and the stubbed-control
        experiment. Both are deterministic and neither is statistical.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT IS MOVED. This record proposes no algorithm, and the
      exponent governing its lane (alpha = 3 for the lift, per EXP-XEDN-001 and
      DEC-20260724-021) is untouched. It is worth running anyway because it costs
      hours and it decides what four completed censuses are entitled to claim --
      which is the honest statement of its value, and the generation contract
      asks for that statement rather than for a manufactured exponent.
    memory_exponent: n/a.
    best_known: >-
      Pollard rho at sqrt(p) time, O(1) memory, O(1) data remains the frontier
      for ECDLP over F_p; nothing here approaches or bears on it.
    hidden_overhead: n/a.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed). Rows checked before writing null, across time,
    memory and data/queries: (1) Pollard rho and (2) BSGS -- not comparable, no
    solver is proposed; (3) the XEDN lifting route at alpha = 3 -- not competed
    with; (4) the four completed XEDN censuses -- this record produces no
    competing coefficient measurement; (5) any existing audit of this instrument
    -- searched ledger/, experiments/EXP-XEDN-*/ and the BATCH-001 task
    directories on 2026-08-05 and found RT-XEDN-004 item 2 (the cap is named, the
    consequence is not drawn) and VAL-XEDN-004-01 (the Gram over-reports), and
    nothing that determines the reachable range or tests the planted control.
    Absence of a search result is not evidence that no such audit exists
    (AGENTS.md knowledge-retrieval policy).
  sota_delta: >-
    No attack; instrument-integrity contribution only. Quantitatively: the
    proposal moves one integer -- the largest value the census statistic can
    take, from "unstated" to a determined bound (predicted 3) -- against a
    falsification threshold of 4, and it converts one control's verdict from
    "pass" to either "pass, demonstrated sensitive" or "pass, vacuous". Blast
    radius if the readings hold: one evidence record, one decision, and three
    sibling contracts that inherit the same function.
  estimated_cost:
    implementation: >-
      low. The planted battery needs a synthetic finite abelian group and a copy
      of the coefficient loop; under 150 lines of pure Python, no dependency.
      SageMath is absent from this container (verified 2026-08-05), so the frozen
      .sage file cannot be executed here and the loop must be transcribed --
      which must be declared, since a transcription is not the original.
    compute: >-
      negligible; seconds.
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that (A) survives -- it is a bound on a loop over a literal set, and the
    only ways it fails are a call-site override or a Sage preparsing surprise.
    0.80 that (C) survives -- the disjunction is plain, and the archived control
    record showing max_abs_coeff null with pass true corroborates it, but the
    reading could be wrong about which branch executed. 0.90 that (B) survives --
    it is a count in a committed file. Jointly about 0.65 that all three hold as
    stated. These are not higher because every one is a reading of code this
    session did not execute; they are not lower because each is checkable in
    minutes by anyone who disagrees, which is the property a good audit should
    have. Separately: 0.10 that any of this changes a mathematical conclusion
    about elliptic surfaces, and that number is deliberately low -- the value
    here is evidentiary, not mathematical, and the record should not be read as
    predicting otherwise.
