idea:
  id: IDEA-20260815-101067
  question_id: RQ-VOLC-f6253b
  added: '2026-08-15'
  title: >-
    VOLCANO LEVEL IS READ OFF THE PUBLIC GROUP STRUCTURE AND USED TO
    STRATIFY COST FUNCTIONALS: measure whether cost actually varies with
    level, since a stratification nobody has validated is a labelling
    exercise
  class: measurement

  claim: >-
    IDEA-20260808-4d77a6 shows the isogeny-volcano level is partially
    readable from the public group structure, and IDEA-20260807-1d9c5f
    proposes stratifying campaign cost functionals by it. Whether any
    campaign cost actually varies with level is the premise both rest on and
    is measurable directly by running the standard battery across levels.

  mechanism: >-
    Construct curves spanning several volcano levels within one isogeny
    class. Run the standard cost battery on each. Report cost as a function
    of level with matched controls for group order and any other varying
    invariant.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of IDEA-20260808-4d77a6 and IDEA-20260807-1d9c5f; grep 'volcano
      level', 'stratify', 'conductor'.
    results: >-
      The readability of the level and the proposal to stratify by it both
      exist; whether cost varies with level is not measured.
    verdict: >-
      UNVERIFIED. Volcano structure is classical and its effect on
      isogeny-computation cost is known; whether the campaign's own cost
      functionals vary with it is the specific unmeasured question.

  object_first_candidate:
    tracked_object: >-
      CAMPAIGN COST as a function of volcano level, within one isogeny
      class.
    lossiness: >-
      Stratifying by level projects a curve onto one integer, which is
      useful only if cost actually depends on it.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while a class with several populated levels is
      constructible at toy size, which requires a conductor with enough
      prime power structure.

  null_object_control: >-
    NULL 1 -- curves at the SAME level, bounding within-level variance;
    between-level differences smaller than that are not real. NULL 2 --
    curves in different classes at matched level, separating a level effect
    from a class effect.

  discriminated_from:
    - >-
        IDEA-20260808-4d77a6, which establishes the level is readable;
        this asks whether reading it buys anything.
    - >-
        IDEA-20260807-1d9c5f, which proposes the stratification; this
        measures its premise and should be sequenced before it.

  assumptions:
    - >-
        A toy isogeny class with several populated volcano levels is
        constructible, requiring a suitable conductor.
    - >-
        Level is determinable for each constructed curve, which
        IDEA-20260808-4d77a6's method supplies and which must be verified
        independently rather than assumed.

  predictions:
    - metric: >-
        same-level variance null
      direction: different
      minimum_effect: >-
        Bounds within-level variance; any level effect must exceed it.
    - metric: >-
        cost as a function of volcano level
      direction: different
      minimum_effect: >-
        The measurement; no direction pre-committed and a null result
        retires the stratification proposal cheaply.
    - metric: >-
        cross-class matched-level control
      direction: different
      minimum_effect: >-
        Separates level effects from class effects, without which any
        level trend is confounded.

  minimal_test:
    design: >-
      One class with three populated levels, five curves per level, the
      standard battery, both nulls.
    controls:
      - >-
          Same-level variance null.
      - >-
          Cross-class matched-level control.
      - >-
          Level determined independently of the readability method being
          relied on.
      - >-
          Group order matched across levels where possible, since it
          varies with level by construction.
    required_metrics:
      - >-
          Cost per curve with its level.
      - >-
          Between-level differences against within-level variance.
      - >-
          Cross-class control outcome.
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        Within-level variance swamps between-level differences. The
        stratification carries no information at this scope and the
        proposal to stratify should be retired.
    - >-
        A level trend appears that survives the cross-class control. The
        stratification is justified with a measurement rather than an
        assumption.
    - >-
        A trend appears but does not survive the cross-class control. It
        is a class effect mislabelled as a level effect, which is the most
        likely confounded outcome.
    - >-
        A class with several populated levels is not constructible at toy
        size. The measurement cannot be made and must be reported rather
        than approximated.

  confounders:
    - >-
        GROUP-ORDER COVARIATION: volcano level and group structure vary
        together by construction, so a cost trend with level may be a
        trend with group order, and matching is only partially possible.
    - >-
        CLASS SPECIFICITY: one class cannot separate a level effect from
        that class's particular structure, which is why the cross-class
        control is required rather than optional.

  interpretation_limits:
    - >-
        Measures whether a proposed stratification carries information;
        establishes no attack.
    - >-
        Scoped to the tested class, levels and battery.
    - >-
        A null result retires the stratification at this scope rather than
        proving levels irrelevant.

  heuristic_assumptions:
    - id: HEUR-VOLC-1
      statement: >-
        Volcano level is a cost-relevant stratifier for this campaign's
        functionals, independent of the group-order variation that
        accompanies it.
      rigorous_support: >-
        Rigorous ingredient: level determines the endomorphism ring's
        conductor, which controls which isogenies are rational and
        therefore the cost of isogeny-based operations. THE GAP: the
        campaign's cost functionals are mostly Semaev and rho costs,
        which do not obviously depend on the endomorphism ring at all --
        so the mechanism connecting level to campaign cost is assumed
        rather than identified.
      falsification_condition: >-
        Cost showing no level dependence beyond within-level variance.
      validation_plan: >-
        SAMPLE: >= 3 levels x >= 5 curves x the full battery, plus the
        cross-class control. COMPARISON: between-level differences
        against within-level variance. TAIL CHECK: the extreme levels,
        where any effect should be largest. TRANSFER: none beyond the
        tested class.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one battery run per curve across levels.
    memory_exponent: >-
      Battery-dependent; modest at toy sizes.
    best_known: >-
      The incumbent is the classical volcano theory, which predicts level
      effects on isogeny computation; whether the campaign's own
      functionals inherit them is unmeasured.
    hidden_overhead: >-
      Level and group order covary by construction, so a fully matched
      comparison is not achievable and the residual confound must be
      stated.
    tradeoff_note: >-
      Stratifying by level costs nothing if the level is readable and buys
      resolution only if cost actually varies with it.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As theory: dominated by classical volcano
    theory. As a measurement of level-dependence in this campaign's
    functionals: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: campaign cost measured across
    volcano levels within one class, with within-level variance and a cross-
    class control, testing the premise behind a stratification the program
    has proposed but not validated.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.6 that a toy class with three populated levels is constructible. 0.85
    that levels are determinable and verifiable independently. 0.3 that a
    level effect survives the cross-class control, which is what the
    stratification proposal needs.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
