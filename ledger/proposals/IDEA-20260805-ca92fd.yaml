  lossy_projection_identifiability_audit:
    projection: >-
      Full UOV instance (q, n, m, public map P, secret oil space O) -> the
      integer sequence deficit(D) = sr_pred(M, N, D) - rank(Macaulay_D) for
      D = 2, 3, ..., d_reg + 1, where M = 3m - 2 and N = 2n - 3m.
    what_is_discarded: >-
      Everything except a handful of integers. The oil space, the field elements
      of the public map, the choice of L_1 and L_2, the imposed linear
      constraints and the solution itself are all discarded. The fibre over an
      observed deficit sequence is enormous.
    why_genuinely_lossy: >-
      Genuinely lossy, and lossy in a way that is not a change of coordinates:
      the map from a system to its graded Macaulay ranks is not injective on any
      neighbourhood - two systems related by an invertible linear change of
      variables have IDENTICAL rank profiles, so the projection quotients by at
      least GL_N(F_q), which has order about q^{N^2}. That is the opposite of
      the (Delta, Pi) = (x XOR y, x*y) failure named in the inventor protocol,
      where the pair is recoverable as the roots of t^2 + Delta t + Pi and
      nothing was discarded.
    why_compatible_with_the_operations: >-
      Compatible by construction. Macaulay rank at degree D is a function of the
      ideal generated by the system in degrees <= D, and the operations the
      target performs - multiplying generators by monomials, taking linear
      combinations - are exactly the operations that build the matrix. The
      retained part propagates deterministically: rank(D) determines which
      degree falls occur and hence the next degree's row space.
    is_it_only_a_change_of_coordinates: >-
      No. But the MIRROR FAILURE is the live risk here and it is the one this
      design is built to catch. deficit(D) could be CONSTANT across instances -
      a function of (M, N, D, q) alone - in which case it says nothing about the
      oil structure and the whole measurement is a description of the apparatus.
      THE CHECK THAT WAS RUN: the semi-regular series is a function of (M, N)
      only, so the NULL arm's deficit is forced to be near-constant BY
      CONSTRUCTION; the question is entirely whether the TREATMENT arm's
      comparator spread is nonzero. Because the null's value is derived and
      frozen in advance and the null can differ from it (a planted point forces
      a degree fall the unplanted series does not predict), the comparator has a
      derived reference point rather than a fitted one. If treatment and null
      spreads are both zero at every cell, the correct report is 'the instrument
      measures (M, N, q) and not UOV', and that report is a deliverable.

  assumptions:
    - >-
      That the polar forms P'_1..P'_m contain at least two invertible members,
      or that two invertible F_q-combinations of them exist. Over F_q in
      characteristic 2 with n even, a uniformly random alternating matrix is
      invertible with probability bounded below by a constant, so this holds
      with overwhelming probability once a few combinations are tried; the
      experiment records the number of trials rather than assuming one.
    - >-
      That n is even at the parameter sets used, so that an invertible
      alternating matrix exists at all. If a round-3 tuple has n odd, EVERY
      polar form is singular and Step 3 must be rebuilt; this is a checkable
      integrity condition and is listed in the experiment's stopping rules.
      APPLIED TO THE TOY LADDER THIS BITES IMMEDIATELY, and the paired
      hypothesis H-UOV-4d1377 records the consequence rather than leaving it to
      be discovered at runtime: of the nine toy cells named in Step 6, only
      (3,3) n=6, (7,5) n=12, (6,4) n=10 and (8,6) n=14 have n even. The cells
      (4,3) n=7, (5,4) n=9, (6,5) n=11, (9,6) n=15 and (10,7) n=17 admit no
      invertible alternating polar form over F_16 and require a declared
      substitute construction; their numbers form a separate arm and may not be
      pooled with the even-n core ladder. The frozen semi-regular values quoted
      in the predictions therefore split as 2, 4, 5, 4 on the core and 3, 3, 3
      on the odd-n arm.
    - >-
      That the toy cells (small v, m with 3m > n) are in the same structural
      regime as the deployed ones. THIS IS THE PROPOSAL'S WEAKEST ASSUMPTION and
      it is stated, not hidden - see interpretation_limits and HEUR-UOV-A3.

  predictions:
    - metric: >-
        d_ff_null - the measured first-fall degree of the PLANTED-SOLUTION null
        arm at each toy cell, compared with the frozen semi-regular value
      direction: different
      minimum_effect: >-
        EXACT AGREEMENT at every core cell with the frozen table of STEP 6
        (2, 3, 3, 3, 4, 5, 4 at (v,m) = (3,3), (4,3), (5,4), (6,5), (7,5),
        (6,4), (8,6)). Derived before any run. A single cell where the null
        misses its own frozen value means the instrument, the semi-regular
        convention, or the planting is wrong, and NO statement about the
        treatment arm may be made at that cell.
    - metric: >-
        d_ff_treat - d_ff_null, the first-fall-degree gap between the derived
        intersection system and the matched planted null, per cell
      direction: lower
      minimum_effect: >-
        The pre-registered null hypothesis is EXACTLY 0 at every cell. A
        departure counts only if it is <= -1 at three or more of the seven core
        cells, at every seed, with the null at its frozen value in the same
        cells. One cell at one seed is noise and is reported as such.
    - metric: >-
        deficit_ratio(D) = deficit_treat(D) / max(1, deficit_null(D)) at
        D = d_reg - 1, d_reg, d_reg + 1
      direction: higher
      minimum_effect: >-
        Predicted 1.00 under the semi-regular model. A ratio >= 1.05 at
        D = d_reg with the null at its frozen value, reproduced at two seeds,
        is the smallest reportable effect. Reporting the RATIO rather than the
        raw deficit is required: ANGLE-BRIEF T-A records EV-SEMAEV-94f6d5
        drawing a conclusion from a raw statistic whose value KN-FIND-007 shows
        was forced by a parameter held fixed across the comparison.
    - metric: >-
        graded_monotonicity - the sign of d(deficit at D = d_reg)/dc over the
        graded control, where c is the number of imposed linear constraints and
        the projective solution dimension is t = (3m - n - 1) - c
      direction: lower
      minimum_effect: >-
        Strictly decreasing in c across all t = 3, 2, 1, 0 at cell (v,m)=(8,6)
        and all t = 2, 1, 0 at (9,6). Monotone by derivation - a
        positive-dimensional solution set forces a Hilbert function that
        stabilises to a polynomial of degree t rather than to a constant, so a
        larger t forces a larger deficit. A non-monotone reading localises the
        break to a specific t rather than leaving 'it did not work'.
    - metric: >-
        equation_count_integrity - the number of NONZERO rows in the treatment
        system's generator list
      direction: different
      minimum_effect: >-
        EXACTLY 3m - 2, derived in Step 3. Over F_16 the two lost equations must
        appear as identically-zero polynomials before removal (char-2
        disposition), NOT as duplicates. If the builder emits 3m nonzero rows,
        or emits 3m - 2 by removing duplicates over a char-2 field, the builder
        does not implement the derivation and the package is invalid.
    - metric: >-
        surplus_dimension - the measured dimension of the space of solutions
        found when zero linear constraints are imposed
      direction: different
      minimum_effect: >-
        AT LEAST 3m - n - 1 projectively, derived in Step 2. Measured directly
        at the smallest cells by exhaustive search over F_16 where the space is
        small enough. A measured surplus BELOW the derived bound falsifies
        Step 1 or Step 2 and terminates the line; that is the cheapest available
        refutation of this record's own mathematics and it costs seconds.

  minimal_test:
    design: >-
      Five stages, ordered cheapest-first, each able to terminate the line.
      STAGE 0 (reading, zero compute) - obtain the UOV round-3 specification and
      KN-LIT-4397's actual text, quote the published equation and variable
      counts and the published cost formula, and record whether they agree with
      Steps 3, 4 and 5. If they disagree, STOP and re-derive; the derivation
      here is what is under test, not the paper.
      STAGE 1 (integer arithmetic, zero compute, DECISIVE) - recompute the
      Step-6 Hilbert-series table inside the harness, in pure Python, from the
      series definition. Freeze it as the pre-registered prediction. If the
      in-harness recomputation disagrees with the scratchpad numbers quoted in
      Step 6, the scratchpad numbers are wrong and the record is corrected by
      supersession before anything else runs.
      STAGE 2 (the surplus check, seconds) - build a toy UOV key at
      (q,v,m) = (16,3,3) and (16,4,3), compute P'_a O and O-perp explicitly,
      and verify the containment of Step 1 and the dimension bound of Step 2 by
      exhaustive linear algebra. A failure here refutes this record's
      mathematics at negligible cost.
      STAGE 3 (Macaulay ranks, the measurement) - for each core cell, build the
      derived system, the planted null, and the graded control arms; compute
      exact GF(q) Macaulay ranks at D = 2..d_reg + 1; report deficits and
      ratios. THE NULL ARM IS BUILT, RUN, AND ITS VERDICT RECORDED BEFORE THE
      TREATMENT ARM IS LOOKED AT.
      STAGE 4 (optional, budget permitting) - extend to (9,6) and (10,7) and
      report whether any gap seen at Stage 3 grows, shrinks or is flat in cell
      size. A gap that does not decay as the system grows is the canonical
      artifact tell named in inventor-protocol section 3 and must be reported as
      such.
    controls:
      - >-
        NULL-P, THE PLANTED-SOLUTION NULL (matched, and it can fail). M
        uniformly random quadratic forms in N variables over F_q, each
        constrained to vanish at one uniformly random projective point x*, so
        the arm matches the treatment on (M, N, q, has-a-point). FORCED VALUE
        DERIVED BEFORE THE RUN - first-fall degree equal to the frozen
        semi-regular d_reg of Step 6 at that cell, and deficit(D) = 0 for
        D < d_reg. This null CAN fail: if the planted point alone induces a
        degree fall the unplanted series does not predict, the null misses its
        frozen value and the whole comparison is rebuilt around the corrected
        reference.
      - >-
        NULL-U, THE UNPLANTED NULL (deliberately included as a demonstration of
        why it is the WRONG null). M uniformly random quadratic forms in N
        variables with no planted point. Its forced value is the same
        semi-regular d_reg. Reporting NULL-P and NULL-U side by side makes the
        matching argument checkable rather than asserted, and if they agree at
        every cell then the planting was not load-bearing and IDEA-20260801-014's
        simpler null was adequate after all - which is a finding about this
        record, and is reported as one.
      - >-
        POSITIVE CONTROL - THE ZERO-CONSTRAINT ARM, where the effect MUST
        appear. Build the treatment system with c = 0 imposed linear
        constraints, so N = n - 1 and the solution set has projective dimension
        at least t = 3m - n - 1 > 0. A positive-dimensional solution set forces
        the Hilbert function to stabilise to a polynomial of degree t, hence
        forces deficit(D) > 0 for all D beyond a computable degree. IF THE
        INSTRUMENT DOES NOT SEE A DEFICIT HERE IT IS BROKEN AND NO NEGATIVE
        RESULT MAY BE REPORTED FROM ANY ARM. Threshold declared before the run -
        deficit(d_reg) >= 1 at every cell with 3m - n >= 2.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. Sweep
        c = 0, 1, ..., 3m - n - 1 at cells (8,6) [t = 3,2,1,0] and (9,6)
        [t = 2,1,0] and report deficit(d_reg) against t. Derived expectation -
        strictly decreasing in c. A break at a specific t localises the
        obstruction to a specific solution dimension.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE CONCLUSION IS KNOWN FALSE. The cell
        (q,v,m) = (16,6,4) has 3m - n = 2 and (16,4,3) has 3m - n = 2, while
        (16,6,5) has 3m - n = 4. Pairs of cells with the SAME (M, N) but
        different surplus, and pairs with the same surplus but different
        (M, N), separate 'the instrument responds to the oil structure' from
        'the instrument responds to the shape of the system'. A method that
        cannot hold those pairs apart has not identified the load-bearing
        structure.
      - >-
        ORDERING CONTROL. The complete null arm - construction, ranks, digests -
        is committed and hashed before the treatment arm is constructed. Absence
        of that commitment invalidates the package.
      - >-
        ARCHIVE CHECK (zero compute). Every archived measurement of the same
        observable in this corpus is listed. NOT AVAILABLE - no solving-degree
        measurement on any multivariate system exists here, and
        src/ic_first_fall_fast.py is F_2-only and does not import. The
        unavailability is recorded rather than reported as a passed check.
    required_metrics:
      - d_ff and deficit(D) per arm per cell per seed, with the exact rank and the frozen sr_pred beside it
      - the nonzero-generator count of the treatment system, which must be exactly 3m - 2
      - the measured dimension of the unconstrained solution space against the derived bound 3m - n - 1
      - the number of invertible-polar-form trials needed to obtain L_1 and L_2
      - deficit(d_reg) as a function of t for the graded arm, with the monotonicity verdict
      - the in-harness recomputation of the Step-6 Hilbert table, with the series definition used
      - NULL-P and NULL-U side by side at every cell

  falsification_conditions:
    - >-
      Stage 2 measures dim(P'_a O intersect P'_b O) below 3m - n at any toy
      cell, or finds P'_a O not contained in O-perp. This record's mathematics
      is then wrong, everything downstream is void, and the correction is
      recorded as a superseding record.
    - >-
      The in-harness Hilbert recomputation at Stage 1 disagrees with Step 6.
      The frozen prediction is then wrong and must be reissued before Stage 3.
    - >-
      NULL-P misses its frozen first-fall degree at any core cell. No treatment
      conclusion may be drawn at that cell.
    - >-
      The zero-constraint positive control shows deficit(d_reg) = 0. The
      instrument cannot see a forced degree fall, so it cannot see an unforced
      one; nothing negative may be reported.
    - >-
      Treatment and null agree at every cell and every seed. The intersection
      system is then semi-regular over the tested range, the published
      extrapolation is calibrated at toy scale, and the deliverable is a
      controlled null - which is the outcome this proposal expects.
    - >-
      A treatment-null gap appears but does not decay as cell size grows, or
      grows without bound. Per inventor-protocol section 3 that pattern is the
      signature of an artifact and the finding is reported as a suspected
      instrument effect, not as a departure from semi-regularity.

  confounders:
    - >-
      TOY SIZE. At (v,m) = (3,3) the whole system is 7 equations in 3 variables
      and finite-size effects can dominate any structural effect. The ladder
      exists so that a gap can be seen to grow, shrink or stay flat; a gap
      visible only at the smallest cell is reported as a finite-size artifact.
    - >-
      CHOICE OF L_1 AND L_2. Different invertible combinations give different
      systems. Seeds fix the choice and at least two independent choices per
      cell are measured; if the deficit varies more between choices than between
      arms, the measurement is of the choice and must be reported that way.
    - >-
      THE SEMI-REGULAR CONVENTION ITSELF. 'sr_pred' has more than one convention
      in circulation (truncate-at-first-non-positive versus signed carry).
      Exactly one is frozen at Stage 1, written into the contract, and reported;
      a result that depends on which convention was chosen is not a result.
    - >-
      IMPLEMENTATION NOVELTY. There is no Groebner engine, no Sage, no sympy
      and no msolve in this container (SESSION-VERIFIED 2026-08-05), so the
      exact GF(q) Macaulay rank routine must be written from scratch. A
      first-run rank routine is the most likely source of a spurious deficit,
      which is why the positive control and NULL-P must both hit their derived
      values before any treatment number is read.
    - >-
      AUTHORSHIP ASYMMETRY. A record that finds a published model uncalibrated
      is more interesting than one that does not, and this proposal was written
      by the party that would benefit. The pre-registered prediction is
      'no gap', the null is committed before the treatment, and the expected
      outcome named in honest_prior_of_survival is the boring one.

  interpretation_limits:
    - >-
      TOY TIER, and no citation may raise it. Cells with m <= 7 and q = 16 say
      nothing directly about (256, 112, 44). Rule 4 and rule 7 of AGENTS.md
      apply with full force: a measured toy departure would be evidence that the
      semi-regular heuristic fails SOMEWHERE in this family, not evidence about
      any deployed parameter set.
    - >-
      A controlled null closes the tested toy range only. It does not establish
      semi-regularity at deployed sizes, where d_reg is 20 to 37 and the
      Macaulay matrix has 2^72 to 2^144 columns and can never be built.
    - >-
      Nothing here is an attack. No key is recovered, no signature is forged, no
      exponent is claimed to move by this proposal. The exponent AT STAKE is
      named in target_complexity; this proposal measures an input to it.
    - >-
      Every conclusion is conditional on the four parameter tuples of Step 6,
      which are RECALLED and UNVERIFIED, and on the in-harness reconstruction of
      Beullens's counts at Stage 0. If Stage 0 shows the published system is
      built differently, the measurement is of a different object and must be
      relabelled, not reinterpreted.

  heuristic_assumptions:
    - id: HEUR-UOV-A1
      statement: >-
        SEMI-REGULARITY OF THE DERIVED SYSTEM. For the k = 2 intersection system
        at parameters (q, n, m) with 3m > n, the Hilbert series of the ideal
        generated by the 3m - 2 quadratic forms in 2n - 3m variables agrees,
        degree by degree up to the first non-positive coefficient, with
        [(1 - z^2)^{3m-2} / (1 - z)^{2n-3m}]_+. Quantifiers - FOR ALL admissible
        (q, n, m) in the declared boundary and FOR ALL choices of two invertible
        polar-form combinations, not merely for some choice.
      rigorous_support: >-
        NONE, and this is the point of the proposal. The usual justification -
        a system of M random forms of fixed degrees in general position has the
        generic Hilbert series - does not apply, because Step 5(a) shows the 3m
        forms are three fixed congruence-twists of one m-dimensional pencil and
        are therefore not drawn independently. No rigorous statement is offered
        and none is recalled. This is the load-bearing assumption of the
        published cost model and it is being tested, not assumed.
      validation_plan: >-
        Stage 3 measures it directly at seven toy cells against NULL-P. The
        heuristic is refuted over the tested range if the treatment first-fall
        degree is strictly below the frozen value at three or more cells while
        NULL-P is at its frozen value.
    - id: HEUR-UOV-A2
      statement: >-
        MATCHED-NULL SUFFICIENCY. A random quadratic system over F_q with the
        same (M, N) and one planted projective point has the same graded
        Macaulay rank profile as the intersection system would have if the
        intersection system carried no structure beyond having a point.
      rigorous_support: >-
        Partial and stated as partial. The planting matches the ONE structural
        feature that provably distinguishes the treatment from an unplanted
        random overdetermined system. It does NOT match the pencil structure of
        Step 5(a), and it is not supposed to - that is the difference the
        experiment measures. What is unsupported is the stronger claim that
        planting is the ONLY relevant match; NULL-U is run beside NULL-P
        precisely so that claim is measured rather than assumed.
      validation_plan: >-
        Report NULL-P and NULL-U at every cell. If they agree everywhere, the
        planting was not load-bearing; if they differ, the size of the
        difference is the calibration of this heuristic.
    - id: HEUR-UOV-A3
      statement: >-
        TOY-TO-DEPLOYED DIRECTIONALITY. If the intersection system is
        semi-regular at every cell with m <= 7 over F_16, that is evidence -
        not proof - that it is semi-regular at m = 44 over F_256.
      rigorous_support: >-
        NONE. This is the extrapolation the goal exists to make explicit, and
        this program has a documented record of exactly this kind of
        extrapolation failing under measurement (ANGLE-BRIEF section 2 T-G lists
        several). It is stated here as a numbered heuristic so the eventual cost
        model can carry it visibly instead of inheriting it silently.
      validation_plan: >-
        Report the deficit as a function of cell size and of q, and state the
        trend. A flat trend across the ladder is weak support; a trend that
        moves with size is a reason to refuse the extrapolation outright. No
        deployed-parameter statement may be made from this experiment either way.
    - id: HEUR-UOV-A4
      statement: >-
        PARAMETER PROVENANCE. The four tuples (256,112,44), (16,160,64),
        (256,184,72) and (256,244,96) are the UOV round-3 parameter sets.
      rigorous_support: >-
        NONE. They are RECALLED-UNVERIFIED. RQ-UOV-001 records that no round-3
        specification has been read by this program and that csrc.nist.gov is
        unreachable under the network policy, while ANGLE-BRIEF section 1
        reports arXiv, ePrint abstract pages and author-hosted copies reachable.
        One tuple recalled in this same session, (16,112,44), FAILS the
        arithmetic consistency check derived in IDEA-20260805-69af7c and is
        therefore certainly not a level-I set; that is direct evidence that
        recall alone is not reliable here.
      validation_plan: >-
        Stage 0 obtains the specification and replaces the tuples. The toy
        ladder does not depend on them at all, so Stage 3 can proceed while
        Stage 0 is outstanding; only the deployed-parameter table does.

  proof_search_map_note: >-
    Carried on the paired hypothesis H-UOV-4d1377 rather than duplicated here.

  target_complexity:
    time_exponent: >-
      The exponent at stake is the one in UOV's key-recovery cost, currently
      quoted as 3 * C(N + d_reg - 1, d_reg)^omega * C(N+1,2) field
      multiplications with N = 2n - 3m and d_reg read off the semi-regular
      series - SESSION-COMPUTED as 2^158.0, 2^198.4, 2^242.3 and 2^304.0 at the
      four recalled tuples with omega = 2. THIS PROPOSAL MOVES NO EXPONENT. It
      measures whether d_reg is the value the model assumes. A measured d_reg
      one below the frozen value at the deployed shape would move the cost by
      2*log2(C(N+d-1,d)/C(N+d-2,d-1)) - about 9 bits per unit at
      (M,N) = (130,92) - so the quantity under audit is worth roughly 9 bits of
      claimed security per integer, and the whole claimed margin over NIST
      level I at that tuple is about 15 bits.
    memory_exponent: >-
      Not moved here, and charged in the companion proposal
      IDEA-20260805-69af7c: the same model requires C(N + d_reg - 1, d_reg)
      field elements of working memory, SESSION-COMPUTED as 2^72.2 at
      (M,N) = (130,92). Stating time without it is the omission that
      IDEA-20260805-69af7c exists to repair.
    best_known: >-
      For UOV key recovery, the intersection attack at k = 2 as modelled above,
      with Kipnis-Shamir at about q^{n-2m-1} * m^4 and reconciliation as the
      cross-checks. Every one of these figures is derived or recalled in this
      session and none is read from a source.
    hidden_overhead: >-
      omega is a convention, not a measurement - omega = 2 is assumed above and
      is optimistic. Field multiplications versus NIST gate counts is a second
      convention worth about 2^8 at q = 256. Both are named rather than absorbed.
    tradeoff_note: >-
      The time figure above is the zero-memory-budget corner. See
      IDEA-20260805-69af7c for the measured trade curve.

  dominated_by: >-
    n/a - no result and no attack is claimed; this is a measurement of an input
    to a published model. ROWS ACTUALLY CHECKED, so the null is not an unchecked
    one. On TIME for UOV key recovery at the recalled tuples, using only
    quantities derived or recomputed in this session: the intersection attack at
    k = 2 (2^158.0 at (256,112,44), omega = 2); Kipnis-Shamir at
    q^{n-2m-1} * m^4 (2^205.8 at the same tuple); the direct full-oil-space key
    equation, m*m(m+1)/2 quadratics in v*m unknowns, whose semi-regular cost is
    SESSION-COMPUTED at 2^553.8 and which is therefore dominated by everything.
    On MEMORY: the intersection attack needs 2^72.2 field elements, Kipnis-Shamir
    needs polynomial memory, so THE TWO ARE PARETO-INCOMPARABLE and neither
    dominates - a fact no record in this corpus states, and the reason
    IDEA-20260805-69af7c exists. On DATA/QUERIES: all three are key-only
    attacks needing zero signatures, so that axis does not separate them;
    signature-based routes were not costed here and are declared UNCHECKED
    rather than dismissed. Rows NOT checked and declared so: rectangular
    MinRank (a Rainbow attack, relayed as not applying to plain UOV - unverified),
    quantum variants, and anything in the round-3 specification's own table,
    which has not been read.
  sota_delta: >-
    Quantitatively zero on every attack axis - no time, memory, data or query
    figure is improved by this proposal, and none is claimed. The deliverable is
    a number with an error bar attached to a heuristic that currently has
    neither: the semi-regular d_reg at seven toy cells (frozen values 2, 3, 3,
    3, 4, 5, 4) either measured to hold or measured to fail by a stated integer.
    Against the corpus the delta is larger and is stated exactly: this corpus
    contains zero solving-degree measurements on any multivariate scheme, so the
    first admissible cell moves that count from 0 to 1 and gives the three
    dependent goals a convention they currently do not have.

  estimated_cost:
    implementation: >-
      medium-high. An exact GF(q) Macaulay rank routine must be written from
      scratch - there is no Sage, no sympy and no msolve in this container
      (SESSION-VERIFIED). Roughly 400 lines - GF(16)/GF(256) log tables, monomial
      indexing, Macaulay assembly, blocked elimination over numpy uint8.
    compute: >-
      low. The largest core cell's Macaulay matrix is 4576 x 3003 over F_16
      (about 7 MB unpacked); the optional (9,6) cell is 29120 x 18564 (about
      540 MB) and is explicitly outside the completion gate.
  recommended_priority: high
  honest_prior_of_survival: >-
    0.20 that a reproducible treatment-null first-fall gap of at least 1 appears
    at three or more core cells. It is not lower because the pencil structure of
    Step 5(a) is real and specific rather than a hand-wave - three congruence
    twists of one m-dimensional space is exactly the sort of dependency
    semi-regularity forbids - because ePrint 2026/298 is relayed as having
    already found structured UOV-like systems behaving unlike semi-regular ones
    in a neighbouring construction, and because no one in this corpus has ever
    looked. It is not higher because the intersection attack is well studied by
    people who would have noticed a solving-degree anomaly at these sizes, and
    because the design's most likely failure is mundane - a first-run rank
    routine producing a spurious deficit, which is why the positive control
    gates every negative. Separately: 0.90 that the experiment reaches a
    decisive readout at all, since Stages 1 and 2 are arithmetic and the largest
    core matrix is 4576 x 3003.
