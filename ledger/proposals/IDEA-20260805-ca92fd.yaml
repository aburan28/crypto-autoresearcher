  literature_context:
    - >-
      KN-LIT-4397, 'Improved cryptanalysis of UOV and Rainbow', Ward Beullens.
      NOT READ. The entry in this corpus carries year null, venue null, all four
      identifiers null, and the standard 2026-07-24 bulk-seeding disclaimer
      ('claims are relayed from the paper's abstract without independent
      verification') while its machine-readable field says
      citation_verified read. Its relayed abstract states that the paper gives
      the intersection attack against UOV and Rainbow and a rectangular MinRank
      attack against Rainbow, and quotes cost reductions of 2^17, 2^53 and 2^73
      at the round-2 parameter sets for levels I, III and V. THOSE THREE NUMBERS
      ARE RELAYED AND ARE NOT USED ANYWHERE IN THIS PROPOSAL. Reading this paper
      and reconciling its equation and variable counts with the Step-3/Step-4
      derivation is Stage 0 of the experiment.
    - >-
      ePrint 2026/298, Furue and Ikematsu, CRYPTO 2026, on UOV over
      p^ell-truncated polynomial rings. ABSTRACT ONLY, relayed through
      scratchpad/scout/ANGLE-BRIEF.md section F7, which itself records the
      abstract as unread beyond its summary. Relayed content - the intersection
      attack outperforms reconciliation in that framework and reduces several
      parameter sets below their claimed security, and the framework does NOT
      improve on MAYO and QR-UOV 'because their parameter sets do not yield a
      large enough LINEAR SOLUTION SPACE for the intersection attack'. That last
      clause names a measurable quantity, and Step 2 of the mechanism identifies
      it - the linear solution space is I_k, of dimension at least
      (2k-1)m - (k-1)n. NOTHING IN THIS PROPOSAL DEPENDS ON THE RELAYED CLAIM;
      it is recorded because if the identification is right, the same integer
      that gates this experiment also gates the three dependent goals, and
      checking that is a named forward action.
    - >-
      ePrint 2025/739, RELAYED via ANGLE-BRIEF F7 only, reported to conclude
      that current MQ parameters resist an extended rectangular MinRank attack.
      Recorded as a candidate matched NEGATIVE control for a different attack
      family. NOT READ.
    - >-
      No NIST UOV Round-3 specification has been read by this program.
      RQ-UOV-001 says so explicitly, and the four parameter tuples in Step 6 are
      RECALLED-UNVERIFIED. IDEA-20260805-69af7c derives a cheap arithmetic
