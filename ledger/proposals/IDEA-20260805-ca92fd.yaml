idea:
  id: IDEA-20260805-ca92fd
  question_id: RQ-UOV-001
  added: '2026-08-05'
  title: >-
    Derive the intersection attack's system from the oil space rather than
    quoting it, then measure the solving degree of THAT system against a
    planted-solution null - because a UOV public key is designed to look
    semi-regular and measuring it measures nothing
  class: measurement

  claim: >-
    The quantity that carries UOV's published key-recovery exponent is not the
    public map. It is the derived quadratic system produced by the intersection
    attack, and that system can be written down from the definition of the oil
    space with no citation at all. DERIVED IN THIS RECORD (see mechanism, and
    verify it - it is four lines): if O is the m-dimensional oil space and P'_a
    is the polar form of the a-th public quadratic, then P'_a O is contained in
    O-perp for EVERY a; O-perp has dimension n - m; so any two invertible polar
    forms give dim(P'_a O intersect P'_b O) >= 3m - n, and the k-fold version
    gives (2k-1)m - (k-1)n. That surplus is exactly the freedom that lets the
    attacker impose extra linear constraints, and it yields a system of
    M = m*k(k+1)/2 - k(k-1) quadratic equations in N = kn - (2k-1)m variables.
    For k = 2 that is M = 3m - 2 and N = 2n - 3m. The published cost model then
    assumes this system is SEMI-REGULAR and reads its solving degree off the
    Hilbert series [(1-z^2)^M / (1-z)^N]_+. The system is not obviously
    semi-regular: its 3m equations are three congruence-twists,
    L_i^{-1} P_l L_j^{-1}, of ONE m-dimensional pencil of forms, and it has a
    solution by construction while a random system of the same shape (M > N)
    has none. This proposal measures the departure at toy sizes against a null
    matched on all four of (M, N, q, has-a-solution), with the semi-regular
    prediction derived and frozen before any run. Both outcomes are deliverables:
    agreement calibrates the model that MAYO, QR-UOV and SNOVA all inherit;
    departure moves the exponent in the direction the model does not cover.

  object_first_candidate:
    tracked_object: >-
      The chain of subspaces O -> P'_a O -> I_k = intersect_a P'_a O, and then
      the graded rank profile of the Macaulay matrix of the system whose
      solution set is I_k. The object followed through the computation is the
      RANK DEFICIT at each degree D, deficit(D) = sr_pred(M, N, D) - rank(D),
      where sr_pred is the semi-regular prediction. The whole proposal is about
      one integer per degree per cell.
    established_families_off_limits: >-
      Off-limits as the PRIMARY lens for this proposal - each may appear only as
      a matched baseline whose cost is quoted, never as the mechanism: (1) the
      Kipnis-Shamir invariant-subspace attack and every q^{n-2m-1}-style
      guess-and-check descendant; (2) rectangular / support-minors MinRank
      including the Rainbow-specific rectangular MinRank; (3) the reconciliation
      attack in its one-vector-at-a-time form; (4) direct signature forgery and
      Thomae-Wolf underdetermined-system reduction; (5) implementation attacks -
      fault, side channel, randomness reuse; (6) lattice reductions of any kind.
      Also off-limits as the primary lens: the quotient-ring compression of
      QR-UOV (that object belongs to GOAL-QRUOV-001) and the whipping map of
      MAYO (GOAL-MAYO-001). What is NOT off-limits, deliberately, is the
      intersection attack itself - because this proposal does not offer a new
      attack in that family, it audits the SOLVING-DEGREE HEURISTIC the family's
      published cost rests on, and auditing a family from inside is the one move
      the off-limits rule does not forbid.
    newness_score: >-
      The subspace containment P'_a O subset O-perp is elementary and certainly
      known to the designers - it is the reason the parameter condition n >= 3m
      appears in the first place. The equation and variable counts are, on
      recollection, the same counts the published analysis uses; that
      coincidence is recorded here as CORROBORATION OF THE DERIVATION, never as
      a citation, and reconciling the two is a stage of the experiment. What
      this corpus does not contain, verified by grep on 2026-08-05 across
      ledger/, experiments/ and knowledge/, is any measurement of a solving
      degree on any multivariate-signature system at all: the only
      solving-degree instrument here (src/ic_first_fall_fast.py) is Boolean by
      construction and does not import. So the measurement is new to this
      program even though the algebra is not new to the field.
    testability_score: >-
      Very high and cheap. Stage 1 is integer arithmetic on a Hilbert series and
      can terminate the line. Stage 2's largest core cell is a 4576 x 3003
      matrix over F_16.
    survival_score: >-
      The tracked object survives to the end by construction - deficit(D) is
      defined at every degree and for every arm. The risk is the opposite one,
      that it is CONSTANT across arms, which is precisely what the null measures.

  mechanism: >-
    DERIVED IN-REPO ON 2026-08-05. No source was read for any step below. Every
    number marked SESSION-COMPUTED was produced by a script in this session's
    scratchpad using only Python's standard library; those scripts are not
    committed and must be re-implemented inside the harness before any run
    cites them.

    SETUP. Let q be the field size, m the number of equations, v the number of
    vinegar variables, n = v + m. The public key is P = (p_1, ..., p_m), each
    p_l a quadratic form on F_q^n. The secret is a subspace O of F_q^n with
    dim O = m such that p_l vanishes identically on O for every l. Write
    P'_l(u, w) = p_l(u + w) - p_l(u) - p_l(w) for the polar form and P'_l for
    its matrix. Vanishing on O gives u^T P'_l w = 0 for all u, w in O.

    STEP 1 - THE CONTAINMENT. Fix a and w in O. Then u^T (P'_a w) = 0 for every
    u in O, i.e. P'_a w lies in O-perp, the orthogonal complement of O under the
    standard dot product. Hence
      P'_a O  subset  O-perp   for every a,   dim O-perp = n - m = v.
    This is the whole structural content and it is three lines.

    STEP 2 - THE SURPLUS. If P'_a is invertible then dim P'_a O = m. Two
    m-dimensional subspaces of a v-dimensional space meet in dimension at least
    2m - v = 3m - n. More generally k of them meet in dimension at least
      dim I_k >= km - (k-1)v = (2k-1)m - (k-1)n.
    The attack is possible exactly when this is positive, i.e. when
    n < (2k-1)m/(k-1); for k = 2 that is the familiar n < 3m. This is a
    DERIVATION of the parameter condition, not a quoted one.

    STEP 3 - THE SYSTEM. Choose invertible L_1, ..., L_k among the polar forms
    (or invertible combinations of them) and seek x in intersect_i L_i O. Write
    u_i = L_i^{-1} x, each of which must lie in O. The complete list of
    conditions is one block of m equations for each unordered pair {i, j},
    i <= j, of indices:
      p_l(u_i) = 0                for i = j,  l = 1..m
      P'_l(u_i, u_j) = 0          for i < j,  l = 1..m
    giving m*k(k+1)/2 equations, each quadratic in x. They are not independent.
    Suppose L_i = P'_{a_i}. Take the cross block {i, j} at l = a_i. Then
      P'_{a_i}(L_i^{-1}x, L_j^{-1}x) = x^T L_i^{-1} P'_{a_i} L_j^{-1} x
                                     = x^T L_j^{-1} x.
    In ODD characteristic that equals the diagonal-block equation {j, j} at
    l = a_j, which is x^T L_j^{-1} P'_{a_j} L_j^{-1} x = x^T L_j^{-1} x - so it
    is a DUPLICATE. In characteristic 2, which is the deployed case, L_j^{-1} is
    alternating and x^T L_j^{-1} x is IDENTICALLY ZERO - so it is a VACUOUS
    equation. Either way it is lost. For each ordered pair (i, j) with i != j
    the same computation returns the same equation x^T L_j^{-1} x, so the loss
    is k - 1 copies for each of k values of j:
      M = m*k(k+1)/2 - k(k-1),      M = 3m - 2 at k = 2.
    Note the char-2 subtlety that the two dispositions differ: an implementation
    that builds the system in odd characteristic and one that builds it over
    F_16 lose the SAME COUNT for DIFFERENT REASONS, and an implementation that
    silently keeps a 0 = 0 row will inflate its row count by exactly 2. That is
    a checkable integrity condition, listed in required_metrics.

    STEP 4 - THE VARIABLES. The system is homogeneous in x, so one degree of
    freedom goes to projectivisation. Step 2 guarantees the solution space has
    projective dimension at least (2k-1)m - (k-1)n - 1, so the attacker may
    impose that many further independent linear constraints and still expect a
    solution. Hence
      N = (n - 1) - [(2k-1)m - (k-1)n - 1] = kn - (2k-1)m,
      N = 2n - 3m at k = 2.
    Both counts now rest on Step 1 alone.

    STEP 5 - THE HEURISTIC THAT CARRIES THE EXPONENT. The published cost model
    treats this system as semi-regular: the Hilbert series is
    [(1 - z^2)^M / (1 - z)^N]_+, the solving degree d_reg is the index of the
    first non-positive coefficient, and the linear-algebra cost is of the form
    3 * C(N + d_reg - 1, d_reg)^omega * C(N+1, 2) field multiplications. THAT
    HEURISTIC IS THE ENTIRE EXTRAPOLATION. It is assumed, not measured, and
    ANGLE-BRIEF section 2 T-E records semi-regularity as an unnamed assumption
    inherited by 24 files in this corpus with no heuristic record type to hold
    it. Two specific reasons to doubt it HERE, both structural and both stated
    so a reviewer can attack them.
      (a) THE PENCIL. The 3m equations are not 3m independent generic forms.
      They are the images of ONE m-dimensional pencil span{P'_1..P'_m} under
      three fixed congruences A -> L_i^{-1} A L_j^{-1}. Semi-regularity is a
      statement about systems in general position; three twisted copies of one
      m-dimensional space are not in general position in any obvious sense, and
      whether that produces syzygies below the semi-regular degree is an
      empirical question nobody in this corpus has asked.
      (b) THE SOLUTION. A random system with M > N over F_q has no F_q-point
      with overwhelming probability, so the semi-regular series correctly
      predicts a Groebner basis of {1}. The intersection system HAS a point by
      construction. The correct matched null is therefore NOT a random system of
      the same (M, N, q) but a random system of the same (M, N, q) WITH A
      PLANTED PROJECTIVE POINT. Getting this wrong is the single most likely way
      to produce a spurious effect, and the naive design gets it wrong.

    STEP 6 - THE FORCED VALUES, SESSION-COMPUTED, FROZEN BEFORE ANY RUN. For
    k = 2 the derived (M, N) and the semi-regular d_reg are, at RECALLED and
    UNVERIFIED candidate parameter sets (see heuristic_assumptions HEUR-UOV-A4 -
    the tuples are NOT read from the specification and every conclusion is
    conditional on them):
      (q=256, n=112, m=44):  3m-n = 20,  M = 130, N = 92,  d_reg = 20
      (q=16,  n=160, m=64):  3m-n = 32,  M = 190, N = 128, d_reg = 24
      (q=256, n=184, m=72):  3m-n = 32,  M = 214, N = 152, d_reg = 30
      (q=256, n=244, m=96):  3m-n = 44,  M = 286, N = 200, d_reg = 37
    and the corresponding omega = 2 costs are 2^158.0, 2^198.4, 2^242.3,
    2^304.0 field multiplications. Toy cells, where d_reg is a small integer and
    the Macaulay matrix fits in a laptop, are (q=16) (v,m) =
    (3,3)->d_reg 2, (4,3)->3, (5,4)->3, (6,5)->3, (7,5)->4, (6,4)->5,
    (8,6)->4, (9,6)->5, (10,7)->5. THESE ARE THE NUMBERS THE MEASUREMENT MUST
    REPRODUCE OR CONTRADICT.

    STEP 7 - WHAT A DEPARTURE WOULD MEAN. If the measured first-fall degree of
    the treatment system is strictly below the frozen semi-regular value at
    three or more toy cells while the planted null matches it, then the
    published cost model overstates the attack's cost at those cells, the
    overstatement is measured rather than argued, and the direction of the error
    is the dangerous one. If instead treatment and null agree everywhere, the
    result is a CONTROLLED NULL - the first measured calibration point this
    program has for any multivariate scheme, and the shared baseline the three
    dependent goals were told to consume.

