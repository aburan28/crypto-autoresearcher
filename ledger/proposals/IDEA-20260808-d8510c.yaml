  goal_id: GOAL-P13-001
  title: 'The one unproven step in the only viable proof route for Heuristic 1 is a second-moment
    bound, and it is a countable object: pairs of trace-zero conjugate isogenies are rank-2
    sublattices of the Gross lattice with prescribed determinant pair, so E[N^2] is a Brandt-matrix
    product and the disjointness assumption becomes a falsifiable pair-correlation measurement.'
  class: mechanism
  claim: 'This program''s own analysis (research/P13-HEUR-001/heuristic_analysis.md, Route
    (b)) established that the FIRST moment of the number of B-smooth conjugate isogenies of
    degree <= (p/2)^{1/3} coincides, via Eichler class numbers H(4np), with Heuristic 1''s
    asserted probability -- so Heuristic 1 is EXACTLY the statement Pr[count >= 1] ~ E[count],
    i.e. near-disjointness. It then records: "a second-moment bound ... requires counting
    PAIRS of trace-0 inseparable endomorphisms of two smooth degrees -- i.e., rank-2 sublattices
    of O^T with prescribed determinant pair; expressible via higher Brandt matrices/genus
    theory but NO READY-MADE FORMULA RETRIEVED". CLAIM: the missing object is not exotic and
    admits an explicit shape. For distinct degrees m, n the number of pairs (alpha, beta)
    of trace-zero elements of the two-sided ideal P with Nrd(alpha) = pm, Nrd(beta) = pn,
    summed over all maximal orders with the usual 1/|Aut| weights, equals the (m, n) entry
    of a bilinear expression in Brandt matrices -- concretely Tr(B(m) J B(n) J)-type traces,
    J the Frobenius permutation matrix -- and each such trace is again a sum of Hurwitz class
    numbers by Eichler-Selberg. CONSEQUENCE, and this is the falsifiable part: E[N^2] - E[N]^2
    - E[N] is controlled by the OFF-DIAGONAL of that bilinear form, which is exactly the quantity
    measuring whether "E has a conjugate isogeny of degree m" and "... of degree n" are positively
    correlated. The claim is that this correlation is O(1/log p) uniformly for smooth m, n
    <= (p/2)^{1/3}, which is sufficient for Pr[count >= 1] = (1+o(1)) E[count] and therefore
    for Heuristic 1 at the exponent level.'
  mechanism: 'THREE STEPS, EACH SEPARATELY CHECKABLE. (1) THE PAIR IS A SUBLATTICE. If alpha,
    beta are two trace-zero elements of the rank-3 lattice R = P^{Trd=0} with norms pm, pn,
    then Z alpha + Z beta is a rank-2 sublattice of R whose Gram matrix is (pm, t; t, pn)
    for the integer t = Trd(alpha bar-beta). So counting PAIRS is counting rank-2 sublattices
    with prescribed diagonal -- i.e. counting representations of binary forms by the ternary
    form Q''. Binary-by-ternary representation numbers are exactly what Brandt matrices and
    the Shimura correspondence count, and the constraint |t| <= 2 p sqrt(mn) is the only inequality
    needed. (2) THE GLOBAL COUNT IS A CLASS NUMBER, TWICE. The single-degree count is sum_E
    m_E(-4pn)/|Aut| = h(-4pn) * (local factor at p) by Eichler''s optimal embedding formula,
    and the p-factor is 1 because p | disc. The pair count replaces one class number by a
    sum over t of class numbers of the DISCRIMINANT of the binary form, disc = t^2 - 4p^2
    mn, which is the same Eichler-Selberg shape one level up. Nothing new is needed beyond
    the identification. (3) WHERE THE CORRELATION LIVES. Positive correlation would mean:
    curves that admit a degree-m conjugate isogeny disproportionately admit a degree-n one.
    There is one mechanism that plainly produces it and it must be subtracted first -- COMPOSITION:
    if alpha has norm pm then alpha composed with a small endomorphism has norm p m k^2, so
    the degrees m and m k^2 are perfectly correlated. The claim is therefore stated for m/n
    not a square ratio, and the square-ratio family is the pre-registered POSITIVE CONTROL:
    the measurement must detect maximal correlation there or it has no power.'
  why_not_a_renamed_known_approach: The nearest known work is this program's own Route (b),
    which names the gap and stops. The nearest external work is the Eichler-Selberg / Brandt-matrix
    trace formula, which is classical -- the record does not claim to invent it. What is new
    here is the IDENTIFICATION of Heuristic 1's residual gap with a specific off-diagonal
    of a specific bilinear form, plus a measurement design that can see the correlation at
    crypto scale using the paper's own sampler. It is not the first-moment computation (already
    in the corpus, and the record says so and consumes it).
  predictions:
  - observable: Empirical pair-correlation of the indicators 1{exists conjugate isogeny of
      degree m} and 1{... degree n}, over the Deuring-sampled maximal orders at SQIsign-sized
      p.
    metric: Pearson correlation of the two indicators, and the ratio Pr[both] / (Pr[m] Pr[n]).
    predicted: Ratio 1 + O(1/log p) for m/n not a square ratio, and STRICTLY greater than
      1 by an O(1) amount when n = m k^2 (the composition family).
  - observable: Second-moment ratio E[N^2] / (E[N]^2 + E[N]) at radius (p/2)^{1/3}
    metric: dimensionless ratio
    predicted: 1 + o(1). A ratio persistently above 1.3 across two crypto-sized primes would
      show clustering strong enough to make Pr[count >= 1] materially smaller than E[count],
      which would WEAKEN Heuristic 1 -- the direction that matters for defenders and the one
      this program has never tested.
  - observable: the composition-family positive control
    metric: measured correlation at n = 4m
    predicted: Large and positive, at least 0.5. If it is not, the instrument has no power
      and no negative result may be reported.
  minimal_test: 'Zero-compute arm first: write the pair count as a binary-by-ternary representation
    problem and check it against a brute-force enumeration at a toy prime (p <= 10^4, where
    the full supersingular set and all maximal orders are enumerable in pure Python via the
    corpus''s existing build_isogeny_graph.py plus a quaternion arm). Only then the crypto-scale
    arm: on the SAME Deuring samples S1-01 and S1-13 need, record for each sampled order the
    full multiset of short-vector norms, and compute the empirical pair statistics. No new
    sampler is required -- this is a re-analysis of one artifact.'
  controls:
  - 'POSITIVE CONTROL (must fire): the composition family n = m k^2, where the correlation
    is forced to be large by algebra. An instrument that does not detect it is broken.'
  - 'NULL OBJECT: the identical pair statistics computed on random integral ternary forms
    of determinant p/4 that are not ideal forms. The correlation there is whatever generic
    lattice geometry produces; the arithmetic signal is the EXCESS over that null, not the
    raw value.'
  - 'SHUFFLE NULL: permute the largest-prime-factor labels across sampled orders and recompute.
    Any correlation surviving the shuffle is a pipeline artifact.'
  - 'TOY GROUND TRUTH: at p <= 10^4 the exact answer is computable by exhaustive enumeration;
    the crypto-scale estimator must reproduce it there.'
  confounders:
  - Sampling maximal orders "uniformly up to conjugation" is itself an assumption (catalogue
    C1-8 owns the sampler-fidelity question). A biased sampler manufactures correlation. This
    record CONSUMES C1-8's question and must not be run before it, or must carry its own fidelity
    gate.
  - 'Factoring the norms is the expensive step and its failures are not random: a norm whose
    factorisation times out is disproportionately non-smooth, so dropped samples bias the
    smoothness statistics UPWARD. The pre-registered rule must be to record a timeout as "not
    B-smooth for every B below the partially-factored cofactor", never to drop it.'
  falsification_conditions:
  - The positive control does not fire -- no negative may then be reported.
  - The pair count cannot be written as a binary-by-ternary representation count because Trd(alpha
    bar-beta) fails to be an integer of the claimed range. This kills step (1) at the whiteboard.
  - Measured excess correlation over the null is bounded away from zero and GROWS with p across
    the two crypto-sized primes. Heuristic 1 is then weakened in tested scope -- a scoped
    negative under AGENTS.md rule 6, and the most valuable outcome available here.
  interpretation_limits: 'This is a PROOF-ROUTE and MEASUREMENT record, not an attack. It
    cannot prove Heuristic 1: even a perfect second-moment bound leaves the smooth-weighted
    L(1, chi) moments unproved (Route (b)''s item (ii)). Its deliverable is to convert one
    of the two named residuals from "no formula retrieved" into a countable object with a
    measurement attached. Nothing here changes any exponent or any concrete cost.'
  assumptions:
  - Eichler's optimal-embedding class-number formula in the form relayed by research/P13-HEUR-001
    (CITED-NOT-VERIFIED in this corpus; verification is a step of the test, not an assumption
    of the result).
  - That the Deuring-side sampler used is the paper's Section 4.2 sampler and reproduces its
    published tail facts.
  heuristic_assumptions:
  - id: HA-3
    statement: PAIR NEAR-INDEPENDENCE. For B-smooth m != n with m/n not a square ratio and
      mn <= p^{2/3}, Pr[E admits conjugate isogenies of both degrees] = (1 + O(1/log p)) Pr[degree
      m] Pr[degree n], uniformly in p.
    rigorous_ingredient: The first moments themselves, which are class numbers h(-4pn) with
      Siegel/Dirichlet bounds, and the crude second-moment upper bound coming from the Gram
      inequality |t| <= 2p sqrt(mn), which bounds the number of admissible t and hence E[N^2]
      by a sum of O(p sqrt(mn)) class numbers.
    distribution_imitated: The classical heuristic that representations of distinct integers
      by a fixed quadratic form are asymptotically uncorrelated -- the same shape as the Hardy-Littlewood
      circle-method independence used for sums of two squares.
    validation_route: Crypto-scale, via the Section 4.2 Deuring sampler at p = 5*2^248-1 (100,000
      orders) and p = 27*2^500-1 (10,000 orders), measuring the empirical ratio against the
      composition-family positive control and the random-ternary-form null. Toy ground truth
      at p <= 10^4 by exhaustive enumeration, LABELLED TOY.
    tail_checks: In the deep tail (both degrees smooth, joint probability ~10^{-4}) the Poisson
      prediction and the clustered alternative differ by a factor of several; the 500 smoothest
      samples that the source already zooms on in Figures 1-2 are exactly the right subsample.
  target_complexity:
    time_exponent: n/a -- no algorithm is proposed. The record bears on whether the p^{1/3+o(1)}
      tier's stated conditionality is well founded.
    memory_exponent: n/a
    best_known_baseline: Heuristic 1 currently has NO proof route beyond Route (b)'s first
      moment, and this program holds no evidence bearing on it (KN-TECH-058 applicability
      limits).
    hidden_overhead_disclosure: If the correlation is positive and growing, the correct 1/P0
      is LARGER than the source's, i.e. the attack is weaker than advertised, and the superpolynomial
      overhead grows. That direction is the one a defender cares about and the one this program
      has never checked.
    time_memory_tradeoff: n/a
  sota_delta: 'Zero attack delta. On the evidence axis: converts one of the two named unproved
    ingredients of the only viable proof route from "no formula retrieved" into a specific
    bilinear-form off-diagonal with a crypto-scale measurement design and a positive control.'
