        dimension (F0), 200 per cell, fixing the binomial band.
      - >-
        Ordinary curve of the same n for every family (blocking for the
        b = 1 reading).
      - >-
        Extreme-value prediction reported beside every family maximum with
        the family size N.
      - >-
        Relabelled Z/NZ control: not applicable (no group-structure claim;
        the density is a field-coordinate property), stated rather than
        omitted.
    required_metrics:
