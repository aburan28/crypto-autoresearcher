      ordinary and Koblitz F0 nulls differ -- the trace/inversion
      instrument is wrong, nothing read.
      FALSIFICATION THRESHOLD, fixed before any run: the 0.75 maximum at
      (17, 8) for F1, the +3 dimension for F3, each replicated at a second
      n.
      COST (estimate, order of magnitude): implementation low (a density
      driver on the existing field arithmetic); compute low, F1 at n = 17,
