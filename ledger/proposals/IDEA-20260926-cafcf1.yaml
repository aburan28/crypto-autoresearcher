  heuristic_assumptions:
    - id: H1
      statement: >-
        (H_random.) For V drawn uniformly among dimension-l subspaces of
        ker Tr, the abscissa count is Binomial(2^l - 1, 1/2) to within the
        variance, and the maximum over an enumerable family of size N of
