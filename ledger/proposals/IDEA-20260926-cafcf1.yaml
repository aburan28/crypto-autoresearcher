  proof_search_map:
    bottleneck: >-
      Whether any constructible subspace family at dimension l <= n/2 has
      abscissa density beyond the binomial extreme-value prediction, given
      that the Weil bound does not forbid it.
    baseline_embedding:
      parameter_slice: >-
        l = n (the whole field): density exactly 1/2 - 1/2^n on E_0 (the
        Kloosterman sum K(0) = -1), reproduced by (B) with V^perp = {0}.
        l = 1: V = {0, v}, density 0 or 1 trivially, which (B) permits
        (bound vacuous) -- the sanity anchor that the vacuity is real.
      reproduction_check: >-
        Zero compute. (i) Verify the abscissa condition on E_0 over F_4
        (Tr(omega) = Tr(omega^2) = 1, so omega is an abscissa; #E_0(F_4)
        = 8 by the trace recursion t_2 = -3, consistent with 3 abscissae x
        in {0, 1, omega, omega^2} minus the excluded ... re-derived by the
        executor by direct point count). (ii) At n = 17 count abscissae of
        RC-1's V = {deg < 9} exactly and compare with 2^8 = 256; the
        deviation must be within the toy binomial band, and KN-FIND-5a8d3e's
        instances (built on that V) fix the number.
    observation_collision:
      observable: >-
        The abscissa density of V, and its maximum over a family, per (n,
        l, family, curve).
      distinct_preimage_search: >-
        A high density can come from (i) genuine structure in the family
        (H_struct), or (ii) the family being large enough that the extreme
        value alone reaches it (H_random with large N). Separated by
        reporting the family size N and the extreme-value prediction
        1/2 + sqrt(2 ln N / 2^{l+1}) beside every maximum, and by the
        ordinary-curve control, on which (ii) gives the same maximum and
        (i) need not.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold l fixed and vary the family: random subspaces (null),
          multiplicative shifts c U of one U over all c in F^*, subspaces
          spanned by weight-1 and weight-2 normal-basis vectors, and a
          greedy construction inside {x : Tr(1/x) = 0}. The intrinsic
          invariant distinguishing them is the excess of the maximum
          density over the extreme-value prediction.
        predicted_gain: >-
          None beyond 2^m in yield even in the best case; the transform
          exists to make the Weil-free regime measured rather than
          asserted.
    quantifier_order: >-
      (B) is FORALL n, FORALL subspaces V of dimension l inside ker Tr: the
      abscissa count is 2^{l-1} + E with |E| <= 2^{n/2} (arithmetic on a
      recalled bound). (D) is EXISTS a family and a toy cell at which the
      maximum density exceeds the extreme-value prediction by the stated
      threshold -- the record PREDICTS its negation (H_random) for the
      three families named, and a positive is bounded by 2^m in yield.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At n in {17, 19, 23}, l in {6, 8, 9}, the maximum abscissa density
        over [family] is [value] against an extreme-value prediction of
        [value], on E_0 and on the ordinary control alike." Ceiling on the
        attack: a factor at most 2^m in relation yield, 4 bits at m = 4,
        never an exponent; the record certifies nothing about l = 33 at
        n = 131 beyond the vacuity of the bound.
      nearby_object_control: >-
        BLOCKING. The ordinary curve of the same n (RC-1's curve at n = 17;
        the BRIEF's n = 19 cell) with condition Tr(x) + Tr(a) + Tr(b/x^2) =
        0: the same Fourier argument with K_b(lambda) = sum (-1)^{Tr(lambda
        x + b/x^2)}, the same vacuity, the same binomial null. If a family
        shows excess density on E_0 and not on the ordinary control, the
        excess reads b = 1 specifically and is the H_struct outcome; if it
        shows excess on both, the excess is a property of the family's
        Fourier support, not of the Koblitz curve.
    proof_obligations:
      - claim: x != 0 is an abscissa of E_0 iff Tr(x) = Tr(1/x) (re-derived in claim A).
        responsibility: correctness
      - claim: The Fourier identity and the resulting bound |E| <= 2^{n/2} (claim B).
