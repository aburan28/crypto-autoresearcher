idea:
  id: IDEA-20260926-cafcf1
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE ABSCISSA DENSITY OF A SUBSPACE FACTOR BASE IS NOT CONTROLLED BY THE
    WEIL BOUND AT ANY INDEX-CALCULUS DIMENSION ON ECC2K-130: x is an abscissa
    of E_a iff Tr(x) + Tr(1/x) = Tr(a) (reading b = 1 and a exactly), the
    count over a subspace V of dimension l is 2^{l-1} + O(2^{n/2}) by a
    Kloosterman-sum Fourier argument, and that error term exceeds the main
    term for every l <= n/2 + 1, i.e. l <= 66 at n = 131 -- so the yield
    scalar lambda_x is a free design parameter there, bounded only by 2^m
  class: control
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (the abscissa in any
    F_2-basis); the attack stage whose charged quantity is at issue is
    FACTOR-BASE MEMBERSHIP, specifically the fraction of a subspace V that
    consists of abscissae of the curve, which multiplies the relation yield
    by (density / (1/2))^m.
    (A) THE MEMBERSHIP CONDITION, RE-DERIVED. On E_a: y^2 + xy = x^3 + a x^2
    + b over F_{2^n}, put y = xz for x != 0: x^2 z^2 + x^2 z = x^3 + a x^2 +
    b, so z^2 + z = x + a + b/x^2, solvable in F_{2^n} iff Tr(x + a + b/x^2)
    = 0. For ECC2K-130, b = 1 and Tr(1/x^2) = Tr(1/x), so x != 0 is an
    abscissa of E_0 iff Tr(x) = Tr(1/x), and of E_1 iff Tr(x) + Tr(1/x) = 1.
    The two Koblitz twists partition F_{2^131}^* by the value of the
    Frobenius- and inversion-invariant bit phi(x) = Tr(x) + Tr(1/x). This is
    the one place in the pipeline that reads b = 1 literally (b/x^2 becomes
    1/x) and a through Tr(a); IDEA-20260922-1a081a's curve-blindness C1 says
    the filed cost laws see the curve only through the yield scalar
    lambda_x, and this record is about exactly that scalar.
    (B) THE FOURIER ARGUMENT, ZERO COMPUTE. Let V be an F_2-subspace of
    dimension l with V inside ker Tr (costs one dimension and makes the E_0
    condition Tr(1/v) = 0). Write f(x) = (-1)^{Tr(1/x)} for x != 0. Then
    sum_{v in V} f(v) = 2^{l-n} sum_{lambda in V^perp} K(lambda) with
    K(lambda) = sum_{x != 0} (-1)^{Tr(lambda x + 1/x)} a Kloosterman sum,
    |K(lambda)| <= 2^{n/2 + 1} for lambda != 0 (Weil bound, recalled) and
    K(0) = -1. Hence #{v in V : Tr(1/v) = 0} = 2^{l-1} + E with |E| <=
    2^{n/2} (up to the 2^{l-n} term), and the bound is VACUOUS -- it does
    not exclude density 0 or density 1 -- exactly when 2^{l-1} <= 2^{n/2},
    i.e. l <= n/2 + 1. At n = 131 that is every l <= 66; the m = 4 factor
    base has l about 33 and the m = 3 base l about 44. At the toy n = 17 it
    is every l <= 9, which includes RC-1's l = 9.
    (C) CONSEQUENCE FOR THE FILED RECORDS. IDEA-20260922-1a081a's heuristic
    HB1-2 ("yield parity, lambda_x(K-m)/lambda_x(B-m) in [1/4, 4]") gives as
    its rigorous support that the E-side indicator's character sum over a
    subspace "is a subspace Kloosterman sum bounded by Weil at 2 sqrt(q)";
    IDEA-20260915-8fe0ef's H1 uses the same analogue. By (B) that support
    is void at every index-calculus dimension on ECC2K-130 and on every
    FIPS row (l about m/m_a <= m/2): the band may still hold, but not for
    the stated reason. This record states the correction so the reviewed
    cluster does not carry it forward.
    (D) THE DISCRIMINATING QUESTION, AND ITS CEILING. Since Weil does not
    constrain, the abscissa density of a dimension-33 subspace at n = 131
    could in principle be anything in [0, 1]. Two explanations: (H_random)
    every subspace family an attacker can construct has density
    1/2 + O(2^{-l/2}) (the binomial null), and the maximum over any
    enumerable family of size N is the extreme-value 1/2 + sqrt(2 ln N /
    2^{l+1}); or (H_struct) some algebraically structured family (the
    multiplicative shifts c U of a fixed subspace U, subspaces spanned by
    low-weight normal-basis vectors, subspaces inside {x : Tr(1/x) = 0}
    built greedily) attains density bounded away from 1/2 by more than the
    extreme-value prediction. The CEILING is stated first: density 1 buys a
    factor 2 per summand, i.e. 2^m in yield and 2^m fewer attempts -- 4 bits
    at m = 4 -- and nothing more; against a 60-bit gap this is nothing, and
    the record is a control on the yield column, not an attack. It reads
    the curve coefficients where 1a081a says nothing else does.
    WHAT EACH OUTCOME MEANS. H_random confirmed at toy n across all three
    families: lambda_x is Weil-free in principle but binomial in practice
    for constructible V, the [1/4, 4] band of HB1-2 is re-supported by
    measurement rather than by a vacuous bound, and the yield column keeps
    its 1/2^m factor. H_struct: a named family with excess density, worth
    at most 2^m, entered as a constant-factor yield lever with the family
    named. Artifact: the ordinary control curve of the same n (generic b,
    condition Tr(x) + Tr(a) + Tr(b/x^2) = 0, the same Kloosterman structure
    with b in the numerator) shows a DIFFERENT density distribution from the
    Koblitz curve for the same families -- which would mean the family
    reads b in a way (B) does not predict, and is reported as a defect until
    explained.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the abscissa as a field element in a
    chosen basis; the density question is basis-independent (Tr and 1/x
    are), the normal-basis family is one of the three structured families
    tested. Operation set Sigma = {sigma, x -> 1/x}: phi(x) = Tr(x) +
    Tr(1/x) is invariant under both (Tr(x^2) = Tr(x); 1/x swaps the two
    terms), and x -> 1/x is translation by the 2-torsion point T = (0, 1)
    on the x-line (IDEA-20260922-29b1c5 (A) with b = 1; re-derived this
    session: lambda = (y + 1)/x gives x(P + T) = 1/x). Trichotomy: Class
    III, COORDINATE-DEPENDENT -- the tracked quantity (the density of a set
    of field elements) is a function of the representation of the factor
    base, not of any group element; the record places itself there and
    claims no partial action.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The projection x -> phi(x) discards
    everything but one bit (2^130 to 1), is Sigma-compatible (both
    generators fix phi), and is lossy in the representation used. It is the
    twist selector E_0 versus E_1 on the x-line, i.e. the block system of
    <T, sigma> on abscissae composed with the rational/non-rational
    distinction of the ordinate. Passing the test here certifies only that
    phi is a legitimate one-bit object; the record's content is the
    quantitative statement (B) about how phi distributes over subspaces.
    PRICE THE ONE OPEN NUMBER. The open number is the maximum abscissa
    density over a constructible family at dimension l, measured at toy n
    against the binomial extreme-value null; canonicalisation is trivial
    (one trace and one inversion per element).
    KN-OPEN-020 CLASS. No factor base is proposed; the record audits the
    yield of the bounded-degree (affine) class every filed line already uses.
    OFF-LIMITS COMPONENTS DECLARED. F2 as the family whose yield column is
    audited; the 2-torsion translation of IDEA-20260922-29b1c5 as the
    symmetry that makes phi inversion-invariant.
