      c U of one random U (all c); F2 subspaces spanned by weight-1 and
      weight-2 vectors of a constructed normal basis; F3 greedy inside the
      abscissa set (10^4 restarts). Dimensions l in {6, 8, 9} at n = 17,
      {6, 8, 10} at n = 19, {8, 10, 11} at n = 23. Seeds 2026092671..,
      recorded. Instrument: experiments/EXP-CERTBIN-e94b27/impl/gf2n.py
      (trace, inversion; generalised to n = 19, 23) plus a density driver
      of about 100 lines; no solver is needed (`missing:` nothing).
      Metrics: abscissa count per V, density, family maximum, extreme-value
      prediction, greedy dimension; all exact integers.
      STAGE 0 (zero compute): the derivations of (A) and (B); the vacuity
      table l <= n/2 + 1 for n in {17, 19, 23, 131}; the reproduction check.
      STAGE 1: anchor on RC-1's V.
      STAGE 2: F0 null at every (n, l) to fix the binomial band empirically.
      STAGE 3: F1, F2, F3 on E_0 and on the ordinary control, maxima with
      their extreme-value predictions.
      STAGE 4: three-row reading.
      OUTCOME TABLE. POSITIVE (H_struct): a named family exceeds the
      extreme-value prediction by the thresholds above on E_0 and not on
      the ordinary control at two n -- entered as a constant-factor
      (<= 2^m) yield lever that reads b = 1, family named. NEGATIVE
