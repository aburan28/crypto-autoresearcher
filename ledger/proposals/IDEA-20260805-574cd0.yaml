idea:
  id: IDEA-20260805-574cd0
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  added: '2026-08-05'
  title: >-
    Audit the constraint this goal inherited: "the algebra is closed at about 17
    bits" is arithmetically correct and its argument proves something weaker
    than its conclusion -- supply the missing step for the subfield family,
    and name the three map classes the constraint does not reach

  class: closure_audit

  claim: >-
    GOAL-MLKEM-005 inherits a constraint that governs which mechanisms may be
    proposed for it at all: "THE ALGEBRA IS CLOSED at about 17 bits. Every
    algebraically derived instance ... is a Z_q-linear function of the original
    samples with the error the same function of the original error, so the
    posterior on s is unchanged and all structure gains are work-reuse gains
    bounded by the isometry count 2n*phi(2n) = 2^17. Do not re-propose
    algebraic structure attacks." THREE SEPARABLE CLAIMS ARE PACKED IN THERE
    AND THEY HAVE DIFFERENT STATUSES.
    (1) THE ARITHMETIC IS RIGHT, and confirmed here: for n = 256, 2n = 512 and
    phi(512) = 256, so 2n*phi(2n) = 131072 = 2^17 exactly; the group generated
    by multiplication by +/- X^i and by the Galois maps X -> X^j (j odd) is a
    semidirect product whose two factors intersect trivially (a Galois map
    fixes 1, a nontrivial unit multiplication does not), so the order is
    exactly 2^17 and not less.
    (2) THE ARGUMENT PROVES A DIFFERENT THEOREM FROM THE ONE STATED. "The
    posterior on s is unchanged" is an INFORMATION statement; "all structure
    gains are work-reuse gains" is a COMPUTATION statement; sufficiency does
    not imply computational equivalence, and the standard counterexample class
    is precisely the maps that change the DIMENSION of the instance while
    preserving the posterior. The constraint's own antecedent -- "Z_q-linear
    with the error the same function of the original error" -- silently
    restricts to ISOMETRIES, which is exactly the class for which the
    conclusion is easy and is not the class the prohibition ranges over.
    (3) FOR THE ONE FAMILY THE GAP MOST OBVIOUSLY ADMITS, THE CONSTRAINT'S
    CONCLUSION IS TRUE AND THIS PROPOSAL SUPPLIES THE MISSING PROOF. The
    subfield/trace descent from R = Z_q[X]/(X^n+1) to R' = Z_q[Y]/(Y^{n/2}+1),
    Y = X^2, satisfies Tr(b)/2 = b_0, and the descended sample reads
    b_0 = a_0 s_0 + Y a_1 s_1 + e_0: IT IS EXACTLY THE EVEN-COEFFICIENT
    PROJECTION. Half the samples are discarded, BOTH halves of the secret
    survive so the secret dimension is unchanged at n, and the retained error
    coefficients are the original ones so the noise is unchanged. A strict
    loss, proved rather than asserted. VERIFIED SYMBOLICALLY AND NUMERICALLY
    HERE at n = 8, q = 3329.
    The deliverable is a constraint that a future Coordinator can rely on
    because it has an argument, together with the enumeration of what it does
    NOT cover: nonlinear maps (the compression and rounding maps of FIPS 203),
    dimension-INCREASING maps, and modulus switching. NO ALGEBRAIC STRUCTURE
    ATTACK IS PROPOSED HERE AND NONE IS IMPLIED; the constraint is audited,
    not defied.

  object_first_candidate:
    tracked_object: >-
      THE MAP ITSELF -- a morphism phi from the ML-KEM sample space to another
      instance space -- carrying three attributes followed through the
      composition: (posterior preservation, sample count, secret dimension).
      The tracked object is not an instance and not a statistic; it is the
      transformation, and the computation it is followed through is
      composition of transformations. Its one-step propagation rule is explicit
      and is what makes the object usable: composing two maps multiplies the
      sample-count ratios and adds the secret-dimension changes, and posterior
      preservation is preserved under composition. That closure property is
      what lets a finite argument cover an infinite family, and it is the
      reason the constraint COULD be true; the audit's job is to check whether
      the argument as written actually uses it.
    established_families_off_limits: >-
      OFF LIMITS AS THE PRIMARY LENS, AND MORE STRICTLY HERE THAN ANYWHERE ELSE
      IN THIS BATCH: every attack family, including and especially the
      algebraic structure attacks the constraint prohibits. This proposal
      neither proposes nor rehabilitates a ring, Galois, CRT, subfield or
      module-rebasing attack. It examines an argument. Also off limits:
      dual/FFT, primal/uSVP, hybrid MITM, decryption failures, side channels,
      the class-group/PIP family.
    newness_score: >-
      The mathematics is elementary and certainly known -- Galois isometries of
      power-of-two cyclotomics, and the observation that the trace to the index-
      2 subfield is the even-coefficient map, are textbook. What is not in this
      corpus is the AUDIT: a check of whether the program's own inherited
      constraint is supported by its own stated argument, with the gap named
      and the missing step supplied for one family. The ANGLE-BRIEF records
      DEC-20260805-2be965's red team finding four of five of another goal's
      named obstructions defective on audit, which is the base rate that makes
      this worth an afternoon.
    testability_score: >-
      Total, and free. Every claim is either a finite group-order computation,
      a polynomial identity, or a counting bound; all three are exact in pure
      Python and two of the three were checked before this record was written.
    survival_score: >-
      The tracked object survives arbitrarily long compositions by the closure
      property above, which is why the constraint has a chance of being true in
      general. It dissolves at the boundary of linearity, which is exactly
      where the three uncovered classes live.

  mechanism: >-
    DERIVED AND CHECKED HERE on 2026-08-05 (SCOUT-COMPUTED; re-run in-harness
    before citation).

    PART 1 -- THE GROUP ORDER IS EXACTLY 2^17, AND HERE IS WHY IT IS NOT LESS.
    R = Z[X]/(X^n+1), n = 256. The ring automorphisms are sigma_j : X -> X^j
    for j odd mod 2n, a group of order phi(2n) = phi(512) = 256. The units
    +/- X^i give a group U of order 2n = 512, and every sigma_j normalises U.
    A sigma_j fixes 1; multiplication by u = +/- X^i sends 1 to u, which
    equals 1 only for u = 1. So the two subgroups intersect trivially and the
    group they generate is a semidirect product of order 512 * 256 = 131072 =
    2^17 exactly. Both maps are ISOMETRIES of the coefficient embedding (a unit
    multiplication is a signed cyclic shift; a Galois map is a permutation of
    coefficients up to sign), and the CBD law is invariant under signed
    coordinate permutations, so the error law is preserved exactly, not merely
    in norm. THE CONSTRAINT'S NUMBER IS CORRECT AND ITS ISOMETRY CLAIM IS
    CORRECT.

    PART 2 -- THE QUANTIFIER GAP, WRITTEN OUT.
    What the argument establishes:
      FORALL isometric Z_q-linear phi, FORALL instances I,
      posterior(s | phi(I)) = posterior(s | I).
    What the constraint concludes:
      FORALL algebraically derived instances, the achievable computational
      gain is at most 2^17.
    The second does not follow from the first for two independent reasons.
    (a) THE CLASS IS WIDER THAN THE ANTECEDENT. "Algebraically derived" ranges
    over maps that are not isometries -- CRT projections, subfield descents,
    module rebasings with non-unimodular change of basis, modulus switching --
    and for those the antecedent "the error is the same function of the
    original error" is FALSE as an isometry statement even when it is true as
    a linear-algebra statement.
    (b) SUFFICIENCY IS NOT COMPUTATIONAL EQUIVALENCE. An unchanged posterior
    means no information is lost or gained. It does not mean the cost of the
    best algorithm that extracts it is unchanged. This is not a quibble: the
    entire lattice-attack literature is about instances whose posterior is
    fixed and whose attack cost varies by an exponential factor with the
    dimension and the noise rate. A map that halves the dimension while
    preserving the posterior would be a real speedup and would violate the
    constraint's conclusion while satisfying its premise.
    THE AUDIT DOES NOT CLAIM SUCH A MAP EXISTS. It claims the constraint as
    written does not exclude one, and that the exclusion is what a Coordinator
    relying on the constraint believes it has.

    PART 3 -- CLOSING THE MOST OBVIOUS HOLE, WITH A PROOF.
    The natural candidate for a dimension-halving map is the subfield descent.
    Let sigma : X -> -X, an automorphism for n even, with fixed subring
    R' = Z_q[Y]/(Y^{n/2}+1), Y = X^2. Write a = a_0(Y) + X a_1(Y) and likewise
    for s, e, b. Then
      Tr_{R/R'}(b) = b(X) + b(-X) = 2 b_0(Y),
    and since q is odd, dividing by 2 is legal, so the descent map is exactly
    b -> b_0: THE EVEN-COEFFICIENT PROJECTION. Applying it to b = a s + e:
      a s = (a_0 s_0 + Y a_1 s_1) + X (a_0 s_1 + a_1 s_0),
      hence b_0 = a_0 s_0 + Y a_1 s_1 + e_0.
    VERIFIED NUMERICALLY at n = 8, q = 3329 with a random a, s and a CBD-like
    e: the identity holds exactly.
    THE BOOKKEEPING, WHICH IS THE WHOLE POINT.
      samples:            n  ->  n/2      (HALVED -- the odd part b_1 is thrown away)
      secret dimension:   n  ->  n        (UNCHANGED -- both s_0 and s_1 remain unknown)
      noise per coefficient: sigma -> sigma  (UNCHANGED -- e_0 is a subset of e)
      modulus:            q  ->  q        (unchanged)
    So the descended instance is an LWE instance with the SAME secret
    dimension, the SAME noise, and HALF the data. Fewer samples at fixed
    dimension and fixed noise is strictly harder, never easier. The subfield
    descent is a STRICT LOSS, and iterating it down the tower compounds the
    loss. THIS IS THE ARGUMENT THE CONSTRAINT NEEDED AND DID NOT HAVE, and it
    holds for the whole tower by induction on the same computation.

    PART 4 -- THE SECOND HOLE, AND ITS OWN OBSTRUCTION.
    The other dimension-reducing map available is the CRT projection
    R_q -> F_{q^2} onto one of the 128 quadratic slots (ord_512(3329) = 2, so
    X^256+1 splits into 128 irreducible quadratics; computed here). It is
    Z_q-linear and surjective, and it reduces the instance to rank k over
    F_{q^2}: dimension 2k instead of nk. Why does it not help? BECAUSE IT
    DESTROYS SMALLNESS, and the destruction is quantifiable. The CBD(3) ball
    has 7^256 = 2^{718.7} elements and one slot has |F_{q^2}| = 2^{23.40}
    elements, so the projection has about 2^{695} preimages per slot value and
    the image is essentially uniform: the projected "error" is not small, and
    an LWE instance whose error is uniform carries no recoverable secret.
    Making that quantitative -- bounding the statistical distance between the
    projected CBD ball and uniform on F_{q^2} -- is one of the audit's
    measurable deliverables and is the honest form of the folklore statement
    "you cannot attack ML-KEM slot by slot".

    PART 5 -- WHAT REMAINS OUTSIDE THE REPAIRED CONSTRAINT. FORWARD GUIDANCE,
    WHICH INVENTOR-PROTOCOL SECTION 4 REQUIRES OF ANY CLOSURE.
    (i) NONLINEAR MAPS. FIPS 203's Compress_d and Decompress_d are piecewise
    maps, not Z_q-linear, and the constraint's antecedent does not reach them.
    The ANGLE-BRIEF's traps table names exactly this as the residual of the
    "Coppersmith is blocked on ML-KEM" closure: "a genuinely nonlinear relation
    with a provably small unknown -- look at the compression/rounding maps".
    This audit does NOT open that lane; it records that the inherited
    constraint does not close it either, so a future proposal there is not
    forbidden by it.
    (ii) DIMENSION-INCREASING MAPS. Tensoring, ring-switching upward, and
    lifting to a larger cyclotomic all raise the dimension while preserving the
    posterior. The constraint's argument says nothing about them. They are
    usually a loss, but "usually" is not an argument and none is on record.
    (iii) MODULUS SWITCHING. It changes q, hence changes the lattice's volume
    and the noise-to-modulus ratio, and is not a Z_q-linear map of the sample
    space at fixed q at all. Outside the antecedent entirely.
    NONE OF THE THREE IS ASSERTED TO BE PROMISING. Each is recorded as
    uncovered, which is a different and weaker statement, and the difference is
    the whole content of a closure at the inventor-protocol standard.

  novelty_status: unverified
  novelty_screen_limits: >-
    The screen was: GOAL-MLKEM-005's own record (where the constraint lives),
    the four prior MLKEM proposals, and the ANGLE-BRIEF's traps table and
    standing-negatives section. It cannot see whether the constraint was
    audited in a session whose artifacts are not in this corpus, and it cannot
    see the external literature, where the subfield-descent bookkeeping is
    standard (subfield attacks on overstretched NTRU are the canonical case and
    are RELAYED, NOT READ here). The claim is narrow and exact: NO AUDIT OF
    THIS CONSTRAINT EXISTS IN THIS CORPUS.

  lossy_projection_identifiability_audit:
    projection: >-
      A candidate transformation phi of the ML-KEM sample space --> the triple
      (does phi preserve the posterior?, sample-count ratio, secret-dimension
      change).
    what_is_discarded: >-
      The transformation itself: its formula, its cost, its algebraic origin,
      everything except three bookkeeping quantities.
    why_genuinely_lossy: >-
      Enormously lossy -- infinitely many transformations share a triple. The
      Galois maps and the unit multiplications all share (yes, 1, 0), which is
      precisely the observation that makes them one family rather than 2^17
      separate cases.
    why_compatible_with_the_operations: >-
      The one operation that matters is COMPOSITION, and the triple propagates
      through it deterministically: posterior preservation is closed under
      composition, sample-count ratios multiply, secret-dimension changes add.
      That is a genuine propagation rule on the retained part alone, which is
      what the test asks for.
    is_it_only_a_change_of_coordinates: >-
      NO, and both failure modes were checked.
      (i) Nothing-discarded failure: three numbers cannot reconstruct a map.
      (ii) MIRROR FAILURE (constant across instances): CHECKED AND ABSENT, with
      the values exhibited. The isometry family gives (yes, 1, 0); the subfield
      descent gives (yes, 1/2, 0); the CRT slot projection gives (NO -- it
      destroys smallness -- , 1/128 of the samples in dimension 2k, secret
      dimension reduced to 2k); modulus switching gives (approximately, 1, 0)
      with a changed noise-to-modulus ratio that the triple does not capture,
      which is itself a recorded limitation of the projection. Four distinct
      values of the tracked object are on the table before any run, so the
      statistic is not constant -- and the fact that the constraint's own
      argument covers only the FIRST of the four is the finding.
    residual_risk: >-
      The triple is too coarse for modulus switching, as just noted. A future
      version needs a fourth coordinate (the noise-to-modulus ratio), and this
      record says so rather than pretending three suffice.

  assumptions:
    - >-
      That the constraint text quoted above is the operative one. It is quoted
      verbatim from ledger/goals/GOAL-MLKEM-005.yaml `inherited_constraints`,
      read in full on 2026-08-05. NO EDIT TO THAT RECORD IS PROPOSED OR MADE;
      an audit that disagrees with a committed record produces a superseding
      record through the Coordinator, never an edit.
    - >-
      That "the posterior on s" means the conditional distribution of s given
      the observed samples under the declared priors, and that "work-reuse
      gains" means amortisation across correlated instances. Both readings are
      inferred from the sentence and are the audit's first checkable step: if
      the author of the constraint meant something else, the audit's Part 2
      may be attacking a reading rather than a claim, and that possibility is
      recorded as the proposal's most likely single failure.
    - >-
      That q = 3329 is odd (so 2 is invertible and the trace can be divided)
      and that n is even (so X -> -X is an automorphism). Both immediate.

  proof_search_map_note: >-
    This proposal is closure-oriented, so a proof_search_map is required of the
    hypothesis that carries it forward. No hypothesis is minted for it in this
    batch -- the two hypotheses here serve IDEA-20260805-cdc87d and
    IDEA-20260805-1d76e9 -- and this is recorded as an open obligation rather
    than silently skipped: if a Coordinator promotes this audit, the map must
    be filled at that point, with the four audits instantiated as (1) baseline
    = the isometry family where the constraint's argument does hold; (2)
    observation collision = two maps sharing the triple but differing in attack
    cost, which is the whole question; (3) quantifier order = Part 2 above,
    already written; (4) method ceiling = the audit can certify a bookkeeping
    fact about named map families and can never certify that no algebraic
    speedup exists.

  predictions:
    - metric: >-
        AL-1 GROUP ORDER: |<+/- X^i, sigma_j>| for n = 256
      direction: different
      minimum_effect: >-
        EXACTLY 131072 = 2^17, with the semidirect-product structure and
        trivial intersection verified. FORCED. If the computed order is
        smaller, the constraint's headline number is wrong in the direction
        that makes the algebra MORE closed, and that correction is owed.
    - metric: >-
        AL-2 TRACE IDENTITY: the number of (a, s, e) triples at n in {8, 16, 32}
        for which Tr(b)/2 differs from a_0 s_0 + Y a_1 s_1 + e_0
      direction: lower
      minimum_effect: >-
        EXACTLY 0 out of at least 1000 random triples per n. FORCED; already
        confirmed at n = 8 before this record was written.
    - metric: >-
        AL-3 SUBFIELD BOOKKEEPING: (sample ratio, secret-dimension ratio,
        noise ratio) of the descent
      direction: different
      minimum_effect: >-
        EXACTLY (1/2, 1, 1). FORCED. Any other triple falsifies Part 3 and the
        constraint's most obvious hole reopens.
    - metric: >-
        AL-4 CRT UNIFORMITY: statistical distance between the image of the CBD
        secret law under one quadratic CRT projection and the uniform
        distribution on F_{q^2}, measured exactly at toy (n, q) and bounded at
        FIPS parameters
      direction: lower
      minimum_effect: >-
        Below 2^{-20} at the FIPS-scale bound. A measured distance ABOVE that
        at toy scale is not a falsification -- toy n has far less entropy to
        spread -- but the toy-to-FIPS trend must be decreasing in n, and a
        non-decreasing trend falsifies the smallness-destruction argument.
    - metric: >-
        AL-5 UNCOVERED-CLASS ENUMERATION: the number of map classes the
        constraint's antecedent provably does not reach, each with a witness
        map exhibited
      direction: higher
      minimum_effect: >-
        At least 3, each with an explicit witness (Compress_d; a tensoring or
        upward ring-switch; modulus switching). Fewer than 3 with witnesses
        means the audit failed to substantiate Part 5 and Part 5 must be
        withdrawn rather than softened.

  minimal_test:
    design: >-
      Three stages, cheapest first, all pen-and-paper or seconds of pure
      Python. STAGE 0 (zero compute): re-read the constraint verbatim, fix the
      reading of "posterior" and "work-reuse", and state Part 2's quantifier
      pair. If the intended reading makes Part 2 vacuous, STOP and record that
      -- the audit then finds the constraint sound as intended, which is a
      complete and useful outcome. STAGE 1 (seconds): AL-1, AL-2, AL-3.
      STAGE 2 (minutes): AL-4 at toy (n, q) by exact enumeration where the
      secret space is small enough, and by a derived entropy bound at FIPS
      parameters; AL-5's witness exhibition.
    controls:
      - >-
        NULL MAP (same shape, forced value pre-derived, CAN FAIL): the IDENTITY
        map, run through the same bookkeeping pipeline. Forced value
        (1, 1, 1) and posterior preserved. It can fail: a bookkeeping
        implementation that miscounts samples or dimensions will miscount here
        too, and this arm catches it before any real map is scored.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE CONCLUSION IS KNOWN FALSE
        (the effect MUST appear). A SYNTHETIC map that genuinely halves the
        secret dimension while preserving the samples -- for example, an
        instance in which half the secret coefficients are revealed -- must be
        scored by the pipeline as (1, 1/2, 1) and must be flagged as a real
        gain. IF THE BOOKKEEPING DOES NOT FLAG THIS, IT CANNOT DETECT THE VERY
        THING THE CONSTRAINT CLAIMS TO EXCLUDE, and no conclusion about any map
        family may be reported. This is the KN-TECH-1a5b7e sensitivity
        demonstration: removed object = half the secret, statistic = the
        dimension coordinate of the triple, response = 1 -> 1/2, declared
        before the run.
      - >-
        GRADED CONTROL, >= 3 interior points: the subfield tower descent
        applied 1, 2, 3 and 4 times (n -> n/2 -> n/4 -> n/8 -> n/16). The
        sample ratio must be exactly 2^{-j} at step j while the secret
        dimension stays exactly n at every step. Monotonicity reported. A
        non-geometric sample ratio or any drop in secret dimension localises an
        error to a specific step.
      - >-
        ARCHIVE CHECK (zero compute): enumerate every prior record in this
        corpus that cites the 2^17 figure or the constraint. Recorded as found
        or absent; no claim made from absence.
    required_metrics:
      - the computed group order with its factorisation and the intersection check
      - trace-identity mismatch counts per n
      - the bookkeeping triple for each of: identity, unit multiplication, Galois map, subfield descent (x4 levels), CRT slot projection, the synthetic positive control
      - the CRT statistical-distance measurement and its FIPS-scale bound, with the bounding argument written out
      - the uncovered-class list with one witness map each

  falsification_conditions:
    - >-
      The intended reading of the constraint already restricts to isometries
      explicitly. Part 2 is vacuous, the audit reports the constraint sound as
      intended, and Parts 3-5 stand as an elaboration rather than a repair.
      This is a real and likely outcome and it is not a failure.
    - >-
      AL-1 returns anything other than 2^17. The constraint's number is wrong
      and a correction is owed to the Coordinator.
    - >-
      AL-2 or AL-3 fails. Part 3's proof is wrong; the subfield hole reopens
      and becomes the highest-value item in this proposal.
    - >-
      The synthetic positive control is not flagged. Nothing may be reported.
    - >-
      A witness map is exhibited that is Z_q-linear, preserves the posterior,
      and strictly reduces the SECRET DIMENSION. The constraint is false as
      stated and this becomes the most important finding available to the goal.
      The audit is designed to look for this and expects not to find it.

  confounders:
    - >-
      READING THE CONSTRAINT UNCHARITABLY. A compressed sentence in a goal
      record is not a theorem statement, and attacking its literal quantifiers
      is easy and cheap. Stage 0 exists to fix the reading first, and the
      proposal's honest prior reflects the substantial chance that the intended
      reading is already the restricted one.
    - >-
      AUTHORSHIP ASYMMETRY, IN BOTH DIRECTIONS. Auditing another agent's
      constraint is cheap to produce and reads as rigour (the overclaim risk);
      and finding one's own program's constraint sound is comfortable (the
      premature-closure risk). The positive control and the explicit
      "constraint sound as intended" branch are there so both outcomes cost
      something to reach.
    - >-
      TOY-SCALE CRT MEASUREMENT. AL-4's exact enumeration is only possible at
      tiny n where the entropy argument is weakest. The FIPS-scale statement is
      a BOUND, not a measurement, and must never be cited as one.
    - >-
      THE TRIPLE IS TOO COARSE for modulus switching, as the projection audit
      records. Part 5 item (iii) is therefore listed as uncovered without the
      bookkeeping being able to say more.

  interpretation_limits:
    - >-
      NO ATTACK IS PROPOSED, NO ML-KEM PARAMETER SET IS AFFECTED, NO EXPONENT
      MOVES. This is an audit of an argument.
    - >-
      NO EDIT TO GOAL-MLKEM-005 IS PROPOSED OR PERFORMED. If the audit's
      conclusion warrants a change to the inherited constraint, that is a
      Coordinator decision producing a superseding record.
    - >-
      A repaired constraint is STILL A CONSTRAINT ON THIS PROGRAM'S SEARCH, not
      a theorem about ML-KEM. It says what this goal will not spend budget on
      and why; it does not say that no algebraic attack exists, and any citation
      that reads it that way is misusing it.
    - >-
      claim_tier ceiling: `derivation` for Parts 1-3 and 5, `toy_scale` for
      AL-4's measured half. This proposal does NOT satisfy GOAL-MLKEM-005's C2
      -- it measures no mechanism -- and the record says so rather than
      allowing an audit to be counted as a measurement.

  heuristic_assumptions:
    - id: HEUR-AL-1
      statement: >-
        NONE IS LOAD-BEARING FOR PARTS 1-3. The group order, the trace identity
        and the subfield bookkeeping are exact statements with elementary
        proofs, two of which were checked numerically before this record was
        written. This entry exists to record that the proposal is
        UNCONDITIONAL where it matters, and that the only genuinely uncertain
        input is an EVIDENTIARY one: what the constraint's author meant.
      rigorous_support: >-
        Semidirect product with trivial intersection (Part 1); Tr(b) = 2b_0 for
        the automorphism X -> -X with q odd (Part 3); direct expansion of a s
        in the (a_0, a_1) basis (Part 3).
      validation_plan: >-
        AL-1, AL-2, AL-3 as exact computations. Not distributional and not
        presented as such.
    - id: HEUR-AL-2
      statement: >-
        The image of the CBD secret law under a single quadratic CRT projection
        is within statistical distance 2^{-20} of uniform on F_{q^2} at FIPS
        parameters.
      random_model_justification: >-
        An entropy argument: the CBD(3) secret ball carries about 2.03 bits per
        coefficient over 256 coefficients against 2 log2 q = 23.40 bits in the
        slot, and the reduction map is surjective and Z-linear. Entropy alone
        does not give a distance bound -- a leftover-hash-style argument or an
        explicit Fourier bound is needed -- and that argument is OWED, not
        supplied here.
      validation_plan: >-
        Exact enumeration at toy (n, q) where the secret space is enumerable,
        plus writing the missing Fourier bound. If the bound cannot be written,
        AL-4 is reported as an entropy heuristic and Part 4 is downgraded from
        an obstruction to a plausibility argument -- which is exactly the
        distinction inventor-protocol section 4 requires of a closure.
      falsification_condition: >-
        A toy cell in which the projected distribution is measurably far from
        uniform and the distance does not decrease with n.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES and none is claimed. The proposal is an audit; its
      output is a constraint with an argument attached. State plainly: this is
      not exponent-first work, and it is proposed anyway because the constraint
      it audits GOVERNS which exponent-first proposals this goal is permitted
      to make, so an error in it is an error in the goal's entire search
      boundary.
    memory_exponent: n/a.
    best_known: n/a -- no algorithm is proposed or compared.
    hidden_overhead: >-
      The unwritten Fourier bound behind HEUR-AL-2, and the coarseness of the
      bookkeeping triple for modulus switching.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed), with the check listed. Rows examined for a prior
    result that would supersede this audit, across TIME, MEMORY and
    DATA/QUERIES: (i) the inherited constraint itself in
    ledger/goals/GOAL-MLKEM-005.yaml -- it is the OBJECT of the audit and
    cannot dominate it; (ii) the ANGLE-BRIEF's F4/F5 blocked-transfer list
    (B2 everything is smooth, B4 additive secret with no multiplicative split,
    B7 Maschke, B8 dense support, B9 Coppersmith degenerates to the primal
    attack) -- these are separate named obstructions for separate devices and
    none of them is the isometry-closure argument; (iii) KN-OPEN-012 and
    KN-OPEN-026 on structured-lattice discounts -- open, not closed, and
    KN-OPEN-026 explicitly flags its own transfer thesis as this program's
    unverified analogy; (iv) EV-MLKEM-001, which weakened IDEA-20260722-001's
    isometry-orbit amortisation and is the nearest prior work -- it addresses
    whether amortisation over the orbit BUYS anything, not whether the orbit
    argument PROVES what the constraint says it proves. NO ROW DOMINATES AND
    NONE IS DOMINATED; no attack is proposed.
  sota_delta: >-
    No attack; argument-quality contribution only, and it is quantifiable in
    exactly one way: the constraint currently governs the admissibility of
    every proposal made against this goal, and the audit either supplies the
    missing proof for the one map family that most obviously escapes its
    antecedent (a strict-loss bookkeeping triple of (1/2, 1, 1)) or exhibits a
    map that breaks it. Zero on every attack axis -- time, memory, data,
    queries, advice.

  estimated_cost:
    implementation: low
    compute: negligible
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.55 that the audit finds a real, non-cosmetic gap between the constraint's
    argument and its conclusion -- i.e. that stage 0 does not dissolve Part 2
    into a reading dispute. It is not higher because a compressed sentence in a
    goal record is not written as a theorem and its author very plausibly meant
    the restricted class; it is not lower because the sentence's own conclusion
    ("do not re-propose algebraic structure attacks") is a prohibition on a
    class strictly wider than its premise covers, and because the ANGLE-BRIEF
    records a red team finding four of five named obstructions defective on
    audit in a comparable case. 0.05 that a posterior-preserving,
    secret-dimension-reducing map is exhibited, which would be the largest
    single result available to this goal; it is not 0.00 because the audit is
    designed to look, and the honest reason it is low is that half a century of
    lattice cryptanalysis has not found one.
