idea:
  id: IDEA-20260829-9b19cc
  question_id: RQ-MLDSA-ffa0f5
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'
  title: >-
    The ML-DSA verifier never sees the context string or the pre-hash function -
    both arrive out of band - so the ONLY thing binding a signature to its
    interpretation is the injectivity of the message representative
    M' = variant || len(ctx) || ctx || [OID ||] PH(M). Certify that injectivity
    by exhaustive argument over the approved table, exhibit a WITNESSED
    collision on each of four named ablations so the instrument is proved to
    fire, and publish the (parameter set x pre-hash) table where FIPS 204
    permits message binding at 2^(n/2) below the set's own 2^lambda.
  class: measurement

  claim: >-
    (A) THE SPECIFICATION CLAIM. RECALLED, NOT FETCHED THIS SESSION. FIPS 204
    signs not M but a message representative built by prefixing a domain
    separator: for pure ML-DSA, a 0x00 byte, then a one-byte context length,
    then the context, then M; for HashML-DSA, a 0x01 byte, the same length and
    context, then a DER object identifier for the pre-hash function, then the
    digest. Neither the context nor the identity of the pre-hash function is
    carried in the signature. The verifier is TOLD both by its caller. So the
    verifier checks neither, and cannot: a wrong context or a wrong pre-hash
    produces a verification failure that is indistinguishable from an invalid
    signature. That is a checkable statement about a document and about an
    algorithm's interface, and it is where this record's document claim stops.

    (B) THE DERIVABLE HALF, WHICH THE STANDARD APPEARS TO ASSERT RATHER THAN
    PROVE. The security value of the prefix construction is exactly the
    INJECTIVITY of the map (variant, ctx, payload) to M'. It is provable in two
    lines given the one-byte length field: the first byte recovers the variant,
    the second recovers |ctx|, and the split of the remainder is then forced.
    An analogous but genuinely non-trivial question sits one level down inside
    HashML-DSA: is the map (OID, M) to OID || PH(M) injective ACROSS the whole
    approved pre-hash table? A collision needs two approved entries whose
    identifier-plus-digest byte strings coincide, which is impossible when the
    identifiers have equal length and possible in principle when they do not.
    This is decided by an exhaustive comparison over the approved table - about
    ten entries - and the resulting certificate is a machine-checkable artifact,
    not a verdict.

    (C) THE QUANTITATIVE HALF, WHICH IS THE ONE WITH AN EXPONENT. HashML-DSA's
    message binding cannot exceed the collision resistance of the chosen
    pre-hash. For an n-bit pre-hash output that is 2^(n/2) work, against the
    2^lambda the parameter set advertises with lambda = 128 / 192 / 256 at
    ML-DSA-44 / -65 / -87. CLAIM, FALSIFIABLE BY READING ONE TABLE: the set of
    (parameter set, approved pre-hash) pairs for which n/2 is strictly less than
    lambda is NON-EMPTY, and its size is at least 2 - because a 256-bit pre-hash
    gives 128-bit collision resistance and is expected to be approved for use
    with ML-DSA-65 and ML-DSA-87, whose lambda are 192 and 256. THE OPPOSITE
    OUTCOME IS EQUALLY REPORTABLE AND EQUALLY USEFUL: if the approved table
    forbids every mismatched pair, then the standard has DERIVED the constraint
    rather than asserted it, and the correct deliverable is that closure with
    its table.

    (D) THE ARTIFACT, AND WHY IT IS NOT A VERDICT. For each of four named
    ABLATIONS of the message representative - drop the variant byte; drop the
    context length byte; drop the object identifier; truncate the pre-hash - the
    experiment EXHIBITS a concrete witness: two distinct inputs mapping to one
    representative, and, for the truncation ablation, an actual pair of distinct
    messages sharing one verifying ML-DSA signature. Each witness is a byte
    tuple a second, independently written implementation re-checks in
    microseconds. THE INSTRUMENT IS THEREFORE PROVED TO FIRE BEFORE ANY NEGATIVE
    IS REPORTED, which is the condition this lane has just been reminded is not
    optional.

    NOT A BREAK. No claim is made that FIPS 204's own construction collides, and
    none is made about MLWE, MSIS or SelfTargetMSIS in any direction. The
    truncated-pre-hash collision is exhibited on a DELIBERATELY NON-CONFORMING
    instantiation whose only purpose is to demonstrate that the counter counts.

  mechanism: >-
    (1) WHY THIS OBJECT IS NEW TO THE LANE. All twelve filed proposals live
    strictly inside the signing loop, the t0 channel, or the signature byte
    string. Not one of them mentions the context string, the domain separator,
    HashML-DSA, or the pre-hash - a targeted grep over ledger/proposals for
    those terms returns only unrelated ML-KEM and EdDSA records. The tracked
    object here is the MESSAGE REPRESENTATIVE as a byte string, followed
    backwards: given M', what set of (variant, ctx, PH, M) tuples produced it.
    That object exists entirely OUTSIDE the lattice part of the scheme and is
    consumed before the first ring operation, which is why no prior record's
    machinery touches it.

    (2) THE LOSSY PROJECTION, STATED CAREFULLY BECAUSE IT IS THE EASIEST PLACE
    TO FOOL ONESELF. The projection sends the whole signing input - a key, a
    context, a message of arbitrary length, a choice of variant and pre-hash -
    to the single byte string M'. It is severely lossy for the pure variant only
    in that M' contains M verbatim; it is MASSIVELY lossy for HashML-DSA, where
    an arbitrarily long M collapses to n bits. The discard is COMPATIBLE with
    the target's operations because everything downstream of M' - mu, the
    challenge, the whole signing loop and the whole verifier - is a function of
    M' alone. That is exactly why the injectivity of the map INTO M' is the
    entire security content of the construction, and why a collision in it is a
    complete break of message binding with no lattice work at all. A projection
    that would FAIL the test: tracking the pair (ctx, M) itself, which loses
    nothing and is a change of coordinates. A projection that would fail
    differently: tracking mu = H(tr || M'), which is lossy but whose fibres are
    computationally inaccessible, so its one-step propagation cannot be measured
    - and measurability is precisely what M' has and mu does not.

    (3) THE INJECTIVITY ARGUMENT, IN THE FORM AN AUDIT CAN EXECUTE. Write M' =
    b || L || ctx || P where b is one byte, L is one byte, |ctx| = L, and P is
    the payload. Given M', b and L are read off, ctx is the next L bytes, and P
    is the rest. So the decomposition is unique and the map is injective on
    (b, ctx, P). Injectivity on (variant, ctx, PH, M) then reduces to
    injectivity of P as a function of (PH, M), which is the identity for the
    pure variant and is OID || PH(M) for the hashed variant. The remaining
    obligation is therefore exactly the cross-identifier question in claim (B),
    and it is finite.

    (4) THE FOUR ABLATIONS, EACH OF WHICH MUST PRODUCE A WITNESS.
    A1 DROP THE VARIANT BYTE. Then a pure signature over ctx || M and a hashed
    signature over ctx || OID || PH(M) live in the same space; a witness is any
    pure message chosen to equal an identifier-plus-digest string, which is
    constructed directly because the pure variant accepts arbitrary M.
    A2 DROP THE CONTEXT LENGTH BYTE. Then (ctx, M) = ("AB", "C") and ("A",
    "BC") give the same representative. WITNESS IS IMMEDIATE AND EXACT, three
    bytes, no search.
    A3 DROP THE OBJECT IDENTIFIER. Then two pre-hash functions with the same
    output length collide as soon as their digests coincide on some pair;
    exhibited at reduced output length, and at full length reported as a cost
    rather than a witness.
    A4 TRUNCATE THE PRE-HASH to n bits with n in {32, 40, 48}. A birthday search
    finds a collision in about 2^(n/2) evaluations - roughly 6.6e4, 1.0e6 and
    1.7e7 - and the resulting pair of distinct messages shares one HashML-DSA
    signature that VERIFIES for both. This is the arm that produces an actual
    signature-level artifact.
    A4 IS THE POSITIVE CONTROL FOR THE WHOLE RECORD. It is a check for a
    property, and it is REQUIRED to trigger. If it does not, the harness cannot
    detect a message-binding violation at all and no statement about the
    conforming construction may be made.

    (5) THE COST CURVE THAT MAKES A4 A MEASUREMENT RATHER THAN A DEMONSTRATION.
    Running A4 at three truncation widths turns "we found a collision" into a
    measured scaling: the number of evaluations to the first collision must grow
    as 2^(n/2), i.e. by a factor of 4 per 4 bits and 16 per 8 bits, and its
    distribution must match the classical birthday law with median about
    1.177 * 2^(n/2). A search that finds collisions far too cheaply indicates a
    degenerate truncation or a seeded-hash bug; a search that finds them far too
    expensively indicates the collision detector is missing hits. Both are
    instrument failures caught by the curve and invisible to a single point.

    (6) WHAT EACH OUTCOME MEANS, DECLARED BEFORE THE RUN. E1 MISMATCH EXISTS:
    the approved table contains at least one (parameter set, pre-hash) pair with
    n/2 below lambda, and the deliverable is that table plus the statement -
    scoped as a statement about a permitted CONFIGURATION and not about ML-DSA -
    that HashML-DSA's message binding at that configuration is 2^(n/2). E2 NO
    MISMATCH: every approved pair satisfies n/2 at least lambda, so the standard
    derived the constraint; the deliverable is the closure, its table, and the
    ablation witnesses that prove the audit could have seen a mismatch. E3
    IDENTIFIER COLLISION: the cross-identifier check finds two approved entries
    whose identifier-plus-digest strings can coincide, which would be a
    first-order finding about the encoding and would be reported with its
    witness and re-verified by a second implementation before anything else is
    written.

  novelty_status: unverified

  citations:
    - ref: >-
        draft-connolly-cfrg-ml-dsa-security-considerations-02, IETF
        Internet-Draft, sections 2.2.2 and 3.2.5
      provenance: retrieved
      claim: >-
        Section 2.2.2 states that "Defining a fixed context string for a given
        protocol's use case prevents cross-protocol attacks". Section 3.2.5
        warns that "HashML-DSA requires hash algorithm identifiers and
        parameters to be transmitted alongside the signature. If these are
        carried through untrusted channels, this introduces algorithm confusion
        risks similar to those seen with JSON Web Tokens." The draft states the
        RISK qualitatively; it gives no injectivity certificate, no approved
        table, and no exponent.
      verified_by: >-
        idea-generator, 2026-08-29, WebFetch of
        https://www.ietf.org/archive/id/draft-connolly-cfrg-ml-dsa-security-considerations-02.html
        against a targeted extraction prompt; not a full linear read of the
        draft, and the section numbers are as reported by that extraction.
    - ref: >-
        WebSearch result summary on BUFF properties of ML-DSA (Cremers et al.,
        "BUFFing signature schemes beyond unforgeability", eprint 2020/1525;
        and "Exclusive Ownership of Fiat-Shamir Signatures - ML-DSA, SQIsign,
        LESS, and More")
      provenance: retrieved
      claim: >-
        SEARCH-RESULT SUMMARY ONLY; NEITHER PAPER WAS OPENED. The summary states
        that CRYSTALS-Dilithium provides exclusive ownership, message-bound
        signatures and non-resignability, "based tightly on the assumed
        collision resistance of the hash function used". Cited here for the
        BOUNDARY it draws: the key-binding and message-binding questions at the
        LATTICE layer are treated in published work and are deliberately NOT
        this record's object. This record's object is the ENCODING layer above
        it - the context string, the domain separator and the pre-hash - which
        the summary does not mention.
      verified_by: >-
        idea-generator, 2026-08-29, WebSearch tool result summary; titles, URLs
        and the quoted summary text only, no PDF opened.
    - ref: "FIPS 204, Module-Lattice-Based Digital Signature Standard, NIST, 2024-08-13"
      provenance: recalled
      claim: >-
        NOT FETCHED THIS SESSION. Recalled: the message representative
        construction with a leading 0x00 or 0x01 variant byte, a one-byte
        context length, a context of at most 255 bytes, and for HashML-DSA an
        object identifier followed by the digest; the approved pre-hash list
        with its object identifiers; and lambda = 128 / 192 / 256 at
        ML-DSA-44 / -65 / -87. EVERY ONE OF THESE IS A RE-VERIFICATION TARGET.
        The record's central prediction is a property of the approved table,
        which this session has not read, and that is exactly why the prediction
