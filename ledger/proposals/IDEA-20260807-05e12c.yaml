  review_refs: []

  disposition: proposed
  disposition_note: >-
    Initial ledger recording of a proposal that already passed an internal,
    non-ledger idea-catalogue dedup pass and a red-team adversarial pass
    (REDTEAM.md section 4c, "STRONGEST -- entries I could not break", item 1;
    the census 767 singletons / 1281 doubles / 3329 residues at d_u = 11 was
    independently re-verified there). It has NOT yet had independent
    ledger-level review (VAL-*/RT-* against a committed run), so disposition
    is `proposed`, not accepted, and no experiment attached to it may execute
    until separately approved.

  interpretation_limits:
    - >-
      No entry-level statement is made or permitted about recovering any key
      or any message; the deliverable is a noise-model correction (a labelled
      block-size readout under a declared conversion instrument) and its
      price in core-SVP bits under one named cost model, not an attack.
    - >-
      The census (767/1281/3329 at d_u = 11) is exact integer arithmetic on
      actual FIPS 203 parameters and is not toy-extrapolated, but the
      block-size conversion is a labelled model readout, not a measured
      attack cost; nothing here revises any published security estimate.
    - >-
      This proposal does not touch and does not contradict GOAL-MLKEM-005's
      proven convexity ceiling G <= log2 M (a best-of-M ciphertext-selection
      result); it concerns the noise model of a SINGLE ciphertext's u-side
      compression, a different mechanism class entirely, and claims no
      exponent-level or M-dependent gain of any kind.
    - >-
      The expected verdict, stated in advance, is CLOSED: the ciphertext-side
      lattice starts from a materially worse position than the key-side
      lattice (it carries Var(e1) + Var(delta_u) against Var(e) alone) and the
      predicted 2-4 bit (ML-KEM-1024) / <1 bit (ML-KEM-512/768) gain does not
      close that gap. A CLOSED verdict recorded with the exact number is the
      deliverable, not a failure of the proposal.

