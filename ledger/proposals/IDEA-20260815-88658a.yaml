idea:
  id: IDEA-20260815-88658a
  question_id: RQ-KEX-b8be01
  added: '2026-08-15'
  title: >-
    BEFORE BUILDING A KEY EXCHANGE ON THIS PROGRAM'S FLATNESS FINDINGS,
    WRITE THE KILL GATE FIRST: enumerate the reductions a candidate must
    survive and check them against the flatness evidence actually in the
    ledger
  class: theory

  claim: >-
    GOAL-KEX-001 proposes a constructive turn: build a key-exchange
    candidate whose flatness assumptions this program has measured. A
    construction built before its kill gate is written tends to be defended
    rather than tested. This record writes the gate first: the enumerated
    reductions and structural attacks any such candidate must survive, each
    mapped to the specific ledger evidence that would or would not clear it.

  mechanism: >-
    Enumerate the standard kill routes for a group-action or flatness-based
    key exchange: subgroup and small-order reductions, Pohlig-Hellman on any
    accessible quotient, meet-in-the-middle on the parameter space, and
    projection to a known-easy instance. For each, state the property a
    candidate must have and cite the ledger evidence bearing on it.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-KEX-001 objective; grep 'kill gate' , 'projection-
      reduction', 'constructive turn'.
    results: >-
      IDEA-20260813-e60362 proposes a toy key exchange with a projection-
      reduction kill gate, so the gate concept exists for one candidate;
      no record writes the gate list independently of a candidate.
    verdict: >-
      ADAPTATION. The kill routes are standard; the contribution is
      writing them as a candidate-independent gate bound to this program's
      own evidence before any construction exists.

  object_first_candidate:
    tracked_object: >-
      THE CANDIDATE-INDEPENDENT KILL GATE, as a checklist bound to cited
      evidence.
    lossiness: >-
      Reducing a construction to gate outcomes is lossy and deliberately
      so, since the gate must be applicable before the construction's
      details exist.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the kill routes are enumerable; a route nobody has
      enumerated is exactly the gap that would sink a candidate later.

  null_object_control: >-
    NULL 1 -- apply the gate to a construction known to be broken, which
    must fail it; a gate that passes a broken scheme is worthless. NULL 2 --
    apply it to a construction believed sound, which should pass; a gate
    that fails everything is equally useless.

  discriminated_from:
    - >-
        IDEA-20260813-e60362, which proposes a specific toy candidate with
        its own kill gate; this record writes the gate independently so it
        cannot be tuned to one candidate.
    - >-
        The CSIDH and class-group lanes, which analyse existing
        constructions rather than gating a proposed one.

  assumptions:
    - >-
        The enumerated kill routes cover the standard attack surface for
        this construction class; completeness is not claimed and a missed
        route is the record's main failure mode.
    - >-
        The ledger's flatness evidence is specific enough to be cited per
        gate item rather than gestured at.

  predictions:
    - metric: >-
        broken-construction control
      direction: different
      minimum_effect: >-
        FORCED to fail the gate; a pass means the gate is worthless.
    - metric: >-
        sound-construction control
      direction: different
      minimum_effect: >-
        FORCED to pass; failing everything is equally useless.
    - metric: >-
        count of gate items with no supporting ledger evidence
      direction: different
      minimum_effect: >-
        The deliverable: it shows exactly what the program would have to
        measure before any candidate is defensible.

  minimal_test:
    design: >-
      Symbolic. Write the gate, run both controls, map each item to
      evidence.
    controls:
      - >-
          Broken-construction control.
      - >-
          Sound-construction control.
      - >-
          Each gate item cites specific ledger evidence or is marked
          unsupported.
      - >-
          Gate written before any candidate exists, so it cannot be
          tuned.
    required_metrics:
      - >-
          The gate item list with per-item evidence citations.
      - >-
          Count of unsupported items.
      - >-
          Both control outcomes.

  falsification_conditions:
    - >-
        The gate passes a known-broken construction. Gate is inadequate;
        rewrite before use.
    - >-
        The gate fails a believed-sound construction. Gate is over-strict
        and would block everything.
    - >-
        Most gate items have no supporting evidence. The constructive turn
        is premature and the record says so, which is a legitimate and
        useful outcome.

  confounders:
    - >-
        COMPLETENESS ILLUSION: a written gate reads as exhaustive and a
        missed kill route would be worse than no gate.
    - >-
        EVIDENCE STRETCHING: citing flatness evidence for a gate item it
        does not actually address is the specific way this record could
        mislead.

  interpretation_limits:
    - >-
        A gate, not a security argument; passing it establishes nothing
        positive.
    - >-
        Completeness of the kill-route list is explicitly not claimed.

  heuristic_assumptions:
    - id: HEUR-KEX-GATE-1
      statement: >-
        The enumerated kill routes cover the attack surface a flatness-
        based key-exchange candidate would face.
      rigorous_support: >-
        Rigorous ingredient: each listed route is a published attack
        class with a known precondition. THE GAP: coverage is not
        proved, and the history of this area is precisely that a novel
        structural attack (as with SIDH) can arrive from outside any
        enumerated list.
      falsification_condition: >-
        A published attack on a comparable construction that no gate
        item would have caught.
      validation_plan: >-
        SAMPLE: apply the gate retrospectively to >= 3 broken
        constructions from the literature. TAIL CHECK: any break the
        gate misses, which directly measures the coverage gap. TRANSFER:
        none; coverage is assessed retrospectively only.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent candidate-independent gate exists here; per-candidate
      gates such as IDEA-20260813-e60362's are the closest artifact.
    hidden_overhead: >-
      A gate's value is entirely in its completeness, which cannot be
      established, so its retrospective miss rate is the only honest
      measure.
    tradeoff_note: >-
      Writing the gate before the candidate costs the appeal of building
      something and buys a test that cannot be tuned to what was built.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a security argument: none is offered. As
    a candidate-independent gate: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a candidate-independent kill
    gate bound to cited ledger evidence, a retrospective miss-rate
    measurement against known breaks, and an explicit count of gate items
    this program has no evidence for.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that the gate is writable. 0.6 that it catches all three
    retrospective breaks. 0.7 that most items turn out unsupported by
    current evidence, which would mean the constructive turn is premature
    and is the outcome I expect.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
