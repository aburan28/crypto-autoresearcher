  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS STAGE 0 PLUS THE CELL (s = 3,
      D = 8): an 886-row by 2304-column exact rank over F_p on three arms,
      seconds each, which already separates 'deficit 0' from 'deficit
      nonzero'. Stage 0: the one-page derivation of (S2)-(S3), checked by
      hand. Stage 1: F_p port of the Boolean meter with a free variable and
      the binary calibration arm (n = 12). Stage 2: s = 1 slice against
      cb8e46's J. Stage 3: d = 2, s in {3, 4, 5}, p in three sizes, 6 curves,
      5 seeds per null arm, D in {5..8}, three arms plus the non-curve
      cubic; s = 6 at D <= 6 only; (s = 6, D = 8) excluded by name. Stage 4:
      p-ladder and curve spread at s = 4. Stage 5: the pre-registered fit.
      Pre-flight column and row counts abort any cell above 50,000 columns
      or 4 GiB dense-equivalent. maximum_runs for THIS round is 0: every
      number above is a derivation or a count, and the battery is a proposal.
    controls:
      - NULL-SUPPORT at every cell, 5 seeds (blocking, forced 0)
      - NULL-TOPOLOGY at every cell, 5 seeds (blocking, topological floor)
      - non-curve cubic at every cell (blocking, curve versus formula)
      - binary n = 12 calibration of the ported meter (blocking, known answer)
      - s = 1 baseline slice against cb8e46's J on a frozen fixture (blocking)
      - p-ladder at fixed s and curve spread at fixed (s, p) (structural tells)
      - pre-flight memory gate with abort before allocation
      - certificate arm re-verifying every planted decomposition by point addition
    required_metrics:
      - 'rows(D), ncols(D), rank(D), koszul(D), deficit(D) per cell per arm, D = 5..8'
      - 'fitted slope and intercept of deficit(8) residual against s, with CI'
      - 'p-ladder spread and curve spread of deficit(8) at fixed s'
      - 'calibration integers on the binary arm and the s = 1 fixture equality'
      - 'realised degree distribution of both null generators'
      - 'solve bit sol(D) per cell as a covariate (7ea402), not as a claim'
      - 'peak RSS, wall time, and aborted cells with parameters'

  falsification_conditions:
    - >-
      F1. Stage 0 finds a subset-sum of E1, E2 whose degree-4 part cancels,
      or finds an affine P in F_p[a]/(a^2 - a) with P^2 = P and at least two
      variables. (S3) is wrong and the record is superseded.
    - >-
      F2. NULL-SUPPORT shows a nonzero deficit at some D <= 8. The
      Koszul-only baseline or the meter is wrong; nothing else is read.
    - >-
      F3. The binary calibration arm does not return 1 and 31. The port is
      broken.
    - >-
      F4. All SEM residuals are 0 within spread at s in {3, 4, 5}: M1. The
      binary 8 dim V law is a characteristic-2 phenomenon at the tested
      cells and cannot be imported to RQ-PFDR-ae2fba's degree column; the
      obstruction is named (Frobenius-linearity of squaring and the Boolean
      idempotent law, both absent). Expected outcome.
    - >-
      F5. Residuals at D = 8 fit alpha s + beta with alpha's CI excluding 0,
      p-independent: M2. A chaining-graph syzygy exists over F_p; it is a
      mechanism finding, not a cost finding, and its cost image is decided by
      the solve bit per 7ea402.
    - >-
      F6. Nonzero residuals that are constant in s or vary with p: artifact
      or M3; reported as such with the tell that fired.
    - >-
      F7. A memory or time stop on any cell is failed_infrastructure under
      AGENTS.md rule 3 and never evidence.

  confounders:
    - >-
      The multilinear reduction a^2 -> a is not homogeneous, so 'degree' in
      the quotient is the multilinear degree of the reduced representative;
      the meter's degree convention must be frozen and identical across arms.
    - >-
      With only two generators the system is far from overdetermined and
      the null's own regularity is high; deficits at D <= 8 are about
      products of the two generators with low-degree multipliers only. A
      deficit that would appear at D > 8 is out of reach and the record
      says so.
    - >-
      Random null generation on a fixed support can produce degenerate
      polynomials; the realised degree distribution is reported.
    - >-
      Planted targets fix |Z| by construction (cb8e46 part C); the deficit
      is measured on generating sets, not on the point set, but the free
      variable u ranges over F_p and the solution count is a covariate.
    - >-
      The interval leaf window is Archimedean and depends on the integer
      lift (84cdb7 claim C); the twin inherits that disanalogy and it is
      not repaired here.

  interpretation_limits:
    - >-
      No attack, no exponent, no security claim. A control between two
      mechanisms for a measured binary law.
    - >-
      Toy tier: p <= 2^16, s <= 5 at D = 8, m = 3, d = 2; nothing at
      cryptographic scale and no extrapolation in s.
    - >-
      A nonzero deficit is a property of a generating set; the ideal is a
      point set by cb8e46 and the deficit's cost image is zero unless the
      solve bit flips (7ea402).
    - >-
      M1 at the tested cells closes the import of the binary deficit into
      the prime-field degree column, not KN-OPEN-002.
    - >-
      Two recalled internal pointers (ad0be4, the Boolean meter) were not
