  heuristic_assumptions:
    - id: H1
      statement: >-
        The support-matched random arm is Koszul-generic: for uniformly
        random polynomials on the twin's supports, the products E_i m with
        deg m <= D - 4 are linearly independent in the multilinear-in-a,
        free-in-u quotient for D <= 7 and have exactly one dependency (the
        Koszul pair) at D = 8, uniformly over s in {3..6} and p >= 2^12.
      rigorous_support: >-
        RIGOROUS: the Koszul syzygy is exact and is the only trivial syzygy
        of a two-element sequence in a commutative ring; the field-equation
        relations are absorbed by the quotient. CLASSICAL DISTRIBUTION
        IMITATED: Froberg / Bardet-Faugere-Salvy semi-regularity -- a generic
        sequence has only the trivial syzygies degree by degree. The
        Boolean version needs the Frobenius correction; the prime-field
        multilinear version, by (S2), does not, and that difference is
        itself checked by H1.
      validation_plan: >-
        SAMPLE: the NULL-SUPPORT arm at every cell, 5 seeds, all three p,
        s in {3, 4, 5} and s = 6 at D <= 6. COMPARISON: deficit exactly 0
        (forced integer). TAIL CHECK: the cell with the largest observed
        null deficit over seeds, reported with its realised generator
        degrees. SAMPLED PARAMETERS RECORDED: p, s, D, seed, support sizes.
        TRANSFER: none; toy scale only.
    - id: H2
      statement: >-
        A genuine chaining-graph deficit is a structural Betti-type number:
        deterministic in dimension, independent of p and of the curve at
        fixed s, and affine in s at fixed D = 8 over the tested range.
      rigorous_support: >-
        RIGOROUS INGREDIENT: KN-FIND-006 records the binary deficit as
        exactly closed-form in k with coordinate-dependent generators and a
        deterministic dimension, and its null exactly 0. CLASSICAL
        STATEMENT IMITATED: graded Betti numbers of a structured ideal are
        constant under generic coefficient specialisation. The heuristic
        content is that the same reading applies to a prime-field twin at
        all; the p-ladder is where it is tested.
      validation_plan: >-
        SAMPLE: SEM at s = 4, p in three sizes, 6 curves each. COMPARISON:
        deficit(8) spread across p and curves against the null's seed
        spread. TAIL CHECK: the maximum deviation across curves at fixed
        (s, p); if it exceeds the null band the deficit is curve-dependent
        and H2 fails (M3). TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO ATTACK AND NO EXPONENT. The record's own cost is exact ranks on
      matrices of at most 5310 rows by 56751 columns over F_p. For the
      decomposition subtask the incumbents are the enumerative sweep at
      2^{m-1} B^{m-1} and the target-keyed meet-in-the-middle at
