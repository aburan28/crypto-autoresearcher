  object_first_candidate:
    tracked_object: >-
      The degree-graded extra-syzygy vector deficit(D), D = 5..8, of the
      chained digit twin's generating set.
    lossiness: >-
      Genuinely lossy: at s = 5, D = 8 a 5310-row, 56751-column matrix
      collapses to four integers; the fibre is every system with the same
      syzygy dimensions. Not a change of coordinates: the digit map is one,
      and is not the object.
    propagation: >-
      Deterministic under degree increment: extra syzygies at D multiply
      into extra syzygies at D + 1, so the vector is monotone in the
      cumulative sense and is described by its first-appearance profile.
    survival_score: >-
      Survives every s, p and curve by construction; dissolves at D beyond
      the null's own regularity, where the semi-regular reference stops
      being a count of trivial relations.

  null_object_control: >-
    NULL-SUPPORT (blocking): each generator replaced by a uniformly random
    polynomial on the identical monomial support; predicted deficit exactly
    0 at every D <= 8, as in KN-FIND-006's null; a nonzero value here means
    the Koszul-only baseline is wrong or the meter is, and nothing else is
    read. NULL-TOPOLOGY (blocking): random polynomials with the same
    variable sets and multidegree, u shared between the two, per 11b8c7's
    construction carried to F_p; its deficit is the topological floor that
    any Semaev-specific claim must exceed. NON-CURVE CUBIC (blocking): the
    S_3 formula evaluated at the coefficients of a random cubic with no
    group law. BINARY CALIBRATION ARM (blocking, known answer): the committed
    n = 12 GF(2) system, deficit(3) = 1, deficit(4) = 31, null 0.
    STRUCTURAL TELLS: p-ladder at fixed s (a structural deficit is
    p-independent) and s-ladder at fixed p (a structural deficit grows
    affinely with s under M2); a deficit constant in s and varying in p is
    an artifact by the section-3 rule.

