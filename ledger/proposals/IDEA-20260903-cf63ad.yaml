  assumptions:
    - >-
      p > 3, E non-singular short Weierstrass, d = 2 on the main ladder, 2^s
      <= p so digit representations are unique; the interval [0, 2^s) is the
      leaf window and roughly half of it lies on the curve (84cdb7 H2),
      which matters for yield and NOT for the deficit, since targets are
      planted.
    - >-
      Deficit is defined as rows(D) - rank(Mac_D) - koszul(D) in the
      multilinear-in-a, free-in-u Macaulay matrix, with koszul(D) = 1 at
      D = 8 and 0 below; all ranks exact over F_p, never a CAS termination
      event.
    - >-
      The null arms are generated by a frozen rule (uniform coefficients on
      the same support, or on the same variable set and multidegree) and
      their realised degree distribution is reported, per 11b8c7's
      confounder.
    - >-
      Planted targets are a sampling design; no yield statement is read off
      this battery (KN-FIND-007 owns yield).

  proof_search_map:
    bottleneck: >-
      Whether the one measured structural deficit in this program's degree
      lane (8 dim V, binary) has a prime-field existence at all. If it does
      not, every argument that imports binary deficit structure to
      RQ-PFDR-ae2fba's degree column is void; if it does, the prime-field
      degree column has, for the first time, a candidate mechanism that is
      not the CRT degeneracy and not the digit membership.
    baseline_embedding:
      parameter_slice: >-
        s = 1 with general d: the twin equals cb8e46's chained encoding J
        with the interval base V = [0, d), generator for generator
        (membership prod_{j<d}(x_k - j) = fV). Second slice: the committed
        binary n = 12 system, on which the ported meter must return
        deficit(3) = 1, deficit(4) = 31, null 0.
      reproduction_check: >-
        Symbolic equality of the generator list at s = 1 with cb8e46's J;
        frozen-fixture equality of graded ranks with the existing S_3
        instrument at s = 1, d in {4, 8}; exact reproduction of the
        KN-FIND-006 integers on the binary calibration arm. Any mismatch
        halts the line as an instrument finding.
    observation_collision:
      observable: >-
        The vector (deficit(5), ..., deficit(8)) per cell and its fitted
        s-slope at D = 8.
      distinct_preimage_search: >-
        REQUIRED. (a) NULL-SUPPORT and NULL-TOPOLOGY arms: distinct ground
        truths (no curve) with the same observable would mean the deficit is
        a property of sparse chained multilinear systems, not of Semaev
        polynomials. (b) The non-curve cubic: replace f by a random cubic
        with no group law and S_3 by the same formula evaluated at its
        coefficients (a polynomial of the same shape); a matching deficit
        means the effect is about the S_3 formula, not about the curve. (c)
        Two curves with the same p and different j must give the same
        deficit under M2 (a structural Betti-type number); a curve-dependent
        deficit is M3.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the chaining graph fixed and vary the characteristic: the
          binary descended system (k = dim V) against the prime-field digit
          twin (s digits). The intrinsic invariant distinguishing them is
          the pair of identities (S2)-(S3): Frobenius-linearity of squaring
          and the Boolean idempotent law, both present at char 2 and both
          absent at char p.
        predicted_gain: >-
          Converts 'is the binary deficit transferable' from a hope into one
          of three pre-registered integers per s.
      - transform: representation_reduction
        proposed_object: >-
          The chained tree with digit leaves is the digit presentation of
          84cdb7 with one internal free node added; encoding exact
          (bijection on the interval), completeness exact, soundness by
          post-filtering on f(x) square, cost loss the extra variable u.
        predicted_gain: >-
          A presentation on which a chaining-graph syzygy CAN exist, which
          the direct digit system cannot host.
    quantifier_order: >-
      M1 as claimed: FOR ALL p > 3 in the tested set, FOR ALL curves and
      planted targets in the tested families, FOR ALL s in {3, 4, 5}, FOR
      ALL D <= 8, deficit(D) = 0 within the null's seed spread. M2 as
      claimed: THERE EXIST alpha != 0, beta such that FOR ALL tested p and
      curves, deficit(8) = alpha s + beta at s in {3, 4, 5}. The dangerous
      weak reading, NOT claimed: FOR ALL cells THERE EXISTS some affine fit,
      which is vacuous with three points and one free constant -- the
      pre-registered rule therefore requires the slope CI to exclude 0 AND
      the p-ladder and curve spread to be inside the null band.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested (s, p, curve) ladder, the prime-field digit twin of
