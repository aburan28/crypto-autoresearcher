idea:
  id: IDEA-20260903-cf63ad
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-22c36b
  added: '2026-09-03'
  title: >-
    THE PRIME-FIELD DIGIT TWIN OF THE BINARY CHAINED SEMAEV SYSTEM HAS NEITHER
    INGREDIENT OF THE EXHIBITED BINARY DEGREE-3 SYZYGY: the Boolean identity
    P(1+P) = 0 fails for affine P in characteristic p (the cross terms
    2 a_i a_j survive), and no subset-sum of the twin's two generators can
    degenerate in degree (their top forms have disjoint digit supports), so
    if KN-FIND-006's 8 dim V deficit is Frobenius-mediated the twin shows
    deficit 0 at every degree up to the Koszul cell D = 8, while a
    chaining-graph mechanism predicts a deficit affine in the digit length s
    at D = 8 -- a control that separates the two on short, wide Macaulay
    matrices (at most 5310 rows) with the s = 1 slice embedding
    IDEA-20260830-cb8e46's chained encoding exactly
  class: control

  claim: >-
    Setting. E/F_p short Weierstrass y^2 = f(x), p > 3, arity m = 3, chained
    t = 3 tree as in GOAL-DREG-001 but over F_p and with no Weil descent:
    generators E1 = S_3(x_1, x_2, u) and E2 = S_3(u, x_3, x_R), with x_R a
    constant, u a FREE F_p variable (the internal node), and each leaf
    x_k = sum_{i<s} a_{k,i} d^i with digit variables a_{k,i} subject to
    prod_{j<d}(a_{k,i} - j) = 0. Default d = 2, so the leaf field equations
    are a(a - 1) = 0 over F_p and the leaf window is V_s = [0, 2^s).
    (S1) SHAPE, DERIVED. Because x_k is linear in its digits, E1 has total
    degree 4 in (u, a_{1,*}, a_{2,*}) and E2 has total degree 4 in
    (u, a_{3,*}); the twin has exactly TWO generators of degree 4 plus 3s
    field equations of degree d, in 3s + 1 variables. One summation equation
    stays one equation (IDEA-20260830-84cdb7 claim C); nothing multiplies it
    into 2n Boolean equations of degree 2 and 3 as Weil descent does. So the
    binary cells D = 3, D = 4 have NO literal twin: the first multiplier
    degrees are D = 5, 6, 7 and the first cross-generator (Koszul) cell is
    D = 8.
    (S2) WHICH SYZYGIES SURVIVE THE CHANGE OF CHARACTERISTIC, DERIVED.
    Koszul syzygies E1 E2 - E2 E1 survive (they are exact in every
    commutative ring). The n_q Frobenius syzygies f^2 = f of KN-FIND-006's
    generic baseline do NOT survive: in F_p[a]/(a^2 - a) a multilinear f
    satisfies f^2 = f only in degenerate cases, and the counterexample
    f = a_1 + a_2 gives f^2 = a_1 + a_2 + 2 a_1 a_2, which is not f because
    2 is a unit. The field-equation relations f . a(a-1) = 0 are absorbed by
    working in the multilinear quotient (a^2 -> a), exactly as the Boolean
    meter does, and contribute no row. Hence the twin's generic baseline is
    Koszul ONLY, and the predicted generic rank at degree D < 8 equals the
    row count (two generators times the multilinear-in-a, free-in-u
    monomials of degree at most D - 4), at D = 8 the row count minus one.
    (S3) THE EXHIBITED BINARY MECHANISM IS ABSENT TWICE, DERIVED.
    KN-FIND-006 and DREG_DEFICIT_CLOSED_FORM.md exhibit the D = 3 syzygy as
    P (1 + P) = 0 with P an AFFINE DEGENERATION of a subset-sum of descended
    quadrics. Ingredient (i), the identity P(1+P) = P + P^2 = 0 for affine
    P, needs P^2 = P, which holds in a Boolean ring and fails in
    F_p[a]/(a^2 - a) for every affine P with at least two variables (S2).
    Ingredient (ii), a subset-sum of generators whose top-degree part
    cancels, is impossible in the twin: the degree-4 part of E1 is
    (x_1 - x_2)^2 u^2 - 2 x_1 x_2 (x_1 + x_2) u + x_1^2 x_2^2 and contains
    the monomial x_1^2 x_2^2 free of u, while the degree-4 part of E2 is
    u^2 x_3^2 (the terms carrying x_R have degree at most 3), so
    c_1 E1 + c_2 E2 has degree 4 for every (c_1, c_2) != (0, 0). Therefore
    the mechanism that produced deficit(3) = 1 over GF(2) has no F_p
    analogue at any degree, and the only way a deficit can arise in the twin
    is a relation among products E_i m that is NOT visible at the level of
    subset-sums -- a property of the chaining graph (shared u) and the
    multilinear reduction, if it exists at all.
    (S4) THE TWO MECHANISMS AND THEIR PREDICTIONS. M1 (characteristic-2
    artifact): the binary deficit is Frobenius-mediated and the twin shows
    deficit(D) = 0 for all D <= 8, at every s, every p and every curve,
    matching the support-matched null within seed noise. M2 (chaining-graph
    property surviving the change of characteristic): deficit(8) = alpha s +
    beta with alpha != 0 over s in {3, 4, 5}, the analogue of 8k - 1, possibly
    with an s-independent constant deficit at some D in {5, 6, 7}, the
    analogue of deficit(3) = 1. M3 (neither): a nonzero deficit that is not
    affine in s (constant, or superlinear) is reported as such and is
    evidence that the binary law is not the right template.
    (S5) THE BASELINE SLICE. At s = 1 with general d the digit variable is
    x_k itself and the membership generator prod_{j<d}(x_k - j) is f_V for
    the interval V = [0, d); the twin IS the chained encoding
    J = (S_3(x_1,x_2,u), S_3(u,x_3,x_R), fV(x_1), fV(x_2), fV(x_3)) of
    IDEA-20260830-cb8e46 with the interval base, generator for generator.
    cb8e46 derives that J is the vanishing ideal of a finite F_p-point set
    off a stratum of density O(B/p) + O(1/B); the twin therefore inherits
    that IDEAL-LEVEL degeneracy at every s (the digit substitution is a
    bijection on the interval) and only GENERATOR-LEVEL observables -- the
    Macaulay deficit measured here -- can differ from the point set. This
    is stated so that no reader takes a nonzero deficit for an ideal
    invariant.

  mechanism: >-
    TRACKED OBJECT AND LOSSY-PROJECTION TEST. The object is the degree-graded
    extra-syzygy vector deficit(D) = rows(D) - rank(Mac_D) - koszul(D) for
    D = 4..8, computed in the multilinear-in-a, free-in-u Macaulay matrix
    over F_p. It is a projection of the full row space (up to 56,751
    columns at s = 5, D = 8) onto five small integers; its fibres are
    astronomically large (every system with the same syzygy dimensions
    collides), so it is genuinely lossy, and it is compatible with the one
    operation the solver performs -- degree increment -- because Mac_{D+1}
    contains S_1 . Mac_D and the extra-syzygy space at D injects into that
    at D + 1 by multiplication, so the vector propagates deterministically
    and monotonically. The digit vector itself FAILS the test (84cdb7 says so
    and this record agrees: x -> (a_i) is a bijection on the interval) and is
    not the object here; the object is the syzygy dimension of a chosen
    generating set, which 84cdb7 and (recalled, not opened)
    IDEA-20260830-ad0be4 argue is presentation-dependent by construction.
    WHY THE TWIN AND NOT THE DIRECT DIGIT SYSTEM. 84cdb7 substitutes the
    digit map into the direct S_{m+1} and measures the d_ff slope. It has no
    internal node, so it cannot carry a chaining-graph syzygy at all; the
    binary law lives on the chained tree (shared u between E1 and E2, n
    quadrics from E1 and n cubics from E2 in the binary case), and only a
    chained twin can ask whether that law is about the tree or about
    characteristic 2. The twin adds exactly one thing to 84cdb7's family: the
    free internal variable u and the second generator.
    WHY THE MATRICES ARE CHEAP. Rows are products E_i . m with m ranging over
    multilinear-in-a, free-in-u monomials of degree at most D - 4; at D = 8
    that is 2 . sum_{j<=4} C(3s, j) (5 - j) rows: 2 . 443 = 886 at s = 3
    (9 digit variables: 5 + 36 + 108 + 168 + 126), 2 . 1186 = 2372 at s = 4
    (12 variables: 5 + 48 + 198 + 440 + 495), and 2 . 2655 = 5310 at s = 5
    (15 variables: 5 + 60 + 315 + 910 + 1365). Columns at D = 8 are
    sum_{j<=8} C(3s, j) (9 - j): 2304 at s = 3, 12381 at s = 4, 56751 at
    s = 5, 218790 at s = 6. Rank of a 5310 x 56751 sparse matrix over F_p is
    minutes; the record excludes (s = 6, D = 8) by name and allows s = 6
    only at D <= 6 (columns sum_{j<=6} C(18,j)(7-j) = 7 + 108 + 765 + 3264 +
    9180 + 17136 + 18564 = 49024, under a 50,000-column contract). The
    deficit is bounded by the row count, so a deficit is a dependency among
    at most 5310 products -- a small, exactly computable integer.
    WHY THE STRUCTURAL-TELL CONTROLS ARE THE LOAD-BEARING ONES. Per
    docs/inventor-protocol.md section 3, a genuine chaining-graph deficit
    must be independent of p (structure) and must grow with s (the parameter
    that enlarges the tree's leaves); a deficit that is constant in s and
    varies with p is the canonical artifact tell and is reported as suspected
    artifact before it is reported as M2.
    STAGES. STAGE 0 (zero compute, hard gate): write (S2) and (S3) as a
    one-page derivation; verify by hand that the degree-4 part of E1 contains
    x_1^2 x_2^2 and that E2's degree-4 part is u^2 x_3^2; verify the
    counterexample f = a_1 + a_2 to f^2 = f. STAGE 1 (instrument): port
    experiments/EXP-SBRG-60c55e/driver/macaulay.py (recalled, not opened;
    the handoff describes it as the test-covered Boolean deficit meter) to
    F_p with a free variable, and CALIBRATE it on the committed binary system
    at n = 12: it must return deficit(3) = 1 and deficit(4) = 31 with the
    null at 0, as KN-FIND-006 records, before any prime-field number is
    read. STAGE 2 (baseline slice): s = 1, d = B in {4, 8}: the generator
    list must equal cb8e46's chained J symbolically and the graded ranks must
    match the existing S_3 instrument on a frozen fixture. STAGE 3 (the
    separating cells): d = 2, s in {3, 4, 5}, p in {4099, 16411, 65537 or
    the nearest prime with 2^s <= p}, 6 curves of generic j, planted targets
    (a decomposition exists by construction), D in {5, 6, 7, 8}, three arms:
    SEM (the twin), NULL-SUPPORT (each generator replaced by a uniformly
    random polynomial with the same monomial support), NULL-TOPOLOGY (random
    polynomials with the same variable sets and multidegree, u kept shared).
    STAGE 4 (decay checks): the p-ladder at fixed s = 4 and the curve spread.
    STAGE 5 (zero compute): fit deficit(8) against s; declare M1, M2, M3 or
    unresolved by the pre-registered rule. Never a status change.

