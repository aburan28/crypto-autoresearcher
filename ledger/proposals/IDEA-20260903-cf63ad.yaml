      Parallel Pollard rho with negation at 0.886 sqrt(N) group operations
      and O(1) memory; BSGS at (N^{1/2}, N^{1/2}); kangaroo on an interval;
      automorphism-discounted rho; Pohlig-Hellman; generic preprocessing at
      S T^2 = N; algebra-free MITM index calculus at N^{1/2 + 1/m}.
    hidden_overhead: >-
      Nothing superpolynomial is hidden because nothing is claimed. The
      disclosed gap: a deficit is not a cost (7ea402); even M2 licenses no
      statement about the solving degree, which is out of this record's
      reach.
    tradeoff_note: >-
      Not applicable; no algorithm is proposed. Cells are independent and
      embarrassingly parallel over (s, p, curve, arm).

