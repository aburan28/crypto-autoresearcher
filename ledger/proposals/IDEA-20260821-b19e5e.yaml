idea:
  id: IDEA-20260821-b19e5e
  question_id: RQ-FRODO-3260cc
  added: '2026-08-21'
  title: >-
    The lane has been auditing the TABLE and never the IDEAL: FrodoKEM's Renyi divergence is
    taken against a rounded Gaussian whose definition carries at least five independent
    convention forks (rounded vs discrete, s-parameter vs standard deviation, untruncated vs
    truncated vs truncated-renormalised, which direction of an ASYMMETRIC divergence, and which
    of R_a / R_a-1 / ln R_a is printed) - enumerate the whole 96-cell grid exactly against the
    sampler's pushforward measure obtained by exhausting all 2^16 inputs, and use the three
    published figures as an ORACLE that names the convention; and note in passing that the
    divergence is TRANSCENDENTAL and so cannot be computed in the exact rational arithmetic the
    goal's method section mandates
  class: representation
  claim: >-
    (A) THE RE-REPRESENTATION. Stop treating chi as a list of thirteen integers and start
    treating it as the PUSHFORWARD of the uniform measure on {0,1}^16 under the literal Sample
    pseudocode. That representation is computable by exhausting all 65536 inputs - a complete
    enumeration, not a sample - and it fixes, without any reading of intent, three things a
    table cannot fix: which side of each comparison boundary is included, that the sign bit is
    consumed and WASTED on a zero magnitude, and hence that the mass at zero carries an
    odd numerator over 2^15 rather than an even one.
    (B) THE ARITHMETIC THIS PREDICTS, DERIVED BY HAND IN THIS SESSION AND FLAGGED AS SUCH.
    Under the fetched pseudocode t is the 15 low bits, e counts the indices i with t > T_X(i),
    and e is then signed by r[0]. Therefore Pr[chi = 0] = (T_X(0)+1)/2^15 and
    Pr[chi = +/-k] = (T_X(k) - T_X(k-1))/2^16. Over a common denominator 2^16 the numerators are
    p_0 = 2*T_X(0) + 2 and p_k = T_X(k) - T_X(k-1). CHECK, PERFORMED BY HAND HERE, NOT BY A RUN:
    with T_X(0) = 4643 from the fetched CFRG draft, p_0 = 9288, which is exactly the first
    numeric field of the extraction-damaged Table A.3 row quoted in RQ-FRODO-3260cc.provenance;
    the six successive differences 13363-4643, 20579-13363, 25843-20579, 29227-25843,
    31145-29227, 32103-31145 give 8720, 7216, 5264, 3384, 1918, 958, matching that row term for
    term; and 9288 + 2*(8720+7216+5264+3384+1918+958+422+164+56+17+4+1) = 65536 = 2^16 exactly.
    THIS RESOLVES THE EXTRACTION DAMAGE the RQ flagged: the damaged run parses as sigma = 2.8,
    then thirteen pmf numerators over 2^16, then Renyi order 200, then divergence 0.324e-4. The
    "+2" is real, it is worth 2^-15 = 3.0517578125e-5 of probability mass at zero, and the
    published Frodo-640 divergence figure it must be compared against is 0.324e-4 = 3.24e-5 -
    THE SAME ORDER OF MAGNITUDE, within a factor of 1.1. An analyst who writes p_0 = 2*T_X(0)
    is therefore perturbing chi by a quantity comparable to the entire published divergence.
    That is the reason this is not hygiene.
    (C) THE OBJECT THE LANE HAS NEVER TRACKED - THE IDEAL. The divergence is a functional of TWO
    arguments and eight proposals have audited only the first. The second, "the rounded Gaussian
    it approximates", is under-specified by at least five independent binary or ternary forks:
    (1) rounded Gaussian, i.e. the pushforward of N(0, sigma^2) under rounding to the nearest
    integer, versus discrete Gaussian, i.e. mass proportional to exp(-z^2/(2 sigma^2)) - these
    are DIFFERENT distributions; (2) the subscript convention, since the literature writes
    Psi_{sigma*sqrt(2*pi)} where the parameter s satisfies density proportional to
    exp(-pi*x^2/s^2), so s = sigma*sqrt(2*pi) denotes standard deviation sigma - and reading the
    subscript as a standard deviation instead multiplies the width by 2.5066; (3) untruncated,
    truncated to chi's support without renormalisation, or truncated and renormalised;
    (4) DIRECTION, which is load-bearing because the divergence is ASYMMETRIC and, here,
    infinitely so: R_a(chi || Psi) is a finite sum, because chi vanishes outside |z| <= d and
    those terms contribute zero, whereas R_a(Psi || chi) is +infinity for every a > 1, because
    Psi puts mass where chi puts none; (5) which quantity is printed - R_a, R_a - 1, ln R_a, or
    the log-divergence used in the probability-preservation lemma.
    (D) THE ORACLE. 2 x 2 x 3 x 2 x 4 = 96 candidate readings, each a microsecond of arithmetic,
    each evaluated at the published order for each of Frodo-640/976/1344, giving 288 numbers to
    be compared against three published figures. Exactly one of three things happens, and all
    three are results: exactly one cell reproduces all three figures, and the convention is
    DETERMINED and the arithmetic claim is earned at crypto tier; no cell reproduces, and there
    is a discrepancy whose residual is quantified per cell; or several cells reproduce, and the
    finding is that three significant printed figures do not determine the convention - stated
    by NAMING which conventions are indistinguishable at the published precision.
    (E) A CORRECTION OWED TO THE GOAL'S OWN METHOD SECTION. RQ-FRODO-3260cc.methods and
    GOAL-FRODO-001 mandate exact rational arithmetic for BOTH audited quantities. That is
    achievable for the failure rate, whose every ingredient is rational. IT IS NOT ACHIEVABLE FOR
    THE DIVERGENCE: every candidate ideal above involves exp or the Gaussian CDF, so the
    divergence is transcendental and no rational number equals it. The correct instrument is a
    CERTIFIED ENCLOSURE - a rigorous interval whose endpoints are rationals obtained from a
    convergent series with a proved remainder bound - and the deliverable must be an interval
    plus a proof of its width, not a rational. This is a defect in the lane's stated method, it
    is cheap to state, and stating it before a batch spends its budget chasing an impossible
    exactness requirement is the point of raising it here.
    (F) NOT CLAIMED. No attack, no break, no exponent, no statement about LWE hardness at Frodo's
    dimensions. A convention ambiguity in a document is a documentation finding. A discrepancy,
    if one is found, is a documentation or analysis defect until it is costed under
    RQ-FRODO-3260cc.constraints[5], and this record does not cost it.
  mechanism: >-
    STAGE 1 - PUSHFORWARD BY EXHAUSTION. Implement Sample exactly as transcribed from the filed
    primary text, run it on ALL 65536 sixteen-bit inputs, and tabulate the exact counts. Output:
    a pmf with denominator 2^16 and integer numerators, obtained with no reading of the table as
    a CDF and no assumption about boundary conventions. Then, and only then, compare it with the
    numerators derived analytically from the table. Agreement is a two-route cross-check;
    disagreement localises the boundary convention to a specific index. Cost: milliseconds.
    STAGE 2 - CONSTRUCT THE 96 IDEALS. Build each candidate Psi as a certified enclosure: for the
    rounded Gaussian, Psi(z) = Phi((z+1/2)/sigma) - Phi((z-1/2)/sigma) with Phi enclosed by its
    Taylor/continued-fraction expansion with a proved remainder; for the discrete Gaussian,
    exp(-z^2/(2 sigma^2)) enclosed the same way and normalised by an enclosed partition function
    with a proved tail bound. Record the enclosure width at every step; a width that swamps the
    published figure's last significant digit is itself a reportable outcome and must be reported
    BEFORE any comparison, not after.
    STAGE 3 - EVALUATE THE GRID. For each of the 96 cells and each parameter set, compute the
    divergence enclosure at the published order (200, 500, 1000 as recorded in
    RQ-FRODO-3260cc.provenance, themselves research targets to be re-read). Cells in the
    Psi||chi direction return +infinity by the support argument and are recorded as such - their
    forced value is derived in advance so that their agreement or disagreement carries no
    information, which is obligation 4 of KN-TECH-1a5b7e applied honestly.
    STAGE 4 - THE ORACLE READING. Compare each cell's enclosure with the published figure at the
    printed precision. Report the SET of cells consistent with all three parameter sets
    simultaneously - not the single best cell, because requiring simultaneous consistency across
    three parameter sets is what makes the oracle discriminating, and reporting a best cell would
    convert a set-valued answer into a false determination.
    STAGE 5 - THE DERIVED-SIGN MUTATION CONTROL. Perturb the pushforward by removing the "+2"
    from p_0 and adding it back at the extreme support point, and recompute the winning cell's
    divergence. FORCED VALUE DERIVED BEFORE THE RUN: if the published table is a local minimiser
    of the divergence within its dyadic class - the premise IDEA-20260808-2df781 exists to test -
    then EVERY one-unit perturbation must INCREASE the divergence. A perturbation that DECREASES
    it either refutes local optimality or exposes a bug in the winning cell, and either way is the
    result. This gives the mutation control a derived SIGN, which the generic version lacks.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant; it answers
      nothing). Instrument: the Grep tool (ripgrep) plus WebSearch/WebFetch.
      GREPS RUN (pattern -> path -> count): (1) 'SampleFrodo|T_chi' -> ledger/ -> 2 files, namely
      RQ-FRODO-3260cc.yaml and IDEA-20260808-e7ba81.yaml, and the latter is under RQ-FNDSA-001
      (an FN-DSA sampler-exactness record framed as spiked-covariance detection), not this lane.
      (2) 'pushforward|inverse transform sampling|sign bit|exhaustive enumeration of the sampler|
      sampler semantics' -i -> ledger/proposals/ -> 8 files: IDEA-20260816-ebedd8,
      IDEA-20260816-cf82f2, IDEA-20260808-ee5d81, IDEA-20260807-6533fd, IDEA-20260806-6bb3ef,
      IDEA-20260806-9c2f80, IDEA-20260805-51996a, IDEA-20260805-390957 - of which only the last is
      in this lane, and it is the five-conservation-identity record.
      (3) 'certified enclosure|interval arithmetic|Kronecker substitution|CRT reconstruction|
      double-and-add convolution|exact convolution' -i -> ledger/ -> 26 files, including
      H-FRODO-e0c651, GOAL-FRODO-001, IDEA-20260805-390957, IDEA-20260805-411b60,
      IDEA-20260805-1d76e9. I read the statement head of H-FRODO-e0c651: its C1 is
      'p_0 + 2*sum_{k>=1} p_k = M exactly, M a power of two', which is the normalisation identity
      this record's hand check instantiates, and its C2/C4/C5 are moment, unimodality and kurtosis
      identities - all TABLE-side, none about the ideal object.
      (4) 'Frodo' -i -> knowledge/ -> 9 files, none about the sampler's induced distribution.
      READ IN FULL: the lane's 8 pre-extracted titles; RQ-FRODO-3260cc; RQ-FRODO-a2dbe2;
      GOAL-FRODO-001; the statement heads of H-FRODO-e0c651 and H-FRODO-8ea540;
      knowledge/techniques/KN-TECH-1a5b7e.md; docs/inventor-protocol.md.
      WEB SEARCHES RUN (the one bearing on this record): 'FrodoKEM Renyi divergence sampling table
      rounded Gaussian order 200 500 1000 security analysis'. Its result summary reported the
      three divergence values 0.324e-4 / 0.140e-4 / 0.264e-4 at orders 200/500/1000 and reported
      that the discrete error distribution is chosen subject to constraints minimising its Renyi
      divergence from the target Psi_{sigma*sqrt(2*pi)}. THAT IS A SEARCH SUMMARY, NOT A READ
      DOCUMENT, and is treated as recalled-strength corroboration of the RQ's own excerpt, not as
      a filed source.
      WEB FETCHES: https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem SUCCEEDED and
      returned the Sample pseudocode (t from bits 1..15, e incremented while t > T_X(i), e signed
      by r[0]) and a T_X table truncated at index 6 for each parameter set;
      https://eprint.iacr.org/2025/1562 SUCCEEDED; https://eprint.iacr.org/2026/1350 SUCCEEDED;
      https://eprint.iacr.org/2026/366 SUCCEEDED; https://www.ietf.org/archive/id/
      draft-longa-cfrg-frodokem-02.html returned 404; two PDF fetches failed as unreadable
      compressed streams. The FrodoKEM standard proposal PDF was NOT read.
    results: >-
      Nothing in this repository tracks the IDEAL distribution as an object. All eight lane
      proposals and both lane hypotheses take Psi as given and audit chi. H-FRODO-8ea540 audits
      the divergence-to-bit-security CONVERSION (orders, sample counts, per-sample versus
      whole-scheme reading) and is the nearest record; it explicitly concerns what the divergence
      BUYS, not what it is computed AGAINST, and its part (B) 'reading determination' is about the
      per-sample versus whole-scheme reading of the printed number, which is a different fork from
      the five enumerated here. IDEA-20260808-2df781 treats the table as a dyadic distribution and
      asks whether it minimises the divergence; it therefore PRESUPPOSES a fixed ideal and a fixed
      direction, which is exactly what this record refuses to presuppose - and this record's
      Stage 5 uses 2df781's optimality premise as a control rather than testing it.
      IDEA-20260805-390957's identities are table-internal and cannot distinguish two different
      ideals. On the external side, eprint 2025/1562 (fetched) formally verifies correctness
      bounds for lattice KEMs in EasyCrypt with ML-KEM as the main example and FrodoKEM as an
      additional example of 'a correctness bound without heuristic approximations' - that is the
      FAILURE-RATE side, not the divergence side, and it is cited in the sibling record
      IDEA-20260821-c037fc rather than here.
    verdict: >-
      UNVERIFIED. The FrodoKEM primary specification was not read; one IETF draft view and three
      eprint abstract pages were. CLAIMED NEW RELATIVE TO THIS REPOSITORY: taking the ideal
      distribution as the tracked object; enumerating the convention forks as a finite grid and
      using the published figures as an oracle over that grid; the asymmetry observation that one
      direction of the divergence is identically infinite by a support argument; and the
      observation in part (E) that the goal's own mandated exact-rational method is unachievable
      for the divergence. ASSEMBLED FROM KNOWN PARTS: Renyi divergence and its probability
      preservation property are standard (Bai et al., recalled); complete enumeration of a 16-bit
      input space is not a technique; certified enclosures of Phi are standard numerics. The
      contribution is the grid, the oracle reading, and the two structural observations.
  object_first_candidate:
    tracked_object: >-
      The PAIR (pushforward measure of the sampler, candidate ideal measure), followed through the
      single operation that consumes both - the Renyi divergence functional at a fixed order - and
      read out as an enclosure. The genuinely new half of the pair is the second component, which
      the lane has treated as a constant rather than as an object with structure.
    lossiness: >-
      LOSSY, and compatibly so. The pushforward discards the identity of the 16-bit input entirely:
      65536 inputs map onto at most 25 output values, so the fibre over a typical value has
      thousands of elements and the map is nowhere near invertible. This is not a change of
      coordinates - the discarded information (which r produced this e) is exactly the information
      no downstream operation of FrodoKEM ever reads, because the scheme uses only the sampled
      value. That is the compatibility condition of docs/inventor-protocol.md section 2, and it is
      met here in the strongest form: the discarded coordinate is provably never read again.
      The ideal-side projection is lossy in a second way: truncating Psi to chi's support discards
      the tail, and whether that discard is compatible with the divergence functional depends on
      the DIRECTION, which is precisely fork (4). One direction is compatible (the discarded mass
      contributes zero) and the other is catastrophically not (it contributes infinity). The
      lossy-projection test therefore does real work here rather than being a formality.
    propagation: >-
      One step of the target operation is one Sample call, and its propagation law IS the
      pushforward pmf. Because FrodoKEM draws n*nbar, nbar*n and mbar*nbar samples independently,
      the object propagates by convolution and survives to the failure-rate computation unchanged;
      that is the sense in which this object is upstream of essentially every number in the lane.
      Measurable one-step statement: the pmf's exact numerators over 2^16, which the enumeration
      produces with no free parameters.
    survival_score: >-
      SURVIVES THE ENTIRE COMPUTATION, which is unusual and is why this record is ranked first. It
      does not dissolve at any step of FrodoKEM: the divergence reads it directly, the failure
      rate reads its 2n-fold convolution, and the security argument reads the divergence. Where it
      DOES dissolve is at the boundary of the document: the object cannot tell you what the
      designers' script computed, only which candidate is consistent with what they printed, and
      the oracle reading in Stage 4 is set-valued for exactly that reason.
  null_object_control: >-
    THREE ARMS, all able to fail, all on the identical divergence code path.
    NULL-1 (CLOSED-FORM ARM, and it can fail): evaluate the pipeline on a two-point family,
    P = Ber(p) and Q = Ber(q) with p, q rational, for which
    R_a(P||Q) = (p^a q^(1-a) + (1-p)^a (1-q)^(1-a))^(1/(a-1)) in closed form. Require agreement to
    within the pipeline's own declared enclosure width at a >= 6 combinations of (p, q, a)
    including a = 200, 500, 1000. A pipeline that cannot reproduce a two-point closed form at
    order 1000 - where the exponentiation is numerically brutal - has no business being pointed at
    FrodoKEM, and this arm fails loudly when the exponentiation is done naively.
    NULL-2 (SENSITIVITY LADDER WITH A NAMED COMPARATOR AND A PRE-DECLARED THRESHOLD): perturb the
    pushforward at one support point by delta in {2^-22, 2^-20, 2^-18, 2^-16, 2^-14} - five points,
    hence at least three interior ones per the KN-TECH-1a5b7e obligation-3 refinement - with the
    comparator NAMED as the unperturbed winning cell, the threshold declared before the run as
    'the divergence enclosure must be disjoint from the unperturbed enclosure at delta = 2^-16',
    and MONOTONICITY in delta reported explicitly. The refinement matters here: the divergence is
    a minimum at the optimal table, so it is NOT monotone in a SIGNED perturbation and IS expected
    to be monotone in |delta|; the record therefore declares which it is testing and reports both.
    NULL-3 (FORCED-VALUE ARM, declared before the run so that its agreement carries no
    information): the 48 cells in the Psi||chi direction return +infinity by the support argument.
    Their value is DERIVED, not measured; if any of them returns a finite number the enclosure
    machinery is silently truncating Psi and the whole grid is void. This arm's power is precisely
    that it can expose a hidden truncation, which is the single most likely implementation defect
    in the design.
    CAN THIS NULL FAIL: yes, at all three arms, and NULL-1 and NULL-3 have both failed in
    recognisable ways in ordinary numerical practice (order-1000 exponentiation overflow; implicit
    support truncation). NULL-3 in particular is the direct instance of KN-TECH-1a5b7e's
    'comparator_spread_nonzero' tell in an infinite-valued form.
  discriminated_from:
  - >-
    IDEA-20260805-390957 and H-FRODO-e0c651 part 1 check identities INTERNAL to the table. Two
    different ideal distributions are consistent with the identical table, so those identities
    cannot separate any of the 96 cells; conversely this record would run unchanged if all five
    identities held exactly, which they are hand-checked here to do for normalisation.
  - >-
    IDEA-20260808-2df781 asks whether the table minimises the divergence over the dyadic class.
    That question is well-posed only AFTER the ideal and the direction are fixed, so this record
    is strictly upstream of it; and rather than duplicating its optimality test, Stage 5 CONSUMES
    its premise as a derived-sign control. If 2df781 later finds the table is not optimal, this
    record's Stage 5 control is weakened, not its main result.
  - >-
    H-FRODO-8ea540 and IDEA-20260805-57fc49 read the Renyi ORDER backwards for a sample budget and
    audit the conversion into a bit-security loss. They take the printed divergence VALUE as an
    input; this record asks what that value is a divergence OF. The two are complementary and the
    conversion audit is void if the value turns out to be in the other direction or against a
    renormalised ideal.
  - >-
    IDEA-20260805-411b60's mutation control perturbs a table entry and predicts a DFR shift in
    bits. This record's Stage 5 perturbs the pushforward and predicts a divergence shift with a
    derived SIGN. Different quantity, different predicted observable, and the sign prediction is
    the part 411b60 does not supply.
  - >-
    IDEA-20260805-f16b44 separates scale error from tail-shape error in a FAILURE RATE. Fork (2)
    of this record - the s-parameter versus standard-deviation reading - is a scale question about
    the IDEAL, not about the failure rate, and it is decided by an exact grid rather than by a
    sensitivity argument.
  - >-
    IDEA-20260808-e7ba81 (RQ-FNDSA-001) frames FN-DSA sampler exactness as a spiked-covariance
    detection problem. That is a statistical-detection design for a sampler whose output cannot be
    enumerated; FrodoKEM's can be enumerated completely, so no detection problem exists here and
    no statistics are used at all in Stage 1.
  citations:
  - ref: draft-longa-cfrg-frodokem (IETF datatracker HTML view)
    provenance: retrieved
    claim: >-
      Frodo Sample computes t from bits r[1..15], increments e for each i in 0..d-1 with
      t > T_X(i), then sets e = (-1)^(r[0]) * e. T_X(0) = 4643 / 5638 / 9142 for
      Frodo-640 / -976 / -1344; further returned entries for Frodo-640 are 13363, 20579, 25843,
      29227, 31145, 32103. The returned table was TRUNCATED at index 6 by the fetch and the
      content is a summariser's extraction, so it may be extraction-damaged.
    verified_by: idea-generator@2026-08-21
  - ref: RQ-FRODO-3260cc.provenance (this repository)
    provenance: internal
    claim: >-
      The extraction-damaged Table A.3 run for Frodo-640, '2.8 9288 8720 7216 5264 3384 1918 958
      422 164 56 17 4 1 200 0.324e-4'. This record's hand arithmetic reconciles it exactly with
      the fetched CDF table under the strict-inequality plus wasted-sign-bit reading.
    verified_by: idea-generator@2026-08-21
  - ref: >-
      Bai, Lepoint, Roux-Xhaferi, Sakzad, Stehle, Steinfeld, "Improved security proofs in
      lattice-based cryptography using the Renyi divergence rather than the statistical distance"
    provenance: recalled
    claim: >-
      The probability-preservation property of the Renyi divergence, which fixes which of the two
      arguments must be the real distribution and which the ideal, and hence fixes fork (4). A
      search result summary on 2026-08-21 listed a paper of this title; it was NOT fetched or read.
    verified_by: null
  assumptions:
  - >-
    The Sample pseudocode transcribed from the CFRG draft fetch agrees with the FrodoKEM standard
    proposal once filed. RQ-FRODO-3260cc.constraints[0] makes filing a precondition; the fetched
    content is a summariser's extraction with a visibly truncated table and MUST be re-read.
  - >-
    The hand arithmetic in claim (B) is arithmetic performed by the proposing agent in this
    session and recorded here for the executor to re-derive by machine. IT IS NOT A RUN RECORD and
    no evidence record may cite it as a measurement.
  - >-
    The published order/divergence pairs (200, 0.324e-4), (500, 0.140e-4), (1000, 0.264e-4) are
    research targets carried from RQ-FRODO-3260cc.provenance and corroborated only by a search
    summary. If the filed text differs, the oracle's target values change and the grid is re-read.
  - >-
    The candidate list of 96 cells is a claim about which conventions are PLAUSIBLE, not a proof
    that no other convention exists. If no cell reproduces, the first hypothesis to test is that
    the list is incomplete, not that the document is wrong.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the identification of the second argument
      of the divergence. Every downstream number in the lane - the bit-security conversion, the
      sample-count receipt, the optimality question - is conditioned on an ideal nobody has pinned
      down, and no amount of table-side rigour reaches it.
    baseline_embedding:
      parameter_slice: >-
        The baseline is the tacit reading currently used everywhere: untruncated rounded Gaussian
        of standard deviation sigma, direction chi||Psi, printed quantity R_a - 1. That is cell
        (rounded, sigma, untruncated, chi||Psi, R_a-1) of the grid, and the grid reproduces it
        exactly as one of its 96 rows. If the baseline cell wins, the baseline is confirmed AND is
        now confirmed rather than assumed, which is the whole point of embedding it.
      reproduction_check: >-
        Symbolic plus fixture: the baseline cell must reproduce the closed-form NULL-1 values, and
        the pushforward must reproduce the hand-derived numerators of claim (B) exactly. Both are
        frozen fixtures, not curve comparisons.
    observation_collision:
      observable: >-
        The printed divergence figure at three significant digits, at one order, per parameter set.
      distinct_preimage_search: >-
        A collision is not merely possible, it is the expected mode of failure and is a NAMED
        OUTCOME: several distinct cells - most obviously untruncated versus truncated-unnormalised,
        which differ only by the mass Psi places outside |z| <= d - can agree to three significant
        digits. That is why the oracle requires SIMULTANEOUS consistency across all three parameter
        sets, whose sigma and support differ, and why the deliverable is a SET of surviving cells
        with a statement of which conventions the published precision cannot separate. Reporting a
        single winner where the fibre has several members would be exactly the identifiability
        failure section 8 warns about.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace 'chi, the thirteen-integer table' with 'chi, the pushforward of Uniform({0,1}^16)
        under the literal pseudocode', a model in which the boundary and sign conventions become
        exact equalities computed by enumeration rather than readings inferred from prose.
      predicted_gain: >-
        Removal of every table-reading degree of freedom on the chi side, so that all remaining
        ambiguity is provably on the Psi side, where the grid then isolates it. Encoding,
        completeness and soundness obligations are trivial here because the input space is finite
        and exhausted.
    - transform: observable_fiber
      proposed_object: >-
        Hold the printed figure fixed and vary the convention; the fibre is the set of cells
        consistent with it. The intrinsic invariant that distinguishes fibre members is the
        behaviour under the Stage 5 perturbation, since truncated and untruncated ideals respond
        differently to mass moved onto the support boundary.
      predicted_gain: >-
        A second, independent discriminator when the printed precision alone leaves the fibre
        larger than one.
    quantifier_order: >-
      THERE EXISTS a convention cell c in the 96-cell grid SUCH THAT FOR ALL parameter sets
      P in {640, 976, 1344}, the enclosure D_c(P) contains the published figure at its printed
      precision. Note the order: the existential is OUTSIDE the universal, which is what makes the
      claim strong and falsifiable. The weaker statement with the quantifiers swapped - for each P
      there exists some cell - is nearly vacuous, because with 96 cells per parameter set almost
      any figure is hit by something, and the design would be worthless under it. The record
      commits to the strong order and will report the weak one as a FAILURE if that is what occurs.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is: this set of conventions is consistent with the printed
        figures and this set is not. The method can NEVER certify what the designers' script
        actually did, and it cannot certify a document is in error - only that no enumerated
        convention reproduces it, which is a statement about the enumeration as much as about the
        document.
      nearby_object_control: >-
        The nearby object on which the desired conclusion fails is Frodo-1344: its support is the
        narrowest of the three (its fetched CDF reaches 32767 at index 6), so the mass Psi places
        outside chi's support is LARGEST there and the truncated versus untruncated cells are
        FURTHEST apart. A method that returned the same surviving set at Frodo-1344 as at Frodo-640
        would not be reading the truncation at all and has not identified the load-bearing
        structure. This asymmetry across parameter sets is the method's own internal check.
    proof_obligations:
    - claim: R_a(Psi||chi) = +infinity for all a > 1 by the support argument
      responsibility: correctness
    - claim: the pushforward by exhaustion equals the hand-derived numerators
      responsibility: baseline
    - claim: every Psi enclosure has a proved remainder bound and a reported width
      responsibility: size
    - claim: the pipeline reproduces the two-point closed form at order 1000
      responsibility: interface
    - claim: the surviving set is reported as a set, not reduced to a winner
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: >-
      exact pmf numerators over 2^16 from the 2^16-input enumeration, compared with the numerators
      derived analytically from the filed CDF table
    direction: different
    minimum_effect: >-
      zero difference is REQUIRED at every support point; any difference localises a boundary
      convention to a named index and is the finding
  - metric: numerator of Pr[chi = 0] over 2^16 at Frodo-640
    direction: higher
    minimum_effect: >-
      predicted exactly 9288 = 2*4643 + 2, i.e. exactly 2 more than the "+1"-free reading; the
      prediction is exact and a single unit of disagreement refutes it
  - metric: >-
      number of the 96 cells whose enclosure contains the published figure at ALL THREE parameter
      sets simultaneously
    direction: lower
    minimum_effect: >-
      1 is the target; 0 means a discrepancy or an incomplete enumeration; >= 2 means the printed
      precision does not determine the convention and the surviving set is the deliverable
  - metric: value returned by every Psi||chi cell
    direction: different
    minimum_effect: >-
      +infinity exactly, in all 48 such cells; a single finite return exposes a hidden truncation
      and voids the grid
  - metric: >-
      relative width of the certified enclosure divided by the published figure's last significant
      digit
    direction: lower
    minimum_effect: >-
      < 1, i.e. the enclosure must be narrower than the printed precision; a width >= 1 means the
      oracle cannot read at the published precision and NO cell may be reported as surviving
  - metric: divergence of the winning cell under the Stage 5 "+2"-removal perturbation
    direction: higher
    minimum_effect: >-
      strictly greater than the unperturbed value, by the local-optimality premise; a decrease
      refutes local optimality or exposes a bug and is reported as such
  minimal_test:
    design: >-
      One invocation, seconds of single-core compute, no scheme simulation and no sampling
      anywhere. (1) Enumerate all 65536 sampler inputs and emit the exact pmf; cross-check against
      the analytic numerators. (2) Build the 96 candidate ideals as certified enclosures with
      reported widths. (3) Evaluate the divergence enclosure in each cell at each parameter set at
      the published order. (4) Report the SET of cells consistent with all three published figures,
      the enclosure widths, and the 48 forced +infinity returns. (5) Run the closed-form Bernoulli
      null, the five-point perturbation ladder with declared threshold and reported monotonicity,
      and the Stage 5 derived-sign mutation. THIS DISCRIMINATES because the three published figures
      at three different sigma and three different supports overdetermine a 96-cell grid: a
      convention that is right for one parameter set and wrong for the others cannot survive, and
      a grid in which everything survives has told you that the printed precision is insufficient -
      which is itself a definite, reportable answer rather than a null result.
    controls:
    - two-point Bernoulli closed-form arm at >= 6 (p, q, a) combinations including a = 1000
    - >-
      five-point perturbation ladder with the comparator named, the threshold pre-declared, and
      monotonicity in |delta| reported explicitly
    - >-
      forced-value arm: the 48 Psi||chi cells must return +infinity, derived before the run
    - >-
      enclosure-width gate: no cell is reported as surviving unless its width is below the printed
      precision, checked and reported BEFORE any comparison
    - >-
      derived-sign mutation control on the "+2" at zero, with the predicted sign written down first
    - >-
      cross-parameter-set consistency requirement, which is what prevents a coincidental single-set
      match from being reported
    required_metrics:
    - exact pmf numerators over 2^16, all support points, all three parameter sets
    - per-cell divergence enclosure, endpoints as rationals, all 96 cells x 3 parameter sets
    - per-cell enclosure width, absolute and relative to the printed precision
    - the surviving set of cells, as a set
    - closed-form null residuals at each (p, q, a)
    - ladder values at all five delta, with a monotonicity flag
    - Stage 5 perturbed divergence and its sign relative to the unperturbed value
  falsification_conditions:
  - >-
    The enumeration disagrees with the analytic numerators. A boundary convention is misread and
    the index at which they diverge is the finding.
  - >-
    Pr[chi=0] numerator is not 9288 at Frodo-640. The strict-inequality plus wasted-sign-bit
    reading is refuted and the hand derivation in claim (B) is withdrawn.
  - >-
    No cell reproduces all three figures. Either the enumeration of conventions is incomplete -
    which is the first hypothesis and must be tested by widening the grid - or there is a
    discrepancy, which is then quantified per cell and reported as a documentation defect, never
    as an attack.
  - >-
    More than one cell reproduces all three. The oracle is not discriminating at the printed
    precision; the deliverable becomes the surviving set plus a statement of what precision would
    separate it, and NO convention determination is reported.
  - >-
    Any Psi||chi cell returns a finite value. Hidden truncation; the grid is void until fixed.
  - >-
    Enclosure widths exceed the printed precision. The instrument cannot read the oracle and no
    surviving set may be reported; the deliverable shrinks to the enclosure widths themselves,
    which is still a usable obstruction with a number.
  - >-
    The Stage 5 perturbation decreases the divergence. Local optimality of the published table is
    refuted at that perturbation, which contradicts the design criterion reported by the search
    summary and would be a substantive finding for IDEA-20260808-2df781's lane.
  confounders:
  - >-
    Order-1000 exponentiation. Computing p^a with a = 1000 on quantities near 1e-5 destroys naive
    floating point silently, and a wrong answer here looks exactly like a convention mismatch. The
    Bernoulli closed-form null at a = 1000 exists specifically to catch this and must be run first.
  - >-
    Reading a summariser's extraction as primary text. Every number in the fetched draft view is
    at risk, the T_X tables were returned truncated, and the parameter names may be the
    summariser's. The source gate of RQ-FRODO-3260cc.constraints[0] is not optional.
  - >-
    Grid inflation. With 96 cells and three targets there is a real multiple-comparisons hazard;
    the cross-parameter-set simultaneity requirement is the mitigation and its false-match rate
    should be derived before the run in the style of KN-TECH-1a5b7e's rule_false_positive_rate.
  - >-
    Confusing the printed quantity's UNITS with its convention. R_a, R_a - 1 and ln R_a differ by
    ~1e-5 at these magnitudes, i.e. by about the size of the figure itself, so fork (5) can
    masquerade as fork (3). The design handles this by treating them as independent axes and
    reporting the surviving set rather than a winner.
  - >-
    Anchoring on the RQ's excerpted values. They are extraction-damaged research targets, and this
    record's own hand reconciliation, while it matches term for term, is hand arithmetic and could
    itself be wrong.
  interpretation_limits:
  - >-
    NO ATTACK, NO BREAK, NO EXPONENT, NO STATEMENT ABOUT LWE HARDNESS. Determining a convention is
    a documentation result at the tier docs/claims-and-verification.md calls an arithmetic claim.
  - >-
    A determined convention says what is CONSISTENT with the printed figures, never what the
    designers computed. The set-valued deliverable is the honest form of that limit.
  - >-
    Everything is scoped to the three standardized parameter sets, the published orders, and the
    96 enumerated conventions. Another convention outside the grid is not spoken for.
  - >-
    Part (E)'s correction is about the goal's METHOD statement, not about anyone's competence, and
    it does not imply any published figure is wrong.
  heuristic_assumptions:
  - id: H1
    statement: >-
      The certified enclosure of the Gaussian CDF used to build each candidate Psi has a proved
      remainder bound, so that for every z and every candidate the returned interval provably
      contains the true value; and the propagated enclosure of the divergence at order a is
      therefore a rigorous bracket, not an estimate. Formally: for all z in the support and all
      candidates c, Psi_c(z) is an element of [lo_c(z), hi_c(z)] with hi - lo bounded by an
      explicitly computed function of the truncation index of the series used.
    rigorous_support: >-
      The rigorous ingredient is the alternating-series or Taylor remainder bound for the error
      function, which supplies a proved two-sided bound; the heuristic content is only that the
      implementation realises the bound it claims. This pairs a rigorous bound with a concrete
      instantiation in the manner the target profile requires, and it is the DIVERGENCE-side
      analogue of the exact-rational guarantee available on the chi side.
    validation_plan: >-
      Validated at the REAL parameters, not at toy scale, because the support has at most 25
      points. Route: (i) recompute every Psi_c(z) at two different series truncation indices and
      require the two enclosures to be nested; (ii) recompute with an independent
      arbitrary-precision library at 3x the working precision and require containment; (iii) tail
      check on the extreme support point, where the enclosure is widest in relative terms, against
      an independently derived Mills-ratio bound. Sampled parameters: sigma = 2.8 / 2.3 / 1.4 as
      filed, supports as filed, orders 200 / 500 / 1000 as filed. Transfer assumption: NONE - the
      validation is at the standardized parameters themselves.
  - id: H2
    statement: >-
      The set of 96 enumerated conventions contains the one used to produce the published figures.
      Formally: there exists c in the grid such that the designers' computed quantity equals
      D_c(P) for all three P.
    rigorous_support: >-
      No rigorous support exists and none is claimed; this is the assumption most likely to be
      false and it is named as such rather than hidden. Its rigorous companion is only the
      negative: the grid is CLOSED under the five forks as stated, so a failure localises the
      missing convention to something outside those five axes.
    validation_plan: >-
      Falsified directly by the run: if no cell survives, H2 is refuted at the enumerated grid, and
      the response is to widen the grid along a named sixth axis (candidates: a different rounding
      convention at half-integers; a divergence defined over a shifted support; an order applied to
      the whole sample vector rather than per sample, which is H-FRODO-8ea540's fork). Report the
      widened grid as an amendment, never as a re-read of the original.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD FOLLOW. Cost of the measurement: 2^16 sampler
      evaluations (microseconds), then 96 x 3 divergence enclosures over supports of size <= 25
      with exponentiation at order <= 1000 in arbitrary precision - milliseconds to seconds in
      total. This is the cheapest design in the lane by orders of magnitude.
    memory_exponent: >-
      No attack memory exponent is claimed. Working set is a few kilobytes: three pmfs of <= 25
      rationals, 96 candidate ideals of the same size, and their enclosures.
    best_known: >-
      No incumbent exists in this repository for the identity of FrodoKEM's ideal distribution;
      the eight lane proposals presuppose it. Externally, eprint 2025/1562 (fetched) verifies
      correctness bounds and not the divergence, and the search for divergence-specific
      recomputation returned only the specification family itself. There is no attack frontier row
      because no attack is proposed.
    hidden_overhead: >-
      Nothing is hidden in an o(1) because there is no asymptotic claim. What the cost estimate
      DOES hide is that the enclosure width, not the arithmetic, is the binding constraint: if the
      published figures carry only three significant digits, the oracle's resolving power is set by
      the DOCUMENT and not by the computation, and no amount of precision fixes that. The record
      makes this a reporting precondition rather than a discovered disappointment.
    tradeoff_note: >-
      Not applicable in the time-memory sense. The relevant tradeoff is precision versus grid
      width: widening the grid along a sixth axis multiplies the false-match rate, so grid width
      must be declared before the run and any widening recorded as an amendment.
  dominated_by: >-
    n/a (no attack result claimed). Checked against the frontier this repository holds: there is no
    time/memory/data row for any FrodoKEM attack in ledger/evidence, and the implementation-attack
    corpus entries are excluded by RQ-FRODO-3260cc.constraints[5]. On the measurement axis, nothing
    in the repository computes a FrodoKEM divergence at all, so there is nothing that dominates
    this. Recording bare 'null' would assert a check against a frontier row that does not exist and
    is forbidden by AGENTS.md rule 5.
  sota_delta: >-
    No attack; conceptual and measurement contribution only. Quantitatively: the repository holds
    zero computed divergence values, zero enclosures and zero statements about the ideal
    distribution's convention; this record would produce 288 enclosures, a surviving set, and one
    structural correction to the goal's method section (part E). Against the literature reached
    this session there is no work enumerating FrodoKEM's divergence conventions; that is a negative
    search result, not an assertion about the literature.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the 2^16 enumeration reproduces the hand-derived numerators including the
    9288: ~0.9 - the six-term CDF-difference match and the exact sum to 2^16 are strong, and the
    residual risk is extraction damage in the fetched table. (ii) That every Psi||chi cell returns
    +infinity, i.e. no hidden truncation: ~0.7, and I would not be surprised to see this arm fail
    on the first implementation, which is exactly why it is a control. (iii) That the enclosure
    width comes in below the printed precision: ~0.85. (iv) That EXACTLY ONE cell survives all
    three parameter sets: ~0.35 - this is the part I would bet against, and I expect a surviving
    SET of two or three, most likely untruncated versus truncated-unnormalised being
    indistinguishable at three significant digits. (v) That the run produces either a determination
    or a precisely characterised surviving set: ~0.9. (vi) That part (E)'s correction stands, i.e.
    no candidate ideal admits an exact rational divergence: ~0.95, since every candidate involves
    exp or Phi.
