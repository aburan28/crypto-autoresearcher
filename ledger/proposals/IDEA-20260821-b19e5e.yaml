    session and recorded here for the executor to re-derive by machine. IT IS NOT A RUN RECORD and
    no evidence record may cite it as a measurement.
  - >-
    The forced-value derivations of NULL-3a and NULL-3b are likewise hand derivations performed by
    the proposing agent (2026-08-21, corrected 2026-08-24). They are algebra, not measurements,
    and the executor must re-derive the 16/32 split mechanically from the grid's own axis
    definitions before either arm is read.
  - >-
    The published order/divergence pairs (200, 0.324e-4), (500, 0.140e-4), (1000, 0.264e-4) are
    research targets carried from RQ-FRODO-3260cc.provenance and corroborated only by a search
    summary. If the filed text differs, the oracle's target values change and the grid is re-read.
  - >-
    The candidate list of 96 cells is a claim about which conventions are PLAUSIBLE, not a proof
    that no other convention exists. If no cell reproduces, the first hypothesis to test is that
    the list is incomplete, not that the document is wrong.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the identification of the second argument
      of the divergence. Every downstream number in the lane - the bit-security conversion, the
      sample-count receipt, the optimality question - is conditioned on an ideal nobody has pinned
      down, and no amount of table-side rigour reaches it.
    baseline_embedding:
      parameter_slice: >-
        The baseline is the tacit reading currently used everywhere: untruncated rounded Gaussian
        of standard deviation sigma, direction chi||Psi, printed quantity R_a - 1. That is cell
        (rounded, sigma, untruncated, chi||Psi, R_a-1) of the grid, and the grid reproduces it
        exactly as one of its 96 rows. If the baseline cell wins, the baseline is confirmed AND is
        now confirmed rather than assumed, which is the whole point of embedding it.
      reproduction_check: >-
        Symbolic plus fixture: the baseline cell must reproduce the closed-form NULL-1 values, and
        the pushforward must reproduce the hand-derived numerators of claim (B) exactly. Both are
        frozen fixtures, not curve comparisons.
    observation_collision:
      observable: >-
        The printed divergence figure at three significant digits, at one order, per parameter set.
      distinct_preimage_search: >-
        A collision is not merely possible, it is the expected mode of failure and is a NAMED
        OUTCOME: several distinct cells - most obviously untruncated versus truncated-unnormalised,
        which differ only by the mass Psi places outside |z| <= d - can agree to three significant
        digits. That is why the oracle requires SIMULTANEOUS consistency across all three parameter
        sets, whose sigma and support differ, and why the deliverable is a SET of surviving cells
        with a statement of which conventions the published precision cannot separate. Reporting a
        single winner where the fibre has several members would be exactly the identifiability
        failure section 8 warns about. Note that the untruncated-versus-truncated collision is
        confined to the chi||Psi half of the grid: in the Psi||chi half the same two conventions
        are separated by an infinite gap and cannot collide at all, which is a second reason the
        16/32 split had to be derived correctly before the fibre could be described.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Replace 'chi, the thirteen-integer table' with 'chi, the pushforward of Uniform({0,1}^16)
        under the literal pseudocode', a model in which the boundary and sign conventions become
        exact equalities computed by enumeration rather than readings inferred from prose.
      predicted_gain: >-
        Removal of every table-reading degree of freedom on the chi side, so that all remaining
        ambiguity is provably on the Psi side, where the grid then isolates it. Encoding,
        completeness and soundness obligations are trivial here because the input space is finite
        and exhausted.
    - transform: observable_fiber
      proposed_object: >-
        Hold the printed figure fixed and vary the convention; the fibre is the set of cells
        consistent with it. The intrinsic invariant that distinguishes fibre members is the
        behaviour under the Stage 5 perturbation, since truncated and untruncated ideals respond
        differently to mass moved onto the support boundary.
      predicted_gain: >-
        A second, independent discriminator when the printed precision alone leaves the fibre
        larger than one.
    quantifier_order: >-
      THERE EXISTS a convention cell c among the 80 non-forced-infinite cells of the 96-cell grid
      SUCH THAT FOR ALL parameter sets
      P in {640, 976, 1344}, the enclosure D_c(P) contains the published figure at its printed
      precision. Note the order: the existential is OUTSIDE the universal, which is what makes the
      claim strong and falsifiable. The weaker statement with the quantifiers swapped - for each P
      there exists some cell - is nearly vacuous, because with 80 candidate cells per parameter set
      almost any figure is hit by something, and the design would be worthless under it. The record
      commits to the strong order and will report the weak one as a FAILURE if that is what occurs.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is: this set of conventions is consistent with the printed
        figures and this set is not. The method can NEVER certify what the designers' script
        actually did, and it cannot certify a document is in error - only that no enumerated
        convention reproduces it, which is a statement about the enumeration as much as about the
        document.
      nearby_object_control: >-
        The nearby object on which the desired conclusion fails is Frodo-1344: its support is the
        narrowest of the three (its fetched CDF reaches 32767 at index 6), so the mass Psi places
        outside chi's support is LARGEST there and the truncated versus untruncated cells are
        FURTHEST apart. A method that returned the same surviving set at Frodo-1344 as at Frodo-640
        would not be reading the truncation at all and has not identified the load-bearing
        structure. This asymmetry across parameter sets is the method's own internal check.
    proof_obligations:
    - claim: >-
        R_a(Psi||chi) = +infinity for all a > 1 in exactly the 16 grid cells where Psi is the
        UNTRUNCATED candidate, and is finite in the other 32 Psi||chi cells
      responsibility: correctness
    - claim: the pushforward by exhaustion equals the hand-derived numerators
      responsibility: baseline
    - claim: every Psi enclosure has a proved remainder bound and a reported width
      responsibility: size
    - claim: the pipeline reproduces the two-point closed form at order 1000
      responsibility: interface
    - claim: the surviving set is reported as a set, not reduced to a winner
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: >-
      exact pmf numerators over 2^16 from the 2^16-input enumeration, compared with the numerators
      derived analytically from the filed CDF table
    direction: different
    minimum_effect: >-
      zero difference is REQUIRED at every support point; any difference localises a boundary
      convention to a named index and is the finding
  - metric: numerator of Pr[chi = 0] over 2^16 at Frodo-640
    direction: higher
    minimum_effect: >-
      predicted exactly 9288 = 2*4643 + 2, i.e. exactly 2 more than the "+1"-free reading; the
      prediction is exact and a single unit of disagreement refutes it
  - metric: >-
      number of the 80 non-forced-infinite cells whose enclosure contains the published figure at
      ALL THREE parameter sets simultaneously
    direction: lower
    minimum_effect: >-
      1 is the target; 0 means a discrepancy or an incomplete enumeration; >= 2 means the printed
      precision does not determine the convention and the surviving set is the deliverable
  - metric: >-
      value returned by each of the 16 cells with direction = Psi||chi AND truncation =
      untruncated
    direction: different
    minimum_effect: >-
      +infinity exactly, in all 16 such cells; a single finite return exposes a hidden truncation
      of Psi and voids the grid
  - metric: >-
      value returned by each of the 32 cells with direction = Psi||chi AND truncation in
      {truncated-unnormalised, truncated-renormalised}
    direction: different
    minimum_effect: >-
      finite in all 32 such cells - a derived identity, not a measurement; a single +infinity
      return exposes a support mismatch (supp(Psi) placed outside supp(chi)) and voids the grid.
      This is the arm the 2026-08-24 repair added; without it the pipeline defect it detects was
      invisible and, worse, correct behaviour in these 32 cells would have tripped the old
      falsification condition
  - metric: >-
      relative width of the certified enclosure divided by the published figure's last significant
      digit
    direction: lower
    minimum_effect: >-
      < 1, i.e. the enclosure must be narrower than the printed precision; a width >= 1 means the
      oracle cannot read at the published precision and NO cell may be reported as surviving
  - metric: divergence of the winning cell under the Stage 5 "+2"-removal perturbation
    direction: higher
    minimum_effect: >-
      strictly greater than the unperturbed value, by the local-optimality premise; a decrease
      refutes local optimality or exposes a bug and is reported as such
  minimal_test:
    design: >-
      One invocation, seconds of single-core compute, no scheme simulation and no sampling
      anywhere. (1) Enumerate all 65536 sampler inputs and emit the exact pmf; cross-check against
      the analytic numerators. (2) Build the 96 candidate ideals as certified enclosures with
      reported widths. (3) Evaluate the divergence enclosure in each cell at each parameter set at
      the published order. (4) Report the SET of cells consistent with all three published figures,
      the enclosure widths, the 16 forced +infinity returns and the 32 forced finite returns.
      (5) Run the closed-form Bernoulli null, the five-point perturbation ladder with declared
      threshold and reported monotonicity, and the Stage 5 derived-sign mutation.
      THIS DISCRIMINATES because the three published figures
      at three different sigma and three different supports overdetermine an 80-cell candidate
      space: a convention that is right for one parameter set and wrong for the others cannot
      survive, and a grid in which everything survives has told you that the printed precision is
      insufficient - which is itself a definite, reportable answer rather than a null result.
    controls:
    - two-point Bernoulli closed-form arm at >= 6 (p, q, a) combinations including a = 1000
    - >-
      five-point perturbation ladder with the comparator named, the threshold pre-declared, and
      monotonicity in |delta| reported explicitly
    - >-
      forced-value arm NULL-3a: the 16 cells with direction = Psi||chi and truncation =
      untruncated must return +infinity, derived before the run
    - >-
      forced-value arm NULL-3b: the 32 cells with direction = Psi||chi and truncation in
      {truncated-unnormalised, truncated-renormalised} must return a FINITE value, derived before
      the run; this arm detects the opposite defect from NULL-3a and neither substitutes for it
    - >-
      enclosure-width gate: no cell is reported as surviving unless its width is below the printed
      precision, checked and reported BEFORE any comparison
    - >-
      derived-sign mutation control on the "+2" at zero, with the predicted sign written down first
    - >-
      cross-parameter-set consistency requirement, which is what prevents a coincidental single-set
      match from being reported
    required_metrics:
    - exact pmf numerators over 2^16, all support points, all three parameter sets
    - per-cell divergence enclosure, endpoints as rationals, all 96 cells x 3 parameter sets
    - per-cell enclosure width, absolute and relative to the printed precision
    - >-
      the finite/infinite disposition of every one of the 48 Psi||chi cells, tabulated against the
      derived 16-infinite / 32-finite split
    - the surviving set of cells, as a set, drawn from the 80 non-forced-infinite cells
    - closed-form null residuals at each (p, q, a)
    - ladder values at all five delta, with a monotonicity flag
    - Stage 5 perturbed divergence and its sign relative to the unperturbed value
  falsification_conditions:
  - >-
    The enumeration disagrees with the analytic numerators. A boundary convention is misread and
    the index at which they diverge is the finding.
  - >-
    Pr[chi=0] numerator is not 9288 at Frodo-640. The strict-inequality plus wasted-sign-bit
    reading is refuted and the hand derivation in claim (B) is withdrawn.
  - >-
    No cell reproduces all three figures. Either the enumeration of conventions is incomplete -
    which is the first hypothesis and must be tested by widening the grid - or there is a
    discrepancy, which is then quantified per cell and reported as a documentation defect, never
    as an attack.
  - >-
    More than one cell reproduces all three. The oracle is not discriminating at the printed
    precision; the deliverable becomes the surviving set plus a statement of what precision would
    separate it, and NO convention determination is reported.
  - >-
    Any of the 16 cells with direction = Psi||chi AND truncation = untruncated returns a finite
    value. Hidden truncation of Psi; the grid is void until fixed. CORRECTED 2026-08-24: the
    previous version of this condition named all 48 Psi||chi cells, which would have voided the
    grid on the first CORRECTLY implemented truncated cell. Only the 16-cell subset is forced to
    +infinity.
  - >-
    Any of the 32 cells with direction = Psi||chi AND truncation in {truncated-unnormalised,
    truncated-renormalised} returns +infinity. Support mismatch - supp(Psi) has been placed
    outside supp(chi), or a chi support point has been assigned zero mass; the grid is void until
    fixed. This condition and the previous one are opposite in direction and both are required.
  - >-
    Enclosure widths exceed the printed precision. The instrument cannot read the oracle and no
    surviving set may be reported; the deliverable shrinks to the enclosure widths themselves,
    which is still a usable obstruction with a number.
  - >-
    The Stage 5 perturbation decreases the divergence. Local optimality of the published table is
    refuted at that perturbation, which contradicts the design criterion reported by the search
    summary and would be a substantive finding for IDEA-20260808-2df781's lane.
  confounders:
  - >-
    Order-1000 exponentiation. Computing p^a with a = 1000 on quantities near 1e-5 destroys naive
    floating point silently, and a wrong answer here looks exactly like a convention mismatch. The
    Bernoulli closed-form null at a = 1000 exists specifically to catch this and must be run first.
  - >-
    Reading a summariser's extraction as primary text. Every number in the fetched draft view is
    at risk, the T_X tables were returned truncated, and the parameter names may be the
    summariser's. The source gate of RQ-FRODO-3260cc.constraints[0] is not optional.
  - >-
    Grid inflation. With 80 candidate cells and three targets there is a real multiple-comparisons
    hazard; the cross-parameter-set simultaneity requirement is the mitigation and its false-match
    rate should be derived before the run in the style of KN-TECH-1a5b7e's
    rule_false_positive_rate, using 80 and not 96 as the candidate count.
  - >-
    Confusing the printed quantity's UNITS with its convention. R_a, R_a - 1 and ln R_a differ by
    ~1e-5 at these magnitudes, i.e. by about the size of the figure itself, so fork (5) can
    masquerade as fork (3). The design handles this by treating them as independent axes and
    reporting the surviving set rather than a winner.
  - >-
    ARITHMETIC ON THE GRID'S OWN AXES. The 2026-08-24 repair exists because this record's first
    version mis-derived a forced value by treating an axis product as if one axis did not
    interact with another. The mitigation is that every count in this record (96, 48, 16, 32, 80)
    must be recomputed mechanically from the axis definitions by the executor before any arm is
    read, and a mismatch between the executor's count and this record's count halts the run.
  - >-
    Anchoring on the RQ's excerpted values. They are extraction-damaged research targets, and this
    record's own hand reconciliation, while it matches term for term, is hand arithmetic and could
    itself be wrong.
  interpretation_limits:
  - >-
    NO ATTACK, NO BREAK, NO EXPONENT, NO STATEMENT ABOUT LWE HARDNESS. Determining a convention is
    a documentation result at the tier docs/claims-and-verification.md calls an arithmetic claim.
  - >-
    A determined convention says what is CONSISTENT with the printed figures, never what the
    designers computed. The set-valued deliverable is the honest form of that limit.
  - >-
    Everything is scoped to the three standardized parameter sets, the published orders, and the
    96 enumerated conventions, of which only 80 are oracle candidates. Another convention outside
    the grid is not spoken for.
  - >-
    Part (E)'s correction is about the goal's METHOD statement, not about anyone's competence, and
    it does not imply any published figure is wrong.
  heuristic_assumptions:
  - id: H1
    statement: >-
      The certified enclosure of the Gaussian CDF used to build each candidate Psi has a proved
      remainder bound, so that for every z and every candidate the returned interval provably
      contains the true value; and the propagated enclosure of the divergence at order a is
      therefore a rigorous bracket, not an estimate. Formally: for all z in the support and all
      candidates c, Psi_c(z) is an element of [lo_c(z), hi_c(z)] with hi - lo bounded by an
      explicitly computed function of the truncation index of the series used.
    rigorous_support: >-
      The rigorous ingredient is the alternating-series or Taylor remainder bound for the error
      function, which supplies a proved two-sided bound; the heuristic content is only that the
      implementation realises the bound it claims. This pairs a rigorous bound with a concrete
      instantiation in the manner the target profile requires, and it is the DIVERGENCE-side
      analogue of the exact-rational guarantee available on the chi side.
    validation_plan: >-
      Validated at the REAL parameters, not at toy scale, because the support has at most 25
      points. Route: (i) recompute every Psi_c(z) at two different series truncation indices and
      require the two enclosures to be nested; (ii) recompute with an independent
      arbitrary-precision library at 3x the working precision and require containment; (iii) tail
      check on the extreme support point, where the enclosure is widest in relative terms, against
      an independently derived Mills-ratio bound. Sampled parameters: sigma = 2.8 / 2.3 / 1.4 as
      filed, supports as filed, orders 200 / 500 / 1000 as filed. Transfer assumption: NONE - the
      validation is at the standardized parameters themselves.
  - id: H2
    statement: >-
      The set of 96 enumerated conventions contains the one used to produce the published figures,
      and moreover that convention is one of the 80 that are not forced to +infinity. Formally:
      there exists c in the grid with D_c finite such that the designers' computed quantity equals
      D_c(P) for all three P.
    rigorous_support: >-
      No rigorous support exists and none is claimed; this is the assumption most likely to be
      false and it is named as such rather than hidden. Its rigorous companion is only the
      negative: the grid is CLOSED under the five forks as stated, so a failure localises the
      missing convention to something outside those five axes. The restriction to 80 cells is not
      an assumption but a derived consequence - a published finite figure cannot have come from a
      cell whose value is provably +infinity.
    validation_plan: >-
      Falsified directly by the run: if no cell survives, H2 is refuted at the enumerated grid, and
      the response is to widen the grid along a named sixth axis (candidates: a different rounding
      convention at half-integers; a divergence defined over a shifted support; an order applied to
      the whole sample vector rather than per sample, which is H-FRODO-8ea540's fork). Report the
      widened grid as an amendment, never as a re-read of the original.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD FOLLOW. Cost of the measurement: 2^16 sampler
      evaluations (microseconds), then 96 x 3 divergence enclosures over supports of size <= 25
      with exponentiation at order <= 1000 in arbitrary precision - milliseconds to seconds in
      total. This is the cheapest design in the lane by orders of magnitude.
    memory_exponent: >-
      No attack memory exponent is claimed. Working set is a few kilobytes: three pmfs of <= 25
      rationals, 96 candidate ideals of the same size, and their enclosures.
    best_known: >-
      No incumbent exists in this repository for the identity of FrodoKEM's ideal distribution;
      the eight lane proposals presuppose it. Externally, eprint 2025/1562 (fetched) verifies
      correctness bounds and not the divergence, and the search for divergence-specific
      recomputation returned only the specification family itself. There is no attack frontier row
      because no attack is proposed.
    hidden_overhead: >-
      Nothing is hidden in an o(1) because there is no asymptotic claim. What the cost estimate
      DOES hide is that the enclosure width, not the arithmetic, is the binding constraint: if the
      published figures carry only three significant digits, the oracle's resolving power is set by
      the DOCUMENT and not by the computation, and no amount of precision fixes that. The record
      makes this a reporting precondition rather than a discovered disappointment.
    tradeoff_note: >-
      Not applicable in the time-memory sense. The relevant tradeoff is precision versus grid
      width: widening the grid along a sixth axis multiplies the false-match rate, so grid width
      must be declared before the run and any widening recorded as an amendment.
  dominated_by: >-
    n/a (no attack result claimed). Checked against the frontier this repository holds: there is no
    time/memory/data row for any FrodoKEM attack in ledger/evidence, and the implementation-attack
    corpus entries are excluded by RQ-FRODO-3260cc.constraints[5]. On the measurement axis, nothing
    in the repository computes a FrodoKEM divergence at all, so there is nothing that dominates
    this. Recording bare 'null' would assert a check against a frontier row that does not exist and
    is forbidden by AGENTS.md rule 5.
  sota_delta: >-
    No attack; conceptual and measurement contribution only. Quantitatively: the repository holds
    zero computed divergence values, zero enclosures and zero statements about the ideal
    distribution's convention; this record would produce 288 enclosures (of which 48 are the
    derived +infinity entries and carry no oracle information), a surviving set drawn from 80
    candidate cells, and one structural correction to the goal's method section (part E). Against
    the literature reached this session there is no work enumerating FrodoKEM's divergence
    conventions; that is a negative search result, not an assertion about the literature.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the 2^16 enumeration reproduces the hand-derived numerators including the
    9288: ~0.9 - the six-term CDF-difference match and the exact sum to 2^16 are strong, and the
    residual risk is extraction damage in the fetched table. (ii) That all 16 untruncated Psi||chi
    cells return +infinity AND all 32 truncated Psi||chi cells return finite values, i.e. neither
    a hidden truncation nor a support mismatch: ~0.7, and I would not be surprised to see either
    half fail on the first implementation, which is exactly why both are controls. Note that the
    2026-08-24 repair LOWERED my confidence in this record's arithmetic discipline generally: the
    original single-arm version of this control was itself mis-derived, and the executor's
    mechanical recount of the axis products is now a gate rather than a formality.
    (iii) That the enclosure width comes in below the printed precision: ~0.85. (iv) That EXACTLY
    ONE of the 80 candidate cells survives all three parameter sets: ~0.35 - this is the part I
    would bet against, and I expect a surviving SET of two or three, most likely untruncated
    versus truncated-unnormalised being indistinguishable at three significant digits in the
    chi||Psi half. (v) That the run produces either a determination or a precisely characterised
    surviving set: ~0.9. (vi) That part (E)'s correction stands, i.e.
    no candidate ideal admits an exact rational divergence: ~0.95, since every candidate involves
    exp or Phi.
