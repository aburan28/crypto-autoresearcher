  proof_search_map:
    bottleneck: >-
      Whether any axis other than the oracle budget binds an ECC2K-130
      cap-locus index calculus. (A)-(D) say no by arithmetic under 2e2a58's
      model; (E) says the toy instrument cannot be the source of the bytes
      law and builds the one that can.
    baseline_embedding:
      parameter_slice: >-
        2e2a58's own reproductions (KN-LIT-096's triple and the 1.5 TiB / 1
        GiB figures) must reproduce here first; at B' = N^{1/(m+1)} with
        m = 2 the ratio must exceed 2^20 (2e2a58's regime), and at the
        cap-locus B of m >= 4 it must fall below 2^0, exhibiting the
        crossover in B' where E2 stops holding.
      reproduction_check: >-
        Symbolic, zero compute: 2^35.63 x 32 B = 2^40.63 B (1.55 TiB); the
        ratio 2^27.58 / 2^35.64 = 2^-8.06; the width floor 2^22.6 L_mv.
        Frozen fixture: the new Wiedemann engine must solve a planted
        system at B = 2^10 with certificate and report peak words within
        [2, 4] x n0 x B before any real matrix is read.
    observation_collision:
      observable: >-
        The pair (IC peak bytes, rho floor bytes) per row and the binding
        axis label.
      distinct_preimage_search: >-
        A low IC/rho ratio has two preimages: (i) IC really needs little
        memory at these B, or (ii) rho's floor is inflated by an
        unrealistic P. Separated by sweeping P down to 2^20 (one GPU's
        walks), where rho's floor is 1.7 GB and IC's n0 = 64 working set at
        m = 5 is 435 GB, ratio 2^+8: the binding axis flips with P, which is
        the honest statement, and the record reports the P at which it
        flips (about 2^28 at m = 5, n0 = 64; about 2^25 at n0 = 8).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          2e2a58's region model specialised to the ECC2K-130 cap-locus rows
          (m in {4, 5, 6, 8}) with both B readings (B and B/131), both LA
          engines (scalar and block Wiedemann at swept n0), and P swept.
        predicted_gain: A committed bytes column and a binding-axis label per row; zero compute.
      - transform: observable_fiber
        proposed_object: >-
          Hold the bytes law fixed and vary the instrument: incremental
          elimination (predicted quadratic fill-in), scalar Wiedemann
          (linear), block Wiedemann (linear times n0), on real matrices and
          the shape-matched null.
        predicted_gain: Identifies which instrument's law may be extrapolated and measures its constant.
    quantifier_order: >-
      FOR ALL m in {4, 5, 6, 8} and FOR ALL P in [2^28, 2^35], the IC block
      Wiedemann working set at n0 <= 64 is below rho's Theta(P)/(2 epsilon)
      floor at epsilon = 0.01, so 2e2a58's (E2) fails on those rows; FOR
      P = 2^20 it holds. (E) FOR the tested toy matrices, the incremental
      elimination's pivot density exceeds 10 percent at B = 2^12. NOT
      CLAIMED: anything about L_mv on real hardware, or about any LA engine
      other than the two built.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ECC2K-130's cap-locus rows the IC bytes are [column] against
        rho's [column] at P in [range], E2 fails for P >= [value] and holds
        below it; the width floor is [value] hours at L_mv = 1 ms; the toy
        elimination densifies to [value] at B = 2^12 and Wiedemann's c_M is
        [value] words per unknown at each n0." It can NEVER certify a
        hardware L_mv, nor bytes for engines not built.
      nearby_object_control: >-
        A prime-field ICPERF-style row at m = 2 with B' = N^{1/3} at a
        toy N, where E2's ratio DOES exceed 2^20 in 2e2a58's regime: the
        same arithmetic must reproduce 2e2a58's verdict there, so the
        failure on ECC2K-130 is a property of the rows, not of the
        arithmetic.
    proof_obligations:
      - claim: The bytes column at m in {4, 5, 6, 8} for both B readings and both engines, recomputed in Python with the record-size sweep.
        responsibility: memory
      - claim: The E2 ratio per row and the P at which the binding axis flips, recomputed.
        responsibility: correctness
      - claim: The width floor per row at L_mv in {10^-4, 10^-3, 10^-2} s and the P* where rho's wall clock meets it.
        responsibility: runtime
      - claim: A scalar and block Wiedemann over F_r solving planted systems with certificates and reporting peak words.
        responsibility: feasibility
      - claim: Fill-in density of linalg.py at B in 2^6..2^12 on real and null matrices.
        responsibility: correctness
      - claim: Nothing here measures L_mv or claims any engine beyond the two built.
        responsibility: scope

