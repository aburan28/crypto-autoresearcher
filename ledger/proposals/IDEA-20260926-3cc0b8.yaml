idea:
  id: IDEA-20260926-3cc0b8
  question_id: RQ-ICPERF-94c86e
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE BYTES COLUMN AT THE ECC2K-130 CAP LOCUS: block Wiedemann at n0 = 64
    needs about 435 GB at m = 5 and 1.2 TB at the m = 4 sub-cap optimum
    against rho's Theta(P)/epsilon floor of 1.7 TB at P = 2^30 walks, so
    IDEA-20260922-2e2a58's preregistered E2 (memory ratio above 2^20 on every
    competitive row) fails by 20 bits on every arity row of ECC2K-130 and
    neither memory nor width binds there; the toy instrument's incremental
    elimination densifies and is not the law to extrapolate

  class: control

  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (the relation matrix and
    log vector over F_r); the attack stage whose charged cost is at issue is
    LINEAR ALGEBRA, in bytes and in wall-clock floor, on the arity rows
    the product law leaves live.

    (A) THE BYTES, ROW BY ROW, MY ARITHMETIC. Word = one F_r element, 129
    bits, stored as 17 bytes; a relation row = m indices of log2 B bits, m
    sign bits, one 129-bit right-hand side; distinguished-point record = 32
    bytes (IDEA-20260922-2e2a58's convention). Under IDEA-20260926-4b65e3's
    corrected table (plain subspace base): m = 5 at the cap, B = 2^27.58:
    log vector 2^31.7 B (3.4 GB), relation storage at 35 B/row 2^32.7 B
    (7 GB), scalar Wiedemann working set (matrix plus three vectors) about
    2^34 B (17 GB), block Wiedemann with n0 = 64 (128 block vectors)
    2^38.7 B (435 GB), with n0 = 8 2^35.7 B (54 GB). m = 4 at the sub-cap
    optimum B = 2^29.04: vector 2^33.1 B (9.4 GB), relations at 32 B/row
    2^34 B (17 GB), block Wiedemann n0 = 64 2^40.1 B (1.2 TB), n0 = 8 2^37.1
    B (150 GB). m = 6 at the cap, B = 2^23.42: vector 190 MB, n0 = 64 block
    working set 24 GB. m = 8, B = 2^18.29: 5.5 MB vector, 0.7 GB at n0 = 64.
    With the orbit-quotient dimension B/131 (IDEA-20260926-201e86) every
    figure divides by 131.

    (B) RHO'S SIDE ON THE SAME UNITS. 2e2a58 derives rho's storage floor as
    Theta(P) records: D = P/(2 epsilon) at relative overhead epsilon. At P =
    2^30 concurrent walks (about 1000 GPUs at 2^20 walks each; Bailey et al.
    quote 1263 GPUs for one year, KN-LIT-661e97 / KR-RHO-18cc42; walks per
    GPU is my assumption, disclosed) and epsilon = 0.01, D = 2^35.64 records
    = 2^40.64 B (1.7 TB), coincidentally the published granularity's 2^35.63
    DPs (1.5 TiB at 32 B). At P = 2^20, 1.7 GB.

    (C) THE PREREGISTRATION THIS FALSIFIES. 2e2a58 (E2) preregisters that
    the memory axis binds at EVERY row where the index-calculus operation
    count is within 2^10 of matched rho, with the ratio (IC peak words) /
    (rho floor P/(2 epsilon) at epsilon = 0.01, P = 10^9) above 2^20, and
    names a ratio below 2^4 on such a row as its falsification. On
    ECC2K-130 every cap-locus row with an oracle at budget is within 2^10 of
    rho BY CONSTRUCTION of the budget. In 2e2a58's own unit the ratio is
    2^27.58 / 2^35.64 = 2^-8.1 at m = 5 and 2^29.04 / 2^35.64 = 2^-6.6 at
    m = 4; in bytes with the n0 = 64 block working set it is 2^38.7 /
    2^40.64 = 2^-1.9 (m = 5), 2^-0.5 (m = 4), 2^-6.1 (m = 6). E2 therefore
    FAILS by 20 to 36 bits on every arity row of ECC2K-130 that the product
    law leaves live, under 2e2a58's own model and units. The reason is
    plain: 2e2a58 wrote B' = N^{1/(m+1)} with small m in mind; at the
    arities that matter on ECC2K-130 (m >= 4) the index-calculus dimension
    is 2^18 to 2^29, and rho's Theta(P) floor at realistic P is 2^30 to
    2^36 records. This does not touch 2e2a58's limb (B) (rho's floor is
    Theta(P)), which is what makes the comparison possible; it corrects the
    preregistered verdict on this population.

    (D) THE WIDTH AXIS DOES NOT BIND EITHER. 2e2a58's floor (2B'/n0) L_mv at
    m = 5, n0 = 64 is 2^22.6 L_mv: 1.7 hours at L_mv = 1 ms, 17 hours at 10
    ms; at m = 4, 2^24.1 L_mv, 4.9 hours at 1 ms. Rho at P walks and Bailey
    et al.'s 5.4 x 10^7 iterations per second per GPU (2^5.7 steps per
    second per walk at 2^20 walks per GPU) needs 2^55.1 / P seconds, which
    meets the 1.7-hour floor only at P = 2^42.5 walks, three orders beyond
    any realisable width. So (E1) holds here as 2e2a58 predicts, (E2)
    fails, and the crossover on ECC2K-130 collapses onto the oracle budget:
    neither memory nor width is an obstacle to a cap-locus index calculus
    on this curve; the only obstacle is C.

    (E) THE TOY INSTRUMENT IS THE WRONG LAW TO EXTRAPOLATE, PREDICTED IN
    ADVANCE. src/crypto_autoresearcher/index_calculus/linalg.py is an
    incremental Gaussian elimination that reduces each arriving row against
    all previous pivots; on a random sparse matrix that fills in, and its
    peak bytes grow like B^2 entries, not B. PREDICTION: at B = 2^12 the mean
    pivot-row density exceeds 10 percent on real relation matrices and on the
    shape-matched null alike, so the bytes law measured with that instrument
    is quadratic and must not be used for any deployed row; Wiedemann's O(B)
    law (KN-TECH-008, KN-LIT-017) is the one to extrapolate, and its constant
    c_M (words per unknown at blocking n0) is measured here on a new
    pure-Python engine. A real-matrix fill-in materially BELOW the null's
    would be a structure finding (same reading as IDEA-20260926-201e86 (D))
    and is reported, not expected.

  mechanism: >-
    OBJECT FRAME. Representation: the linear-algebra phase represented by
    its RESOURCE TRIPLE (peak bytes, critical-path latencies, useful
    width), IDEA-20260922-2e2a58's Class III object, evaluated at the
    ECC2K-130 cap-locus rows rather than at N^{1/(m+1)}. Operation set
    Sigma: {re-block by n0; re-granulate rho's DP predicate by theta; scale
    P}. Sigma is not the translation action; it acts on schedules.

    TRICHOTOMY. Class III, coordinate-dependent, exactly as 2e2a58 places
    the same object; no group-element projection is proposed.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The triple discards every
    arithmetic detail and is lossy; re-blocking maps (bytes, latencies) to
    (bytes x n0/n0', latencies x n0'/n0) with the product invariant,
    re-granulating maps rho's storage to P/(2 epsilon) records, and scaling
    P maps both sides by the stated rules without consulting anything
    discarded. A block system of <Sigma> on schedules, as in 2e2a58.

    THE PRICED OPEN NUMBER. c_M, words per unknown for Wiedemann at n0 in
    {1, 8, 32, 64} on real toy relation matrices, and the fill-in law of the
    incremental elimination; L_mv is 2e2a58's and is swept, not measured.

    OFF-LIMITS COMPONENTS USED, NAMED. F1 (rho) and F2 (decomposition) are
    the two sides compared; F7 is not used (no advice on either side; the
    preprocessing reading is IDEA-20260926-20ba8f's). What is added beyond
    2e2a58: the bytes at the specific rows the product law leaves live,
    the falsification of its (E2) on this population by arithmetic under
    its own model, the width check (D), and the instrument warning (E).

    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1; attack stage LINEAR ALGEBRA
    (bytes and wall clock).

