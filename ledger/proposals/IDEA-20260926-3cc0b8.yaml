  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate): reproduce 2e2a58's published
      reproductions; compute the bytes column, the E2 ratios, p_flip and the
      width floors with the record-size and P sweeps; commit. STAGE 1
      (engine): write a scalar Wiedemann (Berlekamp-Massey over F_r) and a
      block variant with n0 in {8, 32, 64} in pure Python; validate on
      planted systems at B = 2^10 with certificates; report peak words.
      STAGE 2 (the measurement): collect real relation matrices from the
      prime-field engine (m in {2, 3}) and the binary n = 19 cell (m = 2,
      oracle A) at B in {2^6, 2^8, 2^10, 2^12}; for each build the
      shape-matched random sparse null; run linalg.py's elimination
      recording pivot-row density and peak entries, and the Wiedemann
      engines recording peak words and chain length; 10 matrices per cell.
      STAGE 3 (zero compute): write the bytes column into the boundary
      table with the measured c_M, the instrument warning, and the E2
      verdict per row. No attack is run.
    cell:
      curve: >-
        PRIME-FIELD: the engine's toy curves at p in [2^18, 2^24]. BINARY:
        the n = 19 CERTBIN cell (t^19 + t^5 + t^2 + t + 1, A = 46693, B =
        306147, h = 2) and its Koblitz sibling (#E = 4 * 130873, recompute;
        orbit-union base for the B/131 reading at toy n). GENERIC CONTROL:
        relabelled Z/NZ with a random base (the bytes laws are
        group-generic and must reproduce). DEPLOYED ROWS: ECC2K-130 at m in
        {4, 5, 6, 8}, arithmetic only.
      m: 2 and 3 (toy); 4, 5, 6, 8 (deployed, arithmetic).
      l: B in {2^6, 2^8, 2^10, 2^12} (toy); B_cap or the m = 4 sub-cap optimum (deployed).
      factor_base: the engine's base (prime field); V = {deg < l} (binary); random subset (Z/NZ).
      targets: enough to reach rank B - 1; 10 matrices per cell; seeds enumerated 0..9.
      seeds: enumerated, recorded.
    instrument:
      - src/crypto_autoresearcher/index_calculus/linalg.py (the incremental elimination whose fill-in is measured)
      - src/crypto_autoresearcher/index_calculus/ (relation source, prime field)
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py, gf2n.py, oracles_rc1.py (binary relation source)
      - 'NEW: scalar Wiedemann with Berlekamp-Massey over F_r and a block variant at n0 in {8, 32, 64}, with peak-word accounting and certificates (about 350 lines pure Python); shape-matched random sparse null (about 40 lines)'
      - 'missing: block Lanczos and structured Gaussian elimination engines (2e2a58''s three-engine control) are not built here; the SGE bytes law is left to IDEA-20260814-a67a1d''s peeling line and is reported as not measured'
    procedure:
      - 1. Stage 0 reproductions and the deployed column with sweeps; commit.
      - 2. Stage 1 engine validation on planted systems (blocking).
      - 3. Stage 2 on each cell, real and null, both instruments; certificates on every solve.
      - 4. Fit the fill-in law of linalg.py and c_M for Wiedemann per n0.
      - 5. Stage 3 column and the three-row outcome.
    metrics:
      - name: peak_bytes_per_row
        unit: log2 bytes
        definition: the deployed bytes at each (m, engine, n0, B reading, record size)
      - name: e2_ratio
        unit: log2 dimensionless
        definition: IC peak words over rho floor records at (P, epsilon), and the bytes variant
      - name: pivot_density
        unit: fraction
        definition: mean nonzeros per pivot row over B, at each toy B, real and null
      - name: c_M
        unit: words per unknown
        definition: peak live words of the Wiedemann engine divided by B, per n0
      - name: chain_length
        unit: matrix-vector products
        definition: sequential products to a solution, per engine, real and null (2e2a58's quantity, reported for its use)
    controls:
      - 'PUBLISHED-ATTACK REPRODUCTION (blocking): 2e2a58''s KN-LIT-096 triple and the 1.5 TiB figure.'
      - PLANTED-SYSTEM ENGINE VALIDATION with certificates (blocking).
      - SHAPE-MATCHED RANDOM SPARSE NULL at every toy cell (blocking for the fill-in reading).
      - RELABELLED Z/NZ (bytes laws are group-generic; must reproduce).
      - NEARBY OBJECT (m = 2, B' = N^{1/3} toy row) where E2's ratio must exceed 2^20 in 2e2a58's regime.
      - RECORD-SIZE and P SWEEPS on every deployed figure.
    outcomes:
      positive: >-
        (the record's expectation) E2 fails by more than 20 bits on every
        ECC2K-130 arity row at P >= 2^28 and holds at P = 2^20; the width
        floor is hours; linalg.py densifies on real and null alike;
        Wiedemann's c_M reads within its band: the boundary table gains a
        bytes column with the verdict "neither memory nor width binds on
        ECC2K-130 at m >= 4; only the oracle does", and 2e2a58's revision
        must restrict E2 to small-m rows.
      negative: >-
        the recomputed ratios exceed 2^4 on some competitive row (an
        arithmetic error here or a record-size choice that flips it), or
        c_M is far outside [2, 4] n0 (the Wiedemann accounting is wrong):
        E2 stands on that row and the column carries the corrected figures.
      artifact: >-
        the reproductions fail, or the engine fails its planted gate, or
        the null densifies differently from the real matrix in a way the
        instrument cannot explain: defect; nothing read.
    falsification_threshold: >-
      Stated before any run: the record's expectation holds iff every
      cap-locus row's e2_ratio at P = 2^30 is below 2^0 in bytes and below
      2^-6 in 2e2a58's units under every record size in the sweep, and
      pivot_density at B = 2^12 exceeds 0.10 on both real and null.
    estimated_cost:
      implementation: medium
      compute: >-
        ESTIMATE, order of magnitude: Wiedemann at B = 2^12 is 2^13 sparse
        products of 2^12 x m entries, under 2^28 field operations per
        matrix; 40 matrices per instrument; the elimination at B = 2^12 with
        fill-in is up to 2^24 entries; minutes to an hour per cell.
    required_metrics:
      - peak_bytes_per_row with sweeps, e2_ratio, p_flip, width floors (Stage 0)
      - pivot_density and c_M per cell, real and null; chain_length
      - certificate pass rate; termination_reason

  falsification_conditions:
    - 'A recomputed byte figure differs from (A) by more than 1 bit under the same record size: arithmetic error, corrected before use.'
    - 'The E2 ratio on a cap-locus row at P = 2^30 exceeds 2^4 under any record size in the sweep: (C) is wrong on that row and 2e2a58''s preregistration stands there.'
    - 'linalg.py''s pivot density at B = 2^12 stays below 0.05 on the null: the instrument does not densify as predicted and (E) is withdrawn.'
    - 'The Wiedemann engine''s c_M is outside [2, 4] n0 plus m on the planted gate: engine defect; nothing read.'
    - 'The nearby-object row (m = 2, B'' = N^{1/3}) does not reproduce E2''s regime: the arithmetic, not the population, is at fault.'

  confounders:
    - >-
      P IS AN ASSUMPTION. The binding axis flips at p_flip about 2^28; a
      deployment with fewer concurrent walks makes rho's floor smaller than
      IC's working set. Every ratio names its P and p_flip is the honest
      deliverable, not a single verdict.
    - >-
      RECORD SIZES. 17 versus 32 bytes per word and 16 versus 64 per DP move
      figures by up to 2 bits; swept.
    - >-
      ENGINE CHOICE. Only Wiedemann variants are built; Lanczos and SGE
      could have different constants; named as not measured.
    - >-
      MEMORY IS NOT ONE NUMBER. Distributed block Wiedemann spreads the
      working set across nodes; the column reports total bytes, not
      per-node bytes, and says so.
    - >-
      TOY-TO-DEPLOYED. c_M is measured at B <= 2^12 and extrapolated 16 to
      21 doublings under Wiedemann's linear law; the extrapolation distance
      is printed beside every deployed figure.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT. A bytes column, a binding-axis label per row,
      a falsification of a filed preregistration on this population, and
      an instrument warning.
    - >-
      KN-OPEN-020 CLASS: subspace base, scoped class, inherited; the
      orbit-union variant is implicit-membership (KN-FIND-47da4e).
    - >-
      2e2a58's limb (B) and (E1) are not contested; only (E2)'s verdict on
      the ECC2K-130 arity rows is.
    - >-
      Nothing here says an index calculus at the cap locus is feasible;
      it says the obstacle is the oracle and not the machine.
    - >-
      FORWARD GUIDANCE: (i) 2e2a58's revision should state E2 with B' as a
      function of m and name p_flip; (ii) the Wiedemann engine built here
      is the instrument IDEA-20260926-201e86 (D) and 2e2a58 Stage 2 both
      need, and should be built once; (iii) the SGE bytes law belongs with
      the peeling records (a67a1d, d20846).

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE FOR (A)-(D). Arithmetic under 2e2a58's model with declared
        record sizes and P; recorded so the absence is explicit.
      rigorous_support: 2e2a58's derivation of the Theta(P) floor (reviewed sound) and Wiedemann's O(n) memory (KN-TECH-008).
      validation_plan: Stage 0 reproductions; seconds.
    - id: H2
      statement: >-
        FILL-IN. Incremental elimination in pivot-creation order on a
        random sparse matrix with m nonzeros per row over a large field
        fills in to a constant fraction of the dimension well before rank
        B - 1, on real relation matrices as on the null.
      rigorous_support: >-
        Classical: Gaussian elimination without fill-reducing ordering on
        a random sparse matrix produces dense pivot rows (the reason SGE and
        Wiedemann exist, KN-TECH-008); no bound is claimed for the specific
        order linalg.py uses, which is why it is measured.
      validation_plan: >-
        SAMPLE: 10 matrices per cell at B in 2^6..2^12, real and null.
        COMPARISON: pivot density against B; a fit of peak entries against
        B^2. TAIL: the densest pivot row. TRANSFER: none; the point is that
        this law is NOT transferred.

  heuristic_note: >-
    (A)-(D) are unconditional arithmetic under 2e2a58's model; (E) rests
    on H2 and is measured. The a-priori expectation, stated in advance: E2
    fails on every ECC2K-130 arity row for P above about 2^28, the toy
    elimination densifies, and Wiedemann's constant reads in its band.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES; no time claim beyond the width floor (2B/n0) L_mv,
      hours at ECC2K-130's cap-locus B.
    memory_exponent: >-
      Index calculus at the cap: B_cap = N^{1/m} words up to m!^{1/m}, i.e.
      2^38.7 bytes at m = 5 with n0 = 64 block Wiedemann (2^34 scalar); rho:
      Theta(P) records, 2^40.6 bytes at P = 2^30, epsilon = 0.01. The
      memory-exponent statement of 2e2a58 (1/(m+1) versus 0) is correct and
      irrelevant on this population because the constants dominate.
    best_known: >-
      Matched rho 2^60.81 iterations with storage on the D = P/(2 epsilon)
      curve (2e2a58; KN-LIT-012 as relayed); the published ECC2K-130
      configuration at 2^35.63 DPs.
    hidden_overhead: >-
      The n0 factor in block Wiedemann's working set is stated, not hidden;
      distributed per-node memory is not computed.
    tradeoff_note: >-
      rho trades memory against P; IC's memory is fixed by B and n0; on
      ECC2K-130 at m >= 4 the two are within a few bits of each other at
      realistic P, so memory is not a discriminating axis there, which is
      the record's point.

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Stage 0 is arithmetic; the Wiedemann engine is the cost (about 350
      lines); the runs are minutes to an hour per cell.

  asymptotic_claim:
    problem: Resource accounting (bytes, width) of cap-locus index calculus on ECC2K-130 against matched rho
    prior_best: IDEA-20260922-2e2a58's region model with its preregistered E1 and E2
    time_exponent: unchanged
    memory_exponent: unchanged in exponent; the constants at m >= 4 put IC below rho's Theta(P) floor for P above about 2^28
    hidden_cofactor: n0, record sizes, P
    claim_kind: cost_model_column_plus_preregistration_check_plus_instrument

  dominated_by: >-
    n/a (no attack claimed), checked row by row: matched rho (2^60.81)
    dominates every IC cell on time at every P as 4b65e3 states; on memory
    the two sides are within a few bits at realistic P and rho wins below
    p_flip; BSGS dominated by rho; multi-target and preprocessing rows are
    IDEA-20260926-20ba8f's. The record occupies no point on any axis.

