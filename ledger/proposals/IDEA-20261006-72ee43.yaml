# IDEA-20261006-72ee43
# Velu 2-isogeny point-count gap. Proposal only. Not a hypothesis.
idea:
  id: IDEA-20261006-72ee43
  question_id: RQ-ICINV-475b5e
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Velu image over F_103 keeps point count 120, and a bumped coefficient has 119
  class: measurement
  claim: >-
    Over F_103, E is y^2 = x^3 + x + 2. The cubic has one root, x0=102,
    so T=(102, 0) is the unique affine rational 2-torsion point. The
    Velu codomain used here is E2: y^2 = x^3 + 84x + 30, with
    t = 3*x0^2 + A = 4 and w = x0*t = 99, then A2 = A - 5t and
    B2 = B - 7w. This session counted #E = 120 and #E2 = 120 by a
    Legendre sum and by enumeration, so the absolute gap is 0. All
    118 affine points other than T mapped onto E2. The bumped curve
    y^2 = x^3 + 85x + 30 has 119 points, so the absolute gap from
    #E is 1. A recount in which the image count is not 120, or the
    bumped count is not 119, with both counters agreeing, is a
    negative. The group-order functional is constant on this one
    isogeny and not constant under the coefficient bump.
  mechanism: >-
    The tracked object is the rational-point count, which Tate's
    theorem says is an isogeny invariant. The representation is the
    short-Weierstrass coefficient pair. The map on a non-kernel point
    (x, y) is X = x + t/(x-x0) and Y = y*(1 - t/(x-x0)^2). The kernel
    point is sent to infinity. The bumped curve changes A2 by 1 and
    is the nearby object that is not the image. KR-RHO-755e35 states
    the invariance in general. This idea reports one gap of 0 and one
    gap of 1 at p=103. It is not a factor-base hit count. No discrete
    logarithm is solved.
  assumptions:
    - The discriminant 4A^3+27B^2 is nonzero on E, on E2, and on the bumped curve. This session recorded 9, 57, and 45.
    - #E is not p+1. Both counts 120 are different from 104, so the curves are ordinary.
    - The formula for (A2, B2) is the one written in the claim, checked by mapping every non-kernel affine point.
  predictions:
    - metric: image_point_gap
      direction: lower
      minimum_effect: >-
        The absolute gap |#E - #E2| equals 0, with both counts equal
        to 120.
    - metric: bumped_point_gap
      direction: higher
      minimum_effect: >-
        The absolute gap |#E - #E_bumped| equals 1, with the bumped
        count equal to 119.
  minimal_test:
    design: >-
      Recount E, E2, and the bumped curve by enumeration and by the
      Legendre sum. Map every affine point of E other than T and
      record how many images fail the E2 equation. The group order
      120 factors as 8*3*5, so the largest prime-order subgroup has
      order 5. This session found P5 = (0, 38) with 5*P5 equal to
      infinity. Run distinguished-point rho and BSGS on the four
      scalars 1..4 for that subgroup, and record the operation
      counts. Those counts are not the primary metric.
    controls:
      - The bumped curve y^2 = x^3 + 85x + 30, whose count is 119. If that count is also 120, the bump is not separated from the image.
      - A second enumeration of E. The gap between the two enumerations must be 0.
      - The image check on all 118 non-kernel affine points. A point that misses E2 means the coefficient formula, not the count gap, failed.
    required_metrics:
      - the three point counts from each counter
      - the image gap and the bumped gap
      - the number of image failures
      - rho step counts and BSGS operation counts on the four scalars in the order-5 subgroup generated by (0, 38)
  falsification_conditions:
    - Both counters agree and #E2 is not 120.
    - Both counters agree and the bumped count is 120, so the coefficient bump is not separated from the image.
    - An affine point other than T maps off E2.
  confounders:
    - A supersingular source would still have an isogeny, but this pin was required to be ordinary. y^2 = x^3 + 1 over F_101 has 102 points and was rejected for that reason.
    - Two curves can share a point count without the Velu map. The image check is what ties the count to this kernel.
    - A factor-base hit gap is a different functional and is not scored here.
  interpretation_limits:
    - One ordinary 2-isogeny at p=103 does not prove Tate's theorem and does not survey an isogeny class.
    - A gap of 0 in the group order is the invariant the question asks about. It is not a cheaper discrete logarithm.
    - The exponent 1/2 is unchanged.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The Velu 2-isogeny with kernel {infinity, T} preserves the
        F_103-point count, and adding 1 to the image A-coefficient
        does not.
      rigorous_support: >-
        KR-RHO-755e35, opened this session, states that over a finite
        field curves are isogenous if and only if they have the same
        number of points. The numerical check is the pair of counts
        120 and 120 against the bumped count 119.
      validation_plan: >-
        Recount all three curves with two counters and map all 118
        non-kernel points. The pre-registered gaps are 0 and 1. Do
        not replace 119 after seeing a recount.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. A 2-isogeny evaluation is O(1) field
      operations and is not a discrete-logarithm algorithm.
    memory_exponent: >-
      Unchanged. The map stores O(1) field elements. BSGS memory of
      order sqrt(N) is the matched control and is not improved.
    best_known: >-
      Generic rho at exponent 1/2 (KR-RHO-13bf67). Isogenous curves
      share their point count (KR-RHO-755e35). This measurement does
      not beat rho and does not find a weaker curve in the class.
    hidden_overhead: >-
      None. The gaps 0 and 1 are explicit. No o(1) saving is claimed.
    tradeoff_note: >-
      There is no time-memory tradeoff in the count. Rho and BSGS on
      ten logs only price the matched controls.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
