  dominated_by: >-
    Generic rho at exponent 1/2 dominates any reading of this isogeny
    as an attack. Preserving the point count does not reduce group
    operations, memory, or queries below that baseline.
  sota_delta: >-
    The separator is the absolute gap 0 on the image against the
    absolute gap 1 on the bumped curve. The gap to a sub-square-root
    discrete logarithm is the full exponent 1/2, and this idea moves
    that exponent by 0.
  proof_search_map:
    bottleneck: >-
      Whether the image count equals 120 and the bumped count equals
      119.
    baseline_embedding:
      parameter_slice: p=103, kernel x0=102, image coefficients 84 and 30
      reproduction_check: >-
        Two counters agree, and all 118 non-kernel images land on E2.
    observation_collision:
      observable: the pair of absolute gaps 0 and 1
      distinct_preimage_search: >-
        Recounting E twice must give gap 0. A nonzero gap there is a
        counter failure.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the counts 120, 120, and 119
        predicted_gain: gaps 0 and 1, or an explicit other triple
    quantifier_order: >-
      This one kernel at p=103, not every 2-isogeny.
    method_ceiling:
