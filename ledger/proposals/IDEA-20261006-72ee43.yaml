        The two gaps at this pin. No exponent change.
      nearby_object_control: >-
        The A-coefficient bumped by 1. A supersingular source at
        p=101 was computed and excluded.
    proof_obligations:
      - claim: The image gap is 0.
        responsibility: correctness
      - claim: The bumped gap is 1.
        responsibility: baseline
      - claim: No exponent change is inferred.
        responsibility: scope
    not_applicable_reason: null
