idea:
  id: IDEA-20260901-2d3f07
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    THE SELF-PAIRING HALF OF THE LANE IS CIRCULAR, BY A DIMENSION COUNT - on a
    cyclic group G of prime order N every bilinear map G x G -> H is a scalar
    multiple of ONE map, (xP, yP) -> [xy]h, so there is no such thing as a
    family of self-pairings to search; an efficiently computable non-degenerate
    self-pairing into a group with easy discrete logarithms IS an ECDLP solver,
    and one into G itself IS a CDH oracle (Cheon-Lee 2009), which Maurer-Wolf
    lifts to a discrete-logarithm solver given a smooth-order auxiliary curve
    over F_N. The residual cells left open by H-PAIR-713241 - self-pairings
    outside the Weil/Tate/CHM families, non-divisorial bilinear maps, pairings
    into groups other than mu_N - are therefore not open cells but restatements
    of the goal, and the ONLY non-circular R7 object is a computable
    homomorphism from G into a DIFFERENT group, which is IDEA-20260807-df5984's
    taxonomy. Nearby object where the dimension count fails and the families
    genuinely separate is exhibited (full rational N-torsion), so the closure
    has an edge that can be seen.
  class: mechanism

  claim: >-
    Let E/F_p be an ordinary curve, P a point of PRIME order N, G = <P>, and H
    any abelian group written additively. Five statements, decreasing in
    certainty, each separately falsifiable.

    (C1) DIMENSION COUNT, elementary. A map b from G x G to H is bilinear if
    and only if b([x]P, [y]P) = [xy] h for the single element h = b(P, P),
    which lies in H[N]. Hence Bil(G x G, H) is isomorphic to H[N] as a group,
    and when H[N] is cyclic (H = mu_N inside any field, H = G, H = any
    prime-order-N group) the space of self-pairings is ONE-DIMENSIONAL over
    Z/N: every self-pairing is a fixed power of every other. Proof: bilinearity
    in each argument plus G = Z/N.P; nothing about pairings of divisors,
    orientations, or fields is used. CONSEQUENCE FOR THE LANE: the phrase
    'self-pairings outside the Weil, Tate and CHM families' (H-PAIR-713241,
    interpretation_limits; IDEA-20260807-30868b (D)) names an empty
    distinction. On G x G the Weil pairing is the zero map, the Tate pairing
    is [c] h_T for a fixed h_T, and any other bilinear construction is
    [c'] h_T. The only free parameters are h, which is a single group element,
    and the ENCODING of H, which is a computability question and not a
    pairing-family question.

    (C2) NON-DEGENERATE COMPUTABLE SELF-PAIRING INTO AN EASY GROUP = ECDLP
    SOLVER, elementary. If b is computable from point representations and
    h != 0, then from the instance (P, Q = [x]P) one computes b(Q, P) = [x] h
    and solves one discrete logarithm in <h> inside H. If that DLP is easy the
    ECDLP is easy. Conversely if the ECDLP is easy every self-pairing is
    computable. So 'does a computable non-degenerate self-pairing into an
    easy-DLP group exist on CM curves' is LITERALLY the question 'is the ECDLP
    easy on CM curves' and cannot be a route to it.

    (C3) SELF-PAIRING INTO G ITSELF = CDH ORACLE, and CDH lifts to DLP. Take
    H = G, h = [c]P with c != 0. Then b([x]P, [y]P) = [cxy]P and
    [c^{-1}] b(Q, Q') solves computational Diffie-Hellman in G. This is the
    negative result of Cheon and Lee (citation 1, abstract read this session):
    a cryptographically useful self-bilinear map on a group of known order does
    not exist because it makes CDH easy. The Maurer-Wolf reduction (citation
    2, RECALLED) then converts a CDH oracle into a discrete-logarithm algorithm
    in polynomial time given an auxiliary group of smooth order over F_N -
    concretely an elliptic curve over F_N whose order is B-smooth - so a
    self-pairing into G is an ECDLP solver up to that auxiliary-curve
    condition, which is the record's single heuristic (H1 below).

    (C4) WHAT DOES NOT COLLAPSE, stated so the closure has forward guidance.
    The dimension count is about G x G. Pairings G x G' -> H with G' a
    DIFFERENT group (the second Frobenius eigenline E[nbar] over F_{p^k}, the
    twist-rational image of it, a point of E(F_{p^k}) outside G) are NOT
    covered, and those are exactly the classical transfer: they need a second
    argument that is not a function of P, and the whole cost question is the
    cost of writing that argument down, which is k (IDEA-20260807-5f24d7,
    IDEA-20260808-40aab9). Likewise 'pairings into groups other than mu_N' are
    not a fourth family but a question about which groups H of order N admit an
    efficiently computable non-trivial homomorphism from G - which is
    IDEA-20260807-df5984's one-point-escape taxonomy verbatim, and whose known
    inhabitants are mu_N in F_{p^k} (small k), F_p^+ (N = p) and subgroups of
    isogenous curves (equal difficulty by transport theorem T1 of
    DECOMPOSITION.md). The forward guidance of this record is that RQ-PAIR's
    second half should be retired INTO df5984 rather than left as an open
    branch beside it.

    (C5) THE NEARBY OBJECT WHERE (C1) FAILS, so the argument is seen to locate
    the load-bearing structure. If E[N] is fully F_p-rational (k = 1 and
    N^2 | #E(F_p); IDEA-20260901-fac74a constructs one), then Bil(E[N] x E[N],
    mu_N) has rank FOUR over Z/N, the Weil pairing (alternating, e(R, R) = 1
    for every R) and the Tate pairing (not alternating, t(R, R) != 1 for
    generic R) are NOT proportional, and 'which family' is a real question.
    Prime cyclic order of the domain is therefore the exact hypothesis that
    makes the family distinction vanish, and an argument that also collapsed
    the families on full rational torsion would prove too much.

  mechanism: >-
    THE TRACKED OBJECT is the single group element h = b(P, P) in H[N] that a
    self-pairing is, once the domain is cyclic of prime order. The projection
    'self-pairing -> h' discards the construction (Miller functions, divisors,
    orientation, elliptic-net recurrence, final exponentiation) and retains one
    element; it is exactly compatible with the only operation that acts on
    self-pairings, namely composition with scalar multiplication on the
    arguments, under which h propagates as h -> [xy] h. It is genuinely lossy
    and it is not a change of coordinates, because two different constructions
    with the same h are the same map and no construction is recoverable from h.

    WHY THE COLLAPSE IS A CLOSURE AND NOT A FATIGUE REPORT. The lane's prior
    closures (IDEA-20260807-464ff8, IDEA-20260807-30868b, H-PAIR-27e16a,
    H-PAIR-713241) argue family by family - Weil with an endomorphism,
    Tate by Galois equivariance, CHM by m | Delta_O - and each leaves the
    others' complement open. (C1) says the complement is empty by
    linear algebra, and (C2)/(C3) say that whatever inhabits the one remaining
    dimension is by definition an ECDLP solver or a CDH oracle. The obstruction
    is named (the rank of Bil(G x G, H) is 1), the argument is four lines, and
    the redirection is explicit (df5984's taxonomy of one-point homomorphisms
    into other groups). That is the docs/inventor-protocol.md section 4
    standard.

    STAGE 0 (zero compute, hard gate). Write (C1) and check it against the
    nearby object (C5): on a full-rational-torsion curve the rank must be 4 and
    Weil and Tate must fail to be proportional. An argument that cannot
    separate the two cases has not identified prime cyclic order as the
    load-bearing hypothesis.

    STAGE 1 (instrument, hours). Using the pairing instrument of
    IDEA-20260807-e7eb5d (or its elliptic-net alternative in EXP-NET-001),
    on toy curves with constructed k in {2, 3, 6} compute the reduced Tate
    pairing, the Weil pairing, and an ate-type pairing on G x G2 (G2 the
    p-eigenline of Frobenius on E[N]), and verify that every pair of values is
    related by ONE exponent c that does not depend on the point pair. This is
    the measurable form of (C1) on the classical domain G x G' and doubles as
    an instrument calibration; on G x G itself the prediction is that every
    family returns 1 at k > 1 (already H-PAIR-713241) and that at k = 1 the
    Tate value is a fixed power of itself - a vacuous check that is run anyway
    so the k = 1 instrument path is exercised.

    STAGE 2 (nearby object, hours). On the IDEA-20260901-fac74a exceptional
    curve (E[N] fully rational, N^2 | #E), compute Weil and Tate on random
    pairs and exhibit non-proportionality: t(R, R) != 1 while e(R, R) = 1, and
    the four-dimensionality by finding four bilinear forms with no linear
    relation over Z/N.

    STAGE 3 (constructive closure demonstration, hours). Implement a CDH
    ORACLE THAT CHEATS - it is given the discrete logs of its inputs by the
    harness, a disclosed soundness-losing cheat in the sense of
    docs/inventor-protocol.md section 6 step 3 - and run the Maurer-Wolf
    reduction against it at toy N (2^20 to 2^28): search random curves over
    F_N for one of B-smooth order, use the oracle to compute the implicit
    representation of x on that curve, and recover x by Pohlig-Hellman on the
    auxiliary curve. Verify [x]P = Q ON THE CURVE, independently of the
    solver, per docs/claims-and-verification.md. The point of Stage 3 is not
    to attack anything (the oracle cheats) but to make (C3) an executed
    reduction rather than a cited one, and to measure H1.

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE THIS SESSION (CRYPTO_KB_QDRANT_URL is
      ':memory:', index empty, verified by the orchestrator); search_knowledge
      was NOT called and its silence is not read as evidence. Screening by
      direct reading, 2026-09-01: the 13 RQ-PAIR-21313f proposals listed in
      the task context (full reads of IDEA-20260807-df5984, -e7eb5d, -5f24d7,
      IDEA-20260808-40aab9; claim sections of -30868b, -464ff8, -653dda,
      -6c7540, IDEA-20260811-8783a5), H-PAIR-27e16a, H-PAIR-713241,
      H-ENDO-001, KN-FIND-b7e091, KN-TECH-018, DECOMPOSITION.md,
      DEC-20260802-220, ideas/artifacts/ECDLP-IDEA-003/correspondence_spec.md
      gates R1-R3. Greps over ledger/, knowledge/, ideas/, analysis/, docs/
      for 'self-bilinear', 'Cheon', 'Maurer', 'Wolf reduction', 'CDH oracle':
      the Cheon hits are all the DLP-with-auxiliary-input algorithm
      (DEC-20260802-204/205/220), the Maurer hits are Maurer-Portmann-Zhu GGM
      records; NO record states the dimension count, the self-bilinear =
      CDH observation, or the Maurer-Wolf lift. Two web searches were run;
      the Cheon-Lee abstract page (koreascience.or.kr, Bull. Korean Math.
      Soc. 46(2), 2009, pp. 303-309) was OPENED and its abstract read.
    results: >-
      The abstract of Cheon and Lee states, in its own words as relayed by the
      fetch, that 'a cryptographic useful self-bilinear map does not exist'
      and that 'a fixed inversion of a bilinear map with homomorphic property
      is impossible', and relates CDH to bilinear Diffie-Hellman and general
      inversion assumptions. The theorem statements were NOT read - only the
      abstract - so the precise form 'self-bilinear map on a known-order group
      implies CDH is easy' is taken from the abstract plus a search-result
      summary and is stated here as the record's own four-line derivation
      (C3), which needs no citation. The Maurer-Wolf reduction is RECALLED and
      not opened. Internally, the corpus closes self-pairings family by
      family and leaves the complement open in three records; none applies
      the dimension count.
    verdict: >-
      UNVERIFIED. The core observation (C3) is Cheon-Lee's, whose primary
      abstract was opened this session, and (C1) and (C2) are elementary and
      are claimed as a reindexing of the lane's question, not as mathematics;
      but the Maurer-Wolf lift from CDH to DLP, which the record's headline
      leans on, rests on a RECALLED citation that no agent in this program has
      opened, and the Cheon-Lee theorem statements themselves were not read.
      Under templates/research-records.md a record whose argument leans on any
      recalled citation may not carry 'adaptation' or 'known', so the honest
      label for the record as a whole is UNVERIFIED. What is new to this
      corpus is the placement: the lane's three residual cells are shown to be
      one cell, and that cell is the goal itself. No claim of external novelty
      is made for any component. Promotion to 'adaptation' is available to a
      successor record once the Maurer-Wolf source and the Cheon-Lee theorem
      text are read and marked 'retrieved' by the reading agent.

