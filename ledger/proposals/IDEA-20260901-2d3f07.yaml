  assumptions:
    - >-
      N is prime and G = <P> is cyclic of order N. LOAD-BEARING: (C1) is false
      for non-cyclic domains, which is the content of (C5) and the nearby
      object control.
    - >-
      'Computable' means computable from the point representations without
      the discrete logarithm; a map that needs x to evaluate is excluded
      exactly as in IDEA-20260807-df5984.
    - >-
      Ordinary prime-field curves only; on supersingular curves the domain of
      interest is E[N] with a distortion map and (C5), not (C1), is the
      relevant regime - which is the ordinary/supersingular dichotomy read
      through the dimension count.
    - >-
      Toy scale for every measured number: p up to about 32 bits, k up to 6
      for the constructed small-k curves, N up to 2^28 for the Maurer-Wolf
      demonstration. Nothing extrapolates.

  resource_label: >-
    R7 (pairings into F_{p^k}) audited rather than consumed. The record's
    finding is that R7's self-pairing sub-resource, on G x G, is either empty
    or equal to the ECDLP itself; the surviving R7 content is G x G' with G'
    outside G, i.e. the classical transfer, whose non-generic ingredient is
    the field of definition of G'.
  admissibility: admissible
  admissibility_argument: >-
    Admissible by construction - the record asserts no attack and applies no
    endomorphism to a point of G. Its outcome is a closure of the
    self-pairing sub-resource by a dimension count, which is stronger than a
    filter exclusion because the resource is admitted first and then shown to
    coincide with the goal. Under RQ-GGMB-6eaabc's audit the oracle class
    'self-pairing into an easy group' is NOT simulable - it solves the DLP -
    and that non-simulability is exactly why it cannot be assumed.

  proof_search_map:
    bottleneck: >-
      The identification Bil(G x G, H) = H[N]. Everything else is
      substitution. Remove prime cyclic order and the bottleneck reappears as
      a rank-4 space with genuinely different families.
    baseline_embedding:
      parameter_slice: >-
        H = mu_N inside F_{p^k} and b the Tate self-pairing. (C1) then reads
        'the Tate self-pairing is [c] h_T', (C2) reads 't(P, P) non-trivial
        implies ECDLP reduces to a DLP in mu_N', which is H-PAIR-713241's
        k = 1 Frey-Ruck branch verbatim. The slice reproduces the known
        positive at k = 1 and the known null at k > 1.
      reproduction_check: >-
        Symbolic, plus the frozen fixture that IDEA-20260807-e7eb5d's gate G4
        supplies - one k = 1 curve on which t(P, P) has exact order N and the
        F_p DLP recovers x with an on-curve certificate.
    observation_collision:
      observable: >-
        The element h = b(P, P) together with the rank of Bil(G x G, H).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and the collision is the content:
        the Tate pairing, the eta/ate pairings, the elliptic-net pairing and
        any CHM oriented self-pairing all project to a scalar multiple of one
        h. Two structurally different constructions with the same h are the
        same map. The separating condition that would make them different
        objects is rank > 1, which requires a non-cyclic domain - (C5).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'search over self-pairing families' by 'one element h in
          H[N] and one encoding of H'. Encoding: exact. Completeness: exact by
          (C1). Soundness: the computability question is where the content
          moves, and (C2)/(C3) say it moves onto the goal.
        predicted_gain: >-
          Retires three open cells of the lane at zero compute and names the
          one that remains (df5984's homomorphism taxonomy).
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable 'rank of Bil' fixed at 1 and vary the forgotten
          structure (which pairing construction); then hold the construction
          fixed and vary the domain to full rational torsion, where the rank
          jumps to 4.
        predicted_gain: >-
          Exhibits the edge of the closure constructively on
          IDEA-20260901-fac74a's curve, so the closure is a boundary and not
          a fatigue report.
    quantifier_order: >-
      (C1): FOR ALL primes N, FOR ALL cyclic G of order N, FOR ALL abelian H,
      FOR ALL bilinear b on G x G, THERE EXISTS h in H[N] with
      b([x]P, [y]P) = [xy] h for all x, y. (C2): FOR ALL computable b with
      h != 0 and easy DLP in <h>, the ECDLP in G is easy. (C3): FOR ALL
      computable b into G with h != 0, CDH in G is easy; and (conditional on
      H1) the DLP in G is easy. THE WEAKER READING NOT CLAIMED: nothing is said
      about b whose second argument ranges over a group other than G.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On a prime-order cyclic subgroup there is exactly one self-pairing up
        to scalar, and any efficiently computable non-degenerate one is an
        ECDLP solver or a CDH oracle.' It certifies nothing about G x G'
        pairings, nothing about the cost of the classical transfer, and
        nothing about ECDLP hardness.
      nearby_object_control: >-
        The full-rational-N-torsion curve of IDEA-20260901-fac74a: rank 4,
        Weil and Tate not proportional, ECDLP trivially MOV-broken at k = 1.
        The argument must SEE the rank jump; if the instrument reports
        proportionality there, it is measuring itself.
    proof_obligations:
      - claim: Bil(G x G, H) is isomorphic to H[N] for G cyclic of prime order N.
        responsibility: correctness
      - claim: A computable self-pairing with h != 0 into an easy-DLP group solves the ECDLP.
        responsibility: correctness
      - claim: A computable self-pairing into G with h != 0 is a CDH oracle.
        responsibility: correctness
      - claim: >-
          The Maurer-Wolf reduction runs at toy N given a B-smooth auxiliary
          curve, with the recovered x certified on the curve.
        responsibility: feasibility
      - claim: On full rational N-torsion the rank is 4 and Weil, Tate are not proportional.
        responsibility: baseline
      - claim: Every reported pairing value carries its mu_N membership check and the auxiliary point used.
        responsibility: scope

  object_first_candidate:
    tracked_object: >-
      The element h = b(P, P) in H[N] that a self-pairing on G reduces to,
      carried through scalar multiplication of the arguments.
    lossiness: >-
      Lossy: an entire construction (Miller loop, divisor, orientation,
      recurrence) collapses to one group element. What is discarded is
      discarded compatibly with the operation set (composition with scalar
      multiplications), under which h propagates exactly as h -> [xy] h. Not a
      change of coordinates: the construction is not recoverable from h.
    propagation: >-
      Exact under scalar multiplication on either argument. Under CHANGE OF
      DOMAIN to a non-cyclic group the object stops being one element and
      becomes a rank-4 lattice, which is the (C5) edge.
    survival_score: >-
      Survives every composition of bilinear self-maps on G. Dies when the
      second argument leaves G, which is exactly where the classical transfer
      lives and where this record hands over to df5984.

  null_object_control: >-
    NULL-1 (blocking): random points of E(F_{p^k}) NOT in E[N]. Every 'pairing
    value' the instrument emits on them must fail the mu_N membership test;
    this proves the proportionality check in Stage 1 has resolving power
    rather than passing vacuously. NULL-2 (blocking): the deliberately broken
    instrument copy of IDEA-20260807-e7eb5d with the final exponentiation
    removed must BREAK the Stage 1 proportionality. DECAY PARAMETER: the
    number of sampled point pairs per curve; the fitted exponent c must be
    exactly constant (zero variance) as the sample grows, and a c that
    'converges' rather than sitting at one value is an instrument artifact.
    NEARBY-OBJECT POSITIVE (blocking, other direction): the
    IDEA-20260901-fac74a full-rational-torsion curve must show rank 4 and
    non-proportionality. CONTROL C (Stage 3): the Maurer-Wolf run with the
    CDH oracle replaced by a RANDOM-OUTPUT oracle must fail to certify x; a
    pipeline that recovers x from a random oracle is reading the harness's
    cheat, not the reduction.

  discriminated_from:
    - >-
      H-PAIR-713241 and IDEA-20260807-30868b. Those close three NAMED families
      on G and leave the complement open in three cells. This record shows the
      complement is empty by dimension count and that the surviving dimension
      is the goal. Exact delta: rank Bil(G x G, H) = 1, plus (C2)/(C3).
    - >-
      H-PAIR-27e16a and IDEA-20260807-464ff8. Those close 'Weil composed with
      an endomorphism' via commutativity and alternation. Here the Weil
      pairing on G x G is simply the zero element of a one-dimensional space;
      the endomorphism argument is not needed for G x G, and IS needed for
      G x G' (C4), which is where 27e16a's content lives.
    - >-
      IDEA-20260807-df5984. That record classifies one-point maps G -> H by
      factorisation target. This record REDUCES the self-pairing question to
      that classification (C4) rather than extending it; the delta is the
      reduction itself, and the recommendation that RQ-PAIR's second half be
      retired into df5984 rather than kept open beside it.
    - >-
      IDEA-20260808-40aab9. That record closes the Kani route by torsion rank
      over F_p. Same load-bearing fact (rank-1 rational N-torsion), different
      conclusion: there it kills a kernel assembly, here it kills the family
      distinction among self-pairings.
    - >-
      DEC-20260802-204/205/220 and the corpus's Cheon references. Those are
      Cheon's DLP-with-auxiliary-input algorithm (a different Cheon result).
      The Cheon-Lee self-bilinear note cited here is a different paper and
      appears nowhere in the corpus.
    - >-
      IDEA-20260807-e7eb5d. The instrument this record's Stages 1-2 run on;
      e7eb5d certifies pairing values, this record tests a relation among
      them (proportionality) that e7eb5d does not check.

  predictions:
    - metric: >-
        M1 - on cyclic G x G2 at constructed k in {2, 3, 6}, the number of
        (curve, point-pair) cells on which the Weil, reduced Tate and ate-type
        values are related by a single per-curve exponent c, out of all cells
      direction: higher
      minimum_effect: >-
        100 percent with c constant across at least 200 point pairs per curve
        and zero variance. Any cell with a pair-dependent exponent is an
        instrument failure (diagnosed final exponentiation first, auxiliary
        divisor second) and no number is reported.
    - metric: >-
        M2 - on the full-rational-N-torsion curve, the rank over Z/N of the
        span of {Weil, Tate, Tate with arguments swapped, Tate composed with
        the automorphism} as bilinear forms on E[N] x E[N]
      direction: different
      minimum_effect: >-
        EXACTLY 4 on the exceptional curve and EXACTLY 1 on every cyclic-G
        cell. Failure of either half means the argument does not separate
        prime cyclic order from full rational torsion and the record stops.
    - metric: >-
        M3 - Maurer-Wolf toy runs (cheating CDH oracle) that end with an
        on-curve certificate [x]P = Q verified independently of the solver,
        out of runs where a B-smooth auxiliary curve was found
      direction: higher
      minimum_effect: >-
        100 percent of runs with a found auxiliary curve; the random-output
        oracle control must certify 0 percent. Runs where no auxiliary curve
        is found within budget are reported as UNEXHIBITED at that N, never
        as failures of (C3).
    - metric: >-
        M4 - fraction of random curves over F_N with B-smooth order, at
        N in {2^20, 2^24, 2^28} and B = N^{1/4}
      direction: different
      minimum_effect: >-
        Within the Dickman-de Bruijn prediction rho(u), u = log N / log B = 4,
        i.e. about rho(4) = 0.0049, by a two-sided binomial test at 5 percent
        over at least 10^4 samples per N. This is the validation of H1 and it
        is a PRE-REGISTERED expectation, not a measurement.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate): write (C1) and the rank-4 statement
      for full rational torsion; a reviewer confirms the two cases separate.
      STAGE 1 (hours): M1 on at least 20 constructed small-k toy curves
      (k in {2, 3, 6}, p in 16-28 bits) via the e7eb5d instrument, with NULL-1
      and NULL-2. STAGE 2 (hours): M2 on the fac74a exceptional curve and on
      three cyclic-G controls. STAGE 3 (hours): M3 and M4 at N in
      {2^20, 2^24, 2^28} with the cheating CDH oracle, the random-output
      control, and independent on-curve certificates. NO ATTACK IS RUN; the
      only scalar recovered is in the toy calibration and by a disclosed cheat.
      THE CHEAPEST DECISIVE STEP IS M2: rank 1 versus rank 4 on two curves
      at the same p, computable in minutes, which alone shows the closure has
      an edge.
    controls:
      - NULL-1 non-torsion points failing the mu_N test (blocking)
      - NULL-2 broken-instrument copy breaking proportionality (blocking)
      - nearby-object positive, full rational torsion showing rank 4 (blocking)
      - random-output oracle in Stage 3 certifying nothing (blocking)
      - decay in the number of point pairs, exponent variance exactly zero
      - Pollard rho with distinguished points and BSGS run on every toy instance as the mandatory matched baselines (KN-TECH-006, KN-TECH-031), and the automorphism-discounted rho on any j = 0 or j = 1728 instance (KN-TECH-018)
      - exclusion of anomalous and smooth-N instances per KN-TECH-034
    required_metrics:
      - per curve the fitted exponent c and its variance over point pairs
      - the rank over Z/N of the bilinear-form span, per curve
      - Maurer-Wolf certificate pass or fail per run, with N, B, the auxiliary curve and its order recorded
      - B-smooth fraction per N with binomial interval against rho(u)
      - pass or fail of every control
      - wall-clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. A bilinear map on G x G, G cyclic of prime order, not of the form
      [xy] h. (C1) is false; this contradicts elementary algebra and would be
      an instrument or definition error, reported as such.
    - >-
      F2. Proportionality holding on the full-rational-torsion curve (rank 1
      where rank 4 is predicted). The argument proves too much and the record
      is void.
    - >-
      F3. A Maurer-Wolf run with a found smooth auxiliary curve and a genuine
      CDH oracle that fails to certify x. Either the reduction is misapplied
      or the recalled Maurer-Wolf statement is wrong; the record is superseded
      after the source is opened.
    - >-
      F4. The B-smooth fraction inconsistent with rho(u) at all three N. H1
      fails at toy scale; (C3) becomes conditional on an unvalidated
      assumption and is reported as such.
    - >-
      F5. Budget exhaustion. Infrastructure outcome under AGENTS.md rule 5,
      never evidence about (C1)-(C5).

  confounders:
    - >-
      Final exponentiation and auxiliary-divisor errors manufacture fake
      non-proportionality (IDEA-20260807-e7eb5d confounders 1-2). NULL-2 and
      the mu_N check are the mitigations.
    - >-
      The cheating CDH oracle. It is soundness-losing by construction; any
      reader who takes Stage 3 as an attack has misread it. Every Stage 3
      artifact must carry the sentence 'the oracle was given the logs'.
    - >-
      Smoothness search luck at toy N. The auxiliary-curve search can succeed
      at 2^20 by chance and fail at 2^28 by budget; M4 exists so the
      success rate is compared to a prediction rather than to hope.
    - >-
      Reading (C1) as a statement about G x G'. It is not, and (C4) says so;
      a summary that drops the 'same group' qualifier overclaims.

  interpretation_limits:
    - >-
      A closure by dimension count, not a hardness result. It moves no
      exponent, mounts no attack, and makes no curve safer than
      H-PAIR-713241 already does; what it changes is which questions remain
      open in the lane.
    - >-
      Scoped to ordinary prime-field curves and prime cyclic G. On
      supersingular curves and on full rational torsion the rank is larger
      and the families are genuinely different, which (C5) records.
    - >-
      (C3)'s lift from CDH to DLP is conditional on the recalled Maurer-Wolf
      reduction and on H1; until the source is opened the lift is stated, not
      relied on. (C2) needs neither.
    - >-
      Every measured number is claim_tier toy, scoped to the tested curves,
      k, N, B and budget; no transfer to cryptographic size is claimed or
      licensed.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For N prime in the toy range and B = N^{1/4}, the order of a uniformly
        random elliptic curve over F_N is B-smooth with probability
        (1 + o(1)) rho(u), u = log N / log B, uniformly for 2 <= u <= 6.
      rigorous_support: >-
        The rigorous ingredients are the Hasse bound (the order lies in an
        interval of length 4 sqrt(N) about N + 1) and Deuring's theorem that
        every integer in that interval is attained; the distributional
        statement imitated is Dickman-de Bruijn for smoothness of a uniformly
        random integer of size N (the same heuristic Lenstra's ECM analysis
        makes), and it is exactly the auxiliary-group condition of the
        Maurer-Wolf reduction.
      validation_plan: >-
        SAMPLE: 10^4 random curves over F_N at each N in {2^20, 2^24, 2^28},
        orders by point counting (baby-step giant-step at these sizes is
        exact), largest prime factor recorded. SHORTCUT: none needed; the
        orders are computed directly. COMPARISON: empirical CDF of
        log P^+(#E) / log N against rho(u), by Kolmogorov-Smirnov. TAIL CHECK:
        the smoothest observed order per N against its predicted extreme
        probability rho(u_min) times the sample size. SAMPLED PARAMETERS
        RECORDED: N, seed, each order and its factorisation. TRANSFER: none;
        H1 is used only at the toy N where it is measured.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CLAIMED. The record's algorithmic content is a polynomial
      reduction (self-pairing into G -> CDH -> DLP), and what it shows is that
      the object the lane was searching for is at least as hard as the ECDLP
      itself. Standing exponent 1/2 unchanged.
    memory_exponent: >-
      O(1) for the reduction beyond the auxiliary curve's Pohlig-Hellman
      tables, which are polylog. Not applicable to any attack, since none is
      produced.
    best_known: >-
      Parallel Pollard rho with distinguished points and negation at about
      0.886 sqrt(N) group operations and O(1) memory per processor
      (KN-TECH-006); automorphism-discounted rho on CM curves at most sqrt(6)
      better (KN-TECH-018); BSGS at 2 sqrt(N) time and sqrt(N) memory
      (KN-TECH-031); MOV/Frey-Ruck when k is small (KN-TECH-032); the
      anomalous transfer at N = p (KN-TECH-033).
    hidden_overhead: >-
      None in the closure. The Maurer-Wolf demonstration hides the
      auxiliary-curve search, whose expected cost is 1 / rho(u) point
      countings - polynomial at fixed u but not free - and it is charged and
      measured rather than absorbed.
    tradeoff_note: >-
      Not applicable; no algorithm is produced. The frontier is unchanged on
      every axis.

  dominated_by: >-
    AS AN ATTACK: none is mounted; checked row by row against the prime-field
    frontier and dominated on every axis by (1) parallel rho with negation,
    0.886 sqrt(N) time, O(1) memory (KN-TECH-006); (2) automorphism-discounted
