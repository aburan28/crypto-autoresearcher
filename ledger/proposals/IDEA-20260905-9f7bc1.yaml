idea:
  id: IDEA-20260905-9f7bc1
  title: Weighted character-support compression for a smaller rank field
  class: composition
  claim: Given only certified twist-rank lower bounds, an exact subspace optimization over their character supports
    can identify the smallest multiquadratic field justified by those witnesses to meet a rank threshold; high total
    rank alone does not determine that field.
  mechanism: Encode available squareclasses as vectors in F_2^k and attach each its independently certified rational
    twist rank r_d. A subspace W corresponds to a multiquadratic field K_W of degree 2^dim(W). The eigenspace identity
    gives a lower bound sum_{d in W} r_d from transported displayed points. Optimizing this certified weight over
    subspaces, rather than taking the largest individual weights, respects the multiplicative closure that defines
    a field. The new tracked object is the weighted subspace lattice with provenance-bound witnesses. It can expose
    whether many moderate ranks fit inside degree8 while apparently better individual twists require degree16 or
    more.
