  novelty_rationale: >-
    Every mathematical ingredient is expected to be classical and the honest
    mathematical label would be `known`. The Montgomery doubling formula, the
    2-descent halving criterion for y^2 = x(x^2 + a x + b), the folklore that
    Montgomery curves have order divisible by 4, and the identity
    #E + #E^t = 2p + 2 are all textbook. The label is nevertheless `unverified`
    and NOT `known`, because no external source establishing any of them was
    successfully retrieved in this session. Two attempts on safecurves.cr.yp.to
    failed with a fetch-tool parse error, and no textbook or paper was opened.
    The corpus screen WAS run and returned nothing. Per agents/idea-generator.md
    a proposal whose external literature is entirely `recalled` is `unverified`;
    that is the honest label and it is not a novelty claim.
  novelty_screen:
    method: >-
      Run 2026-08-29 in this session. Grep over knowledge/ for
      "2-Sylow|Legendre|2-adic|halving|2-descent" (250-file cap hit, so
      narrowed) and for "Montgomery curve.*(order|cofactor|divisib)|divisible
      by 4|2-Sylow"; grep over ledger/proposals/ for "SafeCurves"; grep over
      ledger/hypotheses/ for "SCURVE|Curve25519|safecurves". Full reads of
      RQ-SCURVE-d9b7d2, RQ-SCURVE-84a540, RQ-SCURVE-965391,
      GOAL-SCURVE-51437e/goal.yaml, IDEA-20260807-98a970, KN-LIT-093,
      KN-TECH-033, and both artifacts of TASK-20260824-eaf0af.
    results: >-
      ledger/hypotheses/ contains NO record mentioning Curve25519, SafeCurves
      or SCURVE. ledger/proposals/ contains exactly one SafeCurves-adjacent
      record, IDEA-20260807-98a970, which is about the multiplicative embedding
      degree and contains no 2-adic material. The knowledge corpus contains no
      criterion for the 2-adic valuation of a Montgomery curve group; the three
      substantive hits on "divisible by 4" (KN-LIT-3305, KN-LIT-933,
      KN-LIT-3358) concern F_q^7 weakness, Tamagawa numbers, and a cofactor-4
      point compression format respectively, none of which supplies the
      criterion. The archived audit plan's lane L8b computes chi(A^2 - 4) only.
      So the corpus holds no 2-adic valuation, and no derivation of one, for any
      curve in the family.

