  assumptions:
    - >-
      The executor session has a shell and a Python 3 interpreter with
      arbitrary-precision integers. This is the assumption the archived batch
      could not make, since its producer had no shell, and is the reason this
      lane is stuck; the handoff must state it in its inputs.
    - >-
      No SEA, Sage or PARI point-counting backend is assumed. The entire
      proposal is constructed to need none - that is its point.
    - >-
      Curve parameters (p, A) are taken from the archived parameter capsule's
      retrieved layer and are re-checked for self-consistency, namely that
      A^2 - 4 is nonzero, before use. No parameter is typed from memory.
    - >-
      harness/toycurve.py is used as the INDEPENDENT verifier for the toy
      census, per its own docstring. Its arithmetic is exact for any prime p
      since it uses Python integers; only its performance is toy-scale. This
      must be re-checked, not assumed, before it is used at 255 bits.
    - >-
      Scope is prime fields, odd characteristic, curves in Montgomery or short
      Weierstrass form. Binary and extension fields are out of scope.

  proof_search_map:
    bottleneck: >-
      Obtaining v_2(#E), equivalently the 2-part of the cofactor, without #E.
      Every downstream lane in the archived plan that touches the cofactor
      currently takes it from a transcription (RFC 7748's cofactor 8), and the
      only independent route the plan knows is point counting, which
      environment assumption E2 declares unavailable. Removing this bottleneck
      is what converts a transcription into a certificate.
    baseline_embedding:
      parameter_slice: >-
        The instrument restricted to depth 0 must reproduce the archived plan's
        lane L8b EXACTLY. On input A = 486662 over p = 2^255 - 19 it must emit
        the same single symbol chi(A^2 - 4) and the same conclusion about the
        number of order-2 points. L8b is the best-known baseline inside this
        program and this proposal must contain it as a boundary case, not
        merely resemble it.
      reproduction_check: >-
        A frozen regression fixture asserting bit-identical agreement between
        the depth-0 output and an independent direct enumeration of the roots
        of u(u^2 + A u + 1) over F_p, run before any deeper chain step is
        trusted. Plus, at toy scale, exact agreement of the whole instrument
        with brute-force point counting on every admissible A.
    observation_collision:
      observable: >-
        The halving-chain signature S(E). This is the certificate that would
        carry the conclusion, so identifiability of v_2 from S(E) is exactly
        what must be attacked first.
      distinct_preimage_search: >-
        REQUIRED, AND IT IS THE CENTRAL EXPERIMENT, NOT AN AFTERTHOUGHT. Search
        exhaustively at toy p for two coefficients A and A' over the SAME p with
        S(E_A) equal to S(E_A') but v_2(#E_A) different from v_2(#E_A').
        PRE-REGISTERED PREDICTION, STATED WITH ITS TWO MEANINGS. Collisions are
        PREDICTED TO EXIST when chi(A^2 - 4) = +1, because the single chain from
        T = (0,0) cannot see a non-cyclic 2-Sylow's second generator, and are
        PREDICTED ABSENT when chi(A^2 - 4) = -1. Finding collisions in the
        chi = -1 branch would falsify C3's cyclic branch outright and would mean
        v_2 is NOT determined by any bounded Legendre chain from T. Finding none
        in the chi = +1 branch would mean the chain is unexpectedly stronger
        than the group-theoretic argument predicts and the argument must be
        redone. Either surprise is a result.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "what is the cofactor of this 255-bit curve",
          which as posed requires point counting, by the question "what is the
          terminal value of a Legendre-symbol chain", which is a fixed number of
          modular exponentiations.
        predicted_gain: >-
          v_2(#E) at 255 bits in about a dozen modular exponentiations,
          microseconds, instead of an SEA point count which is infeasible in
          this environment. Encoding, completeness and soundness obligations are
          listed separately below.
      - transform: boundary_lift
        proposed_object: >-
          The exact identity #E + #E^t = 2p + 2 read 2-adically, turning a
          computation into a forcing constraint that requires no computation at
          all.
        predicted_gain: >-
          The twist cofactor's 2-part for free once the curve's is known,
          removing the dependency on the unreadable source U10 entirely rather
          than deferring it.
    quantifier_order: >-
      C1 and C2 are claimed UNIFORMLY. FOR ALL odd primes p and FOR ALL A in
      F_p with A^2 - 4 nonzero, 4 divides #E_A(F_p) and 4 divides #E_A^t(F_p);
      and FOR ALL p = 1 mod 4, if v_2(#E) is at least 3 THEN v_2(#E^t) = 2. No
      witness depends on the instance. C3 is claimed CONDITIONALLY AND
      NON-UNIFORMLY. FOR ALL (p, A) WITH chi(A^2 - 4) = -1 THERE EXISTS a
      terminating chain whose length equals v_2(#E) - 1. The restriction to the
      chi = -1 branch is a genuine restriction of the quantifier and it is
      stated up front rather than discovered later.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For this (p, A), v_2(#E) = n and v_2(#E^t) = m, certified by the
        attached symbol chain and the 2p + 2 identity." It certifies NOTHING
        about the odd part - nothing about l, nothing about the primality of l,
        nothing about the rho cost, and nothing about the ECDLP. A cofactor is
        not a security statement.
      nearby_object_control: >-
        THE ANOMALOUS CURVE (GOAL-SCURVE-48e06c / RQ-SCURVE-84a540) is the
        sharpest nearby object and its use here is a REFUSAL control rather than
        a firing control. It is in short Weierstrass form with #E = p odd, so
        v_2(#E) = 0 and the Montgomery precondition that 4 divides #E is FALSE
        for it. An instrument that returns "4 divides #E" or "cofactor 8" for
        the Anomalous row has not identified the load-bearing structure, which
        is the Montgomery form, and is void. The Weierstrass branch must instead
        report that the cubic has NO root in F_p, a sharp falsifiable
        one-modular-exponentiation prediction on a curve the family already
        designates as deliberately broken. SECOND NEARBY OBJECT - A' = 486666
        over the same p, the archived plan's negative control N1, same residue
        class mod 4, processed by the identical code path and NOT predicted to
        give the same valuation.
    proof_obligations:
      - claim: >-
          The Montgomery doubling formula's numerator (u^2 - z^2)^2 vanishes
          exactly at u = z and u = -z, and the denominator is nonzero off the
          2-torsion.
        responsibility: correctness
      - claim: >-
          At least one of chi(A + 2), chi(A - 2) is +1 whenever
          chi(A^2 - 4) = -1, hence 4 divides #E unconditionally.
        responsibility: correctness
      - claim: >-
          v_2(2p + 2) = 2 exactly when p = 1 mod 4, and the forcing step from
          v_2(#E) at least 3 to v_2(#E^t) = 2 is valid.
        responsibility: strictness
      - claim: >-
          The chain terminates in at most log_2(#E) steps and each step costs
          O(1) modular exponentiations.
        responsibility: runtime
      - claim: >-
          The toy census is EXHAUSTIVE over admissible A, not a sample, at each
          size where exhaustiveness is claimed.
        responsibility: scope
      - claim: >-
          The emitted certificate is verifiable by a second implementation in
          the stated number of exponentiations, using only (p, A) and the chain.
        responsibility: interface
      - claim: >-
          Correctness of the instrument at 255 bits given validation at 13 to 20
          bits.
        responsibility: success_probability
    not_applicable_reason: null

