idea:
  id: IDEA-20260829-d052e6
  question_id: RQ-SCURVE-d9b7d2
  goal_id: GOAL-SCURVE-51437e
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    THE 2-ADIC SIGNATURE INSTRUMENT - certify the exact 2-adic valuations
    v_2(#E) and v_2(#E^t) of a Montgomery- or Weierstrass-form curve from
    Legendre symbols alone, with NO point counting, and derive from the exact
    identity #E + #E^t = 2p + 2 a zero-cost forcing theorem that pins the twist
    cofactor's 2-part once the curve cofactor's is known
  class: representation

  claim: >-
    FOR THE EXACT CURVE25519 TUPLE, the pair (v_2(#E), v_2(#E^t)) can be
    certified in at most a dozen modular exponentiations, with no point
    counting, no SEA backend, and no reliance on any transcribed group order,
    and the certificate is re-verifiable by a second implementation in the same
    dozen exponentiations. Three separable sub-claims, of decreasing rigour,
    each independently falsifiable.

    (C1) RIGOROUS, NO HEURISTIC. For every Montgomery curve E_A given by
    v^2 = u^3 + A u^2 + u over F_p with p odd and A^2 - 4 nonzero, both
    4 divides #E(F_p) and 4 divides #E^t(F_p). Proof sketch, fully checkable.
    The Montgomery doubling map sends (u : z) to
    ((u^2 - z^2)^2 : 4 u z (u^2 + A u z + z^2)), so a point P that is not
    2-torsion satisfies x(2P) = 0 exactly when u(P) = +1 or u(P) = -1. The
    point with u = 1 lies on E iff chi(A + 2) = +1 and the point with u = -1
    lies on E iff chi(A - 2) = +1, where chi is the Legendre symbol mod p,
    because the right-hand side evaluates to A + 2 and to A - 2 respectively.
    Since (A + 2)(A - 2) = A^2 - 4, at least one of chi(A + 2), chi(A - 2)
    equals +1 whenever chi(A^2 - 4) = -1, so T = (0,0) is halvable and a point
    of order 4 exists. When instead chi(A^2 - 4) = +1 the full 2-torsion
    (Z/2)^2 is rational and 4 divides #E directly. The same two symbols with
    reversed signs give the statement for the quadratic twist, whose defining
    equation is B v^2 = u^3 + A u^2 + u with B a non-square. NO POINT COUNT IS
    USED ANYWHERE IN THIS ARGUMENT.

    (C2) RIGOROUS FORCING THEOREM, ZERO COMPUTE. #E + #E^t = 2p + 2 exactly.
    If p = 1 mod 4 then v_2(2p + 2) = 2 exactly. Combined with C1's
    v_2(#E) at least 2 and v_2(#E^t) at least 2, at least one of the two
    valuations equals 2 exactly, since if both were at least 3 the sum would be
    divisible by 8, contradicting v_2(2p + 2) = 2. In particular
    v_2(#E) at least 3 FORCES v_2(#E^t) = 2 exactly. APPLIED TO CURVE25519,
    with every value stated as a prediction and none asserted as a measurement.
    p = 2^255 - 19 is PREDICTED to satisfy p = 1 mod 4, since 2^255 = 0 mod 4
    and -19 = 1 mod 4, so 2p + 2 = 2^256 - 36 = 4 times (2^254 - 9) with
    2^254 - 9 odd. Hence IF the curve cofactor is divisible by 8 THEN the twist
    group order is exactly 4 times an odd number. This certifies the 2-part of
    the twist cofactor as EXACTLY 4 without reading it from any source, which
    matters here precisely because the only source located by the archived
    capsule that was expected to state the twist order (capsule item U10, the
    PKC 2006 paper) was fetched and could not be read, and the internal record
    KN-LIT-093 is internal provenance only.

    (C3) FALSIFIABLE STRUCTURAL HYPOTHESIS, THE ACTUAL EXPERIMENT. Iterating
    the halving step of C1 defines a chain of Legendre symbols on explicitly
    computable field elements. The hypothesis has two branches and they are two
    different theories of the instrument. WHEN chi(A^2 - 4) = -1 the 2-Sylow
    subgroup of E(F_p) is cyclic and the chain determines v_2(#E) EXACTLY,
    terminating after v_2(#E) - 1 steps. WHEN chi(A^2 - 4) = +1 the 2-Sylow is
    not cyclic and the single chain from T = (0,0) is PROVABLY INSUFFICIENT, so
    v_2 is underdetermined and a second chain from a second rational 2-torsion
    point is required. The experiment separates the branches by exhaustion.

    PREDICTED FOR CURVE25519, all values emitted by the executor and none
    computed here. chi(A^2 - 4) = -1 with A = 486662; exactly one of
    chi(486664), chi(486660) equal to +1; v_2(#E) = 3; v_2(#E^t) = 2.

  mechanism: >-
    THE TRACKED OBJECT is the 2-adic halving chain signature of the curve, the
    finite sequence of Legendre symbols
    S(E) = (chi(A^2 - 4), chi(A + 2), chi(A - 2), chi(w_1), chi(w_2), ...)
    where w_1, w_2, ... are the successive discriminant-like field elements
    produced by halving the current 2-power-torsion point. For a
    short-Weierstrass row the chain starts one step earlier. The rank of
    E(F_p)[2] is the number of roots of the cubic in F_p, computable as the
    degree of gcd(x^p - x, f(x)) by one modular exponentiation in
    F_p[x]/(f(x)), and the chain proceeds from whichever rational 2-torsion
    points exist.

    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2), applied BEFORE
    any compute, which is the whole point of the test.
    WHAT IS DISCARDED. A 255-bit coefficient A, the base point, the
    j-invariant, the entire odd part of the group - which is the whole
    cryptographic group - and every isogeny-class datum except the 2-adic one.
    A 255-bit object collapses to a handful of bits.
    IS IT A CHANGE OF COORDINATES? No. Nothing about A is recoverable from
    S(E). The symbols are surjective onto their sign patterns and each fibre
    has size Theta(p) by Weil's bound on character sums. This is exactly the
    test that the (Delta, Pi) example of KN-LIT-7595 fails and this passes.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS THE AUDIT USES? Three
    operations, three answers, all deterministic. (i) QUADRATIC TWISTING.
    chi(A^2 - 4) is INVARIANT since A is unchanged, while chi(A + 2) and
    chi(A - 2) both flip sign, so S(E^t) is a deterministic one-step function
    of S(E) needing no extra information. (ii) F_p-ISOGENY OF ODD DEGREE. #E is
    invariant, so v_2 is invariant, so the chain's TERMINAL VALUE propagates as
    a constant; the chain's intermediate symbols do not, and that asymmetry is
    disclosed rather than glossed. (iii) MODEL CHANGE between Montgomery and
    twisted Edwards. Birational over F_p, so #E and hence v_2 are unchanged;
    the chain must be recomputed in the new model but its terminal value is
    preserved. THE RETAINED PART THEREFORE PROPAGATES DETERMINISTICALLY UNDER
    ALL THREE. PASSES.
    WHERE THE STRUCTURE DISSOLVES. At the first non-cyclic 2-Sylow. That is not
    a defect to be hidden; it is the measured boundary and it is C3's second
    branch.

    WHY THIS IS NOT THE ARCHIVED PLAN'S LANE L8b. Lane L8b of the archived
    audit plan computes ONE Legendre symbol, chi(A^2 - 4), to decide the number
    of order-2 points, and then takes the cofactor 8 from the RFC's transcribed
    statement. It never derives a valuation and it never touches the twist's
    2-part. This proposal replaces a transcribed cofactor by a derived and
    certified one, which is the precise gap the goal's own next_action names
    when it says that every stated numeric relation in the dossier is a
    transcription plus a pending check. C2 in particular converts the twist
    cofactor from an internal-provenance recollection into a theorem plus one
    subtraction.

    EXECUTION. Step 1, derive the halving chain symbolically and freeze it as
    code. Step 2, VALIDATE BY EXHAUSTION at toy scale. For p in a list of small
    primes, enumerate EVERY admissible A in F_p, compute #E by direct
    enumeration over u using Legendre symbols, and compare v_2(#E) against the
    chain's output for every single A. This is a complete census, not a sample,
    at the sizes where it is affordable. Step 3, apply the frozen instrument to
    the 255-bit tuple and emit the certificate. Step 4, apply C2's subtraction
    and emit the twist 2-part certificate.

