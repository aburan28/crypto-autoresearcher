  minimal_test:
    design: >-
      STAGE 0, zero compute, hours of thought. Derive the halving chain
      symbolically and write out the proofs of C1 and C2 as a derivation note. A
      failure here is the cheapest possible negative and it costs no machine
      time.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR, minutes of compute, and it
      alone settles the instrument. EXHAUSTIVE CENSUS at three primes near 2^13
      to 2^15, at least one congruent to 1 mod 4 and at least one congruent to 3
      mod 4. For EVERY A in F_p with A^2 - 4 nonzero, compute #E by direct
      enumeration over u using Legendre symbols, an O(p) pass; compute v_2 from
      it; compute the chain's terminal value; compare. Report the agreement
      fraction SEPARATELY for the chi(A^2 - 4) = -1 and chi(A^2 - 4) = +1
      branches, and exhibit any collision pair found. At p near 2^17 to 2^20 the
      full census is too expensive in pure Python, so those sizes run on a
      declared uniform random SUBSAMPLE of 10^4 coefficients with the seed
      recorded. THE EXHAUSTIVENESS CLAIM IS MADE ONLY WHERE IT IS TRUE.
      STAGE 2, seconds. Apply the frozen instrument to (p = 2^255 - 19,
      A = 486662) and emit the certificate; apply C2's subtraction and emit the
      twist 2-part certificate.
      STAGE 3, minutes. The null control - 10^4 random A at the real p,
      instrument only, for the v_2 distribution.
      STAGE 4, seconds. The family sweep - run the instrument on all 20 manifest
      rows, including the Weierstrass branch, and record which rows it REFUSES
      and why.
    controls:
      - >-
        POSITIVE, BLOCKING - constructed toy Montgomery curves with known
        v_2 = 2, 3, 4 and 5, found by exhaustive search at p near 2^13. The
        chain must return each exactly. An instrument that has never returned a
        value other than 3 cannot certify 3.
      - >-
        POSITIVE, SAME-p AND NEEDING NO POINT COUNT - A' = w + w^{-1} mod
        (2^255 - 19) for random w, which makes A'^2 - 4 = (w - w^{-1})^2 a
        square BY CONSTRUCTION. The instrument must report full 2-torsion and
        must report that the single chain is insufficient. This is a genuine
        parameter-matched positive control at the real prime, and it is the
        control the archived plan's deferred N5 could not supply.
      - >-
        REFUSAL CONTROL, ANOMALOUS - the GOAL-SCURVE-48e06c parameters, in short
        Weierstrass form with expected #E = p. The Weierstrass branch must
        report zero rational 2-torsion and v_2(#E) = 0, and the Montgomery
        branch must REFUSE rather than return a number. Per the goal's claim
        boundaries the Anomalous parameters must be independently re-sourced
        before this control is treated as authoritative; until then it runs as a
        self-consistency check on the intake tuple only.
      - >-
        NEGATIVE, PARAMETER-MATCHED - A' = 486666 over the same p, the archived
        plan's N1, same residue class mod 4 and same field, processed by the
        identical code path.
      - >-
        NULL, SAME SHAPE - 10^4 uniformly random A at the real p, identical code
        path, for the v_2 distribution above; and separately 10^4 random 255-bit
        odd integers fed to the Legendre routine, whose symbol distribution must
        be 0.5 plus or minus 0.005 at 3 sigma. A symbol routine returning all +1
        or all -1 is broken and voids everything.
      - >-
        CROSS-IMPLEMENTATION - every Legendre symbol computed twice, once by
        Euler's criterion via pow(x, (p-1)//2, p) and once by the binary
        Jacobi-symbol recursion. Disagreement on any input voids the run.
    required_metrics:
      - 'per toy p, the agreement fraction split by the chi(A^2 - 4) branch'
      - 'the exhibited collision pairs with equal signature and unequal v_2'
      - 'the chain length distribution at toy scale'
      - 'for Curve25519, chi(A^2-4), chi(A+2), chi(A-2), the full chain, v_2(#E)'
      - 'for Curve25519, 2p + 2, its 2-adic valuation, and the derived v_2(#E^t)'
      - 'the null distribution of v_2 over 10^4 random A at the real p'
      - 'per manifest row, instrument verdict or explicit REFUSAL with reason'
      - 'wall-clock per stage, and the exact subsample seeds where sampling was used'

  falsification_conditions:
    - >-
      Any A in the chi(A^2 - 4) = -1 branch of the exhaustive toy census whose
      chain terminal value differs from its brute-force v_2. C3's cyclic branch
      is refuted, the 255-bit application is withdrawn, and the counterexample
      is reported as a refutation artifact per docs/claims-and-verification.md.
    - >-
      No collision found in the chi(A^2 - 4) = +1 branch across the whole
      census. The group-theoretic insufficiency argument is wrong and must be
      redone before any claim about the instrument's reach is made.
    - >-
      chi(A^2 - 4) = +1 for A = 486662 at p = 2^255 - 19. The cyclic-2-Sylow
      reading fails for the target curve; the instrument still applies but only
      in its weaker branch, and the archived plan's L8b prediction is refuted.
    - >-
      v_2(#E) not equal to 3 for Curve25519. This CONTRADICTS the transcribed
      cofactor 8 of RFC 7748 and is a material discrepancy - halt, re-fetch RFC
      7748 Section 4.1, and escalate to independent review before any statement
      leaves the repository. A transcription or implementation error is far
      likelier than a finding and must be excluded first.
    - >-
      The Anomalous row's cubic has a root in F_p, or the instrument returns a
      Montgomery verdict for it. Instrument failure under AGENTS.md rule 3; the
      whole family sweep is void.
    - >-
      Any disagreement between the two independent Legendre implementations.
      Implementation failure; nothing is reported.
    - >-
      p is not congruent to 1 mod 4 for 2^255 - 19. C2's forcing theorem does
      not apply in the stated form and the twist claim is withdrawn, since the
      theorem would have to be restated for the p = 3 mod 4 regime.

  confounders:
    - >-
      WHICH GROUP ORDER. v_2 is a statement about #E, not about the prime
      subgroup order l. A record that writes "cofactor 8" must say whether it
      means v_2(#E) = 3, which this instrument certifies, or #E divided by l
      equals 8, which it does NOT, because the odd part of the cofactor is
      invisible to this object. The two coincide only if the odd part of #E is
      prime, which is a separate certificate from the archived plan's lane L4.
    - >-
      B not equal to 1. The general Montgomery form is B v^2 = u^3 + A u^2 + u
      and the C1 argument used B = 1. For B a non-square the same argument runs
      with flipped symbols, which is exactly how the twist statement is
      obtained, but a curve given with B a square other than 1 is isomorphic to
      the B = 1 case and must be normalised BEFORE the instrument runs, not
      after.
    - >-
      TOY-SCALE ANOMALY RATE. At p near 2^13 to 2^20 a randomly chosen curve
      hits degenerate conditions - anomalous, supersingular, tiny order - far
      more often than at 255 bits, as KN-TECH-033 states explicitly. The census
      must record how many toy curves are supersingular or anomalous and must
      not let those cases silently dominate an agreement statistic.
    - >-
      An agreement fraction of 1.000 measured on a SUBSAMPLE is not an
      exhaustive census and must never be written as one. The design above keeps
      the two regimes separate for exactly this reason.
    - >-
      Weil-bound equidistribution of the symbols makes the depth-0 signature
      nearly uninformative on its own. The information is in the chain DEPTH,
      not in the first three bits, and a record that reports only the three
      symbols has reported almost nothing.

  interpretation_limits:
    - >-
      A 2-adic valuation is not a security statement. It bounds the largest
      power-of-two small-subgroup confinement available in a chosen-input oracle
      model (KN-TECH-034, an ADJACENT-MODEL result), and it says nothing
      whatsoever about the ECDLP in the prime subgroup.
    - >-
      C1 and C2 are proved; C3 is an empirical claim about an instrument,
      validated at 13 to 20 bits and applied at 255 bits. The transfer
      assumption is correctness-only and is heuristic H2 below; cost does not
      transfer and no cost claim is made.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER, same
      instrument, same branch - M-221 over 2^221 - 3, M-383 over 2^383 - 187 and
      Curve383187 over the same p are Montgomery-form rows predicted to satisfy
      p = 1 mod 4 by the same -3 and -187 mod 4 computation, so BOTH C1 and C2
      apply verbatim and the twist-forcing corollary is available for each.
      (b) PARTIAL TRANSFER, C1 applies but C2 CHANGES FORM - Curve1174 over
      2^251 - 9 and E-222 over 2^222 - 117 are predicted to satisfy p = 3 mod 4,
      so v_2(2p + 2) is at least 3 and the forcing step from v_2(#E) at least 3
      to v_2(#E^t) = 2 is NOT valid for them. A separate statement must be
      derived per residue class and the instrument must branch on p mod 4 rather
      than assume. Failing to branch here is the most likely way to get a wrong
      answer on a sibling curve, and it is disclosed in advance.
      (c) MODEL TRANSFER - the Edwards rows E-222, Curve1174 and E-382 must
      first be converted to Montgomery or Weierstrass form, and the conversion's
      own exceptional set (the archived plan's tracked object O4, lane D6) must
      be respected; the instrument does not transfer through an unaudited
      birational map. (d) WEIERSTRASS BRANCH ONLY, no Montgomery guarantee -
      Anomalous, NIST P-224, NIST P-256, NIST P-384, secp256k1, BN(2,254),
      brainpoolP256t1, brainpoolP384t1 and ANSSI FRP256v1. For these the
      2-torsion rank comes from the cubic and 4 dividing #E is NOT guaranteed;
      indeed for Anomalous it is FALSE. (e) NO TRANSFER AT ALL to any claim
      about the odd part, on any curve.
    - >-
      The instrument REFUSING to answer is a legitimate and informative output
      and must be recorded as a refusal, never as a pass.
    - >-
      Nothing here adjudicates any SafeCurves criterion cell. The SafeCurves
      criterion texts remain unretrieved - open item OR-2 of the archived
      capsule, re-attempted and re-failed in this session.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For p an odd prime and A drawn uniformly from the set of elements of
        F_p with A^2 - 4 nonzero, the 2-adic valuation v_2(#E_A(F_p)) satisfies
        Pr[v_2 = 2 + j] = 2^{-(j+1)} for j at least 0, up to an error o(1) as p
        tends to infinity; that is, conditioned on the rigorous floor
        v_2 at least 2 of claim C1, the excess valuation is geometric with ratio
        one half, as it would be for the 2-part of a uniformly random integer in
        the Hasse interval conditioned on divisibility by 4.
      rigorous_support: >-
        Two rigorous halves. (i) The FLOOR v_2 at least 2 is proved
        unconditionally by C1 and is not assumed. (ii) The joint distribution of
        the depth-0 signature (chi(A^2 - 4), chi(A + 2), chi(A - 2)) is
        EQUIDISTRIBUTED over its admissible sign patterns with error
        O(p^{-1/2}), by Weil's bound on character sums, so the first step of the
        chain is rigorously equidistributed and only the deeper steps are
        modelled. The classical distribution statement being imitated is the
        Cohen-Lenstra and Gekeler-style heuristic that the group structure of
        E(F_p) for varying E behaves like a random abelian group of its order,
        restricted here to the 2-part. That heuristic is notoriously easier to
        state than to prove, and that difficulty is recorded here rather than
        hidden.
      validation_plan: >-
        SAMPLING - the exhaustive toy census of Stage 1 gives the EXACT
        distribution of v_2 over all admissible A at p near 2^13 to 2^15, not a
        sample but a complete population, plus a 10^4 random subsample at p near
        2^17 to 2^20. SCALE AND PARAMETERS RECORDED - the three primes, the
        population sizes, and the subsample seeds. COMPARISON DISTRIBUTION -
        empirical CDF of v_2 - 2 against the geometric one-half CDF, by an exact
        chi-square goodness-of-fit test on bins j = 0, 1, 2, 3 and 4-or-more with
        expected counts stated in advance. TAIL CHECK - the largest v_2 observed
        in the census versus the predicted count p times 2^{-(j+1)} for that j; a
        toy population of about 10^4 curves should contain roughly one curve with
        v_2 at least 15 and none with v_2 at least 20. TRANSFER - the
        distribution is validated at 13 to 20 bits and reported at 255 bits only
        as a NULL for interpreting Curve25519's v_2 = 3, never as a property of
        Curve25519.
    - id: H2
      statement: >-
        A halving-chain instrument whose output agrees with brute-force point
        counting on 100 percent of an exhaustive toy population at 13 to 20 bits
        is CORRECT at 255 bits. Formally, the map from (p, A) to the chain
        terminal value has no size-dependent failure mode - word-size, overflow,
        modular-reduction, or exponent-range - that first appears above 20 bits.
      rigorous_support: >-
        NONE, and the record says so plainly. This is the archived plan's
        heuristic H4 inherited verbatim and it is the weakest item in this
        proposal. Its only mitigation is that the underlying arithmetic is
        Python arbitrary-precision integers, where the classes of size-dependent
        bug that motivate the assumption are largely absent by construction,
        which is an argument about the implementation and not a proof about the
        mathematics.
      validation_plan: >-
        Three partial checks, none of which discharges the assumption. (i) The
        SAME-p POSITIVE CONTROL A' = w + w^{-1} at the real 255-bit prime gives
        the instrument one 255-bit input whose branch is known by construction,
        so a size-dependent bug in the depth-0 stage has one chance to surface at
        full size. (ii) Cross-implementation agreement of every Legendre symbol
        between Euler's criterion and the binary Jacobi recursion, at 255 bits,
        on 10^4 inputs. (iii) Agreement of the instrument's v_2 = 3 output with
        RFC 7748's independently transcribed cofactor 8, which is the one
        255-bit object whose answer is claimed by a retrieved source. Note
        carefully that (iii) is a CONSISTENCY check between a derivation and a
        transcription - if they agree neither is thereby proved, and if they
        disagree at least one is wrong, which is the informative case.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. As an audit instrument, O(log p) modular
      exponentiations, that is O(log^3 p) bit operations with schoolbook
      arithmetic, to certify v_2(#E); O(1) additional integer operations for the
      twist forcing step. Concretely at 255 bits this is on the order of a dozen
      modular exponentiations, microseconds to milliseconds in Python.
      Verification of the emitted certificate by a second implementation is the
      same dozen exponentiations - the certificate IS succinct, in contrast to
      the embedding-degree lower-bound certificate of IDEA-20260807-98a970,
      which costs K = 10^6 multiplications to verify.
    memory_exponent: >-
      O(log p) working memory and O(log p) certificate size. The toy census
      needs O(p) time and O(1) memory per curve and O(p) total for the
      enumeration pass; at p near 2^15 that is trivial, and the 14-core, 48 GB
      envelope is not a binding constraint anywhere in this proposal.
    best_known: >-
      The best known route to v_2(#E) for an arbitrary 255-bit curve is a full
      SEA point count, roughly O(log^8 p) bit operations with large constants -
      minutes to hours in optimised C, and unavailable in this environment by
      the archived plan's environment assumption E2. The best known route INSIDE
      THIS PROGRAM is a transcription from RFC 7748, which is not a computation
      at all and is the deficiency this record addresses. Against the ECDLP
      attack frontier - rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006), automorphism-discounted rho (KN-TECH-018), BSGS
      (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck at small k (KN-TECH-032),
      the trace-one additive transfer (KN-TECH-033) - this record is dominated
      by all of them because it is not an attack.
    hidden_overhead: >-
      Nothing superpolynomial hides anywhere and there is no o(1). The honest
      hidden cost is epistemic rather than computational - the instrument is
      validated at 13 to 20 bits and applied at 255, and heuristic H2 carries
      that gap with no rigorous support. A second hidden cost is that the
      chain's SOUNDNESS at 255 bits rests on a symbolic derivation that no
      machine checks, so a transcription error in the derivation would produce a
      confidently wrong certificate that the toy census might not catch if the
      error is size-conditional.
    tradeoff_note: >-
      One genuine tradeoff. The instrument buys a factor of roughly log^5 p in
      time over SEA by discarding the odd part of #E entirely - it answers a
      strictly weaker question. There is NO setting of any parameter that
      recovers the odd part from this object, which is the lossy-projection test
      passing, read as a cost. Parallelisation is irrelevant at 255 bits, where
      the whole computation is microseconds, and embarrassingly parallel for the
      toy census across the 14 available cores, where the census is the only
      nontrivial compute in the proposal.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` is not
    asserted. AS AN ATTACK it is dominated by every row, because it is not an
    attack - rho at 0.886 sqrt(l) with O(1) memory (KN-TECH-001, KN-TECH-006),
    automorphism-discounted rho (KN-TECH-018), BSGS at sqrt(N) time and memory
    (KN-TECH-031) and its n^{2/3+o(1)} full cost (KN-TECH-035), MOV and
    Frey-Ruck at small k (KN-TECH-032), and the trace-one transfer
    (KN-TECH-033) all dominate it on time, memory and data simultaneously.
    AS A MEASUREMENT INSTRUMENT it is PARTIALLY dominated and partially NOT, and
    the distinction is the record's whole quantitative case. (1) A full SEA
    point count DOMINATES it on INFORMATION, since SEA returns #E exactly and
    v_2 follows, whereas this returns only v_2; but SEA does NOT dominate it on
    TIME - a dozen modular exponentiations versus O(log^8 p) with large
    constants, and SEA is unavailable in the declared environment at all. So on
    the time-versus-information plane the two are Pareto-incomparable, which is
    the honest statement. (2) SafeCurves itself, and the built-in group-order
    routines of Sage and PARI, dominate on authority and on having existed for
    over a decade; this record dominates them on exactly one axis, that its
    output is a succinct re-verifiable certificate inside this program's ledger
    with recorded provenance and declared controls. (3) RFC 7748's transcribed
    cofactor 8 dominates on cost, which is zero, and is dominated on epistemic
    status, since it is a transcription, which is precisely the goal's stated
    deficiency.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis - time, memory, data,
    queries. QUANTITATIVELY AS DATA - the corpus currently holds NO 2-adic
    valuation, NO derived cofactor and NO twist cofactor for any curve in the
    twenty-row family; the archived capsule's own grep found neither Curve25519
    order literal anywhere in the repository, and my 2026-08-29 greps found no
    Montgomery 2-adic criterion in knowledge/ and no SafeCurves record in
    ledger/hypotheses/. This record would produce, per curve, two certified
    integers plus a succinct certificate verifiable in about twelve modular
    exponentiations, for up to 20 curves, where there are currently zero.
    QUANTITATIVELY AS COST - v_2(#E) at 255 bits moves from "requires SEA,
    declared unavailable by environment assumption E2, therefore DEFERRED" to
    "about twelve modular exponentiations, microseconds", an
    infeasible-to-feasible transition inside this environment rather than a
    constant-factor improvement. QUANTITATIVELY AS SCOPE - the twist cofactor's
    2-part moves from internal-provenance recollection (KN-LIT-093) resting on
    an unreadable source (U10) to a theorem plus one subtraction.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

