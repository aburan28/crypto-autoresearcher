idea:
  id: IDEA-20260807-406fef
  question_id: RQ-MTGT-2cabee
  added: '2026-08-07'
  title: >-
    THE CORRECT MULTI-TARGET BASELINE, AND WHY THE ISOGENY CLASS EXACTLY TIES IT
    AND CANNOT BEAT IT: transport reduces "M targets spread over M classmates" to
    "M targets on one curve", turning the naive M*sqrt(N) into Kuhn-Struik's
    sqrt(M*N) -- an improvement of sqrt(M) over the WRONG baseline and of exactly
    ZERO over the right one -- after which the class is fully consumed and Yun's
    tight generic Theta(sqrt(M*N)) bound applies unchanged; the live and
    UNPLOTTED question this exposes is the single-curve PREPROCESSING-times-
    MULTI-TARGET frontier, where a store-growth argument gives M^{1/2}*N^{1/3}
    time at M*N^{1/3} memory and the class contributes nothing at all
  class: algorithm

  claim: >-
    (A) THE BASELINE MOST AMORTISATION CLAIMS GET WRONG. Solving M discrete logs
    in one group of order N does NOT cost M*sqrt(N). Kuhn-Struik-style
    multi-target rho shares one distinguished-point store across all M walks and
    costs ~sqrt(M*N) in total, i.e. ~sqrt(N/M) per target, which DECREASES in M.
    The corpus records this baseline explicitly:
    analysis/o2-sum-compatible-filters/claim_a_adjudication.md carries the
    Kuhn-Struik reference as verified (2026-08-01) and uses sqrt(T*N) as the
    comparison column, and its section 3 Attack 5 records the exact failure mode
    this record is written to prevent -- IDEA-20260731-010's headline
    ("amortised per-target exponent falls below 1/2") was judged "true and
    uninteresting" because its baseline was 0.886*sqrt(N) single-target rho
    rather than Kuhn-Struik. KN-LIT-4091 further reports a TIGHT GENERIC LOWER
    BOUND of the same order for the multiple-discrete-logarithm problem, so
    sqrt(M*N) is a floor for generic methods and not merely the best known
    algorithm. ANY L13 AMORTISATION CLAIM MUST BE SCORED AGAINST sqrt(M*N).

    (B) WHAT TRANSPORT ACTUALLY DOES TO THE MULTI-TARGET PROBLEM, STATED AS A
    REDUCTION. Kuhn-Struik's sharing requires all M targets IN ONE GROUP: the
    shared object is a distinguished-point store, and a stored DP on E_i is
    meaningless for a walk on E_j because the walks are in different groups with
    different encodings. So if the M targets are spread one per classmate,
    Kuhn-Struik does NOT apply as stated and the naive cost is M*sqrt(N).
    Transport repairs exactly that: by T1 applied to the dual isogeny, the
    instance (E_j, P_j, Q_j) pulls back to (E_1, phi-hat(P_j), phi-hat(Q_j)) with
    THE SAME k, at a cost of two isogeny evaluations. Pull all M targets back and
    run one Kuhn-Struik computation on E_1. Total:
        C_class = sqrt(M*N) group operations + M*(C_build/M + 2*c_eval) field ops
                = sqrt(M*N) + O(L*ell^3) + 12*M*L*ell,
    where the isogeny construction is amortised over all targets sharing a path.
    THE REDUCTION IS EXACT AND THE CONCLUSION IS DEFLATIONARY:
      versus the WRONG baseline M*sqrt(N): a factor sqrt(M) improvement;
      versus the RIGHT baseline sqrt(M*N): a factor of exactly 1, i.e. NONE.
    The class does not beat the multi-target frontier. It restores access to it.

    (C) WHY IT CANNOT DO BETTER, WHICH IS THE CLOSURE HALF. After the pullback,
    all M targets live in ONE prime-order group G on ONE curve E_1. Every
    remaining piece of isogeny structure acts on G either as a scalar (if it is
    an endomorphism -- H-ENDO-001) or as an isomorphism onto another group whose
    targets have already been pulled back (IDEA-20260807-5cabfc). Neither
    supplies any information about G beyond the group law, so the post-pullback
    problem is a plain M-instance generic DLP and KN-LIT-4091's tight generic
    Theta(sqrt(M*N)) applies unchanged. THE ISOGENY STRUCTURE IS FULLY CONSUMED
    BY THE PULLBACK. This is the named obstruction for the multi-target half of
    L13 and it is why the honest headline is a tie.

    (D) THE QUESTION THIS EXPOSES, WHICH IS LIVE AND WHICH THIS PROGRAM HAS NEVER
    PLOTTED. Both baselines above are advice-free. The genuinely open comparison
    is PREPROCESSING TIMES MULTI-TARGET on ONE curve, and it is not in the
    corpus. A store-growth argument -- MY OWN ARITHMETIC, labelled as a heuristic
    below, not a citation -- gives:
      With a Bernstein-Lange-style store of S known-log distinguished points, a
      single target costs T ~ sqrt(N/S) (this is the S*T^2 ~ N relation). Process
      targets in sequence and ADD each walk's distinguished points to the store.
      After j targets the store is ~S + j*T_j, so T_j ~ sqrt(N/(S + j*T_j)).
      Starting from S = N^{1/3}, T_1 = N^{1/3}, so the store DOUBLES on the first
      target; after j targets the store is ~j*N^{1/3} and T_j ~ N^{1/3}/sqrt(j).
      Summing, total time ~ 2*M^{1/2}*N^{1/3} at peak memory ~M*N^{1/3}.
    Compare: Kuhn-Struik at M^{1/2}*N^{1/2} with a store of order the same
    sqrt(M*N)*theta. The preprocessed scheme is FASTER by N^{1/6} in time --
    which is not a violation of KN-LIT-4091 because that bound is for generic
    algorithms WITHOUT preprocessing, and it is not a violation of
    Corrigan-Gibbs--Kogan because that bound is stated per-target for a single
    instance. WHETHER A JOINT (S, M, T) LOWER BOUND OF THE FORM
    S*T^2 = Omega~(M*N) OR SIMILAR EXISTS IS [open] IN THIS CORPUS and is the
    single most valuable thing this record could send downstream.
    CRUCIALLY FOR L13: that entire question lives on ONE CURVE. The isogeny class
    contributes exactly zero to it. So the lane's honest position is that its
    interesting neighbour is a single-curve question it does not own.

    (E) THE MEMORY AXIS, WITHOUT WHICH (D) IS DISHONEST. M^{1/2}*N^{1/3} time at
    M*N^{1/3} memory is not obviously better than M^{1/2}*N^{1/2} time at small
    memory. Under Wiener full-cost accounting (KN-TECH-035, KN-LIT-094), a
    sqrt(N)-element table gives BSGS a full cost of N^{2/3+o(1)} despite
    N^{1/2} processor steps, precisely because large memory cannot be reached in
    unit time; parallel collision search keeps its advantage because per-processor
    storage stays small. The same correction must be applied here before the
    N^{1/6} time gap is called an improvement, and this record requires that both
    schemes be plotted in the AT product, not in step counts alone.

  resource_label: >-
    R8 primary (multi-instance structure: M targets, and the accounting regime
    that makes them cheaper together than apart), R4 (the isogeny graph supplies
    the pullback that makes the M targets co-located).

  admissibility: admissible

  admissibility_argument: >-
    The pullback applies phi-hat to points of G_j, which taken alone is exactly
    what the DECOMPOSITION.md section 2 filter closes. It is admissible here for
    the same reason as IDEA-20260807-a127ab and with the same honesty: the
    advantage is not extracted from phi's action on any single group but from the
    MODEL, in which M targets initially sit in M distinct encoded groups and the
    isogeny graph identifies those encodings. A generic simulator handed M
    independent encodings cannot manufacture that identification. And -- the
    honest half -- the admissible resource buys exactly a return to the
    already-known sqrt(M*N), which is why this record's sota_delta against the
    correct baseline is zero. An admissible resource that recovers the baseline
    and nothing more is the expected outcome and is recorded as such.

  discriminated_from:
    - >-
      IDEA-20260731-010 -- claimed an amortised per-target exponent below 1/2 for
      T >= N^{0.1}. analysis/o2-sum-compatible-filters/claim_a_adjudication.md
      section 3 Attack 5 records that this is "true and uninteresting" because
      matched multi-target rho achieves the same for free, and that its baseline
      must be Kuhn-Struik. This record adopts that correction as its starting
      point rather than repeating the error.
    - >-
      IDEA-20260807-a127ab -- the PREPROCESSING amortisation (one table, M
      curves). This record is the ADVICE-FREE multi-target amortisation (no
      table, M targets), which has a different baseline and a different
      conclusion. Section (D) is where the two meet and the record says
      explicitly that the meeting point is a single-curve question.
    - >-
      H-MTIC-001 -- the multi-target INDEX-CALCULUS crossover on one fixed curve,
      charged against S*T^2 = Omega~(N). Same accounting discipline, different
      algorithm (index calculus vs rho) and different question (is there a
      crossover at all vs where is the frontier). This record neither tests,
      supports nor weakens H-MTIC-001.
    - >-
      IDEA-20260807-5cabfc (L2) -- closes single-instance functionals. Section
      (C) here uses that closure as an INGREDIENT to argue that the class is
      fully consumed by the pullback; it does not restate it.

  object_first_candidate:
    tracked_object: >-
      THE SHARED DISTINGUISHED-POINT STORE -- the one object that makes
      multi-target rho cheaper than repeated single-target rho. Followed as
      targets arrive and as the instance moves between classmates.
    lossiness: >-
      LOSSY: the store keeps only the distinguished iterates and their (a, b)
      coefficients, discarding the entire walk history, every non-distinguished
      point, the curve equation and the model.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN, AND THE ANSWER IS THE RECORD'S CENTRAL FACT:
      the store propagates deterministically under the GROUP operations (adding a
      walk step, testing distinguishedness within one group), but it does NOT
      propagate under an isogeny, because the distinguishedness predicate is a
      predicate on the ENCODING (see the Class II analysis of
      IDEA-20260807-e0ddc6) and phi does not respect it. So the store is a valid
      tracked object WITHIN one curve and a NON-object ACROSS curves. That is
      precisely why the reduction in (B) moves the TARGETS to the store rather
      than the store to the targets -- the direction of the reduction is forced
      by the failure of the projection test in the other direction, and that is
      the useful thing this analysis produces.
    survival_score: >-
      Survives arbitrarily many targets within one curve; dies at the first
      isogeny step. Its (a, b) coefficient part is Class I and would survive, but
      the distinguishedness that makes the store searchable is Class II and does
      not -- a genuinely mixed object, which is why it is worth tracking.

  mechanism: >-
    STEP 1 -- IMPLEMENT THE RIGHT BASELINE FIRST. Build multi-target rho with a
    shared distinguished-point store on ONE toy curve and verify empirically that
    total cost scales as sqrt(M*N) and not as M*sqrt(N), across M in
    {1, 2, 4, 8, 16, 32}. Fit the exponent of M; require 0.5 +/- 0.05. Without
    this the lane has no correct baseline and every later comparison is void.
    STEP 2 -- THE NAIVE CROSS-CURVE COST. Place one target on each of M
    classmates. Run per-curve single-target rho. Record M*sqrt(N).
    STEP 3 -- THE FAILED DIRECTION, MEASURED ON PURPOSE. Attempt to share a
    distinguished-point store ACROSS curves without transport: build the store on
    E_1 and let walks on E_j test membership against it. Predicted: zero useful
    collisions beyond chance. This is the measurement that shows WHY the
    reduction must move targets and not stores, and it is cheap.
    STEP 4 -- THE PULLBACK. Transport all M targets to E_1 by certified dual
    isogenies (certificates per IDEA-20260807-0e8977) and run one Kuhn-Struik
    computation. Record group operations, field operations for the pullback, and
    peak store size, separately.
    STEP 5 -- THE COMPARISON. Plot Step 2, Step 4 and the Step 1 same-curve
    baseline together against M. Predicted: Step 4 lies ON the Step 1 curve plus
    an additive pullback term, and BELOW Step 2 by sqrt(M).
    STEP 6 -- THE PREPROCESSED VARIANT OF (D). Seed the store with S known-log
    distinguished points before processing targets, sweep S in
    {0, N^{1/4}, N^{1/3}, N^{2/5}}, and fit total time against M and S. Test the
    store-growth prediction total ~ 2*M^{1/2}*N^{1/3} at S = N^{1/3}. Report
    peak memory for every cell.
    STEP 7 -- AT ACCOUNTING. Recompute every comparison as an area-time product
    with the store charged as occupied hardware (KN-TECH-035) and report whether
    any time advantage survives.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Run 2026-08-07. Commands:
      (1) grep -rin "Kuhn.Struik\|sqrt(M\*N)\|multiple discrete log" . --glob '!research_digest/**'
      (2) grep -rin "multi-target" ledger/ knowledge/ analysis/
      (3) read of analysis/o2-sum-compatible-filters/claim_a_adjudication.md sections 3 and 5
      (4) read of ledger/hypotheses/H-MTIC-001.yaml
      (5) grep -rin "preprocessing" combined with "multi-target" across ledger/.
    results: >-
      (1) Kuhn-Struik appears in claim_a_adjudication.md (cited with a link and
      marked verified 2026-08-01) and in pre-ledger inputs/ scratch; KN-LIT-4091
      is the corpus entry for the tight generic multiple-DL lower bound and is a
      2026-07-24 bulk-seeded record whose title was mis-parsed and whose claims
      are relayed from the abstract. KN-LIT-5040 ("Multiple Discrete Logarithm
      Problems with Auxiliary Inputs") exists in SOURCES.md and is NOT read.
      (2) Multi-target records exist (H-MTIC-001, IDEA-20260726-001,
      IDEA-20260731-010) and are all SINGLE-CURVE.
      (3) claim_a_adjudication.md section 5 item 5 states explicitly that "the
      closure statement must name Kuhn-Struik as the baseline or it will be
      mis-scored" -- this record is the L13 discharge of that instruction.
      (5) ZERO records plot the joint preprocessing-times-multi-target frontier.
    verdict: >-
      ADAPTATION. Kuhn-Struik, Yun's bound and the pullback are all published or
      elementary. What is new to this program is (i) the explicit statement that
      cross-curve multi-target requires transport because the DP store is
      encoding-valued, (ii) the exact reduction and its deflationary scoring
      against sqrt(M*N), and (iii) the observation that the joint
      preprocessing-times-multi-target frontier is unplotted here and is a
      single-curve question the class does not touch. The store-growth
      arithmetic in (D) is MY OWN and is labelled a heuristic, not a citation.

  null_object_control: >-
    MANDATORY AND BLOCKING. THE NULL FOR "TRANSPORT ENABLED THE SHARING" IS STEP
    3: the identical multi-target computation with the M targets left on their
    own curves and the store shared anyway. Under the null the cross-curve
    collision rate must equal chance, and the total cost must revert to
    M*sqrt(N). SECOND NULL: M targets placed on M curves of the same order N but
    in DIFFERENT isogeny classes, where no pullback exists -- cost must be
    M*sqrt(N) with no arm able to improve it. THIRD NULL, for the store itself: a
    randomly populated store of identical size, which must produce no useful
    collisions.
    DECAY PARAMETER: mu, the fraction of the M targets that are actually pulled
    back (the remainder left in place). Total cost must interpolate between
    sqrt(M*N) at mu = 1 and M*sqrt(N) at mu = 0, and specifically must behave as
    sqrt(mu*M*N) + (1-mu)*M*sqrt(N). A total cost that fails to rise as mu falls
    means the measured saving is not coming from the pullback and the run set is
    void.

  assumptions:
    - >-
      The Kuhn-Struik sqrt(M*N) multi-target rho cost is taken from
      analysis/o2-sum-compatible-filters/claim_a_adjudication.md, which records
      the source (SAC 2001) as verified on 2026-08-01 with a link. The paper
      itself was NOT read for this record; the exponent is used, no constant is
      quoted, and Step 1 re-measures the exponent in-harness rather than assuming
      it. Confidence: reported.
    - >-
      The tight generic lower bound Theta(sqrt(M*N)) for the multiple-DL problem
      is relayed from KN-LIT-4091, a bulk-seeded entry with a mis-parsed title
      and abstract-only claims. Confidence: reported. Section (C)'s closure leans
      on it and would need a verified citation before promotion.
    - >-
      The store-growth derivation in (D) is this record's own arithmetic under
      heuristic H1 below. It is NOT a published result and must never be cited as
      one.
    - >-
      Toy scale. At p up to ~2^{24} and M up to 32, sqrt(M*N) and M*sqrt(N)
      differ by at most a factor 5.7, so the exponent fit in Step 1 needs the
      full M ladder and adequate seeds to resolve. This is a real power
      constraint and is the binding one for the whole record.
    - >-
      Every recovered k is certified against the ORIGINAL instance on its own
      curve, not against the pulled-back instance.

  proof_search_map:
    bottleneck: >-
      Section (C): the argument that the isogeny structure is FULLY CONSUMED by
      the pullback, so that no post-pullback advantage remains. Everything else
      is a reduction (mechanical) or a measurement. If (C) is wrong, the lane has
      a live target; if right, the lane's multi-target half is closed.
    baseline_embedding:
      parameter_slice: >-
        M = 1, no transport. The scheme must degenerate exactly to single-target
        Pollard rho at 0.886*sqrt(N) group operations with negation
        (KN-TECH-001, KN-TECH-006, KN-TECH-018).
      reproduction_check: >-
        Measured M = 1 cost must match the harness's own rho baseline
        (harness/rho.py total_group_operations) on the identical instances to
        within its run-to-run spread. A mismatch means the multi-target
        implementation is not a fair extension of the baseline and every
        M-dependence figure is uninterpretable.
    observation_collision:
      observable: >-
        "Total cost scales as sqrt(M)."
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: sqrt(M) scaling is produced by ANY
        shared-store multi-target computation, including one with no isogeny
        anywhere (all M targets natively on one curve). So observing sqrt(M) does
        NOT establish that transport did anything -- it establishes only that the
        targets ended up co-located. The disambiguator is Step 3 and the mu
        decay: reporting sqrt(M) scaling for a transported arm without the mu
        sweep is prohibited by this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Reduce "M targets on M classmates" to "M targets on one curve" by
          pulling back with dual isogenies, then invoke the existing multi-target
          algorithm unchanged.
        predicted_gain: >-
          sqrt(M) against the naive per-curve baseline; ZERO against the correct
          Kuhn-Struik baseline. Both halves are the claim, and the second is the
          headline.
      - transform: cost_reallocation
        proposed_object: >-
          Merge the preprocessing store and the multi-target store into one
          object and account for its growth across targets.
        predicted_gain: >-
          A predicted M^{1/2}*N^{1/3} time at M*N^{1/3} memory, i.e. N^{1/6}
          better in TIME than Kuhn-Struik and far worse in MEMORY -- which is why
          Step 7's AT accounting is mandatory before the word "better" is used.
    quantifier_order: >-
      INTENDED: FORALL isogeny classes C, FORALL assignments of M targets to
      members of C, EXISTS a computation of total cost sqrt(M*N) + O(L*ell^3) +
      O(M*L*ell) recovering all M logs. And, for the closure half: FORALL such
      computations, the total is Omega~(sqrt(M*N)) because the post-pullback
      problem is generic.
      The DANGEROUS weaker reading, NOT claimed: FORALL M EXISTS an assignment
      for which the cost is low -- letting the adversary choose where the targets
      sit, which is not the adversary's choice. The audit obligation is that the
      target assignment is quantified BEFORE the algorithm.
    method_ceiling:
      strongest_certifiable_claim: >-
        "M targets spread over one F_p-isogeny class cost sqrt(M*N) plus an
        additive transport term, which is the same as M targets on one curve."
        It can NEVER certify anything below sqrt(M*N) without contradicting
        KN-LIT-4091's reported generic bound, and it says nothing about
        preprocessing-augmented schemes, which are section (D)'s separate and
        open question.
      nearby_object_control: >-
        M targets on M curves of the same order N in DIFFERENT classes. The
        method must FAIL there: no pullback exists, the cost must revert to
        M*sqrt(N), and any arm reporting sqrt(M*N) for non-isogenous curves has
        an implementation leak and voids the run set.
    proof_obligations:
      - claim: The dual pullback preserves k and maps into G.
        responsibility: correctness
      - claim: A distinguished-point store is not shareable across curves without transport.
        responsibility: correctness
      - claim: Post-pullback, the M-instance problem is generic and Theta(sqrt(M*N)) applies.
        responsibility: soundness
      - claim: Measured multi-target cost scales as M^{0.5 +/- 0.05} on one curve.
        responsibility: baseline
      - claim: The mu sweep interpolates as predicted between the two baselines.
        responsibility: soundness
      - claim: All comparisons are additionally reported in the AT product.
        responsibility: scope

  predictions:
    - metric: fitted exponent of M in same-curve multi-target rho total cost
      direction: different
      minimum_effect: >-
        0.50 +/- 0.05 over M in {1..32}. Outside that band the baseline
        implementation is wrong and nothing downstream may be compared to it.
    - metric: ratio (transported cross-curve total) / (same-curve multi-target total)
      direction: different
      minimum_effect: >-
        In [1.0, 1.2] -- a TIE plus the additive pullback overhead. A ratio below
        0.9 would mean transport beats same-curve sharing, which contradicts
        section (C) and requires review-breakthrough scrutiny (AGENTS.md rule 12)
        rather than promotion. A ratio above 2 means the pullback overhead is not
        negligible at toy scale, which is expected and must be reported.
    - metric: ratio (transported cross-curve total) / (naive per-curve total)
      direction: lower
      minimum_effect: >-
        ~1/sqrt(M), i.e. 0.18 at M = 32. This is the record's only positive
        number and it is an improvement over the WRONG baseline, stated as such.
    - metric: cross-curve store-sharing collision rate without transport (Step 3)
      direction: lower
      minimum_effect: >-
        At chance. A rate above chance would mean distinguished points transfer
        across curves without a map, contradicting the Class II analysis of
        IDEA-20260807-e0ddc6 and requiring independent replication.
    - metric: total cost of the preprocessed multi-target scheme at S = N^{1/3}
      direction: different
      minimum_effect: >-
        Consistent with 2*M^{1/2}*N^{1/3} within a factor 2 over the tested M
        ladder, with peak memory measured and reported. A fit consistent instead
        with M^{1/2}*N^{1/2} means the store growth is not happening and heuristic
        H1 is refuted.
    - metric: AT product of the preprocessed scheme versus Kuhn-Struik
      direction: different
      minimum_effect: >-
        Reported for every cell. PREDICTION: the N^{1/6} time advantage does NOT
        survive AT accounting once the M*N^{1/3} store is charged as occupied
        hardware, by the same mechanism that gives BSGS N^{2/3+o(1)} full cost
        (KN-TECH-035). If it DOES survive, that is the most interesting outcome
        available in this record and requires independent review.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): the reduction in (B) and the closure argument in
      (C), written out. If a reviewer breaks (C), the lane has a target and the
      experiment changes.
      STAGE 1 (minutes, THE CHEAPEST VALID DISCRIMINATOR): Step 1's same-curve M
      ladder at one toy prime. Fitting 0.5 +/- 0.05 versus 1.0 settles in seconds
      whether the harness has the right baseline at all, and a program that
      cannot reproduce sqrt(M*N) has no business scoring an amortisation claim.
      STAGE 2 (minutes): Step 3, the failed direction. Cross-curve store sharing
      must produce chance collisions.
      STAGE 3 (low hours): Steps 2, 4, 5 -- the full three-way comparison and the
      mu decay sweep.
      STAGE 4 (hours): Step 6's S sweep and Step 7's AT accounting.
    controls:
      - matched single-target rho at M = 1 (baseline reproduction)
      - cross-curve store sharing without transport (the failed direction)
      - M curves of the same order in different classes (nearby-object control)
      - randomly populated store of identical size
      - mu decay sweep between the two baselines
      - certificates on every recovered k against the ORIGINAL instance
    required_metrics:
      - total and per-target group operations per arm per M
      - field operations for pullback, counted separately from group operations
      - peak store size in entries and bytes, per arm
      - fitted exponent of M with confidence interval, per arm
      - AT product per arm per cell
      - collision counts in the failed-direction arm against the chance rate
      - wall clock and peak memory per run

  falsification_conditions:
    - >-
      The same-curve multi-target fit is not 0.5 +/- 0.05. The baseline is wrong
      and the record's entire comparison is void until it is fixed. This is an
      instrument outcome, not a mathematical one.
    - >-
      The transported cross-curve arm beats the same-curve arm by more than 10%.
      Section (C) is false, the class supplies post-pullback structure, and the
      result requires review-breakthrough review (AGENTS.md rule 12).
    - >-
      Cross-curve store sharing produces above-chance collisions without
      transport. Contradicts the Class II analysis; requires replication before
      any interpretation.
    - >-
      The mu sweep does not interpolate between sqrt(M*N) and M*sqrt(N). The
      measured saving is not attributable to the pullback and the arm is void.
    - >-
      The preprocessed scheme's M-dependence fits M^{1/2}*N^{1/2} rather than
      M^{1/2}*N^{1/3}. Heuristic H1 (store growth) is refuted; section (D)'s open
      question changes shape and the record says so rather than retro-fitting.
    - >-
      Budget exhaustion before the M ladder completes. INFRASTRUCTURE outcome
      (AGENTS.md rule 5); not evidence about any baseline.

  confounders:
    - >-
      SMALL-M INDISTINGUISHABILITY. At M = 4, sqrt(M*N) and M*sqrt(N) differ by
      only a factor 2. The full ladder to M = 32 and enough seeds are required
      or the two hypotheses are not separable.
    - >-
      DISTINGUISHED-POINT RATE. The store's growth and the collision rate both
      depend on theta, the DP rate. theta must be frozen before Stage 1 and held
      identical across arms; a per-arm theta silently changes the memory axis.
    - >-
      FRUITLESS CYCLES under negation. Negation-based speedups introduce
      fruitless cycles whose handling differs between single- and multi-target
      walks. Either use negation everywhere or nowhere, declared in advance.
    - >-
      PULLBACK OVERHEAD AT TOY SCALE. O(L*ell^3) field operations is negligible
      at p = 2^{256} and NOT negligible at p = 2^{16}. Toy measurements will show
      the transported arm losing on absolute cost; that is a scale artifact and
      must not be reported as a finding about the reduction.
    - >-
      Group operations versus field operations. As in IDEA-20260807-a127ab, a
      measured per-machine conversion factor is required and every conclusion
      must survive a factor-2 perturbation of it.

  interpretation_limits:
    - >-
      The only positive number here is against a baseline the corpus has already
      recorded as wrong. Against the correct baseline the delta is exactly zero,
      and any summary that quotes the sqrt(M) figure without naming M*sqrt(N) as
      its denominator is mis-scoring the result in precisely the way
      claim_a_adjudication.md section 5 warns about.
    - >-
      Section (D)'s open question is a SINGLE-CURVE question. Nothing in L13
      helps with it and this record does not claim it as a lane result.
    - >-
      Section (C)'s closure leans on KN-LIT-4091, an unverified bulk-seeded
      entry. Before this closure could be promoted, that citation must be
      verified against the primary source.
    - >-
      Toy scale, claim_tier: toy. Nothing here bears on any deployed curve, and
      the threat model itself may be empty (IDEA-20260807-e41559).

  heuristic_assumptions:
    - id: H1
      statement: >-
        STORE-GROWTH HEURISTIC. In a distinguished-point multi-target
        computation seeded with S known-log distinguished points, the expected
        cost of the j-th target is T_j = c*sqrt(N/(S + sum_{i<j} T_i * theta)),
        with c an absolute constant and theta the DP rate; consequently at
        S = N^{1/3} the total over M targets is Theta(M^{1/2}*N^{1/3}) with peak
        store Theta(M*N^{1/3}).
      rigorous_support: >-
        The per-target relation T = sqrt(N/S) is the rigorous birthday
        computation for a walk hitting one of S marked points in a group of order
        N, and it is exactly the relation that produces the Bernstein-Lange
        S*T^2 ~ N operating point and the Corrigan-Gibbs--Kogan frontier
        (KN-LIT-013, KN-TECH-005). What is HEURISTIC is the independence of the
        successive walks and the treatment of newly stored points as if they were
        uniformly distributed marked points -- the classical distribution theorem
        it imitates is the birthday/coupon behaviour of a random function on the
        group, which is the same idealisation that underwrites the 0.886 constant
        in rho (KN-TECH-006) and is measured to hold for well-chosen r-adding
        walks (Teske). H1 is refutable on its own terms by the M-dependence fit.
      validation_plan: >-
        Sample: total cost and peak store for M in {1, 2, 4, 8, 16, 32} and S in
        {0, N^{1/4}, N^{1/3}, N^{2/5}} at p in {2^{16}, 2^{20}, 2^{24}}, 5 seeds
        per cell. Predicted distribution: total cost proportional to
        M^{1/2}*N^{1/3} at S = N^{1/3} and to M^{1/2}*N^{1/2} at S = 0. Tail
        check: the largest single-target cost in each cell, against the
        exponential tail the birthday model predicts, since a heavy tail would
        indicate walk-quality failure rather than a store effect. Comparison
        against the S = 0 arm on the identical pipeline isolates the store's
        contribution from the walk's. TOY SCALE ONLY AND LABELLED SO; H1 is NOT
        validated at cryptographic scale by anything in this proposal.

  reachability_gate: >-
    T5 INSTANTIATED. The pullback requires a path from each target's curve E_j to
    the chosen hub E_1 -- SPECIFIED endpoints, hence vectorization, hence
    p^{1/4+o(1)} field operations per distinct source curve (see heuristic H1 of
    IDEA-20260807-a127ab for the argument and its concrete-versus-asymptotic
    split). The gate's position here is BETTER than in the preprocessing record,
    for a reason worth stating: the multi-target computation already costs
    sqrt(M*N) >= N^{1/2}, and path-finding costs M*p^{1/4+o(1)}, so path-finding
    is dominated whenever M*p^{1/4} < sqrt(M*N), i.e. whenever M < N^{1/2} --
    which is every regime in which the multi-target problem is even posed. THE
    GATE IS NOT BINDING FOR THIS RECORD, asymptotically or concretely, which is
    the opposite of the preprocessing case and is a genuine structural
    difference between the two halves of L13. At toy scale the class is fully
    enumerable and paths are found by breadth-first search.

  target_complexity:
    time_exponent: >-
      1/2 in N and 1/2 in M -- i.e. total sqrt(M*N), IDENTICAL to Kuhn-Struik.
      No exponent moves. The additive transport term is O(L*ell^3 + M*L*ell)
      field operations, o(1) relative to the total for ell = polylog(p).
      For the section (D) preprocessed variant: 1/3 in N and 1/2 in M under
      heuristic H1, i.e. M^{1/2}*N^{1/3} -- an N^{1/6} time gain purchased with
      an M*N^{1/3} memory cost, and NOT claimed until Step 7's AT accounting.
    memory_exponent: >-
      Advice-free arm: the DP store, O(theta*sqrt(M*N)) entries, tunable down at
      the cost of walk length -- the standard van Oorschot-Wiener trade
      (KN-TECH-006). Preprocessed arm: M*N^{1/3} entries, which is the axis on
      which it is expected to lose.
    best_known: >-
      Kuhn-Struik multi-target rho at sqrt(M*N) with small per-processor memory,
      with a tight generic lower bound of the same order reported in KN-LIT-4091.
      Single target: parallel rho at 0.886*sqrt(N), O(1) memory (KN-TECH-001,
      KN-TECH-006), automorphism-discounted by at most sqrt(6) (KN-TECH-018).
      BSGS at sqrt(N) time and memory, N^{2/3+o(1)} full cost (KN-TECH-031,
      KN-TECH-035). With advice: Bernstein-Lange at S = T = N^{1/3} on the
      Corrigan-Gibbs--Kogan frontier (KN-LIT-013, KN-TECH-005).
      THIS RECORD TIES THE FIRST ROW AND BEATS NONE.
    hidden_overhead: >-
      Three disclosures. (1) The additive O(L*ell^3) pullback term is invisible
      asymptotically and dominant at toy scale, so every toy measurement will
      understate the reduction. (2) Section (D)'s N^{1/6} time gain hides an
      M*N^{1/3} memory cost that AT accounting is expected to eat entirely.
      (3) The closure in (C) rests on an unverified citation.
    tradeoff_note: >-
      The advice-free arm moves ALONG the known multi-target curve and off it
      nowhere -- stated plainly, since a tradeoff that merely reaches a known
      frontier is not an improvement. The preprocessed arm of section (D) is a
      genuine time-memory trade and is the only place in this lane where a new
      point on a frontier might exist; it is a SINGLE-CURVE question.
      Parallelization: the advice-free arm is van Oorschot-Wiener parallel with
      near-linear speedup and small per-processor storage; the preprocessed arm
      shares one large store and is therefore memory-bandwidth bound, which is
      the concrete form the AT penalty takes.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES.
    - Kuhn-Struik multi-target rho, sqrt(M*N) time, small per-processor memory:
      TIES this record's advice-free arm on time and DOMINATES it on total cost,
      because this record adds an O(L*ell^3) pullback term and buys nothing for
      it. This is the binding row.
    - KN-LIT-4091's reported tight generic Theta(sqrt(M*N)): this record sits ON
      it, not below it.
    - Parallel rho, 0.886*sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006):
      dominates on memory at every M; dominated on total time for M > 1, which
      is Kuhn-Struik's point and not this record's.
    - Automorphism-discounted rho on CM curves (KN-TECH-018): a further constant
      <= sqrt(6) that applies to every arm equally.
    - BSGS at sqrt(N)/sqrt(N), full cost N^{2/3+o(1)} (KN-TECH-031, KN-TECH-035):
      dominated by every arm here on time for M < N; dominates on nothing.
    - Bernstein-Lange preprocessing at S = T = N^{1/3}: dominates this record's
      advice-free arm on time whenever M < N^{1/3} (since M*N^{1/3} < sqrt(M*N)
      exactly when M < N^{1/3}) and is dominated by it for M > N^{1/3}. THE
      CROSSOVER IS AT M = N^{1/3} AND IT IS THE MOST USEFUL NUMBER IN THIS
      RECORD.
    NOT DOMINATED: nothing. Every arm here is on or above an existing frontier
    row.
  sota_delta: >-
    ZERO against the correct baseline, quantitatively: total sqrt(M*N) versus
    Kuhn-Struik's sqrt(M*N), i.e. a ratio of 1 plus an additive O(L*ell^3)
    penalty. Against the INCORRECT per-curve baseline M*sqrt(N) the ratio is
    1/sqrt(M) (0.18 at M = 32), and that number is reported only with its
    denominator named. The one genuinely quantitative new statement is the
    crossover M = N^{1/3} between preprocessing (M*N^{1/3}) and multi-target rho
    (sqrt(M*N)), and the section (D) conjecture M^{1/2}*N^{1/3} at M*N^{1/3}
    memory, which is a single-curve claim, is conditional on heuristic H1, and is
    not claimed as an improvement until AT accounting is applied.

