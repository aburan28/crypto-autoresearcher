  claim: >-
    For the repository's folded pair-state index calculus (a table of #states
    folded pair sums of base representatives, probed until the walked target
    equals a stored state), at every size measured so far and at n=83:
    (1) probes per target = r/(A*#states) within 15% (A = 2n signed-Frobenius
    classes); (2) at equal precomputation TIME P, IC_online/BL_online =
    c_probe*c_state/(2.1*c_step^2) +- a factor 3, where c_probe is the
    measured ns per probe, c_state the setup time per table state, c_step the
    ns per walk step of the tuned reference, and 2.1 = 1.77*1.2 is the BL
    constant; (3) the ratio is independent of r (slope of ln ratio on ln r in
    [-0.15, 0.15] over 2^36.6..2^47.2) and of A (an ordinary binary curve with
    A = 2 at the same r gives the same ratio within the price differences);
    (4) the 2.0-8.0x of section 23 and the 235x of the n=83 BL arm are both
    reproduced by (2) from each size's own prices, so the n=83 jump is the
    growth of c_probe (8 GiB table: TLB + DRAM) and c_state (wide-field build),
    not of r.
  mechanism: >-
    BL (KR-RHO-ea34b8): table T, precomputation ~1.2 T^2 steps, online ~1.77 T
    steps, so online ~ 2.1*(r/A)/P_steps on the quotient of size r/A. IC: a
    probe on the quotient hits a stored state with probability A*#states/r
    (every state represents A sums), so probes per target = r/(A*#states);
    P_IC = #states*c_state; online = probes*c_probe. Equating P in time and
    dividing (notes.md) gives the ratio in the claim; A and r cancel. BSGS on
    the quotient with a T-entry table has online (r/A)/T lookups: identical to
    IC with #states = T. The IC differs from BSGS only in (a) how an entry is
    generated (a sum of two base representatives plus canonicalization, cost
    c_state, versus one stride addition) and (b) memory #states = P/c_state
    versus BL's sqrt(P/1.2). So the m=2 lane lives on the BSGS/BL law with a
    worse constant on time and a worse exponent on memory; its measured online
    wins over one-target rho (8.8-17.5x, 12.9-13.9x, now 0.99x at n=83) are
    the precomputation budget, as section 23.5 already suspected from a model.
    Back-of-envelope at n=83 (notes.md): c_probe ~ 3.7e2 ns if the 63.3 ms
    K1798 point had the panel-mean probe count, c_state ~ 555 s / 2^28 ~ 2.1
    us, c_step ~ 40 ns (Fold/64/DP6, to be read from the BL-arm receipts):
    370*2100/(2.1*1600) = 231 against the measured 235. Consistent, not
    confirmed: two of the three prices are inferred, not read.
