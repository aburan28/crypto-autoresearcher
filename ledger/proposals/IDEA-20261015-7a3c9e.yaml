  falsification_conditions:
    - prediction 1 outside [0.7, 1.3] at any size: the probe model is wrong (the table is not a pair-state set probed by equality, or the walk is not memoryless)
    - slope > 0.25: the deficit grows with r; the law as stated is false (the lane is then closed by a different mechanism, which must be recorded as such, not as a confirmation)
    - formula off by more than 10x at any size: the law is wrong
    - Koblitz and ordinary ratios differ by more than 10x at equal r and P: A does not cancel, so folding buys probes, contradicting the probe model
  confounders:
