idea:
  id: IDEA-20260808-b1358c
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HAWK-001
  goal_id: GOAL-HAWK-001
  title: Q(zeta_2n) has THREE order-2 Galois involutions and the published module-LIP cryptanalysis
    has used two of them one at a time; build the cocycle lattice of the third (sigma_{n-1})
    and the JOINT stabiliser of two, and test whether the exact-SVP dimension falls from n/2+1
    to about n/4.
  class: algorithm
  claim: 'For HAWK-n over R_n = Z[X]/(X^n+1), n = 2^{l-1}: (A) the involution sigma_{n-1}
    : zeta -> -zeta^{-1}, which is neither complex conjugation c (used by prior module-LIP
    work) nor tau : zeta -> -zeta (used by Straznickas-Weis, KN-LIT-7592), yields a publicly
    computable cocycle lattice Lambda_B^{(sigma_{n-1})} = {V in M_2(R_n) : V* Q V = sigma_{n-1}(Q),
    sigma_{n-1}(V) V = I}, and (B) the simultaneous constraint from any two of the three involutions
    determines B up to SL_2 of the fixed ring of the full Klein four-group <c, tau>, which
    is an order in a field of degree n/4. CLAIM: either (B) is realisable as a lattice problem
    whose exact-SVP calls have dimension n/4 + O(1) — halving the exponent of KN-LIT-7592''s
    reduction again, from 2^{0.292(n/2)} to 2^{0.292(n/4)} — or there is a NAMED obstruction,
    and the obstruction is that the joint constraint set fails to be near-hypercubic (Ducas
    block reduction [Duc23] does not apply) rather than that it fails to be a lattice.'
  mechanism: 'Gal(Q(zeta_{2^l})/Q) = (Z/2^l)^* = Z/2 x Z/2^{l-2} contains exactly three elements
    of order 2, namely a = -1, a = 2^{l-1}+1 = n+1 and a = 2^{l-1}-1 = n-1. Their fixed fields
    are respectively the totally real subfield K^+, the smaller cyclotomic Q(zeta_n), and
    (for l = 3, as a sanity anchor) Q(sqrt(-2)). KN-LIT-7592''s engine is: for an involution
    sigma, the cocycle V_sigma = B^{-1} sigma(B) satisfies TWO public conditions — the transport
    condition V* Q V = sigma(Q), which is quadratic but has PUBLIC coefficients because Q
    = B*B is the public key, and the involution condition sigma(V) V = I, which for order
    2 LINEARISES the transport condition over Q. That linearisation is exactly why order 2
    is special and why conductors with cyclic (Z/m)^* evade the attack. The linearisation
    argument is generic in sigma: it uses only sigma^2 = id. So the sigma_{n-1}-cocycle lattice
    EXISTS by the same lemma, and the only open quantities are its rank and its SHAPE. Shape
    is what carries the exponent: KN-LIT-7592 gets n/2+1 not from the rank of Lambda_B^{(tau)}
    (which is n) but from Proposition 4.5, an isometry to the near-hypercubic sqrt(n/4) Z^{n/2+1}
    (+) sqrt(n/2) Z^{n/2-1}, on which Ducas block reduction recovers all shortest vectors
    with SVP calls in dimension n/2+1. So the correct question for the third involution is
    not "is there a cocycle" but "does its Gram matrix admit an orthogonal splitting with
    a large hypercubic factor". Independently, the JOINT construction: B is determined by
    its image in SL_2(R_n)/SL_2(R_n^{sigma}) for each sigma; the intersection of two such
    quotients is SL_2 over the fixed ring of <c, tau>, whose fraction field has degree n/4
    over Q. If the two cocycle constraints can be imposed on ONE lattice (they are constraints
    on the same unknown B), the residual freedom is a rank-2 module over a degree-n/4 ring,
    i.e. a Z-lattice of rank n/2 whose shortest vectors would be recoverable by Ducas block
    reduction with SVP calls in dimension about n/4 if the near-hypercubic shape survives.'
  why_not_a_renamed_known_approach: 'Nearest known method: KN-LIT-7592 (Straznickas-Weis)
    itself, which uses exactly ONE involution, tau. The difference is not "use a different
    letter": (i) sigma_{n-1} = c tau has a DIFFERENT fixed field from both c and tau, so its
    cocycle lattice is cut out by a different linear system and its Gram matrix is a different
    integer matrix — this is a new object, not a change of coordinates; (ii) the joint construction
    is not any single-involution attack because it imposes two independent transport conditions
    simultaneously, and the residual symmetry group it leaves is strictly smaller (SL_2 over
    a degree-n/4 ring rather than a degree-n/2 ring). The corpus itself records the methodological
    lesson that licenses this — KN-LIT-7592''s entry states the engine is "the object hiding
    the secret admits more than one order-2 symmetry, and the whole prior literature used
    only one of them", and adds "a symmetry being well known to exist is not the same as its
    consequences having been worked out". There are three; two have been used, separately.'
  predictions:
  - observable: Gram matrix G_3 of the sigma_{n-1}-cocycle lattice, built by exact integer
      linear algebra at n = 8, 16, 32 from a randomly sampled HAWK-shaped B in SL_2(R_n) and
      its public Q = B*B.
    metric: 'Orthogonal-splitting profile: the multiset of diagonal entries of G_3 after exact
      LLL, and the number of index pairs (i,j) with G_3[i][j] != 0 after a canonical permutation;
      plus the ratio (number of vectors of minimal norm) / (2 * rank), which equals 1 exactly
      for a hypercubic lattice.'
    predicted: Trichotomy, all three outcomes informative. (P1) G_3 is near-hypercubic with
      a factor of rank >= n/2 — then the third involution reproduces the KN-LIT-7592 dimension
      and is a redundant route. (P2) G_3 is near-hypercubic with a LARGER hypercubic factor
      or splits into blocks of rank <= n/4 — exponent moves. (P3) G_3 has no orthogonal splitting
      and minimal-vector count 2*rank is not attained — the third involution is obstructed
      and the reason is recorded.
  - observable: Rank and minimal-vector structure of the JOINT constraint lattice Lambda_B^{(c)}
      intersect Lambda_B^{(tau)} realised as a single integer kernel computation at n = 8,
      16, 32.
    metric: rank(joint) and, if the joint object is a lattice of rank r, the dimension of
      the largest hypercubic orthogonal summand, reported as a fraction of n.
    predicted: rank(joint) approximately n/2 and largest hypercubic summand approximately
      n/4 + O(1) if the mechanism works; rank(joint) = 0 or 1 (over-determined, the two constraints
      intersect trivially and carry no secret) is the canonical failure and is the outcome
      I weight most heavily.
  - observable: Certified key recovery at n = 8, 16, 32 using whichever route the first two
      observables select, with the recovered B' checked against the true B by verifying B'*
      B' = Q and B' in SL_2(R_n).
    metric: Boolean certificate plus the exact SVP dimension actually used, reported as a
      fraction of n.
    predicted: Recovery at dimension fraction 1/2 reproduces KN-LIT-7592 (a REQUIRED baseline
      reproduction, not a result); recovery at fraction 1/4 is the claim; failure to recover
      at any fraction is a defect of the reimplementation and not evidence about HAWK.
  minimal_test: 'Zero-cryptography, exact-integer, n <= 32 only. (1) Sample B in SL_2(R_n)
    with short entries by the declared HAWK-shaped procedure; form Q = B*B over Z. (2) For
    each of the three involutions sigma in {c, tau, c tau}, write the linear system on V in
    M_2(R_n) obtained by combining V* Q V = sigma(Q) with sigma(V) V = I under the KN-LIT-7592
    linearisation, solve it exactly over Z, and output the Gram matrix of the resulting lattice.
    (3) LLL each Gram matrix exactly (no floating point), record the diagonal profile, the
    off-diagonal support, and the minimal-vector count. (4) Form the joint kernel of the c
    and tau systems and repeat (3). (5) BASELINE REPRODUCTION GATE, run first: the tau system
    must reproduce KN-LIT-7592''s Proposition 4.5 shape sqrt(n/4) Z^{n/2+1} (+) sqrt(n/2)
    Z^{n/2-1} at every tested n. If it does not, the implementation is wrong and NOTHING else
    in the run is interpretable.'
  controls:
  - 'BASELINE CONTROL (gating): the tau-cocycle lattice must reproduce the published near-hypercubic
    shape exactly at n = 8, 16, 32. Any claim about sigma_{n-1} made without this gate passing
    is void.'
  - 'NULL OBJECT of the same shape: run the identical pipeline with Q replaced by B''* B''
    for a B'' sampled from SL_2(R_n) WITHOUT the HAWK shortness condition (entries drawn from
    a wide Gaussian). The cocycle lattice still exists (the construction never used shortness),
    so the near-hypercubic SHAPE must persist while the shortest vector stops being the secret.
    If the shape disappears for the null, the shape is being manufactured by the shortness
    of B and not by the Galois structure — that would be the artifact tell.'
  - 'CONDUCTOR CONTROL: repeat at a conductor m = 2p (p odd prime, cyclic (Z/m)^*) where KN-LIT-7592
    states the attack must fail for lack of a second involution. The construction must return
    an EMPTY or trivial constraint lattice there. A non-trivial lattice at a cyclic conductor
    falsifies my reading of the mechanism, not HAWK.'
  - 'PERMUTATION/ISOMETRY CONTROL: replace B by B U for U in SL_2(R_n^{sigma}); the cocycle
    V_sigma is invariant by construction, so the computed lattice must be bit-identical. A
    change means the implementation is tracking the basis rather than the cocycle.'
  confounders:
  - 'Small-n degeneracy: at n = 8 the fixed fields are quadratic and many lattices are accidentally
    hypercubic. A shape seen only at n = 8 is numerology. Require the shape to persist and
    to SCALE correctly (summand rank as a stated function of n) across n = 8, 16, 32.'
  - The linearisation of V* Q V = sigma(Q) may require a normalisation that differs between
    involutions (e.g. sigma acting non-trivially on the adjoint * used to define Q). A failed
    linearisation for sigma_{n-1} would look like an obstruction but would actually be an
    algebra error. The derivation must be written out symbolically for each sigma BEFORE any
    integer computation.
  - KN-LIT-7592's appendices are recorded in this corpus as UNREAD (its "Not verified here"
    section). The authors may already treat sigma_{n-1} and the joint descent in Appendix
    F or elsewhere. This is a prior-art risk, not a mathematical one, and it is why the record
    is `unverified`.
  falsification_conditions:
  - The sigma_{n-1} linear system has trivial solution space at n = 8, 16 and 32 — the third
    involution carries no cocycle. Kills (A).
  - The joint (c, tau) constraint has rank 0 or 1 solution space at all tested n — the two
    involutions over-determine B and no lattice remains. Kills (B), and this is the outcome
    I consider most likely.
  - The joint constraint lattice exists but its Gram matrix has no orthogonal summand of rank
    > O(1) after exact LLL at all tested n — Ducas block reduction does not apply, so no dimension
    reduction follows. Kills the exponent claim while leaving (A) alive as an object.
  - 'The baseline gate fails: the tau system does not reproduce Proposition 4.5''s shape.
    Then nothing is falsified and the run is an implementation failure (AGENTS.md rule 5),
    not evidence.'
  interpretation_limits: n <= 32 is TOY. HAWK's parameters are n = 512 and n = 1024. A shape
    observed at n <= 32 supports a claim about the shape's algebraic form only if it is accompanied
    by a symbolic derivation valid for all l; the numerical run is a check on the derivation,
    never a substitute for it. No cost claim about HAWK-512/1024 may be made from this run
    alone. This proposal asserts nothing about whether HAWK is broken; KN-OPEN-028's table
    is unchanged by it.
  assumptions:
  - 'HAWK-n''s secret key is a short B in SL_2(R_n) and the public key is Q = B*B, as recorded
    in KN-LIT-7592 (corpus, `citation_verified: read`).'
  - The KN-LIT-7592 linearisation of the transport condition uses only sigma^2 = id and the
    publicness of Q. THIS IS MY READING of the corpus entry's summary of Lemmas 4.1 and 4.3,
    which the corpus records as NOT independently verified. The symbolic derivation in the
    minimal test's step (2) is what discharges it; if it fails, the whole proposal fails at
    zero compute, which is the point of putting it first.
  - Ducas block reduction [Duc23] recovers all shortest vectors of a near-hypercubic lattice
    with SVP calls in half its rank, as cited by KN-LIT-7592. Not verified in this corpus.
  heuristic_assumptions:
  - id: HA-1
    statement: For B sampled by HAWK keygen at ring degree n, the Gram matrix of the joint
      (c, tau) constraint lattice, if of positive rank r(n), is isometric to a lattice of
      the form s_1 Z^{a(n)} (+) s_2 Z^{r(n)-a(n)} with a(n) = n/4 + O(1) and s_1, s_2 rational
      multiples of sqrt(n), uniformly in l >= 4.
    rigorous_ingredient: 'KN-LIT-7592 Proposition 4.5 (as reported): the SINGLE-involution
      tau cocycle lattice is PROVED isometric to sqrt(n/4) Z^{n/2+1} (+) sqrt(n/2) Z^{n/2-1}.
      That is a proved statement of exactly this shape for the one-involution case; HA-1 asserts
      the analogue for the two-involution case and is the only place a leap is taken.'
    distribution_imitated: 'Not a distribution theorem but a STRUCTURE theorem analogue: HA-1
      imitates the empirical regularity that constraint lattices cut out by Galois descent
      in a cyclotomic tower inherit the orthogonal-splitting shape of the tower''s successive
      quadratic subfields, exactly as the trace form of Q(zeta_{2^l}) over its quadratic subfields
      is diagonal in the standard power basis. The honest label is: a structural conjecture
      with one proved instance, not a random-model heuristic.'
    validation_route: Exact integer computation of the joint Gram matrix at n = 8, 16, 32,
      64 (64 is reachable because the object is a kernel of a linear system of size O(n^2),
      not a lattice reduction at cryptographic size), with the fitted a(n) compared against
      the predicted n/4 + O(1) by exact rational regression on four points. TOY SCALE, LABELLED
      AS SUCH. There is no correspondence available that samples this object at n = 512, and
      I do not claim one.
    tail_checks: Report the FULL diagonal profile, not a summary statistic, so that a near-miss
      (one summand of rank n/4 plus an irreducible remainder of rank n/4) is distinguishable
      from a clean split. Report the minimal-vector count against 2*rank; a hypercubic lattice
      attains equality exactly, so any deficit is a quantitative measure of how far the "near"
      in near-hypercubic has to stretch.
  - id: HA-2
    statement: The two constraint systems (from c and from tau) are not identical after the
      linearisation — formally, the Q-span of the c-system's rows and that of the tau-system's
      rows intersect in a subspace of codimension at least n/4 in each.
    rigorous_ingredient: c and tau generate a Klein four-group and have distinct fixed fields
      (K^+ and Q(zeta_n) are distinct subfields of degree n/2), so the two descent data are
      formally independent. This is a fact about the Galois group, not a heuristic.
    distribution_imitated: 'Genericity: a pair of linear systems derived from independent
      group elements behaves like a pair of generic subspaces of the same dimensions. The
      classical analogue is the expected intersection dimension of two generic subspaces.'
    validation_route: Exact rank computation of the stacked system at n = 8, 16, 32, 64, with
      the observed codimension compared against the generic prediction. This is a rank computation
      and costs seconds.
    tail_checks: If the stacked rank equals the individual rank at every n, the systems are
      equivalent and HA-2 is false — report that immediately, because it kills the joint route
      by itself at zero further cost.
  target_complexity:
    time_exponent: 'Claimed target: exact-SVP calls in dimension n/4 + O(1), i.e. 2^{0.292
      (n/4) + o(n)} under the BDGL sieve exponent, times poly(n) oracle calls. Against KN-LIT-7592''s
      2^{0.292 (n/2) + o(n)} this is a SQUARE-ROOT of the incumbent''s cost in the sieve exponent.
      Against HAWK''s own designed cost this would be a fourth root of the original 2n-dimensional
      problem.'
    memory_exponent: 2^{0.2075 (n/4) + o(n)} under BDGL, i.e. the same square-root improvement
      applies to memory. No polynomial-memory variant is claimed; the SVP oracle is the memory
      sink and Ducas block reduction does not change that.
    best_known_baseline: 'KN-LIT-7592 Theorem 6.1: poly(n) exact-SVP calls in dimension at
      most n/2 + 1, reported by its authors as lowering HAWK-512 key recovery from 2^150 to
      at most 2^108 and HAWK-1024 from 2^288 to at most 2^182 in the HAWK specification''s
      own gate-count model. Those figures are RELAYED, recorded in this corpus as not independently
      checked.'
    hidden_overhead_disclosure: The poly(n) in the oracle-call count is O(n^2 log n) for the
      single-involution route as reported; the joint route's call count is UNDERIVED and could
      be larger. The o(n) in the sieve exponent hides the usual BDGL subexponential factor,
      which at n/4 = 128 (HAWK-512) is a LARGER relative overhead than at n/2 = 257, because
      the additive practical offset does not shrink with dimension. At these dimensions the
      asymptotic exponent is not the dominant term and the concrete-cost table must be built
      before any HAWK-512 claim.
    time_memory_tradeoff: Dimension n/4 = 128 for HAWK-512 is inside the range where enumeration
      with extreme pruning is competitive with sieving at bounded memory, so the relevant
      frontier is not the sieve point alone. van Oorschot-Wiener does not apply (this is not
      a claw search). Report both the sieve point and the pruned-enumeration point, and state
      which binds under a declared memory cap. Parallelisation is embarrassing across the
      poly(n) independent oracle calls.
  sota_delta: 'IF the joint route exists AND is near-hypercubic: exponent 0.292(n/2) -> 0.292(n/4),
    i.e. HAWK-512 key recovery from the relayed 2^108 to a figure requiring its own gate-count
    derivation but of order 2^{0.292*128 + overhead}. IF ONLY the third-involution route exists
    and reproduces n/2: sota_delta is ZERO and the contribution is a redundancy result plus
    a corrected scope statement ("all three involutions give the same dimension"), which is
    worth recording and is not an advance. IF neither: sota_delta is zero and the contribution
    is a named obstruction. I state all three because two of the three are more likely than
    the first.'
  dominated_by: 'For the (A) branch alone (third involution reproducing n/2+1): DOMINATED
    by KN-LIT-7592 Theorem 6.1 exactly, in time, memory and queries — it would be a second
    route to the same frontier point. For the (B) branch: I checked the four rows of the live
    HAWK frontier recorded in KN-OPEN-028 — Straznickas-Weis (unconditional, 2^{(n/2+1)+o(n)}),
    nrd-PIP/Guessing Game (Heuristic 4 failed, cost super-polynomial and underived), definite/indefinite
    LIP KN-LIT-7648 (reports HAWK unaffected), and the SLIP in AM ^ coAM ceiling KN-LIT-7671.
    No row dominates a working n/4 route on time or memory; the KN-LIT-7671 row is a complexity-class
    statement and does not price anything, so it cannot dominate. `dominated_by: null` for
    branch (B) IS therefore claimed, on the basis of that four-row check and on nothing else
    — and it is only as good as KN-OPEN-028''s completeness, which is a corpus artifact rather
    than a survey of the field.'
  estimated_cost: 'Implementation: medium. Exact integer linear algebra over Z[X]/(X^n+1)
    at n <= 64, plus exact LLL. No sieve, no floating point, no Sage requirement (the cocycle
    systems are integer kernels). Roughly 400-700 lines. Compute: low. Minutes to low hours
    on one core; the largest object is an O(n^2) x O(n^2) integer matrix at n = 64.'
  recommended_priority: high
  honest_prior_of_survival: P(third involution yields a non-trivial cocycle lattice) ~ 0.7
    — the linearisation argument is generic in sigma and I see no reason it should fail, but
    I have not read the lemma. P(that lattice is near-hypercubic with a summand strictly larger
    than n/2) ~ 0.10. P(the JOINT construction leaves a positive-rank lattice at all) ~ 0.25
    — my main worry is that imposing two transport conditions over-determines V and collapses
    the solution space, which is exactly what the rank check in HA-2 tests first and cheaply.
    P(the full n/4 exponent claim survives to a certified toy recovery) ~ 0.06. The reason
    to run it anyway is that the negative outcomes are cheap, arrive in the first hour, and
    each is a publishable-grade scope statement about the attack that the corpus currently
    records only as the authors' own claim.
  novelty_status: unverified
  novelty_screen: 'Corpus screened: /tmp/ideas-ctx/EXISTING_PROPOSALS.txt (all HAWK rows:
    IDEA-20260801-019, -20260805-128f35, -20260805-3a855d, -20260805-6eac55, -20260807-90479e),
    EXISTING_HYPOTHESES.txt (H-HAWK-a28be6, H-HAWK-c7a551), CATALOGUE_TITLES.txt (no HAWK
    entries), KNOWLEDGE_BARRIERS.txt (KN-OPEN-024, -027, -028), and in full: knowledge/literature/KN-LIT-7592.md
    and knowledge/open-problems/KN-OPEN-028.md. WEB SCREEN NOT PERFORMED — the search and
    fetch tools failed on every call this session. The specific prior-art risk is that KN-LIT-7592''s
    unread appendices already contain this; the corpus entry''s own "Not verified here" section
    states sections 3-9 and the appendices were not read. Resolving that costs one PDF read
    and must precede any dispatch.'
  discriminated_from: IDEA-20260805-128f35 quotes the same "more than one order-2 symmetry"
    sentence but proposes to AUDIT the disclosed engine; this proposal ENUMERATES the symmetry
    group, finds a third element neither paper uses, and proposes the joint construction —
    a different object and a different claim. IDEA-20260807-90479e re-costs the published
    n/2+1 reduction; it does not change the dimension. IDEA-20260805-6eac55 checks the load-bearing
    step without a sieve; it is a verification of the incumbent. H-HAWK-a28be6 censuses cyclotomic
    conductors for the EXISTENCE of a second involution (the evasion criterion); this proposal
    is about power-of-two conductors where all three exist and asks what the third and the
    pair do. H-HAWK-c7a551 works at m = 2^l with short B in SL_2(R_n) — closest record — but
    its object is the single published route reimplemented; mine adds two constraint systems
    that record does not construct.
  lossy_projection_test: 'PASSES, and here is the algebra. The tracked object is the cocycle
    V_sigma = B^{-1} sigma(B). The map B -> V_sigma is genuinely lossy: its fibre is the coset
    B * SL_2(R_n^{sigma}), a group of size exponential in n/2, so a whole subgroup''s worth
    of basis information is destroyed. What is discarded — the sigma-invariant part of B —
    is discarded COMPATIBLY with the target''s operations, because the transport condition
    V* Q V = sigma(Q) is written entirely in public data and is stable under exactly that
    coset: replacing B by B U with sigma(U) = U leaves V_sigma unchanged. So the retained
    part propagates deterministically under the scheme''s own algebra. For the JOINT object
    the fibre shrinks to B * SL_2(R_n^{<c,tau>}) — still positive-dimensional and still a
    group, so the joint object is also a lossy projection and not a change of coordinates.
    Contrast with a projection that would FAIL the test: tracking (Q, B) itself, or tracking
    B in a rotated basis, loses nothing.'
  proof_search_map:
    bottleneck: The exact-SVP dimension in KN-LIT-7592 Theorem 6.1. Everything else in that
      reduction is poly(n); the exponent lives entirely in the dimension of the SVP calls,
      which is n/2 + 1 because the tau-cocycle lattice has rank n and Ducas block reduction
      halves the rank of a near-hypercubic lattice.
    baseline_embedding:
      parameter_slice: Setting the second constraint system to the empty system recovers exactly
        KN-LIT-7592's construction. The proposal is therefore a strict family extension with
        the incumbent as an interior parameter point, and the baseline reproduction gate in
        the minimal test enforces it.
      reproduction_check: 'Frozen regression fixture: at n = 8, 16, 32, the tau-system Gram
        matrix must equal (up to unimodular change of basis, checked by canonical form) the
        published sqrt(n/4) Z^{n/2+1} (+) sqrt(n/2) Z^{n/2-1}.'
    observation_collision:
      observable: The orthogonal-splitting profile (multiset of squared minimal norms per
        summand) of the constraint lattice's Gram matrix.
      distinct_preimage_search: 'Two distinct preimages with the same observable are easy
        to exhibit and MUST be checked: B and B U for U in SL_2(R_n^{sigma}) give identical
        profiles by construction, and so does any B'' whose cocycle differs by an automorphism
        of the constraint lattice. Consequence: the profile alone NEVER certifies key recovery.
        Only the final check B''* B'' = Q does. This is why the certificate, not the profile,
        is the deliverable.'
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: The joint (c, tau) constraint lattice, a strictly finer invariant of
        B than either single cocycle lattice.
      predicted_gain: Residual symmetry group from SL_2 over a degree-n/2 ring down to SL_2
        over a degree-n/4 ring; SVP dimension n/2+1 -> n/4 + O(1).
    - transform: representation_reduction
      proposed_object: The sigma_{n-1}-cocycle lattice as an alternative representation of
        the same key-recovery problem.
      predicted_gain: 'Possibly none (redundant route). Included because a null here is a
        cheap, real scope statement: "all three involutions are equivalent".'
    quantifier_order: 'FOR ALL l >= 4 and FOR ALL B in SL_2(R_n) sampled by HAWK keygen (n
      = 2^{l-1}), THERE EXISTS an integer lattice L(Q), computable in poly(n) time from the
      public Q alone, and THERE EXISTS an orthogonal splitting of L(Q) with a hypercubic summand
      of rank a(n), such that ALL shortest vectors of L(Q) are recoverable by poly(n) exact-SVP
      calls in dimension a(n) + O(1), and the claim is a(n) = n/4 + O(1). Note the order:
      L is allowed to depend on Q (that is what makes it computable), but a(n) must NOT depend
      on B — a construction whose summand rank varies with the key is not a reduction.'
    method_ceiling:
      strongest_certifiable_claim: 'The strongest thing this method can certify is: "the joint
        constraint lattice at ring degree n has an orthogonal splitting with largest summand
        of rank a(n), for n in {8,16,32,64}, together with a symbolic derivation of a(n) valid
        for all l". It CANNOT certify anything about HAWK-512 cost; that requires the gate-count
        model and a concrete-cost table, which is a separate obligation.'
      nearby_object_control: 'The nearby object on which the desired conclusion must FAIL
        is the conductor m = 2p (p odd prime): (Z/m)^* is cyclic, there is exactly one involution,
        no second constraint exists, and the joint construction must return nothing. If the
        method "succeeds" there, the method is measuring an artifact of the implementation
