idea:
  id: IDEA-20261006-4b8f91
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Crossed (p, B) grid for prime-field S_3 solving degree: the degree
    moves with the factor-base cardinality, with the field, or with both
  class: measurement
  claim: >-
    On ordinary short-Weierstrass curves over prime fields, with m = 3 and
    a set-theoretic x-coordinate factor base of cardinality B, the grevlex
    solving degree d_solve of the Semaev system is a function of B alone,
    or it retains a field-size effect at fixed B. Representation class R1
    of RQ-ECDLP-623a32 (affine x-coordinates); attack stage is relation
    decomposition. On the grid p in {31, 61, 127} and B in {4, 6, 8}, the
    B-only explanation requires that, at each fixed B, the maximum of
    d_solve across the three primes equals the minimum. The field-size
    explanation requires that, at B = 6, that range is at least 1. If both
    the B-increment d_solve(B=8) - d_solve(B=4) at p = 127 and the
    fixed-B range are at least 1, neither pure explanation holds. This
    states no index-calculus advantage and does not move an exponent.
  mechanism: >-
    The tracked object is the integer d_solve of one S_3 decomposition
    ideal, paired with operation set Sigma equal to grevlex elimination of
    that ideal (the relation-decomposition stage). Sigma is not translation
    of the prime-order subgroup. Trichotomy class: coordinate-dependent.
    The system is written in the x-coordinates of a target and of B base
    points; d_solve is a function of that polynomial representation. Lossy
    projection, tested against Sigma: the observable discards coefficients
    and which monomials remain, and keeps only the highest degree the
    declared solver reaches. Many different ideals share one degree, so the
    projection is lossy. The discard is compatible with Sigma because the
    scaling law requested by RQ-SDEG-001 is a law for that integer, and the
    integer is invariant under continuing the same elimination once the
    degree has been attained. It is not a block system of the translation
    action, and it is not claimed to propagate under translation. F2
    (factor-base decomposition) is the component being measured, named as
    such, because the question is the cost of that component. The open
    number priced here is the pair (range of d_solve across p at fixed B,
    increment of d_solve across B at fixed p). The crossed grid is required
    because an index-calculus schedule sets B as a function of p, so a
    ladder in p alone cannot tell a base-cardinality law from a field-size
    law. The semi-regular expression in (m, B) is used only as a B-only
    comparator curve, not as a theorem about these systems.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_m has degree 2^{m-2} in each variable, hence degree 2 in each
        variable at m = 3, and using summation polynomials for factor-base
        decomposition is the index-calculus framework itself.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Under the statistical assumptions stated in that row, naive
        prime-field Semaev index calculus costs at least as much as generic
        algorithms. Used here only as the baseline that this measurement
        does not beat.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: KR-IC-0d2021
      provenance: internal
      claim: >-
        Degree-of-regularity and solving-degree predictions for affine
        semi-regular sequences have recent refinements. Used as a
        comparator class, not as a description of S_3.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-0d2021.yaml
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        The open problem is the growth of prime-field summation-polynomial
        solving degree with field bit size and with m. This idea separates
        bit size from the base cardinality that schedules usually tie to it.
      verified_by: knowledge/open-problems/KN-OPEN-002.md
    - ref: KN-LIT-0acb8c
      provenance: internal
      claim: >-
        Bibliographic summary only, as that file itself warns: a
        probabilistic Macaulay analysis bounds Groebner cost for
        sufficiently overdetermined random systems. The full text was not
        read. The random-system arm imitates that model and does not rely
        on the relayed polynomial-time bound.
      verified_by: knowledge/literature/KN-LIT-0acb8c.md
  assumptions:
    - >-
      Field equations x_i^p - x_i are omitted whenever p exceeds the
      Macaulay degree under test. The membership polynomial of the B
      x-coordinates, of degree B, is the base equation.
    - >-
      One monomial order (grevlex) and one solver are frozen. Order spread
      is a different, already proposed measurement.
    - >-
      Every counted degree comes from a run that terminates with a recorded
      basis or a recorded inconsistency. A timeout is infrastructure.
    - >-
      F2 is a component of the question, not a new decomposition method.
      No new factor base is proposed.
  predictions:
    - metric: >-
        d_solve(p=127, B=8) - d_solve(p=127, B=4), median over the two
        curves and eight targets per cell
      direction: higher
      minimum_effect: >-
        at least 1. A median increment of 0 falsifies "the degree moves
        with B" on this grid.
    - metric: >-
        max_p d_solve(p, B=6) - min_p d_solve(p, B=6), same median
      direction: different
      minimum_effect: >-
        0 under the B-only explanation; at least 1 under the field-size
        explanation. The reported integer selects the explanation.
  minimal_test:
    design: >-
      For each p in {31, 61, 127}, take the first two ordinary
      short-Weierstrass curves found by a declared search over small
      Weierstrass coefficients, skipping singular and supersingular
      reductions. For each B in {4, 6, 8}, draw B distinct rational
      x-coordinates of points from a recorded seed. Build the S_3 system
      in three variables plus the degree-B membership polynomial on each
      variable, for eight recorded targets per cell. Solve under grevlex
      with one declared solver. Record d_solve. Repeat every cell on a
      support-matched random system: same number of generators, same
      per-variable degrees, coefficients uniform in F_p, independent seed.
    controls:
      - >-
        Support-matched random system on the same (p, B) grid. A p-range
        that appears for both systems is a field-arithmetic artifact. A
        p-range that appears for S_3 only is system-specific.
      - >-
        The B-only comparator curve ceil((3*(B-1) + 2)/2), using per-variable
        degree 2 from KR-IC-5a43e5. Distance to this curve is reported. The
        curve is not assumed correct.
      - >-
        Two curves per prime. If the two curves differ by at least 1 at a
        cell, that cell's prime effect is not separable from the curve.
    required_metrics:
      - d_solve per (p, curve, B, target)
      - median d_solve per (p, B) for S_3 and for the random arm
      - fixed-B range across p at B = 6
      - fixed-p increment from B = 4 to B = 8 at p = 127
      - absolute gap between the S_3 median and the B-only comparator
  falsification_conditions:
    - >-
      Fixed-B range at B = 6 is at least 1 and the B-increment at p = 127
      is at least 1. Neither pure law survives.
    - >-
      Fixed-B range at B = 6 is 0 and the B-increment at p = 127 is 0.
      Solving degree is constant on this grid, so neither B nor p is the
      scaling variable here.
    - >-
      The random arm's fixed-B range equals the S_3 range, both at least 1.
      The field-size reading is then an artifact of solving over F_p, not a
      Semaev effect.
  confounders:
    - >-
      One curve family and three primes. A prime effect can be a curve
      effect; the two-curve control is the check, and it covers only two
      curves.
    - >-
      Grevlex can sit at a different degree from lex. This test does not
      vary the order.
    - >-
      Target choice and the random base seed move the ideal. Eight targets
      estimate that variance; they do not remove it.
    - >-
      Solver heuristics can stop at different degrees on identical ideals.
      The solver and its parameters stay frozen, and the raw transcript is
      kept.
  interpretation_limits:
    - >-
      Toy primes only. A flat or unit range on this grid does not transfer
      to cryptographic p or to B growing like p^{1/3}.
    - >-
      The factor base is a set-theoretic subset of F_p of size B, inside the
      class KN-OPEN-020 already scopes out for bounded-degree algebraic
      bases. This idea does not leave that class.
    - >-
      No comparison with Pollard rho is implied by a degree pattern. The
      generic baseline remains in force.
    - >-
      This does not restate the gap between solving degree, degree of
      regularity, and Castelnuovo-Mumford regularity. One solver degree is
      the metric.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a support-matched random system whose generator degrees do not
        depend on p, and with field equations of degree p omitted, the
        distribution of d_solve at fixed B is the same at p = 31, 61, and
        127, up to a shift of 0.
      rigorous_support: >-
        The monomial support and the generator degrees are independent of p
        under the omission rule, so the matrix shape is the same integer
        design reduced modulo different primes. A uniform random coefficient
        matrix over a finite field has corank probabilities that vary with
        the field; that is the classical fact being imitated, not a theorem
        about S_3. KN-LIT-0acb8c was opened only as a bibliographic summary
        of a probabilistic Macaulay bound and is not used as a proved input.
      validation_plan: >-
        At each of the nine (p, B) cells, draw 20 independent
        support-matched random systems, record d_solve, and compare the
        three empirical distributions at fixed B across p = 31, 61, 127.
        The tail check is the maximum minus the minimum among the 20 at
        each cell. Sampled parameters are exactly this grid. No transfer to
        larger p is assumed.
  target_complexity:
    time_exponent: >-
      not beaten. Prime-field Pollard rho remains Theta(N^{1/2}) group
      operations.
    memory_exponent: >-
      not beaten. Rho memory stays polylogarithmic per walk, with the
      van Oorschot-Wiener time-memory interpolation unchanged.
    best_known: >-
      Pollard rho at Theta(N^{1/2}); KR-IC-5931ee records that naive
      prime-field Semaev index calculus does not beat generic methods under
      its stated statistical assumptions.
    hidden_overhead: >-
      None claimed. No o(1) attack term is hidden because no attack cost
      is proposed. The output is a toy degree table.
    tradeoff_note: >-
      No time-memory tradeoff is offered. Parallel collision search is
      untouched.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-5931ee
      - KR-IC-0d2021
      - KR-IC-955fd6
      - KR-IC-8b9daa
      - KR-IC-fbdb61
      - KR-IC-f3da82
    nearest:
      - ref: KR-IC-5931ee
        provenance: internal
        relation: adjacent
        delta: >-
          That row is a conditional negative on naive prime-field Semaev
          index calculus versus generic algorithms. This idea adds a toy
          (p, B) degree table whose separator is 0 versus at least 1 in the
          fixed-B range, and it claims no cost improvement.
      - ref: KN-OPEN-002
        provenance: internal
        relation: adjacent
        delta: >-
          The open problem asks for growth in bit size and in m. The
          separator added here is growth in B at fixed p versus growth in p
          at fixed B, at m = 3 only.
    searched:
      corpus_grep:
        - question_id RQ-SDEG-001 in ledger/proposals
        - titles of those fifteen proposals
      web:
        - not performed this session
      blocked:
        - symmetrized summation polynomials (KR-IC-955fd6, KR-IC-8b9daa)
        - Weil-descent last-fall bounds (KR-IC-fbdb61)
        - F4 trace replay (KR-IC-f3da82)
  dominated_by: >-
    Pollard rho at Theta(N^{1/2}) group operations, the baseline checked in
    KR-IC-5931ee. No attack result is claimed.
  sota_delta: >-
    Exponent delta is 0 against Theta(N^{1/2}). The quantitative separator
    is a fixed-B solving-degree range of 0 versus at least 1 on
    p in {31, 61, 127} at B = 6, and a B-increment of at least 1 from
    B = 4 to B = 8 at p = 127.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        m = 3, grevlex, B tied to a single function of p is the schedule
        this grid unties; not an attack baseline.
      reproduction_check: >-
        Recompute d_solve on one frozen cell with a second solver build and
        require the same integer.
    observation_collision:
      observable: d_solve
      distinct_preimage_search: >-
        Two different targets in one cell may share d_solve. That collision
        is expected and carries no discrete log.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the preimage of one degree value on the (p, B) grid
        predicted_gain: >-
          none as an attack; the fiber records which (p, B) pairs share a
          degree
    quantifier_order: >-
      For all three primes and all three cardinalities, the recorded median
      degree is an integer. Exists-versus-forall attack language is not
      used.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy-scale statement that the median degree on this nine-cell grid
        is constant in p at fixed B, constant in B at fixed p, or neither.
      nearby_object_control: the support-matched random system
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Measurement of a degree response surface. Section 8 of the inventor
      protocol is discharged by the nearby random system and the frozen
      cell recompute, not by a proof decomposition.
