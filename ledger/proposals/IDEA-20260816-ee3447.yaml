idea:
  id: IDEA-20260816-ee3447
  question_id: RQ-AEADC-8db132
  added: '2026-08-16'
  title: 'An instrument-validity ladder for every AEAD-mode measurement this program makes: run each
    measurement three times with an ideal permutation, a real block cipher and a deliberately structured
    weak permutation in the primitive slot, and report the measurement as mode-level only if the first
    two agree and the third moves'
  class: control
  claim: '(A) This bucket''s defining assumption is that an AEAD mode''s accounting can be studied
    with the block cipher replaced by an ideal permutation. That assumption makes a testable demand
    on every measurement filed here: the measured quantity must be INSENSITIVE to swapping an ideal
    permutation for a real block cipher, and it must be SENSITIVE to swapping in a permutation with
    declared structure. A measurement that fails the first test is reading the primitive; a measurement
    that fails the second is reading nothing and would report the same number against any object of
    the right shape. (B) The proposal is a three-rung ladder applied uniformly, and the deliverable
    is a per-measurement validity verdict with two numbers: the ideal-versus-real divergence and the
    ideal-versus-weak divergence, both in the measurement''s own units, with a declared tolerance.
    A measurement passes only if divergence one is below tolerance and divergence two is above it.
    (C) The weak permutation is not a broken implementation but a declared object: a permutation constructed
    to have a specific, named structural property -- for instance a large fixed-point set, or a low-degree
    algebraic relation between input and output on a declared subset -- so that a sensitive measurement
    has something definite to detect and the failure is attributable to a named property rather than
    to noise. (D) NOT CLAIMED: this is not an audit of the program''s cost model, machine variance
    or timing, which is separate territory owned elsewhere; not a claim that any existing record is
    invalid, since the ladder is proposed and no verdict is asserted in advance; no attack, break
    or security consequence; and no claim that passing the ladder makes a measurement correct, since
    it establishes only that the measurement responds to the mode and to structure, which is necessary
    and not sufficient. A ladder on which every measurement passes is a cheap and complete result:
    it would convert the bucket''s central modelling assumption from a stipulation into a checked
    property, and would fix the tolerance at which it was checked.'
  mechanism: 'STAGE 1, zero compute: define the three rungs precisely. Rung one is a seeded lazily-sampled
    bijection, which is the ideal-permutation slot; rung two is a pinned real block cipher validated
    against published test vectors; rung three is a weak permutation constructed from a declared structural
    property, with the property written down as a predicate that can be verified on the constructed
    object. STAGE 2, zero compute: define the divergence statistic in the units of the measurement
    being validated, and the tolerance, both before any measurement is run. STAGE 3: take a small
    set of AEAD-mode measurements -- two from this batch and one constructed as a deliberate straw
    measurement known in advance to be primitive-blind -- and run each of them three times, once per
    rung, with everything else held identical, including seeds where they do not touch the primitive.
    STAGE 4: compute the two divergences per measurement and issue the pass-or-fail verdict against
    the pre-registered tolerance. STAGE 5: verify the weak permutation actually carries its declared
    property by checking the predicate directly, since a weak object that is not weak in the declared
    way makes rung three meaningless. STAGE 6: report the ladder table, with the straw measurement
    included as the negative control that must fail rung three. Refutation: a straw measurement that
    passes, or a weak permutation whose property check fails.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read the batch anti-duplication blacklist first, which forbids re-proposing an audit
      of this program''s cost model, machine variance or single-machine timing under RQ-INSTR-f8faa0,
      and checked that this record touches none of those: it is a primitive-substitution ladder on
      mathematical measurements, not a timing or cost audit. Read RQ-AEADC-8db132 in full and RQ-POLYMAC-7c89e4
      in full. Grepped ledger/proposals/ and knowledge/ for: ideal permutation, ideal cipher, lazy
      sampl. Grepped ledger/proposals/, ledger/hypotheses/ and knowledge/ for aead, key commitment,
      nonce-misuse. Read all eight AEADC proposal titles, classes and claim heads, and IDEA-20260809-47a08e
      in full as the closest control-class record. Read docs/inventor-protocol.md sections 3, 4 and
      8.'
    results: 'IDEA-20260809-47a08e is the closest neighbour in the corpus: it pairs a reduction-based
      null object with a truncated-hash positive control to calibrate the certificate machinery''s
      detection power. That is a two-rung calibration of ONE harness against ONE property, and its
      rungs are constructions, not primitive substitutions. The ideal-permutation grep matched IDEA-20260808-83b3ba,
      IDEA-20260808-bfee7e and IDEA-20260731-006 outside this bucket by filename only. RQ-INSTR-f8faa0
      is named in the batch briefing as carrying fifteen or more instrument proposals about cost models
      and timing, which is a different failure mode entirely. No record proposes a uniform primitive-substitution
      ladder applied across measurements, and none pairs an insensitivity requirement with a sensitivity
      requirement as a joint verdict.'
    verdict: 'UNVERIFIED. Substituting an ideal primitive to isolate a mode-level property is entirely
      standard practice outside this repository and nothing is asserted about its published use; the
      specific weak-permutation construction here is declared internally. What is claimed new is internal
      and procedural: this repository has no uniform validity ladder for mode-level measurements,
      and its one calibration record (IDEA-20260809-47a08e) calibrates a single harness against a
      single property using constructions rather than primitive slots. Assembled from known parts:
      null-object discipline from inventor-protocol section 3, the method-ceiling and nearby-object
      control from section 8, and the primitive-substitution assumption this bucket''s directive states
      outright.'
  object_first_candidate:
    tracked_object: 'The measurement itself, treated as a function from a filled primitive slot to
      a number: the ordered triple of values a single measurement procedure returns when the slot
      is filled by an ideal permutation, a real block cipher and a declared weak permutation, carried
      with the measurement''s own error bars.'
    lossiness: 'Lossy, and unusually so, because the object discards the entire content of each measurement
      and keeps only how its value MOVES under substitution. A measurement that returns a rich surface
      is collapsed to two scalar divergences. That discard is compatible with the operation being
      studied -- the substitution of one primitive for another -- because substitution acts on the
      measurement only through its value, so the retained pair determines the verdict deterministically.
      The honest caveat, which section 2 requires stating rather than hiding: for a measurement that
      is already a single scalar, nothing is discarded and the triple is a change of coordinates,
      not a projection; those measurements are still gradeable by the ladder but their entry contributes
      no compression, and they are marked as such in the table.'
    propagation: 'One step is exchanging the occupant of the primitive slot. It acts on the tracked
      object by moving one coordinate of the triple, and the structure of interest is which coordinates
      move together: a mode-level measurement should be flat between rungs one and two and displaced
      at rung three, while a primitive-level measurement moves between one and two, and a blind measurement
      moves nowhere. Those three signatures partition the space of outcomes exhaustively, which is
      what makes the verdict a decision rather than a judgement.'
    survival_score: The verdict survives as long as the measurement's own error bars are narrower
      than the tolerance separating the rungs. Concretely, the survival score is reported per measurement
      as the ratio of the tolerance to the measurement's own confidence-interval half-width; a ratio
      below two means the ladder cannot resolve the verdict for that measurement and the correct output
      is an explicit undecided rather than a pass. That undecided outcome is reported, not suppressed,
      and it names the sample size the measurement would need.
  null_object_control: 'The straw measurement, constructed in advance to be primitive-blind: a statistic
    computed from the mode''s input and output LENGTHS only, which cannot depend on the primitive
    by construction and which must therefore return an identical value at all three rungs. It is executed
    in the same invocation by the same ladder driver as the real measurements. For the ladder to mean
    anything, the straw must fail rung three -- it must show zero sensitivity to the weak permutation
    -- and if the ladder passes the straw, the ladder itself is broken and no verdict it issues can
    be believed. A second control is the weak permutation''s own property predicate, checked directly
    on the constructed object, because a weak object that does not carry its declared property makes
    rung three a null test dressed as a control.'
  discriminated_from:
  - IDEA-20260809-47a08e calibrates the certificate harness with a reduction-based null and a truncated-hash
    positive control. Those rungs are constructions varied inside one measurement; these rungs are
    primitive slots varied under an unchanged measurement, and the verdict here is joint -- insensitivity
    AND sensitivity -- rather than a single detection-power check.
  - The cost-model, machine-variance and timing audits under RQ-INSTR-f8faa0, which the batch briefing
    records as already numerous. This record measures no time, no cost and no machine effect; every
    rung returns a mathematical quantity and the ladder would give identical verdicts on a different
    machine.
  - The commitment-budget entry in this batch uses an ideal permutation as a modelling assumption
    and checks one mode against a real primitive. This record makes that check the object, applies
    it uniformly across measurements, and adds the sensitivity rung that the budget entry lacks.
  - A generic ablation study. The distinguishing feature is the third rung with a NAMED structural
    property and a verifiable predicate, so a sensitivity failure is attributable to a specific property
    rather than to unspecified weakening.
  - RQ-POLYMAC-7c89e4's requirement that reference implementations be validated against published
    test vectors before measurement. That is implementation validation; this is measurement-semantics
    validation, and a correct implementation can still be measuring the wrong object.
  assumptions:
  - A seeded lazily-sampled bijection is an adequate realisation of an ideal permutation for the measurements
    under test, at the widths those measurements use.
  - The declared weak permutation's structural property is one that a genuinely mode-sensitive measurement
    would notice; a property chosen orthogonally to every measurement would make every measurement
    fail rung three for an uninteresting reason, and this is the sharpest risk in the record.
  - Divergence in the measurement's own units, against a pre-registered tolerance, is a fair verdict
    rule.
  - Holding seeds fixed across rungs where they do not touch the primitive removes sampling noise
    from the comparison.
  - A pinned real block cipher validated against published test vectors is a faithful rung two.
  predictions:
  - metric: ideal-versus-real divergence for a genuinely mode-level measurement, in its own units
      relative to tolerance
    direction: lower
    minimum_effect: 1.0
  - metric: ideal-versus-weak divergence for a genuinely mode-level measurement, relative to tolerance
    direction: higher
    minimum_effect: 1.0
  - metric: ideal-versus-weak divergence for the straw measurement
    direction: different
    minimum_effect: 0
  - metric: verification of the weak permutation's declared structural predicate on the constructed
      object
    direction: different
    minimum_effect: 1
  - metric: number of measurements returning an undecided verdict because tolerance is within twice
      their confidence-interval half-width
    direction: different
    minimum_effect: 'explicit refusal to pre-commit: this depends on the sample sizes of the measurements
      chosen for the ladder, which are set by their own contracts and not by this one'
  minimal_test:
    design: 'One process, one ladder driver, three rungs, four measurements. Implement the three primitive-slot
      occupants: a seeded lazily-sampled bijection, a pinned real block cipher, and a weak permutation
      carrying a declared structural property whose predicate is checkable. Write the ladder driver
      so that a measurement is a callable taking a primitive-slot object, which forces every arm to
      be executable in one invocation. Select four measurements: two mode-level measurements from
      this batch, run at their smallest declared parameters; one primitive-level measurement chosen
      deliberately to move between rungs one and two, as a positive control for the insensitivity
      test; and the straw length-only statistic as the negative control. Run all four at all three
      rungs with matched seeds, compute both divergences per measurement, and issue verdicts against
      the pre-registered tolerance. Verify the weak permutation''s predicate directly. The whole ladder
      costs no more than the four underlying measurements at their smallest parameters, which is the
      point: validity should be cheaper than the thing it validates.'
    controls:
    - Straw length-only measurement as the negative control, which must show zero divergence at every
      rung.
    - A deliberately primitive-level measurement as the positive control for the insensitivity rung,
      which must diverge between rungs one and two.
    - Direct verification of the weak permutation's declared structural predicate on the constructed
      object.
    - Matched seeds across rungs wherever the seed does not feed the primitive slot.
    - Pre-registered tolerance and divergence statistic, hashed before any rung runs.
    - Test-vector validation of the pinned real block cipher before rung two.
    required_metrics:
    - ideal-versus-real divergence per measurement, in the measurement's own units
    - ideal-versus-weak divergence per measurement, same units
    - pass, fail or undecided verdict per measurement against the pre-registered tolerance
    - ratio of tolerance to each measurement's confidence-interval half-width
    - result of the weak permutation's structural predicate check
    - straw measurement divergence at all three rungs
  falsification_conditions:
  - The straw measurement shows nonzero divergence at any rung, which means the ladder driver is not
    holding everything but the primitive fixed and no verdict it issues is trustworthy.
  - The weak permutation fails its own structural predicate, making rung three uninterpretable.
  - The primitive-level positive control shows no divergence between rungs one and two, meaning the
    insensitivity rung cannot detect a primitive effect and every pass on that rung is empty.
  - Every measurement returns undecided because tolerance sits inside the confidence intervals, meaning
    the ladder is unresolvable at the chosen parameters and must be rerun at larger sample sizes or
    a wider tolerance, stated as such.
  - Every mode-level measurement fails rung three, which most likely means the weak permutation's
    property is orthogonal to all of them rather than that the measurements are blind, and the record
    must say which.
  confounders:
  - A weak permutation whose property is orthogonal to every measurement under test produces a uniform
    rung-three failure that looks like a devastating finding and is actually a bad choice of control;
    this is the dominant confounder and the reason the property is declared and verified rather than
    improvised.
  - 'Seed handling across rungs: a seed that reaches the primitive slot in one rung and not another
    injects noise into the divergence.'
  - Measurements whose own error bars exceed the tolerance produce verdicts that are noise; the tolerance-to-interval
    ratio is reported precisely to expose this.
  - A real block cipher restricted to a small width by a reduction may itself acquire structure, blurring
    rungs two and three.
  - Running the ladder only on measurements from this batch selects for measurements built with the
    substitution assumption in mind, which flatters the pass rate; the primitive-level positive control
    is what keeps the ladder honest.
  interpretation_limits:
  - Passing the ladder establishes that a measurement responds to the mode and to declared structure;
    it does not establish that the measurement is correct, and no record may cite a pass as evidence
    of correctness.
  - A rung-three failure is attributable only to the declared property of the weak permutation, not
    to weakness in general.
  - The ladder issues verdicts about measurements at the parameters at which they were run, and a
    measurement rerun at other parameters is not covered by an earlier verdict.
  target_complexity:
    time_exponent: No attack exponent is claimed. The ladder costs three times the underlying measurement,
      run at its smallest declared parameters.
    memory_exponent: No attack exponent is claimed. Memory is that of one underlying measurement at
      a time.
    best_known: The incumbent is the current practice of stating the ideal-primitive substitution
      as a modelling assumption without checking it, together with IDEA-20260809-47a08e's single-harness
      calibration. This record does not beat either; it makes the assumption checkable at a cost of
      three runs instead of one, and can be shown useless if the straw passes.
    hidden_overhead: 'The human cost is the weak permutation: choosing a structural property that
      a mode-level measurement would plausibly notice, without choosing it after seeing which measurements
      pass, is the whole difficulty, and there is no mechanical rule for it. Lower-order overhead
      is the ladder driver''s requirement that every measurement be refactored to take its primitive
      as an argument, which is a real code cost paid once.'
  dominated_by: n/a (no result claimed). No attack, so no time, memory or query frontier. Checked
    against the four targets of RQ-AEADC-8db132, its eight proposals, the four targets of RQ-POLYMAC-7c89e4,
    and the other entries in this batch. The nearest record, IDEA-20260809-47a08e, is a two-rung calibration
    of one harness and is neither dominated by nor dominates this three-rung uniform ladder; they
    would compose, since a harness that passes 47a08e's calibration could still fail this ladder's
    sensitivity rung.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a four-row ladder table with two divergences and a verdict per row, plus a tolerance-to-interval
    ratio that says which verdicts are resolvable, where the corpus currently checks the substitution
    assumption nowhere.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. That the ladder driver runs all rungs in one invocation with
    matched seeds: about 0.9, mostly a refactoring risk. That the straw measurement shows zero divergence
    everywhere: about 0.9, and a failure would be a driver bug rather than a finding. That the primitive-level
    positive control diverges between rungs one and two: about 0.85. That at least one genuinely mode-level
    measurement passes both rungs: about 0.6, with the dominant risk being that the weak permutation''s
    property is orthogonal to the measurements and every one fails rung three -- an outcome I consider
    roughly as likely as the clean pass, and which the record is written to report honestly rather
    than to explain away. That the tolerance is resolvable against the measurements'' own error bars:
    about 0.55, and undecided verdicts are an expected and reportable outcome.'
