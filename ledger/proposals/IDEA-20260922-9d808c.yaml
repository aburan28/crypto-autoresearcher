idea:
  id: IDEA-20260922-9d808c
  question_id: RQ-DREG-d7b6d6
  added: '2026-09-22'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Does a Vélu step change the degree-filtration rank profile by more than
    a linear change of Weil-restriction coordinates?
  class: mechanism
  claim: >-
    Representation class R3 of RQ-ECDLP-623a32 (Weil restriction
    coordinates), attack stage relation-decomposition Gröbner degree. On one
    certified F_4-rational Vélu edge of LADDER-W at rung n=1, the full-column
    Macaulay rank profile r(d) for d <= 4 of the native chained t=4 ideal is
    invariant under invertible linear substitutions of the boolean variables,
    and any difference of r(d) between the two native ideals survives every
    such substitution. A grevlex solving-degree gap with equal rank profiles
    is an order artifact. A rank-profile gap of at least 1 is not explained
    by a linear change of variables. No ECDLP exponent is claimed.
  mechanism: >-
    PAIR AND OPERATION SET. The representation is the boolean Weil-restriction
    coordinate space of the chained system (R3). Sigma is the set of
    invertible linear substitutions of those coordinates, the operation under
    which the degree-filtration rank profile must be invariant if the profile
    is intrinsic. The Vélu isogeny is the probe that produces the second
    native ideal. Sigma is not group translation. TRICHOTOMY:
    coordinate-dependent (IDEA-20260806-c5d183 Class III). The claim is about
    whether the profile depends on coordinates only through GL. LOSSY
    PROJECTION. r(d) = dim(I intersect P_<=d), with P_<=d the span of
    monomials of total degree at most d, read as the rank of the full-column
    Macaulay matrix. An invertible linear substitution extends to a filtered
    ring automorphism, so it preserves r(d) when the matrix really spans the
    degree-bounded piece of the ideal. The profile therefore discards the
    GL-orbit of the generators. Many orbits share one profile, so the
    projection is lossy. It discards the grevlex leading-term ideal, which is
    not GL-invariant. A map that kept a specific grevlex basis would not be
    this projection. WHAT IS TESTED. Let E and E' be the domain and codomain,
    both with native chained ideals written from their own Weierstrass
    equations, not from a pullback. Let delta be the maximum total degree of
    the Weil restriction of the Vélu coordinate functions after clearing
    denominators. THREE EXPLANATIONS. (Linear) delta = 1 and r_E = r_E'. The
    coordinate change is linear and the profiles agree. (Instrument) delta = 1
    and r_E differs from r_E', or a sampled linear substitution changes r on
    a single ideal. The invariance check failed. No isogeny conclusion.
    (Nonlinear but flat) delta > 1 and r_E = r_E'. The isogeny is nonlinear
    on these coordinates and still does not move the filtration profile.
    Nonlinearity does not force a gap. (Filtration gap) delta > 1 and
    max_d |r_E(d) - r_E'(d)| >= 1. Because r is GL-invariant when the
    instrument check passes, no sampled linear change removes the gap. This
    is the explanation that would make a later slope census measure an
    intrinsic difference. (Order artifact) grevlex solving degrees differ by
    at least 1 while r_E = r_E'. The solver's monomial order moved. The ideal
    filtration did not. F2 is the component system. What is added beyond F2
    is the separation of a filtration gap from an order artifact and from a
    linear coordinate change. This is not a new group homomorphism.
  novelty_status: unverified
