  assumptions:
    - >-
      Identifier assigned by handoff TASK-20260922-d7b6d6. Proposal only.
    - >-
      The filtered-automorphism claim is checked inside the test by sampled
      GL matrices. A failed check stops the isogeny reading. The proposal
      does not treat the check as a published theorem citation.
    - >-
      Native ideals are rebuilt from each curve's own equation. The graph
      ideal is a different object and is IDEA-20260922-469f79.
    - >-
      F2 is the component system. One edge is not a class census.
    - >-
      Subset-column ranks are not used. Full-column exact rank over F_2 only.
  proof_search_map:
    bottleneck: >-
      Whether two native chained ideals on one Vélu edge differ in
      dim(I intersect P_<=d), a quantity linear substitutions cannot move,
      or only in the grevlex staircase, which they can.
    baseline_embedding:
      parameter_slice: >-
        One random invertible linear substitution applied to a single frozen
        ideal, before any isogeny comparison. The old method's boundary is
        "a coordinate change that is known to be linear".
      reproduction_check: >-
        r(d) must agree for all eight frozen GL samples on the base ideal
        alone. Any disagreement means the matrix is not computing the
        filtration dimension. The isogeny edge is not read.
    observation_collision:
      observable: >-
        The rank vector (r(d))_{d<=4}. It discards the GL-orbit and the
        grevlex basis.
      distinct_preimage_search: >-
        The eight GL images of the base ideal are distinct preimages required
        to share the vector. The codomain ideal is a further preimage. Log
        the generator hash so equal vectors are not collapsed into one ideal.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The degree-filtration rank profile, which is constant on GL-orbits,
          in place of grevlex solving degree, which is not.
        predicted_gain: >-
          Separates an order artifact from a filtration gap. No ECDLP-exponent
          gain.
    quantifier_order: >-
      FOR ALL of the eight frozen invertible linear substitutions L, r(L(I))
      = r(I) on the base ideal. IF that holds, THEN a difference
      max_d |r(I_E)(d) - r(I_E')(d)| >= 1 is not removed by any of those L.
      The universal quantifier is over the frozen sample of eight matrices,
      not over all of GL. A later proof could extend it. This proposal does
      not.
    method_ceiling:
      strongest_certifiable_claim: >-
        On one toy edge at n=1, the pair of native rank profiles either
        agrees, differs by at least 1 with the GL check passed, or the GL
        check failed. Grevlex gaps are labeled order artifacts when the
        profiles agree. Not an algorithm.
      nearby_object_control: >-
        A random degree-2 polynomial substitution, not in GL, applied to the
        base ideal. The filtration profile is allowed to move. If it does not
        move under that nearby nonlinear map either, a later Vélu gap cannot
        be credited to degree 2 structure without a further test. If the GL
        nearby object moves the profile, the instrument is wrong.
    proof_obligations:
      - claim: Eight GL samples leave r(d) unchanged before the edge is read.
        responsibility: baseline
      - claim: >-
          r(d) is the full-column Macaulay rank in degree at most d, not a
          subset-column corank and not a grevlex basis degree.
        responsibility: correctness
      - claim: A filtration gap means a difference of at least 1 in some r(d).
        responsibility: strictness
      - claim: One edge at n=1 on LADDER-W. Not a class slope.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: max over d <= 4 of the absolute difference of r(d) between the two native ideals
      direction: lower
      minimum_effect: >-
        0 means the filtration profile agrees on this edge. A difference of
        at least 1, with the GL check passed and delta > 1, is a filtration
        gap that linear changes do not explain.
    - metric: absolute difference of grevlex solving degrees when the rank-profile difference is 0
      direction: different
      minimum_effect: >-
        A grevlex gap of at least 1 with rank difference 0 is an order
        artifact. A grevlex gap of 0 with rank difference 0 is agreement of
        both observables. Either one rejects "the edge changed the intrinsic
        degree".
    - metric: measured delta of the cleared-denominator Vélu coordinate map
      direction: higher
      minimum_effect: >-
        delta >= 2 means the coordinate change is not linear. delta = 1 with
        a rank gap is an instrument failure, not a filtration gap.
  minimal_test:
    design: >-
      Take the base curve of LADDER-W and one certified F_4-rational Vélu
      neighbor of degree 2 or, if none, degree 3. If neither exists, the
      outcome is "no rational edge" and no geometric isogeny is substituted.
      Build both native t=4 chained ideals at n=1, k=1, Weil-restricted to
      F_2. Compute full-column r(d) for d <= 4. Draw eight invertible matrices
      in GL(N, F_2) from a frozen seed and recompute r on the base ideal after
      each. Separately substitute the Vélu rational map, clear denominators,
      Weil-restrict, and record delta as the maximum total degree of those
      polynomials. If grevlex finishes on both natives, record both solving
      degrees. Do not run the rest of the class.
    controls:
      - Eight GL images of the base ideal. All eight must match r(d).
      - >-
        One random degree-2 substitution of the base variables, frozen seed,
        as the nearby nonlinear object.
      - >-
        Trace check on the edge. An order mismatch voids the edge.
      - >-
        The m=3 prime-field neighbor screen is not the observable. A single
        m=3 rank comparison may be logged as a sanity check and cannot by
        itself satisfy the growing-regime discussion of the parent question.
    required_metrics:
      - r(d) for d <= 4 on both native ideals
      - r(d) after each of eight GL samples
      - delta of the cleared Vélu coordinate polynomials
      - grevlex solving degree on each native if the basis finishes, otherwise unmeasured
      - the explanation label in {linear, instrument, nonlinear-but-flat, filtration-gap, order-artifact, no-rational-edge}
  falsification_conditions:
    - >-
      The GL check fails. The mechanism is unreadable on this implementation.
      No isogeny conclusion is drawn.
    - >-
      delta > 1 and the rank profiles agree. The explanation "a nonlinear
      Vélu step forces a filtration gap" is false on this edge.
    - >-
      Rank profiles agree and grevlex solving degrees agree, or grevlex is
      unmeasured. There is no degree gap on this edge for the observables
      that finished. This does not prove the slope on the whole class is flat.
    - >-
      delta = 1 and the rank profiles differ. The test contradicts its own
      invariance check. Instrument failure.
    - >-
      A timeout is an unmeasured profile, not evidence that a degree exploded.
  confounders:
    - >-
      Clearing denominators adds the denominator as a factor. A large delta
      can be an artifact of the chart. Record the denominator degree
      separately from the numerator degree.
    - >-
      N is the boolean variable count. A GL sample of eight is not all of
      GL(N, F_2). The quantifier is the sample.
    - >-
      At n=1, k=1 the ideal may be degenerate. A unit ideal on either side
      voids the comparison.
    - >-
      One edge can be a special kernel. The label does not extend to every
      vertex. That extension is the slope census, which this test does not
      replace.
    - >-
      Characteristic 2 makes squaring linear on F_2-coordinates after Weil
      restriction. Delta is measured in the boolean polynomial ring, not in
      the original x-line, so a map that is degree ell in x can become a
      different degree in bits. The measured delta is the boolean one.
  interpretation_limits:
    - >-
      One toy edge. No class-wide slope. No cryptographic curve. No ECDLP
      exponent. Rho remains about p^{1/2}.
    - >-
      A filtration gap of size at least 1 is not an attack. The walk is not
      charged. Galbraith ePrint 2024/924 is recalled and unread.
    - >-
      No new factor base. The subspace base is reused and is not a KN-OPEN-020
      escape.
    - >-
      Does not rerun the m=3 neighbor census. Does not build a true
      degree-of-regularity meter.
    - >-
      If this edge is flat, IDEA-20260922-f1e5b7 can still see a slope at
      n=2 or on another vertex. Flatness here does not close that census.
    - >-
      Kummer-line and degree-d-function-on-E representations are not used.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The claim is a finite comparison of rank vectors on one edge and
        eight linear substitutions. It imitates no distribution and does not
        extrapolate to other edges or to larger n.
      rigorous_support: >-
        Rank of a finite matrix over F_2 is an integer. No tail law is
        invoked. The filtered-automorphism identity is not cited as a paper.
        It is the content of the GL check.
      validation_plan: >-
        The eight GL samples are the validation. If they disagree, H1's
        comparison is not interpreted. No cryptographic-scale sample.
  target_complexity:
    time_exponent: >-
      Measurement cost. Two native rank profiles, eight GL images, one
      nonlinear nearby map, all at degree at most 4 on the n=1 boolean
      system (about 8 variables, C(12, 4) = 495 columns). Not a p-power
      attack exponent.
    memory_exponent: One Macaulay matrix of that column count. No rho table.
    best_known: >-
      Pollard rho at about p^{1/2} group operations. This mechanism test
      claims no improvement on it or on the m=3 algebraic baseline in
      FINDING-PF-IC-001.
    hidden_overhead: >-
      None. A matrix that does not finish is unmeasured. No o(1) term is
      hiding an attack.
    tradeoff_note: >-
      No ECDLP exponent is claimed. No time-memory tradeoff. This is the
      cheapest of the four proposals because it is one edge at the small rung.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  dominated_by: "n/a (no result claimed)"
  sota_delta: >-
    No change to the p^{1/2} rho exponent. Relative to DEC-20260716-003, which
    dominates any claim that an m=3 prime-field neighbor is a weaker Gröbner
    instance, this test claims no such weakness. The quantitative delta it
    can report is an integer difference of at least 1 in a Macaulay rank at
    some degree <= 4 on one toy edge, or the integer delta of the Vélu
    coordinate map. A rank gap of 1 is not an ECDLP exponent. Frontier
    checked against rho, the m=3 closure, and the semi-regular null. None is
    an attack this idea claims to beat.
