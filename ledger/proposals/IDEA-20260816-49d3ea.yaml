idea:
  id: IDEA-20260816-49d3ea
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: Compute exactly, with no compute budget, how much soundness a query-phase sampler loses by
    drawing its t verifier queries with replacement rather than without, tabulated over named domain
    sizes, query counts and corruption rates, and identify the shapes where the difference exceeds
    a named bit threshold
  class: control
  claim: '(A) Query-phase soundness in a committed-oracle argument is the probability that at least
    one of t sampled positions lands in the corrupted set. If the t positions are drawn independently,
    that probability is one minus (1 minus delta) to the t; if they are drawn as a uniform subset
    of size t without replacement, it is one minus the hypergeometric probability of missing entirely.
    Accounting almost always uses the independent form because it is simpler, and implementations
    sample in whichever way is convenient. These are different numbers. (B) The exact difference is
    computable with no experiment for every named (domain size N, query count t, corruption count
    m) using exact integer binomial arithmetic, and the deliverable is the signed bit discrepancy
    between the two detection probabilities, tabulated over a frozen grid, together with the identification
    of which shapes make the discrepancy exceed a named threshold such as one tenth of a bit and which
    make it vanish. (C) The direction is fixed and checkable: sampling without replacement detects
    at least as often as sampling with replacement at the same t, so the independent-form accounting
    is conservative for a without-replacement implementation and exact for a with-replacement one;
    the magnitude of that conservatism is the number, and it grows with t over N. The record additionally
    reports the effective query count, defined as the t-with-replacement that matches a given t-without-replacement,
    which is the practically useful form. (D) NOT CLAIMED: no attack, no claim that any implementation
    samples either way since none is examined, no claim about any deployed, third-party or standardized
    argument system, and no security consequence; a conservative accounting is not a vulnerability
    and this record does not present it as one.'
  mechanism: 'STAGE A: define the two detection probabilities exactly. With replacement, the miss
    probability is (1 minus m over N) to the t, exact as a rational. Without replacement, the miss
    probability is the binomial coefficient (N minus m choose t) divided by (N choose t), exact as
    a rational for t at most N minus m and zero beyond. STAGE B: compute the signed bit discrepancy
    as log2 of the with-replacement miss probability minus log2 of the without-replacement miss probability,
    in exact rational arithmetic converted to high-precision decimal only at print time. STAGE C:
    tabulate over a frozen grid of N, t and m spanning the small-corruption regime where m over N
    is a fraction of a percent and the large-corruption regime where it approaches one half, and over
    query counts from one to several hundred. STAGE D: compute the effective query count by solving
    for the real t that equates the two miss probabilities, reported to three decimals. STAGE E: verify
    the closed forms by direct enumeration at tiny N, where every subset of size t can be listed and
    the miss frequency counted exactly, and abort on any disagreement. STAGE F: run the null control
    below, in which m equals zero and both forms must give miss probability exactly one and discrepancy
    exactly zero, and a second null at t equal to one where the two sampling schemes coincide by definition.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for with replacement, union bound, Merkle,
      soundness error and challenge space. Read the titles of all thirteen RQ-WFS-e776b6 proposals
      from a PyYAML scan of ledger/proposals/. Read ledger/questions/RQ-WFS-e776b6.yaml. Checked whether
      the with-replacement hits belong to this question by inspecting their question ids.
    results: The string with replacement hits IDEA-20260809-2ba70c, IDEA-20260816-6a2bea, IDEA-20260808-917e63
      and IDEA-20260809-ce875b, none of which is on RQ-WFS-e776b6; from their ids and the surrounding
      batch they belong to symmetric-primitive and other lanes where sampling with replacement concerns
      collision search rather than verifier queries. Among the thirteen RQ-WFS proposals, IDEA-20260809-7ca867
      measures a grinding curve, IDEA-20260816-f05ef2 counts distinct challenges bought by a grinding
      budget, and IDEA-20260809-82e7ba sweeps challenge-space size; none computes a query-phase detection
      probability, and none distinguishes the two sampling schemes.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; the binomial and hypergeometric
      miss probabilities are elementary and universally known, and the fact that sampling without
      replacement is at least as good is standard. What is claimed new is only internal: no record
      in this repository carries the tabulated bit discrepancy or the effective-query-count conversion
      for the query phase of a committed-oracle argument. Every part assembled here is known arithmetic.'
  object_first_candidate:
    tracked_object: 'The miss probability pair (P_with, P_without) at a given (N, t, m): the two exact
      rational probabilities that all t sampled positions avoid the corrupted set under the two sampling
      schemes. Every reported quantity is a functional of this pair.'
    lossiness: Genuinely lossy. The underlying state is the full joint distribution of which positions
      were sampled, an object of size N choose t or N to the t; the pair keeps two rationals and discards
      which positions were drawn, in what order, and every correlation among them except the one that
      determines whether the corrupted set was hit. The discard is compatible with the target operation
      because a verifier's query phase rejects exactly when at least one query lands in the corrupted
      set, so nothing outside the hit-or-miss event reaches the decision. The retained pair propagates
      deterministically under repetition, since independent query rounds multiply miss probabilities.
    propagation: 'One step of the target operation is one additional verifier query. On the tracked
      object it acts as: P_with multiplies by exactly (1 minus m over N); P_without multiplies by
      (N minus m minus t) divided by (N minus t), a factor that shrinks as t grows. The two therefore
      diverge monotonically in t, and the rate of divergence is the reportable structure. Under repeated
      independent query rounds each with its own fresh sample, both propagate multiplicatively, so
      the discrepancy per round accumulates additively in bits, which is exactly the accounting statement
      this record makes computable.'
    survival_score: 'The object survives exactly and without approximation for every (N, t, m) representable
      in integer arithmetic, including cryptographic-size domains, because binomial coefficients of
      these sizes are exact Python integers and the ratios are exact rationals. It dissolves in only
      one named place: when the corrupted set is not a fixed set but is chosen adaptively in response
      to earlier queries, at which point the hypergeometric form no longer applies and neither probability
      is the right object. That adaptive case is named and excluded rather than approximated.'
  null_object_control: 'NULL OBJECT: the zero-corruption case m equal to zero, run through the identical
    exact-arithmetic pipeline in the same invocation, where both miss probabilities must be exactly
    one and the discrepancy exactly zero at every (N, t). A second null is t equal to one, where the
    two sampling schemes are identical by definition and the discrepancy must again be exactly zero.
    A third null replaces the hypergeometric computation with a Monte Carlo sampler drawing subsets
    uniformly without replacement and counting misses over a large sample, which must agree with the
    exact value inside its counting interval. For the signal arm to mean anything all three nulls
    must return their forced values; a nonzero discrepancy at m equal to zero or at t equal to one
    would prove the pipeline manufactures bits, most likely through a floating-point conversion, and
    no signal number could be reported.'
  discriminated_from:
  - IDEA-20260816-f05ef2 counts how many distinct challenges a grinding budget of G counter values
    actually buys, which is a coupon-collection statement about an adversary's budget. Here no adversary
    budget exists; the object is the honest verifier's query sampler and the two schemes it might
    use.
  - IDEA-20260809-7ca867 measures a grinding curve for a low-degree-test protocol. This record performs
    no measurement of cost and spends no compute; it is an exact arithmetic tabulation.
  - The reduction-bias record in this set, whose non-uniformity arises from mapping a wide integer
    into a field. Here every draw is exactly uniform and the entire effect comes from dependence between
    draws, which reduction bias does not touch.
  - The folding record in this set, whose object is a distance profile under a code-domain map. Here
    nothing is folded and no code is involved; the object is a hypergeometric versus binomial comparison.
  - 'A generic remark that sampling without replacement is at least as good: that is a direction.
    This record supplies the magnitude at named shapes and the effective-query-count conversion, which
    the direction does not give.'
  assumptions:
  - The corrupted set is fixed before the queries are drawn; adaptive corruption is named and excluded,
    not approximated.
  - Each query independently and uniformly selects a position in the with-replacement scheme, and
    the without-replacement scheme selects a uniform subset of size t; other samplers such as stratified
    or pseudorandom-permutation-based ones are outside scope.
  - Exact integer binomial arithmetic and exact rationals end to end, with high-precision decimal
    used only for printing.
  - Repetition across query rounds is independent, so bit discrepancies add; correlated rounds are
    excluded by scope.
  - The named grid spans the regimes of interest; the extremal shapes reported are maximisers over
    the grid, not over all parameters.
  predictions:
  - metric: signed bit discrepancy at m equal to zero
    direction: different
    minimum_effect: 'forced value: exactly zero at every (N, t); any nonzero output voids the run'
  - metric: signed bit discrepancy at t equal to one
    direction: different
    minimum_effect: 'forced value: exactly zero; the schemes coincide by definition'
  - metric: sign of the discrepancy for t at least two and m at least one
    direction: higher
    minimum_effect: 'forced value: strictly positive, since without-replacement sampling misses strictly
      less often; a negative entry anywhere is an instrument fault'
  - metric: discrepancy at t over N equal to one percent, N equal to 65536, m over N equal to one
      percent
    direction: higher
    minimum_effect: 0.001
  - metric: effective query count, the with-replacement t matching a without-replacement t equal to
      128 at N equal to 8192 and m over N equal to five percent
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit beyond the direction: the multiplier depends on
      the interaction of t over N and m over N and computing it is the point of the table'
  minimal_test:
    design: One script, under a second of runtime. Implement the two miss probabilities in exact rationals
      using math.comb for binomials, then the signed bit discrepancy at 40 significant digits via
      the decimal module. Tabulate over N in {256, 4096, 65536, 2 to the 20}, t in {1, 2, 8, 32, 128,
      512}, and m over N in {0, 0.001, 0.01, 0.05, 0.25, 0.5}, giving 4 times 6 times 6 equal to 144
      cells. For each cell also solve for the effective with-replacement query count by bisection
      on the real t that equates the two miss probabilities, reported to three decimals. Verify the
      closed forms at N equal to 12 by listing all subsets of size t and counting misses exactly.
      Run the three nulls in the same invocation. The discriminating output is the two columns naming
      which cells exceed one tenth of a bit and which fall below 2 to the minus 20 bits. If no cell
      in the grid exceeds the threshold, the measured obstruction is that the choice of sampling scheme
      cannot matter at these shapes, which is a usable and reusable boundary.
    controls:
    - Zero-corruption null at m equal to zero, requiring discrepancy exactly zero.
    - Single-query null at t equal to one, requiring discrepancy exactly zero.
    - Monte Carlo cross-check of the hypergeometric miss probability at small N with a declared seed
      and a reported counting interval.
    - Direct subset enumeration at N equal to 12 verifying both closed forms exactly.
    - Degenerate control at t equal to N minus m, where the without-replacement miss probability must
      be exactly the reciprocal of a binomial coefficient and at t equal to N minus m plus one where
      it must be exactly zero.
    - A parallel floating-point recomputation reported only to show how many cells floating point
      rounds to zero.
    required_metrics:
    - exact with-replacement miss probability per cell
    - exact without-replacement miss probability per cell
    - signed bit discrepancy per cell at 40 significant digits
    - effective with-replacement query count per cell to three decimals
    - count of cells exceeding one tenth of a bit and count below 2 to the minus 20 bits
    - maximising cell over the grid
    - null-arm forced values
  falsification_conditions:
  - Any null returns a nonzero discrepancy.
  - Any cell shows a negative discrepancy, which is arithmetically impossible and voids the instrument.
  - Direct subset enumeration at N equal to 12 disagrees with either closed form.
  - The Monte Carlo cross-check falls outside its counting interval relative to the exact hypergeometric
    value.
  - Every cell falls below 2 to the minus 20 bits, falsifying the conjecture that a materially divergent
    shape exists in the named grid and closing with the obstruction and the parameter regions that
    would need to be added to reopen it.
  - The effective query count is not monotone in t at fixed N and m, indicating the bisection is mis-specified.
  confounders:
  - Floating-point evaluation of the log of near-equal probabilities destroys the discrepancy entirely;
    only exact rationals followed by high-precision decimal preserve it.
  - At t comparable to N the without-replacement probability hits zero exactly while the with-replacement
    one does not, producing an infinite discrepancy that must be reported as a boundary rather than
    as a number.
  - Confusing the corruption count m with the corruption rate m over N across cells of different N
    would make the table incomparable.
  - Adaptive corruption would invalidate the hypergeometric form entirely and is excluded, but a reader
    could apply the table outside that scope.
  - Repetition across query rounds adds bits only under independence; applying the additive rule to
    correlated rounds would misstate the accounting.
  interpretation_limits:
  - The table describes two sampling schemes in the abstract; no implementation is examined and none
    is claimed to use either scheme.
  - A conservative accounting is not a defect, and this record does not present the discrepancy as
    a weakness in any system.
  - The excluded adaptive-corruption case is where the object stops applying, and the table must not
    be used there.
  - No statement about any deployed, third-party or standardized argument system follows from any
    outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. Table generation is O(number of cells) exact binomial
      evaluations plus a bisection per cell, effectively instantaneous.
    memory_exponent: No attack memory exponent is claimed. Memory is O(1) beyond the printed table;
      large binomial coefficients are exact Python integers of modest size at the named grid.
    best_known: The incumbent is the standard practice of charging query-phase soundness as one minus
      (1 minus delta) to the t, that is, the with-replacement form, regardless of how the sampler
      is implemented. This record does not beat that practice; it computes the size of the gap it
      leaves at named shapes and supplies the effective-query-count conversion.
    hidden_overhead: 'Almost entirely human: fixing the grid so that it contains the regimes where
      t over N is non-negligible rather than only the comfortable small-t corner, and stating the
      adaptive-corruption exclusion clearly enough that the table is not applied where it does not
      hold. The t near N minus m boundary, where the without-replacement probability hits exactly
      zero, is the one place the arithmetic needs care rather than compute.'
  dominated_by: n/a (no result claimed). No solve, forgery or cost improvement is proposed, so no
    time, memory or query frontier row exists to compare; asserting null here would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a table of exact
    bit discrepancies and effective query counts at named shapes, with no cost comparison to any algorithm.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that both closed forms are correct and verifiable by enumeration
    and Monte Carlo: about 0.97, this is arithmetic. Part B, that the grid contains cells exceeding
    one tenth of a bit: about 0.9, since t over N of a few percent at moderate corruption rates makes
    the schemes diverge visibly and such shapes are constructible by choosing t and N. Part C, that
    any such cell corresponds to a parameter shape a real argument system would use, which is a much
    weaker claim I do not make and cannot check here: about 0.25. Part D, that the effective-query-count
    conversion becomes the reused form of this result elsewhere in the question: about 0.6.'
