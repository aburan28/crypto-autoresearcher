    - ref: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-9eda3a/red-team-report.yaml
      provenance: internal
      claim: >-
        OBJ-J2-002 states that the primary table of eprint 2010/016 explicitly
