idea:
  id: IDEA-20260829-4ee824
  question_id: RQ-SYMF-5ab172
  title: >-
    The comparable-axis set as the tracked object - exhibit that the committed
    dominance rule admits 3-cycles when the compared axis set is pair-dependent,
    measure whether the corpus sits in that regime, and test whether frontier
    status is decided by the null_reason label rather than by cryptanalysis
  class: measurement
  claim: >-
    Schema v2 defines dominance as "no worse on every COMPARABLE charged axis
    and strictly better on at least one", with nulls excluded from comparison.
    The comparable axis set is therefore a property of the PAIR, not of the
    corpus, and this proposal makes three claims about the consequences.
    (A) ALGEBRAIC, PROVED HERE, NO COMPUTE - the relation so defined is not a
    strict partial order, because a pair-dependent comparable set admits
    3-cycles. Witness over axes (time, memory, data), lower being better -
    A = (1, 9, null), B = (2, null, 1), C = (null, 1, 2). A versus B share only
    time, so A dominates B; B versus C share only data, so B dominates C; C
    versus A share only memory, so C dominates A. Every row has exactly two
    populated axes and every pair shares exactly one. Consequently
    "nondominated" is not the Pareto frontier of any order, all three rows are
    dominated so the nondominated set of that cell is EMPTY, and any
    implementation that resolves dominance greedily in row order produces an
    is_frontier vector that depends on the order rows were listed in.
    (B) EMPIRICAL, ABOUT THE REGIME - the committed corpus sits squarely in the
    regime where (A) can bite, because the J1 validation report recomputes 67
    rows times 6 axes = 402 cost slots of which 266 are null and 136 populated,
    a mean of 2.03 populated axes per row, which is exactly the witness's
    shape. The claim is that at least 0.60 of ordered same-key pairs are
    unresolved because of a null or an unnormalised value rather than because
    of a genuine Pareto tradeoff.
    (C) EMPIRICAL, ABOUT ANNOTATION - the schema gives the two most common null
    labels OPPOSITE effects on frontier status. A not_stated_by_source null
    SHIELDS a row, because a missing axis can never create a favourable
    ordering against it; an unresolved_transcription null DISQUALIFIES it,
    because anti-laundering rule 7 forbids canonical is_frontier=true on such a
    row. The corpus carries 195 of the first and 29 of the second. The claim is
    that flipping ONE null_reason label on ONE axis of one row flips
    is_frontier for at least 3 rows of the 67, i.e. that frontier membership is
    decided in measurable part by an annotator's account of WHY a number is
    missing. The committed record already contains the mechanism - the red team
    found (OBJ-J2-002) that the full-MD4 no-precomputation row's memory 2^64 is
    stated explicitly in the source Table 1, while the producer recorded the
    axis as unresolved_transcription, and the validator recorded that row as
    frontier_eligible_under_frozen_rule false in consequence.
  mechanism: >-
    TRACKED OBJECT. The object followed through the computation is the
    COMPARABLE-AXIS SET of an ordered pair of rows together with the sign
    vector on it - the subset S of the six charged axes on which both rows
    carry values the committed rules permit ordering, and for each axis in S
    whether the first row is better, worse, or equal. One-step propagation is
    defined and exactly measurable - populating an axis from the source,
    relabelling a null_reason, or normalising a unit adds or removes exactly
    one element of S, and the dominance verdict is recomputed from S and the
    sign vector alone.
    LOSSY-PROJECTION TEST (algebraic, no compute). The projection
    (row pair) -> (S, sign vector on S) discards both rows' identities, their
    primitives, their methods, their provenance, the magnitudes on every axis,
    and every axis outside S. It is strictly, massively lossy - two pairs
    forty bits apart in time map to the same object. The discard is compatible
    with the target's operation in the strongest possible sense - schema v2's
    dominance verdict is LITERALLY A FUNCTION OF THIS OBJECT AND NOTHING ELSE
    ("no worse on every comparable charged axis and strictly better on at least
    one"), so the retained part not only propagates deterministically, it is
    exactly the operation's argument. Not a change of coordinates - the fibre
    over one (S, sign vector) is enormous and its contents are unrecoverable.
    WHY (A) IS A RESULT AND NOT A COMPLAINT. Pareto dominance over a FIXED axis
    set is a strict partial order, and its nondominated set is well defined
    independent of evaluation order. That property is not inherited when the
    axis set varies by pair, because the relation is then not the restriction
    of a single order. The three-row witness above is a complete proof that the
    committed rule as written admits cycles; it costs no compute and it can be
    checked by reading. What is NOT claimed is that the committed corpus
    contains a cycle - that is measurement (B), and the honest prior is that at
    the committed key granularity there are too few evaluated comparisons for
    one to appear, which is itself the finding IDEA-20260829-9aaa40 predicts
    from the other direction.
    WHY (B) DISCRIMINATES BETWEEN THE TWO LIVE DIAGNOSES. The frontier compares
    almost nothing. There are exactly two candidate explanations and they are
    separable by counting. D1 - THERE ARE NO PEERS - most rows are alone in
    their comparison-key cell, so no comparison is ever attempted (this is
    IDEA-20260829-9aaa40's singleton hypothesis). D2 - THERE ARE PEERS BUT
    EVERY COMPARISON DIES ON A NULL - pairs share a key and are then declared
    unresolved because a charged axis is missing or unnormalised. The
    predicted signatures are disjoint. Under D1 the count of same-key ordered
    pairs is near zero and the null structure is irrelevant. Under D2 the count
    is nonzero and the resolution-blocked fraction is high. The corpus's own
    numbers make D2 live - the validator's dominance_recomputations record
    FOUR same-key groups whose verdict is a form of "not orderable", including
    "not mechanically orderable" for the SHA-0 pair (2^15 160-bit words versus
    the unquantified word "negligible") and "memory unresolved" for the MD4
    pair. Both diagnoses can hold simultaneously; the deliverable is their
    relative size, which decides whether the repair is key normalisation or
    source re-reading.
    WHY (C) IS AN ABLATION AND NOT AN OPINION. The null_reason vocabulary is
    the one enumerated vocabulary the schema does supply (five values), and the
    choice among them is an annotator judgment about the WORLD (did the source
    state this) that the rules convert into a judgment about the ROW (may this
    row be frontier). Single-label relabelling is therefore a well-defined
    one-step move on the tracked object, its effect on is_frontier is
    mechanically recomputable, and its null object is immediate - relabelling a
    not_applicable null (the queries axis of a hash row, 41 such slots exist)
    must change nothing, because that axis is not charged for that primitive
    class.
    WHY THE MEMORY AXIS NEEDS A TYPE BEFORE ANY OF THIS IS TRUSTWORTHY. S is
    defined by "axes the rules permit ordering", and that permission is
    currently decided ad hoc. The J1 report states plainly that the schema does
    not standardize populated cost encoding and that FOUR encodings occur in
    practice - value, log2, components, lower_bound. The memory axis is the
    worst case - the corpus and its sources carry 2^15 160-bit WORDS, 2^64 and
    2^77 with no stated unit, "at least 1 TB RAM", "two 2-TB drives in RAID",
    "list length 2^d with roughly n+d bits per entry", and the bare word
    "negligible". These are not values of one axis; they are values of several.
    This proposal therefore carries a TYPE CENSUS of every populated cost cell
    along three coordinates - dimension (words, bits, bytes, blocks, entries,
    devices, unstated), quantifier form (exact, lower bound, interval,
    parameterised, qualitative, prose), and access pattern (sequential, random,
    negligible, unstated) - and reports how many same-key pairs are
    type-incompatible on an axis they are currently compared on. The
    access-pattern coordinate is taken from IDEA-20260829-d29588's separating
    condition, which proposed it as a schema recommendation; here it is
    measured rather than recommended.
  tracked_object: >-
    The comparable-axis set of an ordered pair of rows, with its sign vector -
    the exact argument schema v2's dominance verdict is a function of -
    propagated by single-axis moves (populate a value, relabel a null_reason,
    normalise a unit, assign a type).
  lossy_projection_test: >-
    PASSES, in the strongest form available in this question. The projection
    (row pair) -> (comparable axis set, sign vector) is many-to-one and
    non-invertible (identities, magnitudes and all non-compared axes are
    discarded), and what it retains is not merely compatible with the target
    operation but is precisely that operation's argument, since the committed
    dominance rule reads nothing else. Not a change of coordinates.
  novelty_status: unverified
  citations:
    - ref: coordination/goals/GOAL-SYMF-c00fa1/batches/BATCH-303ce8/reviews/TASK-20260825-bb6d5d/validation-report.yaml
      provenance: internal
      claim: >-
        null_reason_accounting reports axis_slots 67 rows x 6 axes = 402,
        null_axis_count 266, populated_axis_count 136, and by_reason
        incompatible_unit_not_normalized 1, not_applicable 41,
        not_stated_by_source 195, unresolved_transcription 29, with
        invalid_or_missing_reason_count 0, and notes that the frozen schema
        does not standardize populated cost encoding, observed encodings being
        value, log2, components and lower_bound. dominance_recomputations
        record four target-qualified same-key groups with verdicts "no
        dominance", "not mechanically orderable" (2^15 160-bit words versus
        unquantified "negligible") and two further "no dominance" tradeoffs.
        Row LEGACY-MD4-PREIMAGE-NOPRECOMP carries unresolved_transcription on
        memory, frontier_eligible_under_frozen_rule false and declared
        is_frontier false, while LEGACY-SHA1-IP-COLLISION-THEORY carries four
        not_stated_by_source nulls, one populated axis,
        frontier_eligible_under_frozen_rule true and declared is_frontier true.
        Defect D-DOM-002 records a qualitative memory ordering presented as
        arithmetic.
      verified_by: >-
        idea-generator subagent, 2026-08-29, Read tool, PARTIAL READ - lines
        1-1129 of 2256 read in full (header, artifact checks, normalization,
