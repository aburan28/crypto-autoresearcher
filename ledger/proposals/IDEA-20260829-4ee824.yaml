    - ref: "Pareto dominance over a fixed objective set is a strict partial order (standard multi-objective optimization)"
      provenance: recalled
      claim: >-
        Relied on only for the contrast that makes claim (A) meaningful -
        componentwise dominance over a FIXED set of objectives is irreflexive,
        asymmetric and transitive, so its nondominated set is order-independent.
        The witness in the mechanism block is self-contained and does not
        depend on any external source.
      verified_by: null
      note: >-
        NOT READ THIS SESSION. Recalled as textbook background. The proposal's
