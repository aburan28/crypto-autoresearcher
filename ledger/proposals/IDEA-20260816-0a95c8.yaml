idea:
  id: IDEA-20260816-0a95c8
  question_id: RQ-ARGON-141710
  added: '2026-08-16'
  title: 'Two candidate causes produce the same observable: build one synthetic variant with the RFC
    window structure and a uniform within-window draw, and another with a full-history window and
    the RFC offset transform, so the back-distance shape and any depth effect are attributed to segment
    geometry or to the transform rather than to whichever was named first.'
  class: mechanism
  claim: '(A) H-ARGON-ef2f0b''s mechanism attributes weak per-lane depth robustness to one specific
    cause: the RFC 9106 within-window offset transform concentrates reference targets toward recently
    computed blocks, so bridging edges are short and a modestly spaced removal set severs most of
    them. That is a causal claim with a named mechanism, and its stated precondition is a KS test
    showing the within-window offset is non-uniform. (B) The claim of this record is that the precondition
    does not identify the cause, because a second mechanism produces a qualitatively identical observable.
    The candidate window itself is not the whole prior history: it is bounded by the segment and slice
    geometry, it grows within a pass and resets at boundaries, and in the first pass it is a small
    and growing prefix. A perfectly UNIFORM draw from that geometry already produces short back distances
    early in the computation and a sawtooth in the back-distance profile. The observable -- short,
    position-dependent back distances -- is therefore consistent with two distinct preimages, which
    is exactly the observation-collision failure inventor-protocol section 8 audit two asks to be
    searched for before a mechanism is believed. (C) The claim is that the collision is resolvable
    by construction, at low cost, with two synthetic hybrids that hold one cause fixed while destroying
    the other: HYBRID A keeps the RFC candidate-window geometry exactly and replaces the offset transform
    with a uniform draw over the window; HYBRID B keeps the offset transform''s shape exactly and
    applies it over a full-history window with no segment structure. Measuring the back-distance profile
    and the depth-reducing-set size on the real graph and both hybrids decomposes the effect into
    a geometry component and a transform component, additively or otherwise, and reports which dominates.
    (D) WHAT IS NOT CLAIMED: no claim that H-ARGON-ef2f0b''s mechanism is wrong -- it may be entirely
    right, and this record''s most likely outcome is that the transform component is real but smaller
    than the geometry component. No claim about Argon2''s security, no attack, no parameter statement,
    and no claim that either hybrid is a design anyone should build; the hybrids are measurement instruments
    and exist only inside the harness. (E) The named way the accounting flatters the defender: attributing
    an effect to the cryptographic indexing rule rather than to the segment geometry credits the design''s
    cryptographic content with structure that its scheduling constraints already impose, and the scheduling
    constraints exist for parallelism reasons rather than for hardness reasons.'
  mechanism: 'STAGE 1: build four objects at matched (t, q, p=1) with byte-identical downstream code.
    REAL: RFC window geometry plus RFC offset transform. HYBRID A: RFC window geometry plus uniform
    within-window draw. HYBRID B: full-history window plus the RFC offset transform''s shape rescaled
    to the full history. NULL: full-history window plus uniform draw, which is the double-destruction
    control and the natural zero of the decomposition. STAGE 2: measure the back-distance profile
    for all four -- mean, median and full distribution as a function of position within the pass --
    so the sawtooth from segment geometry is visible or absent per object. STAGE 3: measure the depth-reducing-set
    size for all four with the lane''s existing greedy instrument at the declared threshold. STAGE
    4: decompose. Define the geometry component as the difference between HYBRID A and NULL, the transform
    component as the difference between HYBRID B and NULL, and the interaction as REAL minus NULL
    minus both components. Report all three with their spreads over independent draws. STAGE 5: run
    the section 8 audit-two check formally: the decomposition either separates the two preimages,
    in which case the observation collision is resolved and the record names which cause dominates,
    or it does not, in which case the two mechanisms are not distinguishable by this observable and
    any mechanism attribution in this lane is under-determined -- which is a bound on the lane''s
    whole explanatory vocabulary and is more valuable than a number. STAGE 6: check the structural
    tell -- the geometry component should shrink as the pass proceeds and the window grows toward
    the full history, while the transform component should not, and a geometry component that is flat
    across positions is the artifact signature.'
  novelty_status: unverified
  novelty_screen:
    method: Read H-ARGON-ef2f0b in full, especially its mechanism steps (1) through (3) and its KS-test
      precondition prediction; read EV-ARGON-209ece in full including unresolved_confounds; read the
      inputs and objective blocks of experiments/EXP-ARGON-2608c2/specification.yaml; grep -l RQ-ARGON-141710
      ledger/proposals/*.yaml and read all ten titles and classes; grep -ril for candidate window,
      slice boundary, offset transform, back-distance across ledger/proposals/ and ledger/hypotheses/;
      read docs/inventor-protocol.md section 8 audit two on observation collision.
    results: IDEA-20260812-318db8 and H-ARGON-ef2f0b own the recency-bias mechanism entirely, and
      H-ARGON-ef2f0b's own text names the offset transform as the load-bearing tested-not-assumed
      premise, with a KS test on z_j/W(j) against Uniform[0,1) as the declared precondition. That
      precondition tests whether the transform is non-uniform; it does not test whether non-uniformity
      of the transform, rather than the geometry of W(j), produces the depth effect. The term candidate
      window hits only IDEA-20260812-318db8 and H-ARGON-ef2f0b; the term slice boundary returns zero
      hits repository-wide. EXP-ARGON-2608c2 constructs exactly two objects, G_real and G_unif, where
      G_unif is window-matched -- which is precisely this record's HYBRID A. So one of the four objects
      already exists in the lane's plans as a null; what does not exist is HYBRID B, the double-destruction
      NULL, or any decomposition among them. H-ARGON-ef2f0b's proof_search_map is filled with a not_applicable_reason
      on the grounds that it is an empirical measurement rather than a proof-oriented record, so section
      8's audit two was never run against its mechanism claim.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature on memory-hard-function indexing
      or on which structural feature drives depth robustness. What is claimed new within this repository
      is the explicit two-preimage decomposition, the construction of HYBRID B and the double-destruction
      NULL, and running inventor-protocol section 8 audit two against a mechanism claim that was exempted
      from it as non-proof-oriented. Assembled from known parts: HYBRID A is EXP-ARGON-2608c2''s existing
      G_unif under another name, the measurement instrument is the lane''s existing greedy heuristic,
      and factorial decomposition is elementary. The contribution is noticing that the existing design''s
      single null cannot distinguish the two causes and that a second hybrid costs almost nothing
      to add.'
  object_first_candidate:
    tracked_object: The back-distance j - r(j), followed as a position-indexed distribution across
      the computation, and decomposed into the contribution of the window's support geometry and the
      contribution of the selection density within that support.
    lossiness: 'The projection discards the identity of the target and keeps only how far back it
      lies, and then discards the joint structure across positions and keeps per-position marginals.
      It is genuinely lossy: two graphs with identical back-distance profiles can differ in whether
      their long edges are clustered or spread, which is exactly the property depth robustness responds
      to. The record therefore carries an explicit joint-structure secondary metric -- the correlation
      between adjacent positions'' back distances -- rather than pretending the marginals are the
      whole object. What survives and propagates deterministically is the support-times-density factorization:
      at every position the back distance is a draw from a density over a support, and the two hybrids
      sever exactly one factor each, which is what makes the decomposition well-defined rather than
      a fitting exercise.'
    propagation: One step appends block j with a reference edge whose back distance is drawn from
      a density supported on the candidate window W(j). The support changes with j by the segment
      and slice rules and resets at boundaries; the density changes with j only through the rescaling
      of the transform to the current window. So one step is a draw from support(j) times density(j),
      and the four objects differ precisely in which of the two factors is replaced by its structureless
      counterpart. Because the factorization is exact rather than approximate, the decomposition in
      stage 4 is a statement about the construction rather than an inference from the data, and the
      only inferential step is whether the measured components add.
    survival_score: 'The decomposition is defined at every position for every object. What can dissolve
      is SEPARABILITY: if the interaction term REAL minus NULL minus both components is comparable
      in size to the components themselves, the two causes do not decompose and the concrete survival
      statement is the position range over which the interaction stays below a declared fraction of
      the larger component. Reporting that range, rather than a single decomposition, is the honest
      form of this axis and is what the record commits to.'
  null_object_control: 'The double-destruction NULL -- full-history window with a uniform draw --
    is the zero of the decomposition and is the random object of the same shape in the strict sense:
    same node count, same edge count, same one-reference-edge-per-block structure, no window geometry
    and no transform. Every one of the four objects is measured by identical code in the same invocation.
    For the decomposition to mean anything the NULL must show a flat back-distance profile with no
    sawtooth and no position dependence beyond the trivial growth of available history; if the NULL
    shows a sawtooth, the sawtooth is being introduced by the harness rather than by the geometry
    and everything downstream is invalid. Additionally, each of the four objects is drawn twenty times
    independently so that every reported component carries a spread, and a component smaller than
    its own spread is reported as not measurable rather than as small.'
  discriminated_from:
  - H-ARGON-ef2f0b and IDEA-20260812-318db8 attribute the depth effect to the offset transform and
    test the transform's non-uniformity as a precondition. This record does not test that hypothesis
    and does not dispute it; it tests whether the observable the hypothesis reads can distinguish
    the transform from the window geometry at all, which is a prior question the hypothesis's own
    precondition does not address.
  - EXP-ARGON-2608c2 already constructs a window-matched uniform null, which is this record's HYBRID
    A. The difference is the addition of HYBRID B and the double-destruction NULL, which turn a single
    comparison into a decomposition; without them the existing contract can measure that a difference
    exists but cannot say which of two structural features produced it.
  - The companion null-family record in this batch varies the null across four randomization schemes
    to measure how much of rho is denominator-determined. That varies the comparison object; this
    varies the SIGNAL object by severing one causal factor at a time, and the two answer different
    questions.
  - IDEA-20260809-b9e9cc studies parallelism and lane structure. Segment geometry appears there as
    a consequence of p, whereas here it appears at p=1 as the within-pass slice structure, and no
    lane crossing is involved.
  - A generic ablation study. Each of the two hybrids is constructed to sever exactly one factor of
    an exact support-times-density factorization, so the decomposition is defined by the construction
    rather than fitted after the fact.
  assumptions:
  - KN-LIT-7f3c21's segment, slice and candidate-window rules are accurately implemented, including
    the reset behaviour at boundaries; these were among the claims independently spot-checked per
    EV-ARGON-209ece, though the record notes that the exact numeric form of the offset transform was
    flagged there as RECALLED-imprecise and must be read afresh.
  - Rescaling the offset transform's shape to a full-history window in HYBRID B is a faithful way
    to preserve the density and destroy the support restriction; alternative rescalings exist and
    the choice is declared, not derived.
  - The support-times-density factorization is exact for all four constructions, which it is by how
    they are built.
  - The lane's existing greedy instrument is used unchanged, so its approximation error is common-mode
    across the four objects and largely cancels in differences, though not exactly.
  - p=1 and toy q, as elsewhere in this lane.
  predictions:
  - metric: geometry component of the depth-reducing-set size, defined as HYBRID A minus NULL
    direction: different
    minimum_effect: nonzero and outside the twenty-draw spread; the pre-committed claim is that the
      geometry alone produces a measurable effect, which is the whole basis of the observation collision
  - metric: ratio of the transform component to the geometry component
    direction: lower
    minimum_effect: below 1.0, that is, geometry dominates the transform. This is the record's central
      and most falsifiable prediction and it directly contradicts the emphasis of the lane's existing
      mechanism narrative.
  - metric: interaction term, REAL minus NULL minus both components, relative to the larger component
    direction: lower
    minimum_effect: below 0.25 in absolute ratio, so that the decomposition is approximately additive
      and the two causes separate; above that the record reports non-separability rather than a decomposition
  - metric: sawtooth amplitude in the back-distance profile of the double-destruction NULL
    direction: lower
    minimum_effect: indistinguishable from zero, a forced value; a sawtooth in the NULL means the
      harness introduces it and halts the run
  minimal_test:
    design: 'Four objects, one code path, matched sizes. At p=1, t in {1, 3}, q in {1024, 4096}, and
      variants Argon2i and Argon2id, construct REAL, HYBRID A, HYBRID B and NULL as reference-target
      arrays differing only in support rule and density rule. Draw twenty independent realizations
      of each. Measure, with identical functions: the back-distance distribution as a function of
      position within the pass, the sawtooth amplitude at slice boundaries, the greedy depth-reducing-set
      size at the 50-percent threshold, and the exact native depth. Compute the geometry component,
      the transform component and the interaction, each with a spread from the twenty draws. Verify
      the NULL shows no sawtooth before reading anything else. Report the component ratio and the
      position range over which the interaction stays below a quarter of the larger component. The
      four constructions differ by a few lines each, and the compute is eighty greedy passes per cell,
      which at q=4096 is minutes.'
    controls:
    - Double-destruction NULL with a forced flat back-distance profile and no sawtooth, gating everything
      downstream.
    - Twenty independent draws per object per cell, so that every component carries a spread and unmeasurable
      components are reported as such.
    - Identical measurement code across all four objects, verified by measuring one object through
      two entry points.
    - 'The structural tell: the geometry component must shrink as the window grows toward full history
      within a pass, and a flat geometry component across positions is the artifact signature.'
    - HYBRID A cross-checked against EXP-ARGON-2608c2's G_unif construction, since they should be
      the same object and a disagreement would reveal a specification divergence between contracts.
    required_metrics:
    - back-distance distribution by position, per object
    - sawtooth amplitude at slice boundaries, per object
    - greedy depth-reducing-set size, per object and draw
    - geometry component, transform component and interaction, each with twenty-draw spread
    - position range over which the interaction stays below a quarter of the larger component
    - adjacent-position back-distance correlation, per object
  falsification_conditions:
  - The geometry component is indistinguishable from zero, meaning the window geometry alone produces
    no effect, the observation collision does not arise, and the lane's existing mechanism attribution
    stands unchallenged -- a clean and reassuring outcome for the existing hypothesis.
  - The transform-to-geometry component ratio exceeds 1.0, falsifying this record's central prediction
    and confirming the transform as dominant.
  - The interaction exceeds a quarter of the larger component across most positions, meaning the two
    causes do not separate and no decomposition may be reported.
  - The double-destruction NULL shows a sawtooth, invalidating the harness.
  - HYBRID A disagrees with EXP-ARGON-2608c2's G_unif construction, revealing that two contracts in
    the same lane build different objects under one name.
  confounders:
  - The rescaling choice in HYBRID B is not unique, and a different rescaling that preserves the transform's
    shape differently could shift the transform component; the choice is declared and one alternative
    is carried through as a sensitivity check.
  - The greedy heuristic's approximation error may not be common-mode across objects with different
    back-distance profiles, which would contaminate the differences that define the components.
  - At small q the window is a large fraction of the array, so HYBRID A and NULL converge by construction
    and the geometry component shrinks for a reason unrelated to the mechanism.
  - Slice-boundary resets interact with pass boundaries at t>1 in a way that could produce a sawtooth
    at two frequencies, and reading only one would misattribute the geometry component.
  - For Argon2id the split point means part of the graph is Argon2i-style and part Argon2d-style,
    so a single decomposition for that variant mixes two regimes and must be reported split.
  interpretation_limits:
  - A decomposition into geometry and transform components is a statement about this construction
    and this observable, and does not establish that either feature causes anything in a design sense.
  - Nothing here refutes or confirms H-ARGON-ef2f0b's hypothesis; it bounds what that hypothesis's
    observable can identify.
  - All depth-reducing-set numbers remain heuristic upper bounds inherited from the lane's existing
    instrument.
  - p=1 and toy q only; no statement about recommended parameters or multi-lane graphs.
  - The hybrids are measurement instruments and are not designs; no property of a hybrid is a property
    of anything deployable.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement is one greedy pass per graph, O(q^2)
      worst case, over eighty graphs per cell.
    memory_exponent: No attack exponent is claimed. Each graph is O(q) integers.
    best_known: The incumbent explanation inside this repository is H-ARGON-ef2f0b's mechanism, which
      attributes weak per-lane depth robustness to the RFC offset transform's recency concentration,
      with a KS test on within-window uniformity as its declared precondition. There is no incumbent
      decomposition, because no record here separates the transform from the window geometry.
    hidden_overhead: 'The rescaling of the transform to a full-history window in HYBRID B is where
      the hidden work is: it looks like a one-line change and it is the step most likely to be done
      in a way that quietly destroys the density''s shape along with the support, which would make
      the transform component an artifact of the construction rather than a measurement.'
  dominated_by: 'n/a (no result claimed). Pareto check performed: the ten proposals under RQ-ARGON-141710
    were enumerated and read by title and class, EV-ARGON-209ece is a proposal review with no measurement,
    and experiments/EXP-ARGON-2608c2/runs/ is empty, so no time, memory or data/query frontier row
    exists under this question for anything to dominate. On the explanatory axis the incumbent mechanism
    is an unmeasured attribution rather than a measured result, so it occupies no frontier row either.'
  sota_delta: No attack; mechanism-identification contribution only. The quantitative delta is the
    ratio of the transform component to the geometry component, a number that does not exist anywhere
    in this repository and whose absence means the lane's central mechanism claim is currently attributed
    rather than measured. If the ratio comes in above 1.0 the delta is a direct confirmation of the
    incumbent attribution at low cost, which is equally worth having.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the four objects can be constructed cleanly and the NULL shows no
    sawtooth: high, around 0.85, with the residual risk concentrated in the HYBRID B rescaling. That
    the geometry component is measurably nonzero: high, around 0.8, since a growing prefix window
    forces short back distances early regardless of any transform. That geometry dominates the transform,
    the record''s central prediction: moderate, around 0.5, stated at genuine uncertainty because
    the transform''s concentration is real and could easily be the larger term -- and either outcome
    resolves the observation collision, which is why the prediction is worth pre-committing. That
    the decomposition is approximately additive with a small interaction: moderate, around 0.55, since
    depth robustness is a strongly nonlinear functional of the edge set and additivity is not guaranteed.'
