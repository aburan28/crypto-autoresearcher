  source_refs:
  - ref: FIPS 205 (SLH-DSA) parameter sets and FORS index derivation
    status: named_but_not_read_this_session
  - ref: ITSR-style multi-target analysis of the FORS layer
    status: recalled_unverified
  - ref: IDEA-20260805-fbe36a, IDEA-20260805-705614, IDEA-20260801-009
    status: internal_committed
  proof_search_map:
    bottleneck: The union/independence step in the FORS multi-target argument - the only place
      in the FORS term where a bound replaces an exactly computable quantity.
    baseline_embedding:
      parameter_slice: q signatures forced disjoint by construction, which must reproduce
        the independent product exactly.
      reproduction_check: symbolic, frozen before numerics.
    observation_collision:
      observable: the coverage probability.
      distinct_preimage_search: Two parameter sets with the same coverage probability but
        different (k, a) are expected and are informative - they are exactly the pairs among
        which a signature-size optimisation can choose.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: the per-tree occupancy vector and its Poissonisation
      predicted_gain: An exact value in place of a bound, in O(k*q) arithmetic.
    quantifier_order: FOR ALL six FIPS 205 parameter sets and FOR ALL q in a stated range,
      THERE EXISTS an exactly computable P_cov(q, k, a) such that the FORS multi-target advantage
      equals P_cov up to the inherited random-oracle idealisation. Note the inheritance -
      the idealisation is the scheme's own, not an extra assumption introduced here.
    method_ceiling:
      strongest_certifiable_claim: '"within the random-oracle idealisation, the FORS coverage
        term equals P_cov exactly, and the deployed bound exceeds it by d bits." It can never
        say anything about the concrete hash function.'
      nearby_object_control: A parameter set with k = 1 has no cross-tree correlation at all,
        so the exact value must coincide with the independent product there - a free internal
        consistency check.
    proof_obligations:
    - claim: exact coverage probability derivation
      responsibility: correctness
    - claim: independent product recovered on disjoint signatures
      responsibility: baseline
    - claim: de-Poissonisation error
      responsibility: strictness
    - claim: bits of slack at deployed sets
      responsibility: size
    - claim: FORS-layer-only scope stated wherever d is quoted
      responsibility: scope
    not_applicable_reason: null
