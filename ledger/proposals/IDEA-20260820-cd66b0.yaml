idea:
  id: IDEA-20260820-cd66b0
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Marginal-preserving programmable-challenge fork coupling audit
  class: simulator_diagnostic
  claim: >-
    Coupling two simulator runs on one public commitment while preserving each
    challenge marginal may test whether the declared joint fork law is
    reproducible. This proposal does not claim that an exploitable fork exists.
  mechanism: >-
    Freeze one public commitment and draw a pair of challenges from a coupling
    whose individual marginals equal the reference challenge distribution.
    Compare a public joint statistic of the two responses with the statistic
    produced by two coupled simulator invocations. The planted positive keeps
    both challenge marginals unchanged but correlates the wrong public
    conversion-choice label across the pair.
  novelty_status: unverified
  status: proposed
  corrects: IDEA-20260820-054b40
  supersedes: IDEA-20260820-054b40
  correction: >-
    Preserves the predecessor's marginal-preserving fork coupling and
    conversion-choice planted positive. Adds task-bound provenance and replaces
    unsupported GRH language with KN-TECH-058's exact boundary: inherited
    reductions and heuristics are unverified and confer no result here.
  source_refs:
    - ref: IDEA-20260820-054b40
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: immutable corrected predecessor
    - ref: KN-TECH-058
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: baseline and unverified-reduction caveats only
    - ref: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: question scope
  predictions:
    - id: P1
      statement: Under the true-simulator null, a frozen paired statistic rejects in at most 5% of 100 repetitions.
    - id: P2
      statement: At planted pair-correlation rho=0.20, power is at least 80% in 100 repetitions at the preregistered q.
    - id: P3
      statement: Each empirical challenge marginal remains within total-variation distance 0.02 of the reference marginal.
  controls:
    true_simulator_null: Generate both branches with the declared simulator under the same frozen public commitment and reference coupling.
    planted_positive: Correlate the wrong conversion-choice label at rho=0.20 while exactly preserving each challenge marginal.
    observation_collision: Hold public commitment and challenges fixed while varying hidden simulator coins; only public response pairs enter the statistic.
    nearby_object: Repeat on a matched response encoder whose pair is independently sampled conditional on each challenge.
  falsification_conditions:
    - Null rejection exceeds 0.05 beyond Monte Carlo error.
    - Either challenge marginal changes by total variation more than 0.02.
    - Power against rho=0.20 is below 0.80.
    - The statistic requires hidden coins or retry counts.
  confounders:
    - accidental marginal distortion by the coupling sampler
    - commitment reuse outside the declared simulator semantics
    - dependence introduced by shared pseudorandom-generator state
    - post-selection of pair statistics
  interpretation_limits:
    - Failure localizes a joint-law mismatch, not a forgery or secret recovery.
    - Passing covers only the frozen coupling and statistic family.
    - Hard-problem conclusions under GOAL-SSI-001 remain out of scope.
  heuristic_assumptions:
    - The public commitment may be frozen consistently in both evaluated generators.
    - The coupling sampler preserves challenge marginals to the declared tolerance.
    - KN-TECH-058 reductions and heuristics remain inherited and unverified.
  target_complexity:
    time: O(q * C_sim)
    memory: O(1) streaming statistics
    data: 2q responses over q coupled challenge pairs
    scope: one frozen public commitment per repetition
  cost_model:
    time: two simulator calls and one verifier replay per pair
    memory: streaming pair-statistic state
    data: q coupled pairs per condition
    preprocessing: freeze commitment construction, coupling matrix, statistic, and thresholds
    oracle_access: declared simulator or transcript generator only
    verification: audit empirical marginals and replay both public responses
  proof_search_map:
    exact_baseline_reproduction: Enumerate a toy challenge space and reproduce the exact joint null law.
    observation_collision_search: Vary hidden coins at fixed public pair and confirm statistic invariance.
    quantifier_order_statement: Freeze commitment, coupling, and test before response generation.
    method_ceiling: Record that marginal agreement cannot establish joint-law agreement outside the chosen coupling.
    nearby_object_control: Use a matched independently encoded response pair with identical marginals.
  nearest_neighbors:
    - IDEA-20260820-054b40
    - IDEA-20260820-c69c74
  dominated_by: n/a (no result claimed)
  sota_delta:
    metric: claimed SQIsign attack success probability
    baseline: 0
    proposed: 0
    delta: 0
    units: probability
    rationale: audit proposal only
  recommended:
    next_test: Exact toy coupling enumeration, then frozen null and rho=0.20 positive calibration.
    stopping_rule: Stop at the preregistered q and 100 repetitions per condition.
    required_artifacts: [coupling_matrix, marginal_audit, simulator_inputs, raw_pair_statistics, seeds]

