  assumptions:
    - >-
      The committed qt_family.json carries c4(t), c6(t), the discriminant and the
      eight sections, and the nine base points are recoverable from
      EV-ECQ-0d142e OBS-1 and the committed artifacts, so the plane model needed
      for the line construction can be rebuilt exactly. If the plane model cannot
      be rebuilt from committed state, the design stops and reports an input gap
      rather than reconstructing it by guesswork.
    - >-
      Every constructed point is verified on the exact specialised curve in exact
      rational arithmetic by an implementation sharing no code with the
      constructor. Nothing in this design is believed on the strength of the
      algebra alone.
    - >-
      Independence of a constructed point from the eight specialised sections is
      established numerically by a 9x9 Neron-Tate regulator at two precisions,
      never by the anti-invariance argument, which motivates but certifies
      nothing.

  proof_search_map:
    bottleneck: >-
      Producing a rational point on E_t beyond the eight specialised sections.
      EV-ECQ-0d142e shows this step is the whole campaign: 84 of 140 descents
      censored, all 83 censored fibres reporting exactly the section floor, and
      the censor identified as specialised coefficient size. Removing this step
      means obtaining the extra point WITHOUT a descent and WITHOUT a search over
      t, which is exactly what a solvable residual conic does.
    baseline_embedding:
      parameter_slice: >-
        THE LINE THROUGH TWO BASE POINTS. Then C_t restricted to the line factors
        as (s - s_i)(s - s_j)(linear), the residual is a SINGLE point, it is
        rational on every fibre, and it is one of the eight sections. So the
        existing eight-section certificate is the exact k = 0 parameter slice of
        the same construction, not a lookalike: the construction must reproduce
        the known sections when the line degenerates to a two-base-point line.
      reproduction_check: >-
        Symbolic, plus a frozen fixture. (i) For each of the 36 lines through two
        of the nine base points, run the constructor and require it to return a
        point that equals, as a polynomial identity in t, one of the eight
        committed sections or a Z-combination of them. (ii) Recompute the
        committed 137-fibre rank histogram from certified_curves.json (sha256
        a342ff9c...d15aee) and require exact agreement. A pipeline failing either
        may not report a constructed point.
    observation_collision:
      observable: >-
        "The conic w^2 = D_i(t; m) has a rational point", and the constructed
        pair (t0, Q) it yields.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE CENTRAL INTERPRETIVE DANGER, exhibited
        in advance. The observable fires identically for (a) a genuinely new
        point Q independent of the eight sections - the case that matters - and
        (b) a point Q that is already in the Z-span of the eight specialised
        sections, or is a torsion translate, or is 2 times an existing point.
        Both give a rational residual and both look identical at the level of the
        discriminant. The two are distinguished only downstream, by an exact
        9 x 9 regulator on the specialised curve, and this record therefore never
        counts a solvable conic as an excess. A second, weaker collision: two
        different lines through the same base point can yield the same point Q at
        the same t - but the line through p_i and Q is unique, so this collision
        is actually EMPTY, the map from (m, t0) to Q is injective for fixed i,
        and the design checks that, which is what makes the per-base-point
        parameterisations honest counts rather than multisets.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "find a rational point on the elliptic curve E_t" - for which
          this program's only instrument is 2-descent, measured at 60 percent
          censoring - by "find a rational point on the genus-0 curve
          w^2 = D_i(t; m)", where the hypothesis becomes local solvability of a
          conic, decidable exactly and parameterisable constructively.
        predicted_gain: >-
          The k = 1 step drops from an exponential-in-height search with a
          censoring instrument to a polynomial-time decision plus a substitution,
          and the produced point is exhibited, so it is an unconditional lower
          bound with no descent anywhere in its provenance.
      - transform: specialization_pack
        proposed_object: >-
          A resource measure counting, per unit of wall clock, the number of
          DISTINCT fibres carrying k independent constructed points, charged over
          provably disjoint blocks of the (i, m) index set and over disjoint
          height bands of t, so no fibre is counted twice across base points.
        predicted_gain: >-
          A cost exponent gamma comparable, in the same units of certified
          fibres, against the blind-sieve exponent beta that
          IDEA-20260829-1348a3 measures.
      - transform: observable_fiber
        proposed_object: >-
          Hold the constructed point fixed and vary the forgotten structure
          (which line, which base point, which conic parameterisation). The
          intrinsic invariant that survives is the point's class modulo the
          section lattice - which is the only thing that matters for rank.
        predicted_gain: >-
          Prevents double counting the same excess unit reached by different
          lines, which is exactly how a constructive route manufactures a fake
          rank gain.
    quantifier_order: >-
      FROZEN BEFORE ANY CONIC IS SOLVED. FOR ALL base points p_i in the declared
      set of nine and FOR ALL slopes m in the declared finite box, THERE EXISTS a
      decision procedure returning either "no rational point" or an explicit
      rational parameterisation of K_{i,m}; and THEN, FOR ALL t0 in the image of
      that parameterisation outside the twelve bad fibres, THERE EXISTS an
      explicit rational point Q on E_{t0}. Note the order carefully: the
      parameterisation is allowed to depend on (i, m) - it is the thing being
      computed - but is NOT allowed to depend on t0, and in particular no
      parameterisation may be re-chosen after seeing which t0 gave a large rank.
      For the stacking claim the order is stricter and is the one that can fail:
      THERE EXISTS t0 such that FOR ALL j from 1 to k, t0 lies in the image of
      the j-th parameterisation. A design that searched for t0 first and then
      fitted k lines to it would be measuring nothing, so the k parameterisations
      are frozen before the join runs.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Here is an explicit rational curve E over Q and 8 + k explicit rational
        points on it, all verified on the exact curve in exact rational
        arithmetic, with a nonsingular (8+k) x (8+k) Neron-Tate regulator." That
        is a rank LOWER bound and nothing else. It gives no upper bound, cannot
        show a point does not exist, cannot say the rank is exactly anything, and
        cannot exceed 8 + k for the k the stacking actually achieves. On this
        surface the construction cannot manufacture base rank: 8 is a theorem and
        every constructed point is an excess unit that must be exhibited one at a
        time. NOTHING HERE APPROACHES 32, and the honest ceiling for a first
        experiment is 8 + 2 or 8 + 3.
      nearby_object_control: >-
        The closest object where the hoped-for conclusion must FAIL: a line
        through NO base point. Its residual is a full cubic in s, the
        construction's algebra does not apply, and the pipeline must refuse
        rather than return a plausible discriminant. Second nearby control: a
        line through TWO base points, where the construction must return an
        already-known section and NOT a new excess unit. A pipeline that reports
        excess on either is counting the section lattice as excess, which is the
        exact failure mode that would manufacture the headline.
    proof_obligations:
      - claim: D_i has degree exactly 2 in t for every line through exactly one base point.
        responsibility: correctness
      - claim: Every returned point satisfies the exact specialised Weierstrass equation in exact rationals.
        responsibility: correctness
      - claim: The two-base-point degeneration returns a known section and never a new excess unit.
        responsibility: baseline
      - claim: Constructed points are independent of the eight specialised sections at the reported rate.
        responsibility: strictness
      - claim: The map from (m, t0) to Q is injective for fixed i, so per-line counts are not multisets.
        responsibility: scope
      - claim: The two-list join for k = 2 fits the declared time and memory budget at the declared list size.
        responsibility: runtime
      - claim: gamma is fitted against a beta measured in the same units of certified fibres.
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        residual_discriminant_degree -- the degree in t of D_i(t; m) for lines
        through exactly one base point, computed symbolically from the committed
        family for all nine base points
      direction: different
      minimum_effect: >-
        exactly 2 for at least 8 of the 9 base points. A degree other than 2
        falsifies the mechanism's algebra and the idea stops before any conic is
        solved.
    - metric: >-
        solvable_conic_fraction -- the fraction of slopes m in a declared box of
        at least 2000 canonical rational slopes per base point for which
        K_{i,m} has a rational point, decided exactly
      direction: higher
      minimum_effect: >-
        at least 0.05, pooled over the nine base points. A measured 0 over 18000
        conics is a clean pre-declared negative and closes the constructive route
        ON THIS SURFACE in that box.
    - metric: >-
        constructed_point_independence -- the fraction of constructed points Q
        that are independent of the eight specialised sections, by a 9x9
        Neron-Tate regulator computed at 60 and 150 digits after exact on-curve
        verification
      direction: higher
      minimum_effect: >-
        at least 0.80. A fraction below 0.20 means the construction reproduces
        the section lattice and delivers no excess, which falsifies the claim
        while leaving the algebra intact - the informative negative.
    - metric: >-
        ground_truth_explanation -- of the +4 excess units on the committed
        rank-12 fibre at t = -65/22, the number lying in the span of points
        produced by the nine line constructions at that same t
      direction: higher
      minimum_effect: >-
        at least 2 of 4. Zero means the excess this program has actually observed
        is not of this type, the construction addresses a different population of
        points, and any gamma measured later must be reported with that
        disjointness attached.
    - metric: >-
        stacking_exponent_gamma -- the fitted exponent in cost(k) = exp(gamma*k)
        for producing one fibre carrying k independent constructed extra points,
        fitted over k = 1, 2, 3, against beta fitted on the SAME committed
        137-fibre histogram in the same units of certified fibres
      direction: lower
      minimum_effect: >-
        gamma at most 0.5 * beta with the k range and both fits reported. A
        confidence interval for gamma containing beta is the pre-declared
        opposite reading: constructive stacking is no cheaper than blind sieving,
        which CONFIRMS the campaign's existing cost model and is equally
        reportable.
    - metric: >-
        best_certified_rank_by_construction -- the maximum rank over Q certified
        by exhibited points with NO descent anywhere in the provenance
      direction: higher
      minimum_effect: >-
        at least 10, that is 8 + 2, with every point re-verified in exact
        arithmetic. At least 13 would equal this program's current best certified
        rank over Q by an instrument that never calls a descent; exactly 8 is a
        clean negative meaning the construction adds nothing over the sections.
    - metric: >-
        cross_prediction_against_IDEA-20260829-03235f -- if that census is ever
        run, the fraction of its D with r(D) at least 1 that are equivalent,
        modulo rational squares and the affine action on t, to some residual
        discriminant D_i(t; m) produced here
      direction: higher
      minimum_effect: >-
        reported, not thresholded, and reportable only if both are run. A high
        fraction would say the blind twist census and this construction are the
        same measurement with different costs; a fraction near 0 would say the
        anti-invariant rank has sources this construction does not see.

  minimal_test:
    design: >-
      STEP 0 (algebra gate, about 2 h, no search). Rebuild the plane model and
      the nine base points from committed state. Symbolically restrict the pencil
      to a generic line through each base point, factor out the base-point root,
      and verify that the residual is a quadratic in s with coefficients affine
      linear in t and that its discriminant has degree exactly 2 in t. THIS IS
      THE FALSIFICATION GATE for the whole idea and it costs no compute.
      STEP 1 (baseline degeneration, about 1 h). Run the constructor on all 36
      lines through two base points and require it to return, as polynomial
      identities in t, points in the Z-span of the eight committed sections.
      Separately recompute the committed 137-fibre histogram and require exact
      agreement. STOP CONDITIONS.
      STEP 2 (solvability census, about 2 CPU-hours). Freeze a box of at least
      2000 canonical rational slopes m per base point. Decide K_{i,m} exactly for
      each, and for every solvable one compute an explicit rational point and a
      parameterisation. Report the solvable fraction per base point and pooled,
      with the canonicalisation rule and per-class multiplicity.
      STEP 3 (k = 1 harvest and independence, about 3 CPU-hours). From each
      parameterisation draw a declared number of t values in a declared height
      band, construct Q, verify it on the exact specialised curve in exact
      rationals with independent code, and compute the 9x9 regulator at 60 and
      150 digits. Report the independence rate and the height distribution of the
      produced fibres in the KN-FIND-91f871 convention.
      STEP 4 (the ground-truth explanation, about 1 CPU-hour). At t = -65/22,
      run all nine constructions and test how many of the committed 12
      non-section points lie in the span of what they produce.
      STEP 5 (the stacking measurement, about 6 to 12 CPU-hours). For pairs and
      then triples of frozen parameterisations from DIFFERENT base points, run a
      hash join on the produced t values over a declared height box; report
      collision counts against the birthday prediction from the measured
      densities, certify every collision fibre by exhibited points and a
      regulator, and fit gamma. Report peak memory of the join and the list sizes.
    controls:
      - >-
        BASELINE DEGENERATION CONTROL (known answer): lines through two base
        points must return the known sections and never a new excess unit.
      - >-
        REFUSAL CONTROL: a line through NO base point must be REFUSED by the
        constructor, not processed into a plausible discriminant.
      - >-
        NULL OBJECT: a random binary quadratic in t with matched coefficient
        sizes, fed to the solver and then to the point constructor. Every point
        it produces must FAIL exact on-curve verification. If any passes, the
        verifier is not verifying.
      - >-
        PROVES-TOO-MUCH: perturb one base point by 1, rebuild the pencil, and
        rerun the whole pipeline. Constructed points must fail exact on-curve
        verification on the unperturbed curve.
      - >-
        DEPENDENT-SUPPORT CONTROL: feed the regulator step a support that is
        deliberately the eight sections plus one Z-combination of them. It must
        return 8 and never 9, which is the exact failure mode EV-ECQ-0d142e OBS-8
        recorded the producer's first independence criterion failing on.
      - >-
        DOUBLE-COUNTING CONTROL: verify the injectivity of the map from (m, t0)
        to Q for fixed base point on at least 200 instances, so per-line counts
        are counts and not multisets.
      - >-
        EXACTNESS: every reported point re-verified on the exact curve by an
        implementation sharing no code with the constructor, and every regulator
        computed at two precisions with any statistic that moves reported as
        precision-bound.
    required_metrics:
      - symbolic degree of the residual discriminant in t, per base point, with the derivation artifact
      - solvable-conic fraction per base point and pooled, with the box and canonicalisation rule
      - constructed points produced, exact on-curve pass and fail counts, per base point
      - independence rate against the eight sections, with least eigenvalues at 60 and 150 digits
      - number of the 12 committed non-section points at t = -65/22 explained by the construction
      - collision counts for k = 2 and k = 3 against the birthday prediction, with list sizes
      - fitted gamma with its k range and confidence interval, and beta fitted in the same units
      - naive height distribution of the produced fibres in the KN-FIND-91f871 convention
      - wall clock, peak RSS (the join is the memory-binding step), and every timeout as operational

  falsification_conditions:
    - >-
      STEP 0 GATE. If the residual discriminant is not of degree 2 in t, the
      mechanism's algebra is wrong as stated and the idea is falsified before any
      compute is spent.
    - >-
      If the two-base-point degeneration returns anything other than known
      sections, the constructor is not implementing the claimed map and no
      constructed point may be reported.
    - >-
      If the solvable-conic fraction is 0 over the declared 18000 conics, the
      constructive route is falsified ON THIS SURFACE IN THAT BOX. That is a
      scoped negative with a denominator and is a legitimate deliverable.
    - >-
      If the independence rate of constructed points is below 0.20, the
      construction reproduces the section lattice, delivers no excess, and the
      headline claim is false while the algebra survives.
    - >-
      If the k = 2 hash join over the declared box returns ZERO collisions, then
      gamma is not measurable at this budget and the correct report is a lower
      bound on gamma plus the measured densities - never a claim that stacking
      is impossible.
    - >-
      If the fitted gamma's confidence interval contains beta, the pre-declared
      opposite reading is recorded: constructive stacking is not cheaper than
      blind sieving on this surface, and the campaign's existing cost model is
      confirmed rather than replaced.
    - >-
      A timeout, OOM in the join, or a factorisation that does not complete is an
      OPERATIONAL condition under AGENTS.md rule 3, reported as an instrument
      limit, and is never evidence that a conic is unsolvable or that a fibre has
      no extra point.

  confounders:
    - >-
      THE SECTION LATTICE MASQUERADING AS EXCESS. This is the confound that would
      manufacture the entire result, and it acts in the direction of the
      hypothesis: a constructed point that is secretly a Z-combination of the
      eight sections inflates the apparent excess at zero cost. Controlled by the
      two-base-point baseline, by the dependent-support control, and by requiring
      an exhibited regulator of full size for every reported rank.
    - >-
      DOUBLE COUNTING ACROSS BASE POINTS. The same extra point Q on the same
      fibre is reachable from up to nine different base points, one line through
      p_i and Q for each i. Counting it nine times would turn one excess unit
      into nine. Controlled by reducing every reported point modulo the section
      lattice and de-duplicating on that class before any count.
    - >-
      HEIGHT PAYBACK ON THE PARAMETERISATION. A rational parameterisation of a
      conic produces t of rapidly growing height, and KN-FIND-91f871 gives fibre
      height 12 d log|t| + O(1), so the constructed fibres are systematically
      LARGER than the tier-2 box this program has sieved. Larger fibres are
      exactly where descent fails - which does not hurt this route, since it runs
      no descent, but it does mean the constructed fibres cannot be cross-checked
      by ellrank and no exact rank may be claimed for them.
    - >-
      SELECTION BY SOLVABILITY. Only solvable conics enter STEP 3, so the
      independence rate and the height distribution are conditional on
      solvability. Reported as a conditional distribution with its conditioning
      denominator, following EV-ECQ-0d142e boundary B-5.
    - >-
      THE COSTA-SALGADO HYPOTHESES ARE UNREAD. Their abstract conditions the
      rank-jump-at-least-3 result ON THE SINGULAR FIBRES, and this surface has
      all twelve fibres irreducible I_1 - possibly the worst case for such a
      hypothesis, since irreducible fibres are what MAXIMISE the geometric
      ceiling. If the conditions exclude this surface, the k = 3 stacking has no
      theoretical support and only the measured collision counts stand. This is
      disclosed here rather than discovered mid-run, and it is the subject of the
      companion proposal IDEA-20260829-f15700.

  interpretation_limits:
    - >-
      THIS IS A LOWER-BOUND INSTRUMENT ONLY. It exhibits points; it never bounds
      a rank from above, never certifies an exact rank, and a fibre it declines
      to improve is not a fibre of small rank.
    - >-
      NOTHING HERE APPROACHES THE RECORD. The realistic ceiling of a first
      experiment is rank 8 + 2 or 8 + 3 over Q. Rank at least 31 over Q is a live
      claimed record held by others (ICARM curve no. 302, frozen snapshot
      2026-08-24) and is not this program's to restate.
    - >-
      Scoped to THIS pencil, THIS 8-point configuration, the declared slope box,
      the declared height band for t, and the software stack actually used. It
      bounds no other surface, and EV-ECQ-0d142e B-3 already records that a
      second-configuration replication was specified by review and never run.
    - >-
      The mechanism is published (Loughran-Salgado, Costa-Salgado, Desjardins)
      and only abstracts were read. A poor gamma is evidence about this
      program's implementation and box, not about the published method.
    - >-
      A measured gamma at least beta REPRICES the constructive lane; it does not
      close it. Premature closure is a failure mode symmetric with overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (CONIC SOLVABILITY DENSITY.) For a fixed base point p_i and slopes m
        ranging over the declared box of canonical rationals of bounded height,
        the conic K_{i,m} given by w^2 = D_i(t; m) is everywhere locally soluble
        - hence, by Hasse-Minkowski, has a rational point - for a proportion
        delta_i of m bounded below by a positive constant depending on the
        surface and the base point, and not on the box size in the measured
        range.
      rigorous_support: >-
        RIGOROUS PART, AND IT IS LARGE: for any single m, solubility is DECIDED
        exactly by Hasse-Minkowski from the factorisations of the coefficients,
        and a soluble conic is parameterised constructively; there is no
        heuristic content whatever in any individual instance. The heuristic is
        confined to the DENSITY over the box. DISTRIBUTION IMITATED: the
        classical picture in which the everywhere-locally-soluble members of a
        rationally parameterised family of conics have a positive proportion, in
        the same shape as the density statements used for families of quadratic
        twists; the local conditions at the finitely many primes dividing the
        family's fixed resultant data are the ones that bind.
      validation_plan: >-
        Sample: at least 2000 canonical slopes m per base point, nine base
        points, 18000 conics, with the canonicalisation modulo the affine action
        on the line's parameter recorded and per-class multiplicities published.
        Shortcut making this feasible: solubility is one Legendre-symbol
        computation per bad prime after factoring three coefficients that are
        SMALL, since they come from the family's own polynomials and not from a
        specialisation, which is orders of magnitude cheaper than the 7.5 s
        descent EV-ECQ-0d142e measures. Compare: the empirical delta_i per base
        point against a fitted constant, and against the pooled value, stratified
        by the height of m. Tail check: delta_i computed separately on the
        highest-height decile of the box, where the heuristic must fail first if
        it fails; report the largest m at which solubility was still decided
        within budget. TRANSFER ASSUMPTION, STATED: nothing measured on this
        surface transfers to another 8-point configuration, to a K3, or to larger
        slope boxes, and in particular delta measured here may not be quoted for
        the record fibration, which this program does not possess.
    - id: H2
      statement: >-
        (GENERIC INDEPENDENCE OF THE CONSTRUCTED POINT.) For a fixed base point
        p_i and a soluble conic K_{i,m}, the constructed residual point Q at a
        rational t0 in the parameterisation's image is Z-linearly independent of
        the eight specialised sections for all but a proportion at most 0.2 of
        the sampled t0 in the declared height band.
      rigorous_support: >-
        STRUCTURAL FACT: after the quadratic base change that splits the residual
        pair, the 2-section becomes a section lying in the ANTI-INVARIANT
        eigenspace of the deck involution acting on the Mordell-Weil group, while
        the eight sections span the INVARIANT eigenspace; the two eigenspaces
        intersect trivially in the group tensored with Q, so independence holds
        at the level of the base-changed surface BY ALGEBRA. This is the same
        splitting IDEA-20260829-03235f relies on. DISTRIBUTION IMITATED: the
        Silverman specialisation statement that the specialisation homomorphism
        is injective for all but finitely many rational t, so a class independent
        generically stays independent at all but finitely many t. WHAT IS
        HEURISTIC is only the RATE at the finite heights actually sampled, and
        EV-ECQ-0d142e OBS-2 already exhibits a fibre at t = 1/2 where
        specialisation is non-injective, so the failure set is not empty.
      validation_plan: >-
        Sample: at least 200 constructed instances spread over at least three
        height bands of t and over all nine base points. Shortcut: the eight
        sections are already exhibited over Q(t) in the committed qt_family.json,
        so the comparison support costs one substitution rather than a descent.
        Compare: the empirical dependence rate against the predicted at most 0.2,
        stratified by base point and by height band; report the 9x9 least
        eigenvalue distribution at 60 and 150 digits. Tail check: report every
        dependent instance individually with the exact Z-relation found, since a
        dependent instance with an explicit relation is a much stronger datum
        than a rate; and report whether dependence concentrates near the twelve
        bad fibres, where the specialisation argument is expected to fail first.
        TRANSFER ASSUMPTION, STATED: a rate measured at t of small height says
        nothing about the large-height t that a long parameterisation produces,
        and the stacking measurement lives at those larger heights.
    - id: H3
      statement: >-
        (STACKING INDEPENDENCE.) For base points p_i and p_j with i not equal to
        j and frozen soluble parameterisations, the two produced sets of t values
        behave, inside a declared height box B, like independent uniformly random
        subsets of the rationals of that height with their measured densities, so
        the expected number of common t values in the box is the product of the
        densities times the box size, and the observed collision count is
        consistent with that birthday prediction.
      rigorous_support: >-
        NO RIGOROUS BOUND IS CLAIMED and none is available to this session: the
        images of two rational maps into P^1 are algebraic, not random, and their
        intersection is governed by whether the fibre product curve
        phi_i(u) = phi_j(v) has rational points - a Diophantine question, not a
        counting one. DISTRIBUTION IMITATED: the birthday model for two lists.
        H3 IS THE ASSUMPTION MOST LIKELY TO BE FALSE and it is stated as the
        NULL against which the measurement is read, not as a belief: an observed
        collision count far ABOVE the birthday prediction would indicate real
        algebraic coincidence and is the outcome that would make gamma small; a
        count at or below it says stacking is as expensive as chance, which is
        the pre-declared negative.
      validation_plan: >-
        Sample: for at least 10 ordered pairs of base points, lists of at least
        1e6 produced t values each inside a declared height box, joined by
        hashing on the canonical p/q representation. Compare: the observed
        collision count against the birthday prediction computed from the
        measured densities of the same lists in the same box, with a Poisson
        interval. Tail check: examine the largest-height decile separately, and
        for every observed collision, resolve whether it comes from an actual
        rational point on the fibre product curve (report the curve's genus when
        computable) or from a hash artifact; a collision that does not survive
        exact rational comparison is a bug, not a datum. TRANSFER ASSUMPTION,
        STATED: a k = 2 collision rate does not extrapolate to k = 3 by
        independence, since the three parameterisations live on one surface and
        may be algebraically related; k = 3 is therefore MEASURED, never
        predicted from k = 2, and gamma fitted on k = 1, 2 alone is reported as
        such.

  target_complexity:
    time_exponent: >-
      THE EXPONENT MOVED IS THE CAMPAIGN'S OWN, AND IT IS STATED AS A RATIO
      AGAINST A NUMBER THAT MUST BE MEASURED ALONGSIDE. Baseline: to see excess k
      by blind sieving, V(k) = exp(beta*k) fibres must be CERTIFIED, at a
      measured 7.5 s per completed descent with 60 percent censoring, and beta is
      UNMEASURED in this repository (IDEA-20260829-1348a3 and
      IDEA-20260824-95d8d8 are the filed unrun proposals). For orientation only,
      arithmetic performed this session on the committed 137-fibre histogram
      (93, 14, 17, 12, 1 at ranks 8 to 12) gives censored empirical tail
      probabilities 0.321, 0.219, 0.0949 and 0.0073 for excess at least 1, 2, 3,
      4 - log-decrements of about 0.38, 0.84 and 2.57, that is NOT a clean
      geometric law on censored denominators, which is precisely why beta must be
      measured and not assumed. Target: k = 1 at cost polynomial in the bit-size
      (one solubility decision plus one parameterisation plus one substitution,
      with the factorisation of three SMALL family-level coefficients as the only
      non-polynomial step), and k at least 2 at cost exp(gamma*k) with gamma TO
      BE MEASURED. The claim under test is gamma at most 0.5*beta. NO
      CRYPTOGRAPHIC EXPONENT IS CLAIMED OR MOVED and this must never be quoted as
      a speedup on any hard problem.
    memory_exponent: >-
      The k = 1 route is O(1) in memory beyond the family. The k at least 2 route
      is MEMORY-BINDING and that is the honest disclosure: a two-list join at
      list size N costs O(N) memory if run as a sort-merge or hash join, against
      the 1.22 GB peak RSS EV-ECQ-0d142e measured for the whole predecessor
      campaign. At N = 1e6 canonical rationals the join is comfortably under
      2 GB; at N = 1e9 it is not, and the design declares N in advance.
    best_known: >-
      IN THIS REPOSITORY: the only route to an extra point is PARI ellrank
      2-descent, measured at 84 of 140 attempted descents censored at an 8 s
      alarm, 31 of 31 upper-bound descents timing out at a4 of order 1e19, and
      all 83 censored fibres reporting exactly the section floor. Best certified
      rank over Q anywhere in the program: 13 (Mestre-style pool, lower bound
      only) and 12 exactly (this pencil). EXTERNALLY: the conic-based rank-jump
      constructions of Loughran-Salgado, Costa-Salgado and Desjardins, whose
      abstracts were retrieved this session and whose full texts were not read;
      nothing algorithmically new is claimed against them.
    hidden_overhead: >-
      Three disclosures. (1) The k = 1 step's "polynomial time" hides a
      factorisation, and although the coefficients are family-level and small
      here, on a K3 or at higher degree they need not be. (2) The rational
      parameterisation produces t of rapidly growing height, so constructed
      fibres are large, un-descendable and therefore never cross-checkable by an
      upper bound - the route buys points at the cost of ever knowing the exact
      rank. (3) gamma is the whole claim and it is UNMEASURED; a favourable
      gamma at k = 2 does not extrapolate to k = 3, which is why k = 3 is a
      separate measured point and not a fit.
    tradeoff_note: >-
      A GENUINE TIME-MEMORY TRADEOFF EXISTS AND IS STATED. The k = 2 stacking is
      a two-list collision search: at list size N and memory M the join costs
      O(N^2/M) time by blocking, so the classical van Oorschot-Wiener style
      interpolation applies and a memory-free distinguished-point variant is
      available if the lists must grow beyond RAM. The construction is
      embarrassingly parallel over base point and slope and over height bands;
      the campaign runs at max_concurrent 1, so any measured wall clock is a
      single-core number that scales linearly with cores.

  dominated_by: >-
    FRONTIER ROWS CHECKED THIS SESSION ACROSS TIME, MEMORY AND DATA. (1)
    LOUGHRAN-SALGADO, COSTA-SALGADO AND DESJARDINS DOMINATE THE MATHEMATICS: the
    rank-jump-by-conic mechanism is theirs, they prove non-thinness statements
    this record does not attempt, and Desjardins' abstract already reports
    families with infinitely many fibres of rank at least 3 or 4. This program
    would be acquiring a published capability and measuring its cost, and no
    theorem is claimed. (2) On EXACT RANK, PARI ellrank dominates wherever it
    terminates, because it also returns an upper bound this construction can
    never give; it is dominated in turn on coefficient size, at 31 of 31 measured
    timeouts at a4 of order 1e19. (3) On BASE RANK, every published family
    dominates - Elkies' generic rank 18 over Q(t), the elliptic K3 of
    Mordell-Weil rank 17, Mestre-Kihara 14, Nagao 13 - because this surface is
    capped at 8 by a theorem and this construction adds only excess. (4)
    IDEA-20260829-03235f dominates on CEILING, 8 + r(D) up to 17 over Q, and is
    dominated here on cost and on directness, since this record constructs the
    good D instead of enumerating a box of 2000. (5) IDEA-20260829-07fd5f
    dominates on GENERALITY - a lattice point search finds points of any shape,
    where this construction finds only line residuals - and is dominated here on
    implementation cost and on the fact that its own alpha is unmeasured. (6)
    "Sieve the same family harder" is dominated in advance by RQ-ECQ-80f23c's own
    framing and is NOT what this is: no fibre is certified by descent anywhere in
    the k = 1 route. On the axis this record competes on - producing exhibited
    excess points on a surface this program owns, with no descent and no
    censoring - no row in this repository dominates it, because no row constructs
    a point at all.
  sota_delta: >-
    QUANTITATIVELY. Delta on rank over Q against the world: ZERO, and
    structurally so - the realistic outcome is rank 10 to 11 over Q, against a
    live claimed record of at least 31 held by others. Delta on base rank:
    EXACTLY ZERO, since 8 is a theorem about this surface. WHAT MOVES IS THE COST
    OF AN EXCESS UNIT: from one completed 2-descent (measured mean 7.5 s at an
    8 s alarm, 60 percent censored, cost driven by specialised coefficient size
    at Spearman +0.765) to one conic solubility decision plus a substitution,
    with NO censoring channel at all because no descent is run. Against this
    program's own best certified rank over Q of 13 (lower bound) and 12 (exact),
    the pre-declared target of 10 is BELOW both and is not presented as an
    improvement on them; the deliverable is the exponent gamma and its ratio to
    beta, not the rank. If gamma is at most 0.5*beta, the number of certified
    fibres needed per unit of excess falls by a factor exp(0.5*beta*k), which at
    an orientation value of beta near 1 and k = 3 is about a factor of 4.5 -
    stated with the explicit warning that beta is unmeasured and that this factor
    is arithmetic on an unmeasured quantity.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation is a plane-model rebuild, a symbolic residual-quadratic
      routine, a Hasse-Minkowski conic solver with parameterisation, an exact
      on-curve verifier sharing no code with the constructor, a Neron-Tate
      regulator step reusing the predecessor's machinery, and a hash join. No new
      mathematics to code and no external system required. Compute is roughly 14
      to 20 CPU-hours across six steps, dominated by STEP 5, against the 1,993.0 s
      the predecessor campaign spent in total; peak RSS budgeted at 2 GB and
      binding only in the join. STEP 0 is a zero-compute falsification gate.

