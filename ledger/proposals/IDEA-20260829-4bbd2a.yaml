idea:
  id: IDEA-20260829-4bbd2a
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-e72c0b
  goal_id_note: >-
    ROUTING ONLY. Naming a goal is not a dispatch, mints no batch, and authorizes
    no run. GOAL-ECQ-e72c0b's pause conditions forbid any mathematical execution
    until its zero-run protocol is approved; this record does not and cannot
    change that.

  title: >-
    Excess by CONSTRUCTION, not by search: the residual conic of a line through a
    single base point turns "find an extra rational point on E_t" into "solve one
    conic over Q", and the campaign's cost exponent becomes the STACKING exponent
    gamma rather than the blind-sieve exponent beta

  class: algorithm

  claim: >-
    Let X/Q be the pencil-of-cubics rational elliptic surface certified in
    EV-ECQ-0d142e - nine rational base points, y^2 = x^3 - 27 c4(t) x - 54 c6(t),
    deg c4 = 4, deg c6 = 6, discriminant squarefree of degree 12, twelve
    irreducible I_1 fibres, Mordell-Weil rank over Q(t) EXACTLY 8. Fix one base
    point p_i and a line L_m through p_i and no other base point. Every member
    C_t of the pencil vanishes at p_i, so C_t restricted to L_m factors as
    (s - s_i) times a QUADRATIC q(s, t) whose three coefficients are AFFINE
    LINEAR in t; hence its discriminant D_i(t; m) = b(t)^2 - 4 a(t) c(t) is a
    polynomial of degree exactly 2 in t. THE CONSTRUCTIVE CLAIM: the affine conic
    K_{i,m} given by w^2 = D_i(t; m) is a genus-0 curve over Q whose rational
    points are decidable and, when nonempty, parameterisable in time polynomial
    in the bit-size given the factorisations of its coefficients; and each
    rational point (t0, w0) of K_{i,m} with t0 not a bad fibre yields, IN CLOSED
    FORM AND WITH NO DESCENT AND NO SEARCH, an explicit rational point Q on the
    fibre E_{t0} together with an exhibited certificate that it lies on E_{t0}.
    THE CLAIM UNDER TEST IS QUANTITATIVE AND HAS TWO PRE-DECLARED READINGS.
    Define gamma by cost(k) = exp(gamma * k), the cost of producing ONE fibre
    carrying k independent constructed extra points by intersecting k
    parameterised t-sets; define beta by V(k) = exp(beta * k), the number of
    fibres that must be CERTIFIED to see excess k by blind sieving. IF gamma is
    at most 0.5 * beta over k = 1, 2, 3, then the campaign's central search has a
    strictly smaller exponent than the one every filed cost model in this
    repository assumes, the 60 percent descent censoring of EV-ECQ-0d142e UC-3 is
    bypassed entirely because no descent is performed, and rank 8 + k over Q is
    reachable at polynomial rather than exponential cost in k for the k actually
    attained. IF gamma is at least beta, or if the constructed points turn out to
    lie in the span of the eight specialised sections, then excess is NOT
    constructible on this surface by this mechanism, the blind-sieve cost model
    stands, and the program has measured why - which is the second half of
    RQ-ECQ-80f23c's decision target stated over an object it owns.

  mechanism: >-
    Two things collide and nobody in this repository has made them collide. THE
    FIRST is a piece of elementary algebra about this specific surface that this
    session performed symbolically in the claim above and that the design
    re-derives from the committed qt_family.json rather than assuming: a line
    through EXACTLY ONE of the nine base points is a 2-SECTION of the elliptic
    fibration (intersection number 2 with the fibre class), so its residual
    intersection with C_t is a conjugate PAIR of points, rational as a pair
    always and rational individually exactly when one quadratic discriminant is a
    square. A line through TWO base points is different and is the control: its
    residual is a single point, rational on every fibre, and it is one of the
    eight sections - which is why the eight sections exist at all. So the whole
    Mordell-Weil structure of this surface is already the k = 0 case of the same
    construction, and the k = 1 case is one square condition away. THE SECOND is
    external and recent, and it says this is not an accident of one surface.
    Loughran and Salgado (arXiv:1907.01987, abstract retrieved this session)
    prove that for an elliptic surface over a number field, under suitable
    assumptions, the collection of fibres whose Mordell-Weil rank EXCEEDS the
    generic rank is NOT THIN, and their abstract names DEL PEZZO SURFACES OF
    DEGREE 1 as a case the results apply to - which is precisely the class of
    this program's object, since blowing up P^2 at eight points in general
    position is a degree-1 del Pezzo whose anticanonical fibration is this
    pencil. Costa and Salgado (arXiv:2205.07801, abstract retrieved) give, for
    RATIONAL elliptic surfaces, conditions ON THE SINGULAR FIBRES assuring that
    the fibres with rank jump AT LEAST 3 form a non-thin set. Desjardins
    (arXiv:2512.02548, abstract retrieved, submitted 2 Dec 2025) studies families
    of elliptic surfaces with infinitely many fibres of rank at least 3 or 4
    "via construction of conics". The conic in that phrase and the conic
    K_{i,m} above are the same kind of object, and the mechanism is therefore not
    this session's invention - it is a published research line this repository
    has never touched, whose objects are constructive, whose outputs are
    exhibited points, and whose cost is decoupled from the coefficient size that
    EV-ECQ-0d142e OBS-6 measures as the sole driver of this program's descent
    timeouts (Spearman +0.765 between log of the absolute a6 and timeout, against
    -0.104 for the score). Stacking is the crux and is where the exponent lives:
    each solvable conic supplies a RATIONALLY PARAMETERISED set of t values
    carrying one extra point, so producing excess k means finding a common t in k
    such sets - a k-fold intersection of images of rational maps, which is a
    two-list collision problem for k = 2 and a claw problem for larger k. That is
    a meet-in-the-middle decomposition of the campaign's bottleneck search, and
    its cost is measurable rather than assumed.

  tracked_object:
    object: >-
      The 2-SECTION - a curve on the elliptic surface meeting the generic fibre
      in exactly two points - projected onto the pair (its residual discriminant
      D_i(t; m) as a binary quadratic form in t, the rational parameterisation of
      the conic w^2 = D_i(t; m) when one exists). NOT the fibre, NOT E(Q), NOT
      the Selmer group, NOT the Mordell-Weil lattice, NOT the score.
    lossy_projection_test: >-
      PASSES, and the loss is large and one-directional. The projection sends a
      curve on a surface - its equations, its intersections with every fibre, its
      class in the rank-10 Neron-Severi lattice, every point on it - to a binary
      quadratic form in one variable with three rational coefficients, plus at
      most a parameterisation. From that form one cannot recover the line, cannot
      recover the surface, cannot recover a point of E_t without redoing the
      substitution, and cannot decide independence of anything. It is NOT a
      change of coordinates. What is retained propagates DETERMINISTICALLY under
      the operations the target performs, and the propagation is exact
      intersection theory rather than an analogy: restricting to a sub-pencil
      acts on D by substitution in t; a quadratic base change t = phi(u) pulls D
      back to D(phi(u)) and turns the 2-section into a section, which is exactly
      the anti-invariant summand IDEA-20260829-03235f tracks; and specialisation
      at a rational t0 is evaluation of D at t0 followed by one square test. Each
      of those is one step, deterministic, on the retained data alone.
    what_the_loss_buys: >-
      Complete independence from 2-descent. Every other route to an extra point
      in this repository runs through PARI ellrank, whose cost EV-ECQ-0d142e
      measures as driven by specialised coefficient size and which timed out on
      84 of 140 attempted descents and on 31 of 31 upper-bound descents at a4 of
      order 1e19. This object never specialises a descent and never sees a Selmer
      group; its cost is the cost of deciding one conic.
    what_the_loss_costs: >-
      A discriminant cannot say whether the point it produces is INDEPENDENT of
      the eight sections, cannot give an upper bound on any rank, and cannot find
      a point of a shape the construction does not produce. The construction is
      complete for points arising as residuals of lines through one base point
      and says nothing about any other point. Independence is therefore an
      exhibited numerical fact per instance in this design, never an inference.

  novelty_status: unverified
  novelty_note: >-
    THE MECHANISM IS PUBLISHED AND IS NOT CLAIMED AS NEW. Three arXiv abstract
    pages were fetched this session and are cited below with exactly that read
    depth; the rank-jump-by-conic line of work is Loughran-Salgado,
    Costa-Salgado and Desjardins, and this record claims none of it. WHAT IS NEW
    IS INTERNAL AND MEASURABLE. A corpus grep this session over
    ledger/proposals/, ledger/ideas/ and knowledge/findings/ for "conic",
    "multisection", "2-section", "rank jump", "thin" and "Hilbert property"
    returned NOTHING: no record in this repository tracks a curve on the surface,
    and every filed idea treats the excess as a random variable to be SAMPLED
    (IDEA-20260824-95d8d8, IDEA-20260829-1348a3) or the base rank as a fixed
    integer to be RAISED (IDEA-20260829-03235f, IDEA-20260824-b26635). The
    closest filed record is IDEA-20260829-03235f, and the relationship is
    specific rather than vague: 03235f enumerates twisting polynomials D blindly
    over a box and measures r(D) by ellrank; this record CONSTRUCTS in closed
    form the D for which r(D) is at least 1 - namely D = D_i(t; m), the residual
    discriminant of a line - and then, instead of base-changing, takes rational
    points ON that conic so the extra point lands over Q rather than over Q(u).
    That yields a cross-prediction between two filed proposals, recorded in the
    predictions below. External checking was PARTIAL: three abstracts, no full
    text, no theorem or hypothesis read, and no search run against the specific
    question "has anyone measured the stacking cost of independent conic
    constructions on one surface". `unverified` is the required label and is not
    a hedge about the algebra, which the design verifies symbolically.

