  assumptions:
    - >-
      The observation identity u = c t0 + r0 holds exactly (Stage 1 checks it;
      a single failure outside Decompose's special top cell stops the line).
    - >-
      c's autocorrelations at nonzero lag average to zero over the challenges
      SampleInBall actually produces, so the conjugate-averaging estimator is
      unbiased to first order. This is measurable directly from the challenges
      and is a required metric, not an assumption to be waved through.
    - >-
      The true t0 is available from the keypair for scoring. This is a
      measurement of a leak with the ground truth in hand, which is what makes
      it cheap and what makes it NOT an attack.
    - >-
      Signing throughput permits 10^4 signatures per parameter set within the
      hour. If it does not, the pilot falls back to ML-DSA-44 at N = 10^3,
      which still tests bit-planes 12 to 10, and the shortfall is reported as a
      budget outcome rather than as a result.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: null
    observation_collision:
      observable: >-
        The certificate is the per-bit-plane agreement fraction against the
        true t0. A collision worth naming: two different estimators can produce
        the same agreement fraction at one N while having different SLOPES, so
        a single-N measurement cannot distinguish estimator classes.
      distinct_preimage_search: >-
        The design therefore measures the whole (b, N) surface over at least a
        decade of N rather than a single point, which is exactly what breaks
        that collision.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build a problem-specific resource measure - signature count per bit
          of precision - realise it by specialising to each bit-plane, and add
          charges only over the bit-planes, which are disjoint by construction.
        predicted_gain: >-
          Converts an unquantified qualitative sentence in a fielded standard
          into 13 numbers per parameter set at a cost of one hour.
    quantifier_order: >-
      FOR EACH parameter set and FOR EACH bit-plane b, THERE EXISTS N(b) such
      that FOR ALL N >= N(b) the conjugate-averaging estimator agrees with t0
      at plane b on at least half of the 256k coefficients, WITH PROBABILITY
      over the signature stream. Note what is NOT claimed: no uniformity over
      keys (per-key dispersion is measured), no statement about other
      estimators (the exchange rate is estimator-relative, and saying so is the
      point of prediction 4).
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest certifiable claim is a measured price curve for ONE named
        estimator on the tested keys. It cannot certify a lower bound on any
        estimator's price - that is IDEA-20260805-630606's object - and it
        cannot certify that a graded price has any security consequence, which
        would require costing what partial t0 buys and is out of scope here.
      nearby_object_control: >-
        The nearby object where the conclusion fails: the same measurement with
        the noise replaced by an equal-variance Gaussian. The curve N(b) =
        4 sigma^2/(tau 4^b) must be UNCHANGED, because the averaging estimator
        only sees the variance. If the measured curve moves, the instrument is
        responding to the noise's shape and not to its variance, and the
        closed form is not what is being measured. That control is a strict
        requirement and it is cheap.
    proof_obligations:
      - claim: 'per-coefficient error variance is sigma_r0^2/(N tau) to within the derived 0.19% self-interference'
        responsibility: correctness
      - claim: 'N(b) = 4 sigma_r0^2/(tau 4^b) and its thirteen evaluations at ML-DSA-44'
        responsibility: size
      - claim: 'the measured exchange rate distinguishes a 1/sqrt(N) from a 1/N estimator class'
        responsibility: strictness
      - claim: 'the whole measurement fits in one hour of single-core compute at N = 10^4'
        responsibility: runtime
    not_applicable_reason: >-
      Only partially applicable: this is a measurement proposal with a closed
      form, not a proof-oriented one, so the bottleneck and baseline-embedding
      fields are left null rather than filled with a fabricated bottleneck. The
      audits that DO apply - observation collision, quantifier order, method
      ceiling and the nearby-object control - are filled, because each of them
      caught something real here (the single-N collision, the
      estimator-relativity of the exchange rate, and the equal-variance
      Gaussian control).

  predictions:
    - metric: >-
        exactness of the observation identity: max over 256k coefficients and
        10^3 signatures of |u_j - (c t0)_j - r0_j| against an instrumented
        signer's true values
      direction: different
      minimum_effect: >-
        FORCED VALUE: exactly 0 outside Decompose's special top cell. This is
        the shared gate with IDEA-20260821-6109f8 and it costs one subtraction
        per coefficient.
    - metric: >-
        per-coefficient RMS error of the conjugate-averaging estimator at
        ML-DSA-44 for N in {10, 100, 1000, 10000}
      direction: lower
      minimum_effect: >-
        FORCED VALUES: 2782 / 880 / 278 / 88.0. Agreement to within 10% is the
        pass condition; a systematic 2x in either direction refutes the noise
        model and mechanism (5) names which direction means what.
    - metric: >-
        highest bit-plane index b at which fewer than half of the 256k
        coefficients agree with the true t0, at N = 10^4, per parameter set
      direction: different
      minimum_effect: >-
        FORCED VALUES: b = 7 at ML-DSA-44 (so planes 12 to 8 resolved, 5 of 13)
        and b = 8 at ML-DSA-65 and ML-DSA-87 (planes 12 to 9 resolved, 4 of 13).
        An off-by-one is tolerated and reported; an off-by-three is a
        refutation.
    - metric: >-
        exchange rate: the fitted slope of log2 N(b) against -b over the
        measured range
      direction: different
      minimum_effect: >-
        FORCED VALUE 2.0 (two bits of signature count per bit of precision) for
        the averaging estimator. A measured slope near 1.0 would mean the
        estimator is behaving super-efficiently, which it should not, and would
        indicate the noise is not the dominant error source. THIS IS THE
        NUMBER THAT PREDICTS WHETHER IDEA-20260821-6109f8 CAN PAY OFF, because
        a set-membership decoder's forced slope is 1.0.
    - metric: >-
        per-key dispersion of N(8) at ML-DSA-44 over 8 keys
      direction: different
      minimum_effect: >-
        The curve is derived from parameters only, with no key dependence, so
        the forced prediction is that the across-key spread equals the
        within-key seed spread. A materially larger across-key spread means the
        price of t0 is a per-key quantity - a weak-key-shaped finding that this
        design would surface for free and that nothing in the corpus predicts.
    - metric: >-
        agreement fraction on the RESAMPLED-t0 null arm, at every bit-plane and
        every N
      direction: different
      minimum_effect: >-
        FORCED VALUE: chance. Any departure means the harness leaked the true
        t0 into the estimator and no arm is readable.

  minimal_test:
    design: >-
      ONE RUN, FOUR STAGES, UNDER ONE HOUR OF SINGLE-CORE COMPUTE FOR STAGES
      0-3 AT ML-DSA-44 IF SIGNING THROUGHPUT PERMITS.
      STAGE 0 (reading, zero compute): re-read gamma2, beta, tau, d, k from
      FIPS 204 Table 1 and the Section 6.1 sentence verbatim under a run
      record; recompute sigma_r0 = (gamma2 - beta)/sqrt(3) and the thirteen
      N(b). If any parameter differs from the values used here, re-derive
      before proceeding.
      STAGE 1 (identity gate, minutes, TERMINATING): instrument a signer to
      emit (t0, s2, y) alongside each signature; compute u from PUBLIC data
      only and check u = c t0 + r0 exactly on 10^3 signatures; record the
      special-top-cell frequency and drop those coefficients.
      STAGE 2 (the curve, minutes): generate N = 10^4 signatures under each of
      8 keys at ML-DSA-44 (and, if throughput allows, at -65 and -87), run the
      conjugate-averaging estimator at N = 10, 30, 100, 300, 1000, 3000, 10000
      - a decade and a half, declared before the run - and record the full
      (b, N) agreement surface against the true t0.
      STAGE 3 (controls): the resampled-t0 null first with its verdict
      committed; the graded resampling arm at four interior points; the
      equal-variance Gaussian nearby-object control; 8 independent draws of the
      comparator curve reported as an interval.
      WHAT DISCRIMINATES, EXPLICITLY: Stage 1 decides whether the observation
      model is real, and a failure there kills three records in this batch for
      minutes of compute. Stage 2's four forced RMS values decide whether the
      noise law is right. Stage 2's fitted slope decides between the estimator
      classes and therefore whether IDEA-20260821-6109f8 is worth its campaign.
      Stage 3's Gaussian control decides whether the measurement is about
      variance (it should be) or about shape (it should not be).
    controls:
      - Resampled-t0 null, run FIRST, verdict committed before the real arm, and explicitly labelled as a plumbing check that cannot fail as a test of the leak.
      - The four forced RMS values as a reference model, with BOTH arms scored against them rather than against each other.
      - Graded resampling at f in {0, 0.25, 0.5, 0.75, 1} with the unresampled-coefficient fraction reported separately, and monotonicity reported explicitly.
      - Equal-variance Gaussian noise control - the curve must NOT move; if it does, the instrument is not measuring what the closed form describes.
      - 8-draw comparator replication with intervals, before any slope is fitted.
      - Multi-key arm (8 keys) so the across-key spread is reported beside the within-key spread.
      - Challenge-autocorrelation check: measure the mean nonzero-lag autocorrelation of c over the challenges actually produced, against the assumed 0.
    required_metrics:
      - max identity residual and special-top-cell frequency
      - RMS error at seven values of N against the four forced values, with 8-draw intervals
      - the full (bit-plane, N) agreement-fraction surface, machine-readable
      - fitted exchange-rate slope with its confidence interval and the declared fit range
      - across-key and within-key spread of N(8)
      - resampled-null agreement fractions at every cell
      - measured signing throughput in signatures per second, reported whether or not the budget bound

  falsification_conditions:
    - >-
      The identity check fails on any coefficient outside the special top cell.
      This proposal, IDEA-20260821-6109f8 and part of IDEA-20260821-71fc18 are
      all withdrawn together.
    - >-
      The measured RMS errors miss 2782 / 880 / 278 / 88.0 by more than 10%.
      The closed form is wrong and the thirteen N(b) are withdrawn; the
      measured curve is reported in their place, which is still the deliverable.
    - >-
      The highest unresolved bit-plane at N = 10^4 is not 7 (ML-DSA-44) or 8
      (-65, -87) within one plane. The curve's calibration is wrong.
    - >-
      The fitted exchange rate is not 2.0 within its interval. Either the
      estimator is not the one analysed or the noise is not the dominant error
      source; in either case IDEA-20260821-6109f8's slope discriminator is
      invalidated and must be redesigned before its campaign is bought.
    - >-
      The equal-variance Gaussian control moves the curve. The measurement is
      responding to noise shape rather than variance and no N(b) is reportable.
    - >-
      The resampled-t0 null shows better-than-chance agreement anywhere. The
      harness has leaked the true t0 and nothing is readable.

  confounders:
    - >-
      SUCCESS-FRACTION THRESHOLDS ARE ARBITRARY. "Resolved" at a fraction of
      1/2 is a convention; at 0.9 the curve shifts by a constant factor. The
      threshold is declared before the run and the whole surface is reported so
      a reader can pick another.
    - >-
      BIT-PLANE INDEXING IS EASY TO GET WRONG. There are 13 bits, indexed here
      12 (most significant) down to 0 (least). An off-by-one in the indexing
      convention shifts every number by a factor of 4 and would look like a
      real effect.
    - >-
      SELF-INTERFERENCE GROWS RELATIVELY AS N GROWS. The noise term falls as
      1/sqrt(N) and the derived 0.19% self-interference contribution falls at
      the same rate, so the ratio is constant - but only to first order; at
      very large N the estimator's residual BIAS (from the non-zero-mean part
      of c^* c on the realised challenge set) dominates and the curve flattens.
      The design measures the challenge autocorrelation precisely so that a
      flattening is attributed rather than absorbed.
    - >-
      ONE KEY IS NOT THE POPULATION. The closed form has no key dependence, so
      a single-key run would look perfectly consistent whatever the truth; the
      8-key arm is what makes the no-key-dependence prediction able to fail.
    - >-
      A CONFIRMED CURVE IS COMFORTABLE. The forced values were derived by the
      same session that designed the measurement, and confirming them is the
      easy outcome. The Gaussian control and the slope prediction exist so that
      a confirmation costs something and carries information about the sibling
      proposal rather than only about itself.

  interpretation_limits:
    - >-
      NOT A BREAK. t0 is declared public by the security argument, so a graded
      price for it is a threat-model quantity and implies nothing about MLWE,
      MSIS or SelfTargetMSIS in any direction.
    - >-
      The curve is ESTIMATOR-RELATIVE and must always be quoted with its
      estimator. "Bit-plane 8 costs 4724 signatures" is licensed only as "costs
      4724 signatures for the conjugate-averaging estimator"; a better decoder
      pays less and IDEA-20260821-6109f8 exists to find out how much less.
    - >-
      Resolving the top five bit-planes is NOT recovering t0, and no sentence
      may say so. What it means operationally - which downstream uses are
      satisfied by t0 known to +/- 128 - is not costed here and RQ-MLDSA-ffa0f5
      requires it to be costed rather than asserted.
    - >-
      Scoped to the tested keys, the tested signer implementation and the
      tested parameter sets. All measurements are at REAL FIPS 204 parameters,
      so there is no toy-to-real transfer; the transfer that does exist is
      across keys and implementations and is stated.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The accepted low part r0 = LowBits(w - <<c s2>>) is coefficient-wise
        uniform on the integers in (-(gamma2 - beta), gamma2 - beta),
        independent of t0 given c, with variance (gamma2 - beta)^2/3. LOAD-
        BEARING for the constant in N(b); NOT load-bearing for the SHAPE of the
        curve, which follows from any finite noise variance.
      rigorous_support: >-
        Rigorous ingredient: w = A y with y drawn by ExpandMask independently of
        t0, and FIPS 204 Algorithm 7 Line 23 rejects exactly when
        ||LowBits(w - <<c s2>>)||_inf >= gamma2 - beta, so acceptance truncates
        r0 to that range. Classical statement imitated: the uniform law on a
        truncated interval, and the elementary variance W^2/3 that goes with it.
      validation_plan: >-
        Sample 10^3 signatures per parameter set at REAL FIPS 204 parameters
        from an instrumented signer that knows the true r0; compare the
        empirical CDF against the uniform on (-(gamma2 - beta), gamma2 - beta)
        by Kolmogorov-Smirnov; report the empirical variance against W^2/3 =
        3.0181e9 / 2.2828e10 / 2.2841e10. Tail check: the outer 1% of the
        range, since a depleted edge would mean the truncation is not sharp.
        Cross-coefficient dependence measured as the mean pairwise correlation
        of r0 within a signature against the predicted 0, with its
        finite-sample interval. Sampled parameters and seeds recorded; no
        transfer between parameter sets is assumed, each is measured.
    - id: H2
      statement: >-
        The nonzero-lag autocorrelations of the challenge c average to zero
        over the challenges SampleInBall actually produces, so the conjugate-
        averaging estimator is unbiased and its self-interference variance is
        sigma_t0^2/(N tau).
      rigorous_support: >-
        Rigorous ingredient: c has exactly tau coefficients in {-1, +1} and the
        rest zero (FIPS 204 Section 2.3's definition of B_tau), so the constant
        term of c^* c is exactly tau, unconditionally. Classical statement
        imitated: the vanishing expected autocorrelation of a random sparse
        sign sequence at nonzero lag.
      validation_plan: >-
        Direct and exact: compute the empirical mean and standard deviation of
        every nonzero-lag autocorrelation of c over 10^4 realised challenges
        and compare against 0 and against the sqrt(tau)-scale prediction. This
        is a property of SampleInBall alone, needs no signing, and is the
        cheapest check in the design.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The quantity with exponent-like
      character is the exchange rate: signature count scales as 4^(-b) in
      precision for a 1/sqrt(N) estimator and 2^(-b) for a 1/N one, and the
      whole deliverable is which of the two ML-DSA's transcript actually
      permits. Compute cost of the measurement: N * 256k * tau operations for
      the estimator, i.e. 4.0e8 at N = 10^4 and ML-DSA-44 - seconds
      vectorised - plus the signing cost, which dominates.
    memory_exponent: >-
      Negligible: the estimator is a running accumulator of 256k integers, so
      the transcripts can be streamed and never stored. Peak working set under
      50 MB even with the (b, N) surface retained.
    best_known: >-
      IN-CORPUS: nothing. No record grades any secret by bit significance, and
      the ML-DSA area has zero experiments, runs or evidence. EXTERNAL: no
      per-bit-plane cost curve was found by the targeted search S5; eprint
      2024/2046's LSB targeting is the nearest shape and is not a curve. NOT
      CHECKED, AND SAID SO: whether eprint 2024/1373 contains such a breakdown -
      the PDF could not be parsed.
    hidden_overhead: >-
      The closed form hides nothing asymptotically but it hides one practical
      thing: it assumes the estimator's error is variance-dominated, and at
      large N the residual bias from realised challenge autocorrelations takes
      over and flattens the curve. Where that happens is not derived here and
      is a measured quantity. Second: the whole line is gated on signing
      throughput, which no derivation improves.
    tradeoff_note: >-
      The exchange rate IS the tradeoff and it is the deliverable: four times
      the signatures buys one more bit of every coefficient of t0 under
      averaging. Parallelisation is embarrassing - the accumulator is a sum -
      so the measurement scales linearly in cores and the curve can be pushed
      one decade further per two orders of magnitude of hardware, which is
      exactly the wrong scaling for reaching bit-plane 0 and is why bit-plane 0
      is stated as unreachable rather than as untried.

  dominated_by: >-
    n/a on the attack axis (no attack, no cost triple claimed). Rows actually
    checked: (i) all five RQ-MLDSA-ffa0f5 proposals and both hypotheses - none
    measures an estimator error curve or grades t0, so none dominates;
    (ii) IDEA-20260805-630606 dominates on the LOWER-bound axis (its 34/60/58
    are unconditional and this proposal supplies no lower bound), which is a
    different question and is cited rather than competed with;
    (iii) IDEA-20260821-6109f8 dominates on the RECOVERY axis (it aims at exact
    t0; this cannot recover t0 at all) but is dominated by this record on COST
    by roughly two orders of magnitude in signatures and is gated on this
    record's Stage 1; (iv) externally, eprint 2024/1373 at 2e5-5e5 signatures
    dominates on the recovery axis and its relationship to the bit-plane
    question is UNKNOWN because the full text could not be read; eprint
    2024/2046 dominates on signature count but requires power traces and is
    outside the transcript-only threat model. MEMORY and TIME axes: nothing
    published to compare against; both are negligible here.
  sota_delta: >-
    no attack; measurement and reframing contribution only. Quantitatively:
    FIPS 204 Section 6.1 gives no number; this corpus gives one number per
    parameter set (the entropy floor 34 / 60 / 58); the literature gives one
    number per parameter set (2e5 to 5e5). This supplies THIRTEEN numbers per
    parameter set, spanning 18 to 3.1e8 signatures at ML-DSA-44 - a seven-
    order-of-magnitude spread inside a quantity the standard treats as
    scalar - plus a measured exchange rate that prices any further improvement
    in advance. The delta is not a faster attack; it is that the question "is
    200,000 a small number" turns out to be malformed, because the answer
    depends on which bit of t0 is being bought.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    BY PART. (i) That the observation identity survives Stage 1 exactly: ~0.85,
    shared with IDEA-20260821-6109f8. (ii) That the four forced RMS values are
    reproduced within 10%: ~0.75 - the estimator's algebra is elementary and
    the risk sits in H1's uniformity at the truncation edge and in
    cross-coefficient dependence induced by the sup-norm rejection.
    (iii) That the highest unresolved plane at N = 10^4 is 7 / 8 / 8 within one
    plane: ~0.7. (iv) That the fitted exchange rate is 2.0 within interval:
    ~0.8. (v) That the curve has no material key dependence: ~0.7, and the
    alternative would be the more interesting outcome. (vi) That the bit-plane
    framing is NEW rather than folklore among the people who wrote the two t0
    papers: ~0.35 - it is the obvious thing to notice once one has the
    estimator, and this session could read neither paper.

