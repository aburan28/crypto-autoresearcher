idea:
  id: IDEA-20260821-65739b
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-21'
  title: >-
    t0 is not one secret but thirteen: replace FIPS 204's binary assertion with
    a PRICE CURVE over the bit-plane filtration, N(b) = 4 sigma_r0^2 /
    (tau 4^b), which predicts that 10^4 signatures already fix the top five
    bit-planes at ML-DSA-44 while the least significant bit costs 3.1e8 by the
    same estimator - and whose measured slope (two bits of signature count per
    bit of precision, or one) is a one-hour test of whether a set-membership
    decoder can pay off at all
  class: representation

  claim: >-
    (A) THE REFRAMING. FIPS 204 Section 6.1 says the low-order bits of t "can
    be reconstructed from a small number of signatures and, therefore, need not
    be regarded as secret". That sentence treats t0 as a single object with a
    single price. It is not one object. Each coefficient of t0 carries d = 13
    bits, and the observation an ML-DSA signature actually supplies -
    u_j = (c t0)_j + r0_j with |r0_j| < gamma2 - beta, exactly as derived in
    IDEA-20260821-6109f8 - determines the HIGH bit-planes of t0 long before it
    determines the low ones. The honest replacement for the standard's sentence
    is therefore not a number but a CURVE N(b), the signature count at which
    bit-plane b of every coefficient is pinned.

    (B) THE CURVE, IN CLOSED FORM, FOR THE ESTIMATOR THIS CORPUS CAN DERIVE.
    For the conjugate-averaging estimator t0_hat = (1/(N tau)) sum_i c_i^* u_i,
    the per-coefficient error standard deviation is sigma_r0 / sqrt(N tau) with
    sigma_r0 = (gamma2 - beta)/sqrt(3), so bit-plane b (counting b = 12 as the
    most significant of 13 and b = 0 as the least) is resolved when that falls
    below 2^(b-1):
        N(b) = 4 sigma_r0^2 / (tau * 4^b).
    GENERATOR-COMPUTED, OUTSIDE THE HARNESS, NO RUN RECORD, RE-DERIVATION
    REQUIRED. At ML-DSA-44 (gamma2 = 95232, beta = 78, tau = 39):
    N(12) = 18, N(11) = 74, N(10) = 295, N(9) = 1181, N(8) = 4724,
    N(7) = 1.89e4, N(6) = 7.56e4, N(5) = 3.02e5, N(4) = 1.21e6,
    N(3) = 4.84e6, N(2) = 1.93e7, N(1) = 7.74e7, N(0) = 3.10e8.
    THE EXCHANGE RATE IS THE RESULT: each additional bit of precision costs a
    factor of FOUR in signatures for this estimator, so the price of t0 spans
    seven orders of magnitude between its most and least significant bit.

    (C) THE FALSIFIABLE PREDICTION THAT COSTS AN HOUR. With N = 10^4 conforming
    signatures under one key, the averaging estimator resolves exactly the top
    five bit-planes at ML-DSA-44 (b = 12 down to 8, since N(8) = 4724 <= 10^4 <
    1.89e4 = N(7)) and exactly the top four at ML-DSA-65 and ML-DSA-87
    (b = 12 down to 9). "Resolves bit-plane b" is measured, not modelled: it is
    the fraction of the 256k coefficients for which floor((t0_hat + 2^(b-1))/2^b)
    equals floor((t0 + 2^(b-1))/2^b) against the TRUE t0 from the keypair, and
    the prediction is that this fraction crosses 1/2 between consecutive
    integers b at the stated places.

    (D) THE DISCRIMINATOR, WHICH IS WHY THIS IS WORTH RUNNING FIRST. The
    exchange rate is a property of the ESTIMATOR CLASS, not of ML-DSA. A
    1/sqrt(N) estimator gives a factor of 4 per bit; a 1/N set-membership
    estimator gives a factor of 2 per bit. So the measured slope of log N(b)
    against b - two bits of signature count per bit of precision, or one -
    decides in advance whether IDEA-20260821-6109f8's set-membership decoder
    can pay off, and does so at 10^4 signatures instead of 10^5, without
    building a decoder at all. A measured slope near log2(4) confirms the
    baseline; a slope near log2(2) at small N would mean the averaging
    estimator is already behaving super-efficiently and something in the noise
    model is misunderstood.

    (E) EXTERNAL CORROBORATION OF THE SHAPE, NOT OF THE NUMBERS. Wang, Gärtner
    and Dubrova (eprint 2024/2046, abstract page read this session) reduce the
    signature count for t0 reconstruction by roughly half using profiled
    side-channel analysis that partially recovers THE LEAST SIGNIFICANT BIT of
    t0 from power traces. That an attack pays for the LSB specifically, with
    physical access, is exactly what a steeply graded price curve predicts and
    is inconsistent with t0 being one uniformly priced object.

    NOT A BREAK. t0 is declared public by the security argument; a graded price
    for it is a threat-model statement and says nothing about MLWE, MSIS or
    SelfTargetMSIS in any direction.

  mechanism: >-
    (1) THE OBSERVATION. Inherited, and it is the one thing this proposal does
    not derive independently: for every accepted signature the public can
    compute u_j = (A z - c t1 2^d)_j - w1'_j * 2 gamma2 = (c t0)_j + r0_j with
    |r0_j| < gamma2 - beta, where w1' = UseHint(h, A z - c t1 2^d) is what
    FIPS 204 Algorithm 8 already computes. The derivation is in
    IDEA-20260821-6109f8 claim (A); Stage 1 here re-checks it exactly, and
    that check is shared between the two records so it is paid for once.

    (2) THE ESTIMATOR AND ITS EXACT VARIANCE. Write c^*(X) = c(X^-1) for the
    conjugate. Since c has exactly tau coefficients in {-1, +1}, the constant
    term of c^* c is exactly tau and its other coefficients are the
    autocorrelations of c, which have mean zero over B_tau. Hence
    t0_hat = (1/(N tau)) sum_i c_i^* u_i is unbiased to first order, with
    per-coefficient error variance sigma_r0^2/(N tau) from the noise plus
    sigma_t0^2/(N tau) from self-interference, where sigma_t0^2 = 2^(2d)/12.
    GENERATOR-COMPUTED: sigma_r0/sigma_t0 = 54937.5/2365.0 = 23.2 at ML-DSA-44,
    so self-interference contributes 0.19% of the variance and the single-term
    formula stands. The predicted RMS errors at ML-DSA-44 are 2782 / 880 / 278
    / 88.0 at N = 10 / 100 / 1000 / 10000, forced before the run.

    (3) WHY BIT-PLANES AND NOT COEFFICIENTS. A per-coefficient success rate
    conflates two things: how many coefficients are exactly right (a step
    function of N that is near zero until it is near one) and how much of each
    coefficient is right (a smooth quantity). The bit-plane filtration
    separates them. It also matches how a downstream user of t0 would actually
    consume it - a side-channel template that needs t0 to within +/- 64 is
    satisfied by bit-planes 12 down to 6 and does not care about the rest - so
    the curve is the operationally meaningful object and the single number is
    not.

    (4) THE TWO DUAL FILTRATIONS, AND WHY ONLY ONE IS OBSERVABLE. This is the
    lossy-projection content and it is not decoration. The LOW filtration
    x -> x mod 2^b propagates EXACTLY through the target's operations: since c
    has integer coefficients, (c t0) mod 2^b = (c (t0 mod 2^b)) mod 2^b, so the
    low bits form a closed system under the linear map. The HIGH filtration
    x -> floor(x / 2^b) does NOT propagate exactly, because carries leak
    upward from the discarded part. The observation reverses the two: r0 is
    uniform on a range of width 2(gamma2 - beta) >> 2^13, so u mod 2^b is
    uniform and carries NOTHING about t0 mod 2^b, while u itself pins
    floor(t0/2^b) as soon as the noise is averaged below 2^(b-1). SO THE
    QUOTIENT THAT PROPAGATES IS UNOBSERVABLE AND THE QUOTIENT THAT IS
    OBSERVABLE PROPAGATES ONLY APPROXIMATELY - and the price curve is exactly
    the cost of that approximation. That asymmetry is the reason the LSB is
    expensive and it is a structural statement, not a statistical one.

    (5) WHAT A DEVIATION WOULD MEAN, PER DIRECTION. If the measured N(b) sits
    BELOW the curve, the noise is smaller than sigma_r0 - most plausibly
    because the accepted r0 is not uniform on the truncated range but is
    concentrated, which would also make IDEA-20260821-6109f8's set-membership
    band optimistic in the same direction. If it sits ABOVE, either the
    coefficients of r0 are positively correlated within a signature (which the
    sup-norm rejection can induce) or the self-interference term is larger than
    derived, which happens if c's autocorrelations are not mean-zero over the
    challenges actually produced by SampleInBall. Both alternatives are
    measurable in the same run, and naming them in advance is what stops a
    deviation from being absorbed as "roughly consistent".

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb MCP index UNAVAILABLE this session (in-memory Qdrant per the
      operating brief); not called, nothing attributed to it.
      GREPS RUN WITH COUNTS: (i) -i "bit-plane|bit plane|per-key dispersion|
      ACVP|interoperab" across the repository (*.yaml, *.md) -> 39 files, and
      NONE of them is any of the five RQ-MLDSA-ffa0f5 proposals or either
      RQ-MLDSA-ffa0f5 hypothesis; the ML-DSA area contributes zero hits.
      (ii) -i "linear program|polytope|bounded noise|bounded-noise|Chebyshev
      center" over ledger/ -> 54 files, none in area MLDSA. (iii) "MLDSA" over
      ledger/hypotheses -> 8 files, of which H-MLDSA-2ae88d and H-MLDSA-2d4123
      carry question_id RQ-MLDSA-ffa0f5.
      READ: RQ-MLDSA-ffa0f5 and GOAL-MLDSA-002 in full; the lane's complete
      5-row proposal inventory; IDEA-20260805-630606 and IDEA-20260805-bb52fa
      in full; IDEA-20260805-031ce2, IDEA-20260808-4f83f6 and
      IDEA-20260808-e5f947 in large part.
      WEB QUERIES RUN (6, listed with hit counts): S1 (t0 paper, 8), S2 (t0 +
      linear programming + bounded noise, 8), S3 (t0 paper method, 10), S4
      (ACVP ML-DSA sigVer vectors, 9), S5 ('Dilithium t0 recovery "least
      significant" bits harder more signatures per bit plane precision
      estimator', 8), S6 (ML-DSA differential testing/conformance, 10). S5 was
      run specifically against this proposal's claim and returned no result
      presenting a per-bit-plane cost curve; it returned eprint 2024/2046,
      which attacks the LSB with side channels.
      FETCHED AND READ (LANDING/ABSTRACT PAGES ONLY): eprint.iacr.org/2024/2046,
      eprint.iacr.org/2024/1373, eprint.iacr.org/2025/195,
      eprint.iacr.org/2026/1333. FETCH FAILURES RECORDED: both eprint PDFs
      returned unparseable binary; the Springer chapter returned 303 to an
      authentication endpoint. NO FULL PAPER WAS READ.
    results: >-
      IN-CORPUS: the string "bit-plane" does not occur in any ML-DSA record;
      no record contains an estimator for t0, an error-versus-N curve, or a
      graded price for any secret. IDEA-20260805-630606 supplies the only
      adjacent quantity - the entropy floors 34 / 60 / 58 - and those are
      whole-object floors with no grading by bit significance; its heuristic
      H2 computes hint weights, not estimator error.
      EXTERNAL: the closest thing found is eprint 2024/2046's targeting of the
      LSB of t0 by side-channel analysis to halve the signature count, which is
      consistent with a graded price but is not a statement of one, and whose
      full text was not read. Whether eprint 2024/1373 reports a per-bit or
      per-precision breakdown is UNKNOWN for the same reason.
    verdict: >-
      UNVERIFIED. Claimed new relative to this corpus: the bit-plane filtration
      as the tracked object for t0, the closed form N(b) = 4 sigma_r0^2 /
      (tau 4^b), the thirteen numbers at ML-DSA-44, the exchange-rate framing
      (two bits of signature count per bit of precision), and the observation
      that the two dual filtrations trade propagation for observability.
      Standard machinery not claimed as invention: conjugate averaging, the
      1/sqrt(N) law, and the general fact that estimator precision costs
      quadratically in samples.

  object_first_candidate:
    tracked_object: >-
      THE BIT-PLANE FILTRATION OF t0: the chain of quotient maps
      pi_b : t0 -> floor((t0 + 2^(b-1))/2^b) for b = 12 down to 0, tracked as a
      family rather than one at a time, with the tracked quantity being the
      smallest N at which pi_b(t0_hat) = pi_b(t0) on a stated fraction of the
      256k coefficients. Established families declared off-limits as the
      primary lens: lattice reduction and estimator differencing of every kind;
      fault injection and physical side channels (GOAL-MLDSA-001's scope, and
      note that this proposal cites a side-channel paper only as corroboration
      of a SHAPE and performs no side-channel work); nonce misuse and the HNP
      family; forgery search. The lens used is elementary estimation theory on
      a quotient chain.
    lossiness: >-
      LOSSY BY CONSTRUCTION AND THE ANALYSIS IS THE PROPOSAL'S CONTENT, NOT ITS
      preamble. pi_b discards the low b bits of every coefficient - a factor
      2^b per coefficient, 2^(256kb) overall - so the fibre is enormous and this
      is emphatically not a change of coordinates. WHETHER THE DISCARD IS
      COMPATIBLE WITH THE TARGET'S OPERATIONS IS THE INTERESTING PART AND THE
      ANSWER IS: ONLY APPROXIMATELY, AND THE DUAL PROJECTION IS THE OPPOSITE.
      The complementary map x -> x mod 2^b commutes exactly with multiplication
      by the integer polynomial c, so the low quotient propagates
      deterministically; pi_b does not, because carries from the discarded part
      cross the boundary. But the ML-DSA observation is u = c t0 + r0 with r0
      of width 2(gamma2 - beta), which is 2^4.5 to 2^6 times larger than the
      whole range of t0, so u mod 2^b is exactly uniform and the propagating
      quotient is INVISIBLE, while pi_b - the non-propagating one - is what
      averaging recovers. The proposal's price curve is precisely the cost of
      that mismatch, and the mismatch is why the LSB is the expensive bit
      rather than the cheap one.
    propagation: >-
      One step is one signature. The one-step propagation law is exact and
      measurable: the estimator's error variance falls by a factor N/(N+1), so
      pi_b's success fraction advances by a derivable increment per signature.
      The design records the whole success-fraction surface (b by N) rather
      than a threshold, so the propagation law is observed at every step and
      not only at the crossing.
    survival_score: >-
      Bit-plane 12 survives from signature 18 onward and never degrades; bit-
      plane 0 does not survive within any budget this program can buy at these
      parameters. The object dissolves at exactly one identified place: below
      b = 0 there is nothing left, and above the point where the estimator's
      error is dominated by BIAS rather than variance the curve stops being
      1/sqrt(N) - which is the self-interference term and which the design
      measures rather than assumes away.

  null_object_control: >-
    NULL-1, THE RQ-MANDATED ONE, RUN AND CORRECTLY LABELLED: the identical
    measurement against a signature stream whose t0 was resampled independently
    of the key. Forced value: the success fraction at every bit-plane sits at
    chance, i.e. 2^-1 for a one-bit plane comparison and correspondingly for
    coarser ones, at every N. UNDER KN-TECH-1a5b7e THIS ARM CANNOT FAIL AS A
    TEST OF THE LEAK because its answer is forced to be chance by construction;
    it is therefore reported as a test of the PLUMBING - it catches a harness
    that has accidentally handed the estimator the true t0 - and is never cited
    as evidence about the curve.
    NULL-2, THE ARM THAT CAN FAIL AND ON WHICH THE VERDICT RESTS: the FORCED
    QUANTITATIVE CURVE ITSELF. The four predicted RMS errors 2782 / 880 / 278 /
    88.0 at ML-DSA-44 are derived before any data exists, and the measured
    curve either lands on them or does not. This is obligation 4 of
    KN-TECH-1a5b7e done properly: the reference model supplies a NUMBER, not a
    direction, and both the real arm and the resampled arm are scored against
    it. A measured 88.0 is a confirmation; a measured 40 or 200 is a refutation
    of the noise model with a named direction (mechanism (5)).
    NULL-3, GRADED, FOUR INTERIOR POINTS, MONOTONICITY REPORTED: resample a
    fraction f of t0's coefficients independently of the key, f in
    {0, 0.25, 0.5, 0.75, 1}. The per-bit-plane success fraction on the
    UNRESAMPLED coefficients must be independent of f (they are unaffected),
    while the overall fraction must fall linearly in f. Reporting BOTH is what
    distinguishes "the estimator recovers t0" from "the estimator recovers
    something correlated with the whole vector"; a non-linear or non-monotone
    response localises the failure.
    NULL-4, COMPARATOR REPLICATION (mode 5): the error curve is a generated
    comparator, so it is drawn at least 8 times with independent seeds and
    reported as an interval, never as a single curve. 8 draws at N = 10^4 is
    the cheapest line item in the design.
    VERDICT-ON-THE-NULL-FIRST: the bit-plane decision rule is executed and its
    verdict committed on the resampled-t0 arm before the real arm is read.

  discriminated_from:
    - >-
      IDEA-20260805-630606 computes an entropy floor for recovering ALL of t0
      and reports 34 / 60 / 58 signatures. It grades nothing: its object is the
      hint's capacity, its answer is a single number per parameter set, and its
      own record states the number bounds INFORMATION and not computation. This
      proposal grades by bit significance, measures rather than bounds, and its
      curve is a property of a named estimator. The two are also checkable
      against each other: N(12) = 18 signatures sits BELOW 630606's floor of 34,
      which is not a contradiction (the floor is for the whole 13312 bits and
      bit-plane 12 is 1024 of them) but is exactly the kind of comparison that
      would expose an arithmetic error in either record, and it is a required
      metric here.
    - >-
      IDEA-20260821-6109f8 (this batch) builds a set-membership decoder and
      aims at exact recovery. This proposal builds no decoder, cannot recover
      t0, and costs an hour instead of a campaign. It is deliberately the cheap
      sibling: its measured exchange rate PREDICTS whether 6109f8 can pay off,
      and 6109f8 should not be started before this record's Stage 1 identity
      check has passed.
    - >-
      IDEA-20260805-bb52fa's H1 is about the distribution of t0 itself, used to
      compute a rejection rate. This proposal's noise law is about r0, a
      different quantity from a different part of the algorithm, and its
      headline does not depend on t0's distribution at all - only on t0's RANGE,
      which FIPS 204 Algorithm 25 guarantees.
    - >-
      IDEA-20260808-4f83f6 measures a t0-induced deviation in the accepted
      challenge law. Different observable, no shared statistic, and that record
      states it is likely dominated by the hint route - which is the route
      this proposal instruments.
    - >-
      eprint 2024/2046 recovers the LSB of t0 from POWER TRACES. This proposal
      touches no device, uses only public transcript data, and cites that work
      solely as external corroboration that the LSB is the expensive bit.

  citations:
    - ref: 'eprint 2024/2046 — Wang, Gärtner, Dubrova, "Decompressing
        Dilithium''s Public Key with Fewer Signatures Using Side Channel
        Analysis", approved 2024-12-19 (KTH)'
      provenance: retrieved
      claim: >-
        ABSTRACT/SUMMARY PAGE ONLY, FULL TEXT NOT READ. Reports profiled
        deep-learning side-channel analysis that partially recovers the LEAST
        SIGNIFICANT BIT of t0 from power traces on an ARM Cortex-M4, reducing
        the number of signatures needed for t0 reconstruction by roughly half.
        USED HERE ONLY as external corroboration of the SHAPE of the price
        curve; none of this proposal's numbers derives from it, and no claim is
        made about its correctness.
      verified_by: idea-generator@2026-08-21
    - ref: 'eprint 2024/1373 — Azevedo Oliveira, Calle Viera, Cogliati, Goubin,
        "Uncompressing Dilithium''s public key", CRYPTO 2025'
      provenance: retrieved
      claim: >-
        ABSTRACT/LANDING PAGE ONLY. Verified: "Between 200,000 and 500,000
        signatures are sufficient to recover t0 on a desktop computer",
        depending on the security level. Whether the paper reports any
        per-precision or per-bit breakdown is UNKNOWN to this session - the PDF
