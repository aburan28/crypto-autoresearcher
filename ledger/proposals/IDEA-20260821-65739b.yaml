      verified_by: idea-generator@2026-08-21
    - ref: 'FIPS 204 Section 6.1 (the t0 sentence), Table 1 (gamma2, beta, tau,
        d, k), Algorithm 8 (w''Approx, UseHint), Algorithm 25 (t0 range
        annotation)'
      provenance: internal
      claim: >-
        Taken from the transcription recorded in IDEA-20260805-630606 and
