      (RQ-RELN-001), which study the integer left-kernel lattice and
      relation-generation entropy of augmented relation rows -- adjacent framework,
      no Frobenius, no basis ambiguity. SIXTH: KN-FIND-47da4e, which measures orbit
      unions as cost-neutral and is the reason (D)'s two EMPTY rows are not simply
      dead. Grep performed over ledger/proposals, ledger/hypotheses and knowledge/
      for: rank deficit, independent relations, orbit quotient, conjugate relations,
      lambda eigenvalue Frobenius, k divides r-1, ord_163(2), ord_233(2). No record
