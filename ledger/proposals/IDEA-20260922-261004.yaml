  citation_note: >-
    Every ord_n(2) value and every intermediate power in (D) was derived by hand in
    this session and is labelled as mine; no script was run, because this session has
    no execution tool. Each derivation is written out so a reader can check it in one
    line, and the minimal test's Part 1 recomputes all six independently. The
    ord_131(2) = 130 row agrees with three existing corpus records and is included as
    the cross-check that the hand method is sound. GGMP Lemma 3.3 is quoted only
    through KN-OPEN-095df5's relay; the paper was not opened, and no claim about its
    text is made beyond that relay.
  assumptions:
    - k (equivalently n) prime, so Frobenius orbits on G and on a stable base have size 1 or k, and the size-1 ones are exactly the F_q-rational points.
    - G is not contained in E(F_q), so lambda != 1 and ord(lambda) = k exactly.
    - The factor base is Frobenius-stable as a set; the quotient basis needs nothing more.
    - Logarithms are taken in the prime-order group G, so lambda^{-j} is well defined.
    - Uses F2 and F6 as declared components. No new tracked object is proposed and the record says so.
    - Arithmetic only at deployed parameters. Executable cells are toy binary curves at n <= 41 and subfield cells with dk <= 41.
  proof_search_map:
    bottleneck: >-
      Relation YIELD is the multiplier on every decomposition cost in this
      question's cost table. On the Frobenius rows the yield is quoted as k per
      solve and the linear algebra as /k^2, from two different bases, and no
      instrument in this program reports both on the same relations. Until the unit
      is fixed, every Koblitz and subfield cost cell in the reachability table is
      ambiguous by a factor k -- 233 on K-233, 131 on ECC2K-130.
    baseline_embedding:
      parameter_slice: >-
        IDEA-20260915-8fe0ef's stated accounting -- relation-search cost /n, linear
        algebra /n^2, matched rho /sqrt(2n), net gap movement sqrt(n/2) -- at the
        n = 17 toy cell with r = 65587 and lambda = 17184 recorded in
        KN-OPEN-095df5.
      reproduction_check: >-
        On that exact cell, the instrument must reproduce (i) lambda^17 = 1 mod
        65587 and lambda != 1, hence 17 | 65586; (ii) the recorded evaluations:
        Phi_17(lambda) = 0 mod r and both degree-8 divisors of Phi_17 nonzero at
        lambda. If the instrument disagrees with the recorded n = 17 numbers, it is
        the instrument that is wrong and nothing downstream is read.
    observation_collision:
      observable: >-
        rank(M) of the k-row conjugate family, computed over F_r, reported THREE
        times on the identical relations: in the raw basis, in the orbit-quotient
        basis, and in the "ker g(tau) module" basis Lemma 3.3 appears to intend.
      distinct_preimage_search: >-
        A measured rank of n' would have two very different preimages: a genuine
        module-theoretic collapse (the conjugate rows generate a proper submodule of
        dimension n'), or an artefact of orbits shorter than k appearing in the base
        (which would also cut the raw rank). The distinguishing preimage is the
        orbit-length histogram of the base, reported with every rank; by
        IDEA-20260922-6cf862(A) short orbits cannot enter a relation for a target in
        G, so a measured short orbit in a relation is itself a refutation of
        something and must be chased before the rank is read.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The relation row in the orbit-quotient basis (dimension |V|/k), with the shift absorbed as lambda^{e}
        predicted_gain: >-
          Linear-algebra dimension /k and relation storage /k, at O(k) word
          comparisons per leg; and the yield restated as 1 relation per solve rather
          than k, which is a LOSS of a factor k relative to the double-counted
          accounting and is the record's actual deliverable.
      - transform: observable_fiber
        proposed_object: The conjugate family of a relation as a single object, with "which conjugate was found first" as the discarded fibre coordinate
        predicted_gain: >-
          None in cost. Named so the (k -> 1) collapse is on the record as a
          search-side, not group-side, loss.
    quantifier_order: >-
      FOR EVERY Frobenius-stable factor base V, FOR EVERY target R in G, and FOR
      EVERY decomposition of R over V with all legs in size-k orbits, the k
      conjugate rows have rank k in the raw basis and rank 1 in the quotient basis.
      The quantifier is over all relations, not over a sampled set, and the proof is
      the disjoint-support argument plus the lambda^{e} absorption -- so a single
      measured counterexample is a refutation, and agreement on a sample is a
      consistency check and nothing more.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On toy Koblitz and subfield cells with n, dk <= 41, the k Frobenius
        conjugates of a relation over a stable base have rank exactly k in the raw
        basis and exactly 1 in the orbit-quotient basis, on every relation measured;
        ord_n(2) = 130, 162, 29, 94, 204, 114 at the six deployed n; and k | r - 1
        holds at every standardized subfield and Koblitz row checked." It certifies
        NOTHING about what GGMP proved (the paper is unread), nothing about the
        cost of any deployed attack, and nothing about bases that are not
        Frobenius-stable.
      nearby_object_control: >-
        TWO, BOTH BLOCKING. (i) NULL OBJECT: an ordinary binary curve over the same
        field defined over no proper subfield -- B-163's toy analogue -- where no
        Frobenius endomorphism exists, k = 1, and the two bases COINCIDE. Any
        instrument that reports a difference there is measuring itself. (ii)
        PROVES-TOO-MUCH: a size-matched NON-stable subspace base on the same Koblitz
        curve. The conjugate rows still exist as group identities but their legs
        leave the base, so the conjugate family is not a family of relations at all;
        an instrument that still reports rank k there is counting rows, not
        relations, which is the exact confusion the record is about.
    proof_obligations:
      - claim: lambda^k = 1 and lambda != 1 in (Z/r)^*, hence ord(lambda) = k and k | r - 1, at every deployed subfield/Koblitz row.
        responsibility: correctness
      - claim: The k conjugate raw rows have pairwise disjoint supports when all legs lie in size-k orbits.
        responsibility: correctness
      - claim: The k conjugate quotient rows are literally equal (the lambda^{-j} and lambda^{+j} cancel).
        responsibility: correctness
      - claim: Short orbits (F_q-rational legs) cannot occur in a relation for a target in G.
        responsibility: correctness
      - claim: ord_n(2) = 130, 162, 29, 94, 204, 114 at n = 131, 163, 233, 283, 409, 571.
        responsibility: correctness
      - claim: The measured rank triple is reported with the orbit-length histogram of every relation.
        responsibility: strictness
      - claim: Nothing here is a statement about GGMP's text.
        responsibility: scope
  predictions:
    - metric: rank_of_conjugate_family_raw_basis
      direction: flat
      minimum_effect: EXACTLY k, on every relation, on every toy cell with a stable base. A single relation with raw rank < k, whose legs are all in size-k orbits, refutes (B).
    - metric: rank_of_conjugate_family_orbit_quotient_basis
      direction: flat
      minimum_effect: EXACTLY 1, on every relation, on every toy cell. A single relation with quotient rank > 1 refutes (B) and is the more informative of the two failures.
    - metric: rank_of_conjugate_family_in_the_ker_g_module_basis
      direction: different
      minimum_effect: >-
        One of {1, n', k}, reported without a preferred outcome, for each divisor g
        of T^n - 1 defining the base. The value n' would corroborate Lemma 3.3 as
        relayed; the value 1 would say the lemma's bound is not tight in this basis;
        the value k would say the basis is the raw one in disguise. All three are
        reportable results and the record predicts no one of them.
    - metric: divisibility_k_divides_r_minus_1_per_deployed_row
      direction: flat
      minimum_effect: TRUE at all eleven rows checked (five c2pnb, ECC2K-130, five FIPS Koblitz). A single FALSE is a hard refutation of (A) or of the parameter set and must be resolved before anything else is read.
    - metric: ord_n_of_2_at_deployed_n
      direction: flat
      minimum_effect: EXACT AGREEMENT with 130, 162, 29, 94, 204, 114 by independent computation. The 131 row must agree with the three existing corpus records or the hand method is unsound and all six are rewritten.
    - metric: effective_relations_per_solve_in_the_unit_the_linear_algebra_consumes
      direction: lower
      minimum_effect: >-
        EXACTLY 1, not k. Stated as a downgrade of the accounting: any cost cell in
        the reachability table that took both the /k relation gain and the /k^2
        linear-algebra gain as independent is overstated by a factor k in its
        relation column and must be recomputed.
  minimal_test:
    design: >-
      THREE PARTS. PART 1 (arithmetic, no run, minutes): independently recompute
      ord_n(2) at n = 131, 163, 233, 283, 409, 571 and the stable-dimension sets;
      re-derive r for the five c2pnb curves, ECC2K-130 and K-163..K-571 from their
      primary standards (ANSI X9.62, FIPS 186-4, the Certicom challenge page) and
      check k | r - 1 at each. Deliverable: one table, eleven divisibility verdicts,
      six ord values. PART 2 (toy cells, n <= 41, the rank measurement): Koblitz
      curves y^2 + xy = x^3 + a x^2 + 1 over F_{2^n} for n prime in {17, 19, 23, 29,
      31, 37, 41} with ord_n(2) < n - 1 so a stable subspace exists -- and, as the
      forced-negative arm, n with ord_n(2) = n - 1 where it does not. For each cell:
      build V = ker g(tau) for each monic divisor g of T^n - 1 of usable degree;
      collect relations at m in {2, 3} by exhaustive decomposition; for EVERY
      relation found, form the n conjugates and compute rank over F_r three times --
      raw, orbit-quotient, and ker-g-module -- reporting the orbit-length histogram
      of each relation alongside. PART 3 (the accounting consequence): for each cell,
      run the full pipeline to a solved logarithm twice, once with the raw-basis
      linear algebra at dimension |V| and once with the quotient at |V|/n, and report
      total charged cost of both, so the "one gain counted twice" claim is settled by
      a completed solve rather than by a rank.
    controls:
      - NULL OBJECT: ordinary (non-subfield) binary curve over the same field, where k = 1 and the two bases coincide; every metric must be degenerate there.
      - Size-matched NON-stable subspace on the same Koblitz curve; conjugate legs leave the base and no conjugate family exists.
      - Forced-negative arm: n with ord_n(2) = n - 1 (e.g. n = 19, 29, 37 if they fall there; determined in Part 1), where no usable stable subspace exists and Part 2 must return nothing to measure. A run that produces a stable base there is an instrument defect.
      - The recorded n = 17 cell (r = 65587, lambda = 17184) as the reproduction check, before any new cell is read.
      - Planted relations with a known conjugate family, to confirm the rank routine can return each of 1, n' and k when handed a matrix of that rank.
      - Solver-free ground truth: at these sizes the decomposition census is exhaustive.
    required_metrics:
      - ord_n_of_2_recomputed_per_deployed_n
      - k_divides_r_minus_1_verdict_per_deployed_row
      - rank_raw_basis_per_relation
      - rank_orbit_quotient_basis_per_relation
      - rank_ker_g_module_basis_per_relation_per_divisor_g
      - orbit_length_histogram_per_relation
      - relations_per_solve_in_each_basis
      - linear_algebra_dimension_and_charged_cost_in_each_basis
      - total_charged_pipeline_cost_raw_vs_quotient
      - certificate_pass_rate
  falsification_conditions:
    - A relation over a stable base, all legs in size-k orbits, whose k conjugate raw rows have rank < k. Refutes the disjoint-support half of (B).
    - A relation whose conjugate quotient rows have rank > 1. Refutes the absorption half of (B) and is the more damaging failure, since the factor-k linear-algebra gain rests on it.
    - Any deployed row with k not dividing r - 1. Refutes (A) for that row and voids every Frobenius accounting on it.
    - An independent computation disagreeing with any of the six ord_n(2) values, including the 131 cross-check.
    - Part 3 showing the raw and quotient pipelines cost the SAME total. That would mean the quotient buys nothing end to end and the "counted twice" framing is wrong -- a real and reportable outcome, not a failed experiment.
    - The rank routine failing to return n' on a planted rank-n' matrix. Instrument defect; nothing is read.
  confounders:
    - Very small toy cells can have |V| so small that the conjugate family exhausts the base, making disjointness accidental rather than structural; report |V| and n together and exclude cells with |V| < 4n from the disjointness reading.
    - Orbit-length anomalies at legs lying in F_2: forbidden for targets in G by IDEA-20260922-6cf862(A), but an instrument bug could produce them; the histogram is the tripwire.
    - The three ranks are computed over F_r and r is small at toy scale; a spurious dependency at small r is possible and is controlled by repeating each cell on two curves with different r at the same n.
    - Charged-cost comparison in Part 3 is sensitive to the sparse-linear-algebra implementation; both arms must call the same routine at different dimensions, and the per-row nonzero count must be reported.
    - KN-FIND-47da4e's promotion gate is NOT met; its cost-neutrality numbers must not be used as ground truth in interpreting Part 3, only as context.
  interpretation_limits:
    - Proposal only. No experiment, no run, no approval, no result exists here.
    - >-
      KN-OPEN-020 CLASS DECLARATION. No new factor base is proposed. The bases used
      are the Frobenius-stable subspaces of IDEA-20260918-9abf42, which sit in the
      HIGH-DEGREE open class in the un-descended model (linearised-polynomial
      membership predicate of degree 2^{n - l}) and are F_2-LINEAR in the descended
      model; charged costs are description O(l.n) bits for a basis, membership one
      F_2-linear test of rank n - l, relation as measured, descent unchanged, time
      and memory as in target_complexity. Not target-dependent.
    - This record LOWERS a claimed gain. Its best outcome for an attacker is that one published factor is confirmed to be two names for one thing; there is no outcome in which an attack gets faster.
    - Nothing is claimed about the text of eprint 2020/1315. The paper was not opened; Lemma 3.3 enters only through KN-OPEN-095df5's relay, which itself flags the point as unadjudicated.
    - Toy range n <= 41 against deployed targets at 131-571; the extrapolation distance for any cost reading is a factor 2^{90} or more in group size. The ord_n(2) and k | r - 1 rows are exact arithmetic at deployed parameters and carry no extrapolation; everything else does.
    - (D)'s EMPTY verdicts are about stable SUBSPACES only. Stable SETS (orbit unions) exist at every size on every row because n is prime, and KN-FIND-47da4e's unpromoted measurement says their natural parameterisation is cost-neutral. Empty is not closed.
  heuristic_assumptions:
    - id: H-261004-0
      statement: >-
        NONE FOR (A), (B) OR (D). The eigenvalue argument, both rank computations
        and the ord_n(2) census are unconditional finite arithmetic and linear
        algebra over F_r. Recorded so the absence is explicit.
      rigorous_support: >-
        Lagrange in (Z/r)^* for (A); disjointness of supports plus the lambda^e
        absorption for (B); the normal basis theorem and the ideal structure of
        F_2[T]/(T^n - 1) for (D).
      validation_plan: Part 1 and the planted-rank controls of Part 2; seconds of compute, and the 131 row is a cross-check against three existing corpus records.
    - id: H-261004-1
      statement: >-
        GENERIC-POSITION HEURISTIC, needed only to extend (B) from ONE conjugate
        family to the FULL relation matrix: that relations from DIFFERENT targets,
        collected by independent re-randomisation, are in general position, so the
        rank of the assembled quotient system grows by one per independent solve
        until it reaches |V|/k - 1. This imitates the classical random-matrix
        coupon-collector law used for index-calculus linear algebra, whose
        prime-field analogue is the left-kernel threshold x = 1 - e^{-mx} of
        IDEA-20260805-061f97.
      rigorous_support: >-
        None. The per-family rank statement is exact; the cross-family independence
        is the heuristic and is exactly the quantity IDEA-20260815-fa56e7 proposes
        to measure.
      validation_plan: >-
        Measure the growth of rank(assembled quotient system) against the number of
        independent solves, on every toy cell, against the coupon-collector
        prediction and against IDEA-20260805-061f97's fixed-point value; check the
        TAIL as well as the mean by reporting the distribution of the increment
        (0 or 1) per solve and testing it against the predicted Bernoulli, because a
        matching mean with excess zeros is the signature of a base whose relations
        concentrate. Sample: every relation from the exhaustive census at m = 2 and
        at least 10^4 solves at m = 3 per cell. Transfer assumption, stated: that
        general position at n <= 41 persists at n in {233, ..., 571}. It is not
        tested and the deployed rows say so.
    - id: H-261004-2
      statement: >-
        RHO BASELINE CONVENTION: 0.886 sqrt(r)/sqrt(k) group operations, which is
        sqrt(pi r/(4k)). The constant 0.886 = sqrt(pi/4) is already negation-only
        rho, so the Frobenius gain over that row is sqrt(k), not sqrt(2k);
        dividing by sqrt(2k) double-counts negation and undershoots KN-LIT-096.
        Charged under van Oorschot-Wiener, calibrated against that record's
        2^60.9 for ECC2K-130 before use.
      rigorous_support: Standard convention (KN-TECH-006 in this corpus); the arithmetic is mine.
      validation_plan: Reproduce 2^60.9 at ECC2K-130 before any row is quoted.
  heuristic_note: >-
    The record's three hard results carry no heuristic; the one heuristic (H-1) is
    needed only to go from one relation family to a full matrix, and it is precisely
    the quantity a sibling record already proposes to measure. The a-priori
    expectation is stated so neither outcome can be read as interesting after the
    fact: raw rank k and quotient rank 1 are DERIVED and are expected to hold
    exactly; the ker-g-module rank is genuinely unknown to this record and is the
    one column with no prediction; and Part 3 is expected to show the quotient
    pipeline cheaper by a factor of order k^2 in linear algebra and IDENTICAL in
    relation count once the unit is fixed, which is the claim.
  target_complexity:
    time_exponent: >-
      No exponent moves in either direction. The record's numerical content is a
      correction of a factor k in ONE column of a cost table, in the direction of
      making index calculus look WORSE than the double-counted accounting: relation
      yield per solve is 1, not k, in the unit the linear algebra consumes. The
      linear-algebra gain of k^2 (dimension /k with about m nonzeros per row, sparse
      cost ~ dimension^2) is confirmed and is not the disputed part.
    memory_exponent: >-
      Relation storage |V|/k rather than |V| under the quotient accounting; on
      K-233 at (l, m) = (58, 4) that is 2^58/233 ~ 2^50.1 rows, and at (29, 8) it is
      2^29/233 ~ 2^21.1 rows -- the only deployed Koblitz design point in this
      record whose linear algebra is within reach of a real machine, and its arity
      m = 8 is what makes it unreachable instead.
    best_known: >-
      Matched rho with negation and the Frobenius class map: my arithmetic,
      0.886 sqrt(r)/sqrt(n). K-233 at log2 r = 231: 115.5 - 0.175 - log2 sqrt(233) =
      115.5 - 0.175 - 3.93 = 2^111.4. ECC2K-130: 2^60.9 from KN-LIT-096, not
      recomputed. The other FIPS Koblitz rows follow the same formula and are left
      to the deliverable table rather than asserted here.
    hidden_overhead: >-
      Orbit canonicalisation O(k) word comparisons per leg, charged. The arity-m
      decomposition constant at m >= 4 is the dominant hidden term on every design
      point in (D) and is NOT estimated here; it belongs to RQ-SDEG-001 and the
      SEMBIN questions.
    tradeoff_note: >-
      The quotient accounting is a pure memory win at a linear canonicalisation
      cost and should be taken on every Frobenius row regardless of the rest. It
      changes no time-memory frontier: relation search is unchanged, and the
      parallelization position of both phases is unchanged.
  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Part 1 is eleven modular reductions and six order computations: minutes. Part 2
      reuses the toy Koblitz decomposition machinery the FROB and DREG lines already
      have and adds a three-basis rank readout and an orbit-length histogram --
      a few hundred lines. Part 3 is one extra full-pipeline run per cell. Single
      machine, hours.
  asymptotic_claim:
    problem: Relation accounting for Frobenius-stable factor bases in binary index calculus, on the Koblitz and subfield rows of the standardized population
    prior_best: 'The accounting of KN-LIT-796 as relayed: 1/n fewer systems and n^2 faster linear algebra'
    time_exponent: unchanged (1/2 for rho, unchanged for index calculus); the correction is a factor k in one column
    memory_exponent: unchanged in exponent; storage /k
    hidden_cofactor: none introduced; one existing cofactor is claimed to be double-counted
    claim_kind: accounting_correction
  dominated_by: >-
    Matched rho with the curve's own symmetries on every named row: 2^60.9 for
    ECC2K-130 (KN-LIT-096), 2^111.4 for K-233 (my arithmetic under H-261004-2), and
    the corresponding figures for K-283/409/571 and the five c2pnb rows. This record
    proposes no algorithm and therefore beats nothing; it is Pareto-INCOMPARABLE to
    the frontier in the strict sense that it moves no cost, and its effect on the
    table is to move one index-calculus column AWAY from rho. Other frontier rows
    checked, none addressed: GHS/Weil descent (KN-LIT-007, 090, 449, 6987);
    Gaudry's abelian-variety q^{2-2/g}; Joux-Vitse; the quasi-subfield line; BSGS,
    kangaroo, multi-target and preprocessing rows. Stated as "no result claimed
    against the frontier; the deliverable is a unit, not a cost" after checking
    those rows.
  sota_delta:
    time: >-
      0 exponent. Correction of -log2(k) in the relation-yield column of every
      Frobenius row: -7.36 bits on ECC2K-130's hypothetical stable-set accounting,
      -7.86 on K-233, -3.46 on c2pnb176v1 (k = 11). The sign is against the
      attacker.
    memory: -log2(k) in relation storage and linear-algebra dimension, which is the confirmed half of the published pair.
    data_queries: Not applicable.
  frontier_check:
    status: pending
    note: >-
      eprint 2020/1315 was NOT opened this session and its Lemma 3.3 is known here
      only through KN-OPEN-095df5's relay, which flags the lemma's hypothesis as
