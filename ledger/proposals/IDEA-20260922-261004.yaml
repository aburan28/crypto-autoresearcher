  recommended_priority: high
  priority_rationale: >-
    It is the cheapest record in this lane that changes a number already in use.
    Every Frobenius row of the reachability table RQ-BINSTD-b6f698 is building is
    currently ambiguous by a factor k -- 131 on ECC2K-130, 233 on K-233 -- and the
    ambiguity is resolved by computing one rank twice on relations the program
    already knows how to produce. It also adjudicates an item KN-OPEN-095df5
    explicitly records as open, and it supplies the deployed ord_n(2) census that
    tells four other records which standardized rows they may even be stated on. Not
    "high" because it improves an attack -- it makes one column worse for the
    attacker, which is the point -- but because an unfixed unit contaminates every
    downstream comparison in the question's decision target.
