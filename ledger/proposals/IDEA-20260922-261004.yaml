idea:
  id: IDEA-20260922-261004
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    "One relation is k relations" is a BASIS-DEPENDENT sentence and this corpus
    counts it in two bases at once: the k Frobenius conjugates have rank exactly k
    over the raw factor base and rank exactly ONE over the orbit-quotient base, so
    the honest relation unit is per-orbit -- with the deployed lane census
    ord_n(2) = 130, 162, 29, 94, 204, 114 at n = 131, 163, 233, 283, 409, 571 saying
    which standardized rows the statement can even be applied to
  class: measurement
  claim: >-
    SETTING. E/F_q a subfield curve attacked over F_{q^k}, k prime, phi the q-power
    Frobenius endomorphism; or E/F_2 a Koblitz curve over F_{2^n}, n prime, tau the
    2-power Frobenius. G the prime-order subgroup of order r, V a Frobenius-stable
    factor base. Write k for the Frobenius order in either case (k = n on a Koblitz
    row).

    (A) THE EIGENVALUE, AND A DEPLOYED ARITHMETIC CHECK NOBODY HAS RUN. phi acts on
    G as multiplication by a scalar lambda in (Z/r)^*. lambda^k = 1 because
    phi^k = id on E(F_{q^k}), and lambda != 1 because G meets ker(phi - 1) only in O
    (IDEA-20260906-a77711; instantiated at deployed parameters in
    IDEA-20260922-6cf862). For k prime this forces ord(lambda) = k exactly, hence
    k | r - 1. That is a falsifiable arithmetic statement about every standardized
    subfield and Koblitz row in this population: 11 | r-1 for c2pnb176v1,
    13 | r-1 for c2pnb208w1, 17, 19, 23 likewise; 131 | r-1 for ECC2K-130; 163, 233,
    283, 409, 571 | r-1 for K-163..K-571. It costs one modular reduction per row and
    it has not been recorded anywhere in this corpus. If any row fails it, the
    Frobenius-orbit accounting below is void for that row and something is wrong
    with either the parameter set or the structural claim.

    (B) THE RANK, EXACTLY, IN TWO BASES -- A DERIVATION, NOT A MEASUREMENT. Let a
    relation be sum_i a_i P_i = R with P_i in V, a_i in Z/r, R in G. Applying phi^j
    gives sum_i a_i phi^j(P_i) = lambda^j R; dividing by lambda^j normalises the
    right-hand side back to R.
      RAW BASIS (coordinates indexed by the points of V, unknowns x_P = log_P0 P).
      Row j has entries a_i lambda^{-j} at the positions phi^j(P_i). For a target
      whose decomposition has all legs in size-k orbits -- which by (A) and
      IDEA-20260922-6cf862(A) is every leg that can appear at all, since the only
      short orbits are the F_q-rational points and those cannot occur in a relation
      for a target in G -- the k rows have PAIRWISE DISJOINT SUPPORTS. Disjointly
      supported nonzero rows are independent, so the k conjugates have rank
      EXACTLY k.
      ORBIT-QUOTIENT BASIS (coordinates indexed by the |V|/k Frobenius orbits,
      unknowns y_O = log of a chosen representative, with log phi^e(P) = lambda^e
      y_{O(P)}). Row j becomes sum_i a_i lambda^{-j} lambda^{e_i + j} y_{O_i} =
      sum_i a_i lambda^{e_i} y_{O_i}, which is INDEPENDENT OF j. All k rows are the
      same row. Rank EXACTLY 1.
    Both statements are true simultaneously and they are not in tension: the two
    linear systems have dimensions |V| and |V|/k and carry exactly the same
    information. The error this record targets is MIXING them -- counting relations
    in the raw basis (k per solve, the factor KN-LIT-796 reports) while counting
    linear-algebra dimension in the quotient basis (|V|/k, the n^2 gain KN-LIT-796
    reports), and then reading the two as independent gains. They are the same gain
    stated twice.

    (C) THE ADJUDICATION THIS CORPUS IS OWED. KN-OPEN-095df5 records, as an
    unadjudicated adjacent reading, that GGMP Lemma 3.3 concludes "Frobenius applied
    to one relation over a Frobenius-invariant base of dimension n' yields at most n'
    independent relations, for any divisor l of X^n - 1", that its proof appears to
    need l(pi) to annihilate factor-base points, and that on the recorded n = 17 cell
    both degree-8 divisors of Phi_17 evaluate nonzero at lambda while Phi_17 itself
    evaluates to zero -- consistent with the conclusion holding only for l = Phi_n.
    So there are THREE candidate answers to "how many of the k conjugates are
    independent": 1 (quotient basis, derived above), n' = dim V (Lemma 3.3 as
    relayed), and k (raw basis, derived above). They cannot all be answers to the
    same question, and naming the basis is what separates them. The experiment below
    decides among the three BY MEASUREMENT on toy cells and thereby adjudicates an
    open item this corpus has explicitly flagged and left open.

    (D) WHERE THE STATEMENT APPLIES, AT DEPLOYED PARAMETERS. A Frobenius-stable
    F_2-SUBSPACE factor base of usable dimension exists on F_{2^n} only when
    ord_n(2) < n - 1 (IDEA-20260915-8fe0ef's criterion; the underlying
    correspondence is IDEA-20260918-9abf42's). MY ARITHMETIC, derived by hand this
    session for the deployed rows:
      n = 131 (ECC2K-130): ord = 130. 2 is a non-residue (131 = 3 mod 8) so ord is
        even; 2^2, 2^10 = 107, 2^26 = 53 all != 1. Stable dims {0,1,130,131}: EMPTY.
        (Agrees with IDEA-20260918-9abf42, KN-OPEN-095df5 and KN-FIND-47da4e.)
      n = 163 (K-163): ord = 162. 163 = 3 mod 8 so ord is even and does not divide
        81; 2^9 = 23, 2^18 = 40, 2^27 = 105, 2^54 = 104, 2^81 = 162 = -1, all
        mod 163. Stable dims {0,1,162,163}: EMPTY. NEW HERE.
      n = 233 (K-233): ord = 29. 2^8 = 23, 2^16 = 63, 2^29 = 63.23.16.2 = 1 mod 233;
        29 is prime and 2 != 1. f = 1 + 232/29 = 9, dims {29j, 29j+1 : 0<=j<=8}.
        LANE EXISTS; (l, m) = (58, 4) meets ml = 232 ~ n.
      n = 283 (K-283): ord = 94. 2^16 = 163, 2^32 = 250, 2^64 = 240, and
        2^94 = 240.163.256.16.4 = 1 mod 283; the even divisors 2 and 6 fail.
        f = 1 + 282/94 = 4, dims {94j, 94j+1 : 0<=j<=3}. LANE EXISTS; (94, 3).
      n = 409 (K-409): ord = 204. 409 = 1 mod 8 so ord | 204; 2^16 = 96, 2^17 = 192,
        2^34 = 54, 2^51 = 143, 2^68 = 53, 2^102 = 408 = -1 mod 409.
        f = 1 + 408/204 = 3, dims {0,1,204,205,408,409}. LANE EXISTS; (204, 2).
      n = 571 (K-571): ord = 114. 571 = 3 mod 8 so ord is even; 2^10 = 453,
        2^30 = 306, 2^38 = 109, 2^114 = 109^3 = 1 mod 571; the even divisors 2, 6,
        38 fail. f = 1 + 570/114 = 6, dims {114j, 114j+1 : 0<=j<=5}. LANE EXISTS;
        (114, 5).
    CONSEQUENCE. The two rows this program cares about most -- ECC2K-130 and K-163
    -- are exactly the two where the stable-SUBSPACE lane is empty, so on them the
    per-orbit accounting of (B) applies only to stable SETS (orbit unions), whose
    cost KN-FIND-47da4e measures as neutral. On K-233, K-283, K-409 and K-571 the
    lane exists and (B) is the accounting those rows must use. B-163..B-571 and the
    c2tnb family are the NULL OBJECTS: no Frobenius endomorphism, k = 1, and the
    whole statement is content-free there by construction.
    Representation class R1; the attack stage whose charged cost it claims to
    change is RELATION ACCOUNTING and LINEAR ALGEBRA DIMENSION -- and the claimed
    change is that one published gain has been counted twice, which moves the
    charged cost UPWARD by a factor k relative to the double-counted version.
  mechanism: >-
    OBJECT FRAME. Representation: the relation row vector of a decomposition,
    expressed in one of two explicitly named coordinate systems on the factor base
    -- raw (indexed by points, dimension |V|) or orbit-quotient (indexed by
    <phi>-orbits, dimension |V|/k, with the transition map log phi^e(P) =
    lambda^e y_{O(P)}). Operation set Sigma: translation by factor-base elements,
    together with <phi> acting on the index set. Trichotomy: PARTIAL-ACTION
    (Class I). The relation vector propagates only under translation by factor-base
    elements; <phi> acts on the labelling, not on the propagation.

    LOSSY-PROJECTION TEST AGAINST THAT SIGMA. The projection is the change of
    coordinates from the raw row to the quotient row. It DISCARDS the shift index
    e_i of each leg within its orbit -- but not freely: it discards it AFTER
    absorbing it into the coefficient as lambda^{e_i}. The discard is
    Sigma-compatible because the orbit partition is a block system of <phi> acting
    on V (IDEA-20260901-863e36) and because lambda is a scalar on G, so the absorbed
    factor is well defined. IS IT LOSSY? Here is the point of the whole record, and
    it must be stated precisely rather than asserted: the map from ONE raw row to
    ONE quotient row is INJECTIVE on rows with all legs in size-k orbits -- it is a
    change of coordinates, and by the program's own standard (docs/inventor-protocol
    section 2) a change of coordinates is not a new object. What IS lossy is the map
    from the k-row CONJUGATE FAMILY to its single quotient row: k rows to one row,
    a genuine (k -> 1) collapse, and the discarded data is exactly "which conjugate
    was found first", which is information about the SEARCH and not about the group.
    So this record does not propose a new tracked object at all. It proposes that
    the corpus's relation unit is ambiguous between two bases, derives the exact
    rank in each, and measures which one the published gains were stated in. That
    is why its class is `measurement` and not `representation`, and why it claims no
    exponent.

    THE PRICED NUMBER. Orbit canonicalisation, charged as in IDEA-20260922-6cf862:
    O(k) word comparisons per factor-base point by cyclic minimisation in a normal
    basis, zero field multiplications, paid once per insertion and once per relation
    leg. Under the quotient accounting that cost is the ENTIRE price of the factor-k
    linear-algebra gain, which is why the gain is real and why double-counting it is
    the only error available.

    WHY A MEASUREMENT AND NOT JUST A DERIVATION. (B) is a derivation and could be
    filed as one. The reason to measure is (C): the derivation says rank 1 and
    rank k in the two named bases, a relayed literature lemma says "at most n'", and
    this corpus cannot tell which statement its own instruments are producing
    because no instrument in it reports rank in BOTH bases on the same relations.
    The cheapest way to find out is to compute one rank twice.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 (factor-base decomposition) as the
    declared component and F6 (endomorphism orbit) for the quotient. What is added
    beyond both: the exact two-basis rank statement, the k | r - 1 deployed check,
    the deployed ord_n(2) census, and the claim that a published pair of gains is
    one gain counted twice.
