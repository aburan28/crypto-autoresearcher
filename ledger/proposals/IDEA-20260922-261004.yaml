  origin:
    kind: generated_in_session
    date: '2026-09-22'
    scope: >-
      BINSTD ideation batch of 2026-09-22, lane E. Seam: "duplicate relations and
      rank deficiency are counted per-relation in this corpus; on a Frobenius-stable
      base one relation is m relations by construction -- are those m independent,
      and what does the answer do to the linear-algebra dimension on a Koblitz row?"
    overlap_review: >-
      NEAREST FILED RECORD: IDEA-20260815-fa56e7 (RQ-RELN-001), "relation collection
      produces duplicates and the lane counts relations rather than independent
      ones: measure the rank deficit". That record measures rank deficit in ONE
      basis and does not consider Frobenius conjugates at all; this record supplies
      the exact conjugate-family rank in two named bases and makes the basis the
      measured variable. SECOND: IDEA-20260906-a77711, whose arm A predicts "n
      relations per solve, and n fewer unknowns when V is pi-stable, matching the
      reported factors of eprint 2020/1315" -- it PREDICTS both factors and does not
