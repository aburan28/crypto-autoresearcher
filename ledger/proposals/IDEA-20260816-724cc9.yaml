idea:
  id: IDEA-20260816-724cc9
  question_id: RQ-FNDSA-001
  added: '2026-08-16'
  title: 'Deterministic and randomized signing are two different objects for a distinguisher: under
    deterministic signing the transcript is a function of the message, so repeated messages yield
    no new samples and the binding resource becomes distinct messages rather than signatures, which
    changes the deviation-to-signature-count curve by a factor nobody in this corpus has counted.'
  class: composition
  claim: '(A) A hash-and-sign signature scheme may derive its sampling randomness deterministically
    from the message and the secret key, or draw it freshly per signature. The two modes produce the
    same per-signature marginal law but different TRANSCRIPT PROCESSES: under randomized signing,
    T queries on any messages give T independent draws; under deterministic signing, T queries give
    as many independent draws as there are DISTINCT messages among them, and repeated messages return
    identical signatures. (B) The claim is that this changes the resource accounting of every distributional
    distinguisher in this research question in a way that is countable and has not been counted here.
    Specifically, if an adversary''s query budget is Q and the message distribution has collision
    structure, the effective sample size under deterministic signing is the number of distinct messages,
    which for Q queries drawn from a message space of size M is M times one minus exp of minus Q over
    M, saturating at M no matter how large Q grows, while under randomized signing it is Q without
    bound. (C) Therefore a deviation of a given size that needs N samples to detect is detectable
    under deterministic signing only if M exceeds N, and the binding constraint moves from query budget
    to message-space entropy. This is a hard structural difference between the two modes and it goes
    in the direction of deterministic signing being MORE constrained for this particular channel.
    (D) The second, less obvious claim: deterministic signing also makes the transcript verifiable
    for consistency, since a verifier holding two signatures on one message can check they are identical,
    which is an observable that does not exist in the randomized mode. That observable is an instrument
    for detecting mode, not a defect. (E) WHAT IS NOT CLAIMED: no claim that either mode is more or
    less secure, no claim about which mode any implementation or specification uses, no attack, no
    statement about deployed parameters, and no claim that deterministic signing prevents anything.
    The counting argument bounds one channel''s sample availability and says nothing about other channels,
    in particular nothing about fault or side-channel settings where deterministic signing is usually
    discussed. (F) Negative outcome: if measured effective sample size tracks distinct-message count
    exactly as the coupon-collector formula predicts, the claim reduces to arithmetic and the deliverable
    is the corrected accounting; that is still a usable correction to every sample-count statement
    in the lane.'
  mechanism: 'STAGE ONE implements both signing modes over one sampler, differing only in how the
    randomness tape is derived: a per-signature fresh tape, or a tape expanded deterministically from
    a hash of the message and a fixed key-dependent value. STAGE TWO fixes a message distribution
    with controllable entropy, namely uniform over a message space of size M, with M swept over several
    decades so that the saturation regime is reachable. STAGE THREE draws Q queries under each mode,
    forms the frozen divergence statistic on the resulting transcript, and measures its variance,
    since the variance of a statistic on a transcript with repeated entries is what reveals the effective
    sample size. STAGE FOUR converts measured variance into an EFFECTIVE SAMPLE SIZE by comparison
    against the known variance-versus-N curve of the same statistic under the randomized mode, giving
    an empirical effective-N for each (mode, M, Q) cell. STAGE FIVE compares that empirical effective-N
    against the coupon-collector prediction M times one minus exp of minus Q over M, and reports the
    ratio. Refutation: if the deterministic mode''s effective sample size does not saturate at M as
    Q grows, the counting model is wrong and the entire accounting claim fails, which would itself
    be a surprising and reportable structural fact about the transcript process.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FNDSA-001 in full, noting that its openings list names deterministic versus randomized
      signing as two objects with different transcript statistics and that its decision target is
      phrased in terms of realistic signature counts. Read H-FNDSA-6a9cbb, whose deliverable N_LLR
      is a signature count. Extracted all twelve RQ-FNDSA-001 proposal titles. Ran grep -ril for deterministic,
      nonce, transcript, query and coupon over ledger/proposals/. Read the framing of IDEA-20260805-637a3b,
      the only record the deterministic-signing grep returned in this area.
    results: IDEA-20260805-637a3b was the only RQ-FNDSA-001 proposal returned by the deterministic-signing
      grep, and its subject is the width homotopy from NTRUSign to FN-DSA and second-moment anisotropy
      decay, not the transcript process; the phrase appears incidentally. H-FNDSA-6a9cbb produces
      signature-count floors of the form one over the divergence and treats every signature as an
      independent sample, which is exactly the accounting this entry says is mode-dependent. IDEA-20260808-e7ba81's
      detection threshold T = D over eps squared likewise counts signatures as independent samples.
      IDEA-20260813-76dcbd's anytime-valid e-process concerns optional stopping on a stream, which
      is about when to stop reading a stream rather than about how many independent entries the stream
      contains.
    verdict: 'UNVERIFIED. No claim about outside literature; coupon-collector saturation is elementary
      and deterministic nonce derivation is a widely discussed design choice. What is claimed new
      HERE is narrow and specific: that two existing internal records in this lane, H-FNDSA-6a9cbb
      and IDEA-20260808-e7ba81, state their deliverables as signature counts under an independence
      assumption that is mode-dependent, and that the correction is measurable as an effective sample
      size rather than merely arguable. The saturation formula is textbook; the measurement of effective
      sample size via statistic variance is standard; the application to this lane''s sample-count
      deliverables is the part no record contains.'
  object_first_candidate:
    tracked_object: 'The EFFECTIVE SAMPLE SIZE of a signature transcript under a frozen statistic:
      the number of independent draws that would produce the same variance of that statistic. Followed
      as the query budget Q grows at fixed message-space size M, under each of the two signing modes.'
    lossiness: The projection discards the content of every signature, the message it signs, and the
      order of the transcript, keeping only how many independent draws the transcript is worth to
      one statistic. Two transcripts with entirely different signatures and different repetition patterns
      that yield the same statistic variance are identified. That is compatible with the target operation
      because the operation is distinguishing, and a distinguisher's power depends on the transcript
      only through the variance of its statistic; the discarded content is exactly what a variance-based
      power calculation never uses. As with the entropy-source entry, the equivalence is statistic-relative
      and the record says so rather than claiming a mode-intrinsic number.
    propagation: One step is one query. Acting on the tracked object under randomized signing, a query
      always increments the effective sample size by one. Under deterministic signing, a query increments
      it by one only if its message has not been seen, and by zero otherwise, so the object follows
      a coupon-collector process whose increment probability decays as the distinct-message count
      approaches M. The two modes therefore have identical one-step behaviour while the transcript
      is short and diverge exactly when collisions begin, which is at Q of order the square root of
      M for the first collision and at Q of order M for saturation.
    survival_score: 'The object survives until saturation, after which it stops responding to further
      queries entirely; that is the point rather than a limitation. Concretely, at M = 10^3 the effective
      sample size is within 5 percent of Q until Q of about 50 and is within 5 percent of M by Q of
      about 3000, so the entire transition is visible across two decades of Q. The measurement itself
      dissolves when the statistic''s variance estimate becomes noisier than the effect, which at
      200 independent transcript replicates per cell corresponds to distinguishing effective sample
      sizes that differ by about 10 percent. Survival range: M from 10^2 to 10^5, Q from 10 to 10^6.'
  null_object_control: The null arm is the RANDOMIZED mode run through the identical effective-sample-size
    estimator at the identical M and Q. The null must show effective sample size equal to Q with no
    saturation at any M, since under randomized signing the message space cannot bind. If the null
    saturates, the estimator is measuring something about the message distribution rather than about
    the transcript process and every deterministic-arm reading is void. A second null runs the deterministic
    mode with M set larger than the maximum Q, where the two modes must agree because no collision
    occurs, giving a direct within-experiment check that the modes differ only through collisions.
  discriminated_from:
  - H-FNDSA-6a9cbb's N_LLR is a signature-count floor computed under an independence assumption. This
    entry does not dispute the floor; it measures the map from query budget to independent samples,
    which is a separate factor multiplying it, and which that record does not address.
  - 'IDEA-20260808-e7ba81''s threshold T = D over eps squared is likewise a count of independent samples.
    Same relationship: this supplies the conversion from queries to samples that the threshold consumes.'
  - IDEA-20260813-76dcbd's anytime-valid e-process governs when a monitor may stop reading a stream.
    This governs how many independent entries the stream has, which is upstream of any stopping rule
    and is not addressed by one.
  - IDEA-20260805-637a3b mentions deterministic signing incidentally while studying second-moment
    anisotropy along a width homotopy. Different object, different operation, and no transcript-process
    content.
  - 'Side-channel and fault treatments of deterministic signing, which this record explicitly excludes:
    the adversary here sees only published signatures, never a timing, a fault, or a retry, and the
    counting argument is about sample availability rather than about any physical channel.'
  assumptions:
  - Both modes are implemented over one sampler differing only in tape derivation, so any measured
    difference is attributable to the transcript process and not to the sampler.
  - The message distribution is uniform over a finite space of controllable size M; real message distributions
    are not uniform and the record does not claim otherwise, reporting M as a design parameter rather
    than a model of anything.
  - Effective sample size can be read from the variance of the frozen statistic by comparison against
    the randomized mode's variance-versus-N curve, which requires that curve to be measured rather
    than assumed.
  - 'The adversary model is transcript-only: no timing, no faults, no retries, no repeated-message
    oracle beyond the published signatures themselves.'
  - Toy bases and widths are constructed in-run and are not claimed to be FN-DSA keys, and no statement
    about any specification's signing mode is made or implied.
  predictions:
  - metric: effective sample size under deterministic signing at fixed M as Q grows
    direction: lower
    minimum_effect: saturates at M, staying within 15 percent of M for all Q above 5M
  - metric: effective sample size under randomized signing at fixed M as Q grows
    direction: higher
    minimum_effect: tracks Q linearly with no saturation, within 15 percent of Q at Q = 5M
  - metric: ratio of measured effective sample size to the coupon-collector prediction M times one
      minus exp of minus Q over M, deterministic arm
    direction: different
    minimum_effect: within 15 percent of 1.0 across the tested range, otherwise the counting model
      is falsified
  - metric: difference in effective sample size between the two modes when M exceeds the maximum Q
    direction: different
    minimum_effect: consistent with zero, since no collision occurs and the modes must agree
  minimal_test:
    design: 'The cheapest discriminating measurement fixes d = 16, sigma = 2, one toy key, and M =
      200, then measures the frozen statistic''s variance across 200 independent transcript replicates
      at Q in {50, 200, 1000, 5000} under both modes. The randomized arm supplies the variance-versus-N
      calibration curve directly, since there effective N equals Q by construction; the deterministic
      arm is then read against it. This is minutes of compute at 10^6 total signatures. It discriminates
      the whole design: divergence of the two arms beginning near Q of about 15, which is the square
      root of M, and deterministic saturation near Q of about 1000 confirms the counting model; agreement
      of the two arms at all Q falsifies it outright and would mean the deterministic transcript carries
      independent information that the collision structure does not remove, which would be the more
      interesting outcome; a randomized arm that saturates voids the estimator.'
    controls:
    - Randomized-mode null through the identical estimator, must show no saturation at any M.
    - Large-M null with M above the maximum Q, where both modes must agree because no collisions occur.
    - 'Calibration control: the randomized arm''s variance-versus-N curve is measured rather than
      assumed, and its fit residuals are reported.'
    - 'Replicate control: 200 independent transcript replicates per cell, with the across-replicate
      variance itself reported so the estimator''s own noise is visible.'
    - Key-resampling control across five keys, since the transcript-process effect must not depend
      on the key.
    required_metrics:
    - variance of the frozen statistic across transcript replicates, per (mode, M, Q) cell
    - effective sample size inferred from that variance, with confidence interval
    - ratio of inferred effective sample size to the coupon-collector prediction
    - observed distinct-message count per transcript, as a direct check on the inference
    - Q value at which the two modes first differ by more than 15 percent
    - across-key variance of the inferred effective sample size
  falsification_conditions:
  - The randomized-mode null saturates at any M, voiding the estimator.
  - The large-M null shows the two modes differing when no collisions occur.
  - The inferred effective sample size in the deterministic arm differs from the coupon-collector
    prediction by more than 15 percent across the tested range, falsifying the counting model.
  - Inferred effective sample size disagrees with the directly observed distinct-message count by
    more than 15 percent, meaning the variance-based inference is unsound.
  - The variance-versus-N calibration curve in the randomized arm fails to fit the expected inverse-N
    form, meaning the statistic's variance cannot be used to infer sample size.
  - The two modes agree at all Q at small M, which would falsify the entire structural distinction.
  confounders:
  - A statistic whose variance does not scale as one over N, which breaks the inference of effective
    sample size from variance.
  - Message-space size interacting with the sampler through the hash, so that small M produces correlated
    tapes rather than merely repeated ones.
  - Finite replicate count producing variance estimates too noisy to distinguish 15 percent effects,
    which is a power problem rather than a modelling one.
  - Repeated messages being trivially detectable, so that an analyst implicitly deduplicates and measures
    the distinct-message arm without meaning to.
  - Confusing this transcript-only counting argument with the fault-and-side-channel discussion of
    deterministic signing, which is explicitly out of scope here and concerns a different adversary.
  interpretation_limits:
  - The counting argument bounds sample availability through one channel under a transcript-only adversary,
    and says nothing about fault, timing, or side-channel settings where deterministic signing is
    usually discussed.
  - Effective sample size is statistic-relative, as in the entropy-source entry, and is never reported
    as a mode-intrinsic number.
  - A uniform message space of size M is a design parameter, not a model of any real message distribution;
    real distributions have different collision structure and the record makes no claim about them.
  - Nothing here says which signing mode any specification or implementation uses, and no security
    comparison between the modes is made or implied.
  target_complexity:
    time_exponent: 'No attack exponent is claimed. Instrument cost only: linear in the total number
      of signatures generated, which is replicates times Q per cell, dominated by the largest Q cell.'
    memory_exponent: No attack memory exponent is claimed. Instrument memory is O(M) for the distinct-message
      bookkeeping plus O(d) streaming accumulators.
    best_known: Inside this repository the incumbent accounting is the independent-sample assumption
      implicit in H-FNDSA-6a9cbb's N_LLR and in IDEA-20260808-e7ba81's threshold. No claim is made
      about anything outside this repository.
    hidden_overhead: 'The hidden cost is that the correction is a multiplicative factor other records
      must adopt, and adopting it requires each of them to state a message distribution, which none
      currently does and which is not a property of the scheme. The technical overhead hides in the
      calibration curve: inferring effective sample size from variance is only as good as the randomized
      arm''s variance-versus-N fit, and that fit needs many replicates at every N, which is where
      the compute actually goes.'
  dominated_by: 'n/a (no attack result claimed). Pareto check across instrument axes: this entry is
    cheap in compute and implementation and narrow in conclusion, supplying one conversion factor.
    It is dominated by every divergence-measuring entry in this batch on informativeness about the
    sampler, and dominates all of them on one axis they do not address at all, namely the conversion
    from adversary query budget to independent samples. Against IDEA-20260813-76dcbd''s e-process
    it is complementary and neither dominates. No attack frontier is engaged.'
  sota_delta: 'No attack; conceptual and measurement contribution only. The quantitative delta is
    a saturation bound: a distinguisher needing N independent samples cannot obtain them under deterministic
    signing from a message space of size M below N, however large the query budget, so a sample-count
    deliverable stated as N is silently a statement about message-space entropy as well. At M = 10^3
    and Q = 10^6 the effective sample size is about 10^3 rather than 10^6, a factor of 1000 that no
    current record in the lane carries.'
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Separate parts. That the coupon-collector saturation is reproduced within
    15 percent: about 0.85, since this is arithmetic and the risk is in the estimator rather than
    the model. That effective sample size can be reliably inferred from statistic variance at 200
    replicates: about 0.65, which is the real experimental risk. That the correction is adopted by
    the records whose deliverables it modifies: about 0.4, an organizational rather than a technical
    odds. That anything here bears on deployed parameters: not claimed and not estimated, since the
    contract has no transfer step.'
