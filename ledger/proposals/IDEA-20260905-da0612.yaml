  assumptions:
  - Supplied morphisms, isomorphisms and finite Galois action are exact inputs.
  - Automorphism groups and twist conventions are explicitly specified, including exceptional j values.
  predictions:
  - metric: Number of incompatible gluing diagrams accepted
    direction: different
    minimum_effect: Zero; one false acceptance refutes soundness.
  minimal_test:
    design: Write the cocycle equations for a quadratic extension and two composable abstract morphisms; examine
      twist-changing identifications symbolically.
    controls:
    - 'Matched null: relabel isomorphic presentations with conjugated transition maps.'
    - 'Known-false: incompatible overlap identifications with matching endpoints and degrees.'
    - 'Same-endpoint-cocycle control: trivial source and target descent on L^2; compare id with diag(alpha,1), alpha
      not fixed by the nontrivial quadratic automorphism. The second has nonzero equivariance residual and must
      be refused as a K-morphism, though endpoint cocycles are valid.'
    required_metrics:
    - Cocycle residual
    - Encoding length
    - Composition growth
    - Verified base field
    - Per-morphism equivariance residual
    - Exact morphism composition/equality cost and description growth
    fixtures: Self-generated finite groupoid with two automorphism groups of orders 2 and 4; no cryptographic objects
      needed.
    stopping_rule: Proposal only. Future separately approved paper audit stops at the first counterexample, unmet
      prerequisite, or 2-hour/2-GB bound. No mathematical experiment executed here.
  falsification_conditions:
  - Any certificate accepts a nonzero morphism-equivariance residual or infers morphism descent from endpoint cocycles
    alone; sufficiency beyond supplied-data compatibility requires the declared effective-descent theorem.
  - Certificate growth necessarily matches full morphism expansion.
  confounders:
  - Coarse moduli versus actual curve objects
  - Inseparable factors
  - Exceptional automorphisms
  interpretation_limits:
  - Supplied-witness verification only.
  - No construction of an unknown endomorphism ring or private isogeny.
