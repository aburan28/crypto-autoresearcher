idea:
  id: IDEA-20260905-da0612
  title: Descent-cocycle obstruction as a compositional isogeny certificate
  class: representation
  claim: An isogeny representation equipped with explicit field-descent isomorphisms can certify exactly when independently
    valid local pieces glue to a morphism over the declared field; agreement of endpoint invariants alone cannot
    provide that certificate.
  mechanism: 'Fix a finite Galois extension L/K with group Gamma and exact supplied source/target objects X,Y. Descent
    data a_sigma:sigma X->X and b_sigma:sigma Y->Y must satisfy a_sigma composed with sigma(a_tau)=a_sigma_tau and
    the corresponding b equation, with identity normalization. For each supplied morphism f:X->Y additionally require
    the independent equivariance square b_sigma composed with sigma(f)=f composed with a_sigma for every sigma.
    Endpoint cocycles alone do not enforce this. For g:Y->Z, the same squares compose, but retaining a compact automorphism
    defect instead of full maps needs its own sufficiency proof. The proposed certificate reports object cocycle
    residuals and morphism-square residuals separately, with effective descent hypotheses explicit. A quadratic
    formal control holds both endpoint actions trivial on a two-dimensional vector object: an identity morphism
    satisfies the square, whereas diag(alpha,1) with sigma(alpha)!=alpha fails it despite valid endpoint cocycles.
    This is a formal supplied-morphism control, not a constructed isogeny. Until effective descent and square sufficiency
    are certified for the admitted object category, output is compatibility of the supplied descent data only.'
