idea:
  id: IDEA-20261007-fd7c23
  added: '2026-10-07'
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  title: >-
    Chord-slope image from the canonical point on y^2 = x^3 + x + 4
    over F_19
  class: representation
  claim: >-
    Toy instance only, prediction fixed before any run. Let E be
    y^2 = x^3 + x + 4 over F_19. Let Q be the affine point with
    smallest x, then smallest y in 0 through 18, among points with
    y not 0. Let E_set be the affine points P with x(P) not equal to
    x(Q). For each such P let s(P) be the chord slope
    (y(P) - y(Q)) times the inverse of (x(P) - x(Q)). Let N_s be the
    number of distinct slopes and let n be the size of E_set.
    Prediction: N_s is at most n minus 4. Replace y(P) by the
    enumeration index of P modulo 19, keep y(Q) and the same
    denominator, and let N_lab be that image size. Prediction: N_lab
    is at least n minus 1. If N_lab is at most n minus 4, the small
    image is the formula and the claim fails. This claim does not say
    an ECDLP exponent changes.
  mechanism: >-
    The retained coordinate is the slope of the chord from a single
    canonical point Q to P. The operation is that chord, not
    translation of a pair by an order-2 point and not a product of two
    x-coordinates. Many points can share one slope when the chord
    reads both y-coordinates and the representation keeps only the
    slope. The label control replaces y(P) by an arithmetic index so
    a small image that appears for labels too is not credited to the
    group law. No summation polynomial is formed and no walk is run.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        The question asks which representations change a charged stage.
        This proposal only counts a chord-slope image.
      verified_by: >-
        coordinator session 2026-10-07 opened
        ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need Omega(sqrt(p)) group
        operations. Exponent difference here is 0.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 encodes three x-coordinates that sum to infinity. A chord
        slope is not S_3.
      verified_by: >-
        coordinator session 2026-10-07 opened
        knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
  assumptions:
    - >-
      4 A^3 + 27 B^2 is nonzero modulo 19 for A = 1 and B = 4. The
      test recomputes the residue. A zero residue is an invalid run.
    - Q is chosen by the stated order, not by a coordinate guessed in advance.
  proof_search_map:
    not_applicable_reason: >-
      This is one image comparison at p = 19, not a proof that an
      exponent changes.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: n minus N_s
      direction: higher
      minimum_effect: at least 4
    - metric: n minus N_lab
      direction: different
      minimum_effect: at most 1
  minimal_test:
    design: >-
      List affine points by testing squares. Choose Q by the canonical
      rule. Score N_s and N_lab on the points whose x differs from
      x(Q). Use the chord formula, not a precomputed line.
    controls:
      - >-
        Arithmetic-index labels in place of y(P), same denominator and
        same y(Q).
      - Discriminant residue nonzero.
    required_metrics:
      - n
      - N_s
      - N_lab
      - n minus N_s
      - n minus N_lab
      - x(Q)
      - y(Q)
  falsification_conditions:
    - n minus N_s is less than 4.
    - n minus N_lab is at least 4.
    - No eligible Q, or a zero discriminant, is an invalid run.
    - A timeout is infrastructure, not a falsification and not support.
  confounders:
    - Points with the same x as Q are vertical chords and are excluded. Their count is reported.
  interpretation_limits:
    - A confirmed gap is a count at p = 19. It is not an exponent improvement.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Chords from the canonical Q collide at least four x-distinct
        points onto one slope set that is at least 4 smaller than the
        domain, while index labels in the same formula miss at most one.
      rigorous_support: >-
        The chord slope is a rational function of the two points. No
        theorem opened in this session bounds its image.
      validation_plan: >-
        Enumerate every affine point at p = 19. Compare N_s and N_lab
        with n. Do not subsample.
  target_complexity:
    time_exponent: p^{1/2} unchanged
    memory_exponent: O(1) beyond the prime-field point list
    best_known: >-
      Pollard rho in Theta(p^{1/2}) group operations, matching
      KR-RHO-13bf67 up to the constant
    hidden_overhead: None claimed. No asymptotic algorithm is proposed.
    tradeoff_note: >-
      The measurement stores one slope per point and does not define a
      discrete-logarithm tradeoff.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    KR-RHO-13bf67 dominates any exponent reading, exponent delta 0.
    KR-IC-5a43e5 dominates any reading of the chord as S_3. Neither
    row states this slope-image gap from a canonical point.
  sota_delta: >-
    Exponent difference 0 against Omega(p^{1/2}). Counted delta: the
    chord-slope image is at least 4 below the domain, and the label
    image is at most 1 below the domain, at p = 19.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-5b1c0a
      - KR-RHO-6654ba
      - KR-IC-5a43e5
      - KR-IC-46d822
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          Summation polynomials vanish on x-coordinates. This proposal
          counts slopes and does not solve S_m = 0.
      - ref: KR-RHO-6654ba
        provenance: internal
        relation: orthogonal
        delta: >-
          Point halving cheapens binary rho steps and states no image
          size. This proposal never halves a point.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for chord slope image
        - PR 1962 and PR 1960 idea titles
      web: []
      blocked: []
