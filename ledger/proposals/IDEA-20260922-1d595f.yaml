idea:
  id: IDEA-20260922-1d595f
  question_id: RQ-DREG-c8ae8d
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: Planted synthetic factor as a dynamic-range check of the fall meter
  class: control
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (field coefficients of the
    decomposition generators), attack stage relation decomposition only.
    Calibration, not a search. In the growing-degree regime, Semaev m >= 4
    on a toy ordinary curve, plant one synthetic linear factor in a single
    summation variable on that curve's generators and leave an F_q-rational
    isogeny neighbor unplanted. The system is not the closed prime-field
    m=3 screen, and the observable is not m=3 d_reg. The meter is d_lf_obs
    from new_falls as defined in IDEA-20260916-4b7c1e. On finished matrices
    only, the planted curve must show a drop of at least 1 against its own
    unplanted copy, and the unplanted neighbor must show a drop of 0
    against that same unplanted domain. If the planted
    drop is 0, the meter has no dynamic range on this system and must not
    be used to hunt outliers. The gauge orbit of the planted j must show
    the same drop of at least 1, or the plant is a coordinate artifact.
    The plant is synthetic and is labeled synthetic. This is not
    IDEA-20260922-f7de2a, which certifies a real gap between unmodified
    neighbors.
  mechanism: >-
    Object frame. Representation: R1, the generators in the summation
    variables, with one extra linear factor written into one generator.
    Attack stage: relation decomposition only. Operation set Sigma:
    Macaulay multiplication by monomials up to one frozen degree cap, then
    exact linear combinations. Sigma is not the translation action.
    Trichotomy class of IDEA-20260806-c5d183: coordinate-dependent, because
    the plant changes the presentation and the meter reads that
    presentation. The projection discards the generators and the planted
    root, and retains two integers: the drop on the planted curve and the
    drop on the neighbor. Those integers are lossy. They do not propagate
    under translation. The plant is constructed so that it still vanishes
    on one known decomposition: if (c, c_2, ..., c_m) is a zero of the
    unplanted generators, multiply one generator by (x_1 - c). The planted
    tuple remains a zero. The neighbor's generators are copied and not
    multiplied. The neighbor drop is d_lf_obs of the unplanted domain
    minus d_lf_obs of that copy. The same factor, transported by
    x |-> u^2 x, is applied on
    each measured gauge model of the planted j. A matrix that does not
    finish is unmeasured. It is neither a drop nor a miss. IDEA-20260807-f6137c
    forbids a meter whose ground truth is the Bardet-Faugère-Salvy degree
    of regularity, because that value cannot be planted off the
    semi-regular locus. This plant is not that value. It is a factor, and
    the question is only whether d_lf_obs moves by at least 1.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260916-4b7c1e
      provenance: internal
      claim: >-
        Defines new_falls and d_lf_obs. The drop is a difference of
        d_lf_obs on finished profiles. The definition is not restated.
      verified_by: idea-generator, lines 1-100 read 2026-09-22
    - ref: IDEA-20260807-f6137c
      provenance: internal
      claim: >-
        A true degree-of-regularity meter has no planted ground truth off
        the semi-regular locus. This control does not plant that degree.
        It plants a linear factor and reads d_lf_obs.
      verified_by: idea-generator, claim opening through the d_reg closure argument read 2026-09-22
    - ref: IDEA-20260922-f7de2a
      provenance: internal
      claim: >-
        Accepts a real off-locus fall only with an explicit syzygy on
        unmodified generators. The factor in this record is synthetic and
        is not submitted to that gate.
      verified_by: idea-generator, claim and mechanism opening read 2026-09-22
    - ref: IDEA-20260807-6eb96b
      provenance: internal
      claim: >-
        The gauge orbit of one j is many Weierstrass models of one curve.
        A drop that fails to survive that orbit is a coordinate artifact.
      verified_by: idea-generator, claim opening read 2026-09-22
    - ref: RQ-DREG-c8ae8d
      provenance: internal
      claim: >-
        Requires a null of the same shape before a class signal is
        believed. The unplanted neighbor and the gauge orbit are those
        nulls for this calibration.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: RQ-DREG-d7b6d6
      provenance: internal
      claim: >-
        Forbids a proposal whose only observable is prime-field m=3
        d_reg. The planted system is Semaev m >= 4.
      verified_by: idea-generator, full file read 2026-09-22
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: Coordinate-dependent trichotomy class.
      verified_by: idea-generator, lines 1-70 read 2026-09-22
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: R1 field representation. Stage is relation decomposition.
      verified_by: idea-generator, title and scope opening read 2026-09-22
  assumptions:
    - The plant is labeled synthetic in the run record.
    - The neighbor is the unplanted rebuilt system on the codomain.
    - m >= 4, one frozen cap, one frozen monomial order, both curves.
  proof_search_map:
    bottleneck: >-
      Whether d_lf_obs moves when a known linear factor is inserted.
      If it does not move, later outlier hunts that use this meter on
      this system shape have no positive control.
    baseline_embedding:
      parameter_slice: >-
        The unplanted m >= 4 profile of the domain, which is the zero
        of the drop, and the rank identity of IDEA-20260916-4b7c1e on
        that unplanted matrix.
      reproduction_check: >-
        On the unplanted domain, falls(D) equals rank(M_D) minus the
        rank on the degree-exactly-D columns, at every completed degree.
        Failure voids the calibration.
    observation_collision:
      observable: the pair (drop on the planted curve, drop on the neighbor)
      distinct_preimage_search: >-
        The gauge orbit is a set of distinct models that must share the
        planted drop. A neighbor whose d_lf_obs is at least 1 below the
        unplanted domain collides with the planted curve and the
        calibration fails, because the meter fired where no factor was
        planted.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          One generator of the m >= 4 system, multiplied by one linear
          factor that vanishes on a known decomposition, labeled synthetic.
        predicted_gain: >-
          A drop of at least 1 in d_lf_obs on the planted side against the
          unplanted domain, and a drop of 0 for the unplanted neighbor
          against that same domain. No ECDLP exponent gain.
    quantifier_order: >-
      There exists a synthetic linear factor on one curve such that, for
      all gauge models of that j whose matrices finish, d_lf_obs drops by
      at least 1 against the unplanted domain, and the unplanted
      neighbor's d_lf_obs equals that unplanted domain. The failure
      quantifier is: the planted finished profile drops by 0. Unfinished
      matrices are outside both quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this system shape and cap, d_lf_obs either sees a synthetic
        drop of at least 1 or it does not. A pass does not certify any
        real classmate.
      nearby_object_control: >-
        The gauge orbit of the planted j, with the factor transported by
        the gauge, and the unplanted neighbor compared with the unplanted
        domain. A drop that the orbit does not share is a coordinate
        artifact. A neighbor at least 1 below the unplanted domain is a
        meter that fires with nothing planted.
    proof_obligations:
      - claim: >-
          The synthetic label is part of the record, and a planted drop
          is never reported as an isogeny-class outlier.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: planted_d_lf_obs_drop
      direction: lower
      minimum_effect: >-
        On finished matrices, d_lf_obs of the planted curve is at least 1
        below d_lf_obs of the same curve unplanted, and d_lf_obs of the
        unplanted neighbor equals d_lf_obs of that unplanted domain.
    - metric: gauge_orbit_planted_drop
      direction: lower
      minimum_effect: >-
        Every finished gauge model of the planted j shows that same drop
        of at least 1. A model that finishes and drops by 0 makes the
        plant a coordinate artifact.
  minimal_test:
    design: >-
      On one toy ordinary curve, build the Semaev m=4 system and find one
      decomposition tuple by direct search at toy size. Multiply one
      generator by (x_1 - c) with c the first abscissa of that tuple.
      Label the generating set synthetic. Compute d_lf_obs on the
      unplanted curve, the planted curve, the unplanted neighbor across
      one F_q-rational ell-isogeny coprime to the group order, and at
      least two gauge models of the planted j with the factor transported.
      Score the neighbor against the unplanted domain.
      Issue pass, no-dynamic-range, artifact, or unmeasured. Do not scan
      the class.
    controls:
      - The unplanted copy of the same curve, same cap and order.
      - The unplanted neighbor, scored against the unplanted domain.
      - At least two gauge models, factor transported by x |-> u^2 x.
      - The rank identity on the unplanted domain.
    required_metrics:
      - d_lf_obs unplanted, planted, neighbor, and each gauge model
      - the planted drop and the neighbor drop, both against the unplanted
        domain, and the gauge drops, only where the matrices finished
      - the issued label
      - a synthetic flag stored with the planted generators
  falsification_conditions:
    - >-
      The rank identity fails on the unplanted domain. The meter is void
      and no dynamic-range label is issued.
    - >-
      The planted finished profile drops by 0. The meter has no dynamic
      range and must not be used to hunt outliers on this system shape.
    - >-
      The neighbor's finished profile is at least 1 below the unplanted
      domain. The meter fired with nothing planted. The calibration fails.
    - >-
      A finished gauge model does not reproduce the drop. The plant is a
      coordinate artifact.
    - >-
      An unfinished matrix is scored as a drop or as a miss. That score
      is withdrawn.
  confounders:
    - Planting a factor that does not vanish on any decomposition, so the ideal change is unrelated to a summation relation.
    - Using m=3, where the degree is already at the closed floor and a drop of 1 may be impossible for that reason.
    - Changing the cap or the monomial order between the planted curve and the neighbor.
    - Forgetting to transport the linear factor under the gauge, then calling the mismatch an artifact.
    - Reporting the synthetic drop as outcome O3.
  interpretation_limits:
    - >-
      A pass says the meter can see this plant. It does not say any real
      curve in the class is an outlier, and it does not pass the syzygy
      gate.
    - >-
      d_lf_obs is not the Bardet-Faugère-Salvy degree of regularity. A
      drop inside the cap does not locate that degree.
    - Toy tier only.
    - >-
      ECDLP time exponent stays N^{1/2} and rho memory stays O(1). No
      walk is charged. No outlier is nominated.
    - >-
      If the unplanted d_lf_obs already equals the first fall and both
      sit at the generator degree, there may be no room to drop. That
      cell is reported as no room, which is not a pass and not evidence
      that the degree exploded.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On this m >= 4 generating set, if the unplanted d_lf_obs is at
        least 1 above the minimum generator degree, multiplying one
        generator by a linear factor that vanishes on a known
        decomposition lowers d_lf_obs by at least 1 inside the same cap.
        This is not the Petit-Quisquater first-fall assumption. A drop
        inside the cap does not prove the solving degree above the cap.
      rigorous_support: >-
        none. It imitates the rank identity in IDEA-20260916-4b7c1e: a
        new low-degree consequence increases falls at the degree where it
        appears. It does not imitate a theorem that factors of generators
        lower the solving degree by the degree of the factor.
      validation_plan: >-
        The plant is the sample. Parameters: one toy curve, one neighbor,
        m=4, one linear factor, one frozen cap, at least two gauge
        scalars u. Compare d_lf_obs planted against unplanted. A planted
        drop of 0 falsifies H1 on this shape and retires the meter for
        outlier hunts here. Tail check: do not score an unfinished degree
        as a fall that the factor removed. No cryptographic transfer.
  target_complexity:
    time_exponent: >-
      N^{1/2} for the ECDLP, Pollard rho. No improvement is claimed.
    memory_exponent: O(1) for rho. The check stores a handful of capped matrices.
    best_known: Pollard rho, time N^{1/2}, memory O(1), for the ECDLP.
    hidden_overhead: >-
      No attack exponent is claimed. The walk is uncharged. A synthetic
      plant is not an outlier that would ever be charged.
    tradeoff_note: >-
      One cap, a few matrices. Not a van Oorschot-Wiener tradeoff and it
      does not change rho.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: >-
    As an ECDLP attack, Pollard rho dominates on time (N^{1/2}), memory
    (O(1)), and queries (one instance). No attack is claimed. As a
    control, the opened proposals were checked. IDEA-20260807-f6137c
    dominates any attempt to plant a true degree of regularity; this
    record does not make that attempt. No opened row plants a synthetic
    linear factor and demands a drop of d_lf_obs of at least 1 on one
    side and 0 on the neighbor. Published algorithms were not all checked.
  sota_delta: >-
    ECDLP time-exponent delta 0 (remains 1/2). ECDLP memory-exponent
    delta 0. Query delta 0. The control adds a synthetic plant and no
    attack cost.
  discriminated_from:
    - >-
      IDEA-20260922-805a59 censuses unmodified curves. This record
      modifies one generating set and does not census a class.
    - >-
      IDEA-20260922-221a70 compares a rebuilt system with a pullback.
      Both of those generating sets are unmodified. The factor here is
      synthetic.
    - >-
      IDEA-20260922-fac3e7 measures an unmodified special-model locus.
      A planted factor is not that locus.
    - >-
      IDEA-20260922-f7de2a certifies a real gap by a syzygy on the
      curve's own generators. This plant is synthetic and is not a
      candidate for that gate.
    - >-
      IDEA-20260922-f1e5b7 compares unmodified chained systems across a
      class. This record asks whether the meter can see a factor that
      was inserted by hand.
    - >-
      IDEA-20260922-9d808c varies invertible linear substitutions, which
      preserve the ideal's degree filtration. Multiplying by a linear
      factor does not.
    - >-
      IDEA-20260922-881df9 attributes a gap among unmodified arms. A
      synthetic drop has no attribution to a class.
    - >-
      IDEA-20260922-469f79 enriches an ideal by graph equations or by
      random polynomials. The enrichment here is one known linear factor
      on one curve.
    - >-
      IDEA-20260807-f6137c closes a true d_reg meter for lack of a
      plantable value. This control plants a factor and reads d_lf_obs,
      which is a different quantity.
    - >-
      IDEA-20260916-4b7c1e defines the meter. This record tests whether
      that meter moves under a synthetic factor. It does not redefine
      new_falls.
    - >-
      IDEA-20260731-016 screens unmodified curves for a heavy tail. A
      synthetic drop is not a rare endpoint.
