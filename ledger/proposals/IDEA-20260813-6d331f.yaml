      discriminator: Canonical classes have multiplicity while extractor output is invariant.
    - explanation: Apparent multiplicity hides distinct witnesses.
      discriminator: Within-class extraction outputs disagree.
    - explanation: Counting gain is offset by selecting the canonical witness.
      discriminator: End-to-end factor returns to or exceeds baseline.
