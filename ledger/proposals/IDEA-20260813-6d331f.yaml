idea:
  id: IDEA-20260813-6d331f
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  title: Minimal collision-witness quotient for forgery extraction
  class: algorithm
  claim: >-
    For a frozen FIPS 205 forgery-extraction game, quotienting successful
    transcripts by the first verifier-relevant collision witness yields an exact
    witness-count factor smaller than the raw transcript-pair factor on at least
    one nontrivial parameter slice, without losing extraction probability; falsify
    if two successful transcripts in one quotient class require different
    extraction witnesses or if selection overhead restores the baseline factor.
  mechanism: >-
    Canonicalize a successful verification transcript to the earliest divergent
    logical node whose verifier inputs collide or authenticate inconsistently.
    Count witness classes rather than all query or transcript pairs, then build an
    extractor that consumes the canonical class representative. The proposed gain
    comes from many transcripts mapping to one verifiable obstruction, not from
    assuming correlation implies security.
  why_not_a_renamed_known_approach: >-
    The deliverable is a constructive, verifier-defined quotient and extractor
    preservation proof, not generic multi-target counting. No supplied exact prior
    is claimed distinct beyond its recorded binding; primary literature screening
    is required before approval.
  predictions:
    - observable: Transcript-to-witness multiplicity
      metric: Exact class-size distribution on exhaustive toy forgeries
      predicted: Some classes have multiplicity greater than one while sharing one extractor witness
    - observable: Extraction success before and after quotienting
      metric: Exact probability and all guess/rewind factors
      predicted: Equality or a proved lower bound; any uncharged loss falsifies the gain
    - observable: Constants-tracked witness factor
      metric: Baseline raw-pair factor divided by canonical witness count
      predicted: Greater than one only where verifier semantics force equivalence
  minimal_test:
    parameter_slice: Fully enumerable toy verifier/transcript space preserving FORS, WOTS+, and authentication-path checks.
    procedure: [Reproduce the baseline extractor, enumerate successful toy transcripts, compute canonical first witnesses, search within-class extraction collisions, and compare complete constants including witness selection]
    discriminating_outcomes:
      - Large classes with one valid extractor witness support quotient slack.
      - Large classes requiring different witnesses falsify the canonical quotient.
      - Smaller count offset by guessing or rewinding supports bookkeeping displacement.
  controls:
    - Exact null: assign transcripts random class labels with the same class-size histogram; extractor preservation must fail or receive no proof credit.
    - Planted positive: duplicate transcripts by verifier-irrelevant encodings that provably retain one collision witness; canonicalization must merge them.
    - Nearby counterobject: two transcripts sharing early syntax but diverging at the first verifier-relevant node; they must remain separate.
    - Baseline control: exact original extractor and raw counting factor.
  confounders: [Ambiguous earliest witnesses, verifier-irrelevant encoding already quotiented by the baseline, adaptive query order, rewind cost, and noncanonical ADRS parsing]
  falsification_conditions: [Within-class witness disagreement, loss of extraction success, inability to reproduce baseline, or nonpositive final constants delta]
  interpretation_limits: [Only the frozen extraction game is covered, no signature attack follows, toy class sizes do not extrapolate without proof, and fault behavior is excluded]
  assumptions: [A primary-source extractor is available, verifier transcripts have a deterministic typed normalization, and every success exposes at least one declared witness]
  heuristic_assumptions:
    - id: H1
      statement: Toy witness multiplicities reveal a parameter-uniform quotient rule.
      validation: Prove the rule from verifier control flow; empirical multiplicity alone is insufficient.
    - id: H2
      statement: Canonical witness selection does not add adaptive guessing loss.
      validation: Construct the extractor explicitly and account for its filtration, rewinds, and query index selection.
  proof_search_map:
    bottleneck: Prove that quotient classes preserve one extractable witness and reduce counting after all selection costs.
    baseline_embedding:
      parameter_slice: Exact selected extraction theorem and complete tiny verifier space.
      reproduction_check: Match baseline transcript definition, success event, extractor, and raw factor exactly.
    observation_collision:
      audit: Search pairs with identical proposed canonical data but different first verifier-relevant witnesses or extractor outputs.
      failure_response: Split the quotient class or abandon the reduction factor.
    constructive_transforms: [Typed transcript normalization, first-witness canonicalization, class-representative extractor]
    quantifier_order: Fix the canonicalization and extractor before adversary transcripts; for every successful transcript, extraction from its class representative must meet the stated probability.
    method_ceiling:
      statement: Quotienting cannot improve a baseline already indexed by minimal verifier witnesses or a game where every transcript has a unique witness.
      nearby_counterobject: A toy verifier whose first divergence uniquely determines each successful transcript.
    proof_obligations: [Baseline reproduction, totality of witness map, within-class extractor invariance, class-count bound, end-to-end constants table]
    not_applicable_reason: null
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known_baseline: Exact primary-source raw transcript/query-pair extraction factor, still unverified in this task.
    hidden_overhead_disclosure: Parsing, canonicalization, witness selection, guessing, rewinding, queries, storage, and verification are charged.
    time_memory_tradeoff: Storing all class representatives accelerates audit but is exponential at toy scale; online hashing lowers memory and retains collision-verification cost.
  sota_delta: 0 claimed today; target is an exact baseline-factor divided by witness-class-factor ratio greater than 1 with unchanged extraction probability and a per-parameter bit-equivalent delta.
  dominated_by:
