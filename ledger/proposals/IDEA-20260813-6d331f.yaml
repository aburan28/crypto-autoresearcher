    preprocessing: Typed normalization is new charged preprocessing
    oracle: No oracle beyond baseline is permitted
    verification: Canonical witness replay adds verification but makes the proposed gain auditable
    frontier_checked: [IDEA-20260801-009, IDEA-20260805-705614, IDEA-20260805-88ecef, IDEA-20260805-fbe36a, IDEA-20260807-c4f1fc, IDEA-20260808-02a046, IDEA-20260808-ae34ad]
