    "claim": "A certified relation lattice may permit shorter bounded action words for every input in the oracle domain, provided reversible reduction and worst-case padding cost less than the saved isogeny work. Average short private-key exponents cannot substitute for full-domain coverage.",
    "mechanism": "Let R columns generate proved class-group relations among fixed ideal generators. An oracle input in Smith coordinates is converted into an exponent vector e, then e'=e-Rz chosen by a bounded, deterministic recoding algorithm. Preserve z and all tie-breaking information until action output is computed, then uncompute. The tracked object is a lattice coset together with a reversible section, paired with ideal multiplication; discarding the relation representative is legal only because certified relations act trivially. Class-group structure construction, relation certification and conversion circuits are charged. The nonuniform section must be proven for all coherent input basis states, with no use of the original small secret box as the attacker oracle domain.",
