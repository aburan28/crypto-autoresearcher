idea:
  id: IDEA-20261006-813713
  title: >-
    Value-gcd of x^2 + x + 1 against its content-2 multiple
  class: measurement
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  added: '2026-10-06'
  question_id: RQ-PAIR-f2e31f
  novelty_status: unverified
  claim: >-
    On the box of integers a, b with max(|a|, |b|) at most 2, excluding
    (0,0), let g(F) be the positive gcd of the values of a binary
    quadratic F. Then g(a^2 + a b + b^2) = 1 and
    g(2 a^2 + 2 a b + 2 b^2) = 2. The gap is 1. The two forms have the
    same degree and the same primitive part. A charge that ignores
    content and treats them as interchangeable predicts equal gcds. The
    content charge predicts the pair (1, 2). No discrete logarithm is
    computed and no deployed prime is costed.
  mechanism: >-
    Content reading: 2 divides every value of the scaled form, and the
    primitive form represents 1 at (1,0), so the gcds are 2 and 1.
    Height reading: both forms have degree 2 and coefficients of absolute
    value at most 2, so a model that bins by degree and height assigns
    them one class and predicts equal gcds. The represented values of the
    primitive form on this box include 1, so the gcd is 1; the scaled
    values are exactly twice those, so the gcd is 2. OBJECT FRAME. The
    representation is the coefficient vector of a quadratic in Z[x], read
    as a binary quadratic form. Sigma is evaluation at integer pairs
    (a,b) in the box, followed by the gcd of the image. Sigma is not
    translation on a curve. Trichotomy class: coordinate-dependent,
    because multiplying all coefficients by 2 changes g while the box
    stays fixed. LOSSY-PROJECTION TEST. The projection discards every
    individual value and keeps the gcd of the set. The discard is
    compatible with Sigma because the gcd does not depend on the order
    of evaluation and is unchanged by replacing any value by its negative.
    Lossy: the sets {1, 3, 4} and {1} have the same gcd and are not the
    same set. OFF-LIMITS AS PRIMARY LENS: families F1-F7. Component
    used: F2, only as the decision to divide a fixed content out of an
    integer before any later smoothness test. No factor base is built.
    F4 is not a component. This proposal does not claim that the smooth
    bit changes: every prime factor of the content 2 is small, so removing
    it need not change a smoothness Boolean. The measured integer is the
    gcd.
  assumptions:
    - The box includes (1,0). Dropping the axes is a different experiment.
    - Values are taken positively. The gcd is the positive generator.
    - (0,0) is excluded. The value 0 is not fed to the gcd.
  predictions:
    - metric: g(2 a^2 + 2 a b + 2 b^2) minus g(a^2 + a b + b^2) on the stated box
      direction: different
      minimum_effect: >-
        The difference equals 1, from the pair of gcds (2, 1). A height-only
        reading predicts difference 0.
  minimal_test:
    design: >-
      Enumerate all 24 nonzero pairs with coordinates in {-2,-1,0,1,2}.
      Evaluate both forms. Compute the two positive gcds. Separately
      compute the gcd of the coefficients of each form. On this box the
      value-gcd and the coefficient-gcd are predicted to agree: (1, 2)
      in primitive-then-scaled order.
    controls:
      - >-
        Same-shape null: the primitive part x^2 + x + 1 of the scaled
        polynomial. Same degree, same shape, content removed. Predicted
        value-gcd 1.
      - >-
        Scaled treatment: 2 x^2 + 2 x + 2. Predicted value-gcd 2.
      - >-
        Single-point sanity: the primitive form at (1,0) equals 1, and
        the scaled form at (1,0) equals 2. If either identity fails, the
        evaluator is wrong before the gcd is interpreted.
      - >-
        A second primitive of the same degree, a^2 + b^2, is predicted to
        have value-gcd 1 on the same box because it represents 1 at (1,0).
        It must not be reported as 2.
    required_metrics:
      - Value-gcd of the primitive form
      - Value-gcd of the scaled form
      - Coefficient-gcd of each form
      - The two single-point values at (1,0)
  falsification_conditions:
    - The two value-gcds are equal.
    - The primitive value-gcd is not 1, or the scaled value-gcd is not 2.
    - The value-gcd pair and the coefficient-gcd pair disagree on this box.
    - a^2 + b^2 is reported with value-gcd not equal to 1.
  controls:
    - Primitive part against the content-2 multiple, same box.
    - a^2 + b^2 as a second primitive quadratic that must score 1.
  confounders:
    - Excluding a = 0 or b = 0 removes the value 1 and can inflate the primitive gcd. That is a different box.
    - Including (0,0) feeds a 0 into the gcd and makes the result 0 or undefined, depending on the routine.
    - Reporting a security quantity from log of the gcd. The integer 1 in the gap is a content, not a bit level.
  interpretation_limits:
    - Not an attack. No ECDLP exponent. No discrete logarithm.
    - The gap of 1 is the content. It is not a security level for any deployed curve and not a sieve yield.
    - Because the content is a power of 2, this gap does not by itself flip a smoothness Boolean at bounds at least 2. A later smoothness count is a different experiment.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        On this box, the positive gcd of the values of a quadratic form
        equals the positive gcd of its three coefficients. Both sides are
        predicted to be 1 for a^2 + a b + b^2 and 2 for the scaled form.
        No random-integer model is used. No transfer to degree 12 is claimed.
      rigorous_support: >-
        Content divides every value, so it divides the value-gcd. The
        values at (1,0), (0,1), and (1,1) are the three coefficients up to
        addition, so a value-gcd on a box that contains those points
        divides the content. The two gcds therefore match whenever those
        three points lie in the box. The box here contains them. This is
        integer arithmetic, not a distributional hypothesis.
      validation_plan: >-
        Enumerate the 24 points, compute both gcds, and compare them with
        the coefficient gcds. As a tail check, enlarge the box to
        max(|a|, |b|) at most 3 and recompute. The prediction is that both
        gcds stay (1, 2), because the content argument does not use the
        outer radius once (1,0) is included. If the enlarged box changes
        either gcd, the implementation has left the definition (for example
        by dropping signs or skipping points) and the small-box result is
        not trusted.
  target_complexity:
    time_exponent: >-
      Twenty-four evaluations of two quadratics. No new exponent. No
      sub-rho claim.
    memory_exponent: >-
      The list of 24 integers. No matrix.
    best_known: >-
      Opened row KR-RHO-13bf67 is a generic-group lower bound and is not
      a statement about quadratic forms. Opened note KN-LIT-3743 says
      polynomial selection sets an exTNFS cost and does not give these
      gcds. Neither baseline is improved.
    hidden_overhead: >-
      None derived. No o(1) term is present.
    tradeoff_note: >-
      No time-memory tradeoff. The output is two positive integers.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
