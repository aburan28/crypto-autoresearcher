# IDEA-20261004-6a7365
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-6a7365
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-16 window table stores 32768 entries and a width-15 table stores 16384
  class: representation
  claim: >-
    A window of width 16 stores 32768 precomputed entries. A window of
    width 15 stores 16384. Thirty-two thousand seven hundred sixty-eight
    exceeds sixteen thousand three hundred eighty-four by 16384. The
    product of the two table sizes is 536870912. Their sum is 49152.
    The gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    15 is 32768. Two to the power 14 is 16384. Two width-15 tables both
    store 16384, so that gap is 0 and their product is 268435456. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 16384.
    baseline_embedding:
      parameter_slice: The widths 16 and 15 and the sizes 32768 and 16384.
      reproduction_check: >-
        Two readers must agree that 2 to the power 15 is 32768 and that
        2 to the power 14 is 16384.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 16384 drops the gap. Two width-15
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-15 table.
        predicted_gain: Sixteen thousand three hundred eighty-four fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 32768 and 16384. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-15 tables. Both store 16384, and the gap is 0.
    proof_obligations:
      - claim: The width-16 table stores 32768 entries.
        responsibility: size
      - claim: The width-15 table stores 16384 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Thirty-two thousand seven hundred sixty-eight exceeds sixteen thousand three hundred eighty-four by 16384.
  minimal_test:
    design: >-
      Compute 2 to the power 15 and 2 to the power 14. Do not add a
      curve point.
    controls:
      - Two width-15 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-16 table size is not 32768.
    - The product of the two sizes is not 536870912.
  confounders:
    - A width-15 table of size 16384 is a different window from a width-14 table of size 8192.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 16384 and 8192.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-16 table has size 2 to the power 15, and the
        frozen width-15 table has size 2 to the power 14.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Thirty-two thousand seven hundred sixty-eight stored entries versus sixteen thousand three hundred eighty-four, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
