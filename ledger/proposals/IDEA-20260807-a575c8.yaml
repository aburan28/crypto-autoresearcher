idea:
  id: IDEA-20260807-a575c8
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    A MODEL IS A PLACEMENT OF FOUR BRANCH POINTS PLUS A CHOICE OF CENTRE - the
    degree-2 coordinates on E are indexed by a point Q (the involution P -> Q - P)
    and a Moebius map, so "curve model" resolves into two measurable degrees of
    freedom; OFF-CENTRE models such as the Jacobi quartic pay an exact factor 2 in
    summation degree (predicted 4, not 2, at m = 3) unless the target is shifted,
    and among CENTRED models the two sparsity sources - O at infinity (13
    monomials, short Weierstrass) and diagonalised rational 2-torsion (at most 14
    monomials but only about 8 free coefficients, twisted Edwards / Legendre) - are
    PROVABLY INCOMPATIBLE, so the lane's one remaining question is which of them
    wins on a measured cost
  class: representation

  claim: >-
    (A) THE CLASSIFICATION THAT REPLACES THE LIST OF MODEL NAMES. Every degree-2
    map f : E -> P^1 arises as the quotient by an involution of the form
    iota_Q(P) = Q - P for some Q in E, followed by a Moebius parametrisation of the
    quotient line. (Degree-2 maps correspond to degree-2 linear systems, i.e. to
    divisor classes of degree 2, i.e. to points of E.) So the model space of L11 is
      {degree-2 coordinates} = E(F_p) x PGL_2(F_p),
    a CENTRE Q and a PARAMETRISATION. The named models are points of this space:
      Q = O, O sent to infinity                       -> short Weierstrass x
      Q = O, a 2-torsion point at 0 and O at infinity -> Montgomery x
      Q = O, O at 1 and a 2-torsion point at -1       -> twisted Edwards y
      Q = O, all four branch points rational at 0,1,lambda,infinity -> Legendre x
      Q = T (a 2-torsion point), NOT centred at O      -> Jacobi quartic x
    Writing the lane this way turns "try more models" into "sweep two explicit
    parameters", which is the only version of the lane that can be exhausted.

    (B) THE CENTRING RESULT, WHICH IS A FACTOR 2 AND IS COUNTERINTUITIVE. Let
    f = x_R(P) := x(P - R), the quotient by iota_Q with Q = 2R. Its deck group is
    {identity, iota_Q}, which lies inside Aut(E, O) ONLY when Q = O. Hence by the
    deck-group law of IDEA-20260807-dadcd2, g = 2 for the centred coordinate and
    g = 1 for every off-centre one. Concretely at m = 3, for the relation
    P_1 + P_2 + P_3 = O: fix t_1, t_2, write P_i = R + eps_i Q_i, then
      t_3 = x(P_3 - R) = x(3R + eps_1 Q_1 + eps_2 Q_2),
    and the four sign patterns give FOUR generically distinct values because the
    global sign flip sends 3R + ... to -3R - ..., whose x-value differs from
    x(3R + ...) unless 3R = O. So
      deg_{t_i} S_3^{x_R} = 4 for generic R, versus 2 for R = O.
    THE OFF-CENTRE COORDINATE IS EXACTLY TWICE AS EXPENSIVE. And the escape is
    exact and worth stating because it is the null used elsewhere in this batch:
    the DECOMPOSITION problem does not ask for a sum equal to O, it asks for a sum
    equal to a target; substituting P_i = R + P_i' turns "sum P_i = target" into
    "sum P_i' = target - mR", which is the ordinary centred system. So the factor 2
    is recovered in full by RETARGETING, and the honest statement is: centring is a
    free choice that costs a factor 2 if you forget to shift the target, and
    nothing if you remember. The Jacobi quartic is the standard model that sits
    off-centre, because its coordinate x is the quotient by P -> T - P (its deck
    transformation is (x, y) -> (x, -y), which has four fixed points at the roots
    of the quartic and is therefore an involution of the form Q - P, whereas
    Jacobi-quartic negation is (x, y) -> (-x, y)).

    (C) THE BRANCH LOCUS, WHICH IS WHAT "MODEL" REALLY MEANS ONCE THE CENTRE IS
    FIXED AT O. The quotient E -> E/{+-1} = P^1 is ramified at exactly four points
    - O and the three 2-torsion points - by Riemann-Hurwitz. A centred model is
    therefore a choice of WHERE THOSE FOUR POINTS SIT in P^1, i.e. an element of
    PGL_2 modulo the stabiliser. The cross-ratio of the four points is the Legendre
    parameter lambda, which is an invariant OF THE CURVE and cannot be changed;
    everything else is free. So:
      the model space is 3-dimensional (PGL_2) and the curve contributes one
      invariant (lambda) that no model change can move.
    That is the exact sense in which "the model changes and the curve does not".

    (D) THE TWO SPARSITY SOURCES AND THEIR INCOMPATIBILITY, WHICH IS THE ONE
    GENUINELY OPEN QUESTION LEFT IN THE LANE.
      SOURCE 1 - PUT O AT INFINITY. Short Weierstrass does this, and the resulting
      S_3 has exactly 13 of the 27 monomials of multidegree at most (2,2,2)
      (hand-expanded in IDEA-20260807-e6d79e). The sparsity comes from the standard
      normalisation, not from any curve structure, and it is available on EVERY
      curve including prime-order ones.
      SOURCE 2 - DIAGONALISE A RATIONAL 2-TORSION INVOLUTION. A rational 2-torsion
      point T induces an involution iota_T on the Kummer line; choosing the
      coordinate so that its two fixed points go to 0 and infinity makes it
      t -> -t, and S_3 becomes supported on the 14 even-total-degree monomials
      (twisted Edwards y is exactly this choice - IDEA-20260807-78eafe). If E has
      FULL rational 2-torsion (Legendre form with lambda rational, cofactor at
      least 4), a SECOND commuting involution acts and imposes a palindromic
      relation within those 14, leaving about 8 independent coefficients.
      THE INCOMPATIBILITY. Source 1 requires the branch point O at infinity. Source
      2 requires a FIXED POINT OF iota_T at infinity. The fixed points of iota_T on
      the Kummer line are NOT branch points (they are the images of the points P
      with P + T = -P, i.e. 2P = -T, which are 4-torsion-type points, not
      2-torsion). So infinity cannot simultaneously be O and a fixed point of
      iota_T: THE TWO NORMALISATIONS ARE MUTUALLY EXCLUSIVE. A model gets one or
      the other, never both.
      THE QUESTION, THEREFORE: 13 monomials with no symmetry, or at most 14
      monomials with a Klein-four symmetry group acting? The first is smaller; the
      second is structured. Which produces the lower measured cost is NOT decidable
      from the counts and IS the experiment.

    (E) THE OPTIMISATION THAT MAKES THIS A SEARCH RATHER THAN A COMPARISON. Because
    the model space is explicitly E(F_p) x PGL_2(F_p), one can ask for the MINIMUM
    of a cost functional over it, rather than comparing five named points. At toy
    scale this is a direct search: sample thousands of Moebius maps, compute the
    support size of the reparametrised S_3 for each, and report the empirical
    minimum and the argmin. PREDICTED: the minimum over the whole 3-parameter
    family is 13, attained on the PGL_2-orbit of the short Weierstrass
    normalisation, i.e. NO model beats short Weierstrass on support. If the search
    finds a coordinate with support strictly below 13, that is a genuine discovery,
    it is cheap to find, and nobody in this program has looked.

    (F) THE THREE OUTCOMES.
      OUTCOME 1 - the minimum support over PGL_2 is 13 and short Weierstrass
        attains it. Then L11's support question is CLOSED by exhaustion over the
        model space, which is a much stronger closure than comparing five names.
      OUTCOME 2 - some coordinate achieves support below 13. Then the lane has
        found a model nobody has named, the argmin identifies it, and the follow-on
        is to recompute the BKK constants of KN-FIND-2a8b7e / KN-FIND-c7d31e there.
      OUTCOME 3 - support ties but the symmetry-carrying coordinates measure
        cheaper after the null battery. Then the winning quantity is the SYMMETRY
        GROUP, not the support, which is the Faugere-Gaudry-Huot-Renault mechanism
        (KN-LIT-004) confirmed in a new coordinate and quantified against a
        matched-support control that their paper did not run.

  resource_label: R2 (curve equation and model), with R1 for the coordinate values.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE. The resource is R2: the choice of coordinate changes the ideal and
    its coefficient ring, which the generic-group simulator of KN-FIND-b7e091
    cannot produce - it answers group and equality queries and has no access to the
    monomial support of a polynomial over F_p. H-ENDO-001 does not apply, since no
    endomorphism is applied to points of G. The prestated ceiling is the
    deck-group law: no point of the model space can change the per-variable degree
    away from 2^(m-2), so the admissible resource can purchase support and symmetry
    only, and Source 2 additionally requires rational 2-torsion, which a
    prime-order curve does not have.

  discriminated_from:
    - >-
      IDEA-20260807-dadcd2, which proves the degree law. This record supplies the
      PARAMETRISATION of the space that law quantifies over, plus the centring
      refinement (B) - that g must be measured inside Aut(E, O), so an off-centre
      degree-2 coordinate has g = 1 and pays a factor 2. That refinement is not in
      the law as stated and is the correction this record contributes.
    - >-
      IDEA-20260807-78eafe (Edwards parity) and IDEA-20260807-e6d79e (Montgomery
      palindrome), which are two named points of the space. This record explains
      why they are the SAME symmetry in different parametrisations and asks the
      optimisation question that neither can pose.
    - >-
      IDEA-20260807-4fc635, the null battery. That record samples PGL_2 to build a
      NULL; this one sweeps PGL_2 to build a SEARCH. The same sampler serves both,
      and the distinction is what is done with the distribution - the null asks
      whether the named models are typical, the search asks for the extremum.
    - >-
      KN-LIT-004 (Faugere-Gaudry-Huot-Renault, J. Cryptology 27(4) 595-635, 2014).
      That paper exploits the extra symmetry of twisted Edwards and twisted
      Jacobi-intersection curves and claims a factor about 2^(omega(n-1)) in
      decomposition-solving cost. NO NOVELTY IS CLAIMED FOR THAT MECHANISM. What
      is claimed here is the incompatibility statement (D) - that the symmetry
      normalisation and the O-at-infinity normalisation cannot be had together -
      and the resulting optimisation question, which their paper does not pose
      because it compares named forms rather than sweeping the parametrisation.
    - >-
      Cheng, Kodera and Miyaji, IEICE Trans. Fundamentals E102-A(9) 1061-1071,
      2019, doi 10.1587/transfun.E102.A.1061, which compares Hessian, Montgomery,
      twisted Edwards and Weierstrass and whose abstract reports an affirmative
      answer to whether the form matters. I HAVE READ ONLY THE ABSTRACT. If its
      body already performs the PGL_2 sweep or states the incompatibility, this
      record is duplicate external prior art; Stage 0 checks this and it is a gate.

  object_first_candidate:
    tracked_object: >-
      THE PLACEMENT OF THE BRANCH LOCUS - the ordered 4-tuple of points of P^1
      that are the images of O and the three 2-torsion points under the coordinate
      map, together with the centre Q. Tracked as the coordinate varies over
      E(F_p) x PGL_2(F_p) with the curve fixed.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: rho and its variants, BSGS,
      Semaev-in-the-x-coordinate as an algorithm to tune, Weil descent and covers,
      pairing transfer, lattice/HNP, isogeny and endomorphism leverage on G. The
      object here is a configuration of four points on a line, and no attack is
      proposed. Per KN-OPEN-019 this program has no written object enumeration for
      the ECDLP, so this is a candidate object rather than a slot in a taxonomy.
    lossiness: >-
      LOSSY AND COMPATIBLY SO, and the lossy-projection test is passed
      algebraically here at zero compute, which is the cheapest available answer to
      "is this actually new". The projection E -> P^1 forgets the sign (2-element
      fibre, strictly non-injective, so not a change of coordinates). What is
      RETAINED is the position of the branch locus, and the discard is compatible
      with the operations because the branch locus is the fixed locus of the very
      involution being quotiented by - so the retained data determines how the
      quotient behaves under the group law up to the residual 2-torsion action,
      which is precisely what the summation polynomial encodes. The further
      projection "coordinate -> branch-locus placement" is lossy again: it forgets
      the curve's coefficients entirely and retains four points of a line, whose
      only curve-dependent invariant is the cross-ratio lambda. That second
      projection is the one that makes the lane finite-dimensional.
    propagation: >-
      One step - apply a Moebius map - moves all four branch points by that map,
      preserving the cross-ratio. One step - change the centre Q - does not move
      the branch locus at all but changes which involution is quotiented, and hence
      changes g from 2 to 1. So the two coordinates of the model space propagate
      independently and their one-step effects are different and separately
      measurable, which is the testability requirement.
    survival_score: >-
      Survives arbitrary reparametrisation as a configuration (that is the point).
      Source 2 dies entirely on a curve with no rational 2-torsion, since the
      involution to diagonalise does not exist over F_p - which is exactly the
      prime-order cryptographic case. Source 1 survives everywhere. So the honest
      survival statement is that the only sparsity source available on a
      cryptographic curve is the one short Weierstrass already uses.

  mechanism: >-
    STEP 1 - THE CENTRING MEASUREMENT, WHICH IS CHEAP AND SURPRISING. On one toy
    curve, build the coordinate x_R(P) = x(P - R) for 20 random R and compute the
    per-variable degree of the reduced S_3 for the relation P_1 + P_2 + P_3 = O.
    PREDICTED: 4 for every R with 3R != O, and 2 for R = O. Then repeat with the
    RETARGETED system (sum P_i' = target - 3R) and confirm the degree returns to 2
    and every metric matches the baseline exactly. This is simultaneously the
    proposal's first result and the calibration of NULL-3 in
    IDEA-20260807-4fc635.
    STEP 2 - THE JACOBI QUARTIC AS THE NAMED OFF-CENTRE MODEL. Build a Jacobi
    quartic y^2 = x^4 + 2 delta x^2 + 1 with identity (0, 1) and negation
    (x, y) -> (-x, y). Verify by fibre enumeration that the deck transformation of
    the coordinate x is (x, y) -> (x, -y) and that it has four fixed points at the
    roots of the quartic - hence that x is NOT the negation quotient. PREDICTED
    per-variable degree of S_3 in x for the O-relation: 4. This is the specific
    checkable degree for the fourth named model and it is the one prediction in
    this batch that is likely to surprise a reader.
    STEP 3 - THE BRANCH LOCUS EXTRACTION. For each model in the lane's set, compute
    the images of O and the three 2-torsion points under the coordinate, and the
    cross-ratio. PREDICTED: cross-ratio identical across all models of the same
    curve (it is the curve's lambda); placements different. This is a direct
    verification that the model space is PGL_2 and the curve contributes one number.
    STEP 4 - THE INCOMPATIBILITY CHECK. On a curve with a rational 2-torsion point
    T, compute the fixed points of iota_T on the Kummer line and confirm that
    neither is the image of O. That is the whole proof of (D) and it is a
    two-point computation.
    STEP 5 - THE PGL_2 SUPPORT SEARCH. Sample 10000 random Moebius maps, compute
    the support size of the reparametrised S_3 for each, and report the
    distribution, the minimum, and the argmin. Then do a local search from the
    argmin. PREDICTED: minimum exactly 13, attained on the short Weierstrass orbit;
    the modal value 27; the even-parity coordinates at 14.
    STEP 6 - THE HEAD-TO-HEAD AT MATCHED SUPPORT. Compare the short Weierstrass
    coordinate (13 monomials, trivial symmetry group) against the diagonalised
    2-torsion coordinate (at most 14 monomials, Klein-four symmetry) on the same
    curve, same points, same factor base, using the full panel of
    IDEA-20260807-1354d8 and the null battery of IDEA-20260807-4fc635. This is the
    only experiment in the lane that could show a model beating short Weierstrass,
    and the counts alone do not predict the winner.
    STEP 7 - THE PRIME-ORDER SCOPE STATEMENT. Repeat Step 5 on a PRIME-ORDER curve,
    where Source 2 is unavailable. PREDICTED: the minimum is still 13 and the
    even-parity coordinates do not exist, so the search returns short Weierstrass.
    That is the sentence the lane owes about cryptographic curves and it must be
    measured rather than asserted.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for "Jacobi quartic", "Legendre",
      "branch point", "cross-ratio", "2-torsion" (2026-08-07). Full reads of
      KN-LIT-004, KN-TECH-002, KN-TECH-007, KN-FIND-a1f3c2, KN-OPEN-003,
      ledger/EV-REP-001.yaml, ledger/EV-REP-002.yaml, harness/semaev.py,
      harness/toycurve.py, and inputs/refs/research/
      proofs_Dreg_conservation_weil_invariance.md. Web search on summation
      polynomials across curve forms.
    results: >-
      INTERNAL - "Legendre form" and "cross-ratio" and "branch point" return no
      substantive records in ledger/ or knowledge/. "Jacobi quartic" appears only
      in DECOMPOSITION.md L11 and RQ-MODEL-e61cb2 as a model to test, with no
      analysis. KN-LIT-004 is the corpus's only entry on model-dependent symmetry
      and its knowledge note is explicit that "Full paper not read". No record
      parametrises the model space, states the centring factor 2, or states the
      incompatibility of the two sparsity normalisations.
      EXTERNAL - the correspondence between degree-2 maps and points of E is
      classical and NO NOVELTY IS CLAIMED for it. The FGHR symmetry mechanism is
      published (KN-LIT-004). Cheng-Kodera-Miyaji 2019 covers several of the same
      forms and I have read only its abstract, so the status of (B) and (D) against
      it is UNKNOWN and is a Stage-0 gate.
    verdict: adaptation

  null_object_control: >-
    MANDATORY AND OF TWO KINDS. NEGATIVE NULL - the random-Moebius battery of
    IDEA-20260807-4fc635 supplies the reference distribution for the support search
    in Step 5; the named models are only interesting where they sit in the TAIL of
    that distribution, and a named model whose support equals the modal random value
    (27) carries no information. DECAY PARAMETER: the number of randomised
    variables r, 0 to m; the minimum support over the sample must not fall below 13
    as r grows, and if it does the claimed extremum is wrong. POSITIVE NULL - a
    curve with FULL rational 2-torsion versus a curve with NONE, both swept over
    the same 10000 Moebius maps. The even-parity coordinates must exist in the
    first sweep and be ABSENT from the second; if 14-monomial coordinates appear on
    a curve with no rational 2-torsion, the parity structure is not coming from the
    torsion and every symmetry claim in this batch is misattributed. SECOND
    POSITIVE NULL - the centring measurement of Step 1, whose predicted answer is
    an exact 4 versus 2 and which therefore validates that the pipeline can detect
    a factor-2 degree change at all.

  assumptions:
    - >-
      p > 3, so the four branch points are distinct and Riemann-Hurwitz gives
      exactly four.
    - >-
      Source 2 requires at least one rational 2-torsion point (cofactor at least 2)
      and the full-2-torsion refinement requires cofactor at least 4. Both are
      guaranteed by construction on the test curves and are absent on prime-order
      curves.
    - >-
      Diagonalising iota_T requires its fixed points to be F_p-rational, i.e. a
      square root condition; when that fails the involution acts by a Moebius map
      with irrational fixed points and the parity sparsity is not achievable over
      F_p even though the symmetry exists. This is a real and easily missed
      obstruction and it must be checked per curve, not assumed.
    - >-
      The support search over 10000 samples estimates the minimum of a discrete
      quantity over a group of size p^3 - p; at 16 bits that is about 2^48
      elements, so the search is a SAMPLE and its minimum is an upper bound on the
      true minimum. The record must never report the sampled minimum as the
      minimum.
    - >-
      "Generic R" in (B) excludes R with 3R = O, where the count collapses.

  proof_search_map:
    bottleneck: >-
      The incompatibility argument (D). If the fixed points of iota_T could
      coincide with the image of O, both sparsity sources would be available at
      once and the lane would have a strictly better coordinate than short
      Weierstrass. Everything else in the record is a parametrisation or a sweep.
    baseline_embedding:
      parameter_slice: >-
        Q = O with O sent to infinity - short Weierstrass. The pipeline must return
        per-variable degree 2, support 13, and exact agreement with
        harness/semaev.py's s3_expr.
      reproduction_check: >-
        Symbolic equality with s3_expr up to a scalar on a frozen toy curve, plus
        the exact monomial count 13. A mismatch halts the line.
    observation_collision:
      observable: >-
        The pair (support size, symmetry group of the coordinate under the residual
        rational 2-torsion action).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED IN ONE DIRECTION - many Moebius maps give
        support 27 with trivial symmetry, so support alone does not identify a
        coordinate. The informative search is for a collision in the OTHER
        direction: a coordinate with support 13 AND non-trivial symmetry, which (D)
        asserts cannot exist. Finding one falsifies the incompatibility and would be
        the single most valuable outcome of this record.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Replace "compare five named models" by "minimise a cost functional over
          E(F_p) x PGL_2(F_p)", so the lane is an optimisation with a computable
          objective rather than a list of comparisons.
        predicted_gain: >-
          Converts an open-ended question (KN-OPEN-003) into a search whose
          negative outcome is an exhaustion statement over a parametrised family
          rather than a tally of names tried.
      - transform: stronger_invariant
        proposed_object: >-
          Track the branch-locus placement rather than the polynomial. Placement
          determines support up to the PGL_2 stabiliser and has an explicit
          invariant (the cross-ratio) that no model change can move.
        predicted_gain: >-
          Separates the curve's contribution (one number, lambda) from the model's
          contribution (three parameters), which is the exact separation
          RQ-MODEL-e61cb2 asks for and which no current record makes.
    quantifier_order: >-
      CLAIMED - FORALL E/F_p with p > 3, FORALL rational 2-torsion T, the fixed
      points of iota_T on E/{+-1} are distinct from the image of O; hence NO
      coordinate simultaneously places O at infinity and diagonalises iota_T.
      ALSO CLAIMED - FORALL R with 3R != O, deg_{t_i} S_3^{x_R} = 4 for the
      O-relation, and equals 2 after retargeting.
      NOT CLAIMED - that 13 is the global minimum of support over PGL_2; the
      sweep gives a SAMPLED minimum and the record says so.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Among the degree-2 coordinates sampled, none has summation-polynomial
        support below 13, the two sparsity normalisations are mutually exclusive,
        and off-centre coordinates pay an exact factor 2 that retargeting recovers."
        It can NEVER certify a global minimum over PGL_2 from a sample, nor anything
        about measured solving cost without the panel and the null battery, nor
        anything about prime-order curves regarding Source 2, which does not exist
        there.
      nearby_object_control: >-
        A curve with rational 2-torsion whose iota_T fixed points are IRRATIONAL.
        There the symmetry exists but the parity sparsity is unattainable over F_p,
        so the desired conclusion (Source 2 available) FAILS while every abstract
        argument for it still applies. That object is the sharpest available test
        that the record is tracking rationality and not just geometry.
    proof_obligations:
      - claim: Degree-2 maps E -> P^1 correspond to involutions P -> Q - P.
        responsibility: correctness
      - claim: An off-centre coordinate has deck group meeting Aut(E,O) trivially.
        responsibility: correctness
      - claim: "deg_{t_i} S_3^{x_R} = 4 for generic R, and 2 after retargeting."
        responsibility: strictness
      - claim: The Jacobi quartic x is off-centre.
        responsibility: correctness
      - claim: The branch locus has exactly four points with cross-ratio lambda.
        responsibility: baseline
      - claim: The fixed points of iota_T are not the image of O.
        responsibility: correctness
      - claim: A sampled minimum is not a minimum.
        responsibility: scope

  predictions:
    - metric: >-
        per-variable degree of the reduced S_3 for the O-relation in the shifted
        coordinate x_R, over 20 random R
      direction: higher
      minimum_effect: >-
        EXACTLY 4 for every R with 3R != O, and EXACTLY 2 for R = O. Zero
        tolerance. A uniform 2 would falsify the centring result (B).
    - metric: >-
        every metric in the shifted coordinate AFTER retargeting, versus the
        centred baseline
      direction: different
      minimum_effect: >-
        EXACT equality on all algebraic metrics. This is simultaneously the
        confirmation of (B)'s escape clause and the calibration of NULL-3 in
        IDEA-20260807-4fc635.
    - metric: per-variable degree of S_3 in the Jacobi quartic coordinate x
      direction: higher
      minimum_effect: >-
        EXACTLY 4 for the O-relation. This is the specific checkable degree for the
        fourth named model and it differs from the naive expectation of 2, which is
        why it is worth measuring.
    - metric: >-
        cross-ratio of the four branch points, computed in every model of the same
        curve
      direction: different
      minimum_effect: >-
        IDENTICAL across models, up to the six-element S_3 ambiguity of cross-ratio
        ordering. A model-dependent cross-ratio would mean the branch loci are not
        related by a Moebius map and the whole classification (A) is wrong.
    - metric: >-
        minimum monomial support of the reparametrised S_3 over 10000 sampled
        Moebius maps
      direction: different
      minimum_effect: >-
        Predicted EXACTLY 13, attained on the short Weierstrass orbit. A sampled
        value below 13 is a discovery and triggers a local search and a full report
        of the argmin coordinate.
    - metric: >-
        existence of a coordinate with support 13 AND non-trivial residual
        2-torsion symmetry
      direction: different
      minimum_effect: >-
        Predicted NONE, per the incompatibility (D). Finding one falsifies (D) and
        would give the lane a coordinate strictly better than short Weierstrass on
        both axes at once.
    - metric: >-
        full measurement panel, short Weierstrass (13 monomials, trivial symmetry)
        versus diagonalised-2-torsion coordinate (at most 14 monomials, Klein-four
        symmetry), matched curve and factor base, with the null battery applied
      direction: different
      minimum_effect: >-
        [open] AND PRE-REGISTERED: a difference in the reached solving degree of at
        least 2 that survives the null is a genuine model effect; a difference of 1
        is inconclusive; no difference is a supported tie and closes the lane's
        last open question at this scope.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, GATE): read Cheng-Kodera-Miyaji 2019 and the FGHR
      2014 body. A hit on (B) or (D) reclassifies this record.
      STAGE 1 (minutes, AND IT IS THE CHEAPEST SURPRISING TEST IN THE BATCH): the
      centring measurement - 20 random R, per-variable degree of S_3 for the
      O-relation, predicted 4; then retargeted, predicted 2.
      STAGE 2 (minutes): the Jacobi quartic construction and its deck-transformation
      fibre check.
      STAGE 3 (minutes): branch-locus extraction and cross-ratio comparison across
      all models of one curve.
      STAGE 4 (minutes): the incompatibility check - fixed points of iota_T versus
      the image of O.
      STAGE 5 (an hour): the 10000-sample PGL_2 support sweep with the distribution,
      minimum and argmin, on a cofactor-4 curve and on a prime-order curve.
      STAGE 6 (hours): the head-to-head at matched support using the panel of
      IDEA-20260807-1354d8 and the null battery of IDEA-20260807-4fc635.
    controls:
      - R = O as the centred baseline within Stage 1
      - retargeted shifted system, predicted to match the baseline exactly
      - a curve with NO rational 2-torsion (Source 2 must be absent)
      - >-
        a curve with rational 2-torsion but IRRATIONAL iota_T fixed points, where
        the symmetry exists but is not diagonalisable over F_p
      - the random-Moebius reference distribution from IDEA-20260807-4fc635
      - >-
        a deliberately wrong branch-locus computation (three points instead of
        four), which the cross-ratio check must reject
    required_metrics:
      - per-variable degree per centre R, before and after retargeting
      - deck-transformation fibre check output for the Jacobi quartic
      - branch-locus placement and cross-ratio per model
      - support size distribution over 10000 samples with min, mode, argmin
      - symmetry group order per sampled coordinate
      - full panel metrics for the head-to-head, with null distributions
      - explicit statement of sampled-minimum versus true-minimum in every report

  falsification_conditions:
    - >-
      The shifted coordinate gives per-variable degree 2 for the O-relation. (B) is
      false and the centring degree of freedom does not exist.
    - >-
      The retargeted shifted system does NOT match the baseline exactly. Then
      either (B)'s escape clause is wrong or the pipeline has a retargeting bug;
      either way NULL-3 of IDEA-20260807-4fc635 is invalid and that record must be
      revised.
    - >-
      The Jacobi quartic x turns out to be the negation quotient after all. Then
      the classification of that model in (A) is wrong.
    - >-
      Cross-ratios differ across models of the same curve. (A) and (C) are wrong.
    - >-
      A fixed point of iota_T coincides with the image of O. (D) is false, both
      sparsity sources combine, and the lane gains a strictly better coordinate.
      This is the outcome most worth hoping for.
    - >-
      The sweep finds support below 13. (E)'s prediction is wrong and a new model
      exists.
    - >-
      14-monomial coordinates appear on a curve with no rational 2-torsion. The
      parity structure is misattributed and every symmetry claim in this batch is
      affected.

  confounders:
    - >-
      SAMPLED VERSUS TRUE MINIMUM. 10000 samples from a group of size about 2^48 at
      16 bits is a vanishing fraction; the sweep bounds the minimum from above and
      nothing more. Reporting the sampled minimum as the minimum is the most likely
      overclaim available here and is pre-empted in every prediction.
    - >-
      RATIONALITY OF THE FIXED POINTS. The symmetry can exist while the
      diagonalising coordinate does not exist over F_p. This is a separate control
      curve, not a footnote.
    - >-
      CENTRING VERSUS RETARGETING. The factor 2 in (B) is entirely an artifact of
      which relation is being encoded, and presenting it as a cost of the Jacobi
      quartic without the retargeting caveat would be exactly the kind of
      framing-dependent claim this program's rule 4 forbids.
    - >-
      MODEL EXISTENCE. Source 2 needs cofactor at least 2 (or 4 for the full Klein
      group), so every measurement of it is on a non-cryptographic curve, and Stage
      7's prime-order sweep is the only arm whose scope reaches them.
    - >-
      Accidental coefficient vanishing at 16 bits inflates sparsity and would
      contaminate the argmin. The sweep must be repeated over five primes and an
      argmin that does not recur across primes must be discarded.
    - >-
      CROSS-RATIO ORDERING gives six values for four unordered points; comparisons
      must use the j-invariant-style symmetric function, not a raw cross-ratio.

  interpretation_limits:
    - >-
      ASYMPTOTIC CEILING, STATED AS THE BRIEF REQUIRES. This record claims NO
      exponent change and cannot claim one: the deck-group law forbids a change in
      the per-variable degree 2^(m-2) across the entire centred model space, and a
      birational change of model is an isomorphism of function fields that cannot
      move the geometry driving Diem's and Gaudry's asymptotics. Every claim here
      is a CONSTANT or SMALL-m claim: a factor 2 for off-centring (recoverable by
      retargeting), a support count between 13 and 27 at m = 3, and a symmetry
      group of order at most 4 whose exploitation is the known FGHR constant.
    - >-
      Source 2 requires rational 2-torsion and therefore does not exist on any
      prime-order curve. The only sparsity source available on a cryptographic
      curve is the one short Weierstrass already uses, and that sentence is the
      record's honest bottom line for deployed parameters.
    - >-
      The PGL_2 sweep is a sample, never an exhaustion.
    - >-
      Support and symmetry are proxies for cost via BKK (KN-TECH-007) and via the
      invariant-ring reduction (KN-LIT-004); neither is cost, and KN-TECH-007's own
      saturation caveat applies.
    - >-
      Toy scale throughout; claim_tier toy (AGENTS.md rule 7).

  reachability_gate: >-
    TRIVIAL, AND STATED EXPLICITLY RATHER THAN LEFT BLANK. T5 (DECOMPOSITION.md
    section 3) charges about p^(1/4) for reaching a SPECIFIED curve in an isogeny
    class; this record reaches no curve. Both coordinates of the model space are
    free to sample: a centre Q is one point of E(F_p), drawn in O(1); a
    parametrisation is one element of PGL_2(F_p), drawn from four field elements.
    So the entire 3-plus-1-dimensional model space is reachable uniformly at O(1)
    cost per sample with probability 1 - which is what makes the OPTIMISATION in
    (E) meaningful at all, and is the sharpest contrast with L1 and L2, where the
    corresponding "sweep the family" move is blocked by exactly this gate. The one
    thing that is NOT free is model EXISTENCE for Source 2: a rational 2-torsion
    point either exists (cofactor at least 2) or does not, decided by the curve's
    group order at zero cost and unobtainable at any cost when absent. That is
    arithmetic, not search, and it is recorded here so it is not mistaken for a
    reachability cost.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CHANGE CLAIMED OR POSSIBLE. Per-variable degree is 2^(m-2)
      throughout the centred model space; off-centring costs an exact factor 2 that
      retargeting recovers; the support ranges over 13 to 27 at m = 3; the symmetry
      group has order at most 4 and its exploitation is the published FGHR constant
      (KN-LIT-004). Prime-field ECDLP remains at p^(1/2) for rho and
      exp(c sqrt(log N log log N)) for Semaev index calculus (KN-FIND-f8c290).
    memory_exponent: >-
      Unchanged across the centred model space, since the Macaulay dimension is set
      by variable count and reached degree (KN-TECH-011), neither of which the
      parametrisation moves. An off-centre coordinate used without retargeting
      would double the per-variable degree and therefore increase the Macaulay
      dimension - a memory loss, and one more reason to retarget.
    best_known: >-
      Rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
      sqrt(N)/sqrt(N) (KN-TECH-031); automorphism-discounted rho on CM curves
      (KN-TECH-018); Semaev index calculus at exp(c sqrt(log N log log N))
      (KN-FIND-f8c290) with BKK constants (KN-FIND-2a8b7e, KN-FIND-c7d31e); and,
      for the symmetry route specifically, the FGHR speedup of KN-LIT-004, which is
      the incumbent this record must beat or match rather than rediscover.
    hidden_overhead: >-
      No o(1) is claimed. Three honest overheads are disclosed: the PGL_2 sweep is
      a sample and its minimum is an upper bound; the diagonalising coordinate needs
      a rational square root that may not exist; and a symmetry-exploiting solver
      must work in an invariant ring whose own construction cost is not charged in
      any support count and is the reason FGHR's factor is a factor and not an
      exponent.
    tradeoff_note: >-
      The record's central object IS a tradeoff and it is stated as such: 13
      monomials with no symmetry versus at most 14 monomials with a group of order
      4, provably not combinable. There is no time-memory tradeoff because no
      algorithm is produced; the tradeoff is between two normalisations of the same
      polynomial, and Stage 6 measures which side wins.
  dominated_by: >-
    AS AN ATTACK - mounts none. Dominated on every axis by every row of the
    prime-field frontier, each checked individually: parallel rho with
    distinguished points (0.886 sqrt(N) group operations, O(1) memory, 0 queries)
    KN-TECH-001/KN-TECH-006; automorphism-discounted rho on CM curves KN-TECH-018;
    BSGS (sqrt(N) time, sqrt(N) memory) KN-TECH-031; Semaev index calculus
    KN-FIND-f8c290 with BKK constants KN-FIND-2a8b7e/KN-FIND-c7d31e. No row is
    approached on time, memory or queries.
    AS A MODEL-SPACE ANALYSIS - dominated by KN-LIT-004 on the SYMMETRY axis
    (FGHR already exploit the 2-torsion symmetry and quantify the gain, and I have
    not read their full paper) and dominates the internal corpus on COVERAGE
    (parametrised sweep versus five named models) and on the centring result (B),
    which appears in no record I have found, internal or external.
  sota_delta: >-
    Zero speedup against any attack baseline. Quantified deltas: an exact factor
    2.000 identified and then recovered by retargeting for off-centre coordinates
    (net 0.000); a sampled support minimum predicted to be exactly 13, equal to the
    short Weierstrass value, i.e. a 0.0% improvement over the incumbent
    normalisation; and a symmetry group of order at most 4 whose exploitation is
    already banked externally by KN-LIT-004 and internally, in a different form, by
    the BKK constant of KN-FIND-c7d31e (a proved (m+1)/2, i.e. 2.0x at m = 3). The
    change to any ECDLP cost exponent is 0.000. The delta to the corpus is the
    conversion of KN-OPEN-003 from "do models matter?" into a two-parameter
    optimisation with a predicted argmin and one named incompatibility.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.75 that the centring measurement gives exactly 4 for generic R; I derived it
    but the global-sign bookkeeping is the kind of step that is easy to get wrong,
    which is precisely why it is Stage 1 and costs minutes. 0.8 that the Jacobi
    quartic x is off-centre as classified; the deck-transformation computation
    (x, y) -> (x, -y) having four fixed points at the roots of the quartic is
    solid. 0.85 that the incompatibility (D) holds - the fixed points of iota_T are
    not 2-torsion images and so cannot be O's image - but this is the step whose
    failure would be most valuable and it costs a two-point computation to check.
    0.8 that the sampled support minimum is 13. And the honest expectation for the
    head-to-head in Stage 6: a tie, which would close the lane's last open question
    at this scope and would be a legitimate result rather than a disappointment.

