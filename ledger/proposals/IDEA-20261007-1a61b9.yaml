idea:
  id: IDEA-20261007-1a61b9
  question_id: RQ-ECDLP-bc7a54
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: x-rank overlap with the low-Hamming scalar set against a random subset
  class: measurement
  claim: >-
    For an ordinary prime-order subgroup of size N in (2^{10}, 2^{12}) on
    a short-Weierstrass curve over F_p, let W be the scalars whose base-2
    Hamming weight is at most floor(log2(N)/4), and let B be the |W|
    subgroup points of smallest integer x-coordinate. The fraction of W
    whose points lie in B exceeds |W|/N by at most 0.02. This prices a
    coordinate test for the invertible low-weight set. It does not
    interpolate a discrete log, and it does not read the Hamming weight
    of a polynomial in y.
  mechanism: >-
    PAIR. Representation R1, the integer digits of x. Operation set
    Sigma is negation, which preserves x. TRICHOTOMY. Partial-action.
    The order statistic of x is invariant under negation and is not a
    function of a generic translate. LOSSY-PROJECTION TEST. The
    projection that keeps only whether a point sits in B discards the
    x-value inside B. A map that kept the full x would be a change of
    coordinates. The test asks whether membership in B agrees with
    membership of the scalar in W above the random rate. The positive
    control reads the tabulated scalar and must recover W exactly.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-bc7a54
      provenance: internal
      claim: >-
        The question names the low-Hamming-weight scalar set as dense
        and invertible, with no known coordinate test.
      verified_by: ledger/questions/RQ-ECDLP-bc7a54.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A sub-square-root algorithm must exploit the representation.
        This proposal does not claim to go under the bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        About N^{1/3} online work needs about N^{2/3} precomputation.
        Enumerating W is that precomputation, not a coordinate test.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
  assumptions:
    - The scalar table is the instrument. It is not an algorithm.
    - Negation is quotiented before |W| and |B| are counted.
    - The curve y^2 = x^3 + x + 1 is not used.
  predictions:
    - metric: >-
        Excess of the overlap fraction |{k in W : [k]G in B}| / |W|
        over |W|/N, on an ordinary curve.
      direction: lower
      minimum_effect: '<= 0.02'
  minimal_test: >-
    Pick the smallest prime p giving an ordinary prime-order subgroup
    with N in (2^{10}, 2^{12}), skipping y^2 = x^3 + x + 1. Tabulate
    the discrete log. Let t = floor(log2(N)/4) and let W be the scalars
    of Hamming weight at most t. Let B be the |W| points of smallest
    integer x, with Q and -Q not both counted. Report the overlap
    excess. Repeat on a second ordinary curve. A control that ranks by
    the scalar itself must recover overlap 1 with W. A random subset of
    size |W| is the null overlap.
  controls:
    - ranking by the tabulated scalar recovers overlap 1 with W
    - a random subset of size |W| supplies the null excess
    - negation quotient before the counts
    - a second ordinary curve
    - y^2 = x^3 + x + 1 is excluded
  falsification_conditions:
    - >-
      The overlap excess is strictly above 0.05 on both ordinary curves,
      and the scalar-ranking control recovers overlap 1.
    - >-
      The scalar-ranking control does not recover overlap 1. The
      counter is then void, and the x-rank excess is not evidence.
  confounders:
    - >-
      Small integers have low Hamming weight more often than large
      ones. The null is a random subset of points, not the smallest
      scalars.
    - >-
      Negation identifies k and N-k, which can change Hamming weight.
      The quotient is applied before the count.
  interpretation_limits:
    - >-
      An excess at most 0.02 does not prove that no coordinate test for
      W exists. It prices this x-rank.
    - >-
      An excess above 0.05 would falsify this claim and would not yet
      be an algorithm of cost N^{1/3}.
    - >-
      This is not the interpolation-degree ratio of IDEA-20261006-4c39d3
      and not the Hamming weight of y(P)^5 - y(P).
  heuristic_assumptions:
    - id: H1
      statement: >-
        At N in (2^{10}, 2^{12}), the integer x-coordinates of a
        prime-order subgroup are independent of the Hamming weight of
        the scalar up to an overlap excess of 0.02 against a random
        subset of the same size.
      rigorous_support: >-
        No theorem is claimed. The comparison is the hypergeometric
        overlap of a fixed W with a random subset of size |W|, whose
        expectation is |W|/N. H1 says the x-rank subset meets that
        expectation at the toy size. It is checked, not assumed at
        N = 2^{256}.
      validation_plan: >-
        On each of two ordinary curves, compute the excess and compare
        it with the excess of one random subset of size |W|. H1 fails
        if the x-rank excess exceeds 0.05 while the scalar-ranking
        control recovers overlap 1. Sample size is the whole subgroup.
  target_complexity:
    time_exponent: >-
      Unchanged at N^{1/2}. A coordinate test for W would be a chi for
      an invertible set. This claim does not exhibit that test.
    memory_exponent: >-
      Unchanged. The toy table of size N is the instrument.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations, and
      KR-RHO-ea34b8, about N^{1/3} online after about N^{2/3}
      precomputation. Both files were opened for this proposal.
    hidden_overhead: >-
      The rho constant is outside this measurement. No o(1) term is
      claimed.
    tradeoff_note: >-
      Enumerating W and storing it is the Bernstein-Lange
      precomputation. An x-rank test would sit outside that tradeoff
      only if it decided membership without listing W. This proposal
      does not produce that test.
  estimated_cost:
    implementation: medium
    compute: small
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-ea34b8
      - KR-RHO-fb88e6
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        relation: adjacent
        delta: >-
          The row says a sub-square-root algorithm must exploit the
          representation. This proposal measures one coordinate test
          for the low-Hamming scalar set. The exponent stays 1/2.
          The measured integer is an overlap excess, not a group-operation count.
      - ref: KR-RHO-ea34b8
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
        relation: adjacent
        delta: >-
          The row prices precomputation of about N^{2/3}. Listing W is
          that precomputation. The x-rank test is a different object,
          and this proposal does not reduce the precomputation.
  dominated_by: >-
    KR-RHO-13bf67 dominates any algorithm that does not exploit a
    representation beyond a generic labelling. KR-RHO-ea34b8 dominates
    the route that lists W and stores it. The gap that remains is a
    coordinate test for W that does not list W. This proposal prices
    one x-rank and does not close that gap.
  sota_delta: >-
    Zero change to the exponent 1/2. The integer measured is an overlap
    excess, with the claim that it is at most 0.02. Relative to
    KR-RHO-ea34b8, the online exponent 1/3 remains available only with
    precomputation about N^{2/3}.
