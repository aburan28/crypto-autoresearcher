idea:
  id: IDEA-20260828-edec21
  question_id: RQ-MLKEM-002
  added: '2026-08-28'
  title: >-
    C-FIN, opened for the first time: the finalize step's zero-test can
    silently misclassify a nonzero accumulator when written as a SIGNED
    magnitude comparison, deriving the exact silent value set and auditing
    which real finalize idioms are sign-safe
  class: mechanism

  claim: >-
    (A) THE NAMED, UNPURSUED CLASS. IDEA-20260805-ee2018 names a fourth
    comparison-defect mechanism class alongside C-COV, C-BND and C-RED --
    "C-FIN -- both are complete but the finalize step loses the bit" -- and
    explicitly records it as "not pursued", listing it among what "remains
    untested" in its own interpretation_limits. IDEA-20260821-13b667
    independently reaches the same boundary from the generator-power side,
    noting "C-FIN can additionally lose the bit after the support has done
    its work" without auditing it. No proposal filed against RQ-MLKEM-002 has
    examined the finalize step's own logic. This record is the first to do
    so, and it identifies a concrete, checkable defect shape rather than
    merely re-asserting that the class exists.
    (B) THE OBJECT IS A VALUE DOMAIN, NOT A BYTE-POSITION DOMAIN. Every prior
    proposal in this lane tracks a set of BYTE POSITIONS (the silent set S,
    the difference support D, the coverage set Cov). The finalize step
    operates after the accumulate/reduce stages have already collapsed the
    comparison down to a single accumulator value r; its job is a ZERO-TEST
    on that one integer, mapping r to a boolean (or an all-0/all-1 mask). A
    finalize defect is therefore a claim about which VALUES of r the test
    misclassifies, not which byte positions are silent -- a genuinely
    different lossy projection from everything this lane has used, tracking
    r's value rather than D's or S's position set.
    (C) THE CONCRETE DEFECT SHAPE: A SIGNED MAGNITUDE TEST. A correct
    zero-test is sign-independent: `r != 0` (or a bit-trick provably
    equivalent to it over the accumulator's actual attainable range).
    A DEFECTIVE finalize written as a SIGNED magnitude test -- `(signed)r > 0`
    or `(signed)r >= 1` on a type where r's declared width matches or exceeds
    the accumulator's byte width -- silently returns "no difference" for
    every value of r whose sign bit (under the declared signed
    interpretation) is set, i.e. for every r in the upper half of the
    type's range. Concretely, for an 8-bit accumulator interpreted as
    `int8_t`, the silent value set is V = {128, ..., 255} (equivalently
    {-128, ..., -1}) -- exactly half of all possible nonzero accumulator
    values -- and this is REACHABLE at ML-KEM's own scale: a single
    differing byte pair `a[i] XOR b[i] = 0x80` (or any XOR value with the top
    bit set) drives the accumulator directly into V on the very first
    differing byte, with no need for cancellation, overflow across many
    blocks, or any implementation-specific accumulation width beyond one
    byte. This is a well-known class of bug in hand-rolled C comparison code
    (signed/unsigned interpretation mistakes), not a contrived corner case.
    (D) PQCLEAN'S ACTUAL FINALIZE IS SHOWN SIGN-SAFE, BY DIRECT INSPECTION.
    PQClean ml-kem-1024/avx2's verify (retrieved this session from the pinned
    commit 10738d92323117d84bb6202c85722ddfd96dc1d4, cross-checked against
    this program's own committed copy) finalizes with `r = (-r) >> 63;
    return r;` on `uint64_t r`. This is NOT a signed magnitude test: it is
    the two's-complement negate-and-shift idiom, and it is correct for
    every r in [1, 2^63], because `-r mod 2^64 = 2^64 - r` has its top bit
    (bit 63) set for any such r, and `>>` on the UNSIGNED type `uint64_t` is
    a logical (not arithmetic) shift, so no sign bit is being tested at all
    in the sense claim (C) describes. Given the accumulate step (a
    `_mm256_testz_si256` result in {0,1} OR'd with at most 31 scalar byte
    values via `|=`), r never exceeds 511, comfortably inside the sound
    range. PQClean's cell is therefore CLOSED under this specific defect
    shape, by direct derivation, not by assumption -- a genuine, honest,
    upfront-disclosed likely-negative result for the one implementation
    already retrieved, which does not make the class uninteresting: the
    census in Stage 3 below is what tells us whether other implementations'
    finalize idioms share this safety or use the vulnerable signed form.
    (E) THE DISCRIMINATING QUESTION. Is EVERY fetchable implementation's
    finalize idiom sign-safe by the same mechanism as PQClean's (an
    unsigned-type bit trick whose soundness does not depend on the
    accumulator's sign interpretation), or does at least one implementation
    finalize with a signed relational test on a type whose width matches the
    accumulator's actual attainable range -- in which case that
    implementation has a reachable, ML-KEM-scale-relevant C-FIN instance,
    with an escalation trigger under RQ-MLKEM-002's constraints if a live
    accumulator value in V is confirmed to reach that finalize call.
    (F) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no
    attack-cost estimate, no timing/power/EM/cache/fault measurement, no
    statement about MLWE hardness or ML-KEM security at any parameter set.
    No claim that any implementation currently has this defect --
    PQClean's is shown NOT to. Identifying that a finalize idiom is
    sign-unsafe makes the class reachable, it does not by itself mean a
    live decapsulation call ever drives r into V; that requires the
    separate, forced accumulate-step arithmetic this record derives per
    implementation. Any newly observed conformance defect escalates to the
    coordinator per RQ-MLKEM-002 and is published by no agent.

  mechanism: >-
    STAGE 0 -- THE ARITHMETIC OF THE FAILURE SHAPE, DERIVED SYMBOLICALLY,
    ZERO COMPUTE. Let r be an accumulator of declared bit width n
    (n in {8, 32, 64} covering byte, word and double-word accumulators seen
    in practice), built by some combination of OR/XOR of per-block or
    per-byte difference values, so 0 <= r < 2^n. A CORRECT finalize computes
    `1{r != 0}` by any means. A DEFECTIVE finalize instead computes
    `1{(signed n-bit) r > 0}`, which under two's-complement equals
    `1{0 < r < 2^(n-1)}` -- true for r in the LOWER half of the nonzero
    range, false for r in the UPPER half (r >= 2^(n-1)) as well as for
    r = 0. The silent value set is therefore
    `V_n = {2^(n-1), 2^(n-1)+1, ..., 2^n - 1}`, of size `2^(n-1)`, exactly
    half of the type's range and, critically, INDEPENDENT of any
    combination of magnitude -- a single byte's XOR value alone can land r
    in V_n if that byte value's own top bit (within the accumulator's
    width) is set. This is derived once, symbolically, and checked per
    candidate finalize expression by reading its exact type and operator,
    never assumed uniformly.
    STAGE 1 -- WHY PQCLEAN'S IDIOM IS DIFFERENT IN KIND, NOT JUST IN DEGREE,
    DERIVED SYMBOLICALLY. `r = (-r) >> 63` on `uint64_t r` computes
    `(2^64 - r) >> 63` for r != 0 (unsigned negation), which is `1` whenever
    `r <= 2^63` -- i.e. sound for r across essentially the ENTIRE nonzero
    range of a 64-bit accumulator, not merely the lower half. It is sound
    precisely because it operates on an UNSIGNED type with a shift amount
    equal to (width - 1), extracting the CARRY of the negation rather than
    interpreting r's own top bit as a sign. The two idioms differ in a way
    that is checkable from source alone: does the finalize expression
    negate-then-shift on an unsigned type of width >= (log2 of the
    accumulator's true attainable range) + 1, or does it directly compare a
    SIGNED-typed r against a threshold? This binary classification is the
    census predicate of Stage 3.
    STAGE 2 -- CONFIRM PQCLEAN'S ACCUMULATOR NEVER APPROACHES EITHER
    BOUNDARY, ZERO COMPUTE. From the retrieved source (Stage 0 of the
    companion record IDEA-20260828-40db79 quotes the identical function in
    full), r starts at `1 - _mm256_testz_si256(h,h)` in {0,1}, then is
    OR'd with individual byte values `a[i]^b[i]` for i over the scalar
    remainder (at most 31 iterations at any FIPS 203 ciphertext length,
    since the AVX2 block is 32 bytes and every ML-KEM ciphertext length is
    a multiple of 32 per IDEA-20260805-3c957e's own table). An OR of at
    most 31 byte values (each <= 255) with an initial {0,1} value is itself
    <= 255, comfortably below both 2^63 (the unsigned idiom's soundness
    boundary) and 2^7 (where an 8-bit signed-test vulnerability would live,
    irrelevant here since r's declared type is 64-bit throughout). No
    boundary is approached by any legitimate input; this is a forced
    conclusion from the retrieved code, not a measurement.
    STAGE 3 -- THE CROSS-IMPLEMENTATION CENSUS, THE DISCRIMINATOR. For
    every implementation fetchable within budget, locate the exact
    finalize expression (the last operation before the comparison's
    boolean or mask is returned or consumed), read its declared type and
    operator from source, and classify it as SIGN-SAFE (an unsigned
    negate-and-shift, an unsigned OR-reduce compared with `!= 0`, an
    explicit `!!r`, or any construction provably independent of r's sign
    interpretation) or SIGN-VULNERABLE (a signed relational comparison
    `> 0` / `>= 1` / `< 0` used as a stand-in for a zero-test, on a type
    whose width matches or is narrower than the accumulator's own
    attainable range). Separately record, per implementation, the
    accumulator's ACTUAL attainable range from its accumulate step (as
    Stage 2 did for PQClean), so a SIGN-VULNERABLE finalize whose
    accumulator can never actually reach V_n (e.g. because every
    intermediate value is provably small relative to the type width, as
    PQClean's is) is correctly reported REACHABLE-BUT-BENIGN-BY-CONSTRUCTION
    rather than conflated with a finalize whose accumulator genuinely can
    reach V_n on a single differing byte.
    STAGE 4 -- PLANTED-FINALIZE CONFIRMATION. Build a handful of planted
    comparators differing ONLY in their finalize expression (unsigned
    negate-shift vs. `int8_t r; return r > 0;` vs. `int32_t r; return
    r > 0;`), driven by a generator that can place the accumulator at any
    value in [0, 255] by choosing which single byte to flip and to what
    value, under the GNU ld --wrap interposition already admitted for this
    instrument class (EV-MLKEM-010). Confirm the forced disagreement
    predicted in Stage 0: the sign-safe finalize detects every nonzero r;
    the sign-vulnerable 8-bit finalize detects r in [1,127] and MISSES
    r in [128,255], exactly matching V_8; the 32-bit sign-vulnerable
    finalize, given an 8-bit-range accumulator, detects everything (its
    own V_32 is unreachable at this accumulator's actual range), which is
    the REACHABLE-BUT-BENIGN control case distinguishing "the idiom is
    unsafe in general" from "the idiom is unsafe for THIS accumulator".

  novelty_status: unverified

  novelty_screen:
    method: >-
      Retrieval this session used Grep over the repository plus the same
      WebFetch of PQClean's pinned verify.c already performed for the
      companion record IDEA-20260828-40db79 (not refetched separately; the
      identical retrieved source is reused here as the object of analysis
      for a different question). Grep of `ledger/proposals` (glob *MLKEM*)
      for `sign.?(safe|unsafe|extension|bit)|signed.?comparison|int8_t|
      value domain|zero.?test`, case-insensitive: no hits describing a
      value-domain finalize object; the only prior mentions of "finalize"
      or "C-FIN" are the two cited below, both naming the class without
      auditing it. Grep of `knowledge/` and `ledger/hypotheses` (glob
      H-MLKEM*) for `sign.?extension|signed comparison|int8_t.*compare`,
      case-insensitive: no hits. All eight RQ-MLKEM-002 proposals were read
      in full or in their claim/mechanism sections this session.
    results: >-
      IDEA-20260805-ee2018 names C-FIN once, in a one-clause aside, and
      lists it among untested classes in its own interpretation_limits; it
      supplies no mechanism, no silent value set, and no example. This
      record supplies both. IDEA-20260821-13b667 mentions finalize only to
      note that it "can additionally lose the bit after the support has
      done its work" while deriving its own closed forms entirely for the
      accumulate stage; it explicitly treats finalize as future work, not
      as its own object. No other record in this repository examines a
      finalize expression's type or sign interpretation. Outside the
      repository, signed/unsigned comparison mistakes are a well-documented
      general class of C bug; no specific prior report of this exact defect
      shape in an ML-KEM or Kyber comparison finalize was searched for or
      found, and none is claimed.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: opening C-FIN at
      all with a concrete mechanism rather than a name; tracking the
      accumulator's VALUE DOMAIN as the object rather than a byte-position
      set, which is a genuinely different lossy projection from every prior
      proposal in this lane; deriving the exact silent value set V_n for a
      signed-magnitude finalize and showing it is reachable at ML-KEM's own
      byte-difference scale (unlike a magnitude-overflow account, which
      would not be); and showing PQClean's actual idiom is sign-safe by a
      DIFFERENT mechanism (unsigned negate-and-shift) than either a correct
      or an incorrect signed test, resolving the question for one
      implementation while leaving the census open. ASSEMBLED FROM KNOWN
      PARTS: the C-FIN name and its place in the taxonomy are
      IDEA-20260805-ee2018's; the specific source code analyzed is
      PQClean's (retrieved); signed/unsigned comparison bugs are a
      textbook-level general fact about C, not a discovery of this record.

  object_first_candidate:
    tracked_object: >-
      The pre-finalize accumulator's VALUE, `r in [0, 2^n)`, together with
      the finalize map `f: [0, 2^n) -> {0,1}` it is passed through, and in
      particular the silent value set `V = {v : v != 0 and f(v) = 0}`. This
      is explicitly NOT a byte-position object: it discards WHICH bytes of
      the compared buffers differed, retaining only the aggregate integer
      value the accumulate/reduce stages produced and how the finalize step
      classifies it. Every established family in this lane (silent set S,
      difference support D, coverage set Cov) is a position-domain object
      and is declared off-limits as the primary lens per inventor-protocol
      section 1; this record's object lives one level downstream, after the
      position information has already been collapsed away by the
      accumulate/reduce stages, which is precisely what C-FIN's name in
      IDEA-20260805-ee2018 already implies but no record had yet made
      concrete.
    lossiness: >-
      Genuinely lossy and lossy in a different DIRECTION from every prior
      object in this lane. A byte-position projection (S, D, Cov) discards
      VALUES and retains POSITIONS; this projection discards POSITIONS
      entirely (many distinct difference supports D of the same size
      collapse to the same accumulator value r, e.g. any single-byte XOR
      of 0x80 anywhere in the buffer gives the identical r = 0x80 after an
      OR-based accumulate) and retains only the resulting VALUE. The fibre
      over a fixed r is therefore large and structurally different from any
      fibre this lane has audited: it is a statement about the accumulate
      step's own many-to-one collapse, not about the finalize step, which
      is why this record separates "does the accumulate step collapse
      losslessly onto a value the finalize can read" (assumed, and
      established for OR-of-XOR accumulates by IDEA-20260821-13b667's H1)
      from "does the finalize step correctly classify that value" (this
      record's own question). Compatibility with the target's operation
      holds precisely for accumulate steps meeting 13b667's H1 (OR-of-XOR,
      no cancellation); a cancelling accumulate is out of this projection's
      domain, exactly as 13b667 already states for its own object, and is
      inherited rather than re-derived here.
    propagation: >-
      One step of the operation of interest is "apply the finalize
      expression to a given accumulator value r". The propagation law is a
      lookup, not an accumulation: `verdict = f(r)`, and the closed form
      for a signed-magnitude f is `f(r) = 1{0 < r < 2^(n-1)}`, forced by
      two's-complement arithmetic alone and requiring no measurement to
      derive, exactly as the containment law `D subset of S` in
      IDEA-20260821-13b667 required no measurement to derive for the
      accumulate stage.
    survival_score: >-
      Survives one step and stops at the boundary stated in advance. Step 1,
      "does the finalize map correctly classify a given r": survives, and
      is exactly what Stage 0's closed form and Stage 4's planted
      confirmation answer. Step 2, "does a real decapsulation call ever
      produce an r landing in V for a given implementation's accumulate
      step": survives PARTIALLY -- it is answered for PQClean specifically
      (Stage 2, forced no, by direct source reading) but requires the
      SEPARATE, per-implementation accumulate-range derivation this record
      performs in Stage 3 for every other candidate rather than assuming
      one answer transfers. Step 3, ANY CLAIM ABOUT WHAT HAPPENS TO THE
      SELECTED SHARED SECRET AFTER A MISCLASSIFIED VERDICT (i.e. whether a
      false-accept here would actually leak information or merely return a
      wrong-but-still-fixed value): DIES here deliberately, and is exactly
      the object of the companion record IDEA-20260828-40db79, which this
      record does not restate or depend on.

  discriminated_from:
    - >-
      IDEA-20260805-ee2018 and IDEA-20260821-13b667 both NAME C-FIN as an
      unpursued class concerning "the finalize step" in one sentence each,
      without a mechanism, a silent value set, or an example. This record
      supplies all three and is the first to treat the finalize step's
      TYPE and SIGN INTERPRETATION, rather than its mere existence, as an
      object.
    - >-
      IDEA-20260805-3c957e, -1beeca and IDEA-20260821-13b667's own closed
      forms track a byte-POSITION set (S or D). This record's tracked
      object is an integer VALUE and a map on values; the two kinds of
      object are not interchangeable and this record does not restate or
      extend the position-domain arithmetic of any of them, though it
      inherits 13b667's H1 (accumulate-step support-sufficiency) as a
      precondition for its own object to be well defined, exactly as
      stated in lossiness above.
    - >-
      IDEA-20260828-40db79, filed the same session, tracks a DIFFERENT
      downstream primitive (the select/cmov that consumes the finalize's
      output) and its own byte-position coverage. The two records are
      complementary and deliberately non-overlapping: this record asks
      whether the verdict bit itself is computed correctly from the
      accumulator; -40db79 asks whether a downstream primitive, GIVEN a
      correct verdict bit, writes every output byte. Neither record's
      claim depends on the other's.
    - >-
      H-MLKEM-232843 (RQ-MLKEM-001) performs a black-box byte-mutation
      census on the PRIVATE KEY dk and reads decapsulation's overall
      (accept-path, reject-path) behavior; it never inspects a finalize
      expression's source code or type. This record is a white-box audit
      of one specific code shape and does not mutate dk or any key
      material at all.

