  assumptions:
    - >-
      A comparison's finalize expression is locatable in source (the last
      operation before the boolean/mask crosses to the caller) for every
      implementation censused. Where inlining, macro expansion, or
      link-time optimization obscures the boundary, that implementation's
      cell is reported UNMEASURABLE rather than assigned a classification.
    - >-
      The accumulate step feeding the finalize satisfies H1 from
      IDEA-20260821-13b667 (OR-of-XOR, no cross-position cancellation) for
      every implementation censused; where it does not (an arithmetic-sum
      or checksum-style accumulate), this record's object is not well
      defined for that implementation and the cell is reported VOID rather
      than scored, exactly as 13b667 requires for its own object.
    - >-
      The declared bit width of the accumulator's TYPE, as written in
      source, correctly describes the width the compiler actually uses
      (no implicit promotion silently widens or narrows it in a way source
      reading alone would miss). Where this is in doubt, the census
      cross-checks against IDEA-20260821-121612's disassembly-based
      extractor rather than trusting the source declaration alone.
    - >-
      No conclusion transfers beyond the pinned commits and finalize
      expressions actually read. A sign-safe classification at one pinned
      commit says nothing about a different commit, backend, or
      implementation not fetched.

  proof_search_map:
    bottleneck: >-
      The step from "a finalize idiom uses a signed relational test on a
      type matching the accumulator's declared width" to "and therefore a
      real accumulator value can land in the silent set V_n" -- this is
      where the general arithmetic (Stage 0, unconditional) meets the
      per-implementation fact (Stage 2/3, checked not assumed) about
      whether the accumulate step can actually produce a value in V_n.
    baseline_embedding:
      parameter_slice: >-
        Restricted to the ONE finalize idiom already retrieved
        (PQClean's unsigned negate-and-shift), this record's own Stage 1
        derivation shows the general signed-magnitude failure shape of
        Stage 0 does NOT apply -- the baseline case is a NEGATIVE embedding
        by construction, and the record states this rather than manufacturing
        a positive one. The proposal is a genuine family EXTENSION relative
        to the taxonomy (a new failure mode within C-FIN) rather than a
        restatement of an already-observed defect.
      reproduction_check: >-
        Symbolically recompute `(-r) >> 63` for r in {0, 1, 128, 255, 511}
        (spanning PQClean's actual attainable range and beyond) under
        64-bit two's-complement unsigned arithmetic and confirm the result
        is 0 only at r = 0, before reading any further source. This is a
        frozen, zero-compute check against the exact idiom quoted in
        claim (D).
    observation_collision:
      observable: >-
        The single boolean or mask value the finalize step returns.
      distinct_preimage_search: >-
        Every r in V_n (a sign-vulnerable finalize's silent set) and every
        r = 0 produce the IDENTICAL observable ("no difference") despite
        being ground-truth DISTINCT: one is a genuine equality, the other
        is a genuine difference misclassified. This is a direct collision
        between two ground-truth states on the same observable and is
        exactly what a planted-comparator test (Stage 4) is built to expose
        by choosing which specific r value a probe drives the accumulator
        to, rather than relying on the observable alone to distinguish
        them.
      constructive_transforms:
        - transform: observable_fiber
          proposed_object: >-
            The accumulator value r, held fixed across two constructions
            (a genuinely equal pair producing r=0, and a genuinely differing
            pair engineered to produce r in V_n) while the finalize map is
            varied.
          predicted_gain: >-
            Separates "the finalize map is unsound in general" (Stage 0's
            closed form, unconditional) from "a real accumulate step can
            reach the unsound region" (Stage 2/3, per implementation),
            which a single observable alone cannot separate.
      quantifier_order: >-
        Stage 0's claim is universal and unconditional: FOR ALL n-bit
        accumulators and FOR ALL signed-magnitude finalize maps of matching
        width, V_n is exactly the stated set -- this is elementary
        arithmetic, not a heuristic, and requires no per-instance
        witness. The REACHABILITY claim is existential and per-
        implementation: FOR the specific accumulate step of implementation
        I, THERE EXISTS an input driving r into V_n (verified for PQClean
        to be FALSE by direct bound; checked, not assumed, for every other
        censused implementation in Stage 3).
      method_ceiling:
        strongest_certifiable_claim: >-
          For a stated, finite set of pinned and fetched implementations
          whose finalize expression and accumulate-step attainable range
          are both read from source, this method certifies whether that
          implementation's finalize is sign-vulnerable IN GENERAL (Stage 0's
          arithmetic) and, separately, whether its own accumulate step can
          reach the vulnerable region (Stage 2/3's per-implementation
          bound). It does not certify anything about implementations not
          fetched, and it does not certify that a reachable-and-vulnerable
          cell is ACTUALLY exercised by any real-world ciphertext without a
          further, live confirmation.
        nearby_object_control: >-
          A planted comparator whose accumulator is declared `int8_t` and
          whose accumulate step ORs in raw byte XOR values (so V_8 IS
          reachable by construction, unlike PQClean's 64-bit accumulator),
          finalized with `return r > 0;`. The method must classify this
          cell as SIGN-VULNERABLE AND REACHABLE, in contrast to a planted
          comparator with the identical finalize test but a `int32_t`
          accumulator fed only by the same 8-bit-range byte values (SIGN-
          VULNERABLE BUT UNREACHABLE, since its own V_32 lies far above
          255). Distinguishing these two is exactly what confirms the
          method separates the general defect shape from its per-
          implementation reachability rather than conflating them.
      proof_obligations:
        - claim: The silent value set V_n for a signed-magnitude finalize is exactly {2^(n-1), ..., 2^n - 1}.
          responsibility: correctness
        - claim: PQClean's `(-r) >> 63` on uint64_t is sound for every r its own accumulate step can produce.
          responsibility: size
        - claim: The planted 8-bit and 32-bit sign-vulnerable finalize arms reproduce the predicted reachable/unreachable distinction under instrumentation.
          responsibility: success_probability
        - claim: No conclusion transfers beyond the pinned commits and finalize expressions actually read.
          responsibility: scope

    not_applicable_reason: null

  predictions:
    - metric: >-
        finalize_verdict(PQClean_avx2, r) for r in {0, 1, 128, 255, 511},
        recomputed symbolically under the frozen `(-r)>>63` script on
        uint64_t
      direction: different
      minimum_effect: >-
        EXACTLY 0 at r=0 and EXACTLY 1 at every other listed r, with no
        tolerance -- confirming this idiom is sign-safe over PQClean's
        entire attainable range, not merely over a lower sub-range.
    - metric: >-
        max_attainable_r(PQClean_avx2): the maximum value the accumulator
        can reach over the scalar remainder loop, derived from the source
        (at most 31 OR'd byte values plus an initial {0,1})
      direction: lower
      minimum_effect: >-
        AT MOST 255 (in fact exactly the OR of the initial bit with up to
        31 byte values, bounded above by 0xFF since OR cannot exceed the
        widest single operand's bit pattern union, which is bounded by
        byte width). Any measured or derived value exceeding this
        contradicts the source read in claim (D) and voids Stage 2.
    - metric: >-
        sign_vulnerable_finalize_count: over every implementation censused
        in Stage 3, the number whose finalize expression is a signed
        relational test on a type matching or narrower than its own
        accumulator's declared width
      direction: different
      minimum_effect: >-
        No number is predicted and the refusal is deliberate: this is the
        record's discriminator. Zero means the class is closed on the
        fetched population by inspection, a genuine and reportable
        strengthening of the taxonomy's completeness; a nonzero count
        names the specific implementation(s) for the follow-on reachability
        check.
    - metric: >-
        reachable_and_vulnerable_count: of any implementations flagged
        sign-vulnerable, the number whose OWN accumulate step can drive r
        into that finalize's silent set V_n (per Stage 3's per-
        implementation bound)
      direction: lower
      minimum_effect: >-
        No direction is predicted for real candidates and the refusal is
        deliberate: a nonzero count here is a live, escalable conformance
        finding under RQ-MLKEM-002 and must not be published by this or
        any agent; it is reported to the coordinator instead. Zero is the
        expected and fully acceptable outcome and does not weaken the
        record.
    - metric: >-
        planted_8bit_finalize detection rate at r in [1,127] versus r in
        [128,255], over the graded probe set of Stage 4
      direction: different
      minimum_effect: >-
        Detection rate 1.0 for r in [1,127] and EXACTLY 0.0 for r in
        [128,255], with no tolerance -- the forced signature of a
        signed-magnitude 8-bit finalize, and the must-fire/must-miss pair
        that makes a subsequent zero reading on a real candidate
        interpretable.
    - metric: >-
        planted_32bit_finalize (fed only by 8-bit-range accumulator values)
        detection rate over the same probe set
      direction: higher
      minimum_effect: >-
        Detection rate 1.0 across the entire probed range, DESPITE using
        the identical sign-vulnerable relational test as the 8-bit arm --
        confirming that vulnerability and reachability are separate
        properties and that this record's method distinguishes them rather
        than flagging every signed test as equally dangerous.

  minimal_test:
    design: >-
      Three stages, cheapest and most decisive first, entirely on
      laboratory builds from public source. STAGE 0 (minutes, zero build):
      recompute the closed-form silent set V_n symbolically for n in
      {8, 32, 64} and confirm PQClean's specific idiom lies outside the
      general failure shape via the two's-complement identity in claim
      (D); this alone produces the record's headline closure for PQClean.
      STAGE 1 (minutes to hours, reading not running): the cross-
      implementation census of finalize expressions and accumulator
      attainable ranges for every implementation fetchable within budget,
      reusing IDEA-20260821-121612's frozen extractor for disassembly-level
      confirmation where source alone is ambiguous about compiler-inserted
      widening or narrowing. STAGE 2 (bounded, tens of minutes): build
      3-4 planted comparators differing only in finalize expression and
      accumulator type, drive them with a generator that can place r at
      any chosen value by choosing which byte to flip and to what value,
      under GNU ld --wrap, and confirm the forced detection/miss pattern.
      Total compute is small: single-byte probes against small standalone
      comparators, no key generation or full KEM round trip required for
      Stage 2's confirmation, though Stage 3's census against real library
      builds is bounded by fetch and build time for each candidate.
    controls:
      - >-
        MUST-MISS ARM: the planted 8-bit sign-vulnerable finalize, forced
        to miss every probe with r in [128,255]; without a demonstrated
        miss, the instrument cannot be trusted to detect a genuine
        vulnerability elsewhere (KN-TECH-1a5b7e mode 1/2 discipline).
      - >-
        MUST-DETECT ARM: the identical sign-vulnerable relational test
        wired to a 32-bit accumulator fed only by 8-bit-range values,
        forced to detect everything -- the reachable-versus-unreachable
        contrast that keeps the method from over-flagging every signed
        comparison as equally dangerous.
      - >-
        SIGN-SAFE CONTROL: PQClean's actual `(-r)>>63` idiom, planted or
        directly invoked, forced to detect every nonzero r across the full
        probed range, confirming the baseline embedding of proof_search_map
        is a genuine negative rather than an untested assumption.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST REPORT VOID: a
        comparator whose accumulate step is an arithmetic SUM (not
        OR-of-XOR), where two distinct byte differences can cancel to the
        same r as no difference at all. This record's object (a
        well-defined map from r to a verdict) is not well-posed there
        independent of any finalize question, and the method must report
        VOID for the accumulate stage rather than attempt a finalize
        classification, inheriting IDEA-20260821-13b667's identical control
        for the same reason.
      - >-
        ORDERING CONTROL: the closed-form V_n table and the planted-
        comparator forced values are committed and hashed before any
        candidate implementation beyond PQClean is read in Stage 1.
      - >-
        ARCHIVE CHECK (zero compute): confirm this record's Stage 0
        arithmetic reproduces, as a special case at r=0, the same "empty
        silent set gives zero detection power" identity IDEA-20260805-3c957e
        and IDEA-20260821-13b667 both already establish for their own
        objects, as a sanity cross-check that the value-domain and
        position-domain formalisms agree at the one point where they must.
    required_metrics:
      - the closed-form V_n table for n in {8,32,64}, with the symbolic derivation
      - PQClean's finalize verdicts at the five listed r values, with script and hash
      - PQClean's derived maximum attainable r, with the source excerpt it is read from
      - per-implementation (finalize type/operator, sign-safe?, accumulator max attainable r, reachable-and-vulnerable?) tuple from the Stage 1/3 census
      - planted-comparator detection rates for the 8-bit and 32-bit sign-vulnerable arms and the sign-safe control, across the graded probe set
      - the list of implementations reported UNMEASURABLE or VOID, with the reason
      - every patch diff, build configuration, and pinned commit used

  falsification_conditions:
    - >-
      PQClean's finalize expression as retrieved does not match a fresh
      fetch at the same pinned commit, or the derived closed form disagrees
      with a symbolic recomputation of `(-r)>>63` at any of the five listed
      r values. Claim (D) is wrong or void and this record is withdrawn in
      that part.
    - >-
      The must-miss arm fails to miss any probe with r in [128,255]. The
      planted 8-bit sign-vulnerable comparator does not exhibit the
      predicted defect; the instrument or the construction is wrong and no
      candidate reading is trustworthy until repaired.
    - >-
      The must-detect arm (32-bit sign-vulnerable finalize on an 8-bit-
      range accumulator) misses any probe. Either the accumulator's
      attainable range was mis-derived or the finalize expression was
      mis-planted; the reachable/unreachable distinction this record relies
      on is not being measured correctly.
    - >-
      Any fetched implementation is classified sign-vulnerable AND its own
      accumulate step is confirmed able to reach V_n. This is a genuine,
      escalable conformance finding under RQ-MLKEM-002, reported to the
      coordinator and not published by any agent.
    - >-
      A finalize expression cannot be located or its type/width cannot be
      determined from source or disassembly for a majority of censused
      implementations. The census is not executable as designed for those
      cells and is reported UNMEASURABLE rather than patched after seeing
      partial results.
    - >-
      Build or fetch failures for any candidate implementation.
      INFRASTRUCTURE outcome under AGENTS.md rule 3, never evidence about
      that implementation; the census is reported over the cells that
      built.

  confounders:
    - >-
      THE ACCUMULATE STEP'S ATTAINABLE RANGE, NOT JUST THE FINALIZE
      EXPRESSION, DETERMINES REACHABILITY. Two implementations can use the
      identical sign-vulnerable finalize idiom while differing entirely in
      whether a real input can drive their accumulator into the vulnerable
      region; conflating "uses a signed test" with "is actually
      vulnerable" would overstate the census, which is exactly why Stage 3
      records both properties separately and Stage 4's must-detect arm
      exists to demonstrate the distinction under instrumentation.
    - >-
      COMPILER-INSERTED WIDENING OR NARROWING CAN CHANGE THE EFFECTIVE
      TYPE WIDTH. A source-declared `int8_t` accumulator promoted to `int`
      for a comparison (as C's usual arithmetic conversions do for most
      operators) may or may not preserve the vulnerability depending on
      exactly where the promotion occurs relative to the relational test;
      this is exactly the kind of gap IDEA-20260821-121612's disassembly-
      level extractor exists to catch, and the census defers to it wherever
      source reading alone is ambiguous.
    - >-
      SUPPORT-SUFFICIENCY IS INHERITED, NOT RE-DERIVED. This record's
      object is only well-posed for accumulate steps satisfying
      IDEA-20260821-13b667's H1 (OR-of-XOR, no cancellation); a cancelling
      accumulate is out of domain and must be reported VOID, not assigned
      a finalize classification that would be meaningless for it.
    - >-
      SELECTION BY WHAT WAS PINNED. The forced-safe classification is
      demonstrated on one pinned commit of one implementation; the
      census's population is whatever is fetchable within budget, and every
      count is a floor over that population, stated as such.
    - >-
      A NULL CENSUS (every fetched implementation sign-safe) IS A LIKELY
      OUTCOME AND MUST NOT BE OVERSOLD. Well-reviewed cryptographic
      comparison code tends to use exactly the kind of unsigned bit-trick
      idiom PQClean uses precisely because it avoids this class of bug by
      construction; a clean census is the honest expected deliverable
      either way, mirroring IDEA-20260805-ee2018's own caution about its
      C-RED census.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST
      ESTIMATE, NOT A STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT
      ANY PARAMETER SET. RQ-MLKEM-002's constraints bind unchanged; any
      newly observed conformance defect escalates to the coordinator and
      is published by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for any hypothesis,
      or for any archived evidence or decision record.
    - >-
      A sign-safe classification at one implementation's one pinned commit
      does NOT establish that its comparison is otherwise correct, that
      its accumulate or reduce stages are complete, or that any other
      implementation's finalize behaves the same way. It establishes
      exactly one arithmetic fact about one expression.
    - >-
      Claim tier laboratory/toy, not raisable by citation. A conclusion is
      scoped to the exact pinned commits and finalize expressions actually
      read; laboratory conformance evidence is never crypto-scale or MLWE
      evidence.
    - >-
      A universally sign-safe census closes nothing about the isolation-
      versus-systemic question beyond this one narrow mechanism at this
      one stage; it removes one candidate defect shape from future search,
      not the search itself, and does not discharge C-FIN as a whole --
      other finalize defect shapes (a truncating cast, an off-by-one
      threshold, a mask constructed from the wrong bit) remain untested by
      this record. Premature closure is a failure mode symmetric with
      overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SIGNED-MAGNITUDE SILENCE. FOR ALL n-bit accumulators r and FOR ALL
        finalize maps computing `1{(signed n-bit) r > 0}` under two's-
        complement representation, the silent value set is exactly
        `V_n = {2^(n-1), ..., 2^n - 1}`, independent of how r was
        accumulated, and this set is nonempty and equal to exactly half of
        [1, 2^n) for every n >= 1.
      rigorous_support: >-
        Not a distributional heuristic; a rigorous, elementary consequence
        of the definition of two's-complement signed interpretation
        (v is negative, hence fails `> 0`, iff its top bit is set, iff
        v >= 2^(n-1) under the unsigned reading). It imitates no classical
        distribution theorem and is not presented as one. It requires the
        platform to use two's-complement representation (universal in
        practice for the toolchains this program builds on, and stated as
        an explicit precondition rather than a silent assumption) and
        applies only to a RELATIONAL comparison used as a zero-test; a
        finalize using `!= 0`, `!!r`, or an unsigned bit-trick is
        by definition outside V_n's failure mode and is classified
        sign-safe rather than assigned a nonempty silent set.
      validation_plan: >-
        Symbolically enumerate V_8 = {128,...,255} and confirm by direct
        substitution that `(int8_t)v > 0` is false for every v in that set
        and true for every v in {1,...,127}, before any planted comparator
        is built. Confirm under instrumentation (Stage 4) that a planted
        8-bit sign-vulnerable finalize reproduces exactly this partition at
        every probed r, with zero tolerance, since this is a symbolic fact
        about integer representations and not a statistical estimate. No
        sampling at cryptographic scale is required or claimed.
    - id: H2
      statement: >-
        ACCUMULATOR RANGE BOUND, PQCLEAN-SPECIFIC. For PQClean
        ml-kem-1024/avx2's verify at the pinned commit, the accumulator r
        immediately before its finalize call never exceeds 255 for any
        legitimate pair of 1568-byte ciphertext buffers, at every FIPS 203
        parameter set.
      rigorous_support: >-
        Rigorous given the retrieved source: the accumulate step is
        `r = 1 - _mm256_testz_si256(h,h)` (giving 0 or 1) followed by
        `r |= a[i] ^ b[i]` over at most `len mod 32` scalar remainder
        bytes, and every FIPS 203 ciphertext length is a multiple of 32
        (IDEA-20260805-3c957e), so the scalar loop in fact contributes
        ZERO bytes at every real ML-KEM call and r never leaves {0,1} in
        practice -- an even tighter bound than the 255 stated in the claim,
        which is retained as the more conservative, source-derivable bound
        not requiring the ciphertext-length fact to hold. NOT independently
        verified for any implementation beyond this one pinned commit.
      validation_plan: >-
        Recompute `len mod 32` for len in {768,1088,1568} under the frozen
        script (reproducing IDEA-20260805-3c957e's own already-committed
        table, which reports 0 at every one of these lengths for w=32) to
        confirm the scalar remainder loop's trip count is in fact zero at
        every real ML-KEM call, tightening H2's bound from <=255 to
        r in {0,1} exactly for this implementation. Report both bounds,
        since the looser one is the one that does not depend on the
        ciphertext-length fact and therefore degrades more gracefully if
        that fact is ever found not to hold for some future parameter set.

  target_complexity:
    time_exponent: >-
      n/a. No exponent is moved and no attack is proposed; RQ-MLKEM-002
      forbids attack-cost estimation. The deliverable is a symbolic
      closed-form derivation plus a bounded source census, not an
      asymptotic result.
    memory_exponent: n/a
    best_known: >-
      n/a -- no competing statement of finalize sign-safety exists in this
      repository or, so far as searched this session, elsewhere.
    hidden_overhead: >-
      n/a. The planted-comparator stage is dominated by a handful of small
      standalone compiles and single-byte probes against synthetic
      buffers, well under a second each.
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed; no algorithm, no cost, hence no Pareto point
    across time, memory, or data/queries). Rows checked inside this
    repository on 2026-08-28 for a prior mechanism-level treatment of
    C-FIN: all eight filed RQ-MLKEM-002 proposals, read in full or in
    their claim/mechanism sections; RQ-MLKEM-001's H-MLKEM-232843 (a
    black-box key-field census with no finalize-expression content);
    GOAL-MLKEM-002 and its four batch checkpoints; and KN-FIND-001. Only
    two records (IDEA-20260805-ee2018, IDEA-20260821-13b667) even name
    C-FIN, and both explicitly leave it unpursued. No external search for
    prior academic or industry work on signed-comparison finalize defects
    in constant-time comparison primitives specifically was performed, and
    no external novelty is claimed; signed/unsigned comparison bugs as a
    general C phenomenon are recalled, not retrieved.
  sota_delta: >-
    No attack; mechanism/measurement contribution only. Quantitatively:
    before this record, C-FIN existed in this lane's own taxonomy as a
    name with zero derived content across two records spanning three
    weeks of proposals (2026-08-05 to 2026-08-21); this record supplies
    its first concrete failure shape (a silent value set of size exactly
    2^(n-1), half the accumulator's nonzero range, reachable at ML-KEM's
    own byte-difference scale with no magnitude-overflow or many-block
    argument required), resolves it as ABSENT for the one implementation
    already retrieved in this session by direct derivation rather than
    assumption, and leaves the cross-implementation census as the sole
    remaining open discriminator -- taking the class from "named,
    untested" to "mechanized, one cell closed, census designed."

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
