idea:
  id: IDEA-20260807-e6d79e
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    MONTGOMERY IS AN AFFINE RESKIN OF WEIERSTRASS AND THEREFORE STRICTLY DENSER -
    x_W = (x_M + A/3)/B is affine linear, so S_3^Montgomery equals S_3^Weierstrass
    composed with one affine substitution per variable, giving per-variable degree
    EXACTLY 2 with monomial support rising from 13 of 27 to 27 of 27, plus a
    palindromic coefficient symmetry c(e1,e2,e3) = c(2-e1,2-e2,e3) forced by the
    2-torsion point (0,0) acting on the Kummer line as x -> 1/x
  class: representation

  claim: >-
    (A) THE EXACT ALGEBRAIC RELATION, HAND-COMPUTED. A Montgomery curve
    B y^2 = x^3 + A x^2 + x maps to short Weierstrass v^2 = u^3 + au + b by
      u = (x + A/3)/B,  v = y/B,  a = (3 - A^2)/(3B^2),  b = (2A^3 - 9A)/(27B^3).
    The coordinate change on the FIRST coordinate is AFFINE LINEAR - u = alpha x
    + beta with alpha = 1/B, beta = A/(3B). It is not merely birational, it is
    degree 1 with no pole in the affine line and it fixes the point at infinity.
    Consequently, up to a nonzero scalar,
      S_3^Mont(x_1,x_2,x_3) = S_3^W(alpha x_1 + beta, alpha x_2 + beta,
                                    alpha x_3 + beta).
    This is not an analogy; it is a substitution, and it is checkable in one line
    of sympy against harness/semaev.py's s3_expr.

    (B) THE DEGREE PREDICTION - EXACT, NOT DIRECTIONAL. An affine substitution is
    a degree-preserving automorphism of the polynomial ring in each variable
    separately. Therefore
      deg_{x_i} S_3^Mont = 2 for i = 1,2,3, total degree 4,
    identically to short Weierstrass, and deg_{x_i} S_m^Mont = 2^(m-2) for all m.
    NO exponent, no constant, no change whatsoever in degree. This is the
    prediction and it is falsifiable by an integer comparison.

    (C) THE SUPPORT PREDICTION, WHICH IS WHERE THE MODELS ACTUALLY DIFFER AND
    WHICH IS PREDICTED TO FAVOUR WEIERSTRASS. Expanding s3_expr by hand,
      S_3^W = x_3^2 (x_1^2 - 2x_1x_2 + x_2^2)
              - 2 x_3 (x_1^2 x_2 + x_1 x_2^2 + a x_1 + a x_2 + 2b)
              + (x_1^2 x_2^2 - 2a x_1 x_2 + a^2 - 4b x_1 - 4b x_2),
    whose monomials are, block by block: {x1^2x3^2, x1x2x3^2, x2^2x3^2} (3),
    {x1^2x2x3, x1x2^2x3, x1x3, x2x3, x3} (5), {x1^2x2^2, x1x2, 1, x1, x2} (5).
    The three blocks have distinct degrees in x_3 so nothing cancels across them:
    SUPPORT = 13 monomials out of the 27 with multidegree at most (2,2,2),
    for any a, b both nonzero. Under x_i -> alpha x_i + beta with beta != 0 the
    substitution is generically dense-making, so
      SUPPORT(S_3^Mont) = 27 whenever A != 0, and = 13 exactly when A = 0.
    A = 0 means B y^2 = x^3 + x, which is j = 1728 - so the only Montgomery
    curves whose summation polynomial is as sparse as Weierstrass's are the
    CM-by-i curves, and DECOMPOSITION.md T4 says you cannot walk to those.

    (D) THE HIDDEN SYMMETRY THAT SURVIVES DENSIFICATION. On a Montgomery curve
    the point T = (0,0) is 2-torsion and translation by it is
      (x, y) + (0,0) = (1/x, -y/x^2),
    verified directly: B y^2/x^4 = (1 + Ax + x^2)/x^3 iff B y^2 = x + Ax^2 + x^3,
    which is the curve equation. So on the Kummer line the rational 2-torsion
    point acts as the involution x -> 1/x. Since replacing P_i by P_i + T for an
    EVEN number of indices leaves the sum P_1 + P_2 + P_3 unchanged, S_3^Mont
    satisfies, up to the clearing factor x_i^2 x_j^2,
      S_3(1/x_1, 1/x_2, x_3) * x_1^2 x_2^2  =  c * S_3(x_1, x_2, x_3)
    and the two other pairings. In coefficients: the array is invariant under
    flipping any EVEN number of exponents by e -> 2 - e. That halves the number
    of INDEPENDENT coefficients from 27 to about 14 - 15 without reducing the
    support at all.

    (E) THE TWO OUTCOMES AND WHAT EACH MEANS, SO THIS IS NOT A FISHING TRIP.
      OUTCOME 1 - measured degrees tie at 2 and Montgomery support is 27 with the
        palindromic relation holding. Then the model is confirmed to be an affine
        reskin, Montgomery is strictly worse for any support-aware solver (BKK,
        sparse resultants - KN-TECH-007), and the corpus gains an exact statement
        that the FASTEST model for scalar multiplication is the WORST model for
        algebraic decomposition. That inversion is the deliverable.
      OUTCOME 2 - measured Montgomery support is materially below 27 on a curve
        with A != 0. Then the affine substitution is producing unexpected
        cancellation, my hand expansion of the Weierstrass support is wrong, or
        the elimination is not returning the reduced polynomial. All three are
        instrument-level findings that must be resolved before any other L11
        number is believed.
      There is no outcome in which the measurement means nothing.

  resource_label: >-
    R2 (curve equation and model). No R1 beyond reading coordinates as field
    elements.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE BUT WITH A PRE-STATED CEILING. R2 escapes the generic-group
    closure of KN-FIND-b7e091 because the object changed is the coefficient ring
    of a polynomial system, which a group-label simulator cannot produce.
    However this proposal's own content is that the escape buys nothing in
    degree, and the ceiling is IDEA-20260807-dadcd2's rational-deck-group law:
    Montgomery x and Weierstrass x have the same deck group {+-1} and the same
    rational part, so g = 2 for both and the Bezout numbers are identical at
    fixed factor-base size. Filing it anyway is the point - a recorded exact tie
    with a named mechanism is a deliverable under the brief.

  discriminated_from:
    - >-
      IDEA-20260807-dadcd2, which proves the DEGREE tie for all models at once.
      This record adds the exact substitution that realises it for Montgomery,
      the hand-computed support counts, and the reciprocal coefficient symmetry -
      none of which follow from the deck-group law.
    - >-
      EV-REP-001 / EV-REP-002 / KN-FIND-023, which compared Weierstrass against
      twisted EDWARDS. Montgomery was never in those arms. The claim that
      Montgomery is affinely conjugate to Weierstrass, and hence strictly denser,
      appears nowhere in the ledger.
    - >-
      KN-LIT-004 (Faugere-Gaudry-Huot-Renault), which exploits the 2-torsion
      symmetry on Edwards and Jacobi-intersection curves. Mechanism (D) here is
      the SAME symmetry seen in the Montgomery coordinate, where it appears as a
      palindromic coefficient relation rather than as sparsity. Identifying that
      the two presentations are Moebius-conjugate involutions is the delta, and
      it is small - this record is honest that it is a re-coordinatisation of
      known structure.
    - >-
      KN-TECH-034, which mentions Montgomery-ladder arithmetic in a twist-security
      context. Unrelated - that is about which curve a computation lands on, not
      about summation polynomial support.

  object_first_candidate:
    tracked_object: >-
      THE MONOMIAL SUPPORT of the arity-3 summation polynomial, as a subset of
      the 27-element exponent box {0,1,2}^3, tracked as the coordinate is
      Moebius-transformed. Not the polynomial, not the degree - the SET.
    established_families_off_limits: >-
      Off-limits as the primary lens for this session: Semaev index calculus as
      an algorithm to tune, rho, BSGS, Weil descent, pairing transfer, lattice
      methods, isogeny walks. The object here is a finite subset of an exponent
      box.
    lossiness: >-
      LOSSY AND COMPATIBLY SO - the lossy-projection test, applied algebraically
      and for free. The support forgets every coefficient value and retains only
      which exponent vectors occur. It is not a change of coordinates because the
      fibre over a given support is a positive-dimensional family of polynomials.
      The retained part propagates under the operation that matters here -
      per-variable Moebius substitution - by an explicit rule: an AFFINE
      substitution with nonzero shift can only grow the support downward-closed
      in each exponent, an affine substitution with zero shift preserves it
      exactly, and the inversion x -> 1/x reflects it by e -> 2 - e. So one-step
      propagation is defined and measurable, which is the testability axis.
    propagation: >-
      Support(f o mu) is contained in the downward closure of Support(f) under
      the exponent order for affine mu, with equality generically; under the
      Klein-four action generated by e -> 2 - e and parity the support is either
      preserved or reflected. Deterministic in both cases.
    survival_score: >-
      Survives affine and Moebius reparametrisation as a well-defined tracked
      quantity; dies as a MEANINGFUL quantity the moment the polynomial is not
      reduced, because spurious square factors add monomials that carry no
      geometry. That is why squarefree reduction is a gate, not a step.

  mechanism: >-
    STEP 1 - VERIFY THE MAP. Build a toy Montgomery curve B y^2 = x^3 + Ax^2 + x
    over a 16-bit prime, convert to short Weierstrass by the formulas in (A),
    and check on 200 random points that (x, y) -> ((x + A/3)/B, y/B) lands on the
    Weierstrass curve and commutes with addition. Independent on-curve check in
    both models via harness/toycurve.py. This is a gate: a failure here stops
    everything.
    STEP 2 - THE SUBSTITUTION IDENTITY. Symbolically substitute
    x_i -> (x_i + A/3)/B into harness/semaev.py's s3_expr(a, b) with a, b from
    (A), clear denominators, and check that the result is a scalar multiple of an
    independently derived Montgomery S_3 obtained by eliminating y_1, y_2 from the
    Montgomery addition law. If the two disagree the Montgomery S_3 derivation is
    wrong and must be fixed before any count is reported.
    STEP 3 - COUNT. Read off per-variable degrees (predicted 2, 2, 2), total
    degree (predicted 4), and the support size (predicted 27 for A != 0, 13 for
    A = 0). Report the explicit support set, not just its size.
    STEP 4 - THE PALINDROME TEST. Check the coefficient identity of (D)
    symbolically for all three pairings. This is a strong instrument check
    because it must hold EXACTLY over F_p, with no tolerance.
    STEP 5 - THE COST CONSEQUENCE. Compute the BKK mixed volume (KN-TECH-007) of
    the Montgomery and Weierstrass arity-3 decomposition systems on the same
    curve with the same factor base, and the Bezout number of each. Predicted:
    identical Bezout, Montgomery mixed volume >= Weierstrass mixed volume, with
    the gap being the entire measurable content of the model change.
    STEP 6 - THE NULL. Run the whole pipeline with the random-Moebius null of
    IDEA-20260807-4fc635 in place of the Montgomery map. If a random Moebius map
    produces the same support size and the same mixed-volume gap, then nothing
    observed is a Montgomery property - it is a "any nontrivial reparametrisation
    densifies" property, and must be reported that way.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over /home/user/crypto-autoresearcher/ledger and /knowledge for
      "Montgomery" (2026-08-07). Full reads of KN-TECH-002, KN-TECH-007,
      KN-TECH-034, KN-LIT-004, KN-FIND-023, ledger/EV-REP-001.yaml,
      ledger/EV-REP-002.yaml, ledger/H-REP-001.yaml, harness/semaev.py.
      Web search for summation polynomials across curve forms.
    results: >-
      "Montgomery" in knowledge/ resolves almost entirely to Montgomery
      MULTIPLICATION (KN-LIT-1346, KN-LIT-2474, KN-LIT-2506) or to Montgomery
      curves in an isogeny/arithmetic context (KN-LIT-4950, KN-LIT-6116,
      KN-LIT-2831, KN-LIT-751), never to summation polynomials. KN-TECH-034
      mentions the Montgomery ladder only for twist security. ZERO records in
      ledger/ or knowledge/ state the affine-conjugacy of Montgomery and
      Weierstrass x-coordinates or count monomial support. EXTERNALLY, Cheng,
      Kodera and Miyaji, "Differences among Summation Polynomials over Various
      Forms of Elliptic Curves", IEICE Trans. Fundamentals E102-A(9) 1061-1071,
      2019, doi 10.1587/transfun.E102.A.1061, compares Montgomery among other
      forms; I have read only its abstract, so whether it already reports these
      exact support counts is UNKNOWN and is Stage-0 work.
    verdict: adaptation

  null_object_control: >-
    MANDATORY. The matched null is a RANDOM AFFINE substitution x_i -> alpha x_i
    + beta with alpha, beta drawn uniformly (alpha nonzero), applied to the
    Weierstrass s3_expr on the SAME curve. It has the same shape as the
    Montgomery map - same degree, same variable count, same absence of poles -
    and it should produce support 27 and no palindromic relation. DECAY
    PARAMETER: the shift beta. As beta -> 0 the support must decay back to 13; a
    support that does NOT return to 13 at beta = 0 means the elimination or the
    reduction is broken, which is the canonical artifact tell. The palindromic
    relation must FAIL for the random null and HOLD for Montgomery - that
    contrast is the only thing in this record that is Montgomery-specific.

  assumptions:
    - >-
      p > 3 and B, A well defined with B invertible and A/3 meaningful, i.e.
      3 invertible mod p. harness/toycurve.py already enforces p > 3.
    - >-
      The Montgomery curve is non-singular, i.e. A^2 != 4.
    - >-
      a and b of the image Weierstrass curve are both nonzero, otherwise the
      13-monomial count changes and the baseline shifts. This must be checked per
      instance and reported, not assumed.
    - >-
      Elimination returns the REDUCED summation polynomial. Non-reduced output
      invalidates every support count.

  proof_search_map:
    bottleneck: >-
      Step 2, the substitution identity. If S_3^Mont is not a scalar multiple of
      the substituted S_3^W, then either the birational map or one of the two
      summation polynomials is wrong, and no count downstream means anything.
    baseline_embedding:
      parameter_slice: >-
        A = 0, B = 1 - the curve y^2 = x^3 + x, where the substitution degenerates
        to the identity up to scaling and Montgomery must reproduce Weierstrass
        exactly, support 13.
      reproduction_check: >-
        Exact polynomial equality (not just degree equality) between S_3^Mont at
        A = 0, B = 1 and s3_expr(1, 0) up to a scalar, checked symbolically.
    observation_collision:
      observable: The pair (per-variable degree, support size).
      distinct_preimage_search: >-
        Expected to succeed and required to be run: the random-affine null and
        Montgomery with A != 0 should BOTH give (2, 27). That collision is the
        point - it establishes that support 27 is a property of "shifted affine
        reparametrisation" and not of "Montgomery", and it bounds what the
        measurement may be used to say.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "the Montgomery summation polynomial" by "the Weierstrass
          summation polynomial plus an element of the affine group", so that the
          model question becomes a question about a group action on a 27-cell
          exponent box.
        predicted_gain: >-
          Removes Montgomery from the lane's search space entirely at zero
          compute, and does so with an exact identity rather than a measurement.
    quantifier_order: >-
      CLAIMED - FORALL non-singular Montgomery curves over F_p (p > 3) and
      FORALL m >= 3, deg_{x_i} S_m^Mont = 2^(m-2) = deg_{x_i} S_m^W, and EXISTS a
      scalar c with S_m^Mont = c * (S_m^W after the affine substitution).
      NOT CLAIMED - anything about support for m > 3, where I have not done the
      expansion, and where the record marks the count [open].
    method_ceiling:
      strongest_certifiable_claim: >-
        "The Montgomery model changes no degree and increases the support of the
        arity-3 summation polynomial from 13 to 27 whenever A != 0." It can never
        certify a statement about measured solving degree or about m > 3 support.
      nearby_object_control: >-
        The Montgomery curve with A = 0, on which the desired conclusion (support
        grows) FAILS by construction. Any pipeline that reports 27 there is
        measuring an artifact.
    proof_obligations:
      - claim: The affine map (A) is correct and commutes with addition.
        responsibility: correctness
      - claim: S_3^Mont equals c times substituted S_3^W.
        responsibility: correctness
      - claim: The Weierstrass support is exactly 13 for a, b nonzero.
        responsibility: baseline
      - claim: Translation by (0,0) is x -> 1/x.
        responsibility: correctness
      - claim: The support count for m > 3 is not asserted.
        responsibility: scope

  predictions:
    - metric: per-variable degree of reduced S_3^Mont
      direction: different
      minimum_effect: EXACTLY 2 in each variable; zero tolerance.
    - metric: monomial support size of reduced S_3^Mont for A != 0
      direction: higher
      minimum_effect: >-
        EXACTLY 27 versus 13 for Weierstrass on the same curve. Anything strictly
        between 14 and 26 is an unexpected observation and must be recorded, not
        rounded (AGENTS.md rule 8).
    - metric: monomial support size of reduced S_3^Mont for A = 0
      direction: different
      minimum_effect: EXACTLY 13, matching Weierstrass. This is the degenerate control.
    - metric: >-
        BKK mixed volume of the arity-3 decomposition system, Montgomery versus
        Weierstrass, same curve same factor base
      direction: higher
      minimum_effect: >-
        Montgomery at least as large; a strict increase of at least 1 is the
        interesting outcome and would quantify the cost of the reskin in the
        currency KN-FIND-2a8b7e already uses.
    - metric: palindromic coefficient identity of (D)
      direction: different
      minimum_effect: >-
        Holds EXACTLY for Montgomery on all three pairings and FAILS for the
        random-affine null. A pipeline where it holds for both is broken.

  minimal_test:
    design: >-
      One sympy script, well under an hour of compute. STAGE A - build the toy
      Montgomery curve, verify the birational map on 200 points (gate). STAGE B -
      substitute into s3_expr and check the identity against an independently
      eliminated Montgomery S_3 (gate). STAGE C - count degrees and support for
      A != 0 and for A = 0. STAGE D - test the palindrome identity. STAGE E - run
      the random-affine null and the beta -> 0 decay. STAGE F - compute Bezout and
      mixed volume for both arms.
    controls:
      - random-affine null with decay parameter beta -> 0
      - the A = 0 degenerate curve, where the effect must vanish
      - >-
        an independently derived Montgomery S_3 (by eliminating y from the
        Montgomery addition law), so the substitution identity is a check and not
        a definition
      - random-Moebius null per IDEA-20260807-4fc635
    required_metrics:
      - per-variable and total degree, both models
      - explicit monomial support set and its size, both models, both A regimes
      - pass/fail of the palindrome identity per pairing
      - Bezout number and BKK mixed volume, both models
      - number of random-null draws and the support distribution over them

  falsification_conditions:
    - >-
      S_3^Mont is not a scalar multiple of the substituted S_3^W. The central
      claim (A) is false; supersede.
    - >-
      Per-variable degree of S_3^Mont differs from 2. Falsifies (B) and, with it,
      IDEA-20260807-dadcd2's (L1) at the same stroke.
    - >-
      Montgomery support at A != 0 is materially below 27. Falsifies (C).
    - >-
      Weierstrass support is not 13 for a, b nonzero. My hand expansion is wrong
      and every support count in the lane must be recomputed.
    - >-
      The palindrome identity fails for Montgomery. Then translation by (0,0) is
      not x -> 1/x as computed, and (D) is wrong.
    - >-
      The random-affine null also satisfies the palindrome identity. Instrument
      fault; nothing is reported.

  confounders:
    - >-
      NON-REDUCED ELIMINATION. Resultant-based elimination introduces square
      factors that add spurious monomials and would inflate BOTH supports. Every
      count is taken after a squarefree reduction whose correctness is checked on
      the Weierstrass baseline.
    - >-
      SMALL-FIELD COINCIDENCES. At 16 bits, a coefficient can vanish mod p by
      accident, shrinking the support for reasons that have nothing to do with the
      model. Repeat over at least 5 primes and report the support distribution,
      not one number.
    - >-
      Montgomery curves have a rational point of order 4, so any curve in this
      experiment has cofactor at least 4 and is NOT a cryptographic curve. Every
      conclusion is scoped to Montgomery-admitting curves.
    - >-
      Mixed-volume computation is itself nontrivial; the KN-TECH-007 caveat that
      mixed volume equals Bezout for Newton-saturated systems applies, and a
      saturated Montgomery polytope would make Step 5 report a null difference
      for a reason unrelated to the model.

  interpretation_limits:
    - >-
      ASYMPTOTIC CEILING, AS THE BRIEF REQUIRES. This record claims NO exponent
      change and explicitly asserts the opposite - the degree is EXACTLY
      unchanged at 2^(m-2), because the substitution is affine and affine
      substitutions preserve degree. Diem's and Gaudry's asymptotics are
      model-agnostic and nothing here touches them. The only claimed change is a
      SUPPORT count at m = 3, i.e. a constant-factor / small-m effect, and it
      points the WRONG way for Montgomery.
    - >-
      Support is not solving degree. A denser polynomial is not automatically
      slower to solve; the connection runs through BKK (KN-TECH-007) and is
      itself a proxy.
    - >-
      m > 3 support is [open] and is not asserted anywhere in this record.
    - >-
      Toy scale only; claim_tier toy (AGENTS.md rule 7).

  reachability_gate: >-
    TRIVIAL AND EXPLICITLY SO. The reachability gate T5 concerns moving between
    CURVES in an isogeny class at cost about p^(1/4). Nothing here moves between
    curves. Converting a Weierstrass curve to its Montgomery model is an affine
    change of variable costing two field inversions, available with probability 1
    for any curve that has a Montgomery model at all. The existence condition -
    a rational point of order 4, equivalently 4 | #E(F_p) - is an arithmetic
    property of the curve and not a search cost; it is either present for free or
    absent at any price. So the gate is passed vacuously and the lane's finding is
    attributable to representation alone.

  target_complexity:
    time_exponent: >-
      NO CHANGE, AND THE RECORD PREDICTS A SMALL LOSS. Degree unchanged at
      2^(m-2); Bezout number unchanged at B^(m-1)/2; the only predicted movement
      is an INCREASE in mixed volume, i.e. Montgomery is at best equal and
      plausibly worse for support-aware solvers. Best-known exponents are
      untouched.
    memory_exponent: >-
      Unchanged. A denser polynomial marginally increases the Macaulay matrix
      density but not its dimension, since dimension is set by degree and
      variable count (KN-TECH-011).
    best_known: >-
      Parallel rho at 0.886 sqrt(N) group operations and O(1) memory
      (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)/sqrt(N) (KN-TECH-031);
      automorphism-discounted rho on CM curves (KN-TECH-018); Semaev index
      calculus at exp(c sqrt(log N log log N)) (KN-FIND-f8c290) with the BKK
      constant of KN-FIND-c7d31e.
    hidden_overhead: >-
      None hidden - there is no o(1) here because there is no asymptotic claim.
      The honest overhead disclosure is the opposite direction: a 27-monomial
      polynomial costs more per evaluation than a 13-monomial one, and that
      constant is the entire measured content.
    tradeoff_note: Not applicable; no algorithm is produced.
  dominated_by: >-
    AS AN ATTACK - mounts none and predicts a regression, so it is dominated on
    every axis by every frontier row, checked: rho (0.886 sqrt(N) time, O(1)
    memory, 0 queries) KN-TECH-001/KN-TECH-006; automorphism-discounted rho
    KN-TECH-018; BSGS (sqrt(N) time, sqrt(N) memory) KN-TECH-031; Semaev index
    calculus KN-FIND-f8c290 with BKK constants KN-FIND-2a8b7e/KN-FIND-c7d31e.
    AS A MODEL FOR DECOMPOSITION - dominated by short Weierstrass on support (27
    versus 13) and tied on degree and Bezout. There is no axis on which
    Montgomery is predicted to win.
  sota_delta: >-
    Zero speedup, and a predicted negative delta: support 27 versus 13 is a
    2.08x increase in the number of terms of S_3, with mixed volume predicted
    equal or larger and Bezout exactly equal (B^2/2 in both). Against the BKK
    constant already banked by KN-FIND-c7d31e (speedup (m+1)/2, i.e. 2.0x at
    m = 3), this record predicts Montgomery gives back part of that gain rather
    than adding to it. Quantified change to any attack exponent: 0.000.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    0.95 that the affine identity in (A)-(B) verifies - it is a substitution, not
    a conjecture. 0.75 that the Weierstrass support is exactly 13 as hand-counted
    (the risk is my arithmetic, not the mathematics). 0.7 that Montgomery support
    is exactly 27 rather than 25 or 26 through some cancellation I have not seen.
    Priority is LOW despite the high confidence precisely BECAUSE the confidence
    is high: the expected information gain is small, the result is a predicted
    regression, and its main value is as a calibration arm for
    IDEA-20260807-78eafe and IDEA-20260807-4fc635 rather than as a finding.

