idea:
  id: IDEA-20260815-ee8f82
  question_id: RQ-SSIQ-9702af
  added: '2026-08-15'
  title: >-
    THE SMOOTHNESS HEURISTIC WAS VALIDATED AT TWO PRIMES AND ITS TAIL IS
    WHERE THE ALGORITHM LIVES: resample Heuristic 1 concentrating entirely
    on the smooth tail rather than the bulk CDF
  class: measurement

  claim: >-
    Heuristic 1 asserts the minimal isogeny degree is B-smooth with
    probability u^(-u(1+o(1))). The published validation compares empirical
    CDFs at two primes with 100000 and 10000 samples and checks two tail
    points. The algorithm's cost is driven by 1/P0, i.e. entirely by the
    extreme smooth tail, and a bulk-CDF match is weak evidence about a tail
    that determines the exponent. This record resamples with the design
    inverted: importance-sample toward smooth degrees and estimate the tail
    directly.

  mechanism: >-
    Use the Deuring correspondence sampling route as published. Replace
    uniform sampling with an importance-sampling scheme weighted toward
    small largest-prime-factor, with the weights recorded so the estimator
    remains unbiased. Estimate the tail probability at several u values and
    compare against rho(u).

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of the frozen paper section 4.2 validation design; grep for
      'importance sampling', 'tail estimate', 'Dickman'.
    results: >-
      The published validation and this program's assessment both use
      uniform sampling with bulk CDF comparison. No record importance-
      samples the tail.
    verdict: >-
      UNVERIFIED. Importance sampling is standard; applying it to this
      heuristic's tail is what is absent.

  object_first_candidate:
    tracked_object: >-
      THE SMOOTH TAIL of the minimal-degree distribution, rather than its
      bulk.
    lossiness: >-
      A bulk CDF projects away the tail, which is precisely the exponent-
      carrying part.
    propagation: >-
      Not applicable.
    survival_score: >-
      Survives while the Deuring sampling route is implementable and the
      importance weights are computable.

  null_object_control: >-
    NULL 1 -- uniform sampling reproducing the published bulk CDF,
    confirming the pipeline matches the published one before any tail claim.
    NULL 2 -- random integers of matched size, whose tail must follow
    Dickman exactly, validating the tail estimator itself. NULL 3 -- the two
    published tail consistency points, which must be recovered.

  discriminated_from:
    - >-
        The published validation. NOT A CONTRADICTION: it validates the
        bulk; this estimates the tail, which the bulk does not determine.
    - >-
        GOAL-P13-001's assessment, which is closed at budget and assessed
        the result as published rather than resampling it.

  assumptions:
    - >-
        The Deuring sampling route is implementable at the published prime
        sizes within budget.
    - >-
        Importance weights are computable and the estimator provably
        unbiased; an unbiased-looking but wrong weighting would
        manufacture a tail result.

  predictions:
    - metric: >-
        uniform-sampling reproduction of the published bulk CDF
      direction: different
      minimum_effect: >-
        FORCED to match; failure means the pipeline differs from the
        published one.
    - metric: >-
        random-integer tail against Dickman
      direction: different
      minimum_effect: >-
        FORCED to match; validates the tail estimator.
    - metric: >-
        estimated tail probability versus rho(u) at several u
      direction: different
      minimum_effect: >-
        The measurement. A tail materially below rho(u) would mean 1/P0
        is larger than assumed and the concrete costs are optimistic.

  minimal_test:
    design: >-
      Reproduce the smaller published prime's bulk CDF first, then
      importance-sample its tail. One prime, both nulls.
    controls:
      - >-
          Uniform reproduction of the published CDF.
      - >-
          Random-integer Dickman validation.
      - >-
          Recovery of the two published tail points.
      - >-
          Unbiasedness proof for the weights, recorded.
    required_metrics:
      - >-
          Tail probability estimates with confidence intervals at
          several u.
      - >-
          Bulk CDF reproduction agreement.
      - >-
          Estimator validation on random integers.

  falsification_conditions:
    - >-
        Bulk CDF not reproduced. Pipeline differs; no tail claim
        admissible.
    - >-
        Random-integer tail deviates from Dickman. Estimator wrong.
    - >-
        Tail matches rho(u). Heuristic 1 is supported where it matters,
        strengthening the published result.
    - >-
        Tail falls materially below rho(u). The published concrete costs
        are optimistic, which is a scoped finding needing independent
        review.

  confounders:
    - >-
        WEIGHTING BIAS: importance sampling with mis-specified weights
        produces a confidently wrong tail, and the unbiasedness proof is
        the only defence.
    - >-
        SAMPLING-ROUTE FIDELITY: the Deuring route is a proxy for direct
        computation and its own assumptions transfer into the estimate.

  interpretation_limits:
    - >-
        Estimates a distribution tail; establishes no attack and no
        exponent.
    - >-
        Scoped to the tested prime and sampling route.
    - >-
        A deviation would bear on the published concrete-cost table, not
        on the asymptotic theorem.

  heuristic_assumptions:
    - id: HEUR-SSIQ-TAIL-1
      statement: >-
        The minimal isogeny degree behaves, in its smooth tail, like a
        uniform random integer of the same size.
      rigorous_support: >-
        This is Heuristic 1 of the source restricted to the tail. Its
        rigorous ingredient is the Aubry-Oyono-Vincent size bound; its
        classical ingredient is Canfield-Erdos-Pomerance. THE GAP, which
        is the record's whole subject: both ingredients constrain the
        bulk, and the composition's tail behaviour is asserted rather
        than derived.
      falsification_condition: >-
        Tail probability differing from rho(u) beyond the estimator's
        confidence interval.
      validation_plan: >-
        SAMPLE: importance-weighted, targeting >= 1000 effective samples
        in the tail region rather than a fixed raw count. COMPARISON:
        estimate against rho(u) at >= 4 values of u. TAIL CHECK: the
        smoothest observed degrees against their predicted frequencies.
        TRANSFER ASSUMPTION: that one prime's tail behaviour transfers
        to others; stated and unjustified.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is the published sampling route plus
      factorisation per sample.
    memory_exponent: >-
      Negligible per sample.
    best_known: >-
      The incumbent is the published section 4.2 validation, which this
      record extends into the tail rather than replaces.
    hidden_overhead: >-
      Reaching enough effective tail samples may cost far more than the
      published uniform campaign despite the importance weighting.
    tradeoff_note: >-
      Importance sampling buys tail resolution and costs estimator
      complexity and a new bias risk.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    frontier row applies. As a validation: the published one covers the bulk
    more cheaply; neither dominates since they target different regions. As
    statistics: standard importance sampling, dominated by the
    methodological literature. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a direct tail estimate for
    the heuristic that drives 1/P0, where the published evidence is a bulk
    CDF plus two tail points, with an estimator validated against Dickman on
    random integers.

  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.5 that the Deuring sampling route is implementable here within budget,
    which is the dominant risk. 0.85 that the estimator validates on random
    integers. 0.75 that the tail matches rho(u), supporting the published
    result. 0.15 that a material deviation appears, which would need
    independent review before any use.

  status: proposed
  proposed_by: claude-code-session
