    the McGuire-Mueller abstract, so the honest label is unverified.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      F_2[Y] arithmetic with bit-packed integers, modular squaring, gcd and
      distinct-degree factorisation at degree <= 2401 -- a few hundred lines
      of Python, or reuse of any GF(2) polynomial library present; the
      brute-force cross-check at degree 2^22 is the same code on bigger
