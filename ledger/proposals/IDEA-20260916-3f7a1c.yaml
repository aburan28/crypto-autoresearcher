  assumptions:
    - >-
      lambda has coefficients in F_2. This is the shape RQ-QSP-f9bbdb's item
      (i) declares. The K-coefficient generalisation is stated and proved with
      coefficient twists in IDEA-20260916-5c9d6e; nothing in THIS record's
      certificate computation is used outside F_2[X] except the per-orbit
      field arithmetic in F_{2^131}.
    - >-
      131 is prime, so every element of F_{2^131} outside F_2 has minimal
      polynomial of degree 131 and the roots of an F_2-polynomial in
      F_{2^131} come in Frobenius orbits of size 1 or 131. Used only to make
      the certificate compact (one test per orbit); the count is exact either
      way.
    - >-
      OFF-LIMITS COMPONENT DECLARED: family F2 (factor-base decomposition) is
      the algorithm whose factor base is being priced; no decomposition system
      is solved in this record. The Frobenius-orbit column of the table is used
      as a component of the row arithmetic and is RQ-FROB-7d8dd4's; it is not
      the idea.

  proof_search_map:
    bottleneck: >-
      The cost of deciding N_K(L) at n' = 33: RQ-QSP-f9bbdb prices it as a
      GF(2)[x] computation of degree 2^33 (a 1 GiB polynomial per operand, a
      half-gcd at that size, hours and >10 GB). (A) replaces it by a degree
      d^4 <= 2401 computation. The removal of that bottleneck is the whole
      content; the answer it yields (N <= 2401) is what changes the theorem.
    baseline_embedding:
      parameter_slice: >-
        Lemma 4.1 of KN-LIT-0a321c is obtained from the same first line
        (X^{2^{n' k}} = lambda^{o k}(X) mod L) by comparing degrees of
        G(X) = lambda^{o q}(X^{2^r}) + X with deg L, i.e. WITHOUT the
        substitution y = x^{2^r}. The two bounds are incomparable: Lemma 4.1
        gives q l + r >= n' for complete splitting, (A) gives (q+1) l >= n';
        (A) is stronger when l < r (our cells: r = n' - 1) and weaker when
        l > r. Their conjunction q l + min(l, r) >= n' is the combined
        constraint. Tightness slices: Theorem 1's equality case
        X^{p^2} + X^p + X over F_{p^3} (n = 3, n' = 2, d = p, q = 1, r = 1:
        bound max(p, p^2) = p^2 = N, attained) and Type 2 at n = 7, n' = 3,
        lambda = X^2 + X (q = 2, r = 1: bound max(4, 8) = 8 = N, attained).
        Vacuity slice: r = 0 (n' | n), where the bound is max(2^{n'}, d^{q+1})
        >= deg L and says nothing, as it must, since subfield polynomials
        split completely with d = 1.
      reproduction_check: >-
        Symbolic, zero compute: evaluate (A) on the three slices above and on
        Type 1 at (n, n', d) = (15, 7, 8) (bound max(2^6, 512) >= 128,
        consistent with Lemma 4.3's complete splitting) and Type 1bis
        (n' = n - 1, d = 2^{n-2}: bound 2^{2n-4} >= 2^{n-1}, consistent).
        Plus one exhaustive numerical fixture: n = 11, n' = 6 (q = 1, r = 5),
        every lambda in F_2[X] of degree 2..7 (252 polynomials), N computed by
        brute gcd at degree 64 and by the H-based count; they must agree
        exactly and satisfy N <= max(2, d^2).
    observation_collision:
      observable: >-
        The integer N_K(L) per candidate, delivered as an explicit root list.
      distinct_preimage_search: >-
        Two different lambda with the same N (typically N in {0, 1, 2}) are
        expected and harmless: the observable is a count, and the conclusion
        (N <= 2401 << 2^32) needs no identifiability. The dangerous collision
        is the opposite one: a lambda for which H has many F_{2^131}-roots
        that FAIL the closing test x^{2^32} = y. Those y are roots of H that
        are not images of roots of L; they are counted and reported separately
        as the 'slack' of the injection, because a large slack at small n
        would indicate the bound is far from tight there and would calibrate
        how much (A) overcounts.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the count from F_2[X]/(L) (degree 2^33) to F_2[Y]/(H) (degree
          d^4) through y = x^{2^r}. Encoding: the two identities
          x^{2^n} = lambda^{o q}(y) and y^{2^{n'-r}} = lambda(x).
          Completeness: every F_{2^n}-root of L maps to a root of H.
          Soundness: the closing test x^{2^r} = y, applied per candidate root,
          recovers exactly the roots of L. Transfer: to K-coefficients with
          twists (IDEA-20260916-5c9d6e); FAILS for r = 0 (subfields), where
          the reduction is a tautology. Cost loss: none; the reduction
          removes a factor 2^33 / d^4 >= 2^21 from the census cost.
        predicted_gain: >-
          Item (i) of RQ-QSP-f9bbdb decided in minutes instead of hours-with-
          impediments, and decided for every d up to 2^{33/4} ~ 305 rather
          than d <= 7.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (N_K(L)) fixed at 2^{n'} and vary the forgotten
          structure (n mod n'): the fibre of complete splitting over the
          shape X^{2^{n'}} + lambda contains subfields (r = 0) and nothing with
          small d at r >= 1; the intrinsic invariant separating them is
          n' - r, the exponent of the first term of the bound.
        predicted_gain: >-
          Names the load-bearing structure -- divisibility n' | n -- rather
          than the linearized/non-linearized dichotomy the question was posed
          in.
    quantifier_order: >-
      FORALL n, n' with n' not dividing n, FORALL lambda in F_2[X] of degree
      d >= 2 with d^{q+1} != 2^{n'-r}: N_{F_{2^n}}(X^{2^{n'}} + lambda) <=
      max(2^{n'-r}, d^{q+1}). The witness (the polynomial H) depends only on
      (lambda, n, n'), never on an instance or a seed; the weaker reading
      'for each lambda there exists some bound' is not what is claimed. For
      the census the claim specialises to EXISTS-free arithmetic: each of the
      <= 248 candidates gets its own certified integer.
    method_ceiling:
      strongest_certifiable_claim: >-
        'For every lambda in F_2[X] with 3 <= deg lambda <= 7, the polynomial
        X^{2^33} + lambda(X) has exactly N_lambda roots in F_{2^131}, listed
        here, with N_lambda <= 2401.' It cannot certify anything about
        coefficient sets it did not enumerate (K-coefficients are covered by
        the bound, not by a list), nothing about n' | n, and nothing about
        factor bases that are not root sets of a single X^{2^{n'}} - lambda.
      nearby_object_control: >-
        Two, both blocking. (i) PROVES-TOO-MUCH: run the identical pipeline
        at a cell where complete splitting is a theorem -- Type 2 at
        (n, n', lambda) = (7, 3, X^2 + X) and (31, 15, X^{2^7} + X^{2^3} +
        X^2 + X) [n = 31 prime, the closest analogue of the card's n = 127
        control at executable size], and the subfield (12, 6, X). The
        pipeline must return 8, 2^15 and 64. A pipeline that returns a small
        count there is wrong, not the theorem. (ii) NULL OBJECT: 100 random
        lambda in F_{2^131}[X] of degree 3 and of degree 7 at n' = 33, whose
        counts the twisted bound also caps at d^4; the empirical distribution
        of N is compared with the random-polynomial prediction (about 2 roots,
        orbit count Poisson(1/131)). If the structured F_2 candidates and the
        random null have the same distribution, the census is a controlled
        null, which is the expected and reportable outcome.
    proof_obligations:
      - claim: lambda(z)^{2^k} = lambda(z^{2^k}) for lambda in F_2[X].
        responsibility: correctness
      - claim: >-
          x^{2^{kn'}} = lambda^{o k}(x) for every root x of L and every k >= 1.
        responsibility: correctness
      - claim: >-
          x in F_{2^n} implies x = lambda^{o q}(x^{2^r}) and
          (x^{2^r})^{2^{n'-r}} = lambda^{o(q+1)}(x^{2^r}).
        responsibility: correctness
      - claim: >-
          H = Y^{2^{n'-r}} + lambda^{o(q+1)}(Y) is nonzero when d^{q+1} !=
          2^{n'-r}, and then N_K(L) <= deg H.
        responsibility: size
      - claim: >-
          The per-orbit closing test x^{2^r} = y and L(x) = 0 recovers exactly
          the roots of L, so the certificate count is exact, not a bound.
        responsibility: correctness
      - claim: >-
          The H-based count equals the brute-force deg gcd(X^{2^n} - X, L) at
          every cell where both are computed.
        responsibility: baseline
      - claim: >-
          Total cost of the census is under one CPU-hour and under 1 GB.
        responsibility: runtime
      - claim: >-
          The pipeline returns the known complete-splitting counts on the
          proves-too-much objects.
        responsibility: scope

  predictions:
    - metric: >-
        N_K(L) for every lambda in F_2[X], 3 <= deg lambda <= 7,
        non-linearized, at n = 131, n' = 33 (exact, certified)
      direction: lower
      minimum_effect: >-
