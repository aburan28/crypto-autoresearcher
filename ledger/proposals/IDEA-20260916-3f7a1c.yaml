    - metric: >-
        agreement of the H-based count with the brute-force
        deg gcd(X^{2^131} - X, L) at n' = 11 (all 248 candidates) and n' = 22
        (all 248 candidates)
      direction: different
      minimum_effect: >-
        EXACT EQUALITY on every candidate. A single disagreement invalidates
        the instrument until localised.
    - metric: >-
        the 'attempts' column of table.md row (33, 3, 4, 131) recomputed with
        the certified |F|
      direction: higher
      minimum_effect: >-
        from 29.6 to >= 90.6 (d = 7) or >= 110 (d = 3); the row's total
        exceeds 2^112 under every solver model, against rho's 2^60.9. This is
        arithmetic on the certified count, reported with the count.
    - metric: >-
        counts on the proves-too-much objects (Type 2 at n = 7 and n = 31,
        subfield at n = 12)
      direction: different
      minimum_effect: >-
        FORCED 8, 32768, 64. Anything else is an instrument failure.
    - metric: >-
        slack of the injection: number of F_{2^131}-roots of H that fail the
        closing test, per candidate
      direction: different
      minimum_effect: >-
        Reported, not predicted. A slack comparable to d^4 means the bound is
        loose by that factor; a slack near 0 means it is nearly tight. Either
        is informative for IDEA-20260916-5c9d6e's tightness discussion.

  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE, HARD GATE. Re-derive (A) by hand, including the
      identity lambda(z)^{2^k} = lambda(z^{2^k}), and check it at n = 4,
      n' = 3 (q = 1, r = 1) on lambda = X^2 + X + 1 and lambda = X^3 + 1 by
      listing the 16 field elements. If the hand check fails, stop and report.
      STAGE 1 - EXHAUSTIVE TOY FIXTURE, SECONDS. n = 11, n' = 6: for all 252
      lambda in F_2[X] of degree 2..7, compute N by brute gcd (degree 64) and
      by the H-based orbit test; require exact agreement and N <=
      max(2, d^2). Repeat at n = 13, n' = 7 and n = 23, n' = 12 (r = n' - 1
      cells) and at n = 12, n' = 6 with lambda = X (r = 0, must give 64).
      STAGE 2 - THE CENSUS, MINUTES. n = 131, n' = 33: for every candidate
      lambda (degree 3..7, non-linearized, <= 248), compute H, the gcd with
      Y^{2^131} - Y over F_2 (131 modular squarings at degree <= 2401), its
      factorisation, and the per-orbit closing test; emit the root list, N,
      and the slack. Then the same at n' = 44 and n' = 66 (H of degree d^3
      and d^2).
      STAGE 3 - BRUTE-FORCE CROSS-CHECK AT n = 131, MINUTES. At n' = 11 and
      n' = 22 (deg L = 2^11, 2^22) compute deg gcd(X^{2^131} - X, L) directly
      for all 248 candidates (131 squarings modulo a sparse L, then a gcd of
      degree <= 2^22) and compare with the H-based counts. OPTIONAL, DECLARED
      IMPEDIMENT-PRONE: one brute computation at n' = 33 for a single lambda
      using a half-gcd library at degree 2^33 (estimated hours, > 10 GB);
      run only if the machine has the memory, and never as a substitute for
      Stage 3.
      STAGE 4 - CONTROLS. Proves-too-much objects (Type 2 at n = 7 and 31,
      subfield at n = 12) through the identical pipeline; null object (100
      random lambda in F_{2^131}[X] at d = 3 and d = 7, n' = 33) with the
      twisted H of IDEA-20260916-5c9d6e; linearized control (d = 2 and 4,
      n' = 33), where Proposition 2 predicts no splitting and the pipeline's
      count must be consistent with it.
      STAGE 5 - REPORT. Per-candidate certificate files, the recomputed
      table row, the slack distribution, the control outcomes, and the exact
      scope closed: 'lambda in F_2[X], 3 <= deg lambda <= 7, n' in {33, 44,
      66}, n = 131'. Everything outside that scope is stated as covered by
      the bound of IDEA-20260916-5c9d6e or as open.
    controls:
      - >-
        BRUTE-FORCE CROSS-CHECK (blocking): H-based count equals the direct
        gcd count at every cell where the direct count is affordable.
      - >-
        PROVES-TOO-MUCH (blocking): known complete-splitting objects return
        their full count.
      - >-
        NULL OBJECT: random K-coefficient lambda of the same degree; if the
        structured F_2 candidates match the null's count distribution, the
        result is a controlled null.
      - >-
        LINEARIZED CONTROL: d in {2, 4} at n' = 33, decided independently by
        Proposition 2 of KN-LIT-4fe9d2; the pipeline must agree.
      - >-
        DEGENERATE-CANDIDATE ARM: lambda that are squares (lambda = mu^2, so
        L = (X^{2^32} + mu)^2) are reported separately with the n' = 32
        reduction noted; they are not averaged in.
    required_metrics:
      - 'per-candidate N_K(L), root list, slack, wall time, peak RSS'
      - 'agreement matrix H-based vs brute-force at n'' in {11, 22} and at toy n'
      - 'control outcomes (proves-too-much counts, null distribution, linearized arm)'
      - 'recomputed attempts and total for table.md rows (33, d, 4, {1, 131})'

  falsification_conditions:
    - >-
      Stage 0 hand check fails: (A) is false; record withdrawn and
      superseded, not patched.
    - >-
      Any candidate at any cell has N_K(L) > max(2^{n'-r}, d^{q+1}): (A) is
      false.
    - >-
      H-based and brute-force counts disagree at a cell where both ran: the
      instrument is invalid until the disagreement is localised by hand.
    - >-
      A proves-too-much object returns less than its known count: the
      pipeline is wrong, and no census number may be cited until fixed.
    - >-
      Some candidate at n' = 33 has N_K(L) >= 2^32: item (i) is answered
      POSITIVELY, (A) is false, and the solver-cost cell (33, d, 4) becomes
      the ranked experiment exactly as RQ-QSP-f9bbdb's decision target (a)
      says.

  confounders:
    - >-
      IMPLEMENTATION OF F_2[Y] ARITHMETIC. A bug in modular squaring or gcd
      would silently give N = 0 everywhere; Stage 1's exhaustive toy fixture
      and Stage 4's proves-too-much objects exist to catch exactly that.
    - >-
      THE CLOSING TEST. Counting roots of H without the closing test
      x^{2^r} = y overcounts (it counts the slack). The certificate must
      record which y passed, not just deg gcd.
    - >-
      SQUARE lambda. If lambda = mu^2 then L is a square and its distinct root
      set is that of X^{2^{n'-1}} + mu; the count is exact but the shape is
      really n' - 1. Reported separately.
    - >-
      DEGREE CONVENTION FOR d. Theorem 3.2's cost uses d = deg lambda; a
      lambda with zero constant term and a linear term has the same d; no
      issue, but the bound uses deg, not sparsity, and a sparse large-degree
      lambda is NOT covered by the d <= 7 census -- it is covered by the bound
      only up to d < 2^{33/4}.

  interpretation_limits:
    - >-
      A MEASUREMENT of a factor-base size. No attack, no exponent, and no
      statement about any deployed curve. A negative census closes exactly
      'lambda in F_2[X], 3 <= deg lambda <= 7, n' in {33, 44, 66}, n = 131'
      by certificate, and 'every lambda in F_{2^131}[X] of degree
      d < 2^{33/4} at n' = 33' by the bound of IDEA-20260916-5c9d6e, which
      is a derivation until reviewed.
    - >-
      The bound is vacuous when n' | n; for n = 131 that is only n' in
      {1, 131}. It says nothing about factor bases that are not root sets of
      a single polynomial X^{2^{n'}} - lambda(X); the successor shape is
      IDEA-20260916-a17f43.
    - >-
      KN-OPEN-020 class: implicit-membership; this record prices the
      membership fibre and does not engage the universal statement.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Null-object prediction, used only for the control.) For lambda drawn
        uniformly from polynomials of degree d over F_2 (or over F_{2^131}),
        the number of Frobenius orbits of F_{2^131}-roots of L is
        approximately Poisson with mean 1/131, and the number of roots in F_2
        is Binomial(2, 1/2), so N_K(L) is about 2 on average and exceeds 133
        with probability below 10^{-4}.
      rigorous_support: >-
        Rigorous ingredient: the bound of (A), N_K(L) <= d^{q+1} for r =
        n' - 1, holds for EVERY lambda, random or structured, so the null and
        the structured arm live under the same ceiling. Classical statement
        imitated: the expected number of irreducible factors of degree k of a
        random polynomial of degree >= k over F_q is about 1/k (recalled;
        provenance recalled, supports nothing beyond the design of the
        control).
      validation_plan: >-
        SAMPLE - 100 random lambda at each of d = 3 and d = 7, n' = 33,
        n = 131, coefficients in F_2 and separately in F_{2^131}. COMPARISON -
        empirical histogram of N against the Poisson(1/131)-orbit model.
        TAIL CHECK - the maximum N observed across 400 draws against the
        model's extreme-value prediction (P(any orbit) ~ 400/131 ~ 3
        draws with one orbit expected; a draw with two orbits has
        probability ~ 400 * (1/131)^2 / 2 ~ 0.01). SAMPLED PARAMETERS
        RECORDED - d, coefficient field, seed. TRANSFER - none; the control is
        used only at the cells where it was run.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The measurement costs
      O(248 * (d^4)^2 * 131) bit operations at n' = 33 -- under a minute in
      Python with bit-packed integers -- against the 2^33-scale half-gcd the
      question budgeted. Its effect on the QSP line is to remove the last row
      of the cost surface that was not already dominated by rho.
    memory_exponent: >-
      Kilobytes at n' = 33 (polynomials of degree <= 2401); megabytes for the
      brute-force cross-check at n' = 22 (2^22-bit operands). The optional
      degree-2^33 brute computation is > 10 GB and is declared optional.
    best_known: >-
      For the census: the direct deg gcd(X^{2^131} - X, L) at degree 2^33,
      O(M(2^33) log 2^33) bit operations with half-gcd, roughly 2^45 --
      hours and > 10 GB. For the ECDLP on ECC2K-130: rho at 2^60.9
      (KN-LIT-096), unaffected.
    hidden_overhead: >-
      None in the computation. The scientific overhead is that completeness of
      the certificate rests on derivation (A); Stage 3 turns that dependence
      into a cross-checked one at n' <= 22, and the optional Stage 3 brute
      run at n' = 33 would remove it entirely for one candidate.
    tradeoff_note: >-
      Not applicable. The census is embarrassingly parallel over candidates.

  dominated_by: >-
    CHECKED ROW BY ROW. As an ECDLP result: n/a (no attack claimed); every
    row of analysis/qsp-ecc2k130/table.md is already dominated by rho's
    2^60.9 on time, and the rows this record touches become void rather than
    cheaper; the SEMBIN/DREG Weil-descent rows and the ICPERF boundary table
    are untouched. As a CENSUS INSTRUMENT: dominates the degree-2^33 gcd
    design of RQ-QSP-f9bbdb on time (2^45 -> 2^30 bit operations) and memory
    (> 10 GB -> KB) and on reach (d <= 305 instead of d <= 7), and is
    dominated by it only on independence from the derivation (A), which
    Stage 3 repairs at n' <= 22.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against the program's prior state: the
    open item (i) of RQ-QSP-f9bbdb goes from 'a 2^33-scale computation whose
    outcome is unknown' to 'decided by a three-line bound with a minutes-long
    certificate, predicted negative with N <= 2401 against the 2^32 needed';
    the table row (33, 3, 4, 131) moves from attempts 29.6 to >= 110. Against
    the external literature: unverified; neither frozen paper makes the
    y = x^{2^r} substitution, and the web search this session found no
