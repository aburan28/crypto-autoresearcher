idea:
  id: IDEA-20260916-3f7a1c
  question_id: RQ-QSP-f9bbdb
  added: '2026-09-16'
  proposed_by: idea-generator
  session: TASK-20260916-a93a2a
  status: proposed
  title: >-
    THE EXISTENCE CENSUS AT (n' = 33, deg lambda <= 7) DOES NOT NEED A
    DEGREE-2^33 GCD: for lambda in F_2[X] the F_{2^131}-roots of
    X^{2^33} + lambda(X) inject, via x -> x^{2^32}, into the roots of the
    degree-d^4 polynomial H(Y) = Y^2 + lambda^{o4}(Y), so every one of the
    <= 248 candidates has at most 2401 roots, and the exact count per candidate
    is a seconds-long certificate (list every F_{2^131}-root explicitly) with a
    brute-force cross-check at n' in {11, 22} where the degree-2^{n'} gcd is
    cheap
  class: measurement

  claim: >-
    (A) THE REDUCTION, STATED IN FULL BECAUSE IT IS THREE LINES. Let
    lambda in F_2[X], d = deg lambda >= 2, L = X^{2^{n'}} + lambda(X), and
    write n = q n' + r with 0 <= r < n'. If x in the algebraic closure
    satisfies L(x) = 0 then x^{2^{n'}} = lambda(x), hence (because lambda has
    F_2 coefficients, so lambda(z)^{2^k} = lambda(z^{2^k}))
    x^{2^{k n'}} = lambda^{o k}(x) for every k >= 1, and
    x^{2^n} = (x^{2^{q n'}})^{2^r} = lambda^{o q}(x)^{2^r} = lambda^{o q}(x^{2^r}).
    Put y := x^{2^r}. Then x lies in F_{2^n} iff x = lambda^{o q}(y), and in
    that case L(x) = 0 reads y^{2^{n'-r}} = x^{2^{n'}} = lambda(x) =
    lambda^{o(q+1)}(y). The map x -> x^{2^r} is injective on the closure, so
        N_K(L) := #{x in F_{2^n} : L(x) = 0}
                <= #{y : H(y) = 0} <= deg H = max(2^{n'-r}, d^{q+1}),
    with H(Y) := Y^{2^{n'-r}} + lambda^{o(q+1)}(Y), provided H is not the zero
    polynomial (which needs d^{q+1} = 2^{n'-r}, impossible for d not a power
    of 2).
    (B) THE NUMBER AT THE CELL THE QUESTION ASKS ABOUT. n = 131, n' = 33 gives
    q = 3, r = 32, n' - r = 1, so H(Y) = Y^2 + lambda^{o4}(Y) has degree d^4
    and N_K(L) <= d^4 <= 2401 for every lambda of degree 3..7 -- against the
    2^32 the row (n' = 33, d = 3, m = 4) of analysis/qsp-ecc2k130/table.md
    needs. The same holds at n' = 66 (q = 1, r = 65: N <= d^2 <= 49), n' = 44
    (q = 2, r = 43: N <= d^3 <= 343) and n' = 22 (q = 5: N <= d^6). The
    Lemma 4.1 'best case' 131 = -1 mod n' is the WORST case for this bound,
    because n' - r = 1 kills the first term entirely; Lemma 4.1 and (A) are
    complementary, not nested (Lemma 4.1 is strong when r is small, (A) when
    r is large; see proof_search_map.baseline_embedding).
    (C) THE CERTIFICATE THIS MAKES POSSIBLE. For each candidate lambda the
    exact value of N_K(L) is computed WITHOUT touching a polynomial of degree
    2^33: compute lambda^{o3} (degree <= 343) and H (degree <= 2401) over F_2;
    compute gcd(H, Y^{2^131} - Y) in F_2[Y] by 131 squarings modulo H; factor
    the gcd (its irreducible factors have degree 1 or 131, because 131 is
    prime); for one representative y of each degree-131 factor, build
    F_{2^131} = F_2[Y]/(that factor), set x = lambda^{o3}(y) and test the two
    identities x^{2^32} = y and L(x) = 0 (33 squarings plus a degree-d
    evaluation); the roots of L in F_{2^131} are exactly the y-orbits that
    pass, so N_K(L) = 131 * (#passing orbits) + (#passing roots in F_2). The
    certificate is the explicit list of all F_{2^131}-roots of L, each
    re-verifiable in 33 squarings by anyone; completeness of the list rests on
    (A), and (A) is itself cross-checked against a brute-force
    deg gcd(X^{2^131} - X, L) at n' in {11, 22}, where L has degree <= 2^22
    and the brute computation is seconds.
    (D) WHAT EACH OUTCOME MEANS. Outcome 1 (predicted): every candidate returns
    N_K(L) <= d^4, the brute-force spot checks agree with the H-based counts
    exactly, and item (i) of RQ-QSP-f9bbdb closes for the F_2-coefficient
    shape at n' in {33, 44, 66} with a certified count per candidate; the row
    (33, d, 4) is void (see predictions). Outcome 2: some candidate has more
    than d^4 roots -- (A) is false, this record is withdrawn, and the original
    degree-2^33 gcd design is reinstated. Outcome 3: an H-based count and a
    brute-force count disagree at n' in {11, 22} -- an implementation error or
    a derivation error, localised by hand at n = 11, n' = 6 where everything
    is enumerable.

  mechanism: >-
    OBJECT FRAME, DECLARED HONESTLY. Representation: the x-coordinate of a
    point in the polynomial basis of F_{2^131} (R1 class of RQ-ECDLP-623a32),
    viewed together with its Frobenius shift y = x^{2^r}. Operation set
    Sigma = {sigma^{n'} : x -> x^{2^{n'}}, the substitution x -> lambda(x)},
    which is exactly the pair of operations the chain S^{(k)} = phi(S^{(k-1)})
    of KN-LIT-0a321c Section 3.1 is built from. Attack stage whose charged
    cost changes: FACTOR-BASE MEMBERSHIP (the size of F = {(x, y) : x in V}).
    Trichotomy class: index calculus is Class I partial-action; the object
    priced here is not the relation vector but the factor base's
    K-RATIONAL FIBRE, which is a coordinate-dependent quantity (Class III):
    it depends on the field representation through the Frobenius, not on the
    group element.
    LOSSY-PROJECTION TEST, RUN AGAINST SIGMA. The quasi-subfield algorithm's
    tracked object is the residue class of the summation polynomial modulo the
    ideal (X_i^{2^{n'}} - lambda(X_i)); this is the projection
    K[X]/(X^{2^n} - X) -> K[X]/(L) that DISCARDS every root of the field
    polynomial outside V. The discard is Sigma-compatible: f^{2^{n'}} =
    phi(f) mod L is the paper's own identity, so sigma^{n'} acts on the
    quotient as phi and the object propagates deterministically. It is
    genuinely lossy. What (A) shows is that the projection loses TOO MUCH of
    K: the K-rational part of the quotient has at most d^{q+1} + 2^{n'-r}
    points, so the retained object cannot carry a factor base of size 2^{n'}
    unless n' | n or d is large. The map x -> x^{2^r} used in the proof is a
    bijection on the closure and is NOT claimed as a new object; the record's
    content is a measurement of the membership fibre, and it says so.
    KN-OPEN-020 CLASS: implicit-membership description (V is the root set of
    L, membership is one evaluation of L). This record prices that class's
    membership fibre at n = 131 and finds it empty at cryptographic size.
    WHY THE TABLE ROW CHANGES AND BY HOW MUCH. table.md row (n' = 33, d = 3,
    m = 4, orbits 131) assumes |F| ~ 2^33 and charges 2^29.6 attempts. With
    |F| <= 2401 the success probability per attempt is
    |F|^m / (m! 2^131) <= 2401^4 / (24 * 2^131) = 2^{-90.6}, so the attempts
    column becomes >= 90.6 (>= 110 at d = 3), the relation phase exceeds
    2^{112} even at the paper's own M(E) = 2^{21.5}, and the factor base is
    too small for any linear-algebra phase to be meaningful. The row is void,
    not merely expensive.

  novelty_status: unverified

