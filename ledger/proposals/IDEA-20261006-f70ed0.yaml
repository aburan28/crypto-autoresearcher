idea:
  id: IDEA-20261006-f70ed0
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Base-field hits of Frobenius-chord slopes on y^2 = x^3 + x + 3 over
    F_{53^2}, against a matched random-chord sample
  class: control
  claim: >-
    On E: y^2 = x^3 + x + 3 over F_53, let S be the affine points of
    E(F_{53^2}) whose x-coordinate is not in F_53 and whose chord to the
    coordinate 53-power is not vertical. Let B_frob be the number of P in
    S whose chord slope lies in F_53. Let B_rand be the number of slopes
    that lie in F_53 among the first |S| non-vertical ordered pairs of
    distinct affine points in lexicographic order. The claim is
    B_frob >= B_rand + floor(|S|/10). The representation is R1. The
    discrete-log time exponent stays 1/2 and the delta versus Pollard rho
    is 0.
  mechanism: >-
    Two explanations are distinguished before any count is seen.
    Explanation A: a Frobenius chord slope on a subfield curve is an
    element of F_{q^2} with no extra reason to land in F_q, so the hit
    counts stay within floor(|S|/10). Explanation B: the endomorphism
    forces those slopes into F_q often enough that the hit count beats
    the frozen random chords by at least that margin. The claim is
    explanation B. OBJECT FRAME. Representation: the slope in F_{53^2}.
    Operation set Sigma: the coordinate 53-power on both points of the
    chord. Sigma is not translation. The counted object is membership of
    the slope in F_53, not the cardinality of the set of slope values and
    not the x-coordinate of a third intersection. F1 and F3-F7 are not
    used.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        Frobenius-invariant factor bases reduce the number of systems by
        up to 1/n and speed linear algebra by n^2. This proposal does not
        build a factor base.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: >-
        Gaudry's fixed-n cost is Õ(q^{2-2/n}). No smaller exponent is
        claimed here.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        Walking on Frobenius classes gives a sqrt(2m) rho speedup on
        binary Koblitz curves. This proposal does not walk classes.
      verified_by: coordinator design session, 2026-10-06, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
  assumptions:
    - The modulus of F_{53^2} is the least monic quadratic over F_53 with no root, recorded before the counts.
    - A random scan that ends before |S| non-vertical slopes voids the run.
    - "|S| under 30 voids the run."
  proof_search_map:
    bottleneck: not_applicable
    constructive_transforms: []
    proof_obligations: []
    not_applicable_reason: >-
      Hit-count control on one toy curve. It does not certify an exponent.
  predictions:
    - metric: base-field hit count of Frobenius-chord slopes minus the matched random hit count
      direction: higher
      minimum_effect: "B_frob >= B_rand + floor(|S|/10)"
  minimal_test:
    design: >-
      Confirm the discriminant of y^2 = x^3 + x + 3 is nonzero in F_53.
      Enumerate affine points of E(F_{53^2}). Drop vertical Frobenius
      chords. Count B_frob and B_rand as in the claim. Toy scope is n=2
      and q=53 only.
    controls:
      - On 20 points of S, the two inverses used for the slope agree.
      - A second implementation of addition agrees on 20 sums.
      - The fraction of vertical pairs dropped while filling the random sample is at most one tenth.
      - "|S| is at least 30 and the random sample has length |S|."
    required_metrics:
      - "|S| (integer)"
      - B_frob (integer)
      - B_rand (integer)
      - "floor(|S|/10) (integer)"
  falsification_conditions:
    - B_frob < B_rand + floor(|S|/10) after the instrument checks pass and |S| >= 30.
    - The random scan ends early.
    - Any of the 20 dual-slope checks fails.
    - "|S| is under 30."
  confounders:
    - A modulus that splits makes the extension the wrong degree. The recorded polynomial is checked for roots before the count.
    - Points with y = 0 are kept and their count is reported. They do not choose the row.
  interpretation_limits:
    - Toy scope only. A hit surplus here does not move Gaudry's exponent.
    - The discrete-log time exponent stays 1/2 and the delta versus Pollard rho is 0.
    - This count is membership in F_53. It is not an image cardinality and it is not a third-intersection count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A uniform slope in F_{53^2} lands in F_53 with probability 1/53.
        Explanation B says the Frobenius chord exceeds that hit rate by
        at least one tenth of |S| relative to the frozen random chords.
        The uniform figure is the model being imitated. The surplus is
        unproved.
      rigorous_support: >-
        F_53 is a 1/53-fraction of F_{53^2}. KR-IC-b0fcda gives an n-fold
        symmetry of a factor base, not a slope-membership count.
      validation_plan: >-
        The minimal test is the measurement. Tail check: split S into the
        first and second half of the frozen order and require both halves
        to have a base-field hit rate within 0.05 of B_frob/|S|. A larger
        split does not choose the row.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "0 in the group order; one pass stores two integers"
    best_known: >-
      Pollard rho at exponent 1/2, with a sqrt(n) class speedup on
      Koblitz curves as in KR-RHO-037e22. Gaudry's Õ(q^{2-2/n}) is the
      index-calculus comparison at fixed n and is not claimed to move.
    hidden_overhead: >-
      No o(1) term. The margin floor(|S|/10) is an absolute count on one
      field of 2809 elements.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0. No time-memory tradeoff is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-IC-b0fcda, KR-IC-46d822, KR-IC-5a43e5, KR-IC-f5c584, and
    KR-RHO-037e22. None dominates: b0fcda is an n-fold factor-base
    symmetry, 46d822 is Gaudry's exponent, 5a43e5 is the summation
    polynomial, f5c584 is a characteristic-2 trace morphism, and
    037e22 is a rho class walk. None states a base-field hit surplus of
    floor(|S|/10) for Frobenius-chord slopes on this curve.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus Pollard
    rho is 0. The pre-registered margin is floor(|S|/10) hits, an
    absolute integer on one curve over a field of 2809 elements.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
      - KR-IC-b0fcda
      - KR-IC-46d822
      - KR-IC-5a43e5
      - KR-IC-f5c584
      - KR-IC-fbdb61
    nearest:
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: adjacent
        delta: >-
          That row saves a factor n on factor-base systems. This proposal
          asks for a hit surplus of floor(|S|/10) on one curve over F_53,
          and claims exponent delta 0 versus rho.
      - ref: KR-IC-f5c584
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a morphism onto F_2 in characteristic 2. This
          proposal counts slopes lying in F_53. The exponent delta versus
          that linear equation is 0.
    searched:
      corpus_grep:
        - "Frobenius chord slope in the base field"
      web: []
      blocked:
        - "No web search in this session; novelty stays unverified."
