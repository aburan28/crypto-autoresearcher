idea:
  id: IDEA-20261016-633cb1
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Faithful-target eligibility: odd-order targets have square x, so p = 3 mod 4
    admits only the (+,+) arm and no torsion-shifted lift
  class: mechanism
  claim: >-
    E^: y^2=x(x^2-x+16) over F_p, p in {31,43,59,83,353}; faithful = both targets
    of odd order (where a prime-order DLP lives). (F1) Every odd-order point has
    x^ a nonzero square. (F2) At p = 3 mod 4 a faithful pair is (+,+) only: the
    opposite-sign and (-,-) arms are empty (p=353: both signs open). (F3) A
    relation aP+bQ=tau over Q reducing to a faithful pair in a subgroup of prime
    order l not dividing |E(Q)_tors| has tau=O, so no T-shift lift (Q=P+T) and no
    torsion-term relation is faithful. (F4) Residues force hypothesis (ii) of
    bf8f49: D^=-63 is a non-residue at 31, 59, 83, 353; D square only at p=43;
    B in -Q*^2 only at p=353. (F5) So the opposite-sign lemma (H-XEDN-0ea2b6,
    bf8f49 S1-S2) applies to no faithful target at p = 3 mod 4; there the
    question is the (+,+) one (IDEA-20261016-a16fa4). Not an attack: lifts built from a live
    vector (3049ff) already contain the discrete log.
  mechanism: >-
    PAIR: representation = chi(x^), the descent homomorphism
    alpha^:E^(F_p)->F_p*/F_p*^2 (T^ -> B^=16, a square); operation set = group
    law on the odd-order subgroup. TRICHOTOMY: partial-action (2-isogeny family
    only). LOSSY-PROJECTION TEST: alpha^ maps to an exponent-2 group, so it kills
    odd-order elements and 2E^; it discards the odd part compatibly with the
    group law (lossy, not a coordinate change), and F1 says what it retains
    there is nothing. F4 by Legendre symbols (hand-computed, machine-check).
