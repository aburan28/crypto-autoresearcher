idea:
  id: IDEA-20260816-50d270
  question_id: RQ-HQC-001
  added: '2026-08-16'
  title: Every decoding-failure number this campaign has produced rests on a single implementation
    of the concatenated decoder; build a second implementation from an independent derivation, cross-check
    the two bit-for-bit on a shared corpus, and calibrate the cross-check with seeded mutations whose
    effect size is predicted before injection
  class: tooling
  claim: '(A) THE EXPOSURE. GOAL-HQC-001''s committed evidence chain - EV-HQC-b71230''s 17-cell joint-moment
    table, EV-HQC-469c08''s and EV-HQC-927899''s matched-pair extensions - is extensively certified
    for ARITHMETIC (the validator recomputed values in exact rationals to 3.7e-15 bits) and for REPRODUCIBILITY
    (bit-identical discard prefixes, independently regenerated raw data). Neither of those certifies
    the DECODER SEMANTICS. If the reimplementation of the concatenated decoder shares a systematic
    misreading with every reader who checked it, every number inherits it and no amount of exact-rational
    recomputation would show it. (B) THE CLAIM. Decoder semantics are checkable by differential testing
    against an independently derived second implementation, and the check has a calibratable sensitivity.
    Specifically: two implementations written from the same transcription but by different construction
    routes - a direct correlation-maximising decoder over an explicitly enumerated codeword table,
    and a fast Walsh-Hadamard transform decoder - must agree on every input over a shared corpus,
    and their agreement is only meaningful if seeded mutations of known type are shown to break it.
    (C) THE DERIVED-MAGNITUDE MUTATION CONTROL. For each mutation class, the expected disagreement
    rate is derived BEFORE injection: flipping one bit of a generator row changes the codeword table
    in a computable way; off-by-one in the truncation offset shifts exactly one block boundary; an
    incorrect tie direction affects exactly the tie subpopulation. A mutation whose predicted disagreement
    rate is not observed is as informative as one that is - it says the corpus does not exercise that
    path. (D) WHAT IS NOT CLAIMED. No attack, no break, no security consequence, and no claim that
    the existing implementation is wrong - the expected outcome is agreement, and the deliverable
    is the corpus coverage and the mutation-detection table that make agreement mean something. This
    is not an audit of the program''s cost model, machine variance or timing, which are separately
    owned elsewhere; it is a semantic check on one decoder. No attack, break, speedup or security
    consequence is claimed here or would follow from a run. No statement is made about what the published
    literature does or does not contain; this environment cannot reach external literature. No direction
    is declared impossible.'
  mechanism: 'STAGE 1: derive the mutation catalogue and its predicted effects on paper, before writing
    the second implementation, so the predictions cannot be tuned to what the implementations happen
    to do. Each entry names the mutation, the code path it corrupts, and the predicted disagreement
    rate on the declared corpus, with the derivation. STAGE 2: write the second implementation from
    the transcription by the explicit-codeword-table route, deliberately not consulting the first
    implementation''s source, and record that constraint as a procedural fact of the run rather than
    as a claim about independence, which cannot be fully guaranteed within one session. STAGE 3: build
    the shared corpus - exhaustive over all received words at the smallest block length, random over
    the pipeline''s own distribution at larger ones, plus adversarially chosen near-tie and near-threshold
    inputs - and run both implementations over it, recording every disagreement with its input. STAGE
    4: inject each catalogued mutation into one implementation at a time and measure the disagreement
    rate against the prediction; report predicted versus observed for every mutation class. STAGE
    5: report corpus coverage as the fraction of catalogued mutations detected. Refutation: an undetected
    mutation class is a measured hole in the corpus and must be reported as such rather than smoothed
    over.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran, from /home/user/crypto-autoresearcher: `grep -ril "hqc" --include=*.yaml --include=*.md
      .` (33 proposal files match), then extracted question_id and title for every one of those 33
      with a python3/yaml one-liner; `grep -ril "quasi-cyclic" ledger/proposals/` (8 files), `grep
      -ril "cyclic shift" ledger/proposals/` (7), `grep -ril "Reed-Solomon" ledger/proposals/` (2),
      `grep -ril "outer decoder" ledger/proposals/` (0), `grep -ril "syndrome weight" ledger/proposals/`
      (0), `grep -ril "local exponent" ledger/proposals/` (0), `grep -ril "failure boosting" ledger/proposals/`
      (7), `grep -ril "mutual information" ledger/proposals/` (15), `grep -ril "rejection sampling"
      ledger/proposals/` (19), `grep -ril "weight distribution" ledger/proposals/` (10), `grep -ril
      "SampleFixedWeight" ledger/proposals/` (3), `grep -ril "hypergeometric" ledger/proposals/` (8),
      `grep -ril "autocorrelation" ledger/proposals/` (8), `grep -ril "circulant" ledger/proposals/`
      (14), `grep -ril "Toeplitz" ledger/proposals/` (4), `grep -ril "maximum likelihood decoder"
      ledger/proposals/` (0), `grep -ril "margin distribution" ledger/proposals/` (0), `grep -ril
      "tie-break" ledger/proposals/` (8), `grep -ril "soft information" ledger/proposals/` (1), `grep
      -ril "differential testing" ledger/proposals/` (2). Read in full: ledger/questions/RQ-HQC-001.yaml,
      ledger/goals/GOAL-HQC-001.yaml (first 120 lines incl. batch_checkpoints and campaign_budget),
      the statement head of ledger/hypotheses/H-HQC-18d1b4.yaml, the id/title/objective/status blocks
      of experiments/EXP-HQC-982268, EXP-HQC-bd30c0 and EXP-HQC-50ebe9 specification.yaml, the observations
      blocks of EV-HQC-b71230, EV-HQC-469c08 and EV-HQC-927899, knowledge/open-problems/KN-OPEN-3f7a21.md,
      and docs/inventor-protocol.md sections 1-8. Listed the HQC literature entries by title: KN-LIT-b9e1a8
      (Hamming Quasi-Cyclic spec), KN-LIT-1c9474 (HQC-RMRS), KN-LIT-2141, KN-LIT-4c1133, KN-LIT-5677ae,
      KN-LIT-7565, KN-LIT-de5373. Additionally ran `grep -ril "differential testing" ledger/proposals/`
      (2 files: IDEA-20260809-118d8f, IDEA-20260725-005) and read IDEA-20260809-118d8f''s title, plus
      IDEA-20260805-411b60''s title for the derived-magnitude mutation-control genre, and re-read
      the observations of EV-HQC-927899 and EV-HQC-469c08 for exactly which validity gates the campaign
      already runs.'
    results: 'Two proposals mention differential testing: IDEA-20260809-118d8f is an Ed25519 record
      about a deterministic separating-triple generator between two readings of a verification rule,
      under RQ-EDDSA-9b8473 (a question the blacklist notes already carries 12 proposals), and IDEA-20260725-005
      is older and unrelated to HQC. IDEA-20260805-411b60 (RQ-FRODO-3260cc) is the derived-magnitude
      mutation-control genre applied to a FrodoKEM table entry. The committed HQC validity gates -
      the two-step discard-prefix disjointness proof, the F[:, 0:n_e-1] standing invariant, INV-NULL
      bit-identity, CTRL-ORACLE at 8.88e-16 against a 1e-12 tolerance - are REPRODUCIBILITY and ARITHMETIC
      gates: EV-HQC-927899 records the validator reproducing the executor''s statistics from its own
      freshly-generated raw data with a separate driver, which checks that the same code gives the
      same answer, not that the code implements the right decoder. No committed record reports a second,
      independently derived decoder implementation or a mutation-detection table.'
    verdict: 'UNVERIFIED. No claim is made about published literature or about any external implementation.
      Claimed NEW relative to this repository: a second, independently derived decoder implementation
      for HQC with a predicted-before-injection mutation catalogue and a reported corpus-coverage
      figure. ASSEMBLED FROM KNOWN PARTS: the derived-magnitude mutation-control genre is IDEA-20260805-411b60''s
      and is named rather than silently reused; the separating-certificate framing is IDEA-20260809-118d8f''s,
      applied to a different artefact; the fail-closed-gate discipline and the practice of an independent
      validator driver are the campaign''s own, recorded in EV-HQC-469c08 and EV-HQC-927899, and this
      proposal is explicit that those gates check a different property than the one proposed here.'
  object_first_candidate:
    tracked_object: 'The decoder as a FUNCTION - the map from a received word to a decoded codeword
      and a failure indicator - tracked through the pair of implementations as the disagreement set:
      the subset of the corpus on which the two implementations differ, together with the mutation
      class that produced each disagreement.'
    lossiness: TWO REGIMES, STATED HONESTLY. On the exhaustive corpus at the smallest block length,
      the comparison covers every input, so NOTHING IS DISCARDED - that arm is a complete function
      comparison and, by inventor-protocol section 2, it is a change of coordinates rather than a
      new object; its value is completeness, not novelty of lens. On the larger corpora the projection
      onto the disagreement indicator IS lossy, discarding the decoded values themselves and retaining
      only whether they matched, and the discard is compatible with the purpose because a semantic
      defect that never changes any output is not a defect of the measurement pipeline. The mutation
      catalogue exists precisely because that last sentence is a heuristic that can fail - a defect
      can be latent on this corpus and active on another - and the coverage figure is what bounds
      the failure.
    propagation: 'The target operation is one decode. It acts on the tracked object by either adding
      the input to the disagreement set or not. Under mutation the propagation is predictable: a generator-row
      bit flip changes the codeword table, so the predicted disagreement rate is the probability that
      the received word is closer to a changed codeword than to the original, computable from the
      code''s weight distribution at the small block lengths where the table is enumerable. A truncation
      off-by-one shifts exactly one block boundary and therefore corrupts exactly the blocks adjacent
      to it. Predicting these rates before injection is what turns a differential test into a calibrated
      instrument.'
    survival_score: 'One step, and the meaningful number is coverage rather than depth: the fraction
      of catalogued mutation classes the corpus detects, reported per class with predicted versus
      observed disagreement rates. A coverage of 1.0 means the corpus exercises every path the catalogue
      names; anything less names the specific holes. The secondary number is the smallest mutation
      magnitude detected, which is the analogue of a detection floor and is what makes a clean-agreement
      result quantitative rather than merely reassuring.'
  null_object_control: 'The null object is the UNMUTATED pair, and its required behaviour is exact:
    zero disagreements over the entire corpus. That is a fail-closed gate rather than a statistic.
    The signal object is each mutated pair, which must disagree at its predicted rate. FOR THE INSTRUMENT
    TO MEAN ANYTHING: (i) the unmutated pair must show exactly zero disagreements - a single one means
    the two implementations are not both correct and the differential test has found something before
    the mutation study even begins, which is itself a valuable outcome; (ii) every mutation whose
    predicted rate is above the corpus''s resolution must actually be detected, and each undetected
    one is reported as a named coverage hole rather than folded into an average; (iii) observed disagreement
    rates must match predicted rates within a stated tolerance, since a mutation detected at the wrong
    rate indicates the prediction, the corpus or the implementation is wrong and the run cannot say
    which without investigation. Both arms run in the same invocation over the same corpus.'
  discriminated_from:
  - The committed validity gates of EV-HQC-469c08 and EV-HQC-927899 - discard-prefix disjointness,
    the F[:, 0:n_e-1] invariant, INV-NULL bit-identity, CTRL-ORACLE - check that the same code reproduces
    the same numbers and that the arithmetic is right. This checks whether the code implements the
    intended decoder, which no reproducibility gate can detect, and the proposal says so explicitly
    rather than implying the campaign is uncontrolled.
  - IDEA-20260805-411b60 predicts, before running, how far a FrodoKEM DFR must move when one table
    entry is perturbed. Same genre, different artefact and different scheme; it is named here because
    this proposal borrows its derived-magnitude discipline.
  - IDEA-20260809-118d8f generates a minimal separating certificate between two readings of an Ed25519
    verification rule. That is a specification-ambiguity instrument; this is an implementation-semantics
    instrument, and the corpus here is generated by the pipeline's own distribution rather than searched
    for separators.
  - 'The blacklisted class of proposals auditing this program''s cost model, machine variance or single-machine
    timing is a different object entirely: nothing here measures time, cost or machine behaviour,
    and the deliverable is a mutation-detection table, not a cost audit.'
  - A generic unit-test suite would assert expected outputs written by the same person who wrote the
    code. Differential testing against an independently derived implementation with a predicted-before-injection
    mutation catalogue is what distinguishes a calibrated instrument from a set of assertions.
  assumptions:
  - The transcription committed under GOAL-HQC-001 BATCH-001 is complete enough to write a second
    implementation from; incompleteness is itself a reportable outcome and would be the most valuable
    one.
  - Two implementations written by different construction routes within one session are not fully
    independent, and the run records this limitation explicitly rather than claiming independence
    it cannot demonstrate; the mutation catalogue is what compensates, since a shared misreading would
    still be caught by a mutation that the catalogue predicts and the pair fails to detect.
  - 'Exhaustive corpora are affordable at the smallest block length: RM(1,4) has 2^16 received words,
    trivially enumerable.'
  - Mutation effect sizes are derivable from the code's weight distribution at the enumerable block
    lengths.
  - No conclusion transfers to deployed parameters; the object is an implementation, not a parameter
    set.
  predictions:
  - metric: disagreements between the unmutated implementations over the full corpus
    direction: lower
    minimum_effect: 0.0
  - metric: fraction of catalogued mutation classes detected by the corpus
    direction: higher
    minimum_effect: 0.8
  - metric: absolute relative difference between predicted and observed disagreement rate, per detected
      mutation
    direction: lower
    minimum_effect: 0.2
  - metric: number of coverage holes - catalogued mutations with predicted rate above corpus resolution
      that go undetected
    direction: lower
    minimum_effect: 'no pre-commitment to a count, with reason: the point of the measurement is to
      find them, and pre-committing a number would either be a guess or an invitation to stop looking.'
  minimal_test:
    design: 'The exhaustive arm at the smallest block length discriminates almost everything and costs
      seconds. Take RM(1,4), length 16: enumerate all 2^16 received words, decode each with both implementations,
      and compare decoded codeword and failure indicator exactly. Zero disagreements is required.
      Then inject the three cheapest catalogued mutations one at a time - a generator-row bit flip,
      a reversed tie direction, and an off-by-one in the correlation index - and record the observed
      disagreement rate against the derived prediction for each. This discriminates because at length
      16 the corpus is the whole input space, so a mutation that changes the function at all MUST
      be detected, and any undetected mutation proves the mutation is semantically null rather than
      that the corpus is thin. Cost: seconds of CPU, no storage, and it is the strongest form the
      test can take.'
    controls:
    - Unmutated pair with an exact zero-disagreement requirement over the whole corpus, fail-closed.
    - Mutation catalogue with effect sizes derived before the second implementation is written.
    - Exhaustive corpus at the smallest block length, where undetected mutations are provably semantically
      null.
    - Adversarial corpus slice of near-tie and near-threshold inputs, since those are the paths random
      corpora under-sample.
    - Explicit recording of the limits of implementation independence, so the coverage figure is not
      over-read.
    required_metrics:
    - disagreement count for the unmutated pair, per corpus slice
    - predicted and observed disagreement rate per mutation class
    - 'coverage fraction: detected mutations over catalogued mutations'
    - named list of coverage holes with their predicted rates
    - corpus size and composition per slice
    - smallest detected mutation magnitude
  falsification_conditions:
  - 'The unmutated pair disagrees anywhere: at least one implementation is wrong, and the disagreeing
    inputs are the certificate - the most valuable outcome and the one that would invalidate downstream
    numbers until resolved.'
  - 'Coverage falls below 0.8: the corpus does not exercise the decoder''s paths and the agreement
    result is weak; the named holes are the deliverable.'
  - 'Predicted and observed mutation rates disagree by more than 20 percent: the derivation, the corpus
    or an implementation is wrong and the run must say which is under investigation rather than issuing
    a coverage figure.'
  - 'The transcription proves too incomplete to write a second implementation: that incompleteness
    is reported as the outcome and blocks any claim that the first implementation is validated.'
  - 'All mutations are detected but only on the adversarial slice: the pipeline''s own distribution
    does not exercise the decoder, which is a specific and important hole.'
  confounders:
  - Shared misreading of the transcription by both implementations, which no differential test can
    detect - explicitly acknowledged, and the reason the mutation catalogue rather than the agreement
    is the deliverable.
  - Correlated implementation choices from being written in one session, which weakens independence
    in a way that cannot be quantified from inside the run.
  - Corpus composition dominated by the pipeline's typical inputs, under-sampling the near-tie and
    near-threshold paths where defects live.
  - Mutations that are semantically null - that change source text without changing the function -
    being counted as coverage holes; controlled by the exhaustive arm, where semantic nullity is provable.
  - Floating-point differences between the two decoding routes appearing as semantic disagreements;
    controlled by keeping both in exact integer arithmetic.
  interpretation_limits:
  - Agreement between two implementations written in one session from one transcription is evidence
    about implementation slips, not about whether the transcription itself is faithful.
  - The coverage figure is relative to the mutation catalogue, so it bounds only the defect classes
    the catalogue names.
  - Nothing here measures timing, cost or machine variance, and nothing here bears on the separate
    implementation-attack claim class.
  - A clean result does not validate any downstream number beyond removing one specific failure mode.
  target_complexity:
    time_exponent: No attack exponent is claimed. The exhaustive arm costs O(2^{2^m} ) only at the
      smallest block length where 2^m = 16 gives 65536 inputs; the sampled arms cost O(corpus size
      * 2^m * m).
    memory_exponent: No attack memory exponent is claimed. Storage is the codeword table (2^{m+1}
      words) plus disagreement records, i.e. megabytes.
    best_known: The incumbent controls in this repository are the campaign's own committed validity
      gates - the two-step discard-prefix disjointness proof, the F[:, 0:n_e-1] standing invariant,
      INV-NULL bit-identity passing 17 of 17, and CTRL-ORACLE at maximum difference 8.88e-16 against
      a 1e-12 tolerance. They are strong on reproducibility and arithmetic and silent on decoder semantics,
      which is the specific gap addressed.
    hidden_overhead: 'The genuine cost is human and is invisible in the compute budget: writing a
      second implementation without consulting the first requires discipline that cannot be verified
      from the artefact, and deriving mutation effect sizes before writing it is slow, careful work
      whose whole value evaporates if the derivations are done afterwards. There is also a real risk
      of a false economy - a second implementation that quietly imports a helper from the first is
      worse than no second implementation, because it manufactures confidence.'
  dominated_by: n/a (no result claimed). No attack cost triple exists, so no Pareto frontier row applies
    and 'null' would be a fabrication. On the instrument axis the campaign's committed gates dominate
    on the properties they check - they are executed, certified and cheap - and are silent on this
    one; IDEA-20260805-411b60 occupies the same genre for a different scheme and is unexecuted, so
    neither dominates the other.
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: the campaign holds
    reproducibility gates passing at 17 of 17 cells and bit-identity at 0 of 1,100,000 mismatches,
    and holds NO measurement of decoder-semantic correctness; this run produces a coverage fraction
    over a catalogued mutation set plus a named hole list, which is a different axis rather than a
    better number on the same one.'
  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'By part. (i) That a second implementation can be written from the committed
    transcription at all: ~0.8. (ii) That the unmutated pair agrees exactly - i.e. that no defect
    is found: ~0.8, which means a roughly one-in-five chance of the high-value outcome. (iii) That
    coverage exceeds 0.8 on the catalogue: ~0.7, with the exhaustive arm doing most of the work. (iv)
    That predicted and observed mutation rates match within 20 percent: ~0.5 - deriving effect sizes
    correctly before writing the code is the hardest part and I expect at least one derivation to
    be wrong, which is itself informative. (v) That the run leaves the campaign with a defensible
    statement about decoder semantics rather than an implicit assumption: ~0.85.'
