idea:
  id: IDEA-20260821-e99afd
  research_question: RQ-SSIQ-9702af
  question_id: RQ-SSIQ-9702af
  added: '2026-08-21'
  title: >-
    The exponent is alpha/3. The whole 1/3-versus-lower question collapses onto
    ONE named quantity -- the cost exponent alpha of bounded-degree conjugate
    DETECTION -- which the goal's lever map, its auxiliary-target census and its
    T-sweeps all silently fix at alpha = 1; the identity calibrates on three
    published algorithms, converts "reach 1/4" into the arithmetic target
    alpha <= 3/4, and its two forced exponents (1.5 planted vs 2.0 null) make it
    measurable at toy scale
  class: mechanism

  claim: >-
    STATED FIRST, BECAUSE THE QUESTION'S FIRST CONSTRAINT REQUIRES IT: this
    record claims NO algorithm, NO exponent below 1/3, and nothing whatever
    about whether p^{1/4} over F_{p^2} is reachable. It proposes an identity and
    a measurement.

    THE IDENTITY. Consider the algorithm family A(T, DETECT): re-randomise E to
    a uniform E' by a non-backtracking walk (frozen source, Algorithm 3, line
    202, mixing at n = O(log p) via [37] / [6, Lemma 14]); run DETECT(E', T),
    which returns a separable isogeny E' -> E'^{(p)} of degree at most T when
    one exists and the algorithm's side conditions hold; repeat until success;
    pull the solution back through the walk. Let DETECT cost T^{alpha+o(1)} time
    and T^{mu+o(1)} memory. Then, under Heuristic H1 below (the conjugate-degree
    DENSITY law, which is NOT Heuristic 1 of the frozen source and is stated
    separately here),

        E[time]  =  p^{1/2+o(1)} * T^{alpha - 3/2}          for T <= (p/2)^{1/3}
        E[time]  =  T^{alpha+o(1)}                          for T >= (p/2)^{1/3}

    so for any alpha < 3/2 the minimum sits exactly at the structural boundary
    T* = (p/2)^{1/3} of Theorem 1.5 (frozen source line 81), and

        TIME EXPONENT = alpha/3,   MEMORY EXPONENT = mu/3.

    THREE-POINT CALIBRATION AGAINST PUBLISHED ALGORITHMS, none of which is
    re-derived here and all of which must come out right or the identity is
    void:
      (C-a) DETECT = "is j(E') in F_p?", i.e. T = 1. Cost O(1), density p^{-1/2}
            => total p^{1/2+o(1)}. This is Delfs-Galbraith's complexity as the
            frozen source states it at line 51 ("A memory-free algorithm with
            the same complexity was proposed in [21]"). THE CONTESTED
            Otilde(p^{1/4}) FIGURE OF KN-TECH-058 RC4 IS NOT USED, NOT CITED AS
            REACHABLE, AND IS NOT NEEDED: the F_p locus enters here only as the
            T = 1 degenerate stratum, exactly as this question's scope permits.
      (C-b) DETECT = Algorithm 2 of the frozen source at radius T with
            B-smoothness. Its cost is the table size, |L(E,X,B)| =
            Psi(X,B) X^{1+o(1)} with X = B^{1/2} T^{1/2}, hence B*T*p^{o(1)} =
            T^{1+o(1)}: alpha = 1, mu = 1. The identity returns p^{1/3+o(1)}
            time AND memory, which is Theorem 1.1.
      (C-c) DETECT = classical meet-in-the-middle for the TWO-CURVE Isogeny
            problem, where the guaranteed bound is T = p^{1/2+o(1)} (rank-4
            connecting-ideal lattice, determinant pair-independent -- the value
            IDEA-20260805-e7ee4a derives and calls its census's first row).
            alpha = 1 returns p^{1/2}.
    Three published complexities, one formula, one free parameter.

    THE THREE CONSEQUENCES, WHICH ARE THE POINT.
      (1) WHILE alpha = 1, NO CHOICE OF T MOVES THE EXPONENT. The T-sweep levers
          (IDEA-20260805-250e50's lowered-degree run, IDEA-20260808-71c2b2's
          unpinning of the search radius) are not merely unpromising; the
          identity says their best possible value is p^{1/3} and it says why:
          d(1/2 + c(alpha - 3/2))/dc = alpha - 3/2 < 0 for every alpha < 3/2, so
          the optimum is always the boundary. Those records asked the right
          question; this one supplies the closed form of the answer and the
          numeric target they lacked.
      (2) THE NUMERIC TARGET THIS QUESTION ASKS FOR IS alpha <= 3/4. Not
          "improve F1", not "improve F3": an exponent 1/4 through this family
          requires bounded-degree conjugate detection at cost T^{3/4+o(1)}, and
          any candidate mechanism can now be scored by the single number it
          achieves for alpha. No such mechanism is proposed here and none is
          claimed to exist.
      (3) THE CENSUS AND THE LEVER MAP BOTH ASSUME alpha = 1 AND NEITHER SAYS
          SO. IDEA-20260805-e7ee4a's admissibility criterion log_p(det)/rank
          <= 1/4 screens which TARGET LATTICE could supply a smaller T; it
          imports "one attempt costs T^{1+o(1)}" from IDEA-20260805-250e50 STEP
          2 by citation. That is alpha = 1, unexamined, load-bearing for every
          row of the census. The identity above says the census is screening the
          one factor that provably cannot help while alpha = 1.

    THE MEASUREMENT. alpha and the density exponent are both measurable at toy
    scale with FORCED values that differ between the planted and null arms
    (1.5 for the Frobenius-conjugate target, 2.0 for a random target), so the
    experiment discriminates "the instrument sees target structure" from "the
    instrument sees list growth" -- the failure mode that makes most toy
    measurements in this lane uninformative.

  mechanism: >-
    (A) WHERE THE THREE-HALVES COMES FROM, DERIVED HERE AND OFFERED FOR ATTACK.
    Frozen source Section 4.2 (lines 244-246, read) gives the isometry
    (Hom(E, E^{(p)}), deg) =~ (P, Nrd/p) with P the two-sided ideal of reduced
    norm p. IDEA-20260805-e7ee4a (read in full this session) derives, and
    EV-SSIQ-e43afd is cited there as authority for, the forced trace vanishing:
    every isogeny E -> E^{(p)} of degree below p/4 lies in the RANK-3
    trace-zero sublattice, whose determinant is Theta(p) (the record's committed
    normalisation is p/4). For a positive definite ternary form of determinant
    Delta, the number of vectors of norm at most T is (4 pi/3) T^{3/2}
    Delta^{-1/2} + O(T), so a single curve carries

        #{isogenies E -> E^{(p)} of degree <= T} = Theta(T^{3/2} p^{-1/2}).

    Two independent checks that this normalisation is the right one: it returns
    exactly 1 at T = (p/2)^{1/3}, reproducing Theorem 1.5's threshold as the
    point where a solution first becomes forced; and its total over all ~p/12
    supersingular curves is Theta(p^{1/2} T^{3/2}), which is
    sum_{d<=T} H(4pd) by Deuring/Eichler with H the Hurwitz class number and
    H(4pd) = (pd)^{1/2+o(1)} -- a RIGOROUS first moment, not a heuristic.
    The heuristic content is only that the first moment is tight per curve
    (H1 below).

    (B) THE FAMILY'S COST BOOKKEEPING, IN THE EXEMPLAR'S OWN SHAPE
    (per-attempt cost x inverse success probability, docs/target-result-profile
    A3). Per attempt: T^{alpha+o(1)}. Success probability per attempt:
    Pr[delta_{E'} <= T] * Pr[smoothness side condition] =
    Theta(T^{3/2} p^{-1/2}) * p^{-o(1)}, the second factor being Heuristic 1 of
    the frozen source, inherited unchanged and NOT waived. Product:
    p^{1/2+o(1)} T^{alpha-3/2}. Monotone decreasing in T for alpha < 3/2, so
    T* = (p/2)^{1/3}; above the boundary the density saturates at 1 and the cost
    is T^{alpha}, increasing. Interior optimum at the boundary, total
    p^{alpha/3+o(1)}.

    (C) WHY alpha = 1 FOR EVERY DETECT ANYONE HAS WRITTEN DOWN, AND WHERE THAT
    IS NOT FORCED. Algorithm 1 materialises a list whose cardinality is
    Theta(B T) and spends Theta(1) modular-polynomial root-findings per entry
    (Lemma 3.3), so its cost is the number of objects it names: alpha = 1 is not
    an accident of tuning, it is the statement that the architecture pays once
    per candidate. The list decomposes as
    (#B-smooth degrees <= X) x (#cyclic isogenies per degree) = p^{1/6} x
    p^{1/6}: DEGREE UNCERTAINTY times KERNEL UNCERTAINTY, each contributing
    half the exponent. THE NEARBY OBJECT WHERE alpha < 1 PROVABLY HOLDS is
    T = 1: membership in the stratum {delta = 1} is decided by a
    FIELD-OF-DEFINITION test (j in F_p?) at cost O(1), not by a search. So the
    family already contains one point at which detection is not a search. That
    is not evidence that a p^{Theta(1)} stratum has such a characterisation, and
    this record does not claim one; it is the reason the question is open rather
    than closed, and it names the shape of what would answer it: an ARITHMETIC
    PREDICATE on j deciding delta_E <= T, rather than an enumeration.

