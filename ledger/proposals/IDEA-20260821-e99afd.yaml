  assumptions:
    - >-
      That the rank-3 trace-zero determinant is Theta(p) and not Theta(p^2).
      This single normalisation drives the exponent 3/2 in H1 and hence the
      whole identity: with determinant p^2 the density would be T^{3/2}/p and
      the boundary would be at T = p^{2/3}, contradicting Theorem 1.5. The
      contradiction is itself a consistency check, and it is the reason the
      normalisation is stated as an assumption rather than assumed silently.
    - >-
      That DETECT's cost exponent alpha is well defined, i.e. that the cost is
      T^{alpha+o(1)} with alpha independent of T over the range p^{eps} < T <
      p^{1/3}. A DETECT whose cost is not a clean power of T breaks the closed
      form; the fitted-exponent design in the minimal test would show that as a
      poor fit and must report it rather than reporting a single alpha.
    - >-
      That the walk of Algorithm 3 delivers a curve indistinguishable from
      uniform, so the density law may be applied to E'. This is the frozen
      source's own assumption at line 193; the identity inherits it and does not
      strengthen it. IDEA-20260815-1cc763 owns the spectral-gap question and
      this record does not reopen it.
    - >-
      That the smoothness side condition contributes p^{-o(1)} uniformly over
      T = p^{Theta(1)}. True for the frozen source's parameterisation; a DETECT
      with a different smoothness structure must re-derive it.

  proof_search_map:
    bottleneck: >-
      DETECT(E', T): decide whether the supersingular curve E' admits a
      separable isogeny to E'^{(p)} of degree at most T (and produce it). Every
      exponent in the family is alpha/3 where T^{alpha} is this step's cost. The
      list construction of Algorithm 1 is the only known implementation and it
      costs Theta(BT).
    baseline_embedding:
      parameter_slice: >-
        THREE exact slices, not one. (alpha, mu, T) = (1, 1, (p/2)^{1/3})
        reproduces Theorem 1.1's p^{1/3+o(1)} time and memory. (alpha, T) =
        (0, 1) with the field-of-definition test reproduces Delfs-Galbraith's
        p^{1/2+o(1)} at polynomial memory as the frozen source states it at line
        51. (alpha, T) = (1, p^{1/2}) reproduces classical meet-in-the-middle
        for the two-curve Isogeny problem.
      reproduction_check: >-
        SYMBOLIC, and it is the experiment's stopping gate. Substitute each
        slice into p^{1/2+o(1)} T^{alpha-3/2} and require the published exponent
        to come out exactly. Frozen regression fixture: a ten-line pure-Python
        script evaluating the exponent formula at the three slices and asserting
        1/3, 1/2, 1/2. If any slice misses, NOTHING ELSE IN THIS RECORD IS
        RECORDED.
    observation_collision:
      observable: >-
        The boolean verdict of DETECT together with its witness, as a function
        of (E', T).
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS NAMED HERE RATHER THAN DISCOVERED LATER.
        Smoothness-restricted DETECT returns "fail" both for a curve with
        delta_{E'} > T and for a curve with delta_{E'} <= T whose minimal degree
        is not B-smooth. Two ground-truth objects, one observable, one on each
        side of the density law. CONSEQUENCE, BINDING ON THE EXPERIMENT: the
        density exponent (prediction P2) must be measured against TRUE
        delta_{E'} computed without the smoothness restriction, and the cost
        exponent (P1) against the smoothness-restricted implementation.
        Conflating them measures the product of two exponents and would
        manufacture a spurious alpha. The separating condition is simply to
        compute delta exactly at toy scale by exhaustive small-degree search.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The single scalar alpha, as the image of the whole lever map under the
          reduction "algorithm family -> (density exponent, detection-cost
          exponent)".
        predicted_gain: >-
          No cost gain. The gain is decision-theoretic and quantified: it
          replaces a lever map (L1-L5, N5, A1-A7) whose entries are scored
          qualitatively by ONE number per candidate with an arithmetic target
          (alpha <= 3/4 for exponent 1/4, alpha < 1 for any improvement at all),
          and it retires the entire T-sweep sub-family with a derivation instead
          of a fatigue report.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the PAIR (alpha, mu) rather than time alone, so a candidate that
          trades time for memory is scored on the plane (alpha/3, mu/3) against
          the van Oorschot-Wiener curve time^2 x memory = N^3 rather than
          against the incumbent point alone.
        predicted_gain: >-
          Prevents the standing failure mode in which a memory reduction is
          reported as progress while sitting above the VW curve, and makes the
          admissibility test a single inequality, 2*alpha + mu < 3.
    quantifier_order: >-
      FOR ALL eps > 0, FOR ALL sufficiently large p, FOR ALL supersingular
      E/F_{p^2}, IF there EXISTS an algorithm DETECT such that FOR ALL
      supersingular E' and all T in [p^{eps}, (p/2)^{1/3}] DETECT(E', T) runs in
      time T^{alpha+eps} and returns a conjugate isogeny of degree <= T whenever
      the minimal one is B-smooth, THEN A(T*, DETECT) finds a non-scalar
      endomorphism of E in expected time p^{alpha/3+eps}, ASSUMING H1 and
      Heuristic 1 of the frozen source. The order that matters: DETECT is
      quantified BEFORE the instance, so an alpha achieved by a DETECT that is
      allowed to depend on E, on delta_E, or on a seed does NOT enter the
      identity. This is the trap for any "we guess the degree" proposal: a
      degree oracle specific to the instance is exactly the forbidden
      dependence, and the honest accounting charges the guess.
    method_ceiling:
      strongest_certifiable_claim: >-
        "alpha = 1 for every algorithm that materialises a list of cyclic
        isogenies of bounded degree from E and matches codomains." That is a
        statement about ONE architecture, proved by counting the objects the
        architecture names. It is NOT a lower bound on alpha over all
        algorithms, and this record must never be cited as one. IDEA-20260807-
        edb3f3 owns the covering-certificate question for the list-and-close
        architecture and is the right home for any attempt at a real lower
        bound.
      nearby_object_control: >-
        T = 1, the F_p-rational locus, where DETECT costs O(1) and the identity
        returns Delfs-Galbraith. The hoped-for conclusion "detection at radius T
        must cost Theta(T)" is KNOWN FALSE there. A method-ceiling argument that
        cannot see the difference between T = 1 and T = p^{1/3} has not
        identified the load-bearing structure -- and the difference it must see
        is that {delta = 1} has a field-of-definition characterisation while
        {delta <= T} is, so far as this program knows, only characterised by a
        search.
    proof_obligations:
      - claim: "Density: #{E' : delta_{E'} <= T} / #{all} = Theta(T^{3/2} p^{-1/2}) for 1 <= T <= (p/2)^{1/3}."
        responsibility: size
      - claim: "Per-attempt cost of DETECT is T^{alpha+o(1)} time, T^{mu+o(1)} memory, uniformly in T over p^{eps} < T < p^{1/3}."
        responsibility: runtime
      - claim: "A(T, DETECT) returns a non-scalar endomorphism when DETECT succeeds (pullback through the walk preserves non-scalarity via inseparable degree p)."
        responsibility: correctness
      - claim: "Per-attempt success probability = density x smoothness = Theta(T^{3/2} p^{-1/2}) p^{-o(1)}."
        responsibility: success_probability
      - claim: "The three calibration slices reproduce p^{1/3}, p^{1/2} and p^{1/2} exactly."
        responsibility: baseline
      - claim: "The identity is stated over the algorithm family only and asserts no lower bound on alpha."
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    established_families_off_limits: >-
      DECLARED OFF-LIMITS AS THE PRIMARY LENS FOR THIS RECORD, because this
      target is heavily mined and candidates otherwise regress to variants in
      new notation: (a) meet-in-the-middle / claw finding as an object of study
      (this record treats it only as one VALUE of alpha, never as the thing to
      improve); (b) the auxiliary-target census (IDEA-20260805-e7ee4a,
      IDEA-20260806-e4c719) -- this record does not add a cell to it and does
      not reopen lever L1; (c) subfield descent and the delta_E instrument
      (IDEA-20260805-de1490 and thirteen batches of L4 work) -- the F_p locus
      enters only as the T = 1 calibration point; (d) smoothness and 1/P0, which
      carry no exponent (F4).
    tracked_object: >-
      THE PAIR (density exponent in T, detection-cost exponent in T) attached to
      an algorithm family, followed as T varies. Not the curve, not the isogeny,
      not the list: two exponents.
    one_step_propagation_rule: >-
      Composition is addition in the exponent: doubling T multiplies the density
      by 2^{3/2} and the detection cost by 2^{alpha}; the total cost exponent
      moves by (alpha - 3/2) log 2. The rule is exact bookkeeping, not a
      heuristic, once H1 supplies the density.
    newness_score: >-
      HONESTLY MIXED, AND THE PARTS ARE SEPARATED. The density law is not new to
      the corpus (IDEA-20260808-d8510c is recorded as having matched the FIRST
      MOMENT of B-smooth conjugate isogenies against Heuristic 1 via Eichler
      class numbers H(4np); read in this session only as a one-line prior-art
      summary, not in full, and credited accordingly). The interior optimum at
      T = p^{1/3} is not new (IDEA-20260805-250e50). WHAT IS NEW IS THE
      SEPARATION OF alpha AS A FREE PARAMETER: every prior record varies T at
      alpha = 1 and reports that the optimum does not move; none states that the
      exponent IS alpha/3, none supplies the three-point calibration, and none
      gives the arithmetic target alpha <= 3/4. A parameter that is held fixed
      in every record in a campaign is not a parameter anyone has examined.
    testability_score: >-
      High for both exponents, and they are separately measurable with FORCED
      and DIFFERENT null values (1.5 planted, 2.0 random target). The weak point
      is dynamic range: at log2 p in [20, 40] the usable window for T is narrow
      and the fits will be noisy, which is why the design requires >= 3 primes
      and reports slopes with intervals rather than point values.
    survival_score: >-
      The identity survives any measured value of alpha -- a measurement can
      only fill it in. What can die is its CALIBRATION (if the toy instrument
      does not return alpha = 1 for the incumbent architecture) and H1 (if the
      density exponent is not 3/2). Both deaths are informative and both are
      cheap.

  lossy_projection_test:
    projection: "algorithm family -> (alpha, mu, and the density exponent 3/2)."
    what_is_discarded: >-
      The curve, the isogeny, the kernel, the degree, the smoothness structure,
      the constants, and every implementation detail. Three numbers are
      retained.
    why_genuinely_lossy: >-
      Enormously lossy: infinitely many distinct algorithms share a triple.
      Delfs-Galbraith and a hypothetical arithmetic-predicate algorithm at T = 1
      would be indistinguishable under it.
    why_compatible_with_the_operations: >-
      Because the family's only operations are "spend one attempt" and "change
      T", and both act on the retained triple deterministically: the attempt
      cost is T^{alpha}, the density is T^{3/2}p^{-1/2}, and repetition
      multiplies. Nothing discarded is needed to propagate the retained part
      through those two operations. That is precisely what a legitimate lossy
      projection must satisfy.
    is_it_only_a_change_of_coordinates: >-
      NO. The (Delta, Pi) failure mode -- recovering the original from the
      projection -- does not apply: an algorithm is not reconstructible from
      three exponents. THE MIRROR FAILURE (a projection constant across all
      candidates, hence measuring the apparatus) IS ALSO CHECKED AND DOES NOT
      FIRE: the projection takes value 1/2 at the Delfs-Galbraith slice, 1/3 at
      the Wesolowski slice and 1/2 at the MITM slice, a spread of 1/6 between
      two slices that are both independently published.
      THE REAL LIMITATION, STATED RATHER THAN HIDDEN: the projection is a
      SUFFICIENCY device, not a necessity device. It converts a DETECT with a
      given alpha into a total cost; it says nothing about which alpha are
      achievable, and it therefore cannot close anything outside the family it
      describes.

  null_object_control:
    primary_null: >-
      THE RANDOM-TARGET ARM. Replace E'^{(p)} by a uniformly random supersingular
      F and run the identical measurement. The forced values differ and are
      derived before any run: for a random target the relevant lattice is the
      rank-4 connecting ideal of pair-independent determinant Theta(p^2)
      (IDEA-20260805-e7ee4a's first census row), so
      #{isogenies E -> F of degree <= T} = Theta(T^2/p) and the density exponent
      is 2.0, not 1.5. IF THE NULL ARM RETURNS 1.5, the instrument is measuring
      list growth rather than target structure and no value of alpha may be
      recorded.
    secondary_nulls:
      - >-
        POSITIVE CONTROL: curves with planted small delta, generated by taking a
        curve on the F_p locus and walking r steps (delta <= ell^{2r}), so the
        detector must succeed at a radius known in advance. A detector that
        never fires on a planted instance is broken, and no negative may be read
        from it (this is the gap IDEA-20260807-a6a038 records for
        ball-computable filters generally).
      - >-
        INSTRUMENT-FIDELITY REGRESSION: reproduce the committed |L(E,X,B)|
        cardinality scaling before any exponent is fitted.
      - >-
        DEGENERACY GATE: discard T values where the count is below 5 or above
        10% of the whole vertex set; both ends destroy the power law for reasons
        that have nothing to do with the mathematics.

  predictions:
    - metric: >-
        alpha_hat: fitted slope of log(DETECT cost, measured as list entries
        constructed) against log T, at fixed toy p, over T spanning at least 1.5
        decades
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00. Accept if |alpha_hat - 1| < 0.05 at each of three
        primes. This is a CALIBRATION, not a discovery: a miss means the
        instrument or the identity is wrong and stops the experiment.
    - metric: >-
        beta_hat: fitted slope of log Pr[delta_{E'} <= T] against log T, over
        uniformly sampled supersingular E' at toy p, with delta computed exactly
        (no smoothness restriction)
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.50 from H1. Accept if |beta_hat - 1.5| < 0.10 at each of
        three primes and if the fitted prefactor scales as p^{-1/2} across
        primes (a second, independent check on the same law). THIS IS THE FIRST
        DIRECT TOY-SCALE TEST OF THE DENSITY LAW IN THIS CORPUS; the frozen
        source validates the SMOOTHNESS of the minimum (Section 4.2), not the
        COUNT.
    - metric: >-
        beta_hat_null: the same slope with the target E'^{(p)} replaced by a
        uniformly random supersingular F
      direction: higher
      minimum_effect: >-
        FORCED VALUE 2.00, and it must exceed beta_hat by at least 0.35 with
        non-overlapping intervals. If the two arms agree, the measurement is
        void.
    - metric: >-
        argmin over T of the measured end-to-end total work (attempts x
        per-attempt entries) at fixed toy p
      direction: different
      minimum_effect: >-
        FORCED VALUE log_p(T*) = 1/3, accept within +-0.05. This is the identity
        making a prediction that no factor-by-factor argument makes: the
        LOCATION of the optimum, not its value.
    - metric: >-
        mu_hat: fitted slope of log(peak memory, in stored entries) against
        log T for the same runs
      direction: different
      minimum_effect: >-
        FORCED VALUE 1.00 for the incumbent architecture. Recorded because the
        memory exponent is mu/3 and this question charges memory beside time in
        every estimate.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hours): the symbolic reproduction check. Evaluate
      p^{1/2} T^{alpha-3/2} at the three published slices and confirm 1/3, 1/2,
      1/2. Freeze the fixture. If any slice misses, STOP and record only that.
      STAGE 1 (small compute): at three primes with log2 p in [20, 40], build
      the full supersingular vertex set, compute delta_E EXACTLY for every curve
      by breadth-first search over cyclic isogenies of increasing degree (this
      is feasible only at toy scale and is the reason the scale is toy), and fit
      beta_hat and the random-target null beta_hat_null. STAGE 2: implement
      DETECT as Algorithm 2 at radius T, measure entries constructed and peak
      stored entries against T, fit alpha_hat and mu_hat. STAGE 3: end-to-end,
      measure total work against T and locate the argmin. STAGE 4: report the
      four fitted exponents with intervals, the null separation, and -- required
      -- the residual plot, because a poor power-law fit is itself the finding
      that alpha is not well defined.
    controls:
      - "Random-target null arm (forced value 2.00), run at every prime."
      - "Planted-delta positive control; a detector that misses it voids all negatives."
      - "Cardinality-scaling regression against the committed |L(E,X,B)| figures."
      - "Degeneracy gates on the count at both ends of the T range."
      - "Exact-delta ground truth by exhaustive search, so the smoothness-restricted observable collision named in the proof_search_map cannot contaminate beta_hat."
    required_metrics:
      - "alpha_hat, beta_hat, beta_hat_null, mu_hat, each with a confidence interval, per prime."
      - "Fitted prefactor of the density law and its scaling in p across the three primes."
      - "argmin_T of measured total work, in units of log_p T."
      - "Residuals of every power-law fit, reported, not summarised."
      - "The three-slice symbolic reproduction, pass or fail."

  falsification_conditions:
    - >-
      The symbolic reproduction fails at any of the three published slices. The
      identity is wrong and nothing else is recorded.
    - >-
      beta_hat differs from 1.50 by more than 0.10 at two or more primes, with
      the instrument passing its positive control. H1 IS FALSE AT THE TESTED
      SCOPE. This is the most valuable available outcome: the density law is
      what forces T* = (p/2)^{1/3} to be optimal, so its failure reopens the
      T-levers this record claims to close and puts a question against the
      frozen source's own choice of boundary.
    - >-
      alpha_hat differs from 1.00 by more than 0.05 for the incumbent
      architecture. Either the instrument is wrong (check the regression) or the
      list cost is not linear in T at toy scale, in which case the calibration
      that licenses the whole family formula is absent.
    - >-
      The null arm returns beta_hat_null within 0.35 of beta_hat. The instrument
      does not separate planted structure from list growth; no exponent is
      recorded.
    - >-
      A reader exhibits an algorithm outside the family A(T, DETECT) -- for
      instance one that never re-randomises, or one whose cost is not of the
      form (attempts) x (per-attempt) -- whose exponent is not alpha/3. The
      identity's SCOPE is then narrower than stated and the record must be
      superseded with the narrower family.

  confounders:
    - >-
      SMOOTHNESS CONTAMINATION. Measuring beta_hat with a smoothness-restricted
      detector measures the product of the density law and Heuristic 1 and would
      return an exponent that is neither. The design computes delta exactly for
      beta_hat; this is the single most likely way to get a wrong number here.
    - >-
      TOY-SCALE DYNAMIC RANGE. At log2 p = 20 the whole range of T is about two
      octaves and a slope of 1.5 is hard to separate from 1.3. Three primes and
      reported intervals are the mitigation; a single-prime point estimate would
      be worthless.
    - >-
      VERTEX-SET WEIGHTING. Curves with extra automorphisms (j = 0, 1728) are
      weighted 1/|Aut| in the mass formula and 1 in a naive enumeration. At toy
      p this is a visible constant. State the convention and use one.
    - >-
      alpha IS DEFINED ON A COST MODEL. "Entries constructed" is not
      "F_{p^2}-operations". The identity is invariant under a p^{o(1)} change of
      unit, but a measured alpha is not; the unit must be declared once and used
      everywhere, and the frozen source's own unit (one F_{p^2}-operation per
      table entry, Section 4.1) is the one to match.
    - >-
      REDISCOVERY RISK. beta_hat = 1.5 is what the mass formula predicts, so
      confirming it confirms a computation, not a mechanism. Its value here is
      as a CALIBRATION of the instrument that will be used on candidates where
      the answer is unknown, and it must be reported as such.

  interpretation_limits:
    - >-
      0.25 IS A TARGET, NOT A CLAIM. Nothing here says a p^{1/4} algorithm over
      F_{p^2} exists, is likely, or is nearly obtained. The record supplies the
      arithmetic condition alpha <= 3/4 and proposes no mechanism meeting it.
    - >-
      NO EXPONENT MOVES. Time p^{alpha/3+o(1)} with alpha = 1 is exactly the
      incumbent. The deliverable is a reformulation plus two measured exponents.
    - >-
      TOY SCALE IS TOY SCALE. log2 p in [20, 40] is six to twelve orders of
      magnitude below SQIsign NIST-I. A measured beta_hat at 2^40 is evidence
      about 2^40 and a transfer assumption about anything else, and the transfer
      assumption is stated in H1's validation plan, not smuggled.
    - >-
      THE IDENTITY IS SUFFICIENCY-ONLY. It converts an alpha into a cost. It
      does not bound alpha from below and may not be cited as a closure of any
      route.
    - >-
      CONDITIONAL TIERS ARE INHERITED, NOT WAIVED. Every cost statement above
      carries BOTH Heuristic 1 of the frozen source AND H1 below. The
      unconditional tier remains p^{1/2}(log p)^{O(1)} at polynomial memory.
    - >-
      THE CONTESTED F_p FIGURE IS NOT USED. KN-TECH-058 RC4's
      relayed_from_abstract and contested Otilde(p^{1/4}) is neither cited as
      reachable nor needed; the T = 1 calibration uses only the frozen source's
      own line 51.

  heuristic_assumptions:
    - id: H1
      statement: >-
        CONJUGATE-DEGREE DENSITY LAW. There exist absolute constants
        0 < c1 <= c2 such that, for all sufficiently large primes p and all T
        with (log p)^2 <= T <= (p/2)^{1/3}, the proportion of supersingular
        elliptic curves E/F_{p^2} (weighted by 1/|Aut(E)|) admitting a separable
        isogeny E -> E^{(p)} of degree at most T satisfies
            c1 * T^{3/2} p^{-1/2}  <=  Pr[delta_E <= T]  <=  c2 * T^{3/2} p^{-1/2}.
        Equivalently: the number of lattice points of norm at most T in the
        rank-3 trace-zero conjugate lattice behaves, on a positive proportion of
        curves, like the volume heuristic for a ternary form of determinant
        Theta(p), and the first moment is tight per curve up to constants.
      rigorous_support: >-
        TWO INGREDIENTS, COMPOSED AS THE TARGET PROFILE REQUIRES (A2). (i) A
        RIGOROUS FIRST MOMENT: by the Deuring correspondence and the Eichler
        class-number/mass formula, the number of trace-zero elements of norm pd
        summed over the whole supersingular class set is the Hurwitz class
        number H(4pd) = (pd)^{1/2+o(1)}; summing over d <= T and dividing by the
        class number Theta(p) gives expected count Theta(T^{3/2} p^{-1/2}). This
        is an average, and it is not heuristic. (ii) A CLASSICAL DISTRIBUTION
        THEOREM IT IMITATES: Duke's equidistribution of CM/Heegner points, which
        says the strata {E : delta_E = d} (reductions of CM points of
        discriminant -4pd) spread over the supersingular set. H1 asks only that
        the count behaves per curve as equidistribution plus a tight first
        moment would predict -- exactly the role Canfield-Erdos-Pomerance plays
        for Heuristic 1 of the frozen source. BOTH INGREDIENTS ARE CARRIED AT
        provenance: recalled IN THIS RECORD AND NEITHER HAS BEEN READ BY THIS
        PROGRAM; H1 is therefore an assumption with a literature-shaped
        justification, not a theorem, and it is why novelty_status is
        unverified. A consistency check that requires no reading: H1 returns
        expected count 1 exactly at T = (p/2)^{1/3}, reproducing Theorem 1.5's
        threshold.
      validation_plan: >-
        TWO SCALES, THE SECOND USING THE FROZEN SOURCE'S OWN SHORTCUT.
        (a) TOY, DIRECT: at three primes with log2 p in [20, 40], enumerate the
        whole supersingular vertex set, compute delta_E exactly by BFS over
        cyclic isogenies, and fit Pr[delta <= T] against T. Predicted slope
        1.50; predicted prefactor scaling p^{-1/2} across primes; null arm
        (random target) predicted slope 2.00.
        (b) CRYPTOGRAPHIC, VIA DEURING: reuse the sampling route of frozen
        source Section 4.2 -- sample maximal orders O in B_{p,infinity} uniformly
        up to conjugation, take the two-sided ideal P of reduced norm p, form the
        rank-3 trace-zero lattice with the form Nrd/p -- but replace the
        SHORTEST-VECTOR computation by a full lattice-point COUNT of norm <= T
        for a ladder of T (Fincke-Pohst enumeration, cheap in rank 3). Sample
        sizes: 10^4 at p = 5*2^248 - 1 (SQIsign NIST-I) and 10^3 at
        p = 27*2^500 - 1 (NIST-V), smaller than the frozen source's 10^5 and
        10^4 because counting costs more than one shortest vector.
        COMPARISON: empirical mean count against c*T^{3/2}p^{-1/2} on a
        log-log plot, and empirical CDF of delta against
        1 - exp(-c T^{3/2} p^{-1/2}).
        TAIL CONSISTENCY: the rare-event lower tail is unobservable at
        cryptographic p (Pr[delta <= p^{1/6}] ~ p^{-1/4} ~ 2^{-62} at NIST-I),
        so the tail checks are taken at the UPPER end, where they are sharp and
        falsifiable: ZERO samples may have delta > (p/2)^{1/3} (Theorem 1.5 is a
        theorem -- any violation is an instrument bug and voids the run), and
        the observed fraction with delta > 0.9 (p/2)^{1/3} must match
        1 - c(0.9)^{3/2} within sampling error.
        TRANSFER ASSUMPTIONS, RECORDED: (T1) uniform random maximal orders
        correspond to supersingular curves weighted by 1/|Aut|, not uniformly;
        (T2) the toy-scale fit at 2^40 transfers to 2^250 only under the
        assumption that the exponent, not merely the constant, is stable --
        which is why (b) exists and why (a) alone would not discharge H1;
        (T3) the Deuring route measures the lattice, and the identification of
        lattice minima with isogeny degrees is the isometry of Section 4.2,
        assumed, not re-proved.
      falsification_condition: >-
        A fitted density exponent outside [1.40, 1.60] at two or more toy primes
        with the positive control passing, OR a mean lattice-point count at
        cryptographic p deviating from c T^{3/2} p^{-1/2} by more than a factor
        of 2 over a factor-16 range of T, OR any sampled delta exceeding
        (p/2)^{1/3}.
    - id: H2
      statement: >-
        INHERITED SMOOTHNESS. Heuristic 1 of the frozen source (line 69) holds
        as stated, uniformly in the same range, when the degree bound is T =
        p^{c} for a constant c in (0, 1/3] rather than only at c = 1/3.
      rigorous_support: >-
        The frozen source's own justification (Theorem 1.5 x Theorem 1.4,
        Canfield-Erdos-Pomerance), which is stated for the minimal degree and
        whose u-range is a function of the size of the integer being tested. At
        T = p^c the relevant u is c log p / log B and CEP's uniformity range is
        unchanged in shape.
      validation_plan: >-
        NO WAIVER IS CLAIMED. This record inherits the incumbent's validation
        obligation and does not re-run it; the frozen source's Section 4.2
        experiment covers c = 1/3, and any candidate DETECT operating at c <
        1/3 must extend it to its own c by the same Deuring route, reporting
        the empirical CDF of the largest prime factor against rho(u) with
        u = c log p / log B. Recorded here so that a later record cannot treat
        the extension as free.
      falsification_condition: >-
        An empirical smoothness probability at c < 1/3 falling below the
        rho(u) prediction by more than the frozen source's own observed slack at
        c = 1/3.

  target_complexity:
    time_exponent: >-
      p^{alpha/3 + o(1)}, where alpha is the detection-cost exponent. FOR THE
      INCUMBENT alpha = 1 AND THIS IS p^{1/3+o(1)} -- NO IMPROVEMENT IS CLAIMED
      OR PROPOSED. The record's arithmetic content is that exponent 1/4 through
      this family requires alpha <= 3/4 and that no value of T alone can move
      the exponent while alpha = 1.
    memory_exponent: >-
      p^{mu/3 + o(1)}, mu = 1 for the incumbent, i.e. p^{1/3+o(1)} -- memory
      equal to time, which the frozen source (line 39) calls "a serious obstacle
      for any deployment". A candidate is an improvement only if it lowers
      2*alpha + mu below 3 (see tradeoff_note), and the record requires both
      exponents to be stated.
    best_known: >-
      TWO TIERS, NAMED SEPARATELY AS THIS QUESTION REQUIRES.
      (i) UNCONDITIONAL: p^{1/2}(log p)^{O(1)} time at POLYNOMIAL memory
      (Delfs-Galbraith, frozen source line 51; full-cost Otilde(p^{1/2}) for VW
      over F_{p^2} per KN-TECH-057). Beating only this tier is not an
      improvement.
      (ii) CONDITIONAL ON HEURISTIC 1: p^{1/3+o(1)} time AND memory (Theorem
      1.1). The identity here adds H1 as a SECOND condition, so any statement
      derived from it sits at a strictly weaker tier than Theorem 1.1 itself.
    hidden_overhead: >-
      The identity MULTIPLIES the incumbent's disclosed overhead; it does not
      remove it. The frozen source states its o(1) hides a SUPERPOLYNOMIAL
      overhead "much larger than the previous (log p)^{O(1)} cofactor" (line
      39), and no concrete-parameter conclusion is computed above it here. A
      candidate DETECT with alpha < 1 would carry its OWN o(1), which this
      record does not assume to be smaller than the incumbent's -- and since the
      identity raises the per-attempt overhead to the power 1 and the attempt
      count to the power 1, a candidate's overhead enters the total unattenuated.
    tradeoff_note: >-
      The family's point on the (time, memory) plane is (alpha/3, mu/3). Write
      N = p^{1/3+o(1)} for the claw size, so the candidate is
      (time, memory) = (N^{alpha}, N^{mu}). The comparator is van Oorschot-Wiener
      as the frozen source quotes it at line 39: time p^{1/2+o(1)}/w^{1/2} at
      memory w, i.e. the invariant time^2 x memory = N^3. At matched memory
      w = N^{mu}, VW costs N^{(3-mu)/2}, so THE CANDIDATE BEATS VW IF AND ONLY IF
          2*alpha + mu < 3.
      THE INCUMBENT SITS EXACTLY ON THAT CURVE (2*1 + 1 = 3): its
      (time, memory) = (N, N) is precisely VW's best-time endpoint for a claw of
      size N, and the classic polynomial-memory algorithms are the other
      endpoint. Consequently BOTH levers are live and neither is free:
      alpha < 1 at mu = 1 beats VW, and -- correcting the arithmetic error a
      first draft of this record made -- mu < 1 at alpha = 1 ALSO beats VW, i.e.
      a memory reduction at unchanged time exponent would move the whole
      frontier, which is exactly the open problem the frozen source states at
      line 39 ("currently unclear how to reduce the memory cost without
      increasing the time") and exactly what IDEA-20260821-167fd9 attacks.
      Parallelisation: the frozen source states the algorithm parallelises
      perfectly (line 39), and VW parallelises to p^{1/2+o(1)}/(w^{1/2} n); the
      identity is unchanged under parallelisation since both of its factors are
      parallel.

