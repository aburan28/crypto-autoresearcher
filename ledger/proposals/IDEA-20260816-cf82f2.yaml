idea:
  id: IDEA-20260816-cf82f2
  question_id: RQ-SLHDSA-001
  added: '2026-08-16'
  title: Treat the map from the message randomizer to the selected hypertree leaf index as a distribution-valued
    object rather than a uniform idealization, measure its pushforward at digest widths where the
    whole randomizer domain is enumerable, and report its total-variation distance from uniform against
    a same-sample-size uniform null.
  class: representation
  claim: '(A) Every occupancy statement this program has made about the FORS layer is conditional
    on an antecedent that no record measures: H-SLHDSA-3a403a states its main identity explicitly
    under an unbiasable index, and IDEA-20260805-fbe36a and IDEA-20260805-705614 both carry the randomizer
    as an idealization. The antecedent is a statement about a distribution, and a distribution is
    a measurable object. (B) The right object is not the randomizer and not the digest but the pushforward:
    the distribution induced on the leaf-index alphabet when the randomizer is drawn uniformly and
    pushed through the digest-then-split map. At digest widths small enough to enumerate the entire
    randomizer domain, that pushforward is computable exactly, giving a histogram with no sampling
    error at all. (C) The quantity that matters for occupancy is not whether the pushforward is exactly
    uniform, which it will not be, but how far from uniform it is in a metric that composes with the
    accumulation: total variation, because the occupancy statistic after q signatures differs from
    its uniform-index value by at most q times the total-variation distance, which converts a distributional
    deviation into a bound on the statistic this program actually cares about. (D) The measurement
    is meaningless without its null, and the null here is not optional decoration but arithmetic necessity:
    the empirical total-variation distance of a finite sample from uniform is bounded away from zero
    by a floor of order sqrt(alphabet size / sample size), so a raw total-variation number is uninterpretable.
    The identical pipeline must therefore be run on indices drawn from a true uniform source at the
    same sample size, and only the excess over that arm''s measured floor can be read. (E) WHAT IS
    NOT CLAIMED: no bias is predicted, no attack, no forgery, no security level, no statement about
    SHA-2 or SHAKE, no statement about what the literature contains, and nothing about the fault or
    memory-corruption class. A measured excess of zero is the expected and complete outcome, and it
    is worth having precisely because five records currently assume it.'
  mechanism: 'STAGE A: fix the split map explicitly as an object -- digest bytes in, an index block
    of h bits and a FORS block of a*k bits out -- including the byte-boundary handling, since a split
    whose field widths are not byte multiples must either discard bits or straddle boundaries, and
    which of those it does is a property of the map and not of the hash. STAGE B: at randomizer widths
    r in {8, 12, 16, 20} bits, enumerate all 2^r randomizer values, push each through the digest-then-split
    map for a fixed message and a fixed key, and accumulate the exact leaf-index histogram. This is
    a complete pushforward with zero sampling error. STAGE C: compute total-variation distance from
    uniform on that exact histogram, and separately the chi-square statistic, since the two respond
    differently to a single overweighted cell versus broad drift. STAGE D: run the identical accumulation
    on 2^r draws from a seeded uniform source, giving the finite-sample floor as a measured quantity
    rather than an asymptotic formula, on three seeds. STAGE E: repeat STAGE B for h values that are
    and are not compatible with the digest byte width, since the straddling case is where a deviation,
    if any exists, is structurally most likely -- this makes the split map, not the hash, the variable
    under test. STAGE F: report excess over floor, per (r, h, split-variant), with the composition
    bound q * TV attached so the deviation is expressed in the units the occupancy lane uses.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -ril for randomizer, message randomizer, PK.seed, occupancy, hypertree, index over
      ledger/proposals/, ledger/hypotheses/, knowledge/. Read RQ-SLHDSA-001 in full and the statement
      block of H-SLHDSA-3a403a, noting the exact phrase under an unbiasable index in its clause (ii).
      Read the title and question_id of every proposal returned by the randomizer grep: IDEA-20260805-fbe36a,
      IDEA-20260805-705614, IDEA-20260808-ae34ad on RQ-SLHDSA-001, and IDEA-20260816-63811b which
      is on RQ-FNDSA-001 and concerns floating-point rounding in a recursion, not this object.'
    results: 'The string message randomizer occurs in exactly three files in the whole repository:
      IDEA-20260805-fbe36a, IDEA-20260805-705614, and H-SLHDSA-3a403a. In all three it appears as
      an idealization the argument is conditioned on, never as a measured object -- H-SLHDSA-3a403a
      clause (ii) says under an unbiasable index its expectation is EXACTLY 2^{-ak} T_k(lambda), which
      is a conditional whose antecedent no record in this repository tests. IDEA-20260808-ae34ad mentions
      the randomizer only while arguing about memory charges for a search. IDEA-20260816-63811b is
      on RQ-FNDSA-001 and is about accumulated rounding error in a recursion, a different scheme and
      a different object; the FALCON and FNDSA sampler-divergence subject matter is owned by a sibling
      bucket in this same batch and is not touched here. No record anywhere computes a pushforward
      distribution, a total-variation distance, or a finite-sample uniformity floor for any index-selection
      map.'
    verdict: 'UNVERIFIED. Testing an index-derivation map for uniformity is an entirely ordinary statistical
      move and this program cannot read external literature, so nothing is asserted about what exists
      outside this repository; it would be unsurprising if such tests were routine practice elsewhere.
      What is claimed new is internal and precise: this repository conditions five statements on an
      unbiasable index and measures the index nowhere, the pushforward-as-object framing with the
      composition bound q * TV attaching the deviation directly to the occupancy statistic is assembled
      from standard parts, and the specific design choice of varying the split map''s byte-boundary
      compatibility as the independent variable -- so that the hash is held fixed and the encoding
      is the thing under test -- is the one move here I have not seen in this repository on any target.'
  object_first_candidate:
    tracked_object: 'The pushforward distribution on the leaf-index alphabet [2^h]: the histogram
      induced when the message randomizer is drawn uniformly over its domain and pushed through the
      digest-then-split map, with the message and key held fixed. The object followed is this histogram,
      and the operation it is followed through is the issuing of signatures, each of which increments
      one bin.'
    lossiness: 'The projection discards the randomizer value itself, the entire digest, the FORS index
      block, every bit of the digest not consumed by index extraction, the message, and the secret
      key. What survives is a histogram over 2^h bins. This is heavily lossy: from the histogram one
      cannot recover a single randomizer, a single digest, or which message produced which index.
      It propagates because the occupancy statistics the program cares about are functionals of the
      index histogram alone, so the discarded material is discarded compatibly with the operation
      being studied -- accumulating signatures acts on the histogram without reference to anything
      dropped. The boundary is explicit: any statement about the FORS index block, which is the other
      half of the split, is invisible to this object, and the companion FORS-reuse entry tracks that
      half.'
    propagation: One signing step draws a randomizer, computes a digest, extracts an index, and increments
      exactly one histogram bin. On the tracked object this is the map H <- H + e_i where i is the
      extracted index, so the object is a multinomial accumulator whose parameter vector is the pushforward.
      After q steps, the deviation of any bounded functional of the empirical histogram from its value
      under a uniform parameter vector is bounded by q times the total-variation distance between
      the pushforward and uniform -- which is why total variation, rather than any other divergence,
      is the metric the propagation rule selects.
    survival_score: 'The exact pushforward is computable while the randomizer domain is enumerable,
      which on this hardware means r up to about 24 bits (16.8 million digest evaluations, minutes).
      Beyond r = 24 the object survives only as a sampled estimate with a stated confidence band,
      and the finite-sample floor rises as the alphabet grows relative to the sample, so the resolvable
      excess degrades as roughly sqrt(2^h / N). Concretely: at h = 8 and full enumeration of r = 20
      the design can resolve a total-variation excess of about 10^-3; at h = 16 with the same budget
      it can resolve about 10^-2. Those two numbers are the survival score, and the design reports
      which regime each measurement sits in rather than quoting a single sensitivity.'
  null_object_control: Indices drawn from a seeded uniform pseudorandom source over the same alphabet
    [2^h], at the identical sample size, pushed through the identical histogram, total-variation and
    chi-square pipeline, inside the same process invocation, on three seeds. The null must show a
    nonzero measured total-variation distance -- this is the point -- consistent with the finite-sample
    floor, and the between-seed spread of that floor sets the resolution. The signal arm means something
    only if its total-variation distance exceeds the null arm's measured value by more than the null's
    own between-seed spread. If the null arm's floor is larger than any plausible effect at the chosen
    sample size, the measurement has no resolution and must be reported as such rather than as an
    absence of bias.
  discriminated_from:
  - 'H-SLHDSA-3a403a: its clause (ii) is stated under an unbiasable index and is therefore a conditional.
    This proposal measures the antecedent of that conditional and does not touch the consequent; it
    produces no occupancy probability at all.'
  - 'IDEA-20260805-fbe36a: computes the occupancy moment assuming the index is idealized. Same relationship
    -- this measures the assumption, that one uses it. Different objects: an occupancy moment is a
    number in bits, a pushforward is a histogram.'
  - 'IDEA-20260805-705614: a quantifier-order audit over the reachable occupancy set, symbolic and
    zero-compute, with the randomizer appearing only as an idealization in the setup. No distribution
    is computed anywhere in it.'
  - 'IDEA-20260816-63811b on RQ-FNDSA-001: accumulated rounding error in a recursion treated as a
    random walk. Different scheme, different object, and sampler-divergence subject matter belongs
    to a sibling bucket in this batch; nothing here concerns floating point or samplers.'
  - 'IDEA-20260813-945a67: ADRS alias opportunities under a single-fault model. This proposal assumes
    no fault and no adversarial control of anything; the randomizer is drawn honestly and uniformly,
    which is the whole design.'
  assumptions:
  - The split map's exact field widths and byte-boundary behaviour are as recorded in this repository's
    structural description, which marks itself UNVERIFIED against primary text; the contract therefore
    tests several split variants rather than one.
  - A uniformly drawn randomizer is the right input distribution to push forward; the deterministic
    and hedged signing modes differ in how the randomizer is produced, and this contract fixes the
    uniform case and states that it does not cover the others.
  - Total variation is the composition-appropriate metric because the functionals of interest are
    bounded; this is argued, not measured, and any functional that is unbounded escapes the q * TV
    bound.
  - The seeded pseudorandom source used for the null is uniform enough at these sample sizes that
    its measured floor is the finite-sample floor and not an artifact of the generator, which is checked
    by a second generator.
  - Holding the message and key fixed while varying the randomizer isolates the randomizer's contribution;
    varying all three simultaneously would confound them.
  predictions:
  - metric: total-variation distance of the exact pushforward from uniform, signal arm, minus the
      null arm's measured floor, at byte-aligned split widths
    direction: lower
    minimum_effect: 0.001
  - metric: same excess at split widths that straddle byte boundaries
    direction: different
    minimum_effect: explicit refusal to pre-commit a direction or a magnitude. The straddling case
      is the one place a structural deviation could arise from the encoding rather than the hash,
      and I have no basis to predict its sign; pre-committing would make the byte-boundary arm confirmatory
      rather than exploratory, which is exactly the failure this contract exists to avoid.
  - metric: null arm measured total-variation floor versus the analytic finite-sample expectation
      for that alphabet and sample size
    direction: different
    minimum_effect: 'forced value: the two must agree within the null arm''s between-seed spread;
      a null floor that disagrees with its own analytic expectation invalidates the pipeline'
  - metric: chi-square statistic on the exact pushforward, expressed as a p-value against its degrees
      of freedom
    direction: different
    minimum_effect: 0.01
  minimal_test:
    design: One configuration decides whether the design has any resolution. Fix h = 8, so the leaf
      alphabet has 256 bins, and r = 20, so the randomizer domain has 1048576 values and enumerates
      completely in under a minute of hashing. Compute the exact pushforward histogram by evaluating
      the digest-then-split map on every one of the 2^20 randomizer values with the message and key
      held fixed, and compute its total-variation distance from uniform. In the same invocation, draw
      2^20 indices from a seeded uniform source and run the identical histogram and total-variation
      pipeline, on three seeds, giving the measured floor and its spread. The discriminating observable
      is signal total variation minus null total variation, compared against the null's between-seed
      spread. If that difference is inside the spread, the answer at this configuration is no resolvable
      deviation, stated with its resolution attached. Then repeat once with h = 9, which straddles
      the byte boundary the h = 8 case respects, holding everything else fixed. Total cost is minutes
      and it settles both whether the pipeline resolves anything and whether the byte-boundary arm
      is worth building out.
    controls:
    - Uniform-source null arm at identical sample size, identical pipeline, same invocation, three
      seeds.
    - Second uniform generator (a different seeded algorithm) for the null, to confirm the measured
      floor is a sample-size property and not a generator property.
    - Byte-aligned versus byte-straddling split variants at otherwise identical parameters, so the
      encoding rather than the hash is the variable.
    - Two concrete digest backends (SHA-256-truncated and SHAKE-128-truncated) at identical widths,
      so a deviation seen in one and not the other is identifiable as backend-specific.
    - 'A permuted-bin control: relabel the histogram bins by a fixed random permutation before computing
      total variation, which must leave the statistic unchanged and catches ordering bugs in the extraction.'
    required_metrics:
    - exact pushforward histogram over [2^h], signal arm, per (r, h, split variant, backend)
    - total-variation distance from uniform, signal arm
    - total-variation distance from uniform, uniform-source null arm, with between-seed spread
    - excess of signal over null with the resolution floor stated alongside
    - chi-square statistic and p-value on the exact histogram
    - the composition bound q * TV evaluated at the signature budgets used elsewhere in this bucket
  falsification_conditions:
  - 'The null arm''s measured floor disagrees with its own analytic finite-sample expectation beyond
    the between-seed spread: the pipeline is wrong and no signal number may be read.'
  - 'The two uniform generators give different floors: the null is measuring the generator and the
    resolution claim is void.'
  - 'The permuted-bin control changes the total-variation statistic: the extraction or the histogram
    indexing is buggy.'
  - 'Signal excess exceeds the null floor by more than its spread in one digest backend but not the
    other at identical split widths: the effect is backend-specific and cannot be attributed to the
    split map, which is the object under test.'
  - 'The measured floor at the chosen sample size exceeds any deviation the design could resolve:
    the measurement has no power and must be reported as no resolution rather than as no bias.'
  - 'The exact enumeration and a sampled estimate at the same parameters disagree beyond the sampled
    arm''s band: the enumeration is not exact and the ground truth fails.'
  confounders:
  - Finite-sample total variation is bounded away from zero by construction, so any raw number looks
    like a deviation; this is the entire reason for the null and it is the confounder most likely
    to produce a false positive.
  - Truncating a digest to a narrow width can introduce structure from the truncation rather than
    from the split, which the two-backend control partially but not fully separates.
  - Holding the message fixed while enumerating the randomizer measures the map at one message; a
    deviation could be message-dependent, and the contract samples several messages to bound that
    rather than claiming it away.
  - A split variant that discards digest bits rather than straddling changes the effective alphabet,
    which shifts the analytic floor and can look like a signal if the floor is not recomputed per
    variant.
  - Chi-square and total variation respond differently to a single heavy bin versus broad drift, so
    reporting only one of them can hide the shape of any deviation.
  interpretation_limits:
  - A measured excess of zero at the tested widths says the pushforward is uniform to within the stated
    resolution at those widths; it is not a statement about any deployed digest width, where the alphabet
    is astronomically larger and no enumeration is possible.
  - Nothing here is a security statement, a bias exploit, or an attack; a nonzero excess would be
    an input to the occupancy lane's error budget, not a finding about any scheme.
  - The uniform-randomizer input distribution is one mode; deterministic and hedged signing produce
    randomizers differently and are outside this contract's scope.
  - No statement about SHA-2 or SHAKE follows from any arm, since both are used only as truncated
    fixed backends and the variable under test is the split map.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs 2^r digest evaluations per
      configuration for the exact arm, r at most 24, plus an equal number for the null arm; no adversarial
      search is performed anywhere in the design.
    memory_exponent: No attack memory exponent is claimed. The histogram is 2^h counters, at most
      2^16 in this contract, a few hundred kilobytes; the enumeration is streaming and holds no digest.
    best_known: 'The incumbent inside this repository is the bare assumption: H-SLHDSA-3a403a clause
      (ii), IDEA-20260805-fbe36a and IDEA-20260805-705614 all condition on an unbiasable index and
      none measures it, so the number of measurements of this object currently held here is zero.
      No claim is made about what exists outside this repository.'
    hidden_overhead: 'The overhead hides in the resolution accounting, not the hashing. Getting the
      finite-sample floor right per split variant -- because a variant that discards bits changes
      the effective alphabet and therefore the floor -- is fiddly, easy to get subtly wrong, and is
      where a spurious signal would come from. In human cost: writing the split map several ways,
      faithfully to a structural description this repository marks UNVERIFIED, is most of the implementation
      time, and the risk that all variants are wrong in the same way is not removable by any amount
      of compute.'
  dominated_by: 'n/a (no result claimed). Checked against every frontier row this repository maintains
    across time, memory and data/queries: a pushforward histogram and a total-variation excess have
    no coordinate on any of them, because nothing here searches for anything. No frontier row dominates
    it and it dominates none; it is not entered on any frontier.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Against this repository''s own
    state: three records condition on an unbiasable index and zero measure it; this would make the
    count one, and would attach a number with a resolution floor to a phrase that currently carries
    none.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separable parts. (1) That the exact pushforward can be enumerated and
    the pipeline validated by its null and permuted-bin controls: about 0.9, it is straightforward
    and the controls are cheap. (2) That the design has resolution, meaning the null floor at the
    chosen sample sizes is small enough that a deviation of practical interest would be visible: about
    0.6 at h = 8 and considerably worse at h = 16, and I want the resolution reported as a number
    rather than assumed adequate. (3) That the byte-aligned arms show no resolvable excess: about
    0.9, which is the expected and boring outcome and is worth having only because three existing
    records assume it without measuring. (4) That the byte-straddling arm shows a resolvable excess:
    about 0.25, and I decline to predict its sign; this is the exploratory arm and its most likely
    outcome is also no excess. (5) That a resolvable excess in any arm would change anything in the
    occupancy lane: about 0.3 even conditional on finding one, since the q * TV composition bound
    is generous and a small excess is absorbed by it.'
