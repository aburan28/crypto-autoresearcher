idea:
  id: IDEA-20260807-1d9c5f
  question_id: RQ-TORS-8c7b79
  added: '2026-08-07'
  title: >-
    THE RATIONAL-KERNEL COUNT OF psi_ell IS THE ONLY R5 QUANTITY THAT VARIES INSIDE
    AN ISOGENY CLASS: measure it as the ell-volcano level, stratify every campaign
    cost functional by it, and decide the sharp question of whether ell-torsion has
    ANY within-class content at all -- k-independent by construction, and stated so
    before the measurement rather than after
  class: measurement

  claim: >-
    (A) THE SEPARATION THIS RECORD EXISTS TO MAKE. IDEA-20260807-c98c3d establishes
    that the Elkies/Atkin classification is constant on an F_p-isogeny class,
    because it depends only on (t, p, ell) and t is a class invariant. That
    constancy makes it a class fingerprint and simultaneously makes it USELESS for
    distinguishing curves within a class -- which is exactly what L1
    (RQ-ICINV-475b5e) and L2 (RQ-VOLC-f6253b) need. The question this record asks
    is therefore forced: is there ANY ell-torsion quantity that varies WITHIN a
    class? There is exactly one natural candidate, and it is this:
      kappa_ell(E) = the number of distinct F_p-rational order-ell subgroups of E,
      equivalently the number of degree-(ell-1)/2 Galois-stable kernel polynomials
      dividing psi_ell over F_p, equivalently the number of F_p-rational
      ell-isogenies out of E.
    kappa_ell is NOT determined by t alone. When ell divides the conductor f of
    Z[pi] inside the endomorphism order, the ell-isogeny graph on the class is a
    VOLCANO with more than one level, and kappa_ell takes different values at
    different levels: at the crater a curve has the horizontal isogenies plus the
    descending ones, at the floor it has only the ascending one. That is the
    standard Kohel / Fouquet-Morain volcano picture, RELAYED as standard and NOT
    re-derived here, and it is marked [open] in this record until the measurement
    in STEP 3 confirms the level stratification directly on toy classes.

    (B) K-INDEPENDENCE, STATED FIRST. kappa_ell(E) reads only (p, a, b). It never
    touches P or Q. It is therefore INDEPENDENT OF k BY CONSTRUCTION, and the
    static provenance gate of IDEA-20260807-bd5d91 would reject any k-correlation
    study of it before it ran. No such study is proposed. What is proposed is a
    STRATIFICATION: use kappa_ell as a covariate against which OTHER measurements
    are grouped, which is a legitimate and different use of a curve-only quantity.

    (C) THE DECISIVE QUESTION AND ITS TWO OUTCOMES. DECOMPOSITION.md section 5
    pre-registers the expectation that L2 shows NO effect stratified by volcano
    level. This record supplies the instrument that makes that prediction testable
    and pre-registers the two branches:
      OUTCOME 1 -- every campaign cost functional measured on curves of a single
        class is statistically indistinguishable across kappa_ell strata, at the
        pre-registered effect size. Then R5 has no within-class content for those
        functionals, L2's central prediction is confirmed with a named mechanism
        (the level is invisible to every functional the program measures because
        each of them factors through data the level does not change), and the L2
        lane closes with an obstruction rather than a tally.
      OUTCOME 2 -- some functional differs across strata beyond the pre-registered
        threshold and survives the nulls. Then the campaign has found a
        within-class varying quantity that correlates with cost, and the
        reachability gate T5 immediately becomes the binding question: is a
        favourable level REACHABLE, given that the level is changed only by
        VERTICAL (ascending/descending) isogenies and that the number of levels is
        v_ell(f), typically 0 or 1 at toy scale? That question is answered in the
        reachability_gate field of this record, in advance, so that OUTCOME 2
        cannot be reported as an attack.
      There is no outcome in which the measurement means nothing: it either closes
      L2's question or hands the campaign a target with a stated reachability cost.

    (D) THE MEASUREMENT IS CHEAP AND SHARES ALL ITS MACHINERY. kappa_ell is a
    by-product of the kernel extraction already required by IDEA-20260807-053a55:
    factor psi_ell over F_p (degree (ell^2-1)/2, at most 84 for ell <= 13) and
    count the products of irreducible factors of total degree (ell-1)/2 whose root
    set is closed under the x-only group law. The marginal cost over the transport
    primitive is a counter.

  resource_label: R5
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE AS A RESOURCE USE. kappa_ell is read from the factorisation of
    psi_ell over F_p -- the Galois-module structure of E[ell] -- which the generic
    group oracle does not supply and cannot simulate, since a simulator holding
    only group handles has no access to psi_ell. So R5 genuinely escapes the
    generic model. It escapes it at the CURVE level only: kappa_ell is a property
    of E, never of a point, so it cannot by itself distinguish two targets. The
    honest position is therefore that this proposal's resource is admissible and
    its OUTPUT is k-independent -- which is not a contradiction but the exact
    combination the L7 brief predicted for curve-level torsion statistics, and
    which is why the proposal is framed as a stratification instrument rather than
    as an attack.

  discriminated_from:
    - >-
      IDEA-20260807-c98c3d. That record covers the CLASS-CONSTANT part of the
      ell-torsion picture (Elkies/Atkin classification, t mod ell). This record
      covers the WITHIN-CLASS-VARYING part (kappa_ell, the volcano level). Keeping
      them apart is load-bearing: a "fingerprint" that included kappa_ell would not
      be constant on the class and the sieve in c98c3d would silently fail.
    - >-
      L2 / RQ-VOLC-f6253b. That lane owns the volcano-depth question and names its
      obstruction as "on G the level is invisible, so any effect must be routed
      through R1/R2/R5". This record is the R5 ROUTING: it supplies the level
      measurement itself and the stratification protocol, and it does not duplicate
      L2's cost-functional measurements, which remain L2's to run. It is filed in
      L7 because reading the level off psi_ell is an E[ell] Galois-module
      computation, which is R5's definition.
    - >-
      IDEA-20260807-053a55. That record uses kernel extraction to BUILD a transport
      and proves a dichotomy about what transport does to k. This record uses the
      same extraction to COUNT kernels and asks a statistical question about
      within-class variation. Same subroutine, different object, different
      falsification conditions.
    - >-
      EV-ICI-0bdaaa. That measured Elkies isogeny preimages of a factor base and
      found them indistinguishable from a random bijection. It stratified by
      nothing. If OUTCOME 2 fires here, the natural follow-up is to re-run that
      measurement stratified by kappa_ell, and this record names that as the
      successor rather than re-litigating the earlier negative.

  object_first_candidate:
    tracked_object: >-
      THE RATIONAL-KERNEL COUNT VECTOR kappa(E) = (kappa_ell(E))_{ell in L} for
      L = {3,5,7,11,13}, read as the curve's position in each ell-volcano.
    lossiness: >-
      Genuinely lossy at the curve level: kappa(E) forgets (a, b), forgets j(E),
      forgets which kernels those are, and retains at most a handful of small
      integers (each kappa_ell is in {0, 1, 2, ell+1} in the standard picture). It
      passes the lossy-projection test as a projection of the CURVE. It fails the
      lane's hard constraint as a projection of the INSTANCE, because it forgets
      P and Q entirely -- and that failure is the record's own first claim, not a
      discovery.
    propagation: >-
      Propagates under horizontal ell'-isogenies (ell' != ell) but NOT in general
      under vertical ones: an ascending or descending ell-isogeny changes the level
      and hence kappa_ell. This is precisely why kappa is the within-class varying
      object, and it gives a concrete, measurable one-step propagation rule:
      kappa_ell must be INVARIANT along horizontal steps and must CHANGE along
      vertical steps. That rule is a testable instrument check (STEP 3) and its
      failure would mean the level classification is wrong.
    survival_score: >-
      Survives arbitrarily long horizontal walks (crater walks) and dies at the
      first vertical step. The number of times it can die is v_ell(f), the
      ell-valuation of the conductor -- typically 0 or 1 for toy curves, which is
      the honest reason the effect size available here is small and why the
      priority is medium rather than high.

  mechanism: >-
    STEP 1 (implementation, shared) -- psi_ell over F_p for ell in {3,5,7,11,13};
    factor over F_p; enumerate products of irreducible factors of total degree
    (ell-1)/2; test each candidate root set for closure under the x-only group law;
    count the survivors. Output kappa_ell(E) and the kernel polynomials themselves.

    STEP 2 (class enumeration) -- for a small toy class, enumerate every curve in
    the class. At 16-20 field bits this is feasible by brute force over (a, b) with
    the fingerprint sieve of IDEA-20260807-c98c3d as a pre-screen and exact point
    counting as the confirmation. Record every curve's j-invariant and kappa vector.

    STEP 3 (structure validation, the instrument's own test) -- verify the volcano
    picture directly rather than assuming it: (i) build the ell-isogeny graph on the
    class from the extracted kernels; (ii) check that it decomposes into levels with
    the predicted degrees; (iii) check the propagation rule of the object_first
    block -- kappa_ell invariant along horizontal steps, changed along vertical
    ones; (iv) check that the number of levels equals v_ell(t^2 - 4p) up to the
    standard conductor bookkeeping, and record any discrepancy as a finding about
    the toy family rather than silently adjusting the model.

    STEP 4 (stratification) -- for each cost functional the campaign already
    measures, group the class's curves by kappa vector and report the
    between-stratum versus within-stratum variance ratio, with the matched nulls
    below. The functionals in scope for THIS record are only the ones that are
    cheap and already implemented in this harness: matched Pollard rho step count
    (harness/rho.py), BSGS operation count, and the transport cost per Elkies step
    from IDEA-20260807-053a55. Gröbner/Semaev solving-degree functionals belong to
    L1 and are explicitly NOT run here; this record hands L1 the strata.

    STEP 5 (the k-resample control, mandated by the lane) -- for every stratified
    measurement that involves points, resample k with the curve fixed and confirm
    the stratification result is unchanged. A stratification effect that moves when
    k is resampled is not a curve-level effect at all.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07 from the repository root:
      `grep -ril "volcano" ledger/ knowledge/ docs/ analysis/`;
      `grep -ril "Elkies\|Atkin" ledger/ knowledge/`;
      `grep -ri "conductor" analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md`;
      plus reads of DECOMPOSITION.md sections 3-5, EV-ICI-0bdaaa,
      DEC-20260804-d0c452, KN-TECH-028.
    results: >-
      "volcano" appears in DECOMPOSITION.md (lanes L2, L7, and T4's list of what
      varies within a class) and in the campaign's RQ records; it appears in NO
      evidence record, NO hypothesis, and NO knowledge entry. There is no recorded
      measurement of kappa_ell anywhere in this repository, and no record stratifies
      any cost functional by any within-class quantity. The Kohel / Fouquet-Morain
      volcano structure is not present as a KN-TECH entry.
    verdict: >-
      ADAPTATION. The volcano structure and the modular-polynomial-root count of
      rational ell-isogenies are standard and no mathematical novelty is claimed;
      the record relays them and marks the relayed parts [open] pending its own
      STEP 3 validation. What is new to this corpus is (i) reading the level off
      psi_ell's kernel factorisation rather than off a modular polynomial, which
      matters because Phi_ell for ell up to 13 has coefficients too large to be
      convenient in pure Python while psi_13 has degree 84 and is not, and (ii) the
      stratification protocol with its nulls. External novelty UNVERIFIED (no web
      search this session).

  null_object_control: >-
    MANDATORY AND SUPPLIED, three matched nulls with their decay parameters.
    NULL-1 (RANDOM STRATIFICATION): re-run the entire stratified analysis with the
    curves assigned to strata at random, preserving the stratum SIZE distribution
    exactly. The between-stratum variance under random assignment is the reference;
    any real effect must exceed it. DECAY PARAMETER: the number of random
    assignments (at least 1000 permutations) -- the permutation null's tail is what
    the observed statistic is scored against, and a p-value that does not stabilise
    as permutations grow means the statistic is not estimable.
    NULL-2 (DIFFERENT-CLASS NULL): the same measurement on curves of the SAME p but
    DIFFERENT classes, matched on N so that the rho and BSGS baselines are
    comparable. Between-class variance is the natural upper reference: if
    within-class between-stratum variance approaches between-class variance, the
    stratification is picking up class-level differences and the class enumeration
    is wrong.
    NULL-3 (THE CANONICAL L7 NULL): resample k with the curve fixed, at least 100
    resamples per curve, for every functional that touches a point. DECAY
    PARAMETER: number of resamples -- an apparent effect must not shrink like
    M^{-1/2}, and one that does is instance noise.
    PLANTED POSITIVE (blocking): inject a synthetic functional that DOES depend on
    kappa_ell by construction (e.g. a counter of extracted kernels) and confirm the
    stratification analysis detects it at the pre-registered effect size. An
    analysis that cannot see a planted stratum effect cannot report a null.

  assumptions:
    - >-
      A toy isogeny class at 16-20 field bits is small enough to enumerate
      exhaustively. This is the binding scale constraint: class size is the class
      number h(O), and the enumeration cost grows with p, so 24+ bits is likely out
      of reach for a FULL enumeration in pure Python and the design must degrade to
      a sampled enumeration with the sampling recorded.
    - >-
      ell <= 13, so deg psi_ell <= 84 and the factor-subset search is affordable.
      Stated as a budget constraint, not a mathematical one.
    - >-
      The volcano structure (levels, horizontal/vertical isogenies, kappa_ell
      determined by level) is RELAYED as standard and is marked [open] until
      STEP 3 confirms it on the enumerated toy classes. If STEP 3 disagrees with
      the relayed picture, the record's own measurement wins and the discrepancy is
      reported as a finding about the toy regime.
    - >-
      Most toy classes will have v_ell(f) = 0 for every ell in L, i.e. a
      single-level "volcano" with no vertical structure at all. Those classes have
      NO within-class variation in kappa and contribute nothing to the
      stratification. Finding classes with genuine depth is itself a search cost
      and is budgeted as STEP 2's dominant expense.

  proof_search_map:
    bottleneck: >-
      Enumerating a full isogeny class at a field size where the class is large
      enough for a stratified comparison to have statistical power, AND where at
      least one ell in L divides the conductor so that there is more than one level.
      Those two requirements pull in opposite directions at toy scale and their
      intersection is the real constraint on this proposal; STEP 2 is where the
      budget goes.
    baseline_embedding:
      parameter_slice: >-
        A class with v_ell(f) = 0 for all ell in L: a single-level class where the
        volcano is flat, kappa_ell is CONSTANT across the class, and the
        stratification must therefore report exactly one stratum and zero
        between-stratum variance. This is the degenerate boundary and it reproduces
        the trivial known answer.
      reproduction_check: >-
        Frozen fixture: one enumerated flat class with every curve's kappa vector
        recorded and asserted equal by exact integer comparison. If the pipeline
        reports more than one stratum on a flat class, the kernel counter is wrong
        and every stratification downstream is void.
    observation_collision:
      observable: >-
        The kernel-count vector kappa(E).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: many curves share a kappa vector -- every
        curve at the same level of every ell-volcano does. That collision is the
        object's lossiness and is the reason kappa is a STRATIFICATION variable and
        not an identifier. The collision must be measured (stratum sizes reported)
        rather than assumed, because a stratification into one giant stratum and
        several singletons has no power and would produce a meaningless null.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Rather than kappa_ell alone, the pair (kappa_ell, the multiset of degrees
          of the irreducible factors of psi_ell over F_p). The full factorisation
          type preserves more state than the kernel count and is what would survive
          a change of ell; if the kernel count shows no stratum effect, the
          factorisation type is the next-strongest R5 curve invariant to try before
          the lane is declared closed.
        predicted_gain: >-
          Resolution only. No attack gain, and the record says so: a finer
          k-independent invariant is still k-independent.
      - transform: observable_fiber
        proposed_object: >-
          Hold kappa fixed and vary the curve within the stratum; ask whether any
          intrinsic invariant distinguishes members of a stratum that also
          correlates with cost. If one exists, kappa was the wrong variable and the
          right one is that invariant.
        predicted_gain: >-
          A concrete successor variable if OUTCOME 1 fires, so the closure carries
          forward guidance rather than terminating the line.
    quantifier_order: >-
      Claimed: FORALL enumerated toy classes in the declared family, FORALL cost
      functionals in the declared (cheap, already-implemented) set, the
      between-stratum variance of the functional across kappa strata does not
      exceed the permutation null's pre-registered percentile. The strata depend on
      the class and on ell; the functional does not depend on k beyond instance
      noise, which NULL-3 controls. The dangerous weaker reading NOT claimed:
      "there exists a class and a functional showing a stratum effect", which
      cherry-picking over classes and functionals would produce by chance and which
      the permutation null exists to prevent.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On these enumerated toy classes, at these field sizes, for these cost
        functionals, the ell-volcano level explains no more variance than a random
        stratification of the same shape." It can NEVER certify anything about
        functionals not measured (in particular the Gröbner/Semaev functionals,
        which belong to L1), about larger classes, or about k.
      nearby_object_control: >-
        The nearby object where a stratum effect DOES exist by construction is the
        planted-positive functional (a kernel counter). A method that cannot
        distinguish the planted functional from a real cost functional has not
        demonstrated power, and its null is uninterpretable.
    proof_obligations:
      - claim: kappa_ell is constant on a flat (single-level) class.
        responsibility: baseline
      - claim: kappa_ell is invariant along horizontal steps and changes along vertical ones.
        responsibility: correctness
      - claim: The kernel-closure test accepts exactly the Galois-stable order-ell subgroups.
        responsibility: correctness
      - claim: The permutation null preserves stratum sizes exactly.
        responsibility: correctness
      - claim: The planted-positive functional is detected at the pre-registered effect size.
        responsibility: success_probability
      - claim: kappa_ell reads no point data.
        responsibility: scope

  predictions:
    - metric: >-
        kappa_ell across all curves of an enumerated FLAT class (v_ell(f) = 0)
      direction: different
      minimum_effect: >-
        Constant, on 100 percent of curves, for every ell in L. A variation on a
        flat class is an implementation error. BASIS - derivation from the relayed
        volcano picture; the flatness itself is verified from the exactly computed
        t^2 - 4p, so this is a KNOWN-ANSWER CALIBRATION rather than a discovery.
    - metric: >-
        Number of distinct kappa strata in an enumerated class with v_ell(f) >= 1
        for some ell in L
      direction: higher
      minimum_effect: >-
        At least 2. If no enumerated class of the declared family has more than one
        stratum, the stratification cannot be run at all and the honest report is a
        SCOPE outcome -- toy classes at these sizes lack volcano depth -- not a
        negative about the mechanism. This possibility is pre-registered because it
        is the most likely way the experiment fails to deliver.
    - metric: >-
        Between-stratum variance ratio of matched Pollard rho step count across
        kappa strata, against the 1000-permutation null
      direction: different
      minimum_effect: >-
        Predicted outcome is NO effect: the observed ratio inside the null's 95th
        percentile. An effect is declared only if the observed ratio exceeds the
        null's 99th percentile AND survives NULL-2 and NULL-3. BASIS - the
        prediction of no effect is DECOMPOSITION.md section 5 item 2, recorded
        there before any measurement; the percentile thresholds are PRE-REGISTERED
        and UNTESTED. Note the strong prior reason for no effect: rho's step count
        depends on N and on the walk's mixing, and N is a class invariant, so a
        stratum effect would have to come from mixing differences that the volcano
        level has no evident route to produce.
    - metric: >-
        Between-stratum variance ratio of transport cost per Elkies step across
        kappa strata
      direction: higher
      minimum_effect: >-
        THIS one is predicted to show an effect, and it is the record's internal
        positive control: a curve with more rational kernels at ell has more
        transport options and a different kernel-extraction cost, so transport cost
        SHOULD stratify by kappa. If even this does not stratify, the strata are not
        real and every null in the run set is void. Threshold: observed ratio above
        the permutation null's 99th percentile.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): state the k-independence (claim B) and the two-branch
      pre-registration (claim C).
      STAGE 1 (hours): implement the kernel counter on top of the shared psi_ell
      code; validate on a flat class (must give constant kappa).
      STAGE 2 (the budget sink, hours to a day): enumerate toy classes at 16-20
      field bits, searching for at least one class with v_ell(f) >= 1 for some
      ell in L. Use the c98c3d fingerprint sieve as the pre-screen. If no such
      class is found within budget, STOP and report the SCOPE outcome.
      STAGE 3 (hours): build the ell-isogeny graph, verify the level structure and
      the horizontal/vertical propagation rule.
      STAGE 4 (hours): stratified measurement of rho step count, BSGS operation
      count and transport cost, with the permutation null, the different-class null
      and the k-resample null.
      STAGE 5 (minutes): the planted-positive check.
      BUDGET: ell capped at 13 (deg psi_13 = 84); field sizes capped at 20 bits for
      the FULL enumeration and 24 bits for a sampled one, with the sampling recorded.
      Division polynomials beyond ell = 13 are outside this contract.
    controls:
      - flat-class calibration, kappa constant (blocking)
      - permutation null with preserved stratum sizes, >= 1000 permutations (blocking)
      - different-class null matched on N (blocking)
      - k-resample null with the curve fixed (blocking, mandated by RQ-TORS-8c7b79)
      - planted-positive kernel-counter functional (blocking)
      - transport-cost internal positive control (must stratify)
      - anomalous / smooth-order exclusion per KN-TECH-034 before any timing
    required_metrics:
      - kappa_ell per (curve, ell) with the kernel polynomials recorded
      - stratum sizes per class per ell
      - v_ell(t^2 - 4p) per class, and the observed number of levels
      - between- and within-stratum variance per functional, with permutation p-values
      - all three nulls on the identical pipeline
      - class enumeration completeness (full or sampled, with the sampling rule)

  falsification_conditions:
    - >-
      kappa_ell varies on a verified flat class. Kernel counter broken; nothing is
      reported.
    - >-
      kappa_ell changes along a verified HORIZONTAL isogeny step. Either the level
      classification or the transport is wrong; both are implicated and the line
      halts.
    - >-
      The planted-positive functional is not detected. The stratification analysis
      has no power and every null it produced is void, not negative.
    - >-
      Transport cost does not stratify by kappa. The strata are not capturing the
      structure they are defined to capture; the analysis is uninterpretable.
    - >-
      No enumerated class has more than one stratum within budget. SCOPE outcome:
      toy classes at these sizes lack volcano depth. Recorded as such, NOT as
      evidence that the level has no effect (AGENTS.md rule 6: negative evidence
      closes only the exact tested scope, and here nothing was tested).
    - >-
      Class enumeration at 20 bits exceeds the wall-clock budget. INFRASTRUCTURE
      outcome under AGENTS.md rule 5.

  confounders:
    - >-
      Stratum imbalance. A class split into one stratum of 40 curves and one of 2
      has essentially no power; the permutation null will report this correctly but
      the write-up must state stratum sizes with every p-value or the reader will
      over-read a null.
    - >-
      Multiple testing. Five primes times three functionals times several classes is
      a lot of tests; the permutation null must be applied per test AND a
      family-wise correction declared in advance, or a spurious 99th-percentile hit
      is guaranteed somewhere.
    - >-
      Class-size confounding with N. Different classes have different N, and rho
      cost scales as sqrt(N); NULL-2 must match on N or it will detect the trivial
      effect instead of the interesting one.
    - >-
      The ramified case ell | (t^2 - 4p) with ell not dividing the conductor is
      distinct from the volcano-depth case and must be classified separately, or
      "depth" will be attributed to classes that have none.
    - >-
      Toy-scale conductor rarity. v_ell(f) >= 1 requires ell^2 | (t^2 - 4p) in the
      relevant sense; at 16-20 bits with ell in {3,...,13} this is uncommon, which
      is the source of the SCOPE-outcome risk and is pre-registered rather than
      discovered.

  interpretation_limits:
    - >-
      Zero information about k, by construction, stated first.
    - >-
      A null here is scoped to the enumerated classes, the declared functionals, and
      toy field sizes. It does not close L2 by itself; it supplies L2's instrument
      and one of its measurements.
    - >-
      The volcano picture is relayed as standard and validated only to the extent
      STEP 3 validates it on the enumerated classes. Nothing here is a proof of the
      Kohel/Fouquet-Morain structure.
    - >-
      Gröbner and Semaev functionals are explicitly NOT measured here; a claim about
      them requires L1's machinery and L1's records.
    - >-
      claim_tier capped at toy per RQ-TORS-8c7b79.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the declared toy family, the fraction of isogeny classes with
        v_ell(f) >= 1 for at least one ell in {3,5,7,11,13} is large enough that
        STAGE 2 finds at least one such class within its budget -- concretely, at
        least 1 class in 20 enumerated.
      rigorous_support: >-
        Rigorous half: v_ell(f) >= 1 is a decidable arithmetic condition on
        t^2 - 4p = D_0 f^2, computable exactly once t is known, so there is no
        uncertainty for any individual class. Distributional half: this imitates
        the classical expectation that the conductor of Z[pi] behaves like the
        square part of a random integer of size ~sqrt(p), for which the density of
        divisibility by a small prime ell is ~1/ell^2 per prime by the standard
        squarefree-density heuristic. Summing 1/ell^2 over {3,5,7,11,13} gives
        roughly 0.111 + 0.040 + 0.020 + 0.008 + 0.006 ~ 0.185, i.e. about 1 class
        in 5. THAT NUMBER IS A HEURISTIC ARITHMETIC ESTIMATE MADE IN THIS RECORD,
        not a measurement and not a citation, and H1's threshold of 1 in 20 is set
        four times looser than it deliberately.
      validation_plan: >-
        SAMPLE: enumerate t over the Hasse interval for each declared p at 16, 18
        and 20 bits, factor t^2 - 4p exactly (affordable at these sizes with sympy),
        and compute v_ell(f) for every ell in L. This measures the class-level
        statistic WITHOUT enumerating curves, which is the shortcut that makes the
        validation cheap -- the expensive curve enumeration is only needed for
        classes that pass. COMPARISON DISTRIBUTION: the empirical fraction against
        the 1/ell^2 heuristic sum above, per ell and in aggregate. TAIL CHECK: the
        maximum observed v_ell(f) across all classes, since a class with
        v_ell(f) >= 2 would have three volcano levels and much more stratification
        power; its existence or absence directly sizes the experiment.
        TOY SCALE ONLY, LABELLED AS SUCH: this is a statement about 16-20 bit
        discriminants and does not describe cryptographic-size conductors.

  reachability_gate: >-
    REQUIRED AND ANSWERED IN ADVANCE, because OUTCOME 2 would otherwise be
    misreported as an attack. IS A GOOD LEVEL REACHABLE, AND AT WHAT COST?
    (i) The level is changed ONLY by vertical (ascending or descending) ell-isogenies,
    and the number of levels available is v_ell(f), which is 0 or 1 for most toy
    classes and small even when non-zero. So the reachable variation is bounded by
    the conductor's ell-valuation and is typically nil -- the goodness, if any, has
    a tiny dynamic range.
    (ii) Reaching a specified level is LOCAL and CHEAP when it exists: descending
    one level costs one Vélu step, and detecting the level costs one kappa_ell
    evaluation, which is O(polylog p). This puts the level squarely on the
    FAVOURABLE side of T5's dichotomy -- goodness that is locally detectable at each
    step of a walk, not goodness identified only by a global address.
    (iii) THEREFORE, if OUTCOME 2 fires, the correct next question is NOT
    reachability (which is cheap) but MAGNITUDE: the level takes at most v_ell(f)+1
    values, so any cost benefit is bounded by the spread across that handful of
    values and is a CONSTANT factor, never an exponent. This is stated before the
    measurement so that a stratum effect cannot be written up as an exponent claim.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and by the reachability analysis above none is
      available from this object: the level takes O(1) values, so any effect it
      carries is a constant factor by construction. Measurement cost is
      O(polylog p) per (curve, ell) for kappa, dominated by the class enumeration
      in STAGE 2.
    memory_exponent: >-
      O(polylog p) per curve; the class enumeration's memory is O(class size), which
      at toy scale is small.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) operations and
      O(1) memory per processor (KN-TECH-001, KN-TECH-006); automorphism-discounted
      by at most sqrt(|Aut|) on CM curves (KN-TECH-018); BSGS at 2*sqrt(N) time and
      sqrt(N) memory (KN-TECH-031); Pohlig-Hellman fixing N (KN-TECH-030). Nothing
      here moves any of them, and the constant-factor ceiling above says nothing
      here could.
    hidden_overhead: >-
      The stratification's real cost is hidden in STAGE 2: finding a class with
      volcano depth is a search whose success probability is H1's subject, and a
      failed search yields a SCOPE outcome rather than a result. That risk is the
      dominant honest cost of this proposal and is disclosed rather than buried in
      a budget line.
    tradeoff_note: >-
      Not an attack; no cryptanalytic tradeoff. The only tradeoff is experimental:
      full class enumeration (high power, 16-20 bits) versus sampled enumeration
      (lower power, 24 bits), and the design declares which was used per cell.

  dominated_by: >-
    AS AN ATTACK: mounts none, and its reachability analysis shows none is available
    -- an O(1)-valued curve invariant can carry at most a constant factor. Dominated
    on every axis by every row of the prime-field frontier, checked individually:
    parallel rho with distinguished points (0.886*sqrt(N) group operations, O(1)
    memory per processor, linear parallel speedup; KN-TECH-001, KN-TECH-006); the
    automorphism-discounted rho variant on CM curves, whose own discount is at most
    sqrt(6) and is already a constant (KN-TECH-018); BSGS (2*sqrt(N) time, sqrt(N)
    memory; KN-TECH-031); Pohlig-Hellman (KN-TECH-030). Data/query axis: no oracle,
    no solve. AS A MEASUREMENT: nothing in this corpus measures kappa_ell or
    stratifies by it, so on the instrument axis it is not dominated; it is the first
    such measurement, and its value is that L2's pre-registered prediction is
    currently untestable without it.
  sota_delta: >-
    Zero speedup against any attack baseline, and a stated ceiling explaining why
    zero is the only available answer: kappa_ell takes at most v_ell(f)+1 values,
    typically 1 or 2 at toy scale, so it could at best carry a constant factor even
    if OUTCOME 2 fired. Measurement delta, quantified: it converts L2's
    pre-registered "no effect stratified by volcano level" from an untestable
    expectation into a permutation-tested statement over an enumerated class, at a
    cost of one kernel counter on top of machinery IDEA-20260807-053a55 already
    builds, plus the STAGE 2 class-enumeration search whose success rate H1 estimates
    at about 1 class in 5 and whose acceptance threshold is set at 1 in 20.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that kappa_ell is correctly computable from psi_ell's factorisation at
    ell <= 7 and 0.6 at ell in {11, 13}, where the factor-subset search is the
    risk. 0.5 that STAGE 2 finds a class with genuine volcano depth within budget
    at 16-20 bits -- H1 estimates about 1 in 5 classes qualify, but the class
    enumeration itself is the expensive part and a bad draw wastes the budget.
    Conditional on strata existing: 0.85 OUTCOME 1 (no stratum effect on rho or
    BSGS, confirming DECOMPOSITION.md section 5 item 2), 0.05 OUTCOME 2, 0.10
    inconclusive on power. Unconditionally, the single most likely result is the
    SCOPE outcome -- no depth found -- which is why this is medium priority and why
    the H1 validation plan is designed to be run FIRST and cheaply, from traces
    alone, before any curve enumeration is attempted.

