idea:
  id: IDEA-20260815-bc26a3
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    MEASURE THE PROGRAM'S OWN FALSE-POSITIVE RATE: replay every ECDLP
    mechanism screen in the ledger against synthetic null instances and
    report how often the screen reported structure that was not there
  class: measurement

  claim: >-
    This program has run dozens of mechanism screens and reports a long run
    of negatives. Under docs/inventor-protocol.md section 4 those are
    fatigue reports whose honest status is unverified, and the reason they
    cannot be upgraded is that NOBODY KNOWS THE SCREENS' ERROR RATES. A
    screen that never fires on a planted positive is worthless, and a screen
    that fires on pure noise has been generating false closures. This record
    replays the existing screens against (a) planted-positive instances and
    (b) matched null instances, and reports per-screen sensitivity and
    false-positive rate. It converts a pile of negatives into negatives with
    known power.

  mechanism: >-
    Inventory the mechanism screens with reusable implementations. For each,
    construct a planted positive of the structure it claims to detect and a
    matched null with that structure absent. Run both. Report sensitivity,
    false-positive rate, and the effect size each screen could have detected
    at the sample size it actually used.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep for 'false positive rate', 'sensitivity', 'statistical power',
      'screen power'; read of the 2026-07-20 completeness sweep framing
      and KN-OPEN-019's saturation discussion.
    results: >-
      Null controls are widely required per-record, but no record measures
      the ERROR RATES of the screens themselves across the corpus, and no
      record reports the minimum detectable effect size of a completed
      screen.
    verdict: >-
      UNVERIFIED. Power analysis is elementary statistics; applying it
      retrospectively across a research corpus is what is new here and it
      directly addresses the program's own recorded saturation worry.

  object_first_candidate:
    tracked_object: >-
      THE SCREENS THEMSELVES, treated as measuring instruments with error
      rates rather than as procedures that returned verdicts.
    lossiness: >-
      A screen projects an instance to a binary verdict; the record
      measures what that projection discards.
    propagation: >-
      Not applicable; instrument metrology.
    survival_score: >-
      Survives for screens with reusable implementations. Screens whose
      code is gone are listed as unmeasurable, which is itself a
      reportable fact about the corpus.

  null_object_control: >-
    THE RECORD IS ENTIRELY NULLS BY CONSTRUCTION. Its own control is a
    screen with KNOWN power -- a deliberately trivial detector with
    analytically computable sensitivity -- which the harness must reproduce;
    failure means the harness, not the screens, is being measured.

  discriminated_from:
    - >-
        The per-record null controls already required. NOT A SUBSTITUTE:
        those check one record's measurement; this measures the error rate
        of the screen across instances and reports minimum detectable
        effect size, which no single record's null does.
    - >-
        KN-OPEN-019. COMPLEMENTARY: that asks whether the enumeration is
        closed; this asks whether the negatives populating it were powered
        enough to mean anything.

  assumptions:
    - >-
        Screen implementations are recoverable and runnable. Where not,
        the screen is listed unmeasurable rather than assumed adequate.
    - >-
        Planted positives can be constructed for each screen's claimed
        structure. Where a screen's target structure cannot be planted,
        the screen is untestable and that is a serious finding about it.

  predictions:
    - metric: >-
        harness reproduction of a known-power trivial detector
      direction: different
      minimum_effect: >-
        FORCED to match the analytic value, else the harness is what is
        being measured.
    - metric: >-
        per-screen sensitivity to planted positives
      direction: different
      minimum_effect: >-
        No value pre-committed. Screens failing to detect their own
        planted structure are the headline result.
    - metric: >-
        per-screen false-positive rate on matched nulls
      direction: different
      minimum_effect: >-
        A rate materially above the nominal level means past negatives
        from that screen were under-powered and past positives may have
        been noise.
    - metric: >-
        count of screens that are unmeasurable or untestable
      direction: different
      minimum_effect: >-
        Reported explicitly; a large count bounds what the audit can
        conclude.

  minimal_test:
    design: >-
      Start with the five most-cited screens rather than all of them. That
      alone establishes whether the corpus has a power problem and is a
      small fraction of a full audit.
    controls:
      - >-
          Known-power trivial detector reproducing its analytic value.
      - >-
          Matched nulls per screen.
      - >-
          Planted positives per screen.
      - >-
          Unmeasurable and untestable screens listed rather than
          skipped.
    required_metrics:
      - >-
          Sensitivity and false-positive rate per screen.
      - >-
          Minimum detectable effect size at the sample size actually
          used.
      - >-
          Counts of unmeasurable and untestable screens.
      - >-
          Harness self-check outcome.

  falsification_conditions:
    - >-
        The harness misreports the known-power detector. Harness bug; no
        screen number admissible.
    - >-
        Most screens are unmeasurable. The audit cannot conclude and must
        say so.
    - >-
        Screens detect their planted positives and hold their nominal
        false-positive rates. The corpus's negatives are better founded
        than the saturation worry suggests -- a reassuring and useful
        outcome.
    - >-
        Screens fail to detect planted positives. Past negatives from them
        are uninformative and must be re-labelled unverified.

  confounders:
    - >-
        PLANTED-POSITIVE MISMATCH: planting a structure slightly different
        from what the screen targets manufactures a false insensitivity
        result and would unfairly discredit a sound screen.
    - >-
        RETROSPECTIVE SAMPLE SIZES: screens were run at whatever size the
        campaign afforded, so low power may reflect budget rather than
        design and the report must separate the two.

  interpretation_limits:
    - >-
        Measures instruments, not the ECDLP. No mathematical claim
        follows.
    - >-
        Scoped to screens with recoverable implementations.
    - >-
        A low-power finding re-labels past negatives as unverified; it
        does not make them positive.

  heuristic_assumptions:
    - id: HEUR-SCREEN-POW-1
      statement: >-
        For each audited screen, a planted positive constructed from the
        screen's own stated target structure is detected at the sample
        size the screen originally used.
      rigorous_support: >-
        The rigorous ingredient is standard power analysis for the
        screen's test statistic where its null distribution is known
        analytically. THE GAP: for most of these screens the null
        distribution is empirical rather than analytic, so power must
        itself be estimated by simulation and inherits that simulation's
        error.
      falsification_condition: >-
        A screen failing to detect its own planted target structure at
        its original sample size.
      validation_plan: >-
        SAMPLE: 5 most-cited screens x >= 100 planted positives x >= 100
        matched nulls. COMPARISON: empirical sensitivity and false-
        positive rate against nominal. TAIL CHECK: screens closest to
        the nominal boundary, reported individually. TRANSFER: none;
        each screen is audited separately.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is re-running existing screens on synthetic
      instances, which is bounded by their original per-run cost.
    memory_exponent: >-
      Same profile as the audited screens.
    best_known: >-
      No incumbent power audit exists here; per-record nulls are the
      closest artifact and answer a narrower question.
    hidden_overhead: >-
      Recovering and re-running old screen implementations is where the
      effort actually goes, and it is easy to underestimate.
    tradeoff_note: >-
      Auditing more screens buys corpus-level conclusions and costs
      implementation archaeology; the record starts with five.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed) --
    nothing is mounted, so no row of the ECDLP frontier dominates or is
    dominated. As metrology: not dominated, since no power audit exists
    here. As statistics: entirely standard power analysis, dominated by the
    methodological literature. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: per-screen sensitivity and
    false-positive rates where the program currently has none; minimum
    detectable effect sizes for completed screens; and an explicit count of
    screens that cannot be tested at all, which bounds how much the corpus's
    saturation reports can be trusted.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that five screen implementations are recoverable. 0.85 that planted
    positives are constructible for most. 0.5 that at least one widely cited
    screen turns out materially under-powered, which would be the finding
    with the largest effect on how the corpus's negatives are read.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-002
    - KN-OPEN-019
    - KN-TECH-056
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
