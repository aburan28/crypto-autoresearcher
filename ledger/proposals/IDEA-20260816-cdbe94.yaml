idea:
  id: IDEA-20260816-cdbe94
  question_id: RQ-FAEST-001
  added: '2026-08-16'
  title: Treat the punctured seed tree's revealed-node antichain as the tracked object and measure
    the distribution of its SHAPE, the per-level cardinality profile, against the hidden-leaf set
    that produced it, asking how many distinct hidden sets share each shape and what that many-to-one
    collapse costs the size accounting.
  class: representation
  claim: '(A) THE SHAPE IS A GENUINE LOSSY PROJECTION AND SIGNATURE SIZE READS ONLY THE SHAPE. For
    a GGM-style binary seed tree with L leaves, opening all but a hidden set H of leaves reveals a
    uniquely determined antichain of internal nodes. The number of bytes the signature spends on that
    opening depends only on the antichain''s CARDINALITY, and a slightly finer object, the per-level
    cardinality profile, determines the cardinality. Part (A) claims the map from hidden sets to profiles
    is strictly many-to-one for every L at least 8 and every hidden-set size at least 2, with the
    fibre sizes computable exactly by enumeration at L up to 1024. (B) THE PROFILE DISTRIBUTION IS
    PARADIGM-LEVEL AND COMPUTABLE. Under a uniform hidden set of size t, the induced distribution
    over profiles is a function of (L, t) and the tree''s branching structure alone, with no dependence
    on the hash function, the field, the relation or the scheme. Part (B) claims this distribution
    has a computable mean and a variance that does not vanish, so opening size is a genuine random
    variable and not a constant, and claims the coefficient of variation is at least one part in fifty
    at t of order log L. (C) THE ACCOUNTING CONSEQUENCE IS A TAIL, NOT A MEAN. If a scheme budgets
    a fixed opening-size allowance, the fraction of hidden sets exceeding it is exactly the profile
    distribution''s tail, and that fraction is computable rather than assumed. Part (C) claims that
    fraction is measurable to five significant figures by exhaustive enumeration at L up to 1024 and
    t up to 6, and by exact dynamic programming beyond. (D) WHAT IS NOT CLAIMED. No forgery, no break,
    no speedup, no security consequence, and NO statement about what FAEST, SDitH or MQOM actually
    budget, since no specification has been read. It is NOT claimed that a hidden set exceeding an
    allowance is exploitable; the consequence of exceeding an allowance is a design question this
    record does not touch. It is also NOT claimed that the many-to-one collapse leaks anything: the
    fibre count is an accounting quantity here, not an information-theoretic attack surface.'
  mechanism: 'STAGE 1 implements the tree, the puncturing rule, and the antichain extraction: given
    hidden leaf set H, the revealed antichain is the set of nodes whose subtree misses H entirely
    but whose parent''s subtree does not. STAGE 2 verifies the extraction is correct by round-trip:
    from the antichain, recompute which leaves are derivable, and require exactly the complement of
    H, for every H in an exhaustive sweep at small L. This round-trip is the instrument''s correctness
    gate and it is exhaustive, not sampled. STAGE 3 enumerates all hidden sets of size t at L up to
    1024 for t up to 6, computes each profile, and builds the fibre-size histogram. STAGE 4 computes
    the same profile distribution by dynamic programming over tree levels, and requires exact agreement
    with the enumeration wherever both run. Two independent computations of the same distribution
    is the second gate. STAGE 5 runs the null object: a random ANTICHAIN of the same cardinality drawn
    directly from the set of antichains, without any hidden set behind it, and asks whether its profile
    distribution matches. If it does, then the profile carries no information about the hidden-set
    structure and the signal arm has measured a property of antichains in binary trees rather than
    of puncturing, which is a controlled null. STAGE 6 sweeps branching factor 2, 4 and 8 to separate
    binary-tree artifacts from puncturing structure, and sweeps one-tree-of-tau-times-N-leaves against
    tau-trees-of-N-leaves at matched total leaves, which is the paradigm-versus-design-choice axis.'
  novelty_status: unverified
  novelty_screen:
    method: 'grep -rli in ledger/proposals for: seed tree, seed-tree, GGM tree, puncturable, MPCitH,
      VOLE, opening. Read titles and class of IDEA-20260805-bf6448, IDEA-20260808-aa551f, IDEA-20260805-38048d,
      IDEA-20260805-cec9b6, IDEA-20260805-7abf04, IDEA-20260808-721f2b, IDEA-20260813-2caec5. Read
      RQ-FAEST-001 in full. Grepped ledger/hypotheses for FAEST records and listed them.'
    results: 'IDEA-20260805-38048d is the nearest: it identifies a bAVC opening-size filter (an inequality
      on revealed nodes) and argues the filter CONDITIONS the challenge space adversarially through
      interleaving of tau instances. Its object is the conditioned challenge distribution. IDEA-20260808-aa551f
      counts the challenge space of one merged GGM tree of tau times N leaves against N to the tau,
      an exact combinatorial count. IDEA-20260805-bf6448 is grinding slack, not tree structure. IDEA-20260813-2caec5,
      hypercube opening-incidence rank deficit, works with an incidence matrix under view reuse in
      the SDitH lane. No record was found whose object is the revealed-node ANTICHAIN or its per-level
      cardinality profile, and none computes fibre sizes of the hidden-set-to-profile map.'
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; opening-size distributions
      for punctured GGM trees may well be standard there. Assembled from known parts: GGM puncturing,
      antichain extraction and dynamic programming over tree levels are all elementary. Claimed new
      relative to THIS repository only: the per-level cardinality PROFILE as the tracked object, its
      fibre-size histogram over hidden sets, and the random-antichain null that separates properties
      of puncturing from properties of binary-tree antichains. IDEA-20260805-38048d shares the opening-size
      inequality but treats it as a filter on challenges rather than as a distribution to be measured.'
  object_first_candidate:
    tracked_object: 'The per-level cardinality profile of the revealed-node antichain: the vector
      (c_1, ..., c_d) where c_i is the number of revealed nodes at depth i, followed as leaves are
      hidden one at a time.'
    lossiness: 'Genuinely lossy, and the loss is the point. The profile discards WHICH nodes are revealed
      and retains only how many per level; it discards every seed value, the hash function, the salt,
      the ordering of the hidden leaves, and the identity of the hidden set. What survives propagates
      because the size accounting is a linear functional of the profile alone: bytes equal seed-length
      times the sum of c_i. The discard is compatible with the target operation, since hiding one
      more leaf changes the profile by a rule that reads only the profile plus the new leaf''s path
      relative to the already-hidden set, and the sweep measures exactly how often that locality holds.'
    propagation: 'One step of the target operation is hiding one additional leaf. Under it, the antichain
      loses every node on the new leaf''s root path that was previously revealed, and gains the siblings
      of those nodes that are not themselves ancestors of already-hidden leaves. On the profile this
      is: subtract one at each level where a revealed ancestor existed, add one at each level where
      a new sibling appears. The net change is bounded by the tree depth, so the profile performs
      a bounded walk, and the walk''s increments are what the enumeration tabulates.'
    survival_score: 'The profile determines the byte count exactly, always. What dissolves is its
      determinacy given only t: at t equal to 1 the profile is a constant (depth nodes revealed),
      at small t it concentrates, and by t of order L/2 the profile is nearly deterministic again
      by saturation. The interesting regime is the intermediate one, and the survival number reported
      is the largest t at which the profile distribution''s support size exceeds one, together with
      the t at which its coefficient of variation is maximal. Both are read directly off the enumeration.'
  null_object_control: A random antichain of the same cardinality drawn uniformly from the set of
    all antichains of that cardinality in the same tree, WITHOUT any hidden set behind it, pushed
    through the identical profile computation in the same invocation. For the signal arm to mean anything,
    the puncturing-induced profile distribution must differ from the random-antichain profile distribution
    by more than the sampling error, measured by total variation distance with an exact confidence
    bound. If the two coincide, the measurement has characterized antichains in binary trees, not
    puncturing, and the result is recorded as a controlled null.
  discriminated_from:
  - 'IDEA-20260805-38048d, the bAVC opening-size filter conditioning the challenge space: it takes
    the size inequality as given and studies its effect on challenge selection. This measures the
    size distribution itself and its fibre structure, and does not touch challenge selection at all.'
  - 'IDEA-20260808-aa551f, one merged GGM tree challenge-space cardinality: a single exact count of
    a challenge space, not a distribution over openings. The merged-versus-independent axis appears
    here only as one sweep dimension among several.'
  - 'IDEA-20260813-2caec5, hypercube opening-incidence rank deficit under view reuse: a linear-algebraic
    rank object over an incidence matrix in the SDitH hypercube; no rank is computed here and no view
    reuse is modelled.'
  - A straightforward expected-opening-size calculation. That returns a mean; this returns the full
    distribution, its tail, and the fibre-size histogram of the hidden-set-to-profile map, which a
    mean cannot supply.
  - 'Any proposal about seed-tree seed VALUES or their collision structure. This record deliberately
    never evaluates a hash: the tree is purely combinatorial here, and the value-level question is
    a separate record.'
  assumptions:
  - The tree is a complete regular tree of the declared branching factor with the standard puncturing
    rule (reveal maximal subtrees disjoint from the hidden set). Variant puncturing rules change the
    antichain and are handled by re-running rather than by argument.
  - Hidden sets are uniform of size t. Non-uniform hidden-set distributions induced by a real challenge-derivation
    are outside this record and are named as such.
  - Enumeration at L up to 1024 and t up to 6 is affordable, and the dynamic program is correct beyond
    it. Agreement between the two wherever both run is the gate.
  - Seed length is a constant number of bytes per revealed node, so bytes are proportional to antichain
    cardinality. Where a scheme packs differently, the linear functional changes but the profile object
    does not.
  - No hash function is evaluated, so no assumption about hash behaviour is made or needed.
  predictions:
  - metric: maximum fibre size of the hidden-set-to-profile map at L equal to 256, t equal to 4
    direction: higher
    minimum_effect: 2
  - metric: coefficient of variation of antichain cardinality at t of order log L
    direction: higher
    minimum_effect: 0.02
  - metric: total variation distance between the puncturing-induced profile distribution and the random-antichain
      null at matched cardinality
    direction: higher
    minimum_effect: 0.05
  - metric: disagreement between exhaustive enumeration and the dynamic program wherever both run
    direction: lower
    minimum_effect: 0
  minimal_test:
    design: 'Set branching factor 2, L equal to 256, t equal to 3. Enumerate all C(256,3) equals 2763520
      hidden sets, extract each antichain by the maximal-disjoint-subtree rule, record its per-level
      profile, and build two tables: the profile histogram and the fibre-size histogram. Verify every
      antichain by round-trip reconstruction of the derivable leaf set. Draw the same number of uniform
      random antichains of matched cardinality, compute their profiles through the identical function,
      and report the total variation distance between the two profile distributions with an exact
      binomial confidence bound. Independently compute the profile distribution by a level-wise dynamic
      program and require exact agreement. This is a few minutes on one core, evaluates no hash, and
      answers three things at once: whether the map is many-to-one, whether the size is a genuine
      random variable, and whether puncturing structure is distinguishable from generic antichain
      structure.'
    controls:
    - Random-antichain null at matched cardinality, same invocation, same profile function.
    - Round-trip reconstruction of the derivable leaf set from every antichain, exhaustively at small
      L.
    - Dynamic program computing the same distribution independently of the enumeration.
    - t equal to 1, where the profile is a known constant equal to the tree depth for branching factor
      2; must be reproduced exactly.
    - Branching factor sweep (2, 4, 8) to separate binary-tree artifacts from puncturing structure.
    - One-tree versus tau-trees at matched total leaves, to place the effect on the paradigm axis
      or the design-choice axis.
    required_metrics:
    - profile distribution over hidden sets, per (L, t, branching factor)
    - antichain cardinality mean, variance and coefficient of variation
    - fibre-size histogram of the hidden-set-to-profile map, with maximum and median fibre size
    - upper tail fraction exceeding each candidate allowance
    - total variation distance to the random-antichain null with a confidence bound
    - enumeration-versus-dynamic-program disagreement
    - round-trip reconstruction failure count, which must be zero
  falsification_conditions:
  - The map from hidden sets to profiles is injective at every tested (L, t), falsifying claim (A)
    and making the profile a change of coordinates rather than a lossy projection.
  - Antichain cardinality is constant given t, so the coefficient of variation is zero and opening
    size is not a random variable, falsifying claim (B).
  - The random-antichain null reproduces the puncturing-induced profile distribution within sampling
    error, showing the measurement characterizes antichains and not puncturing.
  - The dynamic program disagrees with the exhaustive enumeration anywhere both run.
  - Round-trip reconstruction fails for any antichain, voiding the extraction rule.
  - The t-equal-1 constant is not reproduced.
  confounders:
  - Branching factor 2 is a special case whose antichain combinatorics may be atypical. Mitigated
    by the branching-factor sweep.
  - Uniform hidden sets are not what a real challenge derivation produces; a conditioned hidden-set
    distribution would change every number. Stated as a scope limit, and the uniform case is reported
    as the uniform case.
  - Enumeration at t up to 6 may sit entirely in the concentration regime, hiding the interesting
    intermediate behaviour. Mitigated by using the dynamic program to reach larger t and by reporting
    the coefficient of variation as a function of t rather than at one point.
  - The random-antichain null is drawn uniformly over antichains of matched cardinality, and the choice
    of that reference measure does real work. Mitigated by reporting a second null drawn uniformly
    over antichains of any cardinality, conditioned afterwards.
  interpretation_limits:
  - Everything holds for uniform hidden sets in complete regular trees under the declared puncturing
    rule. Real openings are not uniform.
  - No statement is made about FAEST, SDitH or MQOM allowances, since no specification has been read;
    candidate allowances are swept as a range, not quoted.
  - A measurable tail fraction is an accounting quantity. It is NOT a claim that exceeding an allowance
    is exploitable, and no such consequence is modelled here.
  - No hash is evaluated, so nothing here bears on seed-value behaviour, collisions, or the commitment
    layer.
  target_complexity:
    time_exponent: No attack exponent is claimed. Enumeration is C(L, t) profile extractions, each
      O(t times depth); the dynamic program is O(L times depth times t).
    memory_exponent: No attack exponent is claimed. Memory is O(number of distinct profiles), which
      is small.
    best_known: The incumbent is whatever fixed opening-size allowance a scheme budgets, which within
      this repository appears only as the bAVC filter inequality described in IDEA-20260805-38048d.
      No external incumbent is asserted.
    hidden_overhead: 'The lower-order term that hides here is the puncturing rule itself: a scheme
      that reveals along a different rule produces a different antichain, and the entire table must
      be recomputed. Human cost hides in agreeing which rule to model, which is a specification-reading
      task this environment cannot perform.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data axes: this record places
    no point on any of them, since it produces no attack and evaluates no cryptographic primitive.'
  sota_delta: no attack; conceptual/measurement contribution only
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that the hidden-set-to-profile map is strictly many-to-one
    for L at least 8 and t at least 2: 0.9, this is close to a counting certainty since profiles are
    far fewer than hidden sets. Part (B), that the coefficient of variation is at least one part in
    fifty at t of order log L: 0.55, the concentration regime may already have set in and the threshold
    is a genuine guess. Part (C), that the tail fraction is measurable to five significant figures
    by the declared means: 0.75, limited by whether the dynamic program is correct beyond the enumerable
    range. The random-antichain null distinguishing puncturing from generic antichains: 0.6, and a
    null result there is the single most likely way this record ends.'
