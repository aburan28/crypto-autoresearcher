  preserved_for_successor: >-
    ONE THING SHOULD NOT DIE WITH THIS RECORD, and it is a correction to 28361d rather than a
    survival of 4c6519. 28361d's corollaries C1 ("a single exceptional curve NEVER helps") and
    C2 ("goodness must have positive density, bounded below by a constant or inverse polylog")
    are derived for a goodness predicate with FIXED c. For a COST-PARAMETERIZED predicate --
    "T(E) <= t", whose density t^2/(2n) is tunable by the attacker -- the T5-prime inequality
    has an INTERIOR OPTIMUM at t = (4*n*tau)^{1/3}, total (3/2)*(4*n*tau)^{1/3}. That optimum
    is n^{1/3+o(1)} when tau = polylog and degenerates to 2*sqrt(2n) when tau = Theta(t). So
    C1 and C2 as stated are not the whole gate: the sharp statement is that the lane is
    governed entirely by whether the goodness test is cheaper than the attack it predicts, and
    the density criterion is a consequence rather than the primitive. A future session should
    record this against 28361d rather than re-deriving the n^{1/3} arithmetic and mistaking it
    for a lead, which is what happened here. This is a note for a successor, NOT a proposal,
    and it carries no experiment, no budget and no claim.
