  withdrawn_at: '2026-08-17'
  withdrawn_by: idea-generator
  claim: >-
    WITHDRAWN. The original claim was: the F_p-isogeny class re-randomizes the rho walk's
    functional graph at poly cost while preserving the scalar exactly, so IF a poly-time
    curve invariant predicts rho collision time within a class, THEN S*C + sqrt(2n/S)
    optimizes to n^{1/3+o(1)} time at polylog memory. That claim is not withdrawn as WRONG.
    It is withdrawn as ALREADY ON FILE, in two pieces, and the composition is not enough to
    justify a third record.
  mechanism: >-
    THE RULING, WITH THE REASONING THE COORDINATOR ASKED ME TO CHECK RATHER THAN ADOPT.

    The coordinator proposed that IDEA-20260807-0afbab closes only transfer to a curve of
    LOWER DLP COMPLEXITY, enumerating complexity invariants (anomalous, MOV, embedding
    degree, GHS, GLV), and that "rho collision time under a particular iteration map" is not
    in that list, so "DLP difficulty is uniform" does not entail "the functional graph of a
    given walk is uniform". As a point of logic that is correct. As a reading of 0afbab it is
    not, and reading the record settles it.

    0afbab's heuristic H1 states, verbatim: "DLP difficulty depends only on (N, p, embedding
    degree, CM discriminant), not on the j-invariant or Weierstrass model." Its validation
    plan states: "At toy scale (bits=20), generate 100 curves in the same isogeny class (same
    trace t). Run Pollard rho on each and verify that the step count is the same (up to
    constant factors)." Its required_metrics are within_class_step_count_variance,
    correlation_with_j and correlation_with_conductor. Its falsification condition is: "If the
    variance of step counts across the isogeny class is >> O(1) and correlates with
    j-invariant or conductor, then DLP difficulty is NOT uniform within the class, and a
    within-class transfer might be viable."

    That IS the measurement 4c6519 proposed. 0afbab does not merely enumerate complexity
    invariants; it explicitly measures rho step-count variance across a class and its
    correlation with a curve invariant, and it pre-registers the exact two-branch reading
    4c6519 offered. The proposed distinction therefore does not rescue the idea.

    THE SECOND COLLISION IS EVEN TIGHTER, AND IT IS THE COST SIDE. IDEA-20260808-28361d's
    T5-prime inequality prices a walk-and-test attacker at (h/g)*tau + c against
    0.886*sqrt(N/r), with g the number of good curves, tau the per-step isogeny plus goodness
    test cost, and c the attack cost on a good curve. Instantiate its goodness predicate as
    "T(E) <= t": the birthday law gives density g/h = t^2/(2n), so h/g = 2n/t^2, and c = t.
    Total = (2n/t^2)*tau + t, minimized at t = (4*n*tau)^{1/3} with total
    (3/2)*(4*n*tau)^{1/3}. At tau = polylog that is n^{1/3+o(1)} -- 4c6519's headline, derived
    from 28361d's inequality with one substitution. And the closure is immediate in the same
    framework: the goodness test for "T(E) <= t" IS running rho for t steps, so tau = Theta(t),
    whence total = (2n/t^2)*t + t = 2n/t + t, minimized at t = sqrt(2n) for total 2*sqrt(2n) --
    exactly rho. The entire lane collapses to one number, tau, and whether tau is O(1) or
    Theta(t) is precisely 0afbab's H1.

    CONCLUSION: 4c6519 = 0afbab's H1 and minimal test (the measurement) composed with
    28361d's T5-prime (the cost gate). Both are on file, dated eight and nine days earlier.
    RQ-ECDLP-002's own motivation names duplication as the most likely way this task fails,
    and filing this would be that failure. Withdrawn.
