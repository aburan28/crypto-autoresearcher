idea:
  id: IDEA-20260801-013
  question_id: RQ-MAYO-001
  title: >-
    Whip cost versus matched UOV: controlled experiment on the
    mayonnaise-map whipping overhead at toy parameters
  class: control
  claim: >-
    MAYO's whipping (the mayonnaise map) costs security relative to a matched
    plain UOV instance: a controlled experiment at toy parameters, comparing
    MAYO-like whip-based public keys to plain-UOV keys of matched dimension,
    can measure the whipping overhead's effect on the best-known key-recovery
    attack cost. If the whipped instance is attackable at a materially lower
    cost than the matched plain UOV instance, the whipping cost is real; if
    the costs are equal within tolerance, whipping is security-neutral at toy
    scale.
  mechanism: >-
    Whipping makes the public key's quadratic form sparse-structured via the
    mayonnaise map; the attack question is whether the structure leaks the
    hidden oil subspace faster than in plain UOV. At toy parameters, the
    best-known attack (e.g., MinRank- or oil-space-recovery-style) can be
    run against both instance types with matched dimension and measured cost;
    the ratio is the whip overhead.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal runs a matched whip-vs-plain-UOV toy control in
        this program.
    conclusion: >-
      Control experiment; novelty unverified against full literature, which
      is the point of the control.
  assumptions:
    - Toy parameters permit matched MAYO-like and plain-UOV instances.
    - The best-known attack at toy sizes is implementable and comparable.
  predictions:
    - metric: whip_vs_plain_uov_attack_cost_ratio
      direction: different
      minimum_effect: >-
        A ratio outside [0.5, 2] at the largest toy size is a measurable
        whipping overhead (cost below plain UOV) or benefit.
  minimal_test:
    design: >-
      Build matched toy instances (same field, same number of variables and
      equations, one whipped, one plain UOV); run the same best-known
      attack on both; measure time, memory, and success probability; report
      the ratio.
    controls:
      - Same attack code on both instance types.
      - Matched dimension and field.
      - Random instance families (multiple seeds).
    required_metrics:
      - attack cost per instance type
      - success probability per instance type
      - ratio and variance over seeds
  falsification_conditions:
    - Ratio ~1 at all toy sizes (whipping security-neutral at toy scale).
    - Ratio < 1 (whipping costs security; plain UOV is harder) — the
      interesting direction for MAYO's security story.
  confounders:
    - Toy sizes where all MQ instances solve trivially.
    - Implementation differences in the two instance generators.
  interpretation_limits:
    - Toy control only; no crypto-scale claim about MAYO's parameters.
    - A neutral toy result does not prove crypto-scale neutrality.
  heuristic_assumptions:
    - id: HEUR-MAYO-WHIP-1
      statement: >-
        The relative attack cost of whipped vs plain UOV instances at toy
        sizes is directionally representative of larger sizes.
      rigorous_support: None; heuristic, tested by the toy-size trend.
      validation_plan: Run the control at 2-3 toy sizes and check the ratio
        trend.
  target_complexity:
    time_exponent: n/a (control)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a measured whip-vs-plain-UOV cost
    ratio that decides whether whipping's security cost is real.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
