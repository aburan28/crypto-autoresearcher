idea:
  id: IDEA-20261006-2a976b
  question_id: RQ-JINV-8fc13a
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    j-invariant gap of (1, 1) and (0, 1) over F_19
  class: measurement
  claim: >-
    Over F_19, with j = 1728 * (4 A)^3 * Delta^{-1} and
    Delta = -16 (4 A^3 + 27 B^2), reduced in F_19, the curve
    y^2 = x^3 + x + 1 has j = 13 and the curve y^2 = x^3 + 1 has
    j = 0. The absolute gap is 13. A recount that returns any other
    pair of j values is a negative. The same curve evaluated twice
    has gap 0. Both curves are nonsingular: 4 A^3 + 27 B^2 is 12 and
    8 in F_19. This gap is not a Pollard rho iteration count, not the
    duplication-height ratio of IDEA-20261005-8276a8, and not an
    automorphism-orbit census.
  mechanism: >-
    OBJECT FRAME. Representation R2: the short-Weierstrass coefficients
    (A, B), not a point. Operation set Sigma: the rational function
    that sends (A, B) to j. Sigma is not translation on a prime-order
    subgroup. Trichotomy: coordinate-dependent, because j is a function
    of the model and is unchanged by a quadratic twist only after the
    twist is written as a new (A, B). The projection keeps one residue
    in F_19 and discards the point count. Lossy: many models can share
    a j. The open number is the absolute gap 13 between these two
    models. Families of rho walks are not the lens. No discrete
    logarithm is computed.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether special j-invariants confer an ECDLP
        advantage beyond the sqrt(|Aut|) constant. This record measures
        two j values and claims no advantage.
      verified_by: design session 2026-10-06, question file opened
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces expected rho
        iterations by sqrt(m). j = 0 is the sqrt(6) case and j = 1728
        is the sqrt(4) case. The gain is a constant and does not change
        the exponent 1/2. This record outputs j values 13 and 0, not
        a step count.
      verified_by: design session 2026-10-06, row file opened
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        The rho baseline discount is about sqrt(|Aut|). This j gap
        does not beat that baseline.
      verified_by: design session 2026-10-06, KN-TECH-018.md opened
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous exactly when they
        have the same number of points. This record does not walk an
        isogeny.
      verified_by: design session 2026-10-06, row file opened
  assumptions:
    - The j formula is the one stated in the claim, reduced in F_19. A different normalization is a different cell.
    - Nonsingularity is 4 A^3 + 27 B^2 not equal to 0. Both named models pass that test.
    - This session evaluated the formula. It did not run rho.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms:
      - transform: not_applicable
        proposed_object: not_applicable
        predicted_gain: not_applicable
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations:
      - claim: not_applicable
        responsibility: not_applicable
    not_applicable_reason: >-
      One pair of j values. Not a proof that j confers an ECDLP
      advantage, and not a proof about sqrt(|Aut|).
  predictions:
    - metric: absolute_gap_of_j_invariants
      direction: different
      minimum_effect: >-
        Absolute difference 13 between j = 13 and j = 0. Any other
        pair of residues is a negative.
  minimal_test:
    design: >-
      Evaluate the stated j formula at (A, B) = (1, 1) and (0, 1)
      over F_19. Record both residues and the absolute gap. Evaluate
      (1, 1) a second time and record that self-gap, which is
      predicted to be 0. Do not run rho.
    controls:
      - >-
        The second evaluation of (1, 1). A self-gap other than 0
        voids the cell.
      - >-
        The two discriminant representatives 12 and 8. A zero
        discriminant voids the cell.
    required_metrics:
      - j of (1, 1)
      - j of (0, 1)
      - absolute gap
      - self-gap of (1, 1)
      - both discriminant representatives
      - rho steps performed, required to be 0
  falsification_conditions:
    - Both evaluations finish and the pair of j values is not (13, 0).
    - The self-gap of (1, 1) is not 0. That voids the cell and is not a j result.
  confounders:
    - A quadratic twist written with a different (A, B) is a different model.
    - IDEA-20261005-8276a8 is a duplication-height ratio over Q on related equations. This record is two residues in F_19.
    - The F_13 orbit-size comparison and the F_7 trace-zero split are different cells.
  interpretation_limits:
    - Two residues at p=19 do not say whether j = 0 is easier than a generic j.
    - The gap 13 is not a rho speedup and does not move the exponent 1/2.
    - KR-RHO-0528e7 remains the statement of the sqrt(m) constant.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The j formula is a function of (A, B) alone. Evaluating it
        twice on the same pair returns the same residue. That is an
        identity of arithmetic in F_19, not a distribution theorem.
        No rho-constant theorem was used for the integer 13.
      rigorous_support: >-
        The formula is a ratio of polynomials. Where Delta is nonzero
        the value is a single field element. KR-RHO-0528e7, opened,
        states the sqrt(m) constant and is not used as the value of j.
      validation_plan:
        sampling: >-
          Two named models at p=19, plus one repeated evaluation of
          (1, 1).
        comparison: >-
          The pair of residues against (13, 0), and the self-gap
          against 0.
        tail_check: >-
          There is no tail. A third model is out of scope. The
          self-gap is the only stability check.
        parameters: >-
          p=19, (A, B) in {(1, 1), (0, 1)}. No transfer to a larger
          prime and no rho walk.
  target_complexity:
    time_exponent: >-
      No improvement. Generic rho remains exponent 1/2. KR-RHO-0528e7
      adjusts the constant by sqrt(m) on j = 0 and j = 1728. This
      gap does not change that constant.
    memory_exponent: >-
      Not claimed. The output is two residues.
    best_known: >-
      Pollard rho at N^{1/2}, with the sqrt(m) automorphism constant
      stated in the opened row KR-RHO-0528e7 and in KN-TECH-018.
    hidden_overhead: >-
      One field inversion per model. No o(1) attack term is hidden
      because no attack is claimed.
    tradeoff_note: >-
      Not a time-memory tradeoff and not a van Oorschot-Wiener
      schedule. The output is one integer gap.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-755e35
      - KR-RHO-898783
      - KR-RHO-53c89f
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          The row states a sqrt(m) iteration discount, with sqrt(6)
          at j = 0 and sqrt(4) at j = 1728, and says the exponent
          stays 1/2. This record outputs the residues 13 and 0 at
          p=19 and the absolute gap 13. Quantitative distance: one
          integer in F_19 against a constant factor on rho steps.
          The row's step count is not claimed. Rho steps performed: 0.
      - ref: KR-RHO-755e35
        provenance: internal
        relation: orthogonal
        delta: >-
          Shared isogeny walks: 0. The row identifies isogeny with
          equal point counts. This record outputs two j residues.
          The outputs do not coincide.
      - ref: KN-TECH-018
        provenance: internal
        relation: adjacent
        delta: >-
          The note states the sqrt(|Aut|) discount. This record adds
          the gap 13 at p=19, which that note does not state, and
          claims no walk.
  dominated_by: >-
    Checked KR-RHO-0528e7, KR-RHO-755e35, KR-RHO-898783, KR-RHO-53c89f,
    and KN-TECH-018, all opened. Rho at exponent 1/2 with the sqrt(m)
    constant dominates any attack reading of this j gap.
    KR-RHO-0528e7 dominates any reading of the gap 13 as a change in
    the automorphism discount: the discount is sqrt(m), and this cell
    does not count steps. KR-RHO-898783 is an interval-kangaroo bound
    and does not dominate a j evaluation, because kangaroo steps
    performed are 0.
  sota_delta: >-
    Absolute j gap 13 at p=19 between (A, B) = (1, 1) and (0, 1).
    Distance to KR-RHO-0528e7 is that integer against a sqrt(m)
    step discount. Rho steps: 0. Time exponent versus rho: 0. No
    ECDLP cost is claimed.
