idea:
  id: IDEA-20260815-85378c
  question_id: RQ-WFS-e776b6
  added: '2026-08-15'
  title: >-
    ENUMERATE FIAT-SHAMIR TRANSCRIPT OMISSION CLASSES AND PRODUCE A FORGED
    PROOF FOR EACH, BECAUSE A COMPLETENESS CLAIM ABOUT WHAT MUST BE HASHED
    IS ONLY CHECKABLE IF EACH OMISSION HAS A WITNESS
  class: control

  claim: >-
    Fiat-Shamir soundness depends on hashing everything the verifier depends
    on, and the failure mode is omitting one item. Guidance lists items to
    hash; it rarely exhibits what goes wrong per omission. A forged proof
    per omission class converts guidance into evidence and makes the list's
    completeness testable.

  mechanism: >-
    Enumerate the omission classes for a concrete sigma protocol: statement,
    public parameters, commitment, verifier index, domain separator. For
    each, implement the omission and construct a forged accepting proof.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-WFS-001 objective; grep 'Fiat-Shamir', 'weak Fiat-
      Shamir', 'omission class'.
    results: >-
      The goal names this deliverable; weak Fiat-Shamir failures are
      published, and no record here produces per-omission forgery
      witnesses.
    verdict: >-
      ADAPTATION. The failure classes are published; the contribution is a
      witness per class in this program's evidence format.

  object_first_candidate:
    tracked_object: >-
      THE FORGED PROOF, one per omission class, as the witness that the
      class is real.
    lossiness: >-
      A forgery reduces a soundness failure to one artifact, discarding
      the general argument, which is the point: an artifact is checkable
      and an argument is not.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while a concrete sigma protocol is implementable; omission
      classes with no forgery are the interesting cases and are reported
      as such.

  null_object_control: >-
    NULL 1 -- the fully correct transcript, where no forgery may succeed.
    NULL 2 -- a forgery attempt against a correctly bound omission, which
    must fail, confirming the harness is not accepting everything.

  discriminated_from:
    - >-
        Published weak Fiat-Shamir analyses, which describe the classes;
        this record produces witnesses.
    - >-
        The Ed25519 divergence record in this series, which concerns
        verification semantics of a signature scheme rather than
        transcript binding in a proof system.

  assumptions:
    - >-
        A concrete sigma protocol is implementable with individually
        omittable transcript items.
    - >-
        The enumerated classes cover the transcript's binding surface;
        completeness is not claimed and an unenumerated class is the main
        risk.

  predictions:
    - metric: >-
        correct-transcript null
      direction: different
      minimum_effect: >-
        FORCED: no forgery succeeds.
    - metric: >-
        forgery per omission class
      direction: different
      minimum_effect: >-
        Predicted to succeed for each enumerated class; a class with no
        forgery is either not a real failure mode or needs a cleverer
        attack, and both are reportable.
    - metric: >-
        count of classes with no forgery witness
      direction: different
      minimum_effect: >-
        The honest measure of how much of the guidance this record
        actually substantiates.

  minimal_test:
    design: >-
      One sigma protocol, all enumerated classes, both nulls.
    controls:
      - >-
          Correct-transcript null.
      - >-
          Correctly-bound-omission null.
      - >-
          Every forgery independently verified against the unmodified
          verifier.
    required_metrics:
      - >-
          Forgery outcome per omission class, with the artifact.
      - >-
          Independent verification of each forgery.
      - >-
          Count of classes lacking a witness.

  falsification_conditions:
    - >-
        The correct-transcript null admits a forgery. Harness broken; all
        results void.
    - >-
        A forgery does not verify against the unmodified verifier. It is
        not a forgery and must not be recorded as one.
    - >-
        Several classes have no witness. The guidance is less
        substantiated than it appears, which is the finding.
    - >-
        Every class has a witness. The omission list is substantiated for
        this protocol.

  confounders:
    - >-
        PROTOCOL SPECIFICITY: an omission harmless in one sigma protocol
        can be fatal in another, so a witness set binds the tested
        protocol only.
    - >-
        OVER-STRONG ADVERSARY: a forgery using powers a real attacker
        lacks would overstate the class.

  interpretation_limits:
    - >-
        Produces witnesses for one protocol; no general Fiat-Shamir claim
        follows.
    - >-
        A class without a witness is not shown safe, only unwitnessed
        here.

  heuristic_assumptions:
    - id: HEUR-WFS-COV-1
      statement: >-
        The enumerated omission classes cover the transcript-binding
        surface of the tested sigma protocol.
      rigorous_support: >-
        Rigorous ingredient: the classes are read off the verifier's
        inputs, so anything the verifier reads is enumerable. THE GAP:
        implicit dependencies such as encoding conventions and domain
        separation are easy to miss precisely because the verifier does
        not read them explicitly.
      falsification_condition: >-
        A soundness failure in the tested protocol not attributable to
        any enumerated class.
      validation_plan: >-
        SAMPLE: all enumerated classes plus an adversarial search for
        failures outside them. TAIL CHECK: any failure found outside the
        list, which directly measures the coverage gap. TRANSFER: none
        beyond the tested protocol.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is one protocol implementation plus a forgery
      attempt per class.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published weak Fiat-Shamir analyses, which are
      broader and carry no witnesses.
    hidden_overhead: >-
      Constructing a forgery for a subtle class can be far harder than
      describing the class, so the witness set may be incomplete for
      effort reasons rather than security ones.
    tradeoff_note: >-
      Witnesses are checkable and protocol-bound; guidance is general and
      unfalsifiable. This record takes the first.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As analysis: dominated by published weak
    Fiat-Shamir work. As a witness set: none exists here. Not null on any
    axis.
  sota_delta: >-
    No attack novelty, no exponent. Content delivered: a forged accepting
    proof per transcript omission class for one concrete protocol, each
    independently verified, plus an explicit count of classes this record
    could not witness.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that a sigma protocol is implementable with omittable items. 0.85
    that the nulls behave. 0.6 that every enumerated class gets a witness; I
    expect one or two to resist and those are the interesting entries.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-WFS-001
    - GOAL-WFS-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260815`
    and verified free with `--check` before use; no state was scanned for a
    "next free number".
