  heuristic_assumptions:
    - id: H1
      statement: >-
        RANK-DROP DENSITY. For the planted digit family at fixed (m, d, s, D),
        the probability over uniformly random curve and planted target at
        prime p that some graded rank falls below its generic value is at
        most c_D / p with c_D independent of p.
      rigorous_support: >-
        RIGOROUS: Schwartz-Zippel applied to the product of the maximal
        minors, a nonzero integer polynomial in (A, B, x_R) of bounded
        degree, gives deg(P_D)/p for uniform (A, B, x_R); the planted
        family is a subvariety and the same bound holds with the degree of
        the restricted polynomial. CLASSICAL DISTRIBUTION IMITATED: the
        uniform distribution of (A, B, x_R) in F_p^3, imitated by random
        curves and planted targets, which are NOT uniform in x_R; that gap
        is the heuristic content.
      validation_plan: >-
        SAMPLE: 40 draws per cell at p in {2^12, 2^16, 2^20}, 3 cells.
        COMPARISON: event rate against c/p with c fitted at 2^12 and
        predicted at 2^16, 2^20. TAIL CHECK: the cell with the highest rate
        and the degree at which its drops occur (a drop concentrated at
        one degree points to a content prime or a planting artifact).
        SAMPLED PARAMETERS RECORDED: p, A, B, planted digits, x_R, seed.
        TRANSFER: to any p above 2^20 by the 1/p law, which the large-p
        cells check directly.
    - id: H2
      statement: >-
        SHAPE-DETERMINATION (HEUR-FF-1 restated for the digit presentation):
        the generic rank profile of the Semaev digit family equals the
        generic rank profile of the random same-support family at every
        degree below d_reg.
      rigorous_support: >-
        RIGOROUS ingredient: both generic ranks are integers and p-
        independent (A). NO rigorous relation between them; the classical
        statement imitated is semi-regularity of a random system
        (Froberg), and the assumption is that the Semaev family is not
        rank-deficient relative to it. This is exactly what 84cdb7 and
        lane A measure on the s-axis; here it is measured at fixed s and
        large p, where small-p artifacts are excluded by H1.
      validation_plan: >-
        SAMPLE: Semaev and null arms at the five large primes, 40 draws each
        per cell. COMPARISON: integer equality of profiles. TAIL CHECK: the
        degree of the first disagreement, if any, against d_reg.
        TRANSFER: none to other shapes.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS CLAIMED. The instrument's cost per cell is one exact rank
      per degree on at most 3003 columns, times a field-arithmetic factor
      of about 16 at 256 bits; total low tens of CPU hours. No exponent is
      affected by any outcome; what is calibrated is the p-column of the
      RQ's table.
    memory_exponent: >-
      Instrument: at most about 3003^2 field elements of 32 bytes at 256
      bits, about 300 MB dense, within the contract.
    best_known: >-
      Pollard rho at 0.886 sqrt(N) and O(1) memory; BSGS; kangaroo;
      automorphism-discounted rho (relevant to secp256k1's j = 0);
      Pohlig-Hellman; S T^2 = N preprocessing; algebra-free MITM index
      calculus at N^{1/2+1/m}. For the surrogate question the incumbent is
      IDEA-20260731-009's random-shape sampler.
    hidden_overhead: >-
      The Schwartz-Zippel constant c_D is bounded by the minor degree and
      not computed; the measurement replaces it. Field arithmetic at 256
      bits is a constant factor. Nothing asymptotic is claimed.
    tradeoff_note: >-
      None.

  dominated_by: >-
    n/a (no result claimed). ROWS CHECKED: parallel rho with negation
    dominates on every axis; BSGS on time; kangaroo not comparable;
    automorphism-discounted rho on special curves including secp256k1;
    Pohlig-Hellman not comparable; generic preprocessing S T^2 = N on
