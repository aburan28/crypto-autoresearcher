idea:
  id: IDEA-20260903-26aa81
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-dc126c
  added: '2026-09-03'
  title: >-
    AT FIXED (m, d, s) THE DIGIT-PRESENTED DECOMPOSITION SYSTEM IS ONE
    INTEGER MATRIX FAMILY, so its graded ranks over F_p equal their generic
    rank over Q except on a rank-drop set of density O(deg/p): p-independence
    of d_ff, d_lf and the D = 3, 4 Macaulay deficit at fixed shape is a
    DERIVATION, not a prior, and the p-sweep from 2^12 to the actual P-256
    prime - reachable because the matrix size does not depend on p - is a
    pipeline calibration that measures how small "small p" is, while the
    shape-versus-structure question is decided by the random-coefficient
    null at any single large p; IDEA-20260731-009's HEUR-FF-1 is licensed on
    the prime-field digit side for a reason it did not give, and crypto-size
    shape sampling is a valid surrogate for THESE invariants with a
    quantified small-p correction
  class: control

  claim: >-
    (A) THE DERIVATION. Fix m, d, s and the digit presentation of
    IDEA-20260830-84cdb7: variables a_{k,i} (k = 1..m, i = 0..s-1),
    generators a_{k,i}(a_{k,i} - 1) ... (a_{k,i} - d + 1) (constants,
    independent of everything) and S_{m+1}(x_1, ..., x_m, x_R) with
    x_k = sum_i a_{k,i} d^i substituted. The coefficients of the
    substituted generator are polynomials with INTEGER coefficients in the
    curve parameters (A, B) and the target coordinate x_R; the digit
    substitution is over Z. Hence the degree-D Macaulay matrix M_D (rows
    t f_i, columns the multilinear-reduced monomials, size independent of
    p) is the specialization of ONE matrix M_D(A, B, x_R) over
    Z[A, B, x_R] at a point of F_p^3, and its rank over F_p is at most the
    generic rank r_D of M_D over Q(A, B, x_R), with equality unless every
    r_D x r_D minor vanishes at the specialization mod p. The product of
    the nonzero maximal minors is a nonzero integer polynomial P_D; for
    (A, B, x_R) drawn uniformly from F_p^3 with p not dividing the content
    of P_D, Schwartz-Zippel gives Prob[rank drop] <= deg(P_D)/p. THEREFORE:
    every graded rank, hence d_ff, d_lf (IDEA-20260903-d52480) and the
    per-degree Macaulay deficit against the (p-independent) null series
    (1 + ... + z^{d-1})^{ms}(1 - z^{deg}), is the SAME integer at every
    prime p above a threshold p_0, up to events of probability O(deg/p) and
    up to the finitely many primes dividing the contents. The planted-
    target design (x_R = x(sum of digit-box points)) restricts (A, B, x_R)
    to a subvariety; the same argument applies with the generic rank on
    that subvariety, which is again a single integer.
    (B) WHAT THIS DOES AND DOES NOT DECIDE. It decides that the honest
    prior of the handoff (p-independence at fixed shape) is a theorem-
    shaped statement for the SEMAEV arm, so the p-sweep cannot discover
    "coefficient-carried" structure at large p; a Semaev-arm invariant that
    moves with p at p >= 2^32 is an INSTRUMENT FAULT by (A), which is the
    structural tell the handoff asks for, sharpened. It does NOT decide the
    shape-versus-structure question - whether the generic rank of the
    Semaev family equals the generic rank of a random same-support family
    - because those are two different matrix families with two generic
    ranks; that question is decided by the null arm at ANY single large p
    and is 84cdb7's and lane A's business. And it does NOT decide how small
    p must be before the O(deg/p) events matter: deg(P_D) grows with the
    matrix size, and at the program's toy primes (2^12 .. 2^16) the
    rank-drop rate is the quantity this record measures.
    (C) THE CRYPTOGRAPHIC-SCALE SHORTCUT. Because the matrix size is
    binom(ms + D, D) regardless of p, the ladder can include the NIST P-256
    prime and curve and secp256k1 at the SAME cost as p = 2^12 apart from
    bigger field elements: at (m, d, s) = (2, 2, 4) and D = 6 the matrix
    has binom(14, 6) = 3003 columns whether p has 12 or 256 bits. This is
    the sampling shortcut docs/target-result-profile.md A7 asks for (the
    Deuring-correspondence analogue): a degree invariant of the prime-field
    decomposition system evaluated at a cryptographic prime without solving
    anything, with the transfer assumption made explicit - it transfers
    across p at FIXED s and says nothing about s growing, which is the axis
    that matters and the axis d52480 and 84cdb7 measure.
    (D) THE THREE-WAY TEST, PRE-REGISTERED. Cells (m, d, s) in {(2, 2, 3),
    (2, 2, 4), (3, 2, 2)}; primes p in {2^12 + 3 (or the nearest prime),
    2^16 + 1 region, 2^20, 2^32, 2^64, 2^128, the P-256 prime
    2^256 - 2^224 + 2^192 + 2^96 - 1, the secp256k1 prime}; 8 random curves
    per p plus the named curves at 256 bits; 5 planted targets per curve;
    arms Semaev, random same-support null, non-curve cubic. Per cell and
    arm record d_ff, d_lf, the deficit at D = 3, 4 and the full rank
    profile. OUTCOMES. O1 (predicted): Semaev and null arms are each
    p-flat above p_0, with p_0 <= 2^16 and the rank-drop rate at 2^12
    measured; if Semaev != null (both flat), the structure is carried by
    the SHAPE plus the SEMAEV COEFFICIENT FAMILY in a p-independent way and
    HEUR-FF-1's surrogate is valid for these invariants only after the
    Semaev/null difference is subtracted; if Semaev = null at every p, the
    invariants are shape-determined and the surrogate is valid as stated.
    O2: a Semaev-arm invariant moves with p at p >= 2^32 while the null is
    flat: by (A) an instrument fault (wrong reduction, non-uniform planting,
    content primes), to be located before anything else is read. O3: both
    arms move with p at p >= 2^32: field-size artifact in the pipeline or
    the null construction (e.g. coefficient sampling not uniform), same
    disposition. The small-p regime p <= 2^16 is reported separately as
    the rank-drop rate, which is the number the toy ladders of this program
    need.

  mechanism: >-
    WHY THE DIGIT PRESENTATION IS THE FIRST PLACE THIS CAN BE DONE. In the
    direct presentation the membership generator f_V(x) = prod (x - v) has
    coefficients that are the elementary symmetric functions of B random
    field elements, so the matrix family has B free parameters and the
    factor base must be re-drawn at each p; the family is still fixed at
    fixed B and the argument of (A) applies with B extra variables, but the
    program's direct-presentation ladders vary B with p (B about p^{1/m},
    cb8e46) and so never hold the shape fixed. The digit presentation's
    membership generators are constants and its only free parameters are
    (A, B, x_R): three variables at every p, which makes (A) a three-
    variable Schwartz-Zippel statement and the p-sweep a controlled
    experiment. THE DIRECT PRESENTATION AT FIXED B = 8, m = 2 is included
    as a secondary arm to show the same p-flatness there, which it must
    exhibit by the same argument.
    WHY THE STRUCTURAL TELL IS SHARPER THAN THE HANDOFF'S. The handoff
    names as the tell "a deficit that does not move with p when the
    coefficient distribution changes". Under (A) the Semaev deficit CANNOT
    move with p at fixed shape above p_0; so the tell is inverted: movement
    at large p is the fault, and stillness under a change of coefficient
    DISTRIBUTION (Semaev -> random) is the shape-artifact reading, which is
    the null arm's job. Both are pre-registered.
    HOW THE SMALL-p CORRECTION IS MEASURED. At p in {2^12, 2^16, 2^20}
    the per-cell rank profile is compared with the profile at 2^64 (taken
    as the generic one after (A)); each cell where any degree's rank falls
    below the large-p value is a rank-drop event; the event rate per cell
    against 1/p is the measured deg(P_D)/p and is reported with a binomial
    interval. This number bounds how much of any toy-scale deficit in this
    program (all measured at p <= 2^16) can be a small-p artifact.
    IMPLEMENTATION. 84cdb7's exact graded-rank engine with the field
    element type swapped for arbitrary-precision residues (word-size
    arithmetic below 2^62, FLINT/Sage fmpz_mod or Python integers above);
    d52480's closure for d_lf; planting by explicit point addition on each
    curve with certificate re-verification; the P-256 and secp256k1 arms
    use the published curve parameters (public, no keys involved).

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL UNAVAILABLE. Grep over ledger/proposals for
      'p-independen|p-sweep|independent of p|prime ladder|across primes'
      (50 files at the head limit, a FLOOR; the matches are overwhelmingly
      prime ladders p in {1009, 4099, 16411} used as replication, none a
      fixed-shape sweep to cryptographic p; IDEA-20260731-009,
      IDEA-20260830-84cdb7, IDEA-20260807-4fc635, IDEA-20260806-e4f96e read
      in full, the rest title-level). Full reads: IDEA-20260731-009,
      IDEA-20260807-4fc635, IDEA-20260830-84cdb7, IDEA-20260808-093497,
      KN-OPEN-002, H-PFGB-f9ae08; first 70 lines of IDEA-20260830-cb8e46.
      WEB: none for this corner.
    results: >-
      No record states the generic-rank / Schwartz-Zippel argument for
      p-independence of degree invariants at fixed shape, and no record
      proposes evaluating a prime-field decomposition-system invariant at
      the actual P-256 prime. IDEA-20260731-009 proposes random-shape
      sampling at 64-128-bit proxy sizes without a curve and without a
      p-sweep; IDEA-20260806-e4f96e's H1 asserts p-dependence o(log p) of
      PC degree as a heuristic without the argument. All absences are
      floors.
    verdict: >-
      UNVERIFIED. Generic rank of a specialized integer matrix and
      Schwartz-Zippel are textbook; what is new to this program is their
      application to the digit presentation, the consequence for the
      surrogate question, and the crypto-prime shortcut.

  citations:
    - ref: IDEA-20260731-009
      provenance: internal
      claim: >-
        HEUR-FF-1, "shape-determined regularity": random systems with the
        Semaev degree vector and variable count have the same normalized
        d_ff distribution as true Semaev systems; proposes crypto-size
        random-shape sampling; no p-sweep; names coefficient distribution
        as a confounder.
      verified_by: idea-generator lane C, TASK-20260903-dc126c (read in full)
    - ref: IDEA-20260830-84cdb7
      provenance: internal
      claim: >-
        The digit presentation, its exact-rank engine, its planted-target
        design, its ladder at p <= 2^16 and its null series.
      verified_by: idea-generator lane C, TASK-20260903-dc126c (read in full)
    - ref: IDEA-20260807-4fc635
      provenance: internal
      claim: >-
        The PGL_2 coordinate null battery: same curve under random Moebius
        reparametrisation; a different axis (coordinate) from this record's
        (prime).
      verified_by: idea-generator lane C, TASK-20260903-dc126c (read in full)
    - ref: >-
        Schwartz-Zippel lemma (Schwartz 1980, Zippel 1979); generic rank of
        a matrix over a polynomial ring and its specializations
      provenance: recalled
      claim: >-
        A nonzero polynomial of degree e over F_p vanishes at a uniform
        point with probability at most e/p; rank of a specialization is at
        most the generic rank with equality off the zero set of the
        maximal minors.
      verified_by: null
    - ref: 'docs/target-result-profile.md (A7)'
      provenance: internal
      claim: >-
        Heuristic validation at cryptographic scale via a sampling shortcut
        with explicit transfer assumptions; this record's crypto-prime arm
        is the instantiation.
      verified_by: idea-generator lane C, TASK-20260903-dc126c (read in full)

  assumptions:
    - >-
      d^s <= p at every prime (trivial for p >= 2^12 and s <= 4).
    - >-
      Curves at each p are random short-Weierstrass with the KN-TECH-034
      exclusions where they apply at toy p; at 256 bits P-256 and
      secp256k1 are used as public named instances alongside 8 random
      curves.
    - >-
      Planted targets are constructed by point addition and certified; no
      yield statement is read.
    - >-
      Exact arithmetic at every p; no floating point; no CAS termination
      events.

  proof_search_map:
    bottleneck: >-
      The step "rank over F_p equals generic rank over Q off a set of
      density O(deg/p)", which is where p leaves the problem; everything
      else is bookkeeping.
    baseline_embedding:
      parameter_slice: >-
        p in {2^12, 2^14, 2^16} at (2, 2, s), which is 84cdb7's own ladder;
        the invariants there must equal 84cdb7's on the same instances
        (frozen fixture), and the direct-presentation arm at B = 8, m = 2
        must reproduce 093497's instrument on its cells.
      reproduction_check: >-
        Exact integer agreement of the rank profiles with 84cdb7's engine on
        shared instances at word-size p, before any big-p cell runs.
    observation_collision:
      observable: >-
        The rank profile per (cell, arm, p) and its p-flatness label.
      distinct_preimage_search: >-
        Two systems with the same p-flat profile: the Semaev arm and the
        null arm, if shape-determined. That collision is Outcome O1's
        "surrogate valid as stated" reading and is designed for, not
        feared. The collision that would matter is a Semaev arm profile at
        2^256 equal to the null's while differing at 2^12: by (A) that is
        the small-p artifact signature and is what the rank-drop rate
        measures.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Represent the family of digit systems over all p as one matrix
          over Z[A, B, x_R]; p-independence becomes the statement that the
          generic rank is an integer. Encoding exact; completeness: every
          F_p instance is a specialization; soundness: rank can only drop;
          cost loss: none.
        predicted_gain: >-
          Turns the surrogate question from a distributional heuristic into
          a rank identity plus a measured small-p correction.
    quantifier_order: >-
      DERIVED: FORALL (m, d, s, D) EXISTS integers r_D and p_0 such that
      FORALL primes p > p_0 and uniformly random (A, B, x_R) in F_p^3,
      rank_{F_p}(M_D) = r_D with probability >= 1 - deg(P_D)/p. The witness
      r_D depends on the shape and on the Semaev family, not on p; the
      dangerous reading FORALL p EXISTS r_D(p) is what O2 would look like
      and is excluded by the derivation above p_0. MEASURED: the rank-drop
      rate at p <= 2^20 and the flatness of every invariant at p >= 2^32.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At fixed (m, d, s) the digit system's graded invariants are
        p-independent above p_0 = [measured], the small-p rank-drop rate at
        2^12 is [measured], and the Semaev and null arms [do / do not]
        differ at the 256-bit primes." It cannot certify anything about s
        growing, about yield, or about any solver's cost.
      nearby_object_control: >-
        The DIRECT presentation with B growing as p^{1/m} (cb8e46's ladder),
        where the shape changes with p and the invariants DO move with p
        (afe4ce's floor at B): a pipeline that reported p-flatness there
        would be broken. Run at m = 2, B = round(p^{1/2}) for p in
        {2^12, 2^14} as a positive control that the instrument sees
        p-dependence when the shape carries it.
    proof_obligations:
      - claim: >-
          The Macaulay matrix entries are polynomials over Z in (A, B, x_R)
          with the digit generators constant.
        responsibility: correctness
      - claim: >-
          Rank over F_p equals the generic rank off a set of density at most
          deg(P_D)/p, for p not dividing the content.
        responsibility: correctness
      - claim: >-
          The engine reproduces 84cdb7's and 093497's profiles on shared
          cells at word-size p.
        responsibility: baseline
      - claim: >-
          The direct-presentation B-grows-with-p arm shows p-dependence.
        responsibility: interface
      - claim: >-
          Big-p cells stay within the 84cdb7 memory contract; field-element
          size is charged.
        responsibility: memory
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The rank profile of the digit system as a function of p at fixed
      shape, projected to the boolean "flat above p_0" and the integer
      rank-drop count at small p.
    lossiness: >-
      Lossy: the whole family of F_p-systems is projected to one integer
      per degree (the generic rank) plus a small-p correction count; the
      fibre contains every prime and every curve. Not a change of
      coordinates: the projection forgets p entirely and (A) says that is
      exactly compatible with the operation "change the prime".
    propagation: >-
      Deterministic under change of prime above p_0 (the profile does not
      move) and under degree increment (the generic rank at D + 1 is
      computed from the same integer matrix).
    survival_score: >-
      Survives to every prime; dies exactly at the primes dividing the
      contents of the minors (finitely many, small) and on the O(deg/p)
      rank-drop sets, both of which the measurement reports.

  null_object_control: >-
    NULL (blocking, every cell and every p): random polynomial of the same
    multidegree support in the digit variables in place of the substituted
    S_{m+1}, coefficients uniform in F_p; predicted p-flat above p_0 by the
    same argument applied to a family with one free parameter per
    coefficient. NEARBY OBJECT (blocking): the non-curve cubic of 84cdb7.
    POSITIVE CONTROL (blocking): the direct presentation with B growing as
    p^{1/2}, which must show p-dependence. KNOWN-ANSWER: shared cells with
    84cdb7 and 093497 at word-size p. STRUCTURAL TELL (inverted by the
    derivation): any Semaev-arm invariant that moves with p at p >= 2^32
    is an instrument fault; a Semaev arm equal to the null at every p is
    the shape-determined reading; a Semaev arm differing from the null by
    the same integers at every p >= 2^32 is Semaev structure carried
    p-independently.

  discriminated_from:
    - >-
      IDEA-20260731-009: proposes random-shape sampling at 64-128-bit proxy
      sizes as a surrogate, with HEUR-FF-1 as a heuristic and no p-sweep and
      no argument; this record supplies the argument (generic rank), the
      sweep, the actual 256-bit primes and curves, and the small-p
      correction that 731-009's toy-versus-proxy comparison would need.
    - >-
      IDEA-20260807-4fc635: the null for "the coordinate matters" is a
      random PGL_2 reparametrisation of the same curve; here the axis is
      the prime at fixed coordinate and fixed shape, and the null is the
      random same-support system. Different group, different question.
    - >-
      IDEA-20260830-84cdb7: measures the s-slope at three toy primes; this
      record holds s fixed and sweeps p to cryptographic size, and feeds
      84cdb7 the rank-drop rate at its own primes.
    - >-
      IDEA-20260806-e4f96e: asserts o(log p) dependence of PC degree as
      heuristic H1 on unsatisfiable instances; here p-independence is
      derived for graded ranks on satisfiable planted instances.
    - >-
      Lane B corner B3 (the coupled degree-by-yield table with growth arms
      in log2 p): not filed on; this record produces no yield column and
      its p-arm is a calibration of degree invariants at fixed shape, which
      B3's table may consume as the statement that the degree column's
      p-arm is flat by derivation.

  predictions:
    - metric: >-
        rank profile agreement with 84cdb7 and 093497 on shared cells at word-size p
      direction: different
      minimum_effect: >-
        FORCED EXACT. A mismatch halts the line.
    - metric: >-
        p-dependence of d_ff on the direct-presentation B = round(p^{1/2}) positive control
      direction: higher
      minimum_effect: >-
        d_ff strictly increasing from p = 2^12 to 2^14 (afe4ce's floor at
        B rises from 64 to 128). Flatness here means the instrument is
        blind to p and no O1 may be reported.
    - metric: >-
        every invariant (d_ff, d_lf, deficit at D = 3, 4, full profile) on the Semaev arm across p in {2^32, 2^64, 2^128, P-256, secp256k1}
      direction: different
      minimum_effect: >-
        IDENTICAL integers at every large p in at least 95 percent of
        (curve, target) draws per cell (the 5 percent absorbs rank-drop
        events, expected far below that at these p). Any systematic
        movement is O2 and is an instrument fault by derivation.
    - metric: >-
        rank-drop event rate per cell at p in {2^12, 2^16, 2^20} against the 2^64 profile
      direction: lower
      minimum_effect: >-
        Reported with binomial 95 percent intervals; predicted to scale as
        c/p across the three primes (ratio about 16 between consecutive
        rungs). A rate that does not fall with p is a fault. The 2^12 rate
        is the number handed to 84cdb7 and lane A as the small-p artifact
        budget.
    - metric: >-
        Semaev arm minus null arm, per invariant, at the 256-bit primes
      direction: different
      minimum_effect: >-
        NO DIRECTION PRE-COMMITTED. Zero at every cell: shape-determined,
        HEUR-FF-1 valid as stated for these invariants. Nonzero and
        identical across the large primes: Semaev structure carried
        p-independently, HEUR-FF-1 valid only after subtracting it. Nonzero
        and varying across large primes: fault (O2).
    - metric: >-
        P-256 and secp256k1 named-curve cells against the 8 random 256-bit curves
      direction: different
      minimum_effect: >-
        Within the random-curve spread. A named curve outside it at fixed
        shape would be a curve-specific rank drop and is reported
        individually with its minors' content check.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the derivation): write (A) with the matrix
      family explicit at (2, 2, 3), D = 4, and list the minors' degree
      bound deg(P_D) <= r_D x (max entry degree in (A, B, x_R)), which is
      the Schwartz-Zippel constant. STAGE 1 (hours): engine port to
      arbitrary p; frozen-fixture agreement on 84cdb7's and 093497's cells.
      STAGE 2 (hours): positive control (direct presentation, B grows with
      p). STAGE 3 (hours): the p-sweep at (2, 2, 3), (2, 2, 4), (3, 2, 2)
      with all arms, 8 curves x 5 targets per (cell, p), D_max = 6 with
      84cdb7's memory contract; 256-bit cells cost about 16x the word-size
      cells in field arithmetic and are scheduled last. STAGE 4 (zero
      compute): flatness labels, rank-drop rates, Semaev-minus-null table,
      outcome. The cheapest valid discriminator is Stage 3 at (2, 2, 3)
      with p in {2^12, 2^64, P-256} only: three primes already separate
      O1 from O2 and give the 2^12 rank-drop rate.
    controls:
      - 'frozen-fixture agreement with 84cdb7 and 093497 (blocking)'
      - 'direct-presentation positive control with p-dependent shape (blocking)'
      - 'random same-support null at every (cell, p) (blocking)'
      - 'non-curve cubic nearby object'
      - 'named 256-bit curves against random 256-bit curves'
      - 'certificate re-verification of every planted target at every p'
      - 'content-prime check: the small primes dividing the minors, reported'
    required_metrics:
      - 'full rank profile, d_ff, d_lf, deficit at D = 3, 4 per (cell, arm, p, curve, target)'
      - 'p-flatness label per invariant per cell'
      - 'rank-drop rate per cell at p <= 2^20 with intervals'
      - 'Semaev minus null per invariant at each large p'
      - 'positive-control d_ff versus p'
      - 'column counts, field-element size, peak RSS, wall time per cell'

  falsification_conditions:
    - >-
      Frozen-fixture disagreement: instrument fault, nothing reported.
    - >-
      Positive control flat in p: instrument blind to p; no O1 reportable.
    - >-
      O2: a Semaev-arm invariant moves at p >= 2^32. By (A) this is a
      fault; the derivation is not falsified by it, the pipeline is, and
      the fault is located (reduction rule, planting, content prime)
      before any other number is read. If no fault is found after the
      named checks, the derivation's hypotheses are re-examined (the
      planted subvariety's generic rank may differ from the uniform one
      and the record says which was used).
    - >-
      Rank-drop rate not falling as 1/p across 2^12, 2^16, 2^20: the
      small-p model is wrong and the reported budget is replaced by the
      measured curve.
    - >-
      O1 with Semaev = null everywhere: controlled null; HEUR-FF-1 valid as
      stated for these invariants at fixed shape; no Semaev-specific
      content in the p-axis.
    - >-
      O1 with Semaev != null by the same integers at every large p: the
      Semaev digit system carries p-independent structure that a random
      surrogate misses by exactly those integers; 731-009's surrogate must
      subtract them.

  confounders:
    - >-
      PLANTED SUBVARIETY. The generic rank on the planted family may differ
      from the generic rank at uniform (A, B, x_R); both are p-independent,
      but a pipeline that mixes planted and unplanted cells would see two
      constants and call it p-dependence. Planting is used at every cell.
    - >-
      CONTENT PRIMES. Small primes dividing the contents of the minors make
      the rank drop at that p for every instance; p = 2, 3 are the obvious
      ones and the toy primes are above 2^12, but the check is reported.
    - >-
      FIELD-ELEMENT COST. Wall time grows with log p; only rank profiles
      are compared, never timings.
    - >-
      NAMED CURVES. P-256 and secp256k1 have special structure (secp256k1
      has j = 0); at fixed digit shape the derivation applies to any
      (A, B), but j = 0 is reported separately per KN-TECH-034 practice.
    - >-
      SEED COUNT. 8 curves x 5 targets per (cell, p) gives 40 draws; the
      95 percent flatness threshold is set so that one rank-drop event does
      not flip a label.

  interpretation_limits:
    - >-
      p-independence at FIXED s says nothing about the s-axis, which is
      where the exponent question lives; this record calibrates the
      p-column of the RQ's table and does not fill the growth arm.
    - >-
