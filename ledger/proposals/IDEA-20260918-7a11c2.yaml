idea:
  id: IDEA-20260918-7a11c2
  question_id: RQ-ECDLP-002
  added: '2026-09-18'
  status: proposed
  approved_by: null
  title: Torsion-equivariant quotient-map PDP benchmark with PGL2 transport
  class: representation
  claim: >-
    Small-order torsion equivariant coordinates are established prior art, not a new
    attack. The unresolved program question is whether a quotient/equivariant map
    phi:E->P1 can lower complete point-decomposition cost on matched instances after
    charging the smaller factor base, the decomposition-probability penalty, map
    construction, solver work, relation rank and final linear algebra. The existing
    model-comparison experiment has engineering integration but no admitted scientific
    execution and does not by itself measure the torsion-quotient trade.
  mechanism: >-
    Let C=<T> be a small rational torsion subgroup. Use a coordinate phi that is
    invariant on C-orbits or equivariant under translation by T through a small
    PGL2 action. This quotients repeated point labels and can shrink the factor base
    and polynomial representation. The same quotient can reduce decomposition
    probability or introduce recovery multiplicity. PGL2 conjugates of phi are exact
    representation controls: they preserve mathematical fibres and relation counts
    while changing coordinate formulas and monomial support.
  novelty_status: unverified
  origin:
    kind: user_supplied_idea
    date: '2026-09-18'
    scope: Continuation of the Galbraith larger-group-action and symmetry-breaking slides.
    overlap_review: >-
      IDEA-20260905-4dff7b and EXP-ECDLP-abf981 cover Edwards/Hessian model transport
      and a PGL2 relabeling control. This proposal is narrower and different: the
      independent variable is an actual torsion quotient/equivariant coordinate and
      its factor-base/decomposition trade, not merely a birational curve model.
  citations:
    - ref: research/equation-schemes-20260905/retrieved-pages/hal-00935050.txt
      provenance: retrieved
      claim: Retrieved source text develops small-order torsion actions, equivariant maps to P1 and quotient-factor-base constructions.
      verified_by: repository
    - ref: coordination/goals/GOAL-CRYPTO-001/batches/BATCH-011/tasks/TASK-20260724-911/coverage_review.md
      provenance: retrieved
      claim: Existing literature review records the torsion-equivariant map, reduced factor base and decomposition-probability penalty as prior art.
      verified_by: repository
    - ref: experiments/EXP-ECDLP-abf981/specification.yaml
      provenance: retrieved
      claim: Existing exact model comparison defines point transport, finite relation and PGL2 controls reusable as correctness baselines.
      verified_by: repository
    - ref: experiments/EXP-ECDLP-abf981/source-v4/runner-integration.md
      provenance: retrieved
      claim: Engineering integration still does not demonstrate an admitted scientific run through the final path.
      verified_by: repository
  citation_note: The small-torsion mechanism is known; this record proposes a matched fully charged benchmark only.
  assumptions:
    - Generated/public benchmark curves only, explicitly selected to admit the declared small rational torsion.
    - Torsion order, quotient map and inverse/recovery branches are public and fully charged.
    - Coordinate-only comparisons transport exactly the same mathematical point set.
    - Model-adapted factor bases are compared only after exact cardinality and relation-density accounting.
    - All accepted relations are decoded and verified in one canonical group model.
  proof_search_map:
    bottleneck: Whether quotient simplification exceeds the loss in decomposition probability, recovery multiplicity and rank.
    baseline_embedding:
      parameter_slice: Ordinary x-coordinate Semaev on the same curve and support, plus identity/PGL2 controls.
      reproduction_check: Reproduce exact point transport, relation counts and PGL2 invariance before scoring quotient performance.
    observation_collision:
      observable: End-to-end cost per independent verified relation and decomposition success probability.
      distinct_preimage_search: Compare phi, fixed PGL2 conjugates, ordinary x and a same-degree random rational-coordinate control.
    constructive_transforms:
      - transform: torsion_orbit_quotient
        proposed_object: A small-torsion invariant/equivariant coordinate phi:E->P1.
        predicted_gain: Fewer factor-base representatives and a smaller/sparser polynomial system.
      - transform: pgl2_conjugacy_control
        proposed_object: Fixed PGL2 conjugates mu o phi.
        predicted_gain: No mathematical relation-count change; differences isolate presentation effects.
    quantifier_order: For each preregistered cell all coordinate arms are built before fresh targets are drawn.
    method_ceiling:
      strongest_certifiable_claim: A scoped cost comparison on declared torsion orders and curve families; no generic-curve asymptotic claim.
      nearby_object_control: Birational model changes without quotienting remain a separate representation control.
    proof_obligations:
      - claim: phi and every recovery branch are exact on all rational points in tested support.
        responsibility: correctness
      - claim: PGL2 conjugates preserve the canonical relation set.
        responsibility: correctness
      - claim: Factor-base shrinkage and decomposition-probability loss are both measured.
        responsibility: success_probability
      - claim: Independent relation rank and final matrix dimension are charged.
        responsibility: runtime
  predictions:
    - metric: complete_cost_per_verified_independent_relation
      direction: lower
      minimum_effect: At least 20% lower complete cost than ordinary x-coordinate Semaev on three increasing sizes, surviving PGL2 controls and held-out targets.
    - metric: pgl2_relation_set_invariance
      direction: different
      minimum_effect: Exact equality of decoded relation sets for fixed PGL2 conjugates.
  minimal_test:
    design: >-
      Use at least three curve families admitting rational torsion orders drawn from
      {2,3,4} where the quotient/equivariant map is explicit. For each family build
      ordinary x-coordinate Semaev, the torsion quotient phi, two fixed PGL2
      conjugates, and a same-degree random-coordinate null when defined. Hold the
      mathematical support fixed for the coordinate-only comparison, then run a
      separately labelled model-adapted factor-base comparison. Use the same solver,
      target stream and verifier in all arms.
    controls:
      - Exhaustive point-map and recovery checks at the smallest field.
      - Exact canonical relation-set equality for PGL2 conjugates.
      - Same mathematical point set in coordinate-only arms.
      - Same-cardinality random-coordinate null.
      - Torsion-unavailable curves are recorded as inapplicable rather than replaced.
      - Ordinary x-coordinate and existing Edwards/Hessian transport are representation baselines.
    required_metrics:
      - quotient_degree_and_fibre_sizes
      - factor_base_cardinality
      - decomposition_success_probability
      - verified_relation_count
      - independent_relation_rank
      - equation_and_variable_count
      - polynomial_term_count
      - maximum_solver_degree
      - maximum_macaulay_matrix_dimension
      - solver_wall_seconds
      - map_and_recovery_cost
      - final_linear_algebra_dimension
      - complete_cost_per_verified_independent_relation
  falsification_conditions:
    - Apparent benefit vanishes when the mathematical point set is held fixed.
    - Decomposition-probability or rank loss erases solver/factor-base savings in every cell.
    - PGL2 conjugates change canonical relation counts, indicating a transport bug.
    - A positive result depends on omitted exceptional fibres, denominator-zero points or free map construction.
  confounders:
    - Special-curve torsion density and cofactor effects.
    - Mixing birational-model savings with quotient-map savings.
    - Counting coordinate values instead of mathematical points.
    - Solver monomial-order sensitivity under PGL2 conjugacy.
    - Silently transferring extension-field assumptions to prime fields.
  interpretation_limits:
    - Proposal only; no scientific run is created or implied.
    - The known small-torsion method is prior art.
    - A positive result applies only to tested curve/torsion families.
    - Constant-factor improvement is not a sub-rho asymptotic result.
  heuristic_assumptions: []
  heuristic_note: Relation density and fibre sizes are measured directly; no uniform-fibre heuristic receives credit without diagnostics.
  target_complexity:
    time_exponent: Unknown; no exponent improvement claimed.
    memory_exponent: Unknown.
    best_known: Matched conventional Semaev/solver baseline on the same instances.
    hidden_overhead: Quotient construction, exceptional fibres, recovery, factor-log duplication and final linear algebra.
    tradeoff_note: Smaller factor bases can reduce linear algebra while also reducing decomposition probability.
  estimated_cost:
    implementation: medium
    compute: medium
    qualification: Existing transport/verifier machinery can be reused, but quotient systems need a new frozen contract.
  dominated_by: unchecked
  sota_delta:
    time: Unmeasured.
    memory: Unmeasured.
    data_queries: Unmeasured.
  frontier_check:
    status: pending
    note: Prior-art mechanism acknowledged; frontier question is the fully charged benchmark under the common harness.
  recommended_priority: high
  priority_rationale: The repo has much of the correctness machinery while the actual torsion-quotient scientific comparison remains unexecuted.
  first_deliverable: Exact quotient/equivariant-map catalogue for the first three cells with canonical transport and frozen scoring.
  next_gate: Coordinator dedup against IDEA-20260905-4dff7b and equation-schemes intake, then authorize a scientific experiment rather than another engineering-only runner.
