idea:
  id: IDEA-20260823-38f214
  record_type: proposal
  added: "2026-08-23"
  goal_id: GOAL-ECDLP-001
  batch_id: BATCH-90fff7
  task_id: TASK-20260823-9ccc23
  role: idea-generator
  title: Degree-three cover fibers as a lossy correspondence automaton
  class: mechanism
  claim: >-
    Conditional research proposal only; the exact possible bound and every
    unproved dependency remain solely those already stated in
    conditional_complexity_claim, and no algorithm or improvement is
    established.
  mechanism: >-
    The proposed mechanism is exactly the composition already specified by
    lossy_object, public_evaluation, one_step_propagation, and target_decoder;
    their existing current_gap and falsification fields remain controlling.
  proposal_status: unverified
  novelty_status: unverified
  novelty_note: >-
    Retrieved sources do not establish a bounded-width source-independent
    propagation-and-decoding theorem for this degree-three quotient object. The
    construction is recorded as a new proposal in this campaign, not as a
    literature novelty claim.
  claim_boundary:
    allowed: definition of an object-first mechanism and falsification program
    disallowed:
      - implementation claim
      - experiment claim
      - asymptotic improvement claim
      - hypothesis status change
      - novelty claim
      - breakthrough claim
  problem:
    group: prime-order subgroup generated by P on an elliptic curve over a prime field
    order_symbol: N
    target: Q equals scalar multiplication of x and P
    excluded_lenses:
      - automorphism-orbit quotienting
      - smoothness and index-calculus relations
      - interval-only discrete logarithm
      - generic rho or baby-step giant-step repackaging
      - pairing or field-discrete-log transfer
  lossy_object:
    name: degree-three cover fiber label
    definition: >-
      Fix a public separable rational map pi from E to the projective line of
      degree three, chosen without reference to Q. Define U(R)=pi(R). The value
      identifies a fiber of at most three geometric points and deliberately
      forgets which sheet contains R.
    parameter_range:
      cover_degree: exactly 3 in the first audit
      field: prime
      subgroup: prime order
    discarded_information: >-
      The sheet label, full point coordinates, and scalar index are discarded.
      Distinct points in one fiber share U even when translation by P sends them
      to different output fibers.
    lossiness_argument: >-
      A separable degree-three map is generically three-to-one over the algebraic
      closure. Rational-fiber sizes and exceptional ramification are to be
      audited explicitly rather than converted into injectivity assumptions.
  public_evaluation:
    inputs: [curve_parameters, P, R, pi]
    method: evaluate the fixed public rational map at R
    charged_cost:
      time: O(1) field operations for fixed-degree pi
      memory: O(1) field elements
      data_queries: one public map evaluation
    forbidden_assistance:
      - sheet oracle
      - scalar of R
      - DLP or CDH oracle
      - target-specific cover
      - uncharged pair table
  one_step_propagation:
    exact_relation: >-
      Eliminating point coordinates from u=pi(R) and v=pi(R+P) produces a public
      algebraic correspondence C_P(u,v)=0 of bounded degree for fixed pi.
    missing_state: >-
      C_P can be multivalued because U forgets the input sheet. A deterministic
      transition requires the successor fiber to be the same for every rational
      point in a source fiber, or requires bounded provenance state whose update
      is itself public and lossless enough to remain useful.
    collision_test: >-
      Find R not equal to R' with U(R)=U(R') but U(R+P) not equal to U(R'+P).
      Such a pair is an observation collision and refutes deterministic
      propagation on U alone.
  target_decoder:
    required_statement: >-
      Given U(Q), recover every scalar x with U(xP)=U(Q), then distinguish Q
      within its fiber, in fewer than N^(1/2-o(1)) charged operations and without
      expanding an exponential correspondence tree.
    candidate_mechanism: >-
      A bounded-width automaton on fiber values plus a bounded public provenance
      label, followed by constant-size fiber disambiguation and direct group
      verification.
    current_gap: >-
      No theorem bounds correspondence width over long translation or shows that
      the provenance state remains sub-square-root. Enumerating branches or
      storing all input-output pairs degenerates to exponential branching, a
      length-N table, or generic collision search.
    verification: verify each candidate scalar by checking scalar multiplication of x and P equals Q
  conditional_complexity_claim:
    statement: >-
      If there is a public provenance state of N^(o(1)) possibilities that makes
      C_P propagation deterministic, supports binary powering or block jumping
      with N^(1/3+o(1)) total construction cost, and admits inversion from U(Q)
      in N^(1/3+o(1)) time and memory, then this object would give the same
      conditional ECDLP bound.
    status: unverified
    heuristic_dependencies:
      - id: H-FIBER-1
        statement: long-run correspondence width is bounded by N^(o(1)) after adding public provenance
        falsification: width or provenance entropy grows as N^(1/2-o(1)) or faster
      - id: H-FIBER-2
        statement: the target fiber can be inverted to scalar indices without generic search
        falsification: inverse location requires a length-N table, target advice, or square-root collision work
  predictions:
    - Generic degree-three covers will exhibit same-fiber different-successor collisions.
    - Any surviving cover must have special translation-compatible monodromy visible in a theorem.
    - Provenance entropy, rather than local evaluation cost, will be the load-bearing quantity.
  minimal_discriminating_tests:
    - id: FIBER-AUDIT-BASELINE
      type: static
      action: reproduce fully charged rho and BSGS baselines
      falsification: a claimed gain disappears after preprocessing, branch enumeration, or memory is charged
    - id: FIBER-AUDIT-COLLISION
      type: proposed_experiment
      action: enumerate rational fibers and compare their successor fibers
      control: a degree-three random set map with matched fiber-size distribution
      falsification: one same-fiber different-successor pair refutes U-only deterministic propagation
    - id: FIBER-AUDIT-WIDTH
      type: proposed_experiment
      action: measure distinct reachable fiber states and provenance entropy over step count
      control: nearby degree-two and random degree-three correspondences
      falsification: nondecaying branching rate or width reaching the square-root baseline
    - id: FIBER-AUDIT-NEARBY
      type: static_control
      action: apply the proof outline to a random degree-three correspondence with no group-compatible decoder
      falsification: an outline proving a decoder for the random object exposes an invalid step
  falsification_criteria:
    mechanism:
      - U-only deterministic propagation fails by observation collision
      - bounded provenance cannot be constructed publicly
      - inversion expands a branch tree or requires a full pair table
    conditional_claim:
      - H-FIBER-1 or H-FIBER-2 fails
      - total work or aggregate memory reaches N^(1/2-o(1))
  confounders:
    - ramified and exceptional fibers can mimic low branching on small samples
    - rational fibers may have different sizes from geometric fibers
    - a specially chosen cover may secretly be an automorphism quotient
    - branch merging can hide accumulated provenance entropy
  interpretation_limits:
    - A collision for one cover does not rule out every degree-three cover.
    - Small observed width does not prove asymptotic bounded width.
    - A bounded local correspondence is not a scalar decoder.
    - This proposal is not evidence of an ECDLP improvement.
  cost_model:
    baseline:
      pollard_rho:
        time: N^(1/2+o(1)) group operations
        memory: O(1) serial state, with parallel coordination charged
        data_queries: none beyond public group operations
      baby_step_giant_step:
        time: N^(1/2+o(1)) group operations
        memory: N^(1/2+o(1)) group elements
        data_queries: none beyond public group operations
    candidate_charges:
      preprocessing: cover construction, elimination, and transition data
      enumeration: all fibers, branches, and provenance states
      linear_algebra: elimination and any later recurrence recovery
      target_descent: inverse traversal from U(Q) to scalar candidates
      retries: inverse success probability times per-attempt cost
      verification: one scalar multiplication per candidate
      memory: transition tables, branch frontier, provenance state, and candidates
      data_queries: every pi evaluation and group operation
      parallelism: aggregate work and aggregate memory
      multi_target: disclose reusable source-only preprocessing and the number of independent targets
    present_bound: >-
      Constant-cost evaluation and bounded local algebraic degree do not control
      long-run width or inverse location. Known honest realizations therefore
      revert to full tables, exponential branch handling, or generic square-root
      work.
  pareto:
    comparison_axes: [time, memory, data_queries]
    dominated_by:
      - Pollard rho dominates full-table and uncontrolled-branch realizations for single targets.
      - BSGS dominates a length-N pair-table realization in time and memory.
    sota_delta:
      time_exponent: unknown
      memory_exponent: unknown
      data_query_exponent: unknown
      statement: >-
        Local representation size is smaller, but decoder costs are unknown and
        therefore incomparable until provenance entropy and inverse-location
        bounds are proved.
    checked_rows:
      - Pollard rho
      - baby-step giant-step
  proof_search_map:
    target_statement: >-
      A fixed degree-three cover admits bounded-width translation propagation and
      sub-rho inversion to scalar indices.
    lemma_dependencies:
      - id: FIBER-L1
        responsibility: fiber size, ramification, and lossiness
      - id: FIBER-L2
        responsibility: construction and degree of C_P
      - id: FIBER-L3
        responsibility: provenance entropy and long-run width
      - id: FIBER-L4
        responsibility: inverse-location correctness and success probability
      - id: FIBER-L5
        responsibility: fully charged end-to-end time and memory
    audits:
      exact_baseline_reproduction:
        status: specified_not_run
        requirement: charge rho, BSGS, cover construction, branching, and verification
      observation_collision_search:
        status: specified_not_run
        requirement: equal U values with unequal translated U values
      quantifier_order:
        status: specified_not_run
        statement: >-
          There exists one public cover and preprocessing algorithm depending
          only on curve parameters and P such that for every target Q the
          decoder succeeds within the stated bound.
      method_ceiling:
        status: specified_not_run
        nearby_object_control: random degree-three correspondence with matched local degree
        ceiling: bounded local degree alone permits exponential branch growth or a full transition table
  citations:
    - citation: >-
        V. Shoup, Lower Bounds for Discrete Logarithms and Related Problems,
        EUROCRYPT 1997.
      provenance: retrieved
      verified_by: TASK-20260823-9ccc23
      locator: https://www.shoup.net/papers/dlbounds1.pdf
      supports: generic square-root baseline and the requirement to identify non-generic structure
    - citation: >-
        V. Miller, Use of Elliptic Curves in Cryptography, CRYPTO 1985.
      provenance: recalled
      locator: https://crypto.stanford.edu/miller/
      supports: contextual pointer only; not used to establish the proposed cover decoder
  safety:
    defensive_purpose: assess structural attack surfaces of prime-field elliptic-curve groups
    implementation_created: false
    experiment_runs: 0
