# IDEA-20261004-342bae
# Class-number count for discriminants -1635 and -1675. Proposal only. Not approved.
idea:
  id: IDEA-20261004-342bae
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -1635 is 8 and of discriminant -1675 is 7
  class: measurement
  claim: >-
    Discriminant -1635 has 8 reduced binary quadratic forms.
    Discriminant -1675 has 7. Eight exceeds seven by 1. The product of
    the two class numbers is 56. Their sum is 15. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -1635 has the forms with coefficients 1, 1, 409 and
    3, 3, 137 and 5, 5, 83 and 11, -9, 39 and 11, 9, 39 and 13, -9, 33
    and 13, 9, 33 and 15, 15, 31. Discriminant -1675 has the forms with
    coefficients 1, 1, 419 and 5, 5, 85 and 17, -5, 25 and 17, 5, 25 and
    19, -15, 25 and 19, 15, 25 and 23, 21, 23. Two copies of class number
    7 have gap 0. No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks which j-invariant distinctions change an
        attack cost.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
