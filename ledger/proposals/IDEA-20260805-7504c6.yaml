idea:
  id: IDEA-20260805-7504c6
  question_id: RQ-SDITH-001
  added: '2026-08-05'
  title: >-
    Stop asking whether the split is free and start asking WHERE it stops being
    free: d as a continuous dial from plain SD to regular SD, with the endpoint
    where the conclusion is known false supplied for free as the nearby-object
    control
  class: mechanism

  claim: >-
    The question "is d-split syndrome decoding as hard as plain SD" is posed as
    a binary and that framing is what has kept it unanswered. It is the d = 2
    slice of a one-parameter family. At d = 1 the split is vacuous and the
    problems are identical by definition. At d = w with block size 2 the split
    is REGULAR syndrome decoding, where the promise is worth 76 bits at w = 80
    (derived exactly here) and where dedicated attacks are recalled to exist. So
    the honest object is not a yes/no but a LOCATION: the family degrades
    smoothly and monotonically along d, this record computes the degradation
    curve exactly in closed form and in exact integers, and the research
    question becomes whether SDitH's d sits safely below the knee and by how
    much margin. That reframing supplies, at zero cost, the one audit
    docs/inventor-protocol.md section 8 asks for and this program almost never
    performs: a NEARBY OBJECT WHERE THE HOPED-FOR CONCLUSION IS KNOWN FALSE. A
    method that concludes "the split is free" must be shown to say something
    different at d = w, or it has not identified the load-bearing structure and
    its verdict at d = 2 is uninterpretable.

  object_first_candidate:
    tracked_object: >-
      d ITSELF, promoted from a fixed scheme parameter to the independent
      variable, with the tracked quantity being the pair
      (information-theoretic loss, algorithmic gain) =
      (-log2 R(n,w,d), log2 G(n,k,w,d)) traced as d runs over the divisors of
      gcd(n, k, w). The object followed through the computation is the
      block-weight profile of IDEA-20260805-cbd93d, but the thing being TRACKED
      here is the shape of its degradation curve rather than its value at one
      point. Those are different research objects and they answer different
      questions: one asks "how much", the other asks "where does it break, and
      is the answer at d = 2 a fact about d = 2 or a fact about the instrument".
    established_families_off_limits: >-
      Declared off-limits as the primary lens: (1) ISD as an algorithm to be
      improved; (2) index calculus, which for SD is ISD renamed and whose
      novelty claim would be false; (3) the algebraic modelling of regular SD --
      it is NAMED as the reason the d = w endpoint is a place where the
      conclusion fails, and is deliberately NOT used as a tool here, because
      importing it would make this a proposal about RSD attacks rather than a
      control on a method; (4) MPCitH soundness, which is a different object
      entirely; (5) statistical decoding. The proposal introduces NO new
      algorithm and claims NO attack. It is a control design and a localization.
    newness_score: >-
      Genuinely new IN THIS PROGRAM as a framing, and the framing is the
      contribution rather than any mathematics. IDEA-20260801-017, the only
      prior proposal on RQ-SDITH-001, is binary: it asks whether a measured cost
      ratio falls outside [0.5, 2] at a single toy scale, has no d-axis at all,
      and would return "ratio approximately 1, d-split is neutral" at d = 2 with
      no way to tell whether that means the split is harmless or the instrument
      is blind. Externally, that RSD is easier than SD is recalled to be known
      and the interpolating family is likely to have been studied; NO EXTERNAL
      NOVELTY IS CLAIMED. What is not obviously anywhere, and what this record
      supplies, is the family used as an INSTRUMENT VALIDATION AXIS rather than
      as an object of study.
    testability_score: >-
      Maximal on the counting axis: the whole curve is exact binomials,
      evaluable in milliseconds at deployed sizes, computed in this record
      already. Lower on the algorithmic axis: locating the knee for a
      representation-technique ISD, rather than for Prange, needs cost formulas
      this record does not have and does not fabricate, and that limitation is
      declared rather than absorbed.
    survival_score: >-
      The counting curve survives the entire d-axis by construction. The
      Prange-level gain curve survives as long as per-iteration success
      factorizes over blocks, which holds along the whole axis for Prange. What
      does NOT survive is the identification of "algorithmic gain" with
      "security loss": at large d a dedicated algebraic attack may beat ISD
      entirely, in which case the ISD-based curve understates the loss and the
      curve's own shape cannot detect that. Declared as the proposal's boundary.

  mechanism: >-
    DERIVED AND COMPUTED IN THIS RECORD. The counting apparatus is that of
    IDEA-20260805-cbd93d and is not restated; what is derived here is the shape
    of the curve and the argument that its endpoints are the right controls.

    THE FAMILY. Fix (n, k, w) and let d range over the divisors of
    gcd(n, k, w). The d-split instance forces weight exactly w/d in each of d
    blocks of size n/d. Two quantities:
      information-theoretic loss  L(d) = -log2 [ C(n/d, w/d)^d / C(n, w) ]
      Prange-level gain           A(d) =  log2 [ R(n-k, w, d) / R(n, w, d) ].
    d = 1 gives L = A = 0 identically. d = w with n = 2w gives the regular
    syndrome decoding instance.

    THE CURVE, COMPUTED EXACTLY. At n = 320, k = 160, w = 80 (illustrative, and
    chosen so many d divide gcd):
      d      n/d   w/d    L(d) bits   A(d) bits
      1      320    80        0.000       0.000
      2      160    40        3.284       0.291
      4       80    20        8.862       0.868
      5       64    16       11.351       1.155
      8       40    10       18.057       2.008
      10      32     8       22.064       2.570
      16      20     5       32.603       4.228
      20      16     4       38.734       5.308
      40       8     2       63.034      10.421
      80       4     1       95.328      19.317
    Both are strictly increasing. The two differ by more than an order of
    magnitude at small d and converge toward each other only at the extreme, and
    that gap IS the substantive content: an analyst who reports L as the
    security loss overstates it by a factor of 11 at d = 2 and by a factor of 5
    at d = 80.

    THE ENDPOINT WHERE THE CONCLUSION FAILS. Take d = w with block size 2
    (n = 2w, k = w). Each block holds one error in two positions; the attacker
    puts one column of each block in the information set; T_split = 2^w while
    T_plain = C(2w, w). Computed exactly here:
      w =  8:  A = 5.652   closed form w - (1/2) log2(pi w) = 5.674
      w = 16:  A = 13.163                                     13.174
      w = 32:  A = 28.669                                     28.674
      w = 64:  A = 60.171                                     60.174
      w = 80:  A = 76.011                                     76.013
    SEVENTY-SIX BITS at w = 80, and the closed form agrees to 0.002. At this
    endpoint L = A exactly, because C((n-k)/d, w/d) = C(1,1) = 1 makes the
    denominator of the gain trivial -- an algebraic coincidence worth recording
    because it is a second, independent check on the code path: any
    implementation must return L = A at d = w, n = 2w, k = w and must return
    L != A everywhere else.

    WHY THIS IS A CONTROL AND NOT JUST A SWEEP. Inventor protocol section 8,
    audit 4, asks for the closest object where the hoped-for conclusion fails,
    on the grounds that a method which cannot separate the pair has not found
    the load-bearing structure. Here the pair is (d = 2, d = w) at matched
    (n, k, w), and it is as tight a pair as this problem admits: same code, same
    parity-check matrix distribution, same weight, same field, ONE parameter
    different. A measurement procedure that reports "the split is free" must
    report something very different at d = w or it is measuring the apparatus.
    This program's own history is the reason to insist: the session ANGLE-BRIEF
    records that 188 of 229 evidence records have no positive control, that only
    26 of 195 specifications mention one, and that on a strict application
    roughly 51 records are not entitled to their neutral verdict because nothing
    shows the instrument could have moved. The d-axis makes that failure
    impossible here at zero marginal cost, because the control is the same
    computation with one argument changed.

    WHERE THE KNEE IS, AND WHY THAT IS THE ACTUAL RESEARCH QUESTION. A(d) is
    approximately ((d-1)/2) log2 [ ((n-w)/(n-1)) ((n-k-1)/(n-k-w)) ] while
    w/d stays large, so it grows LINEARLY in d with a small slope -- 0.291 bits
    per unit of (d-1)/2 at the illustrative set -- and then bends upward as w/d
    approaches 1 and the per-block promise becomes nearly a per-position
    promise. Reading the computed column: A(d)/(d-1) is 0.291, 0.289, 0.289,
    0.287, 0.286, 0.282, 0.279, 0.267, 0.244 at d = 2, 4, 5, 8, 10, 16, 20, 40,
    80. THE PER-UNIT GAIN IS ESSENTIALLY FLAT ACROSS THE WHOLE AXIS, and the
    total grows because d does. That is a genuinely informative shape and it was
    not obvious in advance: it says there is NO KNEE in the Prange-level gain --
    the degradation is linear in d with no threshold -- and therefore that any
    threshold behaviour observed at large d must come from an algorithm OUTSIDE
    the block-factorizing ISD family. That is a sharp, falsifiable structural
    statement, it points directly at the algebraic RSD attacks as the only
    available source of a knee, and it was produced by a sweep whose only
    purpose was to be a control.

    THE ALGEBRAIC SIDE, STATED AS A QUESTION AND NOT AS A RESULT. A natural
    block-wise algebraic model introduces, per block, an indicator over the
    C(n/d, w/d) admissible weight patterns; the model's size is therefore
    d * C(n/d, w/d) and it is smallest exactly when w/d = 1, where it degenerates
    to d * (n/d) = n indicator variables -- the regular-SD model, which is the
    one recalled to admit dedicated attacks. Computed at the illustrative set:
    log2 of d*C(n/d, w/d) is 255.33 at d = 1, 127.02 at d = 2, 63.62 at d = 4,
    51.12 at d = 5, 32.66 at d = 8, 26.65 at d = 10, 17.92 at d = 16, 15.15 at
    d = 20, 10.13 at d = 40 and 8.32 at d = 80. THE MODEL SHRINKS BY 118.70 BITS
    BETWEEN d = 2 AND d = 80 while the ISD gain grows by only 19.03 over the
    same range -- a ratio of 6.24 to 1. If a knee exists it is
    here, and locating the d at which the algebraic model becomes competitive
    with charged ISD is a well-posed question this proposal states and does not
    answer. NO ATTACK IS CLAIMED, NO RSD ATTACK IS CITED, and the recalled fact
    that dedicated RSD attacks exist is labelled RECALLED-UNVERIFIED throughout.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/proposals (prior art for RQ-SDITH-001: one record, IDEA-20260801-017)
      - ledger/ areas SDITH, HQC, MCE for any d-axis, regular-SD or split-family record
      - the session ANGLE-BRIEF F8 and F9 tables and its TRAPS section
    grep_results:
      - >-
        No record in this program treats d as a variable. IDEA-20260801-017
        fixes d implicitly and asks a binary question at one toy scale.
      - >-
        No regular-syndrome-decoding record of any kind exists in the corpus.
      - >-
        The ANGLE-BRIEF's T-J template ("the nearby object where the conclusion
        is known false") is listed as an inventor-protocol audit run almost
        nowhere in this program, with three live instances named, none in F8 or
        F9.
    conclusion: >-
      The FRAMING is new to this program; the mathematics is elementary and the
      external literature on regular and split syndrome decoding was NOT
      searched from this session. Novelty against the world is unverified and
      presumed low, and the corpus screen is discounted per the ANGLE-BRIEF's
      measured findings about the literature corpus's verification fields.

  literature_context:
    - >-
      REGULAR SYNDROME DECODING BEING EASIER THAN PLAIN SD, AND THE EXISTENCE OF
      DEDICATED ALGEBRAIC ATTACKS ON IT: RECALLED-UNVERIFIED. No author, venue,
      year, theorem number or figure is asserted. This is the single recalled
      fact the proposal leans on and it is load-bearing ONLY for the claim that
      d = w is a place where the hoped-for conclusion is known to fail. If it
      turns out to be false, the d = w endpoint remains a valid POSITIVE CONTROL
      -- the 76-bit ISD gain is derived here and does not depend on any citation
      -- and only the word "known" in the proposal's framing must be withdrawn.
      Checking it is a declared stage.
    - >-
      SDitH SPECIFICATION: NOT READ. SDitH's actual d is UNKNOWN to this record.
      The whole proposal is stated as a family and its application to SDitH
      requires Stage 0 of the paired experiment.
    - >-
      docs/inventor-protocol.md section 8 audit 4 (method ceiling and
      nearby-object control): READ this session. It is the direct source of this
      proposal's design and the reason the d-axis is framed as a control rather
      than as a survey.

  lossy_projection_identifiability_audit:
    projection: >-
      The whole d-split instance family at fixed (n, k, w)  -->  the pair of
      real-valued curves d -> (L(d), A(d)).
    what_is_discarded: >-
      Every instance, every parity-check matrix, every error vector, every field
      value, and every algorithm other than block-factorizing ISD. Two entirely
      different split constructions with the same block sizes produce the same
      two curves.
    why_genuinely_lossy: >-
      Overwhelmingly, and non-invertibly: the curves are two real functions of a
      single integer parameter, summarizing families of instances of
      astronomical size.
    why_compatible_with_the_operations: >-
      L and A are exact functions of (n, k, w, d) alone, and the operation being
      studied -- the change in Prange's iteration count induced by the promise
      -- is exactly what A computes. The retained part determines the studied
      quantity deterministically.
    is_it_only_a_change_of_coordinates: >-
      CHECKED, AND THE ANSWER IS INTERESTING RATHER THAN CLEAN. L and A are NOT
      a change of coordinates on each other: they differ by a factor of 11 at
      d = 2 and coincide only at d = 1 and at the d = w, n = 2w extreme, which
      is a derived and checkable structural fact rather than a coincidence. But
      the honest answer must go further: the curve d -> A(d) IS, up to the
      accuracy of the local-CLT closed form, the single affine function
      A(d) ~= (d-1)/2 * const, so along most of the axis the curve carries ONE
      number and the sweep is close to a reparametrization of that number. This
      is stated rather than hidden because it is the strongest available
      objection to the proposal: if A were exactly affine the sweep would add
      nothing beyond its slope. It is not exactly affine -- the computed
      per-unit gains 0.291 down to 0.244 across the axis show a real 16 per cent
      drift, and the exact-versus-closed-form divergence grows from 0.001 to 3.6
      bits -- so the sweep does carry information beyond the slope, but not
      much, and the honest weight of the counting half of this proposal is
      "cheap control" rather than "discovery".
    mirror_failure_checked: >-
      CHECKED, AND THIS IS PRECISELY THE FAILURE THE PROPOSAL EXISTS TO PREVENT
      IN OTHERS. A d-split measurement performed only at d = 2 returns a small
      number; a broken instrument also returns a small number; the two are
      indistinguishable without the other end of the axis. That is the
      zero-comparator-spread failure exactly, and the d = w endpoint at 76 bits
      is the demonstration that the spread is not zero. The proposal's own
      exposure to the same failure is the affine-drift issue in the field above,
      which is stated there.

  assumptions:
    - >-
      That d ranges over divisors of gcd(n, k, w) so balanced blocks and a
      balanced information set exist. Off-lattice d requires optimizing the
      allocation and is handled by exact computation, not by assumption.
    - >-
      That block-factorization of the per-iteration success holds along the
      whole axis for the algorithms in scope. True for Prange by conditional
      independence; NOT established for representation-technique ISD, and
      therefore the curve is a Prange-level curve and is labelled one
      everywhere.
    - >-
      That RSD is the d = w endpoint of the same family. This is definitional
      for the exactly-one-error-per-block form; if SDitH's split has a different
      form the interpolation still exists but its endpoint may not be RSD, and
      Stage 0 determines which.

  predictions:
    - metric: >-
        L(d) and A(d) at d = 1, exact integer computation
      direction: different
      minimum_effect: >-
        BOTH EXACTLY 0.000000. Forced, zero tolerance, primary correctness gate.
    - metric: >-
        L(d) = A(d) at the d = w, n = 2w, k = w extreme
      direction: different
      minimum_effect: >-
        Equality to within 1e-9 bits at every w tested, because
        C((n-k)/d, w/d) = C(1,1) = 1 there. This is a second, algebraically
        independent gate on the code path, and it must FAIL to hold at every
        other cell -- an implementation that returns L = A everywhere has
        conflated the two quantities, which is the single most likely coding
        error in this instrument.
    - metric: >-
        monotonicity of A(d) across the full sweep at the illustrative
        n = 320, k = 160, w = 80
      direction: higher
      minimum_effect: >-
        Strictly increasing, matching the pre-registered values 0.000, 0.291,
        0.868, 1.155, 2.008, 2.570, 4.228, 5.308, 10.421, 19.317 to within 0.01
        bits each.
    - metric: >-
        per-unit gain A(d)/(d-1) across the sweep
      direction: lower
      minimum_effect: >-
        Between 0.24 and 0.30 at every d >= 2, decreasing, with total drift
        between 10 and 25 per cent end to end. Derived here: 0.291, 0.289,
        0.289, 0.287, 0.286, 0.282, 0.279, 0.267, 0.244 -- a 16 per cent drift.
        THIS IS THE NO-KNEE PREDICTION and it is the proposal's substantive
        structural claim: if the measured per-unit gain jumps by more than a
        factor of two anywhere on the axis, a knee exists inside the
        block-factorizing family and the claim is falsified.
    - metric: >-
        A(d) at the d = w positive control with w = 80
      direction: higher
      minimum_effect: >-
        76.011 bits within 0.01, matching w - (1/2) log2(pi w) = 76.013. Under
        60 bits means the instrument cannot see a split advantage and no
        d = 2 negative may be reported.
    - metric: >-
        log2 of the block-wise algebraic model size d * C(n/d, w/d) across the
        sweep
      direction: lower
      minimum_effect: >-
        Strictly decreasing, spanning at least 100 bits from d = 2 to d = 80.
        Derived here: 127.02, 63.62, 32.66, 17.92, 10.13, 8.32 at d = 2, 4, 8,
        16, 40, 80 -- a 118.70-bit span against a 19.03-bit span for A(d) over
        the same range. THE PRE-REGISTERED QUANTITY IS THE RATIO OF THE TWO
        SPANS, 6.24, to within 10 per cent; if it comes out below 2, the claim
        that the algebraic side is where a knee could live is substantially
        weakened.

  minimal_test:
    design: >-
      Exact integer arithmetic, standard library only, seconds. Stage 1 alone
      settles the no-knee prediction.
      STAGE 0 (reading, no compute): obtain SDitH's d and the exact split form;
      separately, attempt to confirm or refute the RECALLED-UNVERIFIED claim that
      dedicated RSD attacks exist and that RSD is easier than plain SD, and
      record exactly what was and was not confirmed. Both may fail; a failure is
      infrastructure signal and the remaining stages are unaffected.
      STAGE 1 (seconds): the full d-sweep of L, A, per-unit gain, and algebraic
      model size at two or three illustrative (n, k, w), with both forced-value
      gates and the positive control.
      STAGE 2 (seconds): locate SDitH's d on the curve if Stage 0 supplied it,
      and report its margin to the nearest d at which A exceeds 3, 10 and 30
      bits.
      STAGE 3 (minutes, optional): brute-force verification at n <= 24 that the
      counts and the simulated Prange iteration ratios agree with L and A.
    controls:
      - >-
        NULL OBJECT (d = 1). Forced value L = A = 0 exactly. Can fail on any
        block-indexing error.
      - >-
        SECOND NULL (blocks without the weight constraint). Partition into d
        blocks, impose nothing. Forced value A = 1 (0 bits) for every d, which
        separates "there is a partition" from "the partition constrains" and is
        the control that a d-sweep alone would not supply.
      - >-
        POSITIVE CONTROL AND NEARBY OBJECT, THE SAME CELL (d = w, n = 2w, k = w).
        Forced value A = 76.011 bits at w = 80, independently predicted by
        w - (1/2) log2(pi w). This cell does double duty: it demonstrates the
        instrument can move, AND it is the closest object at which the hoped-for
        conclusion "the split is free" is false, which is the section-8 audit
        this program almost never runs.
      - >-
        GRADED CONTROL, 8 INTERIOR POINTS, MONOTONICITY AND PER-UNIT DRIFT BOTH
        REPORTED. The full sweep above. Reporting the per-unit gain alongside
        the total is what makes it diagnostic rather than decorative: a total
        that rises while the per-unit gain stays flat is the no-knee signature,
        and a total that rises because the per-unit gain jumps at one d
        localizes a knee to that d.
      - >-
        CROSS-CHECK CONTROL (w scaling at the extreme). Run the d = w endpoint
        at w = 8, 16, 32, 64, 80 and check A against w - (1/2) log2(pi w) at
        each. Derived targets 5.652, 13.163, 28.669, 60.171, 76.011 against
        5.674, 13.174, 28.674, 60.174, 76.013. This tests the instrument along a
        SECOND axis, so an error that happens to be invisible along d is caught
        along w.
    required_metrics:
      - L(d), A(d), A(d)/(d-1) and log2 (d * C(n/d, w/d)) per cell, exact
      - the two forced-value gates and their pass/fail status
      - explicit monotonicity verdict and end-to-end per-unit drift
      - positive-control value and the w-scaling cross-check table
      - SDitH's d located on the curve with its margin, or a recorded failed fetch
      - a record of what the RSD literature check did and did not confirm

  falsification_conditions:
    - >-
      L or A nonzero at d = 1. Everything is void.
    - >-
      L != A at the d = w, n = 2w, k = w extreme, or L = A anywhere else. The
      two quantities have been conflated in code.
    - >-
      The per-unit gain jumps by more than a factor of two anywhere on the axis.
      The no-knee claim is falsified and a knee exists inside the
      block-factorizing family, which would be more interesting than the
      proposal's expected outcome.
    - >-
      The positive control returns under 60 bits at w = 80. No negative may be
      reported.
    - >-
      The algebraic-model span is under twice the A span. The claim that the
      algebraic side is the plausible home of a knee is substantially weakened
      and should be restated.
    - >-
      Stage 0 shows SDitH's split is not the per-block exact-weight form, so
      that d = w is not RSD. The nearby-object identification is withdrawn; the
      positive control survives, since its 76 bits are derived and not cited.

  confounders:
    - >-
      THE AFFINE-DRIFT OBJECTION, WHICH IS THE STRONGEST ONE AGAINST THIS
      RECORD. A(d) is close to affine in d over most of the axis, so the sweep
      carries little information beyond its slope. It is retained because the
      16 per cent drift is real and because the sweep's PRIMARY value is as a
      control, not as a discovery. A reviewer is entitled to score the counting
      half of this proposal low on that basis and should.
    - >-
      ISD-ONLY. The curve is a statement about block-factorizing ISD. If a
      dedicated algebraic attack dominates at large d, the ISD curve UNDERSTATES
      the security loss there and cannot detect its own inadequacy. This is why
      the algebraic-model-size column exists, and that column is a size estimate,
      not a cost estimate, and must never be reported as one.
    - >-
      ENDPOINT SPECIALNESS. n = 2w at d = w is an extreme parameter shape as
      well as an extreme d. Some of the 76 bits may be attributable to the shape
      rather than to the split, and the w-scaling cross-check is what separates
      them: the closed form w - (1/2) log2(pi w) predicts the whole 76 bits from
      w alone, which is evidence the split is doing the work, but it is
      evidence, not a proof.
    - >-
      MATCHED-PARAMETER AMBIGUITY, as in IDEA-20260805-cbd93d: comparing at
      fixed (n, k, w) is one defensible matching among several, and the choice
      must be reported rather than made silently.

  interpretation_limits:
    - >-
      CLAIM TIER: a derivation about counting quantities and Prange-level
      iteration ratios, evaluated exactly at deployed sizes. NO attack, NO
      certificate, NO security claim about SDitH or about RSD. Under
      docs/claims-and-verification.md nothing here is reportable above a
      derivation.
    - >-
      "There is no knee" is scoped to the block-factorizing ISD family, to the
      Prange-level cost, and to the parameter shapes actually swept. It says
      nothing about where a representation-technique or algebraic attack becomes
      competitive, and it must not be cited as though it bounded them.
    - >-
      The RSD endpoint's status as "known false" rests on a
      RECALLED-UNVERIFIED memory. Its status as a POSITIVE CONTROL does not, and
      the two must be kept apart in any downstream citation.
    - >-
      FORWARD GUIDANCE, MANDATORY. What remains open regardless of outcome:
      (a) the d at which a block-wise algebraic model becomes cheaper than
      charged ISD -- well posed, unanswered here, and the one place a knee can
      live; (b) the same curve for representation-technique ISD, which needs
      cost formulas this record does not have; (c) whether SDitH's chosen d
      carries any deliberate margin to that knee or was chosen for signature
      size alone, which is a design-rationale question a specification may
      answer directly.

  heuristic_assumptions:
    - id: HEUR-SDITH-750-1
      statement: >-
        NOT LOAD-BEARING FOR THE CURVE ITSELF. L and A are exact integer
        computations at every cell; no heuristic enters them. The closed forms
        are used only as cross-checks and their failure mode is characterized
        rather than assumed away.
      rigorous_support: Vandermonde and log-concavity, as in IDEA-20260805-cbd93d.
      validation_plan: The d = 1 and d = w forced-value gates, plus brute force at n <= 24.
    - id: HEUR-SDITH-750-2
      statement: >-
        NO-KNEE. Within the block-factorizing ISD family, A(d)/(d-1) varies by
        less than a factor of two across the whole d-axis at fixed (n, k, w), so
        the split advantage degrades linearly in d with no threshold.
      rigorous_support: >-
        The local-CLT closed form makes A(d) exactly affine in (d-1)/2, and the
        observed 16 per cent drift is the closed form's own known breakdown at
        small w/d. So the heuristic is "the closed form's error stays bounded",
        which is weaker than it sounds and is supported only by the computed
        cells.
      validation_plan: >-
        The per-unit-gain column across the graded sweep IS this heuristic's
        test, at three parameter shapes rather than one, with a pre-registered
        factor-of-two falsifier.
    - id: HEUR-SDITH-750-3
      statement: >-
        RSD IS EASIER. Regular syndrome decoding at matched parameters admits
        attacks strictly better than plain-SD ISD, so d = w is a point where
        the conclusion "the split is free" is false for reasons beyond the ISD
        gain computed here.
      rigorous_support: >-
        NONE IN THIS RECORD. RECALLED-UNVERIFIED, no citation asserted. The
        76-bit ISD gain at that endpoint is derived and is independent of this
        heuristic; only the stronger "and dedicated attacks exist" clause
        depends on it.
      validation_plan: >-
        Stage 0's literature check, whose outcome is reported as confirmed,
        refuted or unobtainable. THIS IS THE WEAKEST LINK IN THE PROPOSAL, and
        the design is arranged so that its failure costs a framing sentence
        rather than the control.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED. The proposal computes how an exponent-level quantity
      -- the ISD iteration exponent -- varies along a scheme-design axis, and
      its substantive claim is a NEGATIVE one about exponent movement: within
      block-factorizing ISD there is no threshold in d, so no exponent
      discontinuity is available there and a search for one should be aimed at
      the algebraic side instead. Stating where an exponent CANNOT move, with an
      argument and a computed curve, is a closure at the inventor-protocol
      section 4 standard rather than a fatigue report, and it comes with the
      forward guidance that standard requires.
    memory_exponent: >-
      n/a. Prange's memory is polynomial and identical along the whole axis; d
      does not touch it. Charging is IDEA-20260805-43d6df's object.
    best_known: >-
      Plain-SD ISD at matched parameters, at Prange level, computed exactly here
      as the d = 1 point of the same curve -- which is a pleasant property of
      the design: the baseline is not an external number to be transcribed but
      an endpoint of the instrument's own output, so it cannot be mis-copied.
    hidden_overhead: >-
      None in the counting. In the algebraic-model column, everything: it
      reports a MODEL SIZE and not a solving cost, and converting one to the
      other requires a solving-degree analysis that is not attempted and not
      estimated.
    tradeoff_note: n/a; no time-memory tradeoff is claimed or affected.

  dominated_by: >-
    n/a (no attack claimed, no Pareto point occupied). Rows checked: TIME -- the
    corpus contains no ISD, RSD or split-family cost record in any area, checked
    by grep across SDITH, HQC and MCE and confirmed independently by the session
    ANGLE-BRIEF's F9 section; MEMORY -- KN-TECH-035 (read this session) is the
    charging vehicle and contains no coding content, and the object here has a
    polynomial and d-independent memory footprint so no memory row can dominate
    it; DATA/QUERIES -- SD is single-instance with no query axis. External
    literature NOT searched this session; a published treatment of the
    interpolating family is plausible and its existence would make this record
    redundant rather than dominated, which is stated rather than assumed away.
  sota_delta: >-
    Quantitative and modest, stated honestly on three axes. ATTACK: zero, none
    proposed. COUNTING: the full L and A curves at exact integer precision
    across a ten-point d-axis, where the program previously had no value at any
    d -- and the specific number that matters is that L overstates the
    Prange-level loss by a factor of 11 at d = 2 (3.284 against 0.291 bits), an
    error a reader of the information-theoretic quantity alone would make.
    INSTRUMENT: a positive control worth 76.011 bits and a nearby-object control
    at the same cell, obtained for one extra function call, in a program where
    188 of 229 evidence records have no positive control at all. STRUCTURAL: the
    no-knee statement, which redirects the search for a d-dependent weakness
    away from ISD and toward the block-wise algebraic model, whose size spans
    118.70 bits between d = 2 and d = 80 against ISD's 19.03 over the same
    range.

  estimated_cost:
    implementation: low
    compute: negligible
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.80 that the no-knee prediction survives at Prange level -- it is close to
    forced by the closed form, and the only route to falsification is the
    closed form's breakdown at small w/d being much larger than the 16 per cent
    observed here. It is not higher because only one parameter shape was swept
    in this record and the drift could plausibly be larger at a shape with
    w/n closer to the Gilbert-Varshamov region. It is not lower because two
    independent forced-value gates and a w-scaling cross-check all agree.
    Separately, and lower: 0.45 that this proposal produces anything a reviewer
    would call a finding rather than a control. That number is deliberately
    pessimistic and it is why recommended_priority is medium rather than high:
    the affine-drift objection in the identifiability audit is real, the
    counting half is close to a reparametrization of a single slope, and the
    proposal's defensible value is that it makes the OTHER two proposals'
    negatives interpretable rather than that it discovers anything itself. A
    control that costs one function call and converts an uninterpretable
    neutral verdict into an interpretable one is worth writing even at that
    prior; a control presented as a discovery would not be.
