idea:
  id: IDEA-20260829-b70376
  question_id: RQ-SCURVE-10a83d
  goal_id: GOAL-SCURVE-f7b5a3
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    COUNT THE REJECTIONS - a "verifiable" generation procedure still consumes
    entropy every time its acceptance loop rejects a candidate, and RFC 5639
    publishes the starting seed but never the rejection count. For
    brainpoolP256t1 that count is EXACTLY COMPUTABLE from hashes and Legendre
    symbols alone, with no point counting, because the published A pins the seed
    that produced it. The resulting integer is the design freedom the procedure
    actually exercised, and this program has it for no curve.
  class: measurement

  claim: >-
    Brainpool is the only provenance regime in this six-curve group whose entire
    generation chain is published and re-executable end to end, from a universal
    constant to the published parameters, with ZERO free inputs. That makes it the
    one place where the question "how much entropy did the procedure actually
    consume" has an exact answer rather than a bound. Five separable claims of
    decreasing rigour.

    (C1) THE ZERO-FREE-INPUT CHAIN, EXECUTABLE. RFC 5639 Appendix A.1 states that
    the prime seeds are the first seven 160-bit substrings of Q = Pi * 2^1120 and
    A.2 that the coefficient seeds are the first seven of R = floor(e * 2^1120);
    it publishes Seed_p_256 = 5B54709179216D5D98979FB1BD1310BA698DFB5A and
    Seed_ab_256 = 757F5958490CFD47D7C19BB42158D9554F7B46BC. Both are checkable
    against high-precision Pi and e with Python integers alone. It then gives
    find_integer(s) and the rule "let p be the smallest prime p >= c with
    p = 3 mod 4", and publishes p_256 = 76884956397045344220809746629001649093
    037950200943055203735601445031516197751, which I compared BY EYE against the
    modulus in RQ-SCURVE-10a83d's intake and found to match. EVERY STEP OF THIS IS
    A FEW LINES OF PYTHON AND NONE OF IT NEEDS A POINT COUNT.

    (C2) THE REJECTION COUNT k, WHICH IS THE RECORD'S HEADLINE AND IS NEW HERE.
    RFC 5639 A.2 generates A by k applications of update_seed followed by
    find_integer_2, rejecting at step 3 (if -3 = A*Z^4 mod p is not solvable), at
    step 8 (discriminant) and at step 9 (if E fails the Section 3 requirements).
    THE RFC PUBLISHES THE STARTING SEED AND THE FINAL A, AND NOT k. But k is
    determined: it is the least non-negative integer with
    find_integer_2(update_seed^k(Seed_ab_256)) = A_r1, and finding it costs one
    find_integer_2 evaluation - two SHA-1 calls - per candidate. THE SEARCH IS
    FORWARD, CHEAP, AND HAS A DEFINITE ANSWER.

    (C3) THE CLASSIFICATION OF THE k REJECTIONS, WHICH IS WHAT MAKES k MEAN
    SOMETHING. For each of the k rejected seeds, evaluate step 3 alone: -3 = A*Z^4
    is solvable iff -3/A is a fourth power mod p. Because p = 3 mod 4 (a
    consequence of the prime generation rule, hence guaranteed), the group
    F_p^* has order p - 1 = 2 mod 4, so gcd(4, p-1) = 2 and the fourth-power map is
    2-to-1 onto the SQUARES; hence -3/A is a fourth power iff it is a quadratic
    residue, ONE LEGENDRE SYMBOL. Every rejected seed therefore splits into
    CHEAP-REJECTED (step 3 failed - fully explained, no curve was ever examined)
    and MUST-HAVE-BEEN-POINT-COUNTED (step 3 passed, so the rejection came from
    step 8 or step 9; step 8 is a one-line discriminant check, leaving step 9).
    CALL THE LATTER COUNT k9. THEN log2(max(k9, 1)) IS THE NUMBER OF BITS OF
    DESIGN FREEDOM THE PROCEDURE ACTUALLY EXERCISED FOR THIS CURVE, MEASURED AND
    NOT ESTIMATED. This program has that number for no curve in any family.

    (C4) THE OVERLAP IDENTITY, DERIVED RATHER THAN OBSERVED, AND IT IS A ZERO-HASH
    TEST. For L = 256, find_integer_2 has v = floor(255/160) = 1 and
    w = 256 - 160 - 1 = 95, so A = h0(s) * 2^160 + H(s+1) with h0(s) the 95
    rightmost bits of H(s), and A is a 255-bit integer. B is produced from the seed
    ONE INCREMENT LATER, so B = (H(s+1) mod 2^95) * 2^160 + H(s+2). THEREFORE
      floor(B / 2^160) = (A mod 2^160) mod 2^95 = A mod 2^95,
    an exact integer identity between the two PUBLISHED coefficients requiring NO
    HASHING WHATSOEVER. This is the derivation of the publicly noted repeated
    string 26DC5C6CE94A4B44F330B5D9. THE HEX-ALIGNMENT SUBTLETY IS THE PART WORTH
    STATING: the visible repeat is 24 hex digits = 96 bits, one bit MORE than the
    95 the identity guarantees, so the eyeball version of this observation requires
    the extra coincidence that bit 95 of H(s+1) is zero - which for
    brainpoolP256r1 it is, since B's leading hex digit is 2 = 0b0010. The
    ARITHMETIC identity is exact and unconditional; the VISUAL one is exact plus a
    one-bit accident. Conflating them is the specific error available here.

    (C5) THE Z-UNIQUENESS LEMMA, WHICH REMOVES AN APPARENT NON-DETERMINISM. RFC
    5639 A.2 step 4 says "Compute ONE solution Z of -3 = A*Z^4 mod p", which reads
    as underdetermined, and the twisted curve's coefficient is B_t1 = Z^6 * B_r1.
    But since p = 3 mod 4, gcd(4, p-1) = 2, so Z^4 = -3/A has exactly TWO solutions
    +Z0 and -Z0 when it has any, and (+Z0)^6 = (-Z0)^6. HENCE B_t1 IS UNIQUELY
    DETERMINED AND THE PROCEDURE IS DETERMINISTIC AFTER ALL - not by the RFC's
    wording but by the prime's residue class, which the prime generation rule
    forces. This is a small theorem, it costs nothing, and it is exactly the kind of
    "is the claimed procedure deterministic given its inputs" question the goal's
    diagnostic list asks for. IT WOULD FAIL FOR p = 1 mod 4, where four solutions
    exist and B_t1 would be determined only up to sign, giving a curve and a
    non-isomorphic quadratic twist - so the determinism is a CONSEQUENCE of an
    apparently unrelated design choice and that dependency is the finding.

  mechanism: >-
    THE TRACKED OBJECT is the REJECTION LEDGER of the generation loop: the finite
    sequence R(s0) = ((j, cheap_j) : j = 0, 1, ..., k-1) recording, for each seed
    increment j before acceptance, a single bit cheap_j saying whether the step-3
    quartic-residuosity test rejected it. The curve, the coefficient and the seed
    are all discarded; what is retained is a bit string of length k plus the
    integer k.

    LOSSY-PROJECTION TEST, applied BEFORE any experiment.
    WHAT IS DISCARDED. k intermediate 255-bit candidate coefficients, k 160-bit
    seeds, and every curve those candidates would have defined - on the order of
    400k bits - collapse to k + log2(k) bits. Nothing about any candidate survives
    except one bit of why it died.
    IS IT A CHANGE OF COORDINATES? No. From the ledger one cannot recover a single
    candidate coefficient: the fibre over a given bit string contains, for every
    starting seed with that rejection pattern, an entire trajectory. The map is
    many-to-one by an enormous factor and is not invertible even in principle
    without recomputing the hashes.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? The operation is UPDATE_SEED,
    the increment z -> z + 1 mod 2^160, and the projection is exactly equivariant
    under it: the ledger of s0 extended by one step is the ledger of s0 with one
    more entry, computable from s0 + k alone. The retained part propagates
    deterministically, one entry per step, at a cost of two SHA-1 calls and one
    Legendre symbol. It is ALSO compatible with the second operation that matters
    here, RESTART - the RFC's loop returns to step 1 rather than step 6 on a step-8
    or step-9 failure, so the ledger is a linear sequence and not a tree, which is
    what makes it a string rather than a search transcript. PASSES.
    WHERE IT DISSOLVES. At step 9. The ledger records that a step-9 rejection
    happened but cannot say WHICH Section 3 requirement failed without a point
    count, and the point count at 256 bits is unavailable in this environment. THE
    OBJECT THEREFORE MEASURES k9 EXACTLY AND EXPLAINS IT NOT AT ALL, and that
    boundary is the measured limit rather than a guess.

    WHY THIS IS THE RIGHT OBJECT AND NOT THE OBVIOUS ONE. The obvious object is the
    curve itself, and tracking it requires reproducing step 9, hence point counting,
    hence infeasibility - which is presumably why nobody in this program has the
    number. The rejection ledger is a strictly lossier projection that is
    nevertheless SUFFICIENT for the quantity of interest, because the question "how
    many candidates did the procedure look at" does not require knowing what they
    were. That substitution is the entire idea.

    WHY THIS IS NOT IDEA-20260829-0656b1. That record SAMPLES an acceptance rate at
    reduced field size and extrapolates to full size under a named heuristic. This
    record COUNTS the actual rejections of the actual procedure at the actual size,
    with no sampling, no extrapolation and no heuristic in the count itself. Where
    both apply, this one is strictly better evidence, and 0656b1's own transfer note
    says so. The two are complementary because 0656b1's method works where no
    rejection ledger is recoverable (the NIST curves, where the seed is published but
    the rejection count is not recoverable, because the NIST procedure's step 1 draws
    an ARBITRARY new seed rather than incrementing - see the interpretation limits,
    this asymmetry is the single sharpest structural difference between the two
    regimes and it is the reason the NIST count is not computable while the Brainpool
    one is).

    WHY THIS IS NOT IDEA-20260829-494a63. That record generalises the OVERLAP
    IDENTITY across all seven Brainpool sizes as a zero-hash family lattice and uses
    the exceptions to localise deviations. This record measures the REJECTION COUNT
    at one size and proves the Z-uniqueness lemma. C4 appears in both because it is
    the cheapest cross-check either has, and the two records must agree on it; a
    disagreement between them is itself a finding about the implementation.

    EXECUTION. Step 1, compute Pi and e to at least 1200 bits with Python integers
    (Chudnovsky or Machin for Pi; the exponential series for e), extract the seven
    160-bit substrings each, and compare against the RFC's published seeds. Step 2,
    run find_integer and the smallest-prime rule; compare against p_256 and against
    the RQ intake modulus. Step 3, confirm p = 3 mod 4 and prove the Z-uniqueness
    lemma computationally by exhibiting both roots. Step 4, run the forward search
    for k. Step 5, classify the k rejections by the step-3 Legendre test. Step 6,
    verify C4 on the published A and B with no hashing. Step 7, reconstruct
    B_t1 = Z^6 * B_r1 and compare against the published t1 coefficient and against
    the RQ intake. Step 8, the base-point check: G_t1 = k_G * P with P the
    minimal-x point and k_G = find_integer_2 at the next increment.

  novelty_status: unverified
  novelty_rationale: >-
    The generation procedure is published and the overlap identity C4 is publicly
    documented (Bernstein and Lange 2013, per the SafeCurves-hosted page read this
    session), so those parts are `known`. The Z-uniqueness lemma C5 is elementary
    and is probably known to the RFC's authors. WHAT I COULD NOT CHECK is whether
    the rejection count k and its cheap/expensive classification k9 have been
    published; the BADA55 mirror page states that BADA55 Section 5 analyses "a
    rather complicated mechanism by which Brainpool decided which SHA-1 inputs to
    use", which is exactly where such a count would live, AND I DID NOT OPEN THAT
    PAPER. The label is `unverified` because no web search was performed this
    session and the nearest prior work was read only as a 39-line corpus record and
    one HTML mirror page. A reviewer with retrieval must check BADA55 Section 5
    before crediting C2 or C3 with novelty.
