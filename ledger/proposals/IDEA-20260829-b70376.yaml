  assumptions:
    - >-
      Executor has a shell and Python 3 with hashlib and arbitrary-precision
      integers. THIS IS THE ASSUMPTION THE ARCHIVED BATCH COULD NOT MAKE. Every step
      of C1 through C5 is integer arithmetic and hashing; the whole record runs in
      minutes on one core, except the k search whose cost is 2k SHA-1 calls and is
      unbounded a priori.
    - >-
      NO POINT-COUNTING BACKEND IS ASSUMED AND NONE IS USED. This is the design
      constraint that forced the rejection-ledger object and it is what makes the
      record executable here at all.
    - >-
      A SEARCH BOUND K_max MUST BE DECLARED BEFORE THE k SEARCH RUNS, and the record
      recommends K_max = 2^24, that is about 3.4 * 10^7 find_integer_2 evaluations or
      roughly 6.7 * 10^7 SHA-1 calls - about an hour on 14 cores. Declaring it in
      advance is what converts "we did not find k" from an anecdote into the bounded
      statement "k > 2^24 or the procedure does not generate this curve".
    - >-
      Pi and e are computed to at least 1200 bits IN-SESSION by a series with a
      stated error bound, not read from a table and not taken from a library
      constant. A hard-coded constant would silently make the seed check circular.
      The two computations must be cross-checked against each other's known leading
      hex digits only as a sanity check, never as the source.
    - >-
      Parameters enter only from the frozen package and from the RQ intake, with
      paths recorded per field. No live keys; all objects are public parameters.
    - >-
      The record concerns brainpoolP256r1 and brainpoolP256t1 jointly, because t1 is
      DEFINED from r1 by the Z isomorphism. An audit of t1 that does not go through
      r1 is auditing an output whose input it never checked, and this is stated
      because the RQ names only t1.

  proof_search_map:
    bottleneck: >-
      That "how much entropy did a verifiable generation procedure actually consume"
      has never been answered for any curve in this program, and appears
      unanswerable because the acceptance test requires point counting at
      cryptographic size, which this environment cannot do. Removing that bottleneck
      is the whole idea: the count of rejections is recoverable WITHOUT reproducing
      the acceptance test, because the published output pins the seed offset and the
      cheap sub-tests can be replayed. This changes no cost and no theorem; it turns
      an unmeasured quantity into a measured one.
    baseline_embedding:
      parameter_slice: >-
        At k = 0 the procedure consumed no entropy beyond its published seed and the
        whole apparatus degenerates to the C1 chain check, which is the archived
        audit plan's L8-RIGID lane in its "re-execute the published rule and check
        the output matches" form. THAT DEGENERATE CASE IS THE BASELINE and this record
        must reproduce it exactly when k = 0: same chain, same comparison, same
        verdict. The record is a strict extension of the baseline lane, not a
        different lane wearing new notation.
      reproduction_check: >-
        A frozen fixture asserting that (i) the Pi-derived Seed_p_256 equals the RFC's
        published Seed_p_256 as a 160-bit integer, (ii) find_integer plus the
        smallest-prime rule applied to it yields exactly the RFC's p_256, and (iii)
        p_256 equals the RQ intake modulus. All three run before the k search starts.
        If (i) or (ii) fails, the k search is meaningless because the implementation
        of find_integer is wrong, and no amount of searching would reveal that.
    observation_collision:
      observable: >-
        The pair (k, k9) plus the rejection bit string. The conclusion about
        exercised design freedom rests entirely on it.
      distinct_preimage_search: >-
        REQUIRED, AND COLLISIONS EXIST IN A WAY THAT BOUNDS THE CLAIM SHARPLY. (i) k
        IS THE SMALLEST OFFSET REPRODUCING A, and there may be larger ones; the
        procedure could in principle have started at a different seed and arrived at
        the same A. So k is an UPPER BOUND ON NOTHING AND A LOWER BOUND ON NOTHING -
        it is the offset from the PUBLISHED starting seed, which is the only thing
        the RFC lets anyone check, and the deliverable must say exactly that.
        (ii) k9 COLLIDES ACROSS EXPLANATIONS: a step-3-passing rejected seed could
        have failed step 8 (discriminant, a one-line check that the executor CAN
        replay and must, reducing k9 accordingly) or step 9. THE SEPARATING CONDITION
        IS THEREFORE MANDATORY - replay step 8 as well as step 3, so that k9 is the
        residue after both cheap tests and not a mixture. Failing to replay step 8
        would inflate k9 and overstate the exercised freedom, which is the direction
        that flatters the record, so it is named here.
        (iii) THE DEEPEST COLLISION: a k9 of zero and a k9 of ten are both consistent
        with a designer who examined no curves and simply followed the rule. k9
        measures what the PROCEDURE did, not what a person did, and the two are
        different objects.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the question "how many curves did the Brainpool procedure examine",
          which as posed requires reproducing a point-counting acceptance test at 256
          bits, by the question "what is the smallest seed offset reproducing the
          published A, and how many of the intervening offsets are explained by the
          cheap rejection tests" - which is hashing plus Legendre symbols.
        predicted_gain: >-
          An exact integer at 256 bits in about 2k SHA-1 calls, versus an SEA campaign
          that is infeasible in this environment. Encoding, completeness and soundness
          obligations are listed separately; soundness is carried by the
          reproduce-the-published-A check, which is a hard equality and not a
          statistic.
      - transform: boundary_lift
        proposed_object: >-
          The Z-uniqueness lemma C5, which turns an apparently non-deterministic step
          ("compute one solution") into a determined one by reading the prime's
          residue class - a constraint that requires no computation at all.
        predicted_gain: >-
          Removes a documented ambiguity in the twisted-curve definition and makes
          brainpoolP256t1 a deterministic function of brainpoolP256r1, which is a
          prerequisite for any transcript audit of t1 and which the RFC's own wording
          leaves open.
    quantifier_order: >-
      C1, C4 AND C5 ARE CLAIMED UNIFORMLY. C4: FOR ALL seeds s and FOR ALL hash
      functions, if A and B are produced by find_integer_2 at consecutive seed
      offsets with L = 256, then floor(B/2^160) = A mod 2^95. C5: FOR ALL primes
      p = 3 mod 4 and FOR ALL A with -3/A a quadratic residue, the equation
      Z^4 = -3/A has exactly two solutions and Z^6 is uniquely determined. No witness
      depends on the instance.
      C2 AND C3 ARE CLAIMED EXISTENTIALLY AND WITH A DECLARED BOUND. FOR the published
      Seed_ab_256 and the published A_r1, THERE EXISTS k < K_max with
      find_integer_2(Seed_ab + k) = A_r1, and k9 of the k intervening offsets survive
      both cheap rejection tests. NOT CLAIMED - that k is the number of curves anyone
      examined, that no smaller starting seed exists, or that the procedure was
      followed in the order written. THE WITNESS k DEPENDS ON THE PUBLISHED STARTING
      SEED and that dependence is the claim's boundary, not a gap in it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Starting from RFC 5639's published Seed_ab_256, the RFC's own procedure
        reaches the published brainpoolP256r1 A after exactly k seed increments, of
        which k3 are explained by the step-3 quartic test and k8 by the step-8
        discriminant test, leaving k9 = k - k3 - k8 increments that can only have been
        rejected by the Section 3 requirements; hence the procedure examined at least
        k9 candidate curves, that is log2(k9) bits of exercised design freedom." IT
        CERTIFIES NOTHING about whether a human examined anything, nothing about
        whether the published seed was itself chosen after the fact - the seed is
        derived from Pi, which is the strongest available rebuttal to that and is
        exactly what C1 checks - and nothing about brainpoolP256t1's security.
      nearby_object_control: >-
        THE NEAREST OBJECT ON WHICH THE CONCLUSION FAILS IS A CURVE WITH THE SAME
        PROCEDURE AND A DIFFERENT STARTING SEED. Run the identical k search from a
        seed 2^80 away from Seed_ab_256, targeting the SAME published A. PREDICTED: no
        k found below K_max, since the chance of hitting a specific 255-bit A is
        2^{-255} per offset. If a k IS found, the search is not doing what it claims
        and every count is void. SECOND NEARBY OBJECT, AND IT ISOLATES THE
        LOAD-BEARING STRUCTURE: brainpoolP224r1 and brainpoolP320r1, sizes with
        DIFFERENT (v, w) - the same code must find their k too, and if it finds k for
        256 only, the implementation is size-specific and the 256 result is suspect.
        THIRD - the NIST procedure, whose step 1 draws an ARBITRARY new seed rather
        than incrementing; the k search must be INAPPLICABLE there and the instrument
        must refuse, which is the structural asymmetry between the regimes.
    proof_obligations:
      - claim: >-
          The Pi- and e-derived 160-bit substrings equal RFC 5639's published seeds
          for all seven sizes, with the substring convention stated explicitly.
        responsibility: baseline
      - claim: >-
          find_integer plus "smallest prime >= c with p = 3 mod 4" yields the RFC's
          p_256, which equals the RQ intake modulus.
        responsibility: correctness
      - claim: >-
          p = 3 mod 4 implies gcd(4, p-1) = 2, hence Z^4 = -3/A has exactly two
          solutions when solvable and Z^6 is unique.
        responsibility: correctness
      - claim: >-
          -3/A is a fourth power mod p iff it is a quadratic residue, when p = 3 mod 4;
          hence step 3 costs one Legendre symbol.
        responsibility: correctness
      - claim: >-
          floor(B/2^160) = A mod 2^95 for L = 256, with no hashing required.
        responsibility: correctness
      - claim: >-
          k is found below the declared K_max, or the bound is reported as the result.
        responsibility: feasibility
      - claim: >-
          k9 is computed AFTER replaying both step 3 and step 8, not step 3 alone.
        responsibility: strictness
      - claim: >-
          B_t1 = Z^6 * B_r1 mod p equals the published brainpoolP256t1 B and the RQ
          intake b.
        responsibility: correctness
      - claim: >-
          G_t1 equals k_G * P with P the minimal-x point and k_G the next
          find_integer_2 output.
        responsibility: correctness
      - claim: >-
          The instrument REFUSES on the NIST procedure rather than returning a count.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: >-
        equality between the Pi-derived 160-bit substrings and RFC 5639's seven
        published Seed_p values
      direction: different
      minimum_effect: >-
        PREDICTED EXACT EQUALITY FOR ALL SEVEN. The first is already visually
        confirmed - Seed_p_160 = 3243F6A8885A308D313198A2E03707344A409382 is the
        familiar leading hex expansion of Pi - so a failure would mean my SUBSTRING
        CONVENTION is wrong rather than that the RFC is. Note the convention question
        is real: floor(Pi * 2^1120) has 281 hex digits, and 7 * 40 = 280, leaving one
        digit of "Remainder"; the executor must resolve the alignment and REPORT WHICH
        CONVENTION WORKED, because that choice is itself an unexplained decision of
        exactly the kind SafeCurves lists.
    - metric: 'equality between the reconstructed p_256 and the RQ intake modulus'
      direction: different
      minimum_effect: >-
        PREDICTED EXACT EQUALITY. A mismatch is a material discrepancy: halt,
        re-read both sources, and separate an implementation error, a transcription
        error and a genuine divergence before anything is reported. An implementation
        error is overwhelmingly likelier.
    - metric: 'p_256 mod 4'
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY 3, since the generation rule requires it. A value of 1 would
        falsify my reading of A.1 step 2 AND would void the Z-uniqueness lemma C5,
        making B_t1 determined only up to sign - which would be a far more interesting
        outcome than the predicted one and would mean the RFC's "compute one solution"
        is genuinely ambiguous.
    - metric: >-
        the rejection count k, the smallest offset with find_integer_2(Seed_ab + k)
        = A_r1
      direction: different
      minimum_effect: >-
        NO POINT PREDICTION IS OFFERED AND THAT IS DELIBERATE - I have no basis for
        one and inventing a number here would be exactly the fabrication AGENTS.md
        rule 5 forbids. THE PRE-REGISTERED READING OF EACH OUTCOME IS GIVEN INSTEAD.
        k = 0: the procedure accepted its first candidate; zero exercised freedom;
        the strongest possible rigidity result available for this curve. k between 1
        and about 10^3: the procedure did ordinary rejection sampling at a rate
        consistent with IDEA-20260829-0656b1's rho of about 1/ln p times a few, and
        the exercised freedom is under 10 bits. k above 10^5: the procedure examined
        many candidates and log2(k9) bits of freedom were exercised inside a
        "verifiable" procedure, which is the quantitative content of SafeCurves'
        "somewhat rigid" and is a genuinely new number. NO k BELOW K_max = 2^24: THE
        RFC PROCEDURE AS I HAVE IMPLEMENTED IT DOES NOT GENERATE brainpoolP256r1 -
        report with extreme care, since an implementation error is far likelier, and
        note that the BADA55 mirror makes exactly this claim about the 2005 STANDARD
        procedure and explicitly says the RFC procedure DOES generate the curves, so
        this outcome would contradict a third-party claim and must be escalated
        rather than published.
    - metric: >-
        the fraction of the k rejected offsets explained by step 3 alone, that is
        k3/k
      direction: different
      minimum_effect: >-
        PREDICTED approximately 1/2, because -3/A is a quadratic residue for about half
        of all A by Weil-bounded equidistribution, and step 3 rejects exactly the
        non-residues. A value far from 1/2 means either the Legendre implementation is
        wrong or my identification of step 3's condition with quadratic residuosity is
        wrong. THIS IS THE CHEAPEST INTERNAL CONSISTENCY CHECK IN THE RECORD and it
        needs no knowledge of the curve at all.
    - metric: >-
        the exact integer identity floor(B_r1 / 2^160) = A_r1 mod 2^95, evaluated on
        the RFC's published coefficients with no hashing
      direction: different
      minimum_effect: >-
        PREDICTED TRUE EXACTLY. This is derived from the assembly rule and verified on
        published data in three big-integer operations, and it is the single cheapest
        confirmation in this entire six-record batch that the RFC procedure really is
        the one that produced these numbers. A FAILURE would mean the published A and
        B were NOT produced at consecutive seed offsets by find_integer_2, which
        directly contradicts A.2 and would be the strongest possible evidence for the
        no-k-found branch above. The two predictions are therefore coupled and must be
        read together.
    - metric: >-
        equality between Z^6 * B_r1 mod p and the published brainpoolP256t1 B and the
        RQ intake b
      direction: different
      minimum_effect: >-
        PREDICTED EXACT EQUALITY, using the RFC's published Z. Additionally, the
        recomputed Z from Z^4 = -3/A_r1 must equal plus or minus the published Z; both
        signs are acceptable per C5 and both must give the same B_t1, which is the
        computational demonstration of the uniqueness lemma.
    - metric: >-
        whether G_t1 equals k_G * P with P the smallest-x point of the t1 curve and
        k_G the find_integer_2 output at the next seed increment
      direction: different
      minimum_effect: >-
        PREDICTED TRUE. THIS IS THE RECORD'S SHARPEST SINGLE TEST BECAUSE IT IS THE
        ONE MOST LIKELY TO FAIL FOR AN INTERESTING REASON: A.2 step 12 says "determine
        the points Q and -Q having the smallest x-coordinate in E(GF(p)). RANDOMLY
        select one of them as point P", which is an EXPLICIT non-determinism the RFC
        does not resolve, unlike the Z case which C5 resolves. So the base point is
        determined only up to the sign of P, hence G up to sign, hence up to the sign
        of its y-coordinate. If the published G matches k_G * P for exactly one of the
        two choices, that choice is an unrecorded free bit in a procedure advertised
        as verifiable - one bit, measured, and worth stating precisely because it is
        small. A failure for BOTH signs means the base-point derivation is not what
        A.2 says.
    - metric: >-
        instrument verdict when pointed at the NIST P-256 procedure
      direction: different
      minimum_effect: >-
        PREDICTED EXPLICIT REFUSAL. SP 800-186 C.3.1 step 1 says "Choose an arbitrary
        hdigest-bit string s", and every rejection returns to step 1 rather than
        incrementing, so there is NO SEED CHAIN and no rejection ledger to recover.
        THAT ASYMMETRY IS THE SHARPEST STRUCTURAL DIFFERENCE BETWEEN THE TWO
        PROVENANCE REGIMES IN THIS SIX-CURVE GROUP and it is the reason the Brainpool
        number is computable and the NIST one is not. A Boolean or a count here is an
        instrument failure.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, MINUTES. Derive C4 and C5 symbolically from the RFC text
      and write them down with their proofs. Predict k3/k = 1/2 and p = 3 mod 4.
      Declare K_max. A failure at this stage costs no machine time.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR, SECONDS, AND IT SETTLES MORE THAN
      ANYTHING ELSE IN THE RECORD. Evaluate C4 on the RFC's PUBLISHED A and B for
      brainpoolP256r1: three big-integer operations, no hashing, no seeds, no curve.
      IF THE IDENTITY HOLDS, the published coefficients were produced at consecutive
      seed offsets by find_integer_2 and the whole k search is worth running. IF IT
      FAILS, they were not, and the record's central premise is refuted for the cost
      of three multiplications. There is no cheaper valid test of this claim anywhere
      in this batch.
      STAGE 2, MINUTES. The C1 chain - Pi and e to 1200 bits, the seven substrings
      each, comparison against all fourteen published seeds, find_integer, the
      smallest-prime rule, comparison against p_256 and the RQ modulus, and
      p_256 mod 4.
      STAGE 3, SECONDS. C5 - recompute Z from Z^4 = -3/A_r1, exhibit both roots,
      confirm Z^6 is the same for both, reconstruct B_t1 and compare against the
      published t1 B and the RQ intake b.
      STAGE 4, UP TO AN HOUR ON 14 CORES. The k search to K_max = 2^24, parallelised
      by offset block, with k3 and k8 accumulated as it goes.
      STAGE 5, MINUTES. The base-point check for both signs of P.
      STAGE 6, SECONDS. The controls - the displaced-seed negative, the other-size
      positives, and the NIST refusal.
    controls:
      - >-
        BLOCKING POSITIVE, MULTI-SIZE - the identical code must find k for at least
        two OTHER Brainpool sizes with different (v, w), for instance 224 (v = 1,
        w = 63) and 320 (v = 1, w = 159). A k-search that succeeds only at 256 is
        size-specific and its 256 answer cannot be trusted. This also directly
        exercises the v/w formula at three points.
      - >-
        BLOCKING NEGATIVE, DISPLACED SEED - the same search for the same A_r1 starting
        from Seed_ab_256 + 2^80. Predicted no hit below K_max, null probability about
        2^{-255} per offset. A hit voids everything.
      - >-
        REFUSAL CONTROL - the NIST P-256 procedure, which has no seed chain. The
        instrument must refuse, not count.
      - >-
        NULL, SAME SHAPE - run the C4 identity check on 10^4 pairs of independently
        drawn 255-bit integers. PREDICTED ZERO passes, null probability 2^{-95} each.
        A single pass means the identity is being evaluated with truncation or with
        the wrong shift and every C4 result is void.
      - >-
        CONSISTENCY CONTROL, CROSS-RECORD - IDEA-20260829-494a63 evaluates the same
        identity at all seven sizes from a general formula. The two records must agree
        on the 256 row exactly; a disagreement is an implementation finding and both
        halt.
      - >-
        DEGENERATE-INPUT CONTROL - seeds near the 2^160 wraparound of update_seed. The
        find_integer_2 output must respect the modulus, and an implementation ignoring
        it fails here and nowhere else.
      - >-
        SELF-CONSISTENCY CONTROL - the recomputed Z compared against the RFC's
        published Z for brainpoolP256t1, which the RFC gives explicitly. This is a
        published fixture for an intermediate value and it is rare and valuable; use
        it.
    required_metrics:
      - 'the C4 identity result on published A and B, as an exact integer comparison'
      - 'per size, the Pi/e substring versus the published seed, all fourteen'
      - 'the substring convention that worked, stated explicitly'
      - 'the reconstructed p_256, its comparison to the RFC and to the RQ, and p mod 4'
      - 'k, k3, k8 and k9 = k - k3 - k8, with K_max stated'
      - 'the ratio k3/k against the predicted 1/2'
      - 'both roots Z, their sixth powers, and the reconstructed B_t1 against three sources'
      - 'the base-point check outcome for each sign of P'
      - 'per control, the outcome and the failure mode'
      - 'wall clock, core-hours, and the SHA-1 library version'

  falsification_conditions:
    - >-
      The C4 identity fails on the published A and B. The coefficients were not
      produced at consecutive offsets by find_integer_2; the record's premise is
      refuted at Stage 1 for the cost of three multiplications, and that is a
      first-class result which should be reported as such rather than debugged away.
    - >-
      The Pi- or e-derived substrings do not match the published seeds under any
      reasonable alignment convention. Either my convention reading is wrong or the
      seeds are not what the RFC says they are; separate those two before reporting,
      and note that the first is far likelier.
    - >-
      The reconstructed p_256 differs from the RFC's or the RQ's. Halt; re-read both
      sources; an implementation error in find_integer or in the smallest-prime search
      is overwhelmingly the likeliest cause.
    - >-
      p_256 is not 3 mod 4. My reading of A.1 step 2 is wrong and C5 is void; B_t1
      becomes ambiguous up to sign and the twisted-curve definition needs restating.
    - >-
      No k is found below the declared K_max. Report as the bounded statement
      "k > 2^24 under this implementation", ESCALATE rather than publish, and note
      that it contradicts the BADA55 mirror's claim that the RFC procedure does
      generate these curves - which makes an implementation error the leading
      hypothesis by a wide margin.
    - >-
      k3/k is far from 1/2. The Legendre implementation or the identification of step
      3 with quadratic residuosity is wrong; k9 is then meaningless.
    - >-
      The recomputed Z does not equal plus or minus the RFC's published Z. Either the
      fourth-root computation is wrong or A_r1 was mis-transcribed; both must be
      excluded before any t1 statement.
    - >-
      Z^6 differs between the two roots. C5's proof is wrong, which given
      (-Z)^6 = Z^6 would mean an arithmetic error, and everything downstream of it is
      void.
    - >-
      The multi-size positive control fails at 224 or 320. The implementation is
      size-specific and the 256 result is withdrawn.

  confounders:
    - >-
      k IS AN OFFSET FROM THE PUBLISHED SEED, NOT A COUNT OF ANYONE'S WORK. It
      measures how far the RFC's own procedure has to walk from the RFC's own starting
      point. It is not a count of curves a person examined, it does not bound how many
      starting seeds were tried, and a write-up that says "the designers examined k9
      curves" has overclaimed. The correct phrasing is "the published procedure, from
      its published starting seed, rejects k9 candidates that only a point count could
      have rejected."
    - >-
      k9 IS INFLATED IF STEP 8 IS NOT REPLAYED. The discriminant test 4A^3 + 27B^2 = 0
      mod p is cheap and rejects a vanishing fraction, so the inflation is expected to
      be negligible - but "expected to be negligible" is not "measured", and the
      executor must replay it and report k8 even if it is zero. Reporting k9 without
      k8 biases the number upward, which is the direction that flatters the record.
    - >-
      THE SUBSTRING ALIGNMENT CONVENTION IS ITSELF AN UNEXPLAINED DECISION. floor(Pi *
      2^1120) does not divide evenly into seven 160-bit pieces with nothing left over,
      and how the "Remainder" is handled is a choice the RFC does not fully pin down.
      If more than one convention reproduces all seven seeds, the check is weaker than
      it looks and the deliverable must say how many conventions were tried and how
      many worked.
    - >-
      THE 2005 STANDARD IS NOT THE RFC. Everything here audits RFC 5639. Per the
      BADA55 mirror, the 2005 Brainpool standard contains a DIFFERENT procedure that
      reportedly does not generate these curves. A record that concludes "Brainpool's
      procedure reproduces its curves" without naming which document has conflated two
      objects, and the deliverable must name RFC 5639 in every such sentence.
    - >-
      t1 IS DEFINED FROM r1. Auditing brainpoolP256t1 without going through
      brainpoolP256r1 audits an output whose input was never checked. The RQ names t1;
      the audit must name both.
    - >-
      SEVEN UNEXPLAINED DECISIONS REMAIN UNEXPLAINED. SafeCurves lists them - the hash
      choice, the fixed 160-bit input width, Pi and e rather than other constants, the
      per-size digit scheme, counter mode, the overlapping counters, and the shared
      seed for A and B. NOTHING IN THIS RECORD EXPLAINS ANY OF THEM. C4 explains the
      MECHANISM of the sixth (overlapping counters produce the repeat) and not the
      DECISION. That distinction must survive into the write-up.

  interpretation_limits:
    - >-
      RIGIDITY'S COUNTERFACTUAL IS NOT A COMPUTABLE OBJECT AND THIS RECORD DOES NOT
      TOUCH IT. Reproducing a generation transcript shows the published parameters are
      CONSISTENT with the published rule; it cannot show the rule was not chosen after
      seeing its output, and no computation can. The archived audit plan's closure
      stands verbatim. Deriving the seeds from Pi and e is the strongest available
      partial rebuttal - a designer who wants to choose the seed freely cannot also
      make it a prefix of Pi - and it is a partial one, because the CHOICE of Pi, of
      the width, of the substring index and of the hash all remain free. Measuring k9
      quantifies the freedom INSIDE the procedure and says nothing about the freedom
      in choosing the procedure.
    - >-
      NO NUMBER HERE IS A SECURITY STATEMENT ABOUT brainpoolP256t1. k, k9, Z and the
      overlap identity say nothing about the ECDLP, the group order, or the twist. The
      goal's own claim boundary already says a failure of rigidity is not by itself an
      ECDLP break; the converse holds equally and is said here.
    - >-
      C1, C4 AND C5 ARE PROVED OR DIRECTLY VERIFIED; C2 AND C3 ARE BOUNDED SEARCHES
      WITH A DECLARED K_max. A no-hit result is a bounded statement about K_max
      offsets and nothing more.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER, same
      procedure, different (L, v, w) - brainpoolP384t1 is the sibling row in this
      program and IDEA-20260829-494a63 carries it, generalising C4 to a seven-size
      lattice; the k search transfers verbatim and the two sizes' k values together
      give a two-point check on whether k scales like the acceptance rate predicts.
      The other five Brainpool sizes are not in the twenty-row manifest but ARE in RFC
      5639 and serve as free controls, which is an unusual and valuable position.
      (b) NO TRANSFER OF THE COUNT, STRUCTURAL REASON GIVEN - the three NIST rows have
      a published seed but their procedure RESTARTS with an arbitrary new seed on
      rejection rather than incrementing, so no rejection ledger exists to recover and
      the instrument must refuse. That is why IDEA-20260829-0656b1 must sample where
      this record can count, and it is the cleanest structural contrast between the
      two regimes.
      (c) NO TRANSFER AT ALL - ANSSI FRP256v1 publishes no procedure; see
      IDEA-20260829-85768f. (d) NO TRANSFER - the thirteen fully rigid rows have
      minimality rules rather than rejection loops; their analogue of k is the count of
      smaller candidates checked, which is the archived plan's deferred A-minimality
      component and needs point counting.
      (e) PARTIAL TRANSFER OF C5 - the Z-uniqueness lemma applies to every Brainpool
      twisted curve, since all seven primes are 3 mod 4 by construction, and to no
      other curve in the manifest.
    - >-
      A REFUSAL IS A LEGITIMATE AND INFORMATIVE OUTPUT. The NIST refusal is the
      record's most informative negative and must be recorded as a structural finding,
      not as a gap.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The step-3 acceptance condition behaves as an unbiased coin along the seed
        chain; formally, for A_j = find_integer_2(Seed_ab + j) with j ranging over the
        rejected offsets, the events "-3/A_j is a quadratic residue mod p" are
        Bernoulli(1/2) with error o(1), so the expected value of k3/k is 1/2 and the
        step-3 filter accounts for exactly one bit of the procedure's selectivity.
      rigorous_support: >-
        TWO RIGOROUS INGREDIENTS AND ONE HEURISTIC BRIDGE, kept separate. RIGOROUS
        (i): for p = 3 mod 4 the fourth-power map on F_p^* is 2-to-1 onto the squares
        because gcd(4, p-1) = 2, so "fourth power" and "quadratic residue" coincide
        EXACTLY - this is a proof, not an assumption, and it is what reduces step 3 to
        one Legendre symbol. RIGOROUS (ii): the quadratic residues have density exactly
        (p-1)/2 in F_p^*, so a UNIFORM A gives probability exactly 1/2 minus O(1/p).
        HEURISTIC BRIDGE: that the SHA-1-derived A_j are equidistributed with respect
        to the Legendre symbol. No character-sum bound applies to a hash-defined
        sequence - Weil's bound needs an algebraic sequence - so this is genuinely a
        random-oracle idealisation and cannot be upgraded. It is stated as such rather
        than dressed in Weil's name.
      validation_plan: >-
        SAMPLING - the k rejected offsets themselves, which is a complete population
        rather than a sample of the object of interest, plus an independent 10^6
        uniformly drawn seeds fed through find_integer_2 at the same L and p. Both
        recorded with their sources. COMPARISON DISTRIBUTION - the observed k3/k and
        the independent-seed rate against exactly 1/2, by an exact binomial test with
        the expected count stated in advance; at k of order 10^3 the interval half-
        width is about 0.03 and at 10^6 independent seeds it is about 0.001.
        CROSS-SIZE - the same rate at Brainpool 224 and 320, where it must also be
        1/2; a rate that depends on L would indicate the find_integer_2 implementation
        varies with (v, w), which is the defect the multi-size control exists to
        catch. TAIL CHECK - the longest observed run of consecutive step-3 rejections
        against the geometric prediction 2^{-r}; a run far longer than log2(k) would
        indicate dependence along the chain, which is exactly the phenomenon
        IDEA-20260829-ff7823 tests at the NIST curves and which would transfer here.
        TRANSFER - none; everything runs at the real 256-bit prime with full SHA-1 and
        nothing is extrapolated.
    - id: H2
      statement: >-
        The frozen package at inputs/SAFECURVES-20260825/ faithfully reproduces RFC
        5639 and the SafeCurves rigid page; that is, the seeds, primes, coefficients
        and Z values read from specs/rfc5639.txt are the values the IETF published.
      rigorous_support: >-
        NONE for the general statement, but MUCH STRONGER HERE THAN ELSEWHERE IN THIS
        BATCH, and the reason is worth stating: rfc5639.txt is a plain-text RFC, not a
        PDF extraction, so it does not suffer the symbol mangling that afflicts
        specs/sp800-186.txt. Its line numbering, page breaks and author block are
        intact, which is weak structural evidence of fidelity. That is an argument
        about the file format, not a proof about the content.
      validation_plan: >-
        FOUR CHECKS, THREE OF THEM ARITHMETIC AND THEREFORE STRONG. (i) The Pi and e
        derivations are an EXTERNAL check on the seeds: a corrupted seed will not be a
        substring of Pi, and Pi is computed in-session. (ii) The prime derivation is an
        external check on p: a corrupted p will not be the output of find_integer plus
        the smallest-prime rule. (iii) The Z^4 = -3/A relation is an external check
        binding A, Z and p together; a corruption in any one breaks it. (iv) The
        cross-layer check against the RQ intake tuple, which came from a different
        supply chain. FOUR INDEPENDENT ARITHMETIC BINDINGS ON THE SAME NUMBERS IS AN
        UNUSUALLY STRONG POSITION and it is why this record's H2 exposure is materially
        smaller than IDEA-20260829-bba3a8's. H2 nonetheless remains open, since all
        four checks pass simultaneously if the whole file is a faithful copy of a
        corrupted original.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND THIS RECORD MOVES NO EXPONENT. Under
      docs/target-result-profile.md it ranks low as research direction and is
      dispatched measurement work under a declared goal; it is labelled that way
      rather than dressed up. AUDIT COST, ITEMISED: C4 is three big-integer operations,
      microseconds, and needs no hashing at all. C1 is a 1200-bit Pi and e computation
      (O(1) with any standard series) plus, per size, two SHA-1 calls and a
      smallest-prime search whose cost is O(ln p) primality tests, that is about 177
      Miller-Rabin runs at 256 bits - milliseconds. C5 is one modular exponentiation
      for the fourth root plus two multiplications. C2 IS THE ONLY UNBOUNDED TERM: 2k
      SHA-1 calls plus k Legendre symbols, that is O(k * log^3 p) bit operations, and
      k is exactly what is being measured, so the cost is not knowable in advance -
      which is precisely why K_max must be declared. At K_max = 2^24 the cost is about
      3.4 * 10^7 find_integer_2 evaluations, roughly an hour on 14 cores.
    memory_exponent: >-
      O(log p) per candidate, that is bytes; O(k) for the rejection ledger if it is
      retained in full, which at k = 2^24 is 2 MB as a bit string - trivial. The 48 GB
      envelope is never a constraint. The certificate is (Seed_ab, k, k3, k8, A_r1)
      plus the chain, and verification by a second implementation costs 2k SHA-1 calls,
      which is NOT succinct: verifying a large k costs as much as finding it. THAT
      ASYMMETRY IS WORTH STATING - unlike IDEA-20260829-bba3a8's two-hash certificate,
      this one's verification cost grows with the answer.
    best_known: >-
      No incumbent exists inside this program: the corpus holds no generation
      transcript, no rejection count and no Z value for any curve. Outside it, RFC 5639
      itself is the specification being executed and this record claims no
      algorithmic improvement over it; the k search is a brute-force forward scan and
      any smarter method would require inverting SHA-1, which is not available. KN-LIT-
      4290's Section 5 is the most likely place an incumbent count exists and I did not
      open it. Against the ECDLP attack frontier (KN-TECH-001, KN-TECH-006,
      KN-TECH-018, KN-TECH-031, KN-TECH-032, KN-TECH-035) this record is dominated by
      every row because it is not an attack.
    hidden_overhead: >-
      No o(1) and nothing superpolynomial. FOUR honest hidden costs. (i) The k search
      is unbounded a priori and its cost is the answer, so a declared K_max is
      mandatory and a no-hit result is a bounded statement rather than a measurement.
      (ii) Certificate verification is O(k), not O(1). (iii) k9's meaning depends on
      step 8 being replayed, and omitting it biases the headline number upward.
      (iv) The substring alignment convention may not be unique, weakening C1 by an
      amount that must be measured (how many conventions work) rather than assumed to
      be one.
    tradeoff_note: >-
      The governing tradeoff is K_max VERSUS THE STRENGTH OF A NULL RESULT, and it is
      linear and honest: doubling K_max doubles the compute and adds exactly one bit to
      the statement "k exceeds K_max". There is no smarter point on the curve because
      there is no meet-in-the-middle available - the target A is a specific 255-bit
      value and the chain is a sequential hash walk, so neither a birthday nor a
      time-memory tradeoff applies, and stating that explicitly forecloses the obvious
      wrong idea. Parallelisation across offset blocks is perfect and the 14 cores buy
      a clean factor of 14; this and IDEA-20260829-0656b1 are the only records in this
      batch where the cores matter.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` IS NOT
    ASSERTED. AS AN ATTACK it is dominated by every row simultaneously on time, memory
    and data - rho (KN-TECH-001, KN-TECH-006), automorphism-discounted rho
    (KN-TECH-018), BSGS (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck (KN-TECH-032) -
    because it is not an attack and produces no discrete logarithm.
    AS A REPRODUCTION OF THE GENERATION CHAIN (C1) it is EXACTLY TIED with RFC 5639,
    which is the algorithm being executed; no improvement is claimed.
    AS THE OVERLAP IDENTITY (C4) it is DOMINATED BY Bernstein and Lange 2013, who per
    the SafeCurves mirror observed the repeated digit string in 2013; this record adds
    the derivation and the exact 95-versus-96-bit distinction and claims nothing more.
    AS THE REJECTION COUNT (C2, C3) I could not identify a dominating incumbent inside
    this repository, and BADA55 Section 5 is the most likely place one exists outside
    it. I DID NOT OPEN IT, and it is not in this repository - only two HTML mirror
    pages of the BADA55 web site are, and they do not carry Section 5. The honest
    reading is "possibly dominated, extent unmeasured, and obtaining the paper settles
    it - do that first."
    AS THE Z-UNIQUENESS LEMMA (C5) it is probably known to the RFC's authors and is in
    any case one line of elementary number theory; no priority is claimed.
    IT IS NOT DOMINATED, within the checked scope of this repository, on the one axis
    that motivates it: no incumbent here produces an integer measuring the design
    freedom a published generation procedure actually exercised. That is narrow and is
    stated narrowly.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis, and zero algorithmic
    improvement over RFC 5639. THE NONZERO DELTAS ARE FOUR.
    AS DATA - the corpus screen of 2026-08-29 finds no Brainpool generation transcript,
    no seed derivation, no Z value, no rejection count and no overlap check anywhere in
    knowledge/ or ledger/. This would produce fourteen seed derivations from Pi and e,
    seven reconstructed primes, one exact overlap identity verified on published data,
    one uniqueness lemma with its computational demonstration, one reconstructed t1
    coefficient checked against three independent sources, one base-point derivation,
    and the integers k, k3, k8, k9 - where there are currently zero of each.
    AS A NEW QUANTITY - log2(k9) is a MEASURED number of bits of exercised design
    freedom inside a procedure advertised as verifiable. This program has that number
    for no curve in any family and, so far as my repository-scoped check goes, neither
    does the corpus. It is the one thing in this six-record batch that is a genuinely
    new integer rather than a reproduction.
    AS PRECISION - SafeCurves' verdict "somewhat rigid" is a level on a four-point
    ordinal with a seven-item list of unexplained decisions. This record replaces, for
    the one decision it can decide, an adjective with an integer, and leaves the other
    six explicitly unexplained rather than quietly folded in.
    AS METHOD - the rejection-ledger object shows that the entropy consumed by an
    acceptance loop is recoverable WITHOUT reproducing the acceptance test, which is
    the specific move that makes a 256-bit question executable in an environment with
    no point counting. That move transfers to every increment-chained generation
    procedure and does not transfer to restart-chained ones, and knowing which is
    which is itself the result.
  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation is find_integer, find_integer_2, update_seed, a Pi/e series with
      an error bound, a smallest-prime search, a fourth-root routine and a parallel
      offset scanner - a few hundred lines, all elementary, none needing a library
      beyond hashlib. Compute is minutes for everything except the k search, which is
      2k SHA-1 calls and is bounded only by the declared K_max; at 2^24 it is about an
      hour on 14 cores and it is embarrassingly parallel. The binding risk is not
      compute but the possibility that no k exists below K_max, which converts the
      headline into a bounded null.
  recommended_priority: high

