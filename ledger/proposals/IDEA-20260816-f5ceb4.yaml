idea:
  id: IDEA-20260816-f5ceb4
  question_id: RQ-NTRU-9015ee
  added: '2026-08-16'
  title: 'Factor the ring modulo q and ask whether its CRT idempotents produce short lifts: measure
    the coefficient norm of the shortest lift of each submodule the splitting provides, testing whether
    a split ring hands an attacker genuine low-rank dense sublattices or only long ones'
  class: mechanism
  claim: '(A) When the defining polynomial factors modulo q into r factors, the ring R_q splits as
    a product and the NTRU module acquires r proper submodules, one per factor, of Z-ranks proportional
    to the factor degrees. This is often stated as a structural difference between ring shapes, with
    the fully split cyclotomic case at one extreme and the inert prime-degree shape used by NTRU Prime
    at the other. The step usually left implicit is whether those submodules contain short vectors.
    A submodule is generated by e_i times the secret, where e_i is a CRT idempotent, and idempotents
    lifted to integer coefficients are generically large.

    (B) The claim under test is a measurable dichotomy. For each factor, compute the shortest lift
    of the corresponding submodule that is available cheaply, namely the reduced representative of
    e_i (f,g) modulo q, and measure its coefficient norm relative to the secret''s. If those norms
    are of order q times a constant, the split rings hand out submodules of no density advantage and
    the CRT structure is inert for this purpose. If some factor gives a lift of norm comparable to
    the secret''s, then splitting yields a genuinely dense low-rank sublattice and the rank envelope
    of an instance depends on the factorisation pattern of q in the ring, which would be a computable,
    ring-shape-dependent quantity available with no lattice reduction at all.

    (C) The deliverable either way is a table: for each (ring, q) pair, the factorisation degree profile,
    and for each factor the measured shortest-available-lift norm ratio, with its distribution over
    sampled secrets. Both outcomes are usable. A uniformly negative table is a measured obstruction
    with a number: it says how far above the secret''s norm the CRT route sits, which tells any later
    idea using CRT submodules exactly how much it must gain elsewhere.

    (D) What is NOT claimed: no attack, no security consequence, no assertion about what any published
    analysis says about split versus inert rings, and no claim that the reduced representative is
    the actual shortest vector in the submodule, which it is not; it is an upper bound obtained without
    reduction, and the gap between that upper bound and the truth is itself flagged as the main limitation
    and is measured at toy scale where enumeration is possible.'
  mechanism: 'Stage 1, zero compute beyond polynomial arithmetic: factor the defining polynomial modulo
    q by a standard distinct-degree and equal-degree method implemented in pure Python over the integers
    mod q, giving the degree profile. Cyclotomic-like and inert-like shapes are then compared not
    by name but by their measured profiles, which for a chosen q may differ from the nominal expectation
    and must be measured rather than assumed.

    Stage 2: compute the CRT idempotents e_i explicitly in R_q, lift them to integer coefficients
    with a balanced representative, and record their coefficient norms. This alone answers most of
    the question: if every idempotent has norm of order q times sqrt(n), the products e_i (f,g) reduced
    modulo q have norms in the same range and no density advantage exists.

    Stage 3: compute the balanced representative of e_i (f,g) modulo q for each i and each sampled
    secret, measure its coefficient norm, and form the ratio to the secret''s norm. Report the distribution
    per factor and per ring.

    Stage 4, the honesty step: at n small enough for certified enumeration, compare the reduced-representative
    norm to the actual shortest vector in the submodule, obtained exhaustively. This measures how
    loose the cheap upper bound is, which is the difference between a real measurement and a convenient
    proxy. Without Stage 4 the entry would be measuring its own approximation.

    Stage 5: run the identical pipeline on a matched unstructured control, where the module has no
    proper submodules of this kind, so the pipeline must report the absence rather than produce numbers,
    which is a structural forced null.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-NTRU-9015ee in full, including its targets naming the deployed inert-prime-degree
      ring shape. Read all nine RQ-NTRU-9015ee proposals by title and class, with IDEA-20260809-263751
      read closely since it is the ring-shape proposal. grep -ril 'CRT', 'idempotent', 'splitting',
      'inert', 'factorisation', 'submodule' over ledger/proposals/ and ledger/hypotheses/. Read KN-OPEN-026
      including its reference to KN-TECH-046 and the class-group line.
    results: IDEA-20260809-263751 asks whether the fatigue exponent transfers across ring shapes,
      framed as a measurement of the transition location on a different ring; it does not compute
      a factorisation profile or an idempotent norm. IDEA-20260809-2866e0 covers module and matrix
      NTRU. KN-OPEN-026 records that the class-group and unit-lattice line, KN-TECH-046 and KN-LIT-116,
      remains at approximation factor exp(Otilde(sqrt(n))) and explicitly warns against conflating
      that line with the concrete 2026 mechanisms; the CRT idempotent question is neither of those
      and appears nowhere in the screened records. No hit for 'idempotent' in ledger/proposals/ on
      this screen.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; that CRT lifts are large
      is the kind of fact that is either folklore or wrong, and this program cannot tell which. What
      is claimed new relative to this repository is the reduction of the split-versus-inert ring question
      to a measurable norm ratio computable without any lattice reduction, together with the toy-scale
      check of how loose that cheap upper bound is against certified enumeration. Assembled from known
      parts: polynomial factorisation mod q, CRT idempotents, balanced representatives, and the enumeration
      machinery of the minima-ladder entry in this same batch.'
  object_first_candidate:
    tracked_object: The vector of norm ratios rho_i = ||balanced rep of e_i (f,g) mod q|| / ||(f,g)||,
      one per irreducible factor of the defining polynomial modulo q, attached to a sampled secret
      and a chosen (ring, q).
    lossiness: 'Lossy: rho discards the submodule''s full geometry, every vector in it except one
      chosen representative, the idempotent''s structure beyond its effect on that representative,
      and the secret itself. Two secrets with very different structure can give the same rho. The
      retained part propagates compatibly with the operation of changing q because the factorisation
      profile and the idempotents are functions of q, and rho is exactly the quantity that changes
      when the splitting changes; nothing discarded is needed to recompute rho at a new q. The honest
      limitation is the reverse direction: rho is an upper bound on the submodule''s density, so a
      large rho does not prove the submodule is sparse, and Stage 4 exists precisely to measure that
      gap rather than to assume it away.'
    propagation: 'One step of the target operation is q -> q'', which re-factors the polynomial and
      produces a possibly different degree profile and different idempotents. Under it rho changes
      discontinuously, since the factorisation pattern is arithmetic in q rather than continuous.
      That discontinuity is the propagation statement and is also the measurement''s discriminating
      feature: if any structural quantity of the NTRU lattice tracked the CRT splitting, it would
      have to jump at exactly the moduli where the pattern changes, and those moduli are computable
      in advance for free.'
    survival_score: 'Survives exactly as far as polynomial factorisation modulo q is affordable, which
      is all n and q of interest, so the cheap arm has no practical dissolution point. The expensive
      arm, the enumeration check on how loose rho is, survives only to lattice dimension about 20,
      which is the entry''s real limit. Concretely: rho computable at n = 761 in seconds; rho validated
      as an upper bound only at n around 10.'
  null_object_control: 'Two nulls, both run in the same invocation. The structural forced null: a
    matched unstructured q-ary lattice built from a uniform random matrix H mod q, which has no CRT
    submodule structure at all; the pipeline must report the absence and must not produce rho values,
    which gates the code against inventing structure. The quantitative null: for each ring and q,
    compute rho for a random ring element of the same norm as the secret in place of the secret. If
    a random element gives the same rho distribution as the secret, then rho measures the idempotent''s
    size and nothing about the secret, which is the likely outcome and must be stated as a controlled
    null rather than dressed up. For any claim that CRT structure interacts with the secret specifically,
    the secret arm must separate from the random-element arm.'
  discriminated_from:
  - IDEA-20260809-263751 measures whether a fitted transition exponent moves between ring shapes,
    which requires reduction runs on each ring; this entry computes a factorisation-derived quantity
    with no reduction and predicts where a ring-shape difference could come from, so it is a cheap
    precursor and names that proposal as its downstream consumer.
  - KN-TECH-046's class-group and unit-lattice line, as recorded in KN-OPEN-026, operates at approximation
    factor exp(Otilde(sqrt(n))) and concerns a different structure entirely; conflating it with CRT
    splitting would misstate both, as KN-OPEN-026 explicitly warns.
  - IDEA-20260809-2866e0 studies module and matrix NTRU, where the rank structure is imposed by construction;
    here the submodule structure is imposed by the arithmetic of q in a fixed ring, and can change
    without changing the scheme at all.
  - The covolume-envelope entry in this batch takes sublattices generated by rotations; the sublattices
    here are generated by idempotent multiples and are generically long, so the two probe disjoint
    families of sublattices of the same lattice.
  - A plain statement that split rings are riskier is a regime name; the content here is a measured
    norm ratio per factor with a distribution, which is what turns the name into a quantity.
  assumptions:
  - Balanced representatives modulo q are the right cheap upper bound on submodule shortness; an alternative
    would be a size-reduced representative, and the choice is declared in advance rather than selected
    after seeing results.
  - Polynomial factorisation modulo q is correct and verifiable by re-multiplication, which is checked
    on every factorisation.
  - The idempotents exist, which requires the factors to be pairwise coprime modulo q; repeated factors
    are detected and those q values are recorded and handled by a pre-registered rule rather than
    skipped silently.
  - The toy-scale enumeration check at n around 10 is informative about the looseness of rho at larger
    n, which is an extrapolation and is flagged as such rather than assumed.
  predictions:
  - metric: median rho over factors and secrets, for a fully split ring at moderate q
    direction: higher
    minimum_effect: 10
  - metric: difference between the secret arm's rho distribution and the random-element arm's rho
      distribution
    direction: different
    minimum_effect: 'no pre-commitment: the expected outcome is no difference, and the prediction
      registered is that the CI for the difference will contain zero, which is a controlled null'
  - metric: ratio of the certified shortest submodule vector to the balanced representative at n =
      10
    direction: lower
    minimum_effect: no numeric pre-commitment; this measures how loose the cheap bound is and inventing
      a number would defeat the purpose
  - metric: number of distinct factorisation degree profiles encountered across the swept q grid for
      a fixed ring
    direction: higher
    minimum_effect: 2
  minimal_test:
    design: 'Pure arithmetic, no reduction, in one invocation. Take two rings of the same degree class:
      x^n - 1 with n = 12, which splits richly, and an irreducible prime-degree polynomial with n
      = 13, standing in for the inert-like shape. Sweep q over 40 primes and prime powers spanning
      2^7 to 2^17. For each (ring, q), factor the polynomial, verify by re-multiplication, record
      the degree profile, compute the idempotents and their norms, and for 100 sampled ternary secrets
      compute rho per factor. In the same invocation run the random-element arm and the unstructured
      forced null. Report rho distributions by ring and degree profile, and the separation between
      secret and random-element arms. Then, at n = 10 only, enumerate the actual shortest vector in
      one submodule for 20 instances and report the looseness ratio. The discriminating comparison
      is whether any rho comes near 1; if none does across 40 moduli and two ring shapes, that is
      a clean measured obstruction with an explicit floor.'
    controls:
    - 'Unstructured matched q-ary lattice, structural forced null: the pipeline must report no CRT
      submodules and emit no rho.'
    - Random ring element of matched norm in place of the secret, quantitative null isolating whether
      rho sees the secret at all.
    - Factorisation verification by re-multiplication modulo q on every factorisation.
    - Repeated-factor detection with a pre-registered handling rule and published counts.
    - Certified-enumeration looseness check at n = 10, measuring the gap between the cheap bound and
      the truth rather than assuming it.
    required_metrics:
    - factorisation degree profile per (ring, q)
    - idempotent coefficient norms
    - rho per factor per secret
    - median and IQR of rho by ring and profile
    - secret-arm versus random-element-arm difference with CI
    - looseness ratio at n = 10 with certificate status
  falsification_conditions:
  - Some rho distribution has median below 2, falsifying the claim that CRT lifts are generically
    long and opening a genuinely dense low-rank sublattice route that would need immediate follow-up.
  - The secret arm separates from the random-element arm with a CI excluding zero, falsifying the
    expectation that rho is secret-independent.
  - The looseness check at n = 10 shows the certified shortest submodule vector is orders of magnitude
    below the balanced representative, which would mean rho is a useless proxy and the cheap arm measures
    nothing.
  - Factorisation verification fails on any (ring, q), invalidating those cells.
  - The unstructured forced null emits rho values, meaning the pipeline invents structure and the
    whole run is an invalid measurement.
  confounders:
  - Choice of representative, balanced versus size-reduced, can change rho by a constant factor and
    would be an easy source of a spurious ring-shape difference if the two rings were handled differently;
    the contract fixes one choice for both.
  - The two rings differ in degree, 12 versus 13, since a prime degree is needed for the inert-like
    shape, so degree and shape are partially confounded; a third ring at degree 12 with a different
    splitting behaviour is included to break this.
  - q values where the polynomial has repeated factors behave differently and would distort pooled
    statistics.
  - The all-ones factor x - 1 in x^n - 1 always splits off and always gives a degree-1 factor with
    a distinctive idempotent, which must be reported separately rather than pooled with the others.
  interpretation_limits:
  - rho is an upper bound on submodule shortness, so a large rho does not establish that a submodule
    contains no short vector; only the toy-scale enumeration speaks to that, and only at dimension
    20.
  - The result is scoped to the tested rings, moduli and secret distributions; a different ring family
    could behave differently and nothing here bounds that.
  - No statement about deployed parameters or about any published treatment of split versus inert
    rings is made or implied.
  target_complexity:
    time_exponent: No attack exponent claimed. Factorisation modulo q is polynomial in n and log q;
      the enumeration check is exponential in dimension and is confined to dimension 20.
    memory_exponent: No attack memory exponent claimed; memory is polynomial and small throughout
      the cheap arm.
    best_known: There is no in-repository quantity for the split-versus-inert question; IDEA-20260809-263751
      proposes to measure a transition location on two rings, which is a downstream and far more expensive
      route to a related question.
    hidden_overhead: The looseness of the balanced representative as a proxy is the entire hidden
      cost, and it is the reason Stage 4 exists; without it the cheap arm is an unvalidated convenience.
      A second hidden cost is that the two ring shapes cannot be matched on degree, so a third ring
      is needed to break the confound, which the naive design would miss.
  dominated_by: 'n/a (no attack result claimed). Frontier check across time, memory and data: this
    produces no attack quantity and therefore sits on no frontier. Within this repository, the only
    comparable route to the same question is IDEA-20260809-263751''s reduction-based measurement,
    which this dominates on compute by a very large factor while answering a strictly narrower question,
    so it does not dominate it in the Pareto sense.'
  sota_delta: 'No attack; measurement contribution only. Quantitatively the delta offered is a norm
    floor: a number saying how far above the secret''s norm the CRT submodule route sits, where currently
    this repository has no number at all.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'That idempotent lifts and hence rho are generically large, median above
    10: 0.8, because balanced representatives of idempotents are essentially random modulo q and their
    norms should scale with q. That rho is secret-independent, matching the random-element arm: 0.75,
    which is the predicted controlled null. That the toy-scale looseness check shows the balanced
    representative within a small factor of the certified shortest submodule vector: 0.35, and this
    is the weakest link, because a submodule of rank several can easily contain something much shorter
    than one convenient representative. That at least two distinct degree profiles appear across the
    q grid for x^n - 1: 0.95. Joint prior for a fully usable negative table: about 0.3.'
