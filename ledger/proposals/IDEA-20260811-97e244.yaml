idea:
  id: IDEA-20260811-97e244
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE DIRECT ANSWER TO THE LOSSY-PROJECTION FAILURE - stop measuring support
    and measure the NEWTON POLYTOPE. A support drop moves a cost functional if
    and only if it removes a VERTEX of the polytope, because BKK mixed volume
    depends on the polytope and not on the interior lattice points; the
    pre-registered prediction is that all eight known degeneration loci remove
    only INTERIOR monomials and the mixed volume is unchanged at every one, which
    would be a named obstruction - O-INTERIOR - explaining the committed
    j = 0 anomaly (support -30.8%, Groebner time -0.44%, gb_size +3.41%) in one
    line and closing the entire support axis of this lane
  class: measurement

  object: >-
    OBJ-NP, the Newton polytope of the Semaev system, as a function on the
    j-line. Formally: for each m, the convex hull New(S_m) of the exponent
    vectors of the monomials with non-zero coefficient, together with the mixed
    volume MV(New(S_m), New(f_1), ..., ) of the tuple that the BKK bound charges.
    The tracked object is the POLYTOPE, not the support set. These are different
    objects and the difference is exactly the interior lattice points, which is
    the entire content of this proposal.

  resource: >-
    R1 and R2. The functional is a property of the polynomial system in
    x-coordinates as field elements (R1) determined by the curve equation (R2).
    H-ENDO-001 admissibility: no endomorphism is applied to any point of G and no
    non-scalar action on G is needed or claimed.

  claim: >-
    (A) THE PRECISE REASON SUPPORT IS THE WRONG FUNCTIONAL. The campaign's
    standing puzzle is committed: the S_3 monomial support drops 13 -> 9 at j = 0
    (30.8%) and 13 -> 10 at j = 1728 (23.1%), exactly and hand-verified, while
    Groebner time moves -0.44% and -0.67% and gb_size for j = 1728 moves the
    WRONG WAY, +3.41% (red_team_notes.md section 11, committed; restated in
    MATCHED-ORDER-DESIGN.md section 2). The campaign has recorded that pair as a
    lossy projection but has never named the algebraic reason. THIS RECORD
    PROPOSES THE REASON AND MAKES IT FALSIFIABLE: sparse elimination cost is
    governed by the BKK/Bernstein bound, which counts the MIXED VOLUME of the
    Newton polytopes; a monomial that lies in the interior of the polytope
    contributes nothing to the polytope and therefore nothing to any
    polytope-derived cost bound, however many such monomials are deleted.
    Deleting 4 of 13 monomials is a 31% support reduction and a 0% polytope
    reduction if all 4 were interior.
    (B) THE PRE-REGISTERED PREDICTION, STATED AS A NUMBER BEFORE ANY COMPUTE.
    For S_3: New(S_3) is the convex hull of the 13 generic exponent vectors in
    Z^3. PREDICTION P1 - deleting the a-block (4 monomials: x1x3, x2x3, x1x2 and
    the constant) leaves the polytope UNCHANGED, i.e. Vol(New(S_3^{a=0})) =
    Vol(New(S_3)) and the vertex sets are equal. PREDICTION P2 - deleting the
    b-block (3 monomials: x3, x1, x2) likewise leaves it unchanged. If P1 and P2
    both hold, the committed timing anomaly is EXPLAINED, not merely recorded,
    and the explanation is exact rather than statistical. If either fails - if a
    vertex is lost at a = 0 or b = 0 - then the polytope DOES shrink at special j
    and the campaign has been measuring the wrong thing in the other direction:
    a real cost reduction exists that the Groebner timing failed to expose
    because the deployed system is f_V-dominated.
    (C) THE SAME QUESTION ON THE SIX NEW LOCI. Apply the identical computation to
    the six weight-12 degeneration loci of S_4 catalogued in
    IDEA-20260811-a7c1df, whose block sizes are 48, 36, 6, 6, 4, 1 out of 439.
    PREDICTION P3 - the mixed volume is unchanged at all six, because a block of
    6 or 4 or 1 coefficients out of 439 cannot plausibly contain a vertex of a
    polytope in Z^4 with a few dozen vertices. P3 is the boring outcome and it is
    the one this record expects. THE INTERESTING OUTCOME IS THE 48-BLOCK at
    a^3 + 8b^2 = 0 (j = 1728*32/5), the only block large enough that a vertex
    loss is not absurd a priori; it is singled out here so that a positive there
    cannot be dismissed as fishing.
    (D) WHAT A CLEAN P1+P2+P3 BUYS. A NAMED OBSTRUCTION, O-INTERIOR: "every known
    j-line degeneration of the summation polynomials deletes only interior
    lattice points of its Newton polytope, so no polytope-derived cost functional
    - BKK bound, mixed volume, sparse-resultant size, polyhedral homotopy path
    count - can distinguish a special-j curve from a generic one." That closes
    the entire support axis of RQ-JINV-8fc13a with an argument rather than a
    fatigue report, and the forward guidance it carries is precise: what remains
    open is the COEFFICIENT-VALUE axis (reducibility, singular locus,
    factorisation type), which polytopes do not see, and which
    IDEA-20260811-6034d0 and IDEA-20260811-34f29d take up.

  mechanism: >-
    Bernstein's theorem: for a generic system of Laurent polynomials with
    prescribed supports, the number of isolated solutions in the torus equals the
    mixed volume of the Newton polytopes, and standard sparse-elimination and
    polyhedral-homotopy costs are charged against that mixed volume
    (KN-TECH-007 for BKK in this corpus; the program has recorded BKK-based
    speedups, KN-FIND-2a8b7e as cited by IDEA-20260806-e4f96e - BOTH CITATIONS TO
    BE RE-VERIFIED against the corpus before use rather than trusted from this
    record). The mixed volume of a tuple of polytopes is a function of the
    polytopes only. Two supports with the same convex hull have the same mixed
    volume, the same BKK root count, and the same generic sparse-resultant
    structure. So the map support -> polytope is itself a lossy projection, and
    it is the one that matters: everything the cost model can see factors through
    it. A special-j degeneration is cost-visible in the sparse model IF AND ONLY
    IF it changes the hull. That is a biconditional, it is decidable by exact
    integer convex-hull computation in dimension m, and it costs seconds.

  novelty_status: adaptation
  novelty_note: >-
    BKK/Bernstein is classical and is already in this corpus as KN-TECH-007. The
    ADAPTATION is applying the vertex-versus-interior distinction as the
    DIAGNOSTIC for the campaign's own committed support-versus-time anomaly, and
    pre-registering O-INTERIOR as the closure. Corpus grep finds no record
    computing New(S_m) or any mixed volume at a special j;
    IDEA-20260807-8b9486 mentions "the Newton polytope that governs BKK-type
    sparse elimination" as one of several derived quantities but does not compute
    it, does not distinguish vertices from interior points, and draws the
    opposite inference - that support reduction IS a genuine cost. External
    literature NOT checked for a published computation of the Newton polytopes of
    summation polynomials; that check is a deliverable of the minimal test.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-8b9486, which asserts a sparsity GAIN from the same support
    drop and computes a closed-form constant for it; this record predicts that
    gain is ZERO in the only cost model where sparsity is provably charged, and
    is therefore that record's designated falsifier. NOT IDEA-20260807-477e40,
    which measures support and explicitly says the effect is "not a degree
    reduction" but never asks whether it is a POLYTOPE reduction. NOT
    IDEA-20260811-a7c1df, which catalogues the loci and claims no cost effect at
    all; this record is the cost-side test of that catalogue.

  assumptions:
  - >-
    The relevant cost model for a sparse solver is polytope-derived. This is TRUE
    for BKK root counts, polyhedral homotopy and sparse resultants and FALSE for
    a dense Macaulay/F4 implementation charged per matrix entry, where deleted
    interior monomials DO reduce the entry count. The contract must therefore
    report BOTH the polytope metrics and the raw non-zero count, and must not
    conflate them. This assumption is the record's main scope limit and it is
    stated, not hidden.
  - >-
    The committed S_3 support counts (13/9/10) and the S_4 stratification are
    correct as recorded. Both are re-derived as gate 1 of the minimal test.
  - >-
    Exponent vectors are taken from the expanded affine form under a fixed,
    pre-declared convention, the same convention that produced the committed 439.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the vertex test: for each
      deleted monomial, is its exponent vector a vertex of the convex hull of the
      surviving exponent vectors, or is it in the interior/relative interior of a
      face? Everything else is bookkeeping.
    baseline_embedding:
      parameter_slice: >-
        The generic curve (a*b non-zero) is the baseline slice. New(S_m) there
        must reproduce the known bidegree structure of S_m - per-variable degree
        2^{m-1} for the last variable and 2 for S_3 in each variable - as the
        polytope's support function evaluated on the coordinate directions.
      reproduction_check: >-
        Symbolic: the maximum of e_i over the vertex set must equal the recorded
        per-variable degree of S_m for every i. A polytope that disagrees with
        the known degrees is an implementation error and blocks the run.
    observation_collision:
      observable: The Newton polytope New(S_m) and the mixed volume it induces.
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, TWICE. (i) Any two curves with the same j have
        the same polytope, and by the twist collision they can lie in different
        isogeny classes; so the observable cannot separate classes. (ii) MORE
        IMPORTANTLY, the predicted result IS a collision: generic curves and
        special-j curves would share the observable while differing in the
        ground-truth object (the polynomial). That collision is not a defect
        here - it is the finding, because it says the observable is blind to the
        distinction the lane cares about, which is precisely O-INTERIOR.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the polytope FIXED and vary the forgotten structure - the
        coefficient values inside the fixed hull. The fibre of the polytope map
        over New(S_3) contains both the generic S_3 and S_3 with a = 0. An
        intrinsic invariant distinguishing them must therefore be a
        coefficient-value invariant, not a combinatorial one; the record names
        reducibility and singular-locus dimension as the two candidates and
        hands them to IDEA-20260811-6034d0 and IDEA-20260811-34f29d.
      predicted_gain: >-
        Converts a negative into forward guidance that names the exact class of
        surviving functionals, which is the difference between a closure and a
        fatigue report.
    quantifier_order: >-
      FOR ALL m in {3,4} and FOR ALL of the eight known degeneration loci L,
      New(S_m restricted to L) equals New(S_m generic) as a polytope. The witness
      quantifier that could break it: THERE EXISTS a locus and a deleted monomial
      that is a vertex. The claim is uniform in p for p outside the finite
      exceptional set of IDEA-20260811-a7c1df, because the exponent vectors are
      p-independent.
    method_ceiling:
      strongest_certifiable_claim: >-
        That no POLYTOPE-DERIVED cost functional distinguishes special-j from
        generic curves. It CANNOT certify that no cost functional whatsoever
        does; dense linear-algebra costs charged per non-zero entry are outside
        the ceiling by construction, and the record says so.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a system whose
        deleted monomials ARE vertices - e.g. a deliberately constructed sparse
        polynomial with a corner monomial removed. The contract must run the
        method on such a constructed pair and confirm it reports a CHANGED
        polytope, or the method has not been shown able to detect the thing it
        claims to be absent.
    proof_obligations:
    - claim: Vertex set of New(S_3) is unchanged by a = 0 and by b = 0
      responsibility: correctness
    - claim: Mixed volume of the m = 3 decomposition system is unchanged
      responsibility: correctness
    - claim: Same for all six weight-12 loci at m = 4
      responsibility: feasibility
    - claim: The method detects a genuine vertex deletion when one is planted
      responsibility: interface

  predictions:
  - metric: vertex_set_equality_S3_a0_versus_generic
    direction: different
    minimum_effect: >-
      EXACT SET EQUALITY of the vertex sets. Pre-registered as EQUAL. A single
      lost vertex falsifies the prediction and is the interesting outcome.
  - metric: vertex_set_equality_S3_b0_versus_generic
    direction: different
    minimum_effect: EXACT SET EQUALITY, pre-registered as EQUAL.
  - metric: bkk_mixed_volume_ratio_special_over_generic_m3
    direction: different
    minimum_effect: >-
      EXACTLY 1.000 at j = 0 and at j = 1728. Any ratio other than 1 is a
      falsification of O-INTERIOR at m = 3, and is a POSITIVE result for the
      lane.
  - metric: vertex_loss_count_at_the_48_block_locus
    direction: different
    minimum_effect: >-
      ZERO vertices lost at a^3 + 8b^2 = 0 (j = 1728*32/5). This is the block
      most likely a priori to contain a vertex; it is named in advance so that a
      non-zero result there is a pre-registered positive and not a post hoc
      selection.
  - metric: nonzero_coefficient_count_ratio
    direction: lower
    minimum_effect: >-
      Reported ALONGSIDE the polytope metrics and NEVER instead of them: 9/13 =
      0.692 at a = 0, 10/13 = 0.769 at b = 0, 391/439 = 0.891 at the 48-block.
      This is the DENSE cost proxy and it moves while the polytope does not;
      the contrast between the two columns IS the deliverable.

  minimal_test:
    design: >-
      EXACT INTEGER GEOMETRY, NO SAMPLING, NO TIMING. For m = 3 and m = 4, and
      for the generic curve plus each of the eight loci: (1) expand S_m under the
      declared convention and extract the exponent vectors of the non-zero
      monomials; (2) compute the convex hull in Z^m exactly (integer arithmetic,
      no floating point) and record the vertex set, the f-vector and the
      normalised volume; (3) build the m = 3 decomposition system as the tuple
      (S_3, x - v_1 window constraints omitted) in the f_V-FREE formulation and
      compute the BKK mixed volume of the tuple exactly; (4) tabulate, for each
      locus, which deleted monomials were vertices, which were on a face, and
      which were strictly interior. Report the four-column table
      (locus, support drop, vertex loss, mixed-volume ratio). Cross-check the
      hull in two independent implementations.
    controls:
    - >-
      C-PLANT (positive control, BLOCKING). Construct a polynomial from S_3 by
      deleting a monomial that IS a vertex - e.g. x1^2 x3^2 - and confirm the
      pipeline reports a changed vertex set and a changed mixed volume. An
      instrument that cannot see a planted vertex deletion produces void
      negatives (DECOMPOSITION.md L14, both directions).
    - >-
      C-NULL-LOCUS. Ten random weight-12 loci not among the eight; predicted to
      show zero support drop AND zero polytope change. Distinguishes "the
      polytope never changes under any specialisation" (an artifact of the code)
      from "the polytope does not change under THESE specialisations" (the
      finding).
    - >-
      C-GAUGE. Recompute on (u^4 a, u^6 b); polytope must be identical, since
      support is. Implementation check only, per the committed C-GAUGE limit.
    - >-
      C-DENSE. Report the raw non-zero count next to every polytope metric, so
      the record cannot be read as claiming that the support drop is unreal. It
      is real; the claim is that it is invisible to the sparse cost model.
    required_metrics:
    - newton_polytope_vertex_set_per_locus_per_m
    - f_vector_and_normalised_volume_per_locus
    - bkk_mixed_volume_per_locus
    - deleted_monomial_classification_vertex_face_interior
    - nonzero_coefficient_count_per_locus
    - planted_vertex_deletion_detected_boolean

  lossy_projection_answer: >-
    THIS RECORD IS THE LOSSY-PROJECTION TEST, RUN AS AN EXPERIMENT. The chain is
    (a,b) -> coefficients -> support -> polytope -> mixed volume -> cost bound,
    and every arrow loses information. The committed j = 0 pair proves the chain
    breaks somewhere between support and cost; this record localises the break
    exactly, and predicts it is at support -> polytope. If the prediction holds,
    the campaign gains a THEOREM-SHAPED reason for a number it currently records
    as an anomaly. If it fails, the break is further downstream (in the f_V
    domination of the deployed system) and the record says which, because the
    f_V-free mixed volume is computed here and the f_V-bearing solving degree is
    known to be pinned by |V| (EV-ICINV-6b6264 boundary 2). Either way the
    projection is localised rather than lamented.

  t5_reachability_answer: >-
    T5 IS NOT REACHED, AND THIS RECORD IS WHY THAT IS FINE. T5 gates a cost
    MINIMISER. Under the predicted outcome there is no minimiser: the cost
    functional is constant on the j-line in the sparse model, so reachability is
    vacuous. Under the falsifying outcome - a vertex really is lost at a special
    j - T5 becomes live IMMEDIATELY and is answered by IDEA-20260811-3e08e0
    (only <= 6 classes per p contain such a j) and IDEA-20260811-22b6b8 (the walk
    inside such a class). The dependency is stated so the successor is
    pre-selected rather than improvised after data.

  null_object: >-
    Two, of different shapes and both necessary. C-NULL-LOCUS is the null of the
    same shape on the INPUT side (a random weight-12 locus). C-PLANT is the
    positive control on the OUTPUT side (a deliberately vertex-deleting
    perturbation). The lane's committed instrument failure - NULL-C is a
    between-class mean detector with power 1.00 at a 0.9% shift and says nothing
    within a class (red_team_notes.md section 5) - does not bind here, because
    this record runs no permutation test and computes no p-value.

  falsification_conditions:
  - >-
    The vertex set of New(S_3) differs between the generic curve and a = 0 or
    b = 0. O-INTERIOR is false at m = 3, the support axis of this lane is NOT
    closed, and the campaign has a real polytope-level effect to chase.
  - >-
    Any of the six weight-12 loci at m = 4 removes a vertex. Same conclusion at
    m = 4; the 48-block is the pre-named candidate.
  - >-
    C-PLANT is not detected. The instrument is blind and every negative here is
    void; the run is INVALID rather than negative.
  - >-
    A random locus in C-NULL-LOCUS changes the polytope. The specialisation
    procedure is corrupting the exponent extraction and nothing is admissible.
  - >-
    Two independent hull implementations disagree on any vertex set. The
    computation is not established and no conclusion is drawn.

  confounders:
  - >-
    Affine versus homogenised exponents. Homogenising with respect to x0 embeds
    the polytope in a simplex and can turn interior points into face points.
    The contract must fix and declare ONE convention, and should report both if
    cheap; a conclusion that flips under homogenisation is a conclusion about
    the convention.
  - >-
    Laurent versus ordinary polytopes. BKK counts torus solutions; roots with a
    zero coordinate are not counted. For the Semaev system x_i = 0 is a legitimate
    factor-base x-coordinate when it is on the curve, so the torus restriction is
    a genuine scope limit and must be recorded, not glossed.
  - >-
    Which tuple the mixed volume is taken over. The f_V-free single-polynomial
    formulation has no mixed volume in the multi-polytope sense; the contract must
    declare the exact tuple (e.g. S_3 together with its partials, or the m = 3
    system with two window constraints) and report the mixed volume of THAT tuple
    only.

  interpretation_limits:
  - >-
    A confirmed O-INTERIOR closes the SPARSE cost model only. Dense per-entry
    costs still fall with support, by a factor at most 439/391 = 1.12 at the
    largest block, which is a constant and not an exponent.
  - >-
    claim_tier toy. No attack, no exponent, no speedup.
  - >-
    Nothing here bears on isogeny-class invariance in either direction; the
    polytope is a j-line functional and collides on twists.

  heuristic_assumptions:
  - id: H1
    statement: >-
      No distributional heuristic is load-bearing. Convex hulls and mixed volumes
      of fixed integer point sets are exact.
    rigorous_support: >-
      Bernstein's theorem (KN-TECH-007 in this corpus, to be re-verified) gives
      the mixed volume as the generic torus root count exactly; the genericity
      hypothesis is about coefficients, not about the polytope, and the record's
      claim is only about the polytope.
    validation_plan: >-
      Validation is by exact recomputation in two independent implementations
      plus the C-PLANT positive control. No distribution comparison applies. Tail
      check: verify the computed mixed volume for m = 3 against the known
      per-variable degree bound 2 in each variable, i.e. against the dense Bezout
      count, and confirm the mixed volume is at most that count.
  - id: H2
    statement: >-
      Genericity of coefficients. Bernstein's count is attained only for generic
      coefficients; a special-j curve is by definition NOT generic, so the mixed
      volume is an upper bound at exactly the points this record cares about.
    rigorous_support: >-
      Bernstein's second theorem gives a facial criterion for deficiency: the
      count drops below the mixed volume iff a face system has a torus solution.
    validation_plan: >-
      Run the facial criterion explicitly at each of the eight loci: for each
      face of New(S_m), test whether the face subsystem has a common torus root
      over an algebraic closure of F_p at a named p. THIS IS THE ONE PLACE THE
      SPECIAL j COULD BITE WITHOUT MOVING THE POLYTOPE, and testing it is a
      required part of the contract rather than an optional extra. Sampled
      parameters: p = 4001 and one prime above 2^20; transfer to other p is not
      claimed.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations and O(1) memory for parallel rho
      (KN-TECH-001, KN-TECH-006); automorphism-discounted on CM curves
      (KN-TECH-018).
    hidden_overhead: Not applicable; no asymptotic claim.
    tradeoff_note: >-
      Not applicable. If O-INTERIOR is falsified, the resulting effect would
      still have to be charged in a full sparse-elimination cost model with
      memory beside time before any claim; that costing is explicitly NOT part of
      this record.

  dominated_by: >-
    Every row of the attack frontier - parallel rho with distinguished points
    (KN-TECH-001, KN-TECH-006), BSGS, kangaroo, and index calculus - dominates
    this on time, memory and queries, because this record produces no solver.
    Checked against all of them.
  sota_delta: >-
    ZERO on every axis. Measurement and explanation only.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  expected_value: >-
    THE HIGHEST-VALUE NEGATIVE AVAILABLE IN THIS LANE, AND I EXPECT IT TO BE A
    NEGATIVE. The predicted outcome (all interior, mixed volume ratio 1.000) is
    the boring one and is worth having anyway, because it converts the campaign's
    most-cited anomaly from a recorded number into a named obstruction with a
    one-line argument, and because it names precisely what survives. The cost is
    minutes of exact integer geometry with no statistical machinery and no
    resolution backend. I would test this SECOND, immediately after
    IDEA-20260811-a7c1df supplies the locus list - or FIRST at m = 3 alone, since
    the m = 3 half needs no locus list at all and is decisive for the committed
    j = 0 anomaly by itself.
