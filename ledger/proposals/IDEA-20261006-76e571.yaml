idea:
  id: IDEA-20261006-76e571
  title: >-
    Chord-slope fibres under translation by one generator lose at least
    a fifth and split on at least half their values, on one F_53 curve
  class: measurement
  claim: >-
    On the first ordinary short-Weierstrass curve y^2 = x^3 + x + B
    over F_53, B in {1, ..., 26}, nonsingular, with trace not divisible
    by 53, let n be the largest prime factor of the point count and
    require n at least 17. Let G be a generator of that subgroup, and
    let D be the subgroup without the identity and without -G. For P
    in D with P+G still in D, let σ(P) be the chord slope from P to
    P+G, or a sentinel when the two x-coordinates agree. Let L = 1 -
    |image of σ| / |D| and let b be the fraction of slope values whose
    set of σ(P+G) has at least two elements. The claim is L at least
    1/5 and b at least 1/2. A finished L strictly below 1/5, or a
    finished b strictly below 1/2, is the concrete negative.
    Representation class R1. The operation set is translation by G.
    The time exponent stays 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R1: the slope of the chord from P to
    P+G in the least nonnegative residue, plus one sentinel for a
    vertical chord. Operation set Sigma is translation by the fixed
    generator G on D. Sigma is not doubling and is not a y-half bit.
    Trichotomy: branching. σ is a function of the chosen coordinates,
    and translation by G does not induce a well-defined self-map of
    the image unless every point of a given slope translates to the
    same slope. LOSSY-PROJECTION TEST against Sigma. The projection
    discards the point and keeps one slope. It is lossy when the image
    is a proper subset of D. The priced open numbers are L, with
    separator 1/5, and b, with separator 1/2. A projection that kept
    (x, y) would lose nothing and is not the object. No factor base
    is proposed.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: coordinator
  approved_by: null
  question_id: RQ-ECDLP-623a32
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. This idea cites that bound as the unchanged
        baseline, not as a statement about chord slopes.
      verified_by: >-
        coordinator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KR-RHO-fbd582
      provenance: internal
      claim: >-
        With a shared inversion, x(P-Q) costs little extra once x(P+Q)
        is known. This idea does not compute a difference point and
        does not price an inversion.
      verified_by: >-
        coordinator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd582.yaml
        on 2026-10-06
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C says an exactly sum-compatible bucket index on a
        prime-order group is a surjective homomorphism, impossible for
        1 < M < N. The slope is not asserted to be sum-compatible.
      verified_by: >-
        coordinator opened knowledge/findings/KN-FIND-ffe1df.md
        (Theorem C paragraph) on 2026-10-06
  assumptions:
    - >-
      The slope is (y(P+G) - y(P)) times the inverse of
      (x(P+G) - x(P)) when the x-coordinates differ, as a least
      nonnegative residue. The sentinel is a single extra value, not
      an element of F_53.
    - >-
      Points with P+G equal to the identity are excluded from D. They
      are not sentinels.
    - >-
      The first eligible B is selected by nonsingularity, trace not
      divisible by 53, and n at least 17, before L and b are scored.
  predictions:
    - metric: L = 1 - |image of σ| / |D|
      direction: higher
      minimum_effect: >-
        L at least 1/5, decided by the integer test
        5 * (|D| - |image|) >= |D|. A finished failure of that test is
        a negative.
    - metric: >-
        b, the fraction of image values that split under translation
        by G
      direction: higher
      minimum_effect: >-
        b at least 1/2, decided by twice the number of splitting
        values being at least the image size. A finished failure is a
        negative.
  minimal_test:
    design: >-
      For B from 1 through 26, on y^2 = x^3 + x + B over F_53, skip
      singular models and models whose trace is divisible by 53. Skip
      a model whose largest prime factor n is less than 17. On the
      first remaining curve, let G be the first affine point of order
      n in (x, y) lexicographic order. Build D, compute σ on every P
      in D with P+G in D, and evaluate the two integer tests. Stop
      after one curve.
    controls:
      - >-
        Curve check: every P and every P+G used in a slope lies on
        the curve. A failure invalidates σ and the claim is not scored.
      - >-
        Sentinel check: a vertical chord is recorded as the sentinel
        and is not recorded as the residue 0.
      - >-
        A second generator G' = 2G, when 2G is not the identity, is
        scored with the same two tests and recorded beside the primary
        row. The primary row uses G only.
    required_metrics:
      - selected B
      - n and |D|
      - image size
      - L integer test
      - b integer test
      - second-generator pass, fail, or skipped
  falsification_conditions:
    - >-
      The curve is fully scored and 5 * (|D| - |image|) is strictly
      less than |D|.
    - >-
      The curve is fully scored and twice the number of splitting
      values is strictly less than the image size.
    - No B in {1, ..., 26} yields an eligible curve.
    - The image is empty, so b is undefined and the claim is not scored.
  confounders:
    - >-
      |D| is only a few dozen points. A separator of 1/5 can flip when
      one slope collision appears or disappears.
    - >-
      The sentinel is a coordinate convention. Folding a vertical
      chord into the residue 0 would be a different function.
    - >-
      Excluding the identity and -G shrinks D. A large 2-torsion
      intersection is already excluded only through -G and the identity.
  interpretation_limits:
    - >-
      A pair (L, b) on F_53 is claim_tier toy. It does not change time
      exponent 1/2 or memory exponent 0.
    - >-
      Passing both separators does not say the slope is useful in a
      walk. Failing either says this slope missed the stated loss or
      the stated split on this curve.
    - >-
      The slope is not claimed to be sum-compatible. Theorem C of
      KN-FIND-ffe1df is a fence.
    - >-
      KR-RHO-fbd582 prices x(P-Q) after x(P+Q). This idea does not
      use that saving.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A uniformly random function from D to a set of size equal to
        the observed image, conditioned on being surjective onto that
        image, has at least half its fibres splitting under a fixed
        permutation that models translation by G, whenever the image
        is not the whole domain. No transfer to a larger prime is
        assumed.
      rigorous_support: >-
        Finite uniform model on a fixed finite set. The opened row
        KR-RHO-13bf67 is the complexity baseline, not a distributional
        theorem for this slope.
      validation_plan: >-
        Draw 500 surjective random functions from D onto a codomain
        of the observed image size, using SHA-256 of
        IDEA-20261006-76e571|null|{r}|{i} to assign values, rejecting
        a draw that misses the image and redrawing that index at most
        20 times. Let b_null be the fraction of those 500 whose own
        split fraction is at least 1/2. The model is usable when
        b_null is at least 0.8. If b_null is below 0.8, the random
        model does not predict a split and the claim is not scored.
  target_complexity:
    time_exponent: >-
      unchanged p^{1/2} group operations for a prime-order subgroup
    memory_exponent: >-
      unchanged O(1) distinguished-point memory for the rho baseline;
      this measurement stores one curve of size less than 2*53
    best_known: >-
      Pollard rho, Theta(sqrt(N)) group operations, KR-RHO-13bf67
    hidden_overhead: >-
      none claimed; no new algorithm is proposed, so there is no o(1)
      term
    tradeoff_note: >-
      No time-memory tradeoff is proposed. One pass over a subgroup
      of size at most 54 + 2*7 does not use parallelism.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    No opened row dominates this pair (L, b). Rows opened and not
    dominating the slope: KR-RHO-13bf67 (generic Omega(sqrt(p)) bound;
    this idea does not search), KR-RHO-fbd582 (x(P-Q) is nearly free
    once x(P+Q) is known; this idea does not form that pair),
    KR-RHO-fb88e6 (negation-map walk; this idea does not walk),
    KR-IC-5ea2f8 (GHS Weil descent; this idea stays on F_53).
    KR-RHO-13bf67 is the matching exponent baseline, not a stricter
    result about L or b.
  sota_delta: >-
    Zero change to time exponent 1/2 and to memory exponent 0 against
    KR-RHO-13bf67. The new quantities are L and b for the chord slope
    under translation by one generator on one curve over F_53, scored
    against 1/5 and 1/2.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fbd582
      - KR-RHO-fb88e6
      - KR-IC-5ea2f8
      - KR-RHO-53c89f
    nearest:
      - ref: KR-RHO-fbd582
        provenance: internal
        relation: adjacent
        delta: >-
          That row saves an inversion by forming x(P-Q) with x(P+Q).
          This idea does not form P-Q. It measures whether the chord
          slope from P to P+G loses at least a fifth of D and splits
          on at least half its values.
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a walk on plus-or-minus classes and a square-root
          of 2 iteration constant. This idea does not walk and does not
          claim that constant.
      - ref: KN-FIND-ffe1df
        provenance: internal
        relation: orthogonal
        delta: >-
          Theorem C forbids an exactly sum-compatible nontrivial bucket
          index. This slope is not offered as a sum-compatible index.
    searched:
      corpus_grep:
        - >-
          ledger/proposals on origin/main and the idea files of PRs
          1939 and 1937, for chord slope, y-half, and variable-order
          grevlex
      web: []
      blocked:
        - web search not run; novelty_status stays unverified
