# IDEA-20261003-362fe2
# Digit-weight count for the integer 15. Proposal only. Not approved.
idea:
  id: IDEA-20261003-362fe2
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The integer 15 has binary weight 4 and non-adjacent weight 2
  class: measurement
  claim: >-
    The integer 15 has binary weight 4 and non-adjacent weight 2.
    Four exceeds two by 2. The product of the two weights is 8.
    Their sum is 6. The non-adjacent length is 5 and the binary
    length is 4. Five exceeds four by 1. The gap is a digit weight,
    not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the digit string of the integer 15,
    which is coordinate-dependent and is not a group element. The
    operation set is reading one digit. The non-adjacent digits,
    low to high, are -1, 0, 0, 0, and 1. Two readings of the
    non-adjacent weight both give 2, so that gap is 0. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-6654ba
      provenance: internal
      claim: >-
        Point halving on binary curves is a different object from
        these digit weights of the integer 15.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The integer 15 is frozen before the digits are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The weight gap 2.
    baseline_embedding:
      parameter_slice: The weights 4 and 2 and the lengths 5 and 4.
      reproduction_check: >-
        Two readers must agree that the binary weight is 4 and the
        non-adjacent weight is 2.
    observation_collision:
      observable: The weight gap and the product.
      distinct_preimage_search: >-
        Reporting both weights as 2 drops the gap. Two readings of
        the non-adjacent weight make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The integer 15.
        predicted_gain: Integer weights. No curve addition.
    quantifier_order: >-
      The integer is fixed before the weights.
    method_ceiling:
      strongest_certifiable_claim: >-
        The weights 4 and 2. Not a scalar multiplication.
      nearby_object_control: >-
        Two readings of the non-adjacent weight. Both are 2, and the gap is 0.
    proof_obligations:
      - claim: The binary weight of 15 is 4.
        responsibility: size
      - claim: The non-adjacent weight of 15 is 2.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: weight_gap
      direction: different
      minimum_effect: Four exceeds two by 2.
  minimal_test:
    design: >-
      Count the nonzero binary digits and the nonzero non-adjacent
      digits of 15. Do not add a curve point.
    controls:
      - Two readings of the non-adjacent weight, whose gap is 0.
      - An independent count.
    required_metrics:
      - both weights
      - the gap
      - the product
  falsification_conditions:
    - The non-adjacent weight is not 2.
    - The product of the two weights is not 8.
  confounders:
    - The binary weight of 7 is a different integer from the binary weight of 15.
  interpretation_limits:
    - A digit weight is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the weight pair 3 and 2 of the integer 7.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen integer 15 has binary weight 4 and non-adjacent
        weight 2.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of one integer.
      validation_plan: >-
        Two independent readings. A mismatch voids the product.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
