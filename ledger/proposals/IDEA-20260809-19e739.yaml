idea:
  id: IDEA-20260809-19e739
  question_id: RQ-CRYPTO-001
  added: '2026-08-09'
  title: The memory-charge exponent is mandatory, live at two INCOMPATIBLE values in two lanes,
    never measured on any machine -- and the record type the template says must carry a cost figure
    with its disclosures has zero instances, no schema and no validator entry
  class: cost-model
  claim: 'KN-TECH-035 makes the memory charge mandatory ''whenever a proposed mechanism stores
    a factor base, relation set, or matrix'', and its own ''Verified vs reported'' section concedes
    the application ''has not been carried out quantitatively for any specific proposed mechanism''.
    Two live designs then instantiate the SAME scalar at DIFFERENT values: H-RSA-68884a charges
    a shared object of size S as S^theta with theta = 1/3 by inheritance and states ''theta is
    NOT fitted''; H-SDITH-d37289 charges an access into an M-cell store as sqrt(M) and says so
    -- ''THE ACCESS-LATENCY EXPONENT IS 1/2. A three-dimensional layout gives 1/3''. H-ECDSA-a23475
    declares five conventions of its own. GOAL-RSA-001 and GOAL-ECDSA-001 each carry an identical
    non_duplication clause requiring whichever runs second to bind to the other''s convention;
    neither ran, so no convention object exists. SECOND AND JOINED: templates/research-records.md
    defines a concrete_cost record (COST-AREA-NNN) whose optimistic_assumptions field is annotated
    ''a cost table without this list is invalid''. VERIFIED AT HEAD: a repository-wide search
    for COST-* returns zero files, schemas/ holds nine schema files and none is a cost schema,
    and validate_ledger.py''s REQUIRED table has no concrete_cost entry. GOAL-RSA-001''s third
    completion criterion demands exactly such a record and no machinery in the repository can
    satisfy or check it.'
  mechanism: 'MEASURE THE MACHINE, THEN BIND THE FIGURE. Step 1: instrument this harness directly
    for (i) random-access cost into an S-entry table as S crosses L2 / L3 / DRAM and (ii) a block-Wiedemann-shaped
    sparse matrix-vector product at growing dimension at fixed row density, fitting an empirical
    alpha_hat with a confidence interval, a declared machine scope and a declared S range. Step
    2: instantiate the absent record type ADVERSARIALLY on a figure the program already publishes
    -- try to write a complete COST-AREA record for KN-TECH-057''s memory-charged isogeny baseline
    from committed artifacts alone. The falsifiable prediction is that optimistic_assumptions
    and overestimating_factors CANNOT be filled from the record trail, in which case the template''s
    own sentence applies and the published table is invalid by the program''s own definition.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'The 14 memory-exponent-adjacent proposals all treat theta as a DECLARED ROW, never a measured
      quantity: IDEA-20260805-1775f2 as a one-parameter family, IDEA-20260805-88ecef as a row
      in an SLH-DSA register, IDEA-20260805-cdc87d as a fixed charge moving the enum/sieve crossover,
      IDEA-20260807-b63f08 asking for it ''AS A DECLARED ROW rather than an assumption''.'
    - IDEA-20260807-8fbc86 measures sieve gate-count constants c_T/c_M -- a different object.
    - None proposes measuring the exponent, none reconciles 1/2 against 1/3, and no goal owns
      the cross-lane convention both RSA and ECDSA assumed the other would build.
    - Zero proposals mention optimistic_assumptions (verified).
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED and not claimed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: every attack mechanism.
      This record proposes no algorithm. The object is the CHARGE.'
    tracked_object: The empirical access-cost exponent alpha_hat relating store size S to per-access
      cost on a declared machine, plus the disclosure record that carries any figure derived from
      it.
    one_step_propagation_rule: Doubling S multiplies per-access cost by 2^alpha_hat; the exponent
      composes additively in log S. Exact bookkeeping.
    newness_score: Nil as mathematics -- this is a memory-hierarchy measurement. Its content is
      that the scalar every Pareto comparison in the program passes through is inherited from
      a 2004 asymptotic model at two mutually inconsistent values.
  lossy_projection_identifiability_audit:
    projection: the machine -> a single access-cost exponent on a declared range.
    what_is_discarded: Cache structure, prefetching, NUMA, everything below the fit.
    is_it_only_a_change_of_coordinates: 'NO. Honest caveat: this is a WEAK object -- one scalar
      with a confidence interval -- and it is machine-scoped by construction. It can never make
      a mathematical statement. Its value is that 1/2 versus 1/3 changes cross-lane comparisons
      materially and nobody has measured which is right on the hardware in use.'
    mirror_failure_check: 'CHECKED. The failure would be a fit that returns the same exponent
      for every kernel. It cannot: the streaming null must return alpha_hat = 0 and BSGS must
      return 1/3, so two distinct values are forced before any measurement.'
  null_object_control:
    primary_null: A STREAMING O(1)-SHARED-STATE KERNEL, which must return alpha_hat = 0. This
      is H-RSA-68884a's own G5 null and it comes free.
    secondary_nulls:
    - 'POSITIVE CONTROL: BSGS must reproduce n^{2/3} full cost at alpha_hat = 1/3 -- H-RSA-68884a
      G4 and, independently, H-SDITH-d37289''s G4 BSGS anchor gate.'
    - 'DISCLOSURE GATE: if the adversarial COST-* instantiation CAN be completed from committed
      artifacts, that refutes this record''s second half and is the better outcome.'
  assumptions: []
  predictions:
  - metric: fitted access-cost exponent alpha_hat with CI, on a declared machine and S range
    direction: different
    minimum_effect: A CI that excludes at least one of 1/2 and 1/3, which would adjudicate between
      two live and incompatible conventions.
  - metric: number of COST-* record fields fillable from committed artifacts for KN-TECH-057's
      published baseline
    direction: lower
    minimum_effect: Any required field unfillable makes the published table invalid by the template's
      own sentence.
  minimal_test:
    design: Two kernels x seven store sizes spanning L2/L3/DRAM x three repetitions, with the
      streaming null and the BSGS positive control run first; then the adversarial COST-* instantiation
      on one already-published figure.
    controls:
    - streaming O(1) null (alpha_hat = 0)
    - BSGS positive control (alpha_hat = 1/3)
    - adversarial disclosure instantiation
    required_metrics:
    - alpha_hat with CI per kernel
    - declared machine scope and S range
    - per-field fillability of the COST-* record
  falsification_conditions:
  - 'alpha_hat lands at 1/3 with a tight CI: H-RSA-68884a''s inherited value is right, H-SDITH-d37289''s
    1/2 is wrong for this machine class, and the conventions can be unified.'
  - 'alpha_hat is strongly machine-dependent across the tested range: no single convention is
    defensible and the honest output is a REQUIRED sensitivity band on every memory-charged figure,
    which is a different and more useful deliverable.'
  - 'The COST-* record CAN be completed from committed artifacts: the second half of this record
    is wrong and the disclosure gap is bookkeeping only.'
  confounders:
  - Access cost is not a clean power law across cache boundaries; report the fit range and the
    residuals rather than a single exponent.
  - A measurement on one machine is not a convention; the deliverable must carry its machine scope
    or it repeats the error it diagnoses.
  - Sparse matrix-vector cost mixes access and arithmetic; separate them or the fit is confounded.
  interpretation_limits:
  - Machine-scoped measurement. It adjudicates a convention; it proves nothing about any cryptographic
    problem.
  - Adopting a charging convention and adding a schema are Coordinator acts (AGENTS.md rule 1);
    this record supplies the measurement and the instantiation attempt.
  heuristic_assumptions:
  - id: HEUR-CHRG-1
    statement: A single access-cost exponent fitted on one machine is a usable convention for
      cross-lane comparison.
    rigorous_support: None, and it may well be false -- which is why the sensitivity band is a
      named alternative deliverable rather than a fallback.
    validation_plan: Fit on two machine classes if available and report the spread.
  target_complexity:
    time_exponent: n/a -- charges memory, claims no time improvement
    memory_exponent: This record MEASURES the exponent every memory charge in the corpus uses.
    best_known: Inherited asymptotic memory-access models; no measured value exists in-repo.
    hidden_overhead: The machine-dependence of the exponent itself.
    tradeoff_note: A measured alpha_hat can move Pareto comparisons in EITHER direction, including
      against mechanisms this program favours.
  dominated_by: 'n/a (no attack claimed; charging-convention measurement). Rows checked before
    writing: every in-corpus memory-charged figure passes through this exponent, so no attack
    row is added or displaced.'
  sota_delta: ZERO on attack axes. Every Pareto comparison, every dominated_by and sota_delta
    field, and every cross-primitive statement passes through this one exponent, currently inherited
    at two mutually inconsistent values and measurable in an afternoon.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.95 that alpha_hat is measurable with a usable CI. 0.5 that it excludes
    one of 1/2 and 1/3 cleanly -- memory-hierarchy costs are notoriously not clean power laws,
    and the honest modal outcome may be the sensitivity band rather than a single value. 0.8 that
    the adversarial COST-* instantiation fails on optimistic_assumptions, since zero proposals
    mention the field.
