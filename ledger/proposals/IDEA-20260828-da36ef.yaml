idea:
  id: IDEA-20260828-da36ef
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    Structured wrong-key survival test: does the campaign's own attack6n/
    attack7n filter show the "wrong key lives on" bias (eprint 2025/2011),
    or only the generic-uniform noise IDEA-f2fc33 already measured?
  class: control
  claim: >-
    IDEA-20260805-f2fc33 measured that attack6n's AGGREGATE survivor counts
    match a UNIFORM wrong-key model (U1) within 1 standard deviation on
    four committed integers. That test cannot detect a STRUCTURED
    deviation: a bias concentrated on a small subset of wrong-key
    candidates rather than spread uniformly, which is exactly the
    mechanism eprint 2025/2011 (retrieved, not verified by full read this
    session) reports for integral-style attacks -- a wrong key imposes a
    fixed XOR difference on the partial decryption which propagates through
    the differential-linear structure of the round function, so wrong keys
    at particular XOR-distances from the true key survive filters at
    elevated rates relative to uniform, even when the AGGREGATE survivor
    count looks unbiased. THE DISCRIMINATING TEST: partition the 2^20
    (k3,k4) wrong-candidate space of attack6n's committed filter (per
    IDEA-f2fc33's own transcription of sq_null.c) by XOR-DISTANCE FROM THE
    TRUE (k3*, k4*) PAIR, and measure the per-distance-class survival rate
    at S=1 structure, where the aggregate model still has enough events per
    class to resolve a effect. UNIFORM (U1 exact, no structure): every
    distance class survives at 2^-8 independent of distance. STRUCTURED
    (wrong-key-lives-on applies here): survival rate is a non-flat function
    of XOR-distance, concentrated near small distances or near distances
    sharing structure with the round-key's linear layer action.
  mechanism: >-
    DERIVED FROM COMMITTED SOURCE (same file IDEA-f2fc33 already read,
    sq_null.c mode attack6n) plus the RETRIEVED external mechanism. The
    filter tests an 8-bit equality per structure; U1 as measured by
    IDEA-f2fc33 is an AGGREGATE claim (mean and variance of |cand| over the
    WHOLE 2^20 space). This proposal re-slices the same already-planned
    Stage-3 runs (nstruct=1, independent keys) by a covariate -- XOR
    distance of the wrong (k3,k4) guess from the true pair -- that costs
    nothing extra to record (it is computable from data the attack already
    holds) and was not read by IDEA-f2fc33's design. If the wrong-key-lives-
    on mechanism applies to THIS filter's specific 8-bit-per-structure
    equality (not guaranteed -- the eprint mechanism was described for a
    different integral construction and the transfer is exactly what this
    test checks), certain distance classes will survive at a measurably
    elevated rate even though the pooled mean matches uniform.
  why_not_a_renamed_known_approach: >-
    NEAREST INTERNAL RECORD: IDEA-20260805-f2fc33 / H-AES-d6405d, which
    tests the SAME filter for AGGREGATE uniformity (U1) and found agreement.
    This proposal does not repeat that test; it asks a STRICTLY FINER
    question the aggregate test has no power against by construction (a
    non-uniform distribution over classes can still average to the uniform
    mean and variance). NEAREST EXTERNAL WORK: eprint 2025/2011, which
    describes the mechanism for a different (though related) integral
    key-recovery structure; this record does NOT assume the mechanism
    transfers to attack6n's specific 8-bit equality filter -- that
    transfer is exactly what falsification condition 1 tests, and a
    negative result (no structure found) is a real, informative outcome
    that narrows where the eprint mechanism applies.
  object_first_candidate:
    tracked_object: >-
      The per-XOR-distance-class survival rate of the (k3,k4) candidate
      filter, as a function of Hamming/XOR distance from the true pair,
      rather than the pooled |cand| count IDEA-f2fc33 tracked.
    established_families_off_limits: >-
      No attack family is used as a lens; this audits an EXISTING
      integral/partial-sums construction's own control statistic, exactly
      as RQ-AES-003 permits for baseline-arm and control work (parallel to
      IDEA-f2fc33's own framing).
    lossy_projection_identifiability_audit:
      projection: (full candidate bitmap cand[d][r][k3][k4]) -> (survival
        indicator, XOR-distance-from-true-pair class).
      what_is_discarded: Which specific wrong pair, beyond its distance class; the per-diagonal/row identity.
      is_it_only_a_change_of_coordinates: >-
        NO -- many distinct wrong pairs collapse to one distance class,
        and the projection is compatible with the filter's own operations
        (the 8-bit equality test is itself a function of the XOR of guess
        and truth through the round function). The check that matters:
        IDEA-f2fc33's pooled statistic is the SAME projection collapsed
        one step further (distance discarded entirely); this proposal is
        the intermediate, informative stop between "everything" and
        "nothing," and is genuinely new relative to both endpoints.
  novelty_status: unverified
  citations:
    - ref: 'eprint 2025/2011, "When the Wrong Key Lives On: The Key-Recovery Procedure in Integral Attacks"'
      provenance: recalled
      claim: Wrong-key survival in integral/partial-sums-style attacks can be structured by XOR-distance via differential-linear propagation, not uniform.
      verified_by: null
    - ref: IDEA-20260805-f2fc33 / H-AES-d6405d
      provenance: internal
      claim: attack6n's pooled survivor count matches uniform (U1) within 1 sd on 4 committed integers.
      verified_by: idea-generator subagent (read ledger/proposals/IDEA-20260805-f2fc33.yaml in full during idea generation)
  assumptions:
    - IDEA-f2fc33's Stage-1/Stage-3 re-derivation of the filter's source semantics is correct (this proposal reuses that transcription rather than re-deriving it).
    - Distance-class bucketing is computable from the already-planned Stage-3 run outputs without additional cipher evaluations.
  proof_search_map:
    not_applicable_reason: >-
      This is an empirical audit of an existing statistic's finer structure,
      not a proof-oriented claim; the "proof obligations" analog is carried
      in falsification_conditions and minimal_test instead.
  predictions:
    - metric: per-distance-class survival rate at S=1, distance in {1,...,8} bits (grouped)
      direction: different
      minimum_effect: A non-flat profile with at least one class deviating from 2^-8 by more than 5 empirical standard errors is the structured-bias signal.
    - metric: correlation of per-class survival rate with distance
      direction: different
      minimum_effect: Any monotone or otherwise reproducible (not noise-shaped) trend across >=3 independent keys.
    - metric: round-count decay of any found structure (S=1 vs S=2)
      direction: lower
      minimum_effect: A genuine structural bias should attenuate as S increases (more structures = more independent 8-bit tests); a bias that does NOT attenuate is the artifact tell.
  minimal_test:
    design: >-
      Reuse IDEA-f2fc33's already-scoped Stage-3 runs (independent keys,
      S in {1,2,3}) with ONE addition: log the (k3,k4) guess's XOR distance
      from the true pair alongside the survive/die bit, at zero extra
      cipher cost. Bucket by distance, compute per-bucket survival rate and
      its binomial CI, and compare across buckets and across S.
    controls:
      - Uniform-null simulation (pseudorandom 8-bit sieve, per IDEA-f2fc33's own surrogate) run through the SAME distance-bucketing pipeline -- must show flat rates across all buckets, or the bucketing pipeline itself is broken.
      - Independent keys (>=3) to avoid the single-key confound IDEA-f2fc33 already flagged.
      - Round-count decay check (S=1,2,3).
    required_metrics:
      - per-distance-bucket survival rate with CI, per key, per S
      - the uniform-null surrogate's same table (must be flat)
      - correlation coefficient and its significance
  falsification_conditions:
    - The uniform-null surrogate shows the same non-flat profile as the real cipher -- the bucketing pipeline is broken, not the cipher.
    - No bucket deviates beyond 5 empirical SE across >=3 independent keys -- the wrong-key-lives-on mechanism does not transfer to this specific filter, a real and useful negative result narrowing eprint 2025/2011's scope.
    - Any found structure fails to attenuate with increasing S -- artifact tell, void.
  confounders:
    - Distance-bucket sample sizes are uneven (few pairs at extreme distances); report achievable resolution per bucket before claiming a null.
    - Reuses IDEA-f2fc33's own confound (shared seed/key across TRUE6/WRONG6 runs) unless independent-key Stage-3 runs are used, per that record's own fix.
  interpretation_limits:
    - Toy tier, reduced-round, no claim about full AES.
    - A found bias says the campaign's OWN CM-3(d) success-probability convention (uniform wrong-key assumption) needs a correction factor for THIS construction; it does not by itself constitute a cheaper attack until exploited.
    - No status change to EV-AES-d8a13e, H-AES-d6405d, or any prior decision; any re-scoping is a Coordinator act on a superseding record.
  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR the attack6n 8-bit equality filter, survival probability of a
        wrong (k3,k4) candidate is a function of its XOR-distance from the
        true pair (not distance-independent as U1 assumes), matching the
        qualitative shape reported for differential-linear wrong-key
        propagation in integral attacks.
      rigorous_support: >-
        None proved here. The rigorous half is the deterministic algebra
        of the round function (SubBytes/MixColumns/AddRoundKey composition
        under a wrong guess produces a DETERMINISTIC, not random, function
        of the guess -- only its STATISTICAL behavior over guesses is
        heuristic). The distribution being tested against is the same
        "wrong key behaves like independent uniform noise" heuristic every
        prior partial-sums record in this campaign has used; this is its
        first test at finer-than-aggregate resolution.
      validation_plan: >-
        The minimal_test above IS the validation route: bucket by distance
        at S=1 over >=3 independent keys, compare against the uniform-
        surrogate's own bucketed output, and check attenuation with S.
  target_complexity:
    time_exponent: n/a -- control/measurement, no algorithm proposed.
    memory_exponent: n/a -- reuses already-planned run outputs.
    best_known: The campaign's own U1/HEUR-F1 assumption (IDEA-f2fc33), tested at a finer resolution here.
    hidden_overhead: >-
      If structure IS found, every prior cost claim in this campaign that
      relied on CM-3(d)'s uniform wrong-key success-probability convention
      for an integral/partial-sums construction needs to state a
      correction factor or an honest "assumes U1 at aggregate resolution
      only" caveat.
    tradeoff_note: not applicable.
  dominated_by: >-
    n/a (no attack claimed). For the QUESTION "does U1 hold", IDEA-f2fc33's
    aggregate test is cheaper but structurally cannot see this effect;
    this proposal does not dominate it, it complements it at the next
    resolution level.
  sota_delta: >-
    Zero on any attack axis. If structure is found, the campaign gains its
    first measured departure from U1, load-bearing for every future
    integral-style cost claim. If not found, the campaign gains a scoped
    negative narrowing eprint 2025/2011's applicability to this construction.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  source_refs:
    - RQ-AES-003
    - GOAL-AES-003
    - IDEA-20260805-f2fc33
  id_allocation_provenance: >-
    Minted with `python3 tools/allocate_id.py --next idea --date 20260828`,
    verified with `--check` before use.
