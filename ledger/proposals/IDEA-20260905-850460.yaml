idea:
  id: IDEA-20260905-850460
  title: Retained-control exact degree-growth ladder for binary-digit systems
  class: measurement
  status: proposed
  added: '2026-09-05'
  proposed_at: '2026-09-05'
  proposed_by: idea-generator
  question_id: RQ-PFDR-ae2fba
  task_id: TASK-20260905-5a2208
  batch_id: BATCH-ae9150
  claim: >-
    An exact, completeness-certified ladder in the number of binary digits can
    distinguish finite degree growth from a gap between named degree invariants,
    while retained matched controls distinguish block-structure effects from
    additional curve dependence. Equality of first and last fall with both growing
    is an admissible outcome; a censored computation cannot establish equality.
  mechanism: >-
    Freeze one implementation version for every target and blocking control,
    retain exact closure traces and independently check their completeness.
    Vary s along a declared parameter ladder; record first fall and last fall
    in explicitly bound conventions, and solving degree only for an actually
    executed, specified algorithm. Separate fixed-shape prime calibration from
    increasing-digit measurements. Use deterministic finite comparisons without
    treating repeated deterministic values as independent slope observations.
  novelty_status: unverified
  citations:
    - ref: H-PFDR-c88f14
      provenance: internal
      claim: Existing work proposes a first-versus-last-fall comparison for prime-field digit systems.
      verified_by: codex-root/2026-09-05
    - ref: experiments/EXP-PFDR-5726af/analysis.md
      provenance: internal
      claim: Existing finite first-fall observations include curve-free block-structure comparisons.
      verified_by: codex-root/2026-09-05
    - ref: https://arxiv.org/pdf/1505.02532
      provenance: retrieved
      claim: V_F,D and last-fall definitions require explicit completeness and applicability checks.
      verified_by: codex-root/2026-09-05
    - ref: https://arxiv.org/pdf/2112.05579
      provenance: retrieved
      claim: >-
        Example 2.4 shows a consecutive closure plateau need not exclude later
        falls; Example 4.4 supplies an ordinary known-false equality control.
      verified_by: codex-root/2026-09-05
  assumptions:
    - Exact finite-field arithmetic and retained deterministic input generation are available.
    - Completion has a mathematical certificate, not a timeout or unchanged consecutive dimension.
    - All compared targets and controls use one retained producer version and documented definitions.
    - Target admissibility and digit injection are checked for every parameter tuple.
  proof_search_map:
    bottleneck: Establish closure completeness while varying the actual system dimension affordably.
    baseline_embedding:
      parameter_slice: Small m=2 binary-digit cases, beginning at s=2 and increasing s.
      reproduction_check: >-
        Reconstruct a bounded baseline and every blocking control under the
        frozen version. Audit compatibility of layer and closure definitions
        before comparing their named integers.
    observation_collision:
      observable: Equal first-fall values or equal adjacent closure dimensions.
      distinct_preimage_search: >-
        Compare curve and curve-free systems with the same leading structure;
        retain a delayed-fall ordinary control whose early plateau is misleading.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: Successive digit counts with complete certificates at each completed size.
        predicted_gain: Measure finite growth in a changing representation rather than a fixed-shape prime sweep.
      - transform: stronger_invariant
        proposed_object: Degree-indexed exact closure traces and independent terminal certificates.
        predicted_gain: Separate proven equality, certified separation and censoring.
    quantifier_order: >-
      For each declared finite tuple, certify the computed invariants. Compare
      across a finite list of s values with the prime schedule recorded. No
      finite increasing list refutes an unspecified O(1) claim; asymptotic growth
      requires a separate quantified family proof. Sampling supports only its
      stated distribution and never turns repeated deterministic values into
      independent asymptotic evidence.
    method_ceiling:
      strongest_certifiable_claim: Finite exact degree values, conditional comparisons and retained control outcomes.
      nearby_object_control: >-
        The ordinary published delayed-fall example defeats stopping at a
        plateau; the published separation example defeats generic equality.
        Neither is silently converted into a Boolean quotient fixture.
    proof_obligations:
      - claim: Prove the implementation computes the declared iterated closure.
        responsibility: correctness
      - claim: Supply a sound last-fall completeness criterion for the finite presentation.
        responsibility: scope
      - claim: Audit the interface before identifying layer first fall with other conventions.
        responsibility: interface
      - claim: Account for matrix dimensions, all control runs, memory and certificate checking.
        responsibility: runtime
    not_applicable_reason: null
  predictions:
    - metric: finite_first_fall_ladder
      direction: higher
      minimum_effect: The predecessor law predicts 5,5,6,6,7 for s=2,3,4,5,6 when its conditions hold.
    - metric: certified_degree_relation
      direction: different
      minimum_effect: Classify each complete case as equality or a positive gap; censored cases receive neither label.
    - metric: blocking_control_custody
      direction: higher
      minimum_effect: Every blocking control has input, producer version, output and verification receipts.
  minimal_test:
    design: >-
      Begin with a small predeclared s=2..4 pilot, increasing only after a
      Coordinator freezes the next resource bound. Separate a constant-prime
      digit ladder, where injection holds throughout, from a fixed-s prime
      calibration panel. Retain all attempted fixtures and stopping reasons.
    controls:
      - Curve-free generator matching leading block structure and specified lower-term convention.
      - Matched shape-null system with the same field, variables and declared degree profile.
      - Ordinary delayed-fall control in its published native convention.
      - Ordinary first-versus-last separation control in its published native convention.
      - Independent checker for row reductions, consequence witnesses and terminal certificates.
      - Fixed-s prime sweep reported separately as calibration, never digit-growth evidence.
    required_metrics:
      - Layer d_ff and closure d_lf with explicit conventions and completeness flags.
      - d_solve only when a named algorithm and term order were actually measured.
      - Per-degree closure dimensions, ranks, witness hashes and terminal certificate.
      - All fixture/control inputs, producer hash, verifier hash and deterministic seeds where used.
      - Wall time, peak memory, matrix shape, censoring threshold and exact stopping reason.
      - Finite differences across s without pseudoreplicated slope tests.
  falsification_conditions:
    - An independent certificate checker contradicts a reported degree or completeness claim.
    - A retained matched control changes the proposed curve-specific interpretation.
    - Equality is asserted for any incompletely certified case.
    - A deterministic repeated measurement is counted as an independent slope sample.
  confounders:
    - Different producer versions for targets and controls, or missing control receipts.
    - Prime changes mixed with digit-count changes without a declared design.
    - Early closure plateaus, memory ceilings or timeouts interpreted as degree evidence.
    - Definition mismatch or different rational-target domains across the ladder.
  interpretation_limits:
    - This proposal promises a discriminating measurement, not a positive degree gap.
    - Equality with jointly increasing degrees is compatible with finite bounded-degree counterexamples only for supplied bounds.
    - Failed completion is an operational censoring result and no mathematical refutation.
    - Small public fixtures provide no end-to-end ECDLP result or extrapolation to cryptographic parameters.
    - Local untracked review leads require independent verification and are not cited as evidence.
  heuristic_assumptions:
    - id: H1
      statement: The predecessor first-fall pattern may persist at the declared additional finite digit sizes.
      rigorous_support: Conditional prediction only; general rank and survival obligations remain open.
      validation_plan: Exact finite comparisons with retained controls and separate reporting of every exception.
    - id: H2
      statement: No random-model transfer from a finite ladder to an asymptotic family is assumed.
      rigorous_support: Any such transfer requires an additional explicit family argument.
      validation_plan: Report finite parameters and censoring; require a new approved proof protocol for extrapolation.
  target_complexity:
    time_exponent: No attack improvement claimed; exponent delta +0.
    memory_exponent: No attack improvement claimed; exponent delta +0.
    best_known: No attack comparison is asserted; query exponent delta +0.
    hidden_overhead: The Boolean quotient has 2^(2s) basis monomials; closure matrices and certification can dominate.
    tradeoff_note: Sparse storage and parallel cases do not remove exact completeness or memory accounting duties.
  dominated_by: n/a (no result claimed; frontier audit incomplete)
  sota_delta: No attack; conceptual/measurement contribution only; time/memory/query exponent delta +0.
  estimated_cost:
    implementation: medium
    compute: medium
    proposed_bound: Future pilot at most 24 fixtures including controls, 4 hours total, 8 GiB; this batch runs zero.
  recommended_priority: medium
  priority_order: 3
