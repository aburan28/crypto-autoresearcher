idea:
  id: IDEA-20260805-e5dd09
  question_id: RQ-XEDN-001
  added: '2026-08-05'
  goal_context: GOAL-ICLIFT-001
  title: >-
    The rank budget, not the section density: exact forced values Pr[rank = 8]
    = 1 - 1/p and Pr[rank = 0] = (3p-2)/p^5 for the frozen xedni family, and a
    zero-compute audit of the r <= 8 bound the census relayed and never recomputed
  class: theory

  claim: >-
    For the frozen GOAL-ICLIFT-001 family y^2 = x^3 + b(t) over F_p with
    deg b = 6 exactly, the geometric Mordell-Weil rank is not merely bounded by 8
    -- it is DETERMINED by the root-multiplicity pattern of b, and the induced
    distribution is computable in closed form with no enumeration and no
    sampling. Two forced values are derived below and are checkable by brute
    force at p = 5 and 7 in seconds: Pr[rank = 8] = 1 - 1/p EXACTLY (b squarefree
    is exactly the generic-rank locus), and Pr[rank <= 1] = Pr[rank = 0] =
    (3p - 2)/p^5 EXACTLY, arising from precisely three root patterns (5+1, 4+2,
    3+3) plus the degenerate constant-curve pattern (6). The consequence
    reframes what the route's obstruction IS. The xedni construction succeeds
    only when the two prescribed sections are DEPENDENT in the Mordell-Weil
    group, which on this family requires rank <= 1 -- a rate of order p^-4 --
    whereas the census measured the density of a single section, a rate of order
    p^-3. So even granting RT-5 in full and moving to the prescribed measure,
    where a first section is free (10,201 of 10,201), the binding rate is the
    RANK-DEGENERATION rate and it is one power of p WORSE than the density the
    census closed the route on. Secondly, and separately: the census's own
    artifact records "rank_bound_r = 8 ... source = Shioda-Tate bound for a
    rational elliptic surface (literature; not recomputed here)", and
    EV-XEDN-002 records polarisation Gram ranks of 9 to 12 on that same family.
    Under the derivation below those ranks are impossible, so at least one of
    (a) the relayed bound, (b) the Gram computation, or (c) the rationality of
    these surfaces is wrong -- and the corpus currently carries all three
    unreconciled. No attack, no exponent improvement, and no closure of candidate
    B2 is claimed.

  object_first_candidate:
    tracked_object: >-
      The DEGENERATION BUDGET of a surface: the multiset of root multiplicities
      of b(t) over the algebraic closure, together with the resulting
      component-count deficit D(b) := sum over geometric places v of (m_v - 1),
      followed from the coefficient vector of b to the rank of the Mordell-Weil
      group. This is followed through the computation the attack performs: b is
      what the prescribed construction produces (b = y^2 - x^3 for the chosen
      section), D(b) is what fixes the rank, and the rank is what decides whether
      a relation between the two prescribed sections exists at all.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: (1) section-density / p^-alpha
      counting, which is exactly what the census did and what this proposal
      refuses to redo; (2) the relation-coefficient / max_|coeff| lineage
      (EXP-XEDN-003..007 and GOAL-XEDN-001/002/003), which is another goal's
      territory and is neither re-run nor restated; (3) canonical-height and
      polarisation-Gram diagnostics as a source of rank -- KN-FIND-003 warns
      against exactly that and this proposal treats those Gram ranks as the
      object of an audit, not as data; (4) classical number-field xedni; (5)
      summation-polynomial index calculus. The lens used here is the local fibre
      structure of the elliptic surface and nothing else.
    newness_score: >-
      Shioda-Tate and the Kodaira fibre table are standard mathematics that this
      program has RELAYED and never recomputed -- the census artifact says so in
      its own words. What is not in this corpus is (i) the exact induced
      distribution of the rank over the frozen family, (ii) the observation that
      the rank is DETERMINED rather than bounded on this family because every
      local contribution is even, so rank <= 1 collapses to rank = 0, and (iii)
      the resulting reframing of the obstruction from p^-3 density to p^-4 rank
      degeneration. Points (i)-(iii) are derived here and are cheap to refute.
    testability_score: >-
      High and unusually cheap: the two forced values are pure combinatorics on
      partitions of 6 and can be confirmed by exhaustive enumeration of all
      (p-1)p^6 polynomials at p = 5 (78,125 objects) and p = 7 (823,543), which
      is seconds in pure Python and needs neither sympy nor Sage -- both of which
      are ABSENT from this container (verified in session; numpy 2.4.6 IS
      present). What is NOT cheap, and is scoped accordingly, is verifying the
      Shioda-Tate rank itself, which requires either the relayed theorem or an
      independent construction of 8 independent sections.
    survival_score: >-
      The combinatorial half survives to any p and to any degree, because it is
      a statement about factorisation patterns. The geometric half survives only
      as far as the relayed fibre table does, which is exactly the uncertainty
      the audit exists to convert into either a citation or a refutation.

  mechanism: >-
    DERIVED IN SESSION. Steps marked RECALLED are model memory and are candidates
    to check, never authorities; verifying them is a stage of the paired work,
    and every prediction in this record that does NOT depend on them is marked as
    such.

    (1) THE FAMILY AND ITS COUNT. Surfaces are y^2 = x^3 + b(t), deg b = 6
    exactly, so the family has (p-1)p^6 members. This reproduces the archived
    n_surfaces exactly: 62500 (p=5), 705894 (p=7), 17715610 (p=11), 57921708
    (p=13). CHECKED IN SESSION against the committed artifact; NOT A RUN.

    (2) THE FIBRE AT INFINITY IS GOOD. Substituting t = 1/s with the
    (x, y) -> (x/s^2, y/s^3) weighting turns b(t) into s^6 b(1/s), whose value at
    s = 0 is the leading coefficient of b, nonzero by deg b = 6 exactly. So all
    degeneration is at finite roots of b. This step is elementary and does not
    depend on any relayed fact.

    (3) THE LOCAL TABLE (RECALLED, UNVERIFIED). For y^2 = x^3 + b with v(a) =
    infinity and v(b) = k, the Kodaira type and component count are recalled as:
    k=1 -> II (m=1), k=2 -> IV (m=3), k=3 -> I_0* (m=5), k=4 -> IV* (m=7),
    k=5 -> II* (m=9), k=6 -> non-minimal. Hence the local deficit
    c(k) := m - 1 takes values c(1)=0, c(2)=2, c(3)=4, c(4)=6, c(5)=8. NO SOURCE
    IS CITED AND NONE IS ASSERTED. The single structural fact the argument needs
    from this table is that EVERY c(k) IS EVEN, and that is the fact to verify
    first, because it is what makes step (5) collapse.

    (4) SHIODA-TATE (RECALLED, UNVERIFIED). For a rational elliptic surface,
    rank of the geometric Mordell-Weil group = 8 - sum_v c(k_v), with the sum
    over geometric places. The census artifact records the same bound as relayed
    and not recomputed. Consequence of (2) and (3): sum_v c(k_v) is a function of
    the root-multiplicity partition of b alone, since sum_v k_v = deg b = 6.

    (5) THE RANK IS DETERMINED, AND rank <= 1 COLLAPSES TO rank = 0. Enumerate
    the partitions of 6 and their deficits:
        1+1+1+1+1+1 -> 0  (rank 8)
        2+1+1+1+1   -> 2  (rank 6)
        2+2+1+1     -> 4  (rank 4)
        3+1+1+1     -> 4  (rank 4)
        2+2+2       -> 6  (rank 2)
        3+2+1       -> 6  (rank 2)
        4+1+1       -> 6  (rank 2)
        3+3         -> 8  (rank 0)
        4+2         -> 8  (rank 0)
        5+1         -> 8  (rank 0)
        6           -> non-minimal: the surface is a constant curve after
                       (x, y) -> (u^2 X, u^3 Y) with u = t - alpha, so its
                       geometric Mordell-Weil group is E_0(F_pbar), a torsion
                       group, rank 0.
    Because every c(k) is even, the deficit is always even, so rank is always
    even and "rank <= 1" is exactly "rank = 0". THIS IS THE STEP THAT MAKES THE
    CRITERION SHARP, and it is the one that depends on the relayed table; if any
    c(k) is odd the collapse fails and the whole classification must be redone.

    (6) THE EXACT RATES (INDEPENDENT OF THE RELAYED TABLE -- these are pure
    counting statements about polynomials and can be confirmed by enumeration
    with no geometry at all).
      (a) Pr[b squarefree] = 1 - 1/p EXACTLY. The number of monic squarefree
          polynomials of degree n >= 2 over F_q is q^n - q^{n-1}; scaling by a
          leading coefficient does not affect squarefreeness.
      (b) The three rank-0 patterns count as follows. A root of multiplicity
          >= 4 must be F_p-rational (its Galois conjugates would carry the same
          multiplicity, forcing degree >= 8 > 6), and in the 5+1 and 4+2 patterns
          the second root is likewise forced rational by the residual degree.
          So: pattern (5,1) gives p(p-1) monic; pattern (4,2) gives p(p-1) monic;
          pattern (3,3) gives either two distinct F_p-rational roots, C(p,2) =
          p(p-1)/2, or one conjugate pair in F_{p^2}\F_p, (p^2-p)/2 = p(p-1)/2,
          totalling p(p-1) monic. Sum: 3p(p-1) monic, times (p-1) leading
          coefficients, giving 3p(p-1)^2. Divided by (p-1)p^6:
              Pr[rank = 0, minimal] = 3(p-1)/p^5 EXACTLY.
          Adding the non-minimal pattern (6), which contributes p(p-1):
              Pr[rank = 0, all] = (3p - 2)/p^5 EXACTLY.
          Numerically at p = 13: 36/371293 = 9.6959e-05 and 37/371293 =
          9.9652e-05. At p = 101: 300/1.0510e10 = 2.8544e-08.

    (7) WHAT THE ATTACK NEEDS, AND WHY THIS IS THE BINDING RATE. The function-
    field xedni construction wants sections sigma_P and sigma_Q specialising to
    the ECDLP target points P and Q at a place t_0, and it succeeds only if some
    nonzero (a, b) gives a*sigma_P + b*sigma_Q in the torsion subgroup: only then
    does specialisation yield a*P + b*Q = (an enumerable torsion point) and hence
    the logarithm. Two sections of a rank-8 lattice are generically independent
    and no such relation exists. On this family the ONLY structural way to force
    dependence is rank = 0, at rate (3p-2)/p^5. Compare the census's closed rate,
    P_lift = (p^3 - 2p^2 + 1)/(2p^6) ~ 1/(2p^3), which is the density of ONE
    section under the uniform measure. RT-5's objection is correct and does not
    help: prescribing the first section is free under the constructed measure,
    but the quantity that then binds is p^-4 rather than p^-3. THE OBSTRUCTION
    THE ROUTE FACES IS ONE POWER OF p WORSE THAN THE ONE THE ROUTE WAS CLOSED ON,
    and it survives the change of measure that was supposed to rescue it -- UNLESS
    the prescribed construction correlates with the root pattern of b, which is
    precisely the falsifier named below and is not assumed either way here.

    (8) THE AUDIT THAT COSTS NOTHING. EV-XEDN-002 records polarisation height
    Gram ranks of 9 to 12 on this family, with KN-FIND-003 warning they are
    diagnostic only. Under (4) a rank above 8 is impossible for a rational
    elliptic surface, so the corpus holds three mutually inconsistent
    propositions, all live: the relayed r <= 8, the measured Gram ranks 9-12, and
    the rationality of these surfaces. AGENTS.md's retrieval policy says to
    report contradictions rather than pick one, and this proposal reports it and
    makes resolving it a stage: either exhibit 9 sections that are provably
    independent (which refutes the relayed bound or the rationality), or exhibit
    the local height correction that collapses the Gram rank to <= 8 (which
    confirms KN-FIND-003's warning with a mechanism rather than a caution).

    (9) THE CROSS-ROUTE OBSERVATION, offered as the durable methodological part.
    GOAL-ICLIFT-001 closed two independent routes, and both closed on a FIRST
    MOMENT whose value was forced by a convention rather than by the object.
    On the factor-base route the conservation identity fixes mean yield at
    C(B+m-1,m)/N for every base, so the primary metric was exactly 1.000000
    everywhere and the decision itself calls that arm "vacuous by construction".
    On the lifting route the exact per-slot density fixes the mean number of
    sections, and the red team's fatal objections (RT-4 distinct-is-not-
    independent, RT-5 wrong measure) are both statements that the SECOND moment
    was the operative quantity. The shared failure is not arithmetic; it is that
    a count of distinct objects was used as a proxy for a count of independent
    ones, in two places, by two teams, on the same goal. Naming that as a
    reusable screen -- before freezing a metric, ask whether a conservation law
    or an exact identity already determines it -- is worth more than either
    verdict.

  novelty_status: unverified

  literature_context:
    - >-
      DEC-20260724-021 and EV-XEDN-001 (both READ in full this session). Source
      of the exact identity, of RT-1/RT-4/RT-5, of the eleven forbidden
      sentences, and of the statement that Mordell-Weil rank and independence
      were NOT measured. That last line is what this proposal takes up.
    - >-
      EV-XEDN-001 records RT-10 verbatim: "the counted sections are height-2
      roots of the E_8 Mordell-Weil lattice, so their relations have absolutely
      bounded coefficients, making the binding obstruction the coefficient size
      rather than the p^-3 density". This proposal agrees that the p^-3 density
      is not the binding obstruction and proposes a DIFFERENT candidate for what
      is: the rank-degeneration rate. The two candidates are not in conflict --
      coefficient size binds given a relation, rank binds whether one exists --
      and the record says so rather than picking.
    - >-
      DEC-20260724-022 / EV-XEDN-002 / KN-FIND-003 (all READ). Source of the
      Gram ranks 9-12 and of the warning that the polarisation Gram is not
      Shioda rank. Nothing in those records is contradicted here; what is
      proposed is the missing mechanism for the warning.
    - >-
      experiments/EXP-XEDN-002/runs/RUN-XEDN-002-C/raw-result.json (READ,
      committed) -- field shioda_tate_requirement records
      "rank_bound_r = 8, sections_needed_for_a_relation = s >= r + 1, i.e. s >= 9,
      source = Shioda-Tate bound for a rational elliptic surface (literature; not
      recomputed here)". The bound is therefore RELAYED inside the program's own
      artifact and is used downstream as if established.
    - >-
      Shioda-Tate formula; the Kodaira classification of singular fibres; the
      Oguiso-Shioda classification of Mordell-Weil lattices of rational elliptic
      surfaces; the count q^n - q^{n-1} of monic squarefree polynomials of degree
      n over F_q. ALL FOUR ARE RECALLED, UNVERIFIED. No author, year, venue,
      theorem number or page is asserted for any of them anywhere in this record.
      The fourth is the only one the exact rates in prediction 1 and 2 depend on,
      and it is confirmable by direct enumeration at p = 5 and 7 without any
      citation at all.

  lossy_projection_identifiability_audit:
    projection: >-
      Surface b in F_p[t] (a point of a (p-1)p^6-element space) --> the
      multiset of root multiplicities of b over F_pbar (a partition of 6, of
      which there are 11) --> the deficit D(b) = sum c(k_v) (one of {0,2,4,6,8})
      --> the rank 8 - D(b).
    what_is_discarded: >-
      The positions of the roots, their fields of definition beyond what the
      partition forces, the leading coefficient, and every coefficient of b. Only
      the multiplicity pattern survives: a compression from p^7-ish objects to 11
      classes.
    why_genuinely_lossy: >-
      Overwhelmingly lossy and provably non-invertible: at p = 13 more than 92%
      of the family lands in the single class 1+1+1+1+1+1. The compatibility
      requirement is what makes it usable rather than merely small: the partition
      is invariant under the family's own symmetries (b -> u^6 b with the
      matching (x, y) scaling, and t -> t + c, and more generally the
      Mobius action on t), and it propagates deterministically into the rank via
      a purely local computation at each place. So the retained part still
      determines the downstream quantity exactly, which is the condition the
      lossy-projection test asks for.
    is_it_only_a_change_of_coordinates: >-
      No -- and the failure this audit had to check for is the MIRROR one, since
      the projection lands in an 11-element set and could easily have been
      constant across instances. It is not: the class distribution is
      1 - 1/p on the generic class and (3p-2)/p^5 on the rank-0 classes, so the
      comparator has a spread of order p^4 between its extremes, which is the
      opposite of zero spread. The check performed was: "does the projection
      take more than one value with non-negligible probability, and does the
      value it takes change the downstream conclusion?" -- yes to both, with the
      exact rates derived above. What the projection CANNOT do is distinguish two
      surfaces in the same class, and the record states that limitation rather
      than hiding it: nothing here identifies WHICH rank-0 surfaces the
      prescribed construction produces, only how many there are.

  assumptions:
    - >-
      RELAYED AND LOAD-BEARING: Shioda-Tate for rational elliptic surfaces and
      the Kodaira table for j = 0. Every geometric conclusion (steps 3-5, 7, 8)
      fails if either is misremembered. The two purely combinatorial predictions
      (Pr[squarefree] and the pattern counts) do NOT depend on them and are
      stated separately so a reviewer can accept one half and reject the other.
    - >-
      That deg b = 6 exactly and b not a perfect sixth power of a linear form is
      the minimal Weierstrass model. The non-minimal pattern (6) is carried
      explicitly rather than silently dropped, and both rates -- with and without
      it -- are given.
    - >-
      That "the attack succeeds iff the two prescribed sections are dependent" is
      a faithful statement of what function-field xedni requires. This is a
      restatement of the route's own logic as recorded in RQ-XEDN-001 and is not
      an independent claim about any published algorithm; no published xedni
      algorithm is described, cited or evaluated here.

  proof_search_map_note: >-
    This idea is proof-oriented but is deliberately NOT paired with its own
    experiment contract in this batch: its cheapest decisive stage (the exact
    pattern count) is folded into EXP-ICLIFT-290f2e's instrument-check arm, and
    its expensive stage (independently establishing the rank bound) is a
    literature-verification task rather than an experiment. Recorded here as a
    proposal so the derivation is on the ledger and can be attacked before
    anyone spends compute on it.

  predictions:
    - metric: >-
        fraction of b of degree exactly 6 over F_p that are squarefree
      direction: higher
      minimum_effect: >-
        FORCED VALUE exactly 1 - 1/p, i.e. 0.800000 at p = 5, 0.857143 at p = 7,
        0.909091 at p = 11, 0.923077 at p = 13. Confirmable by exhaustive
        enumeration at p = 5, 7 in seconds. INDEPENDENT of every relayed
        geometric fact. A deviation refutes the counting and everything built on
        it.
    - metric: >-
        fraction of b of degree exactly 6 over F_p whose root-multiplicity
        pattern is one of (5,1), (4,2), (3,3)
      direction: lower
      minimum_effect: >-
        FORCED VALUE exactly 3(p-1)/p^5 -- 12/3125 = 3.840e-3 at p = 5,
        18/16807 = 1.0710e-3 at p = 7, 30/161051 = 1.8628e-4 at p = 11,
        36/371293 = 9.6959e-5 at p = 13 -- and (3p-2)/p^5 including the pattern
        (6). INDEPENDENT of every relayed geometric fact; exhaustively
        confirmable at p = 5, 7.
    - metric: >-
        geometric Mordell-Weil rank of a surface with squarefree b, computed
        independently of the relayed Shioda-Tate statement
      direction: different
      minimum_effect: >-
        FORCED VALUE exactly 8. This one DOES depend on the relayed facts and is
        the audit's target. Refuting it is as valuable as confirming it, and more
        likely to matter: EV-XEDN-002 already reports Gram ranks of 9 to 12 on
        this very family.
    - metric: >-
        number of the archived RUN-XEDN-002-C top_surfaces at p = 13 whose b has
        a repeated root
      direction: higher
      minimum_effect: >-
        A directional prediction with no fitted parameter: section-rich surfaces
        should be enriched in non-squarefree b relative to the family baseline of
        1/p = 0.0769. If the section-rich surfaces are NOT enriched, the rank
        story is decoupled from the abundance story and this proposal's framing
        is weakened even where its counting survives.
    - metric: >-
        parity of the local deficit c(k) for k = 1..5
      direction: different
      minimum_effect: >-
        FORCED: all even (0, 2, 4, 6, 8). This is the single relayed fact the
        rank <= 1 collapse depends on, isolated deliberately so that one check
        settles it. If any c(k) is odd, step (5) is void and the rank-0 rate must
        be recomputed over a larger set of patterns.

  minimal_test:
    design: >-
      Three stages, cheapest first, and the first can terminate the whole
      derivation. STAGE 0 (pure combinatorics, seconds, no geometry): enumerate
      all (p-1)p^6 polynomials at p = 5 and p = 7, classify by root-multiplicity
      pattern over F_pbar, and compare against 1 - 1/p and 3(p-1)/p^5. If either
      forced value fails, the counting is wrong and nothing downstream is worth
      running. STAGE 1 (reading, no compute): obtain a primary statement of
      Shioda-Tate and of the j = 0 Kodaira table, quote them verbatim with a
      locatable reference, and either promote the relayed facts or record that
      they could not be obtained. STAGE 2 (bounded compute): on a small sample of
      squarefree-b surfaces, attempt to exhibit 8 independent sections by the
      group law and attempt to exhibit a 9th; report which succeeded. This is the
      only arm that can settle the Gram-rank contradiction empirically.
      Stage 0 is executed as the instrument-check arm of
      experiments/EXP-ICLIFT-290f2e; stages 1 and 2 are recorded here as
      recommended follow-on work and are NOT contracted in this batch.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE (stage 0): uniformly random degree-6
        polynomials that are NOT of the form b, i.e. the same enumeration applied
        to an independent uniform polynomial family. FORCED VALUE identical --
        1 - 1/p squarefree -- because the pattern distribution depends only on
        the polynomial ring. It CAN FAIL: a difference between the two would mean
        the enumerator is conditioning on something it should not be, which is
        exactly the bug the check exists to catch.
      - >-
        POSITIVE CONTROL (stage 0): planted polynomials built as
        c*(t-alpha)^5*(t-beta), c*(t-alpha)^4*(t-beta)^2 and
        c*(t-alpha)^3*(t-beta)^3 with alpha != beta. The classifier MUST assign
        each to its designed pattern. If it does not, the classifier is broken
        and no count may be reported.
      - >-
        GRADED CONTROL, >= 3 interior points: report the measured rank-0 fraction
        at p = 5, 7, 11 (and 13 if the enumeration fits the budget) against the
        predicted 3(p-1)/p^5, and report the ratio measured/predicted. The
        predicted sequence falls by a factor of about 3.6, 5.7 and 1.9 between
        consecutive primes, so a constant ratio across four sizes is a strong
        confirmation and a drifting ratio localises the error to a specific
        pattern.
      - >-
        CONTRADICTION-PRESERVING REPORTING (stage 2). If 9 independent sections
        are found, the record must report the contradiction with the relayed
        bound and must NOT silently prefer one side; if fewer than 8 are found,
        that is a failure to construct and not evidence that the rank is below 8.
    required_metrics:
      - measured pattern-class counts at each p, as exact integers, beside the closed form
      - the classifier's output on every planted control
      - verbatim quotations of Shioda-Tate and the j=0 Kodaira table with a locatable reference, or an explicit statement that they were not obtained
      - number of independent sections actually exhibited per sampled surface, with the group-law verification transcript

  falsification_conditions:
    - >-
      Measured squarefree fraction differing from 1 - 1/p at p = 5 or 7. The
      counting is wrong; withdraw the record.
    - >-
      Measured (5,1) + (4,2) + (3,3) fraction differing from 3(p-1)/p^5 at p = 5
      or 7. Same.
    - >-
      Any c(k) found to be odd. Step (5)'s collapse of "rank <= 1" to "rank = 0"
      is void and the rank-0 rate must be recomputed; the p^-4 framing may not
      survive.
    - >-
      A surface of this family exhibited with 9 provably independent sections.
      The relayed rank bound is then wrong for these surfaces, the census
      artifact's s >= 9 criterion was built on a false premise, and this
      proposal's rank framing collapses -- which would be the single most
      valuable outcome available here.
    - >-
      Evidence that the prescribed construction b = y^2 - x^3 is correlated with
      non-squarefree b at a rate growing with p. The p^-4 rate would then not
      apply under the attack's measure and the reframing is wrong in the
      direction that reopens the route.

  confounders:
    - >-
      RELAYED GEOMETRY. Two of the five derivation steps rest on model memory
      with no citation. That is the dominant risk and it is why the two
      combinatorial predictions are stated in a form that does not depend on
      them.
    - >-
      RATIONALITY. Whether every member of this family is a rational elliptic
      surface in the technical sense is asserted nowhere and is assumed by the
      relayed Shioda-Tate application. Members with b a sixth power are certainly
      not, and they are carried explicitly; whether other patterns also fail is
      unchecked.
    - >-
      GEOMETRIC VERSUS ARITHMETIC RANK. Everything above is about the geometric
      Mordell-Weil group over F_pbar(t). The attack needs F_p-rational sections,
      whose rank can be strictly smaller. Ignoring the difference would make the
      rank-0 rate an UNDERESTIMATE of the useful degeneration rate; the record
      states this and does not resolve it.
    - >-
      "DEPENDENT" IS NOT "SOLVABLE". Even at rank 0 the relation between the two
      sections is a torsion relation whose coefficients must be invertible modulo
      the order of P for the logarithm to follow. That is a further condition
      this proposal does not analyse, and it can only make the route harder, not
      easier -- which is stated so the reader knows the p^-4 rate is an upper
      bound on the useful rate.

  interpretation_limits:
    - >-
      Toy scale and one frozen isotrivial family. Nothing here closes candidate
      B2, function-field xedni, non-isotrivial families, number-field xedni, or
      lifting in general; the eleven forbidden sentences of DEC-20260724-021 are
      not asserted and the record must not be read as asserting them.
    - >-
      The p^-4 reframing is a statement about which rate BINDS on this family
      under a stated model of what the attack needs. It is not a no-go, it is not
      unconditional, and it is not independent of the relayed geometry.
    - >-
      Reporting the Gram-rank contradiction is not a finding against EV-XEDN-002
      or KN-FIND-003, both of which already warn that the Gram is diagnostic
      only. It is a request that the warning be replaced by a mechanism.
    - >-
      Nothing here is evidence of any kind. No run has happened; the session
      checks quoted (family counts, top-surface factorisations) are readings of a
      committed artifact performed outside the harness and must be reproduced
      in-harness before any record cites them.

  heuristic_assumptions:
    - id: HEUR-ICL-R1
      statement: >-
        The prescribed-point construction b := y(t)^2 - x(t)^3 induces a
        distribution on root-multiplicity patterns of b that agrees with the
        uniform distribution on degree-6 polynomials up to a factor bounded
        independently of p.
      rigorous_support: >-
        None. This is the load-bearing distributional assumption of the whole
        reframing and it is stated so it can be attacked. There is a concrete
        reason to doubt it: b is a difference of a square and a cube, so its
        repeated roots are the common roots of y^2 - x^3 and 2yy' - 3x^2 x', a
        resultant condition that need not have uniform density. A rigorous
        version would be a Chebotarev-type or resultant-density statement and
        this record does not have one.
      validation_plan: >-
        Exhaustive at p = 5 and 7: enumerate all (x, y) of the frozen degree
        shapes, form b, classify the pattern, and compare the induced
        distribution against the uniform one class by class. This is the same
        enumeration EXP-ICLIFT-290f2e already performs, so the marginal cost is a
        classifier, not a new pass.
      falsification_condition: >-
        A pattern class whose induced-to-uniform density ratio exceeds 2 at p = 7
        and grows at p = 11 and 13.
    - id: HEUR-ICL-R2
      statement: >-
        Two sections drawn from a rank-8 Mordell-Weil lattice without a designed
        relation are independent with probability 1 - o(1).
      rigorous_support: >-
        Standard for a rank-8 lattice under any reasonable model, and the
        proposal's conclusions are insensitive to the o(1). It is recorded
        because it is the step that turns "rank 8" into "no relation exists", and
        an unrecorded step there would be exactly the distinct-versus-independent
        conflation this proposal is complaining about.
      validation_plan: >-
        Measure, on sampled squarefree-b surfaces, the fraction of section pairs
        satisfying a verified group-law relation. Predicted small; a large value
        refutes the assumption and, incidentally, would be very interesting.
      falsification_condition: >-
        More than 5% of sampled section pairs on squarefree-b surfaces admitting
        a verified nonzero relation with the section pair not lying in a common
        automorphism orbit.

  target_complexity:
    exponent_moved: >-
      NONE is claimed, and this proposal states plainly what it does instead: it
      RELOCATES an exponent already on the ledger. The committed obstruction is a
      per-slot density of order p^-3; the derivation above argues that under the
      measure the attack actually uses, the binding rate is a rank-degeneration
      rate of order p^-4, i.e. the route is harder by one power of p than the
      record that closed it says. That is an exponent statement about an
      obstruction, not an improvement to any algorithm, and it must never be
      written up as an attack result. The reverse branch is the one that would
      move an exponent: if HEUR-ICL-R1 fails badly enough that the prescribed
      construction concentrates on degenerate b, the rank-0 rate under that
      measure could be far above p^-4 and the route reopens.
    memory_exponent: >-
      Of the checks, not of any attack: stage 0 is O(p^6) time and O(1) memory
      per polynomial with streaming classification -- 8.2e5 objects at p = 7,
      1.8e7 at p = 11. Stated so the cost is charged rather than omitted.
    best_known: >-
      For prime-field ECDLP the incumbent remains rho at O(sqrt(N)) with O(1)
      memory, which nothing here approaches or claims to. For the specific
      question "what rate binds the function-field xedni route", the incumbent is
      DEC-20260724-021's alpha = 3, and this proposal argues the binding rate is
      a different one; both are recorded, neither is retracted.
    hidden_overhead: >-
      In the rates: none, they are exact. In the argument: the two relayed
      geometric facts, which are the real overhead and are flagged as such
      throughout.

  dominated_by: >-
    n/a (no algorithm, no attack, no cost claim). Frontier rows checked before
    setting this: (time) rho / kangaroo at O(sqrt(N)) group operations for the
    ECDLP -- untouched; (memory) rho at O(1) versus the O(1)-streaming
    combinatorial checks proposed here, which are not an attack and are not
    offered as one; (data/queries) no oracle model is involved; (lifting
    frontier) the classical xedni coefficient-growth obstruction, which is a
    DIFFERENT obstruction and is neither superseded nor re-derived here;
    (this corpus) ECFG-P1543 and ECFG-P1547 in ledger/FINDING-PF-IC-001.md,
    which EV-XEDN-001 states this family neither supersedes nor adds to, and
    DEC-20260724-021's alpha = 3, which stands. Searched this corpus for a prior
    computation of the Mordell-Weil rank distribution over this family: none
    found; the only occurrence of the rank bound is the census artifact's relayed
    field. Absence of a search result is not evidence that nothing exists.
  sota_delta: >-
    Quantitatively: replaces a relayed inequality (rank <= 8, "literature; not
    recomputed here") with an exact distribution on the frozen family --
    Pr[rank = 8] = 1 - 1/p and Pr[rank = 0] = (3p-2)/p^5 -- at a cost of one page
    of counting and a p^6 enumeration at two primes. It also raises the binding
    exponent of the route's obstruction from 3 to 4 under a stated model, and it
    surfaces a live three-way contradiction (relayed r <= 8 versus measured Gram
    ranks 9-12 versus rationality) that no record currently reconciles. No
    attack, no speedup, no exponent improvement to any algorithm.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.9 that the two combinatorial forced values (1 - 1/p and 3(p-1)/p^5) survive
    exhaustive checking, because they are elementary counting with no free
    parameters and the pattern enumeration is short enough to be checked by hand.
    0.55 that the geometric half survives -- that every c(k) is even, that
    rank <= 1 collapses to rank = 0, and that the rank-0 rate is therefore the
    binding one. It is not higher because two load-bearing steps are model memory
    with no citation, because the corpus already contains a measured quantity
    (Gram ranks 9-12) that contradicts the relayed bound, and because the
    geometric-versus-arithmetic rank distinction is unresolved. It is not lower
    because the family is the simplest possible j = 0 Weierstrass family, because
    the fibre-at-infinity computation is elementary and independent, and because
    the census's own artifact independently records the same rank bound of 8.
    0.35 that HEUR-ICL-R1 holds tightly enough for the p^-4 statement to transfer
    to the prescribed measure without a correction; the difference-of-a-square-
    and-a-cube structure is a specific reason to expect a correction, and finding
    it is the useful outcome.
