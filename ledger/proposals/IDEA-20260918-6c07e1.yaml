idea:
  id: IDEA-20260918-6c07e1
  question_id: RQ-QSP-f9bbdb
  added: '2026-09-18'
  proposed_by: coordinator
  session: DEC-20260918-7e0865
  status: proposed
  title: >-
    A FROBENIUS-ORBIT CONGRUENCE CLOSES THE F_2-COEFFICIENT QUASI-SUBFIELD SHAPE
    AT n = 131 FOR EVERY n' IN [2, 129], WITH NO DEGREE BOUND. For lambda in
    F_2[X] the root set V of L = X^(2^n') + lambda(X) in F_(2^131) is stable
    under the 2-Frobenius, 131 is prime so every orbit has size 1 or 131, hence
    |V| = a + 131b with a in {0,1,2}; complete splitting demands |V| = 2^n'
    exactly; and 2^n' mod 131 lands in {1, 2} only at n' in {1, 130, 131},
    because ord_131(2) = 130. So no F_2-coefficient quasi-subfield polynomial
    splits completely over F_(2^131) at any n' in [2, 129], whatever deg lambda
    is -- and the three permitted values are exactly where the literature's
    known complete splitters already sit
  class: mechanism

  mechanism: >-
    OBJECT FRAME. Representation: the root set V = {x in F_(2^131) :
    x^(2^n') = lambda(x)} of a quasi-subfield polynomial with lambda in
    F_2[X], viewed as a SUBSET OF THE FIELD carrying an action, not as a
    subspace. Operation set Sigma = {sigma}, the single 2-Frobenius, which
    acts on V because lambda has F_2 coefficients and therefore commutes
    with squaring. Attack stage: factor-base EXISTENCE, upstream of
    membership, decomposition and linear algebra -- the mechanism decides
    whether the factor base can exist at all, and so charges no stage cost.
    TRICHOTOMY PLACEMENT: Class I, a genuine invariant of the object. The
    quantity |V| mod 131 is independent of the field's polynomial-basis
    representation, of the curve, and of any solver; it is fixed by the
    orbit structure of sigma on F_(2^131) alone.
    THE MECHANISM IN ONE LINE: Frobenius-stability QUANTIZES |V| to the
    residues {0, 1, 2} mod 131, complete splitting DEMANDS |V| = 2^n'
    exactly, and ord_131(2) = 130 places 2^n' outside those residues for
    every n' in [2, 129]. Existence is refused by a counting incompatibility
    between two numbers, with no appeal to the degree of lambda.
    LOSSY-PROJECTION TEST against Sigma = {sigma}: the projection
    V -> |V| mod 131 is lossy (it discards which elements lie in V and all
    of the orbit labels) and the retained part propagates deterministically
    (sigma maps V to V, so the residue is sigma-invariant by construction).
    Both clauses of docs/inventor-protocol.md section 2 hold, which is why a
    single congruence can carry a non-existence conclusion.
    WHAT THE MECHANISM CANNOT REACH, and this bounds it sharply: it sees
    only the EXACT cardinality. A factor base of size 2^n' - 1, or any
    almost-complete splitting in the sense of Lemma C.2 of KN-LIT-0a321c, is
    a different integer and passes the congruence freely. See scope_limits
    S1. The mechanism also dies the moment lambda acquires a coefficient
    outside F_2, because then lambda(x)^2 is not lambda(x^2) and sigma no
    longer acts on V at all (scope_limits S2).

  claim: >-
    (A) FROBENIUS STABILITY OF THE ROOT SET. Let lambda in F_2[X] and
    L = X^(2^n') + lambda(X) over F_2, and let
    V = {x in F_(2^131) : L(x) = 0}. Because lambda has F_2 coefficients,
    lambda(x)^2 = lambda(x^2) for every x. So if x^(2^n') = lambda(x) then
    (x^2)^(2^n') = (x^(2^n'))^2 = lambda(x)^2 = lambda(x^2), i.e. x^2 lies in V.
    V is therefore stable under the 2-Frobenius sigma : x -> x^2. (Equivalently
    and more briefly: L is an F_2-polynomial, so its root set in any extension of
    F_2 is Galois-stable. The squaring computation is given because it is the
    form the rest of the argument uses.)
    (B) THE ORBIT COUNT. 131 is PRIME, so Gal(F_(2^131) / F_2) is cyclic of
    prime order 131 and every sigma-orbit on F_(2^131) has size 1 or 131. The
    fixed points of sigma are exactly the solutions of x^2 = x, i.e. the two
    elements of F_2. Hence
        |V| = a + 131 b,   a = #(V intersect F_2) in {0, 1, 2},   b >= 0.
    (C) WHAT COMPLETE SPLITTING DEMANDS. A quasi-subfield polynomial in the sense
    of KN-LIT-0a321c "splits completely" over F_(2^131) exactly when
    L | X^(2^131) - X, equivalently when all deg L = 2^n' of its roots lie in
    F_(2^131) and are distinct, i.e. |V| = 2^n' EXACTLY. (See the scope limits:
    this is the EXACT condition, not the "approximately 2^n' roots" variant.)
    (D) THE CONGRUENCE. Combining (B) and (C), complete splitting forces
        2^n' = a + 131 b, i.e. 2^n' = a (mod 131) with a in {0, 1, 2}.
    2 is a unit mod 131, so 2^n' = 0 (mod 131) is impossible and a = 0 is
    excluded. ord_131(2) = 130, verified below. Therefore
        2^n' = 1 (mod 131)  iff  130 | n',
        2^n' = 2 (mod 131)  iff  n' = 1 (mod 130).
    Within n' in [1, 131] that permits exactly
        n' in {1, 130, 131}
    and nothing else.
    (E) THE CONCLUSION. NO F_2-COEFFICIENT QUASI-SUBFIELD POLYNOMIAL SPLITS
    COMPLETELY OVER F_(2^131) AT ANY n' IN [2, 129], WHATEVER deg lambda IS.
    The argument never mentions deg lambda, so no degree bound is used and none
    is needed; it is a statement about the arithmetic of 131, not about the
    polynomial's size.

  baseline_reproduction: >-
    THIS IS THE PROPOSAL'S STRONGEST SUPPORT AND IS STATED FIRST FOR THAT REASON.
    THE PERMITTED SET {1, 130, 131} IS EXACTLY WHERE THE LITERATURE'S COMPLETE
    SPLITTERS SIT AT n = 131, so the congruence REPRODUCES the known
    classification rather than contradicting it:
      - n' = 1: X^2 + X, whose root set is F_2 -- the subfield case, |V| = 2.
        Permitted: 2^1 = 2 = a with a = 2, b = 0.
      - n' = 130: the Type 1bis polynomial L_Phi131 of Proposition 2 of
        KN-LIT-4fe9d2, the linearized F_2-coefficient QSP associated with
        Phi_131(X) = (X^131 - 1)/(X - 1), of degree 2^130 and beta about 1.
        Permitted: 2^130 = 1 (mod 131), so |V| = 1 + 131b is consistent with
        |V| = 2^130.
      - n' = 131: the whole field, the trivial case. Permitted: 2^131 = 2.
    Proposition 2 of KN-LIT-4fe9d2 states that an F_2-coefficient LINEARIZED
    quasi-subfield polynomial splits completely over F_(2^n) exactly when its
    associated F_2-polynomial divides X^n - 1; at n = 131 prime with
    ord_131(2) = 130 that leaves precisely the two nontrivial cases above. The
    congruence derived here is a DIFFERENT argument reaching a SUPERSET of the
    same answer: it permits {1, 130, 131} without assuming lambda is linearized,
    and Proposition 2 fills in that within the linearized family those are
    attained. An argument that excluded n' = 130 would be refuted by a published
    example; it does not.
    RESIDUES USED, ALL MODULO 131, ALL COMPUTED BY HAND IN THIS SESSION AND
    RECORDED SO A REVIEWER CAN CHECK EACH IN ONE LINE:
      2^1   = 2
      2^10  = 107      (1024 - 7*131)
      2^11  = 83
      2^13  = 70       (8192 - 62*131)
      2^18  = 13
      2^22  = 77       (83^2 = 6889 - 52*131)
      2^26  = 53       (70^2 = 4900 - 37*131)
      2^33  = 103      (53 * 128 = 6784 - 51*131)
      2^44  = 34       (53 * 13 = 689 - 5*131)
      2^65  = 130 = -1
      2^66  = 129 = -2 (= 103^2 = 10609 - 80*131)
      2^130 = 1        (Fermat)
      2^131 = 2
    ord_131(2) = 130 BECAUSE 130 = 2 * 5 * 13 and the three maximal proper
    divisors all fail: 2^65 = 130 != 1, 2^26 = 53 != 1, 2^10 = 107 != 1. The
    three cells RQ-QSP-f9bbdb singles out as the Lemma 4.1 best case --
    n' in {33, 44, 66}, where 131 = -1 mod n' -- give 103, 34 and 129, none of
    which is in {1, 2}. So those three cells are excluded by this argument too,
    on a ground entirely independent of the injection bound that excluded them
    empirically.

  scope_limits: >-
    STATED AS PROMINENTLY AS THE CLAIM, BECAUSE THE PROPOSAL IS WORTH ONLY WHAT
    IT ACTUALLY COVERS.
    (S1) IT CLOSES *EXACT* COMPLETE SPLITTING ONLY. Definition 2 of
    KN-LIT-4fe9d2 admits a second regime -- L "splits almost completely", with
    |V| approximately 2^n' rather than equal to it (Lemma C.2 of KN-LIT-0a321c).
    THE CONGRUENCE PASSES THAT REGIME FREELY: |V| = a + 131b with b about
    2^n'/131 satisfies the orbit count for any a, and 2^n' - (a + 131b) can be
    made small without being zero. So an index calculus that needs only
    |V| ~ 2^n' is NOT touched by this argument at all. What governs that case is
    the injection / degree bound of H-QSP-645a07, not this. Any reading of this
    proposal as closing the quasi-subfield line is wrong, and
    DEC-20260917-793ae2's revisit_conditions already record that the line is not
    closed and must not be reported as closed.
    (S2) F_2 COEFFICIENTS ONLY. Step (A) uses lambda(x)^2 = lambda(x^2), which
    holds exactly because lambda's coefficients are fixed by squaring. For
    lambda with coefficients in K = F_(2^131) the premise FAILS -- lambda(x)^2 is
    lambda^(sigma)(x^2), not lambda(x^2) -- so V need not be Frobenius-stable and
    the orbit decomposition (B) does not apply. K-coefficient lambda at n = 131
    are untouched by this and remain, per DEC-20260917-793ae2's
    revisit_conditions, one of the places an F1 counterexample would most
    plausibly live.
    (S3) IT BOUNDS NOTHING ABOUT NON-ROOT-SET FACTOR BASES. The argument is
    about the root set of a single polynomial X^(2^n') + lambda(X). A factor base
    that is not such a root set -- the third survivor named in
    DEC-20260917-793ae2 -- is outside it entirely, as are the correspondence
    shapes of IDEA-20260916-a17f43 and rational lambda.
    (S4) A NORMALISATION ASSUMPTION IS BEING MADE AND MUST BE CHECKED. Step (C)
    reads "deg L = 2^n'", which holds under the quasi-subfield normalisation
    deg lambda < 2^n'. If deg lambda > 2^n' then deg L = deg lambda and complete
    splitting means |V| = deg lambda, so the congruence becomes
    deg lambda = a (mod 131) -- a real constraint but a different one, and this
    proposal does NOT claim that case. The reviewer is asked to confirm the
    normalisation against Definition 3.1 of KN-LIT-0a321c; if it does not hold,
    (E) is scoped to deg lambda < 2^n' and nothing else changes.
    (S5) NO ATTACK, NO EXPONENT, NO CURVE. This is arithmetic about a field, not
    a computation on a group. Nothing here touches rho's 2^60.9 on ECC2K-130
    (KN-LIT-096) and nothing here concerns any deployed parameter.

  why_it_matters: >-
    DEC-20260917-793ae2 scopes RQ-QSP-f9bbdb's negative answer to "THE 732
    ENUMERATED CANDIDATES AND ON NOTHING ELSE" -- an exhaustive census at
    n' in {33, 44, 66} over non-linearized F_2-coefficient lambda of degree
    3..7, and a scoped claim that says in terms it establishes nothing outside
    that enumeration. IF THIS ARGUMENT HOLDS, the same negative extends, for
    F_2-coefficient lambda and for EXACT complete splitting, to EVERY
    n' in [2, 129] AND EVERY DEGREE, at zero compute -- from 732 enumerated
    candidates to an infinite family, by a three-line congruence instead of a
    census. That is why it goes to an adversary before it goes anywhere else:
    an argument that cheap, extending a negative that far, is either right or
    wrong in a way a careful reader can see in an hour, and the program has
    already recorded one Coordinator arithmetic inference being overturned by
    exactly such a read (DEC-20260917-793ae2 prior_calibration).
    It also changes what the replication contract of TASK-20260918-53664e should
    prioritise if it holds: the uncovered cells n' = 3..14 would be predicted
    EMPTY of complete splitters a priori, so a complete splitter found there
    would be a refutation of this argument rather than a discovery about
    quasi-subfield polynomials -- which makes the census a sharper instrument,
    not a redundant one.

  novelty_status: unverified

  novelty: >-
    STATED HONESTLY, AND HALF OF THIS IS NOT NEW.
    THE COUNTING HALF IS ALREADY IN THIS CORPUS, VERBATIM. The decomposition
    |V| = a + 131b with a in {0,1,2} appears in
    coordination/investigations/QSP-ECC2K130/tasks/TASK-20260917-5fa7d5/report.md
    section 4, where it is used ONLY as a null model and a histogram
    cross-check -- the blind re-derivation's orbit structure [1, 131] and its
    Poisson null for orbit-carrying lambda. It is echoed in EV-QSP-a6aa4b, in
    experiments/EXP-QSP-33b442/analysis.md and in KN-FIND-617d78. This proposal
    CLAIMS NONE OF THAT AS NEW.
    WHAT IS ABSENT FROM EVERY RECORD IS THE CONSEQUENCE. No record in this
    program draws the step from "root counts are congruent to a mod 131" to
    "complete splitting is therefore IMPOSSIBLE for n' in [2, 129]". The orbit
    count was used to describe observed data; it was never turned around and
    used as an exclusion. The contribution claimed here is exactly the joining
    of the two halves -- the counting identity, which is prior work of this
    program's own review round, and the residue computation 2^n' mod 131, which
    is elementary -- into an exclusion. That joining step is what
    TASK-20260918-190055 must attack.
    AGAINST THE EXTERNAL LITERATURE: UNVERIFIED. Proposition 2 of KN-LIT-4fe9d2
    settles the LINEARIZED F_2-coefficient case by a divisibility criterion, and
    the conclusion at n = 131 agrees; whether the non-linearized exclusion by
    orbit congruence is stated anywhere in the quasi-subfield literature has NOT
    been checked by this session, which had no shell and ran no retrieval query.
    `unverified` is the honest label, not a defect.

