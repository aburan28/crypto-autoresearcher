  assumptions:
    - >-
      131 is prime. Used in (B) to force every Frobenius orbit to have size 1 or
      131, and it is the load-bearing arithmetic fact of the whole argument. At a
      composite n the orbit sizes are the divisors of n and the congruence
      becomes a system over those divisors, which is weaker and is not claimed.
    - >-
      lambda has coefficients in F_2 (see S2). Without it (A) fails.
    - >-
      deg L = 2^n', i.e. deg lambda < 2^n' (see S4). This is the quasi-subfield
      normalisation and is an ASSUMPTION of this record, flagged for the
      reviewer rather than asserted.
    - >-
      "Splits completely" means |V| = deg L exactly, with distinct roots. If a
      source instead uses "L divides X^(2^n) - X" the two coincide, because that
      divisibility both places all roots in F_(2^n) and forces them distinct.
      This equivalence is used in (C) and is cheap to check.

  proof_search_map:
    bottleneck: >-
      Deciding whether a complete splitter exists at a given n' currently costs
      a root count: a gcd of X^(2^131) - X with a polynomial of degree 2^n',
      which at n' = 33 is the 2^33-scale computation RQ-QSP-f9bbdb budgeted and
      which IDEA-20260916-3f7a1c already reduced to degree d^4 per candidate.
      This proposal removes the computation entirely for the exact-splitting
      question: the answer depends on n' alone, through 2^n' mod 131, and not on
      lambda at all.
    baseline_embedding:
      parameter_slice: >-
        Proposition 2 of KN-LIT-4fe9d2 at n = 131, which classifies the
        F_2-coefficient LINEARIZED complete splitters as exactly n' in {1, 130}
        (plus the trivial n' = 131). This argument must PERMIT all three and may
        not exclude any.
      reproduction_check: >-
        SYMBOLIC, ZERO COMPUTE, AND IT IS THE PROPOSAL'S MANDATORY SELF-TEST.
        Evaluate 2^n' mod 131 at n' = 1, 130, 131 and confirm the values 2, 1, 2,
        all in {1, 2}, hence all PERMITTED. An argument that excluded n' = 130
        would contradict a published example and would be refuted on the spot.
        Second slice, at a different n where a complete splitter is also known:
        Type 2 at (n, n') = (7, 3) with lambda = X^2 + X, |V| = 8 = 2^3. Here
        7 is prime, orbits have size 1 or 7, and 8 = 1 + 7*1 -- so a = 1, b = 1,
        and 2^3 = 8 = 1 (mod 7) is permitted, as it must be. The same check at
        (31, 15): 2^15 mod 31 = 1 (ord_31(2) = 5 and 5 | 15), permitted. THE
        ARGUMENT PASSES EVERY KNOWN COMPLETE SPLITTER THE PROGRAM HAS RECORDED.
    observation_collision:
      observable: >-
        The residue 2^n' mod 131, an integer in [1, 130], and the derived
        predicate "in {1, 2}".
      distinct_preimage_search: >-
        The observable depends on n' ALONE and is blind to lambda entirely --
        every lambda of every degree at a given n' has the same residue. That is
        the argument's strength (it needs no census) and simultaneously its
        limit: it can never distinguish two lambda, never locate a splitter, and
        never say anything about the size of |V| beyond its residue class. The
        dangerous collision to look for is the reverse: an n' in [2, 129] at
        which 2^n' mod 131 happens to be 1 or 2 by an arithmetic slip. There is
        none, because ord_131(2) = 130 makes n = 2 -> 2^n' = 2 solvable only at
        n' = 1 mod 130 and 2^n' = 1 only at n' = 0 mod 130, but that is exactly
        the step a reviewer should recompute independently.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the root COUNT by its residue class mod n, for n prime: the
          map V -> |V| mod n is a Galois-theoretic invariant of any
          F_2-polynomial's root set in F_(2^n), taking values in {0, 1, 2}, and
          complete splitting pins it to 2^n' mod n. The invariant is free to
          compute and is defined for every n' and every degree simultaneously.
        predicted_gain: >-
          The exact-splitting question at n prime collapses from a per-candidate
          computation to a single modular exponentiation per n'. At n = 131 the
          excluded range is [2, 129], i.e. 128 of the 131 values of n'.
      - transform: specialization_pack
        proposed_object: >-
          The same invariant at every prime n, which turns the exclusion into a
          family: for n prime, an F_2-coefficient complete splitter of the shape
          X^(2^n') + lambda requires n' = 0 or 1 modulo ord_n(2). This is
          checkable against every complete splitter in the program's records
          (see reproduction_check) and is where the connection to
          IDEA-20260918-9abf42 lies -- both arguments turn on ord_n(2).
        predicted_gain: >-
          Converts a target-specific negative into a statement about which n
          could host an F_2-coefficient complete splitter at a useful n' at all,
          which is a design input for any ladder over n.
    quantifier_order: >-
      FORALL n' in [2, 129], FORALL lambda in F_2[X] with deg lambda < 2^n':
      the polynomial X^(2^n') + lambda(X) does NOT split completely over
      F_(2^131). The quantifier over lambda is genuinely universal and carries no
      degree bound and no coefficient-set restriction beyond F_2; there is no
      existential witness anywhere in the statement, and no instance, seed or
      parameter choice enters. The weaker reading "for each lambda there is some
      obstruction" is NOT what is claimed -- the obstruction is one integer,
      2^n' mod 131, and it is the same for every lambda at that n'.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For n prime and lambda in F_2[X] with deg lambda < 2^n', the polynomial
        X^(2^n') + lambda(X) splits completely over F_(2^n) only if
        2^n' = 1 or 2 (mod n)." That is the whole of it. It certifies NOTHING
        about: approximate splitting (S1), K-coefficient lambda (S2), non-root-set
        factor bases (S3), composite n, or the SIZE of |V| at any excluded cell --
        an excluded n' may still have |V| = 132 or |V| = 0 and this argument
        cannot tell which. It also certifies no existence: at n' in {1, 130} it
        permits, and permission is not construction.
      nearby_object_control: >-
        TWO, AND THE FIRST IS BLOCKING. (i) NON-EXCLUSION AT n' = 130: the
        argument MUST NOT exclude n' = 130, where Type 1bis L_Phi131 is a
        published complete splitter. If a reviewer's reconstruction of the
        argument excludes it, the argument is wrong -- this is the
        proves-too-much control, an object for which the conclusion is KNOWN
        FALSE, and it is the cheapest possible refutation route. Likewise at
        (7, 3) and (31, 15). (ii) NULL OBJECT: a general F_2-polynomial of
        degree 2^n' that is NOT of quasi-subfield shape is also Galois-stable
        and also obeys |V| = a + 131b, so the congruence alone does not
        distinguish the quasi-subfield shape from any F_2-polynomial. That is
        correct and is the point -- the exclusion comes from complete splitting
        demanding |V| = 2^n', not from the shape -- but it means the argument
        carries NO information about the quasi-subfield structure as such, and
        any claim that it does is an overreach.
    proof_obligations:
      - claim: lambda(x)^2 = lambda(x^2) for lambda in F_2[X].
        responsibility: correctness
      - claim: >-
          V is stable under x -> x^2, hence a union of Frobenius orbits.
        responsibility: correctness
      - claim: >-
          For n = 131 prime, every Frobenius orbit on F_(2^131) has size 1 or
          131, and the size-1 orbits are exactly the two elements of F_2.
        responsibility: correctness
      - claim: >-
          Complete splitting of L over F_(2^131) is equivalent to |V| = deg L,
          and deg L = 2^n' under deg lambda < 2^n'.
        responsibility: interface
      - claim: ord_131(2) = 130.
        responsibility: correctness
      - claim: >-
          2^n' mod 131 lies in {1, 2} for n' in [1, 131] exactly at
          n' in {1, 130, 131}.
        responsibility: correctness
      - claim: >-
          The permitted set contains every complete splitter recorded in this
