idea:
  id: IDEA-20260808-3da739
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-39f231
  goal_id: GOAL-SQISIGN-002
  title: 'The named obstruction the published-data audit needs is PROVENANCE, not quantity:
    the higher-dimensional designs must publish torsion images or the verifier cannot evaluate
    the response, so the Kani ingredient is present in quantity and the whole separation from
    SIDH rests on whose kernel those images are images under.'
  class: mechanism
  claim: 'GOAL-SQISIGN-002 asks for a NAMED obstruction rather than a screening count. CLAIM:
    the obstruction is not "SQIsign publishes no torsion images" -- the post-redesign construction
    builds its response out of higher-dimensional isogenies and a verifier must be able to
    evaluate the response, which forces the publication of enough torsion data to determine
    it. The obstruction is that every published image is an image under an isogeny that is
    ALREADY PUBLIC (the response, or a challenge-derived map), not under the secret key isogeny.
    Kani''s template needs images of a torsion basis under the isogeny it is trying to recover;
    images under a map the attacker already knows are worth nothing, because the attacker
    can compute them. FALSIFIABLE FORM: define, for each published point P_i of the signature,
    its PROVENANCE as the isogeny under which it is an image. The audit fires if and only
    if some published point''s provenance is an isogeny whose kernel is secret-dependent AND
    whose degree exceeds the available torsion level, in the sense of Kani''s embedding condition.
    The audit is a finite check over the specification''s published symbols.'
  mechanism: 'Kani''s lemma embeds an isogeny phi of degree d into a 2-dimensional isogeny
    of degree N when N - d is representable and the N-torsion images of phi are known; the
    SIDH break consumes exactly that. The redesign''s defence is usually reported as "no auxiliary
    torsion information". This record''s mechanism is to replace that sentence by a provenance
    graph: nodes are published symbols, edges are "is an image under", and the audit is a
    reachability query -- is any secret-dependent isogeny labelled by enough published images?
    The audit''s power comes from being a graph query on a finite inventory, not from a search
    over attack instantiations, and it therefore terminates with a definite answer.'
  why_not_a_renamed_known_approach: Catalogue B3-3 grades disclosure by the continuous ratio
    rho = (torsion)/(degree); B3-2 asks which lossy views of the torsion channel still propagate;
    IDEA-20260805-c4ae3d observes that SQIsign KeyGen EVALUATES the secret isogeny at some
    points. This record differs by making the decisive variable CATEGORICAL (whose kernel)
    rather than continuous (how much torsion), which is what turns an open-ended screen into
    a terminating audit, and by supplying the graph formulation that makes completeness checkable.
  predictions:
  - observable: the provenance graph of the published surface
    metric: for each published point, the isogeny it is an image under, and whether that isogeny's
      kernel is secret-dependent
    predicted: Every published image has public-isogeny provenance. If any has secret-dependent
      provenance the audit fires and the finding is major. NOT ASSERTED -- the specification
      has not been read.
  - observable: the null control mandated by GOAL-SQISIGN-002 criterion 3
    metric: does the audit fire on a weakened variant that additionally publishes images of
      the KEY isogeny at level N > d?
    predicted: FIRES. Required. Until it fires no inapplicability conclusion may be recorded.
  - observable: Kani's numeric condition on the weakened variant
    metric: N - d representable as a sum of two squares / N smooth and N > d
    predicted: Satisfiable by construction in the weakened variant; the record must exhibit
      the concrete (N, d) pair used.
  minimal_test: 'STAGE 1 (reading, no compute, currently BLOCKED): obtain the Round-3 specification
    and build the provenance graph. STAGE 2 (toy, cheap): build the null control -- a deliberately
    weakened variant of the surrogate that publishes key-isogeny torsion images at level N
    > d -- and run the audit against it, requiring it to fire. STAGE 3: run the audit against
    the real inventory. THE ORDER IS BINDING: GOAL-SQISIGN-002.next_action states that an
    audit which has only ever returned "does not apply" is untested instrumentation.'
  controls:
  - 'NULL CONTROL THAT MUST FIRE: the weakened variant. This is the goal''s own criterion
    3 and it is not optional.'
  - 'NEGATIVE CONTROL: a variant that publishes MORE torsion images but all under public isogenies.
    The audit must NOT fire, distinguishing quantity from provenance -- this is the control
    that establishes the record''s central claim rather than assuming it.'
  - 'COMPLETENESS CONTROL: the byte-budget completeness certificate of IDEA-20260805-244f78
    (the specification states the signature''s exact byte length, so an inventory that does
    not account for every byte is incomplete). The provenance graph must cover 100 per cent
    of the signature bytes.'
  confounders:
  - An inventory omission invalidates everything downstream; GOAL-SQISIGN-002 directs the
    Red Team at completeness specifically for that reason.
  - '''Secret-dependent'' is not binary in a Fiat-Shamir protocol: a challenge-derived map
    depends on the message and the commitment, both public, but its COMPOSITION with the secret
    may not be. The audit must classify compositions, not just atoms, and that is where it
    is most likely to be wrong.'
  - The higher-dimensional response may publish a kernel generator rather than torsion images,
    which is a different disclosure shape the provenance graph must be able to represent.
  falsification_conditions:
  - The null control does not fire -- the audit is untested instrumentation and no conclusion
    may be recorded.
  - The negative control fires -- provenance is not the operative variable and the record's
    central claim is wrong.
  - The provenance graph cannot be built because some published symbol has no identifiable
    provenance, which is itself a finding and must be recorded rather than papered over.
  interpretation_limits: 'The expected and most valuable outcome is NEGATIVE and precise:
    a named obstruction with forward guidance stating what a variant would have to publish
    for the obstruction to fall. Claim tier toy for all attack behaviour. No statement about
    SQIsign may be made before the specification is read; everything above is a design for
    an audit, not its result.'
  assumptions:
  - Kani's lemma and the glue-and-split template as recorded in KN-TECH-026.
  - That the signature's byte budget is stated in the specification (IDEA-20260805-244f78's
    premise).
  heuristic_assumptions:
  - id: HB-4
    statement: PROVENANCE SUFFICIENCY. Torsion images under a publicly computable isogeny
      confer no advantage to the Kani template, because the attacker can recompute them from
      public data at polynomial cost.
    rigorous_ingredient: 'The efficient-representation universality of Definition 2.1 / the
      interpolation representation (frozen source lines 107-111): any isogeny with an efficient
      representation can be evaluated at any point in polynomial time, so its images are free.'
    distribution_imitated: Not a distribution assumption; it is a computability assumption,
      and the record labels it as such rather than dressing it as a heuristic about randomness.
      It is listed here because it is the load-bearing unproved step.
    validation_route: 'Directly checkable at toy scale: give the attacker the public isogeny''s
      efficient representation, have it recompute the published images, and verify byte equality.
      If any published image cannot be recomputed, its provenance is not what the inventory
      claims.'
    tail_checks: Check at the extremes -- the smallest and largest published torsion level
      -- where a recomputation shortcut is most and least likely to exist.
  target_complexity:
    time_exponent: 'n/a for the audit. For the attack template it screens: Kani-based recovery
      is polynomial when its ingredient is present, against the p^{1/3+o(1)} conditional baseline
      when it is absent. That gap is the reason the audit matters.'
    memory_exponent: n/a for the audit; polynomial for the template.
    best_known_baseline: p^{1/3+o(1)} conditional key recovery (KN-TECH-058); the SIDH break
      is polynomial and is the cautionary exemplar, not a target (GOAL-SSI-001 charter keeps
      SIDH out of scope as a positive target).
    hidden_overhead_disclosure: None for the audit.
    time_memory_tradeoff: n/a.
  sota_delta: Zero. The deliverable is a named obstruction plus a null control that fires,
    replacing a sentence that currently carries most of SQIsign's post-SIDH confidence.
  dominated_by: n/a (no result claimed).
  estimated_cost: Implementation medium (provenance graph plus a weakened variant at toy scale).
    Compute low. BLOCKED on document access for the deciding stage.
  recommended_priority: high
  honest_prior_of_survival: 0.7 that provenance is the right categorical variable. 0.5 that
    the null control can be built cheaply enough to fire within budget -- constructing a weakened
    variant that genuinely admits the Kani template at toy scale is real work, and this program
    has a documented history of controls that structurally cannot fail (GD-9, GD-10).
  novelty_status: unverified
  novelty_screen: 'Screened against all six dedup files and S1.yaml. Nearest: IDEA-20260805-c4ae3d,
    IDEA-20260805-244f78, IDEA-20260805-2acde5, catalogue B3-1..B3-8. External literature
    not screened (web unreachable); the provenance distinction may be explicit in the SQIsign
    security analysis.'
  discriminated_from: B3-3's rho is continuous and quantity-based; this is categorical and
    provenance-based. IDEA-20260805-c4ae3d records that KeyGen evaluates the secret isogeny;
    this record turns that observation into a graph query over the whole published surface
    with a mandated firing null.
