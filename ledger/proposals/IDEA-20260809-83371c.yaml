idea:
  id: IDEA-20260809-83371c
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    Instrument the transcript: record the exact bytes entering every challenge and
    diff them against a declared specification
  class: tooling
  claim: >-
    Most of the difficulty in this vulnerability class is that nobody can see what
    actually went into a challenge. The claim is that an instrumentation layer
    recording the exact byte sequence hashed for each challenge, together with a
    declarative specification of what SHOULD be hashed, reduces the check to a
    diff — and that this diff catches every omission in the enumeration, including
    encoding ambiguities that a dataflow criterion would pass.
  mechanism: >-
    Wrap the hash interface so every absorb call records its bytes and provenance
    tag. At the end of a proof, the recorded sequence is compared against the
    specification's expected sequence, with any difference reported positionally.
  why_not_a_renamed_known_approach: >-
    Logging and golden-file testing are standard engineering. The contribution is
    the pairing with a DECLARATIVE transcript specification, which makes the
    expected sequence an artifact that can be reviewed independently of the code
    producing it — and the observation that this catches encoding ambiguity, which
    the static criterion does not.
  predictions:
  - observable: omissions caught by the diff versus by the static criterion
    metric: two counts over the enumeration
    predicted: >-
      The diff catches everything the criterion catches, plus encoding
      ambiguities. If the criterion catches something the diff does not, the two
      are complementary and both should be used, which is also a useful finding.
  - observable: overhead of instrumentation
    metric: ratio of instrumented to plain proving time
    predicted: Small enough for test builds; large overhead would confine the tool to testing, which is where it is intended anyway.
  minimal_test: >-
    Instrument the reference protocols, write transcript specifications, run over
    every instantiation in the enumeration, and report what each method catches.
  controls:
  - 'SPECIFICATION INDEPENDENCE: the transcript specification is written from the protocol description, not derived from the implementation, or the diff is comparing the code to itself.'
  - 'ENCODING-AMBIGUITY FIXTURE: a deliberately ambiguous encoding is included to confirm the diff catches it.'
  falsification_conditions:
  - The diff misses an omission the enumeration contains.
  - Specifications cannot be written independently of the implementation without ambiguity, which would mean the approach reduces to self-comparison.
  interpretation_limits: >-
    A passing diff means the implementation matches a specification, not that the
    specification is sound. Both failure modes exist and the record says so.
  sota_delta: 'No attack. Delta: a reviewable transcript artifact and a check that covers encoding, which the criterion does not.'
  dominated_by: Complements IDEA-20260809-7c0817; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for transcript instrumentation: no records. WEB NOT CHECKED.'
  source_refs:
  - Protocol specifications under test -- REQUIRED READS.
