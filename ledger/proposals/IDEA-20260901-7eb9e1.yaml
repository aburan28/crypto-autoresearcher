  assumptions:
    - >-
      A1. The hybrid's total cost decomposes as T_reduce(beta*(g)) + 2^(c g) * poly
      with the two terms additive and the guess block re-usable across nothing
      else -- the memory-free enumeration hybrid's own accounting. Any hidden
      per-guess cost exponential in the tail block (e.g. a verification step
      that is not O(d^2)) breaks the decomposition and is checked in Stage 4.
    - >-
      A2. Progressive BKZ with one tour per rung and nearest-plane after each
      rung defines beta*(g) reproducibly; GOAL-MLKEM-005's committed finding
      that d = 512 cells need 100-bit precision (BATCH-279acb, KN-FIND-ead2ac)
      is inherited, and Stage 2 stays at d <= 321 (n = 160) where 53-bit
      precision has been demonstrated adequate, or bisects precision as that
      goal did.
    - >-
      A3. THE w-CONVENTION. The scout table reads w as the support size
      2 eta + 1. If the paper defines w otherwise the table is recomputed at
      Stage 1(a) before any Stage 2 cell is dispatched, and no number from (B)
      or (D) may be quoted until then.
    - >-
      A4. Bernstein's n is the total secret dimension, so the module rank
      enters only through n = 256 k. If the paper's LPR setting forces a ring
      of dimension n, the mapping to ML-KEM's rank-k module is a transfer
      assumption stated in Stage 1(a); nothing in Stage 2 depends on it, since
      Stage 2 measures K on module-shaped instances directly.
  proof_search_map:
    bottleneck: >-
      The single constant K in H0 = K/(K + c). Every hybrid variant's exponent
      gain at ML-KEM is a monotone function of it; halving the uncertainty in K
      halves the uncertainty in the lane's worth for every engine at once.
    baseline_embedding:
      parameter_slice: >-
        g = 0, which is exactly the plain primal attack; and, at the formula
        level, c -> infinity, which sends H0 -> 0 and recovers 2^((rho+o(1))n).
      reproduction_check: >-
        Symbolic: H0(c -> infinity) = 0 on paper. Numeric: Stage 1(b)'s g = 0
        estimator call must return the committed primal_bdd figures under the
        same pinned commit, and Stage 2's beta*(0) must land on the program's
        committed reduced-dimension primal cells where matched. A frozen
        fixture records both.
    observation_collision:
      observable: "beta*(g), and the fitted slope K."
      distinct_preimage_search: >-
        Two different reductions -- different tour schedules, different
        pre-processing, different strategies files -- can give the same beta*(g)
        at g = 0 and different slopes, because the slope depends on how the
        tail of the profile responds to a shrinking dimension. That is a
        genuine collision on the g = 0 observable and it is why the strategies
        file is content-bound and why beta*(g) is reported per seed rather
        than as a pooled mean. The separating condition is the full curve, not
        its intercept.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The two-term cost 2^(rho n - K g) + 2^(c g) with K measured rather
          than asserted, packed over the three engines c in {2.32, 1.16, 0.36}
          as disjoint rows with memory charged per row.
        predicted_gain: >-
          A bracket for the memory-free row of [2.4, 16.6] bits at ML-KEM-768
          under the law, collapsing to a single number once K_meas is in hand;
          the meet-in-the-middle rows are predicted to be reversed by the
          T*M^(1/3) charge at every K in the bracket.
      - transform: boundary_lift
        proposed_object: >-
          Lift the g = 0 primal baseline through g = 4, 8, ..., 32 and prove a
          STRICT inward improvement in beta* per step, not merely feasibility.
        predicted_gain: >-
          Strictness is the test: a beta*(g) curve that is flat in g at some
          n is the lane's obstruction at that n, measured.
    quantifier_order: >-
      FOR EACH n in the tested ladder and FOR EACH g in the tested set, THERE
      EXISTS a seed-stable beta*(g) (20 seeds, dispersion reported), and the
      CLAIM is that the fitted slope K_meas is (i) affine over the tested g and
      (ii) n-independent to within a stated tolerance. It is NOT a claim that
      K_meas transfers to n = 768 uniformly; the transfer is H2 and is stated as
      an extrapolation with its fitted n-trend.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On ML-KEM-shaped q-ary instances at n in [100, 160], the marginal
        reduction saving per correctly guessed coordinate is K_meas bits
        (interval), and under Bernstein's law with c = lg w the memory-free
        hybrid's exponent gain at FIPS shapes is rho*K_meas/(K_meas + c)*n
        bits, a model readout with the n-trend of K_meas as its stated
        extrapolation." It cannot certify the hybrid's cost at FIPS shapes,
        cannot certify the o(1), and cannot certify any engine with c below
        lg w without the companion record (IDEA-20260901-67f498) on split
        survival.
      nearby_object_control: >-
        An instance with UNIFORM secret coordinates mod q (no short target):
        beta*(g) is undefined (nearest-plane never returns a short residual)
        at every g, so the method must report failure, not a slope; and an
        instance with a GAUSSIAN target of matched variance instead of CBD,
        where the law predicts the SAME K (the reduction side does not see the
        alphabet) -- a K that differs between CBD and Gaussian arms by more
        than seed dispersion means the instrument is reading the alphabet, and
        the CBD-specific reading must then be reported as such.
    proof_obligations:
      - claim: "g = 0 reproduces the committed primal figures under the pinned estimator and the committed reduced-dimension cells."
        responsibility: baseline
      - claim: "beta*(g) is non-increasing in g on every seed and the wrong-guess null never succeeds."
        responsibility: correctness
      - claim: "K_meas is affine in g over the tested range with stated curvature onset."
        responsibility: strictness
      - claim: "The per-guess decoding is O(d^2) and the residual-norm test has no exponential hidden cost."
        responsibility: runtime
      - claim: "Meet-in-the-middle rows are charged at memory 2^(c g*) under T*M^alpha with alpha stated."
        responsibility: memory
      - claim: "The n-trend of K_meas is reported and the FIPS-shape readout is labelled an extrapolation."
        responsibility: scope
      - claim: "The wrong-guess and symmetry nulls are run before any K is believed."
        responsibility: interface
  predictions:
    - metric: "K_meas = 0.292 * (-d beta*/d g), bits per correctly guessed coordinate, pooled over 20 seeds at n = 120, m = n, q = 3329, CBD(2)"
      direction: different
      minimum_effect: >-
        A value with a 95 percent interval of half-width at most 0.03. The
        decision thresholds are pre-registered: K_meas <= 0.06 closes the
        memory-free lane at <= 5.2 / 6.4 / 8.1 bits under the law (Row A
        scaled by K_meas/0.0478 with K_meas = 0.06); K_meas >= 0.15 escalates.
        Any value in between is reported as the bracket it produces.
    - metric: "n-dependence of K_meas across n in {100, 120, 140, 160}"
      direction: different
      minimum_effect: >-
        Predicted constant to within 25 percent (the law's premise); a
        monotone trend exceeding that is the informative negative and is
        reported as the extrapolation's failure mode.
    - metric: "K_est from the pinned estimator's primal_bdd(n - g, m) sweep at the three FIPS shapes"
      direction: different
      minimum_effect: >-
        Reported per shape; predicted between 0.10 and 0.30 (the naive
        differentiation gives 0.229 at 768). K_est below 0.06 would put the
        estimator on Bernstein's side and make clause (C)'s derivation wrong;
        that outcome is recorded as a correction to (C), not hidden.
    - metric: "Symmetry null: |beta*_e(g) - beta*_s(g)| at eta_s = eta_e"
      direction: lower
      minimum_effect: "must be within the pooled seed dispersion at every g; a systematic gap is an instrument fault and voids K."
    - metric: "Asymmetry arm at CBD(3)/CBD(2): beta*_s(g) - beta*_e(g)"
      direction: lower
      minimum_effect: "predicted <= 0 (s-guess at least as good); magnitude pre-registered from Stage 1(b) before Stage 2 runs; a positive value falsifies the variance-removal reading."
    - metric: "Stage 4 measured hybrid/primal ratio of counted operations at the chosen cell, against the prediction from K_meas"
      direction: different
      minimum_effect: "agreement within a factor 2 on a predicted ratio of at least 8x; disagreement by more than 4x means assumption A1's decomposition fails at this scale and the law is not tracking the attack."
  minimal_test:
    design: >-
      Stage 1 is the minimal test and costs hours: a primary-text read that
      can rescale every number, plus an estimator sweep that yields K_est at
      zero lattice compute and is itself a discriminator (K_est near 0.05 vs
      near 0.23 already says which of the two corpus values the estimator
      sides with). It discriminates because the two candidate K values differ
      by 4.8x, far beyond any estimator resolution. Stage 2 (fpylll, 20 seeds x
      4 n x 7 g x 2 arms, plus the asymmetric arm; progressive BKZ to beta at
      most 60 at d at most 321) is the measurement proper, roughly 40-80
      CPU-hours on one workstation, and discriminates because the wrong-guess
      and symmetry nulls have forced outcomes and the K thresholds are fixed
      in advance. Stage 4 is conditional and separately budgeted.
    controls:
      - "WRONG-GUESS NULL: Hamming-distance-1 guess never succeeds; residual norm about q sqrt(d/12)."
      - "SYMMETRY NULL: e-guess equals s-guess at eta_s = eta_e."
      - "ASYMMETRY, SIGNED: s-guess <= e-guess in beta* at the CBD(3)/CBD(2) arm, magnitude pre-registered."
      - "MONOTONICITY: beta*(g) non-increasing per seed."
      - "g = 0 KNOWN ANSWER: matches committed primal cells."
      - "GAUSSIAN-TARGET TWIN: same K within dispersion, else the instrument reads the alphabet."
      - "STRATEGIES FILE BOUND BY CONTENT at run time, per GOAL-MLKEM-005's rt_ctrl_1 v2 discipline."
    required_metrics:
      - "the paper's exact attack, w-convention and heuristics, quoted with section references"
      - "K_est per FIPS shape from the pinned estimator, with primal_hybrid's own reported gain beside it"
      - "beta*(g) per (seed, n, g, arm) and the per-n fitted slope with intervals"
      - "K_meas per n and its n-trend"
      - "wrong-guess residual norms; symmetry-null gaps; asymmetry-arm signed differences"
      - "the recomputed (B)-(D) table under the confirmed convention with K_B, K_naive, K_est, K_meas as four rows, memory charged per engine"
      - "Stage 4 counted-operation ratio if run"
  falsification_conditions:
    - "Stage 1(a) finds the abstract's H0 is not of the form K/(K + c) with c the guessing exponent (e.g. w is a standard deviation and the structure differs): clause (C)-(D) are withdrawn and only the measurement of K stands, re-framed against the paper's actual constant."
    - "The wrong-guess null succeeds at any rung: the pipeline is void and no K is reportable."
    - "The symmetry null fails by more than seed dispersion: instrument frame-sensitivity exceeds the effect; K is reported only as an upper bound on the difference between arms."
    - "beta*(g) is not affine in g anywhere in [0, 32] at any n: the linear-balance law is the wrong model at these sizes; the curve is reported and no H0 is computed from it."
    - "K_meas <= 0.06 with an interval excluding 0.15: the memory-free hybrid is bounded at <= 5.2 / 6.4 / 8.1 bits at FIPS shapes under the law, i.e. within 1.3x of Bernstein's row; the lane closes at that number and the MITM rows remain memory-reversed."
    - "K_meas >= 0.15 with an interval excluding 0.06: the law predicts >= 12 bits memory-free at ML-KEM-768, contradicting the recalled consensus; this is NOT a finding until Stage 4's end-to-end ratio and an independent red-team pass exist."
    - "Stage 4's measured ratio disagrees with the K_meas prediction by more than 4x: assumption A1 fails and beta*(g) is not the cost-bearing object."
  confounders:
    - "The w-convention (A3). Every number in (B) and (D) is downstream of it."
    - "Precision: GOAL-MLKEM-005 committed that d = 512 cells fail at 65-75 bits and need 100; Stage 2 stays below d = 321 and inherits that goal's bisection discipline, but a precision failure that masquerades as a large beta* would bias K downward (flatter slope) -- the direction of the safe verdict, which is why it must be excluded, not tolerated."
    - "Progressive-BKZ tour count per rung: one tour per rung is a design choice; beta* under a different schedule is a different observable and the strategies file is bound by content for that reason."
    - "The re-optimisation of m: Bernstein's balance may re-choose the sample count after guessing; Stage 2 holds m = n fixed because ML-KEM provides exactly n samples, and states that this is the ML-KEM constraint, not an omission."
    - "The recalled Kyber core-SVP figures and the recalled 'hybrids do not help' consensus; neither was read this session."
    - "Toy-to-FIPS transfer of K: the n-trend is the only evidence about it and is reported as such (H2)."
  interpretation_limits:
    - "No attack, no break, no FIPS 203 parameter set affected or cleared. The scout table is arithmetic on a relayed asymptotic formula and carries no claim tier."
    - "Toy tier for every measured beta*(g) (q = 3329 is a 12-bit prime; n <= 160). A K_meas is a statement about the tested n and about the law's constant at those n."
    - "The c < lg w rows are conditional on split survival, which this record does not test; IDEA-20260901-67f498 does."
    - "A large K_meas is a statement about the RELAYED law's prediction, which is itself conditional on the community heuristics Bernstein names and on an o(1) this record cannot bound at n = 768."
  heuristic_assumptions:
    - id: H1
      statement: >-
        For ML-KEM-shaped q-ary instances (q = 3329, m = n, CBD(eta) target),
        the minimum block size at which nearest-plane decodes the residual
        after g correct coordinates are supplied is affine in g,
        beta*(g) = beta*(0) - a g, uniformly for g/n <= 0.25 and n in
        [100, 160], with a independent of n to within 25 percent.
      rigorous_support: >-
        Rigorous ingredient: removing a coordinate removes one basis direction
        and leaves the volume q^m unchanged, so the 2016 success condition's
        right-hand side increases by exactly log2 delta + (m/d^2) log2 q per
        removed dimension under the GSA model (KN-TECH-041). The classical
        statement imitated is the GSA-based success condition of ADPS16 as
        validated by KN-LIT-108 at reduced dimension, under which the required
        beta is a smooth function of (d, Vol, target norm). The heuristic is
        exactly that the smoothness survives the shrinking of d at fixed Vol,
        which is a model claim, not a theorem.
      validation_plan: >-
        Stage 2 as designed: 20 seeds x 4 n x 7 g. Compare the empirical
        beta*(g) against the affine fit and against the ADPS16 prediction
        computed on the SAME instances' actual profiles. TAIL CHECK: report the
        worst-seed beta*(g) at each g and the largest residual from affinity;
        report the g at which curvature first exceeds one block on the pooled
        fit. Sampled parameters recorded per cell. TRANSFER ASSUMPTION: n = 160
        to 512-1024 and beta = 60 to 400-900, stated as an extrapolation with
        the fitted n-trend of a as its interval.
    - id: H2
      statement: >-
        The exponent-shift form rho(1 - H0) with H0 = K/(K + c) transfers from
        Bernstein's asymptotic regime to n in [512, 1024] with the o(1) term
        bounded by 3 bits in absolute value, so that the memory-free hybrid's
        FIPS-shape gain equals rho K n/(K + c) within 3 bits once K is fixed.
      rigorous_support: >-
        Rigorous ingredient: none beyond the relayed theorem's own conditional
        derivation. The classical statement imitated is the asymptotic
        core-SVP cost itself, whose formula rho n lands within 2.3 bits of the
        recalled Kyber classical figures at all three shapes (clause B), which
        is the only evidence the o(1) is small at these n. This is the
        weakest heuristic in the record and is labelled so.
      validation_plan: >-
        Compare rho n from the formula against (i) the recalled Kyber figures
        once read, (ii) the pinned estimator's primal_usvp under ADPS16, and
        (iii) K_est's own g-sweep, at all three shapes; report the three
        residuals. A residual exceeding 3 bits on (ii) falsifies H2 as stated
        and the FIPS-shape readout is then quoted with that residual as its
        error bar. No sampling at cryptographic size is possible; this is a
        formula-versus-instrument check, and it is recorded as such.
    - id: H3
      statement: >-
        The guessing engine's cost is 2^(c g) * poly with c = lg w for
        enumeration in any order, i.e. the guess block's coordinates are
        exchangeable and the enumeration order does not change the exponent.
      rigorous_support: >-
        For the uniform distribution on w values this is exact. For CBD(eta)
        the expected guesswork exponent is the Renyi-1/2 entropy (Arikan's
        bound; catalogue M1-3 computes 2.158 for eta = 2, 2.514 for eta = 3
        against lg w = 2.322, 2.807), so c = lg w is an UPPER bound on the
        enumeration exponent and the H0 rows are conservative for the
        attacker by 0.16-0.29 bits per coordinate.
      validation_plan: >-
        Exhaustive enumeration of all 5^g blocks for g <= 8 in probability
        order with exact rational bookkeeping (M1-3's own gate), confirming
        log2 E[guesses]/g against 2.158 and 2.322. Zero lattice compute. Both
        c values are then carried as two rows.
  target_complexity:
    time_exponent: >-
      CONDITIONAL TARGET, NOT A CLAIM. Plain primal: 2^((rho + o(1)) n) with
      rho = 0.2347 / 0.2412 / 0.2454 at the three FIPS shapes under the relayed
      law (120.2 / 185.2 / 251.3 bits). Memory-free enumeration hybrid:
      2^((rho(1 - H0) + o(1)) n) with H0 = K/(K + lg w); at K = 0.0478 (Bernstein)
      that is 117.8 / 181.5 / 246.1 bits (gain 2.4 / 3.7 / 5.2); at K = 0.229
      (naive 2016-condition differentiation, 768 shape only) it is 168.6 bits at
      768 (gain 16.6). Meet-in-the-middle engines (c = 1.16, 0.36) give 177.9 and
      163.5 bits at 768 under K = 0.0478 BEFORE memory charging. Every figure is
      scout arithmetic under assumption A3 and heuristic H2.
    memory_exponent: >-
      Enumeration row: polynomial (the reduced basis plus one target). MITM
      rows: 2^(c g*) = 2^(rho(1 - H0) n), i.e. memory equal to time at balance
      -- 2^177.9 and 2^163.5 at 768 -- which under the physical charge
      T * M^(1/3) (catalogue M3-1, EV-MLKEM-020's framework) becomes 2^237 and
      2^218 against the uncharged primal 2^185: the MITM rows are REVERSED by
      memory charging at every K in the bracket, and survive only at
      alpha <= 0.04 (c = 1.16) and alpha <= 0.13 (c = 0.36).
    best_known: >-
      For key recovery against ML-KEM: primal_bdd under RC.MATZOV at
      140.199 / 200.959 / 270.724 bits (EV-MLKEM-020, a different convention
      from the core-SVP figures above and not to be subtracted from them);
      the estimator's own primal_hybrid figure at these shapes is UNCOMPUTED in
      this program and is Stage 1(b)'s first output; KN-LIT-7663's reported
      2-3 bit coefficient-isometry row is the only structure-dependent gain the
      corpus records.
    hidden_overhead: >-
      Three disclosures. (1) The o(1) in Bernstein's law is unbounded by this
      record at n = 768; H2 assumes 3 bits and is the weakest link. (2) The
      per-guess decoding is charged as poly and the residual-norm test as
      O(d); if either hides an exponential factor at the operating beta the
      decomposition A1 fails, which is what Stage 4 tests. (3) The naive K in
      clause (C) ignores that nearest-plane must succeed, not merely that uSVP
      is detected; that is the likeliest reason it exceeds Bernstein's, and it
      is why K is measured with nearest-plane success as the criterion.
    tradeoff_note: >-
      The hybrid is a time-memory curve in g by construction: g = 0 is the
      polynomial-memory endpoint; the enumeration row stays polynomial-memory
      along the whole curve; the MITM rows trade memory 2^(c g) for guessing
      time and sit at memory = time at balance. Parallelisation: guesses are
      embarrassingly parallel after the single shared reduction, so the
      enumeration row parallelises perfectly over the 2^(c g*) trials with the
      reduction as a serial prefix; the MITM rows parallelise as their list
      construction does and inherit the sieve-style memory-bandwidth charge.
      This curve is DIFFERENT from IDEA-20260821-46c09f's SVP-algorithm hull
      and from 70e41d's enumeration/sieving price curve; a hybrid point that
      lands off 46c09f's hull is handed to that record, not absorbed here.
  dominated_by: >-
    n/a (no attack claimed; a constant is measured). Frontier rows checked on
    time, memory and data axes for ML-KEM key recovery: (i) primal_bdd /
    RC.MATZOV (EV-MLKEM-020) -- the g = 0 endpoint of this record's curve,
    which the record must reproduce; (ii) the estimator's primal_hybrid --
    uncomputed here, Stage 1(b) computes it; (iii) IDEA-20260828-55a0de's
    planned MITM sweep -- consumes K as an input, so it cannot dominate a
    measurement of K; (iv) KN-LIT-7663's 2-3 bit isometry row -- an
    orthogonal preprocessing amortisation that composes with any hybrid and
    dominates nothing here; (v) dual attacks under MATZOV (EV-MLKEM-015,
    contested per KN-OPEN-016) -- a different family with a different
    convention; (vi) best-of-M (GOAL-MLKEM-005) -- capped at log2 M and
    normatively M = 1, dominated by every row above on data. No row on that
    frontier reports a measured K, so none dominates its measurement.
  sota_delta: >-
    Quantitatively, conditional on the relayed law and assumption A3: the
    memory-free hybrid's exponent gain at FIPS shapes is bracketed at
    [2.4, 16.6] bits (768 shape: 3.7 at K = 0.0478, 16.6 at K = 0.229), with
    the bracket collapsing to one number once K_meas exists; the
    meet-in-the-middle rows are reversed by memory charging at alpha = 1/3 at
    every K in the bracket. The smallest K_meas this record would treat as
    distinguishing the two corpus values is an interval half-width of 0.03. No
    attack delta is claimed today: sota_delta = 0 on every axis until Stage 2
    returns, and the expected verdict under the recalled consensus is the LOW
    end of the bracket.
