idea:
  id: IDEA-20260901-7eb9e1
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  goal_id_note: >-
    GOAL-MLKEM-005 is RQ-MLKEM-001's active goal and its own
    when_the_ready_set_is_empty clause routes /propose-ideas on RQ-MLKEM-001
    into it. The goal's tracked object is the best-of-M (basis, projected-error
    ratio) pair; this record's object is different and the record says so
    below. The goal's ceiling_known_in_advance proves that SELECTION among
    externally supplied trials can never move an exponent because the gain is
    capped by log2(number of trials); this record is about the one member of
    the same "reduce once, many cheap trials" family whose trial count is
    generated INTERNALLY and is exponential in the block size, which is why the
    convexity ceiling does not bind it. Filing under GOAL-MLKEM-005 is therefore
    the Coordinator's call; the record works equally under goal_id null.
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE HYBRID LANE'S EXPONENT AT ML-KEM IS ONE CONSTANT, AND THE CORPUS HOLDS
    TWO VALUES FOR IT THAT DIFFER BY 5x. Bernstein's asymptotic law for hybrid
    primal attacks (ePrint 2023/1892) says the memory-free hybrid lowers the
    primal exponent from rho to rho(1 - H0) with H0 = K/(K + c), c the
    per-coordinate guessing exponent and K = 0.057981*z0 the marginal value of
    one correctly guessed coordinate; at FIPS 203 shapes K = 0.047-0.049 bits per
    coordinate and the memory-free gain is 2.4 / 3.7 / 5.2 bits, but a direct
    differentiation of the 2016 primal success condition at the ML-KEM-768 shape
    gives K = 0.23. Measure K on real BKZ-reduced ML-KEM-shaped instances with
    correct guesses supplied -- the slope of the minimum successful block size
    against the number of guessed coordinates -- and tabulate what each
    guessing engine (enumeration, meet-in-the-middle, representation-technique)
    then buys, with memory charged.
  class: mechanism
  claim: >-
    (A) THE LAW, RELAYED. Bernstein (ePrint 2023/1892, abstract retrieved via
    WebSearch this session, full text NOT read) states that under the existing
    heuristics a hybrid primal key-recovery attack against LPR-type encryption
    with dimension n, modulus n^(Q0+o(1)) and error width w costs
    2^((rho - rho*H0 + o(1)) n) against 2^((rho + o(1)) n) for the plain primal
    attack, with z0 = 2 Q0 / (Q0 + 1/2)^2, rho = z0 log_4(3/2), and
    H0 = 1 / (1 + (lg w) / (0.057981 z0)). Read structurally: H0 = K / (K + c)
    with c = lg w the per-coordinate cost exponent of the guessing engine and
    K = 0.057981 z0 the marginal reduction saving per correctly guessed
    coordinate. The gain is an exponent shift, and it is the only mechanism in
    RQ-MLKEM-001's scope that this corpus records as exponent-moving under the
    community's own heuristics: KN-LIT-2598 has carried the abstract since
    2026-07-24 and no ML-KEM record has evaluated it.
    (B) SCOUT ARITHMETIC AT FIPS 203 SHAPES, COMPUTED THIS SESSION, EXACT
    ARITHMETIC ON THE RELAYED FORMULA, CONDITIONAL ON READING w AS THE SUPPORT
    SIZE 2 eta + 1 (assumption A3). With n the secret dimension 256k and
    q = 3329: Q0 = ln q / ln n = 1.3001 / 1.2207 / 1.1701 (ML-KEM-512/768/1024);
    z0 = 0.8024 / 0.8246 / 0.8390; rho = 0.2347 / 0.2412 / 0.2454, so
    rho*n = 120.2 / 185.2 / 251.3 bits. That the asymptotic formula lands within
    2.3 bits of the RECALLED Kyber classical core-SVP figures 118 / 183 / 256
    (Round-3 specification, not read this session) is the scout's calibration
    check, not a result. K = 0.057981 z0 = 0.04653 / 0.04781 / 0.04865 bits per
    coordinate. Guessing the lower-entropy block (the error e, CBD(2), w = 5 at
    every set; at ML-KEM-512 the secret is CBD(3), w = 7, and by the invertible-A
    symmetry of an m = n instance guessing error coordinates is as good as
    guessing secret coordinates dimension-for-dimension): c = lg 5 = 2.3219,
    H0 = 0.01965 / 0.02018 / 0.02052, and the memory-free exponent gain is
    rho*H0*n = 2.36 / 3.74 / 5.16 bits, at an optimal guess block
    g* = rho n / (K + c) = 51 / 78 / 106 coordinates. Under the w = 7 reading at
    512 the gain is 1.96 bits.
    (C) THE DISCREPANCY THAT MAKES THIS A MEASUREMENT RATHER THAN A TABLE. The
    same K can be read off the 2016 primal success condition (ADPS16, KN-TECH-038)
    by removing one unknown at fixed sample count: the right-hand side
    delta^(2 beta - d - 1) q^(m/d) gains log2 delta + (m/d^2) log2 q per removed
    dimension, which at the ML-KEM-768 shape (m = n = 768, d = 1537,
    beta = 600, log2 delta = 0.004302) is 0.008105 bits, against a beta-slope of
    the same expression of 0.01033 bits per unit beta, giving
    d beta*/d g = -0.785 and K_naive = 0.292 * 0.785 = 0.229 bits per coordinate
    -- 4.8x Bernstein's 0.0478. Under K = 0.229 the SAME memory-free enumeration
    hybrid is predicted at rho*H0*n = 16.6 bits at ML-KEM-768. The two values
    cannot both be right, the difference is a factor of 4.5 in the lane's
    predicted worth, and neither has been measured on a reduced basis. The
    naive figure ignores that per-guess decoding must SUCCEED (Babai on the
    residual, a stronger condition than uSVP detection at the same beta) and
    ignores re-optimisation of m; Bernstein's figure carries an o(1) of unknown
    sign at n = 768. The measured K arbitrates.
    (D) THE LEVER, AND ITS MEMORY. H0 = K/(K+c) rises as c falls. Three guessing
    engines are on the table: plain enumeration c = lg w = 2.32 (polynomial
    memory); Howgrave-Graham meet-in-the-middle c = lg w / 2 = 1.16 (memory
    2^(c g)); and the Glaser-May representation-technique enumeration of CBD(2)
    keys, reported at time = memory 2^(0.36 N) (ePrint 2022/1337, abstract via
    WebSearch, unread), c = 0.36. At K = 0.0478 and ML-KEM-768 these give
    3.7 / 7.3 / 21.7 bits -- but the balanced meet-in-the-middle rows put the
    optimum at g* = 153 and 454 coordinates with memory 2^(177.9) and 2^(163.5),
    i.e. memory EQUAL to the resulting time, and under the T*M^(1/3) physical
    charge this program already uses (catalogue M3-1, EV-MLKEM-020's framework)
    those rows cost 2^237 and 2^218 against the uncharged primal 2^185: memory
    charging reverses them. ONLY THE ENUMERATION ROW IS MEMORY-FREE, and it is
    the row whose worth K decides.
    (E) THE CLAIM, FALSIFIABLE. Define beta*(g) as the smallest progressive-BKZ
    block size at which Babai nearest-plane on the reduced residual basis
    recovers the residual (s_rest, e) when g correct coordinates are supplied.
    On ML-KEM-shaped q-ary instances (q = 3329, m = n, CBD errors) at secret
    dimensions n in {100, 120, 140, 160}, beta*(g) is affine in g over
    g in [0, 32] with a seed-stable slope, and K_meas = 0.292 * (-d beta*/d g)
    lies in [0.03, 0.30] bits per coordinate with a value that DECIDES: K_meas
    at or below 0.06 bounds the memory-free hybrid at FIPS shapes to at most
    5.2 / 6.4 / 8.1 bits under the law (at most 1.3x Bernstein's row) and the
    lane closes at a number; K_meas at or above 0.15 predicts at least 12 bits
    at ML-KEM-768 under the same law, contradicting the RECALLED consensus that
    hybrid attacks do not improve on the primal attack at Kyber's dense secrets,
    and escalates to a Stage-2 end-to-end run and red-team.
    (F) NOT CLAIMED. No attack on any FIPS 203 parameter set, no key recovery,
    no statement that any published cost table is wrong. Every FIPS-shaped
    number in (B)-(D) is scout arithmetic on a relayed asymptotic formula under a
    stated reading of w, is labelled as such, and is NOT a security figure.
    Toy-scale beta*(g) values are statements about the tested n only.
  mechanism: >-
    STAGE 0, THE LOSSY-PROJECTION TEST, RUN BEFORE ANY COMPUTE. The full hybrid
    attack state is (reduced basis B, guess list, per-guess Babai transcripts,
    verification outcomes). The tracked object is the function
    g |-> beta*(g), followed through: choose g -> supply the correct g
    coordinates -> build the (n - g + m + 1)-dimensional residual embedding ->
    reduce progressively -> record the first block size at which nearest-plane
    returns the residual. It DISCARDS every guess except the correct one, every
    list, every transcript and the basis itself, retaining one integer per g.
    The discard is compatible with the attack's operations because the total
    cost of the memory-free hybrid is, by its own accounting,
    T_reduce(beta*(g)) + 2^(c g) * poly, a function of beta*(g) and c alone; the
    fibre over a given beta*(g) contains every basis and every guess order that
    achieve it, none of which changes the cost. It is not a change of
    coordinates: the basis is not recoverable from an integer.
    STAGE 1, PRIMARY-TEXT AND ESTIMATOR GATE (zero lattice compute). (a) Obtain
    the paper: KN-LIT-2598 lists a local copy at downloads/hybrid-20231208.pdf,
    which does not exist at that path in this tree; ePrint 2023/1892 and
    cr.yp.to/papers/hybrid-20231208.pdf are the sources, both blocked from this
    harness on 2026-09-01. Read it; extract the exact attack (what is guessed,
    how per-guess decoding is done, how the reduction is amortised), the exact
    meaning of w, the heuristics named, and the o(1) discussion. THIS STAGE CAN
    RESCALE EVERY NUMBER IN (B): if w is a standard deviation rather than a
    support size, or if the guess block is not a coordinate block, (B)-(D) are
    recomputed before anything else runs. (b) Estimator sweep: under one pinned
    lattice-estimator commit and RC.MATZOV, evaluate primal_bdd at
    (n - g, m = n) for g in {0, 8, ..., 64} at all three shapes and read
    K_est = 0.292 * (-d beta / d g); separately run primal_hybrid at the three
    shapes and record its reported gain and guess dimension, so that Stage 2's
    K_meas can be compared against the estimator's own implied K and the
    estimator's own hybrid verdict. (c) Recompute the (B)-(D) table under the
    confirmed w-convention and with K_est beside K_B and K_naive.
    STAGE 2, MEASURE K (fpylll, no sieve). For each n in {100, 120, 140, 160},
    m = n, q = 3329, secret and error CBD(2) (plus a CBD(3)/CBD(2) asymmetric arm
    at n = 120 to mirror ML-KEM-512), 20 seeds per cell, g in
    {0, 4, 8, 12, 16, 24, 32}: fix the true (s, e); supply the g correct
    coordinates of e (and, in a second arm, of s); form the residual BDD
    instance; run progressive BKZ (beta from 10 upward, one tour per rung, fixed
    strategies file bound by content as GOAL-MLKEM-005's rt_ctrl_1 v2 does)
    and after each rung run nearest-plane on the residual target; record
    beta*(g) as the first rung at which the returned vector equals the residual.
    Fit beta*(g) = beta*(0) - a g per seed and pooled; report K_meas = 0.292 a
    with seed dispersion, per n, and the n-dependence of a.
    STAGE 3, THE FORCED CONTROLS (all pre-registered). (i) WRONG-GUESS: at each
    (n, g) also supply a guess at Hamming distance 1 from the truth; the
    residual error becomes e + A_G delta mod q, a vector of norm about
    q sqrt(d/12), so nearest-plane must FAIL at every rung and the recorded
    residual norm must sit within 20 percent of q sqrt(d/12); a pipeline that
    "succeeds" on a wrong guess is measuring nothing. (ii) SYMMETRY: at
    eta_s = eta_e the e-guess and s-guess arms must give beta*(g) equal within
    seed dispersion, because an m = n instance with invertible A is symmetric
    under (A, s, e) -> (-A^(-1), e, s); a violation is an instrument fault.
    (iii) ASYMMETRY, SIGNED: at the CBD(3)/CBD(2) arm the s-guess removes 1.5
    units of target variance per coordinate against the e-guess's 1.0, so
    beta*_s(g) <= beta*_e(g) is predicted; the magnitude is derived from Stage
    1(b)'s sweep and pre-registered before Stage 2 runs. (iv) MONOTONICITY:
    beta*(g) non-increasing in g on every seed. (v) g = 0 KNOWN ANSWER:
    beta*(0) must reproduce the program's own committed primal cells at matched
    (n, m, q, eta) where they exist (GOAL-MLKEM-005's d = 256 apparatus is the
    closest), or the reduction pipeline is a different pipeline.
    STAGE 4, THE END-TO-END LADDER STEP (conditional on K_meas >= 0.15). Choose
    the (n, g) cell where K_meas predicts a hybrid-over-primal time ratio of at
    least 8x, run the memory-free enumeration hybrid (one reduction at beta*(g),
    then 2^(g lg w) nearest-plane calls in probability order with a residual-norm
    test) and the plain primal attack to completion on the same 20 instances,
    and report the measured ratio of counted operations against the predicted
    one. This is docs/inventor-protocol.md section 6 step 2, the step the
    program most often skips.
