  object_first_candidate:
    tracked_object: >-
      The marginal-value function g |-> beta*(g): the minimum block size at
      which nearest-plane decodes the residual once g correct coordinates are
      supplied, and its slope K in core-SVP bits per coordinate. Followed from
      the choice of g, through the residual embedding and the progressive
      reduction, to one integer per g.
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) best-of-M target selection and every
      selection-among-external-trials mechanism (GOAL-MLKEM-005, M1-2, M2-1,
      M2-6) -- all capped at log2(trials) by the goal's convexity argument;
      (2) algebraic sample generation (closed at 17 bits by the goal's inherited
      constraint); (3) the ring-accelerated hybrid DECODING step (17acdf,
      bd7b6c, KN-LIT-7667); (4) the estimator MITM sweep at FIPS parameters
      (55a0de); (5) dual-attack score geometry (every RQ-MLKEM-003 record);
      (6) failure oracles and implementation leakage. This record's lens is the
      EXPONENT of the memory-free hybrid and the single constant that sets it.
    genuinely_new_or_repackaging: >-
      The mechanism is Bernstein's and the hybrid attack is Howgrave-Graham's;
      neither is claimed. What is not a repackaging is (a) the identification of
      the abstract's H0 as K/(K + c) with K a measurable marginal value and c a
      swappable engine exponent, (b) the 4.8x discrepancy between the asymptotic
      K and the 2016-condition K at the ML-KEM-768 shape, which this session
      computed and which nothing in the corpus records, and (c) the design that
      measures K with correct guesses supplied, which isolates the reduction
      side from every guessing heuristic.
    concretely_testable: >-
      Yes. One-step propagation is "add four correct coordinates, re-reduce,
      record the first successful rung"; the measurable is an integer per
      (seed, n, g), and the controls (i)-(v) each have a forced outcome.
    survival_score: >-
      The object survives exactly as long as beta*(g) is affine in g. The law
      predicts affinity for g much smaller than n; the record expects curvature
      to appear by g/n around 0.3 and reports where it appears. Beyond that
      point the linear-balance form of H0 dissolves and the (D) meet-in-the-
      middle rows, whose g* is 20-59 percent of n, are already outside the
      object's range -- which is a finding about those rows, recorded in
      advance.
  null_object_control: >-
    Two nulls, one per failure mode. (1) THE WRONG-GUESS NULL (Stage 3(i)): the
    identical pipeline fed a guess at Hamming distance 1 must never succeed and
    must report a residual of norm about q sqrt(d/12). A pipeline that reports a
    finite beta* on the wrong-guess null is reading its own bookkeeping. (2) THE
    SYMMETRY NULL (Stage 3(ii)): e-guess and s-guess arms at eta_s = eta_e are
    the same problem under a change of variables and must give the same
    beta*(g); a difference is an artifact of the embedding order, and its size
    is the instrument's frame-sensitivity floor, below which no K difference
    may be reported. The canonical artifact tell applies to K itself: the
    parameter meant to destroy the effect is g -> 0, and K is a slope, so a
    fit that returns a nonzero K on a g = 0 only sub-sample is a fitting
    defect.
  discriminated_from:
    - >-
      IDEA-20260828-55a0de (RQ-MLKEM-003) sweeps the Wunderer MITM hybrid's
      guess dimension k at FIPS parameters inside the pinned estimator, charges
      the MITM table, and asks whether k* > 0. Its object is the ESTIMATOR'S
      cost surface at fixed formulas; this record's object is the REDUCTION-SIDE
      constant K measured on real reductions, which 55a0de's formula consumes
      as an input. If 55a0de runs first its k* is a prediction this record's
      Stage 2 can test; if this record runs first its K_meas is a correction
      55a0de must apply. They compose in either order and neither subsumes the
      other; this record's Stage 1(b) reproduces the g = 0 cell exactly as
      55a0de's Stage 1 does, so the baseline gate is shared.
    - >-
      IDEA-20260813-17acdf (RQ-MLKEM-001) tests whether Hou-Jiang's O(N)
      ring-accelerated guessing/decoding survives CBD entropy, with type-class
      lists as its object. It is a lever on the DECODING cost per guess and on
      c; this record holds the decoder fixed (plain nearest-plane) and measures
      the other factor of the product. 17acdf's ceiling of 8 bits (log2 256) is
      a constant; this record's target is an exponent constant.
    - >-
      IDEA-20260805-3d71ca / H-MLKEM-7d9bcc (GOAL-MLKEM-005's live object)
      measure the left tail of the projected-error NORM ratio under best-of-M
      selection, capped at log2 M. This record's trials are guesses, not
      ciphertexts; the count is 2^(c g), not M; and the quantity read off the
      reduced basis is a success block size, not a norm-ratio quantile. The two
      share an apparatus (BKZ-reduced q-ary bases with CBD targets) and nothing
      else.
    - >-
      Catalogue M1-3 (uncommitted) prices the guessing block's exponent as
      Renyi-1/2 (2.158 for CBD(2)) rather than Shannon or lg w; that is a
      refinement of c, and if adopted it enters this record's H0 = K/(K + c)
      row as c = 2.158 in place of 2.322, moving the memory-free gain at 768
      from 3.74 to 4.02 bits under K = 0.0478. Compatible, not competing.
    - >-
      IDEA-20260821-bd7b6c (RQ-FRODO) measures the ring-attributable share of
      the Hou-Jiang gain on a ring-degree ladder; it never tracks a reduction
      constant and never evaluates an exponent law.
