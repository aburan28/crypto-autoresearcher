      claim: >-
        The mechanism being tested, read at source in
        inputs/JOUX-VITSE-2010-157/paper_fulltext.md lines 645-710. Because
        relation-search systems "always have the same shape", run F4 once on
        the first system and store the selected critical pairs, removing each
        pair that reduces to zero. On each later system, do not maintain the
