  proposed_by: idea-generator
  status: proposed
  title: >-
    Trace-stability test before any GPU work. Does one learned elimination trace
    of the per-attempt Macaulay matrix replay unchanged across relation attempts?
    It is measured on prime-degree binary summation systems in two coefficient
    regimes, stratified by exact satisfiability, against same-support null
    families, with per-instance matrix sizes recorded. CEILING, STATED FIRST:
    constant factor at most. No exponent moves, and rho dominates.
  class: measurement

  claim: >-
    CEILING FIRST. Best case, this proposal improves the per-attempt cost of
    index-calculus relation search on F_{2^n}, n prime, by a constant factor. It
    moves no exponent. The relevant constant is anchored by the only
    source-verified figure in the corpus: Joux-Vitse's F4' (precomputed
    critical-pair list, reductions to zero removed) beat their own F4 by 2.43x,
    3.40x and 2.88x at |p| = 16, 25 and 32 bits. It paid 11.31 s of
    precomputation, and it was measured over F_{p^5} with large p, not F_2
    (KN-LIT-673219, frozen text lines 687-709). Parallel Pollard rho with the
    curve's automorphisms dominates index calculus on prime-degree binary
    fields in all current evidence (KN-LIT-439, reported). The value of this
    record is cheap falsification of a GPU design premise, P-GPU:
    "the Macaulay matrix of each relation attempt has a fixed sparsity pattern;
    learn the elimination trace once, replay it GPU-batched, branch-free, with
    XOR and carry-less multiply on every attempt; degenerate pivots are rare and
    go to a CPU fallback."

    Representation class R1 (field coordinates: F_2 coordinates after Weil
    descent in regime A, F_{2^n} coordinates in regime B). Attack stage:
    relation decomposition, the per-attempt solve.

    The claim is in three parts.
    (C1) THEOREM (Proposition S, proved in `mechanism`). In both regimes, if the
    reference trace is learned on an UNSATISFIABLE attempt whose degree-D*
    Macaulay row space contains 1, then EVERY satisfiable attempt differs from
    it at degree D*: the constant column is a pivot for the reference and
    cannot be one for any satisfiable instance. So with an unsatisfiable
    reference, P-GPU's "rare degenerate" fallback receives 100% of the
    relation-yielding attempts. The open question is WHERE they diverge: only at
    the final degree, where the missing pivot is itself the relation signal and
    the fallback is a cheap tail, or earlier.
    (C2) PREDICTION (heuristic H1). In regime A (descent to F_2 with field
    equations), every Macaulay entry is an F_2-affine function of the n target
    bits r = coords(x_R). After the reference row operations are replayed,
    each pivot entry is a Boolean polynomial e_k(r), and a nonconstant e_k
    vanishes on about half of the targets. Under strict replay, the retention
    (the fraction of attempts matching the reference trace) is therefore about
    2^{-K}, where K is the number of r-dependent pivots. The first divergence
    comes at the first r-dependent pivot.
    PREDICTION (H2, a Schwartz-Zippel bound). In regime B (no descent; system
    over F_{2^n}), the fraction of targets that break the trace before the final
    degree is at most sum_k d_k / 2^n. There, trace reuse holds for the
    unsatisfiable arm.
    (C3) THE PREMISE IS SPLIT ACROSS REGIMES (derived, no compute). "XOR only"
    arithmetic is regime A, where C2 predicts the trace is unstable.
    "Carry-less multiply" arithmetic is regime B, where the trace is predicted
    stable but the system has degree 2^l in each unknown (the subspace
    polynomial L_V). Its dense Macaulay matrix at the balanced l = 9, n = 17 is
    about 37.5 GB. The "thousands of systems per warp" assumption already fails
    for DENSE FULL Macaulay matrices at the smallest cell. For regime A at
    n = 17, l = 9, one matrix is 38.96 KiB at D = 3 and 1.41 MiB at D = 4. A
    warp's maximum register file is 32,640 B (255 registers x 32 threads x 4 B),
    and an H100 SM's shared memory is 228 KB. The premise survives the sizing
    test only if the matrices F4 actually reduces, after trace pruning, are
    about 1000x smaller than full Macaulay. That ratio is a recorded metric
    here.

  mechanism: >-
    OBJECT FRAME. Representation: R1. In regime A, x_1, x_2 (m = 2), or x_1, x_2,
    x_3 plus one chain node u (m = 3, chained S_3 per KN-TECH-b18366), are
    written in F_2 coordinates of a basis of the factor-base subspace V
    (dim l). The equations are Weil-descended to F_2 and multilinearized by the
    field equations c^2 = c. In regime B the same unknowns stay in F_{2^n} and
    are constrained by L_V(x_i) = 0, with no descent.
    Tracked object: the elimination trace of the degree-D Macaulay matrix under
    fixed row order and degrevlex column order (constant monomial LAST), at
    three nested granularities:
    T_rank (the rank at each degree of the ladder);
    T_set (the canonical RREF pivot-column set plus the set of rows dependent
    on earlier rows, i.e. the reductions to zero);
    T_strict (the exact (pivot row, pivot column) sequence of one fixed
    deterministic elimination, which is what a branch-free replay needs).
    T_strict equal implies T_set equal, which implies T_rank equal.
    Operation set Sigma: RE-TARGETING. A fresh attempt R' = aP + bQ replaces
    x_R. V, the curve, D, the row order and the column order stay fixed. This is
    translation by a random element, acting transitively on targets.
    TRICHOTOMY: BRANCHING. The trace is a function of x(R) (a projection of the
    group element up to sign, read in a chosen coordinate system). Under
    re-targeting, a nonconstant lossy projection cannot propagate
    deterministically (IDEA-20260806-c5d183; KN-FIND-ffe1df Theorem C, the
    homomorphism form), and Proposition S shows the trace is NOT constant,
    because it refines the satisfiability indicator. So the trace propagates to
    a fresh attempt only with a probability, the retention, and that
    probability is the one open number. The relation vector itself is
    untouched and remains Class I, partial-action.
    LOSSY-PROJECTION TEST, AGAINST Sigma = re-targeting. The trace discards
    every numerical entry of the eliminated matrix and keeps only its pivot
    pattern. It is lossy if many targets share a trace. The test is
    quantitative and built into the design: the number of distinct traces
    among N sampled targets and the empirical trace entropy H(T).
    P-GPU needs H(T) close to the binary entropy of P_sat, i.e. the trace
    carries at most the satisfiability bit. C2 predicts H(T) close to log2 N at
    T_strict in regime A: the projection is effectively INJECTIVE on the
    sample, which makes it a change of coordinates and useless for replay.
    Unusually, the desired outcome here is a nearly CONSTANT projection, not an
    informative one. The test is passed or failed by measurement, and both are
    informative.
    PROPOSITION S (proof; applies to both regimes). Let I_r be the ideal
    generated by the attempt's equations. In regime A it also contains the
    field equations c_i^2 + c_i, so I_r is radical and zero-dimensional with
    V(I_r) in F_2^N. In regime B it contains L_V(x_i), which is separable with
    all roots in V, subset of F_{2^n}, so I_r is again radical with rational
    points. Every row of the degree-D Macaulay matrix is (the multilinear
    reduction of) an element of I_r, so every element of its row space R_D
    vanishes on V(I_r). If the attempt is satisfiable (V(I_r) nonempty), the
    constant 1 does not vanish there, so 1 is not in R_D for ANY D. With the
    constant monomial as the last column, "1 in R_D" is equivalent to "the
    constant column is a pivot column of the RREF". An unsatisfiable reference
    with 1 in R_{D*} therefore has a pivot that no satisfiable instance has at
    D*, so T_set, and hence T_strict, differ. In regime A the rank deficit
    cols_D - rank_D is at least the rank of the evaluation matrix of the
    degree-<=D multilinear monomials on the s solutions: at least 1, and at
    least s at D = N. QED. This is exact, costs no compute, and is also an
    instrument check: a satisfiable instance matching an unsatisfiable
    reference's T_set at D* means the instrument is broken.
    THE EXPLANATIONS THE TEST DISCRIMINATES, and what each outcome means.
    E1 (coefficient degeneracy; the user's hypothesis). Regime-A instability is
    generic F_2 coefficient behaviour: the per-pivot hazard on r-dependent
    pivots is in [0.4, 0.6], and the S_3 family is as unstable as a
    same-support random F_2 family. Regime B is stable. MEANING: P-GPU as
    stated is dead in regime A. Any GPU design in regime A must be a trace-FREE
    batched masked elimination of fixed shape (see below), and its gain over a
    CPU is ordinary SIMD throughput, not replay.
    E2 (structural stability). The target-independent block x_1^2 x_2^2 + B of
    S_3 (after descent: kappa(V) quadratic forms, IDEA-20260922-37e02e) fixes
    most pivots, so K is small and regime-A retention exceeds the null family's
    by at least 10x. MEANING: a pruned trace, replaying only the
    r-independent part plus a masked tail, is viable in regime A, and P-GPU
    survives in modified form.
    E3 (satisfiability-localised divergence). Unsatisfiable attempts share one
    trace (E3 holds within regime B, or within regime A under E2), and
    satisfiable attempts diverge ONLY at degree D* at low-degree columns.
    MEANING: a "divergence-as-signal" replay is viable. The GPU replays; a
    missing pivot at D* flags a relation, and its solution is read from the
    deficient pivots, so the fallback is a tail rather than a full re-solve.
    WHAT THE TRACE BUYS, as a number. A fixed-shape, branch-free MASKED
    elimination (the pivot row selected by conditional XOR, with no
    data-dependent branch) needs no trace at all, because the Macaulay shape is
    fixed by (n, l, D). A trace saves only the rows that reduce to zero and the
    structurally-zero blocks. The saving ratio, ops(masked full elimination) /
    ops(trace replay), is therefore the whole constant at stake, and it is
    measured per cell.

