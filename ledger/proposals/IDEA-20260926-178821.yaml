  priority_rationale: >-
    Zero-compute content (the row, the identification of rho as its oracle,
    the closure of the lever from above) is immediately useful to the
    reachability table and reframes the seam: an arity-m oracle need not be
    paired with relation collection at all once m is large enough, and the
    honest target for "an oracle polynomial in m" is a non-generic knapsack
    solver over a cyclic-shift-orbit base. The measurement is cheap and its
    predicted outcome (a structural coverage deficit) is informative either
