  minimal_test:
    design: >-
      STAGE 0 (zero compute): recompute (A)'s m = 23 under H1 at n = 131;
      write the soundness clause and the tau-NAF upper bound. STAGE 1 (toy,
      exhaustive): on each Koblitz cell build F_Q for a random Q, verify the
      Z[tau] identity and the weight-2 collision, enumerate all signed subsets
      of weight w = 1..W (W chosen so the count stays below 2^26), record the
      multiset of sums, distinct-sum count, rho_w, coverage of Z/lZ, and
      m_cap; repeat on the relabelled Z/lZ control (must agree exactly) and
      on 10 random bases of 4n points (H1 reference). STAGE 2 (oracle floor):
      on n in {23, 29, 31} run (i) matched rho with negation and Frobenius
      classes to a certified solve, 50 seeds, and (ii) a Frobenius-
      canonicalised two-list MITM over F_Q at weight m_cap, and report the
      operation-count ratio. STAGE 3 (zero compute): write the ECC2K-130 row
      with m_cap extrapolated under H2 and the budget 2^60.81. No non-generic
      solver is attempted.
    cell:
      curve: >-
        PRIMARY: Koblitz y^2 + xy = x^3 + 1 over F_2[t]/(t^19 + t^5 + t^2 + t
        + 1), group order 4 * 130873 (my arithmetic, t_19 = 797; recompute and
        prove primality at setup). LADDER: a = 0 Koblitz at n in {23, 29, 31}
        with (order)/4 prime (verified at setup). COMPOSITE CONTROL: n = 17,
        order 4 * 137 * 239. ORDINARY CONTROL: the n = 19 CERTBIN cell
        (A = 46693, B = 306147, h = 2). GENERIC CONTROL: Z/lZ relabelled,
        l = 130873.
      m: >-
        w = 1..5 enumerated at n = 19 (C(76,5) * 2^5 about 5.9e8 is too many;
        cap at w = 4, about 2.1e7, and sample w = 5); m_cap measured; the
        ECC2K-130 row is stated at m about 23 nominal.
      l: not applicable (no subspace; base is the 4n conjugates)
      factor_base: >-
        F_Q, the 4n points +-sigma^j P and +-sigma^j Q for 0 <= j < n;
        target-dependent.
      targets: >-
        20 random Q per cell for coverage (the sumset depends on Q only
        through the Q-orbit; report the spread); 50 seeds for rho.
      seeds: enumerated 0..49, recorded.
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py (group law pattern)
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (n = 17 only; a general-n variant is NEW, about 150 lines)
      - 'NEW: conjugate-base builder, signed-subset enumerator with a hash map of sums (memory 2^26 entries at most), rho with negation and Frobenius classes for toy n (about 200 lines), two-list MITM with Frobenius canonicalisation (about 100 lines); all pure Python'
      - 'missing: none'
    procedure:
      - 1. Build cell, recompute order, find lambda, verify tau^2 + tau + 2 = 0 on random points.
      - 2. Enumerate weight-w signed subsets, hash sums, compute rho_w and coverage; exhibit the weight-2 collision.
      - 3. Repeat on Z/lZ relabelled (exact agreement) and on random bases (birthday reference).
      - 4. Measure m_cap as the least w with coverage >= 1 - 1/e, per Q.
      - 5. Stage 2 rho and MITM on the ladder cells; certificate-verify every solve.
    metrics:
      - name: rho_w
        unit: dimensionless
        definition: (number of signed weight-w subsets) / (number of distinct group elements they sum to)
      - name: coverage_w
        unit: fraction of Z/lZ
        definition: distinct sums at weight <= w divided by l
      - name: m_cap
        unit: arity (integer)
        definition: least w with coverage_w >= 1 - 1/e
      - name: ops_rho, ops_mitm
        unit: group operations to a certified solve
        definition: instrumented counters, 50 seeds, mean and 90th percentile
    controls:
      - RELABELLED Z/lZ (blocking, exact agreement on rho_w and coverage).
      - RANDOM BASE of 4n points in the target subgroup, 10 draws (the H1 reference; blocking for interpreting a deficit).
      - ORDINARY CURVE n = 19 (row degenerates to 4 points; must agree with H1 trivially).
      - COMPOSITE n = 17 (bracket-vanishing positive control).
      - WEIGHT-2 COLLISION FIXTURE (the exhibited Z[tau] identity; blocking).
      - CERTIFICATE re-verification of every rho and MITM solve.
    outcomes:
      positive: >-
        rho_w > 1 growing in w on every Koblitz cell, absent on the random
        base, equal on Z/lZ: the coverage deficit is a Z[tau]-module fact;
        m_cap at n = 131 is above 23 by the extrapolated deficit, and the
        row is written with that arity and the full rho budget. Under the
        second reading (docs/inventor-protocol.md section 4), the small
        structured sumset is the object a non-generic solver would exploit,
        handed forward.
      negative: >-
        rho_w = 1 + birthday on the Koblitz cells (no structural redundancy
        beyond chance): H1 holds for the conjugate base, m_cap = 23 stands,
        and (C)'s mechanism is refuted on the tested cells (the exhibited
        weight-2 collision would then have to be an isolated identity, which
        the enumeration would show).
      artifact: >-
        Curve and Z/lZ disagree, or the random base shows the same deficit:
        instrument defect (sign handling or hashing), nothing read.
    falsification_threshold: >-
      Stated before any run: (C) is falsified if rho_3 on the n = 19 Koblitz
      cell is within 1.5x of the random base's rho_3 averaged over 10 draws;
      (B)'s generic-floor reading is falsified if ops_mitm / ops_rho decreases
      by more than 4x from n = 23 to n = 31.
    estimated_cost:
      implementation: medium
      compute: >-
        ESTIMATE, order of magnitude: 2^24 to 2^26 group additions per cell
        for the enumeration, 50 rho runs at 2^7 to 2^11 iterations each, and
        an MITM of 2^12 to 2^16 additions; minutes to an hour per cell in
        pure Python.
    required_metrics:
      - rho_w, coverage_w, m_cap per cell per Q, curve versus Z/lZ versus random base
      - ops_rho and ops_mitm per ladder cell with certificates
      - bracket_vanishing_rate per cell
      - termination_reason (completed | timeout | crash)

  falsification_conditions:
    - 'rho_2 = 1 on a Koblitz cell where the weight-2 identity is verified: contradiction, instrument defect, nothing read.'
    - 'rho_w on the curve differs from rho_w on the relabelled Z/lZ control at any w: instrument defect.'
    - 'rho_3 within 1.5x of the random base: (C) refuted on that cell; the row keeps H1 arity 23.'
    - 'ops_mitm / ops_rho decreasing by more than 4x across the ladder: (B) generic-floor reading is wrong for this instrument and is withdrawn.'
    - 'A decomposition with nonvanishing bracket that does not yield k: the soundness clause is wrong; record withdrawn.'

  confounders:
    - >-
      Q-DEPENDENCE. The sumset depends on Q through the second orbit; 20
      random Q per cell with the spread reported; a deficit that varies
      wildly with Q is reported as such.
    - >-
      SIGN AND ZERO DIGITS. Signed subsets with repeated indices are excluded
      by construction (digits in {-1, 0, 1}); the multiset count must use the
      same convention on every arm.
    - >-
      SMALL l. At n = 19, l = 130873 is small enough that coverage saturates
      by w = 4 or 5; the redundancy at larger w is measured only on the
      ladder cells and by sampling.
    - >-
      TOY rho. At n = 19 matched rho needs about 74 iterations, too few for
      a stable ratio; Stage 2 uses n >= 23 and 50 seeds and still reports
      wide intervals.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT. The row's oracle budget equals matched rho by
      construction and rho is the row's generic solver; the record proposes
      no non-generic solver and names its object (a cyclic-shift-orbit
      knapsack in normal basis) as open.
    - >-
      KN-OPEN-020 CLASS: target-dependent (the open class), charged in
      mechanism; nothing here bears on the bounded-degree no-go.
    - >-
      The lossy-projection test fails for the selection vector (it is the
      tau-adic logarithm) and this is stated; the tracked object is the
      sumset structure, whose test passes.
    - >-
      Toy scale n <= 31; the ECC2K-130 arity is an extrapolation under H2
      and is labelled so wherever it appears.
    - >-
      FORWARD GUIDANCE: (i) whether the weight-w sumset of the conjugate
      base has an algebraic description in normal basis (a code-like object)
      that a Weil-descended system could use; (ii) the same row for K-233
      through K-571, where the cofactor is 4 and l is prime, with base 4n
      conjugates; (iii) whether the coverage deficit is USEFUL rather than
      harmful: a smaller reachable set at fixed weight is a smaller search
      space for a structured solver, which is the second reading.

  heuristic_assumptions:
    - id: H1
      statement: >-
        UNIFORM SUMS. For the 4n-point conjugate base, the number of signed
        weight-m subsets summing to a given target is Poisson with mean
        (4n)^m / (m! 2^{n+2}) (2^{n+2} about the group order), so m_cap
        solves (4n)^m / m! = 2^{n+2}; at n = 131 this gives m = 23.
      rigorous_support: >-
        The mean is exact by KN-FIND-007's double count. The Poisson shape and
        the coverage it implies are the heuristic; this record's (C) predicts
        it FAILS for this base, and the minimal test measures the failure.
      validation_plan: >-
        SAMPLE: exhaustive enumeration at n = 19, w <= 4; sampled at w = 5 and
        on n in {23, 29, 31}. COMPARISON: distinct-sum counts against the
        Poisson coverage 1 - exp(-mu). TAIL: the most-represented sum's
        multiplicity against the Poisson tail (over-dispersion is the
        signature of concentration). TRANSFER: none claimed; H2 carries the
        extrapolation.
    - id: H2
      statement: >-
        REDUNDANCY GROWTH. log2(rho_w) at fixed w grows at most linearly in n
        across the ladder, so m_cap(131) = 23 + Delta with Delta bounded by
        the extrapolated deficit, and in any case m_cap(131) <= about 88 by
        the tau-NAF bound on each generator.
      rigorous_support: >-
        The tau-NAF existence and density-1/3 statements (Solinas 2000,
        recalled) give the unconditional upper bound; the growth law is a
        heuristic about how many Z[tau]-relations of small norm intersect a
        weight-w window, imitating the counting of short vectors in a
        rank-2 lattice.
      validation_plan: >-
        SAMPLE: rho_w at w in {2, 3, 4} across n in {19, 23, 29, 31}.
        COMPARISON: fit of log2(rho_w) against n per w. TAIL: the largest
        collision class at each w. TRANSFER ASSUMPTION, stated: a fit over 12
        bits of n is extrapolated to 131 as a heuristic and reported with its
        interval; the tau-NAF bound is the only unconditional statement.

  heuristic_note: >-
    (A)'s algebra and (B)'s identification of rho as the generic oracle are
    unconditional. (A)'s m = 23 is H1 and is predicted to be an
    underestimate; the a-priori expectation is a measured deficit at every
    Koblitz cell, with the row's true arity above 23 and its budget unchanged.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. The row's oracle budget is exactly matched rho,
      2^60.81, and its generic solver attains it; a non-generic solver is not
      proposed. Against the product law's m = 8 row (oracle 2^25.2 per
      attempt in KN-FIND-aa2efc's linear reading), the row trades 2^35 more
      oracle budget for zero relations and zero linear algebra.
    memory_exponent: >-
      524 points and one walk state for the generic solver (rho's O(1) per
      walk); a two-list MITM at the row's arity would need sqrt(l / 131) =
      2^61 stored sums and is dominated.
    best_known: matched rho, 2^60.81 (KN-FIND-aa2efc).
    hidden_overhead: >-
      The soundness clause's 1/l failure and the m! symmetry of subsets are
      constants; the arity m_cap at n = 131 is the one unmeasured number and
      is disclosed as an extrapolation.
    tradeoff_note: >-
      The row sits at rho's own point on the time-memory plane; its whole
      content is to say which non-generic structure a better point would
      need. Parallelisation is rho's (van Oorschot-Wiener).

  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Pure Python; the enumeration at n = 19 is 2^24 to 2^26 additions; the
      ladder cells sample; toy rho at n <= 31 is seconds per seed.

  asymptotic_claim:
    problem: ECDLP on ECC2K-130 by one decomposition over the target-dependent known-log conjugate base
    prior_best: matched rho 2^60.81 (which this record identifies as the row's generic oracle)
    time_exponent: unchanged (1/2 in l, with the 1/sqrt(131) class factor)
    memory_exponent: O(1) per walk (rho) for the generic solver
    hidden_cofactor: the row's true arity m_cap at n = 131, measured only by extrapolation
    claim_kind: table_row_plus_structural_identification

  dominated_by: >-
    Matched rho with negation and Frobenius classes, 2^60.81 at O(1) memory
    per walk, which IS the row's generic oracle and therefore ties it on time
    and dominates every memory-heavy generic variant (two-list MITM at 2^61
    memory; BSGS at 2^64.5). Checked against every frontier row: multi-target
    and preprocessing rows are untouched (single target, no advice);
    Esser-May-type low-memory low-weight solvers (KN-LIT-4794, reported)
    interpolate to Pollard's sqrt and do not beat it without a planted
    promise. The record claims no point below rho and says so.

