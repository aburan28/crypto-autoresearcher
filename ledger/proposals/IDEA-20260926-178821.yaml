idea:
  id: IDEA-20260926-178821
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE ARITY LEVER ENDS AT A KNOWN-LOG BASE: over the 524 signed Frobenius
    conjugates of P and Q, one decomposition of Q at arity about 23 solves
    ECC2K-130 with zero relations and zero linear algebra, rho is exactly its
    generic oracle, and the Z[tau]-redundancy of that base's sumset is the
    measurable number that fixes the true arity

  class: mechanism

  claim: >-
    (A) A ROW THE PRODUCT LAW DOES NOT CONTAIN. KN-FIND-aa2efc's law charges
    relations x targets x oracle with relations about B and targets about
    m! 2^131 / B^m, and every m >= 4 row in this lane pairs an expensive
    oracle with a relation-collection phase and a linear-algebra phase. Take
    instead the TARGET-DEPENDENT factor base F_Q = {+-sigma^j(P), +-sigma^j(Q)
    for 0 <= j < 131}, 524 points whose logarithms are all known in terms of
    the one unknown k = log_P Q: log(sigma^j P) = lambda^j and log(sigma^j Q)
    = lambda^j k, where lambda is the Frobenius eigenvalue on the order-l
    subgroup (lambda^131 = 1 mod l, the tau-adic scalar every rho-with-
    Frobenius implementation already uses, KN-LIT-661e97's "correspondence of
    sigma with its eigenvalue s"). A single decomposition
    Q = sum_j eps_j sigma^j(P) + sum_j delta_j sigma^j(Q), eps, delta in
    {-1, 0, 1}, gives k (1 - sum delta_j lambda^j) = sum eps_j lambda^j, hence
    k unless the bracket vanishes mod l (probability about 1/l). NO relation
    collection, NO linear algebra, ONE oracle call. Under the product law's
    own accounting the row reads relations = 1, targets = 1 / mu, and the
    ENTIRE matched-rho budget 2^60.81 is available to the oracle. The
    coverage heuristic H1 puts mu = 524^m / (m! 2^131) at 1 for m = 22.6
    (my arithmetic: 22 * 9.03 - 61.1 - 131 = 6.5 bits short, 23 * 9.03 -
    74.5 - 131 = +2.2 bits over), so the row's nominal arity is m = 23 with
    about 4 decompositions per instance. Compare aa2efc's "m = 8 needs an
    oracle at 2^25.2 per attempt": here m = 23 needs an oracle at 2^60.8 per
    attempt, once.

    (B) RHO IS THIS ROW'S GENERIC ORACLE, AND THE TWO FAMILIES MEET. Bailey et
    al.'s iteration P_{i+1} = sigma^j(P_i) + P_i with j in 3..10 (KN-LIT-661e97)
    starts from Q + sum_i c_i sigma^i(P) and every walk point is, by
    construction, a Z[tau]-combination of P and Q of slowly growing weight; a
    collision between two walks is exactly a relation of the form in (A) with
    weight equal to the two walks' combined tau-adic weight. So the
    distinguished-point method is a random-walk knapsack solver over F_Q, and
    its cost, sqrt(pi l / (4 * 131)) = 2^60.81, is the generic floor for the
    row: by Shoup's argument (KN-TECH-005 as quoted in IDEA-20260901-863e36
    C4) any oracle using only group operations, equality tests and the
    Frobenius automorphism costs Omega(sqrt(l / 131)) whatever m is. THE
    STRUCTURAL CONTENT: pushed to its end, the arity lever RECOVERS rho. This
    is the closure of the lever from above, and it says exactly what an m = 23
    oracle would have to be: a NON-GENERIC knapsack solver over the conjugate
    base, i.e. one that reads x-coordinates. In normal basis those
    x-coordinates are the 131 cyclic shifts of x(P) and the 131 cyclic shifts
    of x(Q): the base is two cyclic-shift orbits, the most structured base
    this lane could name, and its exploitation is the open object.

    (C) THE NUMBER THAT FIXES THE ROW'S ARITY, WHICH H1 GETS WRONG BY
    CONSTRUCTION. H1 (uniform sums, KN-FIND-007's Poisson reading) predicts
    m = 23. But the conjugate base is not a random set: it satisfies
    Z[tau]-relations of norm 2, e.g. tau^2 P + tau P + 2P = O on y^2 + xy =
    x^3 + 1 (tau^2 + tau + 2 = 0 because the curve has 4 points over F_2,
    trace -1), so sigma^3 P + sigma P = 2P = -(sigma^2 P + sigma P) EXACTLY:
    two DISTINCT weight-2 subsets with the same sum. Such collisions are
    structural and dense, so the number of DISTINCT elements reachable at
    weight m is materially below 524^m / m!, coverage of Z/lZ is below H1's
    Poisson prediction, and the true m_cap at which a random instance
    decomposes with probability 1 - 1/e is ABOVE 23 (the tau-NAF bound says
    every scalar has a representation of weight about 131/3 = 44, so 23 <=
    m_cap <= about 88 for the two-generator form). KN-FIND-007's identity
    fixes the MEAN number of representations exactly; what collapses is
    COVERAGE, the failure mode that finding measured at 1224x for a
    small-multiples base. The redundancy factor rho_w = (number of weight-w
    signed subsets) / (number of distinct sums at weight w) as a function of
    w on toy Koblitz cells is the measured quantity, and its growth in w is
    what sets m_cap at n = 131. STATED SO IT CAN FAIL: rho_w > 1 at every
    w >= 2 on every Koblitz cell, growing with w, and exactly reproduced on
    the relabelled Z/lZ control (it is a property of the Z[tau]-module, not
    of coordinates), while a size-matched RANDOM base of 4n points reads
    rho_w = 1 + O(w^2 / |sumset|).

    (D) WHY THIS IS NOT THE LOW-HAMMING-WEIGHT DLP OF RQ-LHW-1877bb, AND WHY
    IT IS ADJACENT. That question asks for low-storage algorithms matching
    sqrt(binom(m, w)) for a logarithm of PLANTED low weight in a generic
    group; here the logarithm is arbitrary and the low-weight object is a
    tau-adic representation of Q over BOTH generators, whose existence is
    guaranteed by (A)'s counting rather than planted. The generic-model
    solvers there (Stinson splitting, Esser-May 2^{0.65 n} as reported in
    KN-LIT-4794) apply to this row verbatim and all sit at or above sqrt(l /
    131) once the promise is not planted; their transplant is a CONTROL here,
    not the object.

    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, normal-basis x-coordinates in
    which the base is two cyclic-shift orbits; the attack stage whose charged
    cost changes is the RELATION-COLLECTION and LINEAR-ALGEBRA stages, which
    vanish, moving the whole charge onto one decomposition.

  mechanism: >-
    OBJECT FRAME. Representation: R1, the pair (selection vector s in
    {-1,0,1}^262 over the conjugates, and the x-coordinates of the base in
    normal basis, where sigma acts as a cyclic shift of the coordinate vector
    and as a cyclic shift of the selection vector). Operation set Sigma: {add
    one base element (flip one selection digit), apply sigma (rotate both
    the selection vector and every x-coordinate)}. Sigma is not the full
    translation action; it is translation by the 524 base elements only.

    TRICHOTOMY, STATED HONESTLY. The selection vector s is Class I,
    partial-action: it propagates deterministically under Sigma (a digit
    flip and a rotation), exactly as any relation vector does. THE
    LOSSY-PROJECTION TEST FAILS FOR s AND THE RECORD SAYS SO: the map from a
    point R to a weight-m selection vector s with s(tau) applied to (P, Q)
    equal to R is not a projection of R at all but a PREIMAGE under the
    knapsack map, and a minimal-weight s IS the tau-adic discrete logarithm
    (for the P-only base, s(tau) = k in Z[tau]/(Phi)). So s is a change of
    coordinates on the answer, not a lossy object. What this record TRACKS is
    therefore not s but the SUMSET STRUCTURE of the base: the multiset of
    sums at weight w, its distinct-value count, and its redundancy factor
    rho_w. That object is genuinely lossy (it discards which subsets produced
    each sum), it propagates deterministically under sigma (rotation permutes
    the weight-w subsets and fixes the multiset of sums up to relabelling by
    lambda), and its one-step propagation under "add one base element" is
    the convolution of the weight-w multiset with the base, which is exactly
    what the minimal test enumerates. Class I, with Sigma = the 524
    translations plus sigma.

    THE PRICED OPEN NUMBER. For a Class I object the cost obligation is
    coverage (IDEA-20260806-c5d183's forward guidance): the mean is
    conservation-forced (KN-FIND-007), so the whole content is the coverage
    deficit rho_w, measured on toy cells. There is no orbit to canonicalise
    (sigma acts freely on the subsets and on Z/lZ minus 0, so the quotient is
    simply the 131-fold class reduction rho already takes).

    WHY THE ROW IS NOT A RENAMED KNOWN APPROACH. The corpus's arity records
    (KN-FIND-aa2efc, IDEA-20260803-fa9839, IDEA-20260808-2ef5c8,
    IDEA-20260727-003) all charge B relations and B^2 linear algebra; the
    Koblitz literature's Frobenius expansions (KN-LIT-584, KN-LIT-a4d0f1,
    recalled at title level) use tau-adic representations to SPEED scalar
    multiplication, not to define a decomposition base; KN-LIT-661e97's rho
    uses the conjugates as walk steps, not as a factor base. No record in the
    corpus states that the m -> large limit of the decomposition family with
    a target-dependent known-log base is rho, or asks for the coverage deficit
    of the conjugate sumset. IDEA-20260830-3e38ce's "known-log sets" are
    Bernstein-Lange table entries for preprocessing, a different object (F7),
    and that record is about transporting them across isogenies.

    KN-OPEN-020 CLASS. F_Q is a TARGET-DEPENDENT description (the open class
    that framework names): description O(1) (two points and sigma),
    membership free (524 explicit points), relation cost = the knapsack
    oracle, descent none, memory 524 points. It escapes the bounded-degree
    no-go not by degree but by being the target's own orbit.

    OFF-LIMITS COMPONENTS USED, NAMED. F1 (rho) appears as the generic
    oracle of the row, which is the point of (B); F2 (decomposition) is the
    family; F6 (Frobenius orbit) is the base's construction. What is added
    beyond all three: the identification of rho as the m -> large endpoint of
    the decomposition family, the explicit zero-relation row, and the
    coverage deficit as the row's one measurable parameter.

