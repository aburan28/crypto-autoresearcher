  assumptions:
    - >-
      lambda, the Frobenius eigenvalue on the order-l subgroup, is computable
      (a root of T^2 + T + 2 mod l with T^131 = 1); this is what every
      Frobenius-rho implementation already computes.
    - >-
      The row's algebra: a decomposition of Q over F_Q yields k unless
      1 - sum delta_j lambda^j = 0 mod l, an event of probability about 1/l
      per decomposition under H1 and reported exactly on toy cells.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F1, F2, F6 as named in mechanism.
    - Arithmetic only at deployed parameters; executable cells at n <= 31.

  proof_search_map:
    bottleneck: >-
      Two quantities. (i) The coverage deficit rho_w of the conjugate sumset,
      which fixes the row's true arity m_cap at n = 131 (the row exists at
      SOME m <= about 88 by the tau-NAF bound; the question is where). (ii)
      Whether any non-generic knapsack solver over a cyclic-shift-orbit base
      beats sqrt(l / 131); this record names (ii) as the open object and does
      not propose a solver.
    baseline_embedding:
      parameter_slice: >-
        The relabelled Z/lZ control with base {+-lambda^j, +-lambda^j k}: the
        same knapsack under the group isomorphism, whose sumset redundancy
        must equal the curve's EXACTLY (rho_w is a module invariant); and the
        size-matched random base, where rho_w must read the birthday value
        1 + O(w^2 / |sumset|). The ordinary n = 19 CERTBIN curve, with no
        Frobenius, degenerates the base to {+-P, +-Q} and the row to "m about
        log l / 2 with 4 points", where H1 and enumeration must agree
        trivially.
      reproduction_check: >-
        Symbolic: the identity tau^2 + tau + 2 = 0 on the a = 0 curve must be
        verified on the toy cell by computing sigma^2 P + sigma P + 2P = O for
        random P; the weight-2 collision sigma^3 P + sigma P = -(sigma^2 P +
        sigma P) must be exhibited numerically. Frozen fixture: rho_2 on the
        n = 19 Koblitz cell computed by exhaustive enumeration of the
        C(76, 2) = 2850 signed pairs.
    observation_collision:
      observable: >-
        (m_cap measured on the toy cell, rho_w for w = 1..5, and the ratio of
        the generic knapsack MITM cost to matched rho on the same cell).
      distinct_preimage_search: >-
        A low coverage could come from (i) genuine Z[tau]-redundancy, the
        claim, or (ii) a bug in sign handling (P and -P counted as distinct
        sums that coincide). Separated by the random-base control (same code,
        no redundancy expected) and by the exact weight-2 fixture.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The decomposition family with a target-dependent known-log base,
          read as a knapsack over Z[tau]/(Phi) with two generators; encoding
          exact; completeness (every k has a weight-<= 88 representation by
          tau-NAF on each generator) and soundness (a decomposition yields k
          unless the bracket vanishes) are proof obligations; transfer to any
          Koblitz curve; cost loss none.
        predicted_gain: >-
          The relation and linear-algebra columns of the product law drop to
          1 and 0; the entire rho budget is available to one oracle call; the
          arity lever's endpoint is identified as rho.
      - transform: observable_fiber
        proposed_object: >-
          Hold "a knapsack over 4n known-log points" fixed and vary the base
          structure: cyclic-shift orbits (the conjugates) versus a random base
          of the same size. The intrinsic invariant is rho_w.
        predicted_gain: >-
          Converts H1's m = 23 into a measured m_cap and exhibits the
          structure a non-generic solver would have to use.
    quantifier_order: >-
      FOR ALL Koblitz curves E_a / F_2 over F_{2^n} with group order 4l, l
      prime, and FOR ALL Q in the order-l subgroup, THERE EXISTS a
      decomposition of Q over F_Q of weight at most about 2n/3 (tau-NAF on
      each generator, recalled), and any decomposition of weight m with
      nonvanishing bracket yields k. The HEURISTIC statement: the least such
      m for a random Q is m_cap(n), predicted by H1 as the root of (4n)^m /
      m! = 2^n and predicted by this record to exceed it by an amount growing
      in n. NOT CLAIMED: any oracle below sqrt(l / 131).
    method_ceiling:
      strongest_certifiable_claim: >-
        "On toy Koblitz cells n in {19, 23, 29, 31}, the conjugate base's
        sumset has redundancy rho_w = [values] at w = 1..5 and coverage
        m_cap = [value], against H1's [value] and the random base's [value];
        rho is the generic oracle of the zero-relation row at 2^60.81 on
        ECC2K-130." It cannot certify anything about a non-generic knapsack
        solver, and it moves no exponent.
      nearby_object_control: >-
        The random base of 4n points in the same subgroup (H1 holds there,
        rho_w = 1 + O(w^2/|sumset|)); the ordinary curve (no conjugates, the
        row degenerates); the composite n = 17 Koblitz cell (not a prime-order
        target; the bracket-vanishing event has probability 1/137 or 1/239,
        a visible positive control for the soundness clause).
    proof_obligations:
      - claim: A weight-m decomposition of Q over F_Q with nonvanishing bracket determines k mod l.
        responsibility: correctness
      - claim: Bailey et al.'s walk points are Z[tau]-combinations of P and Q, so a DP collision is a decomposition of the form in (A).
        responsibility: baseline
      - claim: H1's m = 23 at n = 131 is recomputed, and m_cap on toy cells is measured by exhaustive enumeration.
        responsibility: success_probability
      - claim: rho_w on the curve equals rho_w on the relabelled Z/lZ control exactly.
        responsibility: correctness
      - claim: The random-base control reads rho_w at the birthday value.
        responsibility: baseline
      - claim: Nothing here proposes or bounds a non-generic knapsack solver.
        responsibility: scope

