idea:
  id: IDEA-20260828-f3c50e
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-28'
  title: >-
    THE CRATER'S CARDINALITY h(D_0) IS NOT ITS ONLY STRUCTURE: genus theory
    partitions the h(D_0) vertices into 2^{t-1} AMBIGUOUS (order-<=2 ideal
    class) vertices and the rest, where t = number of distinct prime factors
    of D_0 -- track the AMBIGUOUS-CLASS LABEL as a lossy projection of the
    crater distinct from the pure cardinality IDEA-20260826-d61c49 measures,
    and ask whether ambiguous-class curves are extremal in the campaign's own
    L1 functional battery relative to non-ambiguous crater vertices at
    matched h(D_0), matched p and matched N.
  class: mechanism

  claim: >-
    (A) THE OBJECT AND WHY IT IS NOT d61c49's OBJECT. IDEA-20260826-d61c49
    tracks |Cl(O_{D_0})| = h(D_0), a SCALAR, as a function of |D_0|. Genus
    theory (Gauss; standard, e.g. Cox "Primes of the form x^2+ny^2" ch. 3)
    gives Cl(O_{D_0})/Cl(O_{D_0})^2 order 2^{t-1} where t is the number of
    distinct prime divisors of D_0, and for a finite abelian group
    |G/G^2| = |G[2]|, so the number of AMBIGUOUS classes -- ideal classes [a]
    with [a]^2 = [1] -- is exactly 2^{t-1}. This is GROUP STRUCTURE, not
    cardinality: two discriminants can share the same h(D_0) while having
    different t (e.g. one prime, h(D_0) elements all of large order, vs a
    composite D_0 with the same h(D_0) but 2^{t-1} > 1 ambiguous classes),
    which d61c49's cardinality-only object cannot distinguish and does not
    claim to. The tracked object here, OBJ-AMBCLASS, is the binary label
    "is this crater vertex an ambiguous-class representative" applied to every
    vertex of an enumerated crater.
    (B) THE DISCRIMINATION, AT MATCHED h(D_0), p AND N. Select a D_0 with
    t >= 2 (so nontrivial ambiguous classes exist) inside the campaign's
    existing matched-order family design (fix N, sweep t so D_0 varies, per
    H-JINV-5a0b9e's own construction) or a fresh matched-p family with
    h(D_0) >= 4 and t >= 2. Enumerate the crater exactly (the campaign's
    Hurwitz-Kronecker-certified capability) and label every vertex ambiguous
    or not, cross-checked against the closed-form count 2^{t-1}. (H-null)
    Ambiguous-class vertices are NOT extremal in decomposition_rate_m2/m3,
    liftable_density, decomposition_efficiency, or the incidence-deviation
    statistic of IDEA-20260826-4bc5d2, relative to the other h(D_0)-1
    non-ambiguous vertices of the SAME crater -- i.e. class-group 2-torsion
    membership, like class-group cardinality, does not propagate to any
    measured cost functional, consistent with H-ENDO-001's admissibility
    argument once more. (H-signal) Ambiguous-class vertices show a
    reproducible rank shift (extreme or near-extreme rank within their own
    crater's distribution, analogous to H-JINV-5a0b9e's P5 but applied to a
    genus-theoretic label instead of the |Aut|=6 label) -- which would be a
    genuinely new mechanism: a class-group STRUCTURAL fact (not merely a
    cardinality fact) leaving a measurable trace. (C) NOT CLAIMED. No
    exponent; even a confirmed H-signal is at most a constant-factor,
    per-vertex fact inside one isogeny class, subject to the SAME T5
    reachability gate as every other L3 finding (a specified ambiguous vertex
    is exactly as hard to reach as any other specified crater vertex -- this
    proposal does not touch T5 at all). Under P3, no advantage over the
    automorphism-discounted rho baseline is asserted; the only thing at risk
    is whether a NEW, previously untracked class-group label correlates with
    anything, and H-null is the pre-registered, H-ENDO-001-consistent default.

  mechanism: >-
    THE LOSSY-PROJECTION TEST. The tracked object discards WHICH of the
    2^{t-1} ambiguous classes a vertex belongs to, WHICH non-ambiguous class
    every other vertex belongs to, and the entire Cayley-graph adjacency
    structure -- retaining only the single bit "order <= 2 in Cl(O_{D_0})."
    This is genuinely lossy (almost everything about the crater's structure is
    discarded) and it is discarded COMPATIBLY with the campaign's own
    operations: ideal-class order is a property of the abstract group Cl(O),
    computable once the crater is enumerated (the campaign already does this
    for the Hurwitz-Kronecker certificate), and it propagates deterministically
    -- every vertex has a well-defined, fixed class-group element regardless
    of which functional is later measured on it, so "ambiguous or not" is
    knowable before any L1 statistic is computed and is not itself derived
    from k or from any target.
    THE CANDIDATE MECHANISM, STATED HONESTLY AS UNPROVEN. An ambiguous class
    [a] with [a]^2=[1], a != [1], is represented by an ideal a = l for l a
    RAMIFIED prime ideal (l^2 = (ell)*unit for a prime ell | D_0). Unlike a
    split prime (which gives two distinct ideals l, lbar and hence two
    distinct isogeny directions from a vertex), a ramified prime gives l=lbar
    up to the relevant equivalence, so the ell-isogeny connecting a vertex to
    its ambiguous-class image is, in a sense that this record does NOT claim
    to have made precise, "self-paired" rather than "directional" in the
    crater graph. WHETHER this self-pairing leaves any trace in the
    RELATION-COLLECTION functionals this lane measures (which are properties
    of the CURVE EQUATION and the FACTOR BASE, not directly of the isogeny
    graph) is exactly the open question -- this record deliberately does NOT
    assert a causal chain from "self-paired ideal" to "different decomposition
    rate" because there is no rigorous argument for one in hand (unlike the
    |Aut|=6 mechanism of H-JINV-5a0b9e, which has an explicit orbit-counting
    argument). This record is honestly a MEASUREMENT record testing a
    plausible-but-unproven structural hypothesis, not a mechanism record with
    a derived causal chain, and its H-null default reflects the expectation
    that H-ENDO-001's admissibility argument generalizes here too, though it
    does not literally cover this object (class-group torsion is R3/R4, not a
    scalar action on G).

  novelty_status: unverified
  novelty_screen:
    method: >-
      Grepped all 49 RQ-JINV-8fc13a proposals for "ambiguous", "genus",
      "2-torsion", "Cl(O)", "class group structure"; read IDEA-20260826-d61c49
      in full (the nearest object, pure cardinality h(D_0)) and
      IDEA-20260811-99cc67 / H-JINV-5a0b9e (the nearest |Aut| mechanism, which
      uses group-THEORETIC separation of a different kind, |Aut| not Cl(O)
      torsion). Also checked RQ-KEX-b8be01 proposals that independently use
      "genus characters" (IDEA-20260813-2123f1 et al.) -- those are a
      different goal (KEX construction) using genus characters as PUBLIC
      LABELS in a key-exchange audit, not as a JINV cost-functional object,
      so they are adjacent literature on the same group-theoretic fact but not
      duplicates.
    results: >-
      d61c49 explicitly and only tracks |Cl(O_{D_0})| as a scalar function of
      |D_0|; it does not decompose the crater by class-group STRUCTURE
      (2-torsion / genus) at all. No JINV proposal computes or labels
      ambiguous ideal classes, cross-checks their count against the
      genus-theoretic formula 2^{t-1}, or tests them against the L1
      functional battery.
    verdict: >-
      UNVERIFIED. Distinct object (class-group 2-torsion structure, not
      cardinality), distinct mechanism candidate (ramified-prime self-pairing,
      explicitly flagged as unproven rather than asserted), distinct null
      design (within-crater rank test at matched h(D_0), not a between-|D_0|
      regression). No novelty claimed against the external genus-theory
      literature, which is classical and cited as such.

  citations:
    - ref: null
      provenance: recalled
      claim: >-
        Genus theory: for a fundamental discriminant D_0 with t distinct prime
        factors, Cl(O_{D_0})/Cl(O_{D_0})^2 has order 2^{t-1}, equal to
        |Cl(O_{D_0})[2]| (the ambiguous classes), realised by ambiguous binary
        quadratic forms (a,b,c) with a | b. Standard; e.g. D. Cox, "Primes of
        the Form x^2 + ny^2", chapter 3.
      verified_by: null
    - ref: IDEA-20260826-d61c49
      provenance: recalled
      claim: horizontal same-order view count equals h(D_0), the campaign's existing cardinality-only object
      verified_by: null
    - ref: KN-TECH-018
      provenance: recalled
      claim: automorphism-discounted rho baseline, sqrt(|Aut|) <= sqrt(6)
      verified_by: null

  assumptions:
    - >-
      A toy D_0 with t>=2 distinct prime factors and h(D_0)>=4 is
      constructible within the campaign's existing matched-order or
      matched-p family design.
    - Toy scale; the crater is small enough to enumerate exactly and cross-check against 2^{t-1}.
    - >-
      "Ambiguous" is determined by exact class-group computation on the
      enumerated crater (via its group structure, not merely via the
      closed-form count), so the label is verified per-vertex, not merely
      counted in aggregate.

  proof_search_map:
    bottleneck: >-
      Whether ambiguous-class vertices are extremal (or otherwise
      distinguishable) in the L1 functional battery relative to non-ambiguous
      vertices of the SAME crater. This is the single quantity separating "the
      class group's algebraic structure is invisible to relation-collection"
      from "some class-group structure beyond cardinality propagates."
    baseline_embedding:
      parameter_slice: >-
        The non-ambiguous vertices of the SAME crater (h(D_0)-2^{t-1} of
        them): the within-crater null distribution against which ambiguous
        vertices are ranked, at the SAME p, N, D_0 and density row as every
        other H-JINV-5a0b9e-style measurement.
      reproduction_check: >-
        Frozen fixture: on a committed toy crater, the enumerated ambiguous
        vertex count matches 2^{t-1} exactly before any functional is
        measured; disagreement is an enumeration defect, not a finding.
    observation_collision:
      observable: >-
        The within-crater rank of ambiguous-class vertices on each L1
        functional, at each density row.
      distinct_preimage_search: >-
        A collision to separate: an ambiguous vertex could rank extreme
        because of its genus-theoretic status, OR because it happens to sit
        near a special automorphism (|Aut|=6/4) vertex if D_0 in {-3,-4} --
        but t>=2 forces D_0 NOT to equal -3 or -4 alone in this design (both
        are prime discriminants, t=1), so this collision is excluded by
        construction: the D_0 chosen for this test cannot ALSO be a |Aut|>2
        discriminant, keeping the two mechanisms structurally disjoint.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A pack of several t>=2 discriminants (varying t and h(D_0)
          independently where possible) inside the matched-order family,
          giving a crossed design that separates "more ambiguous classes"
          from "larger class number" the way d61c49 could not.
        predicted_gain: >-
          Isolates the GENUS-STRUCTURE axis from the CARDINALITY axis, which a
          single crater cannot do alone.
    quantifier_order: >-
      FOR EACH toy crater with t>=2, FOR ALL density rows, EXISTS or does not
      exist a rank shift of the ambiguous-class vertices relative to a uniform
      rank expectation within their own crater. The weaker order (EXISTS one
      crater, one density row with an extreme ambiguous vertex) is explicitly
      NOT claimed and would not support H-signal without surviving the
      multi-crater pack.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, on these craters, ambiguous-class vertices do or do not
        rank extreme in the L1 functional battery relative to non-ambiguous
        vertices of the same crater. It cannot certify a mechanism (the
        ramified-prime self-pairing story is explicitly not proven here),
        cannot certify anything about solving cost, exponent, or crypto scale,
        and does not touch T5 reachability.
      nearby_object_control: >-
        A SPLIT-prime-derived non-ambiguous vertex adjacent (one isogeny step)
        to an ambiguous vertex: it shares the crater and a similar local
        graph position but not the order-<=2 property, isolating the
        genus-theoretic label from mere graph-distance-to-E0 effects.
    proof_obligations:
      - claim: Enumerated ambiguous vertex count equals 2^{t-1} exactly.
        responsibility: correctness
      - claim: The chosen D_0 has t>=2 and is not -3 or -4, excluding the |Aut| collision.
        responsibility: interface
      - claim: No T5 reachability claim, no exponent, no attack is made even if H-signal holds.
        responsibility: scope

  predictions:
    - metric: within-crater rank of ambiguous-class vertices vs non-ambiguous, per L1 statistic, per density row
      direction: different
      minimum_effect: >-
        PRE-REGISTERED NULL EXPECTATION: uniform rank distribution (no
        systematic extremity). A reproducible rank shift surviving the
        multi-crater pack and the adjacent-vertex control is H-signal and
        triggers independent review before it is named a mechanism.
    - metric: enumerated ambiguous count vs 2^{t-1} across the crater pack
      direction: different
      minimum_effect: Exact agreement; disagreement is an enumeration defect, reported as such.
    - metric: rank-shift magnitude regressed on t (number of prime factors) across the pack, at matched h(D_0) where possible
      direction: different
      minimum_effect: >-
        Flat under H-null. A monotone trend in t surviving the adjacent-vertex
        control is the sharpest form of H-signal.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): identify a toy D_0 with t>=2, h(D_0)>=4 inside
      the existing matched-order family design or a fresh matched-p search;
      compute 2^{t-1} and pre-register the expected ambiguous count. STAGE 1:
      enumerate the crater exactly, verify the count. STAGE 2: run the L1
      battery on every vertex, compute within-crater ranks of ambiguous
      vertices. STAGE 3: repeat for a pack of 3-4 further t>=2 discriminants.
      THE CHEAPEST KILL is STAGE 2 on the first crater: if ambiguous vertices
      already show uniform rank there, H-signal is already unsupported for
      that crater.
    controls:
      - non-ambiguous vertices of the same crater (blocking, the within-crater null)
      - adjacent split-prime-derived non-ambiguous vertex control
      - multi-crater pack varying t independently of h(D_0) where feasible
      - exclusion of D_0 in {-3,-4} to keep the |Aut| mechanism structurally disjoint
    required_metrics:
      - enumerated ambiguous count vs 2^{t-1}
      - per-vertex L1 statistics with ambiguous/non-ambiguous label
      - within-crater rank and exact permutation p-value for ambiguous vertices
      - rank-shift vs t regression across the pack

  falsification_conditions:
    - >-
      F1. Enumerated ambiguous count disagrees with 2^{t-1}. Enumeration
      defect; returns to executor, no functional comparison reported.
    - >-
      F2 (MAIN NEGATIVE, A RESULT). Ambiguous-class vertices show uniform
      rank (no systematic extremity) across the crater pack. Class-group
      2-torsion structure joins class-group cardinality (d61c49, if it closes
      the same way) as a lossy projection the campaign's L1 functionals
      cannot see, and the record states the named obstruction: relation-
      collection statistics are properties of the curve equation and factor
      base, and this genus-theoretic label does not reach them any more than
      cardinality does.
    - >-
      F3. The D_0 chosen accidentally coincides with a |Aut|>2 discriminant
      (should be impossible by construction, but checked). Design defect;
      record withdrawn as mis-specified, not refuted.
    - >-
      F4 (P3-style). A reproducible rank shift survives the pack and the
      adjacent-vertex control. Work STOPS for independent review before any
      record calls this a mechanism, since the candidate causal chain
      (ramified-prime self-pairing) was explicitly not proven here.

  confounders:
    - >-
      D_0 in {-3,-4} would confound with the |Aut| mechanism; excluded by
      construction and checked as F3.
    - Graph distance from the base vertex E0 could itself correlate with functional values; the adjacent-vertex control checks this.
    - p is a residual covariate across any matched-order-style family; reported alongside t and h(D_0).
    - Toy scale: h(D_0)>=4 with t>=2 is a short ladder at toy p; drift across the pack is reported, not averaged away.

  interpretation_limits:
    - claim_tier toy; toy N and D_0; no cryptographic-scale statement.
    - >-
      No T5 reachability claim is made or implied: a specified ambiguous
      vertex is exactly as hard to walk to as any other specified crater
      vertex, and this record does not change that.
    - >-
      The candidate mechanism (ramified-prime self-pairing) is explicitly
      unproven; this record is a measurement testing a plausible hypothesis,
      not a derivation, and any H-signal result would need a genuine
      mechanism record as a successor before it could be called understood.
    - Any advantage at or below the sqrt(|Aut|) discount remains baseline calibration (KN-TECH-018); this record does not touch |Aut| at all by construction (D_0 not in {-3,-4}).

  heuristic_assumptions:
    - id: H1
      statement: >-
        The enumerated ambiguous-class vertex count on a toy crater equals
        2^{t-1} exactly, where t is the number of distinct prime factors of
        D_0, matching the genus-theoretic prediction Cl(O)/Cl(O)^2 =
        Cl(O)[2] for a finite abelian group.
      rigorous_support: >-
        Classical genus theory (Gauss; Cox ch. 3): elementary and exact, not
        asymptotic. Recorded as a numbered heuristic only because the
        campaign's enumeration is an operational step that can fail
        independently of the mathematics, exactly as HEUR-JINV-1 in
        H-JINV-5a0b9e treats its own certification step.
      validation_plan: >-
        Enumerate ambiguous classes directly (by group-order computation on
        the enumerated crater) at several toy D_0 with varying t; compare to
        2^{t-1}; a single disagreement is treated as an enumeration defect and
        triggers PREMISE-FAILED for that crater, not as tolerated noise.
    - id: H2
      statement: >-
        Ambiguous-class membership, like class-group cardinality, does NOT
        propagate to any L1 relation-collection functional, so within-crater
        rank of ambiguous vertices is uniformly distributed under the null.
      rigorous_support: >-
        No rigorous support is claimed for this direction beyond the
        analogy to H-ENDO-001's admissibility argument (class-group-theoretic
        facts are, so far in this campaign, invisible to the group action on
        G) and to d61c49's parallel finding for cardinality, if it closes that
        way. This is recorded honestly as the DEFAULT expectation, not a
        proven fact, which is why H1 (the enumeration identity) carries
        rigorous support and H2 (the null propagation claim) does not --
        the asymmetry is the point of running the experiment.
      validation_plan: >-
        Direct measurement per the minimal_test design above; the validation
        IS the experiment, since no external theorem is available to check
        against; the multi-crater pack and adjacent-vertex control substitute
        for an external distributional comparison.

  target_complexity:
    time_exponent: >-
      1/2, unchanged. Even a confirmed H-signal would be a within-crater,
      constant-factor fact subject to the T5 reachability gate this record
      does not touch; no exponent is claimed or implied.
    memory_exponent: not applicable; exact enumeration at toy scale.
    best_known: >-
      0.886*sqrt(N) parallel rho with DPs, O(1) memory (KN-TECH-001,
      KN-TECH-006); automorphism-discounted CM variant 1.2533*sqrt(N/|Aut|)
      (KN-TECH-018).
    hidden_overhead: >-
      No o(1) claimed. Disclosed: the candidate causal mechanism is
      unproven, so even a positive measurement result would carry no
      complexity content until a successor mechanism record derives one.
    tradeoff_note: not applicable; no attack constructed.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY, DATA against every frontier row. Constructs
    no attack; dominated by parallel rho with DPs (0.886*sqrt(N), O(1)
    memory), the automorphism-discounted CM variant (1.2533*sqrt(N/|Aut|),
    KN-TECH-018), BSGS, and kangaroo/Gaudry-Schost. No data/queries consumed.
  sota_delta: >-
    ZERO speedup on every axis; none sought. Measurement delta: the first
    record under RQ-JINV-8fc13a to decompose the crater by class-group
    STRUCTURE (genus/2-torsion) rather than cardinality alone, extending
    IDEA-20260826-d61c49's object into a genuinely different axis with an
    honestly-labelled, unproven candidate mechanism.

