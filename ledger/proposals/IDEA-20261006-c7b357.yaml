        provenance: internal
        relation: adjacent
        delta: >-
          Tate's criterion identifies isogeny with equal point counts
          and blocks walking to a new weakness class. This proposal
          counts Galois orbits of j and does not walk.
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: orthogonal
        delta: >-
          Automorphism orbits cut rho by a constant sqrt(m). This
          proposal does not run rho and does not claim the sqrt(4)
          factor on j = 1728.
      - ref: KR-RHO-6654ba
        provenance: internal
        relation: orthogonal
        delta: >-
          Keyword collision. The row says binary rho iterations get
          cheaper when point halving replaces addition, and it states
          no numeric factor. This proposal's counted delta is an orbit
          deficit of at least 1 at p = 19, exponent difference 0, and
          it does not halve a point.
      - ref: KR-RHO-037e22
        provenance: internal
        relation: adjacent
        delta: >-
          Keyword collision on Frobenius classes. That row walks the
          group generated by Frobenius and negation on a binary
          Koblitz curve and reduces parallel rho by sqrt(2m), about
          2^60.9 iterations rather than 2^64.8 on ECC2K-130. This
          proposal counts Galois orbits of supersingular j at p = 19
          and predicts deficit at least 1, with exponent difference 0.
          It does not run rho.
