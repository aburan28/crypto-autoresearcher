idea:
  id: IDEA-20261006-c7b357
  added: '2026-10-06'
  status: proposed
  approved_by: null
  question_id: RQ-SSI-001
  title: >-
    Galois-orbit deficit of supersingular j-invariants in F_361 is at
    least 1
  class: measurement
  claim: >-
    Toy instance only, prediction fixed before any run. Let p = 19 and
    F_361 = F_19[z]/(z^2 - 2). Representation class R2 of
    RQ-ECDLP-623a32: from a short-Weierstrass model carrying a point,
    keep only the j-invariant
    j = 1728 * (4A)^3 / (4A^3 + 27 B^2) in F_361. The stage in question
    is orientation and auxiliary structure of a supersingular curve,
    not a path search. Let S be the set of j in F_361 for which some
    short-Weierstrass model over F_361 has exactly (19-1)^2 or
    (19+1)^2 points over F_361, skipping singular discriminants. Let
    O be the number of unordered pairs {j, j^19} with j in S. The
    orbit deficit is D = the size of S minus O. Prediction: D is at
    least 1. The same deficit on the set of all elements of F_19 is 0,
    and that control must return 0. No single curve's point count is
    the predicted integer. This is not a path-finding algorithm and it
    does not rename CGL, CSIDH, or SQIsign. The rho exponent stays 1/2.
  mechanism: >-
    PAIR. Representation: the j-invariant of the short-Weierstrass
    model, an R2 curve-model invariant of the curve that carries the
    point, not the point's x-coordinate. Operation set Sigma is the
    singleton {pi}, the 19-power Frobenius on j, acting by
    j maps to j^19. Sigma is not translation on any elliptic curve
    group. Trichotomy class: partial-action. Reason: pi sends a model
    to the conjugate model and sends j to j^19, so the unordered pair
    {j, j^19} is fixed by Sigma and the update does not read the
    point. Lossy-projection test against Sigma. Discarded: the point,
    the Weierstrass coefficients beyond j, and, when j is not in F_19,
    which of the two conjugates was written first. The discard is
    compatible with Sigma because {j, j^19} is a block of the Galois
    action generated by pi. It is lossy precisely when some orbit has
    size 2, which is the prediction that D is at least 1; if every
    supersingular j lies in F_19 then every fiber of the orbit map has
    size 1 on S and the projection loses nothing on S, and the claim
    is false. The open number is the orbit-canonicalisation yield: one
    p-power and one comparison per j, cost O(log p) field operations,
    and the measured yield is D, the number of j values that are
    identified with a distinct conjugate. The minimal test measures D
    on S against the null set F_19, whose deficit is 0, and against
    the instrument set {z, z^19}, whose deficit is 1. F6 is a named
    component: Frobenius acts on j. The primary lens is the orbit
    deficit of the supersingular set, not an isogeny-graph walk and
    not an endomorphism-orbit search for a discrete logarithm. F1
    through F5 and F7 are not the lens.
  novelty_status: unverified
  citations:
    - ref: RQ-SSI-001
      provenance: internal
      claim: >-
        The question asks for a mechanism against a surviving
        supersingular hardness assumption, with toy parameters allowed
        as hypothesis-generating only, and it separates that work from
        ordinary-curve Semaev neighbors.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        ledger/questions/RQ-SSI-001.yaml
    - ref: IDEA-20260806-c5d183
      provenance: internal
      claim: >-
        Full translation admits no deterministic lossy projection.
        The Galois action on j is a partial action outside that
        translation group.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        ledger/proposals/IDEA-20260806-c5d183.yaml
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C blocks an exactly sum-compatible homomorphism filter
        on a prime-order group. Orbit membership of j is not claimed
        to be such a filter.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/findings/KN-FIND-ffe1df.md at the Theorem C paragraph
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, curves are isogenous if and only if they
        have the same number of points, and an isogeny walk does not
        reach a different group-structure weakness class.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces rho iterations by
        sqrt(m), a constant. The j = 1728 case is sqrt(4). The
        exponent stays 1/2.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete logarithms need Omega(sqrt(p)) group
        operations.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-6654ba
      provenance: internal
      claim: >-
        On binary curves, point halving can replace addition-based rho
        steps and make iterations cheaper (Zhang-Wang 2011). The row
        states no numeric factor.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6654ba.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        On a Koblitz curve over F_{2^m}, walking on classes of the
        group generated by Frobenius and negation reduces parallel rho
        by sqrt(2m). ECC2K-130 expected work is about 2^60.9 iterations
        rather than 2^64.8.
      verified_by: >-
        idea-generator session 2026-10-06 opened
        knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: >-
        Recalled membership test for supersingularity over F_{p^2}
      provenance: recalled
      claim: >-
        A recalled criterion says a curve over F_{p^2} is
        supersingular exactly when its point count is (p-1)^2 or
        (p+1)^2. This session did not open a proof. The test uses
        that criterion as the definition of S and treats a later
        contradiction of the criterion as an invalid instrument.
  assumptions:
    - >-
      The j-invariant formula
      j = 1728 * (4A)^3 / (4A^3 + 27 B^2) is the standard
      short-Weierstrass formula. It is recalled, not re-derived here.
      Discriminant 0 models are skipped.
    - >-
      Frobenius on F_361 has order 2, so every Galois orbit of an
      element has size 1 or 2. Size 1 if and only if the element lies
      in F_19.
    - >-
      z^2 - 2 is irreducible over F_19, so z and z^19 = -z are
      distinct and the instrument set {z, -z} has deficit 1.
    - >-
      No isogeny graph is constructed. Supersingularity is read off
      the point count of one model per j.
  proof_search_map:
    not_applicable_reason: >-
      This is a census of one Galois-orbit deficit at p = 19, not a
      proof about endomorphism-ring cost or path-finding cost.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: orbit deficit D, size of S minus O
      direction: higher
      minimum_effect: at least 1
  minimal_test:
    design: >-
      For every j in F_361, build one nonsingular short-Weierstrass
      model with that j, or skip j if every model is singular. Count
      points over F_361 by testing squares. Put j in S exactly when
      the count equals (19-1)^2 or (19+1)^2. Collapse S by the
      equivalence of j with j^19 and set D to the size of S minus O.
      Before accepting D, run the two instrument sets and require
      deficit 0 on F_19 and deficit 1 on {z, z^19}.
    controls:
      - >-
        Null set of the same shape: every element of F_19, viewed in
        F_361. Predicted deficit 0, and a nonzero value invalidates
        the orbit counter.
      - >-
        Positive instrument: the set {z, z^19}. Required deficit 1.
      - >-
        Duplicate-model control: two Weierstrass models with the same
        j must contribute one element to S, not two.
    required_metrics:
      - size of S
      - O
      - D
      - deficit of F_19
      - deficit of the set {z, z^19}
  falsification_conditions:
    - D = 0.
    - >-
      The orbit counter returns a nonzero deficit on F_19 or a
      deficit other than 1 on {z, z^19}. The run is invalid, not
      support.
    - >-
      Two models of one j are counted twice and that changes D. The
      run is invalid until the duplicate is removed.
    - >-
      A timeout, crash, or partial sweep of F_361 is infrastructure,
      not a falsification and not support.
  confounders:
    - >-
      The recalled point-count criterion may be the wrong membership
      test. If a later opened source contradicts it, the recorded D
      does not measure supersingularity.
    - >-
      j = 0 and j = 1728 have extra automorphisms. They still
      contribute at most one element each. Their stabilisers are not
      a second orbit relation.
    - >-
      A curve and its quadratic twist can share j and differ in point
      count. The test must use a model whose point count meets the
      membership test, and must not reject a j because a twist failed.
  interpretation_limits:
    - >-
      D at least 1 at p = 19 says at least one supersingular j in
      F_361 is not F_19-rational. It does not produce an isogeny, an
      endomorphism ring, or a cost below p^{1/2}.
    - >-
      A recalled class-number formula for the number of supersingular
      j-invariants was not opened. It is not used as a checked source
      and it is not the prediction. The prediction is the deficit, not
      a value of the size of S.
    - >-
      Negative evidence closes only the deficit at p = 19 under this
      membership test. It does not close the supersingular isogeny
      problem.
    - >-
      This is not the 144-point count of y^2 = x^3 + 1 over F_121,
      not a conductor, and not a modularity comparison.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The set of supersingular j-invariants in F_{p^2} for p = 19
        is a union of Galois orbits and is not contained in F_p, so
        the deficit, the size of S minus O, is at least 1, imitating
        the statement that a random Galois-stable set of size greater
        than the number of rational supersingular j-invariants must
        use a size-2 orbit.
      rigorous_support: >-
        It is recalled, and not opened here, that every supersingular
        j-invariant lies in F_{p^2} and that Frobenius preserves that
        set. Those two structural facts do not by themselves force a
        size-2 orbit at p = 19. The deficit is the unproved part.
      validation_plan: >-
        The minimal test sweeps every j in F_361 once. Compare D with
        the deficit 0 of F_19 and the deficit 1 of {z, z^19}.
        Second-scale control, only if D is at least 1 at p = 19:
        repeat the identical deficit measurement at p = 31 with
        F_961 = F_31[z]/(z^2 - 3), membership counts (31-1)^2 and
        (31+1)^2, and the same prediction that D is at least 1
        against the null set F_31. This session checked that 3 is not
        a square modulo 31. D = 0 at either prime falsifies H1 at
        that prime only.
  target_complexity:
    time_exponent: p^{1/2} times (log p) to a constant power, unchanged
    memory_exponent: polynomial in log p for the toy census; no new table
    best_known: >-
      Classical supersingular-isogeny path finding in
      p^{1/2} times (log p) to a constant power, at polynomial memory,
      and the conditional p^{1/3+o(1)} algorithm as the comparison
      ceiling this census does not touch
    hidden_overhead: >-
      No o(1) is claimed. The census is O(p^2) point counts of size
      p^2 at this toy and is not an asymptotic attack.
    tradeoff_note: >-
      Canonicalising one orbit is one exponentiation and one
      comparison. Memory is the list of j in S, size O(p). No
      time-memory tradeoff for a path search is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Opened KR-RHO-755e35, KR-RHO-0528e7, KR-RHO-13bf67, KR-RHO-5b1c0a,
    KR-RHO-6654ba, KR-RHO-037e22, and KR-IC-b0fcda. None states the
    Galois-orbit deficit of the supersingular j-set at p = 19.
    KR-RHO-755e35 dominates any reading of this census as an isogeny
    walk to a weak curve: isogenous curves share the group-structure
    invariants that row names, and this proposal walks nothing.
    KR-RHO-6654ba reports cheaper binary rho iterations by halving and
    states no numeric factor. KR-RHO-037e22 saves sqrt(2m), about
    2^60.9 iterations rather than 2^64.8 on ECC2K-130. Neither is an
    orbit deficit. KR-RHO-13bf67 dominates any exponent reading:
    Omega(sqrt(p)) against exponent delta 0.
  sota_delta: >-
    Exponent difference 0 against p^{1/2} times (log p) to a constant
    power and against p^{1/3+o(1)}. Counted delta: orbit deficit at
    least 1 at p = 19, against deficit 0 on F_19. The opened rho rows
    differ by a sqrt(2m) iteration factor, about 2^3.9 on ECC2K-130,
    or by an unquantified binary halving discount.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/generic-rho
    rows_checked:
