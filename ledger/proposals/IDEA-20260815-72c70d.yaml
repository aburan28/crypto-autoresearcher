idea:
  id: IDEA-20260815-72c70d
  question_id: RQ-SSI-001
  added: '2026-08-15'
  title: >-
    THE CGL HASH IS NAMED AS AFFECTED BY THE p^(1/3) RESULT AND ITS SECURITY
    LEVEL IS SET BY THE SAME PROBLEM: recompute its collision and preimage
    margins under the new baseline with memory charged
  class: measurement

  claim: >-
    The source paper's scope statement names the CGL hash among the affected
    systems. CGL's collision resistance rests on the difficulty of finding
    two paths to the same curve, which is tied to the endomorphism-ring
    problem the new algorithm attacks. Whether CGL's parameters still
    deliver their claimed margins under the new baseline, once memory is
    charged, is arithmetic nobody here has done.

  mechanism: >-
    Identify the exact problem CGL's collision and preimage resistance
    reduce to. Cost the best attack on each under the new algorithm with
    memory charged. Compare against the claimed margins at published
    parameters.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of the p^(1/3) result's scope statement naming CGL; grep 'CGL',
      'collision resistance', 'isogeny hash'.
    results: >-
      The scope statement names CGL as affected; no record recomputes its
      margins.
    verdict: >-
      ADAPTATION. The recomputation follows the source's own scope
      statement; the contribution is doing it in this program's charged
      framework.

  object_first_candidate:
    tracked_object: >-
      CGL'S COLLISION AND PREIMAGE MARGINS under the new endomorphism-ring
      baseline with memory charged.
    lossiness: >-
      A claimed hash security level projects the whole attack landscape
      onto two numbers, which move when the underlying problem's best
      attack moves.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while CGL's reductions to the underlying problem are stated
      precisely enough to inherit the new cost; where they are not, the
      recomputation cannot proceed.

  null_object_control: >-
    NULL 1 -- the old baseline, which must reproduce CGL's originally
    claimed margins. NULL 2 -- generic collision search on the hash output,
    which bounds the margin from below regardless of any isogeny attack and
    must not be exceeded by the structural attack.

  discriminated_from:
    - >-
        The SQIsign margin recomputation in this batch, which does the
        same arithmetic for a signature scheme; both consume the same new
        baseline and should share its instantiation.
    - >-
        The memory-charged crossover record, which supplies the charged
        cost this record applies.

  assumptions:
    - >-
        CGL's collision and preimage resistance reduce to a stated problem
        the new algorithm attacks; if the reduction is loose the inherited
        cost is a bound rather than a level.
    - >-
        The generic birthday bound on the hash output is computable and
        gives a floor no structural attack should beat.

  predictions:
    - metric: >-
        old-baseline reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce the originally claimed margins.
    - metric: >-
        generic-birthday floor
      direction: different
      minimum_effect: >-
        FORCED not exceeded by the structural attack; a structural
        attack beating the birthday bound on the output would indicate a
        reduction error.
    - metric: >-
        margins under the new baseline with memory charged
      direction: different
      minimum_effect: >-
        The measurement; a margin falling below the claimed level would
        require review before any statement.
    - metric: >-
        reduction tightness
      direction: different
      minimum_effect: >-
        Reported explicitly, since a loose reduction makes the inherited
        cost a bound rather than a level and weakens any conclusion in
        either direction.

  minimal_test:
    design: >-
      Published CGL parameters, three memory models, both nulls, consuming
      the crossover record's charged cost.
    controls:
      - >-
          Old-baseline margin reproduction.
      - >-
          Generic-birthday floor check.
      - >-
          Several memory-cost models reported together.
      - >-
          The source's disclosed superpolynomial overhead retained
          rather than dropped.
    required_metrics:
      - >-
          Collision and preimage margins per memory model.
      - >-
          Reduction tightness statement.
      - >-
          Old-baseline reproduction agreement.
      - >-
          Generic floor comparison.

  falsification_conditions:
    - >-
        The old-baseline reproduction fails. The accounting differs from
        CGL's own and must be reconciled first.
    - >-
        The structural attack beats the generic birthday floor. A
        reduction error somewhere; halt and diagnose.
    - >-
        Margins remain adequate under charged memory. CGL's parameters
        survive the new baseline, which is the reassuring outcome and
        worth recording.
    - >-
        A margin falls below its claimed level. Review required before any
        characterisation, and the source paper's own recommendation for
        parameter reevaluation would apply here too.

  confounders:
    - >-
        REDUCTION LOOSENESS: if CGL's reduction to the endomorphism-ring
        problem is loose, the inherited attack cost is an upper bound on
        difficulty and the margin computed from it is pessimistic in an
        unquantified way.
    - >-
        DROPPING THE DISCLOSED OVERHEAD: as in the SQIsign recomputation,
        omitting the source's superpolynomial term overstates the attack.

  interpretation_limits:
    - >-
        Recomputes margins under a published attack; mounts no attack.
    - >-
        Scoped to the published parameters and swept memory models.
    - >-
        A reduced margin is a cost-model result requiring review, not a
        break.

  heuristic_assumptions:
    - id: HEUR-CGL-1
      statement: >-
        CGL's collision resistance inherits the endomorphism-ring
        problem's best-attack cost through a reduction tight enough for
        margins to be computed rather than merely bounded.
      rigorous_support: >-
        Rigorous ingredient: CGL collisions correspond to distinct
        isogeny paths between the same curves, which relates directly to
        endomorphism-ring structure, and that correspondence is the
        basis of the source's scope statement. THE GAP: the relationship
        is a correspondence rather than a tight two-way reduction, so an
        attack on the endomorphism-ring problem does not automatically
        yield a collision at the same cost, and the inherited margin may
        be pessimistic by an unquantified factor.
      falsification_condition: >-
        A demonstration that the correspondence loses more than a small
        factor in either direction.
      validation_plan: >-
        SAMPLE: the reduction as stated in the CGL literature, with its
        tightness extracted. TAIL CHECK: whether the source's scope
        statement rests on tightness or on the looser correspondence.
        TRANSFER: none; the recomputation binds the published
        parameters.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic recomputation at published parameters.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published CGL security analysis under the old
      baseline and the new p^(1/3) algorithm; both are used and neither is
      improved.
    hidden_overhead: >-
      Reduction tightness is the dominant hidden term and determines
      whether the output is a margin or a bound.
    tradeoff_note: >-
      Charging memory raises the attack cost and shrinks the margin
      change; the honest answer lies between the free-memory and
      realistic-memory brackets.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a security analysis: dominated by the
    published CGL work on every axis except this one input. As a
    recomputation under the new baseline: none exists here. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: CGL collision and preimage
    margins recomputed under the p^(1/3+o(1)) baseline with memory charged
    and the disclosed overhead retained, with the reduction's tightness
    stated so the result is labelled a margin or a bound rather than
    conflated.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that the old-baseline reproduction works. 0.5 that the reduction is
    tight enough for margins rather than bounds, which is the binding
    uncertainty. 0.2 that a margin falls below its claimed level, which
    would require review and would extend the source's own parameter-
    reevaluation recommendation to this construction.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
