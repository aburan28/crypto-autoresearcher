      Digit-presentation index calculus (84cdb7) with the decomposition
      oracle solved by Macaulay linear algebra at degree D_0 (k* = 0),
      conditional on H1.
    cost_unit: F_p field operations
    bound_kind: heuristic_estimate
    parameter_sets:
