  assumptions:
    - >-
      Cost unit: F_p field operations; Macaulay solve charged as
      Ncols^omega with omega in {2, 2.807}; enumeration leaf charged by
      root-finding plus O(1) lookup as in da1428; linear algebra B^2.
    - >-
      Yield B^m / (m! N) with 2^m filtering (KN-FIND-007 forced mean); no
      large-prime variation (lane A's A2 is off-limits and not composed).
    - >-
      d = 2 throughout; other d change constants only under the null and
      the bounded-slice arithmetic is the same with 2^k replaced by d^k.
    - >-
      All numbers are hand-derived to about 0.5 in log2; a Stage 0 script
      recomputes them exactly and any disagreement above 1 in log2 is a
      transcription error to be corrected in a superseding record.

  concrete_cost:
