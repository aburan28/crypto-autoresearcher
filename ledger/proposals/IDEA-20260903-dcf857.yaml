        memory_log2: 72.9
        prior_time_log2: 127.8
        prior_memory_log2: 0
      - name: 'log2 N = 128, m = 5, D_0 = 4, omega = 2'
        security_parameter: 128
        time_log2: 64.0
        memory_log2: 31.5
        prior_time_log2: 63.8
        prior_memory_log2: 0
      - name: 'log2 N = 64, m = 5, D_0 = 4, omega = 2'
        security_parameter: 64
        time_log2: 40.9
        memory_log2: 19.9
        prior_time_log2: 31.8
        prior_memory_log2: 0
      - name: 'semi-regular slice, any N, any m (da1428 baseline)'
        security_parameter: null
        time_log2: null
        memory_log2: null
        prior_time_log2: null
        prior_memory_log2: null
    optimistic_assumptions:
      - 'H1: last fall degree bounded by D_0 uniformly in s (unmeasured; d52480 measures it; the honest prior is against it)'
      - 'omega = 2 in the headline cells; omega = 2.807 moves every verdict by 2^7 to 2^18 against the route'
      - 'the Macaulay solve at degree D_0 SOLVES, i.e. last fall bounded implies solving degree bounded (Huang-Kosters-Yeo, recalled)'
      - 'yield at the KN-FIND-007 mean with 2^m filtering; no accidental-decomposition losses beyond that'
      - 'sparse linear algebra at B^2 with unit constant'
      - 'no cost for recognising digit solutions (automatic in the presentation) and none for certificate checks'
      - 'balance solved with s real-valued; rounding to integer s costs up to a factor 2 in B'
    overestimating_factors:
      - 'Ncols counted as the full sum of binomials up to D_0; a sparse XL-Wiedemann charge nnz x Ncols would be lower than Ncols^2'
      - 'filtering 2^m charged fully although the y^2 = f(x) variant removes it at the price of m extra variables'
    parallelism: >-
      Relation collection embarrassingly parallel over targets (T / P with P
      processors); the B^2 linear algebra is the serial bottleneck with the
      usual block-Wiedemann parallelization at communication cost.
    time_memory_tradeoff: >-
      Arity m is the knob: larger m lowers the time exponent 2/(m+1) and
      raises the per-target polynomial Ncols(ms, D_0)^omega and the
      memory 2^s. No van Oorschot-Wiener style interpolation to rho's
      O(1) memory exists for this family; the memory floor is the factor
      base 2^s = N^{1/(m+1)} times constants, 2^54 to 2^82 at 256 bits.
    affected_scope:
      - 'NONE unconditionally. Conditionally on H1 with D_0 <= 6 at m = 5 (omega = 2): 256-bit prime-field curves would face a 2^109 to 2^117 attack with 2^54 to 2^58 memory, a parameter-reevaluation signal and not a break; nothing below 128 bits is affected in any cell'
    safe_scope:
      - 'all curves if H1 fails (the pre-registered expectation of 84cdb7 and d52480)'
      - 'all curves at 128 bits and below in every cell of the table (best cell ties at 2^64 versus 2^63.8 and loses at omega = 2.807)'
      - 'm = 3 at every N (arithmetic: T >= 2^2.8 N^{1/2})'
      - 'every cell at omega = 2.807 with D_0 >= 6 at m = 5 or D_0 >= 4 at m = 4'
    implementation_ref: null
    status: draft

  proof_search_map:
    bottleneck: >-
      The marginal-cost sign at k = 0: whether C(1)/C(0) is below or above
      1, which is decided entirely by whether D(k) tracks the variable
      count (null) or is pinned at D_0 (bound).
    baseline_embedding:
      parameter_slice: >-
        D(k) = d_reg(k) at every k: the semi-regular slice, which must
        return full guessing and N^1, i.e. da1428's Table verbatim in the
        digit presentation.
      reproduction_check: >-
        Stage 0 script: emit C(k) for k = 0..n-s at (m, s) in {(3, 6),
        (4, 8), (5, 8)} under the null and confirm strict monotonicity in k
        and the enumerative leaf as argmin; emit da1428's B^{2 omega - 1}
        ratio in the direct presentation from the same script as a second
        fixture.
    observation_collision:
      observable: >-
        The argmin k* and the total T.
      distinct_preimage_search: >-
        Two hypotheses giving the same k* = 0: H1 true (bounded everywhere)
        and a partial bound that happens to hold at k = 0 only; the
        interior-band computation separates them because under the partial
        bound C(k) is non-monotone with a second minimum at k_c. The table
        reports the whole C(k) curve, not the argmin, for this reason.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          Build the cost as a function of the disjoint blocks (k below k_c,
          k above k_c) with D(k) = min(D_0, d_reg(k)) and charge each block
          separately.
        predicted_gain: >-
          Locates the flip and the interior band exactly instead of
          asserting an optimum.
    quantifier_order: >-
      DERIVED: FORALL (m, s, omega > 1), under the null, FORALL k < n - s,
      C(k+1) < C(k). DERIVED: FORALL (m, s, omega), under H1, FORALL k with
      n - k > D_0 / (1 - 2^{-1/omega}), C(k+1) > C(k). CONDITIONAL TABLE:
      FORALL cells listed, the stated T and memory, assuming H1 (and H2 only
      for interior cells). NOT CLAIMED: any unconditional cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under H1 with the stated D_0, omega and cost model, the digit-
        presentation route costs T at memory M at the listed sizes, and
        under the null it costs N^1." It cannot certify H1, cannot certify
        that a bounded last fall gives a bounded solve, and cannot certify
        omega.
      nearby_object_control: >-
        The direct presentation with membership degree B under the same
        table machinery, where the flip must NOT occur (da1428's boundary
        optimum), which is the second fixture of the reproduction check.
    proof_obligations:
      - claim: >-
          Under the null C(k) is strictly decreasing in k up to the
          enumerative leaf (baseline slice equals da1428).
        responsibility: baseline
      - claim: >-
          Under H1 the marginal ratio 2(1 - D_0/(n-k))^omega exceeds 1 for
          n - k > D_0 / (1 - 2^{-1/omega}).
        responsibility: correctness
      - claim: >-
          Every table entry is reproduced by the Stage 0 script to within 1
          in log2.
        responsibility: feasibility
      - claim: >-
          The table is labelled conditional in every summary and no cell is
          quoted without its (D_0, omega) tags.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The charged cost curve C(k) of the digit-presentation oracle as a
      function of the number of guessed digits, and its argmin, under two
      hypotheses about the Macaulay degree.
    lossiness: >-
      Lossy: the solver, the order, the fall history and the ideal are all
      projected to one curve k -> C(k) determined by (n, D(k), omega); two
      systems with the same D(k) profile are identified. Not a change of
      coordinates: the two hypotheses give curves with opposite monotonicity.
    propagation: >-
      Deterministic under "guess one more digit": n -> n - 1, D -> D(k+1),
      multiplier 2.
    survival_score: >-
      Survives every d (replace 2^k by d^k) and every omega > 1; dies when
      D(k) is neither pinned nor tracking the null (the interior band),
      which is priced rather than ignored.

  null_object_control: >-
    THE SEMI-REGULAR SLICE IS THE NULL and it is the record's baseline:
    D(k) = d_reg(k), forced verdict full guessing and N^1 at every arity,
    identical to da1428. SECOND NULL: the direct presentation under the
    same machinery, forced to da1428's B^{2 omega - 1} ratio. STRUCTURAL
    TELL: a table in which the optimum is interior at BOTH slices, or a
    bounded-slice cell that beats rho at 64 bits, is an arithmetic error
    (the polynomial overhead is largest relative to N at small N and the
    table must lose there).

