idea:
  id: IDEA-20260903-dcf857
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-dc126c
  added: '2026-09-03'
  title: >-
    THE CONDITIONAL COST TABLE OF THE DIGIT-PRESENTATION DECOMPOSITION
    ORACLE UNDER A BOUNDED LAST FALL DEGREE, with the semi-regular slice
    reproducing IDEA-20260808-da1428 exactly (full guessing optimal, total
    N^1): under the bound the hybrid optimum FLIPS to the opposite boundary
    (no guessing, k* = 0, because guessing one digit costs 2 and saves only
    (1 - D_0/(ms - k))^omega), crossbred degenerates to XL at degree D_0,
    and at log2 N = 256 the route ties with rho only for m = 4, D_0 = 4,
    omega = 2 (2^127 versus 2^127.8) and beats it at m = 5 for D_0 <= 6 at
    omega = 2 (2^109 at D_0 = 4, 2^117 at D_0 = 6, 2^124 at D_0 = 8) but
    loses at omega = 2.807 for D_0 >= 6 - so "bounded" is not enough and
    the measurement of IDEA-20260903-d52480 must return D_0 <= 6 to matter
  class: composition

  claim: >-
    (A) THE COST MODEL, STATED SO EVERY NUMBER IS RECOMPUTABLE BY HAND.
    Digit presentation at d = 2 (IDEA-20260830-84cdb7): n = ms Boolean-type
    variables over F_p, B = 2^s, one substituted summation generator of
    total degree at most 2m after multilinear reduction, n field-type
    generators a(a - 1). Per-target oracle cost with k digits guessed:
    C(k) = 2^k x Ncols(n - k, D(k))^omega with Ncols(n', D) = sum_{i <= D}
    binom(n', i) (multilinear monomials) and D(k) the Macaulay degree the
    residual system must reach. Index-calculus assembly as in 84cdb7:
    success probability B^m / (m! N) per target, 2^m filtering for
    off-curve digit solutions charged as a factor 2^m in C, sparse linear
    algebra B^2, balance B = (m! 2^m C N)^{1/(m+1)}, total time
    T = 2 (m! 2^m C N)^{2/(m+1)}, memory B for the factor base and relation
    matrix. Yield is FORCED by KN-FIND-007 and is not a free parameter.
    (B) THE BASELINE SLICE, REPRODUCING da1428 EXACTLY. Under the semi-
    regular null, D(k) = d_reg(k) = ceil(((n - k) + 2m)/2) (84cdb7's
    formula at d = 2 with n - k variables). Since D(k) exceeds (n - k)/2,
    Ncols(n - k, D(k)) is more than half of 2^{n-k}, so C(k) is within a
    factor 2^omega of 2^k x 2^{omega(n-k)} and the ratio
    C(k+1)/C(k) = 2 x (Ncols(n-k-1, D(k+1)) / Ncols(n-k, D(k)))^omega is
    about 2 x 2^{-omega} < 1 for every omega > 1: C is STRICTLY DECREASING
    in k all the way to the enumerative leaf k = n - s (guess m - 1 digit
    blocks, root-find the last coordinate, 2^{m-1} roots by KN-FIND-a8990a
    Theorem C), i.e. the hybrid optimum is FULL GUESSING and the oracle
    costs B^{m-1} up to constants. Feeding the balance: T = N^1 at every
    arity, worse than rho by N^{1/2}. This is da1428's verdict, obtained in
    the digit presentation by the same inequality (each retained variable
    costs a factor about 2^omega and saves a factor 2), and it is the
    record's mandatory baseline.
    (C) THE BOUNDED SLICE, WHERE THE OPTIMUM FLIPS. Under the hypothesis
    d_lf <= D_0 (IDEA-20260903-d52480 Outcome III) together with H2 below
    (the residual system after guessing has last fall degree at most D_0),
    D(k) = min(D_0, d_reg(k)). For n - k large, Ncols(n - k, D_0) is about
    binom(n - k, D_0), and C(k+1)/C(k) = 2 x (1 - D_0/(n - k))^omega, which
    exceeds 1 exactly when n - k > D_0 / (1 - 2^{-1/omega}), i.e. n - k >
    3.41 D_0 at omega = 2 and > 4.57 D_0 at omega = 2.807. So guessing is
    counterproductive until the residual variable count falls to a few
    times D_0; for n = ms in the hundreds and D_0 <= 8 the optimum is
    k* = 0 with C = Ncols(n, D_0)^omega, POLYNOMIAL in n = m log2 B. The
    boundary optimum of (B) has flipped to the opposite boundary. In this
    regime crossbred (KN-LIT-139, KN-TECH-053: partial Macaulay at degree D
    keeping k-degree <= d, then enumerate) degenerates to plain XL /
    Macaulay at degree D_0, because the degree-D_0 matrix already solves;
    its admissibility condition is satisfied trivially and it buys nothing
    but constants. The interior band D_0 < d_reg(k) < d_reg(0), where a
    partial bound holds only after some guessing, is the one place crossbred
    could matter, and it is priced in the table as the k at which D(k)
    crosses D_0.
    (D) THE CONCRETE-COST TABLE, HAND-DERIVED. Iterating the balance
    (s depends on C which depends on n = ms) to convergence, with
    log2 binom(n, D_0) computed from the falling factorial, filtering 2^m
    charged, and reported at omega in {2, 2.807}:
    log2 N = 256 (rho: 0.886 x 2^128 = 2^127.8, O(1) memory).
      m = 4, D_0 = 4: s = 63.8, n = 255, log2 C = 58.5 (omega 2) ->
        T = 2^128.6, memory 2^63.8 (TIE, loses by 2^0.8); omega 2.807:
        log2 C = 81.9, s = 68.5 -> T = 2^138 (loses by 2^10).
      m = 4, D_0 = 6: omega 2: log2 C = 82, s = 68.5 -> T = 2^138;
        omega 2.807: T about 2^150.
      m = 4, D_0 = 8: omega 2: log2 C = 104, s = 72.9 -> T = 2^146.8
        (loses by 2^19); omega 2.807: log2 C = 148, s = 81.7 -> T = 2^164.4.
      m = 5, D_0 = 4: omega 2: log2 C = 60.3, s = 53.8, n = 269 ->
        T = 2^108.7 (BEATS rho by 2^19), memory 2^53.8; omega 2.807:
        log2 C = 83.8, s = 57.8 -> T = 2^116.6 (beats by 2^11).
      m = 5, D_0 = 6: omega 2: log2 C = 84, s = 57.8 -> T = 2^116.6
        (beats by 2^11); omega 2.807: log2 C = 117.9, s = 63.5 ->
        T = 2^127.9 (TIE).
      m = 5, D_0 = 8: omega 2: log2 C = 106.4, s = 61.5 -> T = 2^124.1
        (beats by 2^3.7, marginal); omega 2.807: log2 C = 151.2, s = 69 ->
        T = 2^139 (loses by 2^11).
      m = 3, any D_0: T = 2 (6 x 8 x C N)^{1/2} >= N^{1/2} x 2^{2.8} for
        C >= 1: NEVER beats rho, by arithmetic.
    log2 N = 128 (rho 2^63.8).
      m = 4, D_0 = 4, omega 2: log2 C = 52.4, s = 36.9 -> T = 2^75 (loses
        by 2^11). m = 5, D_0 = 4, omega 2: log2 C = 54, s = 31.5 -> T = 2^64
        (TIE); omega 2.807: T = 2^71.1 (loses by 2^7). m = 5, D_0 = 8,
        omega 2: log2 C = 95.2, s = 38.3 -> T = 2^77.7 (loses by 2^14).
    log2 N = 64 (rho 2^31.8).
      m = 5, D_0 = 4, omega 2: log2 C = 48.7, s = 19.9 -> T = 2^40.9 (loses
        by 2^9). Every other cell loses by more.
    READING: the polynomial oracle cost Ncols(n, D_0)^omega is 2^52 to
    2^151 at 256 bits - the "o(1)" of N^{2/(m+1)+o(1)} is a factor between
    2^52 and 2^151 in the per-target cost, which is why the asymptotic
    advantage at m >= 4 appears at 256 bits only for m = 5 with D_0 <= 6 at
    omega = 2 (or D_0 = 4 at omega = 2.807), and at 128 bits and below not
    at all. The crossover with rho moves to larger N as D_0 grows, which
    is the honest form of "bounded is not enough".
    (E) WHAT THE TABLE IS AND IS NOT. It is a concrete_cost artifact in the
    sense of templates/research-records.md, conditional on H1 and H2 below,
    with every optimistic assumption flagged; it claims NOTHING
    unconditional and is the pricing of a long shot whose measurement is
    d52480's. Its deliverable to the lane is one number: D_0 must be at
    most 6 (m = 5, omega = 2) or at most 4 (m = 4, omega = 2, tie) for the
    conditional route to be competitive at 256 bits, and no value of D_0
    makes it competitive at 128 bits or at m = 3.

  mechanism: >-
    WHY THE FLIP HAPPENS AT THE DEGREE, NOT AT THE VARIABLE COUNT. da1428's
    inequality is "the marginal cost of keeping one variable algebraic
    (a factor about (B/2)^omega in the direct presentation, 2^omega here)
    exceeds the marginal cost of guessing it (B, or 2 here)" and it holds
    because the residual degree of regularity grows with the residual
    variable count. A bounded last fall degree decouples the Macaulay
    degree from the variable count, so the marginal cost of keeping a
    variable becomes the polynomial factor (1 - D_0/(n-k))^{-omega}, which
    is below 2 as soon as n - k exceeds a few multiples of D_0. That single
    change of the marginal-cost sign is the entire content of (C); nothing
    else in the assembly moves. The same computation with D(k) =
    min(D_0, d_reg(k)) gives the interior band: for k below
    k_c = n - 2(D_0 - m) (where d_reg(k) = D_0), D(k) = D_0 and guessing
    hurts; above k_c the null takes over and guessing helps; so a partial
    bound that holds only for residual systems (H2 true, H1 false) yields an
    optimum at k_c with cost 2^{k_c} binom(2(D_0 - m), D_0)^omega, which is
    exponential in n and reproduces the baseline verdict. So the table has
    exactly two qualitative regimes and one crossover, all derived.
    WHY THIS IS A COMPOSITION AND NOT A NEW ALGORITHM. It composes 84cdb7's
    presentation, d52480's invariant, da1428's hybrid framework and
    KN-LIT-139's crossbred shape with the standard index-calculus balance;
    the only new arithmetic is the sign flip and the table. It is filed so
    that the lane's conditional claim carries the cost artifact the target
    profile (A8, C13-C15) requires BEFORE any measurement could promote it,
    rather than after.
    THE THREE HONESTY DISCLOSURES THE TABLE CARRIES. (1) omega = 2 is not
    achievable for structured sparse Macaulay matrices; the omega = 2.807
    column is the conservative one and it moves every verdict by 2^7 to
    2^18. (2) The memory column B = 2^s is between 2^31 and 2^82 across the
    table against rho's O(1); no cell dominates rho on memory. (3) H2
    (specialization keeps the bound) is unmeasured and is the weakest link;
    the table's k* = 0 optimum does not even need it (k = 0 guesses
    nothing), so H2 enters only the interior band, which is why the
    headline cells are H1-only.

