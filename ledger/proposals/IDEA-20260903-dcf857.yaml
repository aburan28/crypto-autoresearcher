  minimal_test:
    design: >-
      STAGE 0 (zero compute, the deliverable): a script that emits C(k)
      curves and the table from exact integer binomials at both omega, the
      two fixtures (null slice = da1428 in both presentations), the D_0
      thresholds, and the interior-band cells. STAGE 1 (zero compute):
      cross-check the balance against 84cdb7's own accounting at C = 1 and
      against the enumerative oracle C = B^{m-1} (must give N^1). No
      experiment is proposed; the record's only measurable input, D_0, is
      IDEA-20260903-d52480's. The cheapest valid discriminator is the
      script's monotonicity check under the null: if C(k) is not strictly
      decreasing there, the whole table is wrong.
    controls:
      - 'null slice reproduces da1428 (full guessing, N^1) in the digit presentation (blocking)'
      - 'direct presentation under the same script reproduces the B^{2 omega - 1} ratio (blocking)'
      - 'C = 1 and C = B^{m-1} limits of the balance reproduce 84cdb7 and N^1 (blocking)'
      - 'both omega columns emitted; no single-omega number'
      - 'small-N cells must lose to rho (arithmetic tell)'
    required_metrics:
      - 'C(k) curves per (m, s, D_0, omega)'
      - 'table cells with (T, memory, prior) per standardized set'
      - 'D_0 thresholds per (m, omega) at each N'
      - 'interior-band cells'
      - 'fixture pass or fail'

  falsification_conditions:
    - >-
      The null slice shows an interior optimum: the marginal-cost
      inequality is misapplied and the record is superseded.
    - >-
      The direct-presentation fixture does not reproduce da1428: same.
    - >-
      A bounded-slice cell beats rho at 64 bits: arithmetic error.
    - >-
      d52480 returns Outcome I or II: H1 false at the tested scale and the
      whole table is the price of a hypothesis that failed; it stays as
      the record of what "bounded" would have had to mean.
    - >-
      d52480 returns Outcome III with D_0 above the threshold for the
      relevant (m, omega): the bound exists and does not matter at 256
      bits; the honest headline is "bounded but too large".

  confounders:
    - >-
      OMEGA. The two columns differ by up to 2^18 in T; every verdict
      names its omega.
    - >-
      BOUNDED LAST FALL VERSUS BOUNDED SOLVE. The table assumes the degree-
      D_0 Macaulay matrix solves; Huang-Kosters-Yeo's relation is recalled,
      not retrieved, and d52480's closure measures the fall history, not a
      solve.
    - >-
      ROUNDING OF s. The balance uses real s; integer s costs up to 2 in B
      and 2^{2/(m+1)} in T, below the table's resolution.
    - >-
      HAND ARITHMETIC. Every cell is a hand-derived log2 to about 0.5;
      the script is the authority and this record's numbers are
      superseded by it on any disagreement above 1.
    - >-
      ARITY m = 5 needs S_6, whose construction and degree 2^4 = 16 per
      variable are charged nowhere here (the multilinear reduction caps the
      digit degree at min(16, s) per block, so the substituted generator's
      total degree is at most 2m = 10 only after that reduction, which is
      assumed). The S_4 instrument defect (KN-OPEN-5b3a08) makes even m = 3
      instances suspect in this program; the table is arithmetic and does
      not depend on the harness, but any measurement feeding it does.

  interpretation_limits:
    - >-
      CONDITIONAL THROUGHOUT; no cell may be quoted without "assuming H1
      with D_0 = ..." attached, per docs/claims-and-verification.md.
    - >-
      A pricing of 84cdb7's long shot, whose pre-registered expectation is
      that H1 fails; the table's most likely use is to show that Outcome
      III at a moderate D_0 would still not threaten 256-bit curves.
    - >-
      No memory-matched comparison is favourable: every cell uses 2^31 to
      2^82 memory against rho's O(1).
    - >-
      Nothing about m = 3, 128 bits or below, or omega = 2.807 with
      D_0 >= 6 is affected under any reading.

  heuristic_assumptions:
    - id: H1
      statement: >-
        BOUNDED LAST FALL (d52480's H2 imported): there exists D_0 = D_0(m, d)
        such that d_lf(m, d, s) <= D_0 for all s, p, curves and planted
        targets, AND the degree-D_0 Macaulay matrix determines the
        solutions (bounded solve).
      rigorous_support: >-
        NONE transfers from the extension-field theorem (d52480 claim B).
        The classical statement imitated is the Weil-descent last-fall
        bound of arXiv:2103.07282 (retrieved by d52480) with q <-> d,
        n <-> s. The solve half imitates Huang-Kosters-Yeo's relation
        between last fall degree and solving degree (recalled).
      validation_plan: >-
        d52480's ladder, Outcome III with at least four consecutive
        uncensored flat cells; the flat value is D_0. There is no
        cryptographic-scale shortcut on the s-axis (IDEA-20260903-26aa81
        supplies one on the p-axis only). TRANSFER: none; a flat d_lf at
        s <= 5 is a slope statement and the table's use of it at s = 54 to
        82 is an extrapolation by a factor of 10 to 16 in s, disclosed.
    - id: H2
      statement: >-
        SPECIALIZATION MONOTONICITY: the last fall degree of the residual
        system after fixing k digits to values in {0, 1} is at most D_0.
      rigorous_support: >-
        NO rigorous support; specialization can raise or lower fall degrees
        in general. Imitates the hybrid literature's practice (Bettale-
        Faugere-Perret, recalled) of assuming the residual system is as
        regular as the original. Enters only the interior-band cells; the
        headline k* = 0 cells do not use it.
      validation_plan: >-
        At s <= 5, measure d_lf of the residual after guessing k in {1, 2}
        digits with d52480's closure; compare to the unspecialized value.
        TAIL CHECK: the specialization with the largest d_lf.
    - id: H3
      statement: >-
        YIELD: expected decompositions per target 2^m B^m / (m! N) with
        half of interval solutions on-curve, uniformly at the table's sizes.
      rigorous_support: >-
        KN-FIND-007's conserved mean (internal, exact identity for the
        mean) and 84cdb7's H2 (Weil bound for the square fraction,
        vacuous at short intervals). Quoted as forced, not measured.
      validation_plan: >-
        Not validated here; the yield column is the RQ's and lane B's.

  target_complexity:
    time_exponent: >-
      CONDITIONAL ON H1 AND THE COST MODEL: N^{2/(m+1)} x Ncols(ms, D_0)^
      {2 omega/(m+1)} x (m! 2^m)^{2/(m+1)} x 2, which at 256 bits is 2^109
      (m = 5, D_0 = 4, omega 2) to 2^164 (m = 4, D_0 = 8, omega 2.807).
      UNCONDITIONALLY: the null slice gives N^1; nothing is claimed.
    memory_exponent: >-
      N^{1/(m+1)} x Ncols(ms, D_0)^{omega/(m+1)} x constants: 2^54 to 2^82
      at 256 bits; against rho's O(1) on every row.
    best_known: >-
      Pollard rho at 0.886 sqrt(N) and O(1) memory (the prior column of
      every cell); BSGS (N^{1/2}, N^{1/2}); kangaroo; automorphism-
      discounted rho; Pohlig-Hellman; S T^2 = N preprocessing; algebra-free
      MITM index calculus at N^{1/2+1/m} and N^{1/2} memory.
    hidden_overhead: >-
      The o(1) of 84cdb7's N^{2/(m+1)+o(1)} is here made explicit as a
      factor of 2^52 to 2^151 in the per-target cost at 256 bits; the
      table's whole point is that it is not small.
    tradeoff_note: >-
      Arity is the tradeoff knob (see concrete_cost); no interpolation to
      low memory exists in this family.

  dominated_by: >-
    CHECKED ROW BY ROW. UNCONDITIONALLY: dominated by every frontier row on
    every axis (parallel rho with negation, BSGS, kangaroo where
    applicable, automorphism-discounted rho, Pohlig-Hellman, S T^2 = N,
    algebra-free MITM at N^{1/2+1/m}); no queries. CONDITIONALLY ON H1 AT
    THE LISTED CELLS: the m = 5, D_0 <= 6, omega = 2 cells at 256 bits are
    not dominated by rho on time (2^109 to 2^117 versus 2^127.8) and are
    dominated by rho on memory (2^54 to 2^58 versus O(1)); they are not
    dominated by BSGS or by MITM index calculus on either axis; every other
    cell is dominated by rho on time as well. That non-domination is
    conditional on an unmeasured hypothesis whose honest prior is against
    it, and is worthless until d52480 reports.
  sota_delta: >-
    +0 unconditionally on every axis. Quantified conditional deltas at
    256 bits versus rho's 2^127.8: m = 5, D_0 = 4, omega 2: -19 bits of
    time at +54 bits of memory; D_0 = 6: -11 bits at +58; D_0 = 8: -3.7 bits
    at +61.5; omega 2.807, D_0 = 6: 0 bits (tie); m = 4, D_0 = 4, omega 2:
    +0.8 bits (loses). At 128 bits the best cell ties (+0.2 bits) and at 64
    bits every cell loses by at least 9 bits. Structural deltas: the
    hybrid optimum's flip from full guessing (null) to no guessing (bound),
    derived; the D_0 thresholds per (m, omega) that d52480's measurement
    must be read against.

  estimated_cost:
