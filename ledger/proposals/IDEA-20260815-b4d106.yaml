idea:
  id: IDEA-20260815-b4d106
  question_id: RQ-ECDLP-002
  added: '2026-08-15'
  title: >-
    THE PROGRAM HAS NO STATED THEORY OF WHAT WOULD COUNT AS SUCCESS SHORT OF
    A BREAK: define the intermediate result classes and check how many the
    corpus has actually produced
  class: theory

  claim: >-
    GOAL-ECDLP-001 seeks a break or a novel technique improving a verified
    attack stage. Between those lies a spectrum -- a measured constant, a
    closed mechanism class, a corrected cost model, a validated instrument
    -- and the program has no stated classification of which count as
    progress. Without one, every batch is scored against a break it will not
    achieve, which is why the corpus reads as a run of negatives.

  mechanism: >-
    Define intermediate result classes with explicit criteria. Classify
    every ECC evidence and decision record in the corpus against them.
    Report the distribution and the classes the program has never produced.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-ECDLP-001's objective and docs/inventor-protocol.md
      section 4 on closure standards; grep 'intermediate result',
      'progress', 'success criterion'.
    results: >-
      The goal names a break or a novel technique; the inventor protocol
      defines a closure standard. No record defines the intermediate
      spectrum or classifies the corpus against it.
    verdict: >-
      ADAPTATION. Result taxonomies are a standard research-management
      device; the contribution is one bound to this program's own closure
      standard and applied to its own corpus.

  object_first_candidate:
    tracked_object: >-
      EACH RECORDED RESULT, classified against an explicit intermediate-
      result spectrum.
    lossiness: >-
      Reducing a result to a class discards its content, which is what
      makes the distribution across classes legible.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while records state what they concluded; those that do not
      are the classification's key entries.

  null_object_control: >-
    NULL 1 -- a record known to be a section 4 closure, which must classify
    as one; misclassification means the criteria are wrong. NULL 2 -- a
    record known to be a fatigue report, which must NOT classify as a
    closure, since distinguishing those two is the classification's whole
    point.

  discriminated_from:
    - >-
        docs/inventor-protocol.md section 4, which defines the closure
        standard; this record classifies against it and adds the classes
        below closure that the protocol does not enumerate.
    - >-
        The findings-promotion and scoped-negative audits in this series,
        which check whether records meet their claimed standard; this asks
        which standard they were aiming at.

  assumptions:
    - >-
        Records state their conclusions clearly enough to classify; those
        that do not are reported rather than forced.
    - >-
        The class criteria are precise enough that classification is
        repeatable, which the two nulls test directly.

  predictions:
    - metric: >-
        known-closure null
      direction: different
      minimum_effect: >-
        FORCED classified as a closure.
    - metric: >-
        known-fatigue-report null
      direction: different
      minimum_effect: >-
        FORCED NOT classified as a closure; conflating the two is the
        specific error the classification exists to prevent.
    - metric: >-
        distribution of records across classes
      direction: different
      minimum_effect: >-
        The deliverable; a distribution concentrated in the lowest
        classes explains the corpus's negative reading without implying
        the work was wasted.
    - metric: >-
        classes the program has never produced
      direction: different
      minimum_effect: >-
        Reported explicitly; an empty class is either unreachable or
        unattempted and the difference matters for planning.

  minimal_test:
    design: >-
      Symbolic classification of the ECC evidence and decision records,
      both nulls first.
    controls:
      - >-
          Known-closure and known-fatigue-report nulls.
      - >-
          Criteria fixed in writing before classification begins.
      - >-
          Records too vague to classify reported as a distinct category.
      - >-
          Classification judgements recorded per record rather than
          applied silently.
    required_metrics:
      - >-
          Class distribution over the corpus.
      - >-
          List of never-produced classes.
      - >-
          Count of unclassifiable records.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        A null misclassifies. The criteria are wrong; fix before
        classifying anything.
    - >-
        The distribution is concentrated in the lowest classes. That
        explains the corpus's negative reading and says which class the
        program should target next, which is directly actionable.
    - >-
        Several classes have never been produced. Whether they are
        unreachable or merely unattempted is the follow-up question and
        the record must not assume either.
    - >-
        Many records are unclassifiable. The corpus does not state its
        conclusions in classifiable terms, which is a process finding
        independent of the science.

  confounders:
    - >-
        CRITERIA DRIFT: classification criteria written after seeing the
        corpus will fit it, so they must be fixed in writing first and the
        nulls chosen before classification begins.
    - >-
        CLASS ORDERING: presenting classes as a ladder implies lower
        classes are lesser, which would devalue exactly the instrument and
        cost-model work this program most needs; the classes should be
        ordered by claim strength, not by worth.

  interpretation_limits:
    - >-
        A classification scheme; makes no scientific claim and does not
        evaluate any record's quality.
    - >-
        Scoped to records that state their conclusions classifiably.
    - >-
        An empty class is not evidence that the class is unreachable.

  heuristic_assumptions:
    - id: HEUR-RESCLASS-1
      statement: >-
        The defined intermediate classes span what this program can
        produce between no result and a break.
      rigorous_support: >-
        Rigorous ingredient: the classes are derived from what the
        program's own contract recognises -- closures at the section 4
        standard, scoped negatives under the evidence rules, validated
        instruments, corrected cost models. THE GAP: the spectrum is
        derived from what the program has produced and named, so a
        genuinely new kind of result would have no class and would be
        recorded as unclassifiable rather than as novel.
      falsification_condition: >-
        A record whose conclusion is clearly a result but fits no
        defined class.
      validation_plan: >-
        SAMPLE: all classifiable ECC evidence and decision records. TAIL
        CHECK: unclassifiable records, reviewed individually to see
        whether any represents a class the spectrum is missing.
        TRANSFER: none; the spectrum describes this program.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent result taxonomy exists here; the goal states two
      endpoints and the inventor protocol defines one standard between
      them.
    hidden_overhead: >-
      A ladder-shaped taxonomy risks devaluing instrument and cost-model
      work, which is most of what this program can actually deliver.
    tradeoff_note: >-
      An explicit spectrum makes progress legible and risks encoding the
      program's current limits as the definition of progress.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As science: nothing is claimed. As a result
    taxonomy for this program: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: an explicit intermediate-
    result spectrum bound to the program's own closure standard, the
    corpus's distribution across it, a list of classes never produced, and a
    count of records too vague to classify.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that criteria can be fixed precisely enough for the nulls to pass.
    0.6 that most records classify. 0.7 that the distribution concentrates
    in the lower classes, which would explain the corpus's negative reading
    and reframe what the campaign should target.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-ECDLP-002
