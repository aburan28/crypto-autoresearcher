idea:
  id: IDEA-20260807-4ee607
  question_id: RQ-AES-001
  added: '2026-08-07'
  title: >-
    Slope-collision fibre histogram of Graph(S): Graph(Inv) is a conic, L is
    what breaks it, and the MixColumns coefficients measure as unexceptional
    in the coincidence law, r = 1 exhaustive S-box level consumed at r = 3,4
  class: measurement

  claim: >-
    FORMALIZATION OF CATALOGUE ENTRY A1-9 (ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md,
    lines 688-753). A negative prediction, stated as the claim: the
    coincidence rate of a two-round exchange/mixture structure at r = 3, 4 is
    fully explained by the slope-generic fibre law of x -> S(x) + a*x (a
    per-slope fibre-size histogram, an integer partition of 256, computed
    exhaustively over all 256 slopes with no AES query), with no
    AES-coefficient bonus: the ratio (measured coincidence rate) / (rate
    predicted from the frozen fibre histogram) is 1.00 +/- resolution in both
    an AES-MixColumns arm and an arm using an invertible all-nonzero MDS
    matrix drawn from the extremes of the fibre-histogram maxima. The AES
    S-box arm and the alternative-MDS arm's ratio is predicted to equal the
    ratio predicted from their two respective fibre histograms. No break, no
    key recovery, no relation to any baseline mechanism or published result is
    claimed; ceiling control (the expected verdict is a CLOSED negative on the
    "MixColumns coefficients are special" hypothesis, with the exact histogram
    as receipt), sota_delta 0.

  mechanism: >-
    Graph(Inv) over GF(2^8) is the conic xy = 1 together with (0,0), so every
    GF(2^8)-line meets it in at most 2 points and N_Inv(a,b) =
    #{x : Inv(x) + a*x = b} <= 2 for all a != 0 -- a hard, exact, re-derivable
    known-answer gate. The AES S-box is L o Inv with L only GF(2)-affine, so L
    is exactly the operative obstruction to the conic bound persisting into
    S -- the same L-not-Inv boundary KN-FIND-028 Fact 2 establishes for
    collinearity, here appearing on the map's graph rather than on
    collinearity of difference vectors. The event "two branches of an
    exchange/mixture structure coincide after one MixColumns-fed-forward
    S-box" is exactly N(a,b) >= 2 with a a MixColumns coefficient, so the fibre
    histogram is the exact per-byte coincidence law. Re-derived in the
    catalogue session (re-derivable in seconds, standard library only, not a
    ledger measurement): max N(a,.) for a = 01,02,03 is 4,5,5; for the inverse
    coefficients 09,0b,0d,0e it is 5,5,5,6; over all 255 nonzero slopes the
    maxima histogram is {4:84, 5:136, 6:31, 7:3, 8:1} -- the MixColumns
    coefficients sit squarely in the bulk and the global maximum 8 is attained
    by a slope that is not one of them. The tracked object discards which x
    lands in which fibre and every value, keeping only the partition shape;
    many boxes share a shape, so nothing beyond the shape is recoverable.

  novelty_status: unverified

  source_refs:
    - ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/A1.md (frame/CEILING section
