idea:
  id: IDEA-20260808-040db9
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SNOVA-001
  goal_id: GOAL-SNOVA-001
  title: Because SNOVA's oil space is an A-module, the attacker gets ell times more equations
    for ONE oil vector than a matched plain UOV gives -- P'(X, S^j X) = 0 for j = 0..ell-1
    -- and the resulting over-determination is a measured drop in solving degree that plain
    UOV, MAYO and QR-UOV do not exhibit
  class: mechanism
  claim: 'DERIVED THIS SESSION. Let O be SNOVA''s secret oil object. O is stable under the
    coefficient algebra A = F_q[S], so for X in O and every a in A, aX is also in O, hence
    the polar condition P''(X, aX) = 0 holds for every public equation and every a. Taking
    a = 1, S, ..., S^{ell-1} gives ell blocks of conditions. Over F_q, each block is m*ell^2
    scalar equations quadratic in the n*ell^2 coordinates of X, so the derived oil-vector
    system has up to ell * m * ell^2 equations rather than the m * ell^2 that the flattened
    public system gives. At RECALLED SNOVA-I (v,o,ell,q) = (24,5,4,16): m = o = 5, n = 29,
    so the flattened system has 80 equations in 464 unknowns while the A-derived system has
    up to 320 equations in the same 464 unknowns -- a fourfold over-determination the matched
    plain UOV at (464, 80, 80) does not have. CLAIM: (i) the F_q-rank of the derived equation
    set is c * m * ell^2 with c strictly greater than 1 for SNOVA; (ii) c = 1 for a matched
    plain UOV key and for QR-UOV (where the same conditions are A-multiples of the originals
    and add nothing -- see M1-08); (iii) the measured solving degree of the A-derived system
    is strictly below that of the flattened system at matched toy parameters, and the gap
    grows with ell.'
  mechanism: A UOV attacker's only equations for a single oil vector are P_a(x) = 0. A module
    structure hands over the polar conditions between an element and its algebra translates
    for free, because both lie in the oil object. This is not a new attack technique; it is
    a statement that SNOVA's public key contains more usable equations than its nominal equation
    count suggests, and the measurable question is how many of them are INDEPENDENT. Independence
    is exactly where SNOVA and QR-UOV must differ, because QR-UOV's map is A-bilinear and
    SNOVA's is not.
  why_not_a_renamed_known_approach: 'Nearest known method: the reconciliation attack (solve
    the public system for one oil vector), applied to the flattened key. The difference is
    the equation set: reconciliation uses m*ell^2 equations, this uses up to ell times more,
    obtained from the module structure rather than from the public map. Nearest internal record:
    IDEA-20260805-70aa6e establishes that the oil space is an A-module and counts admissible
    oil OBJECTS, concluding the resulting ceiling is not binding. This record does not count
    objects; it counts EQUATIONS in the derived single-vector system and measures the solving
    degree, and a non-binding object ceiling is fully consistent with a large equation gain.'
  predictions:
  - observable: F_q-rank of the span of the derived equation set {P_a(x)} union {P'_a(x, S^j
      x)} for a SNOVA key, a matched flattened plain-UOV key, and a random null
    metric: integer rank, normalised by m*ell^2
    predicted: 'SNOVA: strictly above 1, approaching ell if the twist support is full. Plain
      UOV: exactly 1 (in char 2, P''(x,x) = 0 and there is no algebra to translate by). Random
      null with a planted A-module isotropic subspace: same as SNOVA, which is the decisive
      control.'
  - observable: measured solving degree of the derived vs flattened system at toy SNOVA parameters
    metric: integer solving degree
    predicted: Derived strictly lower at every cell with ell >= 2, gap increasing with ell.
      Equality falsifies the claim's operational half.
  - observable: total charged cost (field ops and peak Macaulay elements) of the two systems
    metric: operations and field elements
    predicted: Derived cheaper in time; memory may be WORSE because the derived system has
      more equations at the same variable count, and that is reported rather than hidden.
  minimal_test: 'Toy SNOVA at (v,o,ell,q) = (4,2,2,16), (6,3,2,16), (4,2,3,16), (6,3,3,16).
    For each: build the flattened public system and the A-derived system, compute the exact
    F_q-rank of each equation span, then solve both to a certified oil vector and record solving
    degree, field operations and peak Macaulay size. Run the identical pipeline on (a) a matched
    flattened plain-UOV key at the same (N, M, O), (b) a random system with a planted A-module
    isotropic subspace, (c) a random system with a planted plain F_q isotropic subspace of
    the same dimension.'
  controls:
  - MATCHED PLAIN UOV at identical flattened (N, M, O) -- the baseline GOAL-SNOVA-001 requires.
  - 'PLANTED A-MODULE NULL: if this reproduces SNOVA''s gain exactly, the gain is a property
    of having a module-structured oil object and NOT of SNOVA''s twists, which is the correct
    and more useful finding.'
  - 'PLANTED F_q-SUBSPACE NULL: must show no gain, isolating the module structure as the cause.'
  - 'ELL-SWEEP: the rank ratio must grow with ell. A ratio flat in ell is the artifact tell.'
  confounders:
  - The derived equations may be linearly dependent on the originals for reasons unrelated
    to the ring (e.g. char-2 identities), inflating the apparent rank gain; the plain-UOV
    control measures exactly that baseline.
  - More equations can RAISE the solving degree in practice if they induce degree falls the
    solver cannot use, so the direction of the solving-degree prediction is not automatic.
  - Toy ell = 2, 3 with o = 2, 3 is far from ell = 4, o = 5; the gap's growth may not persist.
  - 'Memory: the derived system''s Macaulay matrix is wider; a time win with a memory loss
    is not a win under a charged model and the table must show both.'
  falsification_conditions:
  - The derived equation span has the same rank as the flattened one for SNOVA.
  - The planted-F_q-subspace null shows the same gain (then the effect is not the module).
  - The derived system's solving degree is not below the flattened one at any cell.
  interpretation_limits: Toy scale, declared. No attack on published SNOVA is claimed and
    no reported SNOVA attack is cited or reproduced. The deliverable is a measured equation-count
    and solving-degree gap against a matched plain-UOV baseline, which is one of GOAL-SNOVA-001's
    stated needs.
  assumptions:
  - The oil object is A-stable (definitional for SNOVA's construction, RECALLED).
  - Characteristic 2, so P'(x,x) = 0 and the a = 1 block is vacuous (stated so the count is
    honest).
  heuristic_assumptions:
  - id: HA-1
    statement: For a SNOVA key with full Frobenius twist support, the derived equations {P'_a(x,
      S^j x)}_{j=1..ell-1} are linearly independent of {P_a(x)} and of each other, up to a
      deficiency of O(m) equations, uniformly for ell <= 4.
    rigorous_ingredient: The rank of the derived span is bounded ABOVE by ell*m*ell^2 exactly
      (it is a span of that many vectors), so only the lower bound is heuristic; and the a
      = 1 block is provably vacuous in char 2, which fixes the leading term.
    distribution_imitated: '"The derived equations behave like independent random quadratic
      forms" -- the standard genericity imitation, here applied to a derived rather than a
      given system.'
    validation_route: Exact F_q-rank of the derived span for 200 keys at each toy cell, compared
      against ell*m*ell^2 and against the plain-UOV baseline m*ell^2. TOY SCALE. The measured
      rank is an exact integer, so this is a direct measurement, not an estimate.
    tail_checks: Record the minimum rank across keys. A key with rank equal to the plain-UOV
      baseline would be a weak/strong-key outlier and must be reported, not averaged.
  target_complexity:
    time_exponent: If the rank ratio is c, the derived oil-vector system has c*m*ell^2 equations
      in n*ell^2 variables, so the effective over-determination ratio moves from m/n to c*m/n.
      For the semi-regular model the solving degree is a decreasing function of that ratio,
      so the exponent of binom(n ell^2 + d, d)^omega falls with c. At RECALLED SNOVA-I, c
      = 4 moves the ratio from 80/464 = 0.17 to 320/464 = 0.69 -- a large move in exactly
      the parameter that controls d_reg.
    memory_exponent: binom(n ell^2 + d, d) field elements, and the derived system's larger
      equation count does NOT reduce this width; the saving is entirely in d. Memory must
      be charged at the reduced d and reported next to the flattened figure.
    best_known_baseline: Matched plain UOV at flattened (N, M, O) = (464, 80, 80) RECALLED,
      plus SNOVA's own claimed levels. The reported external attacks are not used as a baseline
      because this program has not read them.
    hidden_overhead_disclosure: The semi-regular model is being applied to a DERIVED system
      that is provably non-generic (it is built from one key), which is precisely the assumption
      most likely to fail; the measured solving degree, not the model, is the deliverable.
    time_memory_tradeoff: The hybrid (fix j variables) applies to both systems and must be
      re-optimised for each; a comparison at fixed j is not a comparison.
  sota_delta: 'Against matched plain UOV at flattened parameters: a factor-c increase in usable
    equations, with c predicted near ell. Against SNOVA''s own claimed level: no claim, because
    the solving degree is measured only at toy parameters. The honest headline is a measured
    equation-count ratio with two nulls.'
  dominated_by: 'As an attack: dominated by the reported SNOVA attacks (which this program
    has not read and therefore cannot compare against quantitatively -- stated as an explicit
    gap rather than a null). As an instrument: not dominated by any corpus record. Frontier
    rows checked: IDEA-20260805-70aa6e (object counting), -54723a (multiplier algebra), -2f2863
    (weak keys), IDEA-20260801-016 (toy map), plus the flattened reconciliation and intersection
    rows.'
  estimated_cost: 'Implementation medium: SNOVA toy key generation, a derived-equation builder,
    exact rank and a Groebner solve. Compute medium: solving degrees at N ~ 100-200 toy variables.'
  recommended_priority: high
  honest_prior_of_survival: 'That the derived equations exist and are correct: ~0.95 (it follows
    from A-stability). That their rank exceeds the plain-UOV baseline materially: ~0.75. That
    the planted-A-module null reproduces the effect, making it a regime property rather than
    a SNOVA property: ~0.6 -- which would still be the right answer and is why the null is
    mandatory. That a solving-degree drop is measured: ~0.6.'
  novelty_status: unverified
  novelty_screen: Same corpus screen as M1-05. IDEA-20260805-70aa6e read at title/claim level
    and explicitly discriminated. No corpus record derives P'(x, S^j x) = 0 or measures a
    derived equation rank. WEB NOT CHECKED.
  discriminated_from: 'IDEA-20260805-70aa6e: counts admissible oil objects over an algebra
    (a Grassmannian/Morita count) and concludes the ceiling is not binding; this record counts
    independent EQUATIONS in the derived single-vector system and measures solving degree.
    The two are logically independent. M1-08 (this file): the same derivation applied to QR-UOV
    with the OPPOSITE predicted outcome, which is the point of the pair.'
  source_refs:
  - SNOVA specification -- REQUIRED READ, NOT YET READ.
  - KN-TECH-004, KN-TECH-011 (internal: solving degree, degree of regularity).
