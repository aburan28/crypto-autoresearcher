        docs/target-result-profile.md
    - ref: >-
        Supersingularity of y^2 = x^3 + x when p is congruent to 3
        modulo 4, recalled textbook criterion
      provenance: recalled
      claim: >-
        A recalled criterion says y^2 = x^3 + x is supersingular over
        F_p when p is congruent to 3 modulo 4. p = 19 satisfies the
        congruence. This session did not open a proof, and the
        prediction does not use the criterion as a checked source.
  assumptions:
    - >-
      z^2 - 2 is irreducible over F_19. The squares in F_19 were
      enumerated in this session as 0, 1, 4, 5, 6, 7, 9, 11, 16, 17,
      and 2 is not among them.
    - >-
      E_N is nonsingular over F_19 because 4*(2^3) + 27*(3^2) = 275
      is congruent to 9 modulo 19, not 0. E_A is nonsingular because
      its B coefficient is 0 and A = 1.
    - >-
      F6 is used only as the operation pi. No isogeny path is walked
      and no factor base is built.
    - >-
      The sign-flip rule for y1 holds for every short-Weierstrass
      equation defined over F_19 in this basis. A gap, if it exists,
      is a gap of fiber sizes, not a gap of the update rule.
  proof_search_map:
    not_applicable_reason: >-
      This is a pre-registered fiber comparison at one prime, not a
      proof that any factor of the p^{1/3+o(1)} algorithm moves.
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
