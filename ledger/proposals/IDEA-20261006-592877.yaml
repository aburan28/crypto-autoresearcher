idea:
  id: IDEA-20261006-592877
  added: '2026-10-06'
  status: proposed
  approved_by: null
  question_id: RQ-SSIQ-9702af
  title: >-
    Max fiber of the z-coefficient of y under Frobenius, on y^2 = x^3 + x
    over F_361, against y^2 = x^3 + 2x + 3
  class: measurement
  claim: >-
    Toy instance only, prediction fixed before any run. Let p = 19 and
    F_361 = F_19[z]/(z^2 - 2). Let E_A be y^2 = x^3 + x and E_N be
    y^2 = x^3 + 2x + 3, both over F_19 and base-changed to F_361.
    Representation class R1 of RQ-ECDLP-623a32: write y(P) = y0 + y1 z
    with y0, y1 in F_19. The attack stage whose charged cost is in
    question is list cardinality in the p^{1/3+o(1)} isogeny algorithm,
    and this claim does not say that cost moves. Let m(E) be the maximum,
    over c in F_19, of the number of affine points P in E(F_361) with
    y1(P) = c. Prediction: m(E_A) - m(E_N) is at least 4. A gap smaller
    than 4, a tie, or a gap whose sign is opposite, is a negative for
    this prime and these two equations. No point-count integer is
    predicted. The rho exponent stays 1/2 and the conditional isogeny
    exponent stays 1/3.
  mechanism: >-
    PAIR. Representation: the F_19-coordinate y1 of the Weierstrass
    y-coordinate in the basis {1, z} of F_361. Operation set Sigma is
    the singleton {pi}, the 19-power Frobenius on points, not the
    translation group of E. Trichotomy class: partial-action. Reason:
    both equations are defined over F_19 and z^2 - 2 splits as
    (X - z)(X + z) in F_361, so pi(y0 + y1 z) = y0 - y1 z, and the
    curve equations are fixed by pi, so y1(pi(P)) = -y1(P) depends
    only on y1(P). Lossy-projection test against Sigma = {pi}.
    Discarded: y0, both coordinates of x, and which point was chosen
    inside the fiber of y1. The discard is compatible with Sigma
    because the update y1 |-> -y1 never reads the discarded
    coordinates. It is lossy because the test counts fibers and a
    fiber of size 1 for every c would be the only non-lossy outcome;
    the prediction says the largest fiber on E_A is at least 4 larger
    than on E_N, so the retained coordinate is not a relabeling of
    the point. Orbit-canonicalisation of a {c, -c} pair is one
    negation in F_19 on both arms, so that cost does not discriminate.
    The open number is the max fiber, which is the loss of y1. The
    minimal test measures it on E_A and on the null curve E_N of the
    same shape (short Weierstrass over F_19, same basis, same Sigma).
    A second null of the same shape is the complete set of field
    elements y = y0 + y1 z, whose fiber of y1 is exactly 19 for every
    y1; the curve fibers are reported against that rectangle as an
    instrument check, not as the success gap. F6 (endomorphism orbit)
    is a named component: pi is Sigma. The primary lens is the fiber
    of y1, not a search of a Frobenius orbit and not an isogeny path.
    Families F1 through F5 and F7 are not the lens.
  novelty_status: unverified
