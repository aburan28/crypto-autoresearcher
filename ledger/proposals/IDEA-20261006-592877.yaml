      distinct_preimage_search: not_applicable
    constructive_transforms: []
    quantifier_order: not_applicable
    method_ceiling:
      strongest_certifiable_claim: not_applicable
      nearby_object_control: not_applicable
    proof_obligations: []
  predictions:
    - metric: max fiber gap of y1, m(E_A) minus m(E_N)
      direction: higher
      minimum_effect: at least 4
  minimal_test:
    design: >-
      Enumerate every affine point of E_A(F_361) and of E_N(F_361) by
      testing squares of the right-hand side. For each point express y
      in the basis {1, z} and histogram y1. Compute m(E_A) and m(E_N).
      Do not replace the histogram by a trace formula. Separately
      histogram y1 over all p^2 field elements and check that each
      fiber has size 19; a failure of that check invalidates the
      instrument.
    controls:
      - >-
        Null curve E_N: y^2 = x^3 + 2x + 3 over the same field and the
        same basis, same Sigma.
      - >-
        Rectangle null: every y in F_361, fiber of y1 exactly 19.
      - >-
        Sign-flip check: for every affine P, y1(pi(P)) = -y1(P). A
        single failure invalidates that arm.
    required_metrics:
      - m(E_A)
      - m(E_N)
      - m(E_A) minus m(E_N)
      - affine point counts of both curves, recorded and not predicted
      - fraction of sampled P with y1(pi(P)) equal to -y1(P)
  falsification_conditions:
    - >-
      m(E_A) minus m(E_N) is less than or equal to 3, including a
      negative difference and a tie.
    - >-
      The rectangle null does not have fiber 19, or the sign-flip check
      fails. That outcome is an invalid instrument, not a positive.
    - >-
      A timeout, crash, or incomplete enumeration is infrastructure,
      not a falsification and not support.
  confounders:
    - >-
      Different group orders can change the largest histogram bin. The
      test records both affine counts. If the fiber gap is smaller than
      the absolute difference of the affine counts, the gap is explained
      by sample size and is not success.
    - >-
      The basis {1, z} is part of the representation. A different
      irreducible would be a different experiment.
    - >-
      Points at infinity have no y and are excluded. Dropping the
      two points with a given x, or keeping only one sign of y, changes
      the histogram.
  interpretation_limits:
    - >-
      A gap of at least 4 at p = 19 is a toy fiber gap. It does not
      move the exponent 1/3, does not shrink the Wesolowski list at
      cryptographic size, and does not show that y1 is a block of any
      isogeny action.
    - >-
      A negative closes only these two equations at p = 19 in this
      basis. It does not close Frobenius-coordinate filters at other
      primes.
    - >-
      y1 is not a degree-d function from E to the projective line over
      F_19: it uses a chosen F_19-basis of y and the sign of y. It is
      not the Kummer x-line.
    - >-
      No KN-OPEN-020 factor base is proposed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a short-Weierstrass curve over F_p with p = 19, the
        histogram of y1 on E(F_{p^2}) differs in its maximum bin from
        the same histogram on a second nonsingular equation with
        nonzero B by at least 4, as if the extra automorphism of
        y^2 = x^3 + x biased the linear coefficient of y the way a
        character sum over a thinner set biases a bin.
      rigorous_support: >-
        The Hasse bound on the point count controls the point count
        only. It does not by itself bound the max fiber of y1. The
        fiber gap is the unproved imitation.
      validation_plan: >-
        The minimal test enumerates every affine point at p = 19, so
        the sample is the full set, not a draw. Compare m(E_A) with
        m(E_N) and with the rectangle fiber 19. Second-scale control,
        only if the p = 19 gap is at least 4: repeat the identical
        comparison at p = 31 with F_961 = F_31[z]/(z^2 - 3), the same
        two equations, and the same minimum gap of 4. This session
        checked that 3 is not a square modulo 31. A gap at p = 19 whose
        sign flips at p = 31 falsifies H1 as a stable bias and leaves
        the p = 19 observation scoped to p = 19.
  target_complexity:
    time_exponent: p^{1/3+o(1)} conditional, unchanged
    memory_exponent: p^{1/3+o(1)} conditional, unchanged
    best_known: >-
      p^{1/2} times (log p) to a constant power, unconditional
      polynomial-memory isogeny search, and p^{1/3+o(1)} time and
      memory conditional on the archived smoothness heuristic
    hidden_overhead: >-
      No new o(1) is claimed. The incumbent o(1) still hides the
      superpolynomial smoothness overhead named in the target profile.
    tradeoff_note: >-
      Canonicalising one pair {c, -c} is one negation, memory O(1)
      beyond the point list. This does not sit on a new
      van Oorschot-Wiener curve. Exponent delta is 0.
