    "title": "Finite-state carry constraints for a prime-field decomposition circuit",
    "class": "representation",
    "claim": "R1 representation at the decomposition/relation stage. For the same interval factor base, exact carry-state merging may reduce the effective search width relative to raw digit guessing without reducing the decomposition yield. The initial target is a 2x end-to-end decomposition saving, not an asymptotic ECDLP claim.",
