idea:
  id: IDEA-20260831-3fa5c9
  question_id: RQ-MONO-001
  added: '2026-08-31'
  title: >-
    Does the Fisher-combined statistic H-MONO-663fb4 introduced specifically
    to catch the many-mild-curves regime have ANY power to detect a genuine
    effect in that regime, or is its demonstrated-absent sensitivity (per
    EXP-MONO-b1423c/EV-MONO-0e7ace) a property of every effect size, not just
    the single/few-extreme-outlier case already ruled out?

  class: control

  claim: >-
    H-MONO-663fb4's most recent status_note (DEC-20260831-7d623d,
    EV-MONO-0e7ace, EXP-MONO-b1423c) closed part of the Fisher-combined
    statistic's sensitivity question: using a maximally-extreme positive
    control (a proper subgroup factor base with exact C/F=1.0), the statistic
    was shown NOT to reject at k~49-191 curves, and this was independently
    established as a STRUCTURAL consequence of the permutation floor capping
    any single cell's maximum possible contribution -- not an implementation
    defect. Both independent reviewers converged on the resulting
    characterization: Fisher-combined's sensitivity is "demonstrated absent
    for the single/few-extreme-outlier case... entirely untested for the
    many-mild-curves case the statistic was actually introduced for," and
    named a concrete, low-priority follow-up: "a multi-curve, mild-
    perturbation positive control (5-15 curves, sub-extreme effect size)."
    This idea proposes exactly that follow-up, specified concretely. THE
    DISCRIMINATION, stated as two mutually exclusive outcomes neither of
    which is assumed: (A) the Fisher-combined statistic DOES reject at a
    realistic effect size distributed across several curves, even though it
    could not reject the single-extreme-outlier case -- meaning the
    permutation-floor cap that defeated it in the extreme-outlier regime does
    NOT bind in the many-mild-curves regime (because Fisher combination pools
    evidence multiplicatively across independent cells, so k moderately-
    informative p-values can jointly cross a threshold no single p-value
    individually can, even when no single cell's floor is itself
    threshold-crossing) -- confirming the statistic has SOME genuine
    detection capability distinct from, and complementary to, the per-curve
    Holm test; or (B) the Fisher-combined statistic ALSO fails to reject in
    the many-mild-curves regime at a realistic effect size, at the SAME
    sample budget already spent in this three-experiment lane -- meaning
    the statistic has never been shown to detect ANY real deviation, in
    either its introduced regime or its extreme-outlier regime, and its
    continued use as a "co-equal primary metric" in this lane's own
    protocol (per KN-TECH-a810e4's own framing) should be reconsidered by
    the Coordinator as a specific, named, actionable finding rather than
    left as an open qualification.

  mechanism: >-
    Reuses H-MONO-663fb4's own established machinery (the character-bias
    identities (I1)-(I3), the Fisher-combined p-value statistic exactly as
    implemented and reviewed in EXP-MONO-c819ba/EXP-MONO-b19c6b/
    EXP-MONO-b1423c, and the permutation-null calibration already validated
    at n=20000 draws per KN-TECH-95a42b's floor check) with one new
    ingredient: a PLANTED, GRADED, MULTI-CURVE effect.
    STEP 1 (the planted mild perturbation). Select 5-15 curves from the
    already-used generic-ordinary panel. For each selected curve, construct
    its factor base as a mild perturbation of the uniform x-coordinate
    factor base: replace a small, disclosed fraction (a candidate ladder:
    2%, 5%, 10% of |F|) of the factor base's elements with elements drawn
    from a fixed proper subgroup coset, so that each perturbed curve's
    character bias C/F is elevated by a modest, EXACTLY COMPUTABLE amount
    above its matched-random-subset null (not the exact C/F=1.0 extreme of
    the already-tested subgroup control), while the remaining curves in the
    panel are left as ordinary, unperturbed matched-random-subset nulls.
    STEP 2 (per-curve statistics, unchanged). Compute the per-curve
    permutation p-value for K3/K4 (Var_real/Var_null and (C/F)_real/
    (C/F)_null) exactly as the existing, already-validated instrument does,
    at the SAME n=20000-draw budget already shown to be powered per
    KN-TECH-95a42b.
    STEP 3 (the Fisher combination). Combine the per-curve p-values via the
    Fisher-combined statistic exactly as implemented in EXP-MONO-b19c6b/
    EXP-MONO-b1423c, across the FULL planted panel (perturbed plus
    unperturbed curves together, exactly mirroring how a real, unknown,
    partially-affected panel would be analyzed) and separately across the
    perturbed-curves-only subset (an oracle upper bound on the statistic's
    best-case sensitivity at this effect size, disclosed as an oracle
    comparator rather than a realistic operating condition).
    STEP 4 (the graded ladder). Repeat Steps 1-3 across the perturbation-
    fraction ladder (2%, 5%, 10%) and, at the middle rung, across panel sizes
    in {5, 10, 15}, to locate -- rather than merely assert -- the boundary
    between "too mild/too few curves to detect" and "detectable", if one
    exists within the tested range.
    WHY THIS DIRECTLY DISCHARGES THE NAMED GAP, NOT A DIFFERENT ONE.
    KN-TECH-a810e4's own rule states precisely what this idea is designed to
    satisfy: "a new primary metric introduced to widen detection inherits
    every existing positive-control obligation the metric it supplements
    already discharged -- it does not inherit the discharge itself,"
    and "confirming a statistic's SPECIFICITY... is a distinct fact from
    confirming its SENSITIVITY." EXP-MONO-c819ba's null-object gate already
    established Fisher-combined's specificity (it does not fire on
    null-vs-null); EXP-MONO-b1423c established its INSENSITIVITY at one
    extreme (single maximally-biased outlier). Neither establishes sensitivity
    at the regime the statistic exists for. This idea is that missing
    measurement, at the graded effect size and panel composition the
    reviewers themselves specified.

  novelty_status: adaptation
  novelty_status_note: >-
    Grepped ledger/hypotheses/H-MONO-663fb4.yaml and
    ledger/decisions/DEC-20260831-7d623d.yaml (the only two hits for
    "mild-perturbation"/"sub-extreme"); both name this exact follow-up as
    low-priority, not-yet-dispatched future work, with no execution record
    found. The statistic, its implementation, its null calibration, and the
    planted-subgroup-coset perturbation mechanism are all inherited
    unmodified from the existing three-experiment lane (EXP-MONO-c819ba,
    EXP-MONO-b19c6b, EXP-MONO-b1423c); this idea's only new content is the
    specific graded multi-curve perturbation design (fraction ladder x panel
    size ladder x full-panel vs oracle-subset comparison) needed to actually
    run the named follow-up. Labelled `adaptation`.

  citations:
    - ref: H-MONO-663fb4
      provenance: internal
      claim: >-
        Its current status_note (via DEC-20260831-7d623d) states the Fisher-
        combined statistic's sensitivity was shown structurally absent for
        the single/few-extreme-outlier case (permutation-floor cap) and
        "entirely untested for the many-mild-curves case the statistic was
        actually introduced for," naming "a multi-curve, mild-perturbation
        positive control (5-15 curves, sub-extreme effect size)" as an
        available, low-priority, not-dispatched future direction recommended
        by both reviewers.
      verified_by: idea-generator (this session, read in full, including all
        superseded status_note fields for chronology)
    - ref: KN-TECH-a810e4
      provenance: internal
      claim: >-
        States the general rule this idea operationalizes: a new statistic
        introduced to widen detection inherits every prior positive-control
        obligation but not the prior discharge of it, and specificity
        (does not fire on null) is distinct from sensitivity (does fire on
        genuine positive); names H-MONO-663fb4's Fisher-combined statistic as
        its own worked example of exactly this gap.
      verified_by: idea-generator (this session, read in full)
    - ref: KN-TECH-95a42b
      provenance: internal
      claim: >-
        Establishes the floor-vs-threshold arithmetic check (permutation
        p-value floor 1/(n+1) against the Holm/Bonferroni threshold alpha/m)
        that this idea's design must satisfy before any run: at n=20000
        draws (already the validated budget in this lane per
        EXP-MONO-b19c6b), the floor is far below any realistic per-cell
        Holm threshold, so the per-curve test retains power; the Fisher
        combination's own effective sample size (number of combined p-values,
        not draws-per-cell) must be separately checked for the same
        floor-vs-threshold pathology given only 5-15 curves are combined.
      verified_by: idea-generator (this session, read in full)
    - ref: KN-TECH-7745e6
      provenance: internal
      claim: >-
        Establishes the null-calibration discipline (bootstrap the band
        under the null; scan draw count; run a null-object control; correct
        for cells actually tested) that this idea's design must apply to the
        planted-perturbation null arm before any positive result is trusted.
      verified_by: idea-generator (this session, read in full)

  assumptions:
    - >-
      The subgroup-coset perturbation mechanism (replacing a disclosed
      fraction of the factor base with elements from a fixed proper subgroup
      coset) produces an EXACTLY COMPUTABLE, non-extreme elevation in C/F,
      derivable from the same closed-form subgroup spectrum H-MONO-663fb4's
      mechanism STEP 5 already supplies (Shat(chi)=h on the annihilator of
      H, 0 elsewhere), so the planted effect size at each perturbation
      fraction is known exactly before any run, not merely hoped for.
    - >-
      The already-validated permutation-null instrument (n=20000 draws,
      Holm-corrected per-curve thresholds) from EXP-MONO-b19c6b/
      EXP-MONO-b1423c is reused unmodified; no new instrument is built.
    - >-
      5-15 curves is enough for the Fisher combination's own floor-vs-
      threshold arithmetic to be checked before any run (a required Stage 0
      gate per KN-TECH-95a42b's discipline, extended here from per-cell
      permutation floors to the combination's own effective degrees of
      freedom).

  proof_search_map:
    bottleneck: >-
      Whether the Fisher-combined statistic has ANY demonstrated ability to
      detect a real, non-extreme, multi-curve effect at the sample budget
      this lane has already validated -- as opposed to having only ever been
      shown either to correctly stay silent (null-object gate) or to
      correctly-but-uninformatively stay silent on a case it was never
      designed to catch (the single-extreme-outlier positive control).
    baseline_embedding:
      parameter_slice: >-
        The already-run EXP-MONO-c819ba subgroup positive control (C/F=1.0
        exact, single curve) is the extreme end of this idea's own
        perturbation-fraction ladder; reproducing that cell's already-
        established non-rejection under the SAME implementation is the hard
        gate before any new, milder cell is interpreted.
      reproduction_check: >-
        Re-run the exact single-curve, exact-subgroup cell and require
        reproduction of EXP-MONO-b1423c's own non-rejection result and its
        stated permutation-floor cap, using the identical Fisher-combination
        code path this idea's multi-curve arms will also use.
    observation_collision:
      observable: >-
        The Fisher-combined p-value, as a function of (perturbation fraction,
        number of perturbed curves, panel size).
      distinct_preimage_search: >-
        FOUND, and it is exactly what motivates a graded design rather than
        a single cell: a null panel (no genuine effect) and a genuinely
        mildly-affected panel (small effect spread across several curves)
        can in principle produce statistically indistinguishable Fisher-
        combined p-values if the effect size is too small or too few curves
        are affected relative to the panel size -- which is precisely the
        boundary this idea's ladder is designed to locate rather than
        assume away.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The already-validated per-curve permutation-null instrument,
          applied to a DELIBERATELY PLANTED, exactly-known, graded
          perturbation across a multi-curve panel rather than to real,
          unknown curves.
        predicted_gain: >-
          Converts an open sensitivity qualification into a measured
          detection-power curve as a function of effect size and panel
          composition, at zero new instrument-development cost.
    quantifier_order: >-
      FOR the tested perturbation-fraction ladder {2%,5%,10%} and panel-size
      ladder {5,10,15}, THERE EXISTS a combination at which the Fisher-
      combined statistic rejects the null at the pre-registered alpha
      (bounded, falsifiable existential over the tested grid); if no such
      combination exists within the tested range, that absence is reported
      as a bounded negative result over the tested grid, not as "Fisher-
      combined has no power at any effect size."
    method_ceiling:
      strongest_certifiable_claim: >-
        Whether the Fisher-combined statistic, at this lane's own already-
        validated sample budget, can detect a planted effect of the tested
        magnitudes and panel compositions. Cannot certify the statistic's
        power at effect sizes or panel sizes outside the tested grid, and
        cannot certify anything about whether any REAL curve exhibits such
        an effect (this idea plants a known effect; it does not search for
        one).
      nearby_object_control: >-
        The already-run exact-subgroup single-curve cell (C/F=1.0) is the
        nearby-object control on which the statistic is already known to
        fail to reject, for a STRUCTURAL reason (the permutation floor). A
        method that ALSO fails at every tested milder, multi-curve
        combination has not merely failed once; it has failed across the
        entire tested design space, which is a materially stronger and more
        actionable finding than the single-cell result already on record.
    proof_obligations:
      - claim: >-
          The planted perturbation's exact C/F elevation is computed in
          closed form from the subgroup spectrum before any sampling occurs.
        responsibility: baseline
      - claim: >-
          The single-curve, exact-subgroup cell reproduces the already-
          committed non-rejection result under this idea's own
          implementation.
        responsibility: correctness
      - claim: >-
          The Fisher combination's own floor-vs-threshold arithmetic (at
          5-15 combined p-values) is checked and reported before any run.
        responsibility: strictness
      - claim: >-
          A detection-power curve (reject/no-reject) is reported across the
          full perturbation-fraction x panel-size grid, not a single cell.
        responsibility: interface

  predictions:
    - metric: >-
        Fisher-combined p-value at the single-curve, exact-subgroup
        reproduction cell
      direction: same
      minimum_effect: >-
        Reproduces the already-committed non-rejection result exactly
        (hard gate; a mismatch here means the implementation differs from
        the prior lane's and nothing downstream is interpretable).
    - metric: >-
        Fisher-combined p-value across the perturbation-fraction x panel-
        size grid, full planted panel
      direction: lower
      minimum_effect: >-
        PRE-REGISTERED, TWO-SIDED, NO PRE-COMMITTED DIRECTION OF THE FINAL
        VERDICT (per this program's own prohibition on experiments with no
        possible negative outcome): at the mildest cell (2% perturbation,
        5 curves), the statistic is predicted MORE LIKELY THAN NOT to fail
        to reject, matching the extreme-outlier finding's structural cause;
        at the strongest tested cell (10% perturbation, 15 curves), the
        statistic is predicted to have a REALISTIC CHANCE of rejecting,
        since pooling across more curves and a larger per-curve effect both
        favor detection. Both directions are reportable outcomes and neither
        is assumed.
    - metric: >-
        Fisher-combined p-value, oracle perturbed-curves-only subset (upper
        bound on best-case sensitivity)
      direction: lower
      minimum_effect: >-
        At the strongest tested cell, predicted to reject more readily than
        the full-panel arm (since diluting with unperturbed null curves can
        only weaken the combined signal); a failure of the oracle arm to
        reject even at the strongest tested cell would be the single most
        informative possible outcome, indicating the statistic's power
        ceiling is below the entire tested effect-size range.
    - metric: >-
        per-curve Holm-corrected test outcome on the same planted panels
      direction: different
      minimum_effect: >-
        Reported alongside every Fisher-combined result as the existing,
        already-power-verified comparator; the per-curve test is predicted
        to detect the individually-perturbed curves directly at the stronger
        perturbation fractions, giving an independent check on whether the
        planted effect is real and detectable by SOME instrument even where
        Fisher-combined is not.

  minimal_test:
    design: >-
      Stage 0 (zero compute): compute the exact C/F elevation for each
      perturbation fraction from the closed-form subgroup spectrum; check
      the Fisher combination's own floor-vs-threshold arithmetic at 5, 10,
      and 15 combined p-values against the pre-registered alpha.
      Stage 1 (reproduction gate): re-run the exact single-curve, exact-
      subgroup cell under this idea's own implementation and require exact
      reproduction of the already-committed non-rejection result.
      Stage 2 (the new measurement): construct planted panels at each
      (perturbation fraction, panel size, number-perturbed) cell of the
      grid, using the SAME curve panel and n=20000-draw permutation-null
      instrument already validated in this lane; compute per-curve p-values,
      the full-panel Fisher combination, the oracle perturbed-only Fisher
      combination, and the per-curve Holm-corrected outcome, at every cell.
      Stage 3 (the detection-power surface): report reject/no-reject across
      the full grid as the primary deliverable, plus the smallest tested
      cell at which rejection first occurs (if any).
    controls:
      - "Stage 1 reproduction gate (hard, must pass before Stage 2 is read)."
      - "Stage 0 floor-vs-threshold arithmetic, checked before any draw is spent."
      - >-
        Matched unperturbed-panel null run at every panel size, to confirm
        the Fisher-combined statistic does not spuriously reject a genuinely
        null multi-curve panel (specificity re-check at the new panel sizes,
        distinct from the already-established single-curve specificity).
    required_metrics:
      - exact planted C/F elevation per perturbation fraction, computed before sampling
      - per-curve permutation p-values, every planted panel
      - full-panel Fisher-combined p-value, every grid cell
      - oracle perturbed-only Fisher-combined p-value, every grid cell
      - per-curve Holm-corrected reject/no-reject, every grid cell
      - matched null-panel Fisher-combined p-value, every panel size

  falsification_conditions:
    - "The single-curve, exact-subgroup reproduction cell fails to match the already-committed non-rejection result."
    - "The matched null-panel arm rejects at a rate materially above the declared alpha at any panel size (specificity failure at the new panel sizes)."
    - "The oracle perturbed-only arm fails to reject even at the strongest tested cell (10% perturbation, 15 curves) -- the single most informative negative, indicating the statistic's power ceiling sits below this entire tested range."
    - "The full-panel arm rejects at a rate materially different from what the per-curve Holm test independently confirms as a real, detectable planted effect, without a stated mechanism for the discrepancy."

  known_errata:
    - field: falsification_conditions[2]
      issue: >-
        An out-of-band commit (725401e05, disclosed in
        CORR-20260831-ca3ec5) changed this bullet's "power ceiling sits
        ABOVE this entire
        tested range" to "sits BELOW this entire tested range", framed
        as fixing a "reversed polarity." Independently re-verified by the
        Coordinator: the ORIGINAL "above" reading is the logically
        correct one. If the oracle perturbed-only arm fails to reject
        even at the single MOST favorable tested cell (10% perturbation,
        15 curves — the largest per-curve effect and the most curves
        pooled), then no weaker cell in the grid could have rejected
        either, so the effect size/panel size actually needed to reach
        adequate power lies BEYOND (above) everything tested, not below
        it. "Below" would imply the required threshold was already
        achievable well within the tested range, directly contradicting
        the stated premise that even the strongest cell failed. Retained
        here per this program's immutability discipline (never overwrite
        an already-filed record's text in place); the bullet above is
        NOT corrected back and should be READ WITH "above" IN PLACE OF
        "below" until this proposal is converted to a hypothesis, at
        which point the corrected wording should be used.

  confounders:
    - >-
      PERTURBATION MECHANISM SPECIFICITY. A subgroup-coset perturbation is
      one specific way to elevate C/F; the measured detection power is a
      property of THIS perturbation mechanism and this idea's own grid, not
      of "any mild deviation whatsoever." A different mild-deviation
      construction (e.g. a Sidon-adjacent near-miss) could show different
      power and is named as a natural next step, not tested here.
    - >-
      GRID COARSENESS. Three perturbation fractions and three panel sizes is
      a coarse 3x3 (plus number-perturbed) grid; a boundary between
      detectable and undetectable, if it exists, is located only to the
      grid's own resolution and is reported as such rather than as a
      precise threshold.
    - >-
      REUSING THE SAME CURVE PANEL AS PRIOR EXPERIMENTS risks correlation
      with whatever properties made those curves convenient to construct;
      the panel's provenance is disclosed and, where feasible, a
      freshly-generated panel is used as a cross-check arm.

  interpretation_limits:
    - "CLAIM TIER toy for every measurement; the identities (I1)-(I3) remain derivations, cited as such."
    - "NO ECDLP CLAIM OF ANY KIND, in either direction. This is an instrument-sensitivity measurement, not a curve-specific or relation-rate finding."
    - >-
      A positive result (Fisher-combined detects the planted effect at some
      tested cell) does NOT establish that any REAL curve exhibits such an
      effect; a negative result across the whole grid does NOT prove the
      statistic has zero power at every conceivable effect size, only across
      the tested grid.
    - >-
      DOES NOT CHANGE H-MONO-663fb4's overall K3/K4 disposition, which the
      most recent status_note already states rests on the per-curve Holm
      reading independent of this qualification.
    - "NO STATUS CHANGE to any record is proposed or implied (Coordinator authority alone, AGENTS.md rule 1)."

  heuristic_assumptions:
    - id: H1
      statement: >-
        Fisher's combined-probability statistic, applied to k independent
        per-curve permutation p-values each individually powered at
        n=20000 draws, has detection power that increases with both the
        per-curve effect size and the number of affected curves, following
        the classical chi-squared(2k) null distribution of
        -2*sum(log p_i) under the null hypothesis of no effect anywhere in
        the panel.
      rigorous_support: >-
        The chi-squared(2k) null distribution of Fisher's statistic under
        independent uniform p-values is a classical, exact result (Fisher
        1932); the gap, stated plainly, is whether the per-curve p-values
        in THIS instrument are genuinely independent across curves (no
        shared randomness, prime, or curve-family artifact) at the panel
        sizes tested -- a property this program's own KN-TECH-95a42b
        addendum flags as needing explicit per-test verification within a
        composite gate, not assumed.
      validation_plan: >-
        SAMPLE: the matched null-panel arm at each tested panel size (5, 10,
        15 curves), confirming the empirical rejection rate matches the
        nominal alpha under the true chi-squared(2k) null. TAIL CHECK:
        the single most extreme null-panel p-value observed across replicate
        null panels, compared against the chi-squared(2k) tail. TRANSFER:
        none beyond the tested panel sizes and this specific curve family.
      falsification_condition: >-
        The matched null-panel arm's empirical rejection rate deviating
        materially from the nominal alpha at any tested panel size,
        indicating the combined statistic's independence assumption fails
        for this instrument's actual per-curve p-value generation process.

  target_complexity:
    time_exponent: "NOT APPLICABLE; no algorithm or attack is proposed."
    memory_exponent: >-
      Comparable to the already-run EXP-MONO-b19c6b/EXP-MONO-b1423c
      instrument (n=20000 permutation draws per curve, at most 15 curves);
      well under 2GB, matching this lane's own already-declared budgets.
    best_known: "Not applicable; no ECDLP complexity claim of any kind."
    hidden_overhead: >-
      None hidden; the grid size (3 perturbation fractions x 3 panel sizes x
      2 Fisher-combination scopes, plus the null-panel matched arm at each
      panel size) is stated explicitly and its total compute is a small
      constant multiple of the already-run EXP-MONO-b1423c's own budget.
    tradeoff_note: not applicable.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: medium

  priority_rationale: >-
    Named explicitly, by both independent reviewers, as the concrete next
    step for a co-equal primary metric this lane's own protocol still uses
    with an undischarged sensitivity obligation (per KN-TECH-a810e4's
    review-discipline rule). Not exponent-moving, but directly actionable:
    reuses fully-validated instrumentation at low marginal cost, and its
    negative outcome (Fisher-combined detects nothing anywhere in the tested
    grid) would be a concrete, escalatable finding about this lane's own
    methodology rather than a speculative new mechanism.

