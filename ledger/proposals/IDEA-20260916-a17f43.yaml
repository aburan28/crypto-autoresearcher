  id: IDEA-20260916-a17f43
  question_id: RQ-QSP-f9bbdb
  added: '2026-09-16'
  proposed_by: idea-generator
  session: TASK-20260916-a93a2a
  status: proposed
  title: >-
    THE SUCCESSOR OBJECT THE INJECTION BOUND LEAVES ROOM FOR: factor bases
    V_R = {x in F_{2^131} : x^{2^{a+1}} + c(x) x^{2^a} + e(x) = 0} defined by
    a correspondence of degree 2 in ONE Frobenius conjugate, where the
    fixed-point count d_0^{q+1} + 2^{q+1} 2^{a-r} is not below 2^{a+1} exactly
    when r <= q (n = q a + r), which at n = 131 admits a in {65, 43, 32, 26,
    21, 18, 16, 14, 13, 11}; the decomposition system is an m^2-variable
    'fractional Weil restriction' with no descent; and the two cheap audits
    that decide it before any curve compute are the mixed volume of that
    system at (n' = 33, m = 4) against the 2^31.3 per-attempt budget, and a
    toy census of the shape at prime n <= 41 against a Poisson null
  class: representation

  claim: >-
    (A) THE SHAPE, AND WHY IT IS THE COMPLEMENT OF WHAT IS CLOSED. The bound of
    IDEA-20260916-5c9d6e (A) has a correspondence form: for
    V_R = {x : R(x, x^{2^a}) = 0} with R in F_2[X, Y] of bidegree (d_0, d_1)
    (d_0 in x, d_1 in the conjugate) and n = q a + r, the K-rational count is
    the intersection of the twisted q-step correspondence (bidegree
    (d_1^q, d_0^q) as a curve in (y, x)) with the curve R(x, sigma^{a-r} y)
    = 0 (bidegree (d_0, d_1 2^{a-r})), i.e.
        N_K(V_R) <= d_0^{q+1} + d_1^{q+1} 2^{a-r}.
    For d_1 = 1 (the QSP) this is the closed case. For d_1 = 2 the second
    term is 2^{q+1+a-r}, which is >= 2^{a+1} iff r <= q: the bound then has
    ROOM for a factor base of size ~ 2^{a+1} = 2^{n'} with n' := a + 1,
    with d_0 as small as one likes. Concretely V_R is the root set in K of
    L_R(X) = X^{2^{a+1}} + c(X) X^{2^a} + e(X), c, e in F_2[X] of degree
    <= d_0, not both of (c constant, e linearized) -- otherwise L_R is a
    linearized trinomial and Proposition 2 of KN-LIT-4fe9d2 closes it
    (X^{a+1} + cX^a + e must divide X^131 - 1, impossible). In the paper's
    own vocabulary this is a QSP with lambda = c(X) X^{2^a} + e(X) of degree
    2^a + d_0, i.e. l ~ a = n' - 1 and beta ~ n/n' >= 1: the beta framework
    prices it as useless because Theorem 3.2 substitutes lambda into the
    chain and pays d^{kappa m^2}. The point of this record is that the
    substitution is the wrong solver for this shape: keeping x^{2^a} as a
    new variable z with the LINK z^2 + c(x) z + e(x) = 0 gives a system whose
    degrees never see 2^a.
    (B) ADMISSIBLE CELLS AT n = 131. (a, q, r) with r <= q: (65, 2, 1),
    (43, 3, 2), (32, 4, 3), (26, 5, 1), (21, 6, 5), (18, 7, 5), (16, 8, 3),
    (14, 9, 5), (13, 10, 1), (11, 11, 10); n' = a + 1 in {66, 44, 33, 27, 22,
    19, 17, 15, 14, 12}. The table.md linear-algebra column with orbits
    (2 n' - 14) is below 60.9 only for n' <= 37, so the live cells are
    n' in {33, 27, 22, 19, 17, 15, 14, 12} with m = ceil(131/n') in
    {4, 5, 6, 7, 8, 9, 10, 11}; attempts with orbits at (33, m = 4):
    2^{29.6} (table row (33, 3, 4, 131)), so the per-attempt budget to tie
    rho is 2^{60.9 - 29.6} = 2^{31.3}; at (27, m = 5): 2^{22.9} attempts,
    budget 2^{38}.
    (C) THE DECOMPOSITION SYSTEM AND ITS FIRST PRICE. Variables X_i^{(j)}
    (i = 1..m, j = 0..m-1) standing for sigma^{ja}(x_i); equations
    S^{(j)} := F^{ja}(S_{m+1})(X_1^{(j)}, ..., X_m^{(j)}, x_R^{2^{ja}}) for
    j = 0..m-1 (m equations of degree 2^{m-1} in each of its m variables) and
    links R^{(ja)}(X_i^{(j)}, X_i^{(j+1)}) = 0 for j = 0..m-2, i = 1..m
    (m(m-1) equations of bidegree (d_0, 2)). m^2 equations in m^2 variables
    over K, no Weil descent, no substitution of lambda. The closing
    condition sigma^{n}(x_i) = x_i is NOT imposed; the relaxation's spurious
    solutions are filtered by evaluating R(x_i, x_i^{2^a}) in K, as the paper
    filters S versus T. m-homogeneous Bezout number with the m layers as
    variable groups, computed in this session: at m = 4,
    32^4 * 6144 * d_0^6 = 2^{32.6} d_0^6 -- 2^{38.6} at d_0 = 2 and 2^{42.1}
    at d_0 = 3 -- against the 2^{31.3} budget: a gap of >= 2^{7.3} on the
    Bezout floor at the only cell with a linear-algebra column below rho and
    m = 4. At m = 5 (n' = 27) the same count is 2^{52.9} d_0^{10} >= 2^{62.9}
    against a 2^{38} budget: dead by 2^{25}. So the shape is alive at n = 131
    ONLY if the mixed volume of the actual supports at (33, m = 4) is at least
    2^{7.3} below the m-homogeneous Bezout number, AND a member with
    ~2^{33} K-roots and small d_0 exists. Both are decidable cheaply, and the
    record predicts both come out negative; that is the honest expected
    outcome, filed so that the closure of the QSP line at n = 131 names what
    it leaves open and prices it, per docs/inventor-protocol.md section 4.
    (D) KNOWN POSITIVE INSTANCES OF THE SHAPE, WITH LARGE d_0. Type 2 of
    KN-LIT-4fe9d2 at p = 2 is in this shape: at n = 7, L = X^8 + X^2 + X is
    R = Y^2 + X^2 + X with a = 2 (d_0 = 2); at n = 31, L = X^{2^15} + X^{2^7}
    + X^{2^3} + X^2 + X is R = Y^2 + X^{128} + X^8 + X^2 + X with a = 14
    (d_0 = 128); at n = 127 (the card's nearby object), a = 62 and
    d_0 = 2^{31}. These split completely at PRIME n, so the shape is not
    empty at prime n; what is unknown is whether it has members with small
    d_0, which is what the Bezout price needs. The Type 2 construction (a
    Berlekamp-trace factorisation of X^{q^{d+1}} - X into g + a) needs
    n = q^{d+1} - 1 and does not exist at n = 131; the census asks whether
    anything else does.

  mechanism: >-
    OBJECT FRAME. Representation: the point's x-coordinate LIFTED to the
    tuple of its Frobenius conjugates (x, sigma^a x, ..., sigma^{(m-1)a} x)
    in K^m -- for a | n this is the Weil restriction Res_{K/F_{2^a}} (R3
    class of RQ-ECDLP-623a32, 'Weil restriction' is listed there); for a not
    dividing n the tuple does not close and the record calls it a FRACTIONAL
    Weil restriction: m conjugates carried without the relation
    sigma^{ma} = id that a genuine restriction would have. Operation set
    Sigma = {sigma^a (shift the layers), R (link consecutive layers)}.
    Attack stage: relation decomposition, and factor-base membership through
    the link. Trichotomy: Class I partial-action (index calculus) for the
    relation vector; the layered tuple is coordinate-dependent (Class III).
    LOSSY-PROJECTION TEST AGAINST SIGMA. The projection sends the true
    system T_R = {S_{m+1}(x, x_R), R(x_i, x_i^{2^a}), x_i in K} to the layered
    relaxation of (C), DISCARDING the closing condition x_i in K (equivalently
    sigma^{qa+r} x_i = x_i, the one relation that ties layer m - 1 back to
    layer 0 through a residual Frobenius sigma^r). Sigma-compatible: sigma^a
    acts on the relaxation by shifting j -> j+1 and twisting coefficients,
    and R is the link itself; the retained part propagates deterministically
    layer to layer. Genuinely lossy: the relaxation has closure solutions
    whose x_i are not in K (spurious), and their number is the branching
    number of IDEA-20260802-002 for this object, measurable at toy scale as
    D_S / #Z(T_R) exactly as IDEA-20260916-b84e2d measures it for the QSP
    chain. What survives before the structure dissolves: m layers, after
    which the missing closing condition is the only thing separating the
    relaxation from a Weil restriction; at m layers with ma >= n the
    relaxation is over-complete and has (heuristically) only the true
    solutions plus Bezout-many spurious ones.
    KN-OPEN-020 CLASS: implicit-membership description; description cost
    2 d_0 + 2 bits (c, e over F_2), membership cost a squarings plus O(d_0)
    field operations, target-independent. The factor base is Frobenius-stable
    (F_2 coefficients), so the orbit column of table.md applies verbatim.
    WHY THIS ESCAPES THE BETA FRAMEWORK AND WHAT REPLACES IT. beta prices
    deg lambda because Theorem 3.2's solver substitutes lambda; here the
    substitution is replaced by a link of degree 2, so the price is the
    mixed volume of the m^2-system, not d^{kappa m^2}. The m-homogeneous
    Bezout count in (C) is the first estimate of that price and it already
    exceeds the rho-tying budget by 2^{7.3} at the best cell; the mixed
    volume is the open number.

