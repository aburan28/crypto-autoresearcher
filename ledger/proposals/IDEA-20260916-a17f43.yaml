  proof_search_map:
    bottleneck: >-
      Two, in order: the mixed volume of the layered system at (n' = 33,
      m = 4, d_0 in {2, 3}) against 2^{31.3}; and the existence of a small-d_0
      member of the shape with ~2^{33} K-roots. The first is decidable at
      zero curve compute; the second at toy scale for the F_2 shape.
    baseline_embedding:
      parameter_slice: >-
        d_1 = 1 is the QSP of KN-LIT-0a321c (closed by IDEA-20260916-5c9d6e);
        d_0 = 1 with c, e constant is the linearized trinomial (closed by
        Proposition 2 at n = 131 and by McGuire-Mueller's characterisation
        where n <= d^2 - d + 1); a | n is the genuine Weil restriction to
        F_{2^a} (the SEMBIN object with V an F_{2^a}-subspace). All three are
        exact slices of the shape, and the record must reproduce their known
        behaviour: the census returns tiny counts on the first two at
        n = 131 and 2^{a+1} on Type 2 at n = 31.
      reproduction_check: >-
        Frozen fixtures: Type 2 at n = 7 (count 8) and n = 31 (count 2^15);
        the linearized trinomials at n = 23, a = 11 (count <= 2 by
        Proposition 2); and the m-homogeneous Bezout arithmetic of (C)
        re-derived by hand.
    observation_collision:
      observable: >-
        N_K(V_R) per candidate and the mixed volume per (m, d_0).
      distinct_preimage_search: >-
        Two R with the same count and different structure are expected
        (most give ~2). The collision that matters for the cost audit: two
        systems with the same mixed volume but different actual solution
        counts (degenerate coefficients); the audit therefore reports both
        the mixed volume and the ideal degree measured on random instances at
        toy m.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the substitution x^{2^a} -> lambda(x) (degree 2^a + d_0) by
          a new variable z with the quadratic link z^2 + c(x) z + e(x) = 0.
          Encoding: one variable and one equation per (point, layer).
          Completeness: every solution of the substituted system is a
          solution of the linked one. Soundness: the link admits 2 values of
          z per x, so the linked system has extra solutions, filtered by the
          K-membership test. Transfer: to d_1 > 2 with links of degree d_1.
          Cost loss: the Bezout count grows by 2^{m(m-1)} from the links;
          the record's own arithmetic shows this already exceeds the budget.
        predicted_gain: >-
          Removes 2^a from every degree in the system; whether that is enough
          is the mixed-volume question.
      - transform: observable_fiber
        proposed_object: >-
          Hold the K-root count fixed at ~2^{a+1} and vary d_0: the fibre
          contains Type 2 (d_0 = 2^{(d-1) r}, huge) at Mersenne n; the
          census asks whether it contains anything with d_0 <= 8 at n = 131.
        predicted_gain: >-
          Separates 'the shape splits at prime n' (true, Type 2) from 'the
          shape splits cheaply at n = 131' (predicted false).
    quantifier_order: >-
      EXISTS (a, c, e) with a in the admissible list, deg c, deg e <= d_0,
      such that N_K(V_R) >= 2^a, AND the mixed volume of the (m = 4) system
      is <= 2^{31.3}: that is the claim's positive form, and it is what the
      audits search for. The record PREDICTS its negation at n = 131 for
      d_0 <= 8 and F_2 coefficients: FORALL such (a, c, e), N_K(V_R) <= 2 * 131
      + 2, and the mixed volume exceeds 2^{31.3}.
    method_ceiling:
      strongest_certifiable_claim: >-
        'For c, e in F_2[X] of degree <= d_0 at the admissible a and at prime
        toy n <= 41 with r <= q, the maximum K-root count of V_R is N_max,
        against a Poisson null with mean ~2; and the mixed volume of the
        layered system at (m, d_0) is MV.' It cannot certify anything about
        K-coefficient c, e, about d_1 >= 3, or about a solver below the
        mixed volume (which would need degeneracy the BKK count does not see).
      nearby_object_control: >-
        Type 2 at n = 31 (a = 14, d_0 = 128), where the conclusion 'no member
        with ~2^{a+1} roots' is KNOWN FALSE: the census instrument must
        return 2^15 there. And the QSP shape (d_1 = 1) at the same (n, a),
        where the bound of IDEA-20260916-5c9d6e says counts are <= d_0^{q+1}
        + 2^{a-r}: the instrument must return small counts there. An
        instrument that returns similar counts on both has not seen the
        conjugate degree.
    proof_obligations:
      - claim: N_K(V_R) <= d_0^{q+1} + d_1^{q+1} 2^{a-r} (the correspondence form of the injection bound).
        responsibility: size
      - claim: The layered system's m-homogeneous Bezout number at m = 4 is 2^{32.6} d_0^6.
        responsibility: correctness
      - claim: The mixed volume of the layered system at (33, 4, d_0) is computed or bounded by two independent methods.
        responsibility: feasibility
      - claim: The toy census reproduces Type 2 counts and the linearized-trinomial counts.
        responsibility: baseline
      - claim: The per-attempt budget 2^{31.3} follows from table.md's attempts column and rho's 2^60.9.
        responsibility: runtime
      - claim: Every claimed relation at toy scale is re-verified by curve arithmetic.
        responsibility: correctness

  predictions:
    - metric: >-
        mixed volume MV of the layered system at (m, d_0) = (4, 2) and (4, 3),
        computed by a mixed-volume routine or bounded below by the ideal
        degree of a random-coefficient instance of the same support at m = 3
        extrapolated by the m-homogeneous ratio
      direction: higher
      minimum_effect: >-
        MV > 2^{31.3} at both d_0 (PREDICTED: closure of the cell on the
        floor model). If MV <= 2^{31.3} the cell is alive on the floor and
        the census becomes load-bearing; that outcome is the surprise this
        record is designed to detect.
    - metric: >-
        max over F_2-candidates (deg c, deg e <= 4) of N_K(V_R) at prime n
        in {23, 29, 31, 37, 41} and every admissible a (r <= q)
      direction: lower
      minimum_effect: >-
        <= 2 n + 2 at every cell (at most two Frobenius orbits): a controlled
        null against Poisson(1/n)-orbits. Any candidate with N >= 2^{a-1}
        at small d_0 is the positive outcome and triggers the n = 131 census
        at that a.
    - metric: Type 2 fixture counts at n = 7 and n = 31 through the same instrument
      direction: different
      minimum_effect: FORCED 8 and 32768.
    - metric: relaxation slack of the layered system at toy (n, m) = (23, 3), 50 targets
      direction: higher
      minimum_effect: >-
        >= 10 (the relaxation is loose); reported with the QSP chain's slack
        from IDEA-20260916-b84e2d at the same cell for comparison.

  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE. Re-derive the correspondence bound and the
      m-homogeneous Bezout arithmetic by hand; list the admissible (a, q, r)
      at n = 131 and the per-attempt budgets from the table.
      STAGE 1 - MIXED-VOLUME AUDIT, MINUTES TO HOURS, NO CURVE. Build the
      Newton polytopes of the layered system at (m, d_0) in {(3, 2), (3, 3),
      (4, 2), (4, 3)} (S_{m+1}'s support for the ECC2K-130 curve shape,
      bidegree-(d_0, 2) links) and compute the mixed volume with whatever
      routine is available; if none is, bound it from below by the ideal
      degree of a random-coefficient system of the same support over a
      large prime field at m = 3 (msolve or Macaulay2) and report the m = 4
      value as the m-homogeneous count with the measured m = 3 ratio applied,
      labelled as an extrapolation. Compare with 2^{31.3}.
      STAGE 2 - TOY CENSUS, MINUTES. For prime n in {23, 29, 31, 37, 41} and
      every a with r <= q, every (c, e) in F_2[X] of degree <= 4 (2^10 pairs
      minus the linearized ones), compute N_K(V_R) = deg gcd(X^{2^n} - X,
      L_R) at degree 2^{a+1} <= 2^{21}; record the maximum, the histogram,
      and every candidate with more than one orbit. Fixtures: Type 2 at
      n = 7 and 31; linearized trinomials; and the d_1 = 1 QSP shape at the
      same (n, a) as the negative control.
      STAGE 3 - ONLY IF STAGES 1 AND 2 BOTH PASS. The n = 131 census at the
      admissible a where a structured family appeared, by
      deg gcd(X^{2^131} - X, L_R) at degree 2^{a+1} (feasible in C for
      a <= 26; the a = 32 case is the 2^33-degree computation
      IDEA-20260916-3f7a1c avoided and is priced at hours and > 10 GB per
      candidate); then the toy solve of the layered system at (23, 3) for
      the slack.
      STAGE 4 - REPORT: MV versus budget, the census histogram and maximum,
      the fixtures, and the exact scope closed or opened.
    controls:
      - 'Type 2 at n = 7 and 31: known positive members of the shape (large d_0).'
      - 'Linearized trinomials (c, e constant): closed by Proposition 2; the census must agree.'
      - 'QSP shape (d_1 = 1) at the same (n, a): the closed neighbour, small counts by the injection bound.'
      - 'Random K-coefficient (c, e) at toy n: the Poisson null.'
      - 'The QSP chain of IDEA-20260916-b84e2d at the same toy (n, m): the cost-model neighbour.'
    required_metrics:
      - 'MV (or its lower bound and extrapolation) per (m, d_0) with the method named'
      - 'per-cell census histogram of N_K(V_R), maximum, and the attaining (a, c, e)'
      - 'fixture counts'
      - 'relaxation slack at (23, 3)'

  falsification_conditions:
    - 'A fixture (Type 2 or linearized) returns the wrong count: the instrument is invalid.'
    - 'Any candidate with N_K(V_R) > d_0^{q+1} + 2^{q+1} 2^{a-r}: the correspondence bound is false and IDEA-20260916-5c9d6e must be re-examined.'
    - 'MV <= 2^{31.3} at (4, 2) or (4, 3): the closure-on-the-floor prediction is false; the cell is alive and Stage 3 is mandatory.'
    - 'A small-d_0 candidate with N >= 2^{a-1} at toy n: the controlled-null prediction is false; the shape splits at prime n with small d_0 and the n = 131 census is mandatory.'

  confounders:
    - >-
      The mixed volume depends on the exact support of S_{m+1} for the
      specific curve; the ECC2K-130 shape y^2 + xy = x^3 + 1 must be used,
      not a generic curve.
    - >-
      Extrapolating MV from m = 3 to m = 4 by the m-homogeneous ratio is an
      assumption; it is labelled and the (4, d_0) number is not cited as
      measured.
    - >-
      The per-attempt budget uses the table's attempts column, which assumes
      |F| ~ 2^{33}; the census sets |F| and the budget moves with it.
    - >-
      The toy census at d_0 <= 4 cannot see structured families that need
      d_0 in 5..8; a second pass at d_0 <= 8 (2^18 pairs) is affordable and
      should be run before closing.

  interpretation_limits:
    - >-
      A representation proposal with two pre-compute audits predicted to
      close it at n = 131. No attack, no exponent; a positive audit outcome
      would make the cell 'alive on the floor model', which is not an attack
      either.
    - >-
      Scoped to d_1 = 2, F_2-coefficient c, e, d_0 <= 8, the admissible a at
      n = 131, and prime toy n <= 41. d_1 >= 3, K-coefficients and n' | n are
      outside it.
    - >-
      KN-OPEN-020 class: implicit-membership; nothing here touches the
