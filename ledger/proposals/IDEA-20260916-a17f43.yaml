  heuristic_assumptions:
    - id: H1
      statement: >-
        (Existence null.) For (c, e) drawn uniformly from F_2[X]_{<= d_0}, the
        number of Frobenius orbits of K-roots of L_R is approximately
        Poisson(1/n), so P(N >= 2n) ~ 1/(2 n^2) and the maximum over 2^{2d_0+2}
        candidates is at most 2n + 2 with probability > 0.99 at n >= 23,
        d_0 <= 4.
      rigorous_support: >-
        Rigorous ingredient: the correspondence bound N <= d_0^{q+1} +
        2^{q+1} 2^{a-r} holds for every candidate; classical statement
        imitated: the expected number of degree-n irreducible factors of a
        random polynomial of degree >= n over F_2 is about 1/n (recalled).
      validation_plan: >-
        SAMPLE - the exhaustive F_2 census at each cell plus 200 random
        K-coefficient (c, e) per cell; COMPARISON - histogram of orbit counts
        against Poisson(1/n); TAIL - the maximum over all candidates against
        the extreme-value prediction; the Type 2 fixtures as the structured
        exception that must NOT fit the null. SAMPLED PARAMETERS RECORDED -
        n, a, d_0, coefficient field. TRANSFER - from toy n to n = 131 is
        NOT assumed; a negative at toy scale closes toy scale and motivates,
        does not replace, Stage 3.
    - id: H2
      statement: >-
        (Cost floor.) The per-attempt cost of solving the layered system is
        at least its mixed volume, and the mixed volume is at least 1/8 of
        the m-homogeneous Bezout count at (4, d_0).
      rigorous_support: >-
        Rigorous ingredient: BKK bounds isolated torus solutions by the mixed
        volume and root-finding an eliminant of that degree costs at least
        that; the m-homogeneous count is an upper bound on the mixed volume.
        Classical statement imitated: generic systems attain the mixed
        volume. The 1/8 is a guess to be replaced by Stage 1's number.
      validation_plan: >-
        SAMPLE - random-coefficient systems of the same support at m = 3 over
        a prime field, 20 instances; COMPARISON - ideal degree against the
        m-homogeneous count at m = 3; TAIL - the smallest ratio; TRANSFER -
        the m = 3 ratio applied at m = 4 is labelled an extrapolation.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED. The cell that would tie rho needs a per-attempt
      cost <= 2^{31.3} at (n' = 33, m = 4); the shape's m-homogeneous Bezout
      floor is 2^{38.6} (d_0 = 2), 2^{42.1} (d_0 = 3). The record predicts
      the mixed volume does not close that gap, in which case the shape's
      best cell costs >= 2^{29.6 + MV} >= 2^{61} + linear algebra 2^{53.9},
      i.e. it does not beat 2^{60.9}.
    memory_exponent: >-
      Relations 2^{33 - 7} = 2^{26} rows of weight 4 for the linear algebra
      (GB-scale); the solver's memory at MV ~ 2^{31} standard monomials is
      TB-scale and is disclosed as a second obstacle even if the floor were
      met.
    best_known: >-
      rho at 2^60.9 with negligible memory (KN-LIT-096); every SEMBIN/DREG
      Weil-descent row at n = 131 is above it; the QSP rows are void.
    hidden_overhead: >-
      The MV audit's (4, d_0) number may be an extrapolation; the census at
      a = 32 costs a 2^33-degree gcd per candidate; the relaxation slack
      multiplies root-finding by an unmeasured factor.
    tradeoff_note: >-
      The linear-algebra column (2^{53.9}) and the relation phase are
      separately parallel; no time-memory tradeoff below the floor exists.

  dominated_by: >-
    CHECKED ROW BY ROW. rho at 2^60.9 (KN-LIT-096) dominates the shape's best
    cell on time under the record's own floor arithmetic (>= 2^{61} at MV =
    m-homogeneous count / 8) and on memory (negligible versus GB-TB); the
    SEMBIN/DREG Weil-descent rows are not compared because their cost is an
    unresolved degree question, not a number; the ICPERF boundary table has
    no cell at n = 131. So: dominated_by rho on every axis at n = 131, on the
    record's predicted outcome; if Stage 1 returns MV <= 2^{31.3} the entry
    is re-evaluated, which is the point of running it.
  sota_delta: >-
    Zero on every ECDLP cost axis. Contribution: names the exact complement
    of the closed QSP shape (conjugate-degree 2, r <= q), lists the ten
    admissible a at n = 131, prices the only rho-competitive cell at a
    2^{7.3} gap on the m-homogeneous Bezout floor, and supplies two cheap
