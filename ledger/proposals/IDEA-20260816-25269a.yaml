idea:
  id: IDEA-20260816-25269a
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: 'Charge every factor-base geometry for what it costs to build: measure coverage excess per
    unit of instrumented construction cost and per unit of construction memory, so that a geometry
    which buys a one percent excess with a quadratic search is placed on the same Pareto frontier
    as one that buys nothing for a linear scan'
  class: composition
  claim: '(A) THE ASYMMETRY. Every factor-base geometry measurement recorded in this program reports
    what the geometry achieves and none reports what it cost to produce. A greedy low-collision base
    is built by a search whose cost grows superlinearly in the base size; a high-bit interval is built
    by a linear scan; a ceiling-attaining exponent-side construction is built by arithmetic that is
    nearly free but requires a discrete-logarithm table that is not. Comparing their coverage excesses
    without charging construction is comparing an uncharged quantity, and the program''s own protocol
    requires a real Pareto check across every cost axis. (B) THE CLAIM. Construction cost is measurable
    by instrumented counting rather than by timing, so it is machine-independent: count field operations,
    group operations, table lookups and peak construction memory during the build, and report coverage
    excess per unit of each. The claim is that under this charging the ordering of geometries changes
    - specifically that at least one geometry which leads on raw excess falls behind on excess-per-operation,
    and that the frontier under charging contains geometries the raw comparison would have discarded.
    (C) THE FRONTIER. The deliverable is a Pareto table with three axes - coverage excess, construction
    operations, construction memory - and an explicit listing of which geometries are dominated and
    by which. A geometry that is dominated on all three is recorded as dominated and not defended.
    The matched random base sits on the frontier at excess exactly 1.000 with construction cost B
    draws, and it is the reference row every other geometry must be compared against on all three
    axes at once. (D) WHAT IS NOT CLAIMED. No attack, no break, no speedup, no security consequence.
    Construction cost is NOT relation-collection cost, NOT decomposition cost and NOT linear-algebra
    cost; none of those are measured and the contract says so. It is NOT claimed that a geometry cheap
    to build is preferable for any operational purpose, because no operational purpose is evaluated.
    It is NOT claimed that instrumented operation counts predict wall-clock time; they are deliberately
    chosen instead of timing so that the result does not depend on the machine, and the program''s
    timing and machine-variance audits are a different lane that this contract does not enter. (E)
    WHY THIS IS ITS OWN OBJECT. Charging construction turns a set of point estimates into a frontier,
    and a frontier is the only form in which a negative result about geometry is reusable: a later
    agent proposing an expensive construction can read off exactly how much excess it must buy to
    be worth its cost at a given size.'
  mechanism: 'STAGE 1. Instrument the construction of each geometry at the level of primitive operations:
    wrap field multiplication, inversion, square-root extraction, curve-equation evaluation, group
    addition and table lookup in counters, and record peak auxiliary memory in machine words during
    the build. The counters are the instrument and must be validated by constructing a base whose
    operation count is known in closed form. STAGE 2. Build a panel of geometries at matched realised
    size B on the same curves: interval families, canonical small sets defined by a low-degree condition,
    coset families, a greedy low-collision search, an exponent-side ceiling-attaining construction,
    and the matched random base. STAGE 3. Measure coverage exactly over the complete target space
    for every geometry, with the identical counter and the identical matched random null, in the same
    invocation as the construction so that build and measurement cannot drift apart. STAGE 4. Form
    the three-axis table and compute the Pareto frontier, listing every dominated geometry with its
    dominator. STAGE 5. Sweep B so that each axis is a curve rather than a point, and fit the growth
    of construction operations in B per geometry. STAGE 6. Refutation route. If charging does not
    reorder the panel at any tested size, the raw comparison was already correct and the contract
    has measured that, which is a usable negative. If the greedy search''s cost growth is so steep
    that it leaves the frontier at every size beyond the smallest, that is a measured obstruction
    with an explicit crossover point.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-FBG-001, H-FBG-001 and EV-FBG-001 in full, noting that the battery records exact
      yields, coverage ratios, permutation bands and wall-clock budget but no construction-cost accounting
      per geometry. Read docs/inventor-protocol.md sections 4 and 5 on obstruction measurement and
      on the dominated_by and sota_delta obligations. Greps over ledger/proposals and ledger/hypotheses
      for 'greedy', 'construction cost', 'charged', 'Pareto', 'matched random base'. Checked the anti-duplication
      blacklist entries for RQ-INSTR-f8faa0 cost-model and machine-variance audits and for exTNFS
      memory charging (IDEA-20260815-bf1328) to confirm separation.
    results: The program charges memory in other lanes - the blacklist names an exTNFS polynomial-selection
      proposal with memory charged - and RQ-INSTR-f8faa0 carries many proposals about the program's
      own cost model and machine variance, which the blacklist places off limits. Neither covers construction
      cost of a factor base as a per-geometry measured axis. EV-FBG-001 records a per-run wall-clock
      budget and a maximum-memory budget as constraints but reports no per-geometry construction cost,
      and its greedy arm is described as optimising a training half without any accounting of what
      that optimisation cost. IDEA-20260815-c13ef4 compares designed against sampled bases without
      charging design. No record I read reports coverage excess per unit of construction operation.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; charging construction cost
      is ordinary accounting practice and no claim is made about its publication history. What is
      claimed new here is the specific instrument - machine-independent primitive-operation counters
      wrapped around factor-base construction - and its use to build a three-axis Pareto frontier
      for geometries whose excesses this program has already measured on one axis only. Assembled
      from known parts: the exact coverage measurement and matched random null from the frozen battery;
      the Pareto and dominated_by discipline from the inventor protocol; the geometry panel, most
      of which the program has already named.'
  object_first_candidate:
    tracked_object: THE CONSTRUCTION TRACE of the factor base - the ordered multiset of primitive
      operations performed while building it, together with peak auxiliary memory - carried alongside
      the base itself and reduced to a small vector of counts.
    lossiness: 'Lossy. The trace discards the order of operations, the intermediate values, the branch
      structure of the construction algorithm and the source code, retaining only per-primitive counts
      and a memory high-water mark. That is discarded compatibly with the operation of interest, which
      is charging: cost accounting is additive over primitives and does not depend on their order,
      so the retained count vector determines the charge exactly. Many different construction algorithms
      collapse to the same count vector, which is what makes it a projection. The honest limitation
      of the projection is that it discards cache behaviour and constant factors, so the retained
      vector predicts machine-independent cost and deliberately does not predict wall-clock time -
      which is the point, since wall-clock comparison is another lane''s object.'
    propagation: 'One step of the target operation - adding one more element to the base under construction
      - acts on the retained object by adding that element''s admission cost to the count vector:
      for an interval geometry, one curve-equation evaluation and one conditional square root; for
      a greedy search, a scan over the current base and hence a cost linear in the current size; for
      an exponent-side construction, one group multiplication plus one table lookup. The propagation
      law is therefore explicit per geometry and gives a predicted growth in B - constant per element,
      linear per element, or constant with a table prerequisite - which the measurement checks rather
      than assumes.'
    survival_score: 'The count vector is informative while it separates the geometries, which it does
      over the whole tested range of B: constant-per-element and linear-per-element constructions
      differ by a factor of B, and at the smallest tested B near 29 that is already a factor of 29.
      The object dissolves only in the sense that constant factors it discards can dominate at very
      small B, so below about B equal to 16 the three-axis ordering is unreliable and the contract
      does not test there. Concretely: reliable separation across B from 29 to 116, with the crossover
      between constant-factor noise and asymptotic separation located empirically.'
  null_object_control: 'The null object is the MATCHED RANDOM BASE, built by B uniform draws with
    rejection to stay on the curve, instrumented by the identical counters and measured by the identical
    exact coverage pipeline in the same invocation. It occupies the reference row: coverage excess
    exactly 1.000 by definition, construction cost equal to the rejection-sampling count, and peak
    memory equal to B words. For the frontier to mean anything the null must satisfy two things: its
    measured construction operation count must match its closed-form expectation - roughly two curve-equation
    evaluations per admitted point - within a stated tolerance, and its coverage excess must be 1.000
    within intervals. A second null is required for the instrument itself: a SYNTHETIC CONSTRUCTION
    whose primitive-operation count is known in closed form, run through the same counters, which
    must be counted exactly right. Counters that miscount a known construction cannot charge an unknown
    one.'
  discriminated_from:
  - 'The RQ-INSTR-f8faa0 cost-model, machine-variance and single-machine-timing audits, which the
    blacklist places off limits: those measure execution infrastructure and wall-clock behaviour.
    This contract deliberately takes no timings at all and counts primitives instead, precisely so
    the result is machine-independent.'
  - 'IDEA-20260815-bf1328, exTNFS polynomial selection with memory charged: a different problem, a
    different construction, and memory charged against an attack cost rather than against a measurement.'
  - 'EV-FBG-001 and H-FBG-001: report coverage and yield with a wall-clock budget as a constraint,
    never as a per-geometry measured axis, and never form a frontier.'
  - 'IDEA-20260815-c13ef4: designed versus sampled bases with no charging of the design step, which
    is exactly the omission this contract fills.'
  - 'EXP-RELN-0a979f: grades arms by additive energy, a mathematical property, and charges nothing
    for construction.'
  assumptions:
  - Primitive-operation counts are a fair machine-independent cost proxy at these sizes; constant
    factors and memory hierarchy effects are explicitly outside the model and are declared as such
    rather than estimated.
  - Every geometry in the panel can be built at the same realised size B on the same curves, or the
    cell is reported infeasible.
  - Instrumenting construction does not change what is constructed; a bit-identical comparison between
    instrumented and uninstrumented builds is required as a check.
  - Coverage excess remains the right achievement axis, which follows from the counting identity forcing
    mean yield to be size-determined.
  predictions:
  - metric: 'reordering: number of geometries whose rank on raw coverage excess differs from their
      rank on excess per construction operation'
    direction: higher
    minimum_effect: 2
  - metric: growth exponent of construction operations in B for the greedy low-collision geometry
    direction: higher
    minimum_effect: 1.8
  - metric: measured construction operations of the matched random null against its closed-form expectation
    direction: different
    minimum_effect: 'forced value: agreement within 5 percent; a larger discrepancy means the counters
      are wrong and no charge in the table can be read'
  - metric: size of the Pareto frontier under three axes compared with the single-axis ranking
    direction: higher
    minimum_effect: 2
  minimal_test:
    design: 'One curve, one size, six geometries, one invocation. Take a toy prime-order curve with
      N near 2^14, set B equal to ceiling of (6N) to the one-third power, and build six bases - high-bit
      interval, low-degree canonical set, coset union, greedy low-collision, exponent-side ceiling-attaining
      construction, and the matched random null - each under instrumented primitive counters, each
      trimmed to exactly the same realised size. Measure exact coverage over the complete target space
      for all six in the same invocation, with the identical counter and the identical null. Emit
      a six-row table with three columns: excess, construction operations, peak construction words.
      Compute the frontier and list dominations. Validate the counters first against a synthetic construction
      whose operation count is known in closed form, and validate the null''s count against its closed-form
      expectation; if either check fails, the table is unreadable and the run stops there. This costs
      minutes and discriminates because the reordering, if it exists, is visible in a six-row table
      without any statistics.'
    controls:
    - Matched random base as the reference row, instrumented and measured identically in the same
      invocation.
    - Synthetic construction with a closed-form operation count, run through the same counters, which
      must be counted exactly.
    - Instrumented versus uninstrumented build comparison, which must produce bit-identical bases.
    - Closed-form total check on every coverage cell - summed multiset count equals binomial(B+m-1,
      m).
    - Two independent implementations of the greedy search with the same specification, whose operation
      counts must agree in growth exponent if not in constant.
    required_metrics:
    - coverage excess ratio against the matched random null, with interval
    - construction operations per geometry, broken down by primitive
    - peak construction memory in machine words per geometry
    - excess per construction operation and excess per construction word
    - fitted growth exponent of construction operations in B per geometry
    - Pareto frontier membership and, for each dominated geometry, its dominator
    - counter validation residual against the synthetic closed-form construction
  falsification_conditions:
  - The synthetic closed-form construction is miscounted, voiding every charge in the table.
  - The matched random null's measured construction count deviates from its closed-form expectation
    beyond the stated tolerance.
  - Instrumented and uninstrumented builds produce different bases, showing the instrument perturbs
    the object.
  - Charging does not reorder the panel at any tested size, which refutes the claim and is itself
    the reportable measured outcome.
  - Two independent greedy implementations disagree in fitted growth exponent beyond the interval,
    showing the cost is implementation-defined rather than geometry-defined.
  - A geometry cannot be built at the matched realised size, making its row infeasible rather than
    expensive.
  confounders:
  - 'Implementation choice: a construction''s operation count depends on how it is written, and a
    clever or careless implementation can move a geometry across the frontier. The two-implementation
    control bounds this for the greedy arm only.'
  - 'Prerequisite costs: an exponent-side construction is cheap only if a discrete-logarithm table
    exists, and whether the table is charged to the geometry or treated as environment changes the
    verdict completely.'
  - Trimming to matched size costs operations that belong to no geometry in particular.
  - 'Primitive weighting: counting an inversion and a multiplication as one operation each understates
    inversion; the contract reports the breakdown so any weighting can be applied later, but the headline
    number needs one and the choice is a confounder.'
  - Small B makes constant factors dominate the fitted growth exponents.
  interpretation_limits:
  - Construction cost is not attack cost, not relation-collection cost and not solve cost; nothing
    operational follows from any row of the table.
  - Operation counts are machine-independent by design and therefore do not predict wall-clock time,
    which this contract does not measure.
  - The frontier is specific to the primitive weighting and to the decision about whether prerequisite
    tables are charged; both are declared and both are debatable.
  - Toy sizes only; growth exponents are fitted over a short ladder in B and are reported as fitted
    trends, not asymptotics.
  target_complexity:
    time_exponent: No attack exponent is claimed. The contract measures construction cost exponents
      in B for each geometry - for example a predicted exponent near 1 for interval scans and near
      2 for greedy search - but these are construction costs of a measurement object, not attack time
      exponents, and no attack is proposed.
    memory_exponent: No attack memory exponent is claimed. Construction memory is measured per geometry
      and is expected to be linear in B for every panel member except any that requires a discrete-logarithm
      table, which is linear in N and is reported separately as a prerequisite rather than folded
      into the geometry's row.
    best_known: 'The incumbent is the matched random base: coverage excess exactly 1.000, construction
      cost about two curve-equation evaluations per admitted element, peak memory B words. Every geometry
      in the panel is measured against that row on all three axes at once. There is no incumbent charged
      comparison in this repository, so the contribution is the frontier''s existence rather than
      an improvement over an existing frontier.'
    hidden_overhead: 'The largest hidden cost is the prerequisite question: an exponent-side construction
      looks nearly free until the discrete-logarithm table is charged, at which point it is the most
      expensive row in the table by orders of magnitude, and the decision about where to put that
      charge is made by a human and determines the answer. A second hidden cost is primitive weighting.
      A third is the human labour of instrumenting every construction faithfully, where an unwrapped
      hot primitive silently makes a geometry look cheap.'
  dominated_by: 'n/a (no result claimed) on attack axes; the contract produces no algorithm and no
    attack cost point, so no attack frontier row is displaced. On the measurement''s own three axes
    the Pareto check is the deliverable and I performed the check against every row this repository
    records: the matched random base at excess 1.000 with about two curve-equation evaluations per
    element dominates on cost and is dominated on excess by the Bose-Chowla row at 1.1071 recorded
    in EV-FBG-001''s red-team objection, which in turn is dominated on prerequisite cost since it
    needs a table; the whole-group low-collision greedy at 1.0269 from the same objection is dominated
    on construction cost by every scan-based geometry; and the frozen battery''s coset_union at 1.0012
    with an interval containing 1 is dominated on excess by both and on cost by the interval families.
    No row is uncontested on all three axes, which is exactly why the frontier is worth building.'
  sota_delta: 'No attack; measurement and accounting contribution only. Quantitatively: this program
    currently records coverage excesses of 1.0012, 1.0269 and 1.1071 with zero construction-cost figures
    attached, so the excess ranking is the only ranking available. A completed run would attach an
    instrumented operation count and a peak memory figure to each of those rows plus the panel members
    built here, and would report how many rank inversions charging induces. No attack cost, no relation
    rate, no solve time and no exponent on any attack axis changes.'
  estimated_cost:
    implementation: high
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Counters validating against a closed-form synthetic construction: about
    0.85, an ordinary engineering task whose main risk is an unwrapped primitive. Instrumented and
    uninstrumented builds agreeing bit-for-bit: about 0.9. Charging inducing at least two rank inversions:
    about 0.7 - the greedy arm''s superlinear cost against the interval families'' linear cost makes
    some inversion nearly certain, and my uncertainty is mostly about whether two or more occur rather
    than one. Greedy growth exponent measured at or above 1.8: about 0.55, since the exponent depends
    on the search''s stopping rule, which is a design choice rather than a property of the geometry,
    and that is itself a finding. The prerequisite-charging decision being resolvable without it dominating
    the entire table: about 0.35, which is the weakest link - I expect the discrete-logarithm table
    charge to swamp everything and for the honest deliverable to be two tables, one with the prerequisite
    charged and one without, rather than a single frontier. Overall probability the run produces a
    defensible three-axis frontier rather than an accounting dispute: about 0.5.'
