idea:
  id: IDEA-20260811-fe0934
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MODEL-e61cb2
  goal_id: GOAL-ENDO-001
  title: >-
    WHICH CURVE MODELS EXIST IS ITSELF AN ISOGENY-CLASS-VARYING QUANTITY, AND ON
    THE COMMITTED CLASS THE PARTITION IS EXACT AND COMPLEMENTARY: Legendre form
    needs full rational 2-torsion and twisted Edwards needs a rational point of
    order 4, the 2-Sylow of every member has order exactly 4, so the 66 non-floor
    curves admit Legendre and NOT Edwards while the 72 floor curves admit Edwards
    and NOT Legendre -- the model lane's independent variable is therefore
    determined by the 2-volcano, and the pre-registered prediction is that the
    solving cost nevertheless moves by less than 5 percent
  class: representation

  claim: >-
    (A) THE AVAILABILITY CRITERIA, CLASSICAL AND EXACT. Over F_p with p > 3:
    E admits a Legendre model y^2 = x(x - 1)(x - lambda) if and only if
    E(F_p)[2] = (Z/2)^2, i.e. x^3 + a x + b splits completely; and E is
    birationally equivalent to a twisted Edwards model (equivalently to a
    Montgomery model) if and only if E(F_p) has a point of order 4
    [recall-confident: Bernstein-Lange-Birkner-Peters-Joye on twisted Edwards and
    the order-4 criterion; NOT verified this session].
    (B) THE ARITHMETIC OF THE COMMITTED CLASS. Every member has #E = 3972 =
    2^2 * 3 * 331, so the 2-Sylow subgroup has order EXACTLY 4 and is therefore
    either Z/4 or (Z/2)^2 -- never both structures at once and never larger.
    Hence on this class the two criteria are MUTUALLY EXCLUSIVE AND EXHAUSTIVE:
    a member admits Legendre or Edwards, never both, never neither.
    (C) THE PARTITION, PREDICTED BEFORE MEASUREMENT. By the argument of
    IDEA-20260811-245481 -- odd-degree isogenies are isomorphisms on E[2], so the
    2-Sylow structure is constant on each 2-volcano level, and the Lenstra
    identity gives n_1 = gcd(486, 16/f_E) = 2 above the floor and 1 on the floor
    -- the 66 curves at levels 0 to 3 have (Z/2)^2 and admit LEGENDRE ONLY, and
    the 72 curves on the floor have Z/4 and admit EDWARDS ONLY. So "which
    arithmetic model is available" is not a free choice of the implementer: it is
    a function of the curve's position in the volcano, and it is the second
    concrete class-varying functional this campaign has (the first being the
    splitting type itself, of which this is a consequence).
    (D) THE COST PREDICTION, WHICH IS THE FALSIFIABLE HALF. Diem's and Gaudry's
    degree bounds are model-agnostic asymptotically, and this program's own deck
    group law (IDEA-20260807-dadcd2) gives g = 2 for every model on a
    prime-order curve, so the predicted effect of the model on the decomposition
    system is a CONSTANT, not an exponent. The pre-registered numbers: the
    Groebner solving time and the m = 3 decomposition rate differ between the
    Edwards arm and the Legendre arm by less than 5 percent, and the summation
    polynomial's per-variable degree is identical (2 at m = 3) in both. An
    observed difference above 20 percent, surviving the PGL_2 null battery, is
    the first genuine model lever this program would have found and must go
    straight to independent review.
    (E) WHY IT IS WORTH RUNNING EVEN THOUGH (D) PREDICTS ALMOST NOTHING. The
    campaign's central methodological lesson is that an exact 30.8 percent
    structural reduction moved a cost functional by -0.44 percent. This design
    is the same shape with the structure now being an EXACT, CLASS-CORRELATED,
    BINARY model change rather than a coefficient degeneration, and it is the
    cleanest available test of whether "less structure" and "cheaper solving"
    have any relationship at all in this pipeline. A confirmed near-zero is a
    controlled null of the highest quality; the alternative is a lever.

  mechanism: >-
    A curve model is a choice of coordinates that a rational point of small order
    makes available. Rational 2-torsion is a 2-primary Galois-module quantity;
    the 2-volcano is the geometry of exactly that quantity across an isogeny
    class. So the set of models available to an implementer is a shadow of the
    endomorphism-ring conductor's 2-adic valuation. The cost consequence is
    predicted to be nil because the summation polynomial's degree is governed by
    the degree of the coordinate map to P^1, which is 2 in every one of these
    models.

  tracked_object: >-
    The model-availability vector of a curve, i.e. the indicator tuple
    (Legendre available, Montgomery/twisted Edwards available, Jacobi quartic
    available, short Weierstrass available), tracked along the isogeny graph.

  resource: >-
    R1 and R2 (the model and the polynomial system it induces), driven by R5
    (E[2] as a Galois module). No point of G is acted on by an endomorphism, so
    H-ENDO-001 is satisfied.

  lossy_projection_test: >-
    PASSES. The availability vector is a projection of (a, b) onto at most four
    bits and, on this class, onto exactly one bit; 72 curves with 72 distinct
    j-invariants share a value. Propagation is exact: odd-degree isogenies
    preserve the vector, 2-isogenies can change it, and the change is determined
    by whether the step crosses the floor. Compare the failing case the protocol
    warns about: the model itself (as opposed to its availability) is a change of
    coordinates that loses nothing, which is exactly why the campaign's model
    lane has produced null results, and why this record tracks AVAILABILITY
    rather than the model.

  t5_reachability: >-
    Satisfied and cheap in both directions. The availability bit is locally
    computable at O(log^2 p) cost by factoring the cubic and testing for a point
    of order 4. Moving between the two arms is a single 2-isogeny step, which is
    the cheapest possible move in the class and requires no vectorization. So if
    the cost prediction in (D) were violated -- if one arm really were cheaper --
    the good arm would be reachable in one step and locally detectable, which is
    the rarest configuration in this campaign and is precisely why the record is
    worth running despite predicting a null.

  null_object: >-
    THE PGL_2 NULL BATTERY of IDEA-20260807-4fc635, applied unchanged: random
    Moebius changes of the x-coordinate on the SAME curve, with the number of
    randomised variables as the decay parameter, plus the translation-conjugate
    shifted-Kummer coordinate x_R(P) = x(P - R) which must reproduce every
    measurement exactly after retargeting. A model difference that is
    indistinguishable from a random change of coordinates is a coordinate
    artefact, not a model effect. Second null: the same Edwards-versus-Legendre
    comparison across curves from DIFFERENT traces, where no volcano relates
    them, which must show the same difference if the difference is real and a
    different one if it is being driven by the class.

  why_not_a_renamed_known_approach: >-
    The lane's committed records analyse model effects at fixed curve
    (IDEA-20260807-5f5ace's Hessian coordinate, -8027a2's Kummer terminality,
    -dadcd2's deck-group law, -1354d8's saturated meter, -4fc635's null battery).
    All of them treat the model as a free choice. None observes that on a fixed
    curve the choice is CONSTRAINED, that the constraint is a 2-primary invariant,
    or that the constraint therefore varies across an isogeny class in a way the
    volcano predicts exactly. That is the new content, and it is what connects L11
    to L1 and L2 rather than sitting beside them.

  novelty_status: adaptation
  novelty_screen: >-
    Screened this session against the RQ-MODEL lane (IDEA-20260807-dadcd2,
    -4fc635, -5f5ace, -8027a2, -1354d8, -e6d79e, -4fc635) and the RQ-VOLC lane.
    The model-availability criteria are textbook; their class-varying reading
    appears in no committed record found by this screen. WEB SEARCH UNAVAILABLE
    this session, so the Bernstein-Lange attribution is recall-tagged.

  discriminated_from: >-
    NOT IDEA-20260807-dadcd2, whose deck-group law this record CONSUMES as the
    reason to predict a null in (D). NOT IDEA-20260807-1354d8, which fixes a
    meter with no dynamic range; this record supplies the missing INDEPENDENT
    VARIABLE (an exact, class-correlated, binary model change) that such a meter
    would need. NOT IDEA-20260807-4fc635, whose null battery this record adopts
    wholesale rather than reinvents. NOT IDEA-20260811-245481, which predicts the
    splitting type; this record derives a downstream consequence with its own
    independent measurement and its own falsifier.

  assumptions:
  - >-
    p > 3, #E = 3972 with 2-Sylow of order exactly 4 on the committed class, so
    the two model criteria are complementary. On a class where 8 | #E they are
    NOT complementary and the design must be re-derived; this is stated because
    the complementarity is what makes the experiment clean and it is an accident
    of this trace.
  - >-
    Legendre availability is equivalent to full rational 2-torsion; twisted
    Edwards and Montgomery availability is equivalent to a rational point of
    order 4 [recall-confident, not verified this session].
  - >-
    The Semaev machinery can be instantiated in each model. The campaign's
    harness currently implements short Weierstrass only, so building the other
    two arms is real implementation work and is the record's main cost.

  proof_search_map:
    bottleneck: >-
      Whether the model changes the solving cost at fixed factor-base size and
      fixed arity. That is the only step whose removal would change any cost
      claim in L11.
    baseline_embedding:
      parameter_slice: >-
        Short Weierstrass at m = 3 with the campaign's committed factor-base
        construction is the baseline arm and is run unchanged, so every reported
        ratio has a reproduced denominator.
      reproduction_check: >-
        The Weierstrass arm must reproduce the campaign's committed m = 3
        decomposition rates on the same curves and seeds within the band already
        established for those runs; a drift there invalidates every ratio before
        the models are compared.
    observation_collision:
      observable: >-
        The pair (solving time, decomposition rate) at matched factor-base size.
      distinct_preimage_search: >-
        The predicted collision is total: Edwards and Legendre arms on
        2-isogenous curves should be indistinguishable. The search for a
        SEPARATION is the experiment, and the PGL_2 null decides whether any
        separation found is a model effect or a coordinate effect.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The decomposition system written in each model, with the coordinate map
        to P^1 made explicit and its degree recorded, so that the deck-group
        prediction g = 2 is checked rather than assumed.
      predicted_gain: >-
        Zero exponent by the deck-group law; a constant of at most a few percent
        is what is predicted and measured.
    quantifier_order: >-
      For all members of the class, model availability is determined by the
      2-Sylow structure (universal). There exists a model change with a
      measurable cost effect -- this is the existential the experiment tests, and
      the record predicts it is FALSE at the 5 percent level.
    method_ceiling:
      strongest_certifiable_claim: >-
        A constant-factor comparison at m = 3 on one class at one p. The
        deck-group law caps the method: no model can move the exponent, so the
        most this design can ever certify is a constant, and a constant at or
        below sqrt(6) is baseline calibration under KN-TECH-018 in any case.
      nearby_object_control: >-
        The Hessian coordinate of IDEA-20260807-5f5ace, where the desired
        conclusion genuinely FAILS -- x alone is a degree-3 non-Galois coordinate
        with a predicted per-variable degree of 9 rather than 2. A comparison
        instrument that cannot separate Hessian-x from Edwards has not identified
        the load-bearing structure, so the Hessian arm is included as a
        positive control.
    proof_obligations:
    - claim: The availability partition is 66 Legendre-only, 72 Edwards-only.
      responsibility: correctness
    - claim: The solving-cost difference between arms is below 5 percent.
      responsibility: baseline
    - claim: Any observed difference survives the PGL_2 null.
      responsibility: strictness
    not_applicable_reason: null

  predictions:
  - metric: model_availability_partition_over_the_138_curve_class
    direction: different
    minimum_effect: >-
      EXACTLY 66 Legendre-only and 72 Edwards-only, with ZERO curves admitting
      both and ZERO admitting neither. A curve admitting both would contradict
      the 2-Sylow order and means #E was mis-stated; a curve admitting neither
      would contradict 4 | #E.
  - metric: groebner_solving_time_ratio_edwards_over_legendre
    direction: different
    minimum_effect: >-
      Within 5 percent of 1.00 at matched factor-base size and arity. Above 20
      percent, surviving the PGL_2 null, is a model lever and a reviewable
      finding.
  - metric: summation_polynomial_per_variable_degree_per_model
    direction: different
    minimum_effect: >-
      EXACTLY 2 at m = 3 in Weierstrass, Legendre and twisted Edwards, and
      EXACTLY 9 in the Hessian-x positive control. A deviation falsifies the
      deck-group law as applied here.
  - metric: decomposition_rate_ratio_between_arms
    direction: different
    minimum_effect: >-
      Within 3 percent of 1.00, since the rate depends on factor-base size and
      the group order, both of which are matched by construction. A larger
      difference points at the factor-base construction differing between models,
      which is a confound and not a result.

  minimal_test:
    design: >-
      Stage 1, arithmetic only, minutes: compute the 2-Sylow structure of all 138
      members two ways (from the cubic's factorisation and from explicit point
      orders) and produce the availability table with the level cross-tabulation.
      Stage 2, the cost comparison: take a matched set of 2-isogenous PAIRS --
      one floor curve and one level-3 curve joined by a single 2-isogeny, at
      least 12 pairs -- and run the identical m = 3 decomposition measurement on
      each member in its own available model, with factor-base size, arity,
      monomial order and target sampling matched exactly. Report per-pair ratios,
      not pooled means. Stage 3, controls, blocking.
    controls:
    - >-
      PGL_2 NULL BATTERY per IDEA-20260807-4fc635, with the number of randomised
      variables as the decay parameter; a model effect that does not decay
      differently from a random coordinate change is a coordinate artefact.
    - >-
      SHIFTED-KUMMER identity control, which must reproduce measurements exactly
      after retargeting.
    - >-
      HESSIAN-x POSITIVE CONTROL, which must show a large, correctly signed
      effect; without it a null is uninterpretable.
    - >-
      SAME-MODEL cross-pair control: two floor curves compared in Edwards form,
      isolating curve-to-curve noise from model-to-model difference. This is the
      control that sets the 5 percent band, and the band must be read from it
      rather than assumed.
    - >-
      targets_B sampling and a factor-base density sweep, never the saturated
      row.
    required_metrics:
    - per_curve_2_sylow_structure_by_two_methods
    - availability_table_cross_tabulated_by_level
    - per_pair_groebner_time_and_decomposition_rate_ratios
    - per_variable_summation_degree_per_model
    - pgl2_null_decay_curve
    - same_model_cross_pair_noise_band

  falsification_conditions:
  - >-
    The availability partition is not 66/72 or is not complementary. The
    2-torsion arithmetic of (B) and (C) is wrong; this cascades to
    IDEA-20260811-245481 and both records must be revisited together.
  - >-
    A solving-cost ratio above 20 percent that survives the PGL_2 null and the
    same-model noise band. The model lane has a lever; independent review is
    mandatory before it is described as anything.
  - >-
    The Hessian positive control shows no effect. The instrument has no dynamic
    range, exactly as EV-REP-001 and EV-REP-002 were shown to have none
    (IDEA-20260807-1354d8), and every null it produces is void.
  - >-
    The same-model noise band exceeds the between-model difference by an order of
    magnitude in both directions. The design cannot resolve the question at this
    p and must be re-sized before any conclusion.

  confounders:
  - >-
    FACTOR-BASE CONSTRUCTION DIFFERS BY MODEL. A factor base defined by "the
    first B x-coordinates" is not the same SET of points in two models, so the
    comparison must fix the point set and express it in each model, not fix the
    coordinate range. Getting this wrong produces a large spurious difference and
    is the single most likely way this experiment lies.
  - >-
    Edwards arithmetic is faster per group operation for reasons unrelated to the
    decomposition system; group-operation counts, not wall-clock, must drive the
    primary metric.
  - >-
    The level-3 and floor members of a pair differ in more than the model -- they
    differ in the endomorphism ring. That is unavoidable, and it is why the
    same-model cross-pair control is blocking: it is the only way to attribute a
    difference to the model rather than to the level.

  interpretation_limits:
  - >-
    TOY SCALE, p = 4001, m = 3, claim_tier toy. NO ATTACK, NO EXPONENT, NO
    SPEEDUP; sota_delta zero. The deck-group law forbids an exponent claim from
    this design in advance.
  - >-
    Complementarity of the two criteria is an accident of 2-Sylow order 4 at this
    trace and does not generalise; on a class with 8 | #E the design changes.
  - >-
    H-ENDO-001 used, not retested; KN-FIND-b7e091 binding; P2 respected, since
    the factor bases here are size-matched random sets and no phi-stable
    structure is built.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      At fixed arity, fixed factor-base size and fixed target sampling, the
      Groebner solving cost of the decomposition system is a function of the
      degree of the coordinate map to P^1 and of the factor-base membership
      polynomials, and not of the model's coefficient shape; hence models sharing
      a degree-2 coordinate map have equal cost up to implementation constants.
    rigorous_support: >-
      Rigorous ingredient: the deck-group law of IDEA-20260807-dadcd2 gives
      per-variable summation degree g^{m-2} with g = 2 for every model on a
      prime-order curve, and the campaign's own analysis shows the solving degree
      in the f_V-bearing formulation is pinned by |V|. The distribution imitated
      is the standard expectation that Groebner cost is governed by the Bezout
      number of the system rather than by its coefficients.
    validation_plan: >-
      The experiment validates it directly: the per-variable degree is computed
      symbolically in all four models before any timing is taken, and the
      Hessian arm supplies the case where the assumption's premise fails
      (degree 3 coordinate), so the assumption is tested at both a point where it
      should hold and a point where it should not. Tail check: the largest
      observed per-pair ratio against the same-model noise band's maximum, since
      a single extreme pair is how a spurious model effect would first appear.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed and none can move: the deck-group law caps the
      model lever at a constant. Predicted constant: 1.00 +/- 0.05.
    memory_exponent: >-
      Unchanged between models; the systems have identical Bezout numbers at
      matched factor-base size.
    best_known: >-
      For the ECDLP on these curves, parallel rho at 0.886 sqrt(N) with O(1)
      memory (KN-TECH-001, KN-TECH-006). No index-calculus variant over a prime
      field is competitive at any tested size, which the record states so its
      ratios are not misread as attack progress.
    hidden_overhead: >-
      Building three model arms of the harness is the dominant cost of the whole
      record and produces no evidence by itself; it is named as infrastructure.
    tradeoff_note: >-
      Not applicable; no search or memory tradeoff is proposed.

  dominated_by: >-
    As an attack: dominated by every frontier row, since no attack is proposed --
    parallel rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006),
    the automorphism-discounted variant (KN-TECH-018), BSGS at sqrt(N)/sqrt(N)
    (KN-TECH-031). As a model comparison: dominated by IDEA-20260807-dadcd2's
    deck-group law on the THEORY axis, which already predicts the answer; this
    record's contribution is the measurement and the class-varying independent
    variable, not a competing prediction.
  sota_delta: >-
    Zero on every attack axis. Against the campaign's own model lane: supplies
    the first independent variable that is exact, binary and class-correlated,
    and a noise band read from a same-model control rather than assumed.

  estimated_cost:
    implementation: high
    compute: medium

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the availability partition is exactly 66/72 and complementary.
    0.85 that the cost ratio lands within 5 percent of 1.00, i.e. the record
    delivers a high-quality controlled null. 0.05 that a lever survives the null
    battery. Filed medium because Stage 1 is nearly free and decisive while
    Stages 2 and 3 require three harness arms, and the honest expected value is
    concentrated in Stage 1.

  source_refs:
  - ledger/proposals/IDEA-20260807-dadcd2.yaml (deck-group law, consumed)
  - ledger/proposals/IDEA-20260807-4fc635.yaml (PGL_2 null battery, adopted)
  - ledger/proposals/IDEA-20260807-5f5ace.yaml (Hessian arm, used as the
    positive control)
  - ledger/proposals/IDEA-20260807-1354d8.yaml (the meter with no dynamic range)
  - ledger/proposals/IDEA-20260811-245481.yaml (the 2-torsion partition this
    record depends on)
  - ledger/evidence/EV-ICINV-6b6264.yaml (class census; #E = 3972 on all members)
