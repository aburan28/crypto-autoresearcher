  question_id: RQ-ECDSA-87625f
  goal_id: GOAL-ECDSA-001
  title: The tracked object shared by BOTH nonce-leakage families is the integer combination
    vector c in the DUAL of the HNP lattice, and it propagates bias by an exact product rule
    |B(sum c_i u_i)| = prod |sinc(c_i 2^-l)|; mapping every published row of both families
    into the three-coordinate signature (log2 ||c||_1, bits of multiplier reduction, log2
    peak memory) is what makes ONE memory-charged frontier definable rather than asserted
  class: representation
  claim: "SCOPE. ECDSA/DSA partial-nonce leakage (the hidden number problem), exact or erroneous\
    \ top-l-bit leakage, group order n of N = log2 n bits. NOT the plain ECDLP (KN-TECH-019\
    \ boundary; KN-OPEN-011 owns transfer and stays with GOAL-ECDLP-001 / GOAL-PATH-001).\
    \ NO ATTACK IS RUN AND NO EXPONENT OF ANY HARD PROBLEM MOVES.\nTHE CLAIM, EXACTLY. Write\
    \ the m HNP samples as A_i d + Btilde_i = u_i (mod n) with |u_i| <= U = n/2^{l+1}. For\
    \ every integer vector c = (c_1..c_m) define the reduced multiplier a(c) = sum c_i A_i\
    \ mod n and the accumulated error e(c) = sum c_i u_i. Then\n\n  (O1) a(c) d + b(c) = e(c)\
    \ (mod n)  identically, for every c;\n  (O2) |e(c)| <= ||c||_1 * U        deterministically;\n\
    \  (O3) for independent u_i uniform on their intervals,\n       E[exp(2 pi i e(c)/n)]\
    \ = prod_i sinc(c_i 2^{-l}),\n       sinc(x) = sin(pi x)/(pi x),\n       so the Bleichenbacher\
    \ bias MULTIPLIES coordinatewise.\n\nCLAIM C1 (ONE OBJECT). Both published families are\
    \ searches over the SAME set of c. The Fourier/Bleichenbacher family searches for MANY\
    \ c with a(c) < 2^t and no constraint on the other coordinates, paying (O3). The lattice\
    \ family searches for ONE c-equivalent short vector constrained in ALL coordinates simultaneously.\
    \ They are the two extreme faces of one polytope, not two unrelated methods.\nCLAIM C2\
    \ (THE FRONTIER IS THREE-DIMENSIONAL AND THE LITERATURE REPORTS A SHADOW OF IT). Every\
    \ published row of either family admits a signature sigma = (w, r, mu) with w = log2 ||c||_1\
    \ (weight actually used), r = N - t (bits of multiplier reduction achieved) and mu = log2\
    \ (peak memory in machine words). The published tables report (samples, time, memory)\
    \ which is a projection that DISCARDS w and r. Claim: two rows with equal (samples, time,\
    \ memory) can have different sigma, and at least one such pair exists in the assembled\
    \ table.\nCLAIM C3 (THE DISCRIMINATOR). Under any fixed memory charge, the optimum of\
    \ the joint cost functional over the polytope is either strictly INTERIOR (both families\
    \ are suboptimal corner solutions of one frontier — RQ-ECDSA-87625f's \"one Pareto frontier\"\
    \ answer) or lies on a FACE (the two families are genuinely incomparable regimes — the\
    \ \"two frontiers\" answer). This is a computable predicate, not a rhetorical question,\
    \ and it is decided before any attack is run."
  mechanism: "DERIVED IN-REPO THIS SESSION. Nothing below was read from an external source.\n\
    THE ALGEBRA. Centering the known top l bits gives u_i with |u_i| <= U. Multiplying sample\
    \ i by c_i and summing is a Z-linear operation on the congruences, so (O1) is an identity\
    \ and (O2) is the triangle inequality. For (O3): if u is uniform on an interval of length\
    \ n/2^l then E[exp(2 pi i c u/n)] has modulus |sinc(c 2^{-l})| by direct evaluation of\
    \ the geometric sum, and independence across i turns the expectation of the product into\
    \ the product of expectations. THE PROPAGATION RULE IS MULTIPLICATIVE BECAUSE ADDITION\
    \ OF INDEPENDENT VARIABLES IS CONVOLUTION, AND THE FOURIER TRANSFORM TURNS CONVOLUTION\
    \ INTO PRODUCTS. That is the whole mechanism, and it is why the object propagates deterministically.\n\
    WHY THE DUAL LATTICE. The set {c : a(c) = 0 mod n} is a full-rank sublattice of Z^m of\
    \ index n (generically), determinant n, so by the Gaussian heuristic its first minimum\
    \ is about sqrt(m/(2 pi e)) n^{1/m}. Range reduction to a(c) < 2^t is approximate-CVP/BDD\
    \ on that lattice. The primal HNP lattice of Boneh-Venkatesan / Nguyen-Shparlinski (KN-LIT-043,\
    \ KN-LIT-044, KN-LIT-045 via KN-TECH-019) and this dual are the same object seen twice.\
    \ THE SINGLE MOST LIKELY PRIOR-ART COLLISION IS NAMED IN why_not_a_renamed_known_approach\
    \ AND IS NOT DENIED.\nTHE EXCHANGE RATE, WHICH IS THE ACTUAL DELIVERABLE. Counting: the\
    \ number of c with support size h and entries in {-C..C}\\{0} that achieve a(c) < 2^t\
    \ is about binom(m,h) (2C)^h 2^t / n. Requiring at least M such combinations gives the\
    \ FEASIBILITY LINE\n  log2 binom(m,h) + h log2(2C) + t - N >= log2 M.\nRequiring the Bleichenbacher\
    \ peak to clear the noise floor in an FFT of size 2^t gives the DETECTION LINE\n  log2\
    \ M >= 2 h log2( 1 / |sinc(C 2^{-l})| ) + log2 log(2^t) + O(1).\nEliminating M gives a\
    \ single inequality in (m, h, C, t, l, N). THAT INEQUALITY IS THE FRONTIER. The lattice\
    \ family is the corner h = m, C = O(1), t = 0 (every coordinate constrained, no FFT);\
    \ the Fourier family is the corner h << m, t large. Nothing in the published tables states\
    \ where a row sits on it.\nTHE LOSSY-PROJECTION TEST (docs/inventor-protocol.md section\
    \ 2), APPLIED BEFORE ANY EXPERIMENT AND AT ZERO COMPUTE. The projection is (u_1..u_m)\
    \ |-> the single complex number prod_i E[exp(2 pi i c_i u_i/n)], i.e. one Fourier mode\
    \ of the joint nonce distribution. (a) IT IS GENUINELY LOSSY: the map from the joint distribution\
    \ of the\n    u_i to one Fourier coefficient at one frequency is many-to-one by an\n \
    \   enormous factor — every distribution with the same first Fourier\n    coefficient\
    \ collapses to the same object, and the fibre is infinite\n    dimensional.\n(b) WHAT\
    \ IS DISCARDED IS DISCARDED COMPATIBLY: the target's operation is\n    integer linear\
    \ combination of samples, which is convolution of the\n    discarded distributions, and\
    \ convolution acts on the retained\n    coordinate as multiplication. So the retained\
    \ part propagates\n    deterministically under exactly the operation the attack performs.\n\
    (c) IT IS NOT A CHANGE OF COORDINATES: the pair (Delta, Pi) failure mode\n    of KN-LIT-7595\
    \ does not occur here, because one Fourier coefficient\n    does not determine the distribution\
    \ — recovering the u_i from the\n    bias is impossible, not merely expensive.\nThis is\
    \ the first time in this program's ECDSA lane that an object has been put through the\
    \ test, and it passes all three parts."
  why_not_a_renamed_known_approach: 'NEAREST KNOWN METHOD, NAMED WITHOUT HEDGING. RQ-ECDSA-87625f.provenance
    records a 2024 paper titled "Attacking ECDSA with Nonce Leakage by Lattice Sieving: Bridging
    the Gap with Fourier Analysis-based Attacks" (eprint 2024/296, Asiacrypt 2024). THE TITLE
    ALONE SAYS THAT BRIDGING THE TWO FAMILIES IS PUBLISHED WORK. I DID NOT READ IT — web access
    was unavailable this session — AND I DO NOT CLAIM THE BRIDGE IS NEW. What is proposed
    here that a bridge paper would have no reason to contain, and what RQ-ECDSA-87625f states
    is absent from the literature: (i) the three-coordinate signature sigma = (w, r, mu) as
    a REPORTING REQUIREMENT applied to rows from OTHER papers, so heterogeneous published
    results become comparable; (ii) the memory coordinate mu charged under a declared convention
    shared with GOAL-RSA-001; (iii) the interior-versus- face predicate as a pre-registered
    decision procedure for RQ-ECDSA-87625f''s own decision_target. If reading eprint 2024/296
    shows it already contains (i)-(iii), THIS IDEA IS WITHDRAWN AS KNOWN and the correct deliverable
    is a KN-LIT entry saying so. That outcome is cheap, is the first stage of the minimal
    test, and is a legitimate result. Against this program''s own records: H-ECDSA-a23475
    compares REPORTED resource numbers under five charging conventions and never opens the
    algorithm; H-ECDSA-7ccd4b models one family''s success window and the other family''s
    bias contraction SEPARATELY and never puts them in one space. Neither defines a shared
    object.'
  predictions:
  - observable: Exact identity check on random toy instances (N in {32, 48, 64}) of the product
      rule (O3) against the empirically measured modulus of the mean of exp(2 pi i e(c)/n)
      over sampled nonce sets
    metric: max over 10^3 random c of | measured |bias| - prod_i |sinc(c_i 2^{-l})| |, with
      the measured value taken over 10^6 nonce draws
    predicted: Below 4 / sqrt(10^6) = 0.004 for every c, i.e. within sampling noise. A systematic
      gap above 0.01 falsifies the independence idealization and the size of the gap is the
      correction term.
  - observable: Existence of two published rows with equal reported (samples, time, memory)
      to within a factor 2 on each axis but different sigma
    metric: count of such pairs in the assembled table
    predicted: At least 1 if the table reaches 10 rows spanning both families. Zero such pairs
      across a 10-row table means the reported triple already determines sigma and C2 is refuted
      — reported as such.
  - observable: Position of the memory-charged optimum of the joint functional over the polytope,
      at (N, l) in {(160,1), (256,1), (256,2), (256,3)}
    metric: binary INTERIOR / FACE, plus the distance in each of the three coordinates from
      the optimum to the nearest face
    predicted: INTERIOR at (256, 1) and (256, 2); FACE (lattice corner) at (256, 3) and above.
      The (256,3) prediction is the one that can fail cheaply.
  - observable: Fraction of published rows for which sigma can be filled at all from the primary
      text
    metric: filled / total
    predicted: Reported, no value predicted. A low fraction is itself the finding that the
      literature does not report the coordinates that carry the difference; a high fraction
      means sigma is already standard and this idea is downgraded to bookkeeping.
  minimal_test: 'THREE STAGES, THE FIRST OF WHICH CAN KILL THE IDEA FOR THE COST OF ONE DOWNLOAD.
    STAGE 0 (hours, no compute): obtain eprint 2024/296 and the TCHES 2023 predicate-sieving
    paper, file them as KN-LIT entries, and check whether the sigma triple and the interior/face
    predicate are already there. IF YES, STOP AND RECORD KNOWN. STAGE 1 (minutes, no lattice
    library needed): verify (O1)-(O3) numerically at N = 32, 48, 64 with l in {1,2,3,4} by
    direct simulation in pure Python — sample nonces, form random c of weight h in {1,2,4,8},
    compare measured |bias| to the product formula. This is the lossy-projection test made
    executable. STAGE 2 (hours): evaluate the feasibility and detection lines on a grid and
    locate the optimum; classify INTERIOR or FACE at the four (N,l) cells above. Pure arithmetic,
    no attack, memory under 1 GB.'
  controls:
  - 'NULL OBJECT FOR (O3): nonces drawn uniformly with NO leakage. The product rule must return
    |bias| = |sinc(1)| = 0 at c_i = 1, l = 0, and the measured bias must be consistent with
    1/sqrt(#draws). An instrument reporting structure on unleaked nonces is broken.'
  - 'DECAY TEST: as l decreases from 4 to 1 at fixed c, the predicted |bias| must fall monotonically
    (sinc(2^{-l}) decreasing in 2^{-l} on (0,1)). A measured non-monotone curve indicts the
    measurement, not the theory (docs/inventor-protocol.md section 3).'
  - 'PERMUTATION CONTROL for C2: shuffle the (samples, time, memory) labels across rows and
    re-count matched pairs; the count on shuffled data bounds the chance rate.'
  - 'CORNER REPRODUCTION: at h = m, C = 1, t = 0 the frontier inequality must reduce to the
    textbook m > N/l information bound, and at h = 1 it must reduce to t = N (no reduction).
    A frontier that does not contain the two known corners is misimplemented.'
  confounders:
  - 'The u_i are NOT exactly uniform and NOT exactly independent: they are determined by the
    signer''s RNG and by the leakage model. (O3) is exact only under the idealization; the
    measured gap is the confounder and is reported, not assumed away.'
  - Published memory figures may or may not include stored input signatures, which H-ECDSA-a23475
    raises as C1. sigma's mu coordinate inherits that ambiguity and must carry the same provenance
    label.
  - '"Weight actually used" is not always recoverable from a paper; a row whose w cannot be
    filled must be marked unfilled rather than imputed.'
  - Wagner-style reduction produces c with entries in {-1,+1} on 2^k leaves, so w is forced
    by k; a paper reporting k but not w is filled by the identity w = k, and that inference
    must be labelled inferred.
  falsification_conditions:
  - Stage 1 shows the measured |bias| departs from prod |sinc(c_i 2^{-l})| by more than 0.01
    systematically at any tested (N, l, h). The product rule is not the propagation law and
    the object does not propagate deterministically — the lossy-projection test fails part
    (b) and the idea is withdrawn.
  - Stage 0 finds sigma and the interior/face predicate already published. Recorded as KNOWN.
  - Stage 2 finds the optimum on a face at every tested (N, l). Then the two families are
    incomparable regimes, C3 answers "two frontiers", and that is the goal's decision_target
    answered in the negative direction — a first-class result, not a failure.
  - No pair of rows with equal reported triple and different sigma exists in a 10-row table.
    C2 refuted.
  interpretation_limits: A REPRESENTATION AND REPORTING RESULT, NOT AN ATTACK. No key is recovered,
    no published attack is criticised, no algorithm is improved, and no exponent of any hard
    problem moves. Every statement is conditional on the assumed leakage model and says NOTHING
    about the plain ECDLP. Stage 1 is toy-scale by construction (N <= 64) and is labelled
    toy; it validates an algebraic identity, not an attack. Any statement about 256-bit curves
    coming out of Stage 2 is a statement about a cost inequality, not about a recovery.
  assumptions:
  - The leakage is on the top l bits and is exactly known (the erroneous case is X1-02/H-ECDSA-7ccd4b
    territory).
  - n is prime and the A_i are uniform mod n (they are s_i^{-1} r_i for effectively random
    signatures).
  - Machine words are 16 bytes for the mu coordinate unless a source states otherwise; the
    convention is declared, not fitted.
  heuristic_assumptions:
  - id: HA-1
    statement: (Nonce independence and interval uniformity.) FOR ALL i, the centered unknown
      parts u_i are mutually independent and each is uniform on [-U, U] with U = n/2^{l+1}.
      Hence E[exp(2 pi i sum c_i u_i / n)] = prod_i sinc(c_i 2^{-l}) exactly.
    rigorous_ingredient: For a genuinely uniform u on an interval of length n/2^l the identity
      |E[exp(2 pi i c u / n)]| = |sinc(c 2^{-l})| is an exact evaluation of a geometric sum,
      with no heuristic content. Independence across i is the only assumed part.
    distribution_imitated: The classical statement that a sum of independent bounded random
      variables has characteristic function equal to the product of the individual characteristic
      functions — here used exactly, not asymptotically.
    validation_route: 'Sample real ECDSA signature sets at toy N (32/48/64 bit prime orders)
      with a seeded RNG, truncate to l known top bits, and compare the empirical |mean of
      exp(2 pi i e(c)/n)| over 10^6 draws against the product formula, for 10^3 random c per
      (h, C) cell. The correspondence that makes this cheap at deployed size is that the identity
      is coordinatewise: it can be validated PER COORDINATE at 256 bits with a single-sample
      distribution test, without ever forming a 256-bit attack. TOY LABEL: the multi-coordinate
      joint check is toy-scale; the per-coordinate check is size-independent and is not.'
    tail_checks: Report the empirical distribution of |bias| over random c against the predicted
      point mass; check the upper tail (the smoothest / most biased c found) against the predicted
      maximum max_c prod |sinc(c_i 2^{-l})| = |sinc(2^{-l})|^h, and report the observed maximum
      over 10^3 draws with its order statistic.
  - id: HA-2
    statement: (Reduction yield.) FOR ALL (m, h, C, t) in the region considered, the number
      of c with support h, entries in {-C..C}\{0}, and a(c) < 2^t equals binom(m,h)(2C)^h
      2^t / n up to a factor 2^{o(N)}, i.e. the multipliers a(c) equidistribute mod n over
      the combination class.
    rigorous_ingredient: The expectation is exact for A_i uniform and independent mod n, by
      linearity. What is assumed is CONCENTRATION around the expectation, not the expectation
      itself.
    distribution_imitated: Equidistribution of sums of independent uniform residues mod n
      — the same heuristic every subset-sum and generalized-birthday yield analysis makes.
    validation_route: 'At toy N (32-64), enumerate all c of weight h <= 3 for m <= 40 and
      count exactly how many satisfy a(c) < 2^t, against the formula, for a grid of t. Report
      the ratio measured/predicted with its spread over 20 independent A-vectors. This is
      exact enumeration, not sampling, so it has no statistical error. TOY LABEL: toy-scale.'
    tail_checks: 'Check the LOW tail specifically: the count of c achieving the smallest observed
      a(c), against the predicted geometric tail. Yield heuristics fail first in the extreme
      tail, which is exactly the regime the attack operates in.'
  target_complexity:
    time_exponent: NO EXPONENT MOVES. This is a representation and reporting proposal. The
      frontier inequality it defines is the object in which any future exponent claim about
      this family would have to be stated; the inequality itself asserts no cost.
    memory_exponent: Same. The proposal's contribution to the memory axis is that mu becomes
      a required coordinate rather than a footnote; it predicts no value.
    best_known_baseline: 'For key recovery under l-bit leakage the baselines are the published
      lattice-with-predicate and Fourier rows quoted (RELAYED, UNVERIFIED) in RQ-ECDSA-87625f.provenance:
      secp160r1 1-bit at 2^25 samples / 824 min / 1939 GiB and at 2^36 samples / 279 min /
      850 GiB. This proposal does not beat either and does not try to.'
    hidden_overhead_disclosure: The frontier inequality drops an O(1) in the detection line
      and a 2^{o(N)} in the yield line (HA-2). At N = 160-256 those are not small and the
      inequality must be used for CLASSIFICATION (interior vs face), never to predict a wall-clock.
    time_memory_tradeoff: 'The whole point of the object: t (FFT size) and s (list size) are
      the two memory axes and they trade against h (weight) and hence against sample count.
      The tradeoff curve is the frontier and is stated in X1-03 with exponents.'
  sota_delta: 'No attack cost is improved: sota_delta on the attack axis is exactly zero,
    stated quantitatively. The delta claimed is on the REPORTING axis: the literature reports
    a 3-tuple, this proposes a 6-tuple (samples, time, memory, weight, reduction bits, error
    rate), and predicts at least one collision pair in the 3-tuple that the 6-tuple separates.
    If zero such pairs exist the delta is zero and the record says so.'
  dominated_by: 'CHECKED AGAINST EVERY FRONTIER ROW THIS PROGRAM HOLDS. On attack cost (time,
    memory, samples) this proposal is dominated by every published row in RQ-ECDSA-87625f.provenance,
    trivially, because it makes no attack. On the reporting axis the nearest dominating candidate
    is eprint 2024/296 (title known, NOT READ), which may already dominate claims C1 and part
    of C2; Stage 0 exists to find out and the honest current status is "possibly dominated,
    unchecked because web access failed". Within this program: H-ECDSA-a23475 dominates on
    charging-convention analysis and does NOT dominate on the shared-object claim; H-ECDSA-7ccd4b
    dominates on the per-family success models and does NOT dominate on the joint space.'
  estimated_cost: 'Implementation low (pure Python; no lattice library, no FFT library needed
    at Stage 1 — the bias is a mean of complex exponentials). Compute low: Stage 1 under 30
    CPU-minutes, Stage 2 under 2 CPU-hours, peak memory under 1 GB. Stage 0 is reading time
    and is the dominant cost.'
  recommended_priority: high
  honest_prior_of_survival: '0.35 that C1+C2+C3 survive as stated AND are not already published.
    Decomposed: ~0.9 that the product rule (O3) validates (it is nearly a theorem); ~0.5 that
    the bridging content is not already in eprint 2024/296; ~0.75 that at least one 3-tuple
    collision pair exists given a 10-row table. The dominant risk is prior art, and it is
    checkable in Stage 0 for the cost of a download.'
