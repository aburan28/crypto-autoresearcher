  discriminated_from: 'H-ECDSA-a23475: that record treats published resource ROWS as data
    and never touches the attack''s internal object; its axes are (T, M, Q, V) and its statistic
    is ordering stability. This record''s axes are (w, r, mu) and its statistic is the interior/face
    position of an optimum. No overlap in objects, statistics, or falsifiers. H-ECDSA-7ccd4b:
    that record derives, separately, a lattice success window in m and a bias contraction
    law in the error rate e. Its bias law |B(e,l)| = sinc(2^{-l})(1 - e 2^l/(2^l-1)) is the
    SINGLE-COORDINATE case of (O3) at c_i = 1; this record''s content is the MULTI-coordinate
    product rule and the polytope it generates, which that record does not state. IDEA-20260805-411b0e
    / -659115: premise audits of the goal, not object proposals.'
