  batch: EC-STRUCTURE-20260825
  cluster: 'C4-harmonic: attacking DL circularity head-on'
  title: 'AN ALGEBRAIC COMPRESSIBILITY EXPONENT FOR THE DISCRETE LOGARITHM MAP: by Christol''s theorem
    a sequence over F_p is algebraic over F_p(t) exactly when it is p-automatic, so measure the minimal
    automaton size of k -> x(kP) RELATIVE TO N against a multiplicative-group positive control and a random-periodic
    null'
  class: measurement
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: Christol's theorem is classical and recalled. The proposed contribution is its use as
    a measuring instrument for the DL map, producing a curve-level invariant the program does not currently
    have, with an unusually clean positive control.
  claim:
    semantic_part: The sequence k -> x(kP) is N-periodic, so it is trivially p-automatic with N states
      and its generating function is trivially algebraic; the decision-relevant quantity is therefore
      the RELATIVE one -- the minimal automaton size, or equivalently the p-kernel dimension, as a function
      of N -- and an exponent below 1 would be a genuine structural finding.
    evaluator_part: 'Unestablished: the exponent''s value, and whether it can be measured stably at sizes
      where the toy regime is not dominating. The honest prior is an exponent at 1, i.e. no compression,
      which is a controlled null.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - For toy curves, generate the full sequence x(kP) for k = 0..N-1 over F_p.
  - 'Compute the p-kernel: the set of subsequences indexed by k -> p^i k + j, and measure the dimension
    of its span, which by Christol is the algebraicity measure.'
  - Equivalently, compute the minimal deterministic finite automaton with output generating the sequence,
    and record its state count.
  - Fit the exponent c in (state count) ~ N^c across several curves and several N.
  - Run the controls and report c with its uncertainty, then place the result in the taxonomy's (a=1,
    V=F_p, M=deterministic) cell as either a compression finding or a controlled null.
  lossy_projection_test:
    tracked_object: the automaton state of a p-automatic representation of the sequence k -> x(kP)
    what_is_discarded: the index k itself, keeping only the automaton's state after reading k's base-p
      digits
    propagation: 'deterministic BY CONSTRUCTION if such an automaton exists -- which is precisely what
      makes this a fair test of section 2 rather than an assumption of it: the object propagates deterministically
      or it does not exist.'
    verdict: 'PASSES conditionally: it is lossy exactly to the extent the state count is below N, which
      is the quantity being measured.'
  predictions:
  - id: P1
    status: established_formula
    statement: By Christol's theorem, algebraicity over F_p(t) and p-automaticity coincide for sequences
      over F_p.
  - id: P2
    status: established_formula
    statement: k -> g^k in F_p^* has minimal automaton size O(ord(g)) but generating function of DEGREE
      O(1) over F_p(t) after the rational identity, giving a nontrivial positive control that the two
      measures differ.
  - id: P3
    status: unestablished
    statement: For elliptic k -> x(kP) the exponent c equals 1 within measurement error, i.e. no compression.
  minimal_discriminating_test:
    status: specified_not_run
    test: Compute p-kernel dimension and minimal automaton size for at least six toy curves across at
      least three N magnitudes; fit c; compare against both controls.
    pass: 'c is statistically indistinguishable from 1 on all curves: a controlled null, recorded with
      the measured band.'
    fail: c significantly below 1 on any curve is a positive requiring independent replication and an
      immediate check that the effect is not an artifact of small N.
  controls:
  - 'k -> g^k in F_p^* of the same period: the positive control where a compact algebraic description
    provably exists.'
  - 'A uniformly random N-periodic sequence over F_p: the null where no compression exists.'
  - An elliptic divisibility sequence of the same shape, which has known algebraic structure of a different
    kind, as the discriminating middle case.
  confounders:
  - Period N and the automaton alphabet base p interact; at toy scale N and p are close and the exponent
    is unstable, which is the main reason to sweep sizes.
  - Minimal automaton computation is expensive; an approximate minimization would bias c upward and must
    be reported if used.
  - The x-coordinate is defined up to the two-to-one map; using x rather than the full point changes the
    sequence and must be stated.
  falsification:
    semantic: c below 1 with replication would falsify P3 and would be a genuine structural result about
      the DL map.
    evaluator: An approximate minimization scopes out that measurement.
    not_falsification: Inability to minimize at the largest sizes; report the truncation.
  why_this_is_not_a_variant: 'The elliptic-net and jet families in this ledger track algebraic recurrences
    and were closed by generic-group simulability. Automaticity is a different measure: it asks about
    the COMPRESSIBILITY of the whole sequence, not about a per-step recurrence, and a GGM simulability
    argument does not bound it because the automaton is a preprocessing object, not a query strategy.'
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
