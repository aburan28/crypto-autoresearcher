idea:
  id: IDEA-20260815-e103ac
  question_id: RQ-PROP-24458b
  added: '2026-08-15'
  title: >-
    INDEX THE TAXONOMY BY THE OPERATION, NOT BY THE MAP: KN-OPEN-019 asks what
    object each ECDLP family tracks and cannot be answered because the ECDLP has
    no round structure -- but it HAS a finite, writable list of operations under
    which something can be tracked (group law, coordinate field arithmetic,
    Frobenius, Velu quotient, walk/collision, pairing, base change), and applying
    the rigidity test SEPARATELY TO EACH yields an operation-indexed enumeration
    whose cells are checkable and whose empty cells are the actual candidate
    generators
  class: theory

  claim: >-
    (A) WHY KN-OPEN-019 HAS NOT MOVED. The open problem records the blocker
    precisely: "The round-function framing is essential to [the symmetric
    taxonomy]: an object is tracked THROUGH ITERATED ROUNDS, and the family is
    characterized by what survives one round. The ECDLP has no round structure.
    Whether the analogue is 'what survives one group operation', 'what survives
    one step of a random walk', or something without a step at all is
    undetermined." EVERY ATTEMPT IN THIS PROGRAM HAS SILENTLY PICKED THE FIRST
    OPTION. IDEA-20260807-df906f's rigidity theorem is a theorem about the GROUP
    LAW; its escape E4 is literally titled "OBJECTS NOT TRACKED UNDER THE GROUP
    LAW" and its only named inhabitant is Pollard rho. IDEA-20260807-df5984's
    one-point escape taxonomy classifies MAPS OUT OF G, again under the group law.
    The taxonomy has been indexed by the map while the operation was held fixed
    and unexamined.

    (B) THE MOVE. Stop treating "the step" as given. An ECDLP instance
    (p, E, P, Q, N) is acted on by a SMALL, ENUMERABLE set of operations, and each
    one induces its own propagation question and therefore its own rigidity
    verdict. The candidate list, written out so it can be attacked as incomplete
    rather than trusted:
      O1 GROUP LAW on G. Rigidity applies; verdict already known (df906f):
         exact-lossy is empty, probabilistic is bounded by IDEA-20260815-f558e4.
      O2 FIELD ARITHMETIC on coordinates. x(R) lives in F_p, which has TWO
         operations, and the group law is compatible with NEITHER. Tracking
         multiplicative structure of x(R) -- smoothness of an integer lift,
         multiplicative order, factorisation pattern -- is the exact analogue of
         what makes index calculus work for F_p^*, and it fails for a reason that
         should be stated as an obstruction rather than as folklore.
      O3 FROBENIUS pi. Acts trivially on F_p-rational points, so on G it is the
         identity -- an EMPTY cell by a one-line argument, and worth recording as
         empty so nobody re-enters it. Non-trivial only after base change (O7).
      O4 VELU QUOTIENT by an ell-torsion subgroup. This is escape E3, the cell
         where the rigidity theorem PREDICTS real objects live, because E[ell] is
         (Z/ell)^2 and has ell+1 proper subgroups. Populated by isogeny methods.
      O5 WALK / COLLISION structure. Not a congruence at all; rigidity does not
         touch it. Populated by rho and kangaroo, and the reason they are the
         incumbents.
      O6 PAIRING, a bilinear map E[m] x E[m] -> mu_m. Alternating, hence trivial
         on a single cyclic subgroup -- which is exactly why MOV needs an
         independent point. Another cell whose emptiness has a NAMED reason.
      O7 BASE CHANGE to F_p^k or to a lift. Reactivates O3 and is where
         Weil-descent/cover methods and the xedni lane live.
    (C) WHAT THE ENUMERATION BUYS, WHICH IS NOT TIDINESS. Three things, each
    checkable. FIRST, it explains the incumbents structurally: rho and kangaroo
    are incumbent because O5 is the operation the rigidity theorem cannot reach,
    not because nobody tried harder elsewhere. SECOND, it converts "we screened N
    mechanisms and found nothing" -- which docs/inventor-protocol.md section 4
    calls a fatigue report whose honest status is `unverified` -- into a statement
    about the problem, because a cell is closed by an ARGUMENT about its operation
    rather than by exhaustion of a generator. THIRD AND OPERATIONALLY, it makes
    the empty cells addressable: O2 and O6 are recorded above as empty-with-reason,
    and the honest output of this record may well be that the list is complete and
    every cell is either populated or closed -- which is a real closure, or a
    demonstrated incompleteness if someone exhibits an operation not on the list.

    (D) THE CLAIM THIS RECORD DOES NOT MAKE, STATED FIRST SO IT CANNOT BE READ IN.
    IT DOES NOT CLAIM THE LIST O1-O7 IS COMPLETE. Completeness is the hard half of
    KN-OPEN-019 and this record explicitly leaves it open, offering instead a
    FALSIFIABLE COMPLETENESS CRITERION: an operation qualifies if it is computable
    from the public instance in poly(log p) without a discrete logarithm, and acts
    on a set containing the instance data. Anyone who exhibits such an operation
    outside O1-O7 refutes the list, and that refutation is cheap to produce and
    cheap to check. A taxonomy that can be refuted by one example is worth more
    than a survey that cannot.

  mechanism: >-
    STAGE 1 (SYMBOLIC, THE DELIVERABLE). For each of O1-O7 write: the operation's
    exact definition on public instance data; what "tracking under it" means; the
    rigidity verdict (does the df906f argument apply, and if not, why not); the
    populated families; and either the inhabitants or a NAMED obstruction at the
    docs/inventor-protocol.md section 4 standard. NO CELL MAY BE MARKED CLOSED
    WITHOUT AN ARGUMENT; "nothing was found here" is recorded as `unverified` and
    counted as an open cell, which is the discipline the whole record exists to
    impose.
    STAGE 2 (ADVERSARIAL COMPLETENESS ATTACK). Deliberately attempt to refute the
    list using the criterion in (D), by sweeping the public data of an instance --
    p, the coefficients, the coordinates, N, the group structure, the division
    polynomials, the modular polynomials, the twist -- and asking for each what
    operations it supports. This stage is run to SUCCEED at refutation, not to
    confirm the list; a session that returns "list confirmed" without having
    generated candidate refutations has not run this stage.
    STAGE 3 (CELL-BY-CELL AUDIT AGAINST THE LEDGER). Map every ECDLP-relevant
    hypothesis and evidence record in the ledger to a cell. Cells with many records
    and no positive evidence are saturated; cells with NO records are the output of
    this proposal. Report the histogram, since a cell that is empty because nobody
    looked reads identically to a cell that is empty because it is closed unless
    the two are distinguished explicitly.
    STAGE 4 (ONE CHEAP PROBE PER GENUINELY EMPTY CELL). For each cell found empty
    and NOT closed by argument, specify the cheapest discriminating measurement,
    with its null. Specification only; execution is a separate proposal under
    Coordinator approval.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over ledger/proposals, ledger/hypotheses and knowledge/ for
      "tracked-object", "tracked_object", "KN-OPEN-019", "one-step propagation",
      "taxonomy", "enumeration", and for each operation name; plus a full read of
      the two nearest records (IDEA-20260807-df906f, IDEA-20260807-df5984) and of
      KN-OPEN-019 itself.
    results: >-
      409 records mention tracked objects or KN-OPEN-019, and 57 mention one-step
      propagation, so the VOCABULARY is saturated. But every one examined indexes
      by the map or by the mathematical object the map factors through, with the
      group law fixed as the operation. IDEA-20260813-f35692's open_directions
      states plainly that "A full write-up of an ECDLP/lattice tracked-object
      enumeration (KN-OPEN-019's open sibling for this domain) would let this audit
      be posed more precisely" -- the program's own record that the enumeration is
      NOT written. KN-OPEN-019 remains `status: open`.
    verdict: >-
      UNVERIFIED. The re-indexing from map to operation appears to be new to this
      program, and the program itself records the enumeration as missing. But the
      individual cell verdicts are NOT new -- O3's triviality, O6's alternating
      obstruction, and O5's inaccessibility to rigidity are each either classical
      or already recorded here, and this record assembles rather than discovers
      them. Novelty is claimed for the INDEXING and the falsifiable completeness
      criterion only, at `unverified` until a reviewer checks whether the symmetric
      -side literature already frames its own taxonomy this way, which is likely.

  object_first_candidate:
    tracked_object: >-
      THE OPERATION, promoted from background assumption to the indexed variable.
      This record tracks nothing through a computation; it enumerates the
      computations through which anything could be tracked. Recorded explicitly
      rather than left blank, per docs/inventor-protocol.md section 5.
    lossiness: >-
      Not applicable at the record's own level. The lossy-projection test is what
      the record APPLIES to each cell, and is answered inside the cells.
    propagation: not_applicable
    survival_score: not_applicable

  null_object_control: >-
    THE NULL FOR A TAXONOMY IS A TAXONOMY THAT EXPLAINS NOTHING, and it must be
    constructed rather than waved at. NULL 1 -- a deliberately BAD indexing (e.g.
    by publication decade, or by first letter of the method name) applied to the
    same ledger corpus in Stage 3. If the O1-O7 indexing does not produce a
    visibly more concentrated histogram than the bad indexing, it is not carrying
    structure and must be reported as such. NULL 2 -- a RANDOM PARTITION of the
    ledger records into 7 cells, as the baseline concentration. NULL 3, THE
    IMPORTANT ONE -- apply the same operation-enumeration procedure to a problem
    whose taxonomy IS known and settled, namely a block cipher, and check that it
    recovers the established symmetric families. A procedure that cannot rediscover
    differential and linear cryptanalysis on a target where they are known to live
    has not been validated and its ECDLP output carries no weight.

  discriminated_from:
    - >-
      IDEA-20260807-df906f. NOT A RESTATEMENT: that record proves the rigidity
      theorem for ONE operation (the group law) and lists four escapes from it.
      This record takes the escape list as an INPUT and asks what the full
      operation space is, of which E4 is one entry. It re-derives none of theorem
      (A) and cites it throughout.
    - >-
      IDEA-20260807-df5984 (ONE-POINT ESCAPE TAXONOMY). CLOSEST NEIGHBOUR AND THE
      ONE MOST LIKELY TO BE CONFUSED WITH THIS. That record classifies publicly
      computable MAPS out of the cryptographic subgroup by the object they factor
      through (End(E), divisors, the formal group, Galois cohomology, a change of
      base field), with the group law fixed throughout. This record classifies the
      OPERATIONS, and its O7 cell is where that record's "change of base field"
      entry sits. THE TWO ARE ORTHOGONAL AXES OF THE SAME TABLE and the honest
      description is that df5984 enumerates rows and this enumerates columns.
      Stage 3 must place df5984's classes INSIDE the cells rather than alongside
      them, and if the two axes turn out not to be independent that is a finding
      about the taxonomy and must be reported.
    - >-
      IDEA-20260815-f558e4 (the propagation ceiling). SIBLING, NOT PARENT: that
      record quantifies escape E1 inside cell O1; this one asks what the other
      cells are. They share RQ-PROP-24458b and were generated together; neither
      depends on the other's outcome.
    - >-
      KN-TECH-3b593f. That record closes two SPECIFIC post-SIDH mechanisms for
      genus-1 by counting. It is a cell-level result inside O4 and is cited as
      such, not duplicated.
    - >-
      The 2026-07-20 completeness sweep and the idea-generation saturation
      reports. EXPLICITLY NOT THAT, and the difference is the record's whole
      point: those are statements about the search, which
      docs/inventor-protocol.md section 4 classifies as fatigue reports with
      honest status `unverified`. This record's cells close by argument or stay
      open; it may NOT report "swept and found nothing" as a closure.

  assumptions:
    - >-
      An operation is a meaningful taxonomic index for a problem without round
      structure. THIS IS THE RECORD'S LOAD-BEARING BET and it is not obvious; the
      symmetric taxonomy indexes by object with the round fixed, and inverting
      which variable is held fixed may simply produce a different vocabulary for
      the same content. NULL 3 is the test that decides it.
    - >-
      The public-instance-computable criterion in (D) is the right admissibility
      test. It excludes operations needing a discrete logarithm, which is
      necessary, but it may also exclude legitimate attack settings with auxiliary
      input (Cheon-style) or leakage (HNP). Those settings are OUT OF SCOPE here
      and their exclusion is a scoping choice, not a claim they are unimportant.
    - >-
      Ledger records can be assigned to cells reliably enough for the Stage 3
      histogram to mean anything. Assignment is judgement-laden; disagreements
      must be recorded rather than resolved silently, and the histogram reported
      with its ambiguous assignments counted separately.

  proof_search_map:
    bottleneck: >-
      COMPLETENESS OF O1-O7, which the record explicitly does not claim. Everything
      else is assembly of known cell-level facts. The schedule is arranged so the
      deliverable survives incompleteness: an incomplete-but-explicit list with a
      refutation criterion is useful, whereas an implicitly-complete list is the
      failure mode being corrected.
    baseline_embedding:
      parameter_slice: >-
        The block-cipher control of NULL 3, at a small round-reduced cipher where
        differential and linear cryptanalysis are textbook.
      reproduction_check: >-
        The procedure applied there must output the established symmetric families
        and must NOT output spurious extra ones. This is the only place in the
        record where a ground truth exists, and it is therefore the only place the
        method can be validated at all.
    observation_collision:
      observable: >-
        The cell assignment of an attack family.
      distinct_preimage_search: >-
        The direct falsifier is ONE ATTACK FAMILY THAT SITS IN TWO CELLS, or a
        family in no cell. Pollard rho is the obvious stress case: it uses the
        group law to walk (O1) but tracks a collision (O5). If the assignment
        cannot separate those cleanly, the axis is not well defined and the record
        must say so. THIS IS A GENUINE RISK, NOT A FORMALITY.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Re-encode "what object is tracked" as "under which operation".
          ENCODING: an attack family as a pair (operation, object). COMPLETENESS:
          NOT CLAIMED -- that is the open half. SOUNDNESS: each cell verdict is
          argued separately, so a wrong cell does not corrupt the others.
          TRANSFER: the symmetric-side validation of NULL 3 is the only transfer
          evidence and it is weak. COST LOSS: none; the record is symbolic.
        predicted_gain: >-
          Converts an unanswerable "is the enumeration closed" into a finite list
          of cell-level questions, each closable or populatable independently.
    quantifier_order: >-
      THE CLAIM IS: FOR EACH operation O in the list, THERE EXISTS a verdict
      (populated, or closed with a named obstruction, or open). THE TRAP, NAMED
      AND AVOIDED: the tempting stronger form -- FOR ALL operations O, O is in the
      list -- is the completeness claim, and it is NOT asserted. Reversing those
      quantifiers is exactly how a survey becomes a false closure, and it is the
      specific error this record is designed not to commit.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "here is an explicit operation list, a verdict per cell each with
        its argument or its named gap, a mapping of the existing ledger onto it,
        and a refutation criterion." IT CANNOT ESTABLISH THAT THE LIST IS COMPLETE
        and therefore cannot close KN-OPEN-019. It also proves nothing about the
        ECDLP's hardness in either direction.
      nearby_object_control: >-
        The block cipher of NULL 3, where the answer is known. A taxonomy
        procedure that produces the same-shaped output on a target with a settled
        taxonomy and on one without has not identified any load-bearing structure.
    proof_obligations:
      - claim: O3 is trivial on F_p-rational points (Frobenius acts as identity).
        responsibility: correctness
      - claim: O6 is trivial on a single cyclic subgroup (pairing is alternating).
        responsibility: correctness
      - claim: the rigidity argument does not apply to O5.
        responsibility: scope
      - claim: every ledger record maps to at least one cell; ambiguous ones are counted separately.
        responsibility: interface
      - claim: NULL 3 recovers the established symmetric families.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: cell verdicts for O3 and O6
      direction: different
      minimum_effect: >-
        FORCED CLOSED, each by a one-line argument (Frobenius acts as identity on
        F_p-points; the pairing is alternating hence trivial on a cyclic subgroup).
        If either argument fails, the record has a mathematical error and stops.
    - metric: Stage 3 histogram concentration versus the two null indexings
      direction: higher
      minimum_effect: >-
        The O1-O7 indexing must concentrate the ledger corpus more than a random
        7-way partition and more than the deliberately bad indexing. NO MINIMUM
        EFFECT SIZE IS PRE-COMMITTED because none is defensible in advance; the
        comparison is reported with all three histograms side by side and the
        reader judges. Stating a threshold here would be inventing a criterion to
        pass.
    - metric: number of genuinely empty cells (empty AND not closed by argument)
      direction: different
      minimum_effect: >-
        Predicted 0 to 2. Zero means the list is populated-or-closed throughout,
        which is a real closure of the LIST though not of KN-OPEN-019. Three or
        more suggests the axis is too coarse and should be refined before use.
    - metric: Stage 2 adversarial refutation attempts
      direction: different
      minimum_effect: >-
        At least five candidate operations outside O1-O7 must be GENERATED AND
        EXAMINED, whatever the verdict on them. A Stage 2 that produces no
        candidates has not been run, and the record must report the candidates and
        why each fails the admissibility criterion.
    - metric: NULL 3 recovery of symmetric families
      direction: different
      minimum_effect: >-
        FORCED: differential and linear must appear. Failure invalidates the
        method and voids the ECDLP output.

  minimal_test:
    design: >-
      Stage 1 plus NULL 3, with no ledger mapping at all. That is a day of symbolic
      work, requires no compute, and already decides the only thing that matters
      first -- whether the operation axis recovers a known taxonomy on a target
      where one exists. If NULL 3 fails, the record is withdrawn and Stages 2-4
      are never run.
    controls:
      - Bad-indexing null on the same corpus.
      - Random 7-way partition null.
      - Block-cipher recovery control (NULL 3), which is blocking.
      - >-
        The Pollard-rho two-cell stress case, run as a deliberate attempt to break
        the axis rather than as a sanity check.
    required_metrics:
      - Per-cell verdict with its argument or its named gap, one entry per cell.
      - Three histograms (O1-O7, bad indexing, random) reported together.
      - Count and list of ambiguous ledger assignments.
      - Candidate operations generated in Stage 2 and the disposition of each.
      - NULL 3 output against the known symmetric taxonomy.

  falsification_conditions:
    - >-
      NULL 3 fails to recover the established symmetric families. The method is
      not validated; withdraw the record.
    - >-
      An admissible operation outside O1-O7 is exhibited. The list is refuted --
      which is a SUCCESS of the refutation criterion and must be reported as the
      record working, not as it failing.
    - >-
      An attack family cannot be assigned to a cell, or sits irreducibly in two.
      The axis is not well defined; report and refine before any use.
    - >-
      The O1-O7 histogram is no more concentrated than the random null. The
      indexing carries no structure.
    - >-
      Any cell is marked closed without a named obstruction. Contract violation
      under docs/inventor-protocol.md section 4; the record must downgrade that
      cell to `unverified` rather than argue for it.

  confounders:
    - >-
      HINDSIGHT FITTING. The list O1-O7 was written by someone who already knows
      which attack families exist, so of course they fit into it. This is the
      dominant threat to the record's value and NULL 3 plus the Stage 2 refutation
      attempt are the only defences; neither is fully adequate and that is stated
      rather than hidden.
    - >-
      ASSIGNMENT SUBJECTIVITY. Mapping ledger records to cells is judgement, and a
      motivated assigner can produce any histogram. Ambiguous assignments must be
      counted separately and the assignment rule fixed before Stage 3 begins.
    - >-
      VOCABULARY SATURATION. 409 records already use tracked-object language, so a
      reviewer may read this as one more of them. The discriminated_from entry for
      df5984 is the specific defence and must be checked first by any reviewer.
    - >-
      COMPLETENESS CREEP. The record repeatedly says it does not claim
      completeness; downstream citation will nonetheless be tempted to treat the
      list as complete. The Coordinator should treat any citation of this record as
      a closure of KN-OPEN-019 as a misreading.

  interpretation_limits:
    - >-
      This does NOT close KN-OPEN-019. It supplies an axis and a refutation
      criterion, and KN-OPEN-019 remains open regardless of outcome.
    - >-
      No attack, no exponent, no cost claim. The record is symbolic throughout.
    - >-
      Cell verdicts are scoped to prime-field ECDLP with public instance data
      only; auxiliary-input and leakage settings are excluded by the admissibility
      criterion and nothing here bears on them.
    - >-
      A closed cell is closed WITHIN the stated operation and scope. It is never a
      statement that a direction is impossible, which the Idea Generator
      prohibition forbids and which docs/inventor-protocol.md section 7 reaffirms.

  heuristic_assumptions:
    - id: HEUR-OPTAX-1
      statement: >-
        Every attack on a prime-field ECDLP instance that uses only public instance
        data tracks something under at least one of the operations O1-O7.
      rigorous_support: >-
        NO RIGOROUS SUPPORT IS OFFERED AND NONE IS AVAILABLE. This is the
        completeness claim in disguise and the record declines to assert it; it is
        recorded here, in the heuristics block, precisely so that it cannot be
        smuggled into a conclusion later. The only evidence for it is that every
        family currently known to this program does fit, which is exactly the
        hindsight-fitting confounder.
      falsification_condition: >-
        One admissible operation outside the list, or one public-data attack whose
        tracked structure fits no cell.
      validation_plan: >-
        SAMPLE: every ECDLP-relevant hypothesis and evidence record in the ledger,
        plus the attack families named in KN-OPEN-019 and KN-TECH-005. COMPARISON:
        assignment success rate, with ambiguous cases counted separately rather
        than forced. TAIL CHECK: report every record that resisted assignment,
        since those are the candidate refutations. TRANSFER ASSUMPTION, STATED AND
        UNJUSTIFIED: that a list validated against known families constrains
        unknown ones. IT DOES NOT, and that is the honest ceiling of this record.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD BE -- the record proposes no
      algorithm. Stated explicitly rather than omitted. Its own cost is human and
      symbolic: one session for Stage 1 and NULL 3, a second for Stages 2-4.
    memory_exponent: not applicable; no computation is proposed.
    best_known: >-
      For the taxonomy question there is NO incumbent in this repository --
      KN-OPEN-019 is open and the program records the enumeration as unwritten. On
      the symmetric side the incumbent is the classical object-indexed taxonomy
      (KN-LIT-7595) and the unifying formalism of KN-LIT-7601, NEITHER OF WHICH
      THIS RECORD IMPROVES; it borrows their framing and reindexes it.
    hidden_overhead: >-
      The hidden cost is that a taxonomy invites premature confidence. A list that
      looks complete will be used as if it were, and the resulting false closures
      would be worse than having no list. That risk is the reason for the
      refutation criterion and for the completeness-creep confounder.
    tradeoff_note: >-
      Coarser cells make assignment easy and conclusions weak; finer cells make
      assignment contested and conclusions sharp. O1-O7 is deliberately coarse
      because a contested assignment yields no usable histogram, and the cost of
      that choice is that a cell can be "populated" while its interior is barely
      explored.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. AS AN ATTACK: n/a (no result claimed) -- no attack
    is mounted and no frontier row applies. AS A TAXONOMY: dominated by nothing in
    this repository, because no ECDLP taxonomy exists here to dominate it --
    KN-OPEN-019 is open and IDEA-20260813-f35692 records the write-up as missing.
    AS A FRAMING: strictly downstream of the symmetric-side taxonomy of KN-LIT-7595
    and the unifying formalism of KN-LIT-7601, both of which are more developed
    than anything here and neither of which supplies an ECDLP list. AS A
    STRUCTURAL RESULT: IDEA-20260807-df906f's rigidity theorem is sharper within
    cell O1 than anything this record says about O1, and this record defers to it
    entirely there. Null is NOT claimed on any axis.
  sota_delta: >-
    No attack, no speedup, no exponent; conceptual contribution only. CONTENT
    DELIVERED: an explicit seven-cell operation list where the program currently
    has none; two cells (O3, O6) closed by one-line arguments that are stated here
    rather than assumed as folklore; a placement of the program's existing
    structural results into cells (df906f into O1, KN-TECH-3b593f into O4, rho and
    kangaroo into O5); a falsifiable completeness criterion that any reader can
    attack with a single example; and a symmetric-side recovery control that makes
    the method itself testable. Against the prior state -- KN-OPEN-019 open with
    the enumeration recorded as unwritten -- the delta is the axis and the
    criterion, and explicitly NOT the completeness the open problem asks for.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that Stage 1 produces defensible verdicts for O1, O3, O4, O5, O6 -- those
    rest on arguments that are already known or one line long. 0.5 that O2's
    obstruction can be stated at the section 4 standard rather than as folklore;
    "there is no norm on E(F_p)" is repeated everywhere in this literature and
    stating it as a theorem with the right quantifiers is harder than it looks, and
    IDEA-20260815-3dc025 attacks exactly that gap from the other side. 0.6 that
    NULL 3 recovers the symmetric families cleanly. 0.3 that Stage 2 refutes the
    list, which would be a good outcome and is why the stage exists. 0.15 that the
    histogram of Stage 3 is genuinely more concentrated than the null indexings in
    a way a skeptical reader accepts -- this is the weakest part of the record and
    I expect it to be the part a red team attacks first.

