idea:
  id: IDEA-20261006-24268f
  question_id: RQ-TORS-8c7b79
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Affine exact-order-3 counts differ on y^2=x^3+4x+6 and
    y^2=x^3+5x+8 over F_41
  class: measurement
  claim: >-
    REPRESENTATION. The objects are affine points of exact order 3,
    read as pairs (x, y) in F_41^2, not as a factor count of a
    division polynomial and not as a Kummer line. No attack-stage cost
    is claimed to change. The discrete-log exponent delta versus
    Pollard rho is 0. Let R3(C) be the number of affine points P on C
    with [3]P = O and P not equal to O. Let E1 be y^2 = x^3 + 4x + 6
    and E2 be y^2 = x^3 + 5x + 8, both over F_41. The claim is that
    the absolute difference of R3(E1) and R3(E2) is at least 1, after
    both discriminants are checked nonzero. Two explanations are
    discriminated. Different fibers: the rational 3-torsion sets have
    different sizes. Same fiber: the two counts agree. Agreement is
    the negative. This pair is not a quadratic twist (a twist scales
    A by c^2 and B by c^3 together). It is not the psi_7 factor-count
    gap on y^2=x^3+x+1 over F_23, and it is not a discrete logarithm.
  mechanism: >-
    The representation is the set of affine exact-order-3 points. The
    operation set is the group law restricted to that set, which is
    closed and has size R3(C). The projection keeps one integer, the
    cardinality, and discards the coordinates. Many curves can share a
    cardinality, so the projection is lossy. The priced integer is
    |R3(E1)-R3(E2)|. No factor base is proposed.
  novelty_status: unverified
  citations:
    - ref: RQ-TORS-8c7b79
      provenance: internal
      claim: >-
        The question asks whether ell-torsion carries publicly
        computable information about a discrete log. These counts are
        curve-only and k-independent. Toy evidence is capped.
      verified_by: design session 2026-10-06 read ledger/questions/RQ-TORS-8c7b79.yaml
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_m is a summation polynomial. R3 counts points, and no
        decomposition is run.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. This count does not change that exponent.
      verified_by: design session 2026-10-06 read knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - >-
      Exact order 3 means [3]P = O and P is not O. A point of order 1
      is not counted. A point of order dividing 3 other than O is
      counted once.
    - >-
      4*4^3+27*6^2 = 1228 and 1228 mod 41 is 39, not 0. 4*5^3+27*8^2
      = 2228 and 2228 mod 41 is 14, not 0. Both models are nonsingular.
      Those two residues were computed while writing this proposal.
      R3 was not computed.
  predictions:
    - metric: absolute difference of R3(E1) and R3(E2) over F_41
      direction: different
      minimum_effect: at least 1
  minimal_test:
    design: >-
      For each model, enumerate x in F_41, keep the x whose right-hand
      side is a square, and count the affine points with [3]P = O and
      P not O. Use one group-law implementation and repeat the count
      with a second doubling formula. A disagreement of the two counts
      on the same curve invalidates the instrument.
    controls:
      - Both discriminants are the residues named above. A zero discriminant invalidates the run.
      - The point at infinity is not counted in R3.
      - A second group-law implementation reproduces R3 on each curve. A mismatch invalidates the instrument.
      - E2 is not produced by scaling E1's coefficients by c^2 and c^3 for a nonsquare c. If it is, the pair is the wrong object and the claim is not scored.
    required_metrics:
      - R3(E1) and R3(E2)
      - both discriminants
      - the two group-law counts on each curve
  falsification_conditions:
    - R3(E1) equals R3(E2). That equality is the negative.
    - The two group-law implementations disagree, so the instrument is invalid and the claim is not established.
    - Either discriminant is 0.
  confounders:
    - Counting all kernel points of [3], including O, adds one to both sides and does not change the difference. The definition excludes O so the integer is the affine count.
    - A quadratic twist can change the trace and the rational torsion. This pair is not that construction, and a writeup that replaces E2 by a twist is a different measurement.
  interpretation_limits:
    - The counts do not depend on a secret scalar. The discrete-log exponent delta is 0.
    - No factor base or descent is defined.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Two ordinary cubics over the same prime, not a twist pair, have
        rational exact-order-3 counts that differ by at least 1 at the
        rate expected if the 3-torsion field is not forced to be the
        same extension for both models. A random model of two independent
        subsets of a 8-point 3-torsion set is the null, not a theorem.
      rigorous_support: >-
        The geometric 3-torsion has 8 affine points. The rational ones
        are the points fixed by Frobenius. The characteristic polynomial
        of Frobenius constrains that set. It does not by itself force
        two different coefficient pairs to have the same rational count.
      validation_plan: >-
        Compute R3 on both curves at p=41. Then repeat the same
        coefficient pair at p=43 and record whether the absolute
        difference stays at least 1. A zero gap at p=41 falsifies the
        claim. A zero gap at p=43 does not rewrite the p=41 row. No
        cryptographic prime is used.
  target_complexity:
    time_exponent: >-
      Enumerating F_41 is linear in that fixed prime. The discrete-log
      exponent stays 1/2. Delta versus Pollard rho is 0.
    memory_exponent: O(1) relative to p. The output is two integers.
    best_known: >-
      Pollard rho at Theta(N^{1/2}) group operations (KR-RHO-13bf67,
      opened for the exponent). Prime-field Semaev index calculus does
      not beat that generic cost under KR-IC-5931ee.
    hidden_overhead: No o(1) attack term. The count is not a relation collector.
    tradeoff_note: No time-memory tradeoff. The output is one integer gap.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  dominated_by: >-
    As a discrete-log method this count is dominated by Pollard rho
    and by KR-IC-5931ee. Those rows do not state R3 for this pair.
    They dominate any reading of the gap as an attack.
  sota_delta: >-
    Discrete-log time-exponent delta versus Pollard rho is 0. The
    count costs one enumeration of F_41 and does not multiply or
    divide that rho cost. The numerical gap claimed is an integer of
    absolute value at least 1, not a speedup factor.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp/index-calculus
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-5931ee
      - KR-IC-9e610d
      - KR-RHO-13bf67
    nearest:
