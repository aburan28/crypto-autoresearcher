idea:
  id: IDEA-20260811-9ba2aa
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ICINV-475b5e
  goal_id: GOAL-ENDO-001
  title: >-
    THE WHOLE f_V-FREE PANEL MAY FACTOR THROUGH E[2], NOT JUST THE ELIMINATION
    FAMILY: the singular locus of S_3 = 0 is the 2-torsion locus by the
    discriminant identity, so singular-locus dimension and degree, the
    regular-sequence indicator, and (conditionally) the graded Betti table are
    all functions of the 2-division polynomial's splitting type -- which would
    mean EXP-ICINV-e0cd8f could not answer its own question even with the
    missing resolution backend installed, and the cheapest possible falsifier is
    two class members with the SAME splitting type and DIFFERENT Betti tables
  class: mechanism

  claim: >-
    (A) THE STRUCTURAL CLAIM. Over QQ[a,b], the Jacobian ideal
    J = < S_3, dS_3/dx_1, dS_3/dx_2, dS_3/dx_3 > has singular locus contained in
    the union of the three hypersurfaces {f(x_i) = 0}, f(x) = x^3 + a x + b, and
    the containment is an equality on the smooth locus of the parameter space.
    The mechanism is committed: disc_T S_3(x_1, x_2, T) = 16 f(x_1) f(x_2)
    (IDEA-20260807-8027a2), so S_3 = dS_3/dx_3 = 0 forces f(x_1) f(x_2) = 0, and
    the symmetry of S_3 propagates the condition to every coordinate.
    (B) THE CONSEQUENCE THE CAMPAIGN NEEDS AND DOES NOT HAVE. If (A) holds, then
    the F_p-scheme structure of the singular locus -- its dimension, its degree,
    its number of F_p-rational components -- is determined by how f factors over
    F_p, i.e. by the splitting type [1,1,1] or [1,2] that IDEA-20260811-245481
    predicts is a 2-volcano level function. Three of EXP-ICINV-e0cd8f's four
    primary invariant families (elimination polynomial; singular locus dimension
    and degree; the C-KOSZUL regular-sequence indicator) would then be
    determined by one bit of 2-primary arithmetic, and the fourth (graded Betti
    table plus Castelnuovo-Mumford regularity) is conjectured -- NOT claimed --
    to be determined by the same bit, because the ideal is generated by data
    supported on that locus.
    (C) THE POINT OF LEVERAGE. DEC-20260810-d70ece pauses that contract on a
    missing independent minimal-free-resolution backend and names the acquisition
    as an infrastructure task. If (B) holds, acquiring the backend does not make
    the contract answer its question: it would emit a CLASS-VARYING verdict
    driven entirely by E[2]. This record therefore proposes the CHEAP ORDER: run
    the symbolic check first, and let its outcome decide whether the backend is
    worth acquiring for THIS contract.
    (D) THE FALSIFIER, WHICH IS THE HALF THAT MAKES THIS TESTABLE RATHER THAN
    RHETORICAL. Under (B) any two class members with the same splitting type have
    identical Betti tables. The 138-member class contains, under
    IDEA-20260811-245481's prediction, 66 curves of one type and 72 of the other,
    so ANY separating pair inside a type refutes (B) and hands the lane a genuine
    curve functional -- which is the outcome that would make RQ-ICINV-475b5e live
    rather than closed. Both outcomes are decisive and neither requires a
    statistical test.

  mechanism: >-
    A Semaev polynomial's degeneracies are 2-torsion degeneracies. S_3 encodes
    the unordered pair {x(P+Q), x(P-Q)}; the pair collides exactly when P - Q
    and P + Q differ by 2-torsion, i.e. when one of the inputs is a 2-torsion
    x-coordinate. Every invariant of the ideal that is computed from its
    singular locus therefore reads 2-torsion. The graded Betti table is not a
    function of the singular locus in general -- that is why (B) is a conjecture
    with a named falsifier and not a claim -- but it IS a function of the ideal,
    and the ideal's only curve-dependent input is f.

  tracked_object: >-
    The singular subscheme Sing(S_3 = 0) as an F_p-scheme, projected to its
    discrete invariants (dimension, degree, number and degrees of F_p-rational
    components). The projection to those discrete invariants is the tracked
    object; the subscheme itself is not.

  resource: >-
    R1 and R2 (the polynomial system and the curve equation), reaching R5
    (E[2] as a Galois module). No point of G is touched, so H-ENDO-001 is
    satisfied and the object is k-independent by construction.

  lossy_projection_test: >-
    PASSES for the discrete invariants and FAILS for the subscheme. Sing(S_3 = 0)
    as a scheme determines f up to the symmetry, hence determines (a, b): that is
    a change of coordinates, not a new object, and it is exactly the trap
    docs/inventor-protocol.md section 2 describes. The discrete invariants DO
    discard: dimension and degree and component degrees retain only the
    factorisation type of f, forgetting 137 of the class's 138 distinct
    j-invariants. What is retained propagates deterministically under
    odd-degree isogenies (which fix E[2] and hence fix the component structure)
    and under isomorphism (weighted homogeneity, C-GAUGE). The record is written
    about the projection and not about the scheme, and this paragraph is the
    reason.

  t5_reachability: >-
    Not applicable in the positive direction and stated rather than omitted: this
    record proposes no curve selection and no walk. If (D) fires -- a separating
    pair inside a splitting type -- then and only then does T5 engage, and the
    successor question is whether the separating invariant is locally computable.
    Betti tables are NOT locally computable at O(log p) cost, so a Betti-based
    goodness criterion would enter T5 through option (i), commonness, and would
    need a measured density, not through option (ii).

  null_object: >-
    Same shape, no class: 138 curves from other traces at p = 4001, identical
    panel. Under (B) their invariant multiset must be explained by their
    splitting-type multiset alone; a residual there is as informative as a
    residual on the class, and cheaper to interpret because there is no volcano
    to confound it. Second null: the quadratic twist of each class member, which
    has the same f up to the twist scaling and must therefore produce identical
    discrete invariants while lying in a different isogeny class -- the sharpest
    available demonstration that the panel does not see the class.

  why_not_a_renamed_known_approach: >-
    The nearest prior art in this program is EV-ICINV-6b6264's own adjudication
    of the S_4 support outlier, which showed a primary metric factoring through
    j via the locus a^3 + 8b^2. That was found AFTER the fact by a reviewing
    session and applied to a SECONDARY metric. This record does the same style of
    algebra in advance and for the PRIMARY metrics, and it names the one metric
    (Betti) for which the argument is conjectural. It is not a re-run of
    EXP-ICINV-e0cd8f in new notation: it does not compute the panel on 138 curves
    at all in its first stage, it computes one ideal over QQ[a,b].

  novelty_status: unverified
  novelty_screen: >-
    Same corpus screen as IDEA-20260811-245481 (this session): DECOMPOSITION.md,
    MATCHED-ORDER-DESIGN.md, EV-ICINV-6b6264, DEC-20260810-d70ece, H-ENDO-001,
    KN-FIND-b7e091, and a lane-by-lane extraction of every GOAL-ENDO-001 proposal
    title and claim opening. WEB SEARCH UNAVAILABLE this session, so external
    novelty is not established; the algebra of Semaev-polynomial singular loci is
    plausibly in the published summation-polynomial literature and this record
    does not claim to have invented it.

  discriminated_from: >-
    NOT IDEA-20260811-245481, which claims the ELIMINATION ideal is the curve
    cubic; this record claims the SINGULAR LOCUS is the 2-torsion locus and draws
    the stronger, riskier consequence about the Betti family. The two share a
    mechanism and can be run in one sitting, but either can fail without the
    other. NOT the S_4 adjudication in EV-ICINV-6b6264 (a j-invariant
    degeneration with no isogeny content): here the driving quantity DOES have
    isogeny content. NOT IDEA-20260807-a6fb2a (LLL on j detects the level): that
    reads the level off j's algebraic height, this reads it off the ideal.

  assumptions:
  - >-
    The f_V-free Jacobian formulation of EXP-ICINV-e0cd8f, m = 3, degrevlex, with
    the affine and homogenised singular loci reported DISTINCTLY per
    CORR-20260810-eb9062.
  - >-
    Singular-locus degree is obtained by a route that exists on the host: Sage
    10.9's MPolynomialIdeal has no .degree() method, and DEC-20260810-d70ece
    records that msolve 0.9.5 with -g 2 supplies the reduced grevlex basis from
    whose leading monomials degree is read. That route is a dependency of this
    record.
  - >-
    THE BETTI HALF IS BACKEND-DEPENDENT AND IS DECLARED AS SUCH. Graded Betti
    numbers have no independent engine on the execution host
    (DEC-20260810-d70ece, D1). This record's PRIMARY stage needs no resolutions.
    The Betti falsifier (D) needs them, and is proposed as exploratory-only under
    Sage's bundled Singular unless and until an independent backend exists -- an
    exploratory Betti separation would be a lead, not evidence.

  proof_search_map:
    bottleneck: >-
      Whether the ideal's homological invariants depend on (a, b) beyond the
      factorisation type of f. That is the exact step whose answer decides
      whether the paused contract can answer its own question.
    baseline_embedding:
      parameter_slice: >-
        The frozen slice of EXP-ICINV-e0cd8f, unchanged, so that a pass is
        directly interpretable as a statement about that contract.
      reproduction_check: >-
        Recompute the singular-locus dimension for (a, b) = (441, 294) and
        compare against the committed run value, honouring
        CORR-20260810-eb9062's affine/homogenised distinction; a mismatch means
        the reproduction failed and stops the record before its own claim.
    observation_collision:
      observable: >-
        The tuple (sing dim, sing degree, Koszul indicator, Betti table, CM
        regularity).
      distinct_preimage_search: >-
        Deliberate and central: search inside each splitting-type block for two
        members with different tuples. Under (B) none exists; one existing is the
        useful result and is the lane's first genuine curve functional.
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: >-
        The full graded Betti table rather than the single number d_reg, retained
        because it is strictly finer than what the conclusion requires and is
        therefore what could survive the projection to E[2].
      predicted_gain: >-
        Diagnostic only. If the Betti table separates within a splitting type,
        the lane gains a functional; no cost claim is made either way.
    - transform: observable_fiber
      proposed_object: >-
        The fibre of the discrete-invariant map over a fixed splitting type, with
        j as the forgotten structure.
      predicted_gain: >-
        Under (B) the fibre is constant, which closes three families with a named
        obstruction.
    quantifier_order: >-
      For all (a, b) over QQ with 4a^3 + 27b^2 nonzero, Sing(S_3 = 0) equals the
      union of the three 2-torsion hypersurfaces. For all pairs of class members
      with equal splitting type, the discrete invariant tuple agrees. The
      quantifier that matters is the second one being universal rather than
      generic: a single counterexample refutes it, and the design looks for one.
    method_ceiling:
      strongest_certifiable_claim: >-
        That three named invariant families of one frozen contract are functions
        of E(F_p)[2] at m = 3 in the f_V-free formulation. It certifies nothing
        about m >= 4, nothing about the f_V-bearing formulation, and nothing
        about solving time.
      nearby_object_control: >-
        The S_4 panel, where a j-invariant degeneration locus is already known to
        exist (EV-ICINV-6b6264): if the method cannot distinguish the S_4
        j-driven mechanism from the S_3 2-torsion-driven one, it has not
        identified the load-bearing structure and its verdicts are unreliable.
    proof_obligations:
    - claim: Sing(S_3 = 0) is the 2-torsion locus over QQ[a,b].
      responsibility: correctness
    - claim: The discrete invariants are functions of the splitting type over F_p.
      responsibility: strictness
    - claim: The Betti table is such a function.
      responsibility: feasibility
    not_applicable_reason: null

  predictions:
  - metric: singular_locus_ideal_over_QQ_ab
    direction: different
    minimum_effect: >-
      Radical equal to the intersection of < f(x_1) >, < f(x_2) >, < f(x_3) >
      intersected with the S_3 hypersurface. A component not supported on any
      f(x_i) = 0 falsifies (A).
  - metric: number_of_distinct_singular_locus_invariant_tuples_on_the_class
    direction: different
    minimum_effect: >-
      EXACTLY 2, matching the two splitting types, under (B). Three or more
      distinct tuples falsifies (B) and is the interesting outcome.
  - metric: within_splitting_type_Betti_table_separations
    direction: different
    minimum_effect: >-
      ZERO under (B). One separating pair, reproduced in a second engine, is a
      lead of the highest value the lane has produced and must be reported as
      exploratory until an independent backend exists.
  - metric: quadratic_twist_invariance_of_the_tuple
    direction: different
    minimum_effect: >-
      Identical tuples for E and its quadratic twist, which lies in a DIFFERENT
      isogeny class (trace -t). Any difference means the panel is reading the
      model rather than the curve and the C-GAUGE discipline has been breached.

  minimal_test:
    design: >-
      STAGE 1, symbolic, no curves, minutes: compute the singular locus of the
      m = 3 f_V-free ideal over QQ[a,b], radical it, and compare against the
      three 2-torsion hypersurfaces. STAGE 2, 138 exact rows, no statistics:
      compute (sing dim, sing degree, Koszul indicator) per member by the msolve
      route, cross-tabulate against splitting type, and report the full table.
      STAGE 3, exploratory and clearly labelled, only if a backend exists:
      Betti tables on a stratified subsample of 12 curves -- six per splitting
      type, chosen to maximise j-spread -- looking for a within-type separation.
      Stage 3 produces a lead, never evidence, until the D1 precondition of
      DEC-20260810-d70ece is met.
    controls:
    - >-
      C-GAUGE on all 138 with a seeded unit, plus the quadratic-twist arm.
    - >-
      NULL OBJECT: 138 curves from other traces, same panel, same table.
    - >-
      PLANTED SIGNAL: a synthetic ideal built by adjoining a generator that
      depends on j (for instance the S_4 degeneration locus a^3 + 8b^2), which
      the panel MUST separate. A panel that cannot see a planted j-dependence
      cannot be trusted to report its absence.
    required_metrics:
    - singular_locus_ideal_over_QQ_ab
    - per_curve_affine_and_homogenised_singular_dimension_reported_distinctly
    - per_curve_singular_degree_via_msolve_leading_monomials
    - per_curve_koszul_regular_sequence_indicator
    - per_curve_splitting_type
    - exploratory_betti_tables_with_backend_provenance

  falsification_conditions:
  - >-
    A singular-locus component not supported on the 2-torsion locus. (A) is
    false and the panel may carry Semaev content after all.
  - >-
    Three or more distinct discrete-invariant tuples across the class. (B) is
    false; RQ-ICINV-475b5e gains a candidate curve functional and the priority of
    acquiring the resolution backend rises sharply.
  - >-
    A within-splitting-type Betti separation reproduced in two engines. The
    conjectural half of (B) is false. This is the single most valuable outcome
    available from this record and must be routed to independent review before
    any interpretation.
  - >-
    The planted j-dependence is not detected. The panel is void and every
    negative it produced is uninterpretable, per docs/inventor-protocol.md
    section 3.

  confounders:
  - >-
    HOMOGENISATION. The committed run's singular-locus coverage classification
    was corrected once already (CORR-20260810-eb9062); reporting one number
    without saying whether it is affine or projective can create or destroy an
    apparent separation.
  - >-
    Sage's bundled Singular is the same engine Sage calls, so a Stage-3
    separation seen only there is one code path, not two, and the campaign has
    already ruled that insufficient for a frozen contract.
  - >-
    Degree conventions for a non-radical ideal differ between engines; the
    comparison must be made on the radical or on the leading-monomial staircase,
    fixed in advance.

  interpretation_limits:
  - >-
    TOY SCALE, claim_tier toy, m = 3, f_V-free, one p, one class. NO ATTACK, NO
    EXPONENT, NO SPEEDUP; sota_delta zero.
  - >-
    A confirmation of (B) does NOT say Semaev geometry is an isogeny-class
    invariant. It says one contract's panel cannot see the difference. Those are
    different statements and conflating them is exactly the misuse
    EV-ICINV-6b6264 forbids for the S_4 multiset.
  - >-
    H-ENDO-001 used, not retested. KN-FIND-b7e091 binding and unrevisited. P2
    respected: no equivariant factor base, no phi-stable structure, so nothing
    bears on H-STR-002 in either direction.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      The graded Betti table of the m = 3 f_V-free Jacobian ideal over F_p is a
      function of the F_p-isomorphism class of the singular subscheme, hence of
      the splitting type of f, uniformly over the parameter space away from
      4a^3 + 27b^2 = 0.
    rigorous_support: >-
      No theorem is claimed. The rigorous ingredient is one-directional: Betti
      numbers ARE determined by the ideal, and the ideal's only curve-dependent
      input is f, so any dependence beyond the splitting type must come from the
      F_p-arithmetic of the roots rather than from their pattern. The
      distribution this imitates is the standard expectation that homological
      invariants of a family are constant on strata of the discriminant
      stratification -- an expectation, not a theorem, and the reason the Betti
      half of (B) is labelled conjecture.
    validation_plan: >-
      Sample 12 curves stratified by splitting type from the committed class,
      plus 12 matched curves from other traces, and compare Betti tables within
      and across strata. Predicted: zero within-stratum variation, nonzero
      across. Tail check: include the two extreme members by j-height and by
      coefficient sparsity, since a degeneration, if any, is likeliest there.
      Scale and transfer are stated explicitly -- p = 4001 only, and no claim is
      made for any other p.

  target_complexity:
    time_exponent: >-
      No attack exponent claimed or moved. Stage 1 is one parametric Groebner
      computation; Stage 2 is 138 zero-dimensional solves, each seconds; Stage 3
      is 24 minimal free resolutions, each seconds to minutes at this size.
    memory_exponent: >-
      Under 1 GB for every stage at p = 4001, m = 3.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006), against which
      nothing here competes.
    hidden_overhead: >-
      Stage 3 hides an infrastructure dependency, not a mathematical one, and it
      is named rather than absorbed: without Macaulay2 or standalone Singular,
      Betti results are exploratory by the campaign's own standing rule.
    tradeoff_note: >-
      Not applicable; no search and no memory-time interpolation is proposed.

  dominated_by: >-
    As an attack: dominated by the full frontier, since no attack is claimed --
    parallel rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006),
    its automorphism-discounted variant (KN-TECH-018), and BSGS at sqrt(N)
    time and memory (KN-TECH-031). As an analysis of the paused contract:
    dominated by nothing committed, because no record states the singular-locus
    identity.
  sota_delta: >-
    Zero on every attack axis. Against campaign planning: it can retire or
    re-motivate a paused infrastructure acquisition at a cost of one parametric
    Groebner basis.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that (A) is exact. 0.5 that the discrete invariants take exactly two
    values on the class. 0.35 that the Betti table also collapses to two values;
    this is the genuinely uncertain half, and it is the half whose FAILURE is
    the more valuable outcome. 0.00 that any of it moves an exponent.

  source_refs:
  - ledger/evidence/EV-ICINV-6b6264.yaml
  - ledger/decisions/DEC-20260810-d70ece.yaml (D1 backend gate; NA7 successor
    requirements; the msolve degree demonstration)
  - ledger/corrections/CORR-20260810-eb9062.yaml (affine vs homogenised singular
    locus)
  - ledger/proposals/IDEA-20260807-8027a2.yaml (the discriminant identity)
  - ledger/proposals/IDEA-20260811-245481.yaml (the splitting-type prediction
    this record conditions on)
