idea:
  id: IDEA-20260905-ed9cf7
  title: Interaction-curvature certificate for a quantum cost-model disagreement
  class: representation
  claim: Mixed finite differences of a log-cost function can determine whether a small disagreement kernel is stable
    under changing the common baseline, or whether oracle-memory interactions make one-switch attribution intrinsically
    misleading.
  mechanism: Treat each admissible published model as a vertex in a finite switch lattice. Edge differences measure
    individual effects; alternating sums on two-dimensional faces measure interaction curvature. If every face residual
    vanishes, edge effects integrate to a baseline-independent additive decomposition. Nonzero residuals identify
    the minimum coupled switch blocks that must be reported together. The proposed object is therefore the interaction
    hypergraph, not a ranked sensitivity list. Paper-defined constraints may remove vertices; cycles that cross
    inadmissible settings are excluded rather than filled by guesses.
