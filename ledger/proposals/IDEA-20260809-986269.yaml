idea:
  id: IDEA-20260809-986269
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    A switchable reference implementation whose honest path is proved correct
    first — the precondition without which every later "attack" is a bug report
  class: tooling
  claim: >-
    The dominant failure mode for this goal is manufacturing attacks out of one's
    own implementation defects. The claim is that a reference threshold ECDSA
    implementation with every zero-knowledge proof independently switchable can be
    built, that its honest path can be validated to a declared standard —
    signatures verifying under a stock verifier, across party counts, thresholds
    and adversarial-but-honest orderings — and that this validation must precede
    the first attack by construction rather than by intention.
  mechanism: >-
    Implement signing with each auxiliary proof behind a flag and each proof's
    parameters exposed. Validate the honest path over a matrix of party counts and
    thresholds, with signatures checked by an independent verifier, and gate the
    attack code on the validation suite passing.
  why_not_a_renamed_known_approach: >-
    Reference implementations exist. Building one whose PROOF SET is the
    experimental variable, and whose attack surface is gated on honest-path
    validation, is what makes the goal's fix map a measurement rather than a
    collection of anecdotes.
  predictions:
  - observable: honest-path signature validity across the configuration matrix
    metric: fraction verifying under a stock verifier
    predicted: One. Anything less blocks all attack work until resolved.
  - observable: number of configurations where honest signing succeeds but a proof is disabled
    metric: count
    predicted: >-
      Most of them, which is precisely the danger. Disabling a proof usually does
      not break functionality, so functional testing cannot find these defects.
  minimal_test: >-
    Validate honest signing across at least three party counts and two thresholds,
    with every proof enabled and with each individually disabled, recording
    signature validity per configuration.
  controls:
  - 'STOCK-VERIFIER CONTROL: signatures verified by an implementation not written for this goal.'
  - 'DETERMINISTIC REPLAY: every session replayable from its seed, since an attack that cannot be replayed cannot be verified.'
  falsification_conditions:
  - Honest signing fails in any configuration with all proofs enabled.
  - Sessions are not deterministically replayable, which blocks certificate verification later.
  interpretation_limits: >-
    A correct reference implementation is infrastructure, not a result. It makes
    no statement about any published protocol or deployed system.
  sota_delta: 'No attack. Delta: the precondition that separates this goal''s findings from its own bugs.'
  dominated_by: Not dominated by any corpus record; gates every other record in the goal.
  estimated_cost: Implementation high; compute low.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for threshold ECDSA: no records. WEB NOT CHECKED.'
  source_refs:
  - Threshold ECDSA protocol specifications -- REQUIRED READS, NOT YET READ.
