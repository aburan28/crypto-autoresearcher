  batch: EC-STRUCTURE-20260825
  cluster: 'C1-frame: what an instance actually reveals'
  title: 'A CONCRETE FOUR-AXIS TRACKED-OBJECT TAXONOMY FOR THE ECDLP, WITH THE LEDGER''S OWN CLOSURES
    PLACED IN ITS CELLS: discharge KN-OPEN-019 by fixing the axes (arity, equivariance, value target,
    propagation mode), populating the grid, and naming the empty cells as the generator''s next candidate
    space'
  class: theory
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: KN-OPEN-019 states the need for such a taxonomy and says the program has none. The specific
    axis system proposed here is this record's contribution; whether it is the right axis system is exactly
    what review should attack.
  claim:
    semantic_part: ECDLP attack families can be indexed by four axes -- arity a (how many instance-derived
      points the object is a function of), equivariance E (which subgroup of the acting symmetries the
      object propagates compatibly under), value target V (where it takes values), and propagation mode
      M (deterministic, one-sided, probabilistic) -- and the ledger's existing closures occupy identifiable
      cells of that grid rather than an unstructured list.
    evaluator_part: 'Unestablished: that the four axes are sufficient, that the placement is unambiguous,
      and above all that the grid is CLOSED. A populated grid with empty cells is a generator, not a closure,
      and this record claims only the former.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Axis a (arity): 0 (curve-level invariants), 1 (functions of one point), 2 (pairs), m (tuples, the
    index-calculus regime), infinity (whole-orbit or distributional objects).'
  - 'Axis E (equivariance): the acting group is generated by translations T_R, inversion [-1], Aut(E),
    F_p-isogenies, and the instance action AGL(1, N). Record which subgroup the object propagates compatibly
    under.'
  - 'Axis V (value target): F_p or a field element, Z or a height, a lattice or module, a subspace or
    point of a Grassmannian, a set or subset, a probability distribution.'
  - 'Axis M (propagation): deterministic, one-sided (containment or bound only), probabilistic (a distribution
    that propagates).'
  - 'Populate: rho = (a=1, E=T, V=set, M=deterministic); index calculus = (a=m, E=none, V=Z^B, M=one-sided
    via smoothness); the rigidity closure = the whole cell (a=1, E=full T, M=deterministic); the GGM closures
    = every cell whose object is computable from the group-operation transcript; Betti-Yield = (a=m, V=chain
    complex).'
  - Report the empty cells explicitly. Empty cells with no closure attached are the generator's candidate
    space and the honest answer to 'is the space saturated'.
  lossy_projection_test:
    tracked_object: the taxonomy is about tracked objects; it is not itself one
    what_is_discarded: null
    propagation: null
    verdict: N/A -- meta-level record.
  predictions:
  - id: P1
    status: unestablished
    statement: Every ECDLP attack family named in this ledger places into exactly one cell without ambiguity.
  - id: P2
    status: unestablished
    statement: At least three cells are empty of both mechanisms and closures.
  - id: P3
    status: unestablished
    statement: The program's prior saturation conclusions cover strictly fewer cells than the grid contains,
      so those conclusions remain 'unverified' under the inventor protocol's closure standard.
  minimal_discriminating_test:
    status: specified_not_run
    test: Two independent readers place the same twelve named families into cells without conferring;
      agreement is measured.
    pass: Agreement on at least ten of twelve, and every disagreement resolvable by sharpening an axis
      definition rather than by adding an axis.
    fail: A family that needs a fifth axis, or two families that are indistinguishable in all four axes
      but genuinely differ, refutes the proposed axis system.
  controls:
  - Place three SYMMETRIC-side families (differential, integral, division property) into the same axes;
    if the axes cannot express the taxonomy that is known to work there, they are too weak.
  - Place one family the program has already closed and one it has never considered, to check the grid
    is not merely a restatement of the ledger.
  confounders:
  - Taxonomies are cheap to write and easy to over-fit to the records that prompted them; the symmetric-side
    control is what guards against that.
  - An empty cell may be empty because it is uninteresting, not because it is unexplored; each empty cell
    needs a one-line reason.
  - A grid can create a false sense of completeness -- the axes themselves are the unverified part.
  falsification:
    semantic: An ECDLP mechanism that cannot be placed, or two genuinely different mechanisms that place
      identically.
    evaluator: Low inter-reader agreement scopes out this axis system only, not the existence of a taxonomy.
    not_falsification: The grid having many empty cells.
  why_this_is_not_a_variant: IDEA-20260802-002 proposes tracked-object enumeration with an executable
    one-step propagation meter; that is the measurement side. This is the classification side and supplies
    the axes the meter would range over. The two are complementary and this record cites that one as its
    natural successor.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
  sota_delta:
    checked: true
    delta: No algorithmic improvement. Its value is that it makes any future closure statement checkable,
      which the inventor protocol says the program's current saturation claims are not.
    dominated_by:
    - Pollard rho on every realized end-to-end ECDLP cost in this ledger
    axes:
    - time
    - memory
    - preprocessing
    - queries
  estimated_cost: zero-run; a structured reading pass plus a two-reader agreement check
