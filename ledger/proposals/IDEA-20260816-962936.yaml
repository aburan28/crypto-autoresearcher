idea:
  id: IDEA-20260816-962936
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-16'
  title: 'Replace the dollar figure with an elasticity vector: build a cost model whose declared inputs
    are device price, device throughput, memory price, power and duty factor, compute each output''s
    partial elasticity to each input, and report which single input carries most of the variance instead
    of quoting a number.'
  class: tooling
  claim: '(A) A cost quoted in dollars is a function of at least five declared inputs evaluated at
    one hidden point. The defect RQ-SHAONE-081e3a exists to correct is not that the number is stale
    but that the FUNCTION was never written down, so no reader can re-evaluate it at their own point.
    Writing the function down is a tooling deliverable and costs no cryptographic compute at all.
    (B) Define, for each output O and each declared input x, the partial elasticity E(O,x) = (dO/O)/(dx/x)
    evaluated at a declared base point, and define the variance share of each input under a declared
    input-uncertainty distribution using a Sobol-style decomposition. The elasticity vector and the
    variance shares are the deliverable; the dollar figure becomes one evaluation of the function
    and is deliberately demoted. (C) The claim is that these quantities are computable, that they
    are stable under reasonable changes to the declared base point (which is itself the property that
    makes them worth reporting), and that a single input dominates the variance -- so that any dispute
    about a quoted cost is a dispute about that one input and can be argued about directly instead
    of through the total. (D) WHAT IS NOT CLAIMED: no cost figure for SHA-1 is produced or endorsed,
    no assertion that any published figure is right or wrong, no attack, and no security consequence.
    The model''s structural form is supplied by the near-collision-block cost decomposition proposed
    separately in this batch and is an input here, not a result. (E) A finding that NO single input
    dominates -- that variance is spread evenly across five inputs -- would be equally valuable and
    would say that cost quotation for this attack is intrinsically imprecise rather than merely stale.'
  mechanism: 'STAGE 1: declare the model''s structural form as a composition C = f(inputs) with every
    input named, dimensioned and given a base value and an uncertainty range with a stated provenance
    for each. Any input whose provenance is unavailable is marked as such and its range widened, never
    silently narrowed. STAGE 2: implement f as a pure function with no hidden constants, and check
    dimensional consistency mechanically so that a units error cannot survive. STAGE 3: compute analytic
    partial elasticities where f is differentiable in closed form, and finite-difference elasticities
    elsewhere, and cross-check the two wherever both exist. STAGE 4: run a Sobol variance decomposition
    over the declared input distributions, reporting first-order and total-order indices per input.
    STAGE 5: base-point stability -- repeat STAGES 3 and 4 at several declared base points spanning
    the plausible range, and report whether the elasticity ordering and the dominant input change.
    An ordering that flips under a modest base-point change is a finding about the model''s fragility
    and must be reported as one. STAGE 6: null control -- build a structurally scrambled model with
    the same inputs, the same dimensions and the same number of terms but randomly rewired composition,
    and run the identical elasticity and Sobol machinery, establishing what elasticity structure a
    model of the same SHAPE but no content produces.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a in full, whose constraint list requires the price of compute to
      be a declared input varied in sensitivity analysis rather than a folded constant, and GOAL-SHA1-001
      in full. Ran: grep -ril ''elasticity'' ledger/proposals (1 hit, read in full at title level);
      grep -ril ''sensitivity analysis'' ledger/proposals; grep -ril ''cost model'' ledger/proposals
      | wc -l (233, titles sampled); grep -l ''RQ-SHAONE'' ledger/proposals/*.yaml (zero). Read knowledge/literature/KN-LIT-91b680.md.'
    results: 'Exactly one proposal uses the word elasticity: IDEA-20260809-5a9246 under RQ-QRE-6dba8c
      and GOAL-QRE-001, titled around the physical error rate entering through the code distance quadratically
      and measuring the elasticity of every output to that one number. That is the closest methodological
      relative in the repository and the framing is deliberately borrowed and named here. Its object
      is a quantum resource estimate; this one''s object is a symmetric collision cost model, and
      the two share no input, no structural form and no base point. Zero proposals target RQ-SHAONE-081e3a,
      and the 233 cost-model proposals are dominated by ECDLP and program-self-audit records under
      RQ-INSTR-f8faa0.'
    verdict: 'UNVERIFIED. No assertion is made about whether elasticity or Sobol decomposition has
      been applied to hash collision costs in published work; sensitivity analysis is a standard technique
      and it may well have been. What is claimed new is narrow and internal: this repository applies
      elasticity to exactly one cost model (IDEA-20260809-5a9246, quantum resource estimation) and
      nowhere to a symmetric attack cost, and the structurally scrambled null model is a control that
      record does not carry. Assembled from known parts: standard variance decomposition, that record''s
      framing, and the RQ''s own binding constraint that price be a declared and varied input.'
  object_first_candidate:
    tracked_object: 'The dimensioned input vector together with its uncertainty range: each declared
      input carried as (name, unit, base value, range, provenance), followed through the model as
      the elasticity of each output with respect to it. What is followed is not a cost but the SENSITIVITY,
      which is a different object of the same dimension count as the input vector.'
    lossiness: Genuinely lossy, though modestly. The elasticity vector discards the model's absolute
      output entirely, retaining only the local logarithmic derivatives; two models with wildly different
      totals and identical elasticity vectors are indistinguishable under the projection. It is compatible
      with the operation because elasticities compose multiplicatively through a chain of functions,
      so the retained vector propagates through model composition without the totals. What is lost
      is exactly the dollar figure -- and losing it is the point, since the figure is the part that
      cannot be transported between readers with different price assumptions while the elasticity
      vector can.
    propagation: 'One step of the target operation is composing one more model stage onto the chain.
      Elasticities compose by the chain rule in logarithmic coordinates: E(O,x) for a composite is
      the sum over intermediate quantities of the product of stage elasticities. This makes the object
      propagate exactly and cheaply through any composition, and it is why a model expressed as a
      composition can have its sensitivity computed stage by stage rather than by brute-force resampling
      alone.'
    survival_score: 'The elasticity object survives as long as the model is locally smooth in its
      inputs. It dissolves at any input value where the model has a kink -- a max, a floor, a discrete
      device-count rounding -- because the elasticity is then undefined or discontinuous and the composition
      rule fails. Counting how many declared inputs place the base point near such a kink is a required
      metric and bounds the whole analysis: a model dominated by kinks cannot be summarised by elasticities
      at all, and that would itself be the reportable finding.'
  null_object_control: 'Structurally scrambled model: preserve the input names, units, base values,
    ranges and the number of composition terms, but rewire the composition randomly subject only to
    dimensional consistency, then run the IDENTICAL elasticity and Sobol machinery in the same invocation
    over at least 100 scrambles. The null must show a materially different distribution of variance
    shares -- in particular, if scrambled models also concentrate variance in one input at comparable
    rates, then dominance is a property of having one input with a wide declared range rather than
    a property of the model''s structure, and the signal arm''s dominance claim collapses to a statement
    about the declared ranges.'
  discriminated_from:
  - 'IDEA-20260809-5a9246 (elasticity of quantum resource estimates to the physical error rate through
    code distance): the acknowledged methodological ancestor, named here rather than reinvented in
    new notation; its object is a fault-tolerance resource estimate under RQ-QRE-6dba8c, its inputs
    are physical error rates and code distances, and it carries no structurally scrambled null.'
  - 'The near-collision block cost decomposition proposed separately in this batch: that derives the
    model''s structural form C(k); this proposal takes a structural form as an INPUT and never derives
    one, so the two must be sequenced and neither may cite the other''s output as its own evidence.'
  - 'RQ-INSTR-f8faa0''s cost-model and machine-variance audits: those audit this program''s own instrument;
    this builds a transportable sensitivity object for an external cost model and asserts nothing
    about the program''s own timings.'
  - 'Restating a published dollar figure with an updated price: that is one re-evaluation at one new
    hidden point; this produces the function, its elasticities, its variance shares and its base-point
    stability, so that any reader can re-evaluate at their own point without asking anyone.'
  - 'RQ-RSA-afe33c''s memory-charged factoring baseline: shares the charging philosophy and the discipline
    of isolating price as a declared input, but its object is factoring and it fixes a charging convention
    this proposal binds to rather than duplicates.'
  assumptions:
  - The model's structural form is supplied from elsewhere and is not validated here; if the form
    is wrong, every elasticity is a correct sensitivity of a wrong model, and the record must say
    so rather than inherit credibility.
  - Declared input ranges have stated provenance, and inputs whose provenance is unavailable get widened
    ranges rather than convenient point values.
  - Local smoothness holds at the declared base points for most inputs; the kink count is the check
    on this.
  - Sobol indices computed over declared marginal distributions are meaningful even though real input
    uncertainties may be correlated; correlation is not modelled and this is stated as a limitation,
    not hidden.
  - Dimensional consistency checking is sufficient to catch unit errors, which are the dominant silent
    failure in cost models.
  predictions:
  - metric: share of total output variance attributed to the single highest total-order Sobol index
    direction: higher
    minimum_effect: 0.4
  - metric: stability of the elasticity ordering across declared base points
    direction: different
    minimum_effect: 'predicted invariant: the top-ranked input is the same at every declared base
      point. A flip is a reportable fragility finding, not a failure of the experiment.'
  - metric: top-input variance share in structurally scrambled null models relative to the real model
    direction: lower
    minimum_effect: 1.5
  - metric: count of declared inputs whose base point lies within one range-width of a model kink
    direction: lower
    minimum_effect: 2
  minimal_test:
    design: 'The cheapest discriminating run is the null arm first, and it needs no cryptography and
      almost no compute. Implement the model as a pure dimensioned function, then generate 100 structurally
      scrambled variants preserving inputs, units and term count, and run the identical Sobol decomposition
      on all 101 models. Compare the real model''s top-input variance share against the scrambled
      distribution. This costs an afternoon of implementation and minutes of compute, and it settles
      the question that determines whether an elasticity report means anything: does structure drive
      the variance concentration, or do the declared input ranges drive it? If the scrambled models
      concentrate variance just as sharply, then dominance is an artifact of range declaration and
      the honest deliverable shrinks to a statement about ranges -- which is still worth having and
      still corrects the practice the RQ objects to, but must not be dressed up as a structural finding.'
    controls:
    - 100 structurally scrambled models with matched inputs, units, base values, ranges and term count,
      same invocation.
    - Analytic versus finite-difference elasticity cross-check wherever both are computable.
    - Mechanical dimensional-consistency check over every term, run before any number is produced.
    - Multiple declared base points spanning the plausible range, with the elasticity ordering reported
      at each.
    - 'Range-widening control: rerun with every input''s range doubled, to see whether the dominant
      input is dominant because of structure or because of a wide range.'
    required_metrics:
    - partial elasticity E(O,x) for every output-input pair, analytic and finite-difference where
      both exist
    - first-order and total-order Sobol indices per input
    - elasticity ordering at each declared base point
    - top-input variance share in the real model and its distribution over 100 scrambled nulls
    - count of inputs whose base point lies near a model kink
    - dimensional-consistency check result per term
  falsification_conditions:
  - Scrambled null models concentrate variance in one input as sharply as the real model, showing
    dominance is a property of declared ranges rather than structure.
  - The elasticity ordering flips across declared base points, showing the summary is not stable enough
    to transport.
  - Analytic and finite-difference elasticities disagree beyond tolerance anywhere both exist, showing
    an implementation error that voids the vector.
  - More than two inputs sit near kinks, so the model is not locally smooth enough for an elasticity
    summary at all.
  - Dimensional consistency fails on any term, halting the run until the model is corrected.
  confounders:
  - Declared input ranges determine variance shares almost as strongly as structure does, which is
    exactly why the scrambled null and the range-doubling control are mandatory rather than optional.
  - A model expressed in a particular algebraic arrangement can produce different finite-difference
    elasticities than an equivalent rearrangement if step sizes are chosen carelessly.
  - Correlated input uncertainties are not modelled and can redistribute real-world variance in ways
    Sobol indices over marginals will not show.
  - Base points can be chosen, consciously or not, at smooth regions that flatter the stability claim.
  interpretation_limits:
  - Every elasticity is the sensitivity of a model whose structural form this contract takes as given
    and does not validate; a correct sensitivity of a wrong model is worthless and the record says
    so.
  - No dollar figure produced by evaluating the function is endorsed, and none may be cited as this
    program's estimate of anything.
  - Sobol indices are computed over declared marginals and do not account for correlated uncertainty.
  - Nothing here says anything about SHA-1's security, about any detector, or about any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The deliverable is a sensitivity object over a cost
      model supplied from elsewhere.
    memory_exponent: No attack memory exponent is claimed. Memory price is one of the declared INPUTS
      to the model, which is a different thing from a memory exponent and must not be read as one.
    best_known: The incumbent is the practice of quoting a single dollar cost with its price assumption
      folded in, which RQ-SHAONE-081e3a names as the exact defect it exists to correct. No algorithm
      is beaten; a point estimate is replaced by a function, an elasticity vector and variance shares.
    hidden_overhead: Declaring each input's range with honest provenance is the real work and the
      place where a convenient narrow range can silently determine the answer. The scrambled-null
      generator must preserve dimensional consistency while genuinely rewiring the composition, which
      is fiddly and easy to implement in a way that produces near-copies of the real model. Base-point
      selection is a judgement call that cannot be fully automated.
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: the deliverable
    is a sensitivity object rather than an attack, so it places no point on any frontier and the single
    UNVERIFIED chosen-prefix cost row in RQ-SHAONE-081e3a lies on a disjoint axis set. Not null; inapplicable,
    and stated so.'
  sota_delta: no attack; conceptual/measurement contribution only. Quantitatively the repository moves
    from one inherited scalar carried at UNVERIFIED provenance to a pure dimensioned function with
    an elasticity per input-output pair, first- and total-order Sobol indices, an ordering at several
    base points, and a 100-model scrambled null distribution. There is no speed, memory or data comparison
    to state.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separable parts. (1) That the model can be implemented as a dimensionally
    consistent pure function with every input declared and provenanced: about 0.85, gated mainly on
    the structural form arriving from the companion proposal. (2) That the real model''s top-input
    variance share exceeds the scrambled null distribution materially: about 0.45 -- I genuinely expect
    declared ranges to explain a large part of variance concentration, and if they do, that is the
    useful finding. (3) That the elasticity ordering is stable across base points: about 0.6. (4)
    That fewer than three inputs sit near kinks, so the elasticity summary is well-defined: about
    0.7. Composite roughly 0.16; the minimal scrambled-null test alone sits near 0.45 and is worth
    running before anything else because it is nearly free.'
