    hidden_overhead: >-
      The oracle cost itself is the whole open quantity in the budget
      convention; theta and w are constants (H-621974-2, -3) moving the
      budget by at most 1 and 2.5 bits over their stated ranges; c_AS is a
      polynomial factor; nothing hides in an o(1).
    tradeoff_note: >-
      At exactly its budget the j = 2 row ties rho in time and loses in memory
      (a graph of 2^37.89 or more vertices against rho's O(1) per walk plus
      its distinguished-point table), so it is Pareto-dominated unless an
      oracle sits strictly below budget. Parallel relation collection is
      embarrassingly parallel; the graph merge needs a shared or sharded
      union-find, not analysed here.

