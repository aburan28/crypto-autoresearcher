  assumptions:
    - >-
      Costs in group-operation equivalents; the full-group ambient N = 4r
      (log2 N = 131.0000) unless the subgroup ambient is stated; matched rho
      2^60.8090 by CORR-20260922-81aeab.
    - >-
      Budget convention (claim C): one attempt is one oracle call on one
      random target; the oracle returns a partial with at most two large
      primes when one exists; its cost is a per-attempt budget to be met;
      per-target cap p_2 <= 1 (IDEA-20260926-4b65e3). This is the convention
      of the pinned D3 column, applied to the j = 2 row. It is a pricing
      convention, not a claim that any oracle meets the budget.
    - >-
      Unknowns count points: U = B for the j = 0 and j = 2 rows (the product
      law's convention). Folding signs halves U and moves T_1 by 0.5 bit;
      stated where used.
    - Single target throughout. Multi-target and preprocessing variants belong to the S1 lineage and are not proposed.
    - Executable work is toy-tier only (n = 17 and 19); deployed parameters are arithmetic only.
    - 'Off-limits components declared: F2 (family), F1 in claim (A), F6 only in conditional kappa = 262 variants.'

  proof_search_map:
    bottleneck: >-
      The per-attempt cost of an oracle for the asymmetric (m-2 small, 2
      large) decomposition system at the rebalanced point, against the
      budget column of claim (C): absolute at m = 3 (2^8.71 for a square
      132-unknown shape), relative at m = 4 (marginal cost per added unknown
      below s* = 0.672 bit beats the plain D3 row).
    baseline_embedding:
      parameter_slice: >-
        j = 0 (no large primes, B' = B): the budget expression reduces to
        max over B of (R - m B^2) B^(m-1) / (m! N), which must return D3 =
        2^11.01 at m = 4 (CORR-20260928-4cb669: 11.010251) and 2^-15.55 at
        m = 3 (IDEA-20260926-4b65e3: -15.6). The enumeration class with r =
        B'/262 must return 1db0e8's 2^124.0. The free-oracle j = 0 floor must
        return KN-FIND-aa2efc's 2^68.58 (m = 3) and 2^56.40 (m = 4).
      reproduction_check: >-
        Symbolic, done by hand in this record: D3(4) = 11.010253 (agrees to
        2e-6 with the pinned 11.010251); plain m = 3 best budget -15.552; 1db0e8
        line 123.967. A frozen fixture for the design: a Python cell computing
        all of claim (C)'s table from (R, N, m, theta, w) that must print these
        three values to 0.01 bit before any j = 2 value is read.
    observation_collision:
      observable: >-
        The budget column value, and at toy scale the pair (cyclomatic
        number, cycle-relation weight) of the large-prime graph at given
        (vertices, edges).
      distinct_preimage_search: >-
        The same budget is produced whether the 2LP shape is cheap or
        expensive for real solvers: the column cannot distinguish them, which
        is why the record claims only a requirement and names the oracle
        measurement (1db0e8 (D), the HOLD-X1 ladder, and the m = 3
        two-large-block extension) as the separating observation. At toy
        scale, a cycle count matching G(n, M) could come from genuinely
        random large-prime occupancy or from a toy graph too small to show
        structure; separated by sweeping V' (d' in three values), by the
        relabelled Z/(4r) replica of matched sizes, and by finite-size
        simulation of G(n, M) at the same (n, M) rather than the asymptotic
        formula.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The per-attempt budget family lifted from j = 0 (the pinned D3
          column) to j <= 2, with the j = 0 slice reproduced exactly.
        predicted_gain: >-
          A strict inward improvement of the budget at m = 3 (from 2^-15.55 to
          2^8.71) and m = 4 (from 2^11.01 to 2^22.34), paid for by square
          systems with 44.7 and 16.9 more unknowns and by a large-prime graph
          of 2^51.77 and 2^37.89 vertices; no gain at m = 5 (infeasible
          unconstrained optimum).
      - transform: observable_fiber
        proposed_object: >-
          Hold the row (j = 2, m, B, B') fixed and vary the oracle class:
          free-leg enumeration (closed, claim B), factorisation-type oracle
          independent of the large bound (the GTTD and Gaudry settings,
          gain), algebraic oracle with marginal cost s per added unknown
          (gain iff s < s* at m = 4).
        predicted_gain: Localises the whole large-prime column in one measurable oracle property.
    quantifier_order: >-
      FOR ALL m in {3, 4}, theta in [1/2, 1], w in [m, 32m], and B with B <=
      0.162 B' at the cap: the j = 2 per-attempt budget is at most the
      claim (C) maximum, attained at B^2 = (m-2) R / ((m+2) w). FOR ALL B, B',
      m and FOR ALL oracles in the enumeration class: total >= 2 r N
      C_2(B')/B'^2 (claim B). NOT CLAIMED: EXISTS an oracle meeting any
      budget; any bound for algebraic oracles; any m >= 5 value.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under the product-law convention with the per-target cap, the
        double-large-prime row on ECC2K-130 leaves per-attempt budgets of
        2^8.71 (m = 3) and 2^22.34 (m = 4) for square systems of 132 and 133
        Boolean unknowns, against plain budgets of 2^-15.55 and 2^11.01; in
        the enumeration class every large-prime row is above matched rho; and
        at toy scale the j = 2 graph's cycle yield and weight match the
        random-graph model within the stated band." It can never certify that
        an oracle meets a budget, nor bound algebraic oracles.
      nearby_object_control: >-
        (i) The j = 0 slice, where the same expressions must reproduce D3
        and the m = 3 negative budget (a computation that produced a positive
        m = 3 budget at j = 0 would be wrong). (ii) m = 5, where the same
        argument must report infeasibility rather than a gain (a
        proves-too-much control on the rebalancing). (iii) The relabelled
        Z/(4r) replica in Stage 1, where the graph statistics must match the
        curve's or the excess is curve structure.
    proof_obligations:
      - claim: Claim (A) T_1 = sqrt(2 U N / kappa_r) and the gaps 1.17, 4.69, 5.19 bits plus 0.5 log2 U.
        responsibility: runtime
      - claim: Claim (B) cancellation to 2 r N C_2(B')/B'^2 and the values 123.97 and 132 + log2 theta.
        responsibility: correctness
      - claim: Claim (B) scope, that the line binds exactly the oracles whose per-target cost is at least the small-tuple loop times C_2.
        responsibility: scope
      - claim: Claim (C) optimum B^2 = (m-2) R / ((m+2) w), R - w B^2 = 4R/(m+2), and the table values.
        responsibility: correctness
      - claim: The j = 0 slice reproduces D3 = 11.0103 and -15.55.
        responsibility: baseline
      - claim: Cap p_2 = 1 and B <= 0.162 B' hold at the m = 3 and m = 4 optima; infeasibility at m = 5.
        responsibility: feasibility
      - claim: H-621974-2 and H-621974-3 at toy scale (Stage 1).
        responsibility: success_probability
      - claim: Graph memory B' and matrix size B stated beside every time figure.
        responsibility: memory
      - claim: Nothing bounds an algebraic oracle; claim (D) is an inequality, not a verdict.
        responsibility: scope
    not_applicable_reason: null

