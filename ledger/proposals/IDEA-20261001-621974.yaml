  heuristic_assumptions:
    - id: H-621974-1
      statement: >-
        UNIFORM PARTIAL OCCUPANCY. For uniformly random targets the number of
        (m-2, 2) decompositions with small legs in F and large legs in F' is
        Poisson with mean p_2 = (B^(m-2)/(m-2)!) (B'^2/2) / N, and the large
        legs of the partials found are distributed over F' like independent
        uniform draws.
      rigorous_support: >-
        The MEAN is exact by double counting over all N targets (yield
        conservation, KN-FIND-007, typed form; also 1db0e8 H1). The Poisson
        shape and the independence of large legs imitate the classical
        occupancy law for independent uniform draws; the failure mode is
        concentration of sums of a structured subspace base on cosets (the
        parity factor of polynomial windows).
      validation_plan: >-
        SAMPLE: Stage 1, exhaustive per-target enumeration at m = 3, d = 4,
        d' in {7, 8, 9} (RC-1) and {8, 9, 10} (n = 19), 64 targets or more per
        cell. COMPARE: partials per target against p_2 (empirical mean and
        CDF of the per-target count against Poisson(p_2)); large-prime
        occupancy against Poisson(r/V') by chi-squared. TAIL: the
        most-occupied large prime against the Poisson maximum at the same
        (V', r). TRANSFER: only the mean transfers exactly to n = 131; the
        shape is assumed, and stated as such.
    - id: H-621974-2
      statement: >-
        RANDOM GRAPH. The uncanonicalised large-prime graph with V' vertices
        (plus one special vertex for single-large-prime partials) and r
        edges has cyclomatic number as G(V', r), so that about B independent
        cycle relations arise from r = theta V' edges with theta = 1 when B is
        about 0.162 V' and theta near 1/2 when B is much smaller than V'.
      rigorous_support: >-
        Erdos-Renyi component and excess asymptotics for G(n, M) (classical;
        recalled here, verified in Stage 1 by direct simulation rather than
        by citation). The heuristic is that edges drawn from curve partials
        behave like uniform random edges, which H-621974-1 implies if large
        legs are independent and uniform.
      validation_plan: >-
        SAMPLE: Stage 1 graphs at r/V' in {0.6, 0.75, 1.0, 1.5}, two cells,
        three d' each, plus the Z/(4r) replica. COMPARE: cyclomatic number
        against the finite-size G(n, M) distribution from 1000 simulations at
        the same (n, M). TAIL: largest component size against the same
        simulation. TRANSFER: the ratio measured / G(n, M) is transferred to
        V' = 2^37.89 to 2^51.77 as a constant only; it moves the budget by
        log2 of that constant.
    - id: H-621974-3
      statement: >-
        CYCLE WEIGHT. The mean weight w of the full relations produced from a
        cycle basis of the graph at r = theta V' lies in [m, 32 m] at the
        deployed graph sizes, and the linear-algebra cost is w B^2.
      rigorous_support: >-
        Fundamental cycles of a spanning forest of a supercritical random
        graph have length growing about logarithmically in the vertex count
        (recalled, classical); near criticality (theta near 1/2) cycles are
        longer, which is the GTTD weight penalty (recalled pointer). The
        sparse linear-algebra cost w B^2 is the product law's own model
        with m replaced by w.
      validation_plan: >-
        SAMPLE: Stage 1 fundamental-cycle weights at every (cell, d', r/V').
        COMPARE: mean and maximum weight against log2 V' (fitted slope with
        interval); extrapolate the fit to log2 V' = 37.89 (m = 4) and 51.77
        (m = 3) and check it stays below 32 m. TAIL: the heaviest cycle
        relation per graph. TRANSFER: the logarithmic growth law, stated as a
        heuristic; a super-logarithmic fit moves w outside the band and the
        budget is recomputed.

