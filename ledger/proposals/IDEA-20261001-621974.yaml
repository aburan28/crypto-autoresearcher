  title: >-
    THE GTTD DOUBLE-LARGE-PRIME FORM ON E(F_2^131) SUBSPACE FACTOR BASES,
    PRICED BY ORACLE CLASS: in the enumeration (free-leg) class that the
    superseded record lived in, every large-prime row is dominated by matched
    rho (single large prime at least 2^1.17 sqrt(U) above it, conditional;
    2^4.69 sqrt(U) unconditional; double large prime on IDEA-20260926-1db0e8's
    recomputed line 2^123.97 C_2(B')/B'); in the product-law convention where
    the oracle is charged as a per-attempt budget, the rebalanced
    double-large-prime row leaves 2^8.71 per attempt at m = 3 (plain row
    2^-15.55) and 2^22.34 at m = 4 (plain D3 2^11.01) for square systems of
    132 and 133 Boolean unknowns, so the large-prime column reduces to one
    measurable inequality on the oracle's marginal cost per large-block
    unknown (break-even 0.672 bit per unknown at m = 4)

  class: composition

  claim: >-
    SETTING. ECC2K-130, E: y^2 + xy = x^3 + 1 over F_2^131, #E = N = 4r with r
    the 129-bit prime 680564733841876926932320129493409985129, so log2 N =
    131.0000 to four decimals. Matched rho R = sqrt(pi r / (4 * 131)) =
    2^60.8090 (CORR-20260922-81aeab; KN-FIND-aa2efc). Small factor base F =
    {P : x(P) in V}, |F| = B about 2^l for an F_2-subspace V of dimension l;
    large base F' = {P : x(P) in V'}, V' a subspace containing V, |F'| = B'
    about 2^l'. Large primes are the points of F' outside F. A relation is
    collected per ATTEMPT, one attempt being one oracle call on one random
    target R_i = a_i P + b_i Q. A partial relation with j large primes has
    m - j legs in F and j legs in F'. Costs are in group-operation
    equivalents; the ambient is the full group N = 4r unless stated, the
    convention of KN-FIND-aa2efc and of the pinned D3 column of
    CORR-20260928-4cb669. Every number below is this record's hand
    arithmetic (no shell was available to this session); the worksheet lists
    the checks.

    (A) THE SINGLE-LARGE-PRIME FORM IN THE ENUMERATION CLASS (the superseded
    record's own construction, R3-a re-derived). The free-leg accumulator
    computes one residual per (m-1)-tuple and matches residuals by a
    canonical key. With residual classes S = N / kappa_r (kappa_r = 1 no
    folding, 2 sign-folded x-coordinate key, 262 for <sigma, -1> classes) and
    U factor-base unknowns, U matched pairs need T_1 = sqrt(2 U N / kappa_r)
    attempts and T_1 stored residuals. Against rho, T_1 / R = sqrt(4192 U /
    (pi kappa_r)): 2^4.69 sqrt(U) at kappa_r = 2 and 2^5.19 sqrt(U) at
    kappa_r = 1 (unconditional), 2^1.17 sqrt(U) at kappa_r = 262 (conditional:
    a Frobenius-matched residual yields a relation with lambda^i
    coefficients, valid only on the order-r part, and per-orbit framing is
    conditional under CORR-20260925-649e25). At U = B this is the ranker's
    A13 "about sqrt(N B), above rho by sqrt(B)", confirmed up to the stated
    constants and now derived in the record. At U >= 1 and every m the form
    is above R in time and holds about T_1 >= 2^61.98 stored residuals; the
    tuple supply B^(m-1)/(m-1)! >= T_1 only raises the bound (at kappa_r =
    262 and U = B: T_1 >= 2^74.90 at m = 4, 2^67.70 at m = 8, 2^65.93 at
    m = 13).

    (B) THE DOUBLE-LARGE-PRIME FORM IN THE ENUMERATION CLASS (R3-b, the
    IDEA-20260926-1db0e8 closure line recomputed). With per-target success
    p_2 = (B^(m-2)/(m-2)!) (B'^2/2) / N and a per-target oracle that loops
    over the B^(m-2)/(m-2)! small tuples and calls a two-large-leg sub-oracle
    of cost C_2(B') per residual, the total for r partials is r (1/p_2)
    (B^(m-2)/(m-2)!) C_2(B') = 2 r N C_2(B') / B'^2, independent of B and m.
    At 1db0e8's r = B'/262 (per-orbit graph, conditional under
    CORR-20260925-649e25) this is 2^132 C_2(B') / (262 B') = 2^123.97
    C_2(B')/B', reproducing 1db0e8's 2^124.0. Without the per-orbit framing,
    r = theta B' edges on B' vertices (H-621974-2) gives 2^132 theta
    C_2(B')/B'. Under 1db0e8's Artin-Schreier sub-oracle, C_2(B') = (B'/2)
    c_AS with c_AS the per-candidate cost (O(n) field operations per 1db0e8
    (B1), not re-derived here), the totals are 2^122.97 c_AS (gap to rho
    62.16 + log2 c_AS bits, conditional) and 2^131 theta c_AS (gap 70.19 +
    log2(theta c_AS) bits). SCOPE OF THIS LINE, stated by this record: it
    holds for every oracle whose per-target cost is at least the
    small-tuple loop times C_2, i.e. the enumeration class. In that same
    class the plain (j = 0) row is KN-FIND-aa2efc's product identity m
    2^131, so within the class large primes change no verdict: every row,
    with or without large primes, sits more than 60 bits above rho.

    (C) THE DOUBLE-LARGE-PRIME FORM IN THE PRODUCT-LAW CONVENTION (the GTTD
    rebalancing, adopted). Charge the oracle as KN-FIND-aa2efc and
    CORR-20260928-4cb669 D3 do: one attempt per oracle call, the oracle's
    cost a per-attempt BUDGET to be met, with the per-target cap p_2 <= 1
    (IDEA-20260926-4b65e3's mu <= 1 convention). Partials needed r = theta B'
    (H-621974-2, theta in [1/2, 1]); attempts A_2 = r / p_2 = 2 theta (m-2)!
    N / (B^(m-2) B'), decreasing in B', so B' rises to the cap B' = sqrt(2
    (m-2)! N / B^(m-2)) and A_2 = theta B'. Linear algebra after the graph
    merge costs w B^2 with w the mean weight of cycle relations
    (H-621974-3, w in [m, 32 m]). The per-attempt budget (R - w B^2) / A_2 is
    maximised at B^2 = (m-2) R / ((m+2) w), where R - w B^2 = 4R/(m+2). At
    theta = 1, w = m: m = 3 gives B = 2^28.45, B' = A_2 = 2^51.77, budget
    2^8.71, square system of l + 2l' = 132.0 unknowns; m = 4 gives B =
    2^28.61, B' = A_2 = 2^37.89, budget 2^22.34, square system of 2l + 2l' =
    133.0 unknowns. Sensitivity over theta in [1/2, 1] and w in [m, 32m]:
    2^7.46 to 2^9.71 at m = 3, 2^19.84 to 2^23.34 at m = 4. The plain row
    under the same convention, re-derived as the baseline slice: m = 3 best
    budget 2^-15.55 at B = 2^29.11 (87.3 unknowns; no positive budget, as
    4b65e3 states), m = 4 D3 = 2^11.01 at B = 2^29.04 (116.1 unknowns, p =
    2^-19.44), reproducing CORR-20260928-4cb669's 11.010251 to 1e-5. In the
    subgroup ambient N = r every double-large-prime budget rises by exactly
    1.00 bit (budget scales as N^-1/2) and every plain budget by 2.00 bits
    (scales as N^-1). The single-large-prime row in the same convention sits
    0.5 log2(m - 1) below the theta = 1 double row (2^8.21 at m = 3, 2^21.54
    at m = 4), so the GTTD form buys at most 0.79 + log2(1/theta) bits over
    j = 1 here (m <= 4); its decisive effect is the rebalancing against
    linear algebra that both share. At m = 5 the unconstrained optimum puts
    B' = 2^24.34 below B = 2^28.63, which is infeasible (H-621974-2 needs B
    <= 0.162 B'); the constrained optimum is not computed here and is a
    Stage 0 item.

    (D) THE ONE INEQUALITY THE COLUMN REDUCES TO. Outside the enumeration
    class the large-prime column is neither closed nor open on paper: it is
    a budget row. At m = 4 the double-large-prime row has more per-attempt
    headroom than the plain D3 row iff log2 C(2LP shape) - log2 C(D3 shape)
    < 11.33 bits, where the 2LP shape is square (blocks about 28.6, 28.6,
    37.9, 37.9; one expected solution) and the D3 shape is overdetermined
    (four blocks of about 29.0; p = 2^-19.44). Averaged over the 16.86 added
    unknowns this is a marginal oracle cost below s* = 0.672 bit per Boolean
    unknown. At m = 3 the requirement is absolute: an oracle for the square
    132-unknown shape at or below 2^8.71 group operations per attempt. This
    record claims NO oracle meets either requirement and claims no
    crossing: a budget is a specification, never a cost. It corrects the
    reach of two statements of its dominated_by input: 1db0e8 (B)'s sentence
    that an algebraic solve of the whole (m-2)+2 system is bounded below by
    the small-tuple loop is not established for algebraic oracles (applied
    to the j = 0 row the same sentence would close the pinned D3 budget,
    which the program treats as open), and 1db0e8 (C)'s dominance of every
    large-prime row by the cap-locus row under unknown-count-monotone solvers
    follows only for solvers whose average marginal cost over this range is
    at least s*, not from monotonicity alone. 1db0e8 itself names the
    unbounded case as its live question (D).

    WHAT IS CARRIED OVER FROM THE SUPERSEDED RECORD. The certificate-bearing
    constructive core (a residual match or a graph cycle yields a relation
    that re-sums to O exactly, zero tolerance), the honest engineering reason
    the binary lane never produced large primes (a SAT or Groebner UNSAT
    carries no group element; residuals exist only in the free-leg
    enumeration regime), the F2-not-F7 discrimination (the graph is consumed
    within one relation-collection sweep), and the adversarial
    canonicalisation control. What is dropped: the claim that recombination
    is "not present in this corpus under any name" (false: IDEA-20260731-012
    and IDEA-20260830-f2e5b7 predate it; see prior_art), and the dominated_by
    of "not applicable".

  mechanism: >-
    OBJECT FRAME. Representation: R1 (x-coordinates in a fixed polynomial
    basis, RQ-ECDLP-623a32), the tracked object being the partial relation
    (small-leg tuple, at most two canonicalised large primes, target
    coefficients). Operation set Sigma: combination of partial relations
    along a cycle of the large-prime graph (GTTD's operation; a pair sharing
    one large prime is the length-2 cycle, which is the superseded record's
    subtraction), with sign canonicalisation of large primes. Sigma is not
    the full translation action.

    TRICHOTOMY. Class I, partial-action (IDEA-20260806-c5d183): a partial
    relation propagates only under cycle combination with partials that share
    its large primes; whether a target yields a partial at all is the
    branching event priced by the budget of claim (C).

    LOSSY-PROJECTION TEST AGAINST THIS SIGMA (algebraic, no compute). The
    projection is pi: partial relation -> its multiset of canonical large
    primes (the edge it contributes). It discards the small legs and the
    target coefficients. It is Sigma-compatible: whether a set of partials
    combines into a full relation is decided by pi alone (the edges form a
    cycle), and the combined relation is recovered by summing the discarded
    parts along the cycle. It is lossy: the fibre over one edge is every
    partial with those two large primes. It PASSES, as for the superseded
    record and for 1db0e8. Passing it does not price anything: the cost sits
    in the attempts per partial and in the oracle that finds a partial, which
    the projection does not see; that is why the record is a pricing by
    oracle class and not a new object.

    WHY THE GTTD GAIN EXISTS IN ONE CLASS AND NOT THE OTHER. In
    KN-LIT-164 / KN-LIT-92caf4 (hyperelliptic, abstract-level in the corpus)
    and in Gaudry's E(F_q^n) attack (KR-IC-46d822), the decomposition oracle's
    cost does not grow with the large-prime bound, so enlarging the large
    base raises the partial rate for free and the linear algebra stays on the
    small base; that is the rebalancing. On a binary subspace base the
    enumeration oracle's cost grows with the large base (1db0e8 (B1): C_2 =
    (B'/2) c_AS), which cancels the gain exactly as the m 2^131 identity
    cancels the plain row's. For an algebraic oracle on the asymmetric
    system the dependence on the large blocks is unknown; claim (C) converts
    that unknown into a budget, and claim (D) into one inequality. Large
    primes do not change the arity: the decomposition is still of R into m
    points; they change which subspace the last two points live in, and
    hence the shape of the descended system.

    KN-OPEN-020 CLASS DECLARATION. No new factor base is proposed. V and V'
    are F_2-subspaces (the scoped class: description O(l'), membership one
    linear test). The large base of claim (A) at kappa_r <= 2 may be the
    whole group (membership vacuous). Frobenius-stable subspaces of useful
    dimension do not exist at n = 131 (ord_131(2) = 130; analysis README
    section 2), so the per-orbit (kappa = 262) readings are carried only as
    conditional variants.

    OFF-LIMITS COMPONENTS USED, NAMED. F2 (factor-base decomposition) is the
    family and the large-prime graph is its own relation-collection
    accountancy; F1 (collision search) appears in claim (A), where the
    whole-group single-large-prime accumulator is a collision search and the
    generic bound applies (KR-RHO-13bf67); F6 (Frobenius orbit) appears only in
    the conditional kappa_r = 262 variant. F7 (preprocessing advice) is not
    used: the graph is consumed within one single-target relation-collection
    sweep.

