  minimal_test:
    design: >-
      DISCRIMINATES BETWEEN TWO EXPLANATIONS of HOLD-X12's open question
      (does any large-prime variant survive against matched rho on a binary
      row). E1: 1db0e8's closure is oracle-class-general, so the
      large-prime column closes for every oracle. E2: 1db0e8's closure is
      enumeration-class-scoped, and in the product-law convention the j = 2
      row carries a positive budget at m = 3 and a budget 11.3 bits above D3
      at m = 4. STAGE 0 (zero compute, the minimal test): a blind
      re-derivation, from the statement of claims A to C and the parameters
      alone, of T_1, the 1db0e8 line, the j = 0 fixture (D3 and -15.55),
      the j = 2 budget table at m = 3 and 4 with theta in {1/2, 1} and w in
      {m, 32m}, both ambients, and the m = 5 infeasibility; plus a written
      check of whether any argument bounds every algebraic oracle for the
      2LP shape below by the small-tuple loop. E1 reads if the re-derived
      j = 2 budgets fall to or below the plain ones or if such a general
      bound is exhibited; E2 reads if the table reproduces within 0.05 bit
      and no general bound is found. STAGE 1 (toy, solver-free, minutes;
      validates the heuristics the table rests on): generate j = 2 partials
      by exhaustive enumeration at m = 3 on two cells, build the
      uncanonicalised large-prime graph, and measure cycle yield, cycle
      weight and partial yield against finite-size G(n, M) and a relabelled
      Z/(4r) replica. No oracle cost is measured here; the oracle-side
      measurement is named under next_gate and is sequenced after 1db0e8
      (D) and the HOLD-X1 ladder.
    stages:
      - id: stage-0
        what: Blind re-derivation of claims A to C and the general-bound check; the j = 0 fixture first.
        compute: none (a reviewer's arithmetic, or a 50-line Python cell written by the design)
        reads_first: the j = 0 fixture; no j = 2 value is read before it reproduces D3 and -15.55 to 0.01 bit
      - id: stage-1
        what: Toy j = 2 graph census on RC-1 and the n = 19 Koblitz cell, with the replica and finite-size G(n, M) simulation.
        compute: about 2^20 group additions per cell and arm, plus graph bookkeeping; minutes in pure Python
    cell:
      curve: >-
        RC-1 (RQ-CERTBIN-836ce2): n = 17, F_2[t]/(t^17 + t^3 + 1), A = 97044,
        B = 126251, #E = 4 * 32603 (analysis README section 5; recompute at
        setup). Koblitz n = 19: y^2 + xy = x^3 + 1 over F_2[t]/(t^19 + t^5 +
        t^2 + t + 1), #E = 4 * 130873 as stated in IDEA-20260926-1db0e8 and in
        the round-1 review (not recomputed here; recompute and prove the
        cofactor at setup).
      m: 3 (one small leg, two large legs), the j = 2 shape at the lowest arity
      l: >-
        Small V = {deg < 4}; large V' = {deg < d'} with d' in {7, 8, 9} on RC-1
        and {8, 9, 10} on n = 19 (V strictly inside V'); expected partials per
        target p_2 = B B'^2 / (2N), about 2^(2d' - 14) on RC-1 and 2^(2d' -
        16) on n = 19.
      factor_base: F = {x in V}, F' = {x in V'}, nested polynomial-degree subspaces; large primes F' minus F, sign-folded by x with the sign recorded.
      targets: >-
        Random R_i = a_i P + b_i Q in the order-r subgroup until the edge
        count reaches 1.5 V' (r/V' read at 0.6, 0.75, 1.0, 1.5); seeds
        enumerated and recorded.
      seeds: 0..63 per cell and d'; replica seeds 0..63; G(n, M) simulations 1000 per (n, M)
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py (field and group law; both import numpy, which is not installed per the analysis README; lift the scalar lines or install numpy as an environment fix, never as evidence)
      - 'NEW, about 200 lines: exhaustive (P_1, Q_1) enumeration per target with residual hashing into F'' by x, union-find with path compression, fundamental-cycle extraction and weight count, certificate re-summation, Z/(4r) replica, G(n, M) simulator'
      - 'missing: none for Stages 0-1 beyond numpy or the lifted scalar arithmetic'
    controls:
      - >-
        J0 FIXTURE (blocking, Stage 0). The j = 0 slice reproduces D3 =
        11.0103 and -15.55; the enumeration slice reproduces 1db0e8's 123.97.
      - >-
        PROVES-TOO-MUCH (Stage 0). At m = 5 the same argument must return
        infeasibility, not a gain.
      - RELABELLED Z/(4r) REPLICA (blocking, Stage 1) with random nested subsets of matched sizes; graph statistics must coincide with the curve's within [0.5, 2].
      - FINITE-SIZE G(n, M) SIMULATION at the same (vertices, edges), not only the asymptotic 0.162 n.
      - CERTIFICATE RE-SUMMATION of every cycle relation on a freshly built curve object, zero tolerance (docs/claims-and-verification.md).
      - TRUNCATED-KEY ADVERSARIAL CANONICALISATION (the superseded record's control); failure rate must be above 0.
      - ORDINARY (RC-1) AGAINST KOBLITZ (n = 19); a difference is reported as structure, not as a gain.
    required_metrics:
      - stage-0 table with every entry and its discrepancy against this record, per convention
      - partials per target against p_2, per cell, d' and arm
      - large-prime occupancy histogram and chi-squared against Poisson
      - cyclomatic number against finite-size G(n, M) mean and 5-95 percent band, at each r/V'
      - fundamental-cycle relation weight distribution, mean and maximum, against log2 V'
      - largest component size against G(n, M)
      - certificate pass rate; truncated-key failure rate
    outcomes:
      positive: >-
        (E2 with validated heuristics) Stage 0 reproduces the table within 0.05
        bit, no general bound on algebraic oracles is exhibited, and Stage 1's
        cycle yield, weight and partial yield sit inside their bands on both
        curves and the replica: the reachability table's large-prime column
        for ECC2K-130 is recorded as CLOSED in the enumeration class (claims
        A, B) and as a BUDGET ROW in the product-law convention (claim C) with
        the inequality of claim (D) as its decision quantity; the oracle-side
        measurement becomes the next design item.
      negative: >-
        (E1) Stage 0 finds an arithmetic or convention error that drops the
        j = 2 budgets to or below the plain ones, or a reviewer exhibits a
        lower bound on every algebraic oracle for the 2LP shape by the
        small-tuple loop: the column is closed for every oracle class with
        1db0e8's mechanism, and this record's claim (C) is withdrawn.
      mixed: >-
        Stage 0 reproduces but Stage 1 places theta or w outside its band:
        the budget row stands with the measured constants substituted (moved
        by log2 of the measured factor), and the transfer of those constants
        is stated as a heuristic.
      artifact: >-
        A j = 0 fixture miss, a certificate failure, a truncated-key arm with
        zero failures, or a replica that shows the same deviation as the
        curve: reported as a defect, nothing read.
    falsification_threshold: >-
