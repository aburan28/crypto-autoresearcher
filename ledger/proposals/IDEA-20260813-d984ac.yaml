idea:
  id: IDEA-20260813-d984ac
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  title: >-
    Public-projection survival audit: determine which sampler defects survive
    FN-DSA encoding and compression and which lie in an observational nullspace
  class: mechanism
  claim: >-
    Let pi be the deterministic public encoding and decoding map defined by the
    eventual primary FN-DSA specification, from an internal sampler transcript
    or lattice output to the transmitted and publicly reconstructible signature
    view.  For a preregistered defect score S on exact-versus-biased internal
    samples, the survival ratio
    eta = Var(E[S | pi(output)]) / Var(S) lies in [0,1] and quantifies how much
    of that score is observable after projection.  Matched planted defects can
    be constructed with eta exactly zero and with eta bounded away from zero on
    a toy encoder, proving that an internal sampler deviation is neither
    automatically invisible nor automatically exploitable.  The audit would
    classify defect modes before any signature-count or trapdoor claim.  No
    standardized encoder was read and no eta value is observed here.
  mechanism: >-
    Deterministic post-processing obeys data processing:
    d_TV(pi(P),pi(Q)) <= d_TV(P,Q).  More sharply for a square-integrable local
    score S with zero exact-null mean, its publicly visible component is the
    orthogonal projection E[S | sigma(pi)] and its invisible component is the
    residual S-E[S|pi].  The variance ratio eta is a normalized identifiability
    measure.  Two internal distributions in one encoder fiber collide exactly
    at the public view and have eta zero for their antisymmetric score.  A
    defect that changes mass between distinct public outputs can have positive
    eta.  Estimating eta on an exactly enumerable toy encoder, then bounding it
    for frozen defect bases, prevents later experiments from calibrating power
    against a signal the signature format discards.  The encoder and any public
    reconstruction are treated as black-box primary-specification functions;
    this proposal does not rely on recalled FN-DSA field layouts.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-010 asks whether a whole-signature GOF rejects but does not
    audit whether its chosen statistic is in the image of an internal defect.
    IDEA-20260805-2bbfb2 identifies an internal leaf-normalizer score that is
    not attacker-computable; this proposal provides a general observable-fiber
    test for exactly that gap but does not rederive the theta channel.
    IDEA-20260813-d50a10 localizes path mismatches; this proposal instead
    studies the quotient induced by public encoding even when the internal
    distribution is known.  Moment/homotopy, BBP, key-shape and exact-null
    construction neighbors do not classify encoder fibers.
  predictions:
    - observable: exact-null score projection
      metric: null_eta_and_public_distance
      predicted: exactly zero score mean and zero public distance for identical exact distributions
    - observable: within-fiber planted mass swap
      metric: invisible_control_eta
      predicted: exactly 0 by finite enumeration because the public law is unchanged
    - observable: across-fiber planted mass swap
      metric: visible_control_eta
      predicted: >-
        Strictly positive and equal to the finite conditional-expectation value
        computed from the frozen toy law before sampling.
    - observable: defect-basis survival spectrum
      metric: singular_values_of_projection_operator
      predicted: >-
        Values lie in [0,1]; exact zero singular values correspond to an
        observational nullspace and nonzero values rank publicly testable defect directions.
  minimal_test:
    design: >-
      After filing the primary signature encoder and decoder, construct a toy
      finite sampler output space with exact probabilities and apply the exact
      encoder.  Freeze an orthonormal basis of defect scores before treatment.
      Compute conditional expectations and the full projection matrix by exact
      summation.  Run identical sampling code only as a verification of the
      exact calculation: exact null first, a within-fiber invisible planted
      defect second, an across-fiber visible planted defect third, and then a
      finite basis representing candidate rounding, rejection and correlation
      errors.  Report eta, public total variation and sampling power separately.
    test_boundary:
      instances: exactly enumerable toy sampler and encoder only
      parameters: frozen finite support, encoder slice and defect-score basis
      oracle_model: local exact sampling; only transmitted/publicly reconstructed fields may enter visible statistics
      preprocessing: exact fiber enumeration and projection-matrix construction, fully charged
      stopping_rule: >-
        Stop if the invisible control yields nonzero exact public distance or
        if the visible control is not detected at its precomputed power.
    required_metrics:
      - exact encoder-fiber sizes and probability masses
      - exact and empirical eta for every defect-basis vector
      - exact public and internal total variation for both planted controls
      - projection singular values and explicit nullspace basis
      - false-positive rate, power, sample count, time, memory and preprocessing
  controls:
    - name: identical exact sampler through exact encoder
      kind: exact_null
      construction: same exact internal distribution and encoder in both arms
      forced_value: internal distance, public distance and every visible score difference are exactly zero
      gate: any nonzero exact value or excess false-positive rate invalidates the projection implementation
    - name: across-fiber probability transfer
      kind: biased_positive
      construction: >-
        Transfer rational mass h between two internal outputs whose public
        encodings differ, preserving total mass and all unrelated probabilities.
      forced_value: public total variation equals |h| on the two-point toy control
      gate: >-
        The visible statistic must recover the exact effect and preregistered
        power before a real defect direction may be called invisible.
    - name: within-fiber probability transfer
      kind: invisible_positive_control
      construction: >-
        Transfer the same rational mass h between two distinct internal outputs
        with identical public encoding.
      forced_value: internal total variation |h| and public total variation exactly zero
      gate: >-
        Any public detection is an artifact; the control establishes the
        method's ability to distinguish absence of visibility from absence of defect.
  confounders:
    - >-
      The public view may include values reconstructed from the message and
      public key, not merely transmitted bytes.  Omitting any legitimate public
      reconstruction can create a false nullspace.
    - >-
      A chosen defect-score basis may miss the actual implementation error;
      zero eta for the basis is not zero eta for all possible defects.
    - >-
      Conditional expectations estimated from finite samples are biased upward
      by model fitting; the exact finite control and sample splitting are mandatory.
    - >-
      Compression decoding failures, rejection and invalid encodings must be
      assigned explicit public outcomes rather than silently discarded.
    - The standardized encoder and scheme component claims remain unverified.
  falsification_conditions:
    - The within-fiber planted control changes the exact public law.
    - The across-fiber control has eta zero or misses its preregistered detection power.
    - Any computed projection singular value lies outside [0,1] beyond exact-arithmetic identity.
    - >-
      Sample-split eta estimates fail to converge to exact toy eta with the
      preregistered rate, invalidating the proposed empirical estimator.
    - >-
      The filed primary encoder admits additional public reconstruction absent
      from pi; all previous nullspace classifications are then void.
  interpretation_limits:
    - No standardized signature format or implementation was analyzed in this task.
    - >-
      Eta measures survival of one declared score under one declared public
      projection; it is not mutual information about the trapdoor and not a recovery probability.
    - >-
      Eta zero closes only that score direction and encoder slice.  Nonlinear
      combinations, message conditioning and other defect bases remain open.
    - >-
      Eta positive establishes observability, not cryptographic usefulness;
      signature-count, memory, preprocessing and certified recovery remain separate gates.
    - Timing, faults, private traces and deployed systems are out of scope.
  assumptions:
    - >-
      The primary specification defines deterministic encoding, decoding and
      public reconstruction for every valid and invalid internal output considered.
    - >-
      Exact toy probabilities and encoder fibers can be enumerated without
      truncation; larger slices require separately bounded tails.
    - The defect basis is fixed before any candidate implementation output is inspected.
  heuristic_assumptions:
    - id: HEUR-D984AC-1
      formal_statement: >-
        A finite preregistered basis consisting of width, rejection-boundary,
        table-cell and sibling-correlation score directions spans at least half
        of the squared local score norm of realistic toy implementation defects.
      rigorous_support: >-
        Orthogonal projection gives an exact decomposition once the basis is
        fixed, but coverage of real defects by that basis is unproved.
      validation_plan: >-
        Plant held-out composite defects not used to construct the basis and
        report the captured score-norm fraction under exact toy enumeration.
      falsification_condition: median captured squared norm below one half over the frozen held-out set
    - id: HEUR-D984AC-2
      formal_statement: >-
        Cross-fitted empirical conditional-expectation estimates recover each
        exact toy eta within absolute error 0.05 using the preregistered sample budget.
      rigorous_support: >-
        Finite-support concentration applies after sample splitting; cell
        rarity and fitted-model approximation determine the actual rate.
      validation_plan: >-
        Compare exact enumeration with repeated cross-fitted estimates on the
        null, visible, invisible and mixed planted controls.
      falsification_condition: simultaneous absolute error exceeds 0.05 for any preregistered control
  proof_search_map:
    bottleneck: >-
      Determining whether an internal sampler deviation induces any publicly
      observable signature-law deviation after deterministic encoding,
      compression and reconstruction.
    baseline_embedding:
      parameter_slice: identical internal exact laws passed through the same finite encoder
      reproduction_check: exact enumeration gives zero internal and public difference and eta zero by convention
    observation_collision:
      observable: transmitted plus publicly reconstructible signature view pi(output)
      distinct_preimage_search: >-
        Enumerate two distinct internal outputs in one encoder fiber and plant
        opposite mass changes; this is the required collision and exact invisible control.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: encoder fibers with exact conditional probability mass
        predicted_gain: explicit visible and invisible defect decomposition
      - transform: representation_reduction
        proposed_object: conditional-expectation projection matrix on a finite defect basis
        predicted_gain: ranks defect modes by publicly surviving score energy
    quantifier_order: >-
      For every defect score in the basis fixed before candidate data, compute
      eta under each frozen exact key/input distribution; a score or basis may
      not be chosen after observing which public statistic is large.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact visibility or invisibility for a finite score basis and toy
        encoder, plus scoped empirical estimates for the same declared objects.
      nearby_object_control: >-
        Within-fiber and across-fiber mass transfers have identical internal
        total variation but public distances zero and |h|; any method unable to
        distinguish them has no projection-identifiability content.
    proof_obligations:
      - claim: pi includes every transmitted and publicly reconstructible value
        responsibility: interface
      - claim: conditional expectation is the L2-optimal public score projection
        responsibility: correctness
      - claim: exact fiber enumeration includes invalid/rejected outcomes and tail mass
        responsibility: scope
      - claim: eta estimator uses independent fitting and evaluation samples
        responsibility: success_probability
      - claim: fiber enumeration and projection costs are charged
        responsibility: runtime
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed.  Exact finite audit costs O(KM), for K
      defect scores and M internal states, plus projection linear algebra; any
      empirical detector cost is reported as samples per frozen effect size.
    memory_exponent: >-
      O(M) for explicit fibers or O(FK) for F public fibers with streaming
      sufficient statistics; exact enumeration may dominate memory.
    best_known_baseline: >-
      IDEA-20260801-010's whole-signature GOF and IDEA-20260805-2bbfb2's
      internal normalizer score.  The former assumes a usable public statistic;
      the latter explicitly lacks one.  This proposal audits that interface.
    hidden_overhead_disclosure: >-
      Fiber enumeration, rare invalid outputs, public reconstruction, score-
      basis selection, sample splitting and exact rational bit growth are charged.
    time_memory_tradeoff: >-
      Store all internal-to-public mappings for one-pass exact projection, or
      stream and recompute scores to reduce memory at additional time.
    data_queries: local exact samples only; no victim or deployed oracle
    preprocessing: exact encoder-fiber and score-basis construction, fully included
    oracle_model: public deterministic encoder/decoder and local sampler
    retry_success_accounting: >-
      No recovery or retry claim.  Detection power is conditional on eta and
      planted effect size and is separately preregistered.
  sota_delta: >-
    Quantitative contribution sought is a survival spectrum eta_j in [0,1]
    and an explicit nullspace basis, not a security speedup.  Attack time,
    memory and standardized signature-count delta are zero unless a later
    public statistic and certified recovery are supplied.
  dominated_by: >-
    n/a (no attack result claimed).  All internal FN-DSA frontier rows were
    checked: IDEA-20260801-010, IDEA-20260805-2bbfb2,
    IDEA-20260805-4a6dc7, IDEA-20260805-637a3b,
    IDEA-20260808-cb0828, IDEA-20260808-e7ba81,
    H-FNDSA-58b464 and H-FNDSA-6a9cbb.  This audit can cost more preprocessing
    and memory than streaming detectors and makes no data improvement.  None
    of those rows returns an exact public-projection nullspace or survival
    ratio, so none dominates on identifiability.  External Pareto status is unverified.
  estimated_cost:
    implementation: medium
    compute: medium
    data: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that the finite projection identity and planted controls work on an
    exact toy encoder; 0.55 that a compact defect basis is informative; unknown
    and intentionally unestimated whether any real standardized defect has
    positive reachable eta before primary sources and implementation evidence exist.
  novelty_status: unverified
  novelty_screen: >-
    Parent-supplied immutable retrieval receipts and current-tree screening
    covered the broad GOF, analytic normalizer, leaf test, moment homotopy,
    NTRU key shape, BBP detector and exact-null hypotheses.  No screened record
    contains a public-encoder fiber/nullspace audit.  The index is stale and no
    primary literature was checked, so novelty remains unverified.
  discriminated_from: >-
    Exact nearest neighbor IDEA-20260805-2bbfb2 derives a secret-frame internal
    likelihood channel and explicitly notes that its optimal statistic is not
    publicly computable.  This proposal neither repeats nor improves that
    derivation; it builds the general finite quotient test deciding which
    internal score components survive the public encoder.
