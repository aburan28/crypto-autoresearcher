idea:
  id: IDEA-20260828-b4e4ed
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  title: >-
    The unsigned-integer metric correlation ladder: does AES's linear
    diffusion leave a derivable residual correlation with the ORDINARY
    INTEGER byte-value metric (0-255 as unsigned integers), a representation
    no off-limits family or the program's already-closed AES-Mobius/
    cross-ratio lane treats as meaningful
  class: mechanism

  claim: >-
    For a fixed key K, round count r, input byte position i and output byte
    position j, sweep x over {0,...,255} as an ORDINARY UNSIGNED INTEGER
    (not a GF(2) vector, not a GF(2^8) field element) to get h(x) = output
    byte j of r-round AES_K with byte i set to x. For every unordered pair
    {x,x'} compute d_in = |x-x'| (integer absolute difference) and
    d_out = |h(x)-h(x')|. Define rho(r) = Pearson correlation between
    {d_in} and {d_out} over all C(256,2) = 32640 pairs. CLAIM: MixColumns'
    xtime (mult-by-0x02) is PROVABLY integer-doubling-compatible on the
    lower half of the byte range (for b < 128, xtime(b) = 2b exactly, as
    both a GF(2^8) product and an ordinary base-256 integer product, because
    the reduction polynomial is not invoked until the top bit is set) and
    departs from integer doubling by a FIXED XOR offset (0x1B) exactly when
    b >= 128. This gives a derived, checkable reason to expect rho to be
    measurably nonzero and analytically bounded away from the null
    immediately after ONE MixColumns application with no preceding S-box,
    discriminating between (H_lin) "a residual integer-metric correlation,
    structurally forced by xtime's partial agreement with integer doubling,
    is visible only before the next S-box scrambles it, and is at the exact
    null from round 1 of the standard cipher onward" and (H_flat) "the
    provably-real coincidence has no measurable footprint even in the
    MixColumns-only control reading" -- both outcomes are informative, since
    H_flat would itself be a real finding about how completely a single
    control-reading-level construction erases an algebraically genuine
    coincidence.

  object_first_candidate:
    tracked_object: >-
      The Pearson correlation coefficient rho(r) between the ORDINARY
      UNSIGNED-INTEGER metric on input byte values and on output byte
      values (0..255 as plain integers, not as GF(2) vectors or GF(2^8)
      field elements), read across a full sweep of one varied byte
      position, tracked as a function of round count r.
    established_families_off_limits: >-
      All twelve off-limits families (differential/truncated differential;
      linear/multidimensional linear; integral/square/division property;
      impossible differential; meet-in-the-middle and Demirci-Selcuk;
      boomerang/retracing boomerang; biclique; algebraic/Groebner; yoyo;
      mixture differential/exchange; subspace trail; partial sums) operate
      EXCLUSIVELY in the cipher's own native algebraic structure: GF(2)-XOR
      difference/Hamming weight, or GF(2^8)-field arithmetic. None of them
      uses the cryptographically arbitrary (but implementation-omnipresent)
      unsigned-integer ordering of byte values as its metric.
      THE CLOSEST INTERNAL PRIOR ART, actively checked this session:
      knowledge/literature/KN-LIT-7595.md ("Mythos Preview's Chain of
      Thought in Discovering the AES Mobius Bridge") documents an
      ALREADY-CLOSED lane -- a cross-ratio/PGL(2,2^8) session that proved
      GF(2)-linear invariants survive the S-box's affine layer L but die at
      its inversion component Inv, projective (PGL) invariants survive Inv
      but die at L, and <PGL(2,2^8), GL(8,2)> jointly leaves only trivial
      invariants -- and named "multi-byte-coupled, information-theoretic, or
      adaptive" as the remaining open directions.
      knowledge/frontiers/symmetric-cryptanalysis.yaml independently tracks
      a live external paper on exactly this cross-ratio object (row
      aes128-cross-ratio-seven-round-2026-candidate, matching
      eprint.iacr.org/2026/1549, which this session independently found via
      WebSearch before discovering it was already tracked). BOTH hits are
      GF(2)-affine or GF(2^8)-projective invariants; the ordinary-integer
      metric proposed here is preserved by NEITHER a GF(2)-linear map
      (XOR by a constant does not preserve integer absolute difference in
      general) NOR any GF(2^8)-affine/Mobius map (field addition = XOR is
      not integer addition). This record is therefore explicitly NOT the
      cross-ratio lane restated, and that discrimination is load-bearing.
    newness_score: >-
      Genuinely new AS A PRIMARY LENS within this program's checked corpus
      (all eight prior RQ-AES-002 proposals, KN-LIT-7595/7602, the
      symmetric-cryptanalysis frontier file). The underlying fact that
      GF(2^8) multiplication by 0x02 partially coincides with ordinary
      integer doubling is elementary and not itself a discovery; what is
      new is using that coincidence as the basis of a tracked statistical
      object never applied to AES in this corpus. Novelty against the
      external literature is UNVERIFIED -- this session's WebSearch/WebFetch
      covered cross-ratio, GFN black-box, and equivalence-class papers, not
      "integer metric" or "fitness-distance correlation" applied to AES,
      and absence of a hit is not evidence of absence.
    testability_score: >-
      High and cheap. One reading costs 256 encryptions plus O(256^2) =
      32640 pairwise distance computations (or a random subsample of
      pairs); a full ladder over r=1..10, several hundred (key, plaintext,
      i, j) instances fits in one producer slot on the measured envelope.
    survival_score: >-
      Expected LOW beyond round 0-1, stated honestly: SubBytes has no known
      relationship to the integer ordering (it is built from GF(2^8)
      inversion, which has no exploitable order structure), so the derived
      xtime-doubling coincidence is expected to be visible, if at all, only
      before the NEXT round's S-box acts on the mixed value. The value of a
      clean negative here is a MEASURED rate at which a provably-real
      algebraic coincidence is erased by one nonlinear layer -- a
      quantitative fact this corpus does not currently hold in any form.

  mechanism: |
    THE DERIVED FACT, CHECKABLE BY HAND. GF(2^8) with FIPS-197's modulus
    x^8+x^4+x^3+x+1 (0x11B). GF(2^8) multiplication by 0x02 ("xtime") is:
    if bit 7 of b is 0, xtime(b) = b << 1 (no overflow, i.e. EXACTLY 2b as
    an ordinary integer, since 2b <= 254 for b <= 127); if bit 7 of b is 1,
    xtime(b) = ((b << 1) mod 256) XOR 0x1B. So for b in {0,...,127}:
    xtime(b) = 2b EXACTLY as both a GF(2^8) product and a base-256 integer
    product. For b in {128,...,255}: xtime(b) differs from plain integer
    doubling-mod-256 by the FIXED offset XOR 0x1B. MixColumns multiplies
    each output byte by a GF(2^8)-linear combination of {0x01, 0x02, 0x03}
    (mult-by-0x03 = xtime XOR identity) applied to the four input bytes of
    a column. THEREFORE: immediately after one MixColumns application, a
    column with only ONE ACTIVE (varying) input byte produces output bytes
    that are an exact, derivable, partially-integer-linear function of that
    byte -- a genuine, provable coincidence between the cipher's native
    GF(2^8) arithmetic and the cryptographically meaningless integer
    ordering. THIS IS A DERIVED ALGEBRAIC FACT ABOUT THE FIPS-197
    CONSTANTS, CHECKED HERE, NOT CITED.

    THE NULL. For h one output-byte restriction of a Haar-random
    permutation, {h(x)} is exchangeable with respect to the domain labels:
    relabelling {0,...,255} by any fixed permutation does not change h's
    distribution. Since d_in is a fixed function of the labels and h is
    independent of any structure beyond bijectivity, E[rho] = 0 exactly by
    symmetry -- the same argument used to derive the null expectation of
    Spearman's rank correlation between a fixed sequence and a random
    permutation. This record does not re-derive the closed-form finite-n
    variance and instead calibrates it directly by Monte Carlo against an
    actual random permutation at stage 1, exactly as this program's other
    AES instruments calibrate their own approximate nulls.

    THE PREDICTED SHAPE. rho(0), reading MixColumns' output directly with
    SubBytes and AddRoundKey suppressed for this ONE control reading, is
    FORCED substantially positive and analytically boundable from the
    xtime identity -- a genuine positive control with a derivable, non-null
    forced value. rho(1) (a full standard round: AddRoundKey, SubBytes,
    ShiftRows, MixColumns) is predicted to already be AT THE NULL, because
    SubBytes acts BEFORE MixColumns within a round and is expected to
    scramble the integer-doubling structure before MixColumns can exploit
    it. This is the primary, pre-registered, falsifiable prediction; a
    departure from it (nonzero rho surviving into r=1 or beyond) is the
    single most interesting possible outcome and is replicated before being
    called a finding.

