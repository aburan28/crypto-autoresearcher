  assumptions:
    - >-
      That reading MixColumns' output directly (S-box and AddRoundKey
      suppressed) is implementable as a separate code path without
      touching the pinned FIPS-197 harness, exactly as IDEA-20260805-4bd60c's
      L0/L1/L2 ladder already establishes is feasible for other
      layer-suppression rungs.
    - >-
      That 256 encryptions plus ~32640 pairwise distance computations per
      (key, plaintext, i, j, r) cell, over several hundred cells, fits the
      measured resource envelope; trivially true relative to the already
      accepted cost of the co-degree ladder proposals.

  proof_search_map:
    not_applicable_reason: >-
      This is an empirical, toy-scale statistical measurement against a
      derived structural coincidence and a classical exchangeability-based
      null, not an asymptotic complexity claim, a certificate family, or a
      closure/reduction argument about full-round AES. The "proof" content
      is the elementary xtime identity, checkable by hand and re-derived
      in-harness at stage 0; no KN-TECH-080 audit applies.

  predictions:
    - metric: >-
        rho(0): Pearson correlation between integer input- and output-byte
        distance, reading MixColumns' output directly with SubBytes/
        AddRoundKey suppressed, N = all 32640 pairs
      direction: higher
      minimum_effect: >-
        FORCED substantially positive, analytically boundable from the
        xtime identity (exact value computed in stage 0, not pre-guessed
        to avoid post-hoc fitting). This is the positive control and must
        fire, or the instrument is broken and nothing else may be reported.
    - metric: "rho(1): same statistic, one full standard AES round"
      direction: lower
      minimum_effect: >-
        PREDICTED at or near the null (within a pre-registered +/-3
        standard-error band computed against an actual random-permutation
        calibration in stage 1), because SubBytes precedes MixColumns
        within a round. A departure from null here is the single most
        interesting possible reading.
    - metric: "rho(r) for r = 2..10 (full round-count ladder)"
      direction: lower
      minimum_effect: >-
        PREDICTED at null throughout, matching rho(1); the pre-registered
        SHAPE is that |rho(r)| does not exceed its calibrated null band at
        any r >= 1. A non-null reading that fails to decay toward null by
        r=10 is the canonical artifact tell and halts interpretation.
    - metric: >-
        random-permutation null calibration: rho computed identically on
        an actual Fisher-Yates-shuffled table in place of AES
      direction: different
      minimum_effect: >-
        FORCED mean 0, variance computed by direct calibration over >=
        1000 independent shuffles; this null can fail (a nonzero
        calibrated mean indicates a bug in the correlation code, not a
        cryptographic finding).
    - metric: >-
        S-box-alone monotonicity check: rho for the raw AES S-box applied
        to all 256 inputs, no rounds, no key
      direction: lower
      minimum_effect: >-
        PREDICTED at or near null; a strongly nonzero reading would be a
        surprising, independently interesting finding about the specific
        FIPS-197 S-box's numeric representation and must be replicated
        before being reported.

  minimal_test:
    design: >-
      Four stages, cheapest first. STAGE 0 (seconds, CAN END THE LINE):
      re-derive the xtime/integer-doubling identity in-harness by direct
      enumeration of all 256 byte values; if it fails, stop and correct
      the record. STAGE 1 (seconds): the random-permutation null
      calibration and the S-box-alone monotonicity check. STAGE 2
      (seconds): the MixColumns-only positive control (rho(0)). STAGE 3
      (minutes): the full round-count ladder r = 1..10, several hundred
      (key, plaintext, i, j) cells, with the matched null interleaved.
      STAGE 4 (paper): write the finding, whichever way rho(1..10) falls.
    controls:
      - >-
        POSITIVE CONTROL THAT MUST FIRE: rho(0), forced substantially
        positive by the derived xtime identity. If it does not fire, the
        instrument or the layer-suppression code is broken.
      - >-
        NULL OBJECT OF THE SAME SHAPE, AND IT CAN FAIL: an actual
        Fisher-Yates-shuffled permutation read through the identical
        pairwise-distance-correlation code. Forced mean rho = 0.
      - >-
        SIBLING NULL THAT ISOLATES THE PROPERTY: the AES-shaped SPN with a
        uniformly random S-box, everything else identical. If it
        reproduces the real-S-box profile exactly, any surviving
        correlation is a property of MixColumns' round geometry, not of
        the specific S-box.
      - >-
        GRADED CONTROL: the round-count ladder r = 0 (control), 1, ..., 10
        is itself the graded control; the r=0-to-r=1 transition is
        reported as a first-class result.
      - >-
        ORDERING CONTROL: the null-object and S-box-alone readings are
        computed and hash-committed before the round-ladder treatment
        readings are looked at.
      - >-
        ARCHIVE CHECK (zero compute): no prior record in this repository
        or the checked knowledge corpus measures a correlation between the
        ordinary-integer byte metric and any AES observable. Recorded as
        unavailable rather than a passed check.
    required_metrics: [xtime/integer-doubling identity confirmation, random-permutation null mean/variance, S-box-alone rho, rho(0) positive control, "rho(r) for r=1..10 with matched-null band", sibling-null comparison]

  falsification_conditions:
    - "The derived xtime/integer-doubling identity does not hold in-harness. Superseded before anything else runs."
    - "rho(0) does not fire substantially positive. Instrument broken; nothing may be reported."
    - "The random-permutation null does not read mean 0 within calibrated variance. Every downstream number is void."
    - "rho(r) for r >= 1 is nonzero and does not decay toward null by r=10. The canonical artifact tell has fired."
    - "The sibling null (random S-box) reproduces the real-S-box profile exactly at every round."

  confounders:
    - >-
      BOUNDARY / WRAPAROUND EFFECTS: plain |x-x'| is not translation
      invariant mod 256 the way GF(2) XOR distance is. Declared pre-run:
      both plain absolute difference and circular distance
      min(|x-x'|, 256-|x-x'|) are computed and reported separately.
    - "SAMPLE REUSE ACROSS ROUNDS: independent seed streams per cell, declared pre-run."
    - >-
      OUTPUT-BYTE / COLUMN-POSITION CHOICE: the xtime coefficient differs
      by position within a MixColumns column (0x02, 0x03, 0x01, 0x01);
      the position is recorded per reading and broken out.
    - >-
      SESSION-DERIVED VALUES ARE NOT HARNESS MEASUREMENTS: the xtime
      identity and predicted rho(0) sign are derived on paper here and
      re-taken at stage 0; a discrepancy is reported, not reconciled.

  interpretation_limits:
    - "CLAIM TIER toy by default (RQ-AES-002 R7), regardless of the full-round ambition it serves."
    - >-
      A negative closes ONLY: "Pearson correlation between the
      ordinary-unsigned-integer byte metric and AES ciphertext bytes,
      this instrument, this budget, this round range." Not a universal
      impossibility claim (forbidden by R7); forward guidance names
      circular/modular distance variants and multi-byte integer-vector
      metrics (e.g. a 4-byte column as a base-256^4 integer) as OPEN AND
      UNATTEMPTED.
    - >-
      A positive (nonzero rho surviving past r=1) would be genuinely novel
      and routes to independent xhigh/breakthrough-tier review per
      AGENTS.md rule 12 before any stronger language; it is not converted
      into a distinguisher or key-recovery claim by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The xtime/integer-doubling coincidence (xtime(b)=2b exactly for
        b<128, offset by a fixed XOR for b>=128) is an exact algebraic
        fact about the FIPS-197 constants, not a distributional claim.
      rigorous_support: >-
        Given in full in the mechanism, a direct case analysis on the top
        bit of the byte; re-derivable by hand and by exhaustive
        enumeration over all 256 values.
      validation_plan: "Stage 0 recomputes the identity in-harness over all 256 values."
    - id: H2
      statement: >-
        For a uniformly random bijection on {0,...,255}, the Pearson
        correlation between the fixed integer-distance sequence and the
        random output's induced distance sequence has expectation exactly
        0, imitating the classical zero-expectation result for Spearman's
        rank correlation of a random permutation against a fixed sequence.
      rigorous_support: >-
        Follows from exchangeability of the random permutation's values
        under relabelling that fixes the multiset of pairwise distances;
        the same symmetry argument underlies Spearman's rho's null
        expectation, applied here to Pearson correlation over integer
        (not rank) distances.
      validation_plan: >-
        Stage 1's random-permutation calibration measures the mean and
        variance directly at n=256 over >= 1000 independent shuffles
        rather than relying on an asymptotic rank-correlation variance
        formula, since this record adapts a rank-correlation argument to
        a value-correlation statistic.

  target_complexity:
    time_exponent: >-
      NOT AN ATTACK; no exponent against exhaustive key search is claimed
      or moved. One reading costs 256 encryptions plus O(256^2) (or a
      subsample) pairwise operations. The full 16-byte analogue at real
      AES-128 block size would require the entire 2^128 domain and is
      explicitly NOT proposed; this record is scoped to one-byte sweeps.
    memory_exponent: "O(256) values plus O(256^2) pairs (or O(sample size)); negligible, stated beside time."
    best_known: >-
