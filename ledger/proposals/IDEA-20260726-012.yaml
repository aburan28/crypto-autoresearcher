idea:
  id: IDEA-20260726-012
  title: Divisor-parity obstruction for ordinary PMA4 reciprocal-minor tables
  class: mechanism
  claim: >-
    Let k have characteristic different from 2, let F=k(t), and prescribe
    p_empty=1 and p_S=(t+1)/(t+d_S) for every nonempty subset of four
    indices. For each of the three anchored reconstruction triples, form
    q_ij=p_i*p_j-p_ij,
    c_ijk=p_ijk-p_i*p_j*p_k+p_i*q_jk+p_j*q_ik+p_k*q_ij, and
    Delta_ijk=c_ijk^2-4*q_ij*q_jk*q_ki. On the nondegenerate locus where
    the required q_ij are nonzero, an odd valuation of any reduced
    Delta_ijk at a finite irreducible divisor or at infinity is a fatal
    obstruction to an ordinary 4 by 4 matrix over F having the prescribed
    principal minors. The proposed discriminator is whether the exact BCM
    formulas force at least one such odd divisor over a symbolic or explicitly
    parameterized family, outside a stated exceptional locus. If they do not,
    the reviewed F_211(t) nonsquare is fixture-specific rather than a generic
    divisor-parity obstruction. Even divisor parity is not by itself a
    sufficiency claim: the residual constant square class, shared orientation
    constraints, and the full four-minor gate must still be checked.
  mechanism: >-
    Ordinary PMA4 reconstruction turns the public reciprocal-minor data into
    three quadratic orientation equations. A matrix over k(t) can exist only
    if every required orientation root lies in k(t). In odd characteristic,
    a nonzero rational function can be a square only if every discrete
    valuation in its principal divisor, including the valuation at infinity,
    is even; after this parity test, its constant class in
    k^*/k^{*2} must also be square. Canonically canceling each discriminant
    and exhibiting one surviving odd valuation therefore supplies a short
    rejection certificate without enumerating matrix branches or solving the
    full four-minor equation. Applying the certificate over the function field
    of the BCM parameters, then specializing it to the reviewed F_211 table,
    distinguishes a generic open-locus obstruction from an accidental toy
    specialization. This mechanism is only a public compatibility classifier:
    it returns OBSTRUCTED or NOT_OBSTRUCTED_BY_THIS_GATE and carries no
    occurrence-labelled source, factor-base log, target descent, or scalar.
  novelty_status: unverified
  assumptions:
    - >-
      The coefficient field is k(t) with char(k) != 2. Characteristic 2 is a
      separate Artin-Schreier or linearized-quadratic problem and is outside
      this proposal's prediction.
    - >-
      The prescribed values d_S, including every scale factor in the BCM
      factorization, are public and represented exactly. No hidden source
      tuple, supplied matrix, or target-derived witness is smuggled into the
      symbolic parameters.
    - >-
      Each tested quadratic is genuinely nondegenerate: the relevant q_ij,
      quadratic leading coefficient, and denominators are nonzero after
      canonical cancellation. Cases with q_ij=0, a degree drop, or a zero
      discriminant are branched and classified separately rather than called
      nonsquare.
    - >-
      Pole collisions d_S=d_T, cancellation at t=-1, repeated factors,
      inseparability, vanishing BCM scale factors, and specializations that
      collapse the parameter field are recorded in an explicit exceptional
      locus before any generic statement.
    - >-
      A generic-family claim is made in the fraction field of an explicitly
      named integral parameter ring modulo the proved BCM relations. Treating
      the d_S as algebraically independent when BCM relations constrain them
      would invalidate the test.
    - >-
      Divisor parity is supplemented by the residual constant square class.
      Over a finite or otherwise non-algebraically-closed constant field,
      even valuations alone do not prove that a rational function is a square.
    - >-
      Allowing roots in a quadratic extension changes the field-of-definition
      question and does not satisfy ordinary PMA4 over k(t).
    - >-
      Passing all three square-class gates is only necessary. Shared
      orientation consistency, every size-at-most-three minor, and mask 15
      remain independent requirements for an ordinary PMA4 realization.
  predictions:
    - metric: generic_odd_discriminant_valuation_count
      direction: higher
      minimum_effect: >-
        At least one of the three canonically reduced discriminants has an
        explicitly named irreducible divisor, finite or at infinity, with odd
        valuation in the exact BCM parameter function field outside a
        nonempty explicitly stated open locus. This is the positive result
        required for a generic ordinary-PMA4 obstruction; zero such witnesses
        makes the proposed generic parity mechanism fail.
    - metric: reviewed_F_211_specialization_agreement
      direction: different
      minimum_effect: >-
        Exact specialization reproduces the reviewed first discriminant:
        square denominator
        [t(t+38)(t+63)(t+105)(t+139)(t+152)(t+162)]^2 and numerator
        99(t+1)^2*g(t), where the monic degree-10 g has ascending
        coefficients [148,70,155,163,5,107,183,9,176,136,1] and a nontrivial
        square class. Any mismatch invalidates the symbolic derivation rather
        than revising the frozen fixture.
    - metric: positive_control_false_obstruction_count
      direction: lower
      minimum_effect: >-
        Exactly zero odd-valuation or nonsquare-constant obstructions are
        reported for the supplied ordinary-matrix principal-minor table, and
        the three orientation quadratics split with their recorded roots.
    - metric: mask_15_control_false_compatibility_count
      direction: lower
      minimum_effect: >-
        Exactly zero full PMA4 acceptances occur for the mask-15-only negative
        control even when all three lower quadratic square-class gates pass.
        This confirms that absence of a divisor obstruction is not treated as
        sufficiency.
  minimal_test:
    design: >-
      Perform one frozen theorem-level symbolic square-class derivation, with
      no ECDLP or relation run. First substitute
      p_S=(t+1)/(t+d_S) into the exact q_ij, c_ijk, and Delta_ijk formulas for
      the three anchored PMA4 quadratics. Reduce each rational function over
      the explicitly defined BCM parameter ring, cancel numerator-denominator
      gcds, and compute a square-free divisor certificate including infinity
      and the residual constant square class. State the complete exceptional
      locus and branch every zero or degree-drop degeneracy. Then specialize
      the same frozen formulas to the reviewed F_211 fixture and to both
      existing supplied-table controls. Classify the outcome as exactly one
      of GENERIC_ODD_DIVISOR_WITNESS, PARAMETERIZED_ONLY_WITNESS,
      FIXTURE_SPECIFIC_NONSQUARE, or NO_DIVISOR_OBSTRUCTION. A positive generic
      classification requires a reader-checkable odd prime-divisor witness
      that remains nonzero on a proved nonempty open BCM locus; otherwise the
      single-table result stays fixture-specific.
    controls:
      - >-
        Positive ordinary-matrix control: use the frozen supplied dense 4 by 4
        F_211(t) matrix from TASK-20260726-756. Its complete principal-minor
        table must yield three split quadratics and no false odd-divisor or
        nonsquare-constant certificate.
      - >-
        Reviewed target negative control: specialize to the frozen BCM table
        from EV-ECDLP-023 and reproduce the exact first discriminant and its
        nonsquare degree-10 factor without relying on an irreducibility claim.
      - >-
        Full-minor negative control: change only mask 15 in the positive
        table, as in TASK-20260726-756. The square-class stage must retain the
        lower branches, while the separate full-minor comparison rejects all
        of them.
      - >-
        Degeneracy controls: include q_ij=0, Delta_ijk=0, colliding poles,
        canceled factors, and a characteristic-2 fixture. Each must enter its
        declared separate branch or out-of-scope result and must never be
        counted as an odd-divisor witness.
    required_metrics:
      - Canonical numerator, denominator, gcd, degree, and valuation at infinity for each of the three discriminants
      - Square-free divisor with every odd-valuation component and its multiplicity
      - Residual constant square class after all divisor valuations are even
      - Exact BCM parameter ring, proved relations, exceptional-locus equations, and a nonemptiness witness for any claimed open locus
      - Exact specialization identity for the reviewed F_211 table
      - Positive-control and both negative-control classifications
      - Separate counts of quadratic branches, lower-minor survivors, and full-minor survivors
      - One of the four predeclared terminal classifications, with no promotion or generic claim outside its gate
  falsification_conditions:
    - >-
      After exact cancellation in the true BCM parameter function field, all
      three discriminants have even valuations and square residual constants.
      This falsifies the proposed generic divisor-parity obstruction, although
      a later shared-orientation or four-minor obstruction could still exist.
    - >-
      Every apparent odd divisor lies inside the exceptional locus, cancels
      against the denominator, becomes even after BCM relations are imposed,
      or disappears under a valid generic parameterization.
    - >-
      The frozen symbolic formulas fail to reproduce the reviewed F_211
      discriminant exactly. This is a derivation failure, not evidence that
      the immutable fixture changed.
    - >-
      The supplied ordinary-matrix control receives an obstruction, or the
      mask-15-only control is accepted as a full PMA4 realization. Either
      outcome invalidates the proposed discriminator.
    - >-
      A claimed generic conclusion depends on characteristic 2,
      q_ij=0, Delta_ijk=0, an algebraic extension, a repeated-pole
      specialization, or an unproved independence assumption among the BCM
      minors.
  confounders:
    - >-
      The d_S satisfy determinant and BCM relations. A square-free factor
      visible when they are treated as free symbols can vanish or acquire even
      multiplicity on the actual BCM parameter variety.
    - >-
      A generic nonsquare may specialize to a square. In the other direction,
      a square rational function remains square at every specialization where
      its square root is defined. Thus a nonsquare at a regular valid
      specialization rules out a generically square identity on that
      component, while a point where a denominator or square-root coordinate
      is undefined is exceptional and supports no such inference.
    - >-
      A computer algebra factorization can obscure cancellations, units, and
      the place at infinity. The certificate must be stated as exact
      valuations in the declared ring, not as an unchecked factor-list printout.
    - >-
      The reviewed F_211 fixture was selected by deterministic group and BCM
      gates, but it is still one toy point. Its degree-10 factor supplies no
      frequency or genericity estimate by itself.
    - >-
      The three anchored quadratics share entries and gauge choices. Counting
      them as statistically independent would overstate evidence.
    - >-
      Passing the square-class test can coexist with failure at shared
      orientations or mask 15, as the existing full-minor-only control shows.
  interpretation_limits:
    - >-
      This is a proposal only. No symbolic execution, validator, ECDLP
      experiment, relation campaign, or source-to-scalar run has occurred.
    - >-
      One certified odd divisor would reject an ordinary 4 by 4 realization
      only over the named base field and nondegenerate parameter locus. It
      would not reject bordered, block, augmented, shifted, algebra-valued, or
      extension-field representations, nor establish an all-size PMA theorem.
    - >-
      No odd divisor does not prove PMA4 compatibility; the constant class,
      shared orientations, all lower minors, and the full four-minor equation
      remain.
    - >-
      The mechanism returns no exact signed source, selected labels,
      factor-base completion, target descent, scalar replay, or verified
      attack. Its fully charged source-to-scalar candidate count is zero, so
      it supplies no rho or BSGS advantage and no Shoup contradiction.
    - >-
      Internal semantic distinctness is not a primary-literature novelty
      result. No network or literature search was authorized, so novelty
      remains unverified.
    - >-
      Every prospective result remains toy, heuristic, model-bound, and
      novelty-unverified until a separately authorized derivation, immutable
      snapshot, and independent review establish a narrower status.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  candidate_count: 0
  labels:
    - toy
    - heuristic
    - model-bound
    - novelty-unverified
