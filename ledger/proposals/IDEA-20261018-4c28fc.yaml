idea:
  id: IDEA-20261018-4c28fc
  title: Co-measured equal-advice Bernstein-Lange preprocessing rho vs IC at n=73 and n=83
  class: control
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids:
  - GOAL-ICPERF-e6b6a4
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: Preprocessing rho at equal or smaller advice is faster online than compact-orbit IC at n=73 and
    n=83 by a factor above 10 in the co-measured pairing, with log2(S*T^2) - log2(r/|Aut|) recorded on
    every online row. Projected from n<=61 (53x to 317x), the n=83 figure is about 50-100x and is not
    measured.
  mechanism: Extend the n<=63 BL instrument to the wide field, then run BL and IC in one session, one
    resource envelope, with replay certificates. The n=61 pairing over 1024 points (BL 3.37 ms vs IC 111.4
    ms) fails claim_check (SCHEMA_INCOMPLETE) because BL was replayed from an archive, not co-measured;
    the n=83 run did not fit a 1 GiB cap.
  novelty_status: unverified
  regime: Koblitz binary; integrity/baseline; 1-2 days once the wide-field instrument exists
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.2 bullet 1, 2.1 row 1, 4 row 2
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/ic_next10_20261014/09-equal-advice/README.md
    provenance: internal
    claim: BL 53x [35,80] to 317x [137,739] faster online at n=61..41; N83 a projection.
    verified_by: idea-generator
  - ref: crypto:research/ic_improve_20261015/README.md:21
    provenance: internal
    claim: n=61 pairing, claim_check FAIL / SCHEMA_INCOMPLETE; owner decision 2026-10-15 to keep online
      rows on the board.
    verified_by: idea-generator
  - ref: Bernstein and Lange, non-uniform cracks in the concrete foundations of ECDLP security
    provenance: recalled
    claim: Preprocessing rho reference; citation not re-opened in this pass.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-RHO-ea34b8
    - KR-RHO-fbd7b1
    - KR-RHO-7d93f6
    - KR-IC-b0fcda
    nearest:
    - ref: KR-RHO-ea34b8
      provenance: internal
      relation: special_case
      delta: Bernstein-Lange preprocessing rho is the reference arm; this co-measures it against IC at
        n=73/83, the form that earlier runs (n=41,53,61) did not reach.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - Advice size S is matched between arms by the frozen rule of the n<=63 run.
  - Online rows stay on the board per the owner decision of 2026-10-15.
  predictions:
  - metric: online_ratio_BL_over_IC_n73_n83
    direction: lower
    minimum_effect: BL online time/cost below IC by at least 10x, interval excluding 1, both sizes.
  - metric: log2_ST2_minus_log2_r_over_Aut_per_online_row
    direction: different
    minimum_effect: Recorded on every online row; sign and size reported.
  minimal_test:
    design: Build the wide-field BL instrument (n<=63 code extended to n=73 and 83), then in one session
      under one resource envelope run BL and IC on the same random targets with exact replays. Freeze
      the protocol, targets and advice-matching rule before timing; add the S*T^2 column to every online
      row.
    controls:
    - A/A repeat of each arm
    - 'positive control: n=61 reproduces the archived BL/IC pair'
    - matched rho reference
    - unpriced native work priced at 0, 0.1, 1 GAE (AGENTS.md 5a)
    required_metrics:
    - BL and IC online counted cost with intervals
    - log2(S*T^2) - log2(r/|Aut|)
    - replay certificate status
    - resource envelope
  falsification_conditions:
  - If the interval of the BL/IC ratio includes 1 or lies below it at n=73 or 83, 'BL dominates IC online
    at equal advice' is refuted at that size.
  - A pairing with BL replayed rather than co-measured is not evidence and does not count.
  confounders:
  - advice-matching rule
  - cache and memory contention across arms
  - cap at 1 GiB
  - target distribution
  interpretation_limits:
  - Does not address cold single-target S, where BL has no advantage.
  - Koblitz only.
  heuristic_assumptions:
  - id: H1
    statement: The n<=61 online ratio extrapolates to n=73/83 in log scale.
    rigorous_support: Three measured sizes n=41,53,61.
    validation_plan: The co-measured points test it directly; compare to the 50-100x projection.
  target_complexity:
    time_exponent: 'No exponent claim. Pays a baseline debt: the online distance to precomputation rho
      on the leaderboard rows.'
    memory_exponent: No exponent claimed; memory is the measured constraint, reported as peak RSS.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: medium (wide-field BL instrument)
    compute: low-medium (1-2 days, reviewer estimate)
  recommended_priority: high
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: Not an improvement; it can flip the sign of a headline online row and sets the true distance
    to precomputation rho.
