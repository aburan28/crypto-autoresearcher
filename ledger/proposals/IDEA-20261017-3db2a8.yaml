    claim: 'nearest prior work: its four-factor identity plus class factor d(V); adds regime lemma and n_cross sensitivity'
    verified_by: idea-generator 2026-10-17, record opened
  - ref: IDEA-20260913-8138a0
    provenance: internal
    claim: 'nearest prior work: m! as exponent carrier; here yield constants cannot move c'
    verified_by: idea-generator 2026-10-17, record opened
  predictions:
  - {metric: "class mean per 2E-target vs d(V)*C(|W|+t-1,t)/N, toy cells", direction: different, minimum_effect: "equal within O(c/N) coincidences; failure = derivation error"}
  - {metric: "n_cross shift per bit of theta from eq. (15)", direction: different, minimum_effect: "2.9+-0.3 n per bit near n=302"}
  - {metric: "relative gap P(A_t)-P(eq.5)", direction: lower, minimum_effect: "<= t/|V|"}
  minimal_test:
    design: >-
      Stage 0: recompute the n_cross sensitivity from tables.yaml formulas. Stage 1
      (RUN-SEMBIN-8be036 per-R counts, no new curve arithmetic beyond Tr): class mean
      on pi=0 targets equals 2x overall mean for confined V and 1x for unconfined,
      and the exact multiset identity. Stage 2: n=11,13, h=4 curve (Tr(a)=0): verify
      by group enumeration that P in 4E iff Tr(u)=0 for u^2+x_P u+B=0, and count d(V).
    controls:
    - "h=2 curve (Tr(a)=1): d=1 for every V because 2E=4E"
    - "m=1 slice: decomposable set is exactly W"
    required_metrics: ["class mean", "|W|", "a(V)", "d(V)", "n_cross shift per bit"]
  falsification_conditions:
  - "A class mean differing from d(V)*C(|W|+t-1,t)/N beyond O(c/N): C1 is wrong."
  - "P(eq.5 at t) > P(A_t) in any cell: the Lemma 2 direction used in C5 is wrong."
  - "A linear V with d(V)>2 on an h=4 curve at k>=6: the ceiling in C1 is wrong."
  confounders:
  - "single-instance a(V) fluctuation ~|V|^{-1/2}: report per instance."
  interpretation_limits:
  - "Constants only. Assumption 1/2 and the FIPS conclusion untouched; no security claim either way."
  - "Does not edit H-RELN-96e3ba or EXP-RELN-164ad3; remedy is an additive amendment naming this exact mean as comparator."
  heuristic_assumptions:
  - id: H1
    statement: "nu_t=E[c(c-1)]/E[c] stays e^{o(t log t)} for the window family up to t~12."
    rigorous_support: "E[c(c-1)] is the energy of W (zeros of S_{2t} on V^{2t}); only the trivial lower bound is proved."
    validation_plan: "IDEA-20261017-3079bc cluster detector, t=4..12, |V|=2^5..2^8, Poisson background as null."
  - id: H2
    statement: "cl(W) equidistributes on its subgroup image, so d(V)=h/|image|."
    rigorous_support: "Conservation holds for any class law; only the target-class fraction needs it."
    validation_plan: "Exhaustive class histogram of W, n=11..24, h in {2,4}; chi-square against uniform."
  target_complexity:
    time_exponent: "unchanged: 2^{c sqrt(n ln n)}, c=1.6986 invariant for bounded theta and for kappa(t)=e^{O(t)}"
    memory_exponent: "unchanged (stage 2 stores ~2^k relations; the paper does not charge it)"
    best_known: "Semaev 2015 eqs. (15)-(17); rho 2^{n/2}"
    hidden_overhead: "bounded per-slot gamma bits changes the effective exponent by sqrt(1+gamma/(log2 m-1.44)): ~20% at m=12, gamma=1; -> 1 only as m grows"
    tradeoff_note: "n/a"
