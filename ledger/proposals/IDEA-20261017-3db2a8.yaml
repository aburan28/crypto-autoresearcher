  - {ref: IDEA-20260913-cedd2f, provenance: internal, claim: "halving criterion F1/F2, retrieved there from FHLM 2003 Lemma 4.1 and Pornin 2022/1325", verified_by: H-SEMBIN-83a856}
  - {ref: KN-FIND-007, provenance: internal, claim: "multiset conservation sum_r c_D(r)=C(B+m-1,m)", verified_by: H-RELN-96e3ba}
