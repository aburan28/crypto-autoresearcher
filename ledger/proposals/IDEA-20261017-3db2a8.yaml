idea:
  id: IDEA-20261017-3db2a8
  question_id: RQ-SEMBIN-ade131
  added: '2026-10-17'
  status: proposed
  approved_by:
  proposed_by: idea-generator
  title: >-
    The Semaev yield is an exact first moment d(V)*C(|W|+t-1,t)/N: the Poisson link is
    second-order at the optimum, no yield-law constant can move c in eqs. (15)-(17),
    and the sign of the paper's inequality is reading-dependent with size <= t/|V|
  class: mechanism
  claim: >-
    SCOPE: derivation plus zero-compute arithmetic from the frozen paper and one toy
    check. No security or degree claim. E y^2+xy=x^3+aX^2+B over F_q, q=2^n, target
    group <P> of odd prime order, cofactor h=2^s, V an F_2-subspace, W = rational points
    with x in V. (C1) Mean: for R in <P>, x-multiset decompositions of R_X = point
    multisets of W summing to R (up to O(1/N) coincidences), so the mean is
    d(V)*C(|W|+t-1,t)/N, d(V)=h/|<cl(W)>|, cl: E->E/<P>; |W|=2a-1 with a=#{x in V on
    curve}; half the x are on-curve and each has two lifts, so |W|~|V| and eq. (11) is
    this with |V|:=|W|, d:=1. Linear V gives d<=2. (C2) H-RELN-96e3ba's 2^m is
    (|W|/|V|)^m with |V| read as the number B of on-curve classes (|W|=2B); the paper
    (Sec. 3 step 1) takes V inside F_q, so it is the protocol's encoding. (C3) Bonferroni
    per class: lambda_c - E[c(c-1)]/2 <= P <= lambda_c; heterogeneity is second order,
    only clustering nu=E[c(c-1)]/E[c]=Theta(1) is first order; Table 3 rows have
    mu<=.006. (C4) Each yield constant is an additive theta bits in stage 1
    (d=2: -1; relations needed a(V)+1~|V|/2: -1; RELN-type 2^m: +m); the crossover
    moves ~2.9 n per bit; c is unchanged unless the per-slot factor grows like
    t^delta (then c -> c*sqrt(1+delta)). (C5) The paper's chain P(any level)>=P(A_t)>=
    P(eq.5) makes P an upper bound if only level m is solved (cost optimistic) and a
    lower bound if all levels are solved as in Sec. 4.5.2 (cost pessimistic); gap
    <= sum_{t'<t} mu_t' ~ t*mu_t/|V| (<=12*2^-38 at n=409).
  mechanism: >-
    Tracked object: the class of the multiset sum in E/<P>, a lossy projection of the
    point multiset (one element of a cyclic 2-group) compatible with the named
    operation set Sigma = {sums of factor-base multisets} since cl is a homomorphism.
    Class I partial action. Representation R1. The mean is conservation, not a
    distributional assumption. Factor-base escape: standard subspace, KN-OPEN-020
    untouched. Exponent route: stage 1 = m! 2^{n/m} n^{4w} 2^theta; theta is the only
    slot a yield law can occupy. Derivations in the notes file.
  novelty_status: unverified
  citations:
