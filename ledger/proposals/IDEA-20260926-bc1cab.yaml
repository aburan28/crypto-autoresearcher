  interpretation_limits:
    - 'A census and certificate; no attack, no exponent, no decomposition solve, no run against any curve.'
    - 'KN-OPEN-020 class declared implicit membership (high-degree); nothing here touches the universal statement.'
    - 'A positive successor member would be a K-coefficient base with NO Frobenius orbit reduction; its budget is the no-orbit 2^5.73 at m = 4, which is disclosed in the claim and makes even the positive branch far from an attack.'
    - 'Scoped to n = 131, n-prime = 33 for the QSP shape at d <= 7, to a = 32 with linearized e of 2-degree <= 2 for the successor sub-shape, and to the sampled and structured families named.'
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Bulk null.) The kernel dimension of x^{2^33} + c x^{2^32} + e(x) for
        (c, e) uniform in K^4 is distributed as that of a uniformly random
        131 x 131 matrix over F_2, so P(dim >= k) is about 2^{-k^2} up to a
        constant, and the maximum over 10^5 draws is about 4 to 5.
      rigorous_support: >-
        No rigorous bound (the correspondence bound is vacuous here);
        classical statement imitated: the rank distribution of random
        matrices over F_2, re-derived by simulation in Stage 0.
      validation_plan: >-
        SAMPLE: 10^5 uniform draws at n = 131 and 10^4 at n in {17, 19, 23}
        (where the same statement can be checked against exhaustive
        enumeration of the shape for small coefficient subfields);
        COMPARISON: the empirical distribution against the simulated null;
        TAIL: the maximum and the count at dim >= 3; TRANSFER: none claimed
        beyond the sampled families; the random-model existence count
        2^{524 - k^2} is model arithmetic and is not asserted as a property of
        the family.
    - id: H2
      statement: >-
        (Isolated roots.) For lambda uniform in K[X] of degree d <= 7, the
        number of K-roots of X^{2^33} + lambda(X) is distributed with mean of
        order 1 and no Frobenius-orbit structure, so N = 132 never occurs.
      rigorous_support: >-
        Rigorous ingredient: the root set of a K-coefficient lambda is not
        Frobenius-stable (sigma maps roots of L to roots of L^{(1)}, a
        different polynomial), so orbits of 131 cannot arise unless L is
        Frobenius-fixed, i.e. has F_2 coefficients; classical statement
        imitated: fixed points of a random map on 2^131 elements are Poisson
        with mean 1.
      validation_plan: >-
        SAMPLE: Stage 1 at n <= 13 (brute force) and Stage 4 at n = 131
        (20 per degree in pure Python); COMPARISON: the histogram against
        Poisson(1) and against the F_2 slice; TAIL: the maximum N; TRANSFER:
        from the toy cells to n = 131 by the same orbit argument.
