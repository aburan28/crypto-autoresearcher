  confounders:
    - 'Uniform sampling cannot reach candidates that exist only at the random-model rate; a null on the sampled families is a null on the sampled families, and the record says so in every reading.'
    - 'The structured sub-families (mu_263, F_2, Frobenius-power patterns) are a choice; a positive that lives elsewhere is not excluded by their null.'
    - 'The (B2) arm in pure Python is limited to tens of candidates per degree; the histogram there has wide intervals and is reported as such.'
