idea:
  id: IDEA-20260926-bc1cab
  question_id: RQ-QSP-f9bbdb
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE TWISTED-COEFFICIENT CENSUS AT n = 131: K-coefficient quasi-subfield
    lambda (n' = 33, deg <= 7), where the twisted injection bound gives
    N <= d^4 and predicts no 131-orbit peak, and the successor shape
    x^{2^33} + c x^{2^32} + e(x) with c, e in K, where the bound is vacuous
    and a 131 x 131 F_2-rank decides each linearized candidate exactly;
    predicted null against the dense-linearized control, with the sampling
    ceiling stated
  class: control
  claim: >-
    (A) WHAT IS PROVED, WHAT IS MEASURED, WHAT IS UNTOUCHED. The twisted
    injection bound N_K(X^{2^{n'}} - lambda) <= max(d^{q+1}, 2^{n'-r}) is
    claimed by derivation for lambda in K[X] (IDEA-20260916-5c9d6e (D)(i),
    KN-FIND-617d78 (A) with the twisted iterates Lambda_{k+1} = Lambda_k^{(n')}
    o lambda) and is measured at toy scale only (1200 seeded K-coefficient
    candidates in EXP-QSP-33b442 Stage 1; the (11, 6) fixture of 5c9d6e).
    Three things are untouched: K-coefficient lambda at n = 131
    (KN-FIND-617d78 boundary 4, "entirely untouched"); the composition-lemma
    shortcut of KN-TECH-54c38e with a non-trivial twist (its Limit 2); and the
    K-coefficient members of the successor shape
    L_R = X^{2^{a+1}} + c(X) X^{2^a} + e(X) (IDEA-20260916-a17f43 leaves "K-
    coefficient c, e ... not enumerable and ... open"). This record is the
    census of those three, with the one genuinely open cell isolated.
    (B) THE FOUR ARMS. (B1) LINEARIZED TWISTED QSP at n = 131, n' = 33:
    L = x^{2^33} + e_2 x^4 + e_1 x^2 + e_0 x with e_i in K, an F_2-linear map
    on K; N = 2^{dim ker}, computed EXACTLY by the rank of a 131 x 131 F_2
    matrix (build by applying L to a basis, 33 squarings and three
    multiplications per column). The bound (A) with (q, r) = (3, 32) gives
    N <= max(d^4, 2): dim ker <= 8 at d = 4, <= 4 at d = 2, <= 1 at d = 1.
    Any candidate above that bound refutes (A) in its twisted form, which
    KN-FIND-617d78 section 6 names the most valuable outcome the line can
    produce. (B2) NON-LINEARIZED TWISTED QSP at n = 131, n' = 33, exact
    degree 3..7, coefficients in K, via the existing K-layer instruments of
    experiments/EXP-QSP-33b442/implementation/qspcore.py (i3_injection_k with
    the twisted iterate, i2_gcd_k on a subsample): P = Lambda_4(X) + X^2 of
    degree d^4 <= 2401 over K, then gcd with X^{2^131} - X. Predictions: N <=
    d^4 always; the histogram has NO mass at 132, because a K-coefficient
    lambda is not Frobenius-invariant, so its K-roots do not come in orbits of
    131 (the F_2 census of KN-FIND-617d78 section 3 has histogram
    {0:62, 1:118, 2:60, 132:4} at n' = 33 -- the 132 peak is the orbit
    signature, and this arm predicts its absence); the bulk is small N with
    mean of order 1. Fixture: lambda = c X^d with c in K^*, d in 1..7, has
    EXACTLY two roots in K (0 and the unique solution of x^{2^33 - d} = c),
    because gcd(2^33 - d, 2^131 - 1) = 1 for d <= 7: 2^131 - 1 = 263 p with p
    prime (RQ-QSP-f9bbdb), 2^33 = 68 mod 263 so 263 does not divide 2^33 - d
    for d <= 7, and p > 2^33; and lambda = c (constant) has exactly one root.
    (B3) THE SUCCESSOR SUB-SHAPE WHERE THE BOUND IS VACUOUS, DECIDED EXACTLY
    PER CANDIDATE. a17f43's correspondence bound at (a, q, r) = (32, 4, 3)
    reads N <= d_0^5 + 2^{q+1} 2^{a-r} = d_0^5 + 2^34, above the 2^33 the
    linearized sub-shape L = x^{2^33} + c x^{2^32} + e(x) (c in K constant, e
    linearized of 2-degree <= 2 with K coefficients) can ever reach, so the
    bound says nothing and the kernel dimension, computable exactly by the
    same 131 x 131 rank, is the whole answer. Sampling arms: 10^5 uniform
    (c, e) in K^4; structured arms with coefficients in the order-263
    subgroup mu_263 of K^* and in F_2 (264 x 8 candidates with e in F_2^3;
    264^3 candidates with c = 0, e in mu_263^3, about 2 x 10^7 ranks), and
    Frobenius-power patterns e_i = c^{2^{k_i}}. Null: random DENSE
    linearized polynomials of 2-degree 33 (equivalently random 131 x 131
    F_2 matrices), whose kernel-dimension distribution is the classical one
    (P(dim >= 1) about 0.71, P(dim >= 2) about 0.19, P(dim >= 4) about 2^-12,
    P(dim >= k) about 2^{-k^2} for larger k; recalled, re-derived by
    simulation in Stage 0). THE SAMPLING CEILING, STATED HONESTLY: under the
    random model the sparse family of size 2^524 CONTAINS about 2^{524 - k^2}
    members with dim ker >= k, i.e. about 2^40 members with dim ker >= 22, but
    a uniform draw finds one with probability 2^-484, so the sampling arms
    test only the bulk against the null; the existence question is an
    algebraic search (find monic M of 2-degree 33 - w and a subspace
    polynomial P_W of 2-degree w with M o P_W sparse) and is handed forward,
    not answered here. Fixtures: F_2-coefficient members must give dim ker
    <= 1 (their associated polynomial X^33 + c X^32 + e_2 X^2 + e_1 X + e_0
    can share with X^131 - 1 = (X + 1) Phi_131 only the factor X + 1;
    IDEA-20260918-9abf42); Type 2 at n = 7 (X^8 + X^2 + X, kernel of dimension
    3, a = 2) and at n = 31 (2^15 roots) as positive fixtures through the same
    rank instrument at toy n. (B4) TOY VALIDATION OF THE TWISTED PATH. At
    n in {7, 9, 11, 13}, random K-coefficient lambda of degree 2..7 and
    random K-coefficient (c, e): brute-force root counts against the twisted
    composition-lemma count (KN-TECH-54c38e with the twist carried) and
    against i3_injection_k, assert the comparison COUNT as well as the
    mismatch count (the false-pass failure mode KN-TECH-54c38e records).
    (C) WHAT EACH OUTCOME MEANS. NULL (predicted): every (B1)/(B2) count is
    within the bound, the (B2) histogram has no orbit peak and its mean is of
    order 1, every (B3) kernel dimension sits inside the dense-null band
    (max over 10^5 draws about 4 to 5; no structured candidate reaches 12),
    all fixtures hold -- the K-coefficient shapes at n = 131 are entered as
    sampled-null at the stated budgets, KN-TECH-54c38e Limit 2 and
    KN-FIND-617d78 boundary 4 are discharged for d <= 7 at n' = 33, and the
    successor existence question is reduced to the structured algebraic
    search named above. POSITIVE: a (B1) or (B2) candidate with N above
    max(d^4, 2), certificate-bearing (the root list re-verified in K), which
    refutes (A)-twisted and reopens KN-FIND-617d78; or a (B3) candidate with
    dim ker >= 12 (probability below 2^-100 under the null), which is the
    first K-coefficient member of the successor shape with a non-trivial
    K-fibre -- disclosed at once: such a base is NOT Frobenius-stable, so it
    reads the NO-ORBIT per-attempt budget (2^5.73 at m = 4, BRIEF-ROUND2
    section 1), not the 2^31.3 of a17f43, and a positive here is an object,
    not an attack. ARTIFACT: any fixture fails, or the (B4) instruments
    disagree with brute force, or the (B3) F_2-coefficient members show
    dim ker > 1 -- nothing is read.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the abscissa as a field element, with
    the factor base described implicitly as the K-root set of L (the QSP
    shape) or of L_R (the successor shape). Operation set Sigma =
    {sigma^{n'} composed with the twisted evaluation, i.e. x -> lambda(x)
    on the root set} for the QSP shape (the chain of KN-LIT-0a321c section
    3.1) and {sigma^a, the link z^2 + c z + e(x)} for the successor shape, as
    in IDEA-20260916-a17f43. Trichotomy: Class I partial action for the
    relation vector (index calculus); the root set is a coordinate-dependent
    (Class III) description. This record adds no new class and proposes no
    decomposition solve; it is a CENSUS of the description's size.
    LOSSY-PROJECTION TEST AGAINST SIGMA. For the QSP shape, K[X]/(L) -> the
    root set in K discards every root outside K (5c9d6e's mechanism);
    sigma^{n'} acts on the root set as x -> lambda(x) by the defining
    equation, so the retained part propagates; lossy because the K-root set
    is a proper subset of the roots. The twist changes nothing in this test
    (the equation x^{2^{n'}} = lambda(x) is what makes sigma^{n'} act, and it
    holds for K coefficients as written). For the successor shape the test is
    a17f43's, unchanged.
    PRICE THE ONE OPEN NUMBER. The size N of the description, exactly:
    2^{dim ker} for the linearized arms (a rank computation), deg G for the
    non-linearized arm (two gcds at degree d^4 <= 2401 over K).
    KN-OPEN-020 CLASS: IMPLICIT MEMBERSHIP, high-degree (2^33 over K for the
    QSP shape; 2^33 with a quadratic link for the successor). Description:
    the coefficients, 4 x 131 bits (linearized arms) or up to 8 x 131 bits
    (degree 7). Membership: 33 squarings plus O(d) field operations.
    Relation: NOT priced here; a positive (B3) outcome would be priced by the
    mixed volume of a17f43's layered system and would carry no orbit
    reduction. Descent, time, memory: as a17f43 for the successor shape;
    void for the QSP shape at n = 131 by KN-FIND-617d78 unless (A)-twisted
    fails.
    OFF-LIMITS COMPONENTS DECLARED. F2 as the family; the QSP chain and the
    a17f43 layered system as the (unrun) solvers; the Frobenius orbit
    reduction is NOT available to K-coefficient bases and this is stated as a
    cost, not hidden. The F_2-coefficient QSP at n = 131 is closed
    (KN-FIND-617d78, IDEA-20260918-6c07e1) and is used only as the fixture
    and the histogram contrast.
    WHY THIS IS NOT A REPACKAGING. The corpus has the twisted bound as a
    derivation and the K-coefficient census as a declared gap; it has no
    instrument that decides a successor candidate exactly at n = 131 (the
    rank arm), no statement that the linearized successor sub-shape sits
    entirely inside the bound's vacuous region, and no statement of the
    sampling ceiling that separates "exists under the random model" from
    "findable by sampling".
