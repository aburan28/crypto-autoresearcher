  falsification_conditions:
    - 'Any fixture returns a value other than its forced one: instrument defect, nothing read.'
    - 'Stage 1 reports a mismatch, or a comparison count below 800: instrument defect, nothing read.'
    - 'A certified K-coefficient lambda at (131, 33) with N above max(d^4, 2): the twisted bound (A) is false as stated; KN-FIND-617d78 is re-examined in a superseding record.'
    - 'A (B3) candidate with dim ker >= 12, kernel basis re-verified: the null prediction is false for the successor sub-shape; the object is handed to RQ-QSP-f9bbdb for pricing with the no-orbit budget.'
