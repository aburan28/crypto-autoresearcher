  minimal_test:
    design: >-
      STAGE 0 (zero compute): re-derive the twisted iterate, the bounds 8 / 4
      / 1, the monomial-twist fixture, the vacuity of the correspondence bound
      at (32, 4, 3), and the dense-null band by simulating 10^5 random
      131 x 131 F_2 matrices (seconds).
      STAGE 1 (toy validation, B4): n in {7, 9, 11, 13}, two field polynomials
      each, n' chosen as in KN-TECH-54c38e's table; 100 random K-coefficient
      lambda of degree 2..7 per cell and 100 random K-coefficient (c, e) per
      cell; brute-force counts versus the twisted composition count and
      i3_injection_k; assert the comparison count. Fixtures: Type 2 at n = 7;
      F_2 slices.
      STAGE 2 (B1, n = 131): 10^3 uniform K-coefficient linearized lambda per
      2-degree in {0, 1, 2} (d = 1, 2, 4); exact dim ker by rank; record the
      histogram and the maximum; re-verify every kernel vector by direct
      evaluation of L.
      STAGE 3 (B3, n = 131): 10^5 uniform (c, e) in K^4; structured
      sub-families (c, e_i in mu_263 union F_2, 264 x 8 candidates; c = 0
      with e in mu_263^3, 264^3 candidates; Frobenius-power patterns
      e_i = c^{2^{k_i}} for c in 10^3 random elements and all k_i in a
      32-element window); F_2-coefficient members as the fixture; histogram,
      maximum, and the coefficient support of every candidate above the null
      band.
      STAGE 4 (B2, n = 131): the F_2 fixture slice (244 candidates, must
      reproduce the histogram {0:62, 1:118, 2:60, 132:4}); then K-coefficient
      lambda of exact degree 3..7, at least 20 per degree in pure Python
      (priced below) and thousands if the C helper is available; the monomial
      twists as fixtures; N by i3_injection_k, roots re-verified for every
      N > 0.
      STAGE 5: three-row reading and the hand-forward of the structured
      search.
      OUTCOME TABLE. NULL (predicted): all counts inside the bounds, no orbit
      peak, (B3) inside the null band, fixtures exact -- boundary 4 of
      KN-FIND-617d78 and Limit 2 of KN-TECH-54c38e discharged at the stated
      budgets; the K-coefficient successor existence question reduced to the
      sparse-composition search. POSITIVE: a certified (B1)/(B2) violation of
      (A)-twisted, or a (B3) candidate with dim ker >= 12 -- independent
      review before any further claim, and the no-orbit budget stated beside
      it. ARTIFACT: any fixture or (B4) disagreement -- nothing read.
      FALSIFICATION THRESHOLD, fixed before any run: N > max(d^4, 2) on any
      certified candidate; dim ker >= 12 on any (B3) candidate; any nonzero
      mass at 132 in the K histogram.
      COST (estimate, order of magnitude): implementation low to medium (a
      general-n GF(2^n) class with bit-packed ints, about 150 lines, plus a
      rank routine and drivers over qspcore.py's K-layer); compute: rank arms
      about 1 ms per candidate in pure Python, so 10^5 draws in minutes and
      the 264^3 structured arm in hours; the (B2) arm at n = 131 costs about
      131 modular squarings of a degree-2401 polynomial over K per candidate,
      about 2^30 K-multiplications, of order an hour per candidate in pure
      Python -- hence 20 per degree as the pure-Python budget and `missing: a
      K-coefficient port of experiments/EXP-QSP-33b442/implementation/gf2rc.c`
      for a census of thousands -- an estimate, not a measurement.
    cell:
      curve: >-
        No curve is used; the object is the field F_2[z]/(z^131 + z^13 + z^2
        + z + 1) of ECC2K-130 (RQ-QSP-f9bbdb) and toy fields F_{2^n}, n in
        {7, 9, 11, 13}, two field polynomials each.
      m: not applicable (a census of the description; a positive (B3) inherits a17f43's m = 4 at n' = 33 with the no-orbit budget)
      l: not applicable
      factor_base: >-
        K-root sets of X^{2^33} + lambda(X), lambda in K[X], deg <= 7; kernels
        of x^{2^33} + c x^{2^32} + e(x), c in K, e linearized of 2-degree <= 2
        over K.
      targets: not applicable (no decomposition is attempted)
      seeds: 2026092691.. per arm, recorded; structured arms are exhaustive and seed-free
    instrument:
      - experiments/EXP-QSP-33b442/implementation/qspcore.py (K-layer, twisted iterate, i3_injection_k, i2_gcd_k, i1_brute_k, verify_roots, c6_linearized_N)
      - 'NEW: general-n GF(2^n) class, 131 x 131 F_2-rank routine, drivers and fixtures (about 250 lines, pure Python)'
      - 'missing: a K-coefficient port of experiments/EXP-QSP-33b442/implementation/gf2rc.c for the (B2) census beyond tens of candidates per degree'
    procedure:
      - 1. Stage 0 derivations, fixtures and the dense-null simulation.
      - 2. Stage 1 toy validation with the comparison count asserted.
      - 3. Stage 2 linearized QSP arm at n = 131 by rank; kernel vectors re-verified.
      - 4. Stage 3 linearized successor arm at n = 131, uniform and structured; support of every candidate above the null band recorded.
      - 5. Stage 4 F_2 fixture histogram, then K-coefficient non-linearized arm within the pure-Python budget; roots re-verified.
      - 6. Stage 5 three-row reading; the structured algebraic search named as the successor.
    metrics:
      - name: N_exact
        unit: K-roots (integer)
        definition: exact number of distinct K-roots of the candidate polynomial (deg G, or 2^{dim ker} for linearized arms)
      - name: histogram
        unit: counts per N
        definition: distribution of N_exact per arm, with the mass at N = 132 reported separately
      - name: kdim_max
        unit: integer
        definition: maximum kernel dimension per (B3) sub-family, with the attaining candidate's coefficient support
      - name: fixture_pass
        unit: boolean per fixture
        definition: each fixture returns its forced value
      - name: comparison_count
        unit: integer
        definition: number of brute-force comparisons actually performed in Stage 1 (must be at least 800)
    controls:
      - >-
        F_2-coefficient slices at every cell (the measured baseline; the
        orbit peak must reappear there and nowhere else).
      - >-
        Dense random linearized polynomials of 2-degree 33 at n = 131 (the
        null for kernel dimension), 10^5 draws.
      - >-
        Monomial twists c X^d (forced N = 2) and constants (forced N = 1).
      - >-
        Type 2 positive fixtures at n = 7 and n = 31 through the rank
        instrument.
      - >-
        Brute-force ground truth at n <= 13 with the comparison count
        asserted.
      - >-
        Relabelled Z/NZ control: not applicable (no group-structure claim; a
        field-polynomial census), stated rather than omitted.
    outcomes:
      positive: >-
        A certified violation of the twisted bound or a linearized successor
        member with dim ker >= 12; reviewed independently; priced with the
        no-orbit budget.
      negative: >-
        The predicted null at the stated budgets; the two declared gaps are
        discharged for the sampled families and the existence question is
        handed forward as a structured search.
      artifact: >-
        Any fixture, F_2-slice or brute-force disagreement; nothing read.
    falsification_threshold: >-
      Fixed before any run: N > max(d^4, 2) on a certified candidate; dim ker
      >= 12 on any (B3) candidate; nonzero mass at N = 132 in any K-coefficient
      histogram; any Stage 1 mismatch.
    estimated_cost:
      implementation: low
      compute: >-
        ESTIMATE, order of magnitude: minutes for the rank arms at 10^5
        draws, hours for the 264^3 structured arm, about an hour per
