  assumptions:
    - >-
      The twisted iterate is Lambda_{k+1} = Lambda_k^{(33)} o lambda, with
      f^{(k)} raising coefficients to the 2^k-th power, so that x^{2^{33k}}
      = Lambda_k(x) on the root set; re-derived in Stage 0.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 as the family; the QSP chain and the
      layered system as unrun solvers; the F_2-coefficient closures as
      fixtures only.
    - >-
      A K-coefficient base has no Frobenius orbit reduction; any positive
      outcome is priced with the no-orbit budget.
    - >-
      Pure Python suffices for every rank arm; the non-linearized arm at
      n = 131 is priced per candidate and declared as needing a C helper for
      a census of thousands.
  proof_search_map:
    bottleneck: >-
      Whether any K-coefficient member of the two shapes at n = 131 has a
      K-fibre materially above the bulk: above max(d^4, 2) for the QSP shape
      (a refutation), or dim ker >= 12 for the linearized successor sub-shape
      (an object). Neither is reachable by sampling if it exists only at the
      random-model rate; the census settles the bulk and the structured
      sub-families, and names the algebraic search for the rest.
    baseline_embedding:
      parameter_slice: >-
        Coefficients in F_2 are the exact slice already measured: the QSP
        shape at n' = 33 gives max N = 132 with the orbit histogram
        (KN-FIND-617d78 section 3), and the linearized successor sub-shape
        gives dim ker <= 1 (Proposition 2 / IDEA-20260918-9abf42). Both must
        be reproduced by the instruments of this record on the F_2 slice
        before any K-coefficient cell is read.
      reproduction_check: >-
        Frozen fixtures: the F_2 histogram at n' = 33 (I3 instrument, 244
        candidates, about 6 seconds by KN-TECH-54c38e); the monomial twists
        c X^d with exactly 2 roots; Type 2 at n = 7 (8) and n = 31 (2^15)
        through the rank instrument; F_2-coefficient successor members with
        dim ker <= 1; the (B4) brute-force agreement at n <= 13 with the
        comparison count asserted.
    observation_collision:
      observable: >-
        N per candidate (exact), the histogram per arm, the maximum per arm,
        and the kernel-dimension distribution of (B3) against the dense null.
      distinct_preimage_search: >-
        Two candidates with the same N and different structure are the norm;
        the collision that matters is a large kernel arising from (i) genuine
        sparse-composition structure or (ii) a degenerate draw (c = 0 and e
        with F_2 coefficients, or e = 0). Separated by recording the
        coefficient support of every candidate above the null band and by
        the F_2 and monomial fixtures.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the shape fixed and vary the coefficient field: F_2 (measured,
          orbit-structured) versus K (this record, no orbits). The intrinsic
          invariant distinguishing them is the orbit peak at 132 and, for
          the successor sub-shape, the kernel-dimension distribution against
          the dense null.
        predicted_gain: >-
          Converts KN-FIND-617d78 boundary 4 and KN-TECH-54c38e Limit 2 from
          declared gaps into measured cells at the stated budgets; no
          exponent.
      - transform: representation_reduction
        proposed_object: >-
          For the linearized arms, replace the degree-2^33 polynomial by the
          131 x 131 F_2 matrix of the map L; encoding exact; completeness and
          soundness trivial (the kernel IS the root set); transfer to any
          linearized shape at any n; cost loss none.
        predicted_gain: >-
          Exact N per candidate in about a millisecond, which is what makes a
          census of 10^5 to 10^7 candidates affordable in pure Python.
    quantifier_order: >-
      FORALL lambda in K[X] of degree d <= 7 at (131, 33): N <= max(d^4, 2)
      (the derivation, tested on every sampled candidate). EXISTS-search over
      the (B3) sampled and structured sub-families for dim ker >= 12; the
      record PREDICTS none is found and states that this is a statement about
      the sampled sub-families, not about the shape.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At n = 131, n' = 33: every one of [N1] sampled K-coefficient lambda
        of degree 1..7 has N <= max(d^4, 2), the histogram is [h] with no
        mass at 132; every one of [N2] sampled and [N3] structured linearized
        successor candidates has dim ker <= [k_max] against a dense-null
        maximum of [k_null]; all fixtures hold." It certifies nothing about
        unsampled candidates, nothing about non-linearized successor members
        (c, e non-constant, non-linearized), and nothing about a solver.
      nearby_object_control: >-
        The F_2-coefficient slice at the same (n, n') is the nearby object on
        which the conclusion "no orbit peak" is KNOWN FALSE (four candidates
        with N = 132); the instruments must return that peak on the F_2 slice
        and its absence on the K slice. An instrument returning similar
        histograms on both has not seen the coefficient field.
    proof_obligations:
      - claim: The twisted bound gives dim ker <= 8, 4, 1 at d = 4, 2, 1 for linearized K-coefficient lambda at (131, 33).
        responsibility: correctness
      - claim: lambda = c X^d (d = 1..7) has exactly two K-roots and lambda = c exactly one, by gcd(2^33 - d, 2^131 - 1) = 1.
        responsibility: correctness
      - claim: The correspondence bound at (32, 4, 3) is d_0^5 + 2^34, above 2^33, hence vacuous for the linearized successor sub-shape.
        responsibility: size
      - claim: The dense-null kernel-dimension band is re-derived by simulation at n = 131 (10^5 random matrices) in Stage 0.
        responsibility: baseline
      - claim: The random-model count 2^{524 - k^2} and the 2^-484 per-draw probability at k = 22 are stated as model arithmetic, not as facts about the family.
        responsibility: scope
      - claim: Every reported root count above the null band carries a re-verified root list (verify_roots) or the kernel basis vectors checked by direct evaluation.
        responsibility: correctness
      - claim: The (B4) brute-force comparison asserts its comparison count.
        responsibility: baseline
