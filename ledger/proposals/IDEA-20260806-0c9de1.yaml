idea:
  id: IDEA-20260806-0c9de1
  question_id: RQ-ECDLP-002
  added: '2026-08-06'
  title: >-
    A NEW REPRESENTATION AND THE DECOMPOSITION IT INDUCES: an ECDLP instance IS
    a pair of F_p-points of X_1(N) over one point of X_0(N), so the DLP is
    exactly the diamond-operator coordinate of a torsor -- and three forced
    values (rational torsors are trivial, the diamond action is free, and
    Eichler-Shimura pins only the KNOWN diamond <p>) decide before any compute
    whether this lens can carry a single bit
  class: representation

  claim: >-
    (A) THE REPRESENTATION. Let E/F_p, let P in E(F_p) have prime order N, and
    let Q = kP. The pair (E, P) is an F_p-point of the modular curve X_1(N),
    which parametrises pairs (elliptic curve, point of exact order N); the pair
    (E, <P>) is an F_p-point of X_0(N), which parametrises (elliptic curve,
    cyclic subgroup of order N). Since <Q> = <P>, the two points (E, P) and
    (E, Q) of X_1(N) have the SAME image in X_0(N). The covering
    X_1(N) -> X_0(N) is Galois with group (Z/N)^*/{+-1}, acting by the diamond
    operators <d>: (E, P) |-> (E, dP). Therefore
        <k> (E, P) = (E, Q),
    i.e. THE DISCRETE LOGARITHM IS, LITERALLY AND WITHOUT APPROXIMATION, THE
    COORDINATE OF ONE POINT RELATIVE TO ANOTHER IN A TORSOR UNDER
    (Z/N)^*/{+-1}. An ECDLP instance is a pair of rational points on a curve of
    genus growing like N^2/24, and the unknown is a deck transformation.

    (B) THE DECOMPOSITION THIS INDUCES, WHICH IS THE POINT AND IS DIFFERENT IN
    KIND FROM EVERY DECOMPOSITION THIS PROGRAM HAS TRIED. Every decomposition in
    the ledger splits an OBJECT: a point into factor-base points (index
    calculus), an exponent into halves (BSGS/claw), a group order into prime
    powers (Pohlig-Hellman), an isogeny into two of bounded degree
    (Wesolowski). This one splits the PROBLEM along a covering map:
        solve the ECDLP  =  forget the point (descend to X_0(N))
                            THEN recover the torsor coordinate.
    The first half is free and loses exactly the answer; the second half is the
    whole problem. That is a fibration of the DLP, not a factorisation of an
    element, and the research question is whether the fibre carries any
    computable structure the group does not.

    (C) THREE FORCED VALUES, ALL DERIVABLE AT ZERO COMPUTE, WHICH DECIDE THE
    LENS BEFORE ANYTHING IS BUILT. This program's house style is to compute an
    observable's forced value before measuring it, and this lens admits three:
      F1 -- RATIONALITY TRIVIALISES THE TORSOR. A torsor under a finite group
        scheme over F_p is classified by a class in Galois cohomology, and a
        torsor WITH A RATIONAL POINT is trivial. Both (E, P) and (E, Q) are
        F_p-rational by hypothesis. Hence the cohomology class is 0 and DESCENT
        CONTRIBUTES EXACTLY ZERO BITS. Every "use Galois descent on the fibre"
        idea is dead before it is written, and the reason fits on one line.
      F2 -- THE ACTION IS FREE, SO SINGLE-POINT INVARIANTS ARE USELESS. For N
        prime > 3 and E with Aut(E) = {+-1}, the diamond action on the fibre is
        free and transitive. A free transitive action has no distinguished
        point, so any function of a SINGLE fibre point that is diamond-invariant
        is constant on the fibre and carries no information about k; and any
        function that is NOT diamond-invariant is, by definition, a function of
        the point P itself -- which is the group representation we started from.
        The lens therefore cannot produce a genuinely new single-point
        observable, only functions of the PAIR.
      F3 -- EICHLER-SHIMURA PINS ONLY THE DIAMOND YOU ALREADY KNOW. The one
        structural relation the modular world supplies in characteristic p is
        the congruence relation, which expresses the Hecke correspondence at p
        in terms of Frobenius and the diamond operator <p>. The diamond it
        involves is <p mod N> -- and p and N are PUBLIC. So the single deepest
        theorem available in this representation relates known quantities to
        known quantities and says nothing about <k>. This is the sharpest of the
        three because it is the place a reader would expect the payoff to be.
    IF ALL THREE HOLD AS STATED, the representation is a genuine change of
    viewpoint that contributes zero bits, and that is a CLOSURE at the
    docs/inventor-protocol.md section 4 standard -- named obstruction (three of
    them), argument, and the forward guidance in (D). It is emphatically NOT a
    fatigue report: nothing was screened and rejected, three quantities were
    derived.

    (D) FORWARD GUIDANCE -- WHAT STAYS OPEN, STATED PRECISELY BECAUSE F1-F3 EACH
    HAVE A HYPOTHESIS THAT CAN BE REMOVED.
      - F1 assumes the instance is RATIONAL. In the geometric/generic setting --
        a family over a base, the function-field version this program already
        works in through the XEDN lane -- the instance need not have a rational
        point and the class need not vanish. That is the live corner.
      - F2 assumes N PRIME and Aut(E) = {+-1}. For composite N the fibre is a
        torsor under (Z/N)^*/{+-1} which is not cyclic, and its subgroup
        structure gives intermediate covers X_1(N) -> X_Delta(N) -> X_0(N) that
        have no analogue in the prime case; and at j = 0, 1728 the extra
        automorphisms make the action non-free. Both are genuinely different
        geometry, and Pohlig-Hellman does NOT trivially dispose of the first
        because the intermediate covers are not products.
      - F3 assumes we only use the congruence relation at p. Hecke operators
        T_ell for ell != p also act, they commute with the diamonds, and their
        action on the fibre is by correspondences of degree ell + 1. Whether any
        T_ell-eigenstructure separates fibre points is not settled by F3 and is
        the one computational question this proposal actually queues.

    (E) WHAT THIS IS NOT. NOT an attack. NOT a claim that modular curves are
    irrelevant to cryptography. NOT a claim that the ECDLP is hard. It is a
    representation, three derivations that bound what it can do, and one
    measurement for the corner the derivations do not reach.

  discriminated_from:
    - >-
      The xedni-calculus / Mordell-Weil lane (RQ-XEDN-001..004 and the
      IDEA-20260805 series around it). Those lift to a family of curves over a
      base and study Mordell-Weil relations among sections. This proposal does
      not lift anything: it re-reads the SAME finite-field instance as a pair of
      points on a modular curve in the same characteristic. The two meet only in
      the open corner named in (D), and the record says so rather than claiming
      independence.
    - >-
      The degeneration obstructions recorded as H059 / H062 in
      ledger/REVIEW-H100-20260717.md line 147, verdict "sound": any fibre map
      usable for DLP transport would be a prime-to-ell isogeny, hence an
      ell-torsion isomorphism. That closes transporting the instance to a
      DEGENERATE fibre -- in the present language, to a CUSP of X_1(N). It is
      cited here as already-closed and is the reason the cuspidal route is not
      proposed. F1-F3 are about the smooth fibre and are not implied by it.
    - >-
      KN-TECH-032 (pairing transfers). The Weil pairing does appear in the
      modular picture, through the identification of the fibres of
      X_1(N) -> X_0(N) with primitive N-th roots of unity in the Weil-pairing
      normalisation. That connection is the reason F1 must be checked in the
      correct group scheme (mu_N versus Z/N), and getting it wrong is the most
      likely technical error in the whole proposal; it is flagged in the
      confounders rather than left to chance.
    - >-
      "modular curve", "X_1(N)" and "diamond operator" return ZERO hits across
      ledger/proposals, ledger/hypotheses, knowledge/techniques,
      knowledge/findings and knowledge/open-problems as of merge-base 0c856274.
      The representation is absent from this program's 88 recorded techniques.

  object_first_candidate:
    tracked_object: >-
      THE FIBRE COORDINATE: the class of (E, P) in the fibre of
      X_1(N) -> X_0(N), i.e. the torsor coordinate under (Z/N)^*/{+-1}. It is
      followed under the two available families of operations -- the diamond
      action itself, and the Hecke correspondences T_ell.
    lossiness: >-
      THE DESCENT X_1(N) -> X_0(N) IS LOSSY AND LOSES EXACTLY THE ANSWER: the
      fibre has phi(N)/2 elements and forgetting the point discards precisely
      log2(phi(N)/2) bits, which is the DLP. Under the inventor protocol's
      section 2 test this is the maximally interesting kind of lossy projection
      -- and F2 is the statement that the retained part propagates
      deterministically but carries nothing, which is exactly the
      "change of coordinates, not a new object" failure the test is designed to
      catch. Recording that this lens FAILS section 2 in a precise, derivable
      way is the deliverable.
    propagation: >-
      Deterministic under the diamond action (it is a group action) and under
      Hecke correspondences up to their degree, i.e. branching with factor
      ell + 1 for T_ell. In the IDEA-20260806-c5d183 trichotomy this object is
      CLASS II (branching) under Hecke and CLASS I (partial action) under
      diamonds, and naming which cell it occupies is part of the deliverable
      rather than an afterthought.
    survival_score: >-
      Survives arbitrarily many diamond steps -- it is defined by them. Survives
      Hecke steps with branching ell + 1, so log(budget)/log(ell+1) steps before
      the branching exhausts any budget. Dies entirely as a source of
      information under F1-F3 if those hold.

  mechanism: >-
    STEP 1 -- THE DICTIONARY, WRITTEN OUT ONCE AND CHECKED. Establish
    explicitly, at small N where everything is enumerable: X_1(N)(F_p) as a set,
    the map to X_0(N)(F_p), the diamond action, and the identification of the
    fibre through (E, P) with the ECDLP instance set. This is bookkeeping and is
    where a sign or a quotient-by-{+-1} error would silently invalidate
    everything downstream, so it is done first and verified by exhaustive
    comparison against direct group computation on E(F_p).

    STEP 2 -- DERIVE F1 IN THE CORRECT GROUP SCHEME. The fibre is a torsor under
    (Z/N)^*/{+-1} as an abstract group, but the Galois action on it is what
    decides triviality, and the Weil-pairing normalisation makes mu_N appear.
    Write the Galois module structure explicitly, then apply the standard fact
    that a torsor with a rational point is trivial. The conclusion "descent
    contributes zero bits" is only as good as this step.

    STEP 3 -- DERIVE F2 AND ITS EXCEPTIONS. Freeness fails exactly when E has
    extra automorphisms (j = 0, 1728) or when N is not prime. Enumerate the
    exceptions rather than assuming them negligible: on a standardised
    cryptographic curve j is neither 0 nor 1728 and N is prime, so the
    exceptions are empty THERE, but they are not empty in general and the
    forward guidance in (D) depends on saying which.

    STEP 4 -- DERIVE F3 AND STATE WHAT IT DOES NOT COVER. Write the congruence
    relation and observe that the diamond appearing is <p mod N>, public. Then
    state precisely the residual question: does the action of T_ell for small
    ell != p separate two points of the same fibre in a way computable in less
    than DLP time? This is the ONLY computational question queued, and it is
    queued because F3 does not answer it.

    STEP 5 -- THE ONE MEASUREMENT. At small N and small p where X_1(N)(F_p) is
    enumerable, compute the T_ell action on fibres for the first few ell and
    measure whether any eigen-decomposition separates fibre points, against the
    null of a randomly permuted correspondence of the same degree. Predicted
    outcome: no separation, because the diamonds commute with Hecke and
    therefore Hecke acts on the fibre through the quotient by the diamond
    action -- which would make the separation identically zero, a FORCED VALUE
    to be derived in Step 4 and then confirmed, not discovered. If the
    derivation says forced-zero and the measurement disagrees, the
    implementation is wrong and the run halts.

  novelty_status: speculative
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/ for "modular curve", "X_1(N)",
      "X_0(N)", "diamond operator", "Hecke", "Eichler-Shimura", "congruence
      relation", performed 2026-08-06 against merge-base 0c856274.
    results: >-
      "modular curve", "X_1(N)" and "diamond operator": ZERO hits in proposals,
      hypotheses, techniques, findings and open problems. "Hecke" occurs in the
      H-ALISO autolab series and in Brandt-matrix contexts on the supersingular
      side, never in connection with modular curves over the ECDLP instance.
      No record represents an ECDLP instance as a point of a modular curve.
    verdict: >-
      SPECULATIVE, and deliberately so. The mathematics used is entirely
      classical -- modular curves, diamond operators, the congruence relation,
      torsor triviality -- and NONE of it is claimed as new. The identification
      of an ECDLP instance with a fibre coordinate is elementary enough that it
      is very likely folklore, and this record does NOT claim otherwise. What is
      claimed is that it is absent from this program's corpus, that its three
      forced values have never been written down here, and that writing them
      down converts an unexamined lens into a closure with named obstructions.
      A Stage-0 literature check is part of the design and a hit would improve
      the record rather than kill it.

  null_object_control: >-
    (1) FORCED-VALUE NULL, DERIVED BEFORE MEASURING: the Hecke separation
    statistic of Step 5 has a derivable value (predicted: identically zero,
    because Hecke commutes with the diamonds). Deriving it first is what makes
    the measurement able to fail. (2) STRUCTURE-DESTRUCTION NULL: replace T_ell
    by a random correspondence of the same degree on the same fibre set. If the
    random correspondence separates fibre points as well as T_ell does, the
    separation statistic is measuring degree, not Hecke structure. (3)
    INSTRUMENT NULL: an instance where the answer is known by construction --
    k = 1, so (E, P) = (E, Q) and the fibre coordinate is the identity. Any
    pipeline reporting a non-identity coordinate there is broken and nothing is
    reported.

  assumptions:
    - >-
      N is prime, N > 3, and Aut(E) = {+-1}, so the diamond action is free.
      Exceptions are enumerated rather than dismissed.
    - >-
      The reduction of X_1(N) mod p is well behaved for the (N, p) pairs used,
      i.e. p does not divide N and the relevant moduli interpretation survives
      reduction. Toy pairs are chosen to satisfy this and the choice is recorded.
    - >-
      "Contributes zero bits" is a statement about the SPECIFIC constructions
      named (Galois descent on the fibre; single-point diamond-invariant
      functions; the congruence relation at p). It is not a statement that no
      construction whatsoever can extract information from this representation,
      and the write-up must not slide into that stronger reading.

  proof_search_map:
    bottleneck: >-
      Whether any computable function on X_1(N)(F_p), evaluable in less than DLP
      time, is non-constant on a single fibre. F1-F3 rule out three families;
      the bottleneck is whether the enumeration of families is anywhere near
      complete, and the record does not claim it is.
    baseline_embedding:
      parameter_slice: >-
        N = 5, 7 at small p, where X_1(N) has genus 0 and the whole fibre
        structure is enumerable by hand. This slice must reproduce the ordinary
        group-theoretic DLP exactly.
      reproduction_check: >-
        Exhaustive: for every (E, P, k) in the toy range, check that the
        computed fibre coordinate equals k mod +-1 as an integer. Exact
        comparison, no tolerance, every instance, not a sample.
    observation_collision:
      observable: >-
        The image of an ECDLP instance in X_0(N), together with any proposed
        fibre-level statistic.
      distinct_preimage_search: >-
        THE COLLISION IS THE THEOREM HERE, NOT A FALSIFIER. By construction the
        phi(N)/2 distinct instances (E, P, kP) for varying k all share the same
        X_0(N) image; the fibre is a complete collision class. So the
        observation-collision audit does not need a search -- it has a closed
        form, and its size phi(N)/2 IS the number of bits the descent discards.
        What must be searched for is the opposite: a fibre-level statistic with
        FEWER collisions than phi(N)/2, which is exactly what F2 predicts cannot
        exist among diamond-invariant single-point functions.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The ECDLP as the torsor-coordinate problem for X_1(N) -> X_0(N), with
          separate encoding, completeness, soundness, transfer and cost-loss
          obligations.
        predicted_gain: >-
          Predicted gain is ZERO BITS under F1-F3, and the record says so in
          advance. The value is the derivation, not the gain; a transform whose
          predicted gain is zero and which says so is an honest transform.
      - transform: observable_fiber
        proposed_object: >-
          Hold the X_0(N) image fixed, vary the forgotten structure (the choice
          of P within its subgroup), and look for an intrinsic invariant
          distinguishing the resulting X_1(N) points beyond the tautological one.
        predicted_gain: >-
          F2 predicts none exists among diamond-invariant functions. Any
          exception found would be a genuine new handle and would immediately
          supersede this record's conclusion.
    quantifier_order: >-
      The claim that matters, with its quantifiers explicit:
      FORALL E/F_p with Aut(E) = {+-1}, FORALL primes N > 3 with N | #E(F_p),
      FORALL functions f on X_1(N)(F_p) that are invariant under the diamond
      action, FORALL P, P' in the same fibre: f(E, P) = f(E, P').
      This is F2 and it is nearly a tautology once freeness and transitivity are
      established -- which is precisely why it is worth stating: the content is
      in NOTICING that every "new invariant of the modular point" anyone would
      propose is diamond-invariant unless it uses P directly. The order matters:
      swapping to EXISTS f FORALL P would be a different and false-looking claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Galois descent on the fibre, diamond-invariant single-point functions,
        and the congruence relation at p each contribute zero bits toward k, for
        rational instances with N prime and Aut(E) = {+-1}." It can NEVER
        certify that the modular representation is useless in general, and the
        write-up must not say so.
      nearby_object_control: >-
        The composite-N case, or j = 0 / j = 1728, where the action is not free.
        The method must give a DIFFERENT answer there. A derivation that
        produces "zero bits" uniformly, including where the action is not free,
        has not used freeness and is therefore not tracking the real structure --
        it is asserting a conclusion. This is the single sharpest check on
        whether F2's derivation is real, and it costs nothing.
    proof_obligations:
      - claim: The fibre coordinate equals k mod +-1.
        responsibility: correctness
      - claim: The torsor is trivial because the instance is rational.
        responsibility: correctness
      - claim: The diamond action is free for N prime > 3, Aut(E) = {+-1}.
        responsibility: correctness
      - claim: The congruence relation involves only <p mod N>.
        responsibility: baseline
      - claim: Hecke acts on fibres through the diamond quotient.
        responsibility: correctness
      - claim: Conclusions are scoped to rational instances with prime N.
        responsibility: scope

  predictions:
    - metric: >-
        Galois-cohomological obstruction class of the fibre torsor for a rational
        ECDLP instance
      direction: different
      minimum_effect: >-
        Exactly trivial, with zero exceptions across every tested (N, p, E). One
        exception refutes F1 and would be a major finding, because a non-trivial
        class is computable structure attached to the instance.
    - metric: >-
        number of diamond-invariant single-point functions found to be
        non-constant on a fibre
      direction: different
      minimum_effect: >-
        Exactly 0 for N prime with Aut(E) = {+-1}, and STRICTLY GREATER THAN 0
        for at least one non-free case (j = 0 or composite N). Both halves are
        required: the second is what shows the derivation used freeness rather
        than assuming the conclusion.
    - metric: >-
        Hecke separation statistic on fibres, T_ell for ell in a declared small
        set, against the random-correspondence null
      direction: different
      minimum_effect: >-
        Predicted identically zero by derivation. The random-correspondence null
        must give a non-zero value, or the statistic cannot discriminate and no
        conclusion may be drawn from its vanishing.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): literature check for an existing statement of the
      X_1(N) fibre-coordinate identification for the ECDLP; record whatever is
      found. Then derive F1, F2, F3 on paper, including the group scheme in F1
      and the exception list in F2.
      STAGE 1 (minutes, HARD GATE): build X_1(N)(F_p) and X_0(N)(F_p)
      explicitly for N in {5, 7, 11, 13} and small p; verify by exhaustive
      comparison that the fibre coordinate equals k mod +-1 for EVERY instance.
      Any mismatch halts everything.
      STAGE 2 (minutes, HARD GATE): run the k = 1 instrument null.
      STAGE 3 (minutes): verify F1 and F2 computationally, INCLUDING the
      non-free control at j = 0 and at composite N, where the answers must
      differ.
      STAGE 4 (minutes): compute T_ell on fibres for small ell, alongside the
      random-correspondence null, and compare against the derived forced value.
    controls:
      - k = 1 instrument null -- the coordinate must be the identity
      - >-
        non-free control at j = 0, 1728 and at composite N -- the derivation
        must give a different answer there
      - >-
        random-correspondence null of the same degree as T_ell
      - >-
        exhaustive rather than sampled verification at every toy (N, p)
    required_metrics:
      - fibre coordinate versus k mod +-1, per instance, exact match rate
      - torsor obstruction class per instance
      - count of non-constant diamond-invariant functions, free and non-free cases
      - Hecke separation statistic and its random-correspondence null
      - genus and fibre size per (N, p), for feasibility bookkeeping

  falsification_conditions:
    - >-
      The fibre coordinate does not equal k mod +-1 on some toy instance. The
      dictionary is wrong; the record is superseded, not amended, and nothing
      downstream is reported.
    - >-
      A non-trivial torsor class is found for a rational instance. F1 is refuted
      and the finding is major: it would be computable structure attached to an
      ECDLP instance and would become the successor proposal immediately.
    - >-
      A diamond-invariant single-point function is found non-constant on a fibre
      in the free case. F2 is refuted; same disposition, same escalation.
    - >-
      The non-free control gives the SAME answer as the free case. The
      derivation did not use freeness and is therefore not established, whatever
      its conclusion; the line halts.
    - >-
      The Hecke separation statistic is non-zero where the derivation forces
      zero. Implementation error, or the derivation is wrong. The run halts
      either way and the discrepancy is recorded.

  confounders:
    - >-
      Group-scheme confusion in F1. The fibre is naturally a torsor under a
      group that the Weil pairing identifies with roots of unity, and the Galois
      action on mu_N differs from that on Z/N. Getting this wrong flips the
      conclusion of F1 in either direction. This is the single most likely
      technical error in the proposal and Stage 0 addresses it explicitly.
    - >-
      Genus growth. X_1(N) has genus of order N^2/24, so for cryptographic N the
      curve cannot be written down. All computation is confined to toy N and the
      derivations are what must carry to large N -- which means a derivation
      error cannot be caught by the toy computations at cryptographic scale, and
      the record must not pretend otherwise.
    - >-
      Reading "zero bits from these three families" as "zero bits from modular
      curves". The families are named for exactly this reason.
    - >-
      The +-1 quotient. Working on X_1(N) rather than a finer cover recovers k
      only up to sign; this is harmless for the DLP but must be handled
      consistently or the exact-match verification in Stage 1 will fail for
      spurious reasons.

  interpretation_limits:
    - >-
      Everything is scoped to rational instances, N prime > 3, Aut(E) = {+-1},
      and the three named constructions.
    - >-
      The toy computations verify the DICTIONARY and the CONTROLS. They do not
      verify the derivations at cryptographic N, which no computation in this
      proposal reaches.
    - >-
      A zero-bit conclusion is a statement about this lens, not about the ECDLP.

  heuristic_assumptions: []

  target_complexity:
    time_exponent: >-
      NOT AN EXPONENT PROPOSAL, AND THE PREDICTED GAIN IS EXPLICITLY ZERO BITS.
      No attack is proposed. If F1, F2 or F3 is refuted, the resulting object
      would need its own record with its own exponent claim; this one makes none.
    memory_exponent: >-
      Toy only: X_1(N)(F_p) for N <= 13 and small p fits in megabytes. At
      cryptographic N the curve has genus ~ N^2/24 and cannot be represented at
      all, which is a hard barrier to any computational use of this lens and is
      stated as such rather than left implicit.
    best_known: >-
      rho at p^{1/2} time and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
      p^{1/2} time and memory (KN-TECH-031); the generic lower bound
      (KN-TECH-005). None is moved.
    hidden_overhead: >-
      The genus-N^2/24 barrier is the honest overhead and it is fatal to direct
      computation at cryptographic size. Any future use of this representation
      must be through derivations that never construct the curve.
    tradeoff_note: >-
      Not applicable; no algorithm is produced.

  dominated_by: >-
    As an ATTACK: mounts none, so dominated on every axis by every row of the
    prime-field frontier -- rho at p^{1/2} time and O(1) memory, BSGS at
    p^{1/2} time and memory, Pollard kangaroo on intervals, every index-calculus
    variant in the ICEX lane, and the preprocessing frontier. Checked across
    time, memory and data/query; nothing here touches any of the three.
    As a CLOSURE: nothing in this corpus dominates it, because no record has
    examined the modular representation at all. It is, however, dominated in
    IMPORTANCE by the closures that bound whole families rather than one lens --
    IDEA-20260806-c5d183's trichotomy in particular -- and this record is
    honestly a leaf under that tree rather than a rival to it.
  sota_delta: >-
    Zero speedup; predicted information gain zero bits, derived rather than
    measured. Deliverable delta, as counts: 1 representation absent from 88
    recorded techniques, 3 forced values each derivable at zero compute, 1
    residual computational question (Hecke separation) with a derived forced
    value and a matched null, and 3 named open corners (geometric/non-rational,
    composite N, extra automorphisms). Stated as counts because "a new way to
    look at the problem" is not a value.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that F1 holds as stated -- torsor triviality from a rational point is
    standard, and the risk is the group-scheme bookkeeping rather than the
    mathematics. 0.9 that F2 holds. 0.7 that F3 holds in the sharp form stated,
    since the congruence relation's exact shape in this reduction is the piece
    most likely to be misremembered and it has NOT been re-read in this session.
