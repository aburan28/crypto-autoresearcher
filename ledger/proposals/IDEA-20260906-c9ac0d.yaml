      2012/294 abstract page and the AIMS landing page of
      Galbraith-Wang-Zhang 2017 opened; both full texts NOT opened after
      repeated attempts).
    results: >-
      No ledger record measures any BSGS-variant constant exhaustively or
      treats the negation constant as a separate measured parameter. The
      opened GWZ page lists the negation-map grumpy constant 0.9 as
      conjectural, so the negation discrimination is open in the one
      secondary source opened; whether GWZ's own experiments were
      exhaustive or sampled is unknown to this record.
    verdict: >-
      UNVERIFIED. The instrument is elementary; its value is the certified
      column and the declared model, which no opened source provides.

