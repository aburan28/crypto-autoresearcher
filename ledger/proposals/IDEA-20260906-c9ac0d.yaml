idea:
  id: IDEA-20260906-c9ac0d
  question_id: RQ-GRUMPY-964876
  goal_id: null
  goal_id_note: >-
    RQ-GRUMPY-964876 has no bound GOAL record at filing time (context file
    for TASK-20260906-faad4d). Left null deliberately.
  added: '2026-09-06'
  title: >-
    A CERTIFIED EXHAUSTIVE LADDER FOR THE GRUMPY-GIANTS CONSTANT WITH THE
    NEGATION MAP AS A SEPARATE ARM: exact all-target means by per-target
    simulation on Z/l from 2^10 to 2^20 over a declared finite schedule
    family, a declared extrapolation model mean(l) = c sqrt l + d + e / sqrt l
    whose residual boundedness is the structural tell, and one discriminating
    question the instrument answers without any closed form -- does the
    negation map divide the plain constant by exactly sqrt 2 (as it does for
    the random-walk null) or by a structurally different factor
  class: measurement

  claim: >-
    SETTING AND FAMILY. As in IDEA-20260906-7bd805: Z/l with l an odd prime
    not 3, uniform target x, cost unit group additions, lookups and storage
    charged separately. Declared finite family S: mu in {0.5, 0.75, 1,
    1.25, 1.5} with m = round(mu sqrt l); second-giant start multiplier s
    in {2, -1}; second-giant direction in {+1, -1}; rate vector in
    {(1,1,1), (2,1,1), (1,2,2)}; plus, at mu = 1 only, a sweep of m over
    round(sqrt l) +- sqrt l / 4 (the phase sweep). Negation arm N: the same
    family with sign-insensitive matching (canonical representative
    min(y, l - y) in Z/l; the x-coordinate on the elliptic arm), reported
    as a separate parameter with its own constant, never merged.

    CLAIM (branch b of the RQ decision target, made falsifiable). (i) For
    every schedule in S and N and every ladder prime l, the all-target
    mean is an exact integer ratio obtained by simulating the algorithm on
    every target -- the mandatory verifier -- and the normalised value
    mean / sqrt l converges along the ladder with a residual
    r(l) = mean(l) - c_hat sqrt l that stays BOUNDED (predicted below 8
    additions at every rung) once c_hat is fitted on the top three rungs;
    a residual that grows with l refutes the extrapolation model and the
    reported interval for c is withdrawn. (ii) NEGATION DISCRIMINATION.
    Let c_plain(S) and c_neg(S) be the top-rung normalised means of the
    same schedule in the two arms. READING N1 (PURE HALVING): c_neg =
    c_plain / sqrt 2 within 0.01 for the optimal schedule, as it must be
    for the random-walk null where negation halves the effective group.
    READING N2 (STRUCTURED): |c_neg - c_plain / sqrt 2| > 0.02 at the two
    top rungs with the same sign, while the random-walk negation row
    stays at 1.2533 / sqrt 2 = 0.886 within 0.01 -- then the deterministic
    sequences and their mirrors overlap structurally and the negation
    constant is a genuinely separate number, which is what the RQ's
    separate-parameter constraint anticipates. The retrieved GWZ Table 3
    figures (1.25 plain, 0.9 negation, both conjectural) sit 0.016 apart
    from pure halving (1.25 / sqrt 2 = 0.884), inside the inconclusive
    band of this ladder; the record therefore predicts NEITHER reading and
    reports which band the exact values fall in.

    WHAT IS NOT CLAIMED. No closed form, no proof, no constant fitted from
    sampled targets, no statement about elliptic curves beyond generic
    equality. If IDEA-20260906-7bd805's Theorem A holds, its O(l) counter
    may be run as a cross-check column, but no number in this record
    depends on it.

  mechanism: >-
    (1) The expectation over a finite uniform distribution is a finite sum;
    per-target simulation of a deterministic algorithm gives the exact
    first-collision addition count T(x) for every x, and the mean is
    sum T(x) / l, an integer ratio. (2) Per-target simulation costs
    O(sqrt l) additions per target, O(l^{1.5}) per (l, schedule); at
    l = 2^20 that is about 2^30 modular additions per schedule, minutes
    in a compiled loop, so the ladder to 2^20 is exhaustive for a grid of
    about 60 schedules per arm within hours. (3) The extrapolation model
    is declared before any value is read: mean(l) = c sqrt l + d +
    e / sqrt l; c is estimated three ways -- two-point from the top two
    rungs, least squares on all rungs, and the range over the phase sweep
    -- and reported as an interval labelled modelled. (4) Negation on Z/l
    is exact and free (min(y, l - y)); sign-insensitive matching changes
    T(x) for each x but not the instrument. (5) The random-walk null is
    simulated per target with three independent uniformly random sequences
    of the same lengths; its plain mean must approach sqrt(pi/2) = 1.2533
    (single-walk model, matching the 0.6753 row of KN-LIT-7291 at budget
    1.5) and its negation mean 0.886, which fixes the meaning of 'pure
    halving' on this instrument. (6) The elliptic arm at one rung checks
    the instrument, not the mathematics: a prime-order curve over F_p
    with generator P and Q = x P must reproduce the Z/l integers exactly.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Identical to IDEA-20260906-7bd805 (crypto-kb empty, not called;
      direct reads of RQ-GRUMPY-964876, KN-LIT-7291, IDEA-20260901-753636,
