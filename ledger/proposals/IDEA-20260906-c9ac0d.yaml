      provenance: retrieved
      claim: ABSTRACT ONLY (eprint page and TU/e portal, 2026-09-06); the algorithm definition used here is recalled and is a point of S to be pinned by the 23/32 criterion.
      verified_by: TASK-20260906-faad4d (abstract pages only)
    - ref: 'Galbraith, Wang and Zhang, Advances in Mathematics of Communications 11(3) 2017 (IACR ePrint 2015/605)'
      provenance: retrieved
      claim: 'Landing page Table 3 as rendered by the fetch summariser: grumpy giants 1.25 sqrt N and grumpy with negation 0.9 sqrt N, both marked conjectural; interleaved BSGS with negation 0.943 sqrt N. Derivation and experimental method NOT read.'
      verified_by: TASK-20260906-faad4d (landing page only)
    - ref: null
      provenance: recalled
      claim: 'Pollard 2000, interleaved BSGS average 4/3 sqrt l; the classical rho-with-negation figure 0.886 sqrt l = sqrt(pi/2) / sqrt 2. Neither opened; both reproduced on the instrument as controls rather than relied on.'
      verified_by: null

  assumptions:
    - l an odd prime not 3 (so 2, 3, s, s - 1 are units); composite l is excluded from every arm.
    - First element and precomputation conventions are declared per schedule and identical across arms and rungs; the residual is measured on the interleaved count alone.
    - Toy scale only, 2^10 to 2^20 mandatory, 2^22 optional; nothing transfers.
    - The extrapolation model is a declared instrument, not a theorem; its interval is labelled modelled per the RQ.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: >-
        Instrument-level only: the one-giant slice must give 4/3 and the
        classical BSGS slice 1.5 within 2 / sqrt l; the random-walk null
        must give 1.2533 within 3 standard errors of its per-target Monte
        Carlo (the null is random, so its all-target mean is exact only per
        seed and is reported with the seed count).
    observation_collision:
      observable: the exact mean numerator per (l, schedule, arm)
      distinct_preimage_search: >-
        Two schedules that are relabellings of each other (e.g. s = -1
        with reversed direction versus s = 2) may give identical numerators;
        recorded as an identity, not a finding. A numerator reproduced by
        the optional 7bd805 counter is a cross-check, not a second result.
    constructive_transforms: []
    quantifier_order: >-
      FOR ALL schedules in S and N, FOR ALL ladder primes, the reported
      mean is exact. THERE EXISTS a schedule in S (respectively N)
      minimising the top-rung normalised mean; 'optimal' is over the
      declared grid only. The negation reading is a statement about that
      optimal schedule and the random-walk null at the same rungs.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On Z/l from 2^10 to 2^20 the exact all-target mean of every
        schedule in S and N is [table]; the modelled interval for c is
        [a, b] plain and [a', b'] negation for the optimal grid schedules;
        the negation reading is [N1 | N2 | inconclusive].' It cannot certify
        the limit, a closed form, optimality outside the grid, or anything
        at cryptographic scale.
      nearby_object_control: >-
        The random three-sequence walk (negation must be pure halving
        there) and the one-giant BSGS (negation halves the giant range
        only -- the interleaved-with-negation constant 0.943 retrieved from
        GWZ is a second anchor the instrument must approach if the
        GWZ-style baby-step reduction is in N; if it is not, the record
        says so and does not compare).
    proof_obligations:
      - claim: Per-target simulation implements the declared schedule and matching rule exactly on both arms.
        responsibility: correctness
      - claim: Exhaustive and sampled values are never mixed in one column.
        responsibility: interface
      - claim: The extrapolation model is declared and hashed before the top rung is read.
        responsibility: strictness
      - claim: Toy tier; no transfer.
        responsibility: scope
    not_applicable_reason: Not a proof-oriented proposal; the map is filled for the instrument-level audits only.

  object_first_candidate:
    tracked_object: >-
      The per-target first-collision addition count T(x) as a function on
      Z/l, and its two arm variants; the summary statistic is the exact
      mean, the structural statistic is the residual r(l).
    established_families_off_limits: >-
      Off-limits: sampled-target Monte Carlo fitting of the constant (the
      RQ forbids it as a result); birthday-heuristic derivation of the
      constant (that is the random-walk NULL here, not the object);
      closed-form derivation (7bd805's lane).
    lossiness: >-
      T(x) is a lossy projection of the run transcript (forgets which pair
      collided and every intermediate element), compatible with the
      per-target enumeration since it is a scalar per target; the mean is
      a further lossy projection whose discarded part (the distribution of
      T) is retained as a histogram for the tail check.
    propagation: Exact per target; no propagation claim beyond enumeration.
    survival_score: The object exists at every l by definition; what can fail is only the extrapolation model.

  null_object_control: >-
    NULL-A, BLOCKING: three independent uniformly random sequences of the
    same lengths, per-target simulation with 16 seeds per rung, plain and
    negation arms; predicted 1.2533 and 0.886, the latter fixing 'pure
    halving' on this instrument. POSITIVE CONTROLS, BLOCKING: one-giant
    interleaved BSGS at 4/3, classical BSGS at 1.5, both arms reported;
    the 0.5625 / 0.6753 / 0.71875 success fractions at budget 1.5 sqrt l
    read off the same T(x) tables. DECAY PARAMETER: l along the ladder --
    r(l) must stay bounded and the three estimates of c must converge to
    within their declared tolerance; a residual growing like sqrt l or
    estimates that diverge is the artifact tell and voids the interval.
    PHASE SWEEP: at mu = 1 the mean over the m-window is reported as a
    curve against (l mod m)/m; a flat curve is READING 1 of 7bd805, a
    structured one READING 2, and this record only reports it. ELLIPTIC
    ARM: one rung near 2^14 on a self-generated prime-order curve, both
    arms, integer equality with Z/l required; a discrepancy is an
    instrument defect.

  discriminated_from:
    - >-
      IDEA-20260906-7bd805 -- NEAREST RECORD. It claims a derivation
      (target-independent covered set, piecewise-polynomial density, phase
      parameter, O(1) residual) whose test uses exhaustive means. EXACT
      DELTA: this record is branch (b) of the RQ decision target and
      depends on no theorem: its column is per-target simulation only, its
      limit statement is a declared extrapolation model with a bounded-
      residual tell, it adds the negation arm as a separate measured
      parameter with the pure-halving versus structured discrimination
      (which 7bd805 explicitly excludes), and it survives intact if
      7bd805's Theorem B is refuted.
    - >-
      KN-LIT-7291. Holds three reported success probabilities at one
      budget. Delta: exact means over a schedule grid on both arms at
      every ladder rung, with the three probabilities recomputed as
      controls.
    - >-
      IDEA-20260901-753636. Rho partition-transition measurement on
      curves; different algorithm, object and group.
    - >-
      Galbraith-Wang-Zhang 2017 (retrieved landing page). Lists 1.25 and
      0.9 as conjectural. Delta: an exhaustive certified column with a
      declared model and a stated inconclusive band; whether their 0.9
      came from exhaustive counts is unknown to this record.

  predictions:
    - metric: M1 -- positive-control slices, normalised means for one-giant and classical BSGS, both arms
      direction: different
      minimum_effect: 4/3 and 1.5 within 2 / sqrt l at every rung (plain); negation arm values reported, with 0.943 as the anchor only if the GWZ-style schedule is in N.
    - metric: M2 -- random-walk null, plain and negation
      direction: different
      minimum_effect: 1.2533 and 0.886 within 3 Monte Carlo standard errors at the top three rungs; ratio within 0.01 of 1 / sqrt 2. Failure voids the negation discrimination.
    - metric: M3 -- residual r(l) for the optimal grid schedule, each arm
      direction: different
      minimum_effect: bounded below 8 additions at every rung with no monotone growth; the three c estimates within 0.01 of each other at the top rung. Otherwise the interval is withdrawn and the outcome is 'certified table, no modelled limit'.
    - metric: M4 -- negation ratio c_neg / c_plain for the optimal schedule versus the null ratio
      direction: different
      minimum_effect: N1 if |c_neg - c_plain / sqrt 2| < 0.01 at the top two rungs; N2 if > 0.02 with consistent sign while M2 holds; otherwise INCONCLUSIVE at this ladder, reported as such.
    - metric: M5 -- success fraction at budget 1.5 sqrt l for the pinned BL schedule, plain arm
      direction: different
      minimum_effect: 0.71875 within 1 / sqrt l at three rungs identifies the BL point of S; no point achieving it means S does not contain the BL instance and the record reports the grid optimum only.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): declare S, N, the charging
      conventions, the extrapolation model and the tolerance bands; hash
      them. STAGE 1 (minutes): per-target simulator on Z/l at three primes
      near 2^10, 2^12, 2^14, both arms, full grid, plus NULL-A and the
      positive controls; M1, M2 and M5 decided here. CHEAPEST VALID
      DISCRIMINATOR: Stage 1 at l near 2^14 for the pinned schedule and
      the null alone -- it decides M2 and gives the first negation ratio
      in minutes; if M2 fails the negation question cannot be asked on
      this instrument. STAGE 2 (hours): rungs 2^16, 2^18, 2^20 exhaustive
      for the grid; optional 2^22 for the optimal schedules only; M3 and
      M4. STAGE 3 (minutes): elliptic arm at one rung, both arms. STAGE 4
      (zero compute): apply the hashed tolerances; write the table, the
      modelled interval, the optimal schedules, the storage and lookup
      counts, and the comparison rows.
    controls:
      - NULL-A random three-sequence walk, plain and negation, 16 seeds per rung (blocking)
      - One-giant interleaved and classical BSGS slices (blocking)
      - Budget-1.5 success fractions recomputed from the same tables against KN-LIT-7291's three figures
      - Phase sweep at mu = 1 reported as a curve (reported, never fitted)
      - Elliptic arm integer equality (instrument check)
      - Model, grid and tolerances hashed before Stage 2 is read
      - Optional 7bd805 counter column, labelled cross-check
    required_metrics:
      - per (l, schedule, arm) the exact mean numerator and denominator, mean / sqrt l, storage (table sizes) and lookup count
      - per (l, arm) the histogram of T(x) and its 0.99 quantile (tail check against the worst case)
      - r(l) per rung for the optimal schedules; the three c estimates and the modelled interval
      - c_neg / c_plain and the null ratio with their bands and the reading
      - wall clock per rung and stage; sha256 of every table and of the Stage 0 declaration

  falsification_conditions:
    - F1. M1 fails at any rung. Simulator wrong; nothing is read.
    - F2. M2 fails. The null is mis-implemented or the seed count too small; the negation discrimination is not attempted.
    - F3. M3 residual grows or estimates diverge. The extrapolation model is refuted for this ladder; the exact table stands, no interval is reported.
    - F4. M4 lands in the inconclusive band at the top two rungs. Reported as inconclusive with the band; the successor is a higher rung, not a fit.
    - F5. Elliptic arm disagrees with Z/l. Instrument defect; the curve arm is repaired or dropped, never interpreted.
    - F6. Budget exhaustion or crash. Infrastructure outcome under AGENTS.md rule 3.

  confounders:
    - FIRST-ELEMENT AND PRECOMPUTATION CONVENTIONS shift every mean by a constant; they must be identical across arms or the negation ratio is biased at O(1 / sqrt l).
    - ROUNDING OF m makes the realised mu l-dependent; the phase sweep exists to expose this and the grid records realised (m, l).
    - SIGN-INSENSITIVE MATCHING can create a self-collision y = -y only at y = 0, which is the identity element and is excluded by convention.
    - THE RANDOM NULL'S ALL-TARGET MEAN IS EXACT ONLY PER SEED; it is reported with seeds and standard errors and never placed in the exhaustive column.
    - STORAGE AND LOOKUPS grow with the schedule; a schedule optimal in additions may not be optimal in total cost, which is reported but not optimised.

  interpretation_limits:
    - "claim_tier: toy; 2^10 to 2^20 (2^22 optional); no transfer; the limit interval is modelled, never a measured constant."
    - NO ATTACK, NO EXPONENT; a generic-group constant of a Theta(sqrt l) algorithm.
    - Optimal over the declared grid only; no schedule outside it is declared impossible.
    - The negation reading concerns the optimal grid schedule in N as declared here, not GWZ's variants unless their schedule is reproduced in N.
    - No experiment, hypothesis, approval, status transition or run is created by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        EXTRAPOLATION MODEL. For each schedule, mean(l) = c sqrt l + d +
        e / sqrt l + o(1 / sqrt l) along primes l, with c, d, e independent
        of l at fixed realised (mu, phase).
      rigorous_support: >-
        Imitates the standard boundary-term expansion of lattice-point
        counts in scaled regions (leading term is volume, next is
        boundary length); rigorous only if 7bd805's Theorem B holds, which
        this record does not assume -- hence the residual tell.
      validation_plan: >-
        SAMPLE: the exhaustive means at every rung; COMPARE the three c
        estimates and the residual sequence; TAIL CHECK: the largest
        |r(l)| over the ladder against the declared 8-addition band, and
        the 0.99 quantile of T(x) / sqrt l against the worst-case bound
        (the algorithm terminates once the tables cover Z/l). Parameters
        recorded per rung; no transfer.
    - id: H2
      statement: >-
        PURE HALVING FOR RANDOM SEQUENCES. For three independent uniform
        sequences, sign-insensitive matching multiplies the collision rate
        by 2 (1 + O(1 / l)), so the negation mean is the plain mean divided
        by sqrt 2 in the limit.
      rigorous_support: >-
        Birthday bound on a set of l' = (l - 1) / 2 sign classes; exact for
        uniform sequences up to the single fixed class of 0.
      validation_plan: >-
        NULL-A at the top three rungs, 16 seeds, ratio within 0.01 of
        1 / sqrt 2 with the Monte Carlo standard error reported; the
        smallest-ratio seed compared with the predicted spread.

  target_complexity:
    time_exponent: 1/2, UNCHANGED; the record measures a constant of a Theta(sqrt l) algorithm and claims no exponent.
    memory_exponent: 1/2, unchanged; storage per schedule is reported.
    best_known: >-
      Interleaved BSGS 4/3 sqrt l (recalled); grumpy giants 1.25 plain and
      0.9 negation, both conjectural (GWZ 2017, retrieved landing page);
      rho with negation 0.886 sqrt l memoryless (KN-TECH-006).
    hidden_overhead: >-
      Nothing hidden in the exact column; the modelled interval carries
      the declared model's uncertainty and is labelled. Lookups and
      storage are charged separately and are the real cost against rho.
    tradeoff_note: Not applicable; memory is fixed by the schedule at O(sqrt l).

  dominated_by: >-
    AS AN ATTACK: none is mounted; rows checked individually: parallel rho
    with negation 0.886 sqrt N, O(1) memory (dominates on memory);
    interleaved BSGS 4/3 (recalled); grumpy giants 1.25 / 0.9 conjectural
    (retrieved); GWZ block variants 0.38 / 0.36 (retrieved, different cost
    model, not compared); van Oorschot-Wiener, Pohlig-Hellman, index
    calculus n/a. AS A MEASUREMENT the nearest incumbent is
    IDEA-20260906-7bd805, which dominates on explanatory content if its
    theorems hold and is dominated here on independence from any theorem
    and on the negation arm; externally, GWZ's own experiments (not read)
    may already be exhaustive at comparable l, in which case this record
    is a replication with a declared model.
  sota_delta: >-
    Time exponent delta 0; memory exponent delta 0; data/query delta 0;
    security bits reduced 0. Measurement delta, quantified: from two
    conjectural constants (1.25, 0.9) with unknown provenance of their
    experiments to an exact all-target table on a declared grid of about
    60 schedules per arm at six rungs, a modelled interval with a declared
    residual tell, and a decided or explicitly inconclusive negation
    reading with band width 0.01 / 0.02; comparison rows BSGS and random
    walk on the same instrument.

  estimated_cost:
    implementation: low (per-target simulator with both matching rules about 120 lines; null and controls about 60 lines; ladder driver and hashing about 60 lines)
    compute: low to medium (design figure, not a measurement; about 2^30 modular additions per schedule at 2^20, some 60 schedules per arm, two arms -- a few CPU-hours compiled, tens in pure Python; 2^22 optional and restricted to the optimal schedules)
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the instrument passes M1 and M2. 0.7 that M3's residual is
    bounded for the optimal schedule (the risk is the phase structure of
    7bd805 READING 2, which would show as an l-dependent residual and is
    itself informative). 0.35 N1, 0.35 N2, 0.3 inconclusive at this
    ladder, given the retrieved GWZ figures sit 0.016 from pure halving.
    Most likely honest headline: 'exact table to 2^20 on both arms;
    modelled plain interval [a, b] around the conjectural 1.25; negation
    reading [N1 | N2 | inconclusive] with the band'.

  inference:
    requested_policy: research-deep
    requested_reasoning_effort: high
    resolved_model_id: claude-fable-5-1 (as reported by the runtime to this session; not probe-verified)
    model_verified: false
