  assumptions:
    - >-
      Scope is the declared composable walk-action template, not arbitrary
      PKE. Encryption semantics require label consistency across at least two
      steps.
    - >-
      The bare public state is an isomorphism class of a supersingular curve
      over F_{p^2} plus explicitly declared auxiliary data; no orientation,
      secret order embedding, or torsion labeling may be smuggled into a
      serialization convention.
    - >-
      EndRing output and its distribution are stated separately from any
      oriented-EndRing variant. GRH-conditional EndRing/path equivalence does
      not manufacture a public action or transported labels.
    - >-
      Automorphisms and dual/backtracking edges are quotiented consistently so
      only non-isomorphic endpoint disagreements count.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Generic toy public views will admit multiple hidden labelings often
        enough for exhaustive depth-two search to find a collision.
      validation_route: >-
        Enumerate all labelings, not samples, at three small primes; report
        collision frequency by j-invariant and automorphism class. The exact
        collision lemma remains conditional and does not depend on frequency.

  proof_search_map:
    bottleneck: >-
      Defining label semantics that are useful for encryption yet invariant
      under public curve isomorphism without publishing orientation data.
    baseline_embedding:
      parameter_slice: >-
        A toy CSIDH/SiGamal slice with a fixed split-prime generator and its
        public Frobenius orientation supplies the explicit-evaluator baseline.
      reproduction_check: >-
        Two sequential public actions must agree with secret-side ideal/action
        composition at every enumerated toy key.
    observation_collision:
      observable: >-
        Canonical public view together with the endpoint selected by label pair
        (a,b).
      distinct_preimage_search: >-
        Enumerate orientation/order-embedding labelings L,L' with the same
        public view and test whether endpoint_L(a,b) differs from
        endpoint_L'(a,b) up to isomorphism.
    constructive_transforms:
      - transform: auxiliary_information_exposure
        proposed_object: >-
          The minimum orientation or transport certificate that separates
          every conflicting public-view fiber.
        predicted_gain: >-
          Converts a silent assumption into a named augmented problem and a
          measured public-key overhead.
      - transform: unlabeled_random_walk
        proposed_object: >-
          Replace semantic labels by fresh public neighbor choices whose
          distribution, not identity, composes.
        predicted_gain: >-
          May avoid label transport, but must supply a new correctness/shared-
          secret mechanism; no such mechanism is assumed here.
    quantifier_order: >-
      For each public view, quantify over all admissible hidden labelings, then
      all required label pairs. One conflicting pair disproves a deterministic
      evaluator on that public view.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exact no-evaluator certificate for a specified state/label API and
        toy graph, or a construction of sufficient public transport data.
      nearby_object_control: >-
        With an explicit CSIDH orientation/class action, the same evaluator
        test must pass; deleting only that data should create ambiguity.
    proof_obligations:
      - claim: the two hidden labelings induce identical declared public input
        responsibility: collision certificate correctness
      - claim: their labeled endpoints are non-isomorphic
        responsibility: exact finite-field/isomorphism check
      - claim: the candidate requires the conflicting label pair for correctness
        responsibility: scheme-interface audit
      - claim: published transport data does not reveal or simplify the exact EndRing variant beyond the stated assumption
        responsibility: separate security reduction
    not_applicable_reason: null

  predictions:
    - metric: public-view fibers containing two labelings with conflicting depth-two endpoints
      direction: greater_than
      minimum_effect: at least 1 for the unlabeled negative-control API
    - metric: evaluator disagreements against secret-side composition
      direction: equal
      minimum_effect: exactly 0 for the oriented SiGamal-shaped positive control
    - metric: auxiliary bits needed to separate every conflicting fiber
      direction: measurable
      minimum_effect: >-
        either a finite explicit value with a serialization algorithm or a
        proof that the candidate's existing public data already separates all fibers

  minimal_test:
    design: >-
      For three toy primes and two small split degrees, enumerate the depth-two
      supersingular neighborhoods, all relevant order embeddings/orientations,
      and all label pairs. Canonicalize public views and endpoints. Run once
      with the orientation/class-action data present and once after deleting
      it. Emit one independently checkable collision certificate per failing
      cell and a minimum distinguishing-data table.
    controls:
      - kind: positive
        object: SiGamal-shaped CSIDH evaluator with explicit public orientation/action data
        expected: zero composition disagreements
      - kind: negative
        object: the same toy graph exposed only as unlabeled curve isomorphism classes
        expected: at least one conflicting depth-two public-view fiber
      - kind: nearby
        object: one-step neighbor enumeration without persistent labels
        expected: >-
          succeeds as neighbor enumeration but cannot be counted as a
          two-step semantic action
    required_metrics:
      - public-view fiber sizes
      - conflicting label-pair count
      - endpoint isomorphism checks
      - minimum distinguishing auxiliary bits
      - public evaluator time and key-size overhead
    stop_condition: >-
      Stop at the scoped API verdict. Do not generalize a toy collision to an
      impossibility result for all isogeny PKE.

  falsification_conditions:
    - >-
      A deterministic evaluator using only the declared bare public state that
      agrees for every hidden labeling and required label pair falsifies the
      proposed collision barrier for that API.
    - >-
      If the candidate needs no persistent label semantics beyond one step,
      the barrier is inapplicable rather than negative evidence.
    - >-
      Failure of the oriented positive control invalidates the labeling or
      canonicalization harness.

  confounders:
    - Extra automorphisms at j=0 or 1728 can create apparent label multiplicities.
    - Backtracking and dual edges can create identical endpoints without resolving label semantics.
    - A randomized evaluator may require distributional, rather than pointwise, equivalence.
    - Public torsion data may both resolve labels and introduce a separate attack surface.

  interpretation_limits:
    - The proposal does not prove PKE impossible from EndRing.
    - Public evaluation under P-CSSCDH/P-CSSDDH, TCSSI, or LIT-DDH is not reduced to plain EndRing here.
    - Finding transport data yields an augmented candidate, not an IND proof.

  target_complexity:
    time_exponent: no attack or construction exponent improvement claimed
    memory_exponent: no asymptotic improvement claimed
    data_queries: complete depth-two toy neighborhoods and labelings
    best_known_comparison: >-
      SiGamal and LIT-SiGamal achieve public evaluation with explicit public
      action/torsion structure. SÉTA's public function is evaluated from
      pk = j_T and places the evaluated torsion images in the ciphertext while
      retaining the orientation/trapdoor as sk. These schemes use different
      assumptions; this audit is strictly an interface diagnostic and is
      dominated by them on functionality.
    hidden_overhead: exhaustive orientation enumeration and canonical endpoint isomorphism
    tradeoff: exposes assumption/serialization cost without producing a PKE

  estimated_cost:
    implementation: medium
    compute: low
    detail: exact enumeration at toy primes; no cryptographic-size walk search
  dependencies:
    - toy supersingular-neighborhood enumerator with isomorphism canonicalization
    - precise public-state and label API for the candidate
    - explicit orientation/class-action positive control
  recommended_priority: high

  dominated_by:
    verdict: yes_as_construction_no_as_audit
    justification: >-
      Existing SiGamal/LIT/SÉTA-type schemes dominate functionality and
      performance because this record constructs nothing. They rely on the
      very auxiliary structures this audit prices, so they do not dominate the
      assumption-separation result.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Adds a binary depth-two evaluability verdict, an exact conflicting-fiber
      count, and a minimum auxiliary-bit count to an otherwise prose-level
      public-evaluation boundary.
  honest_accounting:
    object: fibers of hidden labelings over a canonical public curve view
    depth_of_verified_structure: exact depth-two toy neighborhoods only
    closures:
      - closure: public label transport
        mechanism: explicit orientation/class action or a separating transport certificate
    open_directions:
      - search for randomized distribution-preserving evaluation without persistent labels
      - determine whether minimum transport data is equivalent to an oriented-EndRing variant
