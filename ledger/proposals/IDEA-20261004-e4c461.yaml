  title: >-
    PUBLIC LABEL-TRANSPORT BARRIER: a two-step collision test for whether an
    EndRing-trapdoor PKE silently assumes an oriented group action
  class: mechanism

  claim: >-
    Consider the scoped walk-action PKE template in which encryption must, for
    a public label a, apply an outgoing isogeny labeled a at pk and then apply
    a second label b at the resulting curve, while the public state exposes
    only an unlabeled curve and isomorphism-invariant data. If two admissible
    hidden labelings L and L' give identical public state but assign label b
    to non-isomorphic second-step targets, no deterministic public evaluator
    on that state can be correct for both. Therefore such a candidate must do
    one of three explicit things: publish transport data/orientation, replace
    labels by a publicly computable action, or restrict encryption to a
    one-step/unlabeled operation. The statement is an information-theoretic
    collision lemma for this template, not an impossibility theorem for PKE
    or for all supersingular constructions.

  mechanism: >-
    Build the depth-two rooted isogeny neighborhood of a toy supersingular
    public key and enumerate admissible hidden orientations/order embeddings.
    Canonicalize the public view. A public-view collision with different
    labeled depth-two endpoints is a certificate that the evaluator needs
    extra label-transport information. Price that information explicitly:
    orientation, torsion bases/images, class-group representation, or a table
    growing with depth. SiGamal is a positive control for explicit public
    evaluation because its CSIDH/Frobenius-oriented class action supplies the
    missing structure; that changes the security assumption to P-CSSCDH/
    P-CSSDDH. LIT-SiGamal publishes structured torsion data; SÉTA instead
    keeps its orientation/trapdoor secret while its ciphertext contains the
    evaluated torsion images.

  why_not_a_renamed_known_approach: >-
    The key-updatable-PKE paper identifies the lack of a public-domain group
    operation when trying to instantiate asymmetric UPKE from SIDH/CSIDH. This
    proposal narrows and adapts that observation to a depth-two certificate
    for ordinary PKE proposals claiming a bare EndRing trapdoor. It does not
    instantiate SiGamal, SÉTA, FESTA, or LIT-SiGamal and does not claim those
    schemes lack public evaluation.

  novelty_status: adaptation
  novelty_note: >-
    The public-operation obstruction is known in the reviewed UPKE source.
    The contribution proposed here is the exact two-label collision
    certificate and an auxiliary-information accounting rule for this RQ.

