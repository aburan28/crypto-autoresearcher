idea:
  id: IDEA-20260930-4406e0
  question_id: RQ-KIC-7502b9
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: Split the SAT-versus-exact-MITM gap into group operations and solver overhead
  class: control
  claim: On one frozen explicit base of the n=7 Koblitz subgroup and one frozen explicit base of the n=11
    Koblitz subgroup, the fraction of CryptoMiniSat's charged operations that are not group-law field
    operations and not base-membership tests is at least 0.5 of that solver's charged operations, while
    the exact meet-in-the-middle enumerator performs at most 1.1 times as many group-law field operations
    as the solver's group-law field operations, and both return the same verified triples. Representation
    class R1 (selector bits of an explicit point index). The attack stage is the accounting of relation-decomposition
    cost, not a faster solver. No exponent moves. If that overhead fraction is below 0.5 at n=7 while
    the verified sets match, the gap is extra search and the overhead explanation is false. This is not
    a claim that SAT is faster than F4 or faster than meet-in-the-middle.
  mechanism: 'OBJECT FRAME. Representation: R1, the selector-bit encoding of an index into an explicit
    list B. The bits are a coordinate representation of a label, not a new point. Operation set Sigma:
    unit propagation on the original XOR rows of a Boolean circuit for the binary field addition, together
    with a counter that increments when that circuit evaluates a field multiplication. Sigma does not
    contain translation by arbitrary subgroup elements. Decoding a selector to a point and adding points
    is allowed only as the replay check, which is outside Sigma. Trichotomy: coordinate-dependent. Reason:
    the overhead fraction is a function of the encoding and of the solver''s learned-clause machinery.
    Two searches can realise the same group element and the same verified triple with different conflict
    counts. The fraction is not a function of the discrete logarithm.


    LOSSY-PROJECTION TEST, against Sigma. The tracked object is the pair (addition-operation count, membership-test
    count) of a finished search, plus the mask of selector bits forced by unit propagation on the original
    rows. Discarded: the learned-clause database and the restart schedule. The discard is Sigma-compatible
    because unit propagation on the original XOR rows does not read learned clauses; the mask''s one-step
    update under Sigma is determined by the original rows and the current mask. The projection is lossy
    because two CDCL states can share a mask and an addition count while differing in learned clauses.
    If, on the n=7 exhaustive cell, the conflict count is a function of the addition count alone (one
    conflict total per addition total), then L=0 for that projection of solver state and the overhead
    is not a separate object. That outcome is reported and it falsifies the claim that overhead is an
    independent component.


    TWO EXPLANATIONS OF THE CHARGED-COST GAP. Let G_sat be the number of field multiplications executed
    inside the solver''s addition circuit, G_mitm the same count for exact meet-in-the-middle on the same
    B and the same targets, and C_sat the solver''s charged operations in a pre-registered unit (conflicts
    plus decisions plus clause inspections, added to G_sat with weight 1 per inspection as declared below).
    Overhead fraction f = (C_sat - G_sat) / C_sat. Explanation O: f >= 0.5 and G_sat <= 1.1 * G_mitm.
    The searches do about the same group-law work, and at least half of the solver''s charged operations
    are not that work. Explanation S: f < 0.5. Most of the solver''s charged operations are group-law
    or membership work, so the gap versus meet-in-the-middle, if G_sat is much larger than G_mitm, is
    extra search. The decidable negative for explanation O is f < 0.5 at n=7 with matching verified triples.
    A mismatch of verified triples decides neither explanation; the run is invalid.


    The circuit is a Boolean circuit of the field addition of three decoded points, compared with the
    target. It is not a summation polynomial and not a Weil-descent Macaulay matrix. Meet-in-the-middle
    is the exact pair table on the same decoded points. F2 supplies the three-point predicate. Added:
    the split of the charged unit into group-law operations and everything else, with the cyclic and random-XOR
    controls.


    What was avoided. Not ''SAT is faster than F4'' (KR-IC-5765d2). Not the wall-time horse-race of H-KIC-77b47b
    (affine one-hot versus explicit one-hot). Not H-KIC-9416d9''s prediction that affine flats lower cold
    SAT time. Not a first-fall degree. Not a speedup claim of any kind. Wall time is recorded and is not
    the decision metric.


    OPEN NUMBER. L = log2 of the mean number of distinct conflict-counts observed among runs that share
    the same addition-count, on the n=7 target list. b = the mean number of decision branches recorded
    per forced mask, on identity (the curve circuit), on random-label (the same number of XOR rows replaced
    by random XOR rows of equal width), and on relabelled Z/rZ (selectors indexing a cyclic group of order
    r, addition circuit replaced by integer addition modulo r). Canonicalisation is not the priced number;
    L and b are.'
