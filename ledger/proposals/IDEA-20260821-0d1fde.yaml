      verified_by: null
    - ref: 'Landau prime ideal theorem'
      provenance: recalled
      claim: >-
        The number of prime ideals of norm at most B in a number field is asymptotically B/log B,
        i.e. comparable to pi(B) irrespective of the degree. Recalled; it is what makes IDEAL
        smoothness follow the same rho(u) law as integer smoothness and is why Stage 2 measures
