      verified_by: null
    - ref: 'Cramer-Ducas-Peikert-Regev, "Recovering short generators of principal ideals in cyclotomic rings"'
      provenance: recalled
      claim: >-
        Recovering a SHORT generator of a principal ideal, given some generator, is a separate
