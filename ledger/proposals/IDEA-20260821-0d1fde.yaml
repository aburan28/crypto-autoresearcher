        The four-slot template this proposal audits: a rigorous size bound (Theorem 1.5) on
        an algebraically defined object; a classical smoothness distribution theorem
        (Canfield-Erdos-Pomerance, Theorem 1.4) for objects of that size; smoothness splitting into
        two halves each below a threshold; and a meet-in-the-middle claw over a codomain-keyed
        table; plus the A7 validation pattern (sampling method reaching cryptographic scale, sample
        sizes, empirical CDF against the predicted distribution, tail consistency checks). THE
        LOAD-BEARING FEATURE FOR CLAIM (B2) IS THAT THE EXEMPLAR'S TARGET IS PUBLIC: the isogeny
        E -> E^{(p)} is given by the instance, which is what makes both sides of its claw
        computable. THE FULL TEXT WAS NOT RE-READ THIS SESSION; the template as used here is taken
        from docs/target-result-profile.md sections A1-A8, which is a program document summarising
        it, and any mismatch between that summary and the paper is a defect of this record.
      verified_by: idea-generator@2026-08-21
    - ref: 'Dickman-de Bruijn rho(u); Canfield-Erdos-Pomerance Psi(X,B) = X u^{-u(1+o(1))}'
