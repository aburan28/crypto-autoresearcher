idea:
  id: IDEA-20260821-0d1fde
  question_id: RQ-MLKEM-001
  added: '2026-08-21'
  title: >-
    A COMPONENT AUDIT of this program's own canonical exemplar against ML-KEM, run in the order
    that puts the cheapest killer first: the Wesolowski template's JOIN needs an
    attacker-computable key, and for ML-KEM none is known -- so Stage 0 is a zero-compute audit of
    the missing join, and only the SURVIVING components (the AM-GM size bound and its slack, the
    Dickman slot for ideal smoothness, and the necessary geometric condition on a balanced ideal
    half) are measured, each labelled with what its measurement can and cannot license
  class: mechanism
  claim: >-
    (A) WHY THIS EXISTS, AND WHAT CHANGED. docs/target-result-profile.md names Wesolowski's
    p^{1/3+o(1)} supersingular isogeny result as the canonical exemplar, and its recipe is
    explicit: a recent rigorous SIZE BOUND on an algebraically defined object, plus a classical
    SMOOTHNESS DISTRIBUTION theorem for objects of that size, converted into an algorithm by
    SPLITTING the object into two halves each enumerable in budget and joining them by an EXACT
    keyed table. Nothing in this lane has ever tried to instantiate that recipe against ML-KEM,
    and "the exemplar does not apply" is a hypothesis about the search, not a theorem about the
    problem. AN EARLIER DRAFT OF THIS RECORD INSTANTIATED THE TEMPLATE WITHOUT AUDITING THE
    COMPONENT THAT DECIDES IT. That component is the join, the audit is algebraic and costs no
    compute, and it is now claim (B2) and Stage 0's first obligation.
    (B) THE TRACKED OBJECT. For a single ring coordinate s of the ML-KEM secret vector, s in
    R = Z[x]/(x^256+1), the field norm N(s) = Res(s(x), x^256+1) = prod over the 256 complex
    embeddings of s(zeta_i), an integer. N is MULTIPLICATIVE, so it propagates exactly through the
    only nonlinear operation ML-KEM performs on ring elements, and it dies at addition -- which is
    precisely where the LWE error enters. That is a one-step survival and it is stated as such.
    (B2) THE JOIN AUDIT, WHICH DECIDES THE TEMPLATE AND WHICH THE EARLIER DRAFT DID NOT RUN. In
    the exemplar the meet-in-the-middle works because THE TARGET IS GIVEN BY THE INSTANCE: the
    isogeny E -> E^{(p)} is public, so both halves of the claw can be computed from public data
    and the exact key exists on the attacker's side. Here the earlier draft named the exact key as
    "the ideal itself, since ideal equality is decidable" -- but the ideal in question is (s), and
    s IS THE UNKNOWN. NO ATTACKER-COMPUTABLE QUANTITY IS KNOWN TO THE PROPOSER that keys such a
    table given only the public (A, t = A s + e). Two obstacles, both stated concretely so that
    someone can attack either:
    (i) N(s) and (s) are functions of s over Z, while the public relation is over Z_q and involves
    s only through A s + e. The proposer can construct no map from (A, t) to N(s), to (s), or to
    any invariant of a factor of (s).
    (ii) The nearest candidate the proposer CAN construct is a coset test rather than a key: if
    s lies in an ideal I1 then t - (the contribution of the other coordinates) lies in the coset
    e + I1, so a candidate I1 could in principle be tested by asking whether that coset contains a
    short element. This is NOT an exact key and it fails twice. It is a CVP per candidate ideal,
    not a table lookup, so it destroys the claw structure that is the template's entire reason for
    existing; and for module rank k >= 2 -- ML-KEM-768 has k = 3 -- the public relation couples
    all k ring coordinates, so the test is unavailable without the other k-1 coordinates as well.
    CONSEQUENCE, STATED WITHOUT SOFTENING: this record can no longer claim that any measured
    outcome shows "the exemplar's template has an entry point". What it can do is audit the
    template's REMAINING components at measured parameters and hand forward a precisely named open
    sub-problem: exhibit an attacker-computable key for a multiplicative split of a module-LWE
    secret, or prove none exists. NO DIRECTION IS DECLARED IMPOSSIBLE -- "none is known to the
    proposer after an algebraic search of one session" is a statement about this search.
    (C) THE RIGOROUS SIZE BOUND, WHICH IS THE EXEMPLAR'S THEOREM 1.5 SLOT AND WHICH SURVIVES THE
    JOIN AUDIT. For a power-of-two cyclotomic, sum_i |s(zeta_i)|^2 = 256 * ||s||_2^2 in the
    coefficient basis, so AM-GM gives |N(s)|^{2/256} <= (1/256) sum_i |s(zeta_i)|^2 = ||s||_2^2,
    i.e. ||s||_2 >= |N(s)|^{1/256}. This is an unconditional inequality, it is the exact analogue
    of the exemplar's minimal-degree bound, and it runs in the useful direction: it caps how large
    the norm of a SHORT element can be, hence caps how much room a multiplicative splitting has.
    (D) THE TWO NUMBERS THAT WOULD DECIDE THE TEMPLATE IF THE JOIN EXISTED, AND WHAT THEY ARE
    PREDICTED TO BE. They are still worth measuring, because a negative on either closes the
    template independently of the join question and a positive on both localises the whole
    difficulty in the join.
    NUMBER ONE, THE SLACK. For ML-KEM-768's CBD_2 secret, ||s||_2 ~ sqrt(256) = 16, so the bound
    caps |N(s)| at 2^1024. Modelling s(zeta_i) as a complex Gaussian of variance 256 gives
    E[log2|N(s)|] = 256 * (log2(256) - gamma/ln2)/2 = 256 * 3.5837 = 917.4 bits, so the SLACK,
    256*log2||s||_2 - log2|N(s)|, is predicted at about 106.6 bits out of 1024 -- roughly 10%. The
    slack is what a splitting has to spend: a balanced split s = s1*s2 needs both factors short,
    and the floor says ||s_j||_2 >= |N(s_j)|^{1/256} ~ 2^{458.7/256} = 2^{1.79} ~ 3.46, against a
    typical short element's 16. Whether ~107 bits of slack is room or is nothing is measurable.
    NUMBER TWO, THE HALF-IDEAL MINIMUM, AND EXACTLY WHAT IT IS A CONDITION FOR. The measurable
    proxy is the ratio F = (shortest element of a balanced half-ideal I1, found by LLL) /
    (its AM-GM floor N(I1)^{1/256}). F NEAR 1 IS A NECESSARY CONDITION FOR A SHORT MULTIPLICATIVE
    SPLITTING AND NOT A SUFFICIENT ONE, and the earlier draft read it as sufficient. An element t
    in I1 does not generate I1; F near 1 says the ideal contains a short element, not that s
    factors as s1*s2 with both factors short. The strictly stronger statement needs two further
    measured steps, and they are now separate obligations: (ii-a) I1 is PRINCIPAL, and (ii-b) it
    has a SHORT GENERATOR that can actually be produced. Step (ii-b) is not free even given
    (ii-a): the unit group of Z[zeta_512] has rank 127, so a principal ideal may have a short
    generator that a naive generator computation does not return, and recovering it is the
    short-generator problem of the CDPR line rather than a lookup.
    (E) A TRUE-PARAMETER ARM, DEMOTED TO WHAT IT ACTUALLY IS. Field norms are not random integers
    at SMALL primes, and the difference is large: for a rational prime p, the inertia degree
    f(p) = ord of p in (Z/512)^* controls everything; p splits into 256/f primes of norm p^f, and
    v_p(N(s)) is always a multiple of f(p). For a SPLIT prime -- p = 1 mod 512, f = 1, 256 primes
    above it -- the expected valuation is about 256/p, against about 1/(p-1) for a uniformly
    random integer of the same size: A FACTOR OF ROUGHLY 256, at the smallest such prime 7681
    giving ~0.0333 against ~0.00013. THIS IS NOT A DISCRIMINATOR AND IT IS NO LONGER PRESENTED AS
    ONE. The enhancement is forced by equidistribution of s modulo each of the 256 degree-one
    primes above 7681, for any coefficient law with adequate entropy mod p; it is the number field
    sieve's own founding phenomenon; and its outcome is known in advance. It is a PIPELINE
    CORRECTNESS FIXTURE of the same kind as the "valuations divisible by f(p), count must be 0"
    check, and it is run and reported as such. In particular it licenses NOTHING about the
    transfer of the reduced-n smoothness measurements to n = 256, because the quantity that must
    transfer is the LARGE-prime tail; see (E2) and heuristic H1.
    (E2) A TRUE-PARAMETER PROBE THAT CAN ACTUALLY FAIL, IN THE REGIME THAT MATTERS. In a large
    prime window [X, Y] the two models AGREE rather than differ, and that agreement is a derived
    forced value with no predetermined winner: for the norm model the expected number of prime
    divisors in the window is sum over split p in [X,Y] of 256/p ~ 256 * (1/256) *
    ln(ln Y / ln X) = ln(ln Y / ln X), because the factor-256 enhancement at split primes exactly
    cancels the 1/256 density of primes that are 1 mod 512; for a random integer it is
    sum over all p in [X,Y] of 1/(p-1) ~ ln(ln Y / ln X). The same number. So a measured contrast
    in the large-prime regime is a finding in EITHER direction and is not forced by
    equidistribution. The probe is specified in the mechanism as an ECM arm at declared effort on
    a subsample of the true-parameter 917-bit norms, against the identical effort on random
    integers of matched bit length.
    (F) THE OUTCOMES, DECLARED BEFORE THE RUN, WITH THE JOIN AUDIT ALREADY DECIDED.
    E0 (THE JOIN, DECIDED AT STAGE 0 AND AT ZERO COMPUTE): no attacker-computable key is known, so
    the template as a whole has no entry point from public data. Everything below is a component
    audit conditional on someone later supplying one, and none of it may be reported as a
    feasibility signal for an attack.
    E1 (BLOCKED AT THE GEOMETRY): ideal smoothness follows the Dickman rate, but F is large --
    balanced half-ideals contain no short element -- so the template dies at the SPLITTING step
    too, and the obstruction is geometric with F as its measured value.
    E2 (BLOCKED AT THE DISTRIBUTION): the smoothness of (s) departs from the Dickman prediction at
    the measured n, so the exemplar's Heuristic-1 slot cannot be filled there.
    E3 (THE NECESSARY CONDITION SURVIVES): smoothness at the Dickman rate AND F near 1. THIS MEANS
    ONLY THAT THE NECESSARY GEOMETRIC CONDITION IS NOT VIOLATED at the measured parameters. It
    does NOT mean a multiplicative splitting into enumerable halves exists, and it does not mean
    the template has an entry point -- the join is separately missing by (B2). Escalation requires
    E3 PLUS the two further measured steps of (D): principality of the half, and a short generator
    actually produced. E3 alone is reported as a non-refutation, not as a positive.
    (G) NOT CLAIMED. No attack, no break, no speedup, no exponent moved. No claim that any of
    E1-E3 is more likely than the honest priors below say. Every number above is the proposer's
    arithmetic or a standard-model expectation computed on 2026-08-21; NONE is a measurement and
    none is read from a committed run. No claim about what the literature contains. No direction
    is declared impossible; in particular E1 would close a TEMPLATE at MEASURED parameters, not a
    family, and (B2) records a missing component of one construction, not an impossibility.
  mechanism: >-
    STAGE 0 (derivation and audit, no compute; ITS FIRST OBLIGATION IS THE JOIN AND IT RUNS BEFORE
    ANY RESULTANT IS COMPUTED). Obligation 0-A, THE JOIN AUDIT: name the attacker-computable
    quantity that keys the meet-in-the-middle table given only the public (A, t = A s + e), or
    record in the run that none is known. The audit is a written search over the candidate keys,
    each with the reason it fails, and it must at minimum dispose of: N(s) and N(s) mod small
    primes; (s) and its factor ideals; N(t), N(t - A c) for candidate c; the ideal-coset test of
    claim (B2)(ii); and any per-coordinate variant, noting that for k >= 2 the public relation
    couples the k ring coordinates. IF NO KEY IS FOUND, the run's headline deliverable is that
    audit plus the named open sub-problem, and every later stage is explicitly relabelled as a
    component audit rather than a feasibility test. IF A KEY IS FOUND, that is by a wide margin
    the most valuable outcome of this record and it must be escalated immediately, before any
    measurement, because it changes what every later stage means.
    Obligation 0-B: write out the remaining template slots explicitly for ML-KEM and identify,
    before any data, which one each candidate obstruction would occupy: size bound (C),
    distribution (Dickman-de Bruijn for smooth ideals, with Landau's prime-ideal theorem supplying
    the ~pi(B) prime ideals of norm <= B in a degree-256 field), splitting (balanced ideal
    factorisation, with the necessary-versus-sufficient distinction of (D) written into the slot).
    Derive the slack prediction, the split-prime valuation predictions, and the large-prime
    forced value of (E2) in closed form.
    Obligation 0-C: write the u-ranges of heuristic H1 side by side before any transfer is
    claimed -- see H1's validation_plan, which carries them.
    STAGE 1 (TRUE-PARAMETER CORRECTNESS FIXTURES, n = 256, q irrelevant -- this is about Z, not
    Z_q. DEMOTED FROM DISCRIMINATOR TO FIXTURE, deliberately.) Sample 10^4 secrets s ~ CBD_eta for
    eta in {2,3} over Z[x]/(x^256+1) using the harness's own FIPS 203 sampler. Compute N(s)
    exactly as an integer resultant. Record: log2|N(s)|; ||s||_2; the SLACK
    256*log2||s||_2 - log2|N(s)|. FIXTURE 1-a: for every prime p <= 10^6, v_p(N(s)) must be a
    multiple of f(p) = ord of p in (Z/512)^*; the count of violations must be exactly 0.
    FIXTURE 1-b: the mean valuation at the split primes (p = 1 mod 512, from 7681) must match
    (256/f)/p^f rather than 1/(p-1). BOTH ARE PASS/FAIL CHECKS ON THE PIPELINE, NOT EVIDENCE ABOUT
    ML-KEM: their outcome is forced by equidistribution of s mod p for any coefficient law of
    adequate entropy, so passing them says the resultant and inertia bookkeeping are right and
    nothing more (KN-TECH-1a5b7e: a control that cannot fail is not a discriminator). Only the
    SLACK is a measurement in this stage.
    STAGE 1b (TRUE-PARAMETER LARGE-PRIME PROBE, and this one can fail). Take a subsample of 200 of
    the n = 256 norms (about 917 bits each). Run ECM at a declared effort -- curve count and B1/B2
    bounds chosen and CALIBRATED IN-HARNESS to give a declared probability of finding any prime
    factor below a declared bound B_ecm (e.g. 2^35); the calibration is itself reported, and an
    uncalibrated effort makes the arm unreportable. Record per sample the multiset of factors
    found and the bit length of the residual cofactor. STATISTICS: (a) the count of distinct prime
    factors found in a declared window [2^20, B_ecm]; (b) the empirical CDF of
    log2(largest factor found)/917. CONTROL, run in the same invocation at identical effort: 200
    uniformly random 917-bit integers. FORCED VALUE, DERIVED BEFORE THE RUN (claim (E2)): the
    expected count in a window [X, Y] is ln(ln Y / ln X) under BOTH models, so the contrast is
    forced to zero and neither model is favoured a priori. Report the contrast against the
    binomial spread over 200 samples. This is the only true-parameter statement this record can
    make about the LARGE-prime regime, and it is a measured lower bound on found-factor structure,
    never a smoothness claim.
    STAGE 2 (SMOOTHNESS ARM, reduced n, because full factorisation at n = 256 is infeasible and
    saying so is part of the design). At n in {16, 32, 64} with the analogous ring Z[x]/(x^n+1) and
    the SAME CBD_eta coefficient law, sample 10^5 secrets, compute N(s) (expected sizes about 25,
    67 and 165 bits by the same Gaussian calculation), FACTOR THEM COMPLETELY, and build the
    empirical CDF of log(largest prime factor)/log|N(s)|. Compare against the Dickman-de Bruijn
    rho(u) prediction with u = ln|N(s)|/ln B, exactly as the exemplar's section 4.2 does. TAIL
    CONSISTENCY CHECK, mandatory: the smoothest sample observed in each cell against the predicted
    rho(u) probability for that smoothness bound and that sample size. Also compute, at the same n,
    the IDEAL smoothness (largest prime-ideal norm dividing (s)) and compare it against the same
    rho(u), since the two notions differ and the template needs the ideal one. EVERY CONCLUSION
    FROM THIS STAGE IS SCOPED TO n <= 64 AND ITS u-RANGE; H1 carries the transfer statement and
    Stage 1 does not license it.
    STAGE 3 (THE SPLITTING ARM, which measures a NECESSARY condition). At n in {16, 32, 64}, for
    every sample whose (s) is B-smooth for a declared B, compute a BALANCED factorisation
    (s) = I1 * I2 with |log N(I1) - log N(I2)| minimised over the smooth prime-ideal multiset (a
    subset-sum, cheap at these sizes). Then run LLL on the ideal lattice I1 and record the shortest
    element found, its coefficient norm, and the ratio F = ||shortest||_2 / N(I1)^{1/n}. Report the
    distribution of F. F near 1 means the NECESSARY condition survives; F growing with n means it
    does not, and the growth rate is the obstruction's functional form.
    STAGE 3b (THE STEP THAT SEPARATES NECESSARY FROM SUFFICIENT, run only on cells where Stage 3
    gives F below the declared threshold). For each such I1: (a) decide PRINCIPALITY (feasible at
    n <= 64 with a class-group computation, and the class number and its computation cost are
    reported per n); (b) if principal, compute a generator and reduce it against the log-unit
    lattice to search for a SHORT generator, reporting the coefficient norm of the best generator
    found and the reduction budget spent. METRIC: the fraction of balanced halves that are
    principal, and among those the fraction with a generator of coefficient norm within the
    declared factor of the AM-GM floor. THE ESCALATION TRIGGER IS THIS METRIC AND NOT F. Note that
    (b) is a search with an upper-bound character -- failing to find a short generator does not
    prove none exists -- so a negative here is scoped to the declared budget, while a positive is
    a constructive witness and is exactly what would warrant escalation.
    STAGE 4 (NULL OBJECTS). See null_object_control.
    WHY THE OUTCOMES SEPARATE. E0 is decided at Stage 0 by algebra alone, before compute. Stage 2
    separates E2 from {E1, E3}: a departure from rho(u) in the ideal-smoothness CDF, beyond the
    declared threshold, means the exemplar's distributional slot cannot be filled at the measured
    n. Stage 3 separates E1 from E3: F near 1 versus F growing. Stage 3b decides whether an E3
    reading is a non-refutation or a constructive witness. Stage 1b is the only arm that says
    anything at true parameters about the regime H1 lives in, and it is reported as its own
    contrast, not as a transfer licence.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant, answers
      nothing) and NO SHELL is available, so all corpus searches were run with the Grep (ripgrep)
      tool and are recorded as patterns and paths.
      GREPS RUN:
      (1) 'Dickman|field norm|N_\{K/Q\}|resultant of the secret|smoothness of the norm|ideal norm|
      splitting behaviour|inertia degree' -i over ledger/ -> 97 files, of which 46 are proposals.
      Inspection of the ML-KEM subset (via the RQ-MLKEM-001 file list, 38 files, cross-checked
      against the 26 pre-extracted lane titles which WERE READ IN FULL) shows the matches in this
      lane are on the words "ideal" and "norm" in unrelated senses -- IDEA-20260805-e805b6 (the
      determinant IDEAL of the module lattice), IDEA-20260805-530869, IDEA-20260805-44bc0b,
      IDEA-20260805-73cccc, IDEA-20260805-250e50, IDEA-20260805-f9e801, IDEA-20260805-a9a95d.
      NONE takes the field norm of the SECRET as an object, and none mentions Dickman, smoothness,
      inertia degrees or ideal factorisation of a secret.
      (2) 'Luo|2605.17412|Module Lattice Security|logical qubit|approximation factor' -i over the
      repository -> 163 files, used to confirm that the tower-PIP/class-group family is already
      occupied in this lane by IDEA-20260805-e805b6 so that this record stays out of it.
      (3) 'RQ-MLKEM-001' over ledger/proposals -> 38 files.
      FILES READ: ledger/questions/RQ-MLKEM-001.yaml; the 26 lane titles in full;
      ledger/proposals/IDEA-20260805-e805b6.yaml (title, claim, tracked object, mechanism and
      proof-map excerpts, confirming it tracks the DETERMINANT IDEAL of the module lattice and not
      the norm of the secret); ledger/proposals/IDEA-20260805-574cd0.yaml lines 1-141, whose
      enumeration of what the lane's inherited "the algebra is closed at 17 bits" constraint does
      NOT reach begins with "nonlinear maps" -- and the field norm is exactly a nonlinear map, so
      this record is inside a class 574cd0 declares uncovered; docs/target-result-profile.md in
      full, which is the source of the four-slot template and of the A7 validation requirements
      (sampling method, scale, comparison distribution, tail checks, transfer assumptions);
      docs/inventor-protocol.md; knowledge/techniques/KN-TECH-1a5b7e.md.
      WEB QUERIES RUN (WebSearch): 'Kyber secret field norm smoothness cyclotomic ideal
      factorization meet-in-the-middle attack Z[zeta_512]'. It returned nothing on the specific
      combination and explicitly said so; it surfaced only general MITM material, a Kyber
      correctness proof, a two-step attack case study, and the Luo preprint. That is WEAK EVIDENCE
      OF ABSENCE and is not treated as more.
      WEB PAGES FETCHED for this record: none. The exemplar's own text is available locally at
      inputs/P13-WESOLOWSKI-2026/paper_fulltext.md and is cited as internal; it was NOT re-read in
      full this session, only its structure as recorded in docs/target-result-profile.md sections
      A1-A8, and that is stated rather than glossed.
      NOT DONE, AND SAID SO: no targeted search for prior work on smooth values of cyclotomic norm
      forms of bounded-coefficient elements, nor on the AM-GM slack of lattice secrets, beyond the
      one query above. The relevant classical literature (smooth values of norm forms; the number
      field sieve's own smoothness heuristics for algebraic norms; the CDPR short-generator line
      that Stage 3b now depends on) certainly exists and is not screened here.
      2026-08-21 REPAIR PASS: no new external retrieval was performed. The three changes below are
      algebraic and internal -- the join audit, the necessary-versus-sufficient correction to E3,
      and the demotion of the split-prime arm -- and none of them rests on a source not already
      listed. That is why the screen's verdict is unchanged.
    results: >-
      No record in this repository takes the field norm of a lattice secret as an object, computes
      an AM-GM/Minkowski slack for one, or measures the smoothness of anything belonging to ML-KEM.
      The lane's 26 proposals cover isometry orbits and their DAG ceiling, per-coordinate
      likelihood scoring, compression-cell decoding, the d_u = 11 two-class mixture, weak-key lanes,
      failure-oracle reachability, the DFR's two directions, quantum-route pricing and the
      tower-PIP/determinant-ideal audit, the enumeration/sieving crossover, best-of-M and its Beta
      law, dense-CBD hybrid decoding, and the ring-deleted null. The nearest neighbour is
      IDEA-20260805-e805b6, which tracks the DETERMINANT IDEAL of the module lattice M(A) and
      proves it is (q^k) independently of A, hence carries zero information about s. That is an
      ideal-theoretic object and it is a different one: the determinant ideal is an invariant of
      the LATTICE and is constant across instances by that record's own derivation, whereas N(s) is
      an invariant of the SECRET and varies with it by construction. The two records are
      complementary and their conclusions are independent. NOTE, AFTER THE REPAIR PASS, THAT THEY
      ALSO SHARE A FAILURE MODE WORTH RECORDING FOR THE LANE: e805b6's object is constant across
      instances and therefore carries nothing, while this record's object varies with the secret
      but is not computable from public data. "Varies with the secret" and "computable by the
      attacker" are independent properties and a tracked object needs both; the lane has now
      produced one record failing each way.
    verdict: >-
      SPECULATIVE. The mathematics used is classical and none of it is claimed as new: the AM-GM
      bound on norms, the inertia-degree structure of primes in Q(zeta_512), Landau's prime ideal
      theorem, Dickman-de Bruijn, and the fact that algebraic norms are smoother than random
      integers at split primes (the phenomenon the number field sieve is built on) are all
      textbook. WHAT IS CLAIMED NEW RELATIVE TO THIS REPOSITORY: taking N(s) of the ML-KEM secret
      as a tracked object; the SLACK above the AM-GM floor as a named, measurable quantity with a
      derived prediction of ~107 of 1024 bits; the half-ideal minimum ratio F together with the
      principality-and-short-generator steps that separate the necessary condition from the
      sufficient one; and the written join audit of claim (B2), which is the part a reader should
      look at first. WITHDRAWN FROM THE EARLIER DRAFT: that the split-prime valuation test is a
      discriminator (it is a fixture whose outcome is forced by equidistribution), that it
      licenses transfer of the reduced-n smoothness measurements (it does not -- it probes a
      u-range an order of magnitude away from the one that matters), and that F near 1 would show
      a multiplicative splitting into enumerable halves EXISTS (it is necessary, not sufficient).
      NOVELTY AGAINST THE EXTERNAL LITERATURE IS NOT ESTABLISHED and one web query is not a
      screen; a reviewer with retrieval should chase smooth-values-of-norm-forms, NFS
      smoothness-heuristic literature, and the CDPR short-generator line before this is called new
      anywhere outside this repository.
      LABEL FORCED TO `unverified` BY RULE, NOT BY DOUBT: this record rests on citations marked
      provenance `recalled`, and AGENTS.md rule 9 (enforced by tools/validate_ledger.py
      check_citations) requires novelty_status `unverified` until such a source is actually read. The
      substantive assessment above is unchanged; what cannot be asserted is a checked literature
      negative.
  object_first_candidate:
    tracked_object: >-
      N(s) = Res(s(x), x^256+1), the field norm of one ring coordinate of the ML-KEM secret,
      together with the factorisation type of the ideal (s) in Z[zeta_512] -- followed from the
      CBD sampler, through ring multiplication, to the point where it dissolves.
    lossiness: >-
      EXTREMELY LOSSY AND UNAMBIGUOUSLY SO: 256 integer coordinates are projected onto a single
      integer (or onto a multiset of prime ideals), with fibres of astronomical size -- all 2^17
      images of s under the unit-and-Galois isometry group share the same norm up to sign, and vastly
      more elements than that do. It is not a change of coordinates by any reading. THE DISCARD IS
      COMPATIBLE WITH ONE OF THE TARGET'S TWO OPERATIONS AND NOT THE OTHER, and this is the honest
      statement rather than a hidden weakness: N(u*v) = N(u)*N(v) exactly, so the projection
      commutes with ring multiplication; N(u+v) is not a function of N(u) and N(v), so it does not
      commute with addition. Since ML-KEM's hardness comes precisely from an addition -- the error
      -- the object's incompatibility is located exactly at the source of the difficulty.
      A SECOND, INDEPENDENT LIMIT, NOW STATED HERE RATHER THAN LEFT TO THE READER: passing the
      lossy-projection test makes the object well-defined and propagating, and says NOTHING about
      whether the attacker can evaluate it. N(s) is a function of the SECRET, and no map from the
      public (A, t) to it is known (claim (B2)). A projection can be perfectly lossy, perfectly
      propagating, and still unusable because it is not computable on the attacker's side; that is
      this object's actual status and it is the reason this record is a component audit.
    propagation: >-
      One step = one ring multiplication, and the law is an identity: the norm of a product is the
      product of the norms, and the ideal factorisation of a product is the multiset union of the
      factorisations. Measurable trivially and exactly. THE EARLIER DRAFT ADDED THAT THIS IS WHAT
      MAKES THE MitM JOIN EXACT; that addition is WITHDRAWN. Ideal equality is decidable, so the
      join would be exact IF both sides of the table could be computed -- but one side is keyed by
      a factor of (s) and s is unknown, so the exactness of the equality test is irrelevant. What
      propagates deterministically is the object under multiplication; what does not exist is an
      attacker-side evaluation of it.
    survival_score: >-
      Exactly one step, and the dissolution point is named: the object dies at the first addition of
      the LWE error, because N is not additive. THE SHARPER LIMIT IS THAT THE ONE SURVIVING STEP IS
      NOT REACHABLE FROM PUBLIC DATA. Even granting the multiplicative step, an attacker holding
      only (A, t) has no way to enter it (claim (B2)), so the honest survival score is: one step in
      principle, zero steps from the attacker's side under any construction known to the proposer.
      The record measures the two quantities (slack, and the half-ideal minimum ratio F with its
      principality and short-generator follow-ups) that would decide the surviving step if an entry
      were supplied, and it says plainly that supplying one is an unsolved sub-problem.
  null_object_control: >-
    NULLS AND FIXTURES, WITH THE EARLIER DRAFT'S "NULL-1" CORRECTLY RECLASSIFIED.
    FIXTURE-A, THE SPLIT-PRIME MODEL CHECK (was NULL-1, and was wrongly called a genuine two-model
    comparison): for each measured small-prime statistic of N(s), compute the same statistic for a
    uniformly random integer of the SAME BIT LENGTH; derived values E[v_p] = 1/(p-1) for the random
    integer against (256/f(p))/p^{f(p)} for the norm model, differing by ~256 at p = 7681. THE
    WINNER IS KNOWN IN ADVANCE: the norm-model value is forced by equidistribution of s modulo each
    of the 256 degree-one primes above 7681, for any coefficient law with adequate entropy mod p,
    so this cannot come out the other way except through an implementation bug. It is therefore run
    and reported as a PIPELINE CORRECTNESS FIXTURE alongside the f(p)-divisibility check, and it is
    not counted as evidence about ML-KEM (KN-TECH-1a5b7e: a control that cannot fail).
    NULL-1 (REPLACEMENT, AND IT CAN FAIL), THE LARGE-PRIME ARM OF STAGE 1b: the same ECM effort on
    200 uniformly random 917-bit integers as on 200 true-parameter norms. FORCED VALUE DERIVED
    BEFORE THE RUN: equal expected divisor counts in any window, ln(ln Y / ln X), because the
    split-prime enhancement cancels the split-prime density. Neither model is favoured; a contrast
    in either direction is a finding; the comparator's spread is the binomial spread over 200
    samples and is reported.
    NULL-2, THE SHAPE-MATCHED NON-CBD NULL: replace CBD_eta coefficients by uniform integers in the
    same range, matched in variance, keeping n and the ring fixed. The AM-GM slack and the split-prime
    valuations should be essentially identical, because both depend on s only through the geometry
    of its embeddings and not on the fine shape of the coefficient law. IF THEY DIFFER, the measured
    statistic is reading the coefficient law rather than the norm structure, and the whole framing
    is misdirected. This control can fail and its failure is informative.
    NULL-3, THE RING-DELETED NULL: replace Z[x]/(x^n+1) by Z[x]/(g) for a random monic irreducible g
    of the same degree with comparable discriminant. The exemplar's template depends on the
    cyclotomic tower and on the inertia structure of (Z/2n)^*; a random field has no such structure,
    so the split-prime signature must VANISH there. If the signature is present in the random field
    too, the inertia bookkeeping is wrong. NOTE THAT THIS TOO IS PRIMARILY A FIXTURE for the same
    reason FIXTURE-A is, and it is reported as one; it retains real power only against
    implementation error, which is worth having and is not worth calling a discriminator.
    POSITIVE CONTROL, PLANTED PRODUCT (required for Stage 3 and now also for Stage 3b): an element
    deliberately constructed as s = s1*s2 with s1, s2 short. There F must be near 1, the halves must
    be principal, and a short generator must be recoverable within the declared budget. A method
    that cannot detect a splitting that exists by construction cannot issue an E1 verdict -- and,
    after the repair pass, cannot issue an E3 verdict either, because Stage 3b's negative branch is
    a search failure and needs the positive control to be interpretable.
    SENSITIVITY, COMPARATOR NAMED AND THRESHOLD DECLARED BEFORE THE RUN: the graded control is n
    itself. F is measured at n = 16, 32, 64 -- three interior points on a doubling ladder -- and its
    MONOTONICITY in n is reported. Two endpoints do not give a direction (KN-TECH-1a5b7e); a
    non-monotone F forbids the reading "the halves get relatively longer as n grows" and only the
    per-n values may be quoted.
  discriminated_from:
    - >-
      IDEA-20260805-e805b6 tracks the DETERMINANT IDEAL of the module lattice M(A) and derives that
      it equals (q^k) independently of A, hence carries no information about s -- an audit of an
      external tower-PIP pipeline. This record tracks the norm of the SECRET, which varies with the
      secret by construction, and proposes no principal-ideal pipeline, no class group over the full
      ring, no unit lattice at n = 256 and no quantum step. e805b6's forced value is unaffected by
      every outcome here and vice versa. (Stage 3b does use a class-group and log-unit computation,
      but only at n <= 64 and only as a measurement on half-ideals, not as an attack pipeline.)
    - >-
      IDEA-20260805-574cd0 audits the lane's inherited "the algebra is closed at about 17 bits"
      constraint, proves it for the subfield/trace descent, and names "nonlinear maps" first among
      the classes the constraint does not reach. The field norm is a nonlinear map, so this record
      lives in a class 574cd0 explicitly declares uncovered -- and it is careful not to defy the
      constraint but to work where the constraint's own auditor says it does not range. 574cd0's
      2^17 isometry count is in fact used here, as the size of the trivial fibre of N.
    - >-
      IDEA-20260813-17acdf (dense-CBD hybrid decoding) and any hybrid MITM record split the secret
      ADDITIVELY by coordinate blocks and join approximately, with the join cost dominated by
      near-neighbour matching. This record splits MULTIPLICATIVELY. The earlier draft justified the
      contrast by an EXACT ideal join; that justification is withdrawn, because the exact join has
      no attacker-computable key (claim (B2)). The contrast that survives is structural rather than
      operational: additive hybrid attacks have a working (if expensive) join and this family does
      not, which is itself the useful comparison for a later proposer.
    - >-
      IDEA-20260805-1d76e9 (the luckiest key is not lucky enough) is about the left tail of the
      SECRET NORM across many keys and concludes it before any lattice is reduced. This record is
      about the FIELD NORM of a typical key, not about the tail of the Euclidean norm across keys,
      and its statistic would be measured on every key rather than on a selected one.
    - >-
      IDEA-20260821-019d2f (same batch) tracks the ADDITIVE CRT projection pi_S and its dual
      functional lattice. This record tracks the MULTIPLICATIVE norm. The two are the additive and
      multiplicative halves of the same ring structure and their measurements are independent: one
      could come out null while the other does not. Note the asymmetry the repair pass exposes:
      019d2f's object IS computable from public data (pi_S is applied to whatever the attacker
      holds), while this one's is not.
    - >-
      A subfield/norm-descent attack in the Albrecht-Bai-Ducas overstretched-NTRU sense applies the
      RELATIVE norm to reduce dimension, and is known to require an overstretched modulus. Nothing
      here reduces dimension, applies a relative norm, or touches the modulus at all -- N is the
      absolute norm to Q and the object lives in Z, not Z_q.
  citations:
    - ref: 'inputs/P13-WESOLOWSKI-2026/paper_fulltext.md (Wesolowski, "The supersingular isogeny problem in time and memory p^{1/3+o(1)}")'
