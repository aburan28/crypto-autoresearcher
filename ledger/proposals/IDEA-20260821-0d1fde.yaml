      verified_by: idea-generator@2026-08-21
  assumptions:
    - >-
      NO ATTACKER-COMPUTABLE KEY FOR THE MitM JOIN IS KNOWN. This is not an assumption in the
      record's favour; it is a declared defect of the template as instantiated, established by the
      Stage-0 audit, and it caps what any later stage can mean. Every conclusion below is
      conditional on someone later supplying such a key, and none of them is a feasibility signal
      for an attack in its absence.
    - >-
      F near 1 is NECESSARY and NOT SUFFICIENT for a short multiplicative splitting. The measured
      family is "s lies in a product of two ideals each containing a short element", which is
      strictly weaker than "s = s1*s2 with both factors short". A negative on the weaker family
      implies a negative on the stronger one; the converse does not hold, and no positive reading
      may run backwards along that implication.
    - >-
      The reduced-parameter rings Z[x]/(x^n+1) for n in {16,32,64} are scale models of n = 256 for
      the smoothness statistics. THIS IS AN ASSUMPTION AND IT IS NOT TESTED BY STAGE 1. The earlier
      draft claimed Stage 1's split-prime signature licensed the transfer; it does not, because
      that signature is governed by equidistribution mod p and agrees in every cell, while the
      quantity that must transfer is the large-prime tail at u-values that differ by an order of
      magnitude. The u-ranges are written out side by side in H1's validation plan and the transfer
      is carried as an explicit, unlicensed assumption.
    - >-
      LLL on an ideal lattice of dimension n <= 64 finds something close enough to the minimum for
      F to be meaningful. F as measured is an UPPER bound on the true ratio, which is the
      conservative direction for an E1 verdict and the dangerous direction for an E3 verdict -- so
      an E3 signal must be re-checked with stronger reduction, and then must clear Stage 3b, before
      it is reported.
    - >-
      Exact integer resultants at n = 256 with 917-bit outputs are cheap. They are; this is
      standard exact arithmetic and no approximation is used.
    - >-
      The Gaussian model for the embeddings s(zeta_i) is used only to PREDICT the slack, never to
      measure it. The slack is measured exactly from the computed resultant and the computed norm.
    - >-
      Nothing here constructs an attack, an oracle or a query. All conclusions are about the
      feasibility of a template's components, and one component is already known to be missing.
  proof_search_map:
    bottleneck: >-
      TWO, IN ORDER. FIRST the join: the exemplar's meet-in-the-middle works because the target is
      given by the instance, and here it is not -- no attacker-computable key is known, so the
      template has no entry point from public data regardless of every other component. SECOND,
      conditional on a key ever being supplied, the half-ideal minimum ratio F together with the
      principality and short-generator steps: the exemplar's splitting step works because both
      halves are below an explicit degree threshold and are therefore enumerable, and the ML-KEM
      analogue needs a balanced half-ideal that contains a short element AND is principal AND has a
      short generator that can be produced.
    baseline_embedding:
      parameter_slice: >-
        The exemplar itself at its own parameters is the family baseline, and this proposal is
        explicitly NOT a family extension of it -- the objects (isogeny degrees versus field norms)
        and the ambient problems differ, and the join audit is precisely a statement of where the
        analogy breaks. The reproducible boundary slice available here is different and is used
        instead: n = 1 (the ring is Z, N(s) = s, and every statement becomes an ordinary statement
        about integers, where the slack is 0 by definition and the split-prime model coincides with
        the random-integer model).
      reproduction_check: >-
        A frozen fixture at n = 1 and at n = 2 (Z[i]) where N(a+bi) = a^2+b^2 and the splitting
        behaviour of primes is Fermat's classical theorem: the pipeline must reproduce that only
        primes 1 mod 4 and 2 divide norms with odd valuation and that 3 mod 4 primes appear only to
        even powers. Exact, symbolic, instant, and a failure means the inertia bookkeeping is wrong.
        A second fixture at n = 2: every ideal of Z[i] is principal (class number 1), so Stage 3b's
        principality test must return 100% there; a lower rate means the class-group code is wrong.
    observation_collision:
      observable: >-
        N(s), and the ideal factorisation of (s).
      distinct_preimage_search: >-
        THE COLLISION IS MASSIVE AND IS ADMITTED: N is invariant under the entire 2^17-element
        unit-and-Galois isometry group (up to sign), and far beyond that, so vastly many distinct
        secrets share a norm. The observable is therefore NOT identifying and no conclusion of the
        form "N(s) determines s" is licensed anywhere. A sharper collision on the side that matters:
        two ideals of the same norm can have wildly different minima, so N(I1) does not determine
        the enumerability of I1 -- which is exactly why F is measured directly rather than inferred
        from norms, and why the AM-GM floor is used only as a LOWER bound. A THIRD COLLISION, ADDED
        BY THE REPAIR PASS AND THE MOST DAMAGING OF THE THREE: the observable is not computable
        from the public data at all, so the "distinct preimage" question is moot on the attacker's
        side -- the attacker holds no image to collide.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move from the additive/lattice model of the secret to the multiplicative/ideal model,
          where the exemplar's hypothesis (an exact smoothness condition) is an exact factorisation
          statement rather than an approximate norm condition.
        predicted_gain: >-
          Predicted NONE at ML-KEM parameters. THE FAILING OBLIGATION IS NOW NAMED CORRECTLY AS THE
          ENCODING/INTERFACE ONE AND NOT ONLY THE SIZE ONE: the encoding of the secret into the
          multiplicative model is exact as a ring map, but it is not evaluable from the public
          (A, t), so the transform has no attacker-side interface. Conditional on that being fixed,
          the size obligation is predicted to fail too: predicted F growing with n; predicted no
          enumerable table.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "s factors into two short elements" to "s lies in a
          product of two ideals each containing a short element", which is strictly weaker and
          strictly larger, and ask for a strict inward improvement rather than mere feasibility.
        predicted_gain: >-
          The weaker family is what Stage 3 actually measures, and it is chosen because a negative
          on the WEAKER family is a stronger negative: if even the weakened version fails, the
          stronger one cannot succeed. THE IMPLICATION RUNS ONE WAY ONLY, and the repair pass makes
          that binding on the positive branch as well: an E3 reading may not be lifted back to the
          stronger family without Stage 3b's principality and short-generator measurements. Stage
          3b is the inward step from the lifted boundary back to the original family, and it is now
          the escalation trigger.
    quantifier_order: >-
      FOR ALL n in the tested ladder and FOR ALL secrets s ~ CBD_eta whose ideal (s) is B-smooth,
      THERE EXISTS no balanced factorisation (s) = I1*I2 such that I1 contains an element of
      coefficient norm within a factor F0 of N(I1)^{1/n}, for a declared F0. The negation -- THERE
      EXISTS n, THERE EXISTS s, THERE EXISTS such a factorisation -- is E3, AND E3 IS A STATEMENT
      ABOUT THE WEAKER (LIFTED) FAMILY ONLY. The stronger statement has a longer quantifier and it
      is stated separately so the two cannot be conflated: THERE EXISTS a balanced factorisation
      with I1 principal AND THERE EXISTS a generator g of I1 with ||g||_2 within F0 of
      N(I1)^{1/n}. Stage 3 addresses the first; Stage 3b addresses the second. Note that the
      witness factorisation is allowed to depend on s in both.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at n in {16,32,64}, with CBD_eta coefficients, at the declared smoothness bound,
        the declared LLL budget and the declared generator-search budget, balanced half-ideals of
        ML-KEM-shaped secrets contain no element within a factor F of the AM-GM floor / are
        principal at rate X / admit a short generator at rate Y, and these behave as measured in
        n." It cannot certify anything at n = 256 for Stages 2-3 (full factorisation is infeasible
        there and the record says so), cannot certify that no multiplicative decomposition works,
        cannot certify anything about non-balanced or many-factor splittings unless those are also
        run, and -- because of claim (B2) -- cannot certify anything about attack feasibility at
        all, in either direction, since the join is missing independently of every measurement.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion DOES hold is an element deliberately
        constructed as a product of two short elements, s = s1*s2 with s1, s2 short. There the
        splitting exists by construction, F must be near 1, the halves must be principal, and a
        short generator must be recoverable. A method that cannot distinguish a planted product
        from a CBD sample has not identified the load-bearing structure, and this planted-product
        arm is REQUIRED, not optional -- it is the positive control without which neither an E1 nor
        a Stage-3b negative is interpretable.
    proof_obligations:
      - claim: 'No attacker-computable quantity keying the MitM table is known, given only the public (A, t = A s + e); the candidate list of claim (B2) is disposed of item by item.'
        responsibility: interface
      - claim: 'For module rank k >= 2 the public relation couples the k ring coordinates, so no per-coordinate ideal-coset test is available without the other k-1 coordinates.'
        responsibility: interface
      - claim: 'sum_i |s(zeta_i)|^2 = n ||s||_2^2 for power-of-two cyclotomics, hence ||s||_2 >= |N(s)|^{1/n}.'
        responsibility: correctness
      - claim: 'E[log2|N(s)|] = n*(log2(n sigma^2) - gamma/ln2)/2 under the Gaussian embedding model; ~917.4 bits at n=256, sigma=1.'
        responsibility: size
      - claim: 'v_p(N(s)) is a multiple of f(p) = ord of p in (Z/2n)^*; split primes have n primes above them. FIXTURE, forced by equidistribution, not evidence.'
        responsibility: interface
      - claim: 'E[v_p(N(s))] ~ (n/f)/p^f for the norm model versus 1/(p-1) for a random integer at SMALL primes; and the two models agree, at ln(ln Y / ln X), on expected divisor counts in a LARGE-prime window.'
        responsibility: size
      - claim: 'Ideal smoothness of (s) follows rho(u) with u = ln|N(s)|/ln B at the tested n, or it does not.'
        responsibility: success_probability
      - claim: 'F = shortest(I1)/N(I1)^{1/n} measured by LLL is an upper bound on the true ratio.'
        responsibility: scope
      - claim: 'F near 1 is NECESSARY and not sufficient: an element of I1 need not generate I1, so no splitting into short factors follows from F alone.'
        responsibility: correctness
      - claim: 'Principality of the balanced half I1, measured at n <= 64 by class-group computation, with the class number and computation cost reported.'
        responsibility: feasibility
      - claim: 'A SHORT GENERATOR of a principal I1 actually produced within a declared log-unit reduction budget; a failure is scoped to that budget and is not a proof of non-existence.'
        responsibility: feasibility
      - claim: 'The planted-product positive control returns F near 1, principality, and a recovered short generator.'
        responsibility: feasibility
      - claim: 'Stages 2-3 conclusions are scoped to n <= 64 and its u-range; transfer to n = 256 is an unlicensed assumption carried by H1 with both u-ranges written out.'
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: 'Stage-0 join audit: number of attacker-computable keys found for the MitM table, given only (A, t)'
      direction: different
      minimum_effect: >-
        Predicted 0, and the candidate list of claim (B2) is disposed of in writing. A count of 1 or
        more is the single most valuable outcome of this record and must be escalated to
        independent review BEFORE any measurement is taken, because it changes what every later
        stage means. This prediction costs no compute and is the record's cheapest content.
    - metric: 'SLACK = 256*log2||s||_2 - log2|N(s)|, mean over 10^4 CBD_2 secrets at n = 256'
      direction: different
      minimum_effect: >-
        Predicted 106.6 bits. A measured mean outside 95-120 bits falsifies the Gaussian embedding
        model for CBD secrets, which is itself a finding about the secret distribution.
    - metric: 'FIXTURE-A: E[v_p(N(s))] at p = 7681 (f = 1, split), 10^4 samples at n = 256'
      direction: higher
      minimum_effect: >-
        Predicted ~0.0333 under the norm model against ~0.00013 for a random integer. REPORTED AS A
        PASS/FAIL FIXTURE, NOT A DISCRIMINATOR: the enhancement is forced by equidistribution of s
        mod p for any adequate-entropy coefficient law, so failing it means the resultant or
        inertia code is wrong and passing it says nothing about ML-KEM.
    - metric: 'fraction of samples with v_p(N(s)) not a multiple of f(p), over all p <= 10^6'
      direction: lower
      minimum_effect: >-
        EXACTLY 0. Forced by the splitting theorem; a correctness check on the pipeline.
    - metric: >-
        Stage 1b: difference in the mean count of distinct prime factors found by ECM in
        [2^20, B_ecm], true-parameter 917-bit norms minus matched random integers, at identical
        declared effort
      direction: different
      minimum_effect: >-
        FORCED VALUE ZERO, derived before the run (claim (E2)): both models predict
        ln(ln Y / ln X). Declared minimum effect: a contrast exceeding twice the binomial standard
        error over 200 samples, in EITHER direction. A positive contrast would say the norms retain
        an enhancement into the large-prime regime that the small-prime cancellation argument does
        not predict; a negative contrast would say they are large-prime-poorer than random
        integers, which would be a direct problem for H1. This is the only Stage-1 arm whose
        outcome is not known in advance.
    - metric: >-
        Kolmogorov-Smirnov distance between the empirical CDF of log(largest prime ideal norm
        dividing (s))/log|N(s)| and the Dickman-de Bruijn prediction, at n in {16,32,64}
      direction: lower
      minimum_effect: >-
        0.05. Agreement below 0.05 supports the distributional slot being fillable AT THOSE n (not
        E2); a distance above it is E2 at those n. No statement about n = 256 follows either way.
    - metric: 'F = shortest(I1)/N(I1)^{1/n} for balanced half-ideals, median over smooth samples, per n'
      direction: higher
      minimum_effect: >-
        Predicted F >= 4 at n = 64 and increasing with n. A median F below 2 at n = 64 means the
        NECESSARY condition survives at that n; it is NOT an escalation trigger on its own and must
        be passed to Stage 3b.
    - metric: >-
        Stage 3b: fraction of balanced halves that are principal, and among those the fraction with
        a generator of coefficient norm within the declared factor of the AM-GM floor, per n
      direction: lower
      minimum_effect: >-
        No confident prediction is offered for the principality rate, which is governed by the
        class number of Q(zeta_{2n}) at the tested n and should be reported rather than guessed.
        THE ESCALATION TRIGGER IS HERE: a nonzero short-generator rate on CBD samples, with the
        planted-product positive control passing, is the outcome that warrants independent review.
        A zero rate with the positive control passing is a scoped negative on the stronger family.
    - metric: 'F, principality and short-generator recovery on the planted-product positive control'
      direction: lower
      minimum_effect: >-
        F at most 1.5, principality 100%, and the planted short generator recovered in at least 95%
        of cells. Failure of any of the three means the measurement cannot detect a splitting that
        exists by construction, and no verdict of either sign is reportable.
  minimal_test:
    design: >-
      STAGE 0, OBLIGATION 0-A ALONE: THE JOIN AUDIT. Zero compute, no sampling, no lattice, no
      resultant. Written work: enumerate the candidate attacker-computable keys for the
      meet-in-the-middle table given only the public (A, t = A s + e) -- N(s); N(s) mod small
      primes; the ideal (s) and its factor ideals; N(t) and N(t - A c) for candidate c; the
      ideal-coset test of claim (B2)(ii); per-coordinate variants -- and record for each the exact
      reason it does or does not key an exact table on the attacker's side, noting for the coset
      test that it is a CVP per candidate rather than a lookup and that for k >= 2 the public
      relation couples the k ring coordinates. Deliverable: either a named key, or a written
      negative with the candidate list, plus the open sub-problem stated for the next proposer.
      Person-hours: two to four. Compute: none.
      IT IS THE CHEAPEST VALID DISCRIMINATOR IN THIS RECORD BECAUSE IT DECIDES, BEFORE ANY
      MEASUREMENT, WHAT EVERY LATER MEASUREMENT CAN MEAN. If a key exists, Stages 1-3 become a
      feasibility test of a template with all four slots present and the record's priority jumps.
      If none exists, Stages 1-3 are a component audit of a template with a missing join, their
      results cannot be reported as feasibility signals, and the honest deliverable shrinks to the
      slack measurement, the smoothness CDFs at n <= 64, the F and Stage-3b curves, and the named
      open sub-problem. It CAN come out either way and it costs nothing, which is exactly why the
      earlier draft's failure to run it was the record's central defect.
      SECOND CHEAPEST, IF COMPUTE IS AUTHORISED: Stage 1's slack measurement plus Stage 1b's ECM
      arm, at true FIPS ring parameters. Sample 10^4 secrets s ~ CBD_2 over Z[x]/(x^256+1) with the
      harness's own FIPS 203 sampler; compute N(s) exactly; report the slack distribution against
      the predicted 106.6 bits; run the f(p)-divisibility and split-prime FIXTURES and report them
      as fixtures; then run the ECM arm of Stage 1b with its matched random-integer control at
      identical calibrated effort. COST: 10^4 exact resultants at degree 256 plus trial division to
      10^6, minutes to hours single-core; the ECM arm at 200 samples is the dominant cost and is
      bounded by the declared effort. THIS ARM CAN COME OUT NEGATIVE IN TWO WAYS THAT ARE NOT
      IMPLEMENTATION BUGS: the slack lands outside 95-120 bits (the Gaussian embedding model is
      wrong at n = 256), or the ECM contrast against matched random integers exceeds twice the
      binomial standard error in either direction (the large-prime regime is not model-neutral, and
      H1's transfer premise is directly affected). Stages 2, 3 and 3b cost more -- 10^5 full
      factorisations at n <= 64, LLL on ideal lattices, and class-group plus log-unit computations
      -- and are worth running only after the join audit has fixed what they mean.
    controls:
      - 'FIXTURE-A: split-prime valuation model check, reported as a pipeline fixture and NOT as a discriminator.'
      - 'Exactness fixture: v_p(N(s)) divisible by f(p) for every p and every sample, count must be 0.'
      - 'NULL-1 (replacement): Stage 1b''s matched random-integer ECM arm at identical calibrated effort, with the forced value ln(ln Y / ln X) derived before the run.'
      - 'NULL-2: uniform coefficients at matched variance; the statistic must not read the coefficient law.'
      - 'NULL-3: random degree-256 number field; the split-prime signature must vanish there (fixture-grade).'
      - 'PLANTED-PRODUCT positive control for Stages 3 and 3b; without it neither an E1 verdict nor a Stage-3b negative is interpretable.'
      - 'n = 1 and n = 2 (Gaussian integers) symbolic fixtures for the inertia bookkeeping, plus the class-number-1 fixture at n = 2 for the principality code.'
      - 'Graded control in n across three interior points, with monotonicity of F reported.'
      - 'ECM effort calibration reported; an uncalibrated ECM arm is unreportable.'
    required_metrics:
      - 'the Stage-0 join audit: the candidate list, the disposition of each, and the named open sub-problem'
      - 'slack distribution at n = 256, mean and spread, against the 106.6-bit prediction'
      - 'mean v_p(N(s)) per prime class (by inertia degree) against both models, reported as FIXTURE pass/fail'
      - 'count of valuations not divisible by f(p) (must be 0)'
      - 'Stage 1b: ECM effort calibration; per-arm distinct-factor counts in the declared window; largest-factor CDFs; the signed contrast with its binomial interval'
      - 'NULL-2 and NULL-3 versions of every Stage-1 statistic'
      - 'empirical CDF of ideal-smoothness at n in {16,32,64} against rho(u), with KS distance, and the u-range each cell occupies'
      - 'tail check: smoothest observed sample per cell versus predicted rho(u) at that bound and sample size'
      - 'F distribution per n, median and quartiles, plus the planted-product control value'
      - 'Stage 3b: principality rate per n with the class number used; short-generator recovery rate with the declared reduction budget; the same three on the planted control'
      - 'monotonicity flag for F in n'
  falsification_conditions:
    - >-
      The Stage-0 join audit FINDS an attacker-computable key. The record's own central negative is
      falsified, the template regains an entry point, and the correct response is immediate
      escalation to independent review before any measurement, not a louder claim.
    - >-
      The measured slack is outside 95-120 bits. The Gaussian embedding model for CBD secrets is
      wrong at n = 256, which is a finding about the secret distribution independent of the
      template.
    - >-
      Stage 1b's ECM contrast against matched random integers exceeds twice the binomial standard
      error in either direction. The large-prime regime is not model-neutral as derived in claim
      (E2); the derivation is wrong or the norms carry structure the cancellation argument misses,
      and H1's premise must be revisited before any smoothness transfer is discussed.
    - >-
      Any valuation is not divisible by its prime's inertia degree, or FIXTURE-A fails. The
      pipeline is wrong; nothing is reportable. (Note that FIXTURE-A PASSING falsifies nothing and
      supports nothing -- that is why it is a fixture.)
    - >-
      NULL-2 (uniform coefficients) differs materially from CBD. The statistic reads the coefficient
      law rather than the norm structure and the framing is misdirected.
    - >-
      The planted-product positive control fails on F, on principality, or on short-generator
      recovery. The measurement cannot detect a splitting that exists by construction and no
      verdict of either sign is reportable.
    - >-
      Median F below 2 at n = 64 with the planted control passing. The NECESSARY condition survives
      at that n and the record's E1 prediction is falsified AT THE LEVEL OF THE WEAKER FAMILY ONLY.
      This is NOT by itself an escalation trigger: it must be carried to Stage 3b, and the
      escalation branch requires a nonzero short-generator recovery rate there.
    - >-
      Stage 3b returns a nonzero short-generator recovery rate on CBD samples with the positive
      control passing. THEN the stronger family survives at the measured n, which is the outcome
      that warrants independent review -- while still not constituting an attack, because the join
      remains missing by claim (B2).
  confounders:
    - >-
      LLL is not an SVP oracle, so F is an upper bound. This biases toward E1 and away from E3,
      which is the safe direction for a negative and the dangerous one for a positive; any E3 signal
      must be re-run with BKZ at a declared blocksize before it leaves the run record.
    - >-
      Stage 3b's short-generator step is a SEARCH, so its negative is budget-scoped and its
      positive is a constructive witness. Reporting a failed search as "no short generator exists"
      is the specific error to avoid, and the planted-product control is what makes the failure
      rate interpretable at all.
    - >-
      Reduced-n rings have genuinely different inertia structure ((Z/2n)^* rather than (Z/512)^*)
      AND different class groups, so neither the split-prime signature nor the principality rate is
      comparable across n without each n's own prediction. Each n is compared against its own.
    - >-
      Trial division to 10^6 finds only small primes; the smoothness statements at n = 256 from
      Stage 1 are therefore about small-prime structure only, and Stage 1b's ECM arm is bounded by
      its declared effort. Nothing about full smoothness at n = 256 is claimed or claimable.
    - >-
      Balanced subset-sum factorisation is a choice among many possible splittings; a different
      balancing criterion could give different F and a different principality rate. Report both
      under at least two balancing criteria so that the verdict is not an artefact of one.
    - >-
      Sampling secrets whose ideal is smooth CONDITIONS on a rare event at larger n, and the
      conditioned population may differ systematically in slack and geometry from the unconditioned
      one. Report both populations' slack distributions so the conditioning bias is visible rather
      than absorbed.
    - >-
      ECM's success probability depends on the size of the factor sought and on the effort spent,
      so an uncalibrated arm produces a contrast that measures the implementation rather than the
      integers. The calibration is a required deliverable, not a footnote.
  interpretation_limits:
    - >-
      No attack, break, speedup or exponent movement is claimed here or would follow from any
      outcome. THE STRONGEST LIMIT IS CLAIM (B2): the template's join has no attacker-computable
      key known to the proposer, so no measurement in this record can be read as a feasibility
      signal for an attack, in either direction, unless and until a key is supplied.
    - >-
      E3 means the NECESSARY condition survives, nothing more. "A multiplicative splitting of the
      ML-KEM secret into enumerable halves exists" does NOT follow from F alone and must never be
      written as if it did; that reading appeared in an earlier draft of this record and is
      withdrawn.
    - >-
      Stages 2, 3 and 3b run at n in {16,32,64}. TOY SCALE NEVER SPEAKS FOR FIPS PARAMETERS: their
      conclusions are scoped to those rings and their u-ranges. The only true-parameter statements
      available are Stage 1's slack, the small-prime fixtures, and Stage 1b's ECM contrast at its
      declared effort.
    - >-
      Stage 1's split-prime arm LICENSES NOTHING about the transfer of Stages 2-3 to n = 256. It is
      governed by equidistribution mod p and agrees in every cell; the quantity that must transfer
      is the large-prime tail, at u-values that differ by roughly an order of magnitude between the
      measured cells and n = 256. H1 carries that transfer as an explicit assumption with both
      u-ranges written out, and it is not discharged by anything in this record.
    - >-
      N(s) is not identifying: 2^17 isometric images and vastly more elements share it. No statement
      of the form "the norm reveals the secret" is licensed by anything here.
    - >-
      An E1 outcome closes a TEMPLATE at measured parameters with a named obstruction; it does not
      close the multiplicative/algebraic family, and it must not be written up as if it did.
      Forward guidance is a required part of the deliverable: what remains open includes an
      attacker-computable key for a multiplicative split (the named sub-problem), many-factor
      (non-balanced) splittings, splittings of the ERROR rather than the secret, and relative norms
      to intermediate subfields.
    - >-
      The exemplar's full text was not re-read this session; the template is taken from the
      program's own summary of it, and any mismatch between that summary and the paper is a defect
      of this record.
    - >-
      The lane's claim-tier ceiling is toy-tier and this record does not raise it.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (NORM-FORM SMOOTHNESS) For s drawn from CBD_eta coefficient-wise over Z[x]/(x^n+1), the
        ideal (s) is B-smooth -- every prime ideal factor has norm at most B -- with probability
        rho(u)^{1+o(1)}, u = ln|N(s)|/ln B, uniformly for u in a stated range, i.e. (s) behaves
        with respect to prime-ideal smoothness like a uniformly random ideal of its norm.
      rigorous_support: >-
        The rigorous ingredient is the AM-GM/Minkowski size bound of claim (C), which pins
        log|N(s)| to at most n log||s||_2 and thereby fixes the u-range in which the question is
        asked -- exactly the role Theorem 1.5 plays in the exemplar. The classical distribution
        statement it is composed with is Canfield-Erdos-Pomerance / Dickman-de Bruijn, transported
        to ideals by Landau's prime ideal theorem, which supplies ~B/log B prime ideals of norm at
        most B in a degree-n field just as there are ~B/log B rational primes. H1 asserts only that
        the SPECIFIC ideal (s), whose generator has bounded coefficients, is typical for its norm --
        which is precisely the shape of the exemplar's Heuristic 1 and is precisely what is not
        obvious, since bounded-coefficient elements are a very thin subset of their norm class.
      validation_plan: >-
        Sample 10^5 secrets per cell at n in {16, 32, 64}, eta in {2, 3}, factor N(s) completely
        (expected sizes ~25, ~67, ~165 bits, so complete factorisation is routine), and build the
        empirical CDF of log(largest prime ideal norm)/log|N(s)|. COMPARISON DISTRIBUTION: Dickman
        rho(u) with u = ln|N(s)|/ln B evaluated per sample, plotted as an empirical CDF against the
        prediction exactly as the exemplar's Figures 1-2 do. TAIL CONSISTENCY CHECK, the exemplar's
        own: take the smoothest sample in each cell of 10^5, read off its smoothness bound B*, and
        compare 1/10^5 against the predicted rho(ln|N(s)|/ln B*). SECOND TAIL CHECK, specific to
        this object: restrict to samples in the lowest decile of slack and report whether their
        smoothness differs, since slack and smoothness are both functions of the same embeddings.
        SAMPLED PARAMETERS AND TRANSFER, DECLARED EXPLICITLY AND WITH THE u-RANGES WRITTEN OUT SIDE
        BY SIDE, WHICH IS THE POINT:
        -- n = 16, log2|N| ~ 25 bits, ln|N| ~ 17.3; n = 32, ~67 bits, ln|N| ~ 46.4; n = 64, ~165
        bits, ln|N| ~ 114.4. With 10^5 samples per cell the measurable smoothness range runs from
        rho(u) ~ 1 down to rho(u) ~ 10^-5, i.e. u from about 1 to about 6.5 (rho(6) = 1.96e-5,
        rho(7) = 8.75e-7). SO THE MEASURED u-RANGE AT n <= 64 IS ROUGHLY [1, 6.5].
        -- n = 256, log2|N| ~ 917.4 bits, ln|N| ~ 635.9. Two very different u-values matter there
        and neither is 6.5. (a) The u-range the template would NEED at n = 256 is again about 6.5,
        which requires ln B >= 635.9/6.5 = 97.8, i.e. a smoothness bound B >= 2^141 -- far outside
        anything this record computes. (b) The u-range Stage 1's B = 10^6 probe actually touches is
        u = 635.9/ln(10^6) = 635.9/13.8 = 46.1, and Stage 1b's ECM arm at B_ecm = 2^35 touches
        u = 635.9/24.3 = 26.2.
        THE TRANSFER FROM [1, 6.5] AT n <= 64 TO THE n = 256 REGIME IS THEREFORE AN ASSUMPTION AND
        IS NOT DISCHARGED BY ANY ARM OF THIS RECORD. The earlier draft claimed Stage 1's
        split-prime signature licensed it; that claim is withdrawn, because that signature is
        governed by equidistribution mod p, agrees in every cell for any adequate-entropy
        coefficient law, and lives at u ~ 46 rather than u ~ 6.5. The one true-parameter arm that
        speaks to the large-prime regime at all is Stage 1b, and it is reported as its own
        contrast against matched random integers, never as a transfer licence.
    - id: H2
      statement: >-
        (EMBEDDING GAUSSIANITY) For s with i.i.d. CBD_eta coefficients over Z[x]/(x^n+1), the
        complex embeddings s(zeta_i) behave, for the purpose of the log-magnitude sum, as
        independent complex Gaussians of variance n*sigma^2, so that E[log2|N(s)|] =
        n*(log2(n sigma^2) - gamma/ln2)/2 and the AM-GM slack concentrates around 106.6 bits at
        n = 256, sigma = 1.
      rigorous_support: >-
        Rigorous ingredient: each embedding is a weighted sum of n bounded independent variables
        with unimodular weights, so a multivariate CLT applies coordinate-wise and the marginal is
        asymptotically complex Gaussian of variance n sigma^2. Classical statement imitated: the
        expectation E[ln|z|^2] = ln(variance) - gamma for a complex Gaussian, which gives the
        constant. WHAT IS HEURISTIC is the INDEPENDENCE across the n embeddings -- they are not
        independent, being determined by only n real coefficients -- and whether the dependence
        moves the mean of the log-sum. It is precisely testable.
      validation_plan: >-
        Measure log2|N(s)| directly at n in {16,32,64,128,256} over 10^4 samples each and compare
        the empirical mean and variance against the Gaussian prediction, reporting the residual as a
        function of n. The n-dependence of the residual is the diagnostic: an O(1) residual means the
        dependence contributes a constant and the model is usable; a residual growing with n means it
        is not. TAIL CHECK: the empirical 1st and 99th percentiles of log2|N(s)| against the
        Gaussian prediction, since the slack's usefulness for a splitting argument depends on the
        LEFT tail (unusually small norm at fixed coefficient norm) and not on the mean. Note that
        this heuristic, unlike H1, IS validated at true parameters, because it needs only exact
        resultants and no factorisation.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, AND NONE CAN BE, because the template has no
      attacker-computable join key (claim (B2)) and therefore no algorithm to cost. For
      completeness, and so the claim cannot later be inflated, the exponent the template WOULD
      target if BOTH a key were supplied AND Stage 3b returned short generators is written down: a
      balanced multiplicative split with an exact ideal-keyed join would cost (table size) +
      (table size), with table size equal to the number of short elements of norm about
      |N(s)|^{1/2}, and the AM-GM floor puts that count at the number of lattice points of norm
      about |N(s)|^{1/(2n)} * sqrt(n) in a 256-dimensional box -- a quantity Stage 3 measures a
      proxy for and which is predicted to be astronomically larger than the primal attack's
      2^{0.292 beta}. That is a conditional-on-two-missing-components sketch and not a claim.
    memory_exponent: >-
      No attack memory exponent is claimed. If the template ever applied, memory would equal table
      size, i.e. equal to time -- the same claw-finding structure the exemplar reports.
      Measurement memory: 10^4 integers of 917 bits plus their factorisations, plus class-group
      data at n <= 64; trivial.
    best_known: >-
      For ML-KEM-768 the incumbent attack is the direct primal/dual lattice attack at the published
      core-SVP blocksize, and nothing here approaches it. For the QUANTITIES introduced -- the AM-GM
      slack of a lattice secret, the half-ideal minimum ratio F, and the principality plus
      short-generator rates of balanced halves -- there is no incumbent in this repository and none
      surfaced by the single web query run.
    hidden_overhead: >-
      Four disclosures. (1) THE JOIN HAS NO ATTACKER-COMPUTABLE KEY, which is not an overhead but a
      missing component, and it dominates everything else in this list. (2) F is measured with LLL
      and is an upper bound, so an E1 verdict is conservative and an E3 verdict is fragile; and
      Stage 3b's generator search is budget-scoped in the same direction. (3) Stages 2-3 run at
      n <= 64 in a u-range of roughly [1, 6.5], while the template at n = 256 would need the same
      u-range at a smoothness bound of about 2^141; the transfer is an assumption and Stage 1
      probes u ~ 46 instead, which is not the same regime. (4) Even granting everything, the table
      would have to be indexed by ideals, and computing the ideal factorisation of a candidate is
      itself a factorisation problem whose cost is nowhere charged in this record.
    tradeoff_note: >-
      The template is a pure claw/meet-in-the-middle structure, so its time and memory would be
      equal by construction and a van Oorschot-Wiener interpolation would apply if it ever existed,
      giving time sqrt(T^3/w) at memory w. That is stated for completeness and is not a claim; no
      such algorithm is proposed here, and the missing join means none can be assembled from this
      record's components.
  dominated_by: >-
    On the ATTACK axis: 'n/a (no result claimed)' -- no attack is proposed, no cost triple exists,
    no frontier row applies, and null would be a fabrication under AGENTS.md rule 5. On the
    ALGEBRAIC-AUDIT axis, IDEA-20260805-e805b6 dominates on cost and decisiveness within this lane:
    it settles an entire external pipeline with a one-line forced value and no compute at all.
    AFTER THE REPAIR PASS THE COMPARISON IS SHARPER AND LESS FLATTERING: this record's own Stage-0
    join audit is also a zero-compute algebraic settlement, and it settles the template's join
    negatively -- so the honest reading is that e805b6 dominates on the same axis this record now
    plays on, having got there first and for a different pipeline. On the RIGOUR axis,
    IDEA-20260805-574cd0 dominates: it proves its result symbolically where this one measures. On
    the HEURISTIC-VALIDATION axis the honest comparator is the exemplar's own section 4.2, which
    validated its heuristic at SQIsign-sized parameters with 100,000 samples using the Deuring
    correspondence as a sampling shortcut; this proposal has no analogous shortcut for full
    factorisation at n = 256 and is therefore strictly weaker on scale for its smoothness arm --
    quantified now as a measured u-range of [1, 6.5] at n <= 64 against a needed u ~ 6.5 at
    B ~ 2^141 for n = 256.
  sota_delta: >-
    No attack; component-audit and measurement contribution only. Quantitatively: this repository
    contains no value for the AM-GM slack of any lattice secret, no smoothness measurement for any
    ML-KEM object, no half-ideal minimum ratio, and no principality or short-generator rate for
    ideal halves of ML-KEM-shaped secrets, so the delta is the creation of first numbers rather
    than an improvement on existing ones. The delta the repair pass ADDS, and which costs no
    compute, is the written join audit: a statement of exactly which slot of this program's own
    canonical exemplar has no ML-KEM analogue, with the candidate keys enumerated and disposed of,
    and the named open sub-problem handed forward. The delta the repair pass REMOVES is the earlier
    draft's claim that a split-prime valuation signature at true parameters is a discriminator and
    a transfer licence; it is neither. Against the published attack frontier the delta on cost is
    exactly zero and is expected to remain so.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: low
  honest_prior_of_survival: >-
    By part. (i) That the AM-GM bound and the inertia-degree constraint hold as stated: ~0.97,
    textbook. (ii) That the Stage-0 join audit finds NO attacker-computable key, i.e. that the
    record's central negative stands: ~0.9. The candidates the proposer could construct all fail
    for reasons stated in claim (B2), and the residual 0.1 is the honest allowance that a sharper
    algebraist finds something the proposer did not. (iii) That the measured slack lands within
    95-120 bits: ~0.75; the embedding dependence could shift it. (iv) That Stage 1b's large-prime
    ECM contrast is consistent with zero: ~0.7 -- the cancellation argument of claim (E2) is
    elementary but the ECM effort's calibration is the fragile part. (v) That ideal smoothness
    follows Dickman within KS distance 0.05 at n <= 64: ~0.7. (vi) That median F exceeds 4 at
    n = 64 and grows with n, i.e. E1 at the level of the weaker family: ~0.8. (vii) That the
    stronger family survives -- a nonzero short-generator rate at Stage 3b with the positive
    control passing: ~0.02, strictly below the earlier draft's 0.05 for E3, because the earlier
    number was attached to F alone and F alone is now known to be only necessary. (viii) That the
    run produces defensible numbers and a defensible component verdict either way: ~0.85.
    PRIORITY RE-DERIVATION, AS THE REPAIR REQUIRES. The earlier draft rated this MEDIUM on the
    strength of a 5% chance at "an entry point to this program's own canonical exemplar". That
    justification does not survive the join audit: with no attacker-computable key, no outcome of
    Stages 1-3 is an entry point, and the probability that matters drops from 0.05 on E3 to 0.02
    on Stage 3b CONDITIONAL on a key that is itself only ~0.1 likely to be found. The product is
    small enough that the compute-bearing stages cannot be justified by the attack-relevance
    argument at all. What remains worth doing is the ZERO-COMPUTE part -- the join audit and its
    named open sub-problem, which is genuinely valuable to the lane and to any future record that
    reaches for this exemplar -- plus, at low priority, the true-parameter slack measurement, which
    is cheap and is a first number for the repository. LOW is therefore the honest rating for the
    record as a whole, with the explicit note that its Stage-0 obligation is worth running
    immediately and on its own, because it costs nothing and it is what tells every later proposer
    not to repeat the mistake this record made.
