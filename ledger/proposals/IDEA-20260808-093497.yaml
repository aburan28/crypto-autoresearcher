idea:
  id: IDEA-20260808-093497
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  title: The prime-field decomposition system has an exact semi-regular null that nobody has
    written down - d_reg = ceil((m(B-1) + D_S)/2) - so the algebraic route is worse than plain
    enumeration by B^{m(omega-1)+1} unless the real system collapses below that null by a
    factor B^{1-1/(2omega)}
  class: mechanism
  claim: '(A) THE OBJECT. Fix E/F_p, a target R with x-coordinate x_R, an arity m >= 2, and
    a factor base V subset F_p of size B with vanishing polynomial f_V(x) = prod_{v in V}(x
    - v), deg f_V = B. The decomposition ideal is I_R = < S_{m+1}(x_1,...,x_m,x_R), f_V(x_1),
    ..., f_V(x_m) > in F_p[x_1,...,x_m] - m variables, m+1 generators, degrees (D_S, B, B,
    ..., B) where D_S = totaldeg_{x_1..x_m} S_{m+1}( . , x_R). (B) THE CLAIM, DERIVED NOT
    ASSUMED. If the generating sequence is semi-regular in the Bardet-Faugere-Salvy sense,
    the Hilbert series of the quotient of the top-degree forms is H(z) = [ (1 + z + ... +
    z^{B-1})^m * (1 - z^{D_S}) ]_+ because prod_{i=1}^m (1 - z^B)/(1-z)^m = (1 + ... + z^{B-1})^m
    exactly. The coefficient of z^d is a_d - a_{d-D_S}, where a is the m-fold convolution
    of the uniform box on {0,...,B-1}: symmetric about M/2 = m(B-1)/2 and unimodal. Hence
    the first non-positive coefficient sits at d_reg = ceil( (m(B-1) + D_S)/2 ). VERIFIED
    BY HAND ON TWO CELLS: m=1,B=3,D_S=2 gives (1+z+z^2)(1-z^2) = 1 + z + 0*z^2 - ..., first
    non-positive at d = 2 = ceil((2+2)/2); m=2,B=3,D_S=4 gives (1+2z+3z^2+2z^3+z^4)(1-z^4),
    first non-positive at d = 4 = ceil((4+4)/2). (C) THE CONSEQUENCE. d_reg is LINEAR IN B
    with slope m/2. The Macaulay matrix at that degree has C(d_reg + m, m) ~ (mB/2)^m / m!
    columns, so a degree-graded solve costs ((mB/2)^m/m!)^omega field operations - versus
    B^{m-1} * 2^{m-1} for the trivial enumerative oracle (fix m-1 coordinates in V, root-find
    S_{m+1} in the last variable, hash-test membership; all 2^{m-1} roots lie in F_p by KN-FIND-a8990a
    Theorem C). The ratio is Theta( B^{m(omega-1)+1} ), growing without bound in B at every
    m and every omega > 1. (D) THE FALSIFIABLE PART. The claim this record makes about the
    WORLD, as opposed to about the null, is: for generic ordinary E/F_p and a uniformly random
    V of size B, the measured solving degree d_solve of I_R satisfies d_solve = (m/2) * B
    * (1 + o(1)) as B grows at fixed m - i.e. the Semaev structure does NOT produce an asymptotic
    collapse. The competing hypothesis, which the entire prime-field index-calculus programme
    implicitly assumes, is d_solve = O(B^{gamma}) for some gamma < 1. The threshold that separates
    "the algebraic oracle can matter" from "it cannot" is d_solve <= (m!)^{1/m} * B^{(m-1)/(2
    omega m)} (see E2-02 for where the exponent (m-1)/2 comes from), i.e. gamma <= (m-1)/(2
    omega m) < 1/(2 omega). At omega = 2 that is gamma < 1/4 for every m. SO THE MEASUREMENT
    HAS THREE DISTINGUISHABLE OUTCOMES, NOT TWO - slope m/2 (null holds, lane closed at this
    interface), gamma in [1/4, 1) (genuine non-generic collapse that is still not enough),
    and gamma < 1/4 (the first positive prime-field signal this programme would ever have
    had).'
  mechanism: 'The programme''s entire degree-of-regularity apparatus is calibrated against
    a BOOLEAN semi-regular null (GOAL-DREG-001 uses the T11-support-matched semi-regular series
    for a Weil-descended GF(2) system), while RQ-SDEG-001 and GOAL-ICEX-001 ask about PRIME-FIELD
    decomposition. There is no prime-field null in the corpus, so no prime-field deficit can
    be defined, so no prime-field solving degree can be interpreted. The mechanism of this
    record is arithmetic: the m membership generators f_V(x_i) are univariate of degree B,
    so their top-degree forms x_i^B are a regular sequence, the quotient is a complete intersection
    of dimension B^m with Hilbert series exactly the m-fold box convolution, and the single
    Semaev generator perturbs it by one shifted subtraction. Everything is closed form; there
    is no free parameter and no fitted constant. Why the null is the right null and not a
    strawman: the alternative "generic overdetermined system" null would use m+1 generic forms
    of degrees (B,...,B,D_S), which is exactly what is computed. The Semaev polynomial''s
    specificity enters only through D_S and through whether the sequence is semi-regular -
    and D_S is a CONSTANT IN B, so it cannot change the slope. Therefore any collapse must
    come from failure of semi-regularity, which is precisely the syzygy content GOAL-SIG-001
    and GOAL-DREG-001 have been measuring in the wrong field.'
  why_not_a_renamed_known_approach: 'Nearest known method: the Bardet-Faugere-Salvy semi-regular
    Hilbert-series prediction, which is classical and is used throughout this corpus. The
    difference is threefold. (i) Every use of it in this corpus instantiates the BOOLEAN case
    (field equations x^2 = x, degree 2) where the box has length 2 and the slope in "B" is
    invisible; instantiating it with membership degree B is what exposes the linear-in-B slope
    and it has never been done here. (ii) The standard textbook instantiation is n variables
    and m generic quadratics; here the generators are radically inhomogeneous in degree (B
    versus D_S) and the closed form ceil((m(B-1)+D_S)/2) is a consequence of unimodality of
    a box convolution, not of the usual asymptotic BFS formula. (iii) The conclusion drawn
    - that the algebraic oracle loses to enumeration by B^{m(omega-1)+1} under the null -
    is a COMPARISON the corpus has never made because it has never had the prime-field null
    to make it with.'
  predictions:
  - observable: Semi-regular degree of regularity of I_R, computed symbolically from the Hilbert
      series with exact integer arithmetic, for m in {2,3,4}, B in {4,...,64}
    metric: d_reg_pred(m,B)
    predicted: Exactly ceil((m(B-1) + D_S)/2) at every cell, with D_S read off the actual
      S_{m+1} (D_S = 4 at m = 2; D_S computed symbolically at m = 3,4 and NOT assumed). Any
      implementation returning a value that is not linear in B with slope exactly m/2 has
      a bug, and that is a zero-compute self-check.
  - observable: Measured solving degree d_solve of I_R by exact graded row reduction over
      F_p, generic ordinary E, uniformly random V, >= 5 seeds per cell
    metric: slope of d_solve against B on the toy ladder B in {4,6,8,12,16}, m in {2,3}, p
      in {1009, 4099, 16411}
    predicted: THREE MUTUALLY EXCLUSIVE OUTCOMES, EACH WITH A DIFFERENT MEANING. (1) slope
      indistinguishable from m/2 within seed noise -> the Semaev system is semi-regular at
      prime-field membership degree, the algebraic decomposition oracle is dominated by enumeration
      for all B, and RQ-SDEG-001's cost model is written. (2) slope in (0, m/2) but d_solve/B^{1/4}
      increasing -> a genuine non-generic collapse exists and is quantified, but does not
      reach the E2-02 threshold; report the collapse exponent gamma with a CI. (3) d_solve
      = O(B^{1/4}) or smaller -> the threshold is reached at toy scale and the lane inverts.
  - observable: Ratio (Macaulay column count at d_solve) / (enumerative oracle cost B^{m-1}
      2^{m-1}), same cells
    metric: log-log slope in B
    predicted: Under outcome (1) the slope is m(omega-1)+1 > 0 and the ratio diverges; this
      is the number that converts the null into the verdict, and it is reported with omega
      = 2 and omega = 2.807 in separate columns, never as one number.
  minimal_test: 'STAGE 0, ZERO COMPUTE, HALF A DAY. Emit d_reg_pred(m,B) from exact integer
    convolution for m in {2,3,4} and B in {4..64}; emit D_S for m = 2,3,4 by symbolic total-degree
    computation on S_3, S_4, S_5; emit the column-count and cost-ratio tables at omega in
    {2, 2.807}. Every entry is an exact rational and is checkable by hand at the two verification
    cells given in the claim. STAGE 1, LOW COMPUTE. On p in {1009, 4099, 16411}, generic ordinary
    E, random V with B in {4,6,8,12,16}, m in {2,3}, >= 5 seeds: build the Macaulay matrix
    of I_R degree by degree over F_p, take exact ranks, and record d_solve = min{D : corank(Mac_D)
    = #solutions}, with #solutions obtained INDEPENDENTLY by exhaustive enumeration over V^m
    (feasible: B^m <= 4096 at these cells). Report measured d_solve against d_reg_pred. STAGE
    2, OPTIONAL. Extend m = 4 at B <= 8 only if stage 1 leaves the slope ambiguous.'
  controls:
  - 'MATCHED RANDOM-SYSTEM NULL (can fail, and is the primary control). Replace S_{m+1} by
    a uniformly random polynomial with the SAME multidegree support as S_{m+1}, keep f_V unchanged,
    and re-measure. FORCED VALUE under the null hypothesis: identical d_solve within seed
    noise. A difference is the Semaev-specific content and is the only admissible evidence
    of collapse.'
  - MEMBERSHIP-DEGREE LADDER AS A DECAY CONTROL. Hold m fixed and increase B. Any claimed
    collapse must PERSIST or GROW in B; a "collapse" that is constant in absolute degree units
    is the canonical artifact tell of inventor-protocol section 3 and must be reported as
    such.
  - KNOWN-ANSWER EDGE. At m = 1 the system is {S_2(x_1,x_R), f_V(x_1)} and d_solve is computable
    by gcd; the instrument must return the gcd degree. An instrument that does not reproduce
    the univariate answer may not be used on m >= 2.
  - SOLVER-INDEPENDENCE CHECK. d_solve is defined by exact graded rank, not by a CAS termination
    event, precisely because IDEA-20260807-899c5e records that the harness solver is not an
    optimised F4 and does not expose its degrees.
  confounders:
  - SEMI-REGULARITY IS AN ASSUMPTION ABOUT THE NULL, NOT A THEOREM. The BFS series is conjectural
    even for generic systems. The record uses it only as a declared null and never as an upper
    bound on anything real.
  - SMALL-B ARTIFACTS. At B <= 8 the box convolution is short and the asymptotic slope is
    not yet visible; the ladder must reach B where d_reg_pred differs from D_S, otherwise
    the Semaev degree dominates and the slope is unmeasurable.
  - 'FIELD-SIZE COUPLING. #solutions ~ B^m/p, so at fixed p increasing B changes the solution
    count and hence the corank threshold. The instrument must hold B^m/p roughly constant
    across cells or report the solution count as a covariate.'
  - 'x-COORDINATE SIGN AMBIGUITY. V is a set of x-coordinates, so each element lifts to +-P
    and a solution of I_R is a decomposition only up to signs. #solutions counted in the ideal
    includes all sign variants (2^{m-1} of them by KN-FIND-a8990a); the corank threshold must
    use the ideal-theoretic count, not the group-theoretic one. See E2-12.'
  falsification_conditions:
  - Measured d_solve grows sublinearly in B with a fitted exponent gamma < 1 whose CI excludes
    1, at m = 3, across >= 3 primes. The record's world-claim (slope m/2) is false and the
    lane is open at a quantified exponent.
  - The matched random-support null shows the SAME sublinear growth. Then the collapse is
    not Semaev-specific, the record's mechanism is wrong, and the finding is about overdetermined
    systems with high-degree univariate generators in general.
  - The hand-verified Hilbert cells disagree with the implementation. Instrument failure;
    nothing is read from any other arm.
  - D_S turns out to grow with B for some model of the factor base (it cannot for a fixed
    curve and fixed m, but if the implementation says otherwise the closed form is wrong and
    must be restated).
  interpretation_limits: 'TOY TIER ONLY. Stage 1 reaches B <= 16 and p <= 16411; that is not
    crypto-scale validation of anything and must never be quoted as such. The record makes
    NO claim that prime-field ECDLP is hard or easy: it computes a null and specifies what
    departure from it would matter. Outcome (1) closes exactly one interface - degree-graded
    solving of the ideal I_R with a set-theoretic factor base described by its vanishing polynomial
    - and says nothing about implicit-membership solvers, target-dependent descriptions, non-Macaulay
    solvers, or factor bases with sub-linear description degree, all of which remain open
    (KN-OPEN-020). It is also silent about extension fields, where the membership degree is
    2 after Weil descent and the whole argument evaporates - which is exactly the contrast
    E2-08 makes explicit.'
  assumptions:
  - The curve is non-singular ordinary over a prime field of characteristic > 3.
  - S_{m+1} is the standard Semaev summation polynomial with deg_{x_i} = 2^{m-1}.
  - omega is declared before measurement and reported at two values.
  - V is squarefree (f_V has distinct roots), so 0 is not a repeated root.
  heuristic_assumptions:
  - id: HA-1
    statement: For generic ordinary E/F_p and uniformly random V of size B, the sequence (S_{m+1}(.,x_R),
      f_V(x_1), ..., f_V(x_m)) is semi-regular in the Bardet-Faugere-Salvy sense, so the Hilbert
      series of the quotient by the top-degree forms is the positive truncation of (1+...+z^{B-1})^m
      (1-z^{D_S}), uniformly for 2 <= m <= 5 and B in [4, p^{1/m}].
    rigorous_ingredient: 'RIGOROUS: prod_{i=1}^m (1-z^B)/(1-z)^m is the exact Hilbert series
      of F_p[x]/(x_1^B,...,x_m^B), because (x_1^B,...,x_m^B) is a regular sequence - a complete
      intersection, no assumption. Only the effect of the single extra generator is heuristic.'
    distribution_imitated: The Froberg / Bardet-Faugere-Salvy semi-regularity conjecture,
      which asserts that a generic overdetermined sequence behaves like the maximally-rank-generic
      one degree by degree. The exact analogue used in the boolean lane of this programme.
    validation_route: 'Sample the FULL series, not just d_reg, on the toy ladder: for each
      cell record the measured graded rank at every degree D <= d_solve and compare to the
      predicted coefficient a_D - a_{D-D_S}. TOY SCALE ONLY (B <= 16, p <= 16411). There is
      no known shortcut that reaches crypto-scale B for this quantity, and no crypto-scale
      claim may be made from it. Report the per-degree residual series, not a single summary
      number.'
    tail_checks: The most informative cells are the last two degrees before d_solve, where
      the predicted coefficient approaches zero and the relative sensitivity is highest; report
      the smallest predicted positive coefficient across the ladder and the measured value
      beside it.
  - id: HA-2
    statement: The enumerative decomposition oracle costs B^{m-1} * 2^{m-1} * (O(1) field
      operations), because for any (m-1)-tuple of factor-base x-coordinates the polynomial
      S_{m+1}(v_1,...,v_{m-1},T,x_R) splits completely over F_p into 2^{m-1} linear factors
      whose roots are the x-coordinates of the signed sums.
    rigorous_ingredient: 'KN-FIND-a8990a Theorem C (in-corpus derivation, toy-verified on
      16107 good samples): on the factor-base locus the summation fibre splits completely
      at every m, root set exactly {x(eps_1 P_1 + ... )}.'
    distribution_imitated: None needed - this is a structural statement, not a distributional
      one. It is listed as an assumption only because the cost model uses O(1) per root for
      the membership test, which assumes a hash table with O(1) expected lookup.
    validation_route: 'Direct: on the toy ladder, count the roots found in F_p per (m-1)-tuple
      and check it equals 2^{m-1} on the good locus, and record the measured fraction of degenerate
      tuples (degree drops) as the correction term. Toy scale.'
    tail_checks: Record the maximum observed number of degenerate tuples per cell; the model
      predicts O_m(B^{m-2}) of them, and a larger count would inflate the enumerative baseline
      and shift the comparison in the algebraic oracle's favour.
  target_complexity:
    time_exponent: THIS RECORD PROPOSES NO ALGORITHM AND MOVES NO ATTACK EXPONENT. It fixes
      the null value of one input to the ICEX cost model. Under the null, the algebraic decomposition
      oracle has cost exponent theta_alg = m*omega in B (cost ~ B^{m omega}), against theta_enum
      = m-1 for enumeration and theta_MITM = ceil(m/2) for meet-in-the-middle (E2-02). Against
      the rho-beating requirement theta < (m-1)/2 derived in E2-02, the null puts the algebraic
      oracle a factor of about 4 too high in the exponent at omega = 2 (2m versus m/2).
    memory_exponent: Under the null the Macaulay matrix at d_reg has ~ (mB/2)^m/m! columns,
      so dense memory is B^{2m} and sparse memory is the nonzero count; NO record in the SDEG/DREG/SIG
      lane charges Macaulay memory at all, which this record flags as a standing gap rather
      than repairs.
    best_known_baseline: Pollard rho at 0.886 sqrt(N) group operations and O(1) memory; BSGS
      at (N^{1/2}, N^{1/2}); for the decomposition subproblem specifically, the target-keyed
      meet-in-the-middle at time B^{ceil(m/2)} and memory B^{floor(m/2)}.
    hidden_overhead_disclosure: The row-reduction constant is not 1 and is not measured anywhere
      in this corpus; omega = 2 is not achievable for these matrices; d_solve for a real F5
      with degree falls can sit below the graded threshold (the confounder IDEA-20260806-7ea402
      names); and D_S at m >= 4 was not computed in this session and is a symbolic-computation
      obligation of stage 0, not a recalled number.
    time_memory_tradeoff: Not applicable to the null itself. It becomes applicable the moment
      the null is used inside ICEX, where the algebraic oracle's memory must be charged against
      the MITM oracle's memory B^{floor(m/2)}; E2-02 carries that comparison.
  sota_delta: 'ZERO on every attack axis. Quantitatively the deliverable is: a closed form
    d_reg = ceil((m(B-1)+D_S)/2) that this corpus does not contain for prime fields; the derived
    cost ratio B^{m(omega-1)+1} of the algebraic oracle over enumeration under that null (at
    m = 3, omega = 2 that is B^4, so at B = 2^10 the algebraic route is 2^40 times more expensive
    than enumeration); and a three-way outcome map for the toy measurement with the threshold
    gamma < (m-1)/(2 omega m) pre-registered.'
  dominated_by: 'n/a (no algorithmic result claimed). The frontier was checked row by row
    because this record feeds a cost threshold. TIME: rho 0.886 sqrt(N); BSGS N^{1/2}; MITM
    decomposition IC at N^{m/(2(m-1))} (derived in E2-02, never below N^{1/2}); Gaudry-Diem
    q^{2-2/n} over F_{q^n} (not applicable to prime fields). MEMORY: rho O(1); BSGS N^{1/2};
    MITM IC N^{floor(m/2)/(m-1)}. DATA/QUERIES: all query-free. PREPROCESSING: S T^2 = Omega~(N)
    (KN-TECH-005). MULTI-TARGET: sqrt(T N). This record occupies no point on any of these
    axes - it computes a null for an input, and a null is not a Pareto point. No row was left
    unchecked.'
  estimated_cost: Implementation low (exact integer convolution plus a graded GF(p) rank routine
