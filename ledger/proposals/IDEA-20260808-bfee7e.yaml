idea:
  id: IDEA-20260808-bfee7e
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  title: A CLOSED-FORM null for the campaign's own r=5 yoyo excess, derived from ShiftRows/MixColumns
    coset geometry with zero cipher evaluations and pre-registered before the comparison -
    settling in one derivation whether 59-against-4.0 is a real cipher property or the wrong
    null.
  class: control
  claim: GOAL-AES-003 records an r=5 yoyo hit count of 59 for AES against a null expectation
    of 4.0 (BATCH-002 A1, 15.63x), reproduced at 58 and 51 by two uniform random bijective
    S-boxes (EV-AES-048545, N=2^32), absent under ideal-permutation substitution (EV-AES-e4c091,
    14 vs 1 matched, 18.67x at 8x exposure) and absent under a 16-round Feistel PRP with no
    GF(2^8) arithmetic (EV-AES-dec938). CLAIM - 4.0 is the expectation under an IDEAL PERMUTATION
    and is the wrong null for a wide-trail SPN, because the probe's per-trial events are not
    independent once ShiftRows maps the swapped diagonal onto one column and MixColumns acts
    on it as an MDS map with branch number 5. The correct null E_geom is computable in closed
    form from the coset lattice. EXCLUSIVE DICHOTOMY, PRE-REGISTERED - either E_geom lands
    within a factor 2 of 59, in which case the excess is a geometric artifact of the probe
    on ANY MDS-layer SPN and the claimed distinguisher is withdrawn; or E_geom stays within
    a factor 2 of 4.0, in which case the excess is a genuine two-round-superbox property and
    the r=6 push under BT-3 is justified.
  mechanism: 'The yoyo probe swaps coordinates between two plaintexts and counts re-collisions
    after r rounds. Its Poisson(N p) null is valid only if the candidate events are independent.
    For an SPN they are not: the swap runs along a diagonal, ShiftRows sends that diagonal
    to a column, and the two-round superbox constrains the four byte-events jointly through
    the MDS branch number rather than as four coin flips. Whether the correlation is mean-zero
    is exactly the question, and coset counting answers it: the intersection pattern of MixColumns-image
    cosets with the swap orbit is a lattice invariant. The committed evidence already localises
    the cause - the excess survives random S-boxes (so not S-box values) and dies under an
    ideal permutation and under a field-arithmetic-free Feistel (so it IS the wide-trail geometry).'
  why_not_a_renamed_known_approach: Nearest known method - the yoyo/exchange/mixture family
    itself (recalled_unverified), which DERIVES distinguishers; this derives the NULL, which
    is what the campaign lacks. Nearest internal record - catalogue A1-9 / H-AES-5c1c01 /
    IDEA-20260807-4ee607, which explain a two-round coincidence rate by the S-box's slope-generic
    fibre histogram. That mechanism predicts an S-BOX-DEPENDENT rate and is INCONSISTENT with
    EV-AES-048545 (58 and 51 versus AES's 59). My object is the S-box-free coset lattice -
    the only shape consistent with the measured S-box-independence. I am proposing this BECAUSE
    A1-9's mechanism contradicts committed evidence, and I say so rather than varying it.
    LOSSY-PROJECTION TEST - projection is (pair of states) -> coset of the pair difference
    modulo the MixColumns image subspace; it discards the position inside the coset. AddRoundKey
    acts trivially on differences, ShiftRows permutes labels, MixColumns acts linearly on
    them; SubBytes does not, which fixes the survival horizon at the two-round superbox. Genuinely
    lossy. PASSES, with the horizon stated up front.
  predictions:
  - observable: E_geom at the campaign's exact configuration (N=2^32, amask=1, smask=1), pre-registered
      in a committed file before any data is read
    metric: expected hits
    predicted: a specific number stated in advance; the record's value is that it is stated
      before the comparison
  - observable: E_geom versus the AES measurement 59
    metric: ratio
    predicted: EITHER inside [0.5, 2] (geometric artifact) OR outside it while 4.0/59 also
      stays outside - an exclusive dichotomy, not a hope
  - observable: E_geom for the ideal-permutation arm
    metric: expected hits
    predicted: exactly 4.0, recovering the campaign's existing null as a special case
  - observable: E_geom for the BATCH-014 Feistel PRP arm
    metric: expected hits
    predicted: near 4.0 (no MDS column structure), consistent with the committed OUTCOME-A
      prime reading
  - observable: decay in r
    metric: E_geom at r = 3, 4, 5, 6
    predicted: strictly decreasing toward 4.0; a non-decaying E_geom is the artifact tell
      and voids the derivation
  minimal_test: Zero cryptanalytic compute for the primary claim. (1) Pin the probe from the
    committed rc8probe.c / yoyo_sbox_v4 sources - not from memory and not from the goal record's
    prose. (2) Derive E_geom by coset counting and COMMIT the derivation and the number before
    reading any measurement. (3) Compare against the four arms already committed. (4) Verify
    the closed form by exhaustive enumeration on the GF(2^4) analogue, where the trial space
    is enumerable. (5) Only if the dichotomy resolves toward "genuine", schedule the r=6 push.
  controls:
  - Baseline embedding - the derivation must return exactly 4.0 for an ideal permutation.
  - Round-count decay across r = 3..6.
  - Toy exhaustive verification on GF(2^4) before any real-AES claim.
  - Pre-registration as a COMMIT, not a file mtime - defect V-804-2 is exactly this failure
    already on the record.
  - SIBLING NULL per V-804-1 and KN-FIND-029 rule 6 - derive E_geom for an SPN with a non-MDS
    invertible mixing layer; if it also gives about 59, the derivation does not isolate the
    MDS property even if it fits.
  confounders:
  - Probe definition drift - the goal record's prose is a summary; binding to it rather than
    to source would derive a null for a different probe. Largest single risk.
  - Trial reuse and thread-seed overlap - the campaign has already withdrawn a pooled statistic
    for double-counting overlapping trials (BATCH-009); E_geom must be an expectation for
    the exact generation procedure.
  - A derivation that fits 59 may fit for the wrong reason; the sibling null is the discriminator.
  falsification_conditions:
  - The derivation does not return 4.0 for an ideal permutation - wrong, stop.
  - Toy GF(2^4) enumeration disagrees with the closed form - wrong, stop.
  - E_geom fits 59 AND the non-MDS sibling null also gives about 59 - the fit must not be
    reported as an explanation (the V-804-1 failure mode).
  - E_geom stays near 4.0 - the excess is unexplained by geometry; positive for the campaign,
    negative for this idea.
  interpretation_limits: Toy tier, reduced-round. A geometric null that explains the excess
    REMOVES a claimed distinguisher and says nothing about AES's security. A geometric null
    that fails does NOT establish a distinguisher - it excludes one alternative, exactly as
    BATCH-009 recorded about its own null object.
  assumptions:
  - Committed probe sources are readable and are ground truth for the trial procedure.
  - The four measured arms are cited as INPUTS carrying their own scope, not upgraded - including
    the goal record's own disclosure that BATCH-713991's ledger archive never landed and its
    RANK 1 item is self-declared completion UNSUPPORTED.
  heuristic_assumptions:
  - id: HA-1
    statement: FOR ALL keys and FOR ALL trials of the pinned probe, the hit indicator depends
      on the state only through the coset label of the pair difference modulo the MixColumns
      image, up to relative error at most 2^{-8} per superbox.
    rigorous_ingredient: MixColumns is MDS with branch number 5 (FIPS-197-verifiable in the
      pinned harness), so any difference with fewer than 5 active bytes across input and output
      is impossible - this rigorously bounds which coset labels occur.
    distribution_imitated: The uniform-DDT-row heuristic - for a random bijective S-box the
      solution count of S(x)+S(x+a)=b follows a classical occupancy law; the campaign's own
      two random-bijection arms (58, 51 vs 59) support this shape.
    validation_route: TOY, LABELLED. On GF(2^4) with a 4x4 MDS layer, enumerate the FULL trial
      space and compare the empirical count to the closed form exactly. At real-AES scale,
      reuse the already-committed 27-arm random-S-box reference distribution (mean 15.481481481481481,
      range 6-25, independently reconstructed by the BATCH-013 validator) as a second comparison
      population at zero new compute.
    tail_checks: Compare the closed form against the EXTREMES 6 and 25 of that reference distribution,
      not just its mean - matching the mean while unable to reach the range means the variance
      is wrong.
  target_complexity:
    time_exponent: No attack, no exponent. Cost relevance is SUBTRACTIVE - the campaign has
      spent BATCH-009 through BATCH-014 on controls around this one number, so a derivation
      that settles it saves more producer slots than it costs.
    memory_exponent: negligible.
    best_known_baseline: The campaign's own Poisson(4.0) null, which this record asserts must
      be re-derived rather than re-measured.
    hidden_overhead_disclosure: The derivation is exact only at the two-round superbox horizon;
      composing superboxes to r=5 is where an unstated independence assumption can re-enter,
      and that step must be its own lemma with its own assumption or it silently inherits
      the defect it is fixing.
    time_memory_tradeoff: not applicable.
  sota_delta: No attack delta. The campaign's central open number acquires a PREDICTED value
    instead of an assumed one. Under "controls before belief", a Poisson(4.0) null for a correlated-event
    probe is not a null of the same shape.
  dominated_by: Nothing dominates a null derivation - it is not on the attack frontier. For
    the QUESTION "is the r=5 excess real", the nearest competing action is the queued identity/affine-S-box
    arm named in BATCH-713991, which is cheaper and WEAKER in discrimination (it re-tests
    S-box specificity, already addressed by two arms, rather than the geometric null). Checked
    that arm, the ideal-permutation arm, the Feistel arm, RC-C and RC-D.
  estimated_cost: Implementation LOW (coset counting plus a GF(2^4) enumeration); compute
    NEGLIGIBLE - all four comparison arms are already measured; one producer slot including
    pre-registration.
  recommended_priority: high
  honest_prior_of_survival: Derivation returning 4.0 for an ideal permutation 0.8; E_geom
    within a factor 2 of 59 0.45 (S-box-independence and the Feistel result point at geometry,
    but 15x is large for pure coset counting); the non-MDS sibling null cleanly separating
    0.4 - the honest weak point. Decision either way 0.85.
  novelty_status: unverified
  novelty_class: speculative
  novelty_screen: CATALOGUE_TITLES.txt A1-8, A1-9; EXISTING_HYPOTHESES.txt H-AES-5c1c01 (the
    A1-9 hypothesis this record is designed to displace); EXISTING_PROPOSALS.txt IDEA-20260807-4ee607
    (formalises A1-9), IDEA-20260805-c8c0d4 (REF-C instrument resolution, different axis);
    KNOWLEDGE_BARRIERS.txt KN-FIND-031 (an empirical survival function's lowest nonzero value
    is 1/N - directly relevant to reading the count of 1 in the ideal-permutation arm, and
    honoured here). EXTERNAL LITERATURE NOT SCREENED.
  discriminated_from: H-AES-5c1c01 / IDEA-20260807-4ee607 predict an S-box-DEPENDENT rate;
    the campaign measured S-box INDEPENDENCE. My object is the S-box-free coset lattice. An
    evidence-driven displacement, not a variation.
