  proof_search_map:
    bottleneck: The null - six batches have narrowed what the excess is NOT without ever computing
      what it SHOULD be.
    baseline_embedding:
      parameter_slice: ideal permutation.
      reproduction_check: the derivation must return exactly 4.0; symbolic, frozen before
        comparison.
    observation_collision:
      observable: the expected hit count.
      distinct_preimage_search: A non-MDS invertible mixing layer producing the same E_geom
        - mandatory, and the exact V-804-1 failure mode already on this program's record.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: coset label of the pair difference modulo the MixColumns image
      predicted_gain: an exact expectation replacing an assumed Poisson mean.
    quantifier_order: FOR the pinned probe P and FOR ALL r, THERE EXISTS E_geom(P,r) such
      that FOR ALL keys the expected hit count equals E_geom up to HA-1's error term. Key-uniformity
      is part of the claim and is testable against the five committed AES readings (14, 14,
      8, about 13.5, 12).
    method_ceiling:
      strongest_certifiable_claim: '"the expected hit count of THIS probe on any MDS-layer
        wide-trail SPN is E_geom" - it can never certify that no other probe distinguishes
        r=5 AES.'
      nearby_object_control: An MDS layer with a NON-bijective S-box breaks HA-1's rigorous
        ingredient while keeping the coset geometry; E_geom should fail there, and if it still
        fits the derivation is over-general.
    proof_obligations:
    - claim: E_geom equals 4.0 for an ideal permutation
      responsibility: baseline
    - claim: closed form matches toy exhaustive enumeration
      responsibility: correctness
    - claim: superbox composition at r=5 adds no unstated independence assumption
      responsibility: strictness
    - claim: the non-MDS sibling null separates
      responsibility: feasibility
    - claim: no sentence upgrades a null derivation into a security statement
      responsibility: scope
    not_applicable_reason: null
