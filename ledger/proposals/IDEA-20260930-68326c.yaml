  citation_note: >-
    The Cheon 2006 archive PDF and the Kim-Cheon 2012 PDF were fetched this
    session but could not be rendered to text in this container (no
    poppler); their theorem statements are taken from the internal records
    that read them. Every ceremony size above is as read from a page summary
    and is re-pinned from the primary artifact at run time; every exponent
    and ratio below is re-derived in this record from those sizes and the
    stated brackets and is an ESTIMATE, not a measurement.

  assumptions:
    - >-
      The census EXP-AUXIN-339fb0 (or a successor) has delivered certified
      divisor lattices of r - 1 and r + 1 for BLS12-381-r and BN254-r
      (alt_bn128); this record consumes d_max(q) from them and never factors.
      Until then d_max is reported as the LOWER BOUND 2^{k-1} from 2-adicity
      only, labelled as such.
    - >-
      The roster is frozen before any size is looked up and published in the
      design; rows are never added after a cell's verdict is seen.
    - >-
      Every size q_max is pinned from a transcript file, a specification at a
      pinned commit, or a published parameter set with sha256 recorded; a row
      that cannot be pinned is UNDETERMINED and is counted separately.
    - >-
      The c_step bracket [log2(r)/8, 1.5 log2(r)] and the walk constants
      a in [1.25, 2] are declared here and are replaced by measured values
      only through IDEA-20260930-704e43's run record, never by editing this
      record.
    - >-
      DEC-20260802-204's acquisition gate stands; S2 cells charge the queries
      as data and never claim an ordinary-input result.

  proof_search_map:
    bottleneck: >-
      Whether any deployed (curve, supply) cell has d_max(q_max) large
      enough that sqrt(d_max) exceeds the Cheon step cost a * c_step, i.e.
      whether the attack is below memory-charged rho in GROUP OPERATIONS, not
      merely in Cheon steps.
    baseline_embedding:
      parameter_slice: >-
        q_max = 0 (S3 rows) reproduces plain rho exactly; d = 1 on either
        branch gives T_minus(1) = sqrt(r - 1) + 1 steps, the census's own
        ceiling C_b(r). A synthetic SRS on a safe-prime r (v_2(r - 1) = 1)
        has d_max in {1, 2} and must land INERT.
      reproduction_check: >-
        Zero-run arithmetic: recompute R for the four Ethereum setups, Sapling
        and PPoT from the stated bracket; the three-way verdicts must match
        the pre-registered prediction before any pinned value is read.
    observation_collision:
      observable: >-
        Per cell: supply class, q_max with source hash, d_max on each branch
        with the census certificate id, R at both bracket ends, verdict.
      distinct_preimage_search: >-
        Two cells can show the same R from different causes: a large 2-adic
        d_max (structural) or a large odd divisor of r - 1 that happens to be
        below q_max (accidental). The table reports v_2 and the odd part of
        d_max separately so the reader can tell them apart; the null arm of
        the census (random primes) says how often the accidental case occurs.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The (class, q_max, d_max, R) tuple per cell with the verdict rule
          applied at both bracket ends.
        predicted_gain: >-
          A decidable per-cell verdict in group operations, with the
          undecided band named and handed to the measurement that decides it.
    quantifier_order: >-
      FOR EACH frozen row (curve, instantiation): the released exponent set
      is as pinned; d_max is the maximum over the certified lattice; R is as
      defined; the verdict follows from R and the declared bracket. EXISTS a
      row with verdict BELOW_RHO is the structural prediction; FOR ALL rows
      INERT is the publishable negative. No statement is made about rows not
      on the roster.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the frozen roster, cells X carry a usable r - 1 (or r + 1)
        divisor d_max inside the released exponent set and have Cheon cost
        a * c_step * sqrt(r/d_max) group operations, which is [below /
        not below / undecided within the bracket] memory-charged rho on the
        same curve." It certifies no vulnerability, no recovery, and nothing
        about rows that are UNDETERMINED.
      nearby_object_control: >-
        A release-nothing instantiation on the same curve (plain BLS
        signature on BLS12-381, which publishes [x]G2 only) must land INERT by
        supply; a synthetic SRS with q_max = 2^29 - 1 on a safe-prime order
        must land INERT by arithmetic. If either lands BELOW_RHO the join is
        wrong.
    proof_obligations:
      - claim: Every roster row's q_max is read from a pinned artifact with hash, or is UNDETERMINED.
        responsibility: interface
      - claim: d_max(q_max) is the maximum over the census's certified lattice and the released set contains the exponent d_max literally.
        responsibility: correctness
      - claim: R and the verdict are computed at both bracket ends with the constants stated here.
        responsibility: runtime
      - claim: Memory is charged as distinguished-point storage for both Cheon stages (polylog) and as 2d public points on the r + 1 branch.
        responsibility: memory
      - claim: The verdict is in group operations; the Cheon-step column is labelled per CORR-20260923-187ea3.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: number of S1 roster rows whose released set contains an exponent d | r - 1 with d >= 2^11
      direction: higher
      minimum_effect: >-
        At least 3 (the Ethereum setups at 2^11 .. 2^14, Sapling at 2^21, PPoT
        at 2^28 by 2-adicity alone). Zero such rows falsifies the structural
        claim.
    - metric: verdict per S1 cell (BELOW_RHO / INERT / STEP_UNIT_DEPENDENT)
      direction: different
      minimum_effect: >-
        Pre-registered: Ethereum setups STEP_UNIT_DEPENDENT; Sapling and PPoT
        BELOW_RHO. Any Ethereum setup landing BELOW_RHO or INERT, or Sapling /
        PPoT landing anything but BELOW_RHO, is a mismatch and is reported as
        such.
    - metric: reachable time exponent e = log2(a c_step sqrt(r/d_max)) / log2(r) on the PPoT cell (estimate, re-derived here)
      direction: lower
      minimum_effect: >-
        e in [0.466, 0.480] at a = 1.25, c_step in [2^5, 2^8.6], log2 r =
        253.6, d_max = 2^28, against rho's 0.4996; memory exponent 0 on both.
        Reported as an estimate beside the bracket, never as a measurement.
    - metric: q for the null class (ECDSA, EdDSA, ECDH, plain BLS signature, ECVRF)
      direction: same
      minimum_effect: exactly 0 on every null row; any nonzero voids the audit procedure.
    - metric: count of UNDETERMINED rows
      direction: different
      minimum_effect: reported prominently; never folded into any other count.

  minimal_test:
    design: >-
      ROSTER (frozen in the design, order fixed): S1 rows - Ethereum KZG
      ceremony setups 1-4 (BLS12-381, kzg-ceremony-specs at a pinned commit),
      Zcash Sapling powers-of-tau (BLS12-381, ebfull/powersoftau at a pinned
      commit, plus the published transcript if located), perpetual powers of
      tau (BN254, privacy-scaling-explorations/perpetualpowersoftau at the
      archived commit), Filecoin and Aztec Ignition (UNDETERMINED unless
      pinned). S2 rows - Boneh-Boyen signatures, Dodis-Yampolskiy VRF, BBS
      (draft-irtf-cfrg-bbs-signatures at a pinned revision): q = UNDETERMINED
      with the conversion mechanism cited and marked recalled. S3 rows -
      ECDSA (P-256, secp256k1), Ed25519, X25519 ECDH, BLS signatures
      (draft-irtf-cfrg-bls-signature), ECVRF (RFC 9381): q = 0 required.
      PROCEDURE. (1) Pin each row's artifact; record sha256, the clause, the
      released exponent interval, the group. (2) Consume the census's
      certified lattices of r - 1 and r + 1 for BLS12-381-r and BN254-r;
      compute d_max on each branch under q_max (r - 1) and q_max/2 (r + 1).
      If the census is not yet archived, use the 2-adic lower bound 2^{k-1}
      and label every cell LOWER_BOUND. (3) Compute R at both bracket ends
      with a = 1.25 (rho) and a = 2 (BSGS) and emit the verdict. (4) Emit the
      labelled table per CORR-20260923-187ea3: columns rho_ordinary_input
      (0.936 sqrt r group ops) and E_ASSUMES_AUXILIARY_INPUT with branch,
      input model, bits of d, supply class, source hash. (5) Report
      UNDETERMINED rows separately. SEEDS: none (deterministic audit).
      SAMPLE SIZES: the roster (about 15 rows). OUTCOME TABLE. POSITIVE
      (publishable): at least one S1 cell BELOW_RHO with a certificate chain
      (source hash -> q_max -> census divisor certificate -> R); the record
      names the cells and the factor, and routes per the goal's
      stop-and-escalate rule to independent review before any further
      statement. NEGATIVE (publishable): every pinned cell INERT, with the
      same certificate chain - the attack class is inert at deployed
      parameters in group operations. UNDECIDED: cells in the band are
      handed to IDEA-20260930-704e43's measured c_step. ARTIFACT: a null row
      with q > 0, a positive-control row with q = 0, or a row without a
      pinned source - the audit is void. FALSIFICATION THRESHOLDS, FIXED NOW:
      structural claim falsified iff fewer than 3 S1 rows carry d_max >= 2^11
      inside their released set; priced claim falsified on a cell iff the
      pre-registered verdict and the computed verdict differ.
      COST (estimate): implementation low (a table builder over pinned files
      and the census JSON, about 200 lines); compute negligible; the real
      cost is pinning artifacts, about one session.
    controls:
      - "Positive audit control: the Ethereum KZG specification, known to publish powers, must return q_max >= 2^12 - 1 on setup 1; q = 0 there voids the procedure."
      - "Null audit control: ECDSA on P-256 and Ed25519 must return q = 0 with an empty released set."
      - "Arithmetic positive control: a synthetic order r with 2^29 | r - 1 and a synthetic SRS of 2^29 - 1 powers must land BELOW_RHO at both bracket ends."
      - "Arithmetic null control: a safe-prime synthetic order (r - 1 = 2 q') with the same synthetic SRS must land INERT (d_max in {1, 2})."
      - "Unit control: the Cheon-step column and the group-operation column are both printed; a verdict read off the step column is a procedure defect."
    required_metrics:
      - "per row: supply class, released exponent interval or UNDETERMINED, group, source path and sha256"
      - "per S1 cell and branch: d_max, v_2(d_max), odd part, census certificate id, R at both bracket ends, verdict"
      - "per S1 cell: estimated group operations for Cheon (both a values, both c_step ends) and for rho (0.936 sqrt r), and the implied exponents"
      - count of UNDETERMINED rows; count of null rows with q = 0
      - the data charged per branch (3 points on r - 1; 2 d_max points on r + 1)

  falsification_conditions:
    - "Structural claim: fewer than 3 S1 roster rows carry a released exponent d | r - 1 with d >= 2^11 (after pinning)."
    - "Priced claim, per cell: computed verdict differs from the pre-registered verdict for that cell."
    - "Audit procedure: any null row returns q > 0, or the Ethereum positive control returns q = 0, or any row is reported without a pinned source (void, not negative)."
    - "Bracket: IDEA-20260930-704e43 measures c_step / log2(r) outside [1/8, 1.5]; every STEP_UNIT_DEPENDENT verdict is then re-derived under a superseding record, never by editing this one."

  confounders:
    - >-
      G2 powers (65 points in the Ethereum setups) and the pairing into G_T
      give the same exponent set in other groups; the r - 1 arithmetic is the
      same, but G_T admits index-calculus (TNFS) attacks whose recalled cost
      on BLS12-381 (about 2^117-2^126, unchecked) may dominate or match a
      BELOW_RHO cell. Reported as a dominated_by candidate, not resolved here.
    - >-
      "Released powers" in a ceremony transcript are of the FINAL tau only if
      the attacker targets the final SRS; per-contribution powers target
      individual participants' secrets, which is a different cell (noted,
      not rostered).
    - >-
      d_max may exceed 2^{k-1} through odd divisors of r - 1 below q_max;
      the census decides, and the 2-adic lower bound is labelled as a bound.
    - >-
      A ceremony's q_max is bounded by the intended circuit size, and
      designers may already have priced Cheon when choosing it (the
      "designers doing their job" confounder of
      ledger/ideas/IDEA-20260831-ccb587.yaml applies).
    - >-
      Step-unit constants depend on the scalar-multiplication method; the
      bracket is wide by design and the band is named rather than resolved.

  interpretation_limits:
    - "A reading of specifications joined with certified arithmetic and a declared cost bracket. No run of any attack, no recovery of any tau, no vulnerability claim about any ceremony or scheme."
    - "Every exponent in this record is an ESTIMATE from a bracket; the labelled table carries CORR-20260923-187ea3's unit statement beside the rho column."
    - "Nothing about ordinary ECDLP; DEC-20260802-204 B032-C7/C8 stand."
    - "S2 cells are UNDETERMINED by construction; nothing is inferred about issuance."
    - "Pairing-curve rows are expected-structure rows (CORR-20260923-187ea3); a deep value there is the expected case."

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Step-unit bracket.) One Cheon step (a fixed-base scalar
        multiplication by a known scalar of log2(r) bits) costs between
        log2(r)/8 and 1.5 log2(r) group additions for every curve on the
        roster, independent of the walk.
      rigorous_support: >-
        Double-and-add costs at most about 1.5 log2(r) additions (upper end,
        exact); fixed-base comb methods with precomputed tables reach about
        log2(r)/w additions for window w up to 8 (lower end, a standard
        implementation bound). The heuristic content is only that no method
        outside the bracket is in play.
      validation_plan: >-
        IDEA-20260930-704e43 measures c_step at r of 40-64 bits for both
        methods and reports c_step / log2(r); transfer to 255 bits assumes
        linear scaling in log2(r) (named transfer assumption). Tail check:
        the maximum per-step cost over all trials stays below 1.5 log2(r).
    - id: H2
      statement: >-
        (Walk constants.) The stage-1 rho walk in the implicit cyclic group of
        order m collides after about 1.25 sqrt(m) steps for m >= 2^20, and
        BSGS at 2 sqrt(m); stage 2 costs at most 2 sqrt(d) steps.
      rigorous_support: >-
        Birthday bound for a random mapping (sqrt(pi m / 2) = 1.2533 sqrt m)
        and the r-adding-walk analyses of KR-RHO-93979e / KR-RHO-cd86f5;
        kangaroo constants of KR-RHO-898783 for stage 2.
      validation_plan: >-
        Measured by IDEA-20260930-704e43 over >= 50 trials per size; compared
        against 1.25 sqrt(m) with a 95 percent interval; tail check on the
        longest trial.

  target_complexity:
    time_exponent: >-
      Per S1 cell: e = log2(a c_step sqrt(r / d_max)) / log2(r), i.e.
      0.5 - log2(d_max)/(2 log2 r) + log2(a c_step)/log2 r. At the PPoT cell
      (estimate) 0.466-0.480; at Sapling 0.480-0.494; at the Ethereum setups
      0.499-0.513, i.e. straddling rho. Asymptotically NO exponent moves: d is
      fixed by the ceremony, so the gain is a constant factor
      sqrt(d_max)/(a c_step).
    memory_exponent: >-
      0 (distinguished-point storage, polylog) for both Cheon stages in the
      memory-charged form; the BSGS form would need sqrt(r/d_max) points
      (about 2^113 at PPoT) and is reported only as the a = 2 row, never
      recommended.
    best_known: >-
      Memory-charged parallel rho with the negation map, 0.936 sqrt(r) group
      operations (KR-RHO-825bca, KR-RHO-fb88e6), memory exponent 0, linear
      parallel speedup; and, on the auxiliary-input side, Cheon's own bound at
      d = d_max, which this record does not improve - it prices it.
    hidden_overhead: >-
      The log r per step is the whole story and is not hidden: it is the
      bracket. Also charged: the 2d public points on the r + 1 branch, the
      distinguished-point overhead, the generator of F_r^* (factoring r - 1,
      supplied by the census), and the ERH label on the r + 1 branch.
    tradeoff_note: >-
      Stage 1 sits on the T^2 S = Theta(m) curve of KR-RHO-7d93f6 at S =
      polylog; with W workers wall time divides by W (KR-RHO-6239aa). The
      comparison with rho is made at equal memory (polylog) and equal W.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Estimate. About one session to pin artifacts and about 200 lines to
      build the joined table from pinned files and the census JSON; no
      factoring and no group arithmetic beyond the synthetic controls.

  recommended_priority: high
  priority_rationale: >-
    It is the cheapest record in the lane that can return a publishable
    positive (a named BELOW_RHO cell with a certificate chain) or a
    publishable negative (every pinned cell INERT in group operations), it
    opens the axis the queued census explicitly excludes ("never enter a
    protocol-supply stage"), and it is the consumer that makes the census's
    table interpretable. It ranks first in this lane because its undecided
    band is exactly what IDEA-20260930-704e43 measures, so the two together
    close the SRS question either way.

  dominated_by: >-
    Checked row by row against context/frontier-map-generic-rho.md. On the
    ordinary-input axis every cell is dominated by parallel rho
    (KR-RHO-13bf67, KR-RHO-825bca) because no row here is an ordinary-input
    result. On the auxiliary-input axis the per-cell result is Cheon's own
    algorithm at d = d_max in its known rho/DP form (DEC-20260802-204
    B032-C6, Takenaka-Yasuda PKC 2012, KN-LIT-6736): this record dominates
    nothing and is dominated by nothing on that axis because it is a pricing
    of a known algorithm at pinned parameters. A possible dominator of a
    BELOW_RHO cell on pairing curves is index calculus in G_T (TNFS),
    recalled at about 2^117-2^126 on BLS12-381, unchecked; it is named, not
    resolved. The multi-target and precomputation rows (KR-RHO-46c2c6,
    KR-RHO-ea34b8) do not apply: one target per cell, no precomputation
    claimed.

  sota_delta:
    time: >-
      Zero asymptotically. Per cell, a constant factor sqrt(d_max)/(a c_step)
      against memory-charged rho: estimated 2^1.5-2^9 at PPoT and Sapling,
      2^-3.5-2^0.1 (none) at the Ethereum setups. Against this program's
      prior state: the first typed supply roster with pinned sizes and the
      first group-operation verdict rule.
    memory: Zero (both at memory exponent 0 in the memory-charged form).
    data_queries: >-
      3 public transcript points (r - 1 branch) or 2 d_max points (r + 1
      branch); UNDETERMINED queries on S2 rows.

