idea:
  id: IDEA-20260930-68326c
  question_id: RQ-AUXIN-f8d8c0
  goal_id: GOAL-AUXIN-a93442
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE SUPPLY SIDE, TYPED AND PRICED IN GROUP OPERATIONS: a frozen roster of
    deployed auxiliary-power releases (powers-of-tau SRS ceremonies on
    BLS12-381 and BN254, q-SDH signature and VRF query channels, and the
    release-nothing null class), the 2-adicity coincidence (FFT-friendly r - 1
    carries 2^k exactly where ceremonies release [tau^{2^k}]G1), and a
    three-way per-cell verdict (BELOW_RHO / INERT / STEP_UNIT_DEPENDENT)
    against memory-charged rho with the per-step cost bracket fixed now
  class: measurement

  claim: >-
    THE STRUCTURAL CLAIM. Every deployed structured-reference-string ceremony
    the roster can pin releases consecutive powers [tau^i]G1 for
    0 <= i <= q_max with q_max = 2^k - 1 on a SNARK curve whose prime order r
    was CHOSEN with v_2(r - 1) >= k (FFT friendliness; recalled 2-adicities 32
    for BLS12-381 and 28 for BN254, to be re-derived from the pinned r). Hence
    the Cheon r - 1 branch (one auxiliary power [tau^d]G1, d | r - 1) is
    applicable with d = d_max(q_max) = max { d | r - 1 : d <= q_max }, which is
    at least 2^{k-1}, and the released set literally contains that exponent.
    Supply is therefore NOT the binding constraint on SRS cells; what binds is
    the UNIT: Cheon's steps are scalar multiplications (about c_step group
    operations each, log r up to constants) while rho's steps are single
    additions. THE PRICED CLAIM. With memory charged (both Cheon stages run as
    rho / distinguished-point walks in the implicit group, polylog memory,
    linear parallel speedup, as in the PKC 2012 implementation cited by
    DEC-20260802-204 B032-C6), the per-cell ratio of rho group operations to
    Cheon group operations is R = 0.936 * sqrt(d_max) / (a * c_step) with the
    Cheon stage-1 walk constant a in [1.25 (rho), 2 (BSGS)] and c_step in the
    bracket [log2(r)/8, 1.5 * log2(r)] group operations per step (fixed now;
    measured by IDEA-20260930-704e43). Fixed thresholds: a cell is BELOW_RHO
    iff R > 1 at the pessimistic end (a = 1.25, c_step = 1.5 log2 r), which at
    255-bit r means d_max > 2^18; INERT iff R < 1 at the optimistic end
    (c_step = log2(r)/8), i.e. d_max <= 2^10; STEP_UNIT_DEPENDENT between.
    PRE-REGISTERED PREDICTION from the retrieved sizes: the Ethereum KZG
    ceremony setups (G1 powers up to 2^12 - 1 ... 2^15 - 1, d_max >= 2^11 ...
    2^14) land STEP_UNIT_DEPENDENT; the Zcash Sapling powers-of-tau (depth
    2^21, d_max >= 2^21) and the perpetual powers of tau on BN254 (2^29 - 1
    powers, d_max >= 2^28) land BELOW_RHO by a factor between 2^1.5 and 2^9
    in group operations, i.e. a reachable time exponent of about 0.466-0.494
    against rho's 0.4996 on the same curve, at memory exponent 0 on both
    sides. Query-supplied cells (Boneh-Boyen / Dodis-Yampolskiy / BBS-type
    signatures and VRFs) are reported with q = UNDETERMINED (issuance-bounded),
    never estimated. Release-nothing cells (ECDSA, EdDSA, ECDH, plain BLS
    signatures, ECVRF) are the null class and must come back q = 0.

  mechanism: >-
    TRACKED OBJECT. Per deployed instantiation: the typed supply tuple
    (class in {S1 public SRS, S2 query-derived, S3 none}, the released exponent
    set as an integer interval or UNDETERMINED, the group it lives in, the
    pinned source clause), joined on the curve with the census's certified
    divisor lattice of r - 1 and r + 1 (EXP-AUXIN-339fb0 output, consumed,
    never recomputed here) to produce d_max(q_max) on each branch.
    LOSSY-PROJECTION TEST (docs/inventor-protocol.md section 2). The
    projection (protocol) -> (supply tuple) discards the protocol's proof
    system, pairing, security goal and implementation and keeps exactly what
    Cheon's two theorems consume (which powers exist, in which group, how
    many). It is lossy in a named direction: indirect leakage through
    adaptive queries is S2, handled as its own class with its own q, not folded
    into S1. The retained part propagates deterministically under the one
    operation that matters (restricting the released exponent set to the
    divisor lattice of r - 1 and r + 1), so it is an object, not a change of
    coordinates. WHY 2-ADICITY IS THE LEVER. Groth16 / PLONK / KZG provers
    need a multiplicative subgroup of F_r of order 2^k for radix-2 FFTs, so
    SNARK curves are selected with 2^k | r - 1 for k at or above the largest
    circuit size the ecosystem intends to support; a ceremony then publishes
    [tau^i]G1 up to exactly that circuit bound. The same arithmetic fact that
    makes the curve FFT-friendly places a divisor of r - 1 inside the released
    exponent interval. This is the coincidence the record names; it is not a
    design flaw in any one ceremony and the record does not say it is. WHY
    THE UNIT DECIDES. Cheon Theorem 1 (internal: H-AUXIN-6db354,
    CORR-20260923-187ea3; both versions read by TASK-20260923-635c5c) costs
    O(log r * (sqrt((r - 1)/d) + sqrt(d))) group operations, the log r being
    one scalar multiplication per step; rho's 0.936 * sqrt(r) (negation map at
    the measured 0.947 * sqrt(2) of KR-RHO-fb88e6 / KR-RHO-825bca) counts
    additions. With d bounded by a ceremony's q_max rather than by sqrt(r),
    sqrt(d) and c_step are numbers of the same order (2^5.5 to 2^14 against
    2^5 to 2^8.6), so the verdict is a comparison of two constants, not of two
    exponents; the record fixes the comparison rule before any number is
    looked up. MEMORY-CHARGED FORM. Stage 1 is a DLP in a cyclic group of
    order m = (r - 1)/d acting on [tau^d]G1 by the known scalars
    (zeta^d)^j; a rho walk with distinguished points there needs about
    1.25 * sqrt(m) steps and polylog memory, meets the T^2 S = Theta(m) bound
    of KR-RHO-7d93f6 at S = polylog, and parallelises linearly
    (KR-RHO-6239aa). Stage 2 is an interval DLP of width d (kangaroo,
    KR-RHO-898783, about 2 sqrt(d) steps) and is negligible whenever
    d <= q_max << sqrt(r), which holds on every pinned cell. The r + 1 branch
    (Theorem 2, 2d consecutive powers, cost sqrt((r + 1)/d) + d) is priced
    the same way with d <= q_max / 2 and d_max taken on r + 1; its linear term
    is negligible at these d. DATA AXIS. The r - 1 branch consumes three
    points (G1, [tau]G1, [tau^d]G1) of a public transcript; the r + 1 branch
    consumes 2d points. Both are charged as public data, not as queries.
    WHAT IS OFF-LIMITS. DEC-20260802-204 stands: nothing here acquires a
    power; every power is read from a transcript or a signature.

