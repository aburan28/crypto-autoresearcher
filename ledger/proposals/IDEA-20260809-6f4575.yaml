idea:
  id: IDEA-20260809-6f4575
  question_id: RQ-MQOM-001
  added: '2026-08-09'
  title: Three goals share the MPC-in-the-Head soundness object and derive it three times incompatibly;
    the code-based family built ISD-FC-2026 and the multivariate family is having UOV-FC-2026
    proposed, and the MPCitH third has no accounting basis, no owner, and a free cross-check nobody
    has run
  class: control
  claim: 'Three goals target the same object -- the concrete forgery cost of a parallel-repeated
    MPCitH/TCitH/VOLEitH transform once a multi-round grinding adversary is charged. GOAL-SDITH-001
    asks ''whether the MPCitH transform''s soundness leaves any grinding slack''; GOAL-MQOM-001
    asks to ''re-derive the concrete forgery cost under the Round-3 Fiat-Shamir/TCitH instantiation
    and locate any slack a grinding attacker can spend''; GOAL-FAEST-001 (active) reconstructs
    the chain ''through VOLEitH soundness and the Fiat-Shamir'' transform. The derivations have
    already been done independently and incompatibly. H-SDITH-f1acdd is written generically --
    ''a tau-fold parallel-repeated 5-round MPC-in-the-Head signature with N parties per repetition
    and first-phase cheating probability p, evaluated in exact rational arithmetic over the adversary''s
    strategy split tau'''' -- and states in its own text that its threshold is ''reusable unchanged
    for GOAL-MQOM-001 and GOAL-FAEST-001''. H-MQOM-a0a477 derives MQOM v2.1''s parameter table
    from four closed forms and TWICE DISCLAIMS the transfer, saying its result says nothing ''about
    FAEST, SDitH, or any other MPCitH scheme''. H-FAEST-a55eb3 computes FAEST''s bAVC opening-size
    acceptance rate from faest-ref source, a third instrument on the same object. Verified: knowledge/techniques
    contains no MPCitH or soundness-accounting entry (KN-TECH-062 is the proof-architecture portfolio
    -- methodology, not accounting). So one hypothesis offers itself as the shared basis, a second
    refuses in writing, a third builds separately, and no decision, KN-TECH or goal adjudicates
    the offer.'
  mechanism: 'RUN THE FREE FALSIFICATION FIRST, BEFORE WRITING ANY BASIS. H-SDITH-f1acdd''s generic
    formula and H-MQOM-a0a477''s four closed forms should AGREE on any parameter triple both can
    express; IDEA-20260805-7abf04 supplies six such triples explicitly (the (lambda, N, w, tau)
    rows where MQOM''s inequality holds with exact equality), so the comparison costs nothing
    and is decisive either way -- it validates the reuse offer, or it names exactly where the
    two accountings diverge, which is the more useful outcome. Only then write one scheme-independent
    MPCITH-FC-2026 accounting basis, parameterless and arithmetic-free, fixing for the whole family:
    what a forgery attempt counts as a unit; how the strategy split across rounds is charged;
    whether hash/commitment calls, seed-tree expansion and GGM-tree work are charged or free;
    the memory charge and its exponent AS A ROW (cluster CHRG supplies the measured value); and
    the signature-query budget. Then a Coordinator decision that ADOPTS it, so the three goals''
    forgery numbers become subtractable.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'This is the same defect the corpus has now committed in three families, and the two proposals
      that address it cover the other two. IDEA-20260807-c3267e is about adopting an existing
      completed ISD artifact for code-based ATTACK COST, not transform soundness. IDEA-20260807-b63f08''s
      claim, mechanism and deliverable (UOV-FC-2026) are scoped to the four UOV-family goals and
      the oil-space-recovery Macaulay/rank object, making no statement about MPCitH soundness.
      The nearest MPCitH proposal, IDEA-20260805-7abf04, is MQOM-only -- ''The zero-slack ledger:
      MQOM''s Fiat-Shamir/grinding design inequality is met with EXACT equality at every one of
      its six distinct (lambda, N, w, tau) triples'' -- i.e. it is one more scheme-scoped derivation
      of the same object, and its existence sharpens the gap rather than filling it. H-SDITH-f1acdd''s
      own offer is a sentence inside a proposed hypothesis on an unapproved contract, which is
      not an adoption, and H-MQOM-a0a477 has already declined it in writing.'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: attacking any one scheme.
      The object is the SHARED MPC-in-the-Head SOUNDNESS FORMULA that three goals derive separately.'
    tracked_object: The forgery-soundness bound as a function of (lambda, N, w, tau), evaluated
      by each goal's own derivation on parameter triples all of them can express.
    one_step_propagation_rule: Two derivations of one bound must agree pointwise wherever both
      are defined; disagreement at any expressible triple falsifies at least one.
    newness_score: Nil as mathematics -- the bound is published. The content is that three goals
      derived it independently and nobody has checked they agree.
  lossy_projection_identifiability_audit:
    projection: the three derivations -> their values on a common parameter grid.
    what_is_discarded: The derivations' internals; only their outputs are compared.
    is_it_only_a_change_of_coordinates: 'NO -- agreement is a genuine constraint and is not guaranteed
      by construction. Honest caveat: agreement does not establish either is correct, only that
      they are consistent.'
    mirror_failure_check: 'CHECKED. The comparison must be able to disagree: the three derivations
      were written independently by different sessions, so agreement is informative rather than
      tautological.'
  null_object_control:
    primary_null: 'RUN THE FREE FALSIFICATION FIRST: H-SDITH-f1acdd''s generic formula and H-MQOM-a0a477''s
      four closed forms must AGREE on any triple both express. IDEA-20260805-7abf04 supplies six
      such triples explicitly -- the rows where MQOM''s inequality holds with exact equality --
      so the comparison costs nothing and is decisive either way.'
    secondary_nulls:
    - Evaluate both at a triple where the bound is known in closed form from the published analysis,
      as an external anchor.
    - A deliberately out-of-domain triple must be rejected by both rather than silently extrapolated.
  assumptions: []
  predictions:
  - metric: agreement of the two derivations on the six expressible triples
    direction: different
    minimum_effect: Any disagreement falsifies at least one derivation and is the whole result;
      agreement validates the reuse offer at zero cost.
  minimal_test:
    design: Evaluate H-SDITH-f1acdd's generic formula and H-MQOM-a0a477's closed forms on the
      six triples IDEA-20260805-7abf04 already lists; report agreement or the discrepancy; only
      if they agree, write the shared basis.
    controls:
    - six equality-case triples from IDEA-20260805-7abf04
    - external closed-form anchor
    - out-of-domain rejection check
    required_metrics:
    - per-triple values from each derivation
    - discrepancy magnitude if any
    - domain of validity of each formula
  falsification_conditions:
  - 'The two agree on all six: the reuse offer is validated and a shared basis is warranted and
    cheap.'
  - 'They disagree: at least one goal''s soundness derivation is wrong, which is a far more valuable
    result than the basis would have been.'
  - 'The six triples are not in fact expressible by both: the comparison is void and the domains
    must be characterised first.'
  confounders:
  - Different papers state the bound in different parameterisations; a mismatch may be notation
    rather than mathematics, and the comparison must normalise first.
  - Equality-case triples are special; agreement there does not guarantee agreement generally.
  interpretation_limits:
  - A consistency check between two in-repo derivations. It validates neither against the literature,
    and says nothing about any scheme's security.
  - Adopting a shared basis is a Coordinator act.
  heuristic_assumptions:
  - id: HEUR-MPCFC-1
    statement: The six equality-case triples are representative of the formulas' common domain.
    rigorous_support: None; they are the cases IDEA-20260805-7abf04 happened to identify.
    validation_plan: Extend to non-equality triples if the first six agree.
