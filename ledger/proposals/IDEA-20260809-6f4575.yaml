  sota_delta: ZERO on every attack axis; no attack is proposed. Prevents the third committed instance
    of a divergence the program has already diagnosed twice and called 'the THIRD occurrence of
    the error family' once, and it is the prerequisite for any Pareto row comparing MPCitH candidates
    against each other or against the UOV and ISD families. It also converts a currently-orphaned
    generic derivation -- H-SDITH-f1acdd is written to serve three goals and is claimed by none
    -- into a corpus asset, and the decisive first step costs zero compute.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.95 that the comparison is runnable at zero compute. 0.6 that the
    two derivations agree -- independent derivations of a published bound usually do, but three
    separate derivations is exactly the setup where they do not. 0.4 that a discrepancy surfaces,
    which would be the more valuable outcome.
