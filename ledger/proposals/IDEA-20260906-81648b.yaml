    "claim": "For the r-1 branch with nonzero hidden scalar x and several supplied [x^{d_i}]P, first-stage constraints on log_zeta(x) modulo m_i=(r-1)/d_i can be CRT-combined; the residual stage has size (r-1)/lcm(m_i). A benefit requires independent modulus coverage and legal sparse supply whose acquisition does not dominate.",
