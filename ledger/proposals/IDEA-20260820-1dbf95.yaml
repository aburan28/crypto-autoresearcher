idea:
  id: IDEA-20260820-1dbf95
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Serialization-exception fallback as a public transcript mixture
  class: distributional implementation-fault audit
  claim: >-
    An implementation that catches a designated internal serialization exception and
    falls back to a different encoding or resampling path can emit an acceptance-
    conditioned public transcript mixture distinguishable from both the ordinary
    signer and a true simulator. The proposal is restricted to that explicit
    exception oracle and claims neither a canonicalization theorem, timing leakage,
    length leakage, key recovery, nor a hard-problem improvement.
  mechanism: >-
    Define O_ser-exc(f, e) to force exactly one declared internal serialization call
    f to return exception code e after its input object has been computed but before
    bytes are exposed. The implementation then follows its documented catch/fallback
    path and either emits a valid transcript or rejects. Compare the full public
    outcome law, including valid transcript fields, explicit rejection, and parse
    status, with a no-fault signer. A fallback that truncates, substitutes a sentinel,
    changes a coordinate ordering, or resamples only a suffix can create a mixture
    component aligned with public verifier strata even when emitted byte lengths are
    padded to equality.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-bdae64
