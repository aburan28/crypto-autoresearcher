  assumptions:
    - Characteristic p > 3 and short Weierstrass form; m = 3 only.
    - >-
      E non-singular, i.e. f squarefree. This is exactly where the lower
      bound of (S3) is used and it is the only curve hypothesis anywhere.
    - >-
      The base is affine A^2 in (e1,e2); all densities are affine densities
      and the projective closure is not analysed.
    - >-
      Tameness: p odd, so p does not divide any ramification index (all are
      2). Wild ramification is out of scope and would break STEP 5's lower
      bound, not its upper bound.

  proof_search_map:
    bottleneck: >-
      The exact step is the lower bound on the geometric monodromy uniform in
      the curve. Everything else (containment in the wreath group, the
      Frobenius recipe) is bookkeeping. Removing the lower bound leaves only
      "the group is a subgroup of D_4", which is compatible with an
      exceptional locus and therefore decides nothing.
    baseline_embedding:
      parameter_slice: >-
        Restricting the degree-8 cover to the ordered base (i.e. adjoining
        sqrt(e1^2-4e2) to the base field) kills the S_2 factor and returns
        exactly KN-FIND-a8990a Theorem A at m = 3: group (Z/2)^2 on the four
        points, (Z/2)^1 on the two T-roots, only cycle types 1^4 and 2^2.
      reproduction_check: >-
        Symbolic: the fixed field of <tau> is k(t1,t2) and the induced group
        is <sigma_1,sigma_2>. Numeric regression: on the same run, classify
        every base point twice, once over (t1,t2) and once over (e1,e2), and
        require the ordered arm to reproduce Theorem B's two-type law with
        zero exceptions. A symmetrised result that cannot reproduce the
        committed ordered law on the same data is wrong.
    observation_collision:
      observable: >-
        The Frobenius conjugacy class in D_4, observed as the cycle type of
        the four points of Phi(e1,e2).
      distinct_preimage_search: >-
        The collision is REAL and is disclosed: cycle type 2^2 has TWO
        preimages, the central element sigma_1 sigma_2 (both blocks flipped,
        blocks fixed) and the block-swap involutions. Cycle type alone
        therefore does not determine the class, which is why the required
        metrics record the triple (chi(e1^2-4e2), chi(f(t1)), chi(f(t2)))
        and not just the cycle type. A record that reported only cycle types
        would merge two classes of total density 3/8 and could not measure
        the 1/8 versus 1/4 split.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The degree-8 Galois cover of the SYMMETRIC base, replacing the
          degree-2 T-cover of the ordered base as the carrier of the
          question.
        predicted_gain: >-
          Group order 2 -> 8; realizable permutation orders {1,2} -> {1,2,4};
          and a question that was vacuous at degree 2 (S_2 is trivially full)
          becomes a genuine full-versus-not decision at degree 4.
      - transform: boundary_lift
        proposed_object: >-
          Inertia at the two ramification divisors, lifted to a lower bound
          on the global monodromy via tame pi_1 of A^2.
        predicted_gain: >-
          Converts a per-curve census into a curve-uniform theorem; the
          exceptional locus is shown empty rather than unobserved.
    quantifier_order: >-
      FOR ALL p > 3, FOR ALL non-singular E/F_p, THERE EXIST two ramification
      divisors whose inertia generate, and THEREFORE the geometric monodromy
      of the degree-4 symmetric-base cover equals Z/2 wr S_2. Note the order:
      the group is not merely full for a generic curve, it is full for every
      curve, so no "outside an exceptional locus" clause appears.
    method_ceiling:
      strongest_certifiable_claim: >-
        The geometric and arithmetic monodromy of the m=3 symmetric-base
        Semaev tower, exactly, for all p > 3 and all non-singular E. NOT
        certifiable by this method: anything about m >= 4 (the symmetric base
        there is Sym^3 and the wreath group is Z/2 wr S_3 of order 48, which
        this record does not compute), anything about relation rates on the
        factor-base sublocus (constant there, by (S7)), and any cost claim.
      nearby_object_control: >-
        The nearby object on which the conclusion FAILS is the cover
        (Y^2 - a(e))(Y^2 - c a(e)) with c a fixed non-square constant: same
        degree, same block system, arithmetic group (Z/2)^2 but geometric
        group Z/2. Its existence is why STEP 4 is a required step and not a
        formality, and it is the planted separator of the sibling record
        IDEA-20260830-8a767e.
    proof_obligations:
      - claim: >-
          The three T-coefficients of S_3 lie in k[e1,e2] with the stated
          forms.
        responsibility: baseline
      - claim: >-
          [k(t1,t2,y1,y2) : k(e1,e2)] = 8 and the extension is Galois with
          group D_4.
        responsibility: correctness
      - claim: >-
          Inertia at D_swap and D_sign generate D_4 for every non-singular E.
        responsibility: strictness
      - claim: >-
          No constant-field extension, hence arithmetic = geometric.
        responsibility: scope
      - claim: >-
          The Frobenius recipe (S6) determines the class per instance.
        responsibility: feasibility

  predictions:
    - metric: >-
        frequency of Frobenius cycle type 4 (a 4-cycle on the four points of
        Phi) over uniform (e1,e2) in F_p^2, excluded strata removed
      direction: higher
      minimum_effect: >-
        0.25 up to O(1/p); at least 0.20 at every tested p >= 101. THE
        CONTRAST IS CATEGORICAL: the same classifier on the ordered base of
        the same curve must return EXACTLY 0 4-cycles (KN-FIND-a8990a
        Theorem B). A symmetrised frequency of 0 falsifies the wreath claim
        outright.
    - metric: frequency of cycle type 3+1 on the same fibres
      direction: lower
      minimum_effect: >-
        EXACTLY 0 over every classified base point. D_4 contains no element of
        order 3. One occurrence falsifies the wreath upper bound, and would
        also contradict the block system being preserved.
    - metric: >-
        number of distinct Frobenius permutations of the labelled four-point
        fibre realized per curve
      direction: higher
      minimum_effect: >-
        EXACTLY 8 at every tested p >= 101, on every curve of the panel.
        Fewer than 8 with all controls passing is the exceptional-locus
        signal RQ-MONO-001 hunts and routes to its own record.
    - metric: >-
        per-instance agreement between observed cycle type and the type
        forced by the character triple (chi(e1^2-4e2), chi(f(t1)),
        chi(f(t2))) via recipe (S6)
      direction: higher
      minimum_effect: >-
        1.000 exactly, every classified base point, every curve. A single
        mismatch kills the record; this is stronger than any frequency test
        because it is per-instance.
    - metric: >-
        class densities (identity, {sigma_i}, sigma_1 sigma_2, block-swap
        involutions, 4-cycles) against the group-theoretic values
        (1/8, 1/4, 1/8, 1/4, 1/4)
      direction: same
      minimum_effect: >-
        Each within 3 binomial standard errors AND within an O(1/p) window;
        specifically the deviation must NOT be of order p^{-1/2}. A
        p^{-1/2}-sized deviation would mean the trace enters at first order,
        contradicting the first-order cancellation KN-FIND-a8990a Theorem B
        records for the ordered base, and is a two-sided falsifier.
    - metric: >-
        curve-panel spread of each class density at fixed p (generic
        ordinary, CM, j=0, j=1728, full rational 2-torsion)
      direction: same
      minimum_effect: >-
        All panels agree with the same forced values within the same O(1/p)
        window. A j=0 or CM curve standing outside it is the single most
        informative possible failure and is the outcome the question's
        exceptional-locus clause predicts.

  minimal_test:
    design: >-
      STAGE 0, zero compute: emit the coefficient identities of (S1) and the
      c0, c1 forms of STEP 3 symbolically over Z[e1,e2,A,B] and check
      c0 = disc_T S_3 / 16 against the committed KN-FIND-a8990a identity. A
      mismatch stops everything. STAGE 1, minutes, pure Python at p = 101 and
      p = 211: EXHAUSTIVE enumeration of all p^2 base points (e1,e2), with
      the excluded strata separated, classifying each fibre TWICE and
      independently -- (a) by direct group arithmetic (factor x^2-e1x+e2 over
      F_p, lift each root to E over F_p or F_{p^2}, apply Frobenius to the
      four points, read the permutation), and (b) by factoring the explicit
      quartic h(Y) = Y^4 - c1 Y^2 + c0 over F_p -- and requiring the two to
      agree on every point off the instrument stratum. STAGE 2: the same at
      p = 1009 by sampling rather than exhaustively, plus the controls.
      STAGE 3: the ordered-base arm on the identical data, which must
      reproduce Theorem B exactly and must emit zero 4-cycles.
    controls:
      - >-
        NULL OBJECT, KNOWN-FULL, MUST EMIT WHAT D_4 CANNOT. Uniformly random
        monic quartics over the same F_p, classified by the same code path.
        Forced: S_4 Chebotarev densities 1/24, 1/4, 1/8, 1/3, 1/4 for
        1^4, 2.1.1, 2^2, 3+1, 4 within 3 standard errors, and in particular
        type 3+1 at about 1/3. If the classifier cannot emit 3+1, its report
        of "3+1 never occurs" on the Semaev instrument is empty and NO
        NEGATIVE MAY BE REPORTED.
      - >-
        MATCHED ORDERED-BASE ARM ON THE SAME CURVE AND THE SAME DATA. Forced:
        exactly two cycle types, exactly 0 4-cycles. This is the control that
        proves the symmetrisation, and not the code path, produces the
        4-cycles.
      - >-
        EXCLUDED STRATA, COUNTED NOT POOLED. (i) e1^2 - 4 e2 = 0 (t1 = t2,
        degree drop, KN-FIND-a8990a's S_2 = 0 locus); (ii) c0 = 0 (a t_i is a
        2-torsion x-coordinate: genuine ramification); (iii)
        e1^2 - e2 + A = 0 (INSTRUMENT-ONLY: h has repeated roots although the
        four points are distinct, so arm (b) is invalid there while arm (a)
        is not). Each is reported with its own count and its own forced count.
      - >-
        FACTOR-BASE SUBLOCUS ARM, DECLARED IN ADVANCE TO BE NON-
        DISCRIMINATING. Restrict to (e1,e2) coming from two factor-base
        x-coordinates. Forced: identity class, 100 percent. Recorded before
        the run as a control that CANNOT discriminate, so that its passing is
        never reported as a result (this is (S7), and it is Theorem C).
      - >-
        CURVE PANEL: at least 3 generic ordinary curves, one CM, j = 0 and
        j = 1728 (both flagged and reported separately per RQ-MONO-001
        constraint 2), and one curve with full rational 2-torsion.
    required_metrics:
      - >-
        per base point: the character triple, the predicted class, the
        observed class from arm (a), the observed factorization type from
        arm (b), and their agreement flag
      - five class counts per curve, with the excluded strata separated
      - number of distinct labelled permutations realized, per curve
      - ordered-base arm class counts on the identical data
      - random-quartic control histogram against S_4 Chebotarev densities
      - arm (a) versus arm (b) disagreement count, which must be 0 off stratum (iii)
      - artifact manifest with hashes and a rebuild receipt

  falsification_conditions:
    - >-
      Any observed cycle type outside {1^4, 2.1.1, 2^2, 4} on a non-excluded
      base point. Kills the wreath upper bound; the record is withdrawn by a
      superseding record, never edited.
    - >-
      Zero 4-cycles observed on the symmetric base while the random-quartic
      control passes. Kills the lower bound and would mean the tower is not
      what STEP 2 says it is.
    - >-
      Any per-instance disagreement between the observed class and the class
      forced by the character triple.
    - >-
      Fewer than 8 distinct permutations realized on any curve at p >= 1009.
      This is the exceptional-locus outcome and it is a falsifier of the
      record's central claim, not a hoped-for result.
    - >-
      A class density deviating from its forced value by order p^{-1/2}
      across the p-ladder while controls pass. Then the trace enters at first
      order and the O(1/p) claim is wrong.
    - >-
      The random-quartic control failing to emit 3+1. Instrument outcome, not
      mathematical evidence; nothing may be reported in either direction
      (AGENTS.md rule 3).

  confounders:
    - >-
      INSTRUMENT DEGENERACY. On { e1^2 - e2 + A = 0 } the quartic h has
      repeated roots although the four points are distinct, because the map
      point -> y-coordinate is not injective on that fibre. An
      implementation that classifies only by factoring h will mis-score that
      stratum. It has density about 1/p, so pooling it does not change any
      headline, but it will produce a small stream of unexplained
      disagreements that must not be absorbed.
    - >-
      TWO CLASSES SHARE ONE CYCLE TYPE. 2^2 arises both from sigma_1 sigma_2
      and from the block-swap involutions; a cycle-type-only report merges
      densities 1/8 and 1/4. The character triple is required for this
      reason and is not redundant instrumentation.
    - >-
      LABELLING. "Number of distinct permutations realized" requires a fixed
      labelling of the four points across base points; an implementation that
      relabels per point will over- or under-count the group.
    - >-
      SMALL p. At p = 101 the O(1/p) corrections are about 1 percent and the
      binomial error on 10201 points is about 0.4 percent, so the two are
      comparable; the p-ladder exists to separate them, and no p = 101 cell
      may carry a density claim on its own.
    - >-
      CHARACTERISTIC AND TAMENESS. The inertia lower bound needs p odd; the
      Weierstrass form needs p > 3. Nothing here says anything about
      characteristic 2 or 3.
    - >-
      AUTHORSHIP ASYMMETRY. The derivation and the classifier would share any
      conceptual error if written by the same agent in one pass. The two
      independent classification arms and the ordered-base reproduction exist
      precisely so that a single wrong idea cannot pass both.

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement; the group computation is a
      DERIVATION and must be cited as one. Largest p contemplated is about
      1009.
    - >-
      NO ECDLP CLAIM OF ANY KIND, in either direction. No speedup, no
      barrier theorem, no change to any cost estimate.
    - >-
      IT DOES NOT EVADE THE CENSUS OBSTRUCTION. On the factor-base sublocus
      the statistic is identically the identity class, exactly as
      KN-FIND-a8990a Theorem C forces. Anyone citing this record as a route
      to relation-rate content is misciting it.
    - >-
      IT IS m = 3 ONLY. At m >= 4 the symmetric base is Sym^{m-1} and the
      candidate group is Z/2 wr S_{m-1}; whether inertia still generates it is
      NOT addressed and is named as forward guidance.
    - >-
      NO STATUS CHANGE to KN-OPEN-009, KN-FIND-a8990a, RQ-MONO-001 or any
      record is proposed or implied. Coordinator authority alone.

  heuristic_assumptions:
    - id: HEUR-WREATH-1
      statement: >-
        For a tame finite cover of A^2 over an algebraically closed field of
        characteristic p, branched along a divisor D, the geometric monodromy
        group is generated by the inertia subgroups at the components of D.
      rigorous_support: >-
        The rigorous ingredient is the triviality of the prime-to-p etale
        fundamental group of affine space together with the tame
        specialisation theory of Grothendieck (SGA1); over C this is the
        elementary statement that pi_1 of a complement is generated by loops
        around the branch components. RECALLED, NOT FETCHED. THE GAP: in
        characteristic p the statement is for the tame quotient only, and the
        degree here is 8, so it applies exactly when p is odd -- which is
        assumed. It is listed as a heuristic rather than a citation because no
        source was opened this session.
      validation_plan: >-
        SAMPLE: the lower bound is independently confirmed WITHOUT the lemma
        by exhibiting all 8 labelled permutations as Frobenius elements, on
        every curve of the panel, at p in {101, 211, 1009}; realized classes
        are an unconditional lower bound on the arithmetic monodromy, and
        STEP 4 transfers it to the geometric one. COMPARISON: the lemma-based
        lower bound (8) against the measured realized count (must be 8).
        TAIL CHECK: the curve with the fewest realized permutations, reported
        with its (t, Z). TRANSFER: none beyond p odd and m = 3. If the
        measured count is 8 everywhere the record does not depend on
        HEUR-WREATH-1 at the tested scope at all, and that independence is
        the reason the validation is designed this way.
    - id: HEUR-WREATH-2
      statement: >-
        F_p is algebraically closed in F_p(t1,t2,y1,y2), so the arithmetic
        monodromy over F_p equals the geometric monodromy.
      rigorous_support: >-
        Argued in STEP 4 rather than assumed: a constant-field extension is
        everywhere unramified, and each of the three quadratic steps is
        ramified along an explicit divisor. KN-FIND-a8990a Theorem A asserts
        the same conclusion for the ordered sub-tower and is corroborating,
        not load-bearing. The residual gap is that "ramified therefore not
        constant" is applied step by step rather than to an arbitrary
        subextension.
      validation_plan: >-
        SAMPLE: recompute the realized-class count over F_{p^2} as well as
        F_p, on every panel curve. PREDICTED: unchanged at 8, because a
        constant extension would show up as a strict drop in the realized
        group after base change (that drop is exactly what the planted
        separator in IDEA-20260830-8a767e exhibits). TAIL CHECK: any curve
        whose F_{p^2} count differs from its F_p count is reported
        individually and voids the geometric reading for that curve.
    - id: HEUR-WREATH-3
      statement: >-
        Over uniform (e1,e2) in F_p^2, the character triple
        (chi(e1^2-4e2), chi(f(t1)), chi(f(t2))) equidistributes over its
        attainable values up to an error of order 1/p, with no term of order
        p^{-1/2}.
      rigorous_support: >-
        e1^2 - 4 e2 is uniform on F_p because e2 -> e1^2 - 4 e2 is a bijection
        for each fixed e1, so the first bit is exactly balanced. The remaining
        counts reduce to counts of x with f(x) a square, i.e. to
        S = (p - t - Z)/2 over F_p and its F_{p^2} analogue; the trace enters
        only through products in which it cancels at first order, which is the
        same phenomenon KN-FIND-a8990a Theorem B records and proves for the
        ordered base.
      validation_plan: >-
        SAMPLE: exhaustive over all p^2 base points at p in {101, 211}, and
        at least 10^6 sampled points at p = 1009, per curve. COMPARISON:
        measured class counts against the exact closed form in (p, t, Z),
        residual required to be exactly 0 in integer arithmetic once the
        closed form is emitted (the closed form itself is the sibling record
        IDEA-20260830-9761f0's claim and is tested there). TAIL CHECK: the
        curve with the largest |t| on the panel, where any first-order trace
        term would be most visible. TRANSFER: toy p only; nothing is
        extrapolated to cryptographic size, and the group statement does not
        need to be.

  target_complexity:
    time_exponent: >-
      NO ATTACK AND NO EXPONENT. Stated plainly rather than dodged. The
      quantity this record could in principle have touched is the
      relation-collection constant of prime-field index calculus, and (S7)
      shows it touches even that not at all, because the statistic is
      constant on the factor-base sublocus. Instrument cost is O(p^2)
      four-point classifications for the exhaustive arm, i.e. about 10^4 to
      10^6 cheap operations per curve.
    memory_exponent: >-
      Negligible: O(1) points per base point, plus a five-cell histogram.
    best_known: >-
      Pollard rho at p^{1/2} time and O(1) memory remains the prime-field
      ECDLP baseline (KN-OPEN-001). Nothing here competes with it. On the
      QUESTION rather than on any attack, the incumbent is KN-FIND-a8990a
      Theorem A, which computes the ordered-base group; this record extends
      it by base change and is not a competitor to it.
    hidden_overhead: >-
      None charged; no algorithm is proposed. The honest overhead disclosure
      is methodological instead: the inertia lower bound rests on a recalled
      lemma (HEUR-WREATH-1), and the measured realized-class count is
      supplied so the result does not depend on it at the tested scope.
    tradeoff_note: >-
      More base points buys density resolution; more primes buys separation
      of the O(1/p) correction from binomial noise. The split is fixed in
      advance by the p-ladder {101, 211, 1009}.

  dominated_by: >-
    n/a (no result claimed on any attack axis) -- and the frontier was
    checked row by row before writing that, rather than asserted. TIME:
    Pollard rho p^{1/2}; van Oorschot-Wiener parallel collision search;
    the prime-field index-calculus family recorded in KN-OPEN-001/002. No
    competitor is proposed on any of them. MEMORY: rho at O(1) versus any
    table method; the instrument's own memory is bytes and is an instrument
    cost, not an attack cost. DATA/QUERIES/ADVICE: none consumed; the input
    is public curve data and no oracle is queried. On the question axis the
    nearest incumbent is KN-FIND-a8990a Theorem A: this record is NOT
    dominated by it (different base, different group, a permutation class it
    forbids) and does not dominate it (Theorem A holds at every m, this holds
    at m = 3). Recorded as "extends by base change", never as "beats".
  sota_delta: >-
    Zero on every attack axis. On the question: from a decided ordered-base
    group of order 2 at m = 3 -- where "full symmetric" is vacuous because
    S_2 is the whole symmetric group on 2 letters -- to a decided
    symmetric-base group of order 8 on 4 points, which is the full wreath
    group Z/2 wr S_2 and has index 3 in S_4. Quantitatively: realizable
    permutation orders go from {1,2} to {1,2,4}; the 4-cycle class moves from
    forced density EXACTLY 0 to forced density 1/4; and the exceptional locus
    for the geometric-group half goes from "expected empty, unproven"
    (KN-OPEN-009 verbatim) to empty with a two-sided argument uniform in the
    curve, at m = 3.

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Pure-Python integer arithmetic over F_p and F_{p^2}; two independent
      classifiers, one of which needs only quadratic and cubic evaluation
      plus Legendre symbols. Exhaustive at p = 101 is 10201 base points and
      at p = 211 is 44521; p = 1009 is sampled. No CAS and no solver is
      required; the harness already carries s3_expr and toy-curve arithmetic.
  recommended_priority: high
