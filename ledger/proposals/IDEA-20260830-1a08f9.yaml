idea:
  id: IDEA-20260830-1a08f9
  question_id: RQ-MONO-001
  added: '2026-08-30'
  status: proposed
  proposed_by: idea-generator
  class: mechanism

  title: >-
    THE QUESTION'S "WREATH" BRANCH HAS NEVER BEEN POSED OVER THE BASE WHERE
    IT LIVES. Over the SYMMETRIC base (e1,e2) = (x1+x2, x1*x2) -- the base
    S_3 actually has coefficients in -- the m=3 Semaev tower is Galois of
    degree 8 with geometric monodromy EXACTLY the full wreath group
    Z/2 wr S_2 = D_4, for every non-singular curve; the two ramification
    divisors generate it, so no curve can shrink it; and the 4-cycle class,
    which is unrealizable over the ordered base, appears at density 1/4.

  claim: >-
    THE STATEMENT. Let p > 3, E over F_p given by y^2 = f(x) = x^3 + A x + B
    with f squarefree. Put e1 = t1 + t2, e2 = t1 t2 and let B_sym = Spec of
    k(e1,e2) be the SYMMETRIC base. Then:
    (S1) S_3(t1,t2,T) has all three of its T-coefficients in k[e1,e2]:
    leading (t1-t2)^2 = e1^2 - 4 e2; middle -2[e1(e2+A) + 2B]; constant
    (e2-A)^2 - 4 B e1. So the m=3 summation cover DESCENDS to B_sym with no
    choice made, and the symmetric base is not an extra construction but the
    base the polynomial already lives over.
    (S2) The natural degree-4 object over B_sym is the fibre
    Phi(e1,e2) = { P in E : x(P) is a root of x^2 - e1 x + e2 }, the four
    points of E over the unordered pair {t1,t2}, carrying the intrinsic block
    system { {P1,-P1}, {P2,-P2} } given by the fibres of the x-map. Its
    Galois closure is k(t1,t2,y1,y2) with y_i^2 = f(t_i), of degree exactly 8
    over k(e1,e2), and
        Gal( k(t1,t2,y1,y2) / k(e1,e2) )  =  (Z/2)^2 semidirect S_2
                                          =  Z/2 wr S_2  =  D_4 (order 8),
    acting on the four points as the FULL stabiliser of the block system in
    S_4. Geometric monodromy = arithmetic monodromy = D_4, for every
    non-singular E and every p > 3.
    (S3) TWO-SIDED, AND UNIFORM IN THE CURVE. Upper bound: the action
    preserves the block system by construction, so the group is contained in
    Z/2 wr S_2. Lower bound WITHOUT any census: the cover is tame (degree 8,
    p odd) over the simply connected base A^2, so its geometric monodromy is
    generated by the inertia at the ramification divisors, and there are
    exactly two of them --
        D_swap = { e1^2 - 4 e2 = 0 }   (t1 = t2), inertia a block swap;
        D_sign = { f(t1) f(t2) = 0 }   (some t_i is a 2-torsion x-coordinate),
                                       inertia a single sign flip sigma_i.
    A sign flip together with any block-swapping reflection generates all of
    D_4 (conjugating sigma_1 by the reflection gives sigma_2). Both inertia
    groups are non-trivial for EVERY non-singular E, because f squarefree
    makes the x-map genuinely ramified over each root of f, and because
    e1^2 - 4 e2 is a non-square in k(e1,e2). HENCE THE EXCEPTIONAL LOCUS FOR
    THE GEOMETRIC-GROUP HALF OF RQ-MONO-001, IN THE WREATH READING AND AT
    m = 3, IS EMPTY -- with an argument, not a census.
    (S4) THE ANSWER IS READING-DEPENDENT, AND BOTH READINGS ARE NOW DECIDED.
    "Full wreath": YES, exactly, uniformly. "Full symmetric": NO -- D_4 has
    index 3 in S_4 and the obstruction is the block system, i.e. the fibres of
    the x-map, which is intrinsic to the object and not a curve accident.
    (S5) A CLASS THAT DOES NOT EXIST OVER THE ORDERED BASE. KN-FIND-a8990a
    Theorem B forces every Frobenius element over the ORDERED base
    (t1,t2) to be one of 1^4 and 2^2 -- an element of order at most 2. Over
    B_sym, the class {tau sigma_1, tau sigma_2} consists of 4-CYCLES on the
    four points and has density 1/4. So symmetrisation is not a relabelling of
    the committed result: it changes which permutations occur.
    (S6) FORCED FROBENIUS RECIPE, hence forced class densities. For
    (e1,e2) in F_p^2 off the excluded strata, with chi the quadratic character
    and c0 = f(t1) f(t2) = disc_T S_3 / 16 (KN-FIND-a8990a's identity, used
    here and not re-derived):
      chi(e1^2-4e2) = +1 : t1,t2 in F_p; Frobenius is
          identity          if chi(f(t1)) = chi(f(t2)) = +1   -> 1^4
          sigma_i           if exactly one is -1              -> 2.1.1
          sigma_1 sigma_2   if both are -1                    -> 2^2
      chi(e1^2-4e2) = -1 : t2 = t1^p in F_{p^2}; Frobenius swaps blocks and
          Frob^2 = identity        iff chi(c0) = +1            -> 2^2
          Frob^2 = sigma_1 sigma_2 iff chi(c0) = -1            -> 4-CYCLE.
    Class densities over uniform (e1,e2): 1/8 (identity), 1/4 ({sigma_i}),
    1/8 (sigma_1 sigma_2), 1/4 (block-swap involutions), 1/4 (4-cycles), each
    exact up to O(1/p) with the exact finite-p count a function of (p, t, Z)
    only (that exactness is the sibling record IDEA-20260830-9761f0's claim,
    not assumed here).
    (S7) WHAT IT DOES NOT BUY, STATED UP FRONT. On the factor-base sublocus
    both t_i are x-coordinates of F_p-rational points, so e1^2-4e2 is a square
    and both chi(f(t_i)) = +1: the Frobenius class is the IDENTITY on all of
    it. The symmetrised statistic is therefore just as constant on the attack
    locus as the ordered one (KN-FIND-a8990a Theorem C), and this record
    claims NO relation-rate content and NO algorithm. Its content is the
    group-theoretic decision the question asks for, delivered by derivation
    plus a categorical check.

  mechanism: >-
    DERIVED HERE; the only imported ingredient is the discriminant identity
    disc_T S_3 = 16 f(t1) f(t2), which is committed in KN-FIND-a8990a and is
    used, not reproved.

    STEP 1 (descent to the symmetric base). Read the coefficients of
    s3_expr in harness/semaev.py: (x1-x2)^2, -2[(x1+x2)(x1 x2 + A) + 2B],
    (x1 x2 - A)^2 - 4B(x1+x2). Each is symmetric, hence a polynomial in
    (e1,e2); substituting gives the three forms displayed in (S1). No
    normalisation or choice is involved.

    STEP 2 (the degree-8 field). k(e1,e2) subset k(t1,t2) is quadratic, Galois
    with group <tau>, tau swapping t1,t2, ramified exactly along
    e1^2 - 4 e2 = 0. Over k(t1,t2), adjoining y1,y2 with y_i^2 = f(t_i) gives
    a (Z/2)^2 extension because f(t1) and f(t2) are non-associate squarefree
    elements of the UFD k[t1,t2] -- this is exactly KN-FIND-a8990a Theorem A
    step (2) and is cited, not redone. tau lifts to the top field by
    y1 <-> y2, so k(t1,t2,y1,y2) is Galois over k(e1,e2) of degree 8 with
    group generated by sigma_1, sigma_2, tau, where tau sigma_1 tau = sigma_2:
    that presentation IS Z/2 wr S_2 = D_4.

    STEP 3 (the top field is the splitting field of an explicit quartic, so
    the object is computable and not just describable). The four points of
    Phi have y-coordinates the roots of
        h(Y) = (Y^2 - f(t1))(Y^2 - f(t2)) = Y^4 - c1 Y^2 + c0,
        c1 = f(t1) + f(t2) = e1^3 - 3 e1 e2 + A e1 + 2B,
        c0 = f(t1) f(t2) = e2^3 + A e2 (e1^2 - 2 e2) + B(e1^3 - 3 e1 e2)
                            + A^2 e2 + A B e1 + B^2,
    both in k[e1,e2] by inspection. The splitting field of h contains
    y1, y2 and therefore contains
        t1 - t2 = (y1^2 - y2^2) / (e1^2 - e2 + A),
    since f(t1) - f(t2) = (t1-t2)(t1^2 + t1 t2 + t2^2 + A) and
    t1^2 + t1 t2 + t2^2 = e1^2 - e2. With t1 + t2 = e1 this recovers t1 and
    t2, so the splitting field is exactly k(t1,t2,y1,y2), of degree 8. Hence
    Gal(h) = D_4 = full wreath, and h is a concrete degree-4 instrument.
    Also disc_Y h = 16 c0 (e1^2 - 4 e2)^2 (e1^2 - e2 + A)^4, which exhibits
    the two ramification divisors of (S3) plus the instrument-only divisor
    { e1^2 - e2 + A = 0 } where h has repeated roots although the four points
    are still distinct -- excluded as a stratum, see confounders.

    STEP 4 (arithmetic = geometric). F_p is algebraically closed in
    F_p(t1,t2); each of the three quadratic steps is ramified over a divisor
    of the base (e1^2 - 4e2 = 0 for tau; f(t_i) = 0 for sigma_i), and a
    constant-field extension is unramified everywhere, so no step introduces
    new constants. Therefore the arithmetic monodromy over F_p equals the
    geometric monodromy over F_p-bar, both D_4, and Chebotarev over F_p is
    licensed to report the geometric group. THIS OBLIGATION IS DISCHARGED
    HERE FOR THIS COVER ONLY; the general obligation is the subject of the
    sibling record IDEA-20260830-8a767e.

    STEP 5 (why inertia settles the exceptional-locus question without a
    census). A census gives a LOWER bound on the realized classes. The
    inertia argument of (S3) gives a lower bound on the group itself that is
    uniform in the curve, and the block system gives a matching upper bound.
    Two exact bounds meeting is a decision; a histogram agreeing with a
    prediction is corroboration. That distinction is the methodological point
    of the record, and the census below is run as a CHECK of a derivation.

