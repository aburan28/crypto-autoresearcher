idea:
  id: IDEA-20260901-f377d2
  question_id: RQ-PAIR-21313f
  goal_id: GOAL-ENDO-001
  added: '2026-09-01'
  title: >-
    THE ONLY WAY THE CM AUTOMORPHISM GROUP TOUCHES THE TRANSFER IS THROUGH
    Hom(E', E), NOT End(E) - the second MOV argument is rational over
    F_{p^{k/g}} on a TWIST of degree g = gcd(k, |Aut(E)|), so on j = 0
    (|Aut| = 6) and j = 1728 (|Aut| = 4) the extension degree of the second
    argument drops by up to 6 while k, the field of the pairing value and the
    target-field DLP are unchanged; when k divides |Aut(E)| the second
    argument is F_p-RATIONAL on the twist and the transfer needs no
    extension-field point at all. This exhibits the exact object that
    supplies the second point which IDEA-20260808-40aab9 (C3) shows End(E)
    cannot, and the exact price it does not reduce.
  class: mechanism

  claim: >-
    Setting: E/F_p ordinary, N odd prime exactly dividing #E(F_p), G = E[nn]
    the rational eigenline of Frobenius pi on E[N] (eigenvalue 1), G2 = E[nnbar]
    the other eigenline (eigenvalue p mod N), k = ord_N(p) >= 2, so that
    E[N] = G + G2 is rational over F_{p^k} and G2 is the classical second
    argument of the Weil/Tate pairing (KN-TECH-032, IDEA-20260808-40aab9 (B)).
    Write mu(E) for the group of roots of unity in End(E), of order
    |Aut(E)| in {2, 4, 6}, and g = gcd(k, |Aut(E)|).

    (T1) THE TWIST THEOREM, elementary. There is a twist E' of E of degree g,
    defined over F_{p^{k/g}}, with an isomorphism psi: E' -> E defined over
    F_{p^k}, such that psi maps E'(F_{p^{k/g}})[N] onto G2 whenever N exactly
    divides #E'(F_{p^{k/g}}). Proof sketch, to be written out at Stage 0: the
    twists of E over F_q = F_{p^{k/g}} by zeta in mu(E) have Frobenius
    zeta . pi^{k/g} (up to the conjugation convention fixed at Stage 0); on
    G2, pi^{k/g} acts as p^{k/g} mod N, an element of exact order g in
    (Z/N)^* because ord_N(p) = k; since g divides N - 1 and mu(E) reduces
    modulo nnbar onto the full group of g-th roots of unity mod N (for
    g in {2, 3, 4, 6}, mu(E) contains primitive g-th roots of unity in O_K
    and reduction mod a degree-one prime is injective on them), there is a
    UNIQUE zeta in mu_g with zeta . p^{k/g} = 1 mod N on G2; the twist by that
    zeta has G2 in its F_q-rational N-torsion. For generic j, mu(E) = {+1, -1}
    and this is the standard quadratic-twist trick for even k; for j = 0 and
    j = 1728 it is the sextic/cubic/quartic twist trick of pairing-friendly
    curve constructions (RECALLED: Hess-Smart-Vercauteren 'The eta pairing
    revisited', Barreto-Naehrig). Nothing here is claimed new; what is
    claimed is its exact role in THIS lane's question.

    (T2) UNIQUENESS AND THE COUNT. Among the |Aut(E)| twists of E over
    F_{p^{k/g}} (counted with E itself), EXACTLY ONE besides E has N dividing
    its order when g = k (the twist over F_p), and the identification of that
    twist is the eigenvalue match zeta = p^{-k/g} mod nnbar. For j = 0 with
    k = 6 the product formula #E(F_{p^6}) = product over zeta in mu_6 of
    #E_zeta(F_p) makes this checkable by six point counts and no pairing.

    (T3) WHAT IT CHANGES AND WHAT IT DOES NOT. Changed: the field of definition
    of the second Miller-loop input, from F_{p^k} to F_{p^{k/g}}, a constant
    factor at most g^2 in the cost of the line evaluations of a step that is
    polynomial anyway. Unchanged: k itself (an isogeny-class invariant,
    IDEA-20260807-b92080); the field F_{p^k} in which the pairing VALUE lives,
    because mu_N is not contained in any proper subfield; the target-field
    DLP, which is IDEA-20260807-5f24d7's three-branch functional and the whole
    cost; the representation wall k . ceil(log2 p) bits per pairing value.
    THEREFORE the CM automorphism group's entire effect on the R7 transfer is
    a factor g in the extension degree of ONE input, never an exponent, never
    the target field.

    (T4) THE ONE-POINT READING, which is the RQ's question. When k divides
    |Aut(E)|, i.e. k in {2, 3, 6} on j = 0 or k in {2, 4} on j = 1728 or k = 2
    generically, the second argument is F_p-rational on the twist: a random
    F_p-point of E' times the cofactor. The transfer then needs ONE point of E
    and ONE point of a DIFFERENT curve over the SAME field. This is not a
    self-pairing (IDEA-20260901-2d3f07 shows none exists) and it is not a
    one-point method (the twist point is an independent second argument);
    it is the sharpest possible form of 'CM supplies the second point' - and
    it exists exactly when k <= 6, where MOV is already classical
    (KN-TECH-032) and the second point was never the obstruction. So the
    'CM supplies the second point' escape of 40aab9 (C3) is closed not by
    non-existence but by irrelevance: the object exists, is named, and
    changes nothing that k does not already decide.

  mechanism: >-
    THE TRACKED OBJECT is the pair (g, q2) where g = gcd(k, |Aut(E)|) and q2
    is the smallest field over which some twist of E has an N-torsion point
    mapping to G2; the claim is q2 = p^{k/g}. It discards the curve, the twist
    equation and the points and retains two integers; it is genuinely lossy
    and is compatible with the operations that act on it (change of twist,
    change of base field), under which it is exactly invariant. Not a change
    of coordinates.

    WHY THIS IS A CLOSURE WITH AN EDGE. 40aab9 (C3) argues that End(E) cannot
    supply a second basis point because every endomorphism acts as a scalar
    on G (H-ENDO-001). That is correct and this record does not disturb it.
    But the RQ asks about CM structure, and CM structure also supplies
    Hom(E', E) for the twists E', which are NOT endomorphisms and DO move
    points between eigenlines across a base change. (T1) says exactly what
    they supply, (T3) says exactly what they do not, and (T4) says the RQ's
    one-point reading is met only in the classical small-k cell. That is the
    docs/inventor-protocol.md section 4 standard: obstruction (k is
    class-invariant and the value field is F_{p^k}), argument (T1-T3), and
    forward guidance (the CM contribution is a constant on a polynomial step;
    the lane's cost content lives entirely in 5f24d7's functional).

    STAGE 0 (zero compute, hard gate). Write (T1) with the conjugation
    convention fixed and check it against the nearby object where it must
    give NOTHING: gcd(k, |Aut(E)|) = 1, e.g. k = 5 or 7 on j = 0, where no
    twist over any proper subfield of F_{p^k} carries G2. An argument that
    finds a helpful twist there has mis-stated the eigenvalue match.

    STAGE 1 (construction, hours). Build toy j = 0 curves with k in
    {2, 3, 6} and j = 1728 curves with k in {2, 4}, by search over (t, v) with
    N | Phi_k(p) and N | p + 1 - t (the same construction
    IDEA-20260807-e7eb5d needs for its positive controls; reuse it). For each,
    list all twists over F_p and their orders by exact point counting.

    STAGE 2 (the test, hours). For each curve: (i) count the twists with
    N | order (prediction: exactly one besides E when g = k); (ii) map an
    N-torsion point of that twist to E over F_{p^k} via psi and verify it lies
    in G2 by checking pi acts on it as p mod N; (iii) compute the reduced
    Tate pairing t(P, psi(P')) with the e7eb5d instrument and verify it is a
    primitive N-th root of unity in F_{p^k} and NOT in any proper subfield;
    (iv) run the MOV transfer end to end and certify [x]P = Q on the curve
    independently of the solver.

    STAGE 3 (nulls and nearby objects). Generic-j curves at k = 3 (no twist
    over F_p can help; second point only over F_{p^3}); j = 0 curves at k = 5
    (g = 1; no twist helps); the quadratic-twist case k = 2 on generic j as
    the known positive.

  novelty_status: unverified

  novelty_screen:
    method: >-
      KB RETRIEVAL WAS UNAVAILABLE THIS SESSION (':memory:', empty index);
      search_knowledge was NOT called. Direct reading 2026-09-01 of the 13
      RQ-PAIR-21313f proposals (full reads of df5984, e7eb5d, 5f24d7, 40aab9;
      claim sections of the rest), H-PAIR-27e16a, H-PAIR-713241,
      KN-TECH-018, KN-TECH-032, DECOMPOSITION.md. Greps over ledger/,
      knowledge/, ideas/ for 'twist', 'sextic', 'quartic twist', 'G2',
      'eta pairing', 'Hess'. No web source was opened for this record;
      Hess-Smart-Vercauteren and Barreto-Naehrig are RECALLED.
    results: >-
      IDEA-20260808-40aab9 (C3) closes the endomorphism route to a second
      point; IDEA-20260807-464ff8 and H-PAIR-27e16a close distortion maps on
      G; H-CRYPTO-a928b6 and IDEA-20260805-cc4c2c mention BN/BLS families
      with k = 12 as instantiation rungs; no record in the lane uses the twist
      isomorphism as the object that supplies the second argument or states
      g = gcd(k, |Aut(E)|) as the exact CM effect. Externally the twist trick
      is standard in pairing-based cryptography (recalled) and is certainly
      known; its role as the answer to THIS lane's 'CM supplies the second
      point' question is what is filed.
    verdict: >-
      UNVERIFIED, and the mathematics is expected to be KNOWN once a source
      is opened; the record's value is placement, not novelty, and its
      priority is set accordingly.

  citations:
    - ref: IDEA-20260808-40aab9
      provenance: internal
      claim: >-
        (B) full N-torsion is F_p-rational iff k = 1 (Balasubramanian-Koblitz,
        recalled there); (C3) CM cannot supply the second basis point through
        End(E) because endomorphisms act as scalars on G.
      verified_by: TASK-20260901-5cf9dd (record read in full 2026-09-01)
    - ref: H-ENDO-001
      provenance: internal
      claim: >-
        Every endomorphism acts on a prime-order subgroup as a scalar.
      verified_by: TASK-20260901-5cf9dd (record read in full 2026-09-01)
    - ref: IDEA-20260807-5f24d7
      provenance: internal
      claim: >-
        The transfer cost is C_pairing + min(NFS family, rho in the image),
        with the representation wall k . ceil(log2 p) bits; this record
        changes only the field of one Miller-loop input inside C_pairing.
      verified_by: TASK-20260901-5cf9dd (record read in full 2026-09-01)
    - ref: KN-TECH-032
      provenance: internal
      claim: >-
        MOV/Frey-Ruck wins exactly when k is small; random ordinary curves
        have large k.
      verified_by: TASK-20260901-5cf9dd (record read 2026-09-01)
    - ref: >-
        Florian Hess, Nigel Smart and Frederik Vercauteren, 'The eta pairing
        revisited', IEEE Trans. Inf. Theory 52 (2006), IACR ePrint 2006/110;
        Paulo Barreto and Michael Naehrig, 'Pairing-friendly elliptic curves
        of prime order', SAC 2005
      provenance: recalled
      claim: >-
        For pairing-friendly curves with j = 0 or j = 1728 and a twist of
        degree d dividing k, the group G2 can be represented on the twist over
        F_{p^{k/d}}; the sextic-twist representation for BN curves. NOT
        opened; a reviewer with retrieval should confirm the exact
        statement and the conjugation convention.
      verified_by: null

  assumptions:
    - >-
      E ordinary, N odd prime exactly dividing #E(F_p), k >= 2, p = 1 mod 3
      for j = 0 and p = 1 mod 4 for j = 1728 so that mu(E) is F_p-rational and
      the twists are the standard ones.
    - >-
      The reduction of mu(E) modulo the degree-one prime nnbar is injective
      and hits the g-th roots of unity mod N; this needs g | N - 1, which
      follows from g | k | N - 1.
    - >-
      Small-k curves must be CONSTRUCTED at toy scale (KN-LIT-086: random
      ones will not have them); the construction is shared with
      IDEA-20260807-e7eb5d and is the main implementation cost.
    - >-
      Toy scale only, p <= 2^32, k <= 6; no transfer to cryptographic size is
      claimed.

  resource_label: >-
    R7 (pairings into F_{p^k}) composed with R3 (End(E) as a ring, here its
    unit group mu(E) and the twist classes it indexes). The record's finding
    is that R3 contributes a constant g to the R7 route's input field and
    nothing to its exponent.
  admissibility: admissible
  admissibility_argument: >-
    Admissible - the twist isomorphism is applied to a point of a DIFFERENT
    curve, not to a point of G, so the H-ENDO-001 filter does not bite, and
    the pairing value lives in a different group so KN-FIND-b7e091 does not
    cover it. The expected finding is that the admissible resource changes
    only a polynomial step.

  proof_search_map:
    bottleneck: >-
      The eigenvalue match zeta . p^{k/g} = 1 mod N on G2, which needs mu(E) to
      contain a primitive g-th root of unity. Remove the extra automorphisms
      and g collapses to gcd(k, 2). That is the exact place CM enters and the
      exact place it stops.
    baseline_embedding:
      parameter_slice: >-
        Generic j, k even: g = 2 and (T1) is the quadratic-twist trick,
        second argument over F_{p^{k/2}}. Generic j, k odd: g = 1 and (T1)
        gives nothing, reproducing 40aab9's second point over F_{p^k}.
      reproduction_check: >-
        Symbolic, plus a frozen fixture: one generic-j toy curve with k = 2 on
        which the quadratic twist over F_p has N | order and its N-torsion
        maps to G2.
    observation_collision:
      observable: >-
        The pair (g, q2).
      distinct_preimage_search: >-
        REQUIRED and expected to succeed: all curves in an isogeny class with
        the same |Aut(E)| share (g, q2), and curves with different j but the
        same |Aut| and k share it too; the observable retains only |Aut| and
        k. That collision is the content: the CM contribution is a function
        of |Aut(E)| and k alone.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold (k, N, p) fixed and vary |Aut(E)| across the three values by
          choosing D_0 in {-3, -4, generic}; the second argument's field
          varies exactly as p^{k/g}.
        predicted_gain: >-
          Isolates the automorphism group's effect from everything else the
          class carries.
    quantifier_order: >-
      (T1): FOR ALL ordinary E/F_p, FOR ALL odd N exactly dividing #E with
      k = ord_N(p) >= 2, THERE EXISTS a twist E' of degree g = gcd(k, |Aut E|)
      over F_{p^{k/g}} and an isomorphism psi over F_{p^k} with
      psi(E'(F_{p^{k/g}})[N]) contained in G2 (equality when N exactly divides
      #E'). NOT CLAIMED: any twist over a smaller field, any change to k, any
      change to the field of the pairing value.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The CM automorphism group reduces the extension degree of the
        second MOV argument by exactly gcd(k, |Aut(E)|) and reduces nothing
        else.' It certifies nothing about the cost of the target-field DLP,
        nothing about curves with k coprime to |Aut(E)|, and nothing about
        ECDLP hardness.
      nearby_object_control: >-
        j = 0 with k = 5 (g = 1): no twist helps and the method must say so;
        and the anomalous or supersingular cases are out of scope by
        construction (k undefined or k = 2 with a distortion map).
    proof_obligations:
      - claim: The twist by zeta has Frobenius zeta . pi^{k/g} on E[N] after base change to F_{p^{k/g}}.
        responsibility: correctness
      - claim: p^{k/g} has exact order g mod N and mu(E) mod nnbar contains all g-th roots of unity.
        responsibility: correctness
      - claim: Exactly one twist besides E carries G2 when g = k.
        responsibility: strictness
      - claim: The generic-j k = 2 fixture reproduces the quadratic-twist trick.
        responsibility: baseline
      - claim: The pairing value is in F_{p^k} and in no proper subfield, so the target-field DLP is unchanged.
        responsibility: scope

  object_first_candidate:
    tracked_object: >-
      The pair (g, q2) = (gcd(k, |Aut(E)|), field of definition of the twist
      carrying G2).
    lossiness: >-
      Lossy - curve, twist equation, points and pairing values discarded; two
      integers retained. Not a change of coordinates.
    propagation: >-
      Exactly invariant under change of twist and under F_p-isogenies of
      degree prime to N (k and |Aut| are class data except that |Aut| = 6 or
      4 occurs only at the special-j vertex; the record tracks the class's
      maximal |Aut|, T4 of DECOMPOSITION.md).
    survival_score: >-
      Survives every operation the lane has; it is a scope label. Dissolves
      when the pairing is replaced by something that is not a pairing into
      F_{p^k}, which is outside R7.

  null_object_control: >-
    NULL-1 (blocking): generic-j curves with k = 3 at the same p - no twist
    over F_p may carry G2, and the second point must be found only over
    F_{p^3}; a pipeline that reports a helpful twist here is mis-identifying
    G2. NULL-2 (blocking): j = 0 curves with k = 5 or 7 (g = 1) - no twist
    over any proper subfield helps. POSITIVE CONTROL (blocking): generic-j
    curves with k = 2 - the quadratic twist over F_p carries G2, the known
    case. DECAY PARAMETER: g itself, over {1, 2, 3, 6}; the field degree of
    the second argument must equal k/g exactly at every g, and a degree that
    does not scale as k/g is an artifact. INSTRUMENT CHECK: the eigenvalue of
    pi on the mapped point computed by direct application of Frobenius must
    be p mod N on 100 percent of mapped points.

  discriminated_from:
    - >-
      IDEA-20260808-40aab9 (C3). That closes End(E) as a source of a second
      basis point. This record names Hom(E', E) for the twists as the source
      that DOES work, states g = gcd(k, |Aut E|) as its exact reach, and
      shows it changes only a polynomial step. Exact delta: the object
      (twist isomorphism), the integer g, and (T3).
    - >-
      IDEA-20260807-464ff8 and H-PAIR-27e16a. Those show no endomorphism is a
      distortion map on G. This record agrees and adds that the twist
      isomorphism is not a distortion map either - it needs a point of E',
      not of G - so the one-point question is untouched.
    - >-
      IDEA-20260807-5f24d7. That prices the transfer; this record adjusts one
      input's field inside C_pairing by a factor g and leaves the functional's
      structure and its binding obstruction unchanged.
    - >-
      IDEA-20260901-2d3f07. That closes self-pairings on G x G by dimension
      count; this record is about G x G2 and is the classical transfer's
      second argument, which 2d3f07 (C4) explicitly hands over to.
    - >-
      IDEA-20260807-e7eb5d. Shares the small-k curve construction and the
      pairing instrument; e7eb5d certifies values, this record tests where
      the second argument is defined.

  predictions:
    - metric: >-
        M1 - on constructed j = 0 curves with k in {2, 3, 6} and j = 1728
        curves with k in {2, 4}, the number of twists over F_p other than E
        with N dividing their order
      direction: different
      minimum_effect: >-
        EXACTLY ONE per curve, on 100 percent of at least 10 curves per
        (j, k) cell. Zero or two refutes (T2) or the twist enumeration.
    - metric: >-
        M2 - fraction of mapped twist N-torsion points on which Frobenius
        acts as p mod N (membership in G2)
      direction: higher
      minimum_effect: 100 percent, no tolerance.
    - metric: >-
        M3 - fraction of pairing values t(P, psi(P')) that are primitive N-th
        roots of unity in F_{p^k} and lie in no proper subfield
      direction: higher
      minimum_effect: >-
        100 percent; a value in a proper subfield would contradict
        mu_N not being in it and indicates a broken final exponentiation.
    - metric: >-
        M4 - on NULL-1 and NULL-2 cells, the number of twists over F_p
        carrying G2
      direction: lower
      minimum_effect: EXACTLY ZERO on every null cell.
    - metric: >-
        M5 - end-to-end MOV recoveries certified on the curve, out of
        positive cells
      direction: higher
      minimum_effect: 100 percent, with the certificate verified independently of the solver.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, hard gate): (T1) written with the convention
      fixed and checked on the g = 1 nearby object. STAGE 1 (hours to a day):
      construct at least 10 toy curves per cell for cells (j = 0, k in
      {2, 3, 6}), (j = 1728, k in {2, 4}), (generic, k = 2), (generic, k = 3),
      (j = 0, k = 5), p in 16-28 bits; enumerate twists and count points.
      STAGE 2 (hours): M1-M3 and M5 on positive cells, M4 on null cells,
      with the e7eb5d instrument and its broken-copy control. THE CHEAPEST
      DECISIVE STEP IS M1: six point counts per j = 0 curve at k = 6 decide
      (T2) with no pairing code at all.
    controls:
      - NULL-1 generic j at k = 3, zero helpful twists (blocking)
      - NULL-2 j = 0 at k = 5, zero helpful twists (blocking)
      - POSITIVE quadratic twist at generic j, k = 2 (blocking)
      - broken-instrument copy of e7eb5d failing M3 (blocking)
      - Frobenius eigenvalue check on every mapped point (instrument)
      - Pollard rho with distinguished points and BSGS on every constructed instance as the mandatory matched baselines, automorphism-discounted rho on the j = 0 and j = 1728 cells (KN-TECH-006, KN-TECH-018, KN-TECH-031)
      - exclusion of anomalous and smooth-N instances per KN-TECH-034
    required_metrics:
      - per curve the list of twists, their orders, and which carry N
      - per mapped point its Frobenius eigenvalue mod N
      - per pairing value its order and the smallest subfield containing it
      - certificate pass or fail per MOV run
      - pass or fail of every control
      - wall-clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. A positive cell with zero or two helpful twists over F_p. (T2) is
      wrong or the twist enumeration is; the record stops.
    - >-
      F2. A mapped twist point on which Frobenius does not act as p mod N.
      The eigenvalue match in (T1) is mis-stated.
    - >-
      F3. A null cell with a helpful twist. (T1) proves too much; the record
      is void.
    - >-
      F4. A pairing value in a proper subfield of F_{p^k} surviving the
      broken-copy control. Instrument failure under AGENTS.md rule 5.
    - >-
      F5. Budget exhaustion on the small-k construction. Infrastructure
      outcome; cells not built are reported as unbuilt.

  confounders:
    - >-
      Conjugation convention. Whether the twist by zeta has Frobenius
      zeta . pi or zeta^{-1} . pi changes WHICH twist is helpful, not whether
      one is; the record must fix the convention at Stage 0 and report the
      matching zeta, not just a count.
    - >-
      Cofactor accidents at toy scale. A second twist can carry N by
      coincidence when N is small; N > 2^8 and the count 'exactly one' being
      required across 10 curves per cell is the defence.
    - >-
      Reading the field-degree drop as a security effect. It is a constant on
      a polynomial step; every summary must carry (T3).

  interpretation_limits:
    - >-
      A closure of one escape by exhibiting the object that fills it and the
      price it leaves untouched; no exponent moves and no curve is affected.
    - >-
      Scoped to ordinary prime-field curves with k >= 2 exactly dividing
      subgroup; nothing about k = 1 (IDEA-20260901-8f7ca2), supersingular
      curves, or composite N.
    - >-
      The mathematics is expected to be known (recalled pairing-friendly
      literature) and the record claims placement, not novelty.
    - >-
      Evidence from any run is capped at claim_tier toy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        No heuristic is load-bearing for (T1)-(T4), which are exact. The only
        distributional statement used is in the construction stage: among
        (t, v) pairs with p = (t^2 + |D_0| v^2) / 4 prime in the toy range
        and N | p + 1 - t, the fraction with N | Phi_k(p) for a fixed
        k in {2, 3, 4, 6} is about phi(k) / N, so a toy curve per cell is found
        after O(N / phi(k)) trials.
      rigorous_support: >-
        The rigorous ingredient is the count of residues of order k mod N
        (exactly phi(k)) and IDEA-20260811-8783a5's window argument; the
        distribution imitated is the uniform residue model for t - 1 mod N.
      validation_plan: >-
        SAMPLE: the number of (t, v) trials per successful construction, per
        cell, at three field sizes. COMPARISON: geometric with mean
        N / phi(k). TAIL CHECK: the longest search per cell against the
        geometric tail. Recorded per cell with seeds. This validates only the
        construction budget, never the theorems.

  target_complexity:
    time_exponent: >-
      NO NEW ALGORITHM AND NO EXPONENT CLAIMED. The transfer remains
      C_pairing + min(L_{p^k}(1/3), 0.886 sqrt(N) field multiplications)
      (IDEA-20260807-5f24d7); this record lowers one term inside C_pairing by
      a factor at most g^2 <= 36 and leaves both DLP branches unchanged.
    memory_exponent: >-
      The representation wall k . ceil(log2 p) bits per pairing value is
      unchanged; the second INPUT costs (k/g) . ceil(log2 p) bits instead of
