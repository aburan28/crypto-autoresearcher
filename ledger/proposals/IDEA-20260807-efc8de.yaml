idea:
  id: IDEA-20260807-efc8de
  question_id: RQ-INSTR-f8faa0
  added: '2026-08-07'
  title: >-
    THE PLANTED-SIGNAL POSITIVE CONTROL, INJECTED INTO THE REAL PIPELINE: three
    planted families -- a synthetic per-class offset that yields a per-functional
    minimum detectable effect, an F_p-isomorphism-orbit family whose within-group
    effect is exactly 1 by construction, and a volcano-level family whose
    within-class effect is real mathematics -- because the campaign's committed
    positive control (RUN-INSTR-p4001-a) plants into a synthetic binomial that
    never touches a curve and validates only one of the three nulls in use
  class: control

  claim: >-
    (A) WHAT THE CAMPAIGN'S POSITIVE CONTROL DOES TODAY.
    harness/run_icinv.py::instrument_control draws n_curves = 40 synthetic
    Bernoulli(rate) count vectors, once with a common rate and once with rates
    spread by +-planted_spread, and asks whether
    harness/exp_icinv.py::binomial_null_verdict says "invariant" on the first and
    "over-dispersed" on the second. RUN-INSTR-p4001-a records
    detects_planted_signal: true, rejects_matched_null: true,
    instrument_passes: true, smallest_detected_spread: 0.02. It is a genuine
    two-directional control and it is blocking, which is right.

    (B) WHAT IT DOES NOT COVER, ENUMERATED.
      (B1) IT NEVER TOUCHES A CURVE. No elliptic curve, no factor base, no sum set,
        no isogeny class is constructed. It validates the arithmetic of a
        chi-square dispersion test, not the pipeline that feeds it. Every step
        between "a curve" and "a count" -- factor_base_fixed_size, lift_x, the sum
        set, _targets -- is unvalidated by it.
      (B2) IT VALIDATES ONE NULL OF THREE. NULL-B (binomial over-dispersion) is
        exercised. NULL-C (the label permutation, harness/exp_icinv.py::
        permutation_null) has NO positive control at all, and neither does
        exact_null_verdict. NULL-C is the null that answers the campaign's actual
        gating question -- "does the isogeny-class grouping carry information" --
        and there is currently no evidence that it can detect a grouping effect it
        ought to detect.
      (B3) ITS PLANTED SIGNAL IS THE WRONG SHAPE FOR THE HYPOTHESIS. The planted
        spread alternates rate by +-spread with the index parity
        (2*((i % 2)) - 1), i.e. it plants a WITHIN-GROUP two-point spread. The L1
        alternative hypothesis is the opposite: a per-CLASS offset making curves in
        one class MORE alike than pooled curves. A control for over-dispersion is
        not a control for grouping information.
      (B4) THE MDE IT REPORTS IS FOR THE SYNTHETIC MODEL, NOT FOR THE FUNCTIONALS.
        smallest_detected_spread = 0.02 is in units of a Bernoulli rate at 400
        trials. The campaign's functionals include a sum-set size, a monomial
        count, a 2-torsion count and a windowed character sum, none of which are
        Bernoulli rates. There is currently no minimum detectable effect for any
        functional the campaign actually measures.

    (C) THE THREE PLANTED FAMILIES, AND WHY EACH IS NEEDED SEPARATELY.

      FAMILY 1 -- SYNTHETIC PER-CLASS OFFSET (calibration; gives the MDE).
        Take the REAL measured vector C(E) over the real pooled classes. Form
        C~(E) = C(E) + delta * g(class(E)), with g a fixed per-class offset drawn
        once from a standard normal and frozen. Push C~ through the IDENTICAL
        analysis -- the same stratified permutation, the same variance components,
        the same estimator. Sweep delta and record the smallest delta at which the
        pipeline rejects at the declared level. That delta*, in the functional's own
        units, is the campaign's minimum detectable effect. It converts every L1
        null result from "no effect" into "no effect above delta*", which is the
        only form docs/claims-and-verification.md permits and the form that
        completion criterion C4 of GOAL-ENDO-001 requires.
        Why it discriminates: it plants an effect of the EXACT shape the alternative
        hypothesis predicts (a class offset), on the REAL noise, through the REAL
        analysis. If the pipeline cannot see delta = 1 sigma of the observed
        within-class spread, the pipeline cannot support a negative and the lane
        must stop.

      FAMILY 2 -- F_p-ISOMORPHISM ORBIT (a planted effect of size exactly 1, free).
        For a fixed curve E = (a,b) and u in F_p^*, the curves (u^4 a, u^6 b) are
        F_p-ISOMORPHIC to E: same class, same j, same N, same everything an
        isogeny-class functional could legitimately depend on. Group the orbit of
        each of several curves as a pseudo-class. Under the hypothesis that C is an
        invariant of the curve, within-pseudo-class variance is EXACTLY ZERO and
        eta^2 = 1: the strongest planted signal available and it costs one
        exponentiation per member.
        THIS CONTROL IS TWO-EDGED AND BOTH EDGES ARE DELIVERABLES.
          If within-orbit variance is zero, the instrument's most extreme positive
          case is confirmed and C is established as an isomorphism invariant.
          If within-orbit variance is NOT zero, then C depends on the Weierstrass
          MODEL and not on the curve, and every L1 within-class number is
          contaminated by a model choice that has nothing to do with isogenies.
        The second is the likely outcome for several committed functionals and can
        be predicted before running: liftable_density over a WINDOW [0,W) depends on
        x-coordinates, and isomorphism acts by x -> u^2 x, which does not preserve
        the window; s3_monomial_support depends on which of a,b vanish, which IS
        isomorphism-invariant; two_torsion_x_count is isomorphism-invariant since
        x^3 + u^4 a x + u^6 b = u^6 f(x/u^2); the exact sum-set size |sums| is
        invariant if the factor base is transported by x -> u^2 x and NOT invariant
        if the factor base is rebuilt by the fixed rule factor_base_fixed_size.
        So this control sorts the campaign's functionals into invariants and
        model-dependent quantities, by measurement, at negligible cost. That sort is
        itself the deliverable.

      FAMILY 3 -- VOLCANO LEVEL (a planted effect that is real mathematics).
        For an ordinary curve, E(F_p) is a module over End(E) and its two-generator
        group structure Z/n1 x Z/n2 is governed by the endomorphism order, i.e. by
        the curve's level in the ell-volcano for ell dividing the conductor f of
        Z[pi]. The order N is class-constant; the STRUCTURE is not. So
        harness/exp_icinv.py::group_structure is a functional with a genuine,
        structurally caused, within-class effect whose cause is nameable in advance.
        NOTE THE DOCSTRING CONFLICT AND THE PREDICTION IT MAKES CHECKABLE:
        group_structure's docstring calls it a "Class-invariant check". This record
        predicts the opposite -- that (n1, n2) varies within a class exactly when
        the class contains curves at different volcano levels, and is constant on
        each level. If the prediction holds, Family 3 is a positive control with a
        known cause AND the natural stratifier for lane L2. If it fails, the
        docstring is right, the prediction is falsified, and that is recorded.
        Why this family is worth having beyond Families 1 and 2: it is the only
        planted signal that is neither synthetic nor a coordinate artifact. An
        instrument that recovers Family 1 and 2 but misses Family 3 is detecting
        arithmetic it was handed and missing arithmetic it had to find.

    (D) THE PASS RULE, DECLARED BEFORE RUNNING. The instrument passes only if it
    (i) recovers Family 2 with within-orbit variance exactly zero for every
    functional it classifies as an invariant, (ii) recovers Family 3's level
    stratification if and only if the level prediction holds, and (iii) reports a
    finite delta* per functional from Family 1. Any functional for which delta*
    exceeds the observed total spread is declared UNUSABLE for a negative result
    and is reported as such rather than dropped.

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    No oracle, no attack, no group-operation advantage. The lane instruments L1's
    R1/R2 functionals and L2's R3/R4 stratification. KN-FIND-b7e091 and H-ENDO-001
    close oracle classes; this record proposes none. Family 3 touches End(E) as a
    ring (R3) only as the CAUSE of a measured variance, never as a resource
    consumed by an algorithm.

  discriminated_from:
    - >-
      harness/run_icinv.py::instrument_control and RUN-INSTR-p4001-a. Same
      obligation, different object: that control plants into a synthetic Bernoulli
      model and tests NULL-B; this plants into the real measured vectors and tests
      NULL-C and the exact-null verdicts as well. The committed control is retained
      and is a prerequisite, not a substitute.
    - >-
      harness/exp_icinv.py::liftable_density, whose docstring names it "the
      campaign's positive control for the variance instrument". It is a positive
      control for OVER-DISPERSION only, and its within-class variance has a
      derivable closed form (see IDEA-20260807-c015f5), so it cannot serve as a
      grouping-information control: it varies within a class and between classes
      for the same character-sum reason.
    - >-
      IDEA-20260807-34754f, which designs the NULL. This designs the POSITIVE
      direction. Neither is sufficient alone: GOAL-ENDO-001 criterion C4 requires
      both directions of the RQ-INSTR-f8faa0 control, and P1 pauses the campaign
      when either fails.

  object_first_candidate:
    tracked_object: >-
      THE MINIMUM DETECTABLE EFFECT delta*(C, design): the smallest per-class offset,
      in the units of functional C, that the campaign's full analysis pipeline
      rejects the null for, at the declared level and the declared sample sizes.
    lossiness: >-
      LOSSY. It forgets the curves, the classes, the measured values and the
      analysis internals, retaining one number per functional per design. What it
      discards is discarded compatibly with the campaign's operations: enlarging a
      class or adding permutation draws changes delta* deterministically and
      monotonically (more data, smaller delta*), while changing the curve labels
      within a class cannot change it at all.
    propagation: >-
      Deterministic in (n_curves, n_classes, within-class variance, B, alpha).
      Propagates as roughly sigma_within * sqrt(2/n) at fixed level and power, so a
      class of 138 curves buys roughly a factor 12 over a single curve. Does NOT
      propagate across functionals or across p.
    survival_score: >-
      Survives change of functional, of p, of class and of null. Dies if the
      analysis pipeline changes after delta* is computed, which is why delta* must
      be recomputed with every pipeline change and stamped with the pipeline's
      commit.

  mechanism: >-
    STEP 1 -- FREEZE THE ANALYSIS. delta* is a property of the pipeline, so the
    pipeline (functional definitions, null, estimator, level) is frozen and its
    commit recorded before any planting.

    STEP 2 -- FAMILY 2 FIRST, BECAUSE IT IS FREE AND IT CAN HALT EVERYTHING. For
    each of K declared base curves and each of M declared u in F_p^*, build
    (u^4 a mod p, u^6 b mod p), verify it is non-singular and has the same trace
    (a cheap independent check via
    harness/isogeny_class.py::trace_of_frobenius), and measure every functional.
    Report within-orbit variance per functional. Classify each functional as
    ISOMORPHISM-INVARIANT (variance exactly 0) or MODEL-DEPENDENT (variance > 0),
    and record the classification as a frozen table. A functional found
    model-dependent may still be measured, but every L1 statement using it must
    carry the model qualifier.

    STEP 3 -- FAMILY 3. Compute the volcano level of every curve in the target
    class. Do NOT use harness/isogeny_class.py::rational_isogeny_count for this
    without first settling IDEA-20260807-a4f5c5's audit of it: as read on
    2026-08-07 that function returns 0 whenever ell does not divide #E(F_p), while
    the existence of an F_p-rational ell-isogeny is governed by whether
    X^2 - tX + p has a root modulo ell, which is a different condition. Use instead
    the conductor decomposition already present as
    harness/isogeny_class.py::fundamental_discriminant, together with
    harness/exp_icinv.py::group_structure, and record the two stratifications and
    whether they agree. Measure whether (n1, n2) is constant on each level.

    STEP 4 -- FAMILY 1 AND THE MDE SWEEP. For each functional, take the real
    measured vector, add delta * g(class), sweep delta over a declared geometric
    grid spanning 1/16 to 4 of the observed within-class standard deviation, and
    for each delta run the full frozen analysis over S independent draws of g.
    Report the detection probability curve and read delta* off at power 0.8.
    Repeat with g drawn to be orthogonal to N across classes, so that the planted
    effect cannot be recovered through the N confound
    (IDEA-20260807-34754f) -- otherwise the MDE would be optimistically biased by
    the very nuisance the null is being blocked against.

    STEP 5 -- REPORT. One table: functional, isomorphism-invariant yes/no, observed
    within-class sd, delta* at power 0.8, delta*/sd, and usable-for-a-negative
    yes/no.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands run 2026-08-07: rg -i "planted signal|planted-signal|positive
      control" over the repository (250+ files matched, dominated by unrelated
      prior work); targeted reads of harness/run_icinv.py::instrument_control and
      ::sensitivity_floor, harness/exp_icinv.py in full, the manifest and metrics of
      RUN-INSTR-p4001-a, and ledger/goals/GOAL-ENDO-001/goal.yaml criteria C4 / P1.
    results: >-
      A planted-signal control EXISTS for this campaign (instrument_control) and a
      sensitivity floor EXISTS (sensitivity_floor, smallest_detected_spread = 0.02
      in RUN-INSTR-p4001-a). Both operate on synthetic Bernoulli vectors. NO record
      in this repository plants a signal into the real measured vectors, plants a
      per-class offset of the shape the L1 alternative predicts, uses the
      F_p-isomorphism orbit as a zero-variance positive control, or proposes the
      volcano level as a structurally-caused within-class positive control. The
      phrase "isomorphism orbit" as a control appears nowhere in ledger/,
      knowledge/, docs/ or analysis/.
    verdict: adaptation
  novelty_status_note: >-
    ADAPTATION. Power analysis and positive controls are standard; what is specific
    here is the three-family construction and, in particular, Family 2, which is
    available only because the object under study has a free transitive twisting
    action that fixes every isogeny-class invariant. No external novelty is claimed.

  null_object_control: >-
    MANDATORY, AND FOR A POSITIVE CONTROL THE NULL IS THE UNPLANTED ARM. Every
    family runs with delta = 0 (Family 1), with M = 1 so the orbit is a singleton
    (Family 2), and with the level labels randomly reassigned while preserving the
    level-size profile (Family 3). The pipeline must NOT fire on any of them at the
    declared level. DECAY PARAMETER: delta itself. The detection probability must
    DECAY to the nominal false-positive rate alpha as delta -> 0, monotonically. A
    detection probability that stays above alpha at delta = 0 means the analysis is
    firing on something other than the planted effect and everything halts. A
    detection probability that does NOT rise toward 1 as delta grows past the
    observed spread means the pipeline is saturated or broken. Both tails of the
    delta sweep are pass/fail gates, not decoration.

  assumptions:
    - >-
      (u^4 a, u^6 b) is F_p-isomorphic to (a,b) for u in F_p^*, via
      (x,y) -> (u^2 x, u^3 y), so it has the same j, the same trace and the same
      group. Elementary; verified in the run by an independent trace recomputation
      rather than assumed.
    - >-
      For an ordinary curve the group structure Z/n1 x Z/n2 is determined by the
      endomorphism order, so it is constant on a volcano level and can differ
      across levels. Stated as a PREDICTION to be tested in Step 3, not as a quoted
      theorem, and in direct conflict with the "Class-invariant check" docstring of
      harness/exp_icinv.py::group_structure. Either outcome is recorded.
    - >-
      The measured within-class distribution is approximately homoscedastic across
      classes, so a single delta* summarises the design. Checked by reporting
      delta* per class as well as pooled.
    - >-
      Toy scale only. Every number produced is toy-tier and none is evidence about
      any curve of cryptographic size.

  proof_search_map:
    not_applicable_reason: >-
      No theorem, bound, reduction or closure argument is proposed. Family 2 rests
      on the elementary twisting action and Family 3 on a standard structural fact
      that this record deliberately demotes to a testable prediction rather than
      relying on. The remaining content is experimental design and power analysis,
      which docs/inventor-protocol.md section 8 does not gate.

  predictions:
    - metric: >-
        within-F_p-isomorphism-orbit variance of each committed functional
      direction: different
      minimum_effect: >-
        Pre-registered per functional: EXACTLY ZERO for two_torsion_x_count and for
        s3_monomial_support; STRICTLY POSITIVE for liftable_density over a window
        [0,W) with W < p and for window_fb_size, because isomorphism acts by
        x -> u^2 x and does not preserve the window; and ZERO for the exact sum-set
        size only if the factor base is transported by x -> u^2 x rather than
        rebuilt by factor_base_fixed_size. Any deviation from this table is either a
        bug or a fact, and either is reportable.
    - metric: >-
        detection probability of the frozen pipeline versus planted per-class offset
        delta, for each functional
      direction: higher
      minimum_effect: >-
        Monotone increasing, reaching 0.8 at some finite delta* and returning to the
        nominal alpha at delta = 0. delta*/sd_within must be reported; a value above
        2 means the design cannot detect an effect the size of its own noise and the
        functional is declared unusable for a negative.
    - metric: >-
        detection of the Family-3 level effect on group structure (n1, n2) by the
        frozen pipeline
      direction: different
      minimum_effect: >-
        Two-branch, pre-registered. If (n1,n2) is constant on each volcano level and
        differs across levels, the pipeline must detect the grouping at p < 0.01;
        failure to detect a mathematically real, exactly-computed, zero-noise
        stratification would be a decisive instrument failure and triggers pause
        condition P1. If instead (n1,n2) is constant across the whole class, the
        prediction of this record is falsified, the group_structure docstring is
        vindicated, and Family 3 is withdrawn as a control.
    - metric: >-
        delta* computed with g orthogonalised against N, versus delta* computed with
        g unconstrained
      direction: higher
      minimum_effect: >-
        The orthogonalised delta* must be the LARGER of the two. If it is smaller,
        the pipeline is recovering the planted effect through the N confound rather
        than through class structure, which independently confirms
        IDEA-20260807-34754f's diagnosis.

  minimal_test:
    design: >-
      STAGE 0 (minutes, and it can halt the lane): Family 2 on the target class of
      RUN-ICINV-p4001-a. K = 8 base curves, M = 6 values of u, every committed
      functional. Produces the invariant/model-dependent table. This is the cheapest
      stage and the one most likely to change what the campaign believes it is
      measuring.
      STAGE 1 (minutes): the delta = 0 and singleton-orbit null arms.
      STAGE 2 (an hour): Family 1's delta sweep, 8 grid points times S = 200 draws
      of g, on the already-measured vectors -- no new curve measurement at all,
      because the planting is additive on the measured values.
      STAGE 3 (hours): Family 3, level assignment plus group_structure on the target
      class. group_structure is O(p) lift_x calls per curve, so this is the
      expensive stage and is deliberately last.
      STAGE 4 (zero compute): the frozen table and the usable/unusable verdict per
      functional.
    controls:
      - delta = 0 arm; must fire at no more than the nominal alpha
      - singleton-orbit arm; variance identically zero by construction, so it tests
        the plumbing rather than the mathematics
      - level labels randomly reassigned with the level-size profile preserved
      - g orthogonalised against N, as the confound-proof MDE
      - RUN-INSTR-p4001-a's synthetic control re-run unchanged, as the regression
        fixture
    required_metrics:
      - within-orbit variance per functional per base curve
      - trace of every orbit member, independently recomputed
      - detection probability versus delta, per functional, with S draws
      - delta* at power 0.8, both raw and orthogonalised, in functional units and
        as a multiple of the within-class sd
      - volcano level and (n1, n2) per curve in the target class
      - the frozen invariant/model-dependent classification table

  falsification_conditions:
    - >-
      Family 2 gives nonzero within-orbit variance for two_torsion_x_count or
      s3_monomial_support. Those are algebraically isomorphism-invariant, so a
      nonzero variance is a bug in the measurement chain and every number from that
      chain is attempted_and_inconclusive until it is found.
    - >-
      The delta = 0 arm fires above alpha. The analysis has a false-positive
      problem and no negative result may be reported from it.
    - >-
      Detection probability does not reach 0.8 for any delta within the swept range
      for a given functional. That functional cannot support a negative result and
      is declared unusable; this is a legitimate and expected outcome for at least
      one functional.
    - >-
      The pipeline fails to detect the Family-3 level stratification when the level
      prediction holds. Decisive instrument failure; triggers P1.
    - >-
      The level prediction itself fails -- (n1,n2) constant across the whole class.
      Family 3 is withdrawn and the group_structure docstring stands. This is a
      falsifier of this record's own claim, not of the instrument.

  confounders:
    - >-
      ADDITIVE PLANTING IS AN ASSUMPTION. Family 1 adds an offset; if a functional's
      class effect would in truth be multiplicative or would change the within-class
      variance rather than the mean, delta* understates the difficulty. Mitigation:
      run a second planting mode that scales rather than shifts, and report both.
    - >-
      REUSING THE MEASURED VECTOR. Family 1 plants on the SAME data the campaign
      will analyse, so delta* and the L1 result are not independent. Mitigation: the
      MDE is reported as a property of the design and is recomputed on a second,
      disjoint class before any negative is published.
    - >-
      ORBIT SIZE AND AUT. The isomorphism orbit of a curve has size (p-1)/|Aut(E)|,
      so j = 0 and j = 1728 curves have smaller orbits. Family 2 must either
      restrict to |Aut| = 2 or report per-|Aut| separately; mixing them silently
      biases the within-orbit variance estimate.
    - >-
      LEVEL ASSIGNMENT IS ITSELF AN INSTRUMENT. If the volcano level is computed by
      a defective routine, Family 3 tests the defect and not the mathematics. That
      is exactly why Step 3 routes around rational_isogeny_count pending
      IDEA-20260807-a4f5c5.
    - >-
      SHARED RANDOMNESS. The S draws of g must be independent of the seed that
      generated the targets and factor bases, or the planted effect can correlate
      with the measurement noise.

  interpretation_limits:
    - >-
      A passed positive control licenses a NEGATIVE result of bounded size. It never
      licenses "no effect", and it never licenses extrapolating delta* to another p,
      another functional or another design.
    - >-
      Toy tier throughout. delta* at p around 2^12 says nothing about detectability
      at cryptographic scale, where a class cannot be enumerated at all.
    - >-
      Family 2's classification is about the FUNCTIONAL, not about the ECDLP. A
      model-dependent functional is not thereby useless; it is thereby a statement
      about the Weierstrass model, which is lane L11's subject and must be labelled
      as such.
    - >-
      Nothing here bears on H-STR-002. No relation matrix, displacement rank or
      phi-invariant factor base is constructed.

  reachability_gate: >-
    NOT APPLICABLE, and stated rather than omitted. No curve is reached by walking;
    Family 2 moves within an F_p-isomorphism class by an explicit algebraic
    substitution of unit cost, and Family 3 only LABELS curves already enumerated.
    T5 is untouched. If Family 3's level effect were ever read as an attack
    direction, T5 would become binding immediately, and this record does not license
    that reading.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. Instrument cost: Family 2 is
      K*M functional evaluations; Family 1 is S*|grid| analysis passes over an
      already-measured vector, with no curve work at all; Family 3 is dominated by
      group_structure at O(p) lift_x calls per curve, i.e. O(p * |class|).
    memory_exponent: >-
      O(|class| * S) floats for the sweep; the dominant term is whatever the
      functional itself needs, unchanged by this proposal.
    best_known: >-
      Attack frontier unchanged: parallel rho at 0.886*sqrt(N) and O(1) memory
      (KN-TECH-001, KN-TECH-006), automorphism-discounted rho on CM curves
      (KN-TECH-018), BSGS at sqrt(N) time and memory. For the INSTRUMENT, the
      incumbent is RUN-INSTR-p4001-a's synthetic control with
      smallest_detected_spread = 0.02 in Bernoulli-rate units at 400 trials.
    hidden_overhead: >-
      Family 3's O(p * |class|) group-structure computation is the real cost and it
      is why Family 3 is staged last. At p = 4001 and a class of 138 curves this is
      about 5.5e5 lift_x calls, which is minutes in Python; at p = 2^16 with a class
      of order 10^3 it is 10^8 and out of budget. That ceiling is disclosed here
      because it bounds how far Family 3 can ever be run.
    tradeoff_note: >-
      The only tradeoff is statistical: S draws buy resolution in the detection
      probability at 1/sqrt(S), and B permutations bound the smallest resolvable
      p-value at 1/(B+1). Both are declared in the contract, not tuned afterwards.

  dominated_by: >-
    AS AN ATTACK: mounts none; dominated on every axis by every row of the
    prime-field frontier -- parallel rho at 0.886*sqrt(N) time with O(1) memory
    (KN-TECH-001, KN-TECH-006), automorphism-discounted rho on CM curves
    (KN-TECH-018), BSGS at sqrt(N) time and sqrt(N) memory. Checked across time,
    memory and data/queries; no axis is contested because no discrete logarithm is
    computed.
    AS AN INSTRUMENT: the incumbent is harness/run_icinv.py::instrument_control plus
    ::sensitivity_floor as exercised by RUN-INSTR-p4001-a. This proposal dominates
    it on COVERAGE (real pipeline instead of synthetic counts; NULL-C and the exact
    nulls instead of NULL-B alone; the correct effect shape) and on
    INTERPRETABILITY (an MDE per functional in that functional's own units). It is
    dominated by the incumbent on COST -- the incumbent runs in 0.011692 seconds
    per RUN-INSTR-p4001-a, this takes hours -- and on MATURITY, since the incumbent
    is committed and this is not.
  sota_delta: >-
    Zero speedup against any attack baseline; no exponent moves in either direction.
    Instrument delta, quantitatively: extends positive-control coverage from 1 of 3
    nulls to 3 of 3; replaces a single synthetic MDE (0.02 in Bernoulli-rate units
    at 400 trials, RUN-INSTR-p4001-a) with one delta* per functional in that
    functional's own units, plus its ratio to the observed within-class sd; adds a
    zero-cost planted effect of size exactly eta^2 = 1 (the isomorphism orbit) that
    the incumbent has no analogue for; and produces a frozen
    invariant/model-dependent classification of the campaign's functionals that
    does not currently exist in any record.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.95 that Family 2 runs and produces the classification table -- it is six lines
    of algebra and a loop. 0.8 that at least one committed functional is found
    model-dependent, since the windowed liftable density almost certainly is.
    0.5 on the Family-3 level prediction, which is the one genuinely uncertain
