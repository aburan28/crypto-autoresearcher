idea:
  id: IDEA-20260815-3f6b4c
  question_id: RQ-ECDSA-87625f
  added: '2026-08-15'
  title: >-
    THE HIDDEN NUMBER PROBLEM LATTICE IS ALWAYS BUILT ONE WAY AND ITS
    CONSTRUCTION IS A FREE PARAMETER: measure how much the attack threshold
    moves across published lattice embeddings at fixed leakage
  class: control

  claim: >-
    HNP attacks embed the signature relations into a lattice, and several
    embeddings exist -- Boneh-Venkatesan, the Kannan-style homogeneous
    variant, and recentred versions. The number of signatures needed at a
    given bias is reported per paper without a common comparison. Measuring
    the threshold across embeddings at fixed leakage isolates how much of
    the published variation is embedding choice rather than leakage.

  mechanism: >-
    Implement the published embeddings. At fixed bias and signature count,
    run each with the same reduction parameters on the same instances and
    record success rate. Sweep signature count to locate each embedding's
    threshold.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'hidden number' , 'lattice embedding', 'Boneh-Venkatesan',
      'Kannan'; read of GOAL-ECDSA-001.
    results: >-
      HNP attacks are well represented; no record compares embeddings at
      fixed leakage on shared instances.
    verdict: >-
      ADAPTATION. The embeddings are published; the contribution is a
      paired comparison isolating embedding choice from leakage.

  object_first_candidate:
    tracked_object: >-
      THE SIGNATURE-COUNT THRESHOLD as a function of lattice embedding, at
      fixed bias.
    lossiness: >-
      Reporting a threshold per paper conflates embedding, reduction
      parameters and instance generation, which this design separates by
      holding the latter two fixed.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while embeddings are implementable and reduction parameters
      can be held fixed across them; embeddings needing different
      reduction settings are reported separately.

  null_object_control: >-
    NULL 1 -- zero bias, where no embedding may succeed at any signature
    count. NULL 2 -- the same embedding run twice on the same instances,
    bounding reduction-induced variance, which is substantial for lattice
    methods and would otherwise be read as an embedding effect.

  discriminated_from:
    - >-
        The lattice-versus-Fourier frontier record in this series, which
        compares attack families; this compares embeddings within the
        lattice family.
    - >-
        The bias-shape record in this series, which varies the leakage;
        this holds leakage fixed and varies the embedding.

  assumptions:
    - >-
        Published embeddings are implementable and comparable under one
        reduction setting.
    - >-
        Reduction-induced variance is small enough relative to embedding
        differences for the comparison to be powered, which NULL 2
        measures directly.

  predictions:
    - metric: >-
        zero-bias null
      direction: different
      minimum_effect: >-
        FORCED: no success at any signature count.
    - metric: >-
        same-embedding repeated-run variance
      direction: different
      minimum_effect: >-
        Establishes the noise floor; embedding differences below it are
        not real.
    - metric: >-
        threshold per embedding at fixed bias
      direction: different
      minimum_effect: >-
        The measurement; a large spread means published thresholds are
        not comparable across papers.

  minimal_test:
    design: >-
      Three embeddings, one bias level, signature counts swept, both
      nulls, shared instances throughout.
    controls:
      - >-
          Zero-bias null.
      - >-
          Same-embedding variance null.
      - >-
          Shared instances and fixed reduction parameters across
          embeddings.
      - >-
          Embeddings needing different reduction settings reported
          separately, not forced into the comparison.
    required_metrics:
      - >-
          Threshold per embedding with interval.
      - >-
          Reduction-induced variance floor.
      - >-
          Success rate per (embedding, signature count).
      - >-
          Artifact manifest with hashes and rebuild receipt.

  falsification_conditions:
    - >-
        The zero-bias null succeeds. Harness broken.
    - >-
        Reduction variance swamps embedding differences. The comparison is
        underpowered and the required instance count must be reported
        instead of a null result.
    - >-
        Thresholds differ materially across embeddings. Published per-
        paper thresholds are not comparable and the campaign's frontier
        work must fix an embedding explicitly.
    - >-
        Thresholds agree. Embedding choice is immaterial, which simplifies
        every downstream comparison.

  confounders:
    - >-
        REDUCTION-PARAMETER COUPLING: an embedding may be favoured by the
        fixed reduction setting, so holding parameters constant is fair
        only if no embedding is disadvantaged by that choice; a
        sensitivity check on one alternative setting is required.
    - >-
        IMPLEMENTATION QUALITY per embedding, where a less carefully
        implemented embedding loses for non-mathematical reasons.

  interpretation_limits:
    - >-
        Compares published embeddings; proposes no new attack.
    - >-
        Leakage model only; no bearing on plain ECDLP.
    - >-
        Scoped to the tested bias level, embeddings and reduction
        settings.

  heuristic_assumptions:
    - id: HEUR-HNP-EMB-1
      statement: >-
        At fixed leakage and fixed reduction parameters, the published
        HNP embeddings have equivalent signature-count thresholds.
      rigorous_support: >-
        Rigorous ingredient: the embeddings encode the same underlying
        system of approximate relations, so they define lattices of the
        same rank containing corresponding short vectors. THE GAP: equal
        rank and a corresponding target vector do not imply equal
        reduction difficulty, since the embeddings differ in basis
        conditioning and in where the target sits relative to the
        Gaussian heuristic -- which is exactly what could move the
        threshold.
      falsification_condition: >-
        Threshold differences across embeddings exceeding the reduction-
        variance floor.
      validation_plan: >-
        SAMPLE: 3 embeddings x >= 30 shared instances x swept signature
        counts. COMPARISON: paired per-instance success against the
        variance floor. TAIL CHECK: instances where embeddings disagree
        most, reported with their basis conditioning. TRANSFER: none
        beyond the tested bias.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is lattice reductions across embeddings and
      signature counts.
    memory_exponent: >-
      Reduction working set, which dominates and grows with signature
      count.
    best_known: >-
      Incumbents are the published HNP attacks and their embeddings,
      compared here on shared instances and not improved.
    hidden_overhead: >-
      Lattice reduction cost varies enormously across instances, so the
      variance floor must be measured before any embedding claim.
    tradeoff_note: >-
      Holding reduction parameters fixed isolates the embedding and risks
      disadvantaging one; the sensitivity check on an alternative setting
      is the mitigation.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As attacks: dominated by the published HNP
    literature. As a controlled embedding comparison: none exists here. Not
    null on any axis.
  sota_delta: >-
    No attack novelty, no exponent. Content delivered: signature-count
    thresholds measured across published HNP embeddings at fixed leakage on
    shared instances, with a reduction-variance floor establishing whether
    observed differences are real.

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.8 that three embeddings are implementable. 0.5 that reduction variance
    is small enough for the comparison to be powered at affordable instance
    counts, which is the binding risk. 0.4 that thresholds differ
    materially, which would mean published thresholds are not cross-
    comparable.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
