idea:
  id: IDEA-20260807-049ed4
  question_id: RQ-TTN-001
  added: '2026-08-07'
  title: Semaev bond tensors were measured to be DRAMATICALLY low rank with an exact closed-form
    law chi(m) = C(2^{m-3}+2, 2), and that structure was only ever gated on lossy truncation --
    cost the EXACT chi(m)-term rank-1 factorization as a construction and evaluation algorithm
    for S_m against the dense composed resultant, and supersede KN-OPEN-007, which states the
    opposite of what was measured
  class: algorithm
  claim: EV-TTN-001 measured exact F_p bond ranks 3, 6, 15 at m = 3, 4, 5 where full rank would
    be 3, 25, 81 -- identical in all 27 cells, field-size independent (beta = 0.000000) -- and
    states plainly that 'the generic-full-rank obstruction named in the candidate does NOT hold
    on the tested range'. EV-TTN-002 confirmed chi(6) = 45 with a CONSTRUCTIVE upper bound (45
    explicit rank-1 terms, extraction self-checked) plus a certified rank-45 minor in 9/9 cells.
    H-TTN-001 was nevertheless rejected_scoped because the gate metric was RECALL UNDER TRUNCATION,
    and over F_p no direction is negligible so chi_needed(recall >= 0.99) = chi_full in every
    cell. THE GATE AND THE STRUCTURE ARE DIFFERENT THINGS. A constructive 45-term rank-1 decomposition
    of a bond whose dense shape is 4913 x 4913 is an EXACT object; whether building and evaluating
    S_m through it beats the dense composed-resultant exponent (~1.979) is a field-operation count
    nobody has taken. Separately, KN-OPEN-007's 'Current state' summarises this program's own
    result as 'bond ranks near full; no sub-exponential chi', which contradicts both evidence
    records and misdirects any reader who consults the open-problem register instead of the evidence.
  mechanism: chi(m) = C(2^{m-3}+2, 2) grows like d^2/2 in the per-variable degree d = 2^{m-2},
    while the dense coefficient array of the composed resultant has (d+1)^m entries. The factored
    representation is therefore exponentially smaller in m BEFORE any evaluation question is asked.
    The open question is whether that survives into (a) the cost of CONSTRUCTING the factorization
    at each m, and (b) the cost of the operations the downstream solver actually performs on S_m
    -- specialisation at factor-base coordinates, and resultant/Groebner input preparation. Both
    are field-operation counts on artifacts EXP-TTN-002 already produced and self-checked.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    corpus_paths_grepped:
    - ledger/proposals
    - ledger/hypotheses
    - knowledge/open-problems
