  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: Groebner solving degree,
      first-fall degree, BKK/mixed volume, factor-base geometry. This record proposes a REPRESENTATION
      and construction cost lever, explicitly not a solving-degree lever, and says so in its title.'
    tracked_object: The chi(m)-term rank-1 (Sylvester-multiset) factorization of the bond tensor
      at each level of the recursive Semaev resultant tree.
    one_step_propagation_rule: 'Contracting one bond composes two factorizations: the term count
      multiplies before reduction, and the reduction back to chi(m+1) terms is the step whose
      cost is the unknown this record measures.'
    newness_score: As mathematics, nil -- the rank law is already committed in EV-TTN-001/002.
      The content is that an exact structure was measured, filed under a rejected hypothesis,
      and never costed.
  lossy_projection_identifiability_audit:
    projection: NONE. This is deliberately a lossless re-representation, and the record is honest
      that this disqualifies it under section 2 of the inventor protocol as a NEW OBJECT.
    what_is_discarded: Nothing. The factorization determines the tensor exactly.
    is_it_only_a_change_of_coordinates: 'YES, and the record says so rather than dressing it otherwise.
      A lossless change of representation cannot create structure and cannot move an exponent
      by itself. Its only possible value is COST: an exponentially smaller exact representation
      of the same object may be cheaper to build and to feed to the solver. That is a legitimate
      engineering claim and it is the only claim made. If the operation count does not improve,
      the record''s answer is negative and the lane closes on a measurement rather than on a truncation
      gate that was never the right question.'
    mirror_failure_check: 'CHECKED. The failure mode would be a cost comparison that cannot come
      out against the factorization. It can: at m = 3 the dense object is tiny and the factorization
      overhead should LOSE, which is a forced value the measurement must reproduce.'
  null_object_control:
    primary_null: A RANDOM tensor of the same shape and the same nominal rank chi(m), factored
      by the same routine. If the construction-plus-evaluation cost is the same as for the genuine
      Semaev bond, the saving is generic low-rank bookkeeping and carries nothing about summation
      polynomials.
    secondary_nulls:
    - 'FORCED-VALUE GATE at m = 3: the dense route MUST win, because the dense object is 3 x 3.
      A measurement that reports the factorization winning at m = 3 is broken.'
    - 'EXACTNESS GATE: the factored S_m must agree with the dense S_m coefficient-for-coefficient
      wherever the dense one is computable, before any timing is reported.'
  assumptions:
  - The 45-term extraction in EXP-TTN-002's ttn2_bond_rank_cert.sage is reusable as a constructive
    routine, not only as a certificate.
  - 'A dense baseline at m = 6 can be obtained or honestly recorded as censored: EV-TTN-002''s
    dense symbolic S_6 probe was censored at 150 s, so there is currently no m = 6 dense reference
    at all.'
  predictions:
  - metric: field operations to construct S_m, factored versus dense
    direction: lower
    minimum_effect: A crossover at some m <= 6 with the factored route below the dense one, reproduced
      at three field sizes.
  - metric: fitted construction-cost exponent against the ~1.979 dense reference
    direction: lower
    minimum_effect: Any fitted exponent below 1.979 that survives the random-tensor null.
  minimal_test:
    design: Count field operations for constructing and evaluating S_5 and S_6 two ways -- dense
      symbolic composed resultant, and the explicit chi(m)-term rank-1 Sylvester-multiset factorization
      already extracted and self-checked in EXP-TTN-002 -- at three prime sizes, with the exactness
      gate run first and the random-tensor null run alongside. Record censored dense cells as
      infrastructure, never as a result (AGENTS.md rule 3).
    controls:
    - random same-shape same-rank tensor (primary null)
    - m = 3 forced-value gate
    - coefficient-level exactness check
    required_metrics:
    - field-operation counts per route per m
    - wall time and peak memory per route
    - fitted exponent with its CI
    - censored cells listed explicitly
  falsification_conditions:
  - 'Factored construction plus evaluation costs at least as much as dense at every m tested:
    the low rank buys nothing exact either, which is the obstruction argument KN-OPEN-007 and
    the closure standard both want, and is a first-class deliverable.'
  - 'The random-tensor null shows the same saving: the effect is generic low-rank bookkeeping.'
  - 'The factored S_m disagrees with the dense S_m anywhere: the extraction is not a construction
    and the record is void until repaired.'
  confounders:
  - Sage/Singular implementation constants can dominate at small m and invert the comparison;
    report operation counts, not only wall time.
  - The downstream solver may not consume S_m in a form the factorization preserves, so a construction
    win can be erased at the interface. Measure the interface cost explicitly.
  - chi(m) is a rank bound over the tested range only; nothing here establishes it for all m.
  interpretation_limits:
  - Toy scale; m <= 6; no cryptographic-scale claim.
  - This is a representation and construction-cost result. It is NOT a Groebner solving-degree
    result and is not by itself an ECDLP exponent claim.
  - EV-TTN-001 and EV-TTN-002 are not disputed. What is disputed is KN-OPEN-007's summary of them
    and the conclusion that the truncation gate exhausted the question.
  heuristic_assumptions:
  - id: HEUR-TTNX-1
    statement: The rank law chi(m) = C(2^{m-3}+2, 2), certified at m <= 6, continues to hold at
      m = 7 and beyond.
    rigorous_support: Certified rank-45 minor at m = 6 in 9/9 cells (EV-TTN-002); no proof for
      general m.
    validation_plan: Extend the certificate one level and report failure as a result.
  target_complexity:
    time_exponent: Construction of S_m only. Dense reference ~1.979 (EV-TTN-002 context); the
      factored exponent is the measured unknown.
    memory_exponent: 'Predicted strictly lower: chi(m) ~ d^2/2 terms against (d+1)^m dense entries.'
    best_known: Dense composed resultant as currently implemented in the harness.
    hidden_overhead: The per-contraction reduction back to chi(m+1) terms, which is exactly what
      is unmeasured.
    tradeoff_note: A construction-stage win does not imply an end-to-end index-calculus win; FINDING-PF-IC-001
      says the linear-algebra stage dominates.
  dominated_by: 'Pollard rho at exponent 1/2 for the underlying ECDLP, trivially, since no attack
    is proposed. Rows checked across time, memory and data/queries before writing: Pollard rho
    (p^{1/2} time, O(1) memory); BSGS (p^{1/2} time, p^{1/2} memory); van Oorschot-Wiener parallel
    rho (p^{1/2}/w); Semaev index calculus as costed in FINDING-PF-IC-001 (total exponent ~2.05
    per target at toy scale, i.e. worse than rho). Queries are 0 on every row.'
  sota_delta: ZERO on every attack axis. The deliverable is a measured construction-cost exponent
    for S_m through an exact factorization, plus a superseding KN-OPEN-007 entry whose 'Current
    state' matches the committed evidence.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 0.99 that the m = 3 forced-value gate fires correctly. 0.55 that the
    factored construction beats dense at m = 6 in field operations -- the representation is exponentially
    smaller, but the reduction step at each contraction is unmeasured and is where such savings
    usually die. 0.15 that the win survives the solver interface. 0.05 that any of this changes
    an end-to-end index-calculus cost, because the standing negative says the linear-algebra stage
    dominates.
