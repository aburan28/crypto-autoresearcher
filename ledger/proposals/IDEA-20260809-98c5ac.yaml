idea:
  id: IDEA-20260809-98c5ac
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    An unproven Paillier modulus is an adversary-chosen group — plant small
    factors and measure how much leaks per session
  class: mechanism
  claim: >-
    If a party's Paillier modulus is not proven well-formed, that party can choose
    it with small prime factors so that ciphertext arithmetic reveals residues of
    the counterparty's secret modulo those factors. The claim is that the
    information extracted per session is quantifiable — roughly the logarithm of
    the planted factor's size — and that total extraction requires a number of
    sessions that follows directly from the curve order, giving a clean predicted
    relationship to test.
  mechanism: >-
    Construct a modulus with planted small factors, run the protocol, and recover
    the counterparty's contribution modulo each factor by testing decryptions
    within the small subgroup; combine across sessions by the Chinese remainder
    theorem until the share is determined.
  why_not_a_renamed_known_approach: >-
    Attacks of this shape against implementations lacking modulus well-formedness
    proofs are published. The contribution here is the QUANTIFIED leak per session
    and the predicted-versus-measured session count, which turns the attack into a
    measurement of what the well-formedness proof buys.
  predictions:
  - observable: bits recovered per session versus planted factor size
    metric: bits per session
    predicted: Approximately the logarithm of the planted factor; a large deviation means the leak mechanism is not the one described.
  - observable: total sessions for full extraction
    metric: predicted from bits-per-session versus measured
    predicted: Measured within a small factor of predicted; a mismatch identifies an additional loss channel worth naming.
  minimal_test: >-
    Sweep planted factor size at toy parameters, measure bits recovered per
    session, run to full extraction at one setting, and emit the share and a
    signature under it as the certificate.
  controls:
  - 'WELL-FORMEDNESS CONTROL: with the modulus proof enabled, the planted modulus must be rejected before any session runs.'
  - 'HONEST-MODULUS CONTROL: with an honest modulus, no bits may be recovered by the same procedure.'
  falsification_conditions:
  - No bits recovered with planted factors.
  - Bits recovered with an honest modulus, indicating the leak comes from elsewhere.
  interpretation_limits: >-
    Against this program's reference implementation with the well-formedness proof
    deliberately disabled, labelled in the title. Self-generated key material only;
    no third-party system examined or named.
  sota_delta: 'No new attack. Delta: a quantified per-session leak and a predicted-versus-measured session count.'
  dominated_by: Externally dominated by the published attacks; downstream of IDEA-20260809-986269.
  estimated_cost: Implementation medium; compute low.
  recommended_priority: high
  novelty_status: known
  novelty_screen: 'Corpus grep: no threshold ECDSA records. WEB NOT CHECKED.'
  source_refs:
  - Published threshold ECDSA attack papers and Paillier well-formedness proofs -- RECALLED, REQUIRED READS.
