idea:
  id: IDEA-20260813-87106b
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SQISIGN-001
  goal_id: GOAL-SQISIGN-001
  title: Non-equivariant conversion-representation canonicalization bias
  class: representation
  claim: >-
    Once the primary scheme specification and genuine simulator are filed, test
    whether a source-defined canonical representative or serialization applied
    after ideal-to-isogeny conversion is non-equivariant with respect to public
    relabellings and thereby makes the real and simulated transcript laws
    distinguishable. This proposal asserts no existing bias.
  mechanism: >-
    A many-representation mathematical object may be reduced to one transcript
    encoding by lexicographic minimization, sign selection, orientation choice,
    or another canonicalization. If that map partitions representation orbits
    differently for secret-conditioned real objects than for simulator objects,
    uniformity before canonicalization need not imply uniformity afterward. The
    causal object is the representation-reduction map, even when conversion
    fibres have equal cardinality and verifier acceptance is unchanged.
  why_not_a_renamed_known_approach: >-
    IDEA-20260813-b6c9b5 concerns multiplicity and tie-breaking among conversion
    preimages. Here the preimage law may be identical and the discrepancy arises
    only when an orbit representative is canonicalized or serialized.
    IDEA-20260807-cc84ad audits an auxiliary published-curve cancellation, not
    representation equivariance. IDEA-20260801-020 is the nearest general
    transcript probe but lacks an orbit action and canonicalization intervention.
  predictions:
    - metric: real-versus-genuine-simulator distance before and after canonicalization
      direction: higher
      minimum_effect: >-
        A preregistered post-map increase that is absent before the map and
        survives public-orbit balancing; no threshold is fixed before source filing.
    - metric: equivariance defect under public representation-group actions
      direction: higher
      minimum_effect: >-
        More failures of C(g.r)=g'.C(r) in the real support than in the genuine
        simulator and orbit-balanced null, under a source-defined comparison.
    - metric: planted non-equivariant canonicalizer detection
      direction: higher
      minimum_effect: >-
        The audit must detect an intentionally secret-indexed representative
        selector of known direction.
  minimal_test:
    design: >-
      Blocked pre-design gate: file the exact primary Round-3 representation,
      equivalence relation, canonicalization or serialization algorithm, signer,
      and genuine simulator. Only after those sources are authoritative may the
      Coordinator authorize a toy orbit-enumeration intervention comparing raw,
      canonicalized, and orbit-randomized transcripts. This record specifies a
      boundary and mandatory controls, not an approved executable experiment.
    controls:
      - Genuine-simulator null using identical public inputs and the exact same canonicalizer.
      - Orbit-randomized null applying a public random representative before canonicalization.
      - Identity-map control that omits canonicalization while preserving the preceding object distribution.
      - Planted positive control with an intentionally secret-indexed non-equivariant selector.
      - Equal-fibre control to exclude conversion multiplicity as the cause.
    required_metrics:
      - Raw-object, orbit-identifier, and canonical-encoding distribution distances.
      - Equivariance-defect counts by public orbit and automorphism class.
      - Real, genuine-simulator, orbit-randomized-null, and planted-control outcomes.
      - Complete time, memory, data, preprocessing, oracle, and verification costs.
  controls:
    - true_simulator_canonicalization_null_mandatory
    - orbit_randomized_same_shape_null
    - planted_non_equivariant_selector_positive_control
    - equal_conversion_fibre_control
  confounders:
    - Mistaking two encodings of one object for distinct transcripts.
    - A simulator that uses a different serializer or sign convention.
    - Conversion-fibre multiplicity upstream of the representation map.
    - Special automorphisms at toy parameters producing exceptional orbit sizes.
    - Timing or implementation leakage outside the transcript distribution.
  falsification_conditions:
    - >-
      After source gating, canonicalization is proven equivariant on the full
      relevant support or exact toy enumeration shows identical orbit-weighted
      real and genuine-simulator laws within the preregistered tolerance.
    - >-
      Any apparent post-map separation is reproduced by the orbit-randomized,
      secret-independent null or disappears after quotienting automorphisms.
    - The planted non-equivariant positive control is not detected.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - No canonicalization step is assumed to exist until verified in primary sources.
    - An internal representation bias is irrelevant if it is erased before the public transcript.
    - A toy encoding effect cannot be extrapolated to production parameters or security.
    - >-
      GOAL-SSI-001 exclusively owns EndRing/OneEnd hard-problem algorithms,
      reductions, and status. This proposal is only about protocol transcript
      representation and cannot change or imply a GOAL-SSI-001 conclusion.
  assumptions:
    - The filed scheme exposes a representation equivalence and a public transcript canonicalizer or serializer.
    - Public orbit actions used by the control preserve the source-defined mathematical object.
    - Real and simulator raw objects can be compared without granting secret information to the simulator.
  heuristic_assumptions:
    - id: H-CANON-1
      statement: >-
        On each tested source-valid toy orbit, the enumerated public action is
        complete and the orbit-randomized control is uniform over distinct
        representations after quotienting stabilizers.
      rigorous_support: >-
        Orbit-stabilizer counting gives exact weights for a fully enumerated
        finite group action; completeness and implementation of that action are
        the assumptions to validate.
      validation_plan: >-
        After source filing, cross-check orbit sizes with stabilizer counts and
        an independent enumerator, compare complete orbit-weighted tails, and
        mark any non-enumerated or production transfer as unvalidated.
  proof_search_map:
    bottleneck: >-
      Identify the exact representation group action and determine whether the
      source-defined canonicalization commutes with its public quotient.
    baseline_embedding:
      parameter_slice: >-
        The smallest source-valid signer and genuine-simulator slice with raw
        objects, equivalence classes, and canonical transcript encodings reproduced.
      reproduction_check: >-
        Verify that raw-to-canonical mapping, sign conventions, byte ordering,
        and rejection semantics match the filed source exactly.
    observation_collision:
      observable: Canonical public transcript encoding and its orbit identifier.
      distinct_preimage_search: >-
        Enumerate distinct raw representations with the same orbit identifier
        and canonical encoding, then search for unequal real and simulator
        weights on those preimages.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Orbit-weighted raw-to-canonical incidence matrix.
        predicted_gain: Isolates bias introduced by the canonicalizer from bias already present in raw objects.
      - transform: stronger_invariant
        proposed_object: Canonical orbit identifier including stabilizer size.
        predicted_gain: Removes exceptional-automorphism multiplicity artifacts.
    quantifier_order: >-
      Fix one canonicalization map and one public orbit action for all tested
      keys and samples; compare one uniform secret-free simulator against all
      real keys. Do not select an orbit action after observing a key-specific bias.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy, source-gated equality or separation statement for a specified
        raw-to-canonical transcript map.
      nearby_object_control: >-
        Replace the canonicalizer with a public orbit-randomized representative
        selector on the same objects; a representation-specific signal should vanish.
    proof_obligations:
      - claim: Reproduce the source representation and canonical encoding exactly.
        responsibility: baseline
      - claim: Establish completeness of the group action and stabilizer accounting.
        responsibility: correctness
      - claim: Show the intervention changes only representation selection, not the underlying object law.
        responsibility: interface
      - claim: Bound every orbit-conditioned comparison and multiple test.
        responsibility: success_probability
      - claim: Charge orbit enumeration, storage, serialization, and verification.
        responsibility: memory
      - claim: Restrict conclusions to the tested representation map and toy slice.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: n/a; representation audit only
    memory_exponent: n/a; representation audit only
    best_known: >-
      KN-TECH-057 matched baseline is van Oorschot-Wiener p^(1/2) over Fp2,
      or conditional p^(1/4) over Fp with its mixing assumption. No encoding
      artifact is compared with an easier baseline.
    hidden_overhead: >-
      Exact orbit and stabilizer enumeration may be exponential at toy scale;
      canonicalization, sampling, and independent equivalence verification are
      fully charged.
    tradeoff_note: >-
      Storing complete orbits reduces repeated canonicalization but increases
      memory and preprocessing. Neither choice changes a hard-problem exponent.
  sota_delta:
    claim: No speedup claimed; exponent delta is 0.
    baseline_time_exponent_fp2: 0.5
    conditional_baseline_time_exponent_fp: 0.25
    proposed_time_exponent_delta: 0.0
    proposed_memory_exponent_delta: 0.0
    pareto_rows:
      time: Adds orbit enumeration and canonicalization interventions.
      memory: May store full orbit-incidence tables.
      data: Requires matched raw and canonical outputs from real and genuine-simulator paths.
      preprocessing: Group-action and stabilizer construction are charged.
      oracle: No secret, EndRing, OneEnd, or hidden canonicalization oracle is allowed.
      verification: Requires independent equivalence, orbit, and serializer checks.
    frontier_check: >-
      Checked all rows against endpoint transcript, conversion-fibre, auxiliary
      curve, mixing, and collision proposals. The representation intervention
      has extra orbit cost but a distinct causal target not supplied by them.
