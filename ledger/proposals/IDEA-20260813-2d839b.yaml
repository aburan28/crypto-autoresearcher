idea:
  id: IDEA-20260813-2d839b
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FNDSA-001
  goal_id: GOAL-FNDSA-001
  title: >-
    Sibling-copula defect probe: a public cross-node interaction statistic for
    sampler errors that preserve every marginal and the full second moment
  class: mechanism
  claim: >-
    On a frozen toy recursive sampler with an exact public coefficient view,
    one can construct a planted sibling-subtree copula that leaves each
    coefficient marginal and all first and second moments unchanged while
    inducing a nonzero bounded interaction score between fixed public sibling
    blocks.  An exact-null sampler must give zero conditional interaction, and
    the planted copula must yield a preregistered effect linear in its bias
    parameter before any candidate recursive sampler is interpreted.  The
    resulting probe would test cross-node dependence modes that marginal GOF,
    covariance anisotropy and BBP eigenvalue detectors are algebraically blind
    to.  No such dependence is claimed to exist in FN-DSA and no standardized
    sampler or signature was examined here.
  mechanism: >-
    For each exact-null public coefficient law choose bounded functions a(x)
    and b(y), fixed by exact Gram-Schmidt orthogonalization against 1, x and
    x^2.  Thus E[a]=E[x a]=E[x^2 a]=0 and similarly for b.  For a public
    sibling pair (X,Y), plant the joint law
    q_delta(x,y)=p(x)p(y)(1+delta a(x)b(y)), with delta restricted so all
    probabilities remain nonnegative.  Summing over y or x preserves both
    marginals exactly; orthogonality preserves cross first/second-moment terms;
    but E_q[a(X)b(Y)] = delta E[a^2]E[b^2] is nonzero.  The same score can be
    measured conditionally on preregistered public message/challenge buckets
    and aggregated across fixed public sibling positions with cross-fitting.
    A real mechanism, if later observed, would be shared rounding, rejection or
    table error inherited by descendants of one recursive node.  That causal
    interpretation is a later hypothesis and must be distinguished from mere
    dependence by trace localization or a precision intervention.
  why_not_a_renamed_known_approach: >-
    IDEA-20260805-637a3b, H-FNDSA-58b464 and IDEA-20260808-e7ba81 track second-
    moment anisotropy or spectral spikes.  The planted family here preserves
    the entire covariance by construction, making those nearest neighbors
    exact negative controls rather than alternate implementations.  IDEA-
    20260805-4a6dc7 tests one-dimensional leaf marginals, also preserved here.
    IDEA-20260801-010 is broad whole-signature GOF without a mechanism-specific
    interaction.  The theta normalizer, exact-null, key-shape, path coupling,
    projection and sequential ideas track different objects.
  predictions:
    - observable: exact-null sibling interaction
      metric: normalized_interaction_mean
      predicted: exactly zero under exact finite enumeration and statistically centered at zero in sampling
    - observable: planted copula ladder
      metric: interaction_effect_by_delta
      predicted: >-
        Linear in delta with exact slope E[a^2]E[b^2] over the entire
        nonnegativity-preserving ladder.
    - observable: marginal and covariance invariance
      metric: marginal_tv_and_second_moment_residual
      predicted: >-
        Exactly zero by rational enumeration for every planted rung; any
        deviation means the positive control no longer isolates higher-order dependence.
    - observable: tree-distance decay
      metric: interaction_by_public_node_separation
      predicted: >-
        A planted shared-parent defect is largest for sibling blocks and exactly
        zero for pairs outside the planted parent, furnishing a localization pattern.
  minimal_test:
    design: >-
      After primary source filing defines a public coefficient representation,
      select an exactly enumerable toy recursive sampler and freeze public
      sibling block pairs, context buckets and bounded orthogonal score
      functions using null data only.  Verify algebraic orthogonality and the
      exact-null first.  Generate a symmetric ladder of copula biases with
      exact rational normalizers, verify marginal/covariance invariance, and
      measure interaction power and tree-distance localization.  Then, only in
      a later approved task, compare exact and named finite-precision recursive
      samplers.  Any candidate effect must be followed by a precision or branch
      intervention before it is described as a sampler mechanism.
    test_boundary:
      instances: exactly enumerable toy recursive sampler and public coefficient map
      parameters: frozen support, sibling pairs, context buckets, score basis and delta ladder
      oracle_model: local sampler outputs and public message/key data only
      preprocessing: exact orthogonal score construction and copula normalization, charged
      stopping_rule: >-
        Stop without candidate interpretation if exact-null centering fails,
        marginal/covariance invariance fails, or the smallest positive-control
        rung misses its preregistered power.
    required_metrics:
      - exact score orthogonality residuals against 1, x and x^2
      - exact nonnegativity margin and normalization for every copula rung
      - marginal total variation and complete first/second-moment residuals
      - interaction mean, variance, power and confidence interval by rung
      - interaction by public tree separation and context bucket
      - time, memory, preprocessing, sample count and multiplicity correction
  controls:
    - name: independent exact sibling draws
      kind: exact_null
      construction: >-
        Exact finite sampler with the frozen public sibling pairing and score
        functions, preserving the identical marginal laws used by treatment.
      forced_value: exact interaction zero in every sufficiently populated frozen context
      gate: >-
        Any exact nonzero value or excess null rejection invalidates all
        candidate dependence claims.
    - name: moment-preserving sibling copula
      kind: biased_positive
      construction: >-
        q_delta=p_X p_Y(1+delta a b) over a frozen symmetric delta ladder,
        using exact rational probabilities and the same public encoder.
      forced_value: >-
        Interaction delta E[a^2]E[b^2], with zero marginal distance and zero
        change to every declared first/second moment.
      gate: >-
        The instrument must recover linearity, sign and preregistered power at
        the smallest rung before a candidate null can bound cross-node dependence.
    - name: covariance and BBP blindness control
      kind: nearby_object_control
      construction: >-
        Apply the frozen covariance-anisotropy and largest-eigenvalue statistics
        to exact-null and copula samples at matched N.
      forced_value: identical population covariance in both arms
      gate: >-
        A stable population-level difference means the planted law failed its
        defining moment-preservation property; finite-sample fluctuations are
        reported only as such.
  confounders:
    - >-
      Public coefficient pairing may not match secret ffLDL sibling ancestry;
      a real shared-node effect can be diluted or cancelled in the public basis.
    - >-
      Scores learned on treatment data manufacture dependence.  Orthogonal
      functions and context bins must be frozen from exact-null enumeration.
    - >-
      Message/challenge mixing can create public dependence unrelated to the
      sampler; exact null uses identical public-input conditioning.
    - >-
      Compression or decoding can alter marginals and interactions; the same
      exact public projection must be applied in every arm.
    - >-
      Multiple sibling pairs and contexts require simultaneous error control;
      reporting the maximum uncorrected score is forbidden.
    - Primary FN-DSA recursion and encoding details remain unverified.
  falsification_conditions:
    - Exact orthogonality against 1, x or x^2 fails beyond rational identity.
    - The planted copula changes any declared marginal, mean, variance or covariance exactly.
    - The exact-null interaction is nonzero or its sampled false-positive gate fails.
    - The planted interaction is not linear in delta with the precomputed slope.
    - >-
      Sibling localization is absent on the planted shared-parent family,
      showing that the public pairing/statistic does not identify the intended mechanism.
  interpretation_limits:
    - No higher-order defect or FN-DSA leakage is observed or claimed.
    - >-
      A nonzero interaction establishes dependence in a declared public score,
      not shared rounding as its cause; intervention or trace localization is required.
    - >-
      Detection is not trapdoor recovery.  A later recovery must include
      certificates, matched baselines, data, memory, preprocessing and verification.
    - >-
      A null result excludes only the frozen score, public pairing, context
      family, effect size and toy parameter slice; other higher-order modes remain open.
    - Timing, fault, private trace and deployed-target channels are excluded.
  assumptions:
    - >-
      A public coefficient representation and deterministic decoder can be
      defined from the eventual primary FN-DSA text without secret information.
    - >-
      The toy exact-null joint law for frozen public sibling blocks is
      enumerable or its tails are rigorously bounded.
    - >-
      Candidate recursive defects can be meaningfully approximated by bounded
      local copula perturbations for calibration, without asserting that they exist.
  heuristic_assumptions:
    - id: HEUR-2D839B-1
      formal_statement: >-
        A shared arithmetic or rejection error at one recursive node retains at
        least ten percent of its planted interaction energy in at least one
        frozen public sibling score after reconstruction and encoding.
      rigorous_support: >-
        Shared latent errors can induce descendant dependence, but the public
        basis may mix secret-tree siblings and no lower bound is proved.
      validation_plan: >-
        Plant a shared node-level perturbation in exact toy recursions with
        known secret/public transforms and compare internal versus public
        interaction energy across dimensions and pairings.
      falsification_condition: maximum public retained energy below ten percent on every frozen planted tree
    - id: HEUR-2D839B-2
      formal_statement: >-
        For the bounded interaction score, calibrated sample complexity scales
        as Theta(delta^-2) over the local copula ladder after simultaneous
        correction across the fixed pair/context family.
      rigorous_support: >-
        Bounded-score concentration supplies an upper bound of this order;
        constants and degeneracy depend on score variance and context rarity.
      validation_plan: >-
        Measure the N required for fixed power on at least five symmetric delta
        rungs and fit the log-log exponent with frozen tolerance.
      falsification_condition: fitted magnitude exponent differs from 2 by more than 0.2
  proof_search_map:
    bottleneck: >-
      Exposing cross-node sampler dependence that is exactly invisible to
      coefficient marginals and all second-moment or spectral instruments.
    baseline_embedding:
      parameter_slice: delta=0 independent exact sibling law with the frozen public projection
      reproduction_check: >-
        Exact rational enumeration gives zero interaction and reproduces every
        null marginal and second moment before sampling.
    observation_collision:
      observable: all coefficient marginals plus the full covariance matrix
      distinct_preimage_search: >-
        The exact null and every nonzero planted copula rung are distinct joint
        laws with precisely the same observable; the interaction score is the
        stronger invariant proposed to split this collision.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: bounded sibling interaction orthogonal to constants, coordinates and squares
        predicted_gain: distinguishes joint laws with identical first and second moments
      - transform: telescoping_potential
        proposed_object: interaction energy indexed by public tree separation and context
        predicted_gain: localizes a shared-parent perturbation instead of reporting an unstructured correlation
      - transform: observable_fiber
        proposed_object: moment fiber containing exact-null and planted copula laws
        predicted_gain: explicit nearby-object counterexample to covariance completeness
    quantifier_order: >-
      For every score, pair and context fixed from exact-null information before
      treatment, test all declared delta rungs with simultaneous error control;
      there must not exist post-treatment pair selection masquerading as a uniform result.
    method_ceiling:
      strongest_certifiable_claim: >-
        Calibrated detection or a scoped upper bound for one finite family of
        public sibling interactions and planted effect shapes.
      nearby_object_control: >-
        A copula perturbation orthogonal to the frozen interaction basis can
        preserve both moments and every measured interaction while remaining a
        different joint law; global distributional exactness is beyond the method.
    proof_obligations:
      - claim: planted law is nonnegative, normalized and preserves declared moments exactly
        responsibility: correctness
      - claim: public score uses no secret frame or private trace
        responsibility: interface
      - claim: simultaneous calibration covers all frozen pairs and contexts
        responsibility: success_probability
      - claim: encoder failures, rare contexts and tail mass are included
        responsibility: scope
      - claim: exact projection and score-construction preprocessing are charged
        responsibility: runtime
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed.  Measuring J frozen pair/context scores on
      N signatures costs O(NJ); calibrated local data complexity targets
      Theta(delta^-2) only for the planted interaction family.
    memory_exponent: O(J) streaming accumulators, plus exact toy tables used in preprocessing
    best_known_baseline: >-
      H-FNDSA-58b464 and IDEA-20260805-637a3b second-moment homotopy,
      IDEA-20260808-e7ba81 BBP spectral detection, and
      IDEA-20260805-4a6dc7 leaf marginals.  The planted control is constructed
      to be invisible to all four baseline objects.
    hidden_overhead_disclosure: >-
      Score orthogonalization, exact copula normalization, public projection,
      context rarity, pair multiplicity, cross-fitting and held-out calibration are charged.
    time_memory_tradeoff: >-
      Track more sibling/context scores to improve mechanism coverage at linear
      time and memory cost, or hash/preregister a smaller family with lower coverage.
    data_queries: N local public sampler outputs per arm; no deployed oracle
    preprocessing: exact null law, orthogonal scores and planted copula tables, fully included
    oracle_model: local public sampler/encoder only
    retry_success_accounting: >-
      No recovery retries.  Per-sample cost times the inverse calibrated effect
      squared describes only planted detection power and is not an FN-DSA attack cost.
  sota_delta: >-
    Quantitative measurement target is sensitivity N=C/delta^2 to a copula
    effect that has exactly zero marginal and covariance delta.  This adds one
    higher-order detection axis while claiming zero improvement in FN-DSA
    attack time, memory or standardized security.
  dominated_by: >-
    n/a (no attack result claimed).  Checked IDEA-20260801-010,
    IDEA-20260805-2bbfb2, IDEA-20260805-4a6dc7,
    IDEA-20260805-637a3b, IDEA-20260808-cb0828,
    IDEA-20260808-e7ba81, H-FNDSA-58b464 and H-FNDSA-6a9cbb over time,
    memory, data, preprocessing and oracle access.  Marginal and spectral tests
    may be cheaper and dominate for defects they can see, but are forced to
    zero population signal on this planted family.  No screened row dominates
    on moment-preserving cross-node interaction detection.  External Pareto status is unverified.
  estimated_cost:
    implementation: medium
    compute: medium
    data: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    0.90 that exact toy copula controls preserve marginals/covariance and yield
    the derived interaction; 0.50 that public tree pairings retain useful
    energy from planted recursive errors; below 0.10 that an actual standardized
    implementation has a reachable effect, which is neither predicted nor tested.
  novelty_status: unverified
  novelty_screen: >-
    Parent-supplied immutable retrieval receipts and current-tree screening
    included marginal GOF, analytic normalizer, width-homotopy covariance,
    BBP, NTRU key shape and exact-null records.  No screened record uses an
    exactly moment-preserving sibling copula control.  The index is stale and
    no primary literature was checked; absence is not novelty evidence.
  discriminated_from: >-
    Exact nearest neighbor IDEA-20260808-e7ba81 uses a spiked-covariance/BBP
    statistic.  The positive control here is algebraically constrained to have
    the same population covariance as the null, so BBP must have no population
    signal; the new carrier is a bounded higher-order sibling interaction.
