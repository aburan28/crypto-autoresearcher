idea:
  id: IDEA-20260816-a451fe
  question_id: RQ-SNFS-005666
  added: '2026-08-16'
  title: 'Since a special-form prime satisfies p equal to f of m, the integer p minus one is the value
    of f minus one at m, so any rational factorization of that polynomial forces algebraic factors
    into p minus one: measure whether the resulting factor-size profile separates the classes'
  class: composition
  claim: '(A) A COMPOSITION OF TWO CONSTRAINTS PRODUCES A THIRD, UNINTENDED ONE. If p = f(m) then
    p - 1 = (f - 1)(m) exactly. Whenever the polynomial f(x) - 1 factors over the rationals as g(x)h(x),
    the integer p - 1 inherits the factorization g(m)h(m), so p - 1 has divisors of predictable size
    whether or not the constructor wanted them. The same holds for p + 1 with f(x) + 1. This is a
    structural consequence of the special form that no choice of coefficients can escape once f -
    1 happens to be reducible, and it is visible from p alone at any size where p - 1 can be partially
    factored. (B) THE MEASURABLE. Define the factor-size profile of p as the sorted vector of log2
    sizes of the prime factors of p - 1 found by a bounded factoring effort, normalised by log2 p.
    The claim is that this profile is a candidate distinguishing statistic with a genuine mechanism
    behind it, rather than a statistic chosen because it happened to separate, and that its power
    is a computable function of the probability that a random degree-d integer polynomial with bounded
    coefficients has f - 1 reducible. (C) THE COST OF HIDING IS THE OTHER HALF. A constructor who
    wants both the special form and a public criterion on p - 1, such as a prime factor of a specified
    size, must satisfy two constraints at once. The measurable quantity is the joint yield: how many
    candidate (f,m) pairs must be tried before one satisfies both, relative to the honest generator''s
    cost for the criterion alone. If the joint yield is much lower, the constructor is pushed into
    a narrower subclass, and a narrower subclass is by definition more detectable. (D) BOTH OUTCOMES
    ARE USEFUL. If reducibility is common in the class, there is a mechanism-backed detector. If it
    is rare, then the cost of hiding is low and the honest deliverable is a measured obstruction:
    a named reason, with a number attached, why this particular avenue leaves the classes indistinguishable.
    (E) WHAT IS NOT CLAIMED. No attack, no factorization of any modulus of interest, no assertion
    that any real prime does or does not carry such structure, and no claim that a distinguishing
    profile at toy sizes says anything about kilobit parameters. Partial factoring of p - 1 is affordable
    only at small sizes and the contract forbids extrapolating the detection rate beyond them.'
  mechanism: 'STAGE ONE, zero compute: enumerate, for small d and H, the fraction of degree-d integer
    polynomials with coefficients bounded by H for which f(x) - 1 is reducible over the rationals,
    using a self-contained rational root and small-degree factor search rather than a computer algebra
    system. This is a pure counting exercise and it predicts the detector''s ceiling before any prime
    exists. STAGE TWO: generate the planted arm from C(d,H) with recorded witnesses, and the honest
    arm as uniform primes of identical length. STAGE THREE: for every prime in both arms, factor p
    - 1 and p + 1 completely at the tested sizes by trial division plus Pollard rho, and record the
    full factor-size profile. STAGE FOUR: score the profiles by a frozen statistic, for example the
    normalised size of the largest prime factor, and compute the separation with the same measure
    used elsewhere in this campaign. STAGE FIVE: run the null comparison, since the largest prime
    factor of p - 1 for a random prime follows a well-studied distribution and the honest arm must
    reproduce it; a deviation on the honest arm means the generator, not the trapdoor, is being measured.
    STAGE SIX: measure the cost of hiding by counting candidates tried per accepted prime when the
    special-form generator is additionally required to produce a prime factor of p - 1 above a declared
    size. The claim is established if the planted arm''s profile separates and the separation is traceable
    to reducible f - 1 instances identified individually; it is refuted if the profiles coincide,
    in which case the measured reducibility fraction from STAGE ONE is the obstruction and is reported
    as a number.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: RQ-SNFS-005666, whose targets include a pre-declared battery of candidate
      distinguishing statistics, and GOAL-SNFS-001. Read docs/inventor-protocol.md section 4 on the
      closure standard, since a negative outcome here must be a named obstruction rather than a count
      of statistics tried. Greps: grep -ril -E ''p-1 smooth|smooth part of p'' ledger/proposals/,
      which returned nothing; grep -ril Dickman over ledger/ and knowledge/; grep -ril -E ''trapdoor|SNFS|special
      number field'' ledger/proposals/; grep -ril -E ''special.form|SNFS'' ledger/hypotheses/, empty.'
    results: No proposal in this repository concerns the factorization structure of p - 1 for any
      class of primes; the targeted grep returned zero files. The Dickman grep returned only superseded
      material under ledger/corrections/, including EXP-SMTH-4403c4 and the IDEA-ISO-7f3e2d.v2 copy,
      none of which concerns prime generation or p - 1. RQ-SNFS-005666 itself records, in its provenance
      block, that the kilobit computation is described as using a prime with a 160-bit prime factor
      of p - 1 in line with DSA parameters, and flags that description as unverified; this proposal
      takes the shape of that public criterion as a design input for the cost-of-hiding measurement
      but relies on no figure from it, and the record says so explicitly.
    verdict: 'UNVERIFIED. Nothing about external literature is asserted. Claimed new relative to this
      repository: the observation that p - 1 = (f - 1)(m) forces algebraic factors whenever f - 1
      is reducible, turned into a mechanism-backed candidate statistic with a pre-computed ceiling
      from the reducibility fraction, plus the joint-yield measurement of the cost of hiding. Assembled
      from known parts: the identity is immediate algebra, the distribution of the largest prime factor
      of a random integer is standard, and the idea that a construction must simultaneously satisfy
      public criteria is stated as a constraint in RQ-SNFS-005666 itself. What is offered is the coupling
      of the two into one measurement with both outcomes pre-declared as useful.'
  object_first_candidate:
    tracked_object: The factor-size profile of p - 1, that is the sorted vector of log2 sizes of its
      prime factors normalised by log2 p, followed alongside the algebraic factorization type of f(x)
      - 1 for the planted arm where the witness is known.
    lossiness: 'Genuinely lossy. The profile discards the identity of every prime factor, keeping
      only sizes; it discards p itself, the witness polynomial and the base entirely. Two primes with
      completely unrelated arithmetic can share a profile, so the fibres are large. The retained sizes
      still propagate because the operation of interest, composing the special form with a public
      criterion on p - 1, acts on sizes directly: a criterion is a statement about the existence of
      a factor of a given size, which is exactly what the profile records. The honest caveat is that
      the profile is blind to which factors are algebraic and which are accidental, and that distinction
      is available only on the planted arm where the witness is known, which is why the mechanism
      check is separate from the statistic.'
    propagation: 'One step of the target operation is m maps to m+1 within the class at fixed f. Then
      p - 1 = (f-1)(m) becomes (f-1)(m+1), so if f - 1 = gh the factorization persists with both factors
      evaluated one step along: g(m+1)h(m+1). The algebraic factor structure is therefore invariant
      along the entire base line, while the sizes of the two factors move smoothly, growing like deg
      g and deg h times log m respectively. This is an unusually strong propagation: the structure
      does not decay with the step at all, which by inventor-protocol section 3 is precisely the pattern
      that should raise suspicion of an artifact, and here it is not an artifact but a consequence
      of the identity, so the section 3 tell must be checked against the null rather than trusted.'
    survival_score: 'The forced factorization survives for every base m along the line, without decay,
      but only for the fraction of polynomials whose f - 1 is reducible; outside that fraction there
      is nothing to survive. The concrete statement is therefore a fraction rather than a distance:
      for degree d and coefficient bound H, the reducibility fraction R(d,H) is the ceiling on the
      detector''s true-positive rate, and it is computed exactly at STAGE ONE by enumeration for small
      (d,H). At d = 2 with H = 4 that enumeration is a few hundred polynomials and R is exact; at
      d = 4 with H = 16 it is about 10^6 polynomials and still exact.'
  null_object_control: 'Uniform random primes of identical bit length, with p - 1 factored by the
    identical routine under the identical budget in the same invocation. The null must reproduce the
    known shape of the largest-prime-factor distribution for random integers, in particular the characteristic
    mass near the top of the range, and it must do so with the same factoring budget as the planted
    arm so that budget truncation cannot masquerade as a class difference. A second null is required
    because of the section 3 tell: the planted arm''s structure does not decay along the base line,
    so the identical along-the-line measurement must be run on the honest arm, where any apparent
    persistence would prove the measurement is picking up the base grid rather than the algebra.'
  discriminated_from:
  - 'The lattice and digit detectors in this batch: those read structure directly out of p through
    a representation of p itself. This reads structure out of p - 1 through the arithmetic of a neighbouring
    integer, and it needs no base grid at all, which is why its cost profile is completely different.'
  - 'The generator-attribution control in this batch: that measures whether a statistic sees the generator.
    This proposes a specific statistic with a derived mechanism and computes its ceiling from an enumeration;
    the two compose, since this statistic would be submitted to that control before use.'
  - 'RQ-RSA-d46f02 structured-prime work: there the campaign supplies known structure and recovers
    a factorization from it. Here nothing is supplied, nothing is recovered, and p - 1 is factored
    only because at toy sizes it is affordable.'
  - 'Pollard p minus one style factoring methods as a topic: those use smoothness of p - 1 to factor
    a modulus. This never factors a modulus and uses the factor-size profile only as a classifier
    input; the shared machinery is a factoring routine, not a shared claim.'
  assumptions:
  - Complete factorization of p - 1 is affordable at the tested sizes, which holds by construction
    since the sizes are chosen so trial division plus Pollard rho terminates.
  - Rational factorization of f - 1 for small degree and bounded coefficients can be decided by a
    self-contained search, which is true for the degrees in scope and is validated against hand-checked
    cases.
  - The largest-prime-factor distribution for the honest arm is a valid null, checked by measurement
    rather than by citing a constant.
  - The joint-yield measurement is a fair proxy for the cost of hiding, which assumes the special-form
    generator is not being handicapped by an inefficient search; the candidate counts are reported
    so this can be judged.
  predictions:
  - metric: reducibility fraction R(d,H) for f - 1 over polynomials with coefficients bounded by H
    direction: different
    minimum_effect: exact enumeration; predicted to be small but nonzero, at least 0.01 for d = 2
      and H = 4, with the exact value being the deliverable
  - metric: separation of the normalised largest-prime-factor statistic, planted against honest arm
    direction: different
    minimum_effect: 'no pre-commitment: the separation is bounded above by R(d,H), which is unknown
      until STAGE ONE runs, so naming a number now would be inventing the answer'
  - metric: joint yield, candidates per accepted prime for the special-form generator under an added
      p - 1 factor-size criterion, relative to the honest generator
    direction: higher
    minimum_effect: at least 2 times more candidates per acceptance
  - metric: persistence of the algebraic factor structure along the base line on the honest arm
    direction: lower
    minimum_effect: no persistence, that is the honest arm must show decay consistent with independent
      random integers
  minimal_test:
    design: 'Two stages, both cheap. First, the zero-compute ceiling: enumerate every degree-2 polynomial
      with coefficients in [-4,4], form f - 1, and test rational reducibility by the quadratic discriminant,
      giving R(2,4) exactly in milliseconds; repeat at degree 3 with coefficients in [-4,4] using
      rational root and quadratic-factor search over about 5^4 polynomials. Second, the measurement:
      generate 500 planted primes at n = 48 with d = 2 and H = 4, and 500 uniform 48-bit primes, factor
      p - 1 completely for all of them by trial division to 10^6 followed by Pollard rho, and compare
      the normalised largest-prime-factor distributions. The discrimination is sharp because the ceiling
      is known first: if R(2,4) is 0.15 then no separation above that fraction can be attributed to
      the mechanism, and any larger apparent separation is evidence of something else, which is itself
      a finding. Total cost is under a minute of pure Python.'
    controls:
    - The uniform-prime honest arm factored under the identical budget in the same invocation.
    - The along-the-base-line persistence control run on the honest arm, testing the section 3 structural
      tell.
    - A witness-stratified control on the planted arm, splitting it by whether f - 1 is actually reducible,
      which must show the separation concentrated entirely in the reducible stratum.
    - A p + 1 control using f + 1, which should behave identically under the same algebra and provides
      an independent replicate of the mechanism.
    - A factoring-budget control at half and double the budget, confirming that neither arm's profile
      is budget-truncated.
    required_metrics:
    - exact reducibility fraction R(d,H) by enumeration
    - normalised factor-size profile per prime, both arms
    - separation of the frozen profile statistic with bootstrap intervals
    - separation within the reducible and irreducible strata of the planted arm
    - joint yield candidates per acceptance for both generators
    - factoring budget consumed per prime and the fraction fully factored
  falsification_conditions:
  - R(d,H) is zero at the tested parameters, so the mechanism has no instances and the statistic has
    no basis; the number is the obstruction and is reported as such.
  - The planted arm separates from the honest arm by more than R(d,H) allows, meaning the separation
    is not the claimed mechanism and the attribution is wrong.
  - The witness-stratified control shows the separation present in the irreducible stratum, refuting
    the mechanism directly.
  - The honest arm shows persistence along the base line, meaning the along-the-line measurement is
    picking up the grid rather than the algebra.
  - The honest arm's largest-prime-factor distribution does not match the expected shape for random
    integers, indicating a generator or budget artifact rather than a class effect.
  - Joint yield is indistinguishable between the two generators, refuting the cost-of-hiding half
    of the claim.
  confounders:
  - Factoring budget truncation biases the profile toward smaller largest factors and could differ
    between arms if their p - 1 values have systematically different sizes of small factors.
  - The special-form generator produces p with f(m) = p, so p - 1 inherits smoothness properties of
    m itself, which is a separate mechanism from reducibility of f - 1 and must be separated in the
    analysis.
  - Bit-length pinning affects the leading coefficient and therefore the reducibility statistics of
    the sampled polynomials.
  - Pollard rho is randomised and its success is size dependent, so a fixed budget does not give equal
    completeness across arms.
  - Requiring a large prime factor of p - 1 in the cost-of-hiding arm changes the accepted p distribution
    in both arms and can create an apparent profile difference that is entirely a selection effect.
  interpretation_limits:
  - The detection ceiling is R(d,H), so even a perfect detector on this mechanism catches only that
    fraction of the class, and the number must be quoted with any detection claim.
  - Complete factorization of p - 1 is affordable only at toy sizes, so the measured detection rate
    does not transfer to any size where it is not, and the contract forbids extrapolating it.
  - A null result is a statement about this mechanism, not about detectability in general, and must
    be recorded as a named obstruction with the measured R rather than as a screening report.
  - Nothing here concerns any real, published or deployed parameter set, and no such statement may
    be derived.
  target_complexity:
    time_exponent: No attack exponent is claimed. The detector requires factoring p - 1, which at
      the tested sizes is trial division to a bound plus Pollard rho at about p^(1/4) expected work
      for the largest cofactor; that cost is the reason the instrument is toy-only and it is reported
      rather than hidden.
    memory_exponent: No attack memory exponent is claimed. Trial division and Pollard rho are constant
      memory beyond the prime list, so the instrument is O(bound) for the small-prime table and O(log
      p) otherwise, a few megabytes.
    best_known: 'The incumbent is the unquantified phrase in RQ-SNFS-005666 and, within this program,
      nothing at all: no record proposes any statistic for this class. This proposal''s own ceiling
      R(d,H) is the honest internal benchmark and it is computed before the measurement, which is
      the only benchmark available here. No external baseline is asserted.'
    hidden_overhead: 'The factoring cost is the hidden overhead and it dominates everything: an instrument
      that requires factoring p - 1 is unusable at exactly the sizes where the question matters, and
      any report of a detection rate must say so in the same breath. A subtler overhead is that the
      cost-of-hiding arm changes the accepted-prime distribution in both arms, so its numbers are
      not comparable to the base arms without the selection correction.'
  dominated_by: n/a for attack claims, none is made. As a detector, dominated on applicability by
    both the lattice and digit detectors in this batch, which need no factoring and therefore run
    at any size, whereas this one is confined to sizes where p - 1 factors; that row was checked directly
    against those two contracts. Not dominated on mechanism, since it is the only candidate statistic
    here with a derived algebraic reason and a pre-computed ceiling. Against simply factoring p -
    1 and reading the answer, there is no competition because that IS the instrument. On memory all
    three are comparable.
  sota_delta: 'No attack; measurement and mechanism contribution only. Quantitatively: the deliverable
    is an exact fraction R(d,H) computed by enumeration, a separation bounded above by it, and a joint-yield
    ratio for the cost of hiding, against a prior state with no statistic and no number. No time,
    memory or data figure improves for any attack, and none is claimed to.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that the identity p - 1 = (f-1)(m) forces algebraic factors whenever
    f - 1 is reducible: about 0.99, since it is algebra and the only risk is in the implementation.
    Part B, that R(d,H) is large enough for the resulting statistic to have usable power, say above
    0.1: about 0.3, because most integer polynomials are irreducible and the constructor is free to
    avoid the reducible ones once aware of this; that freedom is itself the likely obstruction. Part
    C, that the joint-yield measurement shows a material cost of hiding: about 0.45. That any of this
    produces a detector usable above toy sizes: near zero, because the instrument requires factoring
    p - 1, and the contract states that limitation rather than working around it.'
