idea:
  id: IDEA-20260809-5d88bd
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    How much of the machine is the magic state factory? Measure its share and how
    that share moves with the distillation scheme
  class: measurement
  claim: >-
    A large fraction of the physical resources in these estimates is consumed by
    producing the non-Clifford resource states, and the fraction depends on the
    distillation scheme chosen. The claim is that the share is computable from the
    pipeline, that it varies materially across published schemes, and that a
    published total therefore encodes a scheme choice which downstream readers do
    not see.
  mechanism: >-
    Parameterize the factory by scheme, output error target and throughput
    requirement; compute footprint and time; express as a share of the total under
    each scheme; and sweep the algorithm's non-Clifford count to see how the share
    moves with problem size.
  why_not_a_renamed_known_approach: >-
    Factory costing is a developed subfield. Reporting the SHARE — and its
    variation across schemes at fixed algorithm — is a presentational and
    analytical choice that makes the scheme dependence visible where a total
    hides it.
  predictions:
  - observable: factory share of physical qubits under each scheme
    metric: fraction, per scheme
    predicted: Substantial in every scheme and materially different between them; a small share everywhere would mean the choice is not load-bearing, which is equally useful to know.
  - observable: share versus problem size
    metric: fraction versus bit width
    predicted: Roughly stable or slowly varying, since both the factory throughput requirement and the algorithm's gate count grow together; a strong trend would be a notable structural result.
  minimal_test: >-
    Implement at least two distillation schemes in the pipeline, evaluate at two
    problem sizes, and report shares with the scheme parameters declared.
  controls:
  - 'THROUGHPUT-MATCHING CONTROL: schemes are compared at equal output error and throughput, or the comparison measures the operating point rather than the scheme.'
  - 'CONSISTENCY CONTROL: with the scheme and parameters of a published estimate, the computed share must match that estimate''s own reported breakdown where one exists.'
  falsification_conditions:
  - The share cannot be computed without inputs no filed source provides, in which case the record reports the missing inputs.
  - Computed shares contradict a published breakdown, which must be resolved before recording.
  interpretation_limits: >-
    Shares are model outputs under declared assumptions and imply nothing about
    hardware roadmaps.
  sota_delta: 'No feasibility claim. Delta: scheme dependence made visible as a share.'
  dominated_by: Not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for magic state distillation: no records. WEB NOT CHECKED.'
  source_refs:
  - Magic-state distillation cost references -- RECALLED, REQUIRED READS.
