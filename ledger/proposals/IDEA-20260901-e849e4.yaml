  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING. Read every line of the SNFS dedup list
      and the claim blocks of IDEA-20260816-9cfbac and IDEA-20260816-4791a4;
      read GOAL-SNFS-001 in full including next_action; grepped
      ledger/proposals for crossover and CADO-NFS. The crypto-kb MCP server
      was unavailable; web verification limited to the sources above.
    results: >-
      Eleven SNFS-lane proposals exist; ten are detectability records (base
      rate, detector cost, generator attribution, collision audit, bounded-
      box detector, p - 1 factors, selection inflation, SVP-detector ROC,
      digit detector) and one (9cfbac) is the norm-level proxy of the
      advantage. None runs the sieve. The goal's next_action names the
      crossover measurement as the item to start first and no record has
      taken it up. The three-arm design and the finite-degree sigma
      placement are not in any record read.
    verdict: >-
      UNVERIFIED. Measuring where SNFS beats GNFS is routine knowledge among
      practitioners (RECALLED, folklore about crossovers around 100 digits
      for low degrees), and this session found no published measurement of
      it on a single implementation with the degree-mismatch arm separated;
      the honest label is unverified.

  object_first_candidate:
    tracked_object: >-
      THE PER-STAGE RATIO VECTOR (special over general) OF (time, peak
      memory, matrix rows), followed across the size and degree grid, and
      decomposed into a coefficient-size factor and a degree-mismatch factor
      by the third arm. Off-limits as the primary lens: the detectability
      statistics (every other SNFS-lane record), the trapdoor construction,
      and every speedup family; this record proposes no method.
    lossiness: >-
      PASSES. The projection from two full runs to a ratio vector discards
      the relations, the matrices, the polynomials' particulars and the
      machine state, keeping three numbers per stage per cell; lossy by
      orders of magnitude and not a change of coordinates. Compatible with
      the comparison of interest because the crossover is by definition the
      locus where the time ratio crosses one, a function of the ratio alone.
    propagation: >-
      One step is one grid cell. The ratio at the next size is predicted, at
      fixed d, to move monotonically in f(N); the decomposition into the two
      factors is measured per cell so the trend of each is its own curve.
    survival_score: >-
      Survives across the grid the budget reaches; dissolves above the
      largest size run, where the conclusion is a shape and a measured
      slope, not a value.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      Not a proof-oriented proposal; a toy-tier grid measurement whose
      controls are the three arms, the DLP arm and the certificates. The
      asymptotic shape it is read against is IDEA-20260901-d88b5c's and is
      not re-derived here.

  assumptions:
    - >-
      CADO-NFS at a pinned commit accepts a user-supplied polynomial pair for
      both factoring and DLP and runs end to end at 60-105 digits on the
      machine; the 105-digit cells are dropped if they exceed the campaign
      budget, which is a budget outcome and never evidence.
    - >-
      Special composites are formed as cofactors of r^e - s after removing
      factors below 10^9 by trial division and a fixed ECM effort, with the
      special polynomial for r^e - s applied to the cofactor; cells whose
      cofactor is prime or too small are re-drawn under the recorded seed
      policy.
    - >-
      The charging convention is GOAL-RSA-001's as referenced by
      GOAL-SNFS-001, (time, peak memory) per stage with the machine named.

  predictions:
    - metric: >-
        coefficient_size_ratio, relation-collection time of the special arm
        over the same-degree large-coefficient arm, per cell
      direction: lower
      minimum_effect: >-
        Below 0.7 at every cell and monotone decreasing in size at fixed d;
        a ratio at or above 1 anywhere falsifies the coefficient-size effect
        end to end at that cell and contradicts 9cfbac's proxy, which must
        then be reconciled.
    - metric: >-
        degree_mismatch_ratio, relation-collection time of the same-degree
        large-coefficient arm over CADO's optimal-degree general arm, per
        cell
      direction: higher
      minimum_effect: >-
        Above 1 whenever the forced degree exceeds CADO's chosen degree by
        two or more, increasing with the degree gap; near 1 when the degrees
        coincide (the self-consistency check of the third arm).
    - metric: >-
        crossover_size_d8, the size at which the headline ratio (special
        over optimal-general, total time) crosses 1 for d = 8, interpolated
        on the grid
      direction: different
      minimum_effect: >-
        Exists within the grid or above 60 digits; if the d = 8 special arm
        wins already at 60 digits, the predicted degree-mismatch effect is
        smaller than the norm arithmetic suggests and the record says so.
    - metric: >-
        headline_ratio_d5_d6, total time special over optimal-general at 90
        and 105 digits for d = 5 and 6
      direction: lower
      minimum_effect: >-
        At most 0.5; larger means the special sieve's advantage at these
        sizes is smaller than the asymptotic picture and is reported with
        the measured slope.
    - metric: >-
        slope_in_fN, fitted slope of the log coefficient-size ratio against
        f(N) at fixed d
      direction: lower
      minimum_effect: >-
        Negative, with magnitude between 0.2 and 1.0 of the asymptotic
        (c(2) - c(1 + 1/d)); outside that band is a finding about the o(1)
        at these sizes and forbids any extrapolation.
    - metric: >-
        memory_ratio, peak resident memory of the special arm over the
        optimal-general arm in the linear-algebra stage, and the matrix-row
        ratio
      direction: lower
      minimum_effect: >-
        Below 1 at every cell where the special arm wins on time (smaller
        factor base, smaller matrix); a memory ratio above 1 with a time
        ratio below 1 is a tradeoff the crossover must be stated with.
    - metric: >-
        dlp_headline_ratio, total time special-prime over random-prime with
        CADO's DLP pipeline at two sizes
      direction: lower
      minimum_effect: >-
        Same classification (special wins or loses) as the factoring cell at
        the same size and degree, within a factor 1.5 in the ratio; a
        disagreement localises a DLP-specific ingredient (Joux-Lercier
        selection for the random prime, mod-ell linear algebra) and is
        reported.

  minimal_test:
    design: >-
      SIX STEPS. STEP 0 (blocking, zero compute): commit the CADO commit,
      machine description, the (size, degree) grid, the special-form seed
      policy (r in a declared small set, s in a declared range, e determined
      by size and degree), the ECM effort for cofactoring, the parameter
      files for every arm, and the charging convention. STEP 1: generate the
      special composites and the special polynomials, and the special and
      random primes for the DLP arm, with seeds; record the polynomial pairs
      of all three arms per cell. STEP 2: run the three factoring arms per
      cell end to end, collecting per stage (wall and CPU time, peak RSS,
      matrix rows and density, relation counts), with the factorisation
      certificate re-verified by multiplication and primality tests. STEP 3:
      run the DLP arm at 75 and 90 digits, special prime versus random prime,
      certificate re-verified by exponentiation in the subgroup. STEP 4:
      compute the ratio vectors and the two-factor decomposition per cell,
      fit the slopes in f(N), interpolate crossovers. STEP 5: emit the grid
      table with intervals from repetitions, the (time, memory) statement per
      cell, the DLP comparison, and the artifact manifest with a rebuild
      receipt.
    controls:
      - >-
        THIRD ARM, same-degree large-coefficient base-m polynomial, run end
        to end; separates coefficient size from degree mismatch.
      - >-
        SELF-CONSISTENCY, at the cell where CADO's chosen general degree
        equals the forced degree the degree-mismatch ratio must be near 1.
      - >-
        REPETITION, two runs per cell at 60-90 digits, one at 105; intervals
        reported.
      - >-
        CERTIFICATES re-verified independently before any timing is read.
      - >-
        DLP ARM on openly special versus random primes; no hidden trapdoor
        construction anywhere.
      - >-
        PRE-REGISTRATION of the grid, seeds, parameters and the charging
        convention before any run.
    required_metrics:
      - per-cell, per-arm, per-stage (time, peak RSS) with matrix rows and density
      - coefficient-size and degree-mismatch ratios with intervals
      - headline ratios and interpolated crossovers per degree
      - slopes in f(N) per degree
      - DLP ratios at two sizes
      - polynomial pairs per arm per cell, seeds, commit, machine, certificates, rebuild receipt

  falsification_conditions:
    - >-
      Coefficient-size ratio at or above 1 at any cell. The end-to-end
      advantage of small coefficients fails there, contradicting the norm
      proxy; the record reconciles by measuring the norm histogram of that
      cell's polynomials with 9cfbac's instrument and reports which is wrong.
    - >-
      No crossover for d = 8 in the grid and none implied by the trend. The
      degree-mismatch effect is weaker than predicted at these sizes;
      reported with the measured degree-mismatch ratios.
    - >-
      Slope in f(N) positive or zero for any d. The trend prediction of the
      slice is contradicted at toy sizes; the o(1) dominates and the record
      says no extrapolation is licensed.
    - >-
      DLP classification disagrees with factoring at the same size and
      degree by more than the stated factor. A DLP-specific ingredient is
      localised and reported; the crossover for DLP is stated separately.
    - >-
      Runs that exceed the budget or crash. Budget outcome, cell marked
      missing, never evidence (AGENTS.md rule 3).

  confounders:
    - >-
      CADO'S PARAMETER FILES ARE TUNED FOR GENERAL INPUTS; the special arm
      may run under sub-optimal factor-base bounds. MITIGATION: a small
      parameter sweep on the special arm at one cell to bound the tuning
      effect, reported; the ratio is otherwise read at CADO's own defaults
      and labelled as such.
    - >-
      SPECIAL-FORM COFACTORS have no small factors by construction and
      random semiprimes for the general comparison are balanced; the general
      arm here is run ON THE SAME N, so this is not a confounder for the
      ratio, only for comparisons with other records.
    - >-
      THE SPECIAL POLYNOMIAL'S ROOT PROPERTY differs from the general one's
      (x^d - c has structured alpha). MITIGATION: alphas recorded for every
      polynomial and the coefficient-size ratio reported alongside the alpha
      difference, per IDEA-20260901-e51076's accounting.
    - >-
      MACHINE NOISE. MITIGATION: pinned cores, repetitions, interleaved
      runs across arms.
    - >-
      SIZE OF THE COFACTOR versus the size of r^e - s. The special
      polynomial's norms are set by r^e - s, not by the cofactor; the
      general arm sees the cofactor. MITIGATION: cells are chosen with the
      cofactor within 5 per cent of the full size, and the actual sizes are
      recorded per cell.

  interpretation_limits:
    - >-
      CLAIM TIER of RQ-SNFS-005666, a measured crossover scoped to CADO-NFS
      at a named commit, one machine, the grid run, the charging convention
      stated. No kilobit computation, no extrapolation to kilobit sizes as a
      claim; the slope is reported so a conditional projection can be
      labelled as one.
    - >-
      NOTHING HERE CONCERNS DETECTABILITY. The record does not touch the
      statistic battery, its freeze order, or any trapdoored class; it
      measures only where the special sieve pays, which is what makes the
      detectability question consequential or not at these sizes.
    - >-
      NO RECORD PRODUCED HERE MAY ALLEGE THAT ANY REAL, PUBLISHED OR DEPLOYED
      PARAMETER SET IS TRAPDOORED OR ATTRIBUTE INTENT TO ANY PARTY; the
      special primes used are openly constructed by this program and are
      not models of anyone's parameters.
    - >-
      The asymptotic shape is IDEA-20260901-d88b5c's conditional slice; a
      toy slope agreeing with it is consistency, not confirmation.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FINITE-DEGREE SPECIAL SIEVE PLACEMENT. For N dividing r^e - s with
        the special pair (x^d - s r^j, x - r^k), the norm-size exponent is
        sigma = 1 + 1/d + O(log(s r^j) / log N), and the relation-collection
        effort ratio between the general sieve at its optimal degree and the
        special sieve at forced degree d has logarithm (c(2) - c(1 + 1/d))
        f(N) plus a degree-mismatch term that is negative and shrinks
        relative to f(N) as N grows.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the norm-size arithmetic is exact (coefficient
        bounds and m = N^(1/d) up to the small factor). CLASSICAL STATEMENT
        IMITATED: the L[1/3] balance under Canfield-Erdos-Pomerance
        smoothness, as in H-RSA-68884a and IDEA-20260901-d88b5c. THE GAP:
        at 60-105 digits the o(1) is not small (Le Gluher-Spaenlehauer-Thome,
        retrieved abstract), so only the sign and monotonicity are relied
        on.
      falsification_condition: >-
        A non-negative fitted slope in f(N) for the coefficient-size ratio
        at any d, or a coefficient-size ratio at or above 1 at any cell.
      validation_plan: >-
        SAMPLE: the 16-cell grid with repetitions and the third arm.
        SHORTCUT: none; the runs are the measurement. COMPARISON: fitted
        slopes against the asymptotic difference c(2) - c(1 + 1/d) as a
        band, not a value. TAIL CHECK: the largest-size cell at each d
        against the trend fitted on the smaller cells (held out). RECORDED
        PARAMETERS: r, s, e, d, cofactor size, polynomial pairs, CADO
        parameters, machine.
    - id: H2
      statement: >-
        FACTORING-DLP TRANSFER OF THE CROSSOVER. The special-versus-general
        classification at a given size and degree is the same for the DLP
        pipeline as for factoring up to a bounded factor, because the two
        share the sieving ingredient and differ in polynomial selection for
        the RANDOM prime (Joux-Lercier) and in the linear-algebra ring.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the shared code path (same sieve, same
        filtering). CLASSICAL STATEMENT IMITATED: the 240-digit experiment's
        finding that DLP is 'not much harder' than factoring at the same
        size (retrieved abstract). THE GAP: the DLP balance shifts effort
        toward sieving because mod-ell linear algebra is dearer, which can
        move the crossover; the factor 1.5 band is the declared tolerance.
      falsification_condition: >-
        DLP and factoring classifications disagree beyond the band at the
        same cell.
      validation_plan: >-
        SAMPLE: two DLP cells. COMPARISON: DLP ratio against the factoring
        ratio at the same (size, degree). TAIL CHECK: the larger DLP cell
        against the factoring trend. RECORDED PARAMETERS: as above plus the
        subgroup order and the random prime's Joux-Lercier pair.

  target_complexity:
    time_exponent: >-
      NO EXPONENT OR CONSTANT IS CLAIMED OR MOVED. The general sieve stays at
      L[1/3, (64/9)^(1/3)] and the special sieve at L[1/3, (32/9)^(1/3)] with
      the finite-degree placement sigma = 1 + 1/d inside the o(1). The record
      is the measurement GOAL-SNFS-001 names as its first parallel action and
      is a building block for the goal's detectability deliverable, which is
      consequential only where the special sieve pays.
    memory_exponent: >-
      Unchanged; measured per stage and reported beside time, as the goal
      requires.
    best_known: >-
      Record-scale special-sieve computations, KN-LIT-2090 (factoring) and
      KN-LIT-2089 (DLP), abstracts in the corpus; general-sieve records per
      Boudot et al. 2020 (relayed). No published single-implementation
      crossover grid is known to this session (RECALLED absence).
    hidden_overhead: >-
      DISCLOSED. Everything measured lives inside the o(1) at these sizes;
      the shape is the deliverable and no value is extrapolated.
    tradeoff_note: >-
      Each cell reports (time, peak memory) per stage; the special arm's
      smaller matrix is a memory advantage reported alongside its time
      advantage or disadvantage, so the crossover is stated in both
      coordinates.

  dominated_by: >-
    CHECKED, n/a (no result claimed). No attack point. As a measurement it
    is nearest to IDEA-20260816-9cfbac's norm proxy, which it supersedes in
    kind (end to end) and depends on (the null); it is not dominated by any
    record in this ledger and the record-scale computations in the corpus
    are single points, not grids.
  sota_delta: >-
    +0 on every attack axis. What moves, quantitatively: GOAL-SNFS-001's
    third completion criterion goes from unaddressed to instantiated with a
    16-cell grid, and the program's crossover knowledge goes from a recalled
    folklore figure to a measured curve with a decomposition into two named
    effects.

  discriminated_from:
    - >-
      IDEA-20260816-9cfbac computes the advantage as a norm-bit histogram
      shift without any sieve and forbids reporting it as a time; this
      record runs the sieve and reports times and memory, using 9cfbac's
      null as its third arm.
    - >-
      IDEA-20260816-4791a4, IDEA-20260816-938a96, IDEA-20260816-dd425d,
      IDEA-20260816-ddc377, IDEA-20260816-046ca8, IDEA-20260816-76d133,
      IDEA-20260816-b7a34b, IDEA-20260816-7c9222 and IDEA-20260816-a451fe are
      detectability or base-rate records; this record does not touch
      detection.
    - >-
      IDEA-20260901-dedcea (this session) runs factoring against DLP on
      GENERAL inputs; this record runs special against general on the same
      input, with a DLP arm as a control.
    - >-
      IDEA-20260901-d88b5c (this session) supplies the asymptotic shape; this
      record measures the practical curve and does not re-derive the slice.

  estimated_cost:
    implementation: medium
    compute: medium

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that the coefficient-size ratio is below 0.7 at every cell (the
    small-coefficient advantage is robust). 0.7 that a d = 8 crossover
    appears in the grid. 0.6 that the d = 5 and 6 headline ratios reach 0.5
    by 90 digits under CADO's general-tuned parameters. 0.65 that the DLP
    cells agree with factoring within the band. 0.5 that the 105-digit cells
    complete within budget.

