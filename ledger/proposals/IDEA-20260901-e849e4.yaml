idea:
  id: IDEA-20260901-e849e4
  question_id: RQ-SNFS-005666
  research_question: RQ-SNFS-005666
  goal_id: GOAL-SNFS-001
  added: '2026-09-01'
  title: >-
    MEASURE THE CROSSOVER THE GOAL SAYS TO START WITH, WITH THE SLICE THAT
    PREDICTS ITS SHAPE. End-to-end special-versus-general number field sieve
    on one implementation and one machine over a declared grid of sizes (60
    to 105 digits) and special-polynomial degrees (4, 5, 6, 8), in three arms
    per cell -- the special polynomial, the implementation's own general
    polynomial, and a same-degree large-coefficient null that separates the
    coefficient-size effect from the degree effect -- with memory beside time
    per stage, a matched prime-field DLP arm on openly special primes, and
    the sigma-slice prediction that the finite-degree special sieve sits at
    sigma = 1 + 1/d against the general sieve's 2, so that the measured ratio's
    trend in size and the location of the crossover for each forced degree are
    read against a stated shape rather than a quoted constant
  class: measurement

  claim: >-
    FOUR SEPARABLE CLAIMS. (A) THE DELIVERABLE THE GOAL NAMES. GOAL-SNFS-001's
    third completion criterion is a measured SNFS-versus-GNFS crossover on
    one implementation and one machine across a declared size and degree
    grid with memory beside time; its next_action says to start it in
    parallel because it needs no trapdoor construction and decides whether
    the detectability question is consequential at reachable sizes. No
    proposal instantiates it. This record does, on CADO-NFS, on composites
    N dividing r^e - s with small r and s (special polynomial x^d - s r^j at
    m = r^k where e = d k - j) at sizes 60, 75, 90, 105 digits and forced
    special degrees 4, 5, 6, 8, and on the general polynomial CADO selects
    for the same N. (B) THE THIRD ARM. A special polynomial differs from a
    general one in TWO ways at once, its coefficients are tiny and its
    degree is forced by the input rather than optimised for the size; a
    ratio between the first two arms confounds them. The third arm runs a
    base-m polynomial of the SAME degree as the special one with
    coefficients of the general size N^(1/(d+1)), following the null of
    IDEA-20260816-9cfbac, end to end; so (special / same-degree-general) is
    the coefficient-size effect and (same-degree-general / optimal-general)
    is the degree-mismatch effect, and their product is the headline ratio.
    (C) THE SHAPE PREDICTED BEFORE THE RUN. By IDEA-20260901-d88b5c's slice,
    the general sieve sits at sigma = 2 and the finite-degree special sieve
    at sigma = 1 + 1/d (coefficient product about s r^j times m = N^(1/d)
    over total degree d + 1), so the asymptotic ratio of sieving efforts has
    logarithm (c(2) - c(1 + 1/d)) f(N) (1 + o(1)) with f(N) = (ln N)^(1/3)
    (ln ln N)^(2/3) and c(sigma) = (32 sigma / 9)^(1/3); at toy sizes the
    o(1) is large and the PREDICTION IS THE SHAPE ONLY: the log-ratio of the
    coefficient-size arm is monotone increasing in f(N) at fixed d, and the
    degree-mismatch arm's log-ratio is negative and growing in magnitude as d
    departs from CADO's optimal degree at that size, so a crossover -- the
    size below which the forced degree costs more than the small coefficients
    save -- exists in the grid for d = 8 and is predicted to sit above 60
    digits, while d = 5 and 6 are predicted to beat the general sieve at
    every size from 75 digits up by at least a factor 2 in relation-
    collection time. Numbers are illustrative from norm-size arithmetic and
    are NOT the claim; the trend and the existence of a crossover for the
    highest degree are. (D) THE DLP ARM AND WHAT IS NOT CLAIMED. The
    hidden-SNFS result (KN-LIT-2089, abstract) is a discrete-logarithm
    result, so the crossover that matters for GOAL-SNFS-001 is the DLP one;
    the record runs openly special primes p = r^e - s against random primes
    of the same size with CADO's DLP pipeline at two of the sizes. NO
    trapdoor construction is used, reimplemented or approximated -- the
    goal's pause condition forbids reconstructing it from memory and this
    record does not need it: an openly special prime is a different object
    from a hidden one and is used only to measure where the special sieve
    pays. NO record is attempted, NO statistic battery is touched (the freeze
    order belongs to the detectability lane), and NOTHING here is a statement
    about any real, published or deployed parameter set.

  mechanism: >-
    The special polynomial's norm on the algebraic side is A^d times a tiny
    coefficient bound, against A^d times N^(1/(d+1)) for a general
    polynomial of the same degree, so at matched degree the special arm's
    norm product is smaller by N^(1/(d+1) - epsilon) and its smoothness
    probability larger by the corresponding Dickman ratio -- the effect
    IDEA-20260816-9cfbac computes as a histogram shift. But the general sieve
    is not run at the special degree; it is run at the degree that minimises
    its own norm product at that size, and when the forced special degree is
    far above that optimum the region term A^d grows faster than the
    coefficient term shrinks, so the special sieve loses at small sizes and
    wins at large ones, with the crossover moving up with d. The three-arm
    design measures the two effects separately end to end, including the
    downstream consequences the norm proxy cannot see: a smaller factor base
    for the special arm, hence a smaller matrix and cheaper linear algebra,
    which is why memory is reported beside time.

  novelty_status: unverified

  citations:
