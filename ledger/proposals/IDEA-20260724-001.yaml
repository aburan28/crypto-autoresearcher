idea:
  id: IDEA-20260724-001
  question_id: RQ-MLKEM-002
  title: Repair the hardened ML-KEM comparison gate with a baseline-invisible synthetic control
    and a mechanism-matched second implementation
  class: control
  claim: The isolation-versus-systemic question left open by EV-MLKEM-006 becomes decidable
    if (1) the protocol plants a synthetic positive control whose omission is invisible to
    the single-byte generator and visible to at least one widened class, so generator_hardening_insufficient
    fires only when the instrument fails rather than whenever the real control is G1-complete,
    and (2) the second implementation is chosen for a fixed-bound hand-written vector comparison
    tail rather than for being first in a convenience preference order.
  mechanism: KN-TECH-054 shows that ranking an empty-marginal class above the target conclusion
    makes isolation unreachable when the only positive control is fully baseline-visible.
    Separating instrument adequacy (synthetic control) from detection retention (known wolfSSL
    defect) restores both outcome classes to reachable worlds. Separately, a null on a length-parameterized
    verify routine (liboqs) does not stress the mis-sized fixed-bound tail mechanism that
    produced the wolfSSL defect, so the second-implementation selection rule must prefer that
    mechanism neighborhood.
  novelty_status: adaptation
  novelty_screen: Direct repair of EXP-MLKEM-003 under DEC-20260724-019; not a new cryptanalytic
    mechanism. Distinct from IDEA-20260722-002, which produced the single-byte gate, by adding
    the baseline-invisible control and the mechanism-matched second-implementation constraint.
  predicted_effect: Either the widened classes detect the synthetic control and the gate reaches
    a licensed isolation or systemic class, or the synthetic control is missed and the outcome
    is honestly generator_hardening_insufficient.
  cheapest_decisive_test: One four-run laboratory experiment reusing the EXP-MLKEM-003 harness
    structure with the two repairs, against wolfSSL pre-fix/post-fix and one mechanism-matched
    second implementation.
  risks:
  - No public second implementation with fixed-bound hand-written tails is buildable within
    budget.
  - The synthetic control is accidentally G1-visible, recreating the EXP-MLKEM-003 trap.
  - A newly found defect outside the known class requires immediate escalation and stops characterization.
  status: selected
  selected_by: coordinator
  selected_from: DEC-20260724-019
  proposed_by: coordinator
  proposed_at: '2026-07-24'
  schema_repair_note: 'Committed under a `proposal:` top-level key with `statement:` instead
    of `claim:`, so it never parsed as an idea record and no field rule applied to it. Repaired
    2026-08-02 under CORR-20260802-009: key renamed to `idea:`, `statement` renamed to `claim`
    (no idea record carries both), `class` set from the proposal''s own description, and `novelty_status`
    set to the label its existing novelty_screen text already argues for. No claim, prediction,
    test or risk is changed.'
