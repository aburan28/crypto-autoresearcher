idea:
  id: IDEA-20260808-c4b462
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-08-08'
  proposed_at: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  class: composition
  title: >-
    Signed-y approximate-quotient four-list cascade: test whether a public
    non-homomorphic coordinate partition enriches exact ECDLP collisions enough
    to cross the gamma > 1/6 sub-rho threshold

  claim: >-
    CONDITIONAL THEOREM TARGET, NOT A RESULT. Let G=<P> have prime order N and
    Q=[k]P. Put M=L=floor(N^(1/3)). Define the public signed-y bucket h:G->Z/M
    below. Four independent known-log lists of length L are joined under two
    bucket constraints rooted at z, then checked only by exact full-point
    equality. Define gamma by
      Pr[A+B=Q' | both selectors] = N^(-1+gamma+o(1)).
    Each selected pair list has expected size L^2/M=N^(1/3+o(1)); hence a root
    has N^(2/3+o(1)) cross-pairs and expected exact matches
    N^(-1/3+gamma+o(1)). Fresh independent roots therefore give expected time
    N^(2/3-gamma+o(1)) and memory N^(1/3+o(1)). This beats Pollard rho in time
    if and only if gamma>1/6. At gamma=0 it reproduces the N^(2/3)-time,
    N^(1/3)-memory BSGS tradeoff. An exact M-way quotient has gamma=1/3 and
    gives the information-theoretic ceiling N^(1/3+o(1)) time and memory.
    No positive gamma is claimed for prime-order curves. The honest prior is
    approximately 0.03 that gamma>1/6; prime-order congruence rigidity and
    square-root cancellation make gamma=0 the leading expectation.

  mechanism: >-
    For P=(x,y), let y_tilde be the centered integer representative of y in
    [-(p-1)/2,(p-1)/2], and define
      h(P)=sgn(y_tilde)*floor(M*abs(y_tilde)/p) mod M, h(O)=0.
    Thus h(-P)=-h(P), but h is deliberately not asserted to be a homomorphism.
    For each restart choose a uniformly random a in (Z/N)* and b in Z/N, set
    Q'=[a]Q+[b]P, and sample four independent scalar lists
    r_{j,i} with R_{j,i}=[r_{j,i}]P, each of length L. Choose z in Z/M.
    Bucket-join lists 1 and 2 to enumerate pairs satisfying
      h(R_1)+h(R_2)=z mod M,
    and lists 3 and 4 to enumerate pairs satisfying
      h(R_3)+h(R_4)=h(Q')-z mod M.
    Store actual point sums A=R_1+R_2 and look up Q'-B for each actual sum
    B=R_3+R_4. An equality A+B=Q' is a full group collision, not an oracle
    prediction. It yields
      k=a^(-1)*(r_1+r_2+r_3+r_4-b) mod N,
    which is accepted only after [k]P=Q. Fresh lists, self-reduction, and z form
    an independent restart. The possible gain is wholly captured by gamma.

  assumptions:
    - Prime-order short-Weierstrass subgroup G=<P>, N approximately p.
    - Single-target, no-advice setting; list construction and storage are charged.
    - Scalar lists and affine self-reductions use fresh deterministic-seedable randomness.
    - Only exact full-point collisions produce outputs; the bucket statistic is a selector.

  heuristic_assumptions:
    - id: HA-1-selector-fibre-regularity
      statement: >-
        Each rooted pair selector produces N^(1/3+o(1)) pairs and no
        subexponential heavy fibre dominates the work or success probability.
      rigorous_ingredient: >-
        Exact counts follow from the observed bucket histogram; expectation and
        concentration are available in the matched random-balanced-label model.
      distribution_imitated: >-
        Four independent uniform scalar lists assigned balanced antisymmetric
        M-way labels.
      validation_route: >-
        Record every bucket and selected-pair count; compare with the exact
        histogram-conditioned null rather than an ideal uniform approximation.
      tail_checks: >-
        Maximum fibre, collision multiplicity, duplicate scalars, and the
        0.99/median selected-pair-count ratio are mandatory.
    - id: HA-2-signed-y-four-sum-enrichment
      statement: >-
        Along the declared curve family, gamma_N defined by the conditional
        full-collision probability has liminf gamma_N>1/6.
      rigorous_ingredient: >-
        None currently supports this on prime-order curves. An exact quotient
        nearby object gives gamma=1/3, while random balanced labels predict
        gamma=0; congruence rigidity and square-root cancellation favor the null.
      distribution_imitated: >-
        An approximate M-way quotient retaining more than N^(1/6) effective
        information in the complete four-list collision event.
      validation_route: >-
        Estimate gamma from pooled exact matches divided by the exact number of
        selected A,B cross-pairs on a growing N ladder, with binomial likelihood
        intervals and preregistered slope fitting.
      tail_checks: >-
        Report per-curve, per-isomorphic-model, per-root, and pooled estimates;
        a marginal one-step y correlation is not evidence for HA-2.
    - id: HA-3-independent-restarts
      statement: >-
        Fresh affine self-reduction, lists, and root make restart successes
        sufficiently independent for inverse-success-probability accounting.
      rigorous_ingredient: >-
        With fresh uniform b, Q' is uniform in G; all list and root seeds are
        independent by construction.
      distribution_imitated: Geometric restart trials after conditioning on the curve.
      validation_route: >-
        Report lag correlations and overdispersion of root successes; also
        compute the empirical survival curve.
      tail_checks: >-
        Stop interpretation if a small set of curves or roots supplies most hits.

  proof_search_map:
    bottleneck: >-
      Establish or refute gamma>1/6 for the complete rooted four-list collision
      event; coordinate bias or selector accuracy alone cannot move the exponent.
    baseline_embedding:
      parameter_slice: >-
        gamma=0, realized by histogram- and negation-preserving random relabeling.
      reproduction_check: >-
        Symbolically and operationally recover L=N^(1/3), root work
        N^(1/3+o(1)), success N^(-1/3+o(1)), and total time N^(2/3+o(1)),
        identical to memory-limited BSGS up to polylogarithmic factors.
    observation_collision:
      observable: >-
        Conditional probability of exact A+B=Q', normalized by the exact number
        of selected cross-pairs.
      distinct_preimage_search: >-
        Compare signed-y, x-bucket, random antisymmetric relabeling, and exact
        quotient objects with matched histograms. Similar marginal bucket
        statistics but different full-collision gamma localize the mechanism.
    constructive_transforms:
      - transform: signed_y_partition
        proposed_object: Public antisymmetric M-way coordinate statistic.
        predicted_gain: N^gamma enrichment over a uniform full-point collision.
      - transform: rooted_four_list_cascade
        proposed_object: Two size-N^(1/3) selected pair-sum lists.
        predicted_gain: >-
          Converts gamma enrichment into time N^(2/3-gamma+o(1)).
    quantifier_order: >-
      Fix the curve-family rule and h definition first. Then, for all
      sufficiently large N in that family, probability is over fresh random
      targets, affine self-reductions, lists, and roots. The attack condition is
      the existence of epsilon>0 with gamma_N>=1/6+epsilon eventually.
      Toy failure closes only the preregistered ladder and scaling model, not
      every coordinate statistic or every curve family.
    method_ceiling:
      strongest_certifiable_claim: >-
        Conditional Las Vegas ECDLP with expected time
        N^(2/3-gamma+o(1)), memory N^(1/3+o(1)), only if HA-1 through HA-3 hold.
      nearby_object_control: >-
        A cyclic group with a genuine quotient of size M must realize
        gamma=1/3; matched random antisymmetric labels must realize gamma=0.
        One M-valued compatibility condition carries at most log M information,
        so gamma=1/3 is this method's ceiling.
    proof_obligations:
      - claim: Selected-pair size and enumeration cost.
        responsibility: size_and_runtime
      - claim: A full collision recovers and verifies the unique discrete log.
        responsibility: correctness
      - claim: Root success is N^(-1/3+gamma+o(1)).
        responsibility: success_probability
      - claim: Restarts give total time N^(2/3-gamma+o(1)).
        responsibility: runtime
      - claim: One M-valued selector has ceiling gamma=1/3.
        responsibility: method_ceiling
      - claim: Conclusions do not extend beyond the declared family and controls.
        responsibility: scope

  predictions:
    - observable: Signed-y cascade on the growing prime-order curve ladder.
      metric: gamma and its 95-percent likelihood interval.
      predicted: >-
        Leading expectation gamma=0; the decision-changing outcome requires a
        lower bound strictly above 1/6 at both largest sizes with nondecreasing
        scaling.
    - observable: Histogram- and negation-preserving random relabeling.
      metric: gamma.
      predicted: 0 within calibrated finite-size error.
    - observable: Exact-quotient positive control.
      metric: gamma.
      predicted: 1/3 within calibrated finite-size error.
    - observable: Charged cascade work and peak storage.
      metric: log-log slopes in N.
      predicted: 1/3 per root and 1/3 memory; total slope 2/3-gamma.

  minimal_test: >-
    Prospective test only; no experiment is approved here. Use prime-order
    curves at approximately 18, 21, 24, and 27 group-order bits, four
    independently generated curves per size, deterministic published seeds,
    and up to 2^15 fresh roots per curve. Pool only after retaining per-curve
    estimates. For every root record exact selector sizes, cross-pair
    denominator, exact full collisions, verified logs, operation counts, and
    peak bytes. Fit gamma from
      q_N=matches/selected_cross_pairs=N^(-1+gamma_N),
    using exact/binomial likelihood intervals and a preregistered slope model.
    Exhaustive scalar logs may be used only on the two smallest cells to validate
    instrumentation, never as the proposed solver.

  controls:
    - Random relabeling preserving the exact h histogram and h(-R)=-h(R).
    - Genuine size-M quotient/planted-gamma positive controls at gamma=1/3 and selected intermediate gamma.
    - Matched x-coordinate buckets as the closed-MITM near-neighbour control.
    - Random isomorphic curve models; the ECDLP is unchanged while y coordinates move.
    - Fully charged rho, standard BSGS, and N^(1/3)-memory BSGS on matched groups.
    - Exhaustive-log instrument validation on the smallest cells only.

  metrics:
    - Exact selected left/right pair counts and their tails.
    - Exact selected cross-pair denominator and verified collision count.
    - gamma per curve, size, control, and isomorphic model with intervals.
    - Root-success probability, overdispersion, and restart survival curve.
    - Group additions, scalar multiplications, hashes/lookups, bytes, and wall time.
    - Charged ratios against rho, BSGS, and memory-matched BSGS.

  budget:
    status: prospective_not_approved
    wall_clock_seconds: 7200
    memory_gb: 2
    maximum_runs: 1
    maximum_group_order_bits: 27
    maximum_roots_per_curve: 32768

  stopping_rules:
    - >-
      If either random-label or exact-quotient control misses its calibrated
      target, mark the run invalid and stop; this is not evidence about HA-2.
    - >-
      If the 95-percent upper bound is <=1/6 at both largest valid sizes with no
      increasing trend, stop for a negative scoped disposition.
    - >-
      If the 95-percent lower bound is >1/6 at both largest valid sizes and
      survives isomorphic-model controls, stop and request independent review;
      do not promote the claim.
    - >-
      A time, memory, implementation, or precision cap yields inconclusive or
      infrastructure failure, never mathematical falsification.

  required_artifacts:
    - frozen experiment specification and seed/curve manifest
    - curve-order certificates and exact subgroup parameters
    - exact command, environment, commit, dirty-tree, and inference manifest
    - stdout, stderr, raw per-root JSONL, and machine-readable aggregate results
    - operation-count and peak-memory tables for every arm
    - gamma likelihood data, scaling fits, control plots, and validity report
    - every recovered scalar and its independent full-point verification result

  falsification_conditions:
    - >-
      HA-2 fails for the declared family if the valid largest-size data place
      gamma at or below 1/6 without an increasing trend; no sub-rho successor
      remains in this construction.
    - >-
      A nonzero gamma in the matched random-label null, or failure to recover
      gamma=1/3 in the exact quotient, invalidates the measurement.
    - >-
      A signal that changes materially under random curve isomorphism, or is
      reproduced by x buckets/random labels, is a coordinate or apparatus artifact.
    - >-
      Selected-pair work or restart behavior with an exponent above the derivation
      falsifies the stated cost model even if a collision signal exists.
    - Any accepted scalar failing [k]P=Q falsifies correctness.

  confounders:
    - Rare-event finite-size bias can make gamma positive on small N.
    - Bucket imbalance, duplicate scalars, and heavy fibres can fake enrichment.
    - Reusing lists or roots creates dependent trials and understates uncertainty.
    - Affine-coordinate conventions and point-at-infinity handling can leak labels.
    - Uncharged scalar multiplication, hashing, preprocessing, or parallelism can fake speedup.
    - Exceptional or special curves cannot support a generic-family conclusion.

  interpretation_limits:
    - No positive gamma, asymptotic attack, experiment result, or crypto-scale validation is claimed.
    - Negative toy evidence closes only this h definition, curve ladder, and scaling model.
    - Positive toy evidence requires larger validation and independent adversarial review.
    - The exact-quotient control is a nearby object, not evidence that prime-order ECDLP has a quotient.
    - Multi-target or reusable preprocessing requires a separate time-memory-data frontier audit.

  target_complexity:
    time_exponent: >-
      Conditional N^(2/3-gamma+o(1)); strict improvement over rho only for
      gamma>1/6. The null gamma=0 gives N^(2/3+o(1)).
    memory_exponent: N^(1/3+o(1)) group points/scalars and pair-table entries.
    best_known_baseline: >-
      Pollard rho/vOW: N^(1/2+o(1)) group work and O(1) stored states.
      Standard BSGS: N^(1/2+o(1)) work and memory. BSGS with memory
      S=N^(1/3): T=N/S=N^(2/3+o(1)).
    hidden_overhead_disclosure: >-
      Every restart charges four length-L scalar lists (O(L log N) group work
      without special preprocessing), about 2L selected pair additions under
      HA-1, bucket construction, sorting/hashing, equality checks, affine
      self-reduction, retries, final scalar inversion/multiplication, curve
      validation, seeds, and storage. No oracle or free offline table is assumed.
    time_memory_tradeoff: >-
      At gamma<=1/6 rho has no worse time and strictly less memory. At
      gamma>1/6 this method is faster but more memory-intensive than rho, and
      faster with less memory than standard BSGS.
    concrete_cost_table:
      units: log2 leading operation count or stored group elements; optimistic exponent-only
      rows:
        - {order_bits: 128, rho_time: 64, bsgs_time_memory: 64, mem_N1_3: 42.7, bsgs_memmatched_time: 85.3, candidate_gamma_0: 85.3, candidate_gamma_1_6: 64, candidate_gamma_0_20: 59.7, candidate_gamma_1_3: 42.7}
        - {order_bits: 192, rho_time: 96, bsgs_time_memory: 96, mem_N1_3: 64, bsgs_memmatched_time: 128, candidate_gamma_0: 128, candidate_gamma_1_6: 96, candidate_gamma_0_20: 89.6, candidate_gamma_1_3: 64}
        - {order_bits: 256, rho_time: 128, bsgs_time_memory: 128, mem_N1_3: 85.3, bsgs_memmatched_time: 170.7, candidate_gamma_0: 170.7, candidate_gamma_1_6: 128, candidate_gamma_0_20: 119.5, candidate_gamma_1_3: 85.3}

  dominated_by: >-
    n/a: no realized result is claimed. Conditional audit: for gamma<=1/6,
    Pollard rho dominates because it has no worse time and O(1) memory. For
    gamma>1/6, the candidate is Pareto-incomparable with rho, dominates standard
    BSGS in time and memory, and improves memory-matched BSGS by gamma in the
    time exponent.
  sota_delta: >-
    Against rho, the conditional time-exponent delta is
    (2/3-gamma)-1/2=1/6-gamma, with an added N^(1/3) memory cost. Against
    N^(1/3)-memory BSGS the time-exponent improvement is gamma. Against standard
    BSGS the candidate uses 1/6 less memory exponent and is faster only when
    gamma>1/6.
  pareto_audit:
    scope: Single-target, no advice, generic prime-order short-Weierstrass ECDLP.
    frontier_checked:
      - Pollard rho and parallel vOW
      - standard BSGS
      - memory-limited BSGS with T*S=N
      - reusable-preprocessing and multi-target rows
      - special-curve attacks, marked outside declared scope
    conclusion: >-
      Only gamma>1/6 is decision-changing; reusable data or special structure
      requires a new audit and cannot inherit this comparison.

