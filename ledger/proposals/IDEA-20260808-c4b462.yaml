  honest_prior_of_survival: >-
    Approximately 0.03 that gamma>1/6 survives scaling and all controls,
    approximately 0.12 that a positive but sub-threshold gamma survives, and
    approximately 0.85 that gamma=0 or an isomorphism-sensitive artifact is
    observed. The test is still worthwhile because it is cheap, a positive
    result changes the exponent, and a negative result gives a quantitative
    obstruction rather than a fatigue-based closure.
