idea:
  id: IDEA-20260807-fa706a
  question_id: RQ-CRYPTO-001
  added: '2026-08-07'
  title: '7,573 of 7,819 literature entries are cited by no ledger or experiment record, novelty
    screens are keyword greps over that corpus, and no record has ever measured whether those
    screens actually find the prior art the corpus already contains -- so `novelty_status: unverified`
    may be understating a worse problem'
  class: control
  claim: The literature corpus holds 7,819 KN-LIT entries and 7,573 of them are referenced by
    no record under ledger/ or experiments/. A 400-entry random sample of the unreferenced set
    shows the corpus is a broad and largely UNDIRECTED sweep -- MPC, blind signatures, FHE, hardware
    implementations, and one hep-th Seiberg-Witten paper -- mixed with genuinely on-topic and
    uncited items such as 'ALGEBRAIC MODELINGS OF THE SUPERSINGULAR ISOGENY PROBLEM' and 'Breaking
    the decisional Diffie-Hellman problem for class group actions using genus theory'. THE DEFECT
    IS NOT THE COUNT. It is that no relevance instrument exists over the corpus, so at novelty-screen
    time on-topic prior art is indistinguishable from off-topic bulk, and every screen in ledger/proposals
    is a keyword grep whose recall has never been measured. 117 of 278 proposals carry a novelty_screen
    block; every one records greps and none records a recall measurement. KN-OPEN-3f7a21 already
    records the adjacent problem -- 7,457 of 7,666 entries claim citation_verified against a source
    the program believed unreachable -- but that is about PROVENANCE, not about RETRIEVAL.
  mechanism: 'Measure the screens against a known-answer set. Build a labelled set of (proposal,
    prior-art entry) pairs where the prior art IS in the corpus and IS genuinely relevant -- construct
    it by taking proposals whose source_refs already name a KN-LIT entry, hiding that reference,
    and asking whether the proposal''s own recorded grep terms would have retrieved it. That gives
    a measured RECALL for the screening method actually used, on cases where the right answer
    is known and is in the corpus. Report recall, and the terms that failed. If recall is low,
    the cheap fix is not a better corpus but a better retrieval step: an embedding or BM25 index
    over titles and abstracts, evaluated on the same labelled set, reported as a recall delta.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - No record measures novelty-screen recall. The 117 novelty_screen blocks record which paths
      were grepped and what the grep returned; none records whether the grep would have found
      a known relevant entry.
    - KN-OPEN-3f7a21 concerns citation_verified provenance, which is a different failure (an entry
      claiming to have been read) from retrieval (an entry that exists and is never surfaced).
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any research claim about cryptanalysis. The
      object is the SCREEN.'
    tracked_object: 'The retrieval event: for a (proposal, known-relevant-entry) pair, whether
      the proposal''s own recorded screen terms retrieve the entry.'
    one_step_propagation_rule: Each labelled pair contributes one hit or miss; recall is their
      ratio and updates exactly.
    newness_score: Zero as mathematics. It measures an instrument every proposal in the corpus
      depends on and that has never been evaluated.
  lossy_projection_identifiability_audit:
    projection: the corpus plus a proposal -> a retrieved set.
    what_is_discarded: Everything not matching the terms -- which is the whole question.
    is_it_only_a_change_of_coordinates: 'NO. Honest caveat: this measures recall against prior
      art ALREADY IN the corpus. It says nothing about prior art the corpus does not contain,
      which is the other and harder half of novelty, and the record must not be read as validating
      novelty_status in general.'
    mirror_failure_check: CHECKED. The measurement must be able to return low recall. Given that
      the labelled pairs are built from references the proposals themselves recorded, high recall
      would be a genuine and reassuring result rather than a tautology -- the terms were written
      independently of the hiding procedure.
  null_object_control:
    primary_null: 'A RANDOM-ENTRY NULL: for each proposal, measure the retrieval rate for a RANDOM
      corpus entry under the same terms. Recall must exceed that rate substantially, or the screens
      are retrieving by chance and the measured recall means nothing.'
    secondary_nulls:
    - 'FORCED HIT: a pair whose entry title contains the proposal''s own primary keyword verbatim
      must be retrieved; a screen that misses it is broken.'
    - 'FORCED MISS: an off-topic entry (the hep-th sample is a good one) must not be retrieved.'
  assumptions: []
  predictions:
  - metric: recall of the recorded grep terms on the labelled pairs
    direction: different
    minimum_effect: Any value; the number does not exist today and both a high and a low value
      change how novelty_status should be read.
  - metric: recall delta from adding a BM25 or embedding retrieval step
    direction: higher
    minimum_effect: Any improvement on the same labelled set, measured rather than assumed.
  minimal_test:
    design: Build the labelled set from proposals whose source_refs name KN-LIT entries; hide
      the reference; replay the recorded screen terms; measure recall against the random-entry
      null; then evaluate a BM25 or embedding index on the identical set and report the delta.
    controls:
    - random-entry retrieval null
    - forced-hit pair
    - forced-miss off-topic entry
    required_metrics:
    - recall of recorded terms
    - random-entry baseline rate
    - recall under BM25/embedding retrieval
    - list of terms that failed
  falsification_conditions:
  - 'Recall is high: the screens work on prior art the corpus contains, and novelty_status ''unverified''
    is limited by the corpus''s COVERAGE rather than by its retrieval -- which redirects effort
    to acquisition.'
  - 'Recall is low: many novelty screens have been missing prior art that was already filed, and
    the fix is a retrieval index, which is cheap.'
  - 'Recall does not exceed the random-entry null: the screens are retrieving by chance and every
    novelty_screen block in the corpus needs re-reading.'
  confounders:
  - The labelled set is built from references proposals recorded, which biases toward entries
    their authors already knew; recall measured this way is an UPPER BOUND on real-world recall
    and must be reported as such.
  - Grep terms recorded in a novelty_screen block may be a summary rather than the exact query
    used; state the fidelity.
  - Corpus titles vary in quality; bulk-seeded entries may have poor metadata, which suppresses
    retrieval for reasons unrelated to the screen.
  interpretation_limits:
  - This measures retrieval over the corpus the program has. It says nothing about literature
    the corpus lacks, and therefore does not validate any novelty_status.
  - No security or mathematical claim.
  heuristic_assumptions:
  - id: HEUR-RETR-1
    statement: Recall on author-recorded references is indicative of recall on prior art the author
      did not know about.
    rigorous_support: None, and it is probably optimistic; the record states the measured value
      as an upper bound for that reason.
    validation_plan: Report it as an upper bound and say so wherever the number is quoted.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no attack claimed); instrument evaluation.
  sota_delta: ZERO on research axes. Every one of the 278 proposals carries a novelty judgement
    produced by an instrument whose recall has never been measured, and 7,573 corpus entries are
    invisible to the process that would use them.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.9 that a labelled set of at least 50 pairs is constructible from
    existing source_refs. 0.55 that recall of the recorded terms is below 0.5, which would make
    the retrieval fix clearly worthwhile. 0.75 that a BM25 index improves it measurably. 0.0 that
    this validates any novelty_status, which it explicitly cannot.
  source_refs:
  - KN-OPEN-3f7a21
  - docs/novelty-screen-20260729.md
  - knowledge/SOURCES.md
  - GOAL-FIND-001
  discriminated_from:
  - 'KN-OPEN-3f7a21: provenance (entries claiming citation_verified against an unreachable source).
    This record concerns RETRIEVAL (entries that exist, are correct, and are never surfaced).'
