idea:
  id: IDEA-20260829-0656b1
  question_id: RQ-SCURVE-03aa7e
  goal_id: GOAL-SCURVE-be9707
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    PRICE THE ADJECTIVE - "manipulatable" is a cost curve, not a label. Measure
    the acceptance rate rho of the NIST P-256 seed-to-curve pipeline at reduced
    field sizes where the whole pipeline is executable, compare it against the
    Koblitz/Galbraith-McKee prime-density prediction, and publish the resulting
    seeds-per-target-property curve in bits. Two rigorous factors of exactly 1/2
    fall out with no heuristic at all, and the remaining factor is the one that
    needs measuring.
  class: measurement

  claim: >-
    SafeCurves classifies NIST P-256 as "manipulatable" with the attack model that
    a generator who knows a secret attack applying to one curve in 2^k searches
    seeds until one hits. THAT MODEL HAS A COST AND THIS PROGRAM HAS NEVER
    COMPUTED IT. The cost is W = 2^k / rho seed evaluations, where rho is the
    probability that a uniformly drawn seed survives the pipeline's acceptance
    criteria. Nobody in this repository has measured rho, and the number is not a
    detail: it moves the manipulation cost by exactly log2(1/rho) bits. Four
    separable claims of decreasing rigour.

    (A) TWO RIGOROUS FACTORS, NO HEURISTIC, ZERO COMPUTE. The pipeline of SP
    800-186 C.3.1 is: draw s, assemble c, reject if c = 0 or 4c + 27 congruent 0
    mod p, then choose b with c*b^2 congruent a^3 mod p, then reject unless E has
    suitable order.
    (A1) With a = -3 fixed, b exists iff -27/c is a quadratic residue mod p. For
    c behaving as a uniform draw this halves the acceptance rate EXACTLY: factor
    1/2, with an O(p^{-1/2}) error by Weil's bound on character sums applied to
    the Legendre symbol along the c-chain. This factor is invisible in every
    informal discussion of NIST seed searching that I am aware of and it is worth
    exactly one bit.
    (A2) When b exists there are TWO square roots, +b and -b, and both are
    admissible outputs of step 9. So the seed-to-accepted-curve map is 1-to-2 on
    the surviving half, and the generator gets a free bit BACK. FACTORS A1 AND A2
    CANCEL TO WITHIN THE WEIL ERROR. That cancellation is a genuine, checkable,
    previously unstated observation about this pipeline and it is one of the two
    things this record contributes even if every measurement below fails.

    (B) THE MEASURED FACTOR, WHICH IS THE EXPENSIVE ONE. Step 10 requires E to
    have "suitable order", which for the Section 3.2.1 prime curves means cofactor
    h = 1, that is #E prime. Call that probability rho_n. THE CENTRAL PREDICTION,
    CONDITIONAL ON HEURISTIC H1 BELOW: rho_n equals C(p) / ln(p) times (1 + o(1)),
    where C(p) is the Galbraith-McKee-style correction for the non-uniformity of
    elliptic-curve orders in the Hasse interval. At p near 2^256, ln(p) is about
    177.4, so a naive uncorrected model gives rho_n about 1/177, that is 7.47
    bits, and the correction is expected to be a factor between 0.5 and 2, that
    is within one bit either way. THE COMBINED COST STATEMENT: to target a
    one-in-2^k property, the generator needs about 2^k * 177 / C seed
    evaluations, EACH COSTING ONE POINT COUNT, and 2^k * 177 point counts at 256
    bits is the real bound, not 2^k hash calls. The distinction is worth about
    7.5 bits and, far more importantly, changes the UNIT from hashes to SEA runs.

    (C) THE RIGOROUS REACHABILITY BOUND, INDEPENDENT OF EVERYTHING ABOVE. The seed
    space has exactly 2^160 elements, so at most 2^161 values of b are reachable
    counting both square roots, out of the roughly 2^256 elements of F_p: a
    fraction below 2^{-95}. A generator confined to this procedure CANNOT reach an
    arbitrary b. This bounds the procedure and says nothing about the generator's
    intent.

    (D) THE DISCRIMINATION, STATED BEFORE THE EXPERIMENT. Two theories of where
    the pipeline's selectivity lives.
    THEORY 1, PRIMALITY-DOMINATED: acceptance is governed almost entirely by
    "#E is prime", rho is about 1/ln p, and the twist and other criteria cost
    under one bit in total. PREDICTED OBSERVABLE: at reduced size l, the measured
    acceptance rate rho-hat(l) scales as 1/(l ln 2) across l, a straight line in
    1/rho versus l.
    THEORY 2, CRITERIA-DOMINATED: the further requirements of SP 800-186 Section 3
    (which I have NOT read - see the citation's read depth) contribute their own
    multiplicative factors, rho is materially below 1/ln p, and the manipulation
    cost is correspondingly higher than the folklore estimate. PREDICTED
    OBSERVABLE: rho-hat(l) falls BELOW 1/(l ln 2) by a constant factor
    independent of l, which the experiment measures directly.
    THE TWO THEORIES ARE SEPARATED BY THE SLOPE-VERSUS-OFFSET DISTINCTION IN A
    SINGLE PLOT, and either outcome is a number this program does not have.

  mechanism: >-
    THE TRACKED OBJECT is the ACCEPTANCE INDICATOR I(s) in {0, 1} of the
    seed-to-curve pipeline at a given field size, together with its factorisation
    into per-stage indicators I = I_c * I_qr * I_order, where I_c is the c != 0 and
    4c + 27 != 0 test, I_qr is the quadratic-residuosity of -27/c, and I_order is
    the primality of #E.

    LOSSY-PROJECTION TEST, applied BEFORE any experiment.
    WHAT IS DISCARDED. A 160-bit seed, a 255-bit c, a 256-bit b and an entire
    elliptic curve group collapse to THREE BITS, and the headline object collapses
    to one. Nothing about the curve survives.
    IS IT A CHANGE OF COORDINATES? Emphatically not. The fibre over I = 1 is the
    entire set of accepted seeds, of size about rho * 2^160, and no seed, no
    coefficient and no group order is recoverable from the bit. Contrast the
    (Delta, Pi) example of KN-LIT-7595, where the projection lost nothing.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? The operation that matters is
    SEED SEARCH, that is the map s -> s + 1 iterated, and the projection is
    exactly equivariant under it: I(s) is computed from s alone by a fixed
    deterministic procedure, so the retained bit propagates deterministically along
    the search that the whole SafeCurves attack model is about. It is also
    equivariant under CHANGE OF FIELD SIZE in a precise sense - the pipeline is
    parameterised by (l, hdigest, HASH) and I is defined identically at every l,
    which is what makes the reduced-size measurement a measurement of the SAME
    object rather than of an analogue. PASSES, and it passes for the specific
    reason that the object is defined by the search rather than by the curve.
    WHERE IT DISSOLVES. At the point where the reduced-size pipeline stops being
    the same pipeline. Below about l = 24 the Hasse interval is small enough that
    the primality of #E is dominated by small-number effects and 1/ln p is a poor
    model; above about l = 44 brute-force point counting stops being affordable in
    pure Python. THE INSTRUMENT THEREFORE HAS A MEASURED WORKING RANGE OF ROUGHLY
    24 TO 44 BITS and the record says so in advance rather than discovering it.

    WHY THIS IS NOT IDEA-20260829-bba3a8. That record verifies that ONE seed
    produces ONE coefficient and counts what the predicate binds; it is a
    single-instance certificate and it makes no statement about the pipeline's
    selectivity. This record never verifies the P-256 seed at all - it measures the
    DENSITY of the accepted set. The two share the code for c(s, l) and nothing
    else, and bba3a8 is a strict prerequisite because an unvalidated c routine
    would corrupt every acceptance rate. The dependency is declared, not implied.

    WHY THIS IS NOT IDEA-20260829-f5bcff. That record inverts a published verdict
    table for its implicit thresholds and explicitly REFUSES the rigid criterion as
    non-numeric. This record measures a physical quantity of a generation procedure
    and never touches the verdict table. The two are orthogonal and neither
    subsumes the other.

    EXECUTION. Step 1, reuse the validated c(s, l) routine from
    IDEA-20260829-bba3a8. Step 2, for each l in {24, 28, 32, 36, 40, 44}, pick a
    prime p of exactly l bits, and for N = 10^5 seeds per size compute I_c, I_qr
    and, when both pass, #E by exhaustive enumeration over x using Legendre symbols
    (an O(p) pass, affordable to l = 44 across 14 cores) and test primality. Step
    3, report rho-hat and its three factors per size with exact binomial confidence
    intervals. Step 4, compare against 1/ln p and against the theoretical 1/2 for
    I_qr. Step 5, the null and the negative control. Step 6, the extrapolation to
    256 bits, stated as an extrapolation with H1 named, never as a measurement.

  novelty_status: unverified
  novelty_rationale: >-
    The heuristic that #E is prime with probability about C/ln p is classical and
    the framing of curve-standard manipulation as a search cost is the explicit
    subject of KN-LIT-4290 (BADA55), so as a research idea the honest label is
    `adaptation` at best. The label recorded is `unverified` because NO WEB SEARCH
    WAS PERFORMED THIS SESSION, the BADA55 paper itself was not opened (only its
    39-line corpus record and one HTML mirror page), and I therefore cannot say
    whether the specific acceptance-rate factorisation proposed here, and in
    particular the 1/2 quadratic-residuosity factor and its cancellation against
    the two square roots, appears in that literature. Per
    agents/idea-generator.md that forces `unverified`. The A1/A2 cancellation is
    the item most likely to be already known and a reviewer with retrieval should
    check BADA55 Section 5 first.
