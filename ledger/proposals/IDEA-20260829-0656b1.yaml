    method: >-
      Run 2026-08-29. Same corpus screen as IDEA-20260829-bba3a8 - greps over
      knowledge/ and ledger/ for rigidity, seed, Brainpool, ANSSI and NIST-curve
      terms; full reads of the four prior SafeCurves proposals; full read of
      inputs/SAFECURVES-20260825/pages/rigid.txt; targeted reads of SP 800-186
      C.3.1 and C.3.2. Additional targeted grep of knowledge/ for
      "Galbraith-McKee|Koblitz|prime order|Hasse interval" was NOT run and that
      omission is recorded rather than glossed.
    results: >-
      No record in ledger/ or knowledge/ measures or estimates an acceptance rate,
      a curve-generation search cost, or a manipulation cost for any curve.
      KN-LIT-4290 is the only corpus record on the topic, is at confidence
      `reported`, and its own text says it was generated from the first two pages
      of a PDF in a bulk seeding pass. The four prior SafeCurves proposals contain
      no density measurement of any kind. This program therefore holds no number
      of this type for any curve.

