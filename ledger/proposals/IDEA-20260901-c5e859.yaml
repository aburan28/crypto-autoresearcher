idea:
  id: IDEA-20260901-c5e859
  question_id: RQ-RSA-d46f02
  research_question: RQ-RSA-d46f02
  goal_id: GOAL-RSA-002
  added: '2026-09-01'
  title: >-
    THE KNOWN ANSWER IS AN ORACLE ON THE LATTICE, NOT ONLY ON THE OUTPUT: track
    the residual profile r_i = h_i(x0) of every basis vector under evaluation at
    the true root, so that the reach gap at each (modulus size, dimension,
    leakage) cell decomposes EXACTLY into a lattice-shape barrier -- the
    shortest vector of the full lattice L lies outside the evaluation-kernel
    sublattice L0, decided by exact SVP at small dimension with no reducer in
    the loop -- and a reduction barrier -- a certifying vector exists but the
    declared LLL/BKZ budget does not surface it inside the read-off window --
    with the reducer-independent ratio lambda_1(L0) / lambda_1(L) as the
    frontier statistic that a transferable reduction-quality model has to
    predict
  class: measurement

  claim: >-
    FIVE SEPARABLE CLAIMS. (A) THE OBJECT. Fix a univariate small-root instance
    with known answer x0 -- the approximate-divisor form f(x) = p0 + x with
    unknown divisor p of N, or the modular univariate form f(x) = 0 mod N --
    and its Coppersmith shift lattice L of dimension D built from a declared
    shift set. Every lattice vector v is the coefficient vector of a polynomial
    h_v with h_v(x0) = 0 modulo the modulus power p^m. The map ev(v) = h_v(x0)
    is Z-linear on L, so its kernel L0 = L intersect ker(ev) is a primitive
    sublattice of rank D - 1, computable exactly by an integer kernel
    computation once x0 is known. A nonzero vector of L0 is a polynomial that
    vanishes at x0 OVER THE INTEGERS and therefore certifies x0 among its
    integer roots regardless of its norm. The RESIDUAL PROFILE of any basis B
    of L is the integer vector r(B) = (h_{b_i}(x0))_i; a zero entry is a
    certificate, and by the Howgrave-Graham lemma every entry of absolute
    value below the modulus power is forced to be zero, so the profile is the
    exact record of which reduced vectors are certificates and which are not.
    (B) THE DECOMPOSITION. Success of an exact shortest-vector oracle on L is
    equivalent to the shortest vector of L lying in L0 (ties aside). Success of
    an implementation with read-off window k is equivalent to the first index
    i* at which b_i lies in L0 satisfying i* <= k. Therefore the reach gap
    between the asymptotic bound and the bound a budget reaches splits, at
    every cell, into three named parts that are each MEASURED rather than
    argued: the shape part (the cells where SVP(L) is not in L0, which no
    reduction algorithm can fix without changing the shift set), the reduction
    part (the cells where SVP(L) is in L0 but the declared reducer's first
    vector is not), and the read-off part (i* > k with i* finite). (C) THE
    CLAIM UNDER TEST is that at the dimensions this campaign can afford
    (D up to roughly 60 for exact SVP, larger for LLL/BKZ) the shape part is
    the SMALLER of the first two at 1024-bit-equivalent scaled instances and
    the reduction part GROWS with D -- so that the operative frontier is a
    reduction frontier, which is the reading on which stronger reduction buys
    reach -- with the competing explanation, that the shape part dominates and
    stronger reduction buys nothing, being exactly what the same measurement
    would show instead. The two are distinguished by a decay test: under a
    ladder of BKZ block sizes the reduction part must shrink toward zero while
    the shape part must not move at all, because L0 does not depend on the
    reducer. (D) A SECOND, FREE DELIVERABLE. The ratio g = lambda_1(L0) /
    lambda_1(L), both computed exactly at small D, is a reducer-independent
    property of the (construction, cell) pair, and the fraction of successes
    whose certifying vector VIOLATES the Howgrave-Graham norm threshold is the
    far-side measurement of the slack that IDEA-20260816-a321ac measures from
    the near side. (E) WHAT IS NOT CLAIMED. No attack, no new construction, no
    statement about any published bound, no statement about a deployed key.
    The instrument requires the answer, so it can only run on known-answer
    instances, which is exactly the population RQ-RSA-d46f02 mandates; it
    measures where a construction fails and why, and it cannot make a
    construction succeed.

  mechanism: >-
    The Howgrave-Graham lemma is used in the literature in one direction only
    -- a short enough vector must vanish at the root -- and every published
    bound is a sufficient condition derived from it. With the answer in hand
    the other direction becomes computable: the set of vectors that DO vanish
    at the root is an explicit sublattice, L0, obtained as the integer kernel
    of the row vector (x0^j)_j applied to the unscaled coefficient columns (or
    equivalently the kernel of the single Z-linear functional ev on the scaled
    basis, pulled back through the diagonal scaling). L0 has rank D - 1
    because ev is not identically zero on L (the constant polynomial N^m or
    the modulus-power row evaluates to a nonzero integer). Its determinant is
    an exact integer, so the Gaussian-heuristic prediction for lambda_1(L0) is
    available at zero compute, and at D up to roughly 60 lambda_1(L0) itself
    is available by enumeration. Comparing the shortest vector of L (exact, by
    the same enumeration) against membership in L0 decides the oracle-success
    question per cell with no heuristic at all. Running the declared reducer
    on L WITHOUT the answer and then reading the residual profile of its
    output decides, per cell, whether the failure was the reducer's. Because
    ev is linear, the residual profile propagates deterministically through
    every size-reduction and swap the reducer performs -- the residual of a
    combination is the combination of residuals -- so the instrument can also
    be attached INSIDE a reducer to record the first iteration at which a
    certificate appears, which is the cheapest possible early-abort signal
    for a brute-force-over-excess-bits loop and is noted as a by-product,
    not a claim.

  novelty_status: unverified

  citations:
    - ref: KN-TECH-015
      provenance: kb
      claim: >-
        In-corpus statement of the Coppersmith small-root method with the
        Howgrave-Graham lemma and the completeness-within-bound property; cost
        recorded there as roughly O~(D^6 B^3) for LLL on a dimension-D lattice
        with B-bit entries.
      verified_by: this idea-generator session, read in full
    - ref: KN-LIT-037
      provenance: kb
      claim: >-
        Coppersmith, Small solutions to polynomial equations and low exponent
        RSA vulnerabilities -- the primary source KN-TECH-015 cites. Title read
        from the corpus entry header only; the paper was NOT opened this
        session and no bound is quoted from it.
      verified_by: corpus header only; body not read this session
    - ref: >-
        Howgrave-Graham, Finding small roots of univariate modular equations
        revisited (IMA Cryptography and Coding, 1997)
      provenance: recalled
      claim: >-
        RECALLED, NOT OPENED. The lemma that a lattice polynomial whose scaled
        coefficient norm is below (modulus power) / sqrt(D) vanishes at the
        root over the integers. Used here only in its contrapositive: any
        vector outside L0 has scaled norm at least (modulus power) / sqrt(D).
      verified_by: null
    - ref: IDEA-20260816-684f4a
      provenance: internal
      claim: >-
        Computes at zero compute an impossibility region I, a guarantee region
        G where the Howgrave-Graham condition holds for the exact shortest
        vector as bounded by Minkowski, and an undecided band U. This record
        replaces the Minkowski BOUND on lambda_1(L) by the exact value and adds
        the kernel sublattice L0, so that the oracle-success region G* (a
        superset of G) is measured rather than bounded, and the undecided band
        is split by cause.
      verified_by: this idea-generator session, read through claim (D)
    - ref: IDEA-20260816-a321ac
      provenance: internal
      claim: >-
        Tests whether achievable reach is a function of the Howgrave-Graham
        slack s = (log det)/D minus the required log norm, holding (D, det)
        fixed and varying the shift set. That record measures slack from the
        determinant side; this record measures, from the answer side, how
        often the certifying vector violates the threshold outright.
      verified_by: this idea-generator session, read through claim (D)
    - ref: IDEA-20260816-7d1ed0
      provenance: internal
      claim: >-
        Measures completeness C of the read-off stage against exhaustive
        enumeration of the window at small moduli and attributes the deficit
        to the read-off. This record's index i* is the per-instance quantity
        whose distribution C aggregates, and is available at any modulus size
        where the answer is known by construction, not only where the window
        is exhaustible.
      verified_by: this idea-generator session, read through claim (D)
    - ref: IDEA-20260816-b5b822
      provenance: internal
      claim: >-
        Locates the binding stage of the pipeline by single-notch ablation.
        This record locates it by direct measurement of the residual profile
        instead, and the two are cross-checks on each other: a cell that
        b5b822 assigns to the reduction stage must show SVP(L) in L0 here.
      verified_by: this idea-generator session, read through claim (D)
    - ref: IDEA-20260816-7d747d
      provenance: internal
      claim: >-
        Instrument-validity audit varying only the reducer implementation,
        precision and block size. L0 and lambda_1(L0) are reducer-independent
        by construction and serve that audit as an invariant that must not
        move.
      verified_by: this idea-generator session, dedup list title and claim
    - ref: >-
        Aono, Agrawal, Satoh, Watanabe, On the optimality of lattices for the
        Coppersmith technique (ACISP 2012; ePrint 2012/108)
      provenance: retrieved
      claim: >-
        Abstract retrieved this session. Reports that Coppersmith's original
        bound is optimal for the univariate modular case when the lattice is
        constructed in the standard way, and gives evidence that non-standard
        constructions are generally difficult. Used here only to fix what the
        shape barrier can and cannot be blamed on: within the standard family
        the asymptotic limit is not the question, the finite-D approach to it
        is.
      verified_by: >-
        WebFetch of eprint.iacr.org/2012/108 abstract page on 2026-09-01; body
        not read

  novelty_screen:
    method: >-
      Filesystem and ledger screening plus web search. Read all fourteen
      proposals on the RQ-RSA-d46f02 dedup list by title and the claim blocks
      of 684f4a, a321ac, b5b822, 7d1ed0, b4e5b7, c9e5d2 and 736c60 in full;
      listed the ten EXP-RSAPI contracts derived from them; grepped
      knowledge/ for Coppersmith, small roots, Howgrave-Graham, Boneh-Durfee,
      Wiener and read KN-TECH-015, KN-LIT-7566, KN-LIT-7659, KN-LIT-2084 in
      full. Web: searched for known-root diagnostics on Coppersmith lattices
      (sublattice of polynomials vanishing at the root, why LLL fails beyond
      the bound); the results returned tutorials and the focus-groups paper of
      Miller, Narayanan and Venkatesan, whose abstract (retrieved) speaks of
      identifying sublattices with short vectors from empirical patterns but
      does not describe the evaluation-kernel construction.
    results: >-
      No committed record and no retrieved abstract uses the known answer to
      construct the kernel sublattice L0 or reads a residual profile off a
      reduced basis. The nearest filed work is 684f4a (Minkowski-bounded
      guarantee region, no answer used), 7d1ed0 (read-off completeness by
      exhaustion, answer used only at the output), and a321ac (slack from the
      determinant side). The idea that the Howgrave-Graham threshold is
      sufficient but not necessary is folklore and appears in the retrieved
      focus-groups abstract as a remark about enabling-condition bounds not
      being decisive; measuring the necessary condition exactly via L0 is not
      something any source opened this session does.
    verdict: >-
      UNVERIFIED. The construction is elementary enough that it may exist in a
      thesis or an appendix nobody indexed; no source opened this session
      contains it, and the retrieval index was empty. The honest label is
      unverified, with the design plausibly an adaptation of standard
      Howgrave-Graham reasoning turned around.

  object_first_candidate:
    tracked_object: >-
      THE RESIDUAL PROFILE r(B) = (h_{b_i}(x0))_i OF A LATTICE BASIS UNDER
      EVALUATION AT THE TRUE ROOT, and the kernel sublattice L0 it defines.
      Established families declared OFF-LIMITS as the primary lens for this
      record: shift-set design, determinant optimisation, reducer tuning, and
      the asymptotic bound itself. This record does not ask what the lattice
      can reach; it asks, cell by cell, WHY it did not.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. ev maps a D-dimensional integer vector
      to one integer, discarding everything about the polynomial except its
      value at x0. What is discarded is discarded compatibly with the lattice
      operations: ev is Z-linear, so the residual of any integer combination
      of basis vectors is the same combination of their residuals, and the
      residual profile propagates deterministically through every
      size-reduction and swap of LLL or BKZ. It is not a change of
      coordinates: the fibre of ev over zero is the rank-(D-1) sublattice L0,
      so the retained bit -- is the residual zero or not -- is strictly less
      information than the vector, and it is exactly the bit the method's
      success is defined by.
    propagation: >-
      ONE-STEP PROPAGATION IS DEFINED AND MEASURED. For a basis operation
      b_i <- b_i - c b_j the residual updates as r_i <- r_i - c r_j; for a
      swap the residuals swap. The measured quantity per reduction step is
      the first index whose residual is zero, and the record reports the
      iteration at which that index first enters the read-off window.
    survival_score: >-
      Survives for every univariate construction at every dimension where an
      integer kernel can be computed, which is every dimension the campaign
      will run. Dissolves in two named places. (i) Exact SVP on L and L0 is
      available only up to roughly D = 60 by enumeration; beyond that the
      shape barrier is estimated from the Gaussian heuristic on L0 and from
      BKZ output, which is a heuristic reading and is declared as such. (ii)
      For bivariate constructions (Boneh-Durfee type) a single certificate is
      not enough -- two algebraically independent certificates are needed --
      so the index i* generalises to the first PAIR of independent kernel
      vectors, and the algebraic-independence heuristic re-enters; this
      record confines its claims to the univariate case and names the
      bivariate extension as forward work.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the deliverable is the attribution of a
      failed cell. Today a failure at (n, D, u) is reported as a budget
      outcome, which AGENTS.md rule 3 requires, but it is not reported as a
      shape failure or a reduction failure because nothing in the pipeline
      can tell them apart. Attaching ev to the lattice removes that ambiguity
      and turns every failure into one of three measured kinds.
    baseline_embedding:
      parameter_slice: >-
        Cells deep inside the published bound at small D, where
        IDEA-20260816-684f4a's guarantee region G applies. There SVP(L) must
        lie in L0, LLL's first vector must lie in L0, and i* must equal 1.
        This is the exact old-method boundary and must reproduce before any
        frontier cell is read.
      reproduction_check: >-
        A frozen fixture of ten seeded instances at n = 256, D = 12, with the
        window at half the published reach, on which i* = 1 for every
        instance and the residual profile has its first zero at index 1. A
        second fixture at a cell in 684f4a's region G with the exact shortest
        vector computed by enumeration and checked to lie in L0.
    observation_collision:
      observable: >-
        The residual profile r(B) and the membership of SVP(L) in L0.
      distinct_preimage_search: >-
        Two distinct failure mechanisms could produce the same observable
        'LLL's first vector is not in L0': a genuine reduction shortfall, or a
        lattice whose shortest vector is itself outside L0 (shape). The
        instrument separates them by computing SVP(L) exactly at small D. A
        residual collision that the instrument CANNOT separate is
        pre-declared: at large D where exact SVP is unavailable, 'BKZ-beta's
        first vector not in L0' is consistent with both mechanisms, and the
        record reports such cells as undecided rather than attributing them.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable 'reducer output not a certificate' fixed and
          vary the forgotten structure -- the reducer, its block size, its
          precision -- while L0 stays fixed. The intrinsic invariant that
          distinguishes shape from reduction failure is membership of SVP(L)
          in L0, which does not depend on the forgotten structure at all.
        predicted_gain: >-
          Every failed cell becomes attributable, and the campaign's
          completion criterion 2 (achieved frontier against dimension with
          reduction quality) gains a cause column.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the residual profile through the reducer as a stronger state
          than the success bit, so that the iteration at which a certificate
          first appears is recorded and can drive an early abort in
          brute-force-over-excess loops.
        predicted_gain: >-
          A by-product only; a constant-factor saving in the brute-force
          term, stated and not counted.
    quantifier_order: >-
      FOR EACH known-answer instance and EACH cell (n, D, u) there EXISTS an
      exact attribution (shape, reduction, read-off, or undecided). The
      claimed regularity -- that the reduction part grows with D and the
      shape part is the smaller at affordable D -- is a statement about the
      tested grid and the tested construction only, and does not quantify
      over constructions, shift sets or reducers not run.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: for the tested construction, grid and reducers, an exact
        per-cell attribution of failure and the exact oracle-success region
        G* at dimensions where SVP is enumerable. It cannot certify anything
        about a construction not run, cannot extend G* beyond enumerable D
        except heuristically, and moves no bound.
      nearby_object_control: >-
        THE WRONG-ROOT KERNEL. Compute L0' as the kernel of evaluation at a
        random point x0' in the same window that is NOT the root. On L0' the
        desired conclusion (a short certifying vector exists) is known false
        at every cell where the true instance succeeds, because a short
        lattice polynomial vanishing at an arbitrary point would contradict
        the Howgrave-Graham counting. If lambda_1(L0') is not much larger
        than lambda_1(L0) at cells where the true instance succeeds, the
        instrument has not identified the load-bearing structure and nothing
        may be read from it.
    proof_obligations:
      - claim: >-
          ev is Z-linear on L and L0 = ker(ev) intersect L has rank D - 1.
        responsibility: correctness
      - claim: >-
          A nonzero vector of L0 certifies x0 among the integer roots of its
          polynomial.
        responsibility: correctness
      - claim: >-
          Every vector of L outside L0 has scaled norm at least (modulus
          power)/sqrt(D), by the contrapositive of Howgrave-Graham.
        responsibility: size
      - claim: >-
          Exact SVP on L and L0 is feasible at the declared dimensions within
          the declared budget.
        responsibility: feasibility
      - claim: >-
          The wrong-root control separates by the declared margin before any
          frontier cell is attributed.
        responsibility: strictness
      - claim: >-
          Scope limited to univariate constructions, tested grid, tested
          reducers, known-answer instances.
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      One small-root construction has been filed as KN-LIT from primary text
      and reproduced per GOAL-RSA-002's next_action; this record binds to
      whichever construction that is and does not choose one itself.
    - >-
      An integer-kernel routine (HNF or modular kernel) and an exact SVP
      enumerator (fpylll or equivalent) are available in the harness; if
      neither is, the shape arm is an infrastructure blocker, not evidence.
    - >-
      Instances are seeded known-answer instances with p, q recorded, per
      RQ-RSA-d46f02's constraints; the instrument is undefined otherwise.

  predictions:
    - metric: >-
        wrong_root_separation: lambda_1(L0') / lambda_1(L0) at cells where the
        true instance succeeds under LLL
      direction: higher
      minimum_effect: >-
        At least 2^8 at every such cell on the tested grid. Below that the
        instrument is not separating the root from an arbitrary point and no
        attribution may be read.
    - metric: >-
        first_certificate_index i* at cells deep inside the bound (the
        baseline slice)
      direction: different
      minimum_effect: >-
        EXACTLY 1 on every fixture instance. Any other value means the
        pipeline or the kernel computation is wrong and the record halts.
    - metric: >-
        shape_fraction: fraction of failed cells at D <= 40 whose exact
        SVP(L) lies outside L0
      direction: lower
      minimum_effect: >-
        Below 0.5 of failed cells at n in {256, 384, 512}, reported with a
        binomial interval. Above 0.5 the competing explanation (shape
        dominates) holds and is reported as the finding.
    - metric: >-
        reduction_part_decay: width in window bits of the reduction part
        (cells with SVP(L) in L0 but reducer first vector not) across a BKZ
        block-size ladder 2, 10, 20, 30 at fixed D
      direction: lower
      minimum_effect: >-
        Strictly decreasing along the ladder, reaching zero at the block size
        where BKZ returns the exact shortest vector. A reduction part that
        does not shrink with block size is the structural tell of
        docs/inventor-protocol.md section 3 and means the attribution is
        wrong.
    - metric: >-
        shape_part_invariance: the set of shape-failed cells across the same
        block-size ladder and across two reducer implementations
      direction: different
      minimum_effect: >-
        IDENTICAL sets. L0 does not depend on the reducer; any difference is
        a bug.
    - metric: >-
        certificate_violates_HG_rate: fraction of successful cells whose
        certifying vector has scaled norm above (modulus power)/sqrt(D)
      direction: higher
      minimum_effect: >-
        Above 0 at cells within two bits of the operative frontier. If it is
        exactly 0 everywhere, the Howgrave-Graham threshold is operationally
        necessary on this construction and a321ac's slack is the whole story.
    - metric: >-
        kernel_gap_ratio g = lambda_1(L0) / lambda_1(L), exact at D <= 40, and
        its agreement with the Gaussian-heuristic prediction from det(L0)
      direction: different
      minimum_effect: >-
        Reported per cell. Agreement of lambda_1(L0) with GH(L0) within a
        factor 2 on 90 percent of cells validates heuristic H1 below; a
        systematic departure is a finding about the non-randomness of L0 and
        is reported, not absorbed.

  minimal_test:
    design: >-
      SIX STEPS, SMALL SCALE, ALL CHEAP. STEP 0 (blocking): declare the
      construction, shift set, grid n in {256, 384, 512}, D in {12, 20, 30,
      40} for the exact arm and {40, 60, 80} for the reducer-only arm, window
      grid in bits around the published reach, seeds, read-off window k, and
      the BKZ ladder, in a committed file before any run. STEP 1: generate
      known-answer instances and build L; compute L0 by integer kernel of ev
      at the true root; compute the wrong-root kernel L0'. STEP 2 (the
      instrument gates): baseline fixture must give i* = 1; wrong-root
      separation must exceed 2^8. Halt on either failure. STEP 3 (exact arm,
      D <= 40): enumerate SVP(L) and SVP(L0); record membership of SVP(L) in
      L0, g, and GH(L0). STEP 4 (reducer arm, all D): run LLL and each BKZ
      rung on L without the answer; read the residual profile; record i*,
      whether the first vector is in L0, and whether the certifying vector
      violates the Howgrave-Graham threshold. STEP 5: attribute every failed
      cell as shape, reduction, read-off, or undecided; report the shape
      fraction, the reduction-part width along the BKZ ladder, and the
      shape-set invariance across reducers. STEP 6: repeat STEP 4 with a
      second reducer implementation and confirm the shape set is identical.
    controls:
      - >-
        WRONG-ROOT KERNEL (blocking): L0' at a random non-root point in the
        window; separation of at least 2^8 in lambda_1 at every cell where
        the true instance succeeds.
      - >-
        BASELINE FIXTURE (blocking): ten seeded instances deep inside the
        bound with i* = 1, and one cell in 684f4a's region G with SVP(L)
        verified in L0.
      - >-
        REDUCER INVARIANCE: the shape-failed set must be identical across
        reducers and block sizes; it is a property of L0 alone.
      - >-
        DECAY LADDER: the reduction part must shrink monotonically along the
        BKZ ladder, to zero where BKZ is exact.
      - >-
        PRE-REGISTRATION: grid, shift set, seeds, k and ladder frozen in a
        committed file with its hash recorded before the first run.
    required_metrics:
      - wrong-root separation ratio per cell
      - first-certificate index i* per instance and cell
      - membership of exact SVP(L) in L0 per cell at D <= 40
      - shape, reduction, read-off, undecided attribution per failed cell with binomial intervals
      - reduction-part width in window bits along the BKZ ladder
      - shape-set identity check across two reducers
      - certificate-violates-HG rate per cell
      - lambda_1(L0), GH(L0), lambda_1(L), g per cell
      - reduction wall time, peak memory and achieved root-Hermite factor per cell, in the GOAL-RSA-001 / GOAL-ECDSA-001 convention
      - frozen protocol file hash, seeds, artifact manifest with rebuild receipt

  falsification_conditions:
    - >-
      The wrong-root separation is below 2^8 at cells where the true instance
      succeeds. The kernel does not single out the root and the instrument is
      void; no attribution is reported.
    - >-
      The baseline fixture gives i* different from 1 on any instance, or the
      exact shortest vector at a region-G cell lies outside L0. The kernel or
      the pipeline is wrong; the record halts.
    - >-
      The shape-failed set differs between reducers or across block sizes.
      L0 is reducer-independent by construction, so this is a bug and no
      attribution is valid until it is found.
    - >-
      The reduction part does not shrink along the BKZ ladder. The
      attribution of those cells to reduction is wrong and the record must
      say what they are instead.
    - >-
      The shape fraction exceeds 0.5 at D <= 40. Claim (C) is falsified: the
      operative frontier at these dimensions is a shape frontier, stronger
      reduction buys nothing there, and that is the reported finding.
    - >-
      Exact SVP is infeasible at D = 40 within the declared budget. The exact
      arm is scoped down to the largest feasible D and the shape arm above it
      is reported as heuristic only; this is a budget outcome.

  confounders:
    - >-
      TIES AND NEAR-TIES IN lambda_1(L). If several vectors share the minimal
      norm, some in L0 and some not, oracle success is ambiguous. MITIGATION:
      report the count of minimal vectors and treat such cells as undecided.
    - >-
      SCALING CHOICE. L0 is defined on the unscaled coefficient lattice; the
      norm comparison uses the scaled one. MITIGATION: compute the kernel on
      the unscaled columns and pull back through the diagonal scaling, and
      record both.
    - >-
      READ-OFF CONVENTION. Whether success is 'first vector certifies' or
      'some vector in the window certifies' changes the numbers. MITIGATION:
      report i* rather than a binary, so every convention can be read off.
    - >-
      SMALL-D EXTRAPOLATION. The exact arm stops near D = 40 and the reach at
      1024 or 2048 bits needs larger D. MITIGATION: no extrapolation of the
      shape fraction beyond enumerable D is made; large-D cells carry the
      undecided label where SVP is unavailable.
    - >-
      GAUSSIAN HEURISTIC ON A STRUCTURED SUBLATTICE. L0 is far from random.
      MITIGATION: H1 is validated by exact SVP where available and its
      failure is a reportable finding rather than a nuisance.

  interpretation_limits:
    - >-
      CLAIM TIER: statements about a leakage model, a construction, a grid of
      known-answer instances and a reducer budget. Nothing about any deployed
      key, vendor, library or device, per RQ-RSA-d46f02.
    - >-
      A shape failure at a cell is a statement about ONE shift set at ONE
      dimension; it does not say that no shift set reaches the cell.
    - >-
      A reduction failure is a statement about the declared reducer and
      budget; per AGENTS.md rule 3 it is never evidence against a published
      bound.
    - >-
      The instrument requires the answer and therefore cannot be part of an
      attack; its outputs describe why a method failed, not how to make it
      succeed.
    - >-
      Univariate constructions only. The bivariate generalisation needs two
      independent certificates and inherits the algebraic-independence
      heuristic; it is forward work.

  heuristic_assumptions:
    - id: H1
      statement: >-
        KERNEL GAUSSIAN HEURISTIC. For the tested construction and cell,
        lambda_1(L0) lies within a factor 2 of the Gaussian-heuristic value
        GH(L0) = sqrt((D-1)/(2 pi e)) det(L0)^{1/(D-1)}, so that at dimensions
        where exact SVP is unavailable the shape barrier can be predicted from
        det(L0) alone.
      rigorous_support: >-
        RIGOROUS INGREDIENT: Minkowski's theorem, lambda_1(L0) <= sqrt(D-1)
        det(L0)^{1/(D-1)}, an unconditional upper bound. CLASSICAL STATEMENT
        IMITATED: the Gaussian heuristic for a random lattice of the same
        rank and determinant. THE GAP, STATED: L0 is a highly structured
        sublattice of a highly structured lattice, and Coppersmith lattices
        are documented to have unexpectedly dense sublattices, so the
        heuristic may fail in the direction of lambda_1(L0) being MUCH
        smaller than GH; that direction is the one that makes the method
        work better than its bound, and it is a finding if observed.
      validation_plan: >-
        SAMPLE: every cell of the exact arm, n in {256, 384, 512}, D in {12,
        20, 30, 40}, ten seeds each -- about 480 instances. SHORTCUT: none
        needed at these sizes; at larger D the kernel and its determinant are
        still exact and only lambda_1 is unavailable. COMPARISON: the
        empirical distribution of log(lambda_1(L0) / GH(L0)) against the
        narrow band the Gaussian heuristic predicts for random lattices of
        that rank. TAIL CHECK: the smallest ratio observed across all cells
        against the prediction that no ratio falls below 1/2; a ratio far
        below 1/2 is the dense-sublattice signature and is reported with the
        cell. TRANSFER: no extrapolation of H1 beyond the sampled D; the
        sampled parameters are recorded in full.
    - id: H2
      statement: >-
        REDUCER QUALITY MODEL. On the tested lattices the first vector
        returned by LLL with the declared parameters has norm at most
        delta_LLL^{D} det(L)^{1/D} for an achieved root-Hermite factor
        delta_LLL that is stable across seeds at fixed (n, D) to within 0.005.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the LLL guarantee ||b_1|| <= 2^{(D-1)/4}
        det^{1/D}. CLASSICAL STATEMENT IMITATED: the empirical root-Hermite
        factor of LLL on random lattices, close to 1.02 in the literature as
        recalled and NOT verified here. THE GAP: on lattices with a planted
        very short vector -- which is what a successful Coppersmith lattice is
        -- the measured delta is not a property of the reducer but of the
        gap, which is exactly why this record reports lambda_1(L0)/lambda_1(L)
        beside delta rather than delta alone.
      validation_plan: >-
        SAMPLE: achieved delta per instance on every reducer-arm cell.
        COMPARISON: within-cell spread of delta against the 0.005 band, and
        delta on SUCCESSFUL cells against delta on the wrong-root control
        lattice (which has no planted certificate) to expose the gap effect.
        TAIL CHECK: the largest within-cell spread on the grid. TRANSFER:
        none; delta is reported per cell and never carried to another
        construction.

  target_complexity:
    time_exponent: >-
      NO EXPONENT OF ANY SMALL-ROOT BOUND IS CLAIMED OR MOVED. THIS IS AN
      INSTRUMENT AND SAYS SO. Per-cell cost is one integer kernel computation
      on a D x D matrix with entries of about m n bits, one LLL/BKZ run at
      the declared budget, and at D <= 40 two SVP enumerations whose cost is
      2^{O(D log D)} and is affordable at that dimension. Its priority is
      justified as a PREREQUISITE: IDEA-20260901-c75e81 (dimension exponent)
      needs the shape/reduction split to interpret its operative exponent,
      and IDEA-20260901-c7d8f6 (cross-setting transfer) needs the
      reducer-independent statistic g as the quantity to be predicted.
    memory_exponent: >-
      O(D^2 m n) bits for the basis and the kernel; kilobytes to a few
      megabytes on the tested grid. Peak memory is measured and reported per
      cell in the shared convention, not estimated.
    best_known: >-
      For the small-root problem itself, the published construction being
      reproduced, at its published asymptotic reach with dimension
      unquantified. For failure attribution there is no best known: no
      committed record and no opened source attributes a failed cell by
      cause.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic is claimed. What is
      hidden and reported: exact SVP is unavailable above roughly D = 40 to
      60, so the shape arm is exact only there and heuristic (H1) above.
    tradeoff_note: >-
      No time-memory tradeoff is offered. Parallelisation is trivial across
      cells and seeds. The by-product early-abort signal inside a
      brute-force-over-excess loop is at most a constant factor and is not
      counted anywhere.

  dominated_by: >-
    CHECKED ACROSS EVERY ROW OF THE FRONTIER ON TIME, MEMORY AND DATA BEFORE
    ANSWERING. As an attack or a reach improvement: n/a (no result claimed)
    -- no time, memory or leakage point is offered. As a failure-attribution
    instrument: NOT dominated -- IDEA-20260816-684f4a gives a sufficient
    guarantee region from Minkowski without the answer, IDEA-20260816-7d1ed0
    measures read-off completeness only where the window is exhaustible,
    IDEA-20260816-a321ac measures slack from the determinant side, and
    IDEA-20260816-b5b822 infers the binding stage by ablation; none computes
    the necessary condition exactly, and each is strictly weaker on the
    attribution axis while being cheaper on none of the others (the kernel
    computation is negligible beside the reduction every one of them runs).
  sota_delta: >-
    +0 ON EVERY ATTACK AXIS. Reach unchanged, time unchanged, memory
    unchanged. What moves, quantitatively: the number of MEASURED causes
    available for a failed cell goes from zero to three (shape, reduction,
    read-off) plus an explicit undecided label, and the guarantee region
    known to the campaign goes from a Minkowski-bounded subset to the exact
    oracle region at enumerable dimensions.

  discriminated_from:
    - >-
      IDEA-20260816-684f4a computes G from the Minkowski bound on lambda_1(L)
      without the answer; this record computes lambda_1(L) exactly and adds
      L0, so G becomes G* and the undecided band is split by cause.
    - >-
      IDEA-20260816-7d1ed0 measures completeness against exhaustion of the
      window and so is confined to windows of at most about 24 bits; the
      index i* here is available wherever the answer is known by
      construction, at any modulus size.
    - >-
      IDEA-20260816-a321ac holds (D, det) fixed and varies the shift set to
      test whether slack is sufficient; this record holds the shift set fixed
      and asks, from the answer side, whether the threshold is necessary.
    - >-
      IDEA-20260816-b5b822 locates the binding stage by ablation; this record
      locates it by direct measurement, and the two must agree cell by cell,
      which is a cross-check neither can run alone.
    - >-
      IDEA-20260816-7d747d varies the reducer; L0 supplies that audit with an
      invariant that must not move.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.9 that the kernel construction and the two blocking gates behave as
    derived, since they are algebra. 0.5 that claim (C) holds as stated (the
    shape part is the smaller at D <= 40 and the reduction part grows with
    D); the competing reading is at least as plausible on structured
    lattices, and either outcome is a result. 0.3 that H1 fails visibly in
    the dense-sublattice direction at some cells, which would be the most
    interesting single number the record could produce.

