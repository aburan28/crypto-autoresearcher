# IDEA-20261005-a8d8eb
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261005-a8d8eb
  question_id: RQ-ECDLP-002
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    A width-33 window table stores 4294967296 entries and a width-32 table stores 2147483648
  class: representation
  claim: >-
    A window of width 33 stores 4294967296 precomputed entries. A window of
    width 32 stores 2147483648. Four billion two hundred ninety-four million
    nine hundred sixty-seven thousand two hundred ninety-six exceeds two
    billion one hundred forty-seven million four hundred eighty-three thousand
    six hundred forty-eight by 2147483648. The product of the two table sizes is
    9223372036854775808. Their sum is 6442450944. The gap is a table size,
    not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    32 is 4294967296. Two to the power 31 is 2147483648. Two width-32 tables both
    store 2147483648, so that gap is 0 and their product is 4611686018427387904. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-05, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-05, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 2147483648.
    baseline_embedding:
      parameter_slice: The widths 33 and 32 and the sizes 4294967296 and 2147483648.
      reproduction_check: >-
        Two readers must agree that 2 to the power 32 is 4294967296 and that
        2 to the power 31 is 2147483648.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 2147483648 drops the gap. Two width-32
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-32 table.
        predicted_gain: Two billion one hundred forty-seven million four hundred eighty-three thousand six hundred forty-eight fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 4294967296 and 2147483648. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-32 tables. Both store 2147483648, and the gap is 0.
    proof_obligations:
      - claim: The width-33 table stores 4294967296 entries.
        responsibility: size
      - claim: The width-32 table stores 2147483648 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Four billion two hundred ninety-four million nine hundred sixty-seven thousand two hundred ninety-six exceeds two billion one hundred forty-seven million four hundred eighty-three thousand six hundred forty-eight by 2147483648.
  minimal_test:
    design: >-
      Compute 2 to the power 32 and 2 to the power 31. Do not add a
      curve point.
    controls:
      - Two width-32 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-33 table size is not 4294967296.
    - The product of the two sizes is not 9223372036854775808.
  confounders:
    - A width-32 table of size 2147483648 is a different window from a width-31 table of size 1073741824.
    - The integer 4294967296 is also a product of two tables of size 65536, and that product is not this table size.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 2147483648 and 1073741824.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-33 table has size 2 to the power 32, and the
        frozen width-32 table has size 2 to the power 31.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Four billion two hundred ninety-four million nine hundred sixty-seven thousand two hundred ninety-six stored entries versus two billion one hundred forty-seven million four hundred eighty-three thousand six hundred forty-eight, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
