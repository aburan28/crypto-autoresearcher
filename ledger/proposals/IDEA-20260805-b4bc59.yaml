  lossy_projection_identifiability_audit:
    projection: >-
      An instance -- a supersingular curve with its full Hom(E, E^{(p)}) lattice
      and every isogeny in it -- is projected to a single small integer, k_div
      (or k_isog), discarding the curve, the degrees, the primes and the
      isogenies themselves.
    what_is_discarded: >-
      Everything except a count. Two curves with completely unrelated
      endomorphism rings and unrelated minimal degrees routinely share the same
      k_div.
    why_genuinely_lossy: >-
      The fibre over a given k_div contains a positive proportion of all
      supersingular curves -- k_div takes values in a range of size at most a few
      thousand while the instance space has size p/12 -- so the projection is
      astronomically many-to-one and is not a change of coordinates. It also
      propagates deterministically under the operation that matters: k_div is a
      function of the factorisation of D alone, and the algorithm's table
      construction enumerates exactly the divisors the window admits, so the
      retained integer is precisely what the table's success count measures.
    why_compatible_with_the_operations: >-
      The operation is "count the entries of L that pair up". k_div is by
      definition the number of such pairings arising from one degree, so the
      projection commutes with the operation exactly rather than approximately.
    is_it_only_a_change_of_coordinates: >-
      NO, and the failure mode that had to be checked here is the SECOND one --
      constancy. A count that is the same for every instance would have zero
      comparator spread and would be a constant of the apparatus rather than a
      property of the object, which is the mirror failure named in the inventor
      protocol. THE CHECK: k_div is provably non-constant, because it is a
      function of the number of prime factors n of D, and n varies across smooth
      integers of a fixed size -- explicitly, D = 2^m has k_div counting divisors
      in a window of a power of two, while D a product of u distinct primes near
      B has k_div ~ 2^u/sqrt(u); these differ by orders of magnitude. So the
      spread is structurally non-degenerate. The FIRST failure mode (nothing
      discarded) is excluded by the fibre size. Both named, both checked.

  assumptions:
    - >-
      That log d over the divisors of D is approximately normal with the stated
      mean and variance. This is the standard subset-sum central limit heuristic
      and it is WEAKEST exactly where the answer matters most, at small n. The
      experiment therefore computes k_div EXACTLY by divisor enumeration for
      every sampled D rather than using the normal approximation, and uses the
      approximation only as the pre-run forced value to be compared against.
    - >-
      That the paper's X is the right window. Taken verbatim from Algorithm 2
      line 1 with Basso's tighter B^{1/2} noted in Section 1.6.
    - >-
      That smoothness of D and the value of k_div are the only two properties of
      D the algorithm's success depends on. Cyclicity is also required (Lemma
      3.4 obtains it from minimality) and is NOT modelled by a random-integer
      null; that gap is declared and is one of the ways the null could be the
      wrong null.

  predictions:
    - metric: >-
        k_div_forced_check: exact mean of k_div over 10^5 sampled uniform random
        B-smooth integers of size (p/2)^{1/3}, at the paper's own B and p for
        log2 p = 256, compared against the pre-run derived value
      direction: different
      minimum_effect: >-
        PRE-RUN FORCED VALUE 2.2e3 (11.1 bits), derived in PART B under the
        all-primes-near-B caveat. Pre-registered admissible band: the measured
        mean lies in [2^7, 2^15]. Outside that band the derivation is wrong and
        must be redone before any cost consequence is drawn. Inside it, the
        MEASURED value supersedes the derived one for all downstream use.
    - metric: >-
        k_div_min: the minimum of k_div over all sampled B-smooth D <= (p/2)^{1/3}
      direction: higher
      minimum_effect: >-
        EXACTLY >= 1, with no exception, at every sample. This is Lemma 3.4 as a
        theorem, so it is a POSITIVE CONTROL WITH A FORCED VALUE THAT CANNOT
        LEGITIMATELY FAIL: a single sampled B-smooth D with k_div = 0 means the
        window implementation is wrong, and no result from that run may be
        reported. It is included precisely because a control that cannot fail
        for mathematical reasons still detects implementation failure, and this
        corpus has a catalogued failure mode (KN-TECH-1a5b7e) of controls that
        cannot fail for the WRONG reason.
    - metric: >-
        ks_kdiv: two-sample Kolmogorov-Smirnov distance on log2 k_div between
        real minimal degrees (via the Section 4.2 quaternion route) and the
        matched uniform-random-B-smooth null, at log2 p = 256
      direction: lower
      minimum_effect: >-
        Under Heuristic 1 the forced value is 0 up to sampling error; with 10^4
        samples per arm the 95 per cent critical value is about 1.36 *
        sqrt(2/10^4) = 0.019. A measured KS distance above 0.05 is a refinement
        of Heuristic 1 at the operating point in a statistic the paper's own
        experiment could not see. THIS ARM IS GATED: it requires the quaternion
        sampler, and if the sampler cannot be built and VALIDATED within budget
        the arm reports an infrastructure/feasibility outcome and NEVER evidence
        about Heuristic 1 (AGENTS.md rule 5).
    - metric: >-
        n_bar_ratio: ratio of the mean number of prime factors n of the real
        minimal degrees to that of the matched null
      direction: different
      minimum_effect: >-
        Forced value 1.00 under Heuristic 1. This is the diagnostic that
        localises any KS divergence: k_div is 2^n times a tail factor, so a
        divergence driven by n is a different phenomenon from one driven by the
        spread of log l_i, and reporting both separates them instead of leaving
        "the distributions differ".
    - metric: >-
        kisog_mean: mean of k_isog(E, (p/2)^{1/3}) over the enumerated toy
        supersingular population, cross-checked against the overcount factor
        implied by IDEA-20260805-07ff43's class-number sum
      direction: higher
      minimum_effect: >-
        Strictly > 1, since Remark 1 asserts the phenomenon exists. The
        cross-check is the substantive prediction: the two proposals compute the
        same overcount from opposite directions -- here by direct enumeration,
        there as the ratio between the class-number sum and the count of distinct
        curves -- and they must agree within the declared tolerance of 20 per
        cent. A disagreement means at least one of the two derivations is wrong,
        and that is a decisive outcome for both.

  minimal_test:
    design: >-
      Ordered cheapest-first, with the informative half deliberately placed
      before the infrastructure-dependent half so that a truncation degrades
      gracefully.
      T0 (free, reading): retrieve [43], [3], [16] and record the golden-
      collision multiplicity exponent verbatim with page references; retrieve
      Panny's script [36] and record whether it already measures k_isog.
      T1 (free, integer arithmetic, no dependency): sample B-smooth integers by
      constructing factorisations, compute k_div exactly by divisor enumeration,
      and test the PART B forced value and the k_div >= 1 control.
      T2 (free): the null-side distributions of n and of sum (log l_i)^2, and
      the resulting cost consequence for the middle-memory branch under BOTH
      candidate multiplicity exponents, reported as a pair rather than as a
      choice.
      T3 (GATED): the real-degree arm via the Section 4.2 quaternion route. The
      gate is explicit and is checked BEFORE any real-arm number is generated:
      the sampler must reproduce the paper's own two published data points
      (smoothest of 100,000 at p = 5*2^248-1 being 12589-smooth; smoothest of
      10,000 at p = 27*2^500-1 being e^23-smooth) to within the sampling
      variation of those statistics. If it does not, the sampler is not
      validated, T3 does not run, and the outcome is recorded as infrastructure.
    controls:
      - >-
        NULL OBJECT, MATCHED, FORCED VALUE PRE-DERIVED, CAN FAIL: uniformly
        random B-smooth integers of the same dyadic size as (p/2)^{1/3}, at the
        same B. Same shape as the treatment in every respect that the statistic
        sees. Its forced k_div mean is the PART B value; if the measured null
        mean falls outside [2^7, 2^15] the null itself has failed and the
        derivation is refuted before the treatment is looked at.
      - >-
        POSITIVE CONTROL THE SAMPLER MUST PASS BEFORE THE REAL ARM RUNS: the
        paper's own two published extreme-value statistics, reproduced by our own
        sampler. This is a nearby object -- the identical experiment at the
        identical primes -- where the effect MUST appear. If it does not, the
        instrument is broken and NO negative result about Heuristic 1 may be
        reported. This is also the only honest way to reopen the lane that
        NC-3/NC-6 lost to infrastructure.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported: sweep B over
        {B_opt/4, B_opt/2, B_opt, 2 B_opt, 4 B_opt} and report k_div's mean at
        each. k_div must INCREASE with B, because both n and the window half-width
        h = (1/2) log B grow. A k_div that fails to increase with B is the
        canonical artifact tell -- a quantity that does not respond to the
        parameter that should drive it -- and localises the defect to the window
        implementation rather than leaving "it did not work".
      - >-
        DEGENERATE-INSTANCE CONTROL, forced integer value: D = 2^m for m =
        floor(log2 of the target size). Then k_div is exactly the number of
        integers in an explicit interval and is computable by hand. Any
        disagreement is an implementation bug. Free.
      - >-
        ORDERING RULE: the null arm and all forced-value checks are computed,
        recorded and hash-committed before the real arm is generated or examined.
    required_metrics:
      - exact k_div per sample, not a summary, with the sampled factorisation retained
      - mean, median, min, max of k_div per arm and per B in the sweep
      - the distributions of n and of sum (log l_i)^2 per arm
      - KS distance and its critical value at the realised sample sizes
      - the verbatim golden-collision multiplicity exponent from [43] with page reference, or a recorded statement that it could not be obtained
      - the sampler validation result against the paper's two published extremes, before any real-arm statistic

  falsification_conditions:
    - >-
      The measured null mean of k_div falls outside [2^7, 2^15]. PART B's
      derivation is wrong; the cost consequence must be recomputed from the
      measurement and the derived 11-bit figure withdrawn.
    - >-
      Any sampled B-smooth D <= (p/2)^{1/3} has k_div = 0. Lemma 3.4 would be
      contradicted, so the overwhelmingly likely reading is an implementation
      bug; the run is invalid and reports nothing.
    - >-
      k_div fails to increase with B across the graded sweep. Artifact tell; the
      window implementation is wrong.
    - >-
      [43]/[3]/[16] state that the golden-collision cost does NOT improve with
      multiplicity. Then k_div prices nothing, PART C's cost consequence is void,
      and the proposal's first half reduces to a null-object census -- which is
      still a deliverable, and saying so in advance is what stops the result
      being quietly reframed after the fact.
    - >-
      Panny's script already measures k_isog and reports it. The second half is
      then a confirmation rather than a discovery and must be relabelled as one.

  confounders:
    - >-
      SAMPLING SMOOTH INTEGERS IS NOT THE SAME AS CONDITIONING ON SMOOTHNESS. A
      generator that builds factorisations directly can easily produce a
      distribution that is not the conditional distribution of a uniform integer
      given smoothness. The generator must be validated against an exact count at
      a size small enough to enumerate completely, and that validation is a
      required artifact rather than a matter of care.
    - >-
      CYCLICITY. The real degrees carry a cyclicity condition that the
      random-integer null does not. This biases the comparison in an
      undetermined direction and is declared rather than corrected.
    - >-
      MINIMALITY IS A SELECTION. The real D is the MINIMUM of a lattice, not a
      uniform draw; Heuristic 1 asserts the smoothness behaviour is nevertheless
      uniform-like, which is exactly the claim under test. Any k_div divergence
      could therefore be a property of minima rather than a failure of Heuristic
      1 as stated, and the two readings are not separable by this experiment.
      Stating that in advance prevents the stronger reading being taken later.
    - >-
      THE ALL-PRIMES-NEAR-B CAVEAT in PART B is crude and known to be crude. It
      is retained only because a forced value that is stated and then measured is
      worth more than no forced value at all.

  interpretation_limits:
    - >-
      NO EXPONENT MOVES. Every multiplicity here is p^{o(1)}. The deliverable is
      a number of bits inside the o(1), plus a sharper test of a heuristic.
    - >-
      k_div DOES NOT IMPROVE P0 AND NO RECORD DERIVED FROM THIS MAY SAY IT DOES.
      Only k_isog bears on P0, and its effect is bounded above by m*P0 with the
      independence assumption declared false in advance.
    - >-
      A KS divergence in k_div REFINES Heuristic 1 at the tested operating point;
      it does not refute Heuristic 1 as stated, because Heuristic 1 is a
      statement about smoothness probability and k_div is a different functional.
      The strongest admissible conclusion is "the random-integer model is not
      adequate for the finer statistic at this p and B", scoped exactly.
    - >-
      A failure of the T3 gate is an INFRASTRUCTURE outcome and is never evidence
      about Heuristic 1 (AGENTS.md rule 5). This goal has already lost one attempt
      at this lane that way, and the record of that loss stands unretracted.
    - >-
      Claim tier: toy for anything measured at toy p; for the null-side k_div
      arithmetic the tier is a MODEL-INTERNAL computation at the real NIST
      parameters, which is neither toy nor crypto evidence -- it is a property of
      a distribution of integers, and it is labelled as such rather than promoted
      because the primes are big.

  heuristic_assumptions:
    - id: HC-1
      statement: >-
        Under Heuristic 1, the full factorisation of the minimal degree D is
        distributed as that of a uniform random integer of the same size
        conditioned on B-smoothness -- not merely its largest prime factor.
      rigorous_support: >-
        NOT SUPPORTED BY THE PAPER, and this is the honest point of the proposal.
        Heuristic 1 as stated in the frozen text asserts only a smoothness
        PROBABILITY. The full-factorisation version is a strictly stronger
        statement that the paper's Section 4.2 experiment does not test and does
        not claim. Whether the strengthening is warranted is the research
        question.
      validation_plan: >-
        The k_div and n comparisons of T3, gated by the sampler validation.
    - id: HC-2
      statement: >-
        The middle-memory cost with k golden collisions is sqrt(N^3/w) * k^{-e}
        for some fixed e in [1/2, 1].
      rigorous_support: >-
        RECALLED, UNVERIFIED, AND DELIBERATELY LEFT AS A RANGE RATHER THAN
        RESOLVED FROM MEMORY. The paper quotes only the k = 1 form. Both
        endpoints of the range are carried through every downstream number so
        that no result depends on the resolution.
      validation_plan: >-
        Retrieve [43], [3], [16]; record verbatim with page reference; if none
        can be obtained, report both endpoints permanently and never pick one.
    - id: HC-3
      statement: >-
        The subset-sum central limit approximation for log d over divisors is
        adequate at n ~ 13.
      rigorous_support: >-
        Weak at that n, and known to be. Used only for the pre-run forced value;
        every measured k_div is computed exactly by enumeration.
      validation_plan: >-
        Compare the exact enumerated k_div against the normal approximation on
        the same samples and report the approximation's error as a diagnostic.

  target_complexity:
    time_exponent: >-
      Unmoved. p^{1/3+o(1)} at the corner and p^{1/2+o(1)}/w^{1/2} in the middle,
      before and after. The proposal targets the o(1) and says so.
    memory_exponent: >-
      Unmoved. k_div acts on the TIME of the middle-memory branch at fixed
      memory, not on the memory.
    best_known: >-
      As quoted from the frozen paper: Theorem 1.1's p^{1/3+o(1)} time and
      memory; Delfs-Galbraith's p^{1/2}(log p)^{O(1)} at negligible memory; the
      stated interpolation; and Section 4.1's five-row table.
    hidden_overhead: >-
      This proposal quantifies two specific components of the hidden overhead
      (k_div, k_isog) and leaves the rest -- Psi, the per-step modular polynomial
      cost, bits per entry, communication -- explicitly uncharged.
    tradeoff_note: >-
      k_div shifts the middle-memory branch downward in TIME at fixed memory by
      e * log2(k_div) bits with e in [1/2, 1], i.e. by roughly 5.5 to 11 bits at
      NIST-I under the derived k_div, CONDITIONAL on HC-2 and on the measurement
      replacing the derivation. The corner at w = M is unaffected, because with
      the full table in memory the claw is found by lookup and multiplicity buys
      nothing there. So the effect is a rotation of the frontier about its
      right-hand corner, which is a testable geometric signature and is
      pre-registered as one.

  dominated_by: >-
    n/a -- no algorithm is proposed and no Pareto point is claimed; this is a
    measurement of two parameters entering an existing cost model. Rows checked
    before writing that, across time, memory and data/queries, to confirm that
    no existing result already supplies these numbers: the frozen paper (Remark 1
    concedes the phenomenon and quantifies nothing; Section 4.2 measures only
    largest prime factor); Delfs-Galbraith (no table, so no multiplicity);
    [15, 24, 26, 40] as described by the paper (logarithmic-cofactor
    improvements, none of which is a multiplicity count); [3] and [16] (NOT READ
    -- these are the most likely place a golden-collision multiplicity treatment
    already exists, which is why retrieving them is stage T0 rather than an
    afterthought); Panny's [36] (NOT RETRIEVED, and Remark 1 suggests it may
    already observe k_isog); and this corpus, where no record measures either
    quantity. Absence of a search result is not evidence of absence.
  sota_delta: >-
    Exponents: 0.000 in time and 0.000 in memory. Conditional concrete delta on
    the middle-memory branch only: e * log2(k_div) bits with e in [1/2, 1] and
    log2(k_div) derived at 11.1 before measurement, i.e. 5.5 to 11.1 bits at
    log2 p = 256, and exactly 0 bits at the full-memory corner. Every one of
    those figures is conditional on HC-2, which is an unretrieved citation, and
    on the derivation of PART B being replaced by its measurement. On the
    Heuristic-1 side the delta is not a number: it is the difference between a
    heuristic validated in one statistic and the same heuristic tested in a
    strictly finer one.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the free half (T0-T2) produces a usable measured k_div distribution
    and a defensible cost consequence, because it needs nothing the container
    lacks and its controls are exact integer identities. 0.35 that the gated half
    (T3) runs at all, because it requires building and VALIDATING a quaternion
    maximal-order sampler without SageMath, and this goal has already lost one
    attempt at precisely that; the 0.35 is not lower only because the validation
    target is published and exact, so failure will at least be unambiguous.
    0.30 that the KS test, if it runs, shows a divergence above 0.05 -- Heuristic
    1 is a standard-shaped assumption, the paper's own data align with it in the
    coarser statistic, and the prior should be against finding a crack. It is not
    lower than 0.30 because minimality IS a selection, the finer statistic has
    genuinely more power, and no one has looked.
