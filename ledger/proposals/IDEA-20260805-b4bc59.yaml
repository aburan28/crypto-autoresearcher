idea:
  id: IDEA-20260805-b4bc59
  question_id: RQ-WESO-8aff57
  added: '2026-08-05'
  title: >-
    Two unpriced multiplicities: the divisor-window claw count k_div, which is a
    pure integer statistic derivable with no curve machinery and which prices the
    middle-memory branch, and the isogeny multiplicity k_isog of Remark 1, which
    is the only measured route to improving P0 -- with a matched null that turns
    the first into a sharper test of Heuristic 1 than the paper's own
  class: control

  claim: >-
    The frozen paper's Remark 1 concedes that its success probability P0 is a
    lower bound, because "there are generally multiple small (non-cyclic)
    isogenies E -> E^{(p)}, and it is sufficient for any one of them to be
    smooth", and then says "this phenomenon is absorbed in the hidden term of the
    asymptotic complexity". P0 multiplies every row of every concrete cost
    estimate this goal has produced, and the phenomenon has never been quantified
    here or, as far as the frozen text shows, there. This proposal separates the
    concession into TWO distinct multiplicities that the paper conflates, prices
    each, and shows that one of them is measurable at ZERO curve cost.
    (i) k_div(D) = #{d | D : D/X <= d <= X}, X = B^{1/2}(p/2)^{1/6}: the number
    of ways a single smooth degree D splits into an admissible meet-in-the-middle
    pair. Lemma 3.4 proves k_div >= 1 whenever D is B-smooth; the paper uses
    exactly that, and never asks how much larger it is. k_div does NOT change P0
    -- D is smooth or it is not -- but it is precisely the golden-collision
    MULTIPLICITY of the middle-memory branch, where the cost of finding one of k
    golden collisions falls with k. A derivation given below, using only the
    approximate normality of log d over the divisors of a smooth number, forces
    k_div ~ 2^n * sqrt(2/(pi n)) with n = number of prime factors of D, and at
    the paper's own NIST-I parameterisation n ~ u ~ sqrt(log(p/2)) ~ 13, giving
    k_div of order 10^3. That is an unpriced factor of order 10 bits sitting
    inside the branch this goal's objective (b) is about, and IT IS COMPUTABLE
    FROM INTEGER ARITHMETIC ALONE.
    (ii) k_isog(E, Y) = #{d <= Y : there is an isogeny E -> E^{(p)} of degree d}:
    the multiplicity Remark 1 actually names. This one DOES raise P0, because
    each admissible degree gets an independent chance of being smooth. It is also
    exactly the overcount factor in the class-number sum of
    IDEA-20260805-07ff43, so the two proposals measure the same object from
    opposite sides and must agree.
    (iii) THE MATCHED NULL, which is the part that makes this a Heuristic-1 test
    rather than a bookkeeping exercise. Heuristic 1 asserts that deg(phi) has the
    smoothness behaviour of a uniformly random integer of the same size. The
    paper validates that against ONE statistic -- the cumulative distribution of
    the largest prime factor (Section 4.2, Figures 1 and 2). k_div is a strictly
    finer functional of the SAME object: it depends on the whole factorisation,
    not on its top element. So the identical claim can be tested against a null
    of uniformly random B-smooth integers of the same size, in a statistic with
    more power, and a divergence in k_div with agreement in largest-prime-factor
    would be a real refinement of Heuristic 1 that the paper's own experiment
    could not have seen.
    NO EXPONENT MOVES. Every quantity here is p^{o(1)}. The proposal is offered
    because P0 multiplies all eighteen of this goal's committed margin rows
    identically, has never been tested in four batches, and half of the work
    needs no elliptic curve, no quaternion sampler and no SageMath -- which
    matters because the previous attempt at this lane (NC-3/NC-6) died on exactly
    that infrastructure.

  object_first_candidate:
    tracked_object: >-
      The MULTISET OF ADMISSIBLE SPLITTINGS of a single instance: for one curve
      E, the set of pairs (psi, eta) with eta o psi : E -> E^{(p)}, deg psi <= X,
      deg eta <= X, both B-smooth. Followed through the computation, this multiset
      is what the meet-in-the-middle table actually contains, and its CARDINALITY
      is the quantity every cost statement in the paper implicitly sets to 1.
      The projection to integers is k_div (splittings of one fixed degree) and
      the projection to degrees is k_isog (distinct admissible degrees).
    established_families_off_limits: >-
      Off-limits as the primary lens: van Oorschot-Wiener and distinguished-point
      machinery (this proposal supplies an INPUT to any such cost model and must
      not become a re-derivation of one); Delfs-Galbraith; claw-finding as an
      algorithm; quaternion/KLPT endomorphism computation as a method (it appears
      only as the paper's own sampling device in Section 4.2, and only inside a
      feasibility gate); and the per-entry cost calibration lane of BATCH-002 and
      BATCH-003, no value from which is used, cited or contradicted here.
      ALSO OFF-LIMITS, and this one is unusual enough to state: the
      largest-prime-factor statistic itself. The paper already ran it; running it
      again is the regression this rule exists to block, and the whole point of
      k_div is that it is a different functional of the same data.
    newness_score: >-
      k_div is elementary -- it is a divisor count in a window -- and this record
      claims no novelty for the notion. What is new is (a) noticing that the
      paper's own Lemma 3.4 only ever uses k_div >= 1 while the middle-memory
      branch it discusses is priced by k_div itself, (b) the forced value derived
      below, and (c) using k_div as a Heuristic-1 test statistic strictly finer
      than the published one. Item (c) is the part with research content.
    testability_score: >-
      Split, deliberately. Half is free: the k_div distribution for uniform
      random B-smooth integers of size (p/2)^{1/3}, at the actual NIST parameter
      sets, is pure integer arithmetic in Python -- generate smooth integers by
      sampling prime factorisations directly, no factoring required, no
      dependency beyond the standard library. The other half, the real
      distribution, needs the quaternion sampler of Section 4.2 and is gated
      behind an explicit feasibility check, because that sampler is exactly what
      failed in this goal's last attempt at the Heuristic-1 lane.
    survival_score: >-
      k_div survives the whole way to a cost model: it is the multiplicity
      parameter of the middle-memory branch and it enters that branch's cost
      under a power that the retrieval of [43]/[3]/[16] will settle. k_isog
      survives to P0 and hence to every margin row. Neither dissolves.

  mechanism: >-
    Natural logarithms throughout. X = B^{1/2}(p/2)^{1/6} as in Algorithm 2
    line 1; D = deg(phi) <= (p/2)^{1/3} the degree of the minimal isogeny;
    L = log(p/2).

    PART A - WHAT LEMMA 3.4 ACTUALLY PROVES, AND WHAT IT LEAVES ON THE TABLE.
    The proof of Lemma 3.4 takes the prime factorisation D = prod_{i=1}^{n} l_i
    with all l_i <= B, lets k be the largest index with prod_{i<=k} l_i <= X, and
    shows deg(eta) = D/prod_{i<=k} l_i <= l_{k+1}(p/2)^{1/3}/X <= B (p/2)^{1/3} /
    (B^{1/2}(p/2)^{1/6}) = X. So it exhibits ONE admissible splitting, using a
    greedy prefix in one fixed ordering of the primes. The set of ALL admissible
    splittings is
      K(D) = {d : d | D, D/X <= d <= X},   k_div(D) = #K(D),
    an interval condition on log d of the form
      log D - log X  <=  log d  <=  log X,
    i.e. log d lies within +-(log X - (1/2) log D) of the centre (1/2) log D.
    The half-width is
      h = log X - (1/2) log D = (1/2) log B + (1/6) L - (1/2) log D,
    which at the worst case D = (p/2)^{1/3} is exactly h = (1/2) log B, and which
    GROWS as D shrinks. So the window is centred exactly on the median divisor
    and has half-width at least half a log B.

    PART B - THE FORCED VALUE FOR k_div. Write the divisors of D as subsets S of
    the multiset {l_1, ..., l_n}, so log d = sum_{i in S} log l_i. Under a uniform
    random subset (each l_i independently in or out with probability 1/2), log d
    has mean (1/2) log D and variance sigma^2 = (1/4) sum_i (log l_i)^2. So
      k_div(D) = 2^n * Pr[|log d - (1/2) log D| <= h]
               ~ 2^n * erf( h / (sigma sqrt 2) ).
    In the regime the algorithm operates in, D is a B-smooth integer of size
    (p/2)^{1/3} chosen for its smoothness, so its prime factors are typically
    spread over [2, B] and n >= L/(3 log B) = u. Taking the crude but decidable
    case all l_i ~ B: n = u, sigma = (1/2) log B sqrt(u), h = (1/2) log B, so
      h / sigma = 1/sqrt(u),  and  k_div ~ 2^u * sqrt(2/(pi u)).
    At the paper's own asymptotic choice B = e^{(1/3)sqrt(L)} one has
    u = sqrt(L); at log2 p = 256, L = log(2^255) = 176.8, u = 13.3, giving
      k_div ~ 2^{13.3} * sqrt(2/(pi * 13.3)) ~ 10100 * 0.219 ~ 2.2 * 10^3,
    i.e. about 11 bits of multiplicity. THIS NUMBER IS DERIVED, NOT MEASURED, AND
    IT IS DERIVED UNDER A CRUDE ALL-PRIMES-EQUAL-B CAVEAT WHICH THE EXPERIMENT
    REPLACES BY THE ACTUAL SMOOTH-NUMBER FACTORISATION DISTRIBUTION. It is
    recorded here as the pre-run forced value against which the measurement is
    compared, in the sense the inventor protocol requires: a forced value that
    comes out wrong is the fastest falsification available.

    PART C - WHERE THE MULTIPLICITY DOES AND DOES NOT ACT. This distinction is
    the reason the proposal exists and it must not be blurred.
      k_div DOES NOT CHANGE P0. Algorithm 2 succeeds iff D is B-smooth; the
      number of admissible splittings of a smooth D is irrelevant to whether it
      is smooth. A record that claims k_div improves the success probability is
      wrong, and this record pre-emptively forbids that reading.
      k_div DOES CHANGE THE MIDDLE-MEMORY BRANCH. The frozen paper prices that
      branch as sqrt(N^3/w), which is the standard cost of locating ONE golden
      collision among the spurious ones. With k golden collisions the cost falls;
      whether it falls as 1/k or as 1/sqrt(k) is exactly what [43] settles and
      this record REFUSES TO ASSERT EITHER. Under 1/sqrt(k) with k ~ 2.2e3 the
      middle-memory branch is about 5.5 bits cheaper than the paper's line at
      NIST-I; under 1/k, about 11. Both are stated as conditional on a retrieval
      that has not happened.
      k_isog DOES CHANGE P0, and is the only thing in this proposal that does.
      If a curve admits m distinct degrees d <= (p/2)^{1/3} of isogenies to its
      conjugate, and their smoothness events were independent, the per-attempt
      success probability would be 1 - (1 - P0)^m ~ m P0 for small P0. They are
      NOT independent -- the degrees come from one rank-4 lattice and share
      arithmetic -- so m P0 is an upper bound and the dependence is itself the
      measurable quantity. Stating the independence assumption as false in
      advance, rather than adopting it and discovering the correlation later, is
      the point of naming it here.

    PART D - THE MATCHED NULL AND WHY IT IS A REAL TEST OF HEURISTIC 1. Heuristic
    1 says: the degree of the smallest isogeny E -> E^{(p)} is B-smooth with the
    probability a uniformly random integer of the same size would have. Section
    4.2 tests this through the CDF of the largest prime factor. k_div is a
    functional of the entire factorisation: it is 2^n times a normal tail
    determined by the second moment of {log l_i}. Two distributions can agree in
    largest prime factor and differ in n and in sum (log l_i)^2 -- for instance if
    the real degrees have systematically more small prime factors, which is
    precisely what one would expect if the lattice minimum were biased toward
    degrees divisible by small primes (short vectors in a quaternion order are
    not arithmetically neutral). SO THE NULL IS: draw uniform random integers of
    size (p/2)^{1/3}, condition on B-smoothness, compute k_div, and compare
    against the real degrees' k_div. Under Heuristic 1 the two distributions are
    identical. The comparison statistic is pre-registered as the two-sample
    Kolmogorov-Smirnov distance on log2 k_div together with the ratio of means.

    PART E - THE ZERO-CURVE HALF, AND WHY IT IS SCHEDULED FIRST. Everything in
    PART B and the NULL side of PART D needs no curve, no quaternion, no
    SageMath, no fpylll, and no network: a B-smooth integer of a given size is
    generated by sampling its factorisation directly (repeatedly draw primes
    <= B with the density that makes the product land in the target dyadic
    range), so no integer is ever factored. Verified in this session: the
    container has numpy 2.4.6 and Python 3.11.15, and has NO sympy and NO
    SageMath. The design therefore uses neither. This matters concretely: this
    goal's own next_action records that the previous Heuristic-1 attempt
    (NC-3/NC-6) failed on the SageMath/g6k environment, and AGENTS.md rule 5 says
    that outcome was never evidence about Heuristic 1. Making the informative
    half of the lane infrastructure-free is the direct response.

  novelty_status: unverified

