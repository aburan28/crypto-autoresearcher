    rational-fibre count in Stage 4 comes out at 2, closing (E). 0.35 that Stage 0
    finds the law, or a recognisable equivalent, already in Cheng-Kodera-Miyaji
    2019 - which is why Stage 0 is a hard gate and not a formality.

