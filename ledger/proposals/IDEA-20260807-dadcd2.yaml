  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that (L1) verifies symbolically for the four g = 2 models at m = 3 -
    the fibre count is elementary and EV-REP-001/002 already observed the
    consequence empirically. 0.6 that the Hessian x comes out at exactly 9 rather
