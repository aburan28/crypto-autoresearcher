idea:
  id: IDEA-20260807-dadcd2
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    THE RATIONAL-DECK-GROUP LAW FOR CURVE MODELS - the per-variable degree of a
    model's summation polynomial is g^(m-2) and the Bezout number at fixed
    factor-base size is B^(m-1)/g, where g is the order of the F_p-RATIONAL part
    of the deck group of the coordinate map; on a prime-order curve g = 2 for
    every model, so the model lever on the decomposition system is exactly 1,
    and the obstruction is ARITHMETIC (rationality) rather than the usual
    birational-invariance handwave
  class: mechanism

  claim: >-
    (A) THE SETUP, STATED SO IT IS CHECKABLE. Let E/F_p be an elliptic curve with
    identity O. Define a MODEL of E to be a choice of non-constant rational map
    f from E to P^1, defined over F_p - the "coordinate" whose values form the
    factor base. Short Weierstrass takes f = x; Montgomery takes f = x_M;
    twisted Edwards takes f = y; the Kummer line takes f = the quotient map
    E -> E/{+-1}; Hessian can take f = x or f = x+y; and one may also take f to
    be pulled back along an isogeny. Define S_m^f, the m-th summation polynomial
    IN THE MODEL f, as the reduced defining polynomial of the Zariski closure of
      {(f(P_1),...,f(P_m)) : P_i in E(Fbar_p), P_1 + ... + P_m = O}
    inside (P^1)^m. For f = x this is exactly Semaev's S_m (KN-TECH-002), which
    harness/semaev.py implements as s3_expr and s4_expr for y^2 = x^3 + ax + b.

    (B) THE LAW. Let n = deg f and let
      Gamma_f = {gamma in Aut(E,O) : f o gamma = f}
    be the part of the deck group of f consisting of GROUP automorphisms, and let
    g = |Gamma_f(F_p)| be the order of its F_p-rational part. Then
      (L1)  deg_{t_m} S_m^f  =  g^(m-2)      when f is the quotient map by Gamma_f
      (L2)  deg_{t_m} S_m^f  <=  n^(m-1)     always
      (L3)  a factor base cut out by a degree-d membership polynomial in the
            coordinate f contains B = g*d points OF E(F_p), not n*d - because a
            geometric fibre of f has n elements but only the Gamma_f(F_p)-orbit
            of a rational point is rational
      (L4)  hence the Bezout number of the arity-m decomposition system
            {S_m^f(t_1,...,t_{m-1}, f(R)) = 0} union {membership(t_i) = 0}
            at FIXED rational factor-base size B is
              Delta_f  =  g^(m-2) * (B/g)^(m-1)  =  B^(m-1) / g.

    (C) THE COROLLARY THAT CLOSES THE LANE ON CRYPTOGRAPHIC CURVES.
    Gamma_f(F_p) is a subgroup of Aut(E,O)(F_p), which is {+-1} unless j = 1728
    (order 4) or j = 0 (order 6). So g <= 6 always, and g = 2 for every ordinary
    curve of generic j. Therefore
      Delta_f is between B^(m-1)/6 and B^(m-1)/1 for EVERY model of EVERY curve,
      and equals B^(m-1)/2 for EVERY model of a generic-j curve.
    Short Weierstrass x, Montgomery x, twisted Edwards y, the Kummer line and the
    Hessian symmetric coordinate x+y ALL realise g = 2 and are therefore EXACTLY
    TIED on this functional. A model can only LOSE (a non-Galois coordinate such
    as the Hessian x has g = 1 and Delta = B^(m-1), a factor 2 worse) and can
    only WIN by at most a factor 3 (g = 6, requiring j = 0 and 6 | p - 1).

    (D) WHY THE OBSTRUCTION IS ARITHMETIC AND NOT THE USUAL ONE. The standard
    dismissal of this lane is "birational equivalence is an isomorphism of
    function fields, so the geometry cannot change". That is true and it is not
    what does the work here. The load-bearing step is (L3): the coordinate degree
    n counts GEOMETRIC preimages, the factor base counts RATIONAL ones, and the
    two agree only on the F_p-rational part of the deck group. This is what kills
    the most attractive candidate in the lane, which the geometric argument alone
    does NOT kill - see (E).

    (E) THE CANDIDATE THIS KILLS, WORKED THROUGH, BECAUSE IT IS THE ONE THE
    INHERITED ANALYSIS LEFT OPEN. inputs/refs/research/
    proofs_Dreg_conservation_weil_invariance.md, PO-001 section 1.5 item C2,
    names "a genuine rational map (e.g. a 2-isogeny x-coordinate map, which is a
    degree-2 rational function)" as "the strongest surviving candidate to break
    conservation". Take f = x' o pi with pi : E -> E/<T> an F_p-rational cyclic
    ell-isogeny, x' the Weierstrass coordinate on the codomain. Then deg f = 2ell,
    f is invariant under negation AND under translation by T, and a direct fibre
    count gives deg_{t_m} S_m^f = 2^(m-2) - NO WORSE than Weierstrass despite the
    coordinate having degree 2ell. Naively B = 2ell*d, so Delta_f = 2^(m-2) d^(m-1)
    = B^(m-1)/(2 ell^(m-1)): a factor ell^(m-1) BETTER than Weierstrass, growing
    with m. That is the whole apparent prize of the lane and the geometric
    argument does not touch it.
    It dies on (L3). On a curve of prime order N, E(F_p) = Z/N has no rational
    ell-torsion for ell < N, so T is irrational; the geometric fibre {+-P + jT}
    has 2ell elements but only {+-P} are rational. Hence B = 2d, not 2ell*d, and
    Delta_f = B^(m-1)/2 exactly - tied with Weierstrass, no gain. The prize was
    an artifact of counting geometric points as if they were rational.

    (F) WHAT THIS ARGUMENT DOES *NOT* CONSTRAIN, WHICH IS WHY L11 IS NOT
    VACUOUS AND MUST NOT BE CLOSED WHOLESALE. The law fixes a DEGREE and a
    BEZOUT COUNT. It says nothing about:
      (F1) the MONOMIAL SUPPORT of S_m^f. Short Weierstrass S_3 has 13 of the 27
           possible monomials of multidegree <= (2,2,2) (hand-expanded below);
           a generic Moebius reparametrisation has 27; twisted Edwards y is
           predicted to have at most 14, all of even total degree. Support drives
           the BKK mixed volume (KN-TECH-007), which the program has already
           converted into a measured 2-5x speedup (KN-FIND-2a8b7e) and a proved
           (m+1)/2 bound (KN-FIND-c7d31e). Support is NOT a birational invariant.
      (F2) the NEWTON POLYTOPE and hence the mixed volume itself.
      (F3) the COEFFICIENT SIZES / heights, which no degree argument sees.
      (F4) SYMMETRIES induced by RATIONAL TORSION TRANSLATIONS. These are NOT in
           Aut(E,O) and so contribute nothing to g, but a rational 2-torsion point
           descends to an involution of the Kummer line and imposes a grading on
           S_m^f. That is precisely the mechanism of Faugere-Gaudry-Huot-Renault
           (KN-LIT-004) and it is a real constant-factor gain - available exactly
           when the curve has a cofactor, i.e. never on a prime-order curve.
      (F5) anything about genus-2 Kummer surfaces / theta / Mumford
           representations, which PO-004 section 2.2 of the same inherited
           document explicitly leaves OPEN.
    Forward guidance is therefore: stop looking for a model with a lower DEGREE,
    which (B)-(C) forbid; look at support, polytope, coefficient height, and the
    cofactor-dependent torsion symmetries - and note that the last of these has a
    hard arithmetic ceiling on prime-order curves.

  resource_label: >-
    R2 (the curve equation / model - it changes the polynomial system, not the
    group), with R1 as the downstream consumer (x-coordinates as field elements).
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE, AND THE ADMISSIBILITY IS THE INTERESTING PART. The proposal
    consumes R2: it changes the ideal whose Groebner basis is computed, and the
    coefficients of that ideal are field data that no generic-group simulator
    (KN-FIND-b7e091) can produce, because the simulator has access to group
    labels and equality tests only and never to the ring F_p in which S_m^f
    lives. So this is NOT closed by the exponent-1/2 argument. It is closed by a
    DIFFERENT and weaker-sounding but here decisive bound - the rational deck
    group - and the point of filing it is that the two closures are independent.
    Note also that this lane does not apply phi to points of G, so H-ENDO-001
    does not bite; the scalar-action argument is irrelevant here.

  discriminated_from:
    - >-
      H-REP-001 / EV-REP-001 / EV-REP-002 / DEC-20260716-002 / KN-FIND-023, which
      recorded d_reg = 2 invariance between Weierstrass Semaev and twisted Edwards
      at m = 2, 3 at toy scale. Those are EMPIRICAL and their metric saturated
      (see IDEA-20260807-1354d8). This is a DERIVATION that predicts that
      invariance, extends it to every model of every prime-field curve, and gives
      the exact exception set (j = 0 and j = 1728, factor at most 3) that the
      empirical work could not have found because it did not sample those curves.
    - >-
      The inherited PO-001 (D_reg-conservation under S_m-EQUIVARIANT coordinate
      change) in inputs/refs/research/proofs_Dreg_conservation_weil_invariance.md.
      PO-001 quantifies over changes that are equivariant for the SYMMETRIC group
      permuting summands - the e-ring and power-sum changes. This proposal
      quantifies over PER-VARIABLE changes of the coordinate map itself, which
      PO-001 explicitly does not cover and lists as escape route C2. Different
      quantifier, different theorem, and this one settles C2.
    - >-
      PO-004 (Semaev per-variable degree invariant under scalar Weil restriction),
      same document. That is about re-encoding the FIELD; this is about changing
      the FUNCTION. PO-004's own section 2.2 leaves the Kummer/theta route OPEN
      and this proposal does not close it either - see interpretation_limits.
    - >-
      KN-FIND-a1f3c2 (Semaev monodromy is C_2^(m-2) universally). That finding
      computes the Galois group of S_m in the SHORT WEIERSTRASS x-coordinate and
      concludes there is no exceptional CURVE. The quotient C_2^(m-1)/{sigma_all}
      appearing there is the same diagonal-quotient step as (L1) here, which is
      corroboration, not duplication - this proposal makes the deck group the
      PARAMETER and indexes over MODELS rather than over curves.
    - >-
      KN-TECH-018 (sqrt(|Aut|) rho discount). That is a square root of the
      automorphism order in a WALK. This is a full factor |Aut| in the BEZOUT
      NUMBER of an ALGEBRAIC system. Same input quantity, different exponent,
      different algorithm; the coincidence of |Aut| appearing in both is worth
      recording and is not evidence for either.

  object_first_candidate:
    tracked_object: >-
      THE RATIONAL DECK GROUP OF THE COORDINATE MAP: the pair
      (Gamma_f(F_p), n = deg f) attached to a model f, tracked as the model varies
      with the curve, the points and the group all held fixed.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this lane, since the corpus
      reports the target as heavily mined: Pollard rho and its variants; BSGS;
      Semaev index calculus IN THE SHORT WEIERSTRASS COORDINATE as an algorithm
      to be tuned; Weil descent and cover attacks; pairing transfer; lattice/HNP.
      The object here is a property of the COORDINATE MAP, not of the curve and
      not of the solver. Per KN-OPEN-019 this program has no written
      object-enumeration for the ECDLP, so this is a candidate object, not a slot
      in a taxonomy.
    lossiness: >-
      GENUINELY LOSSY AND THE LOSS IS COMPATIBLE WITH THE OPERATIONS, which is
      the lossy-projection test of docs/inventor-protocol.md and it is passed
      algebraically here, before any compute. The projection E -> P^1 given by f
      forgets exactly the Gamma_f-orbit structure: f(P) determines P only up to
      Gamma_f. It is not a change of coordinates, because |f^(-1)(t)| = n > 1, so
      f is strictly non-injective. The retained part propagates deterministically
      under the operation the target actually uses - "sum m points to O" - because
      Gamma_f consists of GROUP automorphisms, so
      f(sum gamma_i P_i) depends only on (f(P_i)) up to the residual Gamma_f
      action, and that residual action is exactly what S_m^f encodes. A coordinate
      whose deck group is NOT inside Aut(E,O) fails this compatibility and its
      summation polynomial has no diagonal quotient - which is (L2) versus (L1),
      and is why the Hessian x is worse.
    propagation: >-
      One step of the operation "add a point" sends the fibre Gamma_f P to
      Gamma_f P + Q, which is a Gamma_f-orbit only when Gamma_f is normalised by
      translation - true for Gamma_f in Aut(E,O) acting on the SUM, which is why
      the m-fold relation and not the single addition is the right operation.
      This is the precise sense in which the object survives the decomposition
      problem but not the group law taken one addition at a time.
    survival_score: >-
      Survives every change of MODEL (that is the content). Dies at a change of
      FIELD OF DEFINITION - the whole point of (L3) is that g is a rational
      invariant, and over F_{p^k} with k large enough to make T rational, g grows
      and the law predicts a genuine gain. That is a real and testable
      discriminator: the same construction that is worthless over F_p should
      become worth ell^(m-1) over the field where the isogeny kernel is rational.

  mechanism: >-
    STEP 1 - PROVE (L1) AND (L2). Fix generic t_1,...,t_(m-1). By definition of
    the reduced defining polynomial, deg_{t_m} S_m^f equals the number of DISTINCT
    values of f(-(P_1 + ... + P_(m-1))) as each P_i ranges over the fibre
    f^(-1)(t_i). Each fibre has n elements, giving (L2). If f is the quotient by
    Gamma_f (so n = |Gamma_f|), write P_i = gamma_i Q_i; then substituting
    gamma_i -> gamma*gamma_i simultaneously for all i sends the sum to
    gamma(sum gamma_i Q_i) because every gamma is a GROUP automorphism, and f is
    Gamma_f-invariant, so the value is unchanged. Hence the value depends only on
    the class of (gamma_i) in Gamma_f^(m-1) modulo the diagonal, giving at most
    |Gamma_f|^(m-2) values, with equality for generic parameters. For
    Gamma_f = {+-1} this is 2^(m-2), reproducing Semaev exactly (KN-TECH-002) -
    which is the baseline-reproduction check.

    STEP 2 - PROVE (L3). Let t be an F_p-rational value of f and P a rational
    point with f(P) = t. Every element of f^(-1)(t) is gamma P for some gamma in
    the geometric deck group. gamma P is F_p-rational iff gamma is fixed by
    Frobenius composed with the stabiliser bookkeeping; for gamma in Aut(E,O) this
    reduces to gamma being defined over F_p. Hence the rational fibre is
    Gamma_f(F_p) P, of size g. Summing over the d roots of the membership
    polynomial gives B = g*d.

    STEP 3 - ASSEMBLE (L4). The system has m-1 summand variables each constrained
    to degree d, and one summation equation of per-variable degree g^(m-2). The
    multi-homogeneous Bezout number is g^(m-2) * d^(m-1). Substituting d = B/g
    gives B^(m-1)/g. This matches the program's own convention in
    IDEA-20260803-e2f5bd, which writes Delta ~ 2^(m-2) * d_p^(m-1) for the
    Weierstrass case - substituting g = 2, d_p = B/2 reproduces it exactly.

    STEP 4 - THE AUT BOUND. Aut(E,O) has order 2 for j not in {0, 1728}, 4 for
    j = 1728 (needs 4 | p - 1 for the extra automorphisms to be rational), and 6
    for j = 0 (needs 6 | p - 1). Hence g <= 6 unconditionally and g = 2 for
    generic j. Combined with (L4) this bounds the entire lane.

    STEP 5 - THE PRIME-ORDER COROLLARY. If #E(F_p) = N is prime then
    E(F_p) = Z/N has no rational torsion of small order, so no translation is
    rational, and Aut(E,O)(F_p) acting faithfully on E(F_p) must have order
    dividing... more carefully: negation is always rational, giving g >= 2; the
    j = 0 and j = 1728 cases require the corresponding CM discriminant, which
    fixes t and hence is a property of the isogeny class (DECOMPOSITION.md T4).
    So on a prime-order curve of generic j, g = 2 for every model, full stop.

    STEP 6 - THE SYMBOLIC AUDIT THAT COULD FALSIFY EVERY STEP ABOVE. Compute
    S_3^f symbolically in sympy for f = Weierstrass x, Montgomery x, Edwards y,
    Hessian x, Hessian x+y, on ONE fixed toy curve admitting all of them, and
    read off the per-variable degrees. Predicted (2,2,2), (2,2,2), (2,2,2),
    (9,9,9), (2,2,2). Any deviation falsifies the law at the exact lemma the
    deviation lands on.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Commands actually run on 2026-08-07 against the working tree - Grep over
      /home/user/crypto-autoresearcher for the patterns
      "Edwards|Montgomery|Kummer|Hessian|Jacobi quartic|theta coordinate"
      (60+ files, mostly research_digest chunks), the same over knowledge/ and
      ledger/ separately, and
      "deck group|deck transformation|coordinate map degree|Kummer line|
      differential addition|branch point|Legendre form" repository-wide.
      Full reads of KN-OPEN-003, KN-FIND-023, KN-LIT-004, KN-TECH-002,
      KN-TECH-007, KN-TECH-011, KN-TECH-018, KN-FIND-a1f3c2, KN-FIND-b7e091,
      KN-FIND-2a8b7e, KN-FIND-c7d31e, KN-FIND-f8c290, ledger/H-REP-001.yaml,
      ledger/RQ-REP-001.yaml, ledger/EV-REP-001.yaml, ledger/EV-REP-002.yaml,
      ledger/DEC-20260716-002.yaml, and
      inputs/refs/research/proofs_Dreg_conservation_weil_invariance.md.
      Web search for "summation polynomials Edwards curves degree index calculus
      elliptic curve model".
    results: >-
      INTERNAL - "deck group" returns ZERO hits anywhere in ledger/ or knowledge/.
      The nearest internal statements are KN-FIND-a1f3c2 (monodromy C_2^(m-2),
      Weierstrass only, indexed over curves not models) and the inherited PO-001 /
      PO-004 pair, whose escape route C2 this proposal settles. KN-OPEN-003 states
      the lane's question and is still open. KN-FIND-023 records the toy negative.
      EXTERNAL - Semaev's 2^(m-2) is textbook (KN-TECH-002). Faugere-Gaudry-Huot-
      Renault, "Using symmetries in the index calculus for elliptic curves
      discrete logarithm", J. Cryptology 27(4) 595-635, 2014 (KN-LIT-004,
      doi 10.1007/s00145-013-9158-5) already establishes that model and symmetry
      change solving COST and specifically that twisted Edwards and twisted
      Jacobi-intersection curves have extra symmetry from a rational 2-torsion
      point - which is mechanism (F4) here, and which this proposal does not claim.
      Cheng, Kodera and Miyaji, "Differences among Summation Polynomials over
      Various Forms of Elliptic Curves", IEICE Trans. Fundamentals E102-A(9)
      1061-1071, 2019, doi 10.1587/transfun.E102.A.1061, compares Hessian,
      Montgomery, twisted Edwards and Weierstrass under index calculus and its
      abstract reports an AFFIRMATIVE answer to whether the form matters. I HAVE
      NOT READ THAT PAPER'S BODY - only the abstract via web search - so what it
      measures, at what arity, and whether its affirmative answer concerns degree,
      support or wall time is recorded here as UNKNOWN and is a Stage-0 obligation
      of the minimal test. If it already contains the rational-deck-group law this
      proposal is a DUPLICATE of external prior art and should be reclassified.
    verdict: adaptation

  null_object_control: >-
    MANDATORY AND BLOCKING. The matched null is THE SAME MODEL WITH A RANDOM
    CHANGE OF COORDINATES - for each variable independently draw
    mu_i in PGL_2(F_p) and substitute t_i -> mu_i(t_i), clearing denominators.
    This is a coordinate with the SAME deck group and the SAME degree, so the law
    predicts EXACTLY ZERO change in per-variable degree and in Bezout number,
    while support and coefficients change completely. DECAY PARAMETER: the number
    of independent random Moebius maps applied, 0 through m. If any quantity the
    experiment reports as a "model effect" fails to stay flat as that parameter
    grows from 0 to m, the quantity is a coordinate artifact and no model claim
    may be made from it. SECOND NULL: the shifted Kummer coordinate
    x_R(P) = x(P - R) for random R, which is a degree-2 coordinate that is
    translation-conjugate to the standard one; every measurement must be
    identical after retargeting, and a difference is an instrument fault. Both
    nulls are specified in full in IDEA-20260807-4fc635.

  assumptions:
    - >-
      S_m^f is taken REDUCED. If one instead uses a non-reduced or
      resultant-composed presentation, per-variable degrees can be inflated by
      spurious factors; harness/semaev.py's s4_expr is exactly such a composed
      resultant and must be squarefree-reduced before its degree is compared
      against the law.
    - >-
      "Generic (t_1,...,t_(m-1))" in Step 1 excludes a proper closed subset. The
      law is a statement about degrees, i.e. about the generic fibre; special
      fibres over ramification points behave differently and are not counted.
    - >-
      The Bezout number is used as the program's existing cost PROXY
      (IDEA-20260803-e2f5bd, KN-TECH-007), not as a solving-time theorem. A model
      that ties on Bezout can still differ in measured Groebner cost through
      support and coefficient effects, which is exactly (F1)-(F3).
    - >-
      Aut(E,O) orders 2/4/6 are for p > 3, which harness/toycurve.py enforces.

  proof_search_map:
    bottleneck: >-
      Step 2, the rationality count (L3). Everything else is a fibre count that
      any competent reader would accept; (L3) is where the naive geometric
      argument and the arithmetic truth diverge, and it is the single step whose
      failure would resurrect the isogeny-pullback candidate in (E) as a genuine
      ell^(m-1) lever.
    baseline_embedding:
      parameter_slice: >-
        f = x on short Weierstrass, Gamma_f = {+-1}, g = 2. The law must return
        deg_{t_m} S_m = 2^(m-2) and Delta = 2^(m-2) (B/2)^(m-1), i.e. exactly
        KN-TECH-002 and exactly the convention of IDEA-20260803-e2f5bd.
      reproduction_check: >-
        Frozen symbolic fixture - harness/semaev.py s3_expr on a fixed toy curve
        must have per-variable degree 2 in each of x1, x2, x3 and total degree 4,
        and the squarefree part of s4_expr must have per-variable degree 4. Exact
        integer comparison. A mismatch halts the line before any model is touched.
    observation_collision:
      observable: >-
        The integer pair (deg_{t_m} S_m^f, g).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and that success is the RESULT rather
        than a defect - Weierstrass x, Montgomery x, Edwards y, the Kummer line
        and Hessian x+y are five distinct models predicted to share the observable
        (2, 2) at m = 3. The collision is the closure. The search must also look
        for a FALSE collision in the other direction - two models with the same g
        but different measured Groebner cost - because that would show the
        observable is too lossy to carry the cost claim, which is precisely
        limitation (F1) and is the reason IDEA-20260807-1354d8 exists.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "the degree of S_m^f" by the pair (deck group, its rational
          part). The degree is a consequence; the group is the thing that
          propagates and that has an a-priori bound (|Aut| <= 6).
        predicted_gain: >-
          Converts an open empirical question ("does the model matter?",
          KN-OPEN-003) into a bounded one with an explicit exception set, at zero
          compute.
      - transform: representation_reduction
        proposed_object: >-
          Reduce "choose a curve model" to "choose a finite subgroup of
          Aut(E,O)(F_p) together with a Moebius parametrisation of the quotient".
          Every named model is then an instance and the space of unnamed models
          is enumerated rather than guessed.
        predicted_gain: >-
          Makes the lane's search space FINITE at the level that matters
          (g in {1,2,4,6}) and pushes everything else into PGL_2, which the null
          object controls for.
    quantifier_order: >-
      CLAIMED - FORALL primes p > 3, FORALL E/F_p, FORALL F_p-rational
      non-constant f : E -> P^1 that is the quotient map by a subgroup
      Gamma_f of Aut(E,O), FORALL m >= 3 - deg_{t_m} S_m^f = |Gamma_f|^(m-2) and,
      at fixed rational factor-base size B, Delta_f = B^(m-1)/|Gamma_f(F_p)|.
      NOT CLAIMED, and the difference matters - FORALL f (including f whose deck
      group is not inside Aut(E,O)) the same formula. For those, only the upper
      bound (L2) is asserted, and the Hessian x is the worked counterexample
      showing the formula genuinely fails there.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No choice of coordinate on a prime-order prime-field elliptic curve of
        generic j changes the per-variable degree of the summation polynomial or
        the Bezout number of the arity-m decomposition system." It can NEVER
        certify anything about measured Groebner solving degree, wall time,
        mixed volume, coefficient height, or any genus-2 construction.
      nearby_object_control: >-
        THE SAME CURVE OVER F_{p^k} WITH k CHOSEN SO THAT AN ell-ISOGENY KERNEL
        BECOMES RATIONAL. There g jumps and the law predicts a genuine
        ell^(m-1) reduction in Delta. If that predicted gain does NOT appear over
        the extension field, (L3) is not the operative mechanism and the whole
        closure is mislocated. This is the control that distinguishes "the
        arithmetic obstruction" from "some other obstruction I have not named".
    proof_obligations:
      - claim: The diagonal quotient in Step 1 is exactly by Gamma_f, not more.
        responsibility: correctness
      - claim: Equality (not just <=) holds for generic parameters in (L1).
        responsibility: strictness
      - claim: The rational fibre is Gamma_f(F_p)-orbit (L3).
        responsibility: correctness
      - claim: Aut(E,O)(F_p) has order in {2,4,6} for p > 3.
        responsibility: baseline
      - claim: The isogeny-pullback coordinate has deg_{t_m} S_m^f = 2^(m-2).
        responsibility: feasibility
      - claim: Substituting g = 2 reproduces KN-TECH-002 and IDEA-20260803-e2f5bd.
        responsibility: baseline
      - claim: Nothing above bounds support, polytope, height, or wall time.
        responsibility: scope

  predictions:
    - metric: >-
        per-variable degree of the reduced S_3^f for f in {Weierstrass x,
        Montgomery x, Edwards y, Hessian x+y} on one fixed toy curve
      direction: different
      minimum_effect: >-
        All four EXACTLY 2, an exact integer tie with zero tolerance. Any value
        other than 2 for any of the four falsifies (L1) outright.
    - metric: per-variable degree of the reduced S_3^f for f = Hessian x
      direction: higher
      minimum_effect: >-
        EXACTLY 9. Not "larger" - 9. A value of 3 would mean the fibre count is
        wrong; a value of 2 would mean the Hessian x is secretly Galois over the
        quotient and (L2) is not tight; either kills the (L1)/(L2) dichotomy.
    - metric: >-
        rational factor-base size B produced by a degree-d membership polynomial
        in the isogeny-pullback coordinate f = x' o pi on a prime-order toy curve
      direction: lower
      minimum_effect: >-
        EXACTLY 2d, not 2*ell*d. This is the single measurement that decides (E).
        Observing 2*ell*d would mean rational points do populate the full
        geometric fibre and the ell^(m-1) lever is real - which would be the most
        important negative result this lane could produce and would REOPEN it.
    - metric: >-
        Delta_f / Delta_Weierstrass at fixed B across all measured models
      direction: different
      minimum_effect: >-
        Exactly 1 for every g = 2 model, exactly 2 for Hessian x, and, on a
        j = 0 curve with 6 | p - 1 and the coordinate x^3, exactly 1/3.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): read Cheng-Kodera-Miyaji 2019 (IEICE
      E102-A(9) 1061-1071) and FGHR 2014 (KN-LIT-004) bodies. If either already
      states the rational-deck-group law, reclassify this record as duplicate and
      write a knowledge/literature note instead of running anything.
      STAGE 1 (minutes, HARD GATE): reproduce the baseline. sympy degree read-off
      of harness/semaev.py s3_expr (expect per-variable 2, total 4, 13 monomials)
      and of the squarefree part of s4_expr (expect per-variable 4).
      STAGE 2 (minutes): construct ONE toy curve over a p of about 16 bits that
      simultaneously admits Weierstrass, Montgomery, twisted Edwards and Hessian
      models - i.e. a rational point of order 4 and, for the Hessian, a rational
      point of order 3, so the curve needs a cofactor divisible by 12. Verify all
      the birational maps pointwise on 100 random points with an independent
      on-curve check in each model. This is an instrument gate, not a measurement.
      STAGE 3 (minutes to an hour): eliminate to obtain the reduced S_3^f in each
      of the five coordinates by resultants in sympy, take squarefree parts, read
      off per-variable degrees and monomial counts. Compare with the predictions.
      STAGE 4 (minutes): the rational-fibre count. For the isogeny-pullback
      coordinate on a PRIME-ORDER toy curve, enumerate E(F_p), compute f on every
      rational point, and histogram the fibre sizes. Predicted: every rational
      fibre has size 2 (or 1 at the four branch points). Observing size 2*ell
      reopens the lane.
      STAGE 5 (zero compute): apply the random-Moebius null of
      IDEA-20260807-4fc635 to every arm of Stage 3 and confirm degrees are
      unchanged and supports are not.
    controls:
      - random-Moebius null per variable, decay parameter 0..m
      - shifted Kummer coordinate x(P - R) for random R
      - >-
        the same curve over F_{p^k} where the isogeny kernel becomes rational,
        as the positive control that the law's mechanism is rationality
      - >-
        a j = 0 curve with 6 | p - 1, as the positive control that g > 2 is
        reachable at all and produces the predicted factor 3
      - >-
        an INTENTIONALLY WRONG model map (a birational map with a sign error) to
        confirm the Stage-2 verification gate actually rejects it
    required_metrics:
      - per-variable degree and total degree of the reduced S_3^f per model
      - monomial count and the explicit support set per model
      - rational fibre size histogram per coordinate
      - g = |Gamma_f(F_p)| computed independently by orbit enumeration
      - Delta_f computed from the formula and from a brute-force solution count
      - pass/fail of every gate

  falsification_conditions:
    - >-
      Any g = 2 model shows a reduced per-variable degree different from 2 at
      m = 3. (L1) is false as stated and the record is superseded, not amended.
    - >-
      The Hessian x shows per-variable degree other than 9. The (L1)/(L2)
      dichotomy is wrong.
    - >-
      A rational fibre of the isogeny-pullback coordinate on a prime-order curve
      has size greater than 2. (L3) is false, (E) is wrong, and the lane REOPENS
      with an explicit ell^(m-1) target - the most valuable possible failure.
    - >-
      Two g = 2 models show materially different MEASURED Groebner solving degree
      on identical instances with the null applied. That does not falsify the law
      - the law is about Bezout degree - but it falsifies the CLOSURE READING of
      the law and hands the lane to (F1)-(F3).
    - >-
      Stage 0 finds the law already published. Then the deliverable is a
      literature note, not a finding.
    - >-
      Stage 1 baseline reproduction fails. Instrument fault; nothing is reported.

  confounders:
    - >-
      NON-REDUCED PRESENTATIONS. Composed resultants routinely carry squared
      factors that inflate the apparent per-variable degree. Every degree must be
      read from a squarefree part, and the squarefree computation itself must be
      checked on the Weierstrass baseline where the answer is known.
    - >-
      MODEL-EXISTENCE BIAS. A curve admitting all five models has a cofactor
      divisible by 12 and is therefore NOT a cryptographic curve. Every number
      measured in Stage 3 is measured on a curve with torsion, which is exactly
      the case where mechanism (F4) is available. Conclusions about prime-order
      curves are DERIVED (Step 5), never measured, and must be labelled so.
    - >-
      Coordinate-at-infinity conventions. Moving a point to infinity changes
      whether a degree is realised affinely; degrees must be computed in the
      multi-projective sense and the convention frozen before Stage 3.
    - >-
      j = 0 and j = 1728 availability is CLASS-DETERMINED (DECOMPOSITION.md T4):
      one cannot walk to such a curve from a class that does not contain one, so
      the factor-3 exception is not an attack even where it exists.

  interpretation_limits:
    - >-
      THE ASYMPTOTIC CEILING, STATED AS THE BRIEF REQUIRES. This proposal claims
      NO exponent change and cannot claim one. Semaev's S_m has per-variable
      degree 2^(m-2) for short Weierstrass; Diem's and Gaudry's analyses are
      model-agnostic in asymptotic form because a birational change of model is
      an isomorphism of function fields and cannot change the geometry that
      drives the asymptotics. What this record asserts is a CONSTANT - a factor
      g in the Bezout number, with g <= 6 and g = 2 generically, hence a factor
      of exactly 1 on any cryptographic curve. Every claim here lives inside that
      ceiling by construction.
    - >-
      Bezout number is a proxy for solving cost, not solving cost. KN-TECH-011
      records that the driver is the degree the solver actually reaches, and
      KN-TECH-007 records that mixed volume can be far below Bezout for sparse
      systems. A tie in Delta is not a tie in cost.
    - >-
      Says nothing about genus-2 Kummer surfaces, theta functions, or Mumford
      representations. The inherited PO-004 leaves that OPEN and this record
      leaves it open too.
    - >-
      Says nothing about coefficient heights, which is the axis on which a model
      could still differ without any degree or support changing.
    - >-
      Toy-scale symbolic verification only. Nothing here is crypto-scale
      validation (AGENTS.md rule 7); the crypto-scale statement is the DERIVED
      Step 5, whose input is the arithmetic of prime-order groups and not a
      measurement.

  reachability_gate: >-
    TRIVIAL, AND STATED RATHER THAN LEFT BLANK BECAUSE THE BRIEF REQUIRES IT.
    T5 (DECOMPOSITION.md section 3) gates lanes that must MOVE BETWEEN CURVES:
    reaching a specified curve in an isogeny class is the vectorization problem
    and costs about sqrt(h) ~ p^(1/4). This lane moves between COORDINATES ON ONE
    FIXED CURVE. A model change is a per-variable Moebius substitution, costs
    O(1) field operations, is invertible, and involves no walk, no mixing time
    and no class-group action. The good object is reachable with probability 1 at
    zero isogeny cost. This is exactly why L11 is a strictly finer question than
    L1 - it removes reachability as a confound, so any difference observed is
    attributable to the representation and to nothing else. The ONE non-trivial
    reachability caveat is model EXISTENCE, not model reachability: a twisted
    Edwards model requires a rational point of order 4 and a Hessian model a
    rational point of order 3, so those models are unavailable on prime-order
    curves at any price. That unavailability is an arithmetic fact about the
    curve, not a search cost, and it is (L3) again.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CHANGE IS CLAIMED OR POSSIBLE HERE. The claim is a constant
      factor g <= 6 in the Bezout number of the decomposition system, hence a
      constant factor at most 3 relative to the g = 2 baseline, and exactly 1 on
      a prime-order generic-j curve. Prime-field ECDLP remains at p^(1/2) by rho
      and at exp(c sqrt(log N log log N)) for Semaev index calculus
      (KN-FIND-f8c290).
    memory_exponent: >-
      Unchanged. Nothing here alters the memory profile of any stage; the
      Groebner stage's memory is the Macaulay matrix at the reached degree
      (KN-TECH-011) and the reached degree is not claimed to change.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886 sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006), automorphism-
      discounted by sqrt(|Aut|) on CM curves (KN-TECH-018); BSGS at sqrt(N) time
      and sqrt(N) memory (KN-TECH-031). For the decomposition step specifically,
      KN-FIND-f8c290 and the BKK constants KN-FIND-2a8b7e / KN-FIND-c7d31e.
    hidden_overhead: >-
      The formula Delta = B^(m-1)/g hides the LIFTING cost: once a coordinate
      tuple solves the system, one must identify which preimages actually sum to
      the target, at cost n^(m-1) tests where n = deg f. For g = 2 models n = 2
      and this is 2^(m-1), negligible. For the isogeny-pullback coordinate n =
      2ell and the lifting cost is ell^(m-1) times larger - which would have
      exactly cancelled the apparent ell^(m-1) Bezout gain even if (L3) had not
      already killed it. Disclosed here because omitting it is the standard way
      this candidate is oversold.
    tradeoff_note: >-
      Not applicable - no algorithm is produced and no time-memory point moves.
      The lane's whole output is a bound on what a representation change can buy.
  dominated_by: >-
    AS AN ATTACK - mounts none, so it is dominated on every axis by every row of
    the prime-field frontier, checked individually: parallel rho with
    distinguished points (0.886 sqrt(N) group operations, O(1) memory, no data)
    KN-TECH-001 / KN-TECH-006; the automorphism-discounted rho variant on CM
    curves (sqrt(|Aut|) better constant, same exponent) KN-TECH-018; BSGS
    (sqrt(N) time, sqrt(N) memory) KN-TECH-031; Semaev index calculus at
    exp(c sqrt(log N log log N)) with the BKK constant improvements
    KN-FIND-f8c290 / KN-FIND-2a8b7e / KN-FIND-c7d31e. On data and queries all of
    these are zero-query and so is this, so no row is escaped on that axis either.
    AS A BOUND ON THE LANE - dominates the empirical negative KN-FIND-023 /
    EV-REP-002 on GENERALITY (all models, all curves, derived rather than
    sampled) and is dominated by it on EMPIRICAL STANDING (that record has runs;
    this has none until Stage 3).
  sota_delta: >-
    Zero speedup against any attack baseline, and that is the expected and
    correct answer. Quantitatively - the claimed change to Delta at fixed B is a
    factor g/2 in {1/2, 1, 2, 3}, of which the value on any prime-order
    generic-j curve is exactly 1.000, i.e. a 0.000-bit change in the cost of the
    decomposition step. The delta this record actually offers is to KN-OPEN-003,
    which it would convert from an open question into a bounded one with a named
    exception set of size 2 (j = 0, j = 1728) and a stated residue of 5 items
    (F1)-(F5).

