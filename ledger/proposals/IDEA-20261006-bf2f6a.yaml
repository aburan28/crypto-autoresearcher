idea:
  id: IDEA-20261006-bf2f6a
  question_id: RQ-PAIR-21313f
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    On the first small prime where j=0 and a random curve share an
    odd prime factor r, the r-torsion fields differ and the embedding
    degrees do not
  class: control
  claim: >-
    Let E0 be y^2 = x^3 + 1 and E1 be y^2 = x^3 + x + 1. Let p be
    the smallest prime with p > 30, p congruent to 1 mod 3, p < 256,
    both curves ordinary and nonsingular over F_p, and
    gcd(#E0(F_p), #E1(F_p)) divisible by an odd prime r that does
    not divide p - 1. Let k(E) be the multiplicative order of p
    modulo r, the embedding degree of the rational r-subgroup. Let
    d(E) be the degree of the smallest extension of F_p over which
    every point of E[r] is rational. The claim is k(E0) = k(E1) and
    d(E0) < d(E1). No discrete logarithm is transferred, and no
    index-calculus cost in the embedding field is claimed to move.
    If no such p exists below 256, the claim is not scored.
  mechanism: >-
    The tracked object is the pair of integers (k, d) for one
    prime r. The representation is R3 in the sense of the division
    field of E[r], not an encoding of a secret scalar. The operation
    set Sigma is the action of Gal(F_p-bar/F_p) on E[r]. Sigma is
    not translation on the prime-order subgroup. Class:
    coordinate-dependent, because (k, d) is a property of the
    torsion module as a Galois representation and is the same for
    every generator of a rational subgroup of order r. One-line
    reason: translating a rational point does not change the field
    of definition of the full r-torsion. Lossy-projection test
    against Sigma: the projection discards a basis of E[r] and keeps
    two integers. Many bases share them, so it is lossy, and the
    Galois action does not change the degrees. Family F4 (pairing
    transfer) is a component only as the definition of k. It is not
    the lens: the test never evaluates a pairing and never moves a
    logarithm into F_{p^k}. Two outcomes are separated before any
    run. k equal and d strictly smaller on E0 means the special
    j-invariant shows up in the torsion field and not in the MOV
    field, so a later transfer cost that depends only on k is the
    same on both curves. d(E0) at least d(E1) means this prime does
    not exhibit a CM shrinkage of the division field. k(E0) unequal
    to k(E1) means the two curves were not using the same r, and
    the comparison is void.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        MOV and Frey-Rück apply when the embedding degree is small,
        and they are curve checks rather than generic algorithms.
        This record uses that scope: equal k means the same check.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-53c89f.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        Automorphisms of order m give a factor sqrt(m) in rho and
        do not change the exponent 1/2. A smaller division field is
        not that factor.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Isogenous curves share the group order. This record compares
        two curves that share a prime factor r of the group order,
        not two isogenous curves.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        The Weil descent to F_2 of S_3 has first fall degree 2
        because the trace of x is a group morphism to F_2. This
        record builds no summation polynomial.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
  assumptions:
    - >-
      Both curves are nonsingular and ordinary at the chosen p, and
      r does not equal the characteristic.
    - >-
      k is the order of p modulo r, and d is the degree of the
      splitting field of the r-division polynomial over F_p.
    - >-
      The same r is used for both curves. A run that picks different
      prime factors is not the instance.
  predictions:
    - metric: d(E0) - d(E1)
      direction: lower
      minimum_effect: at most -1
    - metric: k(E0) - k(E1)
      direction: lower
      minimum_effect: exactly 0
  minimal_test:
    design: >-
      Search primes p from 31 up to 255 with p congruent to 1 mod 3.
      Point-count both curves. Take the least p whose group orders
      share an odd prime r not dividing p - 1. Compute k as the
      order of p modulo r, once. Compute d(E) by factoring the
      r-division polynomial over extensions of F_p, or by
      constructing the field generated by all r-torsion, and record
      the degree. Compare the four integers.
    controls:
      - >-
        The identity curve E0 against itself: d(E0) - d(E0) = 0 and
        k is unchanged. A nonzero self-difference voids the
        division-field code.
      - >-
        A prime r that does divide p - 1 is excluded. If the search
        is rerun without that exclusion and k drops to 1 on either
        curve, the exclusion is what the drop measures, and the
        original claim is not scored from that rerun.
      - >-
        The same division-field procedure on E0 at ell = 2, if the
        full 2-torsion is already rational, must return d = 1. A
        larger d voids the procedure.
    required_metrics:
      - p and r
      - #E0(F_p) and #E1(F_p)
      - k(E0) and k(E1)
      - d(E0) and d(E1)
  falsification_conditions:
    - >-
      The instance exists and d(E0) ≥ d(E1). That inequality is the
      negative observation.
    - The instance exists and k(E0) ≠ k(E1).
    - The self-check on E0 returns a nonzero degree difference.
  confounders:
    - >-
      A shared factor r that also divides the torsion of only one
      twist, if the point count used the wrong quadratic twist,
      changes d without changing j.
    - >-
      Reporting the degree of a single r-isogeny kernel field
      instead of the full E[r] field makes d look smaller on both
      curves and can erase the gap.
    - >-
      No prime below 256 meets the gcd condition. That is an empty
      search, not a negative on d.
  interpretation_limits:
    - >-
      d(E0) < d(E1) with equal k does not yield a discrete
      logarithm and does not change the field in which a MOV
      transfer would land.
    - >-
      The result is one prime p < 256. It does not say that every
      j = 0 curve has a smaller division field.
    - >-
      The rho exponent stays 1/2. The automorphism factor sqrt(6)
      on j = 0 is a different constant and is not measured here.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For an ordinary curve with complex multiplication by an
        order in Q(sqrt(-3)), the Galois image on E[r] lands in a
        Cartan subgroup, so the division-field degree d is strictly
        smaller than the degree allowed by a full GL_2(F_r) image,
        while the Weil-pairing target field still has degree k, the
        order of p modulo r. The non-CM curve E1 is the control
        that is predicted to realise the larger degree.
      rigorous_support: >-
        The equality k = ord_r(p) is the definition of the
        embedding degree used by KR-RHO-53c89f. No file opened in
        this session proves d(E0) < d(E1) for this equation pair.
        The Cartan description is recalled and is not a citation.
      validation_plan: >-
        The quantity sampled is the pair (d, k) at the single
        prime p the search returns, one curve pair, one r. The
        comparison is d(E0) against d(E1) and k(E0) against k(E1).
        The tail check is the ratio d/k on each curve: the claim
        requires d(E0)/k < d(E1)/k. The parameter is r at that p,
        with p < 256. Transfer assumption: none. The degrees are
        not scaled to a pairing-friendly cryptographic prime.
  target_complexity:
    time_exponent: >-
      unchanged at 1/2 for a prime-order subgroup, from
      KR-RHO-13bf67 as the generic baseline and from KR-RHO-0528e7
      for the automorphism constant. Equal embedding degrees mean
      the MOV field is the same size on both curves.
    memory_exponent: >-
      unchanged. The test stores one division polynomial of degree
      (r^2 - 1)/2 for an r that divides a group of size about p.
    best_known: >-
      KR-RHO-53c89f, embedding-degree checks, and KR-RHO-0528e7,
      the sqrt(m) automorphism factor. Neither row is improved.
    hidden_overhead: >-
      None. No o(1) in an exponent is claimed. The division-field
      degree is an integer, not a complexity.
    tradeoff_note: >-
      No time-memory tradeoff. A smaller d does not reduce the
      linear algebra of a discrete log in F_{p^k}, because k is
      predicted equal.
