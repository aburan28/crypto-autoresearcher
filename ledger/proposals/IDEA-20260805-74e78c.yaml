idea:
  id: IDEA-20260805-74e78c
  question_id: RQ-MAYO-001
  added: '2026-08-05'
  title: >-
    The polar-value factorization of the whipped map: whipping can only
    see a signature through r(r+1)/2 emulsifier combinations, so the
    emulsifier's rank-metric defect is the entire channel by which
    whipping could lose equations
  class: mechanism

  claim: >-
    In characteristic 2 the whipped MAYO map, restricted to any linear slice
    of its argument space, FACTORS THROUGH THE POLAR VALUES OF THE UNDERLYING
    MAP. Precisely: write the k whipped blocks as x_i = sum_a c_{ia} y_a for a
    coefficient matrix C in F_q^{k x r} and free vectors y_1..y_r in F_q^n.
    Then
      P*(C y) = sum_a D_a(C) P(y_a) + sum_{a<b} F_ab(C) P'(y_a, y_b),
      D_a(C)  = sum_i c_{ia}^2 E_ii,
      F_ab(C) = sum_i c_{ia} c_{ib} E_ii
                + sum_{i<j} (c_{ia} c_{jb} + c_{ib} c_{ja}) E_ij.
    The whipped map on the slice therefore depends on the k n coordinates only
    through the r(r+1)/2 vectors {P(y_a), P'(y_a,y_b)} in F_q^m, compressed by
    the r(r+1)/2 matrices {D_a, F_ab}. CONSEQUENCE, AND THE WHOLE PROPOSAL:
    define the EMULSIFIER DEFECT delta(C) as the dimension of the common LEFT
    kernel of {D_a(C)} union {F_ab(C)}. Every u in that common left kernel
    gives a linear form u^T P* that VANISHES IDENTICALLY on the r n-dimensional
    slice -- an equation the attacker does not have to satisfy. Oil-space
    recovery and forgery restricted to that slice are therefore problems with
    m - delta(C) equations, not m. The security of the whipping construction
    against every slice-restricted attack is thus exactly the statement
    delta(C) = 0 for all nonzero C, which is a RANK-METRIC non-degeneracy
    property of the public emulsifier matrices and nothing else. This is
    checkable at zero compute for a field-based emulsifier and by exhaustive
    toy computation otherwise, it is a property of PUBLIC data so no secret is
    needed to test it, and both outcomes are deliverables: delta_max = 0 is a
    named obstruction with an argument (half of GOAL-MAYO-001's second
    completion horn), and delta_max > 0 is a whipping-induced structure that
    lowers the effective equation count.

  object_first_candidate:
    tracked_object: >-
      The r(r+1)/2-tuple of emulsifier combination matrices (D_a(C), F_ab(C))
      induced by a slice C, followed as a subspace of F_q^{m x m} in the RANK
      METRIC -- specifically its common left kernel. The signature side of the
      computation is tracked as the matching tuple of polar values
      (P(y_a), P'(y_a,y_b)) in (F_q^m)^{r(r+1)/2}. The pairing between the two
      tuples IS the whipped map on the slice; whipping contributes only the
      first tuple, and the underlying UOV map only the second.
    established_families_off_limits: >-
      Off-limits as the primary lens: Kipnis-Shamir, reconciliation, the
      intersection attack, MinRank and rectangular MinRank on the SECRET
      structure, direct Groebner attack on the public key, Hashimoto /
      Thomae-Wolf underdetermined solving, quantum MQ, and every fault or
      side-channel route. ADJACENCY DECLARED RATHER THAN HIDDEN: the object
      lives in the rank metric, which is also MinRank's home. It is not a
      MinRank instance, and the difference is the point -- MinRank searches a
      linear span of PUBLIC matrices for a low-rank element that encodes the
      SECRET, whereas delta(C) is a property of the specification's PUBLIC,
      FIXED, ATTACKER-KNOWN emulsifier, computable without any key at all. A
      nonzero delta is a design defect, not a solved MinRank instance. If a
      reviewer judges the distinction insufficient, the honest disposition is
      to reclassify the proposal as rank-metric-family, not to withdraw the
      computation.
    newness_score: >-
      The factorization identity is elementary algebra that any MAYO designer
      could write in five minutes, and some form of the non-degeneracy
      condition on the E_ij is certainly in the specification -- signing
      requires an invertibility property of exactly these combinations
      (RECALLED, UNVERIFIED). What is new here, and what the corpus does not
      contain in any form, is (a) the identity stated for a GENERAL slice
      C in F_q^{k x r} rather than for the signing configuration, (b) the
      isolation of delta(C) as the single scalar through which whipping can
      leak equations, and (c) the observation that the SIGNING condition and
      the ATTACK condition need not be the same condition -- a spec that
      guarantees invertibility only of the combinations arising in signing has
      not thereby guaranteed delta(C) = 0 over all slices. Whether they
      coincide is precisely the measurement.
    testability_score: >-
      Very high and very cheap. delta(C) is a rank computation on matrices of
      size m x m over F_q using public data only. At toy (q, m, k) the slice
      space can be enumerated exhaustively up to scalars; at real parameters it
      cannot, and the record says so and substitutes the field-algebra argument
      plus random sampling with a stated coverage figure -- never a claim of
      exhaustiveness.
    survival_score: >-
      The factorization identity survives to full parameters unchanged (it is
      an identity). The DEFECT SEARCH does not: exhaustive enumeration of
      C in F_q^{k x r} is (q^{kr} - 1)/(q - 1) projective points, about 4.6e9
      at q = 16, k = 9, r = 1, so the honest statement at real parameters is a
      structural argument plus bounded sampling, and any claim of 'no defect
      exists' at real parameters is out of reach by enumeration and must come
      from the field argument or not at all.

  mechanism: >-
    DERIVED HERE, in full. Characteristic 2 is used twice and both uses are
    flagged. The MAYO whipped map's form and q = 16 are RECALLED, UNVERIFIED
    (see IDEA-20260805-258212's literature block); the algebra below is
    unconditional given that form.

    SETUP. P : F_q^n -> F_q^m is the underlying UOV map, homogeneous quadratic,
    so P(c x) = c^2 P(x) for c in F_q. Its polar form P'(u, v) = P(u+v) - P(u)
    - P(v) is symmetric and bilinear, and P'(x, x) = P(2x) - 2P(x) =
    (4 - 2) P(x), which is 2 P(x) and hence ZERO IN CHARACTERISTIC 2 (USE 1).
    The whipped map is
      P*(x_1, ..., x_k) = sum_i E_ii P(x_i) + sum_{i<j} E_ij P'(x_i, x_j),
    with E_ij in F_q^{m x m} fixed and public.

    THE SLICE. Fix r <= k and C = (c_{ia}) in F_q^{k x r}. Substitute
    x_i = sum_a c_{ia} y_a with y_1..y_r free in F_q^n. Two elementary
    expansions:
      P(sum_a c_a y_a) = sum_a c_a^2 P(y_a) + sum_{a<b} c_a c_b P'(y_a, y_b)
    (induction on r using P(u+v) = P(u) + P(v) + P'(u,v) and homogeneity), and
      P'(sum_a c_{ia} y_a, sum_b c_{jb} y_b) = sum_{a,b} c_{ia} c_{jb} P'(y_a,y_b)
      = sum_{a<b} (c_{ia} c_{jb} + c_{ib} c_{ja}) P'(y_a, y_b),
    where the diagonal terms a = b dropped out because P'(y_a, y_a) = 0
    (USE 1 again). Collecting coefficients of the r(r+1)/2 independent
    quantities P(y_1), ..., P(y_r), P'(y_1,y_2), ... gives exactly
      P*(C y) = sum_a D_a(C) P(y_a) + sum_{a<b} F_ab(C) P'(y_a, y_b)
    with D_a and F_ab as in the claim. USE 2 OF CHARACTERISTIC 2: c -> c^2 is
    the Frobenius automorphism of F_q, hence a BIJECTION, so as C ranges over
    F_q^{k x r} the vector (c_{1a}^2, ..., c_{ka}^2) ranges over all of F_q^k;
    the squares in D_a therefore impose no restriction on which F_q-combination
    of the diagonal emulsifiers can appear. In odd characteristic both uses
    fail and the identity acquires extra diagonal terms; the record is
    char-2-specific and says so.

    THE DEFECT. Let S(C) = span_{F_q} of the rows of all the matrices
    {D_a(C)} union {F_ab(C)} viewed as a single ((r(r+1)/2) m) x m matrix
    stacked vertically, and let delta(C) = m - rank(stack) = dim of the common
    LEFT kernel {u : u^T D_a(C) = 0 for all a, u^T F_ab(C) = 0 for all a<b}.
    For u in that kernel, u^T P*(C y) = 0 identically in y_1..y_r. So the m
    whipped equations, restricted to the slice, span at most m - delta(C) of
    them: the attacker working inside the slice faces a system of m - delta(C)
    quadratic equations in r n variables.

    WHAT A DEFECT WOULD BUY, COSTED HONESTLY. Two consumers, and they are not
    the same.
    (a) FORGERY. A signature must hit a target t = H(message, salt) in F_q^m.
    Inside the slice, u^T P* is identically 0, so only targets with u^T t = 0
    are reachable: a q^{-delta} fraction, forcing q^{delta} salt regrindings.
    Net cost = q^{delta} * Cost_MQ(m - delta equations, r n variables) against
    Cost_MQ(m, k n variables) for the unrestricted attack. The slice wins only
    if dropping delta equations is worth more than q^delta AND the loss of
    (k - r) n variables (which HURTS, because underdetermination helps the
    attacker -- see IDEA-20260805-258212 Identity 4). Both effects must be in
    the table; a record that shows only the equation drop is dishonest.
    (b) OIL-SPACE RECOVERY. A slice-restricted oil vector needs P*(C y) = 0,
    i.e. delta of the constraints are free and m - delta must be solved. There
    is no salt to grind, so the q^{delta} penalty of (a) does not apply and the
    defect is worth strictly more here. This is why the goal's primary target
    (oil-space recovery) is the right consumer for the defect and forgery is
    the secondary one.

    THE FORCED VALUE, AND WHY THE PREDICTED ANSWER IS ZERO. RECALLED,
    UNVERIFIED: MAYO's emulsifier matrices are taken from a commutative algebra
    F_q[A] isomorphic to the field F_{q^m}, with A the companion matrix of an
    irreducible degree-m polynomial. GIVEN THAT, every element of the F_q-span
    of the E_ij is either ZERO or INVERTIBLE, because a nonzero element of a
    field is a unit and the regular representation of a unit is an invertible
    matrix. Hence delta(C) is 0 or m, never in between -- and delta(C) = m
    requires ALL r(r+1)/2 combinations D_a(C), F_ab(C) to VANISH. Take r = 1:
    the single condition is sum_i c_{i1}^2 eps_ii = 0 where eps_ii in F_{q^m} is
    the field element representing E_ii. If the k elements eps_11..eps_kk are
    F_q-LINEARLY INDEPENDENT in F_{q^m} (possible only if k <= m, which holds
    for the recalled parameters), then sum_i c_{i1}^2 eps_ii = 0 forces every
    c_{i1}^2 = 0, hence C = 0. FORCED VALUE: delta(C) = 0 for every nonzero C
    at r = 1, and by the same argument at every r for which the induced
    conditions remain independent. THE PREDICTED OUTCOME OF THIS PROPOSAL IS
    THEREFORE A CLEAN NEGATIVE WITH A NAMED OBSTRUCTION -- 'the emulsifier's
    F_{q^m}-structure makes every nonzero combination a unit, so no slice loses
    an equation' -- which is exactly the second horn of GOAL-MAYO-001's first
    completion criterion, and is worth far more than a fatigue report because
    it names the mechanism, states its scope, and identifies what would break
    it.
    WHAT WOULD BREAK IT, i.e. the real risk that makes this worth running:
    (i) the specification may NOT place all E_ij in one field-isomorphic
    algebra -- it may impose only the weaker condition that the combinations
    ARISING IN SIGNING are invertible, in which case slices outside the signing
    configuration are unconstrained; (ii) the eps_ii may fail F_q-linear
    independence if the spec reuses powers; (iii) at r >= 2 the F_ab conditions
    are quadratic in C and the counting argument above is not automatic; and
    (iv) a Round-3 tweak (due 2026-08-14) could change the emulsifier. Each is
    a reading task or a toy computation, and each can turn the forced 0 into a
    positive delta.

    THE NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL. Replace the field-based
    emulsifier by matrices sampled uniformly from F_q^{m x m}. A random m x m
    matrix over F_q is singular with probability about 1 - prod_{i=1}^{m}
    (1 - q^{-i}), which is about q^{-1} = 1/16 for large m at q = 16, so a
    random emulsifier produces singular combinations constantly, and delta >= 1
    somewhere in the slice space with overwhelming probability. That is the
    matched null for this instrument, and it CAN and SHOULD show a nonzero
    delta -- if the search reports delta_max = 0 on the random emulsifier, the
    SEARCH is broken and no negative result about the real emulsifier may be
    reported at all.

  novelty_status: unverified

  literature_context:
    - >-
      NO MAYO SPECIFICATION HAS BEEN READ IN THIS SESSION. The whipped map's
      form, the emulsifier's construction from F_{q^m}, and q = 16 are all
      RECALLED, UNVERIFIED. Stage 0 of any experiment replaces them with
      quotations or records the failure to obtain them.
    - >-
      KN-LIT-1205 (iacr:2024/1893, bitsliced Jasmin MAYO2) -- corpus entry read,
      paper NOT read; relayed support for GF(16) and for the phrase 'whipping
      the UOV map'. It is an implementation paper and says nothing about the
      emulsifier's algebraic structure.
    - >-
      KN-LIT-1818 (iacr:2026/1122) -- corpus entry read, paper NOT read; bears
      on the underdetermined-MQ axis, not on this one. Recorded so that the two
      proposals in this batch are not confused.
    - >-
      The corpus contains NO KN-TECH entry on UOV, MAYO, or rank-metric
      non-degeneracy of a public whipping map, and no prior proposal in
      ledger/proposals examines the emulsifier at all: IDEA-20260801-013, the
      only prior MAYO proposal, treats the whipped key as a black box and
      proposes a cost-ratio measurement. The session ANGLE-BRIEF's F7 table
      lists four never-attempted transfers for the MQ family (solving-degree on
      the derived system, isotypic/equivariant for SNOVA, BKK for QR-UOV,
      non-commutative Groebner for SNOVA) and this object is none of them.
    - >-
      RELATED BUT DISTINCT, and named so a reviewer can attack the distinction:
      the SNOVA wedge-product attack (ePrint 2026/237, ABSTRACT ONLY, relayed
      via the ANGLE-BRIEF) exploits structure in a matrix-ring-valued map, and
      the D7 isotypic device the brief proposes for SNOVA also lives in the
      algebra of a public structure. Neither has been pointed at MAYO's
      emulsifier, and MAYO's E_ij are a commutative family while SNOVA's
      structure is a matrix ring, so the SNOVA techniques do not transfer as
      written.

  lossy_projection_identifiability_audit:
    projection: >-
      The full whipped map evaluated on a slice, P*(C y) as a function of
      (y_1..y_r) in (F_q^n)^r --> the pair of tuples
      ( {D_a(C), F_ab(C)} in (F_q^{m x m})^{r(r+1)/2} ,
        {P(y_a), P'(y_a,y_b)} in (F_q^m)^{r(r+1)/2} ).
      The tracked object proper is the FIRST tuple; the second is what it acts
      on.
    what_is_discarded: >-
      On the emulsifier side: everything about the E_ij except the r(r+1)/2
      specific F_q-combinations that this slice induces -- at r = 1 that is k
      numbers' worth of combination out of k(k+1)/2 matrices, and the entire
      off-diagonal family E_ij (i<j) is discarded outright at r = 1. On the
      signature side: the r n coordinates of y are discarded and only their
      r(r+1)/2 polar values in F_q^m survive, fibres of size about q^{rn - r(r+1)m/2}
      when that exponent is positive.
    why_genuinely_lossy: >-
      Genuinely lossy on both sides, and the r = 1 case is the sharpest: the
      whole off-diagonal emulsifier family vanishes from the description, and
      y in F_q^n is compressed to P(y) in F_q^m, a map that is very far from
      injective (its fibres over the image have dimension at least n - m, and
      over 0 they contain the whole oil space). Nothing here is recoverable
      from the projection.
    why_compatible_with_the_operations: >-
      This is the crux and it is a THEOREM here, not a hope: the whipped map
      restricted to the slice is EXACTLY the pairing of the two tuples, so the
      retained data propagates deterministically through the target's own
      operation with no residual term. That is the identity in the mechanism,
      derived rather than assumed, and it is what distinguishes this from a
      statistic that merely correlates with the map.
    is_it_only_a_change_of_coordinates: >-
      CHECKED AGAINST BOTH NAMED FAILURE MODES.
      (1) The (Delta, Pi) = (x xor y, x*y) failure -- a projection that
      discards nothing because the pair is recoverable as the roots of
      t^2 + Delta t + Pi. NOT THIS: y cannot be recovered from P(y); the fibre
      is exponentially large and contains the entire oil space. Inverting P is
      the MQ problem itself.
      (2) The mirror failure, a projection so lossy it is CONSTANT across
      instances with zero comparator spread (the ML-KEM determinant-ideal case,
      IDEA-20260805-e805b6). NOT THIS EITHER, AND THE CHECK IS QUANTITATIVE:
      delta(C) is a function of C and varies over the slice space by
      construction for any emulsifier that is not a scalar family; the matched
      random-emulsifier null is predicted to produce a spread of delta values
      with a nonzero maximum, and if the null shows ZERO spread the instrument
      is measuring a constant of the apparatus and no conclusion may be drawn.
      That check is written into the controls, not left as a remark.
      A THIRD FAILURE, SPECIFIC TO THIS OBJECT AND WORTH NAMING: delta could be
      constant at 0 for BOTH the real and the null emulsifier if the search
      over C is broken (e.g. only C = 0 is ever tested). The planted-defect
      positive control exists exactly to catch that.

  assumptions:
    - >-
      That the whipped map has the stated bilinear form. If it does not, the
      factorization identity must be re-derived; the METHOD (restrict to a
      slice, collect coefficients, look for a common left kernel) survives any
      form in which the whipped map is F_q-linear in a fixed family of
      emulsifier matrices, which is the only property it actually uses.
    - >-
      Characteristic 2. Both simplifications (P'(y,y) = 0 and Frobenius
      bijectivity of squaring) are char-2 facts. RECALLED, UNVERIFIED that
      q = 16 for every MAYO parameter set; if any set is odd-characteristic the
      identity gains diagonal terms and delta must be recomputed.
    - >-
      That slice-restricted attacks are the relevant consumer. A defect delta(C)
      helps only an attacker who confines the search to the slice. An attacker
      is never obliged to; the slice is a restriction the attacker CHOOSES
      because it is cheaper. The cost bookkeeping in the mechanism is therefore
      part of the claim, not an afterthought, and a defect with an unfavourable
      trade is not an attack.

  predictions:
    - metric: >-
        delta_max_real: the maximum of delta(C) over the searched slice space,
        for the specification's emulsifier at toy parameters (r = 1, exhaustive
        over projective C; r = 2, exhaustive or stated-coverage sample)
      direction: lower
      minimum_effect: >-
        EXACTLY 0, derived before any run from the field argument. A value >= 1
        FALSIFIES the design's non-degeneracy at the tested toy parameters and
        is the single most valuable outcome available in this goal. There is no
        tolerance band: delta is an integer and 0 is the forced value.
    - metric: >-
        delta_max_null: the same maximum for a matched null emulsifier whose
        matrices are drawn uniformly from F_q^{m x m}, same m, same k, same
        slice space, same search code
      direction: higher
      minimum_effect: >-
        >= 1 with high probability, and the probability is derivable in advance
        rather than hoped for: a uniform m x m matrix over F_q is singular with
        probability 1 - prod_{i=1..m}(1 - q^{-i}), about 0.0625 at q = 16, and
        the r = 1 slice space contains (q^k - 1)/(q - 1) projective points, so
        for toy k = 3, q = 16 that is 273 independent-ish combinations and
        P(no singular combination) is negligible. IF delta_max_null = 0 THE
        SEARCH IS BROKEN AND NO NEGATIVE ABOUT THE REAL EMULSIFIER MAY BE
        REPORTED.
    - metric: >-
        delta_found_planted: the defect recovered on a planted emulsifier built
        by construction to have a common left kernel vector u on every E_ij
      direction: higher
      minimum_effect: >-
        EXACTLY the planted dimension (1 for a single planted u), recovered at
        the planted C, in 20/20 planted instances. This is the instrument's
        sensitivity demonstration; below 20/20 the instrument is not trusted.
    - metric: >-
        delta_graded(j): plant a common left kernel on j of the k(k+1)/2
        emulsifier matrices, j = 0, 1, 2, 3, ..., k(k+1)/2, leaving the rest
        field-based; report delta_max as a function of j
      direction: higher
      minimum_effect: >-
        MONOTONE NON-DECREASING in j, equal to 0 at j = 0, and reaching the
        planted dimension only when j covers every matrix that the slice
        actually excites. The interior points are the payload: they localise
        WHICH emulsifier entries are load-bearing for the non-degeneracy, which
        a bare pass/fail cannot do. At r = 1 only the k diagonal matrices are
        excited, so planting on off-diagonal entries alone must leave
        delta_max = 0 at r = 1 and can only appear at r >= 2 -- a sharp,
        derived, falsifiable prediction about WHERE in the sweep the effect
        turns on.
    - metric: >-
        slice_advantage_ratio: q^delta * Cost_MQ(m - delta, r n) /
        Cost_MQ(m, k n), evaluated for every (C, r) with delta(C) >= 1 found
      direction: lower
      minimum_effect: >-
        Reported for every defect found, with the MQ cost model named and its
        source cited. Below 1 means the slice attack beats the unrestricted
        attack; at or above 1 the defect is real but unprofitable, which is a
        result and must be reported as such rather than upgraded.

  minimal_test:
    design: >-
      Four stages, cheapest decisive first. STAGE 1 can terminate the line at
      zero compute.
      STAGE 0 (reading, no compute): obtain the Round-3 specification and quote
      the whipped map and the emulsifier construction verbatim; if the E_ij are
      NOT drawn from a field-isomorphic algebra, record what the actual
      condition is, because the forced value changes.
      STAGE 1 (algebra, no compute, DECISIVE EITHER WAY): re-derive the
      factorization identity; then, under the quoted emulsifier construction,
      decide by field algebra whether delta(C) = 0 is forced at r = 1. If it is
      forced AND the same argument extends to r = 2, the structural half of the
      goal's completion criterion is met on paper and the remaining stages are
      confirmation rather than discovery.
      STAGE 2 (toy computation, seconds to minutes, pure Python + numpy 2.4.6
      with GF(16) log/exp tables -- VERIFIED PRESENT IN THIS CONTAINER; no Sage,
      no sympy, no galois, so all field arithmetic is hand-rolled and that is a
      declared implementation obligation, not an assumption): at toy
      (q, m, k) with m in {4, 6, 8} and k in {3, 4}, enumerate the r = 1 slice
      space exhaustively up to scalars and the r = 2 slice space exhaustively
      or to a stated coverage fraction, computing delta(C) by exact rank over
      F_q, for the four arms (real-shaped, random null, planted positive,
      graded j-sweep).
      STAGE 3 (scaled sample at real m, optional): at the specification's own
      (q, m, k), sample C uniformly with a declared budget and report the
      coverage fraction. NO CLAIM OF EXHAUSTIVENESS IS PERMITTED AT THIS STAGE
      and the record must state the fraction of the slice space actually
      touched.
    controls:
      - >-
        MATCHED NULL (same shape, forced value derived pre-run, CAN FAIL):
        emulsifier matrices drawn uniformly from F_q^{m x m}, identical m, k,
        r, identical search code and identical enumeration order. Forced
        expectation delta_max >= 1 with probability essentially 1 at toy sizes,
        from the singularity probability computed in the predictions. A null
        that returns 0 invalidates the whole measurement.
      - >-
        POSITIVE CONTROL / PLANTED DEFECT (the effect MUST appear): build the
        emulsifier as E_ij = M_ij with a common left kernel vector u planted on
        every matrix (e.g. take arbitrary matrices and zero out the u-component
        of every row space). delta(C) >= 1 must be recovered at every nonzero C.
        Failure here means the search or the rank code is broken and NO
        NEGATIVE RESULT MAY BE REPORTED (inventor protocol section 3;
        KN-TECH-1a5b7e's sensitivity obligation).
      - >-
        GRADED CONTROL WITH >= 3 INTERIOR POINTS, MONOTONICITY REPORTED: the
        j-sweep in the predictions, j = 0..k(k+1)/2, planting the common kernel
        on progressively more emulsifier matrices. Reports where the defect
        turns on, separates diagonal from off-diagonal excitation, and
        localises the obstruction instead of leaving 'it did not work'.
      - >-
        IDENTITY CONTROL (zero compute, catches the deepest possible bug):
        verify the factorization numerically. Draw random y_1..y_r and random
        C, evaluate P*(C y) directly from the whipped map's definition and
        again from the right-hand side of the identity, and require BITWISE
        equality over many random draws. If the identity does not hold
        numerically, every downstream number is meaningless. This is the first
        thing the implementation must do and the cheapest possible falsifier of
        the mechanism.
      - >-
        VERDICT-ON-THE-NULL-FIRST: run and commit the null and planted arms,
        and the decision rule's output on them, BEFORE the real emulsifier arm
        is looked at. If the rule emits the same label on the null and the
        planted arm it discriminates nothing and must be rewritten before the
        real arm is read.
      - >-
        ARCHIVE CHECK (zero compute): no prior measurement of this observable
        exists anywhere in the corpus -- area MAYO has no experiments, no runs
        and no evidence records. Recorded as unavailable, not as a passed check.
    required_metrics:
      - delta_max per arm, with the slice space size and the fraction enumerated
      - the full delta histogram per arm, not just the maximum
      - the identity-control pass count and the number of random draws
      - the j-sweep table with monotonicity stated
      - for every defect found, the slice_advantage_ratio with the MQ cost model named
      - GF(16) arithmetic self-test vectors and their source

  falsification_conditions:
    - >-
      The identity control fails: P*(C y) computed two ways disagree. The
      mechanism as written is wrong and everything downstream is void.
    - >-
      delta_max_real >= 1 at toy parameters. The predicted forced value is
      falsified and the proposal's headline flips from 'named obstruction' to
      'whipping-induced equation loss' -- which must then be costed with the
      slice_advantage_ratio before any security claim is made.
    - >-
      delta_max_null = 0. The instrument cannot detect a defect and no negative
      may be reported.
    - >-
      The planted positive control is not recovered. Same disposition.
    - >-
      Stage 0 shows the emulsifier is not field-based and the field argument
      does not apply. The forced value 0 loses its derivation and becomes a
      measurement, which raises this proposal's priority rather than lowering
      it.

  confounders:
    - >-
      TOY m IS NOT REAL m. The field argument is m-independent, but the
      exhaustive search is only possible at toy m and k. A toy delta_max = 0
      is NOT evidence that delta_max = 0 at m = 64, k = 9; the transfer is
      carried by the field argument alone, and that must be stated on every
      citation.
    - >-
      SLICE FAMILY IS A CHOICE. C in F_q^{k x r} is the natural linear slice
      family. An attacker could use blocks x_i = phi_i(y) with phi_i arbitrary
      F_q-linear maps on F_q^n, for which the factorization does NOT collapse to
      r(r+1)/2 terms and delta is not the right object. The negative this
      proposal can produce is therefore scoped to SCALAR slices, and forward
      guidance naming the linear-map generalisation is mandatory.
    - >-
      SPEC DRIFT. Round-3 tweaks were due 2026-08-14 and could change the
      emulsifier. Any result must name the specification version it tested.
    - >-
      REFUTING BY DESIGN IS CHEAP. Predicting 0 and measuring 0 costs nothing
      and reads as rigour. The planted and graded controls exist so that a
      negative outcome has to survive an instrument that demonstrably can move.

  interpretation_limits:
    - >-
      NO ATTACK IS CLAIMED. delta_max = 0 is a scoped structural statement
      about the tested emulsifier at the tested parameters under the scalar
      slice family; it is NOT a proof that whipping is secure, and it says
      nothing about attacks that do not restrict to a slice.
    - >-
      delta_max >= 1 is NOT a break. It is an equation-loss structure whose
      value to an attacker is decided by the slice_advantage_ratio, which
      includes the q^delta salt-grinding penalty for forgery and the loss of
      (k - r) n variables. Reporting a defect as a break would be exactly the
      partial-cost error AGENTS.md rule 4 forbids.
    - >-
      CLAIM TIER toy for every measured number; the field argument is a
      derivation and is tiered as such. AGENTS.md rule 7 applies without
      exception.
    - >-
      Any claimed oil-space recovery arising from a defect requires a
      certificate under docs/claims-and-verification.md -- the recovered
      subspace must annihilate the public map under independent re-verification
      -- and none is claimed here.

  heuristic_assumptions:
    - id: HEUR-MAYO-DEF-1
      statement: >-
        NOT LOAD-BEARING, RECORDED FOR COMPLETENESS. The factorization identity
        P*(C y) = sum_a D_a(C) P(y_a) + sum_{a<b} F_ab(C) P'(y_a,y_b) is
        unconditional given the whipped map's form and characteristic 2. No
        distributional assumption enters it.
      rigorous_support: >-
        Bilinearity and symmetry of P', homogeneity P(cx) = c^2 P(x), and
        P'(y,y) = 2P(y) = 0 in char 2. Written out in the mechanism.
      validation_plan: >-
        The identity control: numerical equality of the two evaluations over
        many random (C, y) draws at toy parameters. Exact, not statistical.
    - id: HEUR-MAYO-DEF-2
      statement: >-
        LOAD-BEARING. FORALL nonzero C in F_q^{k x r}: not all of
        {D_a(C)} union {F_ab(C)} vanish, and (given a field-based emulsifier)
        therefore delta(C) = 0. Equivalently: the F_q-span of the emulsifier
        family, as a rank-metric code in F_q^{m x m}, has minimum rank distance
        m, and the induced conditions on C are independent.
      random_model_justification: >-
        NOT A RANDOM-MODEL CLAIM -- it is an algebraic claim about a specific
        public object, and that is why it is testable at zero compute. The
        supporting argument is that a nonzero element of a field acts
        invertibly in its regular representation, plus F_q-linear independence
        of the k diagonal elements eps_ii in F_{q^m}. BOTH THE FIELD
        CONSTRUCTION AND THE INDEPENDENCE ARE RECALLED, UNVERIFIED, and the
        second is not automatic if the spec reuses powers of a single element.
      supporting_results: >-
        None cited, because none has been read. The regular-representation fact
        is elementary and is derived rather than cited; the specification's
        emulsifier construction is the unread input.
      validation_plan: >-
        Stage 0 reading plus Stage 2 exhaustive toy enumeration against the
        matched null, the planted positive and the graded sweep.
    - id: HEUR-MAYO-DEF-3
      statement: >-
        LOAD-BEARING FOR THE COST STATEMENT ONLY. Cost_MQ(M, N), the cost of
        solving M quadratic equations in N variables over F_q, is monotone
        increasing in M and decreasing in N over the ranges used, so that the
        slice_advantage_ratio is well defined.
      random_model_justification: >-
        Standard for generic systems, and semi-regularity is the usual
        justification -- which is precisely the assumption the session
        ANGLE-BRIEF records as failing for structured systems in 24 files of
        this corpus. It is named here rather than inherited silently, and any
        cost figure derived from it carries the caveat.
      supporting_results: >-
        None cited; the corpus holds no verified MQ cost model and
        GOAL-UOV-001 exists to build one. Whatever convention that goal fixes
        is substituted here.
      validation_plan: >-
        Report the ratio under at least two named cost conventions and show
        whether the verdict is convention-independent. If it is not, say so.

  target_complexity:
    time_exponent: >-
      No exponent is moved by this proposal as such. IF a defect delta were
      found and the slice_advantage_ratio came out below 1, the exponent moved
      would be that of MQ solving in the equation count: m -> m - delta, which
      at a per-equation cost factor above q is worth more than the q^delta
      penalty. The record refuses to state a bit figure in advance because it
      would require a cost model this program has not built.
    memory_exponent: >-
      The defect search itself is trivial in memory (m x m matrices over F_q).
      Any resulting attack inherits the memory of the substituted MQ solver,
      and the slice_advantage_ratio MUST be reported with a memory column
      beside the time column, per docs/target-result-profile.md's cost-honesty
      requirement.
    best_known: >-
      For MAYO Level I the best-known direct attack is, per KN-LIT-1818
      (RELAYED, UNVERIFIED), 8 bits below the published figure. This program
      holds no independently derived MAYO cost, and this proposal does not
      supply one.
    hidden_overhead: >-
      The slice restriction hides the loss of (k - r) n variables, which is not
      an overhead but a genuine cost to the attacker and is charged explicitly
      in the slice_advantage_ratio. The salt-grinding factor q^delta is charged
      for forgery and correctly NOT charged for oil-space recovery.
    tradeoff_note: >-
      Every defect trades equations against variables. There is no configuration
      in which a slice is free, and any presentation that omits the variable
      loss is incomplete.

  dominated_by: >-
    n/a for the audit itself (no attack, no Pareto point). For the attack it
    would enable if a defect were found, the frontier row to beat is the
    best-known direct attack on MAYO -- reported by KN-LIT-1818 as 8 bits below
    the published Level I figure, RELAYED AND UNVERIFIED. Rows checked, and
    what the check could see: all MAYO/UOV proposals in ledger/proposals
    (IDEA-20260801-013..018), RQ-MAYO-001 and RQ-UOV-001, GOAL-MAYO-001 and
    GOAL-UOV-001, all three corpus literature entries mentioning MAYO
    (KN-LIT-1205, KN-LIT-1818, KN-LIT-7620), and knowledge/techniques (no UOV,
    MAYO or rank-metric-emulsifier entry exists). Time, memory and
    data/query axes were checked to the extent possible, which is: NO IN-CORPUS
    RECORD STATES ANY MAYO ATTACK COST ON ANY AXIS, so there is no frontier row
    here to be dominated by, and the external frontier is known to this program
    only through a bulk-seeded relayed abstract. That is a weak screen and it
    is stated as one (session ANGLE-BRIEF T-H: 95 percent of the 7,809
    literature entries carry the bulk-seed caveat, so no novelty screen in this
    corpus should be trusted as exhaustive).
  sota_delta: >-
    Predicted outcome: zero delta on every attack axis (no attack, structural
    negative). Quantitatively the deliverable is an integer delta_max per arm
    with its full histogram, plus a derived forced value of 0 for the
    field-based emulsifier -- replacing an empty cell, since the corpus holds
    no measurement of any MAYO structural quantity. In the falsifying branch
    (delta_max >= 1 with slice_advantage_ratio below 1) the delta would be
    m -> m - delta equations against the best-known direct attack, and the bit
    figure would be computed then, not asserted now.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.12 that a defect with delta >= 1 exists for the specification's actual
    emulsifier at its actual parameters under scalar slices. Not lower: the
    signing-time condition a specification must guarantee is not obviously the
    same as the all-slices condition an attacker exploits, the r >= 2 case
    involves quadratic conditions on C where the clean counting argument does
    not automatically apply, the emulsifier construction here is recalled and
    not read, and a Round-3 tweak was due within days of this record. Not
    higher: the field-based construction, if it is what the spec uses, forces
    delta = 0 by a one-line argument that no parameter choice can evade, and a
    designer who chose that construction almost certainly chose it for exactly
    this reason. Separately, 0.9 that the line reaches a decisive reading,
    because Stage 1 is pen-and-paper and Stage 2 is seconds of pure-Python
    linear algebra over a 16-element field.
