  assumptions:
    - >-
      The cardinality bound uses factor bases whose elements are images of
      F_2-rational points, with |F| at most the Weil ceiling. A family with
      free parameters in an extension can be larger, and that case is
      outside the inequality.
    - >-
      Each x-coordinate on the target curve has at most two rational points
      over the algebraic closure of the base of the x-line. The factor 8 at
      m=3 is that lift count.
  proof_search_map:
    bottleneck: >-
      The arity m forced by |F| <= Weil ceiling, because Semaev degree
      2^{m-2} is exponential in that arity.
    baseline_embedding:
      parameter_slice: >-
        n=17, cyclotomic torus of dimension phi(8)=4, since Phi_8(2)=17
        as in the hand table of IDEA-20260926-80209d. Group law: field
        multiplication. This is the written torus construction at a prime
        where it exists, used as a baseline, not as a new existence proof.
      reproduction_check: >-
        Recompute Phi_8(2) as 2^4+1 = 17 by integer arithmetic before any
        fibre is built. Then build one fibre equation b^2 = b*t in a basis
        of F_{2^8} and record the Boolean variable count after Weil descent
        to F_2 against the prediction g*n = 68.
    observation_collision:
      observable: the triple (g, ceiling, least m)
      distinct_preimage_search: >-
        Two groups with the same rational-point ceiling and different
        descended Boolean counts are a collision: the ceiling does not
        determine the variable count. The torus arm and a subspace of size
        2^4 are the two preimages compared at n=17.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The Weil ceiling at g=5 and g=6, lifted from an emptiness
          statement about dimensions <= 4 to an arity lower bound at n=131.
        predicted_gain: >-
          Exact integers m=11 and m=9, and Semaev degrees 512 and 128,
          in place of an unpriced residual.
    quantifier_order: >-
      For all factor bases with |F| <= 39201 and at most two curve points
      per x-coordinate, the m=3 sumset image has size below 2^{51} and
      meets a fraction below 2^{-80} of a set of size 2^{131}. The least m
      with |F|^m >= 2^{131} is at least 9. Exists a parametrization outside
      this forall: a positive-dimensional family of extension points. That
      exists-clause is not constructed here.
    method_ceiling:
      strongest_certifiable_claim: >-
        The arity bound for rational-point bases of dimension <= 6, and a
        Boolean variable count at n=17 for the torus fibre. The method
        cannot certify that every Galois-invariant base misses rho, because
        extension families are outside the forall.
      nearby_object_control: >-
        An F_2-subspace of dimension 8 inside F_{2^{17}}, which has size
        2^8 and is not a rational-point set of a dimension-4 group. If the
        torus arm has the same Boolean count and the same first-fall degree
        as this subspace, the group law has not reduced the system.
    proof_obligations:
      - claim: Successive multiplication of 6725 and of 39201 reproduces least m = 11 and 9.
        responsibility: correctness
      - claim: The n=17 torus arm reports Boolean count, first-fall degree, and |F|.
        responsibility: baseline
      - claim: The image-fraction sentence is scoped to |F| at most the ceiling and to at most two points per x-coordinate.
        responsibility: scope
      - claim: Semaev degree 2^{m-2} is applied only after m is the exact least integer.
        responsibility: runtime
    not_applicable_reason: >-
      None. Bottleneck, baseline, collision, transform, quantifier order,
      and ceiling all apply.
  predictions:
    - metric: least m with ceiling^m >= 2^{131}, integer, at g=5 and at g=6
      direction: higher
      minimum_effect: 11 at g=5 and 9 at g=6, both strictly above 3
    - metric: Boolean variable count of the n=17 torus fibre after Weil descent, integer
      direction: higher
      minimum_effect: 68, that is g*n with g=4 and n=17, before quotienting by linear dependencies
  minimal_test:
    design: >-
      Two arms. Arm A is integer arithmetic only, at n=131, no curve: start
      from 1 and multiply by 6725 until the product meets or exceeds 2^{131};
      repeat for 39201; record the least m and 2^{m-2}. Arm B is the toy
      cell n=17. Elliptic curve: deterministic Koblitz search y^2 + x y =
      x^3 + a x^2 + b over F_2, first pair whose E(F_{2^{17}}) has a prime
      factor of bit length at least 15; (a, b) written out. Auxiliary group:
      the cyclotomic torus of dimension 4 over F_2 with Phi_8(2)=17,
      multiplication in a fixed basis of F_{2^8}. Factor base: one coordinate
      of the fibre of an element t of order 17. Arity m=3. Attempts: one
      elimination. Seeds: none. Instrument path: to be written. Null curve
      over F_{2^{17}} not defined over F_2, same cardinality. Metrics:
      least m, Semaev degree, Boolean variable count, first-fall degree, |F|.
    controls:
      - Recomputation of Phi_8(2)=17 before the fibre is built.
      - Subspace of F_{2^{17}} of dimension 8, same pipeline.
      - Orbit-union encoding (representative, shift) of that subspace, as the KN-FIND-47da4e baseline.
      - Identity projection, predicted Boolean count equal to the ambient dimension with b=1.
      - Relabelled Z/17Z: the fibre equation is replaced by addition of 1 in Z/17Z and the Boolean count is recomputed; a match with the torus arm means the count is an encoding artifact.
      - Null curve over F_{2^{17}}.
    required_metrics:
      - least m at g=5 (integer)
      - least m at g=6 (integer)
      - Semaev degree 2^{m-2} at those arities (integer)
      - Boolean variable count at n=17 (integer)
      - first-fall degree at n=17 (integer)
    outcomes:
      positive: >-
        Arm A returns m=11 and m=9, and arm B returns a Boolean count
        strictly smaller than both 68 and the equal-cardinality subspace
        count, with the Z/17Z control not reproducing that drop. That drop
        is the only shape in this record that could move a decomposition
        exponent, and it would still be a toy observation.
      negative: >-
        Arm A returns m=11 and m=9, and arm B's Boolean count is at least
        68 before dependency quotient and, after quotient, matches the
        subspace arm. Rational-point Couveignes bases at g <= 6 then sit
        above the m=3 benchmark, and the exponent n/2 is untouched.
      artifact: >-
        Phi_8(2) is not 17 in the instrument, or successive multiplication
        disagrees with m=11 and m=9, or the field arithmetic fails a
        fixed multiplication check in F_{2^8}. No image-fraction claim is
        kept from a failed multiplication check.
  falsification_conditions:
    - Successive multiplication yields a least m other than 11 at g=5 or other than 9 at g=6.
    - The n=17 Boolean count after descent is strictly below the subspace arm and the Z/17Z control does not show the same drop.
    - A rational-point set of an explicit group of dimension <= 6 exceeds the Weil ceiling used here.
  confounders:
    - Linear dependencies among descended coordinates can lower the count after a quotient. The metric is reported both before and after that quotient.
    - Repeated summands and the m! orderings shrink the image further. The published bound uses the larger count |F|^m times 2^m, so it is an upper bound on the image.
    - Orbit-union encoding can change SAT variable count without changing the set. The subspace arm and the shift arm are both reported, following KN-FIND-47da4e.
  interpretation_limits:
    - The bound stops at rational-point images of dimension <= 6. Extension families are the open window and are the subject of the Mumford, Kummer, and Artin-Schreier proposals.
    - KN-OPEN-020 class: implicit-membership. Description, membership, relation, descent, time, and memory are the five reported metrics plus the Macaulay memory note.
    - No attack is run at field degree >= 131. The n=131 arm is multiplication of two integers. ECC2K-130 is not an instance. The figure 2^60.9 is a citation, not a result of this record.
    - m=9 and degree 128, or m=11 and degree 512, are charged costs. They are not a claim that the Groebner basis finishes, and they are not a claim that it beats 2^60.9.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Each ordered m-tuple of x-coordinates determines at most 2^m sums
        on E, and |F| <= 39201, so the m=3 image has size below 2^{51}.
      rigorous_support: >-
        At most two points lie above a given x on a nonsingular plane cubic.
        The size bound |F| <= 39201 is the g=6 ceiling written in
        KN-OPEN-095df5. The classical pattern imitated is the trivial
        sumset estimate |mF| <= |F|^m, with the 2^m lift written explicitly
        rather than hidden.
      validation_plan: >-
        Arm A re-multiplies 39201 and 6725 up to 2^{131} and checks
        8 * ceiling^3 < 2^{51}. At n=17, sample the 256 field elements with
        polynomial-basis representatives 0..255 and count how many lie in
        the m=3 image of the measured fibre; the count must be <= 8*|F|^3.
        Tail check: a single excess witness voids H1 for that arm. The
        n=131 statement uses only the integer products, not the n=17 ratio.
    - id: H2
      statement: >-
        Each of the g torus coordinates of a fibre point is a free element
        of F_{2^n} before the fibre equations are imposed, giving g*n
        Boolean variables at descent.
      rigorous_support: >-
        None beyond the definition of Weil restriction. The pattern imitated
        is a generic linear independence statement: g random vectors in
        F_2^n are independent when g < n. Here g=4 and n=17.
      validation_plan: >-
        At n=17, row-reduce the g*n descended coordinates before adding S_3
        and record the rank. Tail check: rank equals 68 or the deficiency
        is listed as an explicit set of linear forms. The n=131 ledger does
        not use this rank.
  target_complexity:
    time_exponent: >-
      n/2 for rho, unchanged. Under the rational-point cap at g <= 6 the
      decomposition arity is at least 9, so the Semaev degree is at least
      128, which is a larger degree than the m=3 benchmark and is not a
      reduction of n/2.
    memory_exponent: >-
      Van Oorschot-Wiener distinguished-point memory, unchanged. Macaulay
      memory at Semaev degree 128 in the descended variables is not claimed
      to be smaller than rho memory.
    best_known: >-
      Pollard rho ~ 2^{n/2} / n^{1/2} on Koblitz, 2^60.9 at n=131.
      Index calculus has no better proven exponent on prime-degree binary
      curves (KR-IC-1fcdbc, KR-IC-9e610d, KR-IC-ae532f). The system-count
      ceiling is the factor 1/n of KR-IC-b0fcda.
    hidden_overhead: >-
      The factors 1/n and n^2 are polynomial in n. The sign lift 2^m and
      the ordering factor m! sit inside the image bound and are named.
      Semaev degree 2^{m-2} at the forced m is 128 or 512, which is
      superpolynomial in g and is named rather than hidden in o(1).
    tradeoff_note: >-
      Rho's van Oorschot-Wiener curve trades memory for time at a product
      on the order of the group order divided by n. This ledger offers no
      point on that curve. Parallel search of m-fold sums does not lower
      the arity.
