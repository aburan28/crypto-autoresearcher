idea:
  id: IDEA-20261002-cad44c
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    Weil-cap arity ledger for a rational-point Couveignes factor base: at
    genus at most 6 and n=131 an m=3 sumset covers less than 2^{-80} of the
    group, and the least covering arity is 11 and 9.
  class: mechanism
  claim: >-
    Any Couveignes factor base built from F_2-rational points of a
    commutative algebraic group of dimension g <= 6 has cardinality at most
    the Weil ceiling, 6725 at g=5 and 39201 at g=6. Both ceilings are
    strictly below 2^{16}, so an ordered triple from the base has fewer
    than 2^{48} choices. Each x-coordinate lifts to at most two curve
    points, so an m=3 x-tuple produces at most 8 sums and the image has
    size below 2^{51}. Against a group of size 2^{131} that image is a
    fraction below 2^{-80}. Exact successive multiplication gives the least
    m with ceiling^m >= 2^{131} as 11 at g=5 and 9 at g=6, and the Semaev
    degree 2^{m-2} is then 512 and 128. The target point is R1. The stage
    is relation collection. This ledger does not apply to a
    positive-dimensional family of extension points, which is the open window.
  mechanism: >-
    Meeting: algebraic geometry (dimension g and the Weil ceiling on
    #A(F_2)) and elliptic curves (Semaev degree 2^{m-2} composed with the
    image of an m-fold sumset).
    OBJECT FRAME. Representation: the x-coordinate of the elliptic point
    in F_{2^n} (R1). Operation set Sigma: translation on E by factor-base
    elements only. Sigma is not full translation.
    TRICHOTOMY. Partial-action. Reason: the tracked object is the relation
    vector, which increments by one basis vector under translation by a
    factor-base element and does not propagate under a general translation.
    LOSSY-PROJECTION TEST against that Sigma. Discarded: the discrete log,
    and every point that has no m-term decomposition. Compatible: when a
    decomposition exists, translation by a factor-base element adds one to
    a coordinate, so the vector is a block system of the factor-base
    translates inside the decomposable set. Lossy: distinct logs can share
    a relation vector after reduction, and a generic point contributes the
    empty decomposition. Not a change of coordinates.
    PRICE. Canonicalising one Frobenius orbit of a relation costs n
    squarings and buys the factor 1/n already stated by KR-IC-b0fcda. That
    price does not move the exponent n/2. The open number beside it is the
    Boolean variable count after Weil descent of the fibre, compared with
    g*n and with the subspace dimension of an equal-cardinality vector space.
    OFF-LIMITS COMPONENT. F2 is the stage being priced. The two written
    Couveignes constructions and the stable-subspace classification are
    components: the torus at n=17 is the explicit law used as the baseline,
    and IDEA-20260918-9abf42 supplies the four stable dimensions at n=131.
    Added: the arity forced by the Weil ceiling, and the Boolean count of
    the descended S_3 system, which IDEA-20260926-6f2601 explicitly does
    not price.
    FACTOR-BASE ESCAPE. KN-OPEN-020 class: implicit-membership for the
    fibre equations, high-degree if the eliminant degree exceeds 1.
    Charges: description is the group law; membership is the fibre ideal;
    relation is S_m; descent is Weil descent; time is the image-size
    bound below; memory is the Macaulay basis at degree 2^{m-2}.
    REPRESENTATION CLASS. R1. Stage: relation collection. Kummer-line
    models of E are not used.
  novelty_status: unverified
