idea:
  id: IDEA-20261005-474802
  question_id: RQ-DRINF-6b5a9d
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Geometric (T+1)-torsion of the rank-2 Drinfeld module
    Phi_T = tau + tau^2 over F_3, as the finite shadow of a rank-2
    period lattice, against the rank-1 Carlitz reduction.
  class: mechanism
  claim: >-
    Let q = 3 and let Phi be the rank-2 Drinfeld F_3[T]-module of
    A-characteristic (T) given by Phi_T = tau + tau^2, so
    Phi_{T+1}(x) = x + x^3 + x^9. The geometric kernel has 9 distinct
    roots. The rank-1 control, the reduction of the Carlitz module at
    characteristic (T), is Psi_T = tau and Psi_{T+1}(x) = x + x^3,
    with 3 distinct roots. The exponent equals the tau-degree. It is
    not copied from the elliptic square onto every Drinfeld module.
    No ECDLP exponent is in scope.
  mechanism: >-
    Period lattice, not class-field counting. Two explanations.
    Lattice reading: Drinfeld uniformization, recalled and not opened,
    matches a rank-r module with an A-lattice of rank r, whose finite
    shadow is |Phi[a]| = q^{r deg a} when Phi_a is separable. Elliptic
    mis-reading: the analogy "torsion is always a square" would give
    9 roots for the Carlitz control as well. The control decides.
    KN-LIT-1515's abstract, title-level, says the analogy with
    elliptic curves comes with a rank difference. This computation is
    that rank difference at one prime. It does not enumerate
    characteristic polynomials and does not build a class field.
    LOSSY-PROJECTION TEST. The ambient group is the additive group.
    Operation set Sigma is the image of F_3[T] under Phi, composition
    of additive polynomials, not elliptic translation. The projection
    keeps Phi[T+1] and discards every point outside that kernel.
    Compatible with Sigma: Phi_a maps the kernel into itself because
    Phi is a ring homomorphism. Lossy: the kernel is finite and the
    additive group is not, so the projection is not a coordinate
    change. Not a projection of a prime-order elliptic subgroup.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-1515
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. The
        abstract says the survey starts from the Carlitz module,
        emphasises analogies with elliptic curves, and names rank
        structure and Anderson motives as differences. No torsion
        cardinality is given.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-1515.md
    - ref: KN-LIT-174
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. Read so
        this idea would not reuse it. The abstract discusses the
        endomorphism ring, the characteristic polynomial, and the
        number of isogeny classes. That count is the other idea.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-174.md
    - ref: Drinfeld 1974
      provenance: recalled
      claim: >-
        Recalled pointer, not opened: Drinfeld modules and
        uniformization by A-lattices in the completion at infinity.
        Not support.
      verified_by: null
  assumptions:
    - tau is the q-power Frobenius x |-> x^3.
    - At A-characteristic (T), the constant term of Phi_T is 0.
    - T+1 is not divisible by T, so the degree-1 coefficient of Phi_{T+1} is 1.
    - The kernel is the set of distinct roots in a splitting field, not the set of roots already in F_9.
  predictions:
    - metric: number of distinct geometric roots of x + x^3 + x^9
      direction: different
      minimum_effect: 9
    - metric: number of distinct geometric roots of x + x^3
      direction: different
      minimum_effect: 3
    - metric: degree-1 coefficient of Phi_{T+1}
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Read KN-LIT-1515's local PDF only far enough to confirm the
      Carlitz module and the rank convention the abstract names. The
      markdown is title-level and does not contain a torsion table.
      Then, over F_3, expand Phi_{T+1} and Psi_{T+1}, record the
      degree-1 coefficient, and count distinct roots in a splitting
      field by a separable factorization. Compare 9 against 3. Do not
      compute a characteristic polynomial.
    controls:
      - Rank-1 Carlitz reduction must have kernel size 3. Size 9 on that control supports the mis-reading that every Drinfeld torsion is a square.
      - Derivative of each polynomial must be the constant 1. A zero derivative means the example was inseparable and the count is void.
      - Roots are counted in a splitting field. F_9-rational roots of x + x^3 + x^9 are not the metric: on F_9 one has x^9 = x, so the polynomial collapses.
    required_metrics:
      - rank2_geometric_kernel_size
      - rank1_geometric_kernel_size
      - degree1_coefficient
  falsification_conditions:
    - The rank-2 geometric kernel has size other than 9 while the degree-1 coefficient is 1.
    - The rank-1 geometric kernel has size other than 3 while its degree-1 coefficient is 1.
    - The degree-1 coefficient is 0. The separability hypothesis failed and the example is withdrawn, not reinterpreted.
  confounders:
    - Counting F_9-points instead of geometric roots undercounts the rank-2 kernel, because x^9 = x on F_9.
    - A different normal form of the Carlitz module that keeps a nonzero constant term is not the reduction at characteristic (T).
    - Multiple roots from an inseparable polynomial inflate or collapse the count. The derivative check blocks that.
  interpretation_limits:
    - One prime of degree 1. No statement about the lattice in the completion at infinity beyond this finite shadow.
    - Anderson motives, named in the KN-LIT-1515 abstract, are not computed.
    - Not an attack claim. No ECDLP exponent is in scope.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For a in F_q[T] not divisible by the characteristic, a
        separable rank-r Drinfeld module has |Phi[a]| = q^{r deg a}.
        This imitates |E[n]| = n^2 for n coprime to the characteristic
        of an elliptic curve. The sample is a = T+1, q = 3, r in
        {1, 2}. No transfer to larger degree is claimed.
      rigorous_support: >-
        A separable additive polynomial over F_q whose degree is q^r
        has q^r distinct roots in a splitting field. Separability is
        the degree-1 coefficient, equal to the image of a in the
        field. The identification of that count with the cardinality
        of Lambda / a Lambda is Drinfeld 1974, provenance recalled,
        not opened. KN-LIT-1515 states the elliptic analogy and the
        rank difference only at abstract level.
      validation_plan: >-
        At q = 3 and a = T+1, check the degree-1 coefficient and the
        geometric root counts 9 and 3. The rank-1 arm is the
        nearby-object control. No further sample.
  target_complexity:
    time_exponent: >-
      Polynomial in q and in deg(T+1). Named values q = 3 and
      deg = 1. No sub-rho claim.
    memory_exponent: >-
      O(q^{r deg a}) roots. At the named instance that is 9 roots
      and 3 roots.
    best_known: >-
      No ECDLP exponent is in scope. Opened baselines KN-LIT-1515
      and KN-LIT-174 are title-level and give no torsion numeral.
    hidden_overhead: >-
      None. Root counting at degree 9 is the whole test.
    tradeoff_note: No time-memory tradeoff. The kernel is listed in full.
