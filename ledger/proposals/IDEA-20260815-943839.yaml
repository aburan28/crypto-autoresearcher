idea:
  id: IDEA-20260815-943839
  question_id: RQ-SSI-001
  added: '2026-08-15'
  title: >-
    DELFS-GALBRAITH AND THE p^(1/3) ALGORITHM ARE COMPARED ONLY
    ASYMPTOTICALLY; MEASURE THE CROSSOVER PRIME WHERE THE NEW ALGORITHM
    ACTUALLY WINS UNDER MATCHED MEMORY CHARGING
  class: measurement

  claim: >-
    The new algorithm's memory is essentially as large as its time, while
    Delfs-Galbraith uses negligible memory. An asymptotic comparison
    ignoring that is not a comparison at all. The crossover prime under
    matched memory charging is the number that determines whether the result
    affects deployed parameters, and it has not been computed here.

  mechanism: >-
    Cost both algorithms under one stated model including memory access
    cost. Sweep prime size. Report the crossover, and repeat under several
    memory-cost models since the answer is sensitive to that choice.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of the paper's concrete-cost table and its memory-honesty
      disclosure; grep for 'crossover', 'Delfs-Galbraith', 'memory
      charging'.
    results: >-
      The published table gives time and memory at standardized sizes and
      names the van Oorschot-Wiener tradeoff; no record computes a
      crossover prime under matched memory charging.
    verdict: >-
      ADAPTATION. Charged comparison is this program's declared standard;
      applying it to this pair is what is missing.

  object_first_candidate:
    tracked_object: >-
      THE CROSSOVER PRIME between the two algorithms under a stated
      memory-cost model.
    lossiness: >-
      A single crossover number projects away the whole tradeoff curve,
      which is why several memory models are reported rather than one.
    propagation: >-
      Not applicable; this record proposes no tracked object propagating
      under a group law.
    survival_score: >-
      Survives while both cost models are instantiable; the answer is only
      as stable as the memory-cost model, which is why it is swept.

  null_object_control: >-
    NULL 1 -- free memory, under which the crossover must reproduce the
    published asymptotic comparison. NULL 2 -- infinitely expensive memory,
    under which Delfs-Galbraith must always win. Both bracket the answer.

  discriminated_from:
    - >-
        The published concrete-cost table. THAT REPORTS time and memory
        separately at fixed sizes; this computes where the charged totals
        cross.
    - >-
        The van Oorschot-Wiener tradeoff cited in the paper, which
        interpolates between the two; this record locates the crossover
        rather than describing the interpolation.

  assumptions:
    - >-
        A defensible memory-cost model exists; since it does not uniquely,
        several are swept and the spread is the honest answer.
    - >-
        The published cost model is reproducible from the frozen text.

  predictions:
    - metric: >-
        free-memory null
      direction: different
      minimum_effect: >-
        FORCED to reproduce the published comparison.
    - metric: >-
        expensive-memory null
      direction: different
      minimum_effect: >-
        FORCED: Delfs-Galbraith wins everywhere.
    - metric: >-
        crossover prime across memory models
      direction: different
      minimum_effect: >-
        The measurement; reported as a range across models, never a
        single number.

  minimal_test:
    design: >-
      Symbolic cost instantiation plus a numeric sweep; both bracketing
      nulls first.
    controls:
      - >-
          Free-memory and expensive-memory brackets.
      - >-
          Published-table reproduction.
      - >-
          Several memory-cost models, reported together.
    required_metrics:
      - >-
          Crossover prime per memory model.
      - >-
          Bracket outcomes.
      - >-
          The stated cost model, applied to both sides.

  falsification_conditions:
    - >-
        A bracket null fails. Cost harness wrong.
    - >-
        The crossover lies above all deployed parameter sizes. The result
        does not affect deployed systems at any tested memory model, which
        is a decision-relevant scoped negative.
    - >-
        The crossover varies by orders of magnitude across memory models.
        The comparison is model-determined and no single crossover may be
        quoted.

  confounders:
    - >-
        MEMORY-MODEL ARBITRARINESS, which is the dominant risk: the
        crossover is a function of a modelling choice and quoting one
        number would be indefensible.
    - >-
        o(1) OVERHEAD: the paper discloses superpolynomial hidden
        overhead, which shifts the crossover upward in a way a naive
        instantiation misses.

  interpretation_limits:
    - >-
        A cost comparison under stated models; establishes no new
        algorithm and no new bound.
    - >-
        Scoped to the two algorithms and the swept memory models.

  heuristic_assumptions:
    - id: HEUR-SSI-XOVER-1
      statement: >-
        The charged cost of both algorithms is captured by a model
        counting field operations plus a memory-access penalty
        proportional to a power of the table size.
      rigorous_support: >-
        The rigorous ingredient is the paper's own operation-count
        model, stated in section 4.1 with its optimistic assumptions
        flagged. THE GAP: the memory-access penalty exponent is a
        hardware modelling choice with no canonical value, which is
        exactly why the record sweeps it rather than fixing it.
      falsification_condition: >-
        A memory model under which the crossover is not monotone in
        prime size, indicating the cost model is misspecified.
      validation_plan: >-
        SAMPLE: >= 4 memory-cost models x prime sizes spanning the
        standardized parameter sets. COMPARISON: crossover per model,
        reported as a range. TAIL CHECK: the models giving extreme
        crossovers, reported with their assumptions. TRANSFER: none; the
        range is the answer.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. The record compares published costs and claims no
      exponent of its own.
    memory_exponent: >-
      Negligible; symbolic and numeric sweeps.
    best_known: >-
      The incumbents are Delfs-Galbraith at p^(1/2) with negligible memory
      and the published p^(1/3+o(1)) with matching memory; both are
      costed, neither improved.
    hidden_overhead: >-
      The paper's disclosed superpolynomial o(1) overhead is the term most
      likely to be dropped in a naive instantiation, and dropping it moves
      the crossover in the direction that flatters the new algorithm.
    tradeoff_note: >-
      Memory-cheap and time-expensive versus the reverse; the crossover is
      exactly where the tradeoff reverses and it depends on the hardware
      model.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    frontier row applies. As a cost comparison: the published table is the
    source and is more authoritative on its own numbers; this record adds
    only the crossover computation. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a crossover prime under
    matched memory charging, reported as a range across memory models, where
    the program currently has only an asymptotic comparison and a fixed-size
    table.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the published cost model reproduces. 0.9 that the brackets
    behave. 0.45 that the crossover sits above all deployed sizes under at
    least one defensible memory model, which would materially change how the
    result is described here.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
