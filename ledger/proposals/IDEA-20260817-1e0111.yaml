    statement: >-
      About the OBJECT: "The k-tree reaches n^{1/(t+1)} with no algebraic structure whatever and
      is gated on a single primitive -- an O(1)-cost projection of the group whose value on a sum
      is determined by its values on the summands. IDEA-20260807-df906f's rigidity theorem
