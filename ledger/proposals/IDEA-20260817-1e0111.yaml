  object_first_candidate:
    tracked_object: >-
      The PARTIAL-VERIFICATION DEFECT: pruning obtained per merge level by filtering a partial
      sum through a candidate projection, in bits per block bit. The tracked object is that
      ratio r, not the projection and not the partial sum.
    lossiness: >-
      The underlying projection must be lossy AND compatible with addition, and df906f's theorem
      says that conjunction is unsatisfiable on a prime-order group -- so the object is defined
      on the PROBABILISTIC relaxation from the outset. Explicitly excluded as changes of
      coordinates: the identity; the integer bit decomposition of the discrete logarithm, which
      is addition-compatible but not computable from a point, and which is exactly why ARM 1
      works without contradicting rigidity; and the Kummer x-only quotient, which is lossy and
      propagates but only 2-valued, so its ambiguity compounds as 2^{2^t - 1} over t merge levels
      and is useless for k-tree -- worth recording because it is the obvious candidate and it
      fails for a specific, checkable reason.
    propagation: >-
      One step of the target operation is one k-tree merge level. The tracked ratio propagates
      deterministically in the cost model: with ratio r per level over t levels and block width
      w, the surviving list size is multiplied by 2^{w(1-r)} per level, giving total cost
      n^{1/(t+1)} * 2^{t*w*(1-r)}. Rigidity pins r < 1 strictly; the run measures the realised r
      per level rather than assuming any value, and the interpolation between the endpoints is
      the record's quantitative content.
    survival_score: >-
      The structure survives t merge levels at r = 1 -- now known impossible -- and zero levels
      at r = 0. The deliverable is measured r per panel member per level, and the number of
      levels before the surviving-fraction curve becomes indistinguishable from the no-filter
      control. Predicted: zero levels on ARM 3, all t levels on ARM 1 and ARM 2.
  null_object_control: >-
    (N1) NO-FILTER CONTROL. The identical k-tree with filtering disabled, so every pair survives
    every merge. This is the birthday baseline the algorithm must beat, and any panel member
    whose measured cost matches it has r = 0.
    (N2) ARM 1 FORCED-VALUE POSITIVE CONTROL. Z/n with known logarithms: r must be 1.00 +- 0.02
    at every level and measured cost must fit n^{1/3} at t = 2 within 0.05 in the exponent.
    Failure voids the entire run.
    (N3) ARM 2 CROSS-PROBLEM POSITIVE CONTROL. Random hard-density subset-sum at matched size:
    the structure-free sub-birthday gain must be reproduced. This is claim (A) made executable,
    and its failure would mean the instrument cannot detect a combinatorial speedup where one
    provably exists.
    (N4) RANDOM-PROJECTION NULL. On ARM 3, replace each panel projection by a keyed PRF of the
    point encoding, lossy but provably not addition-compatible. Measured r must be 0.00.
    (N5) STRUCTURAL TELL. Any panel member showing r > 0 must show r DECAYING as block width w
    increases, because a wider block demands more compatibility. An r flat in w is the artifact
    signature of inventor-protocol section 3.
    (N6) RIGIDITY CONSISTENCY. Any ARM 3 member reporting r = 1.00 contradicts df906f's theorem
    and is an implementation error until independently replicated.
  discriminated_from:
    - >-
      Blacklist pair "C1-Non-generic-representation-technique-MITM@0717b2" and its barrier
      "D1-Generic-model-barrier-for-representation-technique-MITM-C1@0717b2": the nearest prior
      art. That pair proposes the technique as an attack and closes it with a generic-model
      barrier. This record does not propose the attack, agrees it does not run, and instead
      names the missing primitive, shows via df906f that its exact form is impossible, prices
      the probabilistic form with a cost curve, and measures it with cross-problem controls.
      Overlap acknowledged and unresolved.
    - >-
      IDEA-20260807-df906f: supplies the rigidity theorem this record now depends on, and
      measures a propagation defect for the division-polynomial family. This record measures
      PRUNING in a k-tree merge, which is the k-tree-specific consequence of that defect, and
      supplies the cost curve converting one into the other. Priority for the theorem is df906f's.
    - >-
      IDEA-20260817-84755b in this batch: the SEARCH for the primitive over a declared panel.
      This record is the COST THEOREM for it and reuses that panel verbatim. Each stands if the
      other is dropped; neither is independent evidence for the other's null, and that shared
      selection bias is recorded in confounders.
    - >-
      IDEA-134 "Preprocessed-three-sum-source-oracle" and IDEA-057 "Algebraic-correction-map-
      birthday-descent": both build birthday-style machinery around the decomposition relation,
      the index-calculus object. No factor base, no relation over a factor base and no Semaev
      polynomial appears here; the lists are plain random group elements with known coefficients.
    - >-
      H-XOR-YIELD and H-YIELD-001 (both weakened): relation yield under x-oracle-guided
      enumeration. Those measure yield of factor-base relations; this measures pruning of partial
      sums in a merge, with no oracle and no factor base.
    - >-
      Standard Pollard rho and vOW: the N1 no-filter control IS the birthday baseline, measured
      explicitly rather than assumed to differ.
  assumptions:
    - n prime, so the relation lattice has rank 2 and determinant n, giving ample solution multiplicity, AND df906f's rigidity theorem applies.
    - Toy sizes where n^{1/3} lists are materialisable in memory, which caps the sweep and is the binding practical constraint.
    - Every panel projection is computable in O(1) field operations; costlier ones cannot help a merge and are excluded rather than approximated.
    - Coefficients (a_i, b_i) are known for every list element, so any k-sum to zero yields a usable relation; this is what distinguishes the design from a plain collision search.
    - The k-tree implementation is shared byte-for-byte across all three arms, so an exponent difference cannot be an implementation difference.
  heuristic_assumptions:
    - id: HEUR-1
      statement: >-
        WAGNER LIST-SIZE LAW. For k = 2^t lists of independent uniform elements of a set of size
        N with an operation-compatible bit decomposition, lists of size N^{1/(t+1)} yield at
        least one surviving k-sum to zero with probability bounded below by a constant, and the
        running time is O(k * N^{1/(t+1)}). FOR ALL t in {1,2,3} and all N in the swept range.
      rigorous_support: >-
        The rigorous half is the birthday/second-moment count: at each merge level the expected
        number of surviving pairs is the product of list sizes divided by 2^w, and the
        parameterisation keeps that constant. The distributional half is that list elements behave
        as independent uniforms, which is the classical assumption the k-tree analysis makes and
        which KN-LIT-6192 refines for k not a power of two.
      validation_plan: >-
        ARM 1 with known logarithms, sweeping t in {1,2,3} and n across at least 6 sizes, fitting
        the measured cost exponent against 1/(t+1) and reporting the residual, plus the empirical
        distribution of surviving list sizes per level against the constant prediction. Sampled
        parameters recorded per cell.
      falsification_condition: >-
        The fitted cost exponent on ARM 1 differs from 1/(t+1) by more than 0.05 for any t, in
        which case the implementation does not realise the algorithm and no arm's result may be
        read as an exponent.
    - id: HEUR-2
      statement: >-
        DEFECT-TO-COST INTERPOLATION. With measured pruning ratio r per level, block width w and
        t levels, total k-tree cost scales as n^{1/(t+1)} * 2^{t*w*(1-r)}, uniformly over
        r in [0,1] and the tested w. r = 1 recovers Wagner and r = 0 recovers the birthday bound.
      rigorous_support: >-
        The endpoints are rigorous: r = 1 is the k-tree analysis and r = 0 is the no-filter
        control, whose cost is the birthday bound by construction. The heuristic content is the
        interpolation between them, assuming the surviving-fraction loss is multiplicative across
        levels and independent. NOTE that df906f's rigidity theorem makes the r = 1 endpoint
        unreachable on <P>, so on ARM 3 the curve is only ever evaluated in its interior -- which
        is precisely why the interpolation must be measured rather than assumed.
      validation_plan: >-
        ARM 1 with the bit decomposition DELIBERATELY CORRUPTED at rates giving r in
        {1.0, 0.8, 0.6, 0.4, 0.2, 0.0}, measuring realised cost at each and fitting against the
        predicted curve. This is a dial the run can actually turn, making the interpolation an
        experiment rather than an assumption.
      falsification_condition: >-
        Measured cost departs from n^{1/(t+1)} * 2^{t*w*(1-r)} by more than a factor 2 at any
        tested r, in which case a partial defect cannot be converted into a cost and only the
        r = 0 and r = 1 endpoints may be reported.
    - id: HEUR-3
      statement: >-
        ECDLP PRIMITIVE ABSENCE IN THE PROBABILISTIC REGIME. For every projection in the declared
        panel of O(1)-cost maps E(F_p) -> {0,1}^w, the measured pruning ratio r is 0.00 +- 0.03
        at every merge level and every block width. FOR ALL panel members, FOR ALL w in the tested
        range, FOR ALL tested primes.
      rigorous_support: >-
        PARTIAL, and this is an upgrade on the earlier draft. df906f's rigidity theorem rigorously
        excludes r = 1 for every lossy projection on a prime-order group, so the assumption is no
        longer that r is small for no stated reason -- it is that r sits at the FAR end of an
        interval whose upper endpoint is provably excluded. The heuristic content is the gap
        between "r < 1" and "r = 0", and the supporting intuition is that x(X+Y) is a degree-2
        rational function of x(X), x(Y) and the difference, so no fixed-width window of the
        integer representative should carry partial compatibility either. That intuition is an
        argument, not a proof, and it is what the measurement attacks.
      validation_plan: >-
        ARM 3 over the full panel, with the N4 random-projection null and the N5 width sweep in
        the same invocation, at 6 primes. The panel is IDEA-20260817-84755b's, reused verbatim.
      falsification_condition: >-
        Any panel member shows r >= 0.15 at any level, reproducibly at two primes, beating the N4
        null and surviving the N5 width tell. THIS REFUTES HEUR-3 AND THE RECORD'S OWN
        EXPECTATION, and by HEUR-2 converts directly into a measured cost below the birthday
        bound. It would NOT contradict df906f, which excludes only r = 1.
  proof_search_map:
    bottleneck: >-
      The partial verifier. Every merge level is a hash join on w bits of the projected partial
      sum; with no compatible projection there is nothing to join on and the algorithm degenerates
      to enumeration. df906f closes the exact case; the bottleneck is now precisely how much
      partial compatibility is achievable, i.e. r.
    baseline_embedding:
      parameter_slice: >-
        t = 1, i.e. k = 2 lists of size n^{1/2}, reproduces plain meet-in-the-middle / BSGS
        exactly: no intermediate merge level, no filtering, cost n^{1/2} time and memory. That is
        the exact old-method boundary, and the family extends inward by adding merge levels.
      reproduction_check: >-
        Symbolic: 1/(t+1) at t = 1 is 1/2, the BSGS exponent. Frozen fixture: the t = 1 arm must
        reproduce the matched BSGS control's operation count within 5 percent on the same
        instances, and the run is void otherwise.
    observation_collision:
      observable: The measured pruning ratio r per merge level.
      distinct_preimage_search: >-
        Two distinct objects with the same observable and opposite conclusions, both supplied:
        (i) a projection compatible on a MEASURE-ZERO subset of pairs could show small positive r
        from that subset alone while being useless overall, and (ii) an estimator artifact from
        correlated list elements could show the same small positive r. N4 separates (ii); (i) is
        separated by requiring r to be stable as w grows, which a measure-zero coincidence cannot
        sustain. Reporting r without the width sweep would be an identifiability failure.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from 2-list meet-in-the-middle (BSGS, exponent 1/2) to
          2^t-list k-tree (exponent 1/(t+1)), with the strictness obligation being that r > 0 is
          achieved, not merely that the algorithm terminates.
        predicted_gain: >-
          Exponent 1/2 -> 1/(t+1) in BOTH time and memory at r = 1, which rigidity excludes; at
          measured r the gain is n^{1/(t+1)} * 2^{t*w*(1-r)} and is predicted to be ZERO.
      - transform: representation_reduction
        proposed_object: >-
          The ECDLP as a k-sum instance in Z/n with group elements as opaque labels and the
          projection as the only window into them, making the hypothesis an exact compatibility
          condition rather than a vague structural one.
        predicted_gain: >-
          Diagnostic: it converts "needs richer algebraic structure" into a single checkable
          condition, which df906f then settles in the exact case. That composition is the
          record's main conceptual output.
    quantifier_order: >-
      The cost theorem: THERE EXISTS pi with the stated compatibility and width, THEN FOR ALL
      instances the cost is n^{1/(t+1)+o(1)} -- and the existential is now known FALSE on <P> by
      df906f, which is why the record's live content is the probabilistic relaxation. The
      characterization under attack has the opposite shape: FOR ALL sub-rho mechanisms M, THERE
      EXISTS a structural ingredient S required by M and absent here. This record exhibits an M
      whose required S is a partial verifier and NOT algebraic richness, refuting the universality
      of the inference even though the mechanism does not run.
    method_ceiling:
      strongest_certifiable_claim: >-
        A scoped measurement: over the declared panel, tested block widths and swept primes, the
        pruning ratio is 0.00 +- 0.03, while the two positive-control arms achieve 1.00 and
        reproduce their known exponents. It can NEVER certify that no O(1)-cost projection with
        partial compatibility exists, because the panel is finite.
      nearby_object_control: >-
        The nearby objects where the desired conclusion FAILS are ARM 1 (Z/n with known
        logarithms) and ARM 2 (subset-sum): same algorithm, same implementation, primitive
        present, sub-birthday cost achieved. A method that cannot separate ARM 3 from ARM 1 has
        not identified the primitive as load-bearing.
    proof_obligations:
      - claim: The k-tree with lists of size N^{1/(t+1)} finds a k-sum in O(k*N^{1/(t+1)}) time and memory when the decomposition is operation-compatible.
        responsibility: runtime
      - claim: A k-sum to zero over lists of aP + bQ with known coefficients yields k = -sum(a)/sum(b) mod n, with a reverifiable certificate.
        responsibility: correctness
