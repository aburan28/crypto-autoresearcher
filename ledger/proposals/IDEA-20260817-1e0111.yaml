  confounders:
    - List elements built from random (a,b) are not independent uniforms once coefficients are reused; the design draws fresh coefficients per list and reports the reuse rate.
    - Memory pressure at n^{1/3} lists can make wall-clock costs reflect cache behaviour rather than operation counts; every cost is reported in group operations AND wall clock, and only the former is used for exponent fits.
    - A small positive r could arise from correlated list construction rather than a projection property; N4 addresses this and the width tell addresses the measure-zero-coincidence variant.
    - ARM 2's subset-sum instances must be hard-density; an easy density regime would reproduce a gain for the wrong reason and must be reported with its density.
    - The panel is inherited from IDEA-20260817-84755b, so the two records share that panel's selection bias, and a null here is NOT independent evidence from a null there.
    - Toy sizes compress the usable merge levels; at n = 2^36 and t = 3 the block width is only 9 bits, near the resolution limit of the pruning measurement.
    - KN-LIT-6192's corpus record is a heuristically parsed bulk-seeding entry; its tradeoff curve is used as a prediction to re-derive, and a mis-parsed exponent would show up as a spurious disagreement in the memory sweep.
  interpretation_limits:
    - TOY TIER. Every number is scoped to n up to roughly 2^36, the declared panel, the tested block widths and t in {1,2,3}. Nothing transfers to 256-bit curves.
    - A null over the panel does NOT establish that no partially-compatible projection exists. What IS established, by df906f rather than by this record, is that no EXACTLY compatible lossy one exists.
    - The cost theorem in claim (B) is arithmetic assembled from a `kb`-provenance corpus record whose own entry disclaims verification; it is a derivation artifact under docs/claims-and-verification.md and is never to be reported as proved. ARM 1 re-derives it rather than citing it as authority.
    - Claim (A) refutes the UNIVERSALITY of an inference in KN-FIND-5c1a03. It does not refute the finding, does not touch its three analyses, and does not assert that any sub-rho ECDLP mechanism exists.
    - The route, even in its best case, has memory equal to time, so it is not a strict improvement over BSGS on the memory axis and must never be presented as one.
    - Priority for the rigidity theorem belongs to IDEA-20260807-df906f; an earlier draft of this record presented claim (B) as a live conditional without it and has been corrected.
  target_complexity:
    time_exponent: >-
      n^{1/(t+1)+o(1)} at r = 1 -- 0.333 at t = 2, 0.250 at t = 3 -- but that endpoint is
      PROVABLY UNREACHABLE on a prime-order subgroup by df906f's rigidity theorem. At measured
      pruning ratio r the cost is n^{1/(t+1)} * 2^{t*w*(1-r)}, and at the predicted r = 0 this is
      exactly the birthday bound n^{1/2}, which the N1 no-filter control measures directly. NO
      IMPROVEMENT IS CLAIMED.
    memory_exponent: >-
      n^{1/(t+1)+o(1)}, EQUAL TO TIME at the unreachable endpoint. This is the route's honest
      weakness, stated rather than buried: at t = 2 the memory exponent would be 0.333, better
      than BSGS's 0.5 but far worse than rho's 0. Both comparisons are made explicitly because
      "faster than rho" alone would hide the memory.
    best_known: >-
      Pollard rho, n^{1/2+o(1)} time at O(1) memory; BSGS, n^{1/2} time at n^{1/2} memory;
      Shoup's Omega(sqrt n) generic lower bound, which the route does not contradict because
      evaluating pi on a point's coordinates is a NON-GENERIC step unavailable from the group
      encoding. That is why the route is not dead a priori on generic-model grounds, and df906f
      is why it is dead on structural grounds in its exact form.
    hidden_overhead: >-
      The o(1) hides: k-tree sorting and hashing constants, large at t = 3; the cost of evaluating
      pi once per list element per level, which must be O(1) field operations or the exponent is
      eaten; the failure probability per run, requiring restarts whose expected count is constant
      only under HEUR-1; and the memory-access cost of n^{1/(t+1)} random lookups, which on real
      hardware is not a constant factor and dominates at toy sizes. All are reported separately.
    tradeoff_note: >-
      The route sits at time = memory = n^{1/(t+1)}, a frontier point no incumbent occupies: rho
      is (0.5, 0) and BSGS is (0.5, 0.5). KN-LIT-6192 supplies the interpolation for memory below
      time, T^2 * M^{lg k - 1} = k * N -- note that setting M = T recovers T = (kN)^{1/(t+1)},
      consistent with the headline exponent, which is a useful internal check on the parsed
      formula. The comparison row on the incumbent side is van Oorschot-Wiener, which gives wall
      clock n^{1/2}/m at memory w with TOTAL WORK UNCHANGED, whereas the k-tree route would lower
      total work. Parallelisation: every merge level is a distributed sort and parallelises
      near-linearly, giving n^{1/(t+1)}/m wall clock, conditional as above.
  dominated_by: >-
    Pollard rho on the memory axis unconditionally, and everything on the time axis given that
    the r = 1 endpoint is provably unreachable. Frontier rows checked one by one for prime-field
    ECDLP, n prime, single instance, classical: (1) Pollard rho, n^{1/2+o(1)} time / O(1) memory
    -- DOMINATES on MEMORY in every branch and on time in the expected branch; (2) BSGS, n^{1/2}
    / n^{1/2} -- would be dominated on both axes at r = 1, dominates in the expected branch;
    (3) vOW parallel rho, wall clock n^{1/2}/m at memory w, total work n^{1/2} -- would be beaten
    on total work at r = 1, dominates in the expected branch; (4) kangaroo / Gaudry-Schost /
    Galbraith-Ruprai -- not applicable, no interval; (5) Pohlig-Hellman -- not applicable, n
    prime; (6) MOV / Frey-Ruck -- not applicable, large embedding degree; (7) SSSA anomalous --
    not applicable, n != p; (8) GHS / Weil descent / Gaudry -- not applicable over a prime field
    per KN-LIT-002; (9) Semaev over F_p -- no proven advantage, not a dominating row;
    (10) preprocessing S*T^2 = N -- not applicable, no advice and no offline phase;
    (11) Kuhn-Struik sqrt(nL) -- not applicable, single instance; (12) Shor -- out of scope.
    VERDICT after the row-by-row check: NOT null. The measurement claims no result; the ROUTE is
    dominated by row (1) on memory in every branch and by rows (1),(2),(3) on time in the
    expected branch, which df906f's theorem now makes the only branch available in the exact case.
