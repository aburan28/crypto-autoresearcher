  minimal_test:
    design: >-
      Six sizes with n prime, chosen so n^{1/3} lists fit comfortably in memory (roughly n up to
      2^36, giving lists of 2^12). ONE k-tree implementation shared byte-for-byte across three
      arms. ARM 1: Z/n with known logarithms and the integer bit decomposition, t in {1,2,3},
      fitting the cost exponent against 1/(t+1) and measuring r per level; then the corruption
      dial sweeping r in {1.0,0.8,0.6,0.4,0.2,0.0} to trace the HEUR-2 interpolation curve; then
      a memory sweep with M below T to test the KN-LIT-6192 tradeoff curve. ARM 2: random
      hard-density subset-sum at matched size, same implementation. ARM 3: toy prime-field ECDLP,
      each member of the IDEA-20260817-84755b panel in turn as the bit decomposition, block widths
      w in {4, 8, 12, 16}, with the N1 no-filter control and the N4 random-projection null in the
      same invocation. Every k-sum on any arm carries a certificate -- explicit coefficient
      vectors and the group identity -- recomputed independently by the run wrapper, and on ARM 3
      any recovered k is checked against ground truth. MANDATORY MATCHED CONTROLS: Pollard rho and
      BSGS on every ARM 3 instance, same instrumentation, costs in group operations and memory in
      bytes, so a route whose memory equals its time is priced against the one incumbent that also
      buys time with memory. Cost: the lists are the binding constraint; at 2^12 to 2^16 elements
      per list this is hours, not days, and no cryptographic size is attempted.
    controls:
      - 'MANDATORY MATCHED CONTROL: Pollard rho on every ARM 3 instance, group operations and O(1) memory reported.'
      - 'MANDATORY MATCHED CONTROL: BSGS on every ARM 3 instance, with sqrt(n) memory reported in bytes.'
      - 'N1 no-filter control: the birthday baseline the k-tree must beat.'
      - 'N2 ARM 1 forced-value positive control at r = 1.00 and exponent 0.333.'
      - 'N3 ARM 2 cross-problem positive control on hard-density subset-sum.'
      - 'N4 random-projection null on ARM 3, forced to r = 0.00.'
      - 'N5 width tell: any positive r must decay as w grows.'
      - 'N6 rigidity consistency: no ARM 3 member may report r = 1.00.'
      - 't = 1 slice reproducing BSGS within 5 percent.'
      - 'Corruption dial on ARM 1 tracing the defect-to-cost interpolation.'
      - 'Memory sweep on ARM 1 against the KN-LIT-6192 tradeoff curve.'
      - 'Independent recomputation of every k-sum certificate by the run wrapper.'
