idea:
  id: IDEA-20260817-1e0111
  question_id: RQ-ECDLP-002
  added: '2026-08-17'
  title: >-
    Wagner's k-tree needs no algebraic structure at all, so KN-FIND-5c1a03's "all sub-rho
    mechanisms require richer structure" has a standing counterexample class -- and since
    IDEA-20260807-df906f's rigidity theorem makes the EXACT form of the required primitive
    provably impossible on a prime-order subgroup, the whole lane reduces to one measurable
    number: the pruning ratio r, and the cost curve n^{1/(t+1)} * 2^{t*w*(1-r)} it feeds
  class: mechanism
  claim: >-
    (A) THE COUNTEREXAMPLE TO UNIVERSALITY, WHICH IS THE RECORD'S MAIN CONTRIBUTION AND IS
    UNAFFECTED BY EVERYTHING BELOW. KN-FIND-5c1a03 characterizes prime-field ECDLP hardness as
    MINIMAL ALGEBRAIC STRUCTURE, on the ground that all sub-rho mechanisms require richer
    structure. That inference has a standing counterexample class the finding does not address:
    Wagner's generalized birthday / k-tree algorithm and the Howgrave-Graham-Joux representation
    technique are SUB-BIRTHDAY and require NO algebraic structure whatsoever. Subset-sum has no
    group, no endomorphism ring, no factor base and no Frobenius, and its meet-in-the-middle
    exponent still moved from 2^{n/2} to roughly 2^{0.337n} and below. So "minimal algebraic
    structure implies rho is optimal" is NOT a valid general principle, and the characterization
    must be re-scoped to say what specifically about ECDLP blocks the purely combinatorial
    speedups.

    (B) THE COST THEOREM, AND ITS ANTECEDENT IS NOW KNOWN TO BE UNSATISFIABLE. Let G = <P> of
    prime order n. Suppose there were a map pi: G -> {0,1}^L computable in O(1) field
    operations with pi(X+Y) DETERMINED by pi(X) and pi(Y), and L >= log2(n)/(t+1). Then k = 2^t
    lists of elements a_i*P + b_i*Q of size n^{1/(t+1)} plus Wagner's k-tree yield a relation
    sum(a_i)*P + sum(b_i)*Q = O and hence k = -sum(a_i)/sum(b_i) mod n, in time and memory
    n^{1/(t+1)+o(1)}. BUT IDEA-20260807-df906f PROVES THAT NO SUCH pi EXISTS: on a group of
    prime order, any v admitting ANY F with v(R+R') = F(v(R), v(R')) is injective or constant,
    so a lossy exactly-propagating projection is impossible. The antecedent of (B) is therefore
    provably unsatisfiable on <P>, and an earlier draft of this record stated (B) as a live
    conditional without noticing that. RETRACTED AND RESTATED HERE.

    (C) WHAT SURVIVES, AND IT IS SHARPER THAN WHAT WAS RETRACTED. Rigidity kills r = 1; it says
    NOTHING about how far below 1 the pruning ratio sits. Define r as the bits of pruning
    actually obtained per merge level, divided by the block width w. Then the k-tree cost is
    n^{1/(t+1)} * 2^{t*w*(1-r)}, which at r = 1 is Wagner's bound and at r = 0 is the birthday
    bound. Rigidity now makes "r < 1" a THEOREM rather than an expectation, and the entire lane
    collapses to a single measurable quantity: how close to 1 can r get, and does the
    interpolation stay below n^{1/2} anywhere. That is a strictly better-posed question than the
    one the earlier draft asked, and it is what the minimal test measures.

    (D) THEREFORE THE MISSING INGREDIENT IS NAMED, AND IT IS NOT WHAT THE FINDING SAYS. The
    primitive Wagner needs is a PARTIAL VERIFIER -- a way to test a partial sum cheaply and
    prune before completing it. In Z/n written additively with known logarithms the primitive is
    trivially present, which is why k-tree works there. On an elliptic curve the group element
    is a point, and the low bits of x(X+Y) are NOT determined by the low bits of x(X) and x(Y).
    That absence, not the dimension of End(E), is what blocks the combinatorial family. It is a
    different requirement from algebraic richness, it is now known to be unsatisfiable exactly
    and open probabilistically, and it is measurable.

    (E) THE SECOND, INDEPENDENT PRIMITIVE, AND ECDLP HAS IT. Wagner's gain also needs SOLUTION
    MULTIPLICITY, so that zeroing bits early does not destroy every solution. The relation
    lattice {(a,b) : aP + bQ = O} has rank 2 and determinant n and supplies ample multiplicity,
    so ECDLP is NOT blocked on this axis. Saying so precisely matters: it isolates partial
    verifiability as the single point of failure rather than leaving two candidates entangled.

    (F) NOT CLAIMED. No attack. No claim that any projection achieves r > 0. No claim of
    priority over df906f for the rigidity theorem, which is what makes (C) sharp. No claim about
    what the Wagner or HGJ literature says beyond the corpus record cited below.
  mechanism: >-
    WHY THE k-TREE ARITHMETIC GIVES 1/(t+1). Wagner's algorithm on k = 2^t lists in a set of
    size N, with a decomposition compatible with the combining operation, finds a k-sum to zero
    in time and memory O(k * N^{1/(t+1)}) when each list has size N^{1/(t+1)}: at each of the t
    merge levels the algorithm keeps only pairs whose next log2(N)/(t+1) bits cancel, so list
    sizes stay constant while the number of constrained bits grows. Every step is a sort or a
    hash join; nothing algebraic occurs. At N = n and t = 2 that is n^{1/3} time and memory.

    WHY IT DOES NOT BREAK ECDLP, IN ONE SENTENCE AND NOW WITH A THEOREM BEHIND IT: the algorithm
    requires "the next block of bits of a sum" to be computable from the corresponding bits of
    the summands, which is exactly the exact-propagation condition, and df906f's rigidity
    theorem forbids that for any lossy projection of a prime-order group. So the interesting
    regime is r < 1 by necessity, and the measurement is of how much pruning survives.

    THE CROSS-PROBLEM POSITIVE CONTROL, which is the design's distinguishing feature. One k-tree
    implementation, shared byte-for-byte, on three targets in the same invocation.
    ARM 1, Z/n with KNOWN logarithms: the primitive is present by construction (integer bit
    decomposition, and note this does NOT contradict rigidity, because the integer bit
    decomposition of the discrete log is not a map computable from the point). Measured cost MUST
    track n^{1/3} at t = 2 and r MUST be 1.00. Forced value; failure voids the run.
    ARM 2, a random hard-density subset-sum instance of matched size: the primitive is present,
    the known sub-birthday behaviour must be reproduced, and this makes claim (A)'s counterexample
    executable rather than asserted.
    ARM 3, the actual ECDLP on a toy prime-field curve, using each projection from the
    IDEA-20260817-84755b panel in turn as the bit decomposition. Predicted r = 0.
    A run in which ARM 1 or ARM 2 fails its known exponent is VOID, and that is what makes ARM 3's
    null interpretable rather than a report of a failed implementation.

    THE MEASURED QUANTITY. The PARTIAL-VERIFICATION DEFECT: pruning obtained per merge level,
    -log2 of the surviving fraction, divided by the block width w. For an addition-compatible
    decomposition this is 1.00. For an incompatible one it is 0.00, because filtering on pi of
    the summands says nothing about pi of the sum and the merge level prunes nothing. The run
    measures this per panel member per level. That ratio, with error bars and a stated scope, is
    the obstruction datum, and the ARM 1 corruption dial converts it into a cost via the
    interpolation curve.
