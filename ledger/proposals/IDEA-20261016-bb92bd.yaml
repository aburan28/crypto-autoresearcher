  assumptions: ["Corrected XOR product pinned; same seeds, order, routine across arms.", "Coset disjointness checked, not assumed; non-disjoint classes labelled."]
  proof_search_map:
    bottleneck: "which part of the matched-pair signal depends on v at all"
    baseline_embedding: {parameter_slice: "v_i in V: all pi_D(e) identical", reproduction_check: "pi_D(D) identical over 1000 random (v,B); Nagao Example 1 fixture"}
    observation_collision: "pairs with equal total rank and different histograms show total rank is too coarse"
    quantifier_order: "FORALL classes at (7,2,3): top entry invariant; EXISTS a class with Excess_4 != Excess_4(0) is the claim"
    method_ceiling: {strongest_certifiable_claim: "exact census at (7,2,3)", nearby_object_control: "random cubic system of the same support"}
  predictions:
