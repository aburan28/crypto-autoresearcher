    - {metric: "fraction of classes with Excess_4 != Excess_4(0), satisfiable stratum", direction: higher, minimum_effect: ">= 10% (vs <= 1% under constancy), exact binomial CI"}
    - {metric: "Excess_4(v) vs Hamming weight of v mod V", direction: different, minimum_effect: "|Spearman rho| >= 0.3 means v structure is a lever"}
  minimal_test:
    design: "Per cell build EQS2 and EQS4(v), degree-graded Boolean-ring Macaulay elimination at D=3,4,5, record (pi_D(e))_e, rank and the Def5/Def6/HPS labels computed. Census as above, sat/unsat strata; B-sweep over 4 values of B for 200 fixed v."
    controls: ["v in V exact null", "v=0 baseline", "random cubic null of identical support and wiring", "m=2 contrast (no free slot)"]
    required_metrics: ["histogram per system", "census fractions with exact CIs", "sat/unsat label", "definition label"]
  falsification_conditions: ["pi_D(D) differs across any (v,B): the top-form lemma or the instrument is wrong; cells void.", "Excess_4 constant over the exhaustive (7,2,3) census, satisfiable stratum: v is not a lever for the rank profile and the shift question reduces to solving degree (IDEA-20261016-d0335b).", "v in V null differs: defect."]
  confounders: ["satisfiability differs between v=0 and v != 0 at the same R when yield ~ 1: stratify", "small-n degeneracy: random null calibrates", "definition variant", "pivot order depends on monomial order; fix and record it"]
  interpretation_limits: ["Toy tier, p=2, one curve family.", "Constant Excess does not corroborate Theorem 1; varying Excess does not refute it.", "No claim about any curve."]
