  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-09-06'

  title: >-
    THE BATCH-RESELECTED FIXED-SIZE TABLE: keep exactly T stored entries, but
    let the batch's own SOLVED walks be Bernstein-Lange's "larger pool" --
    every solved target's terminal DP joins the candidate pool with its
    known log and walk length, every online hit on a table entry adds that
    walk's length and one count to the entry's published weight
    S_d + 4W h_d, and between rounds the table is re-selected as the top-T
    of the pool -- so the estimation loss of a cheap precomputation
    (N/T = 2) is paid off by the batch instead of by precomputation, and the
    T needed at fixed (L, epsilon) is predicted to fall toward the aed829
    oracle ratio T_oracle/T_static = 0.51 (a = 1/4) once U is of order
    8 T, with an early-batch penalty that is the binding number for short
    batches
  class: composition

  class_reason: >-
    Composition rather than algorithm: no new statistic and no new walk. The
    selection rule is Bernstein-Lange's published weight; the reuse of
    solved walks is Kuhn-Struik's; the only new element is the SOURCE of the
    candidate pool (the batch) and the accounting that keeps the advice size
    fixed at T while the pool is charged as working storage.

  claim: >-
    (A) THE MECHANISM, IN BERNSTEIN-LANGE'S OWN FRAME. The paper (primary
    text, read 2026-09-06) proposes "generating more distinguished points,
    say 2T or 10T or 1000T, and then keeping the T most useful", ranks by
    weight = total length of walks reaching the point + 4W per walk, notes
    the estimate "is unreliable for a distinguished point found by very few
    walks" and that "this issue disappears as the number of random walks
    increases towards larger multiples of T", and reports (Table 4.1) that
    going from N/T = 2 to N/T = 8 lowers the scaled online cost from 1.62 to
    1.38 (a = 1/2) at 8x the precomputation. The mechanism here obtains the
    same larger pool WITHOUT the precomputation: in a batch of U targets,
    each target runs up to k online walks of length about W; every walk of a
    target that is SOLVED (by any of its walks) ends at a DP whose log is
    then known (a + b k_u with k_u known), so it is a legitimate table
    candidate with the same information a precomputation walk carries
    (DP, length, one count); every online hit on a current table entry adds
    that walk's length and one count to the entry's weight (free ancestry
    evidence); between rounds of R targets the table is re-selected as the
    top-T of the pool by the published weight. Nothing with an unknown log
    ever enters the table; no relation graph is needed; the advice size is
    exactly T at every moment.
    (B) WHY IT SHOULD CONVERGE TO THE ORACLE. Under the basin model
    (IDEA-20260906-aed829, H1-H2), a solved target's walks are uniform-start
    samples, so a basin of size n receives evidence at rate proportional to
    n per batch walk, exactly as in precomputation; after U k walks the pool
    is a Bernstein-Lange pool with effective N/T = r_0 + U k / T (up to the
    LOWER-bracket loss that unsolved targets' walks are withheld), and by
    the paper's own observation the count-plus-length estimate becomes
    reliable as N/T grows. The table therefore converges toward the top-T
    basins, whose coverage is the oracle ceiling C_max(a) of aed829 (B2):
    0.39 at a = 1/4. The single-walk hit rate cannot exceed C_max at fixed
    (T, W) -- the pool does not change the basins, only the estimate of them.
    (C) THE HEADLINE QUANTITY, PRICED FROM THE MODEL. At fixed W (a = 1/4)
    and fixed per-target budget L = k W: static table at N/T = 2 has model-
    consistent single-walk hit rate about 0.27 (scratch, below) against the
    oracle 0.39; the T needed at fixed coverage is proportional to the
    inverse of coverage-per-entry, so the model ratio is
    T_oracle/T_static = 1.64/3.20 = 0.51 at a = 1/4 (aed829 (B3): oracle
    T = 1.64 N/L^2 against the published 1.79^2 = 3.20 N/L^2). PREDICTION:
    T_resel(U)/T_static at fixed (L, epsilon) falls from 1 at U = 0 toward
    about 0.5, reaching 0.6 by U of order 4 T and 0.5 by U of order 8 T
    (scratch: a 512-entry re-selected table matches the 1024-entry static
    table's success from round 4-5, i.e. about 8000-10000 targets = 8-10 T,
    at ops per target within 0.03 N^{1/3}). The EARLY-BATCH PENALTY: the
    re-selected T/2 table starts as a static T/2 table (round-0 success
    0.57-0.59 against 0.70-0.72 static in the scratch), so for a batch
    shorter than the break-even U* the total solved count is LOWER than
    static; U* is predicted at 2-4 T for T/2 and must be reported as the
    binding number for non-repeatable batches. STRUCTURAL TELL: the single-
    walk hit rate must saturate at C_max(a) (0.39 at a = 1/4 for the full-T
    table; 0.27 for the T/2 table at a = 1/8) and the gain over static must
    SHRINK as the precomputation ratio r_0 grows, vanishing at r_0 = 8 where
    Table 4.1 shows the static rule already at the model ceiling.
    (D) FRONTIER PLACEMENT. Corrigan-Gibbs-Kogan Theorem 11 (plain text read
    2026-09-06): a generic preprocessing algorithm for M-instance multi-DL
    with O~(S) advice and total online time O~(T) satisfies
    S T^2/M + T^2 = O(MN), matching their Theorem 8 lower bound; Appendix F
    realises it with preprocessing walks of length T/(2M) and online walks
    from random products of the targets that collect linear relations. Per
    instance (t = T/M) this reads t^2 (S + M) = O(N): the batch counts as M
    extra advice entries. THE FIXED-SIZE RESELECTED TABLE FORGOES THAT +M
    TERM by construction (it never stores an unsolved walk or a relation),
    so its ceiling is t = W/C_max(S W^2/N), strictly ABOVE the CGK line for
    M of order S or larger, and its value is confined to the regime the
    user named: fixed advice size T, distributable, with the batch paying
    only the ESTIMATION loss. It is GENERIC and CONSTANT-FACTOR: at most
    the factor 1.4 in L (1.79 -> 1.28) or 0.51 in T at a = 1/4, N/T = 2, and
    nothing at N/T = 8.

  mechanism: >-
    STEP 1. Precompute a pool of r_0 T candidates (r_0 = 2, the paper's
    headline ratio) with the published weight; select the top T_sel entries
    (T_sel in {T, 3T/4, T/2, T/4}); P charged as generation walk length,
    cap 8W.
    STEP 2. Process U targets in rounds of R (R = 2000 in the scratch; also
    R in {250, 500, 8000} to price the round length). Each target: up to k
    walks from Q_u + [c]P, stop at the first hit; a hit adds (length, +1) to
    the hit entry's weight; certificate [k_u]P == Q_u checked.
    STEP 3 (LOWER bracket, the honest arm). After the round, for every SOLVED
    target, every one of its walks' terminal DPs enters the pool with its
    now-known log, its length and one count. UPPER bracket (diagnostic
    only): every walk enters as if solvable; this is not an algorithm and
    is reported only to bound the LOWER-bracket loss.
    STEP 4. Re-select: sort the pool by S_d + 4W h_d, keep the top T_sel as
    the table. Cost: one sort of the pool per round, O(|pool| log |pool|)
    integer operations, charged and reported beside the R k W group
    operations of the round.
    STEP 5. Memory arms: UNCAPPED pool (grows with U, reported as S_peak);
    CAPPED pool keeping only the top 4T candidates after each re-selection
    (and a 2T arm), so that S_peak is bounded and the loss from capping is
    measured.
    STEP 6. Nulls and decay (below); static table as control at the same
    T_sel; the full-T static table as the reference for T_resel/T_static.
    STEP 7. Sweep r_0 in {1, 2, 4, 8} to test the shrinkage of the gain with
    precomputation; sweep a in {1/8, 1/4, 1/2}.
    STEP 8. Curve arm with certificates.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Corpus and web search as in IDEA-20260906-aed829, plus a WebSearch for
      adaptive / self-improving / online-updated / incrementally updated
      precomputation tables for DLP and for rainbow-table refresh or
      maintenance (queries recorded in the report); primary texts of
      Bernstein-Lange (coordinator's plain-text copy, re-checked by grep) and
      Corrigan-Gibbs-Kogan Theorem 11 / Appendix F (coordinator's plain-text
      copy, read by this session at lines 1420-1427 and 2549-2604).
    results: >-
      Bernstein-Lange: the pool-and-select mechanism and the weight are
      theirs; the pool is fed by precomputation only, and they explicitly
      distinguish precomputation working storage from the output table
      ("we follow standard practice in distinguishing between the space
      consumed during the precomputation and the space required for the
      output of the precomputation"). Kuhn-Struik / Hitchcock et al. /
      Fouque-Joux-Mavromati reuse online walks but STORE them (the table
      grows) and need relation bookkeeping. Corrigan-Gibbs-Kogan Theorem 11
      also stores relations and reaches the +M term. A search-result snippet
      for the Lee-Cheon-Hong journal version describes the standard model as
      "a clearly separate pre-computation phase ... and an online phase in
      which a non-determined number of independent DLPs are solved without
      further contributing to the table", which is the assumption this
      record drops. No source found re-selects a fixed-size DLP table from
      online walks; the rainbow-table literature returned only
      precomputation-speed and checkpoint work. No corpus record proposes
      it. The coordinator's scratch (internal, unverified, two seeds, no
      null) is the origin of the mechanism.
    verdict: >-
      ADAPTATION: Bernstein-Lange's own pool-and-select with the pool
      supplied by solved batch walks instead of precomputation; every cited
      source was retrieved or is a corpus record, and no recalled reference
      is load-bearing. The specific claim that the advice size can stay at
      T while the batch pays the estimation loss was not found anywhere.

  discriminated_from:
    - >-
      Bernstein-Lange (primary text, retrieved): the parent. Their pool is
      precomputed at cost (N/T) T W; here the pool is the batch's solved
      walks at zero extra cost, and the table is re-selected repeatedly
      rather than once.
    - >-
      IDEA-20260906-a3d6ae (this batch): GROWS the stored set with solved
      and unsolved DPs and needs relation-graph accounting; it can exploit
      the CGK +M term and is predicted to dominate this record on L at equal
      S_peak. This record keeps the advice at exactly T, never stores an
      unknown log, and targets the user's quantity (stored DPs) directly.
    - >-
      Kuhn-Struik / Hitchcock et al. / Fouque-Joux-Mavromati (retrieved):
      store everything; no selection; the table grows to the batch size.
    - >-
      Corrigan-Gibbs-Kogan Theorem 11 (retrieved): the generic multi-instance
      frontier S T^2/M + T^2 = O(MN); this record sits above it by design
      and is placed against it in claim (D).
    - >-
      IDEA-20260906-05ffb8 (this batch): changes the selection STATISTIC at
      fixed pool; this record changes the pool SOURCE at the published
      statistic. The two compose (a re-selected table can use R3) and are
      kept separate so each is falsified on its own.
    - >-
      IDEA-20260906-aed829: supplies C_max(a) as the ceiling the re-selected
      table must saturate at, and the static-versus-oracle ratio 0.51.

  object_first_candidate:
    tracked_object: >-
      THE CANDIDATE POOL {(d, log, S_d, h_d)} restricted to known-log DPs,
      and its top-T projection, followed round by round.
    lossiness: >-
      GENUINELY LOSSY: forgets every walk's intermediate points, start point
      and target identity; retains per-DP evidence (length sum, count) and
      the log.
    propagation: >-
      LOSSY-PROJECTION TEST, PASSED. A solved target's walk updates one
      pool entry's (S_d, h_d) or creates it with a known log; a hit updates a
      table entry's (S_d, h_d); re-selection is a deterministic function of
      the pool. Not a change of coordinates: walks are not recoverable.
    survival_score: >-
      Survives arbitrary batch length; its usefulness saturates when the
      table reaches the top-T basins (C_max). Dies if targets are not
      uniform (the pool then estimates a target-weighted basin size -- a
      different object, see confounders) and if the walk is not a function
      of the point.

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL 1 (shuffled pool): before each re-selection,
    permute the (S_d, h_d) evidence among pool entries; the re-selected
    table's success must equal the STATIC table's within CI at every round.
    NULL 2 (relabelled evidence): replace every online walk's length by an
    independent draw and its hit by a uniformly random table entry; same
    requirement. NULL 3 (no-reselect): pool updated but the table frozen;
    must equal STATIC (audits that the pool bookkeeping itself does not
    leak). DECAY PARAMETER phi: admit only a fraction phi of solved targets'
    walks to the pool, phi in {0, 0.25, 0.5, 0.75, 1}; the gain over STATIC
    must increase monotonically in phi and be zero at phi = 0. STRUCTURAL
    TELLS: (i) the single-walk hit rate must saturate at C_max(a) and never
    exceed it -- an exceedance means the basin ceiling is wrong and is
    routed to review, not promoted; (ii) the gain must shrink as r_0 grows
    and vanish at r_0 = 8; (iii) the UPPER bracket must lie within 0.02 of
    LOWER after a few rounds (scratch: within 0.01 from round 4), otherwise
    withheld unsolved walks matter more than the model says.

  assumptions:
    - >-
      Basin model of IDEA-20260906-aed829 (H1-H2), unverified; the ratio
      0.51 is a model number.
    - >-
      Bernstein-Lange's weight, parameters and Table 4.1 as in
      IDEA-20260906-05ffb8's citation (coordinator's plain-text copy).
    - >-
      Corrigan-Gibbs-Kogan Theorem 11 statement and Appendix F sketch as
      read in the coordinator's plain-text copy; the per-instance rewriting
      t^2 (S + M) = O(N) is this record's arithmetic.
    - >-
      The coordinator's scratch (bl_reselect.py, bl_reselect2.py and logs)
      is internal and unverified: two seeds, no null, no decay, no
      certificate, N = 2^30 only; cited as the origin of the numbers in
      claim (C), never as evidence.
    - >-
      Targets are independent and uniform; the batch is non-adaptive; no
      target is a live key.

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      Empirical composition record. Its ceiling (C_max) and the static-
      versus-oracle ratio are derived in IDEA-20260906-ac100b; its baseline
      embedding is U = 0, where it is exactly the static Bernstein-Lange
      table (mechanism STEP 1), and that slice must reproduce Table 4.1 as
      in aed829 STEP 5.

  predictions:
    - metric: T_resel(U)/T_static at fixed (L = k W, epsilon = 0.9), a = 1/4, r_0 = 2, k = 4, batch average, LOWER bracket
      direction: lower
      minimum_effect: >-
        Below 0.75 with CI excluding 1.0 by U = 4 T and at most 0.6 by
        U = 8 T; asymptote in [0.45, 0.6] (model 0.51). A ratio that stays
        above 0.85 at U = 8 T rejects the record in its stated regime.
    - metric: single-walk hit rate of the full-T re-selected table versus C_max(1/4) = 0.39
      direction: higher
      minimum_effect: >-
        Rises from the static value (about 0.27) toward 0.39 and NEVER
        exceeds 0.39 + CI; plateau within 0.03 of 0.39 by U = 16 T.
    - metric: first-round success of the T/2 re-selected table relative to the full-T static table
      direction: lower
      minimum_effect: >-
        Strictly below static by at least 0.08 (scratch 0.57-0.59 vs
        0.70-0.72); break-even U* (cumulative solved equal to static) in
        [2 T, 4 T]; reported as the binding number for short batches.
    - metric: gain over STATIC as a function of r_0 in {1, 2, 4, 8}
      direction: lower
      minimum_effect: >-
        Monotone decreasing in r_0, zero within CI at r_0 = 8.
    - metric: gain under NULL 1, NULL 2, NULL 3 and at phi = 0
      direction: different
      minimum_effect: Zero within CI at every round.
    - metric: UPPER minus LOWER bracket success after round 4
      direction: different
      minimum_effect: Below 0.02 at every later round; larger means withheld walks matter.
    - metric: CAPPED-pool (4T, 2T) gain relative to UNCAPPED
      direction: different
      minimum_effect: >-
        At least 80% of the UNCAPPED gain retained at 4T and 60% at 2T;
        S_peak reported for each arm.
    - metric: re-selection cost per round in integer operations relative to R k W group operations
      direction: lower
      minimum_effect: Below 1% at every cell.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): the arithmetic of claim (C)-(D) checked by a
      validator: the 0.51 ratio from aed829 (B3), the per-instance rewriting
      of CGK Theorem 11, and the statement that the fixed-size table sits
      above the CGK line for M of order S.
      STAGE 1 (minutes, THE CHEAPEST VALID DISCRIMINATOR): N = 2^24, a = 1/4,
      r_0 = 2, k = 4, T_sel = T/2, R = 500, U = 8 T, 3 seeds, LOWER bracket,
      STATIC control at T and at T/2, NULL 1. One run separates "the batch's
      solved walks re-select the table toward the oracle" from "re-selection
      from online evidence is no better than static" and shows the early-
      batch penalty in the same numbers.
      STAGE 2 (hours): N in {2^24, 2^27}, T_sel in {T, 3T/4, T/2, T/4}, R in
      {250, 2000, 8000}, r_0 in {1, 2, 4, 8}, a in {1/8, 1/4, 1/2}, U up to
      32 T, 5 seeds; all nulls, the phi decay, both memory arms;
      T_resel(U)/T_static by interpolation at epsilon in {0.8, 0.9}.
      STAGE 3 (hours): N = 2^30 and 2^34, 3 seeds, the headline cells, for
      N-independence and for the fixture against the scratch numbers.
      STAGE 4 (hours): toy prime-order curve at N about 2^24, r-adding walk
      r = 32, every solved logarithm certified by independent scalar
      multiplication. Seeds and CI methods as in aed829.
    controls:
      - STATIC Bernstein-Lange table (published weight, r_0 = 2) at T and at T_sel, never re-selected
      - NULL 3 pool-updated-table-frozen arm
      - NULL 1 shuffled-evidence and NULL 2 relabelled-evidence re-selection
      - phi decay of admitted solved walks
      - r_0 sweep (gain must shrink with precomputation)
      - oracle top-T table (aed829 exact basins at N <= 2^26) as the ceiling arm
      - UPPER bracket (diagnostic only, not an algorithm)
      - CAPPED pools at 4T and 2T beside UNCAPPED
      - IDEA-20260906-a3d6ae growth arm at equal S_peak, for the frontier comparison
      - round-length sweep R
    required_metrics:
      - per-round success and ops per target per arm, with Wilson CIs
      - T_resel(U)/T_static at fixed (L, epsilon), batch average and first-10%, bootstrap CI
      - cumulative solved count versus U for each arm and the break-even U*
      - single-walk hit rate of the current table per round versus C_max(a)
      - pool size and S_peak per arm; bits per entry, frozen
      - re-selection integer operations per round beside group operations
      - certificate pass count on the curve arm

  falsification_conditions:
    - >-
      T_resel(U)/T_static above 0.85 with CI at U = 8 T, a = 1/4, r_0 = 2,
      k = 4: the batch's solved walks do not re-select the table toward the
      oracle at this budget; the record is rejected in its stated regime.
    - >-
      Any gain survives NULL 1 or NULL 2, or NULL 3 shows a gain: artifact
      or leak; the run set is invalid.
    - >-
      The single-walk hit rate exceeds C_max(a) + CI: the basin ceiling of
      aed829 is wrong; routed to review as a contradiction of the model,
      never promoted on Executor authority.
    - >-
      The gain does not shrink with r_0: the mechanism (estimation loss paid
      by the batch) is not what drives it; reported without a mechanism
      claim.
    - >-
      The UPPER-LOWER gap stays above 0.05: withholding unsolved walks costs
      more than modelled; the honest arm is weaker than the scratch suggests
      and the prediction is restated at the LOWER value.
    - >-
      The CAPPED 4T arm loses more than half the gain: the pool is
      load-bearing storage and the record must be re-priced at the pool
      size, at which point IDEA-20260906-a3d6ae is the fair comparator.

  confounders:
    - >-
      TARGET DISTRIBUTION. The pool estimates basin size only because targets
      are uniform; a skewed target distribution would re-select a TARGET-
      BIASED table (entries covering the targets that actually arrive),
      which is a different and possibly more useful object and must be
      studied separately, never mixed into this record's cells.
    - >-
      Rich-get-richer: table entries accumulate hit evidence every round
      while non-table candidates only through solved targets' other walks;
      this asymmetry slows convergence and could freeze a wrong table. The
      oracle arm and the r_0 sweep show how far from the ceiling the
      dynamics stop.
    - >-
      Round length R: re-selecting too often adds sort cost; too rarely
      delays the gain; R must be reported and swept.
    - >-
      Memory accounting: the pool is working storage at the online site; the
      RQ's T is the advice, and S_peak must always be reported beside it,
      with the CAPPED arms as the honest frontier points.
    - >-
      Cap handling: 8W as in the paper for both precomputation and online
      walks; capped walks charged at the cap.
    - >-
      Certification must use the seeded true logs only at check time; a
      pool entry's log is computed from the solved target's certified k_u.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy. Generic; constant-factor; the exponent 1/3
      does not move and the CGK multi-instance frontier is not approached.
    - >-
      The gain is bounded by the static table's estimation loss at its
      precomputation ratio; at N/T = 8 the paper's own table is at the model
      ceiling and this record predicts nothing there.
    - >-
      The reduction is in advice size T at fixed (P, L, epsilon) for a batch
      of U uniform targets, bought with working storage during the batch;
      the CAPPED arms are the frontier-honest points.
    - >-
      Applies to one curve and independent uniform targets; says nothing
      about skewed target distributions or multi-curve settings.

  heuristic_assumptions:
    - id: H7
      statement: >-
        BATCH-POOL EQUIVALENCE. In the LOWER bracket, the pool after U
        targets with k walks each has, for every basin of size n, evidence
        (count, length sum) distributed as that of a Bernstein-Lange
        precomputation pool with N/T = r_0 + U k p_s / T, where p_s is the
        per-target solve probability, up to the correlation that a target's
        k walks are admitted together; relative error in the resulting
        top-T coverage at most 10% for U k >= T and N >= 2^24.
      rigorous_support: >-
        Follows from H1-H2 of IDEA-20260906-aed829: solved targets' walks
        are uniform-start walks conditioned on the target being solved,
        which under memorylessness does not bias the DP reached by the
        NON-hitting walks except through the k-walk stopping rule; the
        imitated classical statement is the size-biased sampling of a
        random partition by independent uniform draws.
      validation_plan: >-
        Sample: at N = 2^24 with exact basins, after U in T * {1, 2, 4, 8}
        targets, regress each pool entry's count on its exact basin size;
        predicted slope (r_0 T + U k p_s)/N; compare the re-selected table's
        exact coverage with that of a precomputation pool of the same
        effective N/T (aed829 STEP 4), 5 seeds; tail check: the largest
        basin absent from the pool versus the selection threshold. Transfer:
        same law at cryptographic N, not tested.
    - id: H1-H2
      statement: Inherited from IDEA-20260906-aed829.
      rigorous_support: As in IDEA-20260906-aed829.
      validation_plan: As in IDEA-20260906-aed829.

  target_complexity:
    time_exponent: >-
      ONLINE per target 1/3 in N at T = N^{1/3}, unchanged; the constant at
      fixed T falls from the static 1.79 (a = 1/4, N/T = 2) toward the model
      oracle 1.28 over the batch (scratch, unverified: 1.33 -> 1.10 at
      k = 4 in ops per target). PRECOMPUTATION 2/3 in N with the CHEAP
      constant (N/T = 2, P = 1.24 (lT)^{1/2}) retained; the batch pays the
      rest.
    memory_exponent: >-
      Advice 1/3 in N with the constant reduced toward 0.51 of static at
      fixed (L, epsilon); working storage (pool) up to 4T in the CAPPED arm,
      reported as S_peak.
    best_known: >-
      Static Bernstein-Lange at N/T = 2: 1.79 (l/T)^{1/2} online, P = 1.24
      (lT)^{1/2}; at N/T = 8: 1.38 online, P = 15.7 (Table 4.1). Batch with
      growth: Kuhn-Struik / FJM sqrt(2 U N) total, and CGK Theorem 11's
      S T^2/M + T^2 = O(MN) with advice S plus stored relations.
    hidden_overhead: >-
      The pool's working storage (the paper's own distinction between
      precomputation space and output space is invoked, and the CAPPED arms
