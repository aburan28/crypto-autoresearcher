  assumptions:
    - A normal basis of F_{11^5}/F_11 exists and is fixed before either arm runs.
    - Characteristic 11 is greater than 3, so the classical shape of S_3 is the one expanded. If that expansion is identically zero, the record stops.
    - The integer 5 is invertible in F_11, so the trivial projector (1/5) sum of shifts is defined. It is used only as a dimension computation, not as a deleted-equation rewrite.
    - n = 5 is prime, so the only proper subfield is F_11, and j not in F_11 is the null test.
  proof_search_map:
    bottleneck: >-
      Whether one descended quadratic's F_11-span is a free cyclic module of
      rank 1, whose invariant line is exactly one-dimensional.
    baseline_embedding:
      parameter_slice: >-
        The factor-n symmetry at n = 5, with no factor base, on one quadratic
        S_3(a, b, T).
      reproduction_check: >-
        dim V = 5 and dim(V^{C_5}) = 1 on the object. Any other pair of
        integers fails the trivial-symmetry baseline.
    observation_collision:
      observable: dim(V^{C_5})
      distinct_preimage_search: >-
        The null curve is a second curve with the same formal cycle. Equal
        invariant dimensions on E and E0 mean the observable does not see
        the subfield model.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The five normal-basis coordinate quadrics and their trivial projector.
        predicted_gain: >-
          One integer on the object, predicted 1, and one integer on the null,
          predicted 0. No exponent.
    quantifier_order: >-
      There exist the first lex curve E/F_11, the first null curve E0, and
      the first pair (a, b), such that dim(V_E^{C_5}) = 1, dim V_E = 5, and
      dim(V_{E0}^{C_5}) = 0. This is not a statement for all curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        At (q, n) = (11, 5), one quadratic has exactly the trivial cyclic
        invariant, or it does not.
      nearby_object_control: >-
        E0, where the desired invariant dimension 1 is predicted to fail.
    proof_obligations:
      - claim: dim V_E = 5 and dim(V_E^{C_5}) = 1
        responsibility: correctness
      - claim: dim(V_{E0}^{C_5}) = 0
        responsibility: baseline
      - claim: the degree cap of the span is 2
        responsibility: scope
    not_applicable_reason: not_applicable
  predictions:
    - metric: dim of the C_5-invariant subspace of V on E
      direction: different
      minimum_effect: exactly 1
    - metric: dim V on E
      direction: different
      minimum_effect: exactly 5
    - metric: dim of the C_5-invariant subspace of V on E0
      direction: lower
      minimum_effect: exactly 0
  minimal_test:
    design: >-
      Fix one normal basis. Select E and E0 as in the claim. Expand one
      quadratic S_3(a, b, T) into five quadrics over F_11. Row-reduce. Apply
      the five cyclic shifts and compute the invariant dimension by linear
      algebra on that span. Do this on E and on E0. Stop. Do not build a
      factor base, a Gröbner basis, or a discrete-log solver.
    controls:
      - The null curve must have j not in F_11. If it does, the arm is invalid.
      - A random F_11-linear automorphism of the five coordinates that is not the Frobenius cycle is applied to V_E. Its invariant dimension is a second control and is predicted not to equal 1.
      - If fewer than five quadrics are nonzero, record the rank and do not interpret a dimension-1 outcome as a free orbit.
    required_metrics:
      - invariant_dimension_object
      - span_rank_object
      - invariant_dimension_null
      - invariant_dimension_random_linear_control
  falsification_conditions:
    - invariant_dimension_object is not 1.
    - span_rank_object is not 5.
    - invariant_dimension_null is not 0.
    - The random linear control also has invariant dimension 1, so the cycle is not distinguished from a generic permutation.
    - No pair (a, b) in the first 64 enumeration slots makes S_3 quadratic with roots outside F_11.
  confounders:
    - A dependent span of rank less than 5 makes the fraction 1/5 meaningless. The rank is a separate required metric.
    - Replacing the normal basis by another normal basis conjugates the cycle. Both arms must use the same basis rule.
    - Characteristic dividing the group order would kill the projector. Here 5 is invertible in F_11; that is checked before the dimension is reported.
  interpretation_limits:
    - Dimension 1 on one quadratic does not bound the solving degree of an m = 3 system and does not move an exponent.
    - Dimension not equal to 1 falsifies the trivial-symmetry reading for this quadratic only.
    - Nothing here is evidence about prime-field curves or about a GHS cover genus.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For the first admissible (a, b) on E, the five descended quadrics are
        an F_11-basis of a free module of rank 1 over F_11[C_5], hence have
        invariant dimension 1. This imitates the regular representation of a
        cyclic group of prime order, not a smoothness law.
      rigorous_support: >-
        The normal-basis theorem makes the 11-power map an F_11-linear cycle
        of order 5. It does not force the descended span to be free of rank 1.
        A free rank-1 module has a one-dimensional trivial isotypic component.
        That is a theorem about the group algebra, not about S_3.
      validation_plan: >-
        Compute the 5 by 5 matrix of cyclic shifts on the row-reduced span at
        this single (q, n, a, b). Predict rank 5 and invariant dimension 1.
        The tail check is the random-linear control, predicted invariant
        dimension not equal to 1. No sample beyond one quadratic and no
        transfer to n > 5 is claimed.
  target_complexity:
    time_exponent: >-
      Linear algebra on a span of five quadrics in five variables. No change
      to the square-root exponent of Frobenius-class rho.
    memory_exponent: O(1) field elements in F_11
    best_known: >-
      KR-IC-b0fcda, opened, charges a factor up to n on the number of systems
      and n^2 on linear algebra for a Frobenius-invariant factor base.
      Frobenius-class rho charges an extra square-root of n. Neither is beaten.
    hidden_overhead: >-
      No o(1) term is claimed. A later Gröbner stage is outside this test and
      can still be exponential in n.
    tradeoff_note: >-
      No time-memory tradeoff. One 5-dimensional linear algebra problem on
      each arm.
