idea:
  id: IDEA-20261005-bda728
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: >-
    Shift-invariant dimension of one descended quadratic at (q, n) = (11, 5),
    object versus null
  class: measurement
  claim: >-
    Let E be the first nonsingular ordinary short-Weierstrass curve over F_11
    in lexicographic order of (A, B), and let E0 be the first nonsingular
    short-Weierstrass curve over F_{11^5} whose j-invariant is not in F_11.
    Let (a, b) be the first pair in a fixed enumeration of F_{11^5}^2 for
    which S_3(a, b, T) is quadratic over that field and neither root lies in
    F_11. Write the unknown root coordinate in a normal basis of F_{11^5}/F_11
    and let V be the F_11-span of the five coordinate quadrics of that
    equation. Let C_5 cycle those coordinates. The shift-invariant dimension
    dim(V^{C_5}) equals 1 on E and equals 0 on E0, and dim V equals 5 on E.
    No factor base is built. This is not a cover-genus statement and it does
    not use the curve y^2 = x^3 + x + 1.
  mechanism: >-
    Two readings of RQ-FROB-7d8dd4 are separated before any run. Reading A:
    the q-power Frobenius contributes exactly the trivial cyclic symmetry of
    one descended quadratic, one invariant line in a five-dimensional span.
    Reading B: the span collapses further, dim(V^{C_5}) is not 1, which is
    extra structure beyond the factor n. The null curve has no model over
    F_11, so the same formal cycle is not a curve endomorphism; reading A
    predicts that its invariant dimension is 0. A drop on both curves means
    the cycle is an artifact of the coordinate permutation. PAIR
    (representation, Sigma): the representation is the normal-basis
    coordinates of one x-coordinate in F_{11^5} (class R1). Sigma is the
    cyclic shift induced by the 11-power Frobenius, not translation on
    E(F_{11^5}). Trichotomy class: partial-action. The projection keeps the
    trivial isotypic component and discards the other four isotypic
    components of F_11[C_5]. That discard is not invertible, so it is not a
    change of coordinates. It is compatible with Sigma because the invariants
    are the block of the trivial representation of <Sigma>. The rigidity
    statement that a deterministic projection under full translation is
    constant or injective is cited as IDEA-20260806-c5d183 and KN-FIND-ffe1df
    Theorem C with provenance recalled; those files were not opened. F2 is
    not the lens: no factor base is chosen. What is added past the
    Frobenius-orbit account is one integer, the invariant dimension of one
    quadratic span. Kummer-line and degree-d-function models are not used.
  novelty_status: unverified
