    "claim": "A separator decomposition of a supplied sparse relation matrix can reduce peak linear-algebra memory only when exact Schur fill and reconstruction data remain below the original storage; small graph separator size alone does not imply cheap finite-field elimination.",
    "mechanism": "Partition columns into local blocks and a separator S, order pivots only inside blocks, and carry exact row-operation certificates that express eliminated variables in terms of S. Form the resulting Schur system without dropping dense entries. A bound on each block's boundary interactions controls fill and reconstruction storage. The tracked object is a boundary relation module, paired with elimination and exact back-substitution; internal variables are discarded only with a solution-preserving reconstruction map. Unlike isotypic decomposition this uses incidence geometry, not a group action. NFS relation generation, filtering and extra relation demand are charged before the memory comparison.",
