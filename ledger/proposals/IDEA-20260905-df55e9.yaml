idea:
  id: IDEA-20260905-df55e9
  title: Definition and quantifier certificates for prime-field digit fall claims
  class: measurement
  status: proposed
  added: '2026-09-05'
  proposed_at: '2026-09-05'
  proposed_by: idea-generator
  question_id: RQ-PFDR-ae2fba
  task_id: TASK-20260905-5a2208
  batch_id: BATCH-ae9150
  claim: >-
    A certificate that binds the polynomial presentation, named degree invariant,
    admissible parameter domain and quantifier order can distinguish a finite
    refutation of a specified prime-field digit claim from an unsupported
    extrapolation to an unspecified bounded or probabilistic claim.
  mechanism: >-
    Type each candidate statement before testing it. Keep exact-degree layer
    first fall, ordinary first fall, iterated-closure last fall, measured solving
    degree and degree of regularity separate. A contradiction must carry a
    certificate in the convention and domain of the statement it refutes.
    The contribution is applicability and certificate discipline for this family;
    it does not re-propose persistence intervals or a new generic separation.
  novelty_status: unverified
  citations:
    - ref: https://arxiv.org/pdf/2112.05579
      provenance: retrieved
      claim: >-
        Caminata and Gorla give generic separations; Example 4.4 states first
        fall 3 and last fall and solving degree 2q-1 for its ordinary system.
        Their Theorem 3.1 connects solving degree, last fall and reduced-basis
        degree under a degree-compatible order. Quotient transfer is unchecked.
      verified_by: codex-root/2026-09-05
    - ref: https://arxiv.org/pdf/1505.02532
      provenance: retrieved
      claim: >-
        The paper supplies V_F,D and last-fall definitions; applicability and
        solution-count conditions must be checked before using its bounds.
      verified_by: codex-root/2026-09-05
    - ref: IDEA-20260905-d76d38
      provenance: internal
      claim: >-
        Existing proposal studies persistence of consequences and comparisons
        with the same Hilbert profile; this proposal instead types refutations.
      verified_by: codex-root/2026-09-05
    - ref: H-PFDR-4148b8
      provenance: internal
      claim: >-
        The existing prime-field digit hypothesis uses an exact squarefree
        multiplier layer and quantifies over affine x_R values.
      verified_by: codex-root/2026-09-05
  assumptions:
    - Each claimed invariant has an explicit definition and termination criterion.
    - Ordinary and quotient conventions require a proved interface before comparison.
    - All-affine and rational-curve-target domains are recorded separately.
  proof_search_map:
    bottleneck: A numerical disagreement need not contradict the same mathematical statement.
    baseline_embedding:
      parameter_slice: Ordinary Example 4.4 at q=3 and q=5, separate from the digit family.
      reproduction_check: >-
        Retain F={x^2-x,xy-1,w^q-w,w^(q-1)z^(q-1)-1} in F_q[w,x,y,z]
        unchanged. Reproduce each invariant only in its published convention;
        do not add Boolean reductions or field equations.
    observation_collision:
      observable: Same reported first-fall integer under different presentations or domains.
      distinct_preimage_search: >-
        Pair ordinary and quotient presentations, and equality versus fixed-gap
        claims, seeking equal meters with different admissible conclusions.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: Explicit compatibility obligations between named degree conventions.
        predicted_gain: Fewer false contradictions caused by an unproved identification.
      - transform: observable_fiber
        proposed_object: Certificates labelled by domain and logical statement.
        predicted_gain: Separate numerical coincidence from evidence about a claim.
    quantifier_order: >-
      Distinguish forall admissible theta, d_solve(theta)=d_ff(theta); forall
      theta, gap(theta)<=C for a supplied C; exists C forall theta, gap<=C;
      exists C forall s, degree(s)<=C; and explicit distributional statements
      with their sample spaces and asymptotic order. A finite witness can refute
      the first two, but cannot alone refute an unspecified O(1) bound.
    method_ceiling:
      strongest_certifiable_claim: A specific admissible finite witness refutes its exact universal bound.
      nearby_object_control: >-
        Published ordinary separations refute generic equality while supplying
        no automatic contradiction in the prime-field digit family.
    proof_obligations:
      - claim: Bind generators, field, quotient, term order, algorithm and domain.
        responsibility: interface
      - claim: Verify every nonzero consequence and its claimed derivation boundary.
        responsibility: correctness
      - claim: Require a quantified family argument for an asymptotic contradiction.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: invalid_scope_promotions
      direction: lower
      minimum_effect: Zero accepted promotions from a finite ladder to an unspecified O(1) refutation.
    - metric: native_control_degree_gap
      direction: different
      minimum_effect: Reproduction predicts gaps 2 and 6 at q=3 and q=5 in the published convention.
  minimal_test:
    design: >-
      Freeze a claim register and certificate checklist, reproduce the two
      ordinary controls, and classify a bounded set of existing public digit
      fixtures without asserting any unmeasured invariant.
    controls:
      - Published Example 4.4 in its native ordinary-polynomial convention.
      - Deliberately incompatible quotient presentation, expected to require an interface proof.
      - A finite growing table presented as O(1) disproof, expected to be rejected.
      - Affine target admitted separately from a verified rational-curve target.
    required_metrics:
      - Named invariants with presentation hashes and certificate status.
      - Exact claim quantifiers, parameter domain and supplied constant C if any.
      - Counts of accepted, rejected, inapplicable and censored certificates.
  falsification_conditions:
    - An accepted certificate changes the claim's convention, domain or quantifier order.
    - A finite table is accepted as refuting an unspecified asymptotic constant.
    - Native control disagreement remains after definitions and certificates are checked.
  confounders:
    - Heterogeneous generator degrees in the ordinary control versus one-generator layer conventions.
    - Gröbner algorithm choices mistaken for invariant definitions.
    - A transient closure plateau mistaken for completeness.
  interpretation_limits:
    - Generic separations are published results, not a new result of this batch.
    - No degree bound alone proves ECDLP hardness or an attack speedup.
    - Convention incompatibility is an informative outcome, not automatically an implementation failure.
  heuristic_assumptions:
    - id: H1
      statement: No statistical or distributional heuristic is needed for a verified finite certificate.
      rigorous_support: Logical implication requires the exact definitions and admissibility checks above.
      validation_plan: Independently check finite certificate and all interface obligations; no extrapolation.
  target_complexity:
    time_exponent: No attack improvement claimed; exponent delta +0.
    memory_exponent: No attack improvement claimed; exponent delta +0.
    best_known: No new attack or frontier comparison is asserted; query exponent delta +0.
    hidden_overhead: Exact linear algebra, Gröbner computations and independent certificate checking are charged.
    tradeoff_note: This is prerequisite measurement work; parallel trials cannot replace definition checks.
  dominated_by: n/a (no result claimed; frontier audit incomplete)
  sota_delta: No attack; conceptual/measurement contribution only; time/memory/query exponent delta +0.
  estimated_cost:
    implementation: low
    compute: low
    proposed_bound: Future pilot at most 8 fixtures, 1 hour total, 8 GiB; design-stage execution is zero.
  recommended_priority: high
  priority_order: 1
