idea:
  id: IDEA-20260904-a1b81b
  id_allocation_provenance: >-
    Minted by the Coordinator via `python3 tools/allocate_id.py --next idea
    --date 20260904`, checked free via `--check` before use (0 occurrences
    across 147905 identifier-bearing paths). No identifier was minted by the
    drafting subagent, per its own note (it has no Bash/shell tool).
  question_id: RQ-MONO-001
  added: '2026-09-04'
  status: proposed
  proposed_by: idea-generator
  class: measurement

  title: >-
    THE 1/(m-1)! IN EVERY SEMAEV RELATION-RATE MODEL IS A MONODROMY STATEMENT,
    AND AT m = 4 IT IS THE STATEMENT "Gal(residual cubic / function field of the
    fixed-T summation surface) = S_3". Measure it directly by enumerating
    V_R(F_p) at fixed T = x(R) and censusing the cubic's factorization type --
    the direction-swap successor DEC-20260810-2f86db D-4 named and D-5 killed at
    m = 3, resurrected at m = 4 where the residual object is a CUBIC with a real
    S_3 instead of a quadratic character.

  claim: >-
    SCOPE FIRST. m = 4, prime fields F_p, p > 3, toy range p in [101, 1009].
    E : y^2 = x^3 + Ax + B non-singular, ordinary, j not in {0, 1728} for the
    generic arm. Claim tier: toy for every measurement, derivation for the
    reduction. NO ALGORITHM IS PROPOSED AND NO EXPONENT IS CLAIMED; what is at
    stake is a CONSTANT FACTOR in a relation-rate MODEL, and its
    extension-field consequence is stated as a conditional whose transfer
    assumption is named and NOT validated here.

    THE OBJECT. Fix R with T_0 = x(R). Let
    W_R = { (x1,x2,x3) in A^3 : S_4(x1,x2,x3,T_0) = 0 }, a surface, and let
    V_R = W_R / S_3 be its image in the space of elementary symmetric
    coordinates (e1,e2,e3). A point of V_R(F_p) is exactly a monic cubic
    g(X) = X^3 - e1 X^2 + e2 X - e3 whose roots are an unordered triple summing
    (with some signs) to +-R. W_R -> V_R is a Galois S_3-cover; its Galois
    group G_R = Gal(k(W_R)/k(V_R)) is a subgroup of S_3 and is the object of
    this record.

    (E1) THE REDUCTION. For a Semaev m = 4 decomposition, a relation
    P_1 + P_2 + P_3 = +-R with all x(P_i) in the factor base F is EXACTLY a
    point of V_R(F_p) whose cubic g SPLITS COMPLETELY over F_p with all three
    roots in F. The signs are free because x(-P) = x(P), so no sign condition
    survives. Hence
      E[#relations for R] = |V_R(F_p)| * Pr[g splits] * Pr[all 3 roots in F | split]
    and the FIRST factor after |V_R(F_p)| is a Chebotarev density for G_R:
      G_R = S_3  =>  Pr[split] = 1/6, Pr[1+2] = 1/2, Pr[irreducible] = 1/3
      G_R = A_3  =>  Pr[split] = 1/3, Pr[1+2] = 0,   Pr[irreducible] = 2/3
      G_R = C_2  =>  Pr[split] = 1/2, Pr[1+2] = 1/2, Pr[irreducible] = 0
      G_R = 1    =>  Pr[split] = 1,   everything else 0
    all up to O(p^{-1/2}) by Weil/Lang-Weil on a surface. THE 1/(m-1)! = 1/6
    THAT EVERY SEMAEV RELATION-RATE MODEL ASSUMES IS PRECISELY THE ASSERTION
    G_R = S_3, AND IT HAS NEVER BEEN MEASURED IN THIS PROGRAM.

    (E2) THE CLAIM UNDER TEST, TWO-SIDED. For every ordinary E/F_p with
    j not in {0,1728} and for every R off a declared degenerate set,
    G_R = S_3 -- equivalently W_R is absolutely irreducible AND the
    discriminant of g is NOT a square in the function field of V_R. The
    alternative that matters is G_R = A_3, which happens exactly when
    disc(g) restricted to V_R is a square, and which would DOUBLE the
    per-fibre relation rate relative to the quasirandom model while
    ELIMINATING the 1+2 factorization type entirely.

    (E3) WHY THIS IS NOT THE INSTRUMENT DEC-20260810-2f86db REJECTED, AND NOT
    THE ROUTE DEC-20260904-8c2580 KILLED. It is not the OBS-5 trap: OBS-5 says
    the cycle type is constant when you CONDITION on all x_i being rational
    factor-base values; here complete splitting is the EVENT BEING MEASURED, not
    the conditioning, and its density on the ambient surface is exactly the
    relation-rate factor. It is not the D-5 collapse: at m = 3 the direction-
    swapped statistic collapsed because disc_{x2} S_3(x1,x2,T_0) = 16 f(x1)f(T_0)
    made the residual object a QUADRATIC governed by a quadratic character, so
    its group was S_2 and there was nothing to measure. At m = 4 the residual
    object is a CUBIC and S_3 is non-abelian with three proper subgroups, so
    the question is well-posed for the first time -- the same "m = 4 is the
    first non-degenerate arity" boundary DEC-20260802-a51c82 D-3 draws for
    imprimitivity, reached here by a different route.

    THE OUTCOMES, DEFINED BEFORE THE RUN. (I) G_R = S_3 on every tested (E, R):
    the 1/(m-1)! factor in this program's Semaev relation-rate models is
    theorem-backed at toy scale for the first time, KN-OPEN-002's assumed
    uniform relation probability gains an empirical footing on its
    monodromy-sourced factor, and the relation-rate half of KN-OPEN-009 gets its
    first non-degenerate measurement.
    (II) G_R = A_3 on some (E, R) family, or on a curve family: the per-fibre
    relation rate for that family is DOUBLE the quasirandom model, the 1+2
    factorization type is absent, and -- under the transfer assumption named in
    H3 and NOT validated here -- DEC-20260802-a51c82's own recorded scope note
    applies: a per-fibre factor of 2 in a Gaudry/Diem-style decomposition over
    F_{q^n} with n growing compounds as 2^{n-1} = q^{Theta(1)} and DOES move an
    exponent. This is the only branch in this session's proposals with any
    exponent relevance at all, and it is stated as a conditional with its
    transfer flagged, never as a claim.

  mechanism: >-
    DERIVED HERE from committed program content plus elementary Galois theory.

    STEP 1 (THE SURFACE AND ITS S_3-COVER). S_4 is symmetric in x1,x2,x3, so
    S_4(x1,x2,x3,T_0) descends to a polynomial in (e1,e2,e3); W_R is its
    ordered zero set and V_R the symmetric one, and W_R -> V_R is the restriction
    to W_R of the universal S_3-cover A^3 -> A^3/S_3. Restriction to a
    subvariety can only SHRINK monodromy, never grow it, so G_R <= S_3
    unconditionally and the only question is which subgroup.

    STEP 2 (THE TWO INDEPENDENT WAYS TO SHRINK, AND WHAT EACH MEANS).
    G_R is intransitive iff W_R is REDUCIBLE over k -- iff the cubic factors
    over the function field of V_R, i.e. one of the three points is
    "distinguished" by a rational function of the symmetric data, which would be
    a structural statement of independent interest.
    G_R <= A_3 iff disc(g) = prod (t_i - t_j)^2 has a square root that is a
    RATIONAL FUNCTION ON V_R, i.e. iff the alternating polynomial
    delta = (x1-x2)(x1-x3)(x2-x3) is congruent to a symmetric function modulo
    the ideal of W_R. This is a single, decidable algebraic condition and it is
    the record's cheapest gate.
    Note the m = 3 shadow: there the analogous alternating quantity is
    (x1 - x2), and disc_T S_3 = 16 f(x1) f(x2) (EV-MONO-a0a89c OBS-1,
    reconfirmed from scratch by DEC-20260904-8c2580) already exhibits it as a
    product of curve values -- which is exactly why m = 3 collapsed. Whether the
    m = 4 discriminant admits an analogous factorization is unknown to this
    program and is the Stage 0 question.

    STEP 3 (THE MEASUREMENT, WHICH NEEDS NO SYMMETRIZATION). V_R(F_p) can be
    enumerated EXHAUSTIVELY without ever computing S_4 in symmetric coordinates:
    for each (e1,e2,e3) in F_p^3, factor g over F_p, obtain its roots in F_p,
    F_{p^2} or F_{p^3}, evaluate S_4(t1,t2,t3,T_0) there (the value lands in F_p
    because S_4 is symmetric and the root multiset is Galois-stable), and keep
    the point iff the value is 0. Cost p^3 field operations at p = 101, about
    10^6, seconds in pure Python; the factorization type of g is read off the
    same computation for free. NO SAMPLING BIAS OF ANY KIND, because the
    enumeration is complete. A cheaper sampled variant for larger p enumerates
    (e1,e2) and solves for e3, but that variant conditions on a quartic having a
    rational root and is therefore BIASED; it is admissible only as a
    cross-check against the exhaustive arm at a prime where both are affordable,
    and this bias is named rather than discovered later.

    STEP 4 (WHAT THE DENSITIES DISCRIMINATE, QUANTITATIVELY). |V_R(F_p)| is
    about p^2 if the surface is absolutely irreducible (Lang-Weil), so the
    exhaustive census at p = 101 yields about 10^4 points and the binomial
    standard error on a density is about 0.005 -- against an S_3-versus-A_3
    separation of 0.5 in the 1+2 density and 0.167 in the split density. The
    test is over-powered by two orders of magnitude for the qualitative
    question, and correspondingly UNDER-powered for O(1/p) curve-to-curve
    deviations, which it does not claim to see. That asymmetry is stated up
    front because it is the exact asymmetry the two prior instruments in this
    lane got wrong in the other direction.

    THE LOSSY-PROJECTION TEST, RUN BEFORE ANY COMPUTE. Tracked object: the
    F_p-factorization type of the residual cubic at a point of V_R(F_p) -- three
    values (split, 1+2, irreducible) plus a degenerate stratum. Genuinely lossy:
    about p^2 surface points collapse to three values, discarding which triple,
    which signs, the curve's j, and R itself. Discarded COMPATIBLY: the type is
    exactly the S_3-conjugacy class of Frobenius in the cover W_R -> V_R, so it
    propagates deterministically under the cover's own structure and composes
    under Chebotarev. NOT a change of coordinates relative to anything this
    program has tracked: the ordered-base census tracks the T-fibre's cycle type
    at a point of the BASE, while this tracks the base's own splitting type at a
    point of a FIXED-T FIBRE -- the projections are literally in opposite
    directions, which is what makes this the D-4 direction swap, and at m = 4 it
    does not collapse into the other one because the residual degree is 3, not
    2.

  novelty_status: unverified
  novelty_status_note: >-
    The Chebotarev-density-of-a-cubic technique is textbook and is claimed as
    such. The framing -- that the 1/(m-1)! relation-probability factor in a
    Semaev decomposition IS the monodromy of the residual cubic over the fixed-T
    summation surface, hence measurable -- is this record's own and is the
    direction-swap successor DEC-20260810-2f86db D-4 named as "PROPOSED, NOT
    VALIDATED" and D-5 confined to m >= 4 once DEC-20260904-8c2580 confirmed the
    m = 3 collapse. INTERNAL CHECK PERFORMED: read DEC-20260810-2f86db and
    DEC-20260904-8c2580 in full; grepped ledger/proposals for GOAL-MONO-001 /
    RQ-MONO-001 (22 records) and for symmetric-base and division-field terms.
    IDEA-20260805-a9a95d / H-MONO-663fb4 is named in the corpus as the
    relation-rate object but is a variance/factor-base-sourced question, not a
    monodromy measurement on V_R; that boundary should be re-checked by the
    Coordinator against those records' full text, which this session did not
    read. EXTERNAL ARM UNVERIFIED: two web searches returned nothing on point
    and NO EXTERNAL SOURCE WAS OPENED. Whether the absolute irreducibility of
    S_m and of its fixed-T slices is already published is UNKNOWN to this
    record and is the single most valuable thing a reviewer with retrieval could
    settle before any compute is spent.

