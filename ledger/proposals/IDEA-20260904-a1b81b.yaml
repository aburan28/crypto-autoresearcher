  assumptions:
    - >-
      m = 4, prime fields, char > 3, ordinary non-singular curves. The relation
      count identity (E1) is stated for the prime-field Semaev decomposition
      only; the extension-field setting is a named transfer assumption (H3), not
      an assumption of the measurement.
    - >-
      S_4 is available explicitly by the resultant recursion, as this program
      already builds it. The measurement needs S_4 evaluated at a Galois-stable
      root triple in F_p, F_{p^2} or F_{p^3}, and no CAS.
    - >-
      "Relation" here means a point of V_R(F_p) whose cubic splits with all
      roots in the factor base. Whether such relations are USEFUL -- whether
      enough independent ones accumulate, and at what solve cost -- is outside
      this record entirely and is named in interpretation_limits.
    - >-
      Degenerate strata (g inseparable, Res(g,f) = 0, the point lying on a
      component of W_R of the wrong dimension, R in E[2]) are declared,
      enumerated and reported separately, never pooled.

  proof_search_map:
    bottleneck: >-
      Whether delta = (x1-x2)(x1-x3)(x2-x3) is congruent to a symmetric function
      modulo the ideal (S_4(x1,x2,x3,T_0)), i.e. whether disc(g) is a square on
      V_R. If it is, G_R <= A_3, the per-fibre relation rate is double the
      quasirandom model, and the 1+2 type vanishes. If it is not, G_R = S_3
      provided W_R is irreducible. Everything else is a consequence or a
      control, and this single question has an empirical proxy costing minutes.
    baseline_embedding:
      parameter_slice: >-
        m = 3, where the swapped statistic is already settled:
        DEC-20260904-8c2580 proves the transport disc_{x2} S_3(x1,x2,T_0) =
        16 f(x1) f(T_0), so the residual object is a quadratic and G_R there is
        S_2 = A_2-complement with nothing to measure. Running this record's
        pipeline at m = 3 must reproduce that degeneracy exactly -- it must
        report "residual degree 2, group forced, no measurement" rather than a
        spurious three-type histogram.
      reproduction_check: >-
        Symbolic and free: at m = 3 the residual polynomial has degree 2 and its
        discriminant is 16 f(x1) f(T_0), a product of quadratic characters, so
        the census reduces to the already-committed OBS-1/OBS-3 structure. If
        this record's pipeline emits anything else at m = 3, the pipeline is
        wrong and no m = 4 output may be read.
      what_would_have_counted_as_failure: >-
        Any m = 3 output inconsistent with DEC-20260904-8c2580's identity.
    observation_collision:
      observable: >-
        The three-valued F_p-factorization type of the residual cubic at a point
        of V_R(F_p), aggregated into a density triple.
      distinct_preimage_search: >-
        SEARCHED, AND ONE REAL COLLISION IS DECLARED: the density triple
        (1/6, 1/2, 1/3) is ALSO what a uniformly random monic cubic over F_p
        gives. So the S_3 outcome is, by density alone, indistinguishable from
        "the cubics on V_R behave like random cubics" -- which is exactly what
        the relation-rate model assumes and exactly what this record is testing,
        so the collision is the hypothesis rather than a defect. It is broken by
        the two additional arms: (i) the discriminant-square rate, which
        separates S_3 (1/2) from A_3 (1) directly, and (ii) the per-R stability
        check, since a random-cubic model predicts no R-dependence while a
        geometric degeneration would be R-indexed.
      residual_collision_risk: >-
        C_3 and A_3 give the same cycle-type densities on three points (both
        contain only the identity and 3-cycles); they differ only in
        transitivity of the ORDERED cover, so the discriminant-square arm cannot
        separate them and W_R's irreducibility must be checked separately.
        Declared, not discovered later.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the density triple fixed and vary the forgotten structure: the
          curve (at matched (t,Z)), the point R, and the CM/ordinary
          distinction. The intrinsic invariant proposed to separate them is
          NONE -- the record predicts the triple is (1/6, 1/2, 1/3) uniformly --
          so any separation found is the falsifier in constructive form.
        predicted_gain: >-
          If some (E, R) family separates, it is a curve-specific relation-rate
          deviation of exactly the kind KN-OPEN-009 asks about, on the statistic
          the attack actually consumes rather than on a proxy.
      - transform: representation_reduction
        proposed_object: >-
          Reduce "count FB-rational points on the fixed-T fibre" (an
          attack-shaped counting problem) to "compute a Galois group of a cubic
          over a surface's function field" (a structure question with a
          three-valued Chebotarev observable).
        predicted_gain: >-
          Converts an assumed constant in a cost model into a measurable
          density, which is the whole point of KN-OPEN-009's "replaces the
          ASSUMED uniform relation probability with a theorem-backed rate".
      - transform: boundary_lift
        proposed_object: >-
          Not applicable, and the reason is recorded rather than the field
          omitted: this record enlarges no certificate family and proves no
          inward improvement on a bound. It measures a group.
        predicted_gain: n/a
    quantifier_order: >-
      CLAIMED IN THIS ORDER: FOR ALL ordinary E/F_p with j not in {0,1728}, FOR
      ALL R off the declared degenerate set, G_R = S_3.
      A SINGLE (E, R) with G_R a proper subgroup, with controls passing,
      falsifies it -- which is why the test is run across many R per curve and
      many curves per prime, and why the per-R results are reported
      individually and never averaged into a per-curve number. THE WEAKER
      EXISTENTIAL ("there exists R with G_R = S_3") is not claimed and would be
      worthless: relation search runs over many R, so a rate is only meaningful
      if it holds for almost all of them.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: that at m = 4, over primes in [101, 1009], on the tested curve
        and R panel, the residual cubic's Frobenius factorization densities on
        V_R(F_p) match the S_3 Chebotarev triple within the stated tolerances,
        and the discriminant-square rate is 1/2 rather than 1.
        IT CANNOT certify absolute irreducibility of W_R (only transitivity
        consistent with it); it CANNOT certify anything about the factor-base
        membership factor, which is a separate smoothness/density heuristic and
        is explicitly NOT this record's object; it CANNOT bound any solver's
        linear-algebra or Groebner cost, which KN-FIND-a8990a names as where
        index calculus's cost actually sits; it CANNOT certify any statement
        about F_{q^n}; and it CANNOT move an exponent in the branch it expects.
      nearby_object_control: >-
        THE OBJECT ON WHICH THE CONCLUSION IS KNOWN FALSE, and it is
        constructible: a surface on which the cubic's group IS A_3 by
        construction -- take the zero set of a polynomial in (e1,e2,e3) obtained
        by substituting into a cubic with square discriminant, e.g. enumerate
        (e1,e2,e3) with disc(g) a nonzero square and treat that stratum as a
        synthetic "surface". The identical classifier must report 1+2 density
        EXACTLY 0 there and split density 1/3. A classifier that reports
        (1/6, 1/2, 1/3) on that object cannot see A_3 and NO NEGATIVE MAY BE
        REPORTED. Second nearby object: uniformly random (e1,e2,e3) with no
        surface condition, which must return (1/6, 1/2, 1/3) exactly -- if the
        surface arm returns the same triple, the record's positive outcome is
        "the surface does not shrink the group", which is the claim, and the
        two arms' AGREEMENT is only meaningful because the A_3 arm shows
        disagreement is detectable.
    proof_obligations:
      - claim: >-
          A point of V_R(F_p) with completely split g and all roots in F is
          exactly a Semaev m = 4 relation for R, with no residual sign
          condition.
        responsibility: correctness
      - claim: >-
          G_R <= S_3 unconditionally, and the three proper subgroups are
          distinguished by the density triple plus the discriminant-square rate
          plus transitivity.
        responsibility: correctness
      - claim: >-
          |V_R(F_p)| is about p^2, so the exhaustive census has about p^2 points
          and the stated standard errors.
        responsibility: size
      - claim: >-
          The exhaustive enumeration is complete and unbiased; the
          solve-for-e3 variant is biased and is used only as a cross-check.
        responsibility: soundness
      - claim: >-
          The m = 3 slice reproduces DEC-20260904-8c2580's degeneracy rather
          than a spurious histogram.
        responsibility: baseline
      - claim: >-
          The extension-field consequence is a TRANSFER ASSUMPTION (H3), not a
          result, and no exponent is claimed in either outcome.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        R1 (CHEAPEST DISCRIMINATOR IN THIS BATCH, MINUTES) -- fraction of
        V_R(F_p) points at which disc(g) is a nonzero square in F_p
      direction: same
      minimum_effect: >-
        0.5 +- 3 binomial standard errors under G_R = S_3, against 1.0 under
        G_R <= A_3. The separation is 0.5 against a standard error of about
        0.005 at p = 101; this is a 100-sigma discriminator and it needs one
        exhaustive enumeration at one prime for one R.
    - metric: >-
        R2 -- density of the 1+2 factorization type on V_R(F_p)
      direction: same
      minimum_effect: >-
        0.5 +- 3 s.e. under S_3, EXACTLY 0 under A_3 or C_3. A single 1+2 point
        rules out A_3 and C_3 outright; a total absence over about 10^4 points
        rules out S_3 outright. Both directions are decisive.
    - metric: >-
        R3 -- complete-splitting density on V_R(F_p), i.e. the relation-rate
        factor itself
      direction: same
      minimum_effect: >-
        1/6 +- 3 s.e. under S_3 against 1/3 under A_3. This is the number the
        relation-rate model assumes and the one an ICEX-style budget consumes.
    - metric: >-
        R4 (NEARBY-OBJECT CONTROL, MANDATORY) -- the same three densities on the
        synthetic square-discriminant stratum and on unconstrained random
        (e1,e2,e3)
      direction: different
      minimum_effect: >-
        (1/3, 0, 2/3) on the synthetic A_3 object and (1/6, 1/2, 1/3) on the
        unconstrained one, each within 3 s.e. If the classifier cannot separate
        these two, it cannot see the effect R2 asserts and NOTHING may be
        reported in either direction.
    - metric: >-
        R5 -- per-R stability: the density triple across >= 20 distinct R per
        curve, reported individually and never averaged
      direction: same
      minimum_effect: >-
        All 20 within 3 s.e. of the same triple. An R-indexed family with a
        different triple, with controls passing, is a geometric degeneration of
        the fibre and is the most interesting possible outcome short of a
        curve-family effect.
    - metric: >-
        R6 -- cross-curve comparison at matched (t, Z), one CM (j = 0 or 1728)
        and one generic ordinary
      direction: same
      minimum_effect: >-
        Triples agreeing within 3 combined s.e. A disagreement with R4 passing
        is a curve-specific relation-rate deviation on the statistic the attack
        actually consumes -- the exact object KN-OPEN-009 asks for.
    - metric: >-
        R7 -- p-ladder artifact tell: deviation of the measured triple from
        (1/6, 1/2, 1/3) across p in {101, 211, 421, 1009}
      direction: lower
      minimum_effect: >-
        Decaying as O(p^{-1/2}) (the Weil rate on a surface). A deviation that
        does not shrink when p grows is an artifact and voids the density arm.
    - metric: >-
        R8 -- the m = 3 baseline slice
      direction: different
      minimum_effect: >-
        Residual degree 2 and a forced group, matching DEC-20260904-8c2580.
        Anything else halts the pipeline.

  minimal_test:
    design: >-
      STAGE 0 (MINUTES, THE CHEAPEST VALID DISCRIMINATOR IN THIS BATCH). One
      prime p = 101, one ordinary curve with j not in {0,1728}, one R.
      Enumerate all p^3 triples (e1,e2,e3), keep those with
      S_4(t1,t2,t3,T_0) = 0 evaluated at g's Galois-stable root multiset, and
      report (a) |V_R(F_p)|, (b) the discriminant-square rate R1, (c) the
      three-type density triple R2/R3. If R1 comes out at 1.0 rather than 0.5,
      G_R <= A_3 and the relation-rate consequence is immediate and large; if it
      comes out at 0.5 the expected branch holds and Stage 1 proceeds.
      STAGE 1 (CONTROLS BEFORE BELIEF). Run R4's two nearby objects through the
      identical classifier and confirm the synthetic A_3 object returns
      (1/3, 0, 2/3) while the unconstrained object returns (1/6, 1/2, 1/3).
      Nothing from Stage 0 is interpretable until this passes.
      STAGE 2 (SCOPE). >= 20 R per curve, >= 8 uniformly drawn ordinary curves
      per prime, p in {101, 211, 421, 1009} (exhaustive at 101 and 211, sampled
      with the biased-variant cross-check above that), plus the m = 3 baseline
      slice R8.
      STAGE 3 (EXCEPTIONAL FAMILY). Matched-(t,Z) CM-versus-ordinary comparison
      R6, reporting the pair search outcome as a fact.
    controls:
      - >-
        R4's TWO NEARBY OBJECTS, one of them a SYNTHETIC A_3 OBJECT ON WHICH THE
        CONCLUSION IS KNOWN FALSE. Unlike EXP-MONO-12ce1c's cross-curve null --
        which both reviewers proved unsatisfiable for ANY companion object --
        this null is satisfiable by construction, and that is the design lesson
        being applied.
      - >-
        OI-1(a) REVERIFICATION-DISPOSITION RULE (CORR-20260802-1d8384 defect 3).
        Any candidate anomaly (an R with a deviant triple, a matched pair that
        disagrees) is independently reverified and the aggregate outcome MUST
        read that reverification's disposition; a candidate whose reverification
        returns failed_infrastructure is NEVER promoted to a positive finding.
      - >-
        OI-1(b) 2-TORSION GENERATOR GUARD (defect 7). R is generated as a
        multiple of a base point whose TRUE order is computed and asserted, not
        assumed to be #E; curves whose chosen base point is 2-torsion are
        quarantined, and R in E[2] is a declared degenerate case excluded and
        counted, since x(R) then behaves differently in the fibre.
      - >-
        OI-1(c) RELATIVE TOLERANCES ON THE TWO WINDOW CONTROLS (defect 4). The
        factor-base window controls CTRL-NEG-UNIFORM-WINDOW and
        CTRL-NEG-SHUFFLED-WINDOW -- which this record inherits if and only if a
        factor-base-membership arm is ever added -- use tolerances RELATIVE to
        the expected rate, never the absolute 0.02/0.03 that passed for an EMPTY
        window at every pinned prime, and each must be DEMONSTRATED to fail on a
        deliberately emptied window before any pass is read. In the base design
        no factor base is used at all (the splitting density is measured, not
        the membership density), and that is recorded here rather than the
        control being silently dropped.
      - >-
        OI-1(d) FAMILY_RATE_ALERT. If the rate of deviant-triple R values within
        any declared family (a curve, a prime, CM, j = 0, j = 1728, Z = 3)
        exceeds a pre-registered threshold, raise FAMILY_RATE_ALERT and
        quarantine that family's cells pending investigation rather than
        promoting them.
      - >-
        OI-1(e) UNIFORM (A,B) DRAW (defect 9). Curves are drawn uniformly from
        all non-singular (A,B) in F_p^2 by rejection sampling, never from a
        small-height box; j = 0 and j = 1728 are EXCLUDED from the generic
        ordinary arm per KN-OPEN-009's own requirement and appear only as the
        deliberately-studied CM member of a Stage 3 matched pair, where any
        effect must be checked against the extra-automorphism explanation first.
      - >-
        SUPERSINGULAR EXCLUSION: curves with N = p + 1 are identified and
        reported separately; "generic ordinary" means ordinary.
      - >-
        EXHAUSTIVE-VERSUS-SAMPLED DISCLOSURE. The exhaustive arm has no sampling
        error; the solve-for-e3 variant is BIASED by construction (it conditions
        on a quartic having a rational root) and may be used only as a
        cross-check at a prime where the exhaustive arm also runs. The bias is
        declared here, before the run, rather than found in review.
      - >-
        PER-R REPORTING, NEVER POOLED. The quantifier order is "for all R", so
        averaging over R would destroy exactly the falsifier the record is
        looking for.
      - >-
        DEGENERATE STRATA counted and reported separately: g inseparable,
        Res(g,f) = 0, R in E[2], and points where the four T-roots collide.
    required_metrics:
      - "|V_R(F_p)| per (curve, R, prime), against the Lang-Weil expectation ~p^2"
      - discriminant-square rate per (curve, R)
      - three-type density triple per (curve, R), reported individually
      - both nearby-object control triples, per prime
      - matched-(t,Z) pair search outcome and the paired triples
      - p-ladder deviation series
      - m = 3 baseline slice output
      - every degenerate-stratum count

  falsification_conditions:
    - >-
      S1 -- R4 fails: the classifier returns the same triple on the synthetic
      A_3 object as on the unconstrained one. NOTHING may be reported in either
      direction; instrument outcome, never mathematical evidence.
    - >-
      S2 -- R8 fails: the m = 3 slice does not reproduce DEC-20260904-8c2580's
      degeneracy. The pipeline is wrong and no m = 4 output may be read.
    - >-
      S3 -- the discriminant-square rate is 1.0 rather than 0.5 with controls
      passing: G_R <= A_3, the split density must then also read 1/3 and the 1+2
      density 0, and the per-fibre relation rate is DOUBLE the quasirandom
      model. This is outcome (II) and is the headline finding.
    - >-
      S4 -- the three densities do not match ANY subgroup of S_3's Chebotarev
      triple, with controls passing. Then G_R is not the whole story and
      something about the surface (reducibility, a wrong-dimension component,
      a non-reduced structure) is being missed; report as an anomaly, not as a
      group determination.
    - >-
      S5 -- an R-indexed or curve-indexed family with a different triple (R5 or
      R6 failing) with controls passing: a genuine curve- or point-specific
      relation-rate deviation, reported as the headline finding and NOT averaged
      away.
    - >-
      S6 -- R7 fails: the deviation does not decay as p grows. The density arm
      is measuring an artifact and is void.
    - >-
      S7 (THE PLANNED NEGATIVE, PRE-REGISTERED) -- if outcome (I) obtains and
      the batch does not emit what remains open, the work is unfinished. Fixed
      here before any run: (i) the FACTOR-BASE MEMBERSHIP factor
      Pr[all 3 roots in F | split], which is a smoothness/density heuristic this
      record does NOT test and which is the other half of the relation rate;
      (ii) the SOLVE COST, which KN-FIND-a8990a names as where index calculus's
      cost actually sits and which no relation-rate measurement touches;
      (iii) the F_{q^n} setting, where Gal(F_{q^n}/F_q) is a second group this
      measurement never sees and where H3's transfer would have to be
      established rather than assumed. A closure without these three is a
      fatigue report under docs/inventor-protocol.md section 4.

  confounders:
    - >-
      SAMPLING THE ORDERED VARIETY BY MISTAKE. Enumerating (x1,x2) in F_p^2 and
      solving for x3 enumerates W_R(F_p), which by construction contains ONLY
      completely-split points -- it would report split density 1.0 and look like
      a spectacular A_3-or-smaller finding. THIS IS THE SINGLE MOST LIKELY
      IMPLEMENTATION ERROR IN THIS RECORD and it is the same shape of error as
      the OBS-5 trap: sampling a locus on which the measured event is forced.
      The enumeration MUST run over the symmetric coordinates.
    - >-
      SOLVE-FOR-e3 BIAS. The cheap variant conditions on a quartic having a
      rational root, which is correlated with quadratic-character data and hence
      potentially with the cubic's factorization type. Declared; admissible only
      as a cross-check.
    - >-
      DEGENERATE R. R in E[2], or R such that the fibre drops dimension, gives a
      different object; these are enumerated and excluded, and the exclusion
      count is reported.
    - >-
      A_3-VERSUS-C_3 INDISTINGUISHABILITY by densities alone. Transitivity of
      the ordered cover must be checked separately if the A_3 branch fires.
    - >-
      MODEL CORRELATION, CARRIED FORWARD from EV-MONO-a0a89c and
      EV-MONO-efbd1c: the lane's producers and most of its reviewers resolved to
      claude-opus-5. Any review must record the confound rather than inherit it.

  interpretation_limits:
    - >-
      CLAIM TIER toy for every measurement; derivation for the reduction (E1).
      Never conflate them in a citation.
    - >-
      THIS MEASURES ONE OF TWO FACTORS. The relation rate is
      Pr[split] * Pr[roots in F | split]; only the first is measured here. A
      quoted "relation rate" that cites this record for both factors is an
      overclaim.
    - >-
      NO EXPONENT IS CLAIMED IN EITHER OUTCOME. Outcome (II)'s exponent
      consequence is conditional on H3's transfer to F_{q^n}, which is NOT
      validated here, and even outcome (II) at prime-field scale is a constant
      factor of 2 that moves nothing (DEC-20260802-a51c82's own "moves no
      exponent at fixed m" scope, which must always travel with it).
    - >-
      NO SOLVER COST CLAIM. Relation supply is not solve cost; KN-FIND-a8990a
      names the latter as where index calculus's cost actually sits.
    - >-
      PRIME FIELDS ONLY. Prime-field index calculus is not known to beat Pollard
      rho, so nothing here is an attack improvement at prime-field scale under
      either outcome; the whole exponent relevance lives in an extension-field
      setting this record does not touch.
    - >-
      DOES NOT CLOSE KN-OPEN-009 and DOES NOT AUTHORIZE A STATUS CHANGE
      (AGENTS.md rule 1).

  heuristic_assumptions:
    - id: H1
      statement: >-
        HEUR-CHEB-1. FOR ALL ordinary E/F_p with j not in {0,1728} and all R off
        the declared degenerate set, the Frobenius classes of the residual cubic
        are equidistributed over G_R with respect to Haar/conjugacy-class weight,
        with error O(p^{-1/2}) relative, so the measured density triple
        identifies G_R.
      rigorous_support: >-
        Rigorous half: the Lang-Weil / Weil bound for the number of F_p-points
        of an absolutely irreducible surface and of its Galois covers, giving
        |#points - p^2| = O(p^{3/2}), hence O(p^{-1/2}) relative density error.
        Classical distribution statement it imitates: the Chebotarev density
        theorem for function fields (the same theorem KN-OPEN-009 cites via
        KN-LIT-039, and the same one EV-MONO-a0a89c OBS-7 already validated in
        this lane by matching random quintics to Chebotarev(S_5) at 0.2026
        versus 0.2 and 0.2451 versus 0.25).
      validation_plan: >-
        SAMPLE: the density triple by EXHAUSTIVE enumeration of V_R(F_p) at
        p in {101, 211} (about 10^4 and 4*10^4 points per R), for >= 20 R per
        curve on >= 8 uniformly drawn ordinary curves, and sampled at
        p in {421, 1009}. COMPARE AGAINST: the S_3 Chebotarev triple
        (1/6, 1/2, 1/3), and against the synthetic A_3 object's (1/3, 0, 2/3)
        as a positive control. TAIL CHECK: the rarest class (complete splitting,
        density 1/6) must be present for every R at every prime, with expected
        count about 1700 at p = 101; its absence is a decisive tail failure
        rather than noise. LADDER CHECK: the deviation must decay as p^{-1/2}
        across the four primes (R7). TRANSFER ASSUMPTION, STATED: no
        extrapolation to cryptographic p is made; the ladder tests decay, which
        is the only extrapolation-adjacent statement.
      falsification_condition: >-
        A measured triple matching no subgroup of S_3, or a triple whose
        deviation fails to decay on the p-ladder, with the nearby-object
        controls passing.
    - id: H2
      statement: >-
        HEUR-IRR-1. W_R is absolutely irreducible of dimension 2 for all R off
        the declared degenerate set, so |V_R(F_p)| = p^2 (1 + O(p^{-1/2})) and
        the density estimates have the stated standard errors.
      rigorous_support: >-
        NONE IS OFFERED, AND THIS IS THE RECORD'S WEAKEST MATHEMATICAL LINK. The
        program has no committed irreducibility statement for S_4's fixed-T
        slices; whether it is published is UNKNOWN to this record (see
        novelty_status_note -- the external arm is unverified and a reviewer
        with retrieval should settle it first, since a published theorem here
        would upgrade H2 from a heuristic to a citation).
      validation_plan: >-
        SAMPLE: |V_R(F_p)| itself, exhaustively, for every tested (curve, R,
        prime). COMPARE AGAINST: p^2 with a Weil envelope of 3 p^{3/2}; a
        reducible surface would show a point count near a multiple of p^2 or
        would show a systematically split component. TAIL CHECK: the smallest
        and largest observed |V_R(F_p)| over the R panel against the envelope.
        This is free -- it is a by-product of the enumeration that already has
        to happen.
      falsification_condition: >-
        |V_R(F_p)| outside the Weil envelope for a positive fraction of R, or a
        systematic split of the density triple into two sub-populations across
        R, either of which indicates reducibility and makes the density triple a
        mixture rather than a single Chebotarev distribution.
    - id: H3
      statement: >-
        HEUR-TRANSFER-1 (STATED IN ORDER TO BE REFUSED AS SUPPORT). IF outcome
        (II) obtains at prime-field scale, THEN the same per-fibre factor
        applies once per summation fibre in a Gaudry/Diem-style decomposition
        over F_{q^n}, where DEC-20260802-a51c82's recorded scope note gives the
        compounding 2^{n-1} = q^{Theta(1)}.
      rigorous_support: >-
        NONE. This is a TRANSFER ASSUMPTION and it is explicitly NOT VALIDATED
        by anything in this record. The F_{q^n} setting involves a Weil
        restriction and a second Galois group Gal(F_{q^n}/F_q) that the
        prime-field measurement never sees, and H-MONO-45183a's own F7(i) names
        that setting as a place where its results say nothing. It is recorded
        here because docs/target-result-profile.md requires exponent relevance
        to be stated honestly when it is the reason a branch matters, and
        because stating it as an assumption is the only way to prevent a later
        reader from inferring it silently.
      validation_plan: >-
        NOT VALIDATED HERE, AND NO EXPERIMENT IN THIS RECORD BEARS ON IT. The
        route, named for a successor: repeat the V_R construction over F_{q^2}
        with a Weil-restriction factor base and measure whether the residual
        splitting density is the product of the per-fibre density and a
        Gal(F_{q^n}/F_q)-sourced factor, or something else. That is a separate
        proposal and a separate budget.
      falsification_condition: >-
        Not falsifiable by this record's experiment, which is exactly why it is
        recorded as an assumption rather than a prediction. Any citation of
        outcome (II) as exponent-relevant must carry this entry.

  target_complexity:
    time_exponent: >-
      NO ALGORITHM IS PROPOSED, so no time exponent is claimed. What is measured
      is a CONSTANT FACTOR in a relation-rate model: 1/6 under the expected
      outcome, 1/3 under the alternative. Stated with exponents as the profile
      requires: at fixed m the factor is O(1) and moves no exponent
      (DEC-20260802-a51c82's own scope wording, quoted with its scope);
      conditional on H3 and only in an F_{q^n} decomposition with n growing, a
      per-fibre factor of 2 compounds to 2^{n-1} = q^{Theta(1)}, which is an
      exponent -- and H3 is not validated, so no exponent is claimed.
    memory_exponent: >-
      O(1) for the measurement beyond a counter vector; the exhaustive
      enumeration streams and stores nothing of size p^3.
    best_known: >-
      Pollard rho, O(sqrt(N)) time and O(1) memory, remains the prime-field
      ECDLP baseline (KN-OPEN-001), and no prime-field index-calculus variant is
      claimed here or known to this record to beat it. In the extension-field
      setting the relevant frontier is Gaudry/Diem-style index calculus at
      roughly q^{2 - 2/n} (RECALLED, NOT READ, marked in citations, and not
      relied on for anything).
    hidden_overhead: >-
      None hidden in the measurement. The honest overhead is in the CLAIM: the
      relation rate has two factors and this record measures one; the other and
      the solve cost are named in interpretation_limits.
    tradeoff_note: >-
      Not applicable to the measurement. If outcome (II) ever fed a cost model,
      the model's time-memory position would be whatever the underlying index
      calculus's is, unchanged by a constant in the relation supply.

  dominated_by:
    value: >-
      Pollard rho, O(sqrt(N)) time / O(1) memory, on every prime-field axis.
    reason: >-
      Checked against the frontier rather than left null. This record proposes
      no solver, so under BOTH outcomes the prime-field cost frontier is
      unmoved: outcome (I) confirms a constant already assumed, outcome (II)
      doubles a relation supply for a method that does not beat rho over prime
      fields anyway. The only row on which a Pareto question could arise is the
      extension-field index-calculus row, and reaching it requires H3, which is
      an unvalidated transfer assumption -- so the honest entry is dominated,
      not null.
  sota_delta: >-
    0 under the expected outcome (I). Under outcome (II), still 0 as measured:
    a factor 2 in per-fibre relation supply over a prime field changes no
    exponent and does not make index calculus competitive with rho there. A
    nonzero sota_delta would require H3, which is not validated, and would
    require a successor experiment in the F_{q^n} setting.

  estimated_cost:
    implementation: medium
    compute: low

  recommended_priority: high

  priority_rationale: >-
    Highest consequence-per-minute in this batch at Stage 0: one exhaustive
    enumeration at p = 101 for one curve and one R -- seconds of compute --
    returns a discriminant-square rate that separates S_3 from A_3 at about
    100 sigma, and the A_3 branch is the only outcome anywhere in this session's
    proposals with a route to an exponent statement (conditional on H3, which is
    named and not validated). It is also the direction-swap successor this
    program has had on its books since 2026-08-10 as "PROPOSED, NOT VALIDATED",
    whose m = 3 gate DEC-20260904-8c2580 closed on 2026-09-04 with the explicit
    disposition "only m >= 4 remains open for it" -- so it is the named next step
    of a decision made today, not a new direction. Ranked HIGH with the honest
    caveat that outcome (I) is the expected one and carries sota_delta 0, and
    that the record measures one of the relation rate's two factors.

