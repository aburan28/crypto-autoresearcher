idea:
  id: IDEA-20260816-9a1ae2
  question_id: RQ-POLYMAC-7c89e4
  added: '2026-08-16'
  title: 'Ablate clamping as an operator rather than describe it: run the identical forgery measurement
    with the prime arm''s key constraint on and off, using the unclamped binary arm and a transported
    constraint as the nearby-object controls that separate what clamping does from what the field
    does'
  class: mechanism
  claim: '(A) The prime-field construction constrains its authentication key by a fixed bit mask before
    use; the binary-field construction does not constrain its authentication subkey at all. Any measured
    difference between the two arms therefore has at least two candidate causes - the field and the
    constraint - and the deployed pair alone cannot separate them. (B) The claim is that the separation
    is achievable by a factorial that this program can build but the deployed world did not: prime
    field with constraint, prime field without constraint, binary field without constraint, and binary
    field WITH a transported constraint of matched surviving cardinality. The fourth cell does not
    exist in any deployment and is exactly what makes the design identify the operator rather than
    the field. (C) The measured quantity is the optimal forgery probability of the hash layer, obtained
    exactly by root-set enumeration over the constrained key space in each cell, divided by the same
    quantity in that cell''s unconstrained baseline - and that normalisation is the subtle part, because
    a constraint that removes keys changes the denominator too, so a naive comparison of raw probabilities
    would attribute to clamping an effect that is arithmetic bookkeeping. The contract requires both
    the raw probability and the constraint-adjusted ratio. (D) The interaction term of the factorial
    is the deliverable: if the effect of the constraint is the same in both fields, clamping is a
    cardinality reduction and nothing more; if the effect differs by field, then the constraint interacts
    with the field''s multiplicative structure and the interaction is the measured object. (E) WHAT
    IS NOT CLAIMED: that clamping weakens or strengthens anything at deployed parameters; that the
    transported constraint in the binary arm is what a designer would choose; that any measured interaction
    implies a forgery advantage against ChaCha20-Poly1305 or AES-GCM; or that the toy constraint is
    the deployed constraint. The constraint transport rule is a declared construct of this experiment
    and its arbitrariness is a first-class limitation, not a footnote.'
  mechanism: 'STAGE 1 declares the transport rule: given the prime arm''s toy clamping mask with surviving
    cardinality C, construct a binary-arm constraint with the same surviving cardinality C, and do
    so in three different ways - a bit-mask constraint on the coefficient vector, a subgroup-membership
    constraint, and a random-subset constraint - because a single transport rule would confound the
    transport with the constraint. The random-subset transport IS the null for this entry and runs
    in the same invocation. STAGE 2 runs the exact root-set enumeration from the ratio-surface contract
    inside each cell, restricting the key enumeration to the surviving set. STAGE 3 computes both
    the raw optimal forgery probability and the constraint-adjusted ratio, where the adjustment renormalises
    by the surviving cardinality so that a pure cardinality reduction produces an effect of exactly
    one by construction. STAGE 4 fits the factorial and reports main effects and interaction with
    their enumeration-exact values - there is no sampling error here, so the only spread comes from
    the choice of transport rule and the choice of prime, both of which are swept. STAGE 5 refutes
    or supports: if the constraint-adjusted effect of every transport rule is one in both fields,
    clamping at these parameters is bookkeeping and the record says so with a number attached.'
  novelty_status: unverified
  novelty_screen:
    method: Greps as recorded above for POLYMAC, GHASH, Poly1305; plus targeted greps for clamp, clamping,
      clamped and ablation across ledger/proposals and ledger/hypotheses; read IDEA-20260809-3a39bc
      in full including its mechanism and why_not_a_renamed_known_approach fields; read the anchor
      question's weak-key and methods paragraphs.
    results: IDEA-20260809-3a39bc is the only ledger record that ablates clamping. Its ablation target
      is the CONSTRUCTION COST of a two-key commitment certificate, its mechanism is solving linear
      conditions for two keys, and its stated deliverable is design guidance attributing certificate
      cost to features. It contains no forgery measurement, no factorial, no transported constraint
      in the binary arm, and no null transport. The blacklisted Ed25519 clamping proposals under RQ-EDDSA-9b8473
      concern scalar clamping for curve arithmetic and share only the word. No hypothesis or evidence
      record in the repository contains a factorial design over field crossed with key constraint.
    verdict: 'UNVERIFIED. No claim is made about external literature. What is claimed new here WITHIN
      THIS REPOSITORY is the fourth cell - a constrained binary arm that exists nowhere in deployment
      - and the requirement of three transport rules with a random-subset transport as the null, which
      is what turns an ablation into an identification of the operator. What is assembled from known
      parts: the root-set enumeration machinery is shared with the ratio-surface entry in this batch
      and is not re-claimed; factorial designs with interaction terms are standard experimental practice
      used here as a tool.'
  object_first_candidate:
    tracked_object: 'The SURVIVING KEY SET as a subset of the field, carried through the measurement
      together with its intersection profile against root sets. The object is a pair: a subset S of
      the key space defined by the constraint, and the function that maps each achievable forgery
      to the cardinality of its root set intersected with S.'
    lossiness: 'Lossy. It discards how the constraint is described (mask bits, subgroup, random draw)
      and retains only which elements survive; and on the root-set side it discards which keys are
      accepted and retains only how many of the survivors are. This is compatible with the target
      operation because acceptance depends on the key only through root membership and the constraint
      acts only by restricting the key distribution. The lossiness is exactly what makes the three
      transport rules comparable: three completely different descriptions with the same surviving
      cardinality project to three subsets that the measurement can then distinguish or fail to distinguish.
      If they turn out indistinguishable, the projection has told us the description was irrelevant
      - which is the result.'
    propagation: 'One step of the target operation multiplies the key into the running digest. Under
      the projection, a step acts on the pair by pushing the surviving set forward through multiplication
      by the key, which for a bit-mask constraint is NOT a set-preserving action - the clamped set
      is not multiplicatively closed - so the projection deliberately does not commute with the operation,
      and that non-commutation is the entire content of the interaction term. For a subgroup transport
      the action IS closed, which is why the subgroup transport is included: it is the case where
      the constraint and the operation are compatible, and it brackets the bit-mask case.'
    survival_score: 'The object survives the full hash-layer computation at every tested parameter,
      because the measurement never needs the constraint to be preserved - it needs only the initial
      key distribution. It DISSOLVES at the boundary where the constraint interacts with key generation
      rather than key use: nothing here models how a key is derived, and in one of the two deployed
      constructions the authentication key is derived per nonce while in the other it is fixed per
      key, which is a separate structural difference deliberately excluded from this factorial and
      assigned to a different entry in this batch. It also dissolves for adaptive multi-query forgers,
      for the same reason as the ratio-surface entry.'
  null_object_control: 'The RANDOM-SUBSET TRANSPORT is the null and it runs in the same invocation
    as every signal cell: a uniformly random subset of the key space with exactly the surviving cardinality
    C, in each field, processed by the identical enumeration. For the ablation to mean anything the
    null must show a constraint-adjusted effect of exactly ONE to within the enumeration''s exact
    discreteness - because a random subset of cardinality C is by construction a pure cardinality
    reduction and nothing else. If the random-subset transport shows a departure from one, the adjustment
    formula is wrong and no cell in the factorial is interpretable. If the bit-mask transport matches
    the random-subset transport, the finding is that clamping is cardinality-only at these parameters,
    and that is a complete and useful result.'
  discriminated_from:
  - 'IDEA-20260809-3a39bc: ablates clamping against commitment-certificate construction cost. Different
    predicate (commitment, not forgery), different measured quantity (cost, not probability), and
    no transported constraint in the binary field.'
  - 'The weak-key counting entry in this batch: that one counts the clamped set''s intersection with
    order classes and never evaluates a forgery. This one measures forgery probability restricted
    to the surviving set and needs the counting entry''s cardinalities as an input.'
  - 'RQ-EDDSA-9b8473 clamping proposals: scalar clamping for curve point multiplication, a different
    group, a different operation, and blacklisted for this bucket.'
  - 'A plain description of what the clamping mask does bitwise: that is a specification restatement
    with no measurement. The content here is the interaction term of a factorial whose fourth cell
    does not exist in any deployment.'
  - 'Any single-field ablation: running only the prime arm cannot separate the constraint from the
    field, and this record''s whole design exists because of that.'
  assumptions:
  - A constraint with matched surviving cardinality is the right notion of transport. Alternative
    notions (matched entropy, matched bit positions) would give different fourth cells, and the choice
    is declared as a modelling decision.
  - The constraint-adjusted ratio correctly removes pure cardinality effects. This is checked, not
    assumed, by the random-subset null - if the null departs from one the adjustment is wrong.
  - The toy clamping mask is a faithful proportional analogue of the full mask, as frozen in the specification.
  - Enumeration over the surviving set is exhaustive at the tested widths, so all reported effects
    are exact and any spread comes only from swept design choices.
  predictions:
  - metric: constraint-adjusted effect under the random-subset transport, both fields
    direction: different
    minimum_effect: exactly 1 within the discreteness of the enumeration; any departure invalidates
      the adjustment formula and halts interpretation
  - metric: constraint-adjusted effect under the bit-mask transport, prime arm
    direction: different
    minimum_effect: 'no pre-commitment. Reason: the toy mask is a declared analogue and this record
      holds no prior for how a bit-pattern interacts with root sets; a pre-committed number would
      be fabricated.'
  - metric: interaction term (field crossed with constraint type) in the constraint-adjusted effect
    direction: different
    minimum_effect: the contract pre-commits only to reporting the interaction with its exact value
      and to declaring the ablation uninformative if the interaction is smaller than the spread across
      the five-prime sweep
  - metric: constraint-adjusted effect under the subgroup transport versus the bit-mask transport
    direction: different
    minimum_effect: a nonzero separation between these two transports at matched cardinality would
      show the constraint's algebraic type matters; the contract pre-commits to treating a separation
      below the prime sweep spread as no separation
  minimal_test:
    design: 'Fix n = 12 and n = 16, L in {2, 4, 8}, q = 1. Build six cells: prime unconstrained, prime
      bit-mask, prime random-subset, binary unconstrained, binary bit-mask-transport, binary random-subset-transport,
      all at matched surviving cardinality C. In each cell, enumerate every achievable difference
      polynomial of degree at most L, compute its root set, intersect with the cell''s surviving key
      set, and take the maximum intersection cardinality; divide by the surviving cardinality to get
      the raw probability and apply the declared adjustment to get the comparable number. This is
      a few minutes of pure-Python work per cell at these widths. The discriminating output is a single
      two-by-three table of constraint-adjusted effects plus its interaction term. Three readings
      discriminate: random-subset cells departing from one means the adjustment is broken and nothing
      else may be read; bit-mask cells equal to random-subset cells in both fields means clamping
      is cardinality-only here; bit-mask cells differing between fields is the interaction, and it
      is the only outcome in which the constraint has been shown to do something the field does not
      already explain.'
    controls:
    - Random-subset transport in both fields, same cardinality, same code path, same invocation -
      the null.
    - Subgroup transport in both fields as an algebraically-compatible bracket.
    - Unconstrained cells in both fields as the factorial baseline.
    - Five-prime sweep per width so that the prime-selection accident is visible as a spread rather
      than hidden in a point estimate.
    - 'Cardinality assertion: every cell''s surviving set is counted and asserted equal to C before
      measurement, and a mismatch halts the cell.'
    required_metrics:
    - surviving cardinality per cell, asserted equal across cells
    - maximum root-set-intersection cardinality per (cell, L)
    - raw optimal forgery probability per cell
    - constraint-adjusted effect per cell
    - interaction term across the factorial
    - prime-sweep spread of every reported effect
  falsification_conditions:
  - The random-subset transport shows a constraint-adjusted effect departing from one, invalidating
    the adjustment and hence the whole factorial.
  - Surviving cardinalities differ across cells that were supposed to be matched.
  - The interaction term is smaller than the prime-sweep spread, in which case the design cannot separate
    constraint from field at these parameters and says so.
  - Any cell's maximum root-set cardinality exceeds the difference polynomial's degree, a code fault.
  - The bit-mask transport in the binary arm cannot be built at the required cardinality, in which
    case the fourth cell does not exist and the identification fails by construction rather than by
    measurement.
  confounders:
  - 'Transport arbitrariness: three rules are swept precisely because any one of them confounds the
    transport with the constraint, and the sweep may still not cover the relevant axis.'
  - Prime selection at each width changes the multiplicative structure and can dominate the interaction.
  - The adjusted-effect formula is a modelling choice; a different renormalisation would move the
    interaction term, and the null is the only defence.
  - Padding differences between the arms already restrict achievable difference polynomials before
    any constraint is applied, so the unconstrained cells are not perfectly matched either - this
    is why a separate padding entry exists in this batch and why its result is a prerequisite for
    reading this one strongly.
  - Small surviving cardinalities at n = 12 make the discreteness of the maximum coarse relative to
    the effect being sought.
  interpretation_limits:
  - The fourth cell is an artifact of this experiment and corresponds to no deployed construction;
    results about it describe the operator, not any real system.
  - Everything is at n at most 16 with an idealised mask and a declared toy clamping rule; no statement
    about deployed clamping follows.
  - A zero interaction means the design failed to separate the operator from the field AT THESE PARAMETERS
    with THESE transports, and is not a statement that clamping does nothing.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is O(cells * A * 2^n) field operations with
      A the achievable-difference family size; bounded desktop compute at the declared widths.
    memory_exponent: No attack memory exponent is claimed. O(2^n) bits per root-set bitmap, six cells
      resident, single-digit megabytes.
    best_known: The incumbent is the practice of describing clamping from the specification and attributing
      observed differences to it without a control. Within this repository the nearest incumbent is
      IDEA-20260809-3a39bc, which ablates clamping for a different predicate and has no transported
      control arm.
    hidden_overhead: The transport rules are human design work and their arbitrariness is the real
      cost; the compute is trivial. Lower-order terms also hide in the adjustment formula, which is
      easy to get subtly wrong in a way only the random-subset null will catch.
  dominated_by: 'n/a (no result claimed). Pareto check run against every polymac-relevant record held
    here (KN-LIT-4060, KN-LIT-5652, KN-LIT-7035, KN-LIT-1337, KN-LIT-4188, KN-LIT-1445 and the nine
    RQ-AEADC-8db132 proposals): none states a time, memory or query cost for a forgery under a constrained
    key space, so there is no frontier row to be dominated by. No attack is claimed, so the record
    is not on the frontier at all.'
  sota_delta: No attack; mechanism-identification contribution only. Delta is from one uncontrolled
    clamping ablation in the ledger (IDEA-20260809-3a39bc, for a different predicate) to a six-cell
    factorial with a matched-cardinality null in both fields.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'By part. That the six cells can be built at matched cardinality and enumerated
    exactly: about 0.85, with the residual risk in constructing a bit-mask transport of exactly cardinality
    C in the binary arm. That the random-subset null comes out exactly one, validating the adjustment:
    about 0.7, and if it does not the contract yields an instrument result instead. That the bit-mask
    transport shows any effect beyond cardinality: about 0.25, because there is no strong reason a
    bit pattern should correlate with root sets, and the honest expectation is a clean cardinality-only
    finding. That a field-by-constraint interaction survives the prime sweep: about 0.15. The low
    priors are deliberate: the most likely outcome is a well-controlled negative that removes clamping
    from the list of candidate explanations for any arm difference, which is exactly what the rest
    of this bucket needs.'
