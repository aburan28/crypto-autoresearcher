idea:
  id: IDEA-20260829-70258e
  question_id: RQ-ALISO-001
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'

  title: >-
    The Autolab p1243 auxiliary-discriminant Kani family tracks a polarization
    type, which is an evaluation-side object with no term in the Wesolowski cost
    model; the single bridge that would make it search-side is a fixed-degree
    isogeny enumeration exponent below 1/2, and that is measurable

  class: mechanism

  claim: >-
    (A) WHAT THE FAMILY ACTUALLY DOES. Kani-style embeddings need an auxiliary
    endomorphism of norm S = n^2 - D_eta, classically supplied by writing
    S = a^2 + b^2 (a Gaussian-integer element), which fails whenever S is not a
    sum of two squares. The twelve imported Autolab packages EXP-ALISO-014 to
    EXP-ALISO-021 and EXP-ALISO-023 to EXP-ALISO-027 replace that rigid condition
    by a SEARCH: find a negative fundamental discriminant -delta, coprime to
    n*D_eta, in which every prime dividing S splits; then the ideal a = (S,
    omega - r) has norm S and the inclusion a -> O gives Gram matrices with
    A^T H_O A = S H_a and det(H_a) = det(H_O) = delta, producing a rank-eight
    Kani block F with F^T Omega_out F = n^2 Omega_in, det F = n^8 and
    Smith(F) = diag(1,1,1,1,n^2,n^2,n^2,n^2), at the cost that both Gram matrices
    have Smith type (1, delta) - a NON-PRINCIPAL polarization.

    (B) THE TRACKED OBJECT AND WHAT IT DISCARDS. The object followed through the
    computation is the POLARIZATION TYPE - the Smith form of the Kani block and
    of the two Gram matrices - not the abelian variety. This is a genuinely lossy
    projection: many polarized lattices share a Smith form, and the recorded
    results confirm this is where the family stops
    ("EXACT AUXILIARY-LATTICE PREFLIGHT / NO PRINCIPALIZATION THEOREM / NO
    GEOMETRIC ISOGENY", EXP-ALISO-017; "EXACT PRINCIPALIZED KANI LATTICE / NO
    GEOMETRIC QUOTIENT OR THETA EVALUATION", EXP-ALISO-020; "EXACT FINITE-MODULE
    PREFLIGHT / NO POLARIZED QUOTIENT CONSTRUCTION", EXP-ALISO-019). The
    projection is compatible with the operations - Smith forms compose
    deterministically under the lattice maps that define the block - so it
    propagates; what it discards is exactly the datum that decides computability
    of the quotient. That is why the family's own records terminate where they do,
    and it is a property of the object, not a shortfall of effort.

    (C) THE COMPARABILITY CLAIM, FALSIFIABLE. The Wesolowski cost model has
    exactly five quantities: B, X = B^{1/2}(p/2)^{1/6}, Psi(X,B), the table size
    M = Psi(X,B) X, and the success probability P0. Claim: a term-by-term mapping
    of the p1243 metric set (auxiliary_delta, auxiliary_search_trials, ideal norm
    and inclusion determinant, Gram determinants and Smith forms, adjoint
    integrality, typed polarization similitude, Kani-block determinant and Smith
    form, local kernel sizes at primes dividing n, the integer two-square gate)
    onto those five produces ZERO matched pairs, because the p1243 family prices
    ISOGENY EVALUATION given a kernel, whereas the Wesolowski bottleneck is
    ISOGENY SEARCH. Therefore no imported p1243 package can exhibit a measured
    margin against a Wesolowski-class baseline, and any claim that one does is a
    category error. FALSIFIED if any p1243 metric is exhibited as a monotone
    function of one of the five - in particular if delta enters the smoothness
    parameter B or the degree budget X.

    (D) THE ONE BRIDGE, STATED SO IT CAN FAIL. The family becomes search-side if
    and only if the auxiliary-discriminant construction changes the cost of
    ENUMERATING isogenies of a fixed degree. Define gamma by: the cost of
    enumerating all cyclic degree-d isogenies from a supersingular curve, d
    prime, is d^{gamma+o(1)}. Square-root Velu gives gamma = 1/2 (recalled).
    Claim: the auxiliary construction leaves gamma unchanged at 1/2 or above,
    because replacing "S is a sum of two squares" by "S is represented by some
    form of discriminant -delta" changes REPRESENTABILITY, not enumeration cost -
    the delta-search cost is dominated by factoring S and testing splitting, both
    of which are per-instance and do not amortise over an enumeration.
    Measurement of gamma decides it. A measured gamma < 1/2 would remove the
    smoothness requirement on one half of Wesolowski's split and is the only
    route by which this family could touch the p^{1/3} exponent.

  mechanism: >-
    Kani's lemma converts a known isogeny diamond into a computable isogeny of
    polarized abelian varieties; it is the ingredient behind the SIDH break and
    it consumes torsion images as input. Wesolowski's algorithm consumes nothing
    but the curve and spends its budget finding a codomain collision. These are
    different halves of the pipeline, and a technique that improves the first
    cannot show a margin against a baseline whose cost is entirely in the second
    - unless it changes how many candidate isogenies must be enumerated at all.
    The auxiliary-discriminant trick's stated purpose is to avoid raising the
    dimension when S is not a sum of two squares. The standard alternative -
    raising to dimension four or eight and using the four-square theorem, which
    represents EVERY positive integer - already handles arbitrary S in polynomial
    time (recalled: Robert's breaking-SIDH-in-polynomial-time construction and
    the SQIsignHD line). So the auxiliary route can at best buy a polynomial or
    constant factor in the evaluation step, and the burden is on it to show
    otherwise. Where it could genuinely matter is the third possibility, (D):
    that representing d by a norm form with an auxiliary order gives a cheaper
    ENUMERATION of fixed-degree isogenies. That exact strategy - compute
    endomorphism rings, compute the reduced norm form on Hom(E1,E2), represent d
    by that form, solve the resulting quadratic Diophantine equations with
    Cornacchia and Coppersmith variants - is already the published method of
    eprint 2023/1618, which is why the honest novelty label here is at best
    adaptation and why gamma, not delta, is the quantity worth measuring.

  novelty_status: unverified

