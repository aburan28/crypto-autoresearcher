  assumptions:
  - The twelve p1243 packages are internally consistent as archived; this
    proposal takes their recorded gate flags at face value for the purpose of
    mapping their metric names, and does not re-verify any arithmetic identity.
    Per DEC-20260801-010 all of them are claim_tier toy with certificates kind
    none.
  - Enumerating all cyclic degree-d isogenies from a supersingular curve for
    prime d up to about 2^20 is feasible in SageMath within the stated budget,
    so that gamma can be fitted over at least a decade of d.
  - The five-quantity summary of the Wesolowski cost model (B, X, Psi, M, P0) is
    complete; this is checked directly against the in-repo proof of Theorem 1.1
    and section 4.1 rather than assumed.

  proof_search_map:
    bottleneck: >-
      Two candidate bottlenecks, and the proposal's job is to decide which one
      the family sits on. Bottleneck 1 (evaluation): given a kernel or torsion
      images, produce a computable isogeny. Bottleneck 2 (search): produce a
      candidate isogeny at all. The p1243 records terminate at a lattice
      identity, upstream of both, at the point where a type-(1,delta) polarized
      module would have to become a computable geometric quotient. Removing THAT
      step changes an evaluation cost. It changes a Wesolowski-class cost only
      through claim (D).
    baseline_embedding:
      parameter_slice: >-
        delta = 4 (equivalently the Gaussian order, discriminant -4) reproduces
        the classical Kani condition exactly: the ideal of norm S is principal
        generated by a + b i, the Gram matrices have Smith type (1,1), the
        polarization is principal, and the construction degenerates to the
        standard two-square case. So the auxiliary family is a one-parameter
        extension containing the classical construction at delta = 4 and the
        proposal must reproduce it there.
      reproduction_check: >-
        Symbolic and fixture: instantiate the contract's F, Omega_in, Omega_out
        at delta = 4 on a family with S a sum of two squares, and require
        det F = n^8, Smith(F) = diag(1,1,1,1,n^2,n^2,n^2,n^2), and both Gram
        Smith forms equal to (1,1); then require bit-identical agreement with the
        classical two-square construction on the same fixture. Also required:
        re-derive the first row of EXP-ALISO-017's result (d = 101,
        degree_eta = 303, m = 3, n1 = 29, delta = 47, kani_smith entries 7569 =
        87^2 = (n1*m)^2) independently, as a regression fixture on the archived
        artifact.
    observation_collision:
      observable: >-
        The Smith form pair (Smith of the Kani block, Smith type of the Gram
        matrices) - the quantity every p1243 gate is phrased in.
      distinct_preimage_search: >-
        The collision is the central point of this proposal and it is easy to
        exhibit in principle: two polarized lattices with identical Smith forms,
        one arising from a genuinely computable geometric quotient and one not.
        Smith form is a purely local invariant of the polarization pairing and
        carries no information about the existence of an efficiently computable
        theta model for the corresponding variety. Therefore the observable does
        NOT identify the conclusion the family wants, and this is precisely why
        every p1243 record ends with "NO GEOMETRIC QUOTIENT OR THETA EVALUATION".
        The separating condition would be an explicit principalization
        construction with a poly(delta) cost bound; none is present in the
        archive and none is proposed here. This audit is a DIRECT falsifier of
        identifiability for the family's own observable and should be recorded as
        the family's obstruction even if nothing else in this proposal is run.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        Move the question from "can a type-(1,delta) polarized module be
        principalized" to the exact, measurable question (D): what is the
        exponent gamma of fixed-degree cyclic isogeny enumeration, with and
        without the auxiliary-order norm-form representation step.
      predicted_gain: >-
        None predicted - gamma is predicted to stay at 1/2. The value of the
        transform is that it converts an unfalsifiable structural hope into a
        fitted exponent with a decision threshold.
    - transform: observable_fiber
      proposed_object: >-
        Hold the Smith form fixed and vary the forgotten structure (the actual
        polarized lattice and its isomorphism class), then look for an intrinsic
        invariant separating computable from non-computable quotients - e.g. the
        smallest field of definition of the theta null point, or the size of the
        smallest isotropic subgroup that principalizes.
      predicted_gain: >-
        Would identify what the family's gates are actually failing to see. Even
        a negative outcome supplies the named obstruction the closure standard
        requires.
    quantifier_order: >-
      The family's implicit claim, written out: THERE EXISTS a polynomial q such
      that FOR ALL (D_eta, n, S) with S = n^2 - D_eta > 0, THERE EXISTS a
      fundamental discriminant -delta with delta <= q(log S) such that every
      prime dividing S splits in -delta, AND the resulting type-(1,delta)
      polarized module admits a principalization computable in time q(delta,
      log n). Note the order carefully: delta is allowed to depend on the
      instance, which is fine; but the POLYNOMIAL q may not. EXP-ALISO-014's own
      recorded status - "HEURISTIC SEARCH EVIDENCE / ARTIFICIAL PRIME SETS / NO
      LEAST-DISCRIMINANT THEOREM" - is exactly an admission that the first inner
      existential has no uniform bound, so the outer "there exists q" is
      unsupported. Any use of the family must carry that.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exact lattice identities and Smith forms on a finite registered fixture
        set, with mutation rejection - which is precisely what EXP-ALISO-017,
        019, 020 and 026 already certify, at claim_tier toy on five families. The
        method cannot certify a principalization theorem, cannot construct a
        geometric quotient, cannot evaluate an isogeny, and cannot produce any
        complexity statement.
      nearby_object_control: >-
        The nearby object on which the desired conclusion fails: a type-(1,delta)
        polarized abelian fourfold with the correct Smith form whose theta null
        point is defined only over an extension of degree exponential in delta.
        A method that certifies only the Smith form cannot distinguish it from a
        computable one, so the method has not identified the load-bearing
        structure. Constructing one such object explicitly at toy delta is the
        cheapest possible refutation artifact for the whole family and costs
        almost nothing.
    proof_obligations:
    - claim: 'The five-quantity Wesolowski cost model is complete and no p1243 metric maps onto it.'
      responsibility: interface
    - claim: 'delta = 4 reproduces the classical two-square Kani construction bit-for-bit.'
      responsibility: baseline
    - claim: 'gamma, the fixed-degree cyclic isogeny enumeration exponent, is at least 1/2 with and without the auxiliary norm-form step.'
      responsibility: runtime
    - claim: 'Smith form does not determine computability of the polarized quotient (the observation collision).'
      responsibility: correctness
    - claim: 'No uniform polynomial bound on the least admissible delta is established by the archive.'
      responsibility: strictness
    - claim: 'All conclusions are scoped to the five registered arithmetic families and the tested d-range.'
      responsibility: scope

  predictions:
  - metric: >-
      number of matched pairs in the term-by-term mapping of the p1243 metric set
      onto the five Wesolowski cost quantities (B, X, Psi, M, P0)
    direction: lower
    minimum_effect: >-
      Predicted exactly 0. Any single matched pair - a p1243 metric exhibited as
      a monotone function of one of the five - falsifies the comparability claim
      (C) and is the more interesting outcome.
  - metric: >-
      gamma, fitted from wall-clock and field-operation counts for exhaustive
      cyclic degree-d isogeny enumeration over prime d spanning at least
      2^10 to 2^20, with and without the auxiliary-order norm-form step
    direction: different
    minimum_effect: >-
      Predicted gamma >= 0.5 in both arms, with the two arms agreeing to within
      0.03. A measured gamma <= 0.45 in the auxiliary arm, with the CI excluding
      0.5, is a genuine positive and routes to adversarial review; a difference
      between arms of more than 0.05 in either direction is reportable.
  - metric: >-
      least admissible delta as a function of log S, over at least 10^4 randomly
      generated S (NOT the archive's registered families, which EXP-ALISO-014
      itself labels "ARTIFICIAL PRIME SETS")
    direction: higher
    minimum_effect: >-
      If the median least delta grows faster than (log S)^3, the implicit
      polynomial q of the quantifier-order audit does not exist in the tested
      range and the family's uniformity claim is refuted empirically. If it grows
      like (log S)^{1+o(1)} the claim survives the test.
  - metric: >-
      cost ratio of the auxiliary-delta route to the four-square higher-dimensional
      route for evaluating an isogeny with the same (D_eta, n, S), on the five
      registered families plus 100 random instances
    direction: different
    minimum_effect: >-
      A ratio below 0.5 sustained across instances would make the family a real
      evaluation-side improvement worth keeping; a ratio at or above 1 confirms
      domination by the four-square route and closes the evaluation branch.
  - metric: >-
      existence of an explicit toy type-(1,delta) polarized lattice with the
      correct Smith form whose quotient has no efficiently computable theta model
    direction: different
    minimum_effect: >-
      One explicit instance suffices to convert the observation-collision audit
      from an argument into a refutation artifact. Failure to construct one after
      a bounded search is NOT evidence that none exists and must be recorded as
      an incomplete search.

  minimal_test:
    design: >-
      Stage A (zero compute, do first): the term-by-term mapping of (C) and the
      observation-collision audit of the Smith-form observable, written out as a
      table with one row per p1243 metric and one column per Wesolowski cost
      quantity. Stage B (cheap): the delta = 4 baseline reproduction and the
      independent re-derivation of EXP-ALISO-017's first family row as a
      regression fixture on the archived artifact. Stage C (cheap): the
      least-delta growth measurement over 10^4 random S, deliberately NOT reusing
      the archive's registered families. Stage D (the only expensive stage):
      exhaustive cyclic degree-d isogeny enumeration over prime d from 2^10 to
      2^20 on fixed supersingular curves over F_{p^2} for a mid-size p, in two
      arms - a control arm using direct kernel enumeration plus square-root Velu,
      and an auxiliary arm using the norm-form representation of d with an
      auxiliary discriminant - counting field operations, not only wall clock,
      and fitting gamma in each arm. Stage E: the toy counterexample search for
      the observation collision.
    controls:
    - 'delta = 4 baseline: the auxiliary arm must reduce exactly to the classical construction, or the arm is mis-implemented.'
    - 'Null object for the delta search: replace the splitting condition by a random acceptance predicate of the same acceptance rate and confirm that the resulting least-delta growth is the same. If it is, the splitting condition is contributing nothing beyond a rejection rate.'
    - 'Field-operation counting, not wall clock alone: gamma fitted on wall clock in one arm and field operations in the other would be meaningless. Both arms report both.'
    - 'Instance-source control: the least-delta measurement uses freshly random S, because EXP-ALISO-014 self-labels its prime sets artificial; reusing them would measure the fixture, not the phenomenon.'
    - 'Mutation controls, replicated from the archive contract: increment one entry of A, of H_a, replace D_eta by D_eta + 1, force an inert discriminant - each must be rejected. A reimplementation that accepts a mutation is void.'
    required_metrics:
    - metric_mapping_table_matched_pair_count
    - delta_4_baseline_reproduction_flags
    - exp_aliso_017_row1_regression_agreement
    - least_delta_vs_log_S_distribution
    - gamma_fit_per_arm_with_ci
    - field_operations_per_arm_per_degree
    - auxiliary_vs_four_square_cost_ratio
    - mutation_rejection_flags
    - collision_counterexample_found_flag
    - wall_clock_and_peak_rss

  falsification_conditions:
  - >-
      Any p1243 metric is exhibited as a monotone function of B, X, Psi(X,B), M
      or P0: the comparability claim (C) is false and the family IS on the
      Wesolowski axis, which reopens it entirely.
  - >-
      gamma in the auxiliary arm is measured at or below 0.45 with the CI
      excluding 0.5: the bridge (D) is open, the family becomes search-side, and
      the result routes to independent adversarial review before any statement is
      made.
  - >-
      delta = 4 fails to reproduce the classical construction: the extension does
      not contain its baseline and the whole family's framing is wrong.
  - >-
      The archived EXP-ALISO-017 first row cannot be independently re-derived
      under the contract's own prescription: an archival integrity finding about
      the import, which must be recorded as a correction against the package and
      NOT as evidence about the mathematics.
  - >-
      Median least delta grows polynomially in log S at degree <= 3 over 10^4
      random S: the uniformity concern raised by the quantifier-order audit is
      empirically allayed in the tested range, and that part of the closure is
      withdrawn.

  confounders:
  - >-
      Implementation asymmetry between arms in Stage D. The auxiliary arm has
      more moving parts and will be slower for reasons unrelated to gamma. This
      is why gamma is an EXPONENT fit over a decade of d and not a ratio at one d;
      a constant-factor handicap does not move gamma.
  - >-
      The registered families are five hand-chosen instances. Any statement fitted
      to them is a statement about them. Stage C exists specifically to break this.
  - >-
      Smith-form conventions. Elementary divisor ordering and normalisation differ
      between libraries; a mismatch would produce spurious gate failures in the
      reproduction. The convention must be declared before Stage B.
  - >-
      The AppleDouble defect in EXP-ALISO-017/analysis.md means any pipeline that
      reads analysis.md rather than source/*.json will silently ingest binary
      stub text. Any automated adjudication over the ALISO packages must read
      source/ and must fail loudly on stub content rather than treating it as an
      empty finding.
  - >-
      Recalled-only domination. The claim that the four-square dimension-four or
      dimension-eight route already handles arbitrary S in polynomial time is
      RECALLED, not verified this session. If it is wrong, the evaluation branch
      of the domination assessment collapses and the family's value rises.

  interpretation_limits:
  - >-
      This proposal adjudicates a family; it does not attack a cryptosystem. Even
      a fully positive Stage D outcome would be a fixed-degree enumeration result,
      and connecting it to the Wesolowski bottleneck needs a separate argument
      that is not supplied here.
  - >-
      Kani's lemma is the ingredient behind the SIDH break and this proposal's
      understanding of it is not verified against the primary sources - Kani,
      Castryck-Decru, Maino-Martindale, Robert are all RECALLED or known only
      through the in-repo Wesolowski reference list. novelty_status is therefore
      unverified and the record must not be read as a survey of what is known
      about Kani's lemma.
  - >-
      Nothing here promotes any imported package. Per DEC-20260801-010 all twelve
      remain claim_tier toy archival imports whose certificates are kind none.
      The recorded Autolab negative in EXP-ALISO-023 ("NEGATIVE RESULT FOR
      PARITY-REPAIR COMPLEXITY") is quoted, not adopted.
  - >-
      The exact rational exponents recorded in EXP-ALISO-024 (13/54, 6/25, 2/9,
      onsets 1/41 and 1/43) are quoted without interpretation because the portion
      of that file read this session does not establish what they are exponents
      of. They must not be compared to 1/3 or 1/2 by anyone until that is
      established.

  heuristic_assumptions:
  - id: H1
    statement: >-
      Auxiliary discriminant density. For a positive integer S with k distinct
      prime factors, the number of fundamental discriminants -delta with
      delta <= D, delta prime and congruent to 7 mod 8, gcd(delta, S) = 1, in
      which EVERY prime dividing S splits, is (1 + o(1)) * 2^{-k} * pi(D)/2 as
      D -> infinity - that is, the splitting conditions at the k primes behave as
      k independent fair coin flips, so the least admissible delta is
      O(2^k log S) in expectation.
    rigorous_support: >-
      The rigorous ingredient is quadratic reciprocity together with the
      Chebotarev density theorem: for each fixed odd prime q dividing S, the
      condition that q splits in Q(sqrt(-delta)) is a condition on delta modulo
      4q of density exactly 1/2 among admissible residues. The classical
      distribution statement being imitated is that the k congruence conditions,
      which are independent by the Chinese Remainder Theorem on the moduli, are
      also independent with respect to the ORDERING of the primes delta - i.e.
      that primes are equidistributed among the 2^k classes with no bias in the
      initial segment. That last step is the heuristic; effective Chebotarev
      bounds under GRH would give it, but the archive's own EXP-ALISO-014 status
      records "NO LEAST-DISCRIMINANT THEOREM", so nothing unconditional is
      available here.
    validation_plan: >-
      Sample: 10^4 freshly random S in each of three size bands (S near 2^40,
      2^80, 2^160), each with its full factorization known by construction so k
      is exact. Shortcut: none needed; delta search is elementary and cheap, and
      that is why this heuristic can be validated at cryptographically relevant S
      sizes directly, unlike the smoothness heuristics elsewhere in this lane.
      Comparison distribution: the empirical CDF of the least admissible delta
      against the geometric prediction with success rate 2^{-k}, stratified by k.
      Tail checks: the 99th percentile of least delta within each k-stratum
      against the geometric tail; and the extreme S in the sample (largest k)
      against its individual prediction. Transfer assumption: results at
      S near 2^160 are extrapolated to larger S with no crossover; and the
      archive's registered families are excluded from the sample so that the
      measurement is not of the fixture.
  - id: H2
    statement: >-
      Enumeration-cost invariance. For a supersingular curve E/F_{p^2} and prime
      degree d with log d = o(log p), the cost of enumerating all d + 1 cyclic
      degree-d isogenies from E is d^{gamma + o(1)} field operations with
      gamma = 1/2, and this exponent is UNCHANGED by any preprocessing that
      represents d by a norm form over an auxiliary imaginary quadratic order,
      because such preprocessing is per-instance and does not amortise over the
      enumeration.
    rigorous_support: >-
      The rigorous reference point is square-root Velu (RECALLED, not fetched):
      evaluation of a degree-d isogeny in Otilde(sqrt d) field operations, which
      gives gamma = 1/2 as an upper bound for the per-isogeny cost. The classical
      statement being imitated is the standard amortisation principle: a
      per-instance preprocessing of cost c contributes c/n to an n-fold
      enumeration and cannot change the exponent unless it is shared. H2 asserts
      the auxiliary norm-form step is not shared. The competing possibility -
      that the norm form is computed once for the pair (E1, E2) and then reused,
      which is precisely the structure of eprint 2023/1618 - is the reason this
      is a heuristic and not an argument, and it is the exact thing the two-arm
      measurement is designed to detect.
    validation_plan: >-
      Sample: prime d spanning 2^10 to 2^20 in at least 20 logarithmically spaced
      values, at three primes p of 128, 192 and 256 bits, with 10 independent
      curves per (p, d) cell. Shortcut: none - this is measured directly, which is
      feasible only because d is bounded well below p. Comparison distribution:
      log(field operations) against log d, fitted per arm, with the predicted
      slope 1/2. Tail checks: the largest d in each cell must lie on the fitted
      line within the residual spread; a systematic curvature at large d means the
      asymptotic regime was not reached and gamma is not yet meaningful. Transfer
      assumption, stated bluntly: gamma fitted at d <= 2^20 is extrapolated to
      d near p^{1/6}, which for a 256-bit p is d near 2^42 - a two-decade
      extrapolation that this experiment cannot justify and that must be recorded
      as the dominant limitation of the bridge test.

  target_complexity:
    time_exponent: >-
      No time exponent is claimed for the family. Predicted outcome: the family
      does not appear in the exponent of any Wesolowski-class quantity at all
      (claim C), and the fixed-degree enumeration exponent gamma stays at 1/2
      (claim D). The only branch that would produce a time exponent is
      gamma < 1/2, which would give fixed-degree enumeration in d^{gamma+o(1)}
      and, only through a further argument not supplied here, could relax the
      smoothness requirement in Wesolowski's Lemma 3.4.
    memory_exponent: >-
      Not applicable to the audit branch. In the bridge branch, the auxiliary
      norm-form route is memory-free per instance (Cornacchia-style solving), so
      a positive gamma result would sit at poly(log) memory - which is what makes
      it interesting relative to Wesolowski's p^{1/3+o(1)} memory.
    best_known: >-
      For fixed-degree isogeny finding: eprint 2023/1618 (abstract retrieved),
      which reports memory-free algorithms beating meet-in-the-middle for
      d approximately p^{1/2+epsilon} with 1/2 <= epsilon <= 3/4 classically. For
      arbitrary-degree isogeny evaluation given torsion images: Robert's
      polynomial-time higher-dimensional embedding (recalled). For the
      supersingular isogeny problem itself: Wesolowski p^{1/3+o(1)} time and
      memory (heuristic), Udovenko p^{2/5+o(1)} unconditional, Delfs-Galbraith
      p^{1/2}(log p)^{O(1)} at negligible memory.
    hidden_overhead: >-
      The family's own hidden overhead is the least admissible delta, which
      EXP-ALISO-014 records as having "NO LEAST-DISCRIMINANT THEOREM" and whose
      growth is measured by H1. If the least delta grows like 2^k in the number
      of prime factors of S, the overhead is subexponential in log S and the
      poly(delta) principalization hope is not merely unproved but aimed at a
      target that may not be polynomial. That is the single most important number
      this proposal asks for.
    tradeoff_note: >-
      Not a time-memory proposal. The relevant tradeoff is DIMENSION versus
      REPRESENTABILITY: the auxiliary route keeps the dimension low and pays with
      a non-principal polarization plus a delta search; the four-square route
      raises the dimension and pays with more theta coordinates but no
      representability condition and no search. The audit prices exactly that
      trade on the five registered families plus 100 random instances.

  dominated_by: >-
    Evaluation branch: dominated by the four-square higher-dimensional embedding
    route (Robert, recalled) which handles arbitrary S in polynomial time with no
    representability condition and no auxiliary search - unless the measured cost
    ratio comes in below 0.5, which the experiment tests. Bridge branch:
    dominated by eprint 2023/1618 (abstract retrieved 2026-08-29), which already
    represents d by the reduced norm form on Hom(E1,E2) and solves the resulting
    Diophantine equations with Cornacchia and Coppersmith - the same move the
    auxiliary-order construction makes, published, with stated complexity ranges.
    Within this corpus, the non-principal-polarization costing is dominated by
    IDEA-20260808-40aab9's part (C2), which prices a (1,N)-polarized quotient at
    Otilde(sqrt N) and finds it at best rho-matching on the ordinary side.
    Frontier rows checked: Wesolowski p^{1/3+o(1)}/p^{1/3+o(1)}; Udovenko
    p^{2/5+o(1)}/p^{2/5+o(1)}; Delfs-Galbraith p^{1/2}polylog/negligible;
    van Oorschot-Wiener p^{1/2+o(1)}/w^{1/2} with memory w; eprint 2023/1618 for
    fixed-degree. NOT CHECKED: the Kani, Castryck-Decru, Maino-Martindale and
    Robert primary sources, none of which was fetched this session; and any
    published work specifically on principalizing type-(1,delta) polarizations
    computationally, for which no search was run. This dominated_by is therefore
    declared incomplete rather than set to null.
  sota_delta: >-
    Audit branch: "n/a (no result claimed)" - the deliverable is a comparability
    verdict and a named obstruction, not an algorithm. Bridge branch: the target
    is gamma < 1/2 against the square-root Velu reference gamma = 1/2, i.e. a
    strictly sub-square-root fixed-degree cyclic enumeration exponent; predicted
    delta is 0. Evaluation branch: the target is a cost ratio below 0.5 against
    the four-square route on matched instances; predicted ratio is at or above 1.

  estimated_cost:
    implementation: high
    compute: medium

  recommended_priority: medium
