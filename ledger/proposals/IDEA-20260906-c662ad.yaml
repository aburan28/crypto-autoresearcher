    "title": "Reachability invariants for differential ladders on cofactor curves",
    "class": "algorithm",
    "area_tags": [
      "SCURVE"
    ],
    "claim": "A ladder formula set that is not complete on E×E may nevertheless be complete on its exact reachable state relation; a certified invariant can distinguish such restricted correctness from a false claim of global completeness.",
    "mechanism": "Track projective states representing (R0,R1) with R1-R0=P and a scalar-prefix relation, including explicit exceptional tags for infinity and small-order P. Establish initialization, closure under each bit step and final decoding on a constructible reachable domain. Polynomial ideals alone may overapproximate reachability, so preserve disjunctions and nonvanishing requirements. The retained difference is a partial-action object under the specified ladder transitions; it loses scalar history only after a state invariant is proved. Each actual curve model must supply legal formulas or a certified conversion. Non-Montgomery curves are applicability tests for model conversion, not assumed to have a Montgomery ladder.",
