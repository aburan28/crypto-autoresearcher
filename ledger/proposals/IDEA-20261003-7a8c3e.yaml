        relation: adjacent
        delta: >-
          Kangaroo constants bound an interval search. This record
          counts scalar width and claims no search.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a width gap.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 2 versus 1
    data_queries: Two frozen widths.
