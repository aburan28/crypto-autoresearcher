# IDEA-20261003-7a8c3e
# Scalar-width count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-7a8c3e
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A two-component scalar has width 2 and a generic scalar has width 1
  class: measurement
  claim: >-
    A two-component scalar writes 2 integers. A generic scalar writes
    1 integer. Two exceeds one by 1. The product of the two widths
    is 2. Their sum is 3. The gap is a writing width, not an ECDLP
    exponent.
  mechanism: >-
    OBJECT FRAME. The object is the scalar coordinate tuple. The
    operation set is evaluation of one extra endomorphism on that
    pair. A generic scalar has no second component. Two generic
    scalars both have width 1, so that gap is 0. This is not an
    orbit count and not a walk.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether extra endomorphisms confer an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-898783
      provenance: internal
      claim: >-
        Interval kangaroo constants are a different object from scalar width.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two widths are frozen before the subtraction.
    - No scalar is recovered.
  proof_search_map:
    bottleneck: The width gap 1.
    baseline_embedding:
      parameter_slice: The widths 2 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 2 exceeds 1 by 1.
    observation_collision:
      observable: The width gap and the product.
      distinct_preimage_search: >-
        Reporting both scalars as width 1 drops the gap. Two generic
        scalars make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The one-component scalar.
        predicted_gain: One fewer written integer. No exponent.
    quantifier_order: >-
      The widths are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The width gap 1. Not a decomposition speedup.
      nearby_object_control: >-
        Two generic scalars. Both have width 1, and the gap is 0.
    proof_obligations:
      - claim: The two-component scalar has width 2.
        responsibility: size
      - claim: The generic scalar has width 1.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: width_gap
      direction: different
      minimum_effect: Two exceeds one by 1.
  minimal_test:
    design: >-
      Count written integers in the two frozen scalars. Do not run
      a decomposition.
    controls:
      - Two generic scalars, whose gap is 0.
      - An independent count.
    required_metrics:
      - both widths
      - the gap
      - the product
  falsification_conditions:
    - The gap is not 1.
    - The product of the two widths is not 2.
  confounders:
    - A sign bit on a component is an extra bit, not a second integer.
  interpretation_limits:
    - Width is not runtime.
    - No transfer to a cryptographic scalar.
    - This is not an orbit-size count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen two-component scalar writes two integers and the
        frozen generic scalar writes one.
      rigorous_support: >-
        No decomposition theorem is claimed. The count is a reading
        of two writings.
      validation_plan: >-
        Two independent counts. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Two integers versus one, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recombination of the two components.
    tradeoff_note: A second component can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
