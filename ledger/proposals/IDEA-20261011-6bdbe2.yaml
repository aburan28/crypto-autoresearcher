      Fixed-budget runs on frozen toy cells with an exact decomposition oracle (enumeration, no solver), three arms on identical partial streams: orbit-aware double-LP, sign-only double-LP, no-LP. Every canonicalisation, failed attempt and elimination step charged; each emitted relation replayed from its witness and checked on the curve; rank by incremental Gauss over Z/r. Report vertex-degree and cycle-weight census beside yield.
