  title: Orbit-aware double-large-prime relation graph on toy Koblitz cells - independent verified relation yield with +-lambda^k cycle coefficients against plain and no-large-prime controls
  class: composition
  claim: |-
    On toy Koblitz cells (E0 over F_{2^n}, n prime, 17 <= n <= 41, odd subgroup of prime order r), a double-large-prime relation graph whose large-prime vertices are quotiented by signed Frobenius orbits, with edge coefficients +-lambda^k mod r, yields more independent verified relations (rank over Z/r) per charged budget than (b) the same graph with sign-only canonicalisation and (c) direct relations with no large primes. Correctness condition: every recombined cycle cancels the actual large-prime group elements with the recorded coefficients, checked on the curve. Total charged cost is expected to stay above matched rho (H-BINSTD-555991).
  mechanism: |-
    OBJECT FRAME. R1. Tracked object: a partial relation (small-leg tuple in F, at most two large primes in F', coefficients). Sigma = cycle combination on the large-prime graph (GTTD) with canonicalisation under <pi, -1>. Class I partial-action. The label c(L) forgets phase and sign (a block system of <Sigma>, IDEA-20260901-863e36), lossy at the vertex, recovered by edge gains in <-lambda> (order 2n), so the graph is a gain graph. A cycle cancels its large primes only if balanced (gain product 1, about 1/(2n) for uniform gains); an unbalanced component needs a bicycle (theta or handcuff). Large-prime-free combinations then span dimension |E| - |V| + b, b = balanced components (frame matroid), at higher weight. Vertices shrink by about 2n, so relations should start with about 2n times fewer partials if residual orbits are uniform (a heuristic). Orbit combination holds only on the order-r part, not the 4r ambient. Priced number: canonicalisation cost per partial, charged. F2 and F6 are components; added: curve-verified recombination and rank measurement.
