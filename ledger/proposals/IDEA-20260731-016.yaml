idea:
  id: IDEA-20260731-016
  question_id: RQ-ECTD-001
  title: >-
    Semaev/Macaulay heavy-tail screen across an ordinary F_p isogeny class —
    search for a rare endpoint whose algebraic meters beat same-order neighbors
    by orders of magnitude
  class: measurement
  claim: >-
    In ordinary prime-field isogeny classes at toy sizes (bitlength of N in
    [40,60]), the per-curve distribution of Semaev relation density (m=3..6),
    factor-base decomposition probability, Gröbner solving degree / first-fall,
    and Macaulay rank-defect fingerprints is heavy-tailed: at least one curve
    E_s in a class of size >= 64 has a meter M(E_s) better than the class median
    by a factor >= 100 (or solving degree lower by >= 2) while sharing the same
    group order N. Null control: the same meters on random same-p curves outside
    the class and on degree-scrambled Semaev systems of matching shape show no
    such outlier. Falsified if, across >=5 enumerated classes, every curve lies
    within a factor-10 band of the class median on all primary meters (homogeneity
    consistent with H-ISO-001's short-neighbor negative, now at full-class scale).
  mechanism: >-
    Teske hides a GHS-weak endpoint behind an isogeny. Over F_p, order-based
    weaknesses are class invariants, so the only remaining Teske-shaped signal is
    an equation-dependent algebraic weakness (Semaev ideal / factor-base geometry /
    Macaulay syzygies) that varies inside the class. KN-LIT-7630 (Galbraith) and
    KN-LIT-237/7631 (JMV expanders) imply horizontal neighbors mix; outliers must
    be rare. This measurement asks whether any such rare endpoint exists at all
    before investing in trapdoor path-hiding. Distinct from H-ISO-001, which tested
    only short ell-neighbors for d_reg/yield and found none; distinct from
    IDEA-20260731-008, which charges public paths to class-invariant special
    families.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
      - ledger/proposals
      - ledger/H-ISO-001.yaml
      - knowledge/literature/KN-LIT-7261.md
      - knowledge/literature/KN-LIT-7630.md
    grep_results:
      - H-ISO-001 rejected_scoped on short-neighbor d_reg/yield only
      - IDEA-20260726-009 measures min|j| height, not Semaev meters
      - No ledger IDEA performs full-class Semaev heavy-tail screen for trapdoor endpoints
    conclusion: >-
      Adaptation of known Semaev meters to a trapdoor-endpoint search with
      explicit heavy-tail criterion; novelty unverified.
  assumptions:
    - Ordinary classes are fully enumerable at chosen toy sizes.
    - Isogeny degree coprime to N on measured edges so DL transports.
    - Meters are computed with fixed factor-base convention and solver budget.
  predictions:
    - metric: class_max_over_median_semaev_decomp_prob
      direction: higher
      minimum_effect: '>= 100 on >=1 of >=5 classes, or max d_reg <= median_d_reg - 2'
  minimal_test:
    design: >-
      Generate >=5 ordinary F_p classes with prime-order N in 40–56 bits and
      class size >=64 (prefer conductor structures with a moderate prime factor).
      Enumerate the class via ell in {2,3,5,7}. For each curve compute: End/conductor;
      Semaev m=3,4 relation density; FB decomposition probability; solving degree /
      first-fall under a fixed F4/GB budget; Macaulay rank defect at the first fall.
      Rank curves by each meter; report heavy-tail statistics and any outlier's
      distance to median. Cap claim_tier at toy.
    controls:
      - 'Null-object: random same-p curves outside the class with matched N when possible,
        else matched bit size — meters must not systematically match the putative outlier.'
      - 'Degree-profile null: random systems with the same multi-homogeneous degree
        profile and a planted solution — outlier advantage must exceed this null.'
      - Matched Pollard rho/BSGS cost on the same N (baseline, not expected to move).
    required_metrics:
      - per-curve meter vector and class median/IQR/max
      - outlier factor vs median
      - null-control comparisons
  falsification_conditions:
    - 'All >=5 classes are factor-10 homogeneous on every primary meter: no trapdoor
      endpoint signal at tested scale; proceed to barrier wording for family (1).'
    - 'Planted positive control (artificially easy Semaev instance on one curve) not
      recovered as outlier: instrument void.'
  confounders:
    - Solver timeouts misread as hardness (infra ≠ math; AGENTS.md rule 5).
    - Factor-base convention leaking curve equation structure.
    - Class-size bias: small classes overstate rarity.
  interpretation_limits:
    - Toy N only; a null at 56 bits does not prove crypto-scale homogeneity.
    - >-
      An outlier meter is not yet a trapdoor: path-hiding and public detection are
      separate IDEA/EXP stages.
  heuristic_assumptions:
    - id: HEUR-ECTD-TAIL-1
      statement: >-
        Conditional on End ring and N, Semaev/Macaulay meters behave like nearly
        exchangeable draws across the class except for a sparse endpoint set of
        relative density o(1/sqrt(class size)).
      rigorous_support: >-
        JMV expander mixing (KN-LIT-237) motivates near-uniformity on levels;
        no theorem forces Semaev meter constancy.
      validation_plan: >-
        Compare empirical meter CDFs within a class to a Gaussian/lognormal null
        fit; report KS distance and extreme-value exceedances.
  target_complexity:
    time_exponent: 'seeking empirical private exponent < 1/2 at toy N if outlier admits
      a full solve; otherwise measurement-only'
    memory_exponent: GB-scale Macaulay matrices at toy N
    best_known: Pollard rho at 1/2
    hidden_overhead: class enumeration and per-curve GB
    tradeoff_note: null
  dominated_by: >-
    Pollard rho for generic curves unless a certified sub-rho private solve on an
    outlier is exhibited; H-ISO-001 already dominates short-neighbor constant-factor hopes
  sota_delta: >-
    No exponent claim yet. Deliverable is a presence/absence measurement of
    class-internal Semaev heavy tails (orders-of-magnitude criterion), which
    neither H-ISO-001 nor IDEA-20260731-008 provides.
  estimated_cost:
    implementation: high
    compute: high
  recommended_priority: high
