      verified_by: idea-generator (this session, corpus record read in full; the underlying paper was NOT opened)
    - ref: 'Enge-Gaudry, Diem-Thome - index calculus for Jacobians of fixed-genus curves'
      provenance: recalled
      claim: >-
        Heuristic O~(q^{2-2/g}) for the DLP in Jac(C)(F_q) at fixed genus g, with double-large-
