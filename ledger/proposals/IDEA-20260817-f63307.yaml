      verified_by: idea-generator (this session, authored in this batch)
  preserved_for_successor: >-
    WHAT SURVIVES, AND IT IS NOT A PROPOSAL. The instinct to MEASURE this barrier rather than
    assert it is still live, and the reason is structural rather than a matter of taste:
    tools/obstruction_registry.py reports no obstruction blocks recorded across the entire
    program, and D3@0717b2 exists only as a BLACKLIST STRING. It has no quantity, no units, no
    error bars, and no claimed scope. Under docs/inventor-protocol.md section 4 that is a verdict,
    not a datum: it cannot be compared, re-scoped, or turned over by any later reader, which is
    precisely what the resource_check step exists to make possible.

    THE SPECIFIC DESIGN CONTENT WORTH CARRYING FORWARD, so an obstruction-recording task does not
    start from nothing:
    (i) THE QUANTITY. The relation-supply exponent s, fitted from cost = p^s over a sweep, per
        genus, reported against the matched rho exponent measured on the SAME instances -- not
        the aggregate cost, but its per-factor decomposition into decomposition probability,
        realised factor-base size, relations needed, and cost per relation, so the obstruction
        says WHERE the loss sits rather than only that it exists.
    (ii) THE SELF-FALSIFYING ARM, which is the part a barrier string cannot contain. Measure the
        decomposition rate of elements RESTRICTED TO THE IMAGE OF THE CONORM MAP against that of
        uniformly random Jacobian elements, in the same invocation and with the same routine. The
        barrier's whole mechanism is that relation collection is governed by the ambient order
        p^g and cannot see the order-n subgroup; that mechanism predicts the two rates are equal.
        A conorm-image rate materially above the uniform rate would refute the mechanism and
        reopen the lane with a witness. Any obstruction record for this barrier that omits this
        arm is asserting the mechanism rather than measuring it.
    (iii) THE INSTRUMENT CHECK. An extension-field contrast arm at matched group size, where the
        same machinery is known to WIN, labelled CONTRAST throughout and never used as prime-field
        evidence per KN-LIT-002's warning. Without it a prime-field null is uninterpretable.
    (iv) THE HONEST WEAK POINT. At 12-24 bits the fixed-genus asymptotic regime is barely visible
        and the linear-algebra term is not lower-order; the withdrawn record priced its own
        probability that an exponent claim would be legitimate at toy scale at 0.4, its lowest.
        An obstruction-recording task should expect to report per-size data with no exponent
        extrapolation, and that is still a first-class deliverable.
    THIS IS A NOTE FOR A SUCCESSOR TASK. It carries no experiment, no budget, no approval and no
    claim, and it does not license re-filing this record under a new identifier.
  target_complexity:
    time_exponent: >-
      WITHDRAWN, and unchanged in substance: the route being described has time exponent
      2 - 2/g >= 1 in p for g >= 2, against rho's 1/2. The record predicted its own route loses by
      at least a factor p^{1/2} and claimed no improvement of any kind. Nothing here is corrected;
      it is superseded on priority.
    memory_exponent: >-
      WITHDRAWN, unchanged: factor base plus relation matrix at p^{beta} with beta optimised near
      g/(g+1), so memory exponent >= 2/3 at g = 2 -- worse than rho's 0 and worse than BSGS's 1/2
      while also being slower. Dominated on both axes, as the record already stated.
    best_known: >-
      Pollard rho, n^{1/2+o(1)} time at O(1) memory; BSGS, n^{1/2} time at n^{1/2} memory;
      Shoup's Omega(sqrt n) generic lower bound. For the CONTRAST case, Gaudry's O~(q^{4/3}) over
      GF(q^3) and O~(q^{3/2}) over GF(q^4) or genus 2 over GF(q^2) per KN-LIT-002, which are
      extension-field figures and are not transferable.
    hidden_overhead: >-
      Moot under withdrawal, and recorded because a successor obstruction task needs it: the
      o(1) in q^{2-2/g} hides the divisor-reduction constant, which grows quickly in g; the
      large-prime variation's bookkeeping; and the sparse linear algebra, which at toy sizes is
      not lower-order at all. Absorbing these is exactly how a toy measurement comes to look like
      an asymptotic, and all three must be reported separately.
    tradeoff_note: >-
      Moot. The route occupies no useful point on the time-memory frontier, sitting at high time
      and high memory simultaneously. The incumbent frontier row remains van Oorschot-Wiener:
      wall clock n^{1/2}/m at memory w, total work n^{1/2}.
  dominated_by: >-
    SUPERSEDED IN SUBSTANCE by the internal barrier D3-Gaudry-fixed-genus-over-F-p-IC-cost-
    barrier-delimiting-the-RM-escape-B1@0717b2, which is a stronger disposition than Pareto
    domination and is why the record is withdrawn rather than ranked. On the attack axes the
    record's own row-by-row check stands unchanged and is not repeated in full: the route is
    dominated by Pollard rho (n^{1/2+o(1)} time, O(1) memory) and by BSGS (n^{1/2}, n^{1/2}) on
    BOTH time and memory, and by vOW parallel rho on total work; rows 4-8 and 10-12 of the
    twelve-row frontier were marked not-applicable with a reason each, and row 9 was marked not a
    dominating row. The record did not defer on any row.
  sota_delta: >-
    Zero, and it was always negative by design -- the withdrawn record predicted its own route
    loses by at least p^{0.50}, a factor 2^{128} at p ~ 2^256, with memory exponent >= 0.67
    against rho's 0. What is now also zero is the measurement contribution, because the
    measurement's conclusion is already held as D3@0717b2. The only residue is the successor note
    above: the barrier is held as a STRING with no quantity, units, error bars or scope, and
    converting it into an obstruction block with the self-falsifying conorm arm is worth doing in
    an obstruction-recording task rather than a proposal.
  estimated_cost:
