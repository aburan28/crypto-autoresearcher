idea:
  id: IDEA-20260817-f63307
  question_id: RQ-ECDLP-002
  added: '2026-08-17'
  title: >-
    WITHDRAWN AS A CONFIRMED DUPLICATE: the same-field genus-g cover transfer inequality
    re-derives a barrier the program already holds as
    D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-delimiting-the-RM-escape-B1@0717b2 --
    withdrawn for duplication, NOT for error, and the instinct to MEASURE that barrier rather
    than assert it survives and is routed to an obstruction-recording task
  class: representation
  status: withdrawn
  withdrawn_at: '2026-08-17'
  withdrawn_by: coordinator-semantic-screen (confirming the author's own novelty_screen flag)
  claim: >-
    WITHDRAWN. The original claim was: for E/F_p ordinary with #E(F_p) = n prime, every transfer
    of the ECDLP into the Jacobian of a genus-g curve C/F_p carrying a nonconstant F_p-morphism
    C -> E raises the ambient group order from p to p^{g+o(1)} while the target subgroup stays at
    n ~ p, so relation collection is governed by the ambient order and costs O~(p^{2-2/g}) >= p^1
    for every g >= 2, against rho's p^{1/2} -- a structural loss of at least a factor p^{1/2},
    uniform in g. That claim is NOT withdrawn as wrong. It is withdrawn because the program
    already holds it as a recorded barrier.
  mechanism: >-
    THE WITHDRAWAL, AND WHO CALLED IT. This record's own novelty_screen flagged the collision
    before any semantic screen ran, in these terms: "MATERIAL OVERLAP FOUND AND FLAGGED... the
    blacklist pair B1-Kani-torsion-glued-genus-2-Jacobian-with-real-multiplication-
    REPRESENTATION-CANDIDATE@0717b2 and D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-
    delimiting-the-RM-escape-B1@0717b2... appears to state, as a barrier, roughly what this
    record proposes to MEASURE. If the semantic screen finds the measurement already run, this
    record should be withdrawn rather than filed." It also carried the batch's only explicit
    self-assessment as "the WEAKEST of the five" and the batch's highest declared prior-art risk.
    The coordinator's semantic screen against the 48,428-point crypto-kb index subsequently
    confirmed that flag and resolved the blacklist string in full. The withdrawal is therefore a
    confirmation of the author's own call, not an external correction of it.

    WHY THE BLACKLIST STRING IS A BARRIER AND NOT A PROPOSAL. In outputs/_blacklist_compact.txt
    the D-class entries in each batch are barrier / no-go results, paired against the A-, B- and
    C-class candidates they close. The reading is legible from their own names:
    D1-Nilpotent-lift-no-rank-gain-theorem, D2-Correspondence-permutation-no-gain-theorem,
    D3-Separator-rank-lower-bound-for-S3-membership. D3@0717b2 is of that class and is explicitly
    scoped as "delimiting the RM escape B1", i.e. it is the recorded no-go that closes the
    Kani-glued genus-2 real-multiplication representation candidate sitting beside it. The
    same-field cover argument this record built is that no-go, re-derived.

    WHY THIS IS A DUPLICATION WITHDRAWAL AND NOT AN ERROR WITHDRAWAL, WHICH MATTERS FOR HOW THE
    RECORD IS READ LATER. The record did not overclaim. Its dominated_by named Pollard rho and
    BSGS as dominating it on BOTH axes and marked the route dominated rather than deferring. Its
    sota_delta was stated as NEGATIVE AND QUANTIFIED -- a predicted loss of at least p^{0.50},
    a factor 2^{128} at p ~ 2^256, with a memory exponent of at least 0.67 against rho's 0. Its
    target_complexity said in terms: "THE RECORD PREDICTS ITS OWN ROUTE LOSES... the best case
    for this record is a measured obstruction, not a speedup." Nothing in it needs correcting.
    What it lacked was priority.

    WHY IT IS NOT DELETED. Deleting it would discard the screen result and let a later session
    re-derive the same barrier from scratch, which is the failure mode the withdrawal record for
    IDEA-20260817-4c6519 exists to prevent and the reason the same disposition is used here. It
    is also why it may not remain `status: proposed`: a confirmed duplicate sitting in the corpus
    as a live proposal is a candidate for /design-experiment, and filing it as one would put
    compute behind a barrier the program already holds.
  novelty_status: unverified
  novelty_screen:
    method: >-
      TWO SCREENS. (1) This session's textual screen, which produced the flag that this
      withdrawal confirms: full reads of knowledge/literature/KN-LIT-002.md,
      knowledge/findings/KN-FIND-5c1a03.md, knowledge/open-problems/KN-OPEN-019.md,
      ledger/questions/RQ-ECDLP-002.yaml and outputs/_blacklist_compact.txt, plus one web search
      ("elliptic curve discrete logarithm prime field new algorithm 2025 2026 index calculus")
      whose result summary stated that index calculus algorithms exist for extension fields while
      prime-field curves "have so far appeared immune" -- the underlying papers were NOT opened.
      (2) A SEMANTIC SCREEN RUN BY THE COORDINATOR SESSION against the 48,428-point crypto-kb
      index, a 2026-08-13 lineage snapshot.
    results: >-
      The textual screen flagged D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-delimiting-the-
      RM-escape-B1@0717b2 and its paired candidate B1-Kani-torsion-glued-genus-2-Jacobian-with-
      real-multiplication@0717b2 as the nearest prior art, named IDEA-002
      "Split-Jacobian-projected-smoothness" as also adjacent, and recorded the disposition in
      advance: withdraw rather than file if the overlap resolves against the record. The
      coordinator's semantic screen resolved the D3 string in full and confirmed it is a
      barrier-class entry closing the same lane. Consistent with that, the record's own
      dominated_by and sota_delta already placed the route strictly outside the rho and BSGS
      frontier on both axes.
    staleness_caveat: >-
      The index queried is a 2026-08-13 lineage snapshot, four days stale, and does not contain
      records created today, including the other records in this batch. ABSENCE OF A HIT IN IT IS
      NOT EVIDENCE OF ABSENCE, and no novelty_status above `unverified` is claimed anywhere in
      this batch on the strength of it. In this record the screen produced a POSITIVE hit
      confirming an existing flag, which is the direction the instrument can be trusted in.
    verdict: >-
      UNVERIFIED as to external literature -- the recalled Enge-Gaudry / Diem-Thome exponents
      were never verified against a primary source, and KN-LIT-002's own note records that its
      full PDF was not read. SUPERSEDED IN SUBSTANCE by the internal barrier record
      D3@0717b2. Withdrawn.
  citations:
    - ref: 'outputs/_blacklist_compact.txt, entry D3-Gaudry-fixed-genus-over-F-p-IC-cost-barrier-delimiting-the-RM-escape-B1@0717b2'
      provenance: internal
      claim: >-
        The recorded barrier closing same-field fixed-genus index-calculus cover transfers over
        F_p, scoped as delimiting the paired Kani-glued real-multiplication representation
