    - >-
      F2 (BLOCKING). The a = 2 slice fails to reproduce EXP-RHO-60da4f within
      its declared band. Every a > 2 number is INVALID; this is an
      instrument/infrastructure outcome under AGENTS.md rule 5 and is never
