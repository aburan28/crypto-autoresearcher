    - >-
      F3. The phi-withheld arm on the j = 0 curve does not return ratio 1.0.
      The measurement is confounded by curve arithmetic and every c_6 is void.
    - >-
      F4. Measured c_6 at or above sqrt(3). The quotient walk would be beating
      its own birthday bound; halt, treat as instrument fault, and do NOT report
      it as an excess. Only if the fault is excluded by independent
      re-implementation does GOAL-ENDO-001 pause condition P3 apply.
    - >-
      F5 (THE MAIN NEGATIVE, AND IT IS THE INTENDED DELIVERABLE). c_6 comes out
      close to sqrt(3), i.e. the escape overhead is small and only DEFECT 1
      matters. Then the lane's blind band is exactly the factor sqrt(2) of the
      double count, the corrected threshold is sqrt(3) = 1.732, and the
      measurement has converted an unvalidated number into a measured one. This
      is an archivable deliverable and it must be recorded with the successor
      named: the same measurement at cryptographic sizes is NOT possible, so the
      successor is a size-scaling check, not a scale-up.
    - >-
      F6. c_6 comes out near 1.0, i.e. the automorphism discount is essentially
      consumed by cycle escape at a = 6. Then the lane's threshold is wrong by a
      factor up to 2.4, the blind band is nearly the whole discount, and every
      prior and future j = 0 comparison in GOAL-ENDO-001 must be re-read against
      the corrected number. This is the higher-information outcome and it is the
      reason to run the experiment.
    - >-
      F7. Budget exhaustion at the largest size. Budget event under AGENTS.md
      rule 5, reported as such; the largest size is dropped and the
      size-independence claim is withdrawn, not weakened silently.

  confounders:
    - >-
      THE j = 0 CURVE HAS CHEAPER ARITHMETIC. With a = 0 in y^2 = x^3 + ax + b,
      point addition and doubling save field multiplications for reasons
      unrelated to Aut. Comparing j = 0 against a generic curve therefore
      measures arithmetic plus automorphism. THE PHI-WITHHELD ARM IS THE ONLY
      ADMISSIBLE DENOMINATOR and this is stated as a design rule, not a caveat.
    - >-
      THE ESCAPE-RULE GRID WAS DESIGNED FOR a = 2. Transplanting it to a = 6
      without re-specification would measure a badly chosen rule and understate
      c_6. Step 3's re-specification is mandatory and its rejections are
      reported.
    - >-
      SUPERSINGULARITY TRAP. j = 0 with p = 2 mod 3 and j = 1728 with
      p = 3 mod 4 are supersingular; the extra automorphism is not F_p-rational
      outside the stated congruences. A run that silently picks such a p is
      measuring a different object.
    - >-
      DISTINGUISHED-POINT SEMANTICS. Canonicalisation changes the input to the
      DP test, so the DP hit rate can differ between arms and shift the constant
      for reasons unrelated to cycles. Reported per arm.
    - >-
      A CONSTANT IS NOT AN EXPONENT. No number from this record may be cited
      toward any exponent or any attack claim, and the record says so in its own
      interpretation limits so that a downstream summary cannot quietly promote
      it.

