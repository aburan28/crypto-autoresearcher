      GOAL-ENDO-001 pause condition P2 is not triggered.

  target_complexity:
    time_exponent: >-
      UNCHANGED AT 1/2 AND NO EXPONENT IS CLAIMED OR MOVED. The quantity
      measured is the constant in front of sqrt(N): the baseline is
      0.886*sqrt(N) group operations including negation (KN-TECH-006), the ideal
      automorphism-discounted form is 0.886*sqrt(N)/sqrt(a/2), and the realised
      form is 0.886*sqrt(N)/c_a with c_a <= sqrt(a/2) measured here. Since
      a <= 6 over F_p, c_a <= sqrt(3) = 1.732 always, so the maximum possible
      effect of everything in this record is a factor 1.732.
    memory_exponent: >-
      O(1) for the walk itself; the distinguished-point store is the
      van Oorschot-Wiener parameter w and is unchanged by quotienting except
      that entries are class labels rather than points, saving log2(a) <= 2.58
      bits per entry - a bit-level saving that is reported and never converted
      into a claimed speedup.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886*sqrt(N) group
      operations, O(1) memory per processor (KN-TECH-001, KN-TECH-006);
      automorphism-discounted variant at most sqrt(|Aut|) better, i.e. at most
      sqrt(6) against an un-discounted baseline and at most sqrt(3) against the
      program's stated one (KN-TECH-018); BSGS at sqrt(N) time and memory with
      full cost N^{2/3+o(1)} (KN-TECH-031); van Oorschot-Wiener at
      sqrt(N^3/w) with memory w. Generic lower bound Omega(sqrt(N))
      (KN-TECH-005).
    hidden_overhead: >-
      Disclosed. (a) c_a is measured at 2^32-2^48 and the extrapolation to
      cryptographic N is NOT made; the size-independence check is the only
      evidence offered and it covers a factor 2^16 in N, not 2^200.
      (b) The escape-rule grid is finite and H2 says its optimum may not be
      near the true optimum, so the reported c_6 is a LOWER bound on the
      realisable constant whenever H2's gap test fails. (c) The cost unit is
      F_p multiplications on one declared platform; conversion factors for
      squarings and inversions are measured per platform and are not universal.
    tradeoff_note: >-
      The escape rule is itself a time-versus-correctness dial and the charged
      cost is U-shaped in its aggressiveness; the sign-change locus where net
      gain crosses 1.0 is the deliverable that locates it. Parallelisation is
      unchanged: the quotient walk parallelises exactly as van Oorschot-Wiener
      does, since canonicalisation is per-processor local work and the DP store
      is shared; this is stated so that a later cost accounting uses the
      parallel form rather than the serial one.

  dominated_by: >-
    AS AN ATTACK: none is claimed, and the Pareto check is done row by row.
    TIME - parallel rho at 0.886*sqrt(N) (KN-TECH-001, KN-TECH-006) dominates;
    this record measures a constant that is at most 1.732 and is itself part of
    that row. MEMORY - rho at O(1) dominates. DATA/QUERIES - no advantage in any
    query model. CM-SPECIFIC - the automorphism-discounted rho of KN-TECH-018 IS
    the row being measured; nothing here beats it, by construction, since the
    ideal ceiling bounds the measured quantity. MEMORY-RICH - BSGS
    (KN-TECH-031) and van Oorschot-Wiener at sqrt(N^3/w) dominate their own
    axes and gain nothing from automorphisms (KN-TECH-031), which is why the
    correction applies to the rho row only. GENERIC LOWER BOUND - Shoup's
    Omega(sqrt(N)) (KN-TECH-005) is untouched. Every row checked; NOT null.
    AS A MEASUREMENT: dominated by EXP-RHO-60da4f on the a = 2 row, which is why
    that contract is the blocking baseline rather than a competitor. On the
    a in {4, 6} rows nothing in this repository dominates it because nothing
    measures them. Externally UNKNOWN AND STATED AS UNKNOWN: no external source
    was reachable this session, and it is entirely possible the charged
    a = 6 constant is published.
  sota_delta: >-
    Zero speedup; no attack; no exponent. Quantitative deltas, all internal to
    this program's own decision machinery: (i) corrects RQ-JINV-8fc13a's stated
    calibration threshold from 2.4495 to 1.7321 at j = 0 and from 2.0 to 1.4142
