  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR COSTS ZERO COMPUTE AND IS STEP 0. The
      program's own baseline convention (KN-TECH-006, KN-TECH-018) already fixes
      the answer to DEFECT 1: since 0.886*sqrt(N) includes sqrt(2), the extra
      discount at j = 0 is sqrt(6)/sqrt(2) = sqrt(3). Writing that down, with
      its provenance, corrects the lane's threshold by a factor sqrt(2) and
      requires no run at all. It is a derivation, and it discriminates sharply:
      either the baseline convention includes negation, in which case the
      threshold is sqrt(3), or it does not, in which case KN-TECH-006 and
      KN-TECH-018 are both wrong and that is a larger finding.
      THE CHEAPEST EMPIRICAL DISCRIMINATOR IS THE PHI-WITHHELD PAIR AT ONE SIZE:
      on one frozen j = 0 curve at 2^32, run the un-quotiented walk and the
      |Aut| = 6 quotient walk under ONE escape rule, in field multiplications.
      That single pair yields c_6 to within its band and is enough to decide
      whether the blind band is narrow (c_6 near sqrt(3), so the lane loses only
      the sqrt(2) of DEFECT 1) or wide (c_6 near 1, so the automorphism discount
      is essentially consumed by escape and the lane's threshold is off by a
      factor 2.4). Hours, not days. The full grid, the second size and the
      a = 4 family are corroboration and refinement.
    controls:
      - >-
        C1 BASELINE REPRODUCTION, BLOCKING: EXP-RHO-60da4f's a = 2 numbers in
        this harness, both the 0.886 convention and the 1/(2r) cycle rate.
      - >-
        C2 PHI-WITHHELD ARM, BLOCKING: the un-quotiented walk on the SAME j = 0
        curve, which must give ratio 1.0 and is the only admissible denominator
        for c_6.
      - >-
        C3 NO-ESCAPE POSITIVE CONTROL: the quotient walk with cycle detection
        disabled, which must be absorbed into a cycle and must show a
        catastrophic charged cost. If it does not, the walk is not really
        quotienting and every number is void. (This mirrors EXP-RHO-60da4f's own
        C3 and is inherited deliberately.)
      - >-
        C4 RANDOM-ORACLE WALK: a walk driven by a keyed hash into the group,
        realising the ideal random-map constant by construction. Any arm beating
        it by more than the derived band falsifies the measurement rather than
        the band.
      - >-
        C5 j = 1728 ARM as a second, independent value of a. The instrument must
        produce THREE distinct constants at a = 2, 4, 6, which is a far stronger
        test than a single comparison.
      - >-
        DECAY PARAMETER - a itself, swept over {2, 4, 6}. The realised gain must
        INCREASE with a (more classes, larger birthday saving) while the cycle
        rate must ALSO increase with a. If the realised gain does not increase
        with a at all, the quotient is not delivering its birthday saving and
        the interpretation is an implementation defect rather than a finding.
      - >-
        SECOND DECAY PARAMETER - the escape-rule aggressiveness (e.g. the
        periodic-check period k). Charged cost must be U-shaped in k: too rare
        and cycles dominate, too frequent and checking dominates. A monotone
        curve in k means one of the two costs is not being charged.
    required_metrics:
      - total F_p multiplications to solve, with squarings and inversions split
      - per-step cycle entry rate and full cycle-length spectrum, per (a, r)
      - per-step escape cost in multiplications
      - DP hit rate per arm
      - c_a per (a, escape rule, r, DP bits, size), with bands
      - the max-over-grid c_6 and c_4, i.e. the corrected thresholds
      - memoryless-filter rejection counts
      - pass/fail of C1-C5

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE). DEFECT 1 is wrong because KN-TECH-006's convention does
      NOT include the sqrt(2) negation factor. Then the lane's sqrt(6) threshold
      is correct as stated, Step 0's deliverable is withdrawn, and the
      discrepancy between KN-TECH-006's text and its use is itself a finding to
