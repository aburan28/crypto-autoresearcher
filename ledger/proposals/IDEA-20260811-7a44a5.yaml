idea:
  id: IDEA-20260811-7a44a5
  question_id: RQ-JINV-8fc13a
  added: '2026-08-11'
  title: >-
    THE LANE'S OWN YARDSTICK IS UNMEASURED AND DOUBLE-COUNTED: RQ-JINV-8fc13a's
    decision_target and GOAL-ENDO-001 pause condition P3 both use sqrt(6) as the
    calibration threshold, but the program's baseline convention 0.886*sqrt(N)
    ALREADY contains the sqrt(2) negation factor, so the EXTRA j = 0 discount is
    sqrt(3) = 1.732; and the REALISED constant at |Aut| in {4, 6} has never been
    measured in this program because H-RHO-bc6ea6 and EXP-RHO-60da4f explicitly
    exclude j in {0, 1728} - the two errors point the SAME way, so the lane's
    threshold can only be too generous and its blind band is everything between
    the realised constant and 2.449
  class: measurement

  claim: >-
    (A) THE TWO DEFECTS, STATED SEPARATELY BECAUSE THEY HAVE DIFFERENT FIXES.
      DEFECT 1 - DOUBLE COUNTING, ZERO COMPUTE TO ESTABLISH. RQ-JINV-8fc13a's
        decision_target reads "a constant factor at or below sqrt(6) is baseline
        calibration and is recorded as such, never as an attack", and
        GOAL-ENDO-001 pause condition P3 fires only when a candidate "appears to
        exceed the automorphism-discounted rho baseline". But KN-TECH-006's
        convention, restated in KN-TECH-018, is that the baseline 0.886*sqrt(N)
        ALREADY INCLUDES THE sqrt(2) FROM NEGATION. Measured against that
        baseline the additional discount available at j = 0 is
        sqrt(6)/sqrt(2) = sqrt(3) = 1.7321, and at j = 1728 it is
        sqrt(4)/sqrt(2) = sqrt(2) = 1.4142. IDEA-20260807-f00729 records exactly
        this in its confounders list ("quoting sqrt(6) against an
        already-negation-discounted baseline would double-count") and no record
        in the lane carries the corrected threshold forward into a decision
        rule. So the lane's stated threshold is larger than its own baseline
        convention supports by a factor sqrt(2).
      DEFECT 2 - THE REALISED CONSTANT IS UNMEASURED AT r > 1. sqrt(|Aut|) is
        the IDEAL birthday saving from walking on N/|Aut| classes. A real
        equivalence-class walk pays for it in fruitless cycles: the walk can
        enter a short cycle among class representatives and must detect and
        escape, and the escape rule costs field multiplications per step.
        H-RHO-bc6ea6 and its approved contract EXP-RHO-60da4f measure exactly
        this - "the fully charged net gain of the negation-quotient Pollard rho
        walk as a function of the fruitless-cycle escape rule" - but their
        inputs specification pins "Aut(E) = {+-1}, and j not in {0, 1728}".
        IDEA-20260807-f00729's forward guidance item G3 names the resulting gap
        in terms: "THE FRUITLESS-CYCLE STRUCTURE AT r > 1 IS UNMEASURED IN THIS
        PROGRAM ... its escape cost could eat a materially larger share of the
        sqrt(6) ... it could make the j=0 discount SMALLER than sqrt(6) rather
        than larger." No record fills it.

    (B) THE TWO DEFECTS POINT THE SAME WAY, AND THAT IS WHY THIS MATTERS RATHER
    THAN BEING BOOKKEEPING. The ideal ceiling sqrt(|Aut|) is an UPPER bound on
    what a quotient walk can realise; cycle-escape overhead can only reduce it.
    So the realised extra discount c_a at |Aut| = a satisfies
        c_a <= sqrt(a/2)  (measured against the negation-discounted baseline),
    with equality only if escape is free. The lane's threshold is 2.449.
    Therefore EVERY candidate mechanism producing a measured factor anywhere in
    the interval ( c_6 , 2.449 ] is currently classified as BASELINE
    CALIBRATION when it in fact EXCEEDS the best realisable automorphism
    discount. That interval is the lane's blind band, its width is unknown
    because c_6 has never been measured, and a false negative in it is exactly
    the failure mode AGENTS.md rule 9 and docs/inventor-protocol.md section 4
    are written against. THE DEFECT IS ONE-SIDED: it can only cause the lane to
    miss something, never to overclaim.

    (C) WHAT IS MEASURED, AND IT IS A NUMBER PER CURVE FAMILY, NOT AN OPINION.
    In F_p multiplications, with squarings and inversions counted separately at
    their measured ratios (the EXP-RHO-60da4f cost unit, so the two contracts
    are commensurable and no number is reported in "group operations"), measure
    the fully charged cost of an |Aut|-quotient rho walk at a in {2, 4, 6}
    against the same un-quotiented Teske r-adding baseline in the same harness,
    over the same enumerated grid of fruitless-cycle escape rules, at three
    subgroup sizes. The deliverable is the table
        c_a(escape rule, r, DP bits, size)  for a in {2, 4, 6},
    together with the sign-change locus where the net gain crosses 1.0, and the
    single derived number the lane actually needs: the LARGEST realised c_6 over
    the admissible escape rules, which is the corrected calibration threshold
    for RQ-JINV-8fc13a.

    (D) THE CYCLE-RATE PREDICTION, PRE-REGISTERED WITH A FORMULA THAT
    REPRODUCES THE KNOWN CASE. EXP-RHO-60da4f pre-registers a per-step
    fruitless-cycle rate of 1/(2r) for the negation quotient with an r-adding
    walk. The natural generalisation to a quotient by a cyclic group of order a
    is
        rate_a(r) = (a - 1) / (a * r),
    which at a = 2 returns 1/(2r) exactly, reproducing the pre-registered
    negation case as a parameter slice, and which predicts
        rate_4 = 3/(4r) = 1.5 * rate_2,   rate_6 = 5/(6r) = 1.667 * rate_2.
    THE FORMULA IS A PREDICTION, NOT AN ASSUMPTION: it is derived on the model
    that a cycle is entered when the branch function returns the same index on
    the successor class AND the canonical representative is not the one that
    continues, the second event having probability (a-1)/a for a free action.
    A measured rate_6/rate_2 ratio outside [1.3, 2.0] falsifies the model and
    the run reports the measured rates and withdraws the formula rather than
    fitting to it.

    (E) WHAT IS NOT CLAIMED. No attack. No exponent. sota_delta ZERO on every
    axis: this record's entire output is a CORRECTION TO A THRESHOLD, and it is
    filed as an explicitly constant-factor building block under
    docs/target-result-profile.md's own rule that such work is not target-class.
    Its justification for priority is that it gates the lane's decision rule and
    the goal's pause condition, so every future j-invariant result is compared
    against a number this record supplies, and the number is currently both
    unmeasured and demonstrably mis-derived.

  resource_label: >-
    R2 (the curve equation and model) via Aut(E), consumed as a walk-level
    equivalence and nothing more. No endomorphism is applied to a point of G
    beyond the automorphisms themselves, so H-ENDO-001's scalar argument is not
    circumvented and is not needed.

  admissibility: admissible
  admissibility_argument: >-
    The measurement calibrates an already-known and already-recorded discount
    (KN-TECH-018). It invents no oracle, so RQ-GGMB-6eaabc's simulability audit
    (criterion C3) applies vacuously and the record says so explicitly rather
    than leaving the C3 obligation ambiguous: the object measured is the
    published automorphism-quotient walk, which is generic-group-simulable and
    is CLOSED at exponent 1/2 by KN-FIND-b7e091 and KN-TECH-005 - which is
    precisely why nothing here can be an attack and why the deliverable is a
    constant.

  discriminated_from:
    - >-
      H-RHO-bc6ea6 / EXP-RHO-60da4f (status approved), which measure the fully
      charged negation-quotient walk against escape rules. Those records are the
      INSTRUMENT this proposal reuses and the BASELINE it must reproduce; their
      inputs block excludes j in {0, 1728} by construction, so they cannot
      answer the question at a > 2. This proposal changes exactly one input -
      the curve family - and adds the a-dependence of the escape rule. Running
      it without first reproducing EXP-RHO-60da4f's a = 2 numbers in the same
      harness is inadmissible.
    - >-
      IDEA-20260807-f00729 (this lane), whose forward guidance G3 names this gap
      and whose confounders name the sqrt(2) double count. That record is a
      closure argument about the orbit map's non-homomorphism and measures no
      constant; it says in terms that "the constants themselves are not
      established by this record". This proposal establishes one of them.
    - >-
      IDEA-20260807-5ddccf (this lane), the |Aut| scaling law across three curve
      families. That record asks whether the IDEAL sqrt(|Aut|) scaling appears
      across families; this one asks what is left of it after the escape rule is
      charged, in field multiplications, and delivers a decision threshold
      rather than a scaling exponent. If 5ddccf runs first this becomes its
      charged counterpart; neither contains the other, and pooling their numbers
      would be a category error because they are in different cost units.
    - >-
      KN-TECH-018, which records sqrt(|Aut|) and notes in its applicability
      limits that "negation walks require fruitless-cycle handling" without
      quantifying it at any a. This proposal supplies the quantification and, if
      it succeeds, the technique entry should be superseded with the charged
      table rather than edited.
    - >-
      H-JINV-5a0b9e's |Aut| arm (P6), which compares a single j = 0 crater
      vertex against its class floor on RELATION-DENSITY statistics and states
      that a ratio at or below sqrt(6) is baseline calibration. That arm INHERITS
      the threshold this record corrects. The two must not be pooled: 5a0b9e
      measures decomposition statistics on 37 curves at N = 19507, this measures
      walk cost in field multiplications at three subgroup sizes.

  object_first_candidate:
    tracked_object: >-
      THE WALK STATE AS AN Aut-CLASS TOGETHER WITH ITS ESCAPE HISTORY-FREE
      REPRESENTATIVE RULE - i.e. the pair (class, canonicalisation rule), where
      the rule is a function of the current class only.
    lossiness: >-
      LOSSY: the class discards log2(a) bits. The memorylessness filter
      inherited from EXP-RHO-60da4f is what keeps it lossy in the usable sense -
      an escape rule that consults walk history restores the discarded
      information and breaks distinguished-point collision semantics, which is
      why such rules are rejected before measurement and the rejection count is
      reported.
    propagation: >-
      The class propagates deterministically under the walk step by
      construction, because the step is computed on E and only the state is
      projected (IDEA-20260807-f00729 B1). It does NOT propagate through
      addition of two classes, which is f00729's closure and is the reason this
      record measures a constant and cannot measure anything else.
    survival_score: >-
      NOT genuinely new as an object - it is the published automorphism-quotient
      walk. CONCRETELY TESTABLE - its per-step cycle rate and its charged cost
      are both directly measurable in a declared unit. SURVIVES exactly as long
      as the walk runs and dies at the first attempt to add two classes. Filed
      as a calibration building block on that basis, not as a new object.

  mechanism: >-
    STEP 0 (ZERO COMPUTE - DELIVERABLE 1, AND IT IS INDEPENDENT OF EVERY
    MEASUREMENT). Write the threshold derivation: baseline convention
    0.886*sqrt(N) includes sqrt(2); ideal ceilings sqrt(2), 2, sqrt(6) at
    a = 2, 4, 6; extra discounts against the stated baseline 1, sqrt(2),
    sqrt(3). Deliver the corrected threshold table with its provenance. This
    alone repairs DEFECT 1 and needs no run.

    STEP 1 (BASELINE REPRODUCTION, BLOCKING). In the same harness and the same
    unit as EXP-RHO-60da4f, reproduce that contract's a = 2 control C1 - the
    un-quotiented Teske r = 20 adding walk against the 0.886*sqrt(n) convention
    within its declared band - and its measured negation-quotient net gain at
    at least one escape rule and one size. If the a = 2 numbers are not
    reproduced, the a in {4, 6} numbers are void. NOTHING IN THIS PROPOSAL MAY
    BE INTERPRETED WITHOUT THIS STEP.

    STEP 2 (CURVE CONSTRUCTION AND ITS TRAP). Construct, per subgroup size,
    three frozen curves: (i) a j = 0 curve over F_p with p = 1 mod 3 and a
    prime-order subgroup, so that zeta_3 is F_p-rational and |Aut| = 6;
    (ii) a j = 1728 curve over F_p with p = 1 mod 4, |Aut| = 4;
    (iii) a matched generic curve with |Aut| = 2. THE TRAP, STATED IN ADVANCE:
    a j = 0 curve with p = 2 mod 3 is SUPERSINGULAR and a j = 1728 curve with
    p = 3 mod 4 is supersingular; the extra automorphism is F_p-rational only in
    the stated congruence classes. Curve parameters, point counts, generators
    and the explicit automorphism (given by (x, y) -> (zeta_3 x, y) and
    (x, y) -> (-x, i y)) are frozen into the specification directory before any
    run and are never regenerated.

    STEP 3 (THE ESCAPE-RULE GRID AT a > 2, WHICH IS NOT A COPY OF THE a = 2
    GRID). EXP-RHO-60da4f's rules were designed for a two-element class. At
    a = 6 a class has six elements and short cycles of length dividing 6 are
    available, so each rule must be RE-SPECIFIED and the re-specification
    recorded: (a) deterministic representative break, now over a > 2 choices;
    (b) periodic check every k steps; (c) lookahead multi-step, which must now
    look ahead against a-1 alternatives rather than one; (d) branch reselect.
    Every rule must pass the same memorylessness filter and the rejections are
    reported. A rule that has no a > 2 analogue is recorded as such rather than
    approximated.

    STEP 4 (MEASUREMENT). For each (curve family a, escape rule, r, DP bits,
    size): total F_p multiplications to solve, per-step cycle entry rate,
    per-step escape cost, and the net gain against the matched un-quotiented
    baseline. Report the realised c_a and the escape rule attaining it. Report
    the sign-change locus in the escape-rule parameter where net gain crosses
    1.0, per a.

    STEP 5 (DELIVERABLE 2 - THE CORRECTED DECISION THRESHOLD). Emit
      threshold_JINV = max over admissible escape rules of c_6,
    with its measurement band, its cost unit, and the explicit statement that it
    is a toy-scale measurement at the tested sizes and that the ideal ceiling
    sqrt(3) remains the theoretical bound. Emit the same for a = 4. Do NOT edit
    RQ-JINV-8fc13a or the goal record - that is the Coordinator's authority; the
    deliverable is the number and its provenance.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Run 2026-08-11 from the repository root of this worktree.
      (1) mcp crypto-kb search_knowledge: UNAVAILABLE (index configured :memory:
          and empty, verified by the orchestrating session). No retrieval result
          exists and its absence is not evidence (AGENTS.md).
      (2) WebSearch and WebFetch: BOTH FAILED with a backend model error on
          every attempt this session. NO EXTERNAL LITERATURE WAS CHECKED.
      (3) grep -ril "fruitless|negation map|Duursma|Gaudry-Morain|equivalence
          class walk" over the repository -> 160 files; KN-TECH-018 read in
          full, experiments/EXP-RHO-60da4f/specification.yaml read (first 80
          lines), IDEA-20260807-f00729 read in full.
      (4) grep of ledger/proposals/ for question_id RQ-JINV-8fc13a -> 19 files,
          titles and claims read.
    results: >-
      EXP-RHO-60da4f exists, is approved, measures exactly this quantity at
      a = 2, and pins its curves to "Aut(E) = {+-1}, and j not in {0, 1728}",
      with a pre-registered per-step cycle rate of 1/(2r) and a declared
      escape-rule grid, cost unit and memorylessness filter. KN-TECH-018 notes
      that negation walks require fruitless-cycle handling and quantifies
      nothing. IDEA-20260807-f00729 names the a > 2 gap as forward guidance G3
      and the sqrt(2) double count as a confounder. NO RECORD FOUND CARRIES A
      CHARGED CONSTANT AT a > 2 OR A CORRECTED DECISION THRESHOLD.
    verdict: >-
      UNVERIFIED, and specifically an ADAPTATION of an existing approved
      contract to a curve family that contract excludes. Nothing here is claimed
      as new against the external literature; the equivalence-class speedup and
      its cycle problem are published (Wiener-Zuccherato; Duursma-Gaudry-Morain
      for order-m automorphisms; the negation-map cycle analyses of
      Bos-Kleinjung-Niederhagen-Schwabe and Bernstein-Lange-Schwabe - ALL CITED
      FROM MEMORY AND NONE RE-VERIFIED THIS SESSION, since no external source
      was reachable). It is entirely possible that the a in {4, 6} charged
      constant is published, in which case this proposal should be replaced by a
      literature note and a single confirmation run.
    external_check_that_would_settle_it: >-
      NAMED PRECISELY. (1) Duursma, Gaudry and Morain, "Speeding up the discrete
      log computation on curves with automorphisms" (ASIACRYPT 1999) - does it
      report the CHARGED speedup for automorphism groups of order 4 and 6,
      including cycle handling, or only the ideal sqrt(m)? (2) Bos, Kleinjung,
      Niederhagen and Schwabe, and separately Bernstein, Lange and Schwabe, on
      the negation map in Pollard rho (PKC 2011 and related) - do they treat
      |Aut| > 2, and what per-step cycle rate do they report? (3) Gallant,
      Lambert and Vanstone (Math. Comp. 2000) for the Koblitz-curve analogue
      with Frobenius classes of size 2m. (4) The Galbraith-Gaudry survey
      "Recent progress on the ECDLP" (DCC 2016), equivalence-class section, for
      whether a charged constant at |Aut| = 6 is already tabulated. If (1) or
      (2) already contains the charged a = 6 constant, novelty_status becomes
      `known`, the measurement collapses to a confirmation, and only DEFECT 1
      (the sqrt(2) double count in this program's own decision rule) remains as
      an internal deliverable.

  assumptions:
    - >-
      [fact] Over F_p with p > 3 the only possible |Aut(E)| are 2, 4 and 6, with
      4 only at j = 1728 and 6 only at j = 0, and F_p-rationality of the extra
      automorphism requires p = 1 mod 4 respectively p = 1 mod 3. Verified per
      curve before measurement.
    - >-
      [fact] The baseline convention 0.886*sqrt(N) already includes the sqrt(2)
      negation factor (KN-TECH-006, restated in KN-TECH-018). This is the single
      fact DEFECT 1 rests on and it is quoted, not derived.
    - >-
      [instrument, blocking] Every escape rule is a function of the CURRENT
      class only. History-dependent rules break distinguished-point collision
      semantics and are rejected before measurement, with the rejection count
      reported. Inherited verbatim from EXP-RHO-60da4f and non-negotiable.
    - >-
      [instrument, blocking] All numbers are in F_p multiplications with
      squarings and inversions counted separately at measured ratios. No number
      may be reported in "group operations". Inherited from EXP-RHO-60da4f so
      the two contracts are commensurable.
    - >-
      [scope] Toy scale: subgroup sizes 2^32, 2^40, 2^48 as in EXP-RHO-60da4f,
      chosen so a full solve is affordable and the constant is measured rather
      than extrapolated. Nothing transfers to cryptographic sizes except through
      the declared size-independence check.
    - >-
      [scope] The measurement is of a CONSTANT. It cannot bear on any exponent
      and no downstream record may cite it toward one.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For an r-adding walk on the quotient of a prime-order subgroup by a
        cyclic automorphism group of order a acting freely on the non-identity
        points, the per-step probability of entering a fruitless cycle is
        rate_a(r) = (a-1)/(a*r) * (1 + o(1)) as N grows, uniformly over the
        declared r in {4, 8, 16, 20, 32} and over a in {2, 4, 6}.
      rigorous_support: >-
        RIGOROUS PART: the action of Aut(E)/{identity} on the non-identity
        points of a prime-order subgroup is FREE (a non-identity automorphism
        acts as a scalar lambda != 1 on G, and lambda*P = P with P != O forces
        lambda = 1 since N is prime), so every class off the identity has
        exactly a elements and the (a-1)/a factor is an exact orbit count, not
        an estimate. WHAT IS HEURISTIC is only that the branch function behaves
        as a uniform random choice among r branches on the class, independently
        of the automorphism index - i.e. the standard random-mapping model.
        CLASSICAL STATEMENT IMITATED: the random-mapping / Teske r-adding walk
        model that underwrites the 1.2533*sqrt(N) and 0.886*sqrt(N) constants
        themselves (KN-TECH-006), applied here to the class space rather than
        the group. The formula is calibrated so that a = 2 returns EXACTLY the
        1/(2r) rate EXP-RHO-60da4f pre-registers, which is the reproduction
        check that keeps it honest.
        WHY IT COULD FAIL: the branch function is evaluated on the canonical
        representative, so branch choice and automorphism index are NOT
        independent by construction, and the correlation grows with a. The
        formula could therefore be systematically wrong at a = 6 in a way it is
        not at a = 2 - which is precisely the effect worth finding.
      validation_plan: >-
        WHAT TO SAMPLE: per (a, r, size), at least 10^7 walk steps with cycle
        entries counted directly by an instrumented walk that records the class
        sequence, on the frozen curves. SCALE: toy, 2^32 to 2^48 subgroups; no
        shortcut to cryptographic scale exists for this quantity and none is
        claimed. AGAINST WHICH PREDICTION: the measured rate against
        (a-1)/(a*r), reported as a ratio with a binomial confidence interval, at
        every (a, r) cell; and the a = 2 cell against EXP-RHO-60da4f's own
        pre-registered 1/(2r) as the reproduction check.
        TAIL CONSISTENCY CHECK: the distribution of cycle LENGTHS, not only the
        entry rate. At a = 2 only length-2 cycles are available; at a = 6 the
        model predicts cycles of length dividing 6 with the length spectrum
        following the subgroup structure of Z/6. A measured length spectrum
        concentrated entirely on length 2 at a = 6 would mean the order-3 part
        of the action is not participating, which is an implementation defect
        and not a finding.
        SAMPLED PARAMETERS RECORDED: p, a, b, j, N, generator, automorphism
        formula, r, DP bits, escape rule, seed, per cell.
        TRANSFER ASSUMPTION, DECLARED: the size-independence of the cost ratio
        across the three subgroup sizes is TESTED, not assumed; if the ratio
        drifts with size, no single c_6 may be quoted and the deliverable
        becomes a size-indexed table.
      falsification_condition: >-
        A measured rate_6/rate_2 ratio outside [1.3, 2.0], or a measured a = 2
        rate inconsistent with EXP-RHO-60da4f's. The formula is withdrawn, the
        measured rates are reported raw, and the charged constants are still
        valid because they are measured directly and do not depend on H1.
    - id: H2
      statement: >-
        The escape-rule grid re-specified for a > 2 in Step 3 contains a rule
        within a factor 1.1 in charged cost of the best possible
        memoryless escape rule at a = 6.
      rigorous_support: >-
        RIGOROUS PART: NONE, and this is the weaker heuristic and the one that
        can most easily make the deliverable an underestimate. There is no known
        optimality theory for memoryless escape rules at a > 2, and the grid is
        an enumeration of the natural rules plus their a > 2 generalisations.
        CLASSICAL ANALOGUE IMITATED: none.
      validation_plan: >-
        WHAT TO SAMPLE: the full grid, with the best and second-best rules
        reported and their gap stated. AGAINST WHICH PREDICTION: if the best and
        second-best rules differ by more than 1.1 in charged cost, the grid is
        probably not near an optimum and the reported c_6 must be labelled a
        LOWER BOUND on the realisable constant rather than the constant. TAIL
        CHECK: report the full ordered list of rules by charged cost, so a later
        session can see whether the top of the list is flat or peaked.
      falsification_condition: >-
        A large gap between best and second-best, or a rule at the edge of the
        declared parameter grid being the best. Either means the grid is
        mis-centred; c_6 is reported as a lower bound and the threshold
        deliverable is labelled provisional.

  proof_search_map:
    bottleneck: >-
      Not a computational step: the bottleneck is that the lane's decision rule
      contains a number nobody has measured and a derivation nobody has
      corrected, so every future j-invariant measurement is compared against an
      unvalidated threshold. Every downstream classification of "baseline
      calibration versus attack" in this lane passes through that number.
    baseline_embedding:
      parameter_slice: >-
        a = 2, i.e. the negation quotient on a curve with j not in {0, 1728} -
        which is exactly EXP-RHO-60da4f's entire scope. This proposal is a
        family extension of that contract and its a = 2 slice must reproduce it.
      reproduction_check: >-
        FROZEN REGRESSION FIXTURE, BLOCKING. In this harness, at r = 20 and at
        the 2^32 subgroup size, reproduce (i) EXP-RHO-60da4f control C1 - the
        un-quotiented Teske walk against the 0.886*sqrt(n) convention within its
        declared +-8 percent band after unit conversion - and (ii) the a = 2
        per-step cycle rate against 1/(2r). Failure on either makes every a > 2
        number INVALID and returns the run to the executor.
    observation_collision:
      observable: >-
        The charged cost ratio c_a = (cost of un-quotiented walk) / (cost of
        a-quotient walk), in F_p multiplications.
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND MUST BE SEPARATED BY DESIGN, NOT BY ARGUMENT.
        A ratio of, say, 1.6 at a = 6 has at least four distinct preimages:
        (i) a genuine cycle-escape overhead eating part of sqrt(3);
        (ii) an implementation asymmetry - the j = 0 curve has b-only arithmetic
        (a = 0 in the Weierstrass equation) so its point addition is CHEAPER in
        field multiplications than the generic curve's, which inflates the ratio
        for a reason that has nothing to do with automorphisms;
        (iii) a different DP hit rate caused by the canonicalisation changing
        the distribution of the DP test input;
        (iv) a size effect.
        SEPARATION: (ii) is separated by the mandatory PHI-WITHHELD ARM - run the
        UN-QUOTIENTED walk on the SAME j = 0 curve, so the arithmetic is
        identical and only the quotient differs; this is the only comparison
        from which c_6 may be computed, and comparing j = 0 against a generic
        curve is PROHIBITED as the source of c_6. (iii) is separated by
        reporting the DP hit rate per arm. (iv) by the three sizes.
    constructive_transforms:
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from "the ideal ceiling sqrt(|Aut|)" to
          "the realised charged constant c_a under a declared escape rule and
          cost unit", and prove a strict inward improvement: c_a <= sqrt(a/2)
          against the negation-discounted baseline, with the gap measured rather
          than assumed zero.
        predicted_gain: >-
          Converts the lane's threshold from an unvalidated upper bound to a
          measured number with a band, and quantifies the blind band
          ( c_6 , 2.449 ] whose width is currently unknown.
    quantifier_order: >-
      CLAIMED IN THIS ORDER: FOR ALL escape rules in the declared memoryless
      grid, FOR ALL r in the declared set, FOR ALL three subgroup sizes, the
      measured charged constant c_6 on the frozen j = 0 curve against the
