idea:
  id: IDEA-20260805-5b8f95
  question_id: RQ-AES-001
  added: '2026-08-05'
  title: >-
    The baseline this goal must beat does not exist in the corpus, and the one
    AES entry that does exist is demonstrably corrupt: build the rounds-3-to-7
    baseline cost table as a first-class object, and supersede KN-LIT-2701
  class: control

  claim: >-
    GOAL-AES-001's first completion criterion requires a reduced-round result
    that "matches or beats A NAMED BASELINE MECHANISM at that round count, with
    data, time, memory, precomputation, and verification charged end to end".
    THAT BASELINE DOES NOT EXIST ANYWHERE IN THIS REPOSITORY. There is no table,
    no record, and no derivation giving the best-known data/time/memory cost of
    any attack on AES at 3, 4, 5, 6 or 7 rounds -- the exact round counts
    RQ-AES-001 scopes in. The first completion horn is therefore currently
    UNEVALUABLE: a result cannot be compared against a number nobody has written
    down. The single AES literature entry in the corpus,
    knowledge/literature/KN-LIT-2701.md ("Biclique Cryptanalysis of the Full
    AES"), is additionally CORRUPT IN A CHECKABLE WAY -- its author list carries
    parsed footnote markers ("Andrey Bogdanov(dagger-dagger)"), `year`, `venue`
    and all four identifier fields are null, its `tags` include `pairing` and
    `quantum`, its "Relevance to this program" section is about MOV/Frey-Ruck
    and GLV/GLS (elliptic-curve material pasted onto an AES paper), and its
    machine-readable `citation_verified: read` directly contradicts its own
    body, which says "claims are relayed from the paper's abstract without
    independent verification". Its `## Local copies` point at four
    `downloads/*.pdf` paths, and `downloads/` has never been tracked in this
    repository. Its figures (2^126.1, 2^189.7, 2^254.4 for full AES-128/192/256
    and 2^124.9 for 8-round AES-128) are RECALLED-UNVERIFIED and are cited by
    other goals. AND: eprint.iacr.org abstract pages, arxiv.org and
    csrc.nist.gov all returned HTTP 200 this session, so the campaign's standing
    justification for treating every baseline as unverifiable -- RQ-AES-001's
    provenance paragraph asserting all three are unreachable -- is false for
    those endpoints. The deliverable is a REDUCED-ROUND BASELINE TABLE for
    rounds 3-7, each row carrying its verification status honestly, plus a
    superseding literature entry for KN-LIT-2701.

  object_first_candidate:
    tracked_object: >-
      The BASELINE COST TUPLE, treated as a first-class object rather than a
      scalar: (round_count, key_size, attack_family, data_complexity,
      time_complexity, memory_complexity, precomputation, verification_cost,
      source, verification_status). Followed through the computation means:
      followed from a published claim, through this corpus's ingestion, into
      every downstream comparison a decision makes. The object is what a
      "matches or beats" judgement is actually evaluated against.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: integral / square,
      division property, impossible differential, Demirci-Selcuk
      meet-in-the-middle, partial sums, boomerang, biclique, related-key
      differential, algebraic / XSL, yoyo and exchange attacks. This proposal
      proposes NO attack in any family. It audits the measuring stick those
      families are compared against. Naming them here is exactly the point: they
      are the ROWS of the table, and the proposal's content is that the table has
      never been written.
    newness_score: >-
      Zero as cryptanalysis and the record says so. As an act in this corpus it
      is unattempted: four batches of GOAL-AES-001 have run with the campaign's
      own completion criterion resting on a baseline nobody has assembled, and
      DEC-20260731-011's literature strikes plus the "no primary source is
      reachable" clause in TASK-20260801-806's report section 0 record the
      campaign systematically declining to build it. What has changed is that the
      declining premise is measurably false for three endpoints.
    testability_score: >-
      High and cheaply staged. Stage 1 (the corruption audit) is a read of one
      committed file against itself and needs no network at all -- the internal
      contradiction between `citation_verified: read` and the body's "without
      independent verification" is decidable from committed bytes. Stage 2 (the
      fetch) is testable by exit code and content hash. Stage 3 (the table) is
      testable by whether every row carries a source and a verification status.
    survival_score: >-
      The corruption finding survives unconditionally -- it is a property of
      committed bytes. The table survives only as well as its sources, which is
      why every row carries its own verification status rather than the table
      carrying one global caveat.

  mechanism: >-
    There is no new mathematics and the record does not pretend otherwise. The
    mechanism is an identifiability argument about the corpus's own measuring
    apparatus, plus a construction.

    PART A -- WHY THE MISSING TABLE IS A MECHANISM PROBLEM AND NOT A CHORE.
    GOAL-AES-001 has two completion horns: a certified reduced-round result
    beating a named baseline, or a scoped barrier statement. The second horn has
    been the campaign's whole output for four batches (four checkpoints, each
    recording "NO cryptanalytic result and NO claim about AES at any round
    count"). The first horn is not merely unmet -- it is UNEVALUABLE, because
    "beats a named baseline at a stated round count" is a comparison and one
    operand is absent. That absence has a consequence the campaign has never
    stated: any future reduced-round measurement this campaign produces CANNOT
    discharge criterion 1, no matter how good it is, until the operand exists.
    Building it is therefore a PRECONDITION of the goal's own success condition,
    not a nicety, and it is the cheapest unmet precondition remaining.

    PART B -- THE CORRUPTION IS DECIDABLE FROM COMMITTED BYTES. Five defects in
    knowledge/literature/KN-LIT-2701.md, each checkable without any network
    access, listed so a reviewer can confirm or refute each independently:
    (i) `authors` contains footnote markers glued to surnames, so the field is a
    PDF-parsing artifact rather than an author list; (ii) `year: null`,
    `venue: null`, and `identifiers.{eprint, doi, arxiv, url}` all null, so the
    entry names no retrievable object; (iii) `tags` includes `pairing` and
    `quantum`, neither of which describes the paper; (iv) the
    "## Relevance to this program" section discusses MOV/Frey-Ruck and GLV/GLS,
    which are elliptic-curve constructions with no bearing on a block cipher --
    and that section is precisely the field a downstream agent reads to decide
    whether the entry matters; (v) the front-matter `citation_verified: read`
    CONTRADICTS the entry's own "## Not verified here" section, which states the
    claims are relayed from the abstract without independent verification. Defect
    (v) is the important one and it generalises: the ANGLE-BRIEF records that
    2,000 of 2,000 sampled corpus entries show the same contradiction. A
    machine-readable field that says the opposite of the human-readable body is
    not a metadata blemish; it is an instrument that reports "verified" for
    unverified content, and every novelty screen in the program reads it.

    PART C -- THE PROJECTION THAT DESTROYS THE COMPARISON. The corpus stores a
    baseline as a SCALAR ("2^126.1"). The comparison the goal requires is over a
    TUPLE (rounds, data, time, memory, precomputation, verification). The scalar
    projection discards rounds -- which is why a full-round AES-128 number sits
    in the corpus while the goal needs rounds 3-7 -- and discards memory and
    data, which is exactly the discard RT-2 exhibited inside this campaign: a
    cost table whose entries exceeded their own object's frontier ceiling
    q^(4(4 - dim K)) at every n >= 2, undetected because the ceiling was not
    carried alongside the count. The same discard, one level up, is why "beats
    the biclique attack" is not a well-formed sentence at 5 rounds. The repair is
    to carry the tuple.

    PART D -- WHAT THE TABLE IS, CONCRETELY. One row per (round_count in
    {3,4,5,6,7}) x (key_size in {128,192,256}) x (attack_family), with the ten
    fields of the tracked object, and with verification_status drawn from a
    CLOSED vocabulary: READ_PRIMARY (body obtained and the figure read from it),
    READ_ABSTRACT (abstract page obtained, figure read from the abstract),
    RELAYED (named by a secondary source), RECALLED_UNVERIFIED (model memory,
    a candidate to check and never a citation), DERIVED_HERE (recomputed from
    stated parameters in this repository), and ABSENT (no source, cell empty and
    declared empty). A cell with no source is EMPTY AND DECLARED EMPTY; it is
    never filled from memory. THE TABLE'S VALUE IS PROPORTIONAL TO HOW MANY
    CELLS IT HONESTLY LEAVES EMPTY, and a table that comes back mostly ABSENT is
    a successful outcome, not a failed one -- it converts an unstated assumption
    ("we know what to beat") into a stated gap.

    PART E -- ONE NAMED, UNREAD, IN-SCOPE ITEM THAT MUST BE FETCHED FIRST.
    RELAYED -- NOT READ, and recorded with that label because the record refuses
    to launder it: this session's ANGLE-BRIEF states that a 7-round AES-128
    result was released on 2026-07-28 improving on a best-known attack standing
    since 2013, at 2^105 chosen plaintexts, and that the sweep did not read it.
    SEVEN ROUNDS IS IN SCOPE FOR RQ-AES-001. If that item is real, it is the
    baseline row for (7, 128) and it may already dominate anything this campaign
    could produce there; if it is not real, the campaign has been about to
    compare against a phantom. Either way it is the first cell to fill and it is
    a fetch, not an experiment. NO FIGURE FROM IT IS ASSERTED ANYWHERE IN THIS
    RECORD; "2^105 chosen plaintexts" appears here exactly once, labelled
    RELAYED-NOT-READ, and it is a target to check.

  novelty_status: unverified

  literature_context:
    - >-
      knowledge/literature/KN-LIT-2701.md -- READ IN FULL from the working tree
      this session. Every defect in PART B is quoted from that file. Its figures
      2^126.1 / 2^189.7 / 2^254.4 / 2^124.9 are reproduced here ONLY as the
      strings the entry contains; they are NOT asserted, NOT cited, and are
      RECALLED-UNVERIFIED at their source.
    - >-
      RELAYED -- NOT READ. The 2026-07-28 7-round AES-128 item described in PART
      E is known to this record only through this session's ANGLE-BRIEF, which
      itself labels it RELAYED and states it was not read. It is a candidate to
      check, never an authority, and its fetch is stage 2 of the test.
    - >-
      RELAYED -- NOT READ. The ANGLE-BRIEF additionally names ePrint 2026/1039
      (related-key differential, <= 7 rounds), Dong et al. chosen-key
      distinguishers on full AES-192/256 (FSE 2026 / ToSC 2025(3)), and Baksi et
      al. 13-round AES-256 related-key. None was read. None is cited. They are
      listed as fetch targets so that the table's ABSENT cells are absent by
      measurement rather than by not having looked.
    - >-
      MEASURED THIS SESSION, SCOUT-COMPUTED, RE-RUN IN-HARNESS BEFORE CITING:
      HTTP 200 from an eprint.iacr.org abstract page, 403 from an
      eprint.iacr.org PDF body, 200 from arxiv.org, 200 from csrc.nist.gov.
      A status code is not a document and no body was parsed.
    - >-
      COMMITTED INTERNAL SOURCES CONTRADICTED: ledger/questions/RQ-AES-001.yaml
      provenance ("csrc.nist.gov, eprint.iacr.org, arxiv.org ... are all
      unreachable"), and TASK-20260801-806's report section 0 ("No primary
      source is reachable in this environment"). Both read in full.

  lossy_projection_identifiability_audit:
    projection: >-
      The corpus's incumbent projection: a published attack -> a single scalar
      time complexity (e.g. "2^126.1"). The proposal's replacement: the same
      attack -> the ten-field baseline cost tuple.
    what_is_discarded: >-
      The incumbent discards round count, key size, data complexity, memory,
      precomputation, verification cost, and the verification status of the
      figure itself. Seven of ten fields.
    why_genuinely_lossy: >-
      Genuinely and destructively lossy, and the loss is EXHIBITED rather than
      argued: KN-LIT-2701's scalar 2^126.1 is a full-round figure, so under the
      incumbent projection the corpus's only AES baseline is CONSTANT ACROSS THE
      ENTIRE IN-SCOPE ROUND RANGE 3-7 -- it takes the same value at every round
      count the goal cares about, because it takes no value at any of them.
    why_compatible_with_the_operations: >-
      The tuple projection IS compatible with the operation that consumes it,
      which is the "matches or beats at a stated round count" comparison: that
      comparison is defined coordinatewise on the tuple and is UNDEFINED on the
      scalar. The incumbent projection is not compatible with its own consuming
      operation, which is the defect.
    is_it_only_a_change_of_coordinates: >-
      CHECKED, both directions. The replacement is NOT a change of coordinates:
      the tuple cannot be recovered from the scalar (the fibre over "2^126.1"
      contains every round count and every memory figure), so the incumbent
      genuinely destroys information rather than relabelling it.
    mirror_failure_check: >-
      CHECKED, AND THIS IS THE FAILURE THE INCUMBENT EXHIBITS. The mirror
      failure is a projection so lossy that it is constant across instances,
      with zero comparator spread. The incumbent scalar has EXACTLY ZERO SPREAD
      over the in-scope instances (rounds 3,4,5,6,7 x key sizes 128,192,256): it
      is undefined at all fifteen and defaults to one full-round number. That is
      the canonical artifact tell applied to a measuring stick rather than to a
      statistic, and it is the finding.

  assumptions:
    - >-
      That a fetched abstract page is the abstract page and not a block page.
      NOT assumed: every fetch records the response body's SHA-256 and byte
      length, and a body whose length matches a known block-page length is
      reported as BLOCKED, not as READ.
    - >-
      That "named baseline mechanism" in the completion criterion means a
      specific attack with a specific cost at a specific round count, rather
      than exhaustive search. If the Coordinator's intended reading is the
      DEFINITIONAL exhaustive-search reference -- which is what EV-AES-005 used
      for GOAL-AES-003's 5-round key recovery -- then criterion 1 is evaluable
      after all and this proposal's PART A is wrong. THIS IS THE MOST LIKELY WAY
      THE RECORD IS WRONG and it is named first. It is not resolved here because
      it is a Coordinator reading, not a fact.
    - >-
      That KN-LIT-2701's defects are in the committed file and not an artifact
      of this session's read. Checkable by any reader from committed bytes.

  proof_search_map_note: >-
    NOT APPLICABLE, with the reason recorded rather than the field omitted. This
    proposal states no theorem, no asymptotic bound, no certificate family, no
    reduction and no closure argument. It builds a table and audits a corpus
    entry. docs/inventor-protocol.md section 8 binds proof-oriented proposals;
    manufacturing a four-audit map for a bibliographic construction would be
    ceremony that obscures which records genuinely carry one.

  predictions:
    - metric: >-
        corpus_baseline_rows_before: number of records anywhere in this
        repository giving a data/time/memory cost for an attack on AES at 3, 4,
        5, 6 or 7 rounds, with the round count stated
      direction: lower
      minimum_effect: >-
        PREDICTED 0, derived before the run from the searches described in
        dominated_by. Any value greater than 0 falsifies PART A's headline and
        the proposal must be restated as "extend the table" rather than "the
        table does not exist". This is the cheapest single check in the proposal
        and it runs first.
    - metric: >-
        kn_lit_2701_internal_contradiction: whether `citation_verified: read`
        coexists with a body section stating claims are relayed without
        independent verification, in the committed file
      direction: different
      minimum_effect: >-
        PREDICTED TRUE, decidable from committed bytes with no network. FALSE
        falsifies PART B defect (v) outright.
    - metric: >-
        fetch_success_count: number of the named fetch targets (the 2026-07-28
        7-round item, ePrint 2026/1039, the Bogdanov-Khovratovich-Rechberger
        biclique paper, FIPS-197) for which a body is obtained and hashed
      direction: higher
      minimum_effect: >-
        At least 1 of 4. Justification for so low a threshold, stated rather
        than hidden: eprint PDF bodies measured 403 this session, so the ePrint
        targets may be unobtainable and the honest outcome is a table row marked
        ABSENT with the measured status code beside it. A threshold of 4 would
        make an environment fact look like a research failure.
    - metric: >-
        table_absent_fraction: fraction of the 15 (round, key size) cells whose
        best-known row comes back ABSENT or RECALLED_UNVERIFIED after the fetch
        stage
      direction: different
      minimum_effect: >-
        NO THRESHOLD IS SET AND THAT IS DELIBERATE. Any value is a valid
        outcome; a high value is a MEASURED STATEMENT OF WHAT THIS CAMPAIGN DOES
        NOT KNOW, which is the deliverable. Setting a threshold here would
        create an incentive to fill cells from memory, which AGENTS.md rule 9
        forbids.
    - metric: >-
        seven_round_item_real: whether the RELAYED 2026-07-28 7-round AES-128
        item resolves to a retrievable document
      direction: different
      minimum_effect: >-
        Binary, no threshold. If YES, its figures become the (7, 128) baseline
        row at status READ_PRIMARY or READ_ABSTRACT and the campaign learns what
        it must beat at its top in-scope round count. If NO, the record states
        that it could not be resolved and the row stays ABSENT -- it does NOT
        state that the item does not exist.

  minimal_test:
    design: >-
      Four stages, cheapest first, stage 1 zero-network and able to end the
      proposal. STAGE 1 (minutes, NO NETWORK, MAY TERMINATE): grep the whole
      repository for any committed reduced-round AES cost figure with its round
      count, and re-read KN-LIT-2701 against itself for the five defects. If
      stage 1 finds an existing baseline table, STOP and restate. STAGE 2
      (under an hour, network): attempt each named fetch target, recording per
      target the URL, HTTP status, body length, body SHA-256, and whether the
      body is a document or a block page. NOTHING IS READ INTO A RECORD WITHOUT
      A HASHED BODY. STAGE 3 (hours): build the 15-cell baseline table, each row
      with the ten fields and a verification_status from the closed vocabulary,
      leaving cells ABSENT where they are absent. STAGE 4 (minutes): draft a
      SUPERSEDING literature entry for KN-LIT-2701 under a newly minted KN-LIT
      id, with correct or explicitly null metadata and a `citation_verified`
      value that agrees with its own body. KN-LIT-2701 IS NOT EDITED (AGENTS.md
      rule 4).
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL). Run
        the identical stage-1 grep for a cipher this campaign has never studied
        and for which the corpus should contain nothing -- e.g. reduced-round
        Serpent or Camellia cost figures. FORCED VALUE: 0 rows. If the grep
        returns rows for those, the grep is matching prose rather than cost
        figures and the stage-1 count of 0 for AES means nothing. This null can
        genuinely fail and it is what makes the "predicted 0" prediction
        meaningful rather than self-fulfilling.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Run the
        identical grep for the campaign's OWN reduced-round result, EV-AES-005's
        5-round AES-128 key recovery against the definitional exhaustive-search
        reference. It MUST be found, with its round count. If the grep cannot
        find a cost figure that is definitely present, the instrument is broken
        and NO count may be reported, positive or negative.
      - >-
        GRADED CONTROL, 3 INTERIOR POINTS, MONOTONICITY REPORTED. Count matching
        rows at round counts 3, 5 and 7 separately rather than as one aggregate.
        A grep that returns the same count at every round count is matching a
        round-independent string and is not measuring what it claims;
        round-resolved counts localise that failure instead of leaving one
        number.
      - >-
        FETCH NULL. Attempt one URL known to be blocked (an eprint.iacr.org PDF
        body, measured 403 this session) and one known-good (a plain arXiv
        abstract). FORCED VALUES: blocked and 200 respectively, with the blocked
        body's length recorded. If the fetch harness reports success on the
        known-blocked URL, no fetch result may be recorded at all.
      - >-
        ORDERING CONTROL. The stage-1 null grep and the positive control are run
        and their verdicts committed BEFORE the AES counts are looked at.
    required_metrics:
      - stage-1 row counts per round count, with the exact grep pattern committed
      - the five KN-LIT-2701 defects, each PRESENT or ABSENT, quoted from the file
      - per fetch target: URL, status, body length, body SHA-256, document-or-block verdict
      - the 15-cell table with every cell's verification_status from the closed vocabulary
      - a plain list of which cells are ABSENT and why

  falsification_conditions:
    - >-
      Stage 1 finds an existing committed reduced-round baseline table. PART A is
      wrong and the proposal is restated as an extension.
    - >-
      The null grep returns rows for Serpent or Camellia. The instrument matches
      prose and no count may be reported.
    - >-
      The positive control fails to find EV-AES-005's 5-round figure. Nothing may
      be reported.
    - >-
      KN-LIT-2701 does not carry the internal contradiction. Defect (v) is
      withdrawn; defects (i)-(iv) are checked independently and stand or fall on
      their own.
    - >-
      The fetch harness reports success on the known-blocked URL. No fetch result
      may be recorded.
    - >-
      The Coordinator rules that "named baseline mechanism" means the
      definitional exhaustive-search reference. Criterion 1 is evaluable already,
      PART A is wrong, and the proposal reduces to the KN-LIT-2701 supersession
      alone -- which still stands on its own.

  confounders:
    - >-
      GREP IS NOT SEMANTICS. A repository search cannot prove a baseline is
      absent; it proves a pattern did not match. The null and positive controls
      bound that, and the conclusion is stated as "no matching committed record
      was found by the committed pattern", never as "no baseline exists".
    - >-
      STATUS CODE VERSUS DOCUMENT. A 200 can be a block page; body hashes and
      lengths are recorded for exactly this reason, and no figure enters a record
      without one.
    - >-
      LAUNDERING RISK, THE MOST DANGEROUS ONE HERE. A table is a format that
      makes everything in it look equally solid. The closed verification_status
      vocabulary exists to prevent that, and a row without a status is a defect
      in the table, not a minor omission.
    - >-
      AUTHORSHIP ASYMMETRY. Finding a corpus entry corrupt is cheap and reads as
      rigour. The five defects are therefore stated as five independently
      checkable propositions rather than one verdict, so a reviewer can uphold
      some and reject others.

  interpretation_limits:
    - >-
      NOTHING HERE IS A RESULT ABOUT AES. No distinguisher, no key recovery, no
      barrier. A baseline table is a MEASURING STICK and authorizes no promotion.
    - >-
      A FILLED CELL IS NOT A VERIFIED CELL. A row at status RELAYED or
      RECALLED_UNVERIFIED may never be used in a "matches or beats" comparison
      without stating its status in the same sentence, which is
      RQ-AES-001's own second constraint and is inherited unchanged.
    - >-
      NO EXISTING FILE IS EDITED. KN-LIT-2701 is immutable under AGENTS.md rule
      4; the deliverable is a SUPERSEDING entry under a new id, and the decision
      to set `superseded_by` on the old entry is a Coordinator act this record
      does not perform. The eighteen-odd records citing KN-LIT-2701 are likewise
      untouched; what this proposal produces is a statement of what they were
      relying on.
    - >-
      CROSS-GOAL SCOPE. KN-LIT-2701 is cited by GOAL-FAEST-001 records
      (EV-FAEST-001, EV-FAEST-002, IDEA-20260731-002..006, KN-TECH-079). This
      proposal touches none of them and proposes no change to any. It records the
      dependency so that goal's owner can act.

  heuristic_assumptions:
    - id: HEUR-5B8-1
      statement: >-
        NONE LOAD-BEARING. Every claim is a property of committed bytes, an
        observed HTTP status, or a constructed table whose every cell carries its
        own provenance. There is no distributional assumption and no asymptotic
        claim. Recorded explicitly rather than left blank.
      rigorous_support: n/a -- audit and construction, not inference.
      validation_plan: >-
        The null grep, the positive control and the fetch null above are the
        validation.

  target_complexity:
    time_exponent: >-
      n/a. THIS PROPOSAL MOVES NO EXPONENT and states so plainly. Its subject is
      the exponents OTHER work claims: the table's whole purpose is to record
      what the best-known exponent at each in-scope round count actually is, with
      its provenance, so that a future claim to move one is evaluable. Under
      docs/target-result-profile.md's exponent-first bias this is
      infrastructure for exponent claims rather than an exponent claim.
    memory_exponent: >-
      n/a for this proposal; MANDATORY as a COLUMN of the table it builds. The
      house exemplar is memory-Pareto-incomparable rather than dominating, and a
      baseline table without a memory column reproduces exactly the omission that
      makes such comparisons meaningless.
    best_known: >-
      UNKNOWN AT ROUNDS 3-7 IN THIS CORPUS, and establishing it is the
      deliverable. Stating "unknown" here rather than filling it from memory is
      the record's central discipline.
    hidden_overhead: >-
      The honest overhead is human: assembling a fifteen-cell table from sources
      that may be unfetchable. Budgeted as such, with ABSENT as a first-class
      outcome.
    tradeoff_note: n/a.

  dominated_by: >-
    null, after checking, with the rows checked listed rather than asserted.
    TIME / MEMORY / DATA-QUERIES: inapplicable -- no algorithm is proposed, and
    the record says inapplicable rather than silently omitting them. On the
    question actually answered (does a reduced-round AES baseline table exist in
    this repository), rows checked this session: knowledge/literature for AES
    entries (KN-LIT-2701 is the one found and it is a FULL-ROUND entry);
    knowledge/techniques (KN-TECH-069 and KN-TECH-071 are named by the
    ANGLE-BRIEF as AES-adjacent, neither is a baseline table);
    ledger/evidence/EV-AES-001..005 and EV-AES-d33b1c/-d8a13e (the campaign's own
    records; EV-AES-005 carries a 5-round key recovery costed against the
    DEFINITIONAL exhaustive-search reference, not against a published attack);
    the four GOAL-AES-001 batch checkpoints, all four of which state no
    cryptanalytic result and no claim about AES at any round count; and
    coordination/goals/GOAL-AES-001 in full. No baseline table was found.
    Absence of a search result is not evidence one was never built (AGENTS.md
    retrieval policy), which is why stage 1 re-runs the search with a committed
    pattern and a null control rather than resting on this paragraph.
  sota_delta: >-
    ZERO on every attack axis: no attack, no distinguisher, no cost improvement,
    no exponent. Quantitatively, where numbers exist: it converts 15 in-scope
    (round, key size) cells from UNSTATED to STATED-WITH-PROVENANCE; it makes
    completion criterion 1 EVALUABLE, which it currently is not; it supersedes 1
    corrupt literature entry carrying 4 unverified figures and cited by at least
    7 other committed records across a second goal; and it resolves 1
    RELAYED-NOT-READ item at the top in-scope round count that may already
    dominate anything this campaign could produce there. Cost: one producer slot,
    no cryptanalytic compute.

