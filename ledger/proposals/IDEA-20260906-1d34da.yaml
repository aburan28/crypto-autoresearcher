    "claim": "For a bounded reference multiplication interface whose range proof is deliberately weakened, the sequence of modular carry constraints can be represented exactly by a finite automaton; its ambiguity shrinkage distinguishes harmless modular wraparound from a leakage channel before any key-extraction implementation.",
