idea:
  id: IDEA-20260805-69af7c
  question_id: RQ-UOV-001
  added: '2026-08-05'
  title: >-
    Charge the memory UOV's key-recovery model never charges, and derive the
    one-line arithmetic test that catches a mis-transcribed parameter set -
    two zero-compute audits that decide which attack is actually binding
  class: audit

  claim: >-
    UOV's published key-recovery cost is quoted as a time figure. The dominant
    step is linear algebra on a Macaulay matrix with C(N + d_reg - 1, d_reg)
    columns, and that is a MEMORY figure the quoted number does not carry.
    SESSION-COMPUTED, from the intersection-attack shape derived independently
    in IDEA-20260805-ca92fd (M = 3m - 2 equations, N = 2n - 3m variables): at
    the recalled tuple (q,n,m) = (256,112,44) the unconstrained optimum is time
    2^158.0 with memory 2^72.2 FIELD ELEMENTS, and the full hybridisation curve
    - guess g variables at cost q^g, solve the rest - is a genuine Pareto
    frontier that nobody in this corpus has drawn for any MQ scheme. Capping
    memory at 2^60 field elements raises the best time to 2^197.3; at 2^40 it is
    2^299.9; at 2^30 it is 2^380.8. The consequences are concrete and cut in an
    unfashionable direction. FIRST: charging memory makes UOV look STRONGER, by
    39 bits at a 2^60 cap, and a result that makes a scheme look stronger is
    still a result. SECOND, and the part that changes rankings: Kipnis-Shamir at
    about q^{n-2m-1} * m^4 costs 2^205.8 at that tuple with POLYNOMIAL memory,
    so the intersection attack and Kipnis-Shamir are PARETO-INCOMPARABLE, and
    which one is 'the best known attack' is a function of the memory budget
    nobody states. THIRD: the same arithmetic yields a one-line consistency test
    that any transcribed parameter set must pass - a level-lambda claim requires
    (n - 2m - 1) log2 q + 4 log2 m >= lambda - and the tuple (16,112,44),
    recalled in this very session as a level-I set, FAILS it at 2^113.8 against
    2^143. That test costs one line and catches transcription errors before they
    propagate into four goals' cost tables.

  object_first_candidate:
    tracked_object: >-
      The ordered pair (log2 time, log2 memory) of a UOV key-recovery attempt,
      followed as a curve parameterised by the number of guessed variables g,
      and then compared across attack families at a FIXED memory budget rather
      than at g = 0. The object is a point set in the plane, not a scalar, and
      the entire proposal is that the corpus has been projecting it to one
      coordinate.
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) inventing any new attack - this
      proposal proposes none and must not be read as proposing one; (2) the
      solving-degree measurement itself, which is IDEA-20260805-ca92fd's object
      and is consumed here only as an input; (3) QR-UOV's quotient-ring
      compression (GOAL-QRUOV-001), MAYO's whipping (GOAL-MAYO-001) and SNOVA's
      group-action structure (GOAL-SNOVA-001) - this record derives the
      CONVENTION those three goals must share and deliberately does not enter
      any of them; (4) implementation-level cost modelling, cache hierarchies
      and concrete hardware - the charge here is the abstract Wiener AT^2 one,
      and pretending to more precision than that would be false.
    newness_score: >-
      Area-time charging is old, standard, and recorded in this corpus as
      KN-TECH-035, KN-TECH-044 and KN-TECH-050/057. What is absent is any
      instance of it applied to a multivariate scheme: ANGLE-BRIEF section F7
      records device D5 (Wiener full cost) against the crossbred/BooleanSolve
      split as NEVER ATTEMPTED in the MQ case, and section 2 T-D measures that
      75 of 131 cost-claiming records in this corpus charge wall-clock only and
      82 never mention memory at all. The arithmetic is elementary; the
      application is missing.
    testability_score: >-
      Maximal. Every number is a binomial coefficient and a logarithm. There is
      nothing to run, nothing to seed, and no way to hide a fitted parameter.
      The only inputs are (q, n, m), the solving-degree convention, and omega.
    survival_score: >-
      The object survives entirely - a (time, memory) pair exists for every
      attack at every g. The risk is the opposite: that the curve is so
      uninteresting at every budget that the ranking never changes. That risk is
      exactly what the null arm measures and it is a real possible outcome.

  mechanism: >-
    DERIVED AND COMPUTED IN THIS SESSION with Python's standard library only.
    The scripts live in this session's scratchpad and are NOT committed; every
    figure below must be recomputed inside the harness before any record cites
    it.

    PART A - THE FRONTIER.
    Take the intersection-attack system derived from first principles in
    IDEA-20260805-ca92fd: M = 3m - 2 quadratic equations in N = 2n - 3m
    variables over F_q. The published-style cost model computes
      d_reg(M, N) = index of the first non-positive coefficient of
                    [(1 - z^2)^M / (1 - z)^N]_+
      T(M, N) = 3 * C(N + d_reg - 1, d_reg)^omega * C(N+1, 2)  field mults
    and the linear-algebra step operates on a matrix with
      S(M, N) = C(N + d_reg - 1, d_reg)   columns.
    S is a memory requirement even in the most favourable sparse-iterative
    formulation, because a Wiedemann or Lanczos iteration must hold at least one
    dense vector of that length. The quoted security figure carries T and drops
    S. Hybridisation restores a knob: guess g of the N variables at cost q^g and
    solve the remaining N - g, giving
      T(g) = q^g * 3 * C(N-g+d_reg(M,N-g)-1, d_reg(M,N-g))^omega * C(N-g+1, 2)
      S(g) = C(N-g+d_reg(M,N-g)-1, d_reg(M,N-g)).
    T is increasing and S is decreasing in g, so (T(g), S(g)) traces a genuine
    Pareto frontier. SESSION-COMPUTED at (q,n,m) = (256,112,44), so
    M = 130, N = 92, omega = 2, in log2:
      g=0   d_reg 20  T 158.0  S 72.2
      g=1   d_reg 19  T 160.5  S 69.4
      g=8   d_reg 16  T 197.3  S 60.0
      g=16  d_reg 13  T 241.3  S 50.1
      g=24  d_reg 11  T 290.4  S 42.8
      g=32  d_reg  9  T 339.5  S 35.5
      g=40  d_reg  7  T 388.3  S 28.2
    and the memory-capped optima are: cap 2^72 -> time 2^160.5; cap 2^60 ->
    2^197.3; cap 2^50 -> 2^248.8; cap 2^40 -> 2^299.9; cap 2^30 -> 2^380.8. The
    same computation at (16,160,64) gives M = 190, N = 128, unconstrained
    T 2^198.4 at S 2^91.9, and capped optima 2^222.0 / 2^241.7 / 2^269.4 /
    2^294.3 / 2^336.2 at caps 2^72 / 2^60 / 2^50 / 2^40 / 2^30. At (256,184,72)
    the unconstrained point is T 2^242.3 at S 2^113.6, and at (256,244,96) it is
    T 2^304.0 at S 2^144.1.

    PART B - THE COMPARISON THAT ACTUALLY MATTERS.
    Kipnis-Shamir style key recovery costs about q^{n-2m-1} * m^4 with
    POLYNOMIAL memory. SESSION-COMPUTED at the four recalled tuples: 2^205.8,
    2^148.0, 2^336.7, 2^434.3. Put that beside Part A at (256,112,44):
      intersection, g = 0:  T 2^158.0, S 2^72.2
      Kipnis-Shamir:        T 2^205.8, S poly
    NEITHER DOMINATES. Under the Wiener AT^2 charge, S * T^2, the intersection
    point scores 2^388.2 and Kipnis-Shamir scores about 2^411.6 plus a small
    polynomial - so the intersection attack still wins under AT^2, but only by
    about 23 bits rather than the 48 bits the time-only comparison suggests, and
    at a memory cap of 2^60 the intersection attack's time (2^197.3) is only 8.5
    bits below Kipnis-Shamir's. THAT MARGIN IS INSIDE THE UNCERTAINTY OF THE
    m^4 COFACTOR AND OF omega. So the honest statement at any realistic budget
    is 'the two attacks are comparable', not 'the intersection attack is best'.
    Every downstream Pareto comparison in GOAL-MAYO-001, GOAL-QRUOV-001 and
    GOAL-SNOVA-001 rests on which of these is called the baseline.

    PART C - WHY 2^72 FIELD ELEMENTS IS NOT A FOOTNOTE.
    At q = 256 one field element is one byte, so S = 2^72.2 field elements is
    about 5 * 10^21 bytes. That is the same order of magnitude as all storage
    manufactured by humanity. It is not a bound that can be waved through as
    'memory is cheap', and it is not obviously beyond reach either - which is
    precisely why it must be STATED rather than dropped. The claim being audited
    is not that the attack is infeasible; it is that a security level quoted as
    a single number 2^143 is being compared against a cost that is a pair.

    PART D - THE TRANSCRIPTION TEST, AND A LIVE FAILURE.
    Because Kipnis-Shamir needs only polynomial memory, its cost is a hard floor
    on any honest security claim: a parameter set claiming level lambda must
    satisfy
      (n - 2m - 1) * log2(q) + 4 * log2(m)  >=  lambda.
    This is one line of arithmetic and it is a necessary condition on the
    PARAMETERS ALONE. SESSION-COMPUTED on tuples recalled in this session:
      (16,112,44)  -> 2^113.8   vs level I 2^143   FAILS
      (256,112,44) -> 2^205.8   vs level I 2^143   passes
      (16,160,64)  -> 2^148.0   vs level I 2^143   passes, narrowly
      (256,184,72) -> 2^336.7   vs level III 2^207 passes
      (256,244,96) -> 2^434.3   vs level V 2^272   passes
    The first line is the point. (16,112,44) was recalled in this same session
    as a plausible UOV level-I set and it cannot be one; recall alone is not
    reliable for parameters, and this test catches the error at zero cost before
    it reaches a cost table. RQ-UOV-001 already records that no round-3
    specification has been read here, so every tuple in this program is
    currently at that risk. THE TEST DOES NOT TELL US WHAT THE PARAMETERS ARE.
    It tells us which recalled candidates are certainly wrong, which is the only
    thing derivation can do without reading the source.

    PART E - WHAT IS NOT DERIVED. The m^4 cofactor in the Kipnis-Shamir figure
    is RECALLED-UNVERIFIED and is doing real work in Part D at the (16,160,64)
    line, which passes by 5 bits and would fail if the cofactor were m^2. The
    XL cost formula's shape is likewise recalled. Both are named as numbered
    heuristics below and both become checkable steps of the audit rather than
    assumptions of it. The DERIVED content of this record - that S must be
    reported beside T, that hybridisation traces a frontier, that the two
    attacks are Pareto-incomparable, and that a polynomial-memory attack imposes
    a parameter floor - does not depend on either cofactor.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/proposals
      - ledger/evidence
      - ledger/goals
      - experiments
      - knowledge/techniques
    grep_results:
      - >-
        No experiment or evidence record in this corpus charges memory for any
        multivariate attack; there are no UOV experiments or evidence records at
        all (context brief for GOAL-UOV-001, and confirmed by grep).
      - >-
        IDEA-20260801-014, the only prior UOV proposal, sets dominated_by null
        with no frontier check and treats 'measured attack cost' as a scalar.
      - >-
        GOAL-ICEX-001, this program's own charging vehicle, is active and has
        never executed (ANGLE-BRIEF section 2 T-D), so the convention this
        record derives has no incumbent to conflict with.
    conclusion: >-
      Area-time charging is standard practice outside this program and is
      catalogued inside it; its application to UOV is absent here. No priority
      is claimed and the screen's reach is the one ANGLE-BRIEF T-H describes.

  lossy_projection_identifiability_audit:
    projection: >-
      Attack instance (family, q, n, m, guessing parameter g, solver
      convention) -> the pair (log2 T, log2 S), and then -> the scalar
      log2(S) + 2 log2(T) under the Wiener AT^2 charge.
    what_is_discarded: >-
      At the first step, everything about the algebra: the field structure, the
      oil space, the actual matrix, the success probability. At the second step,
      one further dimension - the pair collapses to a scalar, which is the whole
      reason AT^2 can be a misleading summary and why both the pair and the
      scalar are reported.
    why_genuinely_lossy: >-
      Genuinely lossy at the first step - infinitely many attacks share a
      (T, S) pair. NOT lossy in the dangerous direction at the second step, and
      this is stated as a limitation rather than a virtue: AT^2 is an
      order-preserving summary only under assumptions about wire delay that this
      record does not verify, so the PAIR is the primary reported object and the
      scalar is secondary.
    why_compatible_with_the_operations: >-
      Compatible: T and S both propagate through hybridisation deterministically
      because guessing g variables multiplies T by q^g and replaces N by N - g
      in both formulas. There is no step at which the retained pair fails to
      determine the next one.
    is_it_only_a_change_of_coordinates: >-
      THE MIRROR FAILURE IS THE REAL RISK AND IT IS CHECKED EXPLICITLY. If the
      memory-charged ranking of attack families were IDENTICAL to the time-only
      ranking at every budget and every parameter set, then charging memory
      would be a change of units with zero comparator spread and this proposal
      would say nothing. THE CHECK THAT WAS RUN, and its result: at
      (256,112,44) the time-only gap between the intersection attack and
      Kipnis-Shamir is 47.8 bits, and at a 2^60 memory cap it is 8.5 bits. The
      spread is NOT zero. That single computation is what licenses the proposal;
      had the gap been unchanged, the correct action would have been to record
      the null and stop, and that remains the outcome if the in-harness
      recomputation contradicts the scratchpad figures.

  assumptions:
    - >-
      That the intersection system's shape is M = 3m - 2, N = 2n - 3m, derived
      in IDEA-20260805-ca92fd. If Stage 0 there shows the published system
      differs, every table here is recomputed with the corrected shape; the
      structure of the argument is unaffected.
    - >-
      That d_reg is the semi-regular value. It is the SAME heuristic
      IDEA-20260805-ca92fd measures, and this record inherits it explicitly
      rather than silently - see HEUR-UOV-B1.
    - >-
      That memory is charged as the number of columns of the Macaulay matrix
      times one field element. This is the most FAVOURABLE-TO-THE-ATTACKER
      charge available; dense elimination would charge the square. Choosing the
      attacker-favourable end is deliberate, so that a conclusion of the form
      'memory does not change the ranking' cannot be an artifact of a pessimistic
      charge.

  predictions:
    - metric: >-
        rank_inversion_budget - the largest memory cap S* (in log2 field
        elements) at which the time-optimal attack family at (256,112,44)
        differs from the time-optimal family at unbounded memory
      direction: different
      minimum_effect: >-
        Predicted: NO inversion at any cap, i.e. S* does not exist, because
        SESSION-COMPUTED the intersection attack's capped time stays below
        Kipnis-Shamir's 2^205.8 down to a cap of about 2^58 and thereafter the
        gap is within the cofactor uncertainty rather than cleanly inverted.
        THE PRE-REGISTERED PREDICTION IS THEREFORE THE NEGATIVE ONE. An
        inversion at any cap above 2^30 falsifies it and is the more interesting
        outcome.
    - metric: >-
        margin_compression - (time-only gap between the two families) minus
        (gap at a 2^60 memory cap), in bits, at each of the four recalled tuples
      direction: lower
      minimum_effect: >-
        SESSION-COMPUTED as 47.8 - 8.5 = 39.3 bits at (256,112,44). The
        pre-registered claim is that this is >= 20 bits at at least two of the
        four tuples. Below 20 bits at every tuple, the charge is a footnote and
        this record's practical content collapses to Part D.
    - metric: >-
        parameter_floor_violations - the number of transcribed candidate tuples
        failing (n - 2m - 1) log2 q + 4 log2 m >= lambda
      direction: higher
      minimum_effect: >-
        At least 1, already achieved: (16,112,44) fails at 2^113.8 against
        2^143. The forward prediction is that the FINAL transcribed tuples, once
        the specification is read, all PASS - and a transcribed tuple that fails
        is a transcription error, not a break, and must be treated as one.
    - metric: >-
        at2_ordering_stability - whether the AT^2 ordering of the attack
        families agrees with the memory-capped time ordering at caps
        2^30, 2^40, 2^50, 2^60
      direction: different
      minimum_effect: >-
        Agreement at all four caps is the prediction. Any disagreement means the
        AT^2 scalar is not a faithful summary at these parameters and the pair
        must be carried unreduced into all four dependent goals - a convention
        decision with real downstream cost, which is why it is pre-registered.

  minimal_test:
    design: >-
      Entirely arithmetic; there is no experiment to run in the usual sense, and
      saying otherwise would inflate it. Four stages.
      STAGE 1 (in-harness recomputation, minutes). Re-implement the Hilbert
      series, T(g), S(g), the Kipnis-Shamir figure and the parameter floor in
      committed code, and reproduce every number quoted in the mechanism. ANY
      disagreement with the scratchpad figures is resolved in favour of the
      in-harness computation and the record is superseded.
      STAGE 2 (sensitivity, minutes). Re-run the whole table at omega = 2, 2.37
      and 3, at the dense-elimination memory charge S^2 as well as S, and with
      the Kipnis-Shamir cofactor at m^2, m^3 and m^4. Report which conclusions
      survive all combinations. A conclusion that survives only at the
      attacker-favourable corner is reported as convention-dependent.
      STAGE 3 (specification read). Replace the recalled tuples and re-run.
      STAGE 4 (extension, optional). Add the direct-forgery route via the
      underdetermined-system reduction and the full-oil-space key equation, so
      the frontier covers every family the round-3 document names rather than
      the two derived here.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived before the run, CAN FAIL).
        Apply the identical frontier machinery to a family whose memory
        requirement is KNOWN to be polynomial in the parameters - exhaustive
        search over the oil space, cost q^{something} with O(n^2) memory. FORCED
        VALUE: its (T, S) curve must be a single point, S(g) constant in g, and
        its memory-capped optimum must equal its unconstrained optimum at every
        cap above the polynomial floor. If the machinery reports a nontrivial
        frontier for this family, the machinery is manufacturing frontiers and
        every other curve it produced is void.
      - >-
        POSITIVE CONTROL, WHERE THE EFFECT MUST APPEAR. A family whose advantage
        is PURELY memory-bought: take the intersection attack at g = 0 versus
        the same attack at the largest g whose memory fits 2^30. The time gap
        between them MUST be large and positive - SESSION-COMPUTED as
        380.8 - 158.0 = 222.8 bits at (256,112,44) - because the model makes it
        so by construction. If the implemented machinery reports a small or
        negative gap it is broken, and NO negative conclusion about memory
        charging may be drawn from any other row.
      - >-
        GRADED CONTROL, 5 interior points, monotonicity reported. Sweep the
        memory cap over 2^30, 2^40, 2^50, 2^60, 2^72 and report best-time at
        each. DERIVED EXPECTATION: strictly decreasing in the cap, and convex in
        log-log. A non-monotone reading means the hybridisation search is
        mis-implemented, since T(g) is provably increasing and S(g) provably
        decreasing in g.
      - >-
        ORDERING CONTROL. Both null arms and the sensitivity sweep of Stage 2
        are computed and committed before the headline table is written up.
      - >-
        ARCHIVE CHECK (zero compute). Prior memory-charged MQ costings in this
        corpus: NONE FOUND. Prior AT^2 charging anywhere in this corpus:
        KN-TECH-035, KN-TECH-044, KN-TECH-050/057 as techniques, with
        GOAL-ICEX-001 as the never-executed vehicle. The absence is recorded,
        not claimed as a passed check.
    required_metrics:
      - the full (log2 T, log2 S) table over g for each family and each recalled tuple
      - best time at each of five memory caps, per family, per tuple
      - the AT^2 scalar beside the pair, never instead of it
      - the parameter-floor value and its pass/fail verdict per tuple
      - the Stage-2 sensitivity matrix over omega, memory-charge convention and cofactor
      - an explicit list of families NOT costed, with the reason

  falsification_conditions:
    - >-
      The in-harness recomputation at Stage 1 disagrees with any figure in the
      mechanism. The record's numbers are then wrong and are corrected by
      supersession before use.
    - >-
      The margin_compression metric comes out below 20 bits at all four tuples.
      Charging memory then changes nothing at UOV's scale and this record's
      practical content is reduced to Part D, which must be reported plainly
      rather than dressed up.
    - >-
      The null family (polynomial memory) is reported with a nontrivial
      frontier. The machinery is void.
    - >-
      The positive control's forced 222.8-bit gap is not reproduced. Nothing may
      be concluded.
    - >-
      The specification, once read, states memory alongside time for every
      attack in its own table. The premise that memory is uncharged is then
      FALSE for UOV specifically, the audit's Part A collapses to a
      reproduction, and that must be reported as the primary finding rather than
      buried. THIS IS THE SINGLE MOST LIKELY FAILURE OF THE PROPOSAL and it is
      stated first among the things Stage 3 must check.

  confounders:
    - >-
      omega. Every time figure scales as omega * log2 C(N+d-1,d), so the choice
      moves T by tens of bits while leaving S untouched - meaning the CHOICE OF
      omega ITSELF changes the memory-charged ranking. Stage 2 exists for this.
    - >-
      Field multiplications versus NIST gate counts. Roughly 2^8 at q = 256 and
      2^4 at q = 16, applied to T only. Comparing a field-multiplication attack
      count against a gate-count security level is an error worth 8 bits and it
      is exactly the kind of unit slip KN-OPEN-014 records for quantum constants.
    - >-
      The sparse-versus-dense memory charge. S versus S^2 is a factor of 2 in
      the log, i.e. 72 bits at the top cell. The attacker-favourable end is used
      deliberately and the other end is reported beside it.
    - >-
      Parallelism. AT^2 is a circuit-model charge and says nothing about a
      distributed attack with communication costs. Not modelled, and declared
      not modelled.
    - >-
      RECALLED PARAMETERS. Four of the five inputs to every table are
      RECALLED-UNVERIFIED, and Part D demonstrates that recall has already
      failed once in this session.

  interpretation_limits:
    - >-
      No attack is proposed, no exponent is claimed to move, and nothing here is
      evidence about the security of any deployed parameter set. The output is a
      COST CONVENTION and a table computed under it.
    - >-
      The conclusions are conditional on the semi-regular d_reg, which is a
      heuristic under test in IDEA-20260805-ca92fd. If that heuristic fails, the
      d_reg values fall, the memory falls with them, and the whole frontier
      moves - so this record must be reissued after that measurement, not merged
      into it.
    - >-
      A finding that UOV looks stronger under charged memory is NOT a security
      argument for UOV. It is a statement about two named attack families under
      one cost model, with every other family declared uncosted.
    - >-
      Part D's test is NECESSARY, not sufficient. A tuple that passes it is not
      thereby a correct transcription.

  heuristic_assumptions:
    - id: HEUR-UOV-B1
      statement: >-
        The solving degree of the intersection system equals the semi-regular
        d_reg of [(1-z^2)^M/(1-z)^N]_+ at every (M, N) appearing in the frontier
        table, INCLUDING at every hybridised N - g.
      rigorous_support: >-
        None. Inherited verbatim from the published model and tested
        independently by IDEA-20260805-ca92fd at toy scale only. The hybridised
        case is a strictly stronger assumption than the unhybridised one and is
        NOT covered by that experiment, since guessing g variables changes the
        structure of the system; this is recorded as a gap, not resolved.
      validation_plan: >-
        Report the frontier as conditional on HEUR-UOV-B1 in every cell.
        Additionally report, for each memory cap, the value of d_reg it relies
        on, so a later correction to d_reg can be applied without recomputing
        the whole table.
    - id: HEUR-UOV-B2
      statement: >-
        Kipnis-Shamir style key recovery on UOV costs q^{n-2m-1} * m^4 field
        operations with memory polynomial in n.
      rigorous_support: >-
        RECALLED-UNVERIFIED, both the exponent and the cofactor. The exponent's
        SHAPE is derivable - the attack succeeds when a random guess lands in a
        subspace of the right codimension, and n - 2m is the natural
        codimension in a v-versus-2m count - but the exact offset and the
        cofactor are not derived here and must not be treated as derived.
      validation_plan: >-
        Stage 3 reads the specification. Meanwhile Stage 2 reports every
        conclusion at m^2, m^3 and m^4; the only conclusion sensitive to the
        choice is the (16,160,64) row of Part D, which passes by 5 bits at m^4
        and would fail at m^2. That sensitivity is reported explicitly rather
        than resolved by choosing the convenient cofactor.
    - id: HEUR-UOV-B3
      statement: >-
        A sparse-iterative linear-algebra step over a Macaulay matrix with C
        columns requires at least C field elements of working memory.
      rigorous_support: >-
        Elementary and effectively definitional for Wiedemann or Lanczos - the
        iteration maintains at least one dense vector indexed by the columns.
        It is a LOWER bound on memory and therefore attacker-favourable, which
        is the direction that makes a 'memory does not matter' conclusion safe
        and a 'memory matters' conclusion conservative.
      validation_plan: >-
        No validation needed for the lower bound. Stage 2 reports the dense
        upper bound C^2 beside it so the reader sees the whole interval.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED, and this record refuses to pretend otherwise. What
      moves is which exponent is called the baseline: at unbounded memory the
      binding UOV key-recovery exponent at (256,112,44) is the intersection
      attack's 2^158.0, and at a 2^60 memory cap it is 2^197.3, with
      Kipnis-Shamir at 2^205.8 and polynomial memory as the always-available
      alternative. Choosing between those is a convention decision worth 39 bits
      and it is currently unmade in this program.
    memory_exponent: >-
