  recommended_priority: high
  honest_prior_of_survival: 0.99 that the report finds a material discrepancy, since two rows
    are forced by inspection. 0.7 that the defect is schema-wide rather than local. 0.5 that a
    schema change is adopted, which is a Coordinator decision this record cannot make.
