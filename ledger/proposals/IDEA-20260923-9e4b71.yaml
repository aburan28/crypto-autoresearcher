  title: >-
    THE PREPROCESSING RE-READING OF THE SMALL-ROOT CLOSURE: in the S*T^2 model
    of RQ-ECDLP-78dbc5 the relation-count and linear-algebra constraints of
    prime-field windowed index calculus move into a GENERICALLY computable
    precomputation (factor-base logs by batch rho), the per-target demand
    becomes eps_req_pre(m, w) = (w + 1/2 + 1/(2(2m-1)))/(w+1), the arity m = 2
    slice lands EXACTLY on the Corrigan-Gibbs-Kogan generic line, and the
    arity m = 3 / one-kept-node configuration -- excluded from
    IDEA-20260903-81a943 only by its linear-algebra constraint -- is decided by
    ONE computable number: whether the coupled system
    {S_3(x1, x2, y), S_3(y, x3, x_R)} has joint small-root capacity
    kappa_joint > 8/5
  class: mechanism

  claim: >-
    (A) THE MODEL SHIFT. RQ-ECDLP-78dbc5 asks for fewer stored entries at fixed
    online cost in a charged (P, S, L, epsilon, U) model, and its
    decision_target requires any super-constant claim to name its non-generic
    structure and reconcile itself with KN-LIT-013 (S T^2 = Omega~(eps N) for
    GENERIC algorithms). Index calculus is the canonical non-generic
    preprocessing algorithm, and for prime-field curves the program has closed
    the windowed ("lattice-describable") factor-base family in the FULL-ECDLP
    cost model only (IDEA-20260903-81a943, analysis/smallroot-reach/CLOSURE.md,
    margin -0.0481). That closure's demand has three rows: (I) relation
    collection (m-1) beta - sum_v (1 - gamma_v) > 1/2, (II) linear algebra
    2 beta < 1/2, (III) solvability m beta + sum_v gamma_v <= eps (w+1). In the
    preprocessing model rows (I) and (II) do not apply: the advice is the log
    table of the factor base F = {P : x(P) in [0, p^beta)} (|F| = p^beta (1 +
    o(1)) heuristically, S = p^beta log2 p bits), and those logs are
    computable GENERICALLY in precomputation by batch rho (Kuhn-Struik) at
    P = O(sqrt(|F| N)) = p^{(1+beta)/2} group operations -- no relation
    collection and no linear algebra at all. Online, a target Q needs ONE
    decomposition of a re-randomised R_c = Q + [c]P into factor-base points,
    and then log Q = sum_i eps_i log P_i - c.
    (B) THE PREPROCESSING DEMAND (derivation of this record, to be re-derived by
    a validator). With yield exponent Y = m beta - 1 - G, G = sum_v (1 - gamma_v),
    the online cost is T = p^{-Y + o(1)} and the generic line S T^2 = p is
    beaten iff (I') (2m - 1) beta - 2G > 1. Eliminating G against the unchanged
    (III) gives
      eps_req_pre(m, w) = (w + 1/2 + 1/(2(2m - 1))) / (w + 1),
    to be compared with the closure's eps_required(m, w) =
    (w + 1/2 + 1/(2(m - 1)))/(w + 1). Values: (m, w) = (2, 0): 2/3; (3, 0):
    0.600; (3, 1): 0.800; (4, 1): 0.786; (4, 2): 0.857; (5, 3): 0.889. The
    configuration (3, 1) was never in the closure's table because there (I)
    forces beta > 1/4 while (II) forces beta < 1/4; with (II) gone it is the
    best cell (its worst block has l = 2 inputs, so it is all-S_3).
    (C) THE DECISION IS ONE NUMBER, AND THE PROGRAM'S TWO CONVENTIONS DISAGREE
    ON IT. At (3, 1) the system is two equations, S_3(x1, x2, y) = 0 and
    S_3(y, x3, x_R) = 0 mod p, unknowns (x1, x2, x3) bounded by p^beta and the
    kept node y bounded by p^gamma, x_R KNOWN. Beating the generic line needs
    5 beta + 2 gamma > 3 with 3 beta + gamma <= kappa_joint and gamma <= 1;
    the region is non-empty iff kappa_joint > 8/5 EXACTLY (vertex gamma = 1,
    beta = (kappa - 1)/3, where 5 beta + 2 gamma = (5 kappa + 1)/3; the other
    vertex gamma = 0 needs kappa > 9/5), and at that vertex S = p^{(kappa-1)/3},
    T = p^{2 - kappa}, S T^2 = p^{(11 - 5 kappa)/3}.
      CONVENTION 1 (tools/smallroot_reach.py as committed): every block,
      INCLUDING the root block whose output x_R is known, is credited with the
      trivariate S_3 extended reach 0.8408 (MEASURED_REACH[2]; eps_available
      sets n = l + 1, "block inputs plus the block's output value"). Then
      kappa = 1.6816 > 1.6: ALIVE by +0.041 per equation, best point
      beta = 0.227, gamma = 1, S = p^{0.227}, T = p^{0.318}, P = p^{0.614},
      S T^2 = p^{0.864}.
      CONVENTION 2 (derived here): with x_R fixed, S_3(y, x3, c) as a
      polynomial in (y, x3) has the FULL 3 x 3 support -- all nine monomials
      1, y, x3, y^2, x3^2, y x3, y^2 x3, y x3^2, y^2 x3^2 carry generically
      nonzero coefficients (for y^2 = x^3 + ax + b: c^2 on y^2 and x3^2,
      -2c^2 - 2a on y x3, -2c on y^2 x3 and y x3^2, 1 on y^2 x3^2, -2ac - 4b on
      y and x3, a^2 - 4bc on 1) -- so its basic-strategy reach is the full-box
      value 2/3 (the tool's own closed form 2n/(d(n+1)) at n = 2, d = 2).
      Summed per block, kappa = 0.8408 + 0.6667 = 1.5075 < 1.6: DEAD by
      -0.046 per equation, best S T^2 = p^{1.154}. Eliminating y instead
      (w = 0, one S_4 in three unknowns) is dead under either convention
      (reach 0.375 to 0.414 against a demand of 0.600).
    Neither convention is the joint Jochemsz-May capacity of the coupled
    system, which shares the variable y between the equations and is exactly
    the case where joint shift lattices can beat per-block accounting. That
    joint number is the claim under test.
    (D) THE BASELINE SLICE. At m = 2, w = 0 the single bivariate S_3(x1, x2, x_R)
    has full-box reach 2/3 and the demand is eps_req_pre(2, 0) = 2/3: under
    the program's own reach model the simplest small-root decomposition lands
    EXACTLY on the generic line S T^2 = p (beta = 1/3, T = p^{1/3}). This is
    the exact parameter slice that reproduces the best-known frontier, and it
    is why the (3, 1) number is informative rather than hopeless.
    (E) WHAT EACH OUTCOME MEANS. kappa_joint > 8/5 (with the LLL probe of
    Stage 2 recovering planted roots inside the computed region): a
    heuristic, NON-GENERIC preprocessing algorithm for prime-field ECDLP with
    S T^2 = p^{(11 - 5 kappa)/3} < p -- the first candidate below the generic
    line in this program, positioned so that the KN-LIT-013 reconciliation is
    exactly "index-calculus structure of the x-coordinate", and routed to
    review-breakthrough per AGENTS.md rule 12 before any promotion.
    kappa_joint <= 8/5: the preprocessing model does NOT rescue the windowed
    family at (3, 1); the closure extends to the preprocessing model with a
    measured margin kappa_joint - 8/5, and -- because CONVENTION 2 shows the
    committed tool over-credits every root block -- the closure's own -0.048
    is re-scored as an upper bound on its true margin, which strengthens it.
    Either outcome answers the RQ's "what non-generic structure would be
    needed" with a number instead of prose.

  mechanism: >-
    STEP 0 (zero compute; validator). Re-derive (I'), eps_req_pre(m, w), the
    threshold 8/5 and the exponent (11 - 5 kappa)/3; re-derive the nine-monomial
    support of S_3(y, x3, c) from the Semaev S_3 of y^2 = x^3 + ax + b; confirm
    from tools/smallroot_reach.py lines 143 and 163-170 that the root block is
    credited with the trivariate reach; confirm the m = 2 tie.
    STEP 1 (seconds of CPU; small code). Extend the exact Jochemsz-May
    shift-lattice calculator of tools/smallroot_reach.py from one polynomial to
    a SYSTEM of two polynomials sharing one variable: shift set
    {x^a f1^i f2^j p^{t - i - j}} over the joint Newton polytopes, exact
    per-variable exponent sums s_x1, s_x2, s_x3, s_y and s_p (the product-of-
    bounds rule of the committed tool is valid only for polytopes symmetric in
    their variables; the joint system is not, so the condition is evaluated
    as prod_i X_i^{s_i} < p^{s_p} with the actual bounds), extrapolated
    t -> infinity in 1/t as the tool does. Calibrate against (i) Coppersmith's
    univariate 1/d, (ii) the committed single-S_3 value 0.8408 when f2 is
    dropped, (iii) the bivariate full box 2/3. Output: the region R_joint of
    (beta, gamma) where the joint condition holds, and the decision whether
    R_joint meets {5 beta + 2 gamma > 3, gamma <= 1}.
    STEP 2 (hours; only if Step 1 leaves the decision within 0.05 of the
    threshold or alive). Planted-root probes: at p near 2^40, 2^64 and 2^96,
    plant (x1, x2, x3) in the window and y = x(P1 + P2) in its window, build
    the Step-1 lattice at t in {2, 3, 4}, run LLL (fpylll if present; the
    committed --probe path is univariate only), and measure the recovery rate
    on a grid of (beta, gamma) straddling the computed boundary, 50 instances
    per cell. Separately, measure the yield heuristic H-A1 by exact
    enumeration at p in {2^20, 2^24, 2^28}.
    STEP 3 (only if Step 2 recovers inside the region). End-to-end toy run on
    a prime-order prime-field curve at p near 2^40: factor-base logs by batch
    rho (P charged), online decompositions with certificates re-verified by
    independent scalar multiplication, (S, T, P) placed beside the
    Bernstein-Lange table at equal S.
    OBJECT FRAME (docs/object-frame-ideation.md). Representation R1 (the
    x-coordinate read as an integer in [0, p)); operation set: point addition
    expressed through summation-polynomial constraints. Trichotomy: Class I,
    PARTIAL-ACTION (IDEA-20260806-c5d183) -- the relation vector propagates
    deterministically under translation by factor-base elements, and
    decomposition existence is the branching event, priced here by the yield
    p^{3 beta + gamma - 2} and the solver capacity kappa_joint. The factor base
    escapes KN-OPEN-020's bounded-degree obstruction the way that entry names:
    membership is an archimedean inequality (implicit, lattice-describable),
    not a polynomial identity.

