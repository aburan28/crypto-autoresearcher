      m = 2 (one bivariate S_3): EXACT TIE with the generic line under the
      reach model (capacity 2/3 = demand 2/3). Mechanism: the specialization
      has full-box support, so sparsity buys nothing. Not a win and not a
      loss; the boundary.
    - >-
      m = 3, w = 0 (eliminated S_4 in three unknowns): dead; reach 0.375-0.414
      against demand 0.600.
    - >-
      m >= 4 under preprocessing: dead under CONVENTION 2 (e.g. (4, 2): mean
      per-equation capacity (2 x 0.8408 + 0.6667)/3 = 0.783 against 0.857).
  open_directions:
    - The joint capacity kappa_joint of (3, 1) -- this record's test.
    - Rank-2 GAP windows under the preprocessing demand (CLOSURE.md section 6 item 1, with 8/5 replacing 8/9 as the target).
    - Non-tree and multi-polynomial joint lattices beyond the two-equation shift set.
    - Asymmetric windows per leaf (the root-block leaf x3 can take a smaller window than x1, x2 at no advice cost).

