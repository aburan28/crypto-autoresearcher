  assumptions:
    - >-
      Re-randomisation is exact: for uniform c, R_c = Q + [c]P is uniform in
      the group, so the per-trial yield does not depend on Q (not heuristic).
    - >-
      The reach convention and the measured single-polynomial reaches are those
      of tools/smallroot_reach.py and CLOSURE.md, used as committed; this record
      recomputes nothing about them except the root-block specialization.
    - >-
      Factor-base logs are obtained generically by batch rho at
      P = O(sqrt(|F| N)); the cost figure is the Kuhn-Struik sqrt(2 L N) total
      for L logs as relayed in IDEA-20260906-ee3543's retrieved citation.
    - >-
      Constants from signs, orderings (3!) and the factor 1/2 in |F| are
      absorbed in p^{o(1)}; they matter at toy scale and are measured in
      Step 2.
    - >-
      Scope: prime-order ordinary curves over F_p with no low embedding degree,
      no anomalous structure and no small-degree endomorphism beyond negation.

  proof_search_map:
    bottleneck: >-
      The joint small-root capacity kappa_joint of the coupled system
      {S_3(x1, x2, y), S_3(y, x3, x_R)} at bounds (beta, beta, beta, gamma):
      alive iff kappa_joint > 8/5.
    baseline_embedding:
      parameter_slice: >-
        m = 2, w = 0: one bivariate S_3 specialization, full-box reach 2/3,
        demand 2/3, S T^2 = p exactly -- the generic line of KN-LIT-013 as a
        slice of the family.
      reproduction_check: >-
        Symbolic: eps_req_pre(2, 0) = 1/2 + 1/6 = 2/3 and the tool's closed form
        2n/(d(n+1)) = 2/3 at n = d = 2; to be frozen as a unit test beside the
        committed tests/test_smallroot_reach.py.
    observation_collision:
      observable: >-
        The Jochemsz-May condition, a function of the Newton polytopes and the
        bounds only.
      distinct_preimage_search: >-
        Collision exhibited by construction: the summation pair and a random
        pair with identical polytopes have the same observable. So Step 1
        cannot tell whether summation structure helps or hurts; Step 2's
        planted-root recovery on both pairs is the separating measurement.
        A second collision: CONVENTION 1 and CONVENTION 2 assign different
        capacities to the SAME root set, which is the defect this record
        exposes.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The preprocessing decision rewritten as one linear inequality in
          (beta, gamma) against a lattice-determinant condition (kappa_joint >
          8/5), with encoding (window factor base), completeness (roots in the
          box are found, H-A2), soundness (certificate by scalar
          multiplication), transfer (yield H-A1) and cost-loss (finite t)
          obligations separated.
        predicted_gain: >-
          An exponent decision in seconds of CPU instead of a toy crossover
          measurement.
      - transform: boundary_lift
        proposed_object: >-
          The m = 2 tie as the boundary; (3, 1) as the strict inward step.
        predicted_gain: >-
          Strict improvement only if kappa_joint > 8/5; otherwise a certified
          non-improvement at the first inward step.
    quantifier_order: >-
      EXISTS (beta, gamma) with 5 beta + 2 gamma > 3 such that FOR ALL
      sufficiently large primes p and FOR ALL prime-order curves E/F_p in scope,
      FOR a 1 - o(1) fraction of targets Q (over the online randomness c), the
      online algorithm returns log Q after p^{2 - 3 beta - gamma + o(1)}
      expected trials, ASSUMING H-A1 and H-A2. The witness (beta, gamma) may
      not depend on p or on E.
    method_ceiling:
      strongest_certifiable_claim: >-
        A heuristic exponent (conditional on H-A1, H-A2), never an unconditional
        algorithm; at toy scale, measured recovery rates and yields.
      nearby_object_control: >-
        m = 2 (where the hoped-for strict improvement must fail -- it is a tie)
        and the eliminated S_4 formulation of (3, 1) (dead under every
        convention); a method that called either alive would be flagged before
        (3, 1) is believed.
    proof_obligations:
      - claim: >-
          |F| = p^beta (1 + o(1)) for the x-window [0, p^beta). For beta > 1/2
          this follows from Weil-type character-sum bounds (error
          p^{1/2 + o(1)}); at the relevant beta near 0.23 those bounds are
          vacuous, so the count is part of heuristic H-A1 and is measured, not
          assumed, at toy p.
        responsibility: size
      - claim: >-
          The joint shift lattice has dimension O(t^4) and LLL runs in
          poly(t, log p); finite t loses O(1/t) in the exponent.
        responsibility: runtime
      - claim: >-
          Under H-A2, every root inside the box is recovered by resultants of
          the short vectors.
        responsibility: correctness
      - claim: >-
          Under H-A1, the per-trial success probability is
          p^{3 beta + gamma - 2 + o(1)}.
        responsibility: success_probability
      - claim: >-
          Advice S = |F| log2 p bits; online memory poly(t, log p); precomputation
          P = O(sqrt(|F| N)) by batch rho.
        responsibility: memory
      - claim: >-
          log Q = sum eps_i log P_i - c, certified by one scalar multiplication.
        responsibility: interface
      - claim: >-
          Every statement is scoped to prime-order curves over F_p in the stated
          class and to the reach convention used.
        responsibility: scope
    not_applicable_reason: null

