  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR IS STEP 0 + STEP 1: a symbolic
      re-derivation and an exact polytope computation, no sampling, no curve,
      seconds of CPU after a small extension of an existing, calibrated
      calculator. Its output is one number compared with 8/5, and both sides of
      the comparison are recordable results (an escape candidate, or the
      preprocessing extension of the closure with a measured margin plus an
      audit of the committed root-block convention). Steps 2-3 run only on an
      ALIVE or near-threshold Step 1.
    controls:
      - univariate Coppersmith calibration (reach exactly 1/d) re-run on the extended calculator
      - single-S_3 reproduction (0.8408) when the second equation is dropped
      - bivariate full-box reproduction (2/3) and the m = 2 generic-line tie
      - near-polytope random pair (identical polytopes, random coefficients)
      - eliminated S_4 formulation of the same root set, computed beside kappa_joint
      - outward decay of LLL recovery across the computed boundary (Step 2)
    required_metrics:
      - kappa_joint(gamma) curve and the region R_joint, with the t -> infinity extrapolation interval
      - per-variable exponent sums s_x1, s_x2, s_x3, s_y, s_p at each t used
      - root-block bivariate reach on its true polytope
      - re-scored eps_available for every (m, w) row of the committed decision table
      - (Step 2) recovery rates with Wilson intervals per (p, beta, gamma, t) cell; yields per toy p

  falsification_conditions:
    - >-
      kappa_joint <= 1.59: the preprocessing model does not rescue the windowed
      family at (3, 1); recorded as a closure with the measured margin, and the
      lane's forward guidance moves to rank-2 GAP windows and non-tree systems.
    - >-
      kappa_joint > 1.61 but Step-2 LLL recovery inside the region is below 0.5
      at every p: H-A2 fails for the coupled system; the Step-1 number is a
      polytope artifact and no exponent is claimed.
    - >-
      The extended calculator fails any calibration control (univariate 1/d,
      0.8408, 2/3): instrument void; no decision is reported.
    - >-
      Measured yields deviate from the model by more than a factor 2 at the
      largest toy p: H-A1 fails and the online exponent is re-derived from the
      measured yield before any comparison.

  confounders:
    - >-
      Convention drift: the committed product-of-bounds rule is only valid for
      polytopes symmetric in their variables; applying it to the coupled
      system silently mixes per-variable weights. Step 1 evaluates
      prod_i X_i^{s_i} < p^{s_p} directly.
    - >-
      Finite multiplicity: reach at finite t is below the t -> infinity value
      by O(1/t); an alive verdict at t -> infinity with a margin smaller than
      the t = 4 gap is not usable at any concrete size.
    - >-
      Algebraic independence (H-A2) is the heuristic most likely to fail near
      lattice density one, which is where (3, 1) sits (3 beta + gamma near
      1.6-1.7 of a ceiling 2).
    - >-
      Gamma = 1 corner: the best exponent sits at an unconstrained internal
      node, where the coupled and eliminated formulations differ most; a
      decision that holds only at gamma = 1 is reported as such.

  interpretation_limits:
    - >-
      Proposal only; no run, evidence or approval exists. Every exponent in
      this record is a model number under the committed reach convention or
      its stated variant.
    - >-
      Even an ALIVE Step 1 is heuristic (H-A1, H-A2) and toy-validated at best;
      a claim below the generic line is a breakthrough-class claim under
      AGENTS.md rule 12 and needs review-breakthrough before any status change.
    - >-
      A DEAD Step 1 closes only the (3, 1) windowed tree under Jochemsz-May
      lattices; rank-2 GAP windows, non-tree systems and superpolynomial
      lattice dimension stay open (CLOSURE.md section 6), now with a
      preprocessing-model threshold to beat.
    - >-
      Nothing here concerns curves over extension fields, where preprocessing
      index calculus is a different (and known) story.

  heuristic_assumptions:
    - id: H-A1
      statement: >-
        YIELD EQUIDISTRIBUTION. For p prime, E/F_p in scope, F = {P : x(P) in
        [0, p^beta)} and 0.2 <= beta <= 0.37, 0.5 <= gamma <= 1: |F| =
        p^beta (1 + o(1)), and for R uniform in E(F_p) the number of triples
        (P1, P2, P3) in F^3 with x(P1 + P2) in [0, p^gamma) and
        P1 + P2 + P3 in {R, -R} is asymptotically Poisson with mean
        kappa_0 p^{3 beta + gamma - 2} (kappa_0 the counted sign/ordering
        constant), uniformly in that range.
      rigorous_support: >-
        Rigorous: exact re-randomisation (R uniform); Weil-type character-sum
        bounds for points with x-coordinate in an interval (recalled, e.g.
        Kohel-Shparlinski-type exponential sums over x-intervals; not
        retrieved) give equidistribution of such points and of their sums up
        to a p^{1/2 + o(1)} error term, which is non-trivial only for windows
        longer than p^{1/2}. Imitated classical statement: sums of independent
        uniform elements of a finite abelian group are uniform, and the number
        of representations of a uniform target by a random set of the given
        size is Poisson.
      validation_plan: >-
        Exact enumeration at p in {2^20, 2^24, 2^28} (three curves each):
        tabulate F, all pairs with x(P1 + P2) in the gamma-window, and, for
        10^4 uniform R per (beta, gamma) cell on a 4 x 3 grid, the exact count
        of representations. Compare |F| with p^beta, the empirical mean with
        kappa_0 p^{3 beta + gamma - 2} and the count histogram with Poisson;
        tail check: the fraction of R with zero representations against
        exp(-mean) and the maximal count against the Poisson order statistic.
        Transfer to cryptographic p is an assumption, stated as such.
    - id: H-A2
      statement: >-
        JOINT LATTICE INDEPENDENCE. For the coupled system at multiplicity t,
        whenever the Jochemsz-May determinant condition holds at the true
        bounds, the three shortest LLL vectors define polynomials whose common
        zero set with the two original equations is zero-dimensional and
        contains the planted root, for all but a p^{-Omega(1)} fraction of
        instances.
      rigorous_support: >-
        Howgrave-Graham's lemma is unconditional (a short enough vector gives an
        identity over Z); only the algebraic independence of several such
        vectors is heuristic. Imitated classical statement: generic
        polynomials with prescribed Newton polytopes meet in the BKK number of
        points (zero-dimensional intersection).
      validation_plan: >-
        Step 2 planted-root probes: p near 2^40, 2^64, 2^96; t in {2, 3, 4};
        (beta, gamma) on a grid straddling the Step-1 boundary; 50 instances
        per cell; recovery rate with Wilson intervals; the near-polytope random
        pair run identically as the null. Tail check: the smallest margin
        inside the region at which recovery stays >= 0.9, compared with the
        O(1/t) finite-multiplicity prediction.

  target_complexity:
    time_exponent: >-
      CONDITIONAL ON kappa_joint. At the best vertex (gamma = 1,
      beta = (kappa - 1)/3) the online cost per target is T = p^{2 - kappa + o(1)}
      trials of poly(t, log p) each, with S = p^{(kappa - 1)/3} and
      S T^2 = p^{(11 - 5 kappa)/3}. Under CONVENTION 1 (kappa = 1.6816):
      T = p^{0.318}, S = p^{0.227}, S T^2 = p^{0.864}. Under CONVENTION 2
      (kappa = 1.5075): best S T^2 = p^{1.154}, worse than generic, i.e. no
      algorithm.
    memory_exponent: >-
      Advice S = p^{beta} log2 p bits with beta = (kappa - 1)/3 (0.227 under
      CONVENTION 1); online lattice memory poly(t, log p); precomputation
      working memory of batch rho O(sqrt(|F| N)) distinguished points at most.
    best_known: >-
      Generic: S T^2 = Theta~(p) (KN-LIT-013, tight), e.g. Bernstein-Lange
      (KN-LIT-3060) at S = T = p^{1/3} with 1.77 p^{1/3} online after
      1.24 p^{2/3}; at S = p^{0.227} the generic online bound is p^{0.386}.
      No advice: rho, p^{1/2}.
    hidden_overhead: >-
      The o(1) hides the finite-multiplicity loss O(1/t) and LLL on lattices
      of dimension O(t^4) -- polynomial in log p for fixed t but with very
      large constants, so any alive verdict must be re-priced at t in {2, 3, 4}
      before a concrete-cost table exists. Sign/ordering constants (3!, 2^3)
      and the |F| constant are absorbed.
    tradeoff_note: >-
      Along the feasible segment S ranges over p^{0.2} to p^{0.36} with S T^2
      rising from its minimum toward p; precomputation P = p^{(1 + beta)/2}
      stays below the Bernstein-Lange p^{2/3} throughout. Trials are
      independent, so online work parallelises perfectly across trials and
      targets; the table is read-only.

  dominated_by: >-
    n/a (no result claimed). Rows checked for the conditional point: the
    Bernstein-Lange table (S = T = p^{1/3}, S T^2 = p), the Corrigan-Gibbs-Kogan
    generic algorithm (S T^2 = p up to logs), rho with no advice (S = 0,
    T = p^{1/2}), the growth and re-selection tables of this RQ
    (IDEA-20260906-a3d6ae, H-ECDLP-37dc01; constant-factor, generic),
    H-MTIC-001 (no evidence record), and transfer attacks (MOV, anomalous;
    out of scope for generic prime-order curves). Under CONVENTION 2 the
    conditional point is dominated by every generic row; under CONVENTION 1 it
    would dominate them on S T^2 for S in [p^{0.2}, p^{0.36}].
  sota_delta: >-
    Conditional on kappa_joint: S T^2 exponent (11 - 5 kappa)/3 against 1.
    kappa = 1.6816 gives 0.864 (delta -0.136; online p^{0.318} vs generic
    p^{0.386} at equal S); kappa = 1.6 gives 1.000 (delta 0); kappa = 1.5075
    gives 1.154 (no algorithm). No measured delta exists.

