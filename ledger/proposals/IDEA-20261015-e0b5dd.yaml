idea:
  id: IDEA-20261015-e0b5dd
  question_id: RQ-CMFB-33610e
  added: '2026-10-15'
  title: >-
    Pushing crater bases through the conductor-v isogeny: exact conservation
    through a group isomorphism, exact structure only on the twist half of the
    x-line, and the push-cost bill
  class: measurement
  claim: >-
    (A) Frobenius is -1 on E[v] (pi + 1 = vw), so all v+1 subgroups of E[v] are
    F_p-rational kernels; each phi: E -> E_f is a floor isogeny defined over F_p
    and restricts to a group isomorphism G -> G_f (gcd(v, N) = 1). So for every
    base S and arity m the yield, coverage and relation rank of phi(S) equal
    those of S exactly (KN-FIND-007 through an isomorphism); a floor advantage
    can only be solve-side, and coverage gain is capped near 1.58. (B) phi_x
    (degree v) maps x(E(F_p)) bijectively onto x(E_f(F_p)) but maps the other
    half of F_p (twist type; E'(F_p) = Z/v x Z/5v contains the whole kernel)
    v-to-1 onto only (5v-1)/2 = 86,224,257 values. All exact structure of the
    v-isogeny sits on the half of the x-line an ECDLP on E never visits.
    (C) Pushing a base of B = (6N)^{1/3} ~ 3.3e5 elements costs B * O(sqrt v)
    ~ 2^31 ops (sqrt-Velu, v = 34,489,703) against rho ~ 2^26: dominated
    before any decomposition. (D) The one open measurement is whether the
    pulled-back floor window phi^{-1}(S_f) is independent of the crater window S.
  mechanism: >-
    PAIR: representation = two charts of one group element, (x, x_f = phi_x(x)),
    a joint window {x < B1, x_f < B2}; operation set Sigma = phi|_G plus
    translation by base elements. TRICHOTOMY: Class III coordinate-dependent
    (membership is a property of the chart pair). LOSSY-PROJECTION TEST: the
    pair map G -> (x, x_f) is injective, so it alone is a change of
    coordinates and is not an object; the lossy part is the window thinning,
    Sigma-compatible only as the usual +- fold (no further branching).
    Price: push cost B sqrt(v) plus the scan cost of the joint window. Delta
    over EV-ICI-0bdaaa (Elkies ell <= 23, random prime-order curves) and
    IDEA-20260808-031a59 (class aggregation cost-neutral even with free
    transport): the conductor edge, whose kernel is rational torsion of the
    twist, with the exact image sizes in (B) as an instrument positive control.
  novelty_status: adaptation
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-955fd6
      - KR-IC-5931ee
      - KR-IC-73db3f
      - KR-IC-791cb7
      - KR-IC-f5c584
      - KR-RHO-755e35
    nearest:
      - ref: KN-FIND-007
        provenance: internal
        relation: special_case
        delta: (A) is the conservation identity transported by an isomorphism.
      - ref: KR-RHO-755e35
        provenance: kb
        relation: special_case
        delta: >-
          Isogenous curves are equally hard (Tate, JMV); (A) is the
          index-calculus form for one edge: no yield, coverage or rank change.
      - ref: KN-TECH-6a2ef9
        provenance: internal
        relation: adjacent
        delta: >-
          rho cost is blind to crater/floor level on pair-class curves; this
          record asks the same for index-calculus coverage and overlap.
      - ref: KR-IC-955fd6
        provenance: kb
        relation: adjacent
        delta: torsion symmetry saves a constant; here the torsion is on the twist.
      - ref: KR-IC-f5c584
        provenance: kb
        relation: orthogonal
        delta: >-
          The trace morphism E -> F_2 is a char-2 linear equation; the
          prime-field analogue would be a homomorphism G -> F_N, which is
          the Theorem C object and is an isomorphism here, giving nothing new.
      - ref: KR-IC-791cb7
        provenance: kb
        relation: orthogonal
        delta: binary-field GHS and isogeny walks; this record is prime-field only.
  citations:
    - ref: arXiv:1111.1543
      provenance: retrieved
      claim: >-
        upper bounds for y^2 = f(x) mod p in boxes of side M; no
        equidistribution below side p^{1/2} claimed in the abstract
      verified_by: idea-generator (abstract fetched 2026-10-15; body not read)
  proof_search_map:
    bottleneck: independence of the two chart windows; push cost
    baseline_embedding:
      parameter_slice: phi = identity (B2 = all) is the plain small-x base
      reproduction_check: ratio 1 exactly when phi is replaced by identity
    observation_collision:
      observable: overlap count of phi_x(S) with S_f
      distinct_preimage_search: random bijection of x(E) onto x(E_f) matches it
    quantifier_order: for all bases S, all m; exact for yield and rank
    method_ceiling:
      strongest_certifiable_claim: conservation (A) and image sizes (B), exact
      nearby_object_control: >-
        degree-N isogeny (kernel G), where phi|G is not injective and (A) fails
  predictions:
    - metric: size of phi_x(twist-type x) at toy members
      direction: different
      minimum_effect: exactly (5v-1)/2, and phi_x injective on the E-type half
    - metric: overlap ratio of phi_x(S) with S_f over its expectation 2B^2/(N-1)
      direction: different
      minimum_effect: inside 0.8 to 1.25 at 100 or more expected hits
    - metric: m = 3 coverage ratio of S united with phi^{-1}(S_f) vs random
      direction: higher
      minimum_effect: none expected; capped near 1.58
  minimal_test:
    design: >-
      Family members with v ~ 2^10..2^13 (p ~ 2^22..2^28); Velu phi from one
      kernel subgroup; verify (B) by brute force; overlap with B = c sqrt(N),
      c in {2, 4, 8}; slope in bit size over 3 sizes; m = 3 coverage by exact
      counting.
    controls:
      - random bijection null
      - identity chart
      - Elkies isogenies of degree 3, 5, 7 on the same curves
      - planted overlap as positive control
    required_metrics: [image sizes, overlap ratio with CI, coverage, push ops]
  falsification_conditions:
    - overlap ratio >= 2 with permutation p < 1e-4 at >= 2 sizes (resonance)
    - image-size identity in (B) fails (theory or instrument error)
  confounders: [kernel choice among v+1, p mod small primes, tiny-v effects]
  interpretation_limits: >-
    Toy sizes only; no growth claim without three sizes. KN-OPEN-020 class:
    implicit-membership (membership = phi-hat plus scalar mult, sqrt(v) +
    log N). Equidistribution of phi_x on short windows is unproved for every
    degree (Weil error deg*sqrt(p) exceeds window size p^{1/3}).
  heuristic_assumptions:
    - id: H1
      statement: >-
        phi_x restricted to E-type x acts as a random bijection on interval
        windows of size ~ p^{1/3}.
      rigorous_support: none below side p^{1/2}; imitates the birthday law
      validation_plan: >-
        overlap histogram vs Poisson at 3 sizes, 5 curves each, tail = max
        overlap; transfer to 2^52 by extrapolation only
  target_complexity:
    time_exponent: no exponent claim; push cost alone ~ N^{7/12} at pair 46
    memory_exponent: O(B)
    best_known: rho 0.886 sqrt(N), O(1) memory
    hidden_overhead: sqrt(v) per pushed element (v ~ sqrt(p/5))
  dominated_by: n/a (no result claimed); dominated by rho
  sota_delta: none
  estimated_cost: {implementation: medium, compute: low}
  recommended_priority: low
  status: proposed
