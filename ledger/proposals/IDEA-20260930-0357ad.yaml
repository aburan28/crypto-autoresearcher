  assumptions:
  - B is the lexicographic explicit subset of the odd-order subgroup of size m, frozen before any fiber
    statistic is read. n=7 uses the parameters in H-KIC-9416d9. n=11 enumerates its own order.
  - Swap-orbits of pairs with P = S are kept as a separate stratum because the swap fixes them. They are
    not dropped.
  - Canonicalisation may not treat a hash table built from the explicit pairs as an uncharged primitive.
    The build is charged to the shear-key procedure if that procedure uses it.
  - Full translation is not in Sigma. A shear that leaves B x B is not applied.
  - The point set is scoped out as an enumerated base. No high-degree escape is claimed.
  proof_search_map:
    bottleneck: The canonicalisation scan that recovers one ordered pair from a sum point T. If that scan,
      charged, is not cheaper than having stored the pair, the representation does not change the decomposition
      cost.
    baseline_embedding:
      parameter_slice: n=7, m=12, every subgroup target, explicit-pair enumerator versus shear-key enumerator,
        same B.
      reproduction_check: The verified triple sets are identical, and the multiset of sums produced by
        the explicit pairs equals the key set of the shear table.
    observation_collision:
      observable: The sum point T = P+S.
      distinct_preimage_search: List every T whose fiber contains two distinct swap-orbits. Those are
        the observation collisions. If none exist, L=0 and the representation fails the lossy test.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: Store T instead of the ordered pair, and canonicalise by scanning B.
      predicted_gain: None on charged multiplications. The predicted ratio shear/explicit is at least
        1.
    - transform: observable_fiber
      proposed_object: The fiber of T inside B x B modulo swap.
      predicted_gain: Decides whether the object is lossy. A fiber of size 1 rejects it.
    quantifier_order: 'For all frozen (n, m, B-rule) and for every subgroup target at n=7 and every target
      in a frozen 64-element list at n=11: both procedures run. The fiber statistic is computed on all
      pairs before any target is solved, so the target list cannot select the base.'
    method_ceiling:
      strongest_certifiable_claim: Either the fiber is nontrivial and the charged canonicalisation still
        does not beat explicit pairs, or the fiber is trivial and the representation is not lossy. No
        ECDLP exponent.
      nearby_object_control: Replace B by a coset of a subgroup of size m when one exists inside the curve
        group, and by an arithmetic progression of length m in the relabelled Z/rZ. A real shear symmetry
        should raise the mean fiber. If the fiber stays 1 on the progression as well, the meter is not
        reading shears.
    proof_obligations:
    - claim: T is unchanged by the swap and by any shear that preserves B x B.
      responsibility: correctness
    - claim: Verified triple sets match.
      responsibility: baseline
    - claim: Hash construction cost is inside the shear-key total if a hash is used.
      responsibility: runtime
    - claim: L = log2(mean fiber size) is reported, and L=0 rejects the lossy claim.
      responsibility: strictness
    not_applicable_reason: The proof_search_map applies in full. This field records that no block was
      skipped. The claim is a finite charged-cost comparison.
  predictions:
  - metric: shear_key_field_multiplications_over_explicit_pair_field_multiplications
    direction: higher
    minimum_effect: 1.0
  - metric: symmetric_difference_of_verified_triple_sets
    direction: lower
    minimum_effect: 0
  - metric: mean_swap_orbits_per_sum
    direction: different
    minimum_effect: a value different from 1 is lossy; a measured mean of 1 rejects the lossy-projection
      claim on that base
  minimal_test:
    design: 'Freeze B as above. Enumerate all swap-orbits, compute T = P+S, and record fiber sizes before
      solving any target. Then solve every n=7 subgroup target and the frozen n=11 target list by the
      explicit-pair method and by the shear-key method. The shear-key method''s allowed implementations
      are (i) the naive scan of B for each probed T and (ii) a hash built from the pairs with its build
      cost included. Report both. Canonical representative: smallest x-coordinate, then smallest y. Replay
      every accepted triple independently. Measure L and b against identity, a random relabeling of the
      sum key, and the relabelled Z/rZ law.'
    controls:
    - 'Identity: curve addition, both procedures.'
    - 'Random-label: replace each sum key by a uniform random group element and confirm that verified
      yield collapses.'
    - 'Relabelled Z/rZ: same cardinality, cyclic addition, fiber sizes recomputed.'
    - 'Nearby shear control: arithmetic progression in Z/rZ of length m.'
    - 'Equal-yield control: symmetric difference of verified triples must be empty before ratios are interpreted.'
    required_metrics:
    - mean and maximum fiber size, and L
    - b of IDEA-20260802-002 on the sum-point map, three controls
    - field multiplications for explicit pairs, naive scan, and hash-build-plus-probe, separately
    - verified triple-set digests
    - fraction of sums whose fiber has size 1
    - canonicalisation subtractions charged
  falsification_conditions:
  - Mean fiber size is 1 on the lexicographic B at n=7. The projection is not lossy there, and the representation
    claim is rejected for that base. This is a successful negative of the object, not an implementation
    failure.
  - With hash build charged, or with the naive scan, the shear-key multiplication count is strictly smaller
    than the explicit-pair count and the verified sets match, at n=7. The predicted 'does not pay' claim
    is then false.
  - The verified sets differ.
  - The random-label control still returns the curve's triples. Replay is not bound to the key, and the
    run is invalid.
  confounders:
  - Leaving the hash build uncharged makes the probe look free. The test reports the build on the same
    side as the probes.
  - A base that was chosen because it has repeated sums manufactures L>0. B is lexicographic, not selected
    for collisions.
  - Counting ordered pairs on one side and swap-orbits on the other doubles a cost. Both sides use swap-orbits,
    with the diagonal stratum separate.
  - n=11's 64 targets can miss a yield difference that the exhaustive n=7 cell would see. n=7 is the decision
    cell for yield equality.
  interpretation_limits:
  - The factor base is an explicit list inside the scoped-out enumerated class. No KN-OPEN-020 escape
    is claimed. The idea stops as a factor-base proposal.
  - A ratio near 1 is an accounting result about canonicalisation. It is not an ECDLP speedup and it does
    not move the exponent 1/2.
  - Nontrivial fibers are relations among base points. They are not a discrete-log algorithm.
  - Kummer x-only keys are not used. A later variant that drops y is a different proposal and is closed
    by the Kummer-line constraint.
  heuristic_assumptions:
  - id: H1
    statement: 'For the lexicographic base of size m=12 on the n=7 subgroup of order 71, the number of
      swap-orbits of distinct pairs that land on a single sum behaves like the occupancy of M about m^2/2
      throws into a set of size r=71: the expected mean fiber among occupied sums is about M / (r * (1-(1-1/r)^M)),
      the classical occupancy conditional mean. This is a heuristic about the curve. The random-label
      control satisfies it by construction up to sampling error.'
    rigorous_support: For a uniformly random function from a set of M pairs to a group of order r, the
      conditional mean load of occupied bins is the classical occupancy identity M / (r * p_hit) with
      p_hit = 1-(1-1/r)^M. That is a theorem about random functions (Feller), not about elliptic pair
      sums. IDEA-20260806-c5d183, as stated in docs/object-frame-ideation.md which was read this session,
      says a deterministic full-translation projection on a prime-order subgroup is constant or injective;
      it does not predict pair-sum fibers.
    validation_plan: 'Sample: all swap-orbits on the n=7 lexicographic B, m=12, and on the n=11 lexicographic
      B, m=16. Comparison distribution: the occupancy conditional mean above, and the fiber histogram
      of the relabelled Z/rZ pair sums with the same M. Tail check: maximum fiber versus the Poisson tail
      of mean M/r, and the fraction of occupied sums with fiber 1 versus exp(-lambda) for lambda = M/r
      under the approximation that is valid only when lambda is the random-function mean. Tested parameters:
      n=7, r=71, m=12; n=11, r computed in-test, m=16. Transfer assumptions: none to cryptographic n,
      and none from the cyclic control to the curve. If the curve''s mean fiber differs from the cyclic
      mean by a factor outside [0.5, 2], H1 is false and the cost claim is still decided by its own ratio.'
  target_complexity:
    time_exponent: Unchanged at 1/2 versus Pollard rho. Both procedures are Theta(m^2) group operations
      at fixed m, or Theta(m) per target after a Theta(m^2) table. Neither is an ECDLP algorithm below
      rho.
    memory_exponent: Explicit pairs store Theta(m^2) points. The shear key stores one sum per occupied
      fiber, which is at most Theta(m^2) and at least the number of distinct sums. Distinguished-point
      rho stores polylog(r). This representation does not improve that.
    best_known: Pollard rho, time exponent 1/2, binary-curve S about 1.25 as named in the task brief,
      not re-derived here. The stage baseline is the explicit-pair enumerator on the same B.
    hidden_overhead: No o(1) hiding an attack. The overhead that must stay visible is the canonicalisation
      scan or the hash build, the diagonal stratum, and the final group replay.
    tradeoff_note: Storing sums instead of pairs saves a constant factor in memory only when fibers are
      large, and spends that factor again if canonicalisation rescans B. No van Oorschot-Wiener interpolation
      is claimed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: Pollard rho on time (exponent 1/2) and on memory (distinguished points). The stage is
    dominated by the explicit-pair enumerator whenever the charged shear-key ratio is at least 1, which
    is the predicted outcome. The 24 KR-IC rows at the named commit do not contain a cheaper prime-degree
    binary decomposition exponent that this representation claims to beat.
  sota_delta: 'Time exponent versus rho: 1/2 versus 1/2, delta 0. Memory exponent versus distinguished-point
    rho: no improvement, delta 0 on the ECDLP. Stage prediction: shear-key multiplications / explicit-pair
    multiplications >= 1, so the stage delta is zero or negative for the new representation.'
