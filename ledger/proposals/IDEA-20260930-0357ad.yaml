idea:
  id: IDEA-20260930-0357ad
  question_id: RQ-KIC-7502b9
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: Shear-fiber loss of an ordered pair, canonicalised against explicit pairs
  class: representation
  claim: On the toy binary Koblitz curves at n=7 and n=11, representing an unordered decomposition witness
    by the sum of an ordered pair (an R3 point of E x E) does not lower the charged field-multiplication
    count of exact three-point decomposition below the count for storing the ordered pair itself, once
    canonicalisation of the fiber is charged. The predicted ratio of shear-key multiplications to explicit-pair
    multiplications is at least 1. Representation class R3. The attack stage is relation decomposition.
    Time and memory exponents versus Pollard rho stay at 1/2 and at distinguished-point polylog memory;
    this is a constant-factor representation test. If the mean fiber has size 1, the projection is not
    lossy and the representation is rejected on that base. If the ratio drops below 1 while the verified
    triple sets match, the representation pays for itself and the predicted rejection is false.
  mechanism: 'OBJECT FRAME. Representation: R3, an ordered pair (P,S) as a point of E x E, not a function
    of one curve point and not a Kummer coordinate. Operation set Sigma: the shears (P,S) -> (P+b, S-b)
    for those b in the explicit base B for which both P+b and S-b still lie in B, together with the swap
    (P,S) -> (S,P). Sigma does not contain the full translation action of the subgroup. Translating both
    legs by the same arbitrary group element is not included. Trichotomy: branching. Reason: on an explicit
    base that is not a coset of a subgroup, the only shear that preserves B x B is often b = 0, so the
    collisions of distinct pairs with the same sum are not a block system of a nontrivial shear group.
    They are branching events. The swap is a genuine symmetry of the ordered pair; it is not enough to
    make the sum a lossless label of the swap-orbit when two swap-orbits share a sum.


    LOSSY-PROJECTION TEST, against this Sigma. The tracked object is the sum point T = P+S, kept as a
    full point (x,y), not as x alone. Discarded: which ordered pair produced T, including the shear parameter
    when a nontrivial shear exists, and the swap order. Swap-discard is Sigma-compatible because T is
    unchanged by the swap. Shear-discard is Sigma-compatible when the shear preserves B x B, because those
    shears were defined to preserve T. The projection is lossy only when the mean number of swap-orbits
    of pairs inside B x B that produce one T is greater than 1. A fiber of size 1 means the sum is a rekeying
    of that pair, which is a coordinate change and fails the test. That failure is a pre-registered outcome,
    not a reason to skip the cell.


    CANONICALISATION, the open number. Given T, recover a canonical pair by scanning b in B, testing whether
    T-b lies in B, and choosing the lexicographically smallest b that succeeds. Price: |B| group subtractions
    and |B| membership tests per distinct T in the naive scan, or one hash probe per b if pair sums were
    stored. The explicit-pair baseline stores each swap-orbit once and never recovers it from T. The claim
    is that charging the scan, or charging the build of the hash that makes the scan O(1), does not beat
    storing the pairs. The hash build is the same pair enumeration the baseline already paid, so a hash
    that is then used as if it were free is an accounting error and is forbidden.


    Three-point predicate. A relation is P+S+R = Q with P,S,R in B. The shear-key procedure enumerates
    R in B, looks up Q-R in the sum table, and canonicalises one pair. The explicit procedure enumerates
    swap-orbits (P,S) and tests whether Q-(P+S) lies in B. Both replay the group law. F2 is the named
    component that supplies this predicate. Added: the fiber-loss test and the canonicalisation price.
    Not added: a new point set.


    What was avoided. Not the x-only Kummer line. Not u = x+1/x (IDEA-20260921-457a46). Not the trace-conditioned
    subset of a subspace (IDEA-20260926-a79052). Not affine flats (IDEA-20260921-f4a758, H-KIC-77b47b).
    Not a Frobenius-closed base (KR-IC-b0fcda) and not an endomorphism-orbit representative as the lens
    (F6). Not tau-Horner (IDEA-20260926-197ecf). Not summation polynomials. Not 2-torsion symmetry as
    a summation-polynomial speedup (KR-IC-1fcdbc forecloses that speedup; this idea does not claim one).
    The slope-join of IDEA-20260930-bbef7f is a different object (chord slope on a multiplicative coset).
    This object is the sum point of an explicit pair.


    KN-OPEN-020. The point set is an explicit enumerated toy base and is inside the scoped-out class.
    The idea does not propose a new factor base and stops on that axis. The sumset membership test ''T-b
    in B'' is implicit-membership of the sumset, used only as the canonicalisation procedure, not as an
    escape.'
