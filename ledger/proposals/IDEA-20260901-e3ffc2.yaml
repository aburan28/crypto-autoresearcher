      - transport certificate per instance, [k_i]phi_i(P_i) == phi_i(Q_i) recomputed independently (blocking)
      - automorphism-discounted multi-target control on CM vertices (KN-TECH-018)
      - matched BSGS rows, separate and multi-target, memory charged (KN-TECH-031)
