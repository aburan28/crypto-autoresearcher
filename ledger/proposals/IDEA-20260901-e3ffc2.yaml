idea:
  id: IDEA-20260901-e3ffc2
  question_id: RQ-ECDLP-165d4b
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-165d4b has no bound GOAL record at the time of filing
    (context file for TASK-20260901-da5e05). Left null deliberately, not
    omitted.
  added: '2026-09-01'
  title: >-
    THE CENSUS'S "CHARGED ISOGENY TRANSFER" COLUMN IS EMPTY PER INSTANCE AND
    NON-EMPTY PER POPULATION, AND THE TWO READINGS ARE SEPARATED BY ONE
    CHARGED TOY RUN WITH TWO FORCED CONTROLS: transporting m independent
    ECDLP instances that live on m DIFFERENT curves of one ordinary
    prime-order F_p-isogeny class onto ONE curve (two Velu point-evaluations
    per instance, transport theorem T1) turns m separate rho solves at
    m*0.886*sqrt(N) into one shared-distinguished-point multi-target solve at
    c*sqrt(m*N) -- the Kuhn-Struik object of IDEA-20260731-013 -- so the
    transfer arm's value is exactly the multi-target amortisation
    ratio ~ 1/sqrt(m) minus the transport charge, is provably ZERO at m = 1
    (IDEA-20260830-a22049), and the census must record it as a
    POPULATION-LEVEL column with a ceiling that ties Kuhn-Struik on a single
    curve and never beats it
  class: composition

  claim: >-
    (A) THE TWO READINGS OF ONE METHOD NAME. RQ-ECDLP-165d4b lists "charged
    isogeny transfer" among its methods and asks whether to prioritise it
    against endomorphism-orbit methods. Every screened record reads the method
    PER INSTANCE: move (E, P, Q) to a classmate E' and solve there.
    IDEA-20260829-20b05f bounds that prize by the class spread S(C);
    IDEA-20260830-a22049 derives S(C) <= 1 + 0.09*rho_dbl for r-adding rho and
    composes it with EV-ENDO-10109d's measured transport charge (1.5x at ell=3
    to 21x at ell=31) to close the per-instance arm as net-negative at every
    tested ell. This record accepts that closure and states the reading it
    does not cover: PER POPULATION. Given m instances (E_i, P_i, Q_i),
    Q_i = [k_i]P_i, with INDEPENDENT unknown k_i, on m DISTINCT curves E_i of
    one ordinary prime-order F_p-isogeny class, transport each instance by an
    explicit F_p-isogeny phi_i: E_i -> E_0 with gcd(deg phi_i, N) = 1 to a
    common curve E_0 (T1: phi_i(Q_i) = [k_i] phi_i(P_i), same k_i). The m
    transported instances are then m targets in ONE group, and the shared
    distinguished-point multi-target walk (van Oorschot-Wiener / Kuhn-Struik;
    the object of IDEA-20260731-013) solves all m at about c*sqrt(m*N) group
    operations total instead of m*0.886*sqrt(N).

    (B) THE CHARGED LEDGER, WRITTEN BEFORE ANY RUN. Per instance the transport
    costs one path-finding step plus two point evaluations. Write
      W_sep(m)  = m * 0.886 * sqrt(N)                          (m separate solves)
      W_pool(m) = c * sqrt(m*N) + m * (C_path + 2 * c_eval)     (pooled)
    with c the multi-target constant (NOT asserted here; IDEA-20260731-013 and
    EV-IC-002 OBS-9 both decline to assert it), C_path the charged cost of
    finding and constructing the isogeny path E_i -> E_0, and c_eval the
    per-point Velu evaluation cost (about 6*L*ell field operations for a path
    of L steps of degree <= ell; a127ab's Mode B figure, relayed). The
    amortisation ratio A(m) = W_pool(m) / W_sep(m) therefore satisfies
      A(m) = (c / 0.886) * m^{-1/2} + (C_path + 2*c_eval) / (0.886*sqrt(N)).
    Two consequences are checkable by hand. (i) A(1) >= 1 always: at m = 1 the
    pooled run IS a single rho plus a transport charge, so the per-instance
    reading is recovered as the m = 1 slice, consistent with a22049's closure.
    (ii) A(m) < 1 for m >= m_min where m_min = ceil((c/0.886)^2 / (1 - T)^2)
    with T the transport term; at toy scale T is a few percent and m_min is 2
    to 4 depending on c. The pooled attack never beats Kuhn-Struik on ONE curve
    (which has T = 0), so its ceiling is the m-target generic baseline and its
    delta against that baseline is exactly -T, a loss.

    (C) THE DISCRIMINATION. Two mutually exclusive readings, decided by the
    same toy run.
      READING 1 -- POPULATION COLUMN LIVE. On m classmates, A(m) fits
      (c/0.886)*m^{-1/2} + T with fitted exponent in [-0.6, -0.4] and the
      SAME c as the same-curve control within its CI. Then the census records:
      "charged isogeny transfer buys nothing per instance and buys the full
      Kuhn-Struik amortisation per class population, at transport charge T";
      the RQ's decision target reads "endomorphism-orbit methods for single
      instances (capped at sqrt(|Aut|/2), KN-TECH-018); transfer only in the
      multi-instance model, where it ties the generic multi-target baseline".
      READING 2 -- POOLING DEGRADES. A(m) on classmates has exponent
      materially above -0.4, or its fitted c exceeds the same-curve control's
      c beyond CI, while the transport term T is measured small. Then the
      transported instances are NOT behaving as m independent targets on E_0 --
      which under T1 they must -- and either the transport certificates are
      wrong, the multi-target walk is mishandling tags, or (the only
      mathematically interesting branch) transported points are correlated in
      the walk's encoding channel. That branch must be routed to
      IDEA-20260901-753636's pair-correlation instrument before interpretation.
    A THIRD OUTCOME, PRE-DECLARED AS A CONTROL FAILURE: the different-class
    null (D below) shows any amortisation at all. Then the instrument is
    reporting a gain where none can exist and every number is void.

    (D) WHAT IS NOT CLAIMED. No exponent moves: per-target time N^{1/2} /
    m^{1/2} is the generic multi-target law and is realised on one curve
    without any isogeny. No security bits are reduced: IDEA-20260807-e41559
    records that the "many targets on distinct isogenous curves" threat model
    has no known deployed instance (the quadratic twist is never in the class,
    since it has trace -t). The record's content is a CENSUS COLUMN with a
    priced ceiling, plus the observation that the transfer method's only
    non-zero value in this RQ's scope sits on the data/population axis, which
    no census cell currently records.

  mechanism: >-
    THE TRACKED OBJECT AND WHY PER-INSTANCE CROSS-CURVE WALKING IS A CHANGE OF
    COORDINATES. Consider the naive "walk that crosses curves": a state (E',
    R') with R' in G' = phi(G). The transport-equivalence quotient of the
    union over classmates E' of G' is in bijection with G itself (pull every
    state back to E_0 along the known isogeny). It discards nothing -- it
    fails the lossy-projection test of docs/inventor-protocol.md section 2 and
    is therefore a change of coordinates, not an object. Worse, the equality
    test across curves is not local: two states on different curves can only
    be compared after a pull-back, which costs a path. This is the enumerated
    closure for single-instance cross-curve walking, and it is why the ONLY
    class-level object left is the POPULATION: m instances, each pulled back
    once, sharing one distinguished-point store on E_0. That store is a
    genuinely lossy projection of the m walks (it keeps distinguished points
    and their (a, b, tag) coefficients and discards the walks between them),
    discarded compatibly with the walk step, and it is exactly the object
    IDEA-20260731-013 measures on a single curve. What this record adds is
    the transport primitive that lets m instances born on m curves share it.

    STAGE 0 (zero compute, HARD GATE). Write (B) and check the m = 1 slice
    reproduces a22049's closure (A(1) >= 1) symbolically. Then fix the path
    convention: at toy scale the class is enumerable (harness/isogeny_class.py,
    Velu quotients harness/velu_stage0.py), so paths are found by breadth-first
    search; C_path is CHARGED as the number of Velu kernel constructions on the
    path, and the enumeration itself is charged at its full toy cost and
    reported separately, never absorbed. NOTE ON WHAT C_path IS NOT: this
    record does NOT claim the cryptographic-scale path-finding cost; JMV
    (retrieved, abstract only) gives polynomial-time random reducibility under
    GRH for random classmates, and reaching a SPECIFIED classmate is T5's
    open gate. The toy design sidesteps T5 by choosing E_0 as the vertex that
    minimises the total path length to the m sources, which is a global choice
    available only because the class is enumerated; that choice is disclosed
    as a toy-only shortcut.

    STAGE 1 (instrument). Extend harness/rho.py from Floyd cycle detection to a
    van Oorschot-Wiener distinguished-point walk with a shared store keyed by
    (x-coordinate, target tag), exactly the construction of IDEA-20260731-013
    (B). Charge every store write, every tag test, every DP overhead. Verify
    every solve by [k_i]P_i == Q_i on the ORIGINAL curve E_i, never on E_0,
    so the certificate is independent of the transport code.

    STAGE 2 (the cells). For N at 20 and 24 bits, three complete classes each,
    m in {1, 2, 4, 8, 16}: (a) POOLED-CLASS: m instances on m distinct random
    vertices of one class, transported to E_0, solved by the shared-store
    walk; (b) SAME-CURVE CONTROL: m instances on E_0 itself, no transport,
    same walk (the 013 object; T = 0 by construction); (c) SEPARATE: m
    independent single-target rho runs on the sources; (d) DIFFERENT-CLASS
    NULL: m instances on m curves from m DIFFERENT classes at the same bit
    size, where no transport exists -- the pipeline must degrade to (c)
    exactly. 24 seeds per cell.

    STAGE 3 (the fit). Fit A(m) = alpha * m^{beta} + T per cell family; report
    beta, alpha, T with bootstrap CIs; compare alpha and beta between (a) and
    (b); report T as measured charged transport over measured separate work.

    STAGE 4 (decay). The advantage of pooling must GROW with m (as m^{-1/2})
    and the transport term must SHRINK relative to the solve as N grows
    (T ~ N^{-1/2} at fixed path length). An amortisation flat in m, or a T
    that does not fall with N, is an artifact under docs/inventor-protocol.md
    section 3 and is reported as a controlled null.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval UNAVAILABLE this session (index ':memory:', empty;
      not called). Screened by direct reading on 2026-09-01: all four
      RQ-ECDLP-165d4b proposals (IDEA-20260829-{172151,20b05f,2dc43c,34f3ed});
      H-ECDLP-{1853dc,63d136,63eecd,80fceb,e42bda}; DEC-20260809-{b61556,54f91c};
      GOAL-ENDO-001 goal.yaml (head, T1/T5/RQ-ICINV grep) and
      analysis/endomorphism-isogeny-decomposition/{DECOMPOSITION,MATCHED-ORDER-DESIGN}.md;
      RQ-MTGT-2cabee, H-MTGT-48f3a3, IDEA-20260830-{a22049,4a88d9,3e38ce}
      (a22049 in full), IDEA-20260807-{a127ab,e0ddc6,e41559} (opening
      sections), IDEA-20260731-013 (opening), EV-ENDO-10109d (observations),
      EV-IC-002 OBS-9, KN-TECH-{005,006,018,031,034}, KN-FIND-b7e091 header.
      Greps over ledger/, knowledge/, analysis/, docs/ for
      'Kuhn|Struik|multi-target|Jao|Venkatesan|random.reducib', 'pool(ed|ing)
      instances|shared (distinguished|DP)|multi-instance'. External: arXiv
      abstract page of Jao-Miller-Venkatesan (math/0411378) fetched and read;
      the Kuhn-Struik Springer page redirected to an authorisation endpoint
      and was NOT read.
    results: >-
      The shared-DP multi-target object on ONE curve exists
      (IDEA-20260731-013, IDEA-20260815-284aff, IDEA-20260806-3b91c7). The
      transport-the-two-points primitive exists as a127ab's Mode B, in the
      Bernstein-Lange ADVICE regime (one N^{1/3} table serving M curves on the
      S*T^2 = N frontier). The threat-model audit e41559 finds the multi-curve
      model has probably no deployed instance. The per-instance transfer arm
      is closed by a22049. NO record composes the transport primitive with the
      Kuhn-Struik ONLINE object (no table, no advice, m independent scalars)
      inside RQ-ECDLP-165d4b, states the population-level reading of the
      census's transfer method, or specifies the different-class null.
      Externally, JMV's random reducibility says the class is one security
      unit; that pooling m instances across a class costs Kuhn-Struik plus
      transport is an evident corollary that this session could not find
      stated but did not search for exhaustively.
    verdict: >-
      UNVERIFIED. The mechanism is a composition of two known results (JMV /
      T1 transport and Kuhn-Struik multi-target); the honest label would be
      'adaptation' if the Kuhn-Struik source had been opened, and it was not.
      The contribution claimed is the census column, its ceiling, and the
      matched controls, not new mathematics.

