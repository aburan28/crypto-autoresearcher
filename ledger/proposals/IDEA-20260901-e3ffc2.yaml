  confounders:
    - >-
      GLOBAL CHOICE OF E_0. At toy scale the enumerated class lets E_0 be the
      path-minimising vertex; at cryptographic scale that choice is T5's open
      problem. The transport term measured here is therefore a LOWER bound on
      the real transport charge and is labelled as such.
    - >-
      TAG COLLISIONS AND STORE CONTENTION in the shared-store walk are
      IDEA-20260731-013's open quantities (i) and (ii); they enter alpha and
      are the same on the pooled and same-curve cells, which is why the
      comparison is paired.
    - >-
      DEPENDENT SCALARS. If the m instances' k_i are generated from one seed
      stream with structure, the pooled problem is easier than m targets for
      a reason unrelated to transport. Independent seed streams, recorded.
    - >-
      ORDER-STATISTIC EFFECTS at small m: A(m) at m = 2 is the ratio of two
      noisy Rayleigh-type quantities; the fit must use log-work and bootstrap
      CIs, never point ratios.
    - >-
      READING THIS AS A THREAT. e41559 finds no deployed multi-curve-class
      instance; the record is a census column and says so in every summary.

