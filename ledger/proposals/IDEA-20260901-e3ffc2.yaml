  assumptions:
    - >-
      Ordinary, prime-order, non-anomalous curves over F_p with declared
      embedding degree and twist checks (RQ scope, KN-TECH-034 screens). N
      prime is load-bearing: gcd(deg phi, N) = 1 is automatic for every
      small-degree isogeny, and T1 applies.
    - >-
      The m scalars k_i are independent and uniform. If they are related by
      public scalars the problem is a single instance in disguise and the
      pooled cost collapses to one rho; the instrument must draw k_i from
      independent seed streams and record them.
    - >-
      Toy scale only, N <= 2^24; the class is enumerated exhaustively and E_0
      is chosen globally, which is a toy shortcut around T5 and is disclosed
      as such. Nothing here transfers to cryptographic size.
    - >-
      The multi-target constant c is measured, not assumed; every prediction
      is stated relative to the same-curve control's fitted c.

  proof_search_map:
    bottleneck: >-
      The step "put m instances into one group so that one collision store
      serves all of them". On one curve this is free; across a class it costs
      one transport per instance, and the whole record is the claim that this
      cost is the ONLY thing separating the class from the single curve.
    baseline_embedding:
      parameter_slice: >-
        m = 1 (recovers a22049's single-target closure: A(1) >= 1) and
        transport degree 1 (all instances already on E_0: recovers
        IDEA-20260731-013's same-curve multi-target measurement exactly).
      reproduction_check: >-
        Symbolic for m = 1; frozen fixture for the degree-1 slice -- the
        pooled pipeline run with phi_i = identity must reproduce the
        same-curve control's per-cell work to the operation, since it is the
        same computation.
    observation_collision:
      observable: the amortisation ratio A(m) and its fitted exponent beta
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: an A(m) with beta near -1/2 is
        produced BOTH by genuine pooling on classmates AND by an instrument
        that silently ignores the source curves and solves everything on E_0
        with instances it generated there (i.e. never transported anything).
        The separating condition is the certificate: every k_i is verified on
        the ORIGINAL curve E_i by code that does not call the transport
        routine, and the different-class null must show beta = 0 (no
        pooling). An instrument that pools different classes has not applied
        any map. This is the same degeneracy H-MTGT-48f3a3 names for
        retention rates.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "does transfer help the census's instances" by "in which
          accounting regime (per instance / per population) does the transfer
          column carry value, and what is its ceiling in each".
        predicted_gain: >-
          Splits the transfer method into a closed per-instance cell (a22049)
          and a population cell whose ceiling is the generic m-target law;
          the census stops reporting one verdict for two questions.
    quantifier_order: >-
      CLAIMED: FOR ALL ordinary prime-order classes C in scope and FOR ALL
      m >= 1, FOR ALL choices of m distinct vertices E_i in C with independent
      uniform k_i, THERE EXISTS E_0 in C and paths phi_i such that the pooled
      charged work is c*sqrt(m*N) + m*(C_path + 2*c_eval) with the SAME c as
      the one-curve m-target walk. EXPLICITLY NOT CLAIMED: any bound on C_path
      at cryptographic size (T5), any advantage over the one-curve m-target
      walk (the delta is -T, a loss), and anything for instances in different
      classes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested classes, sizes and seeds, m instances on m classmates
        are solved by one transported shared-store walk at a measured
        amortisation ratio A(m) with fitted exponent beta and transport term
        T, matching the same-curve control within CI." It can NEVER certify a
        speedup over single-curve multi-target rho, a cryptographic-scale
        path cost, or anything about a deployed system.
      nearby_object_control: >-
        m instances on m curves from DIFFERENT classes: no isogeny exists, no
        pooling is possible, and the pipeline must return beta = 0 and
        A(m) = 1 + (failed-path charge)/W_sep. A pipeline that reports
        amortisation there has not identified the load-bearing structure (T1
        within one class) and every number is void. BLOCKING.
    proof_obligations:
      - claim: "T1: transport preserves k_i for gcd(deg phi_i, N) = 1."
        responsibility: correctness
      - claim: "The m = 1 slice reproduces the single-target closure A(1) >= 1."
        responsibility: baseline
      - claim: "Pooled work is c*sqrt(m*N) + m*(C_path + 2*c_eval) with c equal to the same-curve control's."
        responsibility: runtime
      - claim: "Every transport is certified independently of the transport code and every k_i is verified on E_i."
        responsibility: correctness
      - claim: "The different-class null shows no amortisation."
        responsibility: strictness
      - claim: "No cryptographic-scale path cost is asserted (T5 open)."
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The shared distinguished-point store on E_0, fed by m walks whose
      targets were born on m different curves of the class. Entries are
      (x(DP), a, b, tag); the store retains distinguished points and their
      coefficients and discards the walks between them.
    lossiness: >-
      GENUINELY LOSSY: the store keeps a 2^{-d} fraction of visited states and
      forgets the rest; it cannot be inverted to the walks. The discard is
      compatible with the walk step by construction of the distinguished-point
      method (a walk that reaches a stored DP has collided regardless of the
      forgotten path). This is IDEA-20260731-013's object; the transport adds
      no new discard, it enlarges the set of instances that can feed one
      store.
    propagation: >-
      Exact under the walk step and under transport (T1 carries (a, b) and
      the tag exactly). The naive cross-curve walk state, by contrast, fails
      the test: its transport-equivalence quotient is in bijection with G and
      discards nothing.
    survival_score: >-
      Survives for the whole run by construction; the question is not
      survival but the charged cost of feeding it from other curves, which is
      the measured quantity.

  null_object_control: >-
    NULL-1, DIFFERENT-CLASS INSTANCES (blocking, primary null). m instances on
    m curves of m distinct classes at the same bit size. No transport exists;
    the pipeline must return the separate-solve cost. Any amortisation here is
    an instrument fault.
    NULL-2, SAME-CURVE CONTROL (blocking, the ceiling). m instances on E_0
    itself: the IDEA-20260731-013 object with T = 0. The pooled-class cell
    must match its fitted c and beta within CI and exceed it by exactly the
    measured transport term.
    NULL-3, RANDOM-FUNCTION WALK (from 013): the same shared-store construction
    on a random function of the same state space, reproducing the birthday
    amortisation with no group law; confirms that the pooling gain is generic.
    POSITIVE CONTROL, DEGREE-1 TRANSPORT: phi_i = identity must reproduce
    NULL-2 to the operation.
    DECAY PARAMETERS: m (gain must grow as m^{-1/2}) and N (transport term
    must fall as N^{-1/2} at fixed path length). Flat behaviour in either is
    an artifact.
    CM CELLS: on j = 0 / j = 1728 vertices the automorphism-discounted
    multi-target walk is the control (KN-TECH-018); the pooled cell must sit
    on sqrt(|Aut|/2) times the generic law, not above it.
    MATCHED BSGS ROW: m separate BSGS solves at 2*sqrt(N) each and one
    multi-target BSGS (one baby table, m giant walks) on E_0, reported per
    cell with memory charged (KN-TECH-031), so the population column carries a
    memory-rich comparator.

  discriminated_from:
    - >-
      IDEA-20260830-a22049 (nearest in this RQ's lane). That record closes the
      transfer arm PER INSTANCE by deriving S(C) <= 1 + 0.09*rho_dbl and
      composing with the transport charge. This record reproduces that
      closure as its m = 1 slice and adds the per-population reading, where
      the prize is not S(C) (a curve-level spread, provably ~1) but the
      multi-target amortisation m^{-1/2}, which is order-level and exists on
      every class. EXACT DELTA: a22049's observable is the within-class spread
      of single-instance work; this record's observable is the ratio of
      pooled to separate work across m instances, and the two are equal only
      at m = 1.
    - >-
      IDEA-20260807-a127ab (nearest in the MTGT lane). Supplies the transport
      primitive (Mode B: move the two target points) and the cost model, in
      the Bernstein-Lange ADVICE regime: one N^{1/3} table, N^{2/3}
