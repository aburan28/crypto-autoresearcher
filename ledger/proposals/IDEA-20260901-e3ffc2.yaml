  predictions:
    - metric: >-
        M1 -- fitted exponent beta in A(m) - T ~ alpha * m^{beta} on
        pooled-class cells, m in {1,2,4,8,16}, three classes, 20 and 24 bits
      direction: lower
      minimum_effect: >-
        READING 1 requires beta in [-0.60, -0.40] with CI half-width below
        0.15 and alpha matching the same-curve control's alpha within CI.
        beta above -0.30 with a measured small T is READING 2. The band in
        between is pre-registered INCONCLUSIVE. Anchors: -0.5 is the birthday
        law for m targets; 0 is no pooling.
    - metric: >-
        M2 -- measured transport term T = m*(C_path + 2*c_eval) / W_sep(m),
        charged in group-operation equivalents with the field-op conversion
        declared
      direction: lower
      minimum_effect: >-
        Predicted below 0.10 at 20 bits and below 0.05 at 24 bits for paths
        of length <= 4 with ell <= 7, and falling with N as N^{-1/2} at fixed
        path. A T above 0.5 at 24 bits means the pooled cell cannot beat
        separate solves below m ~ 16 and the column is priced as net-negative
        at toy scale, which is a valid outcome.
    - metric: >-
        M3 -- amortisation on the different-class null
      direction: different
      minimum_effect: >-
        beta = 0 within CI and A(m) = 1 + (charged failed-path cost)/W_sep.
        Any beta below -0.15 here voids every other number.
    - metric: >-
        M4 -- degree-1 transport cell versus same-curve control
      direction: different
      minimum_effect: >-
        Identical charged work to the operation. A difference is an
        instrument fault.
    - metric: >-
        M5 -- pooled-class work on CM vertices divided by the
