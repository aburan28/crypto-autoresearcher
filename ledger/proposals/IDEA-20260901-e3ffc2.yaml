  heuristic_assumptions:
    - id: H1
      statement: >-
        MULTI-TARGET BIRTHDAY LAW. For m targets in a group of prime order N
        and the shared distinguished-point walk with tag tests, the expected
        total charged work to solve all m is c*sqrt(m*N)*(1 + o(1)) with c
        independent of m for m <= N^{1/4}, i.e. the total behaves as a
        birthday search over m*N effective pairs.
      rigorous_support: >-
        Rigorous ingredient: the Corrigan-Gibbs-Kogan generic bound in the
        small-advice regime, S*T^2 = Omega~(N), which IDEA-20260731-013 cites
        as the lower reference giving Omega~(sqrt(m*N)) for m targets
        (KN-TECH-005, KN-LIT-013). Distribution imitated: the random-function
        birthday law of the single-target rho analysis (KN-TECH-006), extended
        to m target orbits. The heuristic step is that the implemented tagged
        walk is a uniformly random function of its state space.
      validation_plan: >-
        SAMPLE: the same-curve control cells (NULL-2) at 20 and 24 bits,
        m in {1,2,4,8,16}, 24 seeds, whole group enumerable so N is exact.
        COMPARISON: empirical distribution of total work / sqrt(m*N) against
        the Rayleigh-type law for a birthday search on m*N pairs, by
        Kolmogorov-Smirnov per m; fitted c per m must be flat in m (slope CI
        containing 0). TAIL CHECK: 99th percentile of observed work against
        the predicted tail; tag-collision counts reported separately so a
        heavy tail is attributed to contention, not to the law. SAMPLED
        PARAMETERS RECORDED: p, N, m, seeds, d (DP density), r (branches).
        TRANSFER ASSUMPTION: none beyond 24 bits.
    - id: H2
      statement: >-
        TRANSPORT NEUTRALITY. Transported instances (phi_i(P_i), phi_i(Q_i))
        on E_0 are, for the purposes of the walk, indistinguishable from m
        instances generated on E_0 directly: their walk statistics and
        collision times follow the same law as NULL-2's.
      rigorous_support: >-
        Rigorous ingredient: T1 -- phi_i restricted to G is an injective
        homomorphism, so (phi_i(P_i), phi_i(Q_i)) IS an instance on E_0 with
        the same k_i; nothing distinguishes it group-theoretically. The
        heuristic step is that the walk's encoding channel (x-coordinates
        under the partition x mod r) does not see the provenance of the
        points either -- the standard encoding heuristic, and the one that
        IDEA-20260901-753636's pair-correlation matrix measures directly.
      validation_plan: >-
        SAMPLE: per pooled cell, the per-target collision times of
        transported instances versus NULL-2's native instances at the same m,
        24 seeds. COMPARISON: two-sample Kolmogorov-Smirnov on collision-time
        distributions; a difference beyond alpha = 0.01 at two bit sizes is
        READING 2's signature. TAIL CHECK: smallest and largest collision
        time per cell family compared across transported and native.
        TRANSFER: none.

  target_complexity:
    time_exponent: >-
      1/2 in N per instance, UNCHANGED. Per-target time N^{1/2} * m^{-1/2} for
      m pooled targets is the generic multi-target law and is realised on one
      curve without any isogeny; this record reaches it across a class at an
      ADDITIONAL transport charge, never below it. No exponent claim.
    memory_exponent: >-
      The shared distinguished-point store: about sqrt(m*N) * 2^{-d} entries
      for DP density 2^{-d}, i.e. N^{1/2} * m^{1/2} * 2^{-d}, the same as the
      single-curve m-target walk (KN-TECH-006 tradeoff). Transport adds O(m)
      memory for the paths.
    best_known: >-
      Single-target parallel rho at 0.886*sqrt(N), O(1) memory per processor
      (KN-TECH-006); m-target shared-store rho at about c*sqrt(m*N) total
      (Kuhn-Struik, recalled; IDEA-20260731-013 unverified claim); BSGS at
      2*sqrt(N) time and sqrt(N) memory, m-target BSGS reusing one baby table
      (KN-TECH-031); Bernstein-Lange advice at S = T = N^{1/3} per curve,
      transportable across the class by a127ab; automorphism-discounted rho
      at most sqrt(6) better on CM cells (KN-TECH-018).
    hidden_overhead: >-
      (i) The path cost C_path is measured with a toy global choice of E_0 and
      is a lower bound on the real charge (T5). (ii) The multi-target constant
      c and its degradation from tag contention are IDEA-20260731-013's open
      quantities and are inherited, not resolved. (iii) The DP density d sets
      a memory/time tradeoff that is fixed per run and disclosed.
    tradeoff_note: >-
      van Oorschot-Wiener interpolation applies unchanged on E_0; with w
      memory and n processors the pooled walk runs at the single-curve
      m-target position, plus the transport term, which is embarrassingly
      parallel over instances. Position on the frontier: on the KS/CGK line,
      never inside it.

  dominated_by: >-
    AS AN ATTACK, checked row by row across time, memory and data/queries.
    TIME, single instance: parallel rho at 0.886*sqrt(N) (KN-TECH-006)
    dominates, since at m = 1 this record IS rho plus a charge. TIME, m
    instances: the same-curve shared-store multi-target walk
    (IDEA-20260731-013's object; Kuhn-Struik) dominates by exactly the
    transport term -- this record ties it in exponent and constant and loses
    on the additive charge. MEMORY: rho at O(1) dominates; the DP store is
    the same as the single-curve m-target store. MEMORY-RICH: BSGS
    (KN-TECH-031) and Bernstein-Lange advice transported by a127ab occupy the
    other corner and are not approached. CM-SPECIFIC: automorphism-discounted
    rho (KN-TECH-018) dominates on CM vertices and is used as the control.
    DATA/QUERIES: the record consumes m instances and solves m; no query
    advantage. LOWER BOUND: the CGK frontier is met, not beaten.
    AS A CENSUS CONTRIBUTION the nearest incumbent is IDEA-20260830-a22049,
    which dominates on the per-instance reading (a derivation at zero
    compute) and is dominated here on the population reading, which it does
    not cover.
  sota_delta: >-
    Time exponent delta 0; memory exponent delta 0; data/query delta 0;
    security bits reduced 0. Against the single-curve m-target walk the delta
    is NEGATIVE and equals the measured transport term T (predicted below
