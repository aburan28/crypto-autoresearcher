  assumptions:
  - Fixed automorphism-weighted uniform measure on general F_p2 isomorphism classes; primitive and cyclic conventions
    must be proved compatible.
  predictions:
  - metric: Ratio R_D=E[Z_D^2]/E[Z_D]^2 and certified hit lower bound
    direction: different
    minimum_effect: Finite explicit R_D yields the numeric lower bound 1/R_D; no desired magnitude asserted.
  minimal_test:
    design: Paper derivation of diagonal/off-diagonal incidence accounting on a self-generated finite correspondence
      table; check all counts by double counting before proposing quaternion sampling. The regular/concentrated
      comparison changes row multiplicities while fixing total mass and row measure. In the equal-weight formal
      slice the displayed moments follow directly from averaging the eight supplied row totals; these are specified
      symbolic control identities, not executed correspondence counts. A row-preserving shuffle leaves all three
      quantities unchanged. Unequal automorphism-weighted applications must match weighted first moment using the
      same frozen weights and rederive the formulas.
    controls:
    - 'Bookkeeping null: a shuffle preserving each row total Z and column totals under the fixed row measure. It
      preserves E[Z], E[Z^2] and Pr(Z>0) exactly and therefore tests incidence bookkeeping only.'
    - 'Concentration control: fixed 8 equally weighted rows, 12 columns and total 8 incidences; regular row vector
      (1,1,1,1,1,1,1,1) versus concentrated (8,0,0,0,0,0,0,0). Column totals can also be matched by placing each
      of eight used columns once. E[Z]=1 in both; second moments are 1 versus 8 and hit fractions 1 versus 1/8.'
    - 'Known-false control: concentration on one curve defeats any inference of prevalence from first moment alone.
      Automorphism weights and the row measure are held fixed between arms.'
    required_metrics:
    - First and second moments
    - Automorphism-weight residual
    - Hit fraction bound
    - Counts and maximum multiplicity
    fixtures: Abstract 8-by-12 tables with equal row weights as the exact formal control slice, matched total mass
      and optionally matched column totals. No actual automorphism measure on mathematical curves has been sampled;
      transfer to that fixed measure requires the corresponding weighted accounting.
    stopping_rule: Proposal only. Future separately approved paper audit stops at the first counterexample, unmet
      prerequisite, or 2-hour/2-GB bound. No mathematical experiment executed here.
  falsification_conditions:
  - Any double-count inconsistency invalidates the certificate.
  - An unavoidable off-diagonal contribution of the same order as total mass squared divided by the rare fraction
    prevents the hoped-for strengthening.
  confounders:
  - Size-biased order sampling
  - Counting scalar multiples as independent primitive witnesses
  interpretation_limits:
  - No general degree improvement, no p^(1/4) algorithm, no implication from the F_p locus.
