idea:
  id: IDEA-20261006-7074a5
  question_id: RQ-SDEG-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    S_4 solving degree exceeds the S_3 solving degree by exactly 2 or
    by at least 4 on one F_19 cell
  class: measurement
  claim: >-
    On one ordinary short-Weierstrass curve over F_19, one factor base
    of B = 4 abscissae, and eight targets, let Delta be the median of
    d_solve(S_4) minus d_solve(S_3), the same target and the same base
    in both systems. Delta is either exactly 2 or at least 4. Exactly
    2 is the generator-degree gap: S_4 has degree 4 in each variable
    and S_3 has degree 2, and the solving degrees differ by that same
    integer. At least 4 means the three-summand system pays at least
    two further degrees beyond that gap. A finished median of at most
    0 is the concrete negative: the two-summand system is at least as
    hard as the three-summand system. Representation class R1; attack
    stage is the Groebner degree of relation decomposition. No
    exponent is moved.
  mechanism: >-
    The tracked object is Delta, the median of the per-target
    difference of grevlex solving degrees. Representation: R1, the
    coefficient arrays of ordinary S_3(x1, x2, xT) and of
    S_4(x1, x2, x3; xT), each with membership polynomials of degree
    B. Operation set Sigma: one grevlex solver on each ideal. Sigma
    is not group translation. Trichotomy class: coordinate-dependent,
    because the degree is a function of the polynomial representation
    and of the monomial order, not of the discrete log. Lossy
    projection against Sigma: Delta discards the witness tuples and
    keeps one integer. Distinct systems share a difference, so the
    projection is lossy. The discard is the degree a charged cost
    model would use as its Macaulay parameter. The priced open number
    is Delta, with separators 2 and 4.
  novelty_status: unverified
  citations:
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        S_3 has degree 2 in each variable and S_4 has degree 4 in
        each variable, by the resultant recursion. That degree
        pattern is the integer 2 in the prediction. The row does not
        state a solving-degree gap.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive prime-field Semaev index calculus does not beat generic
        methods under the assumptions of that row. Baseline only.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
    - ref: KN-OPEN-002
      provenance: internal
      claim: >-
        How prime-field solving degree grows with bit size and with
        decomposition length is open. This idea measures one cell of
        the length comparison and does not fit a growth law.
      verified_by: knowledge/open-problems/KN-OPEN-002.md
  assumptions:
    - >-
      d_solve is the maximum total degree of any polynomial the
      declared grevlex solver constructs, including reducers. The
      same rule is used for S_3 and for S_4.
    - >-
      S_4 is the resultant in one auxiliary variable of two S_3
      factors, one of them specialised at the target abscissa. S_3
      is the ordinary three-variable summation polynomial specialised
      at the target abscissa. Both use the same factor base.
    - >-
      Eight targets are scored. A target whose transcript lacks the
      maximum is not entered as degree 0.
    - >-
      No symmetrized summation polynomial is introduced.
  predictions:
    - metric: >-
        median over eight F_19 targets of d_solve(S_4) minus
        d_solve(S_3)
      direction: different
      minimum_effect: >-
        a median of exactly 2 supports the generator-degree reading;
        a median of at least 4 supports an extra gap. A median of at
        most 0 is the concrete negative.
  minimal_test:
    design: >-
      On one ordinary curve over F_19, draw one factor base of size
      4 and eight targets in the prime-order subgroup. For each
      target compute d_solve of the S_3 system and of the S_4 system
      under one grevlex solver. Report the eight differences and
      their median. A second solver build recomputes both degrees on
      the first target.
    controls:
      - >-
        The same target and the same base appear in both systems, so
        the curve and the base are not the difference.
      - >-
        A support-matched random pair, one system at the S_3 support
        and one at the S_4 support, twenty replicates. If the random
        median difference equals the Semaev median difference, the
        gap is the support and not the summation identities.
      - >-
        The second build on the first target must match both integer
        degrees.
    required_metrics:
      - eight pairs of degrees
      - median difference
      - random-arm median difference
      - second-build match on the first target
  falsification_conditions:
    - >-
      The eight differences are complete and their median is at most
      0. The three-summand system is not harder. That is the concrete
      negative.
    - >-
      The median is exactly 1 or exactly 3. Neither named reading
      holds, and the generator-degree gap is not the observed gap.
    - >-
      The random-arm median equals the Semaev median and that common
      value is at least 4. The extra gap is then the support, and the
      summation polynomial is not the cause.
  confounders:
    - >-
      A solver that reports 0 on an inconsistent system makes every
      miss look cheap. The degree is the maximum constructed, including
      the polynomial that produced 1, and a missing transcript is void.
    - >-
      S_4 has more variables than S_3. The comparison is still the
      per-target degree difference the prediction names. It is not a
      claim that the two systems have the same shape.
  interpretation_limits:
    - >-
      One prime and B = 4. A gap of 2 or of 4 here is not a degree
      exponent for cryptographic parameters.
    - >-
      This is not the hit-versus-miss comparison, not a lex-versus-
      grevlex comparison, and not a sweep over several primes.
    - >-
      No discrete logarithm is computed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed factor base at p = 19 and B = 4, the grevlex
        solving degree grows by the same integer as the per-variable
        generator degree when the summation polynomial index increases
        from 3 to 4, for targets drawn uniformly in the prime-order
        subgroup.
      rigorous_support: >-
        KR-IC-5a43e5, opened in this session, gives degree 2^{m-2} in
        each variable, hence 2 for S_3 and 4 for S_4. It does not give
        the solving degree. The assumption imitates the model in which
        the Macaulay degree shifts by the generator-degree shift, and
        pairs it with that degree pattern. No transfer beyond this cell
        is assumed.
      validation_plan: >-
        Score eight targets at p = 19, B = 4. The prediction holds on
        this cell when the median difference is exactly 2. The tail
        check is the maximum difference minus the minimum difference
        among the eight. Parameters stop at this cell.
  target_complexity:
    time_exponent: >-
      not beaten. Pollard rho remains Theta(N^{1/2}) group operations.
    memory_exponent: >-
      not beaten. A toy degree gap is not a memory exponent and does
      not replace the van Oorschot-Wiener interpolation.
    best_known: >-
      Pollard rho at Theta(N^{1/2}); KR-IC-5931ee is the prime-field
      Semaev comparison under its stated assumptions.
    hidden_overhead: >-
      None claimed. An extra degree, if it appears, is a measured
      integer on one cell rather than an o(1) term.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. The datum is a difference
      of two toy degrees.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-5a43e5
      - KR-IC-5931ee
      - KR-IC-0d2021
      - KR-IC-e847d1
    nearest:
      - ref: KR-IC-5a43e5
        provenance: internal
        relation: adjacent
        delta: >-
          That row fixes the per-variable degrees 2 and 4. This idea
          measures the median solving-degree difference on one F_19,
          B = 4 cell, with separators exactly 2 and at least 4. It
          adds no new summation polynomial.
      - ref: KN-OPEN-002
        provenance: internal
        relation: adjacent
        delta: >-
          The open problem asks how solving degree grows with bit size
          and with m. This idea is one eight-target difference at
          p = 19. It does not answer the growth law.
      - ref: KR-IC-0d2021
        provenance: internal
        relation: orthogonal
        delta: >-
          That row refines degree-of-regularity predictions for
          semi-regular sequences. The separator here is an integer
          difference of two solving degrees, not a regularity formula.
    searched:
      corpus_grep:
        - question_id RQ-SDEG-001 titles on origin/main and on PRs 1936 and 1937
        - S_3 versus S_4 solving degree in the opened frontier rows
      web:
        - not performed this session
      blocked:
        - hit versus miss means
        - lex versus grevlex
        - a grid that varies p and B for S_3 alone
  dominated_by: >-
    Pollard rho at Theta(N^{1/2}) group operations, checked against
    KR-IC-5931ee. No attack result is claimed. A toy degree gap does
    not change that baseline.
  sota_delta: >-
    Exponent delta is 0 against Theta(N^{1/2}) time and against
    polylog rho memory. The separator is a median degree difference
    of exactly 2, or at least 4, against a median of at most 0, at
    p = 19, B = 4, eight targets.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: >-
        The S_3 solving degree on the same target is the baseline.
      reproduction_check: >-
        A second solver build reproduces both degrees on one frozen
        target.
    observation_collision:
      observable: d_solve(S_4) - d_solve(S_3)
      distinct_preimage_search: >-
        Two targets may share a difference. The collision is recorded
        and is not a discrete-log relation.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: targets with a given degree difference
        predicted_gain: none as an attack
    quantifier_order: >-
      Empirical median on one declared cell. No attack quantifiers.
    method_ceiling:
      strongest_certifiable_claim: >-
        On this cell the median difference is exactly 2, is at least
        4, or is at most 0, or it is exactly 1 or exactly 3.
      nearby_object_control: support-matched random systems at the two supports
    proof_obligations:
      - claim: no theorem is offered
        responsibility: scope
    not_applicable_reason: >-
      Degree-gap measurement. The random pair is the nearby object.
