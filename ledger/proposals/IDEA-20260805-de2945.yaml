    - >-
      experiments/EXP-BKK-001/runs/RUN-BKK-001-a/manifest.yaml (READ). Source
      of the p = [101, 431, 1009] forced value.
    - >-
      knowledge/findings/KN-FIND-017..027 front matter (READ for 017-023 in
