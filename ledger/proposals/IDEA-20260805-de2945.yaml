idea:
  id: IDEA-20260805-de2945
  question_id: RQ-FIND-001
  added: '2026-08-05'
  title: >-
    The tier-certificate chain of GOAL-FIND-001's own completion criterion is
    machine-unverifiable at every link: a schema-path blind spot in
    tier_of_run() means 60 of 60 backing runs are invisible to the one check
    that enforces "no stronger than the cited scope"
  class: control

  claim: >-
    GOAL-FIND-001's completion criterion reads: "Committed KN-FIND entries or
    explicit not_warranted justifications cover the replicated ECDLP-relevant
    EV set named in docs/knowledge-assessment-20260724.md section 1.1, WITH
    CLAIM BOUNDARIES NO STRONGER THAN CITED EV/DEC SCOPE." The second clause is
    a machine-checkable statement about a three-link chain
    KN-FIND -> EV -> RUN, and the repository contains exactly one tool that
    enforces any part of it (tools/validate_ledger.py, the claim-tier ceiling
    at lines ~501-507 fed by tier_of_run() at ~412-447). This proposal claims
    that for the entire section 1.1 promotion set the chain is severed at all
    three links, so the criterion is presently UNFALSIFIABLE rather than
    verified, and that the severance at link 3 is a SCHEMA-PATH MISMATCH, not
    an absence of data -- the parameters that would pin the tier are recorded,
    at a path the checker does not read. Specifically, and derived from code
    and files read in this session (SESSION-COMPUTED, outside the harness,
    to be re-run in-harness as stage 1): (L1) 0 of the 11 promoted entries
    KN-FIND-017..027 carries a claim_tier field at all, and only 4 of 48
    entries in knowledge/findings/ do; (L2) 10 of the 11 cited evidence
    records (EV-BKK-001, EV-BKKMV-001/-002, EV-EQJ-001, EV-FB-001, EV-NCP-001,
    EV-REP-002, EV-SIG-002/-003/-004) carry NO claim_tier key, EV-SIG-005
    carries 'toy'; TIER_ORDER.get(None) is None and lines 503-507 then skip the
    ceiling; (L3) all 60 run manifests cited by those 11 records place their
    parameters at run.parameters, while tier_of_run() is fed from
    (body.get("inputs") or {}).get("parameters"), i.e. run.inputs.parameters --
    so the checker sees an empty dict, returns None, and enforces nothing on
    every single run underwriting this goal's closure. The corpus-wide split of
    that layout is 103 manifests top-level-only, 1317 inputs-only, 0 both, 149
    with neither; field_bits is present under the inputs path in 1157 manifests
    and under the top-level path in exactly 1. The constructive half is that
    the severance is REPAIRABLE WITHOUT EDITING ANYTHING: RUN-BKK-001-a records
    parameters {p: [101, 431, 1009], m: [3, 4], ...}, and tier_of_run()'s own
    largest-cell rule gives field_bits = ceil(log2 1009) = 10 <= 32 => tier
    'toy'. The deliverable is a derived tier-certificate register, filed as a
    NEW record, that reconstructs the ceiling for all 60 runs and reports
    whether the 11 promoted claim boundaries survive it.

  object_first_candidate:
    tracked_object: >-
      THE TIER CERTIFICATE: the triple (declared claim boundary, declared
      claim_tier, largest instance size actually reached) followed backwards
      along the citation chain KN-FIND-0xx -> EV-* -> RUN-* -> parameters ->
      field_bits -> TIER_ORDER. It is a single element of the three-point
      total order {toy < medium < crypto} propagating through a fixed sequence
      of records, and the criterion under audit is exactly the assertion that
      it is non-increasing along that chain. Tracking it is what makes this an
      object-first proposal rather than a code review: the failure is located
      by asking where the object stops propagating, and the answer turns out to
      be a key path, not a missing measurement.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: index calculus and
      summation-polynomial cost modelling, Newton polytope / mixed volume
      arguments, Pollard rho and birthday bounds, isogeny and class-group
      structure, factor-base geometry, algebraic solving-degree instrumentation,
      and every other attack family in F1. This proposal contains no ECDLP
      mathematics and must not be allowed to acquire any: its target is the
      program's own verification apparatus, and importing a cryptanalytic lens
      would convert a decidable audit into an unbounded research question. The
      one family deliberately NOT excluded is repository tooling itself, which
      is the object.
    newness_score: >-
      The general move "audit a load-bearing constant or a standing conclusion"
      is standard and is named in this session's generation contract. What is
      new is the specific object and the specific defect: no record, decision,
      correction or open problem in this corpus states that tier_of_run() reads
      run.inputs.parameters while 103 manifests write run.parameters. The
      ANGLE-BRIEF's related item ("the claim-tier ceiling is opt-out") reports
      the off-vocabulary-string hole and reports 513 of 1670 manifests as
      carrying no field_bits; it does NOT identify the path mismatch, does not
      identify that the affected manifests DO carry the parameters needed to
      derive field_bits, and does not connect either to GOAL-FIND-001's own
      completion criterion. Those three are this proposal's content.
    testability_score: >-
      Maximal. Every claim above is a property of files already committed;
      stage 1 is a read of ~50 lines of Python plus a scripted traversal that
      takes seconds, and stage 2 is a differential test on the validator with
      two forced breakpoints derived below. There is no compute risk, no solver
      dependency and no scale extrapolation.
    survival_score: >-
      The tracked object survives the audit by construction -- the whole point
      is that it currently does NOT survive the citation chain. The risk to the
      proposal is not that the object dissolves but that the reconstructed
      ceiling agrees with every promoted boundary, in which case the finding
      shrinks from "the criterion is unmet" to "the criterion is met but was
      never checked". That smaller outcome is stated in advance as the expected
      one and is still worth having, because the goal's closure otherwise rests
      on unverified prose.

  mechanism: >-
    THE CRITERION AS A FORMULA. Write the section 1.1 promotion set as 11
    chains C_i = (F_i, E_i, R_i) where F_i is a KN-FIND entry, E_i the evidence
    record it cites, and R_i the set of run manifests E_i cites. Define
      t(F) = TIER_ORDER[F.claim_tier]                     (link 1)
      t(E) = TIER_ORDER[E.claim_tier]                     (link 2)
      t(R) = max over r in R of tier_of_run(r.inputs.parameters)   (link 3)
    where TIER_ORDER = {toy: 0, medium: 1, crypto: 2} (validate_ledger.py:191)
    and tier_of_run maps max(field_bits) <= 32 -> 0, <= 96 -> 1, else 2
    (lines ~443-447, READ). The goal's criterion is the assertion
      t(F_i) <= t(E_i) <= t(R_i)  for every i.
    The repository enforces only the middle inequality's right half, and only
    when both sides are defined: line ~501 does
    `declared = TIER_ORDER.get(body.get("claim_tier"))`, line ~502-503 builds
    run_tiers dropping every None, and line ~505 fires only if
    `declared is not None and run_tiers and declared > max(run_tiers)`. Three
    independent ways to make the check vacuous therefore exist, and the
    section 1.1 set triggers all three at once.

    WHY LINK 1 IS SEVERED. knowledge/ entries are Markdown with YAML front
    matter and carry `confidence` and `tags`, not `claim_tier`. Measured:
    4 of 48 files in knowledge/findings/ contain a `claim_tier:` line
    (KN-FIND-001, -006, -007, -008); 0 of KN-FIND-017..027 do. The promoted
    boundary is therefore carried ONLY in the prose of the "## Scoped claim"
    section (e.g. KN-FIND-017: "Toy p<=1009, m in {3,4,5}: ..."). Prose is not
    a comparand. No tool in this repository parses it; grep over tools/ for
    field_bits|claim_tier|TIER_ORDER returns validate_ledger.py plus three
    files that do not implement a ceiling (build_duplicate_run_ids.py,
    port_autolab_experiments.py, test_run_supersession.py).

    WHY LINK 2 IS SEVERED. The 11 evidence records are the frozen root-level
    legacy layout (ledger/EV-BKK-001.yaml etc.), written before claim_tier
    became a field. They carry `strength: replicated` and a long
    `validity_reason`, and 10 of the 11 have no `claim_tier` key. Under
    `TIER_ORDER.get(None) -> None` the ceiling is skipped. This is the
    off-vocabulary hole in its purest form -- absence rather than a wrong
    string -- and for the corpus at large the same hole is wide: of 232
    evidence records under ledger/evidence/, 153 carry an in-vocabulary tier
    and 79 do not.

    WHY LINK 3 IS SEVERED, AND THIS IS THE NEW PART. Line ~409 of
    validate_ledger.py caches
    `ctx.run_params[rec_id] = (body.get("inputs") or {}).get("parameters") or {}`
    for each run record; tier_of_run then reads field_bits out of that dict.
    RUN-BKK-001-a's manifest (experiments/EXP-BKK-001/runs/RUN-BKK-001-a/
    manifest.yaml, READ) has no `inputs:` key at all -- its parameters sit
    directly under `run:` as
    `parameters: {p: [101, 431, 1009], m: [3, 4], seeds: [...], targets: [...],
    fb_sizes: {...}, inv_weight: 10}`. The lookup therefore yields {},
    tier_of_run returns None, that run contributes nothing to run_tiers, and if
    every cited run is of this shape then run_tiers is empty and the ceiling is
    skipped for reasons entirely independent of link 2. Measured over the
    section 1.1 set: 60 cited run ids, 0 unresolvable (every manifest exists),
    60 with no field_bits at the path the checker reads. Measured corpus-wide
    over experiments/**/manifest.y*ml: 103 manifests carry a non-empty
    run.parameters and no run.inputs.parameters; 1317 carry a non-empty
    run.inputs.parameters and no run.parameters; 0 carry both; 149 carry
    neither. field_bits appears under the inputs path 1157 times and under the
    top-level path once. The two layouts are disjoint, which is what makes a
    single-path reader silently blind rather than merely incomplete.

    THE FORCED VALUE, DERIVED BEFORE ANY RUN. tier_of_run's documented
    semantics are "the tier is governed by the largest cell". RUN-BKK-001-a
    reaches p = 1009 at most; 2^9 = 512 < 1009 <= 1024 = 2^10, so
    field_bits = ceil(log2 1009) = 10, and 10 <= 32 gives tier 0 = toy. The
    reconstructed ceiling for that chain is therefore EXACTLY 'toy', and
    KN-FIND-017's declared boundary "Toy p<=1009" is at that ceiling, not above
    it. The audit's headline prediction is that this holds for all 11 chains,
    i.e. that the criterion is SUBSTANTIVELY MET AND PROCEDURALLY UNCHECKED.
    It can fail: any chain whose runs reach a prime above 2^32 forces tier
    medium or crypto, and any chain whose KN-FIND prose asserts a bound above
    its reconstructed ceiling falsifies the criterion outright. The primes
    reached by the SIG-002..005, REP-002, NCP-001, FB-001 and EQJ-001 runs have
    NOT been read in this session and are not asserted here.

    WHY A DERIVED CERTIFICATE IS ADMISSIBLE. Reconstructing field_bits from a
    recorded prime is not a re-measurement and creates no new evidence: it is
    an arithmetic function of a value already frozen in an immutable manifest,
    computed by a rule the repository already publishes. The output is filed as
    a new register record that SUPERSEDES nothing and EDITS nothing (AGENTS.md
    rule 2); it makes an existing, unread number legible to the existing check.

    TWO REPAIRS ARE AVAILABLE AND THE AUDIT MUST NOT CHOOSE BETWEEN THEM. (a)
    Teach tier_of_run to fall back to run.parameters when run.inputs.parameters
    is empty -- ~2 lines, governs 103 manifests immediately. (b) Derive
    field_bits from p / prime / primes / field_size when field_bits is absent
    -- larger blast radius, and a modelling choice (which key means what) that
    a Coordinator, not this proposal, must approve. The audit reports both with
    their measured coverage; recommending one is outside its authority.

  novelty_status: unverified

