      claim_tier is machine-checked for all eleven; the prose boundaries are
      quoted only for those read in full.
    - >-
      The session ANGLE-BRIEF's "claim-tier ceiling is opt-out" item. NOT READ
      AS A PRIMARY SOURCE -- it is a scouting summary produced this session.
      Its figures (76 of 229 off-vocabulary; 513 of 1670 manifests without
      field_bits) are RELAYED and differ from what was measured here (79 of 232
      under ledger/evidence/; 412 of 1569 manifests lacking a readable
