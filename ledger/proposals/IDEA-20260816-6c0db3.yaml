idea:
  id: IDEA-20260816-6c0db3
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: Run the nearby-object control on the divisor-parity gate by moving from ordinary to symmetric
    4x4 matrices, where the same data q_ij equals a_ij times a_ji becomes a_ij squared and therefore
    must itself be a square, and test whether the gate can tell the two realizability questions apart
    at all
  class: mechanism
  claim: '(A) Section 8 item 4 of docs/inventor-protocol.md requires a nearby-object control: bound
    what a method could prove under ideal tuning, then apply it to the closest object where the hoped-for
    conclusion fails, because a method that cannot distinguish the pair has not identified the load-bearing
    structure. The divisor-parity gate has never received this audit. (B) The closest object is the
    SYMMETRIC 4x4 matrix. The prescribed data is identical -- the same fifteen principal minors --
    but realizability by a symmetric matrix is a strictly different question, and it differs in a
    way made of the same material the gate is built from: the frozen construction sets q_ij equal
    to p_i p_j minus p_ij, which for any realizing matrix equals a_ij times a_ji, so in the symmetric
    case q_ij equals a_ij squared and must be a SQUARE in k(t). That is an extra square-class condition
    of exactly the type the gate already computes, on a quantity the gate already forms, and the frozen
    gate does not test it. (C) The proposal is to construct the symmetric-realizability square-class
    conditions on q_ij, run them alongside the frozen Delta conditions on the same tables, and measure
    the verdict separation: how many tables the frozen gate treats identically that the symmetric
    conditions separate, and vice versa. (D) What is NOT claimed: that symmetric realizability is
    the question RQ-PMA-001 asks -- it is not, the question is about ORDINARY matrices, and the symmetric
    case appears here purely as the control object. Nor is it claimed that the gate should distinguish
    them; the point is to MEASURE whether it does, and either answer is informative. (E) Also NOT
    claimed: that q_ij being a square is sufficient for symmetric realizability. It is one necessary
    condition among several, exactly parallel to the frozen gate''s own one-directional status. (F)
    No attack, speedup or security consequence is claimed.'
  mechanism: 'Stage 1 derives and states the symmetric-side condition precisely: for a symmetric realization,
    q_ij equals a_ij squared for every pair, so each of the six q_ij must be a square in k(t) -- a
    square-class test on six quantities the frozen construction already computes as intermediates.
    Stage 2 implements the six-fold square-class test using the same certificate machinery the frozen
    gate uses for Delta, so that any difference in behaviour is attributable to the quantity tested
    and not to a different implementation. Stage 3 runs both gates on the same tables and builds the
    two-by-two separation table: frozen verdict against symmetric verdict, over the grid. Stage 4
    is the nearby-object audit proper: it asks whether there exists a table where the frozen gate
    says NOT_OBSTRUCTED_BY_THIS_GATE while the symmetric condition fires, which is expected and confirms
    the two questions are distinguishable by this material; and whether there exists a table where
    they agree everywhere across the grid, which would mean the gate cannot separate the pair on this
    family. Stage 5 validates both gates against constructed witnesses: symmetric matrices sampled
    explicitly, whose tables must pass the symmetric conditions, and general non-symmetric matrices
    whose tables must pass the frozen gate. Stage 6 measures the METHOD CEILING: the fraction of the
    grid on which the frozen gate returns any verdict other than NOT_OBSTRUCTED_BY_THIS_GATE, which
    bounds what it could ever prove under ideal tuning on this family.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/proposals/IDEA-20260726-012.yaml claim, mechanism and interpretation_limits
      in full, ledger/hypotheses/H-PMA-001.yaml statement and interpretation_limits in full, ledger/questions/RQ-PMA-001.yaml
      scope in full, docs/inventor-protocol.md section 8 in full. Grepped ledger/proposals/ and ledger/hypotheses/
      for: symmetric matrix, symmetric, nearby object, method ceiling, ordinary matrix, bordered,
      block matrix.'
    results: IDEA-20260726-012's interpretation_limits state that one certified odd divisor would
      not reject bordered, block, augmented, shifted, algebra-valued or extension-field representations;
      H-PMA-001 repeats the same list. Symmetric matrices are NOT in that list in either record, which
      is notable because the symmetric case is the nearest neighbour of all of them and the one whose
      extra condition is made of the same square-class material. No record anywhere computes a symmetric
      realizability condition, tests whether q_ij is a square, or runs a nearby-object control on
      any PMA object. method ceiling returns no hits in ledger/proposals/ or ledger/hypotheses/ in
      connection with PMA. Section 8 of docs/inventor-protocol.md was adopted from KN-TECH-080 after
      IDEA-20260726-012 was written on 2026-07-26, so neither PMA record carries a proof_search_map
      and none of the four audits has ever been run against this mechanism.
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository -- that principal
      minors of a symmetric matrix constrain off-diagonal entries through squares is elementary algebra,
      and no claim is made about what any external source says. Claimed new inside this repository:
      the symmetric case as the designated nearby-object control for this gate, the observation that
      the symmetric condition is a square-class test on q_ij, a quantity the frozen construction already
      forms and does not test, and the measured separation table. Assembled from known parts: the
      q_ij formula is IDEA-20260726-012''s own; the certificate machinery is shared with the frozen
      gate deliberately; the audit itself is docs/inventor-protocol.md section 8 item 4 applied literally.'
  object_first_candidate:
    tracked_object: The pair of square classes (class of q_ij, class of Delta_ijk) followed together,
      where the frozen gate tracks only the second. The tracked object is therefore an ENLARGED certificate
      over the same intermediates, and what propagates through the computation is the joint verdict
      pair (ordinary gate verdict, symmetric condition verdict) per table.
    lossiness: 'Genuinely lossy, and the entry''s contribution is showing that the frozen gate is
      lossier than it needs to be on data it already holds. Both classes discard everything about
      their rational functions except parity and constant class. But the frozen gate additionally
      discards q_ij''s own class entirely, retaining q_ij only through the product q_ij q_jk q_ki
      inside Delta -- and a product of three nonsquares can be a square, so the product genuinely
      loses the individual classes. That is a concrete, checkable loss: the map from three square
      classes to their product is two-to-one on the relevant group, so the frozen gate cannot recover
      what the symmetric condition needs. The retained parts propagate compatibly because square classes
      multiply.'
    propagation: One step of the target operation is multiplying one q_ij by a square times a unit.
      The Delta side sees only the product q_ij q_jk q_ki, so multiplying two of the three by the
      same nonsquare leaves Delta's class unchanged while flipping two individual classes -- an explicit
      propagation-level demonstration that the frozen gate is blind to a move the symmetric condition
      sees. Constructing such a pair of tables is the sharpest single experiment in this entry and
      it is a construction, not a search.
    survival_score: 'The joint certificate survives exactly as far as the frozen gate does, since
      it uses the same machinery on the same field: to every degree the factorisation handles over
      k(t). It dissolves at the same places -- degenerate branches where a q_ij vanishes, characteristic
      2 which is out of scope, and factorisation caps over Q. The interesting survival statement is
      different: the SEPARATION between the two verdicts survives only where at least two of the three
      q_ij in a triple have nontrivial class, and the run measures the fraction of the grid where
      that holds, which is the concrete boundary of the control''s discriminating power.'
  null_object_control: 'Three arms, all in one invocation through shared machinery. NULL S (symmetric
    soundness): tables computed as the exact principal minors of explicitly sampled SYMMETRIC matrices
    over k(t); the symmetric conditions must fire at rate exactly zero, since realizability by a symmetric
    matrix holds by construction with the matrix as witness. NULL G (ordinary soundness): tables from
    explicitly sampled general non-symmetric matrices; the frozen gate must fire at rate exactly zero.
    NULL R (background): degree-matched uniformly sampled tables, giving the background rate for both
    gates and hence the baseline separation rate expected from coarseness alone. For the separation
    measurement to mean anything, NULL S and NULL G must both be exactly zero, and the observed separation
    on the signal grid must exceed NULL R''s separation rate; if it does not, the two gates differ
    no more than two arbitrary square-class tests of the same shape would.'
  discriminated_from:
  - 'IDEA-20260726-012''s interpretation_limits list of representations not rejected (bordered, block,
    augmented, shifted, algebra-valued, extension-field): that is a disclaimer enumerating what a
    positive result would not cover. This entry takes one specific nearby object, derives its extra
    condition, implements it, and measures separation -- a disclaimer is not a control.'
  - 'Entry 5 of this bucket (component attribution): decomposes ONE certificate into its parts. This
    adds a SECOND certificate on a different quantity and measures whether the two separate tables;
    different object, different question.'
  - 'Entry 6 of this bucket (density against two nulls): measures one gate''s firing rate. This measures
    the joint distribution of two gates'' verdicts, which is a two-dimensional object.'
  - 'Entry 7 of this bucket (quantifier order and observation collision): runs section 8 audits 2
    and 3. This runs audits 1 and 4 -- method ceiling and nearby-object control -- so the two entries
    are complementary halves of the same required audit set and neither subsumes the other.'
  - 'A generic proposal to study symmetric PMA: RQ-PMA-001 asks about ORDINARY matrices and this entry
    does not change that. The symmetric case enters only as the control object and no symmetric-realizability
    result is sought or claimed.'
  assumptions:
  - For any matrix realizing a prescribed table, q_ij equal to p_i p_j minus p_ij equals a_ij times
    a_ji; this is the frozen construction's own identity and is CHECKED on sampled matrices rather
    than assumed.
  - Hence for a symmetric realization q_ij equals a_ij squared and must be a square in k(t); necessary,
    not sufficient, exactly parallel to the frozen gate's one-directional status.
  - The same certificate machinery applied to q_ij and to Delta gives comparable verdicts, so that
    observed differences are attributable to the quantity and not to the implementation; this is enforced
    by literally sharing the code path.
  - Degenerate cases where some q_ij vanishes are branched and excluded from both gates and from the
    separation table, per RQ-PMA-001's constraints; a vanishing q_ij is not a nonsquare.
  predictions:
  - metric: null_S_symmetric_condition_firing_rate
    direction: lower
    minimum_effect: exactly 0 across at least 300 tables pulled back from explicitly sampled symmetric
      matrices; any firing is a false obstruction with the symmetric witness attached
  - metric: null_G_frozen_gate_firing_rate
    direction: lower
    minimum_effect: exactly 0 across at least 300 tables pulled back from explicitly sampled general
      matrices
  - metric: constructed_blindness_pair_found
    direction: different
    minimum_effect: 'forced value: at least 1. Two tables constructed to differ by multiplying two
      of three q_ij in a triple by the same nonsquare must have identical frozen-gate Delta classes
      and different symmetric-condition verdicts; this is a construction, not a search, and failing
      to produce it means the propagation claim is wrong'
  - metric: signal_grid_separation_rate_minus_null_R
    direction: higher
    minimum_effect: an absolute difference of at least 0.15; below that, the two gates separate no
      more than two arbitrary square-class tests of the same shape would, and the record says so
  - metric: frozen_gate_method_ceiling_on_grid
    direction: different
    minimum_effect: 'I refuse to pre-commit a value. Reason: the fraction of the grid on which the
      frozen gate returns anything other than NOT_OBSTRUCTED_BY_THIS_GATE is precisely H-PMA-001''s
      unmeasured non-vacuity question, and pre-committing it would be inventing the result the whole
      bucket exists to measure.'
  minimal_test:
    design: 'Build the constructed blindness pair. Take any table with a triple whose three q_ij have
      known square classes, multiply two of them by the same nonsquare unit by adjusting the corresponding
      p_ij, and verify two things directly: that Delta''s square class is unchanged, because the product
      q_ij q_jk q_ki is unchanged, and that the symmetric condition''s verdict flips, because two
      individual classes flipped. That is a construction with a handful of exact operations over k(t)
      and costs seconds. It settles the load-bearing question of the whole entry -- whether the frozen
      gate is blind to a move the nearby object sees -- without any grid, any sampling, any null and
      any existence decider. If the pair cannot be constructed, the propagation claim is wrong and
      nothing else in the entry is worth running. If it can, the grid measurement and the three nulls
      follow to turn a construction into a rate.'
    controls:
    - 'NULL S: at least 300 tables from explicitly sampled symmetric matrices, each reverified by
      an independent minor implementation; symmetric conditions must not fire.'
    - 'NULL G: at least 300 tables from explicitly sampled general non-symmetric matrices, each reverified;
      frozen gate must not fire.'
    - 'NULL R: degree-matched uniformly sampled tables, giving background firing and separation rates
      for both gates.'
    - 'Identity control: q_ij equal to p_i p_j minus p_ij equals a_ij times a_ji, checked exactly
      on 10^4 sampled matrices, and equals a_ij squared on sampled symmetric ones.'
    - 'Shared-machinery control: the same square-class certificate routine is invoked for q_ij and
      for Delta, verified by a call-trace assertion, so implementation differences cannot masquerade
      as verdict differences.'
    - 'Degenerate-branch control: tables with any vanishing q_ij are branched and excluded from both
      gates and from the separation table, with counts reported.'
    required_metrics:
    - 'the two-by-two separation table: frozen gate verdict against symmetric condition verdict, counts
      per cell, over the signal grid and over NULL R'
    - separation rate, defined as the fraction of decided tables where the two verdicts differ, per
      arm
    - NULL S and NULL G firing rates (both must be exactly 0), with witnesses for any firing
    - the constructed blindness pair, printed in full with both tables, both Delta classes and both
      symmetric verdicts
    - 'frozen gate method ceiling: fraction of the grid receiving any verdict other than NOT_OBSTRUCTED_BY_THIS_GATE'
    - 'symmetric condition method ceiling: the same fraction for the six-fold q_ij test'
    - per-triple count of how many of the three q_ij have nontrivial class, since separation is possible
      only when at least two do
    - identity control violations and degenerate-branch counts
  falsification_conditions:
  - 'The identity q_ij equals a_ij times a_ji fails on any sampled matrix: the frozen construction''s
    own intermediate is misimplemented and everything downstream is void.'
  - 'NULL S fires on any table passing reverification: the symmetric condition is unsound, with an
    explicit symmetric witness matrix.'
  - 'NULL G fires on any table passing reverification: the frozen gate is unsound, with an explicit
    general witness matrix -- falsification direction 1 of H-PMA-001 reached through a different route
    than entry 6 of this bucket.'
  - 'The constructed blindness pair cannot be produced: the propagation claim that Delta sees only
    the product of the three q_ij classes is wrong, and the entry''s premise fails.'
  - 'Signal-grid separation rate within 0.15 of NULL R''s: the two gates separate no more than two
    arbitrary same-shape square-class tests would, so the symmetric object is not acting as an informative
    nearby control on this family.'
  - The frozen gate's method ceiling on the grid is zero -- it returns NOT_OBSTRUCTED_BY_THIS_GATE
    on every decided table -- which measures vacuity on the tested family and is a decisive scoped
    result about H-PMA-001's non-vacuity prediction rather than a null.
  confounders:
  - Symmetric matrices are a measure-zero subfamily, so a sampled symmetric ensemble has systematically
    different minor degree profiles from a general one; NULL S and NULL G are therefore not directly
    comparable to each other and each is compared only to its own gate.
  - The six q_ij within one table are not independent -- they are built from the same fifteen prescribed
    values -- so a six-fold test firing is not six independent events and the firing rate must be
    reported per table, not per q_ij.
  - A vanishing q_ij is a degenerate branch, not a nonsquare; conflating them would make the symmetric
    condition fire spuriously and would manufacture separation.
  - Separation requires at least two of three q_ij in a triple to have nontrivial class; on a family
    where q_ij is almost always a square, separation is structurally impossible and the measured rate
    says nothing about the gates.
  - 'Sharing the certificate machinery is necessary for attribution but creates a common-mode failure:
    a bug in the shared routine affects both gates identically and could hide a genuine difference.
    The constructed controls in both directions are the mitigation.'
  interpretation_limits:
  - RQ-PMA-001 asks about ORDINARY matrices. The symmetric case appears here only as the nearby-object
    control and no symmetric-realizability conclusion is sought, claimed or supported.
  - The symmetric condition is necessary and not sufficient, exactly like the frozen gate; a table
    passing it may still have no symmetric realization.
  - A measured separation shows the two questions are distinguishable by this material on this family;
    it does not show the frozen gate is correct, nor that it is incorrect.
  - A zero method ceiling on the tested grid is a statement about the family and the parameter assignments,
    not about principal-minor assignment.
  - Nothing transfers to bordered, block, augmented, shifted, algebra-valued or extension-field representations,
    which remain outside every claim here as they are in IDEA-20260726-012's own limits.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost per table is six additional square-class certifications
      on quantities the frozen construction already computes, plus the three it already performs.
    memory_exponent: No attack exponent is claimed. Memory is nine certificates per table plus a two-by-two
      counter array.
    best_known: The incumbent is the frozen gate of IDEA-20260726-012 and H-PMA-001, which computes
      q_ij as an intermediate and tests only Delta. There is no symmetric-side condition and no nearby-object
      control anywhere in the repository, so on that axis there is no incumbent at all.
    hidden_overhead: 'Hidden cost sits in the ensembles: sampling symmetric matrices over k(t) with
      minor degree profiles comparable to anything else is harder than sampling general ones, because
      symmetry halves the free entries and changes the degree growth, so NULL S may be intrinsically
      unmatched and the record must say so rather than pretend otherwise. Second hidden cost is the
      common-mode risk of sharing the certificate routine, which buys attribution and costs independence.'
  dominated_by: 'n/a (no result claimed). Checked across time, memory and data/query axes: no cryptanalytic
    quantity, no algorithm and no source-to-scalar candidate is produced, so no frontier row applies.
    Within this repository the frozen gate does not dominate this entry, because this entry computes
    a strictly larger certificate on the same intermediates at a small constant multiple of the cost.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The internal quantitative comparison:
    the frozen gate performs three square-class certifications per table and reports one ternary verdict;
    this contract performs nine on the same intermediates and reports a verdict pair plus a separation
    cell, at roughly three times the certification cost and no additional algebraic machinery. That
    is an output-and-cost ratio internal to one instrument, not a comparison with any method.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part B (the derivation that q_ij equals a_ij squared for a symmetric
    realization, hence must be a square): 0.93 -- it follows directly from the frozen construction''s
    own identity, and the identity control checks it; the residual risk is a sign or indexing convention
    in the frozen formulas. Part propagation and the constructed blindness pair: 0.75. The product
    of three square classes losing the individual classes is elementary group theory, but actually
    constructing a table pair that realises the move while keeping everything else legal, including
    the degenerate-branch exclusions, is fiddlier than it looks. Part NULL S and NULL G both exactly
    zero: 0.7 jointly, with NULL S the weaker half because the symmetric condition is freshly derived
    and has had no prior scrutiny. Part D (signal-grid separation exceeding NULL R by 0.15): 0.4 --
    genuinely uncertain and dependent on how often q_ij is a nonsquare on the highly structured prescribed
    family, which nobody has measured. Part method ceiling being nonzero, i.e. the frozen gate firing
    at all on the grid: 0.55, which is the same unmeasured non-vacuity question H-PMA-001 predicts
    on and which I decline to assume.'
