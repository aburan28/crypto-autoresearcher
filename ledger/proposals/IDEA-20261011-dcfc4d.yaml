  title: Solver selection by total verified-relation cost - does the solver-stage ranking of the m=83 matrix survive charging construction, failed searches, lifting, verification and rank updates
  class: measurement
  claim: |-
    On the m=83 Koblitz quotient workload (E0: y^2+xy=x^3+1 over F_{2^83}, cofactor 4, Frobenius order 83; fixed-phase S4 inputs and the nested normal-subspace payload sweep s in {2, 3, 4}), ranking FES, CryptoMiniSat-XOR, Boolean F5B, Boolean F4-style and Z3 by total charged cost per completed attempt, divided by the engine's completion fraction (equation build, solver stage, unsuccessful searches, lifting, verification, rank updates, timeouts charged at their cap), differs from the ranking by solver-stage median seconds in at least one engine pair at some payload, or the non-solver share of total cost is at least half. H0 (solver-stage ranking is a valid selection rule): identical order at every payload and a solver share above half.
  mechanism: |-
    OBJECT FRAME. R1; Sigma = the pipeline stages around one decomposition oracle; Class I partial-action; no new projection, an accounting change. With exact engines the number of attempts per relation is engine-independent, so total cost per relation = (C_build + C_engine + C_lift + C_verify) / (yield x completion fraction). Solver-stage seconds see only C_engine; completion fraction differs by engine (reported: F4-style and F5B time out at payload s >= 3, FES grows 64 to 4096 assignments, CryptoMiniSat stays flat). Priced number: the non-solver share. Stage: whole relation phase. F2 is the lens; added: a selection rule from complete cost.
