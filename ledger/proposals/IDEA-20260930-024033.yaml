      van Oorschot-Wiener curve T = sqrt(N^3 / w): the lever would lie a factor
      p^{1/12} below it at w = p^{1/6}; the curve is the standing frontier.
    best_known: >-
      Time and memory p^{1/3+o(1)} conditional on Heuristic 1 (source Theorem
      1.1); the vOW interpolation between that point and p^{1/2} (log p)^{O(1)} at
      polynomial memory (Delfs-Galbraith).
    hidden_overhead: >-
      The o(1) of the source, disclosed by its author as superpolynomial, is not
      changed by this lever; any streaming implementation adds a heap factor
      O(log M) and the label-list sort, both polylogarithmic in M.
    tradeoff_note: >-
      Attempts and the heap streams are embarrassingly parallel; the lever, if it
      existed, would move a point off the vOW curve rather than along it. No
      parallelisation claim is made.

