  assumptions:
    - >-
      The lever is scoped to ORDERED-MERGE (Schroeppel-Shamir-type) streaming of
      the codomain-keyed claw. Other memory schemes (vOW, rebuild-and-shard) are
      the comparators and are not claimed closed by this record.
    - >-
      Keys are valued in an abelian group (cyclic arithmetic included) and labels
      are functions of the isogeny and of canonical torsion bases; non-abelian
      group-valued keys carry no order compatible with composition and are
      outside the class (stated, not proved).
    - >-
      The primes S used in the lists are prime to N, and the lists omit
      N-isogenies; p is large against N (the census panel uses p > N^4).
    - >-
      Heuristic 1 of the source is assumed only where the p^{1/3} time is quoted;
      it plays no role in the ceiling.

  proof_search_map:
    bottleneck: >-
      The existence of a key g on supersingular curves with (K1) sigma-
      compatibility, (K2) additivity along isogenies with labels independent of
      the middle curve, (K3) alphabet at least M = p^{1/3}. Its existence is the
      single step whose removal changes the theorem (memory p^{1/3} to p^{1/6} at
      the same time); its non-existence in the abelian class is the claimed
      ceiling.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is the incumbent keyed table (memory M, time
        M / P0) and the van Oorschot-Wiener curve T = sqrt(N^3 / w), N = p^{1/3},
        at w = p^{1/6} giving T = p^{5/12}. Reproduced symbolically: set the key
        to the full j-invariant (alphabet p, trivially satisfying K1 and K3, not
        K2) and recover the table.
      reproduction_check: >-
        Frozen fixture 1: on the abelian Cayley graph Z/n with generator set
        {+-a, +-b} the key g(x) = x satisfies K1-K3 and the four-list streaming
        returns a match with memory sqrt of the list size (the instrument must
        read an abelian holonomy). Frozen fixture 2: on the F_p-rational spine
        (closed walks restricted to the commutative subring Z[sqrt(-p)]) the
        holonomy image in GL_2(Z/N) must be abelian. Any other reading is an
        instrument defect and nothing on the general graph is read.
    observation_collision:
      observable: >-
        The pair (key value, degree) of a marked vertex, and the holonomy
        subgroup H_N together with its abelianisation.
      distinct_preimage_search: >-
        Two marked vertices of the same degree class are indistinguishable by any
        abelian path-independent key if H_N contains SL_2(Z/N) (N prime to 6):
        the observable collapses to the degree. The dangerous collision is
        between "no abelian quotient" and "an abelian quotient the census
        missed because the panel's p is too small against N"; the p > N^4 rule
        and the stabilisation check (images of 100, 200, 400 elements agree)
        separate them. The null for the census is a random subgroup of
        GL_2(Z/N) of the same order, which has a generic abelianisation.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The holonomy subgroup H_N of the N-marked groupoid and the order of
          its largest path-independent abelian quotient, as the stronger
          invariant that decides whether any key beyond the degree exists.
        predicted_gain: >-
          A yes/no verdict per (p, N); predicted: the quotient is det only, so
          the key alphabet is the number of degrees.
      - transform: observable_fiber
        proposed_object: >-
          Fibre of the key over a fixed degree: the set of marked vertices of one
          degree class; the claim is that the fibre is a single orbit of an
          abelian-trivial group action.
        predicted_gain: >-
          Names exactly what an ordered merge could not separate, and hence what
          a successor would have to supply (non-abelian order, or extra data).
    quantifier_order: >-
      FOR ALL N >= 2, FOR ALL supersingular primes p with p > N^4, FOR ALL
      abelian groups A, FOR ALL path-independent A-valued cocycles g on the
      N-marked groupoid with labels determined by the isogeny: g factors through
      the degree (conditional on strong approximation, and exact for N prime to
      6; for N dividing 6 the extra abelian quotients are carried by
      path-dependent holonomy). EXISTS-or-not a larger quotient at some (p, N) is
      the census question. The weaker reading NOT claimed: "no memory reduction
      below p^{1/3} at time p^{1/3} exists" (false in the vOW interpolation at
      higher time, and unknown in classes other than ordered merge).
    method_ceiling:
      strongest_certifiable_claim: >-
        Conditional on strong approximation: within the class of ordered-merge
        streaming of the codomain-keyed claw, with abelian keys and isogeny-
        determined labels, the achievable memory at time p^{1/3} is the incumbent
        p^{1/3+o(1)}; the only ordered key is the degree. It certifies nothing
        about vOW-type, rebuild-and-shard, quantum, or non-abelian schemes, and
        nothing about the time exponent.
      nearby_object_control: >-
        The F_p-rational spine and the abelian Cayley graph, where an abelian
        holonomy and a key DO exist and the same instrument must say so; and the
        random regular graph, where no covering structure exists. A derivation
        that forbids the spine key proves too much and is wrong.
    proof_obligations:
      - claim: A key satisfying K1-K3 with isogeny-determined labels is path independent.
        responsibility: correctness
      - claim: Path independence is equivalent to triviality of the key on the holonomy group H_N of the N-marked groupoid.
        responsibility: correctness
      - claim: H_N contains SL_2(Z/N) for p large against N (strong approximation for the S-unit group of a maximal order).
        responsibility: feasibility
      - claim: SL_2(Z/N) is perfect for N coprime to 6, hence an abelian-valued key factors through det, and det of the transport matrix is the degree (Weil pairing).
        responsibility: strictness
      - claim: The alphabet of a degree-only key is at most the number of distinct degrees of list entries, about X = p^{1/6+o(1)}, which is below M.
        responsibility: size
      - claim: The ordered merge with an alphabet below M has M^2 / alphabet false candidate pairs, exceeding M, so time is not p^{1/3}.
        responsibility: runtime
      - claim: The streaming memory is O(M^{1/2}) when K1-K3 hold (assembly of the Schroeppel-Shamir argument on the fibred structure).
        responsibility: memory
    not_applicable_reason: null

