  minimal_test:
    design: >-
      CELL. Stage 0 (zero compute): write the seven obligations with numbered
      steps; run the derivation on fixtures 1 and 2 and record the step at which
      it must NOT break (it must go through on the abelian Cayley graph and on
      the spine) and the step at which it must break on the random regular graph
      (no covering structure). Stage 1 (minutes to hours, pure Python): the
      HOLONOMY CENSUS. For each of the primes p = the smallest prime congruent
      to 3 modulo 4 at or above 2^10, 2^11, 2^12, 2^13, 2^14 (the instrument
      computes them), use the standard maximal order of B_{p,infinity}
      (i^2 = -1, j^2 = -p, O = Z<1, i, (1+j)/2, (i+k)/2>), enumerate the elements
      alpha of O with Nrd(alpha) in the set {2^a 3^b : 0 <= a + b <= 8} (S = {2, 3}),
      and for N in {5, 7} map each alpha to GL_2(Z/N) via O/NO = M_2(Z/N) (a fixed
      isomorphism, recorded); a second pass with S = {5, 7} serves N in {2, 3, 4}.
      Form the generated subgroup H_N by breadth-first closure (|GL_2(Z/7)| = 2016,
      so the closure is trivial in cost); record |H_N|, [GL_2(Z/N)_S : H_N],
      |H_N^{ab}| and the order of H_N cap SL_2(Z/N) abelianised. Stabilisation
      rule: re-run with the first 100, 200 and 400 enumerated elements; a cell
      whose |H_N| differs across the three is UNDETERMINED(sampling), not read.
      Spine arm: the same procedure with only the elements of Z[j] = Z[sqrt(-p)].
      Null arm: for each cell a seeded random subgroup of GL_2(Z/N) of the same
      order, abelianised by the identical code. Stage 2 (cryptographic size,
      conditional on a Deuring-capable environment, which the deferral of the
      earlier SSIQ run shows is not guaranteed; an environment impediment is not
      evidence): sample 200 random maximal orders at p = 5 * 2^248 - 1 by the
      source's section 4.2 procedure, collect lattice vectors with B-smooth norm
      for B = 2^20 (S = primes up to B with the primes of N dropped), and repeat
      the census on the images mod N for N in {2, 3, 4, 5, 7}.
      METRICS (units). |H_N| (count); index (count); |H_N^{ab}| (count); R_max(N)
      (count); M = p^{1/3} (reported as log2).
      CONTROLS. Spine arm (abelian expected); null arm (generic abelianisation);
      the stabilisation check; Stage 0 fixtures.
      OUTCOME TABLE. E-CLOSED: the memory lever is closed in the ordered-merge
      class; forward guidance below. E-OPEN: reported cell by cell, no design is
      seeded unless R_max can reach M. ARTIFACT: the spine arm is non-abelian, the
      stabilisation check fails on more than 20% of cells, or the O/NO
      isomorphism check (image of 1 is the identity, determinant equals the norm
      modulo N on all enumerated elements) fails: run void.
      FALSIFICATION THRESHOLD, FIXED NOW. E-CLOSED is falsified iff at least one
      cell with p > N^4 and N in {4, 5, 7} has [GL_2(Z/N)_S : H_N] > 1 AND a
      nontrivial path-independent abelian quotient beyond det. E-OPEN is
      falsified iff every cell with p > N^4 has index 1.
      COST (estimate, order of magnitude): implementation low (about 150 lines
      for the quaternion enumeration and the group closure); compute low
      (minutes); Stage 2 depends on the environment.
    controls:
      - Spine arm restricted to Z[sqrt(-p)]; the holonomy image must be abelian.
      - Seeded random subgroup of GL_2(Z/N) of equal order as the generic-abelianisation null.
      - Abelian Cayley graph fixture for the streaming key (positive control for the mechanism).
      - Stabilisation of |H_N| across 100, 200, 400 elements.
      - O/NO isomorphism checks (identity, determinant equals norm modulo N).
    required_metrics:
      - Stage 0 verdict per obligation with the step numbers
      - 'per (p, N) cell: |H_N|, index in GL_2(Z/N)_S, |H_N^ab|, abelianisation of H_N cap SL_2'
      - spine-arm and null-arm values per cell
      - R_max(N) against M = p^{1/3} per cell and per cryptographic-size row
      - stabilisation record and artifact flags

  falsification_conditions:
    - 'E-CLOSED falsified iff a cell with p > N^4 and N in {4, 5, 7} shows a nontrivial path-independent abelian quotient beyond det (threshold fixed above).'
    - 'E-OPEN falsified iff every cell with p > N^4 returns index 1.'
    - 'The Stage 0 derivation goes through on the random regular graph: it proves too much and is wrong at an unidentified step; nothing downstream may cite it.'
    - 'The Stage 0 derivation breaks on the F_p-rational spine or the abelian Cayley graph: the load-bearing hypothesis is mis-identified.'
    - 'The spine arm is non-abelian: instrument defect, run void (AGENTS.md rule 3).'
    - 'A key with K1-K3 and alphabet at least M is exhibited by any route: the closure is superseded by a new record, not amended.'

  confounders:
    - >-
      Toy primes are small against the claim "p large against N": the panel's
      p > N^4 rule and the stabilisation check are the guards; a cell with p <= N^4
      is reported and not read.
    - >-
      The choice S = {2, 3} excludes N divisible by 2 or 3 from some cells (the
      transport is defined only for degrees prime to N); N = 2, 3, 4 are read
      with S = {5, 7} in a second pass so that every N is exercised by at least
      one S.
    - >-
      Holonomy is computed for a maximal order at one vertex of the graph; the
      graph is connected, so conjugation changes H_N by an inner automorphism
      and not its abelianisation, but the instrument records the vertex.
    - >-
      Labels are assumed to be functions of the isogeny alone; a label that
      uses information about the child curve beyond the isogeny would break
      the fibred-product structure the streaming needs and is outside the class.
    - >-
      SQIsign-type primes make full 2^e marking cheap, so a cost argument is not
      claimed; the closure rests on path independence and is stated so.

  interpretation_limits:
