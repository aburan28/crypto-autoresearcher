idea:
  id: IDEA-20260930-024033
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    THE ORDERED-KEY OBSTRUCTION ON THE MEMORY AXIS: Schroeppel-Shamir-style
    streaming of the Frobenius claw would give (time, memory) = (p^{1/3}, p^{1/6}),
    a factor p^{1/12} below the van Oorschot-Wiener curve at that memory, but it
    needs an abelian-valued key on the isogeny groupoid that depends on the
    endpoint curves only; a strong-approximation argument says the only such key
    on the level-N-marked groupoid is the degree, so the lever closes at a named
    obstruction (path-dependent holonomy) unless a holonomy census at toy primes,
    with a Cayley-graph positive control, shows otherwise
  class: mechanism

  claim: >-
    EXPONENT BUDGET, STATED FIRST. This record targets the MEMORY AXIS of the
    archived algorithm (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, Lemma 3.3 and
    Theorem 1.1: list of Psi(X,B) X^{1+o(1)} = p^{1/3+o(1)} entries, expected time
    M / P0 with M = p^{1/3+o(1)} and P0^{-1} = p^{o(1)}, memory about M). F1, F2 and
    F4 are untouched; the factor acted on is the STORAGE of the F3 list. Claimed
    movement IF the lever existed: memory from p^{1/3+o(1)} to p^{1/6+o(1)} at
    unchanged time p^{1/3+o(1)}. For comparison the source's own interpolation
    (paper_fulltext.md line 39) is time sqrt(N^3/w) with N = p^{1/3}, i.e. at
    w = p^{1/6} the time is p^{5/12}; the lever would sit a factor p^{1/12} below
    that curve. THE TIME EXPONENT DOES NOT MOVE TOWARD 1/4: the lever is not a
    route to p^{1/4}, and the record says so. It is filed because the memory
    exponent is the factor the source itself calls "a serious obstacle" and
    because the mechanism it would need is a named, checkable algebraic object.
    The corollaries EndRing and Isogeny (Corollary 1.2, via the Page-Wesolowski and
    Herledan Le Merdy-Wesolowski reductions as cited by the source, which this
    program has not checked) would inherit a memory improvement and no time change.

    THE MECHANISM THAT WOULD DO IT. The claw asks for psi, chi in L with
    cod(psi) = sigma(cod(chi)), sigma the Frobenius j -> j^p. Split every entry as
    psi = psi_b o psi_a with deg psi_a about X^{1/2} and deg psi_b about X^{1/2}:
    L is a FIBRED product, L = disjoint union over middle curves v in cod(L_a) of
    ext(v), with |L_a| about M^{1/2} and |ext(v)| about M^{1/2}. The classical
    four-list algorithm of Schroeppel and Shamir (recalled) streams such a set in
    SORTED order of a key with a heap over the M^{1/2} middle elements and ONE
    shared sorted list of M^{1/2} labels, merges the stream against a second
    stream sorted in the opposite order, and finds a match with memory
    O(M^{1/2}) at the time of plain meet-in-the-middle. It needs exactly one
    thing the isogeny setting does not obviously supply: a KEY g on curves with
    (K1) g(sigma v) = rho(g(v)) for an order-reversing rho, (K2) g(cod psi_b o psi_a)
    = g(cod psi_a) + tau(lambda(psi_b)) for a LABEL lambda(psi_b) that does not
    depend on the middle curve v (so one sorted label list serves every v), and
    (K3) an alphabet of at least M values (otherwise the number of equal-key
    non-matches, M^2 / |alphabet|, exceeds M and the merge is not linear).

    THE CEILING (to be proved at Stage 0, conditional on strong approximation).
    Fix N >= 2 and let G_N be the groupoid of N-marked supersingular curves
    (E, P, Q), (P, Q) a basis of E[N], with morphisms the isogenies of degree
    prime to N transporting the marking. A key satisfying (K1)-(K3) with
    labels that are functions of the isogeny alone and values in an abelian
    group must be PATH INDEPENDENT (the same endpoint curve reached by two
    different paths must receive the same key, else true claws are missed).
    Path independence says the key is trivial on the HOLONOMY group
    H_N of G_N, the subgroup of GL_2(Z/N) generated by the matrices by which
    closed walks act on the marking; H_N is the image of the S-unit group
    O[1/S]^x of a maximal order O of B_{p,infinity} (S = the primes used in the
    lists) under O -> O/NO = M_2(Z/N). By strong approximation for the norm-one
    group of the definite quaternion algebra (Kneser, Eichler; recalled) H_N
    contains SL_2(Z/N) as soon as p is large against N. An abelian-valued key
    kills commutators, and SL_2(Z/N) is perfect for N coprime to 6, so the key
    factors through det, and det of the transport matrix is the DEGREE (Weil
    pairing, e_N(psi P, psi Q) = e_N(P, Q)^{deg psi}). THE ONLY ORDERED KEY IS
    THEREFORE THE DEGREE, whose alphabet has about X = p^{1/6} < M values, so
    (K3) fails. For N dividing 6 the abelianisations of SL_2(Z/2) (Z/2) and
    SL_2(Z/3) (Z/3) are carried by genuinely path-dependent holonomy, which is
    the obstruction in its sharpest form. For the deployed SQIsign primes
    p = c 2^e - 1 full 2^e-torsion is cheap to mark (so a cost argument alone
    would NOT close the lever there), and the closure rests on path independence
    alone.

    TWO EXPLANATIONS DISCRIMINATED. E-CLOSED: the holonomy census returns
    H_N containing SL_2(Z/N) for every panel cell with p > N^4, the abelian-
    quotient arithmetic gives alphabet at most the number of distinct degrees,
    and the Cayley positive control returns an abelian holonomy with a key of
    alphabet about N^2; the memory lever is closed in the ordered-merge class
    with a named obstruction and the forward guidance below. E-OPEN: some
    (p, N) cell with p > N^4 returns a holonomy whose abelianisation is larger
    than det, i.e. a path-independent abelian quotient beyond the degree; the
    alphabet is then bounded by the order of that quotient and the lever is
    reopened only if the quotient order can reach M = p^{1/3}, which needs
    N >= p^{1/9}.

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md; the search is over a
    (representation, operation set) pair, not a projection of the group).
    REPRESENTATION: an N-marked supersingular curve (E, P, Q) as an element of
    the level-N cover of the supersingular set (class R3, a non-function
    representation: the point is a curve with torsion data). OPERATION SET Sigma:
    transport of the marking along non-backtracking l-isogenies, l <= B, l
    prime to N, together with the Frobenius twist sigma. TRICHOTOMY
    (IDEA-20260806-c5d183): the unmarked graph is a branching object (a vertex
    has l+1 unlabelled neighbours); the marked groupoid is a partial-action
    object (a label, the matrix of psi in canonical bases, determines the child);
    a candidate key is coordinate-dependent unless it is path independent.
    LOSSY-PROJECTION TEST against Sigma, algebraic and zero-cost: the object
    tracked is g(v), an abelian-valued function of the marked vertex. It is
    genuinely lossy (it discards all but log|alphabet| bits of the vertex), and
    what it discards is discarded compatibly with Sigma if and only if
    g(psi_* v) is a function of g(v) and a label of psi. Writing g = omega o
    (relative position of the marking against a canonical basis of E) makes the
    test an equation in GL_2(Z/N): g is Sigma-compatible and path independent
    iff omega kills H_N. THE ONE OPEN NUMBER the classification leaves open is
    the order of the largest quotient of H_N on which an abelian omega is
    nontrivial and path independent; the record predicts it equals the number
    of values of the degree.
    NEARBY OBJECTS. WHERE THE MECHANISM IS KNOWN TO SUCCEED: (i) subset sum
    (the key is the partial sum); (ii) the F_p-rational spine of the supersingular
    graph, on which the commutative order Z[sqrt(-p)] acts, the holonomy of closed
    walks lies in the torus (Z[sqrt(-p)]/N)^x, which is ABELIAN, and the oriented
    self-pairing digest of IDEA-20260901-871141 (D) is a computable key; (iii) any
    Cayley graph of an abelian group. WHERE IT IS KNOWN TO FAIL: (iv) random
    (l+1)-regular graphs, which have no covering structure at all. A method that
    cannot see (ii) as admitting a key has not identified path independence as
    the load-bearing hypothesis.
    WHY THIS IS NOT THE KNOWN STATEMENT. IDEA-20260901-871141 names the digest
    requirement for the CSIDH torsor and finds the oriented self-pairing as the
    one cheap digest; this record asks the same question of the groupoid of
    OneEnd, where there is no torsor, states the closure as a holonomy-quotient
    theorem, and prices the memory consequence (p^{1/6} against vOW's p^{5/12}).
    IDEA-20260906-d95de0 uses cycle holonomy to certify non-scalarity of a found
    cycle map; here holonomy is the obstruction to a sorting key.
    KN-FIND-ffe1df proves a conditional closure of sum-compatible filters on
    E(F_p) (Wagner k-tree lane); this record is its analogue for the isogeny
    groupoid and is a different group, a different operation set and a different
    obstruction.
    OFF-LIMITS COMPONENTS DECLARED: the plain vOW collision search and the
    rebuild-and-shard scheme (IDEA-20260821-167fd9, IDEA-20260815-e94ea3) are the
    comparators, not the lens; the F_p-subfield descent lever is not used.

