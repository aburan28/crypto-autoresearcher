  heuristic_assumptions:
    - id: H1
      statement: >-
        (Holonomy surjectivity.) For N in {2, 3, 4, 5, 7} and every prime p > N^4
        the subgroup H_N of GL_2(Z/N) generated by the images of the elements of
        a maximal order O of B_{p,infinity} with norm in the group generated by
        the primes in S (S prime to N, nonempty) contains SL_2(Z/N).
      rigorous_support: >-
        Strong approximation for SL_1 of a definite quaternion algebra (Kneser,
        Eichler; recalled, not read), which gives density of the S-arithmetic
        group in the product of the local norm-one groups at places outside S and
        hence surjectivity onto SL_2(Z/N); it imitates the classical statement
        that a dense subgroup of SL_2(Z_N) surjects onto SL_2(Z/N) for every N.
        The statement for every p > N^4 (not only p large without effective
        bound) is the heuristic content.
      validation_plan: >-
        SAMPLE the five toy primes and the five N of the panel (25 cells,
        two choices of S); COMPARE |H_N| with |GL_2(Z/N)_S| and the index with
        1; TAIL: the smallest p at which the index is 1 for each N, reported
        beside the p > N^4 rule. TRANSFER: Stage 2 repeats the census at
        p = 5 * 2^248 - 1 (and p = 27 * 2^500 - 1 if the environment allows) by
        sampling smooth-norm lattice vectors of random maximal orders (the
        source's section 4.2 correspondence); the group-theoretic claim is
        uniform in p, so the transfer is by theory and the cryptographic-size row
        is a consistency check, not an extrapolation.
    - id: H2
      statement: >-
        (Degree is the only canonical key.) Every path-independent abelian-valued
        key on the N-marked groupoid with isogeny-determined labels factors
        through the degree, for N prime to 6; for N dividing 6 the further
        abelian quotients are carried by path-dependent holonomy.
      rigorous_support: >-
        Follows from H1 and the perfectness of SL_2(Z/N) for N prime to 6 together
        with the Weil pairing identity e_N(psi P, psi Q) = e_N(P, Q)^{deg psi};
        it imitates the group-theoretic fact that a homomorphism from a group
        with a perfect normal subgroup to an abelian group factors through the
        quotient. The path-dependence of the N = 2, 3 factors is read off the
        census (the two values of the sign appear among closed walks).
      validation_plan: >-
        SAMPLE the same 25 cells; for N = 2 and N = 3 record whether both
        values of the sign (respectively all three values of the Z/3 character)
        occur among the closed-walk images; TAIL: the fraction of closed walks
        with each value, reported against the uniform value 1/2 (1/3). A fraction
        far from uniform is reported as a candidate weak key, not as a result.
        TRANSFER: as in H1.
    - id: H3
      statement: >-
        (Alphabet versus cost.) For generic p the cost of marking a curve with a
        basis of E[N] grows at least linearly in N, so a key with alphabet at
        least M = p^{1/3} requires N at least p^{1/9} (non-abelian quotient
        bounded by N^3 for the SL_2 part) and time at least p^{1/3} times
        p^{1/9}; for p = c 2^e - 1 and N = 2^e the marking is cheap and the
        closure rests on H2 alone.
      rigorous_support: >-
        The order of GL_2(Z/N) is at most N^4 and of its abelianisation at most
        6 N; the cost of torsion points over an extension field of degree growing
        with N is the standard shape (recalled); the SQIsign-prime exception is
        an arithmetic fact about p + 1.
      validation_plan: >-
        Zero-compute arithmetic table of alphabet bound and marking cost for
        N in {2^k} up to the deployed e, labelled estimate; no sampling.

  heuristic_note: >-
    H1 carries the only external theorem and is recalled; H2 is a corollary with
    a measured path-dependence; H3 is arithmetic. The streaming memory claim
    (K1-K3 imply O(M^{1/2})) is the Schroeppel-Shamir argument on a fibred set
    and is a proof obligation, not a heuristic.

  target_complexity:
    time_exponent: >-
      IF an ordered key existed: p^{1/3+o(1)}, unchanged. The record claims no
      time movement and does not move toward 1/4. Under E-CLOSED the time at
      memory p^{1/6} remains the vOW value p^{5/12} (source line 39).
    memory_exponent: >-
