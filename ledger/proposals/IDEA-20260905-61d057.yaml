  assumptions:
  - Only self-generated public finite subsets are considered; affine scalar labels are visible fixture data.
  - Translations and allowed automorphisms are explicitly quotiented; no information-theoretic identification is
    equated with efficient computation.
  predictions:
  - metric: Number of non-equivalent fibers sharing a chosen pair or triple correlation certificate
    direction: different
    minimum_effect: At least one pair-correlation collision separates in third order, while translation collisions
      persist exactly.
  minimal_test:
    design: Use hand-described subsets of Z/13 and Z/17, including reflection pairs and independently generated
      equal-size subsets. Compare exact pair-correlation collisions with triple-correlation collisions on a predeclared
      small set of offsets. Stop before any instance solver is designed.
    proposal_only: true
    controls:
    - type: matched_null
      description: Uniform equal-size subsets, passed through identical correlation maps.
    - type: known_false
      description: A subset and its translate necessarily share every translation-invariant correlation; the certificate
        must never claim to separate them.
