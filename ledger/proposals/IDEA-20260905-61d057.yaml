idea:
  id: IDEA-20260905-61d057
  title: Phase retention in third-order fingerprints of relation fibers
  class: representation
  claim: 'For a bounded family of coordinate-defined subsets F of a cyclic group, a third-order correlation tensor
    may distinguish non-translate homometric fibers that have identical pair correlations. Conjecture: a compact
    tensor certificate separates the relevant fibers at size below the full truth table, with explicit exceptions
    when the Fourier support disconnects.'
  mechanism: The pair correlation records squared Fourier magnitudes and forgets phases. The triple correlation
    sum_x 1_F(x)1_F(x+a)1_F(x+b) couples three frequencies, so relative phases can survive. The mathematical question
    is whether a small set of tensor entries fixes the fiber up to declared translations and automorphisms, and
    whether those entries are obtainable from public coordinate structure without enumerating N states. A proof
    of identifiability is only an interface certificate; the sampling and representation costs remain independent
    obligations.
  question_id: RQ-ECDLP-002
  question_ids:
  - RQ-ECDLP-002
  goal_ids:
