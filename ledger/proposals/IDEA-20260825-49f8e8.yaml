  batch: EC-STRUCTURE-20260825
  cluster: 'C6-arity: what the rigidity closure leaves open'
  title: 'A WORKED LOSSY-PROJECTION AUDIT OF THE RIEMANN-ROCH SUBSPACE FAMILY AND FOUR NEIGHBOURS: translation
    carries Riemann-Roch spaces to Riemann-Roch spaces, so {L(D + kP)} propagates deterministically and
    looks like a tracked object -- it fails the test in two lines because the family is faithfully parameterized,
    and the deformations that do NOT fail are the deliverable'
  class: control
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: 'Riemann-Roch spaces and their behaviour under translation are classical and recalled.
    The proposed contribution is the audit: a worked demonstration that the protocol''s section 2 disposes
    of an entire natural object family at zero compute, together with the deformations that survive it.'
  claim:
    semantic_part: Translation by P is an automorphism of E as a variety, so it carries L(D) to L(translate
      of D) and the family {L(D + kP)} is a curve in a Grassmannian that propagates deterministically;
      but the family is faithfully parameterized by kP, so it discards nothing and is a change of coordinates
      rather than a new object.
    evaluator_part: 'Unestablished: whether any genuinely lossy deformation of the family still propagates
      deterministically. That is the open part and the reason the record is worth filing rather than merely
      noting the failure.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'State the family and its deterministic propagation, then apply the test: the map k -> L(D + kP) is
    injective, so nothing is discarded and section 2 rejects it without computation.'
  - 'Deform into genuinely lossy variants and test each: (i) the intersection pattern of L(D + kP) with
    a FIXED flag of subspaces; (ii) the rank profile of the evaluation matrix of L(D + kP) at a fixed
    finite point set; (iii) the Hilbert function of the ideal generated by the space; (iv) the dimension
    of the intersection with a fixed L(D'').'
  - For each deformation, decide whether propagation survives the loss -- the conjunction the test demands.
  - Report the audit as a five-row table, and treat any row that survives both criteria as the only candidate
    worth an experiment.
  lossy_projection_test:
    tracked_object: the family {L(D + kP)} and four lossy deformations of it
    what_is_discarded: nothing for the base family; per-row for the deformations
    propagation: deterministic for the base family; per-row for the deformations
    verdict: The base family FAILS, by injectivity, at zero compute. The record's value is that the failure
      is exhibited rather than assumed, and that the deformations are then screened by the same criterion.
  predictions:
  - id: P1
    status: established_formula
    statement: Translation carries Riemann-Roch spaces to Riemann-Roch spaces of the translated divisor,
      preserving dimension.
  - id: P2
    status: established_formula
    statement: k -> L(D + kP) is injective for deg D at least 1, so the base family discards nothing.
  - id: P3
    status: unestablished
    statement: At least one of the four deformations is both lossy and deterministically propagating.
  minimal_discriminating_test:
    status: specified_not_run
    test: Algebraic screening of all five rows with toy numerical verification of injectivity for the
      base family and of the propagation claim for each surviving deformation.
    pass: Every row decided, with an explicit reason.
    fail: A row that cannot be decided is recorded as undecided.
  controls:
  - A deliberately lossy but non-propagating object (a random hash of the space) which must fail on propagation,
    confirming the test's second criterion bites.
  - A deliberately propagating but non-lossy object (the base family itself) which must fail on lossiness,
    confirming the first criterion bites.
  - The protocol's own symmetric-side worked example, which must reproduce its known verdict.
  confounders:
  - Preserving dimension is not preserving the space; the distinction is where the injectivity argument
    lives.
  - Some deformations are lossy only for special D; the row must say for which.
  - A deformation can pass both criteria and still be simulable in the generic group model, which is a
    separate and later screen.
  falsification:
    semantic: A recovery formula showing a deformation is not lossy after all falsifies that row.
    evaluator: A numerical error scopes out that row.
    not_falsification: All five rows failing.
  why_this_is_not_a_variant: The ledger contains individual object proposals and individual rejections.
    This record is an AUDIT of one natural family with its neighbours, run to the protocol's own criterion,
    and is intended as a template for how object screening should be recorded rather than as a mechanism
    proposal.
