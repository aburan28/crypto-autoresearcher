idea:
  id: IDEA-20260816-938a96
  question_id: RQ-RSA-afe33c
  added: '2026-08-16'
  title: Build an exhaustive bounded-box detector for composite moduli of the shape N equal to r to
    the e plus or minus s with small s, report its coverage as an exact quantifier over the box, and
    measure its false-positive rate on random semiprimes of the same bit length
  class: tooling
  claim: '(A) THE COMPOSITE SIDE HAS AN EXACTLY DECIDABLE SUBQUESTION. For integer moduli rather than
    prime-field parameters, one natural special form is N = r^e + s with |s| bounded by S, which is
    the shape a sieve with a very simple polynomial would exploit. Unlike the prime-field case, membership
    in this class can be decided EXACTLY and CHEAPLY over a declared box: for each exponent e from
    2 to E, compute the integer e-th root r0 of N, and test whether |N - r^e| <= S for r in {r0 -
    delta, ..., r0 + delta}. That is at most E(2 delta + 1) integer power computations. (B) THE QUANTIFIER
    BECOMES EXACT. The output of this tool is not no known detector but a precise statement: N is
    not of the form r^e + s for any e <= E, any r within delta of the e-th root, and any |s| <= S.
    The complement of the box is named explicitly, so the assertion has a boundary rather than a horizon.
    This is the exact move RQ-SNFS-005666 asks for, executed in the one setting where it is cheap
    enough to be complete. (C) THE FALSE-POSITIVE RATE IS MEASURABLE AND SMALL BUT NOT ZERO. A random
    semiprime is occasionally within S of a perfect power by accident, and the rate is computable
    both empirically and by a counting estimate: the number of perfect powers below X is about sqrt(X)
    plus lower-order terms, so the expected count of random N within S of one is about (2S+1) times
    the perfect-power density. The tool therefore predicts its own false-positive rate and the experiment
    tests the prediction. (D) THE POSITIVE CONTROL IS FREE. Semiprimes of the target shape can be
    built by searching r and s until r^e + s factors as a product of two primes of the intended sizes,
    so a planted arm with recorded ground truth costs nothing beyond the search. (E) WHAT IS NOT CLAIMED.
    No factorization is attempted, no modulus is factored, no running-time advantage is asserted for
    any sieve, and above all no claim is made about any real, published or deployed modulus. The tool
    decides a shape question about integers this program generated. Whether any actual modulus has
    such a shape is outside the scope of this record and is forbidden by the question''s own constraints.'
  mechanism: 'STAGE ONE: implement an exact integer e-th root by Newton iteration on integers, validated
    against exhaustive checks for small inputs, so no floating point enters the decision. STAGE TWO:
    implement the box detector, looping e from 2 to E and r over a window of radius delta around the
    integer e-th root, recording every triple (e,r,s) with |s| <= S and its exact verification N =
    r^e + s. STAGE THREE: build the planted arm by choosing e, r and small s such that N = r^e + s
    is a semiprime with balanced factors, recording the construction. STAGE FOUR: build the null arm
    as random balanced semiprimes of identical bit length from the same primality routine. STAGE FIVE:
    run the detector identically on both arms and record hits, coverage parameters and per-N cost.
    STAGE SIX: compare the measured false-positive rate against the counting estimate derived at STAGE
    ZERO. STAGE SEVEN: sweep S and delta to map how the false-positive rate grows as the box is enlarged,
    which is the quantitative statement of the tradeoff between coverage and noise. The claim is established
    if the detector catches every planted instance by construction, if the null false-positive rate
    matches the counting estimate, and if the sweep produces a usable coverage-versus-noise curve.
    It is refuted if the null rate greatly exceeds the estimate, meaning random semiprimes are far
    more often near perfect powers than counting predicts, which would itself be the interesting outcome.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read in full: RQ-RSA-afe33c, which owns integer factorization cost and explicitly names
      special NFS as a control on its cost model, and RQ-SNFS-005666 and GOAL-SNFS-001, which assign
      SNFS as an object to the SNFS goal. Greps: grep -ril -E ''semiprime|r\^e'' ledger/proposals/,
      which returned nothing; grep -ril -E ''trapdoor|SNFS|special number field'' ledger/proposals/;
      grep -ril -E ''special.form|SNFS'' ledger/hypotheses/, empty; grep -ril -E ''detectab'' ledger/proposals/
      ledger/hypotheses/.'
    results: The semiprime grep returned zero files, so no proposal in this repository concerns composite
      moduli of a declared special shape at all. RQ-RSA-afe33c is the correct home question because
      it owns integer moduli and explicitly names special NFS as a control on its GNFS cost model,
      while GOAL-SNFS-001 owns SNFS as an object and states that any claim about whether structure
      is DETECTABLE from public data belongs with the detectability work; this record sits at that
      seam and is filed under the integer-modulus question deliberately. The cost-model records IDEA-20260808-0cdd09
      and IDEA-20260805-1775f2 under the same question compute attack costs and contain no shape test.
    verdict: 'UNVERIFIED. No claim about external literature is made. Claimed new relative to this
      repository: the packaging of a bounded-box shape test as a coverage-quantified decision tool
      with a predicted false-positive rate and a measured coverage-versus-noise curve, in a repository
      that currently contains no shape test for composite moduli of any kind. Assembled from known
      parts: integer root extraction, the density of perfect powers, and the observation that a very
      simple polynomial corresponds to a very special modulus shape are all elementary; the contribution
      is the exact quantifier and the measured curve, not the arithmetic.'
  object_first_candidate:
    tracked_object: The residual vector, for a modulus N, of the distances s(e) = N - r0(e)^e from
      N to the nearest perfect e-th power, indexed by exponent e from 2 to E, together with its minimum
      absolute value over e. The object followed is that residual profile, not N and not any factor
      of N.
    lossiness: 'Genuinely lossy. From the residual profile one cannot reconstruct N, since only E
      small integers are retained from an n-bit modulus and the base r0 is discarded, so the fibres
      are astronomically large. What survives propagates because the operation that matters, enlarging
      the shape class by raising S or E, acts on the residual profile directly through a threshold
      comparison and needs nothing that was discarded. The one honest caveat: the profile is blind
      to any structure not expressible as nearness to a perfect power, so a modulus special in some
      other sense projects to a perfectly ordinary profile, and that blindness is the exact boundary
      the coverage statement names.'
    propagation: One step of the target operation is E maps to E+1, adding one exponent to the box.
      That adds one residual coordinate whose null distribution is approximately uniform over an interval
      of width about N^(1/(E+1)) times a constant, so the added false-positive probability per modulus
      is about (2S+1) divided by that width, which shrinks rapidly with E. The complementary step,
      S maps to 2S, doubles every coordinate's acceptance interval and therefore roughly doubles the
      false-positive rate while adding coverage linearly. Those two closed-form rates are the propagation
      law and the sweep measures them.
    survival_score: The exact-decision property survives as long as the box is enumerable, which at
      delta of order 1 and E of order 100 is trivially true at every modulus size including cryptographic
      ones, since the cost is a few hundred integer powers. The property dissolves the moment the
      shape class is widened beyond a bounded box, for instance to N = a r^e + s with a unbounded,
      where enumeration is no longer finite. The concrete statement is that this instrument is complete
      and cheap on a box of size E(2 delta + 1) and says nothing at all outside it, and the boundary
      is where the coverage claim must stop.
  null_object_control: 'Random balanced semiprimes of the identical bit length, generated by the identical
    primality routine and scored by the identical detector in the same invocation, together with the
    counting prediction for the accidental hit rate. The null must show two things: that hits occur
    at approximately the predicted rate (2S+1) times the local density of perfect powers summed over
    e, so that the tool''s own error model is validated; and that every null hit, when inspected,
    is a genuine accidental nearness rather than a bug in the root extraction. If the null hit rate
    greatly exceeds prediction, the tool''s coverage statement is intact but its usefulness collapses,
    and that is reported as measured.'
  discriminated_from:
  - 'IDEA-20260808-0cdd09 and IDEA-20260805-1775f2 under RQ-RSA-afe33c: those compute NFS cost models
    and exponents. This computes no cost model and factors nothing; it decides a shape membership
    question exactly.'
  - 'The prime-field detectors in this batch, both lattice and digit based: those operate on a prime
    p and a polynomial witness of degree d with a base m of size about p^(1/d), which requires an
    unaffordable sweep. This operates on a composite N with a single base per exponent obtained by
    root extraction, so no sweep is needed and the decision is complete rather than sampled.'
  - 'RQ-RSA-d46f02 structured-prime work: there structure is supplied to the campaign as leakage and
    used to recover a factorization. Here structure is the thing being tested for, from the public
    modulus alone, and nothing is recovered.'
  - 'Generic primality or perfect-power testing utilities: a perfect-power test decides s = 0 only;
    the object here is the residual profile with a tolerance S and an explicit coverage box, which
    is a strictly different and quantified statement.'
  assumptions:
  - Integer e-th root extraction by Newton iteration is exact at the sizes used, which is validated
    by exhaustive small-case checks and by re-verification of every hit through exact exponentiation.
  - The counting estimate for accidental hits, based on the density of perfect powers, is adequate
    at the tested sizes; the measurement tests it rather than relying on it.
  - Balanced random semiprimes are the right null for the planted arm, so that any hit-rate difference
    is about shape and not about factor-size distribution.
  - A box with delta small is sufficient because the true base of a genuine instance is within delta
    of the integer root whenever |s| <= S, which follows from an elementary bound that is derived
    and recorded, not assumed.
  predictions:
  - metric: true-positive rate on planted N of the declared shape inside the box
    direction: higher
    minimum_effect: exactly 1.0, since detection is by exact verification and a miss indicates an
      implementation error
  - metric: false-positive rate on random balanced semiprimes at n = 128, E = 64, S = 2^20, delta
      = 2
    direction: lower
    minimum_effect: 0.01
  - metric: ratio of measured to counting-predicted false-positive rate
    direction: different
    minimum_effect: within a factor of 3 of 1
  - metric: growth of false-positive rate as S doubles
    direction: higher
    minimum_effect: approximately linear in S, with the measured slope reported; no exact constant
      pre-committed because the local perfect-power density varies across the tested range
  minimal_test:
    design: 'One script, two arms, one box. Generate 500 planted composites at n = 128 by choosing
      e in {2,...,8}, r as the integer nearest 2^(128/e), and s ranging over small values until N
      = r^e + s is a balanced semiprime, recording (e,r,s) as ground truth. Generate 500 random balanced
      128-bit semiprimes from the same primality routine. Run the box detector with E = 64, delta
      = 2 and S = 2^20 on both arms, re-verifying every hit by exact exponentiation. The discrimination
      needs no statistics: the planted arm must return a hit on every instance, since the instance
      is in the box by construction, and the null hit count is a direct measurement of the false-positive
      rate against which the counting estimate is checked. Cost is 1000 moduli times 64 exponents
      times 5 bases, about 320000 exact integer powers of 128-bit numbers, seconds in pure Python.'
    controls:
    - The random balanced semiprime null arm in the same invocation.
    - Exact re-verification of every hit by recomputing r^e and comparing to N, so no hit is reported
      on the strength of the root extraction alone.
    - A shifted-box control in which delta is set to zero, which must catch a strict subset of the
      hits and quantifies how much the radius contributes.
    - A shape-mismatch control planting N = a r^e + s with a > 1, which must be missed by the box
      detector, confirming the coverage boundary is real.
    - A size sweep at n in {64, 128, 256} to check that the false-positive rate follows the perfect-power
      density rather than a size artifact.
    required_metrics:
    - true-positive rate on the planted arm
    - false-positive rate on the null arm
    - counting-predicted false-positive rate and the measured-to-predicted ratio
    - hit multiplicity per modulus, that is how many (e,r,s) triples fire
    - coverage parameters E, delta, S with the resulting box cardinality
    - per-modulus wall-clock cost and integer-power count
  falsification_conditions:
  - Any planted instance inside the box is missed, indicating an implementation error in root extraction
    or the residual test.
  - The measured false-positive rate exceeds the counting prediction by more than a factor of three,
    meaning the tool's error model is wrong.
  - The shape-mismatch control is detected, meaning the coverage boundary is not where the derivation
    puts it.
  - Hits survive exact re-verification at a rate below one, meaning the root extraction is producing
    spurious candidates.
  - The false-positive rate does not scale with S as the counting model predicts across the sweep,
    invalidating the coverage-versus-noise curve.
  confounders:
  - Balanced semiprimes are not uniform integers, so the perfect-power counting estimate needs a correction
    for the restriction to semiprimes, and neglecting it would bias the predicted rate.
  - Planted instances are constructed by searching s until N is semiprime, which biases the s distribution
    toward values that make N factor conveniently.
  - Small exponents dominate the hit rate because low perfect powers are dense, so an aggregate rate
    hides very different per-e behaviour.
  - Integer root extraction near an exact power is where off-by-one errors live, and those are exactly
    the cases the detector cares about.
  - Bit-length pinning to exactly n interacts with the choice of r and can concentrate planted instances
    at particular exponents.
  interpretation_limits:
  - A negative result is a statement about the box only, in the exact form N is not r^e + s for e
    <= E, r within delta, |s| <= S, and it may not be paraphrased as N has no special structure.
  - Nothing here applies to any real, published or deployed modulus, and the question's constraints
    forbid writing such a statement.
  - The detector is blind to every special shape not expressible as nearness to a perfect power, which
    is most of them.
  - No factoring, no cost model and no security consequence follows from any hit or miss.
  target_complexity:
    time_exponent: No attack exponent is claimed. Detector cost is E(2 delta + 1) exact integer powers
      and root extractions per modulus, which is O(E delta) big-integer operations, independent of
      modulus size except through the cost of arithmetic, so the detection cost is polynomial and
      in practice a few hundred operations at any size.
    memory_exponent: No attack memory exponent is claimed. The detector holds one modulus and a handful
      of intermediates, so memory is O(log N) bits with no accumulation, kilobytes at every tested
      size.
    best_known: 'The incumbent within this repository is nothing at all: the semiprime and shape greps
      returned zero records, so this program holds no shape test for composite moduli. RQ-RSA-afe33c
      names special NFS only as a control on a cost model. No external baseline is asserted from this
      environment.'
    hidden_overhead: 'The coverage box is the entire hidden cost, and it is hidden in plain sight:
      a negative result over a small box is a very weak statement and reads much stronger than it
      is, which is why the coverage parameters must be reported in the same sentence as the verdict.
      There is also a correction for the semiprime restriction in the counting model that is easy
      to omit and would silently bias the predicted false-positive rate.'
  dominated_by: n/a for attack claims, none is made. As a decision tool, I checked the repository
    for competing shape tests and the semiprime grep returned zero files, so the frontier is empty
    by direct check rather than assumption. Against factoring N outright, this tool is dominated on
    informativeness at any size where factoring is affordable and dominates overwhelmingly on cost
    at every other size, which is the honest two-row frontier and is stated rather than hidden. On
    memory the two are not comparable since one terminates and the other does not.
  sota_delta: No attack; tooling and quantifier contribution only. Quantitatively the delta is from
    no shape test at all to an exact decision over a box of cardinality E(2 delta + 1), costing a
    few hundred big-integer operations per modulus, with a predicted and measured false-positive rate
    and a measured coverage-versus-noise curve as S and E grow. Nothing is faster, and no attack figure
    changes.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that the detector catches every planted instance inside the box:
    about 0.97, since detection is by exact verification and only an implementation error can defeat
    it. Part C, that the measured false-positive rate matches the counting prediction within a factor
    of three: about 0.55, with most of the risk in the semiprime-restriction correction rather than
    in the perfect-power density itself. That the coverage-versus-noise curve is smooth and usable
    across the S and E sweep: about 0.7. That this tool is ever useful for anything beyond stating
    an exact negative over a small box: about 0.2, and the modest value is the honest reason its recommended
    priority is medium rather than high.'
