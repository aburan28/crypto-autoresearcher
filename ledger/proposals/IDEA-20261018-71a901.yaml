idea:
  id: IDEA-20261018-71a901
  question_id: RQ-RELN-61638a
  added: '2026-10-18'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Is the count vector white along the x-line? A complete-basis periodogram test of
    c_D with a Parseval-exact null, a CM-symmetry deficit control and the lift ceiling
    it implies
  class: measurement
  claim: >-
    Prime-order E/F_p, m=3, B=ceil((6N)^(1/3)), x-interval / QR-class / small-height
    bases, N=2^14..2^22. F(x)=c_D(R) on the n=(N-1)/2 on-curve x-classes, g=F-mean,
    I_s=|sum_x g(x)e(sx/p)|^2/sum g^2. (i) mean_s I_s=1 exactly (Parseval; s=0 is the
    KN-FIND-007 conservation). (ii) Under the exchangeable null the (p-1)/2 distinct
    I_s are Exp(1): P(max I_s > ln((p-1)/2)+ln 100) <= 0.01; likewise for the F_p^*
    multiplicative periodogram and the y-sign odd part. (iii) Dyadic band means W_j
    have mean 1, variance 1/#band. (iv) Any sign-of-sinusoid predicate has lift
    rho-1 <= ~1.8 sqrt(I*Delta/(mu*N)) = 0.007 at N=2^20 (I=18, Delta=1, mu=1.04),
    decaying N^(-1/2). ALTERNATIVE: a peak or band excess at z>4 on 3 curves and 2
    rungs, giving s*(N), a candidate invariant to prove or refute.
  mechanism: >-
    Pair (R1 affine x of the target, Sigma = generate-and-filter on coordinates);
    coordinate-dependent. Object: the autocorrelation spectrum of c_D along the x-line.
    Lossy-projection test: n values become (p-1)/2 moduli, phases and target identity
    dropped; invariant under x -> x+t, a symmetry of the null (exchangeable x-classes)
    and not of E, so nothing is claimed under translation. Complete: the p characters
    span every function of x, so no character-linear predicate escapes, unlike the
    10-predicate grammar of c5c614 or a trained GNN, and there is no training, split
    or gate set to mis-calibrate. The multiplicative arm reads the F_p^* index of x
    (a log in F_p^*, never in E), whitelisted in the leak audit. No factor base is
    proposed (KN-OPEN-020: none). Second order only.
  novelty_status: unverified
