      verified_by: null
  assumptions:
    - Counts from the sibling exhaustive enumerator, convention frozen first.
    - CM control needs a prime-order j=0 curve (p = 1 mod 3) and a base closed under x -> w x.
  predictions:
    - metric: max_s I_s per cell (3 curves x 3 bases x 4 rungs x 3 arms)
      direction: lower
      minimum_effect: below the 1% Fisher threshold; exceedances Binomial, Holm-corrected
    - metric: Z/N interval peak (BLOCKING positive control)
      direction: higher
      minimum_effect: max I >= 100 x threshold, else no negative is reportable
    - metric: CM control, fraction of chi with chi(w) != 1 having I < 1e-9
      direction: higher
      minimum_effect: 100 percent (exact algebra); the other third Exp(1)
    - metric: planted-thinning depth eps_min at power 0.9
      direction: lower
      minimum_effect: 4 sqrt(Delta t/(n mu)) = 0.15, 0.083, 0.023 at N=2^14, 2^16, 2^20
  minimal_test:
    design: >-
      Fixtures: Parseval to 1e-9; 200 x-permutations per cell give exceedance rate
      0.2 to 3 percent. Run 2^14 and 2^16 first (seconds), then 2^18..2^22. Report
      signed z, never a max(diff,SD) floor fit.
    controls:
      - Z/N interval and Bose-Chowla B_3 on the same code path
      - CM omega-closed base on a j=0 prime-order curve
      - x-permutation null and matched random base on the same curve
      - planted sinusoidal thinning sweep
    required_metrics: [max I_s, W_j z-scores, Parseval residual, exceedance rate, eps_min]
  falsification_conditions:
    - Parseval residual above 1e-9, or permutation exceedance outside 0.2 to 3 percent, voids H1.
    - Z/N peak below threshold voids every negative.
    - Alive branch needs z>4 replicated; otherwise the character-linear class is closed at the stated eps_min.
  confounders:
    - Poisson non-Gaussianity at 2^14; harmonic leakage of thresholded predicates; curve occupancy (g centred on-curve only).
  interpretation_limits:
    - Toy scale, tested bases only. Not a kappa measurement (see IDEA-20261017-077f12). No ECDLP claim.
  heuristic_assumptions:
    - id: H1
      statement: For s != 0 the Phi_s are asymptotically independent complex Gaussians with E|Phi_s|^2 = sum g^2.
      rigorous_support: Parseval (exact) plus near-independence of counts; imitates Fisher's white-noise periodogram law.
      validation_plan: 200 x-permutations and 50 matched random bases per cell; ECDF of max I vs 1-(1-e^-t)^((p-1)/2); top-3 order statistics vs Renyi spacings; no extrapolation past 2^22.
  target_complexity:
    time_exponent: no ECDLP algorithm; analysis O(p log p) plus sibling O(B^3 + N) enumeration, toy only
    memory_exponent: O(p) toy; a deployed predicate costs one character evaluation plus one point addition
    best_known: p^(1/2) Pollard rho, O(1) memory
    hidden_overhead: >-
      One sinusoid has rho <= 2 (nonnegative counts bound modulation depth), so
      delta=0, sub-break-even. rho=N^delta would move the m=3 ledger 1/2 to (1-delta)/2
      (c5c614 ledger) or 2/3 to (2/3)(1-delta) (772cff ledger; beats rho iff delta>1/4).
      kappa >= 1.27cU of IDEA-20261017-bbc53e is a separate channel.
    tradeoff_note: not applicable
  dominated_by: n/a (no result claimed)
