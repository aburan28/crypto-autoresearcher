  lossy_projection_identifiability_audit:
    projection: >-
      e in F_q^n, of weight w  -->  pi(e) = (wt(e_1), ..., wt(e_d)) in Z^d.
    what_is_discarded: >-
      The positions of the errors within each block and all q-1 possible nonzero
      values at each position. The fibre over a fixed profile (w_1,...,w_d) has
      size prod_j C(n/d, w_j) (q-1)^{w_j}; at the illustrative n=256, w=80, d=2
      the balanced fibre has size C(128,40)^2 * 255^80, which is about 2^{823}
      elements. The projection discards essentially the entire instance.
    why_genuinely_lossy: >-
      Overwhelmingly lossy, and NOT recoverable: e cannot be reconstructed from
      pi(e) by any means, since the fibre is astronomically large. This is the
      opposite pole from the canonical failure of the lossy-projection test.
    why_compatible_with_the_operations: >-
      The one operation ISD performs on the error -- "does supp(e) meet the
      chosen information set I" -- is, once I's per-block column counts
      (k_1,...,k_d) are fixed, a function of the profile alone in the sense that
      its PROBABILITY factorizes as prod_j C(n/d - k_j, w_j) / C(n/d, w_j).
      The retained part therefore propagates deterministically through exactly
      the step whose cost is being bounded. It does NOT propagate through a
      representation-technique split, and Step 7 of the mechanism says so.
    is_it_only_a_change_of_coordinates: >-
      CHECKED FOR, AND IT IS NOT. The canonical failure named in
      docs/inventor-protocol.md section 2 is (Delta, Pi) = (x xor y, x*y) in
      characteristic 2, where the unordered pair is recoverable as the roots of
      t^2 + Delta t + Pi, so nothing is discarded and nothing is gained. Here
      the map is many-to-one with fibres of size ~2^{823} at the illustrative
      parameters; it is a genuine quotient, not a reparametrization.
    mirror_failure_checked: >-
      CHECKED, AND THIS IS THE REAL RISK FOR THIS OBJECT. The mirror failure --
      a projection so lossy that its value is CONSTANT across instances, giving
      zero comparator spread -- is exactly what a block-weight profile does
      under the d-split promise: on d-split instances pi(e) is IDENTICALLY
      (w/d,...,w/d), a constant. If the proposal tried to use pi(e) as a
      distinguishing statistic it would be measuring a constant of the
      apparatus. It does not. The object here is used as the domain over which a
      COUNTING measure is compared between two instance families, and the
      comparator spread is the spread of R and G as (n,k,w,d) vary -- which is
      demonstrated non-zero by construction in Step 6 (0.433 bits at d=2 against
      76.011 bits at d=w on the same code path).

  assumptions:
    - >-
      That SDitH's split is a per-block EXACT weight constraint on a partition
      into equal blocks. RECALLED-UNVERIFIED. If it is at-most-w/d, or a
      published weight vector, or a partition into unequal blocks, the counting
      changes and Stage 0 of the paired experiment re-derives it. The bound of
      Step 2 survives any of these variants because Vandermonde does.
    - >-
      That d | n, d | k and d | w, so that a balanced information set exists.
      Where the specification's parameters do not divide, the floor/ceiling
      allocation must be optimized over instead of assumed, and the exact
      computation handles that without any change to the argument.
    - >-
      That the comparison of interest is at MATCHED (n, k, w, q) between the two
      problems. If SDitH chose its (n,k,w) to compensate for the split, the
      matched comparison is still the right one for the hardness question but
      the deployed-security question additionally needs the specification's own
      parameters, which Stage 0 supplies.

  predictions:
    - metric: >-
        log2 G at d = 1 (the degenerate split), computed by the exact integer
        code path, at every parameter set tested
      direction: different
      minimum_effect: >-
        EXACTLY 0.000000, bit for bit, because T_plain and T_split are the same
        expression when d = 1. This is a forced value with zero tolerance and it
        is the primary correctness gate on the implementation. Any nonzero
        output here invalidates every other number the run produces.
    - metric: >-
        log2 G at the illustrative n=256, k=128, w=80, d=2, exact integer
        computation
      direction: different
      minimum_effect: >-
        0.433 bits, within 0.001 of the value derived in this record before any
        run. The closed form must independently return 0.434 within 0.002. A
        disagreement between the two at this cell means the local-CLT derivation
        of Step 4 is wrong and must be withdrawn.
    - metric: >-
        log2 G at SDitH's ACTUAL parameter sets, once Stage 0 supplies them,
        assuming d is small (2 or 3)
      direction: lower
      minimum_effect: >-
        BELOW 3.0 bits at every parameter set. This is the pre-registered
        headline prediction. It is stated as a threshold rather than a point
        because the real (n,k,w) are unknown. If the measured value EXCEEDS 10
        bits at any parameter set, the prediction is falsified, the d-split
        structure is a measurable security loss at Prange level, and
        GOAL-SDITH-001 has its first substantive result in the other direction.
    - metric: >-
        -log2 R at SDitH's actual parameters versus the unconditional bound
        (d-1) log2(w+d-1)
      direction: lower
      minimum_effect: >-
        The bound must hold with strict inequality at every cell, and the ratio
        (-log2 R) / ((d-1) log2(w+d-1)) is predicted to lie in [0.4, 0.7] based
        on the three illustrative cells computed here (0.508, 0.526, 0.543 at
        d=2,4,8 for n=256, w=80). A violation of the bound is an implementation
        error, not a discovery.
    - metric: >-
        log2 G at the d = w, block-size-2 positive control with w = 80
      direction: higher
      minimum_effect: >-
        76.011 bits, within 0.01, matching the independently derived closed form
        w - (1/2) log2(pi w) = 76.013. If the instrument returns anything under
        60 bits here it cannot detect a split advantage at all and NO negative
        conclusion about SDitH's d may be drawn from it.

  minimal_test:
    design: >-
      Pen and paper plus exact integer arithmetic in the standard library. Four
      stages, cheapest first, and stage 1 alone can settle the headline.
      STAGE 0 (reading, no compute): obtain an SDitH specification, transcribe
      (q, n, k, w, d) and the exact split constraint with a page reference, and
      record the fetch provenance. If it cannot be obtained, record that as
      infrastructure signal and proceed with the ILLUSTRATIVE grid only -- the
      derivation and all controls remain executable and the deliverable degrades
      from "SDitH's number" to "the closed form plus its validated range".
      STAGE 1 (seconds): evaluate R and G exactly at the real parameters if
      available and at the illustrative grid regardless; check both against the
      closed form and against the Vandermonde bound.
      STAGE 2 (seconds): the graded d-sweep and the two forced-value controls.
      STAGE 3 (optional, minutes): a brute-force verification at tiny sizes
      (n <= 24) that the counting is right -- enumerate all weight-w vectors,
      count the balanced ones, compare with C(n/d,w/d)^d, and separately
      simulate Prange on both instance families and compare the measured
      iteration counts with T_plain and T_split.
    controls:
      - >-
        NULL OBJECT (d = 1). The same code path with the split degenerate. The
        forced value is log2 G = 0 EXACTLY, derived before the run, and it CAN
        FAIL: an implementation that mis-indexes blocks, or that optimizes the
        information-set allocation with an off-by-one, returns something other
        than zero here. This is a null of the same shape, not a decoration.
      - >-
        SECOND NULL (unconstrained blocks). Partition the coordinates into d
        blocks but do NOT impose the per-block weight constraint -- a "split"
        that splits nothing. Forced value: G = 1 exactly, because T_split is then
        computed against the same instance distribution as T_plain. This
        separates "the partition exists" from "the partition constrains", which
        is the whole content of the question.
      - >-
        POSITIVE CONTROL (d = w, block size 2, n = 2w, k = w). The effect MUST
        appear: log2 G = 76.011 bits at w = 80, independently predicted by
        w - (1/2) log2(pi w) = 76.013. If it does not appear the instrument is
        broken and no negative result about SDitH's d may be reported at all.
      - >-
        GRADED CONTROL, 8 INTERIOR POINTS, MONOTONICITY REPORTED. At n=320,
        k=160, w=80 sweep d in {1,2,4,5,8,10,16,20,40,80} and report log2 G at
        each. Pre-registered values, derived here: 0.000, 0.291, 0.868, 1.155,
        2.008, 2.570, 4.228, 5.308, 10.421, 19.317. The sequence must be
        strictly increasing in d. A non-monotone point localizes an
        implementation fault to a specific block size instead of leaving "it did
        not work"; a monotone sequence that misses the pre-registered values by
        more than 0.01 bits falsifies the exact derivation rather than the code.
      - >-
        CLOSED-FORM-VERSUS-EXACT DIVERGENCE PROFILE. Report the difference
        between the closed form and the exact value at every graded point. The
        pre-registered pattern is agreement under 0.01 bits while w/d >= 16 and
        growth to about 3.6 bits at w/d = 1. A closed form that agrees
        EVERYWHERE would mean the local-CLT step was not doing any work and the
        two expressions are algebraically identical, which they are not.
    required_metrics:
      - exact log2 R and log2 G per cell, as rationals converted once at the end
      - the Vandermonde bound per cell and the ratio to it
      - closed-form value and its signed deviation from exact, per cell
      - the graded d-sweep with an explicit monotonicity verdict
      - the two null values and the positive-control value against their forced targets
      - provenance record for the parameter source, including a failed-fetch record if that is what happened

  falsification_conditions:
    - >-
      log2 G at d = 1 is not exactly 0. Everything else in the run is void.
    - >-
      The graded sweep is non-monotone in d, or misses a pre-registered value by
      more than 0.01 bits. The exact derivation of Step 3 is wrong.
    - >-
      The Vandermonde bound of Step 2 is violated at any cell. Step 2 is a
      theorem, so this is an implementation failure and must be reported as one.
    - >-
      The positive control at d = w returns under 60 bits. No negative may be
      reported from this instrument.
    - >-
      log2 G at SDitH's real parameters exceeds 10 bits. The headline prediction
      is falsified and the d-split structure costs measurable security at Prange
      level. This is the outcome that would make the goal interesting and it is
      pre-registered here so that it cannot be reinterpreted after the fact.
    - >-
      Stage 0 reveals the split constraint is not per-block exact weight. The
      derivation as written does not apply and must be redone; the Vandermonde
      bound survives but the closed form may not.

  confounders:
    - >-
      PRANGE IS NOT THE BEST ATTACK. G bounds the split advantage for
      block-factorizing ISD only. A small G says nothing directly about
      representation-technique ISD, and the record must not be cited as though
      it did. This is the single largest confounder and it is why
      IDEA-20260805-43d6df exists.
    - >-
      MATCHED-PARAMETER AMBIGUITY. Comparing d-split SD at (n,k,w) with plain SD
      at the same (n,k,w) is one of several defensible matchings; another is to
      match the number of admissible errors, which would move plain SD's w. Both
      are computed and reported; picking one silently would be the error.
    - >-
      DIVISIBILITY. Illustrative grids were chosen so d divides gcd(n,k,w).
      SDitH's real parameters may not divide, and an unbalanced-allocation
      optimum is slightly better for the attacker than the balanced one. The
      exact computation must optimize over allocations rather than assume
      balance whenever divisibility fails.
    - >-
      AUTHORSHIP ASYMMETRY. A derivation that concludes "the scheme is fine" is
      cheap to produce and reads as rigour. The positive control at d = w and
      the pre-registered falsifier at 10 bits exist precisely so that the
      comfortable conclusion costs something to reach.

  interpretation_limits:
    - >-
      CLAIM TIER: this proposal supports a DERIVATION about a counting quantity
      and a Prange-level cost ratio. It is not a decoding attempt, produces no
      certificate, and makes no crypto-scale claim about SDitH. Under
      docs/claims-and-verification.md the evaluation is exact at deployed sizes,
      which removes the toy-to-crypto extrapolation problem for the DERIVED
      quantity only -- it does not license any statement about SDitH's actual
      security level, which depends on the best attack and not on Prange.
    - >-
      A small G is EVIDENCE FOR the inherited-hardness claim at Prange level and
      is NOT a proof that d-split SD is as hard as plain SD. The correct summary
      sentence is: "at the tested parameters, no block-factorizing ISD can gain
      more than G from the split, and G is under one bit."
    - >-
      Nothing here bears on the MPCitH transform, on the forgery cost, or on the
      soundness of the proof system. Those are IDEA-20260805-bf6448.
    - >-
      FORWARD GUIDANCE, MANDATORY EVEN IF THE PREDICTION HOLDS. What remains
      open after a confirming run: (a) the representation-technique gain from a
      block promise, which is not bounded by G and is not computed anywhere in
      this program; (b) whether an algebraic model exploiting the per-block
      structure beats ISD at SDitH's specific w/d, which is the RSD question of
      IDEA-20260805-7504c6; (c) the charged baseline, which is a different
      question from the split question and is IDEA-20260805-43d6df.

  heuristic_assumptions:
    - id: HEUR-SDITH-CBD-1
      statement: >-
        NOT LOAD-BEARING FOR THE HEADLINE. The bound of Step 2 and the exact
        values of Steps 3 and 5 are theorems and exact integer computations
        respectively; no heuristic enters them. This entry exists to record that
        the proposal's primary claim is UNCONDITIONAL, which is unusual in this
        corpus and should be stated rather than assumed.
      rigorous_support: >-
        Vandermonde's identity and the log-concavity of j -> C(N, j); both
        elementary and both re-derivable in one line.
      validation_plan: >-
        Brute-force enumeration at n <= 24 confirming the counts, plus the
        d = 1 forced-value gate.
    - id: HEUR-SDITH-CBD-2
      statement: >-
        LOCAL CLT. For fixed d and w -> infinity with w/n bounded away from 0
        and 1, the multivariate hypergeometric block-weight profile satisfies a
        local central limit theorem, so R(N,w,d) = (2 pi)^{-(d-1)/2}
        (det Sigma_{d-1})^{-1/2} (1 + o(1)) with Sigma the profile covariance.
        This heuristic supports ONLY the closed form of Step 4, never the exact
        values.
      rigorous_support: >-
        Local limit theorems for the multivariate hypergeometric are classical
        in the regime stated; the specific error term is not derived here and is
        not needed, because the closed form is checked against exact integers at
        every cell rather than relied upon.
      validation_plan: >-
        The graded control IS this heuristic's test: the pre-registered
        divergence profile (agreement under 0.01 bits while w/d >= 16, growing
        to about 3.6 bits at w/d = 1) is a falsifiable prediction about where
        the heuristic fails, and it fails in the direction the theory predicts
        or the heuristic is refuted.
    - id: HEUR-SDITH-CBD-3
      statement: >-
        BLOCK-FACTORIZATION. For the ISD algorithms in scope, the per-iteration
        success probability conditioned on the block-weight profile factorizes
        as a product of block-local terms. This is what makes G an upper bound
        on the split advantage for those algorithms.
      rigorous_support: >-
        Immediate for Prange and Lee-Brickell by conditional independence of
        per-block avoidance. NOT ESTABLISHED for Stern/Dumer with a window that
        straddles blocks, and FALSE-OR-UNKNOWN for MMT/BJMM/May-Ozerov, whose
        intermediate representations are not block-local.
      validation_plan: >-
        Stage 3's brute-force Prange simulation validates the factorization for
        Prange directly. For Dumer the paired hypothesis states the
        window-alignment condition explicitly and does not assert the bound
        outside it. THIS IS THE WEAKEST LINK IN THE PROPOSAL AND IS RECORDED AS
        SUCH.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED, AND THE PROPOSAL SAYS SO PLAINLY. The deliverable is
      a bound showing that a candidate exponent movement DOES NOT EXIST at
      Prange level: the d-split promise changes the ISD iteration exponent by
      log2 G bits, which is under one bit at d = 2 and O(d log w) in the worst
      case, hence o(n). Stating this quantitatively is the point; the house bias
      toward exponent-first work (docs/target-result-profile.md) is served here
      by ESTABLISHING that an exponent claim in this direction is unavailable,
      cheaply, before anyone spends a batch looking for one.
    memory_exponent: >-
      n/a. Prange's memory is the working matrix, O(n(n-k)) field elements,
      polynomial, and identical on both instance families. The split changes no
      memory exponent. Memory is the subject of IDEA-20260805-43d6df.
    best_known: >-
      Plain-SD ISD at the same (n,k,w). Concretely the best known is a
      representation-technique variant whose exponent this proposal does not
      compute and does not claim to bound; at Prange level the baseline is
      C(n,w)/C(n-k,w) iterations, computed exactly here.
    hidden_overhead: >-
      None hidden: every quantity is an exact rational in binomial
      coefficients. The per-iteration cost model (Gaussian elimination) is
      COMMON to both arms and cancels in G exactly, which is why G is
      cost-model-independent -- a property worth stating, because it means the
      headline cannot be attacked through the cost model.
    tradeoff_note: >-
      No time-memory tradeoff is claimed or affected.

  dominated_by: null
  dominated_by_check: >-
    null is asserted only after the following check, and the check is listed
    rather than claimed. THIS PROPOSAL CLAIMS NO ATTACK AND OCCUPIES NO POINT ON
    ANY PARETO FRONTIER, so there is nothing for a frontier row to dominate; the
    field is null in the sense of "not applicable", and the rows checked are
    those that could contain a PRIOR DERIVATION of the same quantity, which
    would make this record redundant rather than dominated. Rows checked, all
    three cost axes considered where a candidate existed: (1) TIME -- the
    corpus's ISD-adjacent records: none exist; grep for an SDitH, HQC or MCE
    experiment or evidence record returns nothing, and the ANGLE-BRIEF's F9
    section states this independently ("grep proves no such experiment or
    evidence record exists -- only goal/question/decision prose").
    (2) MEMORY -- KN-TECH-035 and KN-TECH-044 are the corpus's charging
    vehicles; KN-TECH-035 was read this session and contains no split-SD
    content. (3) DATA/QUERIES -- syndrome decoding is a single-instance problem
    with no query axis; there is no frontier row to check. External literature
    was NOT searched from this session and a published version of this counting
    may well exist; absence of a corpus result is not evidence of absence in the
    world (AGENTS.md knowledge-retrieval policy).
  sota_delta: >-
    Quantitative, and stated as the size of the question it removes rather than
    as an attack gain. Before: GOAL-SDITH-001 records the d-split-versus-plain-SD
    hardness question as OPEN with no computed bound anywhere in the program, and
    its only prior proposal budgets a "medium" implementation and "medium"
    compute to MEASURE a cost ratio at toy sizes. After: the Prange-level split
    advantage is bounded in closed form, evaluated exactly at deployed sizes, at
    a cost of seconds -- 0.433 bits at the illustrative d=2 cell against a
    worst-case bound of (d-1) log2(w+d-1) bits. The delta against the program's
    prior state is therefore: one of the goal's two completion criteria moves
    from "no derivation exists" to "a derivation exists, is exact at deployed
    sizes, and is falsifiable at a pre-registered 10-bit threshold", for
    approximately zero compute. The delta against the external state of the art
    is UNKNOWN and presumed zero or negative, because the literature was not
    searched.

  estimated_cost:
    implementation: low
    compute: negligible
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the headline prediction holds, i.e. that log2 G at SDitH's real
    parameters comes out under 3 bits. It is not higher because (a) SDitH's real
    d and w are unknown and a larger d than 2 moves G up quickly -- at w/d = 4
    the illustrative grid already gives 5.3 bits; (b) the split constraint's
    exact form is RECALLED-UNVERIFIED and a different form changes the counting;
    (c) the block-factorization assumption HEUR-SDITH-CBD-3 is not established
    beyond Prange and Lee-Brickell, so a reviewer may reasonably refuse the
    "no block-factorizing ISD can gain more than G" phrasing. It is not lower
    because the Vandermonde bound of Step 2 is unconditional and already forces
    O(d log w), the exact evaluation has no free parameter and no solver
    dependency, and the closed form reproduced the exact values to 0.001 bits at
    every cell with w/d >= 16 in this record. Separately: 0.98 that the run
    reaches a decisive number, because Stage 1 is seconds of standard-library
    integer arithmetic and does not depend on Stage 0 succeeding.
