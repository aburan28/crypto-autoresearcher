      ILLUSTRATIVE and is a shape chosen to exercise the derivation, not a claim
      about SDitH. RQ-SDITH-001's own constraints field already requires this:
      "No experiment may be designed until the relevant primary sources are
      filed as KN-LIT entries." The paired experiment therefore makes source
