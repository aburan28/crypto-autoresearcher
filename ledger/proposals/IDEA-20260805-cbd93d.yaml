      parameter table, not the deliverable.
    - >-
      REGULAR SYNDROME DECODING: RECALLED-UNVERIFIED. It is recalled that RSD
      (one error per block, i.e. the d = w endpoint of this axis) is the subject
      of dedicated algebraic attacks and is generally believed to be strictly
      easier than plain SD at matched parameters. NO CITATION IS ASSERTED, no
