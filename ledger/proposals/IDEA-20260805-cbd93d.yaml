idea:
  id: IDEA-20260805-cbd93d
  question_id: RQ-SDITH-001
  added: '2026-08-05'
  title: >-
    The d-split admissibility ratio: a zero-compute forced value that bounds the
    ENTIRE advantage a split-aware decoder can extract from SDitH's d-split
    constraint, derived before any run and checkable in exact integer arithmetic
  class: theory

  claim: >-
    For d-split syndrome decoding -- n coordinates partitioned into d blocks of
    n/d, error weight forced to exactly w/d in EACH block, versus plain SD which
    forces only total weight w -- the whole information-theoretic difference
    between the two problems is the single ratio
    R(n,w,d) = C(n/d, w/d)^d / C(n,w),
    which is the probability that a plain-SD error's block-weight profile happens
    to be balanced. Because C(n,w) = sum over compositions of the same product
    (Vandermonde), and the balanced term is the LARGEST term of that sum,
    R is bounded below by 1/C(w+d-1, d-1) UNCONDITIONALLY. Hence -log2 R is at
    most (d-1)*log2(w+d-1): a LOGARITHMIC quantity, never an exponent.
    Stronger and more useful: the Prange-level advantage a split-aware attacker
    gains is NOT -log2 R but the far smaller ratio of two such quantities,
    G(n,k,w,d) = R(n-k, w, d) / R(n, w, d)
              ~= [ ((n-w)/(n-1)) * ((n-k-1)/(n-k-w)) ]^{(d-1)/2},
    derived here by a local-CLT argument in which every d-dependent constant
    cancels. At the illustrative parameter set n=256, k=128, w=80, d=2 the exact
    integer computation gives log2 G = 0.433 bits and the closed form gives
    0.434 bits. FOUR TENTHS OF ONE BIT. If SDitH's real d is 2, and if the real
    (n,k,w) resemble any set of this shape, the d-split structure is worth less
    than half a bit of Prange advantage and the "is it as hard as plain SD"
    question is answered in the affirmative at Prange level by one line of
    arithmetic -- which is the derivation half of GOAL-SDITH-001's first
    completion criterion, obtainable today, at zero compute, before any decoder
    is written.

  object_first_candidate:
    tracked_object: >-
      THE BLOCK-WEIGHT PROFILE. For an error vector e in F_q^n and a partition of
      the coordinates into d blocks, the tracked object is the integer vector
      pi(e) = (wt(e_1), ..., wt(e_d)) in Z^d, followed through the one operation
      that ISD actually performs: the choice of an information set I and the
      event "supp(e) does not meet I". Everything else about e -- which positions
      inside a block, which nonzero field values -- is dropped. The d-split
      constraint is precisely the statement pi(e) = (w/d, ..., w/d), so the
      tracked object IS the difference between the two problems, and nothing
      else is.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this proposal:
      (1) information-set decoding as an algorithm to be improved -- Prange,
      Lee-Brickell, Stern, Dumer, MMT, BJMM, May-Ozerov, and every
      representation-technique descendant; (2) index calculus, which for
      syndrome decoding IS ISD under another name (columns of H are the factor
      base, a relation is a subset summing to the syndrome) and claiming novelty
      for it would be false; (3) algebraic / Groebner modelling of the SD
      instance; (4) statistical decoding and its dual-distance variants;
      (5) generic birthday and MITM framings; (6) side-channel, fault, and
      implementation attacks. This proposal proposes NO decoder. It computes a
      quantity that upper-bounds what any decoder in family (1) whose
      per-iteration success factorizes over blocks can gain from the split.
    newness_score: >-
      The identity C(n,w) = sum over compositions of prod C(n/d, w_j) is
      Vandermonde and is certainly known. The concentration of a multivariate
      hypergeometric profile is standard. What is not in this corpus -- verified
      against the prior-art list for RQ-SDITH-001, which contains exactly one
      proposal (IDEA-20260801-017) -- is either quantity written down as a
      PRE-REGISTERED FORCED VALUE for SDitH's own question, or the observation
      that the attacker-relevant quantity is the RATIO of two admissibility
      ratios rather than one of them. IDEA-20260801-017 proposes to MEASURE a
      cost ratio at toy sizes with an unspecified solver; this proposal DERIVES
      the ratio in closed form at the real sizes and makes the toy measurement a
      check on the derivation rather than the deliverable. That is a different
      record, not a variant.
    testability_score: >-
      Maximal. Both quantities are exact rational functions of binomial
      coefficients; Python's math.comb evaluates them at SDitH's real sizes in
      microseconds with no floating point in the critical path. There is no
      solver dependency, no library dependency (this container has numpy 2.4.6
      but NOT sympy -- measured this session -- and neither is needed), and no
      scale gap: the derivation is evaluated AT the deployed parameters, not
      extrapolated to them.
    survival_score: >-
      The object survives the whole of any block-factorizing ISD iteration,
      because the per-block avoidance events are conditionally independent given
      the profile. It DIES the moment an algorithm's success probability stops
      factorizing over blocks -- representation-technique ISD (MMT/BJMM) splits
      the error by VALUE rather than by POSITION, and its intermediate objects
      are not block-local. That failure boundary is stated as the proposal's
      declared limit, not hidden: see interpretation_limits.

  mechanism: >-
    DERIVED IN THIS RECORD. Every number below was computed here with exact
    integer binomials; the illustrative parameter sets are labelled as such and
    are NOT SDitH's, which this program has not read.

    SETUP. Fix n, k, w, q and d with d | n, d | k and d | w. Plain SD: given
    H in F_q^{(n-k) x n} and y = H e, find e of Hamming weight w. d-split SD:
    the same, with the additional promise wt(e_j) = w/d in each of the d blocks
    of size n/d. (THE PRECISE FORM OF SDitH'S SPLIT IS RECALLED-UNVERIFIED --
    exactly-w/d-per-block versus at-most or a weight vector -- and Stage 0 of
    the paired experiment is to read it. The derivation below is stated for the
    exactly-w/d form and is re-derived for whatever form the specification
    actually uses.)

    STEP 1 -- THE ADMISSIBILITY RATIO. Number of plain weight-w vectors:
    A_plain = C(n,w) (q-1)^w. Number of d-split-admissible vectors:
    A_split = [C(n/d, w/d) (q-1)^{w/d}]^d = C(n/d, w/d)^d (q-1)^w. The field
    values contribute (q-1)^w to BOTH and cancel exactly, so
      R(n,w,d) = A_split / A_plain = C(n/d, w/d)^d / C(n,w),
    a purely combinatorial quantity independent of q. Note what this says: the
    split constrains POSITIONS ONLY, so no amount of increasing q changes the
    gap. That is already a non-trivial structural statement and it is free.

    STEP 2 -- THE UNCONDITIONAL BOUND. Vandermonde:
      C(n,w) = sum_{w_1 + ... + w_d = w, 0 <= w_j <= n/d} prod_j C(n/d, w_j).
    Every term is non-negative, the number of terms is at most C(w+d-1, d-1),
    and the balanced term prod_j C(n/d, w/d) is the maximum term (each
    j -> C(n/d, j) is log-concave, so a majorization/rearrangement argument
    makes the balanced composition the maximizer). Therefore
      1 / C(w+d-1, d-1) <= R(n,w,d) <= 1,
    i.e. 0 <= -log2 R <= (d-1) log2(w+d-1). THIS IS A THEOREM, NOT A HEURISTIC,
    and it already settles the exponent question: the d-split promise removes at
    most O(d log w) bits of search space, which is o(n) for any d that is not
    itself growing with n. Checked here at n=256, w=80: d=2 gives -log2 R =
    3.222 against the bound 6.340; d=4 gives 8.675 against 16.487; d=8 gives
    17.623 against 32.444. The bound holds and is loose by roughly a factor of
    two, as expected from a crude term count.

    STEP 3 -- THE ATTACKER-RELEVANT QUANTITY IS NOT R. This is the step that
    makes the record worth having, and it is easy to get wrong. Prange on plain
    SD picks a uniform information set I, |I| = k, and succeeds iff supp(e)
    misses I: expected iterations T_plain = C(n,w) / C(n-k,w). Prange on the
    d-split instance can do better: it picks I with exactly k_j columns from
    block j. Conditioned on the split promise, the per-block avoidance events
    are independent, so the success probability is
      prod_j C(n/d - k_j, w/d) / C(n/d, w/d),
    and by the same log-concavity the balanced allocation k_j = k/d maximizes
    it. Hence T_split = [ C(n/d, w/d) / C((n-k)/d, w/d) ]^d, and the gain is
      G(n,k,w,d) = T_plain / T_split
                 = [ C((n-k)/d, w/d)^d / C(n-k, w) ] * [ C(n,w) / C(n/d, w/d)^d ]
                 = R(n-k, w, d) / R(n, w, d).
    THE GAIN IS A RATIO OF TWO ADMISSIBILITY RATIOS, NOT ONE OF THEM. Confusing
    R with G is the specific error this record exists to prevent: at
    n=256,k=128,w=80,d=2 the two differ by a factor of more than seven in bits
    (3.222 versus 0.433).

    STEP 4 -- CLOSED FORM, AND WHY THE CONSTANTS CANCEL. R(N,w,d) is exactly the
    probability that the multivariate-hypergeometric profile obtained by
    dropping w errors uniformly into d equal blocks of size N/d comes out
    balanced. That profile has mean w/d per block and per-block variance
      Var = w (1/d)(1 - 1/d) (N - w)/(N - 1) = c_N / d * (1 - 1/d),
    with c_N := w (N - w)/(N - 1). A local central limit theorem gives
    R(N,w,d) ~= (2 pi)^{-(d-1)/2} (det Sigma_{d-1})^{-1/2}, and det Sigma_{d-1}
    is c_N^{d-1} times a factor depending on d alone. In the RATIO
    G = R(n-k,w,d) / R(n,w,d) every d-only factor and every power of 2 pi
    cancels identically, leaving
      G ~= ( c_n / c_{n-k} )^{(d-1)/2}
         = [ ((n-w)/(n-1)) * ((n-k-1)/(n-k-w)) ]^{(d-1)/2}.
    This is the FORCED VALUE. It is a closed form in (n,k,w,d) with no fitted
    parameter, derived before any run, and it can be wrong.

    STEP 5 -- IT IS NOT WRONG AT SMALL d, AND IT DEGRADES PREDICTABLY. Exact
    integer evaluation against the closed form, computed in this record at
    n=320, k=160, w=80 (chosen so that d divides gcd(n,k,w)):
      d=1  : exact 0.000  closed form 0.000   [forced: both must be EXACTLY 0]
      d=2  : exact 0.291  closed form 0.290
      d=4  : exact 0.868  closed form 0.871
      d=5  : exact 1.155  closed form 1.161
      d=8  : exact 2.008  closed form 2.032
      d=10 : exact 2.570  closed form 2.612
      d=16 : exact 4.228  closed form 4.353
      d=20 : exact 5.308  closed form 5.514
      d=40 : exact 10.421 closed form 11.318
      d=80 : exact 19.317 closed form 22.927
    (all log2 G, bits). The closed form is accurate to under 0.01 bits while
    w/d >= 16 and drifts upward as w/d falls toward 1, which is exactly where a
    Gaussian approximation to a hypergeometric must fail. The drift is therefore
    diagnostic rather than embarrassing: it localizes the approximation's
    breakdown to the small-per-block-weight regime and tells a reader precisely
    when to use the exact binomials instead.

    STEP 6 -- THE OTHER END OF THE AXIS, WHERE THE EFFECT IS ENORMOUS. Push
    d to w with block size 2 (n = 2w, k = w): each block holds exactly one
    error among two positions, the information set takes one column per block,
    and T_split = 2^w while T_plain = C(2w, w). Then log2 G = w - (1/2)
    log2(pi w) exactly to the accuracy of Stirling. Computed here: at w=80 the
    exact value is 76.011 bits and the closed form w - (1/2) log2(pi w) gives
    76.013. SEVENTY-SIX BITS. So the mechanism is not vacuous and the instrument
    that computes it is not blind: the same code that must return 0.433 at d=2
    must return 76.011 at d=w. A quantity that returns "small" everywhere is a
    constant of the apparatus; this one is not.

    STEP 7 -- WHAT THE DERIVATION DOES NOT COVER, STATED PLAINLY. The
    factorization in Step 3 requires the algorithm's per-iteration success event
    to decompose into block-local events. Prange, Lee-Brickell and
    Stern/Dumer-with-a-block-aligned-window satisfy this. The representation
    technique (MMT, BJMM, May-Ozerov) does NOT obviously satisfy it: it splits
    the error by value into overlapping halves whose supports are not
    block-local, and its gain from a block promise is not computed here and is
    not claimed to be bounded by G. That is the honest boundary of this
    proposal and it is where the next proposal should start.

  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-05'
    corpus_paths_grepped:
      - ledger/proposals (prior art for RQ-SDITH-001)
      - ledger/hypotheses, ledger/experiments, ledger/evidence (area SDITH)
      - the session ANGLE-BRIEF's F8 and F9 tables and its TRAPS section
    grep_results:
      - >-
        RQ-SDITH-001 has exactly one prior proposal, IDEA-20260801-017, which
        proposes a MEASURED toy cost ratio with an unspecified best-known
        solver. It contains no derivation, no closed form, and no forced value,
        and its own predictions field asks only whether the measured ratio falls
        outside [0.5, 2].
      - >-
        Areas SDITH has no hypotheses, no experiments and no evidence records.
      - >-
        The ANGLE-BRIEF TRAPS table flags "index calculus for syndrome decoding"
        as NOT new (it is ISD renamed) and names as genuinely unattempted "the
        ratio of d-split-admissible error vectors to plain weight-w vectors --
        binomial products, exact in pure Python. That ratio IS the entire
        information-theoretic difference between the two problems." This
        proposal takes that angle and then goes past it, because the brief's
        quantity is R and the attacker-relevant quantity is G = R(n-k)/R(n).
    conclusion: >-
      NOVELTY IS UNVERIFIED AGAINST THE EXTERNAL LITERATURE AND MUST BE ASSUMED
      LOW. The coding-theory literature on regular and split syndrome decoding
      is large and this session did not read it; a published statement that
      d-split ISD gains only O(log w) bits would surprise nobody. The corpus
      novelty screen is additionally discounted per the ANGLE-BRIEF's measured
      finding that 7,420 of 7,809 literature entries carry a bulk-seed caveat
      and 5,582 have all four identifier fields null, so "not in the corpus" is
      a statement about the corpus, not about the world. The proposal's value is
      not novelty; it is that GOAL-SDITH-001's first completion criterion asks
      for exactly this derivation and no record in this program contains it.

