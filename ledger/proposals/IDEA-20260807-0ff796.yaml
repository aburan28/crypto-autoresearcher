idea:
  id: IDEA-20260807-0ff796
  question_id: RQ-ICINV-475b5e
  added: '2026-08-07'
  title: >-
    CLOSURE WITH A NAMED OBSTRUCTION: length-2 relation yield and factor-base
    decomposition probability are EXACT isogeny-class invariants in the mean,
    because the Semaev relation locus S_3(x1, x2, x(R)) = 0 is an F_p-isomorphic
    copy of E itself, so its F_p-point count is p + 1 - t and every observed
    within-class difference must be sampling noise, box-localisation error, or
    equation-choice (gauge) variation
  class: mechanism

  claim: >-
    (A) THE OBJECT. Fix E/F_p: y^2 = f(x) = x^3 + a x + b, non-singular, and a
    target point R in E(F_p) with R not in E[2] and R != O. Define the RELATION
    LOCUS C_R as the affine plane curve {(x1, x2) : S_3(x1, x2, x(R)) = 0},
    where S_3 is the third summation polynomial (KN-TECH-002). C_R has bidegree
    (2,2) in (x1, x2); the coefficient of x1^2 is (x3 - x2)^2 evaluated at
    x3 = x(R), so the bidegree is exact and not accidental.

    (B) THE STRUCTURAL FACT, which is the whole proposal. The map
    iota_R : E -> P^1 x P^1, P |-> (x(P), x(R - P)), is a morphism defined over
    F_p whose image is exactly the closure of C_R. iota_R is INJECTIVE on
    geometric points away from {O, R}: iota_R(P) = iota_R(P') forces P' = +-P
    and R - P' = +-(R - P); the case P' = -P with P' != P forces either 2P = O
    (excluded because then P' = P) or 2R = O (excluded by hypothesis). A smooth
    (2,2) curve on P^1 x P^1 has arithmetic genus (2-1)(2-1) = 1; a birational
    morphism from the genus-1 curve E onto it therefore cannot lower the
    geometric genus, so the image is smooth and iota_R is an ISOMORPHISM
    E -> closure(C_R) over F_p. The two points of E sent to the boundary are
    P = O and P = R. Consequently
        #C_R^{affine}(F_p) = #E(F_p) - 2 = p - 1 - t,
    which is a function of (p, t) ALONE and hence constant on the entire
    F_p-isogeny class.

    (C) WHAT THAT CLOSES. For a factor base V of B x-coordinates drawn uniformly
    at random from F_p, the expected number of ordered length-2 relations is
        E[#(C_R cap (V x V))] = B^2 (p - 1 - t) / p^2 (1 + O(1/p)),
    a function of (p, N, t) and B only. Therefore RELATION YIELD and
    FACTOR-BASE DECOMPOSITION PROBABILITY at arity 2 have ZERO within-class
    variance IN THE MEAN. The DECOMPOSITION.md section 5 prediction 1 ("zero
    variance in relation yield") is thereby upgraded from an expectation to a
    derived statement, and the axis is closed FOR THIS FUNCTIONAL with the
    obstruction named:
      NAMED OBSTRUCTION (O-YIELD): the mean relation count is the F_p-point
      count of a curve that is F_p-isomorphic to E, and point counts of curves
      in an isogeny class are determined by the class.

    (D) THE THREE RESIDUAL CHANNELS, all of which must be measured because each
    is a rival explanation for any observed within-class spread:
      (D1) SAMPLING NOISE. #(C_R cap (V x V)) is a hypergeometric-type count
        with standard deviation ~ sqrt(B^2/p). It does not vanish; it decays
        RELATIVE to the mean as B^{-1} p^{1/2}. This is the decay parameter.
      (D2) BOX-LOCALISATION ERROR. For V an interval I, #(C_R cap (I x I))
        deviates from |I|^2 (p-1-t)/p^2 by a Weil/Bombieri-type completion error
        that this record carries as O(sqrt(p) log^2 p) and marks [open] rather
        than quoting as settled.
      (D3) GAUGE. Under (x, a, b) -> (u^2 x, u^4 a, u^6 b) with u in F_p^*,
        S_3 is weighted-homogeneous of weight 8 (verified by direct expansion:
        each of the three grouped terms scales by u^8), so C_R transforms by the
        dilation (x1, x2) -> (u^2 x1, u^2 x2). A COORDINATE-DEFINED factor base
        is not carried along by that dilation, so the SAME curve written with a
        different Weierstrass equation gives a different yield. Gauge variance
        is not class variance and must be separated (IDEA-20260807-6eb96b).

    (E) WHAT IS NOT CLOSED, stated so this is a closure and not a fatigue
    report. Arity m >= 3: S_4 and above define higher-dimensional loci whose
    point counts are NOT immediately class-determined by this argument, and the
    argument must be redone or must fail there. The VARIANCE and higher moments
    of the relation count, as opposed to its mean. The distribution of relations
    over a STRUCTURED factor base, where (D2) dominates. And every functional
    that is not a count: solving degree, rank profile, Fourier flatness. This
    record closes one functional, at one arity, in the mean.

  resource_label: >-
    R1 (x-coordinates as field elements: the relation locus is a plane curve
    over F_p, not a set of group elements) + R2 (the curve equation: S_3's
    coefficients are polynomials in (a, b)).
  admissibility: admissible
  admissibility_argument: >-
    The tracked quantity is the F_p-point count of a plane curve determined by
    the Weierstrass coefficients. It is not the output of any group-operation
    oracle: an algorithm with only add/negate/equality on G cannot even name
    x1, x2 as field elements, let alone count solutions of a polynomial
    equation in them. The lane therefore escapes KN-FIND-b7e091 and H-ENDO-001,
    which close oracles whose outputs are group elements or scalars on a
    prime-order subgroup. NOTE: admissibility of the RESOURCE does not make the
    functional useful; this record's conclusion is that the functional is
    constant, which is a closure, not an attack.

  discriminated_from:
    - >-
      H-ICI-063e91 (status weakened, DEC-20260804-d0c452). That hypothesis asked
      whether phi^{-1}(F) AUGMENTS a factor base F across a 2- or ell-isogeny,
      and measured an augmentation ratio against a random-map null. This record
      makes no claim about preimages, does not move points between curves at
      all, and asks a different question: whether the relation COUNT on a single
      curve is a function of the class. The two records touch at exactly one
      point and the direction is consistent: (B) predicts the null value that
      H-ICI-063e91 measured, because a class-invariant mean leaves an isogeny
      nothing to augment in expectation.
    - >-
      KN-TECH-003 (point-decomposition index calculus) states the heuristic
      decomposition probability |F|^m / (m! N). This record does not restate
      that heuristic; it DERIVES the m = 2 case with the exact constant
      (p - 1 - t)/p^2 per cell and identifies what the heuristic averages over.
    - >-
      IDEA-20260807-427cf3, which tracks the Macaulay rank profile of the same
      ideal. Counting solutions and measuring the Groebner staircase are
      different observables of one system; 427cf3 owns the staircase and this
      record owns the count. Neither implies the other: a system can have a
      class-invariant solution count and a class-varying staircase.
    - >-
      DECOMPOSITION.md section 5 prediction 1. That is an [open] expectation
      recorded before measurement. This record supplies an argument for it and
      converts it into a falsifiable derived statement with three named residual
      channels.

  object_first_candidate:
    tracked_object: >-
      THE RELATION LOCUS C_R: the affine (2,2) plane curve cut out by
      S_3(x1, x2, x(R)) over F_p, followed as E ranges over its F_p-isogeny
      class at fixed target R (transported by T1) and fixed p.
    lossiness: >-
      GENUINELY LOSSY, and the loss is the point. C_R forgets the y-coordinates
      entirely (the x-map is 2:1), forgets which of the two lifts of each x is
      meant, forgets the group law on E except through the single relation
      P + (R - P) = R, and forgets every point of E except the fibre over R.
      What survives is exactly the incidence pattern "which pairs of
      x-coordinates sum to x(R)" -- which is what relation collection reads and
      nothing more. LOSSY-PROJECTION TEST: the discarded data (the sign of y for
      each summand) is discarded COMPATIBLY, because S_3 vanishes iff SOME
      choice of signs works, so the retained incidence propagates
      deterministically under the operations relation collection performs
      (adding a factor-base point, negating it, changing the target). This is
      not a change of coordinates: |E(F_p)| points collapse onto a locus whose
      defining data is 9 coefficients.
    propagation: >-
      Under a change of Weierstrass equation (gauge) C_R propagates exactly, by
      the dilation (x1, x2) -> (u^2 x1, u^2 x2), because S_3 has weight 8. Under
      an F_p-isogeny phi : E -> E' of degree ell, C_R does NOT propagate by any
      map of bounded degree: phi is not compatible with the x-coordinate
      projection, and the induced correspondence between C_R and C_{phi(R)} has
      bidegree ell. That failure of propagation is exactly why the ALGEBRAIC
      functionals are the ones with a chance of varying, and why the COUNT is
      not: the count survives because it is a birational invariant, and
      birational invariance is coarser than the correspondence.
    survival_score: >-
      Survives: change of equation, change of generator, change of factor base,
      change of target within E(F_p) \ E[2]. Dies at: R in E[2] (iota_R stops
      being injective and C_R degenerates), arity m >= 3 (the locus becomes a
      surface or higher and the genus-1 argument gives out), and any change of
      curve model that is not a Weierstrass twist (the (2,2) bidegree is a
      property of the short-Weierstrass S_3).

  mechanism: >-
    STEP 1 -- SYMBOLIC VERIFICATION, ZERO COMPUTE, HARD GATE. Using sympy in
    harness/semaev.py: (i) confirm bideg_{x1, x2} S_3 = (2, 2) and that the
    coefficient of x1^2 is (x3 - x2)^2; (ii) confirm the weight-8 identity
    S_3(u^2 x1, u^2 x2, u^2 x3; u^4 a, u^6 b) = u^8 S_3(x1, x2, x3; a, b) as a
    polynomial identity in u, a, b, x_i; (iii) confirm the classical identity
    disc_{x3} S_3 = 16 f(x1) f(x2), which is stated here as a fact to be
    RE-DERIVED by the executor and not quoted. Any failure kills the record.

    STEP 2 -- FULL TOY ISOGENY CLASS ENUMERATION. Choose p in [2^12, 2^14]. Build
    a length-p table of quadratic characters chi(v) once. For every j in F_p,
    construct the curve E_j: a = 3j(1728 - j), b = 2j(1728 - j)^2 (and handle
    j = 0, 1728 separately), count #E_j(F_p) = p + 1 + sum_x chi(f(x)) by one
    vectorised table lookup pass, and record its trace; do the same for the
    quadratic twist. Bucket by trace. Every bucket is a complete F_p-isogeny
    class. Expected class size ~ h(t^2 - 4p) ~ sqrt(p) (tens of curves at
    p ~ 2^13), and the enumeration is one p x p character-table sweep, which is
    a few hundred million numpy lookups at p = 2^14.

    STEP 3 -- DIRECT COUNT OF THE RELATION LOCUS. For each class member and a
    transported target R, count N_R(E) = #{(x1, x2) in F_p^2 : S_3 = 0} by
    solving the quadratic in x2 for each x1 (using disc = 16 f(x1) f(x_R) style
    evaluation, or simply evaluating S_3 as a quadratic in x2 and testing the
    discriminant's quadratic character). Cost O(p) per curve. PREDICTION FROM
    (B): N_R(E) = p - 1 - t EXACTLY, identically across the class, with no
    error term at all. This is a hard, exact, integer prediction -- the sharpest
    kind of falsifier available at this scale.

    STEP 4 -- THE FACTOR-BASE COUNT AND ITS THREE RESIDUALS. For each class
    member measure #(C_R cap (V x V)) for (i) V a common uniformly random
    subset of F_p of size B, IDENTICAL across class members (isolates class
    effect from V-choice); (ii) V an interval [0, W) (introduces D2); (iii) each
    of a sample of gauge representatives of the SAME curve (isolates D3). Sweep
    B over at least four values so the D1 decay B^{-1} p^{1/2} can be fitted
    rather than asserted.

    STEP 5 -- TRANSPORT CERTIFICATE. R must be the transported target, not an
    independently chosen point, or the comparison is between different
    problems. Compute an explicit ell-isogeny chain between class members with
    small ell (Velu on rational ell-torsion kernels found by factoring division
    polynomials at toy scale), transport (P, Q), and re-verify Q' = [k]P' by
    direct scalar multiplication in harness/toycurve.py. A failed re-verification
    is an infrastructure failure under AGENTS.md rule 5, never evidence.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 with the Grep tool over the whole
      repository: pattern "isogeny.class|isogeny class" (case-insensitive);
      pattern "birational|genus.1 curve|\\(2,2\\).curve|relation locus|C_R"
      restricted to *.md, *.yaml, *.py; pattern
      "first.fall degree|first_fall|solving degree|degree of regularity".
      Targeted reads of KN-TECH-002, KN-TECH-003, KN-FIND-b7e091,
      KN-FIND-5c1a03, H-ICI-063e91, DECOMPOSITION.md.
    results: >-
      "isogeny class": 60+ files, all of them either this campaign's own newly
      created lane records (the fourteen RQ files, DECOMPOSITION.md, the goal
      record) or the H-ICI-063e91 preimage-augmentation line. The genus/
      birational grep returns 4110 occurrences over 1102 files but every hit
      inspected is either the string "C_R" inside unrelated code, or "genus" in
      the supersingular/Weil-descent literature notes; NO record states that the
      S_3 relation locus is isomorphic to E, and no record derives the relation
      count as a point count. KN-TECH-003 states the decomposition probability
      as a heuristic |F|^m/(m! N) without the exact per-cell constant.
    verdict: >-
      ADAPTATION. The geometry is elementary and certainly known to specialists
      (the (2,2) model of E via P |-> (x(P), x(R-P)) is standard in the
      summation-polynomial literature and no external novelty is claimed here;
      an external literature check is Stage 0 of the minimal test and a positive
      hit would be an ingredient, not a disappointment). What is new TO THIS
      PROGRAM is the use of it as an INVARIANCE PROOF for the campaign's gating
      lane, converting DECOMPOSITION.md prediction 1 from an expectation into a
      derived closure with a named obstruction.

  null_object_control: >-
    MANDATORY AND BLOCKING. THE MATCHED NULL IS THE GAUGE ORBIT: the same curve,
    same j, same t, same N, same End(E), written with (p-1)/2 different
    Weierstrass equations (a, b) -> (u^4 a, u^6 b). It has exactly the shape of
    the real arm (a set of curve equations with a coordinate-defined factor
    base) and differs from it in exactly one thing: it holds the isogeny class
    member fixed. THE DECAY PARAMETER IS B, the factor-base size: the D1
    sampling channel must decay as B^{-1} p^{1/2} relative to the mean, and a
    within-class spread that does NOT decay when B grows is the canonical
    artifact tell (docs/inventor-protocol.md, KN-TECH-1a5b7e). SECOND NULL, for
    Step 3 only: the exact-count arm has NO sampling noise, so its forced value
    under the derivation is the integer p - 1 - t with spread exactly ZERO --
    which means the exact-count arm is a MODE-1 null (a control that cannot
    fail) for anything except an outright error in (B), and it is run for
    exactly that purpose and reported as such, never as evidence of invariance
    of the yield functional. THIRD NULL: a random (2,2) form with the same
    support but coefficients drawn uniformly, whose F_p-point count is NOT
    p - 1 - t; the pipeline must distinguish it from S_3, or the counter is
    reading the shape and not the curve.

  assumptions:
    - >-
      [fact, re-derivable] S_3 has bidegree (2,2) and weight 8. Verified by
      direct expansion in this record; Step 1 re-verifies symbolically.
    - >-
      [fact] Tate's isogeny theorem over finite fields: F_p-isogenous curves
      have equal characteristic polynomial of Frobenius, hence equal #E(F_p),
      hence equal t. This is what makes p - 1 - t a class invariant.
    - >-
      [open] The box-localisation error O(sqrt(p) log^2 p) in (D2) is quoted as
      the standard completion-of-sums figure for counting points of a curve of
      bounded genus in a box. It is NOT re-derived here and must be either
      re-derived or replaced by a measured empirical bound before any write-up
      uses the exponent.
    - >-
      [scope] Everything is at toy scale, p <= 2^14 for full enumeration and
      p <= 2^16 for sampled enumeration, claim_tier toy. No crypto-scale claim.
    - >-
      [scope] The argument is stated for R not in E[2] and R != O. E[2] targets
      are a measure-zero but non-empty exception and must be excluded by an
      explicit filter, not by hope.

  proof_search_map:
    bottleneck: >-
      The injectivity of iota_R on geometric points. Every other step is
      bookkeeping: bidegree is a computation, arithmetic genus of a (2,2) curve
      is a formula, and Tate's theorem is quoted. If iota_R is not injective --
      for instance if the case analysis missed a configuration -- the image is a
      quotient of E, its genus can drop to 0, and the count becomes p + 1 or
      similar rather than p - 1 - t. That single step carries the whole result.
    baseline_embedding:
      parameter_slice: >-
        B = p (the full factor base V = F_p). At that slice the predicted count
        is the exact integer p - 1 - t with no error term and no sampling noise,
        and it must reproduce #E(F_p) - 2 computed independently by naive point
        counting in harness/toycurve.py.
      reproduction_check: >-
        Frozen regression fixture: for at least 20 curves spanning at least
        three distinct traces at p = 4001 and p = 8191, assert the exact integer
        equality N_R(E) == p - 1 - t. Exact integer comparison, no tolerance.
        Any mismatch halts the line and is reported as a refutation of (B).
    observation_collision:
      observable: >-
        The integer N_R(E) = #C_R^{affine}(F_p).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and its success is the RESULT rather
        than a defect: find two curves with the same N_R but different j. Every
        pair of distinct class members is such a pair, by (B). The search that
        would falsify the interpretation is the opposite one: find two curves
        with the SAME trace and DIFFERENT N_R. Predicted: none exists. This is
        the cheapest possible discriminator and it is an exact integer test.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "how many relations does this curve yield" by "how many
          F_p-points does this plane curve have", and then replace that by
          "what is the trace of the isogeny class", using the isomorphism
          iota_R. Two reductions, each exact, ending at a class invariant.
        predicted_gain: >-
          Converts an empirical variance measurement over sqrt(p) class members
          into a one-line derivation plus one exact integer check. The gain is
          in the STRENGTH AND COST OF THE STATEMENT, not in attack cost: zero
          speedup is claimed.
      - transform: stronger_invariant
        proposed_object: >-
          The full zeta function of C_R rather than its F_p-point count, i.e.
          #C_R(F_p^n) for n = 1, 2, 3. Since C_R ~= E, this is E's zeta function
          and is class-invariant for every n, which strengthens the closure from
          "the mean yield over F_p" to "the mean yield over every extension".
        predicted_gain: >-
          Closes the extension-field variants of the same functional at no extra
          cost, and pre-empts the obvious "but over F_p^2?" objection.
    quantifier_order: >-
      Intended: FORALL primes p > 3, FORALL traces t with |t| <= 2 sqrt(p) and
      gcd(t, p) = 1, FORALL ordinary E/F_p with trace t, FORALL R in E(F_p) \
      (E[2] union {O}), the integer #C_R^{affine}(F_p) EQUALS p - 1 - t. Note
      the FORALL E inside the FORALL t: that ordering is the whole claim. The
      weaker and useless reading, NOT claimed, is FORALL E EXISTS a count --
      which is vacuous. The audit obligation is that the injectivity argument
      uses no property of E beyond non-singularity and no property of R beyond
      2R != O.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The MEAN number of length-2 Semaev relations over a factor base drawn
        uniformly at random is a function of (p, t, B) alone, hence constant on
        every F_p-isogeny class." It can NEVER certify anything about arity
        m >= 3, about the variance or tails of the relation count, about
        structured factor bases, about solving degree, or about the ECDLP.
      nearby_object_control: >-
        THE NEARBY OBJECT ON WHICH THE CONCLUSION FAILS, and it must be
        exhibited: R in E[2]. There iota_R is 2:1, C_R degenerates, and the
        count is NOT p - 1 - t. Running the pipeline on a 2-torsion target must
        produce a DIFFERENT number; if it produces p - 1 - t anyway, the counter
        is not reading the geometry and the whole measurement is an artifact.
    proof_obligations:
      - claim: iota_R is injective on geometric points away from {O, R}.
        responsibility: correctness
      - claim: The image is a (2,2) curve, so p_a = 1 and smoothness follows.
        responsibility: correctness
      - claim: Exactly two points of E map to the boundary of P^1 x P^1.
        responsibility: size
      - claim: t is constant on an F_p-isogeny class (Tate).
        responsibility: baseline
      - claim: The E[2] control gives a different count.
        responsibility: strictness
      - claim: Every reported count names its target R and its arity.
        responsibility: scope

  predictions:
    - metric: >-
        N_R(E) = #{(x1, x2) in F_p^2 : S_3(x1, x2, x(R)) = 0}, for every member
        of one complete toy isogeny class, at fixed transported R
      direction: different
      minimum_effect: >-
        EXACT INTEGER PREDICTION: N_R(E) = p - 1 - t for every member, with
        within-class variance EXACTLY ZERO. A single member differing by even 1
        (after excluding E[2] targets) falsifies (B). This is not a
        statistical threshold; it is an identity.
    - metric: >-
        within-class standard deviation of #(C_R cap (V x V)) at a COMMON random
        V of size B, divided by the mean
      direction: lower
      minimum_effect: >-
        Must equal the gauge-arm relative standard deviation within a factor of
        1.5, and must DECAY as B^{-1} p^{1/2} across at least four B values. A
        within-class spread exceeding the gauge spread by more than 1.5x, or
        failing to decay in B, is the artifact tell and forces the record to be
        superseded rather than amended.
    - metric: >-
        interval-factor-base yield spread within a class versus within the gauge
        orbit
      direction: different
      minimum_effect: >-
        PREDICTED: the gauge orbit produces AT LEAST as much spread as the
        class, because gauge dilates the interval while the class does not move
        it at all. If the class produces materially more spread than gauge at
        matched B, channel D2 has a class-dependent component and the closure
        is incomplete -- which would be the interesting outcome.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): external literature check for the (2,2)/genus-1
      model of the S_3 relation locus; record whatever is found in
      knowledge/literature/ whether or not it supports the record.
      STAGE 1 (minutes, HARD GATE): symbolic verification of bidegree, weight-8
      homogeneity and disc_{x3} S_3 = 16 f(x1) f(x2) in sympy.
      STAGE 2 (minutes, HARD GATE): the exact-integer regression fixture --
      N_R(E) == p - 1 - t on >= 20 curves at p in {4001, 8191}, plus the E[2]
      nearby-object control which must DISAGREE.
      STAGE 3 (~1 hour): full class enumeration at p in [2^12, 2^14] by
      vectorised character table; bucket by trace; pick the three largest
      classes.
      STAGE 4 (hours): the four-arm yield measurement (common random V,
      interval V, gauge orbit, random-(2,2)-form null) across every member of
      those classes, sweeping B over >= 4 values.
      STAGE 5 (zero compute): fit the B-decay, compare class spread with gauge
      spread, record the closure or its failure.
      Stages 1 and 2 alone are sufficient to kill the record and cost minutes,
      which is why this is the cheapest item in the lane.
    controls:
      - gauge orbit of a fixed class member (the matched null)
      - a common random factor base V shared across class members
      - R in E[2] (nearby object; the count MUST differ)
      - a random (2,2) form with matched support (the counter must distinguish)
      - independent recomputation of #E(F_p) by naive counting
      - transport certificate: Q' = [k]P' re-verified on every transported pair
    required_metrics:
      - exact integer N_R(E) per class member
      - '#(C_R cap (V x V)) per (curve, V-type, B), with V frozen by seed'
      - within-class, within-gauge and between-class variances at matched B
      - the fitted exponent of the B-decay of the relative spread
      - pass/fail of every gate control, reported before any yield number

  falsification_conditions:
    - >-
      Any class member with R not in E[2] gives N_R(E) != p - 1 - t. The
      structural fact (B) is false as stated; the record is SUPERSEDED, not
      amended, and the failure is itself the finding.
    - >-
      The symbolic weight-8 identity fails. The gauge analysis in (D3) is wrong
      and every gauge-null design in this lane (including IDEA-20260807-6eb96b)
      must be revisited.
    - >-
      The E[2] control returns p - 1 - t. The counter is not reading the
      geometry; nothing is reported.
    - >-
      Within-class relative spread at matched B exceeds gauge relative spread by
      more than 1.5x, or fails to decay in B. Then relation yield has a
      class-dependent component the derivation misses, the closure is withdrawn,
      and the lane gets a target instead.
    - >-
      Class enumeration at p = 2^14 exceeds the memory budget. INFRASTRUCTURE
      outcome under AGENTS.md rule 5; reduce p and record it as such, never as
      evidence about invariance.

  confounders:
    - >-
      TARGET CHOICE. Comparing curves at independently chosen targets compares
      different problems. R must be transported by an explicit isogeny with a
      re-verified certificate; this is the single most likely way to
      manufacture a fake within-class signal.
    - >-
      FACTOR-BASE CHOICE. A per-curve factor base (e.g. build_factor_base seeded
      by the instance in harness/semaev.py) makes V a function of the curve and
      confounds V-variance with class-variance. The common-V arm exists to
      remove this and is not optional.
    - >-
      GAUGE. The same curve has (p-1)/2 equations. Any comparison that does not
      fix or randomise gauge is measuring equation choice.
    - >-
      SMALL-p ARTIFACTS. At p ~ 2^12 the Weil error sqrt(p) is ~1.5% of p, so
      D2 is visible; at crypto scale it would not be. Trends in p must be
      reported, not a single p.
    - >-
      TRACE ZERO. t = 0 classes are supersingular over F_p and behave
      differently (the twist lies in the same class). Exclude or stratify.

  interpretation_limits:
    - >-
      This closes ONE functional at arity 2 in the MEAN, at toy scale, for
      short-Weierstrass models. It says nothing about arity >= 3, nothing about
      variance, nothing about solving degree, nothing about the ECDLP.
    - >-
      A closure of a cost functional is not a security statement. It says the
      isogeny-class axis carries no information for that functional, which is a
      statement about the SEARCH, not about the hardness of the ECDLP.
    - >-
      The derivation is unconditional given (B); the MEASUREMENT is toy-scale
      and its residual-channel fits are toy-scale. Neither licenses an
      extrapolation.
    - >-
      Nothing here interacts with KN-TECH-005 (the generic-group bound), which
      concerns a different model.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base V drawn uniformly at random from F_p with |V| = B, the
        count #(C_R cap (V x V)) is distributed as the number of successes in
        B^2 draws from a population of density (p - 1 - t)/p^2, up to the
        dependence induced by C_R's fibre structure; its standard deviation is
        therefore (1 + o(1)) sqrt(B^2 (p-1-t)/p^2).
      rigorous_support: >-
        The MEAN is not heuristic: it is exact by linearity of expectation
        together with the exact count in (B). Only the VARIANCE is modelled, and
        it imitates the classical hypergeometric/Poisson approximation for
        counting a fixed set of size ~p inside a random product set. The
        dependence C_R induces (each x1 has 0, 1 or 2 partners) is bounded and
        makes the true variance at most a constant factor larger.
      validation_plan: >-
        Sample >= 200 independent V per (curve, B) at p in {4001, 8191, 16381},
        compare the empirical standard deviation against the Poisson prediction
        by ratio, and check the tail: the largest observed count against the
        Poisson upper quantile at the same n. Comparison distribution: Poisson
        with mean B^2(p-1-t)/p^2. TOY SCALE ONLY, labelled as such; H1 is not
        validated at cryptographic scale by anything in this record.
    - id: H2
      statement: >-
        For V = [0, W) an interval, |#(C_R cap (V x V)) - W^2 (p-1-t)/p^2| =
        O(sqrt(p) log^2 p), uniformly in W and in the curve.
      rigorous_support: >-
        Imitates the standard completion-of-sums argument: expand the indicator
        of the box in additive characters and apply the Weil bound for the
        resulting character sums along a curve of genus 1. The rigorous
        ingredient is Weil; the heuristic part is the uniformity in W and the
        exact power of log. Marked [open] in assumptions and NOT quoted as
        settled.
      validation_plan: >-
        Measure max_W |deviation| / sqrt(p) across all W at p in
        {2003, 4001, 8191, 16381} for >= 30 curves per p, and check whether the
        maximum grows like a power of log p or like a power of p. A fitted
        p-exponent materially above 1/2 refutes H2 and is the reportable
        outcome. Toy scale, labelled.

  reachability_gate: >-
    T5 IS MOOT FOR THIS FUNCTIONAL AND THE RECORD SAYS SO EXPLICITLY RATHER THAN
    SKIPPING THE FIELD. If the mean yield is constant on the class, there is no
    minimiser to reach: every class member is optimal and the reachability
    question does not arise. The gate becomes live only in the falsification
    branch, where a class-dependent component of D2 is found; in that branch the
    reachability accounting of IDEA-20260807-c36472 applies verbatim
    (transport of a SPECIFIED class member costs Otilde(p^{1/4}) under standard
    heuristics and is therefore affordable against a p^{1/2} baseline, while
    IDENTIFYING the minimiser costs h ~ p^{1/2} functional evaluations and is
    not, unless goodness is common or locally detectable).

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The record's own computational
      cost: O(p) field operations per curve for the exact count, O(p) for the
      class enumeration per j, O(p^2) total for a full class enumeration at one
      p -- i.e. p^{1+o(1)} to p^{2+o(1)}, which is strictly WORSE than the
      0.886 sqrt(N) ~ p^{1/2} rho baseline and is affordable only because this
      is a measurement and not an attack.
    memory_exponent: >-
      O(p) for the character table (a length-p byte array), O(B) for a factor
      base. At p = 2^14 that is 16 KB and at p = 2^16 it is 64 KB; memory is not
      the binding constraint, wall time is.
    best_known: >-
      For prime-field ECDLP: parallel Pollard rho with distinguished points at
      0.886 sqrt(N) group operations and O(1) memory per processor
      (KN-TECH-001, KN-TECH-006), already including the negation discount
      (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory (KN-TECH-031). For
      the decomposition step specifically, KN-TECH-003's heuristic
      |F|^m/(m! N). This record changes none of them.
    hidden_overhead: >-
      The whole result hides inside "IN THE MEAN" and "AT ARITY 2". A
      class-invariant mean is compatible with a class-varying variance, and a
      class-invariant arity-2 count says nothing about arity 3. Both qualifiers
      must appear in every downstream sentence.
    tradeoff_note: >-
      Not applicable: no algorithm is produced. The measurement's own O(p) cost
      is bookkeeping, not a cryptanalytic tradeoff.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier named in the batch brief. (i) Parallel Pollard rho with
    distinguished points: 0.886 sqrt(N) group operations, O(1) memory per
    processor, linear parallel speedup (KN-TECH-001, KN-TECH-006). (ii) The
    automorphism-discounted variant on CM curves: same, with a constant discount
    at most sqrt(6) (KN-TECH-018). (iii) BSGS: sqrt(N) time, sqrt(N) memory,
    deterministic (KN-TECH-031). This record mounts no attack and produces no
    relation-collection speedup, so it is dominated by (i), (ii) and (iii) on
    time; by (i) and (ii) on memory; and by all three on data/queries, since it
    reads the full curve equation and performs O(p) field work where rho reads
    only the group. dominated_by is therefore NOT null and was not left null.
  sota_delta: >-
    Zero speedup against any attack baseline: the rho constant remains
    0.886 sqrt(N) and the exponent remains 1/2. The delta is a CLOSURE delta,
    stated quantitatively: it replaces an [open] expectation about the
    within-class variance of arity-2 relation yield (DECOMPOSITION.md section 5
    prediction 1) with an exact integer identity N_R(E) = p - 1 - t verifiable
    in O(p) per curve, and it bounds the entire residual within-class spread of
    that functional by three named channels whose sizes are B^{-1} p^{1/2}
    (sampling), O(sqrt(p) log^2 p)/B^2 (box error, [open]) and the gauge orbit
    (equation choice, not a class effect at all).

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.90 that Steps 1-2 confirm the exact identity N_R(E) = p - 1 - t: the
    injectivity case analysis is short and the bidegree is checkable by hand,
    and the residual 0.10 is dominated by an unnoticed degenerate configuration
    (repeated 2-torsion behaviour, or targets whose x(R) coincides with a
    ramification value) rather than by the argument being wrong. 0.6 that the
    within-class yield spread at matched B is indistinguishable from the gauge
    spread, which is the closure outcome; 0.3 that the interval arm shows a
    class-dependent D2 component at toy p that is really a small-p artifact; 0.1
    that something genuinely class-dependent survives, in which case this record
    hands the lane a target rather than a closure.

