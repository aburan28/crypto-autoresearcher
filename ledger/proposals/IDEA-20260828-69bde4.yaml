idea:
  id: IDEA-20260828-69bde4
  title: >-
    The true-IV anchor is the entire ceiling: a general, mechanically
    premise-checked proof that any N-chunk splice-and-cut MITM with one
    endpoint fixed at the true initial value or true output is capped at
    Round 1's free-word budget, and a named escape hatch for what a
    successor construction must abandon
  class: control
  claim: >-
    For MD4 and MD5, under the standard splice-and-cut architecture (one
    chunk computed forward from the TRUE initial value, another computed
    backward from the TRUE declared output, meeting at one or more interior
    split points, exactly the architecture underlying the entire active
    lineage IDEA-20260821-e46061 -> H-MDFIVE-bf7767 -> IDEA-20260821-ea35d1
    -> H-MDFIVE-0ca596), the number of message words simultaneously free
    (used by exactly one side) is EXACTLY 0 for every interior configuration
    once any chunk anchored at the true IV has traversed a complete round —
    NOT merely at the one split point (S=9, later S=8/S=16) already checked
    in this goal's history, but at EVERY interior split point across the
    WHOLE 48-step (MD4) / 64-step (MD5) schedule, and for ANY number of
    intermediate meeting points (an N-chunk generalization never previously
    stated). This is a strict generalization of IDEA-20260821-e46061's
    single-point qualitative fact into an exhaustively verified, exact
    ceiling on the ENTIRE architecture class the active lineage belongs to,
    conditional on one mechanically checked premise (every round of both
    primitives is a bijection on message-word indices {0,...,15}).
  mechanism: >-
    For steps a..b, define WORDS_USED_BY(a,b) as the set of message-word
    indices consumed by any step in that range, read directly off the
    published word-schedule tables. Each step's update, by direct inspection
    of the FF/GG/HH/II macros in RFC 1320/1321, explicitly reads its
    assigned word argument — a compiler-level fact, not a cryptographic one:
    if x[k] is not a parameter of a step's formula, that step's OUTPUT
    cannot be a function of x[k] for ANY fixed values of the other inputs.
    A chunk anchored at the true IV and computed forward through step S
    therefore has its state at S depend on (at least) every word in
    WORDS_USED_BY(1,S) — this is a NECESSARY, not sufficient, dependence
    (the syntactic-vs-algebraic-dependence gap is named explicitly below as
    the theorem's scope limit). A word is "free" for a later chunk, in the
    strict MITM sense used throughout this goal's lineage (independently
    enumerable given the other chunk's fixed values), only if it lies OUTSIDE
    WORDS_USED_BY of every EARLIER chunk. Because MD4's and MD5's Round 1
    consumes words {0,...,15} exactly once each in index order (already
    established and cited by IDEA-20260821-e46061's baseline), and because
    (checked here, not assumed) Rounds 2, 3, 4 each independently permute
    the SAME word set {0,...,15}, ANY chunk anchored at the true IV that
    reaches even the FIRST step of Round 2 has already, by virtue of
    containing all of Round 1, set WORDS_USED_BY(1,S) = {0,...,15} in full —
    so no word remains outside it for any later chunk to claim, REGARDLESS
    of how many further split points or meeting chunks are introduced. The
    ceiling is therefore not a property of the specific split points tried;
    it is forced the instant a true-IV-anchored chunk crosses ANY round
    boundary, for as long as it must start at step 1.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260821-e46061
      provenance: internal
      claim: >-
        The specific negative fact this proposal generalizes: no neutral
        word survives a chunk spanning a full round, established at one
        split point.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: H-MDFIVE-bf7767
      provenance: internal
      claim: >-
        The E_d/D_r propagation-support object and word-schedule reproduction
        check this proposal's own bijection-check reuses in spirit.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: H-MDFIVE-0ca596
      provenance: internal
      claim: >-
        The F-depth refinement (HEUR-H1b: syntactic reachability
        over-approximates actual variation) this proposal's scope-limitation
        (syntactic vs. algebraic dependence) directly borrows, and the
        free_word_capacity_ceiling computation ("i<=3, j>=14 is the natural
        next rung, NOT attempted") this proposal's dominated_by section cites.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: "RFC 1320 (MD4), pinned, sha256 f727b15e...2421c7"
      provenance: internal
      claim: The exact per-round word-order tables for all four MD4 rounds.
      verified_by: "already pinned and validated in this goal"
    - ref: "RFC 1321 (MD5), pinned, sha256 284a79d1...3149dd"
      provenance: internal
      claim: The exact per-round word-order tables for all four MD5 rounds.
      verified_by: "already pinned and validated in this goal"
    - ref: "Aoki, Sasaki FSE 2009 / Zhong-Lai eprint 2010/583, 'initial structures'"
      provenance: recalled
      claim: >-
        The general literature technique this proposal's named escape hatch
        (abandon the true-IV anchor) most likely corresponds to.
      verified_by: null
      note: >-
        Pointer only; never read; not relied upon for any specific claim in
        this record.
    - ref: "BATCH-ebac02 review_status_20260823 (red-team resumption findings, DEC-20260823-4c072b)"
      provenance: internal
      claim: >-
        The already-established fact that an analogous static predictor
        (RC-4) undercounted actual variation on 20/100 seeds — cited here
        only as a caution against over-trusting the heuristic (H1) fit
        below without the same tail-consistency discipline.
      verified_by: "idea-generator subagent (read in full during idea generation)"
  assumptions:
    - >-
      A word's syntactic appearance in a step's macro argument is a
      NECESSARY condition for that step's output to depend on it; this is
      definitional, not a heuristic.
    - >-
      The published round tables as transcribed into this goal's existing
      pinned inputs are correct; re-verified here as a proof obligation
      (PO-1), not assumed.
    - >-
      "Free for a chunk" is used in the strict MITM sense (independently
      enumerable given the other chunks' fixed values); this proposal does
      not consider partial-dependence relaxations — that is precisely the
      excluded "algebraic escape" named as a scope limit below.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the theorem: "chunk1 is anchored at the
      TRUE initial value." Remove that (allow chunk1 to start from an
      assumed/free intermediate state instead) and WORDS_USED_BY(1,S) is no
      longer forced to include all of Round 1's words — this is exactly the
      escape hatch named, but not constructed, by this proposal.
    baseline_embedding:
      parameter_slice: >-
        The S=9 (e46061), S=8 (ea35d1/R1-SEP10) split points already
        examined are exact instances of this proposal's |FREE(S)| sequence
        at those specific S values.
      reproduction_check: >-
        The part-1 computation's |FREE(S)| value must equal 1 at S=15 (the
        sole word free for a chunk2 at the Round-1-only boundary, matching
        e46061's original single-free-word construction) and 0 at S=16
        (first point where Round 1 is entirely closed), checked against the
        already-committed harness/run_md4_ceiling.py's own outputs before
        any new conclusion is trusted.
    observation_collision:
      observable: The |FREE(S)| exact integer sequence.
      distinct_preimage_search: >-
        Not applicable in the probabilistic sense — this is a deterministic
        computation. The analogous concern is addressed by the MD4/MD5
        cross-consistency control (both share one published word schedule,
        so their |FREE(S)| sequences must be bit-identical) and a synthetic
        non-bijective-schedule positive control.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The multiplicity invariant: once a true-IV-anchored chunk has
          traversed one full round, WORDS_USED_BY(1,S) = {0,...,15}
          identically, because every round of MD4/MD5 is (checked, not
          assumed) a bijection on {0,...,15}.
        predicted_gain: >-
          Converts a single-split-point qualitative statement into an
          exact, exhaustively verified, all-split-point, N-chunk-generalized
          ceiling. MODELED by the argument above; to be MECHANICALLY
          CONFIRMED by the premise check, not yet executed.
    quantifier_order: >-
      FOR ALL split points S with 1<=S<=N-1 (N=48 for MD4, 64 for MD5), FOR
      ALL choices of which chunk is anchored at the true IV versus the true
      output, FOR ALL numbers of intermediate chunks — IF every round of the
      primitive's word schedule is a bijection on {0,...,15} (a premise
      CHECKED, not assumed, by this record) THEN the free-word count
      available to any chunk not containing the true-IV-anchored chunk's
      first full round is exactly 0. This is a universal claim over split
      points and chunk counts, CONDITIONAL on a mechanically checked
      premise. It is NOT claimed to hold for architectures where no chunk is
      anchored at the true IV or true output — explicitly excluded from
      scope, not silently assumed false.
    method_ceiling:
      strongest_certifiable_claim: >-
        No true-IV-anchored (or true-output-anchored) splice-and-cut
        construction, with any number of chunks or meeting points, can ever
        grant more free-word budget than Round 1 alone provides — a ceiling
        on the ENTIRE architecture class the active MITM lineage belongs to,
        not merely on the specific constructions tried so far.
      nearby_object_control: >-
        The already-validated Round-1-only constructions (batch-4's
        degenerate S=9 slice, R1-SEP10's S=8 construction) are exact special
        cases where the theorem PERMITS nonzero |FREE(S)| and where a
        nonzero value HAS ALREADY BEEN MEASURED (R1-SEP10 passed its G-1/PO-2
        gate) — confirming the theorem is not vacuously restrictive; it
        correctly permits the region where free words are known to exist
        and (once mechanically checked) forbids the region immediately
        outside it.
    proof_obligations:
      - claim: "PO-1: every round (1-4) of MD4 and MD5, as transcribed in this goal's pinned inputs, is a bijection on {0,...,15}."
        responsibility: baseline
      - claim: "PO-2: the |FREE(S)| computation reproduces |FREE(15)|=1 and |FREE(16)|=0 as frozen regression values matching the already-established Round-1 result."
        responsibility: correctness
      - claim: "PO-3: MD4 and MD5's |FREE(S)| sequences are bit-identical at every S (both share the identical published word schedule)."
        responsibility: correctness
      - claim: "PO-4: the bijection checker correctly FAILS on a deliberately non-bijective synthetic schedule (positive control on the checker itself)."
        responsibility: correctness
      - claim: "PO-5: the theorem is interpreted only for the true-IV/true-output anchored architecture class; any downstream citation for a non-anchored construction is out of scope."
        responsibility: scope
      - claim: "PO-6: the algebraic-erasure decay-rate fit (H1 below) is reported with its 95% CI and worst-observed-seed tail check, not as a bare point estimate."
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: >-
        count of words w with w in WORDS_USED_BY(S+1,N) and w not in
        WORDS_USED_BY(1,S), summed per split point S=1..N-1, for both MD4
        (N=48) and MD5 (N=64)
      direction: different
      minimum_effect: >-
        EXACT match at every one of the 47 (MD4) / 63 (MD5) split points to
        the closed-form prediction (a step function: up to 1 for S<16,
        exactly 0 for S>=16) computed before any run; any single deviation
        is a finding, not noise, since this is exact integer arithmetic.
    - metric: >-
        number of rounds (of 4, per primitive) verified to be a bijection on
        {0,...,15} against the pinned RFC table
      direction: different
      minimum_effect: forced value 4 for both primitives; any round failing falsifies the premise for it specifically
    - metric: >-
        H1's fitted exponential decay rate of algebraic-erasure incidence
        vs. chain length L, on the toy-scale harness
      direction: different
      minimum_effect: >-
        explicit refusal to pre-commit a rate (no prior measurement of this
        exact quantity exists in this program); reported as observed, with
        the qualitative prediction that erasure incidence at L>=4 is
        materially rarer than at L=1 (generalizing HEUR-H1b's single
        data point to a curve)
  minimal_test:
    design: >-
      TWO artifacts. (1) THE PROOF-PREMISE CHECK (near-zero cost): load the
      pinned RFC 1320/1321 texts, extract all four rounds' word-order
      permutations for MD4 and MD5, verify each is a bijection on
      {0,...,15}, and compute WORDS_USED_BY(1,S)/WORDS_USED_BY(S+1,N) for
      every S, reporting |FREE(S)| as an exact integer sequence —
      milliseconds, zero sampling error. (2) THE ALGEBRAIC-ESCAPE HEURISTIC
      CHECK (reuses IDEA-20260821-ea35d1's already-validated toy harness
      verbatim): for chain lengths L=1..6, construct a word whose syntactic
      reach into a declared boundary component is at depth L using the same
      E_d/D_r machinery, and measure across >=100 independently seeded
      fixed-word assignments the empirical rate at which the boundary
      observable is constant (the ANOM-1 erasure signature) despite
      syntactic reachability.
    controls:
      - >-
        Reuse the exact existing E_d/D_r derivation and ANOM-1 detector
        rather than reimplementing; any discrepancy with the already-validated
        single-L-point results is itself a regression check.
      - >-
        MD4 vs MD5 paired computation of the identical |FREE(S)| sequence
        (both share the schedule) — any divergence is an implementation
        defect, not a cryptanalytic finding.
      - >-
        Synthetic non-bijective "round 2" (deliberately reuses one word
        twice, omits another) to confirm the checker correctly flags it.
    required_metrics: ["|FREE(S)| exact integer sequence for S=1..47 (MD4) and S=1..63 (MD5)", bijection-check pass/fail per round per primitive, "MD4 vs MD5 |FREE(S)| sequence equality (bit-exact)", algebraic-erasure incidence rate vs chain length L=1..6 with 95% CI, synthetic non-bijective-schedule control result must FAIL]
  falsification_conditions:
    - >-
      |FREE(S)| is nonzero for some S>=16 on either primitive — falsifies
      the general theorem as stated and requires identifying the specific
      schedule feature responsible.
    - >-
      Any round's word order fails the bijection check on the real
      RFC-derived table — falsifies the premise for that primitive/round.
    - >-
      MD4 and MD5's |FREE(S)| sequences differ at any S — a transcription
      defect in this goal's own pinned inputs, not a finding about the
      primitives.
    - >-
      The synthetic non-bijective control is NOT flagged — invalidates the
      checker and everything measured with it.
    - >-
      The algebraic-erasure incidence rate does NOT decay with chain length
      L — falsifies H1's extrapolation at these parameters.
  confounders:
    - >-
      Off-by-one errors in step-numbering convention between this record and
      the existing harness — mitigated by the MD4/MD5 cross-consistency
      control.
    - >-
      WORDS_USED_BY is a necessary-only criterion (a named scope limit, not
      a confounder to correct): a word syntactically absent cannot be free
      (airtight), but a word syntactically present is not guaranteed to
      carry genuine dependence (the algebraic-escape gap named in H1).
    - >-
      The already-known batch-6 finding that a related static predictor
      (RC-4) undercounted actual variation on 20% of seeds — a caution
      against over-trusting H1's fit at small sample size.
  interpretation_limits:
    - >-
      Covers only the strict two-or-more-chunk splice-and-cut architecture
      with at least one chunk anchored to the true IV or true output; says
      nothing about architectures where NEITHER endpoint is a ground-truth
      anchor (the "initial structure" class, recalled only, not attempted
      here) — named as the remaining open class per
      docs/inventor-protocol.md's closure standard, not declared closed.
    - >-
      The zero-free-word conclusion for S>=16 is a statement about
      SYNTACTIC reachability (necessary condition only); it cannot rule out
      an algebraic-escape construction this record is not aware of.
    - >-
      This is a ceiling on ONE architecture class, not a ceiling on preimage
      attacks against MD4/MD5 in general.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a randomly chosen fixed-word assignment, the probability that a
        word w's syntactic dependence is entirely algebraically erased from
        a specific boundary observable over a chain of L>=4 steps is
        heuristically 2^-Omega(L), imitating the same "iterated mixing looks
        random" extrapolation already used as HEUR-H1/H1b throughout this
        goal's lineage.
      rigorous_support: >-
        RFC 1321 sec 3.4's single-step F-balance property, extrapolated to
        iterated composition — the extrapolation itself is NOT proved,
        exactly as already disclosed for HEUR-H1/H1b in H-MDFIVE-0ca596.
      validation_plan: >-
        Reuse the exact toy-scale harness from IDEA-20260821-ea35d1 at
        k1=k2=6..10, sampling >=100 fixed-word seeds, measure the empirical
        decay rate of erasure incidence vs. chain length L=1..6 via
        log-linear regression, report the fitted rate with its CI, and
        tail-check against the single WORST observed seed (slowest decay),
        not only the average — matching this goal's established
        tail-consistency discipline.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed. The deliverable is an exact integer
      sequence (zero-cost combinatorial fact) plus an empirical decay-rate
      curve at bounded toy scale matching this goal's established budget
      norms.
    memory_exponent: >-
      Negligible — a 48/64-entry lookup table and toy-scale runs well under
      1 GB.
    best_known: >-
      IDEA-20260821-e46061/H-MDFIVE-bf7767's qualitative statement, checked
      at essentially one split point, that "no neutral word survives a
      chunk spanning a full round." This proposal replaces that with an
      exhaustive, exact, all-split-point computation plus a formal N-chunk
      generalization and a named escape hatch — a sharper ceiling
      STATEMENT, not a faster algorithm.
    hidden_overhead: >-
      Part 1 (premise check) is genuinely free of hidden cost. Part 2 (H1)
      inherits all of this goal's already-disclosed hidden costs for the
      E_d/D_r/ANOM-1 machinery (reachability over-approximates actual
      variation; a single lucky seed can hide partial degeneracy; batch-6
      already found an analogous predictor undercounts on 20% of seeds) —
      this record inherits and cites those costs rather than re-deriving them.
    tradeoff_note: >-
      Not applicable in the time-memory sense (a ceiling statement, not a
      tunable algorithm). The relevant "tradeoff" is architectural:
      abandoning the true-IV anchor trades a currently-free certainty (the
      true IV needs no search) for an assumed intermediate state that must
      itself be searched over or justified — the real cost the literature's
      initial-structure technique must pay, not quantified here.
  dominated_by: >-
    n/a (no result claimed). Checked against the UNVERIFIED 2^123.4 preimage
    figure, the seconds-scale collision figure, the birthday-enumeration
    cost anchor (EV-MDFIVE-f3e1ca O-2), and the active MITM lineage's own
    free_word_capacity_ceiling figures (H-MDFIVE-0ca596: "i<=3, j>=14 is the
    natural next rung, NOT attempted"). This proposal's deliverable is an
    exact combinatorial ceiling for a whole architecture class, not a
    competing algorithm — it instead BOUNDS what that lineage's "next rung"
    tuning can ever achieve within the true-IV-anchored architecture.
  sota_delta: >-
    No attack; a scope-sharpening ceiling statement. Its delta relative to
    the existing single-split-point negative fact is exhaustiveness (all
    47/63 split points, both primitives, N-chunk generalized) plus an
    explicit named successor direction.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
