idea:
  id: IDEA-20260815-e94ea3
  question_id: RQ-SSIQ-9702af
  added: '2026-08-15'
  title: >-
    THE MEET-IN-THE-MIDDLE STEP IS WHERE THE p^(1/3) ALGORITHM SPENDS ITS
    MEMORY: check whether a van Oorschot-Wiener collision search replaces
    the keyed table and moves the memory exponent without moving time
  class: theory

  claim: >-
    The published algorithm builds a keyed table and does claw finding,
    giving memory essentially equal to time. Parallel collision search
    trades memory for time on exactly this shape of problem, and the paper
    itself cites the tradeoff for interpolating back to p^(1/2). Whether a
    golden-collision search can sit at a better point than the endpoints --
    reducing memory while holding time near p^(1/3) -- is a specific
    question the paper does not answer.

  mechanism: >-
    Model the claw-finding step as a golden-collision problem. Apply the van
    Oorschot-Wiener cost formula with memory as a free parameter. Determine
    whether any memory budget below p^(1/3) keeps time near p^(1/3), and
    identify what structural property the function would need.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of the paper's section 4.1 tradeoff discussion; grep 'van
      Oorschot', 'golden collision', 'claw finding'.
    results: >-
      The paper cites the tradeoff as an interpolation to p^(1/2); no
      record here examines whether an intermediate point is reachable or
      what it would require.
    verdict: >-
      UNVERIFIED. Golden-collision tradeoffs are classical and the paper
      names the interpolation; whether the intermediate regime has been
      analysed for this specific function is the stage-one literature
      question.

  object_first_candidate:
    tracked_object: >-
      THE MEMORY EXPONENT of the meet-in-the-middle step, as a free
      parameter rather than a consequence of the table.
    lossiness: >-
      Treating memory as free rather than as table size discards the
      table's structure, which is precisely what a collision search would
      replace.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives as a symbolic analysis; it depends entirely on whether the
      claw-finding step's function is amenable to random-function
      collision search, which is the real question.

  null_object_control: >-
    NULL 1 -- the memory-equals-time endpoint, which must reproduce the
    published p^(1/3) result. NULL 2 -- the polynomial-memory endpoint,
    which must reproduce the p^(1/2) Delfs-Galbraith behaviour the paper
    cites.

  discriminated_from:
    - >-
        The paper's own tradeoff remark, which states the interpolation
        without examining intermediate points.
    - >-
        The exponent-factor ranking record in this series, which asks
        which factor binds; this asks specifically about the memory term
        of one factor.

  assumptions:
    - >-
        The claw-finding step can be modelled as a golden-collision search
        over a function that behaves randomly. THIS IS THE LOAD-BEARING
        ASSUMPTION and it is where the analysis most likely fails, since
        the function has real structure.
    - >-
        The van Oorschot-Wiener formula applies to this function's shape
        without modification.

  predictions:
    - metric: >-
        memory-equals-time endpoint
      direction: different
      minimum_effect: >-
        FORCED to reproduce p^(1/3); otherwise the model is wrong.
    - metric: >-
        polynomial-memory endpoint
      direction: different
      minimum_effect: >-
        FORCED to reproduce p^(1/2).
    - metric: >-
        time at intermediate memory budgets
      direction: different
      minimum_effect: >-
        The analysis; if time rises steeply as soon as memory falls
        below p^(1/3), no intermediate point helps and that closes the
        question cleanly.

  minimal_test:
    design: >-
      Symbolic only. Instantiate the formula, check both endpoints, sweep
      memory.
    controls:
      - >-
          Both endpoint reproductions.
      - >-
          The random-function assumption stated explicitly as the
          analysis's weak point.
      - >-
          Structural properties the function would need, enumerated
          rather than assumed.
    required_metrics:
      - >-
          Time as a function of memory budget between the endpoints.
      - >-
          Both endpoint reproductions.
      - >-
          Enumerated structural requirements for the collision search to
          apply.

  falsification_conditions:
    - >-
        An endpoint is not reproduced. Model wrong; halt.
    - >-
        Time rises steeply below memory p^(1/3). No useful intermediate
        point; the question closes cleanly and cheaply.
    - >-
        An intermediate point holds time near p^(1/3) at lower memory.
        That would be a genuine improvement to the algorithm's
        practicality and requires independent review before any claim.
    - >-
        The claw-finding function is not amenable to random-function
        collision search. The whole approach is inapplicable, which is the
        most likely outcome and should be stated as an obstruction.

  confounders:
    - >-
        RANDOM-FUNCTION ASSUMPTION, which is the analysis's central
        weakness: the claw-finding function is built from structured
        isogeny data and treating it as random is exactly the kind of
        assumption that makes a tradeoff look available when it is not.
    - >-
        ENDPOINT FITTING: a formula tuned to reproduce both endpoints can
        interpolate wrongly between them.

  interpretation_limits:
    - >-
        Symbolic analysis of a published algorithm's memory tradeoff; no
        implementation and no new algorithm.
    - >-
        Conclusions rest entirely on the random-function modelling
        assumption.
    - >-
        Any favourable intermediate point is a modelling result requiring
        independent review before being treated as an improvement.

  heuristic_assumptions:
    - id: HEUR-SSIQ-VW-1
      statement: >-
        The claw-finding step's function behaves as a random function
        for the purposes of parallel collision search cost.
      rigorous_support: >-
        Rigorous ingredient: the van Oorschot-Wiener analysis is
        rigorous for genuinely random functions and is the standard tool
        for this shape. THE GAP, WHICH IS THE RECORD'S WHOLE RISK: the
        function here is built from smooth-degree isogeny data with
        strong algebraic structure, and structured functions routinely
        have collision behaviour far from random, so the formula may
        simply not apply.
      falsification_condition: >-
        A structural property of the function that changes its collision
        statistics from random.
      validation_plan: >-
        SAMPLE: enumerate the function's known structural properties and
        check each against the random-function requirements. TAIL CHECK:
        properties that concentrate the image, which would break the
        analysis most severely. TRANSFER: none; the analysis is symbolic
        and its applicability is the question.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is the published algorithm with memory equal to time,
      plus the paper's own cited interpolation to p^(1/2); this record
      examines the interior of that interpolation.
    hidden_overhead: >-
      The paper's disclosed superpolynomial o(1) overhead applies to every
      point on the tradeoff curve and must not be dropped when comparing
      intermediate points.
    tradeoff_note: >-
      Lower memory buys practicality and costs time; whether the exchange
      rate is favourable anywhere in the interior is the question.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a complexity result: dominated by the
    published paper, which is the source. As an interior tradeoff analysis:
    none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent claim. Content delivered: an interior analysis of
    the memory-time tradeoff the source paper only describes at its
    endpoints, with the random-function assumption named as the load-bearing
    weakness and the structural requirements enumerated rather than assumed.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that both endpoints reproduce. 0.3 that the random-function
    assumption survives contact with the function's actual structure, which
    is the dominant risk and the likeliest place this closes. 0.15 that a
    useful intermediate point exists, which would need review before any
    claim.

  status: proposed
  proposed_by: claude-code-session
