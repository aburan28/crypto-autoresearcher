idea:
  id: IDEA-20260816-adf2a2
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-16'
  title: 'Implicit and explicit rejection are two different functions, not two styles: build both
    decapsulators for a toy unstructured-LWE KEM, enumerate the malformed-ciphertext classes, and
    measure on how many of them the two functions are functionally indistinguishable to an adversary
    who sees only outputs and never a timing.'
  class: mechanism
  claim: '(A) OBJECT. Fix a toy unstructured-LWE KEM of Frodo shape. Build two decapsulation functions
    over the identical key material: EXPLICIT rejection returns a distinguished failure symbol when
    the re-encryption check fails, IMPLICIT rejection returns a pseudorandom key derived from a secret
    seed z and the ciphertext. The tracked object is the REJECTION SIGNATURE of a ciphertext class:
    for each class of malformed ciphertext, the triple (does the explicit decapsulator reject, does
    the implicit output depend on the secret key beyond z, is the implicit output a deterministic
    function of the ciphertext alone). (B) CLAIM. The classes partition into three regimes and the
    partition is measurable without any timing channel: a regime where both functions agree on every
    observable an output-only adversary has, a regime where explicit rejection leaks a bit that implicit
    rejection does not, and a regime where implicit rejection''s output is a per-key pseudorandom
    function evaluation that an output-only adversary cannot distinguish from a fresh key without
    querying the same ciphertext twice. The claim is that the SIZE of the middle regime, counted as
    a fraction of an enumerated malformed-ciphertext generator''s output, is a measurable number at
    toy parameters and is not zero. (C) SECOND CLAIM. Repeat-query behaviour separates the two objects
    for free: implicit rejection is deterministic in the ciphertext, so querying the same malformed
    ciphertext twice yields the same key, while a naive implementation that samples fresh randomness
    on failure does not. That determinism is itself an observable, and whether a specification pins
    it is a checkable property of the specification rather than of the implementation. (D) WHAT IS
    NOT CLAIMED. No attack and no security consequence. This measures how two functions differ under
    an output-only adversary at toy dimensions; it does not claim either variant is insecure, does
    not claim FrodoKEM''s choice is wrong, does not claim any deployed implementation is affected,
    and makes no statement about timing, power, fault or any other side channel. Existing corpus results
    on FO implementation attacks are explicitly out of scope by AGENTS.md rule 7 and by RQ-FRODO-a2dbe2
    constraint 6.'
  mechanism: 'STAGE 1. Implement a toy unstructured-LWE PKE with Frodo''s shape at small n, nbar,
    q, with a tabulated small-support error distribution, plus both FO decapsulators over shared key
    material. Nothing here needs the FrodoKEM primary text, because the two rejection modes are generic
    FO constructions; a later stage would bind the toy to the filed specification, and this proposal
    does not. STAGE 2. Write a MALFORMED-CIPHERTEXT GENERATOR that enumerates named classes rather
    than sampling blindly: honestly generated, single-coordinate perturbed by one unit, single-coordinate
    perturbed by a large amount, coordinate block zeroed, ciphertext taken from a different key, ciphertext
    taken from a different message with the same randomness, and syntactically malformed lengths.
    Each class is a named generator with a frozen seed. STAGE 3. For each class, run both decapsulators
    and record the rejection signature. Determinism is tested by re-querying every ciphertext twice,
    and key-dependence beyond z is tested by re-running the implicit decapsulator with z held fixed
    while the LWE secret is resampled, which isolates whether the output moves with the secret at
    all. STAGE 4. Compute the three-regime partition and the middle-regime fraction, with a bootstrap
    confidence interval over generator seeds. STAGE 5. Null arm, in the same invocation: replace the
    KEM with a random-function stand-in of the same input and output shapes, and run the identical
    signature measurement. STAGE 6. Structural-tell check per inventor-protocol section 3: sweep the
    toy dimension upward and check that the middle-regime fraction MOVES in the direction the construction
    predicts. A fraction that is identical at three dimensions is the signature of a measurement artifact,
    not of a structural difference.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-FRODO-a2dbe2 in full, in particular its scope.family field naming implicit rejection,
      and its constraint 6 separating implementation-side corpus results. Ran grep -ril over ledger/proposals/
      for implicit rejection, explicit rejection, re-encryption, Fujisaki, transform T, correctness
      error. Parsed and read the titles of every hit. Also read the FrodoKEM-adjacent corpus pointers
      named in RQ-FRODO-3260cc.constraints: KN-LIT-2088, KN-LIT-3859, KN-LIT-118, KN-TECH-047, KN-LIT-2541.'
    results: 'Two proposals mention implicit rejection: IDEA-20260806-7c1ae4 (ML-KEM, the four-predicate
      conjunction a deployed failure oracle needs, U/R/C/S) and IDEA-20260807-1f5f89 (ML-KEM, a decapsulation-key
      field-integrity defect class reaching the dk fields H(ek) and z). The second is the closest
      record in the corpus because it touches z, but its object is a KEY-MUTATION generator and its
      target is field integrity of a stored decapsulation key; it does not compare the two rejection
      modes as functions and does not enumerate ciphertext classes. IDEA-20260813-a33bee''s hit on
      explicit rejection is a class-group KEX record and is unrelated. IDEA-20260808-d21021 (HQC)
      is the nearest FO-mechanism record: it argues the FO/HHK bound needs worst-case rather than
      average-case correctness because HQC''s ciphertext energy is a steerable dial. That is a correctness-quantifier
      argument, not a rejection-mode comparison. The corpus FrodoKEM material on the FO equality test,
      KN-LIT-2088 (timing) and KN-LIT-3859 (fault injection), is implementation-side and is fenced
      out here by construction, since this design forbids itself any timing or fault observable.'
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      what is or is not published on implicit versus explicit rejection. Claimed new inside this repository:
      no record treats the two rejection modes as two functions and measures the fraction of an enumerated
      malformed-ciphertext class set on which they are functionally distinguishable to an output-only
      adversary; and no record uses re-query determinism as the separating observable. Assembled from
      known parts: FO rejection modes are standard constructions; enumerated-class ciphertext generators
      are the shape of IDEA-20260807-1f5f89''s key-mutation generator applied to a different input;
      the null-object and structural-tell discipline is docs/inventor-protocol.md section 3 verbatim.'
  object_first_candidate:
    tracked_object: 'The rejection signature of a named malformed-ciphertext class: the triple (explicit
      decapsulator rejects yes or no, implicit output varies when the LWE secret is resampled with
      z held fixed yes or no, implicit output is deterministic across repeated queries yes or no),
      tracked across an enumerated set of classes and across a sweep of the toy dimension.'
    lossiness: 'The projection discards the shared secret, the error matrix, the message, and the
      actual bytes of every returned key, retaining three bits per class. It is genuinely lossy: the
      returned key value determines the signature but not conversely, and an enormous set of key material
      yields the same signature. What survives propagates because each of the three bits is defined
      by a comparison that is stable under any change of key material that preserves the class membership
      of the ciphertext: rejection is a predicate of the re-encryption equality, secret-dependence
      is a predicate of a two-run difference, determinism is a predicate of a two-query difference.
      None of the three consults a key value directly, so stepping to a fresh key leaves the signature
      well defined and comparable.'
    propagation: 'One step of the target operation is one decapsulation query. Applying it maps a
      ciphertext class to one row of the signature table, and the interesting propagation is under
      the SECOND step: re-querying the same ciphertext, which under implicit rejection must return
      the identical key and under a fresh-randomness implementation must not. A third step, resampling
      the LWE secret while pinning z, moves the implicit output if and only if the failure path consumed
      the secret. Each step is a single deterministic function evaluation, so the object''s evolution
      is fully specified without any probabilistic modelling.'
    survival_score: The signature is exactly defined at every toy dimension and never dissolves as
      an object; what can dissolve is its INFORMATIVENESS. Concretely, the middle regime is expected
      to shrink as the class generator's perturbations get large, because a badly malformed ciphertext
      is rejected by both paths in a way an output-only adversary cannot tell apart, and to shrink
      as the toy dimension rises if the failure paths converge. The proposal predicts the middle-regime
      fraction remains nonzero across at least three toy dimensions and states in advance that a fraction
      constant to three decimal places across those dimensions would be read as an artifact rather
      than as a finding.
  null_object_control: 'A random-function stand-in with the identical interface: a keyed pseudorandom
    function from ciphertext bytes to a key of the same length, wrapped in a fake explicit mode that
    rejects on a fixed-probability coin independent of the ciphertext content, run through the IDENTICAL
    class enumerator and the IDENTICAL signature measurement in the same invocation. The null must
    show a middle-regime fraction consistent with its own rejection coin and NO dependence of the
    signature on class identity, because a random function has no re-encryption check to fail. If
    the null reproduces the signal arm''s class-dependent pattern, then the pattern is produced by
    the class generator or the measurement code rather than by the KEM, and the signal arm means nothing.
    A second null holds z fixed and resamples the secret on the random-function arm, where by construction
    the output must not move; a moved output there is a measurement bug.'
  discriminated_from:
  - 'IDEA-20260807-1f5f89 (ML-KEM): a decapsulation-key field-integrity generator reaching H(ek) and
    z. It mutates the KEY; this mutates the CIPHERTEXT and compares two decapsulation functions over
    one unmutated key. The two generators cannot substitute for each other.'
  - 'IDEA-20260806-7c1ae4 (ML-KEM): the four-predicate conjunction a deployed failure oracle requires.
    That record asks when an oracle EXISTS in a deployment; this asks what two functions do on enumerated
    inputs, and deliberately makes no deployment claim.'
  - 'KN-LIT-2088 and KN-LIT-3859 (FrodoKEM FO equality-test timing and fault injection): implementation-side
    channels. This design forbids itself any timing, power or fault observable and reads only returned
    values, so it cannot restate either result and cannot be scored against them, per RQ-FRODO-a2dbe2
    constraint 6.'
  - 'IDEA-20260808-d21021 (HQC): worst-case versus average-case correctness in the FO/HHK bound via
    steerable ciphertext energy. That is a quantifier argument about the bound; this is a functional
    measurement of the decapsulator and never evaluates a bound.'
  - A generic KAT-style test-vector comparison of two implementations, which checks agreement on honest
    inputs. The whole content here is the enumerated MALFORMED classes and the two derived observables
    (secret-dependence under pinned z, and re-query determinism) that honest inputs cannot expose.
  assumptions:
  - A toy unstructured-LWE KEM of Frodo shape is a legitimate carrier for a rejection-mode comparison,
    because both rejection modes are generic FO constructions that do not depend on the underlying
    PKE's dimension.
  - The class enumerator's named classes are frozen before the run and are not extended after seeing
    results, since post-hoc class addition would let the middle-regime fraction be tuned.
  - No timing, memory-access, power or fault observable is available to the modelled adversary; only
    returned values and their equality relations.
  - The pseudorandom function used for implicit rejection is modelled as a hash call and is not itself
    under study; a weakness in it would be a different experiment.
  - Toy dimensions are chosen small enough that decryption failures on honest ciphertexts can be made
    observable by construction, so that the failure path is exercised at all rather than being unreachable.
  predictions:
  - metric: middle-regime fraction, that is the fraction of enumerated malformed classes on which
      the two decapsulators are distinguishable to an output-only adversary
    direction: higher
    minimum_effect: 0.15
  - metric: middle-regime fraction on the random-function null arm
    direction: lower
    minimum_effect: 0.02
  - metric: re-query determinism rate for the implicit decapsulator
    direction: higher
    minimum_effect: forced value 1.0 exactly; any value below 1.0 indicates the implementation samples
      fresh randomness on the failure path and is a construction defect in the test rig, not a finding
      about the transform
  - metric: fraction of classes on which the implicit output moves when the LWE secret is resampled
      with z pinned
    direction: different
    minimum_effect: 'no pre-commitment, with reason: this is exactly the quantity under measurement
      and pre-committing to it would convert the experiment into a confirmation. The direction is
      recorded as different because both a near-zero and a near-one value are informative and mean
      opposite things about where the secret enters the failure path.'
  - metric: change in middle-regime fraction across three toy dimensions
    direction: different
    minimum_effect: 0.01
  minimal_test:
    design: 'The cheapest discriminating run needs one toy parameter set, both decapsulators, six
      named malformed classes and the random-function null, all in one invocation. For each class,
      generate thirty-two ciphertexts under frozen seeds, decapsulate each twice with both variants,
      then re-run the implicit variant with z pinned and the LWE secret resampled. Record the three
      signature bits per class per arm. The measurement that discriminates is a single contingency
      table: signature pattern by class, for the KEM arm versus the null arm. If the null arm reproduces
      the KEM arm''s class-dependent pattern, the instrument is measuring its own generator and the
      proposal dies at a cost of minutes. If it does not, the middle-regime fraction and its bootstrap
      interval are the first real number, and only then is it worth sweeping dimension for the structural-tell
      check. Total cost: well under one CPU-hour, no primary source required, no dependence on RQ-FRODO-a2dbe2
      constraint 1 being discharged.'
    controls:
    - Random-function null arm with the identical interface, class enumerator and signature measurement,
      run in the same invocation as the signal arm.
    - Honest-ciphertext control class, on which both decapsulators must return the same correct key
      and the signature must be the trivial one.
    - Pinned-z secret-resampling control, which on the null arm must show no output movement.
    - Double-query determinism control applied to both arms and to the honest class.
    - 'Dimension sweep as the structural-tell control: the measured fraction must move as the toy
      dimension moves, per inventor-protocol section 3.'
    - 'Seed-replication control: three independent seed families, with the middle-regime fraction
      reported per family before pooling.'
    required_metrics:
    - middle-regime fraction with bootstrap confidence interval, per arm
    - per-class signature triple, tabulated
    - re-query determinism rate, per arm and per class
    - secret-dependence rate under pinned z, per arm and per class
    - middle-regime fraction as a function of toy dimension
    - between-seed-family variance of the middle-regime fraction
  falsification_conditions:
  - The random-function null arm reproduces the class-dependent signature pattern, showing the pattern
    comes from the generator or the measurement code.
  - The middle-regime fraction is zero at every toy dimension, meaning the two decapsulators are functionally
    indistinguishable to an output-only adversary on every enumerated class, which is a clean measured
    obstruction and a usable negative.
  - Re-query determinism is below 1.0 for the implicit arm, which voids the second claim and indicates
    a rig defect that must be fixed before any other number is reported.
  - The middle-regime fraction is identical to three decimal places across three toy dimensions, which
    under inventor-protocol section 3 is read as an artifact rather than a finding.
  - Between-seed-family variance exceeds the bootstrap interval, meaning the fraction is not stable
    enough to be a measurement.
  - The honest-ciphertext control class shows a nontrivial signature, which voids the whole rig.
  confounders:
  - 'Class-set composition: the middle-regime fraction is a fraction OF THE ENUMERATED CLASSES, so
    adding cheap classes on either side moves it arbitrarily. The class set must be frozen and reported,
    and the fraction must never be quoted without it.'
  - Toy dimension chosen so small that honest decryption failures dominate, which merges classes that
    would separate at larger dimension.
  - The failure path's use of z is an implementation choice in the rig; a rig that hashes the secret
    into the failure key when the specification would not is measuring the rig.
  - Equality comparison of returned keys is the only observable, so two distinct outputs that happen
    to collide would be scored as identical; collision probability must be reported.
  - Seed reuse across arms, which would let the null and the signal share generator artifacts; seeds
    must be drawn from disjoint streams and that must be verified.
  interpretation_limits:
  - This is a functional measurement on a toy KEM. It is not a statement about FrodoKEM, about any
    deployed implementation, or about any specification's choice of rejection mode.
  - Distinguishable to an output-only adversary is not the same as exploitable; no adversary cost
    is charged anywhere in this design and none may be inferred from it.
  - The measurement is fenced from all implementation channels by construction, so it can neither
    confirm nor contradict KN-LIT-2088 or KN-LIT-3859 in either direction.
  - The middle-regime fraction is defined only relative to a frozen class enumeration and is not a
    scheme-independent quantity.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement is linear in classes times samples
      times arms, seconds to minutes at toy parameters.
    memory_exponent: No attack memory exponent is claimed. Storage is one signature triple per class
      per arm plus the raw key outputs for equality checking, megabytes.
    best_known: The incumbent for the underlying question is the qualitative statement, recorded in
      RQ-FRODO-a2dbe2.scope.family, that FrodoKEM uses a Fujisaki-Okamoto transform with implicit
      rejection. That is a description, not a measurement, and no measured comparison of the two modes
      exists in this repository to beat.
    hidden_overhead: 'The class enumeration is the expensive and contestable part, and it is human
      work: choosing six or a dozen named malformed classes is a modelling decision that silently
      sets the headline fraction. The rig''s use of z on the failure path is a second such decision.
      Both must be written down as specification, not code comments.'
  dominated_by: 'n/a (no result claimed on any cost frontier). Pareto check actually performed: grep
    -ril frodo across ledger/ returns no evidence record at all, so this program holds zero measured
    time, memory or query rows for FrodoKEM and there is no frontier row here. Against the implementation-attack
    literature notes in the corpus (KN-LIT-2088, KN-LIT-3859) no comparison is possible or attempted,
    because this design deliberately removes the channels those notes concern.'
  sota_delta: no attack; conceptual and measurement contribution only. The deliverable is a fraction
    with a confidence interval and a per-class signature table; no cost figure is produced, no bit-security
    number moves, and nothing here is comparable to any attack.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Claim (B), that the middle-regime fraction is nonzero at the stated 0.15
    threshold: 0.55. The two decapsulators certainly differ as functions, but whether an OUTPUT-ONLY
    adversary can see the difference on an appreciable fraction of a frozen class set is genuinely
    uncertain, and my honest expectation is that the fraction is driven almost entirely by which classes
    I chose to enumerate, which is why the class set is frozen in advance. Claim (C), re-query determinism
    as a clean separating observable: 0.85, because it follows from the construction rather than from
    a measurement, and the main risk is a rig defect rather than a scientific one. Probability the
    null arm is clean, meaning the random-function stand-in shows no class-dependent pattern: 0.8.
    Probability that the dimension sweep shows movement rather than a suspiciously constant fraction:
    0.5, and I regard a constant fraction as the single most likely way this proposal turns out to
    have been measuring its own generator.'
