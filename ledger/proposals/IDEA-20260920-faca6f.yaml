idea:
  id: IDEA-20260920-faca6f
  id_allocation_provenance: >-
    Minted by the top-level session with `python3 tools/allocate_id.py --next
    idea --date 20260920` and confirmed free with `--check` on 2026-09-20.
    Not derived by scanning state. Authored by the idea-generator subagent
    dispatched against RQ-ECDLP-bc7a54; filed unmodified except for this
    identifier block.
  proposed_by: idea-generator
  proposed_at: '2026-09-20'
  status: proposed
  question_id: RQ-ECDLP-bc7a54
  added: '2026-09-20'
  title: >-
    THE HINT-FAMILY DETECTOR HAS NEVER BEEN CALIBRATED AGAINST A HINT FAMILY
    THAT ACTUALLY EXISTS: anomalous curves are a REAL (alpha = 1, polylog)
    hint family, small-embedding-degree curves are a real graded one, and
    j = 0 beta-orbits are the real constant-factor one -- build the power
    curve (minimum detectable alpha, maximum detectable omega-cost) for every
    detector this lane proposes, so that a null in this lane becomes a SCOPED
    negative instead of an unpowered one
  class: control

  claim: >-
    (A) THE GAP. RQ-ECDLP-bc7a54's decision_target (a) is "record the lane as
    closed with a MEASURED or PROVED obstruction". Every measured obstruction
    it could record is a NULL from some detector, and a null from an
    uncalibrated detector is an unpowered negative -- a fatigue report in
    instrument form, which docs/inventor-protocol.md section 4 refuses. The RQ
    already mandates ONE positive control (the j = 0 beta-orbit, which any
    claimed detector "MUST recover"), and that is the right instinct at the
    wrong scale: the beta-orbit gain is a CONSTANT FACTOR, so a detector can
    recover it and still be blind to every exponent-moving hint family.
    (B) THE ASSET NOBODY HAS USED: HINT FAMILIES THAT EXIST IN NATURE, WITH
    KNOWN alpha AND KNOWN omega-COST. All three are prime-field curves, all
    three are self-generatable at toy scale, and all three are known-true
    positives:
      P1. ANOMALOUS CURVES (#E(F_p) = p). D = E(F_p) entire, chi identically 1,
          omega = the SSSA / Smart / Satoh-Araki p-adic elliptic logarithm.
          alpha = 1, omega cost polylog. THIS IS LITERALLY A (1, polylog) HINT
          FAMILY IN THE SENSE OF THE NOTE'S DEFINITION 5, IT EXISTS, AND THE
          NOTE DOES NOT MENTION IT. A detector that does not scream on an
          anomalous curve has no power whatsoever.
      P2. SMALL EMBEDDING DEGREE (n | p^k - 1 for small k). D = E(F_p) entire,
          omega = MOV/Frey-Ruck transfer followed by index calculus in
          F_{p^k}^*. alpha = 1 with omega cost SUBEXPONENTIAL rather than
          polylog -- a GRADED positive that sweeps omega-cost while holding
          alpha fixed, which is exactly the axis a power curve needs.
      P3. j = 0 / j = 1728 (the RQ's mandated control). Constant-factor density
          gain 3 (and 2 for x(-Q) = x(Q)). The low end of the alpha axis.
      P4. COMPOSITE ORDER. Pohlig-Hellman: omega via CRT. Sweeps the group
          structure axis and is the standard nearby object.
      P5. SYNTHETIC PLANT, which is what makes it a CURVE rather than four
          points. On a random relabelling of Z/n (a literal generic group),
          plant a subset D of density n^{alpha-1} on which the label encodes
          the log recoverably by a circuit of stated depth d. Sweep alpha in
          {0.55, 0.6, 0.67, 0.75, 0.9} and d in {1, 2, 4, 8, 16}.
    (C) THE DELIVERABLE, WHICH IS A NUMBER PER DETECTOR AND NOT A VERDICT.
    For each detector the lane proposes -- the branching meter of Idea A, the
    promised-input cost curve, the ICPERF relation-yield instrument, and (named
    as a borrowed component, owned by RQ-ECDLP-4fcbd3) a coordinate-statistic
    census -- report the POWER CURVE: the smallest alpha and the largest
    omega-circuit-depth d at which the detector separates the plant from the
    matched null at a stated significance, as a function of n.
    (D) THE DISCRIMINATION, STATED BEFORE ANY RUN. Two explanations of any
    future null in this lane:
      E1 "THE LANE IS EMPTY": detectors recover P1-P4 and recover P5 down to
         alpha = 0.55 and up to d = 16; then a null is a SCOPED NEGATIVE with a
         stated detection floor and is exactly what decision_target (a) wants.
      E2 "THE DETECTORS ARE BLIND": detectors recover P3 (the constant-factor
         control the RQ mandates) but lose P5 already at alpha = 0.67 or at
         d = 4, or lose P2 at moderate embedding degree; then EVERY negative
         this lane has produced or will produce is scoped only to hint families
         below the measured floor, and the RQ's decision_target (a) is NOT
         reachable by those instruments.
    These are distinguished by the same run, and E2 is the outcome I consider
    more likely.

  mechanism: >-
    OBJECT FRAME. This is a CONTROL record and the honest declaration is that
    it introduces NO new tracked object: it measures the POWER of instruments
    that track other people's objects. Per the constraint block, an unplaceable
    candidate is returned with the obstruction named rather than dropped.
    REPRESENTATION: whatever the detector under test uses -- R1 for the
    coordinate-statistic and branching detectors, none for the generic-group
    plant P5. Declared per-arm rather than forced to one class.
    OPERATION SET SIGMA: per-arm, inherited from the detector under test. For
    P1 the operation set that matters is the FORMAL GROUP LAW on a Z_p-lift
    (this is what makes anomalous curves work and it is NOT the translation
    action on E(F_p)); for P2 it is the Weil/Tate pairing; for P3 the
    automorphism group action; for P4 translation on a composite-order group.
    Naming them is part of the deliverable, because a detector tuned to one
    Sigma will be blind to a hint family living under another -- which is the
    mechanism behind E2.
    TRICHOTOMY: the record itself is UNPLACEABLE (it tracks no object);
    obstruction named. The four natural positives place cleanly and the
    placement is part of the output: P1 is CLASS III (coordinate-dependent, via
    the p-adic lift -- family F5); P2 is CLASS III via F4 (pairing transfer);
    P3 is CLASS I / F6 (partial action of the automorphism group); P4 is the
    composite-order escape from c5d183's theorem entirely.
    LOSSY-PROJECTION TEST: NOT APPLICABLE, declared. No projection is proposed.
    OFF-LIMITS COMPONENTS USED, NAMED: F4 (pairing transfer) as P2, F5 (p-adic
    lift) as P1, F6 (automorphism orbit) as P3, F7 (preprocessing) as the
    charged-P arm. WHAT IS ADDED: none of them is used as an attack lens; each
    is used as a KNOWN-TRUE POSITIVE with a known answer, which is the one role
    a closed family is uniquely good for.
    PRICED OPEN NUMBER: not a canonicalisation cost and not an (L, b) pair --
    the priced number here is the DETECTION FLOOR (alpha_min, d_max) per
    detector per n, which is the number the lane currently does not have and
    cannot substitute for.

  novelty_status: unverified

  citations:
    - ref: "Smart, The discrete logarithm problem on elliptic curves of trace one, J. Cryptology 1999; Satoh-Araki; Semaev"
      provenance: recalled
      claim: "For #E(F_p) = p the ECDLP is solvable in polynomial time via the p-adic elliptic logarithm / formal group."
      verified_by: null
    - ref: "Menezes-Okamoto-Vanstone; Frey-Ruck"
      provenance: recalled
      claim: "Curves with small embedding degree k admit a transfer of the ECDLP to the DLP in F_{p^k}^*, solvable subexponentially."
      verified_by: null
    - ref: "Gallant-Lambert-Vanstone; Duursma-Gaudry-Morain"
      provenance: recalled
      claim: "Automorphism-quotient speedup of rho by sqrt(|Aut|), giving the factor-3 gain on j = 0."
      verified_by: null
    - ref: docs/n13-ecdlp-hint-family.md section 5 and section 8 Route 3
      provenance: internal
      claim: "Definition of an (alpha, c)-hint family; the beta-orbit factor-3 consistency check."
      verified_by: "File read in full 2026-09-20. It defines the object and does NOT observe that anomalous curves instantiate it at alpha = 1."
    - ref: RQ-ECDLP-bc7a54 constraints
      provenance: internal
      claim: "Any instrument claiming to detect a hint family MUST recover the beta-orbit gain; every claimed signal is an artifact until run against a random-relabelled null and passed a decay test in n."
      verified_by: "File read in full 2026-09-20."
    - ref: RQ-ECDLP-4fcbd3
      provenance: internal
      claim: "Owns the recognizability half: coordinate bias, DL-spectrum, character-sum ceiling, distinguishers feeding bit-security reductions."
      verified_by: "Named in the handoff and in RQ-ECDLP-bc7a54 related_questions; record itself NOT read in this session."
    - ref: IDEA-20260815-f558e4 null_object_control
      provenance: internal
      claim: "Three nulls plus a planted DL-interval positive, at partition level."
      verified_by: "File read in full 2026-09-20. Its planted positive is a PARTITION, not a hint family, and its positives carry no omega."

  assumptions:
    - >-
      Anomalous and small-embedding-degree curves are generatable at toy scale
      with prime group order in the target range. Standard (CM construction /
      point counting on candidate p), but it is the one implementation risk and
      a failure to generate them is an INFRASTRUCTURE outcome, never evidence.
    - >-
      Detectors under test are used as published by their owning records and are
      NOT retuned per arm. A detector retuned to catch the plant measures
      nothing; the tuning must be frozen before the plant is generated.
    - >-
      Off-limits components used as positives: F4, F5, F6, F7. Declared above.
    - >-
      The borrowed coordinate-statistic census belongs to RQ-ECDLP-4fcbd3 and is
      used here ONLY as a detector under test. No bias measurement, no
      DL-spectrum claim and no bit-security statement is produced or implied.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion: whether the SYNTHETIC plant
      P5 is a fair surrogate for a hypothetical natural hint family. A plant
      whose omega is recoverable by a shallow circuit on the label is easier to
      detect than a natural omega expressed in curve coordinates, so the power
      curve derived from P5 is an UPPER BOUND on real detection power, never a
      lower one. That direction of the inequality is the record's whole
      epistemic content and must be stated in every citation of it.
    baseline_embedding:
      parameter_slice: >-
        P3 at its known constant: every detector must recover the factor-3
        beta-orbit density gain on a j = 0 curve and the factor-2 sign folding
        on any curve. This is the RQ's own mandated slice and it is the floor,
        not the target.
      reproduction_check: >-
        Frozen fixture: on a generated j = 0 curve with prime-order subgroup, the
        measured useful-set density before and after beta-orbit quotienting must
        differ by EXACTLY 3 (and by exactly 2 for the sign folding), by exact
        integer counting over the enumerated subgroup. Not a ratio near 3 -- the
        integer.
    observation_collision:
      observable: >-
        The detector's output statistic together with its separation from the
        matched null.
      distinct_preimage_search: >-
        THE COLLISION IS THE FINDING WHEN IT OCCURS: a natural curve and a
        planted generic group producing the SAME detector output while having
        different ground truth (no hint family versus a planted one) is exactly
        the blindness of E2, and the record is designed to find it. Conversely a
        detector whose output on the random null collides with its output on P1
        (an anomalous curve, where a hint family certainly exists) is
        DISQUALIFIED outright, and that disqualification is cheap and comes
        first.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the detector's observable fixed and vary the forgotten structure
          -- whether a hint family is present and at what (alpha, omega-cost).
          The intrinsic invariant distinguishing the objects is the pair
          (alpha, d), and the fibre of the observable over "null" is precisely
          the set of hint families the detector cannot see.
        predicted_gain: >-
          Converts every future null in this lane from a verdict into a scoped
          negative with a stated detection floor, which is what
          docs/inventor-protocol.md section 4 requires and what the RQ's
          decision_target (a) presupposes without providing.
    quantifier_order: >-
      FOR EACH detector Delta and each n in the ladder, THERE EXIST
      (alpha_min(Delta, n), d_max(Delta, n)) such that FOR ALL plants with
      alpha >= alpha_min and depth d <= d_max, Delta separates the plant from
      the matched null at the stated significance, AND THERE EXISTS a plant at
      alpha just below alpha_min that it does not. THE FLOOR IS ALLOWED TO
      DEPEND ON THE DETECTOR AND ON n -- reporting a single n-independent floor
      would be the error, since the whole question is whether the floor improves
      or degrades as n grows.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "detector Delta, as frozen, separates planted hint families of
        density n^{alpha-1} with alpha >= alpha_min and omega-depth <= d_max
        from matched nulls at toy n in the tested ladder, and recovers P1-P4."
        IT CANNOT CERTIFY that a natural hint family above the floor would be
        detected (the P5 surrogacy caveat runs the wrong way), that no hint
        family exists, or anything at cryptographic n.
      nearby_object_control: >-
        A RANDOM ORDINARY CURVE at matched n, where no hint family is believed
        to exist and every detector must return null; and the RANDOM-RELABELLED
        Z/nZ, which is literally a generic group and where section 6 of the note
        says no hint family CAN exist. A detector firing on either has a false
        positive rate that voids its readings on everything else.
    proof_obligations:
      - claim: "P1 (anomalous) instantiates the note's Definition 5 at alpha = 1 with polylog omega"
        responsibility: correctness
      - claim: "every detector recovers the factor-3 beta-orbit and factor-2 sign constants exactly"
        responsibility: interface
      - claim: "the plant P5 is a genuine (D, chi, omega) triple with chi not taking the log as input"
        responsibility: correctness
      - claim: "detector tuning is frozen before plant generation, verified by hash commitment"
        responsibility: interface
      - claim: "P5 surrogacy bounds real detection power from ABOVE, not below"
        responsibility: scope
      - claim: "false positive rate on the random-curve and generic-group nulls"
        responsibility: success_probability

  predictions:
    - metric: Detector output on P1 (anomalous curve) versus matched random curve
      direction: higher
      minimum_effect: >-
        FORCED LARGE SEPARATION for any detector claiming hint-family detection.
        A detector that does not separate an anomalous curve -- where a
        (1, polylog) hint family provably exists -- from a random curve is
        DISQUALIFIED and its nulls elsewhere may not be cited. This is the
        cheapest and harshest gate in the whole lane.
    - metric: Recovered beta-orbit density gain on j = 0, as an exact integer ratio
      direction: higher
      minimum_effect: "FORCED EXACTLY 3 (and exactly 2 for sign folding). Anything else is an instrument failure per the RQ constraint block."
    - metric: alpha_min per detector, fitted across the n ladder
      direction: different
      minimum_effect: >-
        PREDICTED alpha_min > 0.75 for the coordinate-statistic and branching
        detectors at toy n -- i.e. BLIND at the alpha = 2/3 that matters.
        An alpha_min <= 0.6 that does not degrade with n is the strong outcome
        (E1) and licenses reading this lane's nulls as real obstructions.
    - metric: d_max per detector (maximum omega-circuit depth still detected) at fixed alpha = 2/3
      direction: different
      minimum_effect: >-
        PREDICTED d_max <= 2. A d_max >= 8 would mean detectors see hint
        families whose omega is genuinely nontrivial, which is the surprising
        and valuable outcome.
    - metric: False positive rate on the random-relabelled Z/nZ null
      direction: lower
      minimum_effect: "FORCED at or below the stated significance level. Above it, the detector's floor is meaningless and the arm is void."
    - metric: Detector output on P2 as embedding degree k increases
      direction: lower
      minimum_effect: >-
        PREDICTED MONOTONE DECREASING in k -- a graded response is the signature
        of a working instrument. A flat response across k means the detector is
        responding to something other than the omega it claims to detect, which
        is the inventor-protocol section 3 artifact tell applied to an
        instrument rather than to a signal.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE). Freeze every detector's parameters and publish
      their hashes BEFORE any plant exists. Write the plant specification: the
      exact (D, chi, omega) triple, with a written argument that chi does not
      take the logarithm as an input and that omega is evaluated from the label
      alone at the stated depth.
      STAGE 1 (NATURAL POSITIVES, CHEAP). Generate toy curves with prime-order
      subgroups: anomalous (#E = p) at p ~ 2^16 to 2^22; embedding degree
      k in {1, 2, 3, 4, 6}; j = 0 and j = 1728; a composite-order group; and
      >= 20 matched random ordinary curves. Run every frozen detector on all of
      them. Report the P1 gate PASS/FAIL first; a detector failing it is removed
      before Stage 2 and its removal is the result for that detector.
      STAGE 2 (SYNTHETIC LADDER). On random relabellings of Z/n, sweep
      alpha x depth over the stated grid with >= 20 independent plants per cell
      and >= 20 matched nulls. Report the separation statistic, its confidence
      interval, and the derived (alpha_min, d_max) per detector per n.
      STAGE 3 (THE POWER TABLE). One table per detector: rows n, columns
      (alpha_min, d_max, false positive rate, P1/P2/P3/P4 gate results). This
      table IS the deliverable and it is reusable by every future record in the
      lane.
    controls:
      - "P1 anomalous-curve gate, run first, disqualifying, known-true positive."
      - "P2 embedding-degree sweep as the graded positive; monotonicity in k is itself a gate."
      - "P3 j = 0 / j = 1728 beta-orbit, forced exact integer 3, mandated by the RQ."
      - "P4 composite order, where Pohlig-Hellman guarantees an omega exists."
      - "Random ordinary curves at matched n: forced null."
      - "Random-relabelled Z/nZ (literal generic group): forced null, and the note's section 6 says no hint family CAN exist there."
      - "Frozen-tuning hash commitment before plant generation; a detector retuned after seeing a plant is void."
      - "Decay test in n on every floor: a floor that does not move with n across a >= 6x range is reported as such."
      - "Charged-P audit: any detector that consults an enumerated table is charged as P per the RQ constraint block, and is reported in a separate column rather than compared against the others."
    required_metrics:
      - "per (detector, arm): separation statistic with confidence interval"
      - "per (detector, n): alpha_min, d_max, false positive rate"
      - "exact integer beta-orbit and sign-folding ratios recovered"
      - "P1/P2/P3/P4 gate PASS/FAIL per detector, reported individually"
      - "monotonicity of the P2 response in k"
      - "fitted trend of alpha_min against n with a confidence interval"
      - "charged P for any detector consulting an enumerated table"
      - "artifact manifest with hashes, tuning-commitment receipts, and a from-scratch rebuild receipt"

  falsification_conditions:
    - >-
      A detector fails the P1 anomalous-curve gate. That detector is
      disqualified for this lane and every null it has produced or will produce
      must be re-scoped. This is a falsification OF THE DETECTOR, which is the
      record's purpose.
    - >-
      A detector fires on the random-relabelled Z/nZ null above the stated
      significance. Its floor is meaningless and the arm is void.
    - >-
      The beta-orbit ratio is not recovered as exactly 3. Instrument failure per
      the RQ constraint block.
    - >-
      The P2 response is flat in embedding degree. The detector is not
      responding to omega-cost and its d_max column is void.
    - >-
      Plants cannot be constructed satisfying "chi does not take the log as an
      input". Then P5 is not a hint family and the synthetic ladder is withdrawn;
      the record collapses to the natural positives P1-P4, which is a weaker but
      still honest deliverable and must be reported at that strength.
    - >-
      Every detector recovers every plant down to alpha = 0.55 and d = 16. Then
      E1 holds, the lane's negatives are strong, and this record's own
      prediction was wrong -- which is the outcome that most increases the value
      of every other record here.

  confounders:
    - >-
      PLANT LEAKAGE, THE DOMINANT RISK. If the plant's chi or omega is
      inadvertently correlated with the detector's statistic through a shared
      construction (e.g. both derived from the same PRF stream), detection will
      look effortless and the power curve will be a fabrication. Independent
      keying and the tuning hash-commitment exist for this.
    - >-
      SURROGACY DIRECTION. P5 is easier than nature; the floor it produces is an
      upper bound on real power. A reader who inverts this reads the record
      backwards, and it is the most likely misuse.
    - >-
      ANOMALOUS-CURVE SPECIALNESS. P1 is detectable by simply comparing #E to p
      -- a one-line check. A detector could "pass" the gate by accident if that
      comparison leaks into its input. The detector's input must be restricted
      to what it claims to use, verified by construction.
    - >-
      TOY-SCALE FLOORS. alpha_min measured at n <= 2^22 may improve or degrade
      at cryptographic n and the ladder is far too short to settle it. The
      fitted trend is a toy-range fit and must be reported as one.
    - >-
      DETECTOR COUNT AND MULTIPLE COMPARISONS. Running many detectors on many
      arms manufactures apparent separations. The significance level must be
      corrected for the full grid, declared in advance.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, sota_delta zero on every ECDLP cost axis. This is
      instrumentation and is a BUILDING BLOCK, declared as such per search bias
      1 of agents/idea-generator.md: its priority rests on being a prerequisite
      for reading any negative in this lane, not on moving an exponent.
    - >-
      It says NOTHING about whether a hint family exists. It measures whether
      the lane could see one.
    - >-
      The borrowed coordinate-statistic census belongs to RQ-ECDLP-4fcbd3; no
      bias, DL-spectrum or bit-security claim is produced here and none may be
      read out of this record.
    - >-
      P1 and P2 are hint families on SPECIAL curves that are excluded from
      deployment precisely because they are weak. Their role is calibration
      only; no deployed parameter is an instance and nothing here suggests a
      random curve resembles them.
    - >-
      No factor base appears; KN-OPEN-020 is not engaged.
    - >-
      Toy scale throughout; claim_tier toy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SURROGACY. The detection floor (alpha_min, d_max) measured on synthetic
        plants over a random relabelling of Z/n is an UPPER BOUND on the
        detection floor for a hypothetical natural hint family on E(F_p) of the
        same (alpha, omega-cost): a natural omega expressed in curve coordinates
        is at least as hard to detect as a planted omega expressed in the label.
      rigorous_support: >-
        The rigorous ingredient is one-directional and is the reason the
        assumption is stated as a bound rather than an equality: the plant is
        constructed to be recoverable by a depth-d circuit on the label, and any
        detector that sees the natural family must in particular see a function
        of comparable circuit complexity. The classical statement it imitates is
        the standard planted-versus-null power analysis in hypothesis testing,
        where planted signals of known strength lower-bound the detectable
        strength. IT IS NOT A THEOREM and the inequality direction is the only
        part load-bearing.
      validation_plan: >-
        SAMPLE: run the four NATURAL positives P1-P4 through the same pipeline
        as the synthetic plants and locate each on the (alpha, d) grid by its
        known parameters -- anomalous at (1, polylog), embedding degree k at
        (1, subexponential in p^k), j = 0 at (constant factor, O(1)), composite
        at (1, CRT). COMPARISON: whether each natural positive is detected at
        the floor its (alpha, d) coordinates predict from the synthetic ladder.
        TAIL CHECK: the natural positive detected WORST relative to its
        predicted position -- if a natural family is systematically harder than
        its synthetic counterpart, the surrogacy gap is measured rather than
        assumed, and its size is reportable. TRANSFER ASSUMPTION, STATED AND
        UNJUSTIFIED: that a gap measured on four special-curve families
        describes a hypothetical fifth nobody has seen.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS PROPOSED OR MOVED, and this record cannot move one.
      Its costs are measurement costs: O(n) per arm for exhaustive log
      tabulation at n <= 2^22, times roughly 4 detectors x 5 alpha x 5 depth x
      20 repetitions x 5 values of n, which is hours of single-machine compute.
      The quantity it produces is a DETECTION FLOOR, not a running time.
    memory_exponent: "O(n) words for the tabulated subgroup at n <= 2^22; megabytes. No memory question arises."
    best_known: >-
      Pollard rho 0.886 sqrt(n) at O(1) memory remains the incumbent and is
      untouched. For the specific question of hint-family DETECTION POWER there
      is no incumbent instrument in this repository at all -- the nearest is
      IDEA-20260815-f558e4's planted DL-interval positive, which plants a
      PARTITION and carries no omega, so it calibrates recognizability and not
      invertibility. That gap is what this record addresses.
    hidden_overhead: >-
      No asymptotic claim, so nothing hides in an o(1). What hides instead, and
      is disclosed: the entire usefulness depends on H1's surrogacy direction,
      and the four natural positives are all SPECIAL curves whose omega
      mechanisms (p-adic lift, pairing, automorphism, CRT) may be
      unrepresentative of any hypothetical natural family on a random curve.
    tradeoff_note: >-
      Not applicable -- no algorithm, hence no time-memory tradeoff and no
      parallelisation position. The arms are embarrassingly parallel across
      (detector, arm, repetition), which is an implementation note and not a
      complexity claim. Recorded explicitly rather than omitted.

  estimated_cost:
    implementation: medium
    compute: medium
  dominated_by: null
  sota_delta:
    time: '0 -- control/calibration record; no attack exponent'
    memory: '0 -- measurement memory only'
    data_queries: '0 -- no ECDLP solve, relation, or certificate'
  recommended_priority: medium
