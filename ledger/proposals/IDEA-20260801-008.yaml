idea:
  id: IDEA-20260801-008
  question_id: RQ-MLDSA-001
  title: >-
    SelfTargetMSIS metrical audit: full-cost accounting of the module dimension
    and the hash-to-ring mapping at FIPS 204 parameters
  class: measurement
  claim: >-
    The load-bearing assumption SelfTargetMSIS, at FIPS 204 parameters, can
    be subjected to a full-cost metrical audit: the cost of the best
    known attack on SelfTargetMSIS, charging the module dimension, the
    random-oracle hash-to-ring mapping, and the algebraic structure of the
    challenge set, can be bounded above and below to within a stated factor;
    the audit either confirms that SelfTargetMSIS is at least as hard as
    the core lattice problems used in the rest of the scheme or exposes a
    structural gap where the challenge set's sparsity makes it easier.
  mechanism: >-
    SelfTargetMSIS reduces to a module-SIS instance with a structured,
    sparse challenge set. A metrical audit computes, for the FIPS 204
    parameter set, the cost of the best known module-SIS attacks against the
    full challenge set (not just the uniform-module-SIS bound), including the
    effect of the challenge sparsity on lattice-reduction-based attacks. The
    audit's deliverable is a bracketed cost with explicit assumptions about
    the hash-to-ring mapping's uniformity.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal performs a full-cost metrical audit of
        SelfTargetMSIS at FIPS 204 parameters in this program.
    conclusion: >-
      Measurement proposal; novelty unverified against full literature, which
      is the point of the audit.
  assumptions:
    - The FIPS 204 parameter set is publicly specified.
    - The best-known module-SIS attack cost model is transferable to the
      structured challenge set.
  predictions:
    - metric: selftargetmsis_vs_core_lattice_cost_ratio
      direction: different
      minimum_effect: >-
        A bracketed ratio outside [1, 2] between the SelfTargetMSIS attack
        cost and the core lattice problem cost would indicate a structural
        gap (ratio < 1) or a comfortable margin (ratio > 2).
  minimal_test:
    design: >-
      Recompute the best-known module-SIS attack cost for the FIPS 204
      parameters with the actual challenge set; bracket the cost with
      optimistic and pessimistic hash-to-ring assumptions; compare to the
      core lattice problem costs used in the scheme's security analysis.
    controls:
      - Reproduce the scheme's published security analysis as a baseline.
      - Same attack cost model applied to the uniform challenge set.
    required_metrics:
      - bracketed SelfTargetMSIS cost
      - bracketed core lattice problem costs
      - ratio and sensitivity to the challenge sparsity
  falsification_conditions:
    - Audit shows SelfTargetMSIS cost >= core lattice cost within bracket
      (assumption confirmed as tight).
    - Audit shows a bracket where SelfTargetMSIS cost < core lattice cost
      (structural gap; assumption is loose and the fault-proof boundary
      matters).
  confounders:
    - Different lattice-estimator conventions between the audit and the
      scheme's analysis.
    - Hash-to-ring mapping distribution assumptions.
  interpretation_limits:
    - Cost-model audit only; no forgery attack claimed.
    - A confirmed gap is not a break; it identifies where a break would have
      to live.
  heuristic_assumptions:
    - id: HEUR-MLDSA-METRIC-1
      statement: >-
        Best-known module-SIS attack costs are continuously and predictably
        modeled by the standard lattice-estimator framework at FIPS 204
        dimensions.
      rigorous_support: >-
        Established lattice-estimator methodology; the audit's bracket is
        designed to be insensitive to estimator variations.
      validation_plan: Sensitivity analysis over estimator parameters;
        a bracket that survives estimator variation is the validation.
  target_complexity:
    time_exponent: n/a (cost audit)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a bracketed full-cost ratio that
    tightens or exposes the load-bearing assumption.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
