idea:
  id: IDEA-20260816-50e103
  question_id: RQ-ASCON-2dfd8b
  added: '2026-08-16'
  title: Quantify the new IV constants as an object by measuring, over ALL pairs of constants differing
    in the IV word rather than over the two specific values this program cannot pin, the round depth
    at which the induced initial-state difference reaches full diffusion, so that IV-dependence of
    an exploited property becomes a depth threshold instead of a judgement
  class: measurement
  claim: '(A) The change of IV constants between the submission and the standard is reported but its
    values are not pinned here, and a record that waited for them would produce nothing. The change
    can nonetheless be made into a measurable object by quantifying over the whole class: for every
    pair of distinct constants placed in the IV word, the two initialization states differ in a known
    set of positions, and the question is at what round depth that difference has diffused into a
    state difference indistinguishable, by declared statistics, from a random difference of full weight.
    (B) Call that depth T. Any property exploited at a depth greater than T inside the twelve-round
    initialization is, in the precise sense the measurement defines, insensitive to WHICH constants
    were chosen; any property exploited at depth at most T is IV-specific and must be re-derived rather
    than re-indexed when the constants change. The deliverable is T, measured with its dispersion
    over the constant class, plus the statistic used to declare saturation. (C) NOT CLAIMED: that
    any published property is exploited at any particular depth -- this program cannot read published
    properties and asserts nothing about them. NOT CLAIMED: that diffusion of a difference implies
    absence of structure; full-weight diffusion is a necessary condition for the difference to be
    uninformative, never a sufficient one, and the record says so in those words. NOT CLAIMED: any
    attack, distinguisher, or security consequence. (D) The measurement is worthless without its null:
    the identical statistic runs over pairs of RANDOM initial states at matched Hamming distance,
    and the IV-pair arm must not saturate LATER than the matched-distance random arm for the reading
    insensitive-above-T to hold. If IV pairs saturate systematically later, that is itself the interesting
    measured outcome and it is reported as such rather than smoothed away. (E) The whole design is
    deliberately constructed so that the unavailability of the specific standardized constants does
    not block it: the result is a statement about a class that the specific pair belongs to, and pinning
    the pair later resolves the record in one step instead of invalidating it.'
  mechanism: 'Stage one pins a permutation implementation and validates it against declared test vectors.
    Stage two fixes the geometry: which state positions constitute the IV word, swept over the plausible
    placements if not pinned. Stage three draws pairs of distinct constants for that word -- exhaustively
    at low Hamming distance, sampled at higher distance -- forms the two initial states with all other
    positions held at a declared value, and runs both through r rounds for r from 0 to 12, recording
    the difference state at each depth. Stage four computes, at each depth, three saturation statistics
    on the difference: Hamming weight relative to half the state, per-position difference-propagation
    probability estimated over many pairs, and the rank of the matrix of difference vectors collected
    across pairs. Saturation depth T is the smallest r at which all three statistics lie inside declared
    tolerance bands. Stage five runs the identical pipeline on matched-Hamming-distance random state
    pairs, and on a null permutation with a randomly drawn S-box, in the same invocation. Stage six
    reports T with its distribution over the constant class, per placement, alongside both null curves.
    Refutation of the reading is a random-pair arm saturating strictly later than the IV arm, or a
    null-permutation arm saturating at the same depth as the signal.'
  novelty_status: unverified
  novelty_screen:
    method: 'Shared repository screen: grep -ril ascon across ledger/proposals, ledger/hypotheses,
      ledger/evidence and experiments; grep -il over ledger/proposals/*.yaml for round constant, IV
      constant, avalanche, diffusion, algebraic degree and division property (the diffusion-family
      hit list truncated at head -20 and is reported as partial). Read in full or in part: ledger/questions/RQ-ASCON-2dfd8b.yaml
      in full, ledger/goals/GOAL-ASCON-001.yaml first 60 lines, docs/inventor-protocol.md sections
      1-8, ledger/proposals/IDEA-20260807-c4f1fc.yaml first 40 lines, headers of knowledge/techniques/KN-TECH-066.md,
      KN-TECH-073.md and KN-TECH-074.md.'
    results: 'grep -il for round constant and IV constant over ledger/proposals/*.yaml returned ZERO
      files: no proposal in this repository treats a constant schedule or an initialization constant
      as a tracked object. grep -ril ascon returned no ledger record. The avalanche/diffusion/degree
      grep returned twenty filenames before truncation (including IDEA-20260805-01dfba, IDEA-20260805-33a11e,
      IDEA-20260805-4bd60c, IDEA-20260805-5b8f95, IDEA-20260805-62359f, IDEA-20260805-72ec9a, IDEA-20260805-78d9bd,
      IDEA-20260805-8053e1, IDEA-20260805-86e431, IDEA-20260805-947f67, IDEA-20260805-b9047c, IDEA-20260805-c8c0d4,
      IDEA-20260805-f2fc33, IDEA-20260807-63056d, IDEA-20260807-7270d1, IDEA-20260807-7e16ac, IDEA-20260807-a6fb2a,
      IDEA-20260808-4c309d), whose filenames were seen and contents not read; the session briefing
      states the AES r=5..7 measured effects with their null controls are an established internal
      result, and several of those filenames likely belong to that lane. A Coordinator must read them
      before approval and that is a declared derivation gap.'
    verdict: 'UNVERIFIED. No external literature is accessible here and nothing in this record asserts
      what it contains. Claimed NEW relative to this repository: quantifying an unpinned constant
      change over the WHOLE class of constant pairs so that the unavailability of the specific values
      is designed around rather than blocking, and converting IV-dependence into a measured depth
      threshold T with an explicitly matched-Hamming-distance random-pair null. ASSEMBLED FROM KNOWN
      PARTS: difference-diffusion and avalanche measurement is elementary and this repository already
      contains an AES lane measuring related effects with null controls; the null-in-the-same-invocation
      requirement is docs/inventor-protocol.md section 3; the insistence that a necessary condition
      is not a sufficient one is AGENTS.md rule 4 scoping applied to a statistic.'
  object_first_candidate:
    tracked_object: 'The difference trajectory of a constant pair: the sequence of XOR differences
      between the two initialization states, one per round depth from 0 to 12, together with the three
      saturation statistics computed on it. What is followed is the DIFFERENCE and its statistics,
      not either state.'
    lossiness: 'Lossy. Discarded: both absolute states entirely, and at the statistic level nearly
      all of the difference itself -- the reported object per depth is a weight, a per-position propagation
      rate and a rank, not the 320-bit difference. The discard is compatible with the target operation
      because the linear layer acts on differences exactly as it acts on states, and the substitution
      layer acts on differences with a transition probability that the per-position statistic is designed
      to estimate; so the retained statistics still propagate, probabilistically rather than deterministically,
      and the record states that downgrade explicitly. The projection is far from invertible: the
      three statistics do not determine the difference, and many differences share them, which is
      exactly why saturation of the statistics is only a necessary condition for the difference being
      uninformative.'
    propagation: 'One round acts on the difference by: the substitution layer mapping the difference
      through the S-box''s differential behaviour, which spreads a low-weight difference across a
      bit slice with input-dependent probability; the linear diffusion layer mapping it deterministically
      through per-word rotations that couple positions across the state; and the round constant, which
      is added identically to both states and therefore CANCELS in the difference, which is the crucial
      structural point -- the constants affect the difference trajectory only through the nonlinear
      layer''s dependence on absolute state values, not directly. That indirect dependence is exactly
      what the measurement is sensitive to, and it is why an IV pair can behave differently from a
      random pair at the same Hamming distance.'
    survival_score: 'Reported directly as T, the smallest round depth at which all three saturation
      statistics fall inside declared tolerance bands, together with its distribution over the constant
      class and over the plausible IV-word placements. The structure survives below T and dissolves
      above it in the precise sense the statistics define, and the record refuses to claim more than
      that: above T the difference is statistically indistinguishable by these three statistics, which
      is a bounded statement about three statistics and not about all statistics.'
  null_object_control: PAIRS OF RANDOM INITIAL STATES at MATCHED HAMMING DISTANCE, drawn from a recorded
    seed and run through the IDENTICAL pipeline in the SAME invocation, plus a NULL PERMUTATION arm
    (identical linear layer and constants, randomly drawn S-box) run on the same IV pairs. For the
    reading insensitive-above-T to hold, the IV arm's saturation depth must be at most the matched-distance
    random arm's; if IV pairs saturate systematically later, the reading is inverted and that is the
    finding. For the measurement to reflect the design rather than the state geometry, the null-permutation
    arm must saturate at a different depth than the signal; if the two coincide, the record is a controlled
    null and T is a property of the state size and linear layer, not of the design.
  discriminated_from:
  - The AES r=5..7 measured effects with their null controls, named in this session's briefing as
    an established internal result not to be re-derived. That work measures a keyed block cipher at
    specific reduced round counts with chosen-plaintext access; this measures difference diffusion
    from a CONSTANT PAIR inside an unkeyed permutation's initialization, quantified over a class of
    constants rather than at a fixed instance, and reuses no AES number.
  - KN-TECH-066 (rebound, message modification, internal differentials). That technique seeks differences
    that survive with high probability; this measures the depth at which a specific structured difference
    stops being distinguishable from a random one, and seeks nothing.
  - The eighteen-plus proposals matched by the avalanche/diffusion/degree grep, seen by filename only
    and not read. None can concern Ascon since grep -ril ascon returned no ledger record; a Coordinator
    must confirm none already frames constant-pair difference diffusion as a class-quantified threshold,
    and that is a declared derivation gap.
  - A standard strict-avalanche-criterion test. SAC measures single-bit input flips against output
    bit bias; this measures a structured multi-bit difference arising from a specific specification
    change, against a Hamming-distance-matched random control, and reports a depth threshold rather
    than a bias table.
  - The third record in this batch, which measures zero-sum depth over rate-confined cubes. That object
    is an affine subspace and its XOR-sum; this object is a single difference trajectory and its diffusion
    statistics. They share an implementation and nothing else.
  assumptions:
  - A permutation implementation can be pinned and test-vector-validated; without it the measurement
    describes an invented function.
  - The IV word's position in the state can be pinned, or the plausible placements enumerated and
    swept, so that the constant class is well defined.
  - Three saturation statistics -- relative Hamming weight, per-position propagation rate and difference-vector
    rank -- jointly suffice to declare a difference statistically ordinary for this purpose; the record
    concedes this is a choice and that other statistics could disagree.
  - Round constants cancel in the difference, so any IV-versus-random effect must come through the
    nonlinear layer; this is asserted structurally and is checked in the run by confirming the difference
    trajectory is unchanged when all round constants are set to zero.
  - Exhaustive coverage at low Hamming distance plus sampling at high distance represents the constant
    class adequately; the sampling boundary is declared and the unenumerated region named.
  predictions:
  - metric: saturation depth T for IV-word constant pairs minus T for Hamming-distance-matched random
      state pairs
    direction: different
    minimum_effect: 'no numeric pre-commitment. Refusing is deliberate: the honest expectation is
      a difference of zero, which would make the IV change insensitive above T, but pre-committing
      zero would turn a null result into an apparent confirmation, so both signs are declared reportable
      in advance'
  - metric: saturation depth T for the pinned design minus T for the random-S-box null permutation
    direction: different
    minimum_effect: at least 1 round at some tested IV-word placement; if T coincides across all placements
      the record is a controlled null and T is not interpreted as a property of the design
  - metric: T as a function of the Hamming distance of the constant pair
    direction: lower
    minimum_effect: T must be non-increasing in Hamming distance, a forced structural expectation;
      a systematic increase is a strong sign of an instrument defect and halts interpretation
  - metric: change in the difference trajectory when all round constants are set to zero
    direction: different
    minimum_effect: 'forced value: the difference at every depth must be affected only through the
      nonlinear layer, so setting constants to zero must leave the depth-1 difference exactly unchanged;
      any change at depth 1 indicates the implementation adds constants asymmetrically and is a bug'
  minimal_test:
    design: 'Pin and validate a permutation. Fix all non-IV positions to a declared value. Enumerate
      all constant pairs at Hamming distance 1 and 2 in the IV word and sample 10000 pairs at each
      distance from 3 to 32. For each pair, run both states through r rounds for r in 0..12 and record
      the XOR difference. Compute per depth: relative Hamming weight, per-position propagation rate
      aggregated across pairs, and the GF(2) rank of the collected difference matrix. Declare T as
      the smallest depth where all three lie inside declared bands. In the SAME invocation, repeat
      for Hamming-distance-matched random state pairs and for the random-S-box null permutation. Also
      repeat once with all round constants zeroed as a structural check. Cost: a few million permutation
      evaluations, minutes in numpy. The discriminating output is three T values -- signal, matched-random,
      null-permutation -- plus T as a function of distance.'
    controls:
    - Matched-Hamming-distance random state pair arm, identical pipeline, same invocation, seeds recorded.
    - Random-S-box null permutation arm on the same IV pairs, isolating design from geometry.
    - Zeroed-round-constant structural check, confirming constants cancel in the difference as the
      propagation analysis asserts.
    - Depth-0 control, where the difference must equal the constant XOR exactly and nothing else.
    - IV-word placement sweep, so a T value cannot be an artifact of one assumed placement.
    - Fixed-remainder sweep at three values of the non-IV positions, so T is not an artifact of one
      background state.
    required_metrics:
    - saturation depth T per arm, per IV-word placement, per background state
    - relative Hamming weight of the difference per depth, with dispersion across pairs
    - per-position difference propagation rate per depth
    - GF(2) rank of the collected difference matrix per depth
    - T as a function of constant-pair Hamming distance
    - zeroed-constant check outcome at depth 1
    - pairs evaluated, seeds, wall-clock
  falsification_conditions:
  - The random-S-box null permutation yields the same T as the signal at every placement, making the
    measurement a controlled null about state size and linear layer.
  - T increases systematically with constant-pair Hamming distance, indicating an instrument defect.
  - The depth-0 control returns anything other than the exact constant XOR.
  - Zeroing the round constants changes the depth-1 difference, showing the implementation adds constants
    asymmetrically.
  - T varies qualitatively across the three background states, showing the threshold is a background
    artifact rather than a class property.
  - The three saturation statistics disagree about T by more than one round across the class, showing
    the saturation definition is not stable enough to carry a threshold.
  - The permutation fails a declared test vector.
  confounders:
  - Holding all non-IV positions at a fixed declared value is itself a strong choice; a degenerate
    background (all zeros) can accelerate or retard diffusion, which is why three backgrounds are
    swept and the all-zero one is labelled.
  - Hamming-distance matching between IV pairs and random pairs does not match their POSITION structure
    -- IV differences are confined to one word while random differences are spread -- so part of any
    observed gap is geometric rather than constant-specific; a third arm with random differences confined
    to the same word is required to separate these and is included in the placement sweep.
  - The per-position propagation rate is estimated from a finite pair sample and its tolerance band
    must be wide enough to survive sampling noise, which risks declaring saturation early.
  - Rank saturates trivially once the number of pairs exceeds the state size, so the rank statistic
    must be computed at a fixed pair count per depth or it will always saturate.
  - If the IV word placement is wrong, the entire measurement is about a different set of positions
    with the same name.
  interpretation_limits:
  - T is a threshold defined by three chosen statistics; a difference statistically ordinary under
    these three may be highly structured under a fourth, and full-weight diffusion is necessary but
    not sufficient for a difference to be uninformative.
  - Nothing here says any published property is exploited above or below T, because this program cannot
    read published properties.
  - A finding that IV pairs saturate at the same depth as matched random pairs is NOT evidence that
    the IV change is safe; it is evidence that these statistics do not distinguish them.
  - All results are conditional on the IV-word placement, the background state and the pinned implementation,
    and are reported per condition rather than aggregated.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs pairs times depths permutation
      evaluations, a few million.
    memory_exponent: No attack exponent is claimed. Memory is the difference matrix at a fixed pair
      count per depth, a few hundred kilobytes.
    best_known: 'The incumbent is the unstated assumption that changing initialization constants cannot
      matter to existing analysis because constants cancel in differences. Within this repository
      there is no competitor whatsoever: the grep for round constant and IV constant over ledger/proposals
      returned zero files.'
    hidden_overhead: 'Two hidden costs. First, the IV-word placement: if it is not pinned, the run
      matrix multiplies by the number of plausible placements and the deliverable becomes a table
      rather than a number, which is more honest and considerably more work to read. Second, the tolerance
      bands defining saturation: choosing them is a statistical judgement that no compute resolves,
      and a band chosen after seeing the curves would silently manufacture T.'
  dominated_by: 'n/a (no result claimed). Pareto check made across all three axes explicitly: time
    -- no attack time is produced and no frontier row is claimed; memory -- the measurement is memory-trivial
    and produces no attack memory figure; data/queries -- zero oracle queries, all evaluation offline.
    Each axis considered rather than the field defaulted.'
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative delta is a measured
    depth threshold T with dispersion over a declared constant class and two null arms, replacing
    an assumption currently carried without any number, in a repository that holds zero records treating
    an initialization constant as an object.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Separately: that a permutation implementation can be pinned and validated
    here, about 0.35, limited by primary-text access -- though this record is unusual in that the
    IV VALUES need not be pinned, only the word placement. That the zeroed-constant structural check
    passes, above 0.95, since it is a near-certain consequence of how constants are added and mostly
    checks the implementation. That the random-S-box null separates from the signal in T, about 0.45;
    diffusion depth is heavily driven by the linear layer, so a controlled null is a genuine and likely
    outcome. That IV pairs and matched random pairs give the same T, about 0.7, which would be the
    unexciting but useful answer. That the three saturation statistics agree on T to within one round,
    about 0.6, which is the main technical risk to the deliverable being a single number rather than
    a muddle.'
