idea:
  id: IDEA-20260816-130f15
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: For a small AIR over a toy prime field, exhaustively evaluate the quotient identity at every
    out-of-domain point against a constructed family of false traces, and report the measured false-acceptance
    rate as a function of constraint degree and trace length against the Schwartz-Zippel value the
    arithmetization budget assumes
  class: measurement
  claim: '(A) An algebraic intermediate representation check reduces to: a false execution trace induces
    a constraint polynomial that does not vanish on the trace domain, the prover supplies a purported
    quotient, and the verifier tests the identity at one out-of-domain point. The soundness of that
    single test is charged in every arithmetization budget as a Schwartz-Zippel term, degree over
    field size, with the degree being the composed constraint degree times the trace length minus
    the domain size. (B) For a small AIR with a named transition constraint of degree d, a trace of
    length n over a multiplicative subgroup of F_p, and a constructed family of false traces, the
    false-acceptance probability of the single out-of-domain check is exactly computable by evaluating
    the identity at every one of the p minus n candidate points, and the deliverable is that measured
    rate per (d, n, p, false-trace family), compared as a ratio against the budgeted degree-over-field-size
    term. (C) The interesting quantity is not whether the measured rate is below the bound, which
    it must be, but the shape of the residual: which false traces sit near the ceiling, whether the
    near-ceiling traces share an algebraic feature such as a constraint polynomial that splits over
    the field, and whether raising the constraint degree at fixed trace length moves the measured
    rate proportionally or sublinearly. (D) NOT CLAIMED: no attack on any arithmetization, no claim
    that any AIR-based system is unsound, no claim about deployed, third-party or standardized proof
    systems, none of which is examined here; no claim that the constructed false-trace family exhausts
    adversary behaviour, only that it is enumerated; and no security consequence, since a measured
    rate below a budgeted bound is a confirmation of the accounting at toy parameters and nothing
    more.'
  mechanism: 'STAGE A: fix the AIR. One register, one transition constraint of the form next value
    minus f(current value) equal to zero with f a fixed low-degree polynomial, plus one boundary constraint,
    over F_p with the trace domain a multiplicative subgroup of order n. STAGE B: construct false
    traces. Start from an honest trace and corrupt one or more cells; the corrupted trace violates
    the transition constraint at a known set of rows, which fixes the vanishing structure of the constraint
    polynomial. Enumerate the corruption patterns: single-cell, adjacent-pair, and a structured family
    designed to make the composition polynomial split. STAGE C: form the quotient. Divide the constraint
    polynomial by the domain vanishing polynomial; for a false trace the division leaves a nonzero
    remainder, so the prover must supply a purported quotient that is not the true quotient. Model
    the strongest available prover as the one that supplies the polynomial minimising the number of
    out-of-domain points at which the identity fails, and compute that minimiser exactly by interpolation
    over a named degree budget. STAGE D: evaluate exhaustively. For every point z in F_p outside the
    trace domain, test the identity, and count acceptances. Divide by p minus n to obtain the measured
    false-acceptance rate. STAGE E: sweep d and n, tabulate the measured rate against the budgeted
    degree-over-field-size term, and record the ratio. STAGE F: run the null arm below and record
    whether the same pipeline sees the same rate on a random polynomial with no trace structure at
    all.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for zerofier, quotient polynomial, arithmetization,
      constraint degree, AIR, R1CS and Schwartz-Zippel. Read the titles of all thirteen RQ-WFS-e776b6
      proposals from a PyYAML scan of ledger/proposals/. Read ledger/questions/RQ-WFS-e776b6.yaml
      including its four named targets. Consulted the bucket directive recording that the portfolio
      survey found zero contracts anywhere on arithmetization primitives.
    results: The string zerofier returned ZERO hits across ledger/proposals/ and ledger/hypotheses/.
      The string quotient polynomial hits IDEA-20260816-0f7694, IDEA-20260808-d07cd4, IDEA-20260805-bd8339
      and IDEA-20260816-41ab94, none of which is on RQ-WFS and which from their ids belong to other
      buckets. The string AIR matched many records only as a substring of unrelated words. The string
      constraint degree hits IDEA-20260731-005 and IDEA-20260805-b9047c, which concern a FAEST AES
      constraint system and a separate lane. Among RQ-WFS proposals none touches quotient identity
      checking, out-of-domain evaluation, or trace corruption.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; the quotient identity, the
      vanishing polynomial and the Schwartz-Zippel accounting are standard and treated as known. What
      is claimed new is only internal: this repository holds no record that evaluates an AIR quotient
      identity at every out-of-domain point of a toy field against an enumerated false-trace family,
      and no record that reports the measured-versus-budgeted ratio as its deliverable. The parts
      assembled are known: AIR construction, polynomial division, exhaustive evaluation.'
  object_first_candidate:
    tracked_object: 'The failure set F(T) of a false trace T: the subset of F_p outside the trace
      domain at which the quotient identity fails for the prover-optimal purported quotient. Acceptance
      is exactly non-membership in F(T), and every soundness quantity in this proposal is the complement
      density of F(T).'
    lossiness: 'Genuinely lossy. The full state is the trace, n field elements plus all the algebraic
      relations among them, of which there are p to the n possibilities; F(T) keeps only a subset
      of F_p, collapsing all traces with the same failure locus into one object. The discard is compatible
      with the target operation because the verifier touches the trace only through one evaluation
      of the composed identity at one point, so any trace feature that does not change where the identity
      fails cannot change acceptance. The retained set propagates deterministically: composing constraints
      multiplies polynomials and the failure locus of the composition is contained in the union of
      the individual loci, which is exactly the accounting step in question.'
    propagation: 'One step of the target operation is one out-of-domain evaluation. On the tracked
      object it acts as: draw z uniformly from F_p minus the trace domain and reject exactly when
      z lies in F(T). Adding a second constraint to the AIR replaces F(T) by the union of the two
      failure sets, so the rejection probability is the density of a union rather than a sum, and
      the gap between the union density and the summed budget is the measurable slack. Batching constraints
      with a random combiner instead intersects the loci, which connects this record to the batching
      object in a way both records make explicit rather than share.'
    survival_score: 'The object survives while the failure locus is computable, which holds exactly
      for any p and n with p minus n evaluations affordable, so up to p about 2 to the 20 with n up
      to 1024 on one machine within budget. It survives the composition of a small number of constraints
      and the degree growth from composing f with itself. It dissolves in two named places: when the
      prover''s purported quotient is allowed to have degree comparable to p, so that the minimising
      interpolation is no longer unique and F(T) is not determined by the trace; and when the AIR
      has more registers than the enumeration can cover, at which point the false-trace family becomes
      a sample and the measured rate becomes a lower bound on the attainable acceptance rate.'
  null_object_control: 'NULL OBJECT: a random polynomial pair of the same degrees, with no trace structure
    and no honest execution behind it, pushed through the identical failure-locus computation and
    the identical exhaustive evaluation in the same invocation. The null must show a failure-set density
    consistent with a random nonzero polynomial of the same degree, that is, an acceptance rate near
    degree over field size with the same counting error, and must NOT show the near-ceiling clustering
    the signal arm is looking for. If the null clusters the same way, the clustering is a property
    of degree arithmetic rather than of trace corruption, and the record closes as a controlled null.
    A second null is the HONEST trace, whose failure set must be empty so that acceptance is exactly
    one, confirming the pipeline does not reject valid executions.'
  discriminated_from:
  - IDEA-20260809-7ca867 measures a grinding curve for a reference low-degree-test protocol. Grinding
    is an adversary budget spent on retrying challenge derivation; this record spends no budget and
    measures the single-shot geometry of one identity check.
  - IDEA-20260809-792aca builds a reference sumcheck argument to enumerate transcript omission classes.
    The transform there is deliberately weakened; here the transform is not involved at all and the
    object is the arithmetization layer beneath it.
  - IDEA-20260731-005 concerns a solving-degree census over a FAEST AES constraint system, an algebraic
    cryptanalysis measurement on a different question. This record does not solve any system; it evaluates
    one identity at every point.
  - The batching record in this same set, whose object is the root set of a univariate error polynomial
    under a single challenge. Here the object is the failure locus of a quotient identity for a corrupted
    trace, the degree comes from constraint composition rather than from claim count, and the domain
    is punctured by the trace subgroup.
  - 'A generic statement of the Schwartz-Zippel bound: an upper bound on the acceptance rate. This
    record measures which corrupted traces approach it and how the approach depends on constraint
    degree, which the bound does not say.'
  assumptions:
  - The prover-optimal purported quotient is the interpolant that minimises the failure locus within
    the named degree budget, and that minimiser is computable; provers outside that degree budget
    are excluded by scope and would only raise the measured rate.
  - The trace domain is a multiplicative subgroup of order n dividing p minus 1, so the vanishing
    polynomial is x to the n minus one and division is exact and cheap.
  - The constructed false-trace family, comprising all single-cell and adjacent-pair corruptions plus
    a structured splitting family, contains the worst case for the reported cells, and where it does
    not the reported rate is a lower bound and is labelled so.
  - The out-of-domain point is sampled uniformly from F_p minus the trace domain; reduction bias in
    that sampling is the object of a sibling record and is excluded here.
  - Exact field arithmetic on Python integers throughout, with no floating point in any load-bearing
    path.
  predictions:
  - metric: measured false-acceptance rate for single-cell corruptions at named (d, n, p)
    direction: lower
    minimum_effect: 'forced value: at most the composed degree divided by (p minus n); exceeding it
      is an instrument fault, since a nonzero polynomial cannot vanish more often than its degree
      allows'
  - metric: ratio of the maximum measured rate over the false-trace family to the budgeted degree-over-field-size
      term
    direction: lower
    minimum_effect: 0.5
  - metric: scaling of the maximum measured rate in constraint degree d at fixed n and p
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a coefficient: whether attainment scales proportionally
      with d depends on whether the composed polynomial can be made to split, which is precisely the
      unknown this run measures, so pre-committing a number would be inventing the answer'
  - metric: honest-trace null acceptance rate
    direction: different
    minimum_effect: 'forced value: exactly 1.000 at every out-of-domain point; anything else voids
      the run'
  minimal_test:
    design: 'One script, under an hour. Take p equal to 65537, trace domain the subgroup of order
      n equal to 64, transition constraint next minus current squared minus a constant, so d equal
      to 2, composed degree 128. Build one honest trace, then enumerate all 64 single-cell corruptions
      times a set of 256 corruption values, giving 16384 false traces, plus 4032 adjacent-pair patterns
      at one corruption value each, plus a structured family of 512 traces built to make the composition
      split. For each false trace compute the prover-optimal purported quotient by interpolation within
      the degree budget and then evaluate the identity at all 65473 out-of-domain points, counting
      acceptances. Record the maximum, the mean, and the argmax trace. Run the honest-trace null and
      the random-polynomial null through the identical evaluator in the same invocation. The discriminating
      output is two numbers per cell: the maximum measured acceptance rate and its ratio to the budgeted
      term. If the maximum sits far below the budget across the whole family, the measured obstruction
      is that this AIR shape cannot force attainment, and that is the reportable result.'
    controls:
    - Honest-trace null with an empty failure locus, requiring acceptance at every out-of-domain point.
    - Random-polynomial null of matched degrees through the identical evaluator in the same invocation.
    - Degenerate control with the constant-zero constraint, where every trace is honest and acceptance
      must be identically one.
    - Degenerate control with a constraint that no trace satisfies, whose failure locus must have
      density at most the degree over field size and must be nonempty.
    - Independent recomputation of each failure locus by polynomial factorisation rather than by exhaustive
      evaluation, with a required zero disagreement count.
    - Two field sizes and two trace lengths so that the reported ratio is not a coincidence of one
      modulus or one domain.
    required_metrics:
    - maximum measured false-acceptance rate per (p, n, d, family)
    - mean and median measured rate over the family
    - argmax false trace and the size of its failure locus
    - budgeted degree-over-field-size term and the measured-to-budget ratio
    - honest-trace acceptance rate
    - random-polynomial null acceptance distribution
    - number of false traces enumerated and wall time
  falsification_conditions:
  - Any false trace shows an acceptance count exceeding the composed degree, which is arithmetically
    impossible and voids the instrument.
  - The honest-trace null does not accept at every out-of-domain point.
  - The random-polynomial null and the signal arm produce indistinguishable maxima and clustering,
    showing the measurement reads degree arithmetic and not trace structure; the record then closes
    as a controlled null.
  - The maximum measured rate sits below half the budgeted term at every cell, falsifying the conjecture
    that attainment is reachable for this AIR shape and closing with the named obstruction that corruption
    cannot force the composed polynomial to split.
  - Factorisation-based loci disagree with exhaustive evaluation on any trace.
  - The measured-to-budget ratio moves non-monotonically with the field size, indicating the budget
    term was mis-specified for one of the cells.
  confounders:
  - The purported-quotient degree budget silently determines the prover's power; a budget set too
    low understates the acceptance rate and reads as a security margin that is an artifact of the
    model.
  - Puncturing the domain changes the denominator from p to p minus n, which at small p is a several-percent
    effect and would be misread as slack if the budget term used p.
  - Corruption values chosen from a small set may all lie in a subgroup, correlating the induced polynomials
    and biasing the family toward or away from splitting.
  - Trace length n dividing p minus one is required for the cheap vanishing polynomial, which restricts
    the (p, n) grid and could confound domain effects with modulus effects.
  - Counting roots with multiplicity would inflate the failure locus without changing acceptance,
    corrupting the structural comparison between arms.
  interpretation_limits:
  - Every number is scoped to the named AIR with one register and one transition constraint, the named
    p, n and d, and the named false-trace families; multi-register AIRs and cryptographic field sizes
    are untested.
  - A measured rate below the budgeted term is a confirmation of the accounting at these parameters
    and is not evidence of extra security margin at any other parameters.
  - Where only a structured family is enumerated the maximum is a lower bound on the attainable rate.
  - No statement about any deployed, third-party or standardized arithmetization or proof system follows
    from any outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. Measurement cost is O(|family| times p) field operations,
      about 2 to the 31 at the named parameters, reducible by batch evaluation.
    memory_exponent: No attack memory exponent is claimed. Memory is O(p) for an evaluation table
      plus O(n) per trace.
    best_known: The incumbent is the standard arithmetization soundness accounting, namely that a
      single out-of-domain quotient identity check has soundness error at most the composed degree
      divided by the number of candidate points. This record does not beat that accounting; it measures
      attainment against it for a named AIR at toy parameters.
    hidden_overhead: 'The human cost dominates: constructing a false-trace family that is adversarially
      meaningful rather than merely large, and fixing a purported-quotient degree budget that does
      not silently define away the strongest prover. In lower-order terms hide the domain puncturing
      correction, the requirement that n divide p minus one, and the interpolation cost, which is
      the wall-time bottleneck while contributing no headline number.'
  dominated_by: n/a (no result claimed). No solve, forgery or cost improvement is proposed, so there
    is no time, memory or query frontier row against which to compare; stating null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a measured-to-budget
    ratio at named toy parameters and carries no cost comparison to any algorithm.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part A, that the failure locus and the prover-optimal quotient are computable
    and that exhaustive evaluation runs at the named parameters: about 0.85, the risk being interpolation
    cost at the larger cells. Part B, that the maximum measured rate lands within a factor of two
    of the budgeted term for at least one family: about 0.45, since forcing a composed polynomial
    to split by corrupting a trace is not obviously achievable and may be the real obstruction. Part
    C, that the near-ceiling traces share a nameable algebraic feature: about 0.3, and this is the
    speculative part; if it fails the record still delivers the measured ratio. Part D, that the resulting
    instrument is reusable for multi-register AIRs without redesign: about 0.4, since the enumeration
    strategy is what breaks first.'
