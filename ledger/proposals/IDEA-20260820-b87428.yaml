  predictions:
    - id: P1
      statement: >-
        On exhaustive toy fibres, sigma is identical across every declared pair
        of equivalent ideal encodings, with zero invariance violations.
      metric: representation-invariance violations
      threshold: exactly 0
      test_boundary: all encoding moves in toy fibres of size <= 4096
    - id: P2
      statement: >-
        In a planted syndrome channel with bit crossover at most 0.10, median
        decoded list size is at most 0.25 of the quotient fibre by q = 256 and
        planted-class coverage is at least 0.95.
      metric: quotient-list fraction and planted-class coverage
      threshold: <= 0.25 and >= 0.95 respectively
      test_boundary: preregistered planted channel
    - id: P3
      statement: >-
        Under genuine-simulator transcripts, syndrome rank and list contraction
        do not differ from representation-matched randomized syndromes at
        family-wise alpha 0.05 and any effect decays under stronger randomization.
      metric: corrected null difference and decay curve
      threshold: no rejection at family-wise alpha 0.05
      test_boundary: matched true-simulator null
  controls:
    - genuine-simulator null with representation multiplicities held fixed
    - planted positive with crossover varied continuously from 0.50 to 0.10
    - exhaustive invariance audit under all declared encoding generators
    - encoding-dependent fake syndrome that the invariance audit must reject
    - randomized parity checks preserving dimensions and representation counts
    - nearby public curve with matched fibre size but independently permuted conversions
    - public-curve reproduction for every decoded ideal
  falsification_conditions:
    - any syndrome changes under a declared representation equivalence
    - null contraction survives representation-matched randomization
    - planted-class coverage misses 0.95 at the stated crossover boundary
    - any output witness fails public-curve reproduction
  confounders:
    - encoding multiplicity can look like syndrome information
    - decoder tuning on evaluation transcripts
    - incomplete enumeration of conversion-fibre equivalences
    - rank computed over the wrong coefficient ring
  interpretation_limits:
    - existence of a production-relevant invariant syndrome is unverified
    - a toy list decoder is not a secret-key recovery algorithm
    - no SSI hard-problem or asymptotic claim
    - no verified GRH support is supplied by KN-TECH-058
  heuristic_assumptions:
    - the finite fibre and representation relation are complete on the tested scope
    - the public syndrome is computable without hidden signer state
    - planted channel calibration is separate from evaluation
  target_complexity:
    baseline: enumerate every equivalence class in the finite fibre
    proposed: syndrome list decoding; no exponent improvement claimed
    success_probability: measured class coverage under the declared channel
  cost_model:
    time: fibre enumeration, syndrome evaluation, and list decoding
    memory: quotient representatives, parity checks, and output witnesses
    data: q public transcripts plus independent calibration samples
    preprocessing: equivalence generators, conversion tables, and decoder setup
    oracle_access: public transcripts only; no timing or secret-state observations
    verification: exhaustive invariance, randomized-syndrome null, and curve reproduction
  proof_search_map:
    baseline_reproduction: reproduce exhaustive compatible-class enumeration before decoding
    observation_collision_search: enumerate distinct classes sharing the full syndrome and retain all
    quantifier_order: fix fibre, equivalence, syndrome, code, and q before transcript evaluation
    method_ceiling: construct a zero-rank syndrome family forcing the full quotient list
    nearby_object_control: apply the decoder to dimension-matched random parity checks
  nearest_neighbors:
