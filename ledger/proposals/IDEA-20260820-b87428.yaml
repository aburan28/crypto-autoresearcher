idea:
  id: IDEA-20260820-b87428
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Representation-invariant conversion-fibre syndrome list recovery
  class: algebraic-statistical algorithm proposal
  claim: >-
    If public transcript features induce a well-defined representation-invariant
    syndrome on a finite ideal-conversion fibre, a list decoder may return every
    compatible ideal with a public-curve witness. The proposal first tests
    invariance and simulator-null behavior; it asserts neither a real syndrome
    nor a recovery result.
  corrects: IDEA-20260820-4467d2
  supersedes: null
  correction: >-
    Preserves the predecessor's conversion-fibre syndrome, representation
    invariance, and public ideal witnesses. It adds verified_by for every
    internal and KB citation and removes the unsupported GRH attachment.
    KN-TECH-058 is used only for its inherited and unverified reduction caveats.
  mechanism: >-
    Enumerate a finite conversion fibre F(E_A) with an explicit equivalence
    relation for alternate encodings of the same ideal. Define a public syndrome
    sigma(T, I) whose value must be unchanged under every declared encoding move.
    Aggregate q transcript syndromes into a parity-check vector and list-decode
    the equivalence classes compatible with it. Lift each class to one or more
    ideal witnesses and verify that each witness reproduces the public curve.
    Invariance is an obligation checked before any list-size observation.
  novelty_status: unverified
  status: proposed
  source_refs:
