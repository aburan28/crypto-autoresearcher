  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Fold the batch into the factor base: relations among factor-base points as
    one multi-solution descended system, priced by an exact trivial-solution
    count, a group-testing bound and a measured degree slope
  class: mechanism
  claim: >-
    (A) A relation sum of t+1 factor-base points = O (S_{t+1}(x_0..x_t) = 0, all
    x_i in V) is a valid index-calculus relation: homogeneous in the unknown logs,
    with two ordinary decompositions fixing scalar and logarithm. With x_0 in a
    coset of an s-dimensional subspace the closing block is affine in x_0
    (IDEA-20261017-5f29b6), so 2^s per-target systems become ONE system with s
    extra Boolean unknowns. (B) EXACT COUNTS. Primitive solutions number about
    c_t|V|^{t+1}/N (c_t depends on t only). For t+1 even the pair-cancelling family
    has 3|V|^2-2|V| members at t+1 = 4 and at least (t)!!|V|^{(t+1)/2} in general;
    at the size needed for |V| relations, |V| >= (N/c_t)^{1/t}, any procedure
    costing at least the variety's size is at least N^{(t+1)/(2t)} > N^{1/2}. For
    t+1 odd trivial families are lower order; the live arms are t = 2, 4, 6 with
    linear algebra |V|^2 = N^{2/t}. (C) SOLVER-INDEPENDENT BOUND. If a test
    returns only "any solution in this coset", adaptive group testing needs at
    least 2^s H_2(p) tests, p about 1/t!; folding gains at most 1/H_2(p) = 1.54,
    4.0, 14.4, 65.9 for t = 3..6: constant in N, superpolynomial in t. (D) MEASURED.
    Slope sigma = (D_reg(s=l) - D_reg(0))/l of the Macaulay Hilbert gap, real
    versus a degree-histogram-matched random system.
  mechanism: >-
    PAIR. R1 (F_2 bit coordinates of x), Sigma = permutations of the t+1 summands
    and sign changes (KR-IC-8b9daa). Trichotomy: Class I partial-action; the
    branching event is existence of a decomposition, priced by the counts above.
    LOSSY-PROJECTION TEST. The object is the Hilbert gap g(D,s) = (cols-rank_D) - S,
    S the exact Boolean solution count; it discards the solutions, is invariant
    under Sigma, and many ideals share one profile. FACTOR-BASE ESCAPE. Explicit
    F_2-subspace, inside the scoped-out class of KN-OPEN-020; what changes is the
    target class (targets become factor-base elements). Stage: relation
    decomposition. KN-FIND-007 calls this a harvest-all solve: yield is geometry
    invariant, the cost of finding is the open number.
  novelty_status: unverified
  citations:
    - ref: KN-FIND-007
      provenance: internal
      claim: Mean yield binom(B+m-1,m)/N is exact for every base; harvest-all yield is geometry invariant.
      verified_by: Read in full 2026-10-17.
    - ref: IDEA-20260829-66a876
      provenance: internal
      claim: Explicit k = 2 table costs N^{2/3} time and memory, matching the t+1 = 4 trivial bound.
      verified_by: Read in full 2026-10-17.
  predictions:
    - metric: exact solution count of S_4 over V^4 minus (3|V|^2-2|V|), cells (n,l) = (8,3), (9,3)
      direction: different
      minimum_effect: Residual inside a Poisson 99 percent band around c_4|V|^4/N; a count below the identity falsifies it.
    - metric: sigma_real - sigma_null, cells (n,l,t) = (8,4,2), (8,2,4), stretch (12,3,4)
      direction: lower
      minimum_effect: "<= -0.25 in two of three cells"
  minimal_test:
    design: >-
      Stage 0 zero compute: group-testing and trivial-count tables. Stage 1 exact
      enumeration by group arithmetic. Stage 2 Macaulay Hilbert gap for s in 0..l,
      D <= 5, 3 coset seeds, real and null; SAT and UNSAT arms reported apart.
    controls:
      - Degree-histogram-matched random system with a planted root.
      - Distinctness arm with inequation variables removing trivial solutions.
      - Planted positive, a toy ideal whose regularity grows by one per freed bit.
    required_metrics: [S exact, trivial count, primitive count, D_reg(s), sigma, rank_D, peak RSS]
  falsification_conditions:
    - Exact trivial count differs from 3|V|^2-2|V| at t+1 = 4.
    - sigma_real >= sigma_null in all cells (folding is generic hybrid guessing).
    - Planted positive not recovered (instrument defect).
  confounders:
    - Tiny V saturates D_reg at v; report D_reg/v too.
    - Guard skips are failed_infrastructure.
  interpretation_limits:
    - Toy binary cells, Macaulay gap not F4 solving degree. No exponent claimed; the exponent is the solve exponent gamma, unmeasured here.
  heuristic_assumptions:
    - id: H1
      statement: The number of primitive solutions in V^{t+1} is Poisson with mean c_t|V|^{t+1}/N.
      rigorous_support: KN-FIND-007 exact first moment; imitates the birthday and occupancy model.
      validation_plan: Exhaustive counts on 12 toy curves at (8,3) and (9,3); Poisson band and variance-to-mean ratio, worst curve reported.
    - id: H2
      statement: D_reg(s) of the folded real system is no flatter than the matched null.
      rigorous_support: Generic hybrid optimality, fix s variables then solve (Bardet-Faugere-Salvy-Spaenlehauer, recalled, not opened).
      validation_plan: Slope per cell, 3 seeds, 20 matched null draws; tail by the flattest null.
  target_complexity:
    time_exponent: "Not an attack. Even t+1: at least N^{(t+1)/(2t)}, above rho. Odd t+1: set by the unmeasured solve exponent gamma and N^{2/t}; fold gain at most 1/H_2(1/t!)."
    memory_exponent: "O(|V|) relations; Macaulay matrix poly(n^D) bits; no table."
    best_known: Pollard rho 0.886*sqrt(N) (KR-RHO-13bf67); Gaudry q^{2-2/n} (KR-IC-46d822).
    hidden_overhead: Output enumeration of trivial solutions; inequation variables raise degree.
  dominated_by: Pollard rho on time for every even t+1; not checked further.
  sota_delta: None; deliverable is the obstruction number and the slope.
