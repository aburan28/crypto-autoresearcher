idea:
  id: IDEA-20261006-89e226
  question_id: RQ-VOLC-f6253b
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The Vélu codomain of the unique rational 2-isogeny has three
    rational roots of its cubic
  class: measurement
  claim: >-
    Let E be y^2 = x^3 + x + 1. Let p be the smallest prime with
    50 < p < 200 such that E is nonsingular over F_p, the trace of
    Frobenius is not divisible by p, and the cubic x^3 + x + 1 has
    exactly one root in F_p. Let T be the corresponding rational
    2-torsion point, and let E' be the codomain of the Vélu isogeny
    with kernel {O, T}. The claim is that the short-Weierstrass
    cubic of E' has exactly three roots in F_p. If no such prime
    exists in the interval, the cell is unmeasured. If the root
    count on E' is not 3, the claim is false. Equality of the two
    point counts is an instrument check, not the claim. A change in
    j is not the claim. No discrete logarithm is transferred, and
    the generic exponent 1/2 is unchanged.
  mechanism: >-
    OBJECT FRAME. Representation: the j-invariant and the cubic
    x^3 + A x + B. Operation set: Vélu's formulas on the unique
    rational kernel of degree 2. The source is predicted to sit
    where exactly one rational 2-isogeny exists, and that isogeny
    is predicted to land on a curve with full rational 2-torsion,
    which is three roots of the cubic. The projection keeps the
    root count of the codomain and discards the kernel polynomial.
    This is a level marker in the 2-isogeny graph, not a walk that
    changes the group order.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Over a finite field, isogenous curves have the same number
        of points. That identity is the instrument check. The opened
        row does not state the codomain's rational-root count.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic discrete logarithm needs Ω(√N) group operations.
        One 2-isogeny does not change that exponent.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m gives a sqrt(m) constant
        on rho. This cell does not walk on automorphism orbits.
      verified_by: coordinator, 2026-10-06, knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
  assumptions:
    - A prime p in (50, 200) exists with the curve ordinary and the cubic having exactly one root in F_p. If the sweep finds none, the cell is unmeasured.
    - Vélu's formulas, applied to a rational kernel, produce a curve over F_p. A codomain not defined over F_p voids the cell.
    - The point counts of E and E' agree. Disagreement voids the cell and is not a root count.
  proof_search_map:
    not_applicable_reason: >-
      One codomain root count. Not a theorem about volcano depth
      changing an ECDLP exponent.
  predictions:
    - metric: codomain_rational_root_count
      direction: different
      minimum_effect: the codomain cubic has exactly 3 roots in F_p, against 1 root on the source
  minimal_test:
    design: >-
      Sweep primes from 53 upward. At the first prime that passes,
      compute the unique rational root, apply Vélu, reduce the
      codomain to short Weierstrass, and count roots of its cubic
      in F_p. Recompute the isogeny with a second implementation
      of Vélu's formulas. Compare the two point counts.
    controls:
      - The two point counts agree. Disagreement voids the cell.
      - The source cubic has exactly one root. A source with another root count is not this cell.
      - A null curve at the same p whose cubic has three rational roots is scored the same way, and the claim is not made for a source that already has three roots.
    required_metrics:
      - the prime p
      - the source root count, required to be 1
      - the codomain root count
      - whether the two point counts agree
  falsification_conditions:
    - >-
      The prime exists, the source has exactly one rational root,
      the point counts agree, and the codomain root count is not 3.
    - The two Vélu implementations disagree, or the point counts disagree. The cell is void.
  confounders:
    - A prime that is skipped because the curve is supersingular is not a root count.
    - Full rational 2-torsion on the source is a different volcano position and is not evidence about this cell.
    - Characteristic 2 and characteristic 3 are outside the sweep.
  interpretation_limits:
    - One curve, one prime below 200. No statement about cryptographic primes.
    - A codomain root count of 3 does not move the generic exponent 1/2.
    - Point-count equality is the instrument, not a new isogeny theorem.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A short-Weierstrass curve over F_p with exactly one rational
        root of its cubic has a unique rational 2-isogeny, and the
        Vélu codomain has three rational roots. The model imitated
        is the 2-isogeny graph's descending edge from a curve with
        one rational kernel, not a random-matrix model.
      rigorous_support: >-
        Vélu's formulas are finite. KR-RHO-755e35, opened, gives
        equal point counts for isogenous curves over a finite field.
        It does not give the codomain root count. The count 3 is a
        prediction, not a theorem this session derived.
      validation_plan:
        sampling: the single smallest prime in (50, 200) that passes the source test
        comparison: the codomain root count against 3
        tail_check: >-
          If the sweep finds no prime, record unmeasured. Do not
          lower 50 or raise 200 after seeing a root count.
        parameters: one curve model, primes from 53 to 199, ell = 2. No transfer to ell > 2.
  target_complexity:
    time_exponent: >-
      Unchanged. Opened KR-RHO-13bf67 gives the generic exponent
      1/2. One 2-isogeny does not move it.
    memory_exponent: >-
      Unchanged. Two cubics and one kernel of size 2.
    best_known: >-
      KR-RHO-13bf67, opened, Ω(√N). KR-RHO-755e35, opened, equal
      point counts across an isogeny. KR-RHO-0528e7, opened, a
      sqrt(m) automorphism constant that this cell does not use.
    hidden_overhead: >-
      No o(1) attack term. Vélu's arithmetic is a constant number
      of field operations at this size.
    tradeoff_note: >-
      Not a time-memory tradeoff. The output is one root count.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-RHO-0528e7
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          The row equates point counts of isogenous curves. This
          record's predicted quantity is a root count of 3 on the
          codomain against 1 on the source, a gap of 2. The row
          does not state that gap.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The row's exponent is 1/2. This measurement changes that
          exponent by 0.
    searched:
      corpus_grep:
        - exactly three roots in October proposals on origin/main
        - IDEA-20261006-783062 keeps the point count and changes j, which this record does not restate
      web: []
      blocked:
        - No web fetch in this session.
  dominated_by: >-
    Checked KR-RHO-755e35, KR-RHO-13bf67, and KR-RHO-0528e7, all
    opened. KR-RHO-755e35 dominates any reading of the isogeny as a
