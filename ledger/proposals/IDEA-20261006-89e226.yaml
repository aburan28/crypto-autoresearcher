  sota_delta: >-
    Predicted codomain rational-root count 3 against a source count
    of 1, gap 2, one prime below 200. Exponent gap versus opened
    KR-RHO-13bf67: 0. Point-count gap versus opened KR-RHO-755e35:
    0, because equality is the instrument check.
