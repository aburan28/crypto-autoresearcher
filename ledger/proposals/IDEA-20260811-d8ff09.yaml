idea:
  id: IDEA-20260811-d8ff09
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  axis: A5
  claim_tier: toy
  title: >-
    The ordinary shadow of the p^{1/3+o(1)} argument exists, is p^{1/4}, and has been known
    for twenty years: commutativity removes BRANCHING (isogenies of degree <= X drop from
    X^2 to X^{1+o(1)}) and removes SLACK (the rigorous short-target bound is Minkowski's
    sqrt(|D|), which is exactly the generic distance, whereas Aubry-Oyono-Vincent's
    (p/2)^{1/3} beats it), and the two cancel to sqrt(h) exactly -- plus the sharper fact
    that OneEnd is FREE over F_p because E^{(p)} = E
  class: mechanism
  claim: |-
    (A) THE TRIVIALISATION, FIRST, BECAUSE IT IS THE SHARPEST PART. The exemplar's main
    theorem solves OneEnd: given supersingular E/F_{p^2}, find a non-scalar endomorphism.
    Its whole architecture is aimed at finding a separable isogeny E -> E^{(p)}, where
    E^{(p)} is the Frobenius conjugate. FOR AN ORDINARY CURVE E/F_p WITH COEFFICIENTS IN
    F_p, E^{(p)} = E, because the conjugate is obtained by raising the coefficients to the
    p-th power and a^p = a for a in F_p. [fact] The "separable isogeny to the conjugate" is
    therefore an endomorphism of E, and the Frobenius endomorphism pi -- which is handed to
    the algorithm for free, satisfies pi^2 - t*pi + p = 0, and is non-scalar whenever
    t^2 != 4p -- already solves OneEnd in O(1). The exemplar's target problem is VACUOUS in
    the ordinary prime-field setting. Any attempt to "port the p^{1/3} algorithm to ordinary
    curves" is therefore not hard, it is empty, and the first deliverable of this record is
    to say so before anyone spends a batch on it.

    (B) WHAT THE ORDINARY ANALOGUE OF THE HARD PROBLEM ACTUALLY IS, AND ITS COST. The
    non-vacuous analogue is the ISOGENY problem inside one ordinary F_p-isogeny class: given
    E, E' with End_{F_p} = O, find a connecting isogeny. Two structural quantities decide
    its cost, and this record computes both and compares them line by line against the
    exemplar's.
      (K1) BRANCHING. Lemma 3.2 of the exemplar bounds the table by
      #L(E, X, B) <= Psi(X, B) * X * (log X + 2), resting on "the number of cyclic isogenies
      of degree x from E is at most x(log x + 2)" -- i.e. roughly x isogenies per degree x,
      the ell+1 branching of the supersingular ell-isogeny graph. Over F_p, the F_p-RATIONAL
      cyclic isogenies of degree x from E with the endomorphism ring preserved correspond to
      invertible O-ideals of norm x, of which there are d(x) = x^{o(1)} on average, not x.
      [fact, from the correspondence between horizontal isogenies and invertible ideals;
      the descending/ascending edges at primes dividing the conductor are a bounded
      correction, treated in `confounders`.] Consequently the number of distinct codomains
      reachable by F_p-rational isogenies of degree <= X grows like X^{1+o(1)}, not
      X^{2+o(1)}, and saturates at the size of the whole F_p-isogeny class,
      sum over conductors of h(O') = p^{1/2+o(1)}, against p/12 vertices for the
      supersingular graph.
      (K2) SLACK. The exemplar's enabling external ingredient (Theorem 1.5, Aubry-Oyono-
      Vincent) is that a target at distance deg <= (p/2)^{1/3} always exists, which is SHORT
      relative to the generic distance p^{1/2} implied by a graph of size p. The ordinary
      analogue of that ingredient is Minkowski's bound: every ideal class of O contains an
      integral ideal of norm at most (2/pi)*sqrt(|D_E|), i.e. p^{1/2+o(1)}. [fact,
      classical.] But the class itself has size h = p^{1/2+o(1)}, so the ordinary bound sits
      EXACTLY at the generic distance and carries no slack at all.
      THE ARITHMETIC. With a degree bound Y on the target and smoothness splitting at
      X = Y^{1/2}, the meet-in-the-middle table has size (number of isogenies of degree
      <= X) = X^{c} where c = 2 supersingular and c = 1 ordinary.
        supersingular: Y = p^{1/3}, X = p^{1/6}, table = X^2 = p^{1/3}  (beats generic p^{1/2})
        ordinary:      Y = p^{1/2}, X = p^{1/4}, table = X^1 = p^{1/4}  (EQUALS generic sqrt(h) = p^{1/4})
      So the ordinary shadow of the exemplar exists, is fully computable, and reproduces
      EXACTLY the long-known sqrt(h) = p^{1/4} algorithm for the ordinary isogeny problem
      [recall-confident: Galbraith; Galbraith-Hess-Smart; Galbraith-Stolbunov; NOT
      re-verified this session]. The gain is zero, and it is zero because (K1) and (K2)
      cancel any advantage rather than because either alone is fatal.

    (C) THE ANSWER TO "DOES COMMUTATIVITY KILL IT", STATED PRECISELY AND AGAINST THE
    INTUITIVE READING. Commutativity does NOT make the isogeny problem harder -- it makes it
    EASIER (p^{1/4} versus p^{1/3}), because it shrinks the graph from p vertices to
    p^{1/2}. What commutativity kills is the RELEVANCE: by decomposition facts T1/T2,
    transport along an isogeny preserves k exactly, so an ordinary isogeny algorithm at any
    exponent whatsoever changes no ECDLP cost. The honest sentence is therefore not
    "commutativity kills the method" but:
        THE METHOD SURVIVES COMMUTATIVITY, LANDS ON A PROBLEM THAT IS ALREADY EASIER THAN
        THE ONE IT WAS BUILT FOR, AND THAT PROBLEM IS SEVERED FROM THE ECDLP BY TRANSPORT.
    Additionally, the rank collapse is worth recording because it is the reason (K2) has no
    slack: the trace-zero sublattice of the quaternionic Hom(E, E^{(p)}) has RANK 3, while
    the trace-zero sublattice of an imaginary quadratic order O of discriminant D_E has
    RANK 1, generated by sqrt(D_E) with minimal norm |D_E|; and the minimal degree of ANY
    non-scalar element a + b*omega of O is at least |D_E|/4. [fact, derived in `mechanism`.]
    A rank-1 lattice has no Minkowski slack to exploit: its shortest vector is its generator.

    (D) FORWARD GUIDANCE -- WHAT WOULD HAVE TO BE TRUE FOR AN ORDINARY EXPONENT RESULT.
    Exactly one of the two quantities must change:
      (i) a rigorous bound placing a USEFUL target at distance p^{theta} with theta < 1/2
          inside an ordinary class (a "short vector" statement strictly better than
          Minkowski for the specific ideal class that matters), or
      (ii) a branching mechanism restoring c > 1 -- which requires leaving the F_p-rational
          horizontal graph, e.g. working with F_{p^2}-rational or non-horizontal isogenies,
          at which point the endomorphism ring changes and the class-torsor structure is
          lost.
    Both are named here so that a future proposal in this campaign must say which one it
    claims. Neither is claimed by this record.
  mechanism: |-
    DERIVATION OF THE RANK AND MINIMAL-NORM STATEMENTS IN (C).
    Let O be the order of discriminant D = D_E < 0, O = Z[omega] with omega = (D + sqrt(D))/2
    and Tr(omega) = D, N(omega) = (D^2 - D)/4.
    Trace-zero elements: Tr(a + b*omega) = 2a + bD = 0. Writing b = 2c forces a = -cD and the
    element is -cD + 2c(D + sqrt(D))/2 = c*sqrt(D). Hence the trace-zero sublattice is
    Z*sqrt(D), of RANK 1, with N(c*sqrt(D)) = c^2 |D|, minimal nonzero norm |D|.
    Minimal non-scalar norm: N(a + b*omega) = a^2 + abD + b^2(D^2 - D)/4 = (a + bD/2)^2 +
    b^2|D|/4 >= b^2|D|/4 >= |D|/4 for b != 0. So no non-scalar endomorphism of an ordinary
    E/F_p has degree below |D_E|/4, and for a generic ordinary curve |D_E| ~ 4p - t^2 ~ p.
    Contrast with the quaternionic case, where the trace-zero part of a maximal order has
    rank 3 and Minkowski's theorem in rank 3 is what makes short non-scalar endomorphisms
    plentiful; the exemplar's Theorem 1.5 is a sharpening of that phenomenon for the specific
    lattice Hom(E, E^{(p)}). [The rank-3 identification is recorded in this corpus by
    IDEA-20260805-250e50 and IDEA-20260805-e7ee4a; this record supplies only the rank-1
    ordinary counterpart and the consequence for slack.]

    WHY (K1) IS A COUNTING FACT AND NOT AN IMPRESSION. Horizontal F_p-rational isogenies from
    E preserving O correspond to invertible O-ideals, and the number of invertible O-ideals of
    norm at most X is asymptotically proportional to X (the ideal-counting theorem), so the
    per-degree count is the divisor-like x^{o(1)} rather than the supersingular ~x. The
    measurement in `minimal_test` is designed to expose exactly this exponent, since it is
    the single number the whole comparison turns on.
  why_not_a_renamed_known_approach: |-
    Nearest known result: the sqrt(h) = p^{1/4} algorithm for the ordinary isogeny problem
    [recall-confident, Galbraith / Galbraith-Hess-Smart / Galbraith-Stolbunov, NOT
    re-verified]. This record does not propose it, improve it, or claim it. What it adds is
    the DERIVATION THAT IT IS THE EXEMPLAR'S SHADOW, with the two structural quantities (K1)
    branching exponent and (K2) short-target slack isolated as the reason the exponent lands
    at 1/4 rather than anywhere else, plus the observation in (A) that the exemplar's actual
    target problem is vacuous over F_p. Nearest in-corpus records: IDEA-20260805-e7ee4a uses
    the ordinary case as a NEARBY-OBJECT CONTROL for a lattice criterion ("End has rank 2,
    not 4, and the criterion must be seen to fail there") but does not compute the ordinary
    exponent or the branching count; IDEA-20260805-250e50 analyses the exemplar's threshold
    identity on the supersingular side only. This record is the ordinary-side complement of
    both, and it is a mechanism record rather than a review record.
  resource_label: >-
    R3 (End(E) as a ring: ideal counting, trace-zero lattice rank, Minkowski) and R4 (the
    isogeny graph as the class-group Cayley graph and its size). The whole argument is about
    curves and lattices; no endomorphism is applied to a point of G at any step, so the
    H-ENDO-001 filter is passed on its face.
  admissibility: admissible
  predictions:
  - observable: branching exponent of the F_p-rational isogeny graph
    metric: >-
      c := d log(#{distinct codomains of F_p-rational isogenies from E of degree <= X}) /
      d log X, measured over a toy ordinary class for X well below h(O)
    predicted: >-
      c = 1 + o(1) for the ordinary F_p-rational graph. FORCED VALUE, derived before
      measuring. A measured c significantly above 1 (say >= 1.3 at two consecutive decades of
      X) falsifies (K1) and reopens the whole comparison.
  - observable: the same exponent in the matched supersingular null
    metric: >-
      the identical statistic computed on a supersingular graph over F_{p^2} at matched p
    predicted: >-
      c = 2 + o(1) until saturation near p/12. BOTH halves are required: a pipeline
      returning c = 1 in both cases is measuring its own implementation, and no conclusion
      may be drawn from the ordinary number alone.
  - observable: saturation level
    metric: >-
      the value of #{distinct codomains} at which growth stops, compared against the total
      class size sum over conductors of h(O')
    predicted: >-
      exact agreement with the enumerated class size, in 100% of instances. Saturation above
      the class size is an implementation error; saturation well below it means the walk did
      not mix and the exponent measurement is invalid.
  - observable: minimal degree of a non-scalar endomorphism
    metric: >-
      over sampled ordinary curves, min over non-scalar alpha in End_{F_p}(E) of deg(alpha),
      compared against the derived bound |D_E|/4
    predicted: >-
      the derived bound is attained or nearly attained, and in every case the value is
      Theta(p) for curves with f_E small -- never p^{1/3} or anything sublinear. A single
      ordinary curve with a non-scalar endomorphism of degree below |D_E|/4 falsifies the
      derivation in `mechanism`.
  minimal_test:
    design: |-
      Toy, single machine, order of one CPU-hour, no attack.
      STAGE 0 (zero compute, HARD GATE): re-derive (A) and the rank-1 computation. If
        E^{(p)} != E for some F_p-rational model in the implementation, the model is not
        F_p-rational and the setup is wrong.
      STAGE 1 (minutes): choose p of 18-24 bits and an ordinary trace t with h(O) between
        50 and 500. Enumerate the entire F_p-isogeny class by ell-isogeny walks for the
        small split ell, recording the conductor level of each curve. Report the class size.
      STAGE 2 (minutes): for a fixed E in the class and for X on a geometric grid well below
        h, count distinct codomains of F_p-rational isogenies of degree <= X, and fit c.
      STAGE 3 (minutes): repeat Stage 2 verbatim on a supersingular graph over F_{p^2} at
        matched p. Same code path, different input.
      STAGE 4 (minutes): sample ordinary curves and compute the minimal non-scalar
        endomorphism degree from the order's norm form; compare against |D_E|/4.
      STAGE 5 (zero compute): write the two-row exponent table of (B) with the measured c
        substituted for the derived one, and state whether the p^{1/4} conclusion survives.
    controls:
    - >-
      NULL OBJECT (matched shape): a random 2-regular graph on the same number of vertices as
      the ordinary class, and a random (ell+1)-regular graph on the same number of vertices
      as the supersingular graph. The counting statistic must return c = 1 and c = 2
      respectively on these, showing that c measures REGULARITY and saturation and nothing
      curve-specific. If the random graphs do not reproduce the exponents, c is not the
      quantity the argument needs and the derivation must be restated in terms of whatever
      it does measure.
    - >-
      PLANTED SIGNAL: an ordinary class with a prime ell dividing the conductor f, where
      descending isogenies give ell + 1 rational ell-neighbours at the crater. The measured
      c must rise locally there and then fall back once the volcano is exhausted. If it does
      not, the instrument is insensitive to branching and its c = 1 result is uninformative.
    - >-
      INSTRUMENT NULL: X = 1, where the count must be exactly 1 (the curve itself).
    - >-
      SUPERSINGULAR-OVER-F_p CONTROL: supersingular curves defined over F_p have commutative
      F_p-rational endomorphism rings and an F_p-rational graph of size ~sqrt(p) (the
      Delfs-Galbraith setting). The measured c there must match the ORDINARY value, not the
      F_{p^2} value. This separates "commutativity" from "ordinariness" as the causal
      variable, which no other control in the design does.
    required_metrics:
    - class size, per instance, with the conductor stratification
    - c and its fit residuals, ordinary / supersingular-over-F_{p^2} / supersingular-over-F_p / both random nulls
    - saturation level versus enumerated class size
    - minimal non-scalar endomorphism degree versus |D_E|/4
  controls:
  - >-
    See minimal_test.controls. The load-bearing one is the SUPERSINGULAR-OVER-F_p arm: it is
    the only control that varies commutativity while holding the characteristic and the
    field of definition fixed, and without it the record's causal claim ("commutativity
    removes branching") is a correlation between two things that also differ in every other
    respect.
  confounders:
  - >-
    Primes ell dividing the conductor f give ell + 1 rational ell-isogenies at the crater
    (descending edges), so the per-degree count is NOT uniformly x^{o(1)}. The correction is
    bounded because the total class size is still p^{1/2+o(1)}, but a class chosen with a
    large smooth conductor will show inflated local branching, and the instance choice must
    be reported.
  - >-
    Small toy classes saturate almost immediately, leaving too few decades of X to fit c.
    h(O) between 50 and 500 is specified for this reason, and any instance with fewer than
    two decades below saturation must be excluded before fitting, not after seeing the fit.
  - >-
    Counting isogenies versus counting codomains differ by the number of curves with extra
    automorphisms and by ideal classes coinciding. Both counts must be reported; the
    argument uses codomains.
  - >-
    Reading (C) as "commutativity makes ECDLP harder". It does not: it makes the ISOGENY
    problem easier and severs it from ECDLP. The two statements must not be merged.
  falsification_conditions:
  - >-
    Measured c >= 1.3 for the ordinary F_p-rational graph over two consecutive decades of X,
    with the random-graph nulls behaving as predicted. (K1) is wrong; the p^{1/4}
    arithmetic in (B) is void and the comparison must be redone.
  - >-
    Saturation above the enumerated class size, or a codomain count exceeding the class size
    at any X. Implementation error; the run halts and nothing is reported.
  - >-
    An ordinary curve with a non-scalar endomorphism of degree below |D_E|/4. The
    `mechanism` derivation is wrong and the rank-1 claim in (C) is void.
  - >-
    The supersingular-over-F_p arm returning the F_{p^2} exponent. The causal attribution to
    commutativity fails and must be restated as an attribution to the field of definition.
  interpretation_limits:
  - >-
    Toy scale only, p <= 24 bits, ordinary classes with the stated conductor conditions. The
    exponents in (B) are DERIVATIONS; the measurement checks the branching input to them at
    toy size only and cannot check the p^{1/4} conclusion at any size.
  - >-
    (A) is a statement about the exemplar's problem OneEnd over F_p, not about the ordinary
    ENDOMORPHISM RING problem (computing the conductor f_E), which is a genuinely
    non-trivial problem with its own subexponential literature and is untouched here.
  - >-
    Nothing here is an attack, and by T1/T2 nothing here could be one: even a hypothetical
    ordinary isogeny algorithm at exponent 0 would leave every ECDLP cost unchanged.
  assumptions:
  - E/F_p ordinary, p > 3, given by a model with coefficients in F_p, End_{F_p}(E) = O of discriminant D_E.
  - >-
    'Horizontal F_p-rational isogenies preserving O correspond to invertible O-ideals, and
    #{invertible O-ideals of norm <= X} = Theta(X) [recall-confident: classical ideal
    counting plus the Deuring/Kohel correspondence; NOT re-verified this session].'
  - >-
    'Minkowski: every ideal class of an imaginary quadratic order contains an integral ideal
    of norm at most (2/pi)*sqrt(|D|) [recall-confident, classical; NOT re-verified].'
  - >-
    'h(O) = |D|^{1/2 + o(1)} [recall-confident: Brauer-Siegel and the class number formula;
    the o(1) hides the GRH-conditional lower bound and is honestly a weak point of the
    p^{1/2} class-size statement, flagged here rather than in a footnote].'
  - >-
    'The exemplar''s Theorem 1.5 (Aubry-Oyono-Vincent) and Lemma 3.2 are quoted from the
    frozen text inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, lines 81 and 133-135, READ THIS
    SESSION.'
  heuristic_assumptions:
  - id: HA-1
    statement: >-
      For an ordinary class sampled by choosing p and t with |t| < 2 sqrt(p), the number of
      distinct codomains reachable by F_p-rational isogenies of degree at most X from a fixed
      E behaves, for 1 << X << h(O), like a constant times X, with the constant depending on
      D_E only through the residue of the Dedekind zeta function of O.
    rigorous_support: >-
      The ideal-counting theorem gives #{invertible O-ideals of norm <= X} ~ rho_O * X
      rigorously. The assumption is only that distinct ideals of small norm give distinct
      CODOMAINS, i.e. that the map (ideals of norm <= X) -> Cl(O) is close to injective while
      X << h, which is the ordinary analogue of "a random walk has not yet collided".
    distribution_imitated: >-
      The birthday/collision heuristic for a nearly uniform map into a set of size h, the same
      shape as the standard assumption behind sqrt(h) claw-finding in the ordinary isogeny
      literature.
    validation_plan: >-
      Directly measured by Stage 2 of the minimal test: report both #{ideals of norm <= X}
      and #{distinct codomains}, and plot their ratio. Sampled parameters: p of 18-24 bits,
      h(O) in [50, 500], at least 20 classes, X on a geometric grid with at least two decades
      below saturation. Compare the observed collision onset against the birthday prediction
      X ~ sqrt(h). TRANSFER ASSUMPTION, STATED: nothing in this validation extends to
      cryptographic p, where the class cannot be enumerated; the record makes no crypto-scale
      claim.
    tail_checks: >-
      Check the extreme cells: the largest X with zero collisions (predicted O(sqrt(h))) and
      the smallest X at which the codomain count reaches 0.99 * class size (predicted
      Theta(h log h) by coupon-collector). Both must be consistent with the same h.
  proof_search_map:
    bottleneck: >-
      The table-size exponent c in "#isogenies of degree <= X = X^c". Everything else in the
      comparison is bookkeeping: with c = 2 and a short-target bound with slack the exemplar
      gets 1/3; with c = 1 and no slack the ordinary case gets 1/4 = sqrt(h), which is the
      status quo.
    baseline_embedding:
      parameter_slice: >-
        The ordinary case with X = p^{1/4}, c = 1, no smoothness restriction: the table is
        the set of curves at distance <= p^{1/4}, and the meet-in-the-middle is exactly the
        classical sqrt(h) claw-finding algorithm for the ordinary isogeny problem.
      reproduction_check: >-
        Symbolic: substitute c = 1, Y = p^{1/2} into the table-size formula and check that
        the cost equals sqrt(h) exactly, not merely to within an exponent. Then, on one toy
        class, run both the smoothness-split MitM and a plain sqrt(h) claw search and check
        the operation counts agree to within the constant, with the constant reported.
    observation_collision:
      observable: >-
        The pair (branching exponent c, short-target exponent theta), which is what carries
        the whole cost conclusion.
      distinct_preimage_search: >-
        Two distinct ground-truth objects with the same observable, one on each side: the
        ordinary F_p graph and a supersingular-over-F_p graph both have c = 1 and theta = 1/2
        yet differ in every other respect (ordinarity, End rank, class-group structure).
        Their agreeing on the cost exponent is a PREDICTION of the argument, and the
        supersingular-over-F_p control is the search for that collision. Finding that they
        DISAGREE would show the observable is not what carries the conclusion.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        Specialise the exemplar's cost bookkeeping (per-attempt cost x inverse success
        probability) to the ordinary parameter set (c = 1, Y = Minkowski) and add charges
        only over the proved-disjoint blocks "table construction" and "claw search".
      predicted_gain: >-
        Exactly zero relative to sqrt(h), predicted in advance. A specialisation that
        produced a gain would mean the ordinary isogeny literature has a gap, which is a
        much larger claim than this record makes and would be escalated, not written up.
    - transform: observable_fiber
      proposed_object: >-
        Hold the cost exponent fixed and vary the forgotten structure (commutativity, field
        of definition, ordinarity) to find which one the exponent actually tracks.
      predicted_gain: >-
        The supersingular-over-F_p control is exactly this transform, and it predicts the
        exponent tracks COMMUTATIVITY OF THE RATIONAL ENDOMORPHISM RING rather than
        ordinarity.
    quantifier_order: >-
      FORALL ordinary E/F_p with End_{F_p}(E) = O, FORALL X with 1 << X << h(O), the number
      of distinct codomains of F_p-rational isogenies of degree <= X from E is X^{1+o(1)};
      and THEREFORE FORALL smoothness parameters B and FORALL split points, the
      meet-in-the-middle cost is at least sqrt(h). The order matters: EXISTS X FORALL E would
      permit a cherry-picked degree bound and is not what the cost argument needs.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The exemplar's algorithmic template, specialised to ordinary F_p curves, costs
        p^{1/4+o(1)}, matching the known sqrt(h) algorithm, and its target problem OneEnd is
        vacuous there." It can NEVER certify that no ordinary isogeny algorithm beats
        p^{1/4}, and it certifies nothing whatsoever about ECDLP cost.
      nearby_object_control: >-
        Supersingular curves over F_{p^2}, where the desired conclusion (no gain) is FALSE
        and the method must be seen to produce 1/3. A derivation that returns "no gain"
        there has not used the branching count and is asserting its conclusion. This control
        is Stage 3 and is mandatory.
    proof_obligations:
    - claim: E^{(p)} = E for an F_p-rational model, hence OneEnd is solved by pi.
      responsibility: correctness
    - claim: The trace-zero sublattice of O has rank 1 and minimal norm |D_E|.
      responsibility: size
    - claim: '#distinct codomains at degree <= X is X^{1+o(1)} below saturation.'
      responsibility: size
    - claim: Minkowski's bound places the ordinary short-target exponent at 1/2, with no slack.
      responsibility: baseline
    - claim: The resulting meet-in-the-middle cost is p^{1/4+o(1)} = sqrt(h).
      responsibility: runtime
    - claim: By T1/T2 none of this changes any ECDLP cost.
      responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      NO ECDLP EXPONENT MOVES AND NONE IS CLAIMED. The record derives, for the ORDINARY
      ISOGENY PROBLEM (not the ECDLP), that the exemplar's template gives p^{1/4+o(1)},
      equal to the long-known sqrt(h) baseline. Delta against that baseline: zero.
    memory_exponent: >-
      p^{1/4+o(1)} for the derived template, same as the sqrt(h) claw baseline; the
      van Oorschot-Wiener interpolation applies identically to both, so the tradeoff position
      is also unchanged.
    best_known: >-
      For ECDLP: parallel rho at 0.886*sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006). For
      the ordinary isogeny problem: sqrt(h) = p^{1/4+o(1)} [recall-confident, NOT re-verified].
      For the supersingular isogeny problem: p^{1/3+o(1)} conditional on Heuristic 1
      (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, Theorem 1.1, read this session).
    hidden_overhead: >-
      The o(1) in h = |D|^{1/2+o(1)} hides the Brauer-Siegel ineffectivity, which is a real
      weakness of the class-size statement and is disclosed rather than absorbed. The o(1) in
      the branching count hides the divisor function's log-power fluctuations.
    tradeoff_note: >-
      Both the derived template and the sqrt(h) baseline are claw-finding problems, so
      van Oorschot-Wiener gives time sqrt(h^3/w) with memory w and perfect parallelisation --
