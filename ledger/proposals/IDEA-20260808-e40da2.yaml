  proof_search_map:
    bottleneck: The integer cap k <= k_max. Every downstream number — Q, memory, the 256-bit
      boundary — is a function of that one integer, and the integer is decided by a single
      inequality (*) whose right side doubles per increment. Removing or moving that cap is
      the only way the conclusion changes.
    baseline_embedding:
      parameter_slice: 'N = 160, l = 1. The machinery must return k_max = 4, s = t = 32, Q
        = 2^36, which is the relayed published figure for the Fourier row at that curve and
        leakage. Second slice: k = 0 (no merge), where t = N and the attack degenerates to
        a full-size FFT, reproducing the textbook statement that Bleichenbacher without range
        reduction is infeasible.'
      reproduction_check: 'SYMBOLIC AND ALREADY PERFORMED BY HAND THIS SESSION: at N = 160,
        l = 1, k = 4: N/(k+1) = 32.0 and 1.3028 * 2^4 = 20.84, so 32 >= 20.84 holds; at k
        = 5: 26.67 vs 41.69, fails. Hence k_max = 4 and Q = 2^{4+32} = 2^36. A frozen fixture
        asserting these six numbers must be committed BEFORE Stage 2 runs.'
    observation_collision:
      observable: The single integer k_max, and through it the pair (log2 Q, log2 M).
      distinct_preimage_search: 'A COLLISION EXISTS AND IS EXHIBITED. Different (l, C0) pairs
        give the same k_max: at N = 256, k_max = 5 holds for l = 1 with C0 = 1, and k_max
        = 5 also holds for a range of l and C0 around it, because the constraint is an integer
        comparison with slack. So observing Q = 2^47.7 does NOT identify (l, C0). THE SEPARATING
        INVARIANT is the RATIO Q(N=256)/Q(N=160) within one l, which is 2^11.7 at l = 1 and
        a different value at l = 2 (2^{6.57} using k_max = 6, s = 36.57 vs k_max = 5 at 160...
        to be computed exactly in Stage 1). Measuring the ratio across two curve sizes at
        the SAME l separates the models; a single-size measurement cannot. This is why Stage
        2 sweeps N.'
    constructive_transforms:
    - transform: stronger_invariant
      proposed_object: Track the PAIR (bias exponent 2^k, reduction budget k*s) rather than
        the attack's success probability. The pair is preserved through every merge round
        and its two components move in opposite directions, which is exactly the structure
        the final bound needs and which a success-probability-only analysis discards.
      predicted_gain: Converts a per-instance parameter search into a class-level integer
        cap, at zero compute.
    - transform: observable_fiber
      proposed_object: Hold Q fixed and vary the forgotten structure (k, s, t, l). The intrinsic
        invariant distinguishing the fibres is k_max, which is determined by (N, l, C0) alone
        and not by Q.
      predicted_gain: Makes "the attack needs 2^36 samples" into "the attack needs k = 4,
        and 2^36 is what k = 4 costs" — a mechanism rather than a number.
    quantifier_order: 'CLAIMED IN THIS ORDER. THERE EXISTS a single inequality (*), fixed
      before any evaluation and independent of the instance, SUCH THAT FOR ALL attacks A in
      class BD and FOR ALL (N, l), if A succeeds per round then A''s parameters satisfy (*),
      hence A uses at least 2^{k_max + N/(k_max+1)} raw samples. The witness inequality may
      NOT depend on the attack, the instance, or the seed. THE WEAKER ORDER — for all A there
      exists an inequality A satisfies — is vacuous and is explicitly NOT claimed. THE TRAP
      BEING HUNTED: C0 in HA-4 is allowed to depend on the FFT size t but NOT on the instance.
      If C0 must be tuned per instance the uniformity fails and the class-level statement
      collapses to a per-instance one. Stage 2 measures C0 once and checks its stability across
      t.'
    method_ceiling:
      strongest_certifiable_claim: 'At most: a per-round sample and memory lower bound for
        class BD, conditional on HA-1..HA-4, with C0 calibrated at toy scale. It CANNOT certify
        that nonce-leakage key recovery at (256, 1) is infeasible; cannot bound the lattice-with-predicate
        family; cannot bound multi-round amortization; cannot say anything about ECDSA without
        leakage or about the ECDLP; and cannot certify any published figure is wrong.'
      nearby_object_control: 'THE OBJECT WHERE THE CONCLUSION MUST FAIL: l = 8 at N = 256.
        There |sinc(2^-8)| = 0.99999 and log2(1/|sinc|) = 1.4e-5, so the right side of (*)
        is negligible and k_max is limited only by t >= 0, i.e. the bound becomes vacuous
        and recovery is easy — which is the known truth (8-bit leakage is comfortably broken).
        A machine that reports a restrictive k_max at l = 8 has not identified the load-bearing
        structure and every 1-bit number it produced is void. THIS CONTROL IS FREE AND MUST
        BE RUN FIRST.'
    proof_obligations:
    - claim: The product rule gives |B| = |sinc(2^-l)|^{2^k} for a depth-k +-1 merge tree.
      responsibility: correctness
    - claim: A depth-k tree over lists of size 2^s zeroes k*s multiplier bits and outputs
        2^{s+o(s)} combinations.
      responsibility: feasibility
    - claim: Detection needs M >= C0^2 |B|^{-2} ln(2^t), with C0 measured, not assumed.
      responsibility: success_probability
    - claim: The balanced point s = t = N/(k+1) minimizes peak memory for fixed k.
      responsibility: memory
    - claim: At N = 160, l = 1 the machinery returns Q = 2^36 (baseline reproduction).
      responsibility: baseline
    - claim: At l = 8 the bound is vacuous (nearby-object control).
      responsibility: strictness
    - claim: Every claimed toy recovery carries a d*G == Q certificate verified outside the
        solver.
      responsibility: interface
    - claim: No sentence states a result without naming the leakage assumption and the class
        restriction.
      responsibility: scope
