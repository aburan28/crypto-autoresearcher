  minimal_test:
    design: >-
      CELLS. (n, l) = (17, 6) on the RC-1 curve (A = 97044, B = 126251,
      #E = 4 x 32603, subgroup targets by the Stage-1 rule of
      EXP-CERTBIN-4e92d7) and (23, 8) on the curve drawn for
      IDEA-20260930-b26bbc's Stage 1 (shared if both run; drawn by the same
      rule otherwise). V = {deg < l}, polynomial basis.
      STAGE 0 (zero run). Verify the product identity on 100 random tuples;
      tabulate the Boolean degree profile of the product descent at both
      cells, the semi-regular references and counting rungs, and the
      column counts.
      STAGE 1 (sampling). Draw R uniform in the odd-order subgroup and a
      uniform in x(B) minus {x_R} by a frozen PCG64 stream; for each node
      build the product descent and the two factor descents (u_+- by group
      arithmetic from one lift of a); decide satisfiability of all three by
      evaluation over V^2; keep 60 nodes with the product unsatisfiable and
      20 with it satisfiable (planted: a = x(P_1) from a planted
      decomposition R = P_1 + P_2 + P_3) per cell. Nulls per cell: N0
      same-support random quartic system (30, unsat by rejection), N-PROD
      (product descent with (u_+, u_-) replaced by two uniform field
      elements, 30), N-FACT (descent of g_+ times a same-support random
      quadratic, 20), easy control (10).
      STAGE 2 (closures). On every system: M_3, W_3, M_4, W_4, M_5, W_5; on
      the first 30 unsatisfiable, 10 satisfiable and 15 of each null per
      cell: M_6, W_6 and (at l = 8 only, under the 3 GB cap) M_7, W_7.
      Certificates verified by the separate-process checker; ops logged;
      UNDETERMINED(budget) declared, never "not refuted".
      STAGE 3 (reporting). Rung triples, Delta distribution, null and control
      counts, localisation pattern, ops comparison; CP95 throughout.
      OUTCOME TABLE. M2: the direct restricted presentation is a chain-free
      inner theory for b26bbc at the same exponent; the structural statement
      "one-leg restrictions of S_4 descents are refuted at bounded degree" is
      recorded at toy scale and handed to a (m-2)-leg S_5 successor. M1: the
      direct presentation is closed for bounded-degree inner theories with
      the measured penalty as the obstruction; KN-OPEN-3c8f51 (A) sharpens to
      the first product. MIXED: the localisation pattern is the deliverable.
      ARTIFACT (any refuted satisfiable control, failed certificate, identity
      fixture failure, or easy control not refuted): void.
      FALSIFICATION THRESHOLDS, FIXED NOW. M2 falsified iff Delta >= 2 on
      more than 50 percent of unsatisfiable nodes at either cell; M1
      falsified iff the product rung is <= 5 on >= 90 percent at both cells.
      COST (estimate): implementation low to medium (S_4 restriction builder
      on src/semaev_tree.py's S3_char2 and descent, about 250 lines on the
      RC-1 modules); compute: closures at <= 2517 columns up to D = 5 are
      seconds each; D = 6, 7 at l = 8 (14893 and 26333 columns) minutes to
      an hour each on about 100 systems; total 10^1 CPU-hours.
    controls:
      - 'Identity fixture: the product identity verified numerically before any descent.'
      - 'Satisfiability of all three systems per node by exhaustive evaluation over V^2; the product flag must equal the OR of the factor flags.'
      - 'N0 same-support random quartic null, N-PROD random-pair null, N-FACT one-random-factor null, identical closure code path (hash recorded).'
      - 'Planted satisfiable nodes: any refutation voids the instrument.'
      - 'Easy control (product descent plus l random affine relations) refuted at every rung.'
      - 'Seed control: node and null streams fixed by rule before any closure.'
    required_metrics:
      - least rung per system (product, g_+, g_-) and the product penalty Delta, with CP95 on the thresholds
      - first iteration containing 1 per refuted system
      - ops_to_1 and ops_to_fix per closure (GF(2) word operations)
      - null and control rung distributions; refuted satisfiable count
      - Boolean degree profile and top-form rank of the product descent per cell
      - termination_reason per closure; peak RSS; certificate verification counts

  falsification_conditions:
    - 'M2 falsified iff Delta >= 2 on more than 50 percent of unsatisfiable nodes at either cell.'
    - 'M1 falsified iff the product rung is <= 5 on >= 90 percent of unsatisfiable nodes at both cells.'
    - 'The identity falsified iff any of the 100 fixture tuples fails; the record is then withdrawn.'
    - 'The localisation reading falsified iff N-FACT refutes at the object rung on >= 50 percent (then one structured factor suffices and the mechanism text is wrong).'
    - >-
      Instrument falsified (run void) iff any satisfiable control is refuted,
      any certificate fails, the product sat flag disagrees with the OR of
      the factor flags, or the easy control is not refuted.

  confounders:
    - >-
      Overdetermination: at (17, 6) the factors are refuted at degree 4 by
      counting, so the factor baseline rung is 3 and a product rung of 4 or 5
      is a penalty of 1-2 even under M2; thresholds are set on Delta <= 1
      with that in mind and the (23, 8) cell is the one with room.
    - >-
      The lifting of a to P_3 is two-valued; u_+ and u_- swap under the other
      lift, and the product is symmetric, so the choice is immaterial; the
      factor rungs are reported for both.
    - >-
      Degenerate nodes (a = x_R excluded; u_+ = u_-) are counted and
