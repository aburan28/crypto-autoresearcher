  assumptions:
    - >-
      Satisfiability of every restricted residual and of each inner factor is
      decided by exhaustive evaluation over V^2 (2^{2l} <= 65536 points),
      exact; closures never decide SAT.
    - >-
      a != x_R (the identity degenerates there); nodes with a = x_R are
      excluded and counted.
    - >-
      The GF(2) closure engines are reused unchanged; the S_4 restriction
      builder and the three-system driver are new.
    - >-
      OFF-LIMITS COMPONENT: F2 as the family; V inside KN-OPEN-020's class.

  proof_search_map:
    bottleneck: >-
      Whether the bounded-degree refutation of the m = 2 object survives a
      product taken before Weil descent; that single fact decides whether the
      direct restricted presentation can serve as b26bbc's inner theory and
      whether the refuting structure is S_3-specific.
    baseline_embedding:
      parameter_slice: >-
        The two inner factors on the same (a, R) are the archived object of
        KN-FIND-5a8d3e / c3a917 with target u_+-; their rungs are the
        baseline and are measured in the same run (they are b26bbc's Stage-1
        objects at the same cells). At l = 6, n = 17 degree 4 is generic by
        counting for the factors (1343 rows against 794 columns), so the
        factor baseline rung is W_3 there; the product's columns are the
        same 794 but its rows at degree 4 are the 17 quartics alone.
      reproduction_check: >-
        Frozen fixtures: (i) the identity S_4(a, x_2, x_3, x_R) = (a + x_R)^4
        g_+ g_- checked on 100 random tuples in F_{2^17}; (ii) the restricted
        residual's satisfiability over V^2 equals (sat(g_+) or sat(g_-)) on
        every instance; (iii) the Stage-0 table: Boolean degree profile of
        the product descent, semi-regular reference for n quartics in 2l
        variables ((12, 17): 1, 12, 66, 220, 478, 588, -198, D_reg = 6;
        (16, 23): 1, 16, 120, 560, 1797, 4000, 5248, -1440, D_reg = 7; my
        arithmetic), counting rungs (M_7 generic at l = 6: 5083 rows against
        3302 columns; M_8 at l = 8: 57891 against 39203).
    observation_collision:
      observable: >-
        Per node: the triple of least rungs, the product penalty Delta, the
        first iteration containing 1, ops, and the certificates.
      distinct_preimage_search: >-
        A low product rung could come from (i) survival of the factors'
        structure through the product (M2), (ii) a degenerate node (a close
        to x_R, or u_+ = u_-), or (iii) an unsound instrument. (iii) by
        Proposition S and the planted-satisfiable controls; (ii) by excluding
        a = x_R and reporting u_+ = u_- (which happens iff P_3 is 2-torsion
        or R = O); (i) is separated from "any product of two structured
        quadratics refutes" by N-FACT (one factor replaced by a same-support
        random quadratic) and from "the pairing (u_+, u_-) from one P_3
        matters" by N-PROD (two independent random targets).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold (V, a, R) fixed and vary the PRESENTATION: product descent
          against separate descents; the invariant proposed to distinguish
          them is the product penalty Delta.
        predicted_gain: >-
          Decides M1 against M2 on identical instances, with no new
          sampling beyond b26bbc's Stage-1 cells.
      - transform: representation_reduction
        proposed_object: >-
          Under M2, replace the chain (2^{m-2} inner targets per node,
          computed by group arithmetic) by the single restricted direct
          residual of Boolean degree <= 2(m-1); obligations: ENCODING (the
          product identity, exact), COMPLETENESS (unsat iff all factors
          unsat), SOUNDNESS (Proposition S), TRANSFER (declared unmet beyond
          m = 3 and the tested cells), COST LOSS (higher degree, same
          variables; the closure's cost at the measured rung is the number).
        predicted_gain: >-
          None in exponent; a chain-free presentation and a structural
          statement if M2.
    quantifier_order: >-
      Exact: FORALL a != x_R, the identity holds and the product is
      unsatisfiable iff both factors are. Empirical: FOR the cells (17, 6)
      and (23, 8), FORALL sampled nodes, the triple and Delta are as measured
      with CP95; M2 needs EXISTS D_0 <= 5 such that FORALL nodes the product
      rung is <= D_0 -- the witness may not depend on the node or the cell.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the two cells the restricted direct residual's least rung and
        the product penalty are distributed as measured, with the nulls and
        controls as measured." It certifies nothing at m >= 4, at other
        cells, about F4 step degree, or about any cost.
      nearby_object_control: >-
        N-FACT (one random factor) is the object on which M2's conclusion is
        expected to fail (the product of a structured and a generic quadratic
        should behave generically); the planted satisfiable residual is the
        proves-too-much object; the easy control (product descent plus l
        random affine relations) must be refuted at every rung.
    proof_obligations:
      - claim: S_4(a, x_2, x_3, x_R) = (a + x_R)^4 S_3(x_2, x_3, u_+) S_3(x_2, x_3, u_-) for a != x_R, with u_+- the abscissae of R +- P_3 for either lift P_3 of a.
        responsibility: correctness
      - claim: The product descent is unsatisfiable over V^2 iff both factor descents are.
        responsibility: correctness
      - claim: The Boolean degree of the product descent is at most 4 (exponent weight), exact value tabulated.
        responsibility: size
      - claim: Proposition S applies to the product descent with field equations.
        responsibility: correctness
      - claim: The rung triple is measured on identical (a, R) with the same engine and seeds.
        responsibility: interface
      - claim: Nothing transfers beyond m = 3, the two cells, or to prime fields.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
