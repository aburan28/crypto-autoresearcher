idea:
  id: IDEA-20260930-c5466b
  question_id: RQ-SATIC-1ae57a
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    RESTRICTION OR S_3 -- WHICH STRUCTURAL PROPERTY DOES THE DEGREE-4 WORK:
    the one-leg restriction of the direct S_4 descent at m = 3 is, exactly,
    (a + x_R)^4 times the PRODUCT of the two chained inner polynomials
    S_3(x_2, x_3, u_+) S_3(x_2, x_3, u_-) with u_+- = x(R +- P_3), so its
    descent (n quartic Boolean equations in 2l variables) asks whether the
    certified bounded-degree refutation survives a product taken before
    descent; measured with the product penalty rung(product) - max rung
    (factors) on identical (a, R) against same-support, random-pair and
    one-random-factor nulls
  class: control

  claim: >-
    OUTCOME CLASS: a mechanism control, aimed at (a) only through
    IDEA-20260930-b26bbc (it decides whether that record's exponent route
    needs the chained presentation or can use the direct S_{m+1} restriction)
    and claiming no exponent of its own; its standalone deliverable is the
    structural property RQ-SATIC-1ae57a's decision target (b) asks for, with
    the null ladder RQ-SATIC's constraints require. Representation R1
    (Boolean coordinates of x_2, x_3 in a basis of V = {deg < l}); attack
    stage: the per-attempt decomposition solve. CLAIM TIER toy. NO ATTACK.

    THE IDENTITY (derivation, zero compute; the run verifies it against
    point addition). With S_3(a, b, X) = (a + b)^2 X^2 + a b X + (a b)^2 + B
    (KN-TECH-b18366's formula rearranged, as in IDEA-20260926-9cc043) and
    S_4 = Res_X(S_3(x_2, x_3, X), S_3(X, a, x_R)), the resultant of a
    polynomial F of degree 2 in X against a quadratic G with roots u_+, u_-
    is lc(G)^2 F(u_+) F(u_-); here lc(G) = (a + x_R)^2 and the roots of
    S_3(X, a, x_R) are the abscissae x(R + P_3) and x(R - P_3) of the two
    lifts of a. Hence, for a != x_R,
    S_4(a, x_2, x_3, x_R) = (a + x_R)^4 S_3(x_2, x_3, u_+) S_3(x_2, x_3, u_-).
    The direct restricted residual is therefore the Weil descent of a
    PRODUCT of the two inner objects that IDEA-20260930-b26bbc decides one at
    a time; it is unsatisfiable iff both factors are (a product of functions
    on V^2 vanishes iff a factor does), it has field degree 4 in each leg and
    Boolean degree at most 4 by the exponent-weight bound of 9cc043
    (HW(e) <= 2 for e <= 4), and its exact Boolean degree and top-form rank
    are Stage-0 computations.

    THE TWO EXPLANATIONS AND WHAT DECIDES THEM. M1 (S_3-SPECIFIC): the
    bounded-degree refutation of KN-FIND-5a8d3e / KN-FIND-c3a917 is a
    property of the m = 2 S_3 object (its Frobenius-twisted convolution
    tensor and the degree-2 falls among products of the n descended
    generators by variables); multiplying two such objects before descent
    doubles the degree, mixes the two tensors, and the product's refutation
    rung equals the same-support null's. M2 (RESTRICTION-GENERAL): the
    refutation is a property of one-leg (more generally (m-2)-leg)
    restrictions of summation descents, survives the product, and the direct
    residual is refuted at W_4 or W_5 with the null untouched at that rung.
    The deciding quantity is the PRODUCT PENALTY on identical (a, R):
    Delta = rung(product descent) - max(rung(descent of g_+), rung(descent
    of g_-)), where rung is the least D with 1 in W_D. M2 iff Delta <= 1 on
    >= 90 percent of unsatisfiable restricted residuals at both cells with
    the null's rate at that rung <= 10 percent; M1 iff the product's rung
    equals the null's counting rung on >= 50 percent; MIXED otherwise, with
    the N-PROD and N-FACT nulls localising which factor structure is needed.

    WHY IT MATTERS. Under M2 the direct S_{m+1} restricted to m - 2 legs is a
    product of 2^{m-2} inner polynomials (one per sign pattern of the fixed
    legs), has Boolean degree at most 2(m-1) by exponent weight, and gives
    b26bbc's per-attempt law 2^{(m-2) l} C_W without chain variables and
    without computing the 2^{m-2} inner targets separately -- the same
    exponent, a different and chain-free presentation, and a structural
    statement ("restrictions of summation descents are refuted at bounded
    degree") strong enough to be the hypothesis of the structure theorem
    KN-FIND-c3a917 section 5 names. Under M1 the chained route of b26bbc is
    the ONLY route, KN-OPEN-3c8f51 item (A) sharpens to "the refuting
    neighbourhood of S_3 ends at the first product", and the direct
    presentation is closed for bounded-degree inner theories with the
    measured penalty as the obstruction.

  mechanism: >-
    OBJECT FRAME. Representation R1. The relation-search object is unchanged
    (Class I partial action, IDEA-20260806-c5d183). The solver-side tracked
    object is the triple (rung of the product descent, rung of g_+'s
    descent, rung of g_-'s descent) at one depth-l node; operation set
    Sigma: fix one leg by evaluating the symmetric resultant at x_1 = a
    (exact), then the D-bounded ring action of B = F_2[v]/(v_i^2 + v_i).
    TRICHOTOMY: coordinate-dependent in the weak sense of IDEA-20260926-917981
    Proposition B (depends on the set V, on x_R and on a, not on bases); a
    solver-side object. LOSSY-PROJECTION TEST: the triple discards the three
    systems and their closures; the discard is Sigma-compatible because each
    rung is a function of its system alone and W_D is closed under the
    action; it is lossy because every (a, R) with the same triple collapses.
    The projection that fails the test: the restricted S_4 polynomial itself.

    WHY THE PRODUCT IS THE RIGHT KNIFE. The two certified mechanisms on
    record are (i) the trace / linear consequence and the degree-2 falls of
    the convolution tensor (KN-FIND-5a8d3e section 2; KR-IC-f5c584), and
    (ii) the mutant iteration reusing those falls (KN-FIND-c3a917 section 2,
    "v_j-products of the degree-<= 2 falls alone fill B_{<= 3}"). Both act
    on a system whose equations have Boolean degree 2 with a shared bilinear
    part. Descending g_+ g_- instead of g_+ and g_- separately replaces n
    quadratic equations per factor by n QUARTIC equations whose degree-2
    parts are cross terms of the two factors' linear and quadratic parts in
    the field; whether the falls that carry (i) and (ii) still exist is not
    decidable from the m = 2 data and is the measurement. The product is
    exactly what the resultant does to the chain: KN-TECH-b18366 explains the
    chain as refusing the resultant to keep degree 2; this record asks
    whether the refutation, not only the degree, is what the resultant
    costs.
    OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2):
    F2 as the family; V = {deg < l} inside KN-OPEN-020's scoped-out class;
    not escaped. Added beyond F2 as filed: the product identity for the
    restricted direct residual, the product-penalty observable on identical
    (a, R), and the two-explanation decision with its localising nulls.

