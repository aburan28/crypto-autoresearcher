idea:
  id: IDEA-20260905-4e26ed
  title: Successive minima expose the finite-height CM coverage bottleneck
  class: mechanism
  claim: 'For a global realization of an ordinary CM lift with certified Mordell-Weil lattice, the usable reduction
    coverage below height H is governed by active successive minima and collisions modulo p, not rank alone. Conjecture:
    CM anisotropy can produce a finite-height coverage transition, but any claimed reduction from the order-N lift-height
    bottleneck must survive both quantities.'
  mechanism: The canonical-height pairing defines an ellipsoid. Before H crosses a successive minimum, the corresponding
    lattice direction contributes few or no points; asymptotic H^(r/2)/sqrt(Reg) can overestimate available lifts.
    Even many lattice points may reduce to the same finite-field point. Track the image of each height shell and
    the minimum height needed for a fixed coverage fraction. CM could help only by changing that minimum-height
    distribution or reducing collisions, not by making curve coefficients smaller. A canonical p-adic lift is not
    automatically a global rational model with known rank; that existence is a separate prerequisite.
  question_id: RQ-CANL-63098f
