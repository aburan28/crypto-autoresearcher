idea:
  id: IDEA-20260816-e8e809
  question_id: RQ-ALR-001
  added: '2026-08-16'
  title: Measure the displacement rank of the Sylvester matrix of the ALR target-divisor pair over
    F_p and its growth in the divisor degrees, against a uniformly random matrix of identical shape,
    separating structure that a generator representation could compress from structure that is merely
    a change of coordinates
  class: representation
  claim: '(A) H-ALR-001 makes the resultant and the norm the detectors of a nonunit, and a resultant
    is the determinant of a Sylvester matrix. The classical invariant that decides whether such a
    matrix admits a compact representation is its displacement rank, and no ALR record mentions it.
    (B) The measurable is r = rank(M - Z M Z-transpose) over F_p, where M is the Sylvester matrix
    of the pair (W, K_P) on a chart and Z is the down-shift, together with its growth as N and the
    source count increase. A matrix of displacement rank r is described by 2r generator vectors of
    length equal to its dimension, so storage falls from dimension squared to 2r times dimension exactly
    when r is small. (C) The claim under test is comparative and has a mandatory honesty clause. Comparative:
    the ALR Sylvester matrix''s displacement rank is measured against a uniformly random matrix of
    identical shape over the identical field, which has full displacement rank except with probability
    O(1/p). Honesty clause: the generator pair is a lossless re-encoding of M, so tracking generators
    is a change of coordinates and not a new object, and the entry says so in plain terms. What is
    genuinely lossy, and what is therefore tracked, is the single integer r and its growth law. (D)
    The deliverable is r as a function of N and source count, the storage ratio 2r*d over d squared
    at each tested size, and the size at which r ceases to be small. A finding that r is full is an
    equally usable measured obstruction: it says the structured-matrix route to compactness is closed
    over the tested range, with a number. (E) NOT CLAIMED: no attack, no speedup, no claim that a
    low displacement rank yields a fast solve, no claim about superfast structured solvers, and no
    assertion about the literature. Displacement rank is a storage invariant; the algorithms that
    exploit it are a separate question this entry does not touch.'
  mechanism: 'STAGE 1, construct the matrix. On one x-injective chart, build the Sylvester matrix
    of W of degree N and K_P of its stated degree, over a toy prime, using the R181 chart conventions.
    Its dimension d is the sum of the two degrees. STAGE 2, compute the displacement. Fix the down-shift
    Z of dimension d and form Delta = M - Z M Z-transpose; also form the Stein-type variant nabla
    = Z M - M Z, and report both, since displacement rank depends on the operator chosen and reporting
    one alone invites a favourable choice. STAGE 3, compute rank of each displacement exactly over
    F_p by Gaussian elimination, never by any norm-based method. STAGE 4, sweep N and source count
    and fit r as a function of them, reporting the fit with its residual and stating explicitly that
    a fit over a handful of points is a description and not a law. STAGE 5, run the null: thirty uniformly
    random matrices of dimension d over the same field, identical displacement operators, identical
    exact rank. STAGE 6, compute and report the storage ratio 2rd over d squared per cell. STAGE 7,
    apply the structural tell: displacement rank of a genuinely structured matrix should stay bounded
    as d grows, since that is what structure means here. A displacement rank that grows proportionally
    to d is the signature of no structure, and a displacement rank that is small only because the
    wrong operator was chosen is caught by reporting both operators.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-ALR-001.yaml, ledger/hypotheses/H-ALR-001.yaml, ledger/evidence/EV-ALR-001.yaml
      in full. Greps run: grep -ril ''displacement rank'' ledger/proposals/ ledger/hypotheses/ knowledge/
      (6 hits: IDEA-20260807-291968, IDEA-20260807-9ecc6f, IDEA-20260731-014, IDEA-20260807-e57607,
      IDEA-20260807-4d7e8e, IDEA-20260807-efc8de; question ids and titles resolved for the first two);
      grep -ril ''subresultant'' ledger/proposals/ (1 hit); grep -ril ''resultant'' ledger/proposals/
      (30 hits, titles listed).'
    results: IDEA-20260807-291968 under RQ-ECDLP-002 is a measurement-class record arguing that the
      index-calculus relation matrix has never been measured as an object over prime fields, and it
      is the nearest displacement-rank neighbour found. IDEA-20260807-9ecc6f under RQ-EQLA-0d3f40
      is a closure record stating that the commutant of a finite abelian group acting on a phi-stable
      factor base is a product of full matrix algebras admitting no superfast solver, which is the
      closest thing in the repository to a negative structured-matrix result, and it concerns a different
      matrix in a different stage. Four further hits were not individually resolved and are recorded
      as unresolved. No record mentions the Sylvester matrix of the ALR target-divisor pair, and RQ-ALR-001
      carries zero proposals.
    verdict: 'UNVERIFIED. No claim about external literature. Assembled from known parts: displacement
      rank is a standard structured-matrix invariant, exact rank over F_p by elimination is standard,
      and the comparative random-matrix null is the method already used elsewhere in this batch and
      in RQ-TTN-001. Claimed new only as the object measured: the displacement rank of the ALR Sylvester
      matrix, which no record here measures, together with the explicit honesty clause that the generator
      representation is a lossless recoding and only the integer r is a lossy tracked object.'
  object_first_candidate:
    tracked_object: The displacement rank r of the Sylvester matrix of the chart-wise ALR pair over
      F_p, under two declared displacement operators, together with its growth as the matrix dimension
      d increases. The tracked object is the integer r, not the generator pair.
    lossiness: 'Stated bluntly as the protocol requires: the generator pair is NOT lossy. Given the
      generators and the displacement operator, M is recoverable exactly, so tracking generators is
      a change of coordinates whose value is size rather than information, and it is not offered as
      a new object. What is tracked instead is the single integer r per operator, which discards the
      generators, the entries and the matrix entirely, and from which nothing can be reconstructed.
      That integer still propagates because displacement rank is subadditive under matrix sum and
      bounded under products by sums of the constituent ranks plus operator-dependent corrections,
      so a rank bound moves forward through the construction, one-sidedly and with the correction
      terms stated rather than dropped.'
    propagation: 'One step of the target operation, forming the Sylvester matrix for one more chart
      or extending the target polynomial by one degree, acts on the tracked object by extending d
      and changing r by a bounded amount determined by the operator: a rank-one row or column update
      changes displacement rank by at most a constant depending on the operator. Composing over the
      source points gives a block structure whose displacement rank is bounded by the sum of block
      ranks plus a coupling term, and the run measures the realised value against that bound rather
      than assuming it.'
    survival_score: Compactness survives as far as r stays bounded while d grows. The entry reports
      the largest d at which r is strictly below the null distribution's minimum under both operators,
      and the fitted growth of r against d over the tested range with its residual. If r grows proportionally
      to d the structure never existed and the entry reports the slope as the measured obstruction,
      which is the more likely and equally publishable outcome.
  null_object_control: Draw thirty matrices of dimension d with entries independent and uniform over
    the same F_p, apply the IDENTICAL displacement operators and the IDENTICAL exact rank routine
    in the same invocation, and report the resulting distribution. The null must show displacement
    rank equal to the maximum possible for the operator, which for the down-shift displacement is
    d or d minus a small operator-dependent constant, with probability at least 1 - O(1/p). If the
    null does not attain full displacement rank, the operator itself forces deficiency and the measured
    rank is not evidence of structure; the run then reports the forced value instead. A second null
    applies the operators to a matrix known to be Toeplitz, where displacement rank must come out
    at a small constant, confirming the instrument detects structure when it is present.
  discriminated_from:
  - IDEA-20260807-291968, which measures the index-calculus relation matrix as an object over prime
    fields under RQ-ECDLP-002; that is the sparse relation matrix of the linear-algebra stage, a different
    matrix from a Sylvester matrix of a divisor pair, and its question is about the dominating cost
    term rather than about a storage invariant.
  - IDEA-20260807-9ecc6f, which closes a superfast-solver route for the commutant of an abelian group
    action on a factor base under RQ-EQLA-0d3f40; the shared theme is structured-matrix compactness,
    cited here, and the matrices, the lane and the operator are all different.
  - 'The blacklisted sparse linear algebra as the second half of index calculus, IDEA-20260815-fa6a12:
    this entry does not touch the linear-algebra stage of index calculus, does not solve any system,
    and measures only a storage invariant of a resultant''s Sylvester matrix.'
  - The bond-rank entry in this same batch, which ranks contraction-tree intermediates across leg
    bipartitions; displacement rank is a different invariant, computed from a matrix and a shift operator
    rather than from a tensor and a bipartition, and the two can disagree.
  - 'EV-ALR-001''s observation that every remainder matrix has full target rank: ordinary rank and
    displacement rank are unrelated invariants, a Toeplitz matrix being typically full rank and displacement
    rank two, and the run reports both so the distinction is visible rather than assumed.'
  assumptions:
  - The Sylvester matrix of the chart-wise pair is well defined under the R181 conventions and its
    dimension is the sum of the two degrees.
  - Exact rank over F_p by Gaussian elimination with no truncation and no tolerance, since no direction
    is negligible over a finite field.
  - Uniformly random matrices over F_p attain maximal displacement rank except with probability O(1/p),
    so thirty draws establish a null.
  - Both declared displacement operators are applicable to the matrix shape at every tested size.
  - Toy dimensions d up to a few hundred are materialisable, which bounds the sweep.
  predictions:
  - metric: displacement_rank_of_alr_sylvester_matrix_under_down_shift_operator
    direction: lower
    minimum_effect: 4
  - metric: displacement_rank_growth_slope_against_dimension_d
    direction: different
    minimum_effect: 'refuse to pre-commit: a Sylvester matrix of two dense polynomials is classically
      Toeplitz-block and could have constant displacement rank, while the ALR pair''s chart structure
      may destroy that; the two readings predict slope 0 and slope proportional to 1, and choosing
      between them without measuring is what the run exists to avoid'
  - metric: null_arm_full_displacement_rank_fraction
    direction: higher
    minimum_effect: 0.95
  - metric: toeplitz_positive_control_displacement_rank
    direction: different
    minimum_effect: 'forced value: at most 2 under the down-shift operator, or the instrument does
      not detect structure and the run is void'
  minimal_test:
    design: 'For N in {4, 8, 16, 32, 64} and source count n in {1, 2, 4}, build the chart-wise Sylvester
      matrix over a toy prime, form both displacement operators, and compute each displacement''s
      exact rank by Gaussian elimination over F_p. In the same invocation compute the two nulls: thirty
      uniformly random matrices of identical dimension, which must attain maximal displacement rank,
      and one Toeplitz matrix of identical dimension, which must attain at most two. Report per cell
      the measured rank under each operator, the null distribution, the Toeplitz positive-control
      value, and the storage ratio 2rd over d squared. Fifteen cells at dimensions up to a few hundred
      is minutes of exact elimination. This is the cheapest possible discrimination because the two
      nulls bracket the instrument from both sides: a run in which random matrices are not full and
      Toeplitz matrices are not rank two is measuring nothing, and both checks are visible in the
      same output as the signal.'
    controls:
    - Thirty uniformly random matrices of identical dimension per cell, same invocation, same operators,
      same exact rank routine.
    - Toeplitz positive control of identical dimension, which must return displacement rank at most
      two, confirming the instrument detects structure.
    - Both displacement operators reported for every cell, so a favourable operator cannot be selected
      after the fact.
    - Ordinary rank reported alongside displacement rank, so the distinction from EV-ALR-001's full-target-rank
      observation is explicit.
    - Second toy prime per cell, since exact rank over F_p can be characteristic-dependent.
    required_metrics:
    - displacement_rank_per_operator
    - ordinary_rank
    - null_arm_displacement_rank_distribution
    - toeplitz_positive_control_displacement_rank
    - storage_ratio_2rd_over_d_squared
    - fitted_displacement_rank_growth_against_d_with_residual
    - second_prime_agreement_rate
  falsification_conditions:
  - The random null does not attain maximal displacement rank in at least 95 percent of draws, so
    the operator forces deficiency and no measured rank is interpretable.
  - The Toeplitz positive control returns displacement rank above two, so the instrument does not
    detect structure that is present and the run is void.
  - The measured displacement rank lies inside the random null distribution at every cell, so the
    ALR Sylvester matrix has no measurable displacement structure over the tested range.
  - Displacement rank grows proportionally to d, which is a usable measured obstruction and simultaneously
    falsifies the compactness reading.
  - The two operators disagree in direction, one showing bounded rank and the other proportional growth,
    in which case no operator-independent statement may be made.
  - Ranks disagree between the two primes beyond the reported tolerance.
  confounders:
  - Operator choice, which alone determines whether a given matrix looks structured; addressed by
    reporting both operators and by the Toeplitz positive control, but not eliminated, since a third
    operator could differ again.
  - Classical Toeplitz-block structure of a Sylvester matrix possibly forcing low displacement rank
    for reasons that have nothing to do with the ALR object, which would make a low r a restatement
    of what a Sylvester matrix is; the entry must therefore report the displacement rank of a Sylvester
    matrix built from two random polynomials as a third arm to separate these.
  - Chart splitting producing a block matrix whose displacement rank is dominated by the block coupling
    rather than by either block.
  - Small p producing accidental rank drops, addressed by the second-prime control.
  - Materialising the matrix is itself the represented cost the lane avoids, so this measurement pays
    exactly what it studies and can never scale.
  interpretation_limits:
  - Displacement rank is a storage invariant; nothing here bears on whether any solve is fast, and
    superfast structured solvers are explicitly out of scope.
  - The generator representation is a lossless recoding, so a low rank is a compression statement
    and not a new mathematical object.
  - All numbers are scoped to the tested dimensions, the two declared operators and the two toy primes,
    and the growth fit is a description of the tested range.
  - A low displacement rank that is explained by the third arm, a Sylvester matrix of random polynomials,
    is a property of Sylvester matrices and not of the ALR object, and must be reported that way.
  target_complexity:
    time_exponent: No attack exponent is claimed. Elimination times are properties of the measurement
      at toy dimensions.
    memory_exponent: 'No asymptotic memory exponent is claimed. The reported memory quantity is concrete:
      2r*d field elements for a generator representation against d squared for the dense matrix, tabulated
      per cell, with r measured rather than assumed.'
    best_known: The incumbent is the dense Sylvester construction implicit in the resultant and norm
      routes recorded in EV-ALR-001, which materialises d squared entries; the entry measures what
      a generator representation would cost and claims no improvement, since it supplies no algorithm
      operating on generators.
    hidden_overhead: 'Hidden in the lower-order terms is the cost of converting between generator
      and dense form, which is where naive structured-matrix approaches usually lose their advantage,
      and the operator-dependent additive constants that a bare rank number omits. The human cost
      hides in operator selection: reporting one operator invites choosing the flattering one, which
      is why both are mandatory metrics.'
  dominated_by: n/a (no result claimed). Every frontier row this lane records was checked, the B^(5/2)
    rho proxy and the five B^(7/2) represented routes of EV-ALR-001, and a storage invariant is not
    a point on any of them. It is also not comparable to IDEA-20260807-9ecc6f's closure, which concerns
    a different matrix, and the entry reports that rather than claiming independence.
  sota_delta: 'no attack; conceptual/measurement contribution only. The quantitative deliverable is
    r per operator and per cell, the storage ratio 2rd over d squared, the fitted growth of r against
    d with its residual, and the three bracketing control values: random-matrix null, Toeplitz positive
    control, and random-polynomial Sylvester third arm.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'That the two bracketing controls behave, random full and Toeplitz at
    most two: 0.9, since both are classical and easy to check. That the ALR Sylvester matrix shows
    displacement rank at most 4 under the down-shift operator: 0.6, largely because Sylvester matrices
    are classically Toeplitz-block, which is exactly why the third arm exists to attribute it. That
    any low rank found survives attribution to the third arm, that is, is a property of the ALR pair
    rather than of Sylvester matrices generally: 0.2, deliberately low, and this is the entry''s most
    likely failure. That the two operators agree in direction: 0.7. That a low displacement rank,
    if genuine and attributable, is operationally useful without a matching algorithm: 0.15, stated
    separately because storage is not speed.'
