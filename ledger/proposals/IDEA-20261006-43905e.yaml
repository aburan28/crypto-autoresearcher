idea:
  id: IDEA-20261006-43905e
  question_id: RQ-ECDLP-4fcbd3
  title: >-
    Lower-half x-count gap of y^2 = x^3 - x + 1 and y^2 = x^3 + x over F_29
  class: measurement
  claim: >-
    Over F_29, split field elements into L = {0, 1, ..., 14} and
    U = {15, ..., 28}. On E1: y^2 = x^3 - x + 1, the affine points
    contribute 20 to L and 16 to U, so the imbalance |20 - 16| is 4.
    On E2: y^2 = x^3 + x, they contribute 10 to L and 9 to U, so the
    imbalance is 1. The absolute gap of the two imbalances is 3. A
    recount that returns any other pair of (low, high) counts is a
    negative. Counting E1 twice has gap 0. Both curves are nonsingular
    because 4 A^3 + 27 B^2 is 23 and 4 in F_29. Adding the point at
    infinity gives projective counts 37 and 20. This census does not
    recover a discrete logarithm. It is not point halving on a binary
    curve and it is not a Semaev decomposition.
  mechanism: >-
    Object frame. Representation: the multiset of affine x-coordinates
    of rational points, each x repeated once or twice according to the
    number of y. Operation set: the indicator that x lies in L. The
    projection discards y and the group law and retains two integers.
    It is lossy: many curves can share an imbalance. RQ-ECDLP-4fcbd3
    asks whether a coordinate bias carries discrete-log information
    that beats the square root. This record measures one imbalance gap
    at one prime and does not tabulate a discrete log. A bias that is
    only a difference of two point counts, with no character of the
    scalar, is not yet that information.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-6654ba
      provenance: internal
      claim: >-
        Point halving can replace addition in a rho step on binary
        curves. The F_29 split is a count of x-coordinates, not a
        halving step.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-6654ba.yaml
    - ref: KR-IC-5931ee
      provenance: internal
      claim: >-
        Naive Semaev index calculus over prime fields does not beat
        generic algorithms under the stated assumptions. This count is
        not an index-calculus run.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-5931ee.yaml
  assumptions:
    - >-
      A point with y = 0 contributes 1 to its half. A point with two
      square roots contributes 2. The session enumerated every x in
      F_29.
    - >-
      L is the fifteen residues 0 through 14 and U is the fourteen
      residues 15 through 28. A different cut is a different claim.
  proof_search_map:
    not_applicable_reason: >-
      This is a census of two finite point sets, not a proof that a
      coordinate predicate leaks a discrete log.
    bottleneck: >-
      The step that decides the gap is the pair of imbalances. A
      Fourier coefficient of a discrete-log character is not this pair.
    baseline_embedding:
      parameter_slice: >-
        F_29, E1 is y^2 = x^3 - x + 1, E2 is y^2 = x^3 + x, cut at 14.
      reproduction_check: >-
        A second enumeration returns the same four integers 20, 16, 10,
        and 9.
    observation_collision:
      observable: the imbalance gap
      distinct_preimage_search: >-
        Counting E1 twice must give gap 0. A nonzero self-gap means the
        count is not a function of the curve.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: the two (low, high) pairs
        predicted_gain: an imbalance gap of 3, or a recount that misses it
    quantifier_order: >-
      The claim is two named curves at one prime and one cut. It does
      not say that every curve has a nonzero imbalance, and it does not
      say that the imbalance is correlated with a discrete log.
    method_ceiling:
      strongest_certifiable_claim: >-
        The four counts and the gap 3, or a recount that disagrees. No
        key recovery is certifiable from the counts.
      nearby_object_control: >-
        The same curve counted twice. The gap must be 0. A method that
        reports a gap there is not measuring the curve.
    proof_obligations:
      - claim: Each half-count is the number of affine points whose x lies in that set.
        responsibility: correctness
  predictions:
    - metric: absolute gap of the two imbalances |low - high|
      direction: different
      minimum_effect: the imbalances are 4 and 1, so the gap is 3
  minimal_test:
    design: >-
      For each x in F_29, count the affine points on each curve and add
      that multiplicity to L or U. Repeat E1. Do not compute a discrete
      log and do not run rho.
    controls:
      - >-
        Self-count: E1 counted twice has imbalance gap 0. A nonzero
        self-gap invalidates the scanner.
      - >-
        Projective check: low + high + 1 equals 37 on E1 and 20 on E2.
        A different total means a point was missed.
      - >-
        Singular refusal: a model with 4 A^3 + 27 B^2 = 0 is not scored.
        Both named discriminants are nonzero.
    required_metrics:
      - low and high on each curve
      - the two imbalances and their absolute gap
      - the self-count gap
      - the projective totals
  falsification_conditions:
    - A recount returns any (low, high) pair other than (20, 16) and (10, 9).
    - The self-count gap is not 0.
    - low + high + 1 disagrees with 37 or 20.
    - The writeup treats the gap 3 as a discrete logarithm or as a rho step count.
  confounders:
    - >-
      The sets L and U have 15 and 14 elements, so a uniform x would not
      have equal expectations. The claim compares two curves at the same
      cut. It does not claim that either imbalance is a deviation from
      a fitted density.
    - >-
      Swapping the names of L and U replaces each imbalance by itself,
      because the claim uses the absolute value. Swapping and then
      subtracting signed counts would be a different statistic.
  interpretation_limits:
    - >-
      KR-RHO-6654ba is binary point halving. This gap is not a halving
      iteration and does not change the exponent 1/2.
    - >-
      KR-IC-5931ee says naive prime-field index calculus does not beat
      generic methods. This census does not beat them.
    - >-
      A coordinate count without a character of the scalar is not a
      key-recovery distinguisher. Toy field only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. The half-counts are exact cardinalities
        of the fibers of the x-coordinate over two explicit subsets of
        a 29-element field.
      rigorous_support: >-
        The curve equation decides the number of y above each x by the
        Legendre symbol, which on a prime field is an exact character.
        The sum over 29 residues is finite.
      validation_plan: >-
        Enumerate all 29 residues twice, independently, on each curve.
        Comparison distribution: equality of the four integers, not a
        probabilistic law. Tail check: every x that contributed a point
        has a square right-hand side, and every x that contributed
        nothing does not.
  target_complexity:
    time_exponent: 1/2
    memory_exponent: 1/2
    best_known: >-
      Pollard rho at exponent 1/2. The top frontier-map hit for this
      claim text is KR-RHO-6654ba, binary point halving, which changes
      a step cost and not the exponent. This census does not use halving.
    hidden_overhead: >-
      None is claimed. The work is 29 Legendre symbols on two cubics.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. A distinguisher that beat
      the square root would be a different claim and is not made here.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    KR-RHO-6654ba dominates any reading of the half-split as a rho
    halving step. KR-IC-5931ee dominates any reading of it as a
    prime-field index-calculus improvement. Neither reading is the
    claim. The discrete-log exponent delta is 0. The four integers
    20, 16, 10, and 9 are not recorded in those rows.
  sota_delta: >-
    Prime-field ECDLP time-exponent delta is 0 relative to rho at
    exponent 1/2. Memory-exponent delta is 0. The quantity that is
    claimed to differ is the imbalance of lower-half versus upper-half
    x-counts, 4 on y^2 = x^3 - x + 1 against 1 on y^2 = x^3 + x, over
    F_29.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-6654ba
      - KR-IC-5931ee
    nearest:
      - ref: KR-RHO-6654ba
        provenance: internal
        relation: orthogonal
        delta: >-
          Top frontier-map hit. The row is binary point halving as a
          rho step. This idea counts x-coordinates on two odd prime
          field curves. Exponent delta 0. It adds the gap 3, which that
          row does not record.
      - ref: KR-IC-5931ee
        provenance: internal
        relation: orthogonal
        delta: >-
          The row says naive Semaev index calculus over prime fields
          does not beat generic algorithms. This census is not a
          decomposition. Exponent delta 0.
    searched:
      corpus_grep:
        - ledger/proposals on origin/main for this F_29 half-count
        - pull requests 1928 and 1929, which record other point statistics and not this split
      web: []
      blocked:
        - Zhang-Wang 2011 was not opened. Novelty stays unverified.
  status: proposed
  added: '2026-10-06'
  approved_by: null
