idea:
  id: IDEA-20261002-5abffe
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    DOES AFFINE SEMI-REGULAR d_reg OVERSHOOT MEASURED SOLVING DEGREE BY
    ≥γ ON TOY S_3 WEIL DESCENT? On binary toys n∈{17,19,23} with frozen
    ℓ∈{3}, compare the Kudo–Yokoyama-style affine semi-regular d_reg
    prediction to measured solving degree d_sol and test d_reg − d_sol ≥ γ.

  class: heuristic_validation

  claim: >-
    KR-IC-0d2021 refines degree-of-regularity / solving-degree predictions
    for affine semi-regular sequences; KR-IC-fbdb61 states that
    semi-regular predictions do not describe descended summation systems
    and that last-fall / solving degree are distinct invariants. Neither
    freezes a signed overshoot band d_reg − d_sol ≥ γ on RQ-BINSTD toys.
    CLAIM: for each (n,ℓ)∈{17,19,23}×{3}, across ≥12 independent descended
    S_3 systems under a shared Gröbner/encoder pin, median
    (d_reg_pred − d_sol_meas) ≥ γ with γ frozen at Stage 0 — OR the band
    fails and is recorded as semi-regular-dreg-not-overshooting-dsol at
    this scale. CLAIM TIER: heuristic_validation. NO break. NO exponent.
    NO n≥131 transfer. Distinct from IDEA-20261001-556cea (solving degree
    near first-fall 2), 214fd3 (last-fall bound as n grows), and the
    Assumption-1 dispute itself (KR-IC-889857).

  mechanism: >-
    OBJECT FRAME. Representation: descended S_3 PDP system over FB
    {P : x(P)∈V}; Operation A: compute affine semi-regular d_reg
    prediction from system shape (KR-IC-0d2021 family); Operation B:
    measure solving degree d_sol on the same system under a shared
    Gröbner pin; Observable: median signed gap d_reg − d_sol.
    Trichotomy: Class I instrument (prediction-calibration meter).
    Lossy-projection: degree gap discards which monomials drive the
    fall; null is a matched random affine semi-regular system of the
    same shape for which the prediction is calibrated by construction
    (gap near 0). OFF-LIMITS: first-fall proximity (556cea); last-fall
    n-growth (214fd3); claiming Assumption 1 true/false (889857).
    WHAT IS NEW: a frozen γ overshoot band of semi-regular d_reg vs
    measured d_sol on RQ-BINSTD toys.

  novelty_status: unverified
  prior_art:
