  assumptions:
    - Frozen ℓ=3, γ, seeds, Gröbner/encoder pin, d_reg predictor definition.
    - Predictor and Gröbner path already admitted or cell is
      failed_infrastructure (do not provision Magma/Sage mid-tick).
    - Degree gap ≠ first-fall proximity ≠ last-fall bound.
    - Gap ≥ γ ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-5abffe-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3}: across ≥12 independent descended S_3
        systems, median (d_reg_pred − d_sol_meas) ≥ γ with γ frozen at
        Stage 0.
      random_model_justification: >-
        Rigorous: KR-IC-fbdb61 argues semi-regular sequences do not model
        Weil-descended summation systems; KR-IC-0d2021 supplies the
        affine semi-regular predictor being tested. Classical: if the
        descended system is structurally easier than a semi-regular
        system of the same shape, the predictor overshoots by a positive
        γ; if the systems behave semi-regularly at toys, the band fails.
        The γ band is the pre-registered calibration hypothesis — not a
        claim that binary ECDLP is subexponential or that Assumption 1
        holds (KR-IC-889857).
      supporting_results:
        - KR-IC-fbdb61
        - KR-IC-0d2021
        - KR-IC-1fcdbc
      validation_experiment_ids: []
      falsification_condition: >-
        Median gap < γ at a completed cell
        (semi-regular-dreg-not-overshooting-dsol), OR Gröbner / predictor
        absent (infrastructure stop), OR fewer than 12 completed systems
        after the budgeted catalog (inconclusive; expand or stop).

  predictions:
    - metric: median_dreg_minus_dsol
      direction: lower_bounded
      minimum_effect: '≥ γ at each (n,ℓ) cell'
    - metric: completed_system_count
      direction: lower_bounded
      minimum_effect: '≥ 12 systems per cell'
    - metric: null_semiregular_gap
      direction: near_zero
      minimum_effect: 'null median |gap| ≤ ε with ε frozen'

  minimal_test: >-
    Stage 0: freeze ℓ=3, γ, ε, seeds, Gröbner pin, d_reg predictor.
    Stage 1: n=17 — ≥12 systems; report median gap.
    Stage 2: n∈{19,23} + matched semi-regular null. Budget: ≤8 CPU-hours.
    Stop if Gröbner / predictor absent (IMP, never evidence; do not provision).

  controls:
    - ctl_frozen_gamma_epsilon
    - ctl_shared_groebner_pin
    - null_matched_semiregular_systems
    - ctl_no_posthoc_gamma_edit
    - ctl_no_midtick_lib_provision
    - ctl_no_assumption1_adjudication

  falsification_conditions:
    - Claiming practical / subexponential binary IC from a toy degree gap.
    - Equating this meter with d_sol≈first-fall (556cea) or last-fall vs n (214fd3).
    - Editing γ after seeing gaps.
    - Transferring the band to n≥131 without a new contract.
    - Adjudicating KR-IC-889857 from this meter alone.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Prediction-calibration instrument only; a held
      γ band does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-system d_reg and d_sol.
    best_known: >-
      KR-IC-fbdb61 (semi-regular fails on descended systems) /
      KR-IC-0d2021 (affine semi-regular refinements).
    hidden_overhead: Gröbner pin constants independent of the γ band.
    tradeoff_note: >-
      Degree gap is not runtime; a large overshoot can coexist with
      still-superlinear solve cost.

  estimated_cost:
