  minimal_test:
    design: |-
      Gates G0-G3 of PR #2041. Re-use the panel's certified pairs (pairs/ at bbd330a9d); add intermediate-level and composite-ratio pairs where neither curve lies over a proper subfield. Randomized paired order on pinned hardware, >= 10 paired seeds per pair, same-conductor and isomorphic-model controls, label-permutation null; paired bootstrap, permutation test, censor-aware survival analysis, multiplicity correction. Binary n in {17, 19, 23} first; m in {31, 51, 53, 83} only after G2 (m=51 is composite, so not a no-subfield cell).
