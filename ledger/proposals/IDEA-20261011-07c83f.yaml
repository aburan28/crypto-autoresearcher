  title: Conductor-gap paired relation cost with SAT and F4/F5 arms and intermediate levels - the closing test after the toy crater-versus-floor null
  class: measurement
  claim: |-
    On matched pairs of ordinary curves (same field, trace t, group order N and prime subgroup r) with certified, different endomorphism conductors f_E, the paired log ratio of total seconds per newly independent verified relation (construction, failed searches, timeouts as censored, duplicates, lifting, verification, rank updates all charged) under CDCL-XOR SAT and F4/F5 arms has a confidence interval excluding 0 by more than the spread of the within-isomorphism control. The program's own panel found no gap with MITM and F4 arms at crater-versus-floor, so this tests solver families and levels it did not run and is expected to close at H0 (no gap).
  mechanism: |-
    OBJECT FRAME. Representation: R2 (Weierstrass equation over F_q); a pair is joined by a vertical isogeny phi of degree f_E1/f_E2 (coprime to r), so ECDLP transports exactly (KR-RHO-755e35). Sigma = phi. Trichotomy: coordinate-dependent (IDEA-20260806-c5d183): any cost difference is a function of the equation and of the shape of the Weil-descended system, not of the group element. The conductor is invisible on the prime-order subgroup (every endomorphism is a scalar, H-ENDO-001), so a gap can only come from system structure. Decisive inequality, priced end to end: a transfer gain needs C(E_hard) > C(E_easy) + C_phi, with C_phi the certified isogeny evaluation cost. F3 (isogeny path) is a component, not the lens. Stage: decomposition.
