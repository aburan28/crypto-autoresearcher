idea:
  id: IDEA-20260809-33f26f
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AEADC-8db132
  goal_id: GOAL-AEADC-001
  title: >-
    Measure the k-way collision cost curve, because the partitioning attack's
    economics live in that curve and it is always assumed rather than measured
  class: measurement
  claim: >-
    Extending a two-key collision to k keys costs more, and the shape of that
    cost in k determines how many candidate keys a partitioning oracle can test
    per query — the quantity that decides whether such an attack is practical.
    The claim is that the cost is polynomial in k with a small exponent set by
    the linear-algebra dimension, that the ciphertext length grows linearly in k,
    and that both are measurable directly across a declared range.
  mechanism: >-
    The tag-equality conditions for k keys form k linear constraints; satisfying
    them requires at least k free ciphertext blocks. Cost is therefore dominated
    by solving a k-dimensional system over the field, with ciphertext length
    linear in k.
  why_not_a_renamed_known_approach: >-
    The k-way extension is known in principle. The measured curve — construction
    time, ciphertext length, and any failure rate, all as functions of k on one
    implementation — is what this record produces, and it is what an implementer
    reasoning about oracle throughput actually needs.
  predictions:
  - observable: construction time versus k
    metric: seconds versus k over a declared range
    predicted: Polynomial with small exponent. Superpolynomial growth would falsify the linear-algebra account of the construction.
  - observable: ciphertext length versus k
    metric: bytes versus k
    predicted: Linear with slope one block per key; a different slope means the constraint count is not what the mechanism claims.
  minimal_test: >-
    Construct certificates for k across a declared range with declared seeds,
    record time and length per k, verify every certificate under all k keys with
    an independent implementation, and fit both curves.
  controls:
  - 'ALL-KEY VERIFICATION: each k-way certificate must verify under ALL k keys, checked independently; verifying under a subset is the easy way to overstate the result.'
  - 'RANDOM-KEY NULL: the same ciphertext must fail under k additional unrelated keys.'
  falsification_conditions:
  - Construction time grows superpolynomially in k.
  - Certificates fail to verify under all k keys beyond some small k, which bounds the achievable k and must be reported as the boundary.
  interpretation_limits: >-
    The curve is a construction cost, not an attack cost against any system. Any
    statement about oracle throughput is a generic pattern description with no
    deployment named.
  sota_delta: 'No attack. Delta: two measured curves where the literature has an existence statement.'
  dominated_by: Downstream of IDEA-20260809-313546; not dominated by any corpus record.
  estimated_cost: Implementation small; compute low to moderate at the top of the k range.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no AEAD commitment records. WEB NOT CHECKED.'
