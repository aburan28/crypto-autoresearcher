idea:
  id: IDEA-20260805-decb14
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  added: '2026-08-05'
  title: >-
    This corpus already contains the calibration gate that catches its own broken
    Dickman table, and never pointed it at it: a cross-implementation smoothness
    comparator register, plus the exact fixed-B correction the register makes
    unavoidable
  class: control

  claim: >-
    Three independent implementations of the Dickman-de Bruijn function live in
    this repository and no record compares any two of them.
      (i)  experiments/EXP-LPF-001/implementation/lpf001_driver.py, composite
           Simpson with an implicit right endpoint at grid 1/4000, carrying its
           OWN calibration report LPF-CAL-E, a FROZEN_RHO_TABLE at u = 1..6, and
           a declared DICKMAN_REPRODUCTION_TOLERANCE of 1 per cent (READ, lines
           114-118 and 399-455).
      (ii) experiments/EXP-DS-001/implementation/ds001_driver.py, forward Euler
           at grid 0.01, with NO calibration report and NO reference table
           (READ, lines 130-156).
      (iii) coordination/tasks/TASK-20260724-P13-REV-R1/numerical_checks.py, a
           log-space table interpolated to u = 260 (READ, lines 45-60).
    Implementation (ii) returns 5.249470e-02 at u = 3 against implementation
    (i)'s own frozen 0.048608 -- an 8.0 per cent discrepancy, EIGHT TIMES that
    implementation's declared 1 per cent tolerance -- and 2.064216e-03 at u = 6
    against the frozen 0.000019650, a factor of 105. THE GATE THAT WOULD HAVE
    CAUGHT THIS IS ALREADY WRITTEN, ALREADY FROZEN, AND ALREADY IN THE SAME
    REPOSITORY. It was simply never applied outside the experiment that authored
    it. That is not a mathematical failure; it is an unbuilt register, and
    building it is cheap, permanent, and serves every goal that costs a
    smoothness-limited step.
    The register forces a second thing the corpus has never written down. Every
    consumer of rho here uses it as a stand-in for the density of B-smooth
    integers below D. That substitution is asymptotic in B. Where B is FIXED and
    small -- HEUR-DS-1 fixes B in {64, 128, 256} while growing D -- the true
    density is an EXACT finite count, and it exceeds rho(u) by 3.89x, 7.25x,
    14.86x, 33.4x and 81.97x at D = 2^32, 2^40, 2^48, 2^56, 2^64 with B = 64,
    a correction that grows without bound. The register records both the
    implementation value and the exact value, per cell, so that no future record
    has to choose between them from memory.

  object_first_candidate:
    tracked_object: >-
      The smoothness comparator as a CORPUS-LEVEL OBJECT: the map
      (D, B) -> p0, followed across every implementation, every frozen table,
      and every record in this repository that consumes one. Not a curve, not a
      polynomial system, not an attack. The shared numerical dependency that
      cost models in at least four goal families inherit without ever
      reconciling.
    established_families_off_limits: >-
      OFF-LIMITS as the primary lens: index calculus, factor-base design, Semaev
      polynomials, Groebner solving degree, claw and meet-in-the-middle search,
      lattice reduction, isogeny walks, information-set decoding, and every other
      attack family in this program. This proposal is an infrastructure and
      measurement-integrity proposal. It uses no attack lens at all, which is the
      structural reason it cannot be a repackaging of prior art in this goal.
    newness_score: >-
      Nothing about the mathematics is new; the Dickman function is a century
      old and exact smooth counting is textbook. What is new to this corpus,
      MEASURED at HEAD and not relayed: 179 files mention Dickman, three files
      implement rho, one of the three carries a calibration report, and ZERO
      files compare implementations or record an exact fixed-B correction.
      The strongest form of the observation is not "we should build a register"
      but "the register's own acceptance criterion already exists in this
      repository and one implementation fails it by four orders of magnitude".
    testability_score: >-
      Complete and immediate. Every cell of the register is either a rerun of
      committed code or an exact integer count. There is no sampling, no seed,
      no solver, and no scale extrapolation anywhere in the deliverable.
    survival_score: >-
      The object is permanent. A comparator register does not decay with n, m,
      or bit size, and it is consumed rather than superseded: any later record
      that quotes a smoothness probability can cite a cell instead of
      recomputing one badly.

  mechanism: >-
    DERIVED AND COMPUTED HERE, OUTSIDE THE HARNESS, IN PURE PYTHON. Every number
    is GENERATOR-COMPUTED and must be re-derived in-harness before citation.

    A. THE THREE IMPLEMENTATIONS AND WHAT THEY RETURN. The Dickman function is
    defined by u rho'(u) = -rho(u-1) with rho == 1 on [0,1], equivalently by the
    integral form u rho(u) = integral_{u-1}^{u} rho(t) dt. Implementation (i)
    solves the integral form by composite Simpson at h = 1/4000, implicit in the
    right endpoint -- second order or better, and it CHECKS ITSELF against a
    frozen table. Implementation (ii) solves the differential form by explicit
    forward Euler at h = 0.01 -- first order, with a global ABSOLUTE error of
    order h. Because rho falls through that error floor at u of about 4 to 5, the
    two agree at small u and diverge without bound at large u. Side by side,
    against the frozen table already in the repository:
      u    frozen (LPF)      Euler h=0.01 (DS)    ratio
      2    0.30685           3.093466e-01         1.008
      3    0.048608          5.249470e-02         1.080
      4    0.0049109         8.258069e-03         1.682
      5    0.00035473        2.932884e-03         8.268
      6    0.000019650       2.064216e-03         105.1
    Implementation (i)'s DICKMAN_REPRODUCTION_TOLERANCE is 1 per cent. (ii)
    breaches it at u = 3 and misses by two orders at u = 6. The frozen table
    STOPS AT u = 6; HEUR-DS-1 evaluates at u = 5.333, 6.667 and 8.000, i.e.
    OUTSIDE the range any committed reference table in this repository covers.
    Extending the frozen table is therefore itself a deliverable.

    B. THE EXTENSION, COMPUTED HERE. rho re-solved from the integral form on
    h = 5e-5 with the implicit trapezoid endpoint, cross-checked against the
    repository's own frozen table (agreement +6.9e-9 at u = 3, +5.3e-9 at u = 5,
    and against RECALLED-UNVERIFIED reference values +1.5e-5 at u = 8 and
    -3.3e-5 at u = 10, the recalled values being corroboration only):
      rho(16/3) = 1.38910e-04   rho(20/3) = 2.52288e-06   rho(8)    = 3.23207e-08
      rho(28/3) = 3.10469e-10   rho(32/3) = 2.33295e-12
    The corresponding Euler-h=0.01 values are 2.51651e-03, 1.79573e-03,
    1.44313e-03, 1.20858e-03, 1.03904e-03 -- ratios 18.1, 712, 4.47e4, 3.89e6,
    4.45e8.

    C. WHY rho IS NOT THE RIGHT COMPARATOR AT FIXED SMALL B, AND WHAT IS.
    Psi(x, y) ~ x rho(u) with u = log x / log y is a statement about y growing.
    At FIXED y the y-smooth integers below x are the lattice points of a fixed
    dimension pi(y) simplex, so Psi(x, y) grows only polylogarithmically in x
    while x rho(u) does not track it. For y = 64 there are 18 primes and the
    count is EXACT by the partition of the y-smooth integers below N according to
    whether p_k divides them:
      Psi(N, k) = Psi(N, k-1) + Psi(floor(N / p_k), k),  Psi(N, 0) = 1 for N >= 1.
    Exact integer results computed here (no floating point anywhere in the
    recursion):
      Psi(2^32, 64) =     2,320,213    Psi/D = 5.402167e-04
      Psi(2^40, 64) =    20,097,408    Psi/D = 1.827849e-05
      Psi(2^48, 64) =   135,168,022    Psi/D = 4.802133e-07
      Psi(2^56, 64) =   747,101,831    Psi/D = 1.036812e-08
      Psi(2^64, 64) = 3,527,728,593    Psi/D = 1.912386e-10
    Psi/(D rho(u)) = 3.889, 7.245, 14.86, 33.40, 81.97 -- monotone increasing,
    exactly as a fixed-y regime demands. The decay per four bits is 29.6x, 38.1x,
    46.3x, 54.2x for the exact density against 55.1x, 78.1x, 104x, 133x for rho:
    the two comparators do not even have the same slope, so a fit calibrated on
    one is not transportable to the other.
    HONEST GAP: the same counts for B = 128 (31 primes) and B = 256 (54 primes)
    were attempted here and the recursion exceeded available memory before
    completing the 2^48 cell. Those rows are MISSING, are reported missing, and
    are NOT extrapolated. Making them tractable (memoise on the exponent vector
    rather than on N, or Bernstein-style bucketed counting) is a stated
    implementation task, not a mathematical obstacle.

    D. WHAT THE REGISTER IS. One machine-readable table, one row per
    (D, B, consumer), carrying: the consumer record id; the implementation it
    used and that implementation's grid; the value it used; the value the
    reference solver returns; the exact Psi/D where pi(B) makes the count
    feasible; the ratio of each to each; and a flag when the implementation value
    breaches the 1 per cent tolerance the corpus itself already declares. The
    register is DERIVED, so it is rebuilt on demand and never committed as
    authority -- the same discipline CLAUDE.md applies to knowledge/INDEX.md.

    E. WHY THIS IS NOT A TIDYING TASK. A comparator that is too large by 4.47e4
    does not merely add noise; it fixes the SIGN and the TREND of every
    discrepancy computed against it. In the one consumer examined in detail
    (HEUR-DS-1, see IDEA-20260805-83344d) the reported ratio p_hat/p0 falls
    58.6 -> 26.9 -> 11.1, which reads as convergence, while against either
    corrected comparator it rises 1.06e3 -> 1.92e4 -> 4.95e5. Twelve evidence
    records reference that heuristic. The register's value is that this question
    -- "which comparator was this record measured against" -- becomes answerable
    by lookup instead of by re-deriving numerics inside every future session.

  novelty_status: unverified

  literature_context:
    - >-
      Dickman (1930), de Bruijn (1951), Canfield-Erdos-Pomerance (1983) for rho
      and for Psi(x,y) ~ x rho(u); Ennola and de Bruijn for the fixed-y regime;
      Bernstein for practical exact smooth counting. ALL NOT READ. No claim in
      this proposal depends on any of them: rho is re-solved from its defining
      equation and Psi is counted exactly. They are named so a reviewer knows
      where to look, not cited as support.
    - >-
      IN-REPOSITORY AND READ: experiments/EXP-LPF-001/implementation/
      lpf001_driver.py lines 114-118 (FROZEN_RHO_TABLE, tolerance 0.01) and
      399-455 (the Simpson solver and LPF-CAL-E reproduction report);
      experiments/EXP-DS-001/implementation/ds001_driver.py lines 130-156;
      coordination/tasks/TASK-20260724-P13-REV-R1/numerical_checks.py lines
      45-80. The last of these validates rho(2) against 1 - ln 2 and prints
      rho at u = 3..10, i.e. a THIRD independent reference point already exists
      in the corpus and has never been compared with the other two.
    - >-
      MEASURED AT HEAD, not relayed: 179 files match "dickman" case-insensitively
      (ledger 35, experiments 43, knowledge 3, coordination 83, harness 1,
      research 1, docs 3); three .py files define a rho solver. No file was found
      that compares two of them. Absence of a search hit is not evidence that no
      comparison exists (AGENTS.md retrieval policy); it is reported as a
      measured absence.
    - >-
      The angle brief for this session reports "Dickman rho (26 files)" among
      unnamed inherited assumptions. RELAYED from that brief and NOT verified as
      the same count; the 179 measured here uses a different pattern and the two
      numbers are not comparable. Recorded so the discrepancy is visible rather
      than silently reconciled.

  lossy_projection_identifiability_audit:
    projection: >-
      (an integer N and a bound B) -> (u = log N / log B) -> (p0 = rho(u)).
    what_is_discarded: >-
      Everything about N except its logarithm, and everything about B except its
      logarithm. In particular the ARITHMETIC of B is discarded: rho(u) cannot
      distinguish B = 64 (18 primes) from a hypothetical smooth-parameter regime
      with the same u, and that is exactly the information the fixed-B correction
      restores.
    why_genuinely_lossy: >-
      Genuinely lossy and, for large B, appropriately so -- that is the content
      of the Dickman/CEP asymptotic. The audit's finding is that the discard is
      NOT compatible with the operations in the fixed-small-B regime: pi(B)
      enters the true count as the DIMENSION of the counting simplex, and u alone
      does not carry it.
    is_it_only_a_change_of_coordinates: >-
      WHICH FAILURE WAS CHECKED AND WHAT IT RETURNED. Checked for the mirror
      failure (a projection so lossy it is constant across instances): p0 does
      vary strongly with the cell under a correct solver -- 1.39e-4 down to
      2.33e-12 across the five cells -- so the projection is NOT constant when
      computed correctly. It IS very nearly constant when computed by
      implementation (ii): 2.52e-3 down to 1.04e-3 over the same range. So the
      mirror failure is present in the IMPLEMENTATION and absent from the
      MATHEMATICS, which is precisely the distinction a register makes visible
      and no single-record audit does. The (Delta, Pi) change-of-coordinates
      failure does not arise: nothing about N is recoverable from p0.

  assumptions:
    - >-
      That the three implementations named are all the rho solvers in the
      repository. Established by grep at HEAD over *.py for "def rho(" and
      "dickman", which will miss a solver written inline or under a different
      name. The register's first task is a wider sweep and it must report what it
      searched for.
    - >-
      That FROZEN_RHO_TABLE in lpf001_driver.py is itself correct. It agrees with
      an independent solve here to better than 1e-8 at u = 3 and u = 5, and with
      RECALLED-UNVERIFIED standard values. It is treated as a corroborating
      reference, never as an authority, and the register recomputes rather than
      copies it.
    - >-
      That exact Psi counting is feasible for B = 64 at the declared D. VERIFIED
      by having done it. NOT verified, and reported as a gap, for B = 128 and
      B = 256, where the naive recursion exhausted memory here.

  predictions:
    - metric: >-
        Reproduction of the corpus's own frozen table by each implementation:
        relative discrepancy of each of the three solvers against
        FROZEN_RHO_TABLE at u = 2, 3, 4, 5, 6
      direction: different
      minimum_effect: >-
        FORCED, STATED BEFORE THE RUN. Implementation (i) passes at 1 per cent by
        construction (it is its own gate). Implementation (ii) returns 1.008,
        1.080, 1.682, 8.268, 105.1 times the frozen values, so it BREACHES at
        u = 3 and every u above. Implementation (iii): no forced value is stated
        because its code path was read but not executed here; producing one is a
        register cell, not a claim.
    - metric: >-
        Grid-refinement behaviour of implementation (ii): rho_driver(8, h)/h at
        h in {0.01, 0.005, 0.002, 0.001}
      direction: different
      minimum_effect: >-
        FORCED: 0.14431, 0.14443, 0.14451, 0.14455. Constant to 0.2 per cent,
        which identifies the discrepancy as a first-order absolute error floor
        rather than a coding error. A non-constant ratio falsifies the diagnosis.
    - metric: >-
        Exact Psi(2^(2 bits), 64) for bits in {16, 20, 24, 28, 32}
      direction: different
      minimum_effect: >-
        FORCED EXACT INTEGERS: 2320213, 20097408, 135168022, 747101831,
        3527728593. Any differing digit means one implementation of the recursion
        is wrong and must be resolved before the register is published.
    - metric: >-
        The fixed-B correction factor Psi(D,B) / (D rho(u*)) as a function of
        bits at B = 64
      direction: higher
      minimum_effect: >-
        FORCED: 3.889, 7.245, 14.86, 33.40, 81.97, STRICTLY INCREASING. If the
        measured sequence is not strictly increasing, the fixed-y reasoning is
        wrong and the register must report rho and the exact count as
        unreconciled rather than as a correction.
    - metric: >-
        Register coverage: number of corpus records quoting a numeric smoothness
        probability or rho value at u > 4 whose source implementation can be
        identified from committed artifacts
      direction: different
      minimum_effect: >-
        NO FORCED VALUE IS AVAILABLE -- the sweep has not been run and inventing
        a target would be a fabrication. The deliverable is the count itself,
        together with the count that CANNOT be attributed, which is the more
        useful of the two.

  minimal_test:
    design: >-
      Three stages, cheapest decisive first. STAGE 1 (seconds, terminating):
      run all three committed solvers against FROZEN_RHO_TABLE and report the
      discrepancy matrix. IF ALL THREE PASS AT 1 PER CENT THERE IS NO FINDING AND
      THE PROPOSAL ENDS HERE -- this is the stage that can kill it. STAGE 2
      (minutes): extend the reference solve to u = 12 with two independent
      schemes and a Richardson check, and compute the exact Psi table at B = 64;
      attempt B = 128 and B = 256 and report honestly if they do not complete.
      STAGE 3 (bounded sweep): identify every corpus record quoting a smoothness
      probability at u > 4, attribute it to an implementation where the artifacts
      allow, and emit the register with a NOT-ATTRIBUTABLE column.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, ABLE TO
        FAIL: evaluate all three solvers at u = 2, where rho(2) = 1 - ln 2 =
        0.3068528194 EXACTLY IN CLOSED FORM. Every solver must return this to
        within 1 per cent. This null CAN fail -- a solver that misses a closed
        form is broken outright, and the register would then be reporting on
        rubble. Forced values: (i) passes by construction; (ii) returns
        3.093466e-01, error +0.81 per cent, PASSES; (iii) already prints this
        check in its own source and its result is unread here.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: the exact
        count must reproduce a hand-checkable case. Take y = 5, N = 100: the
        5-smooth integers below 100 can be listed by hand. FORCED VALUE derived
        before the run by direct enumeration: 34. If the recursion does not
        return 34 there, NO Psi value from it may be used and no negative about
        any comparator may be reported. A second, larger positive control ties
        the count to a measurement: 200,000 uniform draws below 2^32 tested for
        64-smoothness by trial division must yield 108.0 expected hits, Poisson
        sd 10.4, band [80, 140].
      - >-
        GRADED CONTROL, FOUR INTERIOR POINTS, MONOTONICITY REPORTED: the grid
        refinement h = 0.01, 0.005, 0.002, 0.001 on implementation (ii). The
        quantity that must vary is the returned value (linearly in h) and the
        quantity that must NOT is the ratio to h. Reporting both directions is
        what distinguishes a discretization floor from a wrong recurrence.
      - >-
        SECOND GRADED CONTROL, FIVE POINTS: the fixed-B correction across
        bits = 16, 20, 24, 28, 32 must be monotone increasing. A non-monotone
        sequence localises an error in the counting rather than leaving "the
        numbers disagree".
      - >-
        ORDERING CONTROL: the discrepancy matrix for stage 1 is computed and
        committed BEFORE any consumer record is attributed in stage 3, so the
        register cannot be assembled around a conclusion about a particular
        record.
    required_metrics:
      - discrepancy matrix, three solvers by five frozen u values, with each solver's grid recorded
      - two-scheme reference rho at u = 2..12 with the Richardson estimate and the disagreement
      - exact Psi(D, 64) at five D, with the hand-checked Psi(100, 5) = 34 control
      - fixed-B correction factors with monotonicity stated
      - list of corpus records quoting a smoothness number at u > 4, each attributed or explicitly not attributable
      - explicit MISSING rows for B = 128 and B = 256 where the count did not complete

  falsification_conditions:
    - >-
      All three solvers reproduce FROZEN_RHO_TABLE within 1 per cent. There is no
      cross-implementation finding; the register may still be worth building but
      this proposal's headline is withdrawn.
    - >-
      Psi(100, 5) != 34. The counting implementation is wrong and no Psi row may
      be published.
    - >-
      The 200,000-draw positive control misses [80, 140]. Either the exact count
      or the sampler is wrong; no negative about any comparator may be reported.
    - >-
      The fixed-B correction is not monotone increasing in bits. The fixed-y
      argument is wrong as stated and must be rewritten before use.
    - >-
      Fewer than two corpus records outside EXP-DS-001 consume a rho value at
      u > 4. The register's blast radius is then one experiment, the
      cross-cutting framing is unsupported, and the honest deliverable shrinks to
      a single-experiment note.

  confounders:
    - >-
      A REGISTER IS NOT EVIDENCE. It is a derived index. It must be rebuilt on
      demand, must never be committed as authority, and must never be cited in
      place of the record it points at. The failure mode to avoid is a future
      agent citing a register cell as though it were a measurement.
    - >-
      ATTRIBUTION IS OFTEN IMPOSSIBLE. Many records quote a probability without
      naming the code that produced it. The NOT-ATTRIBUTABLE column is the honest
      answer and must not be filled by inference from proximity.
    - >-
      SELECTION. The one consumer examined closely (HEUR-DS-1) was chosen because
      its numbers were already in front of this session. That is a biased sample
      of size one, and the register exists precisely to replace it with a census.
    - >-
      THE CORRECTION MAY NOT MATTER FOR SOME CONSUMERS. A record that uses rho
      only for an order-of-magnitude sanity check is not damaged by a factor of
      3.9. The register must report the correction, not adjudicate its
      consequence, which belongs to whoever owns the consuming record.
    - >-
      IMPLEMENTATION (ii) IS NOT NECESSARILY WRONG WHERE IT WAS DESIGNED TO BE
      USED. At u <= 3 it is within 8 per cent. Describing it as "broken" without
      the range qualifier would overstate, and every statement in the register
      carries its u range.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO CLAIM ABOVE toy anywhere in this proposal. It
      creates no new capability and moves nothing on any Pareto axis.
    - >-
      NO STATUS CHANGE is proposed for any record, heuristic, experiment or goal,
      including EXP-DS-001, EXP-LPF-001, and the P13 review task. The register
      reports; the Coordinator decides.
    - >-
      A register cell showing a large discrepancy does NOT by itself invalidate
      the consuming record. It shows that the record's comparator differs from
      the reference by a stated factor. Whether that changes the record's
      conclusion is a separate question with a separate owner, and conflating the
      two would be exactly the overreach this program is built against.
    - >-
      The exact Psi rows are exact FOR UNIFORM INTEGERS BELOW D. If a consumer's
      population is not uniform below its declared D, neither comparator is
      correct for it and the register must say so in that row rather than pick
      one.
    - >-
      FORWARD GUIDANCE. Open regardless of outcome: exact counting at B = 128 and
      B = 256, which needs a better algorithm than the naive recursion; the
      corresponding correction for the LPF/largest-prime-factor CDF that KS-DS-1
      consumes, which is a different function of the same regime and is NOT
      addressed here; and whether any consumer outside the ECDLP families
      (P13/isogeny cost models are the obvious candidate) inherits the same
      substitution.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE IS LOAD-BEARING IN THE HEADLINE. The comparison of implementations
        is arithmetic against a frozen in-repository table; the exact counts are
        exact integers; the grid-refinement diagnosis is a measured scaling.
      rigorous_support: >-
        The Psi recursion is proved by partitioning the y-smooth integers below N
        according to divisibility by the largest allowed prime. Forward Euler's
        O(h) global absolute error is standard, and its coefficient is measured
        here rather than assumed.
      validation_plan: >-
        Psi(100, 5) = 34 by hand enumeration; a 200,000-draw sampling control
        tying the exact count to a measurement; two independent rho schemes with
        Richardson extrapolation.
    - id: H2
      statement: >-
        That the fixed-B correction factor continues to grow beyond the computed
        range, i.e. that rho remains an increasingly poor stand-in as D grows at
        fixed B.
      rigorous_support: >-
        Qualitatively forced by dimension: at fixed B the count is bounded by the
        number of lattice points in a pi(B)-dimensional simplex of side
        log D / log 2, which is polynomial in log D, while D rho(u) is not. This
        is a sketch, not a proof, and is labelled one.
      validation_plan: >-
        Report the five computed factors and their differences; state the
        asymptotic claim as unproved. No extrapolation beyond the computed rows
        enters the register.

  target_complexity:
    time_exponent: >-
      n/a. THIS PROPOSAL MOVES NO EXPONENT AND SAYS SO PLAINLY. It is worth
      running because a comparator that is wrong by 4.47e4 fixes the sign and the
      slope of every discrepancy measured against it, and this program computes
      such discrepancies constantly. Exponent-first ambition is the house bias
      and this proposal does not satisfy it; it is proposed as infrastructure
      that protects exponent claims, not as one.
    memory_exponent: >-
      n/a for the deliverable. Noted as an implementation cost: the naive Psi
      recursion memoises on N and exhausted memory at B = 128; the register needs
      a bounded-memory counting routine, which is the only real engineering in
      the proposal.
    best_known: >-
      Pollard rho at N^{1/2} with negligible memory remains the ECDLP baseline.
      Unaffected in either direction.
    hidden_overhead: n/a.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed, no algorithm proposed, no Pareto point offered).
    ROWS CHECKED before writing n/a: time -- Pollard rho N^{1/2}, van
    Oorschot-Wiener N^{1/2}/w, BSGS N^{1/2}; memory -- rho O(1) versus BSGS
    N^{1/2}; data/queries -- not applicable, no oracle and no samples beyond two
    small controls. None of these dominates a comparator register because none is
    the same kind of object. The domination question that DOES apply is internal:
    is this register already built? Measured at HEAD, three rho implementations
    exist and no file compares two of them, and no file records an exact
    fixed-B smooth count. Measured absence, not proof of novelty.
  sota_delta: >-
    Zero on time, memory, data, queries and advice. On the measurement axis, the
    quantitative delta is the discrepancy matrix itself: one committed
    implementation exceeds the corpus's own declared 1 per cent reproduction
