idea:
  id: IDEA-20261007-469116
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Orbit sizes of 3-point relations under simultaneous Frobenius on
    y^2 = x^3 + 2x + 3 over F_23
  class: control
  claim: >-
    On E: y^2 = x^3 + 2x + 3 over F_23, let B be the first 9 affine
    points of E(F_{23^3}) in lexicographic order. Let N be the number
    of unordered triples of distinct points of B that sum to the point
    at infinity. Let Q be the number of orbits of those triples under
    applying the coordinate 23-power Frobenius to all three points at
    once. The claim is that N >= 1 and N/Q < 3. The representation is
    the relation triple. The discrete-log time exponent stays 1/2 and
    the delta versus Pollard rho is 0.
  mechanism: >-
    The trivial Frobenius symmetry on a factor base gives orbits of
    size 3 when no triple is fixed. An orbit of size 1 is extra
    symmetry: the relation is stable under pi. The ratio N/Q equals 3
    exactly when every orbit has size 3, and is strictly smaller when
    at least one orbit has size 1. The operation set is simultaneous
    Frobenius on the three points, not translation. The set B is a
    probe, not a claimed factor base for a faster algorithm.
  novelty_status: unverified
  citations:
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        A Frobenius-invariant factor base reduces the number of
        systems by up to 1/n. This proposal measures whether one toy
        list has a relation fixed by pi. It does not claim the 1/n saving.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-IC-46d822
      provenance: internal
      claim: Gaudry's exponent is 2-2/n for fixed n. One orbit ratio is not that exponent.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: The generic bound is on the order of the square root. This proposal does not undercut it.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  predictions:
    - metric: the ratio N/Q
      direction: lower
      minimum_effect: N >= 1 and N/Q < 3
  minimal_test:
    design: >-
      Recheck that 4*(2^3)+27*(3^2) is 22 mod 23, not 0. Enumerate
      affine points over F_{23^3}. Take the first 9 in lexicographic
      order. Count triples and orbits. A second enumeration in the
      opposite coordinate order must give the same point set before
      the prefix is cut, or the run is void. No discrete log is attempted.
    controls:
      - A zero discriminant voids the run.
      - Fewer than 9 affine points voids the run.
      - N = 0 is a named empty outcome. It is not success and it is not the negative.
      - Two passes over the same 9 points must agree on N and on Q.
    required_metrics:
      - N
      - Q
      - the ratio when N > 0, else the token empty
      - the affine point count
  falsification_conditions:
    - The instrument checks pass, N >= 1, and N/Q = 3.
    - N = 0 does not falsify the ratio. It withholds the ratio.
  confounders:
    - A triple fixed by a point permutation but not by Frobenius still has orbit size 3 under pi. Only simultaneous pi is quotiented.
    - The prefix of 9 points depends on the lexicographic order. The order is frozen before the count.
  interpretation_limits:
    - One curve, one extension, one prefix of 9 points.
    - An orbit of size 1 is not a faster index calculus and does not move the exponent.
    - The discrete-log exponent stays 1/2 whether or not the ratio is below 3.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At least one triple in this prefix is fixed by simultaneous
        Frobenius, so the mean orbit size is strictly less than 3.
        The existence is not proved. The null is that every orbit has
        size exactly 3.
      rigorous_support: >-
        Orbit size under a group of order 3 divides 3. KR-IC-b0fcda
        records that a fully invariant factor base saves up to 1/n
        systems. It does not say this 9-point prefix contains a fixed triple.
      validation_plan: >-
        Count N and Q on this prefix. Tail check: report the multiset
        of orbit sizes. If N/Q < 3 and every reported size is 3, the
        arithmetic is inconsistent and the run is void. The multiset
        does not replace the threshold.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "1/2 is unchanged; nine points are stored"
    best_known: >-
      Pollard rho at exponent 1/2 (KR-RHO-13bf67), Gaudry
      Õ(q^{2-2/n}) (KR-IC-46d822), and the 1/n factor-base saving
      (KR-IC-b0fcda). None is replaced.
    hidden_overhead: No o(1) term is claimed.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-RHO-13bf67, KR-IC-46d822, KR-IC-b0fcda, and
    KR-RHO-755e35, each opened on 2026-10-07. The factor-base row
    states a saving of up to 1/n for an invariant base. It does not
    state the orbit ratio of this 9-point prefix. The exponent
    claimed here is 1/2.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0. The pre-registered gap is N/Q < 3 against the
    trivial ratio 3, a difference that requires at least one orbit of
    size 1, and only when N >= 1.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-46d822
      - KR-IC-b0fcda
      - KR-RHO-13bf67
      - KR-RHO-755e35
    nearest:
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: adjacent
        delta: >-
          That row prices a fully invariant factor base at a saving of
          up to 1/n. This proposal asks whether one 9-point prefix on
          one curve has even one pi-fixed triple, and it claims no saving.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The generic lower bound is untouched. The output is one ratio.
    searched:
      corpus_grep:
        - "simultaneous Frobenius"
      web: []
      blocked:
        - "No web search in this session; novelty stays unverified."
