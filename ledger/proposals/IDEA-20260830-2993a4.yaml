    compute: low
    wall_clock: hours
    basis: >-
      Two counters added to an existing sweep implementation, a synthetic-oracle
      harness for the planted-value calibration, and a weighted least-squares fit with
      bootstrap CIs. Pure Python, p <= 2^16, B <= 256, peak memory under 20 MB. Stage 5
      at m = 4 is deliberately excluded from this budget.
