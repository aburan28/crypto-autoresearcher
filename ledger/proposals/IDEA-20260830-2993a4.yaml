idea:
  id: IDEA-20260830-2993a4
  question_id: RQ-ICEX-001
  added: '2026-08-30'
  title: >-
    THIS LANE'S DELIVERABLE IS AN N-EXPONENT FITTED OVER FOUR TOY SIZES, WHICH ITS OWN
    AUDITS SHOW IS NOT IDENTIFIABLE. Replace it with a B-EXPONENT that is identifiable
    at ONE field size: the decision rate r = d log(candidates settled per charged
    operation) / d log B, swept over B at fixed p. The mapping alpha = 2/(r+2) for
    r >= m-3 and 1 - r/(m-1) below it reproduces IDEA-20260803-fa9839 and
    IDEA-20260808-2ef5c8 identically, places IDEA-20260829-b5a2c8's two m=2 numbers at
    exactly r = 0 and r = 1, and makes the constraint D >= 1 read as r <= m-1 --
    from which "no m=2 oracle can reach rho in the full-relation-only model" follows in
    one line rather than from a cost derivation.
  class: measurement

  claim: >-
    (A) THE OBSERVABLE. For a point-decomposition pipeline at arity m over a factor
    base of size B, define per target C = the number of candidate decompositions the
    oracle's answer logically settles, and D = the charged operations it spends. The
    DECISION RATE is rho_dec = C/D and the DECISION-RATE EXPONENT is
    r = d log rho_dec / d log B, fitted at FIXED field size by sweeping B.
    (B) THE MAPPING, WHICH IS AN EXACT REPARAMETRISATION OF THIS LANE'S OWN MODEL AND
    NOT A NEW ONE. With C = Theta(B^{m-1}) for a complete oracle and D = Theta(B^theta)
    we have r = m-1-theta, so IDEA-20260808-2ef5c8's two regimes become
    alpha = 2/(r+2) when r >= m-3 (interior optimum) and alpha = 1 - r/(m-1) when
    r < m-3 (the trials >= 1 cap binds). The rho-beating condition
    theta < m-3 becomes r > 2; the capped condition theta < (m-1)/2 becomes
    r > (m-1)/2.
    (C) THE THREE THINGS THE NEW COORDINATE MAKES IMMEDIATE.
    (C1) D >= 1 is equivalent to r <= m-1. Combined with the pass line r > 2 this
    gives m > 3 with no cost derivation at all -- exactly
    IDEA-20260803-fa9839's "no admissible D_trial at m <= 3" and
    IDEA-20260808-2ef5c8's threshold, recovered as an inequality between two integers.
    (C2) At m = 2 the whole admissible range is r in [0, 1], and both endpoints are
    already named in this corpus: r = 0 is the signed-sum sweep, giving alpha = 1,
    which is IDEA-20260829-b5a2c8 part (B2); r = 1 is the free oracle, giving
    alpha = 2/3, which is its part (B1). The entire m = 2 dispute is therefore a
    dispute about a single scalar confined to a unit interval, and the interval's best
    endpoint is worse than rho.
    (C3) r IS IDENTIFIABLE WHERE alpha IS NOT. alpha is an exponent in N and needs a
    ladder in N; this lane's own audits (IDEA-20260805-bb4488, IDEA-20260805-c8524f,
    IDEA-20260815-6f09d5) argue the ladder available at toy scale cannot separate the
    hypotheses. r is an exponent in B and is fitted WITHIN one field size across a
    decade of B, where dozens of cells are available in minutes. THIS IS THE CLAIM
    THAT MAKES THE PROPOSAL WORTH FILING and it is falsifiable: if the fitted r has a
    wider confidence interval than the fitted alpha at matched budget, the proposal is
    wrong.
    (D) WHAT IS NOT CLAIMED. r carries no structural information by itself -- it is a
    ratio of two counters and a random-oracle predicate of identical cost has the same
    r. It is an INSTRUMENT, not a discovery, and its null control is therefore a
    planted-value calibration and not a vanishing-gain test. It also says nothing
    about partial-relation pipelines, whose relation supply is not the candidate count
    at all (IDEA-20260830-f2e5b7), and that exclusion is stated as a scope limit rather
    than discovered later.

  mechanism: >-
    THE TRACKED OBJECT AND ITS LOSSY-PROJECTION STATUS. The object followed is the
    DECISION RATE -- the ratio, per target, of candidate decompositions settled to
    charged operations spent. It is a genuinely lossy projection of the oracle's
    execution: it discards the instance, the curve, the field representation, the
    monomial order, the solver's internal state, the identity of the candidates
    settled, and the order in which they were settled, retaining one rational number.
    It is lossy COMPATIBLY because both counters are ADDITIVE over the run, so the
    ratio propagates deterministically under the only composition the pipeline
    performs -- concatenating targets -- and under restriction to a sub-base, which is
    what lets the B-sweep exist at all. Contrast the projection that fails the test:
    the full per-target cost vector (which candidates, in which order, at what cost),
    which discards nothing and is therefore just the run log.
    WHY THE CHANGE OF COORDINATE HAS CONTENT RATHER THAN BEING COSMETIC. r = m-1-theta
    is affine in IDEA-20260808-2ef5c8's theta, so no mathematical content is added and
    none is claimed. What changes is what is measured against what. theta is defined
    as the exponent of a per-trial COST; measuring it requires deciding what a trial
    costs and comparing across sizes. r is defined as the exponent of a RATIO OF TWO
    COUNTERS INCREMENTED IN THE SAME RUN, so the unit of an operation cancels in the
    ratio and only its B-dependence survives. That cancellation is the whole point: the
    dominant confounder in this lane is the charging convention (a group operation
    versus a field multiplication versus a hash probe), and it moves rho_dec by a
    constant factor while leaving r untouched. r is convention-invariant where alpha
    and theta are not.
    WHY THE COMPLETENESS FRACTION BELONGS IN THE NUMERATOR. An oracle that examines
    only part of the candidate set settles only part of it. KN-FIND-8f2c90's BKK
    variant is exactly this case: it checks B/2 of the B pairs and retains a measured
    fraction gamma of 0.86 at p = 1009 and 0.75 at p = 4001 of the yield. Charging it
    C = gamma * (total candidates) rather than the full count is what makes the
    instrument report a constant-factor improvement as a constant and not as a rate
    change -- and reproducing its committed 1.5-1.7x speedup as a change in rho_dec
    with r UNMOVED is the instrument's baseline test.
    WHY THE UPPER BOUND r <= m-1 IS THE STRUCTURAL STATEMENT. D >= 1 forces
    r <= m-1, so the achievable rate exponent is confined to a bounded interval whose
    width is the arity minus one. At m = 2 that interval is [0,1] and the pass line
    sits at 2, outside it. The named obstruction is therefore not "the oracle is slow"
    but "there is not enough candidate space at m = 2 for any oracle to be fast in the
    required sense" -- the candidate set has size Theta(B), so no oracle can settle
    B^{2} candidates per operation because there are not B^2 candidates to settle. That
    is a closure at the docs/inventor-protocol.md section 4 standard: a named
    obstruction (candidate-space dimension), an argument (r <= m-1 from D >= 1), and
    forward guidance (the obstruction dissolves at m >= 4, where the candidate space is
    Theta(B^{m-1}) and r = 2 is interior to the admissible interval -- and where this
    corpus has ZERO measured cost cells, per IDEA-20260807-32f96d).

  novelty_status: unverified

  citations:
    - ref: IDEA-20260808-2ef5c8
      provenance: internal
      claim: >-
        THE PARENT. Introduces D_trial = c_D*B^theta, the trials >= 1 feasibility cap,
        and the two-regime result alpha = 2/(m+1-theta) for theta <= 2 and
        alpha = theta/(m-1) for theta > 2, with the rho-beating conditions
        theta < m-3 and theta < (m-1)/2 respectively, and theta_MITM = ceil(m/2). Its
        minimal test is symbolic and emits a grid; it proposes no measurement of
        theta, and it lists as a confounder that "a fitted theta needs a CI and a
        lack-of-fit statistic". This record supplies exactly that measurement and
        claims no new mathematics over it.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        ledger/proposals/IDEA-20260808-2ef5c8.yaml, all 233 lines, including its
        target_complexity, predictions and confounders blocks.
    - ref: IDEA-20260803-fa9839
      provenance: internal
      claim: >-
        The grandparent two-term charge T = m!*N*D/B^{m-1} + c_LA*B^2 with optimum
        B* = N^{1/(m+1)} and the threshold d < (m-3)/4, and the statement that at
        m <= 3 no admissible D_trial >= 1 satisfies it within the model. That
        statement is what the r <= m-1 bound reproduces in one line.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        ledger/proposals/IDEA-20260803-fa9839.yaml, all 493 lines.
    - ref: IDEA-20260829-b5a2c8
      provenance: internal
      claim: >-
        Its two m = 2 numbers are exactly the two endpoints of the admissible r
        interval: the achievable signed-sum sweep D = Theta(B) is r = 0 giving
        alpha = 1, and the free oracle D = Theta(1) is r = 1 giving alpha = 2/3. It
        derives these from a stationarity computation; this record obtains them as
        interval endpoints, which is why the m = 2 dispute reduces to one scalar.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        ledger/proposals/IDEA-20260829-b5a2c8.yaml, all 671 lines.
    - ref: KN-FIND-8f2c90
      provenance: internal
      claim: >-
        Supplies the instrument's baseline fixture. Its BKK variant checks B/2 pairs
        instead of B with measured yield retention gamma of 0.86 at p = 1009 and 0.75
        at p = 4001, giving a total-check-operation speedup 2*gamma of 1.5-1.7x, and
        it states explicitly that this is "Not exponent-moving". The instrument must
        reproduce that as a change in the LEVEL of rho_dec with r UNCHANGED.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-8f2c90.md, all 43 lines.
    - ref: KN-FIND-007
      provenance: internal
      claim: >-
        Fixes the mean per-target yield exactly at binom(B+m-1,m)/N for every base of
        size B, geometry-independent, measured deviation exactly 0 over 144 cells. The
        instrument uses it as the per-cell validity check on the harvester rather than
        as an input to r.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        knowledge/findings/KN-FIND-007.md, all 96 lines.
    - ref: >-
        IDEA-20260805-bb4488, IDEA-20260805-c8524f, IDEA-20260805-c06631,
        IDEA-20260815-6f09d5 (the ICEX estimator audits)
      provenance: internal
      claim: >-
        Per the prior-art index for this question read this session, these records
        argue respectively that the exponent alpha = log C / log ell is not
        identifiable by the estimator that measures it, that alpha is a
        unit-covariant and constant-contaminated ratio rather than a slope, that 1/2
        is not the baseline exponent for most ICEX cost coordinates, and that a fitted
        exponent over four toy sizes needs a stated number of sizes before it means
        anything. This record's identifiability claim is a direct response to that
        cluster.
      verified_by: >-
        Title lines read this session from the prior-art index
        prior3_RQ-ICEX-001.txt supplied with the task; the FULL BODIES of these four
        records were NOT read this session. The characterisations above are taken from
        their titles and must be re-checked against their bodies before this record is
        acted on.
    - ref: IDEA-20260807-32f96d
      provenance: internal
      claim: >-
        Per the same prior-art index, records that arity m >= 4 has ZERO measured cost
        cells anywhere in the corpus and that the obstruction supposed to kill large m
        is asserted rather than measured. That is where the r instrument would first
        produce a number nobody has.
      verified_by: >-
        Title line read this session from the supplied prior-art index; body NOT read.

  assumptions:
    - >-
      Prime-order group of order N, factor base of size B, arity m fixed per run. The
      pipeline is a full-relation point-decomposition pipeline; partial-relation
      pipelines are explicitly out of scope because their relation supply is not the
      candidate count (IDEA-20260830-f2e5b7 owns that case).
    - >-
      C is defined as (completeness fraction) x (number of size-(m-1) multisets from
      the base), and both factors are MEASURED per cell, never assumed. The
      completeness fraction is measured by exhaustive cross-check against a reference
      complete oracle at small B.
    - >-
      D is measured in whatever unit the run's frozen convention declares. The unit
      cancels in r, which is the instrument's design property, but the LEVEL rho_dec
      is convention-dependent and is reported with its convention attached.
    - >-
      The two-regime mapping from r to alpha is inherited unchanged from
      IDEA-20260808-2ef5c8, including its trials >= 1 cap. No claim of correctness for
      that mapping is made here beyond reproducing it symbolically; if that record's
      derivation is wrong, this instrument measures a quantity whose interpretation is
      wrong while remaining a correct measurement of r.
    - >-
      A power law in B is assumed to EXIST for the oracle under test. That assumption
      is itself the primary falsifiable prediction and is tested by a lack-of-fit
      statistic, not presumed.

  proof_search_map:
    bottleneck: >-
      The identifiability of this lane's deliverable. The exact step whose replacement
      changes what the lane can conclude is "estimate an exponent from measurements
      available at toy scale". The bottleneck is not the algorithm; it is that the
      quantity currently reported cannot be estimated from the data the lane can
      collect.
    baseline_embedding:
      parameter_slice: >-
        r = m-1-theta. Substituting reproduces IDEA-20260808-2ef5c8's two regimes term
        by term and IDEA-20260803-fa9839's threshold d < (m-3)/4 identically, and
        places IDEA-20260829-b5a2c8's m = 2 pair at r = 0 and r = 1.
      reproduction_check: >-
        Symbolic identity check on all three, verified numerically at m = 2..12 and
        r = 0..m-1 to 1e-12. Plus a frozen regression fixture: the instrument run on
        the BKK variant at KN-FIND-8f2c90's own cells (p = 1009 and p = 4001) must
        recover a rho_dec ratio of 2*gamma in [1.5, 1.7] against the standard sweep,
        with the FITTED r identical to within its confidence interval. If the
        instrument reports a change in r for a change that the committed finding calls
        "not exponent-moving", the instrument is broken and nothing downstream may be
        read.
    observation_collision:
      observable: >-
        The fitted r at a single (p, B) pair, i.e. r estimated as log rho_dec / log B
        from one cell rather than as a slope.
      distinct_preimage_search: >-
        COLLISION EXHIBITED AND IT DICTATES THE DESIGN. A single-cell ratio
        log rho_dec / log B is constant-contaminated in exactly the way
        IDEA-20260805-c8524f's title says alpha is: an oracle with
        D = 10*B^0 and one with D = B^{1 - log 10 / log B} give the same single-cell
        value at that B and different values at any other B. The separator is
        therefore the SLOPE ACROSS A B-DECADE AT FIXED p, never a single-cell ratio,
        and the instrument is specified to refuse a single-cell estimate. This is the
        one place where this record could repeat the exact defect it exists to fix.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the lane's deliverable from an exponent in N to an exponent in B, in a
          coordinate where the operation-unit convention cancels and the fit is a
          within-size regression over dozens of cells rather than a between-size
          regression over four.
        predicted_gain: >-
          A confidence interval on the decision-relevant exponent that is narrow enough
          to have a pass line, at a compute budget the lane already has. NO ATTACK
          EXPONENT IS MOVED IN EITHER DIRECTION.
      - transform: stronger_invariant
        proposed_object: >-
          Report the pair (r, m) with its lack-of-fit statistic rather than the scalar
          alpha, preserving the information IDEA-20260808-2ef5c8 showed alpha destroys
          -- it exhibits (theta,m) = (2,6) and (4,11) both mapping to alpha = 2/5.
        predicted_gain: >-
          Restores identifiability of the deliverable at no additional measurement
          cost, since both components are already recorded per run.
    quantifier_order: >-
      CLAIMED. FOR ALL point-decomposition oracles whose charged cost admits a power
      law D = Theta(B^theta) UNIFORMLY on the feasible B-range at fixed N, THERE EXISTS
      a decision-rate exponent r = m-1-theta, estimable from a within-size B-sweep, and
      the two-regime mapping assigns it a unique alpha. The uniformity in B is
      load-bearing and is inherited verbatim from IDEA-20260808-2ef5c8: AN ORACLE WHOSE
      FITTED theta DRIFTS WITH B HAS NO EXPONENT and the framework does not apply to
      it -- a live possibility for a Groebner oracle with degree falls, which is why
      the lack-of-fit statistic is a required metric and not an optional one.
      NOT CLAIMED: that r is estimable for every oracle. NOT CLAIMED: that a measured r
      says anything about achievability at another N, another arity, or another field.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Oracle X at arity m over prime field F_p with p in the tested range has
        decision-rate exponent r = R plus or minus CI, hence within the inherited
        two-regime model alpha = A, hence it does or does not clear the rho pass line."
        It can NEVER certify that any r is achievable by some undiscovered oracle, that
        the two-regime model is correct, that a toy-scale r transfers to cryptographic
        scale, or anything about partial-relation pipelines.
      nearby_object_control: >-
        THE EXTENSION-FIELD ORACLE. Instantiate the instrument on the F_{q^n}
        decomposition solve with the subfield-line base, where the oracle is a
        bounded-size Groebner solve of cost q^{o(1)} and the candidate count is
        Theta(q^{n-1}), so r = n-1 by construction. THE INSTRUMENT MUST RETURN
        r = n-1 THERE. If it returns r = n-1 on the extension-field oracle and r = 0 on
        the prime-field sweep, it has localised the entire prime/extension difference
        in one measured scalar, which is the strongest thing it can do. If it cannot
        separate the two, it is not measuring the load-bearing structure and must not
        be used.
    proof_obligations:
      - claim: >-
          r = m-1-theta reproduces both regimes and the threshold identically.
        responsibility: baseline
      - claim: >-
          D >= 1 implies r <= m-1, hence the pass line r > 2 requires m >= 4.
        responsibility: correctness
      - claim: >-
          The estimator recovers a planted r within its stated CI on synthetic oracles.
        responsibility: feasibility
      - claim: >-
          The BKK constant-factor fixture moves rho_dec and not r.
        responsibility: baseline
      - claim: >-
          The CI on r at matched budget is narrower than the CI on alpha.
        responsibility: strictness
      - claim: >-
          The extension-field instantiation returns r = n-1.
        responsibility: scope

  predictions:
    - metric: >-
        fitted r for the signed-sum sweep oracle at m = 2, from a B-decade sweep at
        fixed p, with a bootstrap confidence interval
      direction: different
      minimum_effect: >-
        PRE-REGISTERED POINT PREDICTION. r = 0.00 with a 95 percent CI of half-width
        below 0.10. A fitted r for the sweep that differs from 0 by more than 0.10
        means the sweep is not being charged Theta(B) per target and every downstream
        number in this lane that assumes D = Theta(B) -- including
        IDEA-20260829-b5a2c8 part (B2) -- is void.
    - metric: >-
        fitted r for the precomputed-sumset oracle at m = 2 (constant-time query)
      direction: higher
      minimum_effect: >-
        PRE-REGISTERED. r = 1.00 plus or minus 0.10, the upper endpoint of the
        admissible interval at m = 2. Together with the sweep prediction this pins both
        endpoints of the m=2 dispute by measurement rather than by assumption.
    - metric: >-
        planted-value calibration -- fitted r for synthetic oracles constructed to have
        r in {0, 0.5, 1, 1.5, 2} by spending exactly B^{m-1-r} charged operations
      direction: different
      minimum_effect: >-
        RECOVERY WITHIN 0.10 AT EVERY PLANTED VALUE, with the residual showing no trend
        in the planted value. A systematic bias above 0.10 means the estimator is
        broken and no measured r may be reported. This is the instrument-validation
        control and it is blocking.
    - metric: >-
        confidence-interval half-width of fitted r versus fitted alpha at MATCHED total
        compute budget on the same pipeline
      direction: lower
      minimum_effect: >-
        THE PROPOSAL'S CENTRAL CLAIM AND ITS CENTRAL RISK. The r interval must be at
        least 3x narrower than the alpha interval at equal budget. If it is not
        narrower at all, the identifiability argument fails and this record should be
        rejected -- there is no fallback reading, because the mathematics is
        acknowledged to be a reparametrisation of an existing corpus model.
    - metric: >-
        lack-of-fit statistic for the power-law assumption D = Theta(B^theta)
      direction: different
      minimum_effect: >-
        Reported per oracle with a declared threshold set before the run. PREDICTED
        PASS for the sweep and the table oracle (both are exact power laws by
        construction) and PREDICTED AT RISK for any Groebner oracle, where degree falls
        can break the power law. An oracle that fails lack-of-fit is reported as HAVING
        NO EXPONENT, which is a legitimate and informative outcome, not a failed run.
    - metric: >-
        BKK fixture -- rho_dec level and fitted r, standard sweep versus B/2 sweep at
        p = 1009 and p = 4001
      direction: different
      minimum_effect: >-
        FORCED. rho_dec ratio in [1.5, 1.7] matching KN-FIND-8f2c90's committed
        2*gamma; fitted r identical within CI. An instrument that reports a change in r
        for a change the committed finding calls not-exponent-moving is broken and
        blocks the whole run.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, minutes, HARD GATE). Verify symbolically that r = m-1-theta
      reproduces IDEA-20260808-2ef5c8's two regimes, IDEA-20260803-fa9839's threshold,
      and IDEA-20260829-b5a2c8's m = 2 endpoints; verify numerically at m = 2..12 to
      1e-12. Mismatch halts.
      STAGE 1 (low compute, minutes). PLANTED-VALUE CALIBRATION. Build synthetic
      oracles that spend exactly ceil(B^{m-1-r}) charged operations and settle
      Theta(B^{m-1}) candidates, for planted r in {0, 0.5, 1, 1.5, 2}, and run the
      estimator. The estimator is not applied to any real oracle until it recovers
      every planted value within 0.10.
      STAGE 2 (low compute, pure Python, p in {2^12, 2^14, 2^16}, B swept over a
      decade -- at least 8 values spanning 16x -- at each p, 5 seeds). Instrument the
      real m = 2 oracles: the signed-sum sweep, the BKK B/2 sweep, and the
      precomputed-sumset table oracle. Per cell record C (with its measured
      completeness fraction, cross-checked exhaustively against a reference complete
      oracle at B <= 32), D, rho_dec, the measured yield against
      binom(B+m-1,m)/N, and peak memory. Fit r within each p separately by weighted
      least squares on log rho_dec versus log B, with bootstrap CIs and a lack-of-fit
      statistic.
      STAGE 3 (low compute). MATCHED-BUDGET COMPARISON. Using the same total compute,
      fit alpha the conventional way across the four p values and compare CI widths.
      This is the decisive comparison and it must be run even if -- especially if --
      it goes against the proposal.
      STAGE 4 (zero compute). Emit the (r, m, lack-of-fit) triple per oracle, map to
      alpha through the inherited two regimes, and state for each whether it clears
      r > 2. PREDICTED: none does at m = 2, because r <= 1 there. Propose the triple
      as the lane's reporting object, to the Coordinator, never as a status change.
      STAGE 5 (optional, higher cost, explicitly not part of the minimal test). Apply
      the instrument at m = 4, where IDEA-20260807-32f96d records zero measured cost
      cells anywhere in the corpus. This is where the instrument would produce a number
      nobody has, and it is deliberately outside the minimal test so that the
      instrument is validated before it is trusted.
      MEMORY DISCIPLINE. No Macaulay matrix and no Groebner basis is built in the
      minimal test. The largest object is a sumset table at B <= 256, under 20 MB.
    controls:
      - >-
        PLANTED-VALUE CALIBRATION (blocking, runs first): the estimator must recover
        known r before it is applied to any real oracle.
      - >-
        BKK BASELINE FIXTURE (blocking): a committed constant-factor improvement must
        move rho_dec and not r.
      - >-
        COMPLETENESS CROSS-CHECK: the measured completeness fraction of every oracle
        verified exhaustively against a reference complete oracle at B <= 32. An
        incomplete oracle charged as complete inflates r by construction, which is the
        easiest way to fake a pass.
      - >-
        NULL-OBJECT CONTROL, CORRECTLY SPECIFIED FOR AN INSTRUMENT: replace the
        decomposition predicate with a random oracle of identical cost. r MUST BE
        UNCHANGED, because r is a cost accounting and carries no structural
        information. An r that MOVES under the null means the estimator is reading
        structure into a cost ratio and is broken. Note this is the opposite of the
        usual null-object reading and is stated explicitly to prevent
        misinterpretation.
      - >-
        CONVENTION-INVARIANCE CONTROL: rerun the fit with the hash-probe charge set to
        0.1, 1 and 10 group operations. rho_dec must move and r must not. A fitted r
        that moves by more than its CI under a pure unit change falsifies the
        instrument's design property.
      - >-
        YIELD VALIDITY CONTROL: measured mean yield per cell against
        binom(B+m-1,m)/N per KN-FIND-007; a systematic deviation voids the cell.
      - >-
        SEED-INDEPENDENCE: derived quantities bit-identical across seeds, measured
        counts free to vary.
    required_metrics:
      - 'C, D, rho_dec per (p, B, oracle, seed), with the completeness fraction'
      - 'fitted r per (p, oracle) with bootstrap CI and lack-of-fit statistic'
      - 'planted versus recovered r for every synthetic oracle'
      - 'CI half-width of r versus CI half-width of alpha at matched budget'
      - 'rho_dec and r under probe charges 0.1, 1 and 10'
      - 'r under the random-oracle null'
      - 'measured yield versus binom(B+m-1,m)/N per cell'
      - 'the (r, m, lack-of-fit) triple and its mapped alpha per oracle'
      - 'BKK fixture rho_dec ratio against the committed [1.5, 1.7]'

  falsification_conditions:
    - >-
      The estimator does not recover planted r within 0.10. The instrument is broken;
      no measured r is reported and the record is withdrawn rather than re-tuned after
      seeing the data.
    - >-
      The CI on r is not at least 3x narrower than the CI on alpha at matched budget.
      The identifiability claim -- the whole reason this record exists over its parent
      IDEA-20260808-2ef5c8 -- fails, and the record should be rejected.
    - >-
      Fitted r moves by more than its CI under a pure change of the operation-charging
      convention. The claimed convention-invariance is false and r is no better than
      alpha in the respect that motivated it.
    - >-
      The BKK fixture reports a change in r. The instrument contradicts a committed
      finding's own not-exponent-moving characterisation and is broken.
    - >-
      Fitted r for the sweep at m = 2 differs from 0 by more than 0.10. Then
      D = Theta(B) is not the sweep's true charge and IDEA-20260829-b5a2c8 part (B2)
      rests on a wrong per-trial cost -- a result that would be more valuable than this
      instrument.
    - >-
      Fitted r moves under the random-oracle null. The estimator is reading structure
      into a cost ratio.
    - >-
      Everything holds. Then the lane acquires a deliverable that is identifiable at
      one field size, the m = 2 dispute is pinned by measurement at both endpoints of
      a unit interval whose best value is worse than rho, and the m >= 4 cells that
      currently do not exist anywhere in the corpus become measurable at known cost.

  confounders:
    - >-
      COMPLETENESS INFLATION. The single easiest way to manufacture a high r is to
      credit an oracle with settling candidates it never examined. This is why the
      completeness fraction is measured exhaustively at small B and is a required
      metric rather than a modelling choice, and why KN-FIND-8f2c90's gamma is used as
      a fixture.
    - >-
      B-RANGE TOO NARROW. A slope fitted over a 4x range of B at toy sizes has a wide
      CI for the same reason a 4-point ladder in N does. The design requires at least a
      16x range with at least 8 values, and a cell count is reported with every fit. If
      the feasible B-range at a given p is under 8x, that p is excluded before the run.
    - >-
      SATURATION AT SMALL p. At p = 2^12 with B = 256 the per-target yield exceeds 1
      and the trial count degenerates, which distorts D for reasons unrelated to r.
      Cells are pre-screened for mean yield in [0.05, 2].
    - >-
      NO POWER LAW. A Groebner oracle with degree falls may simply not have a power-law
      cost in B. The lack-of-fit statistic exists to detect this and the honest report
      is "no exponent", which the framework must accommodate rather than force a fit.
    - >-
      THE MAPPING IS INHERITED, NOT VERIFIED. If IDEA-20260808-2ef5c8's two-regime
      derivation is wrong, r is still measured correctly and its translation to alpha
      is still wrong. Every deliverable states r first and alpha second, with the
      inheritance named.
    - >-
      r IS AN INSTRUMENT, NOT A DISCOVERY. It has the same value on a random-oracle
      predicate of the same cost. Nothing structural may be inferred from an r alone.

  interpretation_limits:
    - >-
      NO MATHEMATICS IS CLAIMED AS NEW. r = m-1-theta is an affine reparametrisation of
      IDEA-20260808-2ef5c8's theta and the two-regime mapping is inherited verbatim.
      The claim is entirely about identifiability and measurement design, and the
      record should be judged on the matched-budget CI comparison alone.
    - >-
      SCOPED TO FULL-RELATION POINT-DECOMPOSITION PIPELINES. Partial-relation pipelines
      do not have a candidate-count-based relation supply and the mapping from r to
      alpha does not apply to them; IDEA-20260830-f2e5b7 owns that case and the two
      records must not be quoted jointly without that caveat.
    - >-
      A TOY-SCALE r IS A TOY-SCALE r. Transfer to cryptographic scale is neither
      claimed nor validated by any part of this proposal. The tested scale is
      p <= 2^16 and B <= 256, stated on every row.
    - >-
      FORWARD GUIDANCE. The obstruction this record names -- r <= m-1, so the pass line
      r > 2 is outside the admissible interval at m <= 3 -- dissolves at m >= 4, where
      r = 2 is interior. The remaining open classes are therefore: algebraic oracles at
      m >= 4 whose r can be measured for the first time (IDEA-20260807-32f96d records
      zero such cells in the corpus); oracles exploiting factor-base structure, where
      the candidate count itself changes; and pipelines whose relation supply is not
      the candidate count at all. None of these is closed here.
    - >-
      NO STATUS CHANGE IS PROPOSED. Only a Coordinator decision may adopt (r, m) as
      this lane's reporting object.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For each oracle under test there exist constants c_D > 0 and theta such that
        the charged per-target cost satisfies D(B) = c_D*B^theta*(1 + o(1)) uniformly
        for B in the tested range at fixed p, so that log D is linear in log B with
        homoscedastic residuals.
      rigorous_support: >-
        RIGOROUS by construction for two of the three oracles tested: the signed-sum
        sweep performs exactly 2B point operations per target (theta = 1 exactly) and
        the sumset-table oracle performs O(1) probes (theta = 0 exactly), so the
        assumption is a theorem for them and they serve as positive controls. The
        classical statement being imitated for the remaining case is the standard
        fixed-parameter asymptotic convention under which a bounded-size algebraic
        solve has a power-law cost in the base size; this corpus records at KN-OPEN-002
        that the low-degree-of-regularity heuristic behind that convention is studied
        mostly over binary fields and is NOT settled over prime fields, which is
        precisely why the lack-of-fit statistic is required and why the honest outcome
        "no exponent" is admissible.
      validation_plan: >-
        SAMPLE. At p in {2^12, 2^14, 2^16}, at least 8 values of B spanning a 16x
        range, 5 seeds each, for every oracle.
        COMPARISON. Residuals of log D against log B tested for linearity by an
        F-test against a quadratic alternative, with a pre-declared rejection level of
        1 percent, plus a Breusch-Pagan check for homoscedasticity.
        TAIL CHECKS. The per-target D distribution's 99th percentile against its mean
        at every cell -- a heavy tail means the expectation-level charge does not
        predict the total, which IDEA-20260803-fa9839 already names as a confounder for
        a Groebner oracle and which must be reported with every r.
        TRANSFER. None claimed beyond p <= 2^16 and B <= 256. r measured here is not
        asserted to hold at any other scale.
    - id: H2
      statement: >-
        The number of candidate decompositions settled per target is
        C = phi * binom(B+m-2, m-1)*(1 + o(1)), where phi in (0,1] is the oracle's
        completeness fraction and is constant in B for a given oracle.
      rigorous_support: >-
        The multiset count binom(B+m-2, m-1) is an exact double count of the same kind
        as KN-FIND-007's conservation identity, and is exact for a complete oracle
        (phi = 1). The heuristic content is entirely in the constancy of phi in B for
        an INCOMPLETE oracle. KN-FIND-8f2c90 supplies the one measured instance of a
        non-trivial phi in this corpus -- the BKK B/2 variant with gamma of 0.86 at
        p = 1009 and 0.75 at p = 4001 -- and notably those two values DIFFER, which is
        direct evidence that phi is not constant across regimes and must be measured
        per cell rather than assumed. The assumption is therefore stated in the weakest
        usable form and is checked, not relied upon.
      validation_plan: >-
        SAMPLE. Every cell with B <= 32, where the complete candidate set is
        exhaustively enumerable, cross-checking the oracle's settled set against
        ground truth.
        COMPARISON. Measured phi against its value at the smallest B, required constant
        within 10 percent across the B-range; and for the BKK oracle specifically,
        measured phi against KN-FIND-8f2c90's committed gamma at its own two cells.
        TAIL CHECKS. The distribution of per-target settled counts against
        Binomial(binom(B+m-2,m-1), phi); an over-dispersed tail means completeness is
        instance-dependent and r must be reported with that dependence disclosed.
        TRANSFER. None; phi measured at B <= 32 is extrapolated to larger B only within
        the same p and the extrapolation is flagged on every row.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The record produces a measured scalar r
      and, through the inherited mapping, alpha = 2/(r+2) for r >= m-3 and
      1 - r/(m-1) below it. Pre-registered values for the oracles tested: sweep at
      m = 2 gives r = 0 hence alpha = 1; table oracle at m = 2 gives r = 1 hence
      alpha = 2/3; meet-in-the-middle at arity m gives r = m-1-ceil(m/2). None of these
      reaches the pass line r > 2 at m <= 3, since r <= m-1 there.
    memory_exponent: >-
      The instrument itself adds nothing beyond the pipeline it measures. Every r row
      is emitted WITH the measured peak memory of the oracle that produced it,
      because IDEA-20260830-4ab603 shows that at m = 2 an r of 1 is bought with
      Theta(B^2) space -- so r without its memory column is exactly as unidentifiable
      as alpha without its space column. The reporting object is therefore
      (r, m, lack-of-fit, peak query space).
    best_known: >-
      Pollard rho at 0.886*sqrt(N) time and O(1) memory (KN-TECH-001, KN-TECH-006);
      BSGS at (N^{1/2}, N^{1/2}) (KN-TECH-031). As an INSTRUMENT the incumbent is the
      alpha estimator frozen in this lane's ICEX protocol, whose identifiability is
      challenged by four separate records in the same lane.
    hidden_overhead: >-
      DISCLOSED IN FULL. (i) The mapping from r to alpha is inherited and unverified;
      if it is wrong, r remains correct and its interpretation does not. (ii) phi is
      measured only at B <= 32 and extrapolated within a p, and KN-FIND-8f2c90's own
      two gamma values differ, so this extrapolation is known to be imperfect.
      (iii) The power-law assumption may simply fail for an algebraic oracle, in which
      case no exponent exists and the deliverable is that fact. (iv) Nothing here is
      validated above p = 2^16.
    tradeoff_note: >-
      Not an algorithm and nothing is traded. The programmatic tradeoff is stated
      plainly: the instrument spends its budget on many B values at few p values,
      whereas the incumbent spends it on few B values at several p values. The
      matched-budget CI comparison in Stage 3 is exactly the measurement of whether
      that reallocation was worth making, and it is designed to be able to say no.

  dominated_by: >-
    n/a (no result claimed) -- checked row by row so this is a checked null, not an
    unchecked one. As an ATTACK this record mounts none and is dominated on every axis
    by every frontier row: rho (N^{1/2}, O(1)); BSGS (N^{1/2}, N^{1/2}); multi-target
    rho sqrt(K*N) at O(1) memory; van Oorschot-Wiener sqrt(A^3/w) at memory w; the
    preprocessing frontier S*T^2 = Omega-tilde(N); algebra-free meet-in-the-middle
    index calculus at (N^{1/2+1/m}, N^{1/2}); the two-term optimum
    ((m!ND)^{2/(m+1)}, N^{1/(m+1)}). Time, memory and data/queries all checked; the
    record is query-free and produces no Pareto point on any of them. As an INSTRUMENT
    it is dominated in MATHEMATICAL CONTENT by IDEA-20260808-2ef5c8, of which it is an
    affine reparametrisation, and claims priority only on identifiability and
    measurability -- which is why the matched-budget CI comparison is the record's
    single decisive test.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no exponent moved, and no new
    mathematics over IDEA-20260808-2ef5c8. Quantified instrument delta: from a
    deliverable that is an exponent in N fitted over four toy sizes -- which four
    records in this same lane argue is not identifiable -- to an exponent in B fitted
    over at least 8 cells within ONE field size, with a pre-registered requirement that
    its confidence interval be at least 3x narrower at matched budget, a planted-value
    calibration that must recover r within 0.10, and a convention-invariance property
    that the incumbent estimator does not have. Structural by-products stated exactly:
    D >= 1 gives r <= m-1, so the rho pass line r > 2 is outside the admissible
    interval for every m <= 3, recovering IDEA-20260803-fa9839's m <= 3 reading as an
    inequality between integers; and IDEA-20260829-b5a2c8's two disputed m = 2 numbers
    are exactly the endpoints r = 0 and r = 1 of a unit interval whose best value,
    alpha = 2/3, is N^{1/6} worse than rho.

  estimated_cost:
