    "claim": "R3 representation at the decomposition/relation stage. Residuals from different public toy targets can share reusable proof work through exact affine equivalences even when ordinary assumption-based clause reuse does not. Require a 2x total saving after map search, canonicalization and proof transport; the alternative is that every useful residual class is effectively unique.",
