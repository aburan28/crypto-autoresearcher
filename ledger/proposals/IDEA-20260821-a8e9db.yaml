idea:
  id: IDEA-20260821-a8e9db
  question_id: RQ-FRODO-3260cc
  added: '2026-08-21'
  title: >-
    FrodoKEM ships TWO public matrices A under one security claim, and seedA is PUBLIC, so
    Frodo-AES runs AES-128 with a KNOWN key on a 2^32-point structured input subspace while
    Frodo-SHAKE runs an XOF: prove by algebra that the Renyi divergence and the decryption
    failure rate cannot see which generator was used, then compute exactly the one statistic
    that can - the aligned-8-entry block-collision spectrum of A - at all three parameter sets,
    and settle whether the AES/SHAKE choice is a performance option or an unstated modelling
    assumption
  class: control
  claim: >-
    (A) THE SPLIT, STATED AS THREE SEPARATE ASSERTIONS, EACH INDEPENDENTLY FALSIFIABLE.
    A1 (ALGEBRAIC, ZERO COMPUTE): the decryption-failure error term of FrodoKEM is
    E'S - S'E + E'' and contains no occurrence of A; therefore the per-entry failure
    distribution, the failure threshold, and every convolution over chi are invariant under
    ANY choice of the matrix generator, exactly and not approximately. A2 (ALGEBRAIC, ZERO
    COMPUTE): the Renyi divergence R_a(chi || Psi) is a functional of chi and of the rounded
    Gaussian alone and contains no occurrence of A; therefore it too is generator-invariant.
    A1 and A2 together predict that a generator-swap arm of the lane's own recomputation
    pipeline must return BITWISE IDENTICAL outputs, which makes them a usable instrument
    check rather than a remark. A3 (EXACT FINITE COMPUTATION): the choice is nonetheless not
    empty, because the two generators induce genuinely different distributions on A, and the
    difference is exactly computable at the standardized parameters through one statistic -
    the number of coincidences among the n*(n/8) aligned 8-entry blocks that each generator
    call produces.
    (B) WHAT A3 COMPUTES. Frodo-AES sets A[i, j..j+7] = AES128(seedA, i || j || 0^96) mod q.
    For fixed seedA, AES128 is a permutation and the index encoding is injective, so at
    Frodo-976 and Frodo-1344, where q = 2^16 and the reduction is the identity on a 16-bit
    word, the aligned blocks of A are PAIRWISE DISTINCT WITH PROBABILITY 1. A uniform A has
    at least one aligned-block coincidence with probability
    1 - prod_{i=0}^{m-1} (1 - i / 2^128), m = n^2 / 8, which is a closed-form exact rational.
    At Frodo-640, q = 2^15 drops one bit per coefficient, i.e. 8 bits per block, so the AES
    arm's coincidence count is NOT forced to zero and its exact expectation is a different
    closed form. Frodo-SHAKE forces nothing at any parameter set. The deliverable is the
    exact optimal distinguishing advantage of this statistic, per generator, per parameter
    set, in exact rational arithmetic, together with the exact statistical distance floor
    below.
    (C) THE STATISTICAL-DISTANCE FLOOR, WHICH APPLIES TO BOTH GENERATORS AND IS THE REASON
    THE QUESTION IS ABOUT MODELLING AND NOT ABOUT STATISTICS. seedA is 128 bits at ALL THREE
    parameter sets (lenA = 128 in the CFRG draft text fetched for this proposal), so at most
    2^128 matrices A are reachable, against q^(n^2) uniform ones. The statistical distance
    between the generated and the uniform distribution on A is therefore at least
    1 - 2^(128 - 15*640^2) at Frodo-640 and at least 1 - 2^(128 - 16*1344^2) at Frodo-1344 -
    i.e. indistinguishable from 1. "A is uniform" is consequently NEVER a statistical claim
    for FrodoKEM; it is a computational or idealised one, and the two generators sit in
    DIFFERENT idealisations: SHAKE128 is an XOF with an indifferentiability argument behind
    it, whereas AES-128 under a public key is a public permutation evaluated in the KNOWN-KEY
    model, which is a strictly weaker modelling position and one in which distinguishers on
    reduced and (per a recalled result) full AES-128 are published.
    (D) WHAT IS NOT CLAIMED, EXPLICITLY. No attack on FrodoKEM-AES. No advantage that any
    adversary can convert into anything. No statement that either generator is broken, weak,
    or should be withdrawn. The known-key literature is invoked ONLY to name the model, and
    the honest ceiling is stated in method_ceiling: the recalled full-AES known-key
    distinguisher needs data on the order of 2^64 while Frodo consumes at most n^2/8 <= 2^17.8
    blocks from a 2^32-point structured subspace, so it does not apply at Frodo's data
    complexity and this proposal does not claim it does. What is claimed is that the CHOICE OF
    MODEL is an input to the security argument that the document may not state, and that
    whether it does is a finite, cheap, decidable reading question with an exact numerical
    companion.
  mechanism: >-
    STAGE 0 - THE ENCODING GATE, AND IT CAN FAIL. Transcribe the AES index encoding from the
    filed primary text and verify by exhaustive enumeration that (i, j) -> b is injective over
    the actual index ranges at n = 640, 976, 1344. If two distinct index pairs encode to the
    same 16-byte block at any parameter set, the injectivity premise of the whole idea is
    dead, the collision count is forced upward, and that is the result. Cost: seconds.
    STAGE 1 - THE ALGEBRAIC INVARIANCE PROOF (A1, A2). Write the decryption error symbolically
    from the filed text and exhibit that A appears in the ciphertext and in the public key but
    cancels in B'S - (C - ...) so that the surviving error term is E'S - S'E + E''. This is a
    symbolic identity, not a measurement, and it is what licenses A1. Do the same for the
    divergence functional, which is trivial. Then EXECUTE the invariance as a control: run the
    lane's chi-side pipeline twice with the two generators wired in and require bitwise
    identical output. A pipeline that returns different numbers has a bug, and finding it here
    costs nothing.
    STAGE 2 - THE EXACT COLLISION SPECTRUM (A3). For each parameter set and each generator,
    compute in exact rational arithmetic: (a) the probability that a uniform A has at least one
    aligned-block coincidence, 1 - prod_{i<m}(1 - i/2^128) for q = 2^16 and the corresponding
    form with the 120-bit reduced block for q = 2^15; (b) the AES arm's forced value (zero at
    q = 2^16, and the exact expected count at q = 2^15, which follows from AES outputs being
    distinct and the reduction being 2^8-to-1 on each 16-bit lane); (c) the SHAKE arm's value,
    which under the XOF-as-random-function model equals the uniform value; (d) the optimal
    advantage of the resulting distinguisher, exactly. NOTHING IS SAMPLED. These are closed
    forms evaluated in exact rational arithmetic; the sampling appears only in the controls.
    STAGE 3 - THE SEED-ENTROPY FLOOR (C). Evaluate 1 - 2^(128 - D*n^2) exactly per parameter
    set, D = 15 or 16 as read from the filed text, and record it beside the advantage from
    Stage 2. The juxtaposition is the point: a statistical distance of essentially 1 sitting
    beside a distinguishing advantage of order 2^-90 is precisely the signature of a claim
    that lives in an idealisation, and it localises WHICH idealisation each generator needs.
    STAGE 4 - THE READING. Search the filed primary text for the sentence that states the
    assumption on Gen, and record verbatim whether it (i) names a model, (ii) names a
    different model per generator, or (iii) is silent. Three outcomes, all reportable, and the
    third is the one this proposal exists to be able to report.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (configured with an
