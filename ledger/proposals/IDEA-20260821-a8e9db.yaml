  dominated_by: >-
    ON THE MEASUREMENT AXIS: DOMINATED BY THE PRP/PRF SWITCHING BOUND m(m-1)/2 * 2^-128
    (standard, recalled, not read this session). That bound is the incumbent for exactly the
