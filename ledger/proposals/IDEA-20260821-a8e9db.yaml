  sota_delta: >-
    No attack; the contribution is one instantiation plus one reading question, and after the
    2026-08-24 repair it is stated at that size.
    ON THE MEASUREMENT AXIS THE DELTA IS NOT THE CREATION OF A FIRST TABLE - that claim is
