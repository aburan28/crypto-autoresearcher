    verified_by: null
  - ref: 'Gilbert, "A Simplified Representation of AES", ASIACRYPT 2014'
    provenance: recalled
    claim: >-
      A known-key distinguisher for the full 10-round AES-128 at time complexity on the order of
      2^64, extending an 8-round distinguisher. A WebSearch result summary on 2026-08-21 asserted
