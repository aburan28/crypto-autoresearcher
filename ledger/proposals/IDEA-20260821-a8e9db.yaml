idea:
  id: IDEA-20260821-a8e9db
  question_id: RQ-FRODO-3260cc
  added: '2026-08-21'
  title: >-
    FrodoKEM ships TWO public matrices A under one security claim, and seedA is PUBLIC, so
    Frodo-AES runs AES-128 with a KNOWN key on a 2^32-point structured input subspace while
    Frodo-SHAKE runs an XOF: prove by algebra that the Renyi divergence and the decryption
    failure rate cannot see which generator was used, then instantiate the PRP/PRF switching gap
    exactly at all three parameter sets - a controlled null an ideal random permutation
    reproduces exactly - and settle whether the AES/SHAKE choice is a performance option or an
    unstated modelling assumption
  class: control
  claim: >-
    (A) THE SPLIT, STATED AS THREE SEPARATE ASSERTIONS, EACH INDEPENDENTLY FALSIFIABLE.
    A1 (ALGEBRAIC, ZERO COMPUTE): the decryption-failure error term of FrodoKEM is
    E'S - S'E + E'' and contains no occurrence of A; therefore the per-entry failure
    distribution, the failure threshold, and every convolution over chi are invariant under
    ANY choice of the matrix generator, exactly and not approximately. A2 (ALGEBRAIC, ZERO
    COMPUTE): the Renyi divergence R_a(chi || Psi) is a functional of chi and of the rounded
    Gaussian alone and contains no occurrence of A; therefore it too is generator-invariant.
    A1 and A2 together predict that a generator-swap arm of the lane's own recomputation
    pipeline must return BITWISE IDENTICAL outputs, which makes them a usable instrument
    check rather than a remark. A3 (EXACT FINITE COMPUTATION, AND ITS STANDING IS NOW STATED
    CORRECTLY - CORRECTED 2026-08-24, see repair_provenance): the two generators induce
    genuinely different distributions on A, and one exactly computable statistic sees the
    difference - the number of coincidences among the n*(n/8) aligned 8-entry blocks that each
    generator call produces. WHAT A3 IS NOT: it is NOT a statistic about AES. It reads the
    PERMUTATION-VERSUS-FUNCTION SHAPE of the generator and nothing else, and its optimal
    advantage is exactly the PRP/PRF switching gap. An IDEAL 128-bit random permutation under a
    public key reproduces every number A3 produces, at every parameter set, exactly. A3 is
    therefore an exact instantiation of a textbook bound at three concrete m values, and the
    record reports it as such rather than as a discovery.
    (B) WHAT A3 COMPUTES, AND WHY THE FORCED VALUES ARE SHAPE AND NOT CIPHER. Frodo-AES sets
    A[i, j..j+7] = AES128(seedA, i || j || 0^96) mod q. For fixed seedA, AES128 is a
    permutation and the index encoding is injective, so at
    Frodo-976 and Frodo-1344, where q = 2^16 and the reduction is the identity on a 16-bit
    word, the aligned blocks of A are PAIRWISE DISTINCT WITH PROBABILITY 1. THAT DERIVATION USES
    ONLY 'AES128 with a fixed key is a bijection on 128-bit blocks', so it holds verbatim for
    an ideal random permutation and for any other bijection; it is a statement about sampling
    m values WITHOUT REPLACEMENT. A uniform A has
    at least one aligned-block coincidence with probability
    1 - prod_{i=0}^{m-1} (1 - i / 2^128), m = n^2 / 8, which is a closed-form exact rational and
    is the m-values-WITH-replacement side of the same comparison. Their difference IS the
    switching gap m(m-1)/2 * 2^-128 to leading order. At Frodo-640, q = 2^15 drops one bit per
    coefficient, i.e. 8 bits per block, so the permutation arm's coincidence count is NOT forced
    to zero and its exact expectation is a different closed form - again a property of a bijection
    followed by an 8-bits-dropping map, not of AES. Frodo-SHAKE forces nothing at any parameter
    set. The deliverable is the exact optimal distinguishing advantage of this statistic, per
    generator, per parameter set, in exact rational arithmetic, side by side with the ideal-
    permutation control that reproduces it, together with the exact statistical distance floor
    below.
    (C) THE STATISTICAL-DISTANCE FLOOR AND THE MODELLING QUESTION - THIS IS THE RECORD'S REAL
    CONTENT AND IT SURVIVES THE CONTROL IN (B) UNTOUCHED. seedA is 128 bits at ALL THREE
    parameter sets (lenA = 128 in the CFRG draft text fetched for this proposal), so at most
    2^128 matrices A are reachable, against q^(n^2) uniform ones. The statistical distance
    between the generated and the uniform distribution on A is therefore at least
    1 - 2^(128 - 15*640^2) at Frodo-640 and at least 1 - 2^(128 - 16*1344^2) at Frodo-1344 -
    i.e. indistinguishable from 1. "A is uniform" is consequently NEVER a statistical claim
    for FrodoKEM; it is a computational or idealised one, and the two generators sit in
    DIFFERENT idealisations: SHAKE128 is an XOF with an indifferentiability argument behind
    it, whereas AES-128 under a public key is a public permutation evaluated in the KNOWN-KEY
    model, which is a strictly weaker modelling position and one in which distinguishers on
    reduced and (per a recalled result) full AES-128 are published. NOTE THE ASYMMETRY WITH (B):
    the ideal-permutation control nullifies A3 as a measurement precisely BECAUSE an ideal
    permutation and AES-128 agree there - and the whole point of (C) is that under a public key
    AES-128's agreement with an ideal permutation is exactly the thing no standard-model
    assumption supplies. The control that kills A3 is the observation that motivates (C).
    (D) WHAT IS NOT CLAIMED, EXPLICITLY. No attack on FrodoKEM-AES. No advantage that any
    adversary can convert into anything. No statement that either generator is broken, weak,
    or should be withdrawn. NO CLAIM THAT A3 IS A NEW MEASUREMENT: the incumbent on that axis is
    the PRP/PRF switching lemma and it costs zero compute. The known-key literature is invoked
    ONLY to name the model, and the honest ceiling is stated in method_ceiling: the recalled
    full-AES known-key distinguisher needs data on the order of 2^64 while Frodo consumes at most
    n^2/8 <= 2^17.8 blocks from a 2^32-point structured subspace, so it does not apply at Frodo's
    data complexity and this proposal does not claim it does. What is claimed is that the CHOICE OF
    MODEL is an input to the security argument that the document may not state, and that
    whether it does is a finite, cheap, decidable reading question with an exact numerical
    companion whose incumbent is named.
  mechanism: >-
    STAGE 0 - THE ENCODING GATE, AND IT CAN FAIL. Transcribe the AES index encoding from the
    filed primary text and verify by exhaustive enumeration that (i, j) -> b is injective over
    the actual index ranges at n = 640, 976, 1344. If two distinct index pairs encode to the
    same 16-byte block at any parameter set, the injectivity premise of the whole idea is
    dead, the collision count is forced upward, and that is the result. Cost: seconds.
    STAGE 1 - THE ALGEBRAIC INVARIANCE PROOF (A1, A2). Write the decryption error symbolically
    from the filed text and exhibit that A appears in the ciphertext and in the public key but
    cancels in B'S - (C - ...) so that the surviving error term is E'S - S'E + E''. This is a
    symbolic identity, not a measurement, and it is what licenses A1. Do the same for the
    divergence functional, which is trivial. Then EXECUTE the invariance as a control: run the
    lane's chi-side pipeline twice with the two generators wired in and require bitwise
    identical output. A pipeline that returns different numbers has a bug, and finding it here
    costs nothing.
    STAGE 2 - THE EXACT SWITCHING-GAP INSTANTIATION (A3), WITH ITS INCUMBENT NAMED FIRST. For each
    parameter set and each generator, compute in exact rational arithmetic: (a) the probability
    that a uniform A has at least one aligned-block coincidence,
    1 - prod_{i<m}(1 - i/2^128) for q = 2^16 and the corresponding
    form with the 120-bit reduced block for q = 2^15; (b) the permutation arm's forced value
    (zero at q = 2^16, and the exact expected count at q = 2^15, which follows from the outputs
    being distinct and the reduction being 2^8-to-1 on each 16-bit lane) - a value forced by the
    permutation SHAPE and shared by AES-128, by an ideal random permutation, and by any bijection;
    (c) the SHAKE arm's value,
    which under the XOF-as-random-function model equals the uniform value; (d) the optimal
    advantage of the resulting distinguisher, exactly, REPORTED BESIDE the standard leading-order
    switching bound m(m-1)/2 * 2^-128 so that the reader sees the exact form is an instantiation
    of the standard one and not an improvement on it. NOTHING IS SAMPLED. These are closed
    forms evaluated in exact rational arithmetic; the sampling appears only in the controls.
    STAGE 2b - THE IDEAL-PERMUTATION ARM (NULL-0), RUN ON THE IDENTICAL CODE PATH. Replace AES-128
    by a lazily-sampled ideal 128-bit permutation under a public key and repeat Stage 2 and the
    counting instrument end to end. FORCED VALUE DERIVED BEFORE THE RUN: every number is identical
    to the AES arm's at every parameter set - the same forced zero at q = 2^16, the same closed
    form at q = 2^15, the same exact advantage. Agreement is therefore a CONTROLLED NULL and
    carries no information about AES; DISAGREEMENT means the pipeline is reading something other
    than the permutation shape and voids Stage 2's interpretation.
    STAGE 3 - THE SEED-ENTROPY FLOOR (C). Evaluate 1 - 2^(128 - D*n^2) exactly per parameter
    set, D = 15 or 16 as read from the filed text, and record it beside the advantage from
    Stage 2. The juxtaposition is the point: a statistical distance of essentially 1 sitting
    beside a distinguishing advantage of order 2^-93 is precisely the signature of a claim
    that lives in an idealisation, and it localises WHICH idealisation each generator needs.
    STAGE 4 - THE READING. Search the filed primary text for the sentence that states the
    assumption on Gen, and record verbatim whether it (i) names a model, (ii) names a
    different model per generator, or (iii) is silent. Three outcomes, all reportable, and the
    third is the one this proposal exists to be able to report. AFTER THE 2026-08-24 REPAIR THIS
    STAGE, TOGETHER WITH STAGE 1'S INSTRUMENT CHECK, IS THE RECORD'S PRIMARY DELIVERABLE.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (configured with an
      in-memory Qdrant; it answers nothing). Retrieval instrument was therefore the Grep tool
      (ripgrep) over the working tree plus WebSearch/WebFetch, both verified working.
      GREPS RUN (tool: Grep, i.e. ripgrep; pattern -> path -> file count):
      (1) 'Frodo-AES|FrodoKEM-AES|SHAKE128.*A matrix|matrix generation|GenA|gen_a' -i ->
      repo root -> 42 files, of which ZERO are under ledger/proposals; the matches are
      GOAL-AES-002/003 C sources, knowledge/literature KN-LIT-940/988/1024/1111/1265/1489/1500,
      research_digest chunks, and one rejected ECDLP idea.
      (2) 'seedA|seed_A|len_seedA' -i -> repo root -> 161 files, dominated by 'seed' substring
      noise in run manifests; no FrodoKEM proposal among them.
      (3) 'Frodo' -i -> knowledge/ -> 9 files: sources.json, SOURCES.md, KN-TECH-047,
      KN-LIT-be0bfd, KN-LIT-3859, KN-LIT-2541, KN-LIT-2088, KN-LIT-118, gathers/GATHER-20260807.md.
      NONE concerns matrix generation; all are implementation-attack or multiplication-strategy
      entries that RQ-FRODO-3260cc.constraints already rules out of scope.
      (4) 'known-key|known key distinguisher|public permutation|PRP-PRF|switching lemma' -i ->
      ledger/ -> 12 files: RQ-AES-002, RQ-AES-003, GOAL-AES-002, GOAL-AES-003,
      IDEA-20260821-71fc18, IDEA-20260816-e4d944, IDEA-20260816-a14ea4, IDEA-20260816-75df2c,
      IDEA-20260813-2123f1, IDEA-20260805-b9047c, IDEA-20260731-006, EV-FAEST-002. Every one is
      an AES-lane or FAEST-lane record; NONE is under any RQ-FRODO-*.
      THIS GREP IS THE ONE THE 2026-08-24 REPAIR INDICTS. It searched for the string 'switching
      lemma' and, finding no ledger record under this lane, recorded NO INCUMBENT - when the
      incumbent it was looking for is not a record in this repository at all but a textbook bound
      that this record's own headline statistic instantiates. A grep over ledger/ cannot find a
      result that lives in the literature, and treating an empty in-repository grep as a
      literature negative is precisely what AGENTS.md rule 5 forbids. The corrected reading is
      recorded in `results` and in dominated_by.
      (5) 'SampleFrodo|T_chi' -> ledger/ -> 2 files: RQ-FRODO-3260cc.yaml and
      IDEA-20260808-e7ba81.yaml, the latter under RQ-FNDSA-001 (FN-DSA sampler), not this lane.
      (6) '^  title:|^  question_id:' -> ledger/proposals glob IDEA-20260821-*.yaml, to check
      the same-day batch for collisions; the two ML-KEM records whose bodies I then read
      (IDEA-20260821-0d1fde, IDEA-20260821-01623a) concern a field-norm Wesolowski instantiation
      and a NoMod robust-regression breakdown point respectively - no overlap.
      READ IN FULL: the lane's 8 pre-extracted proposal titles at
      scratchpad/ctx/proposals-RQ-FRODO-3260cc.txt; ledger/questions/RQ-FRODO-3260cc.yaml;
      ledger/questions/RQ-FRODO-a2dbe2.yaml; ledger/goals/GOAL-FRODO-001.yaml; the statement
      heads of H-FRODO-e0c651 and H-FRODO-8ea540; docs/inventor-protocol.md;
      docs/target-result-profile.md; knowledge/techniques/KN-TECH-1a5b7e.md.
      WEB SEARCHES RUN (WebSearch, 6 total this session; the two bearing on this record):
      'FrodoKEM matrix A generation AES128 versus SHAKE128 security analysis distinguisher' and
      'FrodoKEM public seed A known-key AES distinguisher matrix generation security concern'.
      WEB FETCHES ATTEMPTED (WebFetch, 7 total this session; those bearing on this record):
      https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem SUCCEEDED and returned the
      Gen-AES and Gen-SHAKE pseudocode and the parameter table (n, q, B, nHat, D, lenA);
      https://www.ietf.org/archive/id/draft-longa-cfrg-frodokem-02.html returned HTTP 404;
      https://www.iacr.org/archive/asiacrypt2014/88730350/88730350.pdf FAILED - the fetcher
      returned unreadable compressed PDF stream data, so Gilbert 2014 is NOT a read source here.
      2026-08-24 REPAIR PASS: no new retrieval was performed. The pass re-derived the standing of
      the A3 statistic from the record's own definitions and added a `recalled` citation for the
      PRP/PRF switching lemma; nothing was fetched and no provenance was upgraded.
    results: >-
      No record in this repository - proposal, hypothesis, evidence, experiment specification or
      knowledge entry - tracks FrodoKEM's matrix generator as an object. The lane's eight
      existing proposals are entirely chi-side and A-free: five conservation identities of the
      13-integer table (IDEA-20260805-390957), a magnitude-derived mutation control
      (IDEA-20260805-411b60), the Renyi order read as a sample-count receipt
      (IDEA-20260805-57fc49), scale-versus-tail-shape error in a failure rate
      (IDEA-20260805-f16b44), the table as a finite integer program (IDEA-20260808-2df781), the
      nbar-column secret as a rank-nbar dense sublattice (IDEA-20260808-dd4d30), the
      failure-indicator correlation matrix unstructured versus negacyclic (IDEA-20260816-1418f4),
      and worst-case-versus-average in a published delta (IDEA-20260816-3949c8). The known-key
      model appears in this repository only inside the AES goals, where it is used as a target,
      never as a MODELLING INPUT to a lattice KEM. The web searches returned the FrodoKEM
      specification family, the CFRG draft, the Microsoft reference implementation, and the
      general known-key literature (Knudsen-Rijmen 2007, Gilbert 2014, 'Revisiting Gilbert's
      known-key distinguisher', 'New and Old Limits for AES Known-Key Distinguishers',
      'Weak-Key Distinguishers for AES'); the second search explicitly reported finding no
      documented work linking FrodoKEM's public seed to the known-key model. That is a negative
      search result and is recorded as such, not as evidence that no such work exists.
      CORRECTED 2026-08-24: the original version of this screen concluded that the A3 statistic
      had no incumbent. IT HAS ONE, AND THE SCREEN'S OWN GREP (4) WENT LOOKING FOR IT UNDER THE
      RIGHT NAME AND DREW THE WRONG CONCLUSION FROM AN EMPTY LEDGER. A3 counts coincidences among
      m aligned blocks that a permutation produces WITHOUT replacement against m that an XOF
      produces with replacement; the optimal advantage of that comparison is the PRP/PRF switching
      gap m(m-1)/2 * 2^-128, a textbook bound. The record's exact rational form is an
      instantiation of that bound at three concrete m values, not a new measurement, and the
      surviving contribution is (i) the exact rather than leading-order form at three specific
      parameter sets, (ii) the q = 2^15 variant where 8 bits are dropped per block, and (iii)
      parts (C) and Stage 4, which the switching lemma does not speak to at all.
    verdict: >-
      UNVERIFIED, and deliberately so. What was actually READ is one fetched draft text and
      three fetched eprint abstract pages; the FrodoKEM standard proposal PDF was NOT read, and
      Gilbert 2014 was NOT read. CLAIMED NEW RELATIVE TO THIS REPOSITORY, AS NARROWED ON
      2026-08-24: treating the choice of
      matrix generator as a tracked object at all; the pairing of an algebraic invariance proof
      (the two audited numbers cannot see A) with an exact evaluation of the one statistic that
      can; and the observation that a public seedA places Frodo-AES in the
      known-key model rather than a PRF model. EXPLICITLY NOT CLAIMED NEW: the A3 statistic and
      its advantage, which instantiate the PRP/PRF switching lemma and are a property of the
      permutation-versus-function shape rather than of AES. ASSEMBLED FROM KNOWN PARTS AND NOT
      INVENTED HERE:
      the PRP-versus-PRF and known-key modelling distinctions are textbook; the birthday
      closed form is elementary; that FrodoKEM offers two generators is in the specification and
      is universally described as a performance choice. The proposal's content is the exact
      numbers at three named parameter sets and the reading question, not the concepts.
  object_first_candidate:
    tracked_object: >-
      The MULTISET OF ALIGNED 8-ENTRY BLOCKS of the public matrix A - that is, A projected onto
      the sequence of n*(n/8) tuples (A[i,j], ..., A[i,j+7]) for j = 0, 8, 16, ..., with the
      block boundaries fixed by the generator's own call structure - followed from the seed,
      through one generator call, into A, and read out as a coincidence count. WHAT THE OBJECT
      ACTUALLY SEPARATES, STATED HONESTLY AFTER THE 2026-08-24 REPAIR: it separates PERMUTATIONS
      FROM FUNCTIONS, not AES from anything. Two distinct generators with the same shape - AES-128
      under a public key and an ideal random permutation - are indistinguishable to it by
      construction, which is the content of NULL-0.
    lossiness: >-
      GENUINELY LOSSY, and the loss is compatible with the target's operations, which is the
      test docs/inventor-protocol.md section 2 demands. The projection discards (i) the ORDER of
      the blocks and their index labels, (ii) all cross-block structure, and (iii) at Frodo-640
      it additionally discards the top bit of every coefficient, which is exactly the bit the
      mod-q reduction discards. What is retained still propagates deterministically: a
      generator call writes exactly one block and nothing else, so the multiset is a function of
      the seed alone and is computed one call at a time with no interaction. The projection is
      NOT a change of coordinates - A is not recoverable from the multiset, because the index
      labels are gone and n^2/8 blocks in any order are consistent with (n^2/8)! matrices. This
      distinguishes it sharply from the worked failure in KN-LIT-7595, where the tracked pair
      was invertible and therefore worthless. THE PROJECTION IS ALSO LOSSY IN A WAY THAT MATTERS
      AGAINST THIS RECORD: it discards everything about the permutation except that it is one, so
      it cannot see any property of AES-128 specifically. Passing the lossy-projection test is
      necessary and, as NULL-0 shows, nowhere near sufficient for the object to answer the
      question the record was originally written to ask.
    propagation: >-
      One step of the target operation is one generator call. Under any bijection-based generator -
      Frodo-AES, or an ideal random permutation - it writes a block that is an image of a distinct
      input, so the propagation law is 'never repeat a block' (exactly, at q = 2^16) or
      'repeat only through the 8 dropped bits' (at q = 2^15).
      Under Frodo-SHAKE it writes a block drawn from an XOF stream, so the propagation law is
      'repeat with the uniform birthday rate'. TWO propagation rules, not three: AES and the ideal
      permutation share one. The difference between the two rules is a single exactly computable
      rational number per parameter set, and it is the switching gap.
    survival_score: >-
      ONE STEP, and the proposal says so rather than inflating it. The object survives generator
      call to generator call and then DISSOLVES: nothing downstream of A in FrodoKEM reads
      aligned blocks - the secret is multiplied against whole columns, the error terms do not
      involve A at all, and the block boundaries have no algebraic meaning after the matrix
      product. The honest reading is therefore that a nonzero advantage found here is a
      statement about the generator's SHAPE and NOT about the KEM and not about AES, and the
      proposal is built to say that out loud. That one-step survival is also exactly why the
      object is affordable: it needs no simulation of the scheme. It is also why the record's
      priority was lowered on 2026-08-24.
  null_object_control: >-
    FOUR ARMS, all on the identical counting code path, all in one invocation, and each able to
    fail. NULL-0 was ADDED 2026-08-24 and is the arm the record previously lacked; it is listed
    first because it is the one that determines how Stage 2's output may be read at all.
    NULL-0 (NULL OBJECT OF THE SAME SHAPE - AN IDEAL RANDOM PERMUTATION - AND IT CAN FAIL):
    replace AES-128 under seedA by a lazily-sampled ideal 128-bit permutation under a public key,
    keeping the identical index encoding, the identical mod-q reduction and the identical counter,
    and run Stage 2 and the counting instrument end to end. FORCED VALUE, DERIVED BEFORE THE RUN
    AND IDENTICAL TO THE AES ARM AT EVERY PARAMETER SET: zero coincidences at q = 2^16 (a bijection
    on injective inputs never repeats an output, and the mod-q reduction is the identity on a
    16-bit word); the same closed form at q = 2^15 (the same 8 bits per block are dropped from the
    same distinct outputs); and the same exact optimal advantage against the uniform arm. BECAUSE
    THAT VALUE IS DERIVED AND IDENTICAL, AGREEMENT BETWEEN THE AES ARM AND NULL-0 IS A CONTROLLED
    NULL AND CARRIES NO INFORMATION ABOUT AES-128 - it confirms only that the statistic reads the
    permutation shape, which is what the switching lemma already says. The arm's power is entirely
    in DISAGREEMENT: if the AES arm and the ideal-permutation arm differ at any parameter set,
    either the index encoding is not injective (Stage 0 should have caught it), or the counter is
    reading something other than block coincidences, or AES-128 under a public key departs from an
    ideal permutation at m <= 2^17.8 queries on a 2^32-point structured input subspace - and that
    last outcome would be a significant result requiring independent re-derivation before it is
    reported anywhere. THIS IS THE ARM THAT DEMOTES A3 FROM A FINDING TO AN INSTANTIATION, AND IT
    IS RUN FIRST FOR THAT REASON.
    NULL-1 (UNIFORM ARM, and it can fail): generate A of the same shape from a
    CSPRNG-backed uniform source over Z_q, count aligned-block coincidences, and require the
    observed count over >= 8 independent draws to be consistent with the exactly derived
    closed-form distribution. If the uniform arm's empirical count disagrees with its own closed
    form, the counter is wrong and no other arm is readable. Because the comparator is GENERATED,
    KN-TECH-1a5b7e mode 5 applies and it is drawn >= 8 times and reported as an interval, never
    as a point. NULL-2 (SENSITIVITY LADDER, and it supplies the threshold): a deliberately
    defective generator that repeats an aligned block with declared probability
    eps in {2^-30, 2^-25, 2^-20, 2^-15, 2^-10} - five points, i.e. at least three interior ones,
    per the KN-TECH-1a5b7e obligation-3 refinement - with the comparator NAMED as the uniform arm,
    the threshold declared before the run as 'the coincidence count must exceed the uniform arm's
    8-draw max at eps = 2^-20 and must not at eps = 2^-30', and MONOTONICITY of the count in eps
    reported explicitly rather than inferred from the two endpoints. NULL-3 (MAXIMAL-REMOVAL
    CONTROL): a generator that emits a CONSTANT block. Total removal must be at least as extreme
    as partial removal and on the same side; if the constant generator does not produce the
    maximal count, the statistic is not reading the object and the instrument is void
    (KN-TECH-1a5b7e mode 2). FORCED-VALUE DERIVATION, WRITTEN BEFORE THE RUN: the AES arm at
    q = 2^16 is FORCED to zero coincidences by injectivity plus bijectivity, so that arm cannot
    discriminate anything and is reported as a derived constant, not as a measurement - stating
    this is precisely obligation 4, and hiding it would be mode 3. The arms that CAN move are the
    uniform arm, the SHAKE arm, and the AES and ideal-permutation arms at Frodo-640 where 8 bits
    are dropped - and those last two must move TOGETHER.
  discriminated_from:
  - >-
    IDEA-20260805-390957 and H-FRODO-e0c651 part 1 derive conservation identities that the
    13-integer TABLE must satisfy. Those are chi-side and, by assertion A2 of this record, are
    invariant under the generator; this proposal tracks a different object entirely and would be
    run unchanged if every one of those identities held exactly.
  - >-
    IDEA-20260805-411b60 and H-FRODO-e0c651 part 2 derive the magnitude by which a seeded
    one-unit TABLE perturbation must move the DFR. This record's mutation control perturbs the
    GENERATOR, not the table, and its predicted response is a coincidence count rather than a
    bit shift in a failure rate. The two controls are complementary and neither substitutes.
  - >-
    IDEA-20260816-1418f4 compares an unstructured and a negacyclic encryption at matched
    marginals to isolate correlation attributable to RING structure in the FAILURE INDICATORS.
    That is a chi-and-ciphertext-side object; this is an A-side object, its statistic is a
    coincidence count rather than a correlation matrix, and its two arms differ by the PRG
    rather than by the algebra of the ring.
  - >-
    IDEA-20260808-dd4d30 concerns what the nbar-column secret does to the LATTICE. This record
    makes no lattice claim of any kind, derives no sieve cost, and is explicitly compatible with
    GOAL-FRODO-001.non_duplication[0], which reserves the lattice-estimator lane for
    GOAL-MLKEM-003 and GOAL-MLKEM-004.
  - >-
    RQ-FRODO-a2dbe2 owns the Fujisaki-Okamoto reduction ledger, including multi-user and
    multi-target accounting. This record does not evaluate any IND-CCA bound, does not sweep a
    query count, and does not convert its advantage into a bit-security movement; if a batch
    finds itself doing that it has crossed into a2dbe2's lane and must hand off.
  - >-
    The AES-lane records that mention known-key distinguishers (RQ-AES-002, RQ-AES-003 and the
    IDEA records listed in the novelty screen) treat AES as the target of cryptanalysis. Here
    AES is a component of another scheme and the only question asked is which model its use
    requires; no AES cryptanalysis is proposed, attempted, or claimed. NULL-0 makes this
    separation sharp rather than rhetorical: this record's statistic provably cannot see any
    property of AES-128 that an ideal permutation lacks.
  - >-
    THE PRP/PRF SWITCHING LEMMA ITSELF (external, recalled). This record does NOT discriminate
    from it and does not try to: A3 is an instantiation of it. What this record adds over the
    lemma is the exact rather than leading-order rational form at three named parameter sets, the
    q = 2^15 eight-bits-dropped variant, and everything in part (C) and Stage 4, which are
    modelling and reading questions the lemma does not address.
  citations:
  - ref: draft-longa-cfrg-frodokem (IETF datatracker HTML view)
    provenance: retrieved
    claim: >-
      Frodo.Gen with AES128 sets A[i,j+k] = C[i,j+k] mod q where C[i,j]||...||C[i,j+7] =
      AES128(seedA, b) and b encodes the 16-bit little-endian row and column indices padded with
      zeros to 16 bytes; Frodo.Gen with SHAKE128 sets row i from SHAKE128(i || seedA). Parameters
      returned: n = 640/976/1344, q = 32768/65536/65536, B = 2/3/4, nHat = 8, D = 15/16/16,
      lenA = 128 for all three.
    verified_by: idea-generator@2026-08-21
  - ref: >-
      The PRP/PRF switching lemma (standard; the modern game-playing proof is commonly attributed
      to Bellare and Rogaway, "Code-Based Game-Playing Proofs and the Security of Triple
      Encryption")
    provenance: recalled
    claim: >-
      An adversary making m queries distinguishes a random permutation on {0,1}^k from a random
      function on {0,1}^k with advantage at most m(m-1)/2 * 2^-k, and the bound is tight for the
      coincidence-counting adversary. Cited here as THE INCUMBENT on this record's measurement
      axis: it is exactly the quantity assertion A3 computes, it holds for any permutation and
      therefore says nothing about AES, and it costs zero compute. NOT READ THIS SESSION -
      recalled from memory, not fetched, and a reviewer with retrieval tools should confirm the
