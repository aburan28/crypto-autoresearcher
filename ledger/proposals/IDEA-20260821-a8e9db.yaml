  honest_prior_of_survival: >-
    By part, and the parts do not survive together. (i) That A1/A2 hold, i.e. the generator swap
    returns bitwise identical chi-side numbers: ~0.97 - this is close to an algebraic certainty
    and the 0.03 is pipeline risk, which is exactly why it is run as an instrument check.
    (ii) That the AES arm at q = 2^16 is forced to exactly zero coincidences: ~0.93, conditional
    on the fetched encoding being right, which Stage 0 checks. (iii) That the NULL-0
    ideal-permutation arm reproduces the AES arm exactly at every parameter set: ~0.97, and this
    is a DERIVED value rather than a bet - the 0.03 is implementation risk in the lazy-permutation
    sampler, not doubt about the mathematics. (iv) That the resulting exact
    advantage agrees with the leading-order switching bound at all three m: ~0.95.
    (v) That the filed primary text is SILENT on the modelling assumption for Gen, i.e. part (C)'s
    reading outcome: ~0.35 - I would bet against this, because specification authors usually say
    something, and a single sentence naming a PRF or random-oracle assumption refutes it outright.
    (vi) That any of this ever bears on FrodoKEM's security: ~0.02. (vii) That the whole run
    produces a defensible table plus a defensible reading: ~0.9 - but note that after the
