  assumptions:
  - >-
    The Gen pseudocode and parameter table transcribed from the CFRG draft fetch agree with the
    FrodoKEM standard proposal once that document is filed as a KN-LIT entry. The fetched content
    was a summariser's extraction and MAY BE EXTRACTION-DAMAGED - the sampling table it returned
    was truncated at index 6 and the parameter names it returned (nHat, D, lenA) may be its own
    renaming. RQ-FRODO-3260cc.constraints[0] forbids designing on unfiled sources, so Stage 0
    of this proposal is a transcription gate and not a formality.
  - >-
    AES-128 with a fixed key is a permutation on 128-bit blocks. This is a definitional property
    of the cipher, not an assumption about its strength, and it is what forces the AES arm's
    value at q = 2^16. IT IS ALSO WHY THAT VALUE CARRIES NO INFORMATION ABOUT AES: any bijection
    forces the same value, which is what NULL-0 exhibits.
  - >-
    The index encoding (i, j) -> b is injective over the actual index ranges. This is checked
    exhaustively in Stage 0 and can fail.
  - >-
    The XOF-as-random-function model is used ONLY to give the SHAKE arm a predicted value to be
    compared against; it is not asserted to be true, and the SHAKE arm is also measured
    empirically so that the model's prediction can be contradicted.
  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the unstated modelling assumption on Gen:
      the security argument needs a distribution on A it can call uniform, the statistical
      distance to uniform is essentially 1 for any 128-bit seed, and therefore some idealisation
      is doing the work. Which one, and whether it is the same for both generators, is the
      bottleneck. NOTE THAT THE A3 STATISTIC IS NOT ON THIS PATH: it quantifies the gap the
      switching lemma already bounds and does not touch which idealisation is assumed.
    baseline_embedding:
      parameter_slice: >-
        The baseline is the ordinary reading in which both generators are PRGs and the choice is
        performance-only, PLUS the PRP/PRF switching bound as the incumbent quantitative statement
        about the gap between them. That baseline is reproduced exactly as the parameter slice
        'exact advantage = the switching gap at m = n^2/8', and Stage 2 must land on it; a Stage 2
        output that does NOT agree with m(m-1)/2 * 2^-128 to leading order at each parameter set
        indicates an arithmetic error in this record, not a discovery.
      reproduction_check: >-
        Two frozen fixtures, not plots. (i) Symbolic: the invariance proof of A1/A2 must reproduce
        the lane's existing chi-side outputs bitwise under a generator swap. (ii) Numeric: the
        exact rational advantage must agree with the leading-order switching bound
        m(m-1)/2 * 2^-128 to within the difference the exact product form predicts, at all three
        m values.
    observation_collision:
      observable: >-
        The aligned-block coincidence count, and the derived optimal distinguishing advantage.
      distinct_preimage_search: >-
        A COLLISION EXISTS, IT IS CONSTRUCTIBLE, IT IS EXACT, AND IT IS THE FINDING THE 2026-08-24
        REPAIR RECORDS RATHER THAN THE LIMITATION IT WAS ORIGINALLY FILED AS. The two distinct
        preimages are AES-128 under a public key and an IDEAL 128-bit random permutation under a
        public key: they produce the identical observable at every parameter set, by construction,
        because the observable is a function of the permutation shape alone. That is NULL-0, and it
        means the observable cannot carry any conclusion about AES specifically. A second, weaker
        collision was already recorded and stands: at Frodo-640 the AES arm and the uniform arm can
        produce the SAME coincidence count, because the 8 dropped bits
        restore collisions. The proposal therefore reports the exact advantage rather than a
        verdict, and states in interpretation_limits that a matching count does not establish
        the two distributions are equal - it establishes only that THIS observable does not
        separate them. Searching for a second observable that separates AES-128 under a public key
        from an ideal permutation at m <= 2^17.8 queries on a 2^32-point structured subspace is
        named as forward guidance, and is squarely the AES lane's business rather than this one's.
    constructive_transforms:
    - transform: observable_fiber
      proposed_object: >-
        Hold the coincidence count fixed and vary the generator; ask which intrinsic invariant of
        A distinguishes the resulting matrices. The fibre provably contains at least AES-128 and
        every ideal permutation, so any candidate invariant must separate a real cipher from an
        ideal permutation to be of any use here. Candidates with a defined one-step propagation:
        the multiset of 8-entry blocks after an affine relabelling of the index space, and the
        distribution of the 128-bit XOR of two blocks at index difference delta, which is
        structured under AES's key schedule and uniform under an XOF - but the record notes that
        the second candidate is an AES-cryptanalysis question and belongs to RQ-AES-002/003.
      predicted_gain: >-
        None in attack terms, and none claimed. The gain would be identification: an observable
        that separates the generators at Frodo-640, where the primary one provably does not, and
        that separates AES from an ideal permutation, which the primary one provably cannot.
    quantifier_order: >-
      FOR EVERY parameter set P in {640, 976, 1344} and FOR EVERY generator G in {AES,
      IDEAL-PERMUTATION, SHAKE}, THERE EXISTS an exactly computable rational adv(P, G) such that
      the aligned-block coincidence statistic distinguishes Gen_G from uniform with advantage
      exactly adv(P, G); AND adv(P, AES) = adv(P, IDEAL-PERMUTATION) for every P, which is a
      derived equality and not a measurement.
      Note the order carefully: the advantage is allowed to depend on P and G, and no uniform
      statement over parameter sets is claimed. The separate modelling assertion has the weaker
      form: THERE EXISTS no standard-model assumption on AES-128 under a PUBLIC key that yields
      pseudorandomness of A - this is an existential over assumptions and is NOT provable here;
      it is stated as a reading question about the document, which is why Stage 4 exists.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is: an exact distinguishing advantage for one
        named statistic that reads the permutation-versus-function shape and nothing else, and a
        verbatim record of what the specification says about Gen. It can NEVER certify that no
        better distinguisher exists, can never certify ANYTHING about AES-128 in particular
        (NULL-0 proves that outright), and can never certify anything about LWE hardness at
        Frodo's dimensions. The recalled known-key distinguisher on full
        AES-128 requires data on the order of 2^64; Frodo consumes at most n^2/8 <= 2^17.8 blocks
        drawn from a 2^32-point structured subspace, so that result does NOT apply here and this
        proposal does not claim it does.
      nearby_object_control: >-
        TWO nearby objects on which the hoped-for conclusion fails. (i) The ideal random
        permutation, which reproduces every number in the deliverable table and is NULL-0 -
        this is the one the record originally lacked and it is fatal to A3 as a finding about AES.
        (ii) Frodo-640 itself: there the permutation arm's forced zero disappears because 8 bits
        are dropped, so a method that reported 'AES is distinguishable' uniformly would be wrong at
        exactly one of the three standardized parameter sets. Any verdict that does not differ
        between q = 2^15 and q = 2^16, or that differs between AES and an ideal permutation at any
        parameter set, has not identified the load-bearing structure.
    proof_obligations:
    - claim: A appears nowhere in E'S - S'E + E''
      responsibility: correctness
    - claim: the index encoding is injective at each n
      responsibility: feasibility
    - claim: 1 - prod_{i<m}(1 - i/2^128) is the exact uniform coincidence probability
      responsibility: size
    - claim: >-
        adv(P, AES) = adv(P, IDEAL-PERMUTATION) exactly, at every parameter set, and the common
        value is the exact form of the PRP/PRF switching gap at m = n^2/8
      responsibility: baseline
    - claim: the counting pipeline detects a seeded eps = 2^-20 repeat rate
      responsibility: interface
    - claim: statistical distance to uniform >= 1 - 2^(128 - D*n^2)
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: >-
      bitwise identity of the lane's chi-side outputs (Renyi divergence numerator/denominator
      and DFR numerator/denominator) under an AES-versus-SHAKE generator swap
    direction: different
    minimum_effect: >-
      zero difference is REQUIRED; any nonzero difference at all falsifies A1/A2 or exposes a
      pipeline bug, and either is a reportable result
  - metric: >-
      difference between the AES arm and the NULL-0 ideal-random-permutation arm, on every
      reported quantity, at every parameter set
    direction: different
    minimum_effect: >-
      EXACTLY ZERO, on every quantity and at every parameter set - a value DERIVED BEFORE THE RUN,
      so its agreement is a CONTROLLED NULL and carries no information about AES-128. A nonzero
      difference means the encoding gate failed, the counter is reading something other than block
      coincidences, or AES-128 departs from an ideal permutation at m <= 2^17.8 queries on this
      input subspace; the third reading may not be reported without independent re-derivation
  - metric: aligned-block coincidence count in the Frodo-AES arm at Frodo-976 and Frodo-1344
    direction: lower
    minimum_effect: >-
      exactly 0, a derived constant rather than a measurement, and forced by bijectivity alone -
      an ideal random permutation gives the same 0
  - metric: >-
      exact optimal distinguishing advantage of the aligned-block statistic, permutation arm
      versus uniform, at Frodo-1344, checked against the leading-order switching bound
      m(m-1)/2 * 2^-128 at m = n^2/8 = 225792
    direction: different
    minimum_effect: >-
      the exact rational value must agree with the leading-order switching bound to the precision
      the exact product form predicts. HAND ARITHMETIC PERFORMED IN THIS REPAIR SESSION AND
      LABELLED AS SUCH, NOT A MEASUREMENT AND NOT CITED FROM ANY RUN: m(m-1)/2 is about 2.55e10,
      i.e. about 2^34.6, so the advantage is about 2^-93.4 at Frodo-1344, about 2^-95.3 at
      Frodo-976 (m = 119072) and about 2^-97.7 at Frodo-640's 128-bit block before the 8-bit drop
      is applied. A computed value that is not within a factor of 2 of these is an arithmetic
      error in the pipeline or in this hand derivation, and either way is checked before anything
      is reported
  - metric: >-
      exact optimal distinguishing advantage of the aligned-block statistic, permutation arm
      versus uniform, at Frodo-640 (q = 2^15, 8 bits dropped)
    direction: different
    minimum_effect: >-
      the Frodo-640 value must differ from the Frodo-1344 value by more than a factor of 2, or
      the mod-q reduction is not doing what the derivation says it does. The AES arm and the
      NULL-0 arm must agree here exactly, as everywhere
  - metric: >-
      number of sentences in the filed primary text that state a model or assumption for Gen,
      per generator
    direction: different
    minimum_effect: >-
      0, 1 or 2 - a count, reported verbatim with page and line, with 0 being the outcome the
      proposal exists to be able to report and 2 (a different named model per generator) being
      the outcome that would refute the claim that the document is silent. AFTER THE 2026-08-24
      REPAIR THIS IS THE RECORD'S PRIMARY PREDICTION, because it is the only one whose outcome is
      not forced by the switching lemma
  minimal_test:
    design: >-
      One invocation, five arms, no lattice, no scheme simulation. ARM 0 (the control that governs
      how everything else is read, seconds): the ideal-random-permutation generator, run through
      the identical Stage 2 and identical counter, with its forced value - identical to the AES
      arm everywhere - written down first. ARM 1 (algebra, seconds):
      symbolic derivation that the decryption error contains no A, executed as a generator-swap
      regression on the lane's chi-side pipeline requiring bitwise identical output. ARM 2 (exact
      closed forms, seconds): evaluate 1 - prod_{i<m}(1 - i/2^128) with m = n^2/8, the q = 2^15
      variant, and 1 - 2^(128 - D*n^2), all in exact rational arithmetic at all three parameter
      sets, and report the resulting advantages as exact rationals plus their base-2 logarithms
      BESIDE the leading-order switching bound they instantiate.
      ARM 3 (counting instrument, minutes): implement the aligned-block counter and run it on the
      uniform arm >= 8 times, the eps-ladder at five values, and the constant-block maximal
      removal, reporting the uniform arm's interval and the ladder's monotonicity. ARM 4
      (reading, minutes of human time): grep the filed primary text for the Gen assumption and
      quote it verbatim, or record that no such sentence exists. THIS DISCRIMINATES, BUT NOT WHERE
      THE RECORD ORIGINALLY CLAIMED IT DID: ARM 0 forces ARM 2's output to be read as an
      instantiation of a known bound rather than as a finding about AES, and what is left to
      discriminate is (i) ARM 1's bitwise invariance, which can fail and would expose a pipeline
      bug, and (ii) ARM 4's three-way reading outcome, which is genuinely open and which no
      algebra forces. TOTAL COST: well under one hour of
      single-core compute; ARM 2 alone is under a second.
    controls:
    - >-
      NULL-0 ideal-random-permutation arm on the identical code path, with its forced value -
      identical to the AES arm at every parameter set - derived and written down BEFORE the run,
      and with agreement declared in advance to be a controlled null carrying no information
    - uniform-A arm drawn >= 8 times, reported as an interval, per KN-TECH-1a5b7e mode 5
    - >-
      seeded-defect ladder at eps in {2^-30, 2^-25, 2^-20, 2^-15, 2^-10} with the comparator
      named as the uniform arm, a numeric threshold declared before the run, and monotonicity
      reported explicitly
    - constant-block maximal-removal arm; must be the most extreme and on the same side
    - >-
      forced-value declaration for the AES arm at q = 2^16 (exactly zero) written before the run
      so that its agreement is not read as a measurement
    - >-
      incumbent-agreement check: the exact advantage must reproduce the leading-order PRP/PRF
      switching bound m(m-1)/2 * 2^-128 at each m, and a disagreement is an arithmetic error in
      this record rather than a result
    - >-
      index-encoding injectivity gate at all three n, exhaustively, before any counting
    - >-
      generator-swap bitwise-identity regression on the chi-side pipeline, run FIRST, as the
      instrument check for A1/A2
    required_metrics:
    - exact rational coincidence probability, uniform arm, per parameter set
    - exact rational coincidence probability and count, AES arm, per parameter set
    - >-
      exact rational coincidence probability and count, NULL-0 ideal-permutation arm, per
      parameter set, and its signed difference from the AES arm (predicted exactly zero)
    - measured coincidence count and 8-draw interval, uniform and SHAKE arms
    - exact optimal distinguishing advantage per (parameter set, generator), as a rational and in bits
    - >-
      the leading-order PRP/PRF switching bound m(m-1)/2 * 2^-128 at each m, printed beside the
      exact advantage it is the incumbent for
    - exact statistical-distance floor 1 - 2^(128 - D*n^2) per parameter set
    - ladder counts at all five eps values, with a monotonicity flag
    - constant-block arm count
    - verbatim quotation (or recorded absence) of the Gen assumption in the filed primary text
  falsification_conditions:
  - >-
    The generator-swap regression returns different chi-side numbers. Then A1 or A2 is false, or
    the pipeline is buggy; either way the invariance argument is withdrawn and the bug is the
    result.
  - >-
    The NULL-0 ideal-permutation arm returns anything different from the AES arm at any parameter
    set. The first two readings to test, in order, are a failed encoding gate and a counter that
    is not reading block coincidences. Only if both are excluded does the third reading arise -
    that AES-128 under a public key departs from an ideal permutation at these query counts on
    this structured subspace - and that reading may NOT be reported without independent
    re-derivation and a handoff to the AES lane. ADDED 2026-08-24.
  - >-
    The exact advantage disagrees with the leading-order PRP/PRF switching bound
    m(m-1)/2 * 2^-128 by more than the exact product form predicts. This record's arithmetic is
    wrong; no number is reported until it is reconciled. ADDED 2026-08-24.
  - >-
    The index encoding is not injective at some n. The forced-zero derivation collapses and the
    permutation arms' values must be recomputed from the actual encoding.
  - >-
    The uniform arm's measured coincidence count is inconsistent with its own closed form over
    8 draws. The counter is wrong and no arm is readable.
  - >-
    The eps-ladder is not monotone, or the eps = 2^-20 rung does not exceed the uniform arm's
    8-draw maximum. The instrument cannot sign a departure and no directional reading is attached
    to any arm (this is exactly the KN-TECH-1a5b7e refinement).
  - >-
    The constant-block arm is not the most extreme. The statistic is not reading the object and
    the instrument is void.
  - >-
    The filed primary text names a model for Gen, per generator, explicitly. Then the claim that
    the modelling assumption is unstated is FALSE, this record's part (C) is refuted, and the
    honest deliverable shrinks to an exact table that instantiates a textbook bound plus a passed
    instrument check - which is a very small lane contribution and the record says so.
  - >-
    All computed advantages are exactly zero at all three parameter sets. Then A3 is refuted, the
    performance-only reading of the generator choice is confirmed on this observable, and the
    forward guidance is the observable_fiber transform above.
  confounders:
  - >-
    THE BIGGEST ONE, AND THE ONE THIS RECORD ORIGINALLY FELL INTO: reading a forced value as a
    measurement. A3's numbers are forced by the permutation-versus-function shape and are
    reproduced exactly by an ideal random permutation, so any narrative in which they say
    something about AES-128 is a controlled null presented as a finding. NULL-0 is the mitigation
    and it must be run first; a deliverable that omits the NULL-0 column has reintroduced the
    defect.
  - >-
    The block boundary is a property of the GENERATOR'S CALL STRUCTURE, not of A. Frodo-AES makes
    8 coefficients per call and Frodo-SHAKE makes n per call, so 'aligned 8-entry block' is
    natural for AES and arbitrary for SHAKE. Comparing them on an AES-natural statistic is a
    choice that favours finding a difference, and the record must say so; the mitigation is to
    report the same statistic at block widths 8 and n for BOTH generators.
  - >-
    Extraction damage in the fetched pseudocode. The whole derivation rests on the AES input
    being i || j || 0^96 and on the reduction being 'mod q' on a 16-bit word. If the filed text
    differs, the forced values change.
  - >-
    Confusing 'A is not uniform' with 'A is weak'. Every 128-bit-seeded PRG has statistical
    distance essentially 1 from uniform on a large object; that fact is universal and carries no
    security content by itself. The record must present the floor as a MODELLING observation, and
    the advantage as the security-relevant quantity - noting that the advantage is itself the
    switching gap and therefore also carries no cipher-specific content.
  - >-
    A CSPRNG-backed 'uniform' arm is itself a PRG and inherits the same floor. Its use is
    legitimate only because the statistic reads 128-bit-block coincidences at rates far above any
    PRG's period effects, and this must be argued rather than assumed.
  - >-
    Reading the known-key literature as applicable. It is not at Frodo's data complexity; the
    method_ceiling says so and any deliverable that omits that sentence has overclaimed.
  interpretation_limits:
  - >-
    NO ATTACK, NO BREAK, NO SPEEDUP, NO EXPONENT. Nothing here is evidence about the hardness of
    LWE at Frodo's dimensions, in either direction.
  - >-
    THE A3 TABLE IS AN INSTANTIATION OF THE PRP/PRF SWITCHING BOUND, NOT A MEASUREMENT OF AES.
    An ideal random permutation reproduces every entry exactly. No sentence anywhere downstream
    may present those numbers as saying anything about AES-128 specifically.
  - >-
    A nonzero advantage on this statistic is a statement about the GENERATOR'S SHAPE ONLY. The
    tracked object dissolves after one step and nothing downstream of A reads aligned blocks.
  - >-
    A zero or matching advantage establishes only that THIS observable does not separate the two
    distributions. It does not establish that they are close, and it must never be reported as
    'the generators are equivalent'.
  - >-
    Everything is scoped to Frodo-640, Frodo-976 and Frodo-1344 exactly as filed, with q, n and
    lenA as read from the filed text. No other parameter set and no eFrodoKEM variant is spoken
    for.
  - >-
    The modelling assertion is a READING of a document, at the tier of 'this sentence is or is not
    present'. It is not a proof that no standard-model assumption suffices.
  heuristic_assumptions:
  - id: H1
    statement: >-
      SHAKE128, used as Frodo.Gen(i || seedA) -> 16n bits, produces on distinct inputs an output
      that is indistinguishable from a uniformly random bit string by any adversary running in
      time below 2^128, and in particular its aligned-block coincidence count is distributed as
      that of a uniform draw, up to a term bounded by the sponge indifferentiability advantage
      for the number of queries made here (at most n calls per matrix).
    rigorous_support: >-
      The rigorous ingredient it imitates is the indifferentiability of the sponge construction
      from a random oracle up to the capacity bound - the analogue, in this record's structure, of
      the role Canfield-Erdos-Pomerance plays in the exemplar: a proved statement about a generic
      object that the heuristic then asserts holds for the specific instance. NOT read this
      session; recalled, and flagged as such.
    validation_plan: >-
      Direct, and this is the rare case where the heuristic is sampled at the REAL parameters
      rather than at toy scale, because generating A is cheap. Sample >= 8 independent seeds per
      parameter set, generate A by SHAKE, count aligned-block coincidences at block widths 8 and
      n, and compare the empirical count distribution with the exact closed-form uniform
      prediction 1 - prod_{i<m}(1 - i/2^128) and its Poisson approximation. Tail check: the
      largest observed coincidence count across all draws against its exact predicted tail
      probability, in the style of the exemplar's smoothest-sample check. Transfer assumption:
      NONE for the SHAKE arm - the sampled parameters ARE the standardized parameters
      (n = 640/976/1344, q = 2^15/2^16/2^16, lenA = 128). Record the seeds.
  - id: H2
    statement: >-
      For the purpose of predicting the uniform arm, a CSPRNG-backed sampler is a faithful stand-in
      for the uniform distribution on Z_q^(n x n) at the coincidence statistic, i.e. its
      coincidence count distribution differs from the exact closed form by less than the 8-draw
      sampling interval.
    rigorous_support: >-
      The rigorous companion is the exact closed form itself, which is derived and not assumed;
      H2 asserts only that the sampler realises it. This pairing - an exact combinatorial bound
      plus the assertion that a specific object behaves like a uniform one of its size - is the
      structure the target profile requires of a heuristic.
    validation_plan: >-
      Draw the uniform arm >= 8 times at each parameter set and compare the empirical count with
      the closed form; report the interval, not the point (KN-TECH-1a5b7e mode 5). If the two
      disagree beyond the interval, H2 is refuted and the sampler is replaced before any other arm
      is read. Sampled parameters: the standardized ones. No transfer assumption.
  - id: H3
    statement: >-
      AES-128 under a PUBLIC, known key behaves like an ideal 128-bit random permutation with
      respect to the aligned-block coincidence statistic, at m = n^2/8 <= 2^17.8 evaluations drawn
      from the 2^32-point structured input subspace {i || j || 0^96}. Formally: the coincidence
      count of {AES128(seedA, b) : b in the encoded index set} is identically distributed with that
      of {pi(b) : b in the same set} for a uniformly random permutation pi.
    rigorous_support: >-
      The rigorous ingredient is bijectivity alone: BOTH objects are bijections, so BOTH produce
      pairwise distinct outputs on distinct inputs, and at q = 2^16 the counts agree at exactly 0
      with no assumption whatsoever. H3 has genuine content only at q = 2^15, where 8 bits per
      block are dropped and the distribution of the reduced-block collisions could in principle
      differ between a real cipher and an ideal permutation. This assumption is listed BECAUSE
      NULL-0 tests it and BECAUSE its failure would be the only cipher-specific finding this
      record could possibly produce - which is also why such a finding may not be reported without
      independent re-derivation.
    validation_plan: >-
      NULL-0 is the validation route and it runs at the REAL parameters, not at toy scale: run the
      identical counter over the identical encoded index set under (i) AES-128 with a fixed public
      seedA and (ii) a lazily-sampled ideal permutation, >= 8 seeds each, at all three parameter
      sets, and compare the coincidence counts and their intervals. Predicted distribution:
      identical, at the exact closed forms of Stage 2. Tail check: the largest observed reduced-
      block coincidence count at Frodo-640 under each generator, against the same exact predicted
      tail. Transfer assumption: NONE - the sampled parameters are the standardized ones and the
      input subspace is the real one. Record the seeds.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, and none could follow from this design. Cost of the
      MEASUREMENT: the closed forms are O(m) exact rational operations with m = n^2/8 <= 225792,
      i.e. sub-second; the counting arms are O(n^2) hash or cipher calls per draw, i.e. one matrix
      generation each, which the reference implementations perform in milliseconds to seconds. The
      NULL-0 arm adds one more generator of the same cost per draw, at most doubling ARM 3.
      Total well under one hour single-core including all ladders.
    memory_exponent: >-
