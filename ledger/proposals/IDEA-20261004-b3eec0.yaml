# IDEA-20261004-b3eec0
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-b3eec0
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-29 window table stores 268435456 entries and a width-28 table stores 134217728
  class: representation
  claim: >-
    A window of width 29 stores 268435456 precomputed entries. A window of
    width 28 stores 134217728. Two hundred sixty-eight million four hundred
    thirty-five thousand four hundred fifty-six exceeds one hundred
    thirty-four million two hundred seventeen thousand seven hundred
    twenty-eight by 134217728. The product of the two table sizes is
    36028797018963968. Their sum is 402653184. The gap is a table size,
    not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    28 is 268435456. Two to the power 27 is 134217728. Two width-28 tables both
    store 134217728, so that gap is 0 and their product is 18014398509481984. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 134217728.
    baseline_embedding:
      parameter_slice: The widths 29 and 28 and the sizes 268435456 and 134217728.
      reproduction_check: >-
        Two readers must agree that 2 to the power 28 is 268435456 and that
        2 to the power 27 is 134217728.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 134217728 drops the gap. Two width-28
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-28 table.
        predicted_gain: One hundred thirty-four million two hundred seventeen thousand seven hundred twenty-eight fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 268435456 and 134217728. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-28 tables. Both store 134217728, and the gap is 0.
    proof_obligations:
      - claim: The width-29 table stores 268435456 entries.
        responsibility: size
      - claim: The width-28 table stores 134217728 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Two hundred sixty-eight million four hundred thirty-five thousand four hundred fifty-six exceeds one hundred thirty-four million two hundred seventeen thousand seven hundred twenty-eight by 134217728.
  minimal_test:
    design: >-
      Compute 2 to the power 28 and 2 to the power 27. Do not add a
      curve point.
    controls:
      - Two width-28 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-29 table size is not 268435456.
    - The product of the two sizes is not 36028797018963968.
  confounders:
    - A width-28 table of size 134217728 is a different window from a width-27 table of size 67108864.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 134217728 and 67108864.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-29 table has size 2 to the power 28, and the
        frozen width-28 table has size 2 to the power 27.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Two hundred sixty-eight million four hundred thirty-five thousand four hundred fifty-six stored entries versus one hundred thirty-four million two hundred seventeen thousand seven hundred twenty-eight, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
