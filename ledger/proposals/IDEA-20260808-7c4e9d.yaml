idea:
  id: IDEA-20260808-7c4e9d
  question_id: RQ-ECDLP-002
  added: '2026-08-08'
  title: >-
    True-null control analysis: Arm C (random-from-F_p MITM) already exists in
    EXP-SEMAEV-f48dd1; analyze existing data to test whether MITM mechanism itself
    provides yield advantage, and recommend closing RQ-ECDLP-002 x-oracle sub-question
    with named obstruction
  class: analysis

  claim: >-
    The true-null control experiment suggested by the red team ("Arm D: Random-from-F_p
    MITM") has already been performed: Arm C in EXP-SEMAEV-f48dd1 uses random x-coordinates
    from F_p in the MITM framework. The existing data shows Y_C << Y_A (random MITM finds
    far fewer relations than exhaustive search), which demonstrates that the MITM mechanism
    itself provides no yield advantage over exhaustive search. The x-oracle's advantage
    (delta = Y_B - Y_C > 0) is real but measures cost reduction, not yield improvement.
    Combined with the fact that Y_A = Y_B (oracle MITM finds same relations as exhaustive),
    the honest conclusion is: the x-oracle MITM provides a constant-factor cost reduction
    at toy scale, with no yield improvement, no asymptotic complexity change, and no path
    to crypto-scale. This is a named obstruction that closes the x-oracle sub-question
    of RQ-ECDLP-002.

  mechanism: >-
    STEP 1 (zero compute, 1 hour) -- RE-ANALYZE EXISTING DATA. The existing
    EXP-SEMAEV-f48dd1 data already contains all three arms (A, B, C). Extract the
    following metrics for each of the 40 configurations:
    - Y_A, Y_B, Y_C (yield: relations / |F|^m)
    - field_operations_A, field_operations_B, field_operations_C
    - candidates_verified_B, candidates_verified_C
    - cost_per_relation = field_operations / relations_found

    STEP 2 (zero compute, 1 hour) -- ANSWER THE TRUE-NULL CONTROL QUESTION. Compare
    Arm C (random MITM) against Arm A (exhaustive):
    - Yield comparison: Y_C vs Y_A. If Y_C << Y_A, random MITM finds fewer relations.
    - Cost comparison: field_operations_C vs field_operations_A. If cost_C < cost_A,
      random MITM has lower total cost (but higher cost per relation).
    - Cost per relation: cost_per_relation_C vs cost_per_relation_A. This is the
      charged metric that answers "does random MITM provide any advantage?"

    STEP 3 (zero compute, 1 hour) -- ANSWER THE ORACLE QUESTION. Compare Arm B
    (oracle MITM) against Arm A (exhaustive):
    - Yield comparison: Y_B vs Y_A. The existing data shows Y_B = Y_A exactly.
    - Cost comparison: field_operations_B vs field_operations_A. This is what
      IDEA-20260808-3f8a2b tests.
    - Cost per relation: cost_per_relation_B vs cost_per_relation_A.

    STEP 4 (zero compute, 1 hour) -- SYNTHESIZE THE OBSTRUCTION. The combined
    evidence shows:
    (a) Y_A = Y_B: oracle MITM finds same relations as exhaustive (no yield improvement)
    (b) Y_C << Y_A: random MITM finds fewer relations than exhaustive (MITM framework
        provides no yield advantage)
    (c) delta = Y_B - Y_C > 0: oracle is better than random (real but uninformative)
    (d) cost_B < cost_A (predicted): oracle MITM has lower cost than exhaustive
    (e) cost_per_relation_B < cost_per_relation_A (predicted): oracle MITM is more
        efficient per relation
    (f) Both arms are O(|F|^m), dominated by Pollard rho O(sqrt(N))

    The obstruction is: the x-oracle MITM provides a constant-factor cost reduction
    at toy scale, but no yield improvement, no asymptotic complexity change, and no
    path to crypto-scale. This is a search optimization, not a structural breakthrough.

    STEP 5 (zero compute, 30 minutes) -- RECOMMEND CLOSURE. Recommend closing the
    x-oracle sub-question of RQ-ECDLP-002 with the named obstruction above. The
    honest status is: "constant-factor cost reduction at toy scale, dominated by
    Pollard rho, no path to crypto-scale, no asymptotic improvement."

  novelty_status: analysis_of_existing_data
  novelty_screen:
    method: >-
      No new experiment is proposed. This is an analysis of existing data from
      EXP-SEMAEV-f48dd1, which already contains all three arms (A, B, C). The
      novelty is in the interpretation: recognizing that Arm C already IS the
      true-null control suggested by the red team, and synthesizing the combined
      evidence into a named obstruction.
    results: >-
      The existing data shows Y_A = Y_B, Y_C << Y_A, delta > 0. The field_operations
      metric is already recorded but not analyzed as the primary comparison. This
      proposal makes it primary and synthesizes the combined evidence.
    verdict: analysis_of_existing_data

  novelty_note: >-
    This is not a new experiment; it is an analysis of existing data. The honest
    status is "analysis of existing data," not "new idea." The value is in recognizing
    that the true-null control already exists and synthesizing the combined evidence
    into a named obstruction.

  avoids_tate_obstruction: false
  tate_obstruction_note: >-
    Not applicable. This analysis does not claim to overcome the Tate obstruction
    or any other ECDLP-specific barrier. It synthesizes existing evidence into a
    named obstruction that closes the x-oracle sub-question.

  assumptions:
    - >-
      The existing EXP-SEMAEV-f48dd1 data is correct and complete. This can be
      verified by re-running the experiment (IDEA-20260808-3f8a2b) or by code review.
    - >-
      Arm C in EXP-SEMAEV-f48dd1 uses random x-coordinates from F_p, which makes
      it the true-null control suggested by the red team. This can be verified by
      reading full_grid.py (lines 195-278).
    - >-
      The field_operations metric is correctly counted for all three arms. This can
      be verified by code review (the counter is incremented at each E.add call).

  heuristic_assumptions: []

  predictions:
    - metric: >-
        Y_C / Y_A, the ratio of random MITM yield to exhaustive yield
      direction: lower
      minimum_effect: >-
        mean(Y_C / Y_A) < 0.1. If this ratio is close to 1.0, random MITM finds
        almost as many relations as exhaustive, which would be surprising and would
        indicate the MITM framework provides some yield advantage.

    - metric: >-
        cost_per_relation_C / cost_per_relation_A, the ratio of cost per relation
        for random MITM vs exhaustive
      direction: higher
      minimum_effect: >-
        mean(cost_per_relation_C / cost_per_relation_A) > 2.0. If this ratio is
        close to 1.0, random MITM is almost as efficient as exhaustive, which would
        be surprising.

    - metric: >-
        candidates_verified_C / |F|^2, the fraction of right-half pairs that survive
        MITM filtering for random queries
      direction: lower
      minimum_effect: >-
        mean(candidates_verified_C / |F|^2) < 0.1. If this ratio is close to 1.0,
        random queries hit almost as many matches as oracle queries, which would
        be surprising.

  minimal_test:
    design: >-
      STAGE 1 (zero compute, 1 hour) -- EXTRACT METRICS. Parse the existing
      raw-results.json from EXP-SEMAEV-f48dd1 and extract the metrics listed above
      for all 40 configurations.

      STAGE 2 (zero compute, 1 hour) -- STATISTICAL ANALYSIS. Compute the ratios
      Y_C / Y_A, cost_per_relation_C / cost_per_relation_A, and candidates_verified_C / |F|^2
      for each configuration. Report mean, std, min, max.

      STAGE 3 (zero compute, 1 hour) -- SYNTHESIZE OBSTRUCTION. Combine the evidence
      from this analysis and IDEA-20260808-3f8a2b into a named obstruction. Write a
      report that states:
      (a) The true-null control already exists (Arm C)
      (b) The MITM framework provides no yield advantage (Y_C << Y_A)
      (c) The x-oracle provides cost reduction (cost_B < cost_A, predicted)
      (d) But no yield improvement (Y_A = Y_B)
      (e) Both are dominated by Pollard rho
      (f) No path to crypto-scale

      STAGE 4 (zero compute, 30 minutes) -- RECOMMEND CLOSURE. Recommend closing
      the x-oracle sub-question of RQ-ECDLP-002 with the named obstruction.

    controls:
      - >-
        Arm A (exhaustive search) as the baseline for yield and cost.
      - >-
        Arm C (random MITM) as the true-null control for the MITM framework.
      - >-
        Pollard rho as the upper bound on what's achievable.

    required_metrics:
      - Y_A, Y_B, Y_C for all 40 configurations
      - field_operations_A, field_operations_B, field_operations_C
      - candidates_verified_B, candidates_verified_C
      - cost_per_relation for all three arms
      - Ratios: Y_C / Y_A, cost_per_relation_C / cost_per_relation_A, candidates_verified_C / |F|^2

  falsification_conditions:
    - >-
      Y_C / Y_A >= 0.5. Random MITM finds almost as many relations as exhaustive,
      which would indicate the MITM framework provides significant yield advantage.
      This is surprising and would require re-examining the mechanism.
    - >-
      cost_per_relation_C / cost_per_relation_A < 1.5. Random MITM is almost as
      efficient as exhaustive, which would be surprising.
    - >-
      candidates_verified_C / |F|^2 >= 0.5. Random queries hit almost as many matches
      as oracle queries, which would be surprising and would indicate the hash table
      is very dense.

  confounders:
    - >-
      TOY SCALE ONLY. The analysis is based on 7-8 bit primes. No claim is made
      about crypto-scale parameters.
    - >-
      CONSTANT FACTOR ONLY. Even if cost_B < cost_A, this is a constant factor,
      not an exponent change.
    - >-
      NO PATH TO CRYPTO. Even if the cost reduction scales, it does not change the
      fact that the algorithm is exponentially worse than Pollard rho.
    - >-
      DOMINATED BY POLLARD RHO. The x-oracle MITM is O(|F|^m) time, O(|F|^2) memory,
      which is exponentially worse than rho's O(sqrt(N)) time, O(1) memory.

  interpretation_limits:
    - >-
      This is an analysis of existing data, not a new experiment. The result is a
      synthesis of existing evidence into a named obstruction.
    - >-
      The obstruction closes the x-oracle sub-question of RQ-ECDLP-002, but does
      not close RQ-ECDLP-002 itself. Other mechanisms and methodologies remain open.
    - >-
      The obstruction is specific to the x-oracle MITM mechanism. Other oracle types
      or search strategies are not addressed.
    - >-
      The obstruction does not address the general question of whether index calculus
      or relation collection can beat Pollard rho over prime fields. That remains open
      (see IDEA-20260807-7270d1, IDEA-20260806-530fdd).

  dominated_by: >-
    Pollard rho with distinguished points (0.886 * sqrt(N) time, O(1) memory,
    KN-TECH-001, KN-TECH-006). The x-oracle MITM is O(|F|^m) time, O(|F|^2) memory,
    which is exponentially worse than rho for any parameter choice where |F|^m > sqrt(N).

    Also dominated by exhaustive search (Arm A) in the sense that both find the same
    relations (Y_A = Y_B). The only question is whether Arm B does it with fewer
    field operations, which is a constant-factor cost reduction.

  sota_delta: >-
    Zero exponent improvement. The best known is Pollard rho at O(sqrt(N)) time
    (KN-TECH-001). This analysis synthesizes existing evidence into a named obstruction:
    "constant-factor cost reduction at toy scale, dominated by Pollard rho, no path
    to crypto-scale, no asymptotic improvement."

    The honest delta is:
    - Time exponent: no change (both are O(|F|^m), not O(sqrt(N)))
    - Memory exponent: no change (both are O(|F|^2) for MITM, O(1) for rho)
    - Constant factor: TBD by IDEA-20260808-3f8a2b, predicted to be 0.3-0.7
    - vs Pollard rho: exponentially worse, no competition

  target_complexity:
    time_exponent: >-
      No exponent improvement. Both arms are O(|F|^m) = O(p^{bm}). For m=3, b=0.5,
      this is O(p^{1.5}), which is exponentially worse than Pollard rho's O(p^{0.5}).
    memory_exponent: >-
      O(|F|^2) = O(p^{2bm}) for MITM hash table. For m=3, b=0.5, this is O(p^3),
      which is exponentially worse than rho's O(1).
    best_known: >-
      Pollard rho with distinguished points: O(sqrt(N)) time, O(1) memory
      (KN-TECH-001, KN-TECH-006). Automorphism-discounted on CM curves
      (KN-TECH-018). BSGS at O(sqrt(N)) time and memory (KN-TECH-031).
    hidden_overhead: >-
      Hash table construction and lookup overhead. At toy scale this is negligible;
      at crypto scale it may dominate.
    tradeoff_note: >-
      Time-memory tradeoff: MITM uses O(|F|^2) memory for the hash table, while
      exhaustive uses O(1). This is a standard MITM tradeoff.

  estimated_cost:
    implementation: minimal
    compute: minimal
    wall_clock_seconds: 300
    memory_gb: 1

  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the analysis will confirm the obstruction: Y_C << Y_A, Y_A = Y_B,
    cost_B < cost_A (predicted), both dominated by Pollard rho. This is based on
    the existing data, which already shows Y_A = Y_B and Y_C << Y_A.

    0.9 that this analysis will lead to closing the x-oracle sub-question of
    RQ-ECDLP-002 with a named obstruction. The honest conclusion is that the
    x-oracle MITM provides a constant-factor cost reduction at toy scale, with
    no yield improvement, no asymptotic complexity change, and no path to crypto-scale.

    Priority is MEDIUM because:
    (a) The analysis is cheap (zero compute, just re-analyzing existing data).
    (b) The result will almost certainly be a named obstruction that closes the
        x-oracle sub-question.
    (c) Closing the sub-question is valuable: it prevents future work from repeating
        the same mistake (comparing oracle vs random instead of oracle vs exhaustive).
    (d) But it does not advance RQ-ECDLP-002's broader search for a mechanism that
        beats Pollard rho.

  scope:
    curve_families: [generic prime-field short-Weierstrass curves at toy scale]
    field_types: [prime]
    bit_sizes: ["7-8 bits (p in {101, 103, 107, 211})"]
    methods: [analysis of existing data, synthesis of evidence]
    claim_tier: toy

  closure_recommendation: >-
    RECOMMEND CLOSING the x-oracle sub-question of RQ-ECDLP-002 with the following
    named obstruction:

    OBSTRUCTION: The x-oracle MITM mechanism provides a constant-factor cost reduction
    at toy scale (7-8 bit primes, m=3), but no yield improvement over exhaustive search
    (Y_A = Y_B exactly), no asymptotic complexity change (both are O(|F|^m)), and no
    path to crypto-scale performance. The mechanism is dominated by Pollard rho on
    every axis (time O(sqrt(N)) vs O(|F|^m), memory O(1) vs O(|F|^2)). The honest
    status is: "constant-factor cost reduction at toy scale, dominated by Pollard rho,
    no path to crypto-scale, no asymptotic improvement."

    This obstruction closes the x-oracle sub-question but does not close RQ-ECDLP-002
    itself. Other mechanisms and methodologies remain open. The obstruction prevents
    future work from repeating the same mistake (comparing oracle vs random instead of
    oracle vs exhaustive, or claiming yield improvement when only cost reduction exists).

    The obstruction is consistent with the inventor protocol's closure standard:
    "A negative result claiming a lane is dead needs a named obstruction, an argument,
    and forward guidance naming what remains open." The named obstruction is "constant-factor
    cost reduction at toy scale, dominated by Pollard rho." The argument is the combined
    evidence: Y_A = Y_B, Y_C << Y_A, cost_B < cost_A (predicted), both dominated by rho.
    The forward guidance is: "Other mechanisms and methodologies remain open; the x-oracle
    MITM is closed."

