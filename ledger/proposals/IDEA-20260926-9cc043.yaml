  proof_search_map:
    bottleneck: >-
      Whether the direct S_4 descent, with 18 variables and degree <= 6, is
      refuted by a mutant closure at a degree far below its semi-regular
      reference (10) and at an ops count below the chained presentation's W_4
      on the same attempts; and whether the Koblitz constant vector moves any
      of it.
    baseline_embedding:
      parameter_slice: >-
        m = 2 direct S_3 at the RC-1 cell is the exact slice where the same
        instrument on the same field gives W_4 386/386: rerun closure.py on 10
        archived U62 and 5 S62 instances and reproduce labels, iterations and
        dimensions exactly (C-BASE) before any m = 3 number is read. The
        chained m = 3 arm is 89886c's own baseline.
      reproduction_check: >-
        Stage 0: S_4 against point addition (10^3 triples, every sign pattern);
        exact Boolean degree of the descended S_4 and its degree histogram; the
        semi-regular series coefficients; C-FIX for the direct sizes (17 x
        31180 at D = 6, 2924 x 106762 at D = 8); any mismatch with the derived
        numbers localises an arithmetic error in this record.
    observation_collision:
      observable: Per attempt and presentation, the minimal D at which W_D contains 1 (or UNDETERMINED), the first iteration, ops and peak memory, and the certificate.
      distinct_preimage_search: >-
        A low refuting D on the direct system could come from (i) S_4's
        structure, (ii) the Boolean shape (17 equations of degree 6 in 18
        variables is already overdetermined in a way the semi-regular series
        does not see), or (iii) an instrument reaching 1 on satisfiable
        systems. (iii) is excluded by Proposition S plus the satisfiable
        control; (ii) is separated by the same-support null (uniform
        coefficients on the union support of the 17 descended equations,
        redrawn per target); (i) is what remains.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The direct S_4 descent in 18 variables, degree read off exponent
          weights, replacing the chained 35-variable degree-3 system for the
          same decomposition question.
        predicted_gain: Unknown, the object of the measurement; no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold the attempt fixed and vary the presentation (direct, chained)
          and the constant vector (B = 126251, B = 1, and a uniformly drawn
          constant) on the random-x stratum.
        predicted_gain: Separates presentation from constant-vector effects at zero extra modelling.
    quantifier_order: >-
      Exponent-weight bound: FORALL m, FORALL basis, the direct descent of
      S_{m+1} with x_R fixed has Boolean degree <= m(m-1); exact. Soundness:
      FORALL attempts, FORALL D, 1 in W_D implies unsatisfiable (Proposition S
      of IDEA-20260923-5d0b8e). Empirical: FOR the named cell and the 130
      attempts, the per-presentation (D, ops) are as measured with CP95.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At n = 17, l = 6, m = 3 on the named targets, the direct S_4 descent
        has Boolean degree d (exact), is refuted by W_D at D = D* on a fraction
        r_D* (CP95) with ops O_direct, against the chained W_4 rate and ops on
        the same attempts; the Koblitz constant vector changes these by
        (measured)." Nothing about F4 step degree, Assumption 1, m >= 4, other
        n, or cost on ECC2K-130.
      nearby_object_control: >-
        The same-support null for the direct system (expected refuted only at
        the semi-regular D = 10 or not at all under the cap) and the satisfiable
        planted arm (refutation must fail by theorem).
    proof_obligations:
      - claim: The resultant formula reproduces S_4 (vanishes exactly on x-coordinates of four points summing to O, checked by point addition).
        responsibility: correctness
      - claim: The exponent-weight bound and the exact Boolean degree of the descended S_4 at this cell.
        responsibility: size
      - claim: The semi-regular reference D_reg and the Macaulay sizes at N = 18.
        responsibility: size
      - claim: Proposition S applies to the direct system with field equations (radical, zero-dimensional over F_2).
