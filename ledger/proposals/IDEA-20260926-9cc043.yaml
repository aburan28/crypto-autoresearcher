idea:
  id: IDEA-20260926-9cc043
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE DIRECT S_4 DESCENT AT m = 3 HAS BOOLEAN DEGREE AT MOST 6 IN 18
    VARIABLES BECAUSE x^{2^k} IS F_2-LINEAR (exponent-weight bound), against the
    chained presentation's degree 3 in 35: its exact degree, first-fall degree,
    semi-regular reference D_reg (10 if the degree is 6) and W_D refutation
    rate and ops are measured on the n = 17 field against the chained system on
    the same targets, with the Koblitz sibling as a constant-vector arm
  class: measurement

  claim: >-
    CEILING FIRST. Arity m = 3, where the product law closes ECC2K-130
    regardless (free-oracle floor 2^68.58 against rho 2^60.81, KN-FIND-aa2efc,
    unreviewed); the record supplies the per-attempt cost law of the OTHER
    m = 3 presentation this program has never run its closure instrument on,
    as a building block for the m >= 4 rows. Representation class R1 (Boolean
    coordinates of x_1, x_2, x_3 in a basis of V = {deg < 6}); attack stage:
    the per-attempt decomposition solve.

    THE FROBENIUS-AWARE DEGREE (exact, zero compute). Over characteristic 2,
    x^{2^k} is F_2-linear in the Boolean coordinates of x in ANY basis
    (IDEA-20260926-917981 Proposition B(ii) uses exactly this), so a monomial
    prod x_i^{e_i} descends to Boolean degree sum_i HW(e_i), the sum of the
    binary weights of the exponents, not sum_i e_i. For S_{m+1}, of degree
    2^{m-1} in each variable, every exponent has HW <= m - 1, so the direct
    descent with x_R fixed has Boolean degree at most m(m-1); at m = 2 this
    is the degree 2 of KN-FIND-5a8d3e's S_3 system, and at m = 3 it is 6, not
    the 12 a characteristic-0 reading would give. THE DIRECT S_4, WRITTEN
    OUT. With S_3(a, b, X) = (a+b)^2 X^2 + ab X + (ab)^2 + B (KN-TECH-b18366's
    formula rearranged), S_4(x_1, x_2, x_3, x_R) = Res_X( S_3(x_1, x_2, X),
    S_3(x_3, x_R, X) ) is the resultant of two quadratics in X, which in
    characteristic 2 is (alpha_1 gamma_2 + alpha_2 gamma_1)^2 + (alpha_1 beta_2
    + alpha_2 beta_1)(beta_1 gamma_2 + beta_2 gamma_1) with alpha_1 =
    (x_1 + x_2)^2, beta_1 = x_1 x_2, gamma_1 = (x_1 x_2)^2 + B, alpha_2 =
    (x_3 + x_R)^2, beta_2 = x_3 x_R, gamma_2 = (x_3 x_R)^2 + B (derived here
    from the textbook Sylvester determinant; the run verifies it against point
    addition before use, as the self-test does for S_3). Reading off exponent
    weights: the squared term has Boolean degree <= 3 (its top monomial
    x_1^4 x_2^4 x_3^4 has weight 3), each factor of the product term has
    degree <= 3 (top monomials x_1 x_2 x_3^2 and x_1^2 x_2^2 x_3), so the
    product has degree <= 6, attained on x_1^3 x_2^3 x_3^3 x_R unless the
    coefficients cancel; the EXACT degree is a Stage-0 computation. The
    variable count is m l = 18 at l = 6 against the chained system's
    m l + (m - 2) n = 35 (KN-TECH-b18366; IDEA-20260926-89886c). The
    curve enters S_4 only through B (S_3 does not involve A, KN-TECH-b18366;
    IDEA-20260922-1a081a HB1-1's rigorous part; IDEA-20260913-449d2b), so at a
    fixed (field, V, x_R) the Koblitz sibling's direct system differs from the
    RC-1 curve's ONLY in the descended constant vector coords(B) with B = 1
    against B = 126251; this is the constant-vector arm below, and it answers
    the seam item "first-fall degree of Koblitz versus ordinary descents at
    matched n" by proposition: identical above the constant, with the
    constant known to move plain M_4 but not W_4 at m = 2 (KN-FIND-7c1e94
    N-CONVL 105/144 at M_4, 144/144 at W_4).

    THE REFERENCE NUMBERS (derived here, re-derived in Stage 0). Semi-regular
    Boolean series (1+z)^18 / (1+z^d)^17: first non-positive coefficient at
    D_reg = 10 for d = 6 (coefficient of z^10 is C(18,10) - 17 C(18,4) =
    43758 - 52020 < 0 while z^9 gives 48620 - 13872 > 0), D_reg = 9 for d = 5,
    D_reg = 8 for d = 4. Macaulay column counts at N = 18: 31180 (D = 6),
    63004 (7), 106762 (8), 155382 (9), 199140 (10); row counts for 17
    equations of degree 6 with multipliers of degree <= D - 6: 17, 323, 2924,
    16796, 68816; dense bits at D = 10 about 1.7 GB, the edge of the 3 GB
    cap. So a semi-regular direct S_4 would sit at D = 10, barely reachable;
    the question is whether it falls far below, as S_3 did (semi-regular
    D_reg = 5 predicted, W_4 refutes 386/386 and 400/400; KN-FIND-5a8d3e,
    KN-FIND-c3a917), and whether the fall makes the 18-variable direct system
    cheaper to refute than the 35-variable chained one at fixed targets.

    THE THREE READINGS, decided by counts on identical targets. E-DIRECT: the
    direct system is refuted by W_D at a D and an ops count below the chained
    W_4 of IDEA-20260926-89886c on the same unsatisfiable attempts (the
    Frobenius-weight degree buys a cheaper presentation). E-CHAIN: the direct
    system needs D >= 8 (or is unreached under the cap) while the chained one
    refutes at W_4 (KN-TECH-b18366's presentation wins, as Semaev chose it for,
    KN-LIT-fa346d). E-EQUAL: both refute with ops within a factor 2. On the
    constant-vector arm: E-CONST-BLIND (Koblitz and RC-1 rates and ops agree
    within CP95 on the random-x stratum) or E-CONST-SEES (they differ, and the
    difference is localised to the constant by the same-support constant-swap
    null).

  mechanism: >-
    OBJECT FRAME. Representation R1 as above. The relation-search object is
    unchanged (Class I partial action under translation by factor-base
    elements, IDEA-20260806-c5d183). The solver-side tracked object is the
    degree-D mutant closure W_D(x_R) of the direct S_4 ideal, with operation
    set Sigma the D-bounded ring action of B (as IDEA-20260926-89886c) plus the
    PRESENTATION CHOICE direct-versus-chained, which is a change of ideal (the
    chained ideal in 35 variables eliminates to the direct one in 18) and not
    a change of coordinates, so 917981 Proposition B does not identify them
    and the comparison is a measurement. TRICHOTOMY: coordinate-independent in
    Proposition B's weak sense (W_D depends on the set V and x_R and on the
    presentation, not on the basis); not a projection of the group.
    LOSSY-PROJECTION TEST against Sigma: W_D discards every consequence of the
    ideal of degree above D; the discard is Sigma-compatible by definition of
    the closure; it is lossy in this representation because M_D is strictly
    smaller than W_D wherever the mutant step is needed (KN-FIND-5a8d3e U62).
    THE ONE OPEN NUMBER: the pair (minimal refuting D, ops) for the direct
    presentation against the chained one on the same attempts.
    WHY THE EXPONENT WEIGHT IS THE MECHANISM. The Weil descent's degree is set
    by HW(e), a property of characteristic 2 (Frobenius is additive), and it is
    why the direct S_4 is a candidate at all: its 17 equations of degree <= 6
    in 18 variables against 34 equations of degree <= 3 in 35 variables is a
    trade of degree for variables that the closure cost, polynomial in N at
    fixed D, prices differently from the chained trade; which side wins at D
    below the semi-regular reference is what the fall structure decides.
    OFF-LIMITS COMPONENT DECLARED (docs/object-frame-ideation.md section 2):
    F2 as the family; V = {deg < 6} inside KN-OPEN-020's scoped-out class, not
    escaped. What is added beyond F2 as filed: the direct S_4 descent run
    through the closure instrument with its exponent-weight degree stated, the
    direct-versus-chained comparison on identical attempts, and the
    constant-vector reading of the Koblitz arm.

