  minimal_test:
    design: >-
      CELL. n = 17, f = t^17 + t^3 + 1, m = 3, l = 6, V = {deg < 6}; primary
      curve RC-1 (A = 97044, B = 126251); Koblitz sibling y^2 + xy = x^3 +
      x^2 + 1; targets the 100 unsatisfiable and 30 satisfiable subgroup
      attempts of IDEA-20260926-89886c's primary cell (same seed stream and
      rule, so instances join), plus the random-x stratum (100 uniform x_R)
      for the constant-vector arm. ARMS. (a) direct S_4 descent, N = 18,
      closures W_6, W_7, W_8 (M_D beside, as baseline) under the cap; (b) the
      chained system of 89886c (W_3, W_4) on the same attempts, read from that
      design if it has run, else run here; (c) Koblitz constant vector B = 1
      on the random-x stratum, and a uniformly drawn constant vector on the
      same stratum (constant-swap null); (d) same-support null for the direct
      system, redrawn per target, one unsatisfiable draw kept per slot; (e)
      satisfiable planted arm x_R = x(P_1 + P_2 + P_3). INSTRUMENT.
      experiments/EXP-CERTBIN-e94b27/impl/closure.py (generic in nv, D, neq;
      chunked products), macaulay.py's multilinear helpers extended with the
      resultant construction and a degree-<=6 descent (about 150 lines),
      oracles_rc1.py generalised to the m = 3 enumeration oracle (as 89886c),
      the separate-process verifier extended to degree-6 equations. No
      external solver; nothing `missing`.
      PROCEDURE. (0) Zero-run: S_4 formula check against point addition;
      exact Boolean degree and degree histogram; semi-regular series;
      C-FIX sizes; C-BASE regression on archived m = 2 systems. (1)
      Enumeration oracle labels on every attempt (both curves). (2) W_6 on
      every attempt (arm a); W_7 and W_8 on the first 40 unsatisfiable, 15
      satisfiable and 15 null attempts, chunked; UNDETERMINED(budget) recorded
      per instance. (3) Arm (c) on the random-x stratum at the D that (2)
      selects. (4) Certificates verified; ops and peak RSS logged. (5)
      Per-instance join with the chained arm; aggregation with exact CP95.
      SEEDS: 89886c's stream for the shared attempts; one recorded stream for
      the random-x stratum, the null draws and the constant swaps.
      METRICS (units): exact degree (integer); r_D per D (fraction, CP95);
      first iteration (count); ops_to_1 and ops_to_fix (GF(2) 64-bit-word XOR
      operations); peak RSS (bytes); certificate sizes; per-instance
      (direct D*, chained D*) pairs. CONTROLS: same-support null (d);
      satisfiable planted arm (e); C-BASE; constant-swap null within (c);
      separate-process verification; no relabelled Z/NZ control (no
      group-structure claim). OUTCOME TABLE. POSITIVE (E-DIRECT, null not
      refuted, satisfiable controls 0): the exponent-weight presentation is
      the cheaper m = 3 refutation object at this cell and is handed to the
      m >= 4 pricing seam (S_5, degree <= 12 in 4l variables) as the
      presentation to price. NEGATIVE (E-CHAIN): the chain's degree-3
      presentation stays the object; the direct route is closed at this cell
      with the measured (D, ops) obstruction. ARTIFACT (any refuted
      satisfiable control, a failed certificate, a C-BASE or Stage-0
      mismatch, or UNDETERMINED on more than 20% at every D): void; nothing
      about m = 3 is read. FALSIFICATION THRESHOLD, FIXED NOW. E-DIRECT is
      falsified iff r_7 <= 0.50 or direct ops exceed chained ops; E-CHAIN is
      falsified iff r_7 >= 0.50 with direct ops below chained. COST
      (estimate): implementation medium (about 400 lines including the
      resultant, the degree-6 descent, the m = 3 oracle and the verifier
      extension); compute about 10^0 to 10^1 CPU-hours at W_6 and W_7, up to
      10^2 at W_8 with chunking, one core under 3 GB. Not a measurement.
    controls:
      - Same-support null family for the direct system, per target, identical closure code path (hash recorded).
      - Satisfiable planted control; any refutation voids the instrument (Proposition S).
      - C-BASE regression on 15 archived RC-1 m = 2 systems, exact.
      - Constant-swap null inside the Koblitz arm (uniform constant vector at the same x_R).
      - Enumeration oracle as the sole satisfiability ground truth; separate-process certificate verification.
    required_metrics:
      - exact Boolean degree and degree histogram of the descended direct S_4 (Stage 0)
      - r_D with CP95 for D in {6, 7, 8}, direct; chained W_3 and W_4 rates on the same attempts
      - ops_to_1 and ops_to_fix per instance and presentation; peak RSS
      - null and satisfiable-control counts; certificate verification counts
      - Koblitz and constant-swap arm rates and ops on the random-x stratum

