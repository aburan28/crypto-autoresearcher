      addition fails; a void run is not evidence (AGENTS.md rule 3).

  confounders:
    - Degree 6 equations make the W_D product stack large; chunking changes constants, not the size law, and UNDETERMINED(budget) is reported per instance.
    - The chained arm's ops depend on the chain topology (KN-TECH-b18366 versus Karabina, KN-LIT-327949); one topology is compared.
    - Lower-chain satisfiability (an m = 2 decomposition) is excluded by the m = 3 oracle rule as in 89886c; the direct S_4 vanishes on such attempts too and they are labelled and excluded.
    - On the random-x stratum x_R need not be an abscissa of either curve; satisfiability is then algebraic (a solution gives points on E or its twist), and the stratum is used only for the constant-vector comparison.
    - One field, one l, one m; nothing transfers to n = 19 without the replicate.

  interpretation_limits:
    - Toy tier; n = 17, m = 3, l = 6, two curves. Nothing about F4 step degree, Semaev's Assumption 1, m >= 4, or any n >= 19.
    - A W_D non-refutation is a degree-D statement, never a hardness claim; a refutation rate is not a solve.
    - No exponent moves; the m = 3 row is closed on ECC2K-130 by the product law regardless of presentation.
    - KN-OPEN-020 class of V is the scoped-out linear-subspace class; not escaped.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Reference-series relevance.) The Boolean semi-regular series for 17
        equations of the measured degree in 18 variables gives the D_reg a
        generic system of that shape would need, so a refutation at D well
        below it is a structural fall of S_4, as it was for S_3.
      rigorous_support: >-
        Bardet-Faugere-Salvy semi-regularity for Boolean systems (the series
        used in KN-FIND-5a8d3e, retrieved there); exact for the same-support
        null at m = 2 (rank M_4 = 2771 on 124/124) and wrong for S_3, which is
        the point.
      validation_plan: >-
        SAMPLE the same-support null (d) at the D the direct arm refutes at;
        COMPARE its refutation rate and rank profile with the series
        prediction; TAIL: any null refuted below D_reg is listed by idx and
        breaks the reference. TRANSFER: none.
    - id: H2
      statement: >-
        (Constant-vector locality.) Any difference between the Koblitz and
        RC-1 direct systems at identical x_R is carried by the constant vector
        alone, so the constant-swap null reproduces it.
      rigorous_support: >-
        Exact that the two systems differ only in the constant vector
        (S_{m+1} depends on the curve only through B; 1a081a HB1-1); the
        heuristic is only that the specific vector coords(1) behaves like a
        drawn constant, imitating N-CONVL's drawn-constant law at m = 2.
      validation_plan: >-
        SAMPLE 100 random-x attempts per arm; COMPARE Koblitz, RC-1 and
        constant-swap rates and ops; TAIL: the largest per-instance ops ratio.
        TRANSFER: none.

  heuristic_note: The exponent-weight bound, the resultant formula and the constant-vector identity are exact; H1 and H2 concern the readings only.

  target_complexity:
    time_exponent: >-
      NO EXPONENT ON THE ECDLP IS CLAIMED OR MOVED. Per attempt at m = 3 the
      direct closure costs polynomial in N = 18 at fixed D (rows x rank x
      words; at D = 8 about 2924 x rank x 1668 words) against the chained
      closure's polynomial in N = 35 at D = 4; which is smaller at the
      refuting D is the measurement. Both are compared with the enumeration
      oracle (about 2^13 root-findings), which dominates at this cell.
    memory_exponent: >-
      Bit-packed Macaulay and product stacks polynomial in N; up to about
      1.7 GB dense at D = 10 for the direct system, chunked; disclosed as a
      real cost against O(1) memory for enumeration.
    best_known: >-
      Rho at 2^60.81 on ECC2K-130; at the cell, the enumeration oracle at
      about 2^13 root-findings per attempt and rho at about 160 group
      operations for q = 32603.
    hidden_overhead: Pure-Python engine constants; chunking overhead; the verifier extension to degree 6.
    tradeoff_note: Attempts are embarrassingly parallel; the closure trades polynomial memory for time against O(1)-memory enumeration.

