idea:
  id: IDEA-20260807-8fbc86
  question_id: RQ-MLKEM-003
  added: '2026-08-07'
  title: Eighteen ML-KEM batches used c_T = 0.292, c_M = 0.2075 and a dimension-70 crossover --
    every one RELAYED, none measured -- while the instrument that could measure them existed from
    GOAL-MLKEM-004 batch 1 and was pointed only at vector GEOMETRY; and no lattice claim in this
    program has ever been positioned against a public challenge record
  class: measurement
  claim: 'GOAL-MLKEM-003''s completion criterion C1 required a FIPS 203 estimate ''calibrated
    by measured sieve behaviour at reduced dimensions''. The goal''s own closure_quorum_status_addendum_batch_011
    states that after eleven batches ''no measurement of sieve behaviour exists anywhere in this
    campaign'', and DEC-20260803-64b55b closed it at batch 12 with C1 unmet. GOAL-MLKEM-004 then
    BUILT a working instrument (passagemath 10.8.7 + fpylll 0.6.4 + g6k 0.1.2, KN-TECH-14efa5)
    and did measure real sieve output -- 17,919 certified g6k bgj1 dual vectors at dim 60, q =
    127 -- but measured the SCORE DISTRIBUTION of those vectors across all six batches. EV-MLKEM-020
    charged memory using a model it states is BORROWED, because lwe_primal supplies no memory
    figure at all, and closes by saying it ''does not price enumeration memory, and it does not
    close KN-OPEN-017''. SEPARATELY: KN-TECH-049 prescribes positioning any lattice feasibility
    claim against the SVP Challenge, the Lattice Challenge and the LWE Challenge; a search of
    ledger/ for ''Darmstadt'', ''SVP Challenge'' and ''LWE Challenge'' returns ZERO hits, and
    KN-TECH-049 is cited by zero ledger records -- as are KN-TECH-041, KN-TECH-042, KN-TECH-043
    and KN-TECH-045.'
  mechanism: 'Two joined deliverables on one instrument. (i) MEASURE THE CONSTANTS: run g6k (bgj1,
    bdgl) and fpylll pruned enumeration on the SAME random q-ary bases at dimensions 50-85, recording
    wall-time, peak database size and peak RSS per run; fit (c_T, c_M) and the measured enumeration
    exponent; report the crossover under Cost = T * M^alpha for alpha in [0,1] against the relayed
    0.292 / 0.2075 / 70. (ii) ANCHOR THE INSTRUMENT: solve one small published LWE Challenge instance
    end to end on the same instrument, submit to check_challenge, and record wall-time, memory
    and the verified certificate. The LWE Challenge is generated by MPC so no party knows the
    secret -- exactly the certificate discipline docs/claims-and-verification.md demands and the
    one property no measurement in this slice has.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - H-MLKEM-b1300f is scoped as 'cost-model arithmetic over a two-member family of SVP oracles
      ... NO LATTICE IS REDUCED, NO ATTACK IS IMPLEMENTED'; it derives the crossover shift exponent
      1 + 0.7106*alpha analytically and then CALIBRATES on the same relayed constants whose measurement
      is the gap. It consumes the measured leg; it cannot supply it.
    - EV-MLKEM-2cd08b and its five predecessors validate the instrument only against itself --
      reproduction 32/32, disjoint-seed ensembles, matched-V controls. None of the six batches
      solved, or attempted, an instance whose answer was fixed by a third party.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED and not claimed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: dual-attack score geometry,
      which six batches already own. The tracked object is the RESOURCE PAIR, not any score statistic.'
    tracked_object: The pair (peak retained-list size, wall-time) as a function of dimension.
    one_step_propagation_rule: Incrementing the block size extends both series by one point; the
      fitted exponents update by refit.
    newness_score: Nil as mathematics. The content is that the program's cost-model inputs have
      been relayed for eighteen batches on an instrument that could measure them.
  lossy_projection_identifiability_audit:
    projection: a sieve run -> (peak list size, wall time).
    what_is_discarded: Every vector produced; only resource usage is retained.
    is_it_only_a_change_of_coordinates: 'NO. Honest caveat: this is a WEAK object producing two
      numbers per run, and it can never make a mathematical statement about LWE. Its value is
      that two constants downstream of it carry every margin the program has computed.'
    mirror_failure_check: 'CHECKED. The failure would be constants that come out at the relayed
      values by construction. They cannot: the fit is over measured runs and the relayed values
      are asymptotic, so agreement would be a genuine finding rather than a tautology.'
  null_object_control:
    primary_null: 'THE THIRD-PARTY CERTIFICATE. The LWE Challenge instance is the null for the
      whole instrument: its answer is fixed by someone else, so a successful check_challenge submission
      is the one validation in this slice that does not depend on the program''s own review chain.
      If the instrument cannot solve ANY published instance, every feasibility figure it has produced
      must be restated as a multiple of a capability never demonstrated.'
    secondary_nulls:
    - 'REGRESSION: reproduce EV-MLKEM-2cd08b''s dim-60 measurements before extending the dimension
      range.'
    - 'FORCED ORDERING: sieving must beat enumeration above the crossover and lose below it; a
      fit that violates the ordering at both ends is broken.'
  assumptions: []
  predictions:
  - metric: measured c_M against the relayed 0.2075
    direction: different
    minimum_effect: A fitted value whose CI excludes 0.2075; that would move every memory-charged
      margin the program has computed.
  - metric: measured crossover dimension against the relayed 70
    direction: different
    minimum_effect: A crossover outside [65, 75] at alpha = 0.
  - metric: LWE Challenge instances solved with a verified certificate
    direction: higher
    minimum_effect: At least one, which is more than zero.
  minimal_test:
    design: Dimensions 50-85, two sieve kernels and pruned enumeration on identical bases, three
      seeds per cell; fit (c_T, c_M) and the enumeration exponent with CIs; then one published
      LWE Challenge instance end to end with check_challenge submission.
    controls:
    - LWE Challenge third-party certificate
    - dim-60 regression
    - sieve/enumeration ordering gate
    required_metrics:
    - wall-time, peak database size and peak RSS per run
    - fitted c_T, c_M and enumeration exponent with CIs
    - crossover dimension as a function of alpha
    - challenge certificate and its verification result
  falsification_conditions:
  - 'Measured constants agree with the relayed ones within their CIs: eighteen batches of relayed
    inputs are vindicated, which is a genuine and valuable negative.'
  - 'c_M differs materially: every memory-charged margin the program has computed moves, in either
    direction, and the affected records must be re-scoped by supersession.'
  - 'No published challenge instance can be solved on the instrument: the instrument''s feasibility
    claims must all be restated relative to a demonstrated ceiling it does not reach.'
  confounders:
  - Hardware and BLAS configuration change wall-time constants materially; pin and record them.
  - g6k's database size is not the same quantity as the asymptotic memory in c_M; state the correspondence
    explicitly or the fit is not comparable to the relayed constant.
  - Small dimensions are dominated by constants; fit only above the range where the trend is stable
    and say where that is.
  interpretation_limits:
  - Dimensions 50-85 are far below FIPS 203 block sizes; extrapolation is stated as extrapolation.
  - A measured constant is a property of THIS implementation on THIS hardware, not a universal.
  - Solving a small challenge instance is not evidence about ML-KEM parameters.
  heuristic_assumptions:
  - id: HEUR-SIEVE-1
    statement: Fitted (c_T, c_M) at dimensions 50-85 extrapolate to the block sizes used in FIPS
      203 estimates.
    rigorous_support: None; this is the standard and widely acknowledged weak point of all concrete
      lattice estimates.
    validation_plan: Report the fit range and the CI, and refuse to quote a single extrapolated
      number without both.
  target_complexity:
    time_exponent: Measures c_T in 2^{c_T beta}; claims no improvement.
    memory_exponent: Measures c_M in 2^{c_M beta}; this is the load-bearing one.
    best_known: Relayed MATZOV-style costing at c_T = 0.292, c_M = 0.2075.
    hidden_overhead: The gap between g6k database size and asymptotic memory.
    tradeoff_note: A measured c_M above 0.2075 makes attacks MORE expensive, i.e. moves in the
      defender's favour, and that direction is as publishable as the other.
  dominated_by: 'No attack proposed. Rows checked across time, memory and data: primal-BDD/uSVP
    under MATZOV costing; dual and dual-hybrid under the same; enumeration with pruning at low
    memory; sieving at 2^{0.292 beta} time and 2^{0.2075 beta} memory -- the last being RELAYED
    constants, which is this record''s subject.'
  sota_delta: ZERO on attack axes. Converts the program's cost-model inputs from relayed to OWNED
    for the first time, closes the half of GOAL-MLKEM-003's C1 that twelve batches never attempted,
    supplies the calibration H-MLKEM-b1300f and KN-OPEN-017 both require, and gives the program
    one lattice result whose correctness does not depend on its own review chain.
  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the constants are measurable on the existing instrument at
    dims 50-85. 0.45 that at least one differs from its relayed value with a CI that excludes
    it. 0.6 that one small LWE Challenge instance is solvable end to end within budget. 0.25 that
    the measured c_M moves a committed margin by more than a bit.
