idea:
  id: IDEA-20261006-59a341
  question_id: RQ-DRINF-6b5a9d
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    F_27-rational kernel sizes of Phi_{T+1} for the six rank-2
    modules, against a rank-1 and a rank-3 control.
  class: measurement
  claim: >-
    Let kappa(g, Delta) be the number of roots in the field F_27 of
    x + g x^3 + Delta x^9. In the order (g, Delta) = (0, 1), (0, 2),
    (1, 1), (1, 2), (2, 1), (2, 2) the tuple is (1, 3, 9, 1, 1, 1).
    The two modules with the same prime-field multiplier g + Delta = 2,
    namely (0, 2) and (1, 1), have kappa 3 and 9. The Carlitz polynomial
    x + x^3 has 1 root in F_27. The rank-3 neighbor x + x^9 + x^27 has
    3 roots in F_27. The metric is the root count inside F_27. No ECDLP
    exponent is in scope.
  mechanism: >-
    The elliptic analogy still open after a prime-field trace is how
    much of the (T+1)-kernel is rational over the degree-3 extension.
    Two explanations. Refinement reading: kappa depends on (g, Delta)
    separately, so the two modules with g + Delta = 2 need not share a
    value; the predicted split is 3 against 9, and four other modules
    have kappa = 1. Trace reading: kappa would be constant on each
    prime-field scalar, so those two modules would match. The tuple
    decides. Separability is the derivative, which is the constant 1,
    so a root count equals the degree of gcd(f, x^27 - x).
    LOSSY-PROJECTION TEST. Ambient object: the additive group of an
    algebraic closure, with Phi_{T+1} acting. The projection keeps the
    kernel points that lie in F_27 and discards roots outside F_27.
    Operation set Sigma is the F_3[T]-action through Phi, which
    preserves the kernel. The projection is lossy for every module
    whose kappa is strictly smaller than the degree of
    x + g x^3 + Delta x^9. For the single module whose kappa equals
    that degree, every geometric root is kept and the lossy clause
    fails on that one module; that coordinate is part of the tuple
    and is recorded.
  novelty_status: unverified
