  assumptions:
    - Phi_{T+1}(x) = x + Phi_T(x) = x + g x^3 + Delta x^9 at characteristic (T).
    - F_27 is the field with 27 elements. Its multiplicative group is cyclic of order 26.
    - The derivative of x + g x^3 + Delta x^9 is 1, so distinct-root counts match gcd degrees.
    - A model of F_27 may be F_3[w]/(w^3 + 2w + 1). That cubic has no root in F_3.
    - The Carlitz control is x + x^3. The rank-3 control is x + x^9 + x^27, reduced on F_27 by x^27 = x.
  predictions:
    - metric: kappa tuple in the order (0,1), (0,2), (1,1), (1,2), (2,1), (2,2)
      direction: different
      minimum_effect: 1
    - metric: kappa(1, 1) minus kappa(0, 2)
      direction: different
      minimum_effect: 6
    - metric: number of the six modules with kappa equal to 1
      direction: different
      minimum_effect: 4
    - metric: Carlitz root count in F_27
      direction: different
      minimum_effect: 1
    - metric: rank-3 neighbor root count in F_27
      direction: different
      minimum_effect: 3
  minimal_test:
    design: >-
      Build one model of F_27 and, for each of the six polynomials,
      count the roots in that field. Repeat the count as the degree
      of gcd(x + g x^3 + Delta x^9, x^27 - x) over F_3. The two
      methods must agree before the tuple is scored. Then count roots
      of x + x^3 and of x + x^9 + x in the same field. Do not report
      a characteristic polynomial, a j-invariant, or a tau-valuation.
    controls:
      - Carlitz x + x^3. The prediction is 1 root in F_27. A count of 3 on this control is the geometric kernel read inside too small a field, and it falsifies the refinement.
      - Rank-3 neighbor x + x^9 + x^27, reduced on F_27. The prediction is 3. A count of 1 matches the four small rank-2 modules and says the neighbor does not enlarge the kernel.
      - Derivative of each rank-2 polynomial. The prediction is the constant 1. A zero derivative withdraws the tuple.
      - The two gcd and enumeration counts. Disagreement withdraws the run as an implementation failure.
    required_metrics:
      - kappa_tuple_six
      - kappa_difference_on_the_scalar_2_pair
      - carlitz_kappa_F27
      - neighbor_rank3_kappa_F27
      - derivative_of_each_polynomial
  falsification_conditions:
    - The tuple is not (1, 3, 9, 1, 1, 1) while both counting methods agree and every derivative is 1.
    - kappa(0, 2) equals kappa(1, 1). The degree-3 extension does not refine the prime-field scalar.
    - The Carlitz count in F_27 is not 1.
    - The rank-3 neighbor count in F_27 is not 3.
    - Enumeration and gcd degree disagree, or a derivative vanishes. The observation is withdrawn, not scored as a negative.
  confounders:
    - Counting roots in an algebraic closure assigns every separable degree-9 polynomial the same value and erases the tuple.
    - On F_9 one has x^9 = x, so x + g x^3 + Delta x^9 collapses to a different polynomial. F_9 is not the test field.
    - The prime-field scalar g + Delta groups (0, 2) with (1, 1). Equal kappa on that pair is the trace reading and is a negative outcome, not a data error.
  interpretation_limits:
    - The coordinate 9 is a root count inside F_27 for x + x^3 + x^9. The geometric comparison for that one polynomial and for the Carlitz polynomial is a different metric, already proposed elsewhere. This idea stands or falls on the six-tuple, on the gap of 6 inside the scalar-2 pair, and on the Carlitz value 1.
    - One extension degree, m = 3. No statement about the degree of a torsion field over a larger A-characteristic.
    - q = 3 only.
    - No ECDLP exponent is in scope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A separable polynomial over F_3 has exactly deg(gcd(f, x^27 - x))
        roots in F_27, and the equation x^k = c in the multiplicative
        group of F_27 has either 0 or gcd(k, 26) solutions according as
        the power c to the 26/gcd(k, 26) is not or is 1. This imitates
        the theorem that the multiplicative group of a finite field is
        cyclic. The sample is the six polynomials plus two controls.
        No transfer to another extension degree.
      rigorous_support: >-
        F_27 is the splitting field of x^27 - x, so common roots with a
        separable f are the F_27-roots. The solution count for x^k = c
        in a cyclic group of order 26 is the standard cyclic-group
        count. KN-LIT-1515 does not state either count. Failure of the
        two counting methods to agree withdraws the sample.
      validation_plan: >-
        For each of the eight polynomials, compute the gcd degree over
        F_3 and the root count in F_3[w]/(w^3 + 2w + 1). Require
        equality on all eight. Check the tail by evaluating the
        polynomial at every one of the 27 elements, not at a sample.
        If the model polynomial w^3 + 2w + 1 has a root in F_3, the
        model is withdrawn and a different irreducible cubic is
        required before any kappa is scored.
  target_complexity:
    time_exponent: >-
      No ECDLP exponent is in scope. The census is 8 polynomials on
      27 field elements, or 8 gcds of degree at most 27.
    memory_exponent: >-
      O(1) relative to any ECDLP instance. Storage is one copy of F_27
      and eight integers.
    best_known: >-
      Exhaustive root counting in F_27. The opened frontier rows price
      factor bases and rho records, not this gcd.
    hidden_overhead: >-
      None. The extension is enumerated in full. No smoothness
      probability and no o(1) term.
    tradeoff_note: >-
      No time-memory tradeoff. Enumeration and the gcd are two checks
      of one census, not a tradeoff curve.
