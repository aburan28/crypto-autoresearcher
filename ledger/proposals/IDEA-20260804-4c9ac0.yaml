idea:
  id: IDEA-20260804-4c9ac0
  question_id: RQ-SSI-001
  title: Kernel-Frobenius type profiles for path-half compatibility
  class: measurement
  claim: >-
    The sequence of Frobenius module types of internally generated cyclic
    kernels is a lossy, composition-compatible profile of a partial
    supersingular path.  Testing whether profile agreement predicts an exact
    path-half join better than a shape-matched null can discriminate an
    algebraic compatibility mechanism from ordinary birthday collisions.  A
    conditional p^(1/6+o(1)) target is only a research target if such
    prediction and a charged lifting lemma are established; no attack is
    asserted.
  object_first_candidate:
    tracked_object: >-
      For a fixed ordered prime schedule, the sequence of conjugacy classes of
      Frobenius on each internally chosen cyclic kernel line, with the kernel
      coordinates and endpoint discarded.
    established_families_off_limits: >-
      Auxiliary public torsion-image/Kani attacks, SQIsign transcript
      sufficiency testing, orientation vectorization, generic MITM as a
      primary object, CSIDH hidden shift, and FC0/CollimationSieve are excluded.
    newness_score: unverified; a kernel-type profile may be known or vacuous in the literature.
    testability_score: medium; toy kernels and exact joins are enumerable.
    survival_score: deterministic along a fixed internally generated prime schedule; unknown for long paths.
  mechanism: >-
    For each selected cyclic kernel line K of a generated l-isogeny, record
    only the Frobenius-action type induced on K.  Concatenating a path appends
    a type, so the retained profile propagates deterministically under the
    chosen schedule.  If matching profiles make two independently generated
    halves substantially more likely to meet at the same exact endpoint than
    profiles in a random same-shape control, profiles can be used as a
    prefilter before full kernel/path verification.  If the conditional join
    rate is null-like, the profile is not an algorithmic handle.
  novelty_status: unverified
  literature_context:
    - >-
      KN-OPEN-015 reports that known SIDH failures depend on published images
      of known torsion bases at unbalanced degrees; this proposal uses only
      internally generated toy kernels and does not allege analogous public
      auxiliary data in CGL or SQIsign.
    - >-
      KN-LIT-078 reports the heuristic/expected classical p^(1/4) F_p path
      baseline without auxiliary torsion data; the present profile is not a
      reported result from that source.
    - >-
      KN-LIT-079 reports a quantum p^(1/4) bound and is not a matched
      classical comparison.
  lossy_projection_identifiability_audit:
    projection: >-
      (ordered internally generated kernel lines, their coordinates, and
      endpoint) -> ordered Frobenius conjugacy-type sequence.
    what_is_discarded: >-
      Kernel generators, all coordinate embeddings, the exact domain/codomain,
      path order outside the fixed schedule, and all endpoint labels.
    why_genuinely_lossy: >-
      Multiple distinct kernel lines and paths have the same finite type
      sequence; the profile cannot reconstruct a kernel or an isogeny.
    deterministic_propagation: >-
      With the prime schedule fixed before sampling, appending an l-step
      appends the computed conjugacy type for that step.  No public torsion
      image or secret-kernel oracle is assumed.
    identifiability_risk: >-
      Equal profiles can arise from incompatible endpoints.  Only an exact
      compositional isogeny/path verification determines a valid join; profile
      agreement is never itself a relation or solution certificate.
    algebraic_precompute_verdict: passes_as_lossy; predictive value is untested.
  assumptions:
    - The toy sampler exposes internally generated kernel lines solely to
      compute the profile; it is not modeled as public scheme information.
  proof_search_map:
    bottleneck: >-
      Whether type-profile agreement increases exact half-path compatibility
      enough to lower the charged number of full joins.
    baseline_embedding:
      parameter_slice: >-
        Fixed prime schedule and equal partial-path lengths on the same
        enumerable F_p-rational toy graphs, compared to exact-endpoint
        two-list matching.
      reproduction_check: >-
        Remove the profile filter and reproduce the complete set of exact
        joins by exhaustive composition.
    observation_collision:
      observable: ordered Frobenius kernel-type sequence.
      distinct_preimage_search: >-
        Enumerate pairs of distinct kernel/path sequences with identical
        profiles, partitioning them into exact-endpoint matches and
        nonmatches; a high nonmatch fraction is the expected identifiability
        warning, not a positive result.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: kernel-Frobenius type profile used only as a prefilter.
        predicted_gain: >-
          Conditional research target p^(1/6+o(1)) if a uniform
          profile-to-join concentration lemma and full charged lifting bound
          are found.
    quantifier_order: >-
      For every declared graph and fixed schedule, sample or enumerate paths
      independently of their profile, then condition on the profile.  The
      schedule, profile alphabet, and threshold cannot be selected after
      observing joins.
    method_ceiling:
      strongest_certifiable_claim: >-
        A finite-family conditional-association measurement only.  It cannot
        establish public auxiliary leakage, a SIDH-style attack, or an
        asymptotic path-finding improvement.
      nearby_object_control: >-
        Replace each true type by a uniformly permuted type label preserving
        the per-position alphabet counts.  Any unchanged association is due to
        bucket shape or sampling, not Frobenius type.
    proof_obligations:
      - claim: profile update is deterministic for the frozen schedule
        responsibility: correctness
      - claim: profile bucket counts and lift costs are charged
        responsibility: runtime
      - claim: profile collision fibers are bounded
        responsibility: size
      - claim: conditional join enrichment is uniform in the stated family
        responsibility: success_probability
  predictions:
    - metric: conditional_exact_join_lift
      direction: higher
      minimum_effect: >-
        The exact-join probability conditioned on equal profiles exceeds the
        label-permuted null by at least 50% at each pre-registered largest two
        toy sizes after correction for profile-bucket size.
    - metric: nonidentifiable_profile_collision_fraction
      direction: lower
      minimum_effect: >-
        It must remain low enough that the charged prefilter plus exact lifting
        uses fewer full joins than plain matching; otherwise the mechanism fails.
  minimal_test:
    design: >-
      Enumerate fixed-schedule toy partial paths, compute their type profiles,
      join equal-profile halves, and verify every candidate by exact path
      composition.  Compare conditional join frequencies and fully charged
      operation counts against controls before varying any schedule.
    controls:
      - >-
        Shape-matched null: random regular graph paths with a type alphabet
        preserving per-position frequencies and profile-bucket sizes.
      - >-
        True paths with independently permuted type labels, preserving the
        same profile shape while destroying type meaning.
      - Exact-endpoint exhaustive-join known-answer control.
    required_metrics:
      - profile entropy and bucket-size CDF
      - exact joins per equal-profile candidate
      - false-profile-collision fraction
      - total kernel-type, lookup, composition, and verification charge
      - maximum-profile-bucket tail versus null
  falsification_conditions:
    - >-
      Conditional exact join probability is within the shape-matched null
      interval, or survives type-label permutation.
    - >-
      Exact verification cost makes the profile filter no cheaper than plain
      matching under identical units.
    - >-
      A schedule perturbation reverses the effect without a pre-specified
      algebraic explanation, indicating selection bias.
  confounders:
    - The profile alphabet can be too small, creating trivial collisions.
    - Kernel sampling implementation can leak endpoint labels into a profile.
    - Exceptional automorphisms can couple types and path counts at toy scale.
  heuristic_assumptions:
    - id: HEUR-KFTP-1
      statement: >-
        Uniformly sampled fixed-schedule toy path halves have, conditional on
        an equal true type profile, an exact-endpoint match probability at
        least c times the probability conditional on an equal
        frequency-matched random profile, for a uniform c > 1 over the stated
        family.
      rigorous_support: >-
        For a finite graph the profile map and all conditional counts are
        exact; the null imitates the classical multinomial occupancy law for
        independent categorical sequences with fixed coordinate frequencies.
        No result in the cited corpus proves the required independence or
        transfer to supersingular graphs.
      validation_plan: >-
        At toy scale, enumerate paths over increasing graph sizes and compare
        conditional CDFs, entropy, and extreme profile buckets to the
        multinomial null and label-permutation null.  Check tail consistency
        by comparing the largest real bucket and its join count to simulated
        extreme-value quantiles.  No crypto-scale validation is claimed.
      falsification_condition: >-
        The lower confidence bound for c is at most 1 after the bucket-shape
        correction at every declared size.
  target_complexity:
    problem: pure F_p-rational supersingular isogeny path finding without published torsion images.
    time_exponent: >-
      Prospective conditional p^(1/6+o(1)), requiring unproved uniform
      profile enrichment and charged exact-lift lemmas; no current procedure
      attains it.
    memory_exponent: prospective conditional p^(1/6+o(1)).
    matched_best_known: >-
      KN-LIT-078 reports heuristic/expected Otilde(p^(1/4)) classical cost in
      the matched F_p path-finding setting; this is context only.
    unmatched_context: >-
      KN-LIT-079's reported p^(1/4) quantum algorithm has a different machine
      model and is not used as the classical comparator.
    hidden_overhead: >-
      Type computation, kernel representation, exact composition, false
      profile collisions, and verification may dominate; no o(1) bound exists.
    tradeoff_note: >-
      Any low-memory version needs a separately analyzed distinguished-point
      or collision tradeoff.  Parallelization divides wall time only after all
      profile construction and verification work is charged.
  dominated_by: >-
    The reported Delfs-Galbraith p^(1/4) method dominates all currently
    specified work because this proposal offers neither a proved procedure nor
    a measured Pareto point.
  sota_delta: >-
    No attack or advantage claimed.  The conditional target would lower both
    p-exponents by 1/12 relative to the matched reported p^(1/4) baseline;
    this delta is entirely unverified.
  estimated_cost:
    implementation: high
    compute: low
    validation_cost: exhaustive toy kernel/path enumeration only.
  recommended_priority: low
  interpretation_limits:
    - This does not extend IDEA-20260725-003: no SQIsign transcript, public response, Kani test, or torsion sufficiency claim is used.
    - This does not assert that survivors publish fatal auxiliary structure; KN-OPEN-015 remains open.
    - No experiment, run, evidence, conclusion, or cryptanalytic improvement is created.
  status: proposed
  proposed_by: idea-generator
  proposed_at: '2026-08-04'
