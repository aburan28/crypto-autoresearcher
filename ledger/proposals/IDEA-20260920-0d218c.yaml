  citation_note: >-
    Every citation is internal (repository records or sibling-checkout notes
    read this session); none is a primary-source read of Teske 2001 or of the
    Montgomery-multiplication cost model, so novelty_status is unverified. The
    V3 counts are the card's verified arithmetic and the record's predictions
    are derived from them; nothing here is from a run.
  assumptions:
    - Public curve parameters only (frozen SRC-PORNIN-2022-274-ECGFP5, SRC-ECMASFP5-HACKMD-2025); every solved instance has a generator-known scalar and a certificate.
    - The walk is a plain r-adding walk with NO negation map, so that per-step cost is measured without the fruitless-cycle confound; the sqrt(2) of the baseline is applied arithmetically (card user_constraint) and is not measured here.
    - Same core, same compiler flags, same batch size B, same r, same distinguished-point density on both arms; the prime-field arm is a random ordinary curve with a 320-bit prime-order subgroup over a random 320-bit prime (no special form), which is the null object for "the field is cheap".
    - Word products (64x64 -> 128-bit multiplications) are the primary hardware-independent unit; wall time is secondary and never transferred.
    - The step count is checked, not assumed, on a subgroup of order about 2^36 to 2^40 of a random curve over the deployed F_{p^5} (point counting by PARI ellcard over F_{p^5}, or via the zeta function of a subfield curve used ONLY as an instrument convenience with the walk never touching Frobenius), and on toy p' cells.
    - Uses the F1 walk-collision family as its component (card C-4); nothing outside it is added.
  proof_search_map:
    bottleneck: >-
      Whether the F_{p^5} step's measured cost is multiplier-bound (then the
      word-product exchange rate is operative) or bound by memory traffic and
      the inversion chain (then it is not).
    baseline_embedding:
      parameter_slice: >-
        The prime-field arm at 320 bits reproduces the program's existing F_p
        rho core's per-step multiplication count (5M + 1S at batch B) within
        5% before any F_{p^5} number is read.
      reproduction_check: >-
        Counter-instrumented step on the prime-field arm equals 5M + 1S + (I/B)
        in field operations; word products per multiplication within 10% of 55.
    observation_collision:
      observable: >-
        Word products per step, steps per second, and steps-to-solve ratio to
        sqrt(pi n / 2) per arm.
      distinct_preimage_search: >-
        Two different multipliers (schoolbook, Karatsuba) on the same field give
        two different word-product counts for the same walk; the steps-to-solve
        ratio must be identical across them, which separates arithmetic cost
        from walk behaviour.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The affine F_{p^5} point in the polynomial basis with Goldilocks lazy reduction, as the cheapest step representation on this field
        predicted_gain: 2.4x to 3.7x fewer word products per step than a matched 320-bit Montgomery prime field; zero change in step count
    quantifier_order: >-
      For the two named curves and the two multipliers, there exists a
      preregistered cell set on which word products per step and steps per
      second are measured against a matched prime-field arm on the same core.
    method_ceiling:
      strongest_certifiable_claim: >-
        A per-step cost table in word products for this field and an exchange
        rate to the goal's rho ruler; no statement about any other field or
        about the step count beyond the calibration arm.
      nearby_object_control: >-
        Random ordinary 320-bit prime-field curve (null), Z/n generic transport
        (identity control on the step count), and a 5x5 schoolbook arm that
        must land at the V3 count.
    proof_obligations:
      - claim: The counter counts every 64x64 word product in the step, including reduction and inversion-chain products.
        responsibility: runtime
      - claim: Steps-to-solve on the F_{p^5} calibration subgroup match the generic prediction within the r-adding constant.
        responsibility: correctness
      - claim: The prime-field null reproduces the existing F_p core's count before comparison.
        responsibility: baseline
      - claim: The unit of the design note's 2^142 figure is read from the frozen source, not assumed.
        responsibility: scope
  predictions:
    - metric: word_products_per_step_fp5
      direction: lower
      minimum_effect: >-
        Within 15% of the V3 count for the multiplier used: 140 +/- 21 schoolbook,
        90 +/- 14 Karatsuba, at B = 16 (inversion-chain products included).
    - metric: word_product_ratio_prime320_over_fp5
      direction: higher
      minimum_effect: At least 2.0 (predicted 2.4 schoolbook, 3.7 Karatsuba).
    - metric: steps_per_second_ratio_fp5_over_prime320
      direction: higher
      minimum_effect: At least 1.5 on the same core; predicted to track the word-product ratio within 30%.
    - metric: steps_to_solve_over_sqrt_pi_n_over_2
      direction: flat
      minimum_effect: 1.00 +/- 0.05 x (1 + 1/(2r)) on every calibration cell, identical across multipliers and identical to the Z/n transport.
    - metric: rho_ruler_in_word_products_bits
      direction: different
      minimum_effect: >-
        Derived, not measured: 159.8 + log2(measured word products per step)
        for EcMasFp5, predicted 166.3 (Karatsuba) to 166.9 (schoolbook), each
        +/- 0.2 for the 15% counter tolerance; reported next to 168.2 for the
        matched prime field on the same ruler.
  minimal_test:
    design: >-
      Instrument: the F_{p^5} rho backend of IDEA-20260920-68b279 (new tooling,
      V5). Arms: (a) EcGFp5 and EcMasFp5 with the schoolbook multiplier; (b)
      the same with Karatsuba 2+3; (c) a random ordinary curve over a random
      320-bit prime with 320-bit prime-order subgroup on the program's F_p rho
      core AND on the same new backend's generic Montgomery path (two null
      readings, which must agree within 10%); (d) Z/n generic transport at the
      calibration order. Per arm: run 2^24 steps per configuration for cost
      counters (no solve needed at 320 bits), 5 repetitions, report word
      products per step (exact counter), steps per second (median, range), and
      peak per-walk state bytes. Calibration: on a random curve over the
      deployed F_{p^5} with a subgroup of order about 2^36 to 2^40, and on toy
      p' cells (F_{p'^5}, p' about 2^20 to 2^30) solve 100 planted instances
      per cell, verify certificates, report steps-to-solve against
      sqrt(pi n / 2) (1 + 1/(2r)), r = 32, B = 16, no negation map. Then
      compute the exchange-rate table and read the unit of the design note's
      2^142 from the frozen source.
    controls:
      - Prime-field null (random 320-bit prime, random ordinary curve) on the existing F_p core and on the new backend; agreement within 10% qualifies the backend's Montgomery path.
      - >-
        Z/n generic transport of the same r-adding walk (random labels) at the
        calibration order; identical steps-to-solve distribution required, and
        any difference is an instrument defect.
      - >-
        Multiplier swap on the same field; word products must change while
        steps-to-solve do not.
      - >-
        Batch-size ladder B in {4, 8, 16, 32, 64}; the inversion share must fall
        as 1/B, and a count that does not respond is a counter defect.
      - >-
        Counter cross-check in isolation before any step is read; schoolbook
        must read 25, Karatsuba 15, squaring 15, 320-bit Montgomery
        multiplication about 55 word products.
    required_metrics:
      - word_products_per_step_per_arm_per_multiplier
      - word_products_per_multiplication_isolated
      - steps_per_second_median_and_range
      - per_walk_state_bytes
      - steps_to_solve_ratio_per_calibration_cell
      - certificate_pass_rate
      - exchange_rate_table_bits
      - design_note_unit_read_from_frozen_source
  falsification_conditions:
    - Word-product ratio prime320/F_{p^5} below 2.0 with a counter that passes the isolated cross-check (then V3 over-credits the field and the exchange rate is corrected downward).
    - Word-product ratio at least 2.0 but steps-per-second ratio below 1.2 (then the step is not multiplier-bound; the record reports which cost binds and the exchange rate in word products is not the operative ruler unit).
    - Steps-to-solve on any calibration cell outside 1.00 +/- 0.05 x (1 + 1/(2r)) or differing from the Z/n transport (instrument void for the ruler; no cost number is reported until repaired).
    - The prime-field null on the new backend disagrees with the existing F_p core by more than 10% (backend not qualified).
  confounders:
    - Compiler auto-vectorisation or a hand-written SIMD path on one arm only; both arms must use the same code-generation regime and the record must state it.
    - Cache effects from per-walk state (10 words point + 10 words scalars + scratch) differing between arms; the batch-size ladder and the state-bytes metric expose this.
    - Counting a 128-bit accumulation's reduction as free when the implementation reduces after every product; the counter must count what the code does.
    - Choosing a special-form 320-bit prime for the null would reproduce the Goldilocks advantage on the null; the null prime must be random.
    - Quoting wall time across machines; only ratios on one core are reported.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - Constant factor only; the exponent 1/2 and the 0.886 constant are untouched. No security claim about either curve follows; a cheaper step on this field is a fact about the ruler's price, not an attack.
    - Nothing about GPUs, FPGAs or SIMD throughput transfers from a single-core count; those are separate instruments.
    - The exchange rate is between word products on this field and group operations on this field; it says nothing about index-calculus cost until the design note's unit is read.
  heuristic_assumptions:
    - id: H-S1-0
      statement: >-
        NONE FOR THE COUNT. The word-product count per step is unconditional
        arithmetic on the stated formulas (affine addition 2M + 1S plus
        Montgomery trick 3M per element plus I/B; multiplier counts per V3).
        Recorded so the absence is explicit.
      rigorous_support: Operation counting; no distributional statement.
      validation_plan: Exact counter on the built backend, cross-checked in isolation per multiplier.
    - id: H-S1-1
      statement: >-
        The r-adding walk on E(F_{p^5}) with the partition read from one
        coefficient behaves as a random mapping, so steps-to-solve is
        sqrt(pi n / 2) (1 + 1/(2r)) (1 + o(1)) with the rho-length tail of a
        random mapping. This is the standard rho heuristic (KN-TECH-006), used
        here only for the calibration arm.
      rigorous_support: >-
        Random-mapping collision time (birthday law) is a theorem for uniformly
        random functions; the transfer to r-adding walks is heuristic, with
        Teske's empirical support recorded in KN-LIT-012 and the first-order
        r-adding correction 1 + 1/(2r) stated in the sibling ECC2K-130 note.
      validation_plan: >-
        100 planted solves per calibration cell at n about 2^36 to 2^40 on the
        deployed field and toy p' cells at n about 2^24 to 2^30; compare the
        empirical CDF of steps / sqrt(n) against the random-mapping rho-length
        law; tail check on the 95th and 99th percentiles; identical distribution
        on the Z/n transport. This is the S4 question (IDEA-20260920-5b1f84) at
        calibration depth only.
  heuristic_note: >-
    The cost claim is unconditional arithmetic; the only heuristic is the
    standard rho step-count heuristic, and it enters only through the
    calibration arm that qualifies the instrument.
  target_complexity:
    time_exponent: Unchanged, n^{1/2}; the claim is a per-step constant of 2.4x to 3.7x in word products relative to a matched prime field.
    memory_exponent: Unchanged (distinguished-point method, O(1) per walk plus the shared table).
    best_known: Pollard rho 0.886*sqrt(n) group operations with negation (KN-TECH-006, KN-TECH-018), about 2^159.8 on EcMasFp5's 320-bit order and about 2^159.3 on EcGFp5's 319-bit subgroup.
    hidden_overhead: Inversion chain I/B, distinguished-point bookkeeping, memory traffic of a 10-word point; all charged by the counter and the state metric.
    tradeoff_note: Van Oorschot-Wiener parallelization position unchanged; per-step cost multiplies every processor equally.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Medium because the F_{p^5} backend does not exist (V5) and is charged
      here as tooling (IDEA-20260920-68b279 is the shared first deliverable);
      the measurement itself is single-core, hours.
  asymptotic_claim:
    problem: ECDLP on E(F_{p^5}) at p = 2^64 - 2^32 + 1 (EcGFp5, EcMasFp5)
    prior_best: 0.886*sqrt(n) group operations (rho with negation)
    time_exponent: 1/2 (unchanged)
    memory_exponent: unchanged
    hidden_cofactor: none claimed; per-step constant only
    claim_kind: constant_factor
  dominated_by: >-
    Pollard rho itself (0.886*sqrt(n), O(1) memory per walk, query-free) is the
    frontier row and this record proposes no alternative to it: it prices one
    step of that algorithm on this field. Checked rows: rho with negation
    (KN-TECH-006/018); BSGS at (n^{1/2}, n^{1/2}); multi-target rho at about
    c*sqrt(L n) (EV-IC-002 OBS-9, constant not asserted); the preprocessing
    frontier S*T^2 = Omega~(n) (KN-LIT-013); the a639a1 Gaudry band 2^121 to
    2^144 conditional on HEUR-GFPN-DFLAT. None is challenged; dominated_by is
    therefore "n/a (no algorithmic result claimed)" after checking every row.
  sota_delta:
    time: 0 in group operations; a measured per-step price in word products (predicted 2.4x to 3.7x below a matched prime field), which is a ruler calibration, not a speedup of the ruler.
    memory: 0 (zero).
    data_queries: Not applicable (full DLP, public parameters).
  frontier_check:
    status: pending
    note: >-
      No published per-step rho cost for F_{p^5} at this p was located in
      knowledge/ or ledger/ (grep for p^5, Goldilocks, EcGFp5 in proposals
      returned only the four GFPN intake records and unrelated records). The
      coordinator should check whether the EcGFp5 design note or its reference
      implementation publishes a multiplication cost per field operation that
      can anchor V3 before approval.
  recommended_priority: medium
  priority_rationale: >-
    Constant-factor work is not target-class under docs/target-result-profile.md
    rule A1, and this record says so. Its priority for GOAL-GFPN-380702 is that
    the goal's decision target compares an index-calculus band (in F_p
    operations) with a rho ruler (in group operations) and that comparison is
    not in one unit until this exchange rate exists; a 6.5-to-7-bit shift in
    where the ruler sits relative to the band is the kind of number that
    decides whether "128 still holds" is read correctly. ECC-first makes it
    ranked work; it is not inflated above medium because it moves no exponent.
  first_deliverable: >-
    The F_{p^5} rho backend (IDEA-20260920-68b279) qualified by its prime-field
    null and Z/n transport, then the two-multiplier cost table, the calibration
    solves with certificates, and the exchange-rate table with the design
    note's unit read from inputs/PORNIN-2022-274-ECGFP5.
  next_gate: Coordinator overlap review against RQ-ICPERF-94c86e's rho cells and a decision on whether the tooling record is dispatched first, then an immutable experiment contract.
