idea:
  id: IDEA-20260920-0d218c
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Per-step cost floor of affine Pollard rho on F_{p^5} = F_p[z]/(z^5 - 3),
    p = 2^64 - 2^32 + 1, against a matched random 320-bit prime-field curve,
    and the resulting exchange rate that puts the goal's rho ruler and its
    index-calculus bands in one unit
  class: measurement
  claim: >-
    One affine r-adding rho step with Montgomery-batched inversion on
    E(F_{p^5}) costs about 5M + 1S in extension-field operations, i.e. about
    140 base-field word products with a schoolbook multiplier and about 90
    with a 2+3 Karatsuba split (card fact V3), whereas the same step on a
    random ordinary curve over a generic 320-bit Montgomery prime costs about
    6 x 55 = 330 word products (V3: about 55 per multiplication). The claim,
    stated so it can fail: measured on one core with one walk and matched
    batch size, the word-product count per step on the F_{p^5} backend is at
    least 2.0x LOWER than on the matched prime-field curve (predicted 2.4x to
    3.7x, i.e. 1.2 to 1.9 bits), and the steps-per-second ratio moves in the
    same direction by at least 1.5x. Consequence for the goal: the program's
    rho ruler of about 2^159.8 group operations on EcMasFp5 (2^159.3 on
    EcGFp5) is about 2^166.3 (Karatsuba) to 2^166.9 (schoolbook) base-field
    word products, against about 2^168.2 for a matched 320-bit prime-field
    curve; and any index-calculus band for this goal quoted in F_p operations
    must be compared with rho in THAT unit, not in group operations. No
    exponent moves; this is the price of one step of the generic algorithm on
    this field. Representation class R1 (field representation of the
    coordinates, RQ-ECDLP-623a32); attack stage whose charged cost is measured:
    step arithmetic of the F1 walk-collision object.
  mechanism: >-
    OBJECT FRAME (card C-4). Representation: affine (x, y) with each coordinate
    an F_{p^5} element in the polynomial basis 1, z, ..., z^4, five 64-bit
    words each. Operation set Sigma: the full translation action R -> R + T_j
    of the r-adding walk. The tracked object is the F1 walk-collision object
    (the group element carried as aP + bQ), which propagates under Sigma and is
    LOSSLESS; nothing is projected away, so the lossy-projection test is
    passed trivially and this record changes only the charged cost of the
    step-arithmetic stage. Trichotomy placement: coordinate-dependent (Class
    III of IDEA-20260806-c5d183) for the cost, since the price of a step is a
    property of the representation, not of the group element; the step count
    is representation-independent and is checked, not claimed.
    WHY THE FIELD IS CHEAP PER STEP. A 320-bit Montgomery prime multiplication
    is a 5x5-limb schoolbook product plus a 5x5 Montgomery reduction, about 55
    word products. An F_{p^5} multiplication in this basis is a 5x5 coefficient
    product (25 word products schoolbook, 15 with a 2+3 Karatsuba split) whose
    coefficients are then reduced modulo the Goldilocks prime by a few
    additions each (2^64 = 2^32 - 1 mod p), and the binomial modulus z^5 = 3
    folds the wrapped coefficients with one multiplication by 3 each (V3). The
    reduction work that costs 25 word products in a Montgomery prime field
    costs adds here. Squaring is about 15 word products either way (V3). So
    the extension field's step is cheaper by roughly the reduction share plus
    the Karatsuba share, which the counts above make about 2.4x to 3.7x.
    WHAT COULD MAKE THE PREDICTION FAIL. (i) The wall-clock ratio does not
    follow the word-product ratio because the step is bound by something other
    than multiplier issue (loads and stores of the 10-word point plus batch
    scratch, the inversion chain, branch selection); then the word-product
    exchange rate is not the operative one and the record must say which cost
    is. (ii) The V3 counts are wrong for the multiplier actually written
    (e.g. the Goldilocks reduction of a 5-term 128-bit accumulation costs more
    than 'a few adds'); the instrument counts word products directly and
    reports the deviation from V3. (iii) The r-adding step count on the
    F_{p^5} group deviates from the generic prediction; that is the
    calibration arm and would void the ruler, not this record's cost claim.
    FIELD FROBENIUS. Not used in this record's walk at all; the only Frobenius
    in the backend is inside Itoh-Tsujii inversion (IDEA-20260920-204828),
    which is field arithmetic, not a curve endomorphism (card C-2).
