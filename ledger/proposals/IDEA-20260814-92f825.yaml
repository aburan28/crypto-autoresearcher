idea:
  id: IDEA-20260814-92f825
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  added: '2026-08-14'
  proposed_by: idea-generator
  status: proposed
  class: measurement

  title: >-
    Target-shift factor-base overlap fingerprint: measure exhaustive
    candidate-list entropy against blinded same-shape nulls before seeking any decoder

  object: >-
    TRACKED OBJECT. Let F be a public coordinate-defined factor base in G=<P>, A
    a target-independent public offset set, and R a public group element. Track
    the vector A_F,A(R)=(|F intersect (F+R+[a]P)|) for a in A, together with its
    exhaustive toy scalar fiber C(R)={k: A_F,A([k]P)=A_F,A(R)}. Each count is a
    public target-dependent observable computed by translating enumerated factor-
    base points and testing public membership. The tracked statistics are fiber
    size, conditional min-entropy, mutual information, collision multiplicity,
    work, and bytes. This is a gate for information, not a decoder or attack.

  lossy_projection_test: >-
    The overlap vector discards witness pairs, their order, point signs, and almost
    all scalar-orbit structure. Translation compatibility is exact: replacing R
    by R+[t]P shifts the hidden scalar from k to k+t, but equal overlap vectors can
    have many unrelated preimages. Exhaustive toy enumeration measures that
    collision fiber rather than assuming injectivity. A future decoder would have
    to output all candidates or add a public refinement; this proposal earns no
    algorithmic credit merely because the vector differs from its null.

  claim: >-
    CONDITIONAL INFORMATION GATE, NOT A DECODER OR RESULT. The public overlap
    fingerprint may reduce the exhaustive toy candidate-list exponent u=log_N
    |C(R)| below its target-blinded same-shape-null value by at least 0.05. The
    necessary route to a below-rho algorithm would require u<1/2, online
    fingerprint evaluation and candidate recovery below N^{1/2}, no N-sized
    fingerprint table, and certificate-bearing verification of the returned
    scalar. None of those decoder requirements is asserted here. If candidate-
    list entropy does not separate from null or the signal fails the declared
    decay controls, the lane stops at this gate.

  mechanism: >-
    Coordinate-defined factor bases can have nonrandom additive intersections.
    Translating F by the live target and a short public scalar offset produces a
    directly computable count whose distribution may depend on the target's
    scalar position relative to F. Multiple offsets form a low-bandwidth
    fingerprint. At toy scale, enumerating all [k]P provides the exact decoder
    fiber and conditional entropy, while blinded translations Q+[t]P test whether
    any effect tracks the hidden shift rather than target labels. A future lane
    would need a sub-square-root inverse for the fingerprint; absent that, this
    measurement cannot improve ECDLP.

  novelty_status: unverified
  novelty_note: >-
    COMPLETE REPOSITORY SCREEN. All 79 current RQ-ECDLP-002 proposals, all 795
    proposal files, and the 1,166-file legacy ideas tree were screened. The
    nearest current record is IDEA-20260811-7734c5, which measures additive energy
    and a fourth spectral moment but explicitly has no DLP decoder. Rejected
    ECDLP-IDEA-131 studies source-divisor difference autocorrelation and turnpike
    reconstruction, but its observable is not established as target-computable
    and it confronts homometric ambiguity. IDEA-20260807-cb672c is a generic
    mutual-information bridge detector for class-group statistics, and
    IDEA-20260802-006 measures Fourier bias of scalar index sets. The delta here is
    the exact public target-dependent group observable, an exhaustive toy
    candidate-fiber decoder, target-blinded same-shape nulls, and an explicit
    no-decoder gate. This narrower construction is not externally verified as
    novel and may simply reproduce additive-energy information.

  primary_sources_checked:
    - >-
      Ranieri, Chebira, Lu, and Vetterli, Phase Retrieval for Sparse Signals:
      Uniqueness Conditions, arXiv:1308.3058,
      https://arxiv.org/abs/1308.3058. The paper documents autocorrelation
      collisions and homometric ambiguity, motivating exhaustive fiber accounting
      rather than an injectivity assumption.
    - >-
      Ahmadi and Shparlinski, Exponential Sums over Points of Elliptic Curves,
      arXiv:1302.4210, https://arxiv.org/abs/1302.4210. Its bilinear-sum bounds are
      relevant to null-scale cancellation but do not decode an ECDLP from overlap
      counts.
    - >-
      Ahmadi and Shparlinski, On the Sum-Product Problem on Elliptic Curves,
      arXiv:0806.0640, https://arxiv.org/abs/0806.0640. It supplies additive-
      combinatorial context for coordinate images, not the proposed fingerprint
      inversion.

  assumptions:
    - >-
      E/F_p, the prime-order subgroup G=<P>, factor-base predicate, offset set A,
      enumeration order, membership structure, and null generator are public and
      frozen before targets are sampled.
    - >-
      Factor-base membership is computable without a discrete-log oracle and all
      target fingerprints use only R, P, public group operations, and F.
    - >-
      Exhaustive scalar enumeration is permitted only at toy scale and is charged
      as a measurement oracle; it is not projected into the proposed online cost.
    - >-
      Same-shape null subsets preserve size, negation symmetry, coordinate gauge,
      and membership-query cost.
    - >-
      No finite-size entropy slope is transferred to cryptographic size without a
      numbered distributional assumption and independent review.

  proof_search_map:
    bottleneck: >-
      Establish whether a public target-shift overlap statistic contains scalar
      information beyond same-shape geometry, then expose that information through
      a candidate fiber rather than mistaking a moment separation for a decoder.
    baseline_embedding:
      parameter_slice: >-
        With A empty the candidate fiber is all N scalars. With one count it is a
        histogram bucket. Precomputing every scalar fingerprint is exhaustive
        lookup of time and data Omega(N) and receives no algorithmic credit.
      reproduction_check: >-
        For each toy group, direct pair enumeration and translated-membership
        counting must give identical overlap vectors, and exhaustive scalar fibers
        must contain the true target scalar for every completed target.
    observation_collision:
      observable: >-
        The ordered vector of target-shift intersection counts.
      distinct_preimage_search: >-
        Enumerate all scalars, hash exact vectors, retain every collision bucket,
        and search for homometric factor-base variants with equal fingerprints but
        different scalar fibers. Report worst-case and target-weighted entropy.
    constructive_transforms:
      - transform: public_shift_probe
        proposed_object: >-
          Replace inaccessible source autocorrelation by counts of intersections
          between F and its public live-target translations.
        predicted_gain: >-
          Obtain a lawful target-dependent observable with explicit group-operation
          and membership-query cost.
      - transform: exact_fiber_gate
        proposed_object: >-
          Turn each toy fingerprint into its complete scalar collision bucket.
        predicted_gain: >-
          Measure candidate entropy and block any inference from moment separation
          to ECDLP recovery.
    quantifier_order: >-
      THERE EXISTS one target-independent public F and offset family A such that
      FOR RANDOM blinded targets R=[k]P the overlap fingerprint has lower
      candidate entropy than FOR RANDOM same-shape null factor bases, with all F
      and A fixed before k. A and F may not be optimized per target.
    method_ceiling:
      strongest_certifiable_claim: >-
        Only a toy information separation and exact collision-fiber measurement.
        Even u<1/2 would not certify an algorithm because constructing the fiber
        by exhaustive enumeration costs N and no sublinear inverse is supplied.
      nearby_object_control: >-
        A random negation-symmetric subset with identical cardinality, coordinate-
        bucket counts, membership representation, offset count, and group. A
        separation shared with this null is finite-group geometry, not coordinate
        factor-base structure.
    proof_obligations:
      - claim: Every fingerprint coordinate is public and target-computable.
        responsibility: interface
      - claim: Direct and translated-membership counts agree exactly.
        responsibility: baseline
      - claim: The exhaustive fiber contains the true scalar and all collisions.
        responsibility: correctness
      - claim: Entropy separation survives target blinding and null matching.
        responsibility: strictness
      - claim: Online probes, setup, exhaustive measurement, and output are distinct.
        responsibility: runtime
      - claim: Any future decoder avoids an N-entry table and another order-N DLP.
        responsibility: interface
    not_applicable_reason: null

  predictions:
    - metric: exhaustive candidate-list exponent u=log_N |C(R)|
      direction: lower
      minimum_effect: >-
        Target-weighted median u at least 0.05 below the matched-null median on
        each of the three largest completed sizes; report worst-case u separately.
    - metric: conditional min-entropy reduction versus same-shape null
      direction: higher
      minimum_effect: >-
        At least 0.05 log2(N) bits with a target-blinded 95% interval excluding
        zero; this is information only, not attack credit.
    - metric: exhaustive fiber recall
      direction: higher
      minimum_effect: >-
        1.000000 for all completed targets; one omitted true scalar invalidates the
        fiber implementation.
    - metric: normalized separation under structure destruction
      direction: lower
      minimum_effect: >-
        At least 75% decay from the unmodified factor base to the fully randomized
        same-shape predicate.
    - metric: online fingerprint work
      direction: lower
      minimum_effect: >-
        At most 1.10 times the preregistered |A| times |F| membership-probe budget;
        exhaustive fiber construction is reported separately.

  minimal_test:
    scope: >-
      Public generated prime-order toy subgroups from 12 through 24 bits, at least
      three coordinate-defined factor-base densities, offset sizes 4, 8, 16, and
      32, and at least 200 blinded targets per completed cell. Compute every live-
      target fingerprint directly, then enumerate all toy scalars solely to form
      exact collision buckets. Repeat with null factor bases and planted periodic
      positive controls.
    metrics:
      - overlap vector and coordinate-wise count distribution
      - candidate-list size, exponent, min-entropy, and mutual information
      - worst collision multiplicity and homometric buckets
      - live-target group operations, membership probes, wall time, and bytes
      - exhaustive measurement work kept separate from online work
    controls:
      - >-
        Random negation-symmetric subsets matched on size, x-coordinate bucket
        counts, membership representation, and query cost.
      - >-
        Blinded translations R+[t]P with t sampled after F and A are frozen; undo
        t only for scoring the true scalar.
      - >-
        Random offset sets matched in size and scalar range, plus permutations of
        offset labels.
      - >-
        Isomorphic curve models and coordinate gauges to detect encoding-specific
        signals.
      - >-
        Positive-control subsets with a planted public scalar period whose
        collision fibers and entropy are known by construction.
    decay_control: >-
      Replace the coordinate factor-base predicate by 0%, 25%, 50%, 75%, and 100%
      independently resampled membership bits while preserving size and negation
      symmetry. Candidate-entropy separation attributed to coordinate structure
      must decrease monotonically toward the matched-null interval. Nondecay is an
      artifact verdict, not supporting evidence.
    budget: >-
      At most 2^27 enumerated toy scalars in aggregate, 10^9 membership probes,
      20 GB artifacts, 24 CPU-hours, and 12 GB peak RAM. Stop a lane when the
      largest two completed sizes exclude the 0.05 effect in the wrong direction.
    certificate: >-
      Retain curve and subgroup parameters, F and A hashes, target blinding seeds,
      every overlap vector, collision-bucket hashes, the complete bucket containing
      each true scalar, and independent final [k]P=R checks.

  falsification_conditions:
    - >-
      Any fingerprint coordinate requires a hidden scalar, source labels, or a
      target-specific precomputed table rather than public group operations.
    - >-
      The true scalar is missing from any exhaustive collision fiber.
    - >-
      Median candidate exponent fails to improve over the matched null by 0.05 on
      the three largest completed sizes.
    - >-
      Entropy separation persists unchanged after full predicate randomization or
      vanishes under an isomorphic coordinate gauge with no declared scope reason.
    - >-
      Candidate lists below sqrt(N) can only be recovered by enumerating N scalar
      fingerprints or solving another generic DLP.

  confounders:
    - factor-base size differences can masquerade as entropy differences
    - negation symmetry can create deterministic twofold collisions
    - coordinate serialization and hash collisions can corrupt exact buckets
    - offset reuse can leak target labels across calibration and test splits
    - exhaustive toy enumeration can be mistaken for an online decoder
    - a fourth-moment or mutual-information signal need not localize candidates

  interpretation_limits:
    - >-
      This is deliberately a gate. It supplies no sublinear candidate-fiber
      construction, decoder, ECDLP algorithm, or time-exponent claim.
    - >-
      Direct target computability distinguishes the object from inaccessible
      source autocorrelation, but does not make it useful.
    - >-
      A toy entropy gap may be a small-field or coordinate-gauge effect and cannot
      be extrapolated without validated scaling.
    - >-
      Homometric collision theory warns that autocorrelation-like data can be
      noninjective; complete fibers, not mean counts, determine the gate.

  heuristic_assumptions:
    - id: H-OVLP-1
      statement: >-
        The target-weighted collision-fiber exponent of the frozen overlap vector
        stabilizes across increasing toy subgroup sizes.
      random_model_justification: >-
        Independent matched subsets give a hypergeometric count baseline and
        concentration scale; elliptic exponential-sum bounds motivate cancellation
        checks but do not imply independence or inversion.
      validation_route: >-
        Report full exponent distributions, adjacent-size slopes, bootstrap
        intervals, and matched-null differences on preregistered sizes.
      falsification_condition: >-
        The exponent gap shrinks toward zero, changes sign, or varies by more than
        0.10 across the largest adjacent sizes.
    - id: H-OVLP-2
      statement: >-
        Blinded target translations sample scalar positions without altering the
        target-dependent information channel measured by the fingerprint.
      random_model_justification: >-
        Addition by a uniform [t]P is a bijection on the prime-order subgroup, so
        target labels are randomized exactly even though F remains structured.
      validation_route: >-
        Compare unblinded and blinded fiber-size distributions and require exact
        recovery of the shifted true scalar before unblinding.
      falsification_condition: >-
        Results depend on target enumeration order, reused offsets, or disclosed
        unblinding values during fingerprint construction.
    - id: H-OVLP-3
      statement: >-
        Predicate randomization removes coordinate-specific additive structure and
        drives the entropy gap monotonically to the same-shape null.
      random_model_justification: >-
        At full replacement the construction is the declared matched random subset;
        intermediate mixtures provide an empirical interpolation, not a theorem.
      validation_route: >-
        Fit an ordered dose-response with simultaneous intervals across replacement
        fractions and factor-base densities.
      falsification_condition: >-
        No monotone decay, or less than 75% total decay, labels the original gap an
        artifact or generic finite-group effect.

  target_complexity:
    time: >-
      The present online observable costs O(|A||F|) public translations and
      membership probes; exhaustive toy fiber construction costs Theta(N|A||F|)
      and is measurement-only. A future route needs online observable plus decoder
      plus verification plus retries N^{1/2-epsilon+o(1)} and candidate exponent
      u<1/2. No such decoder is proposed.
    memory: >-
      The live vector uses O(|A|) counters plus the public F representation. An
      N-entry fingerprint table is Theta(N) advice/data and disqualifies a below-
      rho claim. Any future candidate output of size N^u is charged in memory or
      streaming time.
    rho_baseline: >-
      Pollard rho solves a generic target in expected N^{1/2+o(1)} group operations
      and constant stored group elements. It strictly dominates an information
      gate without a sub-square-root inverse.
    bsgs_baseline: >-
      BSGS uses N^{1/2+o(1)} time and memory and already outputs a verified scalar.
      A fingerprint with an exhaustive table is worse in both setup and data.

  complete_cost_boundary:
    preprocessing: >-
      Constructing F, its membership structure, A, coordinate gauges, null subsets,
      and any target-independent fingerprint index. Report time, group elements,
      probes, and bytes; an N-entry index is explicit exhaustive preprocessing.
    advice: >-
      F, A, hash parameters, gauges, null seeds, and any stored scalar/fingerprint
      pair. Target-specific advice is prohibited and otherwise charged online.
    per_attempt: >-
      For each target, all translations, membership probes, counter updates,
      candidate generation if ever supplied, [k]P checks, and failed refinements.
    success_probability_and_retries: >-
      The gate has exact fiber recall at toy scale. A future decoder must report
      probability that the true scalar is emitted, list truncation, ambiguity, and
      expected retries; a low entropy mean cannot replace these quantities.
    data_and_output: >-
      Count F and membership bytes, overlap vectors, collision buckets, candidate
      scalars, hashes, and certificates. Emitting |C(R)| candidates costs
      Omega(|C(R)|) even if computation is streamed.
    multi_target_amortization: >-
      Divide only target-independent F/A construction by a declared target count T.
      Every live-target overlap vector and candidate refinement remains online;
      report break-even T and total advice bytes.

  dominated_by:
    - method: Pollard rho
      reason: >-
        Rho supplies a complete verified decoder at square-root time, whereas this
        proposal measures only a public information channel.
    - method: baby-step giant-step
      reason: >-
        BSGS turns square-root time and memory directly into the scalar without an
        unproved fingerprint inverse.
    - method: exhaustive fingerprint table
      reason: >-
        It constructs exact toy fibers but costs Theta(N) entries and therefore is
        only a measurement baseline, never a competitive algorithm.

  sota_delta: >-
    Quantitative gate: target-weighted candidate-list exponent at least 0.05 below
    the same-shape null and at least 75% decay under full structure destruction.
    Delta versus rho and BSGS: 0 attack-exponent bits and no decoder; the lane
    remains dominated until a public inverse constructs and verifies the live-
    target candidate list in N^{1/2-epsilon+o(1)} complete cost without N advice.

  estimated_cost: low
  compute_budget_note: >-
    Use generated/public toy groups only. Exhaustive scalar fibers are
    certificate-bearing diagnostic measurements and must never be described as a
    cryptographic-size decoder or a result on a live key.
  recommended_priority: high
