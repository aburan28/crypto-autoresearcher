    discriminated_from:
      - >-
        IDEA-20260818-d5668d IS THE ADJACENT RECORD AND THIS RECORD PARTLY
        CORRECTS IT, which is stated plainly rather than hidden. d5668d treats
        the QDP input state as something that must be constructed FROM THE
        PUBLIC KEY AND ITS SHIFTS, computes a span dimension of n against a
        required support of about 2^{1064}, and predicts infeasibility. That
        framing targets the single-codeword form of the state. The REDUCTION
        form -- a superposition over the whole code plus product noise -- needs
        no secret and no shift orbit and IS preparable in polynomial time from
        the public generator matrix, so the infeasibility argument does not
        apply to it. The real bottleneck moves from state preparation to the
        decoding oracle inside the reduction, and quantifying THAT is this
        record's content. The two records agree on the conclusion (the lane is
        predicted closed) and disagree on the mechanism, which matters because
        the mechanism is what a later reader re-checks when the achievability
        bounds improve. d5668d's own dominated_by already names 2509.24796 as
        the row that would rebuild its cost model if Stage 2 came out positive;
        this record is that rebuild, run in advance.
      - >-
        IDEA-20260818-f8dc30 works in the transform domain and closes the
        Berlekamp-Massey lane by a weight threshold on h. This record needs
        nothing about wt(h) and would be unaffected by any outcome there.
      - >-
        IDEA-20260813-5a2aaa closed a hidden-shift/HSP reading of the ring
        decomposition with the obstruction 'the secret is a support pattern, not
        a group element'. This record does NOT reopen it: the quantum structure
        used here is Fourier duality over F_2^N applied to a code, not a hidden
