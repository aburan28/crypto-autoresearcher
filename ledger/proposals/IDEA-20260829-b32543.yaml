idea:
  id: IDEA-20260829-b32543
  question_id: RQ-QALG-122b59
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE QUANTUM DECODING PROBLEM IS A REAL PIPELINE AGAINST HQC AND ITS ENTIRE
    COST IS ONE NUMBER -- the code-side Regev reduction turns HQC key recovery
    into finding a minimum-weight codeword, its input superposition IS
    preparable in polynomial time from the PUBLIC key (contrary to the natural
    reading), and the whole route stands or falls on whether the QDP's
    achievable RATE at the required noise radius exceeds 1/2; compute the
    radius-rate curve and either close the lane by a measured margin or open it
    completely
  class: mechanism

  claim: >-
    Two recent external results compose into a complete, concrete attack pipeline
    against HQC key recovery that this corpus has never costed. (1) The standard
    code-extension trick turns the HQC public key (h, s) into a code C' of
    length 2n+1 and dimension n+1 whose UNIQUE minimum-weight codeword is
    (x, y, 1) of weight 2w+1, because the underlying quasi-cyclic code has
    minimum distance at the Gilbert-Varshamov bound, about 0.110 * 2n = 3894 at
    HQC-128, far above 133. So HQC key recovery IS a minimum-weight-codeword
    problem, exactly the problem the quantum reduction of Debris-Alazard,
    Remaud and Tillich (arXiv 2106.02747) reduces to DECODING the dual code.
    (2) The quantum decoding problem line (Chailloux-Tillich; Blanvillain,
    Chailloux and Tillich, arXiv 2509.24796) instantiates that decoding step:
    given a superposition of noisy versions of a codeword, decoding is solvable
    in polynomial time, generalized to all memoryless noise models, up to an
    information-theoretic limit ON THE CODE RATE, at which limit the algorithm
    returns the most likely nonzero codeword of the dual code.
    THE CORRECTION THIS RECORD MAKES TO THE OBVIOUS OBJECTION, and it is the
    reason the lane is not already closed: the input superposition
    sum over c in C, sum over e of sqrt(f(e)) |c + e> is preparable in
    POLYNOMIAL time from a PUBLIC generator matrix and a product distribution f
    -- prepare the uniform superposition over messages, apply the generator,
    prepare sum_e sqrt(f(e))|e> coordinatewise, and add. No secret is used and
    no shift-orbit span argument is needed. What is NOT free is the step that
    uncomputes the noise, which is a decoding oracle at radius tau, and THAT is
    where the entire cost of the pipeline sits.
    THE CLAIM IS THEREFORE A SINGLE INEQUALITY. Let tau be the relative noise
    radius the reduction must use for its output to have weight at most 2w+1,
    and let R_QDP(tau) be the QDP's achievable rate at that noise level. If
    R_QDP(tau_req) > 1/2, HQC key recovery is solvable in quantum POLYNOMIAL
    time and every parameter set falls. If R_QDP(tau_req) < 1/2, the decoding
    step must instead be instantiated by ordinary quantum ISD at radius
    tau_req, and since the reduction is reported to require a radius exceeding
    the unique decoding radius -- about 0.055 relative, i.e. about 1944 errors
    at HQC-128 against the 132 the direct attack faces -- the pipeline costs a
    predicted 2^{972} against Grover-Prange's 2^{66}, a deficit of about 906
    bits. The prediction is the second branch, by a wide margin, and the
    deliverable is the MARGIN: the gap between 1/2 and R_QDP(tau_req), stated in
    rate units and converted to bits, per parameter set. That number is what
    tells a later reader how much the achievability bounds would have to improve
    before this lane must be re-opened, and no record in this corpus holds it.
  mechanism: >-
    STEP A -- FROM SYNDROME DECODING TO MINIMUM-WEIGHT CODEWORD. Let
    R = F_2[X]/(X^n - 1) and let D = {(h b, b) : b in R} be the rate-1/2
    quasi-cyclic code of length 2n generated by the public h. The HQC key
    satisfies s = x + h y, hence (x, y) = (s, 0) + (h y, y) lies in the coset
    (s, 0) + D. Define C' = D + span{(s, 0, 1)} inside F_2^{2n+1}; then
    (x, y, 1) = (s, 0, 1) + (h y, y, 0) is a codeword of C' of weight 2w + 1,
    and every codeword with a 0 in the last position lies in D, whose minimum
    weight is at the Gilbert-Varshamov bound for rate 1/2. At HQC-128 that is
    about 0.110 * 35338 = 3887 against 2w + 1 = 133, so (x, y, 1) is the unique
    minimum-weight codeword and finding it is exactly key recovery. This
    extension is standard and costs nothing.
    STEP B -- THE REDUCTION. arXiv 2106.02747 gives a quantum reduction from
    finding short codewords in a random linear code to DECODING for the Hamming
    metric, adapting the Stehle-Steinfeld-Tanaka-Xagawa reinterpretation of
    Regev's lattice reduction. Its noise is a TRUNCATED Bernoulli distribution,
    because the plain Bernoulli analogue of the Gaussian is 'too much spread
    out' for the code setting, and it requires 'a very large decoding radius'
    that often exceeds the unique decoding radius. Applied to C'^perp -- a
    public, rate-1/2 quasi-cyclic code of length 2n+1 -- the reduction outputs
    codewords of C' distributed according to the dual of the noise, i.e. with
    probability proportional to (1 - 2p)^{weight} for Bernoulli(p) noise, which
    is exactly a low-weight-biased sampler over C'.
    STEP C -- WHERE THE COST ACTUALLY IS. The reduction's inner step maps
    |c + e> to |c>|e>, i.e. it decodes. Two instantiations exist and they must
    be costed separately, which is the discipline this RQ requires.
    (C1) QDP INSTANTIATION: the decoding is performed on the superposition
    itself, which is the quantum decoding problem, solvable in polynomial time
    -- but only below an information-theoretic RATE limit that
    arXiv 2509.24796 makes tight via a Pretty Good Measurement analysis. So C1
    is poly-time IF rate(C'^perp) = 1/2 lies below R_QDP(tau_req).
    (C2) ISD INSTANTIATION: the decoding is performed by an ordinary quantum
    decoder at radius tau_req, costing Grover-Prange at that radius, i.e. about
    2^{N h(tau) (1 - R) / 2} in the leading exponent -- catastrophically more
    than at radius 2w because tau_req exceeds the unique decoding radius by more
    than an order of magnitude.
    STEP D -- THE COMPUTATION THAT DECIDES IT. tau_req is fixed by requiring the
    output distribution to place non-negligible mass on weight 2w+1: with
    N = 2n+1 codewords weighted by (1 - 2p)^{wt}, the expected number of
    sampled codewords of weight at most 2w+1 versus the exponentially many of
    weight near N/2 gives a threshold condition on p, hence on tau. Evaluate
    R_QDP(tau_req) from the paper's own achievability bound and compare against
    1/2. Both quantities are closed-form functions of (N, R, tau) and the
    entire experiment is arithmetic once the two bounds are read correctly --
    which is why this is the cheapest decisive test in this batch.
    WHY THIS IS EXPONENT-FIRST RATHER THAN AN AUDIT. The pipeline is not a
    variant of ISD; it is a structurally different quantum algorithm whose
    positive branch is POLYNOMIAL TIME, not a constant-factor gain. A mechanism
    whose two branches are 'quantum polynomial time' and 'worse by 900 bits' has
    the largest information gain per unit cost of anything in this lane, and its
    negative branch is a scoped closure with a measured margin rather than a
    fatigue report.
