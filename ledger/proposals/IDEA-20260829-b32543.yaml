    - metric: 'required relative decoding radius tau_req for the reduction, per parameter set'
      direction: higher
      minimum_effect: >-
        PREDICTED above the unique decoding radius 0.055, consistent with
        arXiv 2106.02747's own statement that the radius often exceeds it.
        A tau_req BELOW 2w/(2n) = 0.0037 would mean the reduction needs less
        noise than the direct problem carries and would be an immediate red flag
        that the threshold has been mis-derived.
    - metric: 'achievable rate R_QDP(tau_req) versus the required 1/2'
      direction: lower
      minimum_effect: >-
        PREDICTED STRICTLY BELOW 1/2 at all three parameter sets. THIS IS THE
        HEADLINE METRIC. R_QDP(tau_req) >= 1/2 at any standardized set means HQC
        key recovery is quantum polynomial time and must be escalated to
        independent review IMMEDIATELY, before any further computation, and
        before any part of this record is treated as settled.
    - metric: >-
        cost of the ISD instantiation at radius tau_req, HQC-128, log2 of
        quantum iterations
      direction: higher
      minimum_effect: >-
        PREDICTED about 972 against the Grover-Prange baseline 66, a deficit of
        about 906 bits. Any value below 200 contradicts the radius prediction
        and must be investigated; any value below 66 is an exponent-moving
        positive result.
    - metric: 'the margin (1/2 - R_QDP(tau_req)) in rate units, per parameter set'
      direction: different
      minimum_effect: >-
        This is the record's REUSABLE NUMBER and it has no predicted sign
        beyond being positive: it states how much the achievability bound would
        have to improve before the lane reopens. A margin below 0.05 makes the
        lane a live watch item; a margin above 0.2 makes it dormant.
    - metric: >-
        toy-scale exact simulation at N in {12,...,20} -- empirical weight
        distribution of the sampled dual codeword versus the predicted
        (1-2p)^{weight} law
      direction: different
      minimum_effect: >-
        PREDICTED to match within sampling error at every tested p. A mismatch
        falsifies the mechanism's core identity and voids every threshold
        computed from it.
    - metric: 'state-preparation cost for the TRUNCATED Bernoulli distribution'
      direction: higher
      minimum_effect: >-
        PREDICTED still polynomial, but NOT a product distribution, so the
        O(N)-rotation argument does not directly apply. If preparation of the
        truncated distribution requires amplitude amplification with an
        exponentially small acceptance probability, THE ENTIRE POLYNOMIAL-
        PREPARATION CLAIM COLLAPSES and this record's correction of
        IDEA-20260818-d5668d fails -- which would be a genuinely useful outcome
        and is the single most likely way this record is wrong.

  minimal_test:
    design: >-
      Four stages. Stage 0 is literature and is GATING; the rest is arithmetic
      and a tiny exact simulation. No cryptographic-scale execution anywhere.
      STAGE 0 (days, literature, RUNS FIRST AND GATES EVERYTHING): read
      arXiv 2509.24796 and arXiv 2106.02747 IN FULL and extract, verbatim and
      with equation numbers: (i) the exact form of the achievability bound as a
      relation between code rate and noise parameter; (ii) the exact noise
      distribution the reduction requires, including the truncation and its
      parameters; (iii) the exact radius requirement and whether it is stated
      relative to the unique decoding radius; (iv) the exact form of the input
      state and any assumption about how it is obtained. If (i) or (iii) is not
      extractable, STOP and record that: every number downstream is a function
      of them and computing them from a recalled shape would be fabrication
      under AGENTS rule 5.
      STAGE 1 (hours, exact arithmetic): compute, at HQC-128/192/256 from
      KN-LIT-b9e1a8's parameters, the GV minimum distance of D, the uniqueness
      margin for (x, y, 1), tau_req from the output-weight threshold condition,
      R_QDP(tau_req) from the Stage-0 bound, the margin against 1/2, and the ISD
      instantiation cost at tau_req. Emit the table with every intermediate
      quantity, not just the verdict.
      STAGE 2 (days, exact simulation at N <= 20): build C' for a toy
      quasi-cyclic code, construct the full 2^N amplitude vector of the
      reduction's input state, apply the exact Fourier transform, and measure
      the empirical distribution of sampled dual codewords against the predicted
      (1-2p)^{weight} law, sweeping p across the threshold. Also measure the
      acceptance probability of preparing the TRUNCATED distribution, which is
      the quantity that decides whether the poly-time preparation claim holds.
      STAGE 3 (hours): the controls below, then the concrete-cost table with
      both instantiations (QDP and ISD) reported separately, never merged, with
      memory and depth columns and the explicit statement that no QRAM is used.
    controls:
      - >-
        BASELINE CONTROL (mandatory, runs before any HQC number): the low-rate
        slice R = 0.1. The composed threshold MUST show the pipeline winning
        there, consistent with the published polynomial-time statement. A
        threshold that closes every rate is a broken threshold.
      - >-
        POSITIVE CONTROL: a toy code with a codeword PLANTED at weight far below
        GV. The Stage-2 simulation must sample it with the predicted
        probability. This is what separates 'the simulation implements the
        reduction' from 'the simulation implements something'.
      - >-
        NULL OBJECT 1: a random (non-quasi-cyclic) [2n+1, n+1] code at the same
        parameters. Every threshold must agree with the quasi-cyclic case to
        within the weight-enumerator difference; a disagreement means the record
        has found a quasi-cyclic effect and must be rewritten around it.
      - >-
        NULL OBJECT 2: no planted low-weight codeword at all (a code whose
        minimum distance is at GV). The pipeline must return codewords of weight
        near GV and never anything lower; a lower output is the simulation
        manufacturing structure.
      - >-
        STRUCTURAL TELL (inventor-protocol section 3.1): the expected output
        weight must DECREASE MONOTONICALLY as p increases toward the
        information-theoretic limit, since the weighting (1-2p)^{wt} sharpens.
        An output-weight curve that is flat in p means the noise is not wired
        into the simulation -- the most likely implementation bug and the
        easiest to miss, because the numbers still look plausible.
      - >-
        CIRCULARITY CHECK: verify that the noise distribution used at the
        threshold does not depend on the planted codeword. Run the whole Stage-2
        pipeline with the distribution fixed before the code is sampled.
    required_metrics:
      - verbatim Stage-0 extractions with equation numbers, per paper, per item (i)-(iv)
      - GV minimum distance of D and the uniqueness margin, per parameter set
      - tau_req and R_QDP(tau_req) with the margin against 1/2, per parameter set
      - ISD instantiation cost at tau_req in log2 quantum iterations, per parameter set
      - empirical versus predicted output-weight distribution at toy N, per p
      - acceptance probability of truncated-distribution state preparation, per N and p
      - low-rate baseline control outcome
      - concrete-cost table with time, memory, depth and QRAM columns for both instantiations

  null_object_control: >-
    NULL OBJECT 2 (a code with no codeword below GV) is the load-bearing control
    and must run before any threshold is interpreted, per
    docs/inventor-protocol.md section 3: if the toy pipeline reports low-weight
    output where none exists, it is measuring its own numerics. The BASELINE
    CONTROL at low rate is the second and is what stops the record from
    producing a threshold that proves too much -- a formula closing the lane at
    every rate would contradict a published theorem, and finding that out from
    the control rather than from a referee is the entire point of running it
    first.

  falsification_conditions:
    - >-
      Stage 0 cannot extract the achievability bound or the radius requirement
      from the primary texts. The record is BLOCKED, not negative; no threshold
      may be computed and nothing may be concluded in either direction.
    - >-
      The low-rate baseline control does not reproduce the published
      polynomial-time regime. The threshold derivation is wrong and every HQC
      number is void.
    - >-
      R_QDP(tau_req) >= 1/2 at any standardized parameter set. This falsifies
      the record's predicted branch in the direction that matters -- HQC key
      recovery in quantum polynomial time -- and must be escalated to
      independent review before any further work, with nothing published until
      it is checked.
    - >-
      The ISD instantiation at tau_req costs below 2^{66} at any standardized
      set. Exponent-moving positive result; escalate.
    - >-
      Preparation of the truncated-Bernoulli state has exponentially small
      acceptance probability. THIS FALSIFIES THIS RECORD'S CORRECTION OF
      IDEA-20260818-d5668d: state preparation, not decoding, is then the
      bottleneck after all, d5668d's framing is vindicated in substance, and
      this record must be superseded rather than defended.
    - >-
      Toy-scale output-weight distribution does not match (1-2p)^{weight}.
      Falsifies the mechanism's core identity.
    - >-
      The threshold's derivation requires a noise distribution that depends on
      the planted codeword. The reduction as composed here is circular and the
      record is withdrawn.
    - >-
      NULL OBJECT 1 shows the quasi-cyclic and random cases differing beyond the
      weight-enumerator difference. Falsifies H3 and reopens the record as a
      quasi-cyclic-specific question, which would be the more interesting
      outcome.

  confounders:
    - >-
      TRUNCATION BREAKS THE PRODUCT STRUCTURE. Everything clean in this record
      -- polynomial state preparation, the factorized Fourier transform, the
      (1-2p)^{wt} output law -- holds for a memoryless product distribution. The
      reduction requires a TRUNCATED one. Whether truncation is mild enough to
      preserve all three is the record's largest technical uncertainty and it is
      why Stage 0 must extract the exact distribution rather than its name.
    - >-
      ASYMPTOTIC VERSUS EXACT: the 906-bit deficit is computed from binary
      entropy asymptotics on recalled GV values. Stage 1 must use exact binomial
      sums; discrepancies of tens of bits are expected at these magnitudes and
      are not findings.
    - >-
      READING AN ACHIEVABILITY BOUND AS A CONVERSE. An achievability bound says
      the algorithm SUCCEEDS below the threshold; it does NOT say it fails
      above. A margin computed from it bounds what the published algorithm
      delivers, not what the problem allows, and every statement in the record
      must be phrased accordingly or it becomes an impossibility claim, which
      the Idea Generator contract forbids.
    - >-
      The cited papers concern RANDOM linear codes; HQC's codes are
      quasi-cyclic and the extension adds one coordinate. Whether the reduction's
      hypotheses cover this case is a real applicability question and, if the
      answer is no, the record's negative branch becomes 'inapplicable' rather
      than 'dominated', which is a different and weaker statement that must not
      be conflated with it.
    - >-
      Toy N <= 20 is far from the regime where the achievability threshold is
      meaningful; the simulation validates the MECHANISM (the output law, the
      acceptance probability), not the threshold, and no threshold may be
      inferred from it.
    - >-
      Both primary texts were read only at abstract level by this session. Every
      quantitative claim in this record is conditional on Stage 0 confirming
      what the abstracts imply.

  interpretation_limits:
    - >-
      A negative outcome closes the lane ONLY against the two cited results as
      published. Improved achievability bounds, a different reduction, or a
      code-specific instantiation would reopen it, and the record's margin is
      written precisely so a later reader can check the reopening condition in
      one line.
    - >-
      Nothing here is an impossibility statement about quantum algorithms for
      quasi-cyclic syndrome decoding. It is a cost computation for one composed
      pipeline.
    - >-
      A POSITIVE outcome would be extraordinary and must be treated as most
      likely a derivation error until independently reproduced; the record's own
      falsification list puts escalation before publication for exactly that
      reason.
    - >-
      Toy-scale simulation results are hypothesis-generating for the mechanism
      only and are explicitly not statements about standardized HQC, per this
      RQ's constraint.
    - >-
      Nothing here bears on HQC's DFR model, on its classical ISD baseline, or
      on RQ-QALG-457b41 / RQ-QALG-74bf20. The Regev-reduction lineage originates
      on the lattice side; NO lattice number, mechanism or conclusion transfers,
      and in particular this record says nothing whatsoever about ML-KEM.
    - >-
      This record's correction of IDEA-20260818-d5668d concerns the MECHANISM of
      that record's Stage-2 prediction, not its conclusion. d5668d is not
      superseded by this record and both should be read together.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For h uniform in R = F_2[X]/(X^n - 1) with n prime, the quasi-cyclic
        code D = {(h b, b)} of length 2n and rate 1/2 has minimum weight
        d_min(D) >= (delta_GV - epsilon) * 2n with delta_GV defined by
        h(delta_GV) = 1/2, except with probability at most
        2^{-2n(epsilon^2/c)} for an absolute constant c; in particular
        d_min(D) > 3(2w+1) at all three HQC parameter sets.
      rigorous_support: >-
        The rigorous ingredient is the exact first-moment computation behind the
        Gilbert-Varshamov bound: for a random linear code of rate R, the
        expected number of nonzero codewords of weight below delta n with
        h(delta) < 1 - R is 2^{-Omega(n)}, and Markov's inequality converts the
        expectation into a probability. The heuristic is only that a
        QUASI-CYCLIC code with a uniform circulant behaves like a random linear
        code for its low-weight enumerator -- the classical statement imitated
        is the standard random-coding weight-distribution theorem, and the
        quasi-cyclic case is known to satisfy a GV-type bound on average, which
        is a weaker statement than the per-instance one used here.
      validation_plan: >-
        At toy primes n in {31, 43, 59, 83, 101}, compute the EXACT minimum
        weight of D by full enumeration or by a certified minimum-weight
        algorithm, over 200 uniform h per n, and compare the empirical
        distribution of d_min against the GV prediction and against the exact
        random-linear-code minimum-weight distribution at the same length and
        rate. TAIL CHECK: the MINIMUM over all 200 samples must lie inside the
        1/200 quantile of the random-code reference; a quasi-cyclic code with
        systematically lower minimum weight than a random one is a finding about
        quasi-cyclic codes and must be reported rather than smoothed. SAMPLED
        PARAMETERS RECORDED: n <= 101 only; transfer to n = 17669 is by the
        stated concentration bound and by nothing else.
      falsification_condition: >-
        Empirical d_min falling below the GV prediction by more than 15 percent
        at two or more toy n, or any sampled D with d_min below 3(2w+1) scaled
        to that n -- either of which breaks the uniqueness of (x, y, 1) and
        changes what the pipeline would return.
    - id: H2
      statement: >-
        For a memoryless product noise distribution with per-coordinate flip
        probability p, the reduction's output distribution over codewords of C'
        is exactly proportional to (1 - 2p)^{weight(c)}, uniformly over c;
        consequently the probability of sampling the unique weight-(2w+1)
        codeword rather than one of the about 2^{N h(delta)} codewords of weight
        about delta N is (1-2p)^{2w+1} divided by the corresponding sum, and the
        threshold radius tau_req is the p at which that ratio is at least
        1/poly(N).
      rigorous_support: >-
        The proportionality is an EXACT Fourier identity for product
        distributions over F_2^N -- the Walsh transform of a product measure is
        a product of per-coordinate biases -- and is not heuristic. The
        heuristic content is entirely (i) that the reduction as published uses a
        distribution close enough to a product for the identity to hold up to
        the truncation, and (ii) that the code's weight enumerator near delta N
        matches the random-coding average, which imitates the classical
        random-coding weight-distribution theorem.
      validation_plan: >-
        Exact simulation at N in {12,...,20}: construct the full amplitude
        vector, Fourier transform exactly, and compare the empirical output
        weight distribution against (1-2p)^{wt} times the exact weight
        enumerator, over p on a grid spanning the threshold, with a chi-square
        goodness-of-fit at alpha = 0.01. Repeat with the TRUNCATED distribution
        and record the deviation, which is the quantity that decides whether the
        identity survives truncation. TAIL CHECK: the probability assigned to
        the single minimum-weight codeword -- the tail event the entire attack
        depends on -- must match prediction, not merely the bulk of the
        distribution.
      falsification_condition: >-
        Chi-square rejection at any tested p for the product distribution
        (falsifies the identity or the implementation), or a truncated-case
        deviation exceeding 20 percent on the minimum-weight tail probability
        (falsifies the transfer of the identity to the distribution the
        reduction actually requires, which is the record's main risk).
    - id: H3
      statement: >-
        The quasi-cyclic code C'^perp behaves like a random linear code of the
        same length and rate for both the ISD cost at radius tau_req and the
        weight enumerator entering H2, up to the DOOM factor n from cyclic
        shifts, i.e. up to log2(n) about 14 bits in the cost.
      rigorous_support: >-
        NO RIGOROUS SUPPORT for the per-instance statement; this is the standard
        modelling assumption of every published ISD cost estimate for
        quasi-cyclic codes and it imitates nothing beyond that practice. It is
        flagged as a transfer assumption and it is exactly what NULL OBJECT 1
        tests.
      validation_plan: >-
        Run the full Stage-1 threshold computation twice, once with the
        quasi-cyclic weight enumerator estimated at toy scale and once with the
        random-coding average, and report both columns side by side at all three
        parameter sets. Any conclusion whose sign differs between the two
        columns is withdrawn rather than resolved in favour of either.
      falsification_condition: >-
        The two columns differing by more than 14 bits (the DOOM allowance) in
        the ISD cost, or by more than 0.02 in rate units in R_QDP(tau_req).

  target_complexity:
    time_exponent: >-
      TWO INSTANTIATIONS, REPORTED SEPARATELY AND NEVER MERGED. (C1) QDP
      instantiation: POLYNOMIAL in N, conditional on
      R_QDP(tau_req) > rate(C'^perp) = 1/2 -- predicted FALSE, so this branch is
      predicted inapplicable rather than expensive. (C2) ISD instantiation:
      2^{N h(tau_req) (1-R) / 2 + o(N)} quantum iterations, predicted about
      2^{972} at HQC-128 against the baseline 2^{66}. The pipeline's cost is
      therefore predicted to be about 906 bits WORSE, and the record's value is
      the margin, not the attack.
    memory_exponent: >-
      UNUSUALLY GOOD AND THAT IS WORTH RECORDING EVEN IN THE NEGATIVE BRANCH:
      the pipeline needs NO QRAM AND NO QRACM at any step. State preparation is
      O(N) rotations from classical constants, the Fourier step is one layer of
      Hadamards, and the code is applied by a classical generator matrix
      compiled into the circuit. Logical qubits: O(N) = about 2^{15.1} at
      HQC-128 for the reduction itself, plus whatever the decoding step needs
      (C1: polynomial; C2: the same width as Grover-Prange at radius tau_req).
      Classical memory: none. Compare quantum-walk MMT/BJMM, which needs QRACM
      proportional to its list.
    qubit_and_depth_exponent: >-
      FULL FAULT-TOLERANT ERROR CORRECTION ASSUMED; NISQ excluded by inspection.
      Depth of the reduction proper: O(log N) for the noise state with a fan-out
      tree plus O(N) for the generator application -- NEGLIGIBLE. Depth of the
      decoding step: dominates entirely, and in branch C2 it is the serial depth
      of Grover-Prange at radius tau_req, which is astronomically beyond any
      MAXDEPTH budget. In branch C1 it is polynomial and the pipeline would fit
      inside MAXDEPTH 2^{96} comfortably -- which is why the positive branch, if
      it ever fired, would be a break rather than a marginal improvement.
    best_known: >-
      Grover-Prange 2^{w(1+o(1))} = about 2^{66} iterations at HQC-128, poly
      memory, no QRAM (this RQ's declared baseline); quantum-walk MMT/BJMM
      (Kachigar-Tillich; improved line KN-LIT-f7d7dd) possibly lower with
      exponential QRACM, unverified at sublinear weight; classical ISD + DOOM
      about 2^{125} iterations.
    hidden_overhead: >-
      The o(N) hides the reduction's polynomial factors, the number of samples
      needed before a weight-(2w+1) codeword appears (which is the inverse of
      the H2 ratio and could itself be exponential -- it is folded into tau_req
      by construction and must not be double-counted), and the acceptance
      probability of preparing a TRUNCATED distribution, which is NOT known to
      be polynomial and is the record's named risk. Nothing superpolynomial is
      claimed to hide in the exponent itself; the uncertainty is in whether the
      published bounds say what the abstracts imply.
    tradeoff_note: >-
      The pipeline sits at the polynomial-memory, no-QRAM corner and has no
      time-memory tradeoff to offer: there is no list, no table and no claw
      structure, so none of the van Oorschot-Wiener interpolation that dominates
      the exemplar's memory discussion applies. The only tradeoff is
      RADIUS AGAINST RATE: raising tau sharpens the output toward low weight and
      raises the decoding cost, and the whole record is the evaluation of that
      one curve. Parallelization in branch C2 follows the Grover pattern
      (sqrt(P)) and does not change the margin; branch C1, being polynomial,
      does not need it.

  dominated_by: >-
    PREDICTED DOMINATED, BY A LARGE MARGIN, AND EVERY FRONTIER ROW WAS CHECKED.
    (1) GROVER-PRANGE, about 2^{66} iterations, poly memory, no QRAM: predicted
    to dominate this pipeline on TIME by about 906 bits while TYING on memory
    and QRAM -- so the pipeline is dominated outright in the predicted branch.
    (2) QUANTUM-WALK MMT/BJMM: dominates on time by at least as much; dominated
    on memory by this pipeline, which needs no QRACM -- a distinction with no
    practical value at a 906-bit time deficit, and recorded only because the
    Pareto check requires it. (3) CLASSICAL ISD + DOOM, about 2^{125}: dominates
    on time. (4) RLPN / SD 2.0 / Dual Attack 3.0 and the corpus statistical-
    decoding records: themselves outside their advantage window at R = 1/2 per
    IDEA-20260818-d5668d, so they neither dominate nor are dominated by this
    record; both lose to ISD. (5) THE QDP LINE ITSELF (arXiv 2509.24796,
    2310.20651): in the POSITIVE branch it dominates every row on this frontier
    by an unbounded margin (polynomial versus exponential), which is exactly why
    the branch must be checked rather than assumed away; in the predicted branch
    it is not on this frontier at all because its rate condition is not met.
    (6) Brute-force support enumeration 2^{1064}: not on the frontier, and
    notably this pipeline's predicted 2^{972} is BETTER than brute force, which
    is the only row it beats -- stated because a Pareto check that reports only
    the flattering comparisons is not a Pareto check. NO ROW WAS LEFT UNCHECKED.
  sota_delta: >-
    PREDICTED -906 BITS at HQC-128, i.e. the composed pipeline is predicted to
    be about 2^{906} times WORSE than Grover-Prange, with analogous deficits at
    HQC-192 and HQC-256 to be computed. The POSITIVE deliverable is not an
    attack; it is a MARGIN and a mechanism: the gap (1/2 - R_QDP(tau_req)) in
    rate units, which is the exact amount by which the published achievability
    bounds would have to improve before the strongest recent external quantum
    ingredient in code-based cryptanalysis becomes live against HQC, plus the
    correction that the reduction-form input state needs no secret and is
    preparable in polynomial time -- which relocates the obstruction and is the
    part a later reader most needs. ESCALATION THRESHOLD: R_QDP(tau_req) >= 1/2,
    or an ISD instantiation cost below 2^{66}, at any standardized parameter
    set.

  obstruction:
    statement: >-
      To be filled by the run. ANTICIPATED FORM: 'the code-side Regev reduction
      converts finding the weight-(2w+1) codeword of C' into decoding C'^perp at
      a radius exceeding its unique decoding radius by a factor of about 15, and
      the quantum decoding problem''s achievable rate at that radius is r* < 1/2,
      so neither instantiation of the reduction''s inner oracle is cheaper than
      decoding the original instance directly. The obstruction is that the
      reduction TRADES A SMALL-RADIUS DECODING PROBLEM FOR A LARGE-RADIUS ONE,
      and the quantum decoding problem''s poly-time regime does not extend to
      rate 1/2 at that radius.' This is a claim about the OBJECT (the radius-rate
      curve of the reduction composed with the QDP) and not about the attempt.
      FORWARD GUIDANCE, required by the closure standard: what remains open is
      (a) reductions with a smaller radius requirement, including any that
      exploit quasi-cyclicity to supply many correlated instances at once;
      (b) the rank-metric branch, which the cited paper flags as non-memoryless
      and which is a different scheme family entirely (RQC, not HQC, and
      therefore outside this RQ); (c) the DOOM-style multi-instance version, in
      which the n cyclic shifts of the public key give n correlated
      short-codeword targets and the required output probability drops by a
      factor n -- worth about 14 bits, cofactor-scale against a 906-bit deficit,
      and named so a later reader does not mistake it for a way out.
    quantity: >-
      (q1) tau_req, the required relative decoding radius, dimensionless;
      (q2) R_QDP(tau_req), the achievable rate at that radius, dimensionless,
      against the required 1/2; (q3) the deficit log2(pipeline cost) -
      log2(Grover-Prange cost), in bits.
    value: >-
      NOT MEASURED. No run exists; this record proposes the computation.
      PREDICTED at HQC-128: q1 above 0.055 (the unique decoding radius);
      q2 strictly below 0.5 with the margin unknown until Stage 0 supplies the
      bound; q3 about +906 bits. Units: dimensionless, dimensionless, bits.
      Derived this session from recalled Gilbert-Varshamov asymptotics and from
      the two fetched abstracts; predictions, not measurements, per AGENTS
      rule 5, and q2 in particular CANNOT be predicted responsibly at all until
      the achievability bound is read -- it is recorded as unknown rather than
      guessed.
    measured_by: []
    scope: >-
      Would be claimed only for HQC-128/192/256, for the two cited results as
      published, for the Hamming metric, for the extension-trick formulation of
      key recovery, and for the two named instantiations of the inner decoding
      oracle. NOT claimed for other reductions, for the rank metric, for RQC or
      BIKE, for improved future achievability bounds, or for the hardness of
      QC-SD.
    resource_check:
      examined: true
      reading: >-
        THE OBSTRUCTION IS THE HYPOTHESIS OF A SCREENING THEORY, and the theory
        that wants it is 'which code-based schemes are exposed to the QDP
        line'. The quantity (1/2 - R_QDP(tau_req)) is a single dimensionless
        margin computable from a scheme's RATE and RELATIVE WEIGHT alone,
        without any attack being run, so it screens every code-based candidate
        in one evaluation -- and it points the opposite way for LOW-RATE
        schemes, which is a design statement: rate 1/2 is what protects HQC
        here, and a code-based scheme that lowered its rate for key-size reasons
        would move TOWARD the exposed region. A SECOND READING: the margin is a
        WATCH CONDITION with an explicit trigger. Achievability bounds improve;
        this record's margin says by how much they would have to improve, which
        converts an open-ended worry into a monitorable number and is exactly
        the form a later reranking can consume. A THIRD READING FAILED and is
        recorded: the 906-bit deficit itself was examined as a possible resource
        for a time-memory or amplitude theory, and nothing takes it up -- a
        2^{906} deficit is not a square root away from anything, which is the
        same verdict IDEA-20260818-f8dc30 reached for its own large deficit and
        is recorded again here rather than assumed by analogy.
      spawned_ids: []

  estimated_cost:
    implementation: low
    compute: low
    basis: >-
      Stage 0 is careful reading of two papers and is the real cost of the
      record -- days of attention, no compute. Stage 1 is exact binomial and
      entropy arithmetic, minutes. Stage 2 is a dense 2^{N} amplitude vector at
      N <= 20, i.e. at most 8 million complex numbers and a Walsh-Hadamard
      transform, seconds per configuration on a laptop; the whole sweep is core-
      minutes. Stage 3 is arithmetic. No cryptographic-scale execution, no
      quantum hardware, no QRAM model. Total compute well under one core-hour,
