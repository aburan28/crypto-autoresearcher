  assumptions:
    - >-
      The attacker holds one HQC public key (h, s) and no decryption oracle;
      key recovery is the target. The ciphertext-side instance is a different
      object (IDEA-20260829-228ce4).
    - >-
      C'^perp is treated as a random linear code of rate about 1/2 for the
      purposes of its weight enumerator and its ISD cost. It is in fact
      quasi-cyclic, which is heuristic H3 and is tested against a random-code
      null.
    - >-
      The reduction and the QDP algorithm are used exactly as published, with
      no modification. This record proposes no improvement to either; it
      evaluates their composition at HQC's parameters.
    - >-
      Full fault-tolerant error correction; the cost unit for the ISD
      instantiation is the same logical unit used for the Grover-Prange
      baseline, so the two are comparable without conversion.
    - >-
      State preparation for a PRODUCT noise distribution costs O(N) rotations
      and depth O(log N) with a fan-out tree; no QRAM is required anywhere in
      the pipeline, which is a genuine and unusual property and is stated as an
      assumption because a truncated distribution may not factor as a product.

  object_first_framing:
    established_families_declared_off_limits_as_primary_lens:
      - >-
        Grover-Prange and quantum-walk MMT/BJMM as algorithms. This record does
        not accelerate a search; it replaces the algorithm with a reduction.
      - >-
        The dual-window / RLPN / statistical-decoding family, closed at
        R = 1/2 by IDEA-20260818-d5668d's secret-window bound. This record's
        object is the reduction's NOISE PARAMETER, not a parity-check bias, and
        the secret-window bound does not apply to it because no window is used.
      - >-
        Hidden-shift and HSP readings of the ring, closed by
        IDEA-20260813-5a2aaa.
      - >-
        The ten objects already generated against this RQ.
    tracked_object: >-
      THE PAIR (tau, R_QDP(tau)) -- the noise radius of the reduction's
      weighting distribution together with the achievable code rate at that
      radius. A full noise distribution on F_2^N is followed through the
      pipeline compressed to this two-number summary, and the attack's entire
      cost is a function of it.
    lossy_projection_test: >-
      PASSES, AND THE COMPATIBILITY ARGUMENT IS UNUSUALLY CLEAN. LOSSY: the
      projection sends a distribution on F_2^N -- 2^{35339} real numbers at
      HQC-128 -- to one real parameter and one rate. The fibres are beyond
      astronomical. COMPATIBLE: the pipeline's one essential operation is the
      Fourier transform over F_2^N that converts the noise-weighted code state
      into a dual-code state, and for a MEMORYLESS (product) noise distribution
      that transform FACTORIZES: the dual amplitudes depend on f only through
      the per-coordinate bias 1 - 2p, so the output distribution over dual
      codewords is exactly proportional to (1 - 2p)^{weight}. The discarded
      structure -- every correlation between coordinates -- is exactly the
      structure the transform cannot see for product distributions, so the
      retained parameter propagates deterministically through the operation that
      matters. That the cited paper generalizes to all MEMORYLESS noise models
      and separately flags rank-metric noise as non-memoryless is the external
      confirmation that memorylessness is the right boundary for this
      projection. FAILING VARIANT, recorded to show the test bites: tracking
      'the amplitude vector of the noise state' discards nothing and is a change
      of basis, not an object; tracking 'the truncation threshold alone' is
      lossy but INCOMPATIBLE, because truncation destroys the product structure
      and the Fourier transform of a truncated product is not determined by the
      threshold -- which is precisely why arXiv 2106.02747's switch from
      Bernoulli to TRUNCATED Bernoulli is a substantive complication and not a
      technicality, and it is named here as the main technical risk to the
      projection.
    survival: >-
      The pair survives code extension, state preparation, the Fourier step and
      the output-weight analysis -- the entire pipeline -- which is unusually
      far and is why a single inequality can decide the lane. It DISSOLVES at
      the decoding step, where the cost depends on the code and not only on
      (tau, R); that is exactly where the record predicts the pipeline dies, and
      the dissolution point and the failure point coinciding is the record's
      central structural observation.

  proof_search_map:
    bottleneck: >-
      The decoding oracle inside the reduction, evaluated at the radius tau_req
      that the output-weight requirement forces. Not state preparation, which is
      polynomial; not the Fourier step, which is one layer of Hadamards.
    baseline_embedding:
      parameter_slice: >-
        Rate R -> 0 with fixed relative noise. In that slice the QDP's
        achievable rate condition must be satisfied and the composed pipeline
        must reproduce the published polynomial-time statement -- the cited
        result that quantum decoding under Bernoulli noise is poly-time while
        classical decoding is exponential. A parameterization in which the
        pipeline is never poly-time at any rate is WRONG and must be discarded
        before HQC is touched.
      reproduction_check: >-
        Symbolic: substitute the low-rate slice into the composed cost
        expression and verify it returns polynomial time, term by term, against
        the paper's own statement as read in Stage 0. Numeric: a frozen fixture
        at small N (12 to 20) where the entire pipeline is simulated exactly as
        an amplitude vector, confirming that at low rate the sampled dual
        codeword is the minimum-weight one with the predicted probability. THIS
        REPRODUCTION IS THE RECORD'S PRIMARY GUARD against a threshold formula
        that proves too much: a formula that closes the lane at every rate would
        also contradict a published theorem.
    observation_collision:
      observable: 'the pair (tau, R_QDP(tau)) and the resulting output-weight distribution'
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE RECORD'S MAIN TECHNICAL RISK: two noise
        distributions with the SAME nominal radius tau -- an untruncated
        Bernoulli and a truncated Bernoulli with the same mean -- have the same
        first moment and different Fourier transforms, hence different output
        distributions and, critically, different preparation costs and different
        validity for the reduction. The cited paper switched between exactly
        these two for exactly this reason. SEPARATING CONDITION: the observable
        must be the full per-coordinate Fourier profile of the actual
        distribution used, not its radius, and every number in the run must be
        labelled with which distribution produced it. A second collision, benign
        and used as a control: any two codes with the same weight enumerator
        give the same output distribution, which is why the random-code null
        object is a valid comparison.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the hypothesis 'HQC's secret is hard to find' into the exact
          condition 'C' has a codeword of weight 2w+1 and the QDP's achievable
          rate at the radius that reveals it is below 1/2'. Encoding,
          completeness, soundness, transfer and cost-loss obligations are
          separated in proof_obligations below.
        predicted_gain: >-
          Converts an open-ended 'could the QDP break HQC' into one inequality
          between two published closed-form quantities, decidable in hours.
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from 'the QDP applied to a code the
          attacker can already decode' to 'the QDP applied to C'^perp', and ask
          for a strict inward improvement over Grover-Prange rather than mere
          applicability.
        predicted_gain: >-
          Either quantum polynomial time (positive branch) or a measured deficit
          of about 906 bits at HQC-128 (predicted branch).
    quantifier_order: >-
      FOR ALL standardized parameter sets P, THERE EXISTS a radius tau_req(P)
      such that the reduction's output places non-negligible mass on weight
      2w+1, AND FOR THAT tau_req the achievable rate R_QDP(tau_req) is compared
      against 1/2. The witness (the noise distribution) may depend on P but must
      NOT depend on the secret (x, y) -- if the only workable distribution is one
      that already encodes where the low-weight codeword is, the reduction is
      circular and the record must say so rather than report a threshold. That
      circularity check is the single most important quantifier-order obligation
      here and it is easy to fail silently.
    method_ceiling:
      strongest_certifiable_claim: >-
        'At HQC-128/192/256, under the achievability bound of arXiv 2509.24796
        as published and the radius requirement of arXiv 2106.02747 as
        published, the composed pipeline has achievable rate R_QDP(tau_req) = r*
        against the required 1/2, a margin of (1/2 - r*) in rate units and X
        bits in cost, and is therefore dominated by Grover-Prange by X bits.'
        The method can NEVER certify that no OTHER quantum reduction exists, nor
        anything about improved future achievability bounds -- it certifies a
        margin against a specific published pair of results and it is
        REFUTED, correctly, the day either improves.
      nearby_object_control: >-
        THE NEAREST OBJECT WHERE THE HOPED-FOR CONCLUSION MUST FAIL is a
        LOW-RATE code (R = 0.1) with the same relative weight, where the cited
        polynomial-time statement should hold and the pipeline should WIN. If
        the computed threshold closes that object too, the threshold is wrong
        and no HQC number may be reported. Second control: a code with a
        PLANTED codeword of weight far below GV, where the required radius drops
        and the pipeline must succeed at toy scale in exact simulation -- if it
        does not, the simulation, not the mechanism, is what is being measured.
    proof_obligations:
      - claim: 'C'' has (x, y, 1) as its unique minimum-weight codeword at HQC parameters'
        responsibility: correctness
      - claim: 'the reduction-form input state is preparable in poly time from public data'
        responsibility: feasibility
      - claim: 'the output distribution over C'' is proportional to (1-2p)^{weight} for product noise'
        responsibility: size
      - claim: 'tau_req is the radius at which weight-(2w+1) output has non-negligible mass'
        responsibility: success_probability
      - claim: 'R_QDP(tau_req) is evaluated from the published bound without reinterpretation'
        responsibility: interface
      - claim: 'the ISD instantiation at radius tau_req costs 2^{N h(tau)(1-R)/2 + o(N)}'
        responsibility: runtime
      - claim: 'the low-rate slice reproduces the published polynomial-time regime'
        responsibility: baseline
      - claim: 'the noise distribution does not depend on the secret'
        responsibility: soundness
      - claim: 'the closure is scoped to the two cited results as published'
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        minimum weight of the quasi-cyclic code D at HQC-128, relative to the
        Gilbert-Varshamov prediction
      direction: different
      minimum_effect: >-
        PREDICTED at GV, about 0.110 * 35338 = 3887, i.e. about 29 times the
