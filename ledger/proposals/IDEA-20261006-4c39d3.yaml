idea:
  id: IDEA-20261006-4c39d3
  question_id: RQ-ECDLP-bc7a54
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: Interpolation degree of the scalar on the small-x set against a random labelling
  class: measurement
  claim: >-
    For an ordinary prime-order subgroup of size N on a short-Weierstrass
    curve over F_p, the minimal total degree of a bivariate polynomial in the
    affine coordinates that agrees with the discrete logarithm on a subset S
    of {Q : x(Q) < p^{2/3}} with |S| at least 2 N^{1/2} is at least half the
    minimal total degree of the same interpolation for a random bijection
    from Z/N to a set of N labels in F_p^2. Representation class R1 (integer
    digits of the affine coordinates). Attack stage charged: the online
    inversion step omega of a hint family, not collision search, not
    factor-base membership, and not linear algebra. No ECDLP exponent
    improvement is claimed. A ratio below 1/2 would falsify this claim and
    would still not by itself be an exponent.
  mechanism: >-
    PAIR. Representation: the integer digits of the affine coordinates (x, y)
    in {0, ..., p-1} (R1). Operation set Sigma: negation, Q maps to -Q, and
    nothing else. Sigma does not contain translation.
    TRICHOTOMY. Partial-action. Negation preserves x and flips the sign of y,
    so the indicator of the interval x < p^{2/3} is invariant under Sigma and
    the sign bit is determined by it. Neither quantity is a function of a
    generic translate, so the retained data propagate under negation and not
    under the group law.
    LOSSY-PROJECTION TEST. The projection rho(Q) = (1 if x(Q) < p^{2/3} else
    0, sign of y(Q)) discards the position of x inside the interval and the
    magnitude of y. It is compatible with Sigma because rho(-Q) is determined
    by rho(Q): the indicator is unchanged and the sign flips. It is lossy
    because the fiber over the in-interval positive sign has size about half
    the interval set, which is larger than one negation orbit as soon as the
    interval contains two pairs. A map that kept the full (x, y) would be
    injective on affine points and would be a change of coordinates; rho is
    not that map. The polynomial omega is allowed to read the full (x, y) of
    a point already known to lie in the interval, which is what inversion
    from coordinates means, and the degree test asks whether that reading is
    a short polynomial. The Kummer line, which keeps the full x in P^1, is
    not the representation returned. Digit truncation of the integer x is the
    R1 object, and the interval indicator is coarser than the Kummer
    coordinate.
    OFF-LIMITS. F6 (the negation automorphism) is a component: it is Sigma.
    What is added is the interpolation degree of the scalar, which the
    negation-map walk does not compute. F7 is not used: an interpolant whose
    degree is |S|-1 is a table and is charged as precomputation P = |S|, not
    as a hint. F1 is not used: there is no walk. F2, F3, F4 and F5 are not
    used. KR-IC-f5c584 is not this mechanism: there is no summation
    polynomial and no trace morphism from E to F_2.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-bc7a54
      provenance: internal
      claim: >-
        The question asks whether any subset that is dense and decidable from
        coordinates is also invertible from coordinates by a cheap map, and it
        names D_x = {Q : x(Q) < p^{2/3}} as decidable with no known inversion.
      verified_by: ledger/questions/RQ-ECDLP-bc7a54.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        In the generic group model a discrete logarithm in a prime-order group
        needs Omega(sqrt(p)) group operations, and a sub-square-root ECDLP
        algorithm must exploit the representation.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Bernstein-Lange precomputation of about l^{2/3} gives about l^{1/3}
        online work per logarithm, and the Corrigan-Gibbs-Kogan bound
        S times T^2 = Omega-tilde(epsilon N) is met by that tradeoff.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Walking on negation classes gives a square-root-of-2 reduction in
        expected iterations, with fruitless cycles. The gain is a constant.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
    - ref: KR-RHO-5b1c0a
      provenance: internal
      claim: >-
        A representation and subset-sum approach to ECDLP over F_{p^2} costs
        p^{1.314}, worse than rho.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-5b1c0a.yaml
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        The Weil descent to F_2 of S_3 on ordinary binary curves has first
        fall degree 2 because the trace of x is a group morphism onto F_2.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
  assumptions:
    - >-
      Negation is quotiented before any degree is compared to the generic
      bound, as RQ-ECDLP-bc7a54 requires of known symmetries. The factor of
      two that negation can contribute is the 1/2 in the claimed ratio.
    - >-
      An omega that is a table of the points in S is precomputation of size
      |S| and is not a hint-family inversion.
    - >-
      The anomalous curve is a calibration object. A cheap p-adic logarithm
      there is the known anomalous attack and is not evidence for the
      ordinary arm.
  proof_search_map:
    bottleneck: >-
      Producing the discrete log from the coordinates of a point in D_x
      without a table of size |D_x|. The interpolation degree is the
      bottleneck quantity: if it stays at the random-label degree, this
      grammar of omega does not remove the bottleneck.
    baseline_embedding:
      parameter_slice: >-
        Pollard rho at Theta(N^{1/2}) group operations with polynomial
        memory, and the Bernstein-Lange point of KR-RHO-ea34b8 (about
        N^{1/3} online after about N^{2/3} precomputation).
      reproduction_check: >-
        On the random bijection, the minimal total degree must sit at the
        generic interpolation threshold for |S| points in the plane, within
        a factor of 2 across two independent bijections. If the two random
        degrees differ by more than that, the instrument is void.
    observation_collision:
      observable: >-
        The minimal total degree of a polynomial agreeing with the discrete
        log on S. Two different subsets with the same degree are not
        separated by the observable.
      distinct_preimage_search: >-
        Inside one fiber of rho, list pairs with the same interval bit and
        the same sign of y and different absolute discrete logs. Any such
        pair is a collision of the lossy projection that a function of rho
        cannot separate.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of rho inside D_x, and the minimal-degree bivariate
          polynomial on the full coordinates of a subset S of that fiber's
          underlying points.
        predicted_gain: >-
          A degree ratio at least 1/2 against the random labelling. The
          predicted gain in the ECDLP exponent is zero.
    quantifier_order: >-
      For every ordinary prime-order curve in the toy ladder, and for every
      bivariate polynomial of total degree less than half the random-label
      degree, there exists a point of S on which the polynomial disagrees
      with the discrete log. Equivalently, the minimal agreeing degree is at
      least half the random-label degree.
    method_ceiling:
      strongest_certifiable_claim: >-
        A lower bound on interpolation degree inside the grammar of
        bivariate polynomials, on one interval subset, at toy N. The method
        cannot certify that every conceivable omega is expensive, and it
        cannot certify the generic-group bound, which is already a theorem
        in another model.
      nearby_object_control: >-
        An anomalous curve of comparable size, where a p-adic logarithm is a
        cheap function of a lifted coordinate. The same instrument must
        return a degree ratio strictly below 1/2 on that curve, or the
        instrument is blind and the ordinary result is void. A second
        nearby object is a random bijection, where the degree must stay
        high.
    proof_obligations:
      - claim: >-
          The random-label degree is computed on two bijections and the
          ordinary degree is compared to their minimum.
        responsibility: baseline
      - claim: >-
          Every polynomial evaluation is checked against an exhaustive
          discrete-log table by the identity [k]P = Q.
        responsibility: correctness
      - claim: >-
          A degree ratio of 1/2 or higher does not reduce the Omega(N^{1/2})
          operation count.
        responsibility: runtime
      - claim: >-
          The anomalous arm reproduces a cheap logarithm, certified by
          [k]P = Q, or the instrument is void.
        responsibility: feasibility
      - claim: >-
          The result is scoped to bivariate polynomials and to the interval
          x < p^{2/3}.
        responsibility: scope
    not_applicable_reason: >-
      No subfield is inapplicable. There is no success-probability heuristic
      in the claim: the degree is an exact integer on a tabulated group.
  predictions:
    - metric: >-
        Ratio of the minimal total degree of a bivariate polynomial agreeing
        with the discrete log on S, ordinary curve, to the same degree for a
        random bijection of the same order.
      direction: higher
      minimum_effect: ">= 1/2"
    - metric: >-
        The same degree ratio on the anomalous calibration curve.
      direction: lower
      minimum_effect: "< 1/2"
  minimal_test:
    design: >-
      Build one ordinary short-Weierstrass curve over the smallest prime p
      with 2^{10} < p < 2^{12} whose prime-order subgroup has size N in
      (2^{10}, 2^{12}), avoiding the equation y^2 = x^3 + x + 1. Tabulate
      the discrete log exhaustively. Let D_x be the set of subgroup points
      with integer x strictly less than p^{2/3}. Draw S subset D_x with |S|
      = min(|D_x|, ceil(2 N^{1/2})), quotiented by negation so that Q and -Q
      are not both charged as independent targets. Compute the minimal total
      degree of a polynomial f in two variables over F_p with f(x, y) equal
      to the discrete log on S. Repeat for two random bijections Z/N to
      labels in F_p^2. Repeat the ordinary measurement on one anomalous
      curve of similar size, using the same fitter, as calibration. Do not
      build a window table, and do not use bit windows of width 32 or 33.
    controls:
      - two independent random bijections Z/N to F_p^2 labels
      - negation quotient applied before the degree is measured
      - anomalous curve of similar size, where the degree ratio must drop
      - a second ordinary curve at the next admissible prime, as a decay check in N
    required_metrics:
      - "|D_x|, |S|, and N"
      - minimal total degree on the ordinary arm
      - minimal total degree on each random bijection
      - degree ratio ordinary over random
      - degree ratio on the anomalous arm
      - number of rho-fibers that contain two points with distinct absolute discrete logs
  falsification_conditions:
    - >-
      The ordinary degree ratio is strictly below 1/2 on both ordinary
      curves in the ladder.
    - >-
      The anomalous calibration ratio is not strictly below 1/2. The
      instrument is then blind, and the ordinary ratio is not evidence.
    - >-
      The two random bijections differ by more than a factor of 2 in
      minimal degree. The baseline is then unstable and the comparison is
      void.
  confounders:
    - >-
      The space of total-degree-d polynomials has dimension (d+1)(d+2)/2, so
      every function on S has some interpolant once that dimension exceeds
      |S|. Only a gap below the random-label degree is compression.
    - >-
      Negation identifies k and -k. Quotienting first prevents that factor
      of two from being reported as a new compression.
    - >-
      A PGL_2 change of coordinates moves the interval x < p^{2/3}. The
      second ordinary curve is there to catch a coordinate accident.
    - >-
      At N near 2^{10} the set D_x may be only slightly larger than 2
      N^{1/2}. The sizes are reported and a too-small D_x voids the cell.
  interpretation_limits:
    - >-
      No ECDLP exponent improvement is claimed. The generic-group lower
      bound remains Omega(N^{1/2}) group operations (KR-RHO-13bf67), and
      rho meets it up to a constant. Bookkeeping: this test performs no
      group operations toward a logarithm; it prices an interpolation
      degree. A ratio of 1/2 would be the negation ambiguity already in
      KR-RHO-fb88e6, which is a constant sqrt(2) on the iteration count and
      not an exponent.
    - >-
      Even a ratio below 1/2 would be one polynomial on one toy subset. It
      would falsify this claim and would not yet be an algorithm of cost
      N^{1/3}.
    - >-
      Bernstein-Lange already achieves about N^{1/3} online after about
      N^{2/3} precomputation (KR-RHO-ea34b8). A table of S is that
      precomputation, charged as P, and does not beat the bound
      S times T^2 = Omega-tilde(N).
    - >-
      The grammar is bivariate polynomials. A cheap omega outside that
      grammar is not constrained.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a random bijection from Z/N to labels in F_p^2, the minimal
        total degree of a bivariate polynomial agreeing with the label's
        preimage on a subset S of size at least 2 N^{1/2} equals the generic
        interpolation degree of an arbitrary function on S, up to a factor
        of 2, for N in (2^{10}, 2^{12}).
      rigorous_support: >-
        A nonzero univariate polynomial of degree d has at most d roots.
        In two variables the rigorous substitute used here is the dimension
        count (d+1)(d+2)/2: below the d where that dimension exceeds |S|,
        a polynomial cannot interpolate an arbitrary function. H1 says a
        random labelling meets that dimension threshold the way a random
        function meets the Schwartz-Zippel root bound, and it is checked
        rather than assumed at cryptographic size.
      validation_plan: >-
        On each of two random bijections, compute the minimal degree and
        compare it to the smallest d with (d+1)(d+2)/2 >= |S|. The
        assumption fails if either random degree is less than half that d.
        Sample size is the entire subset S, not a sample from it, at one N
        in (2^{10}, 2^{12}) and one further N. No transfer to N = 2^{256}
        is used. The ordinary arm is compared to these measured degrees.
  target_complexity:
    time_exponent: >-
      Unchanged at N^{1/2}. A hint-family inversion on a set of density
      N^{-1/3} would give online cost N^{1/3} with no precomputation; this
      claim does not exhibit that inversion, so the bookkeeping product of
      per-attempt cost and inverse hit probability is not formed.
    memory_exponent: >-
      Unchanged. Rho uses polynomial memory. The Bernstein-Lange alternative
      uses memory about N^{1/3} after precomputation about N^{2/3}. This
      test stores one toy table of size N in order to know the logarithms
      it is interpolating, and that table is the measurement instrument, not
      an algorithm.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations, met by rho up
      to a constant, and KR-RHO-ea34b8, about N^{1/3} online after about
      N^{2/3} precomputation. Both rows were opened for this proposal.
    hidden_overhead: >-
      The rho constant, including the sqrt(pi N / 2) expectation and the
      sqrt(2) negation factor, is outside this measurement. No o(1) term is
      claimed.
    tradeoff_note: >-
      The relevant tradeoff is KR-RHO-ea34b8: online time about
      N^{1/2} / w^{1/2} once precomputation has filled w distinguished
      points, meeting S times T^2 = Omega-tilde(N). A polynomial omega on
      D_x would sit outside that tradeoff only if its evaluation cost were
      polylogarithmic. This test does not produce such an omega.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-ea34b8
      - KR-RHO-fb88e6
      - KR-RHO-5b1c0a
      - KR-IC-f5c584
    nearest:
      - ref: KR-RHO-13bf67
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        relation: adjacent
        delta: >-
          The row claims that any generic algorithm needs Omega(sqrt(p))
          group operations and that a sub-square-root algorithm must exploit
          the representation. This proposal tests one representation, the
          integer digits of (x, y) on the small-x set, by interpolation
          degree. It does not claim to go under the bound.
      - ref: KR-RHO-ea34b8
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-ea34b8.yaml
        relation: adjacent
        delta: >-
          The row claims about l^{1/3} online work after about l^{2/3}
          precomputation, meeting S times T^2 = Omega-tilde(epsilon N). This
          proposal does not build that table. It asks whether a polynomial
          in the coordinates inverts the small-x set without being charged
          as precomputation.
      - ref: KR-RHO-fb88e6
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
        relation: adjacent
        delta: >-
          The row claims a square-root-of-2 iteration reduction from walking
          on negation classes, together with fruitless cycles. Negation is
          Sigma here, and it is quotiented out before the degree comparison.
          The interpolation degree of the scalar is not the walk speedup.
      - ref: KR-IC-f5c584
        provenance: internal
        verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-f5c584.yaml
        relation: orthogonal
        delta: >-
          The row claims that Weil descent to F_2 of S_3 on ordinary binary
          curves has first fall degree 2, because the trace of x is a group
          morphism onto F_2. This proposal measures a bivariate interpolation
          degree of the discrete log on a prime-field interval subset of size
          at least 2 N^{1/2}, with ordinary-to-random ratio at least 1/2.
          There is no summation polynomial and no trace morphism. A first
          fall degree of 2 and an interpolation-degree ratio of 1/2 are
          different integers on different objects. The ECDLP exponent stays
          1/2.
  dominated_by: >-
    KR-RHO-13bf67 dominates any algorithm that does not exploit a
    representation beyond a generic labelling: Omega(N^{1/2}) group
    operations. KR-RHO-ea34b8 dominates the precomputation route that this
    grammar collapses to when the interpolant is a table: about N^{1/3}
    online only after about N^{2/3} precomputation. The gap that remains is
    whether some omega outside the bivariate-polynomial grammar inverts a
    dense decidable set. This proposal prices one degree and does not close
    that gap. The exponent distance from 1/2 to the zero-precomputation
    hint-family target 1/3 stays 1/6.
  sota_delta: >-
    Zero change to the exponent 1/2. The integer measured is a minimal total
    degree, with the claim that the ordinary-to-random ratio is at least
    1/2. Relative to KR-RHO-ea34b8, the online exponent 1/3 remains available
    only with precomputation about N^{2/3}, and this degree does not reduce
    that precomputation.
