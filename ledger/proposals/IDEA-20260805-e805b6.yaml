idea:
  id: IDEA-20260805-e805b6
  question_id: RQ-MLKEM-001
  added: '2026-08-05'
  title: >-
    Determinant-ideal information audit of the tower-PIP route to Module-LWE:
    a one-line forced value that decides whether any principal-ideal pipeline can
    read the ML-KEM secret at all
  class: control

  claim: >-
    The determinant ideal of the ML-KEM module lattice
    M(A) = {(x, y) in R^k x R^k : y = A x mod q}, R = Z[X]/(X^256 + 1),
    q = 3329, is (q^k) -- INDEPENDENT OF A -- and its index in R^{2k} is q^{nk}
    for every A of full rank mod q. Consequently any attack pipeline whose
    Phase-1 output is that determinant ideal, and whose subsequent phases operate
    only on it (principal-ideal test, short-generator recovery, log-unit CVP),
    receives an input that is bit-identical whether or not an MLWE secret was
    planted, and therefore recovers zero information about s. This is a derivable
    forced value, not a measurement, and it is the cheapest available
    discriminator for the claim of Luo, "Module Lattice Security (Part IV):
    Probabilistic Polynomial Quantum Attack on Module-LWE over 2-Power
    Cyclotomics" (arXiv 2605.17412v2), whose Parts I and III are already in this
    corpus as unverified bulk-seeded entries (KN-LIT-7650, KN-LIT-1742). The
    audit has two possible outcomes and BOTH are useful: either the pipeline's
    Phase 1 does something other than what the retrieved summary describes -- in
    which case the audit locates the real reduction and this program has found a
    structural ingredient of the first importance -- or it does not, in which case
    a total-break claim against a standardised scheme is refuted at zero compute
    and two corpus entries are quarantined before anything cites them.

  object_first_candidate:
    tracked_object: >-
      The determinant ideal (equivalently the Steinitz invariant plus the ideal
      norm) of the MLWE module lattice, followed from the instance through the
      claimed pipeline: module lattice -> pseudo-Hermite / triangular form ->
      layer ideals I_i = (T_{R,ii}) -> product = determinant ideal -> principality
      test -> short generator -> secret.
    established_families_off_limits: >-
      Off-limits as the primary lens for this session: dual-sieve/FFT,
      estimator differencing, hybrid MITM, coefficient-isometry amortisation,
      decryption-failure attacks, implementation side channels. The
      class-group/unit-lattice family is NOT off-limits here, and that is
      deliberate: this proposal does not propose a new attack in that family, it
      audits an external claim inside it, which is the one move the "declare the
      family off-limits" rule does not forbid.
    newness_score: >-
      The determinant-ideal computation is elementary and certainly known. What
      is not in this corpus, and what the audit supplies, is the application of it
      as a PRE-REGISTERED FORCED VALUE against a specific 2026 break claim whose
      Parts I and III this program has already ingested without verification.
    testability_score: >-
      Very high, and mostly free: the headline is an algebraic identity checkable
      by hand and confirmable in Pari/GP at n = 8 and 16 in seconds.
    survival_score: >-
      The object survives the whole pipeline by construction -- that is precisely
      the problem with it. Its being an invariant of the pipeline is what makes it
      information-free.

  mechanism: >-
    M(A) = {(x, y) : y = A x mod q} is the preimage of the graph of A under
    reduction mod q. The map (x, y) -> y - A x mod q from R^{2k} to (R/qR)^k is
    surjective with kernel M(A), so [R^{2k} : M(A)] = |R/qR|^k = q^{nk} for every
    A that is well-defined mod q, invertible or not. As an R-module, M(A)
    contains R^k (+) q R^k and is contained in R^{2k}, and its R-determinant
    (the k-th exterior power of the projection, equivalently the product of the
    elementary divisors) is (q^k). Neither quantity depends on A, hence neither
    depends on s, e or b. Any pipeline that computes a triangular / pseudo-HNF
    form and then feeds the product of the diagonal layer ideals into a
    principality test is computing a function of (q, k, n) alone. The obstruction
    is informational, not computational: no improvement to PIP, to the unit-group
    representation, or to log-unit CVP can repair an input that is constant across
    instances. A second, independent obstruction of the same shape: rank
    reduction. An MLWE instance of rank k over R is an RLWE instance of rank 1
    over a degree-nk ring only if A lies in a commutative subalgebra of M_k(R) of
    the right index; a uniformly random A does not, and this is why the historical
    progression rank-1 break -> rank-2 does not follow. Both obstructions are
    stated so that a reviewer can attack them rather than take them on trust.

  novelty_status: unverified

  literature_context:
    - >-
      Ming-Xing Luo, "Module Lattice Security (Part IV): Probabilistic Polynomial
      Quantum Attack on Module-LWE over 2-Power Cyclotomics", arXiv 2605.17412,
      v1 2026-05-17, v2 2026-05-25. THE PAPER WAS NOT READ. What was retrieved on
      2026-08-05 is a model-generated summary of the HTML landing page. As
      reported in that summary: Theorem 4.1 gives gamma = alpha_d exp(sigma_d
      sqrt(2 ln n))(1 + o(1)) with alpha_d <= 1.17 and sigma_d ~ 0.862, hence
      gamma <= 21 at the median and gamma_99% ~ 103, compared against q/2 =
      1664.5 for ML-KEM-1024, with success probability >= 0.99; Phase 1 is a
      module-to-ideal decomposition in which "the diagonal entries T_{R,ii}
      generate the successive layer ideals I_i = (T_{R,ii}) contained in R" and
      "the product of these ideals equals the determinant ideal (det B)"; the
      argument that every such ideal is principal is stated as resting on
      h_k^+ = 1; the tower PIP algorithm is claimed at O(n^3 log^2 n) quantum
      gates and O(n^2 log n) qubits. EVERY ONE OF THESE IS A RELAYED CLAIM AT
      SECOND HAND AND NONE IS VERIFIED HERE. The audit's first task is to replace
      this paragraph with quotations from the actual PDF.
    - >-
      KN-LIT-7650 (Part I, "Unconditional Verification of Weber's Conjecture for
      k <= 12") and KN-LIT-1742 (Part III, "Structured CVP Distance on the
      Log-Unit Lattice") are already in this corpus. Both carry the 2026-07-24
      bulk-seeding caveat: "generated from the local PDF's first two pages...
      claims are relayed from the paper's abstract without independent
      verification". KN-LIT-1742's relayed key claims include "we reduce the CDPR
      factor for ML-KEM from exp(Otilde(sqrt(n))) to a sub-polynomial value". That
      sentence is now sitting in this program's retrievable knowledge base,
      unverified, and is exactly the kind of thing a future agent will cite.
      Quarantining or confirming it is overdue and this proposal is the cheapest
      route to either.
    - >-
      KN-TECH-046 (as cited by KN-OPEN-026) records the established position: the
      class-group / unit-lattice line reaches approximation factor
      exp(Otilde(sqrt(n))), FAR ABOVE deployed parameters, so no deployed scheme
      is affected. The Part I-IV chain claims to overturn exactly this. Two
      corpus entries now point in opposite directions on the same question and the
      contradiction is unresolved -- which is itself a reason to run the audit
      (AGENTS.md knowledge-retrieval policy item 7: report contradictory sources
      rather than picking one).
    - >-
      Weber's conjecture concerns h^+ , the class number of the maximal REAL
      subfield. The full class number of Q(zeta_{2^k}) is h = h^+ h^-, and h^- is
      not 1 for k >= 6. "h_k^+ = 1, therefore every ideal is principal" is
      therefore a claim about the wrong field unless the ideals in question are
      ideals of the real subfield. THIS IS AN OBJECTION TO CHECK, NOT AN
      ESTABLISHED REFUTATION: it rests on a second-hand summary, and h^- values
      are to be COMPUTED in the audit, not asserted from memory.

  lossy_projection_identifiability_audit:
    projection: >-
      Full MLWE instance (A, b = A s + e) --> determinant ideal of M(A) with its
      norm and Steinitz class.
    what_is_discarded: Everything except q, k and n.
    why_genuinely_lossy: >-
      Maximally lossy, which is the point. The fibre over the observed value is
      the ENTIRE instance space.
    why_compatible_with_the_operations: >-
      Perfectly compatible -- the determinant ideal is a module invariant and
      propagates deterministically through every step of the claimed pipeline.
      This is the case the lossy-projection test is least equipped to reject and
      the null-sufficiency test catches instantly: a projection can be lossy,
      compatible, and still worthless, because it is CONSTANT. The tell is the
      one KN-TECH-1a5b7e names mechanically -- if the comparator's spread is
      zero, the statistic is a constant of the apparatus.
    is_it_only_a_change_of_coordinates: >-
      Worse: it is a constant function. The failure mode is not the KN-LIT-7595
      one (nothing discarded) but its mirror image (nothing retained).

  assumptions:
    - >-
      That the retrieved summary of Part IV's Phase 1 is faithful. IF IT IS NOT,
      this proposal's headline objection may be void, and the audit's design
      accounts for that: step 1 is to read the actual PDF and either quote the
      reduction or record that the summary misdescribed it.
    - >-
      That "recovering the secret" for ML-KEM means recovering s (or a decrypting
      equivalent), not recovering some generator of some ideal.

  proof_search_map:
    bottleneck: >-
      The step in which instance-specific information enters the principal-ideal
      pipeline. If no such step exists, every downstream improvement -- tower PIP,
      unit-group representation, log-unit CVP bound -- is irrelevant to ML-KEM
      regardless of its correctness as number theory.
    baseline_embedding:
      parameter_slice: >-
        k = 1 and q = 1 (no modulus) reproduces the classical CDPR / Short
        Generator setting exactly: the secret IS a short generator of a principal
        ideal, the determinant ideal IS the secret's ideal, and the pipeline is
        the known attack on Soliloquy-style schemes. The claim under audit is that
        the family extends to k >= 2 with a q-ary modulus; the audit asks whether
        the extension carries the instance dependence that the k = 1 slice has.
      reproduction_check: >-
        Symbolic, plus a frozen fixture at n = 8: build a principal ideal with a
        planted short generator, run the pipeline, confirm recovery. If the
        pipeline cannot even do the k = 1 case in the implemented form, no
        conclusion may be drawn about k = 2.
    observation_collision:
      observable: The determinant ideal and its short generator.
      distinct_preimage_search: >-
        The collision search is trivial and DECISIVE, and it is the whole
        proposal: exhibit two instances, one with a planted MLWE secret and one
        with b drawn uniformly at random (no secret exists), whose determinant
        ideals are IDENTICAL. Derived above; to be confirmed computationally at
        n = 8, 16, k = 2. This is a direct falsifier of identifiability, and there
        is no additional condition in the summarised pipeline that separates them.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (determinant ideal) fixed and vary the forgotten
          structure (A, s, e). If an intrinsic invariant distinguishing the
          resulting objects exists inside the pipeline, name it; if not, the
          pipeline cannot depend on it.
        predicted_gain: >-
          None to the attacker. The gain is to the program: a named obstruction
          for the whole principal-ideal family applied to q-ary module lattices.
    quantifier_order: >-
      The claim under audit, written out: THERE EXISTS a quantum algorithm such
      that FOR ALL ML-KEM-1024 instances, WITH PROBABILITY >= 0.99 over the
      algorithm's randomness, it outputs a decrypting key in poly(n) time. The
      audit's counter-statement: FOR ALL A and FOR ALL b, the determinant ideal of
      M(A) is (q^k), so ANY algorithm whose input is that ideal has success
      probability independent of the instance, hence equal to its success
      probability on an instance with no secret. Note the quantifier trap the
      audit is hunting: a witness (the short generator) that is allowed to depend
      on the instance cannot be produced by a procedure whose input does not.
    method_ceiling:
      strongest_certifiable_claim: >-
        The audit can certify, at most, that the pipeline AS SUMMARISED cannot
        recover s. It cannot certify that no principal-ideal route to Module-LWE
        exists, and it must not be written up as if it could -- that would be the
        premature-closure failure mode.
      nearby_object_control: >-
        The nearby object on which the desired conclusion (recovery) DOES hold is
        rank-1 RLWE with a secret that is itself a short generator of a principal
        ideal -- the historical CDPR/Soliloquy target. A pipeline that cannot
        distinguish that object from ML-KEM has not identified the load-bearing
        structure. Running the implemented pipeline on BOTH is a required arm.
    proof_obligations:
      - claim: det ideal of M(A) is (q^k), index q^{nk}, for all A.
        responsibility: correctness
      - claim: h(Q(zeta_{2^k})) > 1 for some k <= 7, computed not asserted.
        responsibility: baseline
      - claim: Rank-k module is not an ideal lattice for random A.
        responsibility: feasibility
      - claim: gamma <= 21 is compared against the right threshold.
        responsibility: strictness
      - claim: The audit closes the summarised pipeline only, not the family.
        responsibility: scope

  predictions:
    - metric: >-
        n_distinct_determinant_ideals: number of distinct determinant ideals (as
        R-ideals, compared by Pari/GP idealhnf) over 200 independent random A at
        n = 8 and n = 16, k = 2, q = 3329
      direction: lower
      minimum_effect: >-
        EXACTLY 1. Predicted value 1, derived before the run. If the measured
        value is > 1, the derivation is wrong, the Phase-1 output does carry
        instance information, and this proposal's headline objection is
        FALSIFIED -- which would be the single most interesting outcome available
        in this session.
    - metric: >-
        phase1_output_identical_between_planted_and_null: bitwise equality of the
        Phase-1 output on (A, b = As + e) and on (A, b uniform), over 200 pairs
      direction: different
      minimum_effect: >-
        Predicted 200/200 identical. Any single non-identical pair falsifies the
        objection and redirects the audit to find where the information enters.
    - metric: >-
        class_number h(Q(zeta_{2^k})) computed with Pari bnfinit for k = 4, 5, 6
        (degrees 8, 16, 32) and, if tractable, k = 7
      direction: higher
      minimum_effect: >-
        > 1 for at least one k <= 7. If h = 1 for all computed k, the "every ideal
        is principal" step is not obviously wrong at those sizes and the objection
        must be re-derived at the actual degree 256, where the computation is
        infeasible and only the h^+ / h^- decomposition argument remains. NO VALUE
        OF h^- IS ASSERTED IN THIS PROPOSAL; they are to be computed.
    - metric: >-
        end_to_end_secret_recovery_rate of the implemented pipeline on planted
        MLWE at n = 16, k = 2, q = 3329, 20 trials
      direction: lower
      minimum_effect: >-
        0/20 predicted. >= 1/20 falsifies the objection outright and converts this
        from an audit into the highest-priority research direction the program
        has.
    - metric: >-
        gamma_threshold_check: the ratio lambda_2 / lambda_1 of the ML-KEM-1024
        lattice under the Gaussian heuristic, versus the claimed gamma <= 21
      direction: different
      minimum_effect: >-
        A unique-shortest-vector recovery needs gamma below the gap lambda_2 /
        lambda_1, not below q/2. Under the Gaussian heuristic for the q-ary
        lattice at d = 2 n k, that gap is of order 10-20, not 1664.5. If the
        computed gap is below the claimed gamma_99% ~ 103, then the comparison
        "gamma <= 21 < q/2 = 1664.5" is against the wrong threshold and the
        conclusion does not follow even granting the number. THE GAP IS TO BE
        COMPUTED IN THE AUDIT from the actual FIPS 203 parameters, not taken from
        this proposal.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the audit. STAGE 0
      (reading, ~2 hours, zero compute): obtain the actual PDFs of Parts I-IV,
      quote Phase 1's reduction verbatim, and record whether the retrieved summary
      was faithful. If it was not, STOP and re-derive the objection against what
      the paper actually says. STAGE 1 (algebra, ~1 hour, zero compute): write the
      determinant-ideal derivation out in full and have it checked. STAGE 2
      (Pari/GP, minutes): compute determinant ideals for 200 random A at n = 8, 16,
      k = 2, q = 3329, in both the planted and the null arm, and compute
      h(Q(zeta_{2^k})) for k = 4, 5, 6 (+7 if tractable). STAGE 3 (Sage/Pari,
      hours): implement the summarised pipeline as faithfully as the text allows
      and run it end-to-end at n = 16, k = 2 on (a) planted MLWE, (b) the null
      instance, (c) the nearby-object control, a rank-1 principal ideal with a
      planted short generator where recovery MUST succeed.
    controls:
      - >-
        NULL-A (no secret). b drawn uniformly instead of As + e, everything else
        identical. FORCED VALUE DERIVED BEFORE THE RUN: Phase-1 output identical
        to the planted arm, because it is a function of (q, k, n) alone. This
        null CAN fail -- if the pipeline's Phase 1 reads b at all, the outputs
        differ -- so it is a null and not a decoration.
      - >-
        NULL-B (nearby object, positive control). Rank-1 principal ideal with a
        planted short generator, the classical CDPR target. Recovery MUST succeed
        here. If it does not, the implementation is broken and NO negative result
        from stages 2-3 may be reported. This is the sensitivity demonstration
        required by KN-TECH-1a5b7e obligation 3, its comparator is named, and its
        threshold is declared before the run: recovery rate >= 18/20.
      - >-
        NULL-C (graded, >= 3 interior points, monotonicity reported). Interpolate
        between NULL-B and the ML-KEM shape by increasing k = 1, 2 and by turning
        the modulus on/off, four cells total; report at which cell recovery dies
        and whether the transition is monotone. This localises the obstruction to
        a specific structural feature instead of leaving it as "it did not work".
      - >-
        ARCHIVE CHECK (zero compute). List every archived measurement of the same
        observable. NOT AVAILABLE -- the determinant-ideal observable is new to
        this program -- and that unavailability is recorded here rather than
        claimed as a passed check.
      - >-
        VERDICT-ON-THE-NULL-FIRST. The frozen decision rule is executed on NULL-A
        before the planted arm is looked at. If it emits the same label on both,
        the rule discriminates nothing and must be rewritten before the real arm
        is read.
    required_metrics:
      - verbatim quotation of Part IV Phase 1 with page reference, or a recorded statement that the PDF could not be obtained
      - number of distinct determinant ideals per arm, with the comparison method named
      - computed class numbers with the Pari command line and whether GRH was assumed
      - end-to-end recovery rate per arm, with seeds
      - computed lambda_2 / lambda_1 gap for ML-KEM-1024 under the Gaussian heuristic, with the formula used

  falsification_conditions:
    - >-
      Any single instance in which the Phase-1 output differs between the planted
      and the null arm. The headline objection is then wrong and must be withdrawn
      as a superseding record.
    - >-
      Any end-to-end recovery of a planted MLWE secret at n = 16, k = 2. The
      objection is then wrong at the tested scale and the program's priority
      changes completely.
    - >-
      The retrieved summary proves unfaithful and the real Phase 1 takes b as
      input. The objection does not apply and the audit must be redesigned; this
      is the most likely single failure of the proposal as written.
    - >-
      NULL-B fails. Nothing negative may be reported at all.

  confounders:
    - >-
      SECOND-HAND SOURCE. The entire objection is aimed at a paraphrase produced
      by a summarisation model from an HTML page. Stage 0 exists solely to remove
      this confounder and the audit must not proceed past it on the paraphrase.
    - >-
      DEFINITIONAL DRIFT. "Determinant ideal" may mean the Steinitz invariant, the
      product of elementary divisors, or the discriminant, and the objection's
      force differs between them. All three are to be computed and reported, not
      one.
    - >-
      SCALE. n = 8, 16 are toy. The determinant-ideal identity is an algebraic
      fact that does not depend on n, so the toy computation is a CHECK of a
      derivation rather than an extrapolation -- but the end-to-end arm at n = 16
      is a toy result and is labelled one.
    - >-
      AUTHORSHIP ASYMMETRY. Refuting an external claim is cheap to produce and
      reads as rigour. The audit is designed with a positive control and a
      falsification condition precisely so that a negative outcome costs something
      to reach.

  interpretation_limits:
    - >-
      A negative outcome closes the SUMMARISED PIPELINE, not the principal-ideal
      family, not the Part I-III mathematics (Weber verification and log-unit CVP
      may be entirely correct and independently interesting), and not the question
      of whether module structure helps. Forward guidance must name what remains
      open: any route that makes the PIP input instance-dependent, e.g. by
      attaching the ciphertext or the public key to the ideal rather than to the
      module's determinant.
    - >-
      NO STATUS CHANGE to KN-LIT-7650 or KN-LIT-1742 is proposed or implied. Those
      are Coordinator decisions and rule 12 is UNMET and UNWAIVED.
    - >-
      A positive outcome would be a claimed break of a standardised scheme and is
      automatically rule-12 routed to review-breakthrough at max.

  heuristic_assumptions:
    - id: H1
      statement: >-
        None load-bearing. The headline is an algebraic identity ([R^{2k} : M(A)]
        = q^{nk} and det_R M(A) = (q^k) for every A), not a distributional claim,
        and it is proved rather than assumed. This entry exists to record that the
        proposal is UNCONDITIONAL where its predecessors in this question were
        conditional, and that the only assumption is the faithfulness of the
        source (an evidentiary, not a mathematical, assumption).
      rigorous_support: >-
        Surjectivity of (x, y) -> y - A x mod q from R^{2k} onto (R/qR)^k with
        kernel M(A); |R/qR| = q^n. Both elementary.
      validation_plan: >-
        Direct computation at n = 8, 16, k = 2, q = 3329 over 200 random A, plus a
        symbolic check. Not a distributional validation and not presented as one.
    - id: H2
      statement: >-
        For the ML-KEM q-ary lattice at d = 2 n k, the ratio lambda_2 / lambda_1
        is given by the Gaussian heuristic applied to the lattice and by the
        planted vector's norm respectively.
      rigorous_support: >-
        The Gaussian heuristic is the standard heuristic for random q-ary
        lattices; it is named here because the gamma-threshold prediction depends
        on it and would be unsound stated as fact.
      validation_plan: >-
        Compute both quantities from the FIPS 203 parameters, and cross-check
        lambda_1 against the actual planted norm distribution at n = 16. Toy
        scale for the check, exact arithmetic for the heuristic evaluation.

  target_complexity:
    time_exponent: >-
      n/a for the audit itself (no algorithm is proposed). The CLAIM under audit
      is poly(n) quantum: O(n^3 log^2 n) gates, O(n^2 log n) qubits, as reported.
      If it survives, the exponent moved from 2^{0.292 beta} classical /
      2^{0.265 beta} quantum-sieve to polynomial, which is the largest possible
      result in this problem space and would make everything else in this session
      irrelevant. If it does not survive, the established position stands:
      approximation factor exp(Otilde(sqrt(n))) for the class-group line, far
      above deployed parameters.
    memory_exponent: >-
      As reported for the claim: O(n^2 log n) qubits and poly(n) classical bits.
      Not independently assessed.
    best_known: >-
      Classical primal/dual lattice attacks at 2^{0.292 beta + o(beta)} with the
      block sizes the estimator reports for ML-KEM under a named cost model.
    hidden_overhead: >-
      Not assessed; the audit does not reach the cost analysis unless the
      information objection fails first, which is the correct order of work --
      there is no point costing a pipeline that cannot read its input.
    tradeoff_note: n/a.

  dominated_by: >-
    n/a (no result claimed). This proposal claims no attack and no improvement;
    it proposes a check. On the QUESTION it audits, the incumbent frontier is
    KN-TECH-046's exp(Otilde(sqrt(n))) approximation factor for the
    class-group/unit-lattice line, which the audited claim asserts it beats. Rows
    checked for a prior refutation or confirmation of Part IV: the corpus
    (KN-LIT-7650, KN-LIT-1742, KN-TECH-046, KN-OPEN-012, KN-OPEN-026), the
    proposal ledger, and web searches on 2026-08-05 -- none found. Absence of a
    search result is not evidence that no refutation exists (AGENTS.md retrieval
    policy).
  sota_delta: >-
    No attack; conceptual and evidentiary contribution only. Quantitatively: the
    audit either (a) removes an unverified break claim from this program's
    citable knowledge base at a cost of about one day, or (b) identifies a
    polynomial-time quantum attack on ML-KEM, in which case the delta against the
    state of the art is the entire 2^{0.292 beta} classical baseline. The
    expected-value asymmetry between those two outcomes is the reason this is
    proposed despite a low prior on (b).

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.05 that the audited pipeline recovers an ML-KEM secret. The number is low
    and is not lower for stated reasons: three independent obstructions point the
    same way (the determinant ideal is constant; h = h^+ h^- and Weber's
    conjecture concerns h^+ only; a random rank-k module is not an ideal lattice),
    the claimed comparison of gamma against q/2 appears to use the wrong
    threshold, and a polynomial-time quantum attack on a standardised scheme with
    no independent confirmation nine months after posting is a strong negative
    signal. It is not 0.00 because every one of those three obstructions rests on
    a second-hand paraphrase of Phase 1, because the corpus's own record of the
    established position (KN-TECH-046) was ingested with the same bulk-seeding
    caveat as the papers it contradicts, and because DEC-20260803-64b55b records
    two occasions in one batch where this program's scouting was wrong in the
    direction that would have closed off work. 0.95 that the audit reaches a
    decisive reading, because Stage 1 is pen-and-paper and Stage 2 is minutes.
