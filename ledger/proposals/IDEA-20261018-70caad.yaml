idea:
  id: IDEA-20261018-70caad
  question_id: RQ-DREG-d7b6d6
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Generic-RHS pencil ceiling and an exhaustive b-line census: is the class-conditional Macaulay deficit
    distinguishable from random sigma-orbit unions at matched fibre size?
  class: measurement
  claim: >-
    Hand-derived, nothing executed. In the binary 2-decomposition system F_r(x1,x2)=b (x1,x2 in V, dim k) the curve
    is a right-hand side: M_d(b) is exactly affine in b, top-form data are b-independent, and r_d(b) <= rho_d (generic
    rank over F_2(t)) for every b. So no curve exceeds the ceiling; a classmate gains on rank over a typical one only
    if typical curves fall below it, otherwise gains come from fibre size s(b). At (N,k) = (9,5) and (11,6) all 2^N-1
    curves are enumerated. Claim: the class-conditional deficit rho_d - r_d(b) and the order-free Macaulay solving
    degree D_Mac (first d with r_d = N_d - HF_S(d); not grevlex solving degree) match sigma-orbit-union nulls after
    stratifying by s(b); a planted pseudo-class is flagged.
  mechanism: >-
    PAIR. R3 (bit coordinates of the 2-decomposition S_3 system); Sigma = right-hand-side translations b -> b+delta
    and the Galois action, not group translation. Trichotomy: coordinate-dependent. Lossy-projection test: the object
    (r_d, D_Mac, s) per curve drops generators and points; ranks are invariant under row and column operations and
    Galois-matched systems are isomorphic (IDEA-20261018-43e260), so the discard commutes with Sigma; many systems
    share it. Class sets come from one Walsh transform of the Kloosterman character; no canonicalisation.
    Factor base: polynomial window, KN-OPEN-020 not entered. Stage: relation decomposition degree.
  novelty_status: unverified
  citations:
    - {ref: IDEA-20261017-5f29b6, provenance: internal, claim: "notes: b enters as a constant, M_D(b) affine", verified_by: idea-generator}
    - {ref: IDEA-20261017-845d35, provenance: internal, claim: "probe: dimension-forced overlap needs a dimension-matched null", verified_by: idea-generator}
    - {ref: KN-FIND-006, provenance: internal, claim: "Semaev rank deficit against a support-matched null", verified_by: idea-generator}
    - {ref: "Kolchin; Brent-McKay", provenance: recalled, claim: "limiting corank law of random F_2 matrices", verified_by: null}
  assumptions:
    - No shell this session. Sizes (N_d, rows) are arithmetic; timeouts are unmeasured cells.
  proof_search_map:
    bottleneck: whether class membership shifts any order-free rank statistic beyond fibre size
    method_ceiling: detects constant-size class effects only (about 23 or 45 classes); no slope in N
  predictions:
    - metric: "rho_hat_d (max over b) against rho_d (one random point over F_65536)"
      direction: lower
      minimum_effect: "rho_hat_d <= rho_d, blocking; a strict gap is reported"
    - metric: "fraction of b attaining rho_hat_d, d <= 4"
      direction: higher
      minimum_effect: "at least 0.15 (corank-law value 0.29 per condition)"
    - metric: "classes with N2 percentile of mean deficit at most 0.05"
      direction: different
      minimum_effect: "null expects about 1 of 23; 5 or more with KS p below 0.01 is a class effect"
  minimal_test:
    design: >-
      Stage 0: block sizes, ceiling, rebuild M_d(b) from scratch for 20 b and compare bit-for-bit with the affine
      formula. Stage 1: N=9, k=5, all 511 b, d up to 10, 8 targets r, D_Mac exact. Stage 2: N=11, k=6, all 2047 b,
      d <= 6, D_Mac right-censored. Classes from K level sets. Nulls: N1 random unions of full sigma-orbits,
      N2 resampling matched on (orbit size, s), N3 random bilinear pencil of the same shape and affine rank.
    controls: [N1, N2, N3, planted pseudo-classes by s and by deficit, a second V, 8 targets r]
    required_metrics: [rho_d, rho_hat_d, r_d, deficit, D_Mac, s, class sizes, percentiles, KS p, unmeasured cells]
  falsification_conditions:
    - Rebuilt matrix differs from the affine formula or rho_hat exceeds rho. Instrument bug, stop.
    - Planted pseudo-classes not flagged at percentile 0.025. No power, cell inconclusive.
    - Fewer than 5 extreme classes and KS p above 0.01. No class effect at tested N, closes only these cells.
  confounders:
    - Fixed (V,r) mixes curve and factor-base position; sigma-orbit members are not isomorphic here.
    - Subfield b (F_8 at N=9) and b=1 are symmetric and listed apart; censored D_Mac is unmeasured.
  interpretation_limits:
    - Tests whether any class advantage exists at fixed N (necessary for condition 2); no growth, no exponent.
    - Walk not charged (no attack claimed); scan cost is priced in IDEA-20261018-3f16fc.
  heuristic_assumptions:
    - id: H1
      statement: >-
        After removing dimension-forced rank, the deficit over b in F_2^N follows the limiting corank law of a uniform
        random F_2 matrix, P(c) = alpha 2^{-c^2}/prod_{i<=c}(1-2^{-i})^2, alpha about 0.2888.
      rigorous_support: Classical limiting corank law (Kolchin; Brent-McKay, recalled).
      validation_plan: >-
        Histogram of the deficit over all b at N=9 and 11 against the law (chi-square, tail merged at c >= 3) and
        against the N3 pencil; no transfer past N=13.
    - id: H2
      statement: Given orbit structure and s(b), class membership is exchangeable with respect to the deficit (the null).
      rigorous_support: K has Fourier coefficients of modulus 1 (derived); Katz equidistribution (recalled).
      validation_plan: Planted pseudo-classes and a KS test of the percentile list; reject only on the stated rule.
  target_complexity:
    time_exponent: measurement only, (2^N - 1) Macaulay ranks of about 3300 x 1600 bits (N=11, d=5)
    memory_exponent: one such matrix, about 1 MB
    best_known: Pollard rho about 2^{N/2}; no algorithm claimed
    hidden_overhead: none; unfinished cells are unmeasured
  estimated_cost: {implementation: medium, compute: medium}
  recommended_priority: medium
