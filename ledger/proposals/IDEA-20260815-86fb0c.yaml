idea:
  id: IDEA-20260815-86fb0c
  question_id: RQ-CSIDH-64343f
  added: '2026-08-15'
  title: >-
    RECONSTRUCT EVERY PUBLISHED CSIDH QUANTUM COST MODEL OVER ONE
    PARAMETERIZATION AND REPORT WHERE THEY DISAGREE, BECAUSE THE DISPUTE IS
    ABOUT MODELLING CHOICES AND NOBODY HAS ISOLATED WHICH CHOICE DRIVES IT
  class: cost-model

  claim: >-
    CSIDH's quantum security estimates differ by orders of magnitude across
    published analyses. The disagreement is usually attributed to 'different
    assumptions' without saying which. Reconstructing each model over one
    fixed parameterization and varying one modelling choice at a time
    isolates the driver, which is the only way the dispute can be settled
    rather than restated.

  mechanism: >-
    Enumerate the modelling choices each analysis makes: oracle cost, query
    count, gate versus depth accounting, error-correction overhead,
    collimation strategy. Implement one harness parameterized by all of
    them. Reproduce each published estimate as a setting, then vary one
    choice at a time and rank by estimate movement.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-CSIDH-001 objective; grep 'Kuperberg' (44),
      'collimation' (19), 'dihedral coset' (13), 'resource estimate' (20).
    results: >-
      The goal names this reconstruction as its objective. The individual
      analyses are published; no record reproduces them in one harness or
      ranks the modelling choices by influence.
    verdict: >-
      ADAPTATION. Every analysis is published; the contribution is one
      harness reproducing all of them and a sensitivity ranking of the
      choices.

  object_first_candidate:
    tracked_object: >-
      THE PUBLISHED ESTIMATE as a function of its modelling choices,
      rather than as a number attached to a paper.
    lossiness: >-
      Reducing an analysis to a setting vector discards its prose
      reasoning, which is why failure to reproduce is itself a reported
      outcome rather than an error to be tuned away.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while each analysis states its choices explicitly enough to
      reproduce; analyses that cannot be reproduced are reported
      unreproducible, which is a finding about the literature.

  null_object_control: >-
    NULL 1 -- each published estimate reproduced at its own stated settings,
    which is the blocking calibration; an analysis that cannot be reproduced
    within its stated error is reported as such and excluded from the
    ranking. NULL 2 -- a setting where all analyses should agree (e.g. free
    error correction, unit oracle cost), which must collapse the spread; if
    it does not, the harness is not capturing the choices.

  discriminated_from:
    - >-
        The individual published CSIDH cost analyses, each deeper within
        its own framework and incomparable across frameworks.
    - >-
        GOAL-QALG-001's quantum mechanism search, which asks whether an
        exponent-moving quantum mechanism exists; this record costs
        existing ones and proposes no mechanism.

  assumptions:
    - >-
        Each analysis states its modelling choices explicitly enough to
        reproduce. Where it does not, the analysis is excluded and that
        exclusion is reported.
    - >-
        The choices are separable enough for one-at-a-time variation to be
        meaningful; interacting choices are reported as such rather than
        forced apart.

  predictions:
    - metric: >-
        reproduction of each published estimate at its stated settings
      direction: different
      minimum_effect: >-
        FORCED within the analysis's own stated error; failure excludes
        it from the ranking and is reported.
    - metric: >-
        agreement setting where all models should collapse
      direction: different
      minimum_effect: >-
        FORCED to collapse the spread; failure means the harness is not
        capturing the choices.
    - metric: >-
        ranking of choices by estimate movement
      direction: different
      minimum_effect: >-
        The deliverable: which single modelling choice drives the
        orders-of-magnitude dispute.

  minimal_test:
    design: >-
      Two published analyses, all their stated choices, both nulls. Enough
      to see whether one choice dominates the disagreement.
    controls:
      - >-
          Per-analysis reproduction at stated settings, blocking.
      - >-
          Collapse setting where models must agree.
      - >-
          Unreproducible analyses excluded and listed.
      - >-
          Interacting choices reported rather than forced independent.
    required_metrics:
      - >-
          Reproduction agreement per analysis.
      - >-
          Estimate per setting vector.
      - >-
          Ranking of choices by movement.
      - >-
          List of unreproducible analyses.

  falsification_conditions:
    - >-
        An analysis cannot be reproduced at its stated settings. Excluded
        and reported as unreproducible.
    - >-
        The collapse setting does not collapse. Harness not capturing the
        choices; halt.
    - >-
        One choice dominates the dispute. The disagreement is about that
        choice and can be argued directly -- the record's payoff.
    - >-
        No single choice dominates. The dispute is genuinely multi-factor
        and must be reported that way rather than simplified.

  confounders:
    - >-
        REPRODUCTION AMBIGUITY: published analyses state choices at
        varying precision, and filling a gap with a plausible value
        silently attributes a choice to an author who did not make it.
    - >-
        HARDWARE-MODEL COUPLING: error-correction overhead and gate
        accounting interact, so one-at-a-time variation may misattribute
        movement.

  interpretation_limits:
    - >-
        Reproduces and compares published cost models; proposes no attack
        and makes no security claim about CSIDH.
    - >-
        Scoped to the reproduced analyses and stated choices.
    - >-
        A ranking identifies where the dispute lives; it does not resolve
        which choice is correct.

  heuristic_assumptions:
    - id: HEUR-CSIDH-SEP-1
      statement: >-
        The modelling choices distinguishing published CSIDH cost
        analyses are separable, so one-at-a-time variation attributes
        the estimate spread to individual choices.
      rigorous_support: >-
        Rigorous ingredient: each choice is a distinct, separately
        stated parameter of the cost pipeline in its own publication.
        THE GAP: error-correction overhead, gate-versus-depth accounting
        and collimation strategy are known to interact, so a one-at-a-
        time ranking can misattribute movement that only appears
        jointly.
      falsification_condition: >-
        A pairwise variation whose joint effect differs materially from
        the sum of its one-at-a-time effects.
      validation_plan: >-
        SAMPLE: all single variations plus all pairwise for the top
        three ranked choices. COMPARISON: joint effect against additive
        prediction. TAIL CHECK: the pairs with the largest interaction,
        reported explicitly. TRANSFER: none beyond the reproduced
        analyses.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is symbolic reconstruction plus numeric
      evaluation per setting vector.
    memory_exponent: >-
      Negligible; no quantum simulation is performed.
    best_known: >-
      Incumbents are the published CSIDH quantum cost analyses, reproduced
      here and not improved.
    hidden_overhead: >-
      Filling under-specified choices is the dominant hidden risk and
      every filled value must be recorded as an attribution the source did
      not make.
    tradeoff_note: >-
      Reproducing many analyses buys comparability and costs fidelity to
      each one's prose reasoning.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As cost analyses: dominated by the published
    works. As a reproduction-and-ranking harness: none exists here. Not null
    on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: one harness reproducing
    multiple published CSIDH estimates, a ranking of which modelling choice
    drives their orders-of-magnitude disagreement, and an explicit list of
    analyses that cannot be reproduced from what they state.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.5 that two analyses are reproducible within their stated error, which
    is the binding risk and itself a finding either way. 0.85 that the
    collapse null behaves. 0.55 that one choice dominates the spread, which
    would let the dispute be argued directly.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-CSIDH-64343f
    - GOAL-CSIDH-001
    - KN-OPEN-014
    - GOAL-QALG-001
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
