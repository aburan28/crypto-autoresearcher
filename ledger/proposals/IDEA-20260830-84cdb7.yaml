    - ref: IDEA-20260808-afe4ce
      provenance: internal
      claim: >-
        Claims the prime-field last-fall-degree FLOOR d_lf >= B for any
        set-theoretically described factor base, because the membership
        generators contribute nothing to any graded piece below their own
        degree B, and enumerates its escapes as "(E1) descriptions that are not
        principal in F_p[x] - i.e. V realised as a projection from a
        higher-dimensional variety of low degree, which is precisely what Weil
        descent achieves and what F_p lacks a mechanism for; (E2)
        target-dependent descriptions; (E3) solvers that do not build the ideal
        at all". Its own confounder list already concedes that "the floor
        argument assumes J is generated in degree B, true for a set-theoretic V
        but false if V is defined by additional structure in an extension ring;
        escape (E1) is exactly this and is not refuted here". This record
        instantiates E1 over F_p itself rather than in an extension ring.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-30), file
