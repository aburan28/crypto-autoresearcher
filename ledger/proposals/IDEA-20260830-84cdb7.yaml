idea:
  id: IDEA-20260830-84cdb7
  question_id: RQ-SDEG-001
  added: '2026-08-30'
  title: >-
    PRIME FIELDS DO HAVE THE MISSING INGREDIENT AND IT IS THE BASE-d DIGIT MAP -
    writing x = a_0 + a_1 d + ... + a_{s-1} d^{s-1} realizes the interval factor
    base as a LINEAR projection of a variety of degree d in s auxiliary
    variables, so the Bezout obstruction of catalogue A1-11 (which bounds only
    descriptions in the SAME variables) and the last-fall-degree FLOOR d_lf >= B
    of IDEA-20260808-afe4ce (which needs membership generators of degree B) both
    evaporate, membership drops to degree 2 at d = 2, and the prime-field
    decomposition system acquires exactly the shape of the binary Weil-descent
    system whose first-fall-degree assumption KN-LIT-7607 says is unlikely to
    hold - so MEASURE IT, because a first fall degree bounded in s would give
    conditional index calculus at time N^{2/(m+1)+o(1)} beating rho for m >= 4,
    and a first fall degree growing like ms/2 closes the last named escape in
    this lane with a number instead of a verdict
  class: representation

  claim: >-
    (A) THE CONSTRUCTION. Fix a prime p, an integer base d >= 2 and a digit
    length s with d^s <= p. Identify each element of F_p with its integer
    representative in [0, p). Let the factor base be
    V = {x in [0, d^s) such that f(x) is a square in F_p}, so |V| is about
    d^s / 2. Introduce, for each decomposition unknown k = 1..m, digit variables
    a_{k,0},...,a_{k,s-1} and impose
    prod_{j=0}^{d-1} (a_{k,i} - j) = 0 for every i,
    together with the LINEAR substitution x_k = sum_i a_{k,i} d^i. The
    decomposition system is
    D_R = ( S_{m+1}(x_1,...,x_m, xR) with each x_k replaced by its digit form,
    together with the ms membership generators above ),
    in ms variables over F_p, with ms generators of degree EXACTLY d and one
    generator of total degree 2m (degree 2 in each x_k, and each x_k is LINEAR
    in its digits). At d = 2 the membership generators are a(a-1) = 0 -
    literally boolean field equations, over a PRIME field.
    (B) WHAT THIS DEFEATS, PRECISELY AND WITH THE RECORDS NAMED. Catalogue entry
    A1-11 states that over F_p membership must be imposed as extra equations
    and that "by Bezout any PLANE predicate cutting out B points has degree at
    least B/3", concluding that prime fields lack the restriction-of-scalars
    ingredient and that the substitute "would have to be a ring-theoretic rather
    than field-theoretic decomposition of F_p (writing x = x_1 + x_2 2^k, which
    is exactly what interval / small height bases attempt and exactly why they
    admit no bounded-degree algebraic description)". The Bezout bound is
    correct and is NOT contradicted here - it bounds the degree of a description
    IN THE SAME NUMBER OF VARIABLES. It says nothing about a description with
    AUXILIARY VARIABLES, and the digit map supplies one - the interval is the
    image under a LINEAR map of the degree-d complete intersection
    {prod_j (a_i - j) = 0}_i in A^s, whose description degree is d = B^{1/s},
    SUBLINEAR in B for every s >= 2 and CONSTANT in B along the ladder d fixed,
    s growing. IDEA-20260808-afe4ce's floor d_lf >= B is likewise not
    contradicted - it is a theorem about membership generators of degree B, and
    afe4ce itself names its first escape as "(E1) descriptions that are not
    principal in F_p[x] - i.e. V realised as a projection from a
    higher-dimensional variety of low degree, which is precisely what Weil
    descent achieves and what F_p lacks a mechanism for". THIS RECORD EXHIBITS
    THE MECHANISM F_p WAS SAID TO LACK, and its first deliverable is that
    exhibition, which costs zero compute and is checkable by inspection.
    (C) WHAT THIS DOES NOT DEFEAT, STATED HERE RATHER THAN DISCOVERED LATER.
    The digit map is defined by INTEGER representatives, so it is Archimedean
    and not F_p-intrinsic - the interval is not closed under addition, there is
    no subfield, and the count of equations does NOT multiply the way Weil
    restriction multiplies one F_{q^n}-equation into n F_q-equations. Here one
    summation equation stays ONE equation. So the descended system is
    UNDERDETERMINED in the summation part where the extension-field system is
    overdetermined, and that is the residual disanalogy this record makes
    explicit and does not remove. Also, the membership generators cut out the
    INTERVAL, not the factor base - x in [0,d^s) does not imply f(x) is a
    square - so solutions must either be filtered afterwards (roughly half
    survive) or the curve condition must be added as y_k^2 = f(x_k) with y_k a
    plain F_p variable, a generator of total degree 3. Both variants are run and
    reported; neither is assumed away.
    (D) THE MEASUREMENT AND ITS THREE PRE-REGISTERED OUTCOMES. The quantity is
    d_ff(m, d, s), the first fall degree of D_R, measured by exact graded rank
    over F_p degree by degree with no CAS termination event, on the ladder d
    fixed and s growing. Under the semi-regular null the membership generators
    form a complete intersection with Hilbert series
    ((1 + z + ... + z^{d-1})^{ms}) and the single summation generator of degree
    2m perturbs it by one shifted subtraction, giving
    d_reg = ceil((ms(d-1) + 2m)/2), LINEAR IN s with slope m(d-1)/2 - the exact
    analogue, in this presentation, of the closed form
    IDEA-20260808-093497 derived for the fV presentation, and reduced to slope
    m/2 in s at d = 2. OUTCOME 1, d_ff grows with slope indistinguishable from
    m(d-1)/2 in s - the digit presentation is semi-regular, the first fall
    degree assumption fails over prime fields exactly as KN-LIT-7607 reports it
    likely fails over binary ones, the last named escape of this lane is closed
    WITH A MEASURED SLOPE AND A CONFIDENCE INTERVAL rather than a verdict, and
    RQ-SDEG-001 gets a real scaling law in a non-degenerate presentation.
    OUTCOME 2, d_ff grows sublinearly in s with fitted exponent gamma in (0,1) -
    a genuine collapse, quantified, that is not yet enough; report gamma with
    its CI and the resulting cost exponent. OUTCOME 3, d_ff is BOUNDED in s -
    then, conditional on Heuristic H1 below and on nothing else being wrong, the
    decomposition oracle costs binom(ms + D, D)^omega, polynomial in
    m log_d B and hence in log N, index calculus at arity m costs
    N^{2/(m+1) + o(1)} time and N^{1/(m+1) + o(1)} memory, and that BEATS
    Pollard rho's N^{1/2} for every m >= 4 - N^{0.4} at m = 4 and N^{1/3} at
    m = 5. Outcome 3 is a long shot and is priced as one; what makes this
    record worth running is that Outcomes 1 and 2 are both decision-bearing for
    RQ-SDEG-001 and that no presentation currently in this lane can produce
    either, because the fV presentation's floor forces the answer before the
    measurement starts.

  mechanism: >-
    WHY THE PRESENTATION CAN MATTER AT ALL, WHICH IS THE LOAD-BEARING POINT.
    The digit substitution is a bijection between [0,d^s) and the valid digit
    tuples, so it changes NO ideal, NO variety, NO solution count, and NO
    ideal-theoretic invariant. It is a change of coordinates. It nevertheless
    changes the measured first fall degree, and it can do so ONLY because the
    first fall degree, the solving degree and the graded Macaulay rank
    filtration are invariants of the GENERATING SET rather than of the ideal -
    the fact that IDEA-20260830-ad0be4 states, proves in one line and tests. So
    this record and ad0be4 stand or fall together in a precise sense - if
    ad0be4's Outcome I holds and no generator-level observable in this lane
    carries information, then this record's ladder measures nothing either; if
    ad0be4's Outcome II holds, this record is the presentation in which the
    measurement is not pre-decided by a degree floor.
    LOSSY-PROJECTION TEST, APPLIED AND REPORTED AS FAILED. The protocol's test
    is applied to the digit vector as a tracked object and IT FAILS - the map
    x maps to (a_0,...,a_{s-1}) is BIJECTIVE on the interval, so it discards
    nothing, and by the protocol's own worked example (the pair (x1+x2, x1 x2),
    worthless because the unordered pair is recoverable as the roots of a
    quadratic, KN-LIT-7595) a projection that loses nothing is a change of
    coordinates and not a new object. This is stated rather than hidden, and it
    is the reason this record is classed REPRESENTATION and not MECHANISM. The
    record is non-vacuous anyway, for a reason the protocol's section 2 does not
    cover - section 2 governs TRACKED OBJECTS, whose value is that they
    propagate with less information than the state; the value here is not
    propagation but PRESENTATION, and presentation-dependence is exactly what
    the target quantity has. Anyone who rejects this record on lossy-projection
    grounds is also committed to rejecting the entire Weil-descent literature,
    since Weil restriction is likewise a lossless change of coordinates that
    changes the solving degree.
    THE ONE-STEP PROPAGATION, DEFINED SO IT CAN BE MEASURED. As in ad0be4, the
    measured object is the graded piece V_D of the ideal generated so far,
    V_{D+1} contains S_1 times V_D, and the FALL is the first degree D at which
    dim V_D exceeds dim(S_1 times V_{D-1}) plus the count of generators of
    degree exactly D - equivalently the first degree at which a non-trivial
    syzygy produces an element whose leading form drops. That is a definition in
    exact linear algebra, computable, and it does not depend on any solver's
    internal strategy.
    WHY d AND s MUST BOTH BE LADDERS. Holding d fixed and growing s grows B
    exponentially while holding the generator degrees FIXED - that is the
    regime the binary-field literature lives in and the regime the first fall
    degree assumption is about. Holding s fixed and growing d recovers, at
    s = 1, exactly the fV presentation with membership degree d = B, which is
    the BASELINE EMBEDDING - so the two presentations are not rivals but two
    ends of one two-parameter family, and the ladder passes continuously
    between them. That embedding is what makes this a family extension rather
    than a change of subject, and it is checkable at s = 1 by exact equality
    with the existing instrument.
    WHY THE EXPONENT STAKE IS REAL AND WHERE IT IS CONDITIONAL. With a
    decomposition oracle of cost C per target, a factor base of size B, arity m
    and group order N, the standard accounting is - success probability about
    B^m/(m! N) per target, so about m! N / B^{m-1} charged trials to collect B
    relations, plus sparse linear algebra about B^2, optimised at
    B = (m! C N)^{1/(m+1)} for a total about 2 (m! C N)^{2/(m+1)}. With C
    polynomial in log N that is N^{2/(m+1)+o(1)}, which is below N^{1/2} exactly
    when m >= 4. With C = B^{m-1}, the unconditional enumerative oracle, the
    same accounting gives nothing better than N^{1/2}, which is why the whole
    question reduces to whether C can be polylogarithmic - and C polylog is
    exactly Outcome 3. The conditionality is total and is stated in H1; nothing
    here is claimed unconditionally, and the incumbent literature this program
    already records (KN-LIT-7607) reports the analogous assumption as unlikely
    to hold in a related setting, which is the honest prior.

  novelty_status: unverified

  citations:
    - ref: 'ideas/catalogue-20260805/A1-index-calculus.md (entries A1-11, A1-12)'
      provenance: internal
      claim: >-
        A1-11 claims that the absence of restriction of scalars is the SINGLE
        structural disanalogy between extension-field and prime-field index
        calculus; that over F_p membership must be imposed as extra equations
        and by Bezout any PLANE predicate cutting out B points has degree at
        least B/3; and that the substitute "would have to be a ring-theoretic
        rather than field-theoretic decomposition of F_p (writing
        x = x_1 + x_2 2^k, which is exactly what interval / small height bases
        attempt and exactly why they admit no bounded-degree algebraic
        description)". A1-11's own falsifier is "a second, independent
        disanalogy is exhibited, since the claim is that this is the single
        one". A1-12 lists "interval on x" as a row of its predicate menu and
        states that its falsifier would be "a menu row with |F| about N^{1/4},
        polylog SLP length, and system degree O(1)".
      verified_by: >-
        Read this session (Read tool, 2026-08-30) at lines 630-730 of
