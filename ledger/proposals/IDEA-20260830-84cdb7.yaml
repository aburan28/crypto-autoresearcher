    - ref: KN-LIT-7607
      provenance: internal
      claim: >-
        Huang, Kosters and Yeo, "Last fall degree, HFE, and Weil descent
        attacks on ECDLP" (CRYPTO 2015 / ePrint 2015/573). The corpus record
        states that the last fall degree is monomial-order-independent; that
        quasi-polynomial claims against HFE and subexponential claims for the
        ECDLP depend on the FIRST FALL DEGREE ASSUMPTION, namely that the first
        fall degree does not depend on n; and that the authors construct a Weil
        descent system from summation polynomials IN WHICH THAT ASSUMPTION IS
        UNLIKELY TO HOLD. It carries a standing consequence - no proposal may
        claim as new that Weil-descended Semaev systems violate the semi-regular
        prediction, or that the deficit is bounded in system size, without
        citing this entry and KN-LIT-7605 and stating what it adds. THIS RECORD
        MAKES NEITHER CLAIM. It works over a PRIME field with a digit
        presentation that is not a Weil descent, it claims no deficit, and it
        adopts KN-LIT-7607's reported doubt as its own honest prior - the
