  assumptions:
    - >-
      p > 3, E non-singular short Weierstrass over F_p, and d^s <= p so the
      digit representation is unique. Uniqueness is checked, not assumed.
    - >-
      Membership generators prod_j (a - j) have DISTINCT roots 0..d-1 in F_p,
      which requires d <= p. Consequently the digit quotient is still a product
      of fields and the decomposition ideal is still RADICAL - this record does
      NOT claim to escape IDEA-20260829-bdca13's radicality theorem and says so
      in its citations.
    - >-
      Graded ranks are computed by exact linear algebra over F_p, never inferred
      from a CAS termination event.
    - >-
      The exponent accounting in claim (D) uses the standard index-calculus
      balance with sparse linear algebra at B^2 and per-target success
      probability B^m/(m! N). Both are declared modelling choices, both are
      standard in this corpus, and neither is established here.
    - >-
      Outcome 3's cost statement is CONDITIONAL ON H1 and is never asserted
      unconditionally anywhere in this record or in any summary of it.

  proof_search_map:
    bottleneck: >-
      The membership generator degree. In the fV presentation it is B, which
      forces d_lf >= B (afe4ce) and therefore forces a Macaulay column count of
      at least binom(B+m, m), which by 093497's accounting puts the algebraic
      oracle a factor B^{m(omega-1)+1} above plain enumeration. Removing that
      one number - replacing degree B by degree d with s auxiliary variables -
      is the single step whose removal changes the cost model's exponent, and
      nothing else in the pipeline changes.
    baseline_embedding:
      parameter_slice: >-
        s = 1. Then there are no auxiliary variables, d = B, the membership
        generator is a single univariate polynomial of degree B whose roots are
        the factor base, and D_R IS the fV-presented system of
        harness.semaev.measure_s3_decomposition and of 093497. The null formula
        ceil((ms(d-1) + 2m)/2) reduces at s = 1, m = 2, d = B to
        ceil((2(B-1) + 4)/2) = B + 1, which is 093497's ceil((m(B-1)+D_S)/2)
        with D_S = 4. The two presentations are the two ends of one
        two-parameter family and the embedding is EXACT, not similar.
      reproduction_check: >-
        Symbolic and frozen. (i) Symbolically verify that substituting s = 1
        reproduces the existing generator list term for term. (ii) Frozen
        regression fixture - take an existing committed EXP-SEMAEV-family run's
        instance, seed, factor base and target, run it through the digit
        pipeline at s = 1, and require the graded rank filtration and the
        reduced Groebner basis to match the existing instrument EXACTLY. Any
        mismatch halts the line and is an instrument finding, not a result.
    observation_collision:
      observable: >-
        d_ff(m, d, s), the first fall degree, defined as the least D at which
        dim V_D exceeds dim(S_1 times V_{D-1}) plus the number of generators of
        degree exactly D.
      distinct_preimage_search: >-
        REQUIRED AND RUN AS A BLOCKING ARM. Construct a system with the SAME
        d_ff and a different ground truth - specifically, replace the digit-
        substituted summation generator by a uniformly random polynomial with
        the SAME multidegree support in the digit variables, keeping every
        membership generator. If d_ff agrees, the observable carries no
        summation-polynomial information in this presentation either and every
        conclusion is bounded accordingly; this is 093497's null carried over
        and it is the minimum. A SECOND and sharper collision search is
        available here and is also run - the SAME curve and target presented at
        two different (d, s) pairs with the same d^s, e.g. (d,s) = (2,6) and
        (4,3) and (8,2) at B = 64. These have the IDENTICAL ideal up to the
        coordinate change and identical solution sets, so any difference in
        d_ff is purely presentational and quantifies exactly how much of the
        measured degree is an artifact of the chosen base.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the decomposition condition from a univariate degree-B
          membership predicate to a degree-d complete intersection in s
          auxiliary variables composed with a LINEAR projection. Obligations
          discharged separately - ENCODING, the digit map is a bijection on
          [0,d^s) and the substitution is linear, checked symbolically;
          COMPLETENESS, every interval element has a digit tuple and conversely,
          so no solution is lost; SOUNDNESS, solutions with f(x) a non-square
          are NOT decompositions and are removed either by the y^2 = f(x)
          variant or by post-filtering, with the surviving fraction reported;
          TRANSFER, the construction needs integer representatives and does not
          exist in a field without a distinguished set of representatives, which
          is the residual disanalogy of claim (C); COST LOSS, none in the
          reduction itself, but the system gains ms variables in place of m,
          which is charged in the Macaulay column count and is the reason the
          memory envelope below is stated in binomial coefficients.
        predicted_gain: >-
          Converts the measured degree from a quantity floored at B by the
          encoding into a quantity that can, in principle, be bounded - which
          is the difference between a measurement whose answer is forced before
          it runs and one whose answer is not. CONDITIONAL on Outcome 3 the
          gain is an exponent, N^{2/(m+1)+o(1)} against rho's N^{1/2}, for
          m >= 4; unconditionally the gain is a measurable slope.
      - transform: boundary_lift
        proposed_object: >-
          Treat the fV presentation as the s = 1 BOUNDARY of the family and ask
          for a strict inward improvement, i.e. whether d_ff at s = 2 is
          strictly below d_ff at s = 1 on the same instance with the same B.
          This is a paired within-instance comparison, not a curve that looks
          similar to a baseline.
        predicted_gain: >-
          A single signed integer per instance, with a paired confidence
          interval, that says whether the family extension improves the
          quantity it was built to improve. A non-negative median here would
          mean the whole family gains nothing and the record's premise is
          measurably wrong at the cheapest possible cell.
    quantifier_order: >-
      CLAIMED, AND THE ORDER IS THE WHOLE ISSUE.
      Outcome 3 as a HOPE, stated so it cannot be smuggled - EXISTS a constant
      D such that FORALL m in the tested range, FORALL d in the tested range,
      FORALL s, FORALL primes p with d^s <= p, FORALL curves and targets in the
      tested families, d_ff(m,d,s) <= D. Note that D may NOT depend on s; a
      bound that quietly depends on s is exactly the failure mode the first fall
      degree assumption names, and any fitted bound is reported with its
      s-dependence explicit.
      The dangerous weaker reading, NOT claimed and vacuous - FORALL (m,d,s)
      EXISTS D with d_ff <= D, which is true because d_ff is always finite.
      MEASURED, and this is what the experiment actually establishes - FORALL
      cells in the declared ladder, the fitted slope of d_ff against s at fixed
      d, with a confidence interval, together with the number of cells not
      computable within the memory contract.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Over the tested (m, d, s, p, curve) ladder and the frozen exact-rank
        convention, the first fall degree of the digit-presented prime-field
        decomposition system grows with s at fitted slope beta with confidence
        interval I." It can NEVER certify a bound uniform in s from bounded s,
        can never certify anything about a production F4 or F5's internal
        degrees, can never certify a relation yield or a coverage statement,
        and can never by itself certify an index-calculus exponent - Outcome 3
        would license only a CONDITIONAL statement, tagged with H1, requiring
        separate evidence for yield, for the linear algebra, and for the
        filtering fraction.
      nearby_object_control: >-
        THE RANDOM-CURVE-FREE NEARBY OBJECT, and it is blocking. Replace the
        summation generator by a random polynomial of the same multidegree
        support in the digit variables while keeping the membership generators.
        If d_ff behaves identically, the method is measuring the digit
        membership structure and not the elliptic curve, and every conclusion is
        about complete intersections of degree-d univariates, not about the
        ECDLP. A SECOND nearby object, and it is the one that would most
        cleanly expose a false positive - the SAME construction over a
        NON-CURVE cubic, i.e. a random cubic f with no group law, where the
        summation polynomial is replaced by a random polynomial of the same
        shape. Outcome 3 appearing there too would mean the collapse is a
        property of digit-membership systems in general and has nothing to do
        with elliptic curves, which would be a real result but a completely
        different one.
    proof_obligations:
      - claim: >-
          The digit substitution is a bijection on [0,d^s) and the s = 1 slice
          reproduces the existing fV system exactly.
        responsibility: baseline
      - claim: >-
          Membership generators of degree d with distinct roots give a complete
          intersection with Hilbert series (1 + ... + z^{d-1})^{ms}.
        responsibility: correctness
      - claim: >-
          The semi-regular null for the full system is
          ceil((ms(d-1) + 2m)/2), reducing to 093497's formula at s = 1.
        responsibility: baseline
      - claim: >-
          Solutions with f(x) a non-square are removed, and the surviving
          fraction is measured rather than assumed to be one half.
        responsibility: soundness
      - claim: >-
          The measured d_ff is a graded-rank threshold and not a CAS
          termination event.
        responsibility: correctness
      - claim: >-
          The support-matched null and the non-curve nearby object do NOT
          reproduce the measured behaviour.
        responsibility: interface
      - claim: >-
          The index-calculus balance B = (m! C N)^{1/(m+1)} and total
          2(m! C N)^{2/(m+1)} is arithmetic given the stated model.
        responsibility: runtime
      - claim: >-
          Every Macaulay matrix built stays inside the declared column and
          memory contract, enforced by a pre-flight count that aborts before
          allocation.
        responsibility: memory
      - claim: >-
          Outcome 3, if observed at bounded s, is reported as CONDITIONAL and
          not extrapolated to unbounded s.
        responsibility: scope

  predictions:
    - metric: >-
        exact agreement of the digit pipeline at s = 1 with the existing
        fV-presented instrument on a frozen fixture
      direction: different
      minimum_effect: >-
        FORCED EXACT - identical generator list after symbolic expansion,
        identical graded rank filtration, identical reduced Groebner basis.
        A single mismatch halts the line as an instrument failure and no other
        number from the run is admissible.
    - metric: >-
        fitted slope of d_ff against s at fixed d = 2, m = 2
      direction: different
      minimum_effect: >-
        THE HONEST PRIOR IS OUTCOME 1 and the pre-registered decision rule has
        three branches, resolvable at slope resolution 0.25 with the declared
        ladder s in {1,2,3,4,5}. OUTCOME 1 when the fitted slope's 95 percent
        CI contains m/2 = 1 and excludes 0.5. OUTCOME 2 when the CI lies
        strictly inside (0.1, 0.9). OUTCOME 3 when the CI contains 0 and
        excludes 0.25, i.e. d_ff is flat across at least four consecutive s.
        An interval spanning two branches is reported as unresolved and the
        ladder is extended only if the memory contract permits.
    - metric: >-
        paired within-instance difference d_ff(s=1) minus d_ff(s=2) at matched
        B, the boundary-lift comparison
      direction: higher
      minimum_effect: >-
        PREDICTED STRICTLY POSITIVE with a paired median of at least 1 and a
        bootstrap CI excluding 0, because the s = 1 membership generator has
        degree B while the s = 2 generators have degree sqrt(B). A median of
        0 or below means the family extension does not even move the quantity
        at its cheapest cell, the record's premise is measurably wrong, and the
        ladder should not be run further.
    - metric: >-
        d_ff of the support-matched random-generator null against d_ff of the
        digit-substituted Semaev generator, same membership generators
      direction: different
      minimum_effect: >-
        NO DIRECTION PRE-COMMITTED. If the two agree at every cell of the
        ladder, the observable carries no summation-polynomial information in
        this presentation and every conclusion is about degree-d complete
        intersections; that is a controlled null and it is reported as one. A
        difference of at least 1 in at least 20 percent of cells, in a
        consistent direction in at least two thirds of those, is the threshold
        for calling it curve-specific.
    - metric: >-
        d_ff across (d,s) pairs with equal d^s, e.g. (2,6), (4,3), (8,2) at
        B = 64
      direction: different
      minimum_effect: >-
        REPORTED AS THE PRESENTATIONAL ARTIFACT BUDGET. The three cells have
        the same ideal up to a coordinate change and the same solution set, so
        the SPREAD of d_ff across them is a direct measure of how much of any
        claimed effect is base-choice artifact. Any claimed collapse must exceed
        this spread by at least a factor of 2 to be reported as structural,
        and this rule is fixed before the run.
    - metric: >-
        fraction of interval solutions with f(x) a non-square, i.e. the
        filtering loss
      direction: different
      minimum_effect: >-
        PREDICTED near one half with deviation O(t/p) from the Hasse trace, and
        REPORTED per cell so it enters the cost accounting explicitly rather
        than being absorbed into a constant. A measured fraction outside
        [0.4, 0.6] at p >= 2^12 indicates a construction error.
    - metric: >-
        number of cells recorded as not computable within the memory contract,
        and peak RSS per cell
      direction: different
      minimum_effect: >-
        REPORTED, NOT PREDICTED, and required so the record cannot silently drop
        the largest cells, which are exactly the informative ones. A cell
        pattern in which the abort rate rises with s would bias the fitted slope
        downward - the direction that favours Outcome 3 - and the record commits
        in advance to reporting the fitted slope both with and without the
        aborted cells' neighbours.

  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, HARD GATE, one page. Write the digit system
      explicitly for m = 2, d = 2, s = 3; verify by hand that the summation
      generator has total degree 4 in the digit variables and that the
      membership generators are a(a-1); verify the s = 1 reduction to the
      existing fV system symbolically; and evaluate the null formula at the
      hand cells. If the s = 1 reduction is not exact, stop. The exhibition of
      the mechanism A1-11 and afe4ce say F_p lacks is COMPLETE AT STAGE 0 and
      is the record's first deliverable independent of every later stage.
      STAGE 1, MINUTES. Reuse the exact graded rank engine of
      IDEA-20260830-ad0be4 (this record does not build a second one) with the
      pre-flight size gate. Validate on the s = 1 frozen fixture.
      STAGE 2, THE MAIN LADDER, HOURS. m = 2, d = 2, s in {1,2,3,4,5} so
      B in {2,4,8,16,32}; p in {2^12, 2^14, 2^16} chosen so d^s <= p with
      margin; 8 curves with generic j; 5 factor-base-independent seeds for the
      random arms; targets PLANTED so that at least one decomposition exists,
      because at these parameters a random target decomposes with probability
      about 4B^2/p which is far below 1 - planting is a sampling design and no
      yield statement may be read off it. D_max = 6. Record the full graded
      rank filtration and d_ff per cell.
      STAGE 3, THE BASE LADDER, HOURS. d in {2,4,8} at matched d^s = 64, to
      measure the presentational artifact budget.
      STAGE 4, THE BLOCKING CONTROLS, HOURS. Support-matched random-generator
      null; the non-curve cubic nearby object; the boundary-lift paired
      comparison at s = 1 versus s = 2; the y^2 = f(x) variant against the
      post-filtering variant on a 20 percent subsample.
      STAGE 5, OPTIONAL, ONLY IF STAGE 2 IS CLEAN AND THE CONTRACT PERMITS.
      m = 3 at d = 2, s in {2,3}, which is where the exponent question actually
      lives; explicitly optional so that a memory stop at m = 3 cannot
      invalidate the m = 2 ladder.
      STAGE 6, ZERO COMPUTE. Report the fitted slope with its CI, declare
      Outcome 1, 2, 3 or unresolved by the pre-registered rule, and state the
      consequence for RQ-SDEG-001. Never a status change - that is the
      Coordinator's authority alone.
      MEMORY ENVELOPE, STATED IN THE SAME UNITS AS THE FAILURE IT MUST AVOID.
      The 2026-08-28 GOAL-DREG-001 attempt stopped as resource_exhaustion at
      roughly 12 GiB against an 8 GiB contract, with a 768,212-column monomial
      space and its rank kernel never invoked - an INFRASTRUCTURE stop under
      AGENTS rule 3, never negative mathematical evidence. THIS RECORD BUILDS
      MACAULAY MATRICES AND IS THEREFORE EXPOSED TO EXACTLY THAT WALL, and says
      so rather than hoping. The column count at m = 2, d = 2, s = 5 is
      binom(2s + D, D) = binom(16, 6) = 8008 at D = 6, with at most
      (2s + 1) times binom(2s + D - 2, D - 2) = 11 times binom(14,4) = 11011
      rows, i.e. roughly 350 MB dense at 4 bytes per entry. At m = 3, d = 2,
      s = 3 it is binom(15,6) = 5005 columns. The declared HARD CONTRACT is -
      a pre-flight computation of binom(ms + D, D) and the row count before any
      allocation, ABORT the cell if columns exceed 50,000 or the projected dense
      working set exceeds 4 GiB on the declared 14-core 48 GB host, and record
      the aborted cell as "not computable in budget" with its parameters. The
      combination (m = 2, d = 2, s = 6, D = 8) has binom(20,8) = 125970 columns
      and roughly 240,000 rows, about 121 GB dense - IT IS EXCLUDED FROM THE
      LADDER BY THE CONTRACT, BY NAME, IN THIS RECORD, so that no executor
      discovers it at allocation time. Peak RSS is a required reported metric.
    controls:
      - >-
        s = 1 BASELINE EMBEDDING, BLOCKING. Must reproduce the existing
        instrument exactly.
      - >-
        SUPPORT-MATCHED RANDOM-GENERATOR NULL, BLOCKING. Separates
        curve-specific structure from digit-membership structure.
      - >-
        NON-CURVE CUBIC NEARBY OBJECT, BLOCKING. A random cubic with no group
        law and a shape-matched random generator; a collapse appearing here too
        means the effect is not about elliptic curves.
      - >-
        EQUAL-d^s BASE ARM, which quantifies the presentational artifact budget
        that any claimed effect must exceed by a factor of 2.
      - >-
        BOUNDARY-LIFT PAIRED ARM at s = 1 versus s = 2, the cheapest possible
        falsifier of the record's premise.
      - >-
        SOUNDNESS ARM - the y^2 = f(x) variant versus post-filtering, so the
        non-square solutions are removed by two independent routes and the
        filtering fraction is measured.
      - >-
        DECAY CHECK, per inventor-protocol section 3. Any claimed collapse must
        PERSIST OR GROW as s increases. A collapse that is constant in absolute
        degree units across s is the canonical artifact tell and is reported as
        suspected artifact before it is reported as signal.
      - >-
        CERTIFICATE ARM - every planted target carries a decomposition
        certificate re-verified by independent point addition, and the digit
        decomposition of each summand's x-coordinate is re-checked against its
        integer representative.
      - >-
        MEMORY PRE-FLIGHT with abort-before-allocation on every cell.
    required_metrics:
      - 'full graded rank filtration and d_ff per cell, all arms'
      - 'fitted slope of d_ff against s at fixed d, with 95 percent CI'
      - 'paired d_ff(s=1) minus d_ff(s=2) per instance, with bootstrap CI'
      - 'd_ff spread across equal-d^s presentations, the artifact budget'
      - 'semi-regular null value ceil((ms(d-1)+2m)/2) per cell, exact integer'
      - 'support-matched null and non-curve nearby object d_ff per cell'
      - 'filtering fraction of non-square solutions per cell'
      - 'certificate verification pass or fail per planted target'
      - 'pre-flight column and row counts, peak RSS, wall time per cell'
      - 'count and parameters of cells aborted as not computable in budget'

  falsification_conditions:
    - >-
      The s = 1 slice does not reproduce the existing fV instrument exactly.
      The construction is wrong or the engine is wrong; the line halts and this
      is an instrument finding, not evidence about degrees.
    - >-
      The paired boundary-lift median d_ff(s=1) minus d_ff(s=2) is zero or
      negative. The family extension does not move the quantity it was built to
      move; the record's premise is refuted at its cheapest cell and the ladder
      is not run.
    - >-
      OUTCOME 1 - the fitted slope of d_ff in s is indistinguishable from
      m(d-1)/2. The digit presentation is semi-regular, the first fall degree
      assumption fails over prime fields as KN-LIT-7607 reports it likely fails
      over binary ones, afe4ce's escape (E1) is closed BY MEASUREMENT with a
      slope and a CI rather than by assertion, and RQ-SDEG-001 obtains a
      genuine non-degenerate scaling law whose consequence is that the algebraic
      oracle remains dominated by enumeration.
    - >-
      OUTCOME 2 - sublinear growth with fitted exponent gamma in (0,1). A
      quantified partial collapse; report gamma with its CI and the resulting
      oracle cost exponent, and state explicitly whether it crosses the
      threshold at which the algebraic oracle beats B^{m-1}.
    - >-
      OUTCOME 3 - d_ff flat across at least four consecutive s. The first fall
      degree assumption survives at the tested scale over prime fields; the
      conditional exponent statement of claim (D) becomes live and must be
      recorded under the two-record rule of docs/claims-and-verification.md, as
      a conditional claim tagged with H1 plus a separate evidence record for
      H1, never as a theorem. This is the long shot and it is priced as one.
    - >-
      The support-matched null or the non-curve cubic reproduces the same
      behaviour as the Semaev arm. The measured quantity is a property of
      degree-d complete intersections and not of elliptic curves; the
      conclusion re-scopes accordingly and no ECDLP statement may be made.
    - >-
      The equal-d^s spread is as large as any claimed effect. The effect is a
      base-choice artifact and is reported as one.
    - >-
      Abort rate rises with s so that the fitted slope is biased downward. The
      slope is reported as a bound rather than an estimate, and Outcome 3 may
      NOT be declared from a ladder with aborted cells at its top.

  confounders:
    - >-
      PLANTED TARGETS. Targets are planted so a decomposition exists, because
      at these parameters a random target decomposes with probability about
      2^m B^m / p, far below 1. Planting is a sampling design and NO yield,
      coverage or probability statement may be read off this battery.
    - >-
      THE INTERVAL IS NOT THE FACTOR BASE. Membership cuts out [0, d^s), not
      the on-curve subset, so roughly half the solutions are spurious. The
      soundness arm handles this two ways and the filtering fraction is a
      reported metric, never a constant absorbed into the cost.
    - >-
      ARCHIMEDEAN DEPENDENCE. The construction depends on integer
      representatives and therefore on the specific lift of F_p to [0,p). A
      different lift gives a different factor base. This is disclosed as the
      residual disanalogy of claim (C) and is NOT a defect to be fixed - it is
      the reason A1-11's conclusion survives in weakened form.
    - >-
      BASE-CHOICE ARTIFACT. d and s trade off at fixed B and the measured d_ff
      depends on both; the equal-d^s arm exists to bound this and its spread is
      the threshold every claimed effect must clear.
    - >-
      SMALL-LADDER RESOLUTION. s ranges over at most five values and d_ff is a
      small integer, so a slope fit has few points and coarse resolution. The
      declared resolution is 0.25 in slope and the decision rule is stated in
      those terms; a result that does not clear it is reported as unresolved,
      not rounded to the nearest branch.
    - >-
      MEMORY-INDUCED SELECTION. Aborted cells cluster at large s and large D,
      exactly where growth would show, so an abort pattern biases the slope
      downward toward Outcome 3. Reported with and without the affected cells'
      neighbours, and Outcome 3 may not be declared from a truncated ladder.
    - >-
      THIS IS STILL A RADICAL IDEAL. The digit membership generators are
      squarefree with roots in F_p, so IDEA-20260829-bdca13's CRT theorem still
      applies and every IDEAL-INVARIANT observable here is still determined by
      the point set. Only generator-level observables are claimed to move, and
      any reader who reads this record as escaping radicality is reading beyond
      it.
    - >-
      SCOPE LEAKAGE TO DREG. GOAL-DREG-001's boolean chained systems arise from
      a Weil descent over binary fields; this is a digit presentation over a
      prime field, and the two must not be pooled despite the superficially
      identical a(a-1) = 0 generators.

  interpretation_limits:
    - >-
      Stage 0's deliverable - the exhibition of an auxiliary-variable
      low-degree description of a prime-field factor base - is a DERIVATION
      about descriptions. It is not an attack, not an exponent, and not a
      refutation of the Bezout bound, which is correct and is used as stated.
    - >-
      Every measured degree is a property of a GENERATING SET and an exact-rank
      convention, never of the ideal, and must not be quoted otherwise.
    - >-
      Scoped to the tested (m, d, s, p, curve) ladder with p at most 2^16 and B
      at most 64. Nothing here is validated at cryptographic scale and no
      extrapolation in s is licensed - a bound observed at s <= 5 is not a bound
      in s, which is precisely the failure mode the first fall degree
      assumption names.
    - >-
      Outcome 3's cost statement is CONDITIONAL on H1 and additionally assumes
      the standard index-calculus balance, sparse linear algebra at B^2, the
      B^m/(m! N) yield model, and a filtering fraction near one half. It is a
      STAKE, not a result, and it must appear with its conditional qualifier in
      every summary, status line and cross-reference, per
      docs/claims-and-verification.md.
    - >-
      NOVELTY IS NOT ADJUDICATED, and the nearest prior art is named and NOT
      read. Index calculus over prime fields with an interval or small-x factor
      base is recorded in this corpus as KN-LIT-009 (Semaev, ePrint 2015/310);
      only its index row was read this session. No algorithmic novelty is
      claimed. What is offered as possibly new to THIS PROGRAM is the
      observation that the digit description defeats the specific degree floor
      of IDEA-20260808-afe4ce and instantiates the mechanism catalogue A1-11
      says prime fields lack, plus the ladder design that measures the
      consequence. Honest status is unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FIRST FALL DEGREE ASSUMPTION, PRIME-FIELD DIGIT FORM. There exists a
        constant D_0, depending on the arity m and the base d but NOT on the
        digit length s, on the prime p, or on the curve, such that for every
        non-singular E over F_p, every planted affine target R, and every
        s with d^s <= p, the first fall degree of the digit-presented
        decomposition system D_R satisfies d_ff(m,d,s) <= D_0.
      rigorous_support: >-
        The RIGOROUS ingredient is exact and is the null this assumption must
        beat, not a support for it - the ms membership generators
        prod_{j<d}(a_{k,i} - j) have top-degree forms a_{k,i}^d which are a
        REGULAR SEQUENCE, so the quotient by them is a complete intersection
        with Hilbert series exactly (1 + z + ... + z^{d-1})^{ms}, with no
        assumption at all; only the effect of the single summation generator of
        degree 2m is heuristic, and under semi-regularity it gives
        d_reg = ceil((ms(d-1) + 2m)/2), which GROWS LINEARLY IN s and therefore
        CONTRADICTS H1. The CLASSICAL DISTRIBUTION IMITATED is the
        Froberg / Bardet-Faugere-Salvy semi-regularity conjecture, which asserts
        that a generic overdetermined sequence behaves like the maximally
        rank-generic one degree by degree; H1 is the assertion that the Semaev
        system is NOT generic in exactly the way the binary-field literature
        hopes. OBSTRUCTIONS, WHICH ARE MANDATORY CONTENT AND ARE NOT EMPTY -
        KN-LIT-7607 records that Huang, Kosters and Yeo construct a Weil descent
        system from summation polynomials in which the first fall degree
        assumption is UNLIKELY TO HOLD, so the honest prior on H1 is against it,
        and this record's pre-registered expectation is Outcome 1, H1 FAILING.
      validation_plan: >-
        SAMPLE - the Stage 2 ladder, m = 2, d = 2, s in {1,2,3,4,5},
        p in {2^12, 2^14, 2^16}, 8 generic-j curves, planted targets, at least
        5 instances per cell, plus the optional m = 3 arm at s in {2,3}. There
        is NO known shortcut that reaches cryptographic s for this quantity -
        unlike the Deuring-correspondence route available for isogeny-degree
        heuristics - and this record states that limitation rather than
        implying a transfer. COMPARISON DISTRIBUTION - the exact integer null
        ceil((ms(d-1) + 2m)/2) per cell, compared degree by degree against the
        measured graded ranks, with the PER-DEGREE RESIDUAL SERIES reported and
        not a single summary number; the decision is the fitted slope of d_ff
        against s with a 95 percent CI at resolution 0.25. TAIL CHECKS -
        (a) the two largest s per (m,d), where the null and any collapse differ
        most and where abort risk is highest, reported individually with their
        pre-flight column counts; (b) the last two degrees before the observed
        fall, where the predicted coefficient approaches zero and relative
        sensitivity is highest; (c) the equal-d^s spread as an artifact floor
        that any collapse must exceed by a factor of 2. SAMPLED PARAMETERS
        RECORDED - p, curve coefficients, curve order, trace, m, d, s, B,
        planted decomposition, seed, monomial order, D_max, abort status.
        TRANSFER ASSUMPTIONS - NONE IS CLAIMED, and this is the load-bearing
        disclosure. A bound observed at s <= 5 is not a bound in s. Outcome 3
        would license only a conditional claim recorded under the two-record
        rule, and no cryptographic-scale statement is made or licensed.
        FALSIFICATION CONDITION FOR H1 - a fitted slope whose CI excludes 0 at
        the declared resolution, on a ladder with no aborted cells at its top.
    - id: H2
      statement: >-
        For a uniformly random x in [0, d^s) with d^s <= p, the probability
        that f(x) is a non-zero square in F_p is 1/2 + O(t/p) + O(p^{1/2}
        log p / d^s), with t the trace of Frobenius, so the interval factor base
        has size d^s/2 (1 + o(1)) and the filtering loss in the soundness arm is
        near one half.
      rigorous_support: >-
        The RIGOROUS ingredient is the Weil bound for character sums over an
        interval - the incomplete character sum of the quadratic character
        composed with a cubic over an interval of length L in F_p is bounded by
        O(p^{1/2} log p), which is the standard completion-of-intervals
        estimate, so the deviation from 1/2 is O(p^{1/2} log p / L) and becomes
        meaningful only for L well above p^{1/2}. THIS IS A DISCLOSED WEAKNESS -
        at the tested ladder d^s is at most 64 while p is at least 2^12, so the
        rigorous bound is VACUOUS at every tested cell and the assumption is
        carried entirely by measurement there. The CLASSICAL DISTRIBUTION
        IMITATED is the equidistribution of quadratic residues in short
        intervals, which is exactly the regime where the rigorous bound fails
        and which is why the fraction is a REPORTED metric rather than a
        modelling constant.
      validation_plan: >-
        SAMPLE - exhaustive over the complete interval [0,d^s) at every Stage 2
        cell, which is at most 64 values and therefore free, for all 8 curves
        and all three primes; plus 2000 random intervals at p = 2^16 with
        d^s in {2^8, 2^10} as an out-of-scope calibration where the interval is
        long enough for the Weil bound to bite. COMPARISON DISTRIBUTION -
        Binomial(d^s, 1/2) at the short cells with an exact binomial test at the
        1 percent level, and the Weil-bounded prediction at the calibration
        cells. TAIL CHECKS - (a) the cell with the most extreme observed
        fraction, reported with its curve invariants; (b) the number of failing
        cells at the 1 percent level reported rather than the best cell;
        (c) curves with full rational 2-torsion reported separately, since their
        character sums are structured. SAMPLED PARAMETERS RECORDED - p, curve
        coefficients, curve order, trace, d, s, observed square count. TRANSFER
        ASSUMPTIONS - none; the calibration cells are flagged as out of scope
        and nothing above p = 2^16 is claimed.

  target_complexity:
    time_exponent: >-
      TWO NUMBERS, AND THEY MUST NEVER BE QUOTED TOGETHER WITHOUT THEIR TAGS.
      UNCONDITIONAL - this record proposes no algorithm and moves no exponent;
      its own cost is exact graded ranks on matrices of at most 8008 columns.
      CONDITIONAL ON H1 AND ON THE DECLARED COST MODEL - if d_ff is bounded by
      D_0 independent of s, the decomposition oracle costs
      C = binom(ms + D_0, D_0)^omega, which is (m log_d B)^{D_0 omega}, i.e.
      polynomial in log N; the standard balance B = (m! C N)^{1/(m+1)} then
      gives total time 2 (m! C N)^{2/(m+1)} = N^{2/(m+1) + o(1)}, which is
      N^{0.4+o(1)} at m = 4 and N^{1/3+o(1)} at m = 5, against Pollard rho's
      0.886 N^{1/2}. At m = 2 and m = 3 the same formula gives N^{2/3} and
      N^{1/2}, so the conditional advantage begins only at m >= 4 and this is
      stated so the record cannot be read as claiming an m = 2 speedup - which
      is the arity the minimal test actually measures.
    memory_exponent: >-
      UNCONDITIONAL, for this record's own experiment - at most about 350 MB per
      cell, with a hard 4 GiB abort and a pre-flight count, on a 48 GB host.
      CONDITIONAL ON H1 - the index-calculus memory is dominated by the sparse
      relation matrix, about B rows of about m nonzeros, plus the factor base,
      i.e. N^{1/(m+1)+o(1)}, which is N^{0.2+o(1)} at m = 4. That is far above
      rho's O(1) memory and is the honest cost of the conditional advantage;
      a time-only comparison would be incomplete and is refused here.
    best_known: >-
      Pollard rho at 0.886 N^{1/2} group operations with O(1) memory, and its
      van Oorschot-Wiener parallelization at N^{1/2}/(number of processors)
      with distinguished points; BSGS at (N^{1/2}, N^{1/2}); multi-target rho at
      sqrt(TN); the preprocessing frontier S T^2 = Omega~(N). For the
      decomposition subtask - the enumerative signed-sum sweep at
      2^{m-1} B^{m-1} group operations and O(B) memory, and the target-keyed
      meet-in-the-middle at B^{ceil(m/2)} time and B^{floor(m/2)} memory. Over
      extension fields F_{q^n}, Gaudry-Diem style index calculus, which does
      not apply to prime fields and is named to prevent a category error.
    hidden_overhead: >-
      Four disclosures, all material. (1) The o(1) in N^{2/(m+1)+o(1)} hides
      (m log_d B)^{D_0 omega} with D_0 UNKNOWN and unbounded by any proof - if
      D_0 is even mildly large the polylog is enormous at cryptographic sizes,
      and the record refuses to quote a concrete NIST-level number from a
      constant it has not measured. (2) The filtering fraction near one half
      costs a constant factor 2^m in the yield and is charged. (3) Relation
      search must also RECOGNISE that a solution lies in the factor base, which
      in the digit presentation is automatic (the digit variables ARE the
      membership), but the solutions found include the spurious non-square
      ones - charged in (2). (4) The whole conditional line requires that a
      bounded d_ff actually yields a bounded SOLVING degree; the connection
      between first fall degree, last fall degree and solving degree is exactly
      what arXiv:2112.05579 studies, this record read only its abstract, and the
      gap between "first fall bounded" and "solving degree bounded" is the
      single largest unstated risk in the conditional claim. It is stated here.
    tradeoff_note: >-
      The conditional algorithm sits at time N^{2/(m+1)} and memory
      N^{1/(m+1)}, so at m = 4 it is (N^{0.4}, N^{0.2}) against rho's
      (N^{0.5}, N^{0}) and BSGS's (N^{0.5}, N^{0.5}). It therefore does NOT
      dominate rho on the memory axis and the comparison must be made on both
      axes at once. Relation collection is embarrassingly parallel over targets
      with no communication; the sparse linear algebra is the serial bottleneck
      and admits the usual block-Wiedemann parallelization at communication
      cost. Arity m is itself the tradeoff knob - larger m lowers the time
      exponent and raises the per-trial oracle cost and the variable count
      ms, which is precisely why the m = 3 arm of the minimal test matters more
      than the m = 2 arm even though m = 2 is what the budget affords first.

