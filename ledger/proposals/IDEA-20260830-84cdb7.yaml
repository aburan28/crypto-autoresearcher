      claim: >-
        Derives, for the fV presentation, the semi-regular null
        d_reg = ceil((m(B-1) + D_S)/2) from the exact Hilbert series
        (1 + z + ... + z^{B-1})^m (1 - z^{D_S}), verified by hand on two cells;
