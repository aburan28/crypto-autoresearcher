idea:
  id: IDEA-20260816-8e6e96
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: Treat an algebraic sponge over a tiny prime field as a challenge sampler and measure, round
    by round, how far the induced challenge distribution stays from uniform over the whole enumerable
    input domain, reporting the round count at which the deviation drops below the soundness term
    it is supposed to leave untouched
  class: representation
  claim: '(A) In an arithmetization-friendly proof pipeline the Fiat-Shamir challenge is produced
    by an algebraic permutation over the same prime field as the circuit, applied in sponge mode,
    rather than by a bit-oriented hash. Soundness accounting treats the resulting challenge as uniform,
    and the round count of the permutation is chosen against algebraic cryptanalysis rather than against
    the uniformity of the challenge it produces. (B) At a tiny prime field and a small state width,
    the entire input domain of the sponge is enumerable, so the induced challenge distribution is
    not estimated but computed exactly: for every absorbed input in the domain, compute the squeezed
    field element, and form the exact empirical mass vector. The deliverable is the exact total variation
    distance from uniform and the exact max-mass excess, as a function of the number of permutation
    rounds, at named (p, width, capacity, rounds), together with the round count at which those quantities
    fall below a named soundness reference such as one over the challenge space. (C) The measured
    object has a decay prediction attached: if the permutation is doing its job, the deviation must
    fall as rounds increase and must approach the deviation of a random function on the same domain,
    not zero, because a random function is itself non-uniform. That distinction is the whole measurement,
    and confusing the two would manufacture a signal. (D) NOT CLAIMED: no attack on any permutation,
    no claim that any round count is inadequate, no claim about any deployed, third-party or standardized
    hash or proof system, none of which is examined; no algebraic cryptanalysis is performed and no
    distinguisher is claimed; and no security consequence follows from a measured deviation at a tiny
    field, since the whole point is that the domain must be enumerable and cryptographic parameters
    are not.'
  mechanism: 'STAGE A: fix the permutation. A Poseidon-shaped construction over F_p with state width
    t, an S-box of the form x to the alpha with alpha coprime to p minus one, a fixed MDS-style linear
    layer, and round constants drawn from a declared seed; the number of rounds is the swept variable
    and both full and partial round patterns are named. STAGE B: fix the sponge. Rate one, capacity
    t minus one, one absorbed field element, one squeezed field element, so the challenge map is a
    function from F_p to F_p and the domain has exactly p points. STAGE C: enumerate. For every input
    in F_p compute the challenge and accumulate the exact count vector; the counts are integers and
    the mass vector is exact rationals. STAGE D: compute deviation. Total variation distance from
    uniform, max-mass excess, collision probability, and the number of unreached challenges, all exactly.
    STAGE E: sweep rounds from one upward and plot the decay; check that the sequence is decreasing
    and that it flattens at the random-function reference rather than at zero. STAGE F: run the two
    null arms, a uniformly random function on the same domain and a deliberately weak one-round permutation,
    and require the first to match the flattening level and the second to sit far above it. STAGE
    G: convert the measured deviation into a soundness correction using the same greedy-adversary
    functional used elsewhere in this set, namely the sum of the d largest masses, and report the
    resulting bit discrepancy.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for Poseidon, Rescue, sponge, MDS, S-box,
      arithmetization and modulo bias. Read the titles of all thirteen RQ-WFS-e776b6 proposals from
      a PyYAML scan. Read ledger/questions/RQ-WFS-e776b6.yaml. Inspected which buckets the 2026-08-16
      sponge hits belong to by checking the question ids attached to nearby records in the same batch.
    results: Poseidon returned hits only under knowledge/, specifically knowledge/literature/KN-LIT-7594.md,
      knowledge/literature/KN-LIT-4246.md, knowledge/techniques/KN-TECH-075.md and knowledge/gathers/GATHER-20260728.md,
      and ZERO hits across ledger/proposals/ and ledger/hypotheses/. Rescue and MDS return proposal
      hits such as IDEA-20260809-2ba70c, IDEA-20260808-83b3ba and IDEA-20260807-4ee607, which from
      their ids and context belong to symmetric-primitive lanes rather than to RQ-WFS. The string
      sponge hits several 2026-08-16 records including IDEA-20260816-97de1e and IDEA-20260816-8640ad,
      which belong to sibling hash buckets in this batch and concern binary sponges as hash functions.
      No RQ-WFS proposal treats the challenge sampler itself as the measured object.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; algebraic sponges, Poseidon-shaped
      permutations and total variation distance are standard and treated as known. What is claimed
      new is only internal: this repository has no proposal that enumerates a challenge sampler''s
      entire input domain and reports the exact deviation from uniform as a function of round count,
      and none that connects that deviation to a soundness correction through the greedy-adversary
      functional. The parts assembled, permutation, sponge, exhaustive enumeration and total variation
      distance, are all known.'
  object_first_candidate:
    tracked_object: 'The exact count vector c of the challenge map: the length-p vector whose c-th
      entry is the number of domain points mapped to challenge c. Everything reported is a functional
      of c, specifically its distance from the flat vector and the sum of its d largest entries.'
    lossiness: Genuinely lossy. The underlying state is the full permutation trajectory, t field elements
      per round times the round count, for every one of p inputs; the count vector discards all of
      it and keeps only the multiset of outputs, collapsing every input with the same challenge into
      one count and every trajectory difference into nothing. The discard is compatible with the target
      operation because Fiat-Shamir acceptance depends on the sampler only through which challenge
      it emits, so no trajectory feature outside the output can influence a verifier. The retained
      vector propagates deterministically under composition of the sampler with a fixed adversary
      attainable set, which is exactly the soundness functional applied at the end.
    propagation: 'One step of the target operation is one additional permutation round applied before
      squeezing. On the tracked object it acts as a re-partition of the domain: the count vector after
      r plus one rounds is obtained by pushing the r-round intermediate distribution through one more
      round function. The prediction attached to this propagation is decay: the deviation from uniform
      must shrink as rounds are added and must flatten at the random-function reference. A deviation
      that does not decay across rounds is, by inventor-protocol section 3, the signature of an artifact
      rather than of structure, and this record treats it that way.'
    survival_score: 'The object survives while the whole domain is enumerable, which is exact for
      p up to about 2 to the 22 with a rate-one sponge, and for wider rates only if the domain is
      restricted, which is a named restriction and not a sample. It survives every round count, since
      adding rounds costs a constant factor. It dissolves at two named boundaries: when p is large
      enough that the count vector must be sampled rather than computed, at which point total variation
      distance becomes an estimate with its own bias, and when the rate exceeds one so that the domain
      is p to the rate and enumeration is infeasible, at which point the measurement becomes a statement
      about a restricted input family only.'
  null_object_control: 'NULL OBJECT: a uniformly random function from F_p to F_p, realised by drawing
    p independent uniform outputs from a declared seed, pushed through the identical count-vector
    computation and the identical deviation functionals in the same invocation. The null establishes
    the FLOOR: a random function is not uniform either, and its expected total variation distance
    from flat is a known positive quantity of order the square root of one over p. For the signal
    arm to mean anything the round-swept deviation must decay toward the null''s level and not below
    it; a permutation that measured below the random-function floor would be more uniform than random,
    which is itself a structural tell and would indicate the enumeration is wrong. A second null is
    a one-round permutation, which must sit far above the floor, confirming the instrument can see
    non-uniformity when it is present.'
  discriminated_from:
  - The sibling records in this batch on binary sponges as hash functions, which measure differential
    or algebraic properties of a compression primitive. This record measures neither; it measures
    the output distribution of a sampler over an enumerable domain and converts it into a soundness
    term.
  - The reduction-bias record in this same set, whose non-uniformity comes from reducing a k-bit integer
    modulo p and is exactly two-valued. Here the field arithmetic is native, there is no reduction,
    and any non-uniformity comes from the permutation itself and has no closed form.
  - IDEA-20260809-82e7ba sweeps challenge-space size against forgery cost. Here the challenge space
    is fixed at exactly p elements and the swept variable is the round count of the sampler.
  - IDEA-20260816-f05ef2 treats grinding as the image of a fixed function on G points, a statement
    about how many distinct challenges a budget buys. This record spends no budget and measures the
    mass distribution over the full preimage domain.
  - Algebraic cryptanalysis of arithmetization-friendly permutations, which searches for distinguishers
    or solves systems. No system is solved here and no distinguisher is claimed; the measurement is
    a counting exercise over an enumerable domain.
  assumptions:
  - A Poseidon-shaped permutation over a tiny prime field with a declared MDS-style matrix and seeded
    round constants is a legitimate scaled-down object for measuring sampler uniformity; it is not
    asserted to inherit any property of any full-size instance.
  - Rate one and a single squeezed element make the challenge map a function on F_p, so the domain
    is exactly p points and enumeration is complete.
  - The random-function floor is the correct reference, not zero deviation; comparing against zero
    would report a spurious permanent gap at every round count.
  - Exact integer counting and exact rational deviation, with no floating point in any load-bearing
    path.
  - The greedy-adversary conversion presumes the adversary may choose which d challenges it can answer,
    the same assumption the reduction-bias record in this set states, and it is an upper bound where
    the protocol fixes that set.
  predictions:
  - metric: total variation distance from uniform as a function of round count
    direction: lower
    minimum_effect: 'forced qualitative value: strictly decreasing over the first several rounds,
      then flat; a non-decaying sequence is by inventor-protocol section 3 an artifact signature and
      voids the measurement rather than supporting a finding'
  - metric: flattened total variation distance at high round count, relative to the random-function
      null
    direction: different
    minimum_effect: 'forced value: agreement with the null within its own sampling interval; a permutation
      measuring below the random-function floor voids the run'
  - metric: round count at which the derived soundness bit discrepancy falls below 2 to the minus
      10 bits
    direction: lower
    minimum_effect: 'explicit refusal to pre-commit a number: the decay rate of an algebraic permutation
      over a tiny field is exactly what is unknown here, and pre-committing a round count would be
      inventing the answer this run exists to produce'
  - metric: one-round null deviation relative to the flattened level
    direction: higher
    minimum_effect: 10.0
  minimal_test:
    design: One script, minutes to hours. Take p equal to 65537, state width t equal to 3, S-box exponent
      alpha equal to 3 which is coprime to p minus one, a fixed 3 by 3 MDS-style matrix with a checked
      nonzero minor condition, and round constants from a declared seed. Sponge with rate one and
      capacity two, absorbing one element and squeezing one. For round counts r in 1 through 16, enumerate
      all 65537 inputs, compute the challenge, and accumulate the exact count vector. From each vector
      compute total variation distance from uniform, max-mass excess, the number of unreached challenges,
      and the greedy sum for d in {1, 4, 16}, all in exact arithmetic. Run the random-function null
      and the one-round null through the identical functionals in the same invocation. The discriminating
      output is the decay curve of total variation distance against r with the null floor drawn on
      it, plus the round count at which the derived bit discrepancy drops below the named threshold.
      If the deviation is already at the floor at r equal to 1, the measurement has no resolution
      at this p and that is the reportable obstruction.
    controls:
    - Uniformly random function null on the same domain through the identical functionals in the same
      invocation.
    - One-round permutation null, required to sit far above the floor.
    - Identity permutation control, where the challenge map is the identity and the count vector is
      exactly flat, giving total variation distance exactly zero.
    - Constant-map control, where every input maps to one challenge, giving the maximal possible deviation,
      confirming the functional spans its range.
    - Two distinct round-constant seeds so that the decay curve is not a property of one constant
      schedule.
    - Two distinct MDS-style matrices so that the decay is not an artifact of one linear layer.
    required_metrics:
    - exact total variation distance from uniform per round count
    - exact max-mass excess per round count
    - number of unreached challenges per round count
    - exact collision probability of the challenge map per round count
    - derived soundness bit discrepancy for d in {1, 4, 16} per round count
    - random-function null deviation with its sampling interval
    - one-round null deviation
  falsification_conditions:
  - The identity control does not give exactly zero deviation or the constant control does not give
    the maximal value.
  - The signal arm measures below the random-function floor at any round count, which is impossible
    for a genuine measurement and voids the instrument.
  - The deviation does not decay with round count, which under inventor-protocol section 3 marks the
    measurement as an artifact rather than the permutation as weak.
  - The deviation is already indistinguishable from the floor at r equal to 1, which falsifies the
    premise that this instrument has resolution at the chosen p and closes the record with that obstruction
    and the larger p that would be needed.
  - The decay curve differs materially between the two round-constant seeds or the two MDS matrices,
    showing the measurement reads the constants rather than the construction.
  - Replay from the declared seed does not reproduce the count vectors exactly.
  confounders:
  - A random function is not uniform; comparing against zero rather than against the random-function
    floor would report a permanent spurious deviation at every round count.
  - A tiny prime makes the random-function floor large, so the resolution of the instrument shrinks
    exactly where enumeration is affordable, and the two pressures must be balanced explicitly.
  - The MDS-style matrix over a tiny field may fail the branch-number condition that makes the construction
    meaningful, so a badly chosen matrix would decay differently for reasons unrelated to round count.
  - Round constants from one seed could accidentally interact with the S-box exponent; two seeds are
    needed to separate that.
  - An S-box exponent not coprime to p minus one is not a permutation at all, which would silently
    collapse the domain and manufacture deviation.
  interpretation_limits:
  - Results are scoped to the named tiny-field permutation with the named width, exponent, matrix
    and constants, and to a rate-one single-squeeze sponge; nothing about any full-size instance follows.
  - A measured deviation at a tiny field is not evidence about round counts chosen for cryptographic
    fields, where the random-function floor is astronomically smaller.
  - No algebraic distinguisher is claimed or implied; the measurement counts outputs and does not
    solve any system.
  - No statement about any deployed, third-party or standardized permutation, hash or proof system
    follows from any outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. Cost is O(p times rounds times width squared) field
      operations, about 2 to the 27 at the named parameters.
    memory_exponent: No attack memory exponent is claimed. Memory is O(p) integers for the count vector,
      well under one gigabyte at p equal to 65537.
    best_known: The incumbent is the standard practice of treating an algebraic-sponge challenge as
      uniform in soundness accounting and choosing round counts against algebraic cryptanalysis rather
      than against sampler uniformity. This record does not beat that practice; it measures the uniformity
      term at parameters where it can be counted exactly.
    hidden_overhead: The human cost is in choosing a scaled-down permutation that is defensible as
      an object rather than a caricature, and in stating the random-function floor correctly so the
      headline decay is not measured against the wrong reference. In lower-order terms hide the coprimality
      condition on the S-box exponent, the branch-number condition on the matrix, and the fact that
      the instrument's resolution and its affordability pull in opposite directions in p.
  dominated_by: n/a (no result claimed). No attack, distinguisher or cost improvement is proposed,
    so no time, memory or query frontier row exists to compare against; asserting null would be a
    fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a decay curve
    and a derived bit discrepancy at named tiny-field parameters, with no cost comparison to any algorithm.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that the full domain is enumerable and the exact count vector
    and deviations are computable at the named parameters: about 0.95. Part B, that the deviation
    decays visibly with round count before flattening: about 0.5, since at p equal to 65537 the random-function
    floor may already be reached after one or two rounds, which would leave the curve with no dynamic
    range; this is the most likely failure and it is a usable obstruction because it names the p that
    would be needed. Part C, that the derived soundness bit discrepancy is non-negligible at any round
    count worth reporting: about 0.1, and I expect this to fail. Part D, that the instrument and its
    random-function floor become the standard reference for sampler-uniformity questions elsewhere
    in this question: about 0.5.'
