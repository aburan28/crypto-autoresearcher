idea:
  id: IDEA-20261002-79a077
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    AT FROZEN SURPLUS AND SPARSITY, DOES BLOCK-WIEDEMANN BEAT DENSE GE ON TOY
    BINARY IC RELATION MATRICES? On toy Koblitz n∈{17,23,31} with frozen V and
    surplus s, compare median wall(t_Wiedemann)/median(t_dense) against a
    pre-registered threshold τ.

  class: heuristic_validation

  claim: >-
    Sparse linear algebra for index calculus is classical folklore, but
    RQ-BINSTD has no frozen toy-scale race between block-Wiedemann and dense
    Gaussian elimination on the relation matrices that its own collectors
    actually emit. CLAIM: for each admitted toy cell n∈{17,23,31} with frozen
    V and surplus s∈{1.5,2.0}×|#FB|, the ratio
    R := median(wall_Wiedemann) / median(wall_dense) over N_rep seeded builds
    satisfies R ≤ τ with τ frozen at Stage 0 — OR the race fails and is
    recorded as dense-GE-still-cheaper at this scale. CLAIM TIER:
    heuristic_validation. NO break. NO exponent. NO n≥131 transfer.
    Distinct from IDEA-20261002-7def74 (nnz fill-in band, not solver race),
    9d8520 (orphan absorption), and 9ff676 (orbit-unique yield).

  mechanism: >-
    OBJECT FRAME. Representation: sparse relation matrix M over FB
    {P : x(P)∈V} at frozen surplus; Operation A: solve the same right-hand
    sides (or nullspace probe) with block-Wiedemann; Operation B: dense GE
    on the same matrix; Observable: wall-time ratio R at each (n,s).
    Trichotomy: Class I instrument (LA solver race on fixed matrices).
    Lossy-projection: R discards which rows caused pivots; null is a matched
    random sparse (0,1)-matrix with the same shape and nnz band whose denser
    GE should also win or lose under the same τ. OFF-LIMITS: nnz fill-in
    band without a solver race (7def74); relation yield meters; PDP engine
    races. WHAT IS NEW: a frozen τ race of block-Wiedemann vs dense GE on
    RQ-BINSTD toy relation matrices.

  novelty_status: unverified
