      No exponent claimed. LA-solver instrument only; a held τ band does
      not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store sparse CSR plus dense copy at toys.
    best_known: >-
      KR-IC-ae532f (practical IC pipelines) / classical sparse LA folklore.
    hidden_overhead: Dense copy construction; block size / Krylov length.
    tradeoff_note: >-
      A Wiedemann win can still leave singular matrices; this meter is
      wall-time only on admitted full-rank (or declared rank-deficient) runs.

  estimated_cost:
