  assumptions:
    - Frozen V, surplus schedule, τ, N_rep, seeds, RHS / nullspace probe.
    - Relation collector already admitted or cell is failed_infrastructure
      (do not provision curve libs mid-tick).
    - Same matrix bytes for both solvers; no post-hoc sparsification.
    - R ≤ τ ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-79a077-H1
      formal_statement: >-
        FORALL n∈{17,23,31} and s∈{1.5,2.0}×|#FB|: median(wall_Wiedemann) /
        median(wall_dense) ≤ τ with τ frozen at Stage 0 over N_rep seeded
        matrix builds.
      random_model_justification: >-
        Rigorous: sparse iterative methods have asymptotic cost linear in
        nnz·iterations when the matrix is well-conditioned enough for early
        termination; dense GE is Θ(r³) in rank r. Classical: at toy scales
        with moderate surplus, nnz stays O(r)·polylog and block-Wiedemann
        should undercut dense GE once r exceeds a small constant; if cache
        effects dominate or the matrix is nearly dense, the band fails.
        The τ band is a pre-registered transfer hypothesis at toys — not a
        claim that IC beats rho.
      supporting_results:
        - KR-IC-ae532f
        - KR-IC-1fcdbc
        - KR-IC-9e610d
      validation_experiment_ids: []
      falsification_condition: >-
        R > τ at a completed (n,s) cell (dense-GE-still-cheaper), OR
        collector / solver absent (infrastructure stop), OR matrix rank
        below the surplus floor after the budgeted catalog (inconclusive).

  predictions:
    - metric: wiedemann_over_dense_median_wall_ratio
      direction: upper_bounded
      minimum_effect: '≤ τ at each (n,s) cell'
    - metric: matrix_nnz
      direction: recorded
      minimum_effect: 'nnz band logged; no post-hoc edit'
    - metric: null_random_sparse_ratio
      direction: comparable
      minimum_effect: 'null race reported beside IC matrices'

  minimal_test: >-
    Stage 0: freeze V, s schedule, τ, N_rep, seeds, solver versions.
    Stage 1: n=17 — build matrices; race Wiedemann vs dense GE.
    Stage 2: n∈{23,31} + random-sparse null. Budget: ≤8 CPU-hours.
    Stop if collector / solver / toy cell absent (IMP, never evidence;
    do not provision).

  controls:
    - ctl_frozen_tau
    - ctl_frozen_surplus_schedule
    - ctl_same_matrix_bytes_both_solvers
    - null_random_sparse_matched_shape
    - ctl_no_posthoc_tau_edit
    - ctl_no_midtick_lib_provision

  falsification_conditions:
    - Claiming practical binary IC from a toy LA-solver race.
    - Equating this race with nnz fill-in (7def74) without wall-time.
    - Editing τ after seeing ratios.
    - Transferring the band to n≥131 without a new contract.
    - Changing matrix sparsity between solvers.

  target_complexity:
