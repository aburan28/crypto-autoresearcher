  assumptions:
    - >-
      E_0 ordinary, j in {0, 1728}, p greater than 3 with the congruence making it
      ordinary.
    - >-
      The address problem is stated with respect to the CANONICAL base point E_0,
      whose existence is exactly A3. Without h(D_K) = 1 the base point is not
      canonical and the problem statement changes.
    - >-
      f is available. At 7-9 bits it is free; at cryptographic scale it requires
      factoring an integer of size about sqrt(p), which is subexponential in general
      and cheap when f is smooth. Every cost statement in A4 is stated AFTER f is
      factored and the factoring cost is reported as a separate line item, never
      absorbed.
    - >-
      The ell^k-torsion needed for the self-pairing meter is accessible over an
      extension of controlled degree. This is an assumption with teeth and it is the
      most likely place A2 becomes expensive at scale; it is measured, not assumed,
      under H-ADDR-2.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks only;
      every claimed address carries an independently re-verified certificate, meaning
      the claimed connecting isogeny is evaluated and its codomain checked.

  proof_search_map:
    bottleneck: >-
      The crater search. In Galbraith-style ordinary isogeny algorithms the
      Otilde(q^{1/4}) is a meet-in-the-middle over a crater of size h(D_K), which is
      about p^{1/2}; the vertical part is already cheap when the conductor has no large
      prime factor. Removing the crater removes the bottleneck entirely, and the only
      two discriminants that force h(D_K) = 1 AND supply a free orientation are exactly
      the two this RQ studies. Everything else in this record is bookkeeping around
      that one observation.
    baseline_embedding:
      parameter_slice: >-
        Setting h(D_K) large recovers the generic case, where the crater search
        dominates and the cost returns to Otilde(p^{1/4}) - so Galbraith's algorithm is
        recovered as the exact large-crater slice of this frame, not contradicted by
        it. Setting f = 1 gives a class equal to the crater, the address problem is
        trivial, and the cost is O(1) - the opposite extreme slice.
      reproduction_check: >-
        Frozen regression fixture: on a toy class with h(D_K) about 20 and conductor 1,
        so that the class is all crater, the implemented address routine must cost
        order sqrt(h) and must NOT be polynomial. This reproduces the baseline's
        scaling as a measured exponent on a log-log fit with a pre-registered slope of
        0.5 plus or minus 0.1, computed and frozen before the special-j arm is read. A
        curve that merely looks similar to the baseline is not an embedding; the slope
        is the check.
    observation_collision:
      observable: >-
        The self-pairing degeneracy vector of a vertex, i.e. the least k at which the
        automorphism self-pairing becomes non-trivial, for each prime ell dividing f.
      distinct_preimage_search: >-
        THIS IS THE RECORD'S SHARPEST AUDIT AND IT PREDICTS A COLLISION. Two distinct
        vertices at the SAME depth below the crater have, by construction, the same
        degeneracy vector - the meter reads level, and a level generally contains more
        than one vertex. So the observable is provably NOT an address: it is a level
        meter, and A4's claim that the full address is recoverable therefore CANNOT
        rest on the self-pairing alone. The separating condition must be supplied by
        the ell-isogeny step actually taken at each level, i.e. by the walk, not by the
        pairing. The collision is exhibited deliberately, it is a direct falsifier of
        the proposition that the self-pairing equals the address, and the record's
        design is corrected in advance by it: the meter chooses the DIRECTION at each
        step, the walk supplies the address. Any version of this proposal that skipped
        this audit would claim an address recovery it cannot perform.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the address question from the isogeny graph, where it is a search, to
          the pairing group, where level is an exact vanishing order, with separate
          obligations for encoding (curve to degeneracy vector), completeness (every
          level is reached), soundness (a non-trivial pairing genuinely certifies
          non-membership in the deeper order), transfer (the certificate survives the
          isogeny step), and cost loss (torsion field degree).
        predicted_gain: >-
          Replaces order-ell modular-polynomial root-finding per level by
          Otilde(sqrt(ell)) or better pairing work per level - an exponent move in the
          parameter ell, explicitly NOT in p.
      - transform: specialization_pack
        proposed_object: >-
          The subfamily with h(D_K) = 1 and a free orientation, specialised out of the
          ordinary family, measured, and packed back as a stated exception to the
          corpus claim that within-class identification costs about p^{1/2}.
        predicted_gain: >-
          Polynomial address cost on a subfamily of density about p^{-1/2} among random
          curves, further thinned by the smoothness of f. Explicitly a subfamily
          statement and explicitly not an ECDLP result.
    quantifier_order: >-
      FOR ALL primes p with the stated congruence, FOR ALL ordinary classes over F_p
      with D_K in {-3, -4}, FOR ALL curves E' in that class, THERE EXISTS an algorithm,
      independent of E' and depending only on p, t and the factorisation of f, that
      outputs the connecting ideal class in time bounded by the A4 expression. The
      order matters and is the audit: the algorithm is quantified BEFORE E', so no
      per-instance advice is permitted; and the bound is quantified over ALL curves in
      the class, so a bound that holds only for curves near the crater does not satisfy
      the claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        A measured operation-count scaling on complete toy classes, with certificates
        on every recovered path, showing that address cost is flat in class size and
        varies with the factorisation of f, on classes small enough to enumerate. It
        CANNOT certify the asymptotic in A4, which is a derivation; cannot certify that
        the method beats Galbraith's algorithm, since that requires implementing
        Galbraith's algorithm, which is named as out of budget so the comparison is
        stated against its PUBLISHED exponent and labelled as such; and cannot certify
        anything about ECDLP cost.
      nearby_object_control: >-
        The nearby object where the desired conclusion FAILS: a class with SMALL SMOOTH
        conductor but LARGE h(D_K) - for instance |D_K| of order ten thousand with
        h(D_K) in the tens and f a product of small primes. The vertical part is cheap
        there too, but the crater search is not, so the address must remain of order
        sqrt(h). A method that reports polynomial cost there is measuring conductor
        smoothness, not crater triviality, and A4's attribution is wrong - which is
        precisely the distinction between this record and IDEA-20260807-94f953. Second
        nearby object: a class with h(D_K) = 1 from the OTHER class-number-one
        discriminants, namely -7, -8, -11, -19, -43, -67 and -163, which have a trivial
        crater but NO free orientation. If those are equally cheap, the free
        orientation is not load-bearing and A1 is decorative.
    proof_obligations:
      - claim: >-
          The automorphism gives a primitive O_K-orientation evaluable in O(1) field
          operations
        responsibility: interface
      - claim: >-
          alpha_d equal to ell^d times zeta is the minimal multiple of zeta in
          End(E_d)
        responsibility: correctness
      - claim: >-
          The self-pairing is trivial exactly for k at most d at a generic point
        responsibility: correctness
      - claim: The crater of a class with h(D_K) = 1 is a single vertex
        responsibility: size
      - claim: Ascent is deterministic, so the vertical path is unique
        responsibility: correctness
      - claim: Total cost is the stated sum over prime powers dividing f
        responsibility: runtime
      - claim: >-
          The recovered path transports the ECDLP with the SAME discrete logarithm
        responsibility: correctness
      - claim: >-
          Success probability of the smooth-conductor regime follows Dickman-de Bruijn
        responsibility: success_probability
      - claim: >-
          The self-pairing meter does NOT by itself determine the address, because of
          the collision at equal depth
        responsibility: scope

  predictions:
    - metric: >-
        fitted log-log slope of within-class address operation count versus class size,
        over toy classes with D_K in {-3, -4} and varying conductor
      direction: lower
      minimum_effect: >-
        Slope at most 0.15, against a pre-registered baseline slope of 0.50 plus or
        minus 0.10 on the matched large-crater control. A slope of 0.5 on the special-j
        family falsifies A3 and A4 outright.
    - metric: >-
        the same fitted slope on the NEARBY-OBJECT control, namely large h(D_K) with
        smooth conductor
      direction: higher
      minimum_effect: >-
        Slope at least 0.35. If this control is ALSO flat, then conductor smoothness
        and not crater triviality is the cause, A4's attribution is wrong, and the
        record must be superseded with the corrected mechanism - a clean, informative
        negative.
    - metric: >-
        the same fitted slope on the other class-number-one discriminants -7, -8, -11,
        -19, -43, -67, -163, which have a trivial crater but no free orientation
      direction: lower
      minimum_effect: >-
        Also at most 0.15. This is the prediction that SEPARATES A3, which is
        load-bearing, from A1, which may be only a convenience: if these are flat too,
        the free orientation is a constant-factor nicety and A1 must be demoted in the
        record's own framing. Either outcome is informative and both are stated in
        advance.
    - metric: >-
        number of Miller-loop pairing evaluations required to determine the volcano
        depth of a vertex, versus the number of modular-polynomial root-findings the
        walk-based baseline requires, at matched class and degree
      direction: lower
      minimum_effect: >-
        At least a factor of ell/4 fewer field operations at ell = 13, growing with
        ell. A ratio at or above 1 means the pairing meter is not cheaper and A2's
        algorithmic value is void even if A2's mathematics holds.
    - metric: >-
        Pollard rho group-operation count on the addressed curve divided by the count
        on the base curve, matched seeds, common coordinate system
      direction: different
      minimum_effect: >-
        1.00 plus or minus the frozen seed band, EXCEPT at the crater vertex where the
        automorphism discount applies and 1/sqrt(3), respectively 1/sqrt(2), is
        expected. Any other ratio anywhere in the class is a within-class ECDLP cost
        difference, contradicts EV-ECDLP-b3e847 obstruction 4, and requires
        independent review before it is described in any form.
    - metric: >-
        self-pairing degeneracy vectors of two distinct vertices at the same depth
      direction: different
      minimum_effect: >-
        IDENTICAL, i.e. a deliberate collision, at every same-depth pair. If they
        differ, the meter carries MORE than level and the observation-collision audit
        was too pessimistic - which would strengthen the record and must be reported as
        a surprise, not folded silently into the address claim.

  minimal_test:
    design: >-
      THREE ARMS. ARM S, structural, fits the RQ's declared 7-9 bits. On complete
      enumerated classes with D_K in {-3,-4}, implement the self-pairing level meter of
      A2 and verify it against ground-truth volcano levels obtained independently by
      modular-polynomial walking; report the confusion matrix, which must be diagonal.
      ARM C, cost scaling, REQUIRES A COORDINATOR SCOPE DECISION because it needs 16-24
      bit primes so that class sizes span a decade. For classes spanning class sizes
      from about 10 to about 3000, in four families - (i) D_K in {-3,-4}, (ii) the other
      seven class-number-one discriminants, (iii) large h(D_K) with smooth conductor,
      (iv) large h(D_K) with conductor 1 - implement the address routine, which ascends
      to the canonical base point using the self-pairing meter, records the path, and
      reduces the path to an ideal class, then fit operation count against class size on
      log-log axes. Pre-register the four slopes. ARM V, validation of H-ADDR-1.
      Enumerate all triples (p, t, f) with 4p = t^2 + 3f^2 over primes between 2^16 and
      2^28, factor every f, and compare the empirical CDF of u = log f / log B against
      the Dickman-de Bruijn function rho(u) by a Kolmogorov-Smirnov statistic on a
      declared B-grid, with a tail check on the smoothest observed f.
    controls:
      - >-
        BASELINE-SLOPE FIXTURE, BLOCKING: the large-crater conductor-1 family must fit
        slope 0.50 plus or minus 0.10 under the identical harness. If the harness
        cannot reproduce the known square-root scaling, no slope it reports elsewhere
        may be read.
      - >-
        NEARBY-OBJECT CONTROL, BLOCKING: large h(D_K) with SMOOTH conductor. Separates
        crater triviality from conductor smoothness. This is the control that decides
        whether this record is distinct from IDEA-20260807-94f953 or a repackaging of
        it, and it must be run first.
      - >-
        FREE-ORIENTATION CONTROL: the other seven class-number-one discriminants, which
        have a trivial crater and |Aut| = 2. Separates A3 from A1.
      - >-
        NULL METER: run the self-pairing meter with alpha replaced by a SCALAR
        endomorphism. The Weil pairing of a point with its own scalar multiple is
        trivial identically, so the meter must return no information at every level. A
        meter that returns level information from a scalar is reading something other
        than the orientation and every reading is void. This is the record's null
        object of the same shape.
      - >-
        DECAY TEST, inventor protocol section 3: the self-pairing signal must DECAY
        with depth in the exact predicted way, one ell-adic unit per step, and must
        vanish entirely once the conductor's ell-part is exhausted. A signal constant
        across depths is the canonical artifact signature and voids the meter.
      - >-
        ECDLP NEUTRALITY CONTROL: matched rho at the base curve and at every addressed
        curve, identical seeds, one common coordinate system, with the seed band frozen
        first. The pre-registered expectation is NO difference, and the control exists
        so that a surprise cannot be mistaken for the record's own claim.
      - >-
        CERTIFICATE CONTROL: every recovered path re-evaluated end to end by code
        sharing no state with the producer - each isogeny applied, each codomain
        checked for membership, final codomain checked against the target. Fraction
        must be 1.0.
    required_metrics:
      - >-
        confusion matrix of self-pairing depth versus ground-truth depth, per class and
        degree
      - >-
        field-operation counts for the pairing meter and for the modular-polynomial
        baseline
      - address operation count versus class size, per family, with fitted slope and CI
      - >-
        full factorisation of f, its largest prime factor and its largest prime power,
        per class
      - torsion field extension degree required for each ell^k pairing, per cell
      - matched rho counts at base and addressed curves, per seed, with the frozen band
      - >-
        Arm V: empirical CDF of u, KS statistic against rho(u), smoothest observed f
        versus prediction
      - null-meter output, which must be uninformative at every level
      - certificate verification fraction, required 1.0
      - >-
        charged factoring cost of f, reported as a separate line item with its scaling
        stated

  falsification_conditions:
    - >-
      Fitted address-cost slope on the D_K in {-3,-4} family at or above 0.35. A3 and
      A4 are false; the crater is not the bottleneck this record says it is.
    - >-
      The large-h smooth-conductor control also fits a flat slope. A4's causal
      attribution is wrong - smoothness, not crater triviality, is doing the work - and
      this record is a repackaging of IDEA-20260807-94f953 and must be withdrawn as
      such.
    - >-
      The self-pairing depth meter disagrees with ground-truth volcano depth in any
      cell. A2 is false as implemented, and the confusion matrix identifies whether the
      failure is at k = d or k = d + 1.
    - >-
      The null meter with scalar alpha returns level information. The instrument is
      reading something other than the orientation and every reading is void.
    - >-
      The self-pairing signal does not decay with depth. Artifact signature; void.
    - >-
      The baseline-slope fixture does not reproduce 0.50 plus or minus 0.10. Harness
      failure; no slope may be read, and this is reported as an instrument failure,
      never as evidence for or against A4.
    - >-
      Any measured rho ratio inside the class differing from 1.00 outside the seed band
      at a non-crater vertex. That would be a within-class ECDLP cost difference and it
      CONTRADICTS the corpus - it requires independent review before any description,
      and this record explicitly does not predict it.
    - >-
      Arm V shows the empirical distribution of f-smoothness deviating from Dickman
      beyond the declared KS threshold. H-ADDR-1 is false as stated; the availability
      law in A4 must be re-derived under the constraint 4p = t^2 + 3 f^2, and a
      measured deviation is a finding rather than a defect.

  confounders:
    - >-
      THE PRIMARY CONFOUND is conductor smoothness. Both this record's mechanism,
      namely a trivial crater, and the corpus's existing mechanism, namely smooth f,
      predict cheap vertical work, and toy classes with D_K = -3 tend to have small f,
      so they are correlated by construction. The nearby-object control is the ONLY
      thing that separates them and it is declared blocking for that reason.
    - >-
      Comparison against Galbraith's Otilde(q^{1/4}) is made against a PUBLISHED
      exponent relayed by a search engine, not against an implementation. The record
      therefore compares a measured slope to a cited exponent, which is a weaker
      comparison than a measured ratio, and this is stated rather than hidden. Under
      docs/inventor-protocol.md section 6 step 2 the missing piece is exactly the
      measured-ratio-against-baseline, and the baseline-slope fixture is the partial
      substitute.
    - >-
      Factoring f is free at toy scale and subexponential at cryptographic scale.
      Charging it as free and extrapolating would be the single most misleading thing
      this record could do; it is a separate reported line item.
    - >-
      The ell^k-torsion may require a large field extension, making the pairing meter
      expensive in exactly the cells where it is supposed to be cheap. Extension degree
      is a reported metric, not an assumption, and a cell where it is large is reported
      as a cell where the meter does not apply.
    - >-
      Classes with D_K in {-3,-4} are rare, of density about p^{-1/2}; a sample found
      by searching for them is NOT a random sample and no density claim may be read off
      Arm C.
    - >-
      Self-pairing claims are relayed from corpus notes that are themselves flagged
      unverified. If the relayed Castryck-Houben-Merz cost statement is wrong, A2's
      ALGORITHMIC value changes but A2's mathematics, namely the annihilation of the
      ell^k-torsion by ell^d times zeta, is elementary and stands independently. The
      two are separated in the record so that one can fail without the other.

  interpretation_limits:
    - >-
      Claim tier toy for Arm S, and Arm C requires a Coordinator scope decision because
      it exceeds RQ-ECDLP-912694's declared bit sizes of 7, 8 and 9. Running Arm C
      without that decision would silently widen a question's declared scope and this
      record refuses to do it.
    - >-
      A4 is CONDITIONAL on H-ADDR-1 and H-ADDR-2 and every statement of it must carry
      those names, exactly as the target-result profile requires.
    - >-
      THE ECDLP EXPONENT DOES NOT MOVE. The address problem and the discrete logarithm
      problem are different problems; Tate's theorem fixes the group order across the
      class, so a cheap address buys a different curve with the same order. Presenting
      A4 as an ECDLP result would be dishonest and is not done.
    - >-
      A4 is very likely folklore. The record's defensible contribution is A5 - that a
      standing corpus closure, namely that T5 dies on identification, does not apply to
      this family - plus the level-meter instrument and the control design that
      separates crater triviality from conductor smoothness.
    - >-
      secp256k1 is in the covered family, being j = 0 with D_K = -3 and f about 2^127
      and easily factored. The address statement applies to its class; its ECDLP
      hardness is untouched, and no reader may infer otherwise from this record.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 3).

  heuristic_assumptions:
    - id: H-ADDR-1
      statement: >-
        For ordinary curves with D_K in {-3, -4}, the conductor f, equal to the square
        root of (4p - t^2)/|D_K|, behaves like a uniformly random integer of its size
        with respect to smoothness: the probability that f is B-smooth is rho(u) to the
        power 1 + o(1), with u = log f / log B and rho the Dickman-de Bruijn function,
        uniformly for u between (log p)^eps and (log p)^{1 - eps}. Consequently the
        address cost of A4 is polynomial in log p with probability rho(u) at the B for
        which the vertical budget is met.
      rigorous_support: >-
        Rigorous ingredient: f is determined exactly by the pair (p, t) through
        4p - t^2 = |D_K| f^2, is an explicitly computable integer of size about the
        square root of 4p/|D_K|, and the vertical path length is exactly the sum of the
        ell-adic valuations of f. Distribution imitated: the
        Canfield-Erdos-Pomerance and Dickman-de Bruijn smoothness law for uniformly
        random integers of a given size - the same imitation Wesolowski's
        p^{1/3+o(1)} argument makes for its degree splitting
        (inputs/P13-WESOLOWSKI-2026/paper_fulltext.md, Heuristic 1 composed from
        Theorem 1.5 and Theorem 1.4).
      validation_plan: >-
        Arm V above. SAMPLED PARAMETERS RECORDED EXACTLY: all triples (p, t, f) with
        4p = t^2 + 3f^2 over primes p between 2^16 and 2^28, which is a thin but
        completely enumerable family since the quadratic form parametrises it; every f
        factored completely; empirical CDF of u = log f / log B compared against rho(u)
        on a declared B-grid by a Kolmogorov-Smirnov statistic with a pre-registered
        threshold. TAIL CHECK: the smoothest observed f in the sample against the
        rho(u) prediction for the sample size, exactly as A7 of the target profile
        requires. TRANSFER ASSUMPTION STATED EXPLICITLY: f here is constrained by the
        form 4p = t^2 + |D_K| f^2 and is therefore NOT a uniformly random integer; the
        record predicts consistency with Dickman and names the constraint as the most
        likely source of deviation. This assumption is the SAME as H-AUT-1 of
        IDEA-20260812-c49409; it is re-stated rather than re-derived and the two
        records must share one validation artifact rather than run it twice.
    - id: H-ADDR-2
      statement: >-
        The self-pairing ascent step succeeds at the first attempt with probability
        bounded below by a constant independent of ell and of the level, so the
        expected number of pairing evaluations per level is O(1); and the required
        ell^k-torsion is defined over an extension of F_p of degree (log p)^{O(1)} for
        the primes ell dividing f in the tested range.
      rigorous_support: >-
        Rigorous ingredient: the Weil pairing compatibility relation is exact, and
        ell^d times zeta annihilates the ell^d-torsion of E_d as a matter of module
        theory, so the DECISION rule is exact and only the COST is heuristic.
        Distribution imitated: the relayed claim of Galbraith-Gilchrist-Robert 2025
        that self-pairings recover ascending isogenies and ELIMINATE a heuristic
        assumption of the earlier Galbraith approach - relayed from a fetched abstract,
        with the paper unread.
      validation_plan: >-
        Measure directly in Arm S: per level and per ell, count pairing evaluations
        until the ascending direction is determined, and record the extension degree of
        the field over which the ell^k-torsion is defined. Compare against the
        modular-polynomial baseline on the same cells. TAIL CHECK: the worst cell,
        meaning largest extension degree and most evaluations, reported explicitly
        rather than averaged away, because it is the cell that decides scalability.
        TRANSFER ASSUMPTION: extension degrees measured at 7-24 bits transfer nothing
        to cryptographic p, where the torsion field degree is the dominant open risk;
        this is named as the record's principal scaling uncertainty.
    - id: H-ADDR-3
      statement: >-
        The relayed Castryck-Houben-Merz criterion - that for primitively O-oriented
        curves with m^2 dividing the discriminant of O, the connecting ideal is
        recoverable at essentially the cost of a discrete logarithm in a group of order
        m^2 given the norm - holds as stated, and applies to every non-crater vertex of
        a special-j class because the discriminant of the endomorphism ring at depth d
        is D_K times c^2, which admits m = c as an admissible modulus.
      rigorous_support: >-
        Rigorous ingredient: the discriminant of the order Z + c O_K is exactly
        D_K c^2, so the divisibility hypothesis is satisfied by construction with
        m = c, and Pohlig-Hellman makes a discrete logarithm in a group of prime-power
        order ell^{2d} cost O(d sqrt(ell)). Distribution imitated: none - this is a
        relayed theorem, not a distributional claim, and it is listed as a heuristic
        ONLY because this session did not verify it.
      validation_plan: >-
        Implement the criterion on toy classes and measure recovery success and cost
        directly, WITH a control at m = 1, namely a class whose curves have maximal
        endomorphism ring, where the criterion must NOT apply and recovery must fail. A
        method that recovers the ideal at m = 1 is not using the criterion and the
        attribution is wrong. Sampled parameters recorded. If the relayed statement
        fails, A4 survives via the elementary ascent route and only its cost constant
        changes - the two routes are implemented separately for this reason.

  target_complexity:
    time_exponent: >-
      For the WITHIN-CLASS ADDRESS, or vectorization, problem on classes with
      h(D_K) = 1, conditional on H-ADDR-1 and H-ADDR-2: (log p)^{O(1)} whenever f is
      (log p)^{O(1)}-smooth, and in general (log p)^{O(1)} times the largest prime
      power dividing f raised to 1/2 + o(1), after f is factored. That is exponent 0 in
      p on the smooth-f subfamily, against exponent 1/4 in p for the generic ordinary
      case. FOR THE ECDLP: exponent 1/2, UNCHANGED, and no claim of any kind is made
      there.
    memory_exponent: >-
      O(log p) for the vertical path and the pairing meter - polynomial memory, in
      contrast to the meet-in-the-middle crater search whose Otilde(p^{1/4}) time is
      paired with Otilde(p^{1/4}) memory in its table variant. The memory advantage is
      as large as the time advantage on this family and is stated because a
      polynomial-memory algorithm and a p^{1/4}-memory algorithm are not
      interchangeable.
    best_known: >-
      Isogeny and address problem for ordinary curves: Galbraith's algorithm at
      Otilde(q^{1/4}) field operations "as long as the conductor is not divisible by
      any large primes", relayed by search engine with the paper unread, improved for
      ascent by Galbraith-Gilchrist-Robert 2025, abstract fetched, which itself reports
      an improvement "when the curves have a small crater (super-polynomial in size)".
      ECDLP: Pollard rho at 0.886*sqrt(N) with negation, automorphism-discounted at the
      crater (KN-TECH-018) - untouched.
    hidden_overhead: >-
      Four disclosed items, and the first is the largest. First, factoring f costs a
      subexponential L[1/2] at cryptographic scale and is charged separately, never
      absorbed into the polynomial claim. Second, the ell^k-torsion field extension
      degree is the dominant unmeasured risk and can be large; it is measured at toy
      scale and NOT extrapolated. Third, the (log p)^{O(1)} conceals modular arithmetic
      and Miller-loop constants that are large in practice. Fourth, the comparison to
      Otilde(q^{1/4}) is against a cited exponent, not a run implementation, so the
      improvement is a comparison of a measured slope to a published exponent and is
      labelled as such throughout.
    tradeoff_note: >-
      The address routine is inherently sequential along the vertical path, so
      parallelisation gains only across independent instances - unlike the
      meet-in-the-middle crater search it replaces, which parallelises with van
      Oorschot-Wiener. On a family where the crater search is trivial that is a
      non-issue; on any family where the crater is large the tradeoff reverses and the
      published algorithm wins. The address cost is a one-time preprocessing per class
      and amortises over instances, which is stated here rather than converted into a
      query exponent.

  dominated_by: >-
    On the address and isogeny problem, DOMINATED BY Galbraith's Otilde(q^{1/4})
    algorithm in generality, since it needs no h(D_K) = 1 and no free orientation, and
    by Galbraith-Gilchrist-Robert 2025 on the ascent subroutine, which does with
    self-pairings and without a free orientation what A1 and A2 do with one. This
    record beats neither in generality and is very probably a specialisation of both.
    On the ECDLP axis, dominated by every row of the frontier because it supplies no
    ECDLP algorithm. Frontier rows checked before refusing null: BSGS (sqrt(N) time,
    sqrt(N) memory); Pollard rho with negation and van Oorschot-Wiener parallelisation
    (0.886*sqrt(N), O(1) memory); automorphism-discounted rho at the crater
    (KN-TECH-018); multi-target sqrt(L*N); preprocessing S*T^2 = Omega(eps*N);
    Galbraith Otilde(q^{1/4}) for the isogeny problem; GGR 2025 for oriented ascent;
    Castryck-Houben-Merz for oriented vectorization when m^2 divides the discriminant;
    Bisson-Sutherland L[1/2] for endomorphism-ring computation; Kuperberg-style quantum
    subexponential vectorization, out of scope since only classical claims are made.
    Null is not available and is not written.
  sota_delta:
    time_exponent: >-
      Address problem on the h(D_K) = 1 family: 1/4 down to 0 in p, conditional on
      H-ADDR-1 and H-ADDR-2 and given f factored. ECDLP: 0, no change.
    memory_exponent: >-
      Address problem: 1/4 down to 0 in p against the table variant of the
      meet-in-the-middle; 0 against the low-storage GHS variant, which already runs in
      polynomial memory at Otilde(q^{1/4}) time. Both comparisons are stated because
      quoting only the favourable one would be dishonest.
    data_or_query_exponent: "0 - public data, no oracle queries."
    note: >-
      The honest summary: an exponent DOES move, on the address problem, on a subfamily
      of density about p^{-1/2}, conditional on two named heuristics, probably already
      known, and it moves NOTHING on the ECDLP. The delta this program should care
      about is the cross-lane one in A5 - a standing closure argument, that
      identification costs about p^{1/2}, has a family-sized exception, and the closure
      must be re-argued on the cost-functional leg.

  estimated_cost:
    implementation: high
    compute: medium
  compute_budget_note: >-
    Implementation is HIGH: pairings on ell^k-torsion over extension fields, a
    self-pairing ascent routine, an independent modular-polynomial ground truth, an
    address-to-ideal-class reduction, and four separate curve families with matched
    harnesses. Arm S at 7-9 bits is minutes. Arm C at 16-24 bits across four families
    and a decade of class sizes is tens of CPU-hours and REQUIRES the Coordinator scope
    decision flagged above. Arm V, the Dickman validation, is a bounded sieve plus
    factorisations of integers of size about sqrt(p) over the range 2^16 to 2^28 -
    under an hour - and it should be shared with IDEA-20260812-c49409's H-AUT-1 rather
    than duplicated.
  recommended_priority: medium

  relation_to_existing_records:
    contradicts_on_this_family: >-
      IDEA-20260807-c36472, which argues T5 dies on identification at about p^{1/2}
      functional evaluations. A4 says identification is polynomial when D_K is in
      {-3,-4}. The contradiction is scoped to that family and is the record's principal
      cross-lane deliverable.
    must_be_diffed_against: >-
      IDEA-20260811-c72830, the crater-minimised endomorphism-representation cost that
      is locally detectable so T5 passes and is nevertheless closed by two named
      obstructions; and IDEA-20260807-94f953, the descending direction with the smooth
      part of f governed by Dickman. A reviewer should require the nearby-object
      control result before accepting that this record is distinct from either.
    shares_a_heuristic_with: >-
      IDEA-20260812-c49409 H-AUT-1. H-ADDR-1 is the same assumption and its validation
      must be one artifact, not two.
