    NOT VERIFIED, and the label is the honest one rather than a hedge. A4 is very
    likely folklore among isogeny specialists: a WebSearch relay on 2026-08-29 quoted
    Galbraith's algorithm as running in Otilde(q^{1/4}) "as long as the conductor is
    not divisible by any large primes", which already isolates the crater search as
    the dominant term - so a reader who notes h(-3) = 1 gets A4 immediately. The
    Galbraith paper was NOT opened. The self-pairing ingredients are relayed from two
    corpus literature notes, KN-LIT-1400 and KN-LIT-7489, that BOTH carry an explicit
    "Not verified here" block saying they were bulk-seeded from the first two pages of
    a local PDF; the underlying papers were not fetched this session. The
    Galbraith-Gilchrist-Robert 2025 abstract WAS fetched verbatim from
    eprint.iacr.org/2025/1243 on 2026-08-29 and states an improvement "when the curves
    have a small crater (super-polynomial in size)" - which is the same lever as A3
    taken to its extreme, a crater of size one, and which is direct evidence that this
    direction is actively worked externally. Corpus checked: IDEA-20260807-c36472
    (T5 dies on identification at about p^{1/2} - directly contradicted by A4 on this
    family, and cited as the target); IDEA-20260807-94f953 (the descending direction
    and the smooth part of f, governed by Dickman - the closest neighbour, and A4's
    discriminating control is designed to separate its mechanism from this one);
    IDEA-20260811-444b45 (Castryck-Houben-Vercauteren assigned characters give the
    position modulo the square of the class group for free - the same "position is
    cheaper than assumed" theme by a different route, and the two should be read
    together); IDEA-20260811-c72830 (endomorphism-representation cost minimised at the
    crater, locally detectable, T5 PASSES, and nevertheless closed by two named
    obstructions - the nearest record in the corpus and the one this record must be
    diffed against by a reviewer). Nothing is claimed as new mathematics.

  citations:
    - ref: KN-LIT-1400
      provenance: retrieved
      claim: >-
        Galbraith, Gilchrist and Robert, "Improved algorithms for ascending isogeny
        volcanoes, and applications", eprint 2025/1243. Abstract states: "In 2024,
        Galbraith applied recently developed techniques for isogenies to improve the
        state-of-the-art for this problem. In this work, we focus on computing
        ascending isogenies with respect to an orientation. Our results apply to both
        ordinary and supersingular curves. We give a simplified framework for
        computing self-pairings, and show how they can be used to improve upon the
        approach from Galbraith to recover these ascending isogenies and eliminate a
        heuristic assumption from his work. We show that this new approach gives an
        improvement to the overall isogeny recovery when the curves have a small
        crater (super-polynomial in size)."
