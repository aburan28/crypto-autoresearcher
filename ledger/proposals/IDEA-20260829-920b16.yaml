idea:
  id: IDEA-20260829-920b16
  question_id: RQ-ECDLP-912694
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  class: composition

  title: >-
    THE CM AUTOMORPHISM IS A FREE, PUBLIC, CONSTANT-TIME ORIENTATION - which is the
    one ingredient the self-pairing machinery (Castryck-Houben-Merz;
    Galbraith-Gilchrist-Robert 2025) normally has to be GIVEN; combine it with
    h(-3) = h(-4) = 1, so that no horizontal search exists at all, and the within-class
    ADDRESS problem for a special-j class becomes polynomial in log p given the
    factorisation of f, versus Otilde(p^{1/4}) generically - so the identification
    barrier that closes the T5 reachability gate elsewhere does NOT hold in this
    family, and the closure must be re-argued on the cost-functional leg instead.

  object: >-
    TRACKED OBJECT. The AUTOMORPHISM SELF-PAIRING TRACE. For a curve E' in the class,
    let alpha(E') be the endomorphism of smallest degree in End(E') that is a rational
    multiple of the crater's zeta - concretely alpha = c times zeta, where c is the
    conductor of End(E') in O_K - and track the function s_k(E') defined as the order
    of the value of the Weil pairing e_{ell^k}(P, alpha(E') P) in the group of
    ell^k-th roots of unity, for P running over the ell^k-torsion of E'. What is
    retained per curve is a short vector of root-of-unity orders; the points, the
    curve equation, the isogeny path and the ideal are all discarded. Established
    families declared OFF-LIMITS as the primary lens: the automorphism-order function
    (IDEA-20260812-c49409), the rho discount (KN-TECH-018), Semaev and Groebner meters
    (RQ-JINV-8fc13a family), the Cl(O)-torsor Fourier spectrum
    (IDEA-20260826-228fa6), relation aggregation across the class
    (IDEA-20260808-031a59), and endomorphism witness lattices (KN-FIND-009, barred by
    its own scope). Candidates scored on (new / one-step propagation definable and
    measurable / survival depth): End(E') as an order (known, Kohel; testable but
    EXPENSIVE - it is the thing we want to avoid computing); the conductor c alone
    (new-ish, testable, but it is exactly what the self-pairing computes, so it is the
    conclusion rather than the object); the WEIL SELF-PAIRING TRACE (new in this
    corpus / testable - its one-step propagation is the pairing compatibility relation
    that the pairing of images equals the pairing of preimages raised to the degree /
    survives the entire volcano, degrading by an exact factor of ell per descending
    step, which is what makes it a level meter); the modular polynomial evaluation
    (known, and it is the baseline being beaten). KN-OPEN-019 applies: sketch, not
    taxonomy.

  lossy_projection_test: >-
    The map sending a pair consisting of a curve and an ell^k-torsion point to the
    order of the self-pairing value produces a single integer dividing ell^k. It is
    massively lossy - the point is destroyed, and so is everything about the curve
    except one arithmetic invariant of its endomorphism ring. What it discards is
    discarded COMPATIBLY with isogenies: the Weil pairing satisfies the relation that
    the pairing of the images under an isogeny equals the pairing of the arguments
    raised to the degree of that isogeny, so pushing forward along an ell-isogeny
    multiplies the pairing exponent by ell and the tracked order therefore propagates
    deterministically, dropping by exactly one ell-adic unit of precision per
    descending step. It is NOT a change of coordinates - from a root of unity one
    recovers neither the point nor the curve, and two curves at the same volcano level
    are deliberately identified by this projection, which is precisely why it can
    serve as a level meter and precisely why it cannot serve as an address by itself.
    The test passes, and its failure mode, namely identifying too much, is what the
    observation-collision audit below is built to expose.

  claim: >-
    Let E_0/F_p be ordinary with j = 0 and p congruent to 1 mod 3, or j = 1728 and p
    congruent to 1 mod 4; write D_K = -3 (resp. -4) and 4p - t^2 = |D_K| f^2. Five
    statements, A1-A5, of which A1-A2 are asserted as derivations and A3-A5 as
    conditional and heuristic-dependent.

    (A1) FREE ORIENTATION. Every curve in the F_p-isogeny class of E_0 carries a
    primitive orientation by its own endomorphism ring, an order Z + c O_K for some c
    dividing f, and for the crater vertex E_0 the orientation is given by the curve
    equation itself: the map sending (x, y) to (omega x, y), with omega a cube root of
    unity in F_p, is evaluable in ONE field multiplication. This is the only known
    family of ordinary curves with a publicly given, constant-time-evaluable primitive
    orientation. For a generic ordinary curve the minimal non-scalar endomorphism has
    degree about |D|/4, which is about p (IDEA-20260807-9fb27c), so its orientation is
    not free in any sense.

    (A2) LEVEL METER. For a curve E_d at depth d below E_0 in the ell-volcano, the
    element alpha_d = ell^d times zeta is the minimal multiple of zeta lying in
    End(E_d), and it annihilates the ell^k-torsion of E_d for every k at most d. Hence
    the automorphism self-pairing e_{ell^k}(P, alpha_d P) is trivial for k at most d
    and non-trivial for k = d + 1 at a generic P. THEREFORE the volcano depth of a
    vertex below a special-j crater is READ OFF as the least k at which the
    self-pairing becomes non-trivial - at the cost of Miller-loop pairing evaluations,
    without computing End(E), without evaluating a modular polynomial, and without
    walking the volcano.

    (A3) NO HORIZONTAL COMPONENT. Because h(-3) = h(-4) = 1 the crater of the class is
    a single vertex (IDEA-20260812-c49409 D1; IDEA-20260829-882739 C1). Therefore the
    within-class ADDRESS problem - given E' in the class, output the ideal class
    connecting E' to the canonical base point E_0 - has NO horizontal component
    whatsoever. Its entire content is the vertical path, whose length is the sum over
    ell dividing f of the ell-adic valuation of f, and whose per-step direction is
    determined, since ascending is unique at every non-crater vertex.

    (A4) THE CONDITIONAL EXPONENT STATEMENT. Assuming Heuristics H-ADDR-1 and
    H-ADDR-2 below, the within-class address problem for a class with h(D_K) = 1 costs
    the sum, over prime powers ell^e exactly dividing f, of e times Otilde(sqrt(ell))
    field operations after f is factored - which is (log p)^{O(1)} times
    P^+(f)^{1/2 + o(1)}, polynomial in log p whenever f is (log p)^{O(1)}-smooth -
    versus Otilde(p^{1/4}) for the same problem on a generic ordinary class, since
    Galbraith's isogeny algorithm has its q^{1/4} dominated by the CRATER search. The
    exponent that moves is the exponent of the address and vectorization problem, from
    1/4 in p to 0 in p on this family. THE EXPONENT OF THE ECDLP DOES NOT MOVE AND IS
    NOT CLAIMED TO: transport along the recovered path preserves the group order by
    Tate's theorem, so the solved address buys the attacker a curve, not a cheaper
    discrete logarithm.

    (A5) THE CROSS-LANE CONSEQUENCE, which is why this record is worth running.
    IDEA-20260807-c36472 argues that the T5 reachability gate dies on IDENTIFICATION,
    which costs about h, roughly p^{1/2}, functional evaluations unless goodness is
    locally detectable. A4 says identification is POLYNOMIAL on the family with D_K in
    {-3,-4}. So on this family T5 passes its identification leg, and the standing
    closure of the within-class direction must rest entirely on the OTHER leg, namely
    that no ECDLP cost functional varies across the class. That is a strictly stronger
    burden than the corpus currently discharges, and naming it is the deliverable even
    if A4 turns out to be folklore.

  mechanism: >-
    Three independent facts compose. First, extra automorphisms are endomorphisms of
    degree one, so a special-j curve hands the attacker an orientation for free -
    every other ordinary curve must pay Bisson-Sutherland-scale work to obtain one,
    and then pay again to evaluate it. Second, an orientation makes self-pairings
    available, and the self-pairing is compatible with oriented isogenies, so its
    degeneracy order is a numerical invariant of the volcano level that can be read by
    Miller loops rather than by graph traversal. Third, the class group of the maximal
    order is trivial for exactly the two discriminants that carry extra automorphisms,
    so the class has no horizontal degrees of freedom at all - the entire class is a
    union of vertical fibres over ONE point. Path-finding is generically hard because
    the crater is a large torsor and the search is horizontal; remove the torsor and
    only the vertical part remains, and the vertical part is locally determined. The
    mechanism therefore predicts that the address cost is controlled by the
    FACTORISATION of f and not at all by the class size, which is the discriminating
    prediction against the standing "smooth conductor makes it easy" reading.

