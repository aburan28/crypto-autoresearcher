idea:
  id: IDEA-20260811-73e9a5
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-f58f22
  axis: A3
  claim_tier: toy

  title: >-
    THE TWO BRACKETING ENSEMBLES THAT LANE L13 HAS NEVER HAD, AND WITHOUT WHICH
    "THE CLASS HELPS" IS UNFALSIFIABLE -- an isogeny class is h groups of order N
    whose identification maps are cheap in one direction; bracket it below by the
    SAME-N-DIFFERENT-p ENSEMBLE (h curves over h different base fields, all of
    prime order N, whose identification maps exist but cost a discrete logarithm
    to compute) and above by the ISOMORPHIC-MODEL ENSEMBLE ((p-1)/2 twisted
    Weierstrass models of ONE curve, whose identification maps are one field
    inversion), and every advice-transfer claim in the lane becomes a
    three-armed measurement with a predicted answer in each arm -- retention 1/N
    below, 1 above, and 1-at-a-charged-addressing-cost in the middle; the arm
    that matters is the TOP one, because it already supplies h "different-looking"
    groups with free transport WITHOUT ANY ISOGENY, so any claimed class benefit
    that the top arm reproduces is not an isogeny phenomenon at all

  class: control

  claim: >-
    (A) THE PROBLEM THIS RECORD EXISTS TO FIX. Every advice/preprocessing claim in
    lane L13 has the form "advice built on curve A retains its value on curve B
    because they are isogenous". That sentence has two candidate explanations and
    the lane has never separated them:
      EXPLANATION 1 -- MULTIPLICITY. The value comes from there being h groups of
        the same order N available, whatever their relationship.
      EXPLANATION 2 -- CHEAP IDENTIFICATION. The value comes from the
        identification map between them being efficiently computable.
    A measurement on isogenous curves alone cannot distinguish these, because
    isogenous curves have both properties at once. The fix is two ensembles that
    each have exactly one of them.

    (B) NULL-A -- THE SAME-N-DIFFERENT-p ENSEMBLE (multiplicity WITHOUT cheap
    identification). Fix a prime N. Find distinct primes p_1, ..., p_m and curves
    E_i / F_{p_i} with #E_i(F_{p_i}) = N (at toy scale by direct search over p
    and curve coefficients with a point count; at larger scale by the CM method
    from a discriminant with N representable, which is the standard
    curve-of-prescribed-order construction). Every E_i has a group isomorphic to
    Z/N, so the ensemble has EXACTLY the same "h groups of order N" shape as an
    isogeny class. But the identification E_i -> E_j is a group isomorphism whose
    computation requires a discrete logarithm: there is no isogeny between curves
    over different fields, and no known map cheaper than solving the problem
    itself. [fact, given that no efficient isomorphism is known; the record does
    not claim none exists, which would be a hardness claim it cannot make.]
      PREDICTED MEASUREMENT: advice built on E_1 retains value 1/N on E_2 -- the
      chance baseline. ANY measured retention above chance in this arm is an
      instrument leak (most likely the harness sharing an RNG, a point ordering,
      or an index derived from k) and it INVALIDATES the class arm of the same
      run, because the same leak would be present there.

    (C) NULL-B -- THE ISOMORPHIC-MODEL ENSEMBLE (cheap identification WITHOUT
    isogeny). Fix ONE curve E: y^2 = x^3 + ax + b over F_p. For each u in F_p^*,
    the twisted model E^{(u)}: y^2 = x^3 + u^4 a x + u^6 b is F_p-isomorphic to E
    via (x, y) -> (u^2 x, u^3 y), giving (p-1)/2 distinct-looking Weierstrass
    equations of the same curve, all with the same j, the same t, the same N, and
    the same endomorphism ring. The identification map is one field inversion and
    two multiplications. [fact, elementary]
      THIS IS THE ARM THAT MATTERS AND IT IS THE RECORD'S SHARPEST POINT: it
      supplies MORE "different-looking groups of order N with free transport" than
      the isogeny class does -- (p-1)/2 ~ N against h ~ N^{1/2} -- and it needs no
      isogeny, no class group, no volcano, and no GRH. THEREFORE: any claimed
      benefit of the isogeny class that NULL-B also exhibits is not a benefit of
      the isogeny class. It is a benefit of writing the same curve down
      differently, which is free and which nobody would call a resource.
      PREDICTED MEASUREMENT: retention 1 at O(1) transport cost.

    (D) THE MIDDLE ARM AND THE DISCRIMINATION TABLE. The isogeny class sits
    between the two nulls and differs from NULL-B in exactly one respect: the
    identification map is cheap to APPLY once known and expensive to FIND for a
    specified pair (T5). Predicted three-arm table for "value of advice built on
    member 1, measured on member 2":
        NULL-A (different p)      : retention 1/N   ; transport cost: a DLP
        ISOGENY CLASS             : retention 1     ; transport cost: charged,
                                    Otilde(1) per step given a path, plus the
                                    addressing cost that IDEA-20260811-61ecae
                                    prices at h/L
        NULL-B (isomorphic models): retention 1     ; transport cost: O(1)
      READ THE TABLE, NOT THE MIDDLE ROW. The class differs from the free arm only
      by a cost, never by a retention. A lane whose deliverable is "retention 1"
      has therefore discovered NULL-B, and a lane whose deliverable is a cost has
      discovered a cost. That is the whole content and it is why this instrument
      is worth building before any further L13 measurement.

    (E) THE PLANTED-SIGNAL DIRECTION, BECAUSE A NULL BATTERY WITH ONLY NEGATIVE
    ARMS IS HALF AN INSTRUMENT (RQ-INSTR-f8faa0, GOAL-ENDO-001 C4). Plant a
    detectable benefit and require the instrument to see it: in NULL-A, additionally
    hand the measurement the isomorphism Z/N -> E_2(F_{p_2}) as an oracle;
    retention must jump from 1/N to 1. An instrument that does not detect the
    planted benefit cannot be trusted to report its absence.

  resource_label: >-
    NONE -- instrumentation, in the sense of lane L14 (RQ-INSTR-f8faa0). NO NEW
    TAXONOMY ENTRY. The record's only structural observation about the taxonomy is
    that R8 ("multi-instance / preprocessing structure") silently bundles the two
    explanations of (A), and that a future revision might want to split it; that
    is offered as forward guidance, not proposed as an edit.

  admissibility: not_applicable_instrument

  admissibility_argument: >-
    An instrument consumes no resource and mounts no attack. It is filed because
    the campaign's own standard (docs/inventor-protocol.md section 3, controls
    before belief; DECOMPOSITION.md L14) requires every measured quantity to have
    a matched null of the same shape, and lane L13's central measured quantity --
    advice retention across transport -- currently has one null
    (IDEA-20260807-0e8977's randomly relabelled table) that tests the TABLE and
    none that tests the ENSEMBLE.

  object_first_candidate:
    tracked_object: >-
      THE IDENTIFICATION MAP between two encodings of Z/N, tracked by its
      COMPUTATIONAL COST rather than by its existence. Every ensemble in this
      record has all identification maps (they are all cyclic groups of order N);
      what varies across the three arms is only what it costs to write one down.
    lossiness: >-
      GENUINELY LOSSY. The projection sends a pair of curves to a single number,
      the cost of identifying them, discarding both curve equations, both point
      sets, the field, the trace and the endomorphism ring. Nothing about either
      curve is recoverable from the number.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED, AND THE PROPAGATION RULE IS THE
      TRIANGLE INEQUALITY: cost(A -> C) <= cost(A -> B) + cost(B -> C), with the
      composition of identifications as the operation. What is discarded is
      discarded compatibly, because composing identifications requires nothing
      about the curves beyond the maps themselves. The retained number therefore
      propagates deterministically under the target's operation (composition), and
      the object is a genuine one -- it is, in fact, the object the whole axis is
      about, and this record is the one place in the batch where it is tracked
      alone rather than as a term in someone's cost.
    survival_score: >-
      Survives arbitrary composition within an ensemble. Dies when the ensembles
      are mixed (there is no identification of an F_{p_1}-curve with an
      F_{p_2}-curve that is not a DLP, so the triangle inequality is vacuous
      across arms) -- which is exactly the property that makes NULL-A a null.

  mechanism: >-
    Two explanations, two ensembles, each isolating one. This is the standard
    two-arm design and its only novelty here is the choice of arms: the corpus's
    existing nulls for this lane randomise the ADVICE (0e8977's relabelled table)
    or the CURVE within a matched class, and neither varies the identification
    cost while holding the group-multiplicity shape fixed. NULL-A holds
    multiplicity and destroys cheap identification; NULL-B holds cheap
    identification and destroys the isogeny.

  why_not_a_renamed_known_approach: >-
    (1) IDEA-20260807-0e8977's transport null battery randomly relabels a table of
      identical size and requires retention to be affine in the mixing fraction
      alpha. That nulls the TABLE. This nulls the ENSEMBLE. The two compose: run
      0e8977's alpha sweep inside each of this record's three arms and the result
      is a 2-D design in which alpha and the ensemble are separately identified.
    (2) IDEA-20260807-0ff796 (lane L1) uses the (p-1)/2 F_p-isomorphic Weierstrass
      models as a GAUGE degree of freedom -- the same objects as NULL-B, used to
      argue that within-class differences in relation yield must be sampling noise
      or equation-choice variation. This record uses the same objects for a
      different purpose (as the free-transport bracket in an advice measurement)
      and the overlap is declared rather than minimised: NULL-B is not a new
      object, it is an existing object put in a new arm.
    (3) IDEA-20260807-d73e83 compares against "a matched random curve at the same
      p and same N in a different isogeny class" (screened by grep). That is a
      DIFFERENT null -- same p, different class -- and it cannot exist when N is
      prime and the trace is thereby determined, so it is presumably used for a
      composite-order or subgroup-order setting. NULL-A deliberately changes p in
      order to keep N EXACTLY fixed, which is the only way to get h groups of the
      same prime order that are not isogenous.
    (4) Standard "different group, same order" controls in the DLP literature are
      exactly this idea; the record claims no novelty for the concept and claims
      only that lane L13 does not currently have one.

  predictions:
    - observable: advice retention across ensembles
      metric: >-
        fraction of advice-table lookups that resolve correctly on the second
        member, for a fixed advice construction, measured identically in all three
        arms
      direction: different
      minimum_effect: >-
        NULL-A at the chance baseline 1/N (i.e. indistinguishable from zero at any
        feasible sample size); isogeny class at 1.000; NULL-B at 1.000. Any
        NULL-A value distinguishable from chance falsifies the instrument, not the
        mathematics, and voids the run.
    - observable: charged transport cost per instance
      metric: field operations to move one instance between two members, per arm
      direction: different
      minimum_effect: >-
        NULL-B O(1) (a handful of multiplications); isogeny class Theta(L_path)
        with the path given, and the addressing cost separately reported;
        NULL-A undefined/unbounded (report as "no algorithm", never as a large
        number, since reporting a number would imply an algorithm exists).
    - observable: planted-identification arm
      metric: retention in NULL-A when the isomorphism is supplied as an oracle
      direction: higher
      minimum_effect: >-
        Must rise from 1/N to 1.000. Failure to detect the planted benefit means
        the instrument cannot see identification at all and every other cell is
        uninterpretable.
    - observable: ensemble size available at fixed p
      metric: number of usable members, per arm, at matched p
      direction: different
      minimum_effect: >-
        NULL-B must exceed the isogeny class by roughly N^{1/2} ((p-1)/2 against
        h ~ p^{1/2}). This is the arithmetic behind claim (C) and it should be
        confirmed by counting rather than asserted, because it is the fact that
        makes the top bracket bite.

  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE. Confirm by construction that NULL-A is populatable
      at toy scale: for a fixed prime N of 16-20 bits, search p in an interval and
      curves over F_p for #E(F_p) = N, and count how many distinct p yield at
      least one such curve. If fewer than a handful exist in a searchable range,
      the null is not populatable at that N and the record must switch to the CM
      construction, which is more work and should be known about before anyone
      starts.
      STAGE 1 -- MINUTES TO AN HOUR. Build the three ensembles at N ~ 2^16-2^20,
      construct a small known-log advice table on member 1 of each, and measure
      retention and transport cost on member 2, with the planted arm and the
      chance-baseline arm. One code path, one estimator, three ensembles -- the
      instrument's validity depends on the arms sharing everything except the
      ensemble.
      STAGE 2 -- OPTIONAL. Compose with IDEA-20260807-0e8977's alpha sweep to get
      the 2-D design.
    controls:
      - >-
        CHANCE-BASELINE ARM (blocking): the retention estimator applied to a table
        built for a curve and evaluated against a FRESHLY SAMPLED unrelated k.
        Defines the estimator's zero and is what "1/N" is measured against.
      - >-
        SHARED-RNG LEAK CHECK (blocking): re-run NULL-A with independent RNG
        streams per member. If retention changes, the arms were coupled and every
        number in the run is void. This is the specific failure mode most likely
        to manufacture a false positive in the class arm.
      - >-
        PLANTED-IDENTIFICATION ARM (blocking, positive direction).
      - >-
        IDENTITY ARM: member 2 = member 1. Retention must be exactly 1.000 and
        transport cost exactly 0 in every arm; nonzero cost here is instrument
        overhead to be subtracted everywhere else.
    required_metrics:
      - retention per arm with confidence intervals, against the measured chance baseline
      - transport cost in field operations per arm, from an explicit counter
      - ensemble sizes actually constructed, per arm
      - planted-arm retention
      - identity-arm retention and cost
      - RNG stream provenance per member

  controls:
    - Chance-baseline arm (defines zero).
    - Independent-RNG re-run of NULL-A (leak check).
    - Planted-identification arm (positive control).
    - Identity arm (overhead subtraction).

  confounders:
    - >-
      NULL-A IS EXPENSIVE TO POPULATE. Finding many p with a curve of exactly
      prime order N is a search; at toy scale it is feasible, at cryptographic
      scale it needs the CM method and a suitable discriminant. If the ensemble
      ends up with only two or three members, the arm is still valid (it is a
      null, not a statistic) but its power to detect a leak is small and that must
      be reported.
    - >-
      NULL-B IS "TOO GOOD" AND CAN BE MISREAD. Its retention of 1 is trivial and
      must never be presented as a positive result about anything. Its role is to
      show that retention 1 is available for free, so that retention 1 in the class
      arm is not news.
    - >-
      THE ESTIMATOR CAN LEAK k. Any retention estimator that indexes by something
      derived from the secret will report above-chance retention in every arm
      including NULL-A. The leak check is blocking for exactly this reason.
    - >-
      DIFFERENT p MEANS DIFFERENT FIELD ARITHMETIC COSTS. Cross-arm cost
      comparisons must be in field operations, not seconds, or NULL-A's larger or
      smaller p will masquerade as an effect.
    - >-
      "NO ALGORITHM" IS NOT "EXPENSIVE". For NULL-A the record must report the
      absence of a known identification algorithm, never a synthetic cost, since
      writing a number would imply a construction that does not exist.

  falsification_conditions:
    - >-
      NULL-A shows retention above chance with independent RNG streams. The
      instrument leaks; every L13 retention number ever produced by the same code
      path becomes suspect, which would be the single most valuable outcome of
      this record.
    - >-
      NULL-B shows retention below 1. The isomorphism transport is implemented
      wrongly and the class arm's transport, which is strictly more complex, cannot
      be trusted either.
    - >-
      The planted arm fails to reach 1. The instrument cannot detect the very
      thing it exists to detect.
    - >-
      NULL-A turns out to be populatable only with members whose p are all
      congruent in some way that couples them. Then the arm is not independent and
      must be rebuilt.
    - >-
      Someone exhibits an efficient identification map between curves of the same
      prime order over different fields. NULL-A stops being a null, the whole
      three-arm design collapses, and the finding is far more important than this
      record.

  interpretation_limits:
    - >-
      An instrument produces no mathematical result. It licenses no statement
      about attacks, exponents, or the class, and its outputs are only ever
      preconditions for believing other records' numbers.
    - >-
      Toy scale, claim_tier toy. NULL-A at cryptographic N is a CM construction
      exercise and is out of scope here.
    - >-
      The three-arm table's middle row depends on the transport implementation the
      lane does not yet have (IDEA-20260807-d7a5d4 records that the harness
      contains zero isogeny code). Until that exists, only NULL-A and NULL-B are
      runnable, and running just those two is still worthwhile because it
      calibrates the estimator before the interesting arm exists.
    - >-
      P2: not adjacent. No factor base appears.
    - >-
      P3: does not fire. No cost is lowered anywhere.

  assumptions:
    - >-
      For N prime and p fixed, a curve over F_p with #E(F_p) = N determines the
      trace t = p + 1 - N, hence the isogeny class; so "same p, same N, different
      class" does not exist in this setting and the null MUST change p. [fact,
      elementary, and it is the reason NULL-A takes the form it does.]
    - >-
      No efficient algorithm is known for the isomorphism between the point groups
      of two curves of the same prime order over different base fields; computing
      one is equivalent to a discrete logarithm. [recall-confident; the record
      relies on "no known algorithm", not on a hardness theorem, and says so.]
    - >-
      The u-twist family E^{(u)} is F_p-isomorphic to E with the stated map.
      [fact, elementary]
    - >-
      WEB VERIFICATION UNAVAILABLE THIS SESSION. No external check was made of
      whether the same-order-different-field ensemble is standard in the
      preprocessing literature; it very likely is, and the record claims novelty
      only for its use as a lane-L13 null.

  heuristic_assumptions:
    - id: HD-1
      statement: >-
        The number of primes p in an interval [X, 2X] admitting a curve over F_p
        with exactly N points is large enough that NULL-A can be populated with
        m >= 8 members for N of 16-20 bits by direct search.
      rigorous_support: >-
        By Deuring/Waterhouse a curve with trace t = p + 1 - N exists over F_p
        whenever |t| < 2 sqrt(p) and the usual ordinary conditions hold, so the
        question is a counting one over p in a range, and the expected count is
        governed by the Hurwitz class number weight h(t^2 - 4p). [The existence
        criterion is standard and is relayed, not re-verified.]
      distribution_imitated: >-
        The standard heuristic that curve orders near p are distributed like
        integers near p weighted by class number -- the same heuristic the
        campaign already uses when sampling ordinary (p, t) pairs.
      validation_plan: >-
        DIRECT: for three fixed primes N at 16, 18 and 20 bits, count the p in a
        searchable range that admit a curve of exactly N points, by point counting
        over candidate curves. Compare the observed count against the class-number
        weighted expectation. TAIL CHECK: the largest gap between successive usable
        p. TRANSFER: none; this is a feasibility check for the instrument, not a
        result, and if it fails the instrument switches to CM construction.

  proof_search_map:
    bottleneck: >-
      Populating NULL-A. The whole three-arm design rests on the existence of a
      usable ensemble of same-order curves over different fields; without it the
      lane keeps its unfalsifiable form.
    baseline_embedding:
      parameter_slice: >-
        m = 1 (one member per ensemble). Every arm degenerates to the identity arm
        and must report retention 1.000 and cost 0.
      reproduction_check: >-
        The identity arm is exactly this check and is blocking.
    observation_collision:
      observable: >-
        "Retention 1.000", used as the certificate that transport preserved the
        advice.
      distinct_preimage_search: >-
        SUCCEEDS IMMEDIATELY AND THAT IS THE RECORD'S ENTIRE THESIS: NULL-B
        produces retention 1.000 with no isogeny anywhere. So retention alone is
        NOT an identifiable certificate of any class phenomenon, and every L13
        record whose deliverable is a retention number is reporting an observable
        with a free preimage. The separating condition is the COST, not the
        retention, and that is what the three-arm table forces into view.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (retention) fixed at 1 and vary the forgotten
          structure (how the members are related); the intrinsic invariant that
          distinguishes the resulting ensembles is the identification cost.
        predicted_gain: >-
          Converts an unfalsifiable claim ("the class helps") into a two-sided
          measurement with a predicted value in each arm.
    quantifier_order: >-
      FORALL advice-transfer claims C in lane L13, EXISTS an ensemble arm (NULL-A
      or NULL-B) that reproduces C's observable without C's mechanism, UNLESS C's
      deliverable is a cost rather than a retention. The record asserts this as a
      design principle to be checked case by case against the lane's existing
      records, not as a theorem about all possible claims.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Retention is not an identifying observable for class structure; cost is."
        It can never certify that a given cost measurement is correct, nor say
        anything about non-advice functionals.
      nearby_object_control: >-
        The record IS a nearby-object control, so its own control is the identity
        arm plus the leak check. A control battery whose arms cannot be
        distinguished from each other by the instrument is not a control battery,
        and the planted arm is what proves they can.
    proof_obligations:
      - claim: NULL-A is populatable at toy scale.
        responsibility: feasibility
      - claim: NULL-A's identification requires a DLP.
        responsibility: scope
      - claim: NULL-B's identification is O(1) and its ensemble is larger than the class.
        responsibility: size
      - claim: The estimator's chance baseline is 1/N and is measured, not assumed.
        responsibility: baseline
      - claim: The planted arm reaches retention 1.
        responsibility: correctness

  reachability_gate: >-
    THE GATE IS WHAT THE THREE ARMS MEASURE. NULL-B is the gate wide open (cost
    O(1)); NULL-A is the gate shut (no algorithm); the isogeny class is the gate
    ajar in one direction only. Reading the lane's results against this bracket is
    the cheapest way to see that the class's entire contribution lives in the
    gate's cost and nowhere else.

  target_complexity:
    time_exponent: >-
      No algorithm is proposed. Instrument cost: O(m) advice constructions and
      O(m) transports at toy N, i.e. minutes. NULL-A's population search is the
      dominant cost and is a point-counting search over candidate p.
    memory_exponent: O(table size) per arm, toy.
    best_known: >-
      The lane's existing null is IDEA-20260807-0e8977 (relabelled table, alpha
      sweep). There is no existing ensemble null, which is the gap.
    hidden_overhead: >-
      Nothing asymptotic. The concrete risk is that NULL-A is hard to populate,
      which HD-1 addresses and which Stage 0 settles before anything else is built.
    tradeoff_note: not applicable to an instrument.

  sota_delta: >-
    ZERO; an instrument produces no speedup and none is claimed. Its measurable
    contribution is to the lane's falsifiability: it supplies the first ensemble
    null, converting a retention claim from a one-armed observation into a
    three-armed one with a predicted value per arm.
  dominated_by: >-
    AS AN ATTACK: n/a (no result claimed). Frontier rows checked so the record's
    own baseline talk is honest: parallel rho 0.886*sqrt(N)/O(1) memory
    (KN-TECH-001, KN-TECH-006); automorphism-discounted rho (KN-TECH-018); BSGS
    (KN-TECH-031, KN-TECH-035); CGK preprocessing frontier (KN-LIT-013);
    Kuhn-Struik sqrt(M*N).
    AS AN INSTRUMENT: complementary to IDEA-20260807-0e8977 rather than dominated
    by it; the two null different things and compose into a 2-D design. Dominated
    by nothing in the repository, because no ensemble null exists there -- a
    statement established by grep and reported with that provenance.

  estimated_cost:
    implementation: >-
      low for NULL-A and NULL-B (point counting, twist maps, a small known-log
      table). The class arm requires the transport code that
      IDEA-20260807-d7a5d4 specifies and the harness does not have; the record is
      deliberately designed so that two of three arms run without it.
    compute: low. Minutes to an hour at toy N.
  recommended_priority: >-
    high as a prerequisite, low as a discovery. It should run BEFORE any further
    L13 retention measurement, because it can invalidate the estimator those
    measurements would use, and it is cheap enough that doing it first costs
    nothing.

  honest_prior_of_survival: >-
    0.97 that the three-arm design is sound as written. 0.75 that NULL-A is
    populatable by direct search at 16-20 bits within a modest budget (HD-1).
    0.15 that the leak check finds an actual leak in the existing estimator --
    low, but that 0.15 is worth an hour because a leak would void prior numbers.
    0.99 that NULL-B shows retention 1, which is why NULL-B is a bracket and not
    an experiment.

  novelty_status: adaptation

  novelty_screen:
    performed_on: '2026-08-11'
    corpus_screened: >-
      grep of ledger/proposals/ for "same N|same order.*different p|different base
      field" -- 25 matches reviewed; the closest are IDEA-20260807-d73e83
      ("a matched random curve at the same p and same N in a different isogeny
      class", a null that cannot exist for prime N with the trace determined) and
      IDEA-20260807-0085af (random-isomorphism null for a different diagnostic).
      IDEA-20260807-0ff796 (lane L1) was read in part and uses the (p-1)/2
      isomorphic Weierstrass models as a GAUGE degree of freedom -- the same
      objects as NULL-B in a different role, and that overlap is declared in
      why_not_a_renamed_known_approach rather than omitted. IDEA-20260807-0e8977
      (the lane's existing transport null battery) read by title and abstract.
      DECOMPOSITION.md L14 and RQ-INSTR-f8faa0 read in full.
    external_screen: >-
      NOT PERFORMED (WebSearch and WebFetch failed all session). "Different group
      of the same order" is a standard control in the DLP literature and this
      record claims no novelty for the concept; what it claims is that lane L13
      does not have one, which is an internal statement established by grep.
    verdict: >-
      ADAPTATION. Standard control methodology, standard objects, applied to a
      lane that lacks it. The one genuinely non-obvious element is claim (C)'s
      observation that the isomorphic-model ensemble is LARGER than the isogeny
      class and free, which reframes "many encodings" as a non-resource, and even
      that is an arithmetic remark rather than a discovery.

  discriminated_from:
