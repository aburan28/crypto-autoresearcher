# IDEA-20261004-0a0d0d
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-0a0d0d
  question_id: RQ-JINV-8fc13a
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 17 has degree 289 and multiplication by 16 has degree 256
  class: measurement
  claim: >-
    Multiplication by 17 has degree 289. Multiplication by 16 has
    degree 256. Two hundred eighty-nine exceeds two hundred fifty-six
    by 33. The product of the two degrees is 73984. Their sum is 545.
    The gap is a map degree, not an ECDLP exponent and not the degree
    pair 256 and 225.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Seventeen squared is 289. Sixteen squared is 256. Two maps of
    degree 256 have gap 0 and product 65536. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The multipliers 17 and 16 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 33.
    baseline_embedding:
      parameter_slice: The degrees 289 and 256.
      reproduction_check: >-
        Two readers must agree that 17 squared is 289 and that 16
        squared is 256.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 256 drops the gap. Two maps of
