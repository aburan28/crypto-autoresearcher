  assumptions:
    - >-
      p greater than 3, E ordinary, j in {0, 1728}, and the relevant odd prime ell
      divides f so that descending isogenies exist at all. Where ell does not divide f
      the fan is empty and F1-F3 are vacuous - a fact this record shares with, and
      inherits from, IDEA-20260829-882739.
    - >-
      Deduplication of codomains is by F_p-ISOMORPHISM. The entire claim is a
      statement about a fibre of the map from a kernel to an F_p-isomorphism class, so
      a deduplication that uses j alone, or that uses geometric isomorphism, measures a
      different map and would produce a different integer for a reason unrelated to
      the mechanism.
    - >-
      Aut is taken as the F_p-rational automorphism group. For ordinary curves this
      equals the geometric automorphism group (see IDEA-20260829-a250ee), so the
      distinction is not load-bearing here - but it is asserted there rather than
      assumed here.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks only.

  proof_search_map:
    bottleneck: >-
      Whether the exit fan from the automorphism locus is ell - (D_K/ell) wide or
      (ell - (D_K/ell))/m wide. Every downstream count - how many curves are one step
      off the locus, how often a walk lands back on it, what fraction of a class is
      within distance d of the special vertex - is off by a factor of m to the power d
      if this is wrong, and that is not a constant when d grows with log f.
    baseline_embedding:
      parameter_slice: >-
        Setting m = 1, which is any D_K outside {-3,-4}, makes the action trivial, the
        partition all-singletons, the child count ell - (D_K/ell), and the edge
        multiplicity symmetric - which is the standard regular-volcano picture. The
        standard picture is therefore recovered as the exact m = 1 slice of this
        frame, not contradicted by it.
      reproduction_check: >-
        Frozen fixture: on a class with D_K = -7 (class number one, |Aut| = 2, so
        class number one WITHOUT extra automorphisms) the measured child count of the
        crater must equal ell - (D_K/ell) exactly and edge multiplicities must be 1 in
        both directions. Computed and committed before the special-j arm is read.
    observation_collision:
      observable: >-
        The pair consisting of the number of descending kernels and the number of
        distinct F_p-isomorphism classes among their codomains.
      distinct_preimage_search: >-
        Deliberate hunt for two vertices with the same observable but different
        underlying structure. The sharpest candidate pair, one on each side of the
        conclusion: (i) a j = 0 crater vertex at ell with (D_K/ell) = -1, giving
        ell + 1 descending kernels and (ell + 1)/3 children; (ii) a GENERIC surface
        vertex in a different class chosen so that its own descending count equals
        (ell + 1)/3 - it would exhibit the same child count with no collapse at all.
        If the instrument cannot separate these two, it is measuring child count and
        not collapse, and F1 is not identifiable from the data being collected. The
        separator is not the reverse multiplicity, which is 1 in both cases, so the
        actual separator must be the forward multiplicity, and the design must
        therefore record kernels, not merely codomains. This audit changes the
        experiment.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "codomain up to F_p-isomorphism" fixed and vary the
          forgotten structure, namely which of the m kernels was used. The intrinsic
          invariant distinguishing the resulting objects is the composite of the
          second isogeny with the dual of the first, an endomorphism of the codomain
          whose class modulo scalars labels the orbit element.
        predicted_gain: >-
          Predicts that this composite is ell times zeta, of degree ell squared, lying
          in the order Z + ell O_K, so it carries NO endomorphism information beyond
          what the codomain already has - the collapse costs nothing and gains nothing
          to an attacker. That is a negative prediction and it is the honest one.
      - transform: stronger_invariant
        proposed_object: >-
          Track the orbit partition rather than the child count, because the partition
          survives one more step of the recursion - it records WHERE the fixed points
          are, i.e. the horizontal directions.
        predicted_gain: >-
          Turns the unit index from an unexplained divisor in a formula into a
          measured integer with an independent check - the partition type must
          simultaneously predict the child count AND the horizontal count from one
          measurement.
    quantifier_order: >-
      FOR ALL ordinary E/F_p with j in {0, 1728}, FOR ALL odd primes ell dividing f,
      FOR ALL order-ell subgroups C of the ell-torsion: C is fixed by the automorphism
      action IF AND ONLY IF C is the kernel of a horizontal isogeny; AND THERE EXISTS
      a bijection between Aut-orbits of descending kernels and level-one vertices. The
      existential is the weaker half and comes last deliberately - the biconditional is
      what the experiment tests, and a witness bijection that depended on ell or on the
      class would still leave the biconditional standing.
    method_ceiling:
      strongest_certifiable_claim: >-
        An exhaustive, certificate-carrying, complete-fan statement for the enumerated
        classes: at every (class, ell) cell in range, orbit sizes are exactly 1 on
        horizontal kernels and exactly m on descending kernels, distinct children
        number exactly (ell - (D_K/ell))/m, and forward edge multiplicity is exactly m
        against reverse multiplicity exactly 1. It CANNOT certify F3(c) - that any
        particular past experiment in this corpus was actually biased - which requires
        re-reading that experiment's sampler, and is named as follow-on work rather
        than claimed here.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS: a class with D_K = -7 or -11,
        having class number one, a single crater vertex, a small-degree endomorphism
        present, and |Aut| = 2. Everything about it looks like the special-j case -
        trivial class group, unique crater, self-loops - EXCEPT the automorphism. The
        collapse must be absent there. A method that reports a collapse there is
        measuring class number or craterhood, not automorphisms, and the entire
        reading is void. Second nearby object: a level-one vertex of the special-j
        volcano, which has |Aut| = 2 and must show a fully regular ell-ary fan below
        it - so within ONE class the design contains both a collapsed and an
        uncollapsed fan, which is the tightest possible matched control.
    proof_obligations:
      - claim: >-
          A kernel fixed by the automorphism action is an O_K-submodule, hence
          horizontal
        responsibility: correctness
      - claim: >-
          The action is therefore free on descending kernels and orbits have size
          exactly m
        responsibility: strictness
      - claim: Kernels in one orbit have F_p-isomorphic quotients
        responsibility: correctness
      - claim: >-
          Orbit count equals level-one vertex count, i.e. the orbit-to-vertex map is
          injective as well as surjective
        responsibility: size
      - claim: >-
          Forward edge multiplicity from crater to child is m and reverse multiplicity
          is 1
        responsibility: feasibility
      - claim: >-
          A uniform-kernel walk therefore assigns the special vertex a weight wrong by
          m relative to an unweighted vertex sampler
        responsibility: interface

  predictions:
    - metric: >-
        number of distinct F_p-isomorphism classes among the codomains of the
        descending ell-isogenies from a special-j crater vertex
      direction: lower
      minimum_effect: >-
        Exactly (ell - (D_K/ell))/m, i.e. exactly m times FEWER than the number of
        descending kernels. Named pre-registered cells: p = 67, t = 5, f = 9, ell = 3,
        j = 0 gives 4 rational 3-isogenies, 1 horizontal, 3 descending, and EXACTLY
        ONE distinct child, a 3-to-1 collapse. p = 67, t = 11, f = 7, ell = 7, j = 0
        gives 8 rational 7-isogenies, 2 horizontal, 6 descending, and EXACTLY TWO
        distinct children. Any other integer falsifies F2.
    - metric: >-
        orbit-size multiset of the ell + 1 order-ell subgroups under the automorphism
        action at a special-j vertex
      direction: different
      minimum_effect: >-
        Exactly 1 + (D_K/ell) singletons together with (ell - (D_K/ell))/m orbits of
        size m. A single orbit of size strictly between 1 and m falsifies F1's
        freeness, which would be the most interesting outcome in this record.
    - metric: >-
        forward-to-reverse ell-isogeny edge multiplicity ratio between the special-j
        crater vertex and one of its level-one children
      direction: higher
      minimum_effect: >-
        Exactly m, which is 3 for j = 0 and 2 for j = 1728, against exactly 1 at every
        generic-vertex pair in the same volcano. A measured ratio of 1 at the special
        vertex falsifies F3 and would mean the graph is edge-symmetric there.
    - metric: >-
        number of children of a LEVEL-ONE vertex of the same volcano, a matched
        control inside one class
      direction: different
      minimum_effect: >-
        Exactly ell, with no collapse, in the same run and the same code path. If the
        level-one fan also collapses, the collapse is an artifact of the isogeny
        implementation rather than of the automorphism, and every reading is void.
    - metric: >-
        stationary occupancy of the special-j vertex under a uniform-kernel
        ell-isogeny walk of one million steps, divided by its occupancy under a
        uniform VERTEX sampler over the same class
      direction: lower
      minimum_effect: >-
        A ratio bounded away from 1 by at least 20 percent on the enumerated toy
        classes, in the direction of under-representing the special vertex. Exact
        agreement with 1 falsifies F3(c) and would mean the sampling worry is
        unfounded, which is a useful and publishable negative.

  minimal_test:
    design: >-
      TWO ARMS, both inside RQ-ECDLP-912694's declared bit sizes. ARM A, fan
      structure, exact. For every ordinary j = 0 or j = 1728 curve over primes from 64
      to 512 and every odd ell in {3,5,7,11,13} dividing f: enumerate ALL ell + 1
      order-ell subgroups of the ell-torsion over the field where that torsion is
      defined, restrict to the Frobenius-stable ones, compute the automorphism action
      on kernels explicitly by applying the automorphism to a generator and
      re-identifying the subgroup, and record the orbit partition; then compute the
      Velu quotient for EVERY kernel separately, never one per orbit, and deduplicate
      codomains by explicit F_p-isomorphism testing. Record the kernel-to-codomain
      fibre sizes directly. Then compute the reverse multiplicity by enumerating the
      rational ell-isogenies from each child and counting how many land back on the
      parent. ARM B, walk artifact. On the same complete classes, run a uniform-kernel
      ell-isogeny walk of one million steps and a uniform-vertex sampler, and compare
      occupancy of the special-j vertex. The named cells p = 67 with t = 5, f = 9,
      ell = 3, and p = 67 with t = 11, f = 7, ell = 7 are pre-registered above with
      exact expected integers.
    controls:
      - >-
        WITHIN-CLASS MATCHED CONTROL, BLOCKING: the level-one vertices of the SAME
        volcano, which have |Aut| = 2 and must show a fully regular ell-ary fan under
        the identical code path. This is the tightest available control because
        everything except |Aut| is held fixed - same p, same t, same class, same
        implementation, same ell.
      - >-
        NULL OBJECT: crater vertices with D_K in {-7, -8, -11} - class number one,
        unique crater, small-degree endomorphism present, |Aut| = 2. No collapse may
        appear. Discriminates "collapse comes from |Aut|" from "collapse comes from
        class number one" and from "collapse comes from being on a crater".
      - >-
        NULL OBJECT 2, the section 3 decay test: the collapse must NOT decay with
        volcano depth on the special vertex and must be ABSENT at every depth below
        it. A quantity that is present at depth 0 and absent at all greater depths is
        the predicted signature; a quantity present at every depth is an
        implementation artifact of the Velu or deduplication code.
      - >-
        DEDUPLICATION CONTROL: explicit F_p-isomorphism testing by searching for u
        with u^4 a' = a and u^6 b' = b, with a logged count of j-equal but
        F_p-inequivalent codomain pairs. Deduplicating by j alone would MANUFACTURE
        the collapse this record predicts, from the wrong cause, and is the single
        most likely way to get a false positive here.
      - >-
        CLASS NUMBER CROSS-CHECK: the measured child count must equal the
        independently computed class number of the order of discriminant D_K ell^2,
        with the unit index taken from a table rather than from the measurement. Two
        independent computations of the same integer.
      - >-
        CERTIFICATE CONTROL: every kernel and every quotient independently re-verified
        by code sharing no state with the producer. Verification fraction 1.0 as the
        RQ constraint requires.
    required_metrics:
      - orbit partition of the ell-torsion subgroups under Aut, per (class, ell)
      - kernel count, horizontal count, descending count, per (class, ell)
      - distinct-codomain count with the explicit kernel-to-codomain fibre sizes
      - forward and reverse edge multiplicities per parent-child pair
      - the same four metrics at every level-one vertex of the same volcano
      - independently computed class number of the order of discriminant D_K ell^2
      - deduplication log of j-equal but F_p-inequivalent pairs
      - >-
        walk occupancy of the special vertex versus uniform-vertex occupancy, with the
        seed band
      - certificate verification fraction, required 1.0

  falsification_conditions:
    - >-
      Any orbit of descending kernels of size other than m. F1's freeness is false.
    - >-
      Distinct-codomain count differing from (ell - (D_K/ell))/m at any cell. F2 is
      false and the geometric reading of the unit index is wrong.
    - >-
      Forward edge multiplicity equal to reverse edge multiplicity at the special
      vertex. F3 is false and the graph is edge-symmetric there.
    - >-
      A collapse observed at the D_K in {-7,-8,-11} null. The measurement is not
      measuring |Aut| and every reading is void.
    - >-
      A collapse observed at level-one vertices of the same volcano. The collapse is
      an implementation artifact of the Velu or deduplication path and every reading
      is void.
    - >-
      Walk occupancy of the special vertex agreeing with uniform-vertex occupancy
      within the seed band. F3(c) is false - the sampling worry is unfounded, which
      closes a live methodological concern and is a useful outcome.
    - >-
      Measured child count disagreeing with the independently computed class number.
      Exactly one of the two computations is wrong and neither may be reported until
      the discrepancy is resolved.

  confounders:
    - >-
      Deduplicating codomains by j-invariant rather than F_p-isomorphism produces the
      predicted collapse for the wrong reason. This is the dominant false-positive
      route and the dedup control targets it directly.
    - >-
      The ell-torsion may not be F_p-rational; the kernels must be enumerated over the
      splitting field of the ell-division polynomial and then filtered for Frobenius
      stability. Enumerating only F_p-rational kernels would silently drop descending
      kernels and shrink the fan for a reason unrelated to Aut.
    - >-
      Applying the automorphism to a kernel GENERATOR rather than to the SUBGROUP can
      report a spurious orbit of size 2m if the sign is not quotiented out. Minus-one
      acts trivially on subgroups; the implementation must act by Aut modulo
      plus-minus-one and this is asserted by a unit test, not assumed.
    - >-
      At 7-9 bits some cells have ell + 1 comparable to the whole class, so "distinct
      children" and "the whole class" can coincide and the collapse becomes
      unobservable. Cells where the predicted child count equals the level-one vertex
      count trivially are flagged and excluded from the pooled statistic.
    - >-
      Arm B's walk on a toy class of a few vertices mixes almost instantly and its
      occupancy statistics have large relative error; the seed band must be computed
      and frozen before the ratio is read, and Arm B's result is reported as
      indicative for the toy scale rather than as a measurement of asymptotic
      stationarity.

  interpretation_limits:
    - >-
      Toy scale, claim tier toy. F1 and F2 are DERIVATIONS verified over the
      enumerated range, not proved by it.
    - >-
      No ECDLP cost claim is made. The observable_fiber audit above predicts, and the
      test measures, that the collapse yields NO extra endomorphism content - the
      composite of two orbit-related isogenies is ell times zeta, already in the
      codomain's endomorphism ring. If that prediction holds, the collapse is
      cryptanalytically inert and this record's value is entirely structural and
      methodological.
    - >-
      F3(c) is a claim about what a biased sampler WOULD do, verified on toy classes.
      It is NOT a claim that any specific past experiment in this corpus was biased;
      establishing that requires re-reading that experiment's sampler and is named as
      follow-on work.
    - >-
      Nothing here bears on P-256 or P-224. secp256k1 is in the covered family; the
      structural statement applies to it, the cost statement does not exist.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 3).

  heuristic_assumptions:
    - id: H-FAN-1
      statement: >-
        COVERAGE. The enumeration over primes from 64 to 512 contains, for each m in
        {3, 2} and each value of the Kronecker symbol in {-1, 0, +1}, at least two
        distinct classes with an odd ell in {3,5,7,11,13} dividing f, so that every
        predicted orbit-partition type is instantiated at least twice. This is an
        assumption about the sample and is decided by counting, not believed.
      rigorous_support: >-
        Rigorous ingredient - the set of triples (p, t, f) with 4p = t^2 + |D_K| f^2
        in a bounded interval is finite and completely enumerable, so coverage is a
        computed fact. Distribution imitated - none; F1-F3 make no distributional
        claim.
      validation_plan: >-
        Compute and commit the coverage table before any isogeny computation. Sampled
        parameters recorded exactly: prime interval from 64 to 512, both congruence
        classes, degree set {3,5,7,11,13}. If a cell is empty, extend upward in powers
        of two and record each extension as a scope note; report any cell still empty
        at 16 bits as untested. TRANSFER ASSUMPTION: coverage at 7-9 bits transfers
        nothing to cryptographic p; only the derivation is claimed uniform in p.
    - id: H-FAN-2
      statement: >-
        SAMPLER EQUIVALENCE. On a complete toy class, the empirical occupancy of a
        vertex under a uniform-kernel ell-isogeny walk of n steps converges, as n
        grows, to the stationary distribution of that walk, and the difference from
        the uniform-vertex distribution at the special vertex is a function of the
        edge multiplicities alone, i.e. no other asymmetry of the toy graph
        contributes at leading order.
      rigorous_support: >-
        Rigorous ingredient - on a finite connected graph the uniform-kernel walk has
        a unique stationary distribution, computable exactly from the transition
        matrix at toy size, so the prediction is a linear algebra fact and does not
        need the walk at all. Distribution imitated - the classical weighted
        regularity of isogeny graphs by 1/|Aut|, the Deuring mass, which
        IDEA-20260811-cd7c10 uses from the counting side.
      validation_plan: >-
        Compute the stationary distribution EXACTLY by solving the eigenvector
        equation on the enumerated class, and compare it to the one-million-step
        empirical occupancy; agreement validates the sampler, disagreement indicts it.
        Tail check: the fastest- and slowest-converging seeds against the spectral gap
        of the transition matrix, also computed exactly. Sampled parameters recorded:
        the class, the walk length, the 16 seeds. No transfer to cryptographic scale
        is claimed or attempted.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE AS AN ALGORITHMIC CLAIM. No ECDLP algorithm is proposed and no
      exponent moves. The one cost statement made: enumerating the exit fan from a
      special-j vertex costs m times fewer Velu quotients than the naive
      kernel-by-kernel enumeration if the orbit structure is exploited - a constant
      factor of 3 or 2 on a preprocessing step, disclosed as such and offered as a
      building block, not as a result. Under docs/target-result-profile.md checklist
      C1 and C2 this record is NON-TARGET-CLASS and says so.
    memory_exponent: >-
      O(ell) to hold the fan; O(class size) for the exact stationary-distribution
      computation in Arm B. Both negligible at the declared bit sizes.
    best_known: >-
      For the fan structure: direct kernel enumeration plus Velu, which is what the
      test itself runs, so the record's own experiment IS the best known method and
      claims no improvement over it. For the ECDLP on these curves: Pollard rho at
      0.886*sqrt(N) with the automorphism discount at the special vertex
      (KN-TECH-018), untouched by this record.
    hidden_overhead: >-
      Two disclosed items. First, the m-fold saving on Velu quotients requires knowing
      the orbit structure, which requires the automorphism action on kernels - cheap
      here but not free, and it is exactly the work the test performs, so the saving
      is circular unless the orbit structure is predicted rather than measured.
      Second, Arm B's exact stationary computation is cubic in the class size and does
      not scale past toy classes; at larger scale only the empirical walk is available
      and its error bars grow.
    tradeoff_note: >-
      No time-memory tradeoff arises. The sampling-bias consequence F3(c) is
      parallelisation-neutral: running more walkers does not remove a stationary
      distribution bias, it only measures it more precisely, which is precisely why
      it is dangerous.

  dominated_by: >-
    Not applicable as an attack, because no attack is claimed. As a structural
    statement it is DOMINATED BY the classical volcano literature it reassembles: any
    source stating the class number formula with the unit index, plus any source
    stating that j = 0 and 1728 break edge-multiplicity symmetry, jointly imply F1-F3
    for a reader who composes them. Pareto frontier rows checked before refusing null,
    on the ECDLP axis: BSGS (sqrt(N) time, sqrt(N) memory); rho with negation and van
    Oorschot-Wiener parallelisation; automorphism-discounted rho at the crater
    (KN-TECH-018); multi-target sqrt(L*N); preprocessing S*T^2 = Omega(eps*N). All
    dominate, because this record supplies no ECDLP algorithm. On the isogeny-structure
    axis, direct kernel enumeration dominates on generality and this record's m-fold
    saving applies only at two discriminants.
  sota_delta:
    time_exponent: "0 (no change)"
    memory_exponent: "0 (no change)"
    data_or_query_exponent: "0 (public data, no oracle queries)"
    note: >-
      Quantitative delta: a factor of exactly m, which is 3 for j = 0 and 2 for
      j = 1728, appearing in three distinct places - the number of distinct exits from
      the locus, the forward edge multiplicity, and the sampling weight of the special
      vertex under a uniform-kernel walk. Three appearances of one integer, each
      independently measurable, is what makes the record falsifiable rather than
      decorative. Zero movement on every ECDLP cost axis.

  estimated_cost:
    implementation: medium
    compute: low
  compute_budget_note: >-
    Arm A at 7-9 bits: minutes of single-core CPU. The implementation cost is medium
    rather than low because the automorphism action on kernels, the F_p-isomorphism
    deduplication, and the reverse-multiplicity computation are three separate pieces
    of machinery this program does not currently have as tested components. Arm B's
    exact stationary distribution is a dense eigenvector solve on a matrix of size
    equal to the class, at most a few hundred at 9 bits - seconds.
  recommended_priority: medium

  relation_to_existing_records:
    depends_on: >-
      IDEA-20260829-882739 for the exit criterion that ell must divide f. If that
      record's C2 is false, this record's fan is measured at the wrong degrees.
    complements: >-
      IDEA-20260811-cd7c10, the Hurwitz mass detector - the same 2/|Aut| weighting
      seen from the counting side rather than the graph side.
    sharpens: >-
      IDEA-20260812-c49409 D1 and D3, by supplying the vertical fan structure that the
      ascent of D3 traverses in reverse.
