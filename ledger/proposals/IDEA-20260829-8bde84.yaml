idea:
  id: IDEA-20260829-8bde84
  question_id: RQ-ECDLP-912694
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    THE EXIT FAN IS COLLAPSED BY THE AUTOMORPHISM ITSELF: the group Aut(E) modulo
    plus-minus-one acts FREELY on the descending ell-isogeny kernels at a special-j
    crater, so the ell - (D_K/ell) descending isogenies produce only
    (ell - (D_K/ell))/m distinct curves with m = 3 for j = 0 and m = 2 for j = 1728 -
    the unit index of the class number formula, realised geometrically as an m-to-1
    edge multiplicity that makes the volcano IRREGULAR at its apex and silently
    mis-weights every isogeny-walk sampler this program runs.

  object: >-
    TRACKED OBJECT. The ORBIT PARTITION of the projective line of the ell-torsion -
    the set of ell + 1 order-ell subgroups - under the action of Aut(E) modulo
    plus-minus-one. What is retained is a partition type, i.e. an unordered list of
    orbit sizes such as [1, 1, 3, 3] for ell = 5 and j = 0; the subgroups themselves,
    their generators, the codomain curves and every coordinate are discarded.
    Established families declared OFF-LIMITS as the primary lens: the
    automorphism-order function (IDEA-20260812-c49409), the rho automorphism discount
    (KN-TECH-018), the Cl(O)-torsor Fourier functional (IDEA-20260826-228fa6), Semaev
    support and degeneration screens (RQ-JINV-8fc13a family), and the graph spectrum
    (IDEA-20260806-bcbcf5). Candidates scored on (new / one-step propagation definable
    and measurable / survival depth): the kernel subgroup itself (not lossy at all -
    it IS the isogeny, so it fails section 2 outright); the codomain j-invariant
    (repackaging, dissolves); the ORBIT PARTITION under Aut (new in this corpus /
    testable - its one-step propagation is that the partition becomes all-singletons
    the moment you step off the locus / survives exactly one step, which is the
    finding, not a defect); the edge multiplicity function on the volcano (equivalent
    to the orbit partition and adopted as its measurable shadow). KN-OPEN-019
    applies: this is a sketch, not a taxonomy.

  lossy_projection_test: >-
    The projection from the set of ell + 1 subgroups to the partition type under Aut
    discards everything except a multiset of small integers summing to ell + 1. It is
    compatible with the target's operation: composing with an automorphism permutes
    kernels within an orbit and maps a quotient to an F_p-ISOMORPHIC quotient, so the
    partition is exactly the fibre structure of the map from a kernel to its codomain
    up to F_p-isomorphism, which is the map an isogeny step performs. The retained
    part therefore propagates deterministically. It is NOT a change of coordinates:
    from the partition [1,1,3,3] one cannot recover a single kernel, a single
    generator, or a single codomain - and the whole point is that three DIFFERENT
    kernels are identified, so information is provably destroyed. The test passes, and
    it passes for the strongest possible reason: the discarded information is
    precisely the information the target's own symmetry group destroys.

  claim: >-
    Let E/F_p be ordinary with j = 0 and p congruent to 1 mod 3 (respectively j = 1728
    and p congruent to 1 mod 4), so End(E) = O_K with D_K = -3 (resp. -4), and set
    m = |Aut(E)|/2, which is 3 (resp. 2). Let ell be an odd prime dividing the
    conductor f. Three statements, F1-F3.

    (F1) FREENESS. The group Aut(E) modulo plus-minus-one, cyclic of order m, acts on
    the ell + 1 order-ell subgroups of the ell-torsion. A subgroup fixed by this
    action is stable under O_K, hence is the kernel of a horizontal isogeny.
    Therefore the action is FREE on the ell - (D_K/ell) descending kernels, and the
    1 + (D_K/ell) horizontal kernels are exactly its fixed points. The orbit partition
    consists of 1 + (D_K/ell) singletons together with (ell - (D_K/ell))/m orbits of
    size exactly m.

    (F2) COLLAPSE. Kernels in one orbit have F_p-isomorphic quotients (compose with
    the automorphism). Hence the number of DISTINCT F_p-isomorphism classes reachable
    by a descending ell-isogeny from E is exactly (ell - (D_K/ell))/m, and the map
    from orbits to level-one vertices is a bijection - which is forced, because the
    number of level-one vertices equals the class number of the order of discriminant
    D_K ell^2, namely h(O_K) * ell * (1 - (D_K/ell)/ell) divided by the unit index,
    which equals (ell - (D_K/ell))/m, the unit index being exactly m. The unit index
    in the class number formula IS this collapse; the formula's most mysterious factor
    has a one-line geometric meaning at exactly the two discriminants this RQ studies.

    (F3) EDGE-MULTIPLICITY ASYMMETRY AND THE SAMPLING CONSEQUENCE. Let v be a
    level-one child of E. Then the number of distinct ell-isogenies from E to v is m,
    while the number of distinct ell-isogenies from v to E is 1. So the ratio of
    forward to reverse multiplicity is m, which equals |Aut(E)| divided by |Aut(v)|,
    and the ell-isogeny graph of an ordinary class containing a special-j curve is NOT
    edge-symmetric at that vertex. Consequently: (a) the volcano is not a regular tree
    at its apex - the crater has m times FEWER children than a generic surface vertex
    with the same local splitting datum; (b) any sampler that walks the class by
    choosing uniformly among the ell + 1 kernels, or that treats the graph as
    undirected, assigns the special-j vertex a weight wrong by exactly the factor m,
    in the direction that UNDER-counts it; (c) therefore an experiment that reports
    "special-j curves are not over-represented among extremal cost values" may be
    reporting a walk artifact of known size m, not an arithmetic fact.

    WHAT THIS IS AND IS NOT. F1 and F2 are classical facts assembled into an exact
    finite prediction. F3(c) is a measurement-integrity claim about this program's own
    instruments, and it is the reason the record is filed rather than left as a remark.

  mechanism: >-
    An automorphism of order 2m acts on the curve, hence on its ell-torsion, hence on
    the set of order-ell subgroups. A subgroup it fixes is an O_K-submodule of the
    ell-torsion, and O_K-submodules are exactly the kernels of horizontal isogenies -
    that is what horizontal means at the level of ideals. So fixed points and
    horizontality are the SAME condition, which forces freeness off the horizontal
    locus and pins the orbit sizes to exactly m with no exceptions. The quotient by a
    kernel and the quotient by its image under the automorphism differ by an
    isomorphism, so an orbit is one curve seen m ways. This is why the class number of
    a non-maximal order carries a division by the unit index: the descending fan is
    counted m times over. The mechanism predicts a sharp integer, not a tendency,
    and it predicts it at every ell dividing f simultaneously.

  novelty_status: unverified
  novelty_note: >-
    F1 and F2 ARE CLASSICAL and are not claimed as new. The unit index in the class
    number formula for non-maximal orders is standard (Cox); the exceptional
    behaviour of isogeny graphs at j = 0 and j = 1728 is standard in the volcano
    literature and was corroborated this session by a WebSearch relay quoting "In the
    exceptional case where one of j1 and j2 is 0 or 1728, this need not hold for edge
    multiplicity symmetry" - attribution to a specific source NOT established, see
    citations. What this corpus does NOT contain, checked by grep across ledger and
    knowledge on 2026-08-29 for "unit index", "O_K^*", "collapse descending" and
    "3-to-1": any record stating the m-to-1 exit collapse, the exact child count
    (ell - (D_K/ell))/m, or the sampling-weight consequence F3(c).
    IDEA-20260812-c49409 does not state it; IDEA-20260826-d61c49 observes that small
    |D_0| gives a SMALLER crater (a horizontal statement) but not that the special
    vertex has fewer CHILDREN (a vertical one); IDEA-20260811-cd7c10 uses the
    2/|Aut| Deuring mass as a detector, which is the same weighting seen from the
    counting side and is the closest neighbour in the corpus - the two should be read
    together. The contribution claimed is assembly plus F3(c), and no external source
    was opened to confirm the classical statements.

