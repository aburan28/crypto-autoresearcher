idea:
  id: IDEA-20260809-d793a5
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    What does binding cost? Measure the added bytes and cycles per property so the
    design choice has a price attached
  class: measurement
  claim: >-
    Combiners differ in binding strength because they hash different amounts of
    data, and hashing the post-quantum ciphertext and public key is the expensive
    part since both are kilobyte-scale. The claim is that the cost of each binding
    property is directly measurable in bytes hashed and cycles spent per handshake,
    that the total is small in absolute terms but not zero, and that having the
    number removes the main practical objection to stronger binding — or confirms
    it, which is equally useful.
  mechanism: >-
    Measure each combiner's key-derivation cost on one harness at the deployed
    parameter sizes, decomposed by input, and attribute the marginal cost of each
    binding property to the inputs the lattice says it requires.
  why_not_a_renamed_known_approach: >-
    Handshake performance is measured routinely. Attributing cost to BINDING
    PROPERTIES via the lattice, rather than reporting per-combiner totals, is what
    makes the number usable in a design argument.
  predictions:
  - observable: marginal cost per binding property
    metric: bytes hashed and cycles, per property
    predicted: Dominated by the post-quantum ciphertext, since it is the largest input; if some smaller input dominates cost, that would indicate an implementation inefficiency rather than a design cost.
  - observable: total binding cost as a fraction of handshake cost
    metric: fraction
    predicted: Small. A large fraction would be a genuine objection and must be reported plainly if measured.
  minimal_test: >-
    Measure each combiner's derivation cost with declared repetitions on a declared
    machine, decompose by input, and attribute per property using the lattice.
  controls:
  - 'BASELINE-IN-RUN: the minimal combiner measured in the same run as the maximal one.'
  - 'CORRECTNESS PRECONDITION: every combiner passes its vectors before timing.'
  falsification_conditions:
  - Costs are dominated by an input the lattice says is irrelevant to any property, indicating a broken attribution.
  - Measurements are not reproducible across runs on the same machine.
  interpretation_limits: >-
    One machine, one implementation quality; cross-platform generalization is not
    claimed and no combiner is recommended.
  sota_delta: 'No attack. Delta: a price per property, which is the missing half of every binding-versus-performance discussion.'
  dominated_by: Downstream of IDEA-20260809-c41b2e; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for handshake cost: no records. WEB NOT CHECKED.'
  source_refs:
  - Hybrid key exchange drafts -- REQUIRED READS.
