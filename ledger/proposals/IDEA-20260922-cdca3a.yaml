idea:
  id: IDEA-20260922-cdca3a
  question_id: RQ-NISTBIN-06157b
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE FIELD POLYNOMIAL'S HAMMING WEIGHT IS A CONFOUND EVERY SUBSPACE-CHOICE
    MEASUREMENT IN THIS PROGRAM HAS LEFT UNCONTROLLED, AND IT IS A CONSTANT FACTOR
    ON WALL-TIME AND MEMORY BUT PREDICTED ZERO ON THE SEARCH EXPONENT: the NIST
    standard fixes a trinomial modulus at m = 233 and 409 and a pentanomial at 163,
    283, 571, and the modulus sets the sparsity of the F_2-multiplication tensor
    (a weight-w reduction polynomial makes each product coordinate a sum of ~w
    shifted bit-products), so the Weil-descended Boolean/ANF summation system has
    XOR-clause length and monomial support scaling with w -- 3 for a trinomial, 5
    for a pentanomial. The exhaustive-core law of IDEA-20260915-0d8e90 (WDSat
    conflict count = c . 2^{ml}, a V- and basis-blind exhaustive core) predicts w
    changes the per-conflict CONSTANT and the memory, and does NOT move the search
    exponent; so any kappa(V) (IDEA-20260922-37e02e) or Frobenius-stability
    (GOAL-FROB-6333a9) comparison run across two different moduli is reading a
    basis effect as a V effect unless the modulus is pinned. The idea is the
    control, and the discriminator is whether w leaks into the conflict count (it
    should not) or only into wall-time and memory (it should).
  class: control

  mechanism: >-
    OBJECT FRAME. Representation of the point: x(P) in F_(2^m) in the POLYNOMIAL
    basis defined by the reduction polynomial p(t) -- an R1 representation of
    RQ-ECDLP-623a32 (field representation of coordinates), with the modulus p(t)
    the free coordinate-defining datum. Factor base B_V = {P : x(P) in V} as usual.
    The tracked object is the descended Boolean/ANF equation system itself: the set
    of F_2-equations produced by Weil-restricting the summation polynomial along
    the fixed F_2-basis. Operation set Sigma the tracked object must survive: the
    solver's DPLL/XOR-Gauss steps (WDSat/ANF-SAT) -- unit propagation, XOR
    elimination, and branch on a factor-base bit -- i.e. the partial-action Class I
    operations of index calculus, expressed at the bit level. Sigma is NOT the full
    translation action.
    TRICHOTOMY PLACEMENT: COORDINATE-DEPENDENT. The object (the ANF system's
    monomial support and clause lengths) is not an invariant of the group or the
    curve; it changes when the coordinate system (the reduction polynomial and
    F_2-basis) changes, while the SOLUTION SET of the system -- the actual
    decompositions -- is a coordinate-free invariant that w does not touch. That is
    exactly the coordinate-dependent class: a quantity that moves under
    reparametrisation while the thing it computes does not.
    LOSSY-PROJECTION TEST against Sigma = {DPLL/XOR-Gauss}. The projection is
    (the descended ANF system) -> (its total monomial support size and mean
    XOR-clause length), a pair of integers. It DISCARDS the identities of the
    monomials and the solution set; it is compatible with Sigma because unit
    propagation and XOR elimination act on clauses whose lengths this pair bounds,
    and it is lossy in the R1 representation used because two different moduli
    produce systems with the same solution set (same decompositions) but different
    support sizes -- the projection cannot recover the modulus from the pair, and
    the pair changes while the decompositions do not. A projection that changed
    the decompositions would be a different curve, not a coordinate change; this
    one is a genuine coordinate-dependent lossy statistic.
    FACTOR-BASE ESCAPE (KN-OPEN-020). This record changes NO factor base; B_V is
    the standard subspace base with the O(m^2) F_2-linear membership test, the
    implicit-membership-cheap case. The modulus w changes the COST of forming and
    reducing products inside the descent, not the membership class. Nothing here
    moves V out of the linear-membership class, and the record charges only the
    per-conflict constant and the memory, not a new membership cost.
    WHY THE INSTANCE CLASS MATTERS (the "state a reason SAT favours it" bar). The
    reason to care is not that SAT is fast; it is that the WDSat exhaustive-core law
    makes the SEARCH cost c . 2^{ml} independent of the modulus, so the ONLY thing
    the modulus can move is the per-conflict work and the memory footprint -- and
    those are precisely the quantities a wall-time or memory comparison across two
    NIST degrees (163 vs 233, say) silently mixes with the V effect. The idea
    exists because the program is about to compare V-choices at different m with
    different moduli and has no control for w.

  claim: >-
    (A) TENSOR SPARSITY. In the polynomial basis modulo a reduction polynomial
    p(t) = t^m + r(t) of Hamming weight w (so r has w - 1 terms below degree m),
    the product of two field elements a(t) b(t) is a degree-(2m-2) polynomial
    reduced by w - 1 XOR-folds; each of the m output coordinates is an F_2-sum of
    ~ m + (w - 1) . (spread of r) bit-products, and the number of DISTINCT
    quadratic monomials feeding the m outputs is Theta(m) larger for a pentanomial
    than a trinomial by the extra two fold terms. Concretely w = 3 (trinomial,
    m = 233, 409) versus w = 5 (pentanomial, m = 163, 283, 571).
    (B) DESCENDED SYSTEM. The Weil restriction of a summation polynomial S_{t+1}
    over F_(2^m) produces m Boolean equations per algebraic equation; each Boolean
    equation's XOR length and monomial support inherit the tensor sparsity of (A),
    so at matched (m, t, l) a trinomial-modulus system has strictly fewer XOR
    terms per equation and strictly smaller total monomial support than a
    pentanomial-modulus system, by a factor that is Theta(1) in m (a constant,
    growing at most linearly in w, not in m).
    (C) THE PREDICTION, SPLIT INTO TWO NAMED OUTCOMES. Under the exhaustive-core
    law of IDEA-20260915-0d8e90 (UNSAT conflict count = c . 2^{ml}, c in
    [0.9, 1.0], V- and basis-blind):
      E1 (the law holds through the modulus): the WDSat/ANF conflict COUNT is
      identical for trinomial and pentanomial moduli at matched (m, t, l) to within
      the c-band; only per-conflict time and peak memory differ, the memory by the
      support-size ratio and the time by the XOR-length ratio. The search exponent
      is modulus-blind.
      E2 (the modulus leaks into search): the conflict count itself differs beyond
      the c-band -- meaning propagation order induced by sparser clauses changes the
      exhaustive core's effective size. This would CONTRADICT the exhaustive-core
      law and is the informative surprise.
    (D) THE CONFOUND STATEMENT. Because (A)-(C) predict a real per-conflict-time and
    memory difference between trinomial and pentanomial moduli, any subspace-choice
    comparison (kappa(V) of IDEA-20260922-37e02e; Frobenius-stable vs random of
    GOAL-FROB-6333a9) that compares two instances built over DIFFERENT moduli is
    reading a modulus effect as a V effect on any wall-time or memory metric. The
    modulus must be pinned (same m, same p(t)) or the metric must be the conflict
    COUNT, which E1 predicts is modulus-blind. This is the record's operational
    contribution: a named, priced control for a variable the program has not been
    holding fixed.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260915-0d8e90
      provenance: internal
      claim: >-
        WDSat's UNSAT conflict count equals c . 2^{ml} with c in [0.9, 1.0] (an
        exhaustive core), V- and basis-blind. This record relies on that law to
        predict the modulus is search-exponent-blind (E1) and to define the
        surprise (E2).
      verified_by: >-
        Title and claim read from the ledger this session; the record's body was
        summarised, not read line-by-line. A contract must re-read it to confirm the
        c-band and the "basis-blind" scope before pinning E1 on it.
    - ref: IDEA-20260922-37e02e
      provenance: internal
      claim: >-
        kappa(V) = dim span(V . V) is a multiplicative property of V at fixed
        dimension governing the descended system's quadratic block; every WDSat
        number the program holds was taken at kappa = 2l - 1. This record supplies
        the confound (the modulus) that a kappa comparison must hold fixed.
      verified_by: Read in full this session (sibling record of this session).
    - ref: GOAL-FROB-6333a9
      provenance: internal
      claim: >-
        HEUR-FROB-WDSAT-NULL asserts basis-blindness for Frobenius-stable vs random
        factor bases at fixed m. A change of MODULUS is not a change of basis within
        one field; this record distinguishes the two and flags the modulus as the
        uncontrolled variable across degrees.
      verified_by: goal.yaml read this session (per session summary).
    - ref: SRC-FIPS186-4-BINARY-CURVES
      provenance: internal
      claim: >-
        Reduction polynomials: t^163 + t^7 + t^6 + t^3 + 1 (pentanomial),
        t^233 + t^74 + 1 (trinomial), t^283 + t^12 + t^7 + t^5 + 1 (pentanomial),
        t^409 + t^87 + 1 (trinomial), t^571 + t^10 + t^5 + t^2 + 1 (pentanomial).
        The trinomial/pentanomial split across the five degrees is the datum.
      verified_by: source_record.yaml read in full this session.
    - ref: RQ-NISTBIN-06157b
      provenance: internal
      claim: >-
        The RQ names "the standard's own field-polynomial shapes (trinomial or
        pentanomial)" as an axis of interest; this record is the proposal against
        that named axis.
      verified_by: Read in full this session.
    - ref: IDEA-20260922-af7396
      provenance: internal
      claim: >-
        Uses "XOR density" only as a shape-matched null-object control for the
        chained-S_3 SAT cost. This record makes XOR density (via the modulus) the
        tracked object and a program-wide confound, which af7396 does not.
      verified_by: Read in full this session (sibling record of this session).

  assumptions:
    - >-
      The polynomial-basis representation modulo p(t) is used (the NIST standard
      normative choice). A normal-basis or tower representation would have a
      different tensor and is out of scope; the claim is specifically about the
      trinomial-vs-pentanomial polynomial-basis split the standard fixes.
    - >-
      The exhaustive-core law of IDEA-20260915-0d8e90 holds for the summation
      systems in question (it is the record's E1 hypothesis, not an assumption of
      the derivation of A-B). If the law fails independently of the modulus, E1/E2
      lose their reference and the confound statement (D) still stands on the
      per-conflict time/memory difference alone.
    - >-
      "Matched (m, t, l)" comparisons hold the field size, decomposition size, and
      factor-base dimension fixed and vary only the modulus; on the SAME m this
      requires two distinct irreducible polynomials of that degree and weights 3
      and 5, which do not both exist at every m (NIST chose trinomial where one
      exists, else pentanomial). The clean within-m comparison is available only at
      m where both an irreducible trinomial and an irreducible pentanomial exist.

  proof_search_map:
    bottleneck: >-
      Every WDSat/ANF number the program reports is a wall-time or a conflict count
      taken at one modulus. Whether the modulus contributes to that number -- and
      therefore whether cross-degree comparisons are confounded -- has never been
      measured. Answering it isolates the modulus contribution before any
      V-selection conclusion is drawn.
    baseline_embedding:
      parameter_slice: >-
        The EC-Index-Calculus-Benchmarks generator (KN-LIT-036049) fixes one Koblitz
        curve and one modulus; its instances are the baseline. The claim is that
        regenerating the SAME instances over a different-weight modulus at matched
        (m, t, l) changes support size and clause length but (E1) not conflict count.
      reproduction_check: >-
        ARITHMETIC. Build the F_2-multiplication tensor modulo a weight-3 and a
        weight-5 irreducible polynomial at a small m where both exist (e.g. m = 7:
        t^7 + t + 1 is a trinomial; a weight-5 irreducible of degree 7 exists), and
        count distinct quadratic monomials in the m output coordinates for each.
        Confirm the pentanomial support exceeds the trinomial support by the
        predicted Theta(1) factor. No solver.
    observation_collision:
      observable: >-
        (total monomial support, mean XOR-clause length) of the descended system at
        fixed (m, t, l), as a function of the modulus weight w.
      distinct_preimage_search: >-
        Different moduli of the SAME weight (two distinct irreducible trinomials of
        degree m) should give the same observable up to relabelling -- a benign
        collision confirming w, not the specific polynomial, is the driver. The
        dangerous preimage is a weight-5 modulus whose specific term spread happens
        to give trinomial-like support; check by varying the middle-term positions.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Fix (m, t, l) and vary only the modulus; the fibre of the observable over
          w isolates the modulus contribution to support and clause length.
        predicted_gain: >-
          A priced, subtractable modulus term for every WDSat/ANF measurement, so
          that a V effect can be read cleanly after removing it.
    quantifier_order: >-
      FORALL m at which an irreducible trinomial and an irreducible pentanomial both
      exist, and FORALL matched (t, l): the pentanomial descended system has larger
      monomial support and longer mean XOR-clause than the trinomial one (a
      constant factor), AND (E1, predicted) the two have equal conflict count to
      within the c-band. The support statement is a theorem about the tensor; the
      conflict-count statement is an empirical prediction under the exhaustive-core
      law.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The reduction-polynomial weight changes the descended summation system's
        monomial support and XOR-clause length by a constant factor and, under the
        exhaustive-core law, leaves the search exponent unchanged; therefore any
        cross-modulus V comparison is confounded on wall-time and memory but not on
        conflict count." Certifies nothing about whether V itself moves any
        exponent, nothing outside the polynomial-basis representation, and nothing
        about the truth of the exhaustive-core law (which E1/E2 test).
      nearby_object_control: >-
        PROVES-TOO-MUCH: if the argument were read as "sparser modulus ⇒ cheaper
        attack", it would predict the trinomial degrees (233, 409) are weaker
        targets than their pentanomial neighbours -- FALSE, since the search
        exponent is modulus-blind under E1 and rho margins (EXP-SEMBIN-992e73) order
        the degrees by m, not by w. Any phrasing implying a security difference from
        w has overreached. NULL OBJECT: two distinct trinomials of the same degree
        must give the same conflict count and support up to relabelling.
    proof_obligations:
      - claim: >-
          Product-coordinate XOR length and distinct-quadratic-monomial count scale
          with the reduction-polynomial weight w.
        responsibility: correctness
      - claim: >-
          At matched (m, t, l) the pentanomial descended system's support exceeds
          the trinomial's by a constant (m-independent) factor.
        responsibility: size
      - claim: >-
          Under the exhaustive-core law the conflict count is modulus-blind (E1);
          a measured difference beyond the c-band is E2.
        responsibility: success_probability
      - claim: >-
          The confound is real: a cross-modulus V comparison mixes the modulus term
          into wall-time and memory.
        responsibility: interface
      - claim: >-
          The record changes no factor-base membership class.
        responsibility: scope

  predictions:
    - metric: >-
        distinct quadratic monomials in the m output coordinates of the
        F_2-multiplication tensor, weight-3 vs weight-5 irreducible modulus at
        matched small m
      direction: higher
      minimum_effect: >-
        pentanomial support strictly greater than trinomial support, by a factor
        bounded away from 1 and independent of m (a constant). Equal support would
        refute (A).
    - metric: >-
        total monomial support and mean XOR-clause length of the descended
        summation system at matched (m, t, l), pentanomial vs trinomial modulus
      direction: higher
      minimum_effect: pentanomial strictly larger, constant factor.
    - metric: >-
        WDSat/ANF UNSAT conflict count at matched (m, t, l), pentanomial vs
        trinomial modulus
      direction: different
      minimum_effect: >-
        PREREGISTERED: NO difference beyond the c-band of IDEA-20260915-0d8e90 (E1).
        A difference beyond the band is E2 and would contradict the exhaustive-core
        law -- the informative outcome.
    - metric: >-
        peak solver memory at matched (m, t, l), pentanomial vs trinomial modulus
      direction: higher
      minimum_effect: >-
        pentanomial strictly larger, by the support-size ratio -- the concrete
        confound on WDSat's static compile-time allocation (KN-LIT-6e036d).

  minimal_test:
    design: >-
      NO SOLVER for the core claim. PART 1 (this machine, seconds): at m = 7, 11,
      15 where both a weight-3 and a weight-5 irreducible polynomial exist, build
      the two F_2-multiplication tensors and count distinct quadratic monomials and
      per-output XOR length; confirm the constant-factor gap of (A). PART 2 (this
      machine): generate the t = 2 Weil-descent summation systems over each modulus
      at matched (m, l) and count total monomial support and mean XOR-clause length;
      confirm (B). PART 3 (deferred to an engine-equipped executor): run WDSat/ANF
      on both and record conflict count, per-conflict time, and peak memory;
      classify E1 vs E2. This machine (4 core, 6 GB) does PART 1 and PART 2 now; the
      solver in PART 3 is the deferred discriminator and is where the WDSat vendored
      source (inputs/TRIMOSKA-WDSAT-2024) would run.
    controls:
      - >-
        Same-weight control: two distinct irreducible trinomials (and two
        pentanomials) of the same degree must give equal support and (E1) equal
        conflict count up to relabelling -- isolates w from the specific polynomial.
      - >-
        Fixed-V control: hold the factor-base subspace V identical across moduli, so
        the only varied quantity is the modulus; any support/conflict difference is
        then attributable to w alone.
      - >-
        Null object for E2: a shape-matched random Boolean system of the same
        support size, to check that a conflict-count difference (if any) tracks the
        modulus and not raw system size.
    required_metrics:
      - distinct quadratic monomial count of the multiplication tensor, per weight
      - descended-system total monomial support and mean XOR-clause length
      - (deferred) WDSat/ANF conflict count, per-conflict time, peak memory

  falsification_conditions:
    - >-
      The weight-3 and weight-5 tensors give equal distinct-quadratic-monomial
      counts at matched m: (A) is false and the record collapses.
    - >-
      The descended-system support is equal or larger for the trinomial at matched
      (m, t, l): (B) is false.
    - >-
      Two distinct trinomials of the same degree give different conflict counts
      beyond the c-band: the confound is not clean (the specific polynomial, not w,
      drives it) and the control design must change.
    - >-
      The conflict count differs between moduli beyond the c-band (E2): the
      exhaustive-core law of IDEA-20260915-0d8e90 is contradicted through the
      modulus -- a result that would need independent review and would reopen the
      basis-blindness claim.

  confounders:
    - >-
      Attributing a wall-time or memory difference between two NIST degrees to V
      when it is partly the modulus. This is the very confound the record names; the
      remedy is pinning the modulus or reporting conflict count.
    - >-
      Solver implementation constants (variable ordering heuristics, XG-ext
      preprocessing) that vary with clause length independently of w -- these must
      be held fixed (same solver build, same flags) across the modulus arms.
    - >-
      Existence bias: at most m the standard's trinomial/pentanomial choice is
      forced by which irreducibles exist, so a cross-DEGREE comparison cannot vary w
      independently of m; only a within-m comparison (both irreducibles present)
      isolates w.

  interpretation_limits:
    - >-
      A derivation plus a measurement design, unreviewed. Not evidence. The PART 3
      solver classification (E1 vs E2) is the only part that touches the search
      exponent and it is deferred.
    - >-
      No exponent moves and no curve is weakened. The record's own proves-too-much
      control forbids reading w as a security difference; w is a constant on cost
      and (E1) zero on the exponent.
    - >-
      Scoped to the polynomial-basis representation the NIST standard fixes. A
      different field representation has a different tensor and is a separate object.
    - >-
      The confound statement (D) is only as strong as the exhaustive-core law it
      leans on for the conflict-count metric; on wall-time and memory it holds
      unconditionally from (A)-(B).

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a degree-m reduction polynomial of Hamming weight w, the F_2 bilinear
        multiplication tensor has O(m . w) nonzero structure constants beyond the
        schoolbook diagonal, so the number of distinct quadratic monomials entering
        the m reduced output coordinates grows linearly in w and in m, and the
        pentanomial/trinomial ratio of that count tends to a constant > 1 as m
        grows.
      rigorous_support: >-
        Polynomial reduction modulo t^m + r(t) replaces each t^k, k >= m, by
        t^{k-m} r(t); a weight-w modulus contributes w - 1 fold terms per
        overflowing degree, an exact and elementary count of the reduction map's
        support. This is the standard sparse-modulus arithmetic behind why NIST
        prefers low-weight moduli.
      validation_plan: >-
        Build the tensors at m = 7, 11, 15, 23 for weight-3 and weight-5 moduli,
        count distinct quadratic monomials per output and in total, and fit the
        pentanomial/trinomial ratio versus m; confirm it approaches a constant > 1
        rather than growing or vanishing. Pure arithmetic on this machine; tails
        checked by pushing m to the largest degree the machine factors quickly.
    - id: H2
      statement: >-
        Conditional on the exhaustive-core law (conflict count = c . 2^{ml}), the
        modulus weight w affects only the per-conflict cost and the peak memory,
        both linear in the clause length / support size, and leaves the conflict
        count within the c in [0.9, 1.0] band.
      rigorous_support: >-
        IDEA-20260915-0d8e90's claim that WDSat's UNSAT run is an exhaustive core
        over the ml factor-base bits, whose SIZE is set by (m, l) and not by the
        clause encoding; a change of encoding that preserves the solution set cannot
        change an exhaustive count, only the per-node work.
      validation_plan: >-
        PART 3 solver run (deferred): compare conflict counts across moduli at
        matched (m, t, l) and test the null "counts equal within the c-band" against
        the alternative "counts scale with support". Report both consequences side
        by side, as GOAL-SEMBIN-fcb7a2 does for the first-fall-degree readings, so a
        difference is recorded as contradicting the law rather than as a modulus
        result.

  target_complexity:
    time_exponent: >-
      No exponent claimed. The search exponent is ml (the exhaustive core of
      IDEA-20260915-0d8e90), independent of the modulus under E1. The modulus moves
      the CONSTANT multiplying 2^{ml} (per-conflict work) by the XOR-length ratio,
      pentanomial/trinomial ~ 5/3 in the leading term.
    memory_exponent: >-
      Unchanged in exponent; the peak memory constant scales with the monomial
      support, larger for pentanomial moduli. Relevant because WDSat allocates
      statically at compile time (KN-LIT-6e036d), so the support size sets a hard
      footprint.
    best_known: >-
      The comparator is the program's own WDSat/ANF cost at one modulus
      (KN-LIT-036049 benchmark instances); there is no external "best known" for a
      modulus-weight effect because the effect has not been isolated.
    hidden_overhead: >-
      The "constant factor" hides the specific term-spread of a given pentanomial:
      two pentanomials of the same degree can differ in support by an O(1) amount,
      folded into the c-band and checked by the same-weight control.
    tradeoff_note: >-
      Trinomial moduli (233, 409) are cheaper per conflict and in memory than their
      pentanomial neighbours (163, 283, 571) at matched (m, t, l); this is a
      wall-clock/footprint tradeoff internal to the solver, not a point on the
      attack's time-memory frontier, and it does not reorder the degrees by
      difficulty (which is set by m).

  dominated_by: >-
    As an ATTACK: n/a, none claimed; no cost row moves and the record's own control
    forbids reading a security difference from the modulus. As a MEASUREMENT/
    CONTROL: dominated by nothing in the corpus on the modulus-weight axis --
    GOAL-FROB-6333a9's basis-blindness null varies the F_2-basis WITHIN one field
    (one modulus), IDEA-20260922-37e02e varies a multiplicative property of V at
    fixed modulus, and IDEA-20260915-0d8e90 states the exhaustive-core law without
    varying the modulus. IDEA-20260922-af7396 uses XOR density as a null-object
    control but does not make it the tracked object or a program-wide confound.
    None of these varies the reduction polynomial, so none dominates on this axis;
    each, conversely, is the thing this control protects.
  sota_delta: >-
    Zero on every ECDLP cost axis. Against the program's prior state: the reduction
    polynomial is promoted from an unstated background choice to a named, priced,
    subtractable confound with a within-m isolation design, so that every
    V-selection measurement (kappa, Frobenius stability, and future ones) acquires
    the control it currently lacks; and the exhaustive-core law acquires a new,
    cheap falsification route (E2) through the modulus. Against the external
    literature: unverified; sparse-modulus arithmetic is standard and the
    exhaustive-core law is internal, and no retrieval query resolved this session.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: medium
