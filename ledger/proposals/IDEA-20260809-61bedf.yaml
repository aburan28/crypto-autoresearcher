idea:
  id: IDEA-20260809-61bedf
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    Report space-time volume, not "N qubits for T hours" — the pair hides a
    tradeoff dial that the reader cannot see
  class: representation
  claim: >-
    A quantum cost estimate is usually quoted as a qubit count paired with a
    runtime, but the two are exchangeable along a tradeoff curve, so the quoted
    pair is a point chosen by the author. The claim is that reporting the
    space-time volume plus the curve makes estimates comparable across papers that
    chose different points, and that at least two published estimates which look
    very different are close in volume — which would mean the apparent progress
    between them is partly a change of operating point.
  mechanism: >-
    For a fixed algorithm and assumption set, sweep the parallelism dial (factory
    count, routing width, windowing) to trace the qubit-versus-time curve, and
    report the volume along it. Published points are located on the curve.
  why_not_a_renamed_known_approach: >-
    Space-time volume is a known figure of merit in fault-tolerance work. Using it
    to RE-EXPRESS published headline pairs, and testing the specific hypothesis
    that some apparent improvements are movements along the curve rather than
    reductions in volume, is the contribution and is falsifiable.
  predictions:
  - observable: volumes of published estimates re-expressed under one pipeline
    metric: volume per estimate
    predicted: >-
      Closer together than the headline pairs suggest for at least one pair of
      estimates. If volumes differ as much as the headlines, the improvements are
      genuine volume reductions and the record says so plainly.
  - observable: shape of the qubit-time curve
    metric: exponent of the tradeoff over the swept range
    predicted: Close to inverse proportionality over part of the range with saturation at both ends; the saturation points are the interesting features.
  minimal_test: >-
    Sweep the parallelism dial at one problem size and assumption set, trace the
    curve, locate published points on it, and report volumes.
  controls:
  - 'FIXED-ASSUMPTION CONTROL: volumes are compared only under one assumption set; comparing volumes computed under each paper''s own assumptions reintroduces the confound the representation exists to remove.'
  - 'ENDPOINT CONTROL: the curve must reproduce the pipeline''s default point exactly at the corresponding dial setting.'
  falsification_conditions:
  - Volumes differ by as much as the headline pairs, falsifying the hypothesis.
  - The dial cannot be swept over a useful range in the pipeline, making the curve unavailable.
  interpretation_limits: >-
    Volume is one figure of merit and not a complete description; a machine with
    an impractical qubit count at low volume is not thereby feasible. No
    feasibility statement follows.
  sota_delta: 'No feasibility claim. Delta: a representation that makes published estimates comparable, plus a falsifiable hypothesis about what part of published progress it explains.'
  dominated_by: Not dominated by any corpus record; depends on IDEA-20260809-5de637 for the reproduced points.
  estimated_cost: Implementation small on top of the pipeline; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for space-time volume: no records. WEB NOT CHECKED.'
  source_refs:
  - Quantum resource estimation papers whose points are to be located -- RECALLED, REQUIRED READS.
