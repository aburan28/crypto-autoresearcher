idea:
  id: IDEA-20260915-0d8e90
  title: >-
    The PDP cost law the boundary table should test: WDSat's UNSAT conflict count
    equals c * 2^{ml} with c in [0.9, 1.0] (an exhaustive core), so the S_4
    relation-search phase costs 3 c * 2^{n+l} conflicts in closed form -- exponent
    1 in n against rho's 1/2 -- and the measured slope in n, not any per-instance
    wall time, is the cell's boundary quantity
  class: mechanism
  research_question_id: RQ-ICPERF-94c86e
  question_id: RQ-ICPERF-94c86e
  area: ICPERF
  goal_ids: [GOAL-ICPERF-e6b6a4]
  status: proposed
  proposed_by: idea-generator
  task_id: TASK-20260915-5ba08b
  recorded_at: '2026-09-15'
  claim: >-
    On the Trimoska S_4 Weil-descent instances with V = {deg x < l} and m = 3
    factor-base points, WDSat in default configuration refutes an unsatisfiable
    instance in conf = c * 2^{3l} conflicts with c in [0.9, 1.0], independent of n
    at fixed l, i.e. it visits essentially every assignment of the 3l core
    variables and prunes nothing above the leaves. Read against the UNREVIEWED
    per-cell medians of RUN-ICPERF-305ca3 - 30978.5 conflicts at (15,5) versus
    2^15 = 32768 (c = 0.945), 254656.5 at (17,6) versus 2^18 = 262144 (0.971),
    255301 at (19,6) versus 2^18 (0.974) - the law fits to 3-6% on all three shipped
    cells, and this record predicts it holds at the unshipped cells (21,7), (23,7),
    (25,8) that the point sampler of IDEA-20260915-3f1964 can now generate. Combined
    with the exact-mean yield lambda = C(|Fb_E| + 2, 3)/#E ~ 2^{3l-n}/6 and the
    negation-halved relation requirement N_rel ~ 2^{l-1}, the relation-search phase
    of an S_4 index calculus driven by this solver costs, in the small-lambda regime,
    T_rel(n, l) = (N_rel / p) * [(1 - p) C_U + p C_S] ~ 3 c * 2^{n+l} conflicts,
    which is (a) exponentially worse than exhaustive search over the group (2^n),
    (b) exponentially worse than rho (0.886 * 2^{n/2}), and (c) INDEPENDENT of how
    the factor-base parameter l is balanced - larger l makes each instance 8x
    costlier and 8x fewer targets are needed, exactly cancelling. The boundary-table
    quantity that carries information is therefore the fitted exponent of T_rel in
    n at fixed l (predicted 1.00 +- 0.05) and c(l) as l grows (predicted flat); a
    measured c(8) below 0.5 would be the first evidence that the SAT approach
    becomes sub-exhaustive, and is the outcome worth finding.
  mechanism: >-
    Proposition 1 of KN-LIT-102cdb (as relayed there and in H-ICPERF-cc4847) says
    that once the ml core variables are assigned, every e-variable is fixed by
    propagation through e_k = sigma_k(x), so the DPLL tree over the core has 2^{ml}
    leaves. What that proposition does NOT say is whether propagation from a
    PARTIAL core assignment ever refutes a subtree; the three unreviewed medians
    say it does not, to within 3-6%: on UNSAT instances the solver walks the whole
    tree. The algebraic reason is in the dichotomy of IDEA-20260915-3f1964 - for a
    side-0 target and a fixed partial assignment (x_1 twist-side, say) the residual
    system in (x_2, x_3) still has F_q-rational solutions only through 2-torsion
    coincidences, but it has plenty of solutions over the closure and the descended
    equations do not become inconsistent over F_2 until the last block is nearly
    complete. Exhaustive-core behaviour is also what Yokoyama-Yasuda-Takahashi-Kogure
    (J. Math. Cryptol. 2020, retrieved this session) derive for the GROEBNER side of
    the same naive method - in their trivial-ideal (UNSAT) case the S-polynomial
    cost is C ~ d^m with d = |V|, and they conclude the naive method "cannot be more
    efficient than the rho method and even the brute force method" under their
    statistical assumptions. The SAT law here is the same statement measured in
    conflicts. Symmetry breaking (-b) lowers c: if it enforced a full ordering
    x_1 <= x_2 <= x_3 the leaf count would be C(2^l + 2, 3) ~ 2^{3l}/6, i.e. c ~ 0.17;
    the unreviewed run shows about 2.5x fewer conflicts, so the shipped -b enforces
    a partial order, and the gap between 2.5x and 6x is itself a measurable
    inefficiency of the symmetry breaking.

    THE CLOSED FORM. Per target the solver pays C_U = c * 2^{3l} * t_conf if the
    target is undecomposable (probability 1 - p) and C_S ~ C_U / (6 k + 1) on
    average if it is decomposable with k table solutions (first-solution position
    is uniform over the tree); p = 1 - e^{-lambda}, lambda = C(|Fb_E| + 2, 3)/#E.
    With N_rel = |Fb_E|/2 + extra relations needed, T_rel = (N_rel / p) *
    [(1 - p) C_U + p C_S]. For lambda << 1 (every shipped cell has lambda <= 0.33),
    p ~ lambda ~ 2^{3l-n}/6 and N_rel ~ 2^{l-1}, so T_rel ~ 2^{l-1} * 6 * 2^{n-3l} * c *
    2^{3l} = 3 c * 2^{n+l} conflicts. At (19,6) with the unreviewed t_conf = 2.35 s /
    255301 ~ 9.2 us this is about 3 * 0.97 * 2^25 * 9.2 us ~ 900 s of WDSat time for
    the 32 relations of one toy index calculus, against a few hundred group
    operations for rho on the same group. The table cell that matters is not 900 s;
    it is that log2 T_rel grows by 1.00 per bit of n.

    WHY THIS IS A MECHANISM AND NOT A TAUTOLOGY. The law can fail in two directions
    that mean different things. c dropping with l means propagation prunes and the
    SAT PDP has a sub-exhaustive regime - the only route by which a SAT-driven index
    calculus could ever move off exponent 1. c constant means the SAT advantage
    reported in KN-LIT-102cdb is an advantage in the CONSTANT and MEMORY of an
    exhaustive search over V^m, which is a precise, citable characterisation of what
    RQ-SATIC-1ae57a's attribution question is about.
  novelty_status: adaptation
  novelty_screen:
    what_is_not_new: >-
      The 2^{ml} search space is Proposition 1 of KN-LIT-102cdb (relayed). The
      Groebner-side lower bound C >= m d^{m-1} (trivial ideal C ~ d^m) and the
      conclusion that naive index calculus is no better than rho or brute force is
      Yokoyama-Yasuda-Takahashi-Kogure 2020 (retrieved). That summation-polynomial
      index calculus loses to rho over prime-degree F_{2^n} is the conclusion of
      Galbraith-Gebregiyorgis 2014/806 (retrieved).
    what_is_new: >-
      Stating the SAT-side law in conflicts with a measurable constant c and
      pre-registering it on new cells; the closed form T_rel ~ 3 c 2^{n+l} with its
      l-independence; the reading of the -b gap (2.5x versus 6x) as a measurable
      symmetry-breaking deficit; and the identification of c(l) as the single
      quantity whose decay would change the exponent. No corpus record states the
      conflict law or the closed form.
    searched: >-
      rg over knowledge/ for FIND_ALL_SOLUTIONS, 2^{ml}, cost per relation, yield
      per (hits - KN-LIT-6e036d, KN-TECH-014, KN-OPEN-008, none stating the law);
      H-ICPERF-cc4847 and EXP-ICPERF-66fd51 in full; WebSearch for Koblitz index
      calculus versus rho, which surfaced the two retrieved papers above.
  citations:
    - ref: experiments/EXP-ICPERF-66fd51/runs/RUN-ICPERF-305ca3/task-report.md
      provenance: internal
      claim: >-
        UNREVIEWED OBSERVATIONS - per-cell WDSat default U medians in conflicts
        (n15l5 30978.5, n17l6 254656.5, n19l6 255301), wall medians (0.2160,
        2.3216, 2.3471 s), U/S conflict ratios 3.6-6.7, symmetry-breaking wall
        reduction about 2x.
      verified_by: idea-generator TASK-20260915-5ba08b (read this session)
    - ref: KN-LIT-102cdb
      provenance: internal
      claim: >-
        Proposition 1 - branching on the ml core variables gives search space
        2^{ml}; S and U instances reported separately because their profiles
        differ. Relayed from the PDF read on 2026-09-06; not reproduced.
      verified_by: coordinator 2026-09-06 (read); re-read by TASK-20260915-5ba08b
    - ref: 'doi:10.1515/jmc-2019-0029 Yokoyama, Yasuda, Takahashi, Kogure, Complexity bounds on Semaev naive index calculus method for ECDLP, J. Math. Cryptol. 2020, Sections 4.1-4.2 and conclusion'
      provenance: retrieved
      claim: >-
        Under statistical assumptions on summation polynomials the Groebner (S-polynomial)
        cost of one naive PDP is at least m d^{m-1}, and about d^m when the ideal is
        trivial (no solution); total cost exceeds q^{(m-1)/m (1 - eps)}; "the naive
        index calculus method cannot be more efficient than Pollard's rho method
        ... [and] even the brute force method".
      verified_by: idea-generator TASK-20260915-5ba08b (WebSearch fetch; Sections 4.1, 4.2 and conclusion read this session; the doi and author list are as printed on the fetched page)
    - ref: 'ePrint 2014/806 Galbraith-Gebregiyorgis, abstract and Section 1 conclusion'
      provenance: retrieved
      claim: >-
        "Pollard rho is still much faster than index calculus algorithms for the
        ECDLP ... over prime extension fields F_{2^n} of reasonable size."
      verified_by: idea-generator TASK-20260915-5ba08b (read this session)
    - ref: KN-LIT-73f7e1
      provenance: internal
      claim: rho baseline constant sqrt(pi/2) without negation; 0.886 with negation (recalled by that record).
      verified_by: coordinator 2026-09-15; re-read by TASK-20260915-5ba08b
    - ref: inputs/SEMAEV-2015-310/paper_fulltext.md eq. (11)
      provenance: internal
      claim: Idealised per-target yield 2^{mk-n}/m! for a k-dimensional V.
      verified_by: validator TASK-20260913-da3982 (per IDEA-20260913-cedd2f); not re-opened this session
  assumptions:
    - conf[0] counts every leaf-level conflict once and WDSat has no restarts that would inflate the count relative to distinct leaves (the code is DPLL without restarts per KN-LIT-6e036d; to be confirmed on the build).
    - Default variable order branches on the 3l core variables first (P3a of H-ICPERF-cc4847 - core_order reproduces default exactly on 60/60 instances, unreviewed).
    - N_rel ~ |Fb_E|/2 assumes the negation map halves the unknowns and no Frobenius quotient (IDEA-20260915-8fe0ef changes this on Koblitz cells).
  proof_search_map:
    bottleneck: >-
      The per-instance UNSAT cost of the PDP solver as a function of l, which
      multiplies the number of targets to give the relation-search phase.
    baseline_embedding:
      parameter_slice: >-
        The three shipped cells; c must reproduce 0.945 / 0.971 / 0.974 from
        results.jsonl before any new cell is read.
      reproduction_check: >-
        Recompute the medians from results.jsonl with the contract's row filter;
        agreement to the last printed digit or the law is being fitted to the
        wrong numbers.
    observation_collision:
      observable: c = median UNSAT conflicts / 2^{3l}.
      distinct_preimage_search: >-
        c ~ 1 is produced both by "exhaustive core, no pruning" and by "pruning
        that saves exactly what restarts or learned-clause overhead costs". WDSat
        has no learning; the collision is broken by counting DECISIONS as well as
        conflicts and by the noncore_first control (a scrambled order visits far
        more than 2^{3l} nodes - unreviewed lower bound >= 50x - so the order, not
        the count, is what the leaf-count law is about).
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The cost of one index-calculus relation search as a sum over targets of
          per-target charges, each charge specialised to SAT or UNSAT and to the
          exact table count of the target.
        predicted_gain: >-
          A closed form with one measured constant per configuration, checkable
          cell by cell, that makes the n-exponent of the pipeline a fitted number.
    quantifier_order: >-
      For every cell (n, l) with l <= 8 and every default-configuration UNSAT
      instance, conf lies in [0.9, 1.0] * 2^{3l} up to per-instance spread of at
      most 10% about the cell median; the exponent claim is about the median of
      T_rel across cells at fixed l.
    method_ceiling:
      strongest_certifiable_claim: >-
        That at l <= 8 on this host the SAT-driven S_4 relation search has exponent
        1 in n and the rho column exponent 1/2; nothing about l >= 9 or about any
        other solver.
      nearby_object_control: >-
        The null objects of the run (random Boolean systems of identical shape) -
        the law predicts NO fit to 2^{3l} for them (they have no core; conflicts
        20-114x higher where finished, unreviewed), so a fit there would mean the
        law is about size, not structure.
    proof_obligations:
      - claim: default order is core-first (P3a)
        responsibility: baseline
      - claim: leaf count = 2^{3l} when no partial-assignment refutation occurs
        responsibility: correctness
      - claim: T_rel closed form from per-target charges
        responsibility: runtime
      - claim: p = 1 - e^{-lambda} with the exact-mean lambda
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: c = median UNSAT conflicts / 2^{3l}, WDSat default
      direction: different
      minimum_effect: in [0.9, 1.0] at (21,7), (23,7), (25,8) with certified-U targets from the table
    - metric: c under symmetry breaking (-b)
      direction: lower
      minimum_effect: in [0.17, 0.5]; the distance above 1/6 is the symmetry-breaking deficit and is reported
    - metric: fitted slope of log2(median UNSAT conflicts) in n at fixed l
      direction: different
      minimum_effect: 0.00 +- 0.05 (per-instance cost does not grow with n at fixed l)
    - metric: fitted slope of log2(T_rel) in n at fixed l, T_rel computed from measured p and measured C_U, C_S
      direction: different
      minimum_effect: 1.00 +- 0.10, against a matched rho slope of 0.50 +- 0.05 on the same cells
    - metric: T_rel at fixed n across l in {6, 7, 8}
      direction: different
      minimum_effect: within a factor 1.5 of each other (the l-cancellation)
  minimal_test:
    design: >-
      Using the IDEA-20260915-3f1964 sampler, generate 20 certified-U and 20 S
      instances at (17,6), (19,6), (21,7), (23,7), (25,8) with the vendored
      Weil_descent program; rebuild WDSat per cell with exact constants; run default
      and -b; record conflicts and decisions; fit c(l) and the n-slopes; compute
      T_rel per cell from measured quantities and a matched negation-map rho on the
      same subgroup in the same session; report both slopes.
    controls:
      - NULL - matched random Boolean systems at each new cell (the run's construction); the law must NOT fit them.
      - KNOWN-FALSE - noncore_first order on 5 instances per cell; the leaf-count law must fail (conflicts far above 2^{3l}), confirming that the law is a property of the core-first order.
      - RECONSTRUCTION - the three shipped cells' c recomputed from results.jsonl before any new cell.
      - SIDE STRATIFICATION - c on side-0 and side-1 U targets separately (the attack's targets are all side-0).
    required_metrics:
      - conflicts, decisions, wall_s, cpu_s per row with status
      - c per (cell, config, side)
      - p, lambda, |Fb_E|, N_rel per cell from the table
      - T_rel per cell; rho iterations and wall per cell (>= 20 solves, median)
      - fitted slopes with standard errors
  falsification_conditions:
    - c(l) below 0.5 at l = 7 or 8 for default order on certified-U side-0 targets - the exhaustive-core law fails and the SAT PDP has a pruning regime; the closed form's exponent is then an upper bound only and the interesting successor is to measure the pruning.
    - Fitted UNSAT-conflict slope in n at fixed l outside [-0.1, 0.1] - the per-instance cost depends on n, contradicting the leaf-count reading.
    - T_rel slope in n outside [0.85, 1.15] on the measured cells - the closed form is wrong somewhere named by the per-cell residuals.
    - The law fitting the null objects (c in [0.9, 1.0] for random systems) - the count measures size, not the core structure, and the mechanism paragraph is withdrawn.
  confounders:
    - Symmetry breaking implementation details in the vendored WDSat (what -b actually enforces) - read the source before interpreting the -b constant.
    - MAX_ID sizing per cell changes propagation cost, not the leaf count; conflicts are the primary unit for that reason and wall time is secondary.
    - Certified-U targets drawn as random side-0 field elements versus as subgroup points R = uP + vQ - both are side-0; the subgroup restriction matters only through parity (IDEA-20260915-3119c9) and is controlled by drawing both kinds.
    - Load on the shared host affects wall_s, never conflicts; slopes are fitted on conflicts.
  interpretation_limits:
    - Scoped to WDSat (and any engine given the same order) on S_4 Weil-descent instances at l <= 8 on this host; nothing about Groebner engines (their law is IDEA-20260915-3476de's to measure), nothing about l >= 9, nothing about m != 3.
    - The exponent-1 statement is about a SAT-driven pipeline with this solver and this factor-base family; it is not a statement about summation-polynomial index calculus in general and does not touch Semaev's Assumption 1 or first-fall-degree questions, which stay with GOAL-SEMBIN-5078bc / GOAL-DREG-001.
    - Reported literature timings enter no ratio.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The first-solution position of WDSat in the core tree is uniform over the
        leaves, so C_S ~ C_U / (6 k + 1) for a target with k unordered table
        solutions.
      rigorous_support: >-
        Exact for a fixed traversal order and a uniformly random placement of the
        6k solution leaves among 2^{3l}; imitates the order-statistics of k uniform
        points in [0, 1] (expected minimum 1/(k+1)).
      validation_plan: >-
        Sample >= 200 S instances per cell from the table with known k; compare the
        empirical distribution of conflicts_S / 2^{3l} against Beta(1, 6k) per k;
        tail check - the fraction of S instances with conflicts above 0.9 * 2^{3l}
        must match (0.1)^{6k}.
    - id: H2
      statement: >-
        Relation requirement N_rel = |Fb_E| / 2 + extra with extra <= 10, i.e. the
        relation matrix over the negation-quotient reaches full rank after that many
        relations.
      rigorous_support: >-
        A random sparse matrix over F_r with 3 nonzeros per row reaches full rank
        with O(1) excess rows with high probability (classical random-matrix rank
        results); imitated, not proved for these structured rows.
      validation_plan: >-
        Collect relations at (17,6) and (19,6) to 1.5 x |Fb_E|/2 and record the
        rank profile; compare extra to the random-matrix prediction; a systematic
        rank deficit is the parity obstruction of IDEA-20260913-cedd2f or a
        Frobenius dependency and is reported as such.
  target_complexity:
    time_exponent: >-
      Measured claim about the incumbent, not a proposal - T_rel = 3 c 2^{n+l}
      conflicts, exponent 1 in n at fixed l for the SAT-driven S_4 pipeline at
      l <= 8; no improvement proposed.
    memory_exponent: >-
      WDSat is O(1) in the instance (static allocation, about 17 MB); rho with
      distinguished points is O(w) chosen freely.
    best_known: >-
      rho with negation 0.886 * 2^{n/2} group operations (KN-LIT-73f7e1); the
      exhaustive table 2^{3l}/6 additions per cell (IDEA-20260915-3f1964); Semaev
      2015/310's conditional 2^{1.6986 sqrt(n ln n)} (Assumption 1, unvalidated).
    hidden_overhead: >-
      t_conf grows with the ANF size (polynomial in n, l) and with MAX_ID; the
      conflicts unit hides it deliberately and wall_s is reported beside it.
    tradeoff_note: >-
      Per-target instances are embarrassingly parallel; T_rel/M on M cores with no
      shared memory, against rho's 2^{n/2}/M with a shared distinguished-point
      store. The parallel positions do not change the exponent gap.
  dominated_by: >-
    n/a (no algorithmic result claimed). The frontier rows read - rho with
    negation at 0.886 * 2^{n/2} time and O(w) memory (KN-LIT-73f7e1, HEUR-VOW-CURVE
    as scored there); exhaustive group search 2^n; the exhaustive V^3 table at
    2^{3l}/6 per cell; WDSat S_4 pipeline at 3 c 2^{n+l} (this record's closed form
    from unreviewed inputs). Every row dominates the last on time at every n >= 1
    and l >= 1; this record measures that fact and proposes no new point.
  sota_delta: >-
    No exponent moved. Quantitatively - converts the reported SAT-over-Groebner
    gap into a law with one constant, states the relation-search cost of the
    SAT pipeline as 3 c 2^{n+l} conflicts (about 900 s at (19,6) from unreviewed
    inputs) against a rho column of a few hundred group operations, and names c(l)
    as the single quantity whose decay would change the picture.
  estimated_cost:
    implementation: low
    compute: medium
    wall_clock_seconds: 43200
    memory_gb: 2
    note: >-
      Advisory. Depends on IDEA-20260915-3f1964's sampler. At (25,8) a default
      UNSAT run costs about 2^24 conflicts ~ 150-300 s; 20 U + 20 S per cell x 2
      configs x 5 cells fits in half a day on two cores.
  recommended_priority: high
  inference:
    policy: research-deep
    reasoning_effort: null
