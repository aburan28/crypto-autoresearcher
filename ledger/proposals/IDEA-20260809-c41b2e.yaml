idea:
  id: IDEA-20260809-c41b2e
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-HYBRID-cdf2b2
  goal_id: GOAL-HYBRID-001
  title: >-
    Enumerate the lattice of key-derivation input subsets and derive which binding
    property survives each — the deployed combiners are points in it
  class: representation
  claim: >-
    A combiner is characterized, for binding purposes, by WHICH values enter its
    key derivation: the two shared secrets, the post-quantum ciphertext and public
    key, the traditional public values, and a label. That is a small finite
    lattice. The claim is that binding properties are monotone over it, that each
    property's survival can be derived per subset rather than tested, and that the
    deployed and proposed combiners occupy specific points whose properties then
    follow immediately.
  mechanism: >-
    Enumerate subsets; for each, determine by derivation which values an adversary
    can vary while keeping the derived secret fixed; map that freedom to the
    taxonomy's properties. Monotonicity means adding an input can only strengthen
    binding, so the lattice has an order and the derivations compose.
  why_not_a_renamed_known_approach: >-
    Individual combiners are analysed in their own papers. Analysing the LATTICE
    covers combiners nobody has proposed and makes the deployed choices' positions
    visible as design decisions rather than as given constructions.
  predictions:
  - observable: monotonicity of binding properties over the lattice
    metric: boolean, checked across all subset pairs
    predicted: Holds. A non-monotone case would be a structural surprise and more valuable than the lattice itself.
  - observable: minimal subsets achieving each property
    metric: minimal elements per property
    predicted: >-
      Small -- each property should have a minimal subset of one or two inputs,
      which is exactly the practical guidance a combiner designer needs.
  minimal_test: >-
    Enumerate the subsets, derive each property's status per subset, check
    monotonicity across all pairs, and locate the named combiners in the lattice.
  controls:
  - 'CERTIFICATE CROSS-CHECK: for a sample of subsets, the derived status is confirmed by attempting an actual certificate; a derivation contradicted by an artifact is wrong.'
  - 'DEFINITION ANCHOR: property definitions come from filed primary text, since the entire lattice is a statement about those definitions.'
  falsification_conditions:
  - Monotonicity fails without an explanation.
  - A derivation is contradicted by a constructed certificate.
  interpretation_limits: >-
    The lattice covers hypothetical combiners; a point in it is not a claim that
    anyone implements it. Deployed combiners are located, not evaluated as
    deployments.
  sota_delta: 'No attack. Delta: a complete design-space map where the field has per-construction analyses.'
  dominated_by: Depends on IDEA-20260809-c13e6a for the component baseline; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible; derivation-heavy.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for combiner lattice: no records. WEB NOT CHECKED.'
  source_refs:
  - Hybrid KEM drafts and X-Wing -- RECALLED, REQUIRED READS.
