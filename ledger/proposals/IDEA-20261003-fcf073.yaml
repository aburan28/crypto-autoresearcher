# IDEA-20261003-fcf073
# Multiplication-degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-fcf073
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    Multiplication by 5 has degree 25 and multiplication by 4 has degree 16
  class: measurement
  claim: >-
    Multiplication by 5 has degree 25. Multiplication by 4 has
    degree 16. Twenty-five exceeds sixteen by 9. The product of
    the two degrees is 400. Their sum is 41. The gap is a map
    degree, not an ECDLP exponent and not a square of 2 or of 3.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Five squared is 25. Four squared is 16. Two maps of
    degree 16 have gap 0 and product 256. No point is mapped.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-f5c584
      provenance: internal
      claim: >-
        A first-fall degree of 2 is a different object from these
        two multiplication degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The multipliers 5 and 4 are frozen before the squares are taken.
    - No point is mapped.
  proof_search_map:
    bottleneck: The degree gap 9.
    baseline_embedding:
      parameter_slice: The degrees 25 and 16.
      reproduction_check: >-
        Two readers must agree that 5 squared is 25 and that 4
        squared is 16.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 16 drops the gap. Two maps of
        degree 16 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 25 and 16.
        predicted_gain: Integer gap. No mapping of a point.
    quantifier_order: >-
      The multipliers are fixed before the degrees.
    method_ceiling:
      strongest_certifiable_claim: >-
        The degrees 25 and 16. Not a square of 2 or of 3.
      nearby_object_control: >-
        Two maps of degree 16. The gap is 0 and the product is 256.
    proof_obligations:
      - claim: Multiplication by 5 has degree 25.
        responsibility: size
      - claim: Multiplication by 4 has degree 16.
        responsibility: size
      - claim: The gap is not a square of 2 or of 3.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: degree_gap
      direction: different
      minimum_effect: Twenty-five exceeds sixteen by 9.
  minimal_test:
    design: >-
      Square 5 and square 4, then subtract 16 from 25. Do not map
      a curve point.
    controls:
      - Two maps of degree 16, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
      - the gap
      - the product
  falsification_conditions:
    - The degree of multiplication by 5 is not 25.
    - The product of the two degrees is not 400.
  confounders:
    - The degree pair 9 and 4 belongs to multipliers 3 and 2.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic endomorphism.
    - This is not the degree pair 9 and 4.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen multiplication by 5 has degree 25, and the
        frozen multiplication by 4 has degree 16.
      rigorous_support: >-
        No endomorphism theorem is re-proved here. The count is a
        reading of two squares.
      validation_plan: >-
        Two independent squares. A mismatch voids the gap.
  target_complexity:
