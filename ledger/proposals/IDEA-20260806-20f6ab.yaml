idea:
  id: IDEA-20260806-20f6ab
  question_id: RQ-ECDLP-002
  added: '2026-08-06'
  title: >-
    NOT AN EXPONENT MOVE, AND THE TITLE SAYS SO: the representation technique
    (splitting one decomposition into two halves in C(m, m/2) distinct ways)
    prices the "large prime" escape that this corpus declares dead by argument
    -- it is worth a factor 2^{Theta(m)}, which is O(1) at fixed arity and
    N^{o(1)} at the coverage-optimal arity m ~ log N / log log N, so the
    meet-in-the-middle exponent 1/2 + 1/m is UNMOVED and the escape is now
    closed with a NUMBER instead of an argument
  class: algorithm

  claim: >-
    THIS RECORD'S HEADLINE IS A NEGATIVE WITH A PRICE TAG. It is filed under the
    admissibility clause for constant-factor and subpolynomial results and it
    states its ceiling in its own title, because this corpus already contains a
    constant-factor line billed as a "~50x crypto improvement" and that inflation
    is the failure mode being avoided.

    (A) THE TRACKED OBJECT AND THE MECHANISM. Fix a factor base F of size B and
    arity m. The decomposition search asks: given target R, find a size-m
    multiset from F summing to R. Meet-in-the-middle splits the multiset into two
    halves of size m/2 and joins on the group element; cost B^{ceil(m/2)}. THE
    REPRESENTATION TECHNIQUE observes that ONE solution admits
    C(m, m/2) DISTINCT ordered half-splits, all of which are valid. So one may
    IMPOSE a constraint on the intermediate half-sum - require the half-sum's
    x-coordinate to lie in a public window W of relative density 1/R_w - and
    still expect a surviving representation whenever C(m, m/2) / R_w >= 1. The
    two half-lists shrink by 1/R_w each, the join shrinks by 1/R_w, and the
    number of solutions found shrinks by R_w / C(m, m/2). Balancing at
    R_w = C(m, m/2) gives a list-size reduction of exactly
        rho_rep(m) = C(m, m/2) ~ 2^m / sqrt(pi m / 2).
    This is the same lever as "large prime" or "partial relation" harvesting -
    accept a partial decomposition whose residual lands in a prescribed set - but
    stated so its value is COMPUTABLE rather than argued.

    (B) THE HONEST ACCOUNTING, WHICH IS THE DELIVERABLE.
      - At FIXED m the gain is a CONSTANT in N: 2 at m=2, 6 at m=4, 20 at m=6,
        70 at m=8, 252 at m=10. It multiplies no exponent and it does not touch
        the linear-algebra stage at all.
      - At the COVERAGE-OPTIMAL arity, where B^m ~ m! N forces
        m ~ log N / log log N with B ~ log N, the gain is
        2^{Theta(log N / log log N)} = N^{Theta(1 / log log N)} = N^{o(1)}.
        AN N^{o(1)} FACTOR IS NOT AN EXPONENT IMPROVEMENT. At N = 2^256 with
        m = 32 it is C(32,16) = 601,080,390, i.e. 29.2 bits - large in bits,
        zero in exponent, and BOTH numbers must be quoted together or neither.
      - It is subject to the Amdahl ceiling IDEA-20260805-1f4a11 derives for the
        BKK line: a speedup applied to relation collection alone is bounded end
        to end by 1/(1-s) where s is collection's share, approximately 2 at the
        balanced optimum. THE 29.2 BITS COLLAPSE TO AT MOST 1 BIT END TO END
        UNLESS s > 0.5 is measured, and no record in this corpus reports s.
      - Under the memory-matched baseline derived in IDEA-20260806-3b91c7 the
        comparison tightens further, because the technique costs MEMORY (two
        stored half-lists) and buys only TIME.

    (C) WHY THIS IS WORTH FILING DESPITE BEING A NEGATIVE. Catalogue entry A1-1
    closes the partial-relation / large-prime escape by ARGUMENT - "in a
    prime-order group there is no cheap large-prime stage", because the residual
    is a uniform group element and steering it into a tier-2 set of size L costs
    Theta(N/L) rejected trials per acceptance. That argument is correct and this
    record does not contest it. What it adds is the EXACT PRICE of the one
    manoeuvre that partially defeats the rejection cost: representations. The
    rejection cost is R_w per acceptance and the representation multiplicity is
    C(m, m/2) acceptances per solution, so the two cancel exactly at
    R_w = C(m, m/2) and NOT BEYOND. That cancellation point is the quantitative
    content of A1-1's qualitative closure, and it converts "no cheap large-prime
    stage" from a screened mechanism (a fatigue report, per
    docs/inventor-protocol.md section 4) into a named obstruction with an
    argument and a number: THE ESCAPE IS WORTH EXACTLY C(m, m/2) AND NO MORE,
    AND C(m, m/2) IS N^{o(1)} IN EVERY REGIME WHERE THE ATTACK IS COHERENT.
    IDEA-20260803-fa9839 names large-prime harvesting (its HEUR-AT-3) as the one
    ingredient that might explain the extension-field exponent and asks whether
    it ports to prime fields; this is a direct, numerical answer.

    (D) THE REACHABLE POSITIVE, STATED SO THE RECORD IS NOT A FOREGONE NEGATIVE.
    The balancing in (A) applies the constraint ONCE. If the split is applied
    RECURSIVELY - four quarter-lists, then two halves, then the join, as in
    higher-level representation algorithms - the multiplicity available at each
    level compounds. The record's open question, and its only route to something
    exponent-relevant, is whether the total multiplicity across a depth-d
    recursion is 2^{Theta(m)} (no gain over depth 1, the expected outcome) or
    2^{Theta(m*d)} with d growing (which would be a genuinely different
    accounting). THE PREDICTION IS THE FORMER AND IT IS FALSIFIABLE BY EXACT
    COUNTING AT TOY SIZES.

  object_first_candidate:
    tracked_object: >-
      THE REPRESENTATION MULTIPLICITY rho_rep of a single decomposition: the
      number of distinct ordered half-splits of one fixed size-m multiset that
      satisfy an imposed intermediate constraint. It is followed through the
      split-and-join computation and it is the quantity that pays for the
      rejection cost. Every prior record in this lane tracks the RESIDUAL (a
      group element, catalogue O1) or the TUPLE; the multiplicity is a
      combinatorial property of the SOLUTION, not of any intermediate state, and
      that is why it can be counted exactly before anything runs.
    established_families_off_limits: >-
      Declared off-limits as the primary lens: Groebner and solving-degree
      instrumentation; monodromy and Galois statistics; isogeny, CM and
      endomorphism leverage; pairing transfer; Weil descent; lattice methods;
      alternative curve models. Summation polynomials and factor bases are the
      SETTING, not the lens: this record proposes no new factor base, no new
      membership predicate and no new summation-polynomial manipulation, and any
      reading of it as a factor-base proposal is a misreading - KN-FIND-007
      forbids that reading and the screen verdict below says so.
    newness_score: >-
      The representation technique is a known external method for subset-sum
      (Howgrave-Graham-Joux, Becker-Coron-Joux lineage). I did NOT open a primary
      source - eprint and arXiv are unreachable here - so its statement is an
      UNVERIFIED RECOLLECTION and is used ONLY as the name of a manoeuvre whose
      arithmetic I derive from scratch below; no exponent, constant or theorem is
      quoted from it. What the duplication audit did not find in the 64 committed
      proposals or the 47 ECDLP catalogue entries is any record that prices the
      partial-relation escape by counting representations. IDEA-20260731-012
      combines two DISTINCT partial relations sharing a large prime; this splits
      ONE relation into two halves. Different objects, different counts.
    testability_score: >-
      Maximal for the counting (exact binomials and exhaustive enumeration at
      toy B and m) and high for the measured arm (a pure-Python join at
      B <= 2^12, no numpy, no SageMath, no solver, no ECDLP solve).
    survival_score: >-
      The multiplicity count survives to every m as exact combinatorics. The
      COST claim dissolves where the window constraint stops being independent
      of the half-sum distribution - i.e. where the half-sums are not
      equidistributed over the group, which is precisely the regime small B
      forces - and locating that dissolution is the measurement.

  mechanism: >-
    DERIVED IN THIS RECORD. Every number below is exact combinatorics or a
    one-line balancing computation; nothing is quoted from an unread source.

    STEP 1 - THE BASELINE JOIN, RESTATED SO THE GAIN HAS A DENOMINATOR. Enumerate
    all size-ceil(m/2) sub-multisets of F: L_1 = C(B + ceil(m/2) - 1, ceil(m/2))
    ~ B^{ceil(m/2)}/ceil(m/2)!. Store them keyed by group element. Enumerate the
    complements against the target: L_2 ~ B^{floor(m/2)}/floor(m/2)!. A join costs
    max(L_1, L_2) with O(1) lookups. Expected solutions per target is the
    conservation mean C(B+m-1, m)/N, EXACTLY and geometry-independently
    (KN-FIND-007) - this record does not touch that mean and does not claim to.

    STEP 2 - IMPOSING THE CONSTRAINT. Fix a public window W subset of F_p of
    relative density 1/R_w and require the FIRST half-sum's x-coordinate to lie
    in W. Both lists shrink to L_i / R_w (the half-sums are heuristically
    equidistributed - assumption H1). The join therefore costs
    max(L_1, L_2)/R_w. But a given solution survives only if at least one of its
    C(m, m/2) half-splits satisfies the constraint, which happens with
    probability 1 - (1 - 1/R_w)^{C(m,m/2)} ~ min(1, C(m,m/2)/R_w).

    STEP 3 - THE BALANCE, AND THE EXACT CANCELLATION. Expected cost per solution
    found is [max(L_1,L_2)/R_w] / min(1, C(m,m/2)/R_w). For R_w <= C(m,m/2) the
    denominator is 1 and cost = max(L,·)/R_w, DECREASING in R_w. For
    R_w > C(m,m/2) the denominator is C(m,m/2)/R_w and cost = max(L,·)/C(m,m/2),
    CONSTANT in R_w. The optimum is therefore AT R_w = C(m,m/2) and the total
    gain is EXACTLY C(m, m/2), never more. THIS IS THE WHOLE RESULT AND IT IS ONE
    LINE OF ALGEBRA.

    STEP 4 - PUTTING THE NUMBER IN BOTH UNITS, AS THE ADMISSIBILITY CLAUSE
    DEMANDS. C(m, m/2) = 2, 6, 20, 70, 252, 924, 3432 at m = 2, 4, 6, 8, 10, 12,
    14. In the fixed-m regime that is a constant and the time exponent
    ceil(m/2)*beta is UNCHANGED. In the coverage-optimal regime m grows and
    C(m,m/2) ~ 2^m/sqrt(pi m/2) = N^{Theta(1/log log N)}: superpolynomial in
    log N, subpolynomial in N, and therefore inside the o(1). AT N = 2^256,
    m = 32: C(32,16) = 601,080,390 = 2^{29.16}. Both readings are true and
    neither may be quoted alone.

    STEP 5 - WHAT IS NOT GAINED, AND WHY IT MATTERS MORE THAN WHAT IS. (i) The
    memory does not shrink: both half-lists are still built before filtering
    unless the enumeration can be restricted to the window a priori, which
    requires deciding "is x(sum of these ceil(m/2) base points) in W" without
    forming the sum - i.e. the constrained-decomposition problem again, at
    half the arity. This is the recursion in (D) and it is the only thing worth
    testing. (ii) The linear-algebra stage is untouched, so the Amdahl ceiling
    1/(1-s) applies, and at the balanced optimum s ~ 1/2 caps the end-to-end
    gain at ~2 REGARDLESS of C(m,m/2). (iii) The conservation mean is untouched:
    this record does not claim more decompositions exist, only that the ones that
    exist are cheaper to find by a bounded factor.

    STEP 6 - WHY THE ANSWER IS NOT SIMPLY "USE A BIGGER FACTOR BASE INSTEAD". A
    constant-factor search speedup at fixed B is not interchangeable with
    increasing B, because increasing B raises the linear-algebra cost as B^omega
    and the optimum B is where the two balance. A pure search gain therefore
    shifts the optimum slightly and buys the square root of itself in the
    balanced cost - i.e. C(m,m/2)^{1/2} at best - which HALVES the bit count in
    step 4 and is stated here rather than discovered later.

  novelty_status: unverified

  literature_context:
    - >-
      The representation technique for subset-sum (Howgrave-Graham-Joux 2010;
      Becker-Coron-Joux 2011 lineage) is an UNVERIFIED RECOLLECTION. NO PRIMARY
      SOURCE WAS OPENED - eprint and arXiv are unreachable from this
      environment. It may NOT be cited as prior art, as support, or as a source
      of any constant or exponent, and this record deliberately derives every
      number it uses. If a reviewer can transcribe the primary statement, the
      honest status of the manoeuvre becomes `known` and the DELIVERABLE - the
      price of the escape in this specific setting - is unchanged.
    - >-
      ideas/catalogue-20260805/A1-index-calculus.md READ IN FULL. A1-1 closes the
      partial-relation route by argument (three exhaustive branches; residual is
      uniform; steering costs Theta(N/L)); A1-2 derives the algebra-free
      meet-in-the-middle exponent N^{1/2+1/m} at memory N^{1/2}. Both are
      pre-ledger. This record accepts both and prices the manoeuvre A1-1's third
      branch would need.
    - >-
      ledger/proposals/IDEA-20260805-1f4a11.yaml READ IN FULL. Its Amdahl ceiling
      1/(1-s) and its additive c-accounting Delta c = ln S / sqrt(ln N ln ln N)
      are adopted verbatim as constraints on this record's own number, which is
      why the headline is stated as a bounded factor rather than as a speedup.
    - >-
      knowledge/findings/KN-FIND-007.md READ IN FULL. The conservation mean is
      untouched and is quoted only as the unchanged denominator.

  lossy_projection_identifiability_audit:
    projection: >-
      A size-m decomposition multiset -> the SET of its ordered half-splits
      satisfying the window constraint -> the count rho_rep of that set.
    what_is_discarded: >-
      Which base elements are used, which halves they fall into, and the group
      elements involved. Only an integer in [0, C(m, m/2)] is retained.
    why_genuinely_lossy: >-
      Strictly lossy with enormous fibres: all decompositions with the same
      surviving-split count share the value, and at m = 4 that is an integer in
      [0,6] standing for a multiset drawn from B^4/24 possibilities. Nothing is
      recoverable - this is not the (Delta, Pi) failure of KN-LIT-7595.
    why_compatible_with_the_operations: >-
      The operation the object must survive is the SPLIT-AND-JOIN, and it does so
      deterministically: whether the algorithm finds a given solution is a
      deterministic function of rho_rep alone (found iff rho_rep >= 1), and
      nothing about the discarded structure enters that predicate. The
      propagation rule under recursion is also on the retained integer alone:
      splitting each half again multiplies the available multiplicity by the
      per-half count, which is exactly the quantity prediction 4 measures.
    is_it_only_a_change_of_coordinates: >-
      NO on both classical failure modes: fibres are enormous, and the object is
      not constant (rho_rep ranges over [0, C(m,m/2)] with a computable
      distribution). THE HONEST WEAKNESS, RECORDED: rho_rep carries NO ELLIPTIC
      INFORMATION AT ALL under H1 - it is a function of a window-membership
      pattern that is heuristically independent of the curve. Any curve-specific
      content therefore lives entirely in the DEPARTURE of the measured rho_rep
      distribution from Binomial(C(m,m/2), 1/R_w), which is exactly what the
      matched null in the minimal test isolates. A projection that passes both
      classical tests and is still uninformative unless a null is subtracted is
      the third failure mode named in IDEA-20260805-1f4a11, and it applies here
      too.

  assumptions:
    - >-
      Half-sums of ceil(m/2) factor-base elements are equidistributed enough over
      F_p that window membership is independent across the C(m,m/2) splits of one
      solution. FALSE in the extreme (the splits of one multiset are highly
      dependent - they sum to the same target), and the record measures the
      dependence rather than assuming it away.
    - >-
      The window W is public and membership is O(1) to test. True for an interval
      or a residue class on x; false for any window requiring a solve.
    - >-
      B and m are in a regime where the conservation mean is at least 1, so a
      solution exists to have representations of. Below that regime rho_rep is
      counting representations of nothing.

  predictions:
    - metric: >-
        Exact gain factor at the optimum, derived symbolically, as a function of
        m
      direction: different
      minimum_effect: >-
        EXACTLY C(m, m/2), i.e. 2, 6, 20, 70, 252, 924, 3432 at m = 2..14 even.
        FORCED AND FALSIFIABLE: if the balancing yields a gain that GROWS with
        R_w past R_w = C(m,m/2), the derivation is wrong; if it yields a gain
        below C(m,m/2)^{1/2} the manoeuvre is worth even less than claimed. Both
        branches are reachable on paper in an hour.
    - metric: >-
        Measured list-size reduction and measured solutions-found rate at
        p in {1009, 4001, 16001}, B in {2^6, 2^8, 2^10}, m in {4, 6, 8}, window
        density 1/R_w swept over {1, 2, 4, ..., 2*C(m,m/2)}
      direction: different
      minimum_effect: >-
        The measured cost-per-solution curve must be DECREASING in R_w below
        C(m,m/2) and FLAT above it, with the elbow located within a factor 2 of
        C(m,m/2). THE DECISIVE ALTERNATIVE: an elbow materially BELOW C(m,m/2)
        means the splits are dependent (H1 fails) and the manoeuvre is worth less
        than the combinatorial count; an elbow materially ABOVE means something
        is being counted twice and the derivation is wrong. A curve with NO elbow
        means the window constraint is not doing what the model says.
    - metric: >-
        End-to-end gain after charging linear algebra, at the lane's own optimal
        B, reported as 1/(1 - s + s/C(m,m/2)) with s measured
      direction: different
      minimum_effect: >-
        FORCED CONSEQUENCE STATED BEFORE THE RUN: whatever s is, the end-to-end
        gain is bounded by 1/(1-s). At s = 1/2 the bound is 2.0 and the 29.2-bit
        figure at m = 32 collapses to 1 bit. There is no measurement that can
        make C(m,m/2) an end-to-end number unless s > 1 - 1/C(m,m/2). Reporting
        s at all would be a first for this lane.
    - metric: >-
        Recursive multiplicity: total surviving representations across a depth-2
        split (four quarter-lists), counted exactly at m = 8, B = 2^6
      direction: different
      minimum_effect: >-
        PREDICTED 2^{Theta(m)} with the SAME constant, i.e. no compounding, so
        the depth-2 gain is at most C(8,4)*C(4,2)^2 / (correction for
        double-counted splits) and after the correction is O(C(8,4)). THE
        DECISIVE ALTERNATIVE: if the exact count shows the depth-d gain growing
        as 2^{Theta(m*d)} with the cost growing more slowly, the accounting is
        genuinely different from depth 1 and this record's negative headline is
        WRONG in the direction that matters. This is the record's only route to
        anything exponent-relevant and it is counted exactly, not estimated.

  minimal_test:
    design: >-
      Three stages, cheapest first, stage 0 decisive for the headline.
      STAGE 0 (pen and paper, ZERO compute, ~1 hour). Derive steps 1-6. Emit the
      gain table in both units (raw factor and bits at N = 2^256 with the
      coverage-optimal m). Emit the Amdahl-capped end-to-end table as a function
      of s. If the balancing does not produce the exact cancellation at
      R_w = C(m,m/2), stop.
      STAGE 1 (pure Python, minutes; no numpy, no SageMath, no solver). Toy
      curves at p in {1009, 4001, 16001}. Build both half-lists exhaustively,
      apply the window, join, count solutions found and operations performed.
      Sweep R_w. Report the elbow with an interval.
      STAGE 2 (pure Python, minutes). Exact recursive count at m = 8, B = 2^6:
      enumerate all depth-2 split patterns of every found solution and count
      distinct surviving ones with the double-counting correction stated in
      advance.
    controls:
      - >-
        KNOWN-ANSWER EDGE WITH NO HIDDEN COST (runs first, and it is why this
        record can be trusted about a gain). At R_w = 1 (window = everything) the
        instrument must return the UNCONSTRAINED meet-in-the-middle cost and
        solutions-found rate EXACTLY - gain factor 1.000, no filtering, no
        rejection. An instrument built to detect a representation gain will
        detect one everywhere unless it returns exactly 1.000 where the
        constraint is vacuous. CAN FAIL: an off-by-one in the window predicate or
        a double-counted split shows up immediately as a gain at R_w = 1.
      - >-
        MATCHED COMBINATORIAL NULL (CAN FAIL). Replace the curve entirely: draw
        m indices i.i.d. Uniform{1..B}, define the "half-sum" as a sum of
        integers mod N with no curve and no group law, and run the IDENTICAL
        window predicate and counting code. FORCED VALUE: the elbow must appear
        at C(m,m/2) with the same shape, because rho_rep carries no elliptic
        information under H1. IF THE CURVE ARM AND THE NULL DIFFER, the
        difference is the elliptic content and is worth its own record; if they
        agree, the manoeuvre is pure combinatorics and its price is universal.
        Either outcome is a result.
      - >-
        PLANTED POSITIVE (CAN FAIL). Plant a decomposition whose first-half sum
        is constructed to lie inside W. The join MUST find it at every R_w, and
        the certificate (sum of the m base points equals R) must be re-verified
        independently of the search. An instrument that misses a planted
        in-window solution has no power and no negative may be read.
      - >-
        DEGENERATE-PARAMETER CHECK THAT MUST FAIL. Set R_w far above C(m,m/2)
        (say 100x). Solutions-found rate must COLLAPSE to ~C(m,m/2)/R_w and
        cost-per-solution must be FLAT, not falling. If cost-per-solution keeps
        falling past the elbow, the accounting is wrong and the headline number
        is not the optimum.
      - >-
        GRADED CONTROL, >= 4 INTERIOR POINTS, MONOTONICITY REQUIRED. The R_w
        sweep itself: cost-per-solution must be monotone decreasing then flat,
        with no interior minimum. A non-monotone curve indicates the window is
        interacting with the factor-base geometry, which under KN-FIND-007
        cannot change the mean and must therefore be an artifact.
      - >-
        ARCHIVE CHECK (zero compute). Record what IDEA-20260731-012 counts (two
        distinct partial relations sharing a large prime) against what this
        record counts (two halves of ONE relation), and record fa9839's HEUR-AT-3
        sentence verbatim. Under AGENTS.md retrieval policy item 7 both are
        reported; no status change to either is proposed.
    required_metrics:
      - gain table C(m,m/2) in raw factor AND in bits, with the regime stated
      - measured cost-per-solution vs R_w with the elbow and its interval, per cell
      - the same for the matched combinatorial null, side by side
      - s (relation-collection share) and the Amdahl-capped end-to-end gain
      - exact depth-2 recursive multiplicity with the double-counting correction
      - memory in stored half-list entries, charged, at every cell

  falsification_conditions:
    - >-
      Stage 0's balancing does not produce the exact cancellation at
      R_w = C(m,m/2). The derivation is wrong and the record is withdrawn.
    - >-
      The R_w = 1 calibration returns a gain != 1.000. Instrument broken; nothing
      may be read.
    - >-
      The measured elbow sits materially below C(m,m/2) at every cell. H1 fails,
      the splits are dependent, and the escape is worth LESS than the
      combinatorial count - which strengthens A1-1's closure and weakens this
      record's own number.
    - >-
      The exact depth-2 count shows compounding at 2^{Theta(m*d)} with
      subproportional cost growth. THIS RECORD'S NEGATIVE HEADLINE IS WRONG, the
      manoeuvre is more than a bounded factor, and the result must be routed to
      independent review before it is described anywhere.
    - >-
      The matched combinatorial null does NOT reproduce the elbow. Something
      curve-specific is happening that the model does not contain, and the model
      is wrong before the number means anything.

  confounders:
    - >-
      SMALL B DISCRETISATION. At B = 2^6 and m = 8 the half-lists have
      C(64+3,4) ~ 766,480 entries but the group has only ~2^{11} elements at
      p = 1009, so the join is saturated and window density is not independent of
      the multiset. Cells must be chosen with B^{m/2} well below N, and cells
      that are not must be excluded before the run rather than explained after.
    - >-
      DEPENDENCE OF SPLITS. The C(m,m/2) splits of one solution are not
      independent - they partition the SAME multiset - so the survival
      probability 1-(1-1/R_w)^{C(m,m/2)} is an upper bound. The measured elbow
      location is the direct test and the record predicts it may sit below the
      combinatorial value.
    - >-
      THE AMDAHL SHARE s IS UNMEASURED IN THIS ENTIRE CORPUS. Every gain quoted
      here is a collection-stage gain and is capped end to end by 1/(1-s). This
      is not a caveat added at the end; it is in the title's claim and in the
      required metrics.
    - >-
      AUTHORSHIP: this record's headline is a negative, which is cheap to
      produce and reads as rigour. The depth-2 exact count exists specifically so
      that the positive branch is reachable and clearly stated, and the planted
      positive control exists so that a null result costs something.

  interpretation_limits:
    - >-
      NO EXPONENT IS MOVED. The meet-in-the-middle time exponent remains
      ceil(m/2)*beta and, composed with the conservation mean, the algebra-free
      total remains N^{1/2+1/m} at memory N^{1/2}. Pollard rho at 0.886*sqrt(N)
      remains the baseline and is not approached.
    - >-
      C(m, m/2) IS N^{o(1)}, AND o(1) TERMS ARE NOT EXPONENT IMPROVEMENTS. The
      29.2-bit figure at N = 2^256, m = 32 is a real number in bits and a zero in
      the exponent; quoting it without the exponent statement would be exactly
      the inflation this record is written to avoid.
    - >-
      TOY TIER for every measurement (p <= 16001, B <= 2^10, m <= 8). No
      crypto-scale claim in any direction.
    - >-
      It does not refute A1-1, does not supersede IDEA-20260731-012 or
      IDEA-20260731-007, and proposes no status change to any record. It answers
      one sub-question of IDEA-20260803-fa9839's HEUR-AT-3 with a number.
    - >-
      Forward guidance, mandatory. What remains open regardless of outcome:
      (a) whether the window constraint can be applied A PRIORI - restricting the
      enumeration rather than filtering it - which would convert the gain from
      time-only to time-and-memory and is the constrained-decomposition problem
      at half arity, i.e. KN-OPEN-001 recursively; (b) whether any analogue of
      the representation lever applies to the LINEAR ALGEBRA stage, where the
      Amdahl ceiling says the remaining factor lives and which no record in this
      corpus has attempted; (c) the value of s, which nobody has measured.

  standing_screen_verdicts:
    kn_find_007_mean_yield:
      verdict: PASSES - EXPLICITLY MAKES NO MEAN-YIELD CLAIM
      reasoning: >-
        The conservation mean C(B+m-1,m)/N enters this record ONLY as the
        unchanged denominator of cost-per-solution. No factor base is proposed,
        no geometry is varied, and the record claims strictly fewer solutions
        found (by the factor C(m,m/2)/R_w) in exchange for strictly cheaper
        lists. The arguable axis used is SOLVE COST, which KN-FIND-007 lists as
        one of the four surviving axes. Had this record claimed the window
        increases yield it would be refuted before running, and it does not.
    kn_find_c41ea9_generic_fibre:
      verdict: NOT APPLICABLE - PASSES
      reasoning: >-
        The observable is a representation count and a cost-per-solution curve.
        It is not a cycle type, Galois group, monodromy statistic or Frobenius
        census, and it is not evaluated on the generic fibre or on any fibre of
        the summation cover. Noted for completeness: the record does not use
        summation polynomials at all - the join is on group elements, which is
        catalogue A1-2's algebra-free formulation - so the complete-splitting
        theorem has nothing to act on here.
    kn_find_002_ggm_simulable:
      verdict: PASSES - NO ORACLE IS PROPOSED, AND THE SIMULATION ARGUMENT BINDS
      reasoning: >-
        No augmented oracle is proposed and no closed family (jet, endomorphism,
        elliptic-net, incidence) is reopened. The construction is a plain
        generic-group search using only additions and equality tests, so
        KN-TECH-005's Omega(sqrt N) bound applies to it in full - which is
        consistent with, and indeed explains, the headline that the gain is
        N^{o(1)} rather than an exponent. A record claiming an exponent here
        would have to defeat the simulation argument; this one is a
        constant-factor claim precisely because it cannot and does not try.

  discriminated_from:
    nearest_existing_idea: IDEA-20260731-012
    nearest_existing_read: >-
      Title and the first four lines of its claim block read via the audit's E3
      enumeration: "Let E/F_p carry a prime-order subgroup G of order N, let F be
      a factor base of size B = N^beta, and fix decomposition arity m >= 4.
      Define the large-prime pool L = {L_1..L_{B'}} (|L| = B' = N^{beta'},
      beta' < beta) as a public set of points of G. Replace the arity-m
      membership test..." Full body NOT read; stated so a reviewer can re-check.
    differing_observable: >-
      THE THING COUNTED. IDEA-20260731-012 counts COMBINABLE PAIRS: two DISTINCT
      partial relations that share a large prime from a public pool L and can be
      subtracted to yield one full relation; its observable is the number of
      collisions in the large-prime pool and its cost driver is the birthday
      threshold on |L|. This record counts REPRESENTATIONS OF ONE RELATION: the
      C(m, m/2) ordered half-splits of a SINGLE size-m multiset, and its
      observable is the elbow location in the cost-per-solution curve as the
      window density is swept. The two are measurable in one shared harness and
      return different numbers: 012's gain is governed by |L| and a birthday
      collision rate; this record's is governed by C(m,m/2) and is INDEPENDENT
      of any pool. A cell in which 012's pool is EMPTY (B' = 0) still exhibits
      this record's full elbow, which is the cleanest separation available and is
      specified as a control arm.
    second_and_third_records_checked:
      - >-
        IDEA-20260731-007 (title and claim head read): the degree-split Semaev
        claw, a meet-in-the-middle over the SUMMATION-POLYNOMIAL degree with a
        Dickman-style smoothness heuristic HEUR-DS-1, claiming
        O~(B^{m/2} u^{-u}). That splits the ALGEBRAIC problem by degree and its
        gain factor is u^{-u} from a smoothness distribution; this record splits
        the COMBINATORIAL multiset by cardinality and its gain factor is a
        binomial coefficient with no smoothness anywhere. Different heuristics,
        different gain functions, different observables. This record makes no
        smoothness assumption at all, which is stated as a positive:
        HEUR-DS-1 is the corpus's most-contested heuristic and nothing here
        depends on it.
      - >-
        Catalogue A1-1 (read in full): closes the partial-relation escape by
        argument and names steering cost Theta(N/L) per acceptance. This record
        accepts that closure and supplies the exactly-cancelling multiplicity,
        converting the argument into a number. It does not contradict A1-1; it
        completes it. A1-1 is pre-ledger and mints no identifier.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a factor base F of size B and a window W of relative density 1/R_w,
        the events {x(half-sum of split j) in W}, j = 1..C(m,m/2), over the
        C(m,m/2) half-splits of one fixed size-m solution, behave like
        independent Bernoulli(1/R_w) trials.
      rigorous_support: >-
        The rigorous half: the x-coordinates of sums of random subsets of a
        factor base are equidistributed over x(E(F_p)) up to a Weil error term
        O(sqrt(p) log p / |subset space|), which is the standard character-sum
        bound and is the same equidistribution the corpus's own
        IDEA-20260727-006 studies. The classical distribution it imitates is the
        uniform-random-subset-sum model used for knapsack density arguments. The
        heuristic half is INDEPENDENCE ACROSS SPLITS OF THE SAME MULTISET, which
        is FALSE in the strict sense (the splits sum to the same target) and is
        the record's weakest link; it is stated formally so it can be rejected
        rather than inherited.
      validation_plan: >-
        Sample directly: at p in {1009, 4001, 16001}, B in {2^6, 2^8, 2^10},
        m in {4, 6, 8}, enumerate ALL solutions found and, for each, count
        EXACTLY how many of its C(m,m/2) half-splits land in W, over >= 10^4
        solutions per cell. Compare the empirical distribution of that count
        against Binomial(C(m,m/2), 1/R_w) by a chi-square on the full histogram,
        not on the mean. TAIL CHECK: the observed fraction of solutions with ZERO
        surviving splits against the predicted (1-1/R_w)^{C(m,m/2)}, which is
        the quantity the whole gain rests on. TOY SCALE ONLY, labelled as such;
        no correspondence exists that would make this sampling crypto-scale for
        this quantity, and that absence is stated rather than glossed.
    - id: H2
      statement: >-
        At the coverage-optimal parameterisation the arity satisfies
        B^m = Theta(m! N), and the regime m ~ log N / log log N with
        B ~ log N is admissible.
      rigorous_support: >-
        The equation is the conservation identity of KN-FIND-007 set to mean 1
        and is exact. The admissibility of the stated regime is arithmetic:
        (log N)^{log N / log log N} = exp(log N) = N. What is HEURISTIC is that a
        factor base of size Theta(log N) with the required properties EXISTS and
        is recognisable in N^{o(1)} time, which over a prime field is exactly
        what IDEA-20260801-021's Bezout bound constrains. THE REGIME MAY BE
        UNREACHABLE, and if it is, the N^{o(1)} reading of the gain is vacuous
        and only the fixed-m constant reading survives - which is a WEAKER
        headline, not a stronger one.
      validation_plan: >-
        Not empirically validatable at toy scale (log N is 10-14 bits there, so
        the regime is not separable from fixed-m). Discharged instead by
        reporting the gain in BOTH regimes as separate rows with the
        admissibility of the second explicitly flagged as conditional on
        IDEA-20260801-021's bound and on KN-OPEN-020, and by never quoting the
        29.2-bit figure without the flag.

  target_complexity:
    time_exponent: >-
      UNMOVED, AND THAT IS THE HEADLINE. Algebra-free meet-in-the-middle
      decomposition remains Theta(B^{ceil(m/2)}) per attempt and, composed with
      the conservation mean, the total relation cost remains N^{1/2 + 1/m} at
      even m (catalogue A1-2's derivation, which this record adopts unchanged).
      The representation technique divides that by C(m, m/2), which is
      Theta(1) at fixed m and N^{Theta(1/log log N)} = N^{o(1)} at the
      coverage-optimal arity. Against Pollard rho's N^{1/2} the comparison is
      UNCHANGED at every arity: N^{1/2+1/m}/N^{o(1)} is still above N^{1/2}.
      Against BSGS's N^{1/2} time: likewise unchanged. THIS RECORD MOVES NOTHING
      ON EITHER BASELINE AND SAYS SO IN ITS TITLE.
    memory_exponent: >-
      Theta(B^{floor(m/2)}) stored half-list entries = Theta(N^{1/2}) at the
      coverage optimum, versus rho's O(1) and BSGS's N^{1/2}. THE TECHNIQUE
      SPENDS MEMORY AND BUYS TIME, so under the memory-matched baseline of
      IDEA-20260806-3b91c7 it must beat sqrt(N/N^{1/2}) = N^{1/4}, not N^{1/2} -
      a bar it misses by N^{1/4+1/m}. Multi-target: the half-lists are
      target-independent for the FIRST half only, so T targets amortize the
      first list and pay T times for the join; total
      Theta(B^{floor(m/2)}) + T*Theta(B^{ceil(m/2)}/C(m,m/2)), which beats
      T*0.886*sqrt(N) at no tested parameter.
    best_known: >-
      Pollard rho, 0.886*sqrt(N) group operations, O(1) memory. BSGS,
      (N^{1/2}, N^{1/2}). Prime-field index calculus has NO known advantage
      (KN-OPEN-001; this program's single support verdict was retracted at
      EV-IC-002). Nothing in this record changes any of those.
    hidden_overhead: >-
      Disclosed in full. (i) The window test costs one x-coordinate extraction
      and one comparison per candidate, charged. (ii) The half-lists are BUILT
      before filtering unless the enumeration can be restricted a priori, so the
      memory is NOT reduced by the technique even though the join is. (iii) The
      Amdahl ceiling 1/(1-s) caps the end-to-end effect at ~2 at the balanced
      optimum, and s is unmeasured everywhere in this corpus. (iv) Choosing B at
      the new optimum recovers only the square root of the gain (step 6), which
      HALVES the bit figure. All four make the number smaller, and all four are
      in the record rather than in a footnote.
    tradeoff_note: >-
      Time-memory: the technique moves along the frontier in the WRONG direction
      for a rho comparison - it needs N^{1/2} memory to buy an N^{o(1)} time
      factor. Parallelization: the list build is embarrassingly parallel; the
      join is a distributed-hash-join with communication proportional to the
      filtered list size, which the window constraint genuinely reduces by R_w
      and which is the one place the technique has a real practical benefit that
      no exponent captures. That benefit is stated as engineering, not as
      cryptanalysis.

  dominated_by: >-
    POLLARD RHO DOMINATES THIS CONSTRUCTION ON EVERY AXIS, and every frontier row
    this corpus holds was checked before writing that. TIME: rho at
    0.886*sqrt(N) = 2^{128} for a 256-bit N versus this construction's
    N^{1/2+1/m}/C(m,m/2), which at m = 4 is 2^{192-2.6} = 2^{189.4} - dominated
    by 61 bits. BSGS at N^{1/2}: same verdict. MEMORY: rho at O(1) versus
    N^{1/2} = 2^{128} stored entries - dominated absolutely. The memory-matched
    generic baseline sqrt(N/S) (IDEA-20260806-3b91c7): at S = N^{1/2} that is
    N^{1/4} = 2^{64}, dominating by 125 bits. DATA/QUERIES: both query-free on
    public parameters, so no advantage there. MULTI-TARGET sqrt(T*N)
    (IDEA-20260731-013): the amortized version above does not reach it at any
    tested T. PREPROCESSING frontier S*T^2 = Omega~(N) (KN-TECH-005): the
    construction sits far above it. No row was left as an unchecked null, and the
    construction is not on the frontier at any parameter.
  sota_delta: >-
    ZERO on every ECDLP attack axis - no solve, no relation at scale, no
    certificate, and nothing faster than 0.886*sqrt(N). The quantitative
    deliverable is a PRICE FOR A CLOSED ESCAPE: the partial-relation /
    large-prime manoeuvre that catalogue A1-1 closes by argument and that
    IDEA-20260803-fa9839 names as its weakest link HEUR-AT-3 is worth EXACTLY
    C(m, m/2) and no more - 2, 6, 20, 70, 252, 924, 3432 at m = 2..14 even; that
    is 2^{29.16} = 601,080,390 at the coverage-optimal m = 32 for N = 2^256, and
    it is N^{Theta(1/log log N)} = N^{o(1)}, hence ZERO change to any exponent;
    after re-optimising B only the square root survives (14.6 bits); and after
    the Amdahl ceiling 1/(1-s) at s ~ 1/2 the end-to-end figure is AT MOST 1 BIT.
    A four-line derivation replacing a qualitative closure with a bounded number
    is the whole contribution, and it is a subpolynomial one.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.90 that stage 0's cancellation at R_w = C(m,m/2) is correct, since it is
    one balancing computation. 0.55 that the measured elbow lands within a factor
    2 of C(m,m/2) - deliberately low, because H1's independence assumption is
    false in the strict sense and the splits of one multiset are strongly
    dependent; my expectation is that the measured elbow sits BELOW the
    combinatorial value, which would make the escape worth even less and would
    strengthen the negative. 0.85 that the depth-2 exact count shows no
    compounding (the record's expected outcome and its own headline). 0.95 that
    the matched combinatorial null reproduces the curve arm, because rho_rep
    carries no elliptic information under H1 - and if it does not, that
    disagreement is the most interesting thing the experiment could produce.

