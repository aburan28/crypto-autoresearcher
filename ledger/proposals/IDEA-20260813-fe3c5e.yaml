idea:
  id: IDEA-20260813-fe3c5e
  title: >-
    Sparse-regime baseline reproduction: does quantum-walk BJMM/MMT actually
    beat Grover-Prange at HQC's own weight regime?
  class: control
  claim: >-
    Kachigar-Tillich's published quantum-walk-accelerated MMT/BJMM
    cost-exponent formula, when specialized analytically to HQC's actual
    asymptotic weight regime (w = Theta(sqrt(n)), i.e. relative weight
    w/n -> 0), MAY reduce to a formula in which the representation-technique
    quantum walk's advantage over plain Grover-accelerated Prange vanishes
    in the leading exponential term -- which, if true, would mean HQC's
    actual best-known-quantum-attack baseline is Grover-accelerated Prange,
    not quantum-walk BJMM/MMT, at HQC's own standardized parameters. This
    proposal is a measurement/control task, not a new attack: it
    discriminates between "the RQ's bundled baseline framing is already
    correct at HQC's parameters" and "it needs a precise, regime-specific
    restatement of which published algorithm is actually tighter".
  mechanism: >-
    Classical ISD's representation-technique algorithms (Stern, Dumer, MMT,
    BJMM) buy their asymptotic advantage over plain Prange by exploiting
    MODERATE relative weight (w/n bounded away from 0, typically near the
    Gilbert-Varshamov weight for the code rate), where there is enough room
    in the search space to build large intermediate lists and merge them
    for a net gain. In the VERY SPARSE limit w/n -> 0 (as HQC's w =
    Theta(sqrt(n)) implies), the combinatorial gain from representation
    techniques is generically expected, from the classical ISD literature,
    to shrink relative to Prange, because there are too few ways to split a
    small-weight vector into balanced partial-weight pieces for
    list-merging to help much. This proposal asks which of the two already-
    established baselines (Grover-Prange vs Kachigar-Tillich's quantum-walk
    BJMM/MMT) is ACTUALLY tighter at HQC's specific, sparse (n,k,w)
    parameters, since the RQ names "Grover/quantum-walk-accelerated ISD" as
    one bundled baseline without specifying which regime dominates where.
  novelty_status: unverified
  assumptions:
    - >-
      HQC's error weight scales as w = Theta(sqrt(n)) (the sparse regime
      typical of code-based KEMs using fixed-weight sampling, as opposed to
      Classic McEliece's denser Gilbert-Varshamov-adjacent weight); this
      qualitative scaling is treated as background domain knowledge and was
      not independently re-derived from HQC's primary specification in this
      task.
  proof_search_map:
    bottleneck: >-
      The single asymptotic limit w/n -> 0 applied to Kachigar-Tillich's
      own general-weight-regime cost-exponent formula: does the
      walk-based algorithm's exponent formula, in this limit, converge to
      (a) the same exponent as Grover-Prange (representation techniques buy
      nothing extra in this regime, quantumly or classically) or (b) a
      strictly smaller exponent (the walk retains an advantage even in the
      sparse limit)?
    baseline_embedding:
      parameter_slice: >-
        HQC's actual parameter regime: n prime (about 17669 at HQC-128), k
        about n/2 (rate about 1/2 for the concatenated construction), w =
        omega about 66 at HQC-128 -- giving w/n about 0.0037, i.e. deep in
        the sparse limit relative to the moderate-weight regime classical
        ISD asymptotics (Stern/MMT/BJMM optimality analyses) are usually
        optimized for. These figures are drawn from general domain
        knowledge of HQC's parameter shape and were NOT independently
        re-verified against HQC's current primary specification text in
        this task -- flagged as an open verification step.
      reproduction_check: >-
        SYMBOLIC, NOT YET PERFORMED. This proposal's FIRST required step is
        to actually write down Kachigar-Tillich's published cost-exponent
        formula (not reproduced by this corpus entry, KN-LIT-80202e, which
        explicitly states "exact exponents ... not recorded here") as a
        function of the rate R=k/n and relative weight tau=w/n, and verify
        it reduces to the KNOWN classical Prange exponent in the tau->0
        limit with the representation-technique-specific terms vanishing.
        THIS BASELINE REPRODUCTION HAS NOT YET BEEN PERFORMED -- it is the
        proposal's own minimal test, not a prerequisite already satisfied,
        and is flagged honestly as an open step rather than assumed.
    observation_collision:
      observable: >-
        The leading-exponential-term cost formula for quantum-walk BJMM/MMT
        vs Grover-Prange, as functions of tau near tau=0.
      distinct_preimage_search: >-
        NOT YET PERFORMED -- requires the baseline reproduction above to be
        completed first before a collision search is even meaningful.
        Recorded honestly as blocked-pending-prior-step rather than skipped
        silently.
    constructive_transforms: []
    quantifier_order: >-
      The claim under test is: FOR HQC's SPECIFIC (n,k,w) parameter sets
      (not for ISD in general), IS the quantum-walk BJMM/MMT exponent
      STRICTLY smaller than the Grover-Prange exponent -- a claim about
      SPECIFIC parameter values, not a universal statement across all
      rate/weight regimes. The RQ's own baseline framing implicitly asserts
      a universal "quantum-walk beats Grover-Prange" without qualifying the
      regime; this proposal's quantifier-order point is exactly that the
      universal framing may not hold at HQC's specific sparse regime even
      if it holds at moderate-weight regimes where the original papers
      focused.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most, a CORRECTED, more precise statement of what HQC's OWN
        best-known-quantum-attack baseline actually is (Grover-Prange vs
        quantum-walk-BJMM/MMT, or some crossover point) -- a baseline-
        clarification result, not an attack. Even a full positive finding
        here does not move any exponent below the TRUE best-known baseline
        (whichever of the two it turns out to be); it only affects which of
        the two published algorithms should be CITED as HQC's best-known
        quantum attack.
      nearby_object_control: >-
        The nearby object is Classic McEliece's much denser-weight regime
        (t/n roughly Gilbert-Varshamov, i.e. NOT sparse), where the
        representation-technique literature (all corpus entries reviewed:
        KN-LIT-aa3372/37562e/224f2c/072f64/b8a8be) was clearly developed
        and optimized. Comparing HQC's sparse regime against this
        nearby, well-studied dense-regime object is exactly the control
        needed to see whether the published algorithms' advantage genuinely
        depends on the moderate-weight assumption.
    proof_obligations:
      - claim: >-
          Kachigar-Tillich's general-regime cost-exponent formula is
          correctly transcribed from the source (not yet done in this
          task).
        responsibility: baseline
      - claim: >-
          The tau->0 limit of that formula is correctly taken and compared
          against the independently well-established Prange exponent in
          the same limit.
        responsibility: correctness
      - claim: >-
          HQC's actual (n,k,w) parameters are correctly transcribed from
          HQC's specification (not independently re-verified against
          primary spec text in this task -- flagged as an open step).
        responsibility: interface
      - claim: >-
          Any finding is scoped to HQC's specific parameter sets and is not
          generalized to all quasi-cyclic or all sparse-regime codes
          without further work.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        Ratio of (quantum-walk BJMM/MMT exponent) to (Grover-Prange
        exponent) at HQC-128/192/256's actual (n,k,w)
      direction: different
      minimum_effect: >-
        A ratio detectably different from 1 in EITHER direction would be
        informative; the classical-ISD-literature-general expectation
        (based on the well-known fact that representation techniques lose
        their edge as relative weight shrinks -- generic domain knowledge,
        not independently re-derived here) is a ratio close to 1, meaning
        Grover-Prange and quantum-walk-BJMM/MMT nearly coincide at HQC's
        sparse parameters -- this would mean the RQ's stated baseline needs
        no numeric correction in practice even though its FORM should be
        stated more precisely as "whichever is smaller of the two,
        evaluated at the actual parameters".
  minimal_test:
    design: >-
      A from-scratch symbolic transcription of (1) Prange's classical
      exponent formula (well-established, textbook), (2) its Grover-
      accelerated quantum exponent (square-root of the classical
      success-probability exponent, standard), and (3) Kachigar-Tillich's
      general quantum-walk BJMM/MMT exponent formula AS PUBLISHED (requires
      actually obtaining and reading the paper -- WebFetch/WebSearch access
      to the actual arXiv paper 1703.00263 was not attempted before this
      task's budget priorities shifted elsewhere, and is named as the
      concrete next step), evaluated symbolically at HQC's three
      standardized (n,k,w) triples, and compared numerically.
    controls:
      - >-
        Sanity check: the tau->0 limit of formula (3) must reduce to
        something at least as good as (1)/(2), since a quantum-walk
        algorithm can never be asymptotically WORSE than Grover-Prange
        (Prange is itself a degenerate case the walk framework should
        recover as a special case) -- if the symbolic reduction gives
        something WORSE, that is a transcription error, not a finding.
    required_metrics:
      - Prange classical exponent at HQC-128/192/256
      - Grover-Prange quantum exponent at HQC-128/192/256
      - >-
        Kachigar-Tillich quantum-walk exponent at HQC-128/192/256 (BLOCKED
        pending primary-source read)
  falsification_conditions:
    - >-
      The completed symbolic comparison shows the quantum-walk exponent is
      STRICTLY and non-trivially smaller than Grover-Prange even at HQC's
      sparse parameters -- this falsifies the "baseline needs correction"
      hypothesis and confirms the RQ's existing baseline framing was
      already correct without qualification.
    - >-
      The tau->0 sanity check fails (walk formula gives something worse
      than Prange) -- indicating a transcription error in reading the
      source paper, not a finding about HQC.
  confounders:
    - >-
      HQC uses a CONCATENATED construction (an outer code composed with an
      inner code) rather than a single flat linear code; whether the
      "quasi-cyclic syndrome decoding" problem this RQ and Kachigar-
      Tillich's formula both describe is being applied to the RIGHT
      effective (n,k,w) after accounting for the concatenation is a
      separate transcription risk this proposal does not resolve, and is
      named rather than silently assumed away. This does NOT cite or rely
      on GOAL-HQC-001's DFR-model content as load-bearing -- it only flags a
      parameter-transcription risk using publicly known HQC structure.
  interpretation_limits:
    - >-
      This proposal's central step (reading Kachigar-Tillich's actual
      formula) was NOT completed in this session -- WebSearch failed and
      this task did not otherwise fetch the primary source. Recorded
      plainly as an incomplete audit rather than a completed one; the
      proof_search_map's baseline_embedding is explicitly marked as an OPEN
      step, not satisfied.
    - >-
      Even a full positive finding here changes only WHICH published
      algorithm is cited as HQC's best-known quantum attack, not the
      numeric value of either algorithm's own already-published exponent.
    - >-
      Does not adjudicate HQC's DFR model, IND-CCA2 security, or
      GOAL-HQC-001's classical ISD baseline (which uses a DIFFERENT,
      memory-charged classical cost model per the RQ's own non_duplication
      note) -- this proposal only concerns the QUANTUM baseline comparison.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The relative advantage of representation-technique ISD (classical
        or quantum-walk-accelerated) over plain Prange shrinks monotonically
        as relative weight tau = w/n -> 0, vanishing in the leading
        exponential term in the tau->0 limit.
      rigorous_support: >-
        This is the generic, well-known qualitative behavior of the
        classical ISD asymptotic-optimization literature (representation-
        technique gains being tau-dependent and largest near the Gilbert-
        Varshamov weight), cited here GENERICALLY as background domain
        knowledge, NOT as an independently verified or newly-derived
        rigorous bound. Flagged honestly as an assumption imitating
        well-known classical-ISD-literature behavior rather than a
        classical distribution theorem in the Wesolowski-exemplar sense:
        there is no direct analogue here; this heuristic is closer to a
        known asymptotic-optimization fact than a probabilistic
        smoothness-type claim, and that difference from the canonical
        exemplar pattern is stated rather than papered over.
      validation_plan: >-
        Direct symbolic evaluation of Kachigar-Tillich's own published
        formula (once obtained) at tau->0, compared against the
        independently-derivable Prange exponent in the same limit -- a
        purely symbolic/algebraic validation requiring no sampling, once
        the primary source is actually read. No larger-scale sampling
        correspondence is needed or applicable for this specific heuristic,
        since it is a limit-taking exercise on a closed-form expression,
        not a distributional claim about random objects.
  target_complexity:
    time_exponent: >-
      TO BE DETERMINED -- this proposal's entire point is that the correct
      comparison baseline at HQC's actual parameters is currently
      unresolved by this task; no new exponent is claimed, only a possible
      RELABELING of which published exponent is the tighter one.
    memory_exponent: not_applicable
    best_known: >-
      Ambiguous pending this proposal's own baseline-reproduction step:
      EITHER Grover-accelerated Prange OR Kachigar-Tillich's quantum-walk
      BJMM/MMT (2017, KN-LIT-80202e), whichever is smaller at HQC's actual
      sparse-regime parameters -- this ambiguity is itself the proposal's
      finding-in-progress.
    hidden_overhead: not_applicable
    tradeoff_note: not_applicable
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

object_first_screen:
  established_families_forbidden_as_primary_lens:
    - >-
      Grover-only exhaustive search over information sets (Bernstein 2010,
      KN-LIT-4144) -- treated as one of the two candidate baselines being
      compared, not forbidden as an object of study, only forbidden as an
      unexamined assumption.
    - >-
      Quantum-walk-accelerated MMT/BJMM representation-technique ISD
      (Kachigar-Tillich 2017, KN-LIT-80202e) -- likewise treated as a
      candidate baseline under scrutiny, not an unexamined assumption.
    - >-
      Circuit/qubit/memory-resource-axis refinements of the above (see
      IDEA-20260813-a46301's list) -- not used as either lens or baseline
      here.
  tracked_object: >-
    The asymptotic RATIO of two already-published cost-exponent formulas
    (quantum-walk BJMM/MMT vs Grover-Prange) evaluated at HQC's actual
    sparse-weight parameter regime, in place of either formula alone.
  novelty_axis: >-
    Not a new attack mechanism at all -- explicitly a control/measurement
    proposal whose "object" is a COMPARISON, not a new tracked computational
    object in the KN-TECH-056 sense. Flagged honestly as sitting slightly
    outside the object-first framing's core use case (which is for NEW
    attack families), included here because CLAUDE.md and the RQ explicitly
    value baseline correctness as much as new mechanisms, and because
    getting the comparison target right is a prerequisite for evaluating
    IDEA-20260813-a46301/5a2aaa/c34e09/319645 against the TRUE best-known
    baseline rather than an assumed one.
  testability_axis: >-
    Directly testable once the primary source is obtained -- purely
    symbolic, zero compute, per minimal_test.
  survival_axis: >-
    Cannot be evaluated to completion in this session (infrastructure
    block); this is recorded as an open, live proposal rather than forced
    to a premature closure -- per docs/inventor-protocol.md, an
    infrastructure failure to complete an audit is not itself a negative
    finding and does not license declaring the question closed.
  lossy_projection_test: >-
    not_applicable in the strict object-first sense (see novelty_axis
    above); no lossy projection is being proposed, only a re-evaluation of
    two existing formulas at different parameters.

dominated_by: >-
  n/a in the sense of "no attack claimed"; but as a methodological/
  measurement proposal it is itself potentially DOMINATED by simply reading
  Kachigar-Tillich's published paper directly (which this task could not do
  because WebSearch/WebFetch access failed for the primary source). The
  honest disclosure is that this proposal's own value is capped by an
  infrastructure limitation in THIS session, not by a mathematical finding,
  and per AGENTS.md rule 3/5 that infrastructure failure is recorded as such
  and is not itself evidence about HQC's baseline in either direction.
sota_delta: >-
  No attack; a baseline-clarification/measurement contribution only, per
  docs/inventor-protocol.md section 5's explicit allowance. Its value, if
  pursued, is in correctly stating what the RQ's own comparison target
  should be, not in beating it.

