    memory_exponent: >-
      unchanged at p^{1/3+o(1)} for that algorithm. The toy census
      stores one integer per supersingular j, about p/12 integers.
    best_known: >-
      Archived Theorem 1.1, inputs/P13-WESOLOWSKI-2026/paper_fulltext.md,
      lines 19 and 177-218 as read. Generic rho on a prime-order
