      verified_by: ledger/proposals/IDEA-20260805-b4bc59.yaml
  assumptions:
    - >-
      Supersingularity is decided by the trace of Frobenius being
      divisible by p, and j^p is the j-invariant of the conjugate
      curve.
    - >-
      The least separable degree and the least Nrd/p are the two
      sides of the isometry quoted from the archived Section 4.
    - >-
      p remains below 6750, so X stays 14. If the smallest prime
      at least 5500 were at least 6750, the instance would be
      redefined and this claim would not be scored.
  predictions:
    - metric: size of the symmetric difference of the two d_min multisets
      direction: lower
      minimum_effect: the symmetric difference is empty
    - metric: absolute gap between the curve-side 5-smooth fraction and 10/14
      direction: higher
      minimum_effect: strictly greater than 0.15
  minimal_test:
    design: >-
      Enumerate every supersingular j in F_{p^2} for this single p.
      For each j, compute d(j) by roots of the modular polynomials
      Phi_ell for ell at most 14, keeping a cyclic kernel, and stop
      at the least degree that reaches j^p. Independently, for one
      maximal order per j, compute the least Nrd/p on the two-sided
      ideal of reduced norm p. Compare the multisets after both
      sides use one representative per j in F_{p^2}, duplicating a
      Gal(F_{p^2}/F_p) pair when a quaternion sampler emits only one
      order for the pair. Compare the 5-smooth fraction to 10/14.
    controls:
      - >-
        Every supersingular j already in F_p has d(j) = 1. A larger
        value invalidates both fractions.
      - >-
        The same degree search on y^2 = x^3 + x + a over F_p, for
        the smallest a in 1..5 that gives an ordinary nonsingular
        curve, returns no isogeny of degree at most 14 from the
        curve to its conjugate. A hit invalidates the search.
      - >-
        The integer count of 5-smooth members of {1,...,14} is
        recomputed by trial division and must equal 10 before the
        gap is scored.
    required_metrics:
      - the two multisets of d_min
      - the size of their symmetric difference
      - the curve-side 5-smooth fraction
      - the absolute gap from 10/14
      - the subfield count of j with d(j) different from 1
  falsification_conditions:
    - >-
      The two multisets differ by at least one integer. That is the
      negative observation for the isometry check.
    - >-
      The curve-side 5-smooth fraction lies at most 0.15 away from
      10/14. That is the negative observation for the uniform-model
      miss.
    - A supersingular j in F_p has d(j) greater than 1.
    - The ordinary control curve has a conjugate isogeny of degree at most 14.
  confounders:
    - >-
      Counting a non-cyclic kernel, or an inseparable factor of p,
      on one side only, moves the multiset without touching the
      separable cyclic degree.
    - >-
      Emitting one quaternion order per Gal orbit and forgetting to
      duplicate it makes the multisets look different at the same
      degrees.
    - >-
      Subfield curves contribute d = 1 and raise the smooth
      fraction. They are part of S and must be counted, not dropped,
      before the gap is scored.
  interpretation_limits:
    - >-
      A gap above 0.15 at X = 14 does not falsify Heuristic 1 inside
      the paper's stated window on u. It only says the uniform model
      is a poor fit at this X.
    - >-
      Equal multisets at this p do not certify the isometry at
      SQIsign-sized p.
    - >-
      No exponent moves. A smooth fraction is not a runtime.
  heuristic_assumptions:
    - id: H1
      statement: >-
        If d_min were a uniform random integer in {1,...,14}, its
        probability of being 5-smooth would be 10/14. Heuristic 1 of
        the archived paper asks for the Dickman tail u^{-u(1+o(1))}
        only as X goes to infinity inside a window on u that X = 14
        does not meet. The toy comparison uses the exact finite
        ratio, not that tail.
      rigorous_support: >-
        Theorem 1.4 of the archived paper is the Canfield–Erdős–Pomerance
        / Dickman count Ψ(X, B) = X u^{-u(1+o(1))} in the stated
        window. Theorem 1.5 supplies the degree ceiling. Neither
        theorem asserts the finite ratio 10/14.
      validation_plan: >-
        The quantity sampled is d_min for every supersingular j at
        this one p (a complete census, not a draw). The comparison
        is the 5-smooth fraction against 10/14, and the multiset
        against the quaternion norms. The tail check is the count of
        prime values in the multiset against the four non-5-smooth
        integers 7, 11, 13, and 14. The parameter is this p with
        X = 14 and B = 5. Transfer assumption: none. The fraction is
        not carried to a cryptographic prime.
  target_complexity:
    time_exponent: >-
      unchanged at p^{1/3+o(1)} under Heuristic 1, from the archived
