      different problem.
    hidden_overhead: >-
      The paper's u^{-u(1+o(1))} hides an o(1) in the exponent of
      the success probability. A gap at X = 14 does not estimate
      that o(1).
    tradeoff_note: >-
      No time-memory tradeoff is proposed. The archived interpolation
      sqrt(N^3/w) with N = p^{1/3} is untouched.
