idea:
  id: IDEA-20261006-b6ce60
  question_id: RQ-SSIQ-9702af
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Curve-side and quaternion-side minimal degrees to the Frobenius
    conjugate agree at the first prime past 5500, and the 5-smooth
    fraction misses 10/14
  class: measurement
  claim: >-
    Let p be the smallest prime at least 5500. Then
    X = floor((p/2)^{1/3}) equals 14, because 14^3 = 2744 and
    15^3 = 3375, so every prime from 5500 through 6749 has this same
    X. Let S be the set of supersingular j-invariants in F_{p^2}.
    For each j let d(j) be the least degree of a separable isogeny
    from a curve of that j to a curve of j-invariant j^p. Let Q be
    the same multiset of integers read from maximal orders in the
    quaternion algebra ramified at p and infinity, one order per j,
    taking the least value of Nrd(alpha)/p on the unique two-sided
    ideal of reduced norm p, as in the archived paper's Section 4
    isometry. The claim is the equality of those two multisets.
    Separately, the fraction of values in the multiset that are
    5-smooth differs from 10/14 by more than 0.15. The ten 5-smooth
    integers in {1,...,14} are 1, 2, 3, 4, 5, 6, 8, 9, 10, and 12.
    This is not an isogeny-path algorithm. The time exponent stays
    the archived p^{1/3+o(1)} under Heuristic 1, and this record
    does not move it.
  mechanism: >-
    The tracked object is the integer d_min(E -> E^{(p)}). The
    representation is that integer, read either as an isogeny degree
    or as a reduced norm. The operation set Sigma is
    {replace E by an F_{p^2}-isomorphic model, replace a maximal
    order by a conjugate order}. Sigma is not translation on a
    prime-order elliptic subgroup. Class: coordinate-dependent,
    because d_min depends on the pair of curves (or the order) and
    not on a secret scalar. Lossy-projection test against Sigma: the
    projection discards the kernel and the ideal generator and keeps
    one integer at most 14. Many kernels share a degree, so the
    projection is lossy, and Sigma does not change the integer.
    Listing isogenies through modular polynomials is only the
    instrument that reads the integer. Family F3 (isogeny path) is
    a component of that instrument, not the lens: there is no walk
    from a public curve to a secret curve, and nothing is priced as
    a path algorithm against p^{1/3+o(1)}. Two outcomes are separated
    before any run. Equal multisets with a gap above 0.15 means the
    Deuring reading matches the curve reading at this p, while the
    uniform-integer model that Heuristic 1 imitates does not yet
    fit at X = 14, which sits outside the paper's asymptotic window
    on u. Unequal multisets means the two readings are not computing
    the same integer, so a later large-p Deuring sample cannot be
    treated as a curve-side census on the strength of this prime.
  novelty_status: unverified
  citations:
    - ref: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
      provenance: retrieved
      claim: >-
        Heuristic 1 (lines 69-70) asks that the least degree
        E -> E^{(p)} be B-smooth with probability at least
        u^{-u(1+o(1))}. Theorem 1.5 (line 81) bounds that degree by
        (p/2)^{1/3}. Section 4 (lines 244-248) checks the heuristic
        through the Deuring isometry Nrd/p at SQIsign-sized p, and
        says a direct curve-side computation is generally extremely
        costly. This record uses the bound, the isometry, and the
        gap the section leaves at small X.
      verified_by: inputs/P13-WESOLOWSKI-2026/paper_fulltext.md
    - ref: KR-RHO-755e35
