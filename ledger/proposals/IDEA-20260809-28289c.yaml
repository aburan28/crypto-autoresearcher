idea:
  id: IDEA-20260809-28289c
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Two nulls, both mandatory: a matched random lattice and a lattice with a
    dense sublattice planted at a controlled dimension
  class: control
  claim: >-
    Every measurement in this goal is a claim that a specific structural event
    causes an observed behaviour. That claim is untestable without a NEGATIVE
    control with no dense sublattice and a POSITIVE control with one planted at a
    known dimension. The claim here is that both are constructible at matched
    volume and that the detector's response to the planted control gives a direct
    calibration of detection power as a function of sublattice dimension —
    converting "we did not detect it" from an absence into a bounded statement.
  mechanism: >-
    The negative control is a random lattice with the same dimension and
    determinant. The positive control is built by generating a lattice containing
    a known dense sublattice of chosen dimension and density, so the detector's
    sensitivity curve can be measured directly rather than assumed.
  why_not_a_renamed_known_approach: >-
    Random-lattice comparisons are standard. The planted positive control with a
    swept sublattice dimension is the addition, and it is what makes
    non-detection interpretable: without it, a null result is silence.
  predictions:
  - observable: detector response versus planted sublattice dimension and density
    metric: detection rate surface
    predicted: Monotone in density; the dimension at which detection rate crosses one half is the detector's resolution and is the number this control exists to produce.
  - observable: detector response on the negative control
    metric: false-positive rate
    predicted: At most the nominal level set by the statistic's threshold; a higher rate invalidates every positive finding in the goal.
  minimal_test: >-
    Sweep planted dimension and density at one lattice dimension, twenty instances
    per cell, measuring detection rate; separately measure the false-positive rate
    on the negative control over at least two hundred instances.
  controls:
  - 'CONSTRUCTION VALIDATION: the planted sublattice must be verifiably present -- checked by exhibiting its basis -- before any detection rate is recorded.'
  - 'VOLUME MATCHING: negative controls must match determinant as well as dimension, since profile shape depends on both.'
  falsification_conditions:
  - False-positive rate exceeds the nominal level, invalidating the detector.
  - Detection rate is not monotone in planted density, indicating the statistic responds to something other than the planted structure.
  interpretation_limits: >-
    A calibrated detector at toy dimension bounds what this program can see at
    toy dimension. It says nothing about what a better-resourced adversary sees.
  sota_delta: 'No attack. Delta: non-detection becomes a bounded statement instead of an absence, which is a precondition for every negative result this goal might report.'
  dominated_by: Not dominated by any corpus record; a precondition for IDEA-20260809-24eec3, 263751 and 26de01.
  estimated_cost: Implementation small; compute moderate.
  recommended_priority: high
  novelty_status: unverified
