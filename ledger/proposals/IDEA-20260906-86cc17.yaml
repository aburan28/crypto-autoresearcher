  assumptions:
    - >-
      Prime-order ordinary short-Weierstrass curves over F_p, p > 3, with
      gcd(N, p - 1) = 1; the N | p - 1 case is the nearby object, not the target.
    - >-
      The Weierstrass cubical normalisation [m]~(x : 1) = (phi_m(x) : psi_m(x)^2)
      with the standard division polynomials; any other normalisation multiplies
      d by a computable factor, which Stage 0 must state.
    - >-
      Off-limits component used and named: the Kummer line (x-only arithmetic) is
      the base of the lift; what is added is the un-quotiented scaling and its
      canonical section. No degree-2 coordinate claim is made.
    - >-
      Toy scale only, p up to about 24 bits; the DL-spectrum census is the
      existing EXP-ECDLP-184fc4 instrument and is not re-implemented here.
    - >-
      No literature was opened this session; the recalled cubical-arithmetic
      reference is a pointer for a reviewer, not support.
  proof_search_map:
    bottleneck: >-
      The uniqueness of the N^2-th root in F_p^* when gcd(N, p - 1) = 1. Remove it
      (N | p - 1) and the canonical section ceases to exist, d becomes a class in
      F_p^* modulo N-th powers, and the object turns into the Tate self-pairing
      of F4. Every statement in (B)-(C) passes through that one fact.
    baseline_embedding:
      parameter_slice: >-
        N | p - 1 (embedding degree 1). There c_N(P) modulo N-th powers is the
        reduced Tate self-pairing t_N(P, P), and for P = [k]P_0 the class of
        c_N(P) is t_N(P_0, P_0)^(k^2) times an N-th power -- the Frey-Ruck object.
      reproduction_check: >-
        On a toy curve with N | p - 1, compute c_N([k]P_0) modulo N-th powers for
        all k and check it equals t_N(P_0, P_0)^(k^2) against an independent Tate
        pairing implementation (as EV-NET-001 did with Sage's tate_pairing). Exact
        match for every k, or the cubical normalisation is wrong and nothing is
        reported.
    observation_collision:
      observable: >-
        The defect d(P) in F_p^*, and the pair (d(P), psi_m(x(P))) under [m]. What
        the projection discards is stated in mechanism; the discard is compatible
        with Sigma only with the auxiliary carried, so the observable alone
        collides across the whole fibre of d.
      distinct_preimage_search: >-
        Required and expected to succeed. The fibre of a generic value of d has
        size about N/(p - 1) times the number of roots of phi_N - c in F_p, so
        distinct points P, P' with d(P) = d(P') and unrelated discrete logarithms
        are forced to exist at any size, and the observable can never identify a
        point. The only claim it could carry is a statistical one about the whole
        map, which is why M1-M2 are distributional and why a single collision is
        never reported as a finding.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace 'the cubical lift of G' by 'the canonical section s plus the
          defect d'. Encoding exact (s is unique), completeness exact, soundness
          spent entirely on d, cost loss one ladder per evaluation.
        predicted_gain: >-
          Zero bits from s, derived; one measurable statistic d with a pre-registered
          null. Converts an unexamined R3 class into a closure or a lead in one run.
      - transform: observable_fiber
        proposed_object: >-
          Hold d(P) fixed, vary the cubical normalisation (Weierstrass scaling u,
          random Moebius change of the Kummer basis) and ask which invariant of P
          survives: predicted none, because d transforms by an explicit factor and
          the fibre is unchanged as a set.
        predicted_gain: >-
          Records that d is basis-covariant and that any measured bias must be
          basis-invariant to count, which is what the PGL_2 battery tests.
    quantifier_order: >-
      (B): FOR ALL p > 3, FOR ALL prime-order E/F_p with gcd(N, p - 1) = 1, FOR ALL
      P in G, THERE EXISTS a unique d(P) in F_p^* with [N]~(d(P)^(-1)(x(P):1)) =
      (1:0), and FOR ALL m, [m]~ s(P) = s([m]P). (C): FOR ALL P in G and FOR ALL
      m not 0 mod N, d([m]P) psi_m(x(P))^2 = d(P)^(m^2). The closure prediction is
      the weaker statistical statement: FOR the tested curves and sizes, the
      distribution of d and the residual spectrum of log d are at the null. The
      lead branch would be an EXISTS over curves and sizes and is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        'The cubical lift over a prime-order subgroup with gcd(N, p - 1) = 1 splits
        canonically and carries zero information; its residual defect d obeys the
        exact law (C); on the tested toy curves d is [uniform / non-uniform] and
        its residual DL-spectrum is [white / not white].' It can never certify an
        attack, an exponent, or a statement at cryptographic scale.
      nearby_object_control: >-
        The N | p - 1 curve, where the canonical section does NOT exist and the
        object is the Tate self-pairing, whose class is an explicit quadratic
        character of k: the instrument must read a quadratic ramp there (energy on
        the k^2 phase) and white on the generic side. An instrument that reads
        both the same has not identified the load-bearing structure, which is the
        N^2-th-root uniqueness.
    proof_obligations:
      - claim: '[m]~(x : 1) = (phi_m(x) : psi_m(x)^2) with scaling degree m^2 in the Weierstrass cubical normalisation.'
        responsibility: baseline
      - claim: The N^2-th root section s exists, is unique, and satisfies [m]~ s(P) = s([m]P).
        responsibility: correctness
      - claim: 'd([m]P) psi_m(x(P))^2 = d(P)^(m^2) and the three-term identity of (C).'
        responsibility: correctness
      - claim: One ladder evaluates d in O(log N) field operations; the census costs O(N) evaluations at toy scale.
        responsibility: runtime
      - claim: The N | p - 1 slice reproduces the Tate self-pairing class t_N(P_0,P_0)^(k^2).
        responsibility: baseline
      - claim: Conclusions are scoped to the tested curves, sizes, normalisation and instrument.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: pass count of gates G1-G4 (exact identities) over 200 random draws each at three field sizes
      direction: different
      minimum_effect: 'Predicted 200 of 200 for every gate; a single failure halts the record as a derivation or normalisation error.'
    - metric: chi-square statistic of d(P) over all P in G against uniform on F_p^*, curve minus matched random curve
      direction: different
      minimum_effect: >-
        Predicted within the sampling band (no deviation beyond 3 sigma on any of
        the three sizes). A deviation that persists on all three sizes, grows with
        N, and is absent from the matched random curve is the lead branch.
    - metric: DL-spectrum statistics (beta, Z, half-energy fraction as in EXP-ECDLP-184fc4) of log_g d([k]P) after subtracting the chirp k^2 log_g d(P)
      direction: different
      minimum_effect: >-
        Predicted white (beta in [0.45, 0.60], half-energy 0.5 +- 0.05) on
        generic-N curves, and a quadratic-phase concentration on the N | p - 1
        control. Both halves are required; white everywhere means the instrument
        is blind to the chirp and no negative may be read.
    - metric: loss L and branching b of IDEA-20260802-002 for pi_j = top j bits of d, under translation and under [m]
      direction: different
      minimum_effect: >-
        Under translation, b within 5 percent of the random-label null at each j;
        under [m] with the auxiliary carried, b = 1 exactly (a forced value from
        (C)); under [m] without the auxiliary, b at the random-label null. The
        forced b = 1 cell is the instrument calibration.
    - metric: ratio d^(u)(P) / d(P) under admissible scaling u
      direction: different
      minimum_effect: Exactly u^2 for every P and both frozen scalings; zero tolerance.
  minimal_test:
    design: >-
      Stage 0 on paper, then Stages 1-3 of the mechanism in pure Python plus the
      existing EXP-ECDLP-184fc4 census script, on three prime-order toy curves at
      16, 20 and 24 field bits with gcd(N, p - 1) = 1, one toy curve with
      N | p - 1 as the nearby object, one matched random prime-order curve per
      size, and every gate run before any measurement is read. No scalar is
      recovered; no attack is run; claim_tier toy.
    controls:
      - >-
        PGL_2(F_p) random-reparametrisation battery of IDEA-20260807-4fc635
        applied to the Kummer basis before building the cubical normalisation;
        any M1 or M2 signal must be invariant across 30 draws.
      - >-
        Translation-conjugate null of IDEA-20260807-4fc635, d_R(P) defined as
        d(P - R) for random R; every metric must reproduce exactly after
        retargeting.
      - Matched random prime-order curve at the same p for M1-M3.
      - >-
        Pollard rho with distinguished points and BSGS on the same curves as
        matched cost controls (automorphism-discounted rho if a CM curve is ever
        included, KN-TECH-018); any recovery claim, none is made here, must beat
        them.
      - >-
        Nearby object with N | p - 1 where the section does not exist and the
        Tate self-pairing must be reproduced (positive control for the instrument).
      - Anomalous-curve linear-ramp calibration of the census instrument, inherited from IDEA-20260905-3a30d5.
      - Random-label null of IDEA-20260802-002 for the (L, b) meter.
    required_metrics:
      - pass or fail of G1-G4 with draw counts, per size
      - chi-square of d over G and over the matched random curve, per size, with the PGL_2 draw distribution
      - census statistics of the chirp-subtracted log d spectrum, generic and N | p - 1, per size
      - (L, b) per projection pi_j under translation and under [m] with and without auxiliary
      - the u^2 scaling ratio, exact
      - ladder cost per evaluation in field operations; wall clock and peak memory per stage
  falsification_conditions:
    - Any of G1-G4 fails on any draw. The derivation in (B)-(C) or the cubical normalisation is wrong; the record is superseded, not amended.
    - The N | p - 1 control does not reproduce the Tate self-pairing class. Instrument or normalisation fault; nothing is reported.
    - The census reads white on the N | p - 1 control. The instrument cannot see a quadratic phase and no white reading on the generic side may be interpreted.
    - >-
      M1 or M2 deviates beyond the band on all three sizes, growing with N,
      absent from the matched random curve and invariant under the PGL_2 battery.
      LEAD branch; route to independent review before any cost model.
    - >-
      M1 and M2 at the null on every size. CLOSURE branch, with mechanism (B) and
      law (C); the cubical R3 class is closed for this normalisation family at
      toy scale.
    - Budget exhaustion before Stage 2 completes. Infrastructure outcome under AGENTS.md rule 3, never evidence about d.
  confounders:
    - >-
      The N-th and N^2-th power maps are bijections only when gcd(N, p - 1) = 1;
      a toy curve violating this silently changes the object and must be
      excluded by an explicit gcd check per curve.
    - >-
      At toy p the ratio N/(p - 1) is about 1, so the fibre of d has size about 1
      and d can look injective by accident; the fibre-size histogram must be
      reported alongside M1.
    - Small-prime coincidences in phi_N mod p; repeat over three sizes and report distributions, never one number.
    - >-
      The chirp subtraction in M2 uses log_g d(P) computed by a toy F_p^*
      discrete logarithm; that is measurement cost at toy scale and not part of
      any attack cost, and must be labelled so.
    - >-
      Conflating d with the elliptic-net values of EV-NET-001. c_N(P) is an EDS
      product, but d is its N^2-th root normalised by the canonical section, and
      the measured quantity here is a DL-spectrum, not a collision count.
  interpretation_limits:
    - >-
      No attack, no exponent, no scalar recovery. The predicted outcome is a
      closure of the cubical-lift R3 class with a mechanism (multiplicative
      Schur-Zassenhaus plus the exact law (C)).
    - >-
      Scoped to the Weierstrass cubical normalisation and to gcd(N, p - 1) = 1;
      other normalisations differ by a computable factor and other embedding
      degrees are F4 territory.
    - >-
      A white spectrum closes only the tested statistic family on the tested
      curves and sizes; it says nothing about other coordinate-dependent objects
      of high degree, which remain the open cell of IDEA-20260806-c5d183 Class III.
    - Toy tier throughout (claim_tier toy); no transfer to cryptographic p is licensed.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a generic prime-order curve with gcd(N, p - 1) = 1, the values d(P)
        over P in G behave, with respect to uniformity on F_p^* and with respect to
        correlation of log_g d([k]P) with every additive character of k after chirp
        removal, like a uniformly random function G -> F_p^* -- i.e. chi-square at
        its expectation and spectral statistics at the random-function null.
      rigorous_support: >-
        The exact ingredient is law (C): d([k]P) is determined by d(P) and the
        EDS term psi_k(x(P)), so the question reduces to the statistics of
        division-polynomial values along a multiple sequence, for which
        EV-NET-001 measured random-oracle-equivalent collision statistics at toy
        p (strength preliminary). No Weil-type bound applies at degree N^2; the
        classical distribution this imitates is the random-function model of a
