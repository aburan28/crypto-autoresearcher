idea:
  id: IDEA-20260906-86cc17
  title: >-
    Cubical lift over the prime-order subgroup: the N^2-th-root canonical section
    splits the lift with zero information (multiplicative Schur-Zassenhaus), and
    the residual coordinate-dependent defect d(P) = phi_N(x(P))^(1/N^2) obeys the
    exact quadratic covariance d([m]P) * psi_m(x(P))^2 = d(P)^(m^2) -- a Class III
    object of degree N^2 outside the Weil-pinned class, priced by one identity gate
    and one DL-spectrum census
  class: representation
  status: proposed
  approved_by: null
  question_id: RQ-ECDLP-623a32
  goal_id: GOAL-ECDLP-001
  added: '2026-09-06'
  proposed_at: '2026-09-06'
  proposed_by: idea-generator
  claim: >-
    REPRESENTATION CLASS R3 (cubical and biextension lifts). ATTACK STAGE whose
    charged cost is claimed to change: collision structure -- the representation
    attaches to every point a coordinate-dependent scalar in F_p^* with an exact,
    non-linear transformation law under scalar multiplication, which is a
    covariance no F1-F7 object carries. NON-GENERIC OPERATION made cheap: the
    evaluation of the canonical cubical section over G, i.e. the N^2-th root
    normalisation of the cubical N-multiple, in O(log N) field operations via the
    division-polynomial ladder; a black-box group encoding cannot produce it.
    (A) THE LIFT. Let E: y^2 = x^3 + a x + b over F_p, P of prime order N with
    gcd(N, p - 1) = 1 (generic prime-order curves; N does not divide p - 1 by
    KN-TECH-032's genericity), G = <P>. A cubical point over the Kummer line is a
    pair (X~ : Z~) in F_p^2 minus 0 with x = X~/Z~ and the scaling NOT quotiented.
    Cubical scalar multiplication is [m]~(x : 1) = (phi_m(x) : psi_m(x)^2) with
    phi_m, psi_m the division polynomials, extended by the degree-m^2
    homogeneity [m]~(lambda X~ : lambda Z~) = lambda^(m^2) [m]~(X~ : Z~). The
    cubical points over a fixed point form an F_p^*-torsor. For P in G,
    psi_N(x(P)) = 0 and c_N(P) := phi_N(x(P)) is nonzero, so [N]~(x(P) : 1) =
    c_N(P) * (1 : 0).
    (B) THE CANONICAL SECTION AND ITS ZERO INFORMATION. Because lambda ->
    lambda^(N^2) is a bijection of F_p^* when gcd(N, p - 1) = 1, there is a
    unique scalar d(P) in F_p^* with [N]~( d(P)^(-1) (x(P) : 1) ) = (1 : 0), namely
    d(P) = c_N(P)^(N^(-2) mod (p-1)). Put s(P) := d(P)^(-1) (x(P) : 1). Then
    [m]~ s(P) = s([m]P) for every m (both sides are cubical points over [m]P whose
    N-th cubical multiple is (1 : 0), and that lift is unique). So the cubical lift
    over G splits canonically and carries ZERO bits about anything -- the
    multiplicative, coprime-order form of the Schur-Zassenhaus splitting, the
    exact analogue of KN-TECH-73630e's statement that the prime-to-p torsion lift
    of F5 is an information-free group isomorphism. This is the lossy-projection
    audit's second clause failing exactly and derivably, as in IDEA-20260806-0c9de1.
    (C) THE RESIDUAL OBJECT AND ITS EXACT LAW. What is coordinate-dependent is
    the defect between the naive normalisation Z~ = 1 and the canonical section,
    d: G -> F_p^*. From [m]~(x : 1) = psi_m(x)^2 * (x([m]P) : 1) for m not 0 mod N
    and s([m]P) = [m]~ s(P) one reads off
        d([m]P) * psi_m(x(P))^2 = d(P)^(m^2)        (m not 0 mod N),
    and, for Q = [k]P, d(Q) psi_k(x(P))^2 = d(P)^(k^2). Consecutive multiples give
    the three-term identity d([k+2]P) d([k]P) (x(P) - x([k+1]P))^2 =
    d([k+1]P)^2 d(P)^2, which is the cubical differential addition on the canonical
    section. Under admissible model scaling (x, y) -> (u^2 x, u^3 y), d scales by
    exactly u^2 (weighted homogeneity of phi_N).
    (D) PLACEMENT. Trichotomy class III (coordinate-dependent) of IDEA-20260806-c5d183:
    d is a function of the Weierstrass cubical normalisation, not of the group
    element, and its propagation under the operation set Sigma = {[m] : m in
    (Z/N)^*} is deterministic only with the auxiliary psi_m(x(P)) -- escape E2 of
    IDEA-20260807-df906f, auxiliary-state, priced by H-PROP-c95932. d is a rational
    function of x of degree N^2 evaluated in O(log N), so it sits outside the
    bounded-degree class whose statistics IDEA-20260815-f558e4 (E) pins to the
    1/s baseline at the Weil scale; nothing pins it, which is why it is measured.
    (E) THE TWO OUTCOMES, PRE-REGISTERED. CLOSURE: d(P) over P in G is
    indistinguishable from uniform on F_p^*, the DL-spectrum of log_g d([k]P) is
    the sum of the derivable quadratic chirp k^2 log_g d(P) and a white term, and
    the identity in (C) shows the chirp is exactly cancelled by the division
    polynomial term, so the representation is a lift with zero information plus
    a coordinate statistic with no k-correlation beyond what the x-coordinates of
    the multiples already contain. LEAD: a non-white residual spectrum after
    removing the chirp, or a d-distribution non-uniform beyond the sampling scale
    on three field sizes and absent from the matched random curve. Only the lead
    branch would authorise any cost modelling; none is claimed here.
  mechanism: >-
    THE PAIR. Representation: the cubical point (X~ : Z~) over the Kummer line
    of the short-Weierstrass model, with the canonical section s of (B) and the
    defect d of (C). Operation set Sigma: cubical scalar multiplication
    [m]~ for m in (Z/N)^*, composed with re-normalisation to Z~ = 1; NOT the
    translation action (closed for lossy objects by IDEA-20260806-c5d183 and
    KN-FIND-ffe1df Theorem C). Trichotomy: Class III, coordinate-dependent, because
    d factors through the chosen cubical normalisation of the Kummer coordinate
    and not through the point; one-line reason: a change of Weierstrass scaling
    multiplies d by u^2 while fixing the group element.
    LOSSY-PROJECTION TEST AGAINST SIGMA. What the projection P -> d(P) discards:
    everything about P except one F_p^*-value, so it is lossy in the representation
    used (log_2 N bits in, at most log_2(p - 1) symbols out, with the fibre of a
    generic value of size about N/(p - 1) times the multiplicity of phi_N). Is the
    discard compatible with Sigma? NOT as a block system of <Sigma> on G: the
    propagation d([m]P) = d(P)^(m^2) psi_m(x(P))^(-2) requires the auxiliary
    psi_m(x(P)), which is a function of P and not of d(P), so the fibre partition
    of d is not Gamma-invariant and the object is Class III with auxiliary state,
    not Class I. The pair (P, d(P)) propagates deterministically but is injective,
    hence a change of coordinates -- and that is the Schur-Zassenhaus content of
    (B). The record therefore does NOT claim a lossy propagating object; it
    claims an exact accounting of why the cubical lift yields none and isolates
    the one residual statistic that no recorded gate covers.
    PRICE OF THE OPEN NUMBER. For a Class III object the open number is the
    simulability overhead (IDEA-20260806-c5d183 Class III obligation) and, for a
    statistic, its k-correlation. d is not GGM-simulable (it reads x) and costs
    one ladder, O(log N) field operations; its k-correlation is the DL-spectrum
    measured below with the census instrument of IDEA-20260905-3a30d5 /
    EXP-ECDLP-184fc4, which already carries the anomalous-curve known-true object.
    STAGE 0 (zero compute, hard gate). Derive (B) and (C) on paper, including the
    homogeneity degree m^2 of [m]~ in the Weierstrass cubical normalisation, the
    uniqueness of the N^2-th root, and the model-scaling law d -> u^2 d.
    STAGE 1 (minutes, hard gates). On prime-order toy curves at 16, 20 and 24
    field bits: (G1) [N]~ s(P) = (1 : 0) for 200 random P; (G2) the identity
    d([m]P) psi_m(x(P))^2 = d(P)^(m^2) for 200 random (P, m), exact; (G3) the
    three-term identity of (C) for 200 random k; (G4) d^(u) = u^2 d under two
    frozen admissible scalings, exact. Any failure halts the record.
    STAGE 2 (an hour). (M1) Distribution of d(P) over all P in G (exhaustive at
    N <= 2^20), chi-square against uniform on F_p^*, and the same on the matched
    random curve at the same p. (M2) DL-spectrum census of log_g d([k]P) as a
    function of k, with the quadratic chirp k^2 log_g d(P) subtracted, using the
    EXP-ECDLP-184fc4 instrument and its anomalous-curve linear-ramp calibration;
    predicted white. (M3) The loss-and-branching meter of IDEA-20260802-002 on the
    projections pi_j(P) = top j bits of d(P), j in {1, 2, 4, 8}, under translation
    and under [m] with and without the auxiliary; predicted at the random-label
    null under translation and b = 1 under [m] only when the auxiliary is carried.
    STAGE 3 (minutes). Controls of the minimal test. Decay check: any M1 or M2
    deviation must persist across the three field sizes and grow, not stay flat,
    with N (docs/inventor-protocol.md section 3).
  novelty_status: unverified
  citations:
    - ref: ledger/proposals/IDEA-20260905-3a30d5.yaml
      provenance: internal
      claim: >-
        Nearest neighbour, read to line 110 this session: the canonical
        (Teichmuller) section defect of the p-adic lift, a fast high-degree
        coordinate function measured by a DL-spectrum census with the anomalous
