idea:
  id: IDEA-20261005-447d82
  question_id: RQ-AUXIN-f8d8c0
  title: >-
    Exact r-1 and r+1 Cheon divisor split on y^2=x^3+x+1 over F_10007
  class: measurement
  claim: >-
    Let E be the pinned nonsingular curve y^2=x^3+x+1 over the prime field
    F_10007, let N=#E(F_10007), and let r be the largest prime factor of N.
    Let d_minus be the largest divisor of r-1 lying in [2, floor(sqrt(r))],
    and d_plus the largest divisor of r+1 in that same interval. Using the
    group-operation shapes recorded in KN-LIT-90e34c, with the common log
    factor omitted because it cancels in a ratio, define B_minus=sqrt(r/d_minus)+sqrt(d_minus),
    B_plus=sqrt(r/d_plus)+d_plus, and B_rho=sqrt(r). The claim is that on
    this one curve the two auxiliary-input shapes separate: max(B_minus,B_plus)/min(B_minus,B_plus)
    is at least 2. The control order r_null is the smallest prime greater
    than 2^16 such that (r_null-1)/2 and (r_null+1)/2 are both prime; on
    r_null the same ratio with d=2 on both sides is strictly less than 1.25.
    If the pinned ratio is below 2, this order does not separate the
    branches. If the null ratio is at least 1.25, the factor-2 gap is an
    artifact of the two formulas at small d and the claim fails. No auxiliary
    points are supplied, the algorithm is not run, and ordinary ECDLP is not
    claimed to improve.
  mechanism: >-
    Object frame. Representation (R1): the integer r, the largest prime
    factor of the point count of a short-Weierstrass model, as a coordinate
    of the model. Operation set Sigma is the pair of maps r |-> r-1 and
    r |-> r+1 followed by exact factorization. Sigma is not translation on
    E. Trichotomy of IDEA-20260806-c5d183: coordinate-dependent, because
    every point of E shares the same r, so the factorization does not
    separate group elements; it is a coordinate of the curve model.
    Lossy-projection test against Sigma: the projection discards the
    coefficients, the points, the cofactor N/r, and the secret scalar, and
    retains the prime factors of r-1 and of r+1. The discard is compatible
    with Sigma because those integers depend only on r. It is lossy relative
    to an ECDLP instance: the scalar is gone, and many curves can share an
    order. It is not a change of coordinates of a point. F1 (walk collision)
    appears only inside the closed-form bounds B_minus and B_plus, which
    count hypothetical collision steps; the test does not walk. The r-1
    shape charges sqrt(d) and the r+1 shape charges d, which is the
    distinction drawn in KN-LIT-90e34c. IDEA-20260930-704e43 instead runs
    walks at a planted d=2^16; this record stops at the integers r±1.
  novelty_status: adaptation
  citations:
    - ref: KN-LIT-90e34c
      provenance: internal
      claim: >-
        For prime order p, an auxiliary d-th power with d dividing p-1 costs
        O(log p*(sqrt(p/d)+sqrt(d))) group operations; inputs through exponent
        2d with d dividing p+1 cost O(log p*(sqrt(p/d)+d)). The journal
        version was not retrieved in that note.
      verified_by: knowledge/literature/KN-LIT-90e34c.md
    - ref: KN-TECH-0f24d0
      provenance: internal
      claim: >-
        Row 7 states that Cheon auxiliary-input attacks are not ordinary
        ECDLP from P and [alpha]P, and that suitable r-1 inputs give roughly
        sqrt(r/d)+sqrt(d) work while the r+1 variant has a linear d term.
      verified_by: knowledge/techniques/KN-TECH-0f24d0.md
    - ref: RQ-AUXIN-f8d8c0
      provenance: internal
      claim: >-
        The question's constraint, read in the question file: a divisor of
        the right size is necessary for the attack to bite and is not
        sufficient, and the census is not a vulnerability finding. Auxiliary
        points are an input supplied by a protocol.
      verified_by: ledger/questions/RQ-AUXIN-f8d8c0.yaml
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        On a Koblitz curve over F_{2^m}, walking on classes of the group
        generated by Frobenius and negation reduces parallel rho by sqrt(2m).
        This measurement is not that walk.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: KR-RHO-93979e
      provenance: internal
      claim: >-
        With a random-oracle partition, rho collides in Theta(sqrt(|G|))
        steps, and additive walks collide within a sqrt(log|G|) factor of
        the birthday bound. This measurement does not run a walk.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-93979e.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Walking on {±P} classes gives a sqrt(2) reduction in expected
        iterations and introduces fruitless cycles. This measurement is not
        a negation-map walk.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
  assumptions:
    - >-
      r is the largest prime factor of #E(F_10007), not of a cofactor and
      not N itself unless N is prime. Divisors are of r-1 and r+1.
    - >-
      The omitted O(log r) multiplier from KN-LIT-90e34c is the same on
      B_minus, B_plus, and B_rho, so it does not change the ratios. This is
      an accounting choice, not a claim that the log factor is 1 in an
      implementation.
    - >-
      No protocol is asserted to publish the auxiliary powers for this
      curve. The bounds are necessary-condition arithmetic only.
  proof_search_map:
    not_applicable_reason: >-
      This is an exact integer measurement of two divisors on one toy order,
      not a proof of an algorithm and not a security reduction.
    bottleneck: >-
      The step that can move the ratio is the pair (d_minus, d_plus) inside
      the two closed forms. Replacing either shape by the other, or finding
      no divisor above 2, removes the claimed factor-2 split.
    baseline_embedding:
      parameter_slice: >-
        One curve, p=10007, E: y^2=x^3+x+1. Null: smallest prime r_null>2^16
        with both (r_null-1)/2 and (r_null+1)/2 prime.
      reproduction_check: >-
        Two independent factorizations of r-1 and of r+1 must return the
        same multiset of prime factors, and the product of each multiset
        must equal the integer.
    observation_collision:
      observable: max(B_minus,B_plus)/min(B_minus,B_plus)
      distinct_preimage_search: >-
        Any other curve with the same r yields the same ratio. The null
        order is a second integer with the same formulas and a forced d=2,
        and its ratio must stay below 1.25.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: the factored integers r-1 and r+1 for this E
        predicted_gain: >-
          A certified factor-2 split or a certified failure to split, plus
          a null on which the formulas do not split.
    quantifier_order: >-
      exists one pinned curve (this E) such that the exact maximal
      admissible divisors make the Cheon-shape ratio at least 2, and
      exists one null integer r_null of the stated form such that the same
      shapes at d=2 give a ratio <1.25. Universal quantification over
      standardized curves is not claimed.
    method_ceiling:
      strongest_certifiable_claim: >-
        The exact factorizations of r-1 and r+1 for this order, and whether
        the two closed forms differ by a factor of 2 on those divisors. Not
        a solve, and not a statement about any deployed curve.
      nearby_object_control: >-
        r_null with only the divisor 2 on each side must keep the ratio
        below 1.25. If the formulas already separate by 2 at d=2, they do
        not measure divisor structure.
    proof_obligations:
      - claim: Both factorizations multiply back to r-1 and r+1.
        responsibility: correctness
  predictions:
    - metric: max(B_minus,B_plus)/min(B_minus,B_plus) on the pinned curve
      direction: different
      minimum_effect: factor at least 2
  minimal_test:
    design: >-
      Count #E(F_10007) for y^2=x^3+x+1, factor N, set r to its largest
      prime factor, factor r-1 and r+1 completely by two independent
      implementations, compute d_minus, d_plus, B_minus, B_plus, and the
      ratio. Construct r_null as specified and compute the same ratio at
      d=2. Do not run Cheon's algorithm and do not ingest auxiliary points.
    controls:
      - >-
        Divisor-free null: r_null as defined above, d_minus=d_plus=2. The
        ratio must be <1.25. A null ratio >=1.25 falsifies the claim that
        a factor-2 gap is caused by the pinned order's divisors.
      - >-
        Reconstruction control: each factorization, multiplied back, equals
        the integer that was factored. Disagreement between the two
        implementations falsifies the measurement.
      - >-
        Wrong-integer control: the test also records the largest admissible
        divisors of N-1 and N+1. Those values are not the metric. If the
        reported ratio used N±1 in place of r±1, the run is invalid.
    required_metrics:
      - N, r, and the cofactor N/r
      - complete prime factorizations of r-1 and r+1 from both implementations
      - d_minus, d_plus, B_minus, B_plus, B_rho
      - pinned ratio and null ratio
      - r_null
  falsification_conditions:
    - r<16, so the interval [2, floor(sqrt(r))] is too small for the pin and the claim fails on this curve.
    - The two factorizations of r-1 or of r+1 disagree, or either product fails to reconstruct.
    - The pinned ratio is strictly less than 2.
    - The null ratio is at least 1.25.
    - The reported divisors are of N±1 rather than r±1.
  confounders:
    - >-
      Taking d larger than sqrt(r) makes sqrt(r/d)+sqrt(d) worse, not better.
      The window cap is part of the definition.
    - >-
      The r+1 bound in KN-LIT-90e34c also requires more auxiliary inputs
      (exponents through 2d). This measurement does not check that supply.
    - >-
      A composite N with a small largest prime factor makes r unrepresentative
      of #E. The cofactor is a required metric so that case is visible.
  interpretation_limits:
    - >-
      A factor-2 gap is a necessary-condition calculation. It is not a
      break, not a protocol finding, and not an ordinary-ECDLP improvement.
      KN-TECH-0f24d0 and RQ-AUXIN-f8d8c0 both keep that gate.
    - >-
      Nothing here transfers to NIST P-256, secp256k1, Curve25519, BN254,
      or BLS12-381. Those orders are a different census.
    - >-
      The log-factor omission cancels in the ratio and does not certify an
      implementation's addition count.
  heuristic_assumptions:
    - id: H1
      statement: >-
        No random model is used. r-1 and r+1 are factored exactly; d_minus
        and d_plus are maxima over a finite divisor set, not smoothness
        samples.
      rigorous_support: >-
        For an integer m < 10007+2*sqrt(10007)+1, trial division up to
        sqrt(m) terminates and returns every prime factor. The Cheon shapes
        are the closed forms in KN-LIT-90e34c with the common log factor
        removed from a ratio.
      validation_plan: >-
        Factor r-1 and r+1 by trial division and by a second implementation,
        on this single order (bit length of r is at most the bit length of
        N, which is under 20 bits). Comparison distribution: equality of the
        two factor multisets, not a Dickman law. Tail check: the product of
        each multiset equals the integer exactly, so no cofactor is left in
        a tail.
  target_complexity:
    time_exponent: 1/2
    memory_exponent: 1/2
    best_known: >-
      Pollard rho at Theta(sqrt(r)) group operations in the generic group
      model (KR-RHO-13bf67). Cheon's auxiliary-input bounds are the two
      shapes in KN-LIT-90e34c and apply only when the powers are supplied.
      Koblitz Frobenius classes (KR-RHO-037e22), rigorous rho collision
      bounds (KR-RHO-93979e), and the negation map (KR-RHO-fb88e6) are rho
      mechanisms and are not this divisor ratio.
    hidden_overhead: >-
      The O(log r) group-operation factor in KN-LIT-90e34c is omitted from
      the ratio because it is common to both branches and to rho's
      comparison at the level of this claim. It is not an o(1) saving.
    tradeoff_note: >-
      Cheon's known memory is O(max(sqrt(r/d), sqrt(d))) for the r-1 branch.
      This measurement does not run the search and does not change that
      tradeoff or rho's.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  dominated_by: >-
    KR-RHO-13bf67 dominates any ordinary discrete-log exponent claim; this
    record makes none, and the exponent delta is 0. Opened baselines that
    do not dominate the divisor certificate: KN-LIT-90e34c (the two bounds,
    not evaluated on this curve), KN-TECH-0f24d0 row 7 (taxonomy, no
    factorization), IDEA-20260930-704e43 (walk constants at a planted
    d=2^16, which assumes the divisor instead of certifying r±1),
    KR-RHO-037e22 (sqrt(2m) on Koblitz curves), KR-RHO-93979e (rigorous rho
    collision bounds), and KR-RHO-fb88e6 (negation-map sqrt(2)). None of
    those is an exact factorization of r-1 and r+1 for this order.
  sota_delta: >-
    Ordinary discrete-log time-exponent delta is 0 versus sqrt(r). The
    quantity that is claimed to differ is the ratio of the two Cheon closed
    forms at the exact maximal admissible divisors of r-1 and r+1 for
    y^2=x^3+x+1 over F_10007. That ratio is not a Frobenius-class factor,
    not a rho collision bound, and not a negation-map gain.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-825bca
      - KR-RHO-0528e7
      - KR-RHO-53c89f
      - KR-RHO-037e22
      - KR-RHO-93979e
      - KR-RHO-fb88e6
    nearest:
      - ref: KN-LIT-90e34c
        provenance: internal
        relation: special_case
        delta: >-
          The note states the two auxiliary-input bounds for a general prime
          order. This idea evaluates them at one toy order's exact divisors
          and does not supply auxiliary points. Ordinary discrete-log
          exponent delta is 0.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: orthogonal
        delta: >-
          The generic-group lower bound is Omega(sqrt(r)) group operations
          for algorithms that use only the group law and equality. Ordinary
          discrete-log exponent delta is 0; this measurement is the r±1
          divisor ratio on one toy curve.
      - ref: KR-RHO-037e22
        provenance: internal
        relation: orthogonal
        delta: >-
          The row is the sqrt(2m) reduction from walking on Frobenius classes
          of a Koblitz curve over F_{2^m}. Ordinary discrete-log exponent
          delta is 0; this measurement is the r±1 divisor ratio on one toy
          curve, y^2=x^3+x+1 over F_10007, and it does not walk on Frobenius
          classes.
      - ref: KR-RHO-93979e
        provenance: internal
        relation: orthogonal
        delta: >-
          The row bounds rho-walk collisions by Theta(sqrt(|G|)), up to a
          sqrt(log|G|) factor for additive walks. Ordinary discrete-log
          exponent delta is 0; this measurement is the r±1 divisor ratio on
          one toy curve, and it does not run a rho walk.
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: orthogonal
        delta: >-
          The row is the sqrt(2) iteration reduction from walking on {±P}
          classes, together with fruitless cycles. Ordinary discrete-log
          exponent delta is 0; this measurement is the r±1 divisor ratio on
          one toy curve, and it does not use the negation map.
    searched:
      corpus_grep:
        - ledger/proposals question_id RQ-AUXIN-f8d8c0
        - knowledge KN-LIT-90e34c KN-TECH-0f24d0
        - >-
          knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
          KR-RHO-93979e.yaml KR-RHO-fb88e6.yaml
      web: []
      blocked:
        - The EUROCRYPT 2006 paper was not opened; the knowledge note and the three frontier rows were.
  status: proposed
  added: '2026-10-05'
  approved_by: null
