idea:
  id: IDEA-20260809-63fc4a
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-QRE-6dba8c
  goal_id: GOAL-QRE-001
  title: >-
    The pipeline as an auditable artifact: every constant carries its provenance,
    and the build fails if one does not
  class: tooling
  claim: >-
    The reason resource estimates are hard to compare is that their constants are
    embedded in prose. The claim is that a costing pipeline can be written so that
    every constant is a named object carrying its source — a derivation in the
    record or a citation to filed text — and that a mechanical check can FAIL the
    build when a constant lacks provenance, making an unsourced number impossible
    to ship rather than merely discouraged.
  mechanism: >-
    Constants are declared with a provenance field; the pipeline refuses to
    evaluate if any constant in the active path is unsourced. Provenance is
    checked against the filed knowledge corpus by identifier, so a citation to an
    unfiled source also fails.
  why_not_a_renamed_known_approach: >-
    Reproducible-research tooling exists generally. Enforcing provenance AT
    EVALUATION TIME for a cryptographic cost model, so that the artifact cannot
    produce a number it cannot source, is the specific design and it directly
    implements this program's rule against unsourced figures.
  predictions:
  - observable: number of constants that fail provenance on first run
    metric: count
    predicted: >-
      Nonzero, and this is the point: the first run is expected to reveal
      constants that were going to be used unsourced, which is exactly the class
      of error the check exists to catch.
  - observable: whether the pipeline can be brought to a fully sourced state
    metric: boolean after acquisition
    predicted: Yes for the reproduction path; possibly not for the sensitivity ranges, whose bounds may be conventional -- and a conventional bound is recorded as such rather than cited to nothing.
  minimal_test: >-
    Implement the provenance mechanism, run the reproduction path, list failures,
    resolve them against filed sources, and report the residual list of
    conventional-by-declaration values.
  controls:
  - 'NEGATIVE CONTROL: introducing an unsourced constant must fail the build, verified as a test rather than assumed.'
  - 'CORPUS BINDING: citations resolve against filed knowledge identifiers, so a citation to an unfiled paper fails exactly as an unsourced constant does.'
  falsification_conditions:
  - The mechanism cannot distinguish derived from unsourced constants without manual annotation so heavy it is abandoned in practice.
  - The negative control passes, meaning the check does not check.
  interpretation_limits: >-
    Provenance enforcement makes numbers traceable, not correct. A well-sourced
    constant can still be wrong, and the check makes no claim otherwise.
  sota_delta: 'No feasibility claim. Delta: an artifact whose outputs are auditable by construction, reusable by the other cost-model goals in this program.'
  dominated_by: Not dominated by any corpus record; intended for reuse by GOAL-PAIR-001 and GOAL-CLGRP-001.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for provenance enforcement: harness tooling exists for records, not for cost models. WEB NOT CHECKED.'
  source_refs:
  - AGENTS.md and docs/claims-and-verification.md -- IN CORPUS.
