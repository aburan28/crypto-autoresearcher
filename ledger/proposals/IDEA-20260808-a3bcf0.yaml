idea:
  id: IDEA-20260808-a3bcf0
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  title: At t = 64 to 128 the representation technique has nothing to represent - an exhaustive,
    exact-arithmetic, memory-charged ISD optimum at the standardized sets, and the structural
    claim that the advanced lineage is vacuous at Classic McEliece BEFORE memory is charged
  class: algorithm
  claim: 'GOAL-MCE-001 completion criterion 2 asks for a memory-charged concrete ISD cost
    at Classic McEliece''s parameter sets. TWO CLAIMS. (A, STRUCTURAL) The gain of the representation
    technique (MMT, BJMM) over Dumer/Stern scales with the number of representations of the
    target sub-error, which is at most C(p, p/2) times a factor from the redundancy positions,
    where p is the weight carried in the enumerated window. At Classic McEliece t is 64 to
    128, and the optimal p at such small t is a single-digit integer, so C(p, p/2) is a small
    CONSTANT (at p = 4 it is 6, at p = 8 it is 70) rather than an exponential quantity. The
    representation technique is therefore worth at most a few bits at these parameters even
    in the RAM model with free memory - which, if true, means the interesting question is
    not how much memory charging costs BJMM but whether BJMM was ever in the running. (B,
    COMPUTATIONAL) Because p and the window length l range over a small discrete set at these
    parameters, the optimum can be found by EXHAUSTIVE ENUMERATION of the whole parameter
    space in exact rational arithmetic rather than by numerical optimisation - so the reported
    optimum is certified, not fitted, and carries no local-optimum risk. The deliverable is
    a table: for each ISO-scoped set, the exact charged optimum, the argmin variant and its
    parameters, the free-memory optimum, and the gap in bits.'
  mechanism: Representation-based ISD wins asymptotically because a target of linear weight
    splits in exponentially many ways, so the algorithm can afford to look for only a 1/R
    fraction of the search space and still expect a hit. Both halves of that sentence need
    weight to be large. At Classic McEliece the total error weight is t = 64 to 128 out of
    n = 4608 to 8192, and the enumerated portion p is a small fraction of t; the number of
    ways to write a weight-p vector as a sum of two weight-p/2 vectors is C(p, p/2), which
    for single-digit p is a constant of order 10. The algorithm still pays the full list-construction
    cost and the full memory. Hence the asymptotic mechanism has no room to operate, and this
    is a statement about combinatorics at small t rather than about memory accounting - which
    is why it is logically prior to the memory question and why it can be checked exactly.
  why_not_a_renamed_known_approach: 'H-MCE-efa9b2''s H1-B pre-registers that the ranking permutation
    across five accounting bases is not constant, with the specific instance (Prange, BJMM)
    - that is a claim about what memory charging does to a ranking of PUBLISHED (tau, mu)
    pairs. This claim is logically upstream and partly in tension with it: it says BJMM''s
    configuration at Classic McEliece''s t never reaches the regime where its published tau
    applies, so the ranking may already be settled at basis B1 and the permutation H1-B expects
    may not appear for the reason H1-B expects. Running this alongside H-MCE-efa9b2 is therefore
    a genuine test of that hypothesis''s premise, not a duplicate of it. It is also not IDEA-20260805-43d6df
    (the re-optimisation error, stated for SDitH''s regime and as a bit-count correction),
    not IDEA-20260805-554b9d (the asymptotic tau + mu comparator), and not C1-05 in C1b.yaml
    (the asymptotic constrained frontier at fixed rate and relative weight). All three are
    asymptotic or elsewhere; this is exhaustive and concrete at five named integer parameter
    triples.'
  predictions:
  - observable: The argmin variant and parameters of the exact charged optimum at each ISO-scoped
      set.
    metric: Variant identity, (p, l, depth), and log2 of the charged cost.
    predicted: Dumer/Stern with p in {2, 4} and depth 1 at every set, with no representation-based
      variant appearing in the argmin under any accounting basis. A representation-based argmin
      at any set falsifies claim (A) and is the more interesting outcome.
  - observable: The bits by which the best representation-based configuration trails the argmin,
      in the FREE-MEMORY model.
    metric: log2 ratio, per set.
    predicted: Positive (i.e. it trails) already at basis B1, which is the sharp form of claim
      (A). If it is negative at B1 and only becomes positive at B5, then H-MCE-efa9b2's H1-B
      is right and this claim is wrong - the two hypotheses are cleanly separated by the sign
      at B1.
  - observable: Peak memory at the free-memory optimum, per set.
    metric: log2 bits of list storage.
    predicted: Modest at these parameters, which is itself the reason claim (A) is plausible
      - if the optimum wanted huge lists, p would have to be large, and p is bounded by the
      tiny t.
  - observable: Quasi-cyclic speedups.
    metric: Presence of any DOOM-type gain.
    predicted: NONE. Classic McEliece is not quasi-cyclic, so the DOOM factor available to
      HQC and BIKE does not apply here; recorded explicitly so the baseline is not accidentally
      imported from the HQC lane.
  minimal_test: Enumerate the full (variant, p, l, depth, and where applicable the representation
    split) grid at each ISO-scoped set, evaluate each cell's exact expected cost in rational
    arithmetic under a self-contained, explicitly stated costing convention with memory and
    memory access charged, and report the minimum and the full sorted top ten. Cross-check
    the Prange cell against H-MCE-efa9b2's H1-C exact count, which must agree to the digit.
    Budget under 600 core-seconds; the grid is small precisely because t is small.
  controls:
  - PRANGE CROSS-CHECK. The p = 0 cell must reproduce C(n, t) / C(n - k, t) exactly and agree
    with H-MCE-efa9b2's independently derived value. A mismatch blocks every other number
    in the table.
  - FREE-MEMORY NULL. Re-run the identical grid with the memory charge set to zero; the published
    free-memory optima for these variants must reappear. If they do not, the cost formulas
    are transcribed wrongly and the charged numbers mean nothing.
  - LINEAR-WEIGHT POSITIVE CONTROL. Run the same grid at a synthetic linear-weight instance
    (rate 1/2, t about 0.1 n) where the representation technique is known to win; a representation-based
    argmin MUST appear there. If it never appears anywhere, the implementation cannot express
    the advanced variants and claim (A) would be an artifact of that inability - this is the
    control that distinguishes a finding from a missing feature.
  confounders:
  - Published cost formulas differ in whether they count field operations, bit operations,
    or memory accesses; a single convention must be declared and applied to every cell, and
    it must NOT be ISD-FC-2026, which GOAL-MCE-001.objective_correction records as unadopted.
  - Some variants' formulas are stated asymptotically and have no honest concrete instantiation
    at n of a few thousand; any such variant must be reported as not-concretely-instantiable
    rather than silently given an extrapolated number.
  - The optimum can sit at a grid boundary; report boundary hits and widen the grid until
    the argmin is interior.
  - 348864 is excluded by ISO scoping but is the set most often quoted in the literature;
    report it separately and clearly marked as out of scope rather than omitting it, so comparisons
    with published tables remain possible.
  falsification_conditions:
  - A representation-based variant is the argmin at any ISO-scoped set under the free-memory
    basis, falsifying claim (A).
  - The linear-weight positive control fails to produce a representation-based argmin, meaning
    the instrument cannot detect the effect and no negative conclusion may be drawn.
  - The Prange cross-check disagrees with H-MCE-efa9b2, indicating an error in one of the
    two derivations that must be resolved before publication.
  - The grid's argmin lands on the boundary and stays there as the grid widens, indicating
    the cost model is unbounded and mis-specified.
  interpretation_limits: This is ACCOUNTING for published algorithms at published parameters,
    in the exact sense of H-MCE-efa9b2's own scope paragraph. It is not an attack, it improves
    no exponent, and no outcome may be reported as a statement about the security of any Classic
    McEliece parameter set in either direction. A charged optimum that comes out below a claimed
    security category is a statement about the ACCOUNTING BASIS, not about the scheme, and
    must be phrased that way.
  assumptions:
  - The (n, m, t) triples, once transcribed from primary text, are as recalled; only the redundancy
    rationals are corpus-sourced.
  - Published concrete cost formulas for Stern, Dumer, MMT and BJMM can be transcribed with
    their stated conventions intact.
  heuristic_assumptions:
  - id: HA-1
    statement: At Classic McEliece's parameters the expected number of iterations of each
      ISD variant equals the inverse of its per-iteration success probability computed under
      the assumption that the code behaves as a uniformly random linear code of the same (n,
      k), uniformly over the parameter grid.
    rigorous_ingredient: The per-iteration success probability is an exact ratio of binomial
      coefficients for a fixed permutation and a uniformly random error support; the randomness
      assumption is on the CODE, not on the error.
    distribution_imitated: The standard random-linear-code heuristic underlying every published
      ISD cost figure - the same assumption the baseline being compared against already makes,
      so the comparison is internally consistent even if the assumption is imperfect.
    validation_route: TOY SCALE, LABELLED AS SUCH - at n = 200 to 400 with the same rate and
      a sublinear t, run Prange and Dumer to a certified solve (recovered error reproduces
      the syndrome) and compare the measured iteration count against the exact predicted expectation,
      over at least 10^3 instances per cell. This validates the counting model, never the
      crypto-scale number.
    tail_checks: Report the empirical distribution of iterations against the predicted geometric
      law, including the 99th percentile; a heavy tail would mean the expectation understates
      the honest cost and the direction of that error must be stated.
  - id: HA-2
    statement: The memory charge is a declared, self-contained function of peak list size
      and access pattern, and the conclusion's dependence on that choice is reported rather
      than fixed by fiat.
    rigorous_ingredient: Peak list size is exactly computable per grid cell from the variant's
      own parameters; only the price per bit-second is a modelling choice.
    distribution_imitated: Not applicable; this is a model choice and is recorded as one.
    validation_route: Report the argmin under at least three charge levels spanning free memory
      to full Wiener cost, and report the charge level at which the argmin changes, if it
      changes at all.
    tail_checks: Report sensitivity of the reported bit counts to a factor-of-4 change in
      the charge.
  target_complexity:
    time_exponent: Produces concrete log2 costs at four ISO-scoped parameter sets rather than
      an exponent. Claim (A) asserts the advanced-variant gain at these parameters is O(1)
      bits rather than exponential - the opposite of an exponent improvement, and stated as
      such.
    memory_exponent: Reported per cell as log2 peak list bits, and charged. Predicted to be
      modest at the argmin, which is the quantitative content of claim (A).
    best_known_baseline: H-MCE-efa9b2's H1-C exact Prange count, plus published concrete ISD
      estimates for these parameter sets (which the corpus records but has NOT read - the
      Esser-Bellini SEC Table 1 transcription is named in GOAL-MCE-001's next_action as still
      outstanding).
    hidden_overhead_disclosure: Concrete ISD tables routinely omit memory access, permutation
      cost amortisation, and Gaussian-elimination reuse; each is either charged explicitly
      or listed as omitted with its expected direction.
    time_memory_tradeoff: Reported as the full charged-versus-free table rather than a single
      point, with the charge level at which the argmin flips called out. Prange-like configurations
      parallelise with no communication; deep merge trees do not, and that asymmetry is charged
      too.
  sota_delta: Supplies GOAL-MCE-001 completion criterion 2's object at the standardized sets,
    certified by exhaustive enumeration rather than numerical optimisation, and simultaneously
    tests the premise of an already-filed hypothesis (H-MCE-efa9b2 H1-B) rather than duplicating
    it. It beats no attack and claims none; the delta is against this program's own absence
    of the table.
  dominated_by: Very likely dominated in numbers by published concrete ISD estimators for
    Classic McEliece - the Esser-Bellini syndrome-decoding estimator is named in GOAL-MCE-001's
    own next_action as a transcription target that BATCH-001 declined to do for a reason DEC-20260803-a5b9b1
    D-3 shows did not exist. If that table already charges memory, claim (B) is dominated
    outright and only claim (A)'s structural statement survives. Inside the corpus, H-MCE-efa9b2
    dominates the Prange cell and the accounting bases; nothing dominates the exhaustive re-optimisation
    or the C(p, p/2) bound. Not a null.
  estimated_cost: Implementation MEDIUM (four variant families, exact rational cost formulas,
    exhaustive grid, certificates for the toy validation). Compute LOW-MEDIUM, under 600 core-seconds
    plus the toy arm.
  recommended_priority: high
  honest_prior_of_survival: About 0.85 that the table is produced correctly; about 0.6 that
    claim (A) holds in the sharp form (representation variants trailing already at basis B1);
    about 0.35 that this changes anything H-MCE-efa9b2 would not have found.
  novelty_status: unverified
  novelty_screen: Screened against IDEA-20260805-554b9d, 43d6df, baa4da, 9704d9, f58517, IDEA-20260807-c3267e,
    H-MCE-31d438, H-MCE-efa9b2 (both full statements read), H-HQC-1d9b21, H-SDITH-d37289,
    KN-LIT-fa9bc8, KN-TECH-035, KN-TECH-044, KNOWLEDGE_BARRIERS.txt, and my own C1-05 and
    C1-12. Web unavailable.
  discriminated_from: H-MCE-efa9b2 (ranks published (tau, mu) pairs across five bases; this
    re-optimises internal parameters exhaustively and challenges the premise that BJMM's published
    tau is attainable at t = 64 to 128). C1-05 in C1b.yaml (asymptotic constrained frontier
    at fixed ratios; this is concrete at five integer triples). IDEA-20260805-43d6df (re-optimisation
    error as a bit-count correction in SDitH's regime).
  source_refs:
  - H-MCE-efa9b2 (H1-A comparator, H1-B ranking permutation with pre-registered (Prange, BJMM),
    H1-C exact Prange count)
  - H-MCE-31d438 (H2-C exact redundancy rationals)
  - KN-LIT-fa9bc8 (sub-linear weight regime; the asymptotic statement this record instantiates
    concretely)
  - KN-TECH-035, KN-TECH-044 (full-cost accounting; NOT ISD-FC-2026, which GOAL-MCE-001.objective_correction
    records as unadopted)
  proof_search_map:
    bottleneck: The claim that an advanced ISD variant's published time exponent is attainable
      at Classic McEliece's t. Every concrete comparison in this goal inherits it, and it
      is never checked because the published exponents are asymptotic in a regime with linear
      weight.
    baseline_embedding:
      parameter_slice: Setting p = 0 and l = 0 reduces every variant to Prange, which must
        reproduce C(n, t) / C(n - k, t) exactly - the old-method boundary.
      reproduction_check: Frozen fixture asserting digit-exact agreement with H-MCE-efa9b2's
        H1-C value at all five sets, including the ISO-excluded 348864.
    observation_collision:
      observable: The charged log2 cost of a grid cell.
      distinct_preimage_search: Two cells with different (variant, p, l) can share a charged
        cost while differing by orders of magnitude in memory, so cost alone under-determines
        the configuration. The table therefore reports the argmin's full parameter vector
        and peak memory alongside every cost, not the cost alone.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: The finite (variant, p, l, depth) grid at the five integer triples,
        which is small enough to enumerate exhaustively because t is small - the same smallness
        that makes claim (A) plausible.
      predicted_gain: Replaces a fitted optimum with a certified one and removes local-optimum
        risk entirely; converts an asymptotic ranking question into a decided finite comparison
        at the parameters that matter.
    quantifier_order: FOR EACH ISO-scoped parameter set and FOR EACH accounting basis in the
      declared list, THERE EXISTS a grid cell attaining the minimum charged cost; claim (A)
      asserts that FOR EVERY such set and basis, that cell is NOT a representation-based variant.
      The quantifier is universal over sets and bases and existential only over grid cells,
      which is what makes exhaustive enumeration a proof rather than evidence.
    method_ceiling:
      strongest_certifiable_claim: A certified minimum over a declared finite grid under a
        declared cost convention. It can never certify that no unlisted variant or no unlisted
        parameterisation does better, and it cannot certify anything about the scheme's security.
      nearby_object_control: The linear-weight synthetic instance, where the desired conclusion
        FAILS and a representation-based variant must win. If claim (A) survives there too,
        the method is measuring its own inability to express those variants rather than a
        property of Classic McEliece.
    proof_obligations:
    - claim: The grid contains the true optimum (argmin is interior).
      responsibility: feasibility
    - claim: Each cell's cost formula is correctly transcribed with its own convention.
      responsibility: baseline
    - claim: The representation count is bounded by C(p, p/2) times the stated factor at these
        p.
      responsibility: size
    - claim: Memory and memory access are charged identically across cells.
      responsibility: interface
    - claim: No outcome is reported as a security statement.
      responsibility: scope
    not_applicable_reason: null
