idea:
  id: IDEA-20260905-2a78f4
  title: Proof-carrying first-acceptance transcripts for parameter generation
  class: composition
  claim: A deterministic parameter-generation rule can carry a compact, independently checkable proof that its reported
    output is the first accepted candidate within a declared seed interval. Missing provenance remains unknown rather
    than being inferred from the output.
  mechanism: Track the ordered prefix of candidate states and one valid rejection reason per rejected state. Cheap
    reasons such as a residue obstruction admit short arithmetic witnesses; expensive predicates retain their own
    proof objects. A shared dependency graph avoids repeating common field and primality facts. An induction on
    the transition relation proves that every predecessor was visited and rejected and that the terminal candidate
    passes all predicates. The graph may compress repeated subproofs, but the linear prefix traversal cost is never
    omitted. This converts a rejection count into a completeness proof about a named search trajectory, while explicitly
    leaving the initial seed selection and any discretionary branching outside the certified claim.
  question_id: RQ-SCURVE-960dbd
