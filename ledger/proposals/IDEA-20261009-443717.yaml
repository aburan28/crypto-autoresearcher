    statement: |-
      The image of 2^k in F_p generates no proper subring, so a digit grading on Z[x]/(x^d - c) is not respected by the group law after reduction and D behaves as a random subset of the same size.
    rigorous_support: |-
      F_p has no proper subrings; closure of a random subset of density delta is delta.
    validation_plan: |-
      10^6 sampled pairs per (n, d) with binomial interval on the closure ratio; random subset of the same size as the null; symbolic lift of S_3 with exact factorisation.
