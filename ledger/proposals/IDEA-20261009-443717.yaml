  title: Digit-grading factor base under Z[x]/(x^d - c) -> F_p
  class: control
  claim: |-
    D = {P : x(P) < 2^(n-k)} has no closure: Pr[P + Q in D | P, Q in D] equals |D|/p within sampling error, and the lift of S_3 to the digit ring with top-digit variables set to 0 neither factors nor drops degree.
  mechanism: |-
    p = 2^n - c with n = d*k gives the ring map Z[x]/(x^d - c) -> F_p, x -> 2^k. In the lifted ring "top digit = 0" is algebraic; the question is whether the addition law or S_3 respects that grading after reduction. Expected answer no, because 2^k generates no subring of F_p.
  novelty_status: adaptation
