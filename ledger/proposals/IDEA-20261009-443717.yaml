      1.00 +/- 0.01 at every (n, d); a ratio outside [0.97, 1.03] with the random-subset control at 1.00 falsifies
  - metric: lifted_S3_degree_drop_or_factor_count
    direction: different
    minimum_effect: |-
      no degree drop and no new factor after zeroing top-digit variables; either falsifies
  minimal_test:
    design: |-
      1. p = 2^n - c for n in {31, 61, 89, 127}, d in {2, 3, 5}; sample 10^6 pairs in D; count sums landing in D.
      2. Lift S_3 to the digit ring, zero the top-digit variables, compute factorization / Groebner basis; compare degree with the unlifted polynomial.
    controls:
