  assumptions:
    - >-
      N prime, N exactly divides #E(F_p), G = E[n] with n the kernel ideal; the
      kernel-ideal correspondence for the single subgroup G (Deuring / Waterhouse,
      cited through IDEA-20260807-02b7b2 and -5d7606).
    - >-
      "Product model" means any isomorphism of the quotient with a product of
      two elliptic curves; the argument in (B) only uses that the composite
      differs from (psi_G x id) o u_k by an automorphism of such a product, and
      that every endomorphism of E killing G lies in n.
    - >-
      Cheon's algorithm as stated in KN-TECH-febb4f, with its divisor condition
      on N - 1 or N + 1; the record's threshold is stated for Cheon-friendly N
      and says nothing for other N.
    - >-
      OFF-LIMITS COMPONENTS: F3 and F1 as components; no factor base, so
      KN-OPEN-020 is untouched.

  proof_search_map:
    bottleneck: >-
      The per-evaluation cost C of the quotient map by a rational cyclic
      subgroup of prime order N ~ p on E x E, presented on a product model.
      Every statement in the record is a function of C; the threshold is
      C = o(N^{1/2}).
    baseline_embedding:
      parameter_slice: >-
        Dimension 1: the quotient E -> E/G by the same cyclic kernel, where the
        map is k-free and its evaluation costs Velu O(N) / square-root Velu
        O~(sqrt(N)) (eprint 2020/341). The record's cost floor must reproduce
        this slice exactly: at toy N the measured Velu cost of psi_G must scale
        linearly in N and the square-root variant, if implemented, as sqrt(N).
      reproduction_check: >-
        Frozen fixture: psi_G computed by Velu at N in {101, 211, 401, 1009} on
        toy curves; check psi_G(P) = O, psi_G injective on a cofactor point,
        #(E/G)(F_p) = #E(F_p); fit the exponent of the field-operation count in
        N (predicted 1.0 +- 0.1).
    observation_collision:
      observable: >-
        Variety level: the pair (j(E/G), j(E)) and the Weil polynomial of the
        quotient. Map level: the point [uk]R returned on (R, O).
      distinct_preimage_search: >-
        Variety level: ALL k collide on the same observable by theorem (A); this
        is the finding, not a defect. Map level: the observable determines k up
        to the known unit ambiguity; two instances (E, P, Q) and (E, P, Q') with
        Q' = [u']Q for a unit u' collide, which is the automorphism quotient
        already charged by KN-TECH-018 and KR-RHO-0528e7.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The ECDLP as the evaluation of a cyclic prime-order quotient of E x E
          on (R, O) in a product model: encoding exact (the second coordinate is
          [uk]R), completeness exact (Cheon turns d evaluations into k),
          soundness exact (every evaluation is checkable against [N]-torsion and
          the pairing of coordinates), cost loss the whole question: C per
          evaluation plus C_build.
        predicted_gain: >-
          None realised; the transform states the exact algorithmic target
          (sub-sqrt cyclic-kernel evaluation in dimension 2) that would cascade.
      - transform: observable_fiber
        proposed_object: >-
          Hold the kernel order N fixed and vary the forgotten structure: the
          rational cyclic kernel <(P, Q)> (this record, quotient k-independent)
          against the Lagrangian K_k of (E x E)[N] (fa1d80, quotient reducible
          iff graph) against a non-isogenous product E x E' with kernel
          <(P, Q')> (no unipotent exists since Hom(E, E') = 0, so the quotient
          CAN depend on the pair). The intrinsic invariant distinguishing them
          is whether a k-dependent unipotent automorphism of the product exists.
        predicted_gain: >-
          Separates "the quotient carries no k" (rational cyclic kernel) from
          "the quotient carries k but costs N to read" (fa1d80) at zero compute.
    quantifier_order: >-
      (A): FOR ALL k in (Z/N)^*, (E x E)/<(P, [k]P)> is isomorphic over F_p to
      (E/G) x E -- unconditional. (B): FOR ALL product-model identifications,
      FOR ALL R in G, the second coordinate of q(R, O) is [uk]R for SOME unit u
      in the image of Aut(E), u depending on the identification but not on R --
      unconditional. (C): FOR Cheon-friendly N and FOR ANY realisation of the
      map-level oracle at per-evaluation cost C, THERE EXISTS an ECDLP algorithm
      at about 1.9 N^{1/3} C^{1/3} -- conditional on Cheon's bound. (D): the
      cost floor is a statement about the declared strategy family (Velu-type,
      square-root-Velu-type, Kani-type) and is NOT a lower bound.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The graph-quotient oracle class is simulable at the variety level and
        non-simulable at the map level, where it is a static DH oracle in cell
        (c) with threshold C = o(N^{1/2}); within the declared strategy family
        no realisation below N^{1/2} per evaluation exists, and the Kani route
        is blocked because the degree is the secret." It certifies nothing about
        undeclared evaluation strategies and no lower bound.
      nearby_object_control: >-
        E x E' with E' NOT isogenous to E and kernel <(P, Q')> for Q' of order N
        on E': Hom(E, E') = 0, no unipotent exists, and the quotient's
        isomorphism class is predicted to VARY with the pair -- the object on
        which the variety-level conclusion of (A) must fail. An instrument that
        reported constancy there would have proved too much. (There is no ECDLP
        relating P and Q' in that setting, which is why the dependence is
        harmless.)
    proof_obligations:
      - claim: u_k is an F_p-rational automorphism of E x E mapping Gamma onto G x {O}, so the quotient is (E/G) x E.
        responsibility: correctness
      - claim: Every endomorphism of E killing G lies in n and acts as 0 on G, so the unit ambiguity in (B) is exactly the image of Aut(E).
        responsibility: correctness
      - claim: The map-level oracle is not simulable by the formal-linear-form simulator (its answer depends on k).
        responsibility: strictness
      - claim: d sequential queries yield [u^i k^i]P, i <= d, and Cheon then costs sqrt(N/d) + sqrt(d); the optimum over d is about 1.9 N^{1/3} C^{1/3}.
        responsibility: runtime
      - claim: In dimension 1 the same cyclic kernel's quotient costs Velu O(N) / square-root Velu O~(sqrt(N)); in dimension 2 no cyclic-kernel analogue is known to this session.
        responsibility: baseline
      - claim: The Kani route requires deg [k] = k^2 and torsion exceeding it; both unavailable.
        responsibility: feasibility
    not_applicable_reason: null

