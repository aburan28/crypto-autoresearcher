    KN-TECH-006) dominates every realisation with c >= 1/2 on time and all of
    them on memory; BSGS dominates on time; Cheon (KN-TECH-febb4f) with free
    auxiliary inputs is the ceiling of what the map-level oracle could buy and
    is itself a known result; transfer attacks (KR-RHO-53c89f) and the generic
