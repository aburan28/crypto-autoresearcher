    Within the goal, IDEA-20260808-fa1d80's classifier at cost N is dominated by
    this record's threshold statement at sqrt(N) only in the sense that the
    record names a cheaper target; neither is an algorithm. "n/a (no result
    claimed on any cost axis)" is the honest Pareto answer.

