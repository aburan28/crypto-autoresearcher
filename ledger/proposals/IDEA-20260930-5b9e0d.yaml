        At least the dimension-1 Velu cost of psi_G (the k-free first
        coordinate alone), i.e. exponent >= 1.0 in N for Velu-type; the LEAD
        branch, with prior at most 0.02, is any declared strategy with measured
        exponent <= 0.4 that does not read k.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE). Write (A) and (B) with the unit
      ambiguity, derive the Cheon optimum of (C), and write the nearby-object
      argument for E x E' (no unipotent). State the strategy family for (D):
      Velu-type enumeration of the kernel, square-root-Velu-type, Kani-type with
      the degree-is-the-secret obstruction written out.
      STAGE 1 (minutes). Toy curves with p of 16 to 24 bits and N exactly
      dividing #E, N in {101, 211, 401, 1009}; for 5 seeds per size and 32 swept
      k per instance compute psi_G by Velu (O(N), feasible at these N), the
      curve E/G, and the invariant battery of (E x E)/Gamma through its
      product form (E/G) x E (point counts over F_p and F_{p^2}, j-pairs);
      record the number of distinct values (prediction 1). Same battery on
      E x E' with a non-isogenous E' and kernel <(P, [k]Q')>, computing the
      quotient's point counts via the explicit isogeny of products where
      feasible or via the (1, N)-polarised quotient's Weil polynomial from the
      kernel's Frobenius action (prediction >= 2); if the latter is not
      implementable in the harness the nearby-object arm is declared
      UNDETERMINED(instrument), never confirmed.
      STAGE 2 (minutes). Cheon's algorithm implemented once; run with the
      cheating oracle (planted signal: must recover k at the predicted cost)
      and with the variety-level oracle (matched null: must fail). This is the
      two-directional RQ-INSTR-f8faa0 control of the record.
      STAGE 3 (hours). Dimension-1 slice: Velu cost of psi_G in field
      operations versus N (exponent 1.0 predicted); if square-root Velu is
      implemented, its exponent (0.5 predicted). Dimension-2 genuine
      evaluation: cost of the declared strategy family at the smallest N
      (exponent >= 1.0 predicted for Velu-type); nothing below is run unless a
      declared strategy exists.
      SEEDS. One PCG64 stream per stage, recorded; instances fixed before any
      oracle is called.
      OUTCOME TABLE. CLOSURE (predicted): (A) confirmed (1 value), nearby object
      varies, Cheon fires on the planted arm and fails on the null arm, the
      cost exponents reproduce the floors -- the oracle class is recorded as
      classified (C3 deliverable) with the threshold C = o(N^{1/2}) and the
      degree-is-the-secret obstruction, and no successor contract is opened.
      LEAD: a declared strategy evaluates the map-level oracle at measured
      exponent <= 0.4 without reading k -- pause condition P3 of GOAL-ENDO-001
      applies; independent review before any record states it. ARTIFACT: (A)
      shows more than one value, or the nearby object is constant, or Cheon
      fails on the planted arm -- the derivation or the instrument is wrong and
      nothing is read.
      FALSIFICATION THRESHOLD, FIXED NOW. (A) is falsified by a single instance
      with 2 distinct battery values; the Cheon control is failed by any planted
      instance not recovered within 4x the predicted cost.
      COST (estimate). Implementation medium: Velu for degree up to 1009 in
      Python, point counting at toy sizes, Cheon with BSGS, the invariant
      battery; the nearby-object arm may need a (1,N)-quotient Weil polynomial
      routine and is the only uncertain component. Compute low: minutes to a
      few hours on one core.
    controls:
      - 'Planted signal: Cheon with the cheating map-level oracle must recover k at the predicted cost (RQ-INSTR-f8faa0 positive direction).'
      - 'Matched null: Cheon with the variety-level oracle must fail; mutual information of the variety battery with k at the NULL-A floor of IDEA-20260807-cb672c.'
      - 'Nearby object: E x E-prime non-isogenous, kernel <(P, [k]Q-prime)>, battery must VARY (the conclusion of (A) must fail there).'
      - 'Baseline reproduction: Velu cost exponent 1.0 for psi_G on the dimension-1 slice.'
      - 'k-resample null with the curve fixed (the lane-wide control of RQ-TORS-8c7b79 and cb672c) on the variety battery: exactly constant.'
      - 'Certificates: psi_G(P) = O, #(E/G) = #E, the pulled point [uk]R checked against the toy ground truth k for each unit u.'
    required_metrics:
      - distinct battery values per instance for (E x E)/Gamma and for the nearby object
      - Cheon group-operation counts on planted and null arms, with the predicted sqrt(N/d) + sqrt(d)
      - Velu (and square-root Velu if present) cost exponents on the dimension-1 slice
      - measured exponent of every declared dimension-2 strategy at the smallest N, or UNDETERMINED(instrument)
      - the derived threshold and optimum d, instantiated at each toy N

  falsification_conditions:
    - 'Theorem (A) falsified iff any toy instance shows 2 distinct isomorphism-invariant values across swept k; record withdrawn.'
    - 'Claim (B) falsified iff on some instance the second product coordinate of q(R, O) is not [uk]R for any unit u in the image of Aut(E).'
    - 'The cell-(c) placement is falsified iff the map-level oracle is shown to be computable in poly(log p) from public data (it would then be cell (b) and the ECDLP would be polynomial), or iff it is shown not realisable at any cost (cell (d)); both are decision-relevant and neither is expected.'
    - 'The method ceiling (D) is falsified iff a declared strategy evaluates the quotient map at exponent <= 0.4 in N without reading k; LEAD branch, routed to review.'
    - 'Instrument falsified (run void) iff the planted Cheon arm fails, the nearby object is constant, or any certificate fails.'

  confounders:
    - >-
      At toy N the unit ambiguity u (up to 6 values on j = 0 / 1728 curves) is a
      visible fraction of (Z/N)^*; the Cheon control divides units out
      explicitly and reports per-u agreement.
    - >-
      The nearby-object arm requires computing an invariant of a non-principally
      polarised quotient; if only point counts are used, two non-isomorphic
      isogenous surfaces share them and the arm may under-report variation. The
      arm is a control on the battery's blindness, not a finding, and is
      declared UNDETERMINED(instrument) if under-powered.
    - >-
      Cheon's divisor condition: toy N must be chosen with d | N - 1 near
      N^{1/3}; the record reports which N were used and does not generalise to
      other N.
    - >-
      Square-root Velu is dimension-1 only; the dimension-2 floor is argued by
      analogy and by the absence of a known algorithm, which is not a bound.

  interpretation_limits:
    - >-
      Audit record. No attack, no exponent moved; the conditional exponent
      N^{1/2 - delta/3} is uninhabited and is stated so that the cell-(c)
      arithmetic of IDEA-20260807-5876b8 has its number.
    - >-
      (A) and (B) are theorems about the stated construction; (C) is conditional
      on Cheon's bound and divisor condition; (D) is a statement about a declared
      strategy family, not a lower bound.
    - >-
      Nothing here bears on RQ-CLGP-b99df5's vectorization problem in either
      direction except to confirm that the kernel-ideal bridge is k-free
      (IDEA-20260807-5d7606); the record does not reduce vectorization to ECDLP
      or conversely.
    - >-
      Toy tier for every measured number; the theorems are scale-independent
      and the toy runs are instrument checks on the implementation.
    - KN-OPEN-020 untouched; no factor base.
    - >-
      Pause condition P3 of GOAL-ENDO-001 applies to the LEAD branch only; the
      record predicts the CLOSURE branch with honest prior at least 0.95.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Cheon-friendliness.) For the toy N used, and for the cryptographic N
        the threshold in (C) is stated for, N - 1 or N + 1 has a divisor d
        within a constant factor of the optimum N^{1/3} / (2C)^{2/3}; for a
        uniformly random prime N of a given size the probability that N - 1 has
        a divisor in [D, 2D] is about 1 - exp(-1/log D) type heuristics
        (Erdos-type divisor density; recalled, not cited).
      rigorous_support: >-
        None needed for the toy runs, where N is chosen with a known divisor.
        For the conditional threshold the record imitates the standard
        auxiliary-input literature's practice of stating the bound for
        Cheon-friendly orders (KN-TECH-febb4f calls this the standardizer's
        lever) and makes no density claim.
      validation_plan: >-
        SAMPLE: toy N with a declared divisor d; no density is measured.
        TRANSFER: none claimed; the threshold statement is explicitly
        conditional on the divisor.
    - id: H2
      statement: >-
        (No cyclic-kernel square-root speedup in dimension 2 within the declared
        family.) No Velu-type or square-root-Velu-type evaluation of the quotient
        of E x E by a rational cyclic subgroup of prime order N, presented on a
        product model, costs o(N^{1/2}) per evaluation.
      rigorous_support: >-
        None; it is the absence of a known algorithm plus the dimension-1
        analogue (eprint 2020/341) sitting exactly at N^{1/2}. It is the
        assumption most likely to be WRONG in an interesting way, and that is
        the LEAD branch.
      validation_plan: >-
        SAMPLE: measured cost exponents of every declared strategy at toy N;
        COMPARE against the dimension-1 Velu exponent 1.0 and the square-root
        exponent 0.5; TAIL: any strategy at exponent <= 0.4 is the LEAD branch.
        TRANSFER: an exponent measured at N <= 1009 is labelled toy and no
        extrapolation is claimed.

  heuristic_note: >-
    (A) and (B) are unconditional; (C) is conditional on Cheon's published bound
    and on H1; (D) rests on H2 and is the record's honest expected outcome.

  target_complexity:
    time_exponent: >-
      CONDITIONAL AND CURRENTLY UNINHABITED. Given a map-level realisation at
      per-evaluation cost C = N^{c}, the ECDLP on Cheon-friendly N costs about
      1.9 N^{(1 + c)/3} group-operation equivalents plus C_build; c = 1/2 ties
      rho's exponent 1/2, c < 1/2 beats it, and every known cyclic-kernel
      evaluation has c >= 1/2 (dimension 1) or c >= 1 (dimension 2 Velu-type).
      UNCONDITIONALLY CLAIMED: nothing below N^{1/2}.
    memory_exponent: >-
      Cheon's O(max(sqrt(N/d), sqrt(d))) = about N^{(1 - ...)} at the optimum,
      i.e. N^{1/3} at d = N^{1/3}, plus whatever the oracle realisation stores;
      against O(1) for rho. Disclosed.
    best_known: >-
      Rho 0.886 sqrt(N), O(1) memory (KN-TECH-006); Cheon with d auxiliary
      inputs given for free, sqrt(N/d) + sqrt(d) (KN-TECH-febb4f); cyclic
      N-isogeny evaluation O~(sqrt(N)) in dimension 1 (eprint 2020/341);
      fa1d80's classifier at N quotient computations.
    hidden_overhead: >-
      C_build (computing the quotient once, at least the Velu cost of psi_G,
      i.e. >= N by enumeration of the kernel or sqrt(N) by square-root Velu for
      the k-free coordinate alone), Cheon's log factor, the unit ambiguity, and
      the divisor condition on N; all disclosed.
    tradeoff_note: >-
      Cheon's time-memory tradeoff is inherited; d sequential oracle calls do
      not parallelise (each needs the previous answer), which caps parallel
      speedup at the Cheon stage. Not comparable with rho's linear parallelism.

  estimated_cost:
