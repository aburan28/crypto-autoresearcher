idea:
  id: IDEA-20260930-5b9e0d
  question_id: RQ-GGMB-6eaabc
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE GRAPH-QUOTIENT ORACLE ON E x E, CLASSIFIED IN BOTH OF ITS READINGS: the
    quotient VARIETY (E x E)/<(P, Q)> is isomorphic to (E/G) x E for every k, by
    the one F_p-rational unipotent automorphism (x, y) -> (x, y - [k]x), so every
    isomorphism-invariant of it is a CONSTANT oracle (cell (a) of
    IDEA-20260807-5876b8, simulable, closed at 1/2, content = the kernel-ideal
    action E/G = n * E already filed by IDEA-20260807-5d7606); while the quotient
    MAP presented on any product model returns [u k]R on (R, 0) for a known unit
    u, is a STATIC DIFFIE-HELLMAN oracle, is NON-simulable, sits in cell (c) with
    a realisation cost C per evaluation, and cascades through Cheon
    (KN-TECH-febb4f) to about 1.9 N^{1/3} C^{1/3} on Cheon-friendly N -- so any
    o(N^{1/2}) evaluation of a prime-order cyclic quotient of an abelian surface
    from its kernel generator is a sub-sqrt ECDLP, the known cyclic-kernel
    evaluation floor (Velu O(N), sqrt-Velu O~(N^{1/2}) in dimension 1) exactly
    TIES rho, and the Kani route needs deg [k] = k^2, which is the secret
  class: mechanism

  claim: >-
    SETTING. E/F_p ordinary, G = <P> of prime order N with N exactly dividing
    #E(F_p), Q = [k]P, n = (N, pi - 1) the kernel ideal of G in O = End_{F_p}(E)
    (so G = E[n] and E/G = n * E, IDEA-20260807-02b7b2, IDEA-20260807-5d7606).
    Let Gamma = <(P, Q)> in E x E, cyclic of order N and F_p-rational. The
    record classifies two oracles built on Gamma, as RQ-GGMB-6eaabc demands of
    every oracle class the goal invents. Representation class R3 of
    RQ-ECDLP-623a32 (E x E and gluing representations); attack stage: none --
    this is an audit record; the stage it would bear on is collision structure,
    through Cheon.

    (A) VARIETY LEVEL -- k-INDEPENDENT, HENCE CONSTANT, HENCE SIMULABLE. Let
    u_k: E x E -> E x E, (x, y) -> (x, y - [k]x). It is an endomorphism with
    inverse (x, y) -> (x, y + [k]x), defined over F_p since [k] is, and
    u_k(R, [k]R) = (R, O), so u_k(Gamma) = G x {O}. Therefore
    (E x E)/Gamma is isomorphic over F_p to (E x E)/(G x {O}) = (E/G) x E,
    for EVERY k. Consequence: any oracle whose answer is an isomorphism
    invariant of the quotient abelian surface -- its Weil polynomial, point
    counts over F_{p^i}, endomorphism algebra, the j-invariants of its factors,
    any Igusa-type datum -- is a CONSTANT function of (E, G) and is cell (a) of
    IDEA-20260807-5876b8: a constant oracle is simulated by returning the
    constant, Shoup applies, closed at exponent 1/2. Its only non-trivial
    content is the curve E/G = n * E, which is the class-group action by the
    kernel ideal and is exactly the bridge IDEA-20260807-5d7606 already filed
    and broke (one subgroup, one ideal, no k). This half is a derivation; the
    record adds it only because the sibling record IDEA-20260808-fa1d80 uses
    reducibility of a quotient of E x E as a CLASSIFIER and the present
    statement says precisely why the rational cyclic kernel carries nothing at
    the variety level.

    (B) MAP LEVEL -- A STATIC DIFFIE-HELLMAN ORACLE, NON-SIMULABLE, CELL (c).
    The quotient morphism q: E x E -> (E x E)/Gamma, composed with ANY
    identification of the codomain with a product model (E/G) x E, equals
    (psi_G x id) o u_k up to an automorphism of (E/G) x E, where psi_G is the
    N-isogeny E -> E/G. An automorphism of the product is a matrix
    [[a, b], [c, d]] with a in Aut(E/G), d in Aut(E), b in Hom(E, E/G),
    c in Hom(E/G, E). On an input (R, O) with R in G the second coordinate of
    the image is c(psi_G(R)) + d(-[k]R); c o psi_G is an endomorphism of E that
    kills G, hence lies in the kernel ideal n and acts as 0 on G; so the second
    coordinate is [-d k]R with d a unit of End(E), i.e. [u k]R for u in the
    image of Aut(E) in (Z/N)^*, at most 6 values and all known. THEREFORE: any
    oracle that evaluates the quotient map on a point of E x E and reports the
    image in a product model is a static Diffie-Hellman oracle R -> [u k]R on
    G, up to a known finite ambiguity. It is NOT simulable: its answer on the
    handle (lambda(R), 0) is [uk] times that handle, which the formal-linear-form
    simulator of 5876b8 cannot produce without k. It is NOT cell (d) either: the
    quotient of a variety by a given finite subgroup is computable from the
    subgroup's generator (P, Q), which is public, so the oracle is REALISABLE
    at some cost C per evaluation (plus a one-time C_build). That is cell (c),
    and 5876b8 says cell (c) is adjudicated by arithmetic.

    (C) THE ARITHMETIC. With the static DH oracle one obtains [u^i k^i]P for
    i = 1..d by d sequential queries (feed back the previous answer), and the
    known units are divided out; this is exactly Cheon's auxiliary-input
    setting (KN-TECH-febb4f; KN-LIT-6501: given P, aP, ..., a^d P with d | N-1,
    recover a in O(log N (sqrt(N/d) + sqrt(d))) operations; d | N+1 with inputs
    to a^{2d}). Total cost C_build + d C + sqrt(N/d) + sqrt(d). Minimising over
    d gives d = N^{1/3} / (2C)^{2/3} and total about 1.9 N^{1/3} C^{1/3}
    (re-derived here; the constant is from the two-term optimum and ignores
    Cheon's log factor). Hence: a realisation with per-evaluation cost
    C = N^{1/2 - delta} yields an ECDLP at N^{1/2 - delta/3} on N whose N - 1
    (or N + 1) has a divisor near the optimal d; and C = N^{1/2} exactly TIES
    0.886 sqrt(N) up to the constant. THE THRESHOLD IS THEREFORE SHARP:
    sub-sqrt evaluation of the graph quotient from its generator is a sub-sqrt
    ECDLP on Cheon-friendly orders, and nothing less is.

    (D) THE METHOD CEILING, WHICH IS THE RECORD'S HONEST EXPECTED OUTCOME. The
    kernel Gamma is cyclic of PRIME order N ~ p. In dimension 1 the analogous
    problem -- evaluate psi_G, the cyclic N-isogeny E -> E/G, at a point from
    the generator P -- costs O(N) by Velu and O~(sqrt(N)) by square-root Velu
    (Bernstein-De Feo-Leroux-Smith, eprint 2020/341, retrieved this session),
    and nothing faster is known to this session; and that exponent 1/2 is
    EXACTLY the tie point of (C). In dimension 2 the quotient by a cyclic
    subgroup of prime order N has polarisation type (1, N), no smooth
    decomposition (N prime), and no cyclic-kernel analogue of square-root Velu
    known to this session (unverified). The Kani / glue-and-split route
    (KN-TECH-026) reconstructs an isogeny from its DEGREE and its action on a
    torsion basis; here Gamma is the graph of [k] on G only, the degree of [k]
    is k^2, which IS the secret, the rational torsion available is N < k^2 for
    every k > sqrt(N), and the auxiliary isogeny of degree M - k^2 cannot be
    chosen without k. NAMED OBSTRUCTION: the degree is the secret. Forward
    guidance: the one algorithmic event that would change this lane is an
    evaluation of a prime-order cyclic quotient of E x E from its generator at
    o(sqrt(N)) per point after polynomial setup; the record predicts it does not
    exist in the declared strategy family and prices exactly what it would buy.

  mechanism: >-
    OBJECT FRAME (docs/object-frame-ideation.md section 3). REPRESENTATION: R3,
    the pair (R, S) in E x E and its image under the quotient by Gamma.
    OPERATION SET Sigma: the quotient morphism q (an isogeny of abelian
    surfaces) and the automorphisms of the product codomain; NOT the
    translation action on G. TRACKED OBJECT, variety level: the isomorphism
    class of (E x E)/Gamma. TRICHOTOMY: it is a CONSTANT projection of the
    instance (every k maps to the same class), so under IDEA-20260806-c5d183 it
    is the degenerate constant case, not a lossy object at all, and the record
    says so rather than forcing a class. TRACKED OBJECT, map level: the second
    product coordinate of q(R, O), which equals [uk]R; this is INJECTIVE on G
    (a change of coordinates by a hidden scalar), hence again not lossy; it is
    coordinate-DEPENDENT (Class III) only in the sense that producing it
    requires the geometric quotient rather than group operations. LOSSY-
    PROJECTION TEST AGAINST Sigma: FAILS BY DESIGN in both readings -- the
    variety-level object discards everything (constant), the map-level object
    discards nothing (a scalar multiple). That failure IS the finding: the k-
    dependence of the graph-quotient construction lives entirely in one
    unipotent automorphism, and there is no intermediate object between
    "constant" and "the secret times R". THE ONE OPEN NUMBER is therefore not a
    canonicalisation cost but the realisation cost C per evaluation of cell (c),
    whose threshold (C) fixes at o(N^{1/2}).

    NON-GENERIC RESOURCE CONSUMED. The audit lane consumes none; the oracles it
    classifies consume R4 (the kernel-ideal action E/G = n * E for psi_G) and
    the geometry of E x E as an abelian surface (R3 representation). Nothing
    acts on G except [k] and units, so H-ENDO-001 is respected: the static DH
    oracle is not an endomorphism-image oracle (KN-FIND-b7e091's Oracle D,
    which is simulable) because its scalar is the SECRET, not a public
    eigenvalue.

    SIMULABILITY, STATED AS THE LANE REQUIRES. Variety-level: SIMULABLE (cell
    (a)); closed at 1/2; delivers the kernel-ideal curve E/G and nothing else.
    Map-level: NON-SIMULABLE with the explicit argument of (B); cell (c);
    delivers a static DH oracle whose cascade value is priced in (C) and whose
    realisation cost is bounded below by every known cyclic-kernel evaluation
    at sqrt(N), the tie point.

    OFF-LIMITS COMPONENTS DECLARED. F3 (isogeny) and, through Cheon, F1
    (walk-collision) are components. What is added: the cell placement of a
    new oracle class with its threshold, the unipotent-automorphism argument
    that kills the variety level for RATIONAL cyclic kernels (fa1d80 works with
    Lagrangians in the full E[N], which is not rational), and the
    degree-is-the-secret obstruction for the Kani route.

    WHY THIS IS NOT A RESTATEMENT OF IDEA-20260808-fa1d80. That record uses the
    reducibility of (E x E)/K for the N + 1 Lagrangian subgroups K of (E x E)[N]
    containing (P, Q) -- a subgroup of order N^2 defined over the field of
    E[N], not over F_p -- as a one-bit classifier, prices it at N quotient
    computations, and asks for a propagation rule along the pencil. This record
    takes the F_p-RATIONAL cyclic kernel of order N, proves its quotient is
    k-independent (so no classifier exists at the variety level at all), and
    locates the k-dependence in the MAP, where it is a static DH oracle with a
    Cheon price. fa1d80's object is dominated at cost N; this record's threshold
    is sqrt(N), and the two agree that no sub-sqrt route is known.

