idea:
  id: IDEA-20260808-481e07
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MONO-001
  goal_id: GOAL-MONO-001
  title: PAUSE-FLAGGED - complete splitting on the factor-base locus means the decomposition
    ideal's solution count carries a forced factor 2^{m-1} of sign variants, so every semi-regular
    null this programme compares against is biased by a computable amount, and the correction
    is derivable from KN-FIND-a8990a with no new monodromy measurement
  class: control
  claim: 'REQUIRES THE GOAL-MONO-001 PAUSE TO CLEAR BEFORE DISPATCH; filed now because the
    content is a correction to the SDEG/DREG nulls and does not need any monodromy measurement.
    KN-FIND-a8990a Theorem C establishes that on the factor-base locus S_m splits completely
    at every m, with root set exactly {x(eps_1 P_1 + ... + eps_{m-1} P_{m-1})}. CONSEQUENCE
    FOR THE DEGREE AXIS, WHICH THAT ENTRY DOES NOT DRAW: the decomposition ideal I_R is posed
    in x-coordinates, so each set-theoretic decomposition R = sum_i P_i with P_i in +-V corresponds
    to 2^{m-1} distinct sign vectors mapping to the SAME x-tuple only when the signs are globally
    flipped, and to DISTINCT x-tuples otherwise; concretely the number of F_p-points of V(I_R)
    exceeds the number of group-theoretic decompositions by a factor that is exactly computable
    from the sign action and equals 2^{m-1} on the generic stratum. Since d_solve is defined
    by the degree at which the Macaulay corank reaches the SOLUTION COUNT, a null that uses
    the group-theoretic count instead of the ideal-theoretic count sets the threshold at the
    wrong place, and the resulting d_solve is biased. CLAIM: the bias is a fixed, computable
    correction (a factor 2^{m-1} in the count, hence a shift of about (m-1) log 2 / log(column
    growth) in the degree), it applies to every prime-field cell this slice proposes to measure,
    and no record in the corpus applies it.'
  mechanism: The corpus has the two halves and has never joined them. KN-FIND-a8990a fixes
    the fibre arithmetic exactly (complete splitting, root set = signed sums) and explicitly
    says the result is NOT an algorithm because relation search asks the opposite question.
    KN-FIND-007 fixes the mean yield as a count of MULTISETS. The degree-axis instrument counts
    SOLUTIONS OF AN IDEAL. Those three counts differ by known symmetry factors - sign flips,
    coordinate permutations (S_m, a factor m! if the ideal is not symmetrised), and multiset
    repetitions - and the corank threshold must use the ideal count. This is arithmetic, not
    a hypothesis, and it is the kind of off-by-a-factor that silently shifts an integer degree
    by one and thereby changes a cost by E2-01's jump factor.
  why_not_a_renamed_known_approach: Nearest in-corpus records are IDEA-20260805-a9a95d (the
    +-symmetric factor-base identity) and IDEA-20260807-add964 (the +-lift of an x-coordinate
    base), both of which concern the RELATION count and the factor-base representation. This
    record concerns the SOLUTION COUNT used as a threshold inside a degree measurement - a
    different consumer of the same symmetry - and its deliverable is a correction to the null,
    not to the yield.
  predictions:
  - observable: ratio of ideal-theoretic solution count to group-theoretic decomposition count
    metric: exact ratio by enumeration at p in {101, 211, 1009}, B in {4,6,8}, m in {2,3}
    predicted: Exactly 2^{m-1} on the generic stratum, with computable deviations on the degenerate
      strata (a coordinate equal to another, a partial signed sum in E[2], a factor-base point
      of order 2). The degenerate fraction should be O_m(1/B) and must be reported.
  - observable: d_solve computed with the corrected and uncorrected thresholds
    metric: integer difference
    predicted: '0 or 1 at most cells and exactly 1 at cells where the corank crosses between
      the two counts. FORCED CONSEQUENCE: at the cells where it is 1, the cost changes by
      E2-01''s jump factor, so the correction is not cosmetic even though it is small.'
  - observable: whether committed prime-field cells (if any) used which count
    metric: audit of archived artifacts
    predicted: The audit itself is a deliverable; if artifacts do not record which count was
      used, that is reportable exactly as in IDEA-20260806-7ea402's stage 1.
  minimal_test: 'Zero to low compute. (1) Derive the exact correction factor on each stratum
    from the sign action, including the degenerate strata, and state the stratum sizes. (2)
    Verify by exhaustive enumeration at p in {101,211}, B in {4,6}, m in {2,3}: count ideal
    solutions directly and group decompositions directly, and check the ratio. (3) Recompute
    d_solve at any available cell with both thresholds and report the integer difference.
    (4) Record which count each existing artifact used, proposing no status change.'
  controls:
  - DEGENERATE-STRATUM ARM: cells containing a 2-torsion factor-base point, or two equal coordinates,
      must be handled explicitly; a correction derived only on the generic stratum and applied
      everywhere is exactly how such factors go wrong.
  - SYMMETRISED-VERSUS-UNSYMMETRISED ARM: if the ideal is posed in elementary symmetric coordinates
      the m! factor disappears and the sign factor changes; both formulations must be reported
      so the correction is not silently formulation-specific.
  - m = 2 KNOWN-ANSWER EDGE: at m = 2 the factor is 2 and can be checked by hand on a single
      curve.
  confounders:
  - Multiset versus set counting (repeated factor-base elements) interacts with the sign factor
    and must be separated.
  - The +-lift convention (whether V is a set of x-coordinates or a symmetric set of points)
    differs across this corpus's records and the correction differs accordingly.
  - Cells where B is small relative to 2^{m-1} have a large degenerate fraction and are unsuitable.
  falsification_conditions:
  - The measured ratio is not 2^{m-1} on the generic stratum. The derivation is wrong and
    must be redone.
  - Applying the correction changes d_solve at no cell in the reachable range. The correction
    is real but inert at toy scale, which is a legitimate and honest outcome and should be
    recorded so nobody re-derives it.
  - Archived artifacts already used the ideal-theoretic count. Nothing to correct; the record
    becomes a documentation note.
  interpretation_limits: GOAL-MONO-001 IS PAUSED and this record must not be dispatched under
    that goal until the pause clears; it is filed against RQ-MONO-001 because that is where
    the source theorem lives, but its consumer is the SDEG/DREG degree axis and it could equally
    be dispatched there. It is a correction to a null, not a finding about curves, and it
    moves no exponent. Toy tier for the verification arm.
  assumptions:
  - KN-FIND-a8990a Theorem C as recorded (derivation, toy-verified, NOT independently reviewed
    - the entry says so itself and that caveat propagates here).
  - The degree instrument defines d_solve by a corank threshold.
  heuristic_assumptions:
  - id: HA-1
    statement: The degenerate strata (equal coordinates, signed partial sums in E[2], degree
      drops) have density O_m(1/B) in V^m, so the generic-stratum correction factor 2^{m-1}
      is exact up to a relative error O_m(1/B).
    rigorous_ingredient: KN-FIND-a8990a records the non-good locus as having O_m(q^{n-1})
      points out of q^n, i.e. relative density O_m(1/q); the analogous statement on the factor-base
      locus V^m is the same codimension count with q replaced by B and is heuristic only in
      that V is not a generic subvariety.
    distribution_imitated: Codimension counting for a proper closed subscheme intersected
      with a product set - the standard expectation that a proper condition cuts a 1/B fraction.
    validation_route: Exhaustive enumeration of V^m at B <= 8, m <= 3 and direct counting
      of each stratum, compared against the predicted O_m(1/B). TOY SCALE, and the record
      explicitly notes that V is a chosen set, not a random one, so a structured V could have
      a much larger degenerate fraction - which is why E2-09's multiplicative-coset base must
      be checked separately.
    tail_checks: Report the largest observed degenerate fraction over all cells and the V
      achieving it; a structured V with a large fraction is a finding about that V, not noise.
  target_complexity:
    time_exponent: No attack exponent. The record shifts d_solve by at most one degree, which
      by E2-01's jump table changes the algebraic oracle cost by a bounded ratio of consecutive
      Macaulay column counts.
    memory_exponent: Unchanged.
    best_known_baseline: Not applicable; this is a null correction, and the incumbent is the
      uncorrected null.
    hidden_overhead_disclosure: The correction is exact only on the generic stratum; the degenerate
      contribution is bounded heuristically and that bound is the record's weakest point.
    time_memory_tradeoff: Not applicable.
  sota_delta: 'Zero on attack axes. Deliverable: an exact factor 2^{m-1} correction to the
    solution-count threshold used by every degree measurement in this slice, with the stratum
    decomposition and the resulting integer degree shift per cell. Small, cheap, and of the
    kind that silently invalidates a comparison if omitted.'
