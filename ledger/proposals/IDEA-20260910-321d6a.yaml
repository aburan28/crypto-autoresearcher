idea:
  id: IDEA-20260910-321d6a
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-09-10'
  proposed_by: idea-generator
  status: proposed
  class: composition

  title: >-
    Friend-pair random-suppression transplanted onto related-differential /
    zero-difference pairings: a program-adjudicable secret-key distinguisher
    object for reduced-round AES, seeded by Shin (ePrint 2025/248) but NOT a
    reproduction of the exchanged-boomerang claim

  claim: >-
    TRACKED CLAIM (adjudicable only against REF-A / REF-B / REF-C). There exists
    a secret-key distinguisher object for AES-128 reduced to r=5 whose ACCEPT
    predicate is a RELATED-DIFFERENTIAL / ZERO-DIFFERENCE pairing (Yan/Tan/Qi
    ingredients, KN-LIT-1848 as POINTER) filtered by a FRIEND-PAIR amplifier
    (Shin ePrint 2025/248 friend-pair + inverse-diagonal exchange suppression,
    KN-LIT-1424 as POINTER) such that: (i) measured acceptance probability on
    AES-128 at r=5 is strictly above the measured acceptance probability on a
    matched 10-round AES control at identical data/kind; (ii) measured FPR of
    the full ACCEPT rule on that control is quantified at a pre-registered N;
    (iii) measured end-to-end adaptive chosen-ciphertext / chosen-plaintext
    cost under frozen CM-3 is recorded as a PROGRAM BASELINE for this object,
    never as a published-frontier margin. NO claim that the object beats Yan's
    recalled ACP ~2^23.32, Shin's recalled ACC figures, or any other published
    figure — those numbers are POINTERS only (RQ-AES-003 R3). A positive
    outcome is a new program-adjudicable record (measured FPR + CM-3 cost on
    this harness). A negative outcome that the friend-pair filter does not
    suppress the random side for related-differential pairings the way Shin
    reports for fully-active / inactive diagonals is an equally first-class
    scoped negative.

  object_first_candidate:
    tracked_object: >-
      THE FRIEND-FILTERED RELATED-DIFFERENTIAL ACCEPT EVENT. A plaintext /
      ciphertext pairing carries (a) a related-difference or zero-difference
      predicate on named byte sets after r rounds (Yan-style object, POINTER
      KN-LIT-1848) and (b) a friend-pair certificate: existence of auxiliary
      texts linked by a fixed number of inverse-diagonal exchanges that force
      the random-side fully-active / fully-inactive pattern probability down
      (Shin-style amplifier, POINTER KN-LIT-1424). The retained readout is the
      binary ACCEPT of (a AND b) over a declared query budget — a lossy
      projection of the adaptive transcript that discards which specific
      friend witnesses succeeded and keeps only the joint event.
    established_families_off_limits: >-
      Off-limits as PRIMARY lens: classical differential / truncated;
      linear; integral / square / division property; impossible differential;
      MiTM / Demirci-Selcuk; plain boomerang / retracing boomerang without the
      friend filter; biclique; algebraic / Groebner; yoyo as sole lens;
      mixture-differential / exchange as sole lens; subspace trail.
      HOW THIS STAYS OUT: the primary tracked object is the JOINT
      (related-differential predicate AND friend-pair certificate), not either
      family alone. Exchange and related-differential are ingredients of the
      composition, not the claim's primary lens. Reproduction of Shin's
      exchanged boomerang is STAGE 0 scaffolding only and is not the claim.
    newness_score: >-
      Composition of two published ingredient classes (friend-pair suppression
      + related-differential pairing). Novelty against THIS PROGRAM's ledger:
      IDEA-20260828-82676b tests multiple-of congruence under exchange /
      related-differential without friend-pair amplification; GOAL-AES-003
      yoyo / carrier lanes do not track friend pairs. Whether the composition
      is new in the literature is UNVERIFIED (novelty_status below).
    testability_score: >-
      High. Stage 0 (optional Shin-shape smoke on small data) then Stage 1
      friend-filter ablation on a fixed related-differential predicate vs
      matched 10-round control — both produce binary pass/fail against
      pre-registered FPR bands.
    survival_score: >-
      Primary adjudication at r=5 against REF-C's full-diagonal integral death
      at r=5 and the campaign's r=5-alive / r=6-dead yoyo fixtures. Extension
      to r=6 is OUT OF SCOPE for this IDEA (see IDEA-20260910-4b25eb).

  mechanism: >-
    Shin (KN-LIT-1424 / ePrint 2025/248; figures RECALLED from user-provided
    full text / eprint abstract this session, provenance recalled, NEVER as
    decision support) reports that friend pairs plus four inverse-diagonal
    exchanges suppress the random fully-active / inactive diagonal pattern
    probability, enabling exchanged-boomerang distinguishers whose claimed
    ACC figures (~2^31 @70%; clustered multiple ~2^27.1 @79.6% with trail
    probabilities summing to ~2^-26.1 vs random 2^-30) are POINTERS only.
    Yan/Tan/Qi (KN-LIT-1848 / ePrint 2026/1039; abstract-level, kb stub) report
    related-differential distinguishers with a recalled ACP ~2^23.32 at 5
    rounds — POINTER only.
    THIS MECHANISM: fix a related-differential / zero-difference ACCEPT
    predicate P_RD on r=5 AES (independently re-derived or reused from this
    program's exchange harness IDEA-20260807-4ee607 / IDEA-20260828-82676b,
    not copied from unread PDF internals). Define a friend-pair filter F_fp
    that, given a candidate pair, searches a bounded number of inverse-
    diagonal exchanges for auxiliary texts satisfying Shin's friend
    certificate shape. The distinguisher ACCEPTS iff P_RD AND F_fp both hold.
    COST BOOKKEEPING: per-attempt cost = cost(P_RD query) + expected cost of
    the friend search; success probability measured, never assumed; CM-3
    charges cost/p. DISCRIMINATION: if F_fp suppresses the 10-round control
    acceptance rate by a factor comparable to the AES-side suppression while
    preserving AES-side P_RD mass, the composition improves the adjudicable
    likelihood ratio; if F_fp suppresses AES and control equally, the friend
    filter is non-discriminating for related-differential objects and the
    composition is falsified as an improvement path.

  novelty_status: unverified

  literature_context:
    - ref: KN-LIT-1424
      provenance: kb
      claim: >-
        Shin et al., ePrint 2025/248, "New Exchanged Boomerang Distinguishers
        for 5-Round AES". Friend-pair + inverse-diagonal exchange suppression;
        claimed ACC figures recalled from user paste this session as POINTERS
        only (massive ~2^31 @70%; multiple ~2^27.1 @79.6%).
      verified_by: null
    - ref: KN-LIT-1848
      provenance: kb
      claim: >-
        Yan/Tan/Qi, ePrint 2026/1039. Related-differential distinguishers up
        to 7 rounds; recalled ACP ~2^23.32 at 5 rounds — POINTER only under R3.
      verified_by: null
    - ref: KN-LIT-6976
      provenance: kb
      claim: Exchange attack / exchange-invariant sets for 5–6 round AES (POINTER).
      verified_by: null
    - ref: KN-LIT-699
      provenance: kb
      claim: Practical 5-round AES distinguishers / adaptive setting (POINTER).
      verified_by: null
    - ref: IDEA-20260828-82676b
      provenance: internal
      claim: >-
        Prior related-differential / exchange congruence gate WITHOUT friend
        pairs — nearest internal prior; this IDEA adds the friend-pair axis.
      verified_by: idea-generator (read this session)

  lossy_projection_identifiability_audit:
    projection: >-
      Adaptive transcript of plaintexts/ciphertexts under exchanges →
      (P_RD bit, F_fp bit) → single ACCEPT bit.
    what_is_discarded: >-
      Individual witness identities, unused exchange branches, and all
      byte values outside the named related-difference / friend certificate
      sets.
    why_genuinely_lossy: >-
      Many transcripts share the same ACCEPT bit; the map is far from injective.
    why_compatible_with_the_operations: >-
      Related-difference predicates and diagonal exchanges are defined to
      commute with SubBytes/ShiftRows on the named byte sets (exchange
      literature POINTER KN-LIT-6976; program harness IDEA-20260807-4ee607).
      The friend certificate is a further predicate on the same exchange
      action, so the retained bits propagate under the named operation set
      (exchanges + related-difference checks), not under full translation.
    is_it_only_a_change_of_coordinates: >-
      No — ACCEPT discards the fibre of witnesses; recovering the transcript
      from ACCEPT alone is impossible.

  predictions:
    - metric: >-
        Measured AES-r=5 ACCEPT rate of (P_RD AND F_fp) minus measured
        10-round-AES control ACCEPT rate, at matched data/kind and N keys
      direction: higher
      minimum_effect: >-
        Primary: AES rate exceeds control rate with one-sided p < 0.01 under
        the pre-registered binomial / Poisson model, AND control FPR stated
        with resolution in bits in the same sentence (RQ-AES-003 R4(1)).
        Secondary: friend-filter ablation — ratio
        rate(P_RD AND F_fp)/rate(P_RD) on control strictly below the same
        ratio on AES (friend filter preferentially suppresses random).
    - metric: Measured end-to-end CM-3 cost of one ACCEPT decision (AES-r=5)
      direction: lower
      minimum_effect: >-
        Recorded as a PROGRAM BASELINE for this object. Comparison allowed
        only to (a) definitional REF-A exhaustive search cost in r-round
        evaluations, (b) a self-built REF-B baseline the campaign measures
        for the SAME P_RD without F_fp, (c) REF-C survival past measured
        death rounds. NO comparison to recalled published ACP/ACC figures
        as a margin.

  minimal_test:
    design: >-
      STAGE 0 (optional smoke, not the claim): implement a minimal friend-pair
      check on a known exchange pattern; confirm the control-side fully-active
      pattern rate moves in the direction Shin's POINTER suggests, without
      asserting Shin's published ACC.
      STAGE 1 (DECISIVE, cheap): fix one P_RD predicate at r=5; measure
      ACCEPT rates for P_RD alone and P_RD AND F_fp on AES and on matched
      10-round AES, N>=16 independent keys, pre-registered query budget.
      STAGE 2 (gated): if Stage 1 shows preferential random suppression,
      freeze CM-3 instrumentation and measure end-to-end cost vs REF-B
      (same P_RD, no friend filter) on the same machine.
    controls:
      - >-
        NULL: 10-round AES-128 at identical data/kind/query budget; forced
        near-null ACCEPT under HEUR-FP1; FPR measured, not assumed.
      - >-
        ABLATION: P_RD without F_fp (REF-B self-baseline for this object).
      - >-
        SIBLING: misaligned inverse-diagonal exchange tables (offset +1 mod 4);
        predicted null excess — isolates geometry.
      - >-
        GRADED: r in {4,5,6} spot arms; excess must not increase with r
        (inventor-protocol §3 artifact tell).
    required_metrics:
      - AES and control ACCEPT counts and rates with CI
      - measured FPR on control with resolution in bits
      - ablation ratios AES vs control
      - CM-3 wall clock, peak RSS, query counts by kind
      - per-arm key digest and seed

  falsification_conditions:
    - >-
      Friend filter suppresses AES and control ACCEPT rates by statistically
      indistinguishable factors at Stage 1 — composition adds no adjudicable
      discrimination for related-differential objects.
    - >-
      Control FPR of (P_RD AND F_fp) not below control FPR of P_RD alone at
      the pre-registered budget — friend filter fails to suppress random.
    - >-
      Excess that does not decay from r=5 to r=6 to 10-round control —
      artifact tell; void the reading.
    - >-
      Any citation of recalled published ACC/ACP as a completion margin —
      claim-tier / R3 violation; invalid as evidence.

  confounders:
    - >-
      Exact friend-pair definition in Shin 2025/248 may differ from this
      session's operationalisation; Stage 0 labels the implementation as
      PROGRAM-LOCAL, not as a paper reproduction.
    - Adaptive query dependence can manufacture correlations; freeze query
      schedule before reading AES arms (verdict-on-null-first).
    - Multiple comparisons across ablation and graded rounds — one primary
      statistic frozen (AES−control ACCEPT gap at r=5).

  interpretation_limits:
    - Toy tier, reduced-round only (RQ-AES-003 R6/R7). No full-round claim.
    - Published-frontier comparisons UNADJUDICABLE in both directions (R3).
    - Related-key / known-key variants never complete under this RQ.
    - Standing user authorisation covers proposal only; no experiment approval.

  heuristic_assumptions:
    - id: HEUR-FP1
      statement: >-
        On a matched 10-round AES control, the friend-pair certificate F_fp
        behaves like an approximately independent rare event whose rate is
        governed by the exchange pattern's random model (imitating a uniform
        random permutation's active-diagonal occupancy), so joint ACCEPT
        rate ≈ rate(P_RD)×rate(F_fp) up to small dependence.
      rigorous_support: >-
        Exchange-group orbit counting on inactive/active diagonals (POINTER
        KN-LIT-6976); independence is the classical random-permutation
        heuristic, not a theorem for AES.
      validation_plan: >-
        Measure rate(P_RD), rate(F_fp), rate(P_RD AND F_fp) on >=16 control
        keys; test multiplicative prediction within pre-registered relative
        error. Small-AES (w=4) optional pilot before AES-128 spend.
      falsification_condition: >-
        Control joint rate differs from product by >3× beyond sampling error
        at the frozen budget — dependence model fails; joint thresholds void.
    - id: HEUR-FP2
      statement: >-
        On AES-128 at r=5, F_fp is positively associated with P_RD (friend
        witnesses more frequent when the related-differential structure is
        present) relative to the control association.
      rigorous_support: >-
        Structural analogy to Shin's reported friend-pair suppression on
        boomerang patterns (POINTER KN-LIT-1424); transfer to related-
        differential pairings is the hypothesis under test, not a theorem.
      validation_plan: >-
        Stage 1 ablation ratios; association measured by odds-ratio AES vs
        control.
      falsification_condition: >-
        Odds ratio AES <= control within error — HEUR-FP2 dead; composition
        path closed for this P_RD.

  target_complexity:
    time_exponent: >-
      No asymptotic exponent claim. Target is a MEASURED CM-3 cost for the
      friend-filtered related-differential ACCEPT at r=5, compared only to
      REF-A (2^127 r-round evaluations definitional), REF-B (same P_RD
      without F_fp, measured here), and REF-C survival relative to this
      campaign's measured death rounds (full-diagonal integral dead at r=5;
      yoyo fixtures alive@5 / dead@6). Recalled Yan ACP ~2^23.32 and Shin ACC
      figures may be NAMED as provenance-recalled POINTERS only.
    memory_exponent: Measured peak RSS under CM-3; no asymptotic memory claim.
    best_known: >-
      Best known TO THIS PROGRAM for this object: none yet measured. Nearest
      internal baselines are IDEA-20260828-82676b (congruence gate) and
      GOAL-AES-003 yoyo arms — different objects.
    hidden_overhead: >-
      Friend search multiplies query cost; must be charged in CM-3, not hidden
      in "success probability only" accounting.
    tradeoff_note: >-
      Friend filter trades extra adaptive queries for lower control FPR;
      Pareto position vs REF-B is the adjudicable question.

  dominated_by: >-
    Checked against REF-A / REF-B / REF-C only. Published rows (Shin ACC, Yan
    ACP, exchange 2^88.2-style figures from KN-LIT-6976 abstract) are
    UNADJUDICABLE under R3 — dominated_by those rows is unresolvable and must
    not be written as a margin. Inside the repo: no prior IDEA measures
    friend-filtered related-differential ACCEPT with FPR + CM-3; not dominated
    by IDEA-20260828-82676b (different predicate, no friend filter).
  sota_delta: >-
    vs REF-A: no key-recovery claim; distinguisher cost << 2^127 is expected
    for any working reduced-round distinguisher and is not the interesting
    delta. vs REF-B: target is lower control FPR and/or better likelihood
    ratio than P_RD alone at matched AES rate — quantitative delta MEASURED
    in Stage 2, not asserted. vs REF-C: success = r=5 object with measured
    FPR beating the random null where the full-diagonal integral is already
    dead; NOT a claim of surviving past r=6. Published delta: UNADJUDICABLE.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    ~0.35 that Stage 1 shows preferential random suppression for at least one
    program-local P_RD; ~0.15 that the resulting CM-3 baseline is interesting
    relative to REF-B on the same machine. Not higher: transfer of Shin's
    friend-pair effect from exchanged boomerang to related-differential is
    exactly the uncertain step. Not lower: both ingredient classes have
    independent reported structure (POINTERS) and the ablation is cheap.
