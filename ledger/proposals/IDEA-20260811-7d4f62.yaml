idea:
  id: IDEA-20260811-7d4f62
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MTGT-2cabee
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  task_id: TASK-20260811-f58f22
  axis: A3
  claim_tier: toy

  title: >-
    THE PRODUCT MODEL NOBODY HAS WRITTEN DOWN -- Corrigan-Gibbs--Kogan give
    ADVICE without STRUCTURE (S*T^2 = Omega~(eps*N) for a featureless group), and
    Corrigan-Gibbs--Henzinger--Wu's 2026 STRUCTURED generic-group model gives
    STRUCTURE without ADVICE (time Omega(min{sqrt(q), 1/delta}) for an algorithm
    exploiting a delta-fraction of group ELEMENTS); the isogeny class is
    structure on CURVES, which neither model expresses, so the honest statement
    of lane L13's question is a THIRD model -- a torsor-structured generic group
    with preprocessing, in which h encodings of Z/N are linked by a Step oracle
    implementing the class-group action -- and this record specifies that model,
    states the bound it should satisfy (S*T^2 = Omega~(eps*N), UNCHANGED by the
    class), names the two places the proof can fail, and supplies the nearby
    object where the bound MUST fail so that a proof proving too much is caught

  class: mechanism

  claim: >-
    (A) THE GAP, STATED PRECISELY, BECAUSE IT IS THE ONLY REASON THIS RECORD
    EXISTS. The corpus holds two lower-bound frameworks and they are disjoint in
    exactly the wrong way.
      KN-LIT-013 (Corrigan-Gibbs, Kogan, EUROCRYPT 2018): generic group of prime
        order N, S bits of advice about it, online time T, success eps. Then
        S*T^2 = Omega~(eps*N). No structure of any kind is available to the
        algorithm.
      KN-LIT-7606 (Corrigan-Gibbs, Henzinger, Wu, 2026, "The Structured
        Generic-Group Model"): any DL algorithm that exploits the structure of at
        most a delta fraction of group ELEMENTS runs in time
        Omega(min{sqrt(q), 1/delta}); the paper also states lower bounds against
        algorithms exploiting the multiplicative structure of smooth integers, of
        smooth polynomials, and of elliptic-curve points. No advice.
      THE ISOGENY CLASS IS NEITHER. Its structure is not a property of a subset
      of group elements -- every element of every member behaves identically --
      and it is not absent structure either. It is structure on the SET OF
      ENCODINGS: h of them, indexed by a torsor, linked by efficiently computable
      isomorphisms. delta as CGHW define it is 0 for the isogeny class, so their
      theorem gives Omega(sqrt(q)) and says nothing about advice; CGK's theorem
      applies to each encoding separately and says nothing about the link. Lane
      L13's question falls exactly in the hole between them.

    (B) THE MODEL, SPECIFIED. TORSOR-STRUCTURED GENERIC GROUP WITH PREPROCESSING,
    written TS-GGM-P(N, h).
      OBJECTS: a finite abelian group A of order h (the "class group") acting
        simply transitively on an index set C; for each c in C an independent
        random injective encoding sigma_c : Z_N -> {0,1}^ell.
      ORACLES, all charged one step per query:
        Op(c, x, y) -> sigma_c(sigma_c^{-1}(x) + sigma_c^{-1}(y))  [group law in
          encoding c];
        Step(c, g, x) -> (g.c, sigma_{g.c}(sigma_c^{-1}(x))) for g in a fixed
          generating set of A  [the transport oracle: it moves an element to the
          neighbouring encoding and PRESERVES THE UNDERLYING VALUE, which is
          exactly T1];
        no oracle inverts Step's index map, i.e. the algorithm is never told the
          address c of an encoding it is handed. This single restriction is what
          encodes T5's asymmetry in the model, and it is the model's whole design
          decision.
      GAME: offline, an unbounded machine sees the entire oracle transcript and
        outputs S bits. Online, c is drawn uniformly from C, x = sigma_c(1) and
        y = sigma_c(k) are given for random k, and the algorithm must output k in
        T oracle queries.
      SANITY: at h = 1 this is exactly CGK's model. With Step free and addresses
      revealed it is CGK's model on one encoding by relabelling. So the model has
      the right boundary behaviour on both sides, which is the first thing a new
      model must have and the first thing to check.

    (C) THE CONJECTURE, AND IT IS DELIBERATELY THE BORING ONE.
        In TS-GGM-P(N, h) with h <= N, every algorithm satisfies
            S * T^2 = Omega~(eps * N),
        with no dependence on h whatsoever.
      That is, THE CLASS BUYS NOTHING, and the bound is the same one the
      featureless group already satisfies. IDEA-20260811-61ecae proves the
      matching upper bound constructively and gives a reduction that establishes
      the lower bound for algorithms that merely accept a random member; the
      model's job is to cover the algorithms that reduction does not anticipate --
      ones that query Step adaptively, interleave queries across many encodings,
      or use the advice to correlate information obtained in different encodings.
      Those are precisely the strategies a "the class is one object" attack would
      have to be, and no argument in this campaign currently excludes them.

    (D) THE TWO PLACES THE PROOF CAN FAIL, NAMED IN ADVANCE. A closure that
    cannot say where its own argument stops is a fatigue report
    (docs/inventor-protocol.md section 4), and a conjecture that cannot say where
    its proof would break is worse.
      FAILURE POINT 1 -- COMPRESSION ACROSS ENCODINGS. CGK-style bounds are proved
        by compression/presampling: advice that helps too much lets you compress
        the oracle's random table. With h encodings the table is h times larger,
        so the naive compression argument would give S*T^2 = Omega~(eps*h*N) --
        a bound h times STRONGER, which is exactly IDEA-20260807-ea3915's
        conjecture for INDEPENDENT encodings. Here the encodings are NOT
        independent: Step forces sigma_{g.c} to agree with sigma_c under the
        action, so the h tables carry only ~one table's worth of entropy plus the
        index structure. THE ENTROPY ACCOUNTING IS THE PROOF, and getting it
        wrong in either direction produces a false theorem: too generous and you
        prove the fake factor-h separation, too stingy and you prove nothing.
      FAILURE POINT 2 -- THE UNADDRESSED-INDEX RESTRICTION. The model forbids
        learning c directly. If a proof never uses that restriction, the proof
        also covers the model WITH addresses revealed -- which is a strictly
        easier problem for the adversary and is where a separation would live if
        one existed. A proof of (C) that does not use the restriction is either
        stronger than expected or wrong, and checking which is a one-line audit.

    (E) WHAT THIS DOES NOT DO, STATED FIRST RATHER THAN LAST. It does NOT
    re-litigate KN-FIND-b7e091. That finding closed the incidence and
    endomorphism-image ORACLE classes at exponent 1/2 and is binding and not
    revisited here; TS-GGM-P asks a different question (advice + class structure)
    in a model that postdates it, and its expected answer EXTENDS the closure to
    the preprocessing setting rather than reopening anything. The record also does
    not claim CGHW's model covers the isogeny class -- claim (A) says the opposite,
    and the corpus entry KN-LIT-7606 explicitly records that the paper's
    elliptic-curve result was NOT determined to cover this program's cases.

  resource_label: >-
    NONE, in the sense of lane L12 (RQ-GGMB-6eaabc) -- the record AUDITS what a
    resource can buy rather than consuming one. If TS-GGM-P is ever built, the
    resource it formalises is R8 crossed with R4, and the record's structural
    observation is that R8 as written ("multi-instance / preprocessing structure")
    and R4 as written ("acts on curves, not on points") are the SAME entry when
    the object is a class of encodings, which the taxonomy does not currently
    express. That is offered as forward guidance for a future taxonomy revision
    and is not proposed as an edit here.

  admissibility: not_applicable_model_audit

  admissibility_argument: >-
    The record proposes no algorithm and applies no isogeny to any point. It
    specifies a model and a conjecture about it. Its expected outcome is a lower
    bound, i.e. a strengthening of the admissibility filter rather than an attempt
    to pass it.

  object_first_candidate:
    tracked_object: >-
      THE ORACLE TRANSCRIPT ACROSS ALL h ENCODINGS, projected to the algorithm's
      KNOWLEDGE STATE: the set of (encoding, label, known-linear-form-in-k) triples
      it has accumulated.
    lossiness: >-
      GENUINELY LOSSY. The projection forgets the labels' actual values and the
      encodings' internal randomness, retaining only which formal linear forms in
      k the algorithm has realised in which encoding. This is the standard GGM
      knowledge state, lifted to h encodings.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED. Op adds a formal sum WITHIN an
      encoding; Step COPIES a form from one encoding to a neighbour without
      changing it. Both act on the retained part alone, so the state propagates
      deterministically, and what is discarded (label values) is discarded
      compatibly, since neither oracle's effect on the state depends on it. The
      one place lossiness is not free is the COLLISION EVENT -- two distinct forms
      receiving the same label -- and that event is exactly what a GGM proof must
      bound. Naming it is the difference between a state and a proof.
    survival_score: >-
      Survives arbitrarily many Op and Step queries. Dies at any oracle that
      returns FIELD data (an x-coordinate as an integer), which is R1 and is
      outside this model by construction -- and that boundary is the honest
      statement of what a lower bound here would and would not cover.

  mechanism: >-
    A separation needs a model in which to be stated. The lane has been arguing
    about whether the class helps, using cost accounting and simulations, and both
    of those are arguments about particular algorithms. A model plus a bound is an
    argument about all of them. The mechanism of the expected proof is the standard
    presampling/bit-fixing route (Coretti-Dodis-Guo, cited by KN-LIT-013 as the
    generalisation of CGK's technique), applied to a random-oracle-like object
    whose h components are LINKED by the action -- and the linking is the only new
    ingredient, which is why failure point 1 is where the whole thing is decided.

  why_not_a_renamed_known_approach: >-
    (1) IDEA-20260807-ea3915 defines an M-GROUP preprocessing model over M
      INDEPENDENT encodings and conjectures S*T^2 = Omega~(eps*M*N) there,
      concluding that the isogeny class achieves N(1+o(1)) for all M and so
      "separates" by a factor M. This record's model has the encodings LINKED
      rather than independent, has a random challenge index that is not revealed,
      and conjectures NO dependence on h at all. ea3915's factor-M is, in this
      record's reading, a statement about how much easier independent encodings
      are -- a fact about the null object, not about the class. The two records
      make different conjectures and a reviewer can reject either alone; where
      they touch, this record predicts ea3915's separation is an artifact of
      choosing independent encodings as the comparison class, and says so in the
      open rather than quietly.
    (2) KN-FIND-b7e091 and KN-LIT-7606 both classify STRUCTURE without advice.
      This model is the product with advice, which neither expresses.
    (3) IDEA-20260811-61ecae gives a reduction that yields the lower bound for
      one strategy class. The model covers all strategies. A reduction is not a
      model and the record does not pretend the two are interchangeable.

  predictions:
    - observable: boundary behaviour of the model
      metric: >-
        whether TS-GGM-P(N, 1) is literally CGK's model, and whether TS-GGM-P with
        free Step and revealed addresses is CGK's model up to relabelling
      direction: different
      minimum_effect: >-
        Both must hold exactly. A model that does not reduce to the known one at
        its boundary is mis-specified and must be fixed before any bound is
        attempted. This is a zero-compute check and it is the first gate.
    - observable: the entropy accounting of failure point 1
      metric: >-
        the number of independent random bits in the h linked encodings, computed
        exactly for the model as specified
      direction: different
      minimum_effect: >-
        Must come out as one encoding's worth plus O(h log h) for the index
        structure, NOT h encodings' worth. If it comes out as h encodings' worth,
        the Step oracle has been specified wrongly (it is not preserving values)
        and the model does not describe an isogeny class.
    - observable: use of the unaddressed-index restriction
      metric: >-
        whether the attempted proof of (C) invokes the restriction, yes or no
      direction: different
      minimum_effect: >-
        Binary and decisive. "No" means the bound also covers the addressed model,
        which is a stronger claim than expected and must be re-derived rather than
        celebrated.
    - observable: the nearby object
      metric: >-
        whether the same proof technique also proves a bound for the model with
        Step replaced by an oracle that does NOT preserve values (i.e. h
        independent encodings)
      direction: different
      minimum_effect: >-
        IT MUST GIVE A DIFFERENT ANSWER, namely the h-fold stronger bound of
        ea3915. A technique that gives the same answer in both is not sensitive to
        the linking and therefore is not proving anything about isogeny classes.

  minimal_test:
    design: >-
      ENTIRELY ZERO COMPUTE. This is a theory proposal and its minimal test is a
      sequence of paper checks, in order, each of which can end it:
      STEP 1 (an hour): write the model down formally and verify both boundary
        reductions of prediction 1.
      STEP 2 (an hour): compute the entropy of the linked encodings exactly
        (prediction 2). If it is h encodings' worth, stop -- the model is wrong.
      STEP 3 (a day): attempt the presampling/compression argument for (C),
        recording at each step whether the linking or the unaddressed-index
        restriction is used.
      STEP 4 (an hour, BLOCKING): run the same argument on the independent-encoding
        model and confirm it gives a DIFFERENT bound (prediction 4). If it gives
        the same bound, discard steps 1-3.
      STEP 5 (an hour): read KN-LIT-7606's actual theorem statements to determine
        whether their delta-framework can be made to cover encoding-set structure
        after all, which would make this whole model unnecessary -- the cheapest
        possible way for this record to be superseded, and it is listed as a step
        rather than hidden as a caveat.
      NO EXPERIMENT IS PROPOSED AND NONE WOULD SETTLE ANYTHING, which is stated
      plainly rather than dressed up with a toy simulation that could not
      distinguish the outcomes.
    controls:
      - >-
        NULL OBJECT (BLOCKING, AND IT IS STEP 4): the independent-encoding model,
        i.e. TS-GGM-P with Step replaced by an oracle that hands out a fresh
        unrelated encoding. The proof technique must distinguish the two models.
        A technique that does not is measuring its own generality.
      - >-
        BOUNDARY CONTROL: h = 1 must reproduce CGK exactly.
      - >-
        ADDRESSED-MODEL CONTROL: revealing c must make the model collapse to CGK
        by relabelling, and the proof must be able to see that it does.
    required_metrics:
      - the written model, with both boundary reductions verified
      - the exact entropy count of the linked encodings
      - a per-step record of which hypotheses the attempted proof used
      - the independent-encoding comparison bound
      - a determination of whether CGHW's delta framework subsumes the model

  controls:
    - Independent-encoding null model (blocking).
    - h = 1 boundary reduction.
    - Address-revealed collapse check.

  confounders:
    - >-
      MODEL-BUILDING IS UNFALSIFIABLE IF DONE BADLY. A model can always be tuned
      until the desired bound holds. The defence is that the model's boundary
      behaviour is fixed in advance (predictions 1 and the two boundary controls)
      and the conjectured bound is the BORING one -- no dependence on h -- so
      there is nothing to tune toward.
    - >-
      THE MODEL MAY BE TOO WEAK TO BE INTERESTING. If Step is charged one query and
      preserves values exactly, the model may be visibly equivalent to CGK by a
      two-line relabelling, in which case the record's content collapses to that
      two-line argument. THAT IS AN ACCEPTABLE AND LIKELY OUTCOME and it should be
      written down as such rather than avoided by complicating the model.
    - >-
      A LOWER BOUND IN THIS MODEL SAYS NOTHING ABOUT REAL CURVES. Index calculus
      over small-degree extension fields is a genuine non-generic algorithm and is
      precisely why CGHW's model exists (KN-LIT-7606's own scoping note). Any
      bound proved here is a bound against algorithms that treat the encodings
      generically, and the phrase must appear in every summary.
    - >-
      RELAYED PREMISES. Both KN-LIT-013 and KN-LIT-7606 are corpus entries whose
      notes state the full papers were not read. The model is being designed
      against summaries, and step 5 exists because of that.

  falsification_conditions:
    - >-
      The entropy count of step 2 comes out as h independent encodings. The model
      does not describe an isogeny class and must be respecified.
    - >-
      The proof technique fails to distinguish the linked and independent models
      (step 4). The technique is insensitive to the only structure in question and
      the record's approach is void.
    - >-
      CGHW's delta framework turns out to cover encoding-set structure (step 5).
      The model is unnecessary and the record is superseded by a citation, which
      is the cheapest and most welcome way for it to end.
    - >-
      A bound with genuine h-dependence is proved in the model. Then the class DOES
      buy something in the generic setting, IDEA-20260811-61ecae's tightness claim
      is contradicted, and this becomes the most important result in the campaign
      -- and would require independent replication before any interpretation.
    - >-
      The model is shown equivalent to CGK by relabelling. The conjecture is true
      trivially and the record's value drops to its claim (A) gap analysis, which
      is still worth having in writing.

  interpretation_limits:
    - >-
      NO COMPUTE, NO MEASUREMENT, NO ATTACK, NO EXPONENT MOVED. claim_tier toy by
      the batch's convention even though nothing is measured.
    - >-
      A generic lower bound bounds generic algorithms. It cannot and does not
      bound index calculus, Semaev-based methods, or anything reading field data.
    - >-
      It does not re-litigate KN-FIND-b7e091, which is binding, and does not touch
      H-STR-002 in either direction.
    - >-
      P2: not adjacent. P3: does not fire; the record's expected output is a lower
      bound, i.e. a cost floor, not a cost reduction.

  assumptions:
    - >-
      KN-LIT-013's statement of the CGK bound and its attribution of the unified
      technique to Coretti-Dodis-Guo (presampling / bit-fixing). Relayed; the
      corpus entry states the full paper was not read.
    - >-
      KN-LIT-7606's statements: Omega(min{sqrt(q), 1/delta}) against algorithms
      exploiting a delta fraction of group elements, plus subexponential bounds
      against smooth-integer-structure algorithms and stated bounds for
      elliptic-curve points. Relayed; the corpus entry states the full text was not
      read and that whether its elliptic-curve result covers this program's
      oracles was NOT determined.
    - >-
      The isogeny class is a Cl(O)-torsor with transport preserving the underlying
      value (T1). This is what Step encodes and it is the model's only arithmetic
      input.
    - >-
      WEB VERIFICATION UNAVAILABLE THIS SESSION (backend model error on every
      WebSearch and WebFetch call). Neither KN-LIT-013 nor KN-LIT-7606 could be
      fetched. Step 5 of the minimal test is the discharge of this limitation and
      is deliberately placed inside the test rather than in a caveat.

  heuristic_assumptions:
    - id: HE-1
      statement: >-
        The presampling/bit-fixing technique that yields S*T^2 = Omega~(eps*N) for
        a single random encoding extends to a family of h encodings linked by a
        value-preserving action, with the advice's usefulness bounded by the
        entropy of ONE encoding plus O(h log h) index bits, yielding the same bound
        with no h-dependence.
      rigorous_support: >-
        NONE YET; this is the conjecture, stated as a numbered assumption because
        the record's whole content depends on it and because the batch requires
        conditional claims to name their conditions. The rigorous ingredient it
        rests on is the CGK/CDG technique itself, relayed from KN-LIT-013. The
        classical pattern it imitates is the standard reduction of a structured
        random object to an unstructured one when the structure is a deterministic
        function of a smaller seed -- here, h encodings generated from one plus an
        action.
      distribution_imitated: >-
        The random-oracle/random-encoding heuristic already assumed by every GGM
        argument in this corpus, extended to a family.
      validation_plan: >-
        NOT A SAMPLING QUESTION AND NO SAMPLING IS PROPOSED. The validation route
        is the four-step paper sequence of the minimal test, whose step 4 (the
        independent-encoding null) is the falsifier. Where a proposal's honest
        validation route is a proof attempt, saying so is better than attaching a
        toy simulation that could not distinguish the outcomes, and this record
        does the former.
    - id: HE-2
      statement: >-
        Charging Step at one query per step is the right cost model, i.e. an
        isogeny step is no cheaper and no more expensive than a group operation up
        to polylog factors.
      rigorous_support: >-
        For small ell and sqrt-elu the per-step field-operation count is polylog,
        the same order as a group operation; this is HA-3 of
        IDEA-20260811-61ecae and inherits its status. The assumption matters
        because a model that charges Step at zero would be modelling a class in
        which transport is free, which is a different and easier object.
      distribution_imitated: none; a cost-model choice.
      validation_plan: >-
        Inherited from HA-3 of IDEA-20260811-61ecae (instrumented Velu step with a
        field-operation counter); no separate measurement is proposed so that one
        measurement is not double-counted as two validations.

  proof_search_map:
    bottleneck: >-
      The entropy accounting for h linked encodings (failure point 1). Every other
      step of a CGK-style proof is expected to transfer mechanically; this is the
      one step that is genuinely new and it determines whether the answer is
      "no h-dependence", "factor h", or "no bound".
    baseline_embedding:
      parameter_slice: >-
        h = 1. TS-GGM-P must BE Corrigan-Gibbs--Kogan's model, not merely resemble
        it, and the conjectured bound must reduce to theirs verbatim.
      reproduction_check: >-
        Symbolic, and it is minimal-test step 1. A model that only resembles the
        baseline at its boundary is not an extension of it. Second slice: Step
        free and addresses revealed must collapse to CGK by relabelling -- a curve
        on a plot that looks similar is not an embedding, and neither is a model
        that "morally" contains another.
    observation_collision:
      observable: >-
        The algorithm's knowledge state -- the set of formal linear forms in k it
        has realised, tagged by encoding.
      distinct_preimage_search: >-
        REQUIRED AND IT IS THE CRUX. Two distinct ground-truth objects with the
        same observable: (i) the linked family, where a form realised in encoding c
        is simultaneously realised in every encoding reachable by Step; and (ii)
        the independent family, where it is not. IF THE KNOWLEDGE STATE CANNOT TELL
        THEM APART, the proof cannot either, and any bound it produces applies to
        both -- which contradicts ea3915's factor-h conjecture and one of the two
        records is then wrong. Locating this collision is why the independent-
        encoding null is blocking and why it is listed as a proof obligation rather
        than a nicety.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track not the knowledge state per encoding but the state MODULO the
          action -- i.e. the quotient by the torsor -- which is the state that
          survives Step and is therefore what recursion sees.
        predicted_gain: >-
          If the quotient state is what the bound depends on, the h-dependence
          disappears by construction and the conjecture follows; if it is not, the
          gap is exactly where a separation would live. Either way the transform
          localises the question to one object.
      - transform: representation_reduction
        proposed_object: >-
          Re-express the h linked encodings as ONE encoding plus an index map, so
          that the preprocessing bound applies to the single encoding and the index
          map is charged separately.
        predicted_gain: >-
          Reduces the model to CGK plus an addressing problem, which is precisely
          the decomposition IDEA-20260811-61ecae uses algorithmically. If the
          reduction is exact, the model's answer is CGK's and the record ends
          quickly and cleanly.
    quantifier_order: >-
      CONJECTURE (C), WRITTEN OUT: FORALL N, FORALL h <= N, FORALL algorithms
      (S, T) in TS-GGM-P(N, h), the success probability eps over the random
      encodings, the random index c, the random k and the algorithm's coins
      satisfies eps = O~(S*T^2 / N).
      NOTE WHICH VARIABLE IS AVERAGED: eps averages over c. A per-index statement
      ("for every c...") is FALSE and must not be claimed, because advice can
      trivially solve one designated index -- store k for it. That the bound can
      only be average-case over the class is a real feature of the model and it is
      recorded here rather than discovered later.
      THE DANGEROUS SLIP, NOT CLAIMED: "FORALL advice EXISTS an index that is
      hard", which is trivially true and empty.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Against algorithms that access h linked encodings only through the group
        law and a value-preserving transport oracle, advice obeys the same
        S*T^2 = Omega~(eps*N) tradeoff as for a single group." It can NEVER
        certify anything about algorithms reading curve equations or
        x-coordinates as field elements (R1, R2), about non-uniform families with
        structure beyond the model's oracles, or about quantum adversaries.
      nearby_object_control: >-
        THE OBJECT WHERE THE CONCLUSION MUST FAIL: the same model with h
        INDEPENDENT encodings and no value-preserving link. There, advice about
        one encoding is useless for another, the effective advice per encoding is
        S/h, and the bound should degrade to S*T^2 = Omega~(eps*h*N) -- exactly
        ea3915's conjecture. A proof technique that yields the same bound for both
        models has not identified the load-bearing structure and is void.
    proof_obligations:
      - claim: TS-GGM-P(N, 1) equals CGK's model.
        responsibility: baseline
      - claim: Address-revealed TS-GGM-P collapses to CGK by relabelling.
        responsibility: baseline
      - claim: The h linked encodings carry one encoding's entropy plus O(h log h).
        responsibility: size
      - claim: The presampling argument transfers to the linked family.
        responsibility: feasibility
      - claim: The technique yields a DIFFERENT bound on the independent family.
        responsibility: strictness
      - claim: The bound is average-case over c and cannot be per-index.
        responsibility: scope
      - claim: The model charges Step at a rate consistent with real isogeny costs.
        responsibility: interface
    not_applicable_reason: null

  reachability_gate: >-
    THE MODEL ENCODES THE GATE AS A DESIGN DECISION, WHICH IS THE POINT OF WRITING
    A MODEL AT ALL. Step is cheap (one query) and moves to a NEIGHBOUR; the
    address of the encoding you are handed is never revealed. That pair of choices
    is T5 in two lines: random transport cheap, specified transport not directly
    available. Every alternative modelling choice corresponds to a different
    reading of T5 and can be explored by varying the model rather than by
    arguing -- an address oracle models "vectorization is easy", a Step oracle
    charged at sqrt(h) models "the concrete gate fails". Making the gate a
    parameter of the model instead of a caveat in a proposal is this record's
    second contribution after claim (A).

  target_complexity:
    time_exponent: >-
      No algorithm; no exponent claimed. The conjectured bound fixes the achievable
      online exponent at tau with S = N^{1-2tau}, i.e. the SAME frontier as the
      unstructured group, and the record's content is the word "same".
    memory_exponent: >-
      Advice S, unconstrained by h in the conjecture; that independence IS the
      claim.
    best_known: >-
      CGK S*T^2 = Omega~(eps*N) with no structure (KN-LIT-013); CGHW
      Omega(min{sqrt(q), 1/delta}) with structure and no advice (KN-LIT-7606);
      Shoup Omega(sqrt(N)) with neither (KN-TECH-005). Nothing known to this
      session covers both at once, which is claim (A).
    hidden_overhead: >-
      The Omega~ hides log factors that CGK's paper specifies and this session
      could not read. The model hides, in HE-2, the assumption that an isogeny step
      is comparable to a group operation -- an assumption that a127ab's concrete
      analysis found badly violated for large ell, and which is only defensible for
      the small-ell walks this campaign's constructions use.
    tradeoff_note: >-
      The conjecture is precisely a statement that the tradeoff CURVE is unchanged
      by the class, so the whole record is a tradeoff statement and has no
      operating point of its own.

  sota_delta: >-
    ZERO. No attack, no speedup, no exponent. Its quantitative content, if the
    conjecture is proved, is the number 0 -- the coefficient of log h in the lower
    bound's exponent -- and stating that a coefficient is zero is a result only
    because two published models leave it undetermined.
  dominated_by: >-
    AS AN ATTACK: n/a (no result claimed). Frontier rows checked for honesty:
    parallel rho 0.886*sqrt(N)/O(1) memory (KN-TECH-001, KN-TECH-006);
    automorphism-discounted rho (KN-TECH-018); BSGS sqrt(N)/sqrt(N),
    N^{2/3+o(1)} full cost (KN-TECH-031, KN-TECH-035); CGK/Bernstein-Lange
    preprocessing frontier (KN-LIT-013); Kuhn-Struik sqrt(M*N).
    AS A MODEL: dominated by KN-LIT-7606 on generality wherever that paper's
    delta-framework applies -- and minimal-test step 5 exists to determine whether
    that is here. If it is, this record is dominated outright and should be
    superseded by a citation. Recording the condition under which the record is
    worthless is cheaper than defending it later.

  estimated_cost:
    implementation: none (no code).
    compute: none (zero runs, zero CPU).
  recommended_priority: >-
    medium. It is the batch's cleanest theory target and needs no compute at all,
    but it is also the item most likely to be dominated by literature this session
    could not read, and step 5 should be run before steps 1-4 if a reviewer has
    web access.

  honest_prior_of_survival: >-
    0.60 that the model as specified is not trivially equivalent to CGK by
    relabelling (if it is, the record collapses to a two-line argument, which is a
    fine outcome and not a failure). 0.50 that the presampling argument transfers
    and gives the conjectured h-independent bound. 0.85 that whatever it gives, it
    correctly distinguishes the linked from the independent family (step 4). 0.30
    that CGHW's framework already subsumes the question, in which case the record
    is superseded by a citation. 0.05 that a genuine h-dependence is found, which
    is the only branch in which the campaign gains an attack-relevant lead and is
    priced accordingly low.

  novelty_status: unverified

  novelty_screen:
    performed_on: '2026-08-11'
    corpus_screened: >-
      Read in full: KN-LIT-7606 (The Structured Generic-Group Model, 2026) and
      KN-LIT-013 (CGK), including their "Not verified here" sections, both of
      which record that the full papers were not read. Read: KN-TECH-005. Read in
      full: IDEA-20260807-a2fb45; read by title and abstract: IDEA-20260807-ea3915
      (the M-group model, this record's nearest neighbour and its explicit
      disagreement). grep of ledger/proposals/ for generic group model|simulator|
      structured GGM|presampling|bit-fixing: matches are simulability arguments in
      the KN-FIND-b7e091 lineage (lane L12), none of which involves advice.
      DECOMPOSITION.md L12 and L13 read in full.
    external_screen: >-
      NOT PERFORMED (WebSearch and WebFetch failed on every attempt with a backend
      model error). This is the record most exposed by that failure after
      IDEA-20260811-68fa90, since the entire proposal is "these two published
      models do not compose, so write the composite" and a composite may already
      exist. Minimal-test step 5 is that check and is the first thing a reviewer
      with web access should do.
    verdict: >-
      UNVERIFIED. Internally, no record in the 146-proposal corpus specifies a
      preprocessing model with structured, linked encodings; ea3915 specifies the
      independent-encoding variant and is discriminated below. Externally nothing
      is established and no priority is claimed.

  discriminated_from:
    - >-
      IDEA-20260807-ea3915 -- THE NEAREST RECORD. It defines advice-based DLP over
      M INDEPENDENT encodings and conjectures S*T^2 = Omega~(eps*M*N) there, then
      exhibits the isogeny class as achieving N(1+o(1)) for all M, a factor-M
      separation whose content is "these encodings are efficiently isomorphic".
      This record keeps the encodings LINKED inside the model, hides the challenge
      index, and conjectures NO h-dependence -- and it explicitly predicts that
      ea3915's factor-M is a property of its comparison class rather than of the
      isogeny class. The two are in tension, both are filed as proposals, and the
      independent-encoding null (step 4) is exactly the check that decides between
      them. Naming a disagreement with an existing proposal is more useful than
      finding a formulation that avoids it.
    - >-
      IDEA-20260807-a2fb45 -- a two-way SIMULATION for one instance with the path
      given, concluding the achievable frontier is class-invariant. That is an
      argument about algorithms; this is a model in which to quantify over them.
      a2fb45's OPEN-4 (non-classical models) is adjacent but not this.
    - >-
      IDEA-20260811-61ecae (this batch) -- gives a reduction that carries the CGK
      bound into the adaptive class problem for algorithms that accept a random
      member. This record covers the strategies that reduction does not anticipate
      (adaptive Step use, cross-encoding correlation). If 61ecae's reduction is in
      fact fully general, this record is unnecessary, and that possibility is
      stated rather than obscured.
    - >-
      KN-FIND-b7e091 and lane L12 -- oracle simulability without advice, binding
      and NOT revisited. This is the advice-bearing question in a model that
      postdates the finding, and its expected answer extends the finding.
    - >-
      KN-LIT-7606 -- structure without advice, with delta counted over group
      ELEMENTS. Claim (A) is precisely the argument that delta = 0 for an isogeny
      class, so the paper's theorem is silent here; if that reading of the paper is
      wrong, step 5 finds out and the record is superseded.

