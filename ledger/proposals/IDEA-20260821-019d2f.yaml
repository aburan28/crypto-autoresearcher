idea:
  id: IDEA-20260821-019d2f
  question_id: RQ-MLKEM-001
  added: '2026-08-21'
  title: >-
    How many of FIPS 203's 128 rank-2 NTT slots must an attack hold JOINTLY before it can see
    anything? Two thresholds, both computable, and the gap between them is a measured quantity
    about the CRT decomposition: r_info = ceil(H(s)/(2 log2 q)) ~ 23 slots by pigeonhole, versus
    r_alg ~ 45 slots before the S-slot DUAL FUNCTIONAL LATTICE contains a vector short enough to
    bias <v,s> above a declared convention -- with the CBD characteristic function cos^{2eta}
    giving the bias in closed form, and a ring-deleted random-matrix null that can void the whole
    reading
  class: representation
  claim: >-
    (A) THE STRUCTURAL FACT THE LANE HAS NEVER TRACKED. q = 3329 = 13*2^8 + 1, so Z_q contains
    primitive 256th roots of unity but not 512th, and x^256 + 1 splits over F_q into 128
    IRREDUCIBLE QUADRATICS -- FIPS 203's NTT has 128 rank-2 CRT slots, not 256 rank-1 ones, and
    each slot is a copy of F_{q^2}. (The irreducibility is not incidental: with zeta a primitive
    256th root of unity, zeta = g^13 for a generator g, so every zeta^{2i+1} = g^{13(2i+1)} has odd
    discrete log and is a quadratic non-residue; hence every factor x^2 - zeta^{2i+1} is
    irreducible and every slot is a field.) Twenty-six existing proposals in this lane cover
    isometry orbits, per-coordinate likelihoods, compression cells, weak keys, failure oracles,
    quantum routes, crossovers, best-of-M and dense-CBD hybrids. NONE takes the half-splitting
    itself as an object.
    (B) THE OBJECT. For a subset S of the 128 slots with |S| = r, the projection pi_S : R_q ->
    prod_{i in S} F_{q^2} is reduction modulo f_S = prod_{i in S}(x^2 - zeta_i), a RING
    HOMOMORPHISM: it commutes with every operation ML-KEM performs on ring elements. Track
    pi_S(s), the r-slot CRT image of the secret. This is the natural object for any attack that
    would decompose ML-KEM along its own CRT structure -- and the question nobody has asked is how
    wide r must be before pi_S(s) carries anything.
    (C) TWO THRESHOLDS, AND THEY ARE NOT THE SAME NUMBER.
    r_info, the PIGEONHOLE floor: the image has capacity 2r*log2(q) = 23.401r bits, while a CBD_eta
    secret polynomial carries H = 256*h(eta) bits with h(2) = 2.0306 and h(3) = 2.3333 bits per
    coefficient, i.e. 519.8 and 597.3 bits. So r_info = ceil(H/23.401) = 23 slots for eta = 2 and
    26 for eta = 3. Below r_info the image cannot determine s at all.
    r_alg, the ALGORITHMIC floor AS MEASURED BY A DECLARED PROCEDURE: an attack does not read
    pi_S(s) directly, it reads F_q-linear functionals of it. The functionals that factor through
    pi_S are exactly the F_q-span of the rows of the reduction-mod-f_S matrix E_S (2r x 256), and
    their integer lifts form the DUAL FUNCTIONAL LATTICE L_S = {v in Z^256 : v mod q in
    rowspace(E_S)}, of dimension 256 and volume q^{256-2r}. For v in L_S the bias of <v,s> mod q
    against uniform is EXACTLY prod_j cos^{2eta}(pi v_j / q), because that is the characteristic
    function of CBD_eta evaluated at 2 pi v_j / q. So "what can r slots see" has a closed-form
    answer parameterised by the shortest vector of L_S -- as found by a declared reducer at a
    declared budget, and against a declared bias convention.
    (D) THE FALSIFIABLE CLAIM, WITH NUMBERS DERIVED BEFORE ANY RUN. Under the Gaussian heuristic,
    lambda_1(L_S) ~ sqrt(256/(2 pi e)) * q^{(256-2r)/256} = 3.8586 * 3329^{(256-2r)/256}.
    Setting that below q gives r > 21.3 -- below about 22 slots L_S contains no vector shorter than
    the trivial q*e_j and there is no nontrivial functional at all. Setting it below the length
    q/(pi*sqrt(2*eta/2)) at which the bias reaches e^{-1} -- about 749 for eta = 2 -- gives
    r ~ 45. THE CLAIM: r_alg is about twice r_info, the gap is about 22 slots, and the gap is a
    property of the CRT decomposition rather than of any particular attack.
    WHAT THE MEASUREMENT WOULD LICENSE, STATED IN THE ONLY FORM IT IS ENTITLED TO. The E1 outcome
    licenses exactly this and nothing wider: "at the declared blocksize budget and the declared
    bias convention, no slot subset below r_alg in the four families tested admitted an
    above-threshold functional." That is a statement about four sampled families under one
    reducer at one budget, and it is deliberately narrow. NO FORECLOSURE OF ANY ATTACK CLASS IS
    CLAIMED, and an earlier draft of this record that did claim one -- "must work in a space of
    size at least q^{2 r_alg}, which forecloses slot-local, per-slot and small-window
    divide-and-conquer strategies" -- is WITHDRAWN. It contradicted this record's own
    interpretation_limits and it used the record's own bound in the wrong direction: r_alg as
    measured is an UPPER bound on the true threshold (a stronger reducer can only find shorter
    vectors, hence a smaller r_alg), so nothing below it is excluded. It also mistook the SIZE of
    a space for a COST: a distinguisher whose bias B sits below the declared convention is not
    unusable, it merely needs on the order of B^{-2} samples, and that accounting is deliberately
    not done here (assumptions[4]). Premature closure is a failure mode symmetric with
    overclaiming (docs/inventor-protocol.md section 4), and the withdrawn sentence was this
    record's headline.
    (E) THE OTHER OUTCOME, WHICH IS THE INTERESTING ONE. All of (D) assumes lambda_1(L_S) is
    governed by volume alone. It need not be: L_S is built from a HIGHLY STRUCTURED matrix (a
    Vandermonde-type evaluation map), not a random one, so the standard leftover-hash and
    Gaussian-heuristic arguments do not apply to it. If some slot family -- butterfly-aligned
    subsets (the leaves under one node of the NTT tree, for which f_S = x^{2^j} - c), or subsets
    closed under the Galois action zeta -> zeta^j -- has systematically shorter lambda_1 at equal
    r than random subsets and than a ring-deleted random-matrix null, then there is a PREFERRED
    slot decomposition of ML-KEM, r_alg is family-dependent, and that is the first structure-using
    handle this lane would have found.
    (F) NOT CLAIMED. No attack, no break, no speedup, no exponent moved, AND NO LOWER BOUND ON ANY
    ATTACK. Every number in (C) and (D) is the proposer's arithmetic on FIPS 203 constants and on
    the Gaussian heuristic, performed 2026-08-21; NONE is a measurement and none is read from a
    committed run. The Gaussian heuristic is exactly what the experiment tests, so quoting it as
    fact would defeat the purpose. No claim about what the literature contains. No direction
    declared impossible, and in particular no attack family is declared foreclosed.
  mechanism: >-
    STAGE 0 (closed form, minutes, no lattice). Verify from FIPS 203 constants that q - 1 = 2^8*13,
    that x^256+1 has 128 irreducible quadratic factors mod q, and that zeta^{2i+1} is a non-residue
    for every i. Compute h(eta) exactly for the CBD alphabets (eta=2: probabilities
    (1,4,6,4,1)/16; eta=3: (1,6,15,20,15,6,1)/64), hence H and r_info per parameter set. Also
    compute q^2 - 1 = 3328*3330 = 2^9*3^2*5*13*37 and record that every slot's multiplicative group
    is 37-smooth -- recorded as an observation for the corpus, not used by this proposal.
    DECLARE, BEFORE ANY MEASUREMENT: the bias convention (bias > e^{-1}) that defines r_alg, the
    reducer and its blocksize budget, and the fact that both make r_alg a procedure-relative and
    UPPER-bound quantity. No statement about attacks may be composed from it.
    STAGE 1 (the dual functional lattice, the core measurement, cheap). For r = 8, 16, 22, 24, 32,
    40, 45, 48, 56, 64 and for four slot families -- (F1) uniformly random subsets, (F2)
    butterfly-aligned subsets (all leaves under one node of the NTT tree, so f_S = x^{2^j} - c),
    (F3) Galois-orbit-closed subsets (closed under zeta_i -> zeta_i^j for j in a fixed subgroup of
    (Z/512)^*), (F4) contiguous runs in bit-reversed slot order as FIPS 203 stores them -- build
    E_S by reducing the monomial basis modulo f_S, construct the q-ary lattice L_S in its standard
    basis, and run LLL then BKZ at a declared blocksize ladder. Record the shortest vector found,
    its length, and the EXACT bias prod_j cos^{2eta}(pi v_j / q) computed from its integer entries.
    Repeat over at least 16 independent subset draws per (r, family) cell so every reported value
    is an interval and not a point.
    STAGE 2 (the ring-deleted null, and it can fail). For each (r, family) cell, build a matched
    null: a UNIFORMLY RANDOM 2r x 256 matrix over F_q in place of E_S, giving a q-ary lattice of
    IDENTICAL dimension and IDENTICAL volume q^{256-2r} but with no ring, no CRT and no Vandermonde
    structure. Run the identical LLL/BKZ pipeline with the identical budget. The Gaussian heuristic
    predicts the SAME lambda_1 in both arms; that is the forced value, derived before the run. Any
    systematic difference is the finding. The null is drawn at least 16 times per cell and reported
    as an interval, with the leave-one-out false-positive rate of the "outside the interval" rule
    derived in advance (exactly 2 of n draws land outside an n-draw min/max interval when the draws
    are distinct: 2/16 = 12.5%), per KN-TECH-1a5b7e mode 5.
    STAGE 3 (sensitivity, so the instrument is known to be able to move). Graded control: replace
    E_S by a matrix that interpolates between the true evaluation matrix and a random one, at
    mixing parameter t in {0, 0.25, 0.5, 0.75, 1}, and report whether the measured lambda_1 is
    MONOTONE in t across at least three interior points. Two endpoints do not give a direction. If
    the statistic is non-monotone, no directional reading ("structure shortens vectors") may be
    attached to any Stage-2 verdict.
    STAGE 4 (tie the lattice measurement back to information). For the same cells, estimate the
    statistical distance between pi_S(s) for s ~ CBD_eta and the uniform distribution on
    (F_{q^2})^r, using the Poisson-summation bound sum over nonzero v in L_S/qZ^256 of prod_j
    cos^{2eta}(pi v_j/q), truncated to the LLL/BKZ-enumerated short vectors and reported as a LOWER
    bound on non-uniformity together with the enumeration radius used. Compare the r at which this
    lower bound crosses a pre-declared threshold against r_info and against r_alg. A crossing at
    r < r_info would contradict the pigeonhole bound and would mean the estimator is broken.
    STAGE 5 (OPTIONAL, AND THE ONLY ROUTE TO ANY COST STATEMENT). If a cost floor over the tested
    family is wanted rather than a bias curve, it must be earned by sample-count accounting that
    this record does not currently do: for each measured functional of bias B, compute the number
    of independent evaluations a distinguisher would need (order B^{-2}), compare it against the
    k*256 equations one ML-KEM key supplies plus whatever re-randomisation is available, and report
    the resulting cost per cell. ANY SUCH FLOOR IS OVER THE TESTED FAMILY AND THE TESTED BUDGET
    ONLY, NEVER OVER ATTACKS, because the sampled families are not an enumeration and the reducer's
    output is an upper bound on lambda_1. Without Stage 5 the deliverable is a bias curve and a
    threshold, and no number in it is a cost.
    WHY THE EXPLANATIONS SEPARATE. E1 (VOLUME-ONLY): lambda_1 agrees across all four families and
    with the random-matrix null within the 16-draw intervals, at every r. Then the CRT
    decomposition contributes nothing beyond counting, r_alg is family-independent, and the
    deliverable is the measured gap r_alg - r_info in slots -- a measured quantity with forward
    guidance ("what remains open is joint treatment of >= r_alg slots, non-CRT projections
    entirely, and the sample-count accounting of Stage 5 that would be needed before any cost
    statement could be made"), and an obstruction record whose scope is the four tested families at
    the tested budget. E2 (STRUCTURE-DEPENDENT): some family has lambda_1 systematically below the
    null's interval at equal r and equal volume. Then FIPS 203's NTT has a preferred decomposition,
    r_alg depends on which slots you take, and the shortest vector found IS an explicit small-bias
    functional of the ML-KEM secret that the lane can price directly.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant, answers
      nothing) and NO SHELL is available, so every corpus search below was run with the Grep
      (ripgrep) tool and is recorded as a pattern and a path.
      GREPS RUN:
      (1) 'rank-2 slot|rank 2 slot|128 slot|quadratic factor|incomplete NTT|slot marginal|
      slot-tuple|statistical distance.*uniform' -i over the repository root -> 72 files, of which
      exactly three are ledger proposals: IDEA-20260816-bd49b9, IDEA-20260813-28cf9c (the
      CRT-rank-deficient SampleNTT matrices record, which matches on slot vocabulary), and
      IDEA-20260805-574cd0.
      (2) 'leftover hash|statistical distance|slot marginal|information-theoretic floor|entropy
      budget|joint distribution of the NTT' -i over ledger/ -> 20 files, of which 15 are proposals
      and NONE is in the ML-KEM lane except IDEA-20260805-574cd0 and IDEA-20260805-2bbfb2.
      (3) 'RQ-MLKEM-001' over ledger/proposals -> 38 files; the lane's 26 pre-extracted titles at
      scratchpad/ctx/proposals-RQ-MLKEM-001.txt WERE READ IN FULL.
      FILES READ IN FULL OR IN SUBSTANTIAL PART: ledger/proposals/IDEA-20260805-574cd0.yaml lines
      1-141 (its PART 3 proves the subfield/trace descent is a strict loss and names the classes
      the lane's inherited constraint does NOT reach); ledger/proposals/IDEA-20260805-e805b6.yaml
      excerpts; ideas/rlwe-mlwe-20260806/proposals.draft.yaml entries IDEA-20260806-35d60b and
      IDEA-20260806-e5e694 in full; knowledge/techniques/KN-TECH-1a5b7e.md in full;
      docs/inventor-protocol.md; docs/target-result-profile.md.
      WEB QUERIES RUN (WebSearch): 'how many NTT CRT slots needed statistical distance uniform
      centered binomial Kyber partial NTT information'. It returned the Kyber specification's own
      wording -- "for Kyber's prime q = 3329 with q-1 = 2^8*13 ... X^256+1 factors into 128
      polynomials of degree 2 modulo q and the NTT of f is a vector of 128 polynomials of degree
      one" -- confirming the structural fact in (A), and returned NOTHING on statistical distance,
      slot-subset thresholds, or dual functional lattices of slot projections. That is weak
      evidence of absence and is not treated as more.
      WEB PAGES FETCHED: none for this record; the structural fact is confirmed by the search
      snippet of the Kyber specification, which is quoted rather than fetched, hence the
      specification citation below is marked recalled.
      NOT DONE, AND SAID SO: no targeted search for prior work on the shortest vector of a CRT-slot
      dual lattice was run beyond the single query above.
      2026-08-21 REPAIR PASS: no new external retrieval was performed. The change below is the
      withdrawal of an unlicensed closure sentence and its replacement by the licensed form already
      present in this record's own method_ceiling; it rests on no source not already listed.
    results: >-
      The lane's 26 proposals contain no record that takes the 128 rank-2 slots as an object. The
      nearest is IDEA-20260813-28cf9c, which selects PUBLIC KEYS whose SampleNTT matrix loses rank
      in a quadratic slot and prices the resulting exact error-only equations as lattice hints --
      a weak-key selection over the MATRIX, at slot granularity, with the slot structure used only
      to locate a rare degeneracy. It measures no threshold, builds no dual functional lattice, and
      says nothing about how many slots an attack must hold. IDEA-20260805-574cd0 proves the
      subfield/trace descent (the even-coefficient projection) is a strict loss and names the
      classes its inherited constraint does not reach; the CRT-projection family it mentions in
      passing is exactly what this record quantifies, so this proposal is the CRT-family analogue
      of what 574cd0 supplied for the subfield family. IDEA-20260805-530869 proposes to BUILD the
      ring-deleted matched null as an instrument; Stage 2 here is an application of that
      instrument's principle to a new statistic and does not duplicate the instrument's
      construction. IDEA-20260805-2b94fe uses the CBD characteristic function cos^{2eta} as part of
      a per-coordinate SCORING functional for candidate errors; this record uses the same function
      for a different purpose -- the exact bias of a dual functional -- and neither result
      constrains the other.
    verdict: >-
      SPECULATIVE. The structural facts in (A) are textbook and are not claimed as novel; the
      Kyber specification states the 128-slot decomposition explicitly. What is claimed NEW
      RELATIVE TO THIS REPOSITORY: the r-slot CRT image as a tracked object; the two thresholds
      r_info and r_alg and the assertion that they differ by about a factor two; the dual
      functional lattice L_S of a slot subset as the computable carrier of r_alg; and the
      family-dependence question with a volume-matched ring-deleted null. WITHDRAWN FROM THE
      EARLIER DRAFT: the claim that the measured gap forecloses slot-local, per-slot and
      small-window divide-and-conquer strategies, and the associated q^{2 r_alg} ~ 2^{1053}
      sentence. NOVELTY AGAINST THE EXTERNAL LITERATURE IS NOT ESTABLISHED -- one web query is not
      a screen, and dual lattices of partial-NTT projections are close enough to standard
      dual-attack machinery that prior work would not be surprising. A reviewer with retrieval
      should chase the partial-NTT and "slot-restricted dual attack" literature (see the
      neighbouring draft IDEA-20260806-b37e8e, "Slot-restricted dual attack with a ring-native
      FFT", RQ-RLWE-912fdb, which is the nearest thing in this repository and is discriminated
      below).
      LABEL FORCED TO `unverified` BY RULE, NOT BY DOUBT: this record rests on citations marked
      provenance `recalled`, and AGENTS.md rule 9 (enforced by tools/validate_ledger.py
      check_citations) requires novelty_status `unverified` until such a source is actually read. The
      substantive assessment above is unchanged; what cannot be asserted is a checked literature
      negative. STRUCTURAL PREMISE VERIFIED BY COMPUTATION, not by citation: the orchestrating
      coordinator session confirmed on 2026-08-21 that x^256 + 1 has ZERO roots in F_3329 (512 does
      not divide q-1 = 3328 = 2^8 * 13, while 256 does), so the polynomial carries no linear factors
      and the FIPS 203 NTT decomposition into 128 IRREDUCIBLE QUADRATIC factors -- the 128 rank-2
      slots this record tracks -- is exact. That fact is therefore not resting on the recalled
      specification citations.
  object_first_candidate:
    tracked_object: >-
      pi_S(s), the image of the ML-KEM secret polynomial in prod_{i in S} F_{q^2} for a slot subset
      S of size r -- equivalently s mod f_S -- together with its DUAL FUNCTIONAL LATTICE
      L_S = {v in Z^256 : v mod q in rowspace(E_S)}, which is what an attack actually reads.
    lossiness: >-
      GENUINELY LOSSY BY CONSTRUCTION AND BY A COMPUTABLE AMOUNT: pi_S maps 256 F_q-coordinates to
      2r, discarding 256 - 2r of them, with fibres of size q^{256-2r}. It is emphatically not a
      change of coordinates for r < 128; at r = 128 it becomes the identity and the object
      dissolves into the original problem, which is the honest boundary case. THE DISCARD IS
      COMPATIBLE WITH THE TARGET'S OPERATIONS FOR THE STRONGEST POSSIBLE REASON: pi_S is a RING
      HOMOMORPHISM, so it commutes exactly with both operations ML-KEM performs on ring elements --
      addition and multiplication -- and the retained part propagates deterministically with no
      side information. This is the cleanest instance of the lossy-projection test available in
      this lane, and it is why the object is worth measuring even though the measurement may come
      back null.
    propagation: >-
      One step = one ML-KEM ring operation. pi_S(a*s + e) = pi_S(a)*pi_S(s) + pi_S(e), exactly, in
      prod_{i in S} F_{q^2}. The propagation law is an identity, not an approximation, and it is
      measurable by construction. What does NOT propagate is SMALLNESS: pi_S(e) is not small in any
      metric on F_{q^2}, and that is precisely the dissolution point the experiment locates
      quantitatively -- smallness survives only as the constraint that s lies in a box in the
      coefficient basis, and the dual functional lattice is exactly the instrument that measures
      how much of that box constraint an r-slot window can still feel.
    survival_score: >-
      Zero steps at r < 22, one step at r >= r_alg, and the boundary is the deliverable. The object
      is defined for every r but carries no readable information below about 22 slots (no functional
      shorter than the trivial q*e_j) and no bias above the declared convention below about 45
      (proposer's arithmetic under the Gaussian heuristic, to be measured, and both numbers are
      procedure-relative upper bounds rather than thresholds on what is possible). It never survives
      further than the first addition of a non-small error in the sense of smallness, which is why
      the interesting quantity is a threshold in r rather than a depth in steps.
  null_object_control: >-
    THE RING-DELETED VOLUME-MATCHED NULL, plus a graded sensitivity control, plus a forced value
    derived before the run.
    NULL-1 (structure deleted, volume preserved): replace the reduction-mod-f_S matrix E_S by a
    uniformly random 2r x 256 matrix over F_q. The resulting q-ary lattice has IDENTICAL dimension
    256 and IDENTICAL volume q^{256-2r}; only the CRT/Vandermonde structure is removed. FORCED
    VALUE, DERIVED BEFORE THE RUN: under the Gaussian heuristic both arms have lambda_1 =
    3.8586 * q^{(256-2r)/256}, so the contrast is forced to ZERO and any nonzero contrast is the
    finding. THE COMPARATOR'S SPREAD IS NOT ZERO -- it is the draw-to-draw spread of lambda_1 over
    random matrices, which is measurable and is reported as a 16-draw interval, so this is not a
    control that passes by being constant.
    CAN IT FAIL? Yes, in both directions and informatively. If the real arm sits below the null's
    interval, the CRT structure shortens dual vectors and E2 fires. If the real arm sits ABOVE, the
    CRT structure lengthens them and slot-restricted functionals are longer than volume counting
    says -- also a finding, and one that still licenses no statement about attacks. If they agree,
    the result is a controlled null and the deliverable is the threshold gap.
    NULL-2 (the object removed entirely): set r = 0. There are no functionals, L_S = qZ^256, the
    shortest nontrivial vector has length exactly q, and the bias is exactly 1 for the trivial
    functional and undefined otherwise. This is the degenerate gate with an analytically known
    output and the pipeline must reproduce it exactly; failure means the construction of L_S is
    wrong.
    NULL-3 (maximal removal): set r = 128. L_S = Z^256, lambda_1 = 1 exactly, bias =
    cos^{2eta}(pi/q) ~ 1. Total retention must be at least as extreme as partial retention and on
    the same side; if the measured curve is not monotone between r = 0 and r = 128 the statistic is
    not tracking the object (KN-TECH-1a5b7e mode 2) and the reading is withdrawn.
    SENSITIVITY, WITH A NAMED COMPARATOR AND A NUMERIC THRESHOLD DECLARED BEFORE THE RUN: the
    graded control of Stage 3, mixing E_S toward a random matrix at t in {0, 0.25, 0.5, 0.75, 1},
    scored against the SAME random-matrix spread used for the headline, with monotonicity across
    the three interior points reported. Threshold: the measured lambda_1 at t = 0 must differ from
    t = 1 by more than the 16-draw interval width if the instrument is to be called sensitive at
    all -- and if it does not, the honest conclusion is that the instrument cannot detect
    structure at this r and no verdict is issued for that cell.
  discriminated_from:
    - >-
      IDEA-20260813-28cf9c selects public keys whose SampleNTT matrix is RANK-DEFICIENT in a
      quadratic slot and prices the resulting exact equations as hints. That is a rare-event weak-key
      selection over the MATRIX; this is a threshold measurement over the SECRET's projection, for
      every key, with no rare event involved. 28cf9c's finding would not move r_alg and this record's
      finding would not change 28cf9c's rank-deficiency probability.
    - >-
      IDEA-20260805-574cd0 proves the subfield/trace descent -- the even-coefficient projection --
      is a strict loss, and names the classes the lane's inherited "algebra is closed at 17 bits"
      constraint does not reach. The even-coefficient map is NOT a CRT slot projection (it is not a
      ring homomorphism), so 574cd0's proof does not cover this family. This record supplies the
      CRT-family analogue and is explicitly downstream of 574cd0. Note the asymmetry after the
      2026-08-21 repair pass: 574cd0 PROVES a strict loss for its family, which licenses a closure
      statement about that family; this record MEASURES an upper bound with a reducer, which does
      not, and conflating the two is exactly the error the repair removed.
    - >-
      IDEA-20260805-530869 builds the ring-deleted matched null as an INSTRUMENT and calibrates it
      against three forced values. Stage 2 here applies that principle to a new statistic; it does
      not rebuild the instrument, and if 530869's instrument exists it should be used in preference
      to a bespoke null.
    - >-
      IDEA-20260805-2b94fe uses cos^{2eta}, the CBD characteristic function, inside a
      per-coordinate log-likelihood SCORING functional for candidate errors. Here the same function
      appears as the exact bias of a dual functional -- a different role, a different quantity, and
      neither record's outcome constrains the other's.
    - >-
      IDEA-20260722-001 and IDEA-20260805-690de8 exploit the negacyclic ISOMETRY group for orbit
      batching and bound its ceiling by an operation-DAG argument. Those use ring automorphisms to
      REUSE work at full dimension; this asks how narrow a CRT window can be and still see anything.
      Orbit batching is not a projection and does not reduce r.
    - >-
      IDEA-20260806-b37e8e (DRAFT, RQ-RLWE-912fdb) proposes a SLOT-RESTRICTED DUAL ATTACK with a
      ring-native FFT and a kappa-curve. That is the nearest neighbour in the repository and it is
      an ATTACK proposal in a different lane; this record is a threshold MEASUREMENT that would
      supply an input to it (the smallest r at which a slot-restricted dual attack has any short
      functional to work with at ML-KEM's parameters, at the tested budget). If that draft is
      promoted, this record should be read as an input to its cost model rather than as a
      competitor -- and specifically NOT as a bound constraining it, since r_alg is an upper bound
      and that draft's reducer may differ from this one's.
    - >-
      A generic dual-attack cost estimate computes the shortest vector of the FULL q-ary lattice
      and prices a distinguisher. This computes the shortest vector of a SLOT-RESTRICTED sublattice
      family as a function of the restriction width, and its output is a threshold in r, not a cost.
      Converting it into a cost requires the sample-count accounting of Stage 5, which is optional
      and is not done by default.
  citations:
    - ref: 'CRYSTALS-Kyber specification (round 3), section on the NTT'
      provenance: recalled
      claim: >-
        For q = 3329 with q-1 = 2^8*13, Z_q contains primitive 256th but not 512th roots of unity,
