        of 128 polynomials of degree one. This wording was returned as a SEARCH SNIPPET this
        session, not fetched from the document, so it is recorded as recalled and must be
        re-verified against FIPS 203 / the specification in-harness before it is quoted.
      verified_by: null
    - ref: 'NIST FIPS 203 (ML-KEM) parameter tables and Algorithm 9 (NTT), Algorithm 12 (BaseCaseMultiply)'
      provenance: recalled
      claim: >-
        n = 256, q = 3329; (k, eta1, eta2) = (2,3,2), (3,2,2), (4,2,2); the NTT is stored as 128
        degree-one polynomials and base multiplication is a degree-2 product modulo x^2 - zeta^{...}.
        Recalled; all constants to be re-read and certified in-harness.
      verified_by: null
    - ref: 'Poisson summation / smoothing bound for the statistical distance of a modular linear image of a bounded distribution'
      provenance: recalled
      claim: >-
        The statistical distance between the image of an independent-coordinate distribution under a
        modular linear map and the uniform distribution is bounded by the sum over nonzero dual
        vectors of the product of the coordinate characteristic functions; for CBD_eta the
        characteristic function is cos^{2eta}(t/2). Standard; recalled and not re-derived here. The
        experiment uses it only as a LOWER bound via enumerated short vectors, which is the safe
        direction, and the enumeration radius is reported.
      verified_by: null
    - ref: IDEA-20260805-574cd0
      provenance: internal
      claim: >-
        Proves the even-coefficient (subfield/trace) projection is a strict loss and names the
        classes the lane's inherited constraint does not reach, including CRT projections as being
        outside the constraint's antecedent.
      verified_by: idea-generator@2026-08-21
    - ref: KN-TECH-1a5b7e
      provenance: kb
      claim: >-
        Null sufficiency: forced-value derivation before measurement; a comparator that is generated
        needs at least 8 draws and an interval; two endpoints do not give a sign; a comparator with
