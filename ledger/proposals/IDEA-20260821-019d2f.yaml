      verified_by: idea-generator@2026-08-21
    - ref: 'docs/inventor-protocol.md section 4 (closure standard) and knowledge/techniques/KN-TECH-056.md'
      provenance: internal
      claim: >-
        Premature closure is a failure mode symmetric with overclaiming; a negative result claiming
        a lane is dead needs a named obstruction, an argument, and forward guidance, and an
        obstruction is a measured quantity with units, error bars and a declared scope rather than
        a verdict. Cited because the 2026-08-21 repair pass withdrew this record's foreclosure
