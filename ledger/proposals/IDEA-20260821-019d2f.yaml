      verified_by: idea-generator@2026-08-21
  assumptions:
    - >-
      The CBD coordinates of s are independent, so the characteristic function factorises. True by
      construction in FIPS 203's sampler, and it is what makes the bias formula exact rather than
      approximate.
    - >-
      lambda_1 as reported is what LLL/BKZ at the declared blocksize actually finds, which is an
      UPPER bound on the true lambda_1. Both arms get the identical budget, so the comparison is
      fair, but an absolute r_alg computed this way is conservative and must be labelled as an
      upper bound on the true threshold's location. NOTHING OF THE FORM "no attack works below
      r_alg" MAY BE COMPOSED FROM IT, in this record or downstream.
    - >-
      The bias threshold defining r_alg is a declared convention, not a physical constant. It is
      declared before the run and the whole curve is reported, so the verdict does not hinge on it.
      A functional whose bias sits below the convention is not unusable; it is cheaper to describe
      as needing more samples, which is assumption 4.
    - >-
      Nothing here converts a bias into an attack. A distinguisher with bias B needs on the order of
      B^{-2} independent samples, and ML-KEM supplies only k*256 equations per key; the sample-count
      accounting is deliberately NOT done here (it is optional Stage 5) and no attack cost is
      implied. In particular the SIZE of the joint slot space q^{2r} is not a cost and must never be
      quoted as one.
    - >-
      All conclusions are scoped to ML-KEM's exact ring, modulus and CBD parameters, to the four
      sampled slot families, and to the declared reducer budget. Nothing transfers to other rings,
      moduli, secret distributions, untested families or stronger reducers without redoing the
      computation.
  proof_search_map:
    bottleneck: >-
      lambda_1(L_S) as a function of r and of the slot family. Every downstream statement --
      r_alg, the size of the gap, whether structure matters -- is a function of it, and it is the
      one quantity that volume counting predicts and structure could move.
    baseline_embedding:
      parameter_slice: >-
        r = 128 (the full NTT), where L_S = Z^256, lambda_1 = 1 exactly, and the projection is the
        identity -- the exact boundary at which this family degenerates into the unrestricted
        ML-KEM problem. Second slice: r = 0, where L_S = qZ^256 and lambda_1 = q exactly.
      reproduction_check: >-
        A frozen fixture asserting lambda_1 = 1 at r = 128 and lambda_1 = q at r = 0, checked
        symbolically before any BKZ is run. These are exact and instant; failure means the lattice
        construction is wrong and nothing else is reportable.
    observation_collision:
      observable: >-
        The shortest vector of L_S and its exact CBD bias.
      distinct_preimage_search: >-
        THE COLLISION IS REAL AND IS BUILT INTO THE DESIGN: the true evaluation matrix E_S and a
        uniformly random 2r x 256 matrix over F_q generate lattices of identical dimension and
        identical volume, and under the Gaussian heuristic identical lambda_1. So the observable
        cannot, a priori, distinguish a CRT slot projection from an arbitrary linear projection of
        the same rank -- which is exactly NULL-1 and exactly the falsifier this design is built
        around. A second collision: two different slot families at the same r have the same volume,
        so any difference between them is structural by construction. The design uses the
        observable only to answer a comparative question between volume-matched arms, never to
        argue that a single measured lambda_1 means anything on its own.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the volume q^{256-2r} fixed and vary the forgotten structure -- CRT-slot evaluation
          matrix versus random matrix versus interpolations, and butterfly-aligned versus
          Galois-closed versus random slot subsets -- and look for an intrinsic invariant
          (lambda_1, or the bias of the shortest vector) distinguishing them.
        predicted_gain: >-
          Predicted NULL: no distinguishing invariant, lambda_1 volume-determined, all families
          agreeing within the 16-draw interval. A measured difference exceeding 5% in lambda_1
          between any family and the null is the E2 outcome.
      - transform: stronger_invariant
        proposed_object: >-
          Preserve more than the final goal requires: track not only lambda_1 but the full
          Gram-Schmidt profile of the reduced L_S basis, since a shape difference at equal lambda_1
          would still be a structural signal and is what a purely-lambda_1 reading would miss.
        predicted_gain: >-
          None predicted; recorded because it costs one extra column in a table that already exists
          and because a shape difference is not a constant.
    quantifier_order: >-
      FOR ALL r < r_alg and FOR ALL slot subsets S with |S| = r IN THE FOUR SAMPLED FAMILIES,
      THERE EXISTS no v in L_S \ qZ^256 FOUND BY THE DECLARED REDUCER AT THE DECLARED BUDGET with
      prod_j cos^{2eta}(pi v_j / q) above the declared threshold. The negation -- THERE EXISTS
      r < r_alg and THERE EXISTS S in a tested family with such a v -- is E2, and note that the
      witness S is allowed to depend on r: nothing here claims uniformity over subsets, and the
      family comparison exists precisely because non-uniformity over S is the interesting
      possibility. THE QUANTIFIER IS DELIBERATELY RESTRICTED TWICE -- to the sampled families and
      to what one reducer at one budget finds -- and neither restriction may be dropped when the
      statement is quoted, because dropping either turns a measurement into a claim about all
      attacks.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at the declared blocksize budget and the declared bias threshold, no slot subset
        of size below r_alg in the four families tested admits a functional above threshold, and
        the measured lambda_1 agrees/disagrees with the volume-matched null by X." It cannot
        certify that no such subset exists (the families are a sample, not an enumeration), cannot
        certify anything about the true lambda_1 as opposed to what the reducer found, and cannot
        convert any bias into an attack. This sentence is the ceiling, and after the 2026-08-21
        repair pass it is also the WIDEST STATEMENT ANYWHERE IN THIS RECORD: claim (D) and
        target_complexity now say the same thing and nothing more.
      nearby_object_control: >-
        The nearby object on which the hoped-for conclusion FAILS is r = 128, where the projection
        is the identity and every functional is available. A method that reported "no functional"
        there would be broken; a method that reported the same value at r = 24 and r = 128 would
        not be reading the object. Both are checked as fixtures before any headline cell is scored,
        and the frozen decision rule is run on the r = 0 and r = 128 arms FIRST (KN-TECH-1a5b7e
        mode 4, null-first check).
    proof_obligations:
      - claim: 'x^256+1 has 128 irreducible quadratic factors mod 3329, each slot a copy of F_{q^2}.'
        responsibility: correctness
      - claim: 'h(2) = 2.0306 and h(3) = 2.3333 bits per CBD coefficient; H = 256 h; r_info = ceil(H/23.401).'
        responsibility: size
      - claim: 'The functionals factoring through pi_S are exactly the F_q-rowspace of E_S; L_S has volume q^{256-2r}.'
        responsibility: correctness
      - claim: 'For v in Z^256 the bias of <v,s> mod q is exactly prod_j cos^{2eta}(pi v_j/q) for s ~ CBD_eta i.i.d.'
        responsibility: correctness
      - claim: 'lambda_1 fixtures at r = 0 and r = 128 reproduce q and 1 exactly.'
        responsibility: baseline
      - claim: 'The random-matrix null has identical dimension and volume; the contrast is forced to zero under the heuristic.'
        responsibility: feasibility
      - claim: 'Reported lambda_1 is an upper bound on the true value; r_alg is therefore an upper bound on the threshold, so NO statement of the form "no attack works below r_alg" is licensed.'
        responsibility: scope
      - claim: 'The bias convention is declared, and a bias B below it costs ~B^{-2} samples rather than being unusable; converting the curve into a cost requires the Stage-5 accounting and is scoped to the tested family.'
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: 'r_info = ceil(H(CBD_eta over 256 coefficients) / (2 log2 q)), per eta'
      direction: different
      minimum_effect: >-
        Predicted exactly 23 for eta = 2 and exactly 26 for eta = 3. These are arithmetic; any
        other value means the entropy or the slot capacity was computed wrong.
    - metric: 'smallest r at which lambda_1(L_S) < q, i.e. at which a nontrivial functional exists at all'
      direction: different
      minimum_effect: >-
        Predicted 22 +/- 2 under the Gaussian heuristic. A measured value outside 20-24 falsifies
        the heuristic for this lattice family, which is itself the finding.
    - metric: 'r_alg, the smallest r at which the shortest FOUND v has bias above e^{-1} at the declared budget'
      direction: different
      minimum_effect: >-
        Predicted 45 +/- 5. The load-bearing prediction is not the exact value but the RATIO:
        r_alg / r_info predicted near 2. A ratio below 1.2 would mean information and algorithmic
        access coincide and the gap this proposal is about does not exist. Note that r_alg is
        procedure-relative: a stronger reducer can only lower it, so the measured value is an upper
        bound and the ratio is an upper bound on the ratio.
    - metric: >-
        signed relative difference in lambda_1 between the true CRT arm and the volume-matched
        random-matrix null, at each r, scored against the null's 16-draw interval
      direction: different
      minimum_effect: >-
        5% in lambda_1. Zero is the forced value under the Gaussian heuristic. A negative
        difference beyond 5% (CRT arm shorter) is E2 and the most interesting outcome.
    - metric: 'spread in lambda_1 across the four slot families at fixed r'
      direction: different
      minimum_effect: >-
        5%. Family-independence within the interval supports E1; a systematic ordering across
        families, reproduced at three or more values of r, supports E2.
    - metric: 'lambda_1 as a function of the graded mixing parameter t in {0, 0.25, 0.5, 0.75, 1}'
      direction: different
      minimum_effect: >-
        Monotone across the three interior points, or the directional reading is withdrawn. No
        magnitude is predicted; monotonicity is the requirement.
  minimal_test:
    design: >-
      STAGE 0 PLUS ONE ROW OF STAGE 1 AND ITS NULL. Compute r_info in closed form. Then, for r in
      {16, 22, 24, 32, 40, 48} and slot family F1 (uniformly random subsets) ONLY: build E_S by
      polynomial reduction modulo f_S, construct the q-ary lattice L_S, run LLL followed by BKZ-20,
      record the shortest vector, compute its exact bias prod_j cos^{2eta}(pi v_j/q); repeat for 16
      independent subsets per r; and run the identical pipeline on a uniformly random 2r x 256
      F_q matrix, 16 draws per r. Check the r = 0 and r = 128 fixtures FIRST and emit the frozen
      verdict on those degenerate arms before looking at any headline cell. Report, per r: the two
      16-draw intervals, their signed difference, and the bias curve. COST: six values of r times
      32 lattice reductions at dimension 256; LLL plus BKZ-20 at dimension 256 is seconds per
      instance, so this is well under an hour of single-core time.
      IT DISCRIMINATES BECAUSE the forced value under the Gaussian heuristic is exactly zero
      contrast between the two arms at equal volume, so any measured contrast beyond the null's own
      spread is structure and any agreement is a controlled null with a threshold curve attached.
      It can come out negative in two distinct ways -- agreement with the null (E1, a controlled
      null plus a measured gap), or fixture failure (construction wrong, nothing reportable) -- and
      the E1 negative is a usable measured quantity, not a blank. WHAT THE E1 NEGATIVE IS NOT: it
      is not a bound on attacks, not a foreclosure of any decomposition strategy, and not a cost.
      It is a curve of measured minima and biases over four sampled families at one reducer budget,
      and the forward guidance it supplies is a list of what remains open, not a list of what is
      excluded.
    controls:
      - 'NULL-1: volume-matched random-matrix arm, 16 draws per cell, interval reported, never a point.'
      - 'NULL-2 and NULL-3: the r = 0 and r = 128 degenerate gates with analytically known outputs, run FIRST.'
      - 'Graded sensitivity in the mixing parameter t with at least three interior points and monotonicity reported.'
      - 'Identical reduction budget, identical implementation and identical seeds across both arms.'
      - 'Leave-one-out false-positive rate of the "outside the interval" rule derived before the run (2/16 = 12.5%).'
      - 'Slot subsets drawn from a declared, seeded generator so the family definitions cannot be adjusted after seeing results.'
      - 'Scope guard on reporting: every quoted r_alg carries the reducer, the budget, the bias convention, and the four tested families, and no quotation may drop them.'
    required_metrics:
      - 'r_info per eta with the entropy values it came from'
      - 'lambda_1 interval per (r, family), 16 draws'
      - 'lambda_1 interval per r for the volume-matched null, 16 draws'
      - 'signed relative difference real minus null, per r, with the interval'
      - 'exact bias prod cos^{2eta}(pi v_j/q) of the shortest vector, per cell'
      - 'the r at which lambda_1 first falls below q, and the r at which bias first exceeds e^{-1}'
      - 'Gram-Schmidt profile of the reduced basis per cell'
      - 'fixture results at r = 0 and r = 128'
      - 'monotonicity flag for the graded control'
      - 'the declared reducer, blocksize budget, bias convention and family list, reported beside every threshold'
  falsification_conditions:
    - >-
      The r = 0 or r = 128 fixture fails. The lattice construction is wrong and nothing else is
      reportable.
    - >-
      The measured r_alg / r_info ratio is below 1.2. The gap this proposal is about does not
      exist, information and algorithmic access coincide, and the headline framing is withdrawn --
      leaving the (still useful) single threshold.
    - >-
      The real arm and the volume-matched null agree within their intervals at every r and every
      family. Then E1 holds, the CRT structure is inert for this statistic, and the deliverable is
      a controlled null plus the measured gap, scoped to the tested families and budget. This is
      the expected outcome and it is a result.
    - >-
      The graded control is non-monotone in t. No directional reading may be attached to any
      structure verdict; only the non-directional statement survives.
    - >-
      lambda_1 does not decrease monotonically in r between the r = 0 and r = 128 gates. The
      statistic is not tracking the object and the whole reading is withdrawn.
    - >-
      Some family shows lambda_1 systematically below the null beyond 5% at three or more values of
      r. The proposal's own null prediction is FALSIFIED, E2 fires, and the correct response is
      escalation to independent review, not a louder claim.
  confounders:
    - >-
      Reduction quality: BKZ-20 at dimension 256 does not find lambda_1, it finds something above
      it, and the gap depends on the basis shape -- which is exactly the thing structure might
      change. Mitigated by identical budgets on both arms and by reporting the full GS profile, but
      a structural difference in REDUCIBILITY would masquerade as a difference in lambda_1 and must
      be reported as such rather than as a lattice-geometry claim. This is also the reason r_alg is
      an upper bound and the reason no attack statement may be composed from it.
    - >-
      Subset-family definitions are choices, and a family defined after seeing results is not a
      family. All four are defined and seeded before the run. Four families are also a SAMPLE of
      the 2^128 subsets, so an E1 verdict is a statement about four families and not about the
      subset space.
    - >-
      The bias formula assumes i.i.d. CBD coordinates; if a sampler implementation deviates the
      formula is wrong. Checked by comparing the empirical bias of <v,s> over 10^6 sampled secrets
      against the closed form for a handful of v.
    - >-
      The Gaussian heuristic is used both to derive the predictions and as the null's forced value.
      That is circular unless the null is MEASURED rather than assumed -- which is why NULL-1 is
      run empirically at 16 draws rather than quoted from the formula, and why the formula appears
      only as the population target reported beside the measured comparator, never as the test
      reference (KN-TECH-1a5b7e, move 3 caution).
    - >-
      Slot subsets of size r near 128 have very small volume and the lattice becomes nearly Z^256,
      where LLL is trivially optimal; comparisons near the boundary are uninformative and must be
      flagged rather than averaged in.
    - >-
      THE BIAS CONVENTION IS A REPORTING HAZARD, not only a modelling choice. A threshold defined
      by "bias > e^{-1}" partitions functionals into usable and unusable only if sample count is
      free. It is not. Reporting r_alg without the convention, or reading "below r_alg" as "cannot
      be used", converts a convention into a claim -- which is precisely what the 2026-08-21 repair
      pass had to remove from this record's own headline.
  interpretation_limits:
    - >-
      No attack, break, speedup or exponent movement is claimed here or would follow from any
      outcome. A short functional is not a distinguisher: converting a bias into a distinguisher
      requires a sample count that ML-KEM does not obviously supply, and that accounting is
      deliberately not done (optional Stage 5).
    - >-
      r_alg as measured is an UPPER bound on the true threshold, because the reducer's output is an
      upper bound on lambda_1. Statements of the form "no attack can work below r_alg" are
      therefore NOT licensed; the licensed statement is about what the tested budget can find. AN
      EARLIER DRAFT OF THIS RECORD VIOLATED THIS LIMIT IN ITS OWN HEADLINE, claiming the gap
      "forecloses slot-local, per-slot, and small-window divide-and-conquer strategies" and quoting
      q^{2 r_alg} ~ 2^{1053} as the size of the space such an attack must work in. Both are
      withdrawn; readers of any earlier copy should treat that sentence as retracted.
    - >-
      The four slot families are a sample of the 2^128 possible subsets, not an enumeration. E1
      does not close the family; it reports that four natural families behaved like the null.
    - >-
      The SIZE of a space is not a COST. q^{2r} counts the elements of an r-slot joint image; it
      says nothing about the work required to attack through that image, and it must never be
      quoted as a security level, a lower bound, or an exponent.
    - >-
      Every conclusion is scoped to q = 3329, n = 256, the FIPS 203 CBD parameters, the declared
      blocksize ladder, the declared bias convention and the declared seeds. The lane's claim-tier
      ceiling is toy-tier and this record does not raise it.
    - >-
      The structural facts in (A) are recalled from the specification via a search snippet, not
      fetched. They must be re-verified in-harness before any of them is quoted downstream.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (VOLUME-DETERMINED MINIMUM) For every slot subset S with |S| = r in the range
        22 <= r <= 64, the lattice L_S has lambda_1(L_S) = (1 + o(1)) * sqrt(256/(2 pi e)) *
        q^{(256-2r)/256}, i.e. its shortest vector is governed by volume alone and not by the
        Vandermonde structure of the evaluation matrix E_S, uniformly over subsets of that size.
      rigorous_support: >-
        Rigorous ingredient: Minkowski's theorem gives lambda_1 <= sqrt(256) * vol^{1/256}
        unconditionally, so the upper side of H1 is not in doubt up to a constant. Classical
        distribution statement imitated: the Gaussian heuristic for RANDOM q-ary lattices, which is
        a theorem in expectation for uniformly random parity checks and is exactly what NULL-1
        instantiates. H1 asserts that the structured E_S behaves in this respect like a random
        matrix of the same rank -- and that assertion is the hypothesis under test, not an input.
        Note that Minkowski bounds lambda_1 from ABOVE only, which is the same direction as the
        reducer's output, so nothing in this record bounds lambda_1 from below and no threshold
        derived from it can be a floor.
      validation_plan: >-
        Sample 16 independent subsets per (r, family) cell at r in {8,16,22,24,32,40,45,48,56,64},
        four families, and 16 volume-matched random-matrix nulls per r, all at q = 3329 and n = 256
        -- i.e. AT TRUE FIPS RING PARAMETERS, which is unusual for this lane and is a deliberate
        design choice. Compare the empirical distribution of lambda_1 in each cell against the
        Gaussian-heuristic value AND against the null's empirical distribution, reporting the
        latter as the test reference and the former only as the population target. TAIL CHECK: the
        minimum lambda_1 over all 16 draws in each cell against the predicted minimum of 16 draws
        from the null's fitted distribution -- a structured family that is only occasionally short
        would show up in the tail and not in the mean. TRANSFER ASSUMPTIONS: none to a larger
        parameter, because the measurement is already at ML-KEM's ring dimension and modulus; the
        transfer that IS assumed is from BKZ-20-found vectors to true minima, and it is declared as
        an upper bound rather than assumed away.
    - id: H2
      statement: >-
        (BIAS EXACTNESS) For s with coordinates drawn i.i.d. from CBD_eta as specified in FIPS 203,
        and for any v in Z^256, the bias of <v,s> mod q against the uniform distribution on Z_q is
        exactly prod_j cos^{2eta}(pi v_j / q), with no approximation, for all q and all v.
      rigorous_support: >-
        This is an identity, not a heuristic: CBD_eta is the difference of two Binomial(eta,1/2)
        variables, whose characteristic function is cos^{2eta}(t/2), and the bias of a modular sum
        of independent variables is the product of their characteristic functions at the
        corresponding frequency. It is listed here rather than omitted because the whole
        measurement rests on it and because an implementation that samples CBD differently would
        break it silently.
      validation_plan: >-
        Direct check: for 20 chosen v spanning short, medium and long lengths, sample 10^6 secrets
        from the harness's own CBD sampler, compute the empirical bias of <v,s> mod q, and compare
        against the closed form. Predicted agreement to within the 10^6-sample standard error.
        TAIL CHECK: include at least three v with a single dominant coordinate, where the product
        is dominated by one factor and any sampler defect in that coordinate is most visible. A
        disagreement is a sampler bug, not a mathematical finding, and must be reported as such.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, AND NO FLOOR ON ANY ATTACK IS CLAIMED EITHER. What the E1
      outcome would produce is a measured, procedure-relative statement and nothing wider: "at the
      declared blocksize budget and the declared bias convention, no slot subset below r_alg in the
      four families tested admitted an above-threshold functional." That is a report about four
      sampled families under one reducer, not a bound: r_alg as measured is an UPPER bound on the
      true threshold, so subsets below it are not excluded, and a bias below the convention costs
      about B^{-2} samples rather than being unusable. An earlier draft of this record stated
      instead that any slot-decomposing attack "must work in a space of size at least
      q^{2 r_alg} ~ 2^{1053}"; that sentence is WITHDRAWN. It used the bound in the wrong direction,
      it contradicted this record's own interpretation_limits, and it presented the SIZE of a space
      as a COST without the sample-count accounting that would be needed to convert a bias curve
      into a cost floor. Optional Stage 5 specifies that accounting; if it is ever done, its output
      is a floor over the TESTED FAMILY AND BUDGET ONLY and never over attacks. Measurement cost:
      O(cells) lattice reductions at dimension 256, seconds each.
    memory_exponent: >-
      No attack memory exponent is claimed. The measurement stores reduced bases of dimension 256,
      a few megabytes per cell.
    best_known: >-
      There is no incumbent for either threshold. No record in this repository, and nothing surfaced
      by the single web query run, states how many CRT slots an attack on ML-KEM must hold jointly,
      or computes lambda_1 of a slot-restricted dual functional lattice at FIPS parameters. The
      nearest comparable object is the ordinary dual attack's shortest vector in the FULL q-ary
      lattice, which is the r = 128 endpoint of this curve and is therefore contained in it as a
      boundary case.
    hidden_overhead: >-
      Three disclosures. (1) r_alg as measured is an upper bound, because BKZ-20 does not find
      lambda_1; the true threshold could be lower and the gap is not estimated here -- which is why
      no statement of the form "nothing works below r_alg" appears anywhere in this record after
      the 2026-08-21 repair pass. (2) The threshold is defined by a bias convention, and converting
      bias to attack feasibility needs a sample count that ML-KEM does not obviously provide; the
      deliverable is therefore a bias CURVE and a threshold, and neither is a cost. (3) The four
      families are a sample of 2^128 subsets, so even the narrow licensed statement is about the
      sampled families and not about the subset space; enumerating or bounding over all subsets is
      an open problem this record does not touch.
    tradeoff_note: >-
      There is a genuine width-versus-quality tradeoff along the curve: larger r gives shorter
      functionals (better bias) at the cost of a larger joint space to work in. Reporting the whole
      curve rather than a single threshold is what makes that tradeoff visible, and it is the
      artifact a later attack proposal would consume -- as an input to its own cost model, with the
      sample-count accounting still owed. Parallelisation is irrelevant here.
  dominated_by: >-
    On the ATTACK axis: 'n/a (no result claimed)' -- no attack is proposed, so no cost triple
    exists, no frontier row applies, and null would be a fabrication under AGENTS.md rule 5. On the
    STRUCTURAL-AUDIT axis the honest answer is that IDEA-20260805-574cd0 dominates on rigour and on
    cost: it proves its subfield result symbolically and numerically for free, whereas this record
    must measure -- and, after the 2026-08-21 repair pass, the gap is wider than the earlier draft
    admitted, because 574cd0's proof licenses a family-level statement while this record's
    reducer-relative upper bound licenses only a statement about what one budget found on four
    sampled families. On the SLOT axis, IDEA-20260813-28cf9c dominates on directness -- it already
    prices an exactly-known slot-level event as lattice hints -- but measures a different quantity
    (matrix rank deficiency, not projection width) and cannot answer this. In the neighbouring RLWE
    lane the draft IDEA-20260806-b37e8e (slot-restricted dual attack with a ring-native FFT) would
