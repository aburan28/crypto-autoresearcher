      verified_by: null

  assumptions:
    - >-
      The Velu evaluation of a degree-ell isogeny at one point has work
      Theta(ell) field operations and depth Theta(log ell) via a product tree over
      the (ell-1)/2 kernel x-coordinates. The work half is relayed from
      IDEA-20260807-a127ab relaying KN-LIT-780 (a bulk-seeded, unverified entry).
      THE DEPTH HALF IS THIS RECORD'S OWN ARITHMETIC and is stated as heuristic H1.
    - >-
      The rebuild's minimum depth is Omega(log S): producing [S]P from P requires
      at least log_2 S doublings. This is rigorous and is the floor the whole
      comparison rests on.
    - >-
      Area is charged as storage plus arithmetic units, with wire and layout costs
      folded into constants. Any AT^2 statement at this granularity is an exponent
      and constant-band statement, never a chip estimate.
    - >-
      C_build (constructing the isogeny) is charged ONCE per path and is excluded
      from the per-entry comparison, matching the committed run's convention. If
      C_build is instead charged per cell the transport arm worsens in both
      conventions and the record says so rather than hiding it.
    - >-
      Toy scale throughout: S = 400 and log_2 N between 9 and 14 at the committed
      primes. Nothing here transfers to cryptographic scale and nothing is offered.

  proof_search_map:
    bottleneck: >-
      The DEPTH of the rebuild. Every number in claim (C) turns on whether the
      corrected incremental rebuild is genuinely a depth-Omega(S) chain that can
      be flattened to Theta(log S), or whether some cheaper-in-AT^2 table
      construction exists that this record has not considered. That is the single
      step the whole recharge rests on.
    baseline_embedding:
      parameter_slice: >-
        ell = 1, phi = identity. Transport degenerates to a copy; work and depth
        must both be the copy's, and the AT^2 ratio must be exactly 1 in both
        conventions.
      reproduction_check: >-
        STEP 4 above, and it is blocking: the instrumented WORK ratio must
        reproduce the committed wall-clock ratio (1.47 at ell=3 through 21.09 at
        ell=31) within a factor of 2 at every cell. If it does not, the
        instrumentation is measuring a different computation and no AT^2 figure
        may be reported.
    observation_collision:
      observable: "the AT^2 transport/rebuild ratio falling below 1"
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Any computation that is wide and shallow
        beats any computation that is narrow and deep in an area-optimised AT^2
        charge, whether or not an isogeny is involved. A control that transports
        the table by a RANDOM DEGREE-ell RATIONAL MAP with no isogeny structure --
        same work, same depth, no group homomorphism -- will produce the identical
        AT^2 ratio while transporting nothing. So a favourable AT^2 ratio measures
        PARALLELISM, NOT ISOGENY STRUCTURE, and every report of it must carry the
        certificate arm ([r_i]phi(P) == phi(R_i), 400 of 400) beside it. Reporting
        the AT^2 win without the certificate arm is prohibited by this record.
    constructive_transforms:
      - transform: cost_reallocation
        proposed_object: >-
          Replace the scalar "seconds" by the pair (work, depth), and the scalar
          "cost" by the AT^2 surface over the area convention.
        predicted_gain: >-
          Converts a one-number verdict into a two-branch verdict whose branches
          disagree in sign, which is the finding. No attack gain; zero.
      - transform: representation_reduction
        proposed_object: >-
          Charge the group operation by expanding it into field operations with
          their depths, rather than treating it as atomic.
        predicted_gain: >-
          Makes the rebuild's chain depth visible at all. Under an atomic-group-op
          model both arms look like flat op counts and AT^2 is not computable.
    quantifier_order: >-
      CLAIMED: FORALL cells (p, class, ell, S) in the committed grid, EXISTS a
      circuit realising Mode A transport with work Theta(S*ell) and depth
      Theta(log ell), and EXISTS a circuit realising the rebuild with work
      Theta(S) and depth Theta(log S); hence the stated AT^2 values.
      EXPLICITLY NOT CLAIMED: that these are OPTIMAL circuits for either arm --
      only that they exist, which is all an upper-bound comparison needs, and
      which is why a cheaper rebuild circuit would falsify the transport-wins
      branch without falsifying the underspecification finding.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the committed grid, the measured work/depth AT^2 transport-to-rebuild
        ratio is R_opt under the area-optimised convention and R_fix under the
        fixed-area convention, and R_opt and R_fix lie on opposite sides of 1 at
        the tested ell." It can NEVER certify an attack speedup, anything below
        the S*T^2 = Omega~(N) frontier, anything about Mode B, or anything at
        cryptographic scale.
      nearby_object_control: >-
        THE RANDOM DEGREE-ell RATIONAL MAP with no isogeny structure. It must show
        the SAME AT^2 ratio and a certificate pass rate of 0 of 400. A pipeline
        that reports a different AT^2 ratio for it is measuring isogeny structure
        where there is only parallelism, and its numbers are void.
    proof_obligations:
      - claim: "Rebuild depth is Omega(log S) and achievable at Theta(log S)."
        responsibility: correctness
      - claim: "Velu evaluation depth is Theta(log ell) at work Theta(ell)."
        responsibility: correctness
      - claim: "A*max(D, W/A)^2 is minimised at A = W/D with value W*D."
        responsibility: correctness
      - claim: "The instrumented work ratio reproduces the committed wall-clock ratio."
        responsibility: baseline
      - claim: "The identity arm reports AT^2 ratio exactly 1."
        responsibility: soundness
      - claim: "The random-rational-map control gives the same AT^2 ratio and zero certificates."
        responsibility: soundness
      - claim: "No claim is made below S*T^2 = Omega~(N)."
        responsibility: scope

  predictions:
    - metric: >-
        instrumented sequential WORK ratio W_transport / W_rebuild_incremental,
        per cell
      direction: higher
      minimum_effect: >-
        Must reproduce the committed wall-clock ratios within a factor of 2 at
        every cell (1.47 at ell=3, 21.09 at ell=31). Outside that band the
        instrumentation is void and no AT^2 number may be reported.
    - metric: area-optimised AT^2 ratio transport/rebuild at ell=3, S=400
      direction: lower
      minimum_effect: >-
        Below 0.20. This is a SIGN FLIP against the committed 1.47 and is at least
        7x outside any plausible constant ambiguity. A value above 1.0 refutes the
        area-optimised branch of claim (C).
    - metric: area-optimised AT^2 ratio transport/rebuild at ell=31, S=400
      direction: lower
      minimum_effect: >-
        Below 1.0, predicted ~0.5. A value above 1.0 places the AT^2 crossover
        inside the tested range rather than at the predicted ell* ~ 55 and is the
        informative partial outcome.
    - metric: fitted area-optimised AT^2 crossover ell*
      direction: different
      minimum_effect: >-
        In [40, 70] under the frozen constants, and scaling as log^2 S when S is
        swept over {100, 400, 1600}. A crossover that does NOT move with S
        falsifies the depth model, because the whole asymmetry is the rebuild's
        log S depth.
    - metric: fixed-area AT^2 ratio transport/rebuild at ell=31, S=400
      direction: higher
      minimum_effect: >-
        Above 21.09 -- i.e. STRICTLY WORSE than the committed wall-clock number,
        predicted ~100. This is the branch that strengthens the existing negative
        and it must be reported with equal prominence.
    - metric: certificate pass rate on the random-rational-map control
      direction: lower
      minimum_effect: >-
        0 of 400, against 400 of 400 for the true isogeny, while the AT^2 ratios
        agree within 10%. This is the disambiguator proving the AT^2 win is
        parallelism and not transport.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it is already most of the result): freeze the
      work/depth model and both area conventions; write claim (C)'s arithmetic
      out; state the underspecification finding. Reviewable before any run.
      STAGE 1 (minutes, THE CHEAPEST VALID DISCRIMINATOR): add work and depth
      counters to the committed transport and rebuild code paths and re-run ONE
      cell (p=50021, ell=3, S=400). Two numbers decide the record: does the work
      ratio reproduce 1.47, and is the area-optimised AT^2 ratio below 0.20. If
      the work ratio fails, stop. If it passes, the sign flip is already visible
      at one cell for the cost of one re-run.
      STAGE 2 (minutes): the identity arm (ell=1) and the random-rational-map
      control at the same cell.
      STAGE 3 (low hours): the full committed grid, both primes, ell 3 through 31,
      plus ell in {41, 53, 61, 71} to bracket the predicted crossover, plus the S
      sweep {100, 400, 1600} that tests the log^2 S scaling.
      STAGE 4 (zero compute): the convention-adjudication note for the Coordinator.
    controls:
      - >-
        WORK-RATIO REPRODUCTION of the committed wall-clock ratios within a factor
        2, per cell. BLOCKING.
      - >-
        IDENTITY ARM ell=1: AT^2 ratio exactly 1 in both conventions.
      - >-
        RANDOM DEGREE-ell RATIONAL MAP with no isogeny structure: same AT^2 ratio,
        zero certificates. BLOCKING for interpretation.
      - >-
        Per-entry transport certificate [r_i]phi(P) == phi(R_i), 400 of 400,
        reported beside every AT^2 figure.
      - >-
        S sweep {100, 400, 1600} as the decay parameter: the AT^2 ratio must fall
        as log^2 S rises. A ratio independent of S falsifies the depth model.
      - >-
        Matched Pollard rho and BSGS cost rows on the same instances, per the RQ's
        mandatory controls, so the build-cost comparison is visibly negligible
        against the online phase.
    required_metrics:
      - per cell, field-operation WORK for transport and for both rebuild variants
      - per cell, critical-path DEPTH for the same three arms
      - per cell, AT^2 under fixed-area A=S and under area-optimised A=W/D
      - the AT^2 ratio and its crossover ell*, per prime, per S
      - work-ratio-versus-committed-wall-clock-ratio reproduction check, per cell
      - identity-arm and random-map control outcomes
      - per-entry certificate pass counts
      - matched rho and BSGS group operations on the identical instances

  falsification_conditions:
    - >-
      The instrumented work ratio does not reproduce the committed wall-clock
      ratio within a factor 2. The instrumentation measures a different
      computation; every AT^2 number is void and this is an instrument outcome,
      not a mathematical one.
    - >-
      The area-optimised AT^2 ratio at ell=3 is above 1.0. The sign does not flip,
      the committed negative is robust to the area-optimised convention, and this
      record's headline is refuted -- which is itself a strengthening of
      EV-ENDO-10109d worth recording.
    - >-
      The identity arm reports an AT^2 ratio different from 1. Harness overhead is
      being charged as transport and every figure is inflated.
    - >-
      The AT^2 ratio does not move as S is swept over {100, 400, 1600}. The
      rebuild's log S depth is not what is driving the result and the mechanism in
      (B) is wrong even if the numbers happen to fall the predicted way.
    - >-
      A rebuild circuit is exhibited with work Theta(S) and depth o(log S). The
      depth floor of claim (B) is false; the arithmetic must be redone.
    - >-
      Both conventions agree in sign at every tested cell. The underspecification
      finding of claim (D) is empty for this grid -- report it as such rather than
      as a caveat.

  confounders:
    - >-
      PARALLELISM MASQUERADING AS TRANSPORT. The single most likely
      misinterpretation, and the reason the random-rational-map control is
      blocking: an area-optimised AT^2 win is produced by ANY wide-shallow
      computation and says nothing about isogenies. The certificate arm is the
      only thing separating the two and must appear in the same table.
    - >-
      DEPTH ACCOUNTING FOR FIELD INVERSION. If the harness's group law uses a
      modular inverse per addition, the rebuild's per-step depth is Theta(log p),
      not Theta(1), which RAISES the rebuild's depth and makes transport look
      better. Inversion depth must be measured, reported separately, and the
      comparison recomputed with batched (Montgomery-trick) inversion, which is
      the fair engineering baseline for the rebuild.
    - >-
      TOY S AND TOY N. At S=400 and log_2 N between 9 and 14 the table is a
      substantial fraction of the group, log_2 S and log_2 N are within a factor
      of 1.5 of each other, and every asymptotic separation is a small constant.
      Every AT^2 figure here is a constants-band statement.
    - >-
      C_BUILD AMORTISATION. Whether the isogeny construction is charged once per
      path, once per cell or once per entry moves the transport arm by orders of
      magnitude. The convention must match the committed run's exactly, and be
      restated with every figure.
    - >-
      CONVENTION SHOPPING. Because the two area conventions disagree in sign,
      this record is unusually easy to misuse. No downstream summary may quote an
      AT^2 ratio without naming its convention, and the Coordinator note of STEP 6
      exists to make that enforceable.

  interpretation_limits:
    - >-
      This concerns the cost of BUILDING an advice table on a second curve. It is
      not an attack, it moves no exponent, and it must never be summarised as
      "isogeny transport beats rebuilding" without the convention and without the
      observation that both arms are o(N) against the S*T^2 = Omega~(N) frontier.
    - >-
      Mode A only. Mode B (pull the two target points) is a different comparison
      and is untouched here.
    - >-
      Toy scale, claim_tier toy. The committed grid is p <= 60013, S = 400.
    - >-
      A sign flip in the cost model is a statement about the accounting, not a
      discovery about elliptic curves. Its value is that RQ-MTGT-2cabee's decision
      target mandates the accounting in which the flip occurs.
    - >-
      Nothing here bears on IDEA-20260830-3e38ce's Bernstein-Lange-object closure,
      which is about a different preprocessing object and holds in the work model
      for a reason (predicate repair) that AT^2 does not remove.

  heuristic_assumptions:
    - id: H1
      statement: >-
        DEPTH MODEL FOR VELU EVALUATION. Evaluating a fixed, already-constructed
        F_p-rational isogeny of prime degree ell at one point has field-operation
        work W_ev(ell) = c_V*ell + O(1) with c_V a small constant, and minimum
        circuit depth D_ev(ell) = c_D*log_2 ell + O(1), achieved by evaluating the
        product over the (ell-1)/2 kernel x-coordinates as a balanced binary tree
        followed by one division.
      rigorous_support: >-
        The work half is the standard Velu count, relayed here at second hand
        (IDEA-20260807-a127ab relaying KN-LIT-780, a bulk-seeded entry marked "not
        verified here") -- confidence: reported. The depth half is rigorous GIVEN
        the product form: a product of m terms has an exact balanced-tree circuit
        of depth ceil(log_2 m), which is the classical parallel-prefix bound, and
        the division contributes O(log p) depth if done by exponentiation or O(1)
        if the batch inverse is shared across the S entries. What is HEURISTIC is
        that the implemented harness code realises this form rather than a
        left-to-right accumulation, which would have depth Theta(ell) and would
        remove the entire asymmetry.
      validation_plan: >-
        SAMPLE: for ell in {3, 5, 7, 11, 13, 17, 23, 31, 41, 53, 61, 71}, at
        p in {50021, 60013} and one third prime with a different log_2 N,
        instrument the committed Velu evaluation with a per-intermediate depth tag
