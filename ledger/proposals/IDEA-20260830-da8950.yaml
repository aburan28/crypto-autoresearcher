      statement: >-
        REBUILD DEPTH MODEL. A table of S known-log points on E' can be built with
        work Theta(S) group operations and depth Theta(log S) group operations,
        and no construction of {[1]P, ..., [S]P} achieves depth o(log S).
      rigorous_support: >-
        The lower bound is rigorous: computing [S]P from P in an
        addition-subtraction chain requires at least log_2 S steps, so any circuit
        producing the entry [S]P has depth at least log_2 S. The upper bound is a
        doubling chain of depth log_2 S producing {[2^i]P} followed by a
        parallel-prefix sum of depth log_2 S, which is the classical Ladner-Fischer
        prefix construction. The classical pattern imitated is parallel prefix, not
        a distributional heuristic.
