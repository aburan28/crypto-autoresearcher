      ell factor; rebuild work exponent in S is 1. The only thing that moves is
      DEPTH -- log ell versus log S -- and depth is not an attack exponent.
    memory_exponent: >-
      1/3 in N for the table, unchanged and identical in both arms; the table must
      be stored either way. The area-optimised convention transiently buys
      S*ell/log ell arithmetic units during transport, which is a build-time area
