idea:
  id: IDEA-20260830-da8950
  question_id: RQ-MTGT-2cabee
  added: '2026-08-30'
  title: >-
    THE COMMITTED NEGATIVE IS A SEQUENTIAL WALL-CLOCK RATIO AND THE RQ MANDATES
    AT^2, WHERE THE SIGN FLIPS: transporting a table is width-S depth-O(log ell)
    while the corrected incremental rebuild is a depth-Omega(log N) dependency
    chain, so under an area-optimised AT^2 charge the predicted transport /
    rebuild ratio is Theta(ell*log ell / log^2 S) -- BELOW 1 at every ell already
    tested at both committed primes -- while under a fixed-area AT^2 charge it is
    Theta((ell)^2 / log^2 S) and is WORSE than the wall-clock number; the
    deliverable is that RQ-MTGT-2cabee's own decision target is underspecified,
    that the two conventions disagree in sign, and that both are computable at
    zero new mathematics from work and depth counters on the identical code paths
  class: cost-model

  claim: >-
    (A) WHAT WAS ACTUALLY MEASURED. RUN-MTGT-p50021sweep and RUN-MTGT-p60013sweep
    report, per cell, `transport_seconds_min_of_7`,
    `rebuild_incremental_seconds_min_of_7`, `rebuild_batch_seconds_min_of_7` and
    the derived `transport_over_correct_rebuild`. These are WALL-CLOCK SECONDS on
    one sequential interpreter, at a fixed `table_size` of 400, for Mode A
    transport (all 400 entries pushed; `entries_surviving` 400). The headline
    "1.5x at ell=3 rising to 21x at ell=31, no crossover" is therefore a ratio of
    SEQUENTIAL TIMES. RQ-MTGT-2cabee's decision_target does not ask for that. It
    asks for the FULL AT^2 COST MODEL. No record in this lane has charged the
    transport arm in AT^2, and this record's first content is that the two models
    can and do disagree in SIGN, not merely in magnitude.

    (B) THE STRUCTURAL ASYMMETRY THAT MAKES THE SIGN FLIP POSSIBLE, STATED AS
    WORK AND DEPTH RATHER THAN AS SECONDS.
      REBUILD (the corrected baseline, one addition per consecutive multiple).
        WORK Theta(S) group operations. DEPTH Theta(S) as written -- it is a
        strict dependency chain R_{i+1} = R_i + P. Its best parallel form is not
        the chain: either seed W segments with W scalar multiplications
        (work S + W*log N, depth S/W + log N) or build {[1]P .. [S]P} by a
        doubling chain plus a prefix tree (work Theta(S), depth Theta(log S)).
        Either way DEPTH_rebuild = Omega(log S), and it cannot be lower: [S]P is
        not obtainable from P in fewer than log_2 S doublings.
      TRANSPORT (Mode A, Velu). WORK Theta(S*ell) field operations. DEPTH per
        entry Theta(log ell) -- the degree-ell isogeny x-map is a product/sum over
        (ell-1)/2 kernel points and evaluates by a product tree -- and the S
        entries are MUTUALLY INDEPENDENT, so DEPTH_transport = Theta(log ell)
        with S*ell/log ell multipliers.
      THE ASYMMETRY IS THAT TRANSPORT IS EMBARRASSINGLY PARALLEL ACROSS ENTRIES
      AND SHALLOW WITHIN AN ENTRY, WHILE THE REBUILD IS A CHAIN. A sequential
      timing sees only WORK and therefore sees only ell versus 1. AT^2 sees depth.

    (C) THE TWO CHARGES, COMPUTED. Both arms must store the S-entry table, so
    A >= S in both.
      AREA-OPTIMISED AT^2 (the attacker may buy area; this is the standard
      Brent-Kung/Wiener convention in which the CGK frontier S*T^2 = Omega~(N) is
      itself stated). For a computation of work W and minimum depth D in area A,
      T = max(D, W/A), and A*T^2 is minimised at A = W/D giving A*T^2 = W*D.
        AT^2_rebuild  = Theta(S) * Theta(log S)   = Theta(S * log S)
        AT^2_transport= Theta(S*ell) * Theta(log ell) = Theta(S * ell * log ell)
        RATIO = Theta(ell * log ell / log S).
      With the harness's own constants -- the rebuild needing a doubling chain
      plus a prefix tree, depth 2*log_2 S -- the honest form is
        RATIO ~ c_V * ell * log_2 ell / (4 * log_2^2 S) using A*T^2 = A*T^2 with
        A=S in the rebuild (the table must be stored anyway, so the rebuild's
        area cannot fall below S and its AT^2 is S*(2 log_2 S)^2), giving
        RATIO ~ ell*log_2 ell / (4*log_2^2 S).
      At the COMMITTED PARAMETERS S = 400 (log_2 S = 8.64): the denominator is
      298. ell=3 gives 4.7 (ratio 0.016); ell=31 gives 153 (ratio 0.51). SO IN
      THE AREA-OPTIMISED CHARGE TRANSPORT WINS AT EVERY SINGLE ell ALREADY
      TESTED, AT BOTH PRIMES, and the predicted AT^2 crossover sits at
      ell* with ell*log_2 ell ~ 298, i.e. ell* ~ 55 (band 40-70 for a factor-2
      constant uncertainty) -- just OUTSIDE the tested range.
      FIXED-AREA AT^2 (area pinned at A = S, the table and nothing more). Then
        T_rebuild = Theta(log S), T_transport = Theta(ell), and
        RATIO = (c_V*ell / (2*log_2 S))^2, which at c_V = 6 is 1.08 at ell=3 and
        116 at ell=31. TRANSPORT LOSES, AND LOSES WORSE THAN THE WALL-CLOCK
        NUMBER SAYS (116 versus 21).
    (D) THE DELIVERABLE, WHICH IS NOT "TRANSPORT WINS". It is that
    RQ-MTGT-2cabee's decision_target says "the full AT^2 cost model" without
    fixing whether the attacker may spend area, and the sign of the lane's
    headline result is a function of exactly that unfixed choice: area-optimised
    says transport wins by up to 60x at every tested cell, fixed-area says it
    loses by up to 116x. A decision target that does not determine the sign of
    its own answer is a defect in the question, and naming it is the cheapest
    useful thing this record can do. The second deliverable is the recharge
    itself, in whichever convention the Coordinator freezes.

    (E) WHAT IS NOT CLAIMED, EXPLICITLY. No attack exponent moves. Both arms are
    costs of BUILDING an advice table, and both are o(N) against an online phase
    whose frontier is S*T^2 = Omega~(N) (KN-TECH-005, KN-LIT-013). Winning the
    build comparison does not move the Bernstein-Lange operating point, does not
    beat rho, and does not produce a single-instance speedup. The correct
    sota_delta is ZERO and is recorded as zero.

  mechanism: >-
    STEP 1 (zero compute). Freeze a WORK/DEPTH cost model: one field
    multiplication is one unit of work; addition and subtraction are free; a
    field inversion is charged at its actual implemented cost and its depth
    recorded; a group operation is expanded into its field operations rather than
    treated as atomic (this is where the committed wall-clock measurement loses
    the information AT^2 needs). Declare BOTH area conventions -- fixed-area
    A = S and area-optimised A = W/D -- and commit to reporting both in every
    cell, before any number is produced.
    STEP 2 (low compute). Instrument the IDENTICAL code paths already committed
    under EXP-MTGT-952db3 with two counters per arm: total field-operation WORK,
    and critical-path DEPTH obtained by tagging every intermediate with
    1 + max(depth of its inputs). No algorithmic change, no re-derivation, no new
    solving. Re-run the same (p, class, ell, S=400) grid.
    STEP 3 (zero compute). Recompute, per cell, AT^2 = A*max(D, W/A)^2 under both
    conventions, and the transport/rebuild AT^2 ratio. Plot against ell and locate
    the crossover in each convention.
    STEP 4 (blocking control). Recompute the SEQUENTIAL work ratio W_transport /
    W_rebuild_incremental from the same counters and check it reproduces the
    committed wall-clock ratio (1.47 at ell=3 to 21.09 at ell=31) within a factor
    of 2. If the work ratio does NOT reproduce the committed timing ratio, the
    instrumentation is not measuring the same computation and every AT^2 number is
    void -- this is the audit that prevents the recharge from being an artefact of
    a different implementation.
    STEP 5 (blocking null). The IDENTITY ARM, ell = 1, phi = identity: both
    conventions must report AT^2 ratio exactly 1 and depth ratio exactly matching
    the rebuild's own depth. A nonzero transport depth at ell = 1 means the
    counters are charging harness overhead as transport.
    STEP 6 (zero compute). Write the underspecification finding of claim (D) as a
    question-level note for the Coordinator to adjudicate, naming the convention
    each downstream record must use, so that no future record in this lane quotes
    a ratio without its convention.

  novelty_status: unverified

  citations:
    - ref: EV-ENDO-10109d
      provenance: internal
      claim: >-
        Preprocessing isogeny transport loses to a correctly costed rebuild at
        every odd ell from 3 to 31 at p=50021 and p=60013, ratio 1.5x rising to
