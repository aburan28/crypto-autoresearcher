idea:
  id: IDEA-20260812-3182cf
  question_id: RQ-JMV-001
  added: '2026-08-12'
  proposed_by: idea-generator
  status: proposed
  class: composition

  title: >-
    Which re-randomiser does the ordinary prime-field lane actually own? Compose
    the Jao-Miller-Venkatesan expander self-reduction with the 2023-2025
    effective-class-group-action results, charge both against the instance they
    randomise, and decide whether the ordinary lane has a poly-time re-randomiser
    at all or only a GRH-conditional walk whose constants nobody has computed.

  object: >-
    TRACKED OBJECT. The RE-RANDOMISATION PRIMITIVE itself, projected to the pair
    (distribution induced on the isogeny class after k steps, charged field
    multiplications spent to get there). The state is a walk on the class; what
    is retained is only how uniform the walk has become and what it cost, with
    every structural detail of the intermediate curves discarded. Established
    families declared off-limits as the primary lens - the isogeny-graph
    SPECTRUM as an object (IDEA-20260806-bcbcf5 shows the eigenvalues are Hecke
    eigenvalues, so a naive spectral measurement has the wrong null and is
    guaranteed a false positive), the isogeny-graph query model
    (IDEA-20260806-d5a34e), and isogeny transfer to a weak destination
    (EV-ECDLP-b3e847). Candidate objects scored on (new / one-step propagation
    definable and measurable / survival depth) - the eigenvalue spectrum of the
    Cayley graph (known and WRONG-NULLED / measurable but uninterpretable /
    dissolves immediately, and it is already EXP-JMV-003's object); the walk's
    total-variation distance to uniform (adaptation / measurable / survives, but
    partially overlaps EXP-JMV-003 and is therefore declared secondary here); the
    CHARGED COST PER UNIT OF RANDOMNESS (new here / measurable, its one-step
    propagation is an explicit field-operation count / survives across primitives
    and across parameter sizes, which is what lets two different primitives be
    compared at all); the class-group structure itself (known, subexponential, and
    it is a precondition rather than an object). The charged cost per unit of
    randomness is the lens. KN-OPEN-019 records that no written
    object-enumeration for the ECDLP exists in this programme; the above is a
    sketch, not a taxonomy.

  lossy_projection_test: >-
    The projection (full walk trajectory) -> (distance-to-uniform, charged cost)
    is genuinely lossy - it discards every curve visited, every kernel, and every
    intermediate j-invariant, keeping two real numbers. What it discards is
    discarded COMPATIBLY with the operation at issue - composing two walks adds
    their costs and composes their distributions, so the retained pair propagates
    deterministically under walk composition, which is the only operation a
    re-randomiser performs. It is not a change of coordinates - a trajectory
    cannot be recovered from two numbers. NOTE the honest limit - the projection
    is NOT compatible with any operation that inspects an intermediate curve, so
    this object cannot see structure-dependent shortcuts and does not claim to.

  claim: >-
    Three statements, E1-E3, of which E1 costs no compute at all and is a written
    audit, E2 is a bounded measurement, and E3 is the deliverable.

    (E1) APPLICABILITY AUDIT, ZERO COMPUTE. The 2023-2025 effective class group
    action results recorded in this corpus - Clapoti (Page-Robert, relayed via
    KN-LIT-1778) and PEGASIS (Dartois-Eriksen-Fouotsa, KN-LIT-1449, corpus
    confidence "reported") - evaluate the class group action for an ARBITRARY
    ideal in polynomial time using higher-dimensional isogenies, removing the
    smooth-generator restriction that JMV's walk depends on. PEGASIS's own stated
    setting is SUPERSINGULAR curves primitively oriented by O, including the
    Frobenius orientation. The claim to be audited - the ordinary prime-field
    setting does NOT inherit this for free, because the higher-dimensional
    construction requires torsion of a level M whose field of definition for an
    ordinary E/F_p has degree ord(pi mod M), which IDEA-20260808-bba3dc predicts
    is of size about M for almost all M. If the audit confirms this, the ordinary
    lane's ONLY re-randomiser is the GRH-conditional smooth-ideal expander walk of
    JMV 2005 (arXiv:math/0411378), and every average-case argument for the
    ordinary lane must pay its constants.

    (E2) CHARGED COST OF THE ONLY AVAILABLE RE-RANDOMISER. Measure, in charged
    field multiplications and not wall clock, the cost of ONE JMV
    re-randomisation at toy and medium sizes - the cost of finding split primes
    of norm at most m, the per-step modular-polynomial cost, and the number of
    steps actually required to reach a declared total-variation distance -
    together with the cost of the instance it randomises, 0.886*sqrt(N). Report
    the ratio and its scaling. The prediction is that the ratio falls with p (the
    reduction is asymptotically negligible) but that the CROSSOVER size, below
    which randomising costs more than solving, is larger than the sizes at which
    this programme actually runs experiments - which would mean every toy-scale
    use of JMV as a justification is asymptotic borrowing, not a measured fact.

    (E3) WHAT THE REDUCTION IS FOR, AND WHETHER IT IS NEEDED. RQ-JMV-001's own
    motivation (G2) asks whether dlog cost is genuinely constant across a level
    or merely equal up to the reduction's polylog overhead. If
    IDEA-20260812-a3720a's statement A3 verifies - that the connecting ray class
    of an ECDLP instance is literally unchanged by transport along any
    F_p-isogeny - then within-level uniformity holds EXACTLY and needs no
    reduction at all, and JMV's overhead is a pure loss for that purpose. The
    discriminating prediction is therefore two-sided - measured within-level dlog
    cost spread is zero within the seed band (in which case JMV's reduction
    establishes, at polylog cost, something that holds exactly and for free), OR
    the spread is nonzero beyond the band (in which case A3 is wrong, the
    reduction is doing real work, and EXP-ISOU-2ac81f's falsification condition
    F1 has fired).

    SCOPE, BINDING. RQ-JMV-001's constraints state that no experiment under it
    may produce an ECDLP attack or an attack-cost improvement. Nothing here does,
    nothing here confirms or disconfirms GRH, and the record makes no exponent
    claim. Its justification under the exponent-first bias is stated plainly in
    target_complexity as a building-block justification and nothing more.

  mechanism: >-
    The Wesolowski pattern that this programme takes as its exemplar has three
    parts - a rigorous bound, a classical distribution theorem, and a
    RE-RANDOMISATION step with an explicit mixing-time justification that
    converts worst-case instances into average-case ones. For the supersingular
    lane the re-randomiser is a rapidly-mixing walk on an expander with a proved
    gap. For the ordinary prime-field lane the corresponding object is the
    Cl(O)-Cayley graph, whose expansion is GRH-conditional and whose implied
    constants have never been computed in this corpus or, as far as the corpus
    records, anywhere. The mechanism of this record is simply to notice that a
    programme biased toward that pattern has never priced the pattern's own third
    ingredient in the lane it works in, and that a second candidate ingredient
    (the effective group action) has appeared in the literature since JMV and has
    a stated setting that may or may not include this lane. Pricing both is a
    prerequisite for any conditional average-case argument the programme might
    later want to make, and its outcome determines whether such an argument is
    available at all.

  novelty_status: adaptation
  novelty_note: >-
    CORPUS CHECKED, WEB NOT AVAILABLE. WebSearch returned a backend model error
    for every query this session, so PEGASIS and Clapoti are cited ONLY through
    the in-repo entries KN-LIT-1449 and KN-LIT-1778, both of which the corpus
    itself marks confidence "reported" and "not verified here"; they are used as
    pointers, never as verified theorems, and no new KN-LIT entry is written by
    this record. DECLARED NON-OVERLAP WITH THE EXISTING JMV EXPERIMENT SET, which
    RQ-JMV-001 lists - EXP-JMV-002 (c_pi distribution study, unapproved pending a
    sampling-measure and literature gate) is NOT re-run here and no c_pi
    distribution is measured; EXP-JMV-003 (empirical spectral gap, unapproved
    pending GRH-conditionality declaration, normalisation and downscope) owns the
    EIGENVALUE computation and this record does not compute eigenvalues or Hecke
    character sums - the total-variation measurement described below is declared
    SECONDARY and conditional on coordination with EXP-JMV-003's revision, and if
    the Coordinator judges it duplicative it is dropped without affecting E1 or
    E2; EXP-JMV-005 (standalone Monte Carlo, closed as dominated by exact Fourier
    computation) is not revived; EXP-JMV-006 (level census, deferred on a
    partition-rule confound) is not re-run, and this record measures a RATIO
    against 0.886*sqrt(N) rather than a per-curve dlog cost spread. The new
    content relative to all of them is E1 - the applicability audit of the
    post-2023 effective-action results against the ordinary prime-field lane,
    which no JMV experiment covers because those results postdate the question's
    framing - and the charged-cost ratio of E2, which the RQ's own motivation
    (G1) names as absent from the literature. IDEA-20260808-bba3dc supplies the
    torsion-rationality budget the audit uses and is credited rather than
    duplicated; IDEA-20260812-104e1a in this same batch challenges one inference
    from that budget, and the audit here must be read against BOTH and must
    record which one it relies on. IDEA-20260806-bcbcf5's wrong-null warning is
    respected by construction - no eigenvalue is measured, and the one
    distributional measurement carries a random-abelian-Cayley null.

  assumptions:
    - >-
      GRH is assumed by JMV 2005 and is inherited, never tested. Nothing measured
      here confirms or disconfirms GRH, and any statement about the reduction's
      cost is conditional on it exactly as the source is.
    - >-
      Cost-model results are scoped to the stated model - the walk length of
      JMV's Proposition 3.1 and an O(ell^3) per-step modular-polynomial cost -
      and are not statements about real attack cost, per RQ-JMV-001's own
      constraint.
    - >-
      KN-LIT-1449 and KN-LIT-1778 are relayed at the corpus's own stated
      confidence level. If the audit's conclusion turns on a claim in either, the
      audit records that dependency explicitly and marks its conclusion as
      pending verification of that source rather than asserting it.
    - >-
      Full c_pi for crypto-size curves requires factoring a p-sized integer;
      unresolved factorisations are reported as CENSORED, never as c_pi = 1, per
      RQ-JMV-001's constraint. This record avoids needing them.
    - >-
      No experiment under this record can produce an ECDLP attack or an
      attack-cost improvement.

  proof_search_map:
    bottleneck: >-
      For E1, the exact hypothesis in the effective-action results that the
      ordinary prime-field setting fails or satisfies - the audit's whole content
      is locating that one hypothesis and checking it, and its removal would give
      the ordinary lane a poly-time re-randomiser. For E2, the number of walk
      steps actually needed, which is the only factor in the cost that is not a
      per-step constant and is the one JMV bounds only asymptotically and only
      under GRH.
    baseline_embedding:
      parameter_slice: >-
        Setting the walk length to zero recovers "no re-randomisation", i.e. the
        raw instance and its 0.886*sqrt(N) cost; the ratio measured in E2 is
        exactly 0 there, and the baseline is an exact parameter slice rather than
        a comparison. For E1, setting the curve to supersingular over F_p with
        Frobenius orientation recovers PEGASIS's own stated setting, where the
        audit must conclude APPLICABLE - if it does not, the audit is
        mis-specified.
      reproduction_check: >-
        Frozen fixture - the audit run against PEGASIS's own declared setting must
        return APPLICABLE, and the same audit run against a setting the source
        explicitly excludes must return NOT APPLICABLE. Both directions are
        checked before the ordinary-lane verdict is written, so the audit is not a
        one-way instrument that returns the same answer to every question.
    observation_collision:
      observable: >-
        The pair (applicability verdict, charged cost per re-randomisation).
      distinct_preimage_search: >-
        Search for two primitives with the SAME observable but different
        consequences for a downstream average-case argument - for instance a
        primitive that is "applicable" but whose cost includes a subexponential
        one-time class-group structure computation, versus one that is applicable
        with no precomputation. If the observable cannot separate those, it is the
        wrong observable and must be refined to a triple including the
        precomputation charge. This refinement is anticipated here rather than
        discovered later, and the triple is what the artifact records.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          A costed re-randomiser table for the ordinary prime-field lane, with one
          row per candidate primitive and columns for applicability, per-call
          charged cost, one-time precomputation charge, and the conditionality
          (GRH, source confidence) each carries.
        predicted_gain: >-
          None as an attack. The gain is that any future conditional average-case
          argument in this lane can cite a row instead of asserting that
          re-randomisation is free, which is the assertion the exemplar pattern
          makes silently.
      - transform: specialization_pack
        proposed_object: >-
          The ordinary-F_p specialisation of the effective-action hypotheses.
        predicted_gain: >-
          A definite verdict where the corpus currently has an absence - the
          post-2023 toolbox appears in this corpus only in the supersingular
          lane, and whether it reaches this one has never been written down.
    quantifier_order: >-
      FOR ALL ordinary E/F_p in the sampled families, DOES THERE EXIST a
      re-randomisation primitive with polynomial per-call cost, no
      superpolynomial precomputation, and no GRH conditionality? Predicted - NO,
      with the failure attributed to the torsion field of definition for the
      effective-action route and to GRH-conditionality for the JMV route. Note
      the order - the curve is quantified first, so a primitive that works only
      for specially constructed curves does not count, which is the correct
      standard for a re-randomiser meant to convert worst-case to average-case.
    method_ceiling:
      strongest_certifiable_claim: >-
        A costed table plus a written applicability verdict, both conditional on
        the cited sources at the confidence the corpus assigns them, plus a
        measured cost ratio at toy and medium sizes. It certifies NOTHING about
        whether a re-randomiser exists that nobody has published, nothing about
        GRH, and nothing about attack cost. A NOT APPLICABLE verdict is a
        statement about the audited hypotheses of the audited papers, not an
        impossibility claim.
      nearby_object_control: >-
        The nearby object on which the desired conclusion FAILS - supersingular
        curves over F_p oriented by Frobenius, PEGASIS's own setting, where the
        effective action is reported to work and the audit must say so. If the
        audit returns NOT APPLICABLE there, it is an instrument that always says
        no and its ordinary-lane verdict is worthless.
    proof_obligations:
      - claim: >-
          The effective-action results require M-torsion whose field of
          definition for ordinary E/F_p has degree ord(pi mod M)
        responsibility: interface
      - claim: >-
          That degree is superpolynomial for almost all M on ordinary curves
        responsibility: size
      - claim: >-
          The audit returns APPLICABLE on the sources' own declared settings
        responsibility: feasibility
      - claim: >-
          Charged cost of one JMV re-randomisation, in field multiplications, at
          the measured sizes
        responsibility: runtime
      - claim: >-
          Nothing measured constitutes an attack or an attack-cost improvement
        responsibility: scope

  predictions:
    - metric: >-
        applicability verdict of the effective-action route for ordinary E/F_p,
        as a written audit against each stated hypothesis of the cited sources
      direction: different
      minimum_effect: >-
        NOT APPLICABLE without paying a field extension of degree ord(pi mod M),
        with the failing hypothesis NAMED and quoted. A verdict without a named
        failing hypothesis is not an audit and does not count.
    - metric: >-
        the same audit run against the sources' own declared settings
        (supersingular, primitively oriented)
      direction: different
      minimum_effect: >-
        APPLICABLE. If this comes out NOT APPLICABLE the audit is broken and the
        ordinary verdict is discarded.
    - metric: >-
        charged field multiplications for one JMV re-randomisation divided by
        0.886*sqrt(N) charged field multiplications for the instance, measured at
        p in a declared grid
      direction: lower
      minimum_effect: >-
        Strictly decreasing in log p across the grid, by at least a factor 4 from
        the smallest to the largest size. A ratio that does NOT decrease means the
        reduction is not asymptotically negligible in the measured model, which
        would be a substantive finding about the model and must be reported.
    - metric: >-
        crossover bit size at which the ratio crosses 1
      direction: higher
      minimum_effect: >-
        At least 40 bits. The prediction that matters is that the crossover lies
        ABOVE the sizes at which this programme runs toy experiments, so that
        toy-scale invocations of JMV are asymptotic borrowing rather than measured
        fact. A crossover below 20 bits falsifies that reading.
    - metric: >-
        number of walk steps to reach total-variation distance 1/4, divided by
        the same quantity for a matched random abelian Cayley graph of identical
        group order and degree (SECONDARY, conditional on coordination with
        EXP-JMV-003)
      direction: same
      minimum_effect: >-
        1.00 plus or minus 0.20. The Cl(O) Cayley graph should NOT mix
        substantially faster than a random abelian Cayley graph of the same order
        and degree; if it does, that is structure and it is a finding, and if it
        mixes substantially slower, JMV's constants are worse than the asymptotic
        statement suggests. This ratio is the wrong-null guard demanded by
        IDEA-20260806-bcbcf5 and it is the reason the measurement is a RATIO and
        never an absolute spectral quantity.

  minimal_test:
    design: >-
      THREE PARTS, strictly ordered, and the first two carry the deliverable.
      PART 1 (zero compute, hours of reading). For each stated hypothesis of
      KN-LIT-1449 and KN-LIT-1778 as recorded in the corpus, write the ordinary
      prime-field instantiation and mark it satisfied, failed or undetermined,
      quoting the hypothesis. Run the same procedure against the sources' own
      declared settings as the reproduction check. Record every dependency on a
      claim the corpus marks "reported" and mark the corresponding conclusion as
      pending verification. Output is a table, not a narrative.
      PART 2 (bounded compute, inside RQ-JMV-001's 2 CPU-hour track budget). At a
      declared grid of prime sizes (toy p near 2^20 where the level is fully
      enumerable, and medium p in [2^40, 2^56] where it is not), instrument and
      count field multiplications for - finding split primes of norm at most m;
      evaluating the modular polynomial at each step; performing the walk for the
      declared number of steps; and, separately, running 0.886*sqrt(N) rho steps
      on the same curve. Report the ratio and fit its scaling. All counts are
      instrumented, never estimated, and wall clock is recorded for transparency
      only.
      PART 3 (SECONDARY, run only if the Coordinator judges it non-duplicative of
      a revised EXP-JMV-003). At toy sizes where Cl(O) is fully enumerable,
      measure empirical total-variation distance to uniform as a function of walk
      length, and the same quantity for a matched random abelian Cayley graph of
      identical group order and degree. Report only the RATIO.
    controls:
      - >-
        POSITIVE CONTROL FOR THE AUDIT, BLOCKING - the audit run against the
        sources' declared supersingular oriented settings must return APPLICABLE.
        An audit that returns NOT APPLICABLE everywhere is a rubber stamp in the
        negative direction and its verdict is void.
      - >-
        NULL OBJECT FOR THE MIXING MEASUREMENT, MANDATORY IF PART 3 RUNS - a
        random abelian Cayley graph on a cyclic group of the same order and the
        same degree, seeded and recorded. This is the object of the same shape
        that should show no effect, and it is the specific guard against
        IDEA-20260806-bcbcf5's wrong-null failure mode, where a Hecke eigenvalue
        is mistaken for a discovery.
      - >-
        ZERO-STEP NULL for Part 2 - the identical instrumentation with walk length
        zero must report a re-randomisation cost of exactly zero. A nonzero count
        there is a measurement leak and everything is void.
      - >-
        CENSORING DISCIPLINE - any factorisation or class-group computation that
        does not complete inside the budget is recorded as CENSORED with its state
        at the cutoff, never as a completed value and never as a negative result
        (RQ-JMV-001's own constraint, and AGENTS.md rule 5).
      - >-
        CHARGED-UNIT LEDGER shared by the walk arm and the rho arm, with any
        precomputation charge amortised identically across arms and stated in the
        contract. Asymmetric amortisation is exactly the artifact recorded at
        DEC-20260801-003 and it is closed here by construction.
    required_metrics:
      - the hypothesis-by-hypothesis audit table with quoted hypotheses and verdicts
      - the same table for the sources' own settings (the reproduction check)
      - >-
        instrumented field-multiplication counts for each component of one JMV
        re-randomisation, per size in the grid
      - instrumented field-multiplication count for 0.886*sqrt(N) rho steps, same sizes
      - the ratio, its fitted scaling, and the extrapolated crossover bit size
      - >-
        if Part 3 runs - walk length to TV distance 1/4 for the real and null
        graphs, and the ratio only
      - censoring log with state at cutoff for every incomplete computation
      - wall clock recorded for transparency only and excluded from every ratio

  falsification_conditions:
    - >-
      The audit returns APPLICABLE for the ordinary prime-field lane with a
      concrete instantiation. The ordinary lane HAS a poly-time re-randomiser,
      IDEA-20260808-bba3dc's inference is wrong for this purpose, and every
      conditional average-case argument in this lane becomes much cheaper. This
      would be the most consequential outcome and it requires independent review
      before description.
    - >-
      The audit returns NOT APPLICABLE for the sources' OWN declared settings.
      Instrument failure; the ordinary verdict is discarded and nothing is read.
    - >-
      The measured cost ratio does not decrease with log p across the grid. The
      reduction is not asymptotically negligible in the measured model and the
      model or the implementation is wrong; reported either way.
    - >-
      The crossover bit size comes out below 20. Toy-scale invocations of JMV are
      then measured fact rather than asymptotic borrowing, contradicting this
      record's reading.
    - >-
      If Part 3 runs and the mixing ratio against the random abelian Cayley null
      differs from 1 by more than 20 percent in either direction. Faster is
      structure and is a finding; slower means JMV's constants are worse than the
      asymptotic statement suggests and every level-uniformity argument relying
      on it must be re-costed.
    - >-
      The zero-step null reports nonzero cost. Measurement leak; everything void.

  confounders:
    - >-
      Modular-polynomial evaluation cost varies enormously with the
      implementation and with whether Phi_ell is precomputed. The contract must
      fix ONE implementation and ONE precomputation policy across all sizes, and
      report the policy, or the fitted scaling measures the library rather than
      the mathematics.
    - >-
      The number of walk steps is a parameter, not a measurement, unless the
      stopping criterion is fixed in advance. It is fixed by a declared
      total-variation target at toy sizes and by JMV's Proposition 3.1 formula at
      medium sizes, and the two regimes are reported separately and never pooled.
    - >-
      The class-group structure computation is subexponential and would dominate
      everything at medium sizes if charged per call; it is a one-time
      precomputation and must appear as its own column, amortised identically in
      every arm.
    - >-
      Comparing a walk cost against 0.886*sqrt(N) compares a polylog quantity to
      an exponential one, so the ratio is guaranteed to fall; the informative
      quantity is the CROSSOVER, not the ratio's sign, and the record must not
      present the guaranteed fall as a finding.
    - >-
      KN-LIT-1449 and KN-LIT-1778 are corpus entries at confidence "reported",
      generated by a bulk seeding pass from the first two pages of a PDF. An audit
      built on a mis-parsed hypothesis would be confidently wrong; every quoted
      hypothesis must be checked against the local PDF and the check recorded, and
      where the local copy is unavailable the verdict is marked undetermined
      rather than guessed.

  interpretation_limits:
    - >-
      Nothing here is an attack, an attack-cost improvement, or evidence about
      any curve's security. RQ-JMV-001's constraints forbid all three and this
      record is designed to satisfy that by construction.
    - >-
      Nothing here confirms or disconfirms GRH. Every JMV-derived statement is
      conditional exactly as the source is.
    - >-
      The audit is a statement about the audited hypotheses of two papers at the
      confidence the corpus assigns them. It is not an impossibility claim about
      re-randomisation in the ordinary lane, and a NOT APPLICABLE verdict names
      what would change it - a construction that supplies the required torsion
      without the extension, or a variant whose hypotheses the ordinary lane
      meets.
    - >-
      Cost-model results are scoped to the declared model (Proposition 3.1 walk
      length, O(ell^3) per step, one fixed implementation) and are not statements
      about real attack cost.
    - >-
      Level-census evidence is toy tier and says nothing about P-256, per
      RQ-JMV-001's own constraint.
    - >-
      Timeouts, crashes and infrastructure failures are never negative
      mathematical evidence (AGENTS.md rule 5).

  heuristic_assumptions:
    - id: H-RR-1
      statement: >-
        The number of steps of the JMV walk needed to reach total-variation
        distance epsilon from uniform on Cl(O), using prime-ideal generators of
        norm at most m, is O(log h / log(1/lambda_2)) with lambda_2 the second
        eigenvalue, and the GRH-conditional bound m of order (log h)^{2+delta}
        suffices - i.e. the graph behaves as an expander with the proved gap
        rather than merely with an asymptotic one.
      rigorous_support: >-
        Rigorous ingredient - the eigenvalues of an abelian Cayley graph are
        character sums, and for Cl(O) with prime-ideal generators they are Hecke
        character sums bounded under GRH; the mixing-time bound from a spectral
        gap is standard and exact. Distribution imitated - that the character sums
        behave like sums of independent random unit-modulus terms, which is the
        random-model justification behind the GRH bound being tight rather than
        merely valid.
      validation_plan: >-
        Measured at toy sizes where Cl(O) is fully enumerable, as a RATIO against
        a matched random abelian Cayley graph of identical order and degree
        (Part 3, secondary and coordinated with EXP-JMV-003 so the eigenvalue
        computation is not duplicated). Comparison distribution - the mixing curve
        of the random abelian Cayley null, not an absolute theoretical curve, for
        exactly the reason IDEA-20260806-bcbcf5 gives. Tail check - the walk
        length at the 95th percentile over seeds, not just the mean, since a
        heavy tail in hitting times would break the reduction's usefulness while
        leaving the mean intact. Sampled parameters (orders, degrees, seeds)
        recorded. TRANSFER ASSUMPTION STATED - toy Cl(O) uses the full generating
        set while the GRH statement restricts to norms at most (log h)^{2+delta},
        so toy mixing UPPER-bounds the quality available at scale and nothing is
        extrapolated to cryptographic sizes.
    - id: H-RR-2
      statement: >-
        For an ordinary curve over F_p and a level M chosen as an
        effective-action construction would require, ord(pi mod M) is of size
        about M for almost all M, so the required torsion field of definition has
        superpolynomial degree.
      rigorous_support: >-
        Rigorous ingredient - pi reduces to an element of (O/MO)^* whose group
        order is exactly computable from the splitting behaviour of M in O.
        Distribution imitated - the classical distribution of multiplicative
        orders of random residues (Erdos-Pomerance-type statistics). This is
        IDEA-20260808-bba3dc's HA-1 restated; it is CREDITED to that record and
        its validation is that record's minimal test, which this one does not
        duplicate.
      validation_plan: >-
        No new sampling. This record consumes bba3dc's measurement if it has run,
        and if it has not, the audit's corresponding line is marked UNDETERMINED
        rather than assumed. That dependency is recorded in the artifact, and
        IDEA-20260812-104e1a in this same batch challenges one INFERENCE from the
        same budget (kernel specification needs Galois stability, not a rational
        basis) - the audit must state which of the two readings its verdict uses
        and report the verdict under both if they differ.

  target_complexity:
    time_exponent: >-
      not_applicable. No algorithm and no attack is proposed, and RQ-JMV-001's
      constraints forbid one. This record improves no exponent, no constant, and
      no log cofactor of any ECDLP algorithm, and says so rather than dressing a
      measurement as a claim.
    memory_exponent: >-
      not_applicable for the same reason. The measurement itself needs O(h)
      memory at toy sizes to enumerate Cl(O) and O(1) at medium sizes.
    best_known: >-
      For the object being priced there is no competing measurement - RQ-JMV-001's
      own motivation (G1) records the concrete field-operation cost of the JMV
      reduction as absent from the literature. For the ECDLP itself the incumbent
      is Pollard rho with negation at 0.886*sqrt(N)/sqrt(2) time and O(1) memory,
      and nothing here approaches it or claims to.
    hidden_overhead: >-
      Three items, disclosed. The class-group structure computation is
      subexponential and is a separate column rather than a hidden constant; the
      GRH conditionality is inherited and cannot be measured away; and the
      per-step modular-polynomial cost is implementation-dependent by a large
      factor, which is why one implementation is fixed and reported.
    tradeoff_note: >-
      Not applicable - no attack. The one tradeoff worth recording is that the
      class-group precomputation amortises across all instances on the same
      curve, so a re-randomiser's per-call cost and its precomputation charge must
      be reported separately or a multi-instance setting will look free when it is
      not.

  dominated_by: >-
    n/a (no result claimed) for the attack frontier - this record proposes no
    algorithm, and RQ-JMV-001 forbids one. Stated explicitly rather than left as
    an unchecked null - the ECDLP frontier rows were nonetheless checked as
    recorded in this corpus (Pollard rho with negation; BSGS; van
    Oorschot-Wiener parallel rho; the multi-target frontier sqrt(L*N); the
    preprocessing frontier S*T^2 = Omega(epsilon*N), the last two relayed via
    IDEA-20260802-005 and NOT independently re-verified this session), and every
    one of them dominates anything this record could produce, which is expected
    and by design. For the MEASUREMENT there is no competing instrument in the
    corpus - EXP-JMV-001 and EXP-JMV-004(a) are the approved JMV experiments and
    neither prices a re-randomisation against the instance it randomises, and
    none of the unapproved set audits the post-2023 effective-action results.
  sota_delta:
    time_exponent: >-
      not_applicable - no algorithm, no exponent. Not a constant factor dressed
      as an exponent either; the record improves nothing about any attack.
    memory_exponent: not_applicable, same reason.
    data_or_query_exponent: not_applicable, same reason.
    note: >-
      The delta is a costed re-randomiser table where the corpus currently has an
      assumption. Its priority rests entirely on being a required building block
      for the exemplar pattern in docs/target-result-profile.md - that pattern's
      third ingredient is a re-randomisation step with an explicit mixing-time
      justification, and this lane has never established that it owns one. Under
      the exponent-first bias this record is LOW-AMBITION by construction, and it
      is recommended at medium priority on building-block grounds and on cheapness
      (Part 1 costs no compute at all), exactly as
      agents/idea-generator.md requires such a record to say.

  estimated_cost:
