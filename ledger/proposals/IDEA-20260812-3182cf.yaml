    compute: low
  compute_budget_note: >-
    Part 1 costs zero compute and is the highest-value component. Part 2 fits
    inside RQ-JMV-001's declared 2 CPU-hour track budget with room to spare -
    instrumented counting at p up to 2^56 for a polylog-length walk is minutes,
