  minimal_test:
    design: >-
      CELLS. (a) The 845a77-review cell: n = 19, f = t^19 + t^5 + t^2 + t + 1,
      A = 46693, B = 306147, h = 2, m = 3, l = 6, |V| = 64, 400 subgroup
      targets of which 40 planted. (b) 4b65e3's cap-locus cells at n in {17,
      19}: (17, 3, 7), (19, 3, 8), (17, 4, 6), (19, 4, 6), on RC-1 and the
      n = 19 ordinary curve, 400 targets each, plus the Koblitz siblings
      y^2 + xy = x^3 + x^2 + 1 at n = 17 and y^2 + xy = x^3 + 1 at n = 19
      (orders recounted at setup). (c) Optional extension to n in {23, 29,
      31} once a general-n field module exists (a 4b65e3 prerequisite, not
      this record's). TABLE ARITY h = ceil(m/2) (2 at both m). INSTRUMENT.
      experiments/EXP-CERTBIN-e94b27/impl/gf2n.py and curve.py; the
      prime-field engine's tails.py and decompose.py as the specification to
      port (about 250 lines new: binary tail packing with the y/x orientation
      bit, one-inversion pair step, vectorised linear-membership probe,
      operation counters, the loop beside it, a schoolbook verifier with no
      shared import). Nothing missing. PROCEDURE. (1) Build V-points and the
      loop; run the loop on every target (ground truth, multisets stored).
      (2) Build the table; check table_entries against the exact count.
      (3) Run the port on every target; compare multisets; verify every
      relation independently. (4) Run the identical port on the relabelled
      Z/NZ (N = #E) with a random base of size |V-points| and on the random-
      subset null base; compare counts. (5) Fit theta_mitm and theta_loop
      across the cells at fixed m; report against floor(m/2)/m and 1 - 1/m.
      (6) Convert counts to group-op equivalents with the c98e92 rows and
      emit the "generic oracle" row per cell. SEEDS: one PCG64 stream per cell
      for targets and controls, recorded. METRICS (units): agreement
      (fraction); inversions, multiplications, squarings, probes, entries
      (counts) per target and per table; group-op equivalents (via c98e92);
      theta (dimensionless, with interval); wall-clock (secondary).
      CONTROLS. Loop ground truth on every target (blocking). Relabelled Z/NZ
      generic control (blocking; a group-structure claim is made, that none
      is used). Random-subset null base (counts must match V's). Koblitz
      versus ordinary arms (counts must match). Independent verifier on every
      relation. OUTCOME TABLE. POSITIVE (E-EXACT): the port is accepted as the
      ground-truth oracle for m in {3, 4} CERTBIN designs; 4b65e3's ladder is
      re-costed; the generic-oracle row is filed per cell. NEGATIVE: none as a
      research outcome; a tooling record's negative is E-DEFECT. ARTIFACT
      (E-DEFECT): multiset disagreement, verifier failure, table size off, or
      E/Z/NZ count ratio not 1; the port is rejected until localised, and any
      later rate that used it is void. FALSIFICATION THRESHOLD, FIXED NOW:
      one multiset disagreement or one verifier failure on any target, or a
      count ratio other than exactly 1. COST (estimate): implementation
      medium (about 250 lines plus the port's test battery mirroring the
      prime-field tests); compute minutes per cell in pure Python at n <= 19
      (the loop at (19, 4, 6): 2^12 x 2^12 / 6 about 2^22 additions per
      target x 400 targets is the largest item, order an hour; the port's
      probes are seconds).
    controls:
      - 'The (m-1)-fold loop as ground truth on every target (blocking).'
      - 'Relabelled Z/NZ generic-group control with identical operation counts (blocking).'
      - 'Random-subset null base of matched size (counts must match the subspace base).'
      - 'Koblitz-form siblings at n in {17, 19} (counts must match the ordinary curves).'
      - 'Independent schoolbook verification of every relation; exact tail-count check of the table.'
    required_metrics:
      - 'relation_multiset_agreement per cell'
      - 'per-target and per-table operation counts by kind, and in group-op equivalents'
      - 'generic_group_count_ratio per cell'
      - 'theta_mitm and theta_loop per m with intervals'
      - 'table_entries and peak table bytes per cell'

  falsification_conditions:
    - 'E-EXACT falsified iff any target shows a multiset disagreement with the loop or a verifier failure.'
    - 'Genericity falsified iff the E count differs from the Z/NZ count at matched |V| and targets.'
    - 'The calibration line is falsified for the port iff theta_mitm deviates from floor(m/2)/m by more than 0.05 with the loop reading 1 - 1/m; then the counter or the amortisation accounting is wrong, localised first.'

  confounders:
    - >-
      The table half is target-independent and amortises over the cell's
      targets; per-target cost is reported with and without the amortised
      table share (the 845a77 review's correction).
    - >-
      At m = 3 with h = 2 the port's per-target probe is |V|, the same order
      as oracle A at m = 2; the saving over the loop is one factor |V|, not
      two, and the record says so.
    - >-
      Memory: the table holds about (2|V|)^2/4 tails at h = 2 (2^17 entries
      at d = 9), trivial at toy scale but the resource that grows as
      N^{h/m}; reported in bytes beside the counts.
    - >-
      Targets that are sums of fewer than m base points are reached only in
      orders whose partial sums avoid infinity (tails.py rule); the loop and
      the port must apply the identical rule, which the multiset check
      enforces.

  interpretation_limits:
    - 'Tooling at toy scale; no attack; on ECC2K-130 the MITM oracle is closed at every m by the product law (per-attempt 2^{floor(m/2) n/m} against a budget of 2^{(1/2 - 1/m) n}).'
    - 'KN-OPEN-020 class of V: scoped-out linear subspace, inherited.'
    - 'The port is the generic null for structural oracles; it never certifies anything about them beyond the ratio measured beside it.'

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Amortisation count.) At the cap locus a cell tries about B_cap
        targets (one relation per target at mu about 1), so the table's
        |V|^h cost divided by B_cap = |V| is |V|^{h-1} per target, which is
        what makes theta_mitm = floor(m/2)/m rather than ceil(m/2)/m.
      rigorous_support: >-
        Exact bookkeeping given the target count; the Poisson decomposition
        count H1 of IDEA-20260926-4b65e3 supplies the target count and is
        validated there.
      validation_plan: >-
