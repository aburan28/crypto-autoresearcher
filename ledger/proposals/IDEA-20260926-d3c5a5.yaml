  proof_search_map:
    bottleneck: >-
      An exact, cheap, solver-free ground truth for m >= 3 decomposition
      attempts on the CERTBIN cells, without which every W_D refutation rate
      and every theta(m) fit at m >= 3 has no oracle to be checked against
      but the (m-1)-fold loop, whose cost caps the ladder at n = 31, m = 4.
    baseline_embedding:
      parameter_slice: >-
        The prime-field engine's own frozen regression (identical relations
        on every stored instance of results/sweep-mitm-20260926) is the
        baseline the port's LOGIC must reproduce; the binary baseline is the
        loop's multiset on every target of the n = 19 cell at m = 3, l = 6
        (the 845a77 review's cell) before any other cell is run.
      reproduction_check: >-
        Frozen fixture: 400 targets (40 planted) at (19, 3, 6): multiset
        agreement 400/400 with the loop; every relation re-verified by
        schoolbook curve arithmetic independent of the table code
        (s3_eval_school-style, no shared import); the exact tail count
        C(2 x 64 + 1, 2)-style prediction against the built table size.
    observation_collision:
      observable: The relation multiset per target and the operation count per target.
      distinct_preimage_search: >-
        Two engines can agree on the multiset and differ in count (that is
        the point); two can agree in count and differ in multiset only if one
        is wrong. A count on E equal to the count on the relabelled Z/NZ
        certifies genericity; a smaller count on E would mean a curve-specific
        shortcut was used and the port is not the null it claims to be.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The h-fold sumset of the base, materialised once as a table keyed
          by abscissa with an orientation bit, replacing the inner (m-1-h)
          levels of the loop by a probe.
        predicted_gain: >-
          Per-target cost |V|^{m-h} instead of |V|^{m-1}; at (31, 4, 9) about
          2^18 probes instead of 2^27/6 additions; theta_mitm = floor(m/2)/m
          at the cap locus, a known answer.
    quantifier_order: >-
      FOR ALL targets of the named cells, the port's multiset equals the
      loop's (a correctness claim, checked exhaustively at toy scale); FOR the
      named cells the fitted theta is as measured. NOT CLAIMED: anything about
      a structural oracle; the port is the generic baseline such an oracle is
      compared to.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the named cells the port is exact, generic (E and Z/NZ counts
        equal), and costs [counts] per target, with fitted theta [value]
        against floor(m/2)/m." It can never certify a cost below the generic
        line and it says nothing at n = 131 beyond the closed-form closure
        already stated.
      nearby_object_control: >-
        The relabelled Z/NZ with a random base of matched size (the object
        where the count must be identical) and a random 2^d-element subset of
        abscissae in place of V (the null base, where the linear membership
        test is replaced by a set lookup and the counts must again match).
    proof_obligations:
      - claim: Multiset agreement with the loop on every target of every cell, including targets that are sums of fewer than m base points and targets using the 2-torsion point.
        responsibility: correctness
      - claim: Every relation re-verified by independent schoolbook arithmetic.
        responsibility: correctness
      - claim: E and Z/NZ operation counts identical at matched |V| and targets.
        responsibility: correctness
      - claim: Table size equals the exact tail count predicted from |V| and h.
        responsibility: size
      - claim: theta_mitm reads floor(m/2)/m within 0.05 on the ladder and theta_loop reads 1 - 1/m.
        responsibility: runtime
      - claim: No figure at n = 131 beyond the closed-form closure.
        responsibility: scope
    not_applicable_reason: null

