  assumptions:
    - >-
      The subspace base V = {deg < d} in polynomial basis on the CERTBIN
      curves; the base's points are the lifts of every abscissa in V that is
      an abscissa, with both signs.
    - >-
      The loop of IDEA-20260904-96c4f3 is implemented beside the port as the
