idea:
  id: IDEA-20260926-d3c5a5
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    A BINARY PORT OF THE PRIME-FIELD MEET-IN-THE-MIDDLE ENGINE (table of
    tails keyed by abscissa, one shared inversion per pair) as the solver-free,
    certificate-producing ground-truth oracle for the m = 3 and m = 4 CERTBIN
    cells, with the exact calibration line theta_mitm = floor(m/2)/m at the
    cap locus that every algebraic oracle on the (1/2 - 1/m) ladder is read
    against
  class: tooling

  claim: >-
    CEILING FIRST. No exponent moves and nothing here bears on ECC2K-130
    except negatively. Representation R1 (abscissa in polynomial basis on the
    CERTBIN cells); the attack stage served is RELATION DECOMPOSITION, as an
    exact ORACLE for measurement, not as an attack. Target arity m in {3, 4}
    on toy cells; on ECC2K-130 the per-attempt budget at the cap locus is
    about 2^11 (m = 4) and 2^32 (m = 5) group-op equivalents
    (IDEA-20260926-4b65e3 (B)) and the MITM oracle misses both by tens of
    bits, as computed below.

    THE GAP. RQ-CERTBIN-836ce2's decision target (1) asks for the fully
    charged per-relation cost as a function of m; IDEA-20260926-4b65e3 fixes
    the locus (d_cap = ceil((n + log2 m!)/m)) and the line (1/2 - 1/m) and
    proposes cells at n in {17, 19, 23, 29, 31}, m in {3, 4}; its ground truth
    is the (m-1)-fold loop of IDEA-20260904-96c4f3 at 2^{(m-1) d}/(m-1)! group
    operations per target, which at its top cell (n, m, d) = (31, 4, 9) is
    2^27/6 additions per target, "hours to a day in pure Python and the
    largest single item". A two-list meet-in-the-middle over the same
    subspace base costs 2^{2d} table entries once and 2^{2d}/2 probes per
    target at m = 4 (about 2^18 at d = 9), so the same cell costs seconds and
    the whole ladder becomes affordable at 200 targets per cell rather than
    40. The prime-field engine that does exactly this landed on main
    (src/crypto_autoresearcher/index_calculus/tails.py, decompose.py,
    --engine mitm): every signed h-fold sum stored once per factor base, keyed
    by x-coordinate, with F + S and F - S obtained from one shared inversion,
    and a proven-identical relation set against exhaustive search on every
    target kind. The review of IDEA-20260922-845a77 named the binary port as
    "the natural ground-truth control for the m = 3 and m = 4 CERTBIN cells".
    This record specifies the port and its calibration content.

    WHAT CHANGES IN CHARACTERISTIC 2 (the port is not a transliteration).
    (i) Negation is (x, y) -> (x, x + y), so the stored orientation bit is
    the least significant bit of y/x (the two roots z of z^2 + z = c differ by
    1), not "y above p/2". (ii) The one-inversion pair trick holds: for
    P = (x_1, y_1), S = (x_2, y_2), x(P + S) and x(P - S) both come from
    lambda_+ = (y_1 + y_2)/(x_1 + x_2) and lambda_- = (y_1 + y_2 + x_2)/(x_1 +
    x_2), one inversion of x_1 + x_2, so a table level costs one inversion,
    four multiplications and two squarings per (F, T) pair (my count from
    curve.py add; recheck). (iii) Membership is a GF(2) linear test (x in V)
    rather than a set lookup, so the probe half can be VECTORISED over the
    whole base: at m = 3 with h = 2 the probe for a target R is "for each F in
    V-points, is x(R - F) in the table", 2^d probes; at m = 4 with h = 2 it is
    2^{2d}/2 probes of x(R - F_1 - F_2). (iv) The order-4l or 2l group has
    2-torsion: the tail rule "every suffix has nonzero sum" is kept verbatim
    and the 2-torsion point (x = 0) is a legal base element only if 0 in V,
    which it is for every {deg < d}; the engine must reproduce the loop's
    decomposition MULTISET including sums that use it. (v) Unit: the
    prime-field engine charges one "S_3 solve" per stored pair; the port
    charges field inversions, multiplications and squarings separately and
    reports group-op equivalents through the exchange-rate rows of
    IDEA-20260926-c98e92 (this lane), so the column is in the boundary
    table's unit from the first run.

    THE CALIBRATION LINE, DERIVED (zero compute, my arithmetic). At the cap
    locus |V| = B_cap = (m! 2^n)^{1/m}, table arity h = ceil(m/2), the probe
    half costs |V|^{m-h} = |V|^{floor(m/2)} per target and the table
    |V|^{ceil(m/2)} once, amortised over about B_cap targets, so the
    per-attempt cost exponent in n is theta_mitm(m) = floor(m/2)/m: 1/3 at
    m = 3, 1/2 at m = 4, 2/5 at m = 5, 1/2 at m = 6; the README's model
    N^{max(h, m-h+1)/m} for the TOTAL at |F| = N^{1/m} agrees (3/4 measured
    0.75 at m = 4, 3/5 measured 0.60 at m = 5). Against 4b65e3's budget line
    1/2 - 1/m the generic MITM oracle sits 1/m above it at even m and 1/(2m)
    above it at odd m; in bits at n = 131 that is 2^{n/m} = 2^32.75 at m = 4
    and 2^{131/10} x const = 2^13 at m = 5 above the budget in exponent
    alone (and further by the constants sqrt(m!)), so the MITM oracle is
    CLOSED on ECC2K-130 at every m by the product law, as the 845a77 review
    already found at the free-oracle optimum; the new statement is the
    exponent form, which is exactly the gap a structural oracle must close:
    a generic oracle costs 2^{floor(m/2) n/m} per attempt, the line asks for
    2^{(1/2 - 1/m) n}, and the difference is 2^{n/m} at even m, i.e. exactly
    one factor B_cap. On the toy ladder this is a KNOWN-ANSWER line the
    fitted theta of the port must read to within 0.05 (with the loop at
    1 - 1/m as the second known answer), which is what makes the port a
    calibration arm and not only a speed-up.

    THE TWO READINGS. E-EXACT: the port's relation multiset equals the loop's
    on every target of every cell (400 targets per cell at m in {3, 4}, n in
    {17, 19}), its certificates verify, and its fitted theta reads
    floor(m/2)/m within 0.05 on both E and the relabelled Z/NZ control with
    identical operation counts; the port is then the ground-truth oracle for
    every m = 3, 4 CERTBIN design and 4b65e3's ladder is re-costed with it.
    E-DEFECT: any multiset disagreement, certificate failure, or an E-versus-
    Z/NZ count ratio other than 1 (a curve-specific shortcut crept in); the
    port is rejected until localised. There is no third reading; a tooling
    record either reproduces ground truth or it does not.

  mechanism: >-
    OBJECT FRAME. Representation R1; Sigma = translation by factor-base
    elements (Class I, partial action), unchanged; no tracked object is
    added. TRICHOTOMY: Class I, as for every F2 solver; the oracle is a
    SOLVER CHOICE inside the family (the 845a77 review's reading), not an
    object. LOSSY-PROJECTION TEST: not applicable; the table is keyed by the
    exact abscissa, discards nothing relative to the loop, and finds the same
    multiset by construction (both search the same equation). WHY IT IS
    GENERIC AND WHY THAT IS THE POINT: the engine uses the group law only to
    add points and equality only to match abscissae, so it runs identically
    on the relabelled Z/NZ with a random base of the same size; the identical
    count is the tell that no curve structure is used, and it is what
    qualifies the port as the structureless null every structural oracle in
    RQ-CERTBIN-836ce2 must beat (the same role brute-force pair enumeration
    played in KN-FIND-aa2efc, where it beat the Riemann-Roch oracle by 2x).
    THE ONE OPEN NUMBER is the measured operation count per target at each
    cell in group-op equivalents, which becomes the "generic oracle" row of
    the boundary table. OFF-LIMITS COMPONENTS: F2 (the family) and the
    textbook Horowitz-Sahni split (recalled, as in 845a77); nothing new is
    claimed about either.

