idea:
  id: IDEA-20260816-b6de60
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: Treat a HAWK-shaped signature transcript as a communication channel and count its leakage
    rate in bits per signature about the secret Gram matrix, using an estimator whose floor is measured
    in the same run on transcripts generated from a public-equivalent basis.
  class: measurement
  claim: '(A) A signature in a HAWK-shaped scheme is a short vector produced by sampling relative
    to the secret basis, so a transcript is a sequence of samples whose distribution depends on the
    secret. Whether that dependence is negligible is a design question the scheme''s own analysis
    answers; whether this program can MEASURE the dependence at toy scale, with a stated estimator
    and a stated floor, is an open and answerable measurement question that nothing in this corpus
    has attempted. (B) The claim is that a transcript admits a counted leakage rate rather than a
    yes/no leak verdict: define the observable as the empirical second-moment matrix of the first
    t signatures, define the target as the secret Gram matrix up to the isometry the scheme quotients
    by, and define the leakage rate as the rate at which a declared distance between the empirical
    second moment and the target decreases in t, fitted as an exponent on t over at least two decades
    of t. The claim is that this exponent is measurable at ring degrees 4 and 8 with a bootstrap error
    bar, and that it is the honest counted quantity that a bits-per-signature statement must be derived
    from rather than asserted. (C) The claim is that the measurement is only interpretable against
    a floor measured in the same run: transcripts generated by sampling relative to a PUBLIC-EQUIVALENT
    basis - a different basis of the same lattice, obtainable from public data by a declared reduction
    - carry by construction no information distinguishing them from a secret-basis transcript beyond
    what the lattice itself determines, so the identical estimator run on those transcripts gives
    the convergence rate attributable to the lattice rather than to the secret. The signal arm means
    something only if its exponent differs from the floor arm''s by more than the bootstrap intervals.
    (D) NOT CLAIMED: that HAWK or any HAWK-shaped scheme leaks; that any measured convergence implies
    key recovery, forgery, or any security consequence whatsoever; that the toy-scale sampler used
    here matches HAWK''s sampler, which this program has not read; that a measured exponent extrapolates
    to any parameter set. This is a measurement contract with an explicitly bounded conclusion, and
    a null outcome - both arms at the same exponent - is a fully reportable controlled null.'
  mechanism: 'Stage 1 declares the toy sampler explicitly: a discrete Gaussian over the lattice with
    a declared width, sampled by exact rejection over a small enumeration region, using the secret
    basis in the signal arm and a public-equivalent basis in the floor arm. Both arms use one code
    path with a basis argument, so the control is executable in the same invocation as the signal,
    as the record contract requires. Stage 2 defines the observable and the target: the empirical
    second moment M_t = (1/t) sum over the first t signature vectors of v v-transpose, and the target
    Q = the secret Gram matrix normalised to unit determinant, with distance measured by a declared,
    isometry-aware metric - the relative Frobenius distance after the best alignment over the finite
    automorphism group computed at toy degree. Stage 3 sweeps t over a geometric ladder from 100 to
    10^6 signatures at ring degree 4 and to 10^5 at degree 8, computing the distance at each t, with
    20 independent transcripts per configuration for error bars. Stage 4 fits the exponent: log distance
    regressed on log t, with the fitted slope and its bootstrap interval as the primary metric. A
    slope near -1/2 is the generic statistical rate expected from any consistent estimator and is
    therefore the null expectation, not evidence of leakage; the informative outcome is a slope materially
    different from -1/2 or a difference between arms. Stage 5 runs the floor arm identically. Stage
    6 runs a second null: transcripts of vectors drawn from a lattice-independent distribution with
    matched norms, where no convergence to Q should occur at all, confirming the estimator can fail.
    Stage 7 emits exponents, intercepts, bootstrap intervals and the arm differences, with no conversion
    to bits unless the fitted model supports it and, if converted, with the conversion formula stated
    and its assumptions listed.'
  novelty_status: unverified
  novelty_screen:
    method: Grep -ril 'signature transcript' over ledger/proposals/ returned 7 files; grep -ril 'transcript'
      returned a larger set of which I inspected the headers of IDEA-20260808-baf8bc, IDEA-20260806-c5d183
      and noted IDEA-20260809-83371c, IDEA-20260809-7d450f, IDEA-20260809-2ba70c, IDEA-20260805-59fa23
      by filename. Grep -ril 'hawk|module-lip|nrd-pip|lattice isomorphism' over ledger/proposals/
      returned 11 files, all titles read. Read ledger/questions/RQ-HAWK-001.yaml in full including
      its constraints block, knowledge/open-problems/KN-OPEN-027.md and KN-OPEN-028.md in full, and
      the scope statements of H-HAWK-c7a551 and H-HAWK-a28be6. Read the anti-duplication list items
      on SQIsign signing timing and retry side channels (IDEA-20260815-824c71, dc0277, e72354).
    results: 'The transcript-bearing proposals in the corpus are on other schemes: the ones I inspected
      are Classic McEliece (IDEA-20260808-baf8bc) and ECDLP (IDEA-20260806-c5d183). None of the 11
      HAWK-touching proposals concerns signature transcripts at all - they are split between the tau-cocycle/involution
      lattice lane (IDEA-20260805-6eac55, IDEA-20260805-128f35, IDEA-20260808-b1358c), cost-model
      audits of the Straznickas-Weis exact-SVP call (IDEA-20260805-3a855d, IDEA-20260807-90479e),
      attack reimplementation (IDEA-20260801-019), and cross-scheme transfers. The anti-duplication
      list explicitly retires SQIsign signing timing and retry side channels; this entry is deliberately
      NOT a timing or retry channel - it measures the statistical convergence of the signature distribution
      itself, uses no timing measurement anywhere, and would give identical results on an infinitely
      fast constant-time implementation. RQ-HAWK-001''s constraints block requires that no per-scheme
      technical claim be treated as verified until primary sources are filed, which is why the sampler
      here is declared rather than taken from HAWK.'
    verdict: 'UNVERIFIED. Claimed new: the framing of a HAWK-shaped transcript as a channel with a
      FITTED CONVERGENCE EXPONENT rather than a leak/no-leak verdict, and the use of a public-equivalent-basis
      transcript arm as an in-run estimator floor - the second of these is what makes the exponent
      interpretable and is the part I would defend as the contribution. Assembled from known parts:
      transcript-statistics analysis of lattice signature schemes is an entirely standard idea class;
      second-moment estimation and log-log slope fitting are textbook; the discipline of measuring
      the estimator floor in the same invocation is docs/inventor-protocol.md section 3. This program
      cannot read external literature and asserts nothing about whether this measurement or its result
      exists outside; in particular no claim is made that HAWK''s own analysis does or does not already
      settle it.'
  object_first_candidate:
    tracked_object: 'The empirical second-moment matrix M_t of a signature transcript, followed as
      t grows: a symmetric 2n-by-2n integer-or-rational matrix that accumulates one rank-one update
      per signature. What is tracked through the computation is its declared isometry-aware distance
      to the normalised secret Gram matrix, as a function of t.'
    lossiness: 'Genuinely lossy. The transcript is a sequence of t vectors, 2nt integers; M_t retains
      only n(2n+1) numbers regardless of t, discarding the order of the signatures, all higher moments,
      and every individual vector. The discard is compatible with the operation of interest because
      the sampler is (by declaration) an origin-symmetric distribution whose covariance is the quantity
      the secret basis determines - so the second moment is exactly the statistic the operation acts
      on, while everything discarded is either symmetric noise or ordering that the sampler makes
      exchangeable. What does NOT survive: any adaptive or sequential structure, any per-signature
      outlier information, and any dependence carried in the fourth moment - all of which are named
      here as out of scope rather than silently dropped.'
    propagation: 'One step of the target operation is the arrival of one more signature: M_t maps
      to M_{t+1} = (t M_t + v v-transpose)/(t+1). This is a deterministic rank-one update, so the
      object propagates exactly; the randomness lives entirely in v. The convergence question is then
      a question about a martingale-like sequence with a deterministic update rule, which is why an
      exponent is the right deliverable.'
    survival_score: 'The second-moment description survives as long as the sampler''s covariance is
      a faithful function of the basis, which holds by construction for the declared toy sampler and
      would begin to dissolve for any sampler with basis-dependent higher moments. Concretely: survives
      to t = 10^6 at ring degree 4 and t = 10^5 at degree 8 within the enumeration budget, and dissolves
      at ring degree 16 where exact rejection sampling to the declared width becomes budget-bound.
      That crossover degree is a reported number.'
  null_object_control: 'Two nulls, both executed in the same invocation as the signal arm through
    the same code path. Null one, the FLOOR: transcripts generated by sampling with respect to a public-equivalent
    basis of the same lattice - a declared reduced basis derivable from the public form - which by
    construction determines the same lattice and therefore the same limiting covariance, so any convergence
    it shows is attributable to the lattice, not the secret. Null two, the ESTIMATOR-CAN-FAIL control:
    transcripts of vectors drawn from a lattice-independent distribution with matched norm profile,
    where no convergence to the secret Gram should occur at all. For the signal arm to mean anything:
    null two must show NO convergence (fitted slope statistically indistinguishable from zero), proving
    the estimator is not converging by construction; and the signal arm''s fitted exponent must differ
    from null one''s by more than the sum of their bootstrap intervals. If the signal arm and null
    one have the same exponent, the transcript carries nothing about the secret beyond the lattice
    at this scale, and that is recorded as a controlled null.'
  discriminated_from:
  - 'IDEA-20260815-824c71, dc0277 and e72354 (SQIsign signing timing and retry side channels), named
    in the anti-duplication list: those are timing and control-flow channels on a different scheme.
    This entry measures no time, no retry count and no control flow; it would return the same numbers
    on a perfectly constant-time implementation, because the channel it counts is the signature distribution
    itself.'
  - 'The tau-cocycle and involution lane (IDEA-20260805-6eac55, IDEA-20260805-128f35, IDEA-20260808-b1358c):
    those construct auxiliary lattices from Galois structure and certify forced values with zero randomness;
    this entry has no cocycle, no involution and no forced value, and its whole content is statistical
    convergence.'
  - 'IDEA-20260805-3a855d and IDEA-20260807-90479e (cost-model and exact-SVP-call audits): those charge
    gates and memory columns for an existing reduction; this entry runs no reduction and charges no
    gates.'
  - 'A conventional leak/no-leak statistical test on transcripts: the deliverable here is deliberately
    not a test verdict but a fitted exponent with an in-run floor, because a verdict at toy scale
    would be uninterpretable while an exponent with a floor is a number a later session can re-scope.'
  - 'EV-HAWK-c99848 and the Case C argument: entirely on the ideal-counting side downstream of the
    reduction, with no transcript, no sampler and no statistics.'
  assumptions:
  - The declared toy sampler is origin-symmetric with covariance a faithful function of the basis;
    if it is not, the second moment is the wrong statistic and the contract must change its observable.
  - Exact rejection sampling to the declared width is feasible at ring degrees 4 and 8 with enough
    throughput to reach t = 10^6 and 10^5 respectively.
  - A public-equivalent basis is constructible at toy degree by a declared deterministic reduction
    from the public form; if this construction is not available, the floor arm cannot be built and
    the contract cannot run as specified.
  - The finite automorphism group needed for the isometry-aware alignment is computable at these degrees,
    as assumed in the matched-pair contract in this batch.
  - The declared sampler stands in for HAWK's sampler only as a shape, and no property of HAWK's actual
    sampler is assumed, since this program has not read the Round-3 specification.
  predictions:
  - metric: fitted log-log convergence exponent of the isometry-aware distance in t, signal arm, ring
      degree 4
    direction: different
    minimum_effect: 'forced value: -0.5, the generic statistical rate; an exponent within 0.05 of
      -0.5 is the null expectation and is NOT evidence of anything'
  - metric: difference between signal-arm and floor-arm fitted exponents
    direction: different
    minimum_effect: 0.05 in absolute value, and larger than the sum of the two bootstrap 95 percent
      half-widths; below that the arms are indistinguishable and the result is a controlled null
  - metric: fitted exponent of null two (lattice-independent matched-norm vectors)
    direction: different
    minimum_effect: 'forced value: 0.0 within its bootstrap interval; a nonzero slope here invalidates
      the estimator'
  - metric: largest ring degree at which t = 10^5 signatures is reachable within the sampling budget
    direction: different
    minimum_effect: 'refusal to pre-commit: rejection-sampling acceptance rates at the declared width
      are not known before the width is fixed, and guessing would be a fabricated expectation'
  minimal_test:
    design: 'Ring degree 4 only, one invocation, three arms sharing one code path with a basis-or-distribution
      argument. Generate one HAWK-SHAPED instance by the declared rule; derive a public-equivalent
      basis by the declared reduction; build the lattice-independent matched-norm sampler. For each
      arm, generate 20 independent transcripts of 10^6 vectors each by exact rejection sampling at
      the declared width. At a geometric ladder of t values (100, 300, 1000, ..., 10^6) compute M_t
      and its isometry-aware distance to the normalised secret Gram matrix. Fit log distance against
      log t per transcript, take the median slope and a bootstrap interval across the 20 transcripts,
      per arm. The discriminating output is three fitted exponents with intervals: signal, floor,
      and the estimator-can-fail null. If the signal and floor exponents coincide within intervals,
      the contract has produced its controlled null at the cheapest possible scale and the ring degree
      8 arm need not run. Total cost is hours of single-core CPU at degree 4.'
    controls:
    - 'Floor arm: public-equivalent-basis transcripts, identical sampler width, identical estimator,
      same invocation.'
    - 'Estimator-can-fail null: lattice-independent vectors with matched norm profile, same estimator,
      same invocation; must show zero slope.'
    - 'Shuffled-transcript control: reprocess the signal arm''s own vectors in a random order and
      confirm the exponent is unchanged, since the estimator must be order-independent by construction;
      a change indicates an implementation bug.'
    - 'Width-sensitivity control: repeat at a second declared sampler width and report both, since
      the convergence rate may be width-driven rather than basis-driven.'
    - 'Two independent instances: repeat the whole design on a second HAWK-shaped instance, so that
      no exponent rests on one lattice.'
    required_metrics:
    - fitted log-log exponent per arm with bootstrap 95 percent interval
    - fitted intercept per arm (the constant, which carries the practically relevant magnitude)
    - isometry-aware distance at each t on the geometric ladder, per arm, per transcript
    - acceptance rate and wall-clock of the rejection sampler per arm
    - exponent difference between signal and floor arms with a bootstrap interval on the difference
    - exponent stability across the two sampler widths and the two instances
  falsification_conditions:
  - 'Signal and floor arms have the same fitted exponent within intervals: the transcript carries
    nothing about the secret beyond the lattice at this scale - a controlled null and the most likely
    outcome.'
  - The estimator-can-fail null shows a nonzero slope, meaning the estimator converges regardless
    of input and every number is void.
  - The shuffled-transcript control changes the exponent, indicating an order-dependence bug in an
    estimator that must be order-independent.
  - The public-equivalent basis cannot be derived from the public form at toy degree, so the floor
    arm does not exist and no signal-arm number is interpretable.
  - Exponents differ materially between the two sampler widths, meaning the measured quantity is a
    property of the width rather than of the basis.
  - Rejection sampling acceptance falls low enough that t = 10^5 is unreachable at ring degree 4,
    in which case the contract reports a budget limit and NOT a negative result.
  confounders:
  - 'Sampler width interacts with basis quality: a narrow width relative to the basis makes the covariance
    more basis-dependent for reasons of the width, not of secrecy.'
  - The public-equivalent basis is derived by a declared reduction whose output quality varies per
    instance, so the floor arm's level is instance-dependent and must be reported per instance.
  - Isometry-aware alignment over a finite automorphism group can fail to find the best alignment,
    inflating distances asymmetrically if one arm's lattice has a larger automorphism group.
  - Finite-precision arithmetic in the distance computation would bias small distances at large t;
    the contract requires exact rational arithmetic for M_t and controlled-precision arithmetic only
    in the final norm, with the precision recorded.
  - The declared sampler is not HAWK's sampler, and any difference in tail behaviour between them
    changes the second-moment convergence in ways this contract cannot detect.
  interpretation_limits:
  - A measured convergence exponent is not a key-recovery statement, not a forgery statement, and
    not a security statement of any kind; no such conclusion may be drawn from any value this contract
    produces.
  - All numbers are at ring degree 4 and possibly 8, on HAWK-SHAPED declared-rule instances with a
    declared toy sampler, and RQ-HAWK-001's constraint block forbids reading them as statements about
    deployed HAWK parameters.
  - The second moment is one statistic; a null result here says nothing about higher moments, adaptive
    queries, or any other channel, and those are explicitly out of scope rather than excluded.
  - The floor arm bounds what the lattice alone explains under THIS estimator; a different estimator
    could have a different floor and the two are not comparable.
  target_complexity:
    time_exponent: 'No attack exponent is claimed and none follows: the fitted exponent is a statistical
      convergence rate in the number of signatures, not a computational cost exponent, and the contract
      forbids converting one into the other.'
    memory_exponent: No attack memory exponent is claimed. The estimator is streaming - one 2n-by-2n
      matrix - so memory is independent of transcript length.
    best_known: For HAWK-shaped key recovery, Straznickas-Weis unconditional 2^{(n/2+1)+o(n)} (KN-LIT-7592)
      is the incumbent and is a KEY-ONLY attack requiring no transcript. Any transcript-based statement
      would have to be compared against it on equal terms including data cost, and this contract produces
      no attack, so no comparison is made.
    hidden_overhead: 'Two costs hide here. The rejection sampler''s acceptance rate is unknown before
      the width is fixed and can silently dominate the whole run. And the isometry-aware alignment
      is where correctness is most fragile: a lazily implemented alignment turns a null result into
      an apparent signal, and there is no cheap automatic check for it beyond the shuffled-transcript
      and estimator-can-fail controls.'
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    2^{(n/2+1)+o(n)} with zero data cost (KN-LIT-7592); nrd-PIP super-polynomial, underived, zero
    data cost (KN-LIT-7674); definite/indefinite LIP reporting HAWK unaffected (KN-LIT-7648); the
    SLIP AM-intersect-coAM ceiling (KN-LIT-7671) - plus generic lattice reduction on the 2n-dimensional
    lattice. Every one of these is key-only, so on the data axis they all dominate any transcript-consuming
    approach trivially, and this entry claims no attack in any case: n/a (no result claimed).'
  sota_delta: No attack; measurement contribution only. The quantity moved is the second-moment convergence
    exponent of a HAWK-shaped transcript relative to an in-run public-equivalent-basis floor, which
    goes from unmeasured in this corpus to measured with a bootstrap interval at ring degree 4 and
    possibly 8.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part (B), that the exponent is measurable with a usable error bar at
    ring degree 4: 0.7, the main risk being rejection-sampler throughput. Part (C), that the public-equivalent-basis
    floor arm is constructible at all: 0.55 - deriving a public-equivalent basis by a declared deterministic
    reduction is routine in principle but the ''equivalent'' has to be exact for the floor to mean
    what the contract says, and I have not verified that it can be. That the signal and floor exponents
    DIFFER: 0.2, and I record that low number deliberately - a well-designed sampler should make them
    equal, so the expected outcome is the controlled null, which is precisely why the contract is
    written to make a null fully reportable. Probability the entry''s real value is the floor-arm
    methodology rather than any number it produces: 0.5.'
