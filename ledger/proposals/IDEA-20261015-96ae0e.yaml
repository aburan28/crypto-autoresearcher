idea:
  id: IDEA-20261015-96ae0e
  question_id: RQ-CMFB-33610e
  added: '2026-10-15'
  title: >-
    Canonical-lift (xedni) route for the pair-46 crater: the lift-box DLP costs
    >= (r+1) sqrt(N) at every Mordell-Weil rank, CM doubles the effective rank
    over K, and the single open number is a twist-rank census
  class: measurement
  claim: >-
    (A) The crater is E_d mod p for E_d the quadratic twist of a CM(-19)
    curve E_0/Q (j = -96^3, recalled; Executor confirms) with d in one square
    class mod p, so infinitely many global lifts exist at zero cost and
    rank r_d is a free choice. Since E_d and E_{-19d} are Q-isogenous (via
    [sqrt(-19)]), rank E_d(K) = 2 r_d and E_d(K) is an O_K-module. (B) For any
    rank, lifts hand the attacker r_eff = 2 r_d known points b_i = red(B_i) of
    G and nothing else: finding P = sum a_i b_i in a box of volume V costs
    >= sqrt(V) group ops, succeeds with probability V/N, and each success is
    one equation in the r_eff + 1 unknowns (log b_i, k). Expected cost
    >= (r_eff + 1) N / sqrt(V) >= (r_eff + 1) sqrt(N), equality at V = N. No
    rank beats rho; rank only sets the lift height H ~ N^{2/r_eff}
    (IDEA-20260807-6533fd). (C) Heights for N = 2^52.4: r_eff = 2, 4, 6, 8
    gives log2 H ~ 52, 26, 17.5, 13 (up to regulator). CM doubling puts a
    Q-rank-3 twist at r_eff = 6, outside the "r <= 4" regime where 6533fd
    closes by representation cost alone. (D) Canonical d: if L(E_0/K,1) != 0
    then E_0(K) is finite and red has image {O} (IDEA-20260807-44ba75).
  mechanism: >-
    PAIR: representation = rational/K-rational lifts of G points on a global
    twist (R3: lift to characteristic 0); operation set Sigma = red_p, the
    O_K-linear reduction E_d(K) -> G, plus translation by lattice points.
    TRICHOTOMY: Class I partial-action (cosets of ker red translate exactly;
    shortness does not). LOSSY-PROJECTION TEST: red discards ker(red), a
    sublattice of index N containing (pi - 1) E_d(K) with pi = vw - 1; this is
    a quotient by a block system of Sigma, lossy, deterministic. The priced
    quantity is the shortest coset representative (successive minima,
    IDEA-20260905-44de87), not the rank. Delta over 6533fd / 44ba75 / 5158fa:
    (i) the rank-independent box-DLP cost bound, (ii) the K-doubling,
    (iii) the pair-46 table and the one measurable number r_max(d).
  novelty_status: adaptation
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-cd159a
      - KR-IC-5931ee
      - KR-RHO-13bf67
      - KR-IC-791cb7
    nearest:
      - ref: KN-LIT-021
        provenance: kb
        relation: special_case
        delta: >-
          JKSST show xedni succeeds with negligible probability; here the cost
          law (r+1) sqrt(N) is rank-independent and the pair-46 numbers are
          explicit.
      - ref: KN-LIT-020
        provenance: kb
        relation: adjacent
        delta: Silverman's xedni needs a small-rank global curve through lifts.
      - ref: KN-FIND-b7e091
        provenance: internal
        relation: adjacent
        delta: GGM closure; (B) is its lift-specific quantitative form.
      - ref: KR-RHO-13bf67
        provenance: kb
        relation: special_case
        delta: >-
          (B) leans on the generic-group bound: red and the box search use
          only group operations on G with r_eff extra known points, so
          Omega(sqrt N) applies; the factor r_eff + 1 counts equations, it is
          not an improvement. A lift description that is not a coefficient box
          would use the representation and is outside (B).
      - ref: KR-IC-791cb7
        provenance: kb
        relation: orthogonal
        delta: binary-field GHS and isogeny walks; this record is prime-field only.
  citations:
    - ref: IDEA-20260807-6533fd
      provenance: internal
      claim: lift height B = Theta(N^{2/r}); representation cost N^{2/r}
      verified_by: idea-generator (claim read 2026-10-15)
  assumptions:
    - Model and CM discriminant of E_0 are recalled, not checked here.
  proof_search_map:
    bottleneck: shortest coset of ker(red) in E_d(K), equivalently the DLP
    baseline_embedding:
      parameter_slice: r_d = 1 over Q (r_eff = 2) is plain BSGS in a 2-box
      reproduction_check: toy member, one b_i, box DLP = ordinary DLP
    observation_collision:
      observable: reduction image and kernel lattice of red
      distinct_preimage_search: P and P + kernel vector share the observable
    quantifier_order: for all ranks r_eff, for all boxes V <= N
    method_ceiling:
      strongest_certifiable_claim: >-
        cost >= (r_eff + 1) sqrt(N) in the box-membership model; silent on
        non-box lift descriptions
      nearby_object_control: function-field xedni (EV-XEDN-001 open arm)
  predictions:
    - metric: share of admissible d <= 10^4 with Q-rank >= 3
      direction: lower
      minimum_effect: below 2 percent (H1)
    - metric: box-DLP group ops divided by sqrt(N) on toy rank >= 2 twists
      direction: higher
      minimum_effect: at least 0.7
    - metric: rank of E_0(K)
      direction: different
      minimum_effect: exactly 0, so red has image {O} on the canonical lift
  minimal_test:
    design: >-
      PARI ellrank on E_d for admissible d <= 10^4 (histogram of Q-ranks,
      r_eff = 2 r_d), against a non-CM twist family of equal conductor size.
      Toy member p ~ 2^24 with a rank >= 2 twist: reduce the basis, run
      generalised BSGS for random ECDLPs, count group ops.
    controls:
      - non-CM twist family null
      - random-lattice DLP
      - rank-1 twist
    required_metrics: [rank histogram, ops per sqrt(N), kernel shortest vector]
  falsification_conditions:
    - box-DLP ops < 0.5 sqrt(N) on >= 3 toy instances (lifts leak)
    - rank >= 3 share >= 2 percent (the K-doubling regime is not rare)
  confounders: [square-class bookkeeping for d, torsion in E_d(K), conductor]
  interpretation_limits: >-
    Rank-3 twists would not open an attack; they only move which closure
    applies. KN-OPEN-020 class: implicit (target-dependent lift). Function-
    field and prescribed-section xedni are untouched.
  heuristic_assumptions:
    - id: H1
      statement: Q-rank >= 3 has density < 2 percent among admissible d <= 10^4.
      rigorous_support: >-
        parity and root-number equidistribution for twist families (Delaunay,
        Katz-Sarnak heuristics; recalled and unread)
      validation_plan: >-
        census vs the non-CM null at the same size; tail = max rank found;
        no transfer to 2^52 beyond the formula in (C)
  target_complexity:
    time_exponent: (r_eff + 1) N^{1/2}
    memory_exponent: O(1) to N^{1/2} (kangaroo vs BSGS)
    best_known: rho 0.886 sqrt(N), O(1) memory
    hidden_overhead: lift height arithmetic of 2^13..2^52 bits if lifted
  dominated_by: n/a (no result claimed); dominated by rho
  sota_delta: none
  estimated_cost: {implementation: low, compute: low}
  recommended_priority: low
  status: proposed
