      verified_by: idea-generator, this session, via ledger/questions/RQ-SSI-001.yaml
    - ref: "Yui, Cartier-Manin matrix of a hyperelliptic Jacobian"
      provenance: recalled
      claim: >-
        Recalled pointer, paper not opened: for y^2 = f over a field of
        odd characteristic, the Cartier-Manin matrix is read from
        coefficients of f^{(p-1)/2}, and its corank is the a-number.
        The elliptic control in this record is what accepts or rejects
        the index convention.
      verified_by: null
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group discrete logarithm in a group of prime order p
        needs Omega(square root of p) group operations.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - >-
      The Cartier-Manin index convention is whichever convention makes
      the elliptic control accept: the 1 by 1 entry vanishes if and
      only if the trace is divisible by 5. A convention that fails that
      control is not used to read surface ranks.
    - >-
      a-number = g - rank(C) for this matrix, and a-number adds on a
      product of elliptic curves. Both are part of the dictionary the
      elliptic control checks in dimension 1.
    - >-
      Squarefree monic quintics over F_5 are a complete finite list.
      The claim is about that list.
  predictions:
    - metric: set of Cartier-Manin ranks of y^2 = f for monic squarefree quintics f over F_5
      direction: different
      minimum_effect: >-
        The set equals {0, 1, 2}. Its size is 3. The elliptic control
        at the same prime has rank-image size 2.
    - metric: number of elliptic curves over F_5 whose Cartier entry vanishes while the trace is nonzero, plus the converse mismatches
      direction: lower
      minimum_effect: >-
        Both mismatch counts are 0. A positive count means the
        convention is rejected and the surface set is not interpreted.
  minimal_test:
    design: >-
      List every monic squarefree quintic over F_5 (5^5 = 3125 monic
      quintics before the squarefree filter). For each, compute
      f^{(5-1)/2} = f^2 and the 2 by 2 Cartier-Manin matrix under a
      frozen index convention. Record the multiset of ranks. Separately
      list elliptic curves over F_5 in short Weierstrass form, compute
      the coefficient of x^{4} in f^2 (the g = 1 case of the same
      convention) and the trace, and count mismatches with the rule
      "entry vanishes if and only if 5 divides the trace". Also build
      one product of two trace-zero elliptic curves when the elliptic
      list contains one, and record that its a-number, read as the sum
      of the factors' a-numbers, equals 2. No path-finding and no
      endomorphism-ring computation.
    controls:
      - >-
        Elliptic dictionary control. Mismatch count 0 against trace
        divisible by 5. If the mismatch count is positive, stop and
        report the convention as rejected.
      - >-
        Superspecial product control. Two supersingular elliptic curves
        (trace divisible by 5) have a-number 1 each under the accepted
        convention, and the product is assigned a-number 2. A Jacobian
        of Cartier rank 1 is then a different p-torsion scheme from
        that product. If F_5 has no trace-zero elliptic curve, record
        that the product control did not run; that absence is an
        instrument gap, and the rank set is still reported.
      - >-
        Repeated-factor control. A quintic with a square factor is
        excluded before the matrix is read. If a squareful polynomial
        is accepted into the rank multiset, the filter failed.
    required_metrics:
      - rank image on the squarefree monic quintics
      - size of that image
      - elliptic mismatch count
      - whether a trace-zero elliptic curve over F_5 exists in the list
      - count of rank-1 quintics and count of rank-0 quintics
  falsification_conditions:
    - >-
      The rank image on the squarefree monic quintics is a proper
      subset of {0, 1, 2}. The three group-scheme ranks do not all
      occur for odd-degree genus-2 models over F_5.
    - >-
      The elliptic mismatch count is positive. The Cartier entry is
      then not the supersingularity bit in dimension 1, and the surface
      ranks are not read as a-numbers.
  confounders:
    - >-
      Even-degree models y^2 = sextic are a different compactification.
      They are outside this list. A rank missing here can still occur
      for a sextic; the claim is scoped to quintics.
    - >-
      Rank 2 (a-number 0) is the ordinary candidate. Confirming p-rank
      equals 2 needs the stable rank of the Frobenius-twisted product
      of Cartier matrices, which this test does not require for the
      primary image. The primary claim is the rank image, not a Newton
      polygon.
    - >-
      p = 5 is small. A rank that appears once is still in the image.
      The claim does not say the intermediate scheme exists at every
      prime.
  interpretation_limits:
    - >-
      Toy scope: F_5, genus at most 2, odd-degree hyperelliptic models
      and elliptic curves. No statement about cryptographic primes, about
      CSIDH, or about SQIsign parameters.
    - >-
      The supersingular-isogeny exponents named by RQ-SSI-001 stay where
      they are. This record produces a set of three ranks. It does not
      produce a path, a collision, or an endomorphism ring.
    - >-
      KN-LIT-948's construction algorithms were not run. Agreement of
      the rank image with {0, 1, 2} is not a reproduction of that paper.
    - >-
      Geometric point counts of A[p] remain the p-rank. They are the
      wrong invariant for the superspecial comparison, which is why the
      metric is the matrix rank.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For y^2 = f over F_p, p odd, f monic squarefree of degree
        2g+1, the a-number of the Jacobian equals g minus the F_p-rank
        of the Cartier-Manin matrix of f^{(p-1)/2}, once the index
        convention agrees with the Hasse invariant in genus 1.
      rigorous_support: >-
        In genus 1 the Hasse invariant is the coefficient of x^{p-1}
        in f^{(p-1)/2}, and it vanishes if and only if the curve is
        supersingular. That equivalence is the classical Deuring
        criterion's computational form. H1 is the extension of that
        one-coefficient test to the corank of the g by g matrix.
      validation_plan: >-
        The sample is the complete set of short-Weierstrass elliptic
        curves over F_5, not a draw. Compare vanishing of the Cartier
        entry with divisibility of the trace by 5. The tail check is
        the mismatch count, required to be 0. Transfer to genus 2 is
        the content of the surface enumeration: it is executed at the
        same p, on the complete quintic list, and is not extrapolated
        to larger p. Sampled parameter: p = 5 only.
    - id: H2
      statement: >-
        a-number is additive on a product of elliptic curves over an
        algebraically closed field of characteristic p. Two
        supersingular factors give a superspecial surface of a-number 2.
      rigorous_support: >-
        Hom(alpha_p, G x H) has dimension dim Hom(alpha_p, G) plus
        dim Hom(alpha_p, H), because a homomorphism into a product is a
        pair of homomorphisms. This is the universal property of the
        product, applied to the group scheme alpha_p.
      validation_plan: >-
        On the elliptic list over F_5, each trace-zero curve contributes
        a-number 1 under the convention H1's control accepted. The
        product is assigned the sum 2. The check is that both factors
        individually have Cartier entry 0. No sampling distribution: the
        list is complete. If the list contains no trace-zero curve, H2
        is not tested at this prime and the gap is reported.
  target_complexity:
