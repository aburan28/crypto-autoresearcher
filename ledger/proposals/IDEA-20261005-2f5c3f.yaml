      KN-LIT-948's abstract (classification and construction claims,
      no runtime numeral in the note). For discrete logarithms, the
      opened baseline is KR-RHO-13bf67, Omega(p^{1/2}) generic-group
      operations. Neither numeral moves.
    hidden_overhead: >-
      None in an o(1) term. The output is a set of at most three ranks
      and two mismatch counts.
    tradeoff_note: >-
      No time-memory tradeoff. The enumeration is linear in the number
      of monic quintics, 3125 before the squarefree filter, each a
      constant-size matrix.
