idea:
  id: IDEA-20261005-2f5c3f
  question_id: RQ-SSI-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Cartier-Manin rank splits ordinary, intermediate, and superspecial
    p-torsion on genus-2 Jacobians over F_5
  class: measurement
  claim: >-
    No Honda-Tate research question exists in ledger/questions (searched
    for Honda, group scheme, p-torsion, and superspecial). This record
    binds to RQ-SSI-001 for that reason. On every monic squarefree
    quintic f over F_5, form the genus-2 curve y^2 = f and its 2 by 2
    Cartier-Manin matrix, using the coefficient convention that the
    elliptic control below accepts. The set of matrix ranks equals
    {0, 1, 2}. Rank 2 means a-number 0: the etale quotient of the
    p-torsion group scheme can have rank p^2, the ordinary shape.
    Rank 0 means a-number 2: Hom(alpha_p, A[p]) has dimension 2, the
    superspecial group scheme, the p-torsion of a product of two
    supersingular elliptic curves. Rank 1 means a-number 1: the
    p-torsion group scheme is neither of those. The same instrument on
    elliptic curves over F_5 has rank set of size 2, because in
    dimension 1 the supersingular group scheme and the superspecial
    group scheme are the same scheme. No isogeny-path exponent moves.
  mechanism: >-
    The p-torsion A[p] is a finite group scheme of rank p^{2g}. Two
    integers determine the comparisons this test makes. The p-rank is
    the rank of the largest etale quotient, equal to the number of
    geometric points of A[p] divided by the log base p: ordinary means
    p-rank = g, so A[p] has p^g geometric points and a multiplicative
    connected subgroup. The a-number is the dimension of
    Hom(alpha_p, A[p]). Superspecial means a-number = g, which forces
    the Cartier-Manin matrix to be the zero matrix and forces p-rank 0,
    so A[p] is local-local and has a single geometric point. Counting
    geometric points separates p-rank 0 from p-rank g and does not
    separate a-number 1 from a-number g: both of those schemes are
    local and both have one geometric point. The a-number is the
    infinitesimal invariant that separates them. For a hyperelliptic
    Jacobian in odd characteristic the classical dictionary sets the
    a-number equal to g minus the rank of one Cartier-Manin matrix.
    At g = 1 that dictionary says the 1 by 1 entry vanishes exactly on
    the supersingular curves, which are also the superspecial curves.
    At g = 2 the three ranks 0, 1, and 2 are three group-scheme
    statements. The elliptic control must show a rank image of size 2.
    The surface enumeration must show a rank image of size 3. A surface
    image of size 2 means that, on this prime and these models, the
    intermediate scheme does not occur.
    The product of two supersingular elliptic curves is the superspecial
    control: each factor has a-number 1, and a-number adds under
    products, so the product has a-number 2. A Jacobian whose
    Cartier-Manin rank is 1 has a-number 1 and its p-torsion is a
    different group scheme from that product.
  novelty_status: unverified
  citations:
