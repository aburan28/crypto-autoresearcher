      verified_by: null
  assumptions:
    - W simple (T^6 - tT^3 + Q irreducible); decomposable classes (j in F_q) are reported apart.
    - The class contains an indecomposable principally polarised variety; to be checked per class at design.
  proof_search_map:
    not_applicable_reason: measurement with a derived existence argument (Torelli, Serre); no new theorem is claimed
  predictions:
    - metric: share of admissible classes t holding a genus-3 curve, q = 2, 3, 4, 5
      direction: higher
      minimum_effect: ">= 1/2 of classes, 100% of {t,-t} pairs, odd #E(K) included"
    - metric: genus-3 curves per class, log-log slope in q (q = 2..5, 7 hyperelliptic)
      direction: equals
      minimum_effect: "3 +/- 0.7"
    - metric: n = 2 control, share of ordinary classes holding a genus-2 curve
      direction: equals
      minimum_effect: 1 (GHS gives genus 2 for every E/F_{q^2})
    - metric: hyperelliptic counts at t vs -t
      direction: equals
      minimum_effect: exact (quadratic twist bijection); plane-quartic counts may differ
  minimal_test:
    design: >-
      (1) n = 2: all genus-2 curves over F_q, q <= 11, tabulate N_1, N_2; classes (q+1, q^2+1-2t) and coverage.
      (2) n = 3: all hyperelliptic genus-3 curves (q <= 7) and all plane quartics (q = 2, 3 exhaustive; 4 and 5 a
      fixed-seed sample, size stated), filter N_1 = q+1, N_2 = q^2+1, record N_3, hence t, hyperelliptic or not,
      #E(K) = Q + 1 - t mod 4. (3) Compare to the sibling GHS classes (4 dividing #E(K)) and tabulate classes
      outside them. (4) Fit the count per class against q.
    controls:
      - "Positive: n = 2 (every ordinary class is hit); every n = 3 class with 4 | #E(K) is hit (the sibling census finds GHS genus 3 there)."
      - "Negative: curves with N_1 = q+1 only, to show the second filter is not vacuous; classes with reducible char poly are not claimed."
      - "Nearby object: Joux-Vitse hyperelliptic family at q = 7 inside the hyperelliptic list."
    required_metrics: [q, n, t, "#E(K) mod 4", curves per class, hyperelliptic share, coverage and sample seed]
  falsification_conditions:
    - An irreducible class t with no genus-3 curve in t or -t at an exhaustive field refutes the Torelli-plus-Serre argument for it (record the class).
    - "A class with 4 | #E(K) and no hit signals an enumeration error (invalid, not null)."
    - Slope outside 3 +/- 0.7 refutes the density heuristic H1.
  confounders:
    - Smoothness of plane quartics must be tested over extensions of degree <= 3; a singular quartic has the wrong L-polynomial.
    - Characteristic 2 and q = 4 need their own models (y^2 + hy = f); separate rows. Sampled quartics at q = 4, 5 give lower bounds only.
  interpretation_limits:
    - A genus-3 Jacobian in the class is not a discrete-logarithm transfer; the isogeny degree and its explicitness are unmeasured.
    - Toy q only; n = 5 is not enumerated (only the exponent is stated).
  heuristic_assumptions:
    - id: H1
      statement: The coefficients c_1..c_n of a random genus-n curve behave as independent with spread ~ q^(i/2).
      rigorous_support: Weil bounds fix the spreads; equidistribution of Frobenius angles (Katz-Sarnak) is the imitated theorem.
      validation_plan: n = 2 (q <= 11) and n = 3 (q = 2..5) counts per class against c q^e(n), slope and constant, tail by worst class.
    - id: H2
      statement: Half of the ppav in the class are Jacobians (the Serre twist sign), independently per class.
      rigorous_support: Serre's twist theorem for non-hyperelliptic genus 3.
      validation_plan: ratio of counts at t and -t for plane quartics against 1.
