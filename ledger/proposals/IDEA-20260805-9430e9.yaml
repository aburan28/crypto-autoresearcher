idea:
  id: IDEA-20260805-9430e9
  question_id: RQ-CRYPTO-001
  added: '2026-08-05'
  title: >-
    Sensitivity audit of GOAL-CRYPTO-001's own Gate A / Gate B discovery screen:
    thirteen batches of FINAL_NO_CANDIDATE from an instrument that has never been
    shown capable of returning PASS
  class: control

  claim: >-
    GOAL-CRYPTO-001 has run thirteen batches. Every batch's screening instrument
    -- the six-field Gate A discovery fingerprint and the seven-field Gate B
    readiness fingerprint recorded in
    coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml
    -- has returned FAIL on every record it has ever examined, and the campaign's
    terminal disposition is FINAL_NO_CANDIDATE. NO RECORD ANYWHERE IN THIS
    REPOSITORY EXHIBITS THAT SCREEN RETURNING PASS ON ANYTHING. An instrument
    with a 0/N pass rate and no demonstrated sensitivity is, under the inventor
    protocol's controls-before-belief obligation and KN-TECH-1a5b7e's
    catalogue of controls that pass without being able to fail, not entitled to
    the inference the goal has drawn from it. THE CLAIM IS NOT THAT THE SCREEN
    IS WRONG. The claim is that its 0/N record is currently uninterpretable, and
    that one zero-compute experiment makes it interpretable: present the screen,
    BLIND, with fingerprint-only descriptions of historical ECDLP mechanisms
    that demonstrably DID beat generic baselines on their target class, together
    with matched null fingerprints of identical shape and no mathematical
    content, and measure the pass rate on each arm. Both outcomes are
    deliverables. If the screen passes the planted positives and fails the
    nulls, thirteen batches of FINAL_NO_CANDIDATE become supported evidence
    about the literature rather than an uncontrolled measurement, and the goal is
    strictly stronger. If it fails a planted positive, the screen has a
    identifiable defect, the campaign's disposition is scoped to "no candidate
    THAT THIS SCREEN CAN SEE", and the repair is named.

  object_first_candidate:
    tracked_object: >-
      The six-field Gate A discovery fingerprint --
      (factor_base_or_representation, relation_or_direct_solve_predicate,
      target_dependence, witness_source_semantics,
      falsifiable_claimed_metric_gain_and_direction,
      semantic_distinction_from_prior_CRYPTO_routes) -- followed as an object
      from a mechanism, through the rubric, to a PASS/FAIL verdict. The
      computation being audited is the screening procedure itself; the
      mechanisms are its inputs, and the verdict is its output.
    established_families_off_limits: >-
      Off-limits as the primary lens: every ECDLP attack family. This proposal
      does not propose, evaluate, improve or screen an attack. Specifically
      off-limits are Semaev/summation-polynomial index calculus, Groebner
      solving-degree instrumentation, BKK/mixed volume, xedni and lifting,
      Weil descent, isogeny and class-group transfers, spectral-gap and
      expander arguments, and rho refinements -- the families every prior
      CRYPTO batch cycled through. The target here is the METER, not the
      terrain, and the generation contract lists "attack the measurement, not
      the target" as the move this program has most often left alone.
    newness_score: >-
      Genuinely new for this goal, and cheaply checkable as such: the goal's
      thirteen batch directories contain screens, receipts, red-team
      confirmations and decisions, and none of them contains a planted-positive
      arm, a null arm, or any statement of the screen's sensitivity. The
      program-wide measurement is worse: 188 of 229 evidence records (82%) have
      no positive control, and only 26 of 195 experiment specifications mention
      one. This proposal is an instance of a program-wide gap, applied to the
      one goal whose entire output is screen verdicts.
    testability_score: >-
      Maximal, and zero compute. The rubric is a documented field checklist; the
      experiment is its execution against a pre-registered, blinded input set
      with a frozen scoring rule. The only cost is careful construction of the
      input set and an independent scorer.
    survival_score: >-
      The object survives exactly as far as the rubric is well-defined. Where it
      dissolves is at the field
      semantic_distinction_from_prior_CRYPTO_routes, which is history-dependent
      rather than a property of the mechanism -- a genuine mechanism can fail it
      merely by having been screened before, and BATCH-013 records exactly that
      happening to ePrint 2024/1923 ("FAIL_duplicate_prior_screen"). Identifying
      that field as the load-bearing one is itself part of the deliverable.

  mechanism: >-
    WHAT THE SCREEN IS. Reading the committed artifact: Gate A requires six
    fields be present and non-degenerate for a candidate mechanism; Gate B
    requires seven readiness fields (oracle_transcript, exact_source_replay,
    relation_yield_and_independent_rank,
    fresh_scalar_blind_descent_or_direct_solve, preprocessing_memory_traffic,
    certificate_interfaces, fully_charged_cost_vs_matched_rho). A candidate
    passes only if both gates pass. The BATCH-013 screen examined five entries
    (one prior-screened prime-field index-calculus preprint, three quantum
    resource/circuit preprints, and one aggregate "classical priors reaffirmed"
    row) and returned FAIL on all five at both gates.

    THE STRUCTURAL PROBLEM, STATED PRECISELY. A screen's verdict is informative
    about the world only in proportion to its sensitivity -- P(PASS | the input
    really is an admissible mechanism). Nothing in thirteen batches estimates
    that quantity. Two hypotheses are consistent with every observation on
    record: (S) the screen is sensitive and the checked literature genuinely
    contains no admissible candidate; (I) the screen's conjunction of thirteen
    required fields is so restrictive that no real mechanism description
    satisfies it, and the FAIL stream is a property of the rubric. These are
    DISTINGUISHABLE, and distinguishing them costs no compute. The measurement
    that distinguishes them is the standard one this program has skipped 188
    times: run the instrument on an object where the effect MUST appear.

    CONSTRUCTING THE PLANTED POSITIVES HONESTLY. A planted positive must be a
    mechanism that is (i) real, (ii) documented, (iii) known to give a large
    advantage over a generic baseline on SOME class of curves, and (iv) capable
    of producing a certificate. Candidates, each carrying its provenance label:
      P1 -- Pohlig-Hellman on a smooth-order group. Advantage over rho is
        enormous and unconditional; certificate is a scalar. RECALLED, standard.
      P2 -- the anomalous-curve (trace one, #E = p) attack of the
        Smart / Satoh-Araki / Semaev line: linear time on an ORDINARY
        PRIME-FIELD curve, i.e. squarely inside RQ-CRYPTO-001's declared scope.
        RECALLED, NOT READ; the corpus's own DEC-20260804-2fae6a treats the
        underlying Tate isogeny result as unconditional.
      P3 -- the MOV / Frey-Ruck pairing transfer on a small-embedding-degree
        curve. Prime-field, ordinary or supersingular, certificate-producing.
        RECALLED, NOT READ. Its census is IDEA-20260805-a749bc.
      P4 -- Gaudry-Semaev-Diem index calculus for E(F_{q^n}), n > 1. Beats rho
        asymptotically on its class. RECALLED, NOT READ. NOTE: it is NOT
        prime-field, so it must be scored as a SCOPE rejection rather than a
        mechanism rejection, and the scoring rule must be able to tell those
        apart -- which is itself a test of the rubric.
      P5 -- GHS Weil descent over composite binary fields. Same scope caveat.
    THE ADMISSION QUESTION IS NOT "IS THIS NEW". It is: does the rubric, given a
    faithful fingerprint of a mechanism that really works, emit PASS? P1, P2 and
    P3 are prime-field-compatible and are the core positives; P4 and P5 are
    scope-boundary probes.

    CONSTRUCTING THE MATCHED NULLS. A null must have the same SHAPE -- the same
    six fields, filled with the same register of language, the same level of
    specificity -- and no mathematical content. Three are specified:
      N1 -- a "descent via a randomly chosen degree-3 rational map" with no
        rationality or degree condition stated, so no relation can be produced.
      N2 -- a mechanism whose claimed gain is stated as a direction with no
        magnitude ("asymptotically faster"), which is precisely what the field
        falsifiable_claimed_metric_gain_and_direction exists to reject.
      N3 -- a verbatim re-fingerprint of a mechanism already screened and
        rejected in an earlier batch, with the surface vocabulary changed. This
        one is the sharpest: it tests whether the rubric detects a repackaging
        or is fooled by notation, which is the failure mode the inventor
        protocol's section 1 says is "often invisible because the variant
        arrives in new notation".
    FORCED VALUES, DERIVED BEFORE ANY SCORING. Nulls must FAIL: N1 fails
    relation_or_direct_solve_predicate, N2 fails
    falsifiable_claimed_metric_gain_and_direction, N3 fails
    semantic_distinction_from_prior_CRYPTO_routes. Those are three DIFFERENT
    fields, so a screen that fails all three nulls for the same reason is
    responding to something other than the fields it names -- a check that can
    actually fail. Positives P1-P3 must PASS Gate A on all six fields; whether
    they pass Gate B is a SEPARATE and much harder question, because Gate B
    demands artifacts (oracle transcript, source replay, charged cost) that a
    literature record cannot supply. THE PRE-DERIVED PREDICTION IS THEREFORE
    ASYMMETRIC AND SHARP: Gate A passes the positives, Gate B fails them for a
    reason that is about ARTIFACT AVAILABILITY and not about the mechanism.
    If that is what the audit finds, then the campaign's thirteen FAILs at
    Gate B were never evidence about mechanisms at all, and the goal's screen
    should be restructured so that a Gate-A pass with a Gate-B artifact gap
    routes to an implementation task instead of to NO_CANDIDATE.

    BLINDING, AND WHY IT IS NOT OPTIONAL. If the scorer knows that P2 is "the
    anomalous curve attack", the scoring measures the scorer's knowledge, not the
    rubric. The input set is therefore presented as an unordered, shuffled list
    of fingerprints with all proper nouns, dates, citations and author names
    removed, under opaque labels, with positives and nulls interleaved by a
    seeded permutation committed before scoring. The unblinding key is
    hash-committed before the first verdict is written.

    THE COVERAGE DENOMINATOR, A SECOND FREE MEASUREMENT. Independently of
    sensitivity, the screen's coverage is a countable quantity nobody has
    counted. BATCH-013's own coverage block records 3 WebSearch lists, 10
    displayed items, and 6 Crossref requests. Summing the analogous blocks over
    all thirteen batches gives the exact size of the finite set over which
    "FINAL" is asserted. If that number is in the tens, "FINAL_NO_CANDIDATE" is
    a statement about tens of records -- which is precisely the inventor
    protocol section 4 distinction between a closure and a fatigue report, and
    the count is the argument. Related and free: the goal has screened only
    EXTERNAL literature; inputs/h100_session/ holds a hypothesis reservoir that
    ledger/REVIEW-H100-20260717.md reports as largely unmeasured, and no batch
    of this goal has ever pointed Gate A at it. That is a named, addressable
    coverage hole, and naming it is forward guidance rather than a complaint.

  novelty_status: unverified

  literature_context:
    - >-
      IN-CORPUS, READ THIS SESSION:
      coordination/goals/GOAL-CRYPTO-001/batches/BATCH-013/tasks/TASK-20260731-001/discovery_readiness_screen.yaml
      (the instrument, verdict FINAL_NO_CANDIDATE, five checked records, all
      FAIL at both gates, coverage 3 WebSearch lists / 10 displayed items /
      6 Crossref requests); ledger/evidence/EV-CRYPTO-013.yaml; and
      ledger/goals/GOAL-CRYPTO-001.yaml. The other twelve batch directories were
      NOT opened record-by-record in this session -- their existence and count
      were listed, nothing more, and the experiment must open them.
    - >-
      IN-CORPUS: EV-CRYPTO-001..013 are the goal's full evidence series. Read as
      a series, ten of thirteen are neutral and three weaken, none supports, and
      all thirteen are tier toy with empty run_ids. That is the pattern a
      zero-sensitivity instrument produces and also the pattern an honest
      negative search produces; the two are not distinguished by the series.
    - >-
      KN-TECH-1a5b7e is cited across this session's scouting as the corpus's
      catalogue of controls that pass without being able to fail, with the
      program's own AES falsified-hint control (EV-AES-d33b1c, EV-AES-d8a13e) as
      the worked instance. NOT READ IN THIS SESSION -- RELAYED via the scouting
      brief. Reading it and using its obligation list verbatim is a step of the
      experiment, not an assumption of this record.
    - >-
      docs/inventor-protocol.md section 3 (controls before belief) and section 4
      (the closure standard: a named obstruction, an argument, and forward
      guidance; a count of screened-and-rejected candidates is a fatigue report
      whose honest status is unverified). READ IN FULL this session. This
      proposal is section 3 and section 4 applied to a screen instead of to a
      statistic, which is the extension the protocol's text invites but does not
      spell out.
    - >-
      NOVELTY SCREEN AND ITS LIMITS. A grep of this goal's thirteen batch
      directories and its evidence series found no planted-positive arm, no null
      arm, and no sensitivity statement. What that screen could see is this
      repository. It could not establish that no other agent has proposed a
      screen audit elsewhere in the program, and no such claim is made.

  lossy_projection_identifiability_audit:
    projection: >-
      A research mechanism (a body of mathematics, an algorithm, a cost analysis)
      --> a six-field categorical fingerprint --> a binary verdict.
    what_is_discarded: >-
      Essentially all of the mathematics. Two mechanisms with completely
      different internals map to the same fingerprint whenever their factor-base
      type, solve predicate, target dependence, source status, claimed gain
      shape and prior-route relation agree.
    why_genuinely_lossy: >-
      Extremely lossy and non-invertible -- the fingerprint cannot be used to
      reconstruct or even to implement the mechanism, which is the whole reason
      the screen is cheap.
    why_compatible_with_the_operations: >-
      Compatible with the operation that matters to the goal, namely
      ADMISSION: the goal's decision procedure consumes exactly these fields and
      nothing else, so the projection is by construction the input to the
      operation. That is a much weaker compatibility than the algebraic kind and
      this record says so.
    is_it_only_a_change_of_coordinates: >-
      NO -- it discards far too much for that.
    which_failure_was_checked_for: >-
      THE MIRROR FAILURE, and this is the entire proposal. A projection can be
      lossy, compatible, and worthless because its output is CONSTANT across
      inputs -- zero comparator spread. The observed output of this projection
      is FAIL on 100% of inputs across thirteen batches. That is not a proof of
      constancy, because all thirteen batches may have fed it genuinely
      inadmissible inputs; it is exactly the observation that makes the
      constancy hypothesis live and untested. The audit MEASURES the spread by
      supplying inputs on which a non-constant projection is forced to differ.
      An observation-collision statement falls straight out: if a planted
      positive and a matched null receive the same verdict, two ground-truth
      objects on opposite sides of the claimed conclusion share the observable,
      and identifiability fails directly (inventor protocol section 8, audit 2).

  assumptions:
    - >-
      That the rubric is executable by an independent scorer from its committed
      field list. If it is not -- if the recorded gates underdetermine the
      verdict -- that is itself a first-class finding and the audit reports it
      instead of inventing a rubric.
    - >-
      That P1-P3 really are mechanisms that beat a generic baseline on their
      class. All three are RECALLED, NOT READ. The audit's Stage 0 obtains a
      primary statement for each, and a positive whose reality cannot be
      established is DROPPED from the positive arm rather than assumed.
    - >-
      That blinding is achievable, i.e. that a fingerprint can be written that
      does not identify its mechanism to a knowledgeable scorer. This is
      partially false for famous mechanisms and the audit must report the
      scorer's post-hoc identification rate as a confound rather than deny it.

  predictions:
    - metric: >-
        Gate A pass rate on the prime-field-compatible planted positives
        (P1, P2, P3), blind
      direction: higher
      minimum_effect: >-
        3 of 3. Pre-derived: each fills all six Gate A fields with a stated,
        falsifiable, magnitude-carrying gain over rho on a named curve class.
        ANY FAIL among the three is the primary finding of the audit and
        localizes the defect to the field that produced it.
    - metric: >-
        Gate A pass rate on the matched nulls (N1, N2, N3), blind
      direction: lower
      minimum_effect: >-
        0 of 3, AND each failure attributed to its pre-assigned field: N1 at
        relation_or_direct_solve_predicate, N2 at
        falsifiable_claimed_metric_gain_and_direction, N3 at
        semantic_distinction_from_prior_CRYPTO_routes. A 0/3 fail rate with the
        wrong attribution is a partial failure and must be reported as one --
        the screen would be rejecting for reasons other than the fields it
        names.
    - metric: >-
        Gate B pass rate on P1, P2, P3
      direction: lower
      minimum_effect: >-
        0 of 3, and this is PREDICTED TO FAIL BY DESIGN. Gate B requires an
        oracle transcript, an exact source replay, a measured relation yield and
        a fully charged cost against matched rho -- artifacts no literature
        record carries. The pre-registered interpretation, fixed here before any
        scoring: a Gate-B fail on a Gate-A-passing positive is an ARTIFACT GAP,
        not a mechanism rejection, and if the campaign's thirteen batches
        recorded such fails as NO_CANDIDATE then the disposition mislabels an
        implementation backlog as an absence of candidates.
    - metric: >-
        Graded ablation: Gate A verdict on P2 with exactly j of its six fields
        degraded to the null register, j = 0..6, one ordering fixed in advance
      direction: lower
      minimum_effect: >-
        MONOTONE. The verdict must be PASS at j = 0, FAIL at j = 6, and once it
        turns to FAIL it must not return to PASS as j increases. Report the
        smallest j at which it flips. Non-monotonicity means the rubric is not a
        conjunction of its stated fields and the recorded gate description is
        incomplete. This is the >= 3-interior-point graded control and it
        localizes the obstruction to a specific field instead of leaving
        "the screen is strict".
    - metric: >-
        Total number of distinct records examined by this goal's screen across
        all thirteen batches, counted from the committed coverage blocks
      direction: different
      minimum_effect: >-
        A stated integer with its per-batch breakdown. NO VALUE IS PREDICTED --
        predicting it would be a guess about files not opened in this session.
        The metric is included because "FINAL" quantifies over that set and the
        set has never been sized.

  minimal_test:
    design: >-
      Four stages, zero compute throughout, each able to end the audit.
      STAGE 0: open all thirteen batch directories; extract every screen, its
      verdict, its checked-record list and its coverage block; count. Obtain a
      primary statement for each planted positive, dropping any that cannot be
      substantiated. TERMINATES THE AUDIT if a PASS verdict is found anywhere in
      the thirteen batches -- the sensitivity question is then already answered
      by committed data and the audit reports that instead.
      STAGE 1: write the input set (positives, nulls, ablation ladder), freeze
      the scoring rule verbatim from the committed gate description, commit the
      unblinding key by hash, commit the field-attribution predictions.
      STAGE 2: score the NULL arm first, record and commit those verdicts, and
      only then score the positive arm. If the rule emits the same label on both
      arms it discriminates nothing and must be rewritten before the ablation
      ladder is run.
      STAGE 3: the ablation ladder, then the write-up, which must state the
      screen's measured sensitivity and specificity and must NOT propose any
      change to the goal record.
    controls:
      - >-
        PLANTED POSITIVE / NEARBY OBJECT (P1-P3). The effect MUST appear. Forced
        value 3/3 at Gate A, derived above from the field list. If it does not
        appear, no negative conclusion about the literature may be drawn from
        any of the thirteen batches, and the audit says exactly that.
      - >-
        MATCHED NULL (N1-N3), same shape, same register, no content. Forced
        value 0/3 with per-field attribution derived before scoring. The null
        CAN fail: a null that passes means the screen is a rubber stamp and
        FINAL_NO_CANDIDATE was never a filter.
      - >-
        GRADED ABLATION on P2, seven interior points (j = 0..6), monotonicity
        required and reported.
      - >-
        ORDERING CONTROL. Null arm scored, recorded and hash-committed before
        the positive arm is looked at.
      - >-
        BLINDING with a hash-committed key, and a post-hoc identification-rate
        report from the scorer as a declared confound.
      - >-
        INDEPENDENT SCORER. The scorer must not be the agent that wrote the
        input set. AGENTS.md requires independence for anything that could
        change a research conclusion, and this can.
    required_metrics:
      - per-item Gate A verdict, per-item Gate B verdict, and the field that produced each FAIL
      - null-arm verdicts, committed before the positive arm
      - ablation ladder verdicts j = 0..6 with monotonicity stated
      - screened-record count per batch and total
      - scorer's post-hoc identification rate on the blinded set

  falsification_conditions:
    - >-
      Any planted positive passes Gate A AND the matched nulls all fail with
      correct field attribution AND the ablation ladder is monotone. The screen
      is demonstrably sensitive and specific, this proposal's concern is
      refuted, and the thirteen FINAL_NO_CANDIDATE dispositions are
      strengthened rather than weakened. THIS IS A GOOD OUTCOME AND IT IS THE
      OUTCOME THE PROPOSAL EXPECTS TO SEE AT GATE A.
    - >-
      A committed PASS verdict is found in any of the thirteen batches. The
      sensitivity question was already answered and the audit is redundant;
      report that and stop at Stage 0.
    - >-
      No planted positive can be substantiated from a primary source. The
      positive arm cannot be built, the audit cannot run, and it is reported as
      blocked on source access -- an infrastructure disposition, never a
      mathematical or methodological conclusion.
    - >-
      The committed gate description underdetermines the verdict, so two
      independent scorers disagree on a majority of items. The rubric is not an
      instrument, and that finding replaces the sensitivity measurement.

  confounders:
    - >-
      SCORER IDENTIFICATION. Famous mechanisms are recognizable from their
      fingerprints. Blinding is imperfect and the identification rate is
      reported rather than assumed away.
    - >-
      RUBRIC RECONSTRUCTION. The audit executes the rubric AS COMMITTED. If the
      original screening sessions applied unwritten additional criteria, the
      audit measures the written rubric and not the one used -- and it must say
      so. This is a real limit and it cannot be removed without the original
      sessions, which are gone.
    - >-
      AUTHORSHIP ASYMMETRY. Finding fault with another session's instrument is
      cheap to produce and reads as rigour. The audit is designed with a null
      arm and a pre-registered good outcome precisely so that a critical finding
      costs something to reach; and the record states plainly that the expected
      Gate A result VINDICATES the screen.
    - >-
      SMALL N. Three positives and three nulls is a small set, and no
      statistical claim is made from it. The design is a sensitivity
      demonstration, not an estimate: the question "can this instrument ever
      return PASS" is answered by one PASS, and "is it a rubber stamp" by one
      passing null.

  interpretation_limits:
    - >-
      THIS AUDIT ADJUDICATES AN INSTRUMENT, NOT THE LITERATURE. It cannot show
      that an admissible mechanism exists, and a screen defect is not a
      candidate. Anyone citing this record as evidence that GOAL-CRYPTO-001's
      objective is reachable has misread it.
    - >-
      NO STATUS CHANGE is proposed to GOAL-CRYPTO-001, to any EV-CRYPTO record,
      to the BATCH-013 disposition, or to any decision. Those are Coordinator
      actions (AGENTS.md rule 1) and this record neither performs nor requests
      one.
    - >-
      A finding that the screen is insensitive would scope the thirteen
      dispositions to "no candidate visible to this screen"; it would NOT
      retract them, would not imply any checked record was admissible, and would
      not license re-opening any specific closure. The forward guidance in that
      case is named now: restructure Gate B so an artifact gap routes to an
      implementation task, and point Gate A at the unscreened internal reservoir
      in inputs/h100_session/.
    - >-
      Claim tier: this is a methodological measurement. It is not toy, medium or
      crypto evidence about the ECDLP at all, and it must never be cited in a
      cost or complexity statement.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NONE IS LOAD-BEARING MATHEMATICALLY. The audit contains no probabilistic
        model, no asymptotic, and no distributional claim. Its forced values are
        derived by reading the rubric's field list against each input, which is
        a deterministic exercise.
      rigorous_support: >-
        The gate is a stated conjunction of named fields; a fingerprint either
        fills a field or does not.
      validation_plan: >-
        The ablation ladder is the validation: if the rubric really is the
        conjunction it is written as, degrading fields one at a time must flip
        the verdict monotonically at a determinate point.
    - id: H2
      statement: >-
        The three planted positives really do beat a matched generic baseline on
        their declared curve class.
      rigorous_support: >-
        RECALLED, NOT READ, for all three. This is an EVIDENTIARY assumption
        about sources, not a mathematical one, and it is the audit's only real
        dependency on the outside world.
      falsification_condition_note: >-
        If a positive cannot be substantiated it is dropped from the arm and the
        audit runs with the remainder; if fewer than two survive, the audit is
        reported as blocked rather than run underpowered.
      validation_plan: >-
        Stage 0 obtains a primary statement for each, or drops it.

  target_complexity:
    time_exponent: >-
      n/a for this audit. NO EXPONENT IS MOVED AND NONE IS CLAIMED. This
      proposal is a measurement of a screening instrument and it makes no ECDLP
      algorithmic claim of any kind. Stating that plainly is required by the
      generation contract and is the honest answer here.
    memory_exponent: n/a
    best_known: >-
      n/a. The relevant incumbent is not an algorithm but the goal's own
      standing disposition FINAL_NO_CANDIDATE, whose support this audit
      measures.
    hidden_overhead: n/a
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed on any cost axis, so there is no Pareto point to be
    dominated). On the QUESTION the audit addresses -- what supports thirteen
    batches of FINAL_NO_CANDIDATE -- the incumbent is the red-team confirmation
    RT-20260731-001 recorded in EV-CRYPTO-013, which CONFIRMED the disposition
    over its checked set. That confirmation is not dominated by this proposal
    and this proposal does not contradict it: a red team confirming that a
    finite checked set contains no candidate is a different measurement from a
    sensitivity test of the instrument that checked it, and neither substitutes
    for the other. Rows checked for an existing sensitivity measurement: all
    thirteen batch directories by listing, the BATCH-013 screen and red-team
    report by reading, EV-CRYPTO-001..013 by summary, and the goal record. None
    contains a planted positive, a null arm, or a sensitivity statement.
  sota_delta: >-
    Quantitative and stated as counts, because that is the only honest unit
    here. Current state: 13 batches, 13 dispositions, 0 planted positives,
    0 null arms, 0 measurements of screen sensitivity, and an unknown total
    number of records screened (BATCH-013 alone reports 3 WebSearch lists,
    10 displayed items, 6 Crossref requests). After the audit: 6 scored blind
    items plus a 7-point ablation ladder, a measured Gate A sensitivity and
    specificity, per-field attribution of every FAIL, and an exact
    screened-record count. Compute cost: zero. No attack, no exponent, no cost
    claim -- conceptual and evidentiary contribution only.

  estimated_cost:
    implementation: low
    compute: none
  recommended_priority: high
  honest_prior_of_survival: >-
    0.70 that the screen passes all three planted positives at Gate A. Not
    higher, because the field
