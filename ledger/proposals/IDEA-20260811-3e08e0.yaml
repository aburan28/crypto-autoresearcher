idea:
  id: IDEA-20260811-3e08e0
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE T5 VERDICT ON THE DEGENERATION DIVISOR, DECIDED BY COUNTING RATHER THAN
    BY WALKING - each weight-12 locus is EXACTLY ONE QUADRATIC-TWIST PAIR
    (p - 1 points in the (a,b)-plane, two isomorphism classes), so at every
    admissible p there are exactly six special j, twelve curves and AT MOST
    TWELVE isogeny classes out of about 2*sqrt(p) that contain one; a target
    instance therefore lands in a special-j class with probability O(1/p) and,
    by T4, cannot walk into one it did not start in - a GLOBAL-ADDRESS closure
    with a named obstruction, delivered by a census over all traces at one p
  class: measurement

  object: >-
    OBJ-SDD-CENSUS, the intersection of the Semaev degeneration divisor with the
    isogeny-class partition of the j-line at a fixed p. The tracked object is the
    MAP from the six rational special j to the traces of their reductions - i.e.
    which isogeny classes, if any, contain a degenerate vertex. This is a
    different object from the divisor itself (IDEA-20260811-a7c1df): the divisor
    lives on the j-line and is p-independent, the census lives on the trace axis
    and is p-dependent, and the whole T5 question is about the second.

  resource: >-
    R2 (curve equation) crossed with R4 (the isogeny graph / class partition). No
    endomorphism is applied to any point of G; H-ENDO-001 admissibility is
    passed trivially, since nothing here touches G at all.

  claim: >-
    (A) THE LOCUS IS A TWIST PAIR, EXACTLY. Fix a weight-12 form
    alpha a^3 + beta b^2 with 27 alpha - 4 beta non-zero. Its non-singular
    F_p-points all carry the single j-value j0 = 1728*(-4 beta)/(27 alpha - 4 beta)
    (derived in IDEA-20260811-a7c1df). For j0 not in {0, 1728}, the set of pairs
    (a,b) with that j-invariant is the union of the weighted orbits of ONE curve
    and its quadratic twist under (a,b) -> (u^4 a, u^6 b); the stabiliser of that
    action is {+1, -1}, so each orbit has (p-1)/2 elements and the union has
    EXACTLY p - 1 elements. INDEPENDENT CONFIRMATION FROM COMMITTED DATA:
    VAL-20260810-dc8bd8 verified j = 2257 on "ALL 4000 non-singular points of the
    locus" at p = 4001, and p - 1 = 4000 exactly. [Derived in this record;
    cross-checked against the committed count.]
    (B) THE CENSUS, AND ITS EXACT PRE-REGISTERED SIZE. Consequently, at any
    admissible p there are exactly SIX special j (excluding 0 and 1728), TWELVE
    curves up to F_p-isomorphism, and AT MOST TWELVE isogeny classes containing
    one - at most, because the two members of a twist pair have traces +t and -t
    and lie in different classes unless t = 0, and because two different special
    j may by accident share a trace. The number of ordinary isogeny classes at p
    is about 2*sqrt(p) (traces |t| <= 2 sqrt(p) with t coprime to p). At
    p = 4001 the campaign has already enumerated all 253 admissible traces
    against the Hurwitz-Kronecker mass formula with zero disagreements
    (EV-ICINV-6b6264), so the census is a table lookup over an object that is
    already certified.
    (C) THE T5 VERDICT, WHICH IS THE POINT. DECOMPOSITION.md T5 admits a
    cost-minimising vertex only if goodness is (i) common enough to hit by random
    walking, or (ii) decided by a LOCAL test evaluable at each step. Clause (ii)
    is SATISFIED here and satisfied unusually well: "alpha a^3 + beta b^2 = 0" is
    two multiplications and an addition, evaluable at every vertex of a walk with
    no isogeny computation, no point counting and no class-group data. Clause (i)
    FAILS catastrophically: the fraction of curves that are special is
    12/(2p - 2) ~ 6/p, so a class of size h ~ sqrt(p) contains an expected
    6 h / p ~ 6/sqrt(p) special vertices, which tends to zero. AND T4 CLOSES THE
    ESCAPE: the class fixes its j-set, so a target whose class contains no
    special j cannot walk to one, exactly as it cannot walk to j = 0 without
    D_0 = -3. THE OBSTRUCTION, NAMED: O-GLOBAL-ADDRESS-SDD - "the degeneration
    divisor is a fixed finite set of j-values of size independent of p, so its
    density among curves is Theta(1/p) and the probability that a given
    instance's class meets it is Theta(1/p); local detectability is free and
    worthless because there is nothing to detect."
    (D) THE ONE THING THAT WOULD OVERTURN IT, STATED SO THE RECORD IS NOT
    UNFALSIFIABLE. If the number of degeneration loci GREW with m - say
    |Div(S_m)| = Theta(m) or Theta(2^m) - then at large m a positive fraction of
    j could be special and clause (i) would come back to life. This record
    therefore makes |Div(S_m)| for m = 3, 4, 5 a REPORTED QUANTITY (2, 8, and
    whatever S_5 gives) and pre-registers the growth question as the successor's
    decision variable. If |Div(S_5)| is dramatically larger than 8, the census
    verdict is scoped to m <= 4 and must be re-run.

  mechanism: >-
    Two independent facts compose. First, weighted homogeneity forces every
    degeneration locus to be a single j-line point, so the divisor's SIZE does not
    grow with p - it is an absolute constant for each m. Second, the number of
    curves grows like p while the number of special curves stays at 12, so
    density falls like 1/p. Third, T1/T4 make the j-set of a class a fixed finite
    set determined by the trace, so the attacker cannot choose which j are
    available. The composition is that local detectability - normally the scarce
    resource in T5 - is here abundant and useless, which is a structurally
    different failure from every other lane in the campaign and is worth
    recording as such.

  novelty_status: adaptation
  novelty_note: >-
    T4 and T5 are committed (DECOMPOSITION.md sections 3). The census of the
    degeneration divisor against the trace partition, and the twist-pair
    cardinality argument in (A), are NOT in any committed record. Corpus grep for
    the six F_4001 values outside EV-ICINV-6b6264, DEC-20260810-d70ece,
    GOAL-ENDO-001/goal.yaml and the validation report returns nothing. External
    literature NOT checked.
  not_a_duplicate_of: >-
    NOT IDEA-20260807-94f953, which is about the CRATER of a small-|D_0| class
    and the h(D_0) = 1 discriminants; the special j here are not CM j at all
    (see IDEA-20260811-df6c0f), so 94f953's crater analysis does not reach them.
    NOT IDEA-20260807-a3d644, which builds a matched null across D_0 through the
    cofactor; this record builds no null across D_0 and constructs no matched
    pair - it counts. NOT IDEA-20260811-a7c1df, which is p-independent and makes
    no reachability claim.

  assumptions:
  - >-
    p is outside the finite exceptional set where two special j collide or where
    a special j equals 0 or 1728 - i.e. p does not divide 5, 19, 25, 47, 59 or
    any difference numerator. p = 4001 is admissible; the contract must verify
    this rather than assume it.
  - >-
    The six char-0 values from IDEA-20260811-a7c1df are correct. This record's
    step 1 re-derives them, so it does not depend on that record having run.
  - >-
    The 253-trace enumeration at p = 4001 against the Hurwitz-Kronecker mass
    formula is correct as committed (EV-ICINV-6b6264, re-verified by
    VAL-20260810-dc8bd8 with zero disagreements).

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the density estimate
      12/(2p): if the number of special curves were Theta(p) rather than
      Theta(1), T5 clause (i) would pass and the lane would be live.
    baseline_embedding:
      parameter_slice: >-
        j = 0 and j = 1728 are the exact baseline slice. The census method
        applied to them must reproduce the committed T4 statement: a class
        contains j = 0 only if D_0 = -3, and j = 1728 only if D_0 = -4. If the
        census reports a j = 0 curve in a class with D_0 = -59, the method is
        broken.
      reproduction_check: >-
        At p = 4001, D = t^2 - 4p; check that the traces whose class contains
        j = 0 are exactly those with D = -3 f^2, and likewise -4 f^2. Frozen
        fixture: the committed statement that the t = 30 class has D_0 = -59 and
        therefore contains neither.
    observation_collision:
      observable: >-
        The pair (special j, trace of its curve at p).
      distinct_preimage_search: >-
        PERFORMED AND POSITIVE, AND IT IS USED CONSTRUCTIVELY HERE. The two
        members of a twist pair have the same j and opposite traces, hence
        different classes and different group orders. So the observable "j" has
        two preimages on opposite sides of any class conclusion. This record
        does not try to separate them; it COUNTS them, and the twist collision is
        exactly why the count is 12 rather than 6.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: >-
        A resource measure over the trace axis: assign to each trace the number
        of special-j vertices in its class, and observe that the total mass is 12
        regardless of p while the number of classes grows like sqrt(p). Charges
        are over disjoint blocks (classes) by construction, since a curve lies in
        exactly one class.
      predicted_gain: >-
        Turns a vague "special j are rare" into an exact conservation law with a
        p-independent total, which is what makes O-GLOBAL-ADDRESS-SDD a closure
        rather than an impression.
    quantifier_order: >-
      FOR ALL admissible p, THERE EXISTS a set T_p of at most 12 traces such that
      FOR ALL curves E/F_p whose trace is not in T_p, no curve F_p-isogenous to E
      lies on the degeneration divisor. The witness T_p depends on p and is
      computable in polynomial time (six Cornacchia-free point counts by SEA).
      The attacker, however, does not get to CHOOSE its instance's trace, and
      that asymmetry is the whole obstruction.
    method_ceiling:
      strongest_certifiable_claim: >-
        The exact list of traces at a given p whose classes contain a special j,
        and the exact statement that the count is at most 12 for every p. It
        CANNOT certify anything about whether a special-j vertex would help if
        one were reachable; that is IDEA-20260811-97e244's and
        IDEA-20260811-6034d0's question, and this record deliberately does not
        answer it.
      nearby_object_control: >-
        The nearby object where the conclusion fails is j = 0 itself, whose
        density among curves is also Theta(1/p) BUT whose class membership is
        decided by an ARITHMETIC condition (D_0 = -3) that a curve designer can
        arrange deliberately - as secp256k1 does. Applying the method to j = 0
        must therefore return the SAME density verdict and a DIFFERENT
        designability verdict; a method that cannot tell those apart has not
        identified the load-bearing structure.
    proof_obligations:
    - claim: Each weight-12 locus has exactly p - 1 non-singular F_p-points
      responsibility: correctness
    - claim: At most 12 classes contain a special j at any admissible p
      responsibility: correctness
    - claim: The t = 30 class at p = 4001 is one of them
      responsibility: baseline
    - claim: The divisor size does not grow with p
      responsibility: scope

  predictions:
  - metric: locus_point_count_over_p_minus_1
    direction: different
    minimum_effect: >-
      EXACTLY 1.000 for each of the six loci at p = 4001, i.e. 4000 non-singular
      points each. The committed 4000 for a^3 + 8b^2 is one of the six and serves
      as the built-in check.
  - metric: isomorphism_classes_per_locus
    direction: different
    minimum_effect: >-
      EXACTLY 2 (a curve and its quadratic twist) for each of the six loci. A
      count of 1 would mean the twist lies on a different locus and refutes (A);
      a count above 2 would refute the orbit computation.
  - metric: number_of_traces_at_p4001_whose_class_meets_the_divisor
    direction: different
    minimum_effect: >-
      AT MOST 12, out of the 253 admissible traces - i.e. at most 4.74%. And the
      trace t = 30 MUST appear in the list, because the committed 138-member
      class contains j = 2257. If t = 30 is absent, the census is wrong.
  - metric: expected_special_vertices_per_class
    direction: lower
    minimum_effect: >-
      Below 0.25 at p = 4001 when averaged over all admissible traces
      (12 special curves spread over about 2*sqrt(4001) ~ 126 classes gives about
      0.095 per class; the committed arithmetic 138*6/3999 = 0.207 for an
      arbitrary 138 curves is the same statement from the curve side and is
      quoted from EV-ICINV-6b6264 as arithmetic, not as a p-value).
  - metric: divisor_size_growth_m3_m4_m5
    direction: higher
    minimum_effect: >-
      Reported, not predicted to any value: 2 at m = 3, 8 at m = 4, and the S_5
      count from IDEA-20260811-a7c1df. If |Div(S_5)| exceeds 64 the census
      verdict is scoped to m <= 4 and a successor must re-run it.

  minimal_test:
    design: >-
      A CENSUS, NOT A STATISTIC. (1) Re-derive the six char-0 j and reduce them
      mod p for p in {4001, 2003, 6007} and one prime above 2^20. (2) For each
      special j at each p, construct one curve with that j and its quadratic
      twist explicitly, and COUNT POINTS on both (Schoof/SEA or exhaustive at toy
      p), obtaining twelve traces. (3) Record for each: the trace, whether the
      curve is ordinary or supersingular, D = t^2 - 4p, its factorisation
      D = D_0 f^2, and the class number. (4) Cross-tabulate against the committed
      253-trace enumeration at p = 4001 and confirm that t = 30 appears with
      j = 2257. (5) Compute the density 12/(2p-2) and the expected special
      vertices per class, and state the T5 verdict from the numbers. (6) Verify
      the twist-pair cardinality claim by enumerating the full locus at p = 4001
      for all six loci and confirming p - 1 = 4000 points and exactly 2
      isomorphism classes each.
    controls:
    - >-
      C-BASELINE-J0. Run the identical census on j = 0 and j = 1728 and confirm
      it reproduces the committed T4 statement (classes with D_0 = -3 and -4
      respectively). A census that misplaces j = 0 misplaces everything.
    - >-
      C-RANDOM-J. The null object of the same shape: draw six RANDOM j in F_p,
      run the identical census, and confirm the resulting trace/D_0 statistics
      are indistinguishable from the special six. PREDICTED OUTCOME - they ARE
      indistinguishable, and that is the finding: special-for-Semaev is
      arithmetically generic. See IDEA-20260811-6c893b, which makes this the
      primary question over many p rather than a control at one p.
    - >-
      C-COUNT. Point counts are verified by an independent method (baby-step
      giant-step order check on a random point, or exhaustive count at toy p),
      because a wrong trace silently invents or destroys a class membership.
    required_metrics:
    - special_j_values_per_p
    - trace_and_ordinarity_per_special_curve_and_twist
    - D0_and_conductor_and_class_number_per_special_curve
    - locus_point_count_and_isomorphism_class_count
    - number_of_distinct_traces_hit
    - density_and_expected_vertices_per_class
    - baseline_j0_j1728_census_agreement_boolean

  lossy_projection_answer: >-
    The projection here is curve -> (j, trace), and it is genuinely lossy - it
    forgets the model entirely - and compatible with the campaign's operations,
    because isogeny preserves the trace exactly (Tate) and gauge transformation
    preserves j exactly (C-GAUGE, committed). The retained part therefore
    propagates deterministically under both operations the campaign uses, which
    is precisely the compatibility the protocol demands. THE COST-SIDE ANSWER IS
    DIFFERENT AND MUST BE STATED: this record makes NO claim that reaching a
    special-j vertex would reduce any cost. It claims the opposite is untested
    and that reaching one is impossible anyway. So the j = 0 support-versus-time
    failure does not weaken this record; it makes it cheaper, because the record
    can close on reachability without ever having to settle the cost question.

  t5_reachability_answer: >-
    THIS RECORD IS THE T5 ANSWER. Clause (ii) PASSES - the membership test is
    O(1) field operations, evaluable locally at each vertex of a Velu walk, with
    no global data. Clause (i) FAILS at density Theta(1/p). T4 blocks the only
    escape. The verdict is therefore NEGATIVE with a named obstruction
    O-GLOBAL-ADDRESS-SDD, and the forward guidance is explicit: what remains open
    is (a) whether |Div(S_m)| grows with m fast enough to restore clause (i), and
    (b) the SIX-TO-TWELVE CLASSES THAT DO CONTAIN A SPECIAL VERTEX, where
    reachability is not the question and IDEA-20260811-22b6b8 measures the walk.

  null_object: >-
    C-RANDOM-J above - six uniformly drawn j at the same p, put through the
    identical census. Same shape (six j-values, twelve curves, twelve traces),
    same pipeline, no special property. If the special six differ from random six
    in trace statistics, D_0 size or class number, THAT is a finding and it is
    exactly what IDEA-20260811-6c893b is designed to detect at scale.

  falsification_conditions:
  - >-
    Any locus has other than p - 1 non-singular points or other than 2
    isomorphism classes. Claim (A) is false and the count of 12 is wrong.
  - >-
    t = 30 does not appear among the special traces at p = 4001. The census
    contradicts committed data and is invalid until reconciled.
  - >-
    More than 12 distinct traces are hit. Either a locus carries more than one j
    or the census double-counts; either way (A) fails.
  - >-
    The baseline census misplaces j = 0 or j = 1728 relative to D_0 in
    {-3, -4}. The instrument is broken and no verdict is admissible.
  - >-
    |Div(S_5)| turns out to be large enough that the special fraction of j is not
    o(1) in p. The density argument is scoped to m <= 4 and the T5 verdict must
    be re-derived; this is the single outcome that would REOPEN the lane.

  confounders:
  - >-
    Supersingularity. A special j might reduce to a supersingular j at some p, in
    which case the curve has trace 0 and the ordinary analysis does not apply.
    The census must report ordinarity per curve rather than assume it. At
    p = 4001 the supersingular j are a set of size about p/12 and the collision
    is possible, so this is checked, not waved away.
  - >-
    Twist coincidence at t = 0. If a special curve has trace 0 it equals its own
    twist's class and the count drops from 12; recorded rather than treated as
    an error.
  - >-
    Curves with j = 0 or 1728 have larger automorphism groups and their weighted
    orbits are smaller ((p-1)/6 and (p-1)/4 respectively), so claim (A)'s p - 1
    count is FALSE at those two j. The contract must exclude them from the
    twist-pair count and handle them under the C-BASELINE-J0 arm.

  interpretation_limits:
  - >-
    A negative T5 verdict closes REACHABILITY, not usefulness. It does not show
    that a special-j curve is no easier; it shows you cannot get to one. Those
    are different statements and conflating them would be exactly the kind of
    over-reading DEC-20260810-d70ece forbids for the S_4 outlier.
  - >-
    Scoped to m <= 4 until |Div(S_5)| is known.
  - >-
    claim_tier toy. No attack, no exponent, no speedup.

  heuristic_assumptions:
  - id: H1
    statement: >-
      The number of ordinary isogeny classes at p is Theta(sqrt(p)) and the
      average class size is Theta(sqrt(p)) - specifically, the Hurwitz-Kronecker
      class number H(4p - t^2) averaged over admissible t.
    rigorous_support: >-
      Deuring's theorem gives the class size as H(4p - t^2) exactly, and the
      campaign has verified the mass formula on all 253 traces at p = 4001 with
      zero disagreements (EV-ICINV-6b6264). The Theta(sqrt(p)) average is the
      classical Siegel/Gauss class-number average, cited and not re-proved here.
    validation_plan: >-
      Sample: all admissible traces at p in {2003, 4001, 6007}, computing
      H(4p - t^2) exactly. Comparison: the total sum over t must equal the total
      number of curves, about 2p; check that identity exactly at all three
      primes. Tail check: the largest class at each p versus the Siegel upper
      bound O(sqrt(p) log p). Transfer to cryptographic p is NOT claimed and is
      not needed, because the density argument only gets STRONGER as p grows.
  - id: H2
    statement: >-
      The reductions mod p of the six fixed rational j behave, as p varies, like
      uniformly random elements of F_p with respect to the trace/discriminant
      statistics of their curves.
    rigorous_support: >-
      Each special j defines a fixed curve over Q with no complex multiplication
      (see IDEA-20260811-df6c0f, where non-integrality of five of the six proves
      they are not CM j-invariants), so the Sato-Tate theorem for non-CM elliptic
      curves over Q applies to its trace distribution.
    validation_plan: >-
      Deferred in full to IDEA-20260811-6c893b, which samples the twelve traces
      over thousands of p and compares against the Sato-Tate semicircle. Within
      THIS record H2 is used only for the C-RANDOM-J control at three primes and
      no distributional claim is made from three points.

  target_complexity:
    time_exponent: NONE CLAIMED.
    memory_exponent: NONE CLAIMED.
    best_known: >-
      0.886*sqrt(N) group operations, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted variant on CM curves (KN-TECH-018).
    hidden_overhead: Not applicable.
    tradeoff_note: >-
      Not applicable. Note for completeness that even if a special-j vertex were
      both reachable and useful, reaching a SPECIFIED vertex in a class is the
      CSIDH vectorisation problem at about sqrt(h) ~ p^{1/4} classically
      (DECOMPOSITION.md T5), which would have to be charged against any gain.
      Here the local test makes that cost irrelevant and the density makes the
      gain unavailable.

  dominated_by: >-
    Every row of the attack frontier dominates: parallel rho with distinguished
    points (KN-TECH-001, KN-TECH-006), BSGS, kangaroo, index calculus. Checked
    against each; this record produces no solver and no cost reduction.
  sota_delta: ZERO on every axis. A closure and a census, nothing more.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  expected_value: >-
    HIGH, AND ITS EXPECTED OUTCOME IS THE NEGATIVE. Cost is a few point counts
    and a table join against an already-certified 253-trace enumeration. The
    payoff is a genuine closure at the inventor-protocol standard - named
    obstruction, argument, forward guidance - for the strongest new lead in this
    lane, delivered BEFORE anyone spends compute measuring costs at special j.
    That ordering matters: it is much cheaper to learn that the good vertex is
    unreachable than to learn that it is not good. I would run this THIRD, after
    the divisor is catalogued, and I would accept its negative as a deliverable.
