idea:
  id: IDEA-20260816-b7c821
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: 'Make the conditions half of the ledger mechanical: a canonical generalized-condition table
    for a step-reduced characteristic and an extractor that maps it to the integer pair inside and
    outside the message-modification window, validated by round-trip on synthetic tables whose counts
    are known by construction'
  class: representation
  claim: '(A) The frontier ledger RQ-SHATWO-f196c7 target 2 describes has two halves, and only one
    of them is currently computable in this program. The degrees-of-freedom half is linear algebra.
    The conditions half - how many bit conditions a characteristic imposes, and how many of them fall
    outside the window that message modification can cover - is currently a quantity read off attack
    prose by a human, which means it is neither reproducible nor auditable and cannot appear in any
    record this program is allowed to write. This proposal replaces the human with a representation
    and a function: a canonical per-bit, per-step generalized-condition table over a declared alphabet,
    plus an extractor that maps any such table to the pair (conditions inside window, conditions outside
    window) with the window itself defined by a declared rule rather than by judgement. (B) The deliverable
    is validated not against any characteristic but against synthetic tables built so their counts
    are known by construction: generate a table with exactly k conditions placed at declared positions,
    run the extractor, and require it to return k with the declared split. Round-trip in the other
    direction too - serialize, reparse, re-extract, require identical counts. The extractor either
    reproduces constructed counts exactly or it does not, and there is no statistical component anywhere.
    (C) NOT CLAIMED: that any characteristic exists, is reproducible, or is available to this program,
    since RQ-SHATWO-f196c7''s own constraints block that until primary text is filed as KN-LIT; that
    the window rule is the right one, since it is declared and its sensitivity is measured rather
    than argued; that a condition count predicts anything about a frontier; that the alphabet chosen
    captures every condition type a characteristic could impose, which is exactly what the coverage
    audit measures rather than assumes; anything about full 64-step SHA-256, HMAC-SHA-256, or any
    deployed system.'
  mechanism: 'STAGE A. Declare the condition alphabet explicitly - for each bit position of each state
    word, the set of allowed joint values of the pair of bits across the two messages, written as
    a symbol - together with its canonical serialization and a parser that is the exact inverse. STAGE
    B. Declare the window rule: which step indices count as covered by message modification, as a
    function of step count and of a declared coverage depth parameter, with no judgement anywhere
    in the definition. STAGE C. Implement the extractor as a pure function from table to the integer
    pair, counting a condition wherever a symbol constrains the joint value more than the free symbol
    does. STAGE D. Build the synthetic validation battery: tables generated with exactly k conditions
    at declared positions, across k from 0 to the table size, and across placements chosen to straddle
    the window boundary. Require exact recovery of both counts. STAGE E. Sensitivity sweep: vary the
    coverage depth parameter over its full range and report how the split moves, so the reader sees
    how much of the reported integer is the rule rather than the table. STAGE F. Refutation route:
    if the extractor cannot recover constructed counts for some symbol combination, the alphabet or
    the extractor is incomplete, and the failing combination is recorded as the measured obstruction
    - which is more useful than a passing test, because it names exactly what the representation cannot
    express.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full, particularly target 2 and its methods block requiring message-modification
      and neutral-bit accounting implemented as an explicit counter over the schedule rather than
      inferred from attack prose. Read ledger/goals/GOAL-SHA2-001.yaml and docs/inventor-protocol.md
      sections 4 and 5. Ran grep -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/ coordination/;
      grep -ril 'signed-difference|generalized condition' and grep -ril 'neutral bit' over ledger/proposals/
      ledger/hypotheses/ knowledge/; grep -ril 'message schedule|message-schedule' over ledger/proposals/
      ledger/hypotheses/ knowledge/.
    results: 'RQ-SHATWO-f196c7''s methods block states the requirement in its own words: message-modification
      and neutral-bit accounting implemented as an explicit counter over the schedule, not inferred
      from attack prose. That is the gap this proposal fills and it is the question''s own instruction
      rather than a discovery. ''signed-difference|generalized condition'' returned ZERO hits across
      ledger/proposals/, ledger/hypotheses/, knowledge/techniques/ and knowledge/findings/. ''neutral
      bit'' matched only knowledge/literature/ entries, never a proposal or hypothesis. ''message
      schedule'' matched only the two signature-lane proposals IDEA-20260813-878855 and IDEA-20260813-93a735,
      whose titles I read. The RQ-SHATWO grep returns only the question, GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2,
      so the lane carries no proposals and no prior representation work exists here.'
    verdict: 'UNVERIFIED. This program cannot read external literature and this record asserts nothing
      about what it contains, including whether generalized-condition alphabets for hash cryptanalysis
      exist elsewhere; asserting either way is exactly what is forbidden here. Claimed new: nothing
      about the idea of a per-bit condition table, which is an obvious representation for a per-bit
      constraint, and nothing about counting. The contribution claimed is that the count becomes a
      FUNCTION with a declared window rule, a coverage audit, a sensitivity sweep over the rule''s
      free parameter, and a synthetic battery that validates it against constructed ground truth rather
      than against a characteristic this program does not have - which is what makes the conditions
      half of the ledger writable under this program''s record rules at all. Within this repository
      the verifiable facts are that ''generalized condition'' and ''signed-difference'' return zero
      hits anywhere and RQ-SHATWO carries no proposals.'
  object_first_candidate:
    tracked_object: 'The canonical generalized-condition table of a step-reduced characteristic -
      one symbol per state bit per step, drawn from a declared alphabet describing how the joint value
      of that bit across the two messages is constrained - together with the integer pair produced
      by the extractor: conditions falling inside the declared message-modification window, and conditions
      falling outside it.'
    lossiness: 'Lossy at two levels, and both are stated. The table itself already discards the actual
      message values, the probabilities of the differential transitions, the ordering of conditions
      within a step, and everything about how the characteristic was found; it keeps only which bits
      are constrained and how. The extractor then discards the table''s structure entirely, keeping
      two integers - so tables with completely different shapes, and characteristics of completely
      different quality, collapse to the same pair. That second projection is severe enough that the
      contract emits the full table alongside the pair in every record, precisely because the pair
      alone cannot be inverted. Why the remainder still propagates: the window rule depends only on
      step index, so the split is computable from the table alone with no reference to anything discarded,
      at any step count.'
    propagation: 'The operation is advancing the step index across the window boundary. One step of
      it moves a row of the table from inside the window to outside, changing the split by exactly
      the number of constrained symbols in that row while leaving the total unchanged. The propagation
      law is therefore exact, discrete and trivially checkable: the total is invariant under any change
      of the window rule, and the split is a monotone function of the coverage depth parameter. That
      monotonicity is one of the forced values the synthetic battery checks, and its failure would
      indicate an extractor bug rather than anything about a characteristic.'
    survival_score: 'The representation survives exactly as far as the declared alphabet can express
      the conditions a real characteristic imposes, and the coverage audit is what measures that boundary
      rather than assuming it: symbols that constrain a single bit across two messages are expressible
      by construction, and conditions that couple bits ACROSS positions or across words are not, so
      the object dissolves precisely at multi-bit-coupled conditions. That boundary is named in advance
      and the audit reports which of a declared list of condition types the alphabet can and cannot
      express, so the deliverable includes its own limit rather than discovering it later.'
  null_object_control: 'Random condition tables of matched density, run through the identical extractor
    in the same invocation: 1000 tables per density level, with symbols drawn independently at declared
    marginal rates. For the extractor to mean anything, the counts it returns on random tables must
    match the combinatorial expectation computed independently in closed form - density times table
    size, split by the window rule''s row counts - to within sampling error. If the extractor reports
    counts on random tables that deviate from the closed-form expectation, it is measuring its own
    convention rather than the table, and no count it produces on any real table means anything. A
    second control is the zero table: an all-free table must return the pair (0, 0) exactly, and a
    fully constrained table must return the full row counts exactly, both forced values.'
  discriminated_from:
  - RQ-SHATWO-f196c7's methods block, which requires exactly this counter to exist but specifies no
    alphabet, no window rule, no coverage audit and no validation strategy; this supplies all four
    and, crucially, validates against constructed counts rather than against a characteristic the
    program does not have.
  - The rank-ledger entry in this bucket, which computes the degrees-of-freedom half by linear algebra;
    this computes the conditions half and the two are the two sides of one ledger, deliberately built
    by separate contracts so neither blocks the other.
  - The certificate-chain entry in this bucket, which verifies a claimed collision from a message
    pair; a condition table is not a certificate and cannot be verified by recomputation, which is
    why its validation is by construction instead and why the two contracts share no code.
  - Any attempt to reproduce a published characteristic, which RQ-SHATWO-f196c7's own constraints
    block until primary text is filed as KN-LIT; this contract needs no characteristic at all and
    runs today on synthetic tables.
  - Ordinary schema validation, which checks that a table is well-formed; the coverage audit checks
    a stronger property - which condition types the alphabet can express at all - and reports the
    ones it cannot as the deliverable's stated limit.
  assumptions:
  - A per-bit, per-step symbol alphabet can express single-bit joint constraints exactly; this is
    true by construction of the alphabet and is not an empirical claim.
  - The window rule, a function of step index and a coverage depth parameter, is a complete specification
    with no judgement in it; this is checkable by inspection and is why the sensitivity sweep over
    the parameter is mandatory.
  - Synthetic tables with k conditions at declared positions have exactly k conditions, which is true
    by construction of the generator and is the ground truth the extractor is scored against.
  - The closed-form expectation for random tables is correct; it is derived in the preregistration
    and checked against the empirical mean over 1000 draws rather than assumed.
  predictions:
  - metric: extractor's recovered total condition count on synthetic tables with k constructed conditions
    direction: different
    minimum_effect: 'forced value: exactly k, for every k from 0 to table size, with zero tolerance;
      a single mismatch is a hard failure'
  - metric: extractor's split on synthetic tables straddling the window boundary
    direction: different
    minimum_effect: 'forced value: exactly the constructed split, for every declared placement; and
      the split must be monotone in the coverage depth parameter'
  - metric: extractor's mean total count on 1000 random tables at each density versus the independently
      derived closed-form expectation
    direction: different
    minimum_effect: within sampling error at the declared confidence; a systematic deviation means
      the extractor measures its own convention
  - metric: number of declared condition types the alphabet cannot express, from the coverage audit
    direction: different
    minimum_effect: explicit refusal to pre-commit a number, since predicting the coverage gap would
      be fabricating the audit's result; what is pre-committed is that the failing types are enumerated
      by name in the output rather than summarized as a count
  - metric: fraction of the reported inside-window count attributable to the coverage depth parameter
      rather than to the table, from the sensitivity sweep
    direction: different
    minimum_effect: reported as a measured range across the parameter's full range, with no predicted
      value, because this is the number that tells a reader how much of the ledger's conditions half
      is a rule rather than a measurement
  minimal_test:
    design: 'Cheapest sufficient version: one step count, one table size, the full synthetic battery
      at 20 values of k rather than every k, one density level for the random-table null with 200
      draws rather than 1000, and the sensitivity sweep at three coverage depth values rather than
      the full range. All of this is pure Python on tables of a few thousand cells and completes in
      seconds, with no solver, no linear algebra and no characteristic. It discriminates because every
      forced value in this contract is exact rather than statistical: the extractor either returns
      exactly k on a constructed table or it does not, and a single failure at any k kills the representation.
      The two things this cheap pass cannot deliver are the full coverage audit, which requires enumerating
      the declared condition-type list, and a tight sensitivity range - and if the forced values fail,
      neither is worth running.'
    controls:
    - Random condition tables of matched density against an independently derived closed-form expectation,
      1000 draws per density, same invocation.
    - Zero table and fully constrained table as forced-value anchors returning (0, 0) and the full
      row counts exactly.
    - Serialization round trip on every table, requiring identical extracted counts before and after.
    - Sensitivity sweep over the full range of the coverage depth parameter, reporting how much of
      the split the rule contributes.
    - Coverage audit against a declared enumerated list of condition types, reporting by name which
      the alphabet cannot express.
    required_metrics:
    - recovered total condition count versus constructed k, per synthetic table
    - recovered inside/outside split versus constructed split, per placement
    - mean and spread of counts on random tables versus closed-form expectation, per density
    - split as a function of coverage depth parameter across its full range
    - list of declared condition types the alphabet cannot express, by name
    - serialization round-trip count stability flag per table
  falsification_conditions:
  - The extractor returns a total other than k on any synthetic table with k constructed conditions.
  - The extractor's split differs from the constructed split for any declared placement.
  - The split is not monotone in the coverage depth parameter, indicating an extractor bug.
  - Mean counts on random tables deviate systematically from the independently derived closed-form
    expectation.
  - Extracted counts change across a serialization round trip.
  - The coverage audit finds that a condition type the ledger would need is inexpressible in the alphabet,
    which is a real and reportable limit rather than a bug.
  confounders:
  - The window rule's coverage depth parameter can move the split arbitrarily, so a reported inside-window
    count is partly a statement about the rule; the sensitivity sweep is the only defence and its
    range must be quoted whenever the count is.
  - A synthetic generator written by the same code as the extractor may share a blind spot, so the
    generator is specified against the alphabet definition rather than against the extractor.
  - Density-matched random tables are a null for the counting convention, not for anything about characteristics,
    and reading them as the latter would be an error the record must forestall.
  - The declared condition-type list for the coverage audit is itself a judgement about what a characteristic
    could impose, and an incomplete list produces a falsely clean audit; the list is emitted in full
    so it can be extended by a later agent.
  - Table dimensions depend on which state words are tracked, and a different tracking choice changes
    every count; the tracked-word set is declared and reported with every count.
  interpretation_limits:
  - This contract produces a representation and a validated counter, not a condition count for any
    real characteristic, because no characteristic is available to this program.
  - Every reported inside/outside split is relative to a declared window rule whose free parameter
    demonstrably moves it, and the sensitivity range must accompany the number.
  - The alphabet cannot express multi-bit-coupled conditions by construction, and the coverage audit
    reports which declared types fall outside it.
  - A condition count predicts nothing about any frontier; pairing it with the degrees-of-freedom
    half is a separate question this contract does not address.
  - Nothing here is a statement about full 64-step SHA-256, HMAC-SHA-256, or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The extractor is linear in table size and the whole
      battery is seconds of pure Python on tables of a few thousand cells.
    memory_exponent: No attack memory exponent is claimed. A table for 64 steps of eight 32-bit state
      words is under 20000 cells and the battery holds a few thousand of them at once.
    best_known: 'No incumbent attack. The incumbent this replaces is explicitly named by RQ-SHATWO-f196c7''s
      own methods block: accounting inferred from attack prose rather than implemented as an explicit
      counter, which is not reproducible and cannot appear in a record under this program''s evidence
      rules. No record in this repository implements such a counter, and ''generalized condition''
      returns zero hits.'
    hidden_overhead: The hidden cost is that the window rule carries the entire conditions half of
      the ledger and admits no principled value, so every number this contract enables is a number
      plus a rule, and quoting the number without the rule is the failure mode that will actually
      occur downstream. The sensitivity sweep exists to make that cost visible at every use rather
      than once. A second hidden cost is the coverage audit's declared condition-type list, which
      is a judgement dressed as an enumeration and must be emitted in full so a later agent can extend
      it rather than trust it.
  dominated_by: 'n/a (no result claimed). Pareto check across time, memory and data/queries: I checked
    every frontier row present in this repository and found none - no experiment directory, evidence
    record, proposal or hypothesis implements a condition-counting representation for any primitive,
    ''generalized condition'' and ''signed-difference'' return zero hits across proposals, hypotheses,
    techniques and findings, and RQ-SHATWO carries no proposals - so there is no prior row to dominate
    this one. This repository cannot adjudicate against external work in either direction.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The delta is from a quantity that
    could not be written into a record at all to one that can: currently the conditions half of the
    frontier ledger has no reproducible definition here, and a run would deliver a declared alphabet,
    a pure extractor validated exactly against constructed counts across the full k range, a closed-form-checked
    random-table null, a named coverage limit, and a measured sensitivity range for the window rule.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'By part. (1) That the extractor recovers constructed counts exactly across
    the full k range: ~0.9, since it is a counting function over a declared alphabet and the failure
    modes are ordinary bugs that the forced values catch immediately. (2) That the random-table counts
    match the independently derived closed-form expectation: ~0.85, with the main risk being an error
    in the closed form rather than in the extractor, which is why both are emitted. (3) That the coverage
    audit finds the alphabet adequate for every declared condition type: ~0.35, and deliberately low,
    because single-bit joint-value symbols cannot express conditions coupling bits across positions
    and I expect the audit to name at least one such type - which is the useful outcome, since a named
    inexpressible type is a precise limit rather than a vague caveat. (4) That the resulting counts,
    once available, would combine with the degrees-of-freedom half into anything predictive: ~0.12,
    held very low for the same structural reason as the rest of this bucket, and explicitly not tested
    here.'
