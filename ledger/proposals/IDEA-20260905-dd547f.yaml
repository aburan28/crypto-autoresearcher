  target_complexity:
    time_exponent: Let C_D=binomial(n+D,D), the number of monomials through output degree D. Conditional only on
      explicit complete supplied bases for the graded spaces (I:d^infinity)_j and I_j through D and independently
      checked membership/completeness certificates, quotient-dimension postprocessing uses O(C_D^omega) field operations
      on at most C_D-dimensional direct-sum spaces. This is not a saturation-construction or saturation-completeness
      bound. End-to-end cost is C_prod+C_complete+C_read+O(C_D^omega), where C_prod constructs the bases and witnesses,
      C_complete independently verifies their relation to I:d^infinity and completeness, and C_read charges actual
      input/certificate bytes and coefficient handling. All three costs are explicit unresolved inputs, not unit-cost
      oracles, and may dominate. Without the certified input, the D-sized term cannot certify h_j. No sub-rho or
      total finite complexity bound is established.
    memory_exponent: The conditional quotient-dimension postprocessing stores O(C_D^2) field elements, plus actual
      supplied bases and certificate bytes. Peak memory and retained artifacts must also charge saturation-production
      and independent-completeness-verification memory M_prod and M_complete; those terms and coefficient bit lengths
      are unresolved. No total memory reduction is claimed.
    best_known: 'Generic rho: expected N^(1/2) work, O(1) state; BSGS: N^(1/2) work/storage. Automorphisms change
      constants. Advice requires separate charging.'
    data_queries: Self-generated fixtures only; all table/oracle access charged.
    hidden_overhead: Output cutoff D supplies no bound on denominator powers, ideal-membership witness degree, saturation-basis
      construction, or completeness verification. C_prod, C_complete, actual certificate size and coefficient bit
      complexity remain explicit unresolved costs and cannot be absorbed into O(C_D^omega). No certified saturated
      input is claimed to exist for the proposed fixtures.
    tradeoff_note: Full frontier unresolved; no parallel speedup or Pareto dominance claimed.
