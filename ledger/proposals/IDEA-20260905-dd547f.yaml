  assumptions:
  - Both models are defined over the same field and birationally equivalent on a certified open set.
  - Same points, factor-base set, relation arity and term-order convention; boundary points are handled, not silently
    deleted.
  - The torsion profile is truncated at declared D; any last-degree assertion requires a finite-length certificate.
    No empirical or formal profile-to-solving-degree implication is assumed. Any D-sized postprocessing estimate
    is conditional on explicit independently certified complete truncated saturated and ideal spaces as supplied
    input. Certification must establish both membership and completeness relative to the original I and d. Input
    production and that independent completeness verification have separately recorded, presently unresolved costs;
    D does not cap them.
  predictions:
  - metric: Truncated torsion dimensions h_0,...,h_D with grading and D; finite-length flag; denominator degree,
      peak presentation degree and preserved solution count
    direction: different
    minimum_effect: The denominator-free null has zero saturation defect; boundary-loaded pairs show defect localized
      to the exceptional component.
  minimal_test:
    design: 'Compare a nonsingular cubic with a permitted rational model on toy fields of 8 to 12 bits, using hand-specified
      point sets and one denominator-boundary fixture. First use two simple plane ideals with identical localization
      and different boundary components. The paper domain audit includes both k[x,y]/(x^2) with d=x (positive-dimensional
      support, no finite last degree) and k[x]/(x^2) with d=x (finite-length support). Report h_j only in the frozen
      window for either case; an unknown component beyond D cannot be called absent. Before pricing any profile,
      require the explicit supplied-space and independent-completeness input contract above, or leave the profile
      uncertified. The prospective paper cost audit holds output D fixed while the generator x^e*y and denominator
      x vary with e: a low-degree representative y does not authorize a D-sized saturation-witness budget. Record
      its production/completeness obligations separately; no ideal calculation or fixture execution occurs here.'
    proposal_only: true
    controls:
    - type: matched_null
      description: Two polynomially invertible coordinate changes with no denominator locus.
    - type: known_false
      description: A model conversion that discards a valid boundary point must fail the common-graph completeness
        check even if its displayed degree is lower.
    required_metrics:
    - Truncated torsion dimensions h_0,...,h_D with grading and D; finite-length flag; denominator degree, peak
      presentation degree and preserved solution count
    - construction work, peak bytes, certificate size
    - Separate C_prod, C_complete and C_read, or unresolved; actual denominator exponents and witness degrees
    - Supplied-space completeness certificate bytes and independent-verification memory
    required_artifacts:
    - Exact fixtures
    - Independent certificates
    - Complete controlled outputs
    stopping_rule: First exact contradiction or stated finite panel; missing prerequisites and limits are inconclusive.
      No execution in this task.
  falsification_conditions:
  - The degree gap persists with identical saturated filtered presentations, or the proposed defect does not distinguish
    a planted boundary component.
  confounders:
  - Hidden instance-dependent choices; omitted verification or representation costs.
