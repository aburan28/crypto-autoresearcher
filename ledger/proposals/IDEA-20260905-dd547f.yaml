idea:
  id: IDEA-20260905-dd547f
  title: Saturation defect measures the price of a favorable curve chart
  class: representation
  claim: 'For two rationally equivalent curve presentations, a favorable low-degree profile may come from omitted
    chart boundaries. Conjecture: the graded saturation defect of the graph ideal predicts which finite-parameter
    degree savings survive conversion to a common valid presentation.'
  mechanism: 'Freeze a standard positively graded polynomial ring R over k, homogeneous graph ideal I, homogeneous
    denominator d, and degree cutoff D. The denominator-torsion module is T=(I:d^infinity)/I=H^0_(d)(R/I). Record
    the bounded profile h_j=dim_k(T_j) for 0<=j<=D and the truncation endpoint D. Finite generation does not imply
    a finite last occupied degree; no last degree is reported without a separately certified finite-length hypothesis.
    Example domains to audit on paper: R=k[x,y], I=(x^2), d=x has T=R/I and nonzero graded pieces in arbitrarily
    large degree from y-powers. In R=k[x], I=(x^2), d=x, T is finite length with support in degrees 0 and 1. Both
    have denominator annihilation exponent 2, illustrating that exponent and last occupied degree are different
    invariants. The profile can locate exceptional-component torsion within the window, but any implication for
    presentation/solving degree needs a separate proved comparison and complete boundary treatment. Homogenization
    of affine charts must record the chosen grading and irrelevant-locus handling. Cost scope: D bounds only the
    reported graded window. The D-sized linear-algebra bound below applies solely to explicit supplied bases for
    every (I:d^infinity)_j and I_j, 0<=j<=D, accompanied by independently checked proofs that these spaces are complete
    and correctly related to the original I and d. No such input or certificate is asserted available here. Producing
    those bases and proving/checking their saturation completeness are separate unresolved costs C_prod and C_complete;
    they are not bounded by D. Low-degree class representatives may require high denominator powers or high-degree
    membership witnesses. The proposal does not posit an oracle for these bases, nor any unproved witness-degree
    sufficiency theorem.'
