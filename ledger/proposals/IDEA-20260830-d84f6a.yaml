  class: control

  claim: >-
    PROVENANCE, STATED FIRST BECAUSE IT CHANGES THE SHAPE OF THIS RECORD. This
    proposal exists because EXP-MONO-805a02's Red Team review
    (experiments/EXP-MONO-805a02/reviews/red-team/red-team-report.yaml, item 2,
    ITEM_2_GENUINELY_PARTIAL_LOCUS, and its script
    experiments/EXP-MONO-805a02/reviews/red-team/rt3_parity_law.py) derived and
    spot-measured (15-400 trials/cell) that for the m-th Semaev summation
    polynomial S_m(x_1,...,x_{m-1},T) over E: y^2=f(x)=x^3+Ax+B/F_p, specialising
    each x_i to either an F_p-rational on-curve x-coordinate ("residue":
    f(x_i) a nonzero quadratic residue mod p) or an x-coordinate whose point
    is only defined over F_{p^2} ("non-residue": f(x_i) a quadratic
    non-residue), the fibre splits completely over F_p iff j = 0 (every
    x_i on-curve -- KN-FIND-c41ea9's own factor-base locus) OR j = m-1 (every
    x_i off-curve), where j = #{i : f(x_i) is a non-residue}; intermediate
    1<=j<=m-2 does not split. The Red Team framed this as a fresh derivation
    made during an adversarial review, explicitly flagged as
    "CANDIDATE FOR THE RANKING, NOT EVIDENCE ... belongs in a fresh proposal
    under RQ-MONO-001 with its own contract and its own independent
    re-derivation" (red-team-report.yaml, spawned_ids_and_resource_reading).

    THE NOVELTY SCREEN THIS RECORD RAN (see `novelty_screen` below) FOUND THAT
    THE GENERAL LAW IS NOT NEW TO THIS LANE. IDEA-20260805-cf2d5a (added
    2026-08-05, `status: proposed`), mechanism STEP 4, states -- as an
    unconditional THEOREM derived from the Kummer/Frobenius sign-character
    argument, not as a heuristic -- exactly this dichotomy in full generality
    at every m: writing s_i = chi(f(x_i)) in {+1,-1} for the quadratic
    character, "all m-1 characters equal ==> every root is in F_p ...
    otherwise ==> NO root is in F_p." "All equal to +1" is j=0 (c41ea9's
    locus); "all equal to -1" is j=m-1 (the Red Team's "genuinely open"
    branch). This was restated formally, with a full proof_search_map and
    three named heuristics, as H-MONO-45183a (Part A, HEUR-KUM-1, itself
    marked "asserted as a THEOREM, proved above, not as a heuristic"), whose
    paired experiment EXP-MONO-12ce1c exists but is `status: review_required`,
    `execution_authorized: false`, `evidence_eligible: false` -- IT HAS NEVER
    BEEN RUN. So the mathematical content of the Red Team's item 2 is, at the
    level of the general claim, a rediscovery of an already-derived,
    already-proposed, but never-executed theorem in this same research
    question -- a fact that neither EXP-MONO-805a02's execution report nor its
    own evidence record EV-MONO-08a31f (whose `proof_status_note` calls the
    parity law "itself a fresh derivation") surfaced, and which this record
    reports plainly rather than repeating the omission.

    WHAT THIS RECORD ACTUALLY PROPOSES, GIVEN THAT SCREEN.
    (A) THE MISSING EXPERIMENT. Neither H-MONO-45183a's own design (never
    executed) nor the Red Team's ad hoc script (15-400 trials/cell, 2-4 j
    values sampled, no multiplicity accounting at m=5, S_5 rebuilt by a fresh
    sympy.resultant call inside the sampling loop) constitutes a full-
    resolution, properly controlled measurement of the j=0..m-1 ladder. This
    record specifies one: every j value from 0 to m-1 at m in {4,5}, both
    p in {211,1009}, at sample sizes (500/cell at m=4, 200/cell at m=5) an
    order of magnitude more resolved than the Red Team's m=5 arm, with the
    multiplicity-aware metric Stage 5 of EXP-MONO-805a02 itself lacked (Red
    Team objection O-2).
    (B) A GENUINELY NEW COST-IDENTITY COROLLARY. H-MONO-40aca5 cashes
    KN-FIND-c41ea9's j=0 locus as a cost identity: D_trial(E) = m-1 group
    additions on E(F_p). Neither that record, nor cf2d5a, nor H-MONO-45183a
    states a cost identity for the j=m-1 locus. This record derives one: for
    x_i with f(x_i) a non-residue, fixing a non-residue delta and writing
    f(x_i)/delta = (y_i')^2 with y_i' in F_p (a square, since
    nonresidue/nonresidue = residue), the point P_i = (x_i, sqrt(delta)*y_i')
    in E(F_{p^2}) satisfies Frob(P_i) = -P_i (elementary: Frob(sqrt(delta)) =
    -sqrt(delta) since delta is a non-residue, and y_i' in F_p is
    Frobenius-fixed). The substitution (x,y') |-> (X,Y) = (delta*x, delta^2*y')
    carries the auxiliary curve E': (y')^2 = f(x)/delta ISOMORPHICALLY (over
    F_p(sqrt(delta)), by the identity y = sqrt(delta)*y') onto the standard
    quadratic twist E_delta: Y^2 = X^3 + A*delta^2*X + B*delta^3 -- an
    ordinary elliptic curve OVER F_p with ITS OWN F_p-rational addition law.
    Because an isomorphism of curves over any field extension commutes with
    the group law by definition, the signed sum Q = sum eps_i P_i can be
    computed as R = sum eps_i (delta*x_i, delta^2*y_i') on E_delta(F_p) --
    exactly m-1 group additions, using ONLY F_p arithmetic, on a curve
    already constructible with the existing `harness/toycurve.py`
    `EllipticCurve` class with no modification -- and then x(Q) = X(R)/delta,
    one further F_p multiplication by a precomputed constant. PREDICTED:
    D_trial for the j=m-1 branch is m-1 additions plus one multiplication
    plus one O(1) lookup against a precomputed "twisted factor base" -- the
    SAME order as j=0's m-1, with one disclosed extra constant-time
    operation, not the "genuine root-finding... NOT reducible to group
    additions" cost H-MONO-40aca5's own Step 5 predicted and its own Red Team
    review showed does not hold on this second locus either.

  object_first_candidate:
    tracked_object: >-
      TWO OBJECTS, NAMED SEPARATELY BECAUSE THEY DO DIFFERENT WORK AND ONLY
      ONE OF THEM IS ACTUALLY NEW.
      OBJECT 1 (NOT NEW, STATED HONESTLY): the residue-class parity vector
      s = (chi(f(x_1)),...,chi(f(x_{m-1}))) in {+1,-1}^{m-1}, or its Hamming
      weight j = #{i: s_i=-1}. This is a COARSENING of IDEA-20260805-cf2d5a's
      already-tracked "square-class vector" -- j is literally the object
      cf2d5a's own STEP 4 computes with when it writes "all m-1 characters
      equal." Tracking j instead of the full vector s discards WHICH
      coordinates are off-curve and keeps only how many -- a genuinely lossy
      projection of s, but one cf2d5a's own theorem already licenses (the
      theorem's conclusion depends on s only through whether all entries
      agree, which is exactly a function of j and nothing else), so this
      object earns no novelty credit on its own; it is adopted here only
      because it is the cheapest sufficient statistic for the ALREADY-CLAIMED
      law and is what the full-resolution measurement needs to stratify by.
      OBJECT 2 (THE NEW ONE): the SIGNED-SUM POINT Q = sum eps_i P_i on the
      j=m-1 locus, followed not through E(F_{p^2}) (where it lives natively,
      with two-element coordinates over the extension) but through its image
      R = sum eps_i (delta x_i, delta^2 y_i') on the quadratic twist
      E_delta(F_p) -- an F_p-RATIONAL avatar of the same group element.
    lossy_projection_identifiability_audit:
      what_is_discarded: >-
        The F_{p^2}-coordinate representation of Q (an element of a rank-2
        F_p-vector space per coordinate, i.e. 4 F_p-field-elements of raw
        data per point before the isomorphism) is replaced by (X,Y) in
        F_p x F_p -- exactly the F_p-rational half of that data. What is
        discarded is the sqrt(delta)-multiple structure: every point in the
        trace-zero-under-Frobenius set {P in E(F_{p^2}): Frob(P)=-P} is
        WRITTEN as x, sqrt(delta)*y' with y' in F_p, and only y' (not the
        sqrt(delta) factor, which is fixed and shared by every such point) is
        retained.
      why_genuinely_lossy_and_compatible: >-
        This is not a change of coordinates in the KN-LIT-7595 sense (nothing
        recoverable is thrown away that the group law needs): the retained
        pair (X,Y) determines Q exactly (X=delta*x recovers x; Y/delta^2=y'
        together with the FIXED, curve-wide choice of sqrt(delta) recovers y),
        so no information about Q itself is lost -- but the representation
        drops from an F_{p^2}-arithmetic cost model to an F_p-arithmetic cost
        model, which is the entire content of the claim. It is compatible
        with the target's operations because E_delta's own Weierstrass
        addition formulas (identical in shape to E's, already implemented in
        `harness/toycurve.py`) propagate R deterministically through m-1
        additions without ever consulting an F_{p^2} representation, and the
        final x(Q)=X(R)/delta step is a single disclosed F_p multiplication,
        not a hidden field-extension cost.
      is_it_only_a_change_of_coordinates: >-
        NO. A change of coordinates would be trivial in cost; this is not --
        it replaces the F_{p^2} field-arithmetic cost the Red Team's own
        script pays for every j=m-1 trial (working with x,y in F_{p^2}
        throughout `rt3_parity_law.py`'s root-finding) with pure F_p
        arithmetic on a DIFFERENT but standard curve, at asymptotically the
        SAME operation count as the j=0 branch. That reduction in field size
        is the entire deliverable, exactly parallel to H-MONO-40aca5's own
        reduction of a polynomial root-find to group additions on the j=0
        locus.
