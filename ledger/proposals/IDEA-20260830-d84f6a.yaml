  minimal_test:
    design: >-
      Four stages, cheapest and most decisive first, all reusing
      `harness/semaev.py` (s3_expr, s4_expr, one further resultant
      elimination for S_5, matching H-MONO-40aca5's own Stage-2 pattern) and
      `harness/toycurve.py` (EllipticCurve, Point) with NO modification
      needed for E_delta (constructed as
      `EllipticCurve(p, a*d*d % p, b*d**3 % p)` for a precomputed non-residue
      d).
      STAGE 1 (hard gate, near-zero compute): reproduce KN-FIND-c41ea9's /
      H-MONO-40aca5's committed m=4, p=211, j=0 fixture (193 specialisations,
      193/193) cell for cell before any new cell is read.
      STAGE 2 (the full-resolution parity census this lane has never run):
      for m in {4,5}, p in {211,1009}, and EVERY j from 0 to m-1, sample
      j-stratified tuples (choose j of the m-1 coordinates from a
      precomputed "twisted factor base" of non-residue x-coordinates --
      j is by definition the NUMBER OF NON-RESIDUES -- and the remaining
      m-1-j from a precomputed on-curve factor base),
      substitute into the already-built S_4/S_5 (built ONCE symbolically,
      then evaluated numerically per trial -- NOT rebuilt via a fresh
      `sympy.resultant` call every trial, which is what made the Red Team's
      own m=5 arm expensive enough to cap at 15 trials), and factor mod p.
      Report split_with_multiplicity AND split_distinct AND the full
      factor-degree multiset, at n=500/cell for m=4 (4 cells x 2 primes = 8
      cells) and n=200/cell for m=5 (5 cells x 2 primes = 10 cells).
      STAGE 3 (the new cost-identity check): restricted to the j=m-1 cells
      of Stage 2 (m=4 and m=5, both primes -- 4 cells, same n as Stage 2),
      for every trial additionally compute x(Q) via the E_delta twist-
      arithmetic route of `mechanism` STEP 5 and check exact set equality
      against the direct polynomial root(s) from Stage 2.
      STAGE 4 (controls, all mandatory): (a) the wrong-rescaling-constant
      mutant construction (twist E_delta and sum R built exactly as
      STEP 5 does, final rescaling by delta' != delta -- mutating BOTH
      would be an isomorphic twist and could not fail), m=4, p=211, j=3, n=50, predicted to
      fail the exact-match test at Stage 3's rate; (b) the tau=4-curve intermediate-j control,
      m=4, p=211 only, n=300 across all intermediate j cells, curve found by
      a deterministic trial search over b' (increasing from a fixed seed)
      for the first b' giving a non-singular curve with f(x)=x^3+37x+b'
      having three distinct roots mod 211 (i.e. tau=4), reported explicitly
      once found rather than hand-picked in advance.
    controls:
      - >-
          HARD-GATE FIXTURE REPRODUCTION (Stage 1, CAN FAIL): the already-
          committed m=4/p=211/j=0 result must reproduce exactly before
          anything new is interpreted.
      - >-
          MULTIPLICITY-AWARE METRIC (Stage 2, throughout): both
          split_with_multiplicity and split_distinct are reported for every
          cell, closing the exact gap the Red Team's own O-2 objection
          identified in EXP-MONO-805a02's Stage 5.
      - >-
          PROVES-TOO-MUCH / WRONG-RESCALING-CONSTANT MUTANT (Stage 4a,
          CAN FAIL EITHER WAY): a deliberately wrong final rescaling
          (X(R)/delta' with delta' != delta) must fail to reproduce
          x(Q); if it does not fail, the exact-match test has no
          discriminating power regardless of the main construction's own
          reported success rate. The mutant is NOT a y_i' sign flip,
          which relabels the signed-sum enumeration, and NOT a twist
          rebuilt with delta' alongside the matching rescaling, which is
          an F_p-isomorphism of E_delta; neither changes the fibre x-set
          and both would pass against a correct construction too.
      - >-
          NEAREST-OBJECT / 2-TORSION-DIVERSITY CONTROL (Stage 4b, CAN
          FAIL): a curve where the genericity gap of `mechanism` STEP 4 is
          maximally likely to fire (tau=4) must show a measurably different
          intermediate-j behaviour than the fixture curve, or the report
          must say explicitly that toy-scale N could not resolve the
          predicted difference.
      - >-
          UNIT-DECLARATION TRIPWIRE (inherited from H-MONO-40aca5): the
          extra F_p multiplication (x(Q)=X(R)/delta) is counted and reported
          explicitly in Stage 3's cost accounting; it is never silently
          absorbed into "the same cost as j=0."
    required_metrics:
      - split_with_multiplicity and split_distinct per (m, p, j) cell
      - full squarefree/full factor-degree multiset per cell (per the Red
        Team's own useful C-4 null-object practice)
      - exact set-equality rate between twist-computed and direct-root x(Q)
        at every j=m-1 cell
      - exact set-equality rate for the deliberately wrong-rescaling-
        constant mutant
      - intermediate-j split rate on the tau=4 curve versus the fixture curve
      - operation count for the twist route (additions on E_delta, plus the
        one disclosed multiplication), reported beside, never folded into,
        H-MONO-40aca5's own m-1-addition count for j=0

  falsification_conditions:
    - >-
      The m=4/p=211/j=0 fixture does not reproduce. Stop; nothing else is
      interpretable.
    - >-
      Any intermediate-j (1<=j<=m-2) tuple, confirmed to satisfy the
      genericity condition of HEUR-PARITY-2, shows complete splitting. This
      refutes cf2d5a/45183a's own Part A theorem, not merely this record,
      and is this record's single most consequential possible outcome --
      escalate rather than absorb quietly.
    - >-
      j=0 or j=m-1 ever fails to split completely (with multiplicity) at
      the tested m, p. Refutes the base theorem this record was built to
      stratify and extend.
    - >-
      The twist-computed x(Q) disagrees with the direct-root x(Q) at any
      j=m-1 trial. Falsifies `mechanism` STEP 5's cost identity; the
      isomorphism or sign convention has an error this record's hand
      derivation missed.
    - >-
      The deliberately wrong-rescaling-constant mutant construction ALSO reproduces
      x(Q) at a rate near 1.000. The exact-match test has no discriminating
      power and Stage 3's main result, however clean, is unsupported.
    - >-
      The tau=4 curve shows NO measurable difference from the fixture curve
      at intermediate j, AND the sample size is judged adequate to detect
      the predicted tau/N-order effect. Then the genericity gap this record
      names either does not exist as stated or is smaller than the Part B
      formula predicts, and H-MONO-45183a's own collision-rate derivation
      needs re-examination.
    - >-
      Any timeout, crash, or construction failure at any stage.
      failed_infrastructure per AGENTS.md rule 3, never negative evidence.

  confounders:
    - >-
      DOUBLE-COUNTING NOVELTY: the parity law itself is NOT new (see
      `novelty_screen`); only the full-resolution execution and the twist
      cost identity are. Any later reader citing this record as the SOURCE
      of the j=0-or-j=m-1 law rather than IDEA-20260805-cf2d5a/H-MONO-45183a
      is mis-citing it.
    - >-
      SIGN-CONVENTION AMBIGUITY IS BENIGN HERE, AND MUST NOT BE USED AS A
      CONTROL: constructing y_i'=sqrt(f(x_i)/delta) has two roots in F_p,
      but the compared object is the SET {x(sum eps_i P_i)} over all sign
      classes, and replacing P_i by -P_i only relabels eps_i, leaving that
      set fixed (the same reason S_m does not depend on those choices).
      Stage 4a therefore mutates the final RESCALING constant alone
      (X(R)/delta' with delta' != delta), which scales the x-set by
      delta/delta' != 1, instead of the square-root sign, which cannot
      move it -- and instead of rebuilding the twist with delta' as
      well, which also cannot, since delta' = s^2 delta makes E_delta'
      F_p-isomorphic to E_delta and the two rescalings cancel the
      isomorphism.
    - >-
      GENERICITY GAP MAGNITUDE UNKNOWN AT TOY SCALE: the tau/N-order
      collision probability predicted for the intermediate-j gap may be far
      below what n=500 (m=4) or n=200 (m=5) trials can resolve at p<=1009;
      a null result on the tau=4 control does not confirm the gap is absent,
      only that it was not observed at this sample size, and the report must
      say so rather than treat a null as a confirmation.
    - >-
      MEMORY AND TABLE-BUILD COST: the "twisted factor base" is a second
      precomputed table of the same order as the on-curve factor base
      (H-MONO-40aca5's own H2 confounder, restated here for the second
      table); building it once per (p, delta) is not charged against
      per-attempt D_trial and must be reported separately.
    - >-
      m=5's S_5 CONSTRUCTION COST: `harness/semaev.py` does not yet contain
      an `s5_expr`; this record requires ONE further resultant elimination
      in the identical pattern `s4_expr` already uses, matching
      H-MONO-40aca5's own Stage-2 requirement -- an implementation cost, not
      a mathematical one, but disclosed rather than assumed away.
    - >-
      AUTHORSHIP AND ATTRIBUTION: this record's Object 1 content is
      cf2d5a's/45183a's; only the full-resolution measurement design and the
      twist-arithmetic cost identity (Object 2) are this record's own.

  interpretation_limits:
