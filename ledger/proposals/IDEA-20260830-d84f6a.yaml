  heuristic_assumptions:
    - id: HEUR-PARITY-1
      statement: >-
        NO HEURISTIC IS REQUIRED for the core containment: on the j=0 or
        j=m-1 locus, every sign-class value is Frobenius-fixed as a CLASS,
        unconditionally, for every non-singular E and every p>3. This is
        `mechanism` STEP 3, re-derived here independently of
        cf2d5a/45183a and in agreement with both.
      rigorous_support: >-
        Elementary Frobenius linearity plus the quadratic-character
        eigen-relation Frob(P_i)=chi(f(x_i))*P_i, itself an immediate
        consequence of Euler's criterion. No distributional assumption
        anywhere in this step.
      validation_plan: >-
        Stage 1 (hard-gate fixture) and Stage 2's j=0/j=m-1 cells at n=500
        (m=4) / n=200 (m=5), both primes -- exhaustive verification at
        those sizes, not a distributional comparison.
      falsification_condition: >-
        A single j=0 or j=m-1 tuple failing to split completely with
        multiplicity, at any tested m, p.
    - id: HEUR-PARITY-2
      statement: >-
        FOR a sampled (m-1)-tuple with intermediate j, no signed subset sum
        of the corresponding points lies in E[2] -- the genericity condition
        `mechanism` STEP 4 identifies as necessary for "intermediate j never
        splits" to hold LITERALLY (not merely generically). Under
        independent-uniform sampling this fails with probability of order
        tau/N per H-MONO-45183a's own Part B formula (tau=#E(F_p)[2]).
      rigorous_support: >-
        H-MONO-45183a's B-1/B-2 collision criterion and probability
        derivation (itself elementary and unconditional given
        independent-uniform point sampling -- the same "sum of independent
        uniforms on a finite abelian group is uniform" fact classical
        probability theory supplies for any finite group, here specialised
        to E(F_p)). THE GAP: this record's own sampling draws x-coordinates
        by residue class and applies a deterministic sign convention rather
        than drawing points uniformly on E(F_p), so the leading-order
        tau/N estimate is imitative rather than exact for this specific
