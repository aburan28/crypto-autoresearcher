  mechanism: >-
    RE-DERIVED HERE, INDEPENDENTLY OF BOTH THE RED TEAM'S SCRIPT AND
    cf2d5a/45183a'S PROSE, TO AVOID THIS RECORD'S OWN CREDIBILITY RESTING ON
    EITHER UNCHECKED.

    STEP 1 (the fibre, as points). S_m(x_1,...,x_m)=0 iff there exist points
    P_i on E with x(P_i)=x_i summing to O. Fix x_1,...,x_{m-1} and a choice
    of y_i with y_i^2=f(x_i) (in F_p if f(x_i) is a residue, in F_{p^2}
    otherwise); this fixes P_i up to sign. The fibre over
    (x_1,...,x_{m-1}) is {x(eps_1 P_1+...+eps_{m-1}P_{m-1}): eps in
    {+-1}^{m-1}}, with eps and -eps giving the same x-value, hence at most
    2^{m-2} distinct values, matching deg_T S_m=2^{m-2} (KN-FIND-c41ea9;
    independently symbolically re-verified by the Red Team's rt1_symmetry.py
    for m=4).

    STEP 2 (Frobenius is the character vector). If f(x_i) is a residue,
    y_i in F_p and Frob(P_i)=P_i. If f(x_i) is a non-residue, write
    delta for a FIXED non-residue and y_i' in F_p with (y_i')^2=f(x_i)/delta
    (a residue, since nonresidue/nonresidue=residue); then
    y_i=sqrt(delta)*y_i' with sqrt(delta) in F_{p^2}\F_p satisfies
    Frob(sqrt(delta)) = delta^{(p-1)/2}*sqrt(delta) = -sqrt(delta) (delta a
    non-residue), so Frob(y_i)=Frob(sqrt(delta))*y_i' = -sqrt(delta)*y_i'
    = -y_i (y_i' in F_p is Frobenius-fixed), i.e. Frob(P_i)=-P_i. In both
    cases Frob(P_i)=s_i*P_i with s_i=chi(f(x_i)) in {+1,-1} the quadratic
    character -- this is the same elementary computation cf2d5a's STEP 4
    and H-MONO-45183a's A-3 state, re-derived here from scratch rather than
    imported.

    STEP 3 (when the fibre is fixed pointwise -- the parity law). By
    linearity, Frob(sum eps_i P_i) = sum eps_i s_i P_i. Writing this as the
    value at sign-class eps' = eps (entrywise product with) s: the CLASS
    eps' equals the class eps (mod global sign) iff s = (1,...,1) [j=0] or
    s = (-1,...,-1) [j=m-1] -- for ANY other s there exists at least one eps
    for which eps' is a genuinely different class. This part needs no
    genericity assumption: it is a statement about the ACTION on sign
    classes, independent of whether any two classes happen to produce equal
    field values.

    STEP 4 (the genericity gap this record identifies and cf2d5a/45183a do
    not state explicitly for Part A). "eps' is a different class from eps"
    does NOT by itself imply "x(sum eps'_i P_i) != x(sum eps_i P_i)": two
    DIFFERENT sign classes can produce the SAME x-value exactly when a signed
    subset sum of the P_i lies in E[2] (H-MONO-45183a's own Part B,
    B-1/B-2). If that happens for the specific pair (eps, eps*s) at an
    INTERMEDIATE j, the value at class eps becomes accidentally
    Frobenius-fixed even though its class is not -- a spurious rational root
    outside {j=0, j=m-1}. This is a genuine, if low-probability
    (order tau/N per H-MONO-45183a B-2, tau = #E(F_p)[2]), gap in the
    "intermediate j never splits" half of the law as commonly stated, and it
    is the reason this record's `heuristic_assumptions` names a genericity
    condition that neither cf2d5a nor 45183a states as a separate item for
    Part A.

    STEP 5 (the twist-arithmetic cost identity for j=m-1, THE NEW COROLLARY).
    On the j=m-1 locus every P_i has Frob(P_i)=-P_i, so every P_i is
    x_i, sqrt(delta)*y_i' with y_i' in F_p. The map
    phi: (x,y') |-> (delta*x, delta^2*y') sends the curve
    E': (y')^2 = f(x)/delta to Y^2 = delta^3*f(X/delta)
    = X^3 + A*delta^2*X + B*delta^3 =: E_delta(X,Y) (substitute x=X/delta
    and clear denominators; verified by direct expansion:
    delta^3*f(X/delta) = delta^3*((X/delta)^3+A*(X/delta)+B)
    = X^3 + A*delta^2*X + B*delta^3). E_delta is the standard quadratic
    twist of E by delta and is non-singular whenever E is (its discriminant
    is delta^6 times E's, per the standard quadratic-twist discriminant
    scaling). The composite map (x,y_i')|->(x,sqrt(delta)*y_i')|->
    (delta*x,delta^2*y_i') is an isomorphism of curves E' -> E_delta over
    F_p(sqrt(delta)) covering an isomorphism E'->E over the SAME field via
    y=sqrt(delta)*y'; isomorphisms of elliptic curves commute with the group
    law over any field where they are defined. Hence: compute
    R = sum eps_i*(delta*x_i, delta^2*y_i') using E_delta's ORDINARY,
    F_p-rational Weierstrass addition law (m-1 additions, zero F_{p^2}
    arithmetic, directly instantiable as
    `EllipticCurve(p, a*d*d % p, b*d**3 % p)` in the EXISTING
    `harness/toycurve.py` with no code change), then x(Q) = X(R)*inverse(delta)
    mod p (one precomputed-constant multiplication). PREDICTED: this
    reproduces the direct polynomial-root x(Q) EXACTLY, at cost m-1 additions
    plus 1 multiplication plus 1 O(1) lookup against a precomputed "twisted
    factor base" {(delta*x_i, delta^2*y_i')} -- the same order as
    H-MONO-40aca5's D_trial(E)=m-1 for j=0, with one disclosed extra
    constant-time operation.

    HONEST STATUS OF STEP 5. This algebraic derivation was worked by hand in
    this record, in the same style as KN-FIND-c41ea9's own two-line
    derivation, and is believed correct, but it has NOT been machine-checked
    in this session: the Idea Generator has no code-execution tool available.
    The discriminant-scaling and isomorphism-commutes-with-group-law facts
    are standard (quadratic twists of elliptic curves, e.g. Silverman's "The
    Arithmetic of Elliptic Curves" III.1 / Washington's "Elliptic Curves:
    Number Theory and Cryptography" ch. 2) but are cited from memory, not
    fetched in this session -- see `citations`. `minimal_test` Stage 3 is
    exactly the machine verification this derivation needs before any claim
    tier beyond "hand derivation, unverified by computation" is warranted.

