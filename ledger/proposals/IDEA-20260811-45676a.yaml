idea:
  id: IDEA-20260811-45676a
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  claim_tier: toy
  title: >-
    A BLACK-BOX BARRIER FOR DIRECTION 1, WHERE THE ELIMINATION-COST ARGUMENT IS
    PROVABLY VACUOUS: give the adversary EVERY curve's rational point group in
    the clear, fully coordinatised, with discrete logarithms free -- and
    Cl(O)-vectorization still needs Omega(sqrt(h)) action queries in the generic
    group action model, because the multiplier data it gains is a coboundary
    and the simulator can invent it. The shape S ruled out is "reductions that
    reach the class-group coordinate through the N-part of the point groups".
    The boundary is named and is NOT R1 but R5: ell-torsion for ell != N, where
    the same simulation provably fails because torsion coordinates DO determine
    an isogeny
  class: mechanism

  claim: >-
    (A) WHY DIRECTION 1 NEEDS A BARRIER AT ALL, WHEN DIRECTION 2 DOES NOT.
    IDEA-20260811-40c0b5 shows that an oracle is worth at most its own
    elimination cost, and that for Direction 2 the elimination cost of
    vectorization (about h^{1/2} = p^{1/4}) sits BELOW the rho baseline
    (p^{1/2}), which settles that direction on arithmetic alone. Applied to
    Direction 1 the identical argument is VACUOUS: eliminating an ECDLP oracle
    costs p^{1/2}, which EXCEEDS the p^{1/4} cost of the target problem
    (vectorization). So Direction 1 -- "does a free ECDLP oracle for the curves
    in one class help solve Cl(O)-vectorization on that class?" -- is genuinely
    not settled by cost, and the campaign has never proved anything about it
    beyond IDEA-20260807-0fafe8's Hom = 0 remark. This record supplies the
    missing barrier.

    (B) THE MODEL, STATED PRECISELY BECAUSE THE RESULT IS SCOPED BY IT.
    Call it TGGA (transparent-point generic group action). An adversary A
    receives, for free and in the clear:
      - p, t, D, the order O, h = h(O), and the group structure of Cl(O);
      - a set L of h abstract LABELS, one per curve in the class, with a random
        bijection to the curves hidden from A;
      - an ACTION oracle Act([a], label) returning the label of [a] * E;
      - and -- this is the record's whole point -- for EVERY label, the full
        rational point group presented as Z/N with an explicit generator, with
        every discrete logarithm free. Equivalently A is given an ECDLP oracle
        for every curve in the class, and more: it is given the entire group in
        coordinates.
    A is asked to VECTORIZE: given two labels, output the connecting class.

    (C) THE BARRIER, WITH QUANTIFIER ORDER EXPLICIT.
      THEOREM (proposed): FORALL h, FORALL adversaries A making q queries to
      Act, THERE EXISTS a simulator S such that FORALL instances (label_1,
      label_2) drawn with the connecting class uniform in Cl(O):
        Pr[A^{Act, transparent points} outputs the connecting class]
          <= O(q^2 / h) + negl,
      hence q = Omega(sqrt(h)) = Omega(p^{1/4}).
      THE POINT DATA IS FREE IN THE STRONGEST SENSE: S manufactures it.
      Note the order carefully. The witness (the simulator) is allowed to depend
      on h and on the group Cl(O) but NOT on the instance; the conclusion is
      uniform over instances. The following weaker readings are NOT claimed:
        (W1) FORALL instances THERE EXISTS a simulator -- trivial and void.
        (W2) the bound holds only on average over the CLASS ensemble -- not
             needed; it holds per class with the connecting element uniform.
      AVERAGE-CASE VERSUS WORST-CASE: the statement is average-case over the
      connecting class, which is the STRONGER form of a lower bound (a
      worst-case lower bound would be weaker). BASE-POINT CHOICE: A may choose
      the generator of every point group freely; that freedom is exactly the
      gauge in (D) and is why it is free. KNOWLEDGE OF End(E): granted in full.

    (D) THE LOAD-BEARING LEMMA, AND IT IS ALREADY MEASURABLE.
      SIMULATION LEMMA. The point-group data attached to the labels is
      simulable: S assigns to each label an independent copy of Z/N with a
      generator of its own choosing. Consistency with the action requires only
      that, whenever A composes isogenies, the induced multipliers compose --
      and by the HOLONOMY LEMMA of IDEA-20260811-3d05e3 the multiplier attached
      to any path is a free parameter, because the map O -> O/n = Z/N is
      surjective, so every loop value in (Z/N)^* is realisable by some principal
      ideal. Therefore ANY assignment of multipliers satisfying the cocycle
      condition is realisable, S may choose the trivial one, and A cannot
      distinguish. In one sentence: THE N-PART OF THE POINT GROUPS IS A
      COBOUNDARY OVER THE CLASS GROUP, SO IT IS GAUGE, SO IT IS FREE.
    That lemma is not asserted on intuition: it is the exact quantity
    IDEA-20260811-3d05e3 measures at toy scale in one CPU-hour, and a measured
    failure of full holonomy there falsifies this record before it is proved.

    (E) THE SHAPE S THAT IS RULED OUT, NAMED SO THE NEGATIVE IS USABLE.
      S := reductions from Cl(O)-vectorization to ECDLP whose only use of the
      curves' point data is the N-primary part -- i.e. discrete logarithms,
      group structure, and multipliers of isogenies restricted to the
      order-N subgroups -- and which treat the curves themselves as opaque
      labels acted on by Cl(O).
    No reduction of shape S exists relative to the TGGA oracle. That is a
    publishable-shaped negative with a named obstruction (the coboundary /
    gauge freedom of the multiplier cocycle) and it is exactly the form
    docs/inventor-protocol.md section 4 accepts.

    (F) THE BOUNDARY, WHICH IS THE FORWARD GUIDANCE AND IS DIFFERENT FROM EVERY
    PREVIOUS CLOSURE IN THIS LANE. Every prior L10 closure ends by naming R1
    (x-coordinates as field elements) as the residual class. THIS ONE DOES NOT.
    Its simulation fails, provably and identifiably, at R5: the ell-torsion for
    small ell != N. The reason is concrete and is the mechanism of every
    practical isogeny computation: the kernel of an ell-isogeny is a subgroup of
    E[ell], and the eigenvalue structure of Frobenius on E[ell] identifies WHICH
    of the two rational ell-isogenies was taken. So a cocycle valued in
    ell-torsion structure is NOT gauge -- the simulator cannot invent it
    consistently, because consistency there encodes the actual walk. Therefore:
      GIVING AWAY EVERY POINT GROUP E(F_p) IN FULL IS FREE.
      GIVING AWAY E[ell] FOR ONE SMALL ell != N IS NOT.
    That dichotomy is the record's most useful output, it is sharp, it is
    testable at toy scale, and it tells the campaign exactly where the only
    remaining Direction-1 leverage lives: resource R5, not R1.

    (G) WHAT THIS IS NOT. It is not a lower bound on vectorization in the real
    world (the model hides the j-invariants, which are real data). It is not a
    claim that Direction 1 is impossible. It is a statement that ONE specific
    and very powerful resource -- complete transparency of every rational point
    group in the class, i.e. a free ECDLP oracle everywhere -- is simulable
    against the vectorization problem, and is therefore worth nothing against
    it.

  resource_label: >-
    Audit lane: consumes no resource. It EXTENDS the campaign's admissibility
    filter and KN-FIND-b7e091's simulation programme to a new oracle class --
    complete point-group transparency, audited against the vectorization
    problem rather than against ECDLP -- exactly as IDEA-20260807-1b7241 did in
    the opposite direction. The resources it names as escaping are R5
    (ell-torsion as a Galois module) and, secondarily, R2 (the curve equation /
    j-invariant, which the model hides behind labels).
  admissibility: admissible
  admissibility_argument: >-
    Nothing here applies an endomorphism to a point of G to extract a
    congruence; the record's finding is that doing so is gauge. The audited
    oracle is point-group transparency, which is not the incidence oracle and
    not the endomorphism-image oracle of KN-FIND-b7e091 -- it is strictly
    stronger than both -- so this extends that finding to a new class rather
    than revisiting it. The TARGET of the audit is vectorization, not ECDLP,
    which is why the admissibility filter for ECDLP lanes does not directly
    apply and why the record states its own model instead.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the primary lens: the connecting ideal class; the
      kernel ideal of <Q>; the endomorphism scalar on G; cost functionals as
      class functions; the plain generic-group transcript.
    tracked_object: >-
      THE SIMULATOR'S CONSISTENCY OBLIGATION: the set of constraints that a
      manufactured point-group assignment must satisfy to be indistinguishable
      from the real one, tracked as the adversary makes queries. Not the data,
      not the answers -- the constraints on inventing them.
    lossiness: >-
      GENUINELY LOSSY. The projection maps the real world (h curves, each with
      real coordinates, real point groups, real torsion, real j-invariants) to
      a system of equations over (Z/N)^* indexed by the queried edges. It
      discards every j-invariant, every field element, and all torsion at
      primes other than N. It is discarded COMPATIBLY with the target's
      operations because the constraint system composes: querying Act extends
      the system by one equation, and the solvability of the extended system is
      determined by the previous one plus the new edge -- deterministic one-step
      propagation. A projection that retained the j-invariants would be a
      change of coordinates on the real world and would gain nothing.
    propagation: >-
      One step: an Act query adds one edge and one multiplier unknown, together
      with the cocycle relation. Measurable directly by instrumenting a
      simulator on toy classes and counting, per query, whether the constraint
      system remains solvable. Predicted: always solvable for N-part
      constraints (full holonomy); NOT always solvable once ell-torsion
      constraints for ell != N are added, which is the boundary.
    survival_score: >-
      Survives arbitrarily many queries as long as the constraints are N-part
      only. DISSOLVES at the first ell-torsion constraint with ell != N,
      because the ell-torsion action pins the isogeny. That dissolution point is
      sharp, is the record's declared boundary, and is directly measurable:
      instrument the constraint system and find the first query at which it
      becomes unsatisfiable.

  mechanism: >-
    STEP 1 (zero compute). Fix the TGGA model and the quantifier order; freeze
    them.

    STEP 2 (zero compute, the actual proof). Write the simulator and the
    compression/collision argument. The skeleton is the standard one for a
    simply transitive action of a group of order h on h labels: until the
    adversary produces a collision between two differently-derived labels, its
    view is a random injection and the connecting element is uniform; a q-query
    adversary produces a collision with probability O(q^2/h); hence
    q = Omega(sqrt(h)). The record's contribution is not that skeleton -- it is
    classical -- but the SIMULATION LEMMA of (D), which is what lets the
    point-group transparency be added to the model without weakening the bound.
    Cost: derivation only, no compute.

    STEP 3 (toy compute -- and it is already specified elsewhere). Validate the
    simulation lemma empirically via IDEA-20260811-3d05e3's holonomy
    measurement. If holonomy is not full, this record is falsified and does not
    need to be proved.

    STEP 4 (toy compute). Instrument the constraint system: implement the
    simulator on a toy class, run an adversary that walks and queries, and
    verify the manufactured point groups are consistent with every observation
    the adversary can make using only N-part data. Then EXTEND the adversary to
    query ell-torsion structure for one small ell != N and record the first
    query at which the simulator provably fails. That measured crossover is the
    boundary of (F) turned into a number.

    STEP 5 (zero compute). Record the residual classes: (i) R5 ell-torsion, the
    named boundary; (ii) the j-invariants themselves, which the label model
    hides and which are real public data -- a genuine and honestly stated
    weakness of the model, since a real adversary sees j and could in principle
    exploit height, Hilbert-class-polynomial or modular-polynomial structure;
    (iii) quantum adversaries, entirely outside scope.

  why_not_a_renamed_known_approach: >-
    The generic-group-action lower bound skeleton is known in the isogeny
    literature and is NOT claimed as new; the record cites it as recalled and
    marks the attribution as unverified. What is new to this corpus is the
    ADDITION to the model: proving that complete transparency of every rational
    point group -- a free ECDLP oracle for every curve in the class, plus
    coordinates -- can be added to the generic group action model without
    weakening the bound, via the holonomy/coboundary lemma. That is a
    Direction-1 statement, and the corpus's only Direction-1 argument
    (IDEA-20260807-0fafe8) is an algebraic remark about Hom vanishing, not a
    query lower bound and not a simulation. The record is therefore a strictly
    stronger statement of the same intuition, plus a boundary (R5, not R1) that
    contradicts the residual class every other closure in this lane names.

  proof_search_map:
    bottleneck: >-
      The simulation lemma of (D): can the simulator manufacture point-group
      data consistently for arbitrarily many queries? Everything else is the
      classical collision argument. If the lemma fails, the point data is not
      gauge, the bound may be false, and Direction 1 is live.
    baseline_embedding:
      parameter_slice: >-
        Remove the point-group transparency entirely. The model degenerates to
        the plain generic group action model and the theorem degenerates to the
        known Omega(sqrt(h)) bound for vectorization -- the exact old boundary
        this record is enlarging. Second slice: set h = 1 and the bound is
        vacuous, as it must be.
      reproduction_check: >-
        Symbolic for both slices, plus a frozen fixture: a simulated
        vectorization adversary on a synthetic torsor of order h with NO point
        data, whose measured success rate must track O(q^2/h) across a ladder of
        h. If the plain model's bound does not reproduce numerically, the
        enlarged model's claim is not interpretable.
    observation_collision:
      observable: >-
        The adversary's transcript: the sequence of labels seen, together with
        the point-group coordinates attached to them.
      distinct_preimage_search: >-
        REQUIRED. Search for two DISTINCT real worlds -- two different hidden
        bijections between labels and curves -- producing the same transcript,
        one in which the target connecting class is c_1 and one in which it is
        c_2 != c_1. The simulation lemma asserts such pairs are abundant, which
        is precisely why the transcript cannot identify the connecting class.
        FINDING NO SUCH PAIR would refute the lemma and the record. This is the
        cheapest falsification available and it is combinatorial, not
        analytical.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The reduction from "adversary in TGGA" to "adversary in the plain
          generic group action model", with obligations stated separately:
          encoding (manufactured point groups), completeness (every query
          answerable), soundness (answers consistent with SOME real world),
          transfer (success probability preserved), cost loss (none -- the
          simulation is free, which is the strong form).
        predicted_gain: >-
          None as an attack. The gain is a barrier of a named shape S.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the transcript map: hold the transcript fixed and vary
          the hidden bijection. The intrinsic invariant that would distinguish
          fibre points is exactly the ell-torsion data of (F), which is the
          record's own boundary -- so the transform's deliverable is the
          catalogue of exhausted degrees of freedom, as KN-TECH-080 card F
          requires.
        predicted_gain: >-
          Identifies R5 as the only unexhausted degree of freedom in the model.
    quantifier_order: >-
      ASSERTED: FORALL h, FORALL q-query adversaries A in TGGA, THERE EXISTS a
      simulator S (depending on h and Cl(O), NOT on the instance), such that
      FORALL instances with the connecting class uniform,
      Pr[A succeeds] <= O(q^2/h). Conclusion: q = Omega(sqrt h).
      NOT ASSERTED: any statement about real-world vectorization (the model
      hides j-invariants); any statement about ECDLP; any statement about
      adversaries who see ell-torsion for ell != N -- those are OUTSIDE the
      quantifier and the record says so rather than letting the reader assume
      otherwise.
      A SUBTLETY THAT IS THE USUAL DEATH OF SUCH CLAIMS, HANDLED EXPLICITLY:
      the simulator is permitted to choose the point-group generators AFTER
      seeing the query (lazy sampling). If it were required to fix them in
      advance, the lemma would need the stronger statement that the multiplier
      assignment is realisable for ALL gauges simultaneously. The record uses
      lazy sampling and states that it does.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No reduction of shape S -- reaching the class-group coordinate through
        the N-primary point data of the curves in the class -- exists relative
        to the TGGA oracle, and any such reduction needs Omega(sqrt h) action
        queries." It can NEVER certify a real-world lower bound for
        vectorization, because the model hides the j-invariants; nor anything
        about ell-torsion-aware adversaries; nor anything quantum.
      nearby_object_control: >-
        THE ell-TORSION-AWARE ADVERSARY (ell != N small). There the hoped-for
        conclusion FAILS: torsion coordinates identify the isogeny taken, so the
        simulator provably cannot manufacture them, and vectorization in that
        enlarged model is NOT lower-bounded by this argument. A version of this
        proof that also "closed" the ell-torsion model would be identifying the
        wrong structure, and checking that it does not is the control. Second
        nearby object: an adversary that sees j-invariants but no torsion --
        currently OPEN, and named as such rather than assumed either way.
    proof_obligations:
      - claim: >-
          A simply transitive action of a group of order h on h labels admits
          the standard collision bound O(q^2/h) for hidden-shift recovery.
        responsibility: baseline
        status: >-
          '[recall-uncertain on attribution; the argument itself is classical
          and is reproduced in STEP 2 rather than cited. WEB SEARCH WAS
          UNAVAILABLE THIS SESSION so the standard reference for the generic
          group action lower bound could not be verified and is deliberately
          not named.]'
      - claim: >-
          The multiplier cocycle on the class is a coboundary / has full
          holonomy, so N-part point data is simulable.
        responsibility: correctness
        status: >-
          measured, not assumed -- IDEA-20260811-3d05e3 STAGE 3.
      - claim: Lazy sampling of gauges suffices; no advance commitment is needed.
        responsibility: interface
      - claim: >-
          The simulation adds no cost, so the bound transfers with no loss.
        responsibility: interface
      - claim: >-
          ell-torsion data for ell != N is NOT simulable, so the boundary is
          real and the theorem is not vacuously general.
        responsibility: strictness

  predictions:
    - metric: >-
        measured success rate of a simulated vectorization adversary on a
        synthetic torsor of order h, as a function of q, with NO point data
      direction: different
      minimum_effect: >-
        tracks c*q^2/h with c between 0.1 and 10 across a ladder of h from 100
        to 10^5. A success rate materially above that curve means the collision
        argument is mis-implemented and the baseline does not reproduce.
    - metric: >-
        measured success rate of the SAME adversary when given full transparent
        point-group data
      direction: different
      minimum_effect: >-
        statistically indistinguishable from the previous curve, i.e. ratio in
        [0.7, 1.4] at every q. A materially HIGHER success rate with point data
        falsifies the simulation lemma and means Direction 1 is live -- the
        outcome that would matter most.
    - metric: >-
        first query index at which the simulator's constraint system becomes
        unsatisfiable when the adversary is additionally given E[ell] structure
        for one small ell != N
      direction: lower
      minimum_effect: >-
        finite and small (predicted: within the first few queries that traverse
        an ell-edge). If the system NEVER becomes unsatisfiable, the claimed
        boundary at R5 is wrong, the barrier is broader than stated, and the
        forward guidance must be rewritten.
    - metric: >-
        number of distinct hidden bijections consistent with a fixed transcript,
        on small synthetic torsors
      direction: higher
      minimum_effect: >-
        at least h - O(q^2) for N-part-only transcripts. A count near 1 refutes
        the simulation lemma directly and combinatorially.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, the cheapest discriminator): the distinct-preimage
      search of the proof_search_map, done on paper for h = 4 and h = 8. If two
      real worlds with different connecting classes and identical N-part
      transcripts cannot be exhibited by hand at h = 4, the simulation lemma is
      false and the record dies for a few minutes of work.
      STAGE 1 (minutes): implement synthetic torsors of order h from 100 to
      10^5; run a vectorization adversary; fit the success curve against q^2/h.
      This is the baseline reproduction and it is mandatory.
      STAGE 2 (minutes): rerun with transparent point data manufactured by the
      simulator; compare curves.
      STAGE 3 (minutes): rerun on REAL toy isogeny classes with real point
      groups, and compare against the synthetic result. A real-versus-synthetic
      gap is either exploitable structure or an implementation artifact, and the
      null in the controls separates them.
      STAGE 4 (minutes): the ell-torsion crossover measurement of STEP 4.
      Total: order one CPU-hour, reusing the class enumeration any L1/L2
      pipeline already builds.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): the synthetic random torsor with
        manufactured point data. The real toy classes must be
        indistinguishable from it in vectorization cost; a real class that is
        materially EASIER than the synthetic null has structure the model does
        not capture and that finding outranks the barrier.
      - >-
        PLANTED SIGNAL (two-directional control, mandatory): a synthetic torsor
        in which the point data is deliberately correlated with the label -- for
        instance, the generator's coordinate encodes the low bits of the class
        index. The adversary MUST solve that instance far below sqrt(h). An
        adversary that does not is blind, and every "no advantage" verdict it
        produced is void rather than negative.
      - >-
        GAUGE RESHUFFLE: rerun with different manufactured gauges; every
        reported statistic must be unchanged.
      - >-
        NEARBY-OBJECT CONTROL: the ell-torsion-aware adversary, which must beat
        sqrt(h) or at least break the simulator's constraint system. If it does
        not, the claimed R5 boundary is not established.
    required_metrics:
      - success rate versus q, synthetic torsor with no point data
      - success rate versus q, synthetic torsor with manufactured point data
      - success rate versus q, real toy classes
      - success rate versus q, planted-correlation torsor
      - first unsatisfiable query index under ell-torsion constraints
      - consistent-bijection counts per transcript at small h

  controls:
    - >-
      NULL OBJECT: the synthetic random torsor, as above. This is the matched
      null the deliverable requires.
    - >-
      DECAY PARAMETER: h. Every advantage claimed for point data must decay to
      zero as h grows; an advantage constant in h is the canonical artifact tell
      of docs/inventor-protocol.md section 3 and indicates the measurement is
      reading small-h effects.
    - >-
      SECOND DECAY PARAMETER: the number of ell-torsion bits revealed. Advantage
      must grow monotonically with it; a non-monotone response means the
      ell-torsion arm is mis-implemented.

  confounders:
    - >-
      THE MODEL HIDES j-INVARIANTS AND THE REAL WORLD DOES NOT. This is the
      record's largest honest weakness and it is stated in the claim, not
      buried: a real adversary sees the j-invariants of every curve in the
      class, and any structure in them (height, Hilbert class polynomial roots,
      modular polynomial relations) is outside the barrier. The barrier is
      therefore about POINT data being free, not about vectorization being hard.
    - >-
      SMALL h. Below h = 100 the collision curve is dominated by constants and
      no curve fit is meaningful.
    - >-
      REAL CLASSES ARE NOT UNIFORM TORSORS. The small-prime generator set gives
      a specific Cayley graph, not a uniformly random action; walk mixing is
      GRH-conditional. The synthetic null uses the same generator count so the
      comparison is matched rather than idealised.
    - >-
      LAZY SAMPLING SUBTLETY. A simulator that commits to gauges too early can
      fail for reasons unrelated to the mathematics; the implementation must
      follow the lazy convention stated in the quantifier audit or it will
      produce a spurious negative.

  falsification_conditions:
    - >-
      Two real worlds with different connecting classes and identical N-part
      transcripts cannot be exhibited at small h. The simulation lemma is false;
      the record dies at STAGE 0.
    - >-
      IDEA-20260811-3d05e3's holonomy measurement reports non-full holonomy.
      The simulation lemma is false as measured, the manufactured point data is
      constrained, and Direction 1 is live. This is the strongest possible
      positive outcome in this lane and it costs one CPU-hour to look for.
    - >-
      The transparent-point adversary succeeds materially more often than the
      no-point adversary at matched q on synthetic torsors. Same consequence,
      established empirically.
    - >-
      The planted-correlation control is not solved below sqrt(h). Instrument
      blind; the run set is INVALID rather than negative.
    - >-
      The ell-torsion arm shows no crossover. The claimed R5 boundary is wrong;
      the barrier's scope statement must be rewritten and the forward guidance
      redirected.

  interpretation_limits:
    - >-
      NOT a real-world lower bound for vectorization. The model hides the
      j-invariants, which are public. It bounds only adversaries that treat
      curves as labels.
    - >-
      NOT a statement about ECDLP. The target of the audit is vectorization; the
      ECDLP oracle is the RESOURCE being shown worthless, and showing a resource
      worthless says nothing about the resource's own problem.
    - >-
      NOT a quantum statement. Subexponential quantum vectorization exists in
      the Kuperberg/Regev line and is outside the model entirely.
    - >-
      Toy scale for every measured quantity; the barrier itself is a model
      theorem whose empirical parts validate the simulation lemma only at toy
      h.
    - >-
      A confirmed barrier BOUNDS what Direction 1 may be promoted to inside the
      model. It does not close lane L10 and it does not unpause any lane.

  assumptions:
    - >-
      Ordinary E/F_p, End_{F_p}(E) = O, the crater of the class is a simply
      transitive Cl(O)-set, N prime with N || #E(F_p), and all edge degrees
      coprime to N.
    - >-
      '[recall-confident] The crater of an ordinary isogeny class is a Cayley
      graph of Cl(O) under the small split primes, and is a rapid mixer under
      GRH (as cited by T5 of DECOMPOSITION.md). NOT re-verified this session.'
    - >-
      '[recall-uncertain] A generic group action lower bound of Omega(sqrt(h))
      for vectorization exists in the literature. THE RECORD DOES NOT RELY ON
      THE CITATION: STEP 2 reproduces the collision argument in-house, and no
      author is named because WEB SEARCH WAS UNAVAILABLE THIS SESSION and
      naming one from memory would be a fabrication risk under AGENTS.md rule 5.'
    - >-
      The simulation lemma, which is stated as a proof obligation and measured
      by IDEA-20260811-3d05e3 rather than assumed.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        The load-bearing steps are NOT heuristic. The collision bound is
        combinatorial; the simulation lemma rests on the exact surjectivity of
        O -> O/n = Z/N. No distributional assumption enters the theorem.
      rigorous_support: >-
        Surjectivity of a ring quotient map (exact) plus the birthday bound for
        a random injection (exact). Recorded so no reader imports conditionality
        the record does not use.
      validation_plan: >-
        The STAGE 0 hand construction at h = 4 and the STAGE 1 curve fit ARE
        the validation; both are exact rather than sampled.
      tail_checks: >-
        Not applicable (no distribution in the theorem). The analogue is the
        planted-correlation control, which must exhibit the opposite behaviour.
    - id: HA-2
      statement: >-
        FOR THE EMPIRICAL ARM ONLY: random walks on the crater using the small
        split primes with exponents in a box of side B mix to within total
        variation 1/h in O(log h) steps, uniformly for h >= 100, so that the
        real toy classes are a fair comparison against the synthetic uniform
        torsor.
      rigorous_support: >-
        Imitates the GRH-conditional rapid mixing of the class-group Cayley
        graph already cited by T5, combined with the classical expander mixing
        lemma. Genuinely heuristic here because the generator set is fixed and
        small, not uniformly random.
      validation_plan: >-
        Measure the empirical endpoint distribution of walks of length
        1, 2, ..., 4 log h on toy classes with h in [100, 5000], compare
        against uniform by total-variation distance, and record the walk length
        at which the distance falls below 1/h. Record the small-prime set, the
        box side B and the sample sizes. TRANSFER TO CRYPTO SCALE IS NOT
        CLAIMED.
      tail_checks: >-
        Check the least-visited and most-visited labels against the extreme
        quantiles predicted for uniform sampling at the given sample size; a
        persistently unvisited label indicates a disconnected generator set and
        voids the comparison.

  reachability_gate: >-
    T5 STATUS. This record is ABOUT the hard side of T5: vectorization is
    exactly the specified-curve reachability problem, and the barrier says that
    problem stays at sqrt(h) even when the point groups are given away. So the
    record does not need to pass T5; it is a lower-bound statement about T5's
    own quantity, and that is the correct relationship for a Direction-1
    barrier.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. The record asserts a LOWER
      bound in a model: q = Omega(sqrt h) = Omega(p^{1/4}) action queries for
      vectorization, even with free ECDLP everywhere. Lower bounds do not move
      attack exponents; they bound what a family of reductions could ever
      achieve.
    memory_exponent: >-
      Not applicable to the bound. The instrumentation stores O(h) labels and
      O(h) manufactured point groups, i.e. p^{1/2+o(1)} at toy scale by choice.
    best_known: >-
      For vectorization on ordinary classes: about h^{1/2} = p^{1/4} time and
      memory classically [recall-confident; see IDEA-20260811-40c0b5 assumption
      A3], subexponential quantumly (Kuperberg/Regev line, outside scope). For
      ECDLP: parallel rho at 0.886*sqrt(N), O(1) memory (KN-TECH-001,
      KN-TECH-006). Neither is changed.
    hidden_overhead: >-
      The Omega(sqrt h) is a QUERY bound, not a time bound: an adversary paying
      more per query is not covered, and neither is one exploiting the
      j-invariants the model hides. Both gaps are disclosed rather than
      absorbed into an o(1).
    tradeoff_note: >-
      The matching upper bound (meet-in-the-middle at h^{1/2}) needs h^{1/2}
      memory and sits on the van Oorschot-Wiener curve at sqrt(h^3/w) for memory
      w. So the barrier is tight in queries but the memory-poor regime is
      strictly worse than the bound suggests, and any concrete reading must say
      which regime it means.

  sota_delta: >-
    Zero. No attack, no speedup, no exponent moved: 0.886*sqrt(N) for ECDLP and
    about p^{1/4} for vectorization, before and after. The delta is a
    Direction-1 barrier of a named shape S where the campaign previously had
    only an algebraic remark, plus a boundary (R5, ell-torsion) that
    contradicts the residual class every other L10 closure names (R1).
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every frontier row this
    campaign recognises: parallel rho with distinguished points (0.886*sqrt(N),
    O(1) memory, KN-TECH-001/006); automorphism-discounted rho (KN-TECH-018);
    BSGS (sqrt(N) time and memory, KN-TECH-031); kangaroo (about 2*sqrt(W)); van
    Oorschot-Wiener (sqrt(N^3/w), memory w); and, on the vectorization axis,
    meet-in-the-middle isogeny search at about h^{1/2} time and memory. This
    record mounts no attack and is dominated by all of them on time; as a
    barrier it is dominated by nothing in this repository because no Direction-1
    query lower bound exists here. dominated_by is NOT null.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.90 that the simulation lemma holds (it follows from an exact surjectivity
    statement, and IDEA-20260811-3d05e3 tests it cheaply). 0.75 that the full
    theorem as stated survives an adversarial review of the lazy-sampling
    subtlety and the collision argument's details. 0.65 that the ell-torsion
    crossover is as sharp as (F) claims. 0.10 that the barrier can be extended
    to an adversary that also sees j-invariants, which is the version that
    would matter for the real world and which the record explicitly does not
    claim.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base appears; H-STR-002 and DEFER-BATCH009-001
