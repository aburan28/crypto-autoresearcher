  discriminated_from: >-
    IDEA-20260807-1b7241 (CAGG simulator) is the mirror image: it puts the
    CURVE world in the clear and the POINT group behind a generic encoding, and
    concludes the curve data is worthless for ECDLP. This record swaps the two:
    the POINT world in the clear, the curve world behind labels, concluding the
    point data is worthless for vectorization. Same technique, opposite
    direction, different lemma (1b7241 needs only that the curve view is
    k-independent; this needs the holonomy/coboundary lemma, which is strictly
    harder and is measured rather than asserted). Neither implies the other.
    IDEA-20260807-0fafe8 (Hom = 0 plus the torsor remark) is the corpus's only
    prior Direction-1 argument. It is an algebraic non-existence remark about
    homomorphisms; this is a query lower bound with a simulator, and it covers
    adversaries that use no homomorphism at all.
    IDEA-20260807-413fcc (curve-measurable oracles carry zero bits about k) is
    about oracles taking no group handle, aimed at ECDLP. This record's audited
    oracle takes group handles and its target is vectorization; 413fcc's
    information identity does not apply.
    IDEA-20260811-40c0b5 (self-elimination at p^{1/4}) is the Direction-2
    counterpart and is explicitly VACUOUS here, which is why this record exists;
    the two together give the asymmetry.
    IDEA-20260811-3d05e3 (scalar cocycle) supplies this record's load-bearing
    lemma as a measurement. They are a proof/instrument pair, not duplicates.
