# IDEA-20261006-b6b4ce — proposal only. No hypothesis and no run.
idea:
  id: IDEA-20261006-b6b4ce
  question_id: RQ-MTGT-2cabee
  added: '2026-10-06'
  status: proposed
  approved_by: null
  title: >-
    Baby-step x-coordinates fail to transfer across one rational
    2-isogeny while the scalars match
  class: measurement
  claim: >-
    On the first ordinary prime-field curve E with a rational
    2-torsion point, prime p in [211, 500), j not in {0, 1728}, and a
    prime-order subgroup of order n > 30, a table of 12 baby steps
    keeps all 12 scalars after the Vélu image and the two sets of
    abscissae intersect in at most 2 values.
  mechanism: >-
    The tracked object is the pair (scalar matches, abscissa
    intersection) for k = 1..12. The representation on each curve is
    the affine x-coordinate. The operation that moves the table is one
    rational 2-isogeny, not translation. phi(kG) = k phi(G), so the
    scalar relative to the image base is the same k. The x-coordinate
    is not invariant under that map, because Vélu sends x to a
    different rational function. A stored table of x-keys on E is
    therefore not a lookup table for the image curve, even though the
    scalars survive. The projection from a point to its abscissa is
    lossy, and the further projection to the intersection size
    discards the y-coordinates. KR-RHO-755e35 records that isogenous
    curves share group order and group-structure weakness. This
    proposal does not claim a different group order. It asks whether
    the x-sets still intersect in 6 or more places. KR-RHO-ea34b8
    records cube-root online work after a large precomputed table.
    This proposal does not build that table and does not claim an
    online exponent of 1/3.
  assumptions:
    - The search takes the smallest prime p with 211 <= p < 500 that has an ordinary reduced model with a rational point of order 2, j not in {0, 1728}, and a subgroup of prime order n > 30. The base G is n times the point of smallest liftable abscissa and smaller nonnegative y, and G is not the identity.
    - phi is the Vélu isogeny with kernel the order-2 point of smallest abscissa. t = 3 r^2 + A, w = r t, A' = A - 5 t, B' = B - 7 w. G' = phi(G) is not the identity.
    - The baby indices are exactly k = 1..12, frozen before any intersection is counted.
    - Point counts of E and the codomain are equal. A mismatch means the isogeny is wrong and the intersection is not scored.
  predictions:
    - metric: abscissa_intersection
      direction: lower
      minimum_effect: >-
        The set of x(kG) for k = 1..12 and the set of x(k G') for
        k = 1..12 intersect in at most 2 values, while
        x(phi(kG)) = x(k G') for all 12 indices.
  minimal_test:
    design: >-
      Find the curve. Build both 12-step tables and the image of the
      E table under phi. Score scalar matches and the intersection
      size. As a relabeling null, swap the handles of k=1 and k=2 on
      the image curve and record that the scalar-match count drops.
      As a cost control, run BSGS for the planted scalar 2 on E and
      record the operation count. Do not enter that count in the
      intersection.
    controls:
      - x(phi(kG)) equals x(k G') for every k in 1..12. A miss means phi was not applied to the subgroup and the intersection is not scored.
      - #E equals the codomain point count. A mismatch voids the intersection.
      - After swapping k=1 and k=2 on the image, the scalar-match count is strictly less than 12. If it stays 12, the matcher is ignoring k and the intersection is not scored.
      - BSGS recovers the scalar 2 on E. A wrong answer voids the cell.
    required_metrics:
      - the intersection size
      - the scalar-match count
      - the point counts of E and the codomain
      - the match count after the swap
      - the BSGS answer for scalar 2
  falsification_conditions:
    - The scalar-match count is 12 and the intersection size is at least 6.
    - The scalar-match count is below 12, in which case the map is wrong and the intersection is not evidence.
    - The swap leaves the match count at 12, in which case the matcher is wrong and the intersection is not evidence.
  confounders:
    - Twelve abscissae in a field of a few hundred elements can intersect by chance. An intersection of 6 or more is still the named negative.
    - A model change after seeing the sets can reorder abscissae. The reduced model is fixed first.
  interpretation_limits:
    - Scalar retention across one 2-isogeny is the expected transport of the discrete log. It is not a new attack.
    - An intersection of size at most 2 does not say that a precomputed rho table is useless after an isogeny. It says these 12 x-keys do not match.
    - No cube-root online cost is claimed. The exponent 1/2 does not move.
    - The result would close only this one isogeny and these 12 indices.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The image of a uniform 12-element set of abscissae under a
        degree-2 Vélu rational function intersects the original set
        in at most 2 elements, on this one curve, while the scalars
        are preserved exactly.
      rigorous_support: >-
        phi(kG) = k phi(G) is the isogeny homomorphism, and
        KR-RHO-755e35 records that the group order is shared. The
        intersection bound of 2 is not a theorem used as support
        here. It is the pre-registered comparison.
      validation_plan: >-
        Score the 12 scalar matches and the intersection size on the
        frozen curve. The swap control must drop the match count
        before the intersection is believed.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. Twelve baby steps are not a precomputation
      of size l^{2/3}, and KR-RHO-ea34b8 already prices that
      tradeoff. This proposal does not beat rho.
    memory_exponent: >-
      Unchanged. The table stores 12 points. It does not shrink a
      square-root table.
    best_known: >-
      Generic rho at exponent 1/2 (KR-RHO-13bf67), isogeny invariance
      of the group order (KR-RHO-755e35), and the preprocessing
      tradeoff on KR-RHO-ea34b8. This intersection does not beat
      those rows.
    hidden_overhead: >-
      None claimed. The table length 12 and the intersection bound 2
      are explicit. No o(1) improvement is claimed.
    tradeoff_note: >-
      This is not a point on the Bernstein-Lange preprocessing curve
      and not a van Oorschot-Wiener point. Rho and BSGS appear only
      as a one-scalar control.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  novelty_status: unverified
