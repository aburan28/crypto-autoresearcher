  dominated_by: >-
    Pollard rho at exponent 1/2 dominates this table as an attack.
    KR-RHO-ea34b8 dominates any reading that would treat 12 baby
    steps as a preprocessing tradeoff. The intersection size does not
    beat either.
  sota_delta: >-
    The separator is an intersection bound of 2 on two 12-element
    abscissa sets, with 12 scalar matches, against the isogeny
    invariance already stated on KR-RHO-755e35. The distance to a
    sub-square-root algorithm is the full exponent 1/2, and this
    proposal moves that exponent by 0.
