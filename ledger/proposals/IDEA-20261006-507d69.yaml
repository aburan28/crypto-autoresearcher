idea:
  id: IDEA-20261006-507d69
  title: >-
    Collision count of successive x-difference multisets on cosets of one
    rational order-3 point
  class: control
  claim: >-
    Let E be y^2 = x^3 + 2x + 3. Let p be the smallest prime ≥ 13 and ≤ 200
    such that E over F_p is nonsingular and has an F_p-rational point T of
    order exactly 3. The multiset of successive x-differences along a
    nontrivial coset of <T> collides: at least one unordered pair of distinct
    cosets shares the same multiset. The statistic is point-dependent, read
    off by the chord-and-tangent law from public P and public T, with no
    discrete logarithm. It is an R1 representation at the collision-structure
    stage and does not change exponent 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R1: for affine P not in <T>, the multiset
    M(P)={x(P+T)-x(P), x(P+2T)-x(P+T), x(P)-x(P+2T)} in F_p. Operation set
    Sigma is translation by the single frozen point T, so <Sigma> has order
    3 and is not the full translation action. Trichotomy: partial-action.
    M(P+T) is the same multiset as M(P), so M factors through the block
    system of <T>-cosets. LOSSY-PROJECTION TEST against Sigma. Passing to the
    coset discards which of the three points is the representative; that
    discard is the block system of <Sigma>. Passing further from the coset
    to M discards every y-coordinate and the absolute x-coordinates, keeping
    only three differences determined up to cyclic order. That second
    discard is lossy on cosets precisely when two cosets share M. If the
    collision count is zero, M is still lossy on points (three-to-one onto
    cosets) but injective on blocks, and the open number — the cost of
    canonicalising a <Sigma>-orbit — is one orbit of length 3 plus a
    comparison, not a lookup collision. Off-limits families F1–F7 are not
    the lens. A full table of cosets would be F7 and is not built. No factor
    base is proposed. This is not a division-polynomial character and not a
    kernel-size census.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: idea-generator
  approved_by: null
  question_id: RQ-TORS-8c7b79
  citations:
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Small-order torsion is already used to shrink symmetrised point
        decomposition. This idea does not form a summation system.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        on 2026-10-06
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Semaev summation polynomials vanish on x-coordinates that sum to the
        identity. M is a difference multiset on a torsion coset, not a
        summation polynomial.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains Ω(√N). An injective label of an index-3
        quotient would change the constant by at most √3, which this idea
        does not claim as an attack.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        Bounded-degree algebraic factor bases over a generic prime-field
        subgroup are scoped out; the universal statement is open. This idea
        declares no factor base.
      verified_by: >-
        idea-generator opened knowledge/open-problems/KN-OPEN-020.md
        on 2026-10-06
    - ref: division polynomial ψ_3 degree 4
      provenance: recalled
      claim: >-
        Pointer only, for how a reviewer might recognise an order-3 point.
        The test checks 3T=O and T≠O by the group law, not by an unread
        formula.
      verified_by: null
  assumptions:
    - >-
      T is obtained by search over x in F_p and a square test for the curve
      equation, then verified by doubling and adding in affine arithmetic
      until 3T is the point at infinity and T is not.
    - >-
      The identity coset <T> is excluded because x is undefined at O. Every
      remaining coset consists of three affine points.
    - >-
      F7 preprocessing is not used. Collision counting compares multisets of
      the enumerated group and does not store an advice string for a secret
      scalar.
  proof_search_map:
    bottleneck: >-
      Whether M separates <T>-cosets. A collision means orbit
      canonicalisation is not free from these differences. Injectivity means
      it is free on this toy curve and still only an index-3 label.
    baseline_embedding:
      parameter_slice: >-
        The generic exponent 1/2 of KR-RHO-13bf67, and the torsion-symmetry
        PDP constant of KR-IC-955fd6, which this control does not reproduce
        as an algorithm.
      reproduction_check: >-
        For one representative of each tested coset, check P, P+T, and P+2T
        are affine, 3T=O, and the three differences sum to 0 in F_p.
    observation_collision:
      observable: the multiset M(P)
      distinct_preimage_search: >-
        Search for two cosets with equal M. That pair is an observation
        collision. Absence of a pair is the falsifier of this claim, and it
        is a real outcome.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The successive x-difference multiset as a label of the partial
          action of translation by T.
        predicted_gain: >-
          A collision count. Zero is separation; at least one is failure of
          separation. Neither moves an exponent.
    quantifier_order: >-
      Exists a smallest prime p with 13≤p≤200 such that E(F_p) has a
      rational point T of order 3, and for that p there exist two distinct
      <T>-cosets with the same M.
    method_ceiling:
      strongest_certifiable_claim: >-
        On one curve over one prime p≤200, M either collides or separates
        <T>-cosets. No statement about k, and no statement past that p.
      nearby_object_control: >-
        Shuffle the affine x-coordinates among the same points, recompute
        difference multisets along the same cosets, and record that null
        collision count. The group-law M is not interpreted as special if
        its collision count lies in the central 90 percent of 500 shuffles.
    proof_obligations:
      - claim: 3T=O is checked by the group law before M is formed.
        responsibility: correctness
      - claim: >-
          A separating M on an index-3 quotient is at most a √3 constant
          and is not scored as an attack.
        responsibility: scope
    not_applicable_reason: >-
      This is a control on a coset label, not a theorem, bound, certificate,
      reduction, or closure.
  predictions:
    - metric: >-
        number of unordered pairs of distinct nontrivial <T>-cosets with equal M
      direction: higher
      minimum_effect: at least 1
    - metric: >-
        fraction of nontrivial cosets whose M is unique
      direction: lower
      minimum_effect: >-
        strictly below 1 if the pair count is at least 1
  minimal_test:
    design: >-
      Increase p through primes from 13 to 200. Skip singular fibres. Search
      for T of order exactly 3 by the group law. On the first success,
      partition the affine non-identity points into <T>-cosets, compute M,
      and count colliding pairs. Stop at that p. If no p≤200 works, record
      a failed premise and do not substitute another equation.
    controls:
      - >-
        Group-law control: 3T=O, T≠O, and each tested triple sums to O in
        the group.
      - >-
        Algebraic control: the three differences in M sum to 0 in F_p.
      - >-
        Shuffled-x null: 500 shuffles of affine x-coordinates, same coset
        partition, collision counts recorded.
      - >-
        Nearby curve with the same p and no rational order-3 point, if one
        is found while searching: M is undefined and must not be scored.
    required_metrics:
      - p
      - x(T) and a bit that y(T) is a square
      - number of nontrivial cosets
      - colliding-pair count
      - median and 90th percentile of the 500 shuffle collision counts
  falsification_conditions:
    - The colliding-pair count on the real curve is 0.
    - No prime p with 13≤p≤200 supplies a rational point of order exactly 3.
    - >-
      A reported collision has three differences that do not sum to 0, so
      the multiset was miscomputed.
    - >-
      The only collisions appear in the identity coset, which is excluded.
  confounders:
    - >-
      Birthday collisions in a set of size about p/3 into a space of
      multisets of size about p^2 are rare at the small end of the range
      and common at the large end. The shuffle null is required before a
      positive count is read as group-law structure.
    - >-
      Choosing the smallest p conditions on the first success and can pick
      an unusually small group. The scope is that one p.
    - >-
      If several rational order-3 points exist, <T> depends on the T found
      first. The test must freeze the first T in lexicographic x, then
      least nonnegative y, and not switch.
  interpretation_limits:
    - >-
      The statistic does not determine a secret scalar. Reading a coset of
      an index-3 subgroup, even if M separates cosets, leaves a discrete
      log in a group of size N/3.
    - >-
      Evidence is claim_tier toy and stops at the first p≤200 on this
      equation.
    - >-
      Not a factor base, not a summation polynomial, and not an entry in
      the KN-OPEN-020 open classes.
    - >-
      A curve-only count of rational 3-torsion points is not the claim.
      The claim is point-dependent and is k-independent only in the weak
      sense that it never consults a hidden scalar.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a fixed partition into n cosets, a uniformly shuffled assignment
        of affine x-coordinates produces collision counts of derived
        multisets whose mean is the birthday quantity n(n-1)/(2R), where R
        is the number of distinct multisets attained in that shuffle. This
        imitates a uniform draw into a set of size R and is not a model of
        large-p torsion.
      rigorous_support: >-
        Birthday counting on a finite set. No Weil estimate is used. The
        opened row KR-IC-5a43e5 is a vanishing criterion for summation
        polynomials and is not a distribution for M.
      validation_plan: >-
        Draw 500 x-shuffles on the frozen coset partition at the selected p.
        Compare the sample mean of collision counts with n(n-1)/(2R_hat),
        where R_hat is the mean number of distinct shuffled multisets.
        Tail check: the real curve's collision count is flagged as outside
        the shuffle law only if it falls outside the central 90 percent of
        those 500 counts. Otherwise the score is the raw pair count alone,
        with no structural reading.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: >-
      unchanged O(1) for rho; the measurement stores O(p) coset labels with p≤200
    best_known: >-
      Pollard rho Θ(√N), KR-RHO-13bf67; torsion symmetries in decomposition
      are the separate constant in KR-IC-955fd6 and are not this quantity
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No tradeoff. Canonicalising one orbit costs three additions if M
      separates, which is a constant, not a memory table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    No opened row dominates this collision count. Rows opened and not
    dominating it: KR-IC-955fd6 (torsion-shrunk decomposition; different
    observable), KR-IC-5a43e5 (Semaev vanishing), KR-IC-5931ee (prime-field
    Semaev does not beat generic methods; this idea is not index calculus),
    KR-RHO-755e35 (isogeny class preserves group structure; this idea uses
    one curve), KR-RHO-13bf67 (matching exponent baseline).
  sota_delta: >-
    Zero change to exponent 1/2. The new quantity is the number of colliding
    unordered pairs of <T>-cosets under M, on the first prime p in [13,200]
    where y^2=x^3+2x+3 has a rational point of order 3, or a failed premise
    if no such p exists.
