idea:
  id: IDEA-20261006-fb040d
  question_id: RQ-EWALK-8fa147
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    On the first ordinary j=0 prime past 30, one rational point has
    six distinct automorphism images
  class: control
  claim: >-
    Let E be y^2 = x^3 + 1. Let p be the smallest prime with
    p > 30, p congruent to 1 mod 3, and p < 200, such that E is
    ordinary and nonsingular over F_p. Let zeta be a root in F_p of
    T^2 + T + 1. Let phi(x, y) = (zeta * x, y). Let P be a point of
    E(F_p), not the point at infinity, with x(P) not equal to 0 and
    y(P) not equal to 0. The claim is that some such P has six
    distinct images under the maps phi^i and minus phi^i for
    i in {0, 1, 2}. No walk is run, and the rho exponent is not
    claimed to move. If no eligible p exists below 200, or no such
    P exists on that curve, the claim is false.
  mechanism: >-
    The tracked object is a set of six points. The representation
    is the short-Weierstrass model. The operation set is the
    automorphism group generated by phi and negation, not a rho
    step. The set has size 6 or it does not. Translating P does
    not change whether those six images coincide, because each
    image is phi applied to that same P. Lossy-projection test:
    the projection keeps the cardinality of the image set and
    discards the coordinates. Many points can share the cardinality
    6. One-line reason: an automorphism is a curve map, and the
    test asks only whether its orbit on one rational point has
    size 6. This is not a measurement of the sqrt(6) iteration
    factor.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces expected rho
        iterations by sqrt(m), and the exponent stays 1/2. This
        record does not count iterations.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-0528e7.yaml
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        The negation map gives a sqrt(2) factor and fruitless
        cycles. Negation is one generator here. No cycle escape
        is tested.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs Omega of the square root of the
        group order. Six points are not a generic algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - p is congruent to 1 mod 3, so a root zeta of T^2 + T + 1 lies in F_p.
    - phi(x, y) = (zeta * x, y) sends E to itself because zeta^3 = 1.
    - Points with x = 0 or y = 0 are excluded from the orbit count.
  predictions:
    - metric: number of distinct images of P
      direction: higher
      minimum_effect: exactly 6
  minimal_test:
    design: >-
      Search primes from 31 up to 199 with p congruent to 1 mod 3.
      Take the least p at which E is nonsingular and ordinary.
      Find zeta. Enumerate E(F_p). Skip the infinity point and every
      point with x = 0 or y = 0. For each remaining point, apply the
      six maps and count distinct images. The claim holds if any
      point has count 6. Record p, the point, and the count.
    controls:
      - >-
        phi cubed is the identity on every tested point. A point
        with phi^3(P) unequal to P voids the map.
      - >-
        The point (-1, 0) is 2-torsion on this equation. Its image
        count is not entered in the success row. If the procedure
        reports six distinct images for (-1, 0), the orbit code
        is void.
      - >-
        On the ineligible prime p = 5, which is congruent to 2 mod
        3, the search must not select zeta inside F_5. Selecting
        p = 5 voids the run.
    required_metrics:
      - p
      - one point P or the statement that none exists
      - the image count
      - whether phi^3 is the identity
  falsification_conditions:
    - >-
      The least eligible prime exists and every allowed rational
      point has fewer than six distinct images.
    - No prime below 200 is eligible.
    - phi^3 fails to fix a tested point.
  confounders:
    - >-
      Counting a point and its negative as one image before applying
      phi shrinks the set and can fake a failure.
    - >-
      Using a zeta that does not satisfy zeta^2 + zeta + 1 = 0
      makes phi miss the curve.
    - >-
      A walk-length statistic is not this claim. Reporting one
      would be a different experiment.
  interpretation_limits:
    - >-
      Six distinct images do not measure a rho speedup and do not
      change the exponent 1/2.
    - >-
      One prime below 200 is not a statement about every j = 0 curve.
    - >-
      The sqrt(6) factor in KR-RHO-0528e7 is not computed here.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The automorphism group of an ordinary j = 0 curve contains
        the order-3 map phi and negation, and these generate six
        distinct maps. On a rational point that is not fixed by any
        of them, the orbit has size 6. The curve E1 of a non-CM
        model is not the object. No mixing-time claim is made.
      rigorous_support: >-
        KR-RHO-0528e7, opened in this session, states the sqrt(6)
        iteration factor for j = 0 and does not exhibit six images
        of one point. The order of phi is checked by phi^3 = id in
        the test. No file opened here proves the orbit size at the
        prime the search returns.
      validation_plan: >-
        The quantity sampled is the image count at the single prime
        the search returns, one curve, the points of E(F_p) outside
        the excluded set. The comparison is the count against 6.
        The tail check is the maximum count observed. The parameter
        is p < 200. Transfer assumption: none. The count is not
        scaled to a cryptographic prime.
  target_complexity:
    time_exponent: >-
      unchanged at 1/2, from KR-RHO-13bf67. KR-RHO-0528e7 places a
      constant sqrt(6) on j = 0 walks. This record does not run a
      walk, so it does not realise that constant.
    memory_exponent: >-
      unchanged. The test stores the rational points of one curve
      over a prime below 200.
    best_known: >-
      KR-RHO-0528e7 for the automorphism constant and KR-RHO-fb88e6
      for the negation map. Neither row is improved.
    hidden_overhead: >-
      None. No o(1) in an exponent is claimed. An image count is
      an integer.
    tradeoff_note: >-
      No time-memory tradeoff. Six stored points do not replace a
      distinguished-point table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-fb88e6
      - KR-RHO-13bf67
    nearest:
      - ref: KR-RHO-0528e7
        provenance: internal
        relation: adjacent
        delta: >-
          That row reduces rho iterations by sqrt(6) on a j = 0
          curve and leaves the exponent at 1/2. This record's
          output is one image count at one prime below 200. The
          exponent delta is zero. It does not measure sqrt(6).
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: adjacent
        delta: >-
          That row is the negation-map factor sqrt(2) and its
          fruitless cycles. This record uses negation as one of
          two generators and counts images, not cycle escapes.
          The exponent delta is zero.
    searched:
      corpus_grep:
        - six distinct automorphism images
        - question_id: RQ-EWALK-8fa147
        - phi(x, y) = (zeta * x, y)
      web: []
      blocked: []
  dominated_by: >-
    Dominated as an algorithm by Pollard rho at exponent 1/2
    (KR-RHO-13bf67), with the j = 0 factor sqrt(6) from
    KR-RHO-0528e7. An orbit of six points does not beat either row.
  sota_delta: >-
    Zero change to the 1/2 exponent and zero change to the sqrt(6)
    constant. The predicted gap is an image count of exactly 6
    against a count below 6, on one prime below 200.
  proof_search_map:
    not_applicable_reason: >-
      This is an orbit count at one prime. It does not propose a
      theorem on automorphism groups, a walk complexity bound, or
      a closure of the sqrt(m) factor.
