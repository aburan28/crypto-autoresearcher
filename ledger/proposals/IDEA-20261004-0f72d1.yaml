  title: >-
    Multiplication by 29 has degree 841 and multiplication by 28 has degree 784
  class: measurement
  claim: >-
    Multiplication by 29 has degree 841. Multiplication by 28 has
    degree 784. Eight hundred forty-one exceeds seven hundred
    eighty-four by 57. The product of the two degrees is 659344. Their
    sum is 1625. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 784 and 729.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty-nine squared is 841. Twenty-eight squared is 784. Two
    maps of degree 784 have gap 0 and product 614656. No point is mapped.
  novelty_status: unverified
