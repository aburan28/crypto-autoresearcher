idea:
  id: IDEA-20260807-6533fd
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    THE HEIGHT-BUDGET EXPONENT IDENTITY FOR ANY LIFT-BASED ATTACK: covering
    E(F_p) by reductions of global points of canonical height <= B forces
    B = Theta(N^{2/r}), and since the coordinate bit-size of a point of height
    B is Theta(B), the REPRESENTATION COST ALONE of one usable lift is
    N^{2/r} -- so every lift attack at arity r <= 4 is dominated by rho before
    any search happens, and the meet-in-the-middle version loses to rho by
    exactly N^{1/r}
  class: algorithm

  claim: >-
    (A) THE IDENTITY. Let Ẽ be any global model (the Serre-Tate canonical lift
    or a Xedni-constructed curve) with Mordell-Weil rank r and regulator Reg,
    reducing to E/F_p with |G| = N. Standard lattice-point counting for the
    positive definite quadratic form hhat gives
        |{P~ : hhat(P~) <= B}| = V_r B^{r/2} Reg^{-1/2} (1 + o(1)).
    For the reductions to cover a constant fraction of G,
        B >= (N sqrt(Reg) / V_r)^{2/r} = Theta(N^{2/r}).
    And by the standard comparison |hhat(P) - (1/2) h_x(P)| = O(log|Delta|),
    a point of canonical height B has x-coordinate of bit-size Theta(B) +
    O(log|Delta|). THEREFORE THE BIT-SIZE OF ONE USABLE LIFTED POINT IS
    Theta(N^{2/r}). This is a size bound, not a search bound: it holds even
    for an adversary who is GIVEN the right point for free.

    (B) THE EXPONENT CONSEQUENCE, WHICH IS THE POINT OF THE RECORD.
        r = 2 : N^{1.000}   r = 3 : N^{0.667}   r = 4 : N^{0.500}
        r = 5 : N^{0.400}   r = 8 : N^{0.250}   r = 9 : N^{0.222}
    Against rho at 0.886 N^{1/2} group operations: AT ARITY r <= 4, MERELY
    WRITING DOWN ONE USABLE LIFT COSTS AT LEAST AS MUCH AS RUNNING THE ENTIRE
    ATTACK. The internal reconstruction of the JKSST analysis
    (ECFG-P1543-R1) records its scope as "fixed arity 2 <= r <= 9", so HALF
    THE CLASSICAL SCOPE LIES IN THE DEAD ZONE FOR A REASON THAT HAS NOTHING TO
    DO WITH THE COEFFICIENT BOUND -- it is pure representation size. That is a
    new decomposition of the classical failure and it identifies r = 4 as the
    exact threshold.

    (C) WHAT REMAINS ABOVE THE THRESHOLD, STATED HONESTLY. For r >= 5 the size
    obstruction disappears. What remains is the SEARCH obstruction: given a
    prescribed target Q in G, find a global point reducing to it. This record
    prices the only generic strategy available, meet-in-the-middle:
    precompute reductions of sums sum a_i G_i over a box A with |A| = M, and
    of Q - sum b_i G_i over a box of the same size; a collision gives the
    discrete log. To get a collision one needs M = Theta(sqrt(N)), and a
    lattice point in a box of M elements has height Theta(M^{2/r}) = N^{1/r},
    hence bit-size N^{1/r}. Total work:
        T_MITM = Theta(N^{1/2} * N^{1/r}) = Theta(N^{1/2 + 1/r}),
    memory Theta(N^{1/2} * N^{1/r}) bits.
    DOMINATED BY RHO BY EXACTLY N^{1/r}, ON TIME, AND BY N^{1/2+1/r} ON
    MEMORY. The loss is precisely the coordinate size, and it does not vanish
    at any rank: as r grows the loss shrinks toward N^{0} but never turns into
    a gain, because at r = infinity the method degenerates into BSGS.

    (D) WHERE CM ENTERS, AND WHERE IT DOES NOT. CM changes r into 2 r_O
    (IDEA-20260807-fd5a24), so an O-rank of 3 already gives r = 6 > 4 and
    clears the size threshold. THAT IS THE ONE PLACE IN THIS LANE WHERE THE
    O-MODULE STRUCTURE COULD HAVE MATTERED AT THE LEVEL OF AN EXPONENT, and it
    is why this record exists rather than being folded into fd5a24. But the
    Z-rank 2r_O is a rank of a lattice whose second half is longer by
    sqrt(|D_E|)/2 (fd5a24 Lemma 1+2), so the COUNTING that produces
    B ~ N^{2/r} must use the effective rank inside the ball of radius sqrt(B),
    which is r_O and not 2 r_O whenever B < (|D_E|/4) hhat_min. Substituting:
    the effective exponent is 2/r_O = 4/r_Z, i.e. TWICE AS BAD as the naive
    reading, and the threshold moves from r_Z > 4 to r_Z > 8. CM therefore
    makes this identity WORSE by a factor 2 in the exponent, and the record's
    central number is that factor.

    (E) THE TWO OUTCOMES. OUTCOME 1: the measured covering exponent matches
    2/r_eff with r_eff = r_O in the CM arm and r in the non-CM arm. The
    identity is validated, the r = 4 (non-CM) / r_Z = 8 (CM) thresholds are
    established, and the lane's cost model is settled. OUTCOME 2: the measured
    covering exponent is materially smaller than 2/r_eff -- i.e. reductions
    cover G faster than the lattice count predicts. That would mean the
    reduction map is far from injective on low-height points in a structured
    way, which is a genuine phenomenon worth chasing and would move the
    threshold. Both are deliverables and neither is vacuous.

  resource_label: >-
    R6 (lift to characteristic zero: the object whose representation is being
    costed) with R3 entering only in part (D), where the CM order determines
    the effective rank inside the search ball.
  admissibility: admissible
  admissibility_argument: >-
    The identity is about the SIZE of characteristic-zero objects and the
    counting of lattice points; it makes no oracle call and applies no
    endomorphism to a point of G. The meet-in-the-middle in part (C) does use
    group operations on G, and if it were ONLY that it would be a generic
    algorithm closed at exponent 1/2 by Shoup and KN-FIND-b7e091 -- which is
    exactly what the analysis finds, with the additional N^{1/r} penalty for
    carrying global coordinates. The record's admissibility is therefore
    honest in a specific way: the non-generic resource (the lift) is present,
    it is charged, and it is found to COST rather than to buy. Recording a
    non-generic resource that makes an algorithm worse is a legitimate and
    underused deliverable.

  discriminated_from:
    - >-
      IDEA-20260807-fd5a24: that record prices the coefficient set at fixed
      points. This one prices the points themselves and is the only L9 record
      that states an exponent identity rather than a constant.
    - >-
      IDEA-20260807-44ba75: shares the lattice-point count. That record asks
      where r comes from; this one asks what a given r costs. THEY MUST NOT BE
      COUNTED AS INDEPENDENT EVIDENCE for the same conclusion -- the shared
      ingredient is HEUR-CANL-K1 and it is cited from there.
    - >-
      KN-TECH-006 / KN-TECH-031 (rho, BSGS): the baselines this record charges
      against, not extensions of them. The MITM in part (C) is BSGS with an
      extra representation cost and is presented as such.
    - >-
      L13 / RQ-MTGT-2cabee (multi-target and preprocessing): that lane asks
      whether preprocessing transfers across an isogeny class. This record's
      MITM table is single-curve and single-target, and its cost is charged in
      full per target; the amortised question is L13's and is not answered here.
    - >-
      GOAL-ICLIFT-001 / RQ-XEDN-001: the function-field lineage measures a
      section-density exponent alpha over F_p(t). This is a covering exponent
      over a number field. Different exponent, different object.

  object_first_candidate:
    tracked_object: >-
      THE COVERING EXPONENT beta defined by |Im_B| ~ B^{beta}, followed as the
      rank, the field, and the presence of CM are varied. Equivalently: the
      exchange rate between height budget and covered residues.
    lossiness: >-
      LOSSY: it collapses the entire global curve, its field, its L-function
      and its coordinates into one real number. The discard is compatible with
      the operation the attack performs (enumerate by height, reduce) because
      that operation is exactly a height-filtered pushforward, and a
      height-filtered pushforward's growth rate depends only on the filtration
      and the lattice shape -- both retained. It is NOT a change of
      coordinates: rank-4 CM and rank-4 non-CM curves have the same nominal
      rank and, this record predicts, DIFFERENT beta (2/r_O versus 2/r), so
      beta separates objects that the rank alone identifies.
    propagation: >-
      One step = increment B. beta propagates as the local slope of
      log|Im_B| against log B, measurable directly by enumeration, with a
      predicted plateau at r_eff/2 and a knee at B ~ (|D_E|/4) hhat_min where
      the CM companion directions enter the ball. THAT KNEE IS THE OBJECT'S
      SIGNATURE and is what distinguishes it from a pure rank measurement.
    survival_score: >-
      SURVIVES: change of model, twist, choice of prime above p, and the
      identity of the target. DIES: at saturation |Im_B| = N, where beta
      becomes 0 and the object is exhausted -- which is the regime an actual
      attack would need and which is unreachable at toy scale, a limitation
      the record states rather than hides.

  mechanism: >-
    STEP 1 -- DERIVE THE IDENTITY CLEANLY (zero compute). Combine (i) the
    lattice-point asymptotic, (ii) the naive-versus-canonical height
    comparison with its O(log|Delta|) constant, and (iii) the saturation
    condition |Im_B| = Theta(N). Record each as a separate lemma with its own
    responsibility, so a failure localises.
    STEP 2 -- MEASURE beta DIRECTLY. On toy curves over Q of known exhibited
    rank (both CM with h(D_E) = 1 and non-CM), enumerate all points with
    x = u/w^2, |u| <= U, w <= W; compute hhat numerically; bin by B; reduce mod
    p; count distinct images. Fit log|Im_B| against log B and report the local
    slope, not a single global fit.
    STEP 3 -- HUNT THE CM KNEE. On the CM arm, compute the predicted knee
    location (|D_E|/4) hhat_min and check whether the measured slope steps from
    r_O/2 to r_Z/2 there. THIS IS THE ONE MEASUREMENT THAT DIRECTLY TESTS
    PART (D) and it can fail cleanly: no knee means the effective-rank
    correction is wrong and the threshold is r_Z > 4 after all, which would be
    a modest improvement in the attacker's direction and must be reported as
    such.
    STEP 4 -- IMPLEMENT AND MEASURE THE MITM, SMALL. At toy N, build the two
    tables of part (C) with M well below sqrt(N), measure actual bit-costs of
    the stored global coordinates, and confirm the N^{1/r} penalty appears as
    a measured bytes-per-entry growth. Extrapolate, do not claim.
    STEP 5 -- CHARGE EVERYTHING against 0.886 sqrt(N) and against BSGS, in the
    full-cost model (bits, not group elements), and report both exponents.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      2026-08-07 shared L9 screen (see IDEA-20260807-fd5a24) plus greps for
      "covering exponent|height budget|lattice point count|N^{2/r}" across
      ledger/, knowledge/, docs/, analysis/, and a read of KN-TECH-006,
      KN-TECH-031 and ECFG-P1543-R0/R1.
    results: >-
      No record in this repository states a covering exponent for a lift-based
      attack, states B ~ N^{2/r}, or identifies r = 4 as a threshold.
      ECFG-P1543-R1 records the density gate "min(1,|C|/N)" for a frozen
      COEFFICIENT family, which is a different quantity (coefficients, not
      points) and does not imply this identity.
    verdict: >-
      ADAPTATION. Lattice-point counting and the height comparison are
      textbook. New to this program: their composition into a representation-
      cost exponent for lift attacks, the r = 4 threshold, the CM
      effective-rank halving, and the N^{1/r} MITM deficit. No external
      novelty is claimed; a Stage-0 check for an existing statement of this
      threshold is part of the design.

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL OBJECT: a RANDOM rank-r lattice with the same
    regulator and a random surjection onto Z/N replacing the genuine
    (Mordell-Weil lattice, reduction map) pair -- i.e. an object of exactly the
    same shape whose arithmetic content is empty. The null must reproduce
    beta = r/2 exactly; if it does, beta measures lattice shape and NOT
    arithmetic, and no arithmetic conclusion may be drawn from beta alone.
    THIS NULL IS EXPECTED TO MATCH, and that expectation is recorded here so
    that a match is a confirmed control rather than a disappointment; the
    arithmetic content of the record is then confined to the CM knee, which
    the null cannot produce.
    DECAY PARAMETER: N. The covering fraction |Im_B|/N at FIXED B must decay
    with slope -1 against N. A covering fraction that fails to decay as N
    grows is the canonical artifact tell and indicates the enumeration is
    finding torsion or twist-related images. POSITIVE CONTROL: a planted
    rank-1 case where all reductions are multiples of one known generator, so
    |Im_B| is exactly computable in closed form; the instrument must match it
    exactly.

  assumptions:
    - >-
      The lattice-point asymptotic V_r B^{r/2} Reg^{-1/2}(1+o(1)) with error
      O(B^{(r-1)/2}). Standard; shared with IDEA-20260807-44ba75 as
      HEUR-CANL-K1 and cited from there rather than re-assumed independently.
    - >-
      |hhat(P) - (1/2) h_x(P)| = O(log|Delta|). Standard (Silverman's height
      difference bound); RECALLED, NOT READ. The constant matters at toy scale
      and is measured rather than assumed: Stage 2 reports the empirical
      max |hhat - h_x/2| per curve.
    - >-
      The reduction map is injective enough on low-height points that
      |Im_B| tracks |{hhat <= B}|. THIS IS EXACTLY WHAT OUTCOME 2 WOULD
      FALSIFY and it is measured, not assumed: the ratio |Im_B|/|{hhat <= B}|
      is a required metric.
    - >-
      Arity r is fixed. Everything here is at fixed arity; growing or
      correlated bases are explicitly outside the ECFG-P1543-R1 scoped theorem
      and outside this record.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the height-to-bit-size
      comparison: "a point of canonical height B has coordinates of bit-size
      Theta(B)". If a representation existed in which a height-B point were
      writable in polylog(B) bits -- a straight-line program, an elliptic
      divisibility sequence index, a theta-coordinate compression -- the size
      obstruction would evaporate and only the search obstruction would
      remain. That is the single most valuable thing to attack in this record
      and it is named here as forward guidance rather than dismissed.
    baseline_embedding:
      parameter_slice: >-
        A rank-1 curve over Q with a known generator P0, at a named p. Then
        |Im_B| is exactly the number of multiples [m]P0 with
        m^2 hhat(P0) <= B, i.e. 2 floor(sqrt(B/hhat(P0))) + 1, capped at the
        order of red(P0). Exact closed form.
      reproduction_check: >-
        Frozen fixture: the curve, P0, p, and the exact integer sequence
        |Im_B| for B on a declared ladder. Exact integer equality. A mismatch
        is an instrument failure and blocks every arm.
    observation_collision:
      observable: "The covering exponent beta."
      distinct_preimage_search: >-
        SUCCEEDS AND IS BLOCKING: a genuine rank-4 Mordell-Weil lattice and a
        random rank-4 lattice with the same regulator give the same beta = 2.
        So beta alone attributes nothing to arithmetic. The record therefore
        does not rest on beta; it rests on the CM KNEE, which is a feature of
        the height spectrum that a random lattice of matched regulator does
        not have. If the knee is also reproduced by the null, the record has
        no arithmetic content at all and must say so.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "find a global point reducing to Q" by "find a lattice
          vector in a prescribed coset of the kernel of reduction". Encoding:
          the Mordell-Weil lattice with the sublattice ker(red mod G).
          Completeness: every liftable point corresponds to a coset element.
          Soundness: reduction of a coset element is Q by construction.
          Transfer: the cost becomes a closest-vector-style problem in rank r.
          COST LOSS, STATED: the kernel sublattice has index N, so its
          successive minima are inflated by N^{1/r} -- WHICH IS EXACTLY THE
          N^{2/r} height and N^{1/r} MITM deficit, arriving from a second
          direction. The reduction is therefore consistent with the identity
          rather than an escape from it, and that consistency is a check.
        predicted_gain: >-
          None. The value is the cross-check: two independent derivations of
          the same exponent.
      - transform: stronger_invariant
        proposed_object: >-
          Track the full profile |Im_B| for all B rather than the exponent,
          including the ratio |Im_B|/|{hhat <= B}| that measures the
          reduction map's injectivity on low-height points.
        predicted_gain: >-
          Exposes Outcome 2 if it exists; the exponent alone would average it
          away.
    quantifier_order: >-
      THE CLAIM: FOR ALL global models Ẽ of rank r reducing to E/F_p, and FOR
      ALL height bounds B with |Im_B| = Theta(N), it holds that
      B = Theta(N^{2/r}) and the bit-size of a witness is Theta(B). THE TRAP:
      the inviting weaker reading "there exists a point of small height
      reducing to Q", which is true for SOME Q (the reductions of the
      generators) and false for a uniformly random one. The record's claim is
      uniform over targets and that uniformity is what makes it a cost bound;
      any downstream use that quietly picks a favourable Q is invalid.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "on the tested toy curves, the covering exponent matches
        r_eff/2 with r_eff = r_O in the CM arm; hence the representation cost
        of a usable lift is N^{2/r_eff} and the MITM cost is N^{1/2+1/r_eff}."
        It CANNOT certify a lower bound on lift attacks in general (a
        compressed representation would evade it), cannot certify anything
        about growing arity, and cannot bear on crypto scale. It is NOT an
        ECDLP lower bound.
      nearby_object_control: >-
        The nearby object where the conclusion fails is a curve with a
        SUB-LATTICE of very small covolume in a low-dimensional projection --
        e.g. a rank-4 lattice that is nearly rank-1 in the metric sense.
        There |Im_B| grows with slope near 1/2 rather than 2, and a method
        reporting beta = r/2 uniformly would be refuted on it. At least two
        such skew cases must be constructed synthetically and run.
    proof_obligations:
      - claim: "|{hhat <= B}| = V_r B^{r/2} Reg^{-1/2}(1+o(1))."
        responsibility: baseline
      - claim: "|hhat - h_x/2| = O(log|Delta|), so bit-size is Theta(B)."
        responsibility: size_bound
      - claim: "Covering forces B = Theta((N sqrt Reg)^{2/r})."
        responsibility: correctness
      - claim: "T_MITM = Theta(N^{1/2+1/r}) in the bit model."
        responsibility: runtime
      - claim: "The CM effective rank inside a ball of radius sqrt(B) < sqrt(|D_E| hhat_min)/2 is r_O."
        responsibility: correctness
      - claim: "The index-N kernel sublattice derivation reproduces the same exponent."
        responsibility: correctness
      - claim: "No lower bound on lift attacks in general is claimed."
        responsibility: scope

  predictions:
    - metric: >-
        covering exponent beta = local slope of log|Im_B| against log B, on
        non-CM curves of exhibited rank r
      direction: different
      minimum_effect: >-
        Predicted r/2 with a fit interval excluding r/2 +- 0.4. Measured on at
        least 4 ranks so the linear-in-r prediction is tested rather than a
        single point.
    - metric: >-
        the CM knee: the B at which beta steps from r_O/2 toward r_Z/2
      direction: different
      minimum_effect: >-
        Predicted at B_knee = (|D_E|/4) hhat_min, to within a factor 3. NO
        KNEE AT ALL, on curves where B_knee is inside the searched range,
        falsifies part (D) and moves the threshold from r_Z > 8 back to
        r_Z > 4. This is the arm most likely to fail and it is the one that
        matters most.
    - metric: >-
        injectivity ratio |Im_B| / |{hhat <= B}|
      direction: different
      minimum_effect: >-
        Predicted 1 - o(1) while |{hhat <= B}| << N, i.e. no collisions before
        the birthday point. A ratio below 0.5 well before the birthday point is
        Outcome 2 and reopens the lane.
    - metric: >-
        measured bytes per stored MITM entry against table size M
      direction: higher
      minimum_effect: >-
        Predicted growth like M^{2/r}. A flat bytes-per-entry curve would mean
        the coordinate-size penalty is absent at toy scale, which would make
        the N^{1/r} deficit unverified rather than refuted, and the record
        must say so.
    - metric: >-
        full-cost exponents: log(T_MITM)/log(N) and log(memory bits)/log(N)
      direction: higher
      minimum_effect: >-
        Predicted 1/2 + 1/r and 1/2 + 1/r respectively, both strictly above
        rho's 1/2 and 0. Reported as the record's decision numbers.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): write the three lemmas and the two independent
      derivations (direct count and index-N sublattice) and check they agree.
      STAGE 1 (hours, HARD GATE): rank-1 closed-form fixture; exact integer
      match required.
      STAGE 2 (hours): measure beta on >= 8 curves spanning exhibited ranks
      1..4, both CM (h(D_E)=1) and non-CM, at 3 primes each.
      STAGE 3 (hours): the CM knee hunt on curves where B_knee is inside
      range; if no such curve is reachable, RECORD THAT THE ARM WAS NOT
      TESTABLE rather than reporting a null result.
      STAGE 4 (hours): synthetic skew-lattice nearby-object control.
      STAGE 5 (hours): small MITM with measured bytes per entry.
      STAGE 6 (zero compute): charge both exponents against rho and BSGS.
    controls:
      - Random lattice null of matched rank and regulator (expected to match).
      - Rank-1 closed-form positive control.
      - Skew-lattice nearby-object control.
      - Torsion and twist exclusion.
      - Rho and BSGS baselines in the bit-cost model.
    required_metrics:
      - "|Im_B| and |{hhat <= B}| per (curve, p, B)"
      - Local slope beta with interval, per curve
      - Empirical max |hhat - h_x/2| per curve
      - B_knee predicted and measured, or "not testable"
      - Bytes per MITM entry against M
      - Full-cost exponents with intervals

  falsification_conditions:
    - >-
      The rank-1 closed-form fixture does not reproduce exactly. Instrument
      failure; nothing reported.
    - >-
      beta does not track r/2 across ranks. The lattice count is inapplicable
      at reachable B and the identity is unvalidated (not refuted) -- the
      record must say which.
    - >-
      No CM knee where one is predicted and reachable. Part (D) is false; the
      CM effective-rank halving is withdrawn and the threshold returns to
      r_Z > 4.
    - >-
      The injectivity ratio collapses well before the birthday point. Outcome
      2; the lane reopens with a concrete new object (structured
      non-injectivity of reduction on low-height points).
    - >-
      The random-lattice null reproduces the CM knee. The knee is a lattice
      artifact and the record has no arithmetic content; that must be reported
      as the finding.
    - >-
      The covering fraction fails to decay with N. Artifact tell; no exponent
      may be reported.

  confounders:
    - >-
      Search-bound bias. Enumerating x = u/w^2 with |u| <= U, w <= W samples a
      naive-height box, not a canonical-height ball; the two differ by
      O(log|Delta|) and by the shape of the box. Both arms use the identical
      box, and the empirical |hhat - h_x/2| is reported so the distortion is
      visible.
    - >-
      Small B. Every reachable B is small; the asymptotic's error term
      O(B^{(r-1)/2}) is a constant fraction of the main term at these sizes.
      Only slopes and CM/null ratios are interpreted.
    - >-
      Regulator estimation. Reg is computed from exhibited generators, which
      may generate a finite-index sublattice; that inflates Reg by the index
      squared and shifts beta's intercept but not its slope. Slopes only.
    - >-
      Torsion images. Torsion reduces to a fixed O(1) set present at every B;
      it must be subtracted or |Im_B| has a spurious constant.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy. The crypto-size rows in part (B) are
      ARITHMETIC EVALUATIONS of the identity, labelled as such, not
      experiments.
    - >-
      This is a SIZE bound, not a lower bound on lift attacks. A compressed
      representation of high-height points would evade it entirely, and that
      escape is named in the proof_search_map as the most valuable thing to
      attack.
    - >-
      The r = 4 threshold applies to the representation cost only. Clearing it
      does not produce an attack; the search cost above it is unsolved and the
      only generic strategy priced here loses to rho by N^{1/r}.
    - >-
      Nothing here bears on any deployed curve, and no claim about ECDLP
      hardness is made in either direction.

  heuristic_assumptions:
    - id: HEUR-CANL-B1
      statement: >-
        FOR ALL tested (curve, p) pairs and FOR ALL B below the birthday point
        sqrt(N), the reduction map is injective on {P~ : hhat(P~) <= B} up to
        a factor 1 + o(1) -- i.e. distinct low-height global points have
        distinct reductions.
      rigorous_support: >-
        Rigorously, two global points with the same reduction differ by an
        element of the kernel of reduction, which is a subgroup of index at
        least N in the image; so a collision below the birthday point requires
        a kernel element of height at most 4B, and the kernel's minimum is
        inflated by N^{2/r} by the index bound. That argument is rigorous and
        makes the heuristic a theorem once B < N^{2/r}/4. The classical
        distribution theorem being imitated for the remaining range is the
        birthday bound for a uniform map into a set of size N.
      validation_plan: >-
        Sample: every enumerated point on every tested curve, at every B.
        Scale: at least 10^5 points per curve. Predicted distribution: zero
        collisions below sqrt(N) and a collision count matching
        |{hhat<=B}|^2/(2N) above it. Tail check: report every observed
        collision pair with both preimages. TOY SCALE ONLY; the crypto-scale
        version of this claim is not validated here or anywhere in this record.
    - id: HEUR-CANL-B2
      statement: >-
        The effective rank governing |{hhat <= B}| on a CM lattice is r_O for
        B < (|D_E|/4) hhat_min and r_Z = 2 r_O above it, with the transition
        occurring over less than one decade in B.
      rigorous_support: >-
        The lower and upper regimes are rigorous consequences of fd5a24's
        Lemma 1 (no lattice vector from the omega-direction below
        (|D_E|/4) hhat_min) and of the full lattice count above it. The
        heuristic is only the sharpness of the transition; a slow transition
        would blur the knee without changing either asymptote. The classical
        analogue is the standard two-regime behaviour of a lattice-point count
        for a very skew form, where the crossover is governed by the ratio of
        successive minima.
      falsification_condition: >-
        A measured transition spanning more than two decades in B, or no
        transition at all where one is predicted and reachable.
      validation_plan: >-
        Sample: CM curves with |D_E| in {3,4,7,8,11} and exhibited rank >= 2,
        at B spanning both sides of the predicted knee. Predicted
        distribution: slope r_O/2 below, r_Z/2 above. Tail check: the measured
        slope in the decade immediately around B_knee. TOY SCALE ONLY.

  target_complexity:
    time_exponent: >-
      For the mechanism this record prices: 1/2 + 1/r in N for the
      meet-in-the-middle version in the BIT-COST model, versus rho's 1/2. The
      deficit is exactly N^{1/r} and it never becomes a surplus. For the
      representation cost alone: N^{2/r} per usable lift, N^{4/r_Z} in the CM
      case by part (D).
    memory_exponent: >-
      1/2 + 1/r in bits for the MITM, versus rho's 0 and BSGS's 1/2. This is
      the axis on which the mechanism is worst, and it is worse than BSGS by
      exactly the same N^{1/r} coordinate penalty.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886 sqrt(N) group
      operations, O(1) memory (KN-TECH-001, KN-TECH-006); the
      automorphism-discounted variant on CM curves, a constant <= sqrt(6)
      better (KN-TECH-018); BSGS at sqrt(N) time and sqrt(N) memory
      (KN-TECH-031).
    hidden_overhead: >-
      Three items, all disclosed. (i) The o(1) in the lattice count is a
      constant-fraction error at reachable B and is not asymptotically small
      here. (ii) The O(log|Delta|) in the height comparison is additive in B
      and therefore dominant at small B, which is why only slopes are
      interpreted. (iii) The canonical lift's construction cost
      p^{1+o(1)} (IDEA-20260807-ee6ef7) is NOT included in any exponent above
      and dominates all of them for the generic curve.
    tradeoff_note: >-
      The MITM has the standard time-memory curve T*M = N in group operations,
      but every stored element costs M^{2/r} bits, so in the bit model the
      curve is T * M^{1+2/r} = N^{1+2/r}: WORSE THAN BSGS AT EVERY POINT OF
      THE TRADEOFF, not only at the balanced point. Parallelisation is linear
      and identical to rho's, so parallelism does not close the gap -- the
      N^{1/r} deficit is invariant under adding processors, which is the
      sharpest available statement of the mechanism's position.

  dominated_by: >-
    CHECKED ON EVERY FRONTIER ROW ACROSS TIME, MEMORY AND DATA/QUERIES.
    Dominated by parallel Pollard rho with distinguished points on BOTH time
    (N^{1/2+1/r} versus N^{1/2}) and memory (N^{1/2+1/r} bits versus O(1)).
    Dominated by BSGS on both time and memory by the same N^{1/r} factor.
    Dominated by the automorphism-discounted rho on CM curves by a further
    sqrt(|Aut|) (KN-TECH-018). Dominated at every point of the time-memory
    tradeoff curve, not merely at the balanced point, as computed in
    tradeoff_note. No index-calculus row is comparable (different resource),
    and this mechanism is dominated there too on total time. NOT null.
  sota_delta: >-
    Zero speedup; a quantified DEFICIT. Time exponent 1/2 + 1/r versus rho's
    1/2, i.e. slower by N^{1/r} (N^{0.25} at r = 4, N^{0.11} at r = 9).
    Memory exponent 1/2 + 1/r bits versus rho's 0. Representation cost per
    usable lift N^{2/r}, crossing rho's total cost at exactly r = 4 and, in
    the CM case, at exactly r_Z = 8. The record's contribution is these four
    numbers and the identification of r = 4 as the threshold.

