  reachability_gate: >-
    T5 EVALUATED, AND THIS RECORD IS PARTLY A GATE ITSELF. Moving from E/F_p
    to a global model costs p^{1+o(1)} for the canonical lift
    (IDEA-20260807-ee6ef7) and O(polylog p) for a Xedni-constructed curve --
    so on the CONSTRUCTION axis the Xedni route is reachable and the canonical
    route is not, except in the h(D_E) = O(1) class. This record's identity
    applies to both. The object it would want to reach -- a global model of
    rank r > 4 with small regulator reducing to the given E -- is NOT reachable
    by any move priced here: within the canonical route the lift is a function
    of E (no choice at all), and within the Xedni route imposing rank is
    exactly the Mestre cost JKSST charge as prohibitive. Goodness (large r) is
    detectable only by a point search of cost B^{r/2}, which is the same
    search the attack needs, so detection is not cheaper than exploitation and
    the T5 dichotomy resolves negatively on both branches.

