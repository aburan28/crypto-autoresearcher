# IDEA-20261003-18fcf9
# Class-number count for discriminants -71 and -79. Proposal only. Not approved.
idea:
  id: IDEA-20261003-18fcf9
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -71 is 7 and of discriminant -79 is 5
  class: measurement
  claim: >-
    Discriminant -71 has 7 reduced binary quadratic forms.
    Discriminant -79 has 5. Seven exceeds five by 2. The product of
    the two class numbers is 35. Their sum is 12. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -71 has the forms with coefficients 1, 1, 18 and
    2, -1, 9 and 2, 1, 9 and 3, -1, 6 and 3, 1, 6 and 4, -3, 5 and
    4, 3, 5. Discriminant -79 has the forms with coefficients
    1, 1, 20 and 2, -1, 10 and 2, 1, 10 and 4, -1, 5 and 4, 1, 5.
    Two copies of class number 5 have gap 0. No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two class numbers.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
    bottleneck: The class-number gap 2.
    baseline_embedding:
      parameter_slice: The discriminants -71 and -79 and the counts 7 and 5.
      reproduction_check: >-
        Two readers must agree that the counts are 7 and 5.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 5 drops the gap. Two copies
        of class number 5 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
      The discriminants are fixed before the forms are counted.
    method_ceiling:
      strongest_certifiable_claim: >-
        The class numbers 7 and 5. Not an absolute discriminant.
      nearby_object_control: >-
        Two copies of class number 5. The gap is 0.
    proof_obligations:
      - claim: Discriminant -71 has 7 reduced forms.
        responsibility: size
      - claim: Discriminant -79 has 5 reduced forms.
        responsibility: size
      - claim: The gap is not an absolute discriminant.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: class_number_gap
      direction: different
      minimum_effect: Seven exceeds five by 2.
  minimal_test:
    design: >-
      Count the reduced forms of discriminants -71 and -79. Do not
      enumerate a curve.
    controls:
      - Two copies of class number 5, whose gap is 0.
      - An independent count.
    required_metrics:
      - both class numbers
      - the gap
      - the product
  falsification_conditions:
    - The class number of -71 is not 7.
    - The product of the two class numbers is not 35.
  confounders:
    - The absolute values 71 and 79 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 5 and 4 of discriminants -47 and -56.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -71 has class number 7, and the
        frozen discriminant -79 has class number 5.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
