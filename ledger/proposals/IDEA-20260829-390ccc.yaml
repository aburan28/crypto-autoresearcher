idea:
  id: IDEA-20260829-390ccc
  question_id: RQ-ECDLP-160d89
  added: '2026-08-29'
  title: >-
    Join-key rigidity from Cauchy-Davenport and Vosper: any O(L)-time
    concentrating four-list join key on a prime-order group has arithmetic-
    progression fibers, hence is a discrete-logarithm interval key
  class: mechanism
  claim: >-
    CONDITIONAL THEOREM CANDIDATE, stated for falsification. Let G = <P> have
    prime order N, let D subset G be the level-1 accepted set with |D| = sigma
    <= N-2, and let a level-1 join be implemented by a PREDECLARED fiber system
    {(A_c, B_c)}_{c in K}, evaluable from a point's coordinates, such that
    (i) SOUNDNESS, A_c + B_c subset D for every c; (ii) COVERAGE, a constant
    fraction of {(R,S) in G x G with R+S in D} lies in some A_c x B_c; and
    (iii) COST, the scan term (L/N) * sum_c (|A_c| + |B_c|) is O(L polylog N).
    Then a constant fraction of the coverage is carried by fiber pairs with
    min(|A_c|,|B_c|) = Omega(sigma / polylog N), and Cauchy-Davenport forces
    |A_c| + |B_c| <= sigma + 1 for every c, so those pairs have sumset-to-size
    ratio |A_c + B_c| / (|A_c| + |B_c|) = O(polylog N). By Vosper's theorem in
    the critical case, and by Freiman/Green-Ruzsa structure in Z/p in the
    small-doubling case, each such A_c and B_c is contained in a generalized
    arithmetic progression in the GROUP, of bounded dimension, with a common
    difference vector; equivalently the key g is, up to bounded ambiguity, the
    top-bits map of log_T(R) for one or a few bases T in G. Consequently the key
    evaluation is not a coordinate function, because it consumes
    discrete-logarithm information about its own input. This does NOT assert
    that no four-list route exists; it asserts that within this fiber-system
    class the missing condition is exactly a computable coarse discrete
    logarithm, which is the first condition RQ-ECDLP-160d89 asks to be named.
  mechanism: >-
    A hash-style join is exactly a cover of the acceptance relation's 1-set by
    combinatorial rectangles A_c x B_c, and soundness makes each rectangle's
    sumset land inside D. That converts an ALGORITHMIC requirement into an
    ADDITIVE-COMBINATORIAL one, which is the move this lane has not made. The
    accounting is as follows. Coverage needed is N*sigma incidences; a fiber pair
    contributes |A_c||B_c| incidences at scan cost (L/N)(|A_c|+|B_c|), so its
    coverage-per-cost is at most (N/L) * min(|A_c|,|B_c|) <= (N/L)(sigma/2),
    giving total scan >= 2L with equality only when the fibers are BALANCED at
    size Theta(sigma). Balanced fibers plus soundness plus Cauchy-Davenport
    (|A+B| >= min(N, |A|+|B|-1) in Z/N with N prime) pin |A_c|+|B_c| within a
    polylog factor of |A_c+B_c| <= sigma, that is, small doubling. Small doubling
    in a prime-order cyclic group is a rigid condition, because it forces AP
    structure by Vosper in the critical case, or bounded-dimension generalized-AP
    structure by Freiman/Green-Ruzsa; and a generalized progression in G is
    parameterized by discrete logarithms with respect to its difference vector.
    So the fiber label is a coarse discrete logarithm. Sign-closure, meaning
    x(-R) = x(R), and the target Q enter only through the lists and not through
    the fiber system, so they do not evade the argument.
  novelty_status: unverified
  citations:
    - ref: https://isa-afp.org/entries/Cauchy_Davenport_Vosper.html
      provenance: retrieved
      claim: >-
        An Archive of Formal Proofs entry exists formalising, in Isabelle/HOL,
        the Cauchy-Davenport lower bound and Vosper's theorem for sumsets over
        finite fields of prime cardinality. Only the entry page abstract was
        read; the formal theorem statements with their |A+B| <= p-2 and
        |A|,|B| >= 2 side conditions were NOT extracted from the proof document
        and are cited separately as recalled.
      verified_by: >-
        idea-generator, WebFetch of the AFP entry page on 2026-08-29; entry page
        only, proof document not opened.
    - ref: >-
        A. G. Vosper, "The critical pairs of subsets of a group of prime order",
        J. London Math. Soc. 31 (1956)
      provenance: recalled
      claim: >-
        If A and B are subsets of Z/pZ with |A|,|B| >= 2 and
        |A+B| = |A|+|B|-1 <= p-2, then A and B are arithmetic progressions with
        the same common difference. Bibliographic pointer and this statement were
        seen in a WebSearch result summary on 2026-08-29; the paper itself was
        not fetched.
      verified_by: null
    - ref: >-
        arXiv:math/0505198 -- B. Green and I. Z. Ruzsa, "Freiman's theorem in an
        arbitrary abelian group"
      provenance: recalled
      claim: >-
        A set of doubling at most K in an abelian group is contained in a coset
        progression of bounded dimension and size O_K(|A|). Used here for the
        small-doubling, non-critical branch. The arXiv identifier and title were
        confirmed in a WebSearch listing on 2026-08-29; the abstract was not
        fetched and the K-dependence of the dimension bound was NOT verified.
      verified_by: null
    - ref: >-
        arXiv:1912.03483 -- "Small doubling in prime-order groups: from 2.4 to
        2.6"
      provenance: recalled
      claim: >-
        Quantitative Freiman-type structure results for small doubling
        specifically in Z/pZ, relevant to the near-critical branch where Vosper
        does not apply verbatim. Title seen in a WebSearch listing on 2026-08-29;
        content not fetched.
      verified_by: null
    - ref: IDEA-20260823-cab6c6
      provenance: internal
      claim: >-
        The frozen x-coordinate interval key K-EC-XINTERVAL-1, its conditional
        fibre-size calculation, and the record that every supplied exact
        enumerator inspects Theta(L^2) pairs.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: ledger/goals/GOAL-ECDLP-001/checkpoints/BATCH-671cae.yaml
      provenance: internal
      claim: >-
        B64-DER-2 states the Theta(L^2) = N^(2/3+o(1)) enumerator cost for the
        SUPPLIED enumerators only and explicitly disclaims a generic selector
        lower bound; B64-DER-6 preserves output-sensitive source unranking as
        open.
      verified_by: idea-generator, full read of the checkpoint on 2026-08-29
    - ref: IDEA-20260817-1e0111
      provenance: internal
      claim: >-
        Prime-order congruence rigidity, attributed there to
        IDEA-20260807-df906f, namely that any v with v(R+R') = F(v(R),v(R')) on
        a prime-order group is injective or constant. This record's theorem is a
        strictly different statement, because it constrains the FIBER SYSTEM of a
        join rather than an exactly propagating projection, and it applies to
        keys that propagate not at all.
      verified_by: idea-generator, full read of the record on 2026-08-29
    - ref: ledger/hypotheses/H-JPR-3a00f0.yaml
      provenance: internal
      claim: JPR-C1 through C7 and the conditional N^(1/3+o(1)) four-list arithmetic.
      verified_by: idea-generator, full read of the record on 2026-08-29
  assumptions:
    - >-
      A1. N is prime and G = <P> is the full prime-order subgroup;
      Cauchy-Davenport and Vosper are used in Z/N and require primality.
    - >-
      A2. The fiber system is PREDECLARED, meaning fixed before the lists are
      sampled and independent of Q. Data-dependent keys are outside the theorem
      and are treated in IDEA-20260829-7169d6.
    - >-
      A3. Soundness is exact, meaning A_c + B_c subset D. Constant-rate false
      positives are handled only heuristically here; see H2.
    - >-
      A4. The join's cost is charged as insertion plus scan plus emitted output;
      no free bulk primitive that depends on unqueried elements is granted.
    - >-
      A5. No exact nontrivial quotient of G is assumed to exist, per the RQ
      constraint.
  proof_search_map:
    bottleneck: >-
      Converting "no output-sensitive enumerator was supplied", which B64-DER-2
      scopes to supplied constructions, into "no predeclared sound balanced fiber
      system with O(L polylog N) scan exists unless its fibers are group-APs".
    baseline_embedding:
      parameter_slice: >-
        sigma = N, meaning no concentration, D = G, and one fiber pair A = B = G,
        reproduces the full-pair meet-in-the-middle locator of B64-DER-5 at
        Theta(L^2). The XOR control F_2^(3m) with D a codimension-m subgroup
        reproduces Wagner's prefix join with A_c = B_c cosets of the kernel,
        sumset equal to D and doubling exactly 1.
      reproduction_check: >-
        Symbolic. In F_2^n the Cauchy-Davenport hypothesis fails, because the
        group is not of prime order, and cosets of a subgroup are exactly the
        equality case of Kneser's theorem. The theorem must therefore be silent
        on XOR, and a version of it that proved XOR impossible would be refuted on
        the spot. This is the single cheapest correctness check on the argument.
    observation_collision:
      observable: >-
        The pair consisting of the accepted-set size sigma and the realized
        level-1 scan cost. Two objects share this observable and lead to opposite
        conclusions.
      distinct_preimage_search: >-
        Preimage A is the log-interval key on Z/N with known logarithms, where
        sigma = N/m, scan is O(L), fibers are APs, and the join works. Preimage B
        is the x-coordinate interval key K-EC-XINTERVAL-1, where sigma = 2N/L
        identically, but no fiber system with O(L) scan is known. Same sigma,
        different achievable cost; the theorem's content is exactly that the
        difference is the AP structure of the fibers and nothing else. A third
        preimage, D a random subset of G of density 1/L, has the same sigma and,
        under H1, maximum balanced biclique size O(1).
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Recast the join as a rectangle cover of the acceptance relation, so
          that the algorithmic requirement of output-sensitive enumeration
          becomes the additive requirement that large sound rectangles exist.
        predicted_gain: >-
          Converts an unquantified algorithm-design question into
          Cauchy-Davenport plus a Freiman-type stability theorem, that is, into
          settled mathematics with quantifiers over ALL predeclared keys rather
          than over supplied ones.
      - transform: stronger_invariant
        proposed_object: >-
          Replace the scalar pruning ratio r of IDEA-20260817-1e0111 by the fiber
          system's doubling profile, the family
          {|A_c+B_c| / (|A_c|+|B_c|)} indexed by c.
        predicted_gain: >-
          r is invariant under permuting which pairs survive and therefore cannot
          separate the three preimages above; the doubling profile separates all
          three by construction.
      - transform: boundary_lift
        proposed_object: >-
          Extend from k = 4, that is t = 2, to k = 2^t. At level l the support
          shrinks from sigma_{l-1} to sigma_l >= 2*sigma_{l-1}/m_l, so the
          Cauchy-Davenport floor is exactly Wagner's N^(1/(t+1)) for every t, and
          the rigidity conclusion applies level by level.
        predicted_gain: >-
          Shows the obstruction is NOT a counting deficit at any t, since it is
          the equality and stability analysis alone. This forecloses "use more
          lists" as an escape and is a falsifiable prediction of the framework.
    quantifier_order: >-
      FOR ALL prime N in the declared range, FOR ALL predeclared fiber systems
      {(A_c,B_c)} on G = <P> satisfying soundness, coverage and the
      O(L polylog N) scan bound, with sigma <= N-2 and minimum fiber size at
      least 2, THERE EXIST a dimension d = O(polylog N), difference elements
      T_1 through T_d in G, and progressions containing each A_c and B_c with
      those differences. No curve, key, accepted set, or fiber system is selected
      after the lists are drawn.
    method_ceiling:
      strongest_certifiable_claim: >-
        A structure theorem for PREDECLARED, SOUND, BALANCED fiber systems on a
        prime-order group. It cannot certify anything about (a) data-dependent or
        adaptive keys, (b) keys tolerating a constant rate of false positives
        with sumsets exceeding D, (c) randomized joins with two-sided error,
        (d) joins that are not rectangle covers at all, such as algebraic
        resultant or root-finding joins, or (e) non-prime group orders. Each of
        (a) through (e) is a live successor class, and (b) is the widest.
      nearby_object_control: >-
        F_2^(3m) with a subgroup accepted set is the object where the desired
        conclusion MUST fail, because a subgroup is precisely a set whose sumset
        does not grow. A version of the argument that also closes XOR proves too
        much and is wrong. Second control, Z/N with N = d*e composite and
        d about N^(2/3), where the order-d subgroup gives sound rectangles of
        area d^2 with no AP structure needed, so the theorem must fail as soon as
        primality is dropped. That is a checkable hypothesis-necessity test.
    proof_obligations:
      - claim: >-
          Coverage-per-cost of a fiber pair is at most (N/L)*min(|A_c|,|B_c|),
          hence an O(L polylog N) scan forces balanced fibers of size
          Theta(sigma/polylog N).
        responsibility: runtime
      - claim: >-
          Soundness plus Cauchy-Davenport gives |A_c|+|B_c| <= sigma+1 for
          every c.
        responsibility: correctness
      - claim: >-
          Balanced size Theta(sigma/polylog) plus |A_c+B_c| <= sigma gives
          doubling O(polylog N).
        responsibility: size
      - claim: >-
          Small doubling in Z/N with N prime implies containment in a
          bounded-dimension coset or generalized progression, with an explicit
          dimension bound at polylog doubling.
        responsibility: strictness
      - claim: >-
          A generalized progression in G is parameterized by discrete logarithms
          with respect to its difference vector, so the fiber label is a coarse
          discrete logarithm.
        responsibility: interface
      - claim: >-
          The theorem is silent on F_2^n and on composite N, and is refuted if it
          is not.
        responsibility: scope
      - claim: >-
          The k = 2^t generalization has Cauchy-Davenport floor exactly
          N^(1/(t+1)) at every level.
        responsibility: baseline
    not_applicable_reason: null
  predictions:
    - metric: doubling_ratio_of_the_largest_sound_balanced_fiber_pairs_for_any_coordinate_derived_key
      direction: higher
      minimum_effect: >-
        For every coordinate-derived key in the corpus panel, namely x-interval,
        x quadratic-residue, and keyed PRF of the point encoding, the largest
        sound balanced fiber pair at accepted-set density 1/L has
        min(|A|,|B|) = O(1) as N grows, that is, doubling ratio Omega(sigma).
        Predicted maximum balanced sound fiber size at most 8 at every tested N,
        against the log-interval control which achieves Theta(sigma).
    - metric: log_interval_control_fiber_size
      direction: different
      minimum_effect: >-
        Forced value, Theta(sigma) with doubling ratio 1 + o(1). If this control
        does not achieve it, the formalization is wrong and the argument is void.
    - metric: theorem_status_on_F_2_3m_and_on_composite_N
      direction: different
      minimum_effect: >-
        Forced value, silent, because the hypotheses are unsatisfied. Any
        derivation that closes either control is refuted.
    - metric: cd_floor_exponent_at_k_equals_2_to_the_t
      direction: different
      minimum_effect: >-
        Exactly 1/(t+1) for t in {1,2,3}; t = 1 must reproduce BSGS at 1/2.
  minimal_test:
    design: >-
      STATIC AND SYMBOLIC ONLY, inside the RQ claim boundary. Step 1, write the
      four-line cost accounting and derive the coverage-per-cost inequality and
      the balancedness consequence, as an explicit lemma with constants. Step 2,
      apply Cauchy-Davenport to soundness and record the resulting doubling
      bound. Step 3, instantiate the two hypothesis-necessity controls
      symbolically, namely F_2^(3m) with a subgroup accepted set and Z/N with
      N = d*e and d about N^(2/3); the derivation must go silent on both.
      Step 4, instantiate the log-interval positive control on Z/N with known
      logs and check it saturates every inequality. Step 5, extract from the
      cited Freiman/Green-Ruzsa and Z/p small-doubling literature the exact
      dimension bound available at doubling polylog N, and record honestly
      whether it is strong enough or whether only the critical Vosper case is
      rigorous. A LATER and separately authorized toy-scale run would
      exhaustively compute maximum sound balanced fiber sizes for the panel keys
      at small primes; that run is NOT proposed here and would need a boundary
      amendment.
    controls:
      - >-
        Hypothesis-necessity control 1, F_2^(3m) subgroup accepted set. The
        derivation must be silent.
      - >-
        Hypothesis-necessity control 2, composite N with a divisor of size
        N^(2/3). The derivation must be silent.
      - >-
        Positive control, log-interval key on Z/N with known logarithms. It must
        saturate every inequality with doubling 1 + o(1).
      - >-
        Proves-too-much control, the full-pair locator with one fiber, A = B = G,
        sigma = N. The theorem must permit it at cost Theta(L^2).
      - >-
        Nearby-object control, the x-interval key K-EC-XINTERVAL-1. The theorem
        must not claim its accepted set is bad, only that no sound balanced fiber
        system for it is exhibited.
      - >-
        Mandatory Pareto rows, Pollard rho at N^(1/2) time and O(1) memory, and
        BSGS at N^(1/2) time and memory.
    required_metrics:
      - coverage_per_cost_inequality_with_explicit_constants
      - forced_minimum_balanced_fiber_size_as_a_function_of_scan_budget
      - doubling_ratio_bound_derived_from_cauchy_davenport
      - dimension_bound_available_from_cited_freiman_type_results_at_polylog_doubling
      - which_of_the_two_hypothesis_necessity_controls_the_derivation_survives
      - explicit_list_of_escape_classes_left_open
  falsification_conditions:
    - >-
      A predeclared sound fiber system on a prime-order group is exhibited with
      sigma <= N/2, minimum balanced fiber size Omega(sigma/polylog N), and
      fibers that are provably not contained in bounded-dimension progressions.
      This refutes the theorem outright.
    - >-
      The coverage-per-cost inequality is wrong, that is, an O(L polylog N) scan
      is achieved by unbalanced fiber pairs. This removes the balancedness step
      and the whole chain collapses.
    - >-
      The derivation, as written, also closes the F_2^(3m) subgroup control or
      the composite-N control. That proves too much and the argument is void
      until repaired.
    - >-
      The log-interval positive control fails to saturate the inequalities,
      showing the formalization does not describe the one join that provably
      works.
    - >-
      Only the exact-critical Vosper case is rigorous and no usable Freiman-type
      dimension bound exists at polylog doubling. Then the theorem holds only for
      exactly-critical fiber systems and must be restated with that hypothesis,
      which is a much weaker result and must be reported as such.
    - >-
      Soundness is shown to be unnecessary, because a join tolerating false
      positives achieves O(L polylog N) scan with sigma = N^(2/3). Then the
      theorem is true but vacuous for algorithm design, and IDEA-20260829-3f0f4b
      becomes the live record.
  confounders:
    - >-
      Sign-closure, since x(-R) = x(R) makes every coordinate-derived accepted
      set symmetric, so D = -D. This changes constants in the covering count and
      must be carried, not assumed away.
    - >-
      The distinction between p and N. Fiber and accepted-set sizes are counted
      in the GROUP, and any exponent translated from field-side counting must be
      flagged.
    - >-
      Cauchy-Davenport degenerates when sigma > N-2; the theorem must exclude
      that range explicitly rather than silently.
    - >-
      Coverage is required only up to a constant fraction. A fiber system that
      covers a 1/polylog fraction changes the success probability and must be
      charged, not treated as full coverage.
    - >-
      Multi-valued keys, where each point lies in t fibers, rescale insertion
      cost by t. The argument must be checked to be invariant under this, since a
      t-fold cover is the obvious first evasion.
    - >-
      Freiman-type bounds in Z/N typically require |A| small relative to N. At
      sigma close to N the structure theorems weaken or vanish, exactly where the
      weakest useful concentration lives.
  interpretation_limits:
    - No experiment, run, implementation, curve generation, or ECDLP result. Zero runs.
    - >-
      A theorem about predeclared sound fiber systems is not an ECDLP lower bound
      and not a statement about all four-list algorithms.
    - >-
      The result would explain and generalize B64-DER-2, not contradict it.
      B64-DER-2 remains the only measured statement and stays scoped to its
      supplied enumerators.
    - >-
      Nothing here contradicts, supersedes, or has priority over the prime-order
      congruence rigidity theorem cited via IDEA-20260817-1e0111. That theorem
      constrains exactly propagating projections, this one constrains fiber
      systems, and neither implies the other.
    - >-
      Every citation supporting the additive-combinatorial step is recalled
      except the AFP entry page; the theorem statements themselves are UNVERIFIED
      against primary sources in this session.
  heuristic_assumptions:
    - id: H1
      statement: >-
        RANDOM-SET BICLIQUE CEILING. For D a subset of Z/N of density
        delta = N^(-1/3) chosen uniformly at random, the maximum k such that
        there exist A and B with |A| = |B| = k and A+B subset D satisfies
        k <= 6 + o(1) with probability 1 - o(1). Formally, the first-moment count
        of such pairs is at most binom(N,k)^2 * delta^(|A+B|), and for A and B in
        general position |A+B| = Theta(k^2), giving expected count
        N^(2k - k^2/3), which is o(1) for k >= 7. The heuristic content is that
        the concretely computable accepted sets of this lane, namely
        D = x^{-1}(interval), x^{-1}(quadratic residues), and PRF-keyed subsets,
        behave like uniformly random sets of their density with respect to the
        GROUP addition on E(F_p), in the sense that they contain no non-AP sound
        biclique larger than the random prediction. This imitates the classical
        Erdos-Renyi first-moment threshold for the largest complete bipartite
        subgraph of a random bipartite graph.
      rigorous_support: >-
        Rigorous parts are the first-moment bound above for genuinely random D,
        and Cauchy-Davenport's |A+B| >= |A|+|B|-1, which forbids the degenerate
        route of taking |A|+|B| > sigma+1. Not rigorous is the claim that
        x^{-1}(interval) is random-like with respect to the group law. That is
        the assumption.
      validation_plan: >-
        In a SEPARATELY AUTHORIZED toy computation, not proposed in this record,
        for primes N with 24 <= log2 N <= 34 and curves of prime order N, find
        the maximum k with A+B subset x^{-1}(I) for |I| = p/L and L = N^(1/3),
        exhaustively for k <= 4 and by randomized greedy search for k <= 12, over
        at least 8 curves per size and 32 interval placements per curve. Compare
        the empirical maximum-k distribution against (a) the first-moment
        prediction for a uniform random D of the same density and (b) the
        log-interval positive control, which must return k = Theta(sigma). Tail
        check, report the single largest k observed anywhere against the
        first-moment tail, and report any k exceeding the random prediction by 2
        or more as a falsification of H1 rather than as noise. Sampled parameters
        N, curve, interval placement, and seeds recorded per cell. TRANSFER
        ASSUMPTION, stated explicitly, nothing at log2 N <= 34 transfers to
        256-bit curves; the sampling can only refute H1, never confirm it at
        cryptographic scale.
    - id: H2
      statement: >-
        FALSE-POSITIVE STABILITY. If a fiber system is sound only up to a
        constant fraction eta of its emitted pairs, meaning
        |(A_c+B_c) minus D| <= eta*|A_c+B_c| for a constant eta < 1, then the
        same AP or generalized-AP structure conclusion holds with the dimension
        bound degraded by a factor depending only on eta. This imitates the
        passage from Vosper's exact critical-pair theorem to the 3k-4 and
        Freiman stability results in Z/p.
      rigorous_support: >-
        Partial. Stability versions of Vosper and quantitative 3k-4 results in
        Z/p exist, in the line of work titled "from 2.4 to 2.6", but I have NOT
        verified that any of them applies at the doubling constants and set sizes
        needed here. This is the single weakest link in the argument and is
        flagged as such.
      validation_plan: >-
        Literature extraction, not computation. Obtain the exact hypotheses of
        the strongest available Z/p small-doubling structure theorem and record,
        as a table, for which pairs of doubling constant and |A|/N it applies. If
        no cited theorem covers doubling polylog N at |A| about N^(2/3), the
        record must be restated for exactly-critical fiber systems only, and that
        restriction published as the result.
    - id: H3
      statement: >-
        NO CHEAP TOP-BITS ORACLE. Computing the top (1/3)log_2 N bits of
        log_T(R) for a uniformly random R in G = <T> of prime order N requires
        N^(1/2-o(1)) group operations by any known method, that is, it is not
        asymptotically cheaper than a full discrete logarithm. This imitates the
        classical bit-security statements for discrete logarithms.
      rigorous_support: >-
        None supplied here beyond the absence of a known algorithm. Hardness of
        individual and most-significant bits of discrete logarithms is a
        classical topic and its precise statements are not verified in this
        session. The assumption is used only to say that the theorem's conclusion
        is a NEGATIVE for algorithm design, not to prove any bound.
      validation_plan: >-
        Literature check against the bit-security-of-discrete-logarithms line,
        namely Blum-Micali, the Boneh-Venkatesan hidden number problem, and
        successors, recording precisely which bit predicates are proved hard and
        under which reductions. If a cheap coarse-log algorithm exists, this
        record's conclusion INVERTS into a positive route and must be reported
        that way.
  target_complexity:
    time_exponent: >-
      No algorithm and no speedup is proposed. The theorem's role is to locate
      the whole family on the exponent surface
      T = N^max(gamma*(2-s)/4, s/2), where the level-1 join costs L^gamma and the
      survivor-sum support is sigma = N^s. Known slices are (gamma,s) = (2,1),
      which is BSGS at N^(1/2); (gamma,s) = (2,2/3), which is exactly
