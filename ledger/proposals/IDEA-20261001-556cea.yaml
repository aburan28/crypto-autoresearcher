  assumptions:
    - Frozen V and field polynomials; degree definitions pinned in the contract.
    - Toy n only; δ=2 pre-registered; no post-hoc δ edits.
    - Measuring degree ≠ solving a cryptographic PDP instance.

  heuristic_assumptions:
    - id: HEUR-BINSTD-556cea-H1
      formal_statement: >-
        FORALL n∈{17,19,23}, for frozen V_n with dim ℓ∈{3,4}: letting d0 be
        the measured first-fall degree of the descended S_3 system and ds the
        solving degree, d0=2 AND ds ≤ 4 (= 2+δ with δ=2).
      random_model_justification: >-
        Rigorous: KR-IC-f5c584 supplies the first-fall floor under stated
        trace conditions. Classical: KR-IC-fbdb61 predicts solving degree can
        separate from semi-regular models; whether the gap stays ≤δ at these
        toys is the transfer hypothesis under test. KR-IC-889857's
        subexponential reading is explicitly NOT claimed.
      supporting_results:
        - KR-IC-f5c584
        - KR-IC-fbdb61
      validation_experiment_ids: []
      falsification_condition: >-
        d0 ≠ 2 on the frozen cell, OR ds > 4, OR a matched-size random
        quadratic system shows the same (d0, ds) pair (trace-forced signal
        is artifactual).

  predictions:
    - metric: first_fall_degree_S3_descent
      direction: equal
      minimum_effect: '= 2 at each toy cell'
    - metric: solving_degree_S3_descent
      direction: upper_bounded
      minimum_effect: '≤ 4 (=2+δ) at each toy cell'
    - metric: random_quadratic_control_gap
      direction: differ
      minimum_effect: 'control (d0,ds) ≠ treatment (d0,ds)'

  minimal_test: >-
    Stage 0: freeze (n,ℓ,V), modulus, degree-oracle definition, seeds.
    Stage 1: n=17, ℓ∈{3,4}, report d0, ds, artifact hashes. Stage 2: n=19,23
    + random quadratic null of matched size. Budget: ≤24 runs, ≤8 CPU-hours.
    Stop if degree oracle disagrees across two independent implementations.

  controls:
    - ctl_frozen_V_and_modulus
    - ctl_two_independent_degree_oracles
    - null_random_quadratic_matched_size
    - ctl_no_posthoc_delta_edit

  falsification_conditions:
    - Claiming KR-IC-889857 subexponential binary ECDLP from a toy degree gap.
    - Transferring toy (d0,ds) to n≥131 without a new contract.
    - Editing δ or V after seeing degrees.
    - Treating a timeout/OOM as evidence that ds is large (rule 3).

  target_complexity:
