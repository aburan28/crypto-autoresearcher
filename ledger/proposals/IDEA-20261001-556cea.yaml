idea:
  id: IDEA-20261001-556cea
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    DOES SOLVING DEGREE STAY NEAR FIRST-FALL DEGREE 2 FOR S_3 WEIL DESCENT AT
    TOY n? On binary toys n∈{17,19,23} with a frozen small V (dim ℓ∈{3,4}),
    measure first-fall degree and solving degree of the descended S_3 system
    and test whether solving_degree ∈ [2, 2+δ] for a pre-registered δ.

  class: heuristic_validation

  claim: >-
    KR-IC-f5c584 states the trace morphism forces a linear equation (first
    fall degree 2 for S_3); KR-IC-fbdb61 separates last-fall / solving degree
    from semi-regular predictions. CLAIM: at each toy n∈{17,19,23}, for a
    frozen V with dim ℓ∈{3,4}, the measured solving_degree of the Weil-
    descended S_3 system satisfies solving_degree ≤ 2+δ with δ=2 (i.e. ≤4)
    — OR solving_degree > 4 and the gap is recorded as large at this scale.
    CLAIM TIER: heuristic_validation. NO break. NO exponent. NO claim that
    first-fall assumptions yield subexponential binary ECDLP
    (KR-IC-889857 remains disputed). NO n≥131 transfer.

  mechanism: >-
    OBJECT FRAME. Representation: Semaev S_3 on x-coordinates with factor
    base {P : x(P)∈V}, Weil-restricted to F_2-equations (KR-IC-5a43e5 /
    KR-IC-73db3f as components). Operation set: Gröbner / degree-tracking
    elimination that reports first-fall and solving degree only — not a
    full PDP success campaign. Trichotomy: Class I partial-action (IC
    relation vector under FB translation) used as instrument, not as a new
    attack lens. Lossy-projection: degree meters discard solution content;
    null is a random quadratic system of matched size whose degrees should
    not inherit the trace-forced linear. OFF-LIMITS: asserting
    KR-IC-889857 subexponential binary ECDLP; SAT-PDP speedups as primary
    claim (KR-IC-5765d2). WHAT IS NEW: a pre-registered solving-vs-first-fall
    gap band at BINSTD toys.

  novelty_status: unverified
