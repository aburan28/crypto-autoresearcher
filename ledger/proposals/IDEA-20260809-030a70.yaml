idea:
  id: IDEA-20260809-030a70
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-EDDSA-9b8473
  goal_id: GOAL-EDDSA-001
  title: >-
    A cofactored/cofactorless separating triple whose producer controls only the
    public key, not the signing key
  class: mechanism
  claim: >-
    There exist (A, M, sig) triples accepted by the cofactored verification
    equation and rejected by the cofactorless one (or conversely) whose producer
    needs to control ONLY the public key A — no signing key for a target
    message, no interaction with any honest signer. The adversary-control class
    is the security-relevant quantity, and this record asserts that the weakest
    class in which a separation exists is "chooses A", not "holds the signing
    key". A separation reachable only by the key holder is a curiosity; one
    reachable by anyone who can register a public key is a protocol hazard for
    any system where different parties validate the same object.
  mechanism: >-
    The two equations differ by multiplication of both sides by the cofactor,
    which annihilates any torsion component. Adding a torsion point to A (or to
    R) leaves the cofactored equation invariant and generically breaks the
    cofactorless one. The construction therefore starts from any valid signature
    and perturbs a public value by a torsion element, which requires only the
    ability to publish the perturbed key.
  why_not_a_renamed_known_approach: >-
    That torsion perturbation separates the equations is standard. What is
    proposed here is the CLASSIFICATION discipline: every certificate carries a
    proof of the minimum control needed to produce it, and the certificate set
    is organized by that class rather than by which library disagrees with which.
  predictions:
  - observable: minimum adversary-control class over all separating triples found
    metric: one of {none, signature only, public key only, signing key}
    predicted: >-
      A separation exists in the "public key only" class. If the weakest
      achievable class is "signing key", the practical significance of the
      divergence is much lower and this record says so.
  - observable: whether the perturbed key remains a valid encoding
    metric: boolean, plus the count of torsion offsets preserving valid encoding
    predicted: All eight torsion offsets yield valid encodings; if some do not, the reachable class shrinks and that is recorded.
  minimal_test: >-
    Generate an honest key and signature. For each torsion offset, form the
    perturbed public key, evaluate both verification equations, and emit any
    triple whose verdicts differ as a certificate with the bytes. Re-verify with
    a second independent implementation, and record for each certificate exactly
    what its producer had to control.
  controls:
  - 'HONEST BASELINE: the unperturbed triple must verify under BOTH equations. If it does not, the implementation is wrong and no certificate is admissible.'
  - 'NULL OFFSET: the identity torsion element must produce no divergence, confirming the divergence is caused by the perturbation and not by the evaluation harness.'
  - 'PRIME-ORDER CONTROL: the same perturbation attempted with a random non-torsion offset must break both equations, isolating torsion as the mechanism.'
  falsification_conditions:
  - No torsion offset produces differing verdicts, which would mean the two equations agree on this class and the divergence must be sought elsewhere.
  - Every separating triple requires signing-key control, collapsing the reachability claim.
  interpretation_limits: >-
    A separation between two verification equations is not a forgery: no
    signature is produced for a message the key holder did not sign. Records
    must state the difference explicitly, since this is the exact point at which
    such results are routinely overstated.
  sota_delta: >-
    No attack. The delta is a certificate set indexed by adversary control,
    which is what a protocol designer needs and what a library-comparison table
    does not give.
  dominated_by: >-
    Not dominated by any corpus record. Externally dominated on breadth by
    published taxonomies; not dominated on the control-class axis, which is the
    axis this record adds.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for EdDSA/cofactor/torsion: no records. WEB NOT CHECKED.'
  source_refs:
  - RFC 8032 -- REQUIRED READ, NOT YET READ.
