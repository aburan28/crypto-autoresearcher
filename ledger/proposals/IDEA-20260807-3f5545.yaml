idea:
  id: IDEA-20260807-3f5545
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    COMPLETE-CLASS LEVEL-VECTOR STRATIFICATION: enumerate an entire toy
    F_p-isogeny class by j-sweep, label every curve with the FULL level vector
    (v_ell(f_E))_{ell | c} rather than a single depth, and decompose the variance
    of each frozen cost functional into level-vector, total-conductor, and
    residual components against a level-permutation null -- the design that can
    separate "the functional reads the ell it is defined at", "the functional
    reads the size of the order", and "the functional reads nothing"
  class: measurement

  claim: >-
    (A) THE OBJECT IS A VECTOR, NOT A NUMBER, AND THIS LANE HAS BEEN TREATING IT
    AS A NUMBER. A curve's position in the endomorphism-ring stratification of
    its isogeny class is the conductor f_E | c, equivalently the VECTOR
    v(E) = (v_ell(f_E))_{ell | c}. Distinct coordinates are INDEPENDENT: an
    ell_1-isogeny changes only the ell_1-coordinate, so a curve can be at the
    CRATER of the ell_1-volcano and at the FLOOR of the ell_2-volcano
    simultaneously. Every previous framing in this program that speaks of "the
    volcano level", "the crater", "the floor", or "a conductor step" -- including
    H-ECTD-19017a's vertical-step design and IDEA-20260805-38aebb's descending
    path -- implicitly projects the vector onto one coordinate or onto the single
    scalar f_E. THIS RECORD MEASURES THE VECTOR.

    (B) THE THREE COMPETING EXPLANATIONS, AND WHY THE VECTOR IS WHAT SEPARATES
    THEM. Suppose a cost functional C varies within an isogeny class. Then:
      (H_ell) C READS THE ell IT IS DEFINED AT. C is an ell-local quantity (for
        instance anything built on E[ell] or on rational ell-isogeny counts), so
        C depends on v_ell(f_E) and on NO OTHER COORDINATE. Signature: in a
        two-coordinate class, a main effect on coordinate ell and none on the
        other, and no interaction.
      (H_size) C READS THE SIZE OF THE ORDER. C depends on |disc(O_f)| = f^2|D_K|
        or on h(disc O_f), both monotone in the SCALAR f = prod ell^{v_ell(f_E)}.
        Signature: C correlates with log f, with the coordinates entering only
        through that sum, and with equal weight per unit of log ell.
      (H_0) C reads nothing about the endomorphism ring. Signature: variance
        explained by v(E) does not exceed the level-permutation null.
    These three are mutually exclusive and jointly exhaustive for functionals
    that depend on End(E) at all, and NO SINGLE-ell DESIGN CAN DISTINGUISH THEM.
    That is this record's reason to exist.

    (C) THE DESIGN. Fix p at toy scale. Enumerate the ENTIRE F_p-isogeny class of
    a chosen trace t: sweep every j in F_p, build a curve with that j, compute
    its trace, and keep both the curve and its quadratic twist when the trace
    matches +/- t. The class has size sum over f | c of h(f^2 D_K), which is
    Theta(sqrt(p)) up to log factors -- a few hundred to a few thousand curves at
    p ~ 2^12 to 2^14, i.e. FULLY ENUMERABLE. Label each curve with v(E) by
    counting rational ell-isogenies per ell | c (the instrument of
    IDEA-20260807-b1b604). Then measure every frozen L1 functional on every
    curve and run the variance decomposition.

    (D) WHAT MAKES THIS DIFFERENT FROM MEASURING VARIANCE. A within-class
    variance number is uninterpretable on its own: instance noise, factor-base
    sampling, and Groebner implementation jitter all contribute. The
    LEVEL-PERMUTATION NULL fixes this exactly: keep the measured C values, keep
    the class, and randomly permute the level-vector LABELS among the curves.
    Recompute the variance explained. The permutation distribution is the exact
    null for "levels carry no information", it requires no distributional
    assumption, and the observed R^2 must exceed its 95th percentile before any
    claim is made. This is cheap -- the expensive measurements are already done
    -- and it is the difference between a citable stratification and a number.

  resource_label: R3 (End(E) as a ring, via the conductor) and R4 (isogeny graph) as the STRATIFYING variable; R1 and R2 as the measured functionals
  admissibility: admissible
  admissibility_argument: >-
    The stratifying variable v(E) is curve-only data derived from the isogeny
    graph and the conductor, never from an action on G. The MEASURED quantities
    are restricted, by construction and by a blocking rule in required_metrics,
    to functionals that do NOT factor through the abstract triple (G, P, Q):
    Semaev/Groebner meters, factor-base decomposition yield, relation-collection
    cost, and curve-equation shape. Any functional that does factor through the
    triple -- rho cost, BSGS cost -- is measured ONLY as an instrument check and
    is required by IDEA-20260807-5cabfc to be constant across the class; a
    variation there is an implementation bug, and it may never be reported as a
    depth effect. With that restriction the proposal escapes H-ENDO-001 and
    KN-FIND-b7e091 for the same reason IDEA-20260807-cbe8c1 does: the measured
    data is field data, not group elements.

  discriminated_from:
    - >-
      DECOMPOSITION lane L1 / RQ-ICINV-475b5e. L1 asks whether C varies WITHIN a
      class at all, against a between-class and random-curve comparison. This
      record takes L1's measurement apparatus as given and asks a strictly finer
      question: IF it varies, does the variation align with the level vector, with
      the scalar conductor, or with neither. L1 is this record's dependency and
      the DECOMPOSITION says so ("L2 is conditional on L1"). If L1 reports zero
      within-class variance this record's decomposition is trivially H_0 and
      costs nothing further.
    - >-
      H-ECTD-19017a. That design compares meters across ONE large prime conductor
      step, sampling >= 8 independent steps, with a KS test against a horizontal
      baseline. It is a two-point comparison repeated. This record is a COMPLETE
      ENUMERATION of one class with a multi-coordinate label and a permutation
      null, at small ell rather than q >= 17. The two designs would not
      distinguish H_ell from H_size the same way: a KS test on ratios across one
      coordinate cannot see whether the effect is ell-local or size-driven.
    - >-
      IDEA-20260805-38aebb. That record derives an exact identity in the SCALAR
      conductor f and would be classified here as a prediction of pure H_size for
      endomorphism-supply functionals. This record supplies the empirical test
      that would distinguish H_size from H_ell for the R1 functionals 38aebb does
      not address.
    - >-
      IDEA-20260807-a2b59a, which is the DESIGNED factorial version of the same
      discrimination. This record is OBSERVATIONAL -- take the class as it comes
      and decompose -- and gets full coverage of the level lattice for free but
      unbalanced cell counts. a2b59a is BALANCED by construction but sees only
      four cells. They are complementary and the batch should run this one first
      because it reuses the enumeration.

  object_first_candidate:
    tracked_object: >-
      THE LEVEL VECTOR v(E) = (v_ell(f_E))_{ell | c}, an element of the divisor
      lattice of c, followed across the complete vertex set of one isogeny class.
    lossiness: >-
      LOSSY and demonstrably so: the fibre of v over any value has size
      h(f^2 D_K), which at toy scale is already in the dozens to hundreds. From
      v(E) one cannot recover j, cannot recover (a, b), cannot recover which
      crater vertex E is, and cannot recover anything about G. It is NOT a change
      of coordinates -- if it were, the fibres would be singletons and the whole
      permutation null would be degenerate. COMPATIBILITY: a single ell-isogeny
      changes v by at most +/- 1 in the ell-coordinate and by nothing else, so v
      propagates deterministically under the graph's edges. That is precisely the
      inventor-protocol section 2 requirement, and it is what makes v a tracked
      object rather than a bookkeeping label.
    propagation: >-
      Horizontal ell-edge: v unchanged. Descending ell-edge: v_ell increases by
      1. Ascending ell-edge: v_ell decreases by 1. Other coordinates never move.
      One-step propagation is therefore fully specified and directly measurable,
      which is the "concretely testable" axis of the inventor-protocol scoring.
    survival_score: >-
      Survives the whole class. Dies at the class boundary (v is undefined
      outside), and dies as an EXPLANATORY object the moment the permutation null
      is not beaten -- which is the honest failure condition and is expected.

  mechanism: >-
    STEP 1 -- CLASS SELECTION. Choose p ~ 2^12 to 2^14 and a trace t such that
    c = sqrt((t^2 - 4p)/D_K) has AT LEAST TWO distinct small prime factors, so
    v(E) has at least two coordinates and H_ell versus H_size is decidable.
    Record how many candidate traces had to be scanned to find one, because that
    density is itself a scoping number.
    STEP 2 -- COMPLETE ENUMERATION. For every j in F_p, construct a curve with
    that j (standard formulas; handle j = 0 and j = 1728 separately since they
    have extra twists), compute #E by the harness's point count, and keep the
    curve if its trace is t. Also keep the quadratic twist when its trace is t.
    Verify the total count equals sum_{f | c} h(f^2 D_K) computed independently
    by counting primitive reduced binary quadratic forms -- THIS IS A HARD GATE
    on the enumeration's completeness, and it is exactly the check
    IDEA-20260805-38aebb already machine-verified at 180 cells for the class
    number formula, so the two records cross-validate.
    STEP 3 -- LEVEL LABELLING. For each curve and each ell | c, count rational
    ell-isogenies (kernel factors of the ell-division polynomial, verified by
    Velu plus a trace check) and assign the level by Fouquet-Morain descent.
    Cross-check: the number of curves with a given v must equal h(f^2 D_K) for
    the corresponding f. A mismatch voids the labelling.
    STEP 4 -- MEASUREMENT. On every curve, with an IDENTICAL protocol: build the
    frozen factor base at the declared size, run the m = 3 Semaev decomposition
    measurement (harness/semaev.py), and record Groebner wall time, basis size,
    basis maximum total degree (a proxy, never the degree of regularity),
    decomposition yield over a fixed target set, and the curve-equation shape
    metrics of IDEA-20260807-a6fb2a.
    STEP 5 -- DECOMPOSITION AND NULL. Fit three nested models per functional:
    M0 (intercept only), M_size (intercept + log f), M_vec (intercept + one term
    per coordinate + pairwise interactions). Report R^2 and the nested F-style
    comparisons. Then run the level-permutation null 10^4 times and report the
    observed R^2's percentile in the permutation distribution FOR EVERY MODEL.
    No conclusion is drawn from a coefficient whose R^2 sits below the 95th
    percentile.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/ for "volcano", "level", "conductor", "stratif", "permutation",
      "variance". Read in full: DECOMPOSITION.md (L1 and L2 in particular),
      RQ-VOLC-f6253b, H-ECTD-19017a, EV-ECTD-14f9a2, IDEA-20260805-38aebb,
      IDEA-20260726-010, harness/semaev.py, harness/toycurve.py.
    results: >-
      The DECOMPOSITION's own L2 entry names this design in one sentence ("build
      the ell-volcano for small ell | f, classify each curve's level by counting
      rational ell-isogenies, and stratify every L1 measurement by level"), so
      the single-ell version of this record is the lane's assigned work rather
      than a discovery. NO record in ledger/ contains the words "level vector" or
      treats the conductor as a multi-coordinate object; "conductor" hits in
      ledger/ are all scalar-valued (H-ECTD-19017a's "prime conductor step",
      IDEA-20260805-38aebb's f, GOAL-ECTD-001's "large-conductor"). No
      permutation-null design appears anywhere in ledger/.
    verdict: >-
      ADAPTATION. Stratified measurement and permutation nulls are standard
      statistics; the single-ell stratification is the lane's own brief. The
      adaptation is (a) the vector framing, (b) the explicit H_ell / H_size / H_0
      trichotomy which the single-ell design cannot decide, and (c) the
      completeness gate tying the enumeration to the class-number sum.

  null_object_control: >-
    (N1) THE LEVEL-PERMUTATION NULL, primary and blocking: permute the v(E)
      labels among the enumerated curves 10^4 times, refit, and report the
      observed R^2's percentile. This is an EXACT null for "levels carry no
      information about C" and needs no distributional assumption.
    (N2) THE HEIGHT-ZERO CLASS: a second class at the same p with c = 1, so every
      curve has v = 0 and the class is a single crater. The measured spread of C
      there is the pure within-crater spread, and it is the correct baseline
      against which the between-level spread must be judged. If between-level
      spread does not exceed within-crater spread, depth explains nothing even if
      the permutation test passes on a technicality.
    (N3) MATCHED RANDOM CURVES at the same p from OTHER classes, size-matched to
      the enumerated class. This is DECOMPOSITION L1's between-class comparison,
      reused here to check that the class's own spread is not simply the generic
      curve-to-curve spread.
    (N4) FIXED CURVE, RESAMPLED FACTOR-BASE SEED and RESAMPLED k: the instrument
      noise floor. Every effect size is reported in units of this floor.
    DECAY PARAMETER: the number of levels, i.e. the height vector
    (v_ell(c))_{ell}. Any level effect must be identically zero when every
    v_ell(c) = 0 (N2), and its explained variance must grow no faster than the
    number of distinct v values available. A quantity whose explained variance is
    the same in N2 as in the treatment class is the canonical artifact tell.

  assumptions:
    - >-
      Kohel's stratification, so that "level" is well defined and the class
      partitions by conductor. RECALLED, UNVERIFIED (KN-LIT-360, not read);
      checked by the class-count gate in Step 2.
    - >-
      The class-number formula h(f^2 D_K) = h(D_K) f (w_f/w_1) prod_{l|f}
      (1 - (D_K/l)/l), used only as the COMPLETENESS GATE. Machine-checked at 180
      cells in IDEA-20260805-38aebb by direct primitive-reduced-form counting;
      this record reuses that verified predicate rather than re-deriving it, and
      re-runs it as a fixture.
    - >-
      At p ~ 2^12 to 2^14 the class has Theta(sqrt(p)) curves and each Semaev
      measurement takes seconds, so the full sweep is hours, not days. If the
      class turns out larger than budget, curves are SUBSAMPLED UNIFORMLY WITHIN
      EACH LEVEL and the subsampling is reported, never quietly applied.
    - >-
      Groebner metrics are implementation-bound proxies per harness/semaev.py's
      own docstring and are interpreted only as trends.
    - >-
      Twists: E and its quadratic twist have traces t and -t and are in DIFFERENT
      classes. The enumeration must not mix them, and the check is that every
      retained curve has trace exactly t.

  proof_search_map:
    not_applicable_reason: >-
      Purely empirical. This record proves nothing, states no asymptotic bound,
      and constructs no certificate family; it measures a stratification and
      reports a variance decomposition against an exact permutation null. The
      one derived statement it relies on -- Kohel's stratification -- is
      inherited from IDEA-20260807-5cabfc and IDEA-20260807-b1b604, which carry
      the corresponding proof obligations. If the decomposition produced a
      positive that survived every null, THAT would motivate a proof-oriented
      successor record, and this record explicitly does not pre-empt it.

  predictions:
    - metric: >-
        enumerated class size versus sum_{f | c} h(f^2 D_K)
      direction: different
      minimum_effect: >-
        EXACT EQUALITY. This is a completeness gate, not a statistic. A mismatch
        halts the line, because an incomplete enumeration silently biases every
        level's cell count and hence every variance estimate.
    - metric: >-
        R^2 of the level-vector model M_vec for the Groebner wall time, versus
        the 95th percentile of the level-permutation null
      direction: different
      minimum_effect: >-
        PREDICTED H_0: observed R^2 below the 95th percentile, i.e. no
        level-vector effect. The DECOMPOSITION's own section 5 records the same
        prediction ("L2 is expected to show no effect stratified by volcano
        level"). Exceeding the 99th percentile, reproducibly across two
        independent classes, is the positive and would require independent review.
    - metric: >-
        model comparison M_vec versus M_size for any functional whose R^2 clears
        the permutation null
      direction: different
      minimum_effect: >-
        THE PRE-REGISTERED TRICHOTOMY. H_ell requires M_vec to beat M_size with a
        coefficient concentrated on ONE coordinate and the others within noise of
        zero. H_size requires M_size to be statistically indistinguishable from
        M_vec, with coordinate coefficients proportional to log ell. H_0 requires
        neither to clear N1. A pattern matching none of the three is INCONCLUSIVE
        by prior agreement.
    - metric: >-
        decomposition yield (relations per target attempted) as a function of v(E)
      direction: different
      minimum_effect: >-
        PREDICTED EXACTLY ZERO DEPENDENCE, because yield depends on N and factor-
        base size only, both class-fixed. The DECOMPOSITION section 5 makes the
        same prediction for L1. A yield dependence on v would be the single most
        surprising result available here and would indicate the factor-base
        construction is level-correlated -- an artifact to hunt before a finding
        to claim.
    - metric: >-
        matched rho and BSGS operation counts as a function of v(E)
      direction: different
      minimum_effect: >-
        ZERO dependence, required by IDEA-20260807-5cabfc. Used as an INSTRUMENT
        CHECK: a dependence here means the pipeline is leaking level information
        into a triple-factoring functional, which is impossible mathematically and
        therefore diagnostic of a bug. Nonzero result voids the run set.

  minimal_test:
    design: >-
      STAGE 1 (hours): class selection arithmetic; find a t with c having two
      distinct small prime factors at p ~ 2^12. Pure integers.
      STAGE 2 (hours, HARD GATE): complete j-sweep enumeration; class-count gate
      against the class-number sum.
      STAGE 3 (hours): level labelling with the per-level count cross-check.
      STAGE 4 (hours to days): the Semaev sweep over every enumerated curve,
      plus N2, N3, N4.
      STAGE 5 (minutes): variance decomposition and the permutation null.
      STAGE 6 (zero compute): the H_ell / H_size / H_0 verdict, with the
      instrument-check results reported alongside.
    controls:
      - level-permutation null, 10^4 permutations (N1, blocking)
      - height-zero class with c = 1 (N2)
      - matched random curves from other classes (N3)
      - fixed curve with resampled factor-base seed and resampled k (N4)
      - matched rho and BSGS as an instrument check that must show no effect
      - class-count gate against sum_{f|c} h(f^2 D_K)
    required_metrics:
      - v(E) per curve, with the per-level counts against h(f^2 D_K)
      - Groebner wall time, basis size, basis max total degree, per curve
      - decomposition yield per curve over a fixed target set
      - R^2 of M0, M_size, M_vec per functional, with permutation percentiles
      - within-crater spread (N2) and between-class spread (N3)
      - instrument noise floor (N4)
      - RESOURCE LABEL of every measured functional, stated explicitly; a
        triple-factoring functional may appear only under "instrument check"

  falsification_conditions:
    - >-
      Enumerated class size differs from sum_{f | c} h(f^2 D_K). The enumeration
      is incomplete or the level labelling is wrong; the line halts and nothing
      is reported.
    - >-
      Per-level counts differ from h(f^2 D_K). The labelling instrument is
      broken; every stratified statistic is void.
    - >-
      Matched rho or BSGS shows a level dependence. Mathematically impossible by
      IDEA-20260807-5cabfc, therefore diagnostic of a pipeline leak; the run set
      is INVALID rather than positive.
    - >-
      M_vec's R^2 fails to clear the permutation null for every functional. That
      is the PREDICTED outcome and it is a controlled null: "the frozen cost
      functionals of this program do not resolve the endomorphism-ring
      stratification of an isogeny class at toy scale, with achieved power X".
      The achieved power must be reported or the null is uninformative.
    - >-
      Groebner runs exceed budget before the class is covered. Infrastructure
      outcome under AGENTS.md rule 5; report coverage achieved, never a null.

  confounders:
    - >-
      UNBALANCED CELLS. Level counts follow h(f^2 D_K), which grows roughly like
      f, so deep levels have MANY more curves than the crater. An unweighted
      variance decomposition will be dominated by the deep levels. Weighting must
      be declared before the fit and the same weighting used in the permutation
      null.
    - >-
      j = 0 and j = 1728 have extra automorphisms and extra twists, changing both
      the enumeration bookkeeping and the Semaev system's symmetry. They must be
      flagged and the decomposition reported both with and without them.
    - >-
      FACTOR-BASE SAMPLING correlates with the curve, since the base is built
      from on-curve x-coordinates. A base drawn by the same seed on two curves is
      not the same set. N4 measures this and every effect is in units of it.
    - >-
      Selecting a class for "c has two small prime factors" selects on D, hence
      possibly on |D_K| and on h. The N3 control at matched p and the report of
      the selection density are what keep this visible.
    - >-
      Multiple testing: three models times several functionals. The permutation
      percentile must be reported per test and the family-wise criterion declared
      in advance.

  interpretation_limits:
    - >-
      Toy scale, one or two classes, p <= 2^14, m = 3. A null here closes exactly
      "these functionals, at this scale, in this class" and nothing wider.
    - >-
      The functionals are implementation-bound proxies. A null could mean the
      proxies are blind rather than that depth is inert, which is why N2 and N4
      (which measure the instrument's own resolution) are mandatory.
    - >-
      A positive would be a within-class VARIANCE result, not an attack. Turning
      it into an attack requires the reachability gate below, and the record does
      not assume it.
    - >-
      Nothing here bears on H-ECTD-19017a, which measures a different ell regime
      with a different statistic; neither record's outcome predicts the other's.

  reachability_gate: >-
    THIS PROPOSAL DOES NOT MOVE BETWEEN CURVES TO ATTACK -- it enumerates them
    exhaustively, which is possible only because the class has Theta(sqrt(p))
    vertices at toy scale and is FLATLY IMPOSSIBLE at crypto scale, where the
    class has ~ 2^128 vertices for a 256-bit p. That asymmetry is the scope limit
    and it is stated here, not buried. CONDITIONALLY ON A POSITIVE: if the
    variance aligns with the LEVEL VECTOR (H_ell), the good curves are reachable,
    because IDEA-20260807-bb03d3 shows any target level vector below the
    smoothness bound B is reachable in O(B^2 log^2 p) with no factoring, and the
    level is locally detectable in one step by isogeny counting. If instead the
    variance is residual -- attached to individual curves rather than to v --
    then goodness has only a global address, the crater is a Cl(O)-torsor, and
    the lane dies on the T5 cost even though the variance is real. THE
    DECOMPOSITION'S REACHABILITY DICHOTOMY IS THEREFORE DECIDED BY WHICH TERM OF
    THIS RECORD'S VARIANCE DECOMPOSITION IS LARGE, which is the strongest reason
    to run it early.

  target_complexity:
    time_exponent: >-
      NO ATTACK, NO EXPONENT CLAIMED. Cost of the measurement itself: the j-sweep
      is O(p) curve constructions each costing O(p) for the naive point count or
      O(sqrt p) for the Hasse search, so O(p^{1.5}) field operations at worst --
      about 2^18 to 2^21 operations at p ~ 2^12 to 2^14, which is minutes to
      hours in pure Python. The Semaev sweep is Theta(sqrt(p)) Groebner solves.
    memory_exponent: >-
      O(sqrt(p)) curves stored with their labels and metrics. Negligible. The
      Groebner step's own peak memory is the binding constraint per cell and is
      recorded.
    best_known: >-
      As an attack, everything: rho at 0.886 sqrt(N) with O(1) memory
      (KN-TECH-001, KN-TECH-006), BSGS at 2 sqrt(N)/sqrt(N) (KN-TECH-031),
      automorphism-discounted rho on CM curves (KN-TECH-018). As a MEASUREMENT of
      within-class variance, the incumbent is DECOMPOSITION lane L1's design,
      which this record refines rather than replaces.
    hidden_overhead: >-
      Disclosed: (i) complete enumeration is a toy-scale-only luxury and does not
      generalize; (ii) unbalanced cells mean the effective sample size at the
      crater is h(D_K), which can be as small as 1 and must be checked before any
      crater-versus-floor claim; (iii) the permutation null is exact for the
      labels but not for factor-base sampling, which N4 handles separately.
    tradeoff_note: >-
      Not applicable; no algorithm produced. The one tradeoff worth recording is
      statistical: complete enumeration maximizes coverage of the level lattice
      at the cost of unbalanced cells, whereas IDEA-20260807-a2b59a's factorial
      design balances cells at the cost of covering only four.

  dominated_by: >-
    AS AN ATTACK: mounts none, dominated on every axis by every row of the
    frontier -- parallel rho at 0.886 sqrt(N) time and O(1) memory (KN-TECH-001,
    KN-TECH-006), automorphism-discounted rho (KN-TECH-018), BSGS at 2 sqrt(N)
    time and sqrt(N) memory (KN-TECH-031), toy Semaev index calculus recorded
    tight at toy scale (KN-FIND-f8c290). Checked across time, memory and
    data/queries.
    AS A MEASUREMENT DESIGN: dominated by H-ECTD-19017a/EXP-ECTD-9e4248 on SCALE
    (that contract runs at N in [40, 60] bits; this runs at p <= 2^14) and on
    maturity (that contract is frozen and approved; this is a proposal). It
    dominates that design on RESOLUTION: complete enumeration with a
    multi-coordinate label and an exact permutation null distinguishes H_ell from
    H_size, which a two-point ratio test cannot.
  sota_delta: >-
    Zero speedup against any attack baseline, expected and not a defect. Stated
    quantitatively as a measurement delta: converts a single scalar "is there
    within-class variance" into a three-model decomposition with an exact
    permutation p-value per functional, over a COMPLETE class of Theta(sqrt(p))
    curves rather than a sample of 8 conductor steps, at a cost of Theta(sqrt(p))
    Groebner solves plus 10^4 permutation refits (seconds).

  estimated_cost:
    implementation: medium
    compute: high
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that the enumeration and the class-count gate succeed -- it is
    bookkeeping against a formula already machine-checked at 180 cells in
    IDEA-20260805-38aebb. 0.75 that level labelling is correct once the Velu
    instrument exists. 0.15 that M_vec clears the permutation null for any
    functional, which is the campaign's own pre-registered expectation
    (DECOMPOSITION section 5, item 2). The value is therefore mostly in the
