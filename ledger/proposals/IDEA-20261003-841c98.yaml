# IDEA-20261003-841c98
# Window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-841c98
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A width-2 window table stores 2 entries and a width-1 table stores 1
  class: representation
  claim: >-
    A window of width 2 stores 2 precomputed entries. A window of
    width 1 stores 1. Two exceeds one by 1. The product of the two
    table sizes is 2. Their sum is 3. The gap is a table size, not
    an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    2 minus 1 is 2. Two to the power 1 minus 1 is 1. Two width-1
    tables both store 1, so that gap is 0. No curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic-group lower bound is a different object from a table size.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 1.
    baseline_embedding:
      parameter_slice: The widths 2 and 1 and the sizes 2 and 1.
      reproduction_check: >-
        Two readers must agree that 2 to the power 1 is 2 and that
        2 to the power 0 is 1.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 1 drops the gap. Two width-1
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-1 table.
        predicted_gain: One fewer stored entry. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 2 and 1. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-1 tables. Both store 1, and the gap is 0.
    proof_obligations:
      - claim: The width-2 table stores 2 entries.
        responsibility: size
      - claim: The width-1 table stores 1 entry.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Two exceeds one by 1.
  minimal_test:
    design: >-
      Compute 2 to the power 1 and 2 to the power 0. Do not add a
      curve point.
    controls:
      - Two width-1 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-2 table size is not 2.
    - The product of the two sizes is not 2.
  confounders:
    - Storing both signs of an entry is an extra convention, not a second window width.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-2 table has size 2 to the power 1, and the
        frozen width-1 table has size 2 to the power 0.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Two stored entries versus one, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 2 and 1 and claims
          no precomputation attack.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The generic-group bound counts group operations in a
          walk. This record counts two table sizes and claims no walk.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 2 versus 1
    data_queries: Two frozen widths.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
