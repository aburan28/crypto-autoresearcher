idea:
  id: IDEA-20260921-1ec106
  id_allocation_provenance: >-
    Minted by the top-level coordinator session with `python3
    tools/allocate_id.py --next idea --date 20260921` and confirmed free with
    `--check` on 2026-09-21. Authored under the idea-generator role contract
    in the coordinator session (role-runtime outage: the idea-generator
    subagent fails its AWS DescribeInstances bootstrap, seven consecutive
    role-agent failures today, recorded in DEC-20260921-4d1b40); runtime
    substitution recorded here per the interchangeable-runtimes clause.
  proposed_by: idea-generator
  proposed_at: '2026-09-21'
  question_id: RQ-CRYPTO-001
  goal_id: GOAL-CRYPTO-001
  added: '2026-09-21'
  status: proposed
  title: >-
    THE DIGIT-CHARACTER FAMILY IS THE ONE NATURAL CANDIDATE THE CENSUS NEVER
    MEASURED FOR (lambda, PGL_2-stability): the Thue-Morse and Rudin-Shapiro
    signs of the coordinate's integer lift are already on file
    (IDEA-20260902-c17bf6, EXP-ECDLP-56ee42) with their LOG-COORDINATE
    advantages A(v) measured, but their F_p-additive spectral exponents
    lambda and their PGL_2 battery readings were never taken -- and the
    level set of a balanced character t has l1*(v_t) = ||that||_1^*/(2|A|)
    exactly under the canonical probability normalisation (v_t = 1_A/|A| =
    (1+t)/(2|A|) has vhat(k) = that(k)/(2|A|) for every k != 0),
    so ONE cheap census-harness extension measures both, settles the
    adjudication's open R03-construction question (DEC-20260921-8e8086),
    and either fills the empty stable-and-above-random cell of the census
    table with the first NON-SET natural statistic or extends the scoped
    negative over the character family with the construction question
    closed.
  class: measurement
  claim: >-
    REPRESENTATION CLASS AND ATTACK STAGE (one clause, per
    docs/object-frame-ideation.md section 4): class R1 of
    RQ-ECDLP-623a32 (the coordinate's integer lift, post-processed by a
    bounded digit character), attack stage COLLISION STRUCTURE (the
    a5757d merge keyed on the statistic's fibres). CLAIM: for the
    Thue-Morse character t(x) = (-1)^{s_2(x)} and the Rudin-Shapiro
    character r(x) = (-1)^{u(x)} (s_2 the binary digit sum, u the count
    of 11 blocks), the pair (lambda, PGL_2-stability) of their level sets
    v_t = 1_{{t=+1}}/|A| and v_r = 1_{{r=+1}}/|A| is measurable by one
    extension of the RUN-ECDLP-8e13c2 harness at toy-to-medium cost, and
    the measurement decides the first row of the synthetic-statistic
    table: the characters are (a) stable-and-above-random -- the first
    natural inhabitant of the cell the census found empty, naming the
    successor construction -- or (b) unstable like every structured
    additive row, or (c) stable-but-flat like the cosets, in which case
    the census's scoped negative extends over the character family and
    DEC-20260921-8e8086's open R03-construction item closes with the
    0.39 reproduction attributed to the level-indicator construction.
  mechanism: >-
    PAIR AND OPERATION SET: the tracked object is the fibre statistic of
    the character's level set under the a5757d one-step additive
    branching operation -- a BRANCHING object (trichotomy per
    IDEA-20260806-c5d183: the discard of everything but the sign is not
    compatible with any deterministic sub-action of translation), R1
    representation, canonical probability normalisation fixed by
    DEC-20260921-8e8086. THE IDENTITIES THAT MAKE ONE RUN ANSWER BOTH
    QUESTIONS: for a character t with level set A = {t = +1}, the
    probability-normalised level indicator v_t = 1_A/|A| = (1+t)/(2|A|)
    satisfies vhat(0) = 1 and vhat(k) = that(k)/(2|A|) for every k != 0
    (the constant term's transform vanishes off k = 0, so no balance
    assumption is needed), so l1*(v_t) = ||that||_1^*/(2|A|) EXACTLY --
    the level-set census cell IS the character's spectral norm up to the
    recorded factor 2|A|, no second construction needed; balance (mean
    near 0) enters only through |A| = (p + that(0))/2 ~ p/2, which keeps
    lambda(v_t) on the census's probability-normalised scale.
    The stability battery is the census's frozen-hash Moebius composition.
    The characters are 2-adically structured (digit positions), which is
    additive-embedding structure of exactly the kind that made the
    popcount level PGL_2-unstable (0.4191 with Moebius deviation), so the
    PRIOR is (b) unstable; the LIVE outcome is (a): Rudin-Shapiro in
    particular has growth-free autocorrelation by construction (its
    defining property is bounded partial sums of the block-count), and a
    character whose coefficient mass avoids concentration may sit flat
    while Thue-Morse -- whose spectral mass concentrates at powers of two
    (known for the integer Thue-Morse sequence) -- may sit above random
    level BEFORE its Moebius image collapses it; the two characters
    bracket the tradeoff.
  novelty_status: unverified
  citations:
    -
      ref: IDEA-20260902-c17bf6
      provenance: internal
      claim: >-
        The Thue-Morse and Rudin-Shapiro signs of the coordinate's
        integer lift are cheap, essentially balanced digit statistics;
        the idea's own measured quantity is the log-coordinate advantage
        A(v), NOT the F_p-additive spectral exponent or PGL_2 stability.
      verified_by: "coordinator session, read of the record's claim block on 2026-09-21"
    -
      ref: EXP-ECDLP-56ee42
      provenance: internal
      claim: >-
        Exact DL-coordinate advantages (A(v) and q_maj - 1/2) for the
        balanced Thue-Morse and Rudin-Shapiro digit signs; the
        F_p-additive lambda and the Moebius battery are absent from its
        title and scope.
      verified_by: "coordinator session, read of the specification title and runs listing on 2026-09-21"
    -
      ref: EV-ECDLP-81f4d4
      provenance: internal
      claim: >-
        The census table: structured additive rows PGL_2-unstable
        (popcount level 0.4191 with Moebius deviation), coset rows
        stable at the random level 0.50; no natural statistic is
        simultaneously stable and above random.
      verified_by: "coordinator session, authored and reviewed the record on 2026-09-21"
    -
      ref: DEC-20260921-8e8086
      provenance: internal
      claim: >-
        The R03 reproduction construction is open: mode-level indicator
        (measured 0.4191 marginal) vs Thue-Morse/unimodular (unmeasured);
        the probability normalisation is canonical.
      verified_by: "coordinator session, authored the ruling on 2026-09-21"
    -
      ref: RUN-ECDLP-ccf8f0
      provenance: internal
      claim: >-
        The extension-run pattern (dedicated ladder, convention-free
        decision quantity, controls, checker) executes cheaply in the
        census harness; R07 was decided in 55 cells.
      verified_by: "coordinator session, executed the run on 2026-09-21"
  assumptions:
    - >-
      OFF-LIMITS COMPONENT, NAMED: serves F1/F2-adjacent keyed-merge
      constructions; what is added is the first (lambda, stability) row
      for a NON-SET natural statistic family and the closure of the
      adjudication's open construction question.
  proof_search_map:
    not_applicable_reason: >-
      Measurement, not a theorem: the audits that transfer are the
      census's own -- reproduction anchor (C02 Parseval level, C01 exact
      zero), PGL_2 battery, dual-precision/naive-DFT checker spot
      rederivations -- all already implemented and reusable verbatim.
  predictions:
    -
      metric: lambda(Thue-Morse level set)
      direction: different
      minimum_effect: >-
        EITHER above the random level by > 2SE (a live band inhabitant
        candidate, immediately Moebius-tested) OR at/below it; the
        integer Thue-Morse sequence's known spectral concentration at
        powers of two motivates the above-random prior.
    -
      metric: lambda(Rudin-Shapiro level set)
      direction: lower
      minimum_effect: >-
        At the random level within 2SE (its bounded-partial-sums property
        suppresses concentration); the bracket against Thue-Morse is the
        discriminating structure of the measurement.
    -
      metric: PGL_2 battery on both
      direction: different
      minimum_effect: >-
        Deviation beyond 2SE on either character extends the census's
        instability finding over the character family and closes the
        construction question in outcome (b).
  minimal_test:
    design: >-
      One census-harness extension run (the RUN-ECDLP-ccf8f0 pattern):
      frozen ladder of at least 10 primes 2^12..2^24, rows v_t, v_r,
      their frozen-hash Moebius variants, C01/C02A/C02B controls, the
      census checker battery, and the R03-construction closure recorded
      either way.
    controls:
      - C01 exact zero and C02 Parseval band (harness verbatim)
      - the level-set/character identity checked numerically at one prime
        (l1*(v_t) = ||that||_1^*/(2|A|) to 1e-9 relative, |A| the level
        set's size at that prime)
      - PGL_2 battery with the frozen hash stream
    required_metrics:
      - fitted lambda per character with SE, two-ladder and jackknife
      - Moebius deviation beyond 2SE per character
      - the construction-closure statement for DEC-20260921-8e8086
  falsification_conditions:
    - >-
      Both characters read stable-and-flat (outcome (c)): the scoped
      negative extends over the character family; the 0.39 reproduction
      is attributed to the level-indicator construction and the open item
      closes negative.
    - >-
      Either character reads above-random AND Moebius-stable (outcome
      (a)): the census negative's scope is broken by the first non-set
      natural statistic and the successor construction step is named --
      recorded as the primary positive outcome, replicate before any use.
    - >-
      Control failure voids the run (infrastructure, never evidence).
  confounders:
    - the level-set/character identity is exact for every k != 0 without
      a balance assumption; balance enters only through the factor
      |A| = (p + that(0))/2 ~ p/2, recorded per prime in the run
    - >-
      integer-lift dependence: >-
      the characters depend on the canonical
      lift x in [0, p), which is itself an embedding choice -- the
      PGL_2 battery is exactly the test of whether that dependence is
      load-bearing
    - >-
      finite-ladder curvature in slowly-growing quantities (the census's
      interval lesson: 0.0806 at the measured range trending to 0)
  interpretation_limits:
    - >-
      Toy/medium ladder only; gates are necessary-not-sufficient; any
      positive outcome is a MEASUREMENT pending replication and the owed
      independent review, not an attack claim.
    - >-
      KN-OPEN-020 CLASS, DECLARED: not a factor-base proposal; the
      attack stage touched is collision-structure keying only.
  heuristic_assumptions:
    -
      id: H1
      statement: >-
        LADDER EXTRAPOLATION (the census's HEUR-1 verbatim): log l1* is
        linear in log p over the frozen ladder within residual order
        O(1/log p).
      rigorous_support: >-
        Exact per-point computation; the two-spacing ladder and jackknife
        guards, validated across the census's 406 cells and both
        extensions.
      validation_plan: >-
        The harness's existing two-ladder agreement and jackknife checks,
        run verbatim on the new rows.
  target_complexity:
    time_exponent: >-
      O~(p) per cell by the existing chirp-z; the full run is minutes to
      an hour of single-core time. No attack exponent claimed.
    memory_exponent: O(p) words per prime, within the 8 GiB cap at the
      measured ladder.
    best_known: >-
      The census's random-set level 0.5 (C02A 0.4996) is the comparison;
      rho n^{1/2} is the attack reference the lane prices.
    hidden_overhead: none beyond the census harness's known costs.
    tradeoff_note: flat parallelism per cell.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
