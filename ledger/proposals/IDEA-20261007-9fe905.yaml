idea:
  id: IDEA-20261007-9fe905
  question_id: RQ-VOLC-f6253b
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Point counts of a curve and its quadratic twist over F_67 sum to 136
  class: control
  claim: >-
    Let E be y^2 = x^3 + 5x + 1 over F_67. Let c be the least
    nonnegative quadratic nonresidue modulo 67. Let E_t be
    y^2 = c(x^3 + 5x + 1) over F_67. If either model is singular, the
    run is an invalid setup. Otherwise the sum of the two F_67-point
    counts, each including the point at infinity, equals 2*(67+1) = 136.
    A sum other than 136 is a negative. This is not a claim that the
    absolute difference of the counts is 92, and the prime is not 23.
    No discrete logarithm is computed, and the generic-group exponent
    1/2 is unchanged.
  mechanism: >-
    PAIR (representation, Sigma): the representation is the pair of
    short-Weierstrass models (E, E_t) related by multiplication of the
    right-hand side by a fixed nonsquare c. Sigma is quadratic twist,
    not an isogeny and not translation. The trace of E_t is the
    negative of the trace of E, so the point counts are p+1-t and
    p+1+t and their sum is 2(p+1). The projection keeps only that sum
    and discards t. Explanation A: the sum is 136, so the two traces
    are negatives and the curves sit on opposite traces rather than on
    one volcano. Explanation B: the sum is not 136, so the twist
    relation failed on this model or the point counter disagrees. No
    isogeny walk and no rho walk are run.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-755e35
      provenance: internal
      claim: >-
        Curves are isogenous over a finite field if and only if they
        have the same number of points. A quadratic twist with nonzero
        trace is not that relation. This idea predicts a sum, not
        equality of the two counts.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-755e35.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs a square-root number of group
        operations. This idea does not beat that bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: RQ-VOLC-f6253b
      provenance: internal
      claim: >-
        The question asks whether endomorphism-ring depth in an
        ell-isogeny volcano changes any measurable ECDLP attack cost.
      verified_by: ledger/questions/RQ-VOLC-f6253b.yaml
  assumptions:
    - c is a nonsquare, chosen as the least nonnegative quadratic nonresidue modulo 67. A square c makes E_t isomorphic to E and invalidates the twist arm.
    - Both models are nonsingular. A zero discriminant is an invalid setup, not the negative.
    - Point counts include the point at infinity exactly once each.
  predictions:
    - metric: sum of the F_67-point counts of E and E_t
      direction: different
      minimum_effect: exactly 136
  minimal_test:
    design: >-
      Over F_67, find the least nonnegative nonsquare c. Build E and
      E_t. Refuse the run if either discriminant is 0 or if c is a
      square. Count points on each model, including infinity, and add
      the two integers. Do not walk an isogeny graph and do not run
      Pollard rho.
    controls:
      - The Legendre symbol of c is -1. Otherwise the twist arm is invalid.
      - Infinity is included once in each count.
      - The same prime is used for both models.
    required_metrics:
      - point_count_E
      - point_count_twist
      - count_sum
      - nonsquare_c
  falsification_conditions:
    - Both models are nonsingular, c is a nonsquare, and count_sum is not 136.
  confounders:
    - Omitting infinity on one model shifts the sum by 1. The metric includes infinity.
    - Using a square c compares a curve to an isomorphic copy. That is not this claim.
  interpretation_limits:
    - A sum of 136 does not say the two curves lie on one volcano, and it does not change an attack cost.
    - The absolute difference of the counts is 2|t|, which is not fixed at 92 in this claim.
    - The test is this one pair at p = 67 only.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a nonsingular short-Weierstrass model over F_p and a
        quadratic nonresidue c, the quadratic twist has trace equal to
        the negative of the original trace. The sum of the point counts
        is therefore 2(p+1). At p = 67 that sum is 136.
      rigorous_support: >-
        The trace-negation rule for quadratic twists is the relation
        this idea imitates. KR-RHO-755e35, opened, states that isogenous
        curves share a point count. It does not state this sum. No
        textbook page was opened for the twist rule in this session.
      validation_plan: >-
        At this single pair, record both point counts and their sum.
        If the sum is not 136 while both models are nonsingular and c
        is a nonsquare, H1 is false at p = 67. No second prime is claimed.
  target_complexity:
    time_exponent: >-
      Two point counts at one prime p = 67. The generic-group exponent
      1/2 is unchanged.
    memory_exponent: O(1) field elements
    best_known: >-
      KR-RHO-13bf67, opened, gives the square-root generic bound.
      KR-RHO-755e35, opened, equates point counts across an isogeny
      class. This sum beats neither.
    hidden_overhead: >-
      No o(1) term. The test is two models at p = 67.
    tradeoff_note: >-
      No time-memory tradeoff. Each count is exhaustive.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-RHO-0528e7
    nearest:
      - ref: KR-RHO-755e35
        provenance: internal
        relation: adjacent
        delta: >-
          The opened row equates point counts of isogenous curves.
          This idea predicts the sum 136 for one curve and its
          quadratic twist at p = 67, which is a different relation,
          and does not change the exponent.
  dominated_by: >-
    The isogeny invariance in KR-RHO-755e35 dominates any reading of
    this sum as a way to move to a weaker curve. Pollard rho, at the
    square-root exponent in KR-RHO-13bf67, dominates the same reading.
    The sum does not beat either baseline.
  sota_delta: >-
    No exponent is derived. The quantitative delta is the integer
    count_sum, predicted 136, at the prime 67. The generic-group
    exponent stays 1/2.
