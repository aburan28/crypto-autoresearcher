  dominated_by: >-
    Compared with the opened notes KN-TECH-024 and KN-LIT-078:
    path-finding stays Õ(p^{1/4}) on the F_p subgraph and Õ(p^{1/2})
    on the full graph. This measurement scans at most 126 curves and
    returns two j-invariants. It does not beat those baselines on
