idea:
  id: IDEA-20261007-ccbc3d
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    The first two supersingular models y^2 = x^3 + a x + 1 over F_127
    have distinct j-invariants.
  class: measurement
  claim: >-
    Let p = 127. For a in 1..126, let E_a be y^2 = x^3 + a x + 1 over
    F_127, and skip a when 4 a^3 + 27 = 0. Call a supersingular when
    #E_a(F_127) = 128. Let a1 be the smallest such a and a2 the next.
    The claim is j(E_a1) ≠ j(E_a2) in F_127. This compares two
    j-invariants of two models. It does not count the supersingular
    j-invariants of the field, it does not compute a self-isogeny
    degree, and the exponent delta against the opened Õ(p^{1/4})
    baseline is 0.
  mechanism: >-
    Equal j means the first two passing coefficients are isomorphic
    over the algebraic closure, up to the j-invariant. Unequal j means
    the coefficient scan met two isomorphism classes before it met a
    repeat. Either outcome is a pair of field elements. Neither
    outcome is a walk.
    OBJECT FRAME. Representation: the coefficient a together with the
    j-invariant of E_a. Operation set Sigma: the trace test on E_a,
    not translation. TRICHOTOMY: coordinate-dependent. Reason: a is a
    coordinate of the model, and j is a function of that model.
    LOSSY-PROJECTION TEST against Sigma. Discarded: the point group
    and every isogeny. Retained: one bit, whether j(E_a1) equals
    j(E_a2). Many curves share one j, so the projection is lossy.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-024
      provenance: internal
      claim: >-
        The opened note states that supersingular j-invariants are the
        vertices of the ell-isogeny graph, about p/12 of them, and
        that path-finding is about O(p^{1/2}) classically and
        O(p^{1/4}) on the F_p subgraph. It gives no j-pair at p = 127.
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-024.md
    - ref: KN-TECH-028
      provenance: internal
      claim: >-
        The opened note states the Deuring dictionary between
        supersingular curves and maximal orders. This idea does not
        compute an order.
      verified_by: coordinator, this design session, via knowledge/techniques/KN-TECH-028.md
  assumptions:
    - p = 127 is prime. The test checks that.
    - A model is skipped when 4 a^3 + 27 = 0. A singular model is not a vertex.
    - Supersingularity here means #E_a(F_127) = 128. A different trace leaves that a unscored.
    - j is the usual invariant 1728 * (4 A)^3 / Delta with A = a and B = 1, reduced in F_127.
  predictions:
    - metric: absolute difference of the integer representatives of j(E_a1) and j(E_a2) in 0..126
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Confirm p = 127 is prime. Scan a from 1 to 126. Skip singular
      models. Count points of each remaining E_a. Keep the first two
      a with count 128. If fewer than two exist, stop. Compute both
      j-invariants and record whether they differ. Do not walk an
      isogeny.
    controls:
      - A skipped a satisfies 4 a^3 + 27 = 0. A kept a does not.
      - Recomputing j from (A, B) = (a, 1) matches the stored j.
      - The scan is increasing in a. Starting at a = 126 and decreasing is a different experiment.
      - An ordinary model, the smallest a with a point count other than 128, is not given a j in the pair.
    required_metrics:
      - a1
      - a2
      - point_count_a1
      - point_count_a2
      - j_a1
      - j_a2
  falsification_conditions:
    - j(E_a1) equals j(E_a2), while both point counts are 128.
    - Fewer than two a in 1..126 pass the point-count test, so the inequality is not scored.
    - A kept model is singular.
  confounders:
    - Twists can share j and still have different point counts over F_127. This test keeps only count 128, so a quadratic twist with a different count is not selected.
    - The family fixes B = 1. A model with another B and the same j is invisible.
  interpretation_limits:
    - Two models at p = 127. No count of all supersingular j-invariants is claimed.
    - Equal j rejects only this pair of coefficients. It does not close path-finding.
    - Unequal j is a difference of two field elements. It is not a path.
    - Exponent delta against Õ(p^{1/4}) is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The first two coefficients with point count 128 are treated
        as if they landed on distinct j-invariants. That is the
        prediction, not a theorem. The sample is one scan of 126
        coefficients. No transfer is claimed.
      rigorous_support: >-
        KN-TECH-024, opened, says there are about p/12 supersingular
        j-invariants and does not identify the first two models of
        this family at p = 127. The test uses the point counts.
      validation_plan: >-
        One increasing scan. Checks are the singularity skip, the
        point count 128, and recomputation of j. There is no tail.
        No second prime is drawn.
  target_complexity:
    time_exponent: >-
      At most 126 point counts on a 127-element field, then two
      j-invariants. Polynomial in the fixed p. No path search is run.
    memory_exponent: >-
      Two models and two j-invariants. No p^{1/2}-sized table is
      stored.
    best_known: >-
      KN-LIT-078 via the opened KN-TECH-024 note: Õ(p^{1/2})
      classically on the full graph and Õ(p^{1/4}) on the F_p
      subgraph. Neither is claimed.
    hidden_overhead: >-
      No o(1) term. The range a = 1..126 is explicit. The output is
      two elements of F_127.
    tradeoff_note: >-
      No time-memory tradeoff and no collision search. One scan.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      This is a toy comparison of two j-invariants in one Weierstrass
      family. It is not an ECDLP rho or index-calculus row. No KR-*
      row was claimed.
    nearest:
