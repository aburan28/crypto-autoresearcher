idea:
  id: IDEA-20260807-edb3f3
  question_id: RQ-SSIQ-9702af
  goal_id: GOAL-SSIQ-001
  added: '2026-08-07'
  title: >-
    The p^{1/4} certificate: four independently checkable necessary
    conditions (N1-N4) for the list-and-close architecture, and the
    observation that "enlarge the closable family" and "exploit the tail of
    small delta_E" are the same ball-density computation, priced twice, both
    landing on 3/8 -- the first barrier past 1/3

  class: theory

  claim: >-
    SCOPE STATED FIRST: the certificate is necessary for the LIST-AND-CLOSE
    ARCHITECTURE of the frozen source's section 0.3, not for all algorithms;
    a model-independent lower bound is out of scope for this entry. Within
    that scope, a covering statement achieving time exponent p^{1/4} forces
    four independently checkable conditions on the certificate vector
    (k, r, beta, u) = (size of the closable target family, guaranteed
    covering radius, amortised per-entry check exponent, smoothness
    parameter of the split at radius r):
      N1 -- a covering family of size k >= p^{1/8} (rank-3 counting: a
      guaranteed radius r = p^{1/4} needs k*r^{3/2}p^{-1/2} >= 1, i.e.
      k >= p^{1/2}/p^{3/8} = p^{1/8}).
      N2 -- batched closability at k^{o(1)} amortised cost per entry
      (otherwise the exchange rate gives p^{1/4}*p^{1/8} = p^{3/8}).
      N3 -- a MEDIAN shift, not a tail exploitation: the family's
      displacement law must have its median at p^{1/4}, because merely using
      the tail of the delta_E law is capped at p^{1/8} attempts x p^{1/4}
      per attempt = p^{3/8}, which is ALSO E(1/4, 0, 1/4) = 3/8 IN THE
      SCREEN-THRESHOLD COST IDENTITY ALREADY COMMITTED TO THIS PROGRAMME BY
      IDEA-20260805-250e50 / H-SSIQ-90e07b -- this record CITES that
      coincidence, it does not re-derive it as a discovery of its own.
      N4 -- universality preserved: the covering statement must hold for
      all E (or a p^{-o(1)} fraction), and the split at radius p^{1/4} must
      keep P0 = p^{-o(1)}; the smoothness parameter at that radius,
      u = log p/(4 log B), is SMALLER than the incumbent's log p/(3 log B),
      so smoothness gets easier there, not harder -- a cell that does not
      bind, recorded here so no future entry spends effort on it.
    THE STRUCTURAL OBSERVATION: N1's p^{1/8} and N3's p^{-1/8} are the SAME
    ball-density computation, #{isogenies of degree <= p^{1/4}}/#{curves} =
    p^{3/8-1/2}. Enlarging the target family and re-randomising into the
    tail are therefore not two ideas but one, priced identically, and both
    land on 3/8 -- the first barrier past 1/3. Any proposal mixing them
    gains nothing: the mixed cost is p^{1/4}*(k_family*k_attempts) with the
    product of the two deficits still >= p^{1/8}. This is forward guidance:
    the 1/3 -> 1/4 gap cannot be crossed by QUANTITY on either axis, only by
    N2, which is a data-structure question, not a number-theoretic one.
    NO ALGORITHM IS PROPOSED. NO EXPONENT BELOW 1/3 IS CLAIMED TO BE
    ATTAINED OR ATTAINABLE.

  mechanism: >-
    Zero-compute audit, not a measurement. (1) Take the closed,
    pre-registered list of every sub-1/3 route named anywhere under
    GOAL-SSIQ-001 to date (levers L1-L5, N5, A1-A7, and every catalogue
    entry in C1/C2/Q3 naming a route), and for each, evaluate N1-N4,
    recording PASS/FAIL/UNRESOLVED with the arithmetic shown. (2) KNOWN-
    ANSWER GATE: the incumbent p^{1/3+o(1)} algorithm itself must be run
    through the certificate at radius p^{1/3} and must return k = 1, beta =
    0, N1-N4 all PASS, and total exponent exactly 1/3, reproducing this
    goal's own committed section-4.1-derived rows within the already-
    established bit band. A certificate that fails its own incumbent is
    void. Second gate: the classical meet-in-the-middle baseline must
    return exponent 1/2 through the same machinery (rank-4 counting,
    k = 1). (3) A route that passes all four conditions and is still not an
    algorithm must be reported as such -- the certificate is necessary,
    never sufficient, and this must be stated on every row, not discovered
    later.

  novelty_status: unverified

  prior_art_citation: >-
    THE 3/8 COINCIDENCE AND ITS ARITHMETIC (E(1/4, 0, 1/4) = 3/8) IS OWNED
    BY ledger/proposals/IDEA-20260805-250e50.yaml AND
    ledger/hypotheses/H-SSIQ-90e07b.yaml (both VERIFIED to exist as real,
    committed ledger records under this goal, checked by the Coordinator in
    this session -- not an informal catalogue mention). 250e50/90e07b prices
    ONE mechanism (a screen with selectivity s and per-query cost gamma) via
    an identity that is memory-blind and family-blind by construction (no
    k appears in it, per that record's own text). THIS ENTRY'S certificate
    has no screen variable in it at all: its axes are family size k and
    amortised lookup cost, and its central claim is a duality BETWEEN TWO OF
    ITS OWN CONDITIONS (N1 and N3) that 250e50/90e07b cannot state because
    it has only one axis. The shared number 3/8 is used HERE ONLY AS
    CORROBORATION ACROSS INDEPENDENT ROUTES and is explicitly credited to
    250e50/90e07b, never re-derived as this entry's own finding, per the red
    team's own instruction in
    ideas/catalogue-20260806-mlkem-aes-ssi-ssqi/DEDUP.md row Q3-7.

  interpretation_limits:
    - >-
      NO ALGORITHM IS PROPOSED, NO EXPONENT BELOW 1/3 IS CLAIMED ATTAINED OR
      NEAR-ATTAINABLE. The certificate is a NECESSARY-CONDITION device: a
      route passing all four conditions is promoted to a designed
      experiment, not asserted as a result (falsifier F7-b in the source
      catalogue entry states both audit outcomes are deliverables).
    - >-
      Scoped strictly to the LIST-AND-CLOSE ARCHITECTURE of the frozen
      source's section 0.3. It says nothing about, and is not a lower bound
      for, any other algorithmic architecture (relation collection, descent,
      higher-dimensional embeddings).
    - >-
      The 3/8 number is CITED, not re-derived, to
      IDEA-20260805-250e50/H-SSIQ-90e07b; any record repeating this
      arithmetic without that citation is non-compliant with the red team's
      explicit instruction on this entry.
    - >-
      Memory is charged inside the certificate, not outside it: a route
      with time p^{1/4} and memory p^{1/2} fails the goal's time-and-memory-
      symmetric target and the certificate must say so per row.
      Preprocessing (advice) and oracle assumptions are uncharged resources
      if not declared, and any row assuming either is a defect.
    - >-
      HIGH RISK BAND, PER THE SOURCE CATALOGUE: not because the certificate
      is bold, but because outcome F7-c (a sub-1/3 route exhibited that
      violates the certificate) would reopen the architecture scoping that
      several other entries in this goal's lever map assume settled.

