idea:
  id: IDEA-20261006-8aedbe
  title: >-
    Edwards denominators vanish for a square parameter and for no pair
    when the parameter is a nonsquare, over F_41
  class: control
  claim: >-
    Over F_41, let E_d be the affine Edwards curve
    x^2 + y^2 = 1 + d x^2 y^2. Let d_ns be the smallest d in
    {2, ..., 39} that is a nonsquare and for which E_d has at least 8
    affine points, and let d_sq be the smallest d in {2, ..., 39} that
    is a nonzero square, not 1, with the same size. A denominator of
    the addition law is zero when 1 + d x1 x2 y1 y2 is 0 or
    1 - d x1 x2 y1 y2 is 0. Let Z_ns be the number of ordered pairs of
    affine points on E_{d_ns} with a zero denominator, and let Z_sq be
    the same count on E_{d_sq}. The claim is Z_ns = 0 and Z_sq at least
    1. A finished Z_ns of at least 1, or a finished Z_sq of 0, is the
    concrete negative. Representation class R2. The time exponent stays
    1/2.
  mechanism: >-
    OBJECT FRAME. Representation R2: the Edwards model with parameter
    d, points kept as affine pairs (x, y). Operation set Sigma is the
    Edwards addition law, scored only through its two denominators.
    Sigma is not group translation on a short-Weierstrass model and is
    not doubling of a y-half bit. Trichotomy: coordinate-dependent.
    The denominator is a polynomial in the coordinates and in d.
    LOSSY-PROJECTION TEST against Sigma. The bit "denominator is zero"
    discards the sum and keeps one bit. The priced open numbers are
    the two pair-counts Z_ns and Z_sq, with separators 0 and 1. The
    square parameter is the nearby object: the same formula with the
    quadratic character of d flipped. No factor base is proposed.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: coordinator
  approved_by: null
  question_id: RQ-ECDLP-623a32
  citations:
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Symmetries and small-order torsion on twisted Edwards and
        Jacobi models reduce point-decomposition cost on extension
        fields. This idea does not decompose a point and does not
        change that cost.
      verified_by: >-
        coordinator opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        on 2026-10-06
    - ref: KR-RHO-cb1c58
      provenance: internal
      claim: >-
        Montgomery's trick batches n field inversions into one
        inversion. This idea counts vanishing denominators. It does
        not batch an inversion and does not price a rho step.
      verified_by: >-
        coordinator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-cb1c58.yaml
        on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Omega(sqrt(p))
        group operations. This idea cites that bound as the unchanged
        baseline.
      verified_by: >-
        coordinator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: Bernstein-Lange complete Edwards addition
      provenance: recalled
      claim: >-
        Pointer only. A completeness statement for nonsquare d is
        remembered and was not opened. It is not support for Z_ns = 0.
      verified_by: null
  assumptions:
    - >-
      A square is a nonzero residue whose Legendre symbol is +1. The
      symbol is a^20 mod 41, sent to -1 when the power is 40.
    - >-
      d = 0 and d = 1 are skipped. They are not eligible square
      parameters.
    - >-
      Both parameters are selected by the size gate before either Z
      is counted.
  predictions:
    - metric: Z_ns and Z_sq
      direction: different
      minimum_effect: >-
        Z_ns = 0 and Z_sq at least 1. Either a positive Z_ns or a zero
        Z_sq is the concrete negative.
  minimal_test:
    design: >-
      For d from 2 through 39, enumerate affine (x, y) in
      {0, ..., 40}^2 on x^2 + y^2 = 1 + d x^2 y^2 over F_41. Let d_ns
      be the smallest d with Legendre symbol -1 and at least 8 affine
      points. Let d_sq be the smallest d with Legendre symbol +1, d
      not 1, and at least 8 affine points. On each selected curve,
      test every ordered pair of affine points, including pairs that
      repeat a point. Count pairs where either denominator is 0. Stop
      after those two curves. Also score the second nonsquare d in the
      same range, if one exists, and record its Z beside the row.
    controls:
      - >-
        Both points of every pair lie on the selected curve. A pair
        off the curve voids the count.
      - >-
        The second nonsquare parameter, when it exists and has at
        least 8 affine points, is the nearby object. If its Z is
        positive while Z_ns is 0, nonsquareness is not the separator
        and the claim is not scored.
      - >-
        Repeat the denominator test with d replaced by 0 on the point
        set of E_{d_ns}. That is a different curve. It is recorded and
        is not Z_ns.
    required_metrics:
      - d_ns and d_sq
      - affine point counts
      - Z_ns and Z_sq
      - second nonsquare Z, or none
  falsification_conditions:
    - Z_ns is at least 1 on a finished enumeration.
    - Z_sq is 0 on a finished enumeration.
    - No eligible nonsquare d, or no eligible square d, exists in {2, ..., 39}.
  confounders:
    - >-
      A square d can fail to have a rational point on the denominator
      locus even though the locus is nonempty over an extension. Z_sq
      = 0 is then a real negative, not an implementation failure.
    - >-
      The identity (0, 1) makes both denominators equal to 1. Pairs
      that include it do not by themselves create a zero.
    - >-
      Eight affine points is a small curve. The pair count is at least
      64, which is enough to see one exceptional pair if it is rational.
  interpretation_limits:
    - >-
      Two parameters on F_41 are claim_tier toy. They do not change
      time exponent 1/2 or memory exponent 0.
    - >-
      A zero count is not a proof of completeness for every prime. It
      is a count on these two curves.
    - >-
      KR-IC-955fd6 is a decomposition-cost statement on extension
      fields. This idea does not decompose a point.
    - >-
      This idea does not use the embedding degree and is not a
      Frey-Rück reduction.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For d a square in F_41, the two denominator polynomials have
        an F_41-point on the affine curve more often than for d a
        nonsquare, where the count is predicted to be zero on the
        first eligible nonsquare. No transfer to a larger prime is
        assumed.
      rigorous_support: >-
        The comparison is a finite count on two enumerated curves.
        KR-IC-955fd6, opened in this session, does not supply a
        distribution for these denominators.
      validation_plan: >-
        The second eligible nonsquare, when it exists, is scored with
        the same pair enumeration. The prediction that nonsquareness
        is the separator requires that second Z to be 0 whenever the
        first Z_ns is 0. If the second Z is positive, H1 is refused
        and the claim is not scored. If no second nonsquare with at
        least 8 points exists, record the control as absent and still
        score Z_ns and Z_sq.
  target_complexity:
    time_exponent: >-
      unchanged p^{1/2} group operations for a prime-order subgroup
    memory_exponent: >-
      unchanged O(1) distinguished-point memory for the rho baseline;
      this measurement stores two curves of size less than 2*41
    best_known: >-
      Pollard rho, Theta(sqrt(N)) group operations, KR-RHO-13bf67
    hidden_overhead: >-
      none claimed; no new algorithm is proposed, so there is no o(1)
      term
    tradeoff_note: >-
      No time-memory tradeoff is proposed. Enumerating two affine
      curves over F_41 does not use parallelism.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    No opened row dominates these two counts. Rows opened and not
    dominating Z_ns and Z_sq: KR-IC-955fd6 (Edwards and Jacobi models
    as a decomposition symmetry on extension fields; this idea does
    not decompose), KR-RHO-cb1c58 (batched inversion; this idea does
    not invert), KR-RHO-13bf67 (generic Omega(sqrt(p)) bound; this
    idea does not search), KR-RHO-53c89f (MOV and Frey-Rück apply
    only for small embedding degree; this idea does not reduce to a
    finite-field logarithm). A remembered completeness statement for
    nonsquare d was not opened and is not a dominating row.
  sota_delta: >-
    Zero change to time exponent 1/2 and to memory exponent 0 against
    KR-RHO-13bf67. The new quantities are Z_ns and Z_sq, the numbers
    of affine point pairs on two Edwards curves over F_41 whose
    addition denominators vanish, scored against 0 and 1.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-IC-955fd6
      - KR-RHO-cb1c58
      - KR-RHO-13bf67
      - KR-RHO-53c89f
      - KR-IC-5931ee
    nearest:
      - ref: KR-IC-955fd6
        provenance: internal
        relation: adjacent
        delta: >-
          That row uses twisted Edwards and Jacobi models to shrink
          point decomposition on extension fields, with a stated
          factor about 2 to the omega(n-1). This idea stays on F_41,
          does not decompose a point, and scores denominator zeros
          against 0 and 1.
      - ref: KR-RHO-cb1c58
        provenance: internal
        relation: orthogonal
        delta: >-
          That row batches inversions across walks. This idea counts
          vanishing denominators on two static curves and does not
          run a walk.
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is the MOV and Frey-Rück reduction for small
          embedding degree. This idea does not compute a pairing and
          does not reduce a logarithm.
    searched:
      corpus_grep:
        - >-
          ledger/proposals on origin/main and the idea files of PRs
          1939 and 1937, for Edwards denominators, Frey-Rück, and
          y-half doubling
      web: []
      blocked:
        - >-
          web search not run; a remembered completeness statement for
          nonsquare d was not opened; novelty_status stays unverified
