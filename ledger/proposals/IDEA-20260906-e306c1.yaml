    "claim": "Correlated additive sensor drift of rank r can be canceled by a bounded-coefficient left-annihilator when the canceled direction is known independently of the signing key, potentially improving recoverability despite losing r observations. The gain fails when annihilation amplifies independent noise more than it removes drift.",
    "mechanism": "Model a self-generated leakage vector as y=f(k)+U*z+epsilon, where U is a public, calibrated integer design matrix (for example constant offset per block) and z unknown nuisance. Choose an integer matrix W with WU=0 and small row norms. Apply W to the modular HNP equations and likelihood model, retaining the induced covariance W Sigma W^T and modular carries. Unlike correlated nonces, the nonces remain independent; only the measurement channel shares drift. The tracked object is the nuisance quotient under addition by im(U), a legitimate partial-action loss. Acquiring/calibrating U and estimating its mismatch are charged, and no real device is accessed.",
