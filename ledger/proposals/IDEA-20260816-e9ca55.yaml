idea:
  id: IDEA-20260816-e9ca55
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: Split the four numbered heuristics of the nrd-PIP route into a directed dependency graph
    of separately testable predicates, then determine which of the three survivors are load-bearing
    for anything beyond the density claim that already failed, so each survivor carries its own falsifier
    rather than inheriting a block verdict.
  class: theory
  claim: '(A) This corpus records the nrd-PIP route''s heuristics as a block verdict: Heuristics 1-3
    ''independently experimentally verified'' and Heuristic 4 failed, per the 30/06 update transcribed
    in KN-LIT-7674 and carried into KN-OPEN-028 and EV-HAWK-c99848. A block verdict is a summary,
    not a research object. Each numbered heuristic is a predicate over named quantities, and the four
    predicates stand in a dependency order: some are preconditions for the module-LIP to nrd-PIP reduction
    being well-posed, some are preconditions for the re-randomisation sampling step terminating with
    a usable instance, and exactly one - the fourth - was a counting estimate on the pool of re-randomised
    instances. (B) The claim is that this dependency order is recoverable from what this corpus already
    transcribed, without any new external reading, and that once written down it partitions the three
    surviving heuristics into two classes. Class (i): those whose truth is consumed only downstream
    of the density estimate that failed, so that their verified status now purchases nothing for any
    successor construction. Class (ii): those whose truth is consumed by the reduction itself or by
    the subfield solve, and which therefore remain live inputs to anything built on this route. The
    size of class (ii) is the deliverable, and it is a small integer with a named consumer for each
    element. (C) The claim is further that at least one class (ii) survivor can be restated as a predicate
    testable here at toy conductor sizes with exact integer arithmetic and no lattice sieving, converting
    a relayed authors''-verification into a locally reproducible one at an explicitly stated toy scale.
    (D) NOT CLAIMED: that any heuristic is true or false; that the authors'' verification of Heuristics
    1-3 is right or wrong; that KN-OPEN-028 is reopened - its Q1, Q2 and Q3 closures stand exactly
    as recorded there and in DEC-20260805-ed4cd3 and DEC-20260805-a62164, and are cited here as settled;
    that the nrd-PIP route is or is not viable; that any successor construction exists. No attack,
    no exponent, no statement about HAWK''s security in either direction, no parameter recommendation,
    and nothing about what published literature contains beyond the transcription this corpus already
    holds.'
  mechanism: 'Stage 1 is bookkeeping over committed records: extract from KN-OPEN-027, KN-OPEN-028,
    KN-LIT-7674, EV-HAWK-c99848 and EV-HAWK-21edba every sentence that states or paraphrases a heuristic,
    and write each as a predicate with its free variables named and typed - a conductor, a relative
    norm, a bound on the reduced vector, a density. Anything that cannot be typed is recorded as untyped
    rather than guessed, and the untyped residue is an honest output of this stage rather than a failure
    of it. Stage 2 builds a directed graph whose nodes are the typed predicates and the algorithmic
    steps, and whose edges are ''is consumed by'': an edge from a predicate to a step means that step''s
    stated correctness or termination argument invokes it. Edges are drawn solid only where a committed
    record names the consumption; inferred edges are drawn dashed and counted separately, and no conclusion
    may rest on a dashed edge alone. Stage 3 deletes the node for the failed density heuristic and
    takes the induced subgraph. Any survivor all of whose out-edges terminated at that node or downstream
    of it falls into class (i); the rest are class (ii). Stage 4 takes each class (ii) survivor and
    asks whether its predicate is decidable by exact integer computation on small cyclotomic conductors
    - for instance a statement about the existence or count of elements of a given reduced norm in
    a small order, which is a finite search. For each, a toy-scale falsification test is written;
    for each that is not so decidable, the reason is recorded. Stage 5 emits the graph, the two class
    lists, the untyped residue and the per-survivor test, and asserts nothing else. A refutation looks
    like class (ii) being empty, or the graph failing to be acyclic, either of which is a usable measured
    obstruction rather than a dead end.'
  novelty_status: unverified
  novelty_screen:
    method: Ran grep -ril 'hawk|module-lip|nrd-pip|nrdpip|lattice isomorphism' over ledger/proposals/
      (11 files returned) and read the title and class lines of all 11. Read ledger/questions/RQ-HAWK-001.yaml,
      knowledge/open-problems/KN-OPEN-027.md and knowledge/open-problems/KN-OPEN-028.md in full. Read
      ledger/evidence/EV-HAWK-c99848.yaml and ledger/evidence/EV-HAWK-21edba.yaml in full, and the
      head of ledger/evidence/EV-HAWK-001.yaml. Read knowledge/techniques/KN-TECH-081.md. Read the
      scope statements of ledger/hypotheses/H-HAWK-c7a551.yaml and H-HAWK-a28be6.yaml and the title
      blocks of experiments/EXP-HAWK-a2f34a/specification.yaml and experiments/EXP-HAWK-c8231a/specification.yaml.
      Read docs/inventor-protocol.md sections 1-5 and 8.
    results: 'The 11 HAWK-touching proposals are: IDEA-20260801-019 (independent reimplementation
      of the reported attack at reduced parameters); IDEA-20260805-6eac55, IDEA-20260805-128f35 and
      IDEA-20260808-b1358c (the tau-cocycle and Galois-involution census lane); IDEA-20260805-3a855d
      and IDEA-20260807-90479e (cost-model and uncosted-factor audits of the Straznickas-Weis exact-SVP
      bottleneck); IDEA-20260805-f58517 (transferring the AM-intersect-coAM ceiling to Classic McEliece);
      IDEA-20260807-6cdff2 and IDEA-20260806-a3ef00 (isogeny-side quaternion PIP and Gross-lattice
      decomposition); IDEA-20260807-f73d98 (a program-wide source-acquisition constraint audit); IDEA-20260807-add964
      (an ECDLP sign cocycle, an incidental keyword match). None decomposes the numbered heuristics
      into predicates or builds a consumption graph over them. KN-OPEN-027 asks ''do the heuristics
      hold'' as a single question and is superseded by KN-OPEN-028, which records the block verdict
      and closes all three of its own questions. KN-OPEN-027''s ''what would resolve it'' item 2 asks
      for the four heuristics to be extracted and stated individually - the nearest existing statement
      of this work, written against an entry now superseded, and never carried out under the corrected
      reading.'
    verdict: 'UNVERIFIED. Claimed new here: the consumption-graph construction and the class (i) /
      class (ii) partition of surviving heuristics by whether their consumer survived the deletion
      of the failed node, together with the small-integer deliverable that partition produces. Assembled
      from known parts: the heuristic statements themselves, transcribed in KN-LIT-7674 and relayed
      through KN-OPEN-028; the fact of the fourth heuristic''s failure and its arithmetic cause, recorded
      in EV-HAWK-c99848; and the general dependency-audit move, which is ordinary practice everywhere.
      KN-OPEN-027 item 2 already asked for individual statement of the heuristics, so the extraction
      half is a stated-but-undone task rather than a new idea, and only the graph and the partition
      are offered as new. This program cannot read external literature and therefore asserts nothing
      about whether anyone outside has done this.'
  object_first_candidate:
    tracked_object: 'The heuristic-consumption graph: nodes are typed predicates extracted verbatim
      or in paraphrase from committed records together with the algorithmic steps they serve, and
      edges are ''is invoked by'' relations pointing from a predicate to the step whose correctness
      or termination argument cites it. The object followed through the computation is this graph
      under node deletion.'
    lossiness: 'Genuinely lossy, and the loss is the point. The projection discards every quantitative
      content of each heuristic - the actual bound, the actual density, the actual norm - and retains
      only the typed variable list and the consumption relation. What survives is exactly what is
      needed to propagate the deletion of one node: whether a survivor''s consumer still exists. Nothing
      survives that could answer a question about magnitudes, which is why the density-exponent measurement
      contract in this batch exists separately rather than being folded in here. The discard is compatible
      with the operation of interest, deleting a falsified heuristic, because deletion acts on the
      relation and not on the magnitudes.'
    propagation: One step of the target operation is 'delete a node and take the induced subgraph'.
      Under this step a predicate whose out-neighbourhood becomes empty is demoted to class (i) deterministically,
      and a predicate retaining at least one out-edge to a surviving step stays class (ii). The step
      is idempotent on classes already assigned and terminates in at most as many rounds as there
      are nodes, so propagation is deterministic and finite.
    survival_score: 'The structure survives exactly as long as the consumption edges are drawn from
      committed text rather than inferred. Concretely: it survives all four deletion rounds on the
      solid-edge subgraph, and dissolves the moment a dashed inferred edge is required to keep a survivor
      in class (ii), at which point that survivor is recorded as undetermined rather than promoted.
      The expected dissolution point is at the two heuristics whose statements this corpus holds only
      in paraphrase.'
  null_object_control: 'The null object is a shuffled consumption graph: the same node set and the
    same out-degree sequence, with edge targets permuted uniformly at random among the algorithmic
    steps, run through the identical deletion procedure over 2000 permutations in the same script
    invocation as the signal arm. For the signal arm to mean anything, the null must produce class
    (ii) sizes distributed around the value expected from out-degree alone, and the real graph''s
    class (ii) size must sit outside the central 90 percent of that null distribution. If the real
    graph''s partition is indistinguishable from a degree-preserving random rewiring, the partition
    carries no information beyond the degree sequence and must be recorded as a controlled null rather
    than as a finding.'
  discriminated_from:
  - 'KN-OPEN-027 item 2 (extract and state the four heuristics individually): that request predates
    the correction CORR-20260802-008 and asks for statement only; this entry adds the consumption
    relation and the deletion semantics, and is written against the corrected reading rather than
    the truncated one.'
  - 'KN-OPEN-028: that entry closed its Q1, Q2 and Q3 with a verdict per question. This entry reopens
    none of them and operates strictly downstream, on the internal structure of the surviving heuristics
    that the closure did not partition.'
  - 'IDEA-20260801-019 (independent reimplementation of the reported attack at reduced parameters):
    that is an execution proposal requiring the algorithm to run; this is a zero-compute symbolic
    audit of the argument''s dependency structure and requires no implementation of any part of the
    attack.'
  - 'IDEA-20260805-3a855d and IDEA-20260807-90479e (cost-model audits): those charge uncosted factors
    and the exact-SVP call in the Straznickas-Weis route. This entry touches no cost model, no gate
    count and no timing; it tracks logical consumption only.'
  - 'Ordinary proof-dependency auditing as practised anywhere: the specific move here is deleting
    a node known to be false and reading the induced subgraph as a resource inventory for successor
    constructions, which is the inventor-protocol section 4 second reading applied to a logical structure
    rather than to a measured quantity.'
  assumptions:
  - The committed records KN-LIT-7674, KN-OPEN-028, EV-HAWK-c99848 and EV-HAWK-21edba transcribe the
    heuristic statements faithfully enough that predicates extracted from them are the paper's predicates;
    where they only paraphrase, the extraction is recorded as paraphrase and the resulting edge is
    dashed.
  - The four heuristics are separable at all, that is, no two of them are the same statement under
    different names. If they are not separable the graph collapses, and that collapse is itself the
    reported result.
  - A predicate's consumers are enumerable from the text stating the algorithm's steps, at least for
    the steps this corpus records.
  - Deletion is the right semantics for a falsified heuristic - a failed heuristic supplies nothing
    downstream, rather than supplying a weakened version. The resource-reading entry in this batch
    tests the opposite semantics, and the two are deliberately complementary.
  predictions:
  - metric: size of class (ii), the surviving heuristics with a live consumer after deletion of the
      failed node
    direction: lower
    minimum_effect: 'forced value: at most 2 of the 3 survivors, on the solid-edge subgraph'
  - metric: number of extracted predicates that cannot be typed from committed text (untyped residue)
    direction: higher
    minimum_effect: at least 1; a residue of 0 would indicate the extraction rule was too permissive
      and triggers a re-extraction
  - metric: gap between real class (ii) size and the median of the degree-preserving null distribution
    direction: different
    minimum_effect: 1.0 heuristic, that is, the real value must differ from the null median by at
      least one whole node
  - metric: fraction of edges that are dashed (inferred rather than cited)
    direction: different
    minimum_effect: 'refusal to pre-commit: this program has not read the paper body, so the citable
      fraction is unknown in advance and pre-committing to it would be a fabricated expectation'
  minimal_test:
    design: Zero compute beyond text processing. One Python script reads the five committed records,
      applies a fixed extraction rule (any sentence containing a heuristic number or the word heuristic
      plus a quantifier), and emits a candidate predicate list to a frozen JSON file. A second pass,
      run against that same frozen list, assigns each predicate a type signature and marks it typed
      or untyped. A third pass builds the edge set, marking each edge cited or inferred with its exact
      source line. The deletion procedure then runs on the solid-edge subgraph and on the full graph
      separately, and the two class (ii) sizes are reported side by side. The null arm runs the identical
      deletion procedure on 2000 degree-preserving rewirings inside the same script invocation, so
      signal and null cannot diverge in code path. Total cost is minutes of CPU and no external data.
      The discriminating output is a single pair of integers - class (ii) size and its percentile
      in the null - plus the untyped residue count.
    controls:
    - Degree-preserving edge rewiring null, executed in the same script invocation as the signal arm,
      2000 permutations.
    - 'Extraction-rule sensitivity control: rerun the whole pipeline under a second, deliberately
      stricter extraction rule (a heuristic number required, not merely the word) and report both
      class (ii) sizes; a partition that flips under rule choice is reported as rule-dependent.'
    - Cited-only versus cited-plus-inferred edge sets reported separately and never merged into one
      number.
    - 'Scrambled-source control: run the extractor over an unrelated open-problem entry of similar
      length, for instance KN-OPEN-024, and confirm it does not produce a four-node heuristic graph,
      which would indicate the extractor is matching prose shape rather than content.'
    required_metrics:
    - class (ii) size on the cited-only subgraph
    - class (ii) size on the cited-plus-inferred graph
    - untyped predicate residue count
    - edge count split by cited versus inferred
    - null distribution percentile of the observed class (ii) size
    - class (ii) size under the stricter extraction rule
  falsification_conditions:
  - 'Class (ii) is empty on both edge sets: every surviving heuristic was consumed only by the failed
    density argument, which closes the route''s heuristic inventory as a resource and is a usable
    measured obstruction.'
  - The observed class (ii) size falls inside the central 90 percent of the degree-preserving null,
    meaning the partition is explained by out-degree alone and carries no structural information.
  - Class (ii) membership flips under the stricter extraction rule, meaning the partition is an artifact
    of how sentences were cut.
  - The extractor produces a four-node heuristic graph from the unrelated control entry, meaning it
    is matching prose shape.
  - The consumption graph is not acyclic, meaning 'is consumed by' was not the relation actually extracted.
  confounders:
  - This corpus holds the heuristic statements at second hand and partly as paraphrase - KN-OPEN-028
    explicitly records that the paper body was not read when it was written - and paraphrase can silently
    merge two predicates into one.
  - EV-HAWK-21edba corrects an earlier record, EV-HAWK-68b8b6, on the definite versus indefinite quaternion
    point, so the corpus contains at least one superseded technical claim about this exact route;
    extracting from a superseded record would corrupt the graph.
  - Author-side renumbering between paper versions would make heuristic numbers unstable across the
    records that cite them.
  - The extraction rule is written by the same agent that predicts the outcome, so rule choice can
    be tuned toward the prediction, which is why the stricter-rule control is mandatory and pre-registered
    rather than optional.
  interpretation_limits:
  - A class (ii) inventory says what is still available as an input; it says nothing about whether
    any successor construction can use it, and constructing one is out of scope.
  - Nothing here bears on HAWK's security, on any parameter set, or on the standing of the module-LIP
    assumption.
  - The result is a statement about this corpus's records of the route, not about the route as its
    authors would state it, and that gap cannot be closed without reading the paper body.
  target_complexity:
    time_exponent: No attack exponent is claimed. The audit is linear in the number of extracted predicates
      and quadratic in that number for the graph build, on inputs of size under 10.
    memory_exponent: No attack memory exponent is claimed. Working memory is a few kilobytes of graph.
    best_known: The incumbent for HAWK-shaped key recovery in this corpus is the Straznickas-Weis
      unconditional reduction to poly(n) exact-SVP calls in dimension n/2+1 at 2^{(n/2+1)+o(n)} (KN-LIT-7592).
      This entry does not compete with it and claims no place on that frontier.
    hidden_overhead: 'The human cost of adjudicating what counts as a distinct heuristic and what
      counts as a citation of one; that adjudication is not automatable and is where the result is
      most fragile. Also hidden: the possibility that the useful dependency structure lives in the
      paper body''s proofs rather than in its heuristic statements, in which case the graph built
      from this corpus is a shadow of the real one.'
  dominated_by: 'Checked against every route row recorded in KN-OPEN-028''s live-surface table - Straznickas-Weis
    unconditional 2^{(n/2+1)+o(n)} (KN-LIT-7592); nrd-PIP / Guessing Game, super-polynomial and underived
    (KN-LIT-7674); definite/indefinite LIP, which reports HAWK unaffected (KN-LIT-7648); the SLIP
    AM-intersect-coAM complexity ceiling (KN-LIT-7671) - plus generic lattice reduction on the 2n-dimensional
    lattice as a fifth frontier row. This entry produces no attack and enters no row: n/a (no result
    claimed).'
  sota_delta: No attack; conceptual and bookkeeping contribution only. The only quantity moved is
    the number of surviving heuristics known to have a live consumer, which goes from unstated to
    a stated small integer with per-element justification and a null-referenced percentile.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (B), that the graph is buildable at all from committed records:
    0.75 - the records are unusually explicit for this program, but two heuristics are held only in
    paraphrase. Part (B) further, that class (ii) is non-empty: 0.55, because the fourth heuristic''s
    failure was specifically a density miscount and densities usually sit at the end of a chain, so
    at least one earlier heuristic plausibly feeds the reduction directly - though ''plausibly'' is
    doing real work in that sentence. Part (C), that a class (ii) survivor is toy-testable with exact
    integer arithmetic: 0.35, conditional on class (ii) being non-empty, because number-field statements
    about relative norms are finite but the finite search may already be out of reach at any conductor
    where the statement is non-trivial. Probability the whole thing returns only an untyped residue
    and no usable partition: 0.2.'
