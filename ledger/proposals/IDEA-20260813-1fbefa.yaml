idea:
  id: IDEA-20260813-1fbefa
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  title: Key-conditioned tail decomposition of multi-target proof slack
  class: composition
  claim: >-
    Splitting a selected FIPS 205 multi-target reduction into an explicitly bounded
    bad-public-key tail and a typical-key game yields a constants-tracked bound no
    worse than the exact baseline and strictly tighter on a declared query range
    if reachable target occupancy concentrates under the fixed public seed; falsify
    if the tail mass plus typical-key loss restores or exceeds the baseline.
  mechanism: >-
    Define a publicly measurable key statistic from the construction-specific
    reachable target set, prove a tail bound over key generation, and condition the
    reduction on a preregistered typical set. Optimize the threshold only from the
    proved symbolic expression, charging the tail probability, conditioning,
    public-statistic computation, and any nonuniform advice.
  why_not_a_renamed_known_approach: >-
    IDEA-20260801-009 is a toy slack meter; IDEA-20260805-705614 audits quantifier
    order/reachable occupancy; IDEA-20260805-fbe36a gives occupancy moments and a
    leaf-collision correction; IDEA-20260807-c4f1fc studies the normal-operation
    reachable hash-input set. This proposal composes a proved bad-key tail with a
    typical-key reduction and an end-to-end constants ledger. It must reproduce,
    not assume, those ingredients.
  predictions:
    - observable: Bad-key tail mass versus threshold
      metric: Exact or rigorous upper bound under key generation
      predicted: The bound decays enough to offset typical-set conditioning on at least one declared query interval
    - observable: Typical-key target multiplicity
      metric: Maximum and moment bounds for reachable targets conditioned on the typical set
      predicted: Smaller than the unconditional worst-case factor used by baseline
    - observable: End-to-end advantage delta
      metric: Baseline minus tail-conditioned bound with every constant restored
      predicted: Nonnegative everywhere in scope and strictly positive only where predeclared
  minimal_test:
    parameter_slice: Exact selected theorem, exhaustive tiny public-seed/key space, and symbolic standard parameter substitutions after proof.
    procedure: [Reproduce baseline and neighbor occupancy definitions, enumerate the toy key-statistic distribution, prove a tail inequality, compose the typical-key game, and optimize threshold without using observed adversary outcomes]
    discriminating_outcomes:
      - Concentration plus positive final delta supports bad-key slack.
      - Concentration with no final delta supports overhead displacement.
      - Heavy tails or publicly selectable bad keys falsify the claimed typical-key improvement.
  controls:
    - Exact null: replace construction-derived reachable sets by same-size uniformly sampled sets with matched first moment; any special concentration claim must disappear or be identified as generic occupancy.
    - Planted positive: use a synthetic key family with a known two-component typical/bad mixture and exact tail mass; the composition must reproduce it.
    - Nearby control: publicly computable index family from IDEA-20260805-705614's control concept, preserving quantifier order but removing construction-specific dependencies.
    - Baseline control: unconditional worst-case game and exact constants.
  confounders: [Adversarial public-key selection instead of honest key generation, threshold chosen after seeing results, first-moment bounds mistaken for tails, nonuniform advice, and duplicated multi-target factors]
  falsification_conditions: [Baseline reproduction failure, incorrect toy tail bound, adversary chooses outside honest-key distribution, threshold depends on adversary outcomes, or nonpositive end-to-end delta]
  interpretation_limits: [Honest-key average bounds do not imply chosen-key security, no cryptanalytic attack follows, only the frozen proof theorem is covered, and stateless faults are excluded]
  assumptions: [Primary theorem permits honest key-generation conditioning, reachable-set statistic is public and source-faithful, and all occupancy results are independently rederived]
  heuristic_assumptions:
    - id: H1
      statement: Toy concentration shape transfers to standard parameters.
      validation: Use a proved tail inequality with explicit parameters; toy histograms only check the inequality and cannot substitute for it.
    - id: H2
      statement: Threshold optimization is stable across the declared query range.
      validation: Report the full symbolic envelope and sensitivity table; pointwise cherry-picking invalidates the claim.
  proof_search_map:
    bottleneck: Establish the correct key statistic, quantifier order, tail mass, and typical-key game without chosen-key or advice leakage.
    baseline_embedding:
      parameter_slice: Exact baseline theorem and exhaustive tiny key space.
      reproduction_check: Match unconditional multi-target factor, occupancy convention, query bounds, and public-seed treatment.
    observation_collision:
      audit: Search keys with identical proposed statistic but different reachable multiplicity or reduction loss.
      failure_response: Refine the statistic or use the worst loss within each fibre.
    constructive_transforms: [Key-to-public-statistic map, tail/typical partition, conditioned-game composition with explicit abort]
    quantifier_order: Sample an honest key, classify it using the fixed public statistic, then quantify over every adversary within the query budget; threshold is fixed before adversary interaction.
    method_ceiling:
      statement: Tail decomposition cannot improve chosen-key security or a baseline already tight for almost every key.
      nearby_counterobject: A key family with the same mean occupancy but a heavy tail aligned with adversarial success.
    proof_obligations: [Baseline reproduction, statistic sufficiency or fibre worst-case, rigorous tail bound, conditioned-game lemma, complete constants and threshold table]
    not_applicable_reason: null
