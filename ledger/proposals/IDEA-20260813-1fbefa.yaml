    hidden_overhead_disclosure: Statistic computation, conditioning abort, tail mass, occupancy derivation, multi-target factors, preprocessing, memory, and verification are charged.
    time_memory_tradeoff: Exact key histograms are toy-only and memory heavy; analytic moment/tail bounds save memory at possible tightness cost.
