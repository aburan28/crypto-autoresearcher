      - ref: KR-RHO-037e22
        provenance: internal
        relation: orthogonal
        delta: >-
          The opened row is the Koblitz Frobenius class reduction
          sqrt(2m) for binary rho. The top frontier match on this claim
          text was that row, score 5, from the word Frobenius. This
          idea adds no binary walk. The exponent delta is 0.
  dominated_by: >-
    Compared with the path-finding bound named in KN-OPEN-013, opened,
    about p^{1/4}: this enumeration is poly(71) time, stores one
    extension group, and finds no path. It does not beat that baseline
    on time, memory, or data.
  sota_delta: >-
    The predicted failure count is 0. The exponent delta against
    p^{1/4} is 0.
