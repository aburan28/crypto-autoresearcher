idea:
  id: IDEA-20261007-b4acda
  question_id: RQ-SSI-001
  added: '2026-10-07'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    Frobenius squared equals multiplication by -71 on y^2 = x^3 + x
    over F_71^2.
  class: measurement
  claim: >-
    Let p = 71 and let E be y^2 = x^3 + x over F_71. Let F_5041 be
    F_71[z]/(z^2 + 1). Let pi be the p-power Frobenius on coordinates.
    The claim is that every affine point P of E(F_5041) satisfies
    pi(pi(P)) = [-71]P. The failure count is 0. This is a trace-zero
    check on one curve. It is not a congruence of pi with 1 on torsion,
    it does not recover an endomorphism ring basis, and the exponent
    delta against the opened path-finding cost is 0.
  mechanism: >-
    A supersingular curve over F_p has trace 0, so the Frobenius
    endomorphism satisfies pi^2 + p = 0. KN-OPEN-013, opened, records
    the endomorphism-ring problem as open and states no sub-p^{1/4}
    generic path-finding attack. This idea does not search for a path.
    It counts failures of pi^2 = [-p] on the affine points of one
    quadratic extension. OBJECT FRAME. Representation: affine points
    over F_5041. Operation: pi twice, compared with multiplication by
    -71. The j-invariant is discarded.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note says no sub-p^{1/4} generic path-finding attack
        is recorded, and that the endomorphism ring is the surviving
        hardness object. This idea does not compute that ring.
      verified_by: coordinator, this session, via knowledge/open-problems/KN-OPEN-013.md
    - ref: KN-TECH-027
      provenance: internal
      claim: >-
        The opened note treats supersingular curves over F_p as the
        CSIDH setting. It does not state pi^2 = [-71] at this prime.
      verified_by: coordinator, this session, via knowledge/techniques/KN-TECH-027.md
  assumptions:
    - p = 71 is prime and 71 ≡ 3 (mod 4). The test checks both.
    - z^2 + 1 is irreducible over F_71. If it splits, the extension is invalid.
    - "#E(F_71) = 72. If it fails, the instance is missing."
  predictions:
    - metric: number of affine points P in E(F_5041) with pi(pi(P)) != [-71]P
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      Build F_5041 = F_71[z]/(z^2 + 1). Enumerate affine points of
      E(F_5041). For each, apply the coordinate p-power twice and
      compare with the elliptic negation of [71]P. Count mismatches.
      Do not walk an isogeny and do not publish torsion images.
    controls:
      - On every rational point, pi is the identity, and [-71]P = P because the group order divides 72 and 71 ≡ -1 (mod 72) is checked as 71 + 1 = 72.
      - The point at infinity is not an affine sample.
      - A point that fails the curve equation is not counted as a mismatch. It invalidates the enumerator.
    required_metrics:
      - point_count_base
      - affine_point_count_extension
      - frobenius_square_failures
  falsification_conditions:
    - frobenius_square_failures is at least 1 on a point that lies on the curve.
    - "#E(F_71) is not 72, so the sample is not the supersingular instance."
    - z^2 + 1 splits over F_71, so the extension is invalid.
  confounders:
    - A wrong group law can manufacture failures. The rational-point control must pass before the extension count is read.
    - Trace 0 on the base field does not by itself list an endomorphism-ring basis.
  interpretation_limits:
    - One prime. No transfer to a path-finding exponent.
    - Failure count 0 does not compute the endomorphism ring.
    - This is not the statement that pi acts as 1 on the n-torsion.
    - Exponent delta against the p^{1/4} path-finding bound named in KN-OPEN-013 is 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p = 71 only, pi^2 + [p] = 0 on E(F_{p^2}) because the curve
        is supersingular of trace 0. The test uses the enumerated
        points. No transfer to another prime is claimed.
      rigorous_support: >-
        KN-OPEN-013, opened, identifies the endomorphism ring as the
        hardness object and does not give this pointwise check. The
        trace-zero relation is the quantity under test, not a cited
        theorem from that note.
      validation_plan: >-
        Enumerate E(F_5041) once. Compare pi^2(P) with [-71]P on every
        affine point. The rational-point control is the bulk check that
        the group law agrees with pi = id. Sample size is the whole
        extension group, not a tail sample.
  target_complexity:
    time_exponent: >-
      One enumeration of E(F_{71^2}), at most a few thousand points.
      Polynomial in the fixed p. No path search is run.
    memory_exponent: O(1) field elements beyond the point list, which is O(p^2).
    best_known: >-
      KN-OPEN-013, opened: best generic path-finding named there is
      about p^{1/4}. This idea does not improve that exponent.
    hidden_overhead: No o(1) term. The output is one integer failure count.
    tradeoff_note: No time-memory tradeoff. One full enumeration.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-037e22
    nearest:
      - ref: KN-OPEN-013
        provenance: internal
        relation: adjacent
        delta: >-
          The note leaves the endomorphism-ring problem open at cost
          about p^{1/4}. This idea adds a failure count in {0, 1, ...}
