idea:
  id: IDEA-20260807-5cabfc
  question_id: RQ-VOLC-f6253b
  added: '2026-08-07'
  title: >-
    THE VERTICAL TRANSPORT CLOSURE: a vertical ell-power isogeny is an
    ISOMORPHISM on the prime-order subgroup, so every attack-cost functional
    that factors through the abstract triple (G, P, Q) is constant across all
    volcano levels of every ell != N; the named obstruction is that depth lives
    entirely in E[ell^infinity] and E[ell^infinity] intersect G = {O}, and the
    ell = N loophole is closed by the arithmetic fact that the N-volcano has
    height zero for any near-prime-order curve
  class: mechanism

  claim: >-
    (A) THE STATEMENT. Let E/F_p be ordinary with trace t, let G = <P> subset
    E(F_p) have PRIME order N, Q = [k]P. Let ell be a prime with ell != N and
    let phi: E -> E' be an F_p-rational isogeny of degree ell^j that changes the
    ell-adic valuation of the conductor of End(E) -- that is, a VERTICAL path in
    the ell-volcano, so E and E' sit at different levels and have different
    endomorphism rings. Then:
      (i)  ker(phi) intersect G is a subgroup of G of order dividing
           gcd(ell^j, N) = 1, hence trivial, so phi restricted to G is INJECTIVE;
      (ii) phi(P) has order exactly N and phi(Q) = [k] phi(P);
      (iii) therefore phi induces an ISOMORPHISM of DL instances
           (G, P, Q, k) -> (phi(G), phi(P), phi(Q), k), with the SAME k.
    CONSEQUENCE (the closure): let C be any attack-cost functional that factors
    through the isomorphism class of the abstract triple -- i.e. C(E, P, Q)
    depends only on (N, k) and on the group law as an abstract oracle. Then C is
    CONSTANT on every ell-volcano level of the class, for every ell != N. This
    covers, without exception: Pollard rho and every walk variant, BSGS and every
    meet-in-the-middle, kangaroo, Pohlig-Hellman, every generic-group algorithm,
    and every augmented-witness-lattice construction of the H-ENDO-001 kind.

    (B) THE NAMED OBSTRUCTION, stated so the next agent does not re-tread it.
    DEPTH LIVES IN E[ell^infinity] AND G DOES NOT MEET IT. The level of E in the
    ell-volcano is v_ell(f_E) where f_E is the conductor of End(E); by Kohel's
    stratification the level is exactly a statement about which ell-power
    isogenies from E are horizontal, ascending, or descending, i.e. about the
    Galois/End-module structure of E[ell^infinity]. Since ell != N and N is
    prime, G intersect E[ell^infinity] = {O}. The level is therefore an invariant
    of a part of the curve that the DL instance does not touch, and the vertical
    isogeny that changes the level is invisible to the part it does touch. This
    is the ISOGENY-SIDE COMPANION to H-ENDO-001: that record says every
    ENDOMORPHISM acts on G as a scalar, this one says every VERTICAL ISOGENY acts
    on G as an isomorphism. Together they close the two natural routes by which
    "more endomorphism structure" could have changed a group-theoretic cost.

    (C) THE ONE LOOPHOLE, AND IT IS CLOSED ARITHMETICALLY. The argument needs
    gcd(deg phi, N) = 1, so it says nothing at ell = N. But there is no depth at
    ell = N. Write t^2 - 4p = c^2 D_K with D_K fundamental; the ell-volcano has
    height v_ell(c) (Kohel). By Hasse, c^2 |D_K| = 4p - t^2 <= 4p, so
    c <= 2 sqrt(p) / sqrt(|D_K|) <= 2 sqrt(p). For any curve whose prime subgroup
    order satisfies N > 2 sqrt(p) -- which holds for every near-prime-order curve
    and in particular for every standardized curve -- we get N > c, hence
    N does not divide c, hence v_N(c) = 0 and THE N-VOLCANO HAS HEIGHT ZERO.
    There are no vertical N-isogenies to exploit. What does exist is the
    quotient map E -> E/G of degree N: it is rational and it annihilates G, i.e.
    it destroys the instance rather than transporting it. That map is named here
    as the residual and it is not an attack.

    (D) WHAT THIS DOES NOT CLOSE -- the forward guidance, which is the part of a
    closure that has to earn its keep. The theorem closes functionals that factor
    through the abstract triple. It says NOTHING about functionals that read the
    EMBEDDING of G into the curve, because phi does not preserve x-coordinates:
    for a point R in G, x(phi(R)) is a different field element from x(R), and
    every quantity built on x-coordinates is free to vary. Explicitly left open,
    with their resource labels:
      R1 -- Semaev/Groebner solving degree, factor-base decomposition yield,
            relation-collection cost, first-fall degree. All are functions of the
            x-coordinate map and none factors through the triple.
      R2 -- anything reading the curve equation (a, b) or j.
      R5 -- E[ell] for ell != N as a Galois/End module. THIS IS THE SHARP ONE:
            R5 at the SAME ell as the volcano is the unique resource that reads
            the level directly rather than through a proxy, because the level IS
            a statement about ell-power torsion. IDEA-20260807-cbe8c1 takes
            exactly this opening.
      R8 -- the level as preprocessing shared across many targets in one class.
      Transport cost -- T1 in the DECOMPOSITION says class-wide vulnerability
            holds "up to transport cost". In THIS lane that clause is vacuous:
            a vertical ell-step is one Velu computation at cost O(ell) field
            operations and the volcano height is at most log_ell(2 sqrt(p)), so
            transport across the whole volcano is polynomial. The closure is
            therefore TIGHT here in a way it need not be for large-degree
            isogenies (contrast H-ECTD-19017a, which studies prime conductor
            steps q >= 17 where the transport cost is the interesting quantity).

  resource_label: 'audit: consumes no resource'
  admissibility: admissible
  admissibility_argument: >-
    This proposal consumes no non-generic resource. It is an AUDIT in the sense
    of DECOMPOSITION lane L12: it determines which OTHER proposals are
    inadmissible_generic_group by exhibiting, once and for all, the simulation
    that makes level-dependence unreachable for triple-factoring functionals. An
    audit that closes a class is admissible by construction because it claims no
    speedup; its output is a boundary, not an algorithm.

  discriminated_from:
    - >-
      H-ENDO-001. That record is about ENDOMORPHISMS acting on G (all scalars,
      index pinned at N, exponent stays 1/2). This is about ISOGENIES BETWEEN
      DIFFERENT CURVES acting on G (all isomorphisms). The two statements are
      logically independent -- one is about End(E) -> End(G), the other about
      Hom(E, E') -> Hom(G, G') -- and neither implies the other. This record
      cites H-ENDO-001 and does not restate it.
    - >-
      T1/T2 in analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md. T1
      is the general transport fact for any isogeny of degree coprime to N. This
      record specializes it to VERTICAL ell-power isogenies, adds the level-lives-
      in-E[ell^infinity] obstruction which T1 does not state, adds the ell = N
      height-zero argument which T1 does not state, and observes that in this
      lane the "up to transport cost" clause of T2 is vacuous because vertical
      ell-steps are polynomial. Those three additions are the deliverable.
    - >-
      IDEA-20260805-38aebb (the h x rho conservation law). That record closes the
      "descend the volcano to buy class number or short endomorphisms" family by
      an EXACT COUNTING IDENTITY on the order O_f. This record closes a different
      and larger family -- every triple-factoring cost functional -- by a
      STRUCTURAL argument about where the level lives. 38aebb's obstruction is a
      conserved product; this one's is an empty intersection. Neither subsumes
      the other: 38aebb says no level is better for endomorphism-based attacks;
      this says no level is DIFFERENT AT ALL for group-based ones.
    - >-
      H-ECTD-19017a / EXP-ECTD-9e4248. That hypothesis MEASURES Semaev meters
      across large prime conductor steps. Semaev meters are R1 functionals and do
      NOT factor through the triple, so this closure does not touch them and does
      not predict their outcome in either direction. Stated explicitly so no one
      reads this record as pre-empting that experiment.

  object_first_candidate:
    tracked_object: >-
      THE ISOMORPHISM CLASS OF THE DL TRIPLE (G, P, Q) -- equivalently the pair
      (N, k) together with the abstract cyclic group structure -- followed along
      a VERTICAL path in the ell-volcano from crater to floor.
    lossiness: >-
      GENUINELY LOSSY, and the lossy-projection test is passed rather than
      asserted. The projection E |-> (G, P, Q) discards: the curve equation
      (a, b); the j-invariant; the x-coordinate embedding of G into F_p; the
      entire prime-to-N part of E(F_p); all of E[ell^infinity]; and End(E)
      itself. It is not a change of coordinates: from (N, k) alone one cannot
      recover j, cannot recover the level, and cannot even recover p. What is
      RETAINED -- the cyclic group of order N with a marked generator and a
      marked target -- propagates DETERMINISTICALLY under a vertical ell-step,
      because the step restricts to an isomorphism on it. That is exactly the
      compatibility the inventor-protocol section 2 test demands, and it is the
      reason the projection is a closure rather than a coordinate change: what is
      discarded is discarded compatibly, so the retained part carries no memory
      of the discarded part.
    propagation: >-
      One vertical ell-step: (G, P, Q) -> (phi(G), phi(P), phi(Q)) with k fixed.
      Deterministic, invertible up to the dual isogeny (phi-hat composed with phi
      is [ell^j], which acts on G as a known scalar since gcd(ell, N) = 1). The
      propagation is the identity on the tracked object up to canonical
      isomorphism -- which is precisely the negative result.
    survival_score: >-
      Survives every vertical step, every horizontal step, and the whole
      isogeny class. Dies only when gcd(deg, N) != 1, i.e. at ell = N, which
      section (C) shows carries no depth for near-prime-order curves. It also
      dies as a USEFUL object the moment a functional reads x-coordinates, and
      that is the boundary this record exists to draw.

  mechanism: >-
    STEP 1 -- THE KERNEL ARGUMENT (three lines, no heuristic). ker(phi) has order
    ell^j. G has prime order N != ell. ker(phi) intersect G is a subgroup of G,
    so its order divides N; it is also a subgroup of ker(phi), so its order
    divides ell^j; gcd = 1, so it is trivial. phi restricted to G is injective,
    phi(P) has order N, and phi is a homomorphism so phi([k]P) = [k]phi(P).

    STEP 2 -- THE FACTORING CONDITION, MADE PRECISE. Say a cost functional C
    FACTORS THROUGH THE TRIPLE if there is a function C' with
    C(E, P, Q) = C'(N, k) for all curves E and all P, Q with P of order N. Every
    generic-group algorithm in Shoup's model has this property by definition of
    the model: its transcript is a sequence of group operations and equality
    tests on encoded elements, and the encoding is exactly what phi changes.
    KN-FIND-b7e091 already records that incidence and endomorphism-image oracles
    are simulable inside that model; this step adds that the VERTICAL ISOGENY MAP
    is itself an encoding change, hence also invisible there.

    STEP 3 -- THE LEVEL LIVES ELSEWHERE. By Kohel's stratification (RECALLED,
    UNVERIFIED -- Kohel's thesis and KN-LIT-360 Sutherland's "Isogeny Volcanoes"
    are the standard sources and NEITHER WAS READ for this record; the statement
    is made a verification stage of the minimal test, not assumed), the curves of
    the F_p-isogeny class are stratified by the order O_f = Z + f O_K with f | c,
    the ell-isogeny graph is a volcano of height v_ell(c), and the level of E is
    v_ell(f_E). Membership in a level is decided by which ell-power isogenies out
    of E are ascending/horizontal/descending, i.e. by the O-module structure of
    E[ell^infinity]. Since gcd(ell, N) = 1 and N is prime, G intersect
    E[ell^infinity] = {O}. The level is thus a property of a direct summand of
    the torsion that G does not meet.

    STEP 4 -- THE ell = N CASE, CLOSED BY HASSE. As in claim (C):
    c <= 2 sqrt(p) < N for a near-prime-order curve, so v_N(c) = 0 and the
    N-volcano is a single vertex. The only rational N-isogeny is E -> E/G, which
    kills the instance. NOTE this is a genuine arithmetic dependency: for a curve
    with a LARGE cofactor, N can be small enough that N <= 2 sqrt(p) and the
    argument lapses. The minimal test checks the inequality per instance rather
    than assuming it, and any instance where it fails is reported separately.

    STEP 5 -- WHAT IS ACTUALLY RUN. This is a proof-oriented record and its
    experiment is a VERIFICATION, not a discovery: at toy scale, enumerate a
    class with a volcano of height >= 2 at ell in {2, 3}; build every vertical
    edge by Velu; check on every edge that (a) the codomain has the same trace,
    (b) phi(P) has order N, (c) phi(Q) = [k] phi(P) with the SAME k recomputed
    independently, (d) matched rho and BSGS operation counts on the two endpoints
    agree within their own instance-to-instance noise band. If any of (a)-(d)
    fails the theorem is not what is wrong -- the implementation is -- and that
    disposition is fixed in advance.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep tool (ripgrep) over ledger/, knowledge/, docs/, analysis/ on
      2026-08-07 for: "volcano" (case-insensitive), "crater", "conductor",
      "Kohel", "transport", "H-ENDO-001", "group structure". Also read in full:
      analysis/endomorphism-isogeny-decomposition/DECOMPOSITION.md,
      knowledge/findings/KN-FIND-b7e091.md, ledger/hypotheses/H-ENDO-001.yaml,
      ledger/hypotheses/H-ECTD-19017a.yaml, ledger/proposals/IDEA-20260805-38aebb.yaml,
      ledger/proposals/IDEA-20260726-010.yaml.
    results: >-
      "crater": 9 occurrences across 4 ledger files (H-ALISO-028, H-ALISO-029 --
      both historical Autolab artifact ports, unrelated; H-ECTD-19017a;
      IDEA-20260731-017). "volcano" in knowledge/: 9 literature records plus
      KN-TECH-024/027 and KN-OPEN-013. The transport fact T1 appears in
      DECOMPOSITION.md section 3 in its general form. NO record in this
      repository states the specialization to vertical ell-power isogenies, the
      "depth lives in E[ell^infinity]" obstruction, or the ell = N height-zero
      argument.
    verdict: >-
      ADAPTATION. The kernel argument is elementary and certainly known; the
      Kohel stratification is classical. What is not in this corpus is the
      assembly into a stated closure with a named obstruction and explicit
      forward guidance at the docs/inventor-protocol.md section 4 standard, and
      the ell = N height-zero observation which converts the argument's one
      hypothesis into a checkable arithmetic inequality. No novelty is claimed
      against the external literature and none was checked there.

  null_object_control: >-
    THE HEIGHT-ZERO VOLCANO NULL, and it is the control this whole lane should
    be built on. Choose a second isogeny class at the same p whose conductor c
    satisfies v_ell(c) = 0, so the ell-volcano is a SINGLE VERTEX and there is no
    depth at all. Run the identical measurement pipeline on it. Any quantity that
    reports a "level effect" in a height-zero volcano is 100 percent artifact,
    with no mathematical content available to explain it. DECAY PARAMETER: the
    volcano height h = v_ell(c). A genuine depth effect must be zero at h = 0,
    must be able to appear at h = 1, and must grow no faster than the number of
    distinct levels; a quantity that is the same size at h = 0 and h = 3 is the
    canonical artifact tell of docs/inventor-protocol.md section 3. SECOND NULL:
    the SAME curve measured twice with a fresh random k. Every quantity in this
    record's scope is k-dependent only through the abstract triple, so resampling
    k must move a triple-factoring functional by exactly its instance noise and
    must move a genuine level functional not at all.

  assumptions:
    - >-
      Kohel's volcano stratification theorem, as stated in Step 3. RECALLED,
      UNVERIFIED (Kohel thesis; KN-LIT-360 Sutherland, "Isogeny Volcanoes",
      arXiv:1208.5370, present in this corpus, NOT READ beyond its recorded
      abstract). It is made an explicit verification stage of the minimal test
      at ell in {2, 3} rather than assumed.
    - >-
      E is ordinary. Everything here fails for supersingular curves, where
      End(E) is an order in a quaternion algebra and the volcano picture does
      not apply. Scope stated, not hidden.
    - >-
      N > 2 sqrt(p), used only in Step 4. Checked per instance; instances that
      violate it are reported separately rather than silently included.
    - >-
      "Cost functional factors through the triple" is a definition, and whether
      a given measured quantity satisfies it is a per-quantity question this
      record answers only for the list in claim (A). Any new functional must be
      classified explicitly before this closure is applied to it.

  proof_search_map:
    bottleneck: >-
      The single step whose failure would break the theorem is the coprimality
      gcd(deg phi, N) = 1. Everything else is a two-line consequence. That is
      why claim (C) is not a footnote: it is the whole exposed surface of the
      argument, and it is closed by an arithmetic inequality rather than by
      hand-waving.
    baseline_embedding:
      parameter_slice: >-
        j = 0, i.e. phi = identity, must reproduce the trivial statement
        C(E) = C(E). More informatively: the HORIZONTAL case (an ell-isogeny
        that preserves End(E)) is the parameter slice on which this theorem must
        agree exactly with T1/T2 of DECOMPOSITION.md, since horizontal isogenies
        are a special case of degree-coprime-to-N isogenies.
      reproduction_check: >-
        Frozen fixture: one toy class, one horizontal ell-edge, one vertical
        ell-edge, same instance. The transported k must be bit-identical on both
        edges and identical to the untransported k. Any difference is an
        implementation failure and halts the line.
    observation_collision:
      observable: >-
        The isomorphism class of the triple (G, P, Q), operationalized as the
        pair (N, k) plus the matched rho and BSGS operation counts.
      distinct_preimage_search: >-
        REQUIRED, AND EXPECTED TO SUCCEED -- which is the point. Two curves at
        DIFFERENT volcano levels with IDENTICAL observable is not a falsifier
        here, it is the theorem's content. The audit obligation is the reverse
        one: search for two curves at different levels with DIFFERENT observable.
        Finding such a pair (outside instance noise, with the same k) refutes the
        theorem and is the single most valuable outcome this record could have.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (N, k, rho count) fixed and vary the forgotten
          structure -- the level, End(E), j, (a, b), the x-coordinate embedding.
          Then look for an intrinsic invariant that distinguishes the resulting
          curves. This is exactly the forward-guidance list in claim (D): the
          invariants that survive the fiber are R1, R2, R5, R8 quantities.
        predicted_gain: >-
          No attack gain. The gain is a partition of the space of measurable
          quantities into "provably level-blind" and "possibly level-sensitive",
          which is what makes the rest of this batch's proposals cheap to triage.
    quantifier_order: >-
      CLAIMED: FORALL ordinary F_p-isogeny classes with N > 2 sqrt(p), FORALL
      primes ell != N, FORALL pairs (E, E') in the class joined by a vertical
      ell-power F_p-isogeny, FORALL cost functionals C factoring through the
      triple: C(E, P, Q) = C(E', phi(P), phi(Q)).
      NOT CLAIMED, and the confusion would be fatal: FORALL C EXISTS a level at
      which C is minimized -- that is a statement about non-factoring functionals
      and this record asserts nothing about it. Also NOT claimed: that no
      functional distinguishes levels. Many do; none of them factors through the
      triple.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For triple-factoring cost functionals, volcano depth is exactly zero
        information, at every ell != N, in every ordinary F_p-isogeny class with
        N > 2 sqrt(p)." This is unconditional given Kohel's theorem. It can NEVER
        certify anything about a functional that reads x-coordinates, the curve
        equation, or ell-torsion, and any summary omitting the qualifier is
        overclaiming under AGENTS.md rule 4.
      nearby_object_control: >-
        THE SEMAEV SOLVING DEGREE ON THE SAME TWO CURVES. It is the closest
        object on which the desired conclusion is NOT available: it is a function
        of the x-coordinate embedding, phi changes that embedding, and the
        theorem is silent. The method must be seen to FAIL to constrain it. A
        version of this argument that appeared to also bound the Semaev meter
        would have proved too much and would be wrong.
    proof_obligations:
      - claim: ker(phi) intersect G is trivial.
        responsibility: correctness
      - claim: phi(P) has order N and phi(Q) = [k] phi(P).
        responsibility: correctness
      - claim: Kohel stratification -- levels are v_ell(f_E), height is v_ell(c).
        responsibility: baseline
      - claim: v_N(c) = 0 whenever N > 2 sqrt(p).
        responsibility: strictness
      - claim: Vertical ell-step transport is polynomial (Velu, O(ell) ops).
        responsibility: runtime
      - claim: The forward-guidance list is exhaustive for the resource taxonomy R1-R8.
        responsibility: scope
      - claim: Reported statements name the "factors through the triple" qualifier.
        responsibility: scope

  predictions:
    - metric: >-
        transported secret k across every vertical ell-edge of a toy volcano,
        recomputed independently on the codomain curve
      direction: different
      minimum_effect: >-
        EXACT EQUALITY on 100 percent of edges. One edge with a different k, with
        the order and coprimality controls passing, refutes the theorem. This is
        a zero-tolerance prediction because the claim is algebraic, not
        statistical.
    - metric: >-
        matched Pollard-rho group-operation count at the crater versus at the
        floor of the same ell-volcano, same k, averaged over >= 20 seeds
      direction: different
      minimum_effect: >-
        Ratio within the instance-to-instance noise band measured on the SAME
        curve across seeds. Predicted: no level effect. A reproducible ratio
        outside that band, surviving the height-zero null, would refute the
        theorem's applicability to rho and is the interesting outcome.
    - metric: >-
        v_N(c) computed per instance for >= 200 toy instances with N > 2 sqrt(p)
      direction: different
      minimum_effect: >-
        Exactly 0 on 100 percent of instances. This is a check of the arithmetic
        argument in claim (C), and it is cheap enough that there is no excuse for
        asserting it instead.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): write out the proof as above and have it read
      adversarially. The theorem is three lines; if it is wrong, it is wrong for
      free.
      STAGE 1 (hours): build the toy volcano instrument (see
      IDEA-20260807-b1b604) for ell in {2, 3} at p ~ 2^12 to 2^14, choosing a
      class with v_ell(c) >= 2 so at least three levels exist. Verify Kohel's
      stratification empirically: count rational ell-isogenies per vertex and
      check the ell+1 / 1 / 1+(D_K/ell) pattern.
      STAGE 2 (hours): for every vertical edge, transport (P, Q) by Velu and
      recompute k independently on the codomain by brute force. Exact equality
      required.
      STAGE 3 (hours): matched rho and BSGS counts at crater and floor, >= 20
      seeds, plus the same-curve seed-noise band.
      STAGE 4 (minutes): the height-zero null class, identical pipeline.
      STAGE 5 (minutes): v_N(c) = 0 check over the instance pool.
    controls:
      - height-zero volcano (v_ell(c) = 0) -- must show no level effect anywhere
      - same curve, resampled k -- gives the instance noise band
      - horizontal ell-edge -- must transport identically to a vertical one
      - a deliberately non-coprime map E -> E/G -- must DESTROY the instance,
        confirming the instrument can see the failure mode the theorem excludes
    required_metrics:
      - transported k versus independently recomputed k, per edge
      - rational ell-isogeny count per vertex, versus the Kohel prediction
      - matched rho and BSGS operation counts per curve per seed
      - v_ell(c), v_N(c), level of each vertex, height of each volcano
      - pass/fail of every control

  falsification_conditions:
    - >-
      Any vertical edge on which the independently recomputed k differs from the
      transported k, with the order and coprimality controls passing. The theorem
      is false as stated and this record is superseded, not amended.
    - >-
      A reproducible rho or BSGS cost difference between crater and floor,
      outside the same-curve seed-noise band, surviving the height-zero null.
      Either the theorem is false or rho as implemented does not factor through
      the triple -- and the second possibility must be excluded before the first
      is claimed.
    - >-
      Any toy instance with N > 2 sqrt(p) and v_N(c) > 0. The arithmetic in claim
      (C) is wrong and the ell = N loophole reopens.
    - >-
      The measured rational ell-isogeny counts do not match Kohel's pattern. Then
      the recalled stratification theorem is being misapplied and every level
      label in this batch is suspect. This is an instrument failure that voids
      the lane's labels, not a mathematical negative.

  confounders:
    - >-
      Instance noise in rho counts is large (rho is a random variable with a
      heavy tail), so a crater-vs-floor comparison at low seed count will show
      apparent differences that are pure sampling. The same-curve seed-noise band
      is mandatory and blocking, not decorative.
    - >-
      Velu implementations can silently produce a curve in a DIFFERENT isogeny
      class if the kernel polynomial is wrong. The trace check on every codomain
      is the guard and it must be run on every edge, not sampled.
    - >-
      At p ~ 2^12 the volcano may be too short to have a floor distinguishable
      from a crater; classes must be selected for v_ell(c) >= 2 before any
      measurement, and the selection is a curve-only criterion so it cannot
      bias k.
    - >-
      Confusing "the level is invisible to rho" with "the level is invisible".
      The whole value of this record is the boundary, and a summary that drops
      the qualifier converts a correct closure into a false one.

  interpretation_limits:
    - >-
      This closes a class of FUNCTIONALS, not a class of ATTACKS on curves. It
      does not say the volcano is useless; it says the volcano is useless to any
      algorithm that only ever touches group elements.
    - >-
      Nothing here is evidence about H-ECTD-19017a, whose meters are R1 and
      outside scope in both directions.
    - >-
      The toy verification is a check on the implementation and on Kohel's
      stratification, not on the theorem, which is proved. Toy-scale runs may
      never be cited as crypto-scale validation.
    - >-
      A closure is not an impossibility claim (docs/inventor-protocol.md section
      7). The direction remains open through R1, R2, R5 and R8, and this record
      names them.

  reachability_gate: >-
    NOT APPLICABLE AS A COST, AND THAT IS ITSELF INFORMATIVE. This proposal moves
    between curves only to VERIFY an invariance, so it needs no good curve and
    pays no search cost. But it settles half of T5 for the whole lane: since
    every vertical ell-step costs one Velu computation at O(ell) field operations
    and the volcano height is at most log_ell(2 sqrt(p)), TRAVERSING THE ENTIRE
    ell-VOLCANO IS POLYNOMIAL. Therefore in lane L2, unlike in lanes that must
    reach a SPECIFIED curve, reachability is never the binding constraint --
    every level of every small-ell volcano is cheaply reachable from every other.
    T5's dichotomy resolves on the "cheap" side here, which means any negative in
    this lane is a negative about the MATHEMATICS and cannot be excused as a
    reachability failure. That raises the evidential value of every other L2
    proposal and is recorded here for their benefit.

  target_complexity:
    time_exponent: >-
      NO ATTACK IS PROPOSED, so no exponent is claimed. The theorem asserts that
      the exponent of every triple-factoring functional is LEVEL-INDEPENDENT; for
      rho that exponent is 1/2 at every level, with constant 0.886 (KN-TECH-006)
      and its automorphism discount (KN-TECH-018).
    memory_exponent: >-
      Likewise level-independent: O(1) for parallel rho with distinguished
      points, sqrt(N) for BSGS (KN-TECH-031). The theorem says depth moves
      neither.
    best_known: >-
      Parallel Pollard rho with distinguished points, 0.886 sqrt(N) group
      operations, O(1) memory (KN-TECH-001, KN-TECH-006), automorphism-discounted
      by at most sqrt(6) on CM curves (KN-TECH-018).
    hidden_overhead: >-
      None hidden in this record. The one qualifier that does work is "factors
      through the triple", and it is stated in every claim rather than buried in
      an o(1).
    tradeoff_note: >-
      Not applicable; no algorithm. Worth recording that the theorem's
      level-independence applies uniformly along the whole van Oorschot-Wiener
      time-memory curve, since every point of that curve is a triple-factoring
      functional.

  dominated_by: >-
    Checked across time, memory and data/queries against every row of the
    prime-field frontier the campaign charges against: parallel Pollard rho with
    distinguished points at 0.886 sqrt(N) time and O(1) memory (KN-TECH-001,
    KN-TECH-006); its automorphism-discounted variant at 0.886 sqrt(N/|Aut|),
    |Aut| <= 6 (KN-TECH-018); BSGS at 2 sqrt(N) time and sqrt(N) memory
    (KN-TECH-031); and toy-scale Semaev index calculus, which KN-FIND-f8c290
    records as tight at toy scale. This proposal mounts NO attack, so it is
    dominated by every one of them on every axis. Stated as a fact, not as a
    formality.
  sota_delta: >-
    Zero speedup against any attack baseline, at any level of any volcano -- that
    is the content. Quantitatively: the theorem predicts the crater-to-floor
    ratio of rho operation counts is 1 exactly (up to sampling), against a
    hypothetical level effect of any size; and it converts an open question
    ("does depth change rho?") into a settled one at zero compute. As an audit
    instrument it eliminates, before any run, every proposal whose functional
    factors through the triple -- which on inspection is the majority of what
    "use the endomorphism ring" proposals turn out to be.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.97 that the theorem is correct as stated -- it is three lines of elementary
    group theory plus one Hasse inequality, and the only way it fails is if
    Kohel's stratification is being misremembered in a way that changes what
    "vertical" means. 0.80 that the toy verification passes on the first
    implementation, the residual risk being entirely Velu bugs. 0.10 that anyone
    finds the ell = N residual interesting. The reason to run it despite the high
    prior is that it is nearly free and it prices every other proposal in the
    lane.

