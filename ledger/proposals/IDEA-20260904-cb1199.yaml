idea:
  id: IDEA-20260904-cb1199
  id_allocation_provenance: >-
    Token minted by the coordinator with
    `python3 tools/allocate_id.py --next idea --date 20260904` and confirmed
    free with `--check` (0 occurrences across 11563 identifier-bearing paths),
    relayed to this session 2026-09-04. Not derived by scanning state.
  question_id: RQ-ECDLP-165d4b
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-165d4b has no bound GOAL record visible to this session. Left null
    deliberately, not omitted.
  added: '2026-09-04'
  title: >-
    THE RQ'S DECISION TARGET IS A FALSE DISJUNCTION AND ONE EXTERNAL 2025
    THEOREM COLLAPSES IT: joining two SPECIFIED curves of one ordinary
    F_q-isogeny class is rigorously Otilde(q^{1/4}) (Galbraith 2025, via a
    meet-in-the-middle over a class of size Theta(sqrt q) certified by Kani),
    which is o(q^{1/2}) -- so charged isogeny transfer is ASYMPTOTICALLY FREE
    relative to a rho solve and is not a competitor to endomorphism-orbit
    methods but a free PRECOMPOSITION to them; the whole decision therefore
    reduces to "what does the class's SURFACE curve buy", and the one number
    the census must measure is the CROSSOVER BIT SIZE b* at which charged
    bidirectional class search first falls below charged rho -- predicted to
    lie INSIDE the RQ's own declared 16-36 bit window
  class: composition

  claim: >-
    (A) THE EXTERNAL INGREDIENT, RETRIEVED THIS SESSION AT ABSTRACT LEVEL.
    S. D. Galbraith, "Climbing and descending tall isogeny volcanos", Research
    in Number Theory 11:7 (2025) (IACR eprint 2024/924), revisits the problem
    of relating the ECDLP between ordinary elliptic curves over a finite field
    with the SAME number of points (Galbraith 1999; Jao-Miller-Venkatesan
    2005). Using the Kani construction it improves the worst case from
    Otilde(q^{1.5}) to heuristically Otilde(q^{0.4}), and -- the statement this
    record leans on -- for the two cases of interest to discrete-log
    cryptography, RANDOM CURVES (flat volcanoes) and PAIRING-BASED CURVES
    (tall volcanoes with crater of constant or polynomial size), it gives a
    RIGOROUS Otilde(q^{1/4}) algorithm to compute an isogeny between ANY TWO
    curves in the isogeny class. Provenance is stated exactly in `citations`:
    search-result summaries plus a Springer landing page that redirected to an
    authorization endpoint, and an IACR eprint that returned a block page. NO
    THEOREM STATEMENT WAS READ.

    (B) WHY THAT EXPONENT IS DECISIVE FOR THIS RQ AND FOR NOTHING ELSE. This
    census charges isogeny transfer. Every internal record that has priced the
    transfer arm has priced it at TOY SCALE: EV-ENDO-10109d measures
    preprocessing transport losing to a correctly costed rebuild by 1.5x at
    ell = 3 rising to 21x at ell = 31 with no crossover in range, and
    IDEA-20260830-a22049 composes that charge with a derived within-class
    spread to close the per-instance arm as net-negative. Those measurements
    are correct AND they are measurements of a RATIO THAT DECAYS AS p^{-1/4}.
    Writing S(p) = 0.886*sqrt(N) for the charged rho solve and
    T(p) = kappa * sqrt(M) for a bidirectional meet-in-the-middle over an
    isogeny class of certified size M = H(4p - t^2), with kappa the charged
    cost of one Velu step in units of one group addition, and using the
    Hurwitz-Kronecker mass identity sum_t H(4p - t^2) = 2p (mean class size
    sqrt(p)/2 over the ~4*sqrt(p) admissible traces), we get
        T(p)/S(p)  ~  (kappa/0.886) * (1/sqrt 2) * p^{-1/4}.
    THE TRANSFER CHARGE IS NOT A CONSTANT PENALTY. IT IS A p^{-1/4} PENALTY,
    AND EVERY EXISTING CLOSURE OF THIS ARM WAS TAKEN ON THE WRONG SIDE OF ITS
    CROSSOVER. At kappa = 30 the crossover sits at b* ~ 19 bits; at kappa = 100
    at b* ~ 25 bits; at kappa = 300 at b* ~ 31 bits. All three are INSIDE the
    RQ's declared bit_sizes 16, 20, 24, 28, 32, 36.

    (C) THE CONSEQUENCE FOR THE DECISION TARGET, STATED AS A COLLAPSE. The RQ
    asks whether to prioritise endomorphism-orbit methods OR short isogeny
    transfer. If (A) holds then at any p above b* the transfer is free relative
    to the solve, so it is not an alternative to the orbit lane: it is a free
    move that lets the attacker choose WHICH curve of the class to run the
    orbit lane on. The best choice is forced and computable: ascending the
    volcano maximises End(E), and the class-minimal endomorphism discriminant
    is the fundamental discriminant Delta_K of the class. So the composed
    lane's ceiling is exactly sqrt(|Aut(E_surface)|/2), i.e. sqrt(3) when
    Delta_K = -3, sqrt(2) when Delta_K = -4, and 1 otherwise -- because for
    every other fundamental discriminant the minimal non-scalar endomorphism
    is a NON-UNIT, and IDEA-20260901-6b63a4's norm-order tradeoff
    (n^h >= (sqrt N - 1)^2) forbids a non-unit from having a short orbit. THE
    DECISION TARGET THEREFORE HAS A SINGLE ANSWER, NOT A CHOICE: transfer is
    an enabler with a p^{-1/4} price and the orbit lane is the only value, and
    that value is capped at sqrt(3).

    (D) THE MEASUREMENT, AND IT IS CHEAP. The record does not propose to
    implement Galbraith's algorithm (Kani/higher-dimensional machinery, high
    cost). It proposes to measure the ONE quantity that decides whether this
    RQ can observe its own transfer arm: the charged exponent beta in
    T(p) = c * p^{beta} for BIDIRECTIONAL breadth-first search between two
    SPECIFIED vertices of a Hurwitz-certified complete class, versus the
    charged exponent 1/2 of rho on the same curves, over 16, 20, 24 and 28
    bits, and the resulting crossover b*. Bidirectional search over an expander
    of M vertices is the elementary form of the same meet-in-the-middle, and
    beta = 1/4 is exactly what M = Theta(sqrt p) predicts.

    (E) WHAT IS NOT CLAIMED. No exponent of the ECDLP moves. The composed lane
    still solves at 0.886*sqrt(N)/sqrt(3) at best. No security bits are
    reduced. What moves is the CENSUS's accounting: a charge this program has
    treated as prohibitive is asymptotically zero, and a toy-scale null on the
    transfer arm is shown to be scoped strictly below its own crossover.

  mechanism: >-
    THE TRACKED OBJECT is the CLASS-JOINING PATH: an ordered list of Velu
    kernel data taking a specified source vertex to a specified target vertex,
    together with the two transported points. Its lossy-projection test is done
    explicitly in `object_first_candidate` below.

    STAGE 0 (zero compute, HARD GATE). Write (B) with the Hurwitz identity
    sum_t H(4p - t^2) = 2p, the mean-class-size derivation, and the crossover
    algebra; emit b*(kappa) as a table for kappa in {3, 10, 30, 100, 300}. This
    is reviewable before any run and it alone settles whether the RQ's declared
    bit range can observe the arm.

    STAGE 1 (low compute). For p at 16 and 20 bits, enumerate all F_p-curves
    with harness/isogeny_class.py (enumerate_curves, isogeny_classes) and
    certify every class against hurwitz_class_number via class_census. Retain
    only ordinary, prime-order, non-anomalous classes with declared embedding
    degree and twist rows (KN-TECH-034 screens). At 24 and 28 bits do NOT
    enumerate all 2p curves: construct the class by ell-isogeny walk from one
    vertex for ell in {2,3,5,7} and use the Hurwitz count as the completeness
    certificate; a shortfall is blocking, not a caveat.

    STAGE 2 (the measurement). For each class and each of 24 random ordered
    vertex pairs (E_src, E_tgt), run (i) BIDIRECTIONAL BFS alternating frontier
    expansion from both ends until the frontiers meet, and (ii) the
    UNIDIRECTIONAL null: BFS from E_src only until E_tgt is reached. Charge
    every Velu kernel construction, every isogeny evaluation and every table
    write and probe; record charged cost in Velu-step units and in
    group-addition-equivalents via a measured kappa. Transport the two instance
    points along the found path and verify with
    harness/isogeny_class.verify_transport plus an independent check
    [k]phi(P) == phi(Q) recomputed by code that does not call the path finder.

    STAGE 3 (the baseline). On the same curves run charged rho
    (harness/rho.py), 24 seeds, one frozen cost model, and record
    0.886-normalised work. Fit log T = log c + beta log p and
    log S = log c' + beta' log p; report beta, beta' and the crossover
    b* = the bit size at which the two fitted curves cross, with bootstrap CIs.

    STAGE 4 (decay and scope). The ratio T/S must FALL with p. A flat ratio is
    the section-3 artifact tell of docs/inventor-protocol.md applied to this
    record's own instrument and voids the crossover. Emit the obstruction
    record for beta with units, error bars, runs and scope, so it is available
    to GOAL-ENDO-001 and to every record that has priced this arm at toy scale.

