  assumptions:
    - >-
      Ordinary, prime-order, non-anomalous curves over F_p with declared
      embedding degree and twist rows, per the RQ's own constraints. N prime is
      load-bearing twice: it makes gcd(deg phi, N) = 1 automatic for every
      small-degree isogeny (so transport preserves k) and it makes the whole
      class prime-order at once.
    - >-
      Class completeness is CERTIFIED against hurwitz_class_number, never
      assumed. A shortfall makes every measured beta a lower bound only and is
      blocking.
    - >-
      kappa, the charged cost of one Velu step in group-addition equivalents,
      is MEASURED per bit size and per ell, not assumed. All crossover numbers
      in (B) are functions of it and are reported as such.
    - >-
      No uncharged precomputation, memory or serialization: the bidirectional
      frontier tables are charged at their peak size, and the crossover is
      reported both at operation-count parity and at Wiener full-cost parity
      (the frontier is Theta(p^{1/4}) entries, so full cost is
      p^{1/3+o(1)} against rho's p^{1/2}).
    - >-
      The record does NOT assume Galbraith's algorithm is implementable here.
      The measured object is elementary bidirectional search; the external
      theorem supplies the exponent to compare against, and a measured beta
      away from 1/4 falsifies this record's use of it, not the theorem.

  object_first_candidate:
    tracked_object: >-
      The class-joining path: an ordered list of Velu kernel generators taking
      a SPECIFIED source vertex to a SPECIFIED target vertex of one
      F_p-isogeny class, together with the transported pair (phi(P), phi(Q)).
    lossiness: >-
      GENUINELY LOSSY, and the discard is the point. The path retains the
      kernel data and discards every intermediate curve's coefficients, every
      point on it, and the entire subgraph explored to find it. It cannot be
      inverted to the search that produced it. The discard is compatible with
      the target's operation because transport is a group homomorphism on G
      (T1): composing kernels composes the maps, so the retained part
      propagates deterministically and the transported instance is exactly an
      instance on the target curve. CONTRAST WITH THE OBJECT THIS REPLACES: the
      naive "walk that crosses curves" state is NOT lossy - IDEA-20260901-e3ffc2
      shows its transport-equivalence quotient is in bijection with G, so it is
      a change of coordinates. This record's object survives that test because
      the explored subgraph is discarded, not the state.
    propagation: >-
      Exact under composition and under transport. One-step propagation is
      defined and measurable: extending a frontier by one ell-isogeny is one
      charged Velu step and multiplies the frontier by (ell + 1 - branching
      already visited), which is what STAGE 2 counts.
    survival_score: >-
      Survives the whole computation by construction. What is measured is not
      survival but the charged exponent of building it, which is the record's
      entire content.

  null_object_control: >-
    NULL-1, UNIDIRECTIONAL SEARCH (blocking, primary). Same code, same charge
    model, frontier expanded from one end only. Must show beta' ~ 1/2 (it must
    explore the class), establishing that the measured beta ~ 1/4 comes from
    the bidirectional structure and not from the implementation.
    NULL-2, DIFFERENT-CLASS TARGET (blocking). Source and target in different
    classes at the same bit size. No path exists; the search must exhaust both
    classes and report FAILURE with its full charge. A reported "path" here
    voids every number.
    NULL-3, SINGLETON CLASS. Hurwitz class number 1: source = target, charged
    cost must be exactly zero Velu steps. The estimator's zero point.
    POSITIVE CONTROL, PLANTED SHORT PATH: a target chosen as the image of a
    known length-3 path. The search must find a path of length at most 3 and
    the charged cost must be within a factor 2 of three Velu steps; a search
    that pays sqrt(M) here is not exploiting the meeting and its beta is void.
    TRANSPORT CERTIFICATE (blocking): every transported instance verified by
    verify_transport AND by an independent recomputation of [k]phi(P) ==
    phi(Q) on the target curve using code that does not call the path finder.
    MATCHED PARETO ROWS: charged rho (KN-TECH-006 convention) and charged BSGS
    with memory charged (KN-TECH-031) on both source and target, per RQ
    constraint.
    CM CELLS: on classes containing a j = 0 or j = 1728 vertex the
    automorphism-discounted rho (KN-TECH-018) is the baseline the composed
    lane must be compared against, not plain rho.
    DECAY PARAMETER: p. T/S must FALL as p^{-1/4}. A flat ratio across four bit
    sizes is an artifact tell and the crossover is withdrawn.

  relation_to_prior:
    - >-
      IDEA-20260901-e3ffc2 (NEAREST). It reads the transfer method
      per-POPULATION, pools m instances across a class into one Kuhn-Struik
      shared distinguished-point store, and explicitly declares T5 -- reaching
      a SPECIFIED classmate -- an OPEN gate that its toy design sidesteps by
      globally choosing E_0 in an enumerated class; it labels its own measured
      transport term a LOWER bound for that reason. EXACT DELTA: this record
      supplies a published answer to T5 (rigorous Otilde(q^{1/4})), measures
      its exponent directly at m = 1, and shows the charge is a p^{-1/4}
      penalty rather than a constant. e3ffc2's observable is the amortisation
      ratio A(m) across m targets; this record's observable is the charged
      exponent beta of joining two specified vertices, which e3ffc2 assumes
      away. The two compose: with beta = 1/4 e3ffc2's transport term T is
      asymptotically negligible and its READING 1 follows without the m-ladder.
    - >-
      IDEA-20260829-20b05f. Closes the census COLUMN SET to {j, f, |Aut|} by
      Tate and measures the within-class spread S(C) as the arm's PRE-CHARGE
      ceiling. EXACT DELTA: that record bounds the PRIZE and explicitly leaves
      the CHARGE to EV-ENDO-10109d's toy figures; this record measures the
      CHARGE's exponent and shows the toy figures sit below their own
      crossover. Nothing here contradicts the column closure; this record uses
      it (f is the only reachable invariant that matters, which is why the
      surface is the right destination).
    - >-
      IDEA-20260829-2dc43c. Counts the |Aut| > 2 cell at 10 curves per prime
      and derives the population discount 1 + 3.02/p. EXACT DELTA: that is a
      CURVE-LEVEL count; this record shows that with free transport the
      operationally relevant object is the CLASS, whose surface may carry
      |Aut| > 2 even when no member the census sampled does.
    - >-
      IDEA-20260829-172151 and IDEA-20260829-34f3ed. Audit the lane's decision
      rule (Type II error) and its finite-size bias respectively. Both concern
      the rho instrument's statistics at fixed structure. This record measures
      a DIFFERENT algorithm's charged exponent and needs no calibration
      constant, because the comparison T/S is taken within a bit size.
    - >-
      IDEA-20260901-753636. Measures the rho aperture x mod r at fixed N. No
      overlap: the path finder has no aperture and no walk.
    - >-
      IDEA-20260901-3e68ad. Closes symmetry quotients of ONE curve up to
      translation. This record never quotients; it moves between curves.
    - >-
      IDEA-20260901-6b63a4 (different RQ, GOAL-ENDO-001). Its T1 is USED here,
      not duplicated: it is what caps the composed lane at
      sqrt(|Aut(E_surface)|/2) once transport is free.

  proof_search_map:
    bottleneck: >-
      The step "reach a SPECIFIED curve of the class". Every isogeny-transfer
      proposal in this RQ passes through it; IDEA-20260901-e3ffc2 names it T5
      and declares it open; no internal record measures its exponent, and the
      external ingredient in (A) is a published bound on exactly it.
    baseline_embedding:
      parameter_slice: >-
        (i) The singleton class (Hurwitz class number 1): source = target, zero
        Velu steps, T/S = 0 exactly. (ii) The unidirectional search, which must
        reproduce the class-size exponent beta' = 1/2 and therefore recover the
        pre-existing internal picture in which transport is expensive. The old
        method is embedded as the beta' = 1/2 boundary of the fitted family.
      reproduction_check: >-
        Frozen fixture: at 16 bits, one declared class with certified Hurwitz
        count, one declared vertex pair and one seed; the committed path,
        charged step count and transport certificate must be reproduced
        byte-for-byte on re-run. Symbolic check: the crossover algebra
        b*(kappa) must be re-derivable by hand from T/S = kappa*sqrt(M)/
        (0.886*sqrt(N)) and M = H(4p - t^2), with sum_t H = 2p asserted against
        harness/isogeny_class.hurwitz_class_number on every enumerated prime.
    observation_collision:
      observable: the fitted charged exponent beta of specified-vertex joining
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. beta ~ 1/4 is produced BOTH by a
        genuine bidirectional meeting AND by a pipeline that silently picks
        targets from an already-explored frontier (a target sampled near the
        source has a short path regardless of algorithm). SEPARATING CONDITION,
        BLOCKING: targets are drawn uniformly from the certified class and the
        empirical path-length distribution must match the class diameter's,
        AND the unidirectional null on the SAME pairs must show beta' ~ 1/2. A
        pipeline whose two searches agree has not implemented two algorithms.
        Second collision, also expected: T/S < 1 is produced both by a genuine
        crossover and by an undercharged Velu step; the measured kappa is
        reported separately and the crossover is reported as a function of it,
        never as a bare bit size.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "which lane should this RQ prioritise" with "what is the
          charged exponent of the transfer primitive, and where is its
          crossover against rho".
        predicted_gain: >-
          Converts a two-lane comparison requiring both lanes' full experiments
          into one exponent fit over four bit sizes, and answers the decision
          target with a number rather than a preference.
      - transform: boundary_lift
        proposed_object: >-
          The unidirectional search (beta = 1/2, the program's implicit
          incumbent) enlarged to the bidirectional family, with a strict inward
          improvement to beta = 1/4 to be demonstrated, not merely asserted.
        predicted_gain: >-
          A strict exponent gap of 1/4 in the transport primitive, measured as
          a ratio against the incumbent on identical pairs rather than
          extrapolated.
    quantifier_order: >-
      CLAIMED: FOR ALL ordinary prime-order non-anomalous classes C in the
      tested set and FOR ALL ordered vertex pairs drawn uniformly from C, THERE
      EXISTS a fitted (c, beta) with the measured charged cost inside the
      reported CI. EXPLICITLY NOT CLAIMED: any bound at cryptographic size (the
      external theorem claims that and this record does not verify it); any
      statement about classes whose Hurwitz certificate failed; any claim that
      the elementary bidirectional search achieves Galbraith's constant or his
      tall-volcano case.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested classes, bit sizes and charge model, joining two
        specified vertices costs c*p^{beta} with beta = beta_hat +/- CI, and
        the crossover against charged rho occurs at b* = b*_hat +/- CI." It can
        NEVER certify that the transfer arm is VALUABLE (the prize is
        20b05f's S(C) and a22049 derives it to be ~1), that any exponent of the
        ECDLP moves, or anything at cryptographic size.
      nearby_object_control: >-
        THE SUPERSINGULAR CLASS OVER F_{p^2}, where the class has size
        Theta(p) rather than Theta(sqrt p): the same search must show
        beta ~ 1/2 there, since sqrt(class size) = sqrt(p). A method returning
        beta ~ 1/4 on both has not identified the load-bearing structure (the
        ordinary class size Theta(sqrt p) forced by the Hurwitz identity) and
        every number is void.
    proof_obligations:
      - claim: "sum_t H(4p - t^2) = 2p, hence mean class size sqrt(p)/2."
        responsibility: size
      - claim: "Bidirectional search over M vertices costs Theta(sqrt M) charged steps."
        responsibility: runtime
      - claim: "Transport along an F_p-isogeny of degree coprime to N preserves k."
        responsibility: correctness
      - claim: "Frontier memory is Theta(p^{1/4}) and is charged at peak."
        responsibility: memory
      - claim: "The unidirectional null returns beta' ~ 1/2 on the same pairs."
        responsibility: strictness
      - claim: "Class enumeration matches the Hurwitz count on every tested class."
        responsibility: feasibility
      - claim: "No cryptographic-scale claim is asserted; the external bound is cited, not verified."
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        M1 -- fitted charged exponent beta in T(p) = c*p^{beta} for
        bidirectional specified-vertex joining, 16/20/24/28 bits, at least 3
        certified classes and 24 vertex pairs per bit size
      direction: lower
      minimum_effect: >-
        Predicted beta in [0.18, 0.32] with CI half-width below 0.06, against
        the unidirectional null's beta' in [0.42, 0.58]. A measured beta above
        0.40 refutes this record's use of the external exponent AT TOY SCALE
        and is reported as such (it does not refute the cited theorem, which
        uses machinery this test does not implement).
    - metric: >-
        M2 -- crossover bit size b* at which charged bidirectional transport
        first falls below charged rho on the same curves, at the MEASURED kappa
      direction: different
      minimum_effect: >-
        Predicted b* in [14, 26] bits, i.e. INSIDE the RQ's declared window.
        A b* above 36 bits is the opposite and equally decisive outcome: the
        RQ's declared bit range structurally cannot observe its own transfer
        arm, which must then be recorded as a scoping fact with b* as the
        number, and every toy null on the arm re-scoped accordingly.
    - metric: >-
        M3 -- measured kappa, the charged cost of one Velu step in
        group-addition equivalents, per ell in {2,3,5,7} and per bit size
      direction: different
      minimum_effect: >-
        Reported with CI. Predicted to grow no faster than linearly in ell and
        to be independent of p within 20 percent. A kappa growing with p makes
        the crossover a moving target and the fit must be redone in
        Velu-step units only.
    - metric: >-
        M4 -- ratio T/S across the four bit sizes
      direction: lower
      minimum_effect: >-
        Must be strictly decreasing across all four rungs. A non-monotone or
        flat sequence is the section-3 artifact tell on this record's own
        instrument; the crossover is withdrawn and only the raw charges survive.
    - metric: >-
        M5 -- transport certificate pass rate
      direction: different
      minimum_effect: >-
        Exactly 1.000 over every transported instance. Any failure voids the
        run as an infrastructure outcome, never as mathematical evidence.
    - metric: >-
        M6 -- composed-lane charged work on classes whose SURFACE has
        Delta_K in {-3, -4}, versus plain rho on the source vertex
      direction: lower
      minimum_effect: >-
        Predicted ratio 1/sqrt(3) = 0.577 (resp. 1/sqrt(2) = 0.707) plus the
        transport charge, i.e. the automorphism ceiling of KN-TECH-018 reached
        from a vertex that does not itself have the automorphism. A measured
        ratio materially below 0.577 is not possible under this record's
        mechanism and is treated as an instrument fault pending review.

  minimal_test:
    design: >-
      STAGE A (zero compute, one to two hours): the Hurwitz mean-class-size
      derivation, the crossover algebra, and the b*(kappa) table. Reviewable
      with no runs and it alone settles whether this RQ can observe the arm.
      STAGE B (low compute, THE CHEAPEST VALID DISCRIMINATOR): 16 and 20 bits
      only, three Hurwitz-certified classes each, 24 vertex pairs, both
      searches, all blocking nulls and the planted-short-path positive control,
      plus the matched rho and BSGS rows. TWO BIT SIZES AND TWO ALGORITHMS
      ALREADY FIX THE SIGN OF beta - beta' AND BRACKET b*. STAGE C (low-medium
      compute, conditional on every blocking control passing): 24 and 28 bits
      by class construction rather than full enumeration. If any Hurwitz
      certificate fails, STOP; no exponent may be reported from an
      uncertified class.
      COST AT THE DECLARED TOY SCALES. 16 bits: enumerate_curves over ~1.3e5
      curves, classes of ~128 vertices, sqrt(M) ~ 11 Velu steps per join, rho
      ~227 steps; minutes, tens of MB. 20 bits: ~2.1e6 curves, classes ~512,
      ~22 steps per join, rho ~900 steps; under an hour, low hundreds of MB.
      24 bits: no full enumeration; class construction ~2048 vertices, ~45
      steps per join, rho ~3.6e3 steps. 28 bits: ~8192 vertices, ~90 steps per
      join, rho ~1.5e4 steps. Whole ladder single-digit CPU-hours, peak memory
      dominated by the 28-bit vertex table at O(10^4) records.
    controls:
      - unidirectional search on identical pairs, must show beta' ~ 1/2 (blocking)
      - different-class target, must report failure with full charge (blocking)
      - singleton class, exactly zero Velu steps (blocking)
      - planted length-3 path, must be found in at most 3 steps (blocking)
      - Hurwitz completeness certificate on every class (blocking)
      - transport certificate by verify_transport AND an independent recomputation (blocking)
      - matched charged rho row per curve (KN-TECH-006 convention)
      - matched BSGS row with memory charged (KN-TECH-031)
      - automorphism-discounted rho on CM cells (KN-TECH-018)
      - KN-TECH-034 screens; anomalous and small embedding degree excluded from primary cells
      - frozen cost-model hash asserted identical across all rungs
    required_metrics:
      - per class - enumerated vertex count versus hurwitz_class_number, ell set used
      - per pair - charged Velu steps and group-addition equivalents, bidirectional and unidirectional, path length, peak frontier size
      - fitted beta, beta', c, c' with bootstrap CIs and residual curvature test
      - measured kappa per ell per bit size with CI
      - T/S per rung and the fitted crossover b* with CI
      - matched rho and BSGS charges and memory per curve
      - composed-lane ratio on Delta_K in minus-3 and minus-4 classes
      - pass or fail of every blocking control; wall clock and peak memory per stage

  falsification_conditions:
    - >-
      F1. Measured beta above 0.40 with all controls passing. The elementary
      bidirectional search does not realise the q^{1/4} exponent at toy scale;
      this record's crossover is withdrawn, the cited theorem is untouched, and
      the forward direction is why the toy graph does not behave as an expander
      of the expected size.
    - >-
      F2. The unidirectional null also returns beta ~ 1/4. Two algorithms have
      not been implemented; every exponent is void.
    - >-
      F3. Any Hurwitz certificate fails, or any transport certificate fails.
      Blocking infrastructure outcome under AGENTS.md rule 3; NOT negative
      mathematical evidence.
    - >-
      F4. b* measured inside [14, 26]. The transfer arm's charge crosses below
      the rho solve INSIDE the RQ's declared window; every toy-scale closure of
      the arm (EV-ENDO-10109d's 1.5x-21x, IDEA-20260830-a22049's composition)
      is confirmed correct AND confirmed scoped strictly below its crossover,
      and the decision target resolves as (C).
    - >-
      F5. b* measured above 36 bits. The RQ cannot observe its own transfer arm
      within its declared bit_sizes. This is a decisive scoping result, not a
      failure, and it must be recorded with b* as the number and with the
      declared bit range named as the binding constraint.
    - >-
      F6. The supersingular nearby-object control also returns beta ~ 1/4. The
      method is insensitive to class size and has not identified the
      load-bearing structure; all numbers void.
    - >-
      F7. Budget exhaustion before two rungs complete. INFRASTRUCTURE outcome.

  confounders:
    - >-
      TARGET SELECTION IS THE DOMINANT FAILURE MODE. If targets are drawn from
      the search's own frontier, or from a fixed short walk, beta collapses for
      reasons unrelated to bidirectionality. Targets must be drawn uniformly
      from the certified vertex list, the draw recorded, and the empirical path
      length compared with the class diameter.
    - >-
      UNCHARGED VELU. A Velu kernel construction is not one field operation.
      kappa must be measured, not assumed, and reported per ell; an undercharged
      step manufactures a crossover.
    - >-
      UNCHARGED FRONTIER MEMORY. The bidirectional table is the whole mechanism
      and the RQ forbids uncharged memory. Peak frontier size is reported and
      the crossover is given twice: at operation parity and at Wiener full-cost
      parity.
    - >-
      SMALL-ell GENERATION FAILURE. If {2,3,5,7} does not generate the class
      group quotient, the constructed class is a proper subgraph, M is
      understated and beta is biased down. The Hurwitz certificate is the only
      defence and is blocking.
    - >-
      READING THIS AS AN ATTACK. Free transport plus a sqrt(3) ceiling is still
      a constant-factor lane. No security bits are reduced and the record says
      so in every summary.
    - >-
      ABSTRACT-LEVEL DEPENDENCE. The external exponent was read from search
      summaries. STAGE 2 measures its own exponent for exactly this reason, and
      F1 is written so that a toy-scale miss does not silently propagate as a
      claim about the cited theorem.

  interpretation_limits:
    - "claim_tier: toy. 16-28 bits. No transfer to 32, 36 or cryptographic size is licensed by any measurement here."
    - >-
      Scoped to ordinary, prime-order, non-anomalous F_p classes with declared
      screens; the supersingular control exists to show how fast the class-size
      hypothesis fails outside.
    - >-
      The cited Otilde(q^{1/4}) is retrieved at ABSTRACT LEVEL ONLY. It is used
      to motivate the exponent tested, never as evidence for a measured value,
      and its hypotheses (which volcano shapes, which constants, what memory)
      were not read.
    - >-
      A crossover is a statement about CHARGE, not about VALUE. The transfer
      arm's prize remains the within-class spread, which internal records
      derive to be ~1. Free transport of nothing is still nothing.
    - >-
      Per KN-OPEN-019 this program has no object enumeration for the ECDLP;
      this record prices one primitive of one RQ, not a taxonomy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        CLASS-SIZE LAW. For the tested ordinary prime-order traces t at bit
        size b, the complete F_p-isogeny class has M = H(4p - t^2) vertices with
        H the Hurwitz-Kronecker class number, and the empirical mean of M over
        uniformly drawn admissible t satisfies E[M] = sqrt(p)/2 * (1 + o(1)),
        uniformly over 16 <= b <= 28.
      rigorous_support: >-
        Pairs (i) the rigorous counting theorem - Deuring's theorem that the
        number of F_p-isomorphism classes with trace t equals H(4p - t^2), and
        the Hurwitz-Kronecker mass identity sum_t H(4p - t^2) = 2p, which is
        already implemented and used as a completeness certificate in this
        program (harness/isogeny_class.hurwitz_class_number; EV-ICINV-6b6264
        records H(15104) = 138 at p = 4001, t = 30, matched exactly by a
        138-vertex enumeration) - with (ii) the classical distribution
        statement it imitates, the average order sqrt(|D|) of class numbers of
        discriminant D via the class number formula h(D) ~ sqrt(|D|) L(1, chi_D)
        with Siegel's bounds. The heuristic step is only that the traces
        SELECTED by the prime-order screen are not atypical for H.
      validation_plan: >-
        SAMPLING - exhaustive at 16 and 20 bits: every admissible trace of every
        tested prime, with M obtained BOTH by enumeration and by
        hurwitz_class_number, and the two required to agree exactly.
        COMPARISON DISTRIBUTION - the empirical mean and CDF of M/sqrt(p)
        against the predicted mean 1/2 and against the class-number
        distribution restricted to prime-order traces. TAIL CHECKS - the
        largest and smallest M over all tested traces against the predicted
        extremes of that many draws; a singleton class must appear at the
        predicted rate. SAMPLED PARAMETERS RECORDED - prime list, full trace
        list, prime-order flags, ell set, enumeration mode (full versus
        constructed), harness commit. TRANSFER ASSUMPTION, STATED - the
        prime-order conditioning is checked empirically at 16-20 bits and
        assumed, not proved, at 24-28 bits; the assumption is named and its
        failure would bias M and therefore beta.
    - id: H2
      statement: >-
        EXPANDER MEETING. For the tested classes and the ell-set {2,3,5,7}, the
        isogeny graph mixes rapidly enough that two independent
        breadth-first frontiers of size s each meet after s = Theta(sqrt M)
        vertices have been expanded on each side, i.e. the meeting obeys the
        birthday law on M vertices with a constant independent of the class.
      rigorous_support: >-
        Pairs (i) the rigorous fact that the ell-isogeny graph of an ordinary
        class is a Cayley graph of the class group acting on the class (Kohel;
        the volcano structure), together with the expander property under GRH
        used by Jao-Miller-Venkatesan for rapid mixing, with (ii) the classical
        birthday-collision law for two uniformly distributed subsets of an
        M-element set. The heuristic step is that BFS frontiers, which are not
        uniform subsets, behave like uniform ones for the purpose of meeting.
      validation_plan: >-
        SAMPLING - 24 uniformly drawn vertex pairs per class, per bit size,
        recording the exact frontier sizes at meeting. COMPARISON DISTRIBUTION -
        empirical CDF of (frontier size at meeting)/sqrt(M) against the
        Rayleigh-type birthday law, by Kolmogorov-Smirnov per class. TAIL
        CHECKS - the largest observed frontier against the predicted maximum of
        24 draws; the planted-short-path control must sit in the extreme lower
        tail by construction. NEGATIVE CONTROL - the unidirectional search,
        whose frontier at meeting must be Theta(M), not Theta(sqrt M).
        SAMPLED PARAMETERS RECORDED - class ids, M, pair draws, ell set, seeds.
        TRANSFER ASSUMPTION - none beyond 28 bits; the GRH-conditional mixing
        statement is cited for direction only and is not used to support any
        measured number.

  target_complexity:
    time_exponent: >-
      1/2 for the ECDLP, UNCHANGED, and no exponent of the ECDLP is claimed to
      move. What this record places an exponent on is the TRANSFER PRIMITIVE:
      target 1/4 in p for joining two specified vertices of an ordinary class
      (cited rigorous Otilde(q^{1/4}); measured here as beta), against the 1/2
      that this program has implicitly been charging. The composed lane solves
      at 0.886*sqrt(N)/sqrt(|Aut(E_surface)|/2) >= 0.886*sqrt(N)/sqrt(3),
      i.e. exponent 1/2 with a constant at most sqrt(3).
    memory_exponent: >-
      The transfer primitive is NOT memory-free: the bidirectional frontier is
      Theta(p^{1/4}) curve records, against rho's O(1). Charged at Wiener's
      wiring-aware rate (KN-TECH-031) its full cost is M^{2/3} = p^{1/3+o(1)},
      still o(p^{1/2}). Reported both ways; the O(1)-memory claim of the rho
      baseline is preserved for the SOLVE only.
    best_known: >-
      Solve - parallel rho at 0.886*sqrt(N) with O(1) memory (KN-TECH-006);
      automorphism-discounted rho at most sqrt(6) better (KN-TECH-018), the
      ceiling attained per EV-ENDO-10109d; BSGS at 2*sqrt(n) time, sqrt(n)
      memory, n^{2/3+o(1)} full cost (KN-TECH-031); generic lower bound
      Omega(sqrt p) and S*T^2 = Omega~(n) (KN-TECH-005).
      Transfer primitive - Otilde(q^{1.5}) worst case (Galbraith 1999),
      polynomial-time to a RANDOM classmate under GRH (JMV 2005), rigorous
      Otilde(q^{1/4}) to a SPECIFIED classmate in the flat and small-crater
      cases (Galbraith 2025, retrieved at abstract level).
    hidden_overhead: >-
      Disclosed. (i) The Otilde hides the polylog of Galbraith's construction
      and its constant, neither of which was read; the elementary search
      measured here has its own constant kappa which is measured, not hidden.
      (ii) Frontier memory is real and is charged; the crossover moves right
      under full-cost accounting and both numbers are reported. (iii) The toy
      design constructs classes with a fixed small ell-set; a class not
      generated by {2,3,5,7} is dropped with the shortfall recorded, which
      biases the surviving sample toward well-generated classes.
    tradeoff_note: >-
      The SOLVE remains on the van Oorschot-Wiener surface exactly where
      KN-TECH-006 places it; the transfer adds a one-off p^{1/4} time and
      p^{1/4} memory term that is embarrassingly parallel over vertex pairs and
      vanishes relative to the solve above b*. Nothing here shifts the
      S*T^2 = Omega~(n) preprocessing frontier of KN-TECH-005.

  dominated_by: >-
    AS AN ATTACK: none is proposed; every Pareto row checked individually.
    TIME, single instance - parallel rho at 0.886*sqrt(N) (KN-TECH-006)
    dominates, since at m = 1 this record IS rho on a different vertex.
    MEMORY - rho at O(1) dominates; this record's primitive costs p^{1/4}
    memory and is strictly worse on that axis.
    MEMORY-RICH - BSGS at sqrt(n) memory and n^{2/3} full cost (KN-TECH-031)
    dominates the memory-rich corner and is not approached.
    CM-SPECIFIC - automorphism-discounted rho (KN-TECH-018) dominates and is
    exactly the ceiling the composed lane reaches, never beats.
    SPECIAL-FAMILY - anomalous transfer (KN-TECH-033) and MOV/Frey-Ruck
    (KN-TECH-032) dominate on their own families, which the RQ's screens
    exclude from primary cells.
    DATA/QUERIES - one instance consumed, one solved; no query advantage.
    LOWER BOUND - the generic bound Omega(sqrt p) (KN-TECH-005) is met, not
    approached from below.
    AS A MEASUREMENT OF THE TRANSFER PRIMITIVE: dominated by Galbraith 2025
    itself, which claims a rigorous Otilde(q^{1/4}) that this toy experiment
    only approximates with elementary bidirectional search; this record does
    not claim priority over it and cites it as the incumbent. Internally the
    nearest incumbents are IDEA-20260901-e3ffc2 (dominates on the population
    accounting; dominated here on T5, which it declares open) and
    EV-ENDO-10109d (dominates on measured toy transport charge; dominated here
    on the exponent of that charge). External priority is not claimed and
    novelty_status is unverified accordingly.

  sota_delta: >-
    ECDLP time exponent delta 0; ECDLP memory exponent delta 0; data/query
    delta 0; security bits reduced 0. NON-ZERO DELTAS, QUANTIFIED.
    (i) TRANSFER PRIMITIVE EXPONENT: 1/2 (this program's implicit charge, and
    what unidirectional search costs) -> 1/4 (measured target; cited rigorous
    bound), a delta of 1/4 in the exponent of the arm the RQ names. At
    p = 2^256 that is 2^128 versus 2^64 charged operations for the same move.
    (ii) SCOPE CORRECTION: the internal closure of the transfer arm rests on a
    ratio that decays as p^{-1/4}; the crossover b* is predicted in [14, 26]
    bits, so EV-ENDO-10109d's 1.5x-21x at p = 50021-60013 (16.6 bits) is
    measured within one to ten bits of its own crossover. The delta is not
    that the closure is wrong but that its scope was never stated in the
    variable that governs it.
    (iii) DECISION TARGET: replaces a two-lane comparison requiring both lanes'
    full experiments with a single exponent fit over two to four bit sizes,
    estimated at single-digit CPU-hours, and yields a determinate answer
    (transfer is an enabler, orbit is the value, ceiling sqrt(3)) rather than a
    ranking.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that beta lands in [0.18, 0.32] (residual risk: the toy ell-set gives
    a graph whose local structure defeats naive bidirectional BFS, or the
    charge model makes frontier maintenance dominate). 0.7 that b* lands inside
    the declared 16-36 window at the measured kappa. 0.95 that the
    unidirectional null returns beta' ~ 1/2. The most likely honest headline is
    "specified-vertex joining is measured at p^{0.25 +/- 0.04} charged, crossing
    below charged rho at b* = 20 +/- 4 bits, so the transfer arm's charge is a
    decaying penalty and every existing closure of that arm is scoped below its
    own crossover."

