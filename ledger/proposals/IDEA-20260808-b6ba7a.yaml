idea:
  id: IDEA-20260808-b6ba7a
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  title: Subexponential in WHAT? Information-set decoding is ALREADY subexponential in n at
    Classic McEliece's sublinear weight, so the 2026 line's headline word is only news in
    some parameterizations - fix the comparison parameter and pre-register the single number
    in the unread paper that decides the goal
  class: control
  claim: 'Classic McEliece sets n - k = m t with m about log2(n), so t = Theta(n / log n)
    and the relative weight t/n tends to zero. In that regime Prange''s expected iteration
    count is C(n, t) / C(n - k, t), whose base-2 logarithm is bounded below by t log2(n /
    (n - k)) (this is H-MCE-efa9b2''s H1-C, already derived in-repo), i.e. 2^{Theta(t)} =
    2^{Theta(n / log n)}. THAT IS SUBEXPONENTIAL IN n. CLAIM (A): therefore "a heuristic subexponential
    attack on the McEliece cryptosystem" (KN-LIT-7c4620) is NOT, on its face, a statement
    that the attack beats ISD - it is a statement whose content depends entirely on which
    parameter the exponent is subexponential in, and at least one natural reading (subexponential
    in n) is a property ISD already has. CLAIM (B): there are exactly three parameterizations
    a code-based complexity claim can live in - the code length n, the codimension m t (equivalently
    the public-key dimension count), and the security parameter lambda = t log2(n / (n - k))
    - and the three give qualitatively different verdicts, which can be tabulated before the
    paper is read. CLAIM (C), THE DELIVERABLE: for any claimed cost of the form 2^{c x^alpha
    (log x)^beta (1 + o(1))} in whichever parameter x the paper uses, the crossover against
    the charged ISD baseline at each standardized set is determined almost entirely by the
    CONSTANT c, which asymptotic statements suppress; so one can compute, NOW, the threshold
    C*(set) such that the attack beats charged ISD at that set if and only if c <= C*. That
    converts the reading task from "understand the paper" into "extract one number and compare",
    and it is executable with ZERO figures from the unread text.'
  mechanism: 'The whole risk this goal faces is a category error: reading "subexponential"
    as "better than exponential ISD" when the baseline is itself subexponential in the same
    variable. The mechanism that prevents it is a change of comparison parameter, done once
    and written down. Concretely: express both the baseline and the claimed cost as functions
    of a single declared variable; note that under x = n both are subexponential and the comparison
    is decided by alpha and then by c; under x = lambda the baseline is exactly 2^{lambda(1+o(1))}
    by construction, so any genuinely subexponential-in-lambda attack is a break of the design
    rationale; under x = m t the baseline is 2^{Theta(m t / m)} = 2^{Theta(t)} and the comparison
    depends on m. Then, for each declared reading, invert the inequality "claimed cost < charged
    baseline" for the constant c at the four ISO-scoped parameter sets, which is exact rational
    arithmetic in the baseline plus one symbolic inversion.'
  why_not_a_renamed_known_approach: This is not a reading of KN-LIT-7c4620 - it consumes nothing
    from it, which is precisely why it is executable under RQ-MCE-e65b3c's constraint that
    no experiment be designed until that text is obtained. It is not H-MCE-efa9b2, which builds
    the accounting bases and the Prange baseline; this consumes that baseline and asks a different
    question about a different object, the claimed attack's parameterization. It is not the
    sub-linear-weight collapse of KN-LIT-fa9bc8, which is about ISD variants relative to each
    other; this is about ISD as a class relative to the word "subexponential".
  predictions:
  - observable: log2 of the exact Prange expected-iteration count at the four ISO-scoped sets,
      expressed in each of the three parameterizations.
    metric: The fitted alpha in 2^{Theta(x^alpha)} for x = n, m t, lambda.
    predicted: alpha strictly below 1 for x = n (because t = Theta(n / log n)), alpha equal
      to 1 for x = lambda by construction. If alpha comes out 1 for x = n, the sublinear-weight
      reading is wrong and claim (A) collapses - a clean and cheap falsification.
  - observable: C*(set), the constant threshold at which a claimed subexponential cost crosses
      charged ISD.
    metric: Dimensionless constant, per set, per parameterization, per assumed (alpha, beta).
    predicted: A small number in the x = n, alpha = 1/2 reading - my prior is that C* lands
      well below the constants typical of algebraic-attack complexity statements, so the attack
      would NOT bite at n = 6960 unless its constant is unusually small. Stating a numeric
      prior for C* before computing it would be fabrication and is deliberately not done.
  - observable: Sensitivity of C* to the baseline's accounting basis.
    metric: Spread of C* across H-MCE-efa9b2's declared bases B1 and B5.
    predicted: Non-trivial spread, because charging memory raises the baseline and therefore
      RAISES C*, making the attack easier to clear the bar. This is the one direction in which
      honest memory-charging works AGAINST the defender and it must be reported, not buried.
  minimal_test: Pure exact-rational computation, no external text needed. (1) Evaluate C(n,
    t) / C(n - k, t) exactly at the four ISO-scoped sets and confirm H-MCE-efa9b2's H1-C lower
    bound and its stated sub-5-per-cent gap independently. (2) Fit and tabulate the effective
    alpha in each of the three parameterizations across the four sets plus a synthetic family
    extended to n = 2^14, 2^15 at fixed m t / n, to show the trend rather than four points.
    (3) Symbolically invert the crossover inequality for c and tabulate C*(set) for (alpha,
    beta) in a declared grid. Budget under 200 core-seconds.
  controls:
  - BASELINE REPRODUCTION. Part (1) must reproduce H-MCE-efa9b2's H1-C independently, from
    the definition rather than by importing its numbers. A disagreement means one of the two
    derivations is wrong and nothing downstream may be reported until it is resolved.
  - DEGENERATE-PARAMETERIZATION NULL. Apply the same tabulation to a code family with LINEAR
    weight (t proportional to n at fixed rate); there the baseline must come out exponential
    in n in every parameterization. A family where the answer does not change with the parameterization
    confirms the instrument detects a real ambiguity rather than manufacturing one.
  - TWO-SIDED C* CHECK. Compute C* both as "attack beats baseline" and as "baseline beats
    attack" and confirm they agree at the boundary; an asymmetry indicates an algebra error
    in the inversion.
  confounders:
  - Four parameter sets are too few to fit an exponent; the synthetic extension is a modelling
    choice and must be declared, not presented as data.
  - beta (the log-power) and the o(1) interact strongly at n of a few thousand, so C* is sensitive
    to how the o(1) is truncated; report C* as a band across truncation conventions rather
    than a single number.
  - If the 2026 line's complexity is stated in a parameter this analysis does not anticipate
    (for instance q, or the extension degree m alone), the tabulation must be extended rather
    than forced into one of the three.
  falsification_conditions:
  - The exact baseline turns out NOT to be subexponential in n at the ISO sets, killing claim
    (A) outright.
  - C* is so insensitive to the parameterization that all three readings agree, in which case
    the ambiguity is real but harmless and the record's value drops to a footnote - an honest
    and cheap negative.
  - The paper, once obtained, states its complexity in a form that makes the crossover independent
    of a single constant (for example a stated concrete cost table), in which case the pre-registration
    is superseded by better information, which is the outcome the goal actually wants.
  interpretation_limits: This says nothing about whether KN-LIT-7c4620's attack is correct,
    nothing about its heuristics, and nothing about Classic McEliece's security. It produces
    a decision rule and a baseline tabulation. RQ-MCE-e65b3c's TOY claim-tier ceiling is untouched,
    and the record explicitly does not characterise an unread paper's claims - it characterises
    what its headline word could mean.
  assumptions:
  - n - k = m t with m about log2(n) at all standardized sets, consistent with H-MCE-31d438's
    exact redundancy rationals.
  - Prange's expected-iteration count is the right baseline anchor for the parameterization
    question, with better variants folded in through C1-13's optimum.
  heuristic_assumptions:
  - id: HA-1
    statement: Across the standardized family, m grows as log2(n) and t / n tends to zero
      at the observed rate, so the asymptotic family the standardized sets belong to has t
      = Theta(n / log n) rather than t = Theta(n).
    rigorous_ingredient: n - k = m t is exact by construction of the Niederreiter/Goppa parameters,
      and n <= 2^m forces m >= log2(n); the four corpus-sourced redundancy rationals pin m
      t / n at 24/109, 13/48, 52/209, 1547/6960, 13/64.
    distribution_imitated: The standard sub-linear weight regime of KN-LIT-fa9bc8, which is
      the classical statement that McEliece lives at t about n / log n rather than at a constant
      rate.
    validation_route: Direct arithmetic on the five sets - no sampling. The check is whether
      m t / n is decreasing and m / log2(n) is near 1 across the family; report both columns
      and let the reader see the trend rather than asserting it.
    tail_checks: Report the set that deviates most from the fitted trend (my expectation is
      the excluded 348864, which has m = 12 rather than 13) and state whether the conclusion
      survives its removal, since ISO scoping removes it anyway.
  target_complexity:
    time_exponent: No attack is proposed and no exponent is moved. The output is a decision
      rule mapping a claimed exponent form to a verdict per parameter set. The baseline anchored
      is 2^{t log2(n/(n-k)) (1+o(1))}, i.e. exponential in lambda and subexponential in n.
    memory_exponent: Prange's memory is O(1) lists, negligible; the memory question is C1-13's.
    best_known_baseline: H-MCE-efa9b2's H1-C exact Prange count at the five sets, and whatever
      C1-13's exhaustive charged optimum returns, which strictly dominates Prange and is the
      number C* should ultimately be computed against.
    hidden_overhead_disclosure: The entire content of the idea is that the o(1) and the constant
      are where the answer lives; nothing here hides an overhead, it names the overhead as
      the deliverable.
    time_memory_tradeoff: Charging memory raises the baseline and therefore lowers the bar
      the attack must clear. This is the direction that hurts the defender and it is predicted
      and reported rather than omitted.
  sota_delta: Beats nothing and claims nothing. It removes a category error that this program
    is otherwise likely to make when KN-LIT-7c4620 is finally read - and the goal record already
    documents three consecutive campaigns in which a Coordinator claim about a prior record
    was found to be an overread. Cost is under 200 core-seconds, and the output is the single
    question to ask the paper.
  dominated_by: 'Nothing inside the corpus: H-MCE-efa9b2 builds the baseline and the accounting
    bases but does not address the parameterization of the ATTACK''s claim; H-MCE-31d438 addresses
    the alternant-degree ambiguity, a different ambiguity; IDEA-20260805-f58517 addresses
    the structural assumption''s complexity ceiling by an AM-intersect-coAM transfer, a different
    route. Externally, the paper itself certainly states its own parameterization, so once
    the text is obtained the pre-registration is dominated by the text - which is the intended
    lifecycle of a pre-registration, not a defect. UNVERIFIED for external work that may already
    make this observation about the McEliece regime.'
  estimated_cost: Implementation LOW (exact binomials plus a symbolic inversion). Compute
