idea:
  id: IDEA-20260816-0027ac
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: 'Every archived ALPF positive was measured on curves labelled only ''structured'', so representation
    effect and curve-coefficient effect are perfectly confounded: run a factorial design crossing
    representation against a matched twist-and-isogeny-controlled curve sample and decompose the variance
    in the survival verdict.'
  class: mechanism
  claim: '(A) The committed EXP-ALPF-011 table varies representation (x-ring baseline, e-ring elementary-symmetric,
    power-sum, two pullbacks), factor-base size and field size, and holds the curve label constant
    at ''structured''. Whatever the archived positive shows about representations, it shows on one
    curve family, so a representation effect and a curve-coefficient effect are not separable from
    that table. KN-OPEN-003 poses precisely this question for prime fields and warns explicitly against
    mistaking coefficient noise for a representation effect. (B) The claim is that separation is achievable
    at toy scale by a factorial design: representation (3 levels) crossed with curve sample (many
    independently drawn prime-order toy curves), with two matched control axes -- a quadratic-twist
    pair for each curve, which preserves the group order structure while changing coefficients, and
    an isogenous partner where one exists in the toy range, which preserves the isogeny class while
    changing the curve equation. Variance in the survival verdict and in d_ff is then decomposable
    into representation, curve, twist and residual components. (C) The claim is further that the representation
    component will dominate if the archived positive is a representation effect at all, and specifically
    that the e-ring representation''s degree profile [2,2,2,4] is determined by the elementary-symmetric
    change of variables alone and therefore should be curve-INVARIANT, whereas d_ff within that profile
    may vary by curve. Separating profile (deterministic, representation-only) from d_ff (stochastic,
    curve-dependent) is the mechanism. (D) NOT CLAIMED: that any representation lowers any real solving
    cost; that a representation effect, if found, transfers to any larger scale; that the archived
    positive is confounded in fact rather than in design. A variance decomposition attributes observed
    variation among tested factors and asserts nothing about untested ones.'
  mechanism: 'STAGE 1: generate a sample of independent prime-field toy curves with harness/toycurve.py
    at a fixed bit size, each with a prime-order subgroup of the required size, recording the curve
    coefficients (a, b) and the group order. STAGE 2: for each curve construct its quadratic twist
    and, where cheap, an isogenous partner of small degree, giving matched triples. STAGE 3: for each
    curve in each triple, build the three representations at fixed |FB| using harness/semaev.py, and
    record both the leading-form degree profile (predicted to be a deterministic function of representation)
    and the metered d_ff and verdict. STAGE 4: fit a two-way analysis of variance on d_ff with representation
    and curve as factors, plus the twist contrast within curve, and report the variance components
    with confidence intervals. STAGE 5: separately report the profile as a categorical outcome and
    test whether it is constant within representation across all curves, which is the deterministic
    half of claim (C). STAGE 6: run the identical pipeline on a null arm of random systems with the
    same profiles, so any apparent representation effect must exceed what the profile alone produces
    on curveless objects. Refutation: if the curve component of variance in d_ff equals or exceeds
    the representation component, the archived positive cannot be attributed to representation from
    data of this kind and KN-OPEN-003''s warning is confirmed as binding at toy scale.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'power-sum|elementary symmetric|e-ring' ledger/proposals/ ; grep -ril 'null
      curve|null-curve' ledger/proposals/ ; grep -ril 'ALPF' ledger/proposals/ ; read knowledge/open-problems/KN-OPEN-003.md
      in full, experiments/EXP-ALPF-011/analysis.md per-cell table, experiments/EXP-ALPF-007/analysis.md,
      ledger/questions/RQ-ALPF-001.yaml, ledger/questions/RQ-ICINV-475b5e.yaml title.
    results: Zero proposals reference ALPF. The symmetric-function nouns match IDEA-20260808-481e07,
      IDEA-20260807-e57607 (RQ-EQIC-8cb959, endomorphism action on the factor base), IDEA-20260807-dadcd2,
      IDEA-20260805-62359f, IDEA-20260807-5ddccf, IDEA-20260807-18d2f7, IDEA-20260807-1ea327 and IDEA-20260807-eeb226
      -- these are equivariance-lane and factor-base-lane proposals about symmetric functions as algebraic
      tools, none of which runs a factorial representation-by-curve design or decomposes verdict variance.
      'null curve' matches IDEA-20260808-486ae2, IDEA-20260807-4d7e8e, IDEA-20260807-c015f5, IDEA-20260807-df906f
      and IDEA-20260808-fa1d80, which use null-curve controls for other objects. KN-OPEN-003 states
      the question directly and is listed as open with confidence 'reported'; it names the required
      guard ('guards against mistaking coefficient noise for a representation effect') and no ledger
      record executes it over prime fields with a matched twist control. The isogeny-class lane RQ-ICINV-475b5e
      has 18 proposals about isogeny-class invariants as a uniformity argument; that is a different
      use of isogeny, and this proposal uses isogenous partners only as a matched control axis.
    verdict: 'UNVERIFIED. No assertion is made about external literature; KN-OPEN-003''s own summary
      of the field is repeated as a repository record, not as a literature claim. Assembled from known
      parts: factorial design and variance decomposition are standard; the quadratic twist is elementary;
      harness/toycurve.py and harness/semaev.py already build the objects. Claimed new relative to
      this repository: (i) identifying the archived ALPF positive''s single-curve-family design as
      the specific confound KN-OPEN-003 warned about, with the archived table cited as the evidence
      of confounding; (ii) splitting the outcome into a deterministic part (degree profile, predicted
      representation-only) and a stochastic part (d_ff, predicted curve-dependent), so one run tests
      two different kinds of claim; (iii) using the quadratic twist as a coefficient-change control
      that holds the arithmetic partly fixed, which none of the listed null-curve proposals does for
      this question.'
  object_first_candidate:
    tracked_object: The pair (leading-form degree profile, metered d_ff) as a function of the two-factor
      index (representation, curve), i.e. the response surface of the screen over the representation-by-curve
      grid rather than any single cell.
    lossiness: 'Genuinely lossy. The response surface retains, per grid cell, one categorical value
      and one integer, discarding the curve coefficients, the point coordinates, the factor base contents
      and the entire Macaulay matrix. It is compatible with the operation of interest -- changing
      representation, which is a change of polynomial coordinates on the same decomposition problem
      -- because both retained quantities are defined identically in every coordinate system. The
      projection is heavily non-injective: many curves give the same (profile, d_ff) pair, and that
      non-injectivity is exactly what makes a variance decomposition meaningful. If instead the pair
      turned out to determine the curve, there would be no residual variance to decompose and the
      design would be reporting a change of coordinates rather than an effect.'
    propagation: The target operation here is the change of representation, applied to a fixed instance.
      Acting on the tracked object it maps the profile deterministically -- the elementary-symmetric
      change of variables sends the archived [4,4,4,12] baseline to [2,2,2,4] on every curve, by construction
      and with no computation -- and maps d_ff stochastically, since d_ff depends on the actual coefficients
      through the Macaulay rank. One step therefore splits cleanly into a deterministic component
      and a stochastic component, and the experiment's whole design is to measure the two separately
      rather than reading their sum as one effect.
    survival_score: The deterministic component survives every curve in the sample by construction,
      so its survival score is trivially total and it is reported as such rather than dressed up as
      a finding. The stochastic component survives as an attributable effect only while representation
      variance exceeds curve variance; the concrete measure is the ratio of variance components, and
      the design has power to detect a ratio of about 2 with 30 curves and 3 representations. Beyond
      the toy range the object is untested and its survival is deliberately not extrapolated.
  null_object_control: 'Two nulls in the same invocation. First, curveless nulls: random homogeneous
    systems matched to each representation''s degree profile, 30 per profile, metered identically
    -- the representation ''effect'' on d_ff must exceed the difference these curveless nulls show
    between the same profiles, otherwise the effect is a profile effect that any random system of
    that shape would produce and no curve or representation is involved. Second, a label-permutation
    null: re-run the entire variance decomposition with the representation labels randomly permuted
    within curve, 200 times, to give the null distribution of the representation variance component.
    For the signal arm to mean anything, the observed representation component must exceed the 95th
    percentile of the permutation null, and the curveless nulls must reproduce the between-profile
    d_ff differences seen in the signal arm no better than at chance.'
  discriminated_from:
  - KN-OPEN-003 states the representation-versus-coefficient-variance question and names the guard;
    it is an open problem record, not a design or a measurement. This proposal supplies the factorial
    design, the twist control and the variance decomposition that would answer it at toy scale over
    prime fields.
  - RQ-ICINV-475b5e's 18 proposals treat isogeny-class invariants as a uniformity argument. Here isogeny
    appears only as one matched control axis alongside the quadratic twist, and no invariant is proposed,
    computed or claimed.
  - IDEA-20260815-6c956e's special-j curve exclusion concerns removing curves with special j-invariants.
    This proposal samples curves at random and does not exclude any class; special-j curves appearing
    in the sample are reported, not filtered.
  - IDEA-20260807-e57607 (RQ-EQIC-8cb959) analyses what an endomorphism does to the factor base and
    concludes it is a constant. That is an equivariance argument on one curve family; this is a between-curve
    variance decomposition with no endomorphism assumed to exist.
  - IDEA-20260815-c13ef4 (designed vs sampled factor bases) varies the factor base. This proposal
    holds |FB| and the factor-base construction fixed and varies the curve and the representation,
    which are the two axes c13ef4 holds fixed.
  - 'The archived EXP-ALPF-011 table itself varies representation on one curve family. The difference
    is not notation: adding a curve factor with 30 levels and a within-curve twist contrast is the
    only way to separate the two sources, and that factor is absent from the archived design.'
  assumptions:
  - harness/toycurve.py can generate 30 or more independent prime-field toy curves with prime-order
    subgroups at a fixed bit size within budget.
  - The quadratic twist of a toy curve can be constructed and its Semaev systems built with the same
    code path, so the twist contrast is within-curve rather than across-pipeline.
  - The elementary-symmetric and power-sum representations can be built for arbitrary sampled curves,
    not only for the archived 'structured' family.
  - d_ff is an integer response with enough spread across curves to support a variance decomposition;
    if it is constant, the decomposition degenerates and that degeneracy is itself reported as the
    result.
  - Small-degree isogenous partners exist for enough sampled curves to make the isogeny contrast estimable;
    if not, that axis is dropped and reported as dropped.
  predictions:
  - metric: leading-form degree profile constancy within representation across all sampled curves
    direction: higher
    minimum_effect: 1.0
  - metric: ratio of representation variance component to curve variance component in d_ff
    direction: higher
    minimum_effect: 2.0
  - metric: twist contrast in d_ff within curve
    direction: different
    minimum_effect: 0
  - metric: observed representation variance component versus the 95th percentile of the label-permutation
      null
    direction: higher
    minimum_effect: 'forced: must exceed the 95th percentile or no representation effect is reported'
  - metric: between-profile d_ff difference in the curveless null arm relative to the signal arm
    direction: lower
    minimum_effect: 'refuse to pre-commit a magnitude: the profile alone may account for most of the
      difference, which is precisely the possibility this arm exists to expose'
  minimal_test:
    design: 'Three representations, fifteen curves, one prime size, one factor-base size. Generate
      15 independent 15-bit prime-field toy curves with prime-order subgroups and their 15 quadratic
      twists. For each of the 30 curves build the x-ring baseline, e-ring and power-sum representations
      at |FB| = 4 and meter each, giving 90 cells. In the same invocation meter 30 curveless null
      systems per profile and run 200 label permutations. The discriminating outputs are three numbers:
      whether the profile is constant within representation across all 30 curves (a yes/no that costs
      nothing and tests the deterministic half), the ratio of representation to curve variance in
      d_ff, and the position of the observed representation component in the permutation null. A ratio
      near or below 1 confirms KN-OPEN-003''s warning as binding and is a complete, usable result.'
    controls:
    - Quadratic-twist contrast within each sampled curve, run in the same invocation as its base curve.
    - Isogenous-partner contrast where a small-degree isogeny is available, reported for the subset
      where it exists.
    - 'Curveless null arm: random homogeneous systems matched to each representation''s degree profile.'
    - 'Label-permutation null: 200 permutations of representation labels within curve, giving the
      null distribution of the representation variance component.'
    - Profile-constancy assertion recorded per curve rather than assumed, since the deterministic
      prediction must be checked not assumed.
    - Seed-block control with 5 disjoint blocks over the curve sample.
    required_metrics:
    - leading-form degree profile per (representation, curve)
    - d_ff per (representation, curve)
    - variance components for representation, curve, twist-within-curve and residual, with intervals
    - permutation-null distribution of the representation variance component
    - curveless null d_ff distribution per profile
    - fraction of sampled curves with an available small-degree isogenous partner
    - profile-constancy indicator per representation
  falsification_conditions:
  - The leading-form degree profile is NOT constant within representation across curves, falsifying
    the deterministic half of claim (C) and making the whole decomposition harder to interpret.
  - Curve variance component in d_ff equals or exceeds the representation component, confirming KN-OPEN-003's
    confounding warning as binding at toy scale.
  - The observed representation variance component falls below the 95th percentile of the label-permutation
    null, in which case no representation effect is reported.
  - The curveless null arm reproduces the signal arm's between-profile d_ff differences, showing the
    effect is a profile effect with no curve content.
  - d_ff is constant across all cells, degenerating the decomposition; reported as a dynamic-range
    failure of the response.
  - Fewer than 20 curves with prime-order subgroups can be generated in budget, leaving the design
    underpowered and reported as such.
  confounders:
  - Sampled curves may not match the archived 'structured' family, so a difference from the archived
    table could be a family difference rather than a design improvement.
  - The quadratic twist changes the group order, so the twist contrast mixes a coefficient change
    with an order change unless order is included as a covariate.
  - d_ff is a small integer, so variance decomposition on it is coarse and may lack resolution regardless
    of sample size.
  - Factor-base construction depends on the curve through build_factor_base, so 'curve' and 'factor
    base' are not fully separable in this design.
  - Small-degree isogenous partners are available only for a biased subset of curves, so the isogeny
    contrast is estimated on a non-random subsample.
  interpretation_limits:
  - A variance decomposition attributes observed variation among the tested factors only and says
    nothing about factors not in the design, including field size and m.
  - A dominant representation component would show that representation explains d_ff variation at
    toy scale, not that any representation lowers real solving cost.
  - Results are scoped to the tested bit size, factor-base size and representation set, and no transfer
    to medium or cryptographic scale is claimed.
  - Confirming KN-OPEN-003's confounding warning scopes what the archived positive licenses; it does
    not invalidate the archived run, which is immutable and was never designed to separate these factors.
  target_complexity:
    time_exponent: No attack exponent is claimed. The archived representations are compared on an
      algebraic degree response, not on any solving time, and no solving is attempted.
    memory_exponent: No attack memory exponent is claimed. Peak memory is the Macaulay matrix at the
      ceiling degree for the highest-degree profile in the design.
    best_known: The incumbent evidence on this question inside the repository is the archived EXP-ALPF-011
      table, which compares five representations on one curve family at two bit sizes and two factor-base
      sizes, plus KN-OPEN-003's statement that the question is open over prime fields. The incumbent
      for the underlying problem remains Pollard rho at roughly sqrt(n) group operations.
    hidden_overhead: 'Generating enough independent toy curves with prime-order subgroups is slower
      than it looks and is the dominant compute cost; the human cost is in deciding whether ''curve''
      or ''factor base'' owns the variance, since build_factor_base makes them partly inseparable.
      Lower-order term: the isogeny axis will likely be estimable on a minority of the sample and
      reporting it honestly costs more words than it earns.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed across time, memory and data/queries:
    this design produces no attack point, so no frontier row applies. Against the archived table it
    strictly dominates on inferential content -- it can separate two factors the archived table cannot
    -- while being strictly dominated on cost, since it meters roughly 90 to 180 cells plus 200 permutations
    where the archive metered about 20.'
  sota_delta: 'No attack; measurement and design contribution only. Quantitatively: the incumbent
    design has curve-sample size 1 and therefore zero degrees of freedom for a curve effect; this
    has 15 to 30 curves with a within-curve twist contrast, giving a representation-to-curve variance
    ratio with an interval and a permutation-based null. Zero change to any ECDLP time or memory exponent,
    and no representation is claimed to reduce any cost.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the profile is constant within representation across curves (deterministic
    half of claim C): 0.9 -- this follows from the change of variables being curve-independent, and
    the residual risk is that the factor-base construction leaks curve dependence into the profile.
    That d_ff has enough spread across curves to decompose at all: 0.5 -- the archived table shows
    d_ff taking few distinct values (1, 3, 4, 7, 10, 12), so a degenerate response is a real possibility
    and is listed as a falsification condition rather than hidden. That the representation component
    exceeds the curve component by a factor of 2: 0.4, deliberately low, because KN-OPEN-003 exists
    precisely because nobody knows. That the whole factorial fits in budget with 30 curves: 0.7. Probability
    the outcome is a clean confirmation of the confounding warning rather than a representation effect:
    roughly 0.45, and that outcome is a fully usable measured obstruction.'
