idea:
  id: IDEA-20260809-a62935
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-TECDSA-8d340d
  goal_id: GOAL-TECDSA-001
  title: >-
    A key-extraction certificate that a reader verifies in milliseconds: the
    recovered share, a signature under it, and the exact configuration attacked
  class: tooling
  claim: >-
    A key-extraction claim is verifiable without rerunning the attack: exhibit the
    recovered share, a signature it produces, and the public key it corresponds to.
    The claim is that a certificate format carrying these plus the exact proof-set
    configuration makes every extraction in this goal independently checkable, and
    that including the CONFIGURATION in the certificate is what prevents the
    result from being read as a claim about the protocol rather than about an
    instantiation.
  mechanism: >-
    The certificate carries the public key, the recovered share or full key, a
    signature verifying under it, the configuration flags and parameters, and the
    session seeds. A checker verifies the signature and the share's consistency
    with the public key, using no attack code.
  why_not_a_renamed_known_approach: >-
    Proof-of-recovery is obvious in principle. Binding the configuration into the
    certificate as a required field is the design decision that matters here: it
    makes it impossible to cite the certificate without citing the instantiation
    it came from.
  predictions:
  - observable: checker accepts every genuine extraction and rejects perturbed certificates
    metric: two rates
    predicted: One and zero. Deviation blocks the goal's evidence.
  - observable: whether any certificate can be produced without the configuration field
    metric: boolean, by test
    predicted: No; the format requires it, and a test asserts that requirement.
  minimal_test: >-
    Run the checker over every extraction produced in the goal plus a negative set
    of perturbed certificates, and test that configuration-free certificates are
    rejected by the format itself.
  controls:
  - 'INDEPENDENCE: the checker links no attack or protocol-internal code.'
  - 'NEGATIVE SET including certificates with correct signatures but wrong configuration fields, which must be rejected as malformed rather than accepted as valid.'
  falsification_conditions:
  - The checker accepts a perturbed certificate.
  - The configuration requirement can be bypassed in practice, allowing a certificate to circulate without its instantiation.
  interpretation_limits: >-
    A verified certificate proves an extraction against the stated configuration.
    It is not a statement about any protocol version or any deployed system, and
    the format is designed so that citing it without the configuration is
    impossible.
  sota_delta: 'No attack. Delta: certificate-tier evidence with the scope bound into the artifact rather than into the surrounding prose.'
  dominated_by: Not dominated by any corpus record; parallels IDEA-20260809-2d4427 for lattices.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for extraction certificate: no records. WEB NOT CHECKED.'
  source_refs:
