      direction: different
      minimum_effect: Forty-nine exceeds thirty-six by 13.
  minimal_test:
    design: >-
      Square 7 and square 6, then subtract 36 from 49. Do not map
      a curve point.
    controls:
      - Two maps of degree 36, whose gap is 0.
      - An independent count.
    required_metrics:
      - both degrees
