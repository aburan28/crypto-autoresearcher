      - the product
  falsification_conditions:
    - The degree of multiplication by 7 is not 49.
    - The product of the two degrees is not 1764.
  confounders:
    - The degree pair 36 and 25 belongs to multipliers 6 and 5.
  interpretation_limits:
    - A map degree is not a walk length.
    - No transfer to a cryptographic endomorphism.
    - This is not the degree pair 36 and 25.
  heuristic_assumptions:
