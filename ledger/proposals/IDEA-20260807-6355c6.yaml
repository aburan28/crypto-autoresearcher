idea:
  id: IDEA-20260807-6355c6
  question_id: RQ-EWALK-8fa147
  added: '2026-08-07'
  title: >-
    THE FRUITLESS-CYCLE RATE IS NOT 1/(2r) WHEN |Aut| > 2, AND ITS DIRECTION
    DEPENDS ON A DESIGN CHOICE NOBODY HAS RECORDED: for an Aut-quotient walk on
    a j = 0 or j = 1728 curve the derived immediate-undo probability is
    1/(|Aut| * r) with a GENERIC step table and 1/r with an Aut-STABLE step
    table -- a factor |Aut| apart in opposite directions -- so the same
    automorphism group that promises sqrt(6) can be made to deliver six times
    the cycle rate by a table choice that looks natural, and the fully charged
    net gain at |Aut| in {4, 6} is measurable, unmeasured, and explicitly out of
    scope of the only approved rho experiment in this program
  class: algorithm

  claim: >-
    (A) THE GAP THIS FILLS, NAMED PRECISELY. H-RHO-bc6ea6 (specified;
    EXP-RHO-60da4f approved 2026-08-06) measures the negation-quotient net gain
    and its fruitless-cycle rate against a pre-registered 1/(2r). Its own
    assumptions block says: "The curve has Aut(E) = {+-1}. Curves with j = 0 or
    j = 1728 have larger automorphism groups, DIFFERENT CYCLE STRUCTURE, and
    are OUT OF SCOPE." Separately, H-ENDO-001's prediction 4 -- measured rho
    cost on j = 0 and j = 1728 within 20 percent of 0.886*sqrt(N/|Aut|) --
    carries the note "this campaign has never measured it", and EV-ENDO-001
    records that EXP-ENDO-001 produced ZERO RUNS. So the |Aut| in {4, 6} cell
    is empty in this program, and it is exactly the cell where the entire L6
    prize lives (IDEA-20260807-ebcae6: residual headroom 1.4142 at |Aut| = 4,
    1.7321 at |Aut| = 6, and exactly 1.0000 everywhere else).

    (B) THE DERIVATION, DONE BEFORE ANY RUN, AND IT HAS A SIGN THAT FLIPS.
    Let Aut have order m, canon pick the orbit element minimal under a fixed
    total order on encodings, s(.) be an Aut-invariant partition function into
    r branches, and the step be
      A |--> canon(A) + T_{s([A])}.
    Write B = canon(A) + T_s and canon(B) = sigma B for the sigma in Aut that
    canon selects. The next step gives C = sigma B + T_{s'} with s' = s([B]).
    An immediate undo means [C] = [A], i.e. C = tau canon(A) for some tau in
    Aut. Expanding,
      C = sigma canon(A) + sigma T_s + T_{s'},
    so the condition is (sigma - tau) canon(A) = -(sigma T_s + T_{s'}).
    TWO BRANCHES:
      (B1) sigma = tau. The condition collapses to T_{s'} = -sigma T_s, an
        equation in the STEP TABLE ALONE, independent of A. This is the
        generic, high-rate branch.
      (B2) sigma != tau. Then (sigma - tau) is a nonzero scalar mod N, hence
        invertible, and canon(A) is DETERMINED: at most one class per tuple
        (sigma, tau, s, s'), so at most m^2 r^2 classes out of about N/m. This
        branch is O(m^2 r^2 / N) and is negligible at cryptographic N -- but it
        is NOT negligible at 16 to 20 bits, which is a named toy-scale
        confounder rather than a result.
    Now evaluate (B1). For a uniformly distributed B the automorphism sigma
    selected by canon is uniform on Aut, so P(sigma = nu) = 1/m for each nu.
      - GENERIC STEP TABLE (no nontrivial Aut-relation among the T_s). Then
        -sigma T_s lies in the table only when -sigma = 1, i.e. sigma = -1,
        and then the required index is s' = s. Rate = (1/m)*(1/r) = 1/(m r).
      - Aut-STABLE STEP TABLE (the table is a union of Aut-orbits, which is the
        natural choice if one builds the table from orbits, and is exactly the
        phi-stable-basis instinct of lane L4). Then -sigma T_s is in the table
        for EVERY sigma, at one determined index, so
        Rate = sum_{sigma} (1/m)*(1/r) = 1/r.
    THE TWO DIFFER BY A FACTOR m. At m = 2 the generic value is 1/(2r), which
    REPRODUCES HEUR-RHO-1 of H-RHO-bc6ea6 exactly -- that is this derivation's
    baseline-embedding check, not a coincidence. At m = 6 the generic value is
    1/(6r), THREE TIMES BETTER than the negation case, while the Aut-stable
    value is 1/r, SIX TIMES WORSE than the generic value at the same m.

    (C) WHAT EACH OUTCOME MEANS -- THE PROPOSAL DISCRIMINATES, IT DOES NOT
    FISH.
      OUTCOME 1 -- measured rates match 1/(mr) generic and 1/r Aut-stable
        within a factor 2. The cycle mechanism is understood at |Aut| > 2, the
        table choice is established as a first-order design variable that no
        record in this program names, and the net-gain measurement in (D) is
        interpretable.
      OUTCOME 2 -- measured rates match at m = 2 but not at m = 4 or 6. The
        uniformity of sigma under canon fails, i.e. canon is biased on larger
        orbits (very plausible: min over an orbit is not a uniform selector
        when the orbit elements are correlated in the encoding). That is a
        REAL finding about canonicalisation, it is measurable, and it changes
        the derivation rather than the conclusion.
      OUTCOME 3 -- rates do not depend on the table's Aut-stability at all.
        Branch (B1) is not the dominant mechanism, some longer-cycle mechanism
        dominates, and the deliverable is the measured cycle-length spectrum
        with the 2-cycle model recorded as refuted.
      There is no outcome in which nothing is learned, which is the quality bar
      in agents/idea-generator.md.

    (D) THE NET-GAIN QUESTION, WHICH IS THE LANE'S ACTUAL DELIVERABLE. Measure,
    in F_p multiplications with the curve model named, the fully charged cost of
    the Aut-quotient walk at m = 2, 4, 6 against an UN-quotiented walk on the
    SAME curve, SAME step table, SAME seeds. Report the ratio against the
    derived ideal sqrt(m) = 1.4142 / 2.0000 / 2.4495. PRE-REGISTERED
    PREDICTION: the achieved ratio is strictly below sqrt(m) at every m, the
    shortfall GROWS with m, and for at least one (escape rule, table type) cell
    at m = 6 the ratio falls BELOW 1.0 -- i.e. the largest automorphism group
    available over a prime field produces a NET LOSS. A measured shortfall is a
    real and useful result and is the expected one.

    (E) WHY THE SHORTFALL SHOULD GROW WITH m, STATED AS A MECHANISM NOT A
    HUNCH. Three charges scale with m and one does not:
      (E1) CANONICALISATION ARITHMETIC. Choosing the minimum of an m-element
        orbit costs m-1 comparisons and, on j = 0, 2 extra field
        multiplications to form zeta*x and zeta^2*x. Against a Jacobian-
        coordinate step of roughly 11-16 field multiplications this is a
        10-20 percent per-step charge at m = 6 and essentially zero at m = 2.
      (E2) NORMALISATION / INVERSION. In any projective coordinate system the
        canonical representative is defined on AFFINE coordinates, so canon
        needs x = X/Z^2 and y = Y/Z^3, i.e. an inversion per step unless
        simultaneous inversion is used across a batch. KN-LIT-097 records that
        the largest publicly completed ECDLP computation used exactly "negation
        map, simultaneous inversion, and explicit handling of the
        fruitless-cycle problem" together -- the three are coupled, and a
        cost model that charges the negation map without charging its
        inversion is not charging the method that was actually run.
      (E3) ESCAPE-RULE DISTORTION. Every escape perturbs the walk away from the
        ideal random map, raising the collision constant. More cycle types at
        larger m means more escapes.
      (E4) DOES NOT SCALE: the space reduction, which is exactly sqrt(m).
    So the charged gain is sqrt(m) divided by a per-step overhead that grows in
    m, and the question of where the quotient stops paying is arithmetic on
    measured numbers, not opinion.

  resource_label: >-
    R3 (End(E) as a ring -- its unit group Aut, and the requirement p = 1 mod 3
    or p = 1 mod 4 for those units to be F_p-rational).

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    INADMISSIBLE, FILED AS A RECORDED BASELINE CALIBRATION. The walk applies
    automorphisms to points of G and nothing else. On a prime-order G every
    endomorphism is a scalar (H-ENDO-001), an oracle supplying phi(A) is
    Oracle D of KN-FIND-b7e091, and Oracle D is generic-group simulable, hence
    closed at exponent 1/2 by Shoup (KN-TECH-005). No exponent is claimed and
    none is available. What the measurement buys is the exact constant at which
    the closed family saturates on the ONLY prime-field curves where that
    constant exceeds the program's baseline, so that every other lane in
    GOAL-ENDO-001 charges against a measured number instead of folklore.

  discriminated_from:
    - >-
      H-RHO-bc6ea6 / EXP-RHO-60da4f (approved 2026-08-06). Same family of
      question, DISJOINT scope by that record's own words: it fixes
      Aut(E) = {+-1} and j not in {0, 1728}, tests HEUR-RHO-1 = 1/(2r) at
      subgroup sizes 2^32/2^40/2^48, and never varies m. This proposal varies m
      in {2, 4, 6}, derives the m-dependence, and adds a variable that record
      does not have at all: the Aut-STABILITY OF THE STEP TABLE. The m = 2
      generic cell is deliberately shared so the two instruments can be
      cross-checked; a disagreement there is an instrument failure in one of
      them and must be resolved before either is believed.
    - >-
      IDEA-20260806-37eab9, whose section (D) names the negation-map fruitless
      cycle as the open sub-problem and whose (E) fixes the unit convention.
      That proposal explicitly defers larger automorphism groups ("The same
      applies to larger automorphism groups on j = 0 and j = 1728 curves") and
      does not derive their rate. This record supplies the derivation and the
      table-stability variable.
    - >-
      IDEA-20260807-ebcae6 (this batch), which derives the sqrt(|Aut|) CEILING
      at zero compute. That record says the ceiling is never attained and
      explicitly defers "how far below" to this one. They must be read
      together: ebcae6 supplies the numerator, this supplies the denominator.
    - >-
      IDEA-20260802-005, which measures the crossover in ORBIT SIZE r for
      non-unit endomorphisms with a free-representative calibrator. That varies
      orbit size with canonicalisation cost as the decision variable; this
      varies the automorphism group with the CYCLE RATE and the STEP-TABLE
      SYMMETRY as decision variables, at orbit sizes that are all <= 6.
    - >-
      inputs/h100_session/h040_rho_const.json, a STAGED EXTERNAL ARTIFACT
      audited by REVIEW-H100-20260717 (correction C5), which measured
      negation-quotient constants at 16 and 18 bits with 17/200 and 29/200 runs
      censored by escape overflow. That is m = 2 only, is not a run of this
      program's harness, and reports no table-stability variable. It is used
      here as a prior expectation and as a source of realistic censoring rates,
      never as evidence for m > 2.

  object_first_candidate:
    tracked_object: >-
      THE AUTOMORPHISM SELECTED BY CANONICALISATION AT EACH STEP: the element
      sigma_t in Aut for which canon(B_t) = sigma_t B_t. This is a length-t
      word in Aut, one symbol of log2(m) bits per step, followed alongside the
      walk.
    lossiness: >-
      GENUINELY LOSSY AND IT PASSES THE TEST. The sigma-sequence discards the
      entire group element and retains only which automorphism the
      canonicaliser picked -- from a state of log2(N) bits down to log2(m)
      bits per step. It is not a change of coordinates: the group element is
      not recoverable from the sigma word, and two completely different walks
      can produce the same word.
    propagation: >-
      DETERMINISTIC AND COMPATIBLE, WHICH IS THE POINT. sigma_{t+1} is a
      deterministic function of the class at time t+1, which is a deterministic
      function of the class at time t; and the immediate-undo condition is a
      condition on the PAIR (sigma_t, s_t, s_{t+1}) alone, by branch (B1) of
      the derivation. So the fruitless-cycle event is EXACTLY an event in the
      projected object, which is why the projection is the right one to track:
      the thing being predicted lives entirely in what is retained.
    survival_score: >-
      Survives change of r, of DP granularity, of subgroup size, of seed, and
      of parallelisation. Dies at branch (B2), where the undo condition depends
      on canon(A) itself and therefore escapes the projection; (B2) is
      O(m^2 r^2 / N) and so the object survives to within that error, which is
      negligible at crypto N and NOT negligible at 16 bits. Also dies if canon
      is not a uniform selector on the orbit, which is Outcome 2 and is
      measurable.

  mechanism: >-
    STAGE 0 (zero compute, HARD GATE). Re-derive (B) symbolically, including
    the m = 2 specialisation to 1/(2r), and confirm it matches HEUR-RHO-1 of
    H-RHO-bc6ea6 exactly. If it does not, one of the two derivations is wrong
    and no run happens until that is resolved. Also derive, or explicitly
    declare unmodelled and measurement-only, the rates of fruitless cycles of
    length 4 and 6; the record must not silently assume the 2-cycle is the only
    type.

    STAGE 1 (instrument, HARD GATE). Build three curve families with
    harness/toycurve.py and the j = 0 generator already present in
    harness/endomorphism_la.py:
      GEN  -- generic j, p not = 1 mod 3, |Aut_{F_p}| = 2;
      J1728 -- a = arbitrary, b = 0, p = 1 mod 4, |Aut_{F_p}| = 4;
      J0   -- a = 0, p = 1 mod 3, |Aut_{F_p}| = 6.
    VERIFY RATIONALITY, DO NOT INFER IT FROM j: enumerate Aut explicitly by
    checking that the candidate maps send curve points to curve points and have
    the right order, and record the count. A curve with a = 0 over p = 2 mod 3
    has j = 0 and |Aut_{F_p}| = 2, and mis-classifying it would silently
    contaminate the J0 arm.
    COUNT CLASSES IN POINTS, NOT IN x. IDEA-20260807-ebcae6's
    observation_collision records that in x-coordinates the |Aut| = 4 orbit has
    size 2, identical to a generic negation orbit, so an x-only instrument
    CANNOT SEE the j = 1728 row at all. The class identifier used here is the
    canonical (x, y) pair.

    STAGE 2 (the cycle-rate measurement). For each family, for r in
    {4, 8, 16, 20, 32}, for TABLE TYPE in {generic, Aut-stable}, run the
    quotient walk with NO escape rule and instrument every step for the
    immediate-undo event. Report the empirical per-step 2-cycle rate against
    the derived 1/(m r) and 1/r, and report the full cycle-length histogram
    rather than the 2-cycle count alone. The no-escape arm is also the positive
    control that the cycle problem exists and the instrument can see it
    (C3 of EXP-RHO-60da4f uses the same device at m = 2).

    STAGE 3 (the net-gain measurement). Add the escape rules, all of them
    functions of the CURRENT CLASS ONLY so that memorylessness and hence
    van Oorschot-Wiener merging survive (KN-TECH-006), and measure the fully
    charged cost in F_p multiplications, with squarings and inversions counted
    separately at their measured platform ratios, against the un-quotiented
    walk on the SAME curve, SAME table, SAME seeds. Report:
    net_gain_ratio per (family, table type, escape rule, r), the maximum over
    the grid, and the location of any crossing of 1.0.
    CENSORING IS CHARGED, NOT DROPPED. Runs that exhaust the escape budget are
    reported as censored WITH their consumed cost included in the arm's total,
    and the censored fraction is reported per cell. Reporting a
    conditional-on-success mean is the exact defect REVIEW-H100-20260717
    correction C5 records in the staged 16/18-bit artifact, and it is the single
    easiest way for this experiment to manufacture a false gain.

    STAGE 4 (attribution). Decompose the charged cost per block -- step,
    canonicalisation, normalisation/inversion, cycle detection, escape, DP
    predicate, memory traffic -- so a measured shortfall can be attributed to
    (E1), (E2) or (E3) rather than reported as an opaque ratio.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/, analysis/, experiments/,
      inputs/ on 2026-08-07 for "fruitless", "cycle rate", "1/(2r)",
      "escape rule", "Aut-stable", "phi-stable", "j = 0", "j = 1728",
      "Duursma". Records read in full: H-RHO-bc6ea6, EXP-RHO-60da4f,
      IDEA-20260806-37eab9, KN-TECH-018, KN-TECH-006, KN-LIT-042, KN-LIT-097,
      CORR-20260806-2f98f4, REVIEW-H100-20260717 sections C5 and C8,
      inputs/h100_session/h040_rho_const.json, H-ENDO-001, EV-ENDO-001.
    results: >-
      "fruitless": 33 files. The only substantive ones are H-RHO-bc6ea6 /
      EXP-RHO-60da4f (m = 2 only, by its own explicit exclusion),
      IDEA-20260806-37eab9 (names the sub-problem, defers m > 2),
      KN-TECH-018 and KN-LIT-042 (state that negation walks require
      fruitless-cycle handling), KN-LIT-097 (records that the 117.35-bit FPGA
      record used negation + simultaneous inversion + explicit cycle handling),
      and CORR-20260806-2f98f4, which is a FABRICATED-STATISTIC correction
      forbidding any future record from citing "~2.5 percent degenerate
      collisions" or ">500x sqrt(N)" for the EXP-ECTD-001 driver -- this record
      cites neither and asserts no negation-fold measurement that does not
      exist. "Aut-stable step table" / "phi-stable step table": ZERO hits; the
      phi-stable idea appears only for FACTOR BASES in lane L4
      (RQ-EQIC-8cb959), never for a walk's step table. A derived m-dependence
      of the cycle rate appears NOWHERE.
    verdict: >-
      ADAPTATION. The fruitless-cycle phenomenon and its handling are
      classical (Wiener-Zuccherato KN-LIT-042; the FPGA record KN-LIT-097
      implements it). The m-dependent derivation, the step-table-stability
      variable with its factor-m sign flip, and the |Aut| in {4, 6} net-gain
      cell are new to THIS PROGRAM. No novelty is claimed against the external
      literature, where the negation-map cycle problem has a substantial body
      of work; Stage 0 must locate it and record what it already answers,
      because a published rate for m > 2 would make Stage 2 a replication
      rather than a discovery, and that would be a better outcome, not a worse
      one.

  null_object_control: >-
    MANDATORY, THREE-PART, AND BLOCKING.
    (1) MATCHED-SEED UN-QUOTIENTED NULL. The same curve, same step table, same
    r, same DP granularity, same seeds, walk on POINTS instead of classes. Every
    net_gain_ratio is that arm's cost divided by this arm's cost, measured in
    the same run. THE DECAY PARAMETER IS m: as m goes 2 -> 4 -> 6 the measured
    gain must TRACK sqrt(m) = 1.414 -> 2.000 -> 2.449 from below. A gain that
    does not move when m moves is measuring something other than the quotient
    and is the canonical artifact tell.
    (2) RANDOM-ORACLE WALK. A walk driven by a keyed hash into the group,
    realising the ideal constant by construction; any arm beating it by more
    than the derived band falsifies the instrument, not the band.
    (3) SHAM-QUOTIENT NULL. Run the identical canonicalise-then-translate
    pipeline with canon replaced by a FIXED, NON-AUTOMORPHIC involution of the
    encoding that is not a group map (e.g. swap two bytes of the x-encoding and
    map back to the nearest curve point). This has the same per-step cost
    profile and the same code path but no group-theoretic content, so it must
    show gain 1.0 and no useful collisions. If the sham quotient shows a gain,
    the harness is crediting the quotient for something structural in the
    plumbing.

  assumptions:
    - >-
      The generic square-root bound (KN-TECH-005) holds, so no exponent is at
      stake and every number here is a constant.
    - >-
      Aut is taken over F_p and its rationality is VERIFIED per curve, not
      inferred from j. p = 1 mod 3 is required for the order-3 map on a = 0
      curves and p = 1 mod 4 for the order-4 map on b = 0 curves.
    - >-
      N is prime, so Aut acts freely on G \ {O} and orbits have size exactly m
      (Lemma 2 of IDEA-20260807-ebcae6). If the toy generator returns a
      subgroup with small cofactor this must be checked per instance, not
      assumed.
    - >-
      Costs are in F_p multiplications with the curve model named; the
      normalisation inversion required by canon is charged explicitly, either
      per step or amortised across a stated batch size for simultaneous
      inversion. "Group operations" is not an admissible unit here.
    - >-
      Toy scale. p up to about 32 bits in pure Python. Every measured constant
      is scoped to the size it was measured at unless a size-independence check
      across at least three sizes says otherwise, and even then it is toy.

  proof_search_map:
    bottleneck: >-
      The immediate-undo probability of the canonicalise-then-translate map.
      It is the single quantity that separates the ideal sqrt(m) from the
      achieved gain, and its m-dependence is what makes the |Aut| in {4, 6}
      cell a different experiment rather than a re-parameterisation of
      EXP-RHO-60da4f.
    baseline_embedding:
      parameter_slice: >-
        m = 2, generic table, r = 20, no escape rule. This slice must reproduce
        HEUR-RHO-1's 1/(2r) = 0.025, and the same slice with escape rules must
        reproduce EXP-RHO-60da4f's net_gain_ratio behaviour qualitatively.
      reproduction_check: >-
        SYMBOLIC first: setting m = 2 in the derived 1/(m r) must give the
        1/(2r) that H-RHO-bc6ea6 derives independently by a branch-collision
        count. EMPIRICAL second: a frozen-seed measurement of the m = 2 generic
        cell in this harness must agree with the same cell measured by
        EXP-RHO-60da4f's harness within their combined bands. A disagreement is
        an instrument-comparability failure and blocks all m > 2 reporting.
    observation_collision:
      observable: >-
        The measured per-step immediate-undo rate.
      distinct_preimage_search: >-
        A REAL AND EXPECTED COLLISION: the rate 1/(2r) is produced by
        (m = 2, generic table) AND, approximately, by (m = 4, Aut-stable
        table)? No -- the derived values are 1/(2r) and 1/r respectively, so
        those separate. The genuine collision is (m = 4, generic) at 1/(4r)
        versus (m = 2, generic) at 1/(2r) with r doubled: the rate alone cannot
        distinguish "more automorphisms" from "more branches". The separating
        observable is the CYCLE-LENGTH HISTOGRAM and the distribution of
        sigma over Aut, both of which are required metrics for exactly this
        reason. Reporting a rate without the histogram is not identifiable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          A per-block charged cost measure -- step, canonicalisation,
          normalisation, detection, escape, DP predicate, memory -- with
          charges added only over these proved-disjoint blocks, so a measured
          shortfall is attributable to (E1), (E2) or (E3).
        predicted_gain: >-
          Attribution rather than an opaque ratio; without it a net gain below
          1.0 cannot be distinguished from a slow implementation.
      - transform: stronger_invariant
        proposed_object: >-
          Track the full (sigma_t, s_t) symbol pair rather than the undo
          indicator, preserving more state than the prediction needs.
        predicted_gain: >-
          The pair sequence tests the uniformity-of-sigma assumption directly
          (Outcome 2) and localises whether a rate deviation comes from canon
          bias or from partition bias.
    quantifier_order: >-
      CLAIMED: FOR EACH m in {2, 4, 6} and EACH table type, THERE EXISTS a
      per-step rate constant c(m, table) such that FOR ALL r in the tested grid
      and FOR ALL three tested subgroup sizes, the measured rate is within a
      factor 2 of c(m, table)/r.
      NOT CLAIMED: FOR ALL m -- three values is not all values, and m > 6 does
      not occur over F_p (IDEA-20260807-ebcae6 Lemma 1). NOT CLAIMED: FOR ALL
      r -- the grid is finite and small-r behaviour may be dominated by branch
      (B2).
    method_ceiling:
      strongest_certifiable_claim: >-
        "At toy sizes, on these curves, in this cost model, the Aut-quotient
        walk achieves a fully charged gain of X over the matched un-quotiented
        walk, against an ideal of sqrt(m), with a cycle rate of Y." It can
        NEVER certify anything about crypto-scale constants, about curve models
        it did not run, about escape rules outside the enumerated set, or about
        the exponent.
      nearby_object_control: >-
        THE SAME CURVE WITH THE QUOTIENT DISABLED but the canonicalisation code
        path still executed (canon applied and then immediately undone). This
        pays every per-step charge of the quotient and receives none of the
        space reduction, so it must show a net gain strictly BELOW 1.0 by
        exactly the canonicalisation overhead. A method that cannot distinguish
        this object from the real quotient is measuring plumbing.
    proof_obligations:
      - claim: The m = 2 specialisation of the derived rate equals 1/(2r).
        responsibility: baseline
      - claim: Branch (B2) contributes O(m^2 r^2 / N) and is separately reported.
        responsibility: correctness
      - claim: sigma is uniform on Aut under canon.
        responsibility: success_probability
      - claim: Every escape rule is a function of the current class only.
        responsibility: interface
      - claim: Censored runs are charged, not dropped.
        responsibility: correctness
      - claim: Classes are counted in points, not in x-coordinates.
        responsibility: scope
      - claim: Aut rationality is verified per curve rather than inferred from j.
        responsibility: correctness

  predictions:
    - metric: per-step immediate-undo (fruitless 2-cycle) rate, generic table
      direction: lower
      minimum_effect: >-
        Within a factor 2 of 1/(m r) at every tested (m, r), and STRICTLY
        DECREASING in m at fixed r. Specifically the m = 6 rate must be below
        the m = 2 rate by at least a factor 2. Failure to decrease in m refutes
        the generic-table branch of the derivation.
    - metric: >-
        ratio of the per-step 2-cycle rate with an Aut-stable table to the rate
        with a generic table, at the same (m, r)
      direction: higher
      minimum_effect: >-
        Predicted m, i.e. 2 / 4 / 6. A measured ratio below 1.5 at m = 6
        refutes the table-stability mechanism, which would be Outcome 3 and is
        a reportable finding about which cycle type dominates.
    - metric: >-
        best fully charged net_gain_ratio over the escape-rule grid, per family,
        against the matched un-quotiented arm
      direction: lower
      minimum_effect: >-
        Strictly below sqrt(m) at every m, with the SHORTFALL FRACTION
        (sqrt(m) - achieved)/sqrt(m) non-decreasing in m. A measured ratio at
        or above sqrt(m) at any m is treated first as an instrument artifact
        (see interpretation_limits) and only after the null controls pass as a
        refutation of the shortfall claim.
    - metric: >-
        existence of a (family, table type, escape rule, r) cell with
        net_gain_ratio below 1.0
      direction: different
      minimum_effect: >-
        At least one cell at m = 6, at all tested sizes. Finding none caps the
        claim to "no sign change inside the tested grid" and that phrase must
        be used verbatim rather than "the quotient always pays".
    - metric: censored fraction per cell
      direction: different
      minimum_effect: >-
        Reported for every cell. Prior expectation from the audited staged
        artifact at m = 2 (REVIEW-H100-20260717 C5) is order 10 percent
        (17/200 and 29/200 at 16 and 18 bits); a cell above 10 percent is
        reported as UNRESOLVED, never scored with the censored runs dropped.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): re-derive (B); check the m = 2
      specialisation against HEUR-RHO-1; literature-locate published cycle
      rates for m > 2 and record what they already answer.
      STAGE 1 (hours, HARD GATE): build and verify GEN / J1728 / J0 with
      explicit Aut enumeration and rationality checks; run the sham-quotient
      and canon-disabled nearby-object controls; confirm classes are counted in
      points.
      STAGE 2 (hours): no-escape cycle-rate measurement across
      (family) x (table type) x r, with full cycle-length histograms and the
      sigma-distribution.
      STAGE 3 (hours to days): escape rules, fully charged net gain against the
      matched-seed un-quotiented null, censoring charged.
      STAGE 4 (hours): per-block attribution.
      THE CHEAPEST KILL IS STAGE 2 AT r = 4: if the generic-table rate does not
      fall with m there, the derivation is wrong and Stage 3 is not worth
      running.
    controls:
      - matched-seed un-quotiented walk, same table, same seeds (blocking)
      - random-oracle walk at the ideal constant (blocking)
      - sham-quotient with a non-automorphic involution (blocking)
      - canon-applied-then-undone nearby object (must show gain below 1.0)
      - no-escape positive control (must be absorbed in cycles)
      - explicit Aut enumeration and rationality verification per curve
      - two independent implementations agreeing on a frozen seed
    required_metrics:
      - per-step 2-cycle rate per (m, table type, r, size)
      - full cycle-length histogram, not only the 2-cycle count
      - empirical distribution of sigma over Aut (tests uniformity)
      - fully charged cost in F_p multiplications, squarings and inversions
        counted separately, curve model named
      - net_gain_ratio with bootstrap interval, per cell
      - censored fraction and the cost consumed by censored runs
      - per-block cost attribution
      - branch-(B2) event count, reported separately from (B1)
      - Aut order verified per curve, and the class-identifier convention used

  falsification_conditions:
    - >-
      Stage 0's symbolic m = 2 specialisation fails to give 1/(2r). The
      derivation is wrong; nothing is run.
    - >-
      The generic-table cycle rate does not decrease with m. The (B1)
      derivation's uniform-sigma step is wrong; report the measured rates and
      the sigma-distribution as the finding and withdraw the m-dependence
      claim.
    - >-
      The Aut-stable/generic rate ratio is below 1.5 at m = 6. The table
      stability mechanism is not first-order; Outcome 3.
    - >-
      The sham-quotient control shows a gain above 1.05. The harness credits
      plumbing; every number is void until explained.
    - >-
      The matched-seed null arm does not reproduce the plain-rho constant
      within the pre-registered band. Instrument failure; no ratio reported.
    - >-
      A cell shows net_gain_ratio above sqrt(m) with all null controls passing
      and replication at three sizes. That is the one interesting event in the
      lane, requires independent review before any interpretation, and must not
      be summarised as a speedup until reviewed.
    - >-
      Budget exhaustion or crashes. INFRASTRUCTURE outcome under AGENTS.md rule
      5, never negative mathematical evidence.

  confounders:
    - >-
      BRANCH (B2) AT TOY SCALE. Its m^2 r^2 / N contribution is negligible at
      crypto N and can be a few percent at N ~ 2^16 with m = 6 and r = 32. It
      must be counted separately, not folded into the (B1) rate.
    - >-
      CANON BIAS. min-over-orbit is not obviously a uniform selector on
      correlated encodings; if sigma is not uniform the derived rates shift.
      The sigma-distribution is a required metric precisely to catch this.
    - >-
      NORMALISATION ACCOUNTING. Whether the inversion needed by canon is
      charged per step or amortised by simultaneous inversion changes the net
      gain by more than the effect being measured. The convention must be
      frozen before Stage 3 and reported with every number.
    - >-
      x-COORDINATE CLASS COUNTING. Would make m = 4 indistinguishable from
      m = 2 and silently zero the j = 1728 row.
    - >-
      j WITHOUT RATIONALITY. a = 0 over p = 2 mod 3 has j = 0 and |Aut_{F_p}|
      = 2; treating it as an m = 6 curve contaminates the arm with the m = 2
      answer.
    - >-
      CENSORING. Conditional-on-success means inflate the quotient arm. This is
      the exact defect audited in REVIEW-H100-20260717 C5 and it is the most
      likely way this experiment produces a false gain.
    - >-
      TOY-SIZE CONSTANT DRIFT. Constants measured at 16-24 bits need not hold
      at 2^48 or at crypto size; three sizes are the minimum and drift is
      reported, never averaged away.

  interpretation_limits:
    - >-
      ANY MEASURED EXCESS OVER sqrt(|Aut|) IS A SUSPECTED INSTRUMENT ARTIFACT
      UNTIL THE MATCHED-SEED NULL, THE SHAM-QUOTIENT NULL AND THE
      RANDOM-ORACLE CONTROL ALL SAY OTHERWISE, and even then it requires
      independent review before being described as anything (RQ-EWALK-8fa147
      decision_target).
    - >-
      Constants only. The exponent is 1/2 and is fixed by KN-TECH-005.
    - >-
      Toy scale, pure Python, p up to about 32 bits. Nothing here is
      crypto-scale validation and no evidence record from it may exceed
      claim_tier toy (AGENTS.md rule 7).
    - >-
      Scoped to the enumerated escape rules, the named curve model, the frozen
      charging convention and the tested sizes. A different curve model changes
      per-step costs by a factor 2-3 and can reverse any conclusion.
    - >-
      A measured shortfall closes only the tested scope. It is not a statement
      that no escape rule can reach sqrt(m).
    - >-
      This measures a CLOSED family (see admissibility_argument). A good result
      here is a tighter baseline, never an attack.

  reachability_gate: >-
    THIS PROPOSAL SELECTS CURVES, IT DOES NOT WALK BETWEEN THEM, and the gate
    is the reason the result cannot be turned into an attack on a chosen
    target. By T4 the isogeny class fixes D_0, so |Aut| is not something an
    attacker can improve for a GIVEN target: from a class with D_0 not in
    {-3, -4} no isogeny walk of any length reaches a curve with |Aut| > 2, at
    any cost. The J0 and J1728 arms are therefore CONSTRUCTED, not reached: the
    experiment generates curves with the desired D_0 directly, which is
    legitimate for measuring the constant and illegitimate as a model of what
    an attacker could do to an arbitrary target. Cost of construction: O(1)
    rejection sampling on p mod 3 and p mod 4 at toy size. Cost of reaching a
    j = 0 curve from a non-CM-(-3) class: unbounded, because no such curve
    exists in the class.

  target_complexity:
    time_exponent: >-
      1/2, unchanged. The measured object is the constant multiplying
      sqrt(N): ideal 1.2533/sqrt(m), i.e. 0.8862 / 0.6267 / 0.5116 at
      m = 2 / 4 / 6, with the achieved value predicted strictly above each.
    memory_exponent: >-
      O(1) per processor plus the DP table, unchanged. Note that the DP density
      on canonicalised encodings is inflated by the orbit size in the encoding
      the predicate reads, which is charged here and analysed separately in
      IDEA-20260807-15b468.
    best_known: >-
      0.886*sqrt(N) fully charged parallel rho with DPs (KN-TECH-001,
      KN-TECH-006), already containing the negation sqrt(2); the
      automorphism-discounted CM variant (KN-TECH-018, KN-LIT-042) is the
      m in {4, 6} row and is what this proposal measures rather than beats.
    hidden_overhead: >-
      No o(1); no asymptotic claim. Disclosed: the normalisation inversion,
      whose amortisation convention can swing the answer more than the effect;
      the curve model, worth 2-3x per step; and censoring, which if dropped
      inflates the quotient arm by roughly the censored fraction.
    tradeoff_note: >-
      DP granularity d is swept, so cells are compared on the memory/steps
      tradeoff surface rather than at one point. Every escape rule is
      constrained to be a function of the current class only, preserving the
      memorylessness that near-linear van Oorschot-Wiener parallel speedup
      requires; a rule that violates it is rejected before measurement and its
      rejection count is reported.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every frontier row this
    program records. As an ATTACK this proposal mounts none and is dominated by:
    parallel rho with DPs at 0.886*sqrt(N) time and O(1) memory (KN-TECH-001,
    KN-TECH-006); the automorphism-discounted variant on CM curves at
    1.2533*sqrt(N/m) ideal (KN-TECH-018, KN-LIT-042) -- which is the very
    object measured here, so this proposal is dominated by its own subject;
    BSGS at sqrt(N) time and sqrt(N) memory; and kangaroo/Gaudry-Schost for
    intervals including the Galbraith-Ruprai equivalence-class variant at a
    heuristic 1.36*sqrt(N) (KN-LIT-7437). On data/queries nothing is consumed,
    so no row is dominated there. As a MEASUREMENT the incumbents are
    EXP-RHO-60da4f (m = 2, three sizes, approved, richer escape-rule grid,
    larger N) and the staged artifact h040 (m = 2, 16 and 18 bits, censored).
    This proposal is dominated by EXP-RHO-60da4f on scale and on escape-rule
    coverage at m = 2, and dominates it on the only axis that matters here --
    it covers m in {4, 6}, which that record excludes by construction, and adds
    the table-stability variable.
  sota_delta: >-
    ZERO speedup against any attack baseline; none is sought. Quantitatively as
    a measurement delta: fills 2 of the 3 rows of the |Aut| table with measured
    numbers where the program currently has 0 (H-ENDO-001 prediction 4 records
    that 0.886*sqrt(N/|Aut|) "has never been measured" by this campaign, and
    EV-ENDO-001 records ZERO RUNS for the experiment that would have done it);
    supplies 1 derived rate law 1/(m r) with a factor-m sign flip under table
    stability; and produces 1 pre-registered number nobody has -- the cell, if
    any, at which the m = 6 quotient's fully charged gain crosses 1.0. Expected
    headline: the achieved gain at m = 6 is materially below 2.449 and the
    shortfall grows with m, which is a tighter baseline and not an attack.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.8 that the generic-table rate decreases with m roughly as 1/(m r) --
    the derivation is short and its m = 2 case already agrees with an
    independently derived record. 0.55 that the Aut-stable/generic ratio
    reaches the predicted factor m, because canon bias and longer cycle types
    could dominate at m = 6. 0.7 that at least one cell at m = 6 shows a net
    gain below 1.0 once censoring is charged, given that the audited m = 2
    staged artifact already shows 8.5 and 14.5 percent censoring and that the
    x-only unescaped variant measured 1.83x and 2.57x WORSE than plain rho
    (REVIEW-H100-20260717 C8). 0.05 that anything exceeds sqrt(m), and if it
    does the first hypothesis is a broken harness.

