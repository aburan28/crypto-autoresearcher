idea:
  id: IDEA-20260807-267b95
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    ASSEMBLE THE RIGHT-HAND SIDE AND ACTUALLY SOLVE: the lane has never built a
    linear system with a right-hand side, so no cost path exists at all --
    produce the first certificate-carrying end-to-end index-calculus discrete
    log on a j = 0 curve with a phi-stable factor base, against a
    CARDINALITY-MATCHED random base and against rho, BSGS and the
    automorphism-discounted rho, and measure the constant C in the
    linear-in-N prime-field collection cost
  class: algorithm

  claim: >-
    (A) THE ABSENCE THIS ADDRESSES, STATED FROM THE RECORD. DEC-20260727-009 R3
    records, of this entire line of work, that "_collect_relations builds rows as
    bare 0/1 incidence vectors and never records the target's scalar multiple,
    so no linear system with a right-hand side has ever been assembled - not in
    EXP-STR-002, not in EXP-STR-003", that the measured rank deficiency of the
    phi arm's own row list was 4, 6, 30 and 67, and that "there is no committed
    rho or BSGS baseline at n = 41617 or n = 158071, the two instances carrying
    the headline claims". THE LANE HAS NO END-TO-END COST PATH. This proposal
    builds one. It is filed as an ALGORITHM proposal rather than as tooling
    because the object produced is a complete attack pipeline with a verifiable
    output, and its deliverable is a fully-charged cost, not a metric.

    (B) THE SYSTEM, WRITTEN OUT. On a j = 0 curve with G = <P> of prime order N,
    Q = [k] P, and phi acting on G as lambda with lambda^2 + lambda + 1 = 0
    mod N, take a factor base V that is a union of m phi-orbits, |V| = 3m, with
    canonical orbit representatives whose logs are l_1, ..., l_m. Draw targets
    R_t = a_t P + b_t Q with independent random a_t, b_t. A successful arity-2
    decomposition R_t = eps_1 phi^{c_1}(P_{j_1}) + eps_2 phi^{c_2}(P_{j_2})
    gives the linear equation over F_N
      eps_1 lambda^{c_1} l_{j_1} + eps_2 lambda^{c_2} l_{j_2} - b_t k = a_t.
    THE UNKNOWNS ARE l_1, ..., l_m AND k: exactly m + 1 of them. Collect until
    the system has rank m + 1 and solve; k is read off directly and is
    independently verifiable by checking [k] P == Q, which is a
    docs/claims-and-verification.md solution certificate that the run wrapper
    re-verifies without touching the solver.
    THE MATCHED ARM: the same everything with V a uniformly drawn on-curve
    x-coordinate set of the SAME cardinality 3m, whose unknowns number 3m + 1.
    THE RELATION ARITHMETIC, EXPLICIT: in the phi arm each successful search
    yields ONE independent equation and the orbit closure yields two more rows
    that are lambda-multiples with rank increment 0, so full rank needs m + 1
    successful searches; in the matched arm it needs 3m + 1; the per-search
    success probability is the same in both because it depends on |V| = 3m and
    the arity. The end-to-end relation-collection ratio is therefore predicted
    to be (3m + 1)/(m + 1), which tends to 3 and is measurably below 3 at small
    m -- a sharper prediction than the asymptotic constant, and one that the
    matched-cardinality design makes checkable.

    (C) THE COST MODEL, WITH ITS OWN PREDICTION. Let P_succ be the measured
    per-target success probability, s the measured cost per decomposition
    search, and L the measured linear-algebra cost. Then
      total(phi arm)    = (m+1) / P_succ * s + L(m+1),
      total(matched arm) = (3m+1) / P_succ * s + L(3m+1).
    With the exhaustive-pair search s = Theta(|V|^2) = Theta(9 m^2) and
    P_succ = Theta(m^2 / N), the collection term is Theta(m N) -- WORSE than
    linear in N and increasing in m. With the standard quadratic-root search
    (for each v in V solve the quadratic S_3(v, x2, x_R) = 0 for x2 and test
    membership) s = Theta(|V|) = Theta(3m) and the collection term becomes
    Theta(N / 1) -- LINEAR IN N AND INDEPENDENT OF m. THE PRE-REGISTERED
    STRUCTURAL PREDICTION: total cost is flat in m over a wide range once the
    quadratic-root search is used, and the constant C in total = C * N / r is
    the number this experiment exists to measure. No prior record in this
    program contains it.

    (D) THE THREE OUTCOMES, ALL DELIVERABLES.
      O1 (expected). Both arms solve, the phi arm needs (3m+1)/(m+1) times fewer
        successful searches, the end-to-end ratio is close to that value, and
        BOTH lose to rho by a factor of order sqrt(N)/(0.886 C / sqrt(6)) --
        thousands at 20 bits. The deliverable is the first fully-charged
        prime-field index-calculus cost in this program, with the measured C,
        and the first end-to-end confirmation that the phi-stable base's benefit
        survives full accounting at exactly the predicted size.
      O2. The phi arm's end-to-end ratio is MATERIALLY BELOW (3m+1)/(m+1) --
        the unknown reduction does not survive accounting, and the cause is
        locatable in the recorded per-stage timings (most likely the
        lambda-coefficient linear algebra, which is dense over F_N rather than
        0/1 sparse). That is a concrete negative about the classical quotient's
        realisability, and it would be new.
      O3. The phi arm's ratio EXCEEDS (3m+1)/(m+1) by more than the noise band.
        Something is producing more than the accounted saving; the first
        suspects are a lower per-search cost in the phi arm (the membership test
        can be done on the invariant line, one cube instead of three lookups) or
        an unaccounted density effect. Either is a finding and would be routed
        to a new record rather than absorbed here.

    (E) WHAT THIS IS NOT. It is not a claim that index calculus is competitive
    -- claim (C) predicts the opposite quantitatively. It is not evidence about
    H-STR-002 in either direction: no displacement rank is measured, no
    block-circulant structure is constructed, no structured solver is used or
    priced, and the linear algebra is ordinary dense Gaussian elimination over
    F_N chosen precisely because it is the neutral choice.

  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: >-
    R1: the pipeline decomposes points by solving polynomial conditions on
    x-coordinates as FIELD ELEMENTS -- a generic-group simulator cannot evaluate
    S_3 or test membership of an x-coordinate in a set, so relation collection
    is not simulable in the sense of KN-FIND-b7e091. R2: the phi-stable base and
    the invariant-line membership test use the curve equation a = 0. THE ONE
    PLACE ADMISSIBILITY COULD BE QUESTIONED, ADDRESSED DIRECTLY: the orbit
    closure step (emitting phi(R) and phi^2(R)) IS generic-group simulable and
    is exactly Oracle D of KN-FIND-b7e091 -- which is why this proposal charges
    it as a cost and credits it with ZERO relations (claim (B)), rather than
    counting its output as progress. The saving claimed comes from the unknown
    count, which is a property of the factor base's construction and not of any
    oracle call.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). PRODUCES
      NO EVIDENCE ABOUT IT IN EITHER DIRECTION, and the separation is designed
      in rather than asserted: the linear algebra here is ordinary dense
      Gaussian elimination over F_N, no displacement rank is computed, no
      phi-shift operator is constructed, the committed
      _measure_displacement_rank is never called, and no structured solve is
      priced against Wiedemann. What this record addresses is DEC-20260727-009's
      R3, which is an ABSENCE (no assembled system, no baseline) rather than a
      claim; filling an absence asserts nothing about the hypothesis whose
      evidence record had it. A downstream record that cites this one as
      bearing on H-STR-002 has misread both.
    - >-
      EXP-STR-002, EXP-STR-003, EXP-STR-004. All three measure properties of a
      row list. None assembles a right-hand side, none solves, none produces a
      discrete log, and none archives a rho or BSGS baseline at the instances
      carrying their headline numbers (DEC-20260727-009 R3). This proposal's
      output is a solved instance with a certificate, which is a different kind
      of object from anything those experiments produce.
    - >-
      IDEA-20260807-b42544 (the measurement contract). That record defines and
      validates the rank-increment metric at small scale and stops there. This
      record runs the full pipeline to a solve and prices it. b42544 is a
      prerequisite: its planted-signal and lambda controls are this record's
      gates, and running this one without it risks reporting a cost path built
      on a broken row format.
    - >-
      KN-TECH-003 (point-decomposition index calculus) and KN-LIT-006. Those
      record the METHOD and the surveyed conclusion that it does not beat
      generic methods over prime fields. This record does not dispute either; it
      measures the constant that the surveyed conclusion leaves unstated, on
      this harness, with the automorphism quotient in place.

  object_first_candidate:
    tracked_object: >-
      THE FULLY-CHARGED END-TO-END COST of recovering k, decomposed into
      per-stage measured quantities: targets drawn, S_3 evaluations, successful
      searches, rows emitted, rank after each row, linear-algebra field
      operations, and wall time -- tracked as a function of (m, N, arm).
    lossiness: >-
      LOSSY: it forgets the algebra entirely -- which relations were found, which
      orbits, which phases, what the matrix looked like. It retains only what a
      cost model consumes. That is the right projection for the question
      "does the quotient survive accounting", and it is deliberately blind to
      every structural quantity this lane has previously measured, which is what
      keeps it independent of them.
    propagation: >-
      Deterministic and additive across stages by construction: total is the sum
      of measured stage costs, with no modelled term. THE DISCIPLINE THAT MAKES
      THIS REAL: nothing may be modelled that can be measured. Prior work in
      this lane priced two MODELS of solving a system that was never assembled
      (DEC-20260727-009 R3); here every term in the total is an executed,
      recorded quantity, and any term that cannot be executed is reported as
      missing rather than estimated.
    survival_score: >-
      Survives change of arm, of m, of curve, of seed. Dies at the field size
      where an end-to-end solve exceeds budget -- expected around 20 to 24 bits
      given a collection cost linear in N -- and that death point is itself a
      reported number rather than a failure.

  mechanism: >-
    STEP 1 -- ROW FORMAT AND lambda. Extend the collection record to
    (a_t, b_t, [(j_i, c_i, eps_i)]) and compute lambda as the root of
    X^2 + X + 1 mod N matching the chosen zeta_3, verified by
    phi(P) == [lambda] P. HARD GATE, inherited from IDEA-20260807-b42544.

    STEP 2 -- QUADRATIC-ROOT SEARCH, WHICH IS THE COST-DECISIVE CHANGE. Replace
    the committed exhaustive V x V scan (harness/semaev.py::_find_decomposition,
    which is Theta(|V|^2) per target) with: for each v in V, S_3(v, x2, x_R) is
    a QUADRATIC in x2; solve it over F_p; test whether either root lies in V;
    on a hit, lift and check the point sum. Cost Theta(|V|) per target. This is
    standard and is not claimed as novel; it is stated because the committed
    instrument's quadratic scan changes the measured exponent of the collection
    stage from N to m N, and a cost path built on it would price the wrong
    algorithm.

    STEP 3 -- MEMBERSHIP ON THE INVARIANT LINE (phi ARM ONLY). In the phi arm,
    membership of a candidate x in V is decided by testing x^3 in the set of m
    orbit invariants -- ONE cube and one hash lookup -- instead of three lookups
    for x, zeta x, zeta^2 x. This is valid by IDEA-20260807-4d7e8e and is a
    constant-factor instrument advantage that MUST be measured separately and
    reported, because it is a second, independent source of phi-arm advantage
    and conflating it with the unknown-count quotient would inflate the headline
    ratio.

    STEP 4 -- SOLVE AND CERTIFY. Accumulate rows until rank m + 1 (phi arm) or
    3m + 1 (matched arm) over F_N, solve by dense Gaussian elimination, extract
    k, and emit a certificate {kind: discrete_log, statement: {curve, P, Q, k}}
    which the run wrapper re-verifies by computing [k] P and comparing with Q,
    independently of the solver. Every collected relation additionally carries a
    decomposition certificate re-verified by
    semaev.verify_decomposition_certificate.

    STEP 5 -- THE BASELINES, ARCHIVED AT THE SAME INSTANCES. Run
    harness/rho.py on the identical instance and record its group operations;
    run BSGS; and compute the automorphism-discounted rho reference
    0.886 sqrt(N)/sqrt(6) (KN-TECH-018). All three must be archived AT THE
    INSTANCES CARRYING THE HEADLINE NUMBERS -- the specific defect
    DEC-20260727-009 R3 names -- not at smaller ones.

    STEP 6 -- THE COST TABLE. Report, per (arm, m, instance): targets drawn,
    S_3 evaluations, successful searches, rows emitted, rank curve,
    linear-algebra field operations, wall time per stage, peak memory, and the
    fully-charged total; plus the three baselines and the ratios. Derive C from
    total = C * N / r and report it with its fit residual.

    STEP 7 -- THE m-SWEEP. Repeat over m spanning at least a factor of 8, to
    test claim (C)'s flatness prediction. Flatness in m is a strong structural
    check on the whole cost model and costs only more cells.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'phi-invariant|phi-orbit|phi-stable|equivariant",' over the
      repository, files_with_matches (60 files, head limit -- a FLOOR);
      (2) 'orbit representative|factor.base quotient|quotient the factor base|
      reduced factor base|lambda \* l|scalar lambda' over ledger/, content;
      (3) 'DEFER-BATCH009-001' over the repository, content.
      Records read in full: DEC-20260727-009 (R3 in particular), EV-STR-003
      lines 280-340 (O-9 through O-13), H-STR-002, RQ-EQIC-8cb959,
      harness/semaev.py, harness/endomorphism_la.py, harness/toycurve.py
      signatures, KN-TECH-003, KN-TECH-006, KN-TECH-018, KN-LIT-006. External
      web searches and the eprint 2021/721 abstract fetch as recorded in
      IDEA-20260807-1ea327.
    results: >-
      DEC-20260727-009 R3 and EV-STR-003 O-9 state positively that no linear
      system with a right-hand side has been assembled in this line and that no
      solve was available at any tested instance; EV-STR-003 O-9 records rank
      deficiencies 4, 6, 30, 67. No record in this repository contains an
      end-to-end index-calculus solve on a prime-field curve with a phi-stable
      base, nor a measured constant for the collection cost. Externally,
      end-to-end index calculus with an endomorphism-reduced factor base IS
      published for extension fields and genus-2 Jacobians (Tsakou-Ionica,
      abstract quoted in IDEA-20260807-1ea327), so the PIPELINE is not novel;
      the prime-field measurement is not stated there and prime fields are
      surveyed as unfavourable in KN-LIT-006.
    verdict: >-
      ADAPTATION. Index calculus with an automorphism-quotiented factor base is
      textbook and published; running it end to end and pricing it honestly is
      execution, not invention. It is filed at HIGH priority anyway because the
      absence it fills is the single largest gap in this lane -- a lane that has
      spent four experiments measuring properties of row lists that were never
      solved -- and because a fully-charged constant is exactly the kind of
      number the program's cost-honesty rules demand and does not have.

  null_object_control: >-
    MANDATORY AND BLOCKING. MATCHED NULL: the cardinality-matched random factor
    base, |V| = 3m in BOTH arms, same curve, same target stream (same a_t, b_t
    seeds), same search implementation, same linear-algebra implementation. The
    ONLY difference is whether V is a union of orbits and hence whether the
    unknown count is m or 3m.
    THE FORBIDDEN COMPARISON, RUN AND REPORTED: a random base of cardinality m
    (unknown-count-matched, cardinality-mismatched). Its per-search success
    probability is about 9 times lower at arity 2 and it will look terrible;
    reporting it makes the size confound visible as a number rather than
    available as an argument.
    DECAY PARAMETER: epsilon, the orbit-breaking fraction at fixed cardinality
    3m. The end-to-end cost ratio must move monotonically from its epsilon = 0
    value to 1.00 at epsilon = 1, tracking the unknown count
    (1 - epsilon) m + 3 epsilon m. A ratio flat in epsilon means the advantage
    is not coming from the orbit structure.
    ANTI-NULL: solve an instance whose k is known by construction and confirm
    the pipeline returns it; and solve one whose relation system is deliberately
    rank-deficient and confirm the pipeline reports failure rather than a wrong
    k. A pipeline that cannot fail cannot be trusted when it succeeds.

  assumptions:
    - >-
      N is prime and lambda is a unit mod N; verified per instance by
      phi(P) == [lambda] P.
    - >-
      Independent random (a_t, b_t) per target. The committed _collect_relations
      draws targets as an arithmetic progression of scalar multiples, which
      makes the targets dependent and would bias P_succ; changing this is
      required and the change is recorded.
    - >-
      Arity 2 only. At arity 2 the decomposition test is a quadratic and no
      Groebner run is needed, which is why an end-to-end solve is feasible at
      all in pure Python. Arity 3 is out of scope here.
    - >-
      Dense Gaussian elimination over F_N is affordable at (m+1) up to a few
      hundred, i.e. O(m^3) with m of order sqrt(N)/3. This bounds the field size
      reachable and is a measured feasibility limit, not an assumption about
      mathematics.
    - >-
      Toy scale, claim_tier toy. The instance sizes reachable are far below any
      deployed parameter and nothing extrapolates.

  proof_search_map:
    bottleneck: >-
      Relation collection, and within it the per-target search cost s. Claim (C)
      shows the whole end-to-end exponent hinges on whether s is Theta(|V|)
      (quadratic-root search) or Theta(|V|^2) (exhaustive scan): the former
      gives total Theta(N/r), the latter Theta(m N / r). Getting this step right
      is the difference between measuring the method and measuring the harness.
    baseline_embedding:
      parameter_slice: >-
        epsilon = 1, i.e. the fully de-orbited base: the pipeline becomes
        ordinary prime-field arity-2 index calculus with a random factor base,
        which is the incumbent method described in KN-TECH-003. The claimed
        family therefore contains the incumbent as an exact slice.
      reproduction_check: >-
        Frozen regression fixture: at epsilon = 1 the pipeline must recover the
        same k on the same instance as at epsilon = 0 (correctness is
        arm-independent), and its successful-search count must equal
        3m + 1 within sampling noise. Additionally, on one small instance the
        recovered k must equal the k that harness/rho.py recovers -- an
        independent solver agreeing on the answer, which is the strongest cheap
        correctness check available.
    observation_collision:
      observable: >-
        The recovered k, and the fully-charged total cost.
      distinct_preimage_search: >-
        For k there is no collision risk: [k] P == Q identifies k uniquely in a
        prime-order group, and the certificate re-verification is exact -- this
        is the rare case where the observable is a complete invariant and the
        audit records that rather than manufacturing a search. FOR THE COST the
        collision search is real and required: find two arms with the same total
        cost and different unknown counts, which would mean the unknown count is
        not the controlling variable and would fire outcome O2.
    constructive_transforms:
      - transform: baseline_lift
        proposed_object: >-
          Enlarge the certificate family from "a relation exists" (a
          decomposition certificate, which is what this lane has produced) to
          "k = value" (a discrete-log certificate re-verified by one scalar
          multiplication), and prove a strict inward improvement rather than
          feasibility: the phi arm must beat the matched arm by the predicted
          (3m+1)/(m+1), not merely also work.
        predicted_gain: >-
          Converts a lane whose strongest archived certificate is
          {kind: none} (DEC-20260727-009 refutation_artifact) into one carrying
          a re-verifiable solve, and makes every cost claim in the lane
          checkable against an executed baseline at the same instance.
    quantifier_order: >-
      Intended: FOR ALL instances in the declared toy family and FOR ALL m in
      the declared range, the phi arm recovers k and its fully-charged total is
      a factor (3m+1)/(m+1) below the cardinality-matched arm's, within the
      declared band.
      NOT claimed, and the difference is the whole point of the m-sweep: FOR ALL
      instances THERE EXISTS an m at which the ratio holds -- which would let
      the winning m depend on the instance and would make the result
      unusable. The audit obligation is that the ratio must hold ACROSS the
      m-sweep, not at a single m.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On these toy j = 0 curves at arity 2, the phi-stable factor base
        reduces the fully-charged end-to-end cost by a measured factor F, and
        the absolute cost is C * N / r with measured C, against an archived rho
        baseline at the same instance." It can NEVER certify that index calculus
        is competitive (claim (C) predicts the opposite), anything at higher
        arity, anything at crypto scale, or anything about a != 0 curves.
      nearby_object_control: >-
        The cardinality-matched random base: the closest object on which the
        hoped-for advantage must vanish. And the unknown-count-matched,
        cardinality-mismatched base, on which a naive method would report a huge
        spurious advantage -- a method that cannot tell those two apart has not
        controlled for size, which is this lane's defining requirement.
    proof_obligations:
      - claim: the assembled system's unique solution is the true k.
        responsibility: correctness
      - claim: every relation and the final k carry re-verified certificates.
        responsibility: soundness
      - claim: full rank is reached at m+1 and 3m+1 successful searches.
        responsibility: success_probability
      - claim: the quadratic-root search finds every decomposition the scan does.
        responsibility: completeness
      - claim: rho and BSGS baselines are archived at the headline instances.
        responsibility: baseline
      - claim: total cost is flat in m under the quadratic-root search.
        responsibility: runtime
      - claim: peak memory of the dense solve is recorded per cell.
        responsibility: memory

  predictions:
    - metric: >-
        successful searches to full rank, matched arm over phi arm
      direction: higher
      minimum_effect: >-
        (3m + 1)/(m + 1) exactly, within a band of plus or minus 12 percent over
        at least 20 independent target streams. Note this is NOT 3.00 at small
        m: at m = 16 it is 2.88, at m = 64 it is 2.97. Pre-registering the
        m-dependent value rather than the asymptotic 3 is what makes the
        prediction sharp.
    - metric: >-
        fully-charged end-to-end wall time, matched arm over phi arm
      direction: higher
      minimum_effect: >-
        At least 2.0 at every tested m. Below 2.0 fires outcome O2 and the
        per-stage timings must locate the loss. Above (3m+1)/(m+1) plus the
        band fires outcome O3 and the excess must be attributed -- the first
        suspect being the invariant-line membership test of STEP 3, which must
        therefore be measured separately.
    - metric: >-
        the constant C in total = C * N / r, fitted across the m-sweep and the
        field-size ladder
      direction: different
      minimum_effect: >-
        Reported with its residual. THE PREDICTION IS THAT THE FIT IS GOOD: the
        residual of the linear-in-N model should be below 20 percent across at
        least three field sizes. A poor fit means the cost model in claim (C) is
        wrong and the reported C is meaningless, which is itself the finding.
    - metric: >-
        total cost as a function of m at fixed N, under the quadratic-root
        search
      direction: different
      minimum_effect: >-
        FLAT within a factor of 1.5 across an 8-fold range of m. A strong
        m-dependence means the collection stage is not Theta(|V|) per target and
        the search implementation must be audited before any C is reported.
    - metric: >-
        end-to-end total against archived rho at the same instance
      direction: higher
      minimum_effect: >-
        Index calculus predicted WORSE by a factor of order
        sqrt(N) * sqrt(6) / (0.886 r) -- roughly 900 at N about 2^17 and roughly
        3600 at N about 2^21. Reporting this ratio, measured rather than
        modelled, at the instances carrying the headline numbers, is the single
        most useful honesty artifact this record produces.
    - metric: certificate verification pass rate
      direction: different
      minimum_effect: >-
        100 percent. Any failure invalidates the run; a recovered k that fails
        [k] P == Q is a solver bug, not a result.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR: ONE SOLVE AT 12 BITS, BOTH ARMS. At
      field_bits = 12 with N about 3000 and m about 9 (so |V| = 27), the
      exhaustive search is affordable, the dense solve is trivial, and the whole
      pipeline runs in seconds. If the phi arm does not recover k, or does not
      reach full rank at m + 1 successful searches, the design is wrong and
      nothing larger should be attempted. That single cell tests the entire
      pipeline including certificates.
      THEN: field_bits in {12, 16, 20}, seeds {1, 2, 3}, both arms plus the
      forbidden-comparison arm, with the quadratic-root search, 20 target
      streams per cell, archived rho and BSGS at every instance.
      THEN: the m-sweep at the largest affordable field size, m spanning a
      factor of 8, to test flatness.
      THEN: the epsilon ladder at one instance.
      THEN: fit C and report the cost table.
    controls:
      - cardinality-matched random base, |V| = 3m in both arms (blocking)
      - the forbidden unknown-count-matched, cardinality-mismatched arm
      - epsilon orbit-breaking ladder at fixed cardinality
      - anti-null: known-k instance and deliberately rank-deficient system
      - archived rho and BSGS at the headline instances, not only at small ones
      - >-
        cross-solver agreement: recovered k must equal harness/rho.py's k on at
        least one instance per field size
      - certificate re-verification of every relation and of the final k
      - >-
        invariant-line membership test measured separately from the
        unknown-count effect
    required_metrics:
      - targets drawn, S_3 evaluations, successful searches, rows emitted
      - rank after each inserted row, per arm
      - linear-algebra field operations and wall time, per arm
      - peak memory, per cell
      - fully-charged total, per arm, per cell
      - archived rho group operations and BSGS cost at the same instance
      - recovered k and its certificate verification result
      - fitted C and its residual
      - m-sweep flatness curve and epsilon ladder curve

  falsification_conditions:
    - >-
      The phi arm does not recover k, or recovers a k failing [k] P == Q. The
      pipeline is wrong; nothing is reported until repaired; and this is an
      implementation failure, not evidence about the method (AGENTS.md rule 5).
    - >-
      Full rank is not reached at m + 1 successful searches in the phi arm. Then
      either the relations are not independent as claim (B) says, or the
      collection is producing duplicates. The rank curve locates which, and the
      first case would contradict the arithmetic and be a major observation.
    - >-
      The end-to-end ratio is materially below (3m+1)/(m+1). Outcome O2: the
      quotient does not survive accounting; the per-stage timings must name
      where it was lost, and the answer is reported even if it is unflattering
      to the classical baseline.
    - >-
      Total cost is strongly m-dependent under the quadratic-root search. The
      cost model in claim (C) is wrong; no C is reported.
    - >-
      The linear-in-N fit residual exceeds 20 percent across the field-size
      ladder. Same disposition.
    - >-
      The dense solve exceeds memory at the largest cell. An INFRASTRUCTURE
      outcome under AGENTS.md rule 5, recorded with the memory number, and it
      caps the reachable field size rather than saying anything mathematical.

  confounders:
    - >-
      TARGET DEPENDENCE. The committed collector draws targets as consecutive
      multiples of P, which correlates them and biases P_succ. Independent
      random (a_t, b_t) is mandatory and the change must be recorded, since it
      alters the object of measurement relative to prior runs in this lane.
    - >-
      SEARCH IMPLEMENTATION. The exhaustive V x V scan changes the collection
      exponent from N to m N. Which search is used must be stated with every
      number, and both should be measured at one small cell so the difference is
      quantified rather than argued.
    - >-
      TWO SOURCES OF phi-ARM ADVANTAGE. The unknown-count quotient and the
      cheaper invariant-line membership test are independent, and pooling them
      inflates the headline ratio. STEP 3 measures the membership test
      separately for exactly this reason.
    - >-
      DENSE VERSUS SPARSE LINEAR ALGEBRA. The phi arm's rows carry
      lambda-power coefficients and are DENSER in value than the matched arm's
      0/1 rows, even though both have the same support size. A sparse solver
      would treat them differently; dense Gaussian elimination is chosen to
      neutralise this, and the choice must be reported because it is also the
      choice that keeps this record independent of H-STR-002's subject matter.
    - >-
      SIGN BOOKKEEPING. eps_i is a lift choice; an inconsistent convention
      produces rows that are wrong over F_N while looking right as incidence
      vectors, and the resulting system will simply fail to yield the correct k
      -- which is why the certificate check is the load-bearing control.
    - >-
      RHO VARIANCE. A single rho run has high variance; the baseline must be the
      median of at least 10 runs, reported with its spread, or the comparison
      ratio is noise.

  interpretation_limits:
    - >-
      NO EVIDENCE ABOUT H-STR-002 IN EITHER DIRECTION. No displacement rank, no
      structured solver, no block-circulant construction. DEFER-BATCH009-001
      remains open and untouched. Filling the absence R3 names is not adjudicating
      the hypothesis whose evidence record had it.
    - >-
      Toy tier, claim_tier toy, arity 2, j = 0 only. The reachable field sizes
      are bounded by a collection cost linear in N and a dense solve cubic in m.
    - >-
      THE HEADLINE IS EXPECTED TO BE A LOSS. Index calculus is predicted to lose
      to rho by a factor of order sqrt(N) at every tested instance, and the
      record's value is the MEASURED CONSTANT and the archived baseline, not a
      speedup. Any summary that omits the loss ratio is incomplete.
    - >-
      j = 0 is a measure-zero family fixed by the isogeny class (T4); no
      standardized curve in this program's target set is in it.
    - >-
      The (3m+1)/(m+1) ratio is a within-index-calculus comparison. It is not a
      speedup against any attack baseline and must never be quoted without the
      rho comparison in the same sentence.

  reachability_gate: >-
    NOT APPLICABLE TO THE DESIGN: one fixed curve per instance, no isogeny
    movement, so T5 does not bind and no reachability cost is incurred. BINDING
    ON THE SCOPE via T4, exactly as elsewhere in the lane: the phi-stable base
    requires D_0 = -3, which the isogeny class fixes, so a target curve outside
    that class cannot be moved into it at any cost. The measured constant C,
    however, is a property of prime-field arity-2 index calculus generally and
    the epsilon = 1 arm measures it WITHOUT any automorphism -- so that half of
    the deliverable is not scope-limited to CM curves, which is worth recording
    because it is the more broadly useful number.

  target_complexity:
    time_exponent: >-
      EXPONENT 1 IN N, MEASURED RATHER THAN ASSERTED. With the quadratic-root
      search, collection is (m+1)/P_succ * Theta(m) with P_succ = Theta(m^2/N),
      giving Theta(N) independent of m; the linear algebra is Theta(m^3) dense,
      subdominant at the balanced m; so total = C * N / r. Against rho's
      0.886 sqrt(N)/sqrt(6) this is worse by Theta(sqrt(N)). NO EXPONENT IS
      IMPROVED BY THIS PROPOSAL AND NONE IS CLAIMED; the deliverable is C, the
      constant nobody in this program has measured.
    memory_exponent: >-
      Dominated by the dense (m+1) x (m+2) system over F_N: Theta(m^2 log N)
      bits, with m of order sqrt(N)/3, hence Theta(N log N / 9) bits -- versus
      rho's O(1) and BSGS's Theta(sqrt(N)). The phi arm's r-fold unknown
      reduction divides this by r^2 = 9, which is the largest single constant
      improvement in the whole lane and is still catastrophically worse than
      both baselines. Reported per cell.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) group operations
      and O(1) memory (KN-TECH-001, KN-TECH-006); on j = 0 the
      automorphism-discounted variant at 0.886 sqrt(N)/sqrt(6) (KN-TECH-018),
      which is the correct comparator for this curve family; BSGS at sqrt(N)
      time and sqrt(N) memory. All three are to be ARCHIVED at the headline
      instances, not cited.
    hidden_overhead: >-
      Three disclosures. (a) The orbit-closure rows cost real time and produce
      zero rank; they are charged and credited nothing, and a pipeline that
      emitted them and counted them would show a spurious 3x. (b) The
      lambda-power coefficients make the phi arm's rows dense in value, so its
      linear algebra is not cheaper per row than the matched arm's despite
      having fewer rows -- the saving is in row COUNT only. (c) The
      quadratic-root search needs a square-root mod p per candidate, which is a
      logarithmic-cofactor cost hidden inside "Theta(|V|) per target" and is
      measured in field operations rather than assumed away.
    tradeoff_note: >-
      The m parameter is a time-memory dial: larger m means fewer targets but a
      bigger dense system, and claim (C) predicts total TIME is flat in m while
      MEMORY grows as m^2 -- so the honest operating point is the smallest m
      that keeps the collection affordable, which is the opposite of the usual
      index-calculus intuition and is a reportable consequence.
      Parallelization: collection is embarrassingly parallel over targets in
      both arms; the dense solve is not, and its serial fraction is measured.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, AND THE CHECK IS
    NOT CLOSE. TIME: dominated by parallel rho with distinguished points at
    0.886 sqrt(N) (KN-TECH-001/006) and, on this curve family, by the
    automorphism-discounted variant at 0.886 sqrt(N)/sqrt(6) (KN-TECH-018),
    against this proposal's C * N / r -- a shortfall of order sqrt(N). MEMORY:
    dominated by rho's O(1) absolutely, and by BSGS's Theta(sqrt(N)) as well,
    against this proposal's Theta(N log N / (9 r^2)) bits at the balanced m.
    DATA/QUERIES: dominated by rho's O(sqrt(N)) group operations against
    Theta(N) decomposition attempts. There is no axis on which this proposal is
    non-dominated, and the record says so before reporting any number. AS AN
    INSTRUMENT it is dominated by nothing in this repository, because no
    end-to-end prime-field index-calculus cost path exists here at all
    (DEC-20260727-009 R3) -- which is the reason to build it.
  sota_delta: >-
    Zero speedup against any attack baseline, and a quantified LOSS rather than
    a gap of unknown size: predicted worse than automorphism-discounted rho by
    about sqrt(N) * sqrt(6) / (0.886 r), i.e. roughly 900 at N about 2^17 and
    3600 at N about 2^21, to be measured against an archived baseline at the
    same instance. The within-method delta is the phi arm's (3m+1)/(m+1) fewer
    successful searches and r^2 = 9 times smaller relation matrix. The new
    quantity delivered is C, the constant in total = C * N / r, which no record
    in this program currently contains.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that both arms solve end to end at 12 and 16 bits with passing
    certificates; the risk is sign and lambda bookkeeping, and the certificate
    check catches it deterministically. 0.70 that 20 bits is reachable within a
    reasonable budget given collection linear in N. 0.75 that the
    successful-search ratio lands within 12 percent of (3m+1)/(m+1). 0.55 that
    the end-to-end wall-time ratio also does -- lower, because two independent
    advantage sources and a dense solve make the wall clock noisier than the
    search count. 0.60 that the linear-in-N fit is good enough to report a C.
    Essentially 1.00 that index calculus loses to rho at every instance, which
    is the expected headline and is a deliverable rather than a disappointment.

