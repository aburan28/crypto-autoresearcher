    was made.
  assumptions:
    - Single-core CPU instrument; no GPU or SIMD claim. A later throughput instrument is a separate record.
    - Public parameters only; planted logs with generator-known scalars; no live keys.
    - The independent verifier (PARI/GP or Sage scalar multiplication over F_{p^5}) shares no code with the backend.
    - Word products (64x64 -> 128) are the primary unit; wall time is recorded but never transferred.
    - No negation map, no endomorphism, no Frobenius on points (card C-2); the diagonal Frobenius appears only in Itoh-Tsujii and is labelled arithmetic.
  proof_search_map:
    not_applicable_reason: >-
      Tooling; no theorem, bound, certificate family or closure is proposed.
      The acceptance suite below is the pre-compute audit: each test has a
      known answer written before the build and can fail.
    bottleneck: null
    baseline_embedding:
      parameter_slice: The prime-field null must reproduce the existing F_p core's per-step count within 10% before any F_{p^5} number is read.
      reproduction_check: Counter equality on 2^20 steps; steps-to-solve distribution equality on 100 solves at a common order.
    observation_collision:
      observable: Acceptance-test pass/fail per item.
      distinct_preimage_search: Not applicable.
    constructive_transforms: []
    quantifier_order: For every acceptance item there exists a pre-written expected value and a run that reports pass or fail against it.
    method_ceiling:
      strongest_certifiable_claim: A qualified instrument; nothing about the ECDLP.
      nearby_object_control: The Z/n transport and the prime-field null.
    proof_obligations:
      - claim: Every reported logarithm is re-verified by the independent verifier.
        responsibility: correctness
      - claim: Counters count every 64x64 product in every field routine.
        responsibility: runtime
      - claim: The walk is a function of the point only (trail byte-identity across inversion paths and multipliers).
        responsibility: correctness
  predictions:
    - metric: planted_logs_recovered
      direction: higher
      minimum_effect: 64 of 64 on the about-2^36-to-2^40 calibration subgroup and 64 of 64 on each toy p' cell.
    - metric: isolated_word_products_per_operation
      direction: flat
      minimum_effect: Schoolbook 25, Karatsuba 15, squaring 15 exactly; 320-bit Montgomery multiplication 50 to 60.
    - metric: trail_byte_identity
      direction: flat
      minimum_effect: Identical DP sequences from a fixed seed across inversion paths and multipliers.
    - metric: steps_to_solve_vs_zn_transport
      direction: flat
      minimum_effect: KS p > 0.05 on 100 solves at a common order; mean ratio 1.00 +/- 0.05.
    - metric: prime_field_null_vs_existing_core
      direction: flat
      minimum_effect: Per-step count within 10%; steps-to-solve distribution equal (KS p > 0.05).
  minimal_test:
    design: >-
      Build, then run the acceptance suite in this order and stop at the first
      failure: (1) field unit tests against PARI/GP for 10^6 random operands
      per operation, including the diagonal Frobenius and the norm inverse;
      (2) isolated counters; (3) prime-field null against the existing F_p
      core; (4) Z/n transport equality; (5) trail byte-identity; (6) planted
      logs with certificates on the calibration subgroup and toy cells; (7)
      state-bytes report against the declared layout. Only after (7) may any
      consumer record read a number.
    controls:
      - PARI/GP arithmetic oracle (known answers) for every field routine.
      - Existing F_p rho core as the prime-field reference.
      - Z/n transport as the absolute generic reference for the walk.
      - Fixed-seed determinism check across builds and paths.
    required_metrics:
      - acceptance_item_pass_fail_table
      - isolated_counter_values
      - certificate_pass_rate
      - state_bytes_per_walk_per_mode
      - null_and_transport_agreement_statistics
  falsification_conditions:
    - >-
      Any acceptance item fails; the instrument is not qualified, the failure
      is an infrastructure outcome (AGENTS rule 3), and no consumer record
      reads a number until it is repaired.
    - >-
      Trails differ across inversion paths or multipliers; the walk depends on
      arithmetic internals and the backend is unqualified.
    - >-
      The independent verifier rejects any claimed logarithm; unqualified.
  confounders:
    - A verifier that shares the backend's field code would not be independent; the verifier must be PARI/GP or Sage.
    - Point counting over F_{p^5} at 320 bits may be slow in PARI; the subfield-curve zeta shortcut is permitted for the calibration group only, and the walk must not use Frobenius on that group.
    - Compiler auto-vectorisation making the schoolbook and Karatsuba arms indistinguishable in time; counters, not time, are the acceptance unit.
  interpretation_limits:
    - Tooling only; no research result, no exponent, no security statement.
    - Single-core; throughput on other hardware is a separate instrument.
    - Qualification is at the tested orders and cells; a consumer record that needs another regime re-runs the relevant acceptance items there.
  heuristic_assumptions:
    - id: H-TOOL-0
      statement: NONE. Acceptance tests have known answers; no distributional assumption is made by the instrument itself. Recorded so the absence is explicit.
      rigorous_support: Known-answer testing.
      validation_plan: The acceptance suite.
  heuristic_note: >-
    Consumer records carry their own heuristics; the instrument carries none.
