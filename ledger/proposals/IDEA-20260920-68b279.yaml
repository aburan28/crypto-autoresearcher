idea:
  id: IDEA-20260920-68b279
  question_id: RQ-GFPN-c01af8
  added: '2026-09-20'
  status: proposed
  approved_by: null
  title: >-
    Shared instrument: an F_{p^5} Pollard-rho backend for F_p[z]/(z^5 - 3),
    p = 2^64 - 2^32 + 1, with word-product counters, two inversion paths,
    pluggable partition and predicate, multi-target bookkeeping, Z/n transport
    and independent certificates -- the one piece of tooling every rho-side
    record under RQ-GFPN-c01af8 charges and none can run without
  class: tooling
  claim: >-
    No rho backend over F_{p^n} exists in this program or in either sibling
    repository (card V5: the cryptanalysis library's core is F_p only, the
    crypto repository's rho engineering is the binary-field ECC2K-130 GPU
    client). IDEA-20260920-0d218c, -204828, -2e37b3, -5b1f84 and -a05ca7 each
    name the same missing instrument. This record specifies it once, with
    acceptance tests that can fail, so that the coordinator can dispatch it as
    one deliverable and the five records can cite one qualified instrument.
    The claim, stated so it can fail: a single-core C or Rust backend with (a)
    Goldilocks F_p arithmetic and F_{p^5} arithmetic in the z^5 - 3 basis with
    selectable schoolbook and 2+3 Karatsuba multipliers, (b) affine r-adding
    rho with Montgomery batch inversion on two switchable paths
    (extension-level, norm-level), (c) a pluggable partition index and
    distinguished-point predicate, (d) van Oorschot-Wiener distinguished-point
    collision detection with a shared table and multi-target bookkeeping, (e)
    a kangaroo/interval mode, (f) exact 64x64 word-product counters and a
    per-walk state-bytes report, (g) a Z/n generic transport running the same
    walk logic on a randomly labelled cyclic group, and (h) planted-log
    certificates re-verified by an independent scalar multiplication
    (PARI/GP or Sage), passes the acceptance suite below: 64 of 64 planted
    logs on a subgroup of order about 2^36 to 2^40 of a random curve over the
    deployed field, isolated counters reading 25 / 15 / 15 / about 55 word
    products for schoolbook / Karatsuba / squaring / 320-bit Montgomery
    multiplication, byte-identical trails across inversion paths from a fixed
    seed, and steps-to-solve identical in distribution to the Z/n transport.
    No research result is claimed; a backend that fails a test is not
    qualified and no record above may read a number from it.
  mechanism: >-
    OBJECT FRAME (card C-4). The instrument implements the F1 walk-collision
    object under the full translation action, lossless, in the affine
    F_{p^5} representation (R1). It adds no object and proposes no attack;
    its content is the acceptance suite, which is the part that can fail.
    ARITHMETIC. F_p with p = 2^64 - 2^32 + 1: products in 128 bits, reduction
    by the identity 2^64 = 2^32 - 1 mod p (a few adds and a conditional
    subtract), lazy reduction of a 5-term accumulation permitted and counted.
    F_{p^5}: coefficient products by schoolbook (25) or 2+3 Karatsuba (15),
    wrap by multiplication by 3 (V3); squaring (15); Frobenius by the diagonal
    zeta^i (V1), used ONLY inside Itoh-Tsujii inversion and labelled
    arithmetic (card C-2). The generic 320-bit Montgomery path for the
    prime-field null shares the walk code and differs only in the field
    module.
    WALK. Plain r-adding walk R -> R + T_j, j = index(R), with NO negation map
    and no fruitless-cycle handling (card user_constraint: the sqrt(2) is
    inside the baseline constant and is applied arithmetically; measuring it
    is H-RHO-bc6ea6's lane on prime fields and is not reopened). Coefficients
    (a, b) are recovered by trail replay from the seed as in the sibling
    ECC2K-130 client, so per-walk state is the point plus scratch; a
    carry-(a, b) mode exists for the state-accounting arms. Distinguished
    points by low bits of one coefficient at a set density; a shared table
    keyed by the x-coordinate words; collision -> relation -> logarithm ->
    certificate.
    MODES. Single target; L targets with one table (IDEA-20260920-2e37b3);
    interval/kangaroo with tame and wild herds and the same DP machinery
    (IDEA-20260920-a05ca7). Counters: every 64x64 product in the field
    modules increments one counter; per-walk state bytes are reported from the
    layout and from a spill report.
    CALIBRATION GROUPS. A random ordinary curve over the deployed F_{p^5}
    whose order (PARI ellcard over F_{p^5}, or the zeta function of a subfield
    curve as an instrument convenience whose Frobenius the walk never uses)
    has a prime factor of about 2^36 to 2^40, cofactor-projected; toy p'
    cells F_{p'^5} at p' about 2^20 to 2^30 for high-repetition statistics;
    the two named curves for cost-only runs (no solve at 320 bits).
