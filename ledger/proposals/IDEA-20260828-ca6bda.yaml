idea:
  id: IDEA-20260828-ca6bda
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-28'
  title: 'Redo the arithmetic before extrapolating it: build a pure calculator implementing the analytic
    chosen-prefix cost formula (birthday target-set size traded against per-block near-collision search
    cost over k near-collision blocks) from ONLY the parameters the 2019 and 2020 papers themselves
    declare, and report the ratio between the calculator''s output and each paper''s own headline
    complexity as a pre-declared agreement factor, using the SECOND paper as an independent held-out
    check on whatever formula reproduces the first.'
  class: measurement
  claim: '(A) The number 2^63.4 (Leurent-Peyrin 2020, eprint 2020/014, "SHA-1 is a Shambles") and the
    2^66.9/2^69.4 pair (Leurent-Peyrin 2019, eprint 2019/459, "From Collisions to Chosen-Prefix Collisions")
    are each PRESENTED IN THEIR OWN PAPERS as the output of an analytic cost model over declared inputs:
    a birthday-phase target-difference-set cardinality, a near-collision block count k (1 partial +
    9 full blocks in the 2020 attack per public reporting), and a per-block search cost implied by
    the disturbance vector''s sufficient-condition count. RQ-SHAONE-081e3a''s own provenance note states
    plainly that "every number in this record is UNVERIFIED" and that no re-derivation from parameters
    has been done in this program''s corpus. (B) This proposal re-derives it: extract the declared
    per-block and per-phase parameters from primary text (filed as KN-LIT first, per the RQ''s binding
    constraint), implement a formula with NO free-fitted constant, evaluate it at each paper''s own
    declared parameters, and report the calculated-to-reported ratio for BOTH papers as two independent
    test points of the SAME formula. (C) The claim is that agreement (within a pre-declared factor,
    e.g. within 2x on each of two independent papers) shows the published headline numbers are transparent,
    re-derivable functions of their own stated inputs rather than numbers this program must simply
    carry forward; disagreement on one paper but not the other localises exactly which declared parameter
    or model assumption the discrepancy sits in, since the SAME calculator is run unchanged on both.
    (D) WHAT IS NOT CLAIMED: no new collision, no assertion that either paper is wrong, no 2026 re-pricing
    (that is charging, a separate and later step; this is reproduction only), and no security consequence.
    A calculator that reproduces both papers within the pre-declared factor is not evidence the papers
    are correct in any absolute sense -- only that this program''s formula is consistent with what both
    papers report about themselves. (E) A result showing the calculator reproduces ONE paper but not
    the other is itself the single most valuable output this proposal could return: it means the two
    papers'' analytic cost models are not the same function of parameters, which every later cost-model
    proposal in this batch (elasticity vector, N(k) minimization, ratio R(w)) inherits as an unresolved
    choice it must declare rather than assume away.'
  mechanism: 'STAGE 0 (gating, per RQ constraint): file eprint 2019/459 and eprint 2020/014 as KN-LIT
    at stated provenance (both currently only WebSearch-snippet-verified by this proposal, not read
    in primary text) before any calculator is coded against them. STAGE 1: extract, verbatim with page/section
    citation, every declared numeric input from both papers -- near-collision block count k, disturbance-vector
    sufficient-condition count per block, birthday-phase target-difference-set cardinality, and any
    stated per-GPU or per-call cost normalisation. STAGE 2: write the cost formula as a pure function
    C(k, condition-counts, target-set-size) with no hidden constant, implementing the SAME analytic
    form KN-TECH-066 describes for message-modification/disturbance-vector accounting (condition count
    determines per-block search cost; target-set size determines birthday-phase cost by the standard
    birthday-bound relation). Two independent implementations of STAGE 2 are written from the STAGE
    1 extraction sheet without cross-consultation, to catch transcription-driven agreement. STAGE 3:
    evaluate the formula at the 2020 paper''s declared parameters; compute the ratio C_calculated /
    2^63.4 (the reported figure) or 2^63.4''s constituent parts if the paper reports them separately
    (birthday-phase cost and total each, per the RQ''s own note that the exact figure was not confirmed
    in initial excerpts and must be read from primary text). STAGE 4: evaluate the SAME unmodified formula
    at the 2019 paper''s declared parameters and compute the ratio against 2^66.9 (optimistic) and 2^69.4
    (conservative). STAGE 5: report both ratios, their agreement with the pre-declared factor, and
    whether the two independent STAGE-2 implementations agree with each other before either is compared
    to a paper. STAGE 6, null control: perturb one declared input at a time by a stated amount (e.g.
    condition count off by one, target-set size off by a factor of 2) and confirm the calculator''s
    output moves in the analytically predicted direction and magnitude -- validating that the calculator
    is sensitive to its own declared inputs rather than dominated by a hidden constant.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a in full (its first target and its own provenance note both name
      this exact reproduction as unperformed) and GOAL-SHA1-001 in full (completion_criteria item 1
      requires "a stated reproduction result against the published computation... within a PRE-DECLARED
      factor"). Read IDEA-20260816-1e36fa (N(k) minimisation) and IDEA-20260816-962936 (elasticity
      vector) in full: 1e36fa explicitly validates only the FUNCTIONAL SHAPE of C(k) at MD5 scale and
      states "no assertion that any published source contains [k or C]" is made -- it deliberately
      never plugs in the SHA-1 papers'' own numbers. 962936 explicitly takes the cost model''s structural
      form "as an INPUT... and never derives one." Grepped ledger/proposals for ''2020/014'', ''2019/459'',
      ''reproduction factor'', ''agreement factor'' (no hits outside this batch''s own text).'
    results: No filed proposal against RQ-SHAONE-081e3a evaluates either paper''s analytic formula
      at that paper''s OWN declared numeric parameters and compares the output to that paper''s own
      headline number. 1e36fa is the closest relative and explicitly declines this exact step. No KN-LIT
      entry for eprint 2019/459 or 2020/014 exists in knowledge/literature as far as this session's
      reading found (KN-LIT-91b680 is a secondary survey chapter, not either primary paper).
    verdict: 'UNVERIFIED. No claim about whether anyone outside this program has re-derived these numbers
      from the papers'' own stated parameters -- plausible that the papers'' own appendices already
      do this arithmetic explicitly, in which case this proposal''s STAGE 1-4 partly duplicates the
      paper''s own presentation and should say so once primary text is read. What is new internally
      and asserted here: this repository holds no re-derivation and no calculated-to-reported ratio
      for either paper, and using the SECOND (2019) paper as an independent held-out test of the SAME
      formula that reproduces the first (2020) is a control this program''s own corpus does not carry.'
  citations:
    - ref: "eprint 2020/014 (Leurent, Peyrin, \"SHA-1 is a Shambles\")"
      provenance: retrieved
      claim: "Chosen-prefix collision at complexity 2^63.4, 1 partial + 9 near-collision blocks, ~107 GPU-years on GTX 1060, ~US$45k GPU rental."
      verified_by: "WebSearch snippet 2026-08-28; full primary PDF not opened by this proposal. Must be filed as KN-LIT before STAGE 1 per RQ constraint."
    - ref: "eprint 2019/459 (Leurent, Peyrin, \"From Collisions to Chosen-Prefix Collisions\")"
      provenance: retrieved
      claim: "Chosen-prefix attack on full SHA-1 at complexity 2^66.9 (optimistic) to 2^69.4 (conservative), versus prior best chosen-prefix attack at 2^77.1 and classical collision at 2^64.7."
      verified_by: "WebSearch snippet 2026-08-28; full primary PDF not opened. Must be filed as KN-LIT before STAGE 4."
    - ref: KN-TECH-066
      provenance: internal
      claim: "Message-modification / degrees-of-freedom accounting is the standard analytic form for per-block condition-satisfaction cost in unkeyed differential hash cryptanalysis."
      verified_by: "Read in full this session, knowledge/techniques/KN-TECH-066.md."
    - ref: KN-LIT-91b680
      provenance: internal
      claim: "Survey confirms CPC attacks are the strongest practical collision-class attacks on MD5-class/SHA-1 designs and the birthday-bound ~2^(n/2) framework."
      verified_by: "Read in full this session, knowledge/literature/KN-LIT-91b680.md."
  object_first_candidate:
    tracked_object: 'The declared-parameter tuple (k, per-block condition counts, target-set cardinality)
      for each paper, carried through ONE shared pure function into a single calculated complexity,
      never through the paper''s prose description of its own result. What is followed is the FUNCTION
      EVALUATION, not the number the paper states in its abstract.'
    lossiness: 'Genuinely lossy. The projection discards every step of the papers'' own attack construction
      (the specific message differential, the specific GPU kernel, the specific near-collision block
      contents) and retains only the numeric parameters a cost formula needs. It is compatible with
      the target operation because the formula''s output is, by the papers'' own presentation, supposed
      to be determined by exactly those parameters; what is lost is any qualitative detail that would
      explain a mismatch beyond "which declared input moved the number," which is why STAGE 6''s one-input-at-a-time
      perturbation is required to localise a disagreement rather than merely report one.'
    propagation: 'One step of the target operation is evaluating the shared formula at one paper''s
      parameter tuple. The object propagates by producing exactly one number per paper, and the two
      numbers are compared against two independently reported figures using the identical, unmodified
      function -- so agreement or disagreement is attributable to the formula and the extraction, not
      to two different formulas being quietly used for two different papers.'
    survival_score: 'The object survives exactly as long as both papers'' analytic cost presentations
      are expressible in the same functional form (a target-set-size-vs-block-count tradeoff). It dissolves
      if either paper''s actual cost accounting includes a term this proposal''s formula omits (e.g.
      a message-collection or padding overhead) -- and that dissolution is itself the reportable finding,
      located precisely by which paper it happens to and by which STAGE-6 perturbation direction fails
      to explain the gap.'
  null_object_control: 'One-input-at-a-time perturbation (STAGE 6): hold every declared parameter fixed
    except one, move that one by a stated factor, and confirm the calculator''s output changes in the
    algebraically predicted direction and magnitude before any paper comparison is trusted. A calculator
    whose output does not respond correctly to its own declared inputs cannot be used to judge agreement
    with either paper, and this control is run and must pass before STAGE 3-4 are reported.'
  discriminated_from:
    - 'IDEA-20260816-1e36fa (N(k) minimisation, this batch): derives the general combinatorial form
      of C(k) and validates its SHAPE at MD5 scale, explicitly declining to plug in either SHA-1 paper''s
      own numbers. This proposal does the opposite and only that: it plugs in exactly those numbers
      and reports the ratio, with no combinatorial derivation of N(k) attempted.'
    - 'IDEA-20260816-962936 (elasticity vector, this batch): takes a cost model''s structural form as
      a GIVEN input and varies price/throughput/memory around it; this proposal supplies that structural
      form''s VALIDATION against the two source papers, upstream of and a precondition for 962936''s
      exercise, and neither may cite the other''s output as already established.'
    - 'IDEA-20260816-8e0b9c (identical-vs-chosen-prefix ratio): measures a ratio between two EXECUTED
      analogue attacks at reduced widths; this proposal never executes any search and instead evaluates
      a closed-form function at full-scale SHA-1 parameters taken verbatim from two papers.'
    - 'GOAL-RSA-001''s memory-charged NFS reproduction discipline: the acknowledged methodological ancestor
      (RSA-001 discipline named explicitly in the RQ); this proposal is its direct symmetric-cryptography
      instantiation and does not import any RSA-specific parameter or convention beyond the reproduce-before-extrapolate
      discipline itself.'
  assumptions:
    - Both papers state their per-block and per-phase parameters explicitly enough in primary text to
      extract without inference; if either paper's presentation is qualitative only, that paper's arm
      is reported as blocked rather than filled by a guessed number.
    - The two papers use materially the same class of analytic cost formula (target-set-size vs. block-count
      tradeoff); if the 2019 and 2020 papers' own internal accounting differs structurally, the calculator
      cannot be the same function for both and the proposal must say so rather than force a fit.
    - Two independently written STAGE-2 implementations from the same extraction sheet are a sufficient
      check against transcription error; a third independent re-derivation is out of scope at this budget.
    - The pre-declared agreement factor (a fixed multiplicative tolerance, e.g. 2x, chosen before STAGE
      3 and never adjusted after seeing a ratio) is the correct falsification threshold; too loose a
      factor would make the reproduction claim vacuous, and it is fixed in advance for exactly this reason.
  proof_search_map:
    not_applicable_reason: >-
      This is a parameter-level arithmetic reproduction check against two already-published numeric
      results, not a proof of a new theorem or a novel algorithmic ceiling claim. There is no bottleneck
      step whose removal would change a theorem, no observation-collision search over a certificate,
      and no constructive transform being attempted; KN-TECH-080's proof-architecture apparatus does
      not apply. The nearest analogue -- baseline reproduction under a pre-declared agreement factor
      -- is carried in STAGE 1-4 and STAGE 6 of `mechanism` instead.
  predictions:
    - metric: ratio of calculated complexity to reported complexity for the 2020 paper (2^63.4)
      direction: different
      minimum_effect: 'pre-declared agreement factor of 2x (i.e. ratio in [0.5, 2.0]) is the threshold
        for "reproduced"; the direction is not pre-committed since either the calculator or the extraction
        could be wrong in either direction.'
    - metric: ratio of calculated complexity to reported complexity for the 2019 paper, evaluated at
        both its optimistic (2^66.9) and conservative (2^69.4) declared bounds
      direction: different
      minimum_effect: same pre-declared 2x factor, applied as an independent held-out test of the identical
        unmodified formula used for the 2020 paper
    - metric: agreement between the two independently written STAGE-2 implementations, evaluated at
        identical extracted parameters
      direction: different
      minimum_effect: 'forced near-exact agreement (within floating-point tolerance); disagreement here
        means the extraction sheet or the formula description is ambiguous and voids STAGE 3-4 until resolved'
    - metric: calculator output response to each STAGE-6 one-input perturbation, relative to the algebraically predicted direction
      direction: different
      minimum_effect: 'every perturbation must move the output in its predicted direction; any that
        does not is an implementation bug and halts the run'
  minimal_test:
    design: 'The cheapest discriminating step is STAGE 0 plus STAGE 6 alone, with no paper comparison
      yet: file both papers as KN-LIT at declared provenance, write the two independent calculator
      implementations from a shared extraction sheet, and run only the one-input-at-a-time perturbation
      control. This costs no compute beyond reading and a small script, and it settles whether the
      calculator is even well-formed before either paper''s headline number is touched. Only if STAGE
      6 passes and the two implementations agree does the run proceed to STAGE 3-4, which cost nothing
      beyond evaluating the same function at two more parameter tuples.'
    controls:
      - Two independently written calculator implementations from the same extraction sheet, compared before either touches a paper's headline number.
      - One-input-at-a-time perturbation control (STAGE 6), run and passed before any reported-ratio is trusted.
      - Pre-declared agreement factor fixed before STAGE 3, never adjusted after seeing a ratio.
      - The 2019 paper used as a held-out second test point for the identical formula that is calibrated against (or found to disagree with) the 2020 paper, never fitted separately.
    required_metrics:
      - extracted parameter tuple per paper with page/section citation
      - calculated complexity for both papers, both independent implementations
      - calculated-to-reported ratio per paper, with the pre-declared 2x threshold stated alongside
      - perturbation-response direction and magnitude per declared input
      - agreement/disagreement between the two independent implementations
  falsification_conditions:
    - Either paper's declared parameters cannot be extracted from primary text without inference, blocking that arm rather than filling it with a guess.
    - The two independent STAGE-2 implementations disagree with each other on identical inputs, voiding STAGE 3-4 until resolved.
    - Any STAGE-6 perturbation moves the output in the wrong direction or by the wrong order of magnitude, indicating an implementation bug.
    - The calculator reproduces the 2020 paper's number within the pre-declared factor but misses the 2019 paper's by more than the factor (or vice versa), showing the two papers do not share one analytic cost form.
    - Both ratios lie outside the pre-declared factor, showing this program's assumed general formula (KN-TECH-066's condition-count accounting) is not the one either paper actually used.
  confounders:
    - A paper's headline number may already include a documented safety margin or rounding the extraction sheet must capture explicitly, or the "gap" found is just that margin rather than a modelling error.
    - The 2019 and 2020 papers may report complexity in different units (SHA-1-equivalent calls vs. GPU-years vs. dollars) that must be normalised identically before any ratio is meaningful; a unit-conversion error would masquerade as a modelling disagreement.
    - The declared per-block condition count in either paper may itself be an approximation the paper states as such, in which case an exact-arithmetic mismatch is expected and must not be over-read as a finding.
  interpretation_limits:
    - A ratio within the pre-declared factor certifies internal consistency between this program's formula and the papers' own stated numbers; it is not independent verification that either paper's underlying attack complexity is correct.
    - No 2026 hardware re-pricing is performed here; that is explicitly a separate, later step this proposal only prepares the ground for.
    - Nothing here bears on the counter-cryptanalysis detector, on any deployed system, or on SHA-1's security beyond restating what the two cited papers already report.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The reported total complexity C_reported for each paper is a deterministic function of that
        paper's own declared (k, per-block condition counts, target-set cardinality) with no unstated
        multiplicative correction beyond a small, documented rounding factor -- i.e. the paper's headline
        number is fully explained by its own stated inputs, the way a regression's fitted value is
        fully explained by its declared covariates with no omitted-variable bias.
      rigorous_support: >-
        No proved theorem backs this; it is a methodological trust assumption about how the source
        papers present their own arithmetic, analogous to trusting that a stated formula's inputs are
        exhaustive rather than partial.
      validation_plan: >-
        Sample: the two declared parameter tuples (2019 and 2020 papers), n=2, the only data points
        available since these are unique published results, not a distribution to sample from. Shortcut:
        none needed, since extraction is direct reading rather than computation. Comparison: the pre-declared
        agreement factor as the acceptance criterion (STAGE 3-4), with H1 accepted only if BOTH independent
        points pass, since one pass and one failure would show the formula fits one paper's presentation
        but not the general pattern. Tail check: the direction and magnitude of any STAGE-6 perturbation
        response is the only available internal consistency check at n=2, since no distributional tail
        exists to examine.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed or altered. The deliverable is a reproduction ratio for a published
      complexity figure, evaluated at that figure's own declared parameters.
    memory_exponent: >-
      No memory exponent is claimed. Memory footprint is not part of this reproduction step and is
      explicitly deferred to the later 2026 charging exercise the elasticity-vector proposal (IDEA-20260816-962936) performs.
    best_known: >-
      The incumbent is the practice this RQ exists to correct: carrying 2^63.4 and 2^66.9/2^69.4 forward
      as inherited constants with no independent re-derivation from their own papers' declared parameters,
      as this RQ's own provenance note states plainly ("every number in this record is UNVERIFIED").
    hidden_overhead: >-
      The real risk is silent scope creep in STAGE 1: extracting a parameter that requires interpretation
      (rather than direct reading) and reporting it as declared. The two-independent-implementation
      control exists specifically to catch this, but only catches implementation divergence, not a
      shared misreading of the same source text.
    tradeoff_note: not applicable; no time-memory tradeoff is exercised by a closed-form arithmetic check.
  dominated_by: >-
    n/a (no result claimed). Checked across time, memory and data/query axes: the deliverable is a
    reproduction ratio for an already-published number, placing no new point on any attack frontier.
    The single UNVERIFIED chosen-prefix cost row this repository holds in RQ-SHAONE-081e3a is exactly
    what this proposal would upgrade from "inherited" to "re-derived," not something it competes against.
  sota_delta: >-
    No attack; conceptual/measurement contribution only. Quantitatively: the repository moves from
    zero re-derivations of either paper's headline number from that paper's own declared parameters
    to two independently-implemented calculator evaluations with stated agreement ratios and a pre-declared
    pass/fail threshold. No speed or memory comparison is stated because no algorithm is proposed.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    Separable parts. (1) That both papers' relevant parameters are extractable from primary text without
    inference: about 0.7 -- academic cost-model papers usually state these explicitly, but the exact
    per-block condition count is the kind of detail that sometimes lives only in a table this program
    has not yet read. (2) That the two independent implementations agree with each other on identical
    inputs: about 0.85, since this is largely a transcription-fidelity check. (3) That the SAME formula
    reproduces the 2020 paper within the pre-declared factor: about 0.55 -- plausible if the papers
    present a genuinely closed-form model, uncertain if the true accounting has terms this program's
    KN-TECH-066-derived formula omits. (4) That the identical formula ALSO reproduces the 2019 paper
    within factor: about 0.4, since two different papers by overlapping authors two years apart plausibly
    used somewhat different accounting conventions, and this is exactly the scenario the proposal is
    built to surface rather than paper over. Composite roughly 0.11 for full four-part success; the
    minimal STAGE-0/STAGE-6 test alone succeeds with probability near 0.8 and is cheap enough to run
    regardless of the composite odds.
