idea:
  id: IDEA-20260905-f4a078
  title: Refinement via the kernel of the verification quotient
  class: mechanism
  claim: For fixed message hashing and decoding semantics, a cofactored group equation refines to a strict equation
    exactly on an explicitly certified domain that eliminates the quotient kernel from the residual. This supports
    a clean proof of equivalence for honest-subgroup inputs without asserting equivalence for all encodings.
  mechanism: Treat the verification residual as an abstract group element Rv. Cofactored verification asks whether
    [h]Rv is zero; strict verification asks whether Rv is zero. The load-bearing object is ker[h] intersected with
    the permitted residual domain. If that intersection is trivial, the predicates agree. If it is not, the abstract
    algebra proves only a potential separation; obtaining a message-consistent signature instance would require
    additional constraints and is not attempted. Decoding and hashing are separate maps in the refinement diagram,
    so a byte-level change that alters the hash transcript cannot be hidden by equality of decoded points.
