  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDEG-001
  goal_id: GOAL-SDEG-001
  title: Under the E2-01 null the hybrid guess-and-determine optimum for prime-field decomposition
    is FULL guessing — every algebraic variable costs more than enumerating it — so the algebraic
    component contributes nothing at any arity, with three named escapes
  class: mechanism
  claim: 'Fix k of the m coordinates to factor-base values (B^k specialisations) and solve
    the remaining m-k algebraically. By E2-01 the semi-regular solving degree of the residual
    system is ceil(((m-k)(B-1) + D_S)/2), so the charged cost is B^k * ( ((m-k)B/2)^{m-k}
    / (m-k)! )^omega. Compare against k = m-1, where the residual system is UNIVARIATE and
    is not solved by Macaulay linear algebra at all but by root-finding plus an O(1) hash
    lookup, costing 2^{m-1} per specialisation by KN-FIND-a8990a Theorem C (complete splitting
    on the factor-base locus). CLAIM: for every m >= 3, every omega > 1 and all B above an
    explicit threshold B_0(m, omega), the total is strictly minimised at k = m-1, i.e. at
    pure enumeration, and the ratio of the k=m-2 cell to the k=m-1 cell is Theta(B^{2 omega
    - 1}) — at omega = 2 a factor B^3, growing without bound. THE NAMED OBSTRUCTION: under
    semi-regularity the residual solving degree grows LINEARLY IN B per retained variable,
    so the marginal cost of keeping one more variable algebraic (a factor about (B/2)^omega)
    always exceeds the marginal cost of guessing it (a factor B). Since omega > 1 this is
    strict, uniformly in m. THREE ESCAPES, STATED AS FORWARD GUIDANCE AND NOT AS CAVEATS:
    (E1) a factor base whose membership description has degree o(B) — the only channel that
    changes the slope, and exactly KN-OPEN-020; (E2) failure of semi-regularity so severe
    that d_solve = O(B^{1/(2 omega)}) or below, which is E2-01''s outcome (3) and is what
    the SDEG ladder measures; (E3) a non-Macaulay solver whose cost is not C(d+n,n)^omega
    — resultant/subresultant towers, numerical homotopy, or structured solvers of the kind
    E2-09 constructs.'
  mechanism: 'This is the corollary that converts E2-01''s null from a number into an algorithmic
    verdict, and it explains a fact the corpus has recorded without explaining: every prime-field
    Semaev experiment that has ever run is, in effect, enumeration with a symbolic wrapper.
    The linear-in-B slope is the whole content. In the Weil-descent setting the membership
    degree is 2, the slope in the analogous parameter vanishes, and the hybrid optimum moves
    to an interior k — which is why hybrid/BooleanSolve-style methods are useful over F_2
    and useless over F_p. The record therefore also predicts WHERE the hybrid optimum should
    be interior: exactly when the membership degree is O(1), i.e. never over prime fields
    with a set-theoretic factor base.'
  why_not_a_renamed_known_approach: 'Nearest known method: the Bettale-Faugere-Perret hybrid
    approach, which optimises the number of specialised variables for MQ systems and is classical.
    The difference is that the classical analysis is run with FIXED-DEGREE generators (quadratics)
    plus field equations, where the residual degree of regularity is bounded and the optimum
    is interior; here the membership generators have degree B and the residual degree of regularity
    is linear in B, which flips the optimum to the boundary. The conclusion — hybrid optimum
    = pure enumeration, uniformly in m — is not a restatement of the classical result but
    its opposite, and it follows from substituting E2-01''s null into the classical framework.'
  predictions:
  - observable: charged cost as a function of the guessed count k
    metric: log_B(cost) at k = 0..m-1, m in {3,4,5}, omega in {2, 2.807}
    predicted: Strictly decreasing in k over the whole range for B >= B_0(m,omega); the k=m-2
      to k=m-1 ratio exactly Theta(B^{2 omega -1}). Any implemented table showing an interior
      minimum at prime-field membership degree B has a bug or has violated semi-regularity,
      and distinguishing those two is the experiment.
  - observable: measured hybrid optimum on a toy ladder
    metric: argmin_k of measured wall-charged cost, B in {6,8,12}, m in {3,4}, >= 5 seeds
    predicted: k* = m-1 at every cell if the null holds. An interior k* is direct evidence
      of a non-semi-regular collapse and is the positive outcome; its magnitude gives a first
      estimate of E2-01's gamma.
  - observable: the same ladder over GF(2) with Weil-descended membership
    metric: argmin_k
    predicted: Interior k*, because the membership degree is 2. If the boolean arm also returns
      k* = m-1, the instrument is measuring implementation overhead rather than degree and
      no conclusion may be drawn from either arm. This cross-field contrast is the control
      that makes the prime-field negative interpretable.
  minimal_test: 'Stage 0 (zero compute): emit the cost-versus-k table from E2-01''s closed
    form for m in {3,4,5}, B in {4..64}, omega in {2, 2.807}, with B_0(m,omega) solved exactly.
    Stage 1 (low compute): measured argmin_k on p in {1009, 4099}, B in {6,8,12}, m in {3,4},
    >= 5 seeds, with the k=m-1 leaf costed by root-finding plus hash lookup (not by Macaulay),
    and with a matched GF(2) Weil-descent arm at the same number of variables.'
  controls:
  - LEAF-COSTING CONTROL: the k=m-1 leaf must be charged by root-finding, never by a Macaulay
      solve; charging it by Macaulay would over-cost pure enumeration by B^omega and would
      manufacture an interior optimum. This is the single most likely way to fake a positive.
  - BOOLEAN CONTRAST ARM (above), which must show an interior optimum or the instrument is
    void.
  - RANDOM-SUPPORT NULL: replace S_{m+1} by a random polynomial of the same multidegree support;
      the argmin must not move if the effect is degree-driven rather than Semaev-specific.
  - OMEGA CONTROL: all numbers at omega in {2, 2.807}; a sign flip between them is reported
      as omega-indeterminate.
  confounders:
  - Semi-regularity is the null, not a theorem; the record's verdict is conditional on it
    and E2-01 measures it.
  - Real F5 degree falls can lower the residual solving degree below the graded prediction,
    which is exactly escape (E2) and must not be mistaken for an instrument error.
  - Implementation constants differ enormously between a root-finder and a Macaulay reduction;
    the toy arm must report operation counts, not wall time, or the contrast is meaningless.
  - At small B the residual degree is dominated by D_S rather than by B, so the ladder must
    reach B where (m-k)(B-1)/2 > D_S.
  falsification_conditions:
  - An interior argmin_k at prime-field membership degree with the leaf correctly costed,
    replicated over >= 3 seeds and >= 2 primes. The no-go is false and escape (E2) is realised.
  - The boolean contrast arm also returns k = m-1. Instrument failure; no prime-field conclusion
    admissible.
  - B_0(m,omega) turns out to exceed any reachable B, so the claim is vacuous on every measurable
    cell — a reportable scope failure.
  interpretation_limits: Conditional on the E2-01 semi-regular null and on the Macaulay cost
    model; closes exactly the hybrid/guess-and-determine interface over a set-theoretically
    described prime-field factor base, and nothing else. It does NOT say prime-field ECDLP
    is hard, does not touch extension fields, and explicitly leaves E1/E2/E3 open. Toy tier
    for the measured arm.
  assumptions:
  - Non-singular ordinary E/F_p, char > 3, S_{m+1} standard.
  - The guessed coordinates are specialised to factor-base values, not to generic values.
  - Cost of a graded solve is C(d+n,n)^omega; cost of the univariate leaf is root-finding
    plus O(1) membership lookup.
  heuristic_assumptions:
  - id: HA-1
    statement: Specialising k coordinates to factor-base values leaves a residual system that
      is still semi-regular in the E2-01 sense, with the same closed form at m-k variables.
    rigorous_ingredient: 'Rigorous part: the residual membership generators are unchanged
      (f_V of degree B) and remain a regular sequence, so the box-convolution factor is exact.
      Heuristic part: that the specialised Semaev generator still behaves as one generic extra
      form.'
    distribution_imitated: Froberg / Bardet-Faugere-Salvy semi-regularity for a generic overdetermined
      sequence.
    validation_route: On the toy ladder compare the measured graded rank profile of the specialised
      system against the predicted coefficients at every degree, for >= 5 random specialisations
      per cell. TOY SCALE (B <= 12); no crypto-scale shortcut exists for this quantity and
      none is claimed.
    tail_checks: Report the specialisation with the largest negative residual (the most non-semi-regular
      draw) per cell; a heavy left tail would mean rare specialisations collapse the degree,
      which is an exploitable rare-event structure and must be reported rather than averaged
      away.
  target_complexity:
    time_exponent: theta_hybrid(k) = k + (m-k) omega in B, minimised at k = m-1 giving theta
      = m-1 (pure enumeration) versus theta = m omega at k = 0. Feeding E2-02, theta = m-1
      gives IC exponent exactly N^1 at every arity — worse than rho by N^{1/2}.
    memory_exponent: O(B) for the enumeration leaf (the hash table of factor-base x-coordinates)
      versus C(d_reg+m-k, m-k)^2 for a dense residual Macaulay matrix. The boundary optimum
      is also the memory optimum, which is stated because it is unusual for the two to coincide.
    best_known_baseline: Within the decomposition subproblem, the target-keyed MITM at B^{ceil(m/2)}
      time and B^{floor(m/2)} memory dominates BOTH the hybrid optimum and pure enumeration
      for m >= 3. So this record's verdict is that the algebraic route loses to enumeration,
      which itself loses to MITM, which loses to rho.
    hidden_overhead_disclosure: B_0(m,omega) is not computed in this session and is a stage-0
      obligation, not a recalled number. The 2^{m-1} leaf factor is exponential in m and is
      carried explicitly rather than hidden.
    time_memory_tradeoff: The hybrid family has a genuine tradeoff (more guessing = less memory)
      and this record finds the extreme point optimal on BOTH axes under the null, so no interpolation
      is worth costing unless (E2) fires.
  sota_delta: 'Zero on every attack axis. The deliverable is a verdict with a number: the
    algebraic component of prime-field decomposition contributes negative value at every k
    < m-1 under the null, with the k=m-2 penalty exactly Theta(B^{2 omega - 1}) (B^3 at omega
    = 2), and the resulting IC exponent pinned at exactly N^1 versus rho''s N^{1/2}.'
  dominated_by: Pollard rho (0.886 sqrt(N) time, O(1) memory) dominates the entire hybrid
    family on both axes. Within the decomposition subproblem, the target-keyed MITM (B^{ceil(m/2)},
    B^{floor(m/2)}) dominates every k. BSGS, van Oorschot-Wiener, the S T^2 = Omega~(N) preprocessing
    bound and the sqrt(TN) multi-target bound were each checked and none is approached. No
    row left unchecked.
  estimated_cost: Implementation low; compute low (stage 1 is single-digit CPU hours at B
    <= 12).
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the k = m-1 optimum holds under the null (it is an inequality
    between B and (B/2)^omega). 0.75 that the toy measurement confirms it — lower than the
    derivation's prior because the toy B range may sit below B_0, and because degree falls
    are real. 0.15 that an interior optimum appears and escape (E2) fires at toy scale.
