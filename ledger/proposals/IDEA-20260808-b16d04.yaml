    N1: "same-shape histogram-preserving placement permutation"
    same_shape: "identical sizes, independent curves, four models, roots, join, caps, inference, serialization, counters; no reuse"
    exact_quotient:
      construction: "K_Q=2M,F_Q=257,G=Z/(F_Q*K_Q)Z,q(x)=x mod K_Q; each fiber F_Q"
      domain: IDEA-20260808-b16d04/control/exact-quotient/v1
      trials: "n_Q=1048576 independent pairs per b; hit iff q(u)=q(v); p=1/K_Q"
      exact_tolerance: >-
        E=abs(K_Q*H-n_Q); accept iff 2^20*E<=K_Q*n_Q or
        E^2<=25*(K_Q-1)*n_Q. Exhaust all F_Q*K_Q inputs first.
    planted_gamma:
