idea:
  id: IDEA-20260808-b16d04
  title: Reachable-tail signed-partition propagation with occupancy-calibrated duplicates and quotient-balanced nulls
  record_version: 4
  class: composition
  mechanism_class: probabilistic-propagation
  novelty_status: unverified
  replaces: IDEA-20260808-4bd694
  predecessor_sha256: 4ceb6c46ee23778311bcaa76bd799cb13798e55042555548d63bc3351d427f64
  governing_records:
    goal: GOAL-ECDLP-001
    batch: BATCH-669353
    task: TASK-20260808-1de1d7
    evidence: EV-ECDLP-6aecb8
    decision: DEC-20260808-e2e187
    review: TASK-20260808-203b3e
  claim: >-
    Conditionally on H1-H5, a fixed public target-independent signed-y
    antisymmetric partition with rooted distinct full-point hit exponent
    gamma_B permits an exact output-sensitive candidate search with expected
    raw time N^(2/3-gamma_B+o(1)), memory N^(1/3+o(1)), and full cost
    T*S^(1/3)=N^(7/9-gamma_B+o(1)). Raw rho/vOW crossover requires
    gamma_B>1/6 and full-cost crossover requires gamma_B>5/18. No gamma,
    attack, experiment, evidence, theorem, or security impact is claimed.
  mechanism: >-
    A public signed-y label map and independent public roots construct two
    length-L pair-sum lists. Entries retain full canonical points, final scalar
    witnesses, and witness identities. A full-point join probes exact
    complements under Q, streams every witness-bucket product, derives k, and
    accepts only after [k]P=Q. The proposed cause is enrichment of distinct
    verifying keys, not alias multiplication. N0 destroys placement with an
    attainable quotient-remainder signed histogram; N1 applies a signed-domain
    bijection and preserves the original histogram. Ordinary with-replacement
    duplicates are occupancy-calibrated, never zero-tolerance failures.
  object_studied: >-
    Full-point keyed multisets of signed-partition pair-sum witnesses. Signed
    labels are genuinely lossy; exact points/scalars are retained only for
    measurement and verification.

