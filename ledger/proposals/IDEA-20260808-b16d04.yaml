  notation_and_arithmetic:
    group: "G=<P> of odd prime order N; Q=[k]P; scalars canonical in [0,N)"
    b: "bitlen(N)"
    L: "ceil(cuberoot(N)) by exact integers; require (L-1)^3<N<=L^3"
    M: "arbitrary positive color modulus; frozen schedule uses M=L"
    labels: "ell=s*M+c in [0,2M), ZERO=2M, total K_label=2M+1"
    negation: "bar(s*M+c)=(1-s)*M+c; bar(ZERO)=ZERO"
    D: "BigNat(|A|)*BigNat(|B|), equal to L^2 for equal lists"
    outcomes:
      Y: "emitted matching witness tuples"
      X: "distinct emitted keys with a scalar verifying [k]P=Q"
      I: "1[X>=1]"
      mmax: "largest verifying-key tuple multiplicity; zero iff X=0"
    bigint_rule: >-
      N,M,L,D, all products, counters, quotient numerators, and resource totals
      use arbitrary-precision nonnegative integers. checked_u128 is prohibited.
    p256_check: >-
      If 2^255<N<2^256 then 2^85<L<2^86+1 and 2^170<D<2^172, so P-256-scale
      D exceeds 128 bits.
    integer_frame: >-
      U32BE(byte length) plus unsigned minimal big-endian magnitude; zero is
      length one plus 0x00. Reject leading zeroes and zero length. Explicit
      safe domain: byte length <=2^32-1.
    denominator_separation:
      pair_exposure: "D=L_A*L_B; arithmetic only, never a work/allocation loop"
      observed_rate: "sum X/sum D with exact BigNat sums"
      quotient_trials: "n_Q=2^20, never denoted D or N"

  scalar_stream_and_duplicates:
    construction: ordinary_uniform_with_replacement
    sampler:
      domain: IDEA-20260808-b16d04/scalar-stream/v1
      frame: >-
        domain,0x00,U32BE(nB),N fixed-width,curve digest,U8 arm,U8 model,
        U64 root,U8 side,U64 entry,U8 attempt; nB=ceil(bitlen(N)/8).
      rule: >-
        SHAKE256 returns nB bytes; mask unused high bits; accept z<N. Separate
        entry frames give exact uniform Z_N random-oracle draws. Values may
        repeat; no duplicate is resampled.
      cap: 64
      cap_miss: "charge 64 blocks, invalidate infrastructure, stop arm/size; never H4/negative evidence"
    semantics:
      witness_identity: "root/side/entry; always distinct"
      scalar_duplicate: "distinct identities with equal final scalars"
      point_duplicate: "equal canonical full points after byte and group checks"
      prime_order_equivalence: >-
        sigma_i=sigma_j iff [sigma_i]P=[sigma_j]P. Scalar/point equality counts
        must agree exactly; mismatch/off-curve/noncanonical is invalid. The
        existence of a duplicate is not invalid.
      zero: "ordinary scalar; infinity key 0x00; label ZERO; no resample/pseudocount"
    occupancy:
      no_duplicate_probability: "(N)_L/N^L"
      duplicate_probability: "1-(N)_L/N^L"
      pair_mean_per_side: "binom(L,2)/N"
      duplicate_excess_mean_per_side: "L-N*(1-(1-1/N)^L)"
      cross_pair_mean: "L^2/N"
      counters: "C_A=sum binom(a_v,2); C_B likewise; C_AB=sum a_v*b_v; C_dup=sum"
      exact_moments: >-
        T_L=2L^2-L, E[C_dup]=T_L/N,
        Var(C_dup)=T_L*(1/N)*(1-1/N). Equality indicators are pairwise
        uncorrelated; no normal-distribution claim is made.
      finite_gate: >-
        Across R_b null roots let C=sum C_dup, A=abs(N*C-R_b*T_L),
        B_occ=R_b*T_L*(N-1). PASS A^2<=25B_occ at b=21,24,27; FAIL
        A^2>=64B_occ; strict gap INCONCLUSIVE. All are BigNat comparisons.

  join:
    point_key: >-
      Canonical SEC1-style full point: infinity 0x00; otherwise parity prefix
      and fixed-width x. Hash equality is followed by byte/group equality;
      x-only equality is forbidden.
    algorithm:
      - "Build A/B once per curve/model/root and retain point, scalar, identity, sampler count, arm, side."
      - "Stable-group equal full points while retaining every witness and duplicate counter."
      - "Hash fewer distinct keys, ties A; probe every exact complement under Q."
      - "Stream complete bucket products and verify every derived scalar by [k]P=Q."
    hash:
      load_factor: "7/10"
      attempts: 2
      domains: [IDEA-20260808-b16d04/join/hash/attempt-0/v1, IDEA-20260808-b16d04/join/hash/attempt-1/v1]
      probe_limit: "ceil(8*log2(max(L,2)))"
      fallback: "stable sort-merge, <=2L*ceil(log2 L)+2L-1 comparisons; byte-identical output"
    heavy_output:
      cap: "C_emit=ceil(64*L*log2(max(L,2)))"
      trigger: "stop before tuple C_emit+1"
      status: invalid_heavy_output
      replay: >-
        Preserve raw lists/counters/prefix/buckets; stop new roots in that
        arm/size; independent stable sort-merge computes BigNat bucket products
        and enumerates/verifies at most L^2 tuples.
      interpretation: >-
        Confirmed Y>C_emit is H4=FAIL but excluded from Boolean inference.
        Y<=C_emit or counter disagreement is implementation-invalid. Replay
        resource failure is infrastructure. Never impute I=0 or drop a root.
    counter_vector: >-
      24L list group-equivalents; sampler blocks; model-map calls and field-op
      vector; N0/N1 walks/rounds/flips; comparisons; hash allocation/evaluation/
      retry/probe; emissions; fixed-base verifications; fallback/replay; bytes
      processed/retained/communicated; wall; RSS. O(1) maps are never free.

  heuristic_assumptions:
    H1:
      name: regular_output_sensitive_work
      statement: "O(L polylog L+Y) non-group work, 24L list group-equivalents, N^(1/3+o(1)) main peak; every named path charged."
      rigorous_support: "Frozen join/caps and complete counter envelope."
      validation_plan: "Exact KAT counters plus largest-cell work/wall/byte/RSS calibration."
      falsification: "Any uncharged path, mismatch, superlinear non-output work, cap miss, or unbudgeted replay."
    H2:
      name: distinct_hit_enrichment
      statement: "E[X]/E[D]=N^(-1+gamma_X+o(1)); E[X]=N^(-1/3+gamma_X+o(1))."
      rigorous_support: "Uniform full-point exposure D/N gives gamma_X=0."
      validation_plan: "BigNat exposure, exact-zero count fit, N0/N1, quotient, planted ladder."
      falsification: "Null/planted miss, nonpositive structured-minus-N1, or crossover bound failure on finite scope."
    H3:
      name: bounded_second_factorial_moment
      statement: "E[X(X-1)]<=kappa*E[X]^2 for finite N-independent kappa."
      rigorous_support: "P(X>0) lies between mu/(1+kappa*mu) and mu by Paley-Zygmund/Markov."
      validation_plan: "kappa0=8, positive-mu bounds, 20,000 curve max-t resamples, heavy handling."
      falsification: "L_kappa>8 or confirmed heavy output; nonpositive/nonfinite mu is inconclusive."
    H4:
      name: subpolynomial_multiplicity
      statement: "Y/max(X,1),mmax,C_dup,duplicate excess,and max bucket are N^o(1)."
      rigorous_support: "Exact null occupancy moments; structured transfer is heuristic."
      validation_plan: "Log-growth slopes, reachable raw tails, occupancy gate, N^(1/12) trap."
      falsification: "L_delta>=1/16, L_q>0.05, null 8-sigma failure, failed trap, or confirmed heavy."
    H5:
      name: root_stream_independence_with_model_nesting
      statement: "Distinct framed streams are random-oracle independent conditional on curve/model/arm; models share curve."
      rigorous_support: "Injective framing separates oracle inputs but not isomorphic curves."
      validation_plan: "Frame/seed KAT, correlations, curve-outer model-nested inference."
      falsification: "Frame collision, reuse, or treating model/root as outer curve."

  estimators_and_gates:
    estimand: >-
      At each b draw 192 independent curves and one target/curve. Weight four
      models equally then 32L roots/model equally. Curve is outer unit; no
      statistical object is reused across arms or clusters.
    H3:
      mu_c: "mean over four model/root X values"
      f2_c: "mean over four model/root X(X-1) values"
      point: "mu_hat=mean mu_c; f2_hat=mean f2_c; kappa=f2_hat/mu_hat^2"
      influence: >-
        IF_mu=mu_c-mu; IF_kappa=(f2_c-f2)/mu^2-2*f2*(mu_c-mu)/mu^3;
        se=sqrt(sum IF^2/(192*191)).
      pass: "all U_kappa<=8, all L_mu>0, no invalid/heavy"
      fail: "any L_kappa>8 or confirmed heavy"
    H4_slope:
      raw_metrics: ["Y/max(X,1)", mmax, C_dup, E_key, B_key]
      definitions: "E_key=(L-|keys_A|)+(L-|keys_B|); B_key=max A/B bucket"
      fit: >-
        Transform log2(1+raw). Unweighted OLS on 192 curve summaries per each
        b in [9,12,15,18,21,24,27], columns 1,b-18,2^(-b/3)-2^(-6).
        Delta is b coefficient. Use MPFR binary256 design values.
      se: "HC1 curve-outer sandwich with 1344 rows and 3 design columns."
    bootstrap:
      replicates: 20000
      domains: [IDEA-20260808-b16d04/H3/cluster-max-t/v1, IDEA-20260808-b16d04/H4/cluster-max-t/v1]
      sampling: >-
        Within each size resample 192 whole curves by rejecting bytes >=192;
        64-attempt cap. H3 uses top three sizes; H4 all seven.
      families: ["K=(three kappas)", "MU=(three mus)", "DELTA=(five slopes)"]
      max_t: >-
        tplus=max_j max(0,(theta_star-theta)/se_star),
        tminus=max_j max(0,(theta-theta_star)/se_star). Select sorted
        one-based order ceil(.99*20001)=19801; L=theta-cplus*se,
        U=theta+cminus*se.
      invalid: >-
        Nonpositive mu, nonfinite/failed fit, or unexplained zero se is
        INCONCLUSIVE. Exactly constant coordinates repeated by every resample
        use singleton intervals. No pseudocount.

  H4_reachable_tail:
    table:
      - {b: 21, L: 128, C_emit: 57344, L_squared: 16384, T_out: 240, T_bucket: 12}
      - {b: 24, L: 256, C_emit: 131072, L_squared: 65536, T_out: 363, T_bucket: 16}
      - {b: 27, L: 512, C_emit: 294912, L_squared: 262144, T_out: 544, T_bucket: 23}
    definitions: "T_out=ceil(sqrt(C_emit)); T_bucket=ceil(sqrt(L)); exact integer roots"
    bad_root: "Y>=T_out*max(X,1) or mmax>=T_out or C_dup>=T_out or E_key>=T_bucket or B_key>=T_bucket"
    zero_invalid: >-
      X=0 requires Y=mmax=0. X>0 requires 1<=X<=Y<=min(C_emit,L^2) and
      1<=mmax<=Y. Violations invalid. Duplicate counters may be zero.
    reachability: >-
      X=Y=mmax=1 with distinct buckets PASSes. T_out<=L^2<=C_emit permits
      matching bucket products reaching output FAIL. A bucket with
      binom(r,2)>=T_out exists with r<=L; size T_bucket+1 reaches duplicate
      excess/load. Nonmatching complement keeps duplicate-only Y=0.
    bad_curve: "any bad model/root; invalid/heavy separately blocks PASS"
    Clopper_Pearson: >-
      n=192, alpha_b=.01/3, MPFR binary256. k=0 gives U=.029270278773621.
      First L>.05 is k=20 with .053187753299561; k=192 gives .970729721226379.
    pass: "all U_delta<=1/24, U_q<=.05, null occupancy PASS, trap PASS, no invalid/heavy"
    fail: "any L_delta>=1/16, L_q>.05, null 8-sigma FAIL, failed trap, confirmed heavy"
    inconclusive: "all strict gaps, nonfinite/missing bounds, cap/fit/implementation failure"
    limitation: "Finite PASS is consistency, not asymptotic proof."

  deterministic_null_maps:
    orbit_domain:
      coordinates: "H=(N-1)/2; i=min(x,N-x)-1; eps distinguishes +/- representative; zero fixed"
      seed_frame: >-
        domain,0x00,U32 nB,N,U32 mB,M,curve digest,U8 model,U8 control,
        U32 replicate; roots/targets absent.
      Feistel: >-
        d=max(1,ceil(log2 H)), W=2ceil(d/2), h=W/2. Ten balanced rounds,
        f_j=low h bits SHAKE(frame,"round",U8 j,right). Reject nonzero high bits.
      restriction: "first forward/inverse Feistel iterate in [0,H); mathematical max 2^W"
      cap: "64 evaluations; miss charges 640 round hashes and invalidates without reseed/fallback"
      flip: "low bit SHAKE(frame,'flip',fixed-width i); one hash per lookup"
      bijection: "g(i,eps)=(pi(i),eps xor flip(i)); inverse exact; fixes zero; commutes with negation"
    N0:
      domain: IDEA-20260808-b16d04/N0/balanced-signed-orbits/v1
      map: "H=qM+r; t=pi(i); c=t mod M; s=eps xor flip(i); lambda=sM+c; zero=ZERO"
      balance: >-
        Each sign of c<r occurs q+1; each sign of c>=r occurs q. Counts differ
        by <=1 and sign balance is exact. Equality only if r=0. For M>H, q=0
        and empty labels are expected.
      inverse_boundary: "g is bijective/invertible; lambda_N0 is intentionally many-to-one"
    N1:
      domain: IDEA-20260808-b16d04/N1/histogram-preserving-signed-bijection/v1
      map: "lambda_N1(x)=lambda_structured(f_1(x))"
      properties: "f_1 bijective and negation-commuting; complete histogram including ZERO byte-identical"
    KATs:
      shake256_empty_32_hex: 46b9dd2b0ba88d13233b3feb743eeb243fcd52ea62b81b82b50c27646ed5762f
      injected: "W=4,H=5,f_j=1 -> outputs [0,4,2,3,1], walks [2,1,2,2,1], inverse identity"
      domains: [[3,1], [3,2], [5,3], [11,2], [17,7], [103,5], [103,64], [257,7]]
      N103_M5: "H=51=10*5+1; histogram [11,10,10,10,10,11,10,10,10,10]; ZERO once"
      requirements: "exhaust scalar/orbits; bijection/inverse/antisymmetry/histogram/range/frame/domain/counter checks"
      counter_identity: "round_hashes=10*sum(forward+inverse walks), flips=2H, labels=2H+1, cap<=1280H; N=103 cap=65280"

  controls_before_belief:
