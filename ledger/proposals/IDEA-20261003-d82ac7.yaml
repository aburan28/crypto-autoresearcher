# IDEA-20261003-d82ac7
# Automorphism-order count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-d82ac7
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The automorphism order 6 exceeds the generic order 2 by 4
  class: measurement
  claim: >-
    The frozen automorphism order for j=0 is 6. The frozen
    automorphism order for a generic curve is 2. Six exceeds two
    by 4. The product of the two orders is 12. Their sum is 8.
    Six divided by two is 3. The gap is a group order, not an
    ECDLP exponent.
  mechanism: >-
    The two orders are the objects. No point orbit is enumerated
    and no point count is taken. Two generic orders are both 2,
    so that gap is 0. This is not an orbit-size list and not a
    point-count ratio.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether special j-invariants confer an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different reading
        of these two orders.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two orders are frozen before the subtraction.
    - No orbit is enumerated.
  proof_search_map:
    bottleneck: The order gap 4.
    baseline_embedding:
      parameter_slice: The orders 6 and 2.
      reproduction_check: >-
        Two readers subtract and must agree that 6 exceeds 2 by 4.
    observation_collision:
      observable: The order gap and the quotient 3.
      distinct_preimage_search: >-
        Reporting both orders as 2 drops the gap. Two generic
        orders make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The orders 6 and 2.
        predicted_gain: Integer gap. No orbit enumeration.
    quantifier_order: >-
      The orders are fixed before the gap.
    method_ceiling:
      strongest_certifiable_claim: >-
        The order gap 4. Not a point-count ratio.
      nearby_object_control: >-
        Two generic orders. Both are 2, and the gap is 0.
    proof_obligations:
      - claim: The frozen order for j=0 is 6.
        responsibility: size
      - claim: The frozen generic order is 2.
        responsibility: size
      - claim: Six divided by two is 3.
        responsibility: correctness
    not_applicable_reason: null
  predictions:
    - metric: order_gap
      direction: different
      minimum_effect: Six exceeds two by 4.
  minimal_test:
    design: >-
      Subtract the two frozen orders and divide 6 by 2. Do not
      enumerate an orbit.
    controls:
      - Two generic orders, whose gap is 0.
      - An independent count.
    required_metrics:
      - both orders
      - the gap
      - the quotient
  falsification_conditions:
    - The gap is not 4.
    - Six divided by two is not 3.
  confounders:
    - An orbit of points can be smaller than the automorphism group.
  interpretation_limits:
    - A group order is not a walk length.
    - No transfer to a cryptographic curve.
    - This is not an orbit-size count and not a point-count ratio.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen automorphism order for j=0 is 6 and the frozen
        generic order is 2.
      rigorous_support: >-
        No automorphism theorem is re-proved here. The count is a
        reading of two orders.
      validation_plan: >-
        Two independent readings. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Not a memory bound.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: The square root of an order is a different quantity.
    tradeoff_note: A larger automorphism order is not by itself a shorter walk.
  estimated_cost:
