idea:
  id: IDEA-20260808-621df3
  question_id: RQ-ECDLP-002
  added: '2026-08-08'
  title: >-
    Density-aware reanalysis of conductor-level endomorphism conservation:
    separate the finite-norm cutoff artifact from a genuine isogeny-volcano
    obstruction
  class: experiment
  claim: >-
    The G3 excursions above four in the prior volcano audit are caused by the
    declared B=10^6 norm cutoff entering the sparse regime |D_f|/4 > B, where
    rho_f(B) is exactly 2 floor(sqrt(B)); they are not a falsification of the
    h_f rho_f conservation prediction in its density-valid regime.
  mechanism: >-
    Recompute every prior treatment cell from its committed (p,t) summaries,
    import only the frozen arithmetic implementation, and classify each level
    by the exact first-nonzero-row threshold 4B >= |D_f|. In sparse cells the
    measured rho must equal 2 floor(sqrt(B)) and product excursions must equal
    the class-number excursion. A matched lower-B nearby control must reproduce
    the same sparse-row identity without attaching a class-number claim.
  novelty_status: successor_reanalysis
  novelty_screen:
    method: repository exact-identifier search
    results: >-
      EXP-ECDLP-03a8c9's execution report names the density violation but did
      not archive a standalone cell-level reanalysis or a pre-registered sparse
      control. This proposal tests that unresolved confound rather than
      repeating the original curve generation.
    verdict: unverified_until_execution
  assumptions:
    - The prior run's committed (p,t) summaries and source implementation are
      treated as immutable input bytes, not as a new measurement.
    - The principal-form rho implementation is the object being audited; no
      claim is made about curves outside the prior 60-cell corpus.
    - Sparse-row equality is a deterministic arithmetic identity, while the
      conservation comparison remains toy and density-gated.
  predictions:
    - metric: sparse_level_rho_identity_rate
      direction: equal
      minimum_effect: 1.0 on every level with 4B < |D_f|
    - metric: g3_exceedance_explained_rate
      direction: equal
      minimum_effect: 1.0 of prior G3>4 cells have all levels sparse
    - metric: density_valid_normalized_deviation
      direction: lower
      minimum_effect: '< 0.01 on density-valid levels inherited from the prior G1 gate'
  minimal_test:
    design: >-
      Hash the four prior source artifacts, re-run process_curve on all 60
      committed (p,t) summaries, check sparse-row equality and G3 reproduction,
      then run the lower-B sparse control on the same level shapes. Stop on any
      hash, row, or arithmetic mismatch.
    controls:
      - prior source SHA-256 bindings
      - exact sparse-row rho identity
      - reproduced prior G3 values
      - lower-B nearby sparse control with no class-number interpretation
    required_metrics:
      - sparse level count and exact identity pass rate
      - prior G3 exceedance count and sparse explanation rate
      - density-valid normalized deviation distribution
      - control pass count and invalidation count
  falsification_conditions:
    - Any frozen source hash or cell binding mismatch is invalid infrastructure.
    - Any sparse level with rho_f(B) != 2 floor(sqrt(B)) falsifies the claimed
      finite-cutoff explanation at that level.
    - Any prior G3>4 curve with a density-valid level falsifies the proposed
      explanation within the tested corpus.
    - A density-valid normalized deviation >= 0.01 is recorded as a scoped
      conservation discrepancy, not silently attributed to sparsity.
  confounders:
    - The audit is a reanalysis of a prior run whose original approval trail was
      incomplete; this successor does not retroactively authorize that run.
    - No wall-clock, memory, isogeny-walk, or crypto-scale cost is measured.
  dominated_by: >-
    Pollard rho on prime-field ECDLP; this is a diagnostic of an endomorphism
    counting premise and adds zero attack-time or memory improvement.
  sota_delta:
    generic_time_exponent: 0.0
    memory_exponent: 0.0
    data_query_improvement: 0
    cryptographic_security_bits_reduced: 0
  proof_search_map:
    bottleneck: >-
      Determine whether the claimed conservation-law failure is a finite-norm
      cutoff artifact before spending compute on an isogeny-volcano mechanism.
    baseline_embedding:
      parameter_slice: >-
        All 60 prior ordinary prime-field (p,t) summaries and B=10^6.
      reproduction_check: >-
        Recompute the prior G3 values and all source hashes before interpreting
        any density classification.
    observation_collision:
      observable: >-
        G3 excursion and rho_f(B) at each conductor level.
      distinct_preimage_search: >-
        Compare density-valid and density-sparse levels, plus the lower-B sparse
        nearby control, so the same G3 label cannot be read as one mechanism.
    quantifier_order: >-
      For every prior curve and every divisor f of c, first establish source
      identity and exact level arithmetic, then classify density, then compare
      rho and product metrics; aggregate only after cell validity.
    method_ceiling:
      strongest_certifiable_claim: >-
        A finite-corpus explanation or falsification of the prior G3 excursion
        under the declared norm cutoff. It cannot close the isogeny lane or
        establish an ECDLP cost result.
      nearby_object_control: >-
        Lower-B sparse control with identical level shapes; it must reproduce
        the row identity while remaining explicitly outside the class-number
        product claim.
  status: proposed
