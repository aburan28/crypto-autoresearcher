idea:
  id: IDEA-20260807-e9d57c
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    THE ONE BRIDGE THAT IS NOT CONSTANT, EXHIBITED AND PRICED TO ZERO: on a
    curve whose target subgroup is cyclic of order ell^e the kernel-ideal
    bridge DOES vary with k -- it returns an ideal of norm ell^{e - v} where
    v = v_ell(k) -- so the class group really does learn something about the
    discrete logarithm; the leaked quantity is exactly v_ell(k), which
    Pohlig-Hellman already yields free in O(e) group operations, so the bridge
    is real, computable, non-constant and worth precisely nothing, and it
    serves as the batch's natural (non-synthetic) positive control
  class: measurement

  claim: >-
    (A) WHY THIS RECORD EXISTS. A closure whose obstruction is "the bridge is
    constant" (IDEA-20260807-5d7606, OBS-1) is only as good as its
    demonstration that the bridge CAN be non-constant. Otherwise the argument
    might be proving something vacuous -- "curves are not points" -- rather
    than something about primality. This record supplies the nearby object on
    which the obstruction fails, computes exactly what it leaks, and prices
    that leak against the incumbent. It is the batch's non-synthetic positive
    control, and it is also a small self-contained result.

    (B) THE CONSTRUCTION. Let E/F_p be ordinary with End_{F_p}(E) = O, and let
    G = <P> be CYCLIC of order N = ell^e for a small prime ell, with
    Q = [k]P. Then
        <Q> = <[k]P> has order ell^{e - v},  where v = min(v_ell(k), e),
    so the subgroup generated by the target now DEPENDS on k -- through v and
    only through v. The Deuring kernel-ideal correspondence assigns to it an
    ideal a_v of norm ell^{e-v}, and the quotient curve
        E_v := E/<Q> = [a_v]^{-1} * E
    is a curve in the isogeny class whose class-group coordinate is
    [a_v]^{-1}. So the composite point-to-curve-to-class-group bridge
        beta : Q |-> [a_{<Q>}] in Cl(O)
    takes e + 1 distinct values as k ranges over Z/ell^e, one for each
    v in {0, 1, ..., e}. THE BRIDGE IS NON-CONSTANT. OBS-1 fails here exactly
    as predicted, and the reason is visible: the subgroup lattice of a cyclic
    ell^e group is a CHAIN with e + 1 elements, whereas for prime order it has
    two, only one of which is nonzero.

    (C) THE EXACT LEAK, AND ITS EXACT PRICE. Applying a vectorization oracle
    to (E, E_v) returns [a_v], whose norm reveals ell^{e - v} and hence v =
    v_ell(k). That is log2(e + 1) bits, and it is ALL the bridge carries: the
    fibres of beta are the sets {k : v_ell(k) = v}, of sizes
    (ell - 1) ell^{e - v - 1}, so beta is exactly the v_ell projection and
    nothing more.
    THE PRICE OF THE SAME INFORMATION BY THE INCUMBENT: compute
    [ell^j] Q for j = 0, 1, ..., e and take the first j with [ell^j] Q = O.
    That is at most e scalar multiplications by ell, i.e. O(e log ell) group
    operations -- and it is a strict subroutine of Pohlig-Hellman, which on a
    group of order ell^e solves the ENTIRE discrete logarithm in
    O(e sqrt(ell)) group operations. So the bridge delivers, at the cost of a
    vectorization (~sqrt(h) = p^{1/4} action evaluations), a quantity
    obtainable in O(e log ell) point operations by a first-year textbook
    method, on a group where the whole problem is already easy.
    NET: SPEEDUP FACTOR = 0. The bridge is real, computable, non-constant, and
    Pareto-dominated on every axis by an entirely elementary computation.

    (D) THE STRUCTURAL LESSON, WHICH IS THE TRANSFERABLE PART. The
    point-to-curve bridge's information content is exactly
        log2 (number of distinct subgroups generated by elements of G)
      = log2 (number of divisors of N),
    because the bridge factors through <Q> and nothing else. For N prime that
    is log2 2 = 1 bit (zero or not), which is why OBS-1 bites. For N = ell^e it
    is log2(e + 1). For general N it is log2 d(N), the divisor count. And
    d(N) <= N^{o(1)} for every N, so:
        THE CANONICAL POINT-TO-CURVE BRIDGE CARRIES AT MOST o(log N) BITS
        ABOUT k, FOR EVERY GROUP ORDER N WHATSOEVER,
    and the bits it does carry are exactly the Pohlig-Hellman valuations,
    which are free. This is strictly stronger than OBS-1: it closes the
    canonical bridge not only for prime N but for ALL N, with a quantitative
    bound (divisor function) instead of a case analysis. Cryptographic curves
    have N prime or nearly so, so d(N) is 2 or a small constant, and the bound
    is not merely asymptotic there -- it is 1 bit.

    (E) THE DISCRIMINATION. Three outcomes, all informative:
      OUTCOME 1 (predicted). Measured bridge information equals log2(e + 1)
      exactly, measured leak equals v_ell(k) exactly, and the measured
      vectorization cost to obtain it exceeds the Pohlig-Hellman subroutine
      cost by orders of magnitude. The control is calibrated, OBS-1 is shown
      non-vacuous, and (D) is confirmed.
      OUTCOME 2. Measured bridge information EXCEEDS log2(e + 1). Then beta
      does not factor through <Q> as claimed, the correspondence is being
      mis-implemented or the theory is wrong; either way it is a significant
      event and halts the line for review.
      OUTCOME 3. The bridge measures as CONSTANT even at e >= 2. The
      instrument cannot see a bridge, and every constancy verdict elsewhere in
      the batch is void.

  resource_label: >-
    R3 (End(E) as a ring: the kernel-ideal correspondence, ideal norms,
    Cl(O)) and R4 (the class-group action, used to identify E/<Q> by its
    class-group coordinate).
  admissibility: admissible
  admissibility_argument: >-
    Admissible in form: the resource is the ideal structure of O, which is
    invisible to a generic group oracle, and the mechanism never applies an
    endomorphism to a point of G. But the honest verdict has a second layer,
    and the record states it rather than hiding it: the INFORMATION the
    resource yields (v_ell(k)) is itself generic-group computable in O(e)
    operations, so although the resource escapes the GGM, its OUTPUT does not.
    That is a distinction worth recording once and precisely -- escaping the
    generic group is necessary for a lane and is not sufficient, and this is
    the cleanest concrete instance of the gap in the campaign so far.

  discriminated_from:
    - >-
      IDEA-20260807-5d7606, which proves the bridge CONSTANT for N prime. This
      record is its nearby-object control and its complement: same bridge,
      composite order, non-constant, and priced. Neither is a duplicate of the
      other and each is weaker without the other.
    - >-
      IDEA-20260807-cb672c, whose positive control is SYNTHETIC (a planted
      bridge of tunable width, built by the experimenter). This record's
      positive control is NATURAL -- it arises from genuine curve arithmetic
      with nothing planted -- which is a strictly stronger validation of any
      detector, because a synthetic control can accidentally be detectable for
      reasons the real object would not share.
    - >-
      Pohlig-Hellman itself, which is the baseline this record prices against
      rather than something it competes with. The record makes no claim to
      improve, extend or reinterpret Pohlig-Hellman.
    - >-
      Lane L13 (multi-target, RQ-MTGT-2cabee) and lane L2 (volcano level,
      RQ-VOLC-f6253b). This record uses one curve and one level; it does not
      stratify by level and does not amortise across targets.

  object_first_candidate:
    tracked_object: >-
      THE SUBGROUP LATTICE POSITION OF <Q>, i.e. the integer v = v_ell(k) for
      N = ell^e, and in general the divisor of N equal to the order of <Q>.
      Followed as k varies. It is the same tracked object as
      IDEA-20260807-5d7606 (the kernel ideal of <Q>), examined at the
      parameter value where it comes alive.
    lossiness: >-
      LOSSY, and the amount is exactly computable: it retains log2 d(N) bits
      and discards log2(N / d(N)) bits. For N = ell^e it retains
      log2(e + 1) and discards essentially everything else. The discarding is
      compatible with the target's operations because the subgroup generated
      by a sum is determined by the lattice join, which the retained
      coordinate tracks -- so the projection propagates deterministically under
      the group law in the only sense the bridge needs. It is decisively not a
      change of coordinates.
    propagation: >-
      One-step propagation is defined and cheaply measurable: multiply Q by a
      scalar m and observe v_ell(mk) = v_ell(m) + v_ell(k) capped at e. That
      is a clean, deterministic, testable propagation rule -- an ADDITIVE
      valuation law -- and its existence is what makes this object genuinely
      trackable rather than merely definable. Under transport by an isogeny of
      degree coprime to ell, v is unchanged (T1), so the object is also
      class-invariant in the curve direction.
    survival_score: >-
      Survives all k, all e, and every isogeny of degree coprime to ell.
      Degrades to a single bit as e -> 1 (prime order), which is the death
      condition and is exactly OBS-1. Dies entirely when ell divides the
      degree of the transporting isogeny, which is excluded by hypothesis.
      Knowing all three boundaries is what makes the survival score real.

  mechanism: >-
    STEP 1 (toy compute). Construct the instance family: ordinary curves over
    small p whose group order is divisible by ell^e for ell in {2, 3, 5} and
    e in {1, ..., 6}, with G taken to be the cyclic ell^e-subgroup. Verify
    cyclicity explicitly -- E(F_p) can have rank 2 at ell, and a
    non-cyclic G changes the subgroup lattice from a chain to a richer poset
    and would change every count below. Non-cyclic instances are recorded
    separately, not discarded, because they are their own interesting case.

    STEP 2 (toy compute). For each instance and for many k: compute <Q>, its
    order ell^{e-v}, the kernel ideal a_v, the quotient curve E_v, and the
    class-group coordinate of E_v relative to E by exhaustive walk (toy scale
    makes this exact). Tabulate beta's value against v.
    PREDICTED: beta takes exactly e + 1 values; beta(k) depends on k only
    through v; the fibre sizes are (ell - 1) ell^{e-v-1} for v < e and 1 for
    v = e.

    STEP 3 (toy compute). Measure the information: I(beta ; k) via the
    instrument of IDEA-20260807-cb672c, run unchanged. PREDICTED: exactly
    H(v) = -sum_v pr_v log2 pr_v with pr_v = (ell-1)/ell^{v+1} (and the
    residual mass at v = e), which for ell = 2 is close to 2 bits and is
    ALWAYS at most log2(e+1) and typically well below it. The record predicts
    the ENTROPY, not merely "nonzero", so the control is quantitative.

    STEP 4 (toy compute, THE PRICING). Measure, in the same unit, three costs
    on identical instances:
      (P1) obtain v by the Pohlig-Hellman subroutine: repeated multiplication
           by ell until the identity. Counted in point operations.
      (P2) obtain v via the bridge: compute E/<Q>, then vectorize (E, E/<Q>)
           by kangaroo on the Cayley graph. Counted in action evaluations,
           then converted to point-operation equivalents by the measured
           per-step price.
      (P3) solve the ENTIRE discrete logarithm by Pohlig-Hellman:
           O(e sqrt(ell)) point operations.
    PREDICTED: P1 << P3 << P2 by large margins, i.e. the bridge is more
    expensive than solving the whole problem outright. Stating the prediction
    as an ORDERING of three measured costs makes it falsifiable in a way a
    single ratio would not be.

    STEP 5 (toy compute, THE DECAY). Sweep e down to 1 and confirm the
    measured information decays to 0 bits and the number of distinct beta
    values decays to 1. This is the decay test that links this record to
    OBS-1: the same instrument, the same family, one parameter varied, and the
    signal must vanish exactly where the theory says it does.

    STEP 6 (zero compute). Generalise to arbitrary N and state the divisor
    bound of (D). Verify at toy scale on a handful of curves with N having
    several distinct prime factors, where the bridge's value count must equal
    d(N).

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "Pohlig|Pohlig-Hellman"; "kernel ideal|ideal-subgroup";
      "composite order|smooth order"; "divisor function|d\(N\)". Full reads:
      DECOMPOSITION.md, RQ-CLGP-b99df5, KN-TECH-027, KN-FIND-b7e091.
    results: >-
      Pohlig-Hellman appears in the corpus as standard background for group
      order structure and never in connection with the class group or the
      kernel-ideal correspondence. No record computes the information content
      of a point-to-curve map, and no record states the divisor-function bound
      of (D). The kernel-ideal hits are all supersingular/quaternion.
    verdict: >-
      ADAPTATION. The subgroup-chain structure of a cyclic ell^e group,
      Pohlig-Hellman, and the kernel-ideal correspondence are all elementary
      or textbook. New to this corpus: pointing the correspondence at a
      composite-order subgroup, computing that the bridge's information is
      exactly the divisor count, pricing the leak against Pohlig-Hellman, and
      using the result as a NATURAL positive control for the batch's
      detectors. The divisor bound in (D) may well be folklore; no external
      novelty is claimed and a citation would be welcome.

  null_object_control: >-
    MANDATORY AND BLOCKING, and here the roles invert -- this record IS the
    positive control, so its null is the PRIME-ORDER family. Matched null of
    the same shape: identical pipeline, identical instrument, identical sample
    size, on curves with G of PRIME order (which is precisely
    IDEA-20260807-5d7606's family). There the measured bridge information must
    be 0 bits at the instrument's floor and the distinct-value count must be
    exactly 1.
    DECAY PARAMETER: e. Sweeping e from 6 down to 1 must drive the measured
    information from H(v) down to 0 and the value count from e+1 down to 1,
    continuously and monotonically. A measured information that does NOT decay
    as e -> 1 is the canonical artifact tell: it would mean the pipeline is
    reading something other than the subgroup lattice, most likely a generator
    leak, and every number in the batch that used this instrument would be
    void.
    SECOND NULL: a non-cyclic G (rank 2 at ell). The subgroup lattice is no
    longer a chain, so the predicted value count changes from e+1 to the
    number of cyclic subgroups of a rank-2 ell-group -- a different, computable
    prediction. Getting THAT number right too is a strong check that the
    pipeline is genuinely reading the lattice.

  assumptions:
    - >-
      G is CYCLIC of order ell^e. Verified per instance; non-cyclic instances
      are analysed separately with their own predicted value count and are not
      silently mixed in.
    - >-
      ell does not divide the degree of any transporting isogeny used, so T1
      transport applies and v is preserved. Enforced by choosing walk primes
      different from ell.
    - >-
      E/<Q> is computed by Velu's formulas from the explicit subgroup, which
      is exact and cheap at toy scale for ell^{e-v} small. Where ell^{e-v}
      grows beyond a few thousand points the cost is recorded, since it is
      part of P2's honest price.
    - >-
      Vectorization at toy scale is done by exhaustive or kangaroo walk on the
      Cayley graph and is EXACT. The cost measured in P2 is therefore a real
      measured cost and not a model.
    - >-
      Pohlig-Hellman's cost O(e sqrt(ell)) for the full DL on a group of order
      ell^e is the classical baseline and is used as quoted; the toy runs
      measure it rather than assume it.

  proof_search_map:
    bottleneck: >-
      Step 2's claim that beta depends on k only through v. Everything else
      counts or measures. If beta depended on more than v -- e.g. on the
      particular generator -- the divisor bound in (D) would be wrong and the
      canonical bridge would carry more than it should.
    baseline_embedding:
      parameter_slice: >-
        e = 1, i.e. N = ell prime. The whole construction must then degenerate
        exactly to IDEA-20260807-5d7606's setting: one nonzero subgroup, one
        value of beta, zero bits. This is the precise old-method boundary and
        it must reproduce exactly, not approximately.
      reproduction_check: >-
        Frozen fixture: the same curve family run at e = 1 must give
        distinct-value count exactly 1 and measured information at the
        instrument's floor, matching the numbers IDEA-20260807-5d7606's Stage
        2 produces on its own family. Any discrepancy means the two records'
        pipelines disagree and neither's numbers are usable.
    observation_collision:
      observable: >-
        beta(Q) = [a_{<Q>}] in Cl(O).
      distinct_preimage_search: >-
        REQUIRED AND QUANTITATIVELY PREDICTED. The fibres are exactly
        {k : v_ell(k) = v}, with predicted sizes (ell-1) ell^{e-v-1}. The
        search is not "do collisions exist" (they obviously do) but "are the
        fibre SIZES exactly as predicted", which is a much sharper test and
        catches implementation errors that a mere existence check would not.
        A measured fibre-size histogram deviating from the prediction by more
        than sampling error falsifies the factor-through-<Q> claim.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Lift the hypothesis "N prime" to "N = ell^e" and then to general N,
          re-running the same observable at each stage.
        predicted_gain: >-
          Converts OBS-1 from a statement about prime order into the divisor
          bound log2 d(N) for ALL N -- a strictly stronger and quantitative
          closure of the canonical bridge, obtained by relaxing rather than
          strengthening the hypothesis. This is the record's main intellectual
          gain and it costs almost nothing.
      - transform: specialization_pack
        proposed_object: >-
          Decompose N = prod ell_i^{e_i} and observe that the bridge's
          information decomposes as sum_i log2(e_i + 1), matching
          Pohlig-Hellman's own decomposition of the problem.
        predicted_gain: >-
          Shows the bridge's information is exactly co-extensive with the
          information Pohlig-Hellman already exploits, which is the sharpest
          possible form of "worth nothing": not merely dominated, but
          delivering literally the same quantity.
    quantifier_order: >-
      ASSERTED: FORALL ordinary E with G cyclic of order N, FORALL k in Z/N,
      beta([k]P) = beta([k']P) IF AND ONLY IF gcd(k, N) = gcd(k', N).
      Consequently FORALL such (E, G), THERE EXIST exactly d(N) values of
      beta, and FORALL k the value determines gcd(k, N) and nothing more.
      Note the biconditional: it is what upgrades "the bridge is not very
      informative" into "the bridge's information is exactly log2 d(N)". A
      one-directional statement would leave open that beta collapses further,
      which would only strengthen the closure but would make the positive
      control useless.
      NOT CLAIMED: anything about non-canonical bridges; anything about N with
      non-cyclic G without recomputing d.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The canonical point-to-curve bridge carries exactly log2 d(N) bits
        about k, and those bits are exactly the Pohlig-Hellman valuations,
        obtainable in O(sum e_i log ell_i) group operations." It can NEVER
        certify anything about non-canonical bridges, about bridges using
        x(Q) as a field element, or about the ECDLP's hardness.
      nearby_object_control: >-
        THE PRIME-ORDER FAMILY, where the conclusion "the bridge is
        informative" FAILS and the information is 0. Running both families
        through one pipeline and getting the two predicted answers is what
        establishes that the pipeline reads the lattice rather than an
        artifact.
    proof_obligations:
      - claim: >-
          <[k]P> has order N/gcd(k, N), so beta factors through gcd(k, N).
        responsibility: correctness
      - claim: >-
          beta takes exactly d(N) values, with the stated fibre sizes.
        responsibility: correctness
      - claim: >-
          The norm of a_{<Q>} reveals gcd(k, N) and nothing more.
        responsibility: correctness
      - claim: >-
          v_ell(k) is obtainable in O(e log ell) group operations.
        responsibility: runtime
      - claim: >-
          Measured P2 (bridge route) exceeds measured P3 (full
          Pohlig-Hellman) on every tested instance.
        responsibility: baseline
      - claim: >-
          The e = 1 slice reproduces IDEA-20260807-5d7606's numbers exactly.
        responsibility: baseline
      - claim: >-
          The non-cyclic control's value count matches the cyclic-subgroup
          count of a rank-2 ell-group.
        responsibility: soundness

  predictions:
    - metric: >-
        number of distinct values of beta over sampled k, per instance, as a
        function of e
      direction: higher
      minimum_effect: >-
        Exactly e + 1 for cyclic G of order ell^e, on 100 percent of
        instances. Fewer means the instrument is blind; more means beta does
        not factor through <Q> and the theory is wrong. Both are decisive and
        neither is a soft outcome.
    - metric: >-
        measured I(beta ; k) in bits
      direction: different
      minimum_effect: >-
        Within 0.15 bits of the predicted entropy H(gcd(k,N)) computed from
        the exact fibre sizes. Predicting the entropy rather than merely
        "nonzero" is what makes this a calibration rather than a sanity check.
    - metric: >-
        cost ordering P1 < P3 < P2 (Pohlig-Hellman subroutine, full
        Pohlig-Hellman, bridge route), in point-operation equivalents
      direction: higher
      minimum_effect: >-
        P2/P3 at least 10 at every tested instance with h >= 100. A P2 below
        P3 would mean the bridge route beats solving the whole problem, which
        would be a genuine finding and is escalated rather than assumed away.
    - metric: >-
        measured information as e decreases to 1
      direction: lower
      minimum_effect: >-
        Monotone decrease to the instrument floor at e = 1. Non-monotonicity
        or a persistent floor-exceeding value at e = 1 is the artifact tell
        and voids the batch's use of this instrument.
    - metric: >-
        distinct value count for general N with several prime factors
      direction: different
      minimum_effect: >-
        Exactly d(N), the number of divisors. This is the (D) generalisation
        and it is a sharp integer prediction with no tolerance band.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): derive the fibre sizes and the divisor bound.
      STAGE 1 (minutes): build the ell^e instance family with cyclicity
      verified; build the prime-order null family and the non-cyclic control.
      STAGE 2 (minutes, HARD GATE): tabulate beta against v; check the
      distinct-value count and the fibre-size histogram against the exact
      predictions. This gate is the cheapest calibration in the batch.
      STAGE 3 (minutes): measure I(beta ; k) with the IDEA-20260807-cb672c
      instrument, unchanged, and compare against the predicted entropy.
      STAGE 4 (hours): the three-cost pricing P1, P2, P3, with the isogeny
      step price measured, not assumed.
      STAGE 5 (minutes): the e-sweep decay test down to e = 1, and the general
      -N divisor check.
    controls:
      - >-
        prime-order family -- the same pipeline MUST report 1 value and 0 bits
      - >-
        non-cyclic G at rank 2 -- value count must match the cyclic-subgroup
        count, a different and computable number
      - >-
        e = 1 slice reproducing IDEA-20260807-5d7606's numbers exactly
      - >-
        measured isogeny-step price before any cost conversion
      - >-
        Pohlig-Hellman baseline measured, not quoted
    required_metrics:
      - distinct value count of beta per instance, per e
      - fibre-size histogram against predicted (ell-1) ell^{e-v-1}
      - I(beta ; k) in bits against predicted entropy
      - P1, P2, P3 in point-operation equivalents, per instance
      - the e-decay curve of information and value count
      - d(N) versus measured value count on the general-N check
      - h and the measured isogeny-step price per instance

  falsification_conditions:
    - >-
      beta takes more than e + 1 values on a cyclic ell^e instance. It does
      not factor through <Q>; the divisor bound is wrong; halt and review,
      because this would ALSO weaken IDEA-20260807-5d7606's closure and would
      be the most consequential outcome in the lane.
    - >-
      The prime-order null shows more than one value. Instrument or theory
      failure; every constancy claim in the batch is void until resolved.
    - >-
      Measured information does not decay to the floor as e -> 1. Artifact
      tell; the instrument leaks and the batch's nulls are void.
    - >-
      P2 measures below P3, i.e. the bridge route is cheaper than
      Pohlig-Hellman. Escalate for independent review; the pricing conclusion
      is withdrawn until replicated with the isogeny-step price re-measured.
    - >-
      The general-N value count differs from d(N). The (D) generalisation is
      false as stated and must be restated for the cases that hold.

  confounders:
    - >-
      NON-CYCLIC ell-TORSION. E(F_p) can have rank 2 at ell, in which case G
      as chosen may not be cyclic and the subgroup lattice is not a chain.
      Cyclicity is verified per instance and non-cyclic instances go to the
      control arm with their own prediction.
    - >-
      VELU COST GROWTH. Computing E/<Q> costs O(ell^{e-v}) by Velu, so P2's
      price depends on v and is cheapest exactly where the information is
      least. Reporting a single averaged P2 would hide this; P2 is reported
      per v.
    - >-
      SMALL h. Vectorization on a tiny class is nearly free and would make P2
      look competitive for reasons that vanish at scale. Require h >= 100 and
      report h with every cost.
    - >-
      ell = 2 SPECIALS. At ell = 2 the 2-torsion structure interacts with the
      curve's 2-isogeny graph and with the twist, and 2-power subgroups behave
      differently from odd ones. Report ell = 2 separately and never pooled.
    - >-
      CONDUCTOR AND ell. If ell divides the conductor f of O, the ell-volcano
      has depth and the kernel ideal's behaviour changes (the correspondence
      requires ell coprime to the conductor for the crater statement). Choose
      ell coprime to f and verify per instance.

  interpretation_limits:
    - >-
      This is a CALIBRATION and a small structural result, not an attack. Its
      headline finding is that a real bridge exists and is worthless, and no
      sentence in the write-up may drop the second half.
    - >-
      Composite-order curves of this shape are NOT cryptographic parameters --
      a curve with a group of order ell^e for small ell is broken by
      Pohlig-Hellman before any of this starts. The record uses them precisely
      because they are the nearby object where the obstruction fails, and it
      claims nothing about deployed curves.
    - >-
      The divisor bound in (D) closes the CANONICAL bridge only. Bridges using
      x(Q) as a field element are untouched.
    - >-
      QUANTUM: irrelevant here in both directions. The leak is v_ell(k), which
      is classical and free; subexponential quantum vectorization
      (KN-TECH-027, KN-TECH-051) would only make an already-worthless route
      cheaper. The campaign is classical.
    - >-
      Toy scale for all measurements.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO HEURISTIC IS LOAD-BEARING. The fibre structure of beta, the fibre
        sizes, the divisor count and the Pohlig-Hellman cost are all
        elementary and exact. The predictions are integers and exact entropies,
        not distributions, which is why this record makes a good control.
      rigorous_support: >-
        Elementary group theory plus the kernel-ideal correspondence. Stated
        explicitly so that no reader imports conditionality.
      validation_plan: >-
        The exact-integer predictions ARE the validation: a pipeline that
        reproduces d(N) and the fibre-size histogram exactly is working, and
        one that does not is broken. No distributional comparison is needed.
    - id: H2
      statement: >-
        For uniformly random k in Z/ell^e, Pr[v_ell(k) = v] =
        (ell - 1)/ell^{v+1} for v < e and 1/ell^e for v = e, so the bridge's
        entropy is H = sum over v of that distribution's surprisal, bounded
        above by log2(e+1) and approaching ell/(ell-1) * log2(ell) / ... i.e.
        a small constant for fixed ell as e grows.
      rigorous_support: >-
        Exact, not heuristic: it is the geometric distribution of the ell-adic
        valuation of a uniform residue, which imitates nothing and requires no
        assumption. It is listed as H2 solely because the MEASURED entropy is
        compared against it and the comparison is the calibration.
      validation_plan: >-
        Compare the empirical histogram of v over 10^5 sampled k against the
        exact geometric prediction, with a chi-squared goodness-of-fit test;
        tail check on the largest observed v against the predicted
        Pr[v >= v_0] = ell^{-v_0}. LABELLED TOY SCALE for the curve arithmetic,
        though the distribution statement itself is exact at any scale.

  reachability_gate: >-
    T5 IS THE REASON THE PRICING COMES OUT THE WAY IT DOES, and this record is
    the batch's clearest demonstration of the gate's force. The bridge
    identifies a SPECIFIED curve E/<Q>, and recovering its class-group
    coordinate is exactly the expensive side of the T5 dichotomy: ~sqrt(h) =
    p^{1/4} action evaluations. Meanwhile the SAME information is available by
    a local test costing O(e) group operations -- the Pohlig-Hellman
    subroutine -- which is T5's "locally detectable" case in its purest form.
    So this record instantiates both sides of the dichotomy on one instance and
    shows the local route winning by orders of magnitude. Anything a future
    L10 proposal wants from a global address must beat this comparison, and the
    comparison is measured rather than argued.

  target_complexity:
    time_exponent: >-
      NO IMPROVEMENT, AND THE RECORD QUANTIFIES THE DEFICIT. The bridge route
      costs ~sqrt(h) = p^{1/4} action evaluations to obtain v_ell(k); the
      incumbent obtains the same v in O(e log ell) group operations, and
      solves the ENTIRE discrete logarithm in O(e sqrt(ell)) by
      Pohlig-Hellman. On these curves the ECDLP exponent is not p^{1/2} at all
      -- it is polylogarithmic in p for fixed ell -- so the bridge is
      superpolynomially worse than the incumbent, which is a far stronger
      statement than "no speedup".
    memory_exponent: >-
      Bridge route: O(1) with kangaroo vectorization, O(ell^{e-v}) transiently
      for the Velu quotient. Incumbent: O(1). No memory advantage anywhere.
    best_known: >-
      On a group of order ell^e, Pohlig-Hellman at O(e sqrt(ell)) group
      operations and O(sqrt(ell)) memory is the incumbent and is
      polylogarithmic in p for fixed ell. On prime-order groups the incumbent
      is 0.886 sqrt(N) parallel rho (KN-TECH-001, KN-TECH-006). Vectorization
      is ~sqrt(h) (KN-TECH-027).
    hidden_overhead: >-
      The bridge route's quoted p^{1/4} hides the per-action-evaluation cost
      AND the Velu quotient cost O(ell^{e-v}), the latter being largest
      exactly when the information gained is smallest (small v). Both are
      measured and reported per v rather than averaged, because an average
      would conceal the anti-correlation between cost and value.
    tradeoff_note: >-
      There is no useful tradeoff to report: the route is dominated on time,
      on memory and on implementation complexity simultaneously. Recording
      that all three axes lose is more informative than reporting an
      interpolation curve for a route that should never be run.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES, and the domination here is
    unusually total. On the composite-order curves this record uses, the
    bridge route is dominated by: Pohlig-Hellman for the FULL discrete
    logarithm at O(e sqrt(ell)) time and O(sqrt(ell)) memory -- which is
    polylogarithmic in p and therefore beats the bridge's p^{1/4} by a
    superpolynomial factor; by the O(e log ell) valuation subroutine for the
    SPECIFIC quantity the bridge returns; by parallel rho and BSGS on any
    prime-order factor (KN-TECH-001, KN-TECH-006); and by kangaroo on a known
    interval. It ties nothing and beats nothing. dominated_by is NOT null and
    the domination is by a superpolynomial factor rather than a constant.
  sota_delta: >-
    Negative, quantified: obtaining v_ell(k) costs O(e log ell) group
    operations by the incumbent and ~sqrt(h) = p^{1/4} action evaluations plus
    a Velu quotient by the bridge, a predicted ratio P2/P1 of many orders of
    magnitude and P2/P3 at least 10 even against solving the whole problem.
    The positive delta is structural and is worth stating on its own: the
    canonical point-to-curve bridge's information content is EXACTLY
    log2 d(N) bits for every N, and those bits are exactly the Pohlig-Hellman
    valuations -- which strengthens IDEA-20260807-5d7606's prime-order closure
    into a bound valid for all group orders, at essentially zero cost.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.93 that beta takes exactly e + 1 values with the predicted fibre sizes
    -- the derivation is elementary and the risk is implementation, chiefly
    cyclicity and the ell-versus-conductor condition. 0.9 that the measured
    entropy matches the prediction within 0.15 bits. 0.95 that the cost
    ordering P1 < P3 < P2 holds. 0.9 that the e-decay reaches the floor at
    e = 1. Priority MEDIUM: it is cheap, it is the batch's only NATURAL
    positive control, and it upgrades the lane's main closure from a
    prime-order statement to an all-N statement -- but it produces no attack
    and its instances are not cryptographic parameters.

