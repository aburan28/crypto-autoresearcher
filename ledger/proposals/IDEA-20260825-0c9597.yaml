  batch: EC-STRUCTURE-20260825
  cluster: 'C7-targets: what structure the real curves actually carry'
  title: 'TWO TORSORS THAT NEVER MEET: the isogeny class is a torsor under a class group whose DLP is
    SUBEXPONENTIAL, the point group is a torsor under Z/N whose DLP is not -- ask whether any natural
    map relates them, and record either the no-go with its mechanism or the first place one could exist'
  class: barrier
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: That class-group DLP is subexponential and point DLP is not is standard and recalled.
    The proposed contribution is posing the transfer question explicitly and requiring a mechanism-level
    answer, because the informal answer ('the action is on curves, not points') has never been written
    down here as an argument with a named escape.
  claim:
    semantic_part: The ordinary isogeny class is a torsor under Cl(O) and the point group of a fixed curve
      is a torsor under Z/N; the class-group discrete logarithm is subexponential while the point discrete
      logarithm is not known to be, so the question of whether any natural transformation relates the
      two torsors is a well-posed and unusually cheap one.
    evaluator_part: 'Unestablished: the no-go. The expected answer is negative and the value is the MECHANISM
      plus the named escape, not the verdict.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - State both torsors precisely, including base points, and state what a natural transformation between
    them would have to be.
  - 'Attempt the obvious construction: build an isogeny whose kernel is generated by a multiple of P.
    Observe the failure mode explicitly -- such a kernel has order dividing N, and the quotient by the
    full subgroup is the trivial map while a proper subgroup does not exist for prime N, so the construction
    degenerates rather than merely being hard.'
  - 'Generalize: any construction whose isogeny depends on a point of the prime-order subgroup faces the
    same degeneracy, because that subgroup has no proper nontrivial subgroups.'
  - 'Name the escape: a construction depending on a point of a DIFFERENT subgroup (torsion of order coprime
    to N), which is available and which routes back to the second-eigenspace subproblem rather than to
    a free transfer.'
  - Record as an obstruction block with a resource check.
  lossy_projection_test:
    tracked_object: the torsor structure of two group actions
    what_is_discarded: the objects acted on, keeping only the acting groups
    propagation: not applicable; this is a structural comparison
    verdict: N/A -- a structural no-go argument, not a tracked-object proposal.
  predictions:
  - id: P1
    status: established_formula
    statement: A prime-order group has no proper nontrivial subgroups, so any isogeny with kernel inside
      it is trivial or the full quotient.
  - id: P2
    status: unestablished
    statement: No natural transformation between the two torsors exists.
  - id: P3
    status: unestablished
    statement: Every construction attempting one degenerates for the reason in P1, rather than for a construction-specific
      reason.
  minimal_discriminating_test:
    status: specified_not_run
    test: Enumerate candidate constructions at toy scale and record the failure mode of each; check that
      the failure mode is the P1 degeneracy in every case.
    pass: All candidates fail by the same mechanism, supporting P3.
    fail: A candidate failing for a different reason indicates the argument is incomplete and names the
      gap.
  controls:
  - 'The composite-order case, where proper subgroups exist and the degeneracy should NOT occur: the positive
    control that the argument is about primality.'
  - The coprime-torsion case, where the construction is available, confirming the escape is real.
  confounders:
  - '''Natural transformation'' must be defined or the no-go is untestable; the record must fix a computation
    model.'
  - The class group action is on curves with a fixed endomorphism ring; changing the ring changes the
    torsor and could be mistaken for a transfer.
  - Subexponential class-group DLP is asymptotic and does not by itself make any concrete instance easy.
  falsification:
    semantic: An explicit natural transformation falsifies the no-go and would be a major positive.
    evaluator: An enumeration gap scopes out completeness, not the argument.
    not_falsification: Failure to enumerate all constructions.
  why_this_is_not_a_variant: The CSIDH and class-group lanes in this program study the class group action
    itself. This record asks the different question of whether that action can be made to see POINTS,
    which is the only way its subexponential DLP could bear on the ECDLP, and which no record in the corpus
    scan poses directly.
  limits:
