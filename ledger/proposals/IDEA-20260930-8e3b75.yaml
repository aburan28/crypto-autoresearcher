    the additivity of Sigma) or labelled a derivation obligation ((C2), (C3)'s
    criterion, (D)). No number is a measurement. Per the dispatcher's rule,
    prior_art.nearest names only KR-* rows and KN-* entries; the nearest
    IDEA-*, H-* and external records are carried here and in
    discriminated_from.

  assumptions:
    - >-
      E ordinary, #E(F_p) = n prime, n != p, p > 3, j not in {0, 1728}, b != 0,
      so that the direction (1, 0) is non-trivial and y_P != 0 for every P != O.
      The anomalous panel (n = p) is a control, never a target.
    - >-
      Dual-number arithmetic is exact: (u + eps w)^{-1} = u^{-1} - eps w u^{-2}
      for u a unit; every affine addition on E_eps is the short-Weierstrass
      formula over R; no point of E_eps(R) above O other than kernel elements
      is ever formed (the scalar multiplication by n lands in K by
      construction and is read off by psi).
    - >-
      The census instrument of EXP-ECDLP-184fc4 / IDEA-20260905-f31bc4 is
      used unchanged; its random-function null and 2-torsion control are
      inherited; delta is computed from coordinates only, and the tabulated
      logs are used solely to index the spectrum (RQ-ECDLP-c1b7b1 constraint).
    - >-
      OFF-LIMITS COMPONENTS: F5 as the boundary (the same construction over
      Z/p^2 is 3a30d5), F4 and the anomalous fragment as the known inhabitants
      of the fast high-degree door; no factor base, no walk, no lift to
      characteristic zero.

  proof_search_map:
    bottleneck: >-
      Whether the defect of the coordinate-defined reference section relative
      to the unique equicharacteristic torsion lift is correlated with any
      character of G beyond the white level. Everything else in the record is
      exact arithmetic; this one number is the content.
    baseline_embedding:
      parameter_slice: >-
        The trivial deformation direction (a', b') = lambda (4a, 6b), where the
        family is the constant curve in a moving coordinate system (the
        nearby-object control of IDEA-20260905-3e9133) and delta must equal
        lambda x_P / y_P exactly; and the Witt direction, where the same
        construction over Z/p^2 is IDEA-20260905-3a30d5's torsion digit and
        (C2) must hold.
      reproduction_check: >-
        Symbolic ((C1) derived in mechanism) and frozen fixture: on three toy
        curves, delta_triv(P) == lambda x_P / y_P for every P with zero
        tolerance; the homomorphism s(P + Q) = s(P) + s(Q) checked on all
        pairs at one size; (C2) checked against a Z/p^2 implementation on 10^3
        points per curve with zero tolerance, or deferred with the deferral
        recorded.
    observation_collision:
      observable: >-
        The DL-spectrum magnitudes |delta^(a)|, a != 0, and the derived
        statistics (max-spike exponent, Gumbel Z, half-energy fraction, slope
        in log p); plus the three exact identities as calibrations.
      distinct_preimage_search: >-
        Two functions with identical spectral magnitudes: delta and any
        translate delta(. + T) (phases only; harmless, the reason magnitudes
        are the invariant). The dangerous collision: delta_KS versus
        delta_KS + lambda x/y for an unknown lambda (a different direction
        normalisation) -- these have DIFFERENT spectra in general, and the
        record fixes the direction (1, 0) and the reference convention before
        any spectrum is read; a reader comparing two sessions must compare
        conventions first. A white spectrum collides with "no structure" and
        with "structure invisible to single characters" (adaptive
        multi-function combinations are b6154d's stated gap and are inherited
        here as a limit).
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the construction fixed and vary the forgotten structure -- the
          deformation direction across the one-dimensional space: trivial
          direction gives a bounded-degree function (white by theorem),
          Kodaira-Spencer direction gives a degree >= p / C_0 function
          (measured). The intrinsic invariant separating them is the
          Kodaira-Spencer class, i.e. non-splitness of the Weil restriction.
        predicted_gain: >-
          A built-in exact negative control and a one-parameter family with a
          single genuine member, at zero compute.
      - transform: representation_reduction
        proposed_object: >-
          Replace "coordinate invariants of the p-adic torsion lift"
          (KN-OPEN-3417fc) by "the lift-independent part of the torsion digit",
          which (C2) identifies with delta_KS computed in F_p[eps]: encoding
          exact (first-order deformation theory), completeness exact at
          precision 2, soundness spent on (C2) being true, cost loss none
          (no p-adic arithmetic).
        predicted_gain: >-
          One canonical digit replaces an affine family of lift-dependent
          digits; the census needs one run instead of one per lift.
    quantifier_order: >-
      FOR ALL ordinary E/F_p of prime order n != p with j not in {0, 1728},
      b != 0, FOR the fixed direction (1, 0) and the fixed reference
      convention, the function delta_KS: G -> F_p is defined and satisfies
      (B), (C1) and (D) unconditionally (modulo the derivation obligations
      named). The EMPIRICAL claim (E) is: FOR the declared toy panel (sizes,
      seeds, post-functions), the census statistics lie in the declared white
      bands. No witness may depend on the target: the direction, reference,
      library and seeds are frozen before any log is tabulated. THE WEAKER
      READING NOT CLAIMED: white at toy scale implies white at cryptographic
      scale -- that is H2, an extrapolation, labelled so.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for the declared curves, sizes, direction, reference and
        post-function library, delta_KS and delta_2 have DL-spectra at the
        white level with the stated statistics, the three identities hold
        exactly, and the anomalous panel recovers m with certificates." It
        can NEVER certify that no deformation observable at higher precision
        or over a larger base carries a character, nor anything at
        cryptographic scale, nor anything about adaptive combinations of
        digits.
      nearby_object_control: >-
        The anomalous curve (n = p), where the same construction is a nonzero
        homomorphism and the instrument must read it as linear in the scalar
        (beta = 1, half-energy fraction below 8/N, scalar recovered with
        certificate); and the trivial direction, where the digit is x/y and
        white by theorem. A pipeline that cannot see the anomalous object as
        linear or the trivial direction as x/y has not identified the
        load-bearing structure (coprimality of n and p; non-splitness of the
        Kodaira-Spencer extension).
    proof_obligations:
      - claim: The sequence 0 -> K -> E_eps(R) -> E(F_p) -> 0 splits uniquely for n coprime to p; delta(P) = -(n^{-1} mod p) psi([n] ref(P)); delta(P + Q) = delta(P) + delta(Q) + c(P, Q).
        responsibility: correctness
      - claim: (C1) delta_triv(P) = lambda x_P / y_P exactly for the direction lambda (4a, 6b).
        responsibility: baseline
      - claim: (C2) the lift-derivative identity between two Z/p^2 lifts and delta_{(a',b')}, exact mod p.
        responsibility: correctness
      - claim: (C3) Sigma is additive for n = p and recovers m; the criterion Sigma != 0 iff a_p == 1 (derivation obligation; Belding retrieved at abstract level as the external pointer).
        responsibility: baseline
      - claim: (D) delta_KS is not the restriction of a rational function of degree below p / C_0 (non-split Weil restriction plus Bezout / Lang-Weil count).
        responsibility: strictness
      - claim: Every reported spectral statistic names the curve, size, seed, direction, reference convention and post-function, and is paired with the null's value.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: (C1) exact-identity failures, delta_triv(P) versus lambda x_P / y_P, over all points of three toy curves
      direction: lower
      minimum_effect: 'EXACTLY ZERO. Any failure voids the instrument (zero tolerance).'
    - metric: (C2) exact-identity failures between two Z/p^2 torsion sections and 2 y_P delta_{(a'',b'')}(P), 10^3 points per curve
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO if (C2) is true. A failure does NOT void the census; it
        falsifies the identification with 3a30d5's digit and is reported as a
        derivation outcome in its own right.
    - metric: (C3) anomalous panel, scalar recovered by Sigma(Q)/Sigma(P) with certificate [m]P = Q, 50 instances at 10 to 16 field bits
      direction: higher
      minimum_effect: '50 of 50 with certificates; a single failure voids the positive control and no white reading may be reported.'
    - metric: max-spike exponent beta of delta_KS, delta_2 and their post-functions, fitted over N in {2^16, 2^20, 2^24}, three seeds each
      direction: different
      minimum_effect: >-
        E-WHITE iff beta in [0.45, 0.60] for every library member AND the
        ratio of the member's max spike to the null's lies in [0.5, 2] at every
        size; E-LEAD iff some member has ratio >= 4 at all three sizes with a
        non-decreasing trend and the null does not; INCONCLUSIVE otherwise.
        Honest prior: 0.90 E-WHITE, 0.03 E-LEAD, 0.07 inconclusive.
    - metric: half-energy fraction of each member
      direction: different
      minimum_effect: 'E-WHITE band 0.50 +- 0.05; a value below 0.25 replicated across sizes is the concentration signature.'
    - metric: one-step meter (L, b) of IDEA-20260802-002 for delta_KS at N = 2^12 (exhaustive)
      direction: different
      minimum_effect: >-
        L within 0.1 bit and b within 5 percent of the random-label null with
        the same image size; a b below one quarter of the null's at L >= 1 is
        a propagation signature and is reported, not interpreted.
    - metric: slope in log p of (max spike / sqrt N)
      direction: different
      minimum_effect: 'Within +- 0.1 of zero for every member; a slope >= +0.25 on a member and not on the null is the structure signature.'

  minimal_test:
    design: >-
      CELL. Deterministically generated ordinary short-Weierstrass curves over
      F_p with #E prime (cofactor 1), non-anomalous, j not in {0, 1728},
      b != 0, at field_bits in {16, 20, 24}, three seeds each (one PCG64
      stream per size, recorded); embedding degree and twist checks recorded.
      ANOMALOUS PANEL: 50 curves with #E = p at field_bits in {10, 12, 14,
      16} from the lane's existing anomalous generator (IDEA-20260905-dacf4f's
      arm, or CM construction with trace 1; the method is recorded).
      INSTRUMENT. Exact dual-number affine arithmetic on E_eps (about 150
      lines, pure Python); scalar multiplication by n; psi read off the
      kernel element; the census FFT of EXP-ECDLP-184fc4 reused unchanged;
      log tabulation by walking the generator (2^24 group operations at the
      largest size).
      LIBRARY (frozen before any log is tabulated): delta_KS at precision 2
      (direction (1, 0), vertical reference); delta_2 at precision 3
      (direction a + t, same reference convention, defined analogously);
      post-functions e(delta / p), delta mod 2, mod 4, mod 8, Legendre(delta),
      [delta < p/2]; delta_triv (direction (4a, 6b)) as the exact control.
      NULL: a seeded uniformly random function G -> F_p with the same
      post-functions. INSTRUMENT CONTROL: f31bc4's 2-torsion descent symbol
      on a cyclic even-order curve at each size.
      PROCEDURE. (0) Stage 0 derivation note. (1) Stage 1 gates: (C1) on all
      points of the 16-bit curves; homomorphism check on all pairs at 12
      bits; (C2) on 10^3 points per curve if a Z/p^2 torsion-section
      implementation is available, else deferred and recorded; (C3) on the
      anomalous panel with certificates. (2) Stage 2 census on the ladder:
      per member per curve, max spike, Gumbel Z, half-energy fraction, the
      full spectrum saved; the null and the 2-torsion control through the
      identical code path (hash recorded). (3) Meter (L, b) at 12 bits,
      exhaustive. (4) Aggregation: beta fit over sizes with residuals; ratios
      to null; slopes.
      OUTCOME TABLE. E-WHITE: all members in band at all sizes -- the
      Kodaira-Spencer cell of the lifting taxonomy is closed at toy tier for
      this digit family with a measured obstruction (the white spectrum, its
      slope, and the (L, b) value), and KN-OPEN-3417fc's equicharacteristic
      twin is answered negatively at toy scale. E-LEAD: a member above band
      on all sizes, growing, absent from the null -- replicate (Stage 3),
      then independent review; no exploit is modelled before that. ARTIFACT:
      any (C1) failure, any anomalous-panel failure, any 2-torsion control
      miss -- the run is void and says nothing.
      FALSIFICATION THRESHOLD, FIXED NOW. E-WHITE is falsified iff some
      member's spike ratio to the null is >= 4 at every size; E-LEAD is
      falsified iff every member's ratio is <= 2 at every size.
      COST (estimate, order of magnitude): implementation low (dual-number
      arithmetic and library on top of the existing census); compute low
      (minutes per curve at 2^24 for tabulation and FFT; the anomalous panel
      seconds per instance). Not a measurement.
    controls:
      - (C1) trivial-direction exact identity delta_triv = lambda x_P / y_P on every point (zero tolerance; blocking).
      - Homomorphism check s(P + Q) = s(P) + s(Q) on all pairs at 12 bits (blocking instrument check).
      - (C3) anomalous panel, 50 instances, scalar recovered with certificate [m]P = Q (blocking positive control at the construction level).
      - f31bc4's 2-torsion descent symbol on an even-order curve at each size (blocking positive control at the instrument level).
      - Seeded random-function null with identical post-functions and code path, hash recorded (blocking).
      - (C2) lift-derivative identity against a Z/p^2 torsion section, 10^3 points per curve (non-blocking; deferred with record if no p-adic instrument exists).
      - Decay test in p across the three sizes for every member (artifact tell of docs/inventor-protocol.md section 3).
    required_metrics:
      - counts of (C1), homomorphism and (C2) identity failures (predicted exactly zero)
      - anomalous-panel recoveries with certificates, 50 of 50
      - per member per curve: max spike, Gumbel Z, half-energy fraction, full spectrum artifact
      - the same for the null and the 2-torsion control
      - beta fit over sizes with residuals; spike ratio to null per member per size; slopes
      - (L, b) at 12 bits for delta_KS and for the matched random label
      - wall-clock and peak memory per stage

  falsification_conditions:
    - 'E-WHITE falsified iff some library member has spike ratio to the null >= 4 at every size with a non-decreasing trend (then E-LEAD, routed to replication and review).'
    - 'E-LEAD falsified iff every member has ratio <= 2 at every size.'
    - '(C1) fails on any point: instrument void; nothing is reported (AGENTS.md rule 3).'
    - '(C3) fails on any anomalous instance: the construction-level positive control is void; no white reading may be reported.'
    - '(C2) fails: the identification of delta_KS with the lift-derivative of the p-adic torsion digit is false; recorded as a derivation outcome; the census stands on its own.'
    - '(D) fails (a rational function of degree below p / C_0 reproducing delta_KS on G is exhibited): the degree lemma is withdrawn and delta_KS enters b6154d''s bounded-degree class, where its white spectrum becomes a theorem rather than a measurement.'
    - 'The 2-torsion instrument control is missed at any size: run void.'

  confounders:
    - >-
      Convention drift. delta depends on the reference section and the
      direction normalisation; two sessions using different conventions
      measure different functions (differing by a multiple of x/y). The
      conventions are frozen in the design and must be printed in every
      artifact.
    - >-
      Toy n/p ratio. At cofactor 1, n is within 2 sqrt(p) of p, so delta is
      nearly a bijection G -> F_p only in expectation; fibre statistics at
      16 bits are noisy, which is why the (L, b) meter is run exhaustively at
      12 bits and the spectrum ladder reports slopes, not levels.
    - >-
      Accidental structure of the generator. Curves generated by a CM method
      carry small-discriminant endomorphism rings; the non-anomalous panel
      must use random coefficients with point counting, and the anomalous
      panel's CM provenance must be recorded and kept out of the generic
      arm.
    - >-
      Precision-3 definition. delta_2 depends on how the reference section is
      extended to precision 3; the record fixes "zero x-displacement at every
      order" and the choice must not be changed after a spectrum is seen.
    - >-
      Post-function aliasing. Residues of delta mod small moduli have l^1
      Fourier norm O(log p) and inherit any spike of e(delta / p); a spike
      seen only in one post-function and not in e(delta / p) is an artifact of
      that post-function.

  interpretation_limits:
    - >-
      Toy tier. Sizes 2^16 to 2^24, three seeds, one direction, one reference
      convention, two precisions. Nothing transfers to cryptographic p by any
      argument here (H2 is labelled extrapolation).
    - >-
      A white spectrum is a statement about single-character correlations of
      the declared members; it says nothing about adaptive combinations of
      many digits, which is b6154d's stated gap and remains open.
    - >-
      No exponent moves. The conditional route from a spike to a leak is
      b6154d's break-even (N^(3/4)) and is a model, never run here.
    - >-
      The anomalous arm is KNOWN (Belding 2007; the p-adic form is Smart /
      Satoh-Araki / Semaev, KN-TECH-033): it is a calibration and is never a
      result. The Hasse-invariant criterion is a derivation obligation and may
      be found in Belding's body; if so the obligation becomes a citation.
    - >-
      The KN-OPEN-020 class of {delta_KS < B} as a factor base, should anyone
      use it so: implicit-membership (one dual-number scalar multiplication per
      test), high-degree description (>= p / C_0 by (D)), target-independent;
      no algebraic decomposition handle exists for it and mean yield is
      conserved (KN-FIND-007); it is not proposed as a base here.
    - >-
      KN-TECH-06bb4e gains a sixth cell from this record only if the Coordinator
      promotes it; the record names the cell and does not edit the taxonomy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Random-digit model.) For the Kodaira-Spencer direction on a
        non-anomalous prime-order curve, the function e(delta_KS / p): G -> C
        has DL-spectrum magnitudes distributed as those of a uniformly random
        function G -> F_p with the same marginal law: max over a != 0 of
        |delta^(a)| at the Gumbel level sqrt(2 N log N) (1 + o(1)), half-energy
        fraction 1/2 + O(N^(-1/2)).
      rigorous_support: >-
        None for delta_KS itself: by (D) its degree exceeds p / C_0, so the
        Weil-level bound of b6154d (B) does not apply; the only rigorous input
        is the absence of an additive component (Hom(Z/n, F_p) = 0). The
        assumption imitates the classical law for the Fourier coefficients of
        a random function on Z/N (sums of N unit phases), the same law f31bc4
        and 3a30d5 use for their nulls.
      validation_plan: >-
        SAMPLE: the complete spectrum (all N frequencies) of delta_KS on three
        curves at each of N in {2^16, 2^20, 2^24}, no sampling shortcut needed
        (the group is enumerable). COMPARISON DISTRIBUTION: the empirical
        distribution of |delta^(a)| against the Rayleigh law for a random
        function (Kolmogorov-Smirnov), and the max spike against the Gumbel
        prediction. TAIL CHECK: the largest spike over all members and curves
        at each size versus the largest over an equal number of null
        replicates; a real effect shifts the whole distribution. SAMPLED
        PARAMETERS RECORDED: p, n, seed, direction, reference, precision, per
        cell. TRANSFER ASSUMPTION: none claimed; see H2.
    - id: H2
      statement: >-
        (Transfer.) A white reading on the toy ladder with slope zero in log p
        persists at cryptographic p.
      rigorous_support: >-
        None. Labelled EXTRAPOLATION wherever a conclusion beyond the tested
        sizes is drawn; the slope in log p is the only handle and is reported
        with its interval.
      validation_plan: >-
        Not validatable in this record; a medium-scale replication (2^32 with
        sampled frequencies) is the next rung and is named in next_gate, not
        designed here.

  heuristic_note: >-
    (A), (B), (C1) and the cocycle law are exact; (C2), (C3)'s criterion and
    (D) are derivation obligations; H1 is the only distributional assumption
    and the measurement is its test; H2 carries the only transfer.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED OR MOVED. delta_KS costs O(log n) dual-number
      group operations per point, about three times an affine F_p scalar
      multiplication. The predicted outcome is a white spectrum, i.e. no leak
      and no change to the 1/2 exponent. CONDITIONAL AND NOT EXPECTED: a spike
      of N^(3/4) on some member would, by b6154d's break-even, tie a
      polylog * eps^(-2) hard-core amplification with rho; anything below that
      spike leaves rho ahead.
    memory_exponent: >-
      O(1) per point evaluation; the census stores one length-N spectrum per
      member at toy scale (measurement cost, not attack cost).
    best_known: >-
      Parallel Pollard rho with negation at 0.886 sqrt(n) group operations and
      O(1) memory (KN-TECH-006, KR-RHO-fb88e6); BSGS at sqrt(n) time and
      memory; on anomalous curves the linear-time p-adic attack (KR-RHO-53c89f)
      and its dual-number form (Belding). Nothing here changes any of them.
    hidden_overhead: >-
      The dual-number arithmetic constant (about 3x); the precision-3 cost
      (about 2x more); the FFT census at toy scale. Nothing hides in an o(1)
      because no asymptotic claim is made.
    tradeoff_note: >-
      Not applicable; no algorithm is proposed. A leak, if one existed, would
      enter the bit-security reductions, not a time-memory tradeoff.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Estimate. About 150 lines of dual-number arithmetic plus the library on
      top of EXP-ECDLP-184fc4's census; log tabulation and FFT at 2^24 in
      minutes per curve; the anomalous panel in seconds per instance; total
      under a few CPU-hours on one core. Not a measurement.

  asymptotic_claim:
    problem: prime-field ECDLP on ordinary prime-order curves (RQ-ECDLP-c1b7b1, RQ-ECDLP-4fcbd3)
    prior_best: rho at 0.886 sqrt(n); no cheap coordinate function with a DL-spectrum spike above the Weil level is known on a generic prime-order curve
    time_exponent: 'no change claimed; predicted outcome is a measured white spectrum'
    memory_exponent: 'no change claimed'
    hidden_cofactor: dual-number arithmetic constant; census cost at toy scale
    claim_kind: representation_and_census_measurement

  recommended_priority: high
  priority_rationale: >-
    Ranked first in this lane because it is the one candidate that is a
    genuinely new arithmetic object for the program's measurement pipeline (a
    canonical digit in a lifting cell no record names), because its three
    exact identities make it the best-calibrated census member the lane has
    (zero-tolerance negative control, zero-tolerance bridge to the p-adic
    digit, certificate-bearing positive control), because it costs CPU-hours
    on an instrument that exists, and because EITHER outcome is a deliverable:
    a measured obstruction closing a named cell at toy tier, or the first
    computational handle in a local-torsion cell. It is ranked below any
    exponent-moving ECC work and above the subset-door closure of
    IDEA-20260930-a6491b, which it feeds.

  first_deliverable: >-
    Stage 0 (the derivation note: (A), (B), (C1) with every step numbered,
    (C2) derived or its failure point recorded, (D) with the two recalled
    inputs named, (C3)'s criterion derived or left as an obligation) and Stage
    1 (the four gate checks), as a zero-run note plus a minutes-long gate run.

  next_gate: >-
    Coordinator decision on designing this into an EXP-ECDLP-* contract on the
    census instrument, with Stage 1 as the blocking gate and Stage 2 as the
    measurement; approval is a separate decision. If E-LEAD fires, the next
    gate is replication at 2^32 with sampled frequencies and an independent
    review before any cost is modelled.

  discriminated_from: >-
    IDEA-20260905-3e9133 and H-ECDLP-a3598b (nearest internal records, same
    object, four neutral toy evidence records EV-ECDLP-8ef054 / b909d7 /
    b91d4a / 6a0e86 on EXP-ECDLP-a5f766): they ask how the first-order
    coordinate response of the torsion section transforms under gauge and
    parameter changes and whether it vanishes on constant families (it does;
    on the flex family it does not); this record takes the response as given,
    normalises it to one canonical digit, proves its degree, bridges it to
    the p-adic digit and MEASURES its discrete-log correlation, which no
    record in that lineage does. ECDLP-IDEA-109 (rejected, merged with the
    prime-to-p torsion no-go): asked for scalar covariance; this record agrees
    it is impossible and measures the non-covariant defect. IDEA-20260905-3a30d5:
    the Witt-direction twin; (C2) is the exact bridge and the two instruments
    must agree on it. IDEA-20260905-24b41a: the constant family, where the
    torsor coordinate is additive and forced zero; the non-constant family's
    defect is not additive and is outside (T1). IDEA-20260905-848b77: supplies
    the dichotomy that places delta on the "function of T" side; this record
    runs the census that dichotomy says is the remaining question.
    Belding 2007 (arXiv math/0703906, abstract retrieved, body unread): the
    anomalous arm is hers and is used only as the positive control; this
    record's generic-curve measurement is the complement her abstract does
    not mention.

  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked: [KR-RHO-53c89f, KR-IC-cd159a, KR-RHO-13bf67, KR-RHO-755e35, KR-IC-5931ee, KR-RHO-5b1c0a, KR-IC-5a43e5, KR-RHO-fb88e6]
    nearest:
      - ref: KR-RHO-53c89f
        provenance: internal
        relation: special_case
        delta: >-
          The row records the anomalous (trace-one) attack as a curve check
          via p-adic lifting; this record's (C3) arm is its equicharacteristic
          (dual-number) form, known externally (Belding 2007, retrieved at
          abstract level, carried in citations) and used here only as the
          certificate-bearing positive control. The record's subject -- the
          non-anomalous defect digit and its DL-spectrum -- is outside the
          row.
      - ref: KN-OPEN-3417fc
        provenance: internal
        relation: adjacent
        delta: >-
          The open question asks for a coordinate or valuation invariant of
          the p-adic torsion lift separating [k]S by k; this record poses and
          measures its equicharacteristic twin and, through (C2), identifies
          the lift-independent content of the p-adic torsion digit with
          delta_KS, so a toy answer here is a toy answer to the twin.
      - ref: KN-TECH-06bb4e
        provenance: internal
