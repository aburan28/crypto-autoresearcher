idea:
  id: IDEA-20260930-8e3b75
  question_id: RQ-ECDLP-c1b7b1
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE DEFORMATION DEFECT DIGIT: on a prime-order ordinary curve the unique
    n-torsion lift of a point into a NON-CONSTANT first-order deformation
    E_eps/F_p[eps] (the Kodaira-Spencer direction) has a canonical O(log n)-cost
    defect delta_KS relative to the coordinate-defined reference section; it is
    the equicharacteristic sibling of the Fermat-quotient digit, provably not a
    rational function of degree below p/C, forced to lambda*x/y on the trivial
    deformation direction, forced to Belding's dual-number anomalous attack when
    n = p, and predicted equal to the lift-derivative of the p-adic torsion digit
    -- measured for discrete-log correlation on the DL-spectrum census instrument
    with those three identities as zero-tolerance calibrations
  class: representation

  claim: >-
    REPRESENTATION CLASS AND STAGE (RQ-ECDLP-623a32 vocabulary, filed under
    RQ-ECDLP-c1b7b1 because the object is a canonical non-homomorphic local
    section): class R3, local-ring representation with a NON-CONSTANT curve --
    the point P is represented by its unique order-n lift s(P) into
    E_eps(F_p[eps]/eps^2) for a first-order deformation E_eps of E; the attack
    stage whose charged cost is examined is collision structure (a cheap
    coordinate function correlated with a group character, the lane's leak
    route); the predicted change on a generic prime-order non-anomalous curve
    is ZERO, and the record's content is the measurement that decides it, with
    the anomalous curve as the object on which the same construction is a
    linear-time attack.

    (A) THE SETTING. E: y^2 = x^3 + a x + b over F_p, p > 3, ordinary,
    #E(F_p) = n prime, n != p (gcd(n, p) = 1), j not in {0, 1728}, b != 0.
    Fix the deformation direction (a', b') = (1, 0): E_eps: y^2 = x^3 +
    (a + eps) x + b over R = F_p[eps]/eps^2. Reduction E_eps(R) -> E(F_p) is
    surjective (Hensel, smooth fibre) with kernel K isomorphic to F_p via the
    invariant vector field V = 2y d/dx + (3x^2 + a) d/dy: the kernel element
    K_t acts on any point above P by (x, y) |-> (x + eps 2y_P t, y + eps
    (3x_P^2 + a) t); write psi(K_t) = t. Because |K| = p and n is coprime to
    p, the sequence 0 -> K -> E_eps(R) -> E(F_p) -> 0 splits as abstract
    groups and the splitting s: G -> E_eps(R) is UNIQUE (two splittings differ
    by a homomorphism Z/n -> F_p, which is zero): s(P) is the unique point of
    order n above P, the equicharacteristic twin of the p-adic torsion lift
    of KN-TECH-73630e / IDEA-20260905-848b77.

    (B) THE OBJECT. The reference section ref(P) = (x_P, y_P + eps x_P/(2 y_P))
    is the unique point above P on E_eps with zero x-displacement (it exists
    because y_P != 0 on a prime-order curve; it is a bounded-degree rational
    function of the coordinates and is NOT a homomorphism). Define
        delta(P) := psi( s(P) - ref(P) )  in F_p.
    Computation: [n] ref(P) lies in K (it reduces to [n]P = O); since
    [n] ref(P) = [n](s(P) - delta(P) V) = -n delta(P) V, one has
        delta(P) = -(n^{-1} mod p) * psi([n] ref(P)),
    one dual-number scalar multiplication by n: O(log n) group operations over
    R, about three field multiplications per F_p multiplication. The one-step
    law is exact: delta(P + Q) = delta(P) + delta(Q) + c(P, Q) with the
    bounded-degree cocycle c(P, Q) := psi(ref(P) + ref(Q) - ref(P + Q)).
    delta is canonical given (model, direction, reference convention), and
    it is LINEAR in the direction: delta_{(a',b')} = a' delta_A + b' delta_B.

    (C) THREE EXACT IDENTITIES, EACH A ZERO-TOLERANCE CALIBRATION.
    (C1) TRIVIAL DIRECTION. For (a', b') = lambda (4a, 6b) the deformation is
    the isomorphism (x, y) |-> ((1 + 2 lambda eps) x, (1 + 3 lambda eps) y)
    of the constant family, so s(P) = ((1 + 2 lambda eps) x_P,
    (1 + 3 lambda eps) y_P), and a two-line computation (recorded in
    mechanism) gives s(P) - ref(P) = eps (lambda x_P / y_P) V_P, i.e.
        delta_triv(P) = lambda x_P / y_P   EXACTLY, for every P.
    A bounded-degree coordinate function, inside the class C(D, L) of
    IDEA-20260905-b6154d, white by that record's ceiling; the instrument must
    return this identity bit for bit or every other number is void.
    (C2) LIFT-DERIVATIVE IDENTITY (derivation obligation, predicted exact).
    Let E^_1, E^_2 be two lifts of E to Z/p^2 whose coefficients differ by
    p (a', b'), and t_1, t_2 their unique n-torsion sections (the torsion
    digit D_t of IDEA-20260905-3a30d5 is read off t_1). Then
        ( x(t_2(P)) - x(t_1(P)) ) / p  ==  2 y_P * delta_{(a',b')}(P)  (mod p).
    Reason: lifts of E to any square-zero extension with ideal I form a
    torsor under H^1(E, T_E) tensor I; the dependence of the unique torsion
    section on the lift is the derivative of the [n]-multiplication map with
    respect to the coefficients, and the linearisation of Z/p^2 arithmetic at
    a point is F_p[eps] arithmetic (carries cancel in a difference to first
    order). Consequence, which is the point: the p-adic torsion digit of
    3a30d5 depends on the choice of lift through an affine action whose ONLY
    invariant is delta_KS, so delta_KS is the lift-independent content of the
    torsion digit, computable with no p-adic arithmetic at all.
    (C3) THE ANOMALOUS CASE, WHICH IS KNOWN. If n = p the sequence does not
    split canonically; Sigma(P) := psi([p] ref(P)) is well defined and
    ADDITIVE (because [p] kills the central kernel, the cocycle term p c(P, Q)
    vanishes), and Sigma(Q) = m Sigma(P) for Q = [m]P. Belding (arXiv
    math/0703906, 2007; UMD thesis 2008) describes exactly "an attack on the
    discrete logarithm problem on anomalous curves, analogous to that of
    Smart, using a lift of E over the dual numbers of the finite field of p
    elements" (abstract, RETRIEVED; body not readable in this session). This
    record adds only the criterion it uses as a derivation obligation:
    Sigma != 0 iff a_p == 1 mod p, via the Cartier descent of the canonical
    connection on L^{tensor p} for an F_p-rational order-p line bundle L
    (p-curvature-zero connections d + c omega on the trivial bundle with
    c in F_p^* exist iff the Hasse invariant equals 1, i.e. a_p == 1); this
    is RECALLED reasoning and is labelled unverified. On the toy anomalous
    panel the construction must return m with certificate [m]P = Q or the
    instrument is void.

    (D) THE DEGREE LEMMA (derivation obligation). For the Kodaira-Spencer
    direction, delta_KS is NOT the restriction to G of any rational function
    on E of degree d < p / C_0, for an absolute C_0. Sketch: if delta = r|_G
    then sigma := ref + r V is a rational section of the Weil restriction
    EE := Res_{R/F_p}(E_eps) -> E (an algebraic G_a-extension of E whose
    class is the Kodaira-Spencer class of the deformation, non-split for a
    non-trivial direction), and sigma is a homomorphism on G x G; the locus
    where sigma(P + Q) != sigma(P) + sigma(Q) is Zariski-closed of degree
    O(d) in E x E and misses the n^2 points of G x G, so for d below p / C_0
    it is empty by the Bezout / Lang-Weil point count; then sigma is an
    algebraic homomorphic section, the extension splits, contradiction. So
    delta_KS is a FAST HIGH-DEGREE function in the sense of b6154d's door
    (E), with a rigorous reason for its degree rather than a by-inspection
    one: the only known inhabitants of that door (the Tate pairing, the
    Fermat-quotient digit, walk itineraries) have their degree by
    construction; this one has it by a non-splitting theorem.

    (E) PREDICTIONS, PRE-REGISTERED. On non-anomalous prime-order toy curves
    the DL-spectrum statistics of EXP-ECDLP-184fc4's census, applied to
    delta_KS (precision 2), delta_2 (precision 3, direction a + t), and their
    cheap post-functions (additive character e(delta/p); residues mod 2, 4,
    8; Legendre(delta); half-interval), are WHITE: max-spike exponent beta in
    [0.45, 0.60], Gumbel Z in [0.5, 4], half-energy fraction 0.50 +- 0.05,
    slope in log p of (max spike / sqrt N) within +- 0.1 of zero, all
    matching the seeded random-function null with the same marginals. The
    one-step meter of IDEA-20260802-002 reads delta as a random label: image
    size about (1 - 1/e) p, loss L about 1 bit, branching b at the
    random-label level. TWO EXPLANATIONS DISCRIMINATED. E-WHITE: the
    equicharacteristic torsion lift carries, beyond the group isomorphism of
    KN-TECH-73630e's twin, a defect that is uncorrelated with every character
    of G -- the measured obstruction that closes the Kodaira-Spencer cell of
    the lifting taxonomy at toy tier for this digit family. E-LEAD: a member
    with spike ratio to null >= 4 on all three sizes, growing with p and
    absent from the null -- the first computational handle in a local-torsion
    cell, routed to replication and independent review before any exploit is
    modelled; the break-even for a leak is b6154d's N^(3/4) spike.

    (F) WHAT IT IS NOT. Not an attack, not an exponent, not a factor base.
    Not the scalar-covariant jet of ECDLP-IDEA-109 (rejected): this record
    AGREES that no finite jet can satisfy J([a]R) = a J(R) for n != p
    (Hom(Z/n, F_p) = 0, IDEA-20260905-24b41a (T2)) and measures the
    non-covariant defect instead. Not IDEA-20260905-3e9133 / H-ECDLP-a3598b,
    which audit the transformation laws of the same jet and never measure a
    discrete-log statistic.

  mechanism: >-
    OBJECT FRAME. THE PAIR: representation = the unique order-n lift s(P) of
    the point into E_eps(F_p[eps]/eps^2) for a NON-trivial first-order
    deformation E_eps (class R3, local-ring representation with a varying
    curve; the constant-curve dual numbers of IDEA-20260905-24b41a are the
    excluded trivial direction); operation set Sigma = the lifted group law
    of E_eps(R) restricted to s(G), which is the full translation action of G
    transported by the isomorphism s, together with the fixed reference
    section ref and the fixed direction. TRICHOTOMY: Class III,
    coordinate-dependent, one-line reason: delta(P) is a function of the
    model, the direction and the reference convention, and its one-step law
    delta(P + Q) = delta(P) + delta(Q) + c(P, Q) needs the coordinates of P
    and Q through the cocycle c, so delta alone does not propagate under
    translation (it cannot, by IDEA-20260806-c5d183 (A): it is lossy and not
    a homomorphism). LOSSY-PROJECTION TEST AGAINST SIGMA: the projection
    P |-> delta(P) discards the point and keeps one F_p digit -- lossy in the
    representation used (image about 0.63 p of n points, fibres of mean size
    about 2); it is NOT Sigma-compatible as a deterministic object, and the
    record says so rather than forcing a class; the object actually tracked
    through the measurement, exactly as in IDEA-20260905-3a30d5 and
    IDEA-20260905-f31bc4, is the pair (DL-frequency a, |delta^(a)|), on which
    translation by a known multiple of P acts by a phase, so spectral
    MAGNITUDES propagate deterministically and N phases are discarded:
    lossy and compatible. THE PRICED OPEN NUMBER: for a Class III digit the
    classification leaves open the (L, b) meter value and the spectral
    concentration; both are measured, with the predicted values stated in
    claim (E). OFF-LIMITS COMPONENTS NAMED: F5 (p-adic lift) is the boundary
    object -- the same construction over Z/p^2 instead of F_p[eps] is 3a30d5,
    and (C2) is the exact bridge; F4 (pairing transfer) and the anomalous
    fragment are boundaries where the fast high-degree door is known to be
    inhabited; the DL-spectrum census (f31bc4, EXP-ECDLP-184fc4) is reused as
    the instrument. What is added beyond those: a new canonical digit in a
    cell the lifting taxonomy KN-TECH-06bb4e does not name (local, torsion,
    EQUICHARACTERISTIC -- call it F2'), three exact identities that
    calibrate it against known objects at zero tolerance, and a rigorous
    degree bound.

    WHY THE DIRECTION MATTERS AND WHY THERE IS ONLY ONE. First-order
    deformations of E modulo isomorphism form H^1(E, T_E), one-dimensional;
    the isomorphism direction (4a, 6b) gives, by (C1), the bounded-degree
    function x/y, and any other direction gives, by linearity, delta_KS plus
    a multiple of x/y. So the family of digits at precision 2 is exactly a
    one-parameter affine family, and the instrument has a built-in exact
    negative control (the trivial direction) and a single genuine member.
    Derivation of (C1): with mu = 1 + lambda eps the map (x, y) |-> (mu^2 x,
    mu^3 y) sends E to y^2 = x^3 + a mu^4 x + b mu^6 = x^3 + (a + 4 a lambda
    eps) x + (b + 6 b lambda eps), so for (a', b') = lambda (4a, 6b) the
    homomorphic section is the image of the constant section; ref(P) for this
    direction is (x_P, y_P + eps lambda (2 a x_P + 3 b)/y_P); the difference
    s(P) - ref(P) = eps (2 lambda x_P, 3 lambda y_P - lambda (2 a x_P + 3 b)
    / y_P), and both components equal (lambda x_P / y_P) times (2 y_P, 3 x_P^2
    + a) because 3 y_P^2 - 2 a x_P - 3 b = 3 x_P^3 + a x_P. Hence delta_triv =
    lambda x_P / y_P.

    WHY A WHITE SPECTRUM IS THE HONEST EXPECTATION, AND WHY IT IS NOT A
    THEOREM. Any additive component c log(P) is impossible (Z/n -> F_p is
    zero for n != p), so delta carries no linear term in the log; this is the
    same obstruction that forces 24b41a's torsor coordinates to be constant.
    What remains is a defect whose degree exceeds p / C_0 by (D), outside the
    Weil-bounded class of b6154d, with no bound on its character correlations
    in the lane's toolkit. The random-function model predicts white; the
    anomalous case shows the construction CAN produce a character when the
    coprimality hypothesis fails; the measurement decides which side the
    generic case is on.

    STAGE 0 (zero compute, HARD GATE). Write (A), (B), (C1), (D) with every
    step numbered; derive (C2) or record exactly where it fails; derive the
    Hasse-invariant criterion of (C3) or mark it unproved and keep Belding as
    the pointer. STAGE 1 (minutes, HARD GATE). Implement dual-number affine
    arithmetic and the scalar multiplication by n on E_eps; verify (C1) on
    every point of three toy curves at 12 to 16 field bits (zero tolerance);
    verify the homomorphism s(P + Q) = s(P) + s(Q) exhaustively at one size;
    verify (C2) against a Z/p^2 torsion-section implementation if one exists
    in the lane (IDEA-20260905-dacf4f's instrument) and otherwise defer (C2)
    with the deferral recorded; run the anomalous panel of (C3) with
    certificates. STAGE 2 (hours). The census of claim (E) on the toy ladder
    with the random-function null and f31bc4's 2-torsion instrument control.
    STAGE 3 (only if E-LEAD fires). Replicate at a fourth seed and one further
    size; route to independent review; no exploit is run under this record.

