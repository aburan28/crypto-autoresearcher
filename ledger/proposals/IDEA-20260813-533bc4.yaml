idea:
  id: IDEA-20260813-533bc4
  date: '2026-08-13'
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SDITH-001
  goal_id: GOAL-SDITH-001
  title: Reusable hypercube projection-mask collision cascade
  class: algorithm
  claim: >-
    If the source-defined SDitH transcript exposes a small recurring family of
    hypercube projection masks over one public code, test whether partial
    syndrome images can be precomputed once and reused across opened views or
    targets to form a collision cascade with lower fully amortized work than
    generic multi-target plain-SD ISD. No recurring mask family, collision
    surplus, or speedup is claimed.
  mechanism: >-
    Split a candidate error across source-defined blocks and map each partial
    error through every attacker-visible projection mask. If many transcript
    openings reuse masks or nested projections, one table entry may serve
    several joins, and a cascade can filter candidates from coarse to fine
    images before full syndrome verification. The only relevant advantage is
    collision or table reuse beyond a generic multi-target decoder on the same
    public parity-check matrix. Preprocessing, table occupancy, target supply,
    cache access, and false-positive verification are all charged.
  why_not_a_renamed_known_approach: >-
    IDEA-20260808-a7872e exploits algebraic factorization of the error-locator
    ideal across blocks; this proposal uses attacker-visible linear projection
    masks and remains applicable only if mask reuse exceeds generic public-code
    precomputation. IDEA-20260813-2caec5 studies rank deficit, while a full-rank
    nested mask family can still permit table reuse. IDEA-20260805-43d6df is the
    mandatory preprocessing-aware baseline. bf6448 treats grinding slack, and
    d873bc locates the protocol-level forgery crossover rather than constructing
    a decoder.
  predictions:
    - metric: projection-image collision surplus over generic multi-target plain SD
      direction: higher
      minimum_effect: >-
        A preregistered factor of at least 2 after matching public code, mask
        ranks, target count, and table size.
    - metric: distinct table entries reused per source-defined opening or target
      direction: higher
      minimum_effect: >-
        At least 2 useful joins per stored entry on a held-out toy capsule, not
        counting repeated accesses to identical data as independent work saved.
    - metric: fully amortized cascade work versus IDEA-20260813-27df0c
      direction: lower
      minimum_effect: >-
        At least 1 net work bit for an available preregistered target count;
        asymptotic relevance requires total preprocessing plus online exponent
        below the matched generic multi-target baseline.
    - metric: planted repeated-mask positive-control recovery
      direction: higher
      minimum_effect: Recover the designed collision surplus and amortized gain.
  minimal_test:
    design: >-
      Without executing here, extract the exact attacker-visible projection
      masks from a source-valid toy transcript family and freeze a target-count
      regime. Enumerate partial-error image tables, measure collision and reuse
      profiles, and compare with random or independently sampled masks matched
      on rank, nesting depth, and count, plus a generic multi-target plain-SD
      table on the same public code. Specify a coarse-to-fine cascade only if
      source masks show residual reuse, then charge the full lifecycle.
    controls:
      - Fully charged 27df0c single- and multi-target baseline first.
      - Generic public-code precomputation available equally to plain SD.
      - Independent random masks matched on rank, count, nesting depth, and image size.
      - Fresh-mask-per-opening control that removes reuse without changing marginal ranks.
      - Planted nested-mask family with a known two-stage collision cascade.
      - Fresh-public-key-per-target control to delimit amortization.
    required_metrics:
      - Mask count, ranks, nesting relations, image entropy, and collision tails.
      - Table construction work, peak occupancy, memory accesses, and reuse count.
      - Cascade false positives, success probability, retries, and final verification.
      - Available target count, per-key and global preprocessing, data, oracle, and amortized total work.
  controls:
    - certified_charged_multitarget_isd_baseline
    - generic_public_code_preprocessing_control
    - rank_nesting_matched_random_masks
    - planted_repeated_mask_positive_control
  confounders:
    - Crediting public-code preprocessing as hypercube-specific.
    - Amortizing across more signatures or targets than the attack model supplies.
    - Counting correlated or identical mask queries as independent information.
    - Ignoring cache misses, table compression overhead, or false-positive verification.
    - Mask nesting already implied by rank relations measured in 2caec5.
    - Toy image spaces that force collisions by pigeonhole alone.
  falsification_conditions:
    - Source masks match rank- and nesting-conditioned random masks in collision and reuse while the planted family is recovered.
    - All table reuse is also available to generic multi-target plain SD on the same public code.
    - The available target count does not amortize preprocessing to at least 1 net work bit.
    - Peak memory, memory access, false positives, or verification dominates the saved joins.
  interpretation_limits:
    - status proposed and novelty unverified; this record has no scientific effect.
    - A collision surplus is an artifact until compared with matched masks of identical shape.
    - Lower online time is not lower total work when preprocessing or data is excluded.
    - A toy mask family does not imply the instantiated production scheme has recurring masks.
    - Overall forgery work must still be compared with IDEA-20260808-d873bc's binding crossover.
  assumptions:
    - Primary sources define attacker-visible projection masks and their reuse across openings or targets.
    - The attack model supplies the declared number of targets under a reusable public code.
    - Partial-error images can be evaluated without secret-only state or an uncharged oracle.
  heuristic_assumptions:
    - id: H-MASK-1
      statement: >-
        Conditional on mask count, rank, nesting depth, domain size, and image
        size, independently sampled random masks model the collision and reuse
        profile of structure-free multi-target projections.
      rigorous_support: >-
        Exact ranks and image sizes determine first-moment occupancy bounds;
        independence and higher collision tails are the random-model assumptions.
      validation_plan: >-
        Enumerate exact occupancy at the smallest slices, sample conditioned
        masks with fixed seeds at larger toy sizes, compare full maximum-bucket
        and reuse tails, and include fresh-mask and planted-nesting controls.
    - id: H-MASK-2
      statement: >-
        For target count T_N available to the adversary, a source mask family
        with reusable-table exponent mu and online cascade exponent gamma has
        fully amortized exponent max(mu minus log_N T_N where meaningful,
        gamma, verification) below the matched generic multi-target exponent.
      rigorous_support: >-
        Preprocessing divided by an available target count is standard
        amortization; the assumptions are that targets actually share the table
        and that reuse, false positives, and memory access obey the derived bounds.
      validation_plan: >-
        State concrete target counts rather than asymptotic fiction, compare
        predicted and observed table occupancy and false-positive tails at three
        or more sizes, and reject any gain that vanishes under the fresh-key or
        generic-preprocessing control.
  proof_search_map:
    bottleneck: >-
      Prove that source-defined projection-mask reuse creates collision or table
      reuse unavailable to a generic multi-target decoder on the same public code.
    baseline_embedding:
      parameter_slice: >-
        Exact 27df0c single- and multi-target frontier rows at the same code,
        weight, target count, memory cap, preprocessing policy, and success probability.
      reproduction_check: >-
        Reproduce baseline work within 0.25 bit and generic public-code
        preprocessing before crediting any hypercube-specific reuse.
    observation_collision:
      observable: Vector of partial-syndrome images under the recurring projection masks.
      distinct_preimage_search: >-
        Enumerate distinct partial errors with identical image vectors and
        compare source and random-mask fibre sizes, then find mask families with
        identical collision counts but different cascade work.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: Fibre table of partial errors sharing a projection-image vector.
        predicted_gain: Makes false-positive and verification cost explicit.
      - transform: telescoping_potential
        proposed_object: Coarse-to-fine nested projection cascade.
        predicted_gain: Rejects candidates incrementally while accounting for each table and verification stage.
    quantifier_order: >-
      Fix the target count, public-key reuse, mask family, cascade order, table
      sizes, memory cap, and amortization policy before measuring collisions.
      Do not select a favorable target count after preprocessing is known.
    method_ceiling:
      strongest_certifiable_claim: >-
        A toy source-gated bound on collision surplus and fully amortized work
        for one specified projection-mask cascade and target regime.
      nearby_object_control: >-
        Fresh independent masks with the same marginal ranks and nesting depth;
        hypercube-specific table reuse must disappear.
    proof_obligations:
      - claim: Reproduce the charged generic single- and multi-target ISD frontier.
        responsibility: baseline
      - claim: Prove every projection and target is attacker-visible and reusable as declared.
        responsibility: interface
      - claim: Bound collision fibres, cascade correctness, and false positives.
        responsibility: correctness
      - claim: Prove total success after all stages and retries.
        responsibility: success_probability
      - claim: Charge preprocessing, peak tables, data, cache access, and verification.
        responsibility: runtime
      - claim: Limit amortization to available targets and public-key reuse.
        responsibility: scope
    not_applicable_reason: null
  target_complexity:
    time_exponent: >-
      Target fully amortized exponent tau_plain_multi minus epsilon for epsilon
      greater than zero; current established delta is zero.
    memory_exponent: Must remain on or below a nondominated matched-baseline row after all cascade tables.
    best_known: >-
      The fully charged single- and multi-target plain-random-SD frontier
      reproduced by IDEA-20260813-27df0c from IDEA-20260805-43d6df.
    hidden_overhead: >-
      Mask extraction, table construction, cache and sort cost, target
      acquisition, false positives, retries, preprocessing amortization, and
      verification are explicit.
    tradeoff_note: >-
      Larger reusable tables can lower online joins but increase peak memory and
      require more targets to amortize. Fresh-key regimes may eliminate the tradeoff entirely.
  sota_delta:
    claim: No current improvement; one matched net bit is required in an actually available target regime.
    current_net_work_delta_bits: 0.0
    current_time_exponent_delta: 0.0
    current_memory_exponent_delta: 0.0
    minimum_concrete_net_gain_bits: 1.0
    minimum_collision_surplus_factor: 2.0
    asymptotic_gate: 'fully amortized max(preprocessing/T, online cascade, verification) exponent < tau_plain_multi'
    pareto_rows:
      time: Preprocessing, sorting, lookup, cache access, online joins, retries, and verification are charged.
      memory: All partial-error and projection-image tables count at peak occupancy.
      data: Available targets, transcripts, and opened views are explicit and capped.
      preprocessing: Generic public-code and hypercube-specific work are separated and amortized only over shared targets.
      oracle: No secret-view, error, or decoding oracle; source-permitted target access only.
      verification: Every collision fibre and final error candidate is checked.
    frontier_check: >-
      All six rows are compared against matched generic multi-target ISD. A
      hypercube-specific online gain dominated by table memory, unavailable
      targets, or generic reusable preprocessing is rejected.
