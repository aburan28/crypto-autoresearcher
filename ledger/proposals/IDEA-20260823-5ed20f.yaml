    "title": "Generic-pole degree obstruction for uniform Lattes Cauchy accumulators",
    "class": "mechanism",
    "claim": "Fix m >= 2 and primes p, ell with p not dividing m*ell. Let D=ord_ell(m) be even, n=D/2, H=<m>, and let phi=L_m in F_p(X) be the separable Lattes map induced by [m], of degree d=m^2. For C transcendental, S_(n,C)(X)=sum_(j=0)^(n-1) 1/(C-phi^j(X)) has reduced denominator X-degree M_n=sum_(j=0)^(n-1)d^j. Consequently every fan-in-two scalar arithmetic circuit over F_p(C), with input X, X-independent constants, and gates +,-,*,/, that computes S_(n,C) identically as a global rational function has at least ceil(log_2 M_n)=Omega(D) gates. The same conclusion applies to an individual c only after all listed good-specialization conditions are separately proved.",
