idea:
  id: IDEA-20260901-1ddfd4
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-09-01'
  status: proposed
  proposed_by: idea-generator

  title: >-
    THE BALL MEET-IN-THE-MIDDLE COST EXPONENT IS a_g TIMES b_g OVER 2, WITH
    b_g = 1 + g(g+1)/2 FORCED COMBINATORIALLY BY THE COUNT OF MAXIMAL ISOTROPIC
    SUBGROUPS. The g = 1 slice reproduces p^{1/3} exactly, so the entire
    dimensional-ascent family reduces to one measurable number a_2, and the
    corpus's own highest-priority open avenue is decided by a toy-scale
    enumeration rather than by reading a paper about principal ideals

  class: mechanism

  claim: >-
    (A) THE LOWER BOUND, RIGOROUS WITHIN THE FAMILY. Fix a dimension g and let
    A be a superspecial principally polarised abelian variety over F_{p^2} of
    dimension g. Define the family of BALL MEET-IN-THE-MIDDLE algorithms: build
    two lists of smooth polarised isogenies out of A and out of A^{(p)}, of level
    at most X_1 and X_2 respectively, key them by codomain, and look for a
    collision. Let D_g be the smallest level of a polarised isogeny A -> A^{(p)},
    and let N_g(X) be the number of distinct codomains reachable at level at most
    X. Correctness of the split requires X_1 X_2 >= D_g up to the smoothness
    slack. The cost is N_g(X_1) + N_g(X_2), and if N_g(X) = X^{b_g + o(1)} then by
    AM-GM
        COST >= 2 (X_1 X_2)^{b_g/2} >= 2 D_g^{b_g/2},
    with equality at the balanced split. Writing D_g = p^{a_g + o(1)},
        COST EXPONENT E(g) = a_g b_g / 2.
    This is an inequality, not a heuristic: the only inputs are the ball-count
    exponent and the minimal-level exponent.

    (B) b_g IS FORCED AND IS NOT A MEASURED PARAMETER. The number of maximal
    isotropic subgroups of A[ell] isomorphic to (Z/ell)^g is
    prod_{i=1}^{g} (ell^i + 1) = ell^{g(g+1)/2 + o(1)}, so the number of
    polarised isogenies out of A of level exactly x is x^{g(g+1)/2 + o(1)} and
    the number of level at most x is x^{1 + g(g+1)/2 + o(1)}. Hence
        b_g = 1 + g(g+1)/2,
    giving b_1 = 2, b_2 = 4, b_3 = 7. THE g = 1 VALUE IS CHECKABLE AGAINST THE
    FROZEN SOURCE: Lemma 3.2 (READ) gives table size Psi(X,B) X (log X + 2),
    which is X^{2+o(1)}, and b_1 = 2. The identity E(1) = (1/3)(2)/2 = 1/3
    reproduces Theorem 1.1 exactly, and the same law at a_1 = 1/2 (a uniformly
    random target rather than the conjugate) gives E = 1/2, reproducing
    Delfs-Galbraith. Two independent baseline reproductions from one formula.

    (C) THE PREDICTION, PRE-REGISTERED AND ABLE TO FAIL. Because b_g grows
    quadratically in g while there is no reason for a_g to fall like 1/b_g,
    dimensional ascent inside this family is predicted to LOSE, and to lose
    decisively rather than marginally. Quantitatively: covering the roughly
    p^{g(g+1)/2} superspecial vertices with a level-X ball requires
    X^{b_g} ~ p^{g(g+1)/2}, so a GENERIC target sits at level exponent
    g(g+1)/2 / b_g, which is 1/2 for g = 1 and 3/4 for g = 2. The conjugate
    target is special: at g = 1 the true value 1/3 beats the generic 1/2 by a
    factor p^{1/6}. The pre-registered prediction is a_2 >= 0.45, hence
    E(2) = 2 a_2 >= 0.90, i.e. dimension two is worse than p^{1/3} by more than
    p^{1/2}. THE PREDICTION FAILS, AND THE LANE OPENS, IF a_2 < 1/6.

    (D) WHAT THIS IS NOT. NO POLYNOMIAL-TIME OR SUB-p^{1/3} ALGORITHM IS CLAIMED
    OR IMPLIED. The expected deliverable is a closure at the standard of
    docs/inventor-protocol.md section 4 -- a named obstruction (b_g grows
    quadratically), an argument (the AM-GM bound with a combinatorial b_g), and
    forward guidance (the only escape is a_g b_g < 2/3) -- carrying a MEASURED
    obstruction block rather than prose.

  mechanism: >-
    TRACKED OBJECT. The pair (level of the minimal polarised isogeny A -> A^{(p)},
    ball count at level X) for superspecial principally polarised abelian
    varieties, followed as the dimension g varies. The instance axis is the
    dimension, and the observable is a two-component exponent vector (a_g, b_g).

    WHY THE OBJECT IS THE RIGHT ONE. The corpus's own record of the barrier
    (coordination/goals/GOAL-SSI-001/batches/BATCH-046/tasks/TASK-20260804-55952a/
    mechanism_analysis.md, READ) states the p^{1/3} barrier as a rank-3 Minkowski
    fact and names dimensional ascent as the only open avenue, but the ascent it
    names goes through the PRINCIPAL IDEAL PROBLEM in M_g(O) and is blocked by a
    circularity worry (the algorithm may need O as input). The ascent proposed
    here goes through the SEARCH GEOMETRY instead and has no circularity at all,
    because the object returned is an explicit composition of small polarised
    isogenies. That makes it a genuinely different route to the same question,
    and it is decidable by counting rather than by reading.

    THE DESCENT IS NOT CIRCULAR, AND THIS IS THE STRUCTURAL POINT. For A = E^g
    with the product polarisation, End(A) = M_g(End(E)) and Hom(A, A^{(p)}) =
    M_g(Hom(E, E^{(p)})). Frobenius acts diagonally, so composing a found isogeny
    M with the Frobenius isogeny yields a matrix whose (i,j) entry is
    phi_Frob composed with M_{ij}, an element of End(E). Any entry outside Z is
    already a solution to OneEnd for E, obtained WITHOUT knowing End(E) at any
    point. Nothing here needs the endomorphism ring as input, which is exactly
    the obstruction that stops IDEA-SSI-EXP-002.

    LOSSY-PROJECTION TEST (algebraic, zero compute). The projection A -> (level of
    minimal conjugate isogeny) discards the isogeny, the kernel, the polarisation
    type and the variety itself, retaining one integer. It is lossy: the fibre
    over a given level has size at least p^{g(g+1)/2} times the sublevel
    probability, which is superpolynomial. It is compatible with the operation the
    algorithm applies -- composition of polarised isogenies -- because levels
    multiply under composition, so the retained integer propagates
    deterministically along a chain: level(psi_2 psi_1) = level(psi_2) level(psi_1)
    for coprime levels. It is not a change of coordinates because the level does
    not determine the codomain, and the number of codomains at a fixed level is
    exactly what b_g counts.

