  assumptions:
    - Superspecial principally polarised abelian varieties of dimension g form a
      connected graph under (ell,...,ell)-isogenies for small ell, so a ball is
      well defined and a walk mixes.
    - Levels multiply under composition of coprime-level polarised isogenies.
    - Codomain equality is decidable in polynomial time in dimension g at the
      scales tested, via the machinery of reference [41] of the frozen source.

  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: Morita and principal-ideal ascent (the
      corpus's IDEA-SSI-EXP-002), Delfs-Galbraith subfield descent,
      orientation and class-group vectorisation, torsion-image and Kani-style
      embeddings that consume published torsion, CSIDH hidden shift, and the
      g = 1 smooth-ball table read as an attack rather than as a slice.
    tracked_object: >-
      The exponent pair (a_g, b_g) attached to a dimension g, where a_g is the
      minimal-level exponent of a polarised isogeny to the Frobenius conjugate
      and b_g is the ball-count exponent.
    newness_score: >-
      Genuinely new in this corpus. The only cross-dimensional record is about
      principal ideals; no record has ever written a cost law that varies with
      dimension, and no record contains b_g.
    testability_score: >-
      High for b_g, which is combinatorial and checkable symbolically at g = 1
      against Lemma 3.2. Medium for a_2, which needs an enumeration of
      superspecial abelian surfaces at toy primes.
    survival_score: >-
      The object survives to any g at which the graph is connected and codomain
      equality is decidable, which the cited framework provides at g = 2 and
      plausibly g = 3. It dissolves when the polarisation type is no longer
      principal, and that boundary is stated rather than crossed.

  proof_search_map:
    bottleneck: >-
      The cost of a ball meet-in-the-middle is the number of codomains it
      enumerates, and the correctness condition ties the product of the two
      radii to the minimal conjugate level. Removing the quadratic growth of the
      codomain count in the dimension is the only step whose removal would make
      ascent profitable.
    baseline_embedding:
      parameter_slice: >-
        g = 1 with a_1 = 1/3 and b_1 = 2 gives E(1) = 1/3, which is Theorem 1.1;
        g = 1 with a random target, a_1 = 1/2, gives E = 1/2, which is
        Delfs-Galbraith. Both are exact parameter slices of one formula, not
        curves that look similar.
      reproduction_check: >-
        Symbolic for b_1 = 2 against Lemma 3.2 of the frozen source. Frozen
        fixture for E(1) = 1/3 against Theorem 1.1 and for E = 1/2 against
        reference [21]. Any implementation that fails either check is rejected
        before a_2 is quoted.
    observation_collision:
      observable: >-
        The exponent pair (a_g, b_g), and downstream the single number E(g).
      distinct_preimage_search: >-
        Two distinct (a, b) pairs with the same product, for instance
        (1/3, 2) and (1/6, 4), give the same E. THIS COLLISION IS REAL AND IS THE
        POINT OF THE MEASUREMENT: it is exactly the pair the g = 2 arm must
        distinguish, because a_2 = 1/6 with b_2 = 4 would tie dimension 2 with
        dimension 1. The measurement therefore reports a and b SEPARATELY and
        never reports E alone, so that the fibre is not collapsed by the record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the OneEnd instance for E to a OneEnd instance for A = E^g, where
          the hypothesis becomes an exact statement about the minimum of a
          degree-2g reduced-norm form on a rank-4g^2 lattice rather than a
          quadratic form on a rank-3 lattice.
        predicted_gain: >-
          Predicted NEGATIVE. Encoding is free, completeness holds by the
          diagonal Frobenius argument, soundness requires a non-scalar entry, and
          the cost loss is the factor b_g/b_1 in the exponent. The transform is
          selected precisely because its prerequisites are present and its
          predicted gain is negative, which makes it a falsification aid.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the pair (a_g, b_g) rather than the single number E(g) through
          the analysis, since the pair is what survives a change of dimension.
        predicted_gain: >-
          Prevents the observation collision above from silently deciding the
          question.
    quantifier_order: >-
      for all g >= 1, for all sufficiently large p, for all superspecial
      principally polarised A of dimension g over F_{p^2}, every ball
      meet-in-the-middle algorithm as defined in (A) costs at least
      2 D_g(A)^{b_g/2}. Note the order: the bound is per-instance in A and the
      exponent a_g is then a statement about the DISTRIBUTION of D_g over A, so
      the two quantifiers must not be merged. A claim that quantified a_g before
      A would be asserting a worst-case bound the counting argument does not give.
    method_ceiling:
      strongest_certifiable_claim: >-
        A lower bound on the cost of ball meet-in-the-middle algorithms in
        dimension g, plus a measured value of a_2 with error bars at toy scale.
        The method cannot certify anything about algorithms outside the family --
        in particular it says nothing about principal-ideal ascent, about
        orientation methods, or about anything that does not enumerate codomains.
      nearby_object_control: >-
        Apply the identical formula to the pair (g = 1, random target), where the
        desired conclusion sub-p^{1/3} is KNOWN FALSE at polynomial memory, and
        confirm it returns 1/2 rather than something smaller. If the formula ever
        returns an exponent below 1/2 for a random target at g = 1, it proves too
        much and is wrong.
    proof_obligations:
      - claim: b_g = 1 + g(g+1)/2 from the maximal isotropic subgroup count.
        responsibility: size
      - claim: Cost >= 2 D_g^{b_g/2} by AM-GM given X_1 X_2 >= D_g.
        responsibility: runtime
      - claim: The composite of a found polarised isogeny with Frobenius has a non-scalar entry.
        responsibility: correctness
      - claim: >-
          For even 2g the Frobenius composite has square inseparable degree, so
          the frozen source's non-scalarity argument does NOT transfer verbatim
          and a replacement argument is required.
        responsibility: correctness
      - claim: E(1) = 1/3 and E(1, random target) = 1/2 are exact slices.
        responsibility: baseline
      - claim: Memory equals the smaller ball, so the memory exponent is E(g) at the balanced split.
        responsibility: memory
      - claim: Scope is superspecial principally polarised varieties over F_{p^2}.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: measured b_2, as the log-log slope of codomain count against level
      direction: higher
      minimum_effect: >-
        Predicted 4.0. A measured value outside [3.7, 4.3] falsifies the
        combinatorial derivation and invalidates the cost law at g = 2
    - metric: measured b_1 at toy primes, as the same slope in dimension 1
      direction: different
      minimum_effect: >-
        Predicted 2.0 within [1.85, 2.15]. This is the calibration arm and must
        pass before any g = 2 number is quoted
    - metric: measured a_2, the log-log slope of minimal conjugate level against p
      direction: higher
      minimum_effect: >-
        Predicted at least 0.45. The lane OPENS if a_2 < 1/6 with the interval
        excluding 1/6, and the null must simultaneously return the generic value
    - metric: >-
        ratio of the measured minimal conjugate level to the measured minimal
        level to a uniformly random superspecial target, at fixed p
      direction: lower
      minimum_effect: >-
        Predicted a ratio decreasing in p like p^{-(0.75 - a_2)}. At g = 1 the
        corresponding ratio must reproduce p^{-1/6}, which is the calibration of
        the null arm itself
    - metric: fraction of recovered dimension-2 endomorphisms with a non-scalar entry
      direction: higher
      minimum_effect: >-
        Predicted at least 0.9. If it is near zero the descent obligation fails
        and the whole route is dead for a reason unrelated to the exponent, which
        is itself the useful result

  minimal_test:
    design: >-
      Stage 0, zero compute, half a page. Derive b_g from the isotropic subgroup
      count, verify b_1 = 2 symbolically against Lemma 3.2 of the frozen source,
      and verify E(1) = 1/3 and E(1, random target) = 1/2. If either fails, stop
      and file that as the result. Stage 1, dimension 1 calibration. At three toy
      prime bands, enumerate the smooth-degree ball from random supersingular
      curves and fit b_1; enumerate the exact minimal conjugate degree and fit
      a_1 against p. Both must reproduce their known values. Stage 2, dimension 2.
      At the largest toy primes for which the superspecial abelian surface graph
      is enumerable, build the (2,2)-isogeny graph, fit b_2 by the same estimator,
      compute the minimal level of a polarised isogeny A -> A^{(p)} by
      breadth-first search for a sample of A, and fit a_2 against p across at
      least three prime bands. Stage 3, descent check. For the surfaces where a
      conjugate isogeny is found, compose with Frobenius and record whether the
      resulting matrix has an entry outside Z.
    controls:
      - >-
        NULL OBJECT, random target. Replace A^{(p)} by a uniformly random
        superspecial p.p.a.v. of the same dimension and re-run the identical
        minimal-level measurement. The measured exponent must RISE to the generic
        covering value (1/2 at g = 1, predicted 3/4 at g = 2). If the conjugate
        and random arms return the same exponent, there is no conjugate
        specialness at that dimension and the whole family is uninteresting there
        -- a controlled null, not a finding.
      - >-
        NULL OBJECT TWO, random regular graph. Run the ball-count estimator on a
        random regular graph with the same degree and order. The fitted b must
        come out at 1 (ball size proportional to radius in the single-degree
        sense) rather than at the polarised value, confirming the estimator is
        measuring the isotropic-subgroup multiplicity and not an artefact of the
        fitting window.
      - >-
        CALIBRATION ARM, dimension 1. Everything at g = 1 must reproduce the
        published exponents before g = 2 is reported.
      - >-
        SATURATION GUARD. Report, at every band, the fraction of the vertex set
        covered by the largest ball used. Bands where the ball covers more than
        10 percent of the graph are discarded, because there the fitted exponent
        is measuring saturation rather than geometry.
    required_metrics:
      - fitted b_1 and b_2 with confidence intervals and the fitting window
      - fitted a_1 and a_2 with confidence intervals, per arm (conjugate, random)
      - exact vertex counts of both graphs at every band
      - fraction of the graph covered by each ball, per band
      - fraction of recovered surface endomorphisms with a non-scalar entry
      - wall clock and memory per band, so the feasibility ceiling is recorded

  falsification_conditions:
    - >-
      Measured b_2 outside [3.7, 4.3] falsifies the combinatorial derivation. The
      cost law is then not established at g = 2 and this record is superseded
      rather than repaired.
    - >-
      Measured a_1 not equal to 1/3 within interval, or measured b_1 not equal to
      2 within interval, invalidates the instrument and blocks every g = 2
      reading.
    - >-
      The random-target null returns the SAME exponent as the conjugate arm at
      g = 1. That would contradict the known p^{1/3} versus p^{1/2} gap and means
      the measurement is broken.
    - >-
      Measured a_2 < 1/6 with the interval excluding 1/6, nulls clean. The
      prediction fails, dimension 2 is competitive or better, and under AGENTS.md
      rule 12 the consequence goes to independent review-breakthrough at max
      effort before anything is quoted.
    - >-
      The descent check finds no non-scalar entries. The route is dead for a
      correctness reason and the record says so, independently of the exponent.

  confounders:
    - >-
      The superspecial abelian surface graph has roughly p^3 vertices, so toy
      primes for g = 2 are very small and the asymptotic regime may not be
      reached. This is the dominant confounder and the saturation guard exists
      for it; if no band clears the guard, the honest outcome is that a_2 is not
      measurable at feasible scale and the record downgrades to the zero-compute
      part only.
    - >-
      Products E x E' are a positive-measure subset of superspecial surfaces and
      behave differently from Jacobians. Every fitted exponent must be reported
      separately for the product locus and its complement.
    - >-
      Level and degree differ by the exponent g, and mixing the two silently
      would move a_2 by a factor of 2. The metric definition fixes level, and the
      run record must state which is reported at every point.
    - >-
      Codomain equality in dimension 2 is decided up to isomorphism of
      principally polarised varieties, which is a stricter and more expensive
      test than equality of j-invariants; a wrong equality test inflates b_2.

  interpretation_limits:
    - >-
      The lower bound applies ONLY to ball meet-in-the-middle algorithms as
      defined in (A). It is not a lower bound on the isogeny problem, and it must
      never be quoted as one. In particular it says nothing about
      IDEA-SSI-EXP-002 or about any principal-ideal method.
    - >-
      a_g is a statement about a distribution, not about any individual A. The
      quantifier order in the proof search map is binding on every later
      quotation.
    - >-
      Toy-scale g = 2 measurements are hypothesis-generating only; H2 states the
      transfer assumption and does not discharge it.
    - >-
      No polynomial-time or sub-p^{1/3} algorithm is claimed, and the expected
      deliverable is a closure with a measured obstruction.
    - >-
      Academic and defensive analysis only, per RQ-SSI-001 constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For fixed g and small ell, the number of distinct superspecial
        principally polarised codomains reachable from A by a smooth polarised
        isogeny of level at most X is X^{b_g + o(1)} with b_g = 1 + g(g+1)/2,
        uniformly for X^{b_g} at most a fixed small fraction of the vertex count.
      rigorous_support: >-
        Rigorous side: the count of maximal isotropic subgroups of A[ell] is
        prod_{i=1}^{g}(ell^i + 1), which bounds the number of isogenies of each
        level from above and below up to constants, and the g = 1 case is
        Lemma 3.2 of the frozen source (READ), proved there. Classical side: the
        assumption imitates the statement that distinct isogenies of a common
        domain have distinct codomains, which at g = 1 is FORCED below the
        minimal non-scalar endomorphism degree and is derived as such in the
        sibling record IDEA-20260901-2fc431.
      validation_plan: >-
        Sample. Enumerate the ball directly at three toy prime bands in each
        dimension and count distinct codomains at each level. Scale. g = 1 at
        primes near 10^3, 10^4, 10^5; g = 2 at the three largest primes whose
        surface graph fits the saturation guard, reported explicitly with vertex
        counts. Comparison. Fit the log-log slope against the predicted b_g and
        report the interval, not a visual match. Tail check. At the largest level
        in the window, compare the observed number of distinct codomains against
        the predicted X^{b_g}, and separately report the collision rate, which
        must be near zero inside the window and must rise as the guard is
        approached. Transfer. The fitted slope is a toy-scale quantity; the
        combinatorial derivation is what carries it to crypto scale, and if the
        two disagree the derivation is what is wrong.
    - id: H2
      statement: >-
        For fixed g, the minimal level of a polarised isogeny A -> A^{(p)} over
        uniformly random superspecial A satisfies
        Pr[level <= Y] = Y^{kappa_g} p^{-lambda_g + o(1)} in a stated range, with
        the typical value p^{a_g}, a_g = lambda_g / kappa_g.
      rigorous_support: >-
        At g = 1 this is exactly the law used by IDEA-20260805-062bee and derived
        in IDEA-20260901-65c009 with (kappa, lambda) = (3/2, 1/2), and it is
        anchored by the rigorous bound Theorem 1.5 of the frozen source. At
        g >= 2 there is NO analogue of Theorem 1.5 known to this session, and the
        assumption is offered as a shape with two free exponents to be measured,
        not as a value.
      validation_plan: >-
        Sample. Exhaustive breadth-first search for the minimal conjugate level
        over all vertices at the smallest band and over a uniform sample at
        larger bands. Scale. Three bands per dimension, with exact vertex counts
        recorded. Comparison. Fit kappa_g and lambda_g separately by regressing
        the empirical sublevel CDF on level and on p, and report a_g as their
        ratio WITH a propagated interval rather than as a point. Tail check. The
        smallest observed level across all samples must be consistent with the
        fitted sublevel probability at that value, which is the same tail
        consistency check the frozen source performs in Section 4.2. Transfer.
        Whether a Theorem 1.5 analogue exists at g = 2 is a literature question
        this session cannot answer and is logged as an ingredient to scout.
    - id: H3
      statement: >-
        For all but a vanishing fraction of superspecial A of dimension g, the
        composition of the Frobenius isogeny with a nonzero polarised isogeny
        A -> A^{(p)} has at least one matrix entry outside Z when A is a power of
        an elliptic curve, and more generally yields a non-scalar endomorphism.
      rigorous_support: >-
        At g = 1 this is rigorous and is the frozen source's own final paragraph:
        the composite has inseparable degree p, which is not a square, so it is
        not a scalar. At g = 2 the inseparable degree is p^2, which IS a square,
        so THAT ARGUMENT DOES NOT TRANSFER and a replacement is required. This is
        recorded as a proof obligation, not as a discharged step.
      validation_plan: >-
        Direct. For every conjugate isogeny found at toy scale in dimension 2,
        compute the composite, express it in a basis, and record whether any
        entry lies outside Z. Report the empirical fraction. If the fraction is
        not near 1, characterise the failures, because a systematic failure would
        be a genuine structural fact about even dimension and is worth a record
        of its own.

  target_complexity:
    time_exponent: >-
      p^{a_g b_g / 2 + o(1)} for the ball meet-in-the-middle family in dimension
      g, with b_g = 1 + g(g+1)/2. At g = 1 with a_1 = 1/3 this is p^{1/3+o(1)},
      the incumbent. The pre-registered prediction at g = 2 is a_2 >= 0.45, hence
      at least p^{0.90+o(1)}, i.e. WORSE by more than p^{1/2}.
    memory_exponent: >-
      Equal to the time exponent at the balanced split, since the memory is the
      stored ball. An asymmetric split streams one side and gives time times
      memory equal to p^{a_g b_g}, which is dominated by van Oorschot-Wiener
      below the balanced point and is therefore not claimed as a tradeoff win.
    best_known: >-
      p^{1/3+o(1)} time and memory (frozen source Theorem 1.1, conditional on its
      Heuristic 1); p^{1/2}(log p)^{O(1)} time at polynomial memory
      (Delfs-Galbraith, reference [21]).
    hidden_overhead: >-
      The smoothness factor rho^{-1} = p^{o(1)} is inherited unchanged in every
      dimension. In dimension g >= 2 an additional and possibly much larger
      overhead is hidden in the cost of a single polarised isogeny step and in
      the cost of deciding codomain isomorphism, both of which are polynomial in
      log p but with constants far worse than a modular-polynomial root find.
      Nothing here claims those constants are small, and the minimal test
      measures them as wall clock per step.
    tradeoff_note: >-
      Each dimension's ball stage is a claw search of size p^{E(g)}, so van
      Oorschot-Wiener gives time N^{3/2}/w^{1/2} at memory w within each
      dimension, exactly as at g = 1. Parallelisation is perfect in every
      dimension. Because E(g) is predicted to increase with g, the tradeoff
      curves are predicted to be nested with g = 1 innermost, which is itself a
      falsifiable statement about the family.

  estimated_cost:
    implementation: high
    compute: medium
    detail: >-
      Stage 0 is zero compute. Stage 1 reuses the existing dimension-1 graph
      tooling. Stage 2 is the expensive part and needs a working superspecial
      abelian surface enumerator with (2,2)-isogeny steps and an isomorphism
      test, which is the single largest implementation risk in this record; the
      framework of reference [41] of the frozen source is the intended basis.
      Budget the surface arm as days, not hours, and treat the saturation guard
      as a hard stopping rule so the arm terminates with a stated ceiling rather
      than with an exhausted budget.

  deduplication:
    closest_existing:
      - id: IDEA-SSI-EXP-002 (recorded in the BATCH-046 exponent_proposals.yaml artifact, not a ledger proposal)
        difference: >-
          EXP-002 ascends through the PRINCIPAL IDEAL PROBLEM in M_g(O) and is
          blocked by circularity, since the algorithm may need the endomorphism
          ring as input. This record ascends through the SEARCH GEOMETRY, needs
          no ring as input at any step, and returns an explicit composition of
          small isogenies. The two share only the word dimension. This record
          also predicts the ascent LOSES and says by how much, which EXP-002
          does not.
      - id: IDEA-20260807-6cdff2
        difference: >-
          6cdff2 proposes reading KN-LIT-7641 to adjudicate the EXP-002
          circularity. That is a literature action on the principal-ideal route.
          This record makes the dimensional question decidable by counting,
          independently of how that reading turns out.
      - id: IDEA-20260805-062bee
        difference: >-
          062bee measures the g = 1 distribution law and reads the exponent off
          it. This record generalises the SHAPE across dimensions and adds the
          second exponent b_g, which 062bee does not contain and which is the
          whole reason ascent is predicted to fail. At g = 1 the two agree by
          construction, and that agreement is this record's calibration arm.
      - id: IDEA-20260806-a3ef00
        difference: >-
          a3ef00 decomposes EndRing information along the local-global axis on
          the Gross lattice (genus, spinor, global). That is an information
          decomposition of a fixed object at g = 1. This record varies the
          dimension of the object and prices the search, and shares neither the
          axis nor the invariants.
      - id: IDEA-20260808-40aab9
        difference: >-
          40aab9 asks when the Kani higher-dimensional embedding reaches
          prime-field ORDINARY ECDLP, and answers only in the MOV-degenerate
          case. It is about embedding a KNOWN isogeny given published torsion.
          This record uses higher dimension as a search space for an UNKNOWN
          isogeny with no torsion published, which is the setting RQ-SSI-001
          declares as the surviving one.
      - id: IDEA-20260829-bb6e9b
        difference: >-
          bb6e9b analyses the g = 1 claw structure under Frobenius conjugation
          and its memory frontier. This record leaves g = 1 alone and varies g.
          At g = 1 bb6e9b's frontier is the tradeoff_note of this record, which
          is a dependency rather than an overlap.
    not_a_restatement_of: >-
      Not a restatement of the twelve BATCH-046 closures, all of which are
      statements at g = 1 about finding short objects in a rank-3 lattice. The
      obstruction named here is combinatorial rather than lattice-geometric and
      lives in a parameter (the dimension) that none of those closures varies.

  dominated_by: >-
    Wesolowski 2026, p^{1/3+o(1)} time and memory, dominates this record at every
    dimension the record predicts, since E(g) is predicted to increase in g and
    E(1) is the incumbent itself. Checked against every frontier row known to
    this program: (i) p^{1/3+o(1)} time and memory -- E(2) predicted 0.90,
    strictly worse; (ii) Delfs-Galbraith p^{1/2}(log p)^{O(1)} time at polynomial
    memory -- worse on both axes at g = 2 under the prediction; (iii) van
    Oorschot-Wiener p^{1/2+o(1)}/w^{1/2} at memory w -- not beaten at any w by
    any g >= 2 instantiation under the prediction. No data or query axis applies.
    dominated_by is therefore NOT null and the record claims no improvement.
  sota_delta: >-
    +0, and expected to be negative by a stated amount. Quantitatively the
    predicted exponent gap is E(2) - E(1) = 2 a_2 - 1/3 >= 0.90 - 0.33 = 0.57 in
    the exponent of p, i.e. dimension two is predicted to cost about p^{0.57}
    times more than dimension one. The deliverable is that number with error
    bars plus the cost law that produced it. The conditional upside, stated so it
    can be tested rather than hoped for, is that any dimension with
    a_g b_g < 2/3 would beat p^{1/3}, which at g = 2 means a_2 < 1/6.

  recommended_priority: medium
