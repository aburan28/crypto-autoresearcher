  id: IDEA-20261017-fd3924
  question_id: RQ-FROB-7d8dd4
  goal_id: GOAL-FROB-6333a9
  added: '2026-10-17'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Is the normal-basis window V_nb as cheap per decomposition attempt as V_poly? Paired WDSat conflicts and closure degree D_W on certified UNSAT toy Koblitz systems
  class: measurement
  claim: >-
    On toy Koblitz curves y^2+xy=x^3+ax^2+1 over F_2^n (n in 11,13,17,19,23; m in 2,3; k in k0,k0+1; k0=ceil(n/m)) the descended S_(m+1) system over V_nb (span of k consecutive conjugates of a normal element) costs the same per attempt as over V_poly = deg<k: median paired WDSat UNSAT-conflict ratio R = nb/poly in [0.7,1.4], and equal minimal refuting closure degree D_W, in at least 90% of cells. The exploratory tau pilot measured the other half (orbit shrink g = 1.9-2.0 at birthday-matched yield: 0.6-0.8 bit net of V_poly's own 0.2). This prices the solver half: B_net = log2(g_nb/g_poly) - log2(R).
  mechanism: >-
    OBJECT FRAME. R1: V_nb is a window of k consecutive coordinates in a normal basis. Sigma = <tau,-1> on the factor base (tau = cyclic coordinate shift). Class: partial-action (a relation maps to its conjugate inside V only if all summands stay in the window: about 1.67 of n at m=2). Lossy-projection test: the tracked object is the <tau,-1>-orbit of a factor-base point; it discards the shift j (a block system of <Sigma>, IDEA-20260901-863e36), is lossy (about 2-to-1: V_nb and tau V_nb share k-1 dimensions) and propagates deterministically. Canonicalisation: at most n cyclic shifts. Priced number: R. Arms V_poly, V_nb, V_rand separate three explanations. E1: cost depends on (n,m,k) only, all R near 1. E2: cost follows the product space V.V (dim 2k-1 for poly, near n generic), so R(nb) near R(rand), not 1. E3: window or sparse-tensor structure matters, so R(nb) differs from R(rand). A basis change alone is a ring automorphism (Prop. B), so differences belong to the set V. KN-OPEN-020: scoped-out linear base, no escape claimed.
  novelty_status: unverified
  proof_search_map:
    not_applicable_reason: >-
      Measurement of a constant factor; no theorem or exponent claimed.
  predictions:
    - metric: R, median paired conflicts(V_nb)/conflicts(V_poly), WDSat -b and XG-ext
      direction: different
      minimum_effect: "R in [0.7,1.4] in 90% of 20 cells; outside refutes E1"
    - metric: D_W and columns at D_W, nb vs poly, same targets
      direction: different
      minimum_effect: "D_W equal in 90% of cells (4 at m=3, handoff figure); columns ratio in [0.5,2]"
    - metric: abs(log2 R(nb) - log2 R(rand))
      direction: lower
      minimum_effect: "below 0.5 bit separates E3 from E2"
    - metric: B_net bits on the same instances
      direction: higher
      minimum_effect: "mean 0.5-0.9 at R near 1; at most 0 if R is 2 or more"
  minimal_test:
    design: >-
      Per (n,m,k) cell (20): targets in the order-r subgroup until 20 are certified UNSAT for every arm by two independent enumerators; same x_R across arms. Arms: V_poly; V_nb with 3 random normal elements (plus an optimal normal basis at n=11,23); V_rand. Descended ANF via analysis/frobenius-orbit-union/emit_anf.py; sha-bound vendored WDSat (-b, and XG-ext): conflicts. CERTBIN mutant closure W_D (D=3,4,5): D_W, columns. Recompute pilot orbits, g, usable conjugates on the same V.
    controls:
      - "N0: V_poly re-encoded in a random field basis; R must be 1 in closure (noise floor in WDSat)"
      - "V_rand: size-matched random k-dim F_2-subspace"
      - "Planted decomposable targets must be found by every arm"
    required_metrics: [R, D_W, columns, B_net, g]
  falsification_conditions:
    - "R above 2 in half the cells, both modes: the V_nb bit is cancelled; V_orb (log2 n bits, non-subspace, KN-FIND-47da4e) is the only Frobenius lever"
    - "D_W differs by 1 or more on over 10% of cells: V_nb is not free"
    - "N0 spread above 1.4: inconclusive, not support"
    - "g_nb outside [1.6,2.4]: pilot input not reproduced"
  confounders:
    - "FB size differs by the Tr(1/x) and halving split; pair by target, record |FB|"
    - "Dense random normal element versus sparse optimal normal basis"
  interpretation_limits:
    - "UNSAT only; SAT cost and cost per relation not measured; toy n up to 23; conflicts are a search property, not a degree"
    - "W_4 is saturated and cannot rank systems (KN-FIND-c3a917); read D_W, columns, W_3"
  heuristic_assumptions:
    - id: H1
      statement: "UNSAT cost depends on (n,m,k) and the shape of V, not the basis: conflicts = c * 2^(mk) / |G|, c in [0.9,1.0] for every V."
      rigorous_support: "Prop. B (IDEA-20260926-917981) and the exhaustive-core law (IDEA-20260915-0d8e90): uniform visit of all 2^(mk) leaves."
      validation_plan: "Fit c per arm on 20 cells x 20 targets, both modes; compare c(nb), c(rand), c(poly); worst target per cell."
    - id: H2
      statement: "As k grows g_nb tends to 2 and usable conjugates per relation to 1+2/(2^m-1): 1.667 at m=2, 1.286 at m=3."
      rigorous_support: "For uniform coordinates the end zero-runs are geometric(1/2): E[1/shifts] = 1/2, E[min run] = 1/(2^m-1) (notes)."
      validation_plan: "Field-only sampling, 10^6 elements of V_nb at n in 31,61,127,131,163, m in 2,3, against 2 and the formula."
    - id: H3
      statement: "Decomposition yield of V_nb at matched |FB| is birthday (eff = 1 within 0.1 bit)."
      rigorous_support: "Counting: C(|FB|,m)/r decompositions expected."
      validation_plan: "Recompute eff, 12000 targets per cell, Poisson errors."
  target_complexity:
    time_exponent: "unchanged; relation count divided by at most about 2"
    memory_exponent: "unchanged; matrix dimension divided by about 2"
