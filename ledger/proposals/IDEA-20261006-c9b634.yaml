  assumptions:
    - >-
      S0 is the published 4-bit permutation, indexed by the integer 0..15
      with XOR as the difference. A test-vector mismatch means the pin is
      wrong.
    - >-
      A linear structure is a nonzero a such that the map x |-> S(x) XOR
      S(x XOR a) takes exactly one value on all 16 inputs.
    - >-
      The identity control uses the same 15 nonzero differences and the
      same XOR. Its count is 15 because (x XOR a) XOR x = a.
  proof_search_map:
