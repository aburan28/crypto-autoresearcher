  predictions:
    - metric: linear_structure_count_of_S0
      direction: lower
      minimum_effect: >-
        0 on S0, which is 15 below the identity count of 15 on the same
        15 differences.
  minimal_test:
    design: >-
      Pin S0. Reject the run unless one published full-round test vector
      matches. For each of the 15 nonzero nibbles a, evaluate the 16
      derivatives and record whether they are constant. Repeat with the
      identity permutation.
    controls:
      - >-
        Identity permutation on the same 15 differences. Its count is 15.
        A run that does not return 15 on the identity is invalid.
      - >-
        The zero difference, computed separately. It is excluded. Its
        derivative is identically 0 and is not a linear structure in this
        count.
    required_metrics:
      - linear-structure count of pinned S0
      - identity count on the same 15 differences
      - test-vector pass or fail
  falsification_conditions:
    - >-
      The completed linear-structure count of pinned S0 is 1 or greater.
      One such difference is a negative.
    - >-
      The identity control does not return 15. That voids the run. It is
      not evidence about Serpent.
  confounders:
    - >-
      A bit-reversed or integer-reversed indexing of the nibble changes
      which table is measured. The test vector is the pin.
    - >-
      A failed test vector is an infrastructure outcome, not a positive
      linear-structure count.
    - >-
      IDEA-20261005-1cb745 counts active S-boxes after the linear layer on
      480 differences. This record applies that layer 0 times.
  interpretation_limits:
    - >-
      A count of 0 on S0 does not bound S1 through S7, does not give a
      differential probability, and does not reach the 11-round figure
      relayed by KN-LIT-3430 or the 6-round integral figure relayed by
      KN-LIT-2714.
    - >-
      The printed plaintext and time figures in KN-LIT-3430 were not
      checked against the paper.
    - >-
      KR-RHO-fb88e6's factors 1.414 and 1.29 are not applied. Rho
      iterations charged: 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A uniform random permutation of 16 nibbles is the comparison
        measure for the linear-structure count. The Serpent table is one
        fixed published permutation, not a draw from that measure. The
        assumption is only that the uniform measure is the null; it does
        not assert that S0 was sampled from it.
      rigorous_support: >-
        The identity count 15 is algebra: (x XOR a) XOR x = a for every
        x and every nonzero a. No Serpent theorem is used. The uniform
        measure is the counting measure on the symmetric group S_16.
      validation_plan:
        sampling: >-
          Draw 200 independent uniform permutations of {0,1,...,15} by
          Fisher-Yates from a recorded seed. For each draw, count how
          many of the 15 nonzero differences have a constant derivative.
        comparison: >-
          The sample fraction with count 0, and the sample mean count,
          reported beside the single S0 count. No equality is required
          for the S0 claim.
        tail_check: >-
          If 20 or more of the 200 draws have count 15, the sampler is
          not producing ordinary permutations and the null is invalid.
          The identity control is checked separately and must score 15.
        parameters: >-
          Domain size 16, 200 draws, one recorded seed. No transfer to
          the 128-bit cipher, to S1 through S7, or to any round count.
  target_complexity:
    time_exponent: >-
      No attack exponent. The count is 15 times 16 evaluations of one
      4-bit map. Rho iterations charged: 0. Factor-base elements
      charged: 0. Linear-layer applications charged: 0.
    memory_exponent: >-
      One 4-bit table of 16 entries. No memory exponent.
    best_known: >-
      KN-LIT-3430 relays an 11-round differential-linear attack with
      printed figures 2125.3 and 2139.2, not checked here. KN-LIT-2714
      relays an integral attack on Serpent reduced up to 6 rounds.
      KR-RHO-fb88e6 states a square-root-of-2 reduction in expected rho
      iterations, practical gain 1.29. This record improves none of
      those figures.
    hidden_overhead: >-
      The test-vector pin. No o(1) attack term is claimed.
    tradeoff_note: >-
      Data is the 15 differences, exhaustive. Parallelism across
      differences does not change the count. The negation-map term
      1/(2r) is not a term here.
