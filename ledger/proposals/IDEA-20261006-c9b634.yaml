idea:
  id: IDEA-20261006-c9b634
  question_id: RQ-SERP-722a09
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: Linear-structure count of pinned Serpent S0 against the identity nibble map
  class: measurement
  claim: >-
    Pin the published Serpent S-box S0 as a permutation of the 16 nibbles,
    and reject the run unless one published full-round Serpent test vector
    matches before the count. Let a linear structure be a nonzero input
    difference a in F_2^4 such that S(x) XOR S(x XOR a) is independent of x.
    The claim is that S0 has 0 linear structures. The identity permutation
    on the same 16 nibbles has 15. A completed count of 1 or more on S0
    falsifies the claim. The count uses 0 applications of the linear layer
    and is not the 480-image branch count. It is not a distinguisher, not
    a key-recovery attack, and not a statement about any round.
  mechanism: >-
    Two outcomes are separated before the count. A count of 0 means no
    nonzero nibble difference has a constant derivative through S0, so this
    S-box is not affine in any direction. A positive count means at least
    one direction is a linear structure; if the count is 15, the pinned map
    agrees with the identity on this statistic. Key XOR cancels in an XOR
    difference, so whitening does not change the count. LOSSY-PROJECTION
    TEST. The tracked object is the set of nonzero nibble differences whose
    derivative under S0 is constant; the operation set is nibble translation
    x |-> x XOR a together with output XOR by a round-key nibble, not
    elliptic-curve translation. Discarded: the output nibble and the key
    nibble. The constancy bit still propagates because a constant output
    XOR cancels in S(x) XOR S(x XOR a). The projection is lossy because
    every affine permutation, not only one table, yields the full set of
    15 differences, so the set does not recover S0.
  novelty_status: unverified
