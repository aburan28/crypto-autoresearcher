  proof_search_map:
    bottleneck: '"Whether the one-time cost of relation collection can be amortised below
      the multi-target rho baseline."'
    baseline_embedding:
      parameter_slice: '"T = 1 must reproduce the single-target statement of E1-03."'
      reproduction_check: '"Symbolic substitution T = 1 recovers max(C_rel, C_LA) vs sqrt(N)."'
    observation_collision:
      observable: '"amortised cost per target"'
      distinct_preimage_search: Distinct (B, m) with the same amortised cost at sigma = 1
        — an intended collision that shows beta and m sweeps carry no information in this
        regime.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: '"the (tau, sigma, beta, m) admission inequality"'
      predicted_gain: '"replaces an open-ended amortisation argument with one screening test"'
    quantifier_order: FOR ALL T <= N and FOR ALL B, m, IF sigma = 1 THEN amortised index-calculus
      cost exceeds sqrt(T*N). EXISTS (T, sigma, beta, m) satisfying the stated inequality
      IFF amortised index calculus beats the multi-target baseline.
    method_ceiling:
      strongest_certifiable_claim: '"A comparator statement inside a stated cost model; never
        a lower bound on ECDLP."'
      nearby_object_control: Extension fields, where sigma is effectively 0 and the same inequality
        predicts that amortisation does help — matching the published behaviour of Gaudry-Diem,
        which is the control that the inequality is not vacuously negative.
    proof_obligations:
    - claim: '"shared cost is m!*N at sigma = 1, independent of B and m"'
      responsibility: runtime
    - claim: '"multi-target baseline is sqrt(T*N) with memory charged"'
      responsibility: baseline
    - claim: '"the admission inequality in (tau, sigma, beta, m)"'
      responsibility: strictness
