idea:
  id: IDEA-20260805-59fa23
  question_id: RQ-FAEST-001
  added: '2026-08-05'
  title: >-
    The matched AES baseline every FAEST record uses is an inadmissible
    baseline: charge the FAEST forger's actual data budget (one
    plaintext-ciphertext pair) and count the OWF preimages, before any
    forgery cost is compared to 2^126.1
  class: control

  claim: >-
    Every FAEST record this program has written (IDEA-20260731-002,
    IDEA-20260731-003, IDEA-20260731-004, IDEA-20260731-005, and the
    BATCH-001 checkpoint in ledger/goals/GOAL-FAEST-001.yaml) compares a
    prospective forgery cost against a "matched AES-128 key-recovery
    baseline of 2^126.1" taken from KN-LIT-2701. That comparison is
    inadmissible in two independent, separately checkable ways, and BOTH
    corrections are derivable before any experiment.
    (1) ADVERSARY-MODEL MISMATCH. A FAEST-128 public key is
    (owf_input, owf_output) with owf_input_size = owf_output_size = 16
    bytes and BETA = 1, i.e. EXACTLY ONE (plaintext, ciphertext) block pair
    under the secret AES-128 key, with the input fixed per key pair and
    hashed into mu (VERIFIED THIS SESSION from faest-ref source; see
    verified_parameters). The FAEST forger therefore has a data budget of
    one known pair, no chosen-plaintext access, and no related keys. The
    2^126.1 biclique figure is a full-AES-128 key-recovery cost under a
    chosen/known-plaintext data budget that this program has NOT read and
    that KN-LIT-2701's own relayed abstract describes only as "a very small
    part of the codebook" -- a phrase about a FRACTION of 2^128, not about
    a number of pairs. Until that data figure is read from the real paper,
    2^126.1 is a cost for an attacker FAEST does not give the adversary.
    (2) PREIMAGE MULTIPLICITY, UNCOUNTED. FAEST's soundness needs a witness
    satisfying the OWF relation, not the signer's specific key. The
    expected number of keys consistent with the public key is
    1 + (2^{kappa} - 1) * 2^{-c}, kappa = secret bits, c = 8 *
    owf_output_size constraint bits. From the verified table this is
    ~2.000 for eight of the twelve parameter sets and ~1.000 for
    faest_192s / faest_192f alone. Where it is ~2 the expected exhaustive
    search for ANY admissible witness is a factor ~2 cheaper than for the
    unique key -- one bit, in the direction that WEAKENS the scheme's
    margin, and it is uncounted in every FAEST record here.
    The proposal is an audit, not an attack. Its most likely outcome moves
    the baseline UP (from 2^126.1 toward ~2^127 for a one-pair adversary),
    which makes FAEST look STRONGER than this program has recorded; that is
    the honest half of GOAL-FAEST-001's second completion horn and it is
    reported as such.

