    owf_shape_read_from_owf_c_and_h: >-
      owf_128(key, input, output) is one AES-128 ECB block encryption.
      owf_192 / owf_256 load input into temp[1], produce TWO output blocks
      (output and output + IV_SIZE), consistent with beta = 2 and
      owf_output_size = 32. owf_em_128 expands the AES key schedule FROM THE
      PUBLIC INPUT (aes128_expand_key_aesni(rk, input)) and encrypts the
      SECRET, i.e. the EM sets make the public value the AES key and the
      secret the plaintext. faest_impl.c hash_mu() hashes owf_input and
      owf_output into mu, so both are public and per-key-pair.

  object_first_candidate:
    tracked_object: >-
      The RESOURCE TRIPLE (time, data, memory) of each published AES key
      recovery attack, followed through a single admissibility gate: the
      number of (plaintext, ciphertext) pairs the attack consumes, compared
      against the number the FAEST public key actually publishes. The object
      is not an attack and not a cipher; it is the pair
      (attack cost, attack data requirement) and the predicate
      data_required <= nu(parameter_set).
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: biclique/MITM key
      recovery, integral and division-property distinguishers, impossible
      differentials, related-key and chosen-key distinguishers, algebraic
      (XL/XSL/Groebner) attacks on AES, VOLEitH soundness analysis, QROM
      Fiat-Shamir extractor analysis, and grinding/repetition forgery cost
      models. This proposal proposes NO attack in any of those families. It
      audits the measuring stick those families are scored against. That is
      the one move the off-limits rule does not forbid, and it is chosen
      deliberately because the measuring stick is load-bearing for four
      existing FAEST proposals and has never been checked.
    newness_score: >-
      The individual ingredients are elementary: an admissibility gate on
      data complexity is textbook cryptanalytic hygiene, and preimage
      multiplicity is a one-line expectation. What is not in this corpus is
      either one applied to FAEST, and the corpus is measurably wrong
      without them: the string 2^126.1 is written into four FAEST proposals
      and the goal checkpoint as "the matched baseline", with no data budget
      stated anywhere.
    testability_score: >-
      Very high and almost free. The multiplicity correction is exact
      arithmetic on twelve rows of a table this session already read. The
      admissibility gate needs ONE number (the data complexity of the full
      AES-128 biclique attack) from a paper this program has not read; if
      the paper cannot be obtained the audit still reports the gate and
      records the missing number as missing.
    survival_score: >-
      The correction survives with high probability because it is arithmetic
      plus a definition, not a mechanism. What may not survive is its
      SIZE: if the biclique attack turns out to need only a handful of
      pairs, correction (1) collapses to nothing and only the ~1-bit
      multiplicity correction remains. That collapse is a real and declared
      failure mode, not a caveat.

  mechanism: >-
    STEP 1 -- WHAT THE FAEST ADVERSARY IS ACTUALLY GIVEN. Read from
    faest-ref (see verified_parameters). For the six non-EM sets the public
    key is (x, y) with y = AES_sk(x) for beta = 1 (128-bit sets) or y the
    concatenation of two AES output blocks for beta = 2 (192/256-bit sets);
    x is 16 bytes and is stored in the public key, so it is per-key-pair,
    not a global constant. For the six EM sets the public value is the AES
    /Rijndael KEY and the secret is the plaintext, with output size equal to
    the block size. In every case the adversary is handed the public key and
    an unlimited supply of SIGNATURES, but signatures do not add
    (plaintext, ciphertext) pairs under the secret key: the OWF is evaluated
    once, at key generation. Hence
      nu(parameter_set) = number of independent OWF input/output block
      pairs published = beta, i.e. 1 for the 128-bit sets and all EM sets,
      2 for faest_192s/f and faest_256s/f (as two output blocks).
    A key-recovery attack requiring D > nu pairs is NOT AVAILABLE to the
    FAEST forger and may not be quoted as its matched baseline. The gate is
    binary and needs no cost model.
    STEP 2 -- THE MULTIPLICITY CORRECTION, EXACTLY. Model AES_k(x) as a
    uniformly random function of k for fixed x (this is the standard
    idealisation and is stated as HEUR-FB-1, not smuggled). The number S of
    keys consistent with the published pair(s) satisfies
      E[S] = 1 + (2^{kappa} - 1) * 2^{-c},
    kappa = secret bits, c = 8 * owf_output_size. Substituting the verified
    table:
      faest_128s/f, faest_em_128s/f: kappa = c = 128  => E[S] = 2 - 2^{-128}
      faest_em_192s/f:               kappa = c = 192  => E[S] = 2 - 2^{-192}
      faest_em_256s/f:               kappa = c = 256  => E[S] = 2 - 2^{-256}
      faest_256s/f:                  kappa = c = 256  => E[S] = 2 - 2^{-256}
      faest_192s/f:                  kappa = 192, c = 256 => E[S] = 1 + 2^{-64}
    Exhaustive search over the key space for ANY admissible witness has
    expected cost 2^{kappa} / (E[S] + 1) evaluations under the same
    idealisation; at E[S] = 2 that is 2^{kappa} / 3 rather than 2^{kappa} /
    2, i.e. about 0.58 bits cheaper than the unique-solution case, and
    about 1 bit cheaper than the convention that quotes 2^{kappa}. The
    honest headline is therefore "the correct one-pair baseline for
    FAEST-128 is 2^{126.4}-2^{127} depending on the declared convention",
    and the CONVENTION MUST BE DECLARED because the whole audit turns on it.
    STEP 3 -- WHY THIS IS NOT COFACTOR POLISHING DRESSED UP. It is
    cofactor-scale and this record says so in target_complexity: no exponent
    moves. Its value is that it is UPSTREAM of four proposals whose entire
    success criterion is an inequality against the baseline. IDEA-20260731-002's
    success criterion is literally "min over feasible (kappa, tau) >= 126.1".
    If the admissible baseline is 2^{127} the criterion is looser by 0.9
    bits in the scheme's favour; if a future forgery model lands at 2^{126.5}
    the SIGN OF THE CONCLUSION FLIPS depending on which baseline is used.
    A one-bit error that flips a conclusion is not a cofactor.
    STEP 4 -- THE RECORD-INTEGRITY HALF. KN-LIT-2701 was read in full by
    this session. Measured, not recalled: authors are recorded as
    "Andrey Bogdanov**", "Dmitry Khovratovich", "Christian Rechberger**"
    (footnote markers parsed into the author field); year: null; venue:
    null; all four identifier fields null; tags include "pairing" and
    "quantum"; the "## Relevance to this program" section reads
    "Relevant to pairing-based reductions and endomorphism speedups
    (MOV/Frey-Ruck special cases, GLV/GLS)" -- i.e. an ECDLP paragraph
    attached to an AES paper, in the exact field a downstream agent reads
    to decide relevance; the front matter says citation_verified: read
    while the "## Not verified here" section says claims are relayed from
    the abstract without independent verification; and the local copies are
    three files under downloads/, which this repository does not track. The
    string KN-LIT-2701 occurs in 14 files under ledger/, knowledge/,
    experiments/ and docs/ (measured 2026-08-06). The figures 2^126.1,
    2^189.7, 2^254.4 and 2^124.9 appear in the entry body and are
    RECALLED-UNVERIFIED with respect to the actual paper. THE DATA
    COMPLEXITY OF THE FULL AES-128 BICLIQUE ATTACK IS NOT RECORDED IN THE
    ENTRY AT ALL, which is precisely the number the admissibility gate
    needs.

  novelty_status: unverified

  literature_context:
    - >-
      KN-LIT-2701, "Biclique Cryptanalysis of the Full AES". READ IN FULL AS
      A CORPUS RECORD by this session; the underlying PAPER WAS NOT READ.
      The entry's relayed abstract states "Most of our techniques only need
      a very small part of the codebook and have low memory requirements".
      NOTE THE TRAP THIS AUDIT EXISTS TO CATCH: in the AES literature "a
      very small part of the codebook" describes a FRACTION of 2^128 and is
      routinely satisfied by 2^88 chosen plaintexts. RECALLED, UNVERIFIED:
      the author's own table is remembered as reporting data 2^88 for the
      full AES-128 attack. THAT NUMBER IS A CANDIDATE TO CHECK AND IS NOT
      USED AS AN AUTHORITY ANYWHERE IN THIS RECORD; reading it is stage 2.
    - >-
      KN-LIT-7638 (Baum et al., VOLE-in-the-Head, CRYPTO 2023, ePrint
      2023/996) -- citation-verified in this corpus against the ePrint
      landing page. NOT READ BY THIS SESSION beyond the corpus entry.
    - >-
      KN-LIT-7619 (faest-ref repository entry) -- records the repository
      identity, layout and a HEAD sha as of 2026-07-31, and states
      explicitly that "Code contents were not fetched or audited". This
      session fetched code contents; the parameter table above is new
      information relative to that entry and should be filed as a
      superseding or companion KN-LIT entry by whoever has that authority.
      NO EDIT TO KN-LIT-7619 IS PROPOSED OR MADE.
    - >-
      NIST's security categories are defined by reference to the cost of
      key search on AES-128/192/256 under a stated model. THE CATEGORY
      DEFINITION TEXT WAS NOT READ IN THIS SESSION and its exact convention
      (does it charge 2^{kappa} or 2^{kappa-1}? does it charge memory?) is
      a stage-1 obligation, because the audit's entire output is a
      convention-relative number.

  lossy_projection_identifiability_audit:
    projection: >-
      Published AES attack, in full, --> the pair (log2 time under a named
      cost model, log2 data in plaintext/ciphertext pairs), plus the boolean
      data <= nu.
    what_is_discarded: >-
      The entire mechanism: biclique structure, matching-with-precomputation,
      key-schedule differentials, the S-box, the round count. Nothing of how
      the attack works survives.
    why_genuinely_lossy: >-
      Genuinely lossy: infinitely many distinct attacks map to the same
      (time, data) point, and no inverse exists. This is NOT the
      (Delta, Pi) = (x XOR y, x*y) failure -- the discarded structure cannot
      be reconstructed from the retained pair, and no step of the audit ever
      needs it.
    why_compatible_with_the_operations: >-
      Compatible because the target operation is a COMPARISON, and comparison
      only ever consumes the retained coordinates. The gate
      data <= nu and the inequality forgery_cost >= baseline_cost are both
      functions of the projection alone.
    is_it_only_a_change_of_coordinates: >-
      No. CHECKED FOR BOTH FAILURES. Not a change of coordinates (the fibre
      over a (time, data) point is enormous). Not the mirror failure either:
      the comparator spread is NOT zero, because the projection separates
      exactly the attacks the audit needs separated -- exhaustive search sits
      at (kappa, 1) and the biclique family sits at (126.1, D) for a D that
      is currently unknown to this program. If the measured D turns out to be
      1, the spread on the admissibility coordinate collapses to zero for
      this comparison and correction (1) is dead; that is the declared
      falsification, and it is checked before anything is concluded.

  assumptions:
    - >-
      That faest-ref's meson.build parameter table matches the FAEST v2.0
      specification document. NOT VERIFIED -- the specification PDF has not
      been read. A mismatch is itself a first-class finding.
    - >-
      That "the FAEST adversary's data budget" is correctly identified with
      the OWF pairs published in the public key. The signature transcript
      publishes VOLE openings, which are functions of the witness; whether
      any of them constitutes additional plaintext/ciphertext material under
      the same key is a question this record does NOT answer and explicitly
      routes to IDEA-20260731-005, which owns the partial-opening lane.
    - >-
      That AES_k(x) behaves as a uniformly random function of k at fixed x
      for the purpose of counting preimages (HEUR-FB-1 below).

  predictions:
    - metric: >-
        nu(parameter_set): number of independent OWF input/output block
        pairs published by the public key, for all 12 sets, derived from
        beta and owf_output_size at a pinned faest-ref commit
      direction: different
      minimum_effect: >-
        FORCED VALUE, STATED BEFORE ANY RUN: nu = 1 for faest_128s,
        faest_128f, faest_em_128s/f, faest_em_192s/f, faest_em_256s/f; nu = 2
        for faest_192s/f and faest_256s/f. Any set for which the pinned
        source gives a different nu falsifies the reading and the audit
        restarts from the source.
    - metric: >-
        E[S], expected number of OWF preimages, per parameter set
      direction: different
      minimum_effect: >-
        FORCED VALUE: 2 - 2^{-kappa} for ten of the twelve sets and
        1 + 2^{-64} for faest_192s and faest_192f ALONE. The prediction that
        exactly two of twelve sets have a unique witness is sharp and can
        fail: if owf_output_size for the 192 sets is not 32, or if the second
        output block is not an independent constraint, the count changes.
    - metric: >-
        D_biclique: data complexity, in plaintext/ciphertext pairs, of the
        full-AES-128 key recovery attack quoted at 2^126.1, read from the
        actual paper
      direction: higher
      minimum_effect: >-
        Predicted D >= 2^{32}, i.e. at least 32 bits above the FAEST budget
        of 1. The prediction is deliberately loose because the number is not
        known here. D <= 8 FALSIFIES correction (1) outright and the audit
        must report that 2^126.1 IS admissible after all.
    - metric: >-
        admissible_baseline_bits(parameter_set): log2 of the expected number
        of AES evaluations for the cheapest ADMISSIBLE witness search, under
        a single declared cost convention
      direction: higher
      minimum_effect: >-
        Predicted >= 126.4 for the 128-bit sets, i.e. strictly ABOVE the
        2^126.1 currently recorded, under the convention
        2^{kappa} / (E[S] + 1). Reported with the convention named; a
        different convention gives a different number and the audit reports
        the whole small table rather than one figure.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the audit.
      STAGE 0 (zero compute, minutes): re-fetch faest-ref at a PINNED COMMIT
      SHA, record the sha and the sha256 of meson.build, owf.c, owf.h,
      instances.c/h, and re-read the twelve parameter rows. If the pinned
      table differs from verified_parameters above, STOP and report the
      discrepancy -- everything downstream depends on it.
      STAGE 1 (pen and paper, zero compute): derive nu and E[S] per set,
      declare the cost convention explicitly, and produce the admissible
      baseline table. THIS STAGE ALONE PRODUCES THE DELIVERABLE.
      STAGE 2 (network, may fail): obtain the biclique paper and read the
      data complexity of the full-AES-128 attack. Report the number, or
      report that it could not be obtained. A failure here is an
      infrastructure outcome and closes nothing.
      STAGE 3 (arithmetic, minutes): re-express the baseline under a charged
      (time, memory, data) convention, and state which published attacks
      survive the gate.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED BEFORE THE RUN: run the
        identical multiplicity computation on faest_192s / faest_192f, where
        the constraint count 256 exceeds the secret 192 bits. The forced
        value is E[S] = 1 + 2^{-64}, i.e. NO multiplicity correction and a
        unique witness. If the computation reports E[S] ~ 2 there too, it is
        responding to the parameter-set label rather than to (kappa, c) and
        the instrument is wrong. THIS NULL CAN FAIL.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: a
        synthetic parameter set with c = kappa - 8 (one output byte
        truncated). The forced value is E[S] = 1 + 2^{8} - 2^{-kappa} ~ 257,
        i.e. a 8.0-bit reduction in admissible baseline. If the instrument
        does not report ~257 there, it cannot count preimages and NO
        NEGATIVE MAY BE REPORTED from any other cell.
      - >-
        GRADED CONTROL, 4 INTERIOR POINTS, MONOTONICITY REPORTED: sweep
        c = kappa - 16, kappa - 8, kappa, kappa + 8, kappa + 16 and report
        E[S] and admissible_baseline_bits at each. E[S] must fall
        monotonically and admissible_baseline_bits must rise monotonically,
        saturating at 2^{kappa}/2 for c >> kappa. A non-monotone result
        localises an arithmetic error rather than leaving "it did not work".
      - >-
        ARCHIVE CHECK, zero compute: search the corpus for any prior
        statement of a FAEST data budget or an admissibility gate on the AES
        baseline. NONE WAS FOUND in the four FAEST proposals, EV-FAEST-001,
        EV-FAEST-002 or the goal record; that absence is recorded as an
        absence, not claimed as a passed check (AGENTS.md retrieval policy:
        absence of a search result is not evidence).
    required_metrics:
      - pinned faest-ref commit sha and per-file sha256
      - nu and E[S] per parameter set, with the arithmetic shown
      - the declared cost convention, quoted
      - admissible_baseline_bits per set under that convention
      - D_biclique with its source and page, or an explicit statement that the paper could not be obtained
      - the list of citing records whose baseline would change, by id

  falsification_conditions:
    - >-
      The pinned faest-ref table differs from verified_parameters. The
      reading is wrong and the whole record must be superseded, not patched.
    - >-
      The biclique attack turns out to require <= 8 pairs. Correction (1) is
      void; 2^126.1 is admissible; only the ~0.6-1.0 bit multiplicity
      correction survives and the proposal shrinks to a footnote. THIS IS
      THE MOST LIKELY SINGLE FAILURE OF THE PROPOSAL.
    - >-
      The signature transcript is shown to publish additional
      plaintext/ciphertext material under the same key, raising nu above
      beta. The gate must then be recomputed with the larger nu and may stop
      binding.
    - >-
      The positive control fails to report E[S] ~ 257. Nothing negative may
      be reported from any cell.

  confounders:
    - >-
      CONVENTION DRIFT. "AES key search costs 2^128" and "costs 2^127" are
      both in common use, and the audit's headline number differs by a bit
      between them. The convention is declared once, in stage 1, and every
      number is reported relative to it.
    - >-
      RECALLED NUMBERS. The 2^88 data figure and the 2^126.1 / 2^189.7 /
      2^254.4 / 2^124.9 time figures are all unverified with respect to the
      actual paper. The audit must not compute with them before stage 2, and
      if stage 2 fails they are reported as unavailable rather than assumed.
    - >-
      MOVING REF. The parameter table was read from 'main', not a commit.
      Between this record and any run, faest-ref may move. Stage 0 exists
      solely to remove this confounder.
    - >-
      DIRECTIONAL COMFORT. The audit's expected result makes the scheme look
      stronger, which is the comfortable direction and therefore the one to
      be most suspicious of. The multiplicity correction, which cuts the
      other way, is computed and reported in the SAME table so that neither
      can be reported without the other.

  interpretation_limits:
    - >-
      NO ATTACK IS CLAIMED, NO FORGERY IS CLAIMED, AND NO EXPONENT MOVES.
      The deliverable is a corrected comparison basis of size ~1 bit plus a
      binary admissibility gate.
    - >-
      A corrected baseline does NOT validate or invalidate any FAEST
      security claim. It changes the right-hand side of an inequality four
      other proposals intend to test.
    - >-
      NOTHING HERE IS A STATUS CHANGE. KN-LIT-2701 is not edited,
