  heuristic_assumptions:
    - id: HEUR-FB-1
      statement: >-
        For fixed public input x, the map k -> AES_k(x) from {0,1}^{kappa} to
        {0,1}^{c} behaves as a uniformly random function for the purpose of
        counting the preimages of a fixed y; i.e. for k' != k_true,
        Pr[AES_{k'}(x) = y] = 2^{-c} independently across k'.
      rigorous_support: >-
        This is the standard idealisation under which NIST's own category
        definition and every published exhaustive-search cost are stated;
        AES's key schedule is not a random function and the independence
        across k' is FALSE in the strict sense (related keys give correlated
        outputs). What is needed here is only the FIRST MOMENT, E[S], for
        which pairwise independence is not required -- linearity of
        expectation gives E[S] = 1 + (2^{kappa} - 1) 2^{-c} from the
        marginals alone. The variance, which WOULD need independence, is not
        used.
      validation_plan: >-
        Validate the marginal at reduced scale: for a small-block AES-like
        permutation with kappa = c = 16, enumerate all keys for 1000 random
        (x, y) pairs and compare the empirical mean of S against the forced
        value 2 - 2^{-16}. A deviation above 3 standard errors refutes the
        marginal at that scale and the correction must be restated.
    - id: HEUR-FB-2
      statement: >-
        The FAEST forger's data budget equals the number of OWF block pairs
        in the public key; signatures contribute no additional
        plaintext/ciphertext material under the secret key.
      rigorous_support: >-
        Supported by the structure read in owf.c and faest_impl.c: the OWF is
        evaluated at key generation and its input/output are constants of the
        public key thereafter; signing consumes the WITNESS, not fresh OWF
        evaluations. NOT A PROOF: a VOLE opening reveals masked linear
        functions of witness bits, and whether any subset reconstitutes an
        AES evaluation on a new input is not settled here.
      validation_plan: >-
        Route to IDEA-20260731-005, which owns the partial-opening lane;
        this audit reports nu = beta with the assumption named and does not
        claim to have discharged it.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES, AND THIS RECORD REFUSES TO PRETEND OTHERWISE. The
      correction is at most ~1 bit on a 2^128 baseline, i.e. a cofactor. It
      is proposed anyway because it is the right-hand side of the inequality
      four existing proposals are built to test, and a 1-bit error that
      flips the sign of a conclusion is not a cofactor in effect.
    memory_exponent: >-
      Charged for the first time in this lane: exhaustive witness search over
      2^{kappa} keys at nu published pairs needs O(1) memory. The biclique
      family's memory is recorded in KN-LIT-2701's relayed abstract as "low"
      with no number; the number is a stage-2 target.
    best_known: >-
      For AES-128 key recovery with unlimited data: 2^126.1 as relayed by
      KN-LIT-2701, UNVERIFIED. For AES-128 witness search at ONE published
      pair: no published result is known to this program, and the audit's
      output is the first such number this program will hold.
    hidden_overhead: >-
      The cost of one AES evaluation in the units the baseline is quoted in
      (gates? cycles? "AES encryptions"?) is exactly the unit ambiguity the
      declared convention must fix.
    tradeoff_note: >-
      Under a charged (time, memory, data) convention the biclique family may
      be dominated by plain exhaustive search for the FAEST adversary even
      before the admissibility gate fires, because its advantage is 1.9 bits
      of time bought with data. Recording that Pareto fact is part of the
      deliverable.

  dominated_by: >-
    Not dominated, because no Pareto point is claimed: this proposal proposes
    no algorithm. On the QUESTION it audits -- what baseline a FAEST forgery
    should be compared against -- the frontier rows checked on 2026-08-06
    were: (a) TIME: KN-LIT-2701's 2^126.1 / 2^189.7 / 2^254.4 (relayed,
    unverified) and plain exhaustive search; (b) MEMORY: KN-LIT-2701 records
    only the word "low", no number, and no other AES memory figure exists in
    this corpus; (c) DATA/QUERIES: NO ROW EXISTS -- not one record in this
    corpus states the data complexity of any AES attack, which is precisely
    the gap this proposal fills. Also checked: the four FAEST proposals
    (IDEA-20260731-002/003/004/005), IDEA-20260801-005, EV-FAEST-001,
    EV-FAEST-002, and the GOAL-FAEST-001 BATCH-001 checkpoint. Absence of a
    result is not evidence that none exists.
  sota_delta: >-
    Quantitative, and small on purpose. (i) Admissibility gate: converts an
    unqualified 2^126.1 into a data-conditional statement; the size of the
    change is 126.1 -> 126.4..127.0 bits for the 128-bit sets, i.e. between
    +0.3 and +0.9 bits, PLUS the binary fact that the biclique row is
    inadmissible if its data exceeds nu. (ii) Multiplicity: -0.58 bits
    against the unique-witness convention for 10 of 12 sets, 0.00 bits for
    faest_192s/f. (iii) Corpus: 14 files currently cite a literature record
    with parsed-footnote authors, null year/venue, null identifiers and an
    ECDLP relevance paragraph on an AES paper; the audit produces the first
    measured statement of what those 14 records were relying on.

