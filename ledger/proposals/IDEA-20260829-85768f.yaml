    Dictionary attacks against unpublished nothing-up-my-sleeve constants are a
    standard technique and the framing is the explicit subject of KN-LIT-4290
    (BADA55), so the honest research label is `adaptation` at best. Whether anyone has
    published an exclusion sweep against FRP256v1 specifically I do not know: no web
    search was performed this session, the BADA55 paper was not opened, and no ANSSI
    document is in the frozen package. Per agents/idea-generator.md that forces
    `unverified`. A reviewer with retrieval should check BADA55 and any ANSSI
    publication before crediting anything here with novelty, and should note that a
    published ANSSI generation document, if one exists, would make claims (B) and (C)
    unnecessary and replace them with a direct transcript audit - which would be a
    strictly better outcome and is the first thing to look for.
