  minimal_test:
    design: >-
      STAGE 0, ZERO COMPUTE, MINUTES, AND IT CAN CLOSE A WHOLE CLAIM FOR FREE. Compute
      FRP256v1's p mod 4 by hand or in one line. If it is 1, claim (C) is excluded in
      one step and the Brainpool sweep is not run at all. Then freeze and PUBLISH the
      dictionary D - its construction rule, its wordlist, its constants, its offsets,
      its RNG seed and its exact size - before anything searches.
      STAGE 1, THE CHEAPEST VALID DISCRIMINATOR, SECONDS, AND IT IS EXACT AND
      D-INDEPENDENT. The minimality battery: for x = 1, 2, 3, ..., 1000, test by
      Legendre symbol whether x^3 - 3x + b is a square mod p for FRP256v1; report the
      smallest hit; then run the identical routine on Curve25519 in Montgomery form and
      require it to reproduce the published u = 9 fixture. Two curves, about 2000
      Legendre symbols, under a second. THIS SETTLES CLAIM (D) COMPLETELY, needs no
      dictionary, carries no heuristic, and its blocking control has a published
      fixture - which no other test in this record can say.
      STAGE 2, MINUTES. The sparsity statistic on six primes plus the 10^4-prime null,
      with the NIST and Brainpool separations as blocking controls.
      STAGE 3, HOURS ON 14 CORES. The NIST-image sweep, run FIRST against P-224, P-256
      and P-384 as planted positives, and only then against FRP256v1.
      STAGE 4, HOURS, ONLY IF STAGE 0 LEFT IT LIVE. The Brainpool-image sweep.
      STAGE 5, ZERO COMPUTE. The coverage table and the documentary inventory, with the
      excluded fraction attached to every D-dependent line.
    controls:
      - >-
        BLOCKING PLANTED POSITIVE - the three NIST curves swept with their own seeds
        hidden in the full dictionary. Predicted 3 of 3 recovered. A null sweep whose
        instrument has never found a planted seed is worthless and the FRP256v1 result
        is withdrawn without it.
      - >-
        BLOCKING FIRING CONTROL FOR MINIMALITY - Curve25519, whose minimal base point is
        a published SafeCurves fixture. The instrument must return MINIMAL.
      - >-
        BLOCKING SEPARATION CONTROL FOR SPARSITY - the three NIST primes must return
        sigma <= 5 and the two Brainpool primes sigma > 8. A measure that cannot
        separate a Solinas prime from a SHA-1 output measures nothing.
      - >-
        NULL, SAME SHAPE, FOR THE SWEEP - 10^8 uniformly random seeds are already inside
        D and their hit count is reported separately from the structured candidates', so
        the structured and unstructured halves of the dictionary are never pooled.
      - >-
        NULL, SAME SHAPE, FOR SPARSITY - 10^4 random 256-bit primes, RNG seed recorded.
      - >-
        NEGATIVE, PARAMETER-MATCHED, FOR MINIMALITY - brainpoolP256t1, whose base point
        is DERIVED as k*P with P minimal, so it is predicted NOT minimal for a PUBLISHED
        REASON. This is the sharpest control in the record: it exhibits a curve that
        fails the minimality test and is nevertheless "somewhat rigid", proving directly
        that a failed minimality test is not evidence of anything about provenance.
      - >-
        REFUSAL CONTROL - the sweep pointed at a curve with no a = -3 shape must refuse,
        since the b^2 c congruent a^3 predicate is parameterised by a.
      - >-
        DEGENERATE-INPUT CONTROL - candidate seeds of all zeros and all ones, and the
        c = 0 rejection path, each exercised explicitly.
    required_metrics:
      - 'FRP256v1 p mod 4, and whether claim (C) survives it'
      - 'the frozen dictionary construction rule, its component counts and |D|, published before the sweep'
      - 'hits per curve per sign of 27, with the seed exhibited for every hit'
      - 'the planted-positive recovery count, 3 of 3 required'
      - 'the excluded fraction |D| / 2^160 as an exact expression, on every null line'
      - 'the smallest admissible x for FRP256v1 and for each control curve'
      - 'the Curve25519 minimality fixture reproduction, u = 1..8 verdicts and u = 9'
      - 'sigma for six named primes and the null distribution over 10^4 random primes'
      - 'the verifiability-coverage table, three regimes, with free-variable enumerations'
      - 'the count of ANSSI primary documents located, with the search recorded'
      - 'wall clock, core-hours and all RNG seeds'

  falsification_conditions:
    - >-
      The sweep fails to recover any of the three planted NIST seeds. The instrument does
      not work; the FRP256v1 null is void and must not be reported at all.
    - >-
      The minimality instrument does not reproduce Curve25519's u = 9 fixture. The
      battery has never fired and cannot certify non-minimality; claim (D) is withdrawn.
    - >-
      The sparsity measure does not separate the NIST primes from the Brainpool primes.
      sigma is not measuring what it claims and every FRP256v1 verdict from it is void.
    - >-
      A hit is found for FRP256v1. HALT. An implementation error, a dictionary
      construction error or a transcription error in FRP256v1's b or p are each far more
      likely than a genuine discovery, and all three must be excluded, the hit
      independently replicated by a second implementation, and the result escalated to
      independent review before any statement leaves the repository. THIS IS THE ONE
      OUTCOME IN THIS SIX-RECORD BATCH THAT COULD BE MISREPORTED AS AN ACCUSATION AND
      THE RECORD PRE-COMMITS TO THE SLOWEST POSSIBLE HANDLING OF IT.
    - >-
      The dictionary is grown after a null is observed. The protocol is broken and the
      result is not a measurement; report the frozen-D result or nothing.
    - >-
      More than one hit is found for a single curve. Either the predicate is degenerate
      or the dictionary contains duplicates; investigate before interpreting either hit.
    - >-
      FRP256v1's h is not 1, or n is not prime, or n <= sqrt(p) + 1. The minimality
      argument's premise fails, every point is not a generator, and claim (D) needs
      restating with subgroup membership tests rather than Legendre symbols alone.

  confounders:
    - >-
      A NULL SWEEP EXCLUDES A FRACTION OF ABOUT 2^{-133} AND THAT IS ALL IT DOES. At
      |D| = 10^8 the sweep covers about 2^27 of 2^160 seeds. No feasible budget changes
      this by more than a few bits: a sweep a million times larger still covers
      2^{-113}. THE PHRASE "WE FOUND NO SEED" IS NEVER CORRECT AND THE ONLY CORRECT
      PHRASING IS "NO SEED IN A DECLARED SET OF SIZE |D|". This is the record's dominant
      confounder and it is structural, not fixable.
    - >-
      THE DICTIONARY ENCODES MY GUESSES ABOUT WHAT A DESIGNER WOULD USE. Choosing Pi, e
      and a wordlist is a hypothesis about human behaviour dressed as a search, and a
      null result over it is evidence about my imagination and not about the world. That
      is why the dictionary must be published in full: a reader can then see exactly
      which guesses were made and extend them, which is the only way this component ever
      improves.
    - >-
      A FAILED MINIMALITY TEST IS NOT EVIDENCE OF ANYTHING ABOUT PROVENANCE, AND THE
      RECORD PROVES IT WITH ITS OWN CONTROL. brainpoolP256t1's base point is also not
      minimal, for a fully published and verifiable reason - it is k*P with P minimal and
      k seed-derived. So "not minimal" is shared by a somewhat-rigid curve and a
      trivially-manipulatable one, and cannot separate them. Any write-up that treats
      FRP256v1's non-minimal base point as suggestive has ignored the record's own
      negative control.
    - >-
      SECOND-HAND PARAMETERS FOR THE ONE CURVE WITH NO FIRST-HAND SOURCE. FRP256v1's
      p, b, Gx, Gy and n reach this program only through the RQ intake (declared
      user-supplied unverified) and SafeCurves' tables. A sweep against a mis-transcribed
      b returns null for a reason unrelated to ANSSI. The two second-hand sources should
      at least be compared against each other, which is a weak but nonzero check and is
      the only one available.
    - >-
      THE a = -3 SHAPE COINCIDENCE IS NOT EVIDENCE. SafeCurves' own definition of the
      trivially-manipulatable level uses "y^2 = x^3 - 3x + b for a random b" as its
      illustration, and FRP256v1 has a = -3. So does every NIST curve, every Brainpool
      t1 curve and most standardised prime-field curves, because a = -3 is an efficiency
      convention. The coincidence of shape between the illustration and the classified
      curve is a fact about the illustration.
    - >-
      SPARSITY MEASURES WHAT IT MEASURES. A dense prime is consistent with hash
      derivation, with free choice, and with a selection rule nobody has published. Only
      the SPARSE branch is informative, and the record pre-registers that asymmetry so
      the expected dense outcome cannot be presented as a finding.

  interpretation_limits:
    - >-
      RIGIDITY'S COUNTERFACTUAL IS NOT A COMPUTABLE OBJECT, AND FOR THIS CURVE THAT
      LIMIT BINDS HARDER THAN ANYWHERE ELSE IN THE BATCH. There is no procedure to
      reproduce, so there is not even the partial consistency statement the other five
      records can make. NOTHING IN THIS RECORD IS EVIDENCE ABOUT HOW FRP256v1 WAS
      GENERATED, ABOUT WHETHER A SEARCH WAS PERFORMED, OR ABOUT ANY DESIGNER'S INTENT.
      The archived audit plan's closure stands verbatim: for any rule R with
      R(inputs) = P there are infinitely many R' with R'(inputs) = P, and the order in
      which R and P were fixed is not observable. A record citing this one as evidence
      about ANSSI has misused it, and the record's observable-fibre demonstration exists
      specifically to make that misuse indefensible.
    - >-
      "NO EXPLANATION PROVIDED" IS A STATEMENT ABOUT AVAILABLE DOCUMENTATION, NOT ABOUT
      A CURVE. This record measures the documentation available IN THE FROZEN PACKAGE
      IN THIS ENVIRONMENT and finds none for the ANSSI regime. That is a fact about a
      2026-08-25 snapshot of one collection of documents, not a fact about what ANSSI
      published. An ANSSI publication may exist and simply not be here; obtaining it is
      the named first-best route and the honest way to close this row.
    - >-
      NO NUMBER HERE IS A SECURITY STATEMENT ABOUT FRP256v1. The goal's own claim
      boundary says a rigidity failure is not by itself an ECDLP break; this record adds
      that a rigidity classification, at any level of the ordinal, is not by itself
      anything about the ECDLP.
    - >-
      CLAIMS (D) AND (E) ARE EXACT AND D-INDEPENDENT; CLAIMS (B) AND (C) ARE BOUNDED
      SEARCHES WHOSE SCOPE IS A CHOSEN NUMBER. The deliverable must keep the two
      categories visually separate, because a reader who conflates them will read a
      bounded exclusion as an exact one.
    - >-
      TRANSFER TO THE OTHER 19 CURVES, STATED EXACTLY. (a) FULL TRANSFER OF THE
      MINIMALITY BATTERY AND THE SPARSITY STATISTIC to all twenty rows, at a cost of
      about 1000 Legendre symbols and one bounded search each. That family sweep is the
      cheapest cross-curve measurement in this batch and it produces a two-column table
      for the whole manifest; the thirteen fully rigid rows are the positive controls
      and SafeCurves' rigid page states the minimality rule for several of them
      (Curve25519's A, Curve1174's d, Curve41417's d, M-511's (A-2)/4,
      Ed448-Goldilocks's d), giving multiple independent firing fixtures rather than one.
      (b) FULL TRANSFER OF THE EXCLUSION SWEEP as a method to any curve lacking a
      published seed, with the same 2^{-133} ceiling.
      (c) NO TRANSFER OF THE CONCLUSION to any other curve, because the conclusion is a
      bounded null about one parameter tuple.
      (d) THE COVERAGE TABLE IS THE ONE OUTPUT THAT IS INHERENTLY FAMILY-WIDE and
      cannot be produced from one curve: it needs at least two regimes to be a
      comparison and this batch supplies three.
    - >-
      A REFUSAL, A BOUNDED NULL AND AN EXACT NEGATIVE ARE THREE DIFFERENT OUTPUTS and
      must be recorded as three different things. This record produces one of each and
      the deliverable must not flatten them.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For a parameter tuple NOT produced by the NIST procedure, the probability that a
        given candidate seed satisfies b^2 c(s, 256) congruent -27 mod p is 2^{-255}
        times (1 + o(1)); formally, c(s, 256) behaves as a uniform draw from the
        255-bit integers with respect to the multiplicative relation, so the expected
        number of false positives over a dictionary of size |D| is |D| * 2^{-254}
        counting both signs.
      rigorous_support: >-
        The RIGOROUS half runs in the forward direction and needs nothing: a candidate
        that satisfies the predicate is an UNCONDITIONAL witness that this seed produces
        this coefficient under this rule, verifiable in two SHA-1 calls, so a HIT is a
        certificate and not a statistic. The heuristic is used ONLY to bound false
        positives, and it imitates the standard random-oracle idealisation of a hash
        function. SHA-1's known collision weaknesses are irrelevant in both directions
        and no claim depends on collision resistance, which is stated so no reviewer has
        to derive it.
      validation_plan: >-
        SAMPLING - the 10^8 uniformly random seeds already inside D, whose hit count is
        reported SEPARATELY from the structured candidates', giving a direct empirical
        false-positive rate over a sample of exactly the predicted null. All RNG seeds
        recorded. COMPARISON DISTRIBUTION - the observed rate against the exact
        prediction 10^8 * 2^{-254}; at that exponent the prediction is "zero observed in
        any feasible sample", SO THE TEST HAS NO POWER TO CONFIRM AND CAN ONLY REFUTE,
        which is stated rather than glossed. TAIL CHECK - restrict a subsample to
        candidates whose c has an unusually small or large leading block, where a
        truncating implementation would fail first; predicted still zero. PLANTED
        POSITIVES - the three NIST seeds inside the same dictionary, which convert this
        from a pure null into a two-sided test with a known answer on one side and are
        the only reason the null is interpretable. TRANSFER - none; everything runs at
        the real 256-bit prime with full SHA-1.
    - id: H2
      statement: >-
        The dictionary D has non-negligible coverage of the seeds a real designer might
        plausibly have used; that is, conditional on FRP256v1 having been generated from
        a nothing-up-my-sleeve seed, the probability that seed lies in D is bounded away
        from zero.
      rigorous_support: >-
        NONE, AND IT IS NOT A MATHEMATICAL ASSUMPTION AT ALL - IT IS A HYPOTHESIS ABOUT
        HUMAN BEHAVIOUR, AND NO COMPUTATION CAN DISCHARGE IT. It is the reason a null
        result is reported as an excluded count rather than as a conclusion, and the
        reason the full dictionary construction must be published: a reader who thinks
        the guesses are wrong can see exactly which guesses were made and propose better
        ones, and that is the ONLY route by which this component ever improves. The
        record explicitly declines to attach any probability to H2, because doing so
        would be inventing a number about people.
      validation_plan: >-
        NOT VALIDATABLE, AND SAYING SO IS THE HONEST ANSWER. The one partial check
        available is a CALIBRATION ON KNOWN CASES: the dictionary contains the three
        NIST seeds and the fourteen Brainpool seeds, and the Brainpool seeds ARE
        nothing-up-my-sleeve values derived from Pi and e - so the natural-constant
        component of D would have found them had they been unpublished, PROVIDED the
        substring convention matched. Running that check tells us whether the
        constant-window component of D is capable of recovering a real, historically
        used, unpublished-in-hypothesis seed. Predicted YES for the Brainpool seeds,
        which is one calibration point on a component of D and is not a validation of
        H2. Report it as exactly that: one hit on one class of guess, out of an unknown
        universe of possible design choices.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND THIS RECORD MOVES NO EXPONENT. Under
      docs/target-result-profile.md it ranks low as research direction and is dispatched
      measurement work under a declared goal. AUDIT COST, ITEMISED: claim (A) is a grep;
      (D) is about 1000 Legendre symbols per curve, that is 1000 modular exponentiations
      of 256-bit numbers, well under a second; (E) is a bounded search over signed
      power-of-two representations with at most 8 terms and exponents below 400, which by
      meet-in-the-middle over 4-term halves is about (400*2 choose 4) / 2 table entries
      - roughly 10^9 naively and about 10^5 with the obvious symmetry reductions, so the
      executor must state which method was used and cap the search explicitly; (B) is
      |D| * 2 SHA-1 calls plus |D| modular multiplications, that is about 2 * 10^8 SHA-1
      calls at |D| = 10^8, roughly an hour on 14 cores; (C) is the same order if it
      survives Stage 0.
    memory_exponent: >-
      O(log p) per candidate for the sweep, that is bytes, and the sweep is streaming
      with no table - so memory is negligible and the 48 GB envelope is irrelevant.
      THE ONE EXCEPTION IS THE SPARSITY SEARCH: a meet-in-the-middle over 4-term halves
      needs a table of about 10^5 to 10^7 entries depending on the exponent cap, which is
      megabytes and still not binding, but the executor must state the table size rather
      than let it grow silently. The deliverable is kilobytes.
    best_known: >-
      For learning FRP256v1's generation procedure the best known method is to READ AN
      ANSSI PUBLICATION, which costs one retrieval and returns the answer exactly if such
      a document exists. THAT INCUMBENT STRICTLY DOMINATES THIS ENTIRE RECORD'S CLAIMS
      (B) AND (C) whenever it is available, and this record exists only because no such
      document is in the frozen package and no fetch was attempted. Claims (D) and (E)
      are not dominated by retrieval, since they are measurements of the published
      parameters and would be worth running even with the document in hand. Against the
      ECDLP attack frontier (KN-TECH-001, KN-TECH-006, KN-TECH-018, KN-TECH-031,
      KN-TECH-032, KN-TECH-035) this record is dominated by every row because it is not
      an attack.
    hidden_overhead: >-
      No o(1) in the audit cost. FOUR honest hidden costs and the first is severe.
      (i) THE SWEEP'S COVERAGE IS 2^{-133} AND NO BUDGET FIXES IT - the method is
      structurally incapable of a conclusion and can only ever produce a bounded
      exclusion. (ii) H2 is a hypothesis about people and is not validatable. (iii) The
      sparsity search's cost depends entirely on the term cap and the exponent cap, both
      of which are choices that must be declared or the "> 8" verdict means nothing.
      (iv) All FRP256v1 parameters are second-hand, so even an exact D-independent
      result is conditional on a transcription this environment cannot corroborate
      against a primary source.
    tradeoff_note: >-
      The governing tradeoff is DICTIONARY SIZE VERSUS THE STRENGTH OF A NULL, and it is
      logarithmic and brutal: doubling |D| doubles the compute and adds exactly one bit
      to a statement that needs 133 more. THERE IS NO POINT ON THIS CURVE WORTH BUYING
      BEYOND WHAT FITS IN AN HOUR, and saying so forecloses the obvious wrong instinct to
      scale the sweep up. THE INFORMATIVE TRADEOFF IS DIFFERENT AND SHOULD BE TAKEN
      INSTEAD: dictionary BREADTH beats dictionary DEPTH, since a new class of guess -
      a constant, an encoding, a truncation convention nobody tried - can succeed where
      10^12 more random seeds cannot. That is why the construction rule is published
      rather than the size maximised. There is no time-memory tradeoff in the sweep;
      parallelisation is perfect and the 14 cores buy a clean factor of 14.

  dominated_by: >-
    CHECKED AGAINST EVERY FRONTIER ROW BEFORE WRITING THIS FIELD; `null` IS NOT ASSERTED.
    AS AN ATTACK it is dominated by every row simultaneously on time, memory and data -
    rho (KN-TECH-001, KN-TECH-006), automorphism-discounted rho (KN-TECH-018), BSGS
    (KN-TECH-031, KN-TECH-035), MOV and Frey-Ruck (KN-TECH-032) - because it is not an
    attack and produces no discrete logarithm.
    AS A METHOD FOR LEARNING FRP256v1's PROVENANCE, claims (B) and (C) are STRICTLY AND
    COMPLETELY DOMINATED by retrieving an ANSSI publication, which would be faster,
    exact and unambiguous. This record does not dispute that; its entire justification
    for those two claims is that no such document is in the frozen package and no fetch
    was attempted this session. THE HONEST RECOMMENDATION IS THAT A RETRIEVAL TASK BE
    OPENED IN PARALLEL, and it is written into the forward guidance rather than left
    implicit.
    AS A DICTIONARY SWEEP it is dominated in coverage by any larger sweep and in
    imagination by anyone with a better guess about the seed; both dominations are
    cheap for a successor to realise, which is the point of publishing D.
    CLAIMS (D) AND (E) ARE NOT DOMINATED BY RETRIEVAL, since they measure the published
    parameters directly and would be worth running even with an ANSSI document in hand.
    Within this repository I identified no incumbent producing a minimality verdict, a
    sparsity statistic or a verifiability-coverage table for any curve; I did not search
    outside the repository, so that absence is a statement about my search.
  sota_delta: >-
    ZERO speedup against any attack baseline on every axis. THE NONZERO DELTAS ARE FOUR
    AND THEY ARE HONEST ABOUT THEIR SIZE.
    AS DATA - the corpus screen of 2026-08-29 finds no FRP256v1 computation of any kind
    anywhere in knowledge/ or ledger/, and the package grep finds no ANSSI specification
    at all. This would produce one exclusion count with its declared |D| and excluded
    fraction, one exact minimality verdict with an exhibited smaller point, one sparsity
    statistic against a 10^4-prime null, and one three-regime coverage table - where
    there are currently zero of each, on a research question that currently has zero
    proposals and no defined experiment.
    AS SCOPE, WHICH IS THE LARGEST DELTA - RQ-SCURVE-224d9b is the hardest row in this
    group precisely because the ordinary transcript lane is UNDEFINED for it. This
    record converts "no experiment is possible" into four experiments, two of which are
    exact and D-independent. That is a lane-opening delta rather than a precision one.
    AS PRECISION - SafeCurves' verdict is a level on a four-point ordinal plus the four
    words "No explanation provided." This record replaces it, for the parts it can
    decide, with: a coverage count of 0 of 7 against 1 of 7 and 5 of 7 for the sibling
    regimes; an exhibited x-coordinate smaller than the published base point's by about
    255 bits; an exact sigma; and an exclusion of |D| out of 2^160 candidates. Four
    numbers where there were four words.
    AS DISCIPLINE - the record's negative control on brainpoolP256t1's non-minimal base
    point PROVES, rather than asserts, that a failed minimality test carries no
    provenance information, which is the specific overreading this whole lane invites.
    Proving your own headline test is uninformative about the thing readers will want it
    to be informative about is a small contribution and it is the one this record is
    most confident of.
  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation reuses IDEA-20260829-bba3a8's c routine and IDEA-20260829-b70376's
      find_integer, and adds a dictionary builder, a streaming sweep driver, a Legendre
      minimality scan and a bounded signed-power-of-two search - a few hundred lines, of
      which the dictionary builder carries the design risk rather than the code risk.
      Compute is under a second for claims (A), (D) and the controls, minutes for (E),
      and about an hour on 14 cores for (B) at |D| = 10^8, plus the same again for (C)
      if it survives Stage 0. The binding cost is freezing and publishing the dictionary
      before searching, which is protocol discipline rather than machine time.
  recommended_priority: medium

