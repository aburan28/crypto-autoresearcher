  assumptions:
    - >-
      Executor has a shell, Python 3 with hashlib and arbitrary-precision integers, and
      14 cores. The dictionary sweep is the only nontrivial compute and is
      embarrassingly parallel across candidates.
    - >-
      IDEA-20260829-bba3a8 has passed its Stage 1 and Stage 2, and IDEA-20260829-b70376
      has passed its Stage 2. AN UNVALIDATED PIPELINE MAKES A NULL SWEEP MEANINGLESS,
      because a sweep with a broken predicate returns zero hits for the wrong reason and
      is indistinguishable from a correct null. This dependency is blocking, not
      advisory, and it is the single most important precondition in the record.
    - >-
      |D| AND ITS EXACT CONSTRUCTION ARE FROZEN AND PUBLISHED BEFORE THE SWEEP RUNS.
      Growing the dictionary after seeing a null, or reporting a dictionary size chosen
      after the fact, converts a bounded measurement into an unfalsifiable claim. The
      construction rule, the wordlist, the constants, the offsets and the RNG seed are
      all part of the frozen protocol.
    - >-
      No point-counting backend is assumed. The minimality battery needs only Legendre
      symbols, because h = 1 and n prime mean every non-identity point generates - a
      fact taken from SafeCurves' own table and re-derivable from n > sqrt(p) + 1 by
      the uniqueness argument SafeCurves states on the rigid page. THE h = 1 PREMISE
      MUST BE CHECKED, NOT ASSUMED, and the cheapest check is n in the Hasse interval
      together with n prime.
    - >-
      FRP256v1's parameters enter from the RQ intake and from SafeCurves' tables, BOTH
      OF WHICH ARE SECOND-HAND. No primary source exists in this environment. Every
      statement about FRP256v1 is therefore conditional on a transcription this program
      cannot corroborate against a first-hand document, and that conditionality must
      appear in the deliverable rather than in a footnote.
    - >-
      No live keys; every object is a published parameter or a generated control.

  proof_search_map:
    bottleneck: >-
      That the FRP256v1 rigidity row has no procedure to audit, so the ordinary
      transcript-reproduction lane - the archived plan's L8-RIGID, and this batch's
      bba3a8 and b70376 - is undefined for it, and the row therefore has zero proposals
      and no path to any of the eleven criteria cells. Removing this bottleneck does not
      produce a transcript; it produces a DIFFERENT, DEFINED question - membership in
      other procedures' images, with a declared scope - that can actually be run.
    baseline_embedding:
      parameter_slice: >-
        With the true seed placed IN the dictionary, the sweep degenerates to
        IDEA-20260829-bba3a8's single-instance verification exactly: one candidate, one
        c computation, one predicate evaluation. THAT IS THE BASELINE and the sweep must
        contain it as a boundary case. Concretely, the dictionary MUST include the three
        published NIST seeds and the sweep MUST be run against the three NIST curves as
        well as FRP256v1, so that it recovers each NIST curve's own seed from within a
        10^8-candidate haystack. A sweep that cannot find a seed it is known to contain
        is not a sweep.
      reproduction_check: >-
        A frozen fixture: run the complete sweep pipeline against NIST P-256's published
        b and p, with P-256's seed hidden inside the full dictionary, and require
        exactly one hit at exactly that seed. Repeat for P-224 and P-384. Three planted
        positives recovered from the full haystack, run BEFORE the FRP256v1 sweep, and
        the FRP256v1 null is uninterpretable without them.
    observation_collision:
      observable: >-
        The four-bit membership vector M, of which the first two bits are indexed by
        |D|. The conclusion rests entirely on it.
      distinct_preimage_search: >-
        REQUIRED, AND THE COLLISIONS ARE SEVERE AND MUST BE STATED AS THE RECORD'S MAIN
        LIMITATION RATHER THAN DISCOVERED LATER. (i) THE ALL-FALSE VECTOR IS SHARED BY
        ESSENTIALLY EVERY CURVE EVER GENERATED, by any method, honest or not. It does
        not identify FRP256v1 and it does not distinguish "generated by a rule I did
        not test" from "generated freely" from "generated by a rule nobody has
        published". THE OBSERVABLE CANNOT SEPARATE THOSE THREE AND NO EXTENSION OF D
        MAKES IT ABLE TO. (ii) A HIT WOULD ALSO COLLIDE, more benignly: two distinct
        seeds could in principle satisfy the predicate for the same b, with probability
        about |D|^2 * 2^{-255}, negligible at |D| = 10^8 but not zero, so a hit must be
        reported with the number of hits and not as "the seed". (iii) THE SPARSITY BIT
        COLLIDES ACROSS EXPLANATIONS by construction, which is why claim (E) registers
        its uninformative branch in advance. THE SEPARATING CONDITION THAT DOES EXIST:
        the minimality bit is D-independent and exact, and it separates the fully-rigid
        regime from the other two cleanly; it is the only component of M that carries a
        clean signal, and the record should weight it accordingly.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the undefined question "audit FRP256v1's generation procedure" by the
          defined question "is FRP256v1's parameter tuple in the reachable image of a
          published procedure restricted to a declared candidate set, and does it carry
          the D-independent structural signatures of the rigid regime".
        predicted_gain: >-
          Converts a row with zero possible experiments into one with four, of which two
          are exact and D-independent. The cost is that the two D-dependent components
          can never produce a conclusion, only a bounded exclusion, and that cost is
          stated in the claim rather than buried.
      - transform: observable_fiber
        proposed_object: >-
          Hold the all-false membership vector fixed and vary the forgotten structure -
          the actual generation history - to exhibit that the fibre contains honest and
          dishonest histories alike.
        predicted_gain: >-
          A written demonstration, costing no compute, that this record CANNOT
          distinguish them. That demonstration is the strongest available defence
          against the record being cited as evidence about ANSSI, which is by a wide
          margin the most likely misuse of anything in this six-record batch.
    quantifier_order: >-
      CLAIMS (B) AND (C) ARE CLAIMED EXISTENTIALLY OVER A BOUNDED SET AND THE BOUND IS
      PART OF THE CLAIM. FOR THE published FRP256v1 (p, b) and FOR the frozen dictionary
      D of declared size |D|, THERE DOES NOT EXIST s in D with b^2 c(s, 256) congruent
      -27 mod p. NOT CLAIMED, AND THE DIFFERENCE IS THE WHOLE OF THE RECORD'S
      LIMITATION - that there does not exist such an s in {0,1}^160. The witness set is
      permitted to depend on my choice of dictionary, and it does, entirely.
      CLAIM (D) IS CLAIMED EXACTLY AND EXISTENTIALLY. THERE EXISTS x < Gx with x on the
      curve, exhibited; equivalently Gx is not the minimal admissible x-coordinate.
      This needs no dictionary and no heuristic.
      CLAIM (E) IS CLAIMED EXACTLY WITHIN A BOUNDED SEARCH. sigma(p) > 8 means no
      representation with at most 8 signed powers of two below 2^400 exists, which is an
      exhaustive statement over the searched space and NOT a statement that p is
      unstructured.
      CLAIM (A) IS A DOCUMENTARY INVENTORY, claimed over the frozen package only.
    method_ceiling:
      strongest_certifiable_claim: >-
        "No seed in a frozen, published dictionary of size |D| reproduces FRP256v1's
        coefficient under the NIST predicate, and none reproduces its prime under the
        Brainpool rule; FRP256v1's base point is not the minimal admissible
        x-coordinate, by an exhibited smaller point; sigma(p) exceeds 8; and the frozen
        specification package contains a primary generation document for the NIST and
        Brainpool regimes and none for the ANSSI regime." IT CERTIFIES NOTHING about
        whether a seed exists, nothing about how FRP256v1 was generated, nothing about
        anyone's intent, and nothing whatsoever about FRP256v1's security. THE CEILING
        IS HARD AND IT IS LOW: the method can only ever exclude a fraction of about
        2^{-133} of the seed space, and no budget available to anyone changes that by
        more than a few bits.
      nearby_object_control: >-
        THE NEAREST OBJECT ON WHICH THE HOPED-FOR CONCLUSION FAILS IS NIST P-256
        ITSELF, and it is the record's blocking positive. P-256 IS in the NIST image and
        its seed IS in the dictionary, so the sweep must find it. If the sweep returns
        null for P-256, its null for FRP256v1 means nothing. SECOND NEARBY OBJECT, FOR
        THE MINIMALITY BATTERY - Curve25519, whose base point SafeCurves states is
        minimal, on which the instrument must return MINIMAL; without it the battery has
        never fired. THIRD NEARBY OBJECT, FOR THE SPARSITY STATISTIC - the three NIST
        primes, which must return sigma <= 5, and the two Brainpool primes, which must
        return sigma > 8. A sparsity measure that cannot separate 2^256 - 2^224 + 2^192
        + 2^96 - 1 from a SHA-1 output has not identified the load-bearing structure and
        every FRP256v1 verdict from it is void.
    proof_obligations:
      - claim: 'p mod 4 for FRP256v1, computed before anything else.'
        responsibility: feasibility
      - claim: >-
          The dictionary D is frozen and published with its construction rule and exact
          size before the sweep runs.
        responsibility: interface
      - claim: >-
          The sweep recovers each of the three NIST seeds from within the full
          dictionary, one hit each, at the correct seed.
        responsibility: baseline
      - claim: >-
          The per-candidate false-positive probability is about 2^{-255} and the
          expected false-positive count over |D| is stated.
        responsibility: strictness
      - claim: >-
          FRP256v1 has h = 1 and n prime with n > sqrt(p) + 1, so every non-identity
          point generates and minimality reduces to one Legendre symbol per candidate x.
        responsibility: correctness
      - claim: >-
          The minimality instrument returns MINIMAL on Curve25519 before returning NOT
          MINIMAL on FRP256v1.
        responsibility: baseline
      - claim: >-
          sigma separates the NIST primes (<= 5) from the Brainpool primes (> 8) and
          from a random-prime null.
        responsibility: baseline
      - claim: >-
          The excluded fraction |D| / 2^160 is published beside every null result.
        responsibility: scope
      - claim: >-
          The verifiability-coverage counts 1, 5 and 0 out of 7 for the three regimes are
          each derived from a named predicate's free variables, with the enumeration
          shown.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: 'FRP256v1 p mod 4'
      direction: different
      minimum_effect: >-
        REPORTED, NO PREDICTION OFFERED, because I have not computed it and guessing
        would be fabrication. THE TWO OUTCOMES HAVE DIFFERENT CONSEQUENCES AND BOTH ARE
        PRE-REGISTERED: p congruent 3 mod 4 leaves the Brainpool prime route live and
        claim (C) must be run in full; p congruent 1 mod 4 EXCLUDES the Brainpool prime
        rule outright in one modular reduction, which is the cheapest exclusion
        available anywhere in this six-record batch and would be reported as such.
    - metric: >-
        number of hits of the NIST-image predicate over the frozen dictionary D applied
        to FRP256v1, both signs of 27 tested
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 0, against an expected false-positive count of about
        10^8 * 2^{-254}, that is zero to any precision. THE TWO READINGS: a hit is a
        genuine discovery that FRP256v1 is verifiably derived, contradicting SafeCurves'
        "No explanation provided", and must be independently replicated before any
        statement leaves the repository. No hit excludes |D| / 2^160, about 2^{-133}, of
        the seed space AND NOTHING MORE - that fraction is published in the same line as
        the result, every time.
    - metric: >-
        number of hits recovering the three published NIST seeds when the same sweep is
        applied to P-224, P-256 and P-384
      direction: higher
      minimum_effect: >-
        PREDICTED EXACTLY 3, one per curve, each at the published seed. THIS IS THE
        BLOCKING CONTROL AND IT IS THE ONLY THING THAT MAKES THE FRP256v1 NULL
        INTERPRETABLE. Fewer than 3 means the sweep cannot find a seed it demonstrably
        contains, and the FRP256v1 result is withdrawn.
    - metric: >-
        smallest x >= 1 lying on FRP256v1 with a rational y, found by Legendre symbol
      direction: lower
      minimum_effect: >-
        PREDICTED x = 1 or x = 2, since each x lies on the curve with probability about
        1/2 and h = 1 makes every point a generator. THE DERIVED CONSEQUENCE: the
        published Gx exceeds the minimal admissible x by about 255 bits, so FRP256v1's
        base point is NOT chosen by the rule SafeCurves calls usual for rigid curves.
        THE READING IS BOUNDED AND MUST BE STATED SO: this shows the base point does not
        follow ONE named rigid convention, and says nothing about whether it follows some
        other rule, because a rule that is not published cannot be tested.
    - metric: >-
        the same minimality instrument applied to Curve25519
      direction: higher
      minimum_effect: >-
        PREDICTED to report MINIMAL - specifically that u = 1 through 8 fail to be
        admissible and u = 9 is the base point, reproducing the fixture SafeCurves states
        on the rigid page. THIS IS BLOCKING. An instrument that has never returned
        MINIMAL cannot certify NOT MINIMAL, and this is the only curve in the manifest
        for which a published minimality fixture exists.
    - metric: >-
        sigma(p) for the six primes of this group plus a null of 10^4 random 256-bit
        primes
      direction: different
      minimum_effect: >-
        PREDICTED sigma = 3 for P-224 (2^224 - 2^96 + 1), 5 for P-256 and 5 for P-384;
        > 8 for both Brainpool primes and for at least 99.9 percent of the random null.
        FRP256v1 IS THE UNKNOWN AND BOTH BRANCHES ARE PRE-REGISTERED: sigma <= 8 would
        mean the prime has an efficiency-driven shape, which is an explanation of a kind
        and contradicts "no explanation provided" at least for the prime; sigma > 8 is
        consistent with hash derivation, with free choice and with an untested rule
        alike and DISCRIMINATES NOTHING - registered in advance precisely so that the
        expected outcome cannot later be written up as evidence.
    - metric: >-
        verifiability-coverage count, out of the seven published quantities
        (p, a, b, Gx, Gy, n, h), for each of the three provenance regimes
      direction: different
      minimum_effect: >-
        PREDICTED 1 of 7 for the NIST rows (b, via C.3.2), 5 of 7 for the Brainpool rows
        (p, a, b, Gx, Gy via the RFC 5639 chain and the Z map, with n and h following
        from the curve rather than from the procedure), and 0 of 7 for FRP256v1. THE
        THREE-VALUE TABLE IS THIS RECORD'S CONTRIBUTION TO THE GROUP and it is an
