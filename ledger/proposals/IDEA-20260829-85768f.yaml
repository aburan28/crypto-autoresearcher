idea:
  id: IDEA-20260829-85768f
  question_id: RQ-SCURVE-224d9b
  goal_id: GOAL-SCURVE-85bad5
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    PROVENANCE EXCLUSION - when no generation procedure is published, the only
    testable statements are membership in the reachable images of the procedures
    that ARE published. Run a declared-size exclusion sweep of FRP256v1 against the
    NIST and Brainpool pipelines, plus a pre-registered minimality and prime-shape
    battery with the instrument fired on a curve known to satisfy each, and report
    a MEASURED EXCLUSION COUNT - never an inference about intent, which is not a
    computable object.
  class: control

  claim: >-
    SafeCurves places ANSSI FRP256v1 at the bottom of its four-level rigidity
    ordinal, "trivially manipulatable", with the entire comment "No explanation
    provided." That is a statement about an ABSENCE, and this program has no way to
    audit an absence - which is exactly why the row has zero proposals. THE ABSENCE
    IS NEVERTHELESS SURROUNDED BY TESTABLE STRUCTURE. Five separable claims, each
    with two pre-registered readings.

    (A) THE DOCUMENTARY MEASUREMENT, ZERO COMPUTE, AND IT IS ALREADY HALF DONE. The
    frozen package inputs/SAFECURVES-20260825/specs/ contains a primary generation
    document for TWO of the three provenance regimes in this six-curve group -
    sp800-186.txt with the NIST seeds, c values and the C.3.1/C.3.2 procedure, and
    rfc5639.txt with Brainpool's complete Pi-and-e-derived chain - and NO ANSSI
    DOCUMENT AT ALL. I greped the whole package for "FRP256" case-insensitively on
    2026-08-29: 39 files match, and EVERY ONE of them is a SafeCurves page or table,
    not a specification. THE VERIFIABILITY-COVERAGE COUNT FOR FRP256v1 IS THEREFORE
    PREDICTED TO BE 0 OF 7 published quantities, against 1 of 7 for the NIST rows
    (IDEA-20260829-bba3a8) and a predicted 5 of 7 for the Brainpool rows
    (IDEA-20260829-b70376). THAT THREE-VALUE COMPARISON IS THE GROUP'S REAL
    STRUCTURE and it is an inventory, not an inference.

    (B) THE NIST-IMAGE EXCLUSION SWEEP, WITH ITS SIZE DECLARED IN ADVANCE. If
    FRP256v1 were generated by the ANSI X9.62 / SP 800-186 procedure from an
    unpublished seed, then some 160-bit s satisfies b^2 * c(s, 256) congruent -27
    mod p. Search a PRE-REGISTERED dictionary D of candidate seeds: every 160-bit
    window at every bit offset in the first 4096 bits of Pi, e, sqrt(2), sqrt(3),
    sqrt(5), the golden ratio, Euler-Mascheroni gamma, ln 2 and Apery's constant
    (about 3.5 * 10^4 candidates); SHA-1, SHA-256-truncated and MD5 digests of a
    declared ASCII wordlist covering agency names, standard identifiers, dates
    2000-2012 and the strings "FRP256v1", "frp256v1", "ANSSI"; the three published
    NIST seeds and the fourteen published Brainpool seeds, each with offsets
    -2^16 to +2^16 (about 1.1 * 10^6 candidates); and 10^8 uniformly random seeds
    with the RNG seed recorded. |D| declared before the run, target about 10^8.
    PREDICTED ZERO HITS, with a per-candidate null of about 2^{-255}, so the sweep's
    expected false-positive count is about 10^8 * 2^{-254}, indistinguishable from
    zero. THE TWO READINGS, BOTH PRE-REGISTERED: a hit would mean FRP256v1 IS
    verifiably derived and SafeCurves' "no explanation provided" is incomplete -
    a genuine and immediately reportable discovery. No hit means EXACTLY that |D|
    candidates out of 2^160 are excluded, a fraction of about 2^{-133}, and
    NOTHING MORE. That fraction is published beside the result so no reader can
    inflate it.

    (C) THE BRAINPOOL-IMAGE EXCLUSION, WITH A ONE-STEP KILL. RFC 5639's prime rule
    outputs the smallest prime p >= c with p congruent 3 mod 4. SO IF FRP256v1's
    p IS NOT 3 MOD 4, THE ENTIRE BRAINPOOL PRIME ROUTE IS EXCLUDED BY ONE MODULAR
    REDUCTION, and that must be the first thing computed in this record. If p IS
    3 mod 4, run find_integer plus the smallest-prime rule over the same dictionary
    D and ask whether p appears; predicted no, with the same declared-size honesty.

    (D) THE MINIMALITY BATTERY, WHICH TESTS THE OTHER END OF THE ORDINAL. SafeCurves
    states that for a fully rigid curve "the usual choice is the generator with
    smallest possible x-coordinate for short Weierstrass curves". FRP256v1's
    published Gx is 0xb6b3d4c356c139eb31183d4749d423958c27d2dcaf98b70164c97a2dd98f
    5cff, a full 256-bit value. Because FRP256v1 has cofactor h = 1 and prime n,
    EVERY non-identity point generates the whole group, so the minimality test is
    exactly "is there a smaller x on the curve" - one Legendre symbol per candidate
    x, no scalar multiplication needed. PREDICTED: about X/2 values of x in
    [1, X] lie on the curve, so the smallest is expected at x = 1 or 2 and Gx is
    NOT minimal, by about 255 bits. THE CONTROL THAT MAKES THIS MEAN ANYTHING:
    run the identical routine on Curve25519, whose base point SafeCurves states is
    the minimal admissible one (u = 9, with u = 1 through 8 excluded), and require
    the instrument to REPORT MINIMAL. An instrument that has never returned
    "minimal" cannot certify "not minimal" - IDEA-20260807-98a970's rule, applied
    here as a blocking control.

    (E) THE PRIME-SHAPE STATISTIC, A THREE-WAY DISCRIMINATOR WITH A PRE-REGISTERED
    UNINFORMATIVE OUTCOME. Define, before looking, the sparsity measure sigma(p) =
    the minimum number of nonzero terms over representations of p as a signed sum of
    powers of two with exponents at most 400, computed by an exact search bounded at
    8 terms. Evaluate on all six primes of this group plus a null of 10^4 random
    256-bit primes. PREDICTED: NIST P-256 has sigma = 5 (2^256 - 2^224 + 2^192 +
    2^96 - 1), P-224 sigma = 3, P-384 sigma = 5 - all far below the null;
    brainpoolP256r1 and brainpoolP384r1 have sigma > 8 (search exhausted),
    indistinguishable from the null, as SHA-1 derivation requires. FRP256v1's sigma
    IS GENUINELY UNKNOWN TO THIS SESSION. THE TWO READINGS ARE PRE-REGISTERED AND
    ONE OF THEM IS EXPLICITLY UNINFORMATIVE: sigma <= 8 would mean FRP256v1's prime
    has an efficiency-driven Solinas-like shape that IS an explanation of a kind,
    contradicting "no explanation provided" on the prime at least, and would be a
    real finding; sigma > 8, matching both the Brainpool primes and the random null,
    is consistent with hash derivation AND with free choice AND with a rule I have
    not thought of, and therefore DISCRIMINATES NOTHING. Registering the
    uninformative branch in advance is what stops it being written up as evidence.

  mechanism: >-
    THE TRACKED OBJECT is the MEMBERSHIP VECTOR of a parameter tuple in the reachable
    images of the published generation procedures:
      M(curve) = ( [tuple in image of NIST C.3.1 restricted to D],
                   [tuple in image of RFC 5639 A.1/A.2 restricted to D],
                   [base point is x-minimal],
                   [sigma(p) <= 8] ),
    a four-bit vector, together with the declared dictionary size |D| that scopes the
    first two components.

    LOSSY-PROJECTION TEST, applied BEFORE any experiment, and here it has an unusual
    and important wrinkle.
    WHAT IS DISCARDED. A 256-bit prime, a 256-bit coefficient, a 512-bit base point
    and a 256-bit order - about 1300 bits - collapse to four bits. Nothing about the
    curve survives.
    IS IT A CHANGE OF COORDINATES? No. The fibre over the all-false vector is
    essentially the whole parameter space, since the overwhelming majority of curves
    are in no procedure's image, have a non-minimal base point and a dense prime.
    Nothing is recoverable.
    IS THE DISCARD COMPATIBLE WITH THE OPERATIONS? THE OPERATION HERE IS NOT
    ALGEBRAIC - it is EXTENSION OF THE DICTIONARY, D -> D'. The projection propagates
    deterministically and MONOTONICALLY under it: the first two components can only
    go from false to true as D grows, never the reverse. That monotonicity is the
    whole epistemic content of the object and it is what makes a null result a
    BOUNDED statement rather than a conclusion - the bit is indexed by |D| and
    changes meaning when |D| does. The third and fourth components are D-independent
    and are exact. PASSES, and it passes for the specific reason that the object
    carries its own scope parameter.
    WHERE IT DISSOLVES. At the boundary of D, and that boundary is a chosen number
    rather than a mathematical fact. THIS IS THE OBJECT'S DEFINING WEAKNESS AND IT IS
    STATED FIRST RATHER THAN LAST: no dictionary sweep can ever exclude a seed, and
    the seed space is 2^160 while any feasible D is about 2^27, so the sweep covers a
    fraction of about 2^{-133} and the phrase "we found no seed" must always be
    written as "no seed in a declared set of size |D|".

    WHY THIS IS THE RIGHT OBJECT FOR AN ABSENCE. The obvious object for a rigidity
    audit is the generation transcript, and for FRP256v1 there is none - which is
    presumably why this RQ has no proposals. The membership vector is a strictly
    lossier projection that is nevertheless DEFINED in the absence of a transcript,
    because it asks about the images of OTHER procedures. That substitution is the
    entire idea and it is the only way this row becomes executable at all.

    THE THREE-REGIME CONTRAST, WHICH IS WHAT THIS SIX-CURVE GROUP IS ACTUALLY ABOUT.
    Running the same four-bit instrument across all six curves produces a table whose
    rows are provenance regimes, not curves:
      NIST P-224/256/384 - a published seed, a published verification predicate
        binding 1 of 7 quantities, a rejection count that is NOT recoverable because
        the procedure RESTARTS with an arbitrary new seed rather than incrementing,
        and a sparse Solinas prime chosen for efficiency and not covered by the seed.
      brainpoolP256t1/384t1 - a published procedure with ZERO free inputs, seeds
        derived from Pi and e, a rejection count that IS recoverable because the
        procedure INCREMENTS, a dense hash-derived prime, and a base point derived by
        a published rule from the minimal-x point.
      ANSSI FRP256v1 - nothing published.
    NO INFERENCE ABOUT ANY DESIGNER FOLLOWS FROM THAT TABLE. What follows is an
    inventory of what a third party can check, which is what SafeCurves' rigidity
    criterion is for and what this program has never assembled.

    EXECUTION. Step 1, compute p mod 4 - one operation, and it may kill (C) outright.
    Step 2, the documentary inventory: grep the frozen package for an ANSSI source,
    record the result, and record the coverage counts for all three regimes. Step 3,
    freeze and publish D with its exact construction and size BEFORE any search. Step
    4, run the NIST-image sweep. Step 5, run the Brainpool-image sweep if (C)
    survives Step 1. Step 6, the minimality battery with the Curve25519 firing
    control. Step 7, sigma(p) on six primes plus the null. Step 8, publish the
    membership vector with |D| attached to every D-dependent bit.

