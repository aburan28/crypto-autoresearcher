  claim: >-
    On the repository's folded pair-state index calculus at n=83 (K1271..K1798
    bases, 4-8 GiB root tables) and at the section-23 sizes: (1) the per-target
    probe count at a fixed base is geometric with mean r/(A*#states): CV in
    [0.9, 1.1] and median/mean in [0.6, 0.8] over >= 64 targets; (2) IC ns per
    probe equals the host's measured random-access latency over an array of the
    table's byte size (pointer-chase null object, same page size, no arithmetic)
    plus a fixed compute term, within a factor 2; (3) across hosts, IC ns/probe
    varies with the null-object latency while the tuned walk's ns/step varies by
    < 1.3x, so the IC/rho online ratio normalised by the host's pointer-chase
    latency has a cross-host spread <= 1.5x where the raw ratio spreads >= 3x;
    (4) transparent huge pages (2 MiB) on the root table cut IC ns/probe by
    >= 1.5x on a VM host and change rho ns/step by < 5%.
  mechanism: >-
    Each probe canonicalizes a walked x and looks it up in a table larger than
    any cache; on 4 KiB/16 KiB pages a random access over 8 GiB misses the TLB
    as well as every cache level, and on a VM with nested paging a TLB miss
    costs a two-dimensional page walk (recalled: roughly 2-3x the bare-metal
    walk). A rho step is CLMUL arithmetic on registers with a DP table touched
    once per 2^d steps. So the IC interval is latency x probes, the rho interval
    is compute x steps, and the ratio of the two carries the host's memory
    subsystem as a multiplicative factor that no isolation receipt (CPU pinning,
    PSI gate) controls. The probe count is geometric because the walked target
    is memoryless on the quotient, so single-point ratios inherit an
    exponential's spread: a 16-point interval of width ~7x is what the model
    predicts, and a one-point "IC wins by 8x" is uninformative.
