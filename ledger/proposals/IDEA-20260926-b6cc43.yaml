    - metric: >-
        closure work (rows eliminated to certificate at D <= 5), ball arm
        divided by subspace arm, unsatisfiable targets, n = 17, m = 2
      direction: higher
      minimum_effect: >-
        H_dear predicts a ratio above 2 with the D <= 5 refutation rate on
        the ball arm BELOW the subspace arm's (KN-FIND-5a8d3e reports
        400/400 at D = 4 for RC-1); H_cheap predicts a ratio within [0.5,
