        are fixed before any run.
    - metric: >-
        refutation rate of the support-guessing arm (ISD-style) relative to
        the subspace arm, same cell
      direction: same
      minimum_effect: >-
        Within [0.5, 2] per support guess; used to separate constraint
        degree from block size, no directional claim beyond that.
  minimal_test:
    design: >-
      CELL A. RC-1 exactly: n = 17, f = t^17 + t^3 + 1, ordinary curve
      A = 97044, B = 126251, m = 2, subspace V = {deg < 9} (|V| = 512),
      targets in the x(2E) subgroup as in EXP-CERTBIN-e94b27 (DEC-20260926-
      cb4487 SUPPORT). Ball arm on the same curve and field: construct a
      normal basis of F_{2^17} (search for a normal element, verify the 17
      conjugates are independent and that squaring is the rotation), take
      B_3 (|B_3| = 1 + 17 + 136 + 680 = 834, this session's count) as the
      matched ball (within a factor 2 of 512; B_2 = 154 as a second,
      smaller ball). Random-set arm: 834 abscissae drawn uniformly, seed
      recorded, membership by table. Support-guess arm: B_3 with the
      weight-3 support enumerated (C(17,3) = 680 guesses, each a 3-bit
      affine block).
      CELL B. Koblitz E_0 over F_{2^19}, order 4 * 130873 (this session's
      trace recursion, to be re-checked), same three arms with a general
      normal basis of F_{2^19} and B_3 (|B_3| = 1 + 19 + 171 + 969 = 1160,
      this session's count) against a random subspace of dimension 10;
      plus the BRIEF's ordinary n = 19 cell (A = 46693, B = 306147) as the
      no-Frobenius control. On the Koblitz cell, additionally count
      relations per solve with the orbit reduction (must be exactly 19 per
      distinct orbit hit).
      Targets: 200 per arm per cell, seeds 2026092651..; instrument:
      experiments/EXP-CERTBIN-e94b27/impl/ (gf2n.py, curve.py, macaulay.py
      generalised to n = 19 and to a supplied basis, closure.py with the
      cardinality equations added as extra rows, oracles_rc1.py for the
      exhaustive ground truth over the ball). `missing: WDSat / CaDiCaL`
      for a native-cardinality SAT arm, which is declared as a follow-up
      and not assumed.
      STAGE 0 (zero compute): re-derive the ball sizes, the even-weight
      fact, and the n = 19 order; write the falsification bands.
      STAGE 1: instrument control -- run the unchanged RC-1 pipeline on
      RC-1's V and reproduce its recorded closure statistics.
      STAGE 2: exhaustive oracle on every arm (decomposition rate,
      certificates).
      STAGE 3: closure at D <= 5 on every arm; record rows eliminated,
      refutation rate, certificate acceptance by the separate verifier.
      STAGE 4: three-row reading.
      OUTCOME TABLE. POSITIVE (H_cheap): ball/subspace closure-work ratio in
      [0.5, 2] with equal refutation rate at D <= 5, oracle rates equal
      across arms, Koblitz orbit count exactly 19 -- the ball is entered in
      the CERTBIN factor-base-choice column as a Frobenius-stable base with
      no shift overhead, and the n = 131 row is opened for the m = 4 solve
      question. NEGATIVE (H_dear): ratio above 2 or refutation rate below
      the subspace arm's at D <= 5 -- the ball is dominated by the subspace
      base at matched size; the obstruction is the measured cardinality
      penalty, recorded with its value. ARTIFACT: Stage 1 fails to
      reproduce RC-1, or oracle and closure disagree on any instance, or
      the Koblitz ball arm differs from the ordinary ball arm in
      per-attempt cost -- nothing is read.
      FALSIFICATION THRESHOLD, fixed before any run: the [0.5, 2] band and
      the equal-refutation-rate condition above.
      COST (estimate, order of magnitude): implementation medium (normal-
      basis constructor, basis-general descent, cardinality rows, a few
      hundred lines on the existing modules); compute low, the exhaustive
      oracle over 834 or 1160 abscissae times 200 targets is seconds, the
      closure at D <= 5 with 34 or 38 unknowns is minutes per arm in pure
      Python -- an estimate, not a measurement.
    controls:
      - >-
        Instrument control: RC-1 reproduced on RC-1's own V before any ball
        cell (blocking).
      - >-
        Null object of the same shape: a random abscissa set of the same
        cardinality with table membership (fixes the enumeration floor).
      - >-
        Size-matched subspace arm (RC-1's V at n = 17; a random dimension-10
        subspace at n = 19).
      - >-
        Ordinary curve of the same n as the no-Frobenius control (the ball
        exists, the orbit reduction does not).
      - >-
        Relabelled Z/NZ control: not applicable to the per-attempt cost
        (a coordinate object has no Z/NZ analogue) and applicable to the
        yield only, where a random subset of Z/NZ of the same size must
        reproduce the oracle decomposition rate; run for the yield metric.
      - >-
        Certificates: curve-arithmetic verification of every decomposition
        and separate-process verification of every refutation.
    required_metrics:
      - 'exhaustive-oracle decomposition rate per arm per cell'
      - 'closure rows eliminated and refutation rate at D <= 5 per arm'
      - 'orbit count per relation on the Koblitz cell (must be 19)'
      - 'normal-basis rotation check and ball sizes per cell'
      - 'certificate acceptance counts'
  falsification_conditions:
    - 'Stage 1 fails to reproduce RC-1: instrument defect, nothing read.'
    - 'Oracle and closure disagree on any instance in any arm: instrument defect, nothing read.'
    - 'Ball/subspace closure-work ratio above 2 or ball refutation rate below the subspace rate at D <= 5, replicated at both n: H_cheap is false and the ball is entered as dominated with the measured penalty.'
    - 'Koblitz ball arm and ordinary ball arm differ in per-attempt cost by more than 1.5x: the instrument reads the curve where the constraint is field-level; defect until explained.'
  confounders:
    - 'The ball has n free bits per block against l for the subspace; the support-guess arm separates block size from constraint degree.'
    - 'B_3 at n = 17 has 834 elements against 512 for V; the yield comparison is normalised by |F|^m and the closure comparison is reported at both B_2 and B_3.'
    - 'A general normal basis at n = 17 and 19 is not an ONB; the multiplication tensor differs from the type-2 ONB at n = 131 (IDEA-20260926-917981 names the multiplication tensor as the live confound), so per-attempt cost at toy n does not transfer.'
    - 'The closure instrument reaches D <= 5 while the target-radius constraint has degree 7; the toy radius 3 (degree 4) is inside reach and the extrapolation in w is an assumption, stated.'
  interpretation_limits:
    - 'A representation record priced at toy scale; no attack, no exponent, no run at n = 131; the n = 131 sizing is arithmetic.'
    - 'KN-OPEN-020 class declared high-degree implicit membership; the universal statement is untouched.'
    - 'Best case is a constant-factor gain (the shift overhead and the GGMP constants on a base that exists), disclosed under docs/target-result-profile.md rule A1 as building-block, not target-class.'
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Yield.) The number of m-fold decompositions of a uniform target
        over F = B_w-abscissae is |F|^m / (m! N) (1 + o(1)), as for a
        subspace base of the same size.
      rigorous_support: >-
        No rigorous bound; imitates the standard index-calculus yield
        heuristic (KN-FIND-007's yield conservation, cited through
        KN-FIND-aa2efc) applied to a non-linear set; the risk is additive
        structure in low-weight abscissae.
      validation_plan: >-
        SAMPLE: exhaustive oracle at n in {17, 19}, m = 2, 200 targets per
        arm. COMPARISON: empirical rate against |F|^2 / (2N) and against
        the random-set arm. TAIL: the largest per-target multiplicity.
        TRANSFER: to n = 131 only as the same heuristic every m = 4 row
        already uses.
    - id: H2
      statement: >-
        (Half are abscissae.) |B_w intersect x(E_0)| = |B_w| / 2 (1 + o(1))
        for w >= 2 at n = 131.
      rigorous_support: >-
        Rigorous ingredient: x is an abscissa of E_0 iff Tr(x) = Tr(1/x);
        the density-1/2 statement imitates equidistribution of the
        Kloosterman-type indicator over the ball, and IDEA-20260926-cafcf1
        states why the Weil bound does not control it at index-calculus
        sizes.
      validation_plan: >-
        SAMPLE: exact count of abscissae in B_w at n in {17, 19, 23} for
        w <= 4. COMPARISON: |B_w|/2. TAIL: the largest deviation over w.
        TRANSFER: an assumption at n = 131, stated.
  target_complexity:
    time_exponent: >-
      No exponent is claimed. At m = 4, w = 6, the ball inherits the m = 4
      row's attempts column (about 2^30 with orbits) and per-attempt budget
      (2^31 orbit-reduced; 2^4.4 under the no-orbit product law); the
      per-attempt cost is the open number and is unmeasured at n = 131.
    memory_exponent: >-
      Linear algebra on about 2^24.7 unknowns (|B_6|/262), sparse rows of
      weight 4: GB-scale; the decomposition solve's memory is the Macaulay
      or SAT memory of a 4 x 131-bit system, unmeasured.
    best_known: >-
      Matched rho at 2^60.8 (KN-FIND-aa2efc); the orbit-union subspace base
      at m = 4 with its 2^30.6 per-solve budget (analysis/frobenius-orbit-
      ecc2k130) is the nearest sibling row.
    hidden_overhead: >-
      The cardinality constraint's degree w + 1 = 7 at the target radius,
      which the closure instrument does not reach; disclosed as the
      extrapolation in w.
    tradeoff_note: >-
      Relation collection is embarrassingly parallel; the base needs no
      table (membership is a weight count), which is a memory advantage
      over a random-set base and neutral against a subspace base.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Estimate. Pure-Python instruments on the existing CERTBIN modules;
      minutes per arm at n in {17, 19}. A native-cardinality SAT arm needs
      an engine that is not installed.
  asymptotic_claim:
    problem: ECDLP on ECC2K-130 and its prime-degree Koblitz siblings (RQ-CERTBIN-836ce2, factor-base choice)
    prior_best: Matched rho at 2^60.8; orbit-union subspace base with one-hot shift encoding, cost-neutral at m = 2 (KN-FIND-47da4e)
    time_exponent: unchanged; a constant-factor lever on the shift overhead and the GGMP constants at best
    memory_exponent: unchanged
    hidden_cofactor: the cardinality-constraint degree w + 1 at the target radius
    claim_kind: representation_cost_measurement
  dominated_by: >-
    CHECKED ROW BY ROW. Matched rho at 2^60.8 dominates every m = 4 row
    until a per-attempt solve under 2^31 (orbit-reduced) is demonstrated,
    which no instrument has done at n = 131 (analysis/frobenius-orbit-
    ecc2k130 part 2 stops at n = 23 and censors at 131). Within the
    factor-base-choice column: the orbit-union subspace base (KN-FIND-
    47da4e) is the sibling this record must beat on per-attempt cost by
    more than its 1.0-1.5x shift overhead to be preferred; the QSP rows are
    void (IDEA-20260916-3f7a1c); the plain subspace base has no orbit
    reduction at n = 131 (no stable subspace) and is dominated by 131 on
    relations by any stable base of equal per-attempt cost. The record
    claims no row of its own until measured.
  sota_delta:
    time: >-
      Zero exponent. Contribution: the first Frobenius-stable factor base
      of index-calculus size at n = 131 with O(1) description and no shift
      encoding, and the identification of Bailey et al.'s DP predicate as
      the radius-34 member of the family.
    memory: zero
    data_queries: >-
      Against this program's prior state: the open direction named in
      KN-FIND-47da4e ("changes the coordinate blocks rather than the index
      over shifts") is given a concrete object and a priced test.
  frontier_check:
    status: pending
    note: >-
      No web search was run. Weight-bounded factor bases resemble
      low-weight-codeword / information-set-decoding formulations and may
      have been proposed for Semaev decomposition; a reviewer with
      retrieval should check before this record is cited as new.
  recommended_priority: medium
  priority_rationale: >-
    Constant-factor at best and disclosed as such, but it is the one
    object in this seam that is genuinely new to the corpus, passes the
    lossy-projection test against a named Sigma, exists at n = 131 where
    the linear stable bases do not, answers the open direction of
    KN-FIND-47da4e, and is measurable in minutes on installed instruments
    with three matched controls. Its negative outcome is a measured
    obstruction (the cardinality penalty), which is the closure standard.
  first_deliverable: >-
    Stage 0 (ball sizes, even-weight fact, n = 19 order re-derived) and the
    normal-basis constructor with the rotation check, then Stage 1's RC-1
    reproduction.
  next_gate: >-
    Coordinator decision on designing Cells A and B into an EXP-CERTBIN-*
    contract, and on whether a native-cardinality SAT arm is worth
    installing an engine for.
  discriminated_from: >-
    KN-FIND-47da4e and analysis/frobenius-orbit-ecc2k130 build orbit unions
    of subspaces with a shift index; this record's base is rotation-closed
    by construction and has no shift index. IDEA-20260922-6237e5 (HOLD-V)
    asks whether the DP SAMPLE correlates with decomposability; this record
    uses the DP PREDICATE as a factor-base description and needs no
    correlation. IDEA-20260922-7ab503 uses the normal basis to expose a
    solver symmetry on subspace bases; this record uses it to define a
    non-linear base. IDEA-20260926-917981 (same day, G2 lane) proves closure
    outcomes depend only on the set V; this record varies the SET, which
    is exactly the axis that proposition leaves live.
