idea:
  id: IDEA-20260926-b6cc43
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    THE HAMMING BALL IN A NORMAL BASIS IS THE FROBENIUS-STABLE FACTOR BASE
    THAT EXISTS AT n = 131 WITHOUT SHIFT VARIABLES: HW(x) is rotation-invariant
    in Bailey et al.'s own type-2 normal basis, so B_w = {x : HW(x) <= w} is
    an orbit union with O(1) description, 131-bit membership and no one-hot
    encoding, sized 2^32.7 at w = 6 for m = 4; the radius-34 ball is the
    distinguished-point predicate itself. Priced by cardinality-constrained
    descent against a size-matched subspace and a random set
  class: representation
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (the field element in a
    normal basis, where the 2-Frobenius is the cyclic shift of the 131
    coordinates); the attack stages whose charged cost changes are
    FACTOR-BASE MEMBERSHIP (a weight count instead of a subspace test or a
    one-hot shift search) and RELATION DECOMPOSITION (a cardinality-
    constrained descended system instead of an affine-constrained one).
    (A) THE OBJECT. In any normal basis {alpha^{2^j}} of F_{2^131}, squaring
    is the cyclic rotation of coordinates, so the Hamming weight HW(x) is
    Frobenius-invariant and B_w = {x : HW(x) <= w} is a union of Frobenius
    orbits. At n = 131 the only Frobenius-stable SUBSPACES have dimensions
    0, 1, 130, 131 (IDEA-20260918-9abf42, KN-OPEN-095df5); orbit UNIONS of
    subspaces exist but need a (representative, shift) parameterisation
    measured cost-neutral with a one-hot overhead (KN-FIND-47da4e), and that
    finding names as open exactly "any use of the orbit structure that
    changes the coordinate BLOCKS rather than the index over shifts". B_w is
    that use: its membership is a weight count (131 bit operations), its
    description is the integer w, and the descended decomposition system
    carries NO shift variables because the constraint set is itself
    rotation-closed. Sizes at n = 131, this session's arithmetic:
    C(131,6) about 2^32.5, so |B_6| about 2^32.7 (m = 4 balanced size
    2^{131/4} = 2^32.75); C(131,7) about 2^36.7 (|B_7| about 2^36.8);
    C(131,13) about 2^58 and |B_16| about 2^67 (the m = 2 size, dead on
    linear algebra as every m = 2 row is). On E_0 about half of B_w are
    abscissae (claim of IDEA-20260926-cafcf1, Tr(x) = Tr(1/x)), and in a
    normal basis Tr(x) = HW(x) mod 2 (Tr of a normal element is 1), so
    points of the prime-order subgroup G have EVEN weight, exactly as
    Bailey et al. observe for their distinguished points.
    (B) THE DISTINGUISHED-POINT CONNECTION, WHICH IS THE USE OF THE 2^33
    COLLECTED DPs THAT SURVIVES HOLD-V's NULL. KN-LIT-661e97's DP predicate
    is HW(x) <= 34 in the type-2 normal basis, i.e. membership in B_34
    (size about 2^115, far too large for a factor base). The 2^33 collected
    DPs are a sample of B_34 whose logarithms are recoverable by seed replay
    at about 2^25.3 iterations each. This record does NOT ask whether DPs
    correlate with decomposability (IDEA-20260922-6237e5, HOLD-V, expected
    null); it uses the DP PREDICATE, at the radius where the ball has
    index-calculus size, as the factor-base description. The DP data itself
    is unusable (private, hashed, KN-LIT-661e97) and is not needed.
    (C) THE CHARGED QUESTION. Fix m = 4, |F| about 2^32.7 (w = 6). The
    orbit reduction of GGMP (KN-LIT-796, gain exactly n on relations and
    n^2 on linear algebra, verified at n = 131 by analysis/frobenius-orbit-
    ecc2k130 part D) applies to B_w with no encoding overhead. The attempts
    column is the same as for any |F| = 2^32.7 base at m = 4 (about 2^30
    with orbits, analysis/qsp-ecc2k130/table.md row (33, 3, 4, 131) as
    cited by IDEA-20260916-a17f43), so the per-attempt budget to tie rho is
    about 2^31 field operations under the orbit-reduced accounting
    (analysis/frobenius-orbit-ecc2k130 README part 1 gives 2^30.6 at
    m = 4) and about 2^4.4 under the no-orbit product law of BRIEF section
    2 (KN-FIND-aa2efc, unreviewed). The ONE open number is the per-attempt
    cost of a decomposition solve whose factor-base constraint is
    "HW(x_i) <= w" (four cardinality constraints on 131-bit blocks, each
    expressible as the elementary symmetric polynomials e_{w+1}, ..., of
    the bits vanishing, degree w + 1) instead of "x_i in V" (affine,
    degree 1, 33 free bits per block). TWO EXPLANATIONS. (H_cheap) the
    cardinality constraint costs the solver no more than the affine one at
    matched |F|, so B_w is a free Frobenius-stable base at n = 131 with the
    n and n^2 gains and none of the one-hot overhead: a constant-factor
    saving of up to 131 on relations over a plain subspace base, and the
    first Frobenius-stable base of index-calculus size that exists at the
    target degree. (H_dear) the cardinality constraint is materially harder
    for the degree-bounded closure instrument (its degree is w + 1 = 7 at
    the target radius, against the D <= 5 the instrument reaches) and for
    CDCL (no unit propagation through a weight bound), so the per-attempt
    cost exceeds the subspace cell by more than the factor 131 the orbit
    reduction returns, and B_w is dominated by the subspace base it
    replaces. Either outcome is a measured number for the CERTBIN cost
    table's factor-base-choice column (decision target (2) of
    RQ-CERTBIN-836ce2).
    WHAT EACH OUTCOME MEANS. Positive (H_cheap): the reachability table gets
    a Frobenius-stable m = 4 row at n = 131 whose per-attempt budget is the
    orbit-reduced 2^31, not the no-orbit 2^4.4; that row is still bounded
    by the algebraic-solve cost of S_5 in 131-bit unknowns, which this
    program has never measured (analysis/frobenius-orbit-ecc2k130 part 2
    stops at n = 23), and no exponent moves. Negative (H_dear): the ball is
    entered as dominated, with the measured cardinality penalty as the
    named obstruction. Artifact: the random-set control (same cardinality,
    no structure, membership by table) disagrees with the exhaustive
    ground truth or the certificate fails.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the normal-basis coordinate vector of
    x (Bailey et al.'s type-2 optimal normal basis at n = 131; a general
    normal basis at toy n where no ONB exists). Operation set Sigma =
    {sigma (rotation), negation} together with translation by factor-base
    elements INSIDE the decomposition (the Class I partial action index
    calculus already has). Trichotomy: Class I, PARTIAL-ACTION -- the
    tracked object is the relation vector over B_w / <sigma, -1>, which
    propagates deterministically only under translation by elements of B_w,
    exactly as in every F2 line; the record introduces no new class and
    says so. What is new is the factor-base DESCRIPTION, not the tracked
    object.
    LOSSY-PROJECTION TEST AGAINST SIGMA. The projection x -> (necklace of
    its normal-basis vector) discards the rotation index (131 to 1 for x
    outside F_2) and the sign; it is compatible with Sigma because rotation
    and negation act trivially on the necklace, and it is lossy in the
    representation used because distinct conjugates share a necklace.
    B_w is a union of necklace classes with a cheap invariant (weight); the
    factor base for linear algebra is B_w modulo Sigma, of size about
    |B_w| / 262.
    PRICE THE ONE OPEN NUMBER. Canonicalising a Sigma-orbit costs 131
    rotations and a lexicographic minimum (Bailey et al.'s own
    normalisation, about 131^2 bit operations); that is charged and is
    negligible. The number that decides the object is the per-attempt
    decomposition cost under the cardinality constraint, measured in the
    minimal test against three controls.
    KN-OPEN-020 CLASS: HIGH-DEGREE IMPLICIT MEMBERSHIP. Description: the
    integer w (O(1) bits). Membership: one weight count, 131 bit
    operations, target-independent. Relation: one decomposition solve of
    the cardinality-constrained system. Descent: the target's own
    decomposition, same system. Time and memory: the linear algebra runs on
    |B_w|/262 unknowns of weight m (about 2^24.7 at w = 6), sparse, in
    about 2^49 field operations by Wiedemann -- below rho -- so the
    decomposition solve is the only open column, as for every m = 4 row.
    OFF-LIMITS COMPONENTS DECLARED. F2 is the family. The Frobenius orbit
    reduction (GGMP constants n and n^2; RQ-FROB-7d8dd4's lens) is a
    component: what is added is a base on which it applies with NO shift
    encoding at the one degree where no stable subspace exists. F1 (rho)
    supplies only the DP predicate as a description, never as the lens.
    WHY THE CURVE ENTERS. The ball is defined on the field, not the curve;
    the curve enters through the abscissa condition (half of B_w) and
    through the even-weight structure of G (Tr(a) = 0 on E_0). The ordinary
    control of the same field with a generic b has the same ball and a
    different abscissa half; the difference between them is the null
    object for anything the Koblitz structure appears to buy beyond the
    orbit reduction, which the ordinary curve lacks entirely (no sigma
    endomorphism).
