    No web search was run this session. The ball sizes (C(131,6) about
    2^32.5, C(131,7) about 2^36.7) and the toy ball sizes are this
    session's hand arithmetic and must be re-derived. Whether a
    weight-bounded factor base for Semaev decomposition appears in the
    external literature (it resembles low-weight-codeword and ISD
    formulations) was not checked.
  assumptions:
    - >-
      A normal basis of F_{2^n} is constructed for each toy n (the normal
      basis theorem guarantees one; a type-II ONB exists at n = 23); the
      basis and the Frobenius-rotation check are recorded per cell.
    - >-
      OFF-LIMITS COMPONENTS DECLARED: F2 as the family, the GGMP orbit
      reduction as a component, F1 only as the source of the DP predicate.
    - >-
      The per-attempt budgets quoted (2^31 orbit-reduced, 2^4.4 no-orbit)
      are two accountings of the same m = 4 row and are cited with their
      sources; this record does not adjudicate between them.
  proof_search_map:
    bottleneck: >-
      The per-attempt decomposition cost under a cardinality constraint of
      degree w + 1 on each 131-bit block, against the affine constraint of
      a subspace base of the same size.
    baseline_embedding:
      parameter_slice: >-
        w = n (the whole field) is the trivial base; w = 1 is B_1 = {0,
        alpha^{2^j}} = the 132 elements of weight <= 1, an orbit union of
        two orbits; the RC-1 subspace cell (n = 17, l = 9, V = {deg < 9} in
        the polynomial basis) is the affine slice the ball cell must be
        compared against at matched size.
      reproduction_check: >-
        The instrument must reproduce RC-1's own statistics (KN-FIND-5a8d3e,
        DEC-20260926-cb4487) when run on RC-1's V, before any ball cell is
        read; and the exhaustive oracle must agree with the closure verdict
        on every ball instance, as it does on RC-1.
    observation_collision:
      observable: >-
        Per-attempt closure work (rows eliminated to certificate) and
        refutation rate at D <= 5, per factor-base arm, at matched |F|.
      distinct_preimage_search: >-
        A ball arm that looks dearer could be dearer because (i) the
        constraint degree w + 1 exceeds the closure degree (genuine
        H_dear), or (ii) the ball has more free bits per block (n instead
        of l) and the Macaulay matrix is simply larger. Separated by the
        THIRD arm, the ball encoded with its own bits eliminated to the
        weight-w support (an ISD-style guess of the support, n choose w
        cases), which has the same free-bit count as the subspace arm.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "x_i in V" (l affine bits per block) by "x_i in B_w"
          (n bits per block plus the equations e_{w+1}(b) = ... = e_n(b) =
          0, or a native cardinality constraint in a SAT encoding).
          Completeness: every decomposition over B_w is a solution.
          Soundness: every solution is re-verified by curve arithmetic.
          Transfer: any n with a normal basis. Cost loss: the constraint
          degree w + 1 and the larger block; both measured.
        predicted_gain: >-
          Removal of the one-hot shift blocks (KN-FIND-47da4e's 1.0-1.5x
          and the 131 shift bits per summand) and the GGMP constants on a
          base that exists at n = 131; no exponent.
      - transform: observable_fiber
        proposed_object: >-
          Hold |F| fixed and vary the description: subspace, ball, random
          set. The random set (membership by table only) has no algebraic
          description and can only be decomposed by enumeration; it fixes
          the enumeration floor every arm must beat to be worth anything.
        predicted_gain: >-
          Separates "the ball is a usable algebraic description" from "the
          ball is as opaque as a random set".
    quantifier_order: >-
      EXISTS a toy cell (n = 17 or 19, m = 2, w with |B_w| within a factor 2
      of 2^l) at which the ball arm's per-attempt closure work and
      refutation rate are measured against the subspace and random-set
      arms. The record makes NO forall claim; H_cheap and H_dear are the
      two readings of the measured ratio, and the n = 131 sizing in claim
      (A) is arithmetic only.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At n in {17, 19}, m = 2, matched |F|, the cardinality-constrained
        descended system costs [ratio] of the subspace system in closure
        work at D <= 5, refutes [rate] of unsatisfiable instances against
        the subspace arm's [rate], and the random-set arm is decomposable
        only by enumeration." It certifies nothing about m = 4, w = 6, or
        n = 131, and nothing about a SAT engine with native cardinality
        reasoning, which is not installed.
      nearby_object_control: >-
        BLOCKING. The ordinary curve of the same n (RC-1's own curve at
        n = 17; the BRIEF's n = 19 cell) has no Frobenius endomorphism, so
        the ball is Frobenius-stable as a SET but the orbit reduction of
        relations does not exist; the ball arm on the ordinary curve must
        show the same per-attempt cost as on the Koblitz curve (the
        constraint is field-level) and NO relation multiplication. If the
        Koblitz ball arm shows a per-attempt cost difference from the
        ordinary ball arm, the instrument reads the curve where it should
        not.
    proof_obligations:
      - claim: HW is rotation-invariant in any normal basis, so B_w is an orbit union.
        responsibility: correctness
      - claim: Tr(x) = HW(x) mod 2 in a normal basis, so points of G have even weight (matches KN-LIT-661e97).
        responsibility: baseline
      - claim: The ball sizes at n = 131 and at the toy n are re-derived exactly.
        responsibility: size
      - claim: The instrument reproduces RC-1 on RC-1's own V before any ball cell is read.
        responsibility: baseline
      - claim: Every counted decomposition carries a curve-arithmetic certificate; every refutation carries a closure certificate accepted by the separate verifier.
        responsibility: correctness
      - claim: The three arms are at matched |F| within a factor 2, and the random-set arm is matched in cardinality exactly.
        responsibility: interface
      - claim: No exponent is claimed; the n = 131 row is arithmetic.
        responsibility: scope
  predictions:
    - metric: >-
        exhaustive-oracle decomposition rate (fraction of targets with at
        least one m = 2 decomposition), per arm, n = 17, matched |F|
      direction: same
      minimum_effect: >-
        Within sampling error across subspace, ball and random-set arms
