idea:
  id: IDEA-20260829-a250ee
  question_id: RQ-ECDLP-912694
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  class: control

  title: >-
    THE RQ'S OWN THIRD CONTROL CELL IS PROVABLY EMPTY: for an ORDINARY curve over ANY
    finite field, End is commutative and contains Frobenius, so EVERY endomorphism -
    hence every automorphism - is automatically base-field-rational; therefore
    "extension-field special-j controls where the named automorphism is not
    F_p-rational" cannot be instantiated anywhere inside this RQ's ordinary-only
    scope, the non-rationality explanation for a null discount is UNAVAILABLE, and the
    control must be replaced by two objects that do exist.

  object: >-
    TRACKED OBJECT. The RATIONALITY DEFECT of an automorphism, defined as delta(E)
    equal to the order of the geometric automorphism group divided by the order of the
    base-field-rational automorphism group, an integer in {1, 2, 3, 4, 6} tracked per
    curve. Everything else about the curve is discarded; one small integer is
    retained. Established families declared OFF-LIMITS as the primary lens for this
    record: the automorphism-ORDER function (IDEA-20260812-c49409 - this record tracks
    the RATIO, not the order, and the two differ exactly on the cell in dispute), the
    rho discount (KN-TECH-018), Semaev degeneration screens (RQ-JINV-8fc13a family),
    and the Cl(O)-torsor functional (IDEA-20260826-228fa6). Candidates enumerated and
    scored on (new / one-step propagation definable and measurable / survival depth):
    the rational automorphism order alone (already the lane's lens, and it cannot see
    the defect because it never computes the geometric group); the twist class in the
    first Galois cohomology of the automorphism group (interesting, testable, but it
    measures which twist you took, not whether the automorphism is rational, and it
    dissolves for ordinary curves for the same reason delta does); the RATIONALITY
    DEFECT delta (new in this corpus / testable by two independent group computations,
    one over the base field and one over a splitting extension / survives exactly zero
    steps in the ordinary world because it is constantly 1 - which IS the finding, and
    a constant function is the cleanest possible closure object); Frobenius as an
    element of End (known, and it is the PROOF rather than the object). KN-OPEN-019
    applies: sketch, not taxonomy.

  lossy_projection_test: >-
    delta discards the curve, the field, the group order and the j-invariant, keeping
    a single divisor of 6, so it is maximally lossy. Compatibility with the target's
    operations is the delicate part and it is where the result lives: an F_q-rational
    isogeny does NOT preserve delta in general, since a curve and its codomain may
    have different automorphism groups, so delta does not propagate along isogenies as
    a homomorphic invariant. What it DOES propagate along is base change - the defect
    over an extension divides the defect over the base field - and that is the
    operation this record's claim concerns. So the projection is lossy and it is
    compatible with the one operation it is used under, and incompatible with isogeny,
    and the record uses it only under base change. Stating the incompatibility is part
    of passing the test, not a caveat appended to it. It is not a change of
    coordinates: from delta one recovers nothing about the curve.

  claim: >-
    Four statements, R1-R4, of which R1 is a derivation, R2 is a scope finding about
    this RQ, R3 is the replacement design, and R4 is a second, independent scope
    finding.

    (R1) NO ORDINARY AUTOMORPHISM IS IRRATIONAL. Let E/F_q be ORDINARY. Then the
    geometric endomorphism ring is an order in an imaginary quadratic field, hence
    COMMUTATIVE, and it contains the q-power Frobenius endomorphism pi. An
    endomorphism phi is defined over F_q if and only if it commutes with pi.
    Commutativity is automatic. Therefore the rational and geometric endomorphism rings
    coincide, and in particular the rational and geometric automorphism groups
    coincide, i.e. delta(E) = 1 for every ordinary E over every finite field.
    Corollary, checked for consistency: an ordinary j = 0 curve over F_q forces a
    primitive cube root of unity to lie in F_q, hence q congruent to 1 mod 3 - which is
    exactly the ordinariness condition for j = 0, so the two routes agree and neither
    is circular.

    (R2) THE SCOPE FINDING. RQ-ECDLP-912694's declared scope lists three curve
    families, the third being "extension-field special-j controls where the named
    automorphism is not F_p-rational". Its constraints simultaneously declare
    "Ordinary curves only; supersingular and extension-field-only maps are out of
    scope." By R1 the third family is EMPTY: there is no ordinary curve, over a prime
    field or over any extension, whose extra automorphism fails to be rational over its
    own base field. Non-rational automorphisms require non-commutative End, i.e.
    supersingular curves, which the same constraint list excludes. The RQ therefore
    names a control it forbids itself from instantiating. This is not a drafting nit:
    IDEA-20260812-c49409 lists "an automorphism defined only over an extension gives no
    rho discount over F_p" as a live assumption and names the extension-field control
    as the demonstration of it, so a null result there is currently ATTRIBUTABLE to a
    cause that cannot occur - and a live but impossible explanation is worse than no
    explanation, because it absorbs a negative that should have been charged to
    implementation.

    (R3) THE REPLACEMENT, which must do the job the empty cell was meant to do. The
    empty control was meant to discriminate "no discount because the symmetry is not
    available over F_p" from "no discount because the mechanism is wrong". Two objects
    that EXIST and split that question. (a) SUPERSINGULAR j = 0 or j = 1728 over F_p
    with p congruent to 2 mod 3, respectively 3 mod 4. Here End IS non-commutative,
    delta greater than 1 is genuinely possible, and the automorphism is genuinely not
    F_p-rational. This is the ONLY object that instantiates the RQ's intended control,
    and taking it requires an explicit Coordinator scope decision because the RQ
    excludes supersingular curves. (b) ORDINARY CURVES WITH A SMALL-DEGREE BUT
    NON-INVERTIBLE ENDOMORPHISM, namely D_K in {-7, -8, -11}, where an endomorphism of
    norm 2 or 3 exists, the automorphism group has order 2, and no rho discount is
    predicted. This separates "the discount needs an INVERTIBLE map" from "the discount
    needs a CHEAP map", inside the RQ's declared ordinary scope, at zero scope cost.
    IDEA-20260812-c49409 already names (b) as its mandatory null; this record's
    contribution is that (b) must now carry the load that (a) was silently assumed to
    share, and that (a) is unavailable without a scope decision.

    (R4) A SECOND, INDEPENDENT SCOPE ASYMMETRY IN THE SAME RQ. The RQ restricts to odd
    prime degrees. For j = 0 with D_K = -3, the ramified prime is 3, which is odd and
    in scope. For j = 1728 with D_K = -4, the ramified prime is 2, which is EXCLUDED.
    So the two declared arms are not symmetric: the j = 0 arm can observe ramified
    behaviour and the j = 1728 arm structurally cannot. Any side-by-side comparison of
    the two arms that does not correct for this will read a scope artifact as an
    arithmetic difference between the discriminants.

  mechanism: >-
    Rationality of an endomorphism over the base field is exactly commutation with
    Frobenius. For ordinary curves the endomorphism algebra is an imaginary quadratic
    field, so commutation is free and rationality is automatic; the only way to
    manufacture an irrational endomorphism is to make the algebra non-commutative,
    which for elliptic curves over finite fields means supersingular and a quaternion
    order. The RQ's third control family therefore sits precisely at the intersection
    of two conditions it declares to be mutually exclusive. The mechanism is a one-line
    commutativity argument, it costs no compute, and it is the cheapest kind of finding
    this program can produce: a control that was going to be built, run, and then
    reported as an unexplained empty cell, closed by algebra before any machine time is
    spent.

  novelty_status: unverified
  novelty_note: >-
    R1 IS CLASSICAL AND IS NOT CLAIMED AS NEW. That the rational and geometric
    endomorphism rings coincide for ordinary elliptic curves over finite fields is
    standard - Waterhouse, and Lenstra's complex-multiplication structure paper, and
    any treatment of the Deuring correspondence - and it is recalled here rather than
    verified, since no external source was opened this session for it, which is why the
    argument is reproduced in full so a reviewer can check it without a library. The
    contribution is entirely INTERNAL and entirely about this repository: R2, that a
    declared control cell in a committed ledger question is empty; R3, the replacement
    design; and R4, a second scope asymmetry in the same record. Corpus checked on
    2026-08-29 by full read of ledger/questions/RQ-ECDLP-912694.yaml and
    ledger/proposals/IDEA-20260812-c49409.yaml, plus title-level review of all 35
    RQ-JINV-8fc13a proposals and all 19 RQ-ICINV-475b5e proposals: no record states R1,
    R2 or R4. IDEA-20260812-c49409 lists the F_p-rationality of the automorphism as an
    ASSUMPTION and cites the RQ's extension-field control as its demonstration - so the
    corpus currently treats a provable fact as an assumption and points at an empty
    cell to discharge it. That is the specific defect this record closes.

