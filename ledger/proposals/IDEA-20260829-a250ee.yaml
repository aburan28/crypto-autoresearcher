  assumptions:
    - >-
      Characteristic of the field is neither 2 nor 3, so that the automorphism group
      has order 2, 4 or 6 and the j = 0 and j = 1728 classification applies. In
      characteristic 2 and 3 the automorphism groups are larger and R1's conclusion
      still holds, since the commutativity argument is characteristic-free for ordinary
      curves, but the numerology in R3 does not.
    - >-
      "Rational" means defined over the field the curve is presented over, and the
      rationality criterion used is commutation with the q-power Frobenius. This is the
      standard criterion and it is the single load-bearing external fact.
    - >-
      The automorphism group is computed as a GROUP, twice: once by exhibiting
      base-field-rational isomorphisms from the curve to itself explicitly, and once
      over a splitting extension. delta is the ratio of the two orders. Inferring the
      automorphism order from j alone would make R1 unfalsifiable by construction and
      is forbidden in the design.
    - >-
      Lawful defensive cryptanalysis on public constructions and toy benchmarks only.

  proof_search_map:
    bottleneck: >-
      Not an algorithmic bottleneck but an EVIDENTIAL one. Every null result this lane
      produces about the automorphism discount currently has two live explanations,
      namely "the symmetry is not rational here" and "the mechanism or the
      implementation is wrong", and the first is what the extension-field control was
      supposed to settle. If the first is impossible, every such null must be charged
      entirely to the second, which is a materially stronger conclusion from the same
      data. The bottleneck removed is an explanatory one, and removing it costs one
      paragraph of algebra.
    baseline_embedding:
      parameter_slice: >-
        Dropping ordinariness recovers the general case, where delta greater than 1 is
        possible and the RQ's third control family is non-empty, namely supersingular
        curves. So the RQ's intended control is recovered as the exact non-ordinary
        slice of this frame - it was never wrong, it was mis-scoped.
      reproduction_check: >-
        Frozen symbolic fixture, computed before any curve is drawn: for a
        SUPERSINGULAR j = 0 curve over F_p with p congruent to 2 mod 3, the measured
        delta must be strictly greater than 1, demonstrating that the measurement
        apparatus can detect a rationality defect at all. Without this the ordinary
        result "delta equals 1 everywhere" is unfalsifiable and worthless. This fixture
        is the positive control and it is BLOCKING.
    observation_collision:
      observable: >-
        The integer delta(E), the ratio of geometric to rational automorphism group
        order.
      distinct_preimage_search: >-
        Deliberate hunt for two curves with the same delta on opposite sides of the
        conclusion. The obvious pair: an ordinary j = 0 curve over F_p with p congruent
        to 1 mod 3, where delta = 1 and the claim says this is forced; and a generic
        ordinary curve with automorphism group of order 2, where delta = 1 trivially.
        Both read delta = 1 for completely different reasons, so delta ALONE does not
        carry the claim - the claim is carried by the pair consisting of delta and the
        rational automorphism order, and the record's metrics record both. A design
        that reported only delta would report a constant and prove nothing. This audit
        changes the required metrics.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable delta = 1 fixed and vary the forgotten structure, namely
          commutative versus non-commutative End. The intrinsic invariant
          distinguishing the resulting objects is the rank of End as a Z-module, 2
          versus 4, i.e. ordinary versus supersingular - which is exactly the
          hypothesis of R1 and exactly the boundary the RQ's constraints draw in the
          wrong place relative to its scope.
        predicted_gain: >-
          Converts an empty experimental cell into a stated boundary: the RQ's third
          control lives on the far side of the ordinary/supersingular line, and no
          amount of enumeration inside the ordinary world will populate it.
      - transform: boundary_lift
        proposed_object: >-
          Lift IDEA-20260812-c49409's ASSUMPTION that the congruence conditions make
          the automorphisms F_p-rational, to a THEOREM that for ordinary curves the
          automorphisms are always base-field-rational, removing a live assumption from
          a committed record at zero cost.
        predicted_gain: >-
          One fewer assumption on the lane's only prior proposal, and a strictly
          stronger reading of any null it produces.
    quantifier_order: >-
      FOR ALL finite fields F_q of characteristic other than 2 and 3, FOR ALL ORDINARY
      E/F_q, FOR ALL endomorphisms phi in the geometric endomorphism ring: phi is
      defined over F_q. The universal quantifier over phi comes last and is the whole
      content - the RQ's control cell would require a phi for which it fails, and the
      order forbids one from existing. Note that reversing the order, i.e. THERE EXISTS
      a field and a curve for which SOME phi is irrational, is satisfiable, by
      supersingular curves, which is precisely R3(a).
    method_ceiling:
      strongest_certifiable_claim: >-
        An exhaustive computational verification that delta = 1 for every ordinary
        curve over every prime field in the declared 7-9 bit range, together with a
        demonstration on the supersingular positive control that delta greater than 1
        is detectable by the same code path. It CANNOT prove R1, which is the recalled
        theorem plus the reproduced argument, and it cannot certify anything about
        characteristic 2 or 3.
      nearby_object_control: >-
        The nearby object where the conclusion FAILS: supersingular j = 0 over F_p with
        p congruent to 2 mod 3. End is a quaternion order, non-commutative, and the
        extra automorphisms are NOT F_p-rational - the exact object the RQ names and
        the exact object it excludes. A method that reports delta = 1 there is not
        measuring rationality and every ordinary reading is void. Second nearby object:
        an ordinary curve over F_{p^2} obtained by base change from F_p, where the
        automorphism group is unchanged but the endomorphism ring can grow - the check
        that the measurement is sensitive to the field it is asked about.
    proof_obligations:
      - claim: >-
          For ordinary E the geometric endomorphism ring is an order in an imaginary
          quadratic field
        responsibility: baseline
      - claim: >-
          Frobenius lies in End, and phi is base-field-rational if and only if phi
          commutes with Frobenius
        responsibility: correctness
      - claim: >-
          Commutativity therefore forces every endomorphism to be rational
        responsibility: strictness
      - claim: Hence the RQ's third declared control family is empty
        responsibility: scope
      - claim: >-
          The measurement apparatus can detect delta greater than 1 when it exists, per
          the supersingular positive control
        responsibility: feasibility
      - claim: >-
          The j = 1728 arm cannot observe ramified-prime behaviour under the RQ's
          odd-degree constraint
        responsibility: scope

  predictions:
    - metric: >-
        delta(E), the ratio of geometric to rational automorphism group order, computed
        by two independent group constructions, over every ordinary curve at the
        declared bit sizes
      direction: different
      minimum_effect: >-
        Exactly 1, on every ordinary curve, with ZERO exceptions across the full
        enumeration. A single ordinary curve with delta greater than 1 falsifies R1 and
