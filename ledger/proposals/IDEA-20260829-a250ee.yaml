    - metric: >-
        number of odd primes in {3,5,7,11,13} that are ramified in the maximal order of
        discriminant D_K, per arm
      direction: different
      minimum_effect: >-
        Exactly 1 for the j = 0 arm, namely ell = 3, and exactly 0 for the j = 1728
        arm, since its ramified prime is 2 and is excluded by scope. Confirms R4's
        asymmetry by a computation that needs no curves at all.
    - metric: >-
        measured rho step-count ratio on the D_K in {-7,-8,-11} replacement null, which
        has a small-degree non-invertible endomorphism and automorphism group of order
        2
      direction: different
      minimum_effect: >-
        1.00 plus or minus the frozen seed band. A discount there would mean the
        discount does not require invertibility, which would invalidate the replacement
        control's discriminating power and require a redesign before any special-j
        reading.

  minimal_test:
    design: >-
      TWO ARMS, of which the first is pure computation inside the RQ's declared scope
      and the second needs a scope decision. ARM O, ordinary, 7-9 bits, in scope. For
      every prime p from 64 to 512 with characteristic not 2 or 3, enumerate all curves
      y^2 = x^3 + a x + b up to F_p-isomorphism; classify each as ordinary or
      supersingular by the trace; for each ORDINARY curve compute the rational
      automorphism group order by exhibiting all u in the multiplicative group of F_p
      with u^4 a = a and u^6 b = b, and compute the geometric automorphism group order
      by the same test over the splitting field of the relevant u-equation; report
      delta. Cross-tabulate delta against j. Separately, and needing no curves at all,
      tabulate the ramified primes of the maximal orders of discriminant -3 and -4
      against the RQ's declared degree set to establish R4. ARM S, supersingular
      positive control, REQUIRES A COORDINATOR SCOPE DECISION because
      RQ-ECDLP-912694 excludes supersingular curves. For primes p congruent to 2 mod 3
      in the same range, take j = 0 curves, verify supersingularity, and compute delta
      by the identical code path; at least one must exceed 1.
    controls:
      - >-
        SUPERSINGULAR POSITIVE CONTROL, BLOCKING, which is Arm S. Without a
        demonstrated delta greater than 1 somewhere, "delta equals 1 everywhere in the
        ordinary world" is an unfalsifiable constant and the record has measured
        nothing. This is the single most important control in the design and it is the
        reason Arm S is proposed despite needing a scope decision. If the decision is
        refused, the record must be reported as a DERIVATION ONLY with its experimental
        arm withdrawn - not as a verified negative.
      - >-
        BASE-CHANGE SENSITIVITY CONTROL: compute delta for the same curve over F_p and
        over F_{p^2} and F_{p^3}. delta must be 1 in all cases for ordinary curves, but
        the automorphism group and the endomorphism ring must be recomputed rather than
        inherited, proving the code actually asks about the field it is given.
      - >-
        REPLACEMENT NULL, R3(b): crater curves with D_K in {-7, -8, -11}, small-degree
        endomorphism present, automorphism group of order 2, no rho discount predicted.
        Carries the discriminating load the empty cell was assigned.
      - >-
        j-INDEPENDENCE CONTROL: delta must be computed WITHOUT reference to j, so that
        the tabulation of delta against j is a genuine cross-tabulation and not a
        tautology. Inferring the automorphism order from j would make the whole arm
        circular and is the primary way this measurement could be worthless while
        looking clean.
      - >-
        CERTIFICATE CONTROL: every claimed automorphism re-verified as a curve
        isomorphism by code sharing no state with the producer - the map applied to
        sampled points, images checked on the curve, composition table checked to be a
        group. Verification fraction must be 1.0 as the RQ constraint requires.
    required_metrics:
      - >-
        per ordinary curve: rational automorphism group order, geometric automorphism
        group order, delta, j, trace, and the ordinary or supersingular verdict
      - >-
        the PAIR consisting of delta and the rational automorphism order per curve, per
        the observation-collision audit, since delta alone is insufficient
      - delta on the supersingular positive control, per curve
      - delta under base change to F_{p^2} and F_{p^3}, per curve
      - >-
        splitting-field degree used for the geometric automorphism computation, per
        curve
      - ramified-prime table for the discriminant -3 and -4 orders against the declared degree set
      - >-
        matched rho ratios on the D_K in {-7,-8,-11} replacement null, per seed, with
        the band
      - automorphism certificate verification fraction, required 1.0

  falsification_conditions:
    - >-
      Any ordinary curve with delta greater than 1. R1 is false, which contradicts a
      classical theorem and therefore first indicts the implementation; independent
      review is required before any description.
    - >-
      delta equal to 1 on every supersingular control curve. The apparatus cannot
      detect a rationality defect; the ordinary result is void and is reported as an
      instrument failure.
    - >-
      A curve satisfying all of RQ-ECDLP-912694's declared constraints that also
      instantiates its third control family. R2 is false.
    - >-
      An odd prime in {3,5,7,11,13} ramified in the maximal order of discriminant -4.
      R4 is false.
    - >-
      A measured rho discount at the D_K in {-7,-8,-11} replacement null. The
      replacement control does not discriminate what it was chosen to discriminate and
      R3(b) must be redesigned before it is relied on.
    - >-
      delta computed as a function of j by the implementation rather than
      independently. The arm is circular and produces no evidence, and this is detected
      by the j-independence control rather than argued.

  confounders:
    - >-
      Inferring the automorphism order from j is the dominant confound: it makes delta
      equal 1 come out by construction for every curve, ordinary or not, and would
      silently pass the supersingular positive control as a failure. The j-independence
      control targets exactly this and is why the design specifies exhibiting the
      isomorphisms.
    - >-
      Over small prime fields the splitting field for the geometric automorphism test
      may be F_p itself for accidental reasons, given small p and few residues, making
      the geometric computation identical to the rational one by coincidence rather
      than by theorem. The splitting-field degree is a reported metric so that
      coincidental cells are visible and excluded from the pooled statistic.
    - >-
      Quadratic and sextic twists share j and have the same automorphism group order
      but different traces; a twist-blind enumeration would double-count and could hide
      an anomaly inside a merged row. Deduplication is by F_p-isomorphism with a logged
      count of j-equal but F_p-inequivalent pairs.
    - >-
      Supersingular curves at 7-9 bits are few and their endomorphism rings are
      quaternionic and awkward to compute; the positive control is deliberately
      specified to require only delta, not the full endomorphism ring, so that its cost
      stays low and its failure mode stays legible.
    - >-
      R2 is a claim about a COMMITTED ledger record's text. If the RQ is later
      superseded with corrected scope, R2 becomes a historical statement about
      RQ-ECDLP-912694 as of the read on 2026-08-29, and the record must be read that
      way; the exact quoted strings and the read date are recorded in the citations for
      this reason.

  interpretation_limits:
    - >-
      Claim tier toy for Arm O, and Arm S requires a Coordinator scope decision because
      RQ-ECDLP-912694 excludes supersingular curves. Running Arm S without one would
      silently widen a question's declared scope and this record refuses to do it. If
      refused, the record stands as a DERIVATION with its positive control unavailable,
      and it must say so rather than quietly report an unfalsifiable constant.
    - >-
      R1 is recalled classical mathematics reproduced in full so it can be checked
      without a library; it is a DERIVATION under docs/claims-and-verification.md and
      the enumeration verifies the implementation over a finite range, not the theorem.
    - >-
      NO ECDLP claim of any kind. No exponent moves, no constant moves, no attack. The
      deliverable is an evidential correction and a control redesign.
    - >-
      R2 does not invalidate IDEA-20260812-c49409. That record's D1 through D4 are
      untouched; one of its assumptions is upgraded to a theorem and one of its listed
      controls is shown to be unavailable. The correction is by supersession with a new
      record, never by editing.
    - >-
      Nothing here bears on P-256, P-224, or secp256k1 as cryptographic targets. It
      bears on how this program's experiments about them are controlled.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical
      evidence (AGENTS.md rule 3).

  heuristic_assumptions:
    - id: H-RAT-1
      statement: >-
        NO DISTRIBUTIONAL HEURISTIC IS LOAD-BEARING IN R1 AND R2, and this is asserted
        rather than left implicit. R1 is a universally quantified algebraic statement
        with no probability in it; the experiment is an exhaustive enumeration over a
        finite declared range, not a sample; and R2 is a statement about the text of a
        committed record. The single assumption is that the classical theorem recalled
        in R1 is correctly recalled.
      rigorous_support: >-
        Rigorous ingredient: the criterion that an endomorphism is base-field-rational
        if and only if it commutes with the q-power Frobenius, plus commutativity of an
        imaginary quadratic order. Distribution imitated: NONE, deliberately. A record
        that invented a distributional heuristic here in order to fill the field would
        be padding, and the honest content of this field is that there is nothing to
        assume.
      validation_plan: >-
        Two routes, both cheap. First, adversarial re-derivation by the Red Team
        hunting specifically for the case that breaks it - characteristic 2 and 3,
        where automorphism groups are larger, and the boundary case where End is an
        order of conductor greater than 1, which cannot happen when the automorphism
        group is large, and that sub-claim is itself checked. Second, the exhaustive
        enumeration of Arm O with the supersingular positive control of Arm S, which
        turns "correctly recalled" into a testable proposition over the declared range.
        TRANSFER ASSUMPTION: the enumeration at 7-9 bits transfers nothing to
        cryptographic p; only the derivation is claimed uniform, and the derivation is
        what a reviewer must check.
    - id: H-RAT-2
      statement: >-
        INSTRUMENT SENSITIVITY. The delta-measurement apparatus is sensitive enough to
        report delta greater than 1 when the underlying object has an irrational
        automorphism; formally, on a supersingular j = 0 curve over F_p with p
        congruent to 2 mod 3 the apparatus returns delta equal to 3 or 6 and not 1.
        This is an assumption about the CODE, not about mathematics, and until it is
        discharged the ordinary result carries no information.
      rigorous_support: >-
        Rigorous ingredient: for supersingular j = 0 over F_p with p congruent to 2 mod
        3, a primitive cube root of unity is not in F_p, so the automorphism sending
        (x, y) to (zeta x, y) is visibly not F_p-rational while being geometrically
        present - so the ground truth is known in advance and the control has a
        pre-registered answer. Distribution imitated: none.
      validation_plan: >-
        Arm S. Sampled parameters recorded exactly: the primes used, their residues mod
        3, the curves, and the splitting-field degrees. The pre-registered expected
        values of delta are written before the run. Tail check not applicable - this is
        a deterministic control with a known answer, and its failure mode is binary. If
        Arm S is not authorised, H-RAT-2 remains UNDISCHARGED and the record must
        report its ordinary arm as unfalsified rather than as confirmed.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE AS AN ALGORITHMIC CLAIM, said plainly. No algorithm is proposed,
      no ECDLP exponent moves, and under docs/target-result-profile.md checklist C1
      this record is NON-TARGET-CLASS by construction. The only cost statement: R1
      replaces an experimental control, which would have cost curve enumeration plus
      rho runs plus a report, with O(1) algebra, so the saving is the entire cost of a
      control cell that could never have been populated.
    memory_exponent: >-
      O(1) for the derivation; O(1) per curve for the enumeration, which is quadratic
      in p in the number of curves at each prime and therefore seconds at 9 bits.
    best_known: >-
      For the ECDLP on these curves: Pollard rho at 0.886*sqrt(N) with negation,
      automorphism-discounted at the special-j vertex (KN-TECH-018). Untouched. For the
      structural statement, the best known is the classical theorem itself, which this
      record reproduces rather than improves.
    hidden_overhead: >-
      One disclosed item: computing the geometric automorphism group honestly requires
      working over a splitting extension, and the record's cost claim assumes that
      extension has small degree, which is true at the declared bit sizes for the
      relevant u-equations, whose degree divides 6, and is reported per curve rather
      than assumed.
    tradeoff_note: >-
      No time-memory tradeoff arises. The one real tradeoff is EVIDENTIAL and is stated
      as such: accepting R1 removes an explanation for future null results, which makes
      those nulls stronger evidence against the mechanism and correspondingly less
      forgiving of implementation error - so the positive-control discipline in this
      lane must get tighter, not looser, once R1 is accepted.

  dominated_by: >-
    Not applicable, since no result is claimed on any cost axis - and the phrase is
    used in its licensed sense under docs/inventor-protocol.md section 5, after
    checking the frontier rather than instead of checking it. Rows checked: BSGS
    (sqrt(N) time, sqrt(N) memory); Pollard rho with negation and van Oorschot-Wiener
    parallelisation (0.886*sqrt(N), O(1) memory); automorphism-discounted rho at the
    crater (KN-TECH-018); multi-target frontier sqrt(L*N); preprocessing frontier
    S*T^2 = Omega(eps*N); Galbraith Otilde(q^{1/4}) for the ordinary isogeny problem;
    Bisson-Sutherland L[1/2] for endomorphism-ring computation. Every row dominates
    trivially because this record proposes no algorithm at all, so null is not
    available and is not written. As a MATHEMATICAL statement, dominated by the
    classical theorem it reproduces.
  sota_delta:
    time_exponent: "0 (no change)"
    memory_exponent: "0 (no change)"
    data_or_query_exponent: "0 (no queries)"
    note: >-
      Quantitatively: zero on every cost axis; this is a conceptual and
      measurement-integrity contribution only. The delta that exists is countable and
      exact - one declared control family in a committed research question drops from
      "to be measured" to "provably empty", which is R2; one live assumption in the
      lane's only prior proposal is upgraded to a theorem; and one previously unnoticed
      asymmetry between the j = 0 and j = 1728 arms is exposed, which is R4. Under
      docs/inventor-protocol.md section 4 this is a CLOSURE of one cell with a named
      obstruction, namely commutativity of End for ordinary curves, plus an argument,
      plus forward guidance naming the two classes that remain open: supersingular
      special-j curves, where the defect genuinely exists but the RQ excludes them; and
      ordinary curves with cheap non-invertible endomorphisms, where the invertibility
      question is live inside the declared scope.

  estimated_cost:
    implementation: low
    compute: low
  compute_budget_note: >-
    Arm O at 7-9 bits: exhaustive enumeration of all curves over all primes below 512
    with an explicit automorphism search per curve - seconds to a few minutes on one
    core. The R4 ramified-prime table needs no curves and no compute. Arm S adds a
    handful of supersingular curves at the same sizes and is equally cheap; its cost is
    a scope decision, not CPU. This is the cheapest record in the batch after
    IDEA-20260829-882739, and unlike that one, half of it - R1, R2 and R4 - can be
    discharged by review with no execution at all.
  recommended_priority: high

  relation_to_existing_records:
    corrects: >-
      IDEA-20260812-c49409 - its rationality ASSUMPTION becomes a theorem, and its
