idea:
  id: IDEA-20261006-b87de8
  title: >-
    Doubling agreement of the least-residue y-half bit on one ordinary
    short-Weierstrass curve over F_37
  class: measurement
  claim: >-
    On the first curve E: y^2 = x^3 + x + B over F_37 with B in {1,...,18}
    that is nonsingular and not supersingular, the agreement frequency f of
    the least-nonnegative-residue y-half bit under affine doubling strictly
    exceeds the 99th percentile of |f-1/2| on 2000 size-matched random
    relabelings of that same bit. This is an R1 coordinate bit at the
    collision-structure stage. It does not change the generic exponent 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R1: for an affine point P=(x,y) on the
    short-Weierstrass model, β(P)=0 when the least nonnegative residue of y
    is at most 18, and β(P)=1 otherwise. Operation set Sigma is the semigroup
    generated by affine doubling δ(P)=2P on S={P affine : y(P)≠0}, written
    with slope (3x^2+1)/(2y). Sigma is not the full translation action.
    Trichotomy: branching. β is a function of the chosen y-residue
    representative, and doubling does not induce a well-defined self-map of
    {0,1} unless every point of a given bit doubles to the same bit.
    LOSSY-PROJECTION TEST against Sigma. The projection discards x(P) and the
    magnitude of y(P) and retains one bit. That discard is not a block system
    of <doubling> unless the agreement is deterministic; the compatible
    statement is the branching bound b=|2f-1|, with loss L=1-2/|S| whenever
    |S|>2. It is lossy because the image has two values. A projection that
    kept (x,y) would lose nothing and is not the object. Off-limits families
    F1–F7 are not the lens. Negation is a named positive-control component
    only: β(-P) must be 1-β(P) on S. No factor base is proposed.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: idea-generator
  approved_by: null
  question_id: RQ-ECDLP-623a32
  citations:
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm on a prime-order group needs Ω(√p) group
        operations. This idea cites that bound as the unchanged baseline,
        not as a proof about the half-bit frequency.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        Walking on {±P} classes is a known rho constant with fruitless
        cycles. This idea does not walk; the ± involution is only the check
        that β flips under negation.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fb88e6.yaml
        on 2026-10-06
    - ref: KR-IC-5ea2f8
      provenance: internal
      claim: >-
        GHS Weil descent maps ECDLP on E(F_{q^n}) to a hyperelliptic Jacobian
        over F_q and is effective only for special fields and curves. This
        measurement is one prime-field curve over F_37 under doubling and
        does not descend.
      verified_by: >-
        idea-generator opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-5ea2f8.yaml
        on 2026-10-06
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C says an exactly sum-compatible bucket index on a
        prime-order group is a surjective homomorphism, impossible for
        1<M<N. The half-bit is not asserted to be sum-compatible.
      verified_by: >-
        idea-generator opened knowledge/findings/KN-FIND-ffe1df.md
        (Theorem C paragraph) on 2026-10-06
    - ref: Hasse bound |#E(F_p)-(p+1)| ≤ 2√p
      provenance: recalled
      claim: >-
        Pointer only. The test computes |S| directly and does not rely on
        this bound.
      verified_by: null
  assumptions:
    - >-
      β is computed in the least-nonnegative residue of F_37, not in a
      signed residue system.
    - >-
      F1 walk-collision is not used. The negation check is a control
      component, not the tracked search.
    - >-
      The first eligible B is selected by nonsingularity and a trace not
      divisible by 37, before f is scored.
  proof_search_map:
    bottleneck: >-
      Whether β(δ(P)) agrees with β(P) more often than a size-matched
      relabeling. Removing the gap would leave a fair coin, not a faster
      discrete log.
    baseline_embedding:
      parameter_slice: >-
        Pollard rho exponent 1/2 on a prime-order subgroup, as stated in
        KR-RHO-13bf67. This measurement is one curve over F_37 and does not
        embed a rho implementation.
      reproduction_check: >-
        Recompute β(-P)=1-β(P) for every P in S, and recompute 2P from the
        affine slope and check it lies on the curve.
    observation_collision:
      observable: >-
        The fibre of β, a two-value lossy projection, together with the
        agreement rate f under doubling.
      distinct_preimage_search: >-
        List two points in S with the same β and different images under β∘δ.
        If no such pair exists, β∘δ is a function of β and the branching
        label is wrong.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the least-residue y-half bit under the doubling semigroup.
        predicted_gain: >-
          A numerical branching gap b=|2f-1| against a relabeling null. No
          exponent change.
    quantifier_order: >-
      Exists B in {1,...,18} such that E_B is nonsingular and not
      supersingular, and for that first B the scalar |f-1/2| is strictly
      above the 99th percentile of 2000 size-matched relabelings of β on S.
    method_ceiling:
      strongest_certifiable_claim: >-
        A single toy frequency gap on one curve over F_37. Nothing about
        cryptographic field size or about collision time.
      nearby_object_control: >-
        A second independent draw of 2000 size-matched relabelings should
        sit at or below the first draw's 99th percentile except in a thin
        tail. If the curve's |f-1/2| does not clear that percentile, the
        bias claim is false.
    proof_obligations:
      - claim: >-
          |f-1/2| exceeds the stated relabeling percentile on the selected curve.
        responsibility: feasibility
      - claim: The exponent 1/2 is not changed by a one-bit frequency.
        responsibility: scope
    not_applicable_reason: >-
      This is a measurement of a branching frequency, not a theorem, bound,
      certificate, reduction, or closure. The map audits that measurement only.
  predictions:
    - metric: >-
        |f-1/2|, f the fraction of P in S with β(2P)=β(P)
      direction: higher
      minimum_effect: >-
        Strictly above the 99th percentile of |f-1/2| among 2000 relabelings
        that preserve the two fibre sizes of β.
    - metric: branching b=|2f-1| and loss L=1-2/|S|
      direction: different
      minimum_effect: >-
        b strictly larger than the same percentile converted by b=2|f-1/2|,
        and L>0 because |S|>2.
  minimal_test:
    design: >-
      For B from 1 through 18, discard singular curves and curves whose
      trace is 0 mod 37. On the first remaining curve, enumerate S, compute
      f exactly, draw 2000 size-matched relabelings of β, and compare
      |f-1/2| with that sample's 99th percentile. Stop after one curve.
    controls:
      - >-
        Negation control: β(-P)=1-β(P) for every P in S. Any failure
        invalidates the bit, and the claim is not scored.
      - >-
        Size-matched relabeling null on the same set S and the same doubling map.
      - >-
        Identity check that every doubled point satisfies the curve equation.
    required_metrics:
      - selected B
      - "|S|"
      - f
      - 99th percentile of the 2000 relabelings
      - negation-control pass or fail
  falsification_conditions:
    - >-
      |f-1/2| is less than or equal to the 99th percentile of the 2000
      size-matched relabelings.
    - No B in {1,...,18} yields a nonsingular non-supersingular curve.
    - The negation control fails.
    - >-
      β(2P) is a function of β(P) alone, so the branching placement is false
      and the percentile comparison is the wrong statistic.
  confounders:
    - >-
      |S| is only a few dozen points, so a 99th percentile can be cleared by
      one or two extra agreements. The percentile, not a fixed 0.08 gap, is
      the bar.
    - >-
      The least-nonnegative cut at 18 is a coordinate convention. A signed
      residue would be a different bit and is not interchangeable.
    - >-
      Points with y=0 are excluded. A curve with many rational 2-torsion
      points shrinks S and widens the null tail.
  interpretation_limits:
    - >-
      A gap on F_37 is claim_tier toy. It does not change time exponent 1/2
      or memory exponent 0.
    - >-
      This is not a factor base and does not enter the open classes of
      KN-OPEN-020.
    - >-
      The bit is not claimed to be sum-compatible, so Theorem C of
      KN-FIND-ffe1df is a fence, not a hypothesis under test.
    - >-
      Passing the percentile test does not say the bit is useful in a walk.
      Failing it says this bit is consistent with a fair coin on this curve.
    - >-
      KR-IC-5ea2f8 is a cover attack on E(F_{q^n}). This idea does not map
      the curve to a hyperelliptic Jacobian.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A size-matched uniform relabeling of a two-valued function on a fixed
        set S of doubling inputs has agreement rate f whose deviation
        |f-1/2| follows the sampling distribution of a balanced draw with
        those fibre sizes. No transfer to a larger prime is assumed.
      rigorous_support: >-
        Finite uniform model on a fixed finite set. The opened generic-group
        row KR-RHO-13bf67 is the complexity baseline, not a distributional
        theorem for this bit.
      validation_plan: >-
        Sample 2000 size-matched relabelings on the selected S. Compare the
        empirical CDF of |f-1/2| with the exact hypergeometric (or binomial,
        if the fibres differ by at most 1) law at the same |S|. Tail check:
        the Monte Carlo 99th percentile and the exact-law 99th percentile
        differ by at most 1/|S|. If they differ by more, the null is
        mis-specified and the claim is not scored.
  target_complexity:
    time_exponent: >-
      unchanged p^{1/2} group operations for a prime-order subgroup
    memory_exponent: >-
      unchanged O(1) distinguished-point memory for the rho baseline; this
      measurement stores one curve of size < 2*37
    best_known: >-
      Pollard rho, Θ(√N) group operations, KR-RHO-13bf67
    hidden_overhead: >-
      none claimed; there is no o(1) term because no new algorithm is proposed
    tradeoff_note: >-
      No time-memory tradeoff is proposed. Parallelism is irrelevant to one
      enumeration over F_37.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    No opened row dominates this measurement. Rows opened and not dominating
    the frequency: KR-RHO-13bf67 (generic Ω(√p) bound; this idea does not
    search), KR-RHO-fb88e6 (negation-map walk; this idea does not walk),
    KR-RHO-0528e7 (√|Aut| rho constant; this idea does not quotient by Aut),
    KR-IC-5ea2f8 (GHS Weil descent to a hyperelliptic Jacobian over F_q;
    this idea stays on F_37 and does not descend). KR-RHO-13bf67 is the
    matching exponent baseline, not a stricter result about |f-1/2|.
  sota_delta: >-
    Zero change to time exponent 1/2 and to memory exponent 0 against
    KR-RHO-13bf67. The new quantity is |f-1/2| for the y-half bit under
    doubling on one curve over F_37, scored against the 99th percentile of
    2000 size-matched relabelings.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-13bf67
      - KR-RHO-fb88e6
      - KR-RHO-0528e7
      - KR-IC-5931ee
      - KR-IC-5ea2f8
    nearest:
      - ref: KR-RHO-fb88e6
        provenance: internal
        relation: adjacent
        delta: >-
          That row is a walk on ± classes and a √2 iteration constant. This
          idea does not walk and does not claim √2. It measures whether the
          coordinate bit that negation flips agrees with itself under doubling
          more often than a relabeling.
      - ref: KR-IC-5ea2f8
        provenance: internal
        relation: orthogonal
        delta: >-
          That row maps ECDLP on E(F_{q^n}) to a hyperelliptic Jacobian over
          F_q and is effective only for special extension fields and curves.
          This measurement uses the prime field F_37, so the extension degree
          is 1, and the scored quantity is |f-1/2| of a y-half bit under
          doubling against a 2000-draw relabeling percentile. It does not
          output a cover genus, a weak-field class, or a Jacobian discrete
          log. Time exponent stays 1/2.
      - ref: KN-FIND-ffe1df
        provenance: internal
        relation: orthogonal
        delta: >-
          Theorem C forbids an exactly sum-compatible nontrivial bucket
          index. This bit is not offered as a sum-compatible index.
    searched:
      corpus_grep:
        - >-
          ledger/proposals IDEA-202610*.yaml for Edwards, Jacobi, quadratic
          character, doubling denominator, y-half, least nonnegative
        - >-
          ledger/proposals IDEA-2026*.yaml for least nonnegative residue and
          doubling-slope
      web: []
      blocked:
        - web search not run; novelty_status stays unverified
