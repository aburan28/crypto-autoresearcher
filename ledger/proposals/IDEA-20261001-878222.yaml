  assumptions:
    - Frozen V catalog (≥12), seeds, XOR-SAT pin, Spearman band −0.70.
    - Trace-linear extractor already admitted or cell is failed_infrastructure.
    - Predictor of N_nl ≠ predictor of total N_var or of usable_dimensions.
    - Correlation ≠ practical binary IC (KR-IC-1fcdbc).

  heuristic_assumptions:
    - id: HEUR-BINSTD-878222-H1
      formal_statement: >-
        FORALL (n,ℓ)∈{17,19,23}×{3,4}: across the frozen ≥12-shape V catalog,
        Spearman ρ(r_Tr, N_nl) ≤ −0.70 where r_Tr is the rank of the
        Trace-derived linear block and N_nl is the residual nonlinear XOR-SAT
        clause count after eliminating those linears.
      random_model_justification: >-
        Rigorous: KR-IC-f5c584 shows Trace contributes structural linears after
        descent. Classical: if those linears dominate the removable work, higher
        r_Tr should leave fewer residual nonlinear clauses; if product-space or
        encoder artifacts dominate residual size instead (KR-IC-73db3f),
        correlation may fail the −0.70 band. The band is the pre-registered
        transfer hypothesis at toys — not a claim that Trace alone beats rho.
      supporting_results:
        - KR-IC-f5c584
        - KR-IC-5765d2
        - KR-IC-73db3f
      validation_experiment_ids: []
      falsification_condition: >-
        Spearman ρ > −0.70 at a completed cell (Trace-rank-not-predictive),
        OR Trace extractor / encoder absent (infrastructure stop), OR catalog
        collapses to <3 distinct r_Tr values (inconclusive; expand or stop).

  predictions:
    - metric: spearman_rTr_vs_Nnl
      direction: upper_bounded
      minimum_effect: '≤ −0.70 at each (n,ℓ) cell'
    - metric: catalog_size
      direction: lower_bounded
      minimum_effect: '≥ 12 distinct V shapes per cell'
    - metric: distinct_rTr_values
      direction: lower_bounded
      minimum_effect: '≥ 3 distinct r_Tr values, else inconclusive'

  minimal_test: >-
    Stage 0: freeze V catalog (≥12), seeds, XOR-SAT pin, Trace extractor,
    Spearman band −0.70.
    Stage 1: n=17, ℓ∈{3,4} — encode each V; eliminate Trace linears; report ρ.
    Stage 2: n=19,23 + shuffled-linear null catalog. Budget: ≤6 CPU-hours.
    Stop if extractor/encoder absent (IMP, never evidence).

  controls:
    - ctl_fixed_dim_V
    - ctl_frozen_V_catalog
    - ctl_shared_xorsat_pin
    - null_shuffled_linear_block_rank
    - ctl_bootstrap_ci_reported
    - ctl_no_posthoc_band_edit

  falsification_conditions:
    - Claiming practical binary IC from a toy Trace-rank correlation.
    - Equating N_nl prediction with total N_var (febbe1) or usable_dimensions
      (fbee3f).
    - Treating 'Trace gives a linear' as novelty (KR-IC-f5c584 forbids).
    - Editing the Spearman band after seeing encodings.
    - Transferring the band to n≥131 without a new contract.

  target_complexity:
    time_exponent: >-
      No exponent claimed. Encoding-structure instrument only; a high |ρ|
      does not move binary ECDLP vs rho (KR-IC-1fcdbc / KR-IC-9e610d).
    memory_exponent: Negligible — store per-V r_Tr and N_nl.
    best_known: >-
      KR-IC-f5c584 (Trace linear); KR-IC-5765d2 (XOR-SAT PDP path).
    hidden_overhead: Encoder constants independent of Trace rank.
    tradeoff_note: >-
      High Trace rank may cut N_nl but leave hard nonlinear cores — this meter
      measures only residual clause count.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Estimate. Requires admitted S_3 XOR-SAT encoder and Trace-linear
      extractor; do not provision mid-tick. Under six CPU-hours at n≤23
      (encode+eliminate only; no full solve required).

