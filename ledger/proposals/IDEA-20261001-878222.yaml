# =============================================================================
# IDEA-20261001-878222 -- Trace-linear rank as predictor of remaining nonlinear
# XOR-SAT clause count. Distinct from dim(V·V)→N_var (febbe1).
# =============================================================================
idea:
  id: IDEA-20261001-878222
  question_id: RQ-BINSTD-b6f698
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    AT FIXED dim(V), DOES Trace-LINEAR RANK PREDICT REMAINING NONLINEAR
    XOR-SAT CLAUSE COUNT? On binary toys n∈{17,19,23} with frozen dim(V)=ℓ∈{3,4},
    sweep ≥12 distinct F_2-subspaces V and test whether rank(Tr-linears after
    descent) Spearman-correlates (≥0.70) with the residual nonlinear clause
    count N_nl after Gaussian elimination of those linears.

  class: heuristic_validation

  claim: >-
    KR-IC-f5c584 states that the Trace morphism forces a linear equation after
    Weil descent of S_3 (first fall degree 2). CLAIM: at each toy cell
    (n,ℓ)∈{17,19,23}×{3,4}, across a frozen catalog of ≥12 distinct dim-ℓ
    subspaces, Spearman's ρ between r_Tr := rank of the Trace-derived linear
    block and N_nl := nonlinear XOR-SAT clause count remaining after eliminating
    those linears satisfies ρ ≤ −0.70 (higher Trace rank → fewer residual
    nonlinear clauses) — OR the correlation fails and is recorded as
    Trace-rank-not-predictive of N_nl at this scale. CLAIM TIER:
    heuristic_validation. NO break. NO exponent. NO n≥131 transfer. Distinct
    from IDEA-20261001-febbe1 (dim(V·V)→N_var total variables), fbee3f
    (usable_dimensions), and 556cea (solving vs first-fall degree).

  mechanism: >-
    OBJECT FRAME. Representation: FB {P : x(P)∈V}; Operation: descend S_3,
    extract the Trace-linear block (KR-IC-f5c584), Gaussian-eliminate it, and
    count remaining nonlinear XOR clauses N_nl under a frozen encoder pin
    (KR-IC-5765d2). Observable: Spearman(r_Tr, N_nl). Trichotomy: Class I
    instrument (predictor of residual nonlinear work). Lossy-projection: N_nl
    discards which nonlinear clauses are hard; null is a matched catalog whose
    linear block rank is shuffled independently of N_nl. OFF-LIMITS: total
    N_var vs dim(V·V) (febbe1); usable_dimensions emptiness; solver races;
    degree-of-regularity claims. WHAT IS NEW: a pre-registered Spearman ≤−0.70
    band linking Trace-linear rank to residual nonlinear clause count.

  novelty_status: unverified
  prior_art:
