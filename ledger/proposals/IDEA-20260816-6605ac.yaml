idea:
  id: IDEA-20260816-6605ac
  question_id: RQ-HAWK-001
  added: '2026-08-16'
  title: Every committed HAWK-lane record works on HAWK-SHAPED instances from a declared rule rather
    than on HAWK, and nothing has ever measured what that substitution costs; build a generator-fidelity
    battery that reports, per statistic, how far the declared rule is from a stated reference family.
  class: tooling
  claim: '(A) Both committed HAWK hypotheses state their scope as HAWK-SHAPED, NOT HAWK, with a declared
    deterministic rule, because RQ-HAWK-001''s constraint block forbids treating unread specifications
    as verified (H-HAWK-c7a551 and H-HAWK-a28be6 both say so in their scope statements). That discipline
    is correct and this entry does not weaken it. But every result in the lane inherits an unquantified
    substitution, and no record in this corpus measures how the declared rule''s output differs from
    anything. An instrument used by two experiments and by every successor is being trusted on the
    strength of its label. (B) The claim is that generator fidelity is measurable WITHOUT reading
    HAWK: fidelity is always relative to a stated reference, and three references are available here
    that require no external source - reference one, the mathematical constraints the lane''s own
    arguments assume (unimodularity, determinant, the module structure, the shortness regime); reference
    two, self-consistency across seeds and across ring degrees, where a rule with a hidden degree-dependent
    bias will show statistics that jump rather than scale; reference three, a second independently
    written generator satisfying the same stated constraints, where any statistic on which the two
    disagree is a property of the rule rather than of the constraints. The claim is that a battery
    over these three references produces a per-statistic fidelity report, and that at least one statistic
    will show a rule-specific rather than constraint-specific value. (C) The claim is that this report
    is a precondition for interpreting any HAWK-lane measurement, including the other entries in this
    batch, and that its natural home is a reusable instrument record rather than a one-off. (D) NOT
    CLAIMED: that the existing declared rule is wrong, that any committed HAWK-lane result is invalidated,
    that fidelity to HAWK itself is measured (it is not and cannot be here, since the specification
    is unread), or anything about HAWK''s security in either direction. This is an instrument-validity
    contract and its most likely outcome is a clean bill with a quantified caveat list.'
  mechanism: 'Stage 1 extracts the declared generation rule actually used in the lane by reading the
    committed specifications EXP-HAWK-a2f34a and EXP-HAWK-c8231a and the scope statements of H-HAWK-c7a551
    and H-HAWK-a28be6, and writes it out as an explicit algorithm with every free parameter named.
    Where the committed records do not fully determine a parameter, that under-determination is itself
    a first-class finding and is reported before any measurement. Stage 2 writes the constraint set
    the lane''s arguments assume, separately from the rule: what must be true of an instance for the
    lane''s reasoning to apply. Stage 3 implements a second, independently structured generator satisfying
    exactly that constraint set and nothing more - deliberately written to differ in its incidental
    choices (entry distribution, rejection strategy, basis ordering). Stage 4 runs a battery of cheap
    statistics on outputs of both generators across seeds and ring degrees: Gram entry distributions,
    orthogonality defect, shortest-vector length relative to the determinant root, automorphism order,
    condition-number analogues in exact arithmetic, and the determinant distribution. Stage 5 applies
    three tests per statistic - constraint conformance (does the value satisfy the stated constraint),
    cross-generator agreement (do the two rules agree within sampling error), and degree scaling (does
    the value scale smoothly in n or jump). Stage 6 classifies each statistic as constraint-determined,
    rule-determined, or degree-anomalous, and that classification vector is the deliverable. Stage
    7 emits it as a reusable instrument record naming, for each downstream experiment in the lane,
    which of its metrics depend on rule-determined statistics and therefore carry an unquantified
    substitution cost.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read the scope statements of ledger/hypotheses/H-HAWK-c7a551.yaml and H-HAWK-a28be6.yaml
      in full (both explicitly say HAWK-SHAPED, NOT HAWK, declared deterministic rule, ONE instrument
      lineage). Read the title blocks of experiments/EXP-HAWK-a2f34a/specification.yaml and experiments/EXP-HAWK-c8231a/specification.yaml.
      Read ledger/questions/RQ-HAWK-001.yaml in full including its constraints block. Grep -ril ''hawk|module-lip|nrd-pip|lattice
      isomorphism'' over ledger/proposals/ (11 files, titles read). Reviewed the anti-duplication
      list items on instrument audits: 15+ proposals under RQ-INSTR-f8faa0 for cost model / machine
      variance / single-machine timing, and KN-OPEN-3f7a21 for citation_verified markings.'
    results: 'The instrument-audit space in this program is heavily occupied but along a different
      axis: the blacklist records 15+ proposals under RQ-INSTR-f8faa0 auditing the COST MODEL, machine
      variance and single-machine timing, and KN-OPEN-3f7a21 owning the literature citation_verified
      audit. This entry measures neither timing nor cost nor citations - it never records a wall-clock
      number as a metric and would give identical results on any hardware, because every statistic
      is an exact-arithmetic property of generated instances. Within the HAWK lane, both hypotheses
      declare the HAWK-SHAPED scope explicitly and EXP-HAWK-c8231a declares its instrument INHERITED
      from EXP-HAWK-a2f34a, so the lineage is documented; what is absent is any measurement of that
      lineage''s generator. IDEA-20260805-3a855d (''charge what nobody charged'') is the nearest relative
      in spirit - it audits an uncosted factor and an absent memory column - but it audits a cost
      model of a published route, not a generator this program itself runs.'
    verdict: 'UNVERIFIED. Claimed new: the three-reference fidelity framing (stated constraints, self-consistency
      across seeds and degrees, and an independently written second generator) that makes generator
      fidelity measurable without any external source, and the constraint-determined / rule-determined
      / degree-anomalous classification as the deliverable. Assembled from known parts: two-implementation
      cross-checking is standard practice everywhere; the statistics in the battery are all standard
      lattice quantities; the demand for instrument validation before interpretation is program policy
      already, and the cost-model instrument-audit lane (RQ-INSTR-f8faa0) is a large existing family
      that this deliberately does not join. No claim about external literature is made.'
  object_first_candidate:
    tracked_object: 'The generator itself, treated as a distribution over instances: the object followed
      is the vector of battery statistics as a function of (rule, seed, ring degree), and specifically
      the classification of each statistic as determined by the stated constraints or by the rule''s
      incidental choices.'
    lossiness: 'Genuinely lossy. An instance is a full integer basis; the battery retains roughly
      ten scalars per instance and discards everything else, including the entire lattice. This is
      compatible with the operation of interest - substituting one generator for another - because
      a substitution can only matter through statistics that downstream experiments actually read,
      and the battery is chosen to be a superset of those. What does not survive: any property no
      downstream experiment reads, and any joint structure among statistics beyond their pairwise
      agreement. The second is a real gap and is stated: two generators agreeing on every marginal
      can differ in their joint distribution, and this battery would not see it.'
    propagation: One step of the target operation is drawing one more instance from a generator. Under
      this step the tracked statistics propagate as running empirical distributions - deterministic
      update, random input - and the constraint-conformance test propagates as a conjunction that
      can only be falsified, never confirmed, by additional draws. Cross-generator agreement propagates
      as a two-sample test statistic whose power grows with sample size, so the classification sharpens
      monotonically with the budget.
    survival_score: The battery survives across the ring degrees the lane already uses - 4, 8, 16,
      32 per H-HAWK-c7a551's scope - and dissolves for those statistics requiring exhaustive short-vector
      enumeration at degree 32 (dimension 64), where only the cheap statistics remain. The concrete
      number to report is, per statistic, the largest ring degree at which it was computed exactly
      rather than sampled.
  null_object_control: 'The null object is a generator known to be WRONG in a stated way: a third
    generator that satisfies the stated constraint set but deliberately violates one incidental property
    of the declared rule (for instance, drawing basis entries from a distribution with a different
    tail while preserving determinant and unimodularity). Run through the identical battery in the
    same invocation. For the signal comparison to mean anything, the battery must DETECT this deliberately-perturbed
    generator on at least one statistic at the sample size used - otherwise the battery has no power
    and the finding that the two honest generators agree is vacuous. This is the positive control
    that makes an agreement result interpretable, and it is the single most important arm of the contract,
    since without it ''the generators agree'' is indistinguishable from ''the battery cannot tell
    anything apart''.'
  discriminated_from:
  - 'The RQ-INSTR-f8faa0 cost-model and machine-variance lane (15+ proposals, named in the anti-duplication
    list): those audit timing, cost models and hardware variance. This contract records no timing
    metric at all and its outputs are hardware-independent exact quantities; it audits what the generator
    produces, not what the machine does.'
  - 'KN-OPEN-3f7a21 (citation_verified audit): that audits the literature corpus''s markings; this
    audits a code artifact''s output distribution and touches no literature record.'
  - 'IDEA-20260805-3a855d (''charge what nobody charged''): audits an uncosted factor in a published
    route''s cost model. Different object (a published cost model versus this program''s own generator)
    and different metric family (gates and memory versus exact lattice statistics).'
  - 'EXP-HAWK-c8231a''s inherited-instrument declaration: that record declares the lineage, which
    is good practice, but declaring an inheritance is not measuring it; this contract measures what
    the declaration asserts.'
  - 'A conventional unit-test suite for the generator: unit tests check the constraints hold. This
    contract additionally measures which statistics are NOT pinned by the constraints, which no test
    suite reports because it is not a pass/fail question.'
  assumptions:
  - The declared generation rule is recoverable from the committed specifications and hypothesis scope
    statements to the level of an implementable algorithm; where it is not, the under-determination
    is reported as the finding rather than filled in.
  - An independent second generator satisfying the same constraint set can be written without unconsciously
    copying the first's incidental choices - which is why the constraint set must be written down
    BEFORE the second generator, and the ordering is enforced in the procedure.
  - The battery's statistics are a superset of what downstream lane experiments actually read; where
    a downstream experiment reads something the battery lacks, that is a reportable gap.
  - Sample sizes achievable within budget give the two-sample tests enough power to detect the deliberately-perturbed
    null generator; if they do not, the whole contract reports insufficient power rather than agreement.
  predictions:
  - metric: number of battery statistics classified rule-determined (the two honest generators disagree
      beyond sampling error)
    direction: higher
    minimum_effect: at least 1 of roughly 10 statistics; a report of 0 rule-determined statistics
      is only credible if the perturbed-generator positive control fired
  - metric: detection of the deliberately-perturbed null generator by at least one battery statistic
    direction: different
    minimum_effect: 'forced value: yes, at the sample size used; a no makes every agreement finding
      vacuous and halts the contract'
  - metric: number of free parameters in the declared rule that the committed records do not determine
    direction: higher
    minimum_effect: at least 1; zero would mean the lane's records fully specify the generator, which
      would be an unusually good outcome and should be checked twice
  - metric: number of statistics showing a jump rather than smooth scaling across ring degrees 4,
      8, 16
    direction: different
    minimum_effect: 'refusal to pre-commit: smoothness expectations differ per statistic and inventing
      a threshold before seeing the scaling would be a fabricated expectation'
  minimal_test:
    design: 'One invocation, three generators (declared rule, independent second rule, deliberately-perturbed
      null), ring degrees 4 and 8 only, 1000 instances each. Compute the battery: Gram entry mean
      and variance, orthogonality defect, ratio of shortest-vector length to the determinant''s 2n-th
      root, automorphism group order, determinant distribution, and Gram rank modulo 2, 3, 5. For
      every statistic run three tests in the same code path: constraint conformance (a boolean per
      instance), a two-sample permutation test between the two honest generators with 10000 shuffles,
      and the same test between the declared rule and the perturbed null. The discriminating outputs
      are (a) whether the perturbed null is detected - if not, stop and report insufficient power;
      (b) the list of statistics on which the two honest generators disagree, which is the rule-determined
      set. Cost is under an hour of single-core exact arithmetic at these degrees, and the result
      determines whether every other HAWK-lane contract in this batch needs a substitution caveat
      attached to specific metrics.'
    controls:
    - 'Deliberately-perturbed generator as a positive control: the battery MUST detect it, or no agreement
      finding is interpretable.'
    - 'Constraint-conformance boolean on every instance from every generator: a constraint violation
      is a bug report, not a statistic.'
    - 'Seed-split control: split each generator''s own output in half by seed and run the identical
      two-sample test within one generator; this must show no difference and calibrates the test''s
      false-positive rate.'
    - 'Degree-scaling control: report every statistic across ring degrees 4, 8, 16 so that a jump
      is visible rather than averaged away.'
    - 'Order-of-writing control: the constraint set is written and frozen before the second generator
      is implemented, and the specification records the commit order.'
    required_metrics:
    - per-statistic two-sample permutation p-value, declared rule versus independent second rule
    - per-statistic two-sample permutation p-value, declared rule versus perturbed null
    - seed-split within-generator p-values (false-positive calibration)
    - constraint-conformance failure counts per generator
    - per-statistic values across ring degrees 4, 8, 16
    - count of under-determined parameters in the declared rule
    - 'classification vector: constraint-determined / rule-determined / degree-anomalous per statistic'
  falsification_conditions:
  - 'The perturbed-generator positive control is not detected by any statistic: the battery has no
    power and no conclusion about generator fidelity is available at this sample size.'
  - The seed-split control shows differences within a single generator, meaning the two-sample tests
    have an inflated false-positive rate and every p-value is void.
  - Any generator produces constraint violations, meaning the constraint set or the implementation
    is wrong and the contract halts as a bug report.
  - Every statistic is classified rule-determined, meaning the stated constraints pin almost nothing
    and the lane's HAWK-SHAPED scope is far weaker than its records suggest - a strong and uncomfortable
    finding.
  - The declared rule cannot be recovered from committed records to an implementable level, in which
    case the contract's output is that under-determination and nothing else.
  confounders:
  - The second generator is written by the same agent that wrote the first reading, so incidental
    choices can be copied unconsciously; the write-order control mitigates but cannot eliminate this,
    and the residual is stated.
  - 'Sample size drives detection: a statistic classified constraint-determined at 1000 instances
    may be rule-determined at 100000, so every classification carries its sample size and is explicitly
    provisional.'
  - Multiple comparisons across roughly ten statistics inflate the false-positive count; a correction
    is required and its choice affects the rule-determined list.
  - Ring degree 4 is small enough that some statistics have very few possible values, making two-sample
    tests degenerate; degree-4 results must be read jointly with degree 8.
  - Marginal agreement does not imply joint agreement, so a clean bill from this battery is a statement
    about marginals only and must be labelled as such.
  interpretation_limits:
  - Fidelity here is fidelity to a stated constraint set and to a second implementation, NOT fidelity
    to HAWK, whose specification this program has not read; no run under this contract can measure
    the latter and none claims to.
  - A clean agreement result is a statement about the battery's statistics at the tested sample sizes
    and ring degrees, not a general guarantee.
  - Nothing here validates or invalidates any committed HAWK-lane conclusion; it quantifies a caveat
    those conclusions already carry in words.
  - No statement about HAWK's security, its parameters, or the standing of module-LIP follows from
    any outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed and none is possible from this contract. Battery
      cost is linear in the instance count times the per-statistic cost, with short-vector-dependent
      statistics exponential in dimension and therefore capped at ring degree 16.
    memory_exponent: No attack memory exponent is claimed. Storage is a table of roughly ten scalars
      per instance.
    best_known: 'There is no incumbent to beat: this corpus contains no generator-fidelity measurement
      for the HAWK lane, which is precisely the gap. The nearest existing practice is EXP-HAWK-c8231a''s
      declaration of an inherited instrument, which asserts lineage without measuring it.'
    hidden_overhead: The independence of the second generator is the whole contract and is not enforceable
      by code - it is a human discipline with a recorded write order, and it can fail silently. The
      second hidden cost is the multiple-comparison correction, which quietly determines the size
      of the rule-determined list.
  dominated_by: 'Checked against every route row in KN-OPEN-028''s live-surface table - Straznickas-Weis
    2^{(n/2+1)+o(n)} (KN-LIT-7592), nrd-PIP super-polynomial (KN-LIT-7674), definite/indefinite LIP
    reporting HAWK unaffected (KN-LIT-7648), the SLIP AM-intersect-coAM ceiling (KN-LIT-7671) - plus
    generic lattice reduction on the 2n-dimensional lattice. This is an instrument contract producing
    no attack and entering no row: n/a (no result claimed).'
  sota_delta: No attack; instrument-validity contribution only. The quantity moved is the per-statistic
    classification of the HAWK lane's generator into constraint-determined versus rule-determined,
    which goes from entirely unmeasured to measured with p-values, a positive control and a stated
    sample size.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (B), that the declared rule is recoverable from committed records
    to an implementable level: 0.5 - the hypothesis scope statements describe the discipline but I
    read only their scope blocks, and full specifications may or may not pin every parameter. Part
    (B), that at least one statistic is rule-determined: 0.8, because incidental choices almost always
    leak into some marginal. That the perturbed-generator positive control fires at 1000 instances:
    0.7, the risk being that the chosen perturbation is too subtle. Part (C), that the resulting record
    is actually reused by downstream lane contracts rather than filed and forgotten: 0.4, which is
    a statement about program practice rather than about mathematics and is recorded honestly as such.'
