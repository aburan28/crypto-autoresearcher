idea:
  id: IDEA-20260815-6ed3c9
  question_id: RQ-QALG-122b59
  added: '2026-08-15'
  title: >-
    EVERY QUANTUM SPEEDUP CLAIM IN THIS PORTFOLIO SHOULD FACE THE SAME
    QUESTION FIRST: is the claimed advantage over a STRUCTURE-EXPLOITING
    classical baseline or only over brute force?
  class: control

  claim: >-
    Quantum-advantage claims are routinely scored against a generic
    classical baseline rather than against the best structure-exploiting
    classical algorithm for the same instance. A speedup over brute force
    can vanish entirely against the right classical method. This record
    applies one baseline-attribution test uniformly across the portfolio's
    quantum claims.

  mechanism: >-
    For each quantum claim in the corpus, identify the classical baseline it
    is scored against, identify the best structure-exploiting classical
    algorithm for the same instance class, and recompute the claimed
    advantage against that instead.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-QALG-001 objective; grep 'baseline reproduction',
      'Grover-Prange', 'structure-exploiting'.
    results: >-
      IDEA-20260813-fe3c5e asks this for one HQC claim and
      IDEA-20260813-f35692 raises baseline attribution for lattice
      sieving; no record applies the test uniformly across the portfolio's
      quantum claims.
    verdict: >-
      ADAPTATION. Baseline attribution is standard and already applied
      per-claim here; the contribution is uniform application and a ranked
      list of claims whose advantage does not survive it.

  object_first_candidate:
    tracked_object: >-
      THE CLAIMED QUANTUM ADVANTAGE, re-scored against the strongest
      classical baseline rather than the one the claim chose.
    lossiness: >-
      Reducing a claim to one advantage ratio discards its regime
      dependence, so the ratio is reported per parameter regime rather
      than once.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the best classical baseline is identifiable per
      instance class; where it is contested, both candidates are reported.

  null_object_control: >-
    NULL 1 -- a claim whose advantage is uncontested (e.g. Shor over
    classical factoring), which must survive re-scoring; if it does not, the
    harness is wrong. NULL 2 -- a claim already known to be baseline-
    inflated, which must fail.

  discriminated_from:
    - >-
        IDEA-20260813-fe3c5e and IDEA-20260813-f35692, which apply this
        test to single claims; this record applies it uniformly and ranks
        the results.
    - >-
        The CSIDH cost-model reconstruction in this batch series, which
        reconciles competing quantum estimates rather than re-scoring
        against classical baselines.

  assumptions:
    - >-
        A best structure-exploiting classical baseline is identifiable per
        instance class; where contested, both are reported rather than one
        chosen.
    - >-
        Claims state their baselines explicitly enough to be re-scored;
        those that do not are listed as unscoreable.

  predictions:
    - metric: >-
        uncontested-advantage control
      direction: different
      minimum_effect: >-
        FORCED to survive re-scoring; failure voids the harness.
    - metric: >-
        known-inflated control
      direction: different
      minimum_effect: >-
        FORCED to fail re-scoring.
    - metric: >-
        count of portfolio claims whose advantage does not survive
      direction: different
      minimum_effect: >-
        The deliverable; a ranked list of which quantum claims here rest
        on a weak classical comparison.

  minimal_test:
    design: >-
      Three portfolio claims plus both controls.
    controls:
      - >-
          Uncontested-advantage positive control.
      - >-
          Known-inflated negative control.
      - >-
          Contested baselines reported in both variants.
      - >-
          Unscoreable claims listed rather than skipped.
    required_metrics:
      - >-
          Re-scored advantage per claim per regime.
      - >-
          Ranked list of claims failing re-scoring.
      - >-
          List of unscoreable claims.
      - >-
          Both control outcomes.

  falsification_conditions:
    - >-
        A control behaves wrongly. Harness invalid.
    - >-
        Most claims are unscoreable. The portfolio's quantum claims do not
        state their baselines and that is the finding.
    - >-
        Several claims fail re-scoring. Those claims must be re-labelled,
        which is the record's payoff.
    - >-
        All claims survive. The portfolio's quantum comparisons are sound,
        which is reassuring and worth recording.

  confounders:
    - >-
        BASELINE CHERRY-PICKING IN REVERSE: choosing an unrealistically
        strong classical baseline would unfairly retire sound claims, so
        contested baselines are reported in both variants rather than
        resolved.
    - >-
        REGIME DEPENDENCE: an advantage can survive in one parameter
        regime and not another, so a single verdict per claim would be
        wrong.

  interpretation_limits:
    - >-
        Re-scores existing claims; produces no new algorithm and no new
        bound.
    - >-
        Scoped to the claims audited and the baselines available.
    - >-
        A failed re-scoring re-labels a claim's advantage; it does not
        show the quantum algorithm is wrong.

  heuristic_assumptions:
    - id: HEUR-QALG-BASE-1
      statement: >-
        For each audited instance class, the best structure-exploiting
        classical algorithm is identifiable from the current literature.
      rigorous_support: >-
        Rigorous ingredient: for the classes involved the classical
        state of the art is documented in this corpus. THE GAP:
        classical baselines move, and a re-scoring is a statement about
        the literature at one moment rather than a durable verdict.
      falsification_condition: >-
        A classical algorithm better than the one used as baseline
        appearing for an audited class.
      validation_plan: >-
        SAMPLE: all audited claims, each with its baseline cited. TAIL
        CHECK: classes where the classical state of the art is
        contested, reported with both candidates. TRANSFER: none; the
        audit is time-stamped.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic re-scoring against published
      complexities.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbents are the quantum claims themselves and the classical
      algorithms they are scored against; neither is improved here.
    hidden_overhead: >-
      Classical baselines age, so the audit is a snapshot and must carry
      its date prominently.
    tradeoff_note: >-
      A stronger classical baseline gives a more honest advantage and
      risks retiring claims on a contested comparison; both variants are
      reported for that reason.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As algorithms: nothing is proposed. As a
    uniform baseline audit: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a uniform baseline-
    attribution re-scoring across the portfolio's quantum claims, a ranked
    list of those whose advantage does not survive, and an explicit list of
    claims that do not state their baseline well enough to be scored.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that both controls behave. 0.5 that most claims are scoreable from
    what they state. 0.4 that at least one portfolio claim fails re-scoring,
    which would require re-labelling.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
