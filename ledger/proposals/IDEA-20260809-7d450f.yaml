idea:
  id: IDEA-20260809-7d450f
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-WFS-e776b6
  goal_id: GOAL-WFS-001
  title: >-
    The statement-omission class is the severe one: a proof produced BEFORE the
    statement is chosen, verifying for a statement the prover then picks
  class: mechanism
  claim: >-
    Among the omission classes, leaving the statement out of the challenge
    derivation is qualitatively worse than leaving out a prior message, because it
    lets the prover choose WHAT is proved after the proof exists. The claim is
    that this yields a certificate of a distinct and stronger kind — one proof
    object accepted for multiple distinct statements — and that its existence is
    the sharpest available demonstration of why the class matters.
  mechanism: >-
    With the statement absent from the challenge input, the challenges depend only
    on prover messages. The prover therefore produces a transcript first and then
    solves for a statement consistent with it, which is a direct algebraic step in
    protocols whose verifier equation is linear in the statement.
  why_not_a_renamed_known_approach: >-
    This is the shape of the published weak-Fiat-Shamir disclosures. What this
    record adds is the multi-statement certificate — one proof, several accepted
    statements — which is a stronger and more legible artifact than a single
    false-statement proof and makes the failure mode self-evident to any reader.
  predictions:
  - observable: number of distinct statements one proof object is accepted for
    metric: integer
    predicted: >-
      More than one, and plausibly a whole parameterized family. A single
      statement only would mean the verifier equation constrains the statement
      more than expected, which is worth understanding.
  - observable: whether honest-path testing detects the omission
    metric: boolean
    predicted: No; honest proofs of true statements verify normally, which is exactly why this class survives conformance testing.
  minimal_test: >-
    Construct the multi-statement certificate against the reference protocol with
    the statement omitted, verify each accepted statement with an independent
    verifier, and report the family's size and structure.
  controls:
  - 'COMPLETE-TRANSFORM CONTROL: with the statement hashed, the same construction must fail, isolating the omission as the cause.'
  - 'INDEPENDENT VERIFIER for each accepted statement.'
  falsification_conditions:
  - Only one statement is accepted, weakening the claimed severity distinction.
  - The construction also succeeds with the statement hashed, indicating an unrelated defect.
  interpretation_limits: >-
    Against a deliberately weakened reference implementation, labelled as such.
    No third-party system is examined, named, or characterized, and no claim is
    made that any real system omits the statement.
  sota_delta: 'No new class. Delta: a stronger artifact form -- one proof, many statements -- that makes the class''s severity checkable rather than argued.'
  dominated_by: Part of the enumeration in IDEA-20260809-792aca and downstream of it; not dominated by any corpus record.
  estimated_cost: Implementation small; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no Fiat-Shamir records. WEB NOT CHECKED.'
  source_refs:
  - Weak Fiat-Shamir disclosures -- RECALLED, REQUIRED READS.
