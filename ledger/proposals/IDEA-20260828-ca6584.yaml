idea:
  id: IDEA-20260828-ca6584
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-28'
  title: 'Build the adversarial control neither existing detector proposal will build: derive an "unavoidable-conditions"-style
    detector for MD5''s classical (Wang et al.) disturbance-vector family, then actually compute and
    certify a REAL MD5 collision via a documented structurally distinct disturbance-vector family (Stevens''
    single-block construction, or the Xie-Feng weak-input-difference family), and test whether a detector
    derived against one family flags a collision genuinely constructed from the other.'
  class: control
  claim: '(A) GOAL-SHA1-001''s own next_action states plainly: "RUN THE DETECTOR AUDIT FIRST... The
    audit''s own gate is the adversarial control: build the evasive object BEFORE reporting coverage,
    so the audit is capable of failing." RQ-SHAONE-081e3a''s fourth target requires exactly this: "construct
    or characterise a colliding structure the detector would NOT flag, or prove within a stated class
    that none exists." Neither of this batch''s two detector proposals (IDEA-20260816-70b60d, IDEA-20260816-3edd14)
    does this: 70b60d''s discriminated_from list states "constructing an evader is a different and harder
    deliverable... this contract deliberately does not attempt evasion," and 3edd14''s states "this
    proposal produces the target list an evasion attempt would need but does not attempt one." The
    adversarial control this program''s own goal record names as mandatory is, as of this batch, unattempted.
    (B) A new SHA-1 collision is forbidden and infeasible at this budget. MD5 is the permitted, executable
    analogue: GOAL-MD5-001 owns a working end-to-end collision pipeline, and MD5 has MULTIPLE documented,
    structurally distinct attack constructions -- Wang et al.''s classical two-block differential path,
    and at least one genuinely different disturbance-vector family (Stevens'' single-block collision
    construction, or the Xie-Feng weak-input-difference family, eprint 2009/223). This gives a real,
    computable pair: a detector whose "unavoidable conditions" are derived against ONE family, and an
    ACTUAL, VERIFIED collision built from a DIFFERENT family, on the SAME hash function. (C) The claim
    is that this pairing is executable end to end within budget, that the resulting collision can be
    independently verified by direct recomputation, and that whether the classical-family detector flags
    it is a genuine, falsifiable, two-sided question -- unlike the symbolic coverage count (3edd14),
    this produces an ACTUAL certified counterexample or an ACTUAL certified pass, not a set-difference
    over an abstract index space. (D) WHAT IS NOT CLAIMED: no new SHA-1 collision, no assertion about
    what the REAL deployed SHA-1 detector does (this is an MD5-scale analogue built and derived independently
    by this program), no assertion that MD5''s finding transfers numerically to SHA-1, and no security
    consequence for any deployed system. A finding at MD5 scale is a finding about MD5-scale detector-design
    METHODOLOGY, offered as the cheapest available real test of whether "unavoidable conditions ruled
    out for one family" transfers to "unavoidable across families" -- the exact logical gap Stevens'' own
    2017 paper names as the thing a careful derivation must rule out. (E) A result showing the classical-family
    detector STILL flags the alternate-family collision is fully valuable: it would be the first computed,
    certified, cross-family positive result this program holds for any counter-cryptanalysis design,
    and would support (at MD5 scale only) that careful unavoidable-condition derivation can generalise
    beyond the family it was built against.'
  mechanism: 'STAGE 1: implement a simplified "unavoidable-conditions"-style detector for MD5''s classical
    Wang et al. two-block differential path -- i.e. a predicate over an MD5 message block that tests
    for the presence of sufficient conditions/state differences characteristic of that family''s local-collision
    structure, following the SAME design logic KN-TECH-066 describes (condition counting over a declared
    disturbance vector) and the SAME "rule out feasible variants within the family" discipline Stevens''
    2017 paper (eprint 2017/173) describes for SHA-1, but derived independently by this program for
    MD5''s classical family and validated on a battery of classically-constructed MD5 collisions produced
    by the GOAL-MD5-001 pipeline (must flag all of them, or the detector implementation is broken and
    the run halts). STAGE 2: implement or adapt a SECOND, structurally distinct MD5 collision construction
    -- the single-block construction (Stevens) or the Xie-Feng weak-input-difference family (eprint
    2009/223) -- and actually produce a real MD5 collision from it, independently verified by direct
    recomputation of both messages'' MD5 digests. This is the one step in this proposal that requires
    real implementation effort and is the primary cost driver. STAGE 3: run the STAGE-1 detector against
    the STAGE-2 collision''s two messages, recording flag/no-flag and, if the detector exposes per-condition
    diagnostics, WHICH conditions fired or failed to fire. STAGE 4, positive control: run the identical
    STAGE-1 detector against a battery of classically-constructed collisions (already required in STAGE
    1) and confirm it flags all of them at a declared rate, establishing the detector is not simply
    broken or non-discriminating. STAGE 5, null control: run the identical STAGE-1 detector against
    a battery of length-and-block-count-matched NON-colliding MD5 messages, confirming a low false-positive
    rate, so a STAGE-3 flag (if one occurs) is attributable to the alternate family''s structure and
    not to message shape alone. STAGE 6: report the STAGE-3 outcome as a certified pass or a certified
    counterexample, with the actual collision, its digest match, and the detector''s full diagnostic
    trace filed as an artifact -- never as a bare "flagged/not flagged" bit.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-SHAONE-081e3a and GOAL-SHA1-001 in full; the goal record''s next_action explicitly
      names the adversarial control as the audit''s own required gate. Read IDEA-20260816-70b60d and
      IDEA-20260816-3edd14 in full, both of which explicitly and separately disclaim attempting evasion
      construction. Grepped all 13 RQ-MDFIVE proposals'' titles (ledger/proposals/IDEA-20260821-{ea35d1,e46061}.yaml,
      IDEA-20260816-{e40ea1,d285e8,c20a5b,9b3b6b,85ce8c,79aec0,585c93,520dda,3e6af3,1e36fa,13db82}.yaml):
      all concern MD5/MD4 preimage-collision asymmetry, splice-and-cut MITM preimage attacks, degrees-of-freedom
      instrument validation, and message-schedule structural comparisons; none mentions a counter-cryptanalysis
      detector, disturbance-vector-family coverage, or cross-family adversarial construction. Web-searched
      Stevens'' single-block MD5 collision and Xie-Feng eprint 2009/223 as candidate alternate families.'
    results: No proposal in either the RQ-SHAONE or RQ-MDFIVE buckets attempts to construct an actual
      collision and test it against a detector; the two detector-focused RQ-SHAONE proposals both explicitly
      name evasion construction as the deliberately excluded harder deliverable, and GOAL-SHA1-001's
      own next_action names it as the still-outstanding required gate.
    verdict: 'UNVERIFIED. No claim is made about whether cross-disturbance-vector-family detector transfer
      has been studied in published work -- Stevens'' own 2017 paper''s explicit caveat about ruling
      out feasible variants suggests the question is at least recognised in principle, but this program
      has not read that derivation''s actual case analysis. What is claimed new internally: this repository
      holds zero attempts, symbolic or executable, to construct an adversarial (evading or non-evading)
      test object for any hash-collision detector, and using MD5''s multiple documented disturbance-vector
      families to make this executable and certifiable -- rather than symbolic, as 3edd14 is, or non-adversarial,
      as 70b60d is -- is assembled from the program''s own object-first and null-control discipline applied
      to a genuinely uncovered RQ target.'
  citations:
    - ref: "https://www.marc-stevens.nl/research/md5-1block-collision/md5-1block-collision.pdf"
      provenance: retrieved
      claim: "Stevens' single-block MD5 collision construction uses a message differential/disturbance vector structurally distinct from Wang et al.'s classical two-block path."
      verified_by: "WebSearch 2026-08-28, title and existence confirmed; full primary text not opened by this session."
    - ref: "eprint 2009/223 (Xie, Feng, \"How To Find Weak Input Differences For MD5 Collision Attacks\")"
      provenance: retrieved
      claim: "Describes an alternate single-block MD5 collision family using different message differences than Wang et al., with a reported attack at roughly 2^20.96 MD5 compressions using the less-promising of two identified difference families."
      verified_by: "WebSearch snippet 2026-08-28; full primary PDF not opened. File as KN-LIT before STAGE 2."
    - ref: "eprint 2006/105 (Klima, \"Tunnels in Hash Functions: MD5 Collisions Within a Minute\")"
      provenance: retrieved
      claim: "Tunneling technique adds freedom to Wang et al.'s classical differential collision search via the first-round selective function; a refinement of the classical family rather than a structurally distinct one."
      verified_by: "WebSearch snippet 2026-08-28; full primary PDF not opened."
    - ref: "eprint 2017/173 (Stevens, \"Speeding up detection of SHA-1 collision attacks using unavoidable attack conditions\")"
      provenance: retrieved
      claim: "Unavoidable conditions must be shown necessary for every feasible variant attack within a declared class, or a knowledgeable adversary could bypass detection with a chosen variant -- the explicit methodological caveat this proposal operationalises at MD5 scale."
      verified_by: "WebSearch snippet 2026-08-28; full primary text not opened."
    - ref: KN-TECH-066
      provenance: internal
      claim: "Message modification and disturbance-vector condition-counting as the standard technique for unkeyed differential hash cryptanalysis, and Wang et al. 2004-05 named as the originating classical construction."
      verified_by: "Read in full this session."
  object_first_candidate:
    tracked_object: 'A single actual MD5 collision instance, carried as (message pair, digest match certificate,
      declared disturbance-vector family of origin, detector diagnostic trace). What is followed is
      whether ONE concretely computed object, tagged with which family produced it, survives a detector
      derived against a DIFFERENT family -- a single certified data point, not a distribution or a symbolic set.'
    lossiness: 'Genuinely lossy, and deliberately minimal. The projection discards nothing about the
      collision itself (both messages and their digests are retained in full as the certificate requires)
      but discards every OTHER possible collision from either family -- this is n=1 per family at minimum,
      by design, since the point is to establish existence of a real, certified cross-family test object
      before any statistical claim is attempted. It is compatible with the operation because a single
      counterexample or a single certified pass is exactly what settles an existence question, which
      is the form of RQ target 4 ("construct... or prove... that none exists").'
    propagation: 'One step of the target operation is running the STAGE-1 detector against the STAGE-2
      collision and recording its diagnostic trace. There is no accumulation across steps at the minimal
      scale: this is a single evaluation, and STAGE 4-5''s batteries exist only to establish that the
      detector is not degenerate (STAGE 4: it flags what it should; STAGE 5: it does not flag everything).'
    survival_score: 'The object survives exactly as long as the alternate-family construction (STAGE
      2) can actually be implemented and produce a verified collision within budget -- this is the single
      largest risk in the design, since re-implementing a documented but non-trivial cryptanalytic construction
      (single-block MD5 or Xie-Feng) is real engineering work, not a symbolic exercise. If STAGE 2 cannot
      be completed within budget, the proposal dissolves to reporting that boundary as a budget outcome
      (AGENTS.md rule 3), not as evidence about detector coverage.'
  null_object_control: 'STAGE 5''s length-and-block-count-matched non-colliding message battery, run
    through the identical STAGE-1 detector in the same invocation as STAGE 3-4. This establishes the
    detector''s baseline flag rate on ordinary messages, so that a STAGE-3 flag (if the alternate-family
    collision IS caught) is attributable to genuine near-collision structure and not to message shape,
    and so that a STAGE-3 miss (if it evades) is attributable to the family difference and not to the
    detector simply never flagging anything.'
  discriminated_from:
    - 'IDEA-20260816-70b60d (detector as instrument): explicitly disclaims attempting evasion construction
      and uses MD5-scale objects only as a SUBSTRATE for a SHA-1-domain predicate''s true-positive rate,
      never constructing a collision specifically designed to be structurally distinct from what any
      detector was derived against. This proposal derives its OWN MD5-domain detector specifically so
      the family-mismatch question is well-posed, and its object is a single certified cross-family
      test, not a corpus-wide rate.'
    - 'IDEA-20260816-3edd14 (disturbance-vector coverage enumeration): purely symbolic, explicitly never
      runs any detector on any message, and produces a coverage FRACTION over an abstract index space.
      This proposal computes and certifies one REAL collision and runs one REAL detector on it, producing
      an existence result, not a fraction.'
    - 'The RQ-MDFIVE preimage/collision-asymmetry proposals (all 13 titled records checked): concern
      MD5''s own structural preimage-vs-collision gap, MITM attacks, and degrees-of-freedom instrumentation;
      none constructs or tests a counter-cryptanalysis detector, and this proposal borrows only the
      permitted, executable MD5 collision pipeline those goals'' infrastructure supports, per GOAL-MD5-001''s
      non-duplication clause that GOAL-SHA1-001 "consumes" but does not own that pipeline.'
    - 'A generic claim that "detectors might miss variant attacks": that is an assertion; this proposal
      produces one independently derived detector, one independently constructed and digest-verified
      collision from a documented alternate family, a positive control battery, a negative control battery,
      and a filed diagnostic trace.'
  assumptions:
    - At least one documented MD5 disturbance-vector family genuinely structurally distinct from Wang et al.'s classical path (single-block Stevens construction or Xie-Feng weak-input-difference family) is implementable within this program's budget; if neither is, the proposal is reported as blocked by implementation cost rather than by any finding about detection.
    - The STAGE-1 detector, though independently derived by this program rather than a re-implementation of any specific published MD5 detector, is a faithful enough instance of the "unavoidable-conditions" design methodology that a family-transfer finding is informative about that methodology, not merely about this program's own implementation choices; STAGE 4's positive-control battery is the direct check on this.
    - A collision produced under the alternate family is correctness-verified by direct digest recomputation independent of any detector's own internal claims, so a "miss" cannot be an artifact of a broken collision.
    - The MD5-scale finding is an analogue and licenses no numeric or qualitative transfer to SHA-1's actual deployed detector without restating the same construction at SHA-1 scale, which this proposal explicitly does not attempt.
  proof_search_map:
    bottleneck: >-
      Whether "necessary for every feasible variant within family F" (an unavoidable-conditions derivation's
      actual guarantee) implies "necessary for every feasible attack on the same hash function" (what
      a deployed detector's users need). The bottleneck is the cross-family case analysis Stevens' 2017
      paper's own caveat names as required and that this program has not read in primary text.
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: >-
        STAGE 4's positive-control battery (classically-constructed collisions must all be flagged)
        is the closest analogue to a baseline reproduction check, confirming the independently derived
        detector behaves as an unavoidable-conditions-style detector should within its own declared family.
    observation_collision:
      observable: "The detector's binary flag decision (and, where available, its per-condition diagnostic trace) on a message pair."
      distinct_preimage_search: >-
        The alternate-family collision IS the sought distinct preimage: two structurally different
        message constructions (classical Wang-family vs. single-block/Xie-Feng-family) that both satisfy
        "is an MD5 collision" while potentially differing on "is flagged by a classical-family detector."
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: "The STAGE-1 detector, re-expressed as a predicate over a declared, family-specific condition set rather than over raw message bytes."
        predicted_gain: "Makes the cross-family question decidable by inspection of which conditions the alternate family's differential path does or does not satisfy, once the actual collision is in hand."
    quantifier_order: >-
      EXISTS a documented MD5 disturbance-vector family F2 structurally distinct from the classical
      family F1 the STAGE-1 detector is derived against, and EXISTS a message pair m1,m2 constructed
      under F2 such that MD5(m1)=MD5(m2) and the F1-derived detector does NOT flag (m1,m2) -- this is
      the counterexample form. The complementary, equally reportable form is: FOR ALL constructed F2
      instances tested, the F1-derived detector DOES flag them -- a bounded positive result over the
      tested instances, not a universal proof over all of F2.
    method_ceiling:
      strongest_certifiable_claim: >-
        A single certified existence result (a specific real, digest-verified MD5 collision that a
        specific, filed, independently-derived MD5 detector implementation does or does not flag),
        at MD5 scale, for the specific families implemented in STAGE 1-2.
      nearby_object_control: >-
        A classically-constructed collision run through the same detector (STAGE 4) is the nearby object:
        if the detector fails to flag even the family it was derived against, no cross-family conclusion
        is admissible, since the instrument itself would be broken.
    proof_obligations:
      - claim: "The STAGE-1 detector flags all classically-constructed test collisions."
        responsibility: baseline
      - claim: "The STAGE-2 collision is a genuine MD5 collision."
        responsibility: correctness
      - claim: "The STAGE-1 detector's flag/no-flag decision on the STAGE-2 collision is reproducible and not an artifact of implementation nondeterminism."
        responsibility: success_probability
      - claim: "The STAGE-1 detector does not flag unrelated, non-colliding messages at a materially elevated rate."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: STAGE-1 detector flag rate on the classically-constructed positive-control battery
      direction: higher
      minimum_effect: 'predicted at or near 1.0 (all flagged); any miss here voids the whole design per falsification_conditions'
    - metric: STAGE-1 detector flag rate on the length-matched non-colliding negative-control battery
      direction: lower
      minimum_effect: 'predicted materially below the positive-control rate; a ratio above 0.3 would make the detector non-discriminating and void the design'
    - metric: STAGE-1 detector flag decision on the STAGE-2 alternate-family collision
      direction: different
      minimum_effect: 'explicit refusal to pre-commit a direction: this single existence outcome (flagged vs. not flagged) is the entire question the proposal exists to answer, and pre-committing a prediction would prejudge the result the design is built to be capable of returning either way'
    - metric: number of STAGE-1 declared conditions satisfied by the STAGE-2 collision, out of the total condition set
      direction: different
      minimum_effect: 'reported as a count with the specific conditions named, whether the overall verdict is flag or no-flag, since a near-miss (most but not all conditions satisfied) is itself informative about how close the family boundary is'
  minimal_test:
    design: 'The cheapest discriminating step is STAGE 1 plus STAGE 4-5 alone, using the classical family
      only: implement the MD5 unavoidable-conditions-style detector, validate it flags a battery of
      classically-constructed collisions from the existing GOAL-MD5-001 pipeline, and confirm it does
      not flag matched-length non-colliding messages. This costs no new cryptanalytic construction (the
      classical MD5 pipeline already exists) and settles whether the detector instrument itself is well-formed
      before the expensive STAGE-2 alternate-family construction is attempted. Only if STAGE 1/4/5 pass
      does the run proceed to implementing the alternate family and running STAGE 3, which is the genuinely
      costly step and the one this proposal is honest about as its main implementation risk.'
    controls:
      - Positive-control battery of classically-constructed MD5 collisions, all of which must be flagged before any cross-family claim is trusted.
      - Negative-control battery of length-and-block-count-matched non-colliding messages.
      - Independent digest recomputation of every collision, classical and alternate-family, before it is submitted to the detector.
      - Filed diagnostic trace (per-condition fired/not-fired) for the STAGE-2 result, not a bare bit.
    required_metrics:
      - detector flag rate on the positive-control battery
      - detector flag rate on the negative-control battery
      - STAGE-2 collision digest-match certificate
      - STAGE-3 flag/no-flag outcome with full per-condition diagnostic trace
      - count and identity of satisfied vs. unsatisfied declared conditions for the STAGE-2 result
  falsification_conditions:
    - The STAGE-1 detector fails to flag one or more classically-constructed positive-control collisions, showing the instrument itself is broken and voiding any cross-family claim.
    - The STAGE-1 detector flags negative-control (non-colliding) messages at a rate comparable to its positive-control rate, showing it is non-discriminating.
    - The alternate MD5 disturbance-vector family (STAGE 2) cannot be implemented to produce a verified collision within budget -- a budget and implementation-cost outcome, explicitly not evidence about detector coverage (AGENTS.md rule 3).
    - The STAGE-2 collision fails independent digest recomputation, voiding its certificate.
    - Detector diagnostics are non-reproducible across repeated runs on the identical message pair, showing the implementation has nondeterminism that must be fixed before any verdict is reported.
  confounders:
    - An independently derived detector (rather than a re-implementation of any specific published MD5 detector) may simply be a weaker or stronger instrument than any real deployed tool, so a family-transfer finding is a statement about THIS program's derivation, not about any specific published or deployed MD5 detector -- stated as a limitation, not hidden.
    - The alternate family's implementation difficulty may force simplifications (e.g. a shorter or easier variant) that make it closer to the classical family than the strongest published version, understating any genuine family gap.
    - A near-miss (most but not all conditions satisfied) could be reported as a clean pass or clean failure if the diagnostic granularity is too coarse; the full per-condition trace requirement exists specifically to prevent this.
  interpretation_limits:
    - A finding at MD5 scale, using an independently derived detector, licenses no numeric or qualitative transfer to SHA-1's actual deployed counter-cryptanalysis detector; restating this construction at SHA-1 scale is explicitly out of scope and forbidden by the RQ's claim_tier_ceiling.
    - A single certified counterexample or a single certified pass is an existence result over the specific families and detector implemented here, not a general theorem about unavoidable-conditions methodology.
    - Nothing here bears on any real deployed system, repository, or certificate.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A detector condition proven "unavoidable" by ruling out feasible variants WITHIN one named
        disturbance-vector family carries no default guarantee across a second, structurally distinct
        family for the same hash function -- i.e. within-family necessity is not evidence of cross-family
        necessity unless the derivation's case analysis explicitly considered cross-family variants.
        This mirrors the general statistical point that a property established on one sub-population
        does not transfer to a different sub-population without an explicit covariate argument connecting them.
      rigorous_support: >-
        Not a proved theorem; it restates, as a testable hypothesis, the exact methodological caveat
        Stevens' 2017 paper states in its own description of how unavoidable conditions must be derived
        (ruling out feasible variant attacks or risking bypass by a knowledgeable adversary).
      validation_plan: >-
        Sample: n=1 certified alternate-family collision at minimum (STAGE 2), extendable to n>1 if
        budget allows multiple independent instances of the alternate family (e.g. re-running the single-block
        or Xie-Feng construction with different random seeds where the construction has any). Shortcut:
        none needed beyond the existing GOAL-MD5-001 pipeline for the classical-family positive controls;
        the alternate family must be implemented directly since no correspondence shortcuts an actual
        cryptanalytic construction. Comparison: the predicted distribution under H1 is "no guarantee
        either way" -- the validation is the existence outcome itself (flagged or not), not a comparison
        to a numeric distribution. Tail check: the per-condition diagnostic trace is the tail-consistency
        check available at n=1 -- a near-miss (most conditions satisfied) is a soft form of partial transfer,
        while a clean miss (few or no conditions satisfied) is a clean refutation of any default transfer.
  target_complexity:
    time_exponent: >-
      No SHA-1 or general attack exponent is claimed or altered. The deliverable is a single certified
      existence result at MD5 scale (collision produced, digest-verified, and passed through a detector),
      not an asymptotic complexity claim.
    memory_exponent: No memory exponent is claimed. Memory cost is that of an ordinary MD5 collision search at whatever scale the alternate-family implementation requires, reported beside time and not folded into any verdict.
    best_known: >-
      The incumbent is the complete absence, in this program's corpus, of any constructed adversarial
      test object for any hash-collision counter-cryptanalysis detector, despite GOAL-SHA1-001's own
      next_action naming this construction as the audit's required gate. No detection algorithm is
      beaten; an unattempted control is attempted.
    hidden_overhead: >-
      Implementing a documented but non-trivial cryptanalytic construction (single-block MD5 or Xie-Feng)
      from a paper this program has not yet read in primary text is real engineering work with a real
      chance of exceeding budget before a verified collision is produced; this is disclosed as the design's
      main cost driver and risk, not smoothed over.
    tradeoff_note: not applicable at this scale; no time-memory tradeoff is exercised beyond whatever the alternate-family MD5 construction itself requires, which is reported as an ordinary implementation cost.
  dominated_by: >-
    n/a (no result claimed). Checked across time, memory and data/query axes: the deliverable is a
    single certified existence result about detector-methodology transfer at MD5 scale, placing no
    point on any attack frontier for any hash function. It is the direct, previously-unattempted instantiation
    of GOAL-SHA1-001's own required adversarial-control gate, not a competing result against any Pareto frontier.
  sota_delta: >-
    No attack; conceptual/control contribution only. Quantitatively: the repository moves from zero
    constructed adversarial (or non-adversarial-but-cross-family) test objects for any hash-collision
    detector to one independently derived MD5-scale detector, a positive-control battery, a negative-control
    battery, one certified cross-family collision with a full digest certificate, and a per-condition
    diagnostic trace of the detector's verdict on it.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: >-
    Separable parts. (1) That an independently derived MD5 "unavoidable-conditions"-style detector can
    be built and validated to flag all classically-constructed collisions: about 0.7, since the classical
    family's structure (KN-TECH-066) is well documented internally. (2) That it correctly rejects non-colliding
    negative controls at a low rate: about 0.75. (3) That the alternate family (single-block or Xie-Feng)
    can actually be implemented to produce a real, digest-verified MD5 collision within budget: about
    0.45 -- this is genuine cryptanalytic re-implementation work from a paper not yet read in primary
    text, and is the design's dominant risk. (4) Conditional on (1)-(3) succeeding, that the result is
    informative either way (i.e. the diagnostic trace is fine-grained enough to distinguish a clean
    pass/fail from an ambiguous near-miss): about 0.8. Composite roughly 0.19 for the full cross-family
    test; the minimal STAGE-1/4/5 test alone (detector validation on the existing classical pipeline,
    no new construction) succeeds with probability near 0.65 and is worth running regardless, since
    it is the load-bearing precondition for the more expensive STAGE 2-3.
