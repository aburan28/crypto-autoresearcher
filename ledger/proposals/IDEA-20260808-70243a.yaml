    metric: fraction of triples (alpha_1, alpha_2, alpha_3) from independent runs that fail
      to span B over Q
    predicted: O(1/p), i.e. zero at any observable scale. A nonzero rate at toy scale means
      the outputs are correlated and the whole record fails.
  - observable: 'the index [End(E) : O'']'
    metric: its size and its largest prime factor, at toy scale
    predicted: 'Size ~ sqrt(disc(O''))/p, dominated by the product of the three degrees; largest
      prime factor distributed like that of a random integer of that size, hence smooth with
      the usual Dickman probability. THIS IS THE RISK: a large prime factor makes saturation
      expensive.'
  - observable: end-to-end EndRing cost
    metric: multiplicative overhead over one OneEnd solution
    predicted: O(1), specifically 3 plus the saturation cost; against the cascade's SC-3-priced
      overhead this is the comparison the record exists to make.
  minimal_test: 'Toy, on the corpus''s existing graph builder plus its pure-Python quaternion
    arm: at p <= 10^4, run the surrogate of Algorithm 3 three times per curve, build O'',
    compute its discriminant and index, saturate, and CHECK the result against the independently
    computed End(E) (available at toy scale by exhaustive means). Report the index''s factorisation
    distribution. That distribution is the deliverable and it decides the record.'
  controls:
  - 'POSITIVE CONTROL (must fire): plant three known endomorphisms generating a known suborder
    of known index; the saturation must recover the maximal order exactly.'
  - 'NULL: two endomorphisms only (rank 3). The procedure must FAIL to produce a maximal order
    -- if it ''succeeds'' with insufficient data the instrument is fabricating.'
  - 'INDEPENDENCE CONTROL: deliberately reuse one walk across two runs; the spanning failure
    rate must jump, confirming the instrument detects correlation.'
  confounders:
  - Index smoothness is a heuristic and is exactly the kind of assumption this program is
    supposed to name; it is HB-6 below.
  - Toy p makes the three degrees small and the index correspondingly small; the index's factorisation
    distribution at toy scale may not predict crypto scale, and the record must say so.
  - SC-2 requires log deg alpha = (log p)^{O(1)}; Algorithm 3's output has degree p * deg(phi)
    * deg(omega)^2, all of polynomial bit length, so SC-2 is satisfied -- and this is checked,
    not assumed.
  falsification_conditions:
  - The positive control fails to recover the maximal order from planted generators.
  - The null (two generators) appears to succeed -- instrument broken.
  - The index's largest prime factor is systematically large (non-smooth) across the toy range,
    in which case saturation is not polynomial and the bypass fails, leaving the [35] cascade
