  title: Harvest three independent claws instead of one and output a basis of End(E) directly,
    bypassing [35, Theorem 7.2] -- whose only explicit exponent, Omega((log N)^{-12}), this
    corpus already prices at 2^96 to 2^192 at log2 p = 256 and which SC-3 therefore forbids
    anyone from carrying.
  class: composition
  claim: 'Theorem 1.1 solves OneEnd; Corollary 1.2 reaches EndRing by citing [35, Theorem
    1] (line 21). This program''s standing condition SC-3 records that the cascade''s concrete
    cost is NOT inheritable, because [35]''s Theorem 7.2 carries a per-iteration success probability
    Omega((log N)^{-12}) which propagates to 2^96-2^192 at log2 p = 256 against a 2^{85.3}
    headline. CLAIM: the cascade is avoidable for this particular algorithm. Algorithm 3 returns
    alpha = omega-hat o phi_Frob o phi o omega, and running it to collect THREE Z-linearly
    independent such alpha_1, alpha_2, alpha_3 costs 3x the expected time -- an O(1) factor,
    not an exponent -- because each attempt is independent. Since 1, alpha_1, alpha_2, alpha_3
    span B_{p,infty} over Q whenever the alpha_i are independent, the order O'' = Z + Z alpha_1
    + Z alpha_2 + Z alpha_3 has finite index in End(E), and End(E) is recovered by saturating
    O'' at the primes dividing [End(E) : O'']. CONSEQUENCE: EndRing at p^{1/3+o(1)} with an
    O(1) multiplicative overhead and no (log N)^{-12}, PROVIDED the index has no large prime
    factor -- which is the one obligation the record does not discharge and states as its
    central risk.'
  mechanism: 'Independence: each alpha_i comes from a fresh walk omega_i and a fresh curve
    E_i, so the three are structurally unrelated; the probability that three such elements
    fail to span is O(1/p) by a Schwartz-Zippel-style count on the rank-4 lattice, which the
    record must prove as a size lemma rather than assert. Index bound: disc(O'') is computable
    from the reduced norms and traces of the alpha_i, and [End(E):O'']^2 = disc(O'')/disc(End(E))
    = disc(O'')/p^2, so the index is a computable integer. Saturation at a prime q is a linear-algebra
    step over F_q, polynomial in log q; the whole step is polynomial iff the index is smooth
    or has a factorable shape. THIS IS THE STANDARD "compute End from a few endomorphisms"
    step used by [24, 26] in the p^{1/2} setting; the contribution is not the step but the
    observation that Algorithm 3''s own output already supplies its inputs at O(1) extra cost,
    which the frozen source does not remark and Corollary 1.2 does not use.'
  why_not_a_renamed_known_approach: Nearest known method is exactly [24, 26]'s route, which
    composes two found isogenies to a conjugate into an endomorphism (frozen source line 53)
    and then builds the order. Those works pay p^{1/2} to find each. The delta here is the
    composition with Algorithm 3 and the resulting cascade bypass, plus the explicit accounting
    against SC-3's priced (log N)^{-12}. Corpus-side, IDEA-20260806-62ba9d costed the cascade
    and DID NOT propose avoiding it.
  predictions:
