idea:
  id: IDEA-20260811-503098
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGP-b99df5
  goal_id: GOAL-ENDO-001
  claim_tier: toy
  title: >-
    THE QUANTIFIER LATTICE FOR THIS LANE, PRICED -- of the seven quantifier axes
    on which L10 reduction claims are stated, four COLLAPSE (two free, two at
    polylog), two collapse only at a price of p^{1/4} which is exactly T5's hard
    side, and exactly two DO NOT COLLAPSE: knowledge of End(E) (a subexponential
    gap) and the choice of isogeny class. So every reduction statement in this
    lane has a NORMAL FORM in two variables, quantifier slippage becomes
    mechanically detectable, and the corpus's own records can be audited against
    it in an hour
  class: control

  claim: >-
    (A) THE PROBLEM THIS SOLVES. The handoff for this axis states that
    reductions in this area die almost entirely from quantifier slippage. The
    corpus bears that out: IDEA-20260807-5d7606 devotes its opening section to
    warding off two specific slipped readings (W1, W2), and every later L10
    record repeats a bespoke version of the same paragraph. A per-record ward is
    not a solution; it is a symptom. This record proposes the audit instrument:
    enumerate the axes, prove or price the collapse of each, and reduce every
    statement to a normal form in the axes that remain.

    (B) THE SEVEN AXES, WITH THEIR VERDICTS AND PRICES.
      Q1 CHOICE OF BASE POINT. Replacing P by [u]P for u in (Z/N)^* replaces the
         answer k by k*u^{-1}. COLLAPSES, FREE. [fact]
      Q2 CHOICE OF TARGET / worst-case over k versus average-case over k.
         Replacing Q by Q + [r]P replaces k by k + r, uniform if r is. COLLAPSES,
         FREE (random self-reducibility in k). [fact]
      Q3 WORST-CASE OVER CURVES IN THE CLASS versus average-case over the class.
         A short random walk in the crater transports the instance to a curve
         indistinguishable from uniform, carrying k unchanged (transport theorem
         T1), at polylog cost under the GRH-conditional rapid mixing T5 cites.
         COLLAPSES IN ONE DIRECTION AT POLYLOG COST -- worst-case instances may
         be randomised. It does NOT collapse in the other direction: moving to a
         SPECIFIED curve costs about h^{1/2} = p^{1/4}. THE ASYMMETRY IS T5, and
         writing it as a quantifier price rather than as a folk warning is half
         the value of this record. [fact for T1; GRH-conditional for the mixing;
         see IDEA-20260807-631e80, which supplies the point-level version.]
      Q4 UNIFORM versus NON-UNIFORM. If the advice is any polynomial-time
         function of (p, E, t), the uniform machine computes it itself.
         COLLAPSES, FREE. If the advice is an arbitrary precomputed table, it
         does NOT collapse -- that is the preprocessing model, resource R8, lane
         L13, and it is EXCLUDED from this lattice by declaration rather than by
         argument.
      Q5 KNOWLEDGE OF End(E). Does not collapse in polynomial time: constructing
         O requires the conductor, hence the factorisation of D = t^2 - 4p.
         It collapses at SUBEXPONENTIAL cost. NON-COLLAPSING AXIS #1, and its
         price is subexponential rather than polynomial or p^{1/4}, which makes
         it qualitatively different from every other axis here.
      Q6 ORACLE FOR ONE CURVE versus FOR ALL CURVES IN THE CLASS. An oracle sited
         at a SPECIFIED curve E_0 is usable only after transporting the instance
         to E_0, which is the specified-reachability problem again: about
         p^{1/4}. COLLAPSES AT PRICE p^{1/4}. Note the consequence, which is not
         obvious and is worth stating: for-one-curve and for-all-curves oracles
         are equivalent up to p^{1/4}, so a reduction that carefully assumes the
         weaker one has bought itself at most that factor.
      Q7 WORST-CASE versus AVERAGE-CASE OVER CLASSES (varying D at fixed p). No
         self-reduction transports an instance between different isogeny
         classes; T1 is intra-class only. NON-COLLAPSING AXIS #2.

    (C) THE NORMAL FORM. Every reduction claim in this lane is therefore
    equivalent, up to the prices in (B), to a statement of the shape
      FORALL isogeny classes in a declared family F (Q7),
      [WITH | WITHOUT] knowledge of End(E) (Q5),
      THERE EXISTS a uniform polynomial-time oracle machine R,
      FORALL instances on the class,
        R succeeds with probability at least 2/3,
      at an additive quantifier-elimination cost of
        0 for Q1, Q2, Q4-poly;
        polylog for Q3-randomisation;
        p^{1/4} for Q3-specified and Q6.
    Two variables, one cost table. Any L10 statement not expressible in this
    form is either exercising the excluded preprocessing axis Q4-table, or is
    slipped.

    (D) WHAT THE RECORD PREDICTS ABOUT THE CORPUS, AND THIS IS THE TEST. Applied
    to the eleven committed RQ-CLGP-b99df5 records and to this batch's records,
    every stated quantifier order should reduce to (C) with a nonempty price
    list. The instrument is falsified in the useful direction if some record
    reduces to a strictly STRONGER statement than its authors claimed (a free
    strengthening), or in the alarming direction if some record's conclusion
    depends on an axis this lattice says is free (a slipped conclusion). Both
    outcomes are actionable and both are cheap to find.

    (E) WHAT THIS IS NOT. It is not mathematics about ECDLP. Every entry in (B)
    is either elementary, or a restatement of the campaign's own T1/T5, or a
    cited cost. Its contribution is that it makes an error class mechanically
    detectable, and that it prices two axes (Q3-specified, Q6) that the corpus
    has been treating as free.

  resource_label: >-
    None -- this is an audit instrument in the sense of lane L14
    (RQ-INSTR-f8faa0) and lane L12, operating on RECORDS rather than on curves.
    The resources it PRICES are R3 (End(E), axis Q5), R4 (the class action,
    axes Q3 and Q6) and R8 (preprocessing, axis Q4-table, explicitly excluded).
  admissibility: admissible
  admissibility_argument: >-
    The record consumes no resource and applies no endomorphism to any point;
    the admissibility filter is what it helps future records apply, not
    something it must pass substantively. It does not re-test H-ENDO-001 and
    does not revisit KN-FIND-b7e091.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the primary lens: the connecting ideal class; the
      kernel ideal of <Q>; the endomorphism scalar on G; cost functionals as
      class functions; the generic-group transcript.
    tracked_object: >-
      THE QUANTIFIER PREFIX OF A CLAIM, together with the elimination price of
      each of its quantifiers. The object is not a mathematical structure on the
      curve; it is a structure on the STATEMENTS the lane produces, which is a
      legitimate object under the inventor protocol's object-first framing and
      is the object this axis's failure mode actually lives on.
    lossiness: >-
      GENUINELY LOSSY. The projection maps a full research record -- claim,
      mechanism, predictions, cost model -- to a prefix of quantifiers and a
      cost vector of length 7. It discards all mathematical content. It is
      discarded COMPATIBLY with the operations of interest, which are
      composition of reductions and specialisation of a claim: the prefix of a
      composite is the concatenation of the prefixes and the price vector is the
      sum, so one-step propagation is defined and deterministic. A projection
      that retained the mechanism would be a summary, not an object.
    propagation: >-
      One step: compose two reductions and add their price vectors; specialise a
      universal to a particular and delete one quantifier at its stated price.
      Both are mechanically checkable on paper and are the instrument's own
      self-test.
    survival_score: >-
      Survives every record in this lane by construction. DISSOLVES for records
      whose claims are about MEASURED quantities rather than about reductions --
      a cost-functional variance claim has no meaningful quantifier prefix in
      this sense -- and that dissolution is exactly the null object below.

  mechanism: >-
    STEP 1 (zero compute). Write the seven axes, prove or cite each verdict, and
    freeze the price table.

    STEP 2 (zero compute). Write the normal form and a two-page reduction
    procedure taking an arbitrary stated quantifier order to it.

    STEP 3 (zero compute, the measurement). Apply the procedure to all eleven
    committed RQ-CLGP-b99df5 records and to the six records of this batch.
    Tabulate, per record: the normal form obtained, the price vector, and any
    axis on which the record's conclusion depends that the lattice says is free.

    STEP 4 (zero compute, the null). Apply the SAME procedure to a matched
    sample of records from a lane whose claims are measurements rather than
    reductions -- RQ-ICINV-475b5e (L1) or RQ-MODEL-e61cb2 (L11). The procedure
    must FAIL to produce a normal form there, or produce a vacuous one. If it
    produces a confident normal form for a variance measurement, the instrument
    is pattern-matching on prose and every verdict it gave is void.

    STEP 5 (zero compute). Publish the price table as the lane's filing
    requirement, so that future records state a price vector rather than a
    bespoke warding paragraph.

  why_not_a_renamed_known_approach: >-
    Random self-reducibility of the discrete logarithm (axes Q1, Q2) is
    textbook, and the campaign already holds the intra-class transport theorem
    T1 and the reachability dichotomy T5; IDEA-20260807-631e80 already supplies
    a point-level random self-reduction inside a class. None of that is claimed
    as new. What is not present anywhere in the corpus is the ENUMERATION with
    PRICES: the observation that Q3 and Q6 are not free but cost exactly
    p^{1/4}, the identification of Q5 as the only subexponentially-priced axis,
    and the resulting two-variable normal form. The corpus currently treats "for
    all curves in the class" and "for one curve" as interchangeable in prose,
    which the price table shows is a p^{1/4} elision.

  proof_search_map:
    bottleneck: >-
      The price of axis Q3-specified and axis Q6, both of which equal the cost
      of computing an isogeny between two specified curves in the class. If that
      cost is not about h^{1/2} = p^{1/4}, the two most interesting entries in
      the table change and the normal form's cost vector is wrong.
    baseline_embedding:
      parameter_slice: >-
        Delete axes Q3, Q5, Q6, Q7 (i.e. fix one curve, one class, grant End(E)).
        The lattice degenerates to the classical statement that ECDLP is random
        self-reducible in k and in the base point -- the textbook baseline, which
        the table must reproduce exactly.
      reproduction_check: >-
        Symbolic, plus a frozen fixture: on three toy instances, verify
        numerically that the Q1 and Q2 transformations produce the predicted
        answers k*u^{-1} and k + r. A price table whose free axes are not free
        in code is not a price table.
    observation_collision:
      observable: >-
        The normal form plus the price vector of a claim.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Search for two records with the same
        normal form and price vector but materially different content -- e.g.
        IDEA-20260807-5d7606 and IDEA-20260807-0fafe8, which are opposite
        directions and may well normalise identically once direction is stripped.
        Such collisions are expected and are HARMLESS ONLY IF the instrument is
        used to detect slippage rather than to compare merit. The record states
        that restriction explicitly; using the normal form to rank records would
        be a misuse and is the exact thing a reviewer should check for.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The normalisation procedure itself, as a reduction from arbitrary
          stated claims to the two-variable form. Obligations: encoding (prose
          to prefix), completeness (every stated claim normalises or is flagged),
          soundness (the normal form implies the original at the stated price),
          transfer (composition adds prices), cost loss (the price vector IS the
          loss and is reported rather than absorbed).
        predicted_gain: >-
          None as an attack. The gain is that a class of error becomes
          mechanically detectable at zero compute.
    quantifier_order: >-
      ASSERTED, per axis: for Q1, FORALL instances FORALL u THERE EXISTS a
      polynomial-time transformation with exact answer recovery; for Q2 the same
      with r; for Q3-randomisation, FORALL instances THERE EXISTS a polylog walk
      producing an instance whose curve is within negligible total variation of
      uniform on the crater, with k preserved (GRH-conditional); for Q6, FORALL
      pairs of specified curves THERE EXISTS a transport of cost about p^{1/4}.
      NOT ASSERTED: that Q3-specified or Q6 can be done more cheaply; that Q5
      collapses in polynomial time; that Q7 collapses at all; that the excluded
      Q4-table axis is unimportant -- it is excluded, not dismissed.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Every reduction claim in lane L10 is equivalent, at the stated prices,
        to a two-variable normal form, and any claim not so expressible is
        exercising preprocessing or is slipped." It can NEVER certify that a
        record's mathematics is correct, nor rank records, nor detect errors
        that are not quantifier errors. A normal form is a syntax check.
      nearby_object_control: >-
        THE MEASUREMENT LANES (L1, L11), where claims are about variance of cost
        functionals and have no reduction prefix. The instrument must FAIL there.
        A syntax check that confidently normalises a variance measurement is
        matching prose patterns and has identified nothing.
    proof_obligations:
      - claim: 'Q1 and Q2 collapse exactly and freely.'
        responsibility: correctness
      - claim: >-
          Q3 collapses in the randomisation direction at polylog cost under
          GRH-conditional rapid mixing, with k preserved by T1.
        responsibility: correctness
      - claim: >-
          Q3-specified and Q6 cost about h^{1/2} = p^{1/4}.
        responsibility: runtime
        status: >-
          '[recall-confident, NOT re-verified this session] -- shares assumption
          A3 of IDEA-20260811-40c0b5 and falls with it.'
      - claim: >-
          Q4 collapses for polynomial-time-computable advice and does not
          collapse for arbitrary advice.
        responsibility: scope
      - claim: >-
          Q5 does not collapse in polynomial time, and collapses
          subexponentially.
        responsibility: strictness
      - claim: 'Q7 does not collapse: T1 is intra-class only.'
        responsibility: scope

  predictions:
    - metric: >-
        number of the eleven committed RQ-CLGP-b99df5 records that normalise to
        the two-variable form
      direction: higher
      minimum_effect: >-
        at least 9 of 11. Fewer means either the lattice is incomplete (an axis
        is missing) or several records are stated in a form that cannot be
        compared, and both are findings.
    - metric: >-
        number of records whose stated conclusion depends on an axis the lattice
        prices as FREE
      direction: lower
      minimum_effect: >-
        predicted 0. Any record found depending on a free axis has a slipped
        conclusion and must be flagged for the Coordinator; this is the
        instrument's whole purpose.
    - metric: >-
        number of records that treat "oracle for one curve" and "oracle for all
        curves in the class" as interchangeable without pricing Q6
      direction: higher
      minimum_effect: >-
        predicted at least 2. This is the specific elision the record was built
        to catch and a count of 0 would mean the corpus is already careful and
        the instrument adds little.
    - metric: >-
        number of L1/L11 measurement records that the procedure normalises
        confidently (the null)
      direction: lower
      minimum_effect: >-
        predicted 0 out of a matched sample of at least 6. Any confident
        normalisation there voids the instrument.

  minimal_test:
    design: >-
      Entirely zero-compute and doable in about one working session.
      STAGE 0: verify the free axes numerically on three toy instances (Q1, Q2),
      so the table's "free" entries are checked in code and not only on paper.
      STAGE 1: write the price table and the normalisation procedure.
      STAGE 2: normalise the eleven committed RQ-CLGP records and the six
      records of this batch; tabulate normal forms, price vectors and flags.
      STAGE 3: run the null of STEP 4 against a matched sample of six L1/L11
      records.
      STAGE 4: report the flag list to the Coordinator; propose the price table
      as a filing requirement.
    controls:
      - >-
        NULL OBJECT (matched, mandatory): the L1/L11 measurement records. The
        procedure must fail to produce a confident normal form for them. This is
        the control that distinguishes a syntax check from prose pattern
        matching, and it is blocking.
      - >-
        PLANTED SIGNAL (two-directional control, mandatory): three SYNTHETIC
        claim statements written deliberately with slipped quantifiers -- one
        with the FORALL-k / EXISTS-R inversion (5d7606's W1), one with an
        unconstructible existential over queries (5d7606's W2), and one silently
        assuming a for-all-curves oracle. The procedure MUST flag all three. A
        procedure that flags none is blind and every verdict it produced is
        void.
      - >-
        BLINDING: the person or session applying the procedure should not be the
        author of the records being normalised. This batch's own records are
        included in the audit deliberately, and self-audit results must be
        reported separately from the audit of the pre-existing eleven.
    required_metrics:
      - normal form and price vector per audited record
      - flag count by flag type (slipped, unnormalisable, free-axis dependence)
      - null result on the L1/L11 sample
      - planted-slippage detection rate, out of three
      - numeric verification of the free axes on toy instances

  controls:
    - >-
      NULL OBJECT: the measurement-lane records, as above.
    - >-
      DECAY PARAMETER: the specificity of the record. As a record's claim becomes
      more purely empirical, the instrument's confidence must decay to zero.
      Confidence that stays flat across that gradient is the canonical artifact
      tell and means the procedure is reading style rather than structure.
    - >-
      A second auditor normalising the same records independently, with
      disagreement rate reported. A procedure whose two applications disagree is
      not a procedure.

  confounders:
    - >-
      PROSE VARIATION. Records state quantifiers in different notations and some
      state them only implicitly. Implicit prefixes must be recorded as
      "unstated" and flagged, never inferred, or the audit manufactures its own
      findings.
    - >-
      THE PRICE OF Q3-SPECIFIED AND Q6 IS INHERITED. Both rest on the same
      p^{1/4} vectorization cost as IDEA-20260811-40c0b5 assumption A3. If that
      is wrong, two rows of the table are wrong and every price vector using
      them must be recomputed. The dependency is declared rather than hidden.
    - >-
      GRH. The Q3 polylog price rests on the GRH-conditional rapid mixing that
      T5 cites. Records that must be unconditional cannot use that row and the
      table marks it.
    - >-
      SELF-AUDIT BIAS. This batch's own six records are audited by the same
      session that wrote them; that result is reported separately and is not
      pooled with the audit of the pre-existing corpus.

  falsification_conditions:
    - >-
      The planted slipped statements are not all flagged. Instrument blind; the
      whole audit is INVALID rather than negative.
    - >-
      The L1/L11 null normalises confidently. The procedure is matching prose
      and every verdict is void.
    - >-
      An eighth axis is exhibited that is independent of the seven and does not
      collapse. The lattice is incomplete and the normal form is not a normal
      form; this is a genuine and likely-enough failure mode and it is the
      reason the record is a control and not a theorem.
    - >-
      Q3-specified or Q6 is shown to cost materially less than p^{1/4}. Two rows
      change; the normal form survives but its cost vector does not.
    - >-
      A record is found whose conclusion depends on a free axis. The lattice is
      right and a committed record is wrong -- the instrument's designed
      positive outcome, to be handed to the Coordinator rather than acted on.

  interpretation_limits:
    - >-
      A SYNTAX CHECK, NOT A CORRECTNESS CHECK. Passing the normal form says
      nothing about whether a record's mathematics is right, and failing it says
      only that the statement is not comparable.
    - >-
      NEVER A RANKING INSTRUMENT. Distinct records with identical normal forms
      are expected; using the normal form to compare merit is the misuse this
      record explicitly forbids.
    - >-
      Two rows of the price table are inherited from an unverified external cost
      claim and one row is GRH-conditional. Any use of the table must carry
      those dependencies.
    - >-
      Scoped to lane L10 reduction claims. Applying it outside is exactly what
      the null tests, and the expected answer there is that it does not apply.

  assumptions:
    - >-
      '[fact, elementary] Random self-reducibility of ECDLP in k and in the base
      point (axes Q1, Q2).'
    - >-
      '[fact] Transport theorem T1 of DECOMPOSITION.md: an F_p-isogeny of degree
      coprime to N carries (E, P, Q, k) to (E'', phi P, phi Q, k) with the same
      k.'
    - >-
      '[GRH-conditional, cited not proved] Rapid mixing of the class-group
      Cayley graph, as cited by T5 of DECOMPOSITION.md, giving the polylog price
      on axis Q3-randomisation.'
    - >-
      '[recall-confident, NOT re-verified this session] Computing an isogeny
      between two SPECIFIED ordinary curves in one class costs about
      h^{1/2} = p^{1/4}; this is assumption A3 of IDEA-20260811-40c0b5 and
      prices axes Q3-specified and Q6.'
    - >-
      '[recall-confident] Computing End_{F_p}(E) requires the factorisation of
      D = t^2 - 4p and is subexponential (Bisson-Sutherland line, cited in the
      corpus as KN-LIT-251 via IDEA-20260807-4f43ac). NOT re-verified this
      session.'

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        NO LOAD-BEARING STEP IS DISTRIBUTIONAL EXCEPT AXIS Q3-RANDOMISATION,
        which assumes that a non-backtracking walk of length C*log h in the
        crater, using the split small primes as generators, produces a curve
        within total variation h^{-1} of uniform, uniformly for h >= 100.
      rigorous_support: >-
        Pairs the rigorous fact that the crater is a Cayley graph of Cl(O) under
        the small split primes (Kohel; Fouquet-Morain; Sutherland) with the
        classical expander mixing statement it imitates, whose GRH-conditional
        form is what T5 already cites. The rigorous half fixes the graph; the
        heuristic half is only the mixing constant C.
      validation_plan: >-
        Toy scale: on classes with h in [100, 5000] at 16-24 bits, measure the
        endpoint distribution of walks of length 1..4 log h against uniform by
        total-variation distance, and record the length at which the distance
        first falls below 1/h. Record the small-prime set, the walk convention
        and the sample sizes. TRANSFER TO CRYPTO SCALE IS NOT CLAIMED.
      tail_checks: >-
        Report the least- and most-visited labels against the uniform extreme
        quantiles; a persistently unvisited curve means the generator set does
        not generate and the polylog price is void for that class.
    - id: HA-2
      statement: >-
        FOR THE AUDIT ARM ONLY: the eleven committed RQ-CLGP records are a fair
        sample of the lane's statement styles, so a flag rate measured on them
        estimates the lane's slippage rate.
      rigorous_support: >-
        None -- this is an explicitly weak sampling assumption about a corpus of
        eleven documents written in two batches by a small number of sessions. It
        imitates nothing classical and is recorded so that no rate measured here
        is generalised.
      validation_plan: >-
        Report the flag count as a COUNT, never as a rate, and stratify by the
        batch that produced each record. If flags cluster in one batch, the
        sample is not fair and the count must not be summarised.
      tail_checks: >-
        Not applicable. The analogue is the batch stratification above.

  reachability_gate: >-
    T5 STATUS: this record does not need to reach any curve; it PRICES the
    reaching. Its axes Q3-specified and Q6 are exactly T5's hard side expressed
    as quantifier-elimination costs, which is the record's main structural
    contribution: T5 stops being a warning and becomes two entries in a cost
    table.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. The record produces a cost
      TABLE for quantifier elimination whose largest entry is p^{1/4}, and that
      entry is the cost of a known algorithm, not of a proposed one.
    memory_exponent: >-
      Not applicable; the instrument is a paper procedure. The p^{1/4} entries
      inherit p^{1/4} memory from the meet-in-the-middle algorithm that realises
      them, and that is stated wherever those entries are used.
    best_known: >-
      Parallel rho at 0.886*sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006);
      BSGS at sqrt(N) time and memory (KN-TECH-031); automorphism-discounted rho
      (KN-TECH-018). None is changed.
    hidden_overhead: >-
      Two table entries inherit an unverified external cost claim and one is
      GRH-conditional; both dependencies are declared in assumptions and in
      interpretation_limits rather than absorbed.
    tradeoff_note: >-
      The p^{1/4} entries are time-AND-memory figures; in a memory-poor model
      they degrade along van Oorschot-Wiener to sqrt(h^3/w), so a
      memory-constrained reduction pays more for axes Q3-specified and Q6 than
      the table states. Any low-memory reading must recompute those two rows.

  sota_delta: >-
    Zero. No attack, no speedup, no exponent. The delta is an audit instrument:
    it converts a per-record warding paragraph into a shared price table, prices
    two axes (Q3-specified, Q6) the corpus has been treating as free, and
    isolates the two axes (Q5, Q7) on which every genuine L10 disagreement must
    actually turn.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every frontier row this
    campaign recognises: parallel rho (0.886*sqrt(N), O(1) memory,
    KN-TECH-001/006); automorphism-discounted rho (KN-TECH-018); BSGS (sqrt(N)
    time and memory, KN-TECH-031); kangaroo (about 2*sqrt(W)); van
    Oorschot-Wiener (sqrt(N^3/w), memory w); meet-in-the-middle vectorization
    (about h^{1/2}). As an attack this record is dominated by all of them; it is
    not an attack. As an INSTRUMENT it is dominated by nothing in this
    repository, because no quantifier-normalisation procedure exists here.
    dominated_by is NOT null.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that the free axes (Q1, Q2, Q4-poly) verify exactly. 0.85 that the
    p^{1/4} pricing of Q3-specified and Q6 survives, inheriting the risk of
    IDEA-20260811-40c0b5's assumption A3. 0.60 that the seven axes are complete
    -- an eighth axis is the most likely failure and is listed as a
    falsification condition. 0.50 that at least one committed record is found to
    elide Q6, which is the specific finding the instrument was built to produce.
    Below 0.05 that any of this bears on an attack, which it should not.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base appears; H-STR-002 and DEFER-BATCH009-001
    are untouched.
    P3: NOT TRIGGERING. The largest exponent in the record is p^{1/4}, and it is
    the cost of a known published algorithm for a different problem
