idea:
  id: IDEA-20260808-ddb522
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-AES-002
  goal_id: GOAL-AES-002
  title: Symmetry-quotient closure certification - the C_4 column-rotation automorphism and
    the Barkan-Biham dual-cipher action let an attack-shape enumeration be certified COMPLETE
    up to isomorphism, converting "we screened some objects" into "we screened all objects
    in the class", which is the missing ingredient in every closure this program has withheld.
  class: tooling
  claim: Let G be the group generated by (a) cyclic rotation of the four state columns, which
    is an automorphism of the AES round function because ShiftRows is a per-row cyclic shift
    and MixColumns acts identically on every column, so both commute with a cyclic relabelling
    of columns, and (b) the dual-cipher action of the Frobenius map on GF(2^8) together with
    the induced relabelling of the S-box affine constants and MixColumns coefficients (recalled_unverified
    as Barkan-Biham dual ciphers; the action must be RE-DERIVED here, not cited). CLAIM -
    (i) G acts on the set of attack shapes (byte-position patterns for the distinguisher input
    and output, plus the guessed key-byte set) and the induced map on ATTACK COST is the identity,
    so cost is a class function on G-orbits; (ii) the number of G-orbits of shapes at each
    round count is computable by Burnside's lemma in closed form; (iii) therefore an enumeration
    that covers one representative per orbit is COMPLETE for the class, and a screening report
    over orbit representatives is a certified exhaustion rather than a sample. DISCRIMINATION
    - if G acting on shapes has orbits of full size generically, the enumeration shrinks by
    that factor and completeness becomes affordable; if most shapes are G-fixed, the group
    buys nothing and every existing enumeration is already effectively complete, which is
    itself a useful finding about this program's past screening reports.
  mechanism: 'GOAL-AES-002 makes an object enumeration a required intermediate artifact and
    then rules (non_completion_criteria (i)) that a count of screened-and-rejected mechanisms
    is a FATIGUE REPORT with honest status `unverified`. The gap between a fatigue report
    and a closure is exactly COMPLETENESS. A symmetry quotient supplies it: if the cost function
    is G-invariant and every shape is G-equivalent to a listed representative, then screening
    the representatives screens everything. The column rotation is elementary to verify (conjugating
    the round function by the rotation permutation returns the round function with rotated
    round keys). The dual-cipher action is the more powerful and more delicate half and is
    the part that must be re-derived rather than assumed.'
  why_not_a_renamed_known_approach: 'Nearest known method - Barkan-Biham dual ciphers (recalled_unverified),
    used historically to argue that certain attacks transfer between equivalent Rijndael descriptions.
    That is a TRANSFER result. Mine uses the same group for a COMPLETENESS CERTIFICATE over
    an enumeration, which is a different deliverable and is what this program''s closure standard
    actually requires. Nearest internal record - KN-OPEN-019 (what object does each attack
    family track, and is that enumeration closed), which is the OPEN PROBLEM this record proposes
    an instrument for; the brief itself notes that until such an enumeration exists any family-to-object
    mapping is a sketch. LOSSY-PROJECTION TEST - the tracked object is the G-ORBIT of a shape.
    It discards the specific column labelling and the specific field representation. Compatibility
    - by construction: G is chosen so that the round function is equivariant, hence the projection
    to orbits propagates deterministically through every AES operation. Genuinely lossy (several
    shapes collapse to one). PASSES, and note this is the one record in the slice whose projection
    is lossy BY THEOREM rather than by hope.'
  predictions:
  - observable: verification that column rotation conjugates the AES round function to itself
      with rotated round keys
    metric: symbolic identity check on the pinned harness, plus a numeric check on 10^3 random
      (state, key) pairs
    predicted: exact agreement; any mismatch kills generator (a)
  - observable: orbit count of attack shapes at R = 4, 5, 6 by Burnside
    metric: integer, versus the raw shape count
    predicted: a reduction factor between 4 and the order of G; the exact number pre-registered
      before enumeration
  - observable: cost invariance
    metric: measured cost of the campaign's r=5 recovery run on a shape and on its column-rotated
      image
    predicted: equal to within measurement noise; a systematic difference falsifies claim
      (i) and is the single most informative negative here
  - observable: fraction of shapes with nontrivial stabiliser
    metric: fraction
    predicted: small (below 20 percent) for generic shapes but exactly 1 for fully symmetric
      shapes such as the all-columns-active pattern - these must be enumerated separately
      and are where completeness arguments leak
  - observable: whether the dual-cipher generator acts nontrivially on shapes at all
    metric: orbit sizes with and without generator (b)
    predicted: generator (b) fixes byte-POSITION patterns and acts only on field-representation-dependent
      objects, so it should NOT further reduce position-shape orbits - stated in advance so
      that a reduction would be a surprise to be investigated rather than a win to be claimed
  minimal_test: (1) Verify generator (a) symbolically and numerically on the pinned harness.
    (2) Re-derive the dual-cipher action from scratch (apply Frobenius to every constant and
    check the resulting cipher is isomorphic) rather than citing it. (3) Compute orbit counts
    by Burnside at R = 4,5,6 and PRE-REGISTER them. (4) Test cost invariance empirically by
    rerunning one committed attack on a rotated shape. (5) Retrofit the certificate to one
    existing screening report and state, in its own words, whether that report was complete.
  controls:
  - Numeric equivariance check on random (state, key) pairs, not just symbolic - a symbolic
    identity with a transcription error passes inspection and fails execution.
  - Cost-invariance measurement on a real committed run, which is the only way claim (i) is
    tested rather than assumed.
  - Explicit separate enumeration of shapes with nontrivial stabiliser.
  - A deliberately WRONG generator (row rotation, which ShiftRows does NOT commute with) as
    a null - the machinery must REJECT it. If the pipeline accepts row rotation as a symmetry,
    it is not checking anything.
  confounders:
  - Cost invariance can fail for implementation reasons (cache layout, byte order) while holding
    mathematically; the measurement must distinguish different cost from different memory
    access pattern, which is exactly the X-versus-Y issue IDEA-20260807-8e20fe raises.
  - The dual-cipher action changes the S-box, so any object that depends on S-box VALUES is
    not invariant under generator (b) - and the campaign's own findings (random S-boxes reproduce
    the r=5 excess) mean some objects are value-independent and some are not. The invariance
    class must be declared per object.
  - Burnside requires the action to be well defined on the shape set; a shape set that is
    not closed under G silently produces wrong orbit counts.
  falsification_conditions:
  - Column rotation fails the numeric equivariance check - generator (a) is wrong and the
    whole construction collapses to generator (b).
  - Measured cost differs systematically between a shape and its rotation - claim (i) is false
    and orbits are not cost classes, so the quotient certifies nothing about cost.
  - The null generator (row rotation) is accepted by the pipeline - the instrument does not
    discriminate and must be rebuilt.
  - Most shapes are G-fixed - the quotient buys no reduction; a negative for the tool and
    a positive finding about past enumerations.
  interpretation_limits: A completeness certificate is complete FOR THE SHAPE SET AS DEFINED.
    It says nothing about objects outside that set, and the set's definition is where all
    the real content sits - which is exactly why this record is tooling rather than a result.
    It does not close KN-OPEN-019; it supplies one ingredient that any answer to KN-OPEN-019
    would need.
  assumptions:
  - The pinned FIPS-197 harness is ground truth.
  - At least one committed attack run can be re-executed on a modified shape within a producer
    slot (the r=5 recovery at 25.66 s makes this affordable).
  heuristic_assumptions:
  - id: HA-1
    statement: FOR ALL attack shapes s and FOR ALL g in G, cost(g.s) equals cost(s) exactly,
      where cost is the CM-3-charged end-to-end cost.
    rigorous_ingredient: Equivariance of the round function under column rotation is a PROVED
      identity (conjugation by the rotation permutation), so the mathematical operation count
      is invariant by construction. What is heuristic is only that the MEASURED cost tracks
      the operation count.
    distribution_imitated: Not a distributional assumption - it is an invariance assumption,
      and it is stated separately for that reason rather than dressed as one.
    validation_route: 'Direct measurement, not sampling: rerun one committed attack on all
      four column rotations of its shape and compare CM-3 counters and wall clock. Four runs,
      minutes each. This is a MEASUREMENT at the campaign''s real scale for this object, not
      a toy proxy, and it is one of the few places in this slice where that is true.'
    tail_checks: Report the MAXIMUM pairwise cost difference across the four rotations, not
      the mean; a single rotation twice as slow means the invariance holds mathematically
      and fails operationally, and the certificate must then be restricted to counted operations.
  - id: HA-2
    statement: the shape set is closed under G, so Burnside's lemma applies.
    rigorous_ingredient: closure is checkable by direct enumeration at small R.
    distribution_imitated: not applicable.
    validation_route: Exhaustively verify closure at R = 4 by applying every generator to
      every shape and confirming membership; only then use Burnside at R = 6, 7.
    tail_checks: Report any shape whose image leaves the set - one escape invalidates the
      orbit count entirely, so the check is pass/fail, not statistical.
  target_complexity:
    time_exponent: No attack, no exponent. The reduction is in ENUMERATION SIZE by a factor
      up to the order of G (at most 4 from column rotation, times whatever the re-derived
      dual action contributes on non-position objects). This is a constant-factor saving on
      a screening cost and is explicitly declared as such; its priority rests entirely on
      being a REQUIRED BUILDING BLOCK for any closure statement, which GOAL-AES-002 C3 names
      as its most plausible deliverable.
    memory_exponent: negligible.
    best_known_baseline: This program's current practice, which enumerates shapes without
      a completeness argument and is therefore restricted to fatigue reports.
    hidden_overhead_disclosure: The certificate's strength is entirely determined by the shape-set
      definition, which is a human choice; the tool cannot certify that the definition is
      the right one and must never be presented as if it could.
    time_memory_tradeoff: not applicable.
  sota_delta: Zero attack delta. The delta is that a screening report can, for the first time
    in this program, carry a completeness claim with an argument behind it. Given that GOAL-AES-001
    has withheld a scoped closure for two consecutive batches and GOAL-AES-002 pre-declares
    that its enumeration is NOT a completion, this is the specific missing ingredient.
  dominated_by: Nothing in this repository - checked IDEA-20260805-4bd60c (states the closure
    STANDARD, supplies no instrument), KN-FIND-029 (practice rules for instrument design,
    not completeness), KN-OPEN-019 (the open problem itself), and all catalogue entries. Externally,
    a full automorphism-group computation for AES-like ciphers may exist and is UNRESOLVABLE-IN-THIS-ENVIRONMENT;
    the record does not claim otherwise.
  estimated_cost: Implementation LOW-MEDIUM; compute LOW (four reruns of a 25.66 s attack
    plus enumeration); one producer slot.
  recommended_priority: medium
  honest_prior_of_survival: Generator (a) verifying 0.9. Cost invariance measured equal 0.7.
    Generator (b) re-derived correctly 0.5 (this is the part I am least sure of and it is
    explicitly marked for re-derivation). A usable completeness certificate for at least one
    existing enumeration 0.55. Decision either way 0.85.
  novelty_status: unverified
  novelty_class: adaptation
  novelty_screen: CATALOGUE_TITLES.txt (no symmetry-quotient entry; A2-3's Rcon-invariance
    of marginals is the nearest INVARIANCE claim and concerns related-key value decorrelation,
    a different object); EXISTING_PROPOSALS.txt (IDEA-20260805-4bd60c on the C3 closure standard
    - a standard, not an instrument); EXISTING_HYPOTHESES.txt (none); KNOWLEDGE_BARRIERS.txt
    (KN-OPEN-019 is the open problem this serves; KN-TECH-012, isotypic/equivariant decomposition
    of symmetric relation systems, is the nearest technique and is used for SOLVING, not for
    enumeration completeness); REJECTED_TITLES.txt, DEFERRED_TITLES.txt. EXTERNAL LITERATURE
    NOT SCREENED.
  discriminated_from: Barkan-Biham dual ciphers - a transfer result about equivalent descriptions;
    this uses the same group as a completeness certificate over an enumeration. KN-TECH-012
    - equivariant decomposition to speed up solving; this quotients a SEARCH SPACE to certify
    exhaustion. IDEA-20260805-4bd60c - states what a closure must contain; this builds the
    part that is missing.
  source_refs:
  - ref: Barkan-Biham dual ciphers of Rijndael
    status: recalled_unverified
    use: the action is RE-DERIVED here rather than cited; if the re-derivation fails, generator
      (b) is dropped and only generator (a) survives.
  - ref: KN-OPEN-019 - object enumeration closure
    status: internal_committed
  - ref: GOAL-AES-002 non_completion_criteria (i) - an object enumeration is a fatigue report,
      not a completion
    status: internal_committed
  proof_search_map:
    bottleneck: Completeness of an enumeration - the single reason this program's negative
      AES results are fatigue reports rather than closures.
    baseline_embedding:
      parameter_slice: G trivial - the certificate degenerates to a bare list of shapes, i.e.
        exactly current practice.
      reproduction_check: with G trivial the orbit count must equal the raw shape count; frozen
        as a fixture.
    observation_collision:
      observable: the orbit count and the completeness certificate.
      distinct_preimage_search: The deliberately wrong generator (row rotation) - if the pipeline
        also accepts it, the certificate is vacuous. Mandatory.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: G-orbits of attack shapes
      predicted_gain: Enumeration size divided by up to the order of G, and a completeness
        claim that current practice cannot make.
    quantifier_order: THERE EXISTS a group G such that FOR ALL shapes s and FOR ALL g in G,
      cost(g.s) equals cost(s), AND FOR ALL shapes s THERE EXISTS a listed representative
      t with s in the orbit of t. Both halves are needed; the second is the completeness half
      and is the one Burnside supplies.
    method_ceiling:
      strongest_certifiable_claim: '"every shape in the DEFINED set is G-equivalent to a screened
        representative." It can never certify that the defined set is the right set - that
        is a modelling judgement and must be printed alongside.'
      nearby_object_control: An object that depends on S-box VALUES (which the campaign has
        shown some do not and some may) is not invariant under generator (b); such an object
        is the nearby case where the certificate silently over-claims, and the invariance
        class must be declared per object.
    proof_obligations:
    - claim: column rotation is an automorphism
      responsibility: correctness
    - claim: cost is G-invariant
      responsibility: baseline
    - claim: shape set closed under G
      responsibility: interface
    - claim: orbit count by Burnside
      responsibility: size
    - claim: the shape-set definition is stated wherever completeness is claimed
      responsibility: scope
    not_applicable_reason: null
