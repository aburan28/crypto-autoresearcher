idea:
  id: IDEA-20260922-29b1c5
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE 2-TORSION TRANSLATION QUOTIENT IS NOT AVAILABLE TO A SUBSPACE FACTOR BASE
    ON ANY STANDARDIZED BINARY CURVE, AND THE REASON IS A ONE-PAGE LEMMA: an
    F_2-subspace of F_{2^n} closed under x -> sqrt(b)/x is exactly a subfield
    F_{2^d} containing b, so on every PRIME-degree row (K-163..B-571, every
    c2tnb*, every sect*, ECC2K-130) the cell is empty for want of a subfield and
    on the five composite-degree ANSI rows the only stable subspace is F_{2^16},
    whose factor base is E(F_{2^16}) and decomposes no subgroup target at all.
    The constructive escape is the u-line base V_W = {x : x + sqrt(b)/x in W},
    which buys EXACTLY 2^{m-1} in the enumeration representation and is priced,
    not free, in the algebraic/SAT representation - a separation this lane has
    never measured.
  class: representation
  claim: >-
    SETTING. E: y^2 + xy = x^3 + a x^2 + b over F_q, q = 2^n, b != 0, ordinary.
    E has exactly one rational 2-torsion point, T = (0, sqrt(b)) (E[2](F_q) is
    cyclic of order 2 in characteristic two for an ordinary curve), which is why
    EVERY standardized binary curve carries an even cofactor: 2 or 4 on every
    FIPS and SECG row, 65070..65392 on the five composite-degree ANSI rows
    (analysis/binstd-curve-audit/audit-scan.txt, read this session).

    (A) THE ACTION, DERIVED HERE, NOT RECALLED. For P = (x_1, y_1) with x_1 != 0,
    the chord-tangent formula with lambda = (y_1 + sqrt(b))/x_1 gives
    x(P + T) = lambda^2 + lambda + x_1 + a
             = [y_1^2 + b + x_1 y_1 + x_1 sqrt(b) + x_1^3 + a x_1^2] / x_1^2 ,
    and the curve equation y_1^2 + x_1 y_1 + x_1^3 + a x_1^2 = b collapses the
    numerator to x_1 sqrt(b) in characteristic two, so
        x(P + T) = sqrt(b) / x(P)  =:  iota(x(P)).
    iota is an involution on the x-line, it is the ONLY nontrivial translation of
    E that descends to the x-line (translation by S commutes with P -> -P iff
    2S = O), and it therefore generates the entire torsion symmetry available to
    any x-coordinate-based decomposition, independently of how large the cofactor
    is. THAT SETTLES THE COFACTOR QUESTION FOR THIS LANE: the group acting on the
    x-line is Z/2 on K-163 (cofactor 2) and Z/2 on c2pnb368w1 (cofactor 65392)
    alike; a bigger cofactor buys nothing here, and the 4-torsion half of the
    Trimoska-Ionica-Dequen future-work sentence cannot act on x-coordinates at
    all.

    (B) THE EMPTINESS LEMMA (derived this session; proof in `mechanism`). Let
    V be a nonzero F_2-subspace of F_{2^n} with iota(V \ {0}) = V \ {0}. Then
    V = F_{2^d} for some d | n, and necessarily b in F_{2^d}. Consequences,
    curve by curve, against the audit's verified extension degrees:
      - n PRIME - every FIPS binary curve (m in {163,233,283,409,571}), every
        ANSI c2tnb*, every SECG sect*, and ECC2K-130 at n = 131: the only
        subfields are F_2 and F_{2^n}, so the only iota-stable subspaces are
        {0}, F_2 (size 2) and the whole field. THE (SUBSPACE FACTOR BASE,
        2-TORSION QUOTIENT) CELL IS STRUCTURALLY EMPTY ON EVERY PRIME-DEGREE
        STANDARDIZED BINARY ROW, with the lemma as its certificate.
      - n = 16k, b in F_{2^16} - c2pnb176v1/208w1/272w1/304w1/368w1: the unique
        nontrivial choice is V = F_{2^16}, giving Fb = {P : x(P) in F_{2^16}}
        = E(F_{2^16}) (for k odd prime, x in F_q forces y in F_q). Every sum of
        such points is F_{2^16}-rational, and a target in the prime-order
        subgroup is not, so the yield is EXACTLY ZERO - the degeneracy
        IDEA-20260906-a77711 states for subfield curves. THE CELL IS EMPTY ON
        THOSE FIVE ROWS TOO, for a different and equally certifiable reason.
      So across the whole standardized binary population the answer is: empty,
      twice over, and the two emptiness mechanisms are disjoint.

    (C) THE CONSTRUCTIVE ESCAPE AND ITS EXACT PRICE. Give up linearity on the
    x-line and keep it one level down: for an F_2-subspace W of F_q put
        V_W := { x != 0 : u(x) := x + sqrt(b)/x in W } .
    V_W is iota-stable by construction (u(iota x) = u(x)), it is NOT an
    F_2-subspace (consistent with (B)), |V_W| = 2 * #{w in W : Tr(sqrt(b)/w^2) = 0}
    is about |W| = 2^l, and membership costs ONE F_q inversion plus a rank-l
    GF(2) test rather than the rank-l test alone. u is the x-coordinate of the
    2-isogeny E -> E/<T>, so V_W is the pullback of a subspace factor base on the
    2-isogenous curve; the object is a factor base on E/<T> read back on E.

    (D) THE SEPARATION THIS RECORD IS ACTUALLY FOR, WITH BOTH OUTCOMES NAMED.
    Because P and P + T have the SAME component in the prime-order subgroup
    (T lies in the even cofactor, and every relation is multiplied by the
    cofactor before the linear algebra), a decomposition of R and a decomposition
    of R + T are equally good relations. Flipping any subset of the m summands by
    T maps a decomposition of R to a decomposition of R or of R + T. Therefore
    ENUMERATING ONE REPRESENTATIVE PER iota-ORBIT LOSES NOTHING. In the
    ENUMERATION representation - the (m-1)-fold loop of IDEA-20260904-96c4f3 -
    that representative choice is free (iterate over orbits, not over points), so
    the per-target cost falls from |B|^{m-1}/(m-1)! to (|B|/2)^{m-1}/(m-1)!, an
    EXACT factor 2^{m-1}, and the linear-algebra unknown count falls by exactly
    2. In the ALGEBRAIC / CNF-XOR representation the same quotient is NOT free:
    S_{m+1}(x_1, ..., x_m, x_R) is invariant only under EVEN-weight iota flips,
    so an invariant-ring rewriting in the u_i multiplies the degree in each
    variable by 2^m, and a canonical-representative constraint is a comparison
    between x and sqrt(b)/x, i.e. a nonlinear predicate the Weil descent does not
    carry. PREDICTION, PRE-REGISTERED: the enumeration arm realises the full
    2^{m-1}; the WDSat arm realises STRICTLY LESS than 2^{m-1} and plausibly
    nothing, because the canonicalisation clauses cost more propagation than the
    halved alphabet saves. If the WDSat arm DOES realise 2^{m-1} or more, the
    program's leaf-count reading of solver cost (IDEA-20260904-3c7a91,
    IDEA-20260915-0d8e90) is incomplete and that is the headline.

    (E) WHICH ROW OF THE RQ-BINSTD TABLE THIS MOVES. Every row, and by a
    constant. For the decomposition column of K-163, K-233, K-283, K-409,
    K-571, B-163..B-571, every c2tnb*, sect131r1/r2 and ECC2K-130 the cell
    changes from "subspace base + torsion quotient" (now STRUCTURALLY EMPTY with
    certificate (B)) to "u-line base V_W + torsion quotient" with a computed
    constant 2^{m-1} on the enumeration oracle, one F_q inversion added to every
    membership test, and no exponent moved. Against matched rho with negation and
    the curve's Frobenius classes the gap is unchanged in the exponent: this is a
    constant-factor record whose scientific content is the emptiness certificate
    and the representation separation, and it says so.
  mechanism: >-
    OBJECT FRAME. Representation: the x-coordinate of a point in a fixed
    F_2-basis of F_{2^n} (class R1 of RQ-ECDLP-623a32), replaced by the
    iota-ORBIT {x, sqrt(b)/x}, equivalently by the coordinate u = x + sqrt(b)/x
    on the 2-isogenous curve E/<T>. Operation set Sigma: translation by
    factor-base points TOGETHER WITH translation by T - explicitly NOT the full
    translation action. Trichotomy class: PARTIAL-ACTION (Class I of
    IDEA-20260806-c5d183). Reason: the relation vector propagates only under
    translation by factor-base elements, and the extra generator T generates a
    group of order 2 that is trivial on the prime-order subgroup, so
    KN-FIND-ffe1df Theorem C is not engaged - the projection is not a
    sum-compatible bucket index on a prime-order group, it is a quotient by a
    subgroup of the COFACTOR.
    LOSSY-PROJECTION TEST AGAINST THAT Sigma. The projection x -> {x, iota(x)}
    discards exactly one bit: which of P, P + T is meant. The discard is
    Sigma-compatible because iota is induced by translation by T, so
    (P_1 + eps_1 T) + ... + (P_m + eps_m T) = (sum P_i) + (sum eps_i) T: the
    orbit of the sum is determined by the orbits of the summands together with
    the parity of the flips, and modulo the cofactor even that parity is
    irrelevant. It is genuinely lossy in the representation used, because from u
    one cannot recover x (two preimages), and it is not a change of coordinates,
    because |x-line| = 2 * |u-line| exactly (one fixed point, x = b^{1/4}).
    PRICED OPEN NUMBER (orbit canonicalisation). Enumeration representation: one
    inversion or one table index per orbit, amortised to zero when the factor
    base is built once as a list of orbits - measured, not assumed, as
    canonicalisation_ops_per_membership_test. Algebraic representation: either
    degree 2^m per variable (invariant rewriting) or the CNF cost of encoding
    x < sqrt(b)/x - measured as clauses_added and propagations_per_leaf.
    PROOF OF THE EMPTINESS LEMMA (derived this session). Let V be a nonzero
    F_2-subspace with sqrt(b)/V = V on nonzero elements. For u != v nonzero in V,
    sqrt(b)/u + sqrt(b)/v = sqrt(b)(u+v)/(uv) lies in V, so applying the map
    again, uv/(u+v) lies in V. Put v = u + w with w in V \ {0}: u(u+w)/w =
    u^2/w + u in V, hence u^2/w in V for every nonzero u, w in V (w = u gives u
    itself). Thus u^2 V is contained in V for every u in V, and by finiteness
    u^2 V = V. The set S = {lambda : lambda V = V} is a multiplicative group
    containing every u^2; the F_2-span of S is closed under multiplication, is
    finite and has no zero divisors, hence is a subfield F_{2^d}, and V is an
    F_{2^d}-vector space. Every u in V has u^2 in F_{2^d}, and squaring is a
    bijection of F_{2^n} preserving F_{2^d}, so u in F_{2^d}; hence V is
    contained in F_{2^d} and, being a nonzero F_{2^d}-subspace of F_{2^d},
    equals it. Finally sqrt(b)/1 = sqrt(b) in V forces b in F_{2^d}. (The
    argument is the additive-subgroup-closed-under-inversion identity behind
    Hua's theorem, rewritten for the twisted involution; Hua is cited as
    recalled context, and the four displayed steps are self-contained and are
    the executor's first, zero-compute, obligation.)
    WHY THIS IS NOT IDEA-20260913-cedd2f. That record tracks the PARITY CLASS
    Tr(x) + Tr(a), i.e. the image of P in E/2E, a homomorphism to Z/2 that
    constrains WHICH targets are reachable. This record tracks the iota-ORBIT,
    a quotient of the x-line by a group action that constrains HOW MANY tuples
    must be searched. One is a yield obstruction, the other a search-space
    quotient; they are composable and their composition is not claimed here.
    WHY THIS IS NOT IDEA-20260920-18dc28. That record proposes to MEASURE the
    conjunction of WDSat symmetry breaking, torsion symmetrization and coset
    typing, predicts "constant factor only", names no mechanism, and leaves
    `dominated_by: unchecked`. This record supplies the mechanism, proves the
    subspace cell empty before any run, gives the constructive replacement
    V_W, derives the exact 2^{m-1}, and predicts that the WDSat arm will NOT
    realise it - which is the opposite of 18dc28's implicit expectation and is
    the discriminator that makes the run worth doing.
