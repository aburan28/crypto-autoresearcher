  assumptions:
    - E ordinary over F_{2^n} in the form y^2 + xy = x^3 + a x^2 + b with b != 0, so E[2](F_q) = {O, T}, T = (0, sqrt b). Supersingular binary curves are out of scope and are not standardized targets.
