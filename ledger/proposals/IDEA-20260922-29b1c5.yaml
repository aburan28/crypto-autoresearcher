        is the record's headline if it occurs, because it would show the CNF-XOR
        cost is not governed by the core leaf count alone.
    - metric: linear_algebra_unknown_count with and without the quotient, and relation matrix rank on the same relation set
      direction: lower
      minimum_effect: unknowns exactly halved (+/- 1 for the fixed point x = b^{1/4}); rank of the reduced system equal to rank of the full system minus the collapsed columns, i.e. no rank lost.
    - metric: canonicalisation_ops_per_membership_test (the priced open number)
      direction: different
      minimum_effect: Reported per arm in field multiplications; predicted 0 amortised for the enumeration arm (orbits built once) and >= 3 * 2^{l-1} extra clauses per block for the CNF arm.
  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE, HARD GATE. Write out the four steps of the lemma
      and the x(P+T) derivation; evaluate the per-row verdicts of (B) against
      analysis/binstd-curve-audit/ and commit the table BEFORE any run.
      STAGE 1 - LEMMA CENSUS, MINUTES TO HOURS. For n in {8, 10, 12, 14, 16}
      (all divisor patterns represented, including composite n so the nonempty
      case is exercised) and several b: enumerate ALL F_2-subspaces of dimension
      <= 3 exhaustively and test iota-stability; for dimensions up to n-1 sample
      10^5 random subspaces per cell. The predicted stable set is exactly the
      subfields containing b. A counterexample halts the line.
      STAGE 2 - CORRECTNESS, BRUTE-FORCEABLE. Toy curves at n in {13, 17, 19}
      (prime, so V_W is the ONLY route) with W of dimension l in {3,4,5}: build
      V_W, verify |V_W| and the iota-orbit structure, run the plain loop over a
      matched-size subspace V and the orbit loop over V_W, and compare both
      against exhaustive search. Exact certificate-multiset equality required.
      STAGE 3 - THE CONSTANT, HOURS. n in {23, 29, 31, 37, 41}, l in {5,...,8},
      m in {2,3,4}, 20 planted-decomposable and 20 random targets per cell,
      >= 3 seeds: measure the orbit_loop_operation_ratio against 2^{-(m-1)}, and
      measure the matched-|B| control (V_W sized to the measured |V|).
      STAGE 4 - THE SEPARATION, HOURS. Same cells, CNF-XOR arm: (a) plain
      instance; (b) instance plus per-block canonicalisation clauses; (c) the
      u-parameterised instance where each block carries l bits of u and the
      quadratic x^2 + u x + sqrt(b) = 0 is encoded. Record conflicts, decisions,
      clauses, wall time and certificate outcome for each. This stage is the
      discriminator.
      STAGE 5 - THE DEPLOYED ROWS, ZERO COMPUTE. Fill the RQ-BINSTD cells: the
      (B) emptiness verdicts for all named rows, and for the u-line base the
      constant 2^{m-1} on the enumeration oracle with the extra inversion
      charged, beside matched rho with negation and the curve's Frobenius classes.
      State the extrapolation distance from n <= 41 to each deployed n.
    controls:
      - BRUTE-FORCE ORACLE (Stage 2) - the true certificate set; any arm disagreeing is wrong and is fixed before Stage 3.
      - MATCHED-SIZE CONTROL - V_W built to the measured size of the plain V, so the factor 2^{m-1} cannot be a factor-base-size artifact.
      - RANDOM-PAIRING KNOWN-FALSE CONTROL - a factor base paired arbitrarily instead of by iota; the orbit loop over it MUST be unsound. An arm that succeeds there has not identified the group action.
      - DEGENERACY CONTROL - a toy subfield curve E/F_{2^d} over F_{2^{dk}} with V = F_{2^d}: the yield on subgroup targets must be measured as EXACTLY zero, confirming (B)'s second mechanism rather than assuming it.
      - MATCHED RHO with negation and, on Koblitz cells, Frobenius classes, on the same curves and machine.
      - NULL - matched random Boolean systems with the same number and width of appended canonicalisation clauses, to separate propagation overhead from structure (Stage 4).
    required_metrics:
      - iota_stable_subspace_count per (n, b) cell, exhaustive dimension bound recorded
      - "|V_W|, orbit count, fixed-point count per cell"
      - operation counts (curve additions, membership tests, inversions) per arm
      - certificate_multiset per target and exact-equality verdict
      - conflicts, decisions, clauses, wall_s, peak_rss per CNF arm
      - linear-algebra unknown count, relation count, matrix rank per arm
      - matched rho group operations on the same curve
      - termination_reason (completed | timeout | memory_abort | crash)
  falsification_conditions:
    - A nonzero F_2-subspace stable under x -> sqrt(b)/x that is not a subfield containing b. The lemma is false, (B) collapses, and the record is withdrawn and superseded with the counterexample exhibited.
    - The orbit loop misses any certificate that exhaustive search finds for the pair {R, R+T}. (D) is unsound as stated; the flip-parity argument is wrong and must be repaired before anything else is read.
    - orbit_loop_operation_ratio outside [0.9, 1.15] * 2^{-(m-1)} with a counter that passes its isolated checks. The derivation of the constant is wrong.
    - The degeneracy control returns a NONZERO yield on subgroup targets for V = F_{2^d}. IDEA-20260906-a77711's subfield lemma, on which (B)'s second half rests, fails at these parameters and must be re-derived.
    - The CNF arm realises 2^{m-1} or more. The record's central separation is false in the direction that favours the algebraic representation, and that is a POSITIVE result for the SAT lane which this record would have found by trying to kill it.
    - The linear-algebra rank drops by more than the collapsed column count. The claim that P and P+T carry the same subgroup logarithm is being violated by the implementation (most likely the cofactor multiplication is missing).
  confounders:
    - The fixed point x = b^{1/4} makes one orbit of size 1; at small l it shifts |V_W|/2 by an O(1) amount that is visible in the ratio. Both the exact orbit count and the idealised 2^{m-1} are reported.
    - "|V_W| is about |W| only on average: it equals 2 * #{w in W : Tr(sqrt(b)/w^2) = 0}, a character-sum quantity over a subspace. Measured per cell, never assumed (see H1)."
    - The extra inversion in the membership test changes the wall-clock/operation conversion; operation counts and seconds-per-operation are reported separately, as in IDEA-20260904-96c4f3's unit-conversion control.
    - WDSat's XOR module may treat appended canonicalisation clauses differently from generated ones; the u-parameterised regeneration (arm c) is the control for that, exactly as in IDEA-20260915-eee7e4.
    - At composite toy n both emptiness mechanisms are live at once; cells must declare which one they are exercising.
  interpretation_limits:
    - Proposal only; no experiment, run, approval or result exists here.
    - The emptiness verdicts are scoped to F_2-SUBSPACE factor bases. They say nothing about arbitrary iota-stable sets (whose membership needs a table, hence memory 2^l - IDEA-20260904-96c4f3 (F)), nor about coset unions, nor about any factor base this program has not defined.
    - The 2^{m-1} is a CONSTANT. No exponent moves on any row; matched rho remains ahead by the same exponent it was ahead by before.
    - Nothing here is a security statement about any deployed curve. Deployed rows are arithmetic under numbered assumptions with the extrapolation distance (n <= 41 measured, 131 <= n <= 571 computed) stated.
    - The cofactor result - Z/2 on the x-line regardless of cofactor size - is about TRANSLATIONS descending to the x-line. It does not exclude other uses of a large cofactor elsewhere in a pipeline.
  heuristic_assumptions:
    - id: H1
      statement: >-
        FACTOR-BASE SIZE OF THE u-LINE BASE. For an l-dimensional F_2-subspace W
        of F_{2^n} and fixed b, #{w in W \ {0} : Tr(sqrt(b)/w^2) = 0} =
        (2^l - 1)/2 * (1 + o(1)), so |V_W| = 2^l (1 + o(1)) and the number of
        iota-orbits is 2^{l-1}(1 + o(1)), uniformly over admissible W.
      rigorous_support: >-
        RIGOROUS INGREDIENT: for each w != 0 the quadratic x^2 + w x + sqrt(b) = 0
        has exactly 0 or 2 roots in F_q according to whether Tr(sqrt(b)/w^2) is 1
        or 0 - an exact criterion, not an estimate; and the character sum
        sum_{w in F_q^*} (-1)^{Tr(sqrt(b)/w^2)} is a Kloosterman sum of modulus at
        most 2 sqrt(q). CLASSICAL DISTRIBUTION IMITATED: equidistribution of that
        trace over an l-dimensional SUBSPACE, for which the Weil bound is not
        available at l about n/3 and which is exactly the gap - the same gap H2
        of IDEA-20260904-96c4f3 carries for the plain subspace base.
      validation_plan: >-
        SAMPLE: |V_W| and the orbit count measured directly by enumeration for
        every (n, W, b) cell in the design - free, since the base is built anyway.
        SHORTCUT FOR LARGER PARAMETERS: at l <= 20 the full W can be swept at any
        n <= 41 without touching the curve, so the trace statistic is obtainable
        far beyond the cells where decompositions are run. COMPARISON DISTRIBUTION:
        measured |V_W|/2^l against 1 with a binomial model for the count of
        trace-zero w, and the Kloosterman-type tail bound 2 sqrt(q)/2^l as the
        predicted worst-case deviation. TAIL CHECKS: minimum and maximum |V_W|/2^l
        over >= 200 random W per (n, b), the extreme W exhibited with its trace
        structure rather than averaged away, and the count of W attaining
        |V_W| = 0 (which would be a completely degenerate base) reported
        separately. SAMPLED PARAMETERS RECORDED: n, l, b, W basis, seed, measured
        |V_W|, measured orbit count. TRANSFER: none claimed beyond the tested n;
        every cost in this record uses the MEASURED |V_W|, so a failure of H1
        moves constants and not the lemma.
    - id: H2
      statement: >-
        YIELD NEUTRALITY OF THE QUOTIENT. The probability that a uniformly random
        subgroup target R admits an m-fold decomposition over V_W equals the
        conservation mean of KN-FIND-007 for a base of the measured size, and the
        pairing {R, R+T} does not bias it - i.e. the orbit loop's yield per
        operation is exactly 2^{m-1} times the plain loop's at matched base size.
      rigorous_support: >-
        RIGOROUS INGREDIENT: KN-FIND-007's exact double count - the total number
        of size-m multisets is C(|B|+m-1, m) and each sums to exactly one target,
        so the MEAN yield is geometry-independent. CLASSICAL DISTRIBUTION
        IMITATED: the Poisson/occupancy law for the per-target count, whose
        failure mode is concentration from additive structure - and V_W, unlike a
        subspace, is NOT an additive group, so the concentration risk runs the
        other way and must be measured rather than argued.
      validation_plan: >-
        SAMPLE: at n in {13, 17, 19} and l = ceil(n/3), enumerate ALL m-multisets
        from V_W by brute force and obtain the EXACT distribution of decomposition
        counts over the whole group; at n <= 41 estimate it from 10^6 random
        targets via the orbit loop. COMPARISON: the empirical histogram against
        Poisson(mu) with mu = C(|B|+m-1,m)/N by chi-squared, and coverage against
        1 - e^{-mu} and against the bound min(1, mu). TAIL CHECKS: the maximum
        number of decompositions of any single target against the Poisson tail,
        reported for V_W and for a matched-size subspace V side by side - the
        comparison is the point, since a subspace is additively closed and V_W is
        not. RECORDED: n, l, m, b, W, seed, measured |V_W|. TRANSFER: the
        conservation identity is exact at every n; the Poisson half is checked
        only at toy scale and is labelled so in every computed deployed row.
  heuristic_note: >-
    The lemma, the x(P+T) identity, the subfield degeneracy and the 2^{m-1}
    operation count are UNCONDITIONAL and carry no heuristic. H1 and H2 bear only
    on the SIZE of the u-line base and on its yield, i.e. on constants inside a
    constant-factor claim. The record's a-priori expectation is stated so neither
    outcome can be read as merely interesting: the enumeration arm is expected to
    realise 2^{m-1} exactly, the CNF arm is expected to realise nothing, and the
    emptiness verdicts are expected to hold - the informative surprises are a
    counterexample to the lemma or a CNF arm that wins.
  target_complexity:
    time_exponent: >-
      Unchanged. Per-target decomposition on the enumeration oracle:
      (|B|/2)^{m-1}/(m-1)! against |B|^{m-1}/(m-1)!, an exact factor 2^{m-1}
      (2x, 4x, 8x at m = 2, 3, 4). Relation-collection exponent for this family
      stays at the m * 2^n of IDEA-20260904-96c4f3, divided by 2^{m-1}.
    memory_exponent: >-
      Unchanged and poly for the enumeration arm (V_W membership is one inversion
      plus a rank-l test, not a table). Linear-algebra unknowns and relation-matrix
      columns fall by exactly 2.
    best_known: >-
      Matched rho with negation and the curve's own Frobenius classes: about
      0.886 sqrt(pi ell / 4) group operations on B-* and c2tnb* rows, and
      2^{60.9} iterations on ECC2K-130 (KN-LIT-096 as cited by RQ-BINSTD-b6f698),
      negligible memory. Within the decomposition family, IDEA-20260904-96c4f3's
      four-row frontier.
    hidden_overhead: >-
      One F_q inversion per membership test (about 2 log_2 n field multiplications
      by Itoh-Tsujii), charged. Nothing superpolynomial hides anywhere; there is
      no o(1) in this record. For the CNF arm, the canonicalisation clause count
      3 * 2^{l-1} per block is the overhead and is the reason the arm is predicted
      to lose.
    tradeoff_note: >-
      No memory is traded; the quotient improves time and linear-algebra size
      simultaneously in the enumeration representation. Parallelisation position
      unchanged (the loop is embarrassingly parallel over the outer index; rho
      parallelises by van Oorschot-Wiener), so the ordering against rho is
      unaffected by parallelism.
  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Stage 0 and Stage 1 need no curve code at all. Stages 2-3 need
      src/semaev_tree.py's field/curve builders plus the V_W constructor, the
      orbit loop and a certificate verifier - low hundreds of lines. Stage 4
      reuses the SATIC/ICPERF CNF tooling. Single core, hours.
  asymptotic_claim:
    problem: ECDLP on standardized binary curves via x-coordinate point decomposition
    prior_best: Matched rho with negation and Frobenius classes; within the family, IDEA-20260904-96c4f3's loop at |B|^{m-1}/(m-1)! per target
    time_exponent: Unchanged (constant factor 2^{m-1} on the per-target oracle)
    memory_exponent: Unchanged
    hidden_cofactor: None; one inversion per membership test, charged
    claim_kind: structural_closure_plus_constant_factor
  dominated_by: >-
    CHECKED ROW BY ROW. Matched rho with the curve's own symmetries dominates on
    time and memory on every named row and is unaffected by anything here. Within
    the decomposition family the frontier rows checked are: the (m-1)-loop at
    poly memory (IDEA-20260904-96c4f3 (C)) - this record IMPROVES it by exactly
    2^{m-1} at unchanged memory and is therefore not dominated by it; the
    precomputed-table variant at 2^{2n/3} time and 2^{2n/3} memory (96c4f3 (D)) -
    dominates on time, is dominated on memory, so Pareto-incomparable; the
    CNF-XOR / Groebner core-cube enumerator at 2^{ml}/m! leaves - dominated by
    both; exhaustive group search at 2^n; BSGS at 2^{n/2} time and memory;
    multi-target and preprocessing rho rows - unaffected. GHS / Weil descent on
    the five composite-degree rows is a DIFFERENT column of the same table, owned
    elsewhere, and is not addressed here. Net: Pareto-improving inside a family
    that is itself dominated by rho on every standardized row.
  sota_delta:
    time: >-
      Exactly 2^{m-1} on the per-target enumeration oracle at matched factor-base
      size (2x at m=2, 4x at m=3, 8x at m=4), and the same factor on the
      relation-collection total for this family. Zero on attack capability: the
      gap to matched rho remains a factor of about 3.4 * 2^{n/2} in the exponent
      sense recorded by IDEA-20260904-96c4f3.
    memory: Unchanged (poly); linear-algebra columns exactly halved.
    data_queries: Not applicable.
  frontier_check:
    status: pending
    note: >-
      Whether the "additive subgroup closed under a twisted inversion is a
      subfield" lemma has been applied to elliptic factor bases before was not
      checked against external literature this session (no source opened). The
      2-torsion symmetrization itself is explicitly named as FUTURE WORK by
      Trimoska-Ionica-Dequen (relayed via IDEA-20260920-18dc28), which is
      evidence that its combination with a subspace base had not been carried
      out there, not evidence that nobody has. Galbraith-Gebregiyorgis
      (inputs/GG-2014-806/) and the FGHR symmetrization line (KN-LIT-004) are
      the nearest external work and should be read by a reviewer before this
      record is cited as new.
  recommended_priority: high
  priority_rationale: >-
    Its best case is a constant factor 2^{m-1}, which by docs/target-result-profile.md
    rule A1 is not target-class on its own - and the record says so. It is ranked
    high anyway for three reasons, each stated so the ranking can be contested:
    (1) Stage 0 and Stage 1 cost essentially nothing and DECIDE TWO WHOLE CELLS
    of the RQ-BINSTD reachability table with a certificate, which is the
    question's declared deliverable; (2) it converts IDEA-20260920-18dc28 from an
    unscoped "measure the combination" into a sharp two-outcome test and predicts
    the OPPOSITE of that record's implicit expectation; (3) the
    enumeration-versus-algebraic separation in (D) is a reusable statement about
    which representation can absorb a symmetry, and the program has never
    measured one. If the coordinator disagrees with (2) and (3) the honest
    ranking of the remainder is medium.
  first_deliverable: >-
    The zero-compute package: the x(P+T) derivation, the four-step emptiness
    lemma, the per-row verdict table for every named curve in RQ-BINSTD-b6f698
    with its certificate, and the V_W construction with its charged membership
    cost - all before any code runs.
  next_gate: >-
    Coordinator decision on whether the Stage 0-1 package alone is the
    deliverable (a structural-closure record for the reachability table) or
    whether Stages 2-4 are designed into an EXP-BINSTD-* contract alongside
    IDEA-20260920-18dc28.
