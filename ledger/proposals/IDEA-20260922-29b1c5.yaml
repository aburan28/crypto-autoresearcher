    - No run at m >= 131. Deployed curves appear only as computed rows.
  proof_search_map:
    bottleneck: >-
      The per-target decomposition cost's dependence on the ALPHABET SIZE of each
      slot. Every published and in-repo cost for this lane is (alphabet)^m or
      (alphabet)^{m-1} up to m!; the 2-torsion quotient is the only untried way
      to halve the alphabet without shrinking the factor base, and the open
      question is in which representation the halving survives the cost of
      canonicalising the orbit.
    baseline_embedding:
      parameter_slice: >-
        m = 2 on a toy curve at n in {13, 17}: both the plain loop over V and the
        orbit loop over V_W/iota can be run to completion and their certificate
        sets compared element by element, and the factor 2^{m-1} = 2 is small
        enough to be read off exactly rather than fitted.
      reproduction_check: >-
        (i) x(P + T) = sqrt(b)/x(P) verified on 10^6 random points per toy curve
        by independent curve arithmetic; (ii) the plain (m-1)-loop reproduces
        IDEA-20260904-96c4f3's closed form 2^{(m-1)l}/(m-1)! within [0.95, 1.10]
        on the same cells BEFORE any orbit variant is run; (iii) the unconstrained
        WDSat conflict count reproduces the shipped medians of
