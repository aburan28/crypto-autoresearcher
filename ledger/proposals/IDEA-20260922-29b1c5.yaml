    - Component used from the off-limits list: F2 (factor-base decomposition) is the declared setting, and F6 (automorphism/endomorphism orbit) is used as a COMPONENT - the order-2 translation group. What is added beyond F2 is the quotient of the x-line alphabet by that group, its emptiness certificate for subspace bases, and its price in each of two representations.
