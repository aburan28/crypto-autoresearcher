        unsound implementation). Broken by requiring EXACT equality of the
        certificate multiset between the orbit loop and exhaustive search over
        V_W^m for {R, R+T} jointly at every brute-forceable cell; a missing
        certificate is a soundness failure, not a speedup. A third preimage -
        the gain coming from V_W simply being SMALLER than V - is broken by the
        matched-|B| control, in which V_W is built to the measured size of V.
    constructive_transforms:
