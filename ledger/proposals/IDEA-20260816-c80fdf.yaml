idea:
  id: IDEA-20260816-c80fdf
  question_id: RQ-ALR-002
  added: '2026-08-16'
  title: 'Locate the exact parameter at which the nested projector weight stops being a weight: sweep
    total target degree across the characteristic and measure the first instance where a true candidate
    acquires multiplicity zero modulo p, against a matched random-integer-weight null of identical
    total mass'
  class: control
  claim: '(A) H-ALR-002 lists as an assumption that total target degree is below the characteristic,
    preventing nonzero multiplicity cancellation, and EV-ALR-002 records the resulting identity holding
    on 13 controls. That assumption is a threshold, and a threshold is only useful if someone has
    stood on both sides of it. Nobody has. (B) The mechanism of failure is explicit and cheap to exhibit:
    the source weight m_P is a sum of chart-wise Fermat-projector traces, each a nonnegative integer
    gcd degree, and the sum lives in F_p. Once the total target degree D reaches p, a true candidate
    can accumulate a weight that is a nonzero integer but zero modulo p, at which point it vanishes
    from the moment stream and the locator silently loses a root. (C) The measurable is the failure
    curve: as D/p rises through one, the fraction of instances in which at least one true candidate
    acquires weight zero mod p. The deliverable is the smallest D at which a false negative first
    appears at each tested p, and the shape of the curve above it. (D) This is the bucket''s threshold
    question in its sharpest form. It converts an assumption into a measured boundary and gives the
    lane a number rather than a caveat: below D_crit the compact representation is faithful, above
    it the compactness is purchased by silent loss, and the entry reports where D_crit sits relative
    to the parameters the lane actually uses. (E) NOT CLAIMED: no attack, no speedup, no claim that
    the assumption is wrong within its stated scope, and no claim that the identity fails anywhere
    EV-ALR-002 asserts it. The 13 controls were run below the threshold and this entry does not contradict
    them; it measures what happens above it, which is a region no record has entered. It also claims
    no consequence for any live target.'
  mechanism: 'STAGE 1, build instances with controlled total target degree. Using exact toy curve
    arithmetic, construct source and target divisors whose total target degree D is swept from well
    below p to several multiples of p, holding the candidate structure fixed so that the true candidate
    set is known by an independent group-law computation. STAGE 2, compute the chart-wise Fermat-projector
    traces exactly as integers first, then reduce their sum mod p, recording both. Recording the integer
    sum before reduction is the whole design: it is what makes a false negative attributable to reduction
    rather than to a bug. STAGE 3, compare the nonzero-weight support against the independently computed
    candidate support and record any true candidate whose weight is a nonzero integer but zero mod
    p. STAGE 4, sweep D and p and report the failure fraction per cell, with the smallest failing
    D per p. STAGE 5, run the null described below with matched total mass. STAGE 6, apply the structural
    tell: the failure fraction should rise with D and should be near zero for D well below p, because
    that is what the assumption asserts. A failure fraction that is nonzero below p indicates a bug
    in the trace computation rather than a threshold, and a failure fraction that stays at zero far
    above p indicates that the weights are not distributed as assumed and the threshold is not where
    the assumption puts it. Both readings are reported as instrument findings before any curve is
    interpreted.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/hypotheses/H-ALR-002.yaml and ledger/evidence/EV-ALR-002.yaml in full, including
      the assumption list and the observation list; read ledger/questions/RQ-ALR-002.yaml and experiments/EXP-ALR-002/specification.yaml.
      Greps run: grep -ril ''Fermat'' ledger/ knowledge/ (the only ledger hit is H-ALR-002; corpus
      hits are literature notes); grep -ril ''projector'' ledger/proposals/ (4 hits, all resolved
      to FN-DSA, ML-KEM, SNOVA and RQ-MSI records); grep -ril ''characteristic'' with manual inspection
      of the ALR records.'
    results: 'The Fermat projector appears in exactly one ledger record, H-ALR-002, and in no proposal.
      The four projector proposals are in unrelated lanes: IDEA-20260808-e7ba81 on FN-DSA sampler
      exactness, IDEA-20260808-90632c on an ML-KEM Beta law, IDEA-20260808-348896 on SNOVA Frobenius
      twist support, IDEA-20260811-0f89a9 under RQ-MSI-f760b2. The below-characteristic assumption
      appears in H-ALR-002''s assumptions and is echoed in EV-ALR-002''s boundaries, but no record
      measures behaviour at or above the threshold, and RQ-ALR-002 carries zero proposals.'
    verdict: 'UNVERIFIED. No claim about external literature. Assembled from known parts: reduction
      mod p annihilating a nonzero integer is elementary, the projector identity is inherited verbatim
      from H-ALR-002, and the independent group-law comparator is the one EV-ALR-002 already used.
      Claimed new only as a crossing: measuring the identity on the far side of an assumption that
      every ALR record states and none tests, and reporting the boundary as a number rather than as
      a caveat.'
  object_first_candidate:
    tracked_object: 'The weight vector of source points reduced modulo p: for each source point P,
      the residue class of the summed chart-wise Fermat-projector trace. The object followed through
      the computation is this vector of residues, held alongside its unreduced integer preimage so
      that reduction-induced loss is attributable.'
    lossiness: 'Reduction mod p discards the integer magnitude of every weight and retains only its
      residue. Below the threshold this discards nothing that matters, since all weights are smaller
      than p and the residue determines the integer; there the projection is a change of coordinates
      and the entry says so explicitly. Above the threshold it becomes genuinely lossy, and the loss
      is exactly the phenomenon under study: distinct integer weight vectors map to the same residue
      vector, and the zero class absorbs true candidates. The residue vector still propagates because
      addition of chart traces commutes with reduction, so a step acts identically before and after
      reduction, which is precisely why the loss is invisible to any computation performed only in
      F_p.'
    propagation: 'One step of the target operation, adding one chart''s Fermat-projector trace to
      a source point''s accumulated weight, acts on the tracked object by m_P -> m_P + t mod p, with
      t the chart-wise gcd degree. The step is deterministic and order-independent, and it commutes
      with reduction, so the residue vector evolves autonomously. The critical structural point is
      that the step gives no signal when it crosses a multiple of p: the arithmetic is identical,
      which is why the failure is silent and why the unreduced integer preimage must be carried alongside
      as instrumentation rather than derived afterwards.'
    survival_score: 'The weight interpretation survives exactly while max total accumulated trace
      stays below p, and dissolves as soon as any candidate''s accumulated trace is a nonzero multiple
      of p. The entry reports the survival boundary as two numbers per tested p: the largest D at
      which no instance in the cell produced a false negative, and the smallest D at which at least
      one did, with the gap between them reflecting the sweep granularity, which is reported rather
      than smoothed.'
  null_object_control: 'Replace the projector-derived weights by uniformly random nonnegative integers
    on the same support with the same total mass D, reduce them mod p by the identical code path in
    the same invocation, and measure the identical false-negative statistic. The null gives the baseline
    rate at which a random weight vector of total mass D has a coordinate that is a nonzero multiple
    of p, which for random integers is approximately support size times D/(p * support size) in the
    relevant regime. The signal arm means something only if the elliptic arm departs from that baseline:
    colliding more would say the projector traces are unusually clustered at multiples of p, colliding
    less would say they are unusually spread. Equality is the expected and fully usable outcome, and
    it would establish that the threshold is a pure counting phenomenon with no elliptic content.'
  discriminated_from:
  - EV-ALR-002's 13 controls, all of which were run below the assumed threshold and confirm the identity
    there; this entry runs above the threshold, which is a disjoint parameter region, and it contradicts
    nothing those controls establish.
  - The moment-fiber entry in this same batch, which measures what a truncated moment prefix discards
    at fixed weights; this entry measures what reduction mod p discards at full moment length, so
    one varies prefix length and the other varies total target degree, and they share no independent
    variable.
  - IDEA-20260808-348896 and the other three projector proposals, which concern SNOVA, FN-DSA and
    ML-KEM objects with no relation to a Fermat projector over a target-divisor chart.
  - 'The blacklisted requirement not to present infrastructure failure as negative evidence: a false
    negative here is an exactly characterised arithmetic event with its integer preimage recorded,
    not a timeout or a crash, and the design records the preimage precisely so that the two can never
    be confused.'
  - 'Generic modular-reduction folklore with no tracked object: the tracked object here is the residue
    vector with its integer preimage carried alongside, and the deliverable is a boundary parameter
    for a specific committed identity.'
  assumptions:
  - The chart-wise Fermat-projector trace equals the target-chart gcd degree, as H-ALR-002 states
    and EV-ALR-002 verified on 13 controls; this entry inherits that identity rather than re-establishing
    it.
  - An independent group-law computation of the true candidate support is available and is exact at
    toy scale, as EV-ALR-002's comparator was.
  - Total target degree D can be swept independently of the candidate structure, so that failures
    are attributable to D and not to a changing candidate set.
  - Toy primes small enough for D to exceed p within a feasible divisor size are usable without the
    curve arithmetic degenerating, which the small-p sanity controls check.
  - Integer traces can be computed exactly before reduction, which requires the implementation to
    avoid reducing early.
  predictions:
  - metric: false_negative_fraction_at_total_target_degree_below_half_p
    direction: lower
    minimum_effect: 0.0
  - metric: smallest_total_target_degree_D_with_a_false_negative
    direction: different
    minimum_effect: 'forced value: predicted to be at least p, since below p no nonzero integer weight
      can reduce to zero; a false negative below p would be a bug and is a falsification condition
      rather than a discovery'
  - metric: false_negative_fraction_at_total_target_degree_three_p
    direction: higher
    minimum_effect: 0.05
  - metric: elliptic_arm_minus_matched_random_integer_weight_null_false_negative_fraction
    direction: different
    minimum_effect: 0.0
  minimal_test:
    design: 'One script over harness/toycurve.py at deliberately small primes, p in {11, 13, 17, 19,
      23}, where D can exceed p with divisors of tractable size. For each p, sweep total target degree
      D over a grid from 0.25p to 4p, and at each D generate 200 instances with a fixed candidate
      structure of size c in {2,3}. For each instance compute the chart-wise traces as exact integers,
      record the unreduced weight vector, reduce mod p, and compare the nonzero-residue support against
      the independently computed candidate support from direct group-law arithmetic. Count instances
      where a true candidate has nonzero integer weight and zero residue. In the same invocation run
      the matched random-integer-weight null at identical total mass and support size. Report the
      failure curve per p with the smallest failing D. Five primes times sixteen D-values times 200
      instances times two arms is a few CPU-minutes at these sizes. It discriminates because the unreduced
      preimage is recorded: every reported false negative is provably a reduction event, and any failure
      below p immediately identifies a bug rather than a threshold.'
    controls:
    - Matched random-integer-weight null at identical total mass and support size, same invocation,
      identical reduction code path.
    - Unreduced-preimage recording for every instance, so that every false negative is attributable
      to reduction and never to a computation fault.
    - Independent group-law candidate support comparator, the same comparator style EV-ALR-002 used,
      run on every instance rather than on a sample.
    - Below-threshold sanity band at D from 0.25p to 0.75p, where the false-negative fraction must
      be exactly zero.
    - 'Candidate-structure control: hold c fixed while sweeping D, and separately hold D fixed while
      sweeping c, so the two effects are not confounded.'
    required_metrics:
    - false_negative_fraction_per_D_and_p
    - smallest_total_target_degree_with_a_false_negative
    - unreduced_integer_weight_distribution
    - null_arm_false_negative_fraction
    - candidate_support_agreement_rate
    - below_threshold_band_failure_count
  falsification_conditions:
  - Any false negative occurs at D strictly below p, which is arithmetically impossible for nonnegative
    integer weights and therefore identifies an implementation fault that voids the run.
  - The false-negative fraction remains exactly zero at D above 3p, indicating the weight distribution
    is not what the assumption models and the threshold is not where it is stated.
  - The independently computed candidate support disagrees with the nonzero-integer-weight support
    anywhere below threshold, contradicting the identity EV-ALR-002 established and indicating a fault
    here rather than there.
  - The unreduced preimage cannot be recorded because the implementation reduces early, in which case
    no false negative is attributable and no curve may be reported.
  - The elliptic arm and the matched null are identical at every D, which is not a falsification of
    the threshold but is a falsification of any elliptic-specific reading of it, and must be reported
    as such.
  - Toy curve arithmetic degenerates at the small primes required, so instances cannot be generated
    with the intended candidate structure.
  confounders:
  - Very small primes making the curve group tiny, so candidate structures are constrained by the
    group rather than by the design; the candidate-structure control and the multi-prime sweep bound
    this.
  - Sweeping D by adding target points, which also changes the divisor's duplicate structure and hence
    the chart count, confounding threshold with chart effects; chart count is therefore recorded per
    instance and reported alongside.
  - Early reduction anywhere in the implementation, which would erase the preimage and make every
    finding unattributable.
  - Fixing the candidate structure while D grows means the average trace per candidate grows, which
    is the intended mechanism but also means the result describes that growth pattern and not an arbitrary
    one.
  - A false negative that removes a candidate may be masked if another candidate happens to supply
    an equivalent locator root, which the design must detect by comparing supports rather than locators.
  interpretation_limits:
  - Nothing here contradicts EV-ALR-002, whose 13 controls sit entirely below the threshold; the two
    describe disjoint parameter regions.
  - The measured boundary is scoped to primes at most 23 and to the tested candidate structures, and
    no boundary at operational parameters is claimed.
  - A false negative is an exactly characterised arithmetic event, not an infrastructure failure,
    and is never to be read as negative mathematical evidence about the identity within its stated
    scope.
  - If the elliptic arm matches the null, the threshold is a counting phenomenon with no elliptic
    content, which is a complete result and not a weaker one.
  target_complexity:
    time_exponent: No attack exponent is claimed. Run times are those of the measurement at very small
      primes and carry no information about any algorithm's cost.
    memory_exponent: 'No memory exponent is claimed. The entry bears on memory only indirectly: it
      identifies the parameter region in which the compact weight representation is faithful, which
      is a precondition for any size claim made about that representation elsewhere.'
    best_known: The incumbent is the identity as stated in H-ALR-002 with its below-characteristic
      assumption, verified by EV-ALR-002 on 13 controls; the entry supplies the boundary that assumption
      implies and claims no improvement to the identity.
    hidden_overhead: 'Hidden in the lower-order terms is the cost of carrying unreduced integer preimages,
      which doubles the instrumentation''s memory and would never be present in a production route,
      so the measurement is more expensive than the thing measured. The human cost hides in early
      reduction: a single premature mod p anywhere in the implementation silently converts every finding
      into an unattributable one.'
  dominated_by: n/a (no result claimed). All frontier rows recorded in this lane were checked, the
    B^(5/2) rho proxy and the B^(7/2) represented projector and A-linear target-Krylov routes named
    in EV-ALR-002, and a threshold measurement is not a point on any of them.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    the false-negative fraction as a function of D/p with its smallest failing D per prime, and the
    difference between that curve and the matched random-integer-weight null.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the below-threshold band shows exactly zero false negatives: 0.9,
    since it is arithmetically forced and a failure there is a bug. That false negatives appear above
    p at the predicted rate: 0.8, the residual risk being that the trace distribution concentrates
    away from multiples of p. That the elliptic arm departs measurably from the matched random-integer-weight
    null: 0.2, deliberately low, because there is no stated reason for projector traces to cluster
    at multiples of p and the honest expectation is that the threshold is pure counting. That toy
    curve arithmetic supports the intended candidate structures at primes as small as 11: 0.55, which
    is the most likely place the design fails and is why the multi-prime sweep starts at 11 rather
    than lower. That the resulting boundary is operationally relevant to the lane''s own parameters:
    0.3, since the recorded ALR curves have p near 10^5 and D far below it.'
