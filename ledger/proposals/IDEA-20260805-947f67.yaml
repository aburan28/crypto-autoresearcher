idea:
  id: IDEA-20260805-947f67
  question_id: RQ-AES-001
  added: '2026-08-05'
  title: >-
    The index-branching duality iota * B = |X|: a one-line forced identity that
    answers CAND-806-A's bounded-index-subgroup residual before any compute, and
    says why route 2 cannot repair PROP-701-I's induction
  class: theory

  claim: >-
    For the F-linear round-independent per-word projection class of
    TASK-20260801-806 section 2, the "bounded-index subgroup of translations"
    that section 3.3 route 2 names as a possible repair of PROP-701-I's Step-3
    group closure DOES EXIST, its index is COMPUTABLE IN CLOSED FORM, and that
    closed form makes it USELESS AS A REPAIR. Concretely: let F = GF(2^8),
    q = 256, pi : F^4 -> X = F^4/K be F-linear with kernel K, 0 < dim K < 4; let
    S = { i : proj_i(K) != 0 }, s = |S|, W_S = F-span{ m_i : i in S } where m_i
    are the columns of the AES MixColumns matrix M. Define the CONFINEMENT
    TRANSLATION SET
      T_pi = { t in F^4 : pi(z + t) - pi(z) lies in pi(W_S) for every z }.
    Then T_pi contains the subgroup W_S + K, so a bounded-index subgroup
    statement holds; and writing iota = [F^4 : W_S + K] = q^(4 - dim(W_S + K))
    and B = q^(s - dim(W_S intersect K)) (Proposition 806-1's own per-word
    branching), the two satisfy the EXACT IDENTITY
      iota * B = q^(4 - dim K) = |X| = 2^(32 - L),   L = 8 * dim K.
    The identity is the whole content. It says the index and the branching are
    not two independent quantities that a repair could bound separately: they are
    exact complements in the state space. "Index bounded by a function of B
    alone" is therefore EQUIVALENT to "B is within that function of |X|", i.e. to
    the relation being nearly total and carrying no information across the
    interface. Route 2 is not a repair of the induction; it is a restatement of
    Corollary 806-2's trade-off in the dual variable. This is a derivable forced
    value, not a measurement, and it costs zero compute.

  object_first_candidate:
    tracked_object: >-
      NOT pi, and not the branching relation. The tracked object is the
      CONFINEMENT TRANSLATION SET T_pi -- the set of translations t of the
      128-bit super-box state under which the projected value moves only inside
      the fixed subspace pi(W_S) -- followed through one AES super-box interface
      Phi = ARK . MC . SR and then across n of them. Its INDEX iota in the
      translation group is the invariant carried, and the composition law of that
      index across interfaces is the quantity the campaign has never had. Where
      PROP-701-I tracked an EQUALITY of pi-values and OD-4 tracked a
      CONFINEMENT SET SIZE B, this tracks the DUAL object: how much of the
      translation group is confined. That dual is the type-stable invariant
      TASK-20260801-806 section 3.3 asks for by name and does not supply.
    established_families_off_limits: >-
      Off-limits as the primary lens for this proposal: integral / square,
      division property (including bit-based and three-subset), impossible
      differential, Demirci-Selcuk meet-in-the-middle, partial sums, boomerang /
      retracing boomerang, biclique, related-key differential, and yoyo /
      exchange-attack distinguishers. None of them is the lens here. The lens is
      the campaign's own internal object class (F-linear round-independent
      per-word projections) and the question is INTERNAL to this campaign's
      own barrier programme, not a cryptanalytic attack. That is stated so the
      record cannot later be read as claiming an attack family.
    newness_score: >-
      The subgroup W_S + K and its index are elementary linear algebra and are
      certainly not new mathematics. What is new in this corpus is (a) posing the
      index as the TRACKED OBJECT rather than the branching, and (b) the
      identity iota * B = |X|, which converts an open question the campaign
      explicitly left unanswered ("that is a genuine open question and is not
      answered here", TASK-20260801-806 section 3.3 route 2) into a closed form.
      Nothing in the corpus computes iota, and DEC-20260731-030's own
      next_action ranks that residual first while supplying no candidate
      invariant for it.
    testability_score: >-
      Maximal and free. The identity is exact integer arithmetic on subspace
      dimensions; it is checkable by hand and confirmable exhaustively in the
      GF(2^4) analogue and by direct enumeration at named GF(2^8) kernels in
      seconds. It has a single sharp failure mode: any kernel K with
      log_q(iota) + log_q(B) != 4 - dim K refutes it outright.
    survival_score: >-
      The object survives one interface by construction -- W_S + K is defined
      from K and M alone and does not depend on the state or the round key.
      Whether it survives COMPOSITION is exactly the open part, and it is where
      RT-3's unnumbered nonlinear-layer dependence bites: pi . SB is not
      F-linear, so T_pi as defined is a one-interface object and its
      multi-interface analogue must be MEASURED, not assumed. That limitation is
      the honest boundary of the proposal and is not hidden in a footnote.

  mechanism: >-
    DERIVED IN-REPO, from committed records only. Every ingredient is either an
    identity proved here or a statement quoted from a committed artifact with its
    path given.

    SETUP. F = GF(2^8), q = 256. Phi = ARK . MC . SR is the AES super-box
    interface; M is the MixColumns matrix, invertible (MDS), with columns
    m_0..m_3. pi : F^4 -> X = F^4 / K is F-linear with kernel K, applied
    round-independently to every super-box word (TASK-20260801-806 section 2,
    committed in snapshot cc660597). L = 32 - log_2|X| = 8 * dim K.
    S = { i : proj_i(K) != 0 }, s = |S|, W_S = span_F{ m_i : i in S }.

    STEP 1 -- THE CONFINING SET IS A COSET OF A FIXED SUBSPACE. LEM-806-2 of the
    committed report establishes that, at a fixed input pi-profile x, the
    reachable perturbation set of the pre-MixColumns vector y^(j) is exactly
    prod_i proj_i(K) = F^S, and that MixColumns carries F^S onto W_S. ARK
    contributes a translation only. Hence the canonical relation is
      R_j(x) = pi( c(x) + W_S )
    for a constant c(x) depending on x and on the round key. THE SIZE of R_j(x)
    is |pi(W_S)| = q^(dim W_S - dim(W_S intersect K)), and since the m_i are
    columns of an invertible matrix, dim W_S = s exactly. This reproduces
    Proposition 806-1's B = q^(s - dim(W_S intersect K)) and is the point at
    which this proposal EMBEDS the committed baseline rather than replacing it.

    STEP 2 -- THE DUAL OBJECT. Because R_j(x) is a COSET of the FIXED subspace
    pi(W_S) -- fixed meaning independent of x -- the confinement relation "the
    two outputs lie in a common R_j-set" is exactly "their difference lies in
    pi(W_S)". Pull that back through pi: the set of state translations t for
    which pi(z + t) - pi(z) always lies in pi(W_S) is
      T_pi  =  pi^{-1}( pi(W_S) )  =  W_S + K,
    a SUBGROUP of (F^4, +). This is precisely the "bounded-index subgroup of
    translations" section 3.3 route 2 asks for, and it exists unconditionally in
    the F-linear class. Its index is
      iota = [F^4 : W_S + K] = q^(4 - dim(W_S + K)).

    STEP 3 -- THE FORCED IDENTITY. dim(W_S + K) = dim W_S + dim K
    - dim(W_S intersect K) = s + dim K - dim(W_S intersect K). Therefore
      log_q iota = 4 - s - dim K + dim(W_S intersect K),
      log_q B   = s - dim(W_S intersect K),
      log_q iota + log_q B = 4 - dim K,
    i.e. iota * B = q^(4 - dim K) = |X| = 2^(32 - L), EXACTLY, for every
    admissible K. THE IDENTITY IS PARAMETER-FREE AND IS DERIVED BEFORE ANY RUN.

    STEP 4 -- WHY THIS KILLS ROUTE 2 AS A REPAIR, AND WHAT IT LEAVES OPEN. A
    repair of PROP-701-I's Step 3 needs the confinement relation to contain a
    subgroup whose index is bounded by a function of B ALONE, uniformly in the
    state space, so that the induction's error does not grow with the object. By
    the identity, iota = |X| / B. Bounding iota by g(B) is bounding |X| by
    B * g(B): it is a statement that the branching is already comparable to the
    entire projected state space, at which point Corollary 806-2's yield
    Y = log_2|X| - log_2 B is at most log_2 g(B) and the object carries at most
    log_2 g(B) bits across the interface. The two horns are stated so a reviewer
    can attack either: (i) iota is small -- generically it is 1, because a
    kernel with all coordinates nonzero has s = 4 and W_S = F^4 -- in which case
    the subgroup is the WHOLE translation group and the statement is TRUE AND
    VACUOUS, confining nothing; (ii) iota is large, in which case B = |X| / iota
    is small and the object is informative, but then the index is NOT bounded in
    B and Step 3's group closure still fails. There is no third regime, because
    the product is pinned. WHAT REMAINS OPEN, stated as forward guidance and not
    as a closure: this is a ONE-INTERFACE statement in the F-LINEAR class. The
    multi-interface index iota^(n) of the composed relation is NOT determined by
    the identity, the nonlinear layer between interfaces makes pi . SB non-linear
    so T_pi's definition does not carry verbatim (RT-3 horn (b)), and a
    NON-LINEAR pi may have a confinement translation set that is not a subgroup
    at all -- in which case route 2's premise fails for a different reason and
    the identity says nothing about it.

    STEP 5 -- A SECOND FORCED VALUE, FOR THE INSTRUMENT. On K = ker(M + I) =
    span(1,1,1,1) -- RT-1's kernel -- s = 4, W_S = F^4, dim(W_S int K) = 1, so
    B = q^3 = 2^24 and iota = q^0 = 1. On K = span(e_0), s = 1,
    W_S = span(m_0), dim(W_S int K) = 0 (m_0 = (2,1,1,3)^T is not a scalar
    multiple of e_0), so B = q = 2^8 -- Proposition 806-1's tight minimum -- and
    iota = q^2 = 2^16. These two named kernels sit at OPPOSITE ends of the
    identity and are the cheapest possible discriminating pair for any
    implementation of the census.

  novelty_status: unverified

  literature_context:
