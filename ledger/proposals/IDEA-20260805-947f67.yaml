  lossy_projection_identifiability_audit:
    projection: >-
      Two-stage. First, the campaign's own projection pi : F^4 -> F^4/K applied
      per word. Second -- and this is the projection this proposal introduces --
      the map from the whole object (K, M, the state space) to the single integer
      pair (log_q B, log_q iota).
    what_is_discarded: >-
      The second projection discards the identity of K, the identity of W_S, the
      round key, the state, and every distinction between kernels of the same
      (s, dim(W_S int K)). It retains exactly two integers.
    why_genuinely_lossy: >-
      Genuinely lossy in a checkable way: the fibre over (log_q B, log_q iota) =
      (3, 0) contains ker(M + I) = span(1,1,1,1), span(m_0), and every random
      dim-1 kernel with all coordinates nonzero -- three structurally different
      objects sharing the observable. That is an OBSERVATION COLLISION and it is
      recorded as such rather than hidden: the pair does NOT identify K.
    why_compatible_with_the_operations: >-
      Compatible with the super-box interface at ONE interface, because both
      coordinates are defined from K and M alone and are invariant under ARK
      (a translation changes c(x), never dim W_S, dim K or dim(W_S int K)) and
      under the choice of state. It is NOT established compatible with
      composition across interfaces, because SubBytes is not F-linear; that gap
      is RT-3 and it is carried, not assumed away.
    is_it_only_a_change_of_coordinates: >-
      CHECKED, AND THE ANSWER IS NO -- but the check is worth stating precisely
      because the naive reading says yes. The suspicion is that (log_q B,
      log_q iota) is merely (a, 4 - dim K - a), i.e. one free number plus a
      known constant, hence a relabelling of B. THAT IS EXACTLY WHAT THE
      IDENTITY PROVES, and it is the proposal's finding rather than its defect:
      the pair carries ONE degree of freedom, not two, and the whole point is
      that a repair which hoped to bound iota independently of B was hoping to
      bound the second coordinate of a one-dimensional object. So the projection
      IS a change of coordinates ON THE PAIR -- and demonstrating that is the
      result, because the campaign's route 2 presupposed it was not. The
      canonical char-2 failure named in the inventor protocol,
      (Delta, Pi) = (x xor y, x*y) with the pair recoverable as the roots of
      t^2 + Delta t + Pi, is the same shape, and this record says so in its own
      voice rather than waiting for a reviewer to say it.
    mirror_failure_check: >-
      Also checked. The mirror failure (a projection so lossy it is constant
      across instances, zero comparator spread) does NOT occur: log_q B takes at
      least the values 1 and 3 over dim-1 kernels, and log_q iota takes at least
      0 and 2, on the two named witnesses above. The comparator spread is
      nonzero and is exhibited, not asserted.

  assumptions:
    - >-
      That LEM-806-2's characterisation of the reachable perturbation set is
      correct as committed. It was independently re-derived and exhaustively
      recomputed by TASK-20260801-809 in two analogues, per the goal record's
      check_a verdict. This proposal EMBEDS it rather than re-proving it, and
      stage 1 of the paired experiment re-derives it independently anyway.
    - >-
      That dim W_S = s, i.e. that any s columns of M are F-linearly independent.
      This follows from M being invertible; it is recomputed in stage 1 and is
      NOT taken on trust.
    - >-
      That "bounded index" in section 3.3 route 2 means bounded by a function of
      B uniformly in the state space. If the intended reading was weaker -- e.g.
      index bounded at a FIXED |X| -- the identity still holds but the
      conclusion in STEP 4 does not follow, and the proposal must be restated.
      This is the single most likely way the record is wrong and it is named
      first rather than last.

  proof_search_map_note: >-
    The full four-audit proof_search_map for this proposal is carried on the
    paired hypothesis H-AES-0e5fa1, as templates/research-records.md places it.
    It is not duplicated here.

  predictions:
    - metric: >-
        identity_residual: max over the tested kernel census of
        | log_q(iota(K)) + log_q(B(K)) - (4 - dim K) |, computed from
        independently recomputed subspace dimensions over GF(2^8)
      direction: lower
      minimum_effect: >-
        EXACTLY 0, at every kernel tested, with no tolerance. This is an integer
        identity, not a fit. Any single kernel with a nonzero residual falsifies
        the mechanism outright and is the cheapest available refutation.
    - metric: >-
        iota_at_ker_M_plus_I: log_q of the index of W_S + K at
        K = span(1,1,1,1) = ker(M + I) over GF(2^8)
      direction: different
      minimum_effect: >-
        EXACTLY 0 (index 1: the confinement subgroup is the whole translation
        group). Paired forced value at the same kernel: log_q B = 3, i.e.
        B = 2^24. FORCED BEFORE ANY RUN. Note that 2^24 is also the value RT-1
        exhibits for the JOINT branching J at this kernel, so this run must
        report B and J separately and must not conflate them.
    - metric: >-
        iota_at_span_e0: log_q of the index of W_S + K at K = span(e_0)
      direction: different
      minimum_effect: >-
        EXACTLY 2 (index 2^16), with log_q B = 1 (B = q = 256, Proposition
        806-1's tight minimum). FORCED BEFORE ANY RUN. Together with the
        previous prediction this exhibits nonzero spread in both coordinates and
        so demonstrates the instrument can move.
    - metric: >-
        generic_iota_fraction: fraction of uniformly sampled dim-1 kernels over
        GF(2^8) with iota = 1
      direction: higher
      minimum_effect: >-
        At least 0.98. Derived, not guessed: iota = 1 iff W_S + K = F^4, and for
        dim K = 1 with all four coordinates of the spanning vector nonzero we get
        s = 4 and W_S = F^4 already. The probability that a uniform nonzero
        vector in F^4 has a zero coordinate is 1 - (255/256)^4 approx 0.0155, so
        the predicted fraction is approx 0.9845 and the threshold 0.98 is set
        below it. IF THE MEASURED FRACTION IS BELOW 0.95 the derivation of S from
        K is wrong somewhere and the whole mechanism must be rechecked.
    - metric: >-
        route2_verdict: the categorical verdict on section 3.3 route 2 --
        REPAIRS_INDUCTION / VACUOUS_BECAUSE_INDEX_ONE / EQUIVALENT_TO_COR_806_2
      direction: different
      minimum_effect: >-
        Predicted EQUIVALENT_TO_COR_806_2, with VACUOUS_BECAUSE_INDEX_ONE as the
        generic sub-case. REPAIRS_INDUCTION at any tested kernel falsifies the
        proposal's central claim and would make route 2 the campaign's highest
        priority item rather than a closed one.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line. STAGE 0
      (pen and paper, zero compute, MAY END THE PROPOSAL): re-derive STEP 1-3
      independently, without reading this record's algebra, and check the
      identity symbolically. If the re-derivation disagrees, STOP. STAGE 1
      (seconds, pure Python): recompute dim W_S, dim(W_S int K), dim(W_S + K) at
      the two named witnesses and confirm both forced values. STAGE 2 (minutes,
      numpy now available -- see the environment finding in
      IDEA-20260805-78d9bd): kernel census over GF(2^8) at dim 1, 2, 3 -- a
      seeded sample of at least 10^4 per dimension plus the named witnesses --
      reporting the identity residual and the iota histogram. STAGE 3 (the part
      that is NOT settled by algebra): direct composition of the relation across
      n = 2..5 interfaces in the GF(2^4) analogue under BOTH composition models
      of CTRL-810-A (M-affine: Phi composed with itself; M-nonlinear: Phi . SB
      with the real S-box), measuring the composed index iota^(n) against the
      predicted iota^n and against the ceiling.
    controls:
      - >-
        NULL OBJECT (same shape, forced value derived pre-run, CAN FAIL).
        Replace M by a uniformly random invertible matrix M' over GF(2^8), same
        dimensions, same pi, same kernel census. FORCED VALUE: the identity
        iota * B = q^(4 - dim K) MUST STILL HOLD, because its proof uses only
        that the columns of the mixing matrix are independent -- it never uses
        MDS, the AES polynomial, or any AES-specific structure. So this null
        CANNOT distinguish AES from a random invertible mixing layer, and SAYING
        SO IS THE POINT: it fixes the interpretation limit before the result
        exists. The null CAN fail: if the identity breaks for random M', the
        proof is wrong. What the null MUST separate is the DISTRIBUTION of iota,
        not the identity -- AES's M has ker(M + I) = span(1,1,1,1) nonzero,
        which a random invertible matrix has with probability approx q^{-4}
        per eigenvalue-1 direction, so the count of kernels with special
        behaviour is predicted to differ and that difference is the measured
        quantity.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR.
        K = span(e_0) with the real AES M. The forced value log_q B = 1,
        log_q iota = 2 MUST be reproduced. If the instrument does not return it,
        the instrument is broken and NO NEGATIVE RESULT MAY BE REPORTED from any
        stage. Threshold declared before the run: exact integer match, not
        approximate.
      - >-
        GRADED CONTROL, 3 INTERIOR POINTS, MONOTONICITY REPORTED. dim K = 1, 2,
        3 with the identity's right-hand side 4 - dim K = 3, 2, 1. The sum
        log_q iota + log_q B must DECREASE BY EXACTLY 1 PER STEP. A quantity
        that fails to decrease as the parameter meant to destroy it (kernel
        dimension, i.e. entropy loss L) increases is the canonical artifact tell
        named in docs/inventor-protocol.md, and this control is built to catch
        it.
      - >-
        ORDERING CONTROL. The null arm (random invertible M') is run, recorded,
        and its verdict committed BEFORE the AES arm is looked at. If the frozen
        verdict rule emits the same label on both, the rule discriminates
        nothing and is rewritten before the AES arm is read.
      - >-
        ARCHIVE CHECK (zero compute). iota has never been computed in this
        corpus -- grep over ledger/, experiments/ and coordination/ for the
        confinement translation set returns nothing. That UNAVAILABILITY is
        recorded here as an absence, not claimed as a passed check.
    required_metrics:
      - identity residual per kernel, with the dimension-computation method named
      - iota and B at the two named witnesses, as exact integers
      - iota histogram per kernel dimension, with sample size and seed
      - composed index iota^(n) for n = 1..5 under both composition models
      - the route2_verdict categorical label, with the frozen decision rule quoted

  falsification_conditions:
    - >-
      Any kernel with log_q iota + log_q B != 4 - dim K. The identity is wrong
      and the proposal is withdrawn as a superseding record.
    - >-
      dim W_S != s at any kernel. LEM-806-2's bookkeeping or M's invertibility is
      being misused and STEP 1 fails.
    - >-
      The positive control at span(e_0) does not return (log_q B, log_q iota) =
      (1, 2). Nothing negative may be reported at all.
    - >-
      A construction of a bounded-index subgroup whose index is bounded in B
      uniformly, at a kernel where B is much smaller than |X|. STEP 4 is then
      wrong, route 2 IS a repair, and this becomes the campaign's top item.
    - >-
      The composed index iota^(n) under M-nonlinear differs from the M-affine
      value at n = 2. The one-interface object does not compose, RT-3 horn (b)
      is confirmed material, and the identity's reach is exactly one interface --
      which must then be said in every citation of it.

  confounders:
    - >-
      ANALOGUE SUBSTITUTION. Stage 3 runs in the GF(2^4) analogue. GF(2^4)
      MixColumns is a DIFFERENT matrix over a DIFFERENT field and the goal record
      already warns that the GF(2^2) analogue is additionally not MDS. A
      composition law measured in the analogue is a fact about the analogue and
      transfers only as a stated heuristic.
    - >-
      DEFINITIONAL DRIFT ON "INDEX". [F^4 : W_S + K] counts cosets in the
      translation group; a reader may expect the index of the confinement
      relation inside F^4 x F^4, or the index of pi(W_S) inside X. All three are
      computed and reported, not one.
    - >-
      SELECTION OF WITNESSES. The two named kernels were chosen because they sit
      at the ends of the identity. Reporting only them would be selection; the
      seeded census exists precisely so the distribution is reported alongside.
    - >-
      AUTHORSHIP ASYMMETRY. Closing a residual the campaign itself ranked first
      is cheap to produce and reads as progress. The positive control and the
      REPAIRS_INDUCTION falsifier exist so that the negative outcome costs
      something to reach.

  interpretation_limits:
    - >-
      NOTHING HERE IS A CLAIM ABOUT AES AT ANY ROUND COUNT. It is a statement
      about an algebraic object class defined inside this campaign. It is not a
      distinguisher, not a key recovery, not a barrier statement about AES
      security, and it may not be cited toward any of those.
    - >-
      ONE INTERFACE, F-LINEAR ONLY. The identity is proved for one super-box
      interface and for F-linear pi. It says nothing about non-linear pi, nothing
      about the composed object, and nothing about what happens once SubBytes is
      interposed. DEC-20260731-029 already forbids carrying Proposition 806-1
      beyond one interface; the same restriction binds this record and is
      inherited deliberately.
    - >-
      A NEGATIVE OUTCOME CLOSES ROUTE 2 ONLY. Routes 1 (a composing metric) and
      3 (argue at one interface) of section 3.3 are untouched, and route 1's
      requirement -- a metric d on X whose degradation is subadditive across
      composition -- remains OPEN and is named here as the successor.
    - >-
      NO STATUS CHANGE is proposed for PROP-701-I, Proposition 806-1, Proposition
      801-1, or any defect. Those are Coordinator decisions.

  heuristic_assumptions:
    - id: HEUR-947-1
      statement: >-
        NONE LOAD-BEARING FOR THE IDENTITY. iota * B = q^(4 - dim K) is an exact
        consequence of the dimension formula dim(A + B) = dim A + dim B
        - dim(A int B) together with dim W_S = s, and is proved rather than
        assumed. This entry exists to record that the headline is UNCONDITIONAL,
        in contrast with everything in TASK-20260801-806 section 5, which
        DEC-20260731-029 struck.
      rigorous_support: >-
        Elementary linear algebra over a field, plus invertibility of M.
      validation_plan: >-
        Exhaustive recomputation at the two named witnesses and a seeded census;
        symbolic re-derivation at stage 0. Not a distributional validation and
        not presented as one.
    - id: HEUR-947-2
      statement: >-
        COMPOSITION HEURISTIC, LOAD-BEARING ONLY FOR STAGE 3 AND NOWHERE ELSE.
        The composed confinement translation set across n interfaces contains
        the intersection of the per-interface sets pulled back through the
        intervening maps, so iota^(n) <= iota^n in the M-affine model.
      rigorous_support: >-
        Immediate for affine composition (the pullback of a subgroup is a
        subgroup and the index of an intersection is at most the product of the
        indices). NOT SUPPORTED for the M-nonlinear model, where pi . SB is not
        F-linear and the pullback need not be a subgroup at all. That gap is
        RT-3 horn (b) and is stated rather than papered over.
      validation_plan: >-
        Stage 3, both composition models, n = 1..5, GF(2^4) analogue,
        exhaustively over dim-1 kernels. FALSIFYING OUTCOME: any n with
        iota^(n) > iota^n in M-affine, or any disagreement between the two models
        at n = 2.

