idea:
  id: IDEA-20260805-1775f2
  question_id: RQ-RSA-afe33c
  goal_id: GOAL-RSA-001
  added: '2026-08-05'
  title: >-
    The wiring exponent is the whole disagreement: a one-parameter family
    c(theta) of GNFS full-cost exponents that reproduces (64/9)^(1/3) at
    theta = 0 and (625/81)^(1/3) = 1.9761 at theta = 1/2, and supplies the
    Wiener-3D value (2401/324)^(1/3) = 1.9496 this program's own charging
    convention forces and has never computed
  class: theory

  claim: >-
    The corpus's "unreconciled" disagreement between core-year extrapolations
    and area-time costing of the number field sieve is not a disagreement about
    facts. It is a single free parameter. Charge the shared memory S of the
    linear-algebra stage as S^theta (theta = 0: memory free; theta = 1/3:
    Wiener three-dimensional wiring, the convention KN-TECH-035 and KN-TECH-057
    already bind this program to; theta = 1/2: two-dimensional area-time, the
    convention Bernstein-Lange batch NFS is reported to use), hold the relation
    -collection stage storage-free, and re-optimize the GNFS parameters. Then
    the full-cost exponent is the single closed form

      c(theta)^3 = 4 (2 + theta)^4 / (9 (1 + theta)^2),

    with optimal smoothness exponent beta(theta)^3 = 4(2+theta)/(9(1+theta)^2)
    and optimal degree parameter delta(theta)^3 = 12(1+theta)/(2+theta)^2. The
    family reproduces the two endpoints the corpus currently holds as
    conflicting authorities and interpolates between them, so the honest
    adjudication is not "which is right" but "which theta does the record data
    support, and what does the program's own declared convention already commit
    it to". No factorization is attempted, no break is claimed, and nothing
    here is a statement about a deployed key.

  object_first_candidate:
    tracked_object: >-
      The MEMORY-ACCESS EXPONENT theta, followed through the NFS parameter
      optimization from the storage of the sparse relation matrix, through the
      block-Wiedemann iteration count, into the smoothness-bound balance, and
      out as an exponent in L-notation. It is not a quantity of the algorithm.
      It is a quantity of the COST CONVENTION, and the object being tracked is
      what the convention does to the algorithm's optimal parameters. That is
      the point: the program has two conventions in its corpus and no map
      between them.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this proposal, so that the
      candidate cannot regress into a variant of a known factoring attack
      arriving in new notation - polynomial selection improvements; lattice
      sieving and its special-q variants; ECM, p-1, p+1 and other
      smooth-order methods; special NFS and hidden-SNFS trapdoors (those are
      GOAL-ECTD-001's, per this goal's non_duplication block); Coppersmith
      small-root / partial-key-exposure attacks; implementation and side
      -channel attacks; quantum period finding. This proposal proposes NO
      attack and NO improvement to any of them. It is an audit of the cost
      convention under which all of them are compared.
    newness_score: >-
      The derivation TECHNIQUE is textbook: it is the standard Buhler-Lenstra
      -Pomerance smoothness-balance optimization with one extra multiplicative
      factor. No novelty is claimed for it, and the theta = 0 endpoint IS the
      classical GNFS exponent, so reproducing it is a check and not a result.
      What this corpus does not hold, at all, is (a) the one-parameter family,
      (b) the theta = 1/3 value, which is what KN-TECH-035 / KN-TECH-057's own
      declared full-cost convention forces for factoring and which no record in
      this program computes, and (c) the observation that the two "conflicting"
      costings are the same model at two wiring dimensions. A literature sweep
      recorded in this session's ANGLE-BRIEF found no 2025-26 NFS exponent
      work and wrote that up explicitly as "not found in a shallow sweep, NOT
      as saturation"; that caveat travels with this record. Whether the family
      is known outside this corpus is UNRESOLVED and is a Stage-0 check, not an
      assertion.
    testability_score: >-
      Maximal for a theory proposal: every gate is an EXACT RATIONAL IDENTITY.
      c(0)^3 = 64/9, c(1/3)^3 = 2401/324, c(1/2)^3 = 625/81, beta(0)^3 = 8/9,
      delta(0)^3 = 3. These are checkable in exact arithmetic with no floating
      point, no seeds, no solver and no network, and they were fixed in this
      record before any contract was written. A single failed identity kills
      the derivation.
    survival_score: >-
      The object survives the entire optimization, which is unusual and is the
      reason the family exists: theta enters only through the multiplicative
      factor S^theta on one stage, and the optimization is smooth in it, so the
      whole parameter set moves continuously with theta rather than the model
      breaking at some theta. Where it stops surviving is stated: the family
      covers SINGLE-key GNFS only. Batch NFS with early aborts (KN-LIT-2663's
      L^1.704 per key) amortizes across keys and is a different optimization
      that c(theta) does NOT cover.

  mechanism: >-
    DERIVED IN THIS RECORD, IN FULL, AND CHECKED IN EXACT RATIONAL ARITHMETIC
    BEFORE THE RECORD WAS WRITTEN. No step below is taken from a source; the
    two endpoint values are afterwards COMPARED against published numbers, and
    that comparison is the audit, not the derivation.

    NOTATION. Write l = log n for the number n being factored, and
    L[c] = exp((c + o(1)) l^(1/3) (log l)^(2/3)). Let B = L[beta] be the
    smoothness bound (so the factor base and the matrix dimension N are both
    B^(1+o(1))), let A = L[alpha] be the number of (a,b) candidate pairs
    examined, and let the polynomial degree be d + 1 = delta (l / log l)^(1/3).

    STEP 1 - NORM SIZE. With m = n^(1/(d+1)) the common root, the product of
    the two norms attached to a pair (a,b) with |a|,|b| <= A^(1/2) is of size
    A^((d+1)/2) n^(2/(d+1)) up to lower-order terms. Taking logarithms,
      log(norm product) = (alpha delta / 2 + 2 / delta) l^(2/3) (log l)^(1/3).

    STEP 2 - SMOOTHNESS. With u = log(norm product) / log B and the
    Canfield-Erdos-Pomerance estimate u^(-u) for the probability that a random
    integer of that size is B-smooth (HEUR-NFS-1 below; the norms are not
    random integers and this is the standard, load-bearing NFS heuristic),
      u = (alpha delta / 2 + 2 / delta) / beta . (l / log l)^(1/3),
      u^(-u) = L[ - (alpha delta / 2 + 2 / delta) / (3 beta) ].

    STEP 3 - RELATION CONDITION. About B relations are needed to get a kernel,
    so A . u^(-u) = B, i.e.
      (i)   alpha - (alpha delta / 2 + 2 / delta) / (3 beta) = beta.

    STEP 4 - THE TWO STAGE COSTS, WITH MEMORY CHARGED IN EXACTLY ONE OF THEM.
    Relation collection examines A candidates with O(1) live state per
    processor (a bounded sieve region, or a streamed ECM cofactorization), so
    its full cost equals its step count, L[alpha], for every theta. This is
    HEUR-NFS-2 and it is the load-bearing modelling choice; it is the same
    choice KN-TECH-057 makes when it gives van Oorschot-Wiener collision
    search a clock cycle tau = O(1) because per-processor storage is O(1).
    The linear algebra runs block Wiedemann on a sparse N x N matrix of
    average row density d_row = L[o(1)], so its step count is N^2 d_row =
    L[2 beta], and it holds a SHARED object of size S = N d_row = L[beta]. Its
    full cost is therefore L[2 beta] . L[beta]^theta = L[(2 + theta) beta].

    STEP 5 - BALANCE AND OPTIMIZE. The two stage costs are balanced at the
    optimum, (ii) alpha = (2 + theta) beta. Substituting (ii) into (i) and
    clearing denominators gives the quadratic
      3 (1 + theta) beta^2 - ((2 + theta) delta / 2) beta - 2 / delta = 0,
    whose positive root is
      beta = [ (2+theta) delta / 2
               + sqrt( (2+theta)^2 delta^2 / 4 + 24 (1+theta) / delta ) ]
             / ( 6 (1 + theta) ).
    Minimizing over delta: setting d beta / d delta = 0 and squaring once gives
      (iii)  delta^3 = 12 (1 + theta) / (2 + theta)^2.
    At (iii) the surd collapses exactly - the radicand becomes
    (2+theta)^2 delta^2 / 4 + 2 delta^2 (2+theta)^2 = (9/4) delta^2 (2+theta)^2
    - so sqrt(...) = (3/2) delta (2 + theta) and
      (iv)   beta(theta) = delta(theta) (2 + theta) / (3 (1 + theta)),
      (v)    c(theta)   = (2 + theta) beta(theta).
    Cubing (iv) and (v) with (iii) removes every radical:
      beta(theta)^3 = 4 (2 + theta) / (9 (1 + theta)^2),
      c(theta)^3    = 4 (2 + theta)^4 / (9 (1 + theta)^2).
    An independent consistency check that is NOT a restatement: substituting
    (iii) and (iv) back into the quadratic reduces it to
    delta^3 (2+theta)^2 / (6(1+theta)) = 2, which is (iii) again - the
    stationarity condition and the relation condition close on each other, and
    a derivation that gets either one wrong will not close.

    STEP 6 - THE THREE POINTS THE CORPUS ALREADY HOLDS.
      theta = 0    : delta^3 = 3, beta^3 = 8/9, c^3 = 64/9, c = 1.922999.
                     This IS the classical GNFS exponent (64/9)^(1/3). The
                     derivation reproducing it exactly is the KN-TECH-080
                     audit-1 baseline reproduction, and it is symbolic, not a
                     curve that resembles a plot.
      theta = 1/3  : delta^3 = 144/49, beta^3 = 7/12, c^3 = 2401/324,
                     c = 1.949616. THIS NUMBER APPEARS NOWHERE IN THIS CORPUS.
                     It is what KN-TECH-035's Wiener three-dimensional wiring
                     model - the convention this program already declares for
                     ECDLP and applies in KN-TECH-057 - forces for integer
                     factorization.
      theta = 1/2  : delta^3 = 72/25, beta^3 = 40/81, c^3 = 625/81,
                     c = 1.976052. KN-LIT-2663 (Bernstein-Lange, batch NFS)
                     is relayed in this corpus as stating that "the best
                     area-time product known for a single key is
                     L^1.976...+o(1)". THE DERIVED VALUE AND THE RELAYED VALUE
                     AGREE TO EVERY DIGIT THE RELAYED FIGURE CARRIES.

    STEP 7 - WHAT THE AGREEMENT AT theta = 1/2 IS AND IS NOT. It is either
    (a) an independent reproduction of a published exponent from a model built
    here without reading the paper, which would make c(theta) a verified
    interpolation and would upgrade a bulk-seeded corpus entry whose own
    "Not verified here" block says its claims are relayed from an abstract; or
    (b) a coincidence of two different models landing on the same three
    digits. This record does NOT assert (a). Disambiguating (a) from (b)
    requires reading the primary text and is Stage 0 of the paired experiment.
    Recording the possibility of (b) is not throat-clearing: a match to three
    digits from a one-line model is exactly the kind of thing that gets
    over-read.

    STEP 8 - THE SECOND, INDEPENDENT CONSEQUENCE. beta(theta) is strictly
    DECREASING in theta: 0.961500, 0.891057, 0.861774, 0.835550, 0.811895,
    0.790421 at theta = 0, 1/6, 1/4, 1/3, 5/12, 1/2. Charging memory does not
    merely raise the cost, it moves the OPTIMAL PARAMETERS - a charged model
    prefers a smaller factor base, a smaller matrix and more sieving. That is a
    directional, falsifiable statement about how record computations should
    have been parameterized if their operators were implicitly charging
    memory, and it is the bridge from this asymptotic record to the record
    -calibration proposal IDEA-20260805-72bcb5.

  novelty_status: unverified

  literature_context:
    - >-
      KN-LIT-2663, "Batch NFS", Bernstein and Lange. NOT READ. The entry in
      this corpus is a 2026-07-24 bulk-seeded record whose own "Not verified
      here" block states that title, authors, year and venue were parsed
      heuristically and that "claims are relayed from the paper's abstract
      without independent verification"; year, venue and all four identifier
      fields are null, and its "Relevance to this program" paragraph is about
      MOV/Frey-Ruck and GLV/GLS, which is the same paste-error pattern the
      ANGLE-BRIEF documents for KN-LIT-2701. The figures used above as
      COMPARISON TARGETS and not as authorities are, verbatim from that entry:
      batch circuit area L^1.181...+o(1) factoring L^0.5+o(1) keys in time
      L^1.022...+o(1); price-performance L^1.704...+o(1) per key; "the best
      area-time product known for a single key is L^1.976...+o(1)". Only the
      last of these is used here, and only as the thing the derivation is
      checked against.
    - >-
      RECALLED, UNVERIFIED, AND A CANDIDATE TO CHECK RATHER THAN A CITATION:
      the L^1.976 single-key area-time figure is associated in model memory
      with Bernstein's circuit-based re-costing of NFS, in which the naive
      area-time cost of NFS is reduced by re-optimizing the smoothness bound.
      No title, year, venue or theorem number is asserted, because none was
      read. If the association is right, the theta = 1/2 endpoint is that
      result and the family's endpoint agreement is corroboration; if it is
      wrong, the endpoint agreement is unexplained and MORE interesting, not
      less. Stage 0 settles it.
    - >-
      KN-TECH-035 (full-cost accounting; charging memory, wiring and
      communication) and KN-TECH-057 (full-cost matched baselines for
      supersingular path-finding) are READ, in-corpus, and are what commit this
      program to theta = 1/3 rather than theta = 0. KN-TECH-035 states the
      three-dimensional wiring result that BSGS needs n^(1/2) processor steps
      but has full cost n^(2/3+o(1)); KN-TECH-057 applies exactly that to
      MITM, Delfs-Galbraith and van Oorschot-Wiener. KN-TECH-035's own text
      names index calculus as the family the model "bites hardest" on, and says
      the linear-algebra phase is memory-bound rather than compute-bound. The
      analogue for factoring is precisely what this proposal computes and what
      GOAL-RSA-001 exists to supply.
    - >-
      KN-LIT-094 (Wiener, the full-cost / three-dimensional wiring source) is
      NOT READ HERE; it is cited only through KN-TECH-035 and KN-TECH-057,
      which are in-corpus technique entries. The exponent 1/3 in "S^(1/3)" is
      taken from those entries' own statements, not from the primary text.
    - >-
      KN-LIT-3007, "Comparing the difficulty of factorization and discrete
      logarithm: a 240-digit experiment" (Thome, Zimmermann). NOT READ. Also a
      2026-07-24 bulk-seeded entry with null year/venue/identifiers and the
      same "claims are relayed from the paper's abstract" caveat, and its
      "Relevance to this program" paragraph is likewise boilerplate about
      elliptic curves. It is the record source this family must eventually be
      calibrated against, and IDEA-20260805-72bcb5 owns that calibration.
    - >-
      Classical GNFS heuristic complexity L[1/3, (64/9)^(1/3)] is stated in
      this corpus and is universally known; no citation is fabricated for it,
      and the derivation above reproduces it rather than assuming it.

  lossy_projection_identifiability_audit:
    projection: >-
      The whole cost model of a number field sieve computation - polynomial
      selection, sieving implementation, cofactorization strategy, filtering
      and merge, block Wiedemann blocking parameters, interconnect topology,
      cache behaviour, and every constant - projected onto the SINGLE REAL
      NUMBER theta, the exponent with which the shared linear-algebra memory
      is charged.
    what_is_discarded: >-
      Everything except one number. All constants, all polylogarithmic
      factors, the entire o(1), the filtering stage, the polynomial-selection
      stage, the choice of sieving algorithm, and every hardware detail.
    why_genuinely_lossy: >-
      Enormously lossy, and the fibre over a given theta is the entire space
      of implementations. This is the extreme of the discard axis.
    why_compatible_with_the_operations: >-
      Compatible because theta enters the optimization multiplicatively on
      exactly one stage cost, and the optimization is a smooth minimax over
      (alpha, beta, delta). The retained part therefore propagates
      deterministically: given theta, the closed forms (iii), (iv), (v) return
      a single triple with no residual freedom. That is what makes the
      projection an object rather than a summary statistic.
    is_it_only_a_change_of_coordinates: >-
      NO, and the check that establishes it is the one the mirror failure mode
      demands. THE FAILURE CHECKED FOR HERE IS THE MIRROR FAILURE - a
      projection so lossy that it is CONSTANT across instances, giving zero
      comparator spread, which is the failure IDEA-20260805-e805b6 documents
      for the determinant-ideal observable. The check RETURNS NON-CONSTANT:
      c(0) = 1.922999, c(1/3) = 1.949616, c(1/2) = 1.976052, c(1) = 2.080084,
      strictly increasing, with strictly increasing increments (0.007624,
      0.008368, 0.010625, 0.012463, 0.013973 across theta = 0, 1/6, 1/4, 1/3,
      5/12, 1/2). The comparator spread is nonzero and monotone, so the
      statistic is not a constant of the apparatus. The OTHER failure - the
      (Delta, Pi) = (x xor y, x.y) failure in characteristic 2, where nothing
      is discarded so nothing is gained - is not the live risk here, because
      the projection manifestly destroys information; it is recorded as
      checked and not applicable rather than silently omitted.
    residual_risk: >-
      The real risk is the opposite of both: that theta is not a property of
      the WORLD at all but only of the modelling convention, so that "which
      theta is right" has no fact of the matter. The proposal treats that as a
      live possibility and is designed so that the answer "the record data does
      not determine theta" is a reportable outcome rather than a failure.

  predictions:
    - metric: >-
        Exact rational value of c(0)^3 obtained by independently re-running the
        Step 1-5 optimization symbolically
      direction: different
      minimum_effect: >-
        EXACTLY 64/9. Not "approximately 7.11", not "within 1 per cent": the
        exact rational 64/9. Derived before any contract exists. If the
        re-derivation returns anything else, the classical GNFS exponent is not
        reproduced, the whole family is wrong, and the line terminates at zero
        compute. This is the single cheapest falsifier available.
    - metric: Exact rational value of c(1/2)^3
      direction: different
      minimum_effect: >-
        EXACTLY 625/81 = 7.716049..., i.e. c = 1.976052. The pre-registered
        comparison target is the relayed KN-LIT-2663 figure 1.976...+o(1). A
        match to the three digits the relayed figure carries is a PASS; any
        mismatch in those three digits is a FAIL and must be reported as
        either a derivation error or a transcription error in KN-LIT-2663,
        with the two distinguished by reading primary text.
    - metric: Exact rational value of c(1/3)^3
      direction: different
      minimum_effect: >-
        EXACTLY 2401/324 = 7.410494..., i.e. c = 1.949616. There is no
        published comparison target for this value in this corpus; it is a
        prediction of the family and its only pre-run check is internal
        consistency with the closed form and with the monotone ladder.
    - metric: >-
        Optimal smoothness exponent beta(theta) evaluated on the ladder
        theta in {0, 1/6, 1/4, 1/3, 5/12, 1/2}
      direction: lower
      minimum_effect: >-
        STRICTLY DECREASING, with the exact cubes 8/9, 104/147, 16/25, 7/12,
        464/867, 40/81 and values 0.961500, 0.891057, 0.861774, 0.835550,
        0.811895, 0.790421. A non-monotone ladder falsifies the closed form.
        Note beta(0)^3 = 8/9 is the classical (8/9)^(1/3), a second independent
        baseline anchor.
    - metric: >-
        Full cost of Shanks baby-step giant-step re-derived under the identical
        S^theta charging rule at theta = 1/3 (POSITIVE CONTROL, different
        algorithm, known answer)
      direction: different
      minimum_effect: >-
        EXACTLY n^(2/3). Step count n^(1/2), storage n^(1/2), full cost
        n^(1/2) . (n^(1/2))^(1/3) = n^(2/3). KN-TECH-035 states this result
        independently as Wiener's. IF THE MACHINERY DOES NOT RETURN n^(2/3)
        HERE, THE INSTRUMENT IS BROKEN AND NO CONCLUSION ABOUT NFS MAY BE
        REPORTED AT ALL.
    - metric: >-
        c(theta) for a hypothetical NFS variant whose linear-algebra stage
        holds O(1) shared state per processor (NULL OBJECT)
      direction: different
      minimum_effect: >-
        EXACTLY (64/9)^(1/3) FOR EVERY theta, i.e. theta-independent. This null
        CAN FAIL: if the algebra leaks a theta-dependence into a stage that
        stores nothing, the optimization has been mis-set-up and the treatment
        numbers are uninterpretable.

  minimal_test:
    design: >-
      Four stages, cheapest first, every one able to terminate the line, and
      the first two requiring no network, no solver, no seeds and no floating
      point. STAGE 0 (reading, zero compute, and the one stage this goal's
      next_action makes mandatory before design): obtain primary text for the
      record announcements and for the area-time source, and record whether the
      1.976 figure is what KN-LIT-2663 actually says. STAGE 1 (exact rational
      arithmetic, seconds): re-derive Steps 1-5 independently and evaluate the
      six-point theta ladder plus the null and the BSGS positive control, in
      Fraction arithmetic, comparing exact rationals rather than decimals.
      STAGE 2 (arithmetic on record data, seconds, and only if Stage 0
      succeeded): the beta-direction check - is the factor base actually chosen
      in the record computations below the theta = 0 optimum, as a charged
      model predicts. STAGE 3 (writing): the adjudication statement, which is
      the goal's completion criterion 2, in the form "the record data supports
      theta in [x, y]" or "the record data does not determine theta", with the
      second outcome pre-authorized as a result.
    controls:
      - >-
        NULL OBJECT, SAME SHAPE, FORCED VALUE DERIVED PRE-RUN, CAN FAIL. An
        NFS variant identical in every respect except that its linear-algebra
        stage stores O(1) shared state (a hypothetical streamed-matrix
        Wiedemann that regenerates each row from the relation on the fly). Its
        S is L[o(1)], so S^theta = L[o(1)] and the optimization must return
        c = (64/9)^(1/3) and beta = (8/9)^(1/3) FOR EVERY theta. This is the
        matched null the ANGLE-BRIEF's T-A template asks for and the one that
        166 of 229 evidence records in this program do not have.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR. Shanks
        BSGS under the identical S^theta rule must return n^(1/2) at theta = 0
        and n^(2/3) at theta = 1/3, the second being a result KN-TECH-035
        states independently. If the machinery cannot reproduce the program's
        own established full-cost result on the simplest possible algorithm,
        the instrument is broken and no negative may be reported.
      - >-
        SECOND POSITIVE CONTROL, EXTERNAL. c(1/2) must land on the relayed
        KN-LIT-2663 single-key area-time figure. Unlike the BSGS control this
        one can fail for two distinct reasons (derivation wrong, or relayed
        figure wrong) and the contract requires both to be reported rather
        than the convenient one selected.
      - >-
        GRADED CONTROL, SIX POINTS, FOUR OF THEM INTERIOR, MONOTONICITY
        REPORTED. theta in {0, 1/6, 1/4, 1/3, 5/12, 1/2}: c must increase
        strictly and beta must decrease strictly, with the exact cubes listed
        in predictions. A break in monotonicity localizes the error to a
        specific theta interval instead of leaving "the closed form did not
        work".
      - >-
        ORDERING CONTROL. The null value and both positive-control values are
        computed, written down and hash-committed BEFORE the theta = 1/3
        treatment value is computed or looked at.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Search the corpus for any prior
        computation of an NFS full-cost exponent under a charged memory model.
        RESULT AS OF WRITING: none found (KN-TECH-035 names index calculus as
        the affected family but computes no factoring exponent; KN-TECH-057
        does the isogeny analogue; KN-LIT-2663 is relayed and unread). That
        absence is recorded as an absence, not claimed as a passed check -
        absence of a search result is not evidence something was not tried.
    required_metrics:
      - exact rational c(theta)^3 and beta(theta)^3 at all six ladder points
      - the null object's c and beta at all six ladder points, computed first
      - BSGS full-cost exponent at theta = 0 and theta = 1/3
      - a verbatim quotation of KN-LIT-2663's single-key area-time figure from primary text, or a recorded statement that it could not be obtained
      - the residual after substituting (iii) and (iv) back into the quadratic, which must be exactly zero

  falsification_conditions:
    - >-
      c(0)^3 is not exactly 64/9. The family does not reproduce the classical
      GNFS exponent and is withdrawn.
    - >-
      beta(0)^3 is not exactly 8/9, or delta(0)^3 is not exactly 3.
    - >-
      The BSGS positive control does not return n^(2/3) at theta = 1/3. No
      negative about NFS may then be reported at all; the finding is that the
      instrument is broken.
    - >-
      The null object returns a theta-dependent exponent. The optimization is
      then mis-specified and every treatment number is uninterpretable.
    - >-
      The ladder is non-monotone in c or in beta.
    - >-
      Primary text shows KN-LIT-2663's single-key area-time exponent is not
      1.976. The theta = 1/2 endpoint agreement is then not corroboration, and
      the record must say which of the two numbers moved.
    - >-
      The relation-collection-is-storage-free assumption (HEUR-NFS-2) is shown
      to be wrong at the sizes that matter - for instance, if the sieve's
      per-processor working set grows like a positive power of B rather than
      being bounded. The family then covers no real machine and must be
      re-derived with theta charged on both stages, which (as noted in
      heuristic_assumptions) gives a materially different and much larger
      exponent.

  confounders:
    - >-
      O(1) TERMS. Every statement here is an exponent in L-notation with an
      uncontrolled o(1). At 829 bits the o(1) is not small, and NOTHING in
      this proposal licenses a concrete statement about RSA-1024, RSA-2048 or
      RSA-3072. This goal's next_action forbids building that table before the
      record-reproduction gate passes, and this proposal does not build it.
    - >-
      MODEL-FITTING BY CHOICE OF theta. Given a target exponent, one can
      always solve c(theta) = target for theta. That makes the family
      unfalsifiable IF theta is treated as free. It is not: theta = 1/3 is
      forced by this program's own declared convention before any data is
      seen, and the theta = 0 and theta = 1/2 endpoints are fixed by exact
      identities. The contract pre-registers theta = 1/3 as the treatment.
    - >-
      TWO STAGES, ONE CONVENTION. Charging memory on the linear algebra but
      not on relation collection is a modelling choice with real content
      (HEUR-NFS-2). If instead BOTH stages are charged S^theta with S = B, the
      balance reverts to alpha = 2 beta, beta returns to (8/9)^(1/3), and the
      full cost becomes (2 + theta)(8/9)^(1/3) - which is 2.2435 at theta =
      1/3 and 2.4038 at theta = 1/2, NEITHER of which matches the relayed
      1.976. That the asymmetric charging is the one that reproduces the
      published endpoint is itself evidence about which modelling choice the
      literature makes, and it is reported as such rather than assumed.
    - >-
      FILTERING AND MERGE ARE NOT IN THE MODEL. The relation-to-matrix funnel
      has its own cost and its own memory footprint, and it is charged nowhere
      here. It is L[o(1)]-many passes over L[beta]-much data, so it does not
      change the exponent under the stated assumptions - but "does not change
      the exponent" is exactly the kind of claim that hides a real cost, and
      it is flagged rather than defended.
    - >-
      ATTRACTIVENESS OF A CLEAN ANSWER. "The disagreement is one parameter" is
      a satisfying story and satisfying stories get over-read. The null, the
      two positive controls and the graded ladder exist so that the story
      costs something to reach.

  interpretation_limits:
    - >-
      This is a statement about a COST MODEL and about nothing else. It is not
      a factorization, not an attack, not an improvement to NFS, and not a
      statement about the security of any deployed RSA key. RQ-RSA-afe33c's
      claim_tier_ceiling is binding and is repeated here.
    - >-
      SINGLE-KEY ONLY. c(theta) does not cover batch NFS, early-abort ECM
      smoothness detection, or any amortized-across-keys regime. KN-LIT-2663's
      L^1.704 per key is in that other regime and is NOT a point on this
      curve. Any comparison between them would be a category error.
    - >-
      A theta = 1/3 exponent of 1.9496 against theta = 0's 1.9230 is a 1.4 per
      cent change in an exponent that sits inside a triple exponential. It is
      not a security-relevant re-costing on its own and must never be
      presented as one. Its value is that the program can now state WHICH
      convention it is using and what that convention costs, instead of
      inheriting an unstated one.
    - >-
      Nothing here resolves whether the real machines used in record
      computations behave like theta = 0, 1/3 or 1/2. That is an empirical
      question about interconnects and it is deliberately left open, with the
      route to it named (IDEA-20260805-72bcb5).

  heuristic_assumptions:
    - id: HEUR-NFS-1
      statement: >-
        (Canfield-Erdos-Pomerance / Dickman, as applied by every NFS analysis.)
        For the pairs (a,b) enumerated by the sieve, the probability that the
        product of the two norms - an integer of size exp(u log B) - is
        B-smooth is u^(-u(1+o(1))), the same as for a uniformly random integer
        of that size. Formally: for all fixed epsilon > 0 there is n_0 such
        that for all n > n_0 and all (alpha, beta, delta) in the compact
        parameter region considered, the relation yield differs from
        A . u^(-u) by a factor L[o(1)].
      rigorous_support: >-
        The CEP theorem is a rigorous statement about UNIFORMLY RANDOM
        integers. The norms are not uniformly random integers: they are values
        of two homogeneous forms on a lattice region, and they have systematic
        divisibility biases (the algebraic side is biased toward primes that
        split in the number field). The standard NFS response is that these
        biases contribute only to the o(1). NO RIGOROUS SUPPORT FOR THAT
        RESPONSE IS OFFERED HERE, and none is claimed. This is the single
        load-bearing heuristic of the entire NFS complexity analysis, it is
        assumed by every published NFS exponent including the (64/9)^(1/3)
        this record reproduces, and it is stated rather than hidden.
      validation_plan: >-
        NOT validated by this proposal, and it does not need to be, because
        the DIFFERENCE between c(theta) and c(0) does not depend on it: the
        heuristic enters both identically through Step 2 and cancels in any
        comparison across theta. That cancellation is itself a checkable claim
        and is a Stage-1 item. Independent validation would require measuring
        smoothness yield against Dickman rho on real NFS norms, which is a
        separate experiment and is explicitly out of scope here.
    - id: HEUR-NFS-2
      statement: >-
        (Storage asymmetry.) The relation-collection stage of NFS can be run
        with per-processor live storage bounded by a function of the machine
        rather than of B, so its area-time cost equals its step count L[alpha]
        for every theta; the linear-algebra stage cannot, because block
        Wiedemann's iterates are global and the matrix is a single shared
        object of size S = L[beta]. Formally: there exists a scheduling of
        relation collection such that for all theta in [0, 1], full-cost
        exponent of relation collection = alpha; and for all schedulings of
        block Wiedemann, full-cost exponent of linear algebra >= 2 beta +
        theta beta.
      rigorous_support: >-
        The first half is architectural rather than proved: lattice sieving
        processes a bounded region per special-q, and ECM-based
        cofactorization carries O(1) state per candidate, so neither needs a
        working set growing with B. The factor base itself must be reachable,
        and if it must be REPLICATED across P processors the area becomes
        P . B and the argument fails - this is the specific hole, it is named,
        and it is not papered over. The second half is the same argument
        KN-TECH-057 uses in reverse to give MITM a tau = S^(1/3) penalty and
        van Oorschot-Wiener tau = O(1).
      validation_plan: >-
        Falsifiable at Stage 0 by reading what the record computations
        actually did: if the reported sieving deployments carried per-node
        working sets that scale with the factor base, HEUR-NFS-2 is wrong at
        real scale. Also falsifiable analytically by the alternative charging
        computed under confounders, which yields 2.2435 at theta = 1/3 and
        2.4038 at theta = 1/2 - neither of which reproduces the relayed 1.976,
        which is weak evidence FOR the asymmetric charging and is reported
        with that weakness attached.
    - id: HEUR-NFS-3
      statement: >-
        (Density and matrix dimension.) After filtering and merge, the matrix
        dimension N and the factor-base size B satisfy N = B^(1+o(1)), and the
        average row density d_row is L[o(1)].
      rigorous_support: >-
        Standard and structurally forced (the matrix has one column per
        factor-base element, and filtering only removes rows and columns). The
        density claim is the weak half: at RSA-250 the post-merge density is
        relayed as 252, which is not small, and treating it as L[o(1)] is an
        asymptotic convenience that hides a factor of a few hundred at every
        reachable size.
      validation_plan: >-
        Stage 2 of the paired contract records the actual N, B and d_row from
        primary text and states the concrete factor being hidden, rather than
        asserting it is negligible.

  target_complexity:
    time_exponent: >-
      The exponent being MOVED is the accounting exponent of GNFS, from
      c = (64/9)^(1/3) = 1.9230 under free memory to c = (2401/324)^(1/3) =
      1.9496 under the three-dimensional wiring convention this program has
      already adopted, with (625/81)^(1/3) = 1.9761 at the two-dimensional
      area-time convention. STATED PLAINLY: this moves no exponent of the
      FACTORING PROBLEM. It moves the exponent of the COST MODEL, which is
      what a baseline is. The proposal does not make factoring easier or
      harder; it makes the program able to say which number it is quoting.
    memory_exponent: >-
      L[beta(theta)] for the shared matrix. beta drops from 0.9615 to 0.8356
      (theta = 1/3) to 0.7904 (theta = 1/2) as memory is charged, which is the
      time-memory tradeoff of the model stated as an exponent rather than as a
      remark: a charged model buys its lower memory exponent with more
      sieving.
    best_known: >-
      L[1/3, (64/9)^(1/3)] heuristic time for GNFS with memory uncharged.
      Under area-time the relayed best single-key figure is L^1.976 and the
      relayed batch figure is L^1.704 per key at circuit area L^1.181, both
      from KN-LIT-2663 and both NOT READ.
    hidden_overhead: >-
      The entire o(1), which at 829 bits is not small; the filtering and merge
      stage, charged nowhere; the polynomial-selection stage, charged nowhere;
      the post-merge density 252, treated as L[o(1)]; and the constant in the
      wiring model, which KN-TECH-035's own applicability-limits section says
      is asymptotic with unextracted constants.
    tradeoff_note: >-
      beta(theta) IS the tradeoff curve: it is the memory exponent chosen
      optimally as a function of how memory is priced. Reporting c without
      beta would be exactly the time-only reporting this goal exists to stop.

  dominated_by: >-
    n/a (no algorithm proposed, no Pareto point claimed). Rows checked before
    writing that: for a FASTER factoring algorithm - none is proposed, so
    nothing can dominate it. For the QUESTION of what the NFS full-cost
    exponent is: the frontier rows checked are (a) L[1.9230] time with memory
    uncharged, the classical GNFS figure, which dominates on time and is
    silent on memory; (b) L[1.976] single-key area-time, relayed from
    KN-LIT-2663, which is the theta = 1/2 endpoint of this very family and so
    is not a competitor but a member; (c) L[1.704] per key at area L^1.181 for
    BATCH NFS, relayed from the same entry, which dominates on price
    -performance per key but is a different problem (many keys at once) and is
    explicitly not comparable; (d) this program's own charged-cost technique
    entries KN-TECH-035, KN-TECH-044, KN-TECH-050 and KN-TECH-057, checked for
    an existing factoring exponent - none contains one; (e) the data/queries
    axis, which is degenerate for factoring (the input is one integer and
    there are no oracle queries), stated so that the axis is recorded as
    checked rather than silently dropped. No row was found that both charges
    memory and states a single-key NFS exponent other than the family's own
    endpoints.
  sota_delta: >-
    Quantitatively: +0.0266 in the L-exponent from 1.922999 to 1.949616 when
    the program's declared full-cost convention is applied to factoring
    (+1.38 per cent), and -0.1260 in the optimal smoothness exponent from
    0.961500 to 0.835550 (-13.10 per cent), the latter being the larger and
    more checkable effect. Against the area-time endpoint the numbers are
    +0.0531 (+2.76 per cent) in c and -0.1711 (-17.79 per cent) in beta.
    Against the state of the art in ATTACK terms the delta is exactly zero on
    every axis - time, memory, data, queries, preprocessing - because no
    attack is proposed.

  estimated_cost:
    implementation: low
    compute: none
  recommended_priority: high
  honest_prior_of_survival: >-
    0.80 that the exact-identity gates pass and the family stands as derived.
    It is not higher because (a) the theta = 1/2 endpoint agreeing with a
    relayed, unread, bulk-seeded figure could be coincidence and the corpus
    entry it matches is demonstrably corrupted in its metadata, (b) HEUR-NFS-2
    is an architectural argument rather than a proof and the alternative
    charging gives a materially different answer, and (c) the derivation was
    done in one sitting and the standard NFS optimization has several
    conventions for where the sieving region size enters. It is not lower
    because the theta = 0 endpoint reproduces (64/9)^(1/3), (8/9)^(1/3) and
    delta^3 = 3 EXACTLY as rationals rather than approximately, because the
    stationarity condition and the relation condition close on each other
    (a coincidence that a wrong derivation would have to arrange), and because
    the gates are exact rational identities with no fitted quantity anywhere.
    Separately: 0.30 that the record data will turn out to determine theta at
    all, and that low number is why the contract pre-authorizes "the record
    data does not determine theta" as a reportable result.
