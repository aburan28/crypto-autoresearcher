    and my own L1.yaml. WEB NOT SCREENED (tool failure).'
  discriminated_from: IDEA-20260805-5194f9 observes the incommensurable arms; this constructs
    the arm that connects them. My own L1.yaml L1-07 proposed a BDD-with-preprocessing frontier
    for the same problem using RECALLED external exponents; this record replaces that with
