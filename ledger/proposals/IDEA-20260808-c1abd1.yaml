  lossy_projection_test: 'PASSES. Tracked object: the pair (required challenge c, produced
    hash output c'') — two elements of B_tau, discarding the entire lattice vector and the
    entire message. The fibre over a matching pair is the whole set of decodings and messages
    producing it. Discarded compatibly, because the SelfTargetMSIS success predicate is exactly
    the equality of those two elements, and both propagate deterministically (c through the
    decoding, c'' through H). Tracking the full (y, mu) loses nothing and is the incumbent.'
  proof_search_map:
    bottleneck: Whether the BKZ reduction is paid once or once per candidate challenge.
    baseline_embedding:
      parameter_slice: L = 1 recovers the published min-of-two-arms exactly.
      reproduction_check: A frozen fixture asserting equality at L = 1 to the bit.
    observation_collision:
      observable: Total charged cost.
      distinct_preimage_search: Many (L, Q_H) pairs give equal total cost, so total cost never
        identifies an operating point; the deliverable must be the curve plus the memory cap.
    constructive_transforms:
    - transform: specialization_pack
      proposed_object: The (L, Q_H) claw curve for the fixed-lattice/moving-target structure.
      predicted_gain: Lattice arm charged once rather than L times.
    quantifier_order: FOR ALL FIPS 204 parameter sets, THERE EXISTS (L, Q_H) with L*Q_H ~
      |B_tau| such that the composed cost is below the published minimum — with the decoding
      success probability p NOT permitted to depend on the individual challenge.
    method_ceiling:
      strongest_certifiable_claim: An arithmetic statement about a composed cost model under
        a pinned SVP oracle cost.
      nearby_object_control: A variant in which each candidate needs its own reduction must
        show g = 0; if it does not, the arithmetic is charging a resource that is not there.
    proof_obligations:
    - claim: Decoding cost is negligible against reduction cost.
      responsibility: runtime
    - claim: Decoding meets the l-infinity bound with probability p, stated.
      responsibility: success_probability
    - claim: Hash and lattice work are converted to one unit before min/max.
      responsibility: baseline
    - claim: Join memory is charged or the regeneration variant is used.
      responsibility: memory
    not_applicable_reason: null
