  citation_note: >-
    No web search was run. The 2-polynomial reduction in (A) is elementary and
    very likely in the literature on linearised polynomials; the record claims
    only its application as a decomposition-membership primitive on subspace
    and orbit-union bases and the pricing in (B)-(D).

  assumptions:
    - Field arithmetic in F_{2^131} is charged per operation; fast polynomial arithmetic is not assumed (schoolbook bounds are stated).
    - 'OFF-LIMITS COMPONENTS DECLARED: F2 (family), the Riemann-Roch encoding (prior), the subspace polynomial (prior).'
    - Every root returned by a gcd is verified as a root and as a factor-base member by the enumerator on the toy cells.

  proof_search_map:
    bottleneck: >-
      Whether any encoding of the m-summand decomposition on a subspace or
      orbit-union base presents the unknown summands as roots of a
      SMALL-degree univariate residual with a SUB-|F_V|^{m-1} residual count;
      the cheap gcd makes such a residual decisive, and none is known.
    baseline_embedding:
      parameter_slice: >-
        V = F_q inside F_{q^n} (the subfield case): L_V = X^q - X and the
        primitive is the classical gcd(h, X^q - X); m = 3 on ECC2K-130 at
        d = 6 is EV-ICPERF-10c5fc's panel, whose Theta(|F|^2) the last-two-
        summands route must reproduce as a constant.
      reproduction_check: >-
        Symbolic: (A) at V = F_q reduces to X^q mod h. Frozen fixture: on RC-1
        (n = 17, l = 9) the roots of 50 random polynomials h of degree 8 in V
        found by gcd equal the roots found by evaluating h on all 512 elements.
    observation_collision:
      observable: >-
        Field operations per membership decision as a function of (l, D), and
        per-attempt cost of the last-two-summands route versus half-trace
        enumeration.
      distinct_preimage_search: >-
        A flat-in-l cost could be (i) the primitive's genuine independence of
        |V| or (ii) a toy artifact where 2^l is too small to see the
        enumeration cost; separated by sweeping l at fixed D on n = 19 (l up to
        12) and by reporting both costs in the same unit.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Membership of a candidate set given as the root set of h, decided by
          L_V mod h and a gcd. Completeness and soundness: gcd(h, L_V) has
          exactly the roots of h in V. Transfer: any 2-polynomial membership
          (subspace, subfield, orbit union, QSP root set). Cost loss: none;
          the object is unchanged.
        predicted_gain: constant over enumeration on the named encodings (P2); exponent-relevant only if a small residual exists (D).
    quantifier_order: >-
      FOR ALL h and all subspaces V, roots of h in V cost O(l deg(h)^2)
      (unconditional). FOR the last-two-summands residual, deg h = 2^{l+1}
      (unconditional). PREDICTED: at RC-1 and n = 19 the gcd route and the
      enumeration route differ by a bounded constant across l. NOT CLAIMED:
      the existence of any small residual at m >= 5.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Subspace and orbit-union membership of the roots of a degree-D
        polynomial costs O(l D^2) field operations; on a subspace base the
        RR/Nagao encoding at any m is the (m-1)-loop up to a constant measured
        as [value] at n = 17, 19." It certifies nothing about encodings not
        priced here.
      nearby_object_control: >-
        A random 2^l-element SUBSET of F_{2^n} (not a subspace): its membership
        polynomial has 2^l dense terms and the primitive costs 2^l; this is
        where the claim fails by construction and the control that shows the
        2-polynomial structure is load-bearing.
    proof_obligations:
      - claim: L_V is a 2-polynomial with l + 1 terms; sigma^j(V') has subspace polynomial sigma^j(L_{V'}).
        responsibility: correctness
      - claim: L_V mod h costs l squarings modulo h plus l scalar multiplications.
        responsibility: runtime
      - claim: deg Res_Y(S_3(X, Y, c), L_V(Y)) = 2^{l+1} in X.
        responsibility: size
      - claim: The RR/Nagao parameter scan costs 2^{131(m-1)} m! / |F_V|^m per success under H1.
        responsibility: success_probability
      - claim: The residual-count criterion of (D) is the correct comparator against the loop.
        responsibility: correctness
      - claim: Nothing is asserted at n = 131 beyond arithmetic.
        responsibility: scope

  predictions:
    - metric: P1, field operations of gcd-membership as a function of (l, D) at n = 19, l in {6, 8, 10, 12}, D in {4, 8, 16, 32}
      direction: same
      minimum_effect: >-
        Fitted exponent in D within [1.7, 2.3] and slope in l within [0.8, 1.2]
        (linear), against enumeration's 2^l which must show slope 1 in log2
        cost per unit l. A gcd slope in l above 1.5 falsifies the law.
    - metric: P2, per-attempt cost ratio (last-two-summands by resultant plus gcd) / (2^l half-trace root-findings) at RC-1 l = 9 and n = 19 l in {8, 10, 12}, 100 residual targets
      direction: same
      minimum_effect: within [0.1, 10] and NOT decreasing with l by more than a factor 2 across the ladder; a ratio falling by more than 4x across l = 8..12 is outcome (ii).
    - metric: P3, roots-agreement between gcd and enumeration on every polynomial and every cell
      direction: same
      minimum_effect: exactly 1.0; any disagreement voids the instrument.
    - metric: P4, random-subset control cost at matched |V|
      direction: higher
      minimum_effect: at least 2^{l-2} field operations per membership decision (dense membership polynomial), against the subspace's l D^2.

  minimal_test:
    design: >-
      CELLS. RC-1 (n = 17, t^17 + t^3 + 1, A = 97044, B = 126251, #E = 4 *
      32603, V = {deg < 9}); the n = 19 cell (t^19 + t^5 + t^2 + t + 1, A =
      46693, B = 306147, h = 2) with V = {deg < l}, l in {6, 8, 10, 12}; the
      Koblitz n = 19 sibling y^2 + xy = x^3 + 1 (order 4 * 130873, recomputed)
      with the orbit union S of a random 4-dimensional V' (19 conjugates) for
      the union arm. Targets: 100 residual targets R' per cell from a recorded
      PCG64 stream (seed 2026092711).
      STAGE 0 (zero compute): re-derive (A)-(D); write the subspace polynomial
      of V = {deg < l} explicitly (its coefficients c_k) for the cells.
      STAGE 1 (primitive): implement L_V mod h by repeated squaring and the
      gcd; validate roots against evaluation on all of V (P3); measure field
      operations over the (l, D) grid (P1); run the random-subset control (P4).
      STAGE 2 (last two summands): for each R', compute h_{R'}(X) =
      Res_Y(S_3(X, Y, x_{R'}), L_V(Y)) by the linearised recursion (Y^{2^k}
      modulo the quadratic, degree-doubling in X), reduce and gcd with L_V(X);
      compare the root set and the operation count with the enumeration route
      (for each x in V solve the quadratic for y by half-trace, test y in V);
      report P2. Union arm: the same with 19 conjugate gcds.
      STAGE 3 (RR/Nagao form at m = 3 on RC-1): enumerate one summand P_1 in
      F_V, form f in L(4O) through -R and P_1 up to one parameter t, and check
      that the split condition on g_t reproduces the Stage 2 root sets (the
      panel's encoding in this program's instruments, as a correctness
      cross-check only).
      OUTCOME TABLE. POSITIVE for the record's reading: P1 law holds, P2 in
      band and flat in l, P3 = 1, P4 separates -- the primitive is an
      instrument and the RR/Nagao row at m = 5, 6 is entered as "loop with a
      constant". SURPRISE: P2 falls with l beyond the band -- the resultant
      has exploitable structure; replicate at n = 23 before reading. ARTIFACT:
      P3 < 1 or P4 fails to separate -- defect, nothing read.
      FALSIFICATION THRESHOLD, fixed now: P1 slope in l above 1.5, or P2 ratio
      falling by more than 4x across the ladder, or P3 below 1.
      COST (estimate, order of magnitude): implementation medium (polynomial
      arithmetic over F_{2^n} with modular reduction and gcd, about 300 lines;
      the resultant recursion about 100 lines); compute low, minutes to an
      hour in pure Python at degrees up to 2^13. Nothing is missing.
    cell:
      curve: 'RC-1 (n = 17), the n = 19 CERTBIN cell, and the Koblitz n = 19 sibling for the orbit-union arm'
      m: 'the primitive is arity-free; Stage 2 is the last-two-summands sub-problem of every m; Stage 3 is m = 3'
      l: '9 at n = 17; 6, 8, 10, 12 at n = 19; union of 19 conjugates of a 4-dimensional V'''
      factor_base: 'V = {deg < l} polynomial basis; orbit union of V'''
      targets: 100 residual targets per cell
      seeds: 'PCG64 seed 2026092711, recorded'
    instrument:
      - experiments/EXP-CERTBIN-e94b27/impl/gf2n.py (field; general-n variant needed)
      - experiments/EXP-CERTBIN-e94b27/impl/curve.py (S_3, half-trace root-finding)
      - 'NEW: F_{2^n}[X] arithmetic with modular squaring, gcd, subspace-polynomial builder, resultant recursion (about 400 lines)'
      - src/crypto_autoresearcher/index_calculus/ (prime-field MITM engine; its table-of-tails is the comparator shape, not reused directly)
    procedure:
      - 1. Stage 0 derivations and subspace polynomials.
      - 2. Stage 1 primitive with root agreement, cost grid and random-subset control.
      - 3. Stage 2 last-two-summands comparison on both routes, both curves, union arm.
      - 4. Stage 3 RR/Nagao cross-check at m = 3.
      - 5. Three-row reading; the RR/Nagao row entered with its measured constant.
    metrics:
      - name: gcd_membership_ops
        unit: field multiplications
        definition: operations to compute L_V mod h and gcd, per polynomial, per (l, D)
      - name: route_cost_ratio
        unit: dimensionless (field multiplications)
        definition: resultant-plus-gcd route over half-trace enumeration route, per residual target
      - name: roots_agreement
        unit: fraction of polynomials
        definition: gcd root set equals enumeration root set
      - name: subset_control_ops
        unit: field multiplications
        definition: membership cost with a random subset of matched size
    controls:
      - Enumeration over V as ground truth for every root set (blocking).
      - Random 2^l-subset membership polynomial (dense) as the null object of the same size.
      - Ordinary versus Koblitz curve at n = 19 for the union arm (the union exists only on the Koblitz arm as a Frobenius-stable set; on the ordinary curve the same 19 subspaces are used without the stability reading).
      - EV-ICPERF-10c5fc's m = 3 Theta(|F|^2) as the reproduction target for Stage 3.
    outcomes:
      positive: P1-P4 in band; primitive filed as an instrument; RR/Nagao row is a constant over the loop at m = 5, 6.
      negative: P2 falls with l; the resultant has structure; replicate before reading.
      artifact: P3 < 1 or P4 not separating; nothing read.
    falsification_threshold: 'P1 slope in l above 1.5; P2 falling more than 4x across the ladder; P3 below 1.'
    estimated_cost:
      implementation: medium
      compute: 'estimate: minutes to an hour, pure Python'
    required_metrics:
      - gcd_membership_ops over the (l, D) grid with fitted exponents
      - route_cost_ratio per cell with spread
      - roots_agreement
      - subset_control_ops

  falsification_conditions:
    - 'P1 slope in l above 1.5: the |V|-independence claim is false as implemented; the record is withdrawn or corrected.'
    - 'P2 falling by more than 4x across l = 8..12 at n = 19: claim (B) is wrong, the resultant route has an exponent advantage; outcome (ii), review before any use.'
    - 'P3 below 1: instrument defect; nothing is read.'
    - 'A residual shape with count below |F_V|^{m-2} and degree poly(m) is exhibited by any record: claim (D) remains true but the row it prices is no longer the best RR/Nagao row.'

  confounders:
    - Pure-Python constants differ from compiled ones by orders of magnitude; only ratios and exponents are read.
    - At small D the gcd's O(D^2) term is dominated by the l squarings; the grid separates the two by varying D at fixed l.
    - The resultant recursion's degree doubling can be capped by reducing modulo L_V(X) at each step; the record measures both variants and reports the cheaper.

  interpretation_limits:
    - 'An instrument plus a priced closure of the RR/Nagao row at m = 5, 6 on subspace and orbit-union bases; no attack, no exponent.'
    - 'The residual-count criterion (D) is a comparator, not an existence claim; no small residual is exhibited.'
    - 'KN-OPEN-020 classes: subspace (scoped-out) and orbit union (implicit-membership, charged above).'
    - 'Toy tier at n in {17, 19}; the n = 131 statements are arithmetic.'

  heuristic_assumptions:
    - id: H1
      statement: >-
        (Split probability.) For a uniformly random monic polynomial of degree
        m over F_{2^131} in the RR parameter family, the probability that it
        splits completely with all roots in V is |F_V|^m / (m! 2^{131 m}) up
        to a constant.
      rigorous_support: >-
        Exact count of m-subsets of V over the count of monic degree-m
        polynomials; imitates the uniform-distribution statement that the
        parameter family samples monic polynomials uniformly, which KN-FIND-007
        supports at the level of means.
      validation_plan: >-
        SAMPLE: 10^5 random parameters at RC-1 with m = 3; COMPARISON: split
        fraction against |F_V|^3 / (6 * 2^{51}); TAIL: none needed at this
        size. TRANSFER: the count is exact at every size; the uniformity of
        the family is the transfer assumption.

