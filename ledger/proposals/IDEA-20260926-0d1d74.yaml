idea:
  id: IDEA-20260926-0d1d74
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-26'
  status: proposed
  approved_by: null
  title: >-
    ROOT-FINDING IN A SUBSPACE OR ORBIT-UNION FACTOR BASE BY MODULAR
    COMPOSITION: gcd(h, L_V) costs O(l deg(h)^2) field operations for any
    polynomial h, independent of |V| = 2^l, and 131 such gcds test the whole
    orbit union; the Nagao / Riemann-Roch encoding at m = 5, 6 with the last
    summands root-found this way is priced and found to be the (m-1)-fold loop
    with a different constant, naming the one residual shape that could escape
  class: algorithm

  claim: >-
    REPRESENTATION CLASS (RQ-ECDLP-623a32): R1, x-coordinates in a subspace V
    of F_{2^131} or in the orbit union S = union_j sigma^j(V'); the attack
    stage is RELATION DECOMPOSITION, specifically the membership half of a
    decomposition oracle. TARGET ARITY AND BUDGET: m in {5, 6} on ECC2K-130
    against the validator's per-attempt budgets 2^13.96 and 2^19.77
    (producer's model N = 4r, BRIEF-ROUND2 section 1); IDEA-20260926-4b65e3's
    cap column 2^32.4 and 2^37 as the alternative model. The record predicts
    that every encoding it prices sits 50 to 80 bits above both.
    (A) THE PRIMITIVE. Let L_V(X) = prod_{v in V} (X - v). For an F_2-subspace
    V this is a 2-polynomial, L_V(X) = sum_{k=0}^{l} c_k X^{2^k} (standard;
    KN-LIT-4fe9d2 Proposition 2 uses the same object for QSP root sets). For
    any h in F_{2^131}[X] of degree D, L_V mod h is computable by l modular
    squarings X^{2^k} mod h plus l scalar multiplications, i.e. O(l D^2)
    field operations schoolbook (O(l D log D) with fast arithmetic), and then
    gcd(h, L_V mod h) costs O(D^2). So ALL roots of h that lie in V are found
    in O(l D^2) field operations, with no dependence on |V| = 2^l. For the
    orbit union, L_{sigma^j V'} = sigma^j applied to the coefficients of
    L_{V'} (since sigma^j(V') has the conjugate roots), so 131 gcds of the
    same shape test membership in S at 131 times the cost. This replaces the
    2^l-fold enumeration that IDEA-20260926-b48c9d's Stage 1 and the
    (m-1)-loop of IDEA-20260904-96c4f3 use for a membership test ONLY when the
    candidate set is presented as the root set of a polynomial of degree D
    with l D^2 < 2^l.
    (B) WHERE THE PRIMITIVE BUYS NOTHING, EXACTLY. In the (m-1)-loop the last
    summand is R - (P_1 + ... + P_{m-1}); its membership is a linear test in
    the coordinates of x, cost O(1) after the group operation, so the loop's
    cost 2^{(m-1)l}/(m-1)! is the enumeration of m-1 summands and the
    primitive has nothing to replace. In the last-TWO-summands form (enumerate
    m-2 summands, residual target R', find x_{m-1}, x_m in V with
    S_3(x_{m-1}, x_m, x_{R'}) = 0) the residual polynomial in one unknown is
    h_{R'}(X) = Res_Y(S_3(X, Y, x_{R'}), L_V(Y)), of degree 2^{l+1} in X (S_3
    is quadratic in Y and L_V has degree 2^l; the norm of L_V(Y) modulo the
    quadratic is computed by l linearised squarings of degree-doubling
    polynomials in X), so D = 2^{l+1} and the primitive costs 2^{l+1} polylog,
    the same order as the 2^l half-trace root-findings it replaces. The
    exponent of the per-attempt cost is unchanged at (m-1) l; the primitive is
    a CONSTANT there.
    (C) THE NAGAO / RIEMANN-ROCH ENCODING AT m = 5, 6, PRICED. Write f in
    L((m+1)O) with f(-R) = 0 (an m-dimensional space; projectively m-1
    parameters); the quotient polynomial g_f(X) = N(f)/((X - x_R)) of degree
    m has coefficients quadratic in the parameters, and R decomposes iff g_f
    splits completely with all roots in V, i.e. iff g_f divides L_V. The
    gcd test on one candidate f costs O(l m^2). But the candidate parameters
    are m-1 elements of F_{2^131}, and the fraction of candidates that pass
    is |F_V|^m / (m! 2^{131 m}) (H1), so scanning parameters costs
    2^{131 (m-1)} m! / |F_V|^m per success -- astronomically above enumerating
    m-2 summands. Fixing m-2 summands in F_V leaves one projective parameter t
    and a quadratic g_t(X); "both roots in V" is then the last-two-summands
    problem of (B) in a different coordinate, with h(t) of degree 2^{l+1}
    (the norm of L_V over the quadratic extension defined by g_t). So the
    RR/Nagao encoding on a subspace base is the (m-1)-loop with the last two
    summands found by a degree-2^{l+1} gcd: constant over the loop, exactly as
    EV-ICPERF-10c5fc measured at m = 3 (Theta(|F|^2), null-object 0.494x). The
    seam's phrase "Nagao disjoint-coset decomposition" could not be matched to
    a source this session and is not priced as anything other than the above.
    (D) THE ONE SHAPE THAT COULD ESCAPE, NAMED SO IT CAN BE SEARCHED FOR. A
    decomposition oracle whose work is (number of residual polynomials) x
    O(l D_res^2) beats the loop iff the residual count is below
    2^{(m-1)l} / (l D_res^2). Both named encodings have residual count
    |F_V|^{m-2} and D_res = 2^{l+1}; the loop has residual count |F_V|^{m-1}
    and D_res = 1. An oracle with residual count |F_V|^{m-1-k} and D_res =
    poly(m, k) for some k >= 1 would gain 2^{kl} per attempt, which at m = 5,
    k = 2, l = 23 is the whole gap. No such residual is known to this record;
    the subfield case (V = F_q, L_V = X^q - X) is where Joux-Vitse and Nagao
    obtain it, and the subspace and orbit-union cases inherit ONLY the cheap
    gcd, not the small residual. This is the precise statement of what
    "Koblitz structure" would have to supply: a polynomial identity that
    collapses several summands into one small-degree residual over the union.
    (E) OUTCOMES. (i) The measured primitive cost scales as l D^2 with D and is
    flat in l at fixed D (P1), and the last-two-summands gcd route costs
    within a small constant of the half-trace enumeration at RC-1 (P2): (A)-(C)
    stand, the primitive is filed as an instrument and the RR/Nagao row of the
    m >= 5 table is a constant over the loop. (ii) The gcd route is cheaper
    than enumeration by a factor growing with l over the ladder: the resultant
    computation has structure the record missed (the degree-doubling
    recursion is a linearised composition), which is the surprise branch and
    is reported for review before any interpretation. (iii) Instrument
    disagreement between gcd roots and enumeration roots: defect, nothing read.

  mechanism: >-
    OBJECT FRAME. Representation: R1, subspace coordinates, with the factor
    base described IMPLICITLY by its membership polynomial L_V (or the 131
    conjugate polynomials of the union). Operation set Sigma: translation by
    factor-base elements (Class I partial action, index calculus's own); the
    primitive changes how membership of a candidate set is decided, not what
    is tracked. TRICHOTOMY: Class I; the tracked object is the ordinary
    relation vector.
    LOSSY-PROJECTION TEST. Stated rather than omitted: no new projection is
    proposed. The primitive replaces "enumerate V and test" by "reduce L_V
    modulo h", which is a change of algorithm on the same object; the record
    is an instrument-and-pricing record, not a new tracked object.
    WHY THE COST IS INDEPENDENT OF |V|. L_V has 2^l roots but only l + 1
    nonzero coefficients, all on 2-power exponents; X^{2^k} mod h is obtained
    from X^{2^{k-1}} mod h by one squaring modulo h. This is the same reason
    x^q mod h is cheap for a subfield: the membership polynomial is sparse in
    the Frobenius sense. Orbit unions inherit it because sigma^j(L_{V'}) is
    again a 2-polynomial.
    KN-OPEN-020 CLASS. The subspace base is the scoped-out bounded-degree
    linear class; the ORBIT UNION is the implicit-membership class
    (membership by 131 gcds, description O(l), no low-degree polynomial in
    the coordinates), charged here: description l + 1 field elements,
    membership 131 x O(l D^2) per candidate polynomial, relation and descent
    as in (B)-(C), memory O(D).
    OFF-LIMITS COMPONENTS USED, NAMED. F2 is the family; the Riemann-Roch
    encoding of KN-LIT-fbb9fd (Nagao) and EV-ICPERF-10c5fc's panel are the
    prior encodings; the subspace polynomial is KN-LIT-4fe9d2's object. What
    is added: the modular-composition cost law for subspace and orbit-union
    membership, the exact statement of where it is a constant, and the
    residual-count criterion of (D).

