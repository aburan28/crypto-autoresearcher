      (|V|-independent). Per attempt at arity m the RR/Nagao and last-two-
      summands encodings cost 2^{(m-2) l} x O(l 4^l) = O(l) 2^{ml}, no better
      than the loop's 2^{(m-1)l}/(m-1)!; at m = 5, l = 23 that is about 2^92
      against a budget of 2^13.96 (or 2^32.4 under the cap model).
    memory_exponent: O(D) field elements for the primitive; O(2^{l+1}) for the resultant route.
