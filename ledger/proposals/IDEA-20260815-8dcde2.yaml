idea:
  id: IDEA-20260815-8dcde2
  question_id: RQ-ECTD-001
  added: '2026-08-15'
  title: >-
    A TRAPDOOR NEEDS THE TRAPDOOR HOLDER'S ADVANTAGE TO EXCEED THE PUBLIC
    ATTACK; DERIVE THE ADVANTAGE INEQUALITY FIRST AND CHECK WHETHER ANY
    ISOGENY LENGTH SATISFIES IT
  class: theory

  claim: >-
    GOAL-ECTD-001 wants a secret isogeny chain to a weak endpoint, with
    public path recovery at least rho-hard. Those two requirements pull
    opposite ways: a chain long enough to hide is a chain long enough that
    the holder must also traverse it. Writing the inequality -- holder cost
    plus endpoint ECDLP cost below public ECDLP cost, and path recovery
    above rho -- shows immediately whether any length satisfies both.

  mechanism: >-
    Express holder cost as chain length times transport cost, endpoint
    advantage as the assumed weakness, and path-recovery cost under the best
    known search. Solve the joint inequality for chain length and report
    whether the feasible interval is non-empty.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-ECTD-001 objective and H-ECTD-001; grep 'advantage
      inequality', 'trapdoor feasibility', 'chain length'.
    results: >-
      The goal states both requirements; no record writes them as a joint
      inequality or solves for the feasible length interval.
    verdict: >-
      ADAPTATION. Feasibility inequalities are elementary; the
      contribution is writing this lane's two requirements as one
      constraint before further design effort.

  object_first_candidate:
    tracked_object: >-
      THE FEASIBLE CHAIN-LENGTH INTERVAL, as the solution set of the joint
      inequality.
    lossiness: >-
      Reducing a design to one interval discards its details, which is
      appropriate for a gate meant to run before the details exist.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while both costs are expressible as functions of chain
      length; terms with no defensible expression are marked unbounded,
      which weakens the gate proportionally.

  null_object_control: >-
    NULL 1 -- an endpoint with no weakness at all, where the interval must
    be empty. NULL 2 -- an endpoint with a total break, where the interval
    must be non-empty; a gate that rejects even that case is over-strict.

  discriminated_from:
    - >-
        The transport-cost floor record in this series, whose lower bound
        is one input to this inequality and should be consumed rather than
        re-derived.
    - >-
        The invisibility-classifier record in this series, which tests a
        different necessary condition; both must hold and neither implies
        the other.

  assumptions:
    - >-
        Transport cost per step is expressible from the enumerated
        implementations, taken from the transport-cost record rather than
        assumed.
    - >-
        The endpoint weakness can be parameterised by an advantage factor;
        if the proposed weakness resists parameterisation the gate cannot
        be evaluated.

  predictions:
    - metric: >-
        no-weakness endpoint null
      direction: different
      minimum_effect: >-
        FORCED empty interval.
    - metric: >-
        total-break endpoint null
      direction: different
      minimum_effect: >-
        FORCED non-empty interval; otherwise the gate is over-strict and
        rejects everything.
    - metric: >-
        feasible interval under realistic weakness assumptions
      direction: different
      minimum_effect: >-
        The deliverable; an empty interval closes the design on cost
        grounds before any construction is attempted.

  minimal_test:
    design: >-
      Symbolic. Write the inequality, run both nulls, solve for realistic
      parameter ranges.
    controls:
      - >-
          No-weakness and total-break nulls.
      - >-
          Transport cost taken from the transport-cost record, not re-
          derived.
      - >-
          Unbounded terms marked rather than assigned plausible values.
    required_metrics:
      - >-
          Feasible interval as a function of the weakness parameter.
      - >-
          Both null outcomes.
      - >-
          List of terms with no defensible expression.

  falsification_conditions:
    - >-
        A null misbehaves. The inequality is wrong; fix before use.
    - >-
        The interval is empty for all realistic weakness parameters. The
        trapdoor design is infeasible on cost grounds, which is the
        cheapest possible way to learn it.
    - >-
        The interval is non-empty. The design survives this gate and the
        other necessary conditions become worth testing.
    - >-
        Too many terms are unbounded. The gate cannot be evaluated and the
        lane should say so rather than proceed on intuition.

  confounders:
    - >-
        PARAMETER OPTIMISM: choosing a favourable weakness factor makes
        the interval non-empty by assumption, so the weakness must be
        parameterised and swept rather than fixed.
    - >-
        IGNORING DETECTION: this inequality covers cost, not invisibility;
        a design can pass here and fail the detection requirement
        entirely.

  interpretation_limits:
    - >-
        A necessary-condition gate; passing establishes nothing positive
        about the design.
    - >-
        Covers cost feasibility only, not detectability or any other
        requirement.
    - >-
        Conclusions bind the transport-cost model consumed as input.

  heuristic_assumptions:
    - id: HEUR-ECTD-FEAS-1
      statement: >-
        Holder cost, endpoint advantage and path-recovery cost are each
        expressible as functions of chain length alone, so the joint
        inequality is one-dimensional.
      rigorous_support: >-
        Rigorous ingredient: transport cost is linear in the number of
        steps, and path-recovery search cost grows with chain length
        under the enumerated search methods. THE GAP: endpoint weakness
        need not depend on chain length at all -- it is a property of
        where you land, not how far you walked -- so treating it as a
        function of length may be simply the wrong parameterisation.
      falsification_condition: >-
        An endpoint weakness that varies independently of chain length,
        making the inequality multi-dimensional.
      validation_plan: >-
        SAMPLE: the inequality evaluated across the weakness-parameter
        range at each length. TAIL CHECK: parameter combinations near
        the feasibility boundary, reported explicitly. TRANSFER: none;
        the gate is symbolic.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent feasibility gate exists for this lane; the goal states
      the requirements without joining them.
    hidden_overhead: >-
      The endpoint-weakness parameterisation is the term most likely to be
      chosen optimistically and determines the answer.
    tradeoff_note: >-
      A longer chain hides better and costs the holder more; the gate
      prices that trade before any construction exists.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a trapdoor design: nothing is
    constructed. As a feasibility gate for this lane: none exists. Not null
    on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the lane's two stated
    requirements written as one joint inequality and solved for the feasible
    chain-length interval, with the endpoint-weakness factor swept rather
    than assumed.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the inequality is writable. 0.5 that the endpoint weakness
    admits a length parameterisation at all, which is the named modelling
    risk. 0.55 that the feasible interval is empty for realistic parameters,
    which would close the design cheaply and is the outcome I consider most
    likely.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
