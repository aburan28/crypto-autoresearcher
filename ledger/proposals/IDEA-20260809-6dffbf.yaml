idea:
  id: IDEA-20260809-6dffbf
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CSIDH-64343f
  goal_id: GOAL-CSIDH-001
  title: >-
    The quantum memory model is a switch with an enormous lever arm — measure how
    far the estimate moves between classical, quantum-accessible and fully
    quantum memory
  class: measurement
  claim: >-
    Kuperberg-style algorithms consume large collections of intermediate states,
    and their cost depends sharply on whether the memory holding those states is
    classical, quantum-accessible with classical contents, or fully quantum. The
    claim is that this single modelling choice moves the estimate by more than any
    other switch in the model, that its effect can be quantified exactly within
    the common cost function, and that published analyses differ on it in ways
    their headline numbers do not display.
  mechanism: >-
    Parameterize memory access cost by model and by size, propagate through the
    algorithm's state collection and combination steps, and evaluate the total
    under each model at matched parameters.
  why_not_a_renamed_known_approach: >-
    The memory-model question is a known fault line in post-quantum cost
    estimation generally. Quantifying its lever arm INSIDE the reconstructed
    CSIDH model, and comparing it against the other switches on the same scale, is
    the contribution.
  predictions:
  - observable: estimate movement across memory models at matched parameters
    metric: bits, per model pair
    predicted: >-
      The largest single movement among the switches, or close to it. If some
      other switch dominates, the kernel analysis will show it and this record
      reports the ranking honestly either way.
  - observable: whether each published analysis's memory model can be determined from its text
    metric: categorical per analysis, with citation or 'undetermined'
    predicted: At least one undetermined; undetermined is recorded as undetermined.
  minimal_test: >-
    Evaluate the common cost function under three memory models at matched
    parameters, report movements, and separately audit each filed analysis for its
    stated model.
  controls:
  - 'MATCHED-PARAMETER CONTROL: only the memory model varies between evaluations.'
  - 'MODEL-DEFINITION CONTROL: each memory model''s cost function is stated explicitly in the record, since the models are named differently across the literature and a name without a cost function is not a model.'
  falsification_conditions:
  - Movements across memory models are small, contradicting the claim.
  - Memory models cannot be given cost functions specific enough to evaluate, in which case the switch is inexpressible and that is reported.
  interpretation_limits: >-
    Model movements are not verdicts. A model that gives a low estimate is not
    thereby the right model, and this record does not choose.
  sota_delta: 'No verdict. Delta: the memory-model lever arm measured on the same scale as the other switches.'
  dominated_by: Downstream of IDEA-20260809-66ef77; not dominated by any corpus record.
  estimated_cost: Implementation small on top of the model; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for QRAM / quantum memory model: no records. WEB NOT CHECKED.'
  source_refs:
  - Kuperberg algorithm references and the CSIDH analyses -- RECALLED, REQUIRED READS.
