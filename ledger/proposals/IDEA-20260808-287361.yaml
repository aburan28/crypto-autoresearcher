  estimated_cost: Implementation medium (surrogate signer on an existing graph builder). Compute
    low (seconds to minutes).
  recommended_priority: medium
  honest_prior_of_survival: 0.95 that the measurement runs and the positive control fires.
    0.05 that any entropy drop is observed -- the expected outcome is the null, and the value
    is that the null becomes a number with a stated power rather than an appeal to a reduction.
