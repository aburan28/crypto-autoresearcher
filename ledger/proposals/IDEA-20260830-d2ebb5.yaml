idea:
  id: IDEA-20260830-d2ebb5
  question_id: RQ-RELN-001
  added: '2026-08-30'
  title: >-
    EVERY NEGATIVE IN A P(decomp) MEASUREMENT IS CURRENTLY UNCERTIFIED, AND AT
    LOW DENSITY THE NEGATIVES ARE THE MEASUREMENT: define a
    kind exhaustive_nondecomposition certificate from four independently
    recomputable invariants, prove by an explicit observation collision that
    three of them are not enough, and measure the suite's power by replanting
    this program's own four historical instrument defects
  class: control

  claim: >-
    (A) THE GAP, READ OFF COMMITTED SOURCE AND COMMITTED POLICY.
    docs/claims-and-verification.md requires a certificate for every claimed
    solve or relation and states plainly that "absence of a witness within budget
    is only ever a scoped negative observation". P(decomp) is an estimate of a
    PROPORTION, and at the densities this lane operates at (the committed
    saturation sweep starts at |3V|/#E = 0.024) between 97 and 3 percent of the
    evidence is negatives. harness/semaev.py measure_s3_decomposition returns a
    verifiable decomposition certificate when a decomposition is found and
    certificate None otherwise; harness/run_saturation.py writes
    certificate {"kind": "none"} for the entire density sweep. So the half of
    the measurement that carries most of its information is, today, backed by
    nothing but the enumerator's own control flow.
    (B) THE REGIME DISTINCTION THAT MAKES THIS FIXABLE, AND ITS LIMIT.
    The policy sentence quoted above is exactly right for a BUDGETED SEARCH: a
    Groebner solve that times out has found no witness and proved nothing. It is
    NOT the regime this lane is actually in. The decomposition rates in
    EV-ENDO-10109d and in the ICINV lane are produced by EXACT ENUMERATION of the
    m-fold signed sumset -- the evidence record says so in its own words -- and an
    exhaustive enumeration's negative is "no witness EXISTS", which is a
    completeness claim about a finite computation and is therefore checkable by
    exact identities in the same cheap, independent way a positive witness is.
    This record proposes that certificate class and NOTHING WIDER: it does not
    and cannot certify budgeted negatives, and it does not certify that any
    negative generalizes beyond the enumerated instance.
    (C) THE FOUR INVARIANTS, EACH INDEPENDENTLY RECOMPUTABLE FROM (B, m, N)
    ALONE OR FROM CODE DISJOINT FROM THE ENUMERATOR.
    E1 CONSERVATION CHECKSUM: an enumerator that counts MULTIPLICITIES must
    satisfy sum over g of c_W(g) = binomial(2B+m-1, m) exactly, where
    W = V union -V has size 2B. This is KN-FIND-007's double count applied to the
    signed point set, and it is recomputable from two integers.
    E2 NEGATION SYMMETRY: c_W(g) = c_W(-g) for every g, forced because W = -W.
    E3 IDENTITY COUNT: c_W(O) = B at m = 2 on a 2-torsion-free base, forced.
    E4 SPOT-CHECKED NON-MEMBERSHIP: k targets declared non-decomposable are
    re-decided by an INDEPENDENT meet-in-the-middle test that shares no code with
    the enumerator, k declared before the run.
    Plus, whenever targets are sampled rather than exhausted:
    S1 SAMPLER CERTIFICATE: the base point's exact order with its factorization
    witness, the count of distinct targets against the birthday prediction with a
    z-score, the count of dropped draws, and the declared target support.
    (D) THE CENTRAL TECHNICAL CLAIM, WHICH IS AN OBSERVATION COLLISION AND IS
    WHY E4 IS NOT DECORATION. E1, E2 and E3 are all invariant under composing the
    multiset-to-target map with any group automorphism u that commutes with
    negation -- multiplication by a unit u modulo N. Such a relabelled enumerator
    reports the identical total, the identical negation symmetry and the identical
    identity count, while being WRONG about every membership question. Two
    distinct ground-truth objects therefore share the (E1, E2, E3) observable, one
    on each side of the conclusion. E4 is the additional condition that separates
    them, and its power is bounded and stateable: a defect that changes membership
    on a fraction eps of targets survives k independent spot checks with
    probability (1 - eps)^k, so the suite's detection floor is eps of order 1/k
    and MUST be published with every certificate rather than left implicit.
    (E) THE POWER MEASUREMENT, WHICH IS THE EXPERIMENT. A certificate suite that
    has never been shown to catch anything is a ritual. This program has produced
    four instrument defects in one campaign, three of them found by luck or by
    an impossible printed number rather than by a check. Replant them, plus two
    synthetic defects and one adversarial defect designed to evade E1 to E3, and
    measure the detection rate of each invariant against each defect. The
    predicted detection matrix is pre-registered below and contains FORCED MISSES
    as well as forced hits: E1 to E4 are blind to the 2-torsion sampler
    degeneracy by construction, which is exactly why S1 exists, and saying so in
    advance is what distinguishes a measured suite from an advertised one.

  mechanism: >-
    TRACKED OBJECT AND THE LOSSY-PROJECTION TEST. The tracked object is the
    MULTIPLICITY HISTOGRAM of the multiset-sum map, projected to the triple
    (total mass, negation-symmetry defect, identity-fibre size) -- three integers
    computed from an object with N components. This is violently lossy: the fibre
    over any admissible triple contains every enumerator that gets the counts
    right, correct or not, and the collision in claim (D) exhibits an explicit
    infinite family inside one fibre. It is lossy COMPATIBLY with the operation
    the measurement performs, which is what makes it usable at all: the total
    mass is preserved by the group operation because every size-m multiset sums
    to exactly one element (KN-FIND-007), and the negation symmetry is preserved
    because negating every element of a multiset is an involution on multisets.
    So both retained coordinates propagate deterministically through the
    enumeration, and a truncation, a duplication, a set-versus-multiset
    conflation, or a sign-convention error necessarily perturbs one of them. It
    is emphatically NOT a change of coordinates -- the histogram is not
    recoverable from the triple -- and this record's central content is the
    demonstration that the loss is large enough to admit wrong answers, which is
    why the fourth, membership-level invariant is required and why its detection
    floor is published.
    WHY THE DEFECT-INJECTION DESIGN DISCRIMINATES RATHER THAN CONFIRMS. Two
    competing accounts of this program's defect history are on the table and they
    make opposite predictions. ACCOUNT 1: the four GOAL-ENDO defects were caught
    because the campaign was attentive, and a checklist adds paperwork without
    power. ACCOUNT 2: they were caught late, by an impossible printed value and
    by a post-hoc validator recomputation, and cheap forced identities would have
    caught most of them at the moment of computation. The detection matrix
    separates these: under ACCOUNT 1 the invariants fire on few of the seven
    planted defects and the honest deliverable is that the suite is decoration;
    under ACCOUNT 2 they fire on the pre-registered subset with the pre-registered
    signatures. Neither outcome is assumed and the negative outcome is publishable
    as-is.
    WHY THE CERTIFICATE IS NEARLY FREE, WITH THE COST STATED. The committed
    enumerators already build the sumset as a SET of points. Counting
    multiplicities instead costs the same loop with a counter, and the memory
    moves from a set of |mW| points to a map of at most min(|mW|, N) counters --
    at toy scale a difference of a small constant factor, at larger N a real cost
    that is disclosed rather than hidden. E2 and E3 are one pass each. E4 costs
    k meet-in-the-middle probes at O(B^ceil(m/2)) each. S1 costs one point-order
    computation and one distinct-count.

  novelty_status: unverified

  citations:
    - ref: 'docs/claims-and-verification.md'
      provenance: internal
      claim: >-
        Requires every run claiming a solve or a relation to emit a certificate
        re-verified by code independent of the solver; defines kind
        discrete_log | decomposition | none, with none for pure measurement runs;
        states under "What this does NOT provide" that there is "No certification
        that a negative result generalizes -- a certificate proves a positive
        witness is real; absence of a witness within budget is only ever a scoped
        negative observation"; and defines the refutation-artifact ladder
        (counterexample certificate, derivation note, empirical-only) with
        proof_status recorded.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        docs/claims-and-verification.md, all 297 lines.
    - ref: 'harness/semaev.py (measure_s3_decomposition, _find_decomposition, verify_decomposition_certificate)'
      provenance: internal
      claim: >-
        _find_decomposition searches V x V, checks s3_eval, lifts both
        x-coordinates and tries all four sign combinations, and returns
        (True, summands, cert) with a decomposition certificate on success and
        (False, [], None) on failure -- so a NEGATIVE carries no certificate at
        all. verify_decomposition_certificate re-checks only positive
        certificates, by recomputing the point sum on a freshly constructed
        curve object.
      verified_by: >-
        Read in full this session (Read tool, 2026-08-29), file
        harness/semaev.py, all 233 lines.
    - ref: 'harness/run_saturation.py and harness/exp_icinv.py'
      provenance: internal
      claim: >-
        run_saturation writes its run record with certificate {"kind": "none"}
        for the whole density sweep. Its enumerators build `two` and `three` as
        SETS of points, discarding multiplicity, and drop the identity because
        E.add returns None for it. exp_icinv's module docstring states "Every
        rate is measured by EXACT ENUMERATION over the factor base, not by a
