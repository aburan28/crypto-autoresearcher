  assumptions:
    - >-
      That the enumerator under certification is EXHAUSTIVE over the declared
      multiset space. The certificate class is defined only for that regime; a
      budgeted or heuristic search may not emit it, and the record must state so
      in the certificate itself. Nothing here weakens the policy sentence about
      budgeted negatives.
    - >-
      That the factor base is a set of x-coordinates lifted to W = V union -V,
      2-torsion-free unless the 2-torsion null arm is running. If a later
      construction changes that convention, E1 and E3's forced integers change
      and must be re-derived before use; the certificate records the convention
      as a field so a reader can tell which arithmetic was applied.
    - >-
      That the independent meet-in-the-middle re-decider for E4 genuinely shares
      no code with the enumerator. This is enforced by an import-graph check and
      by an AST-level structural diff, not by inspection, following the method
      the Validator used on this campaign.
    - >-
      That the group order N and the target support are known exactly at these
      parameters, which they are at toy scale by direct enumeration.
    - >-
      Toy scale binds. Every planted defect is replanted at p <= 6007 with
      factor bases of at most 22 x-coordinates; no crypto-scale claim is made or
      implied.

  proof_search_map:
    bottleneck: >-
      The exact step whose absence makes the negative half of P(decomp)
      unverifiable: the enumerator's transition from a multiset enumeration to a
      SET of reached points, which destroys the one quantity (total multiplicity)
      that is independently predictable, and the emission of certificate
      {"kind": "none"} which records that destruction as intentional.
    baseline_embedding:
      parameter_slice: >-
        A correct multiplicity-counting enumerator on a 2-torsion-free base at
        m = 2 must reproduce total binomial(2B+1, 2) = 2B^2 + B, c_W(O) = B, and
        perfect negation symmetry, and must agree with the committed set-based
        enumerator on the SUPPORT of the histogram at densities where the
        cancelling-pair route is covered. That agreement is the embedding of the
        existing instrument as a boundary case.
      reproduction_check: >-
        Frozen fixture at p = 101, a = 2, b = 3 with B in {5, 8, 12} and
        m in {2, 3}: the totals are exact integers computable by hand before the
        run and are stored in the contract, and the enumerator is compared against
        the stored file rather than the file against the enumerator.
    observation_collision:
      observable: >-
        The triple (E1 total, E2 symmetry fraction, E3 identity count) emitted by
        an enumerator.
      distinct_preimage_search: >-
        COLLISION EXHIBITED, NOT MERELY SOUGHT. Let u be any unit modulo N with
        u not equal to plus or minus 1, and let A be an enumerator that computes
        the true histogram c and reports g -> c(u*g). Then the total is unchanged
        (a bijection of the group permutes the fibres), negation symmetry is
        preserved (u commutes with negation), and the identity count is preserved
        (u fixes O). So A and the true enumerator share the observable exactly,
        while disagreeing about membership on a 1 - o(1) fraction of targets --
        one on each side of the conclusion "this target does not decompose".
        Therefore E1 to E3 are NOT identifying, and the record says so rather than
        claiming a complete check. E4 separates the pair with probability
        1 - (1 - eps)^k for a defect of reach eps; this is the additional
        condition and its floor is published.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Certify the multiplicity histogram rather than the reached set:
          carry the total, the symmetry defect and the identity fibre through the
          computation, because that stronger state is what survives the
          enumerator's own recursion and what a truncation cannot fake.
        predicted_gain: >-
          Converts four classes of enumerator defect (truncation, duplication,
          set-versus-multiset conflation, sign-convention error) from silent to
          forced-detected, at the cost of one counter map and one extra pass.
      - transform: observable_fiber
        proposed_object: >-
          Hold (E1, E2, E3) fixed and vary the forgotten structure by the unit
          relabelling above; the intrinsic invariant distinguishing the resulting
          enumerators is membership itself, which is exactly what E4 samples.
        predicted_gain: >-
          Turns "the checks passed" into "the checks passed and here is the class
          of defect they cannot see, with its detection floor".
    quantifier_order: >-
      FOR ALL 2-torsion-free bases V of size B on a curve of order N, and FOR ALL
      m >= 2, THERE EXISTS a triple of integers, computable from (B, m) alone
      without reference to the curve, that any exhaustive multiplicity-counting
      enumerator must reproduce exactly. The witness is NOT allowed to depend on
      the curve, the base, the seed or the enumerator, and that prohibition is the
      falsifiable content: an enumerator whose total depends on which base it was
      given is wrong, without appeal.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest claim the suite can certify is: "this specific exhaustive
        enumeration over this specific declared multiset space is internally
        consistent with three forced identities, and k independently re-decided
        negatives agreed, so a defect touching more than about 1/k of targets is
        excluded at the stated confidence". It CANNOT certify that no
        decomposition exists under a different arity, a different base, a
        different sign convention or a budgeted search; it cannot certify
        anything about untested targets; and it cannot make a toy negative
        transfer to any larger parameter. It is a completeness certificate for a
        finite computation, nothing more.
      nearby_object_control: >-
        The nearby object where the desired conclusion must FAIL: a genuinely
        correct enumerator run on a base seeded with t 2-torsion x-coordinates,
        where |W| = 2B - t and the forced total is binomial(2B-t+m-1, m), NOT
        binomial(2B+m-1, m). A suite that flags this correct enumerator as
        defective, or that passes it while using the wrong forced constant, has
        not identified the load-bearing structure and its verdicts are worthless.
        This arm is mandatory.
    proof_obligations:
      - claim: >-
          sum over g of c_W(g) = binomial(2B+m-1, m) for W = V union -V of size
          2B, exactly, for every base and every curve.
        responsibility: correctness
      - claim: >-
          c_W(g) = c_W(-g) for all g, and c_W(O) = B at m = 2 on a 2-torsion-free
          base.
        responsibility: correctness
      - claim: >-
          The unit-relabelling enumerator preserves all three invariants and is
          wrong, so the triple is not identifying.
        responsibility: strictness
      - claim: >-
          A defect of reach eps survives k spot checks with probability
          (1 - eps)^k, so the published detection floor is honest.
        responsibility: success_probability
      - claim: >-
          The E4 re-decider shares no code path with the enumerator, verified by
          import graph and AST diff.
        responsibility: interface
      - claim: >-
          The certificate's cost is one counter map, one pass, k MITM probes and
          one point-order computation, with the memory change from |mW| points to
          min(|mW|, N) counters disclosed.
        responsibility: memory

  predictions:
    - metric: >-
        E1 total multiplicity emitted by a corrected multiplicity-counting
        enumerator, against binomial(2B+m-1, m), on every clean cell
      direction: different
      minimum_effect: >-
        EXACTLY EQUAL, deviation 0, no tolerance. KN-FIND-007 measured exactly 0
        over 144 cells on the unsigned version; this must reproduce that on the
        signed set. Any nonzero deviation on a clean cell is an implementation
        fault and the battery halts rather than reporting.
    - metric: >-
        E1 shortfall on planted defect D2 (the committed cancelling-pair
        severance) at m = 3
      direction: lower
      minimum_effect: >-
        A shortfall of EXACTLY 2B^2 multisets -- the count of size-3 multisets
        from W containing a plus-minus pair, per IDEA-20260805-5ac0a2's
        derivation -- at every cell, i.e. 32 at B = 4 and 968 at B = 22. Forced
        integer, computed before the run. A shortfall of any other value means
        either the derivation or the replanting is wrong and the arm halts.
    - metric: >-
        Detection matrix: which of E1, E2, E3, E4, S1 fires on each of seven
        planted defects
      direction: different
      minimum_effect: >-
        PRE-REGISTERED, WITH FORCED MISSES INCLUDED. D1 2-torsion sampler
        degeneracy: S1 fires (z-score above 10 on the distinct-target count),
        E1 to E4 MISS by construction. D2 cancelling-pair severance: E1 fires
        exactly, E2 to E4 may or may not. D3 truncated enumeration at 90 percent:
        E1 fires. D4 sign convention dropped (positive lifts only): E1 fires
        (total binomial(B+m-1,m)) and E2 fires. D5 off-by-one base size: E1
        fires. D6 unit relabelling: E1, E2, E3 ALL MISS by the collision proof,
        E4 fires with probability 1 - (1-eps)^k. D7 membership flipped on a
        random 1 percent of targets: E1 to E3 miss, E4 fires with probability
        1 - 0.99^k, which at k = 100 is 0.63 -- deliberately chosen to sit near
        the suite's floor so the floor is measured and not asserted. A suite that
        fires on fewer than five of the seven, or that fires where a forced miss
        is predicted, is reported as a failed suite.
    - metric: >-
        S1 z-score of the distinct-target count against the birthday prediction,
        on the historical 2-torsion configuration
      direction: higher
      minimum_effect: >-
        The historical defect produced 1 distinct target where the birthday
        prediction for 300 draws from a pool of about 2083 is 278.4 with a
        standard deviation of order 1.5, i.e. a z-score above 100. FORCED
        DETECTION. If S1 does not fire on this configuration the sampler
        certificate is mis-specified and must be rewritten before use.
    - metric: >-
        Nearby-object control: the suite's verdict on a CORRECT enumerator over a
        base seeded with t 2-torsion x-coordinates
      direction: different
      minimum_effect: >-
        Must PASS, using the forced total binomial(2B-t+m-1, m). A false alarm
        here means the suite rejects correct instruments, which is a worse failure
        than missing a defect and must be reported as disqualifying.
    - metric: >-
        Certificate overhead: wall time and peak RSS of a certified run against
        the same run uncertified, at the committed ladder
      direction: higher
      minimum_effect: >-
        Predicted below 1.5x wall time and below 3x peak RSS at p = 6007 with
        m = 3 and B up to 22 (the memory change is from a set of |3W| points to
        a counter map of at most min(|3W|, N) entries). If the overhead exceeds
        5x, the obligation is not free and the protocol must declare which cells
        it applies to rather than mandating it everywhere.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, algebra, HARD GATE). Write out the three forced
      identities for W = V union -V and the unit-relabelling collision. Verify
      the collision symbolically: multiplication by a unit u permutes the group,
      commutes with negation and fixes O, hence preserves all three invariants.
      If the collision does not hold, E4 may be unnecessary and the record is
      re-scoped downward -- which would be a cheaper and better outcome.
      STAGE 1 (minutes, fixture). Implement the multiplicity-counting enumerator
      and the disjoint MITM re-decider. Check both against the hand-computed
      fixture at p = 101 stored in the contract BEFORE the run.
      STAGE 2 (minutes, clean cells). Emit certificates over the committed
      fb-size ladder at p = 4001 and p = 6007, m = 2 and m = 3. Require E1
      deviation exactly 0, E2 fraction exactly 1.000, E3 exactly B at m = 2.
      STAGE 3 (tens of minutes, THE EXPERIMENT). Replant seven defects, one at a
      time, behind flags: D1 the 2-torsion base point (historical); D2 the
      cancelling-pair severance (currently in committed source); D3 truncation at
      90 percent; D4 positive lifts only; D5 off-by-one base size; D6 unit
      relabelling; D7 membership flipped on 1 percent of targets. Record which
      invariants fire, with what statistic, at what cell. Compare against the
      pre-registered matrix committed in Stage 0.
      STAGE 4 (minutes). Nearby-object control (2-torsion-seeded base, correct
      enumerator, must PASS) and the overhead measurement.
      STAGE 5 (zero compute). Write the certificate schema as a concrete YAML
      block for templates/research-records.md, with the detection floor as a
      MANDATORY field, and a plain statement of the defect classes the suite
      cannot see.
      ENVELOPE. All arms are exact enumeration at p <= 6007 with B <= 22 and
      k <= 100 MITM probes; predicted under thirty minutes on one core and peak
      RSS under 500 MB, both reported. No solver, no Groebner basis, no Macaulay
      matrix.
    controls:
      - >-
        NEARBY-OBJECT CONTROL (blocking, must PASS): a correct enumerator on a
        2-torsion-seeded base whose forced total is binomial(2B-t+m-1, m). A
        suite that false-alarms here is disqualified.
      - >-
        FORCED-MISS CONTROL: the pre-registered prediction that E1 to E4 are
        BLIND to D1 must hold. If an enumerator-level check fires on a
        sampler-level defect, the invariants are not measuring what this record
        says they measure and the analysis is wrong.
      - >-
        INDEPENDENCE CONTROL: the E4 re-decider's disjointness from the
        enumerator is established by import-graph and AST-level structural diff,
        not by reading. A shared helper silently makes E4 a tautology.
      - >-
        ORDERING CONTROL: the detection matrix and every forced integer are
        committed to the run directory before any defect is planted, and the
        outputs are compared against the committed file, not the reverse.
      - >-
        NULL DEFECT ARM: one flagged "defect" that changes nothing (a no-op
        refactor). Every invariant must pass. An invariant that fires here has a
        false-positive rate and the suite's usable threshold must be restated.
      - >-
        FLOOR MEASUREMENT: D7 is sized so that E4 fires roughly two times in
        three at k = 100, which measures the floor instead of asserting it. The
        arm is repeated at 20 independent plantings so the detection rate has an
        interval.
    required_metrics:
      - 'E1 total against binomial(2B+m-1,m), exact deviation, per cell'
      - 'E2 negation-symmetry fraction, per cell'
      - 'E3 identity count against B at m = 2, per cell'
      - 'E4 spot-check count k, number of disagreements, and the published detection floor'
      - 'S1 base-point order with factorization witness, distinct-target count, birthday prediction, z-score, dropped-draw count, declared target support'
      - 'the full 7 x 5 detection matrix against the pre-registered matrix, cell by cell'
      - 'D7 detection rate over 20 plantings with a binomial interval'
      - 'nearby-object and null-defect control outcomes'
      - 'import-graph and AST diff receipt for E4 independence'
      - 'certified versus uncertified wall time and peak RSS'
  falsification_conditions:
    - >-
      The unit-relabelling collision does not hold. E1 to E3 would then be
      identifying, E4 could be dropped, and the record is re-scoped to a cheaper
      and stronger suite -- a better outcome than the one proposed.
    - >-
      The suite fires on fewer than five of the seven planted defects. The
      certificate class as specified has low power and the honest deliverable is
      that finding, not a schema.
    - >-
      An enumerator-level invariant fires on D1, the sampler defect. The
      analysis of what each invariant measures is wrong and must be redone
      before any schema is proposed.
    - >-
      The nearby-object control false-alarms. The suite rejects correct
      instruments and is disqualified as written.
    - >-
      E1 deviates from binomial(2B+m-1,m) on a clean cell. Implementation fault;
      nothing is reported from any arm.
    - >-
      Certificate overhead exceeds 5x wall time or 10x memory. The obligation
      cannot be universal and the protocol must scope it, which changes the
      deliverable from "mandatory" to "mandatory below a stated cell size".
    - >-
      D2 replanting does not produce an E1 shortfall of exactly 2B^2 at m = 3.
      Either IDEA-20260805-5ac0a2's multiset count or this record's reading of
      the committed control flow is wrong, and the discrepancy is reported before
      anything else in the batch.

  confounders:
    - >-
      A CERTIFICATE SUITE VALIDATES ITSELF UNLESS THE DEFECTS ARE CHOSEN
      ADVERSARIALLY. Five of the seven planted defects are exactly the ones the
      invariants were designed to catch, which proves nothing on its own; D6 and
      D7 exist because they were chosen to EVADE the suite, and the record's
      credibility rests on them. If a reviewer can name an eighth defect class
      that evades all five checks, that is a successful attack on this record and
      must be recorded as such.
    - >-
      REPLANTED DEFECTS ARE NOT THE HISTORICAL DEFECTS. D1 is a reconstruction
      from a correction record, not the original code path. The reconstruction is
      published alongside its detection result so a reader can judge the
      fidelity, and no claim is made that the historical batch would have been
      saved.
    - >-
      SPOT-CHECK INDEPENDENCE. If the MITM re-decider shares the curve-arithmetic
      module with the enumerator -- which it must, to be comparable -- then a
      defect IN THE CURVE ARITHMETIC is invisible to both. This is a real and
      unremovable blind spot of the design and is stated in the certificate
      rather than patched over; the mitigation is that curve arithmetic is
      separately covered by existing point-order and group-order checks.
    - >-
      OVERHEAD MEASURED ON A WARM CACHE. Wall-time ratios at toy scale are
      dominated by interpreter overhead and are reported as such, with the
      operation counts given alongside so the ratio can be re-derived without
      trusting the timing.
    - >-
      AUTHORSHIP ASYMMETRY. Proposing a certificate suite is cheap and reads as
      rigour. The pre-registered forced misses, the disqualifying nearby-object
      control and the adversarial defects are there so that "the suite is
      decoration" is a reachable and publishable outcome.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT, NO ALGORITHM. This is verification infrastructure
      for one measurement at toy scale.
    - >-
      The certificate class covers EXHAUSTIVE enumeration only. It does not
      weaken, amend or reinterpret docs/claims-and-verification.md's statement
      about budgeted negatives, and any run using a budgeted search must continue
      to report a scoped negative observation with kind none.
    - >-
      A passing certificate says the computation is internally consistent and
      spot-check-consistent. It does not say the decomposition rate is
      interesting, does not license any cross-cell comparison, and does not
      transfer to any other arity, base, curve or scale.
    - >-
      Adopting the schema into templates/research-records.md is a Coordinator
      decision. Nothing here performs it and no hypothesis status is moved.
    - >-
      NOVELTY IS NOT ADJUDICATED. E1 to E3 are adopted from
      IDEA-20260805-5ac0a2 and KN-FIND-007 with credit. The corpus was screened
      by reading the twelve RQ-RELN-001 proposal titles and four of them in full;
      one web search was run this session (for the PKC 2016 paper) and returned a
      PDF whose content could not be extracted. No external literature on
      certified enumeration or defect-injection testing was consulted. Honest
      status: unverified.

  heuristic_assumptions:
    - id: H1
      statement: >-
        A defect that alters the enumerator's membership verdict on a fraction
        eps of targets, chosen independently of the k targets drawn for the E4
        spot check, is detected with probability exactly 1 - (1 - eps)^k, so the
        suite's detection floor at confidence 0.95 is eps = 1 - 0.05^(1/k),
        approximately 3/k for large k.
      rigorous_support: >-
        The RIGOROUS ingredient is elementary: independent Bernoulli trials give
        the stated detection probability exactly, with no approximation. The
        CLASSICAL STATEMENT IMITATED is the rule of three for zero observed
        events in k trials, standard in acceptance sampling. The GAP, and it is
        real, is the independence clause: an adversarial or structured defect can
        correlate with the spot-check sampler -- for instance a defect confined to
        a subgroup while the sampler draws from that same subgroup -- and then the
        formula does not apply. This is why the spot-check targets are drawn from
        the DECLARED target support with a recorded seed and why the certificate
        publishes both.
      validation_plan: >-
        SAMPLE: planted defect D7 at eps in {0.01, 0.03, 0.10}, 20 independent
        plantings each, at k in {30, 100, 300}, at both primes -- 360 planting
        events, each a single exhaustive enumeration in the existing envelope.
        COMPARISON DISTRIBUTION: the measured detection rate against
        1 - (1 - eps)^k, by exact binomial test at the 5 percent level per cell.
        TAIL CHECKS: (a) the cell with the lowest measured detection rate against
        the binomial lower tail at 1/1000; (b) a structured-defect arm where the
        1 percent of flipped targets is confined to a coset rather than chosen at
        random, which is the case the independence clause excludes -- the measured
        detection rate there is reported separately and is expected to be LOWER,
        and if it is not, the independence concern is empirically inert at these
        parameters. RECORDED PARAMETERS: p, class, B, m, eps, k, seed.
        TRANSFER ASSUMPTIONS: none. The floor is a property of k alone and is
        recomputed for each certificate rather than inherited.
    - id: H2
      statement: >-
        For a 2-torsion-free factor base of B distinct x-coordinates on E(F_p),
        the signed point set W = V union -V has size exactly 2B and every size-m
        multiset from W sums to exactly one group element, so the forced total
        binomial(2B+m-1, m) is exact and curve-independent.
      rigorous_support: >-
        NOT HEURISTIC AT ALL, and this entry exists to record that. The double
        count is KN-FIND-007's, established, with measured deviation exactly 0
        over 144 cells; the |W| = 2B step is the lifting argument of
        IDEA-20260805-5ac0a2, which holds precisely because x(P) = x(-P) and
        y is nonzero off the 2-torsion. The only assumption is the 2-torsion-free
        convention, which is a checkable property of the base, not a distributional
        claim, and the 2-torsion-seeded arm exercises the other branch.
      validation_plan: >-
        SAMPLE: every clean cell of the battery, plus the hand-computed p = 101
        fixture at B in {5, 8, 12} and m in {2, 3}. COMPARISON: exact integer
        equality with zero tolerance. TAIL CHECK: not applicable to an exact
        identity; instead the 2-torsion-seeded arm checks the OTHER forced
        constant binomial(2B-t+m-1, m) at t in {1, 2, 3}, so both branches of the
        convention are exercised rather than only the convenient one.
        TRANSFER: the identity is scale-free, so the toy check is a check of a
        derivation and not an extrapolation; nothing about crypto-scale
        decomposition follows and none is claimed.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE IS MOVED. Under
      docs/target-result-profile.md this is explicitly NON-TARGET-CLASS. Its cost
      is O(binomial(2B+m-1,m)) for the enumeration already performed, plus
      O(k * B^ceil(m/2)) for the spot checks and O(min(|mW|, N)) for the counter
      map. Its priority rests entirely on being a correctness precondition for
      the negative half of every P(decomp) number this program reports.
    memory_exponent: >-
      The one real cost: min(|mW|, N) counters instead of a set of |mW| points.
      At the toy cells that is a small constant factor; at N near the memory wall
      the counter map is the binding constraint and the certificate must then be
      emitted in a streaming form or scoped out. Disclosed rather than hidden,
      and measured in the battery.
    best_known: >-
      The incumbent is certificate {"kind": "none"} -- the committed practice for
      every exhaustive decomposition-rate run in this lane -- against which any
      firing invariant is an improvement, and the positive-witness certificate of
      docs/claims-and-verification.md, which this record leaves unchanged and does
      not compete with. For prime-field ECDLP the frontier remains Pollard rho at
      0.886*sqrt(N) time and O(1) memory; untouched.
    hidden_overhead: >-
      The detection floor is the honest hidden cost: a defect touching fewer than
      about 3/k of targets is invisible to E4, so a certificate is a bounded
      statement and must publish its k. A suite quoted without its floor
      overstates itself, and that failure mode is the reason the floor is a
      mandatory schema field rather than a recommendation.
    tradeoff_note: >-
      Direct and quantified: raising k linearly lowers the detection floor as 3/k
      while costing k * B^ceil(m/2) group operations, so the floor is bought at a
      known price and the contract fixes k in advance rather than tuning it after
      seeing the data. No time-memory tradeoff of the cryptanalytic kind; no
      algorithm is produced.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an ATTACK it
    mounts none and is therefore dominated on every axis by every frontier row
    checked: Pollard rho, parallel rho with distinguished points, multi-target
    rho, BSGS, van Oorschot-Wiener at memory w, the preprocessing/advice frontier,
    and MITM two-table index calculus. As a SET OF FORCED IDENTITIES it is
    strictly dominated by IDEA-20260805-5ac0a2, which derived E1, E2 and E3 first
    and is credited; this record adds only the packaging, the collision proof
    that they are insufficient, the sampler-side check, and the measured power.
    As a CONSERVATION STATEMENT it is dominated by KN-FIND-007, which it quotes.
    As a CERTIFICATE CLASS FOR EXHAUSTIVE NEGATIVES no prior record exists in this
    corpus -- the committed practice is kind none -- so nothing dominates it
    there. As DEFECT-INJECTION METHODOLOGY it is an application of standard
    mutation testing and claims no methodological novelty; stated so none is
    implied. Not null on any axis.
  sota_delta: >-
    Zero on every ECDLP cost axis. Quantified deliverable: the negative half of a
    P(decomp) measurement moves from zero independent checks (committed practice:
    certificate kind none) to four, three of which are exact integers computable
    from (B, m) without touching the curve and one of which carries a published
    detection floor of about 3/k; an explicit proof that the three cheap
    invariants are jointly non-identifying, with the evading enumerator exhibited
    rather than hypothesized; a pre-registered 7 x 5 detection matrix including
    two forced misses; and a measured detection rate for a 1 percent-reach defect
    at three values of k, which is the number the schema needs and does not have.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      One multiplicity-counting enumerator, one disjoint MITM re-decider, seven
