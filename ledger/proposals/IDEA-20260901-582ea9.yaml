  title: >-
    SHAPE-ONLY REDUCED STAGE 1 - does the HIT-COUNT EXCESS itself survive S-box dilution? EV-AES-896ef2
    closed the t=1 excess-zero X-statistic lane in cell (amask=1, smask=1) at powered 2^32 (PX-DEAD,
    realized exclusion frontier rho_80 = 0.1183); EV-AES-241790 closed the same lane's 2^30 reading
    (RX-DEAD). Both closures explicitly leave the ramp-shape question (IDEA-20260901-363851 C3) open
    and gated: the observable they killed is the zero-byte CONTENT of e = (q0^q1)^(p0^p1) on hit
    trials, not the COUNT of W>=1 hit trials. DEC-20260901-c3d261 RANK 1 therefore dispatches this
    shape-only design: measure the per-point hit count h(k) (and its excess ratio against the frozen
    excess_E = 2^30 comparator convention) along the frozen nested position family S_k at fixed r=5
    alive, with r=6 known-dead reference arms as controls, at the campaign-standard 2^30 exposure
    where the comparator, the analytic null (1.0 hit), and the dead band (<= 8) are ALL pinned.
    THIS IS EXPLICITLY NOT AN EXCESS-ZERO CARRIER CLAIM: the X statistic is not tested at any interior
    point, no rho-exclusion is claimed anywhere, and every e field the certified instrument already
    logs rides as report-only enabling data under an explicit no-reopen clause. Minimal informative
    k-point subset {0, 1, 2, 8, 16}: k=1 is the STEP-vs-GRADUAL discriminator (~8 sd separation at
    2^30), k=2 is the frozen STEP confirmation conjunct, k=8 locates the transition and sentinel-
    detects non-monotone dips, k=0/k=16 are the re-seated blocking anchors. Preregistered exhaustive
    ORDERED cascade with explicit precedence clause (the f8294e repair applied prospectively):
    SH-GATE-FAIL > SH-F6 > SH-ANCHOR-FAIL > SH-RESEAT-FAIL > SH-DEAD > SH-OTHER-NONMONO >
    SH-STEP (= SHAPE-FLAT: count excess persists undecayed at residual level) > SH-GRADUAL
    (= SHAPE-DECAY: the shortfall from the affine limit decays jointly with dilution) >
    SH-OTHER-RESIDUAL (declared complement). Dead-arm anchor analyzed BEFORE any alive reading; if
    the gate or any anchor fires, halt/repair (proves-too-much control built in). One BLOCKING
    precondition the design cannot self-discharge: the certified build refuses interior S_k arms
    because the co-varied key schedule's SubWord table for position-dependent S_k is unpinned; this
    record proposes the TPOS[0] pin (identity schedule at k=0, AES schedule at all k >= 1 - the
    unique pin keeping BOTH committed endpoints receipt-exact) and requires a Coordinator pin
    decision record before the executor widens the arm surface. Interior readings are identical
    under the two endpoint-preserving candidate pins, disclosed. Budget: two producer batches, 5 + 6
    invocations, ~3.8-4 h under the binding handoff baseline (16200 s cap); measured campaign
    hardware ~15-25 min (optimistic-relative, disclosed). Stages 1a/1b of IDEA-20260901-363851 as
    written there (the carrier ramp) are EXPLICITLY NOT spent. Toy tier only; no deployed-AES claim;
    no published-cryptanalysis comparison in either direction (RQ-AES-003 R3).

  object: >-
    TRACKED OBJECT - THE SHAPE OF THE r=5 HIT-COUNT CURVE OVER THE FROZEN DILUTION FAMILY, with the
    carrier question out of scope by construction. The sealed verdict lineage (EV-AES-ec53f1 hardened
    by EV-AES-b2910a) established, at empirical-law coverage r in {2,3,5,6,7}, that the single factor
    separating the alive-at-r=6 reading (affine: hits = 2^30, excess ratio 1.0 exact against the
    frozen excess_E = 2^30 comparator) from the dead-at-r=6 reading (AES: 2 hits) is the S-box, and
    that the r=6 death round is NOT carried by the pair-difference map itself. At r=5 alive, the AES
    seat (k=16) reads 14/19 hits at 2^30 across seeds 531001/531002 against analytic null 1.0 - a
    tiny but committed hit-count excess. NO committed record has ever measured any INTERIOR point of
    the dilution family: bcb117 filed the ramp and never ran; IDEA-20260901-363851 Stage 0 measured
    only the t=1 and r=6 seats (EV-AES-732f71); its Stages 1a/1b were withheld, repaired around, and
    are now explicitly not spent by this record. The tracked object is the curve
    k -> h(k) = number of W>=1 hit trials at fixed (r=5, amask=1, smask=1, 2^30, seed family), for
    k in the minimal subset {0, 1, 2, 8, 16}, reported per point as the tuple (h(k), excess ratio
    h(k)/excess_E under the frozen excess_E = 2^30 convention, excess over the run-internal analytic
    null expectation, Garwood 95% CI). The endpoints are committed anchors re-seated in-block: k=0
    (identity everywhere - the affine limit, the ramp's zero: hits = 2^30, W = 3 on 100% of
    nontrivial trials) and k=16 (full AES table - the J5 seat, residual band [6,30]). The interior
    points are the first measurement of their kind in the campaign. WHAT IS DELIBERATELY NOT THE
    OBJECT: the zero-byte content of e on hits (the X statistic lane, closed at t=1 by EV-AES-896ef2
    at rho_80 = 0.1183 and by EV-AES-241790 at rho_80 = 0.225); the hit-vs-miss wt(e) carrier split
    (363851 C1/C2, gated, unspent, and NOT revived here); effects acting only through the envelope's
    extent; other probe cells; other seeds beyond the named controls.

  lossy_projection_test: >-
    The projection (S_k, key, seed, stream) -> h(k) discards EVERYTHING about each trial beyond its
    W>=1 outcome: the e vectors, the vanishing-word masks, the zero-byte structure of hits, and all
    non-hit trials beyond their contribution to the run-internal null rate. Fibres are enormous (any
    redistribution of hit-internal structure shares one count). Genuinely lossy - and the loss is
    the point: this is the shape observable the excess-zero closures explicitly left open, measured
    with the coarsest statistic that can carry it. THE SHARP EDGE THIS RECORD OWNS: the k=0 endpoint
    (h = 2^30) and the k=16 endpoint (h ~ 14-19) force the curve to traverse ~9 orders of magnitude
    of per-trial hit probability across 7 family points; with only 3 interior points the curve's
    fine structure is unreadable BY DESIGN, and the preregistered bands (NULLBAND/RESIDUAL/AMBIGUITY/
    THRESHOLD) plus the band-level monotonicity sentinel are exactly the resolution this exposure
    supports - within-band trends are the declared obstruction, not a smoothing opportunity. A
    second owned loss: the schedule pin (below) means every interior reading co-measures the AES key
    schedule with the diluted round tables; the dose label k does not separate schedule from
    round-function nonlinearity at interior points, stated rather than absorbed.

  claim: >-
    Three statements C1S-C3S, each with a determinate reading under the preregistered cascade, and
    NO carrier clause anywhere.

    (C1S) DECIDABILITY OF THE PRIMARY SHAPE JOINT. At k=1 (the minimal-dose point), the 2^30
    exposure separates the STEP prediction (h(1) in the residual band, lambda ~ 13-19) from the
    GRADUAL prediction (h(1) >= 100) by ~8 Poisson sd: design-time P(h >= 41 | lambda = 19) = 8.1e-6
    and P(h <= 40 | lambda = 100) = 7.5e-12 (fresh computation this session). The cascade returns
    EXACTLY ONE branch for the whole curve (exhaustive by construction: SH-OTHER-RESIDUAL is the
    declared complement), under anchor-first binding order.

    (C2S) THE SHAPE VERDICT (whichever fires). SH-STEP / SHAPE-FLAT: the count excess persists
    UNDECAYED at residual level through every tested interior dose (h(1) <= 40 AND h(2) <= 40, band
    sequence non-rising) - the excess-zero statistic is dead at t=1 but the COUNT is alive and flat:
    global class fragility, one AES byte anywhere suffices to hold the law at the residual level.
    SH-GRADUAL / SHAPE-DECAY: the shortfall from the affine limit decays jointly with dilution
    (h(1) >= 100, band sequence non-increasing in k) - the nonlinearity dose is a tunable knob and
    the excess erodes gradually as the S-box is diluted away. SH-DEAD: no count excess at any
    powered interior point (h <= 5 at k = 1, 2, and 8) - the r=5 hit-count excess does not survive
    dilution at all and lives only at or near the full table. Each verdict is scoped to the frozen
    family, one probe cell, toy tier, at the declared per-point sensitivity floors.

    (C3S) THE HONEST OBSTRUCTION (always reported). Per-point sensitivity floors declared BEFORE
    any reading, point by point, as the red team's closure recommendation requires: at 2^30 the
    per-point detection floor for a hit-rate excess is lambda_80 ~= 8.0 and lambda_95 ~= 10.5 hits
    per 2^30 (design-time; executor recomputes at realized null rate); within-residual-band trends
    (e.g. lambda = 14 vs lambda = 30) are NOT resolvable at this exposure (Garwood 95% CIs
    [7.6, 23.5] vs [20.2, 42.8] overlap); NO rho-exclusion of any kind is claimed at any interior
    point (the X statistic is not tested there), and the measured t=1 frontier rho_80 = 0.1183 of
    EV-AES-896ef2 is consumed as the standing sensitivity-floor control reading of the closed lane,
    reported beside the shape verdict, never merged with it.

    (WHAT IS NOT CLAIMED) No statement about full-round or deployed AES; no published-frontier
    comparison in either direction (R3); no carrier clause of e in any form (the excess-zero lane
    stays closed at t=1 and is NOT reopened at interior points; the one-sided linear candidate
    IDEA-20260901-04606c route (ii) stays out of scope, named); no claim that the 5-point subset
    exhausts the family's shape (k = 4, 12 are named refinement successors); no claim about other
    cells, schedules beyond the pin, or seeds beyond the named controls; no rho-exclusion anywhere.

  mechanism: >-
    The sealed verdict's single-factor contrast (EV-AES-ec53f1 OBS-FE0-3/OBS-FE0-4, hardened by
    EV-AES-b2910a OBS-999-1: the r=6 random-bijection arm reads dead) says death-vs-life at r=6
    tracks the S-box within the tested subclass; it does NOT say how the surviving r=5 hit-count
    excess depends on the nonlinearity DOSE. Three candidate readings, all fully specified before
    any interior arm runs: (M1) GLOBAL FRAGILITY - the identity law's failure is triggered by any
    nonlinear byte anywhere, so every interior point reads at the residual level and the law
    recovers only at k=0 (SH-STEP); this is bcb117's class-fragility reading. (M2) TUNABLE DOSE -
    each additional AES byte erodes the law by a finite amount, so the hit count rises gradually
    as k falls (SH-GRADUAL); the carrier-coupling family of readings (04606c H2) predicts this
    variant if the excess rides on trials that are accidentally affine-compatible, since dilution
    restores affine-compatibility in a growing trial fraction. (M3) FULL-TABLE COLLECTIVITY - the
    excess requires the composed action of all 16 AES bytes, so ANY dilution destroys it down to
    null level and only k=16 carries it (SH-DEAD; a non-monotone curve by construction, rising
    again from k=8 to k=16). ADVERSE EVIDENCE ON RECORD, stated up front: the excess at t=1 is tiny
    (14-19 hits per 2^30 vs null 1.0), its excess-zero CONTENT is dead at powered 2^32, and seed
    variance at k=16 is ~ +/-16% (14 vs 19); the shape question survives the closures only because
    the count observable is logically independent of the content observable - a count can be alive
    while its zero-byte content is null. The design's value is decidability of M1/M2/M3 at stated
    power, not confirmation of any of them.

