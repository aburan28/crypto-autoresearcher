      subset {0, 1, 2, 8, 16}, 2^30 per point, schedule pin as decided. No claim beyond.
    resource_check:
      examined: true
      reading: >-
        Each unreadability is another lane's asset. (i) The per-point sensitivity floor is exactly
        the control reading TASK-20260901-7df96a RT2-E item 6 mandated ('a shape-only reduced
        Stage 1 must state point by point what rho it can exclude before claiming anything'): this
        record declares per-point hit-rate floors and an explicit NO rho-exclusion at interior
        points, consuming the measured t=1 frontier rho_80 = 0.1183 as the standing floor of the
        closed lane. (ii) SH-STEP's flat residual across dose is the input the layer autopsy
        (IDEA-20260901-69912d) reads as global fragility - one AES byte anywhere suffices - pointing
        its mutation battery at the round-function layer rather than the schedule. (iii)
        SH-GRADUAL's located transition (between which tested k-values the band falls) names the
        sensitive positions for 69912d's successor family and for the k=4/k=12 refinement - the
        obstruction's band granularity is their hypothesis-generating coordinate. (iv) SH-DEAD's
        full-table collectivity is the hypothesis the RANK 5 decay-specific design (EV-AES-5478a0
        confound route) reads as an asset. (v) Within-band indistinguishability converts directly
        into the RANK 6 pooled/higher-exposure route's reason to exist, priced here so the
        Coordinator can re-rank it against the refinement successors. All five readings named in
