    - >-
      FS2 (MAIN SHAPE FALSIFIER - falsifies the fragility reading). SH-GRADUAL fires: then the
      global-fragility reading (M1) is falsified within the tested scope and the dose is a tunable
      knob; the located transition names the sensitive-position successor for the layer-autopsy
