    - >-
      FS3 (MAIN SHAPE FALSIFIER - falsifies survival-under-dilution). SH-DEAD fires: the r=5
      hit-count excess does not survive dilution at any tested interior point (M3 full-table
      collectivity, or a shape below the per-point floor - the two are separated only by the named
      k=12 successor; disclosed with the verdict).
    - >-
      FS4 (BLOCKING - ramp anchor). F3: k=0 re-seat fails -> invalid_measurement; halt; repair
      (rule 5). Cross-field: also indicts the widened build's identity path against the committed
      affine anchor.
    - >-
      FS5 (BLOCKING - gate/instrument). Gate-0x rebuild identity fails (the widening perturbs the
      trial map), determinism fails, KAT pins fail, source-diff finds any change beyond the pinned
      surface widening and receipt pin-label fields, freeze re-verification fails, or hit_overflow
      > 0 on an analysis-bearing receipt. invalid_measurement; repair (rule 5); never evidence
      about shape. Repair route named: fix the widening, or return to idea generation for a
      campaign-build-based instrument as a NEW proposal (lineage change = new frozen spec).
    - >-
      FS6 (ESCALATION TRIPWIRE, not a defect). F6: the r=6 dead anchor reads >= 9 hits: a boundary
      falsifier of the sealed verdict (future committed r=6 excess). Halt; record; escalate to a
      claim-changing review (rule 12). The shape claims are suspended pending review.
    - >-
      NOT A FALSIFICATION - budget halts (rule 5); a k=1 ambiguity-band reading (determinate
      SH-OTHER-RESIDUAL branch with named successor, never a defect); within-band inversions
      (below declared resolution); timeouts/crashes (rule 5); underpowered per-point readings
      below the declared floors (recorded, never tested beyond the band rule).

