    - id: H1-S
      statement: >-
        SHAPE SURVIVAL: the r=5 hit-count excess survives dilution in a determinate, branch-decidable
        way at 2^30 per point - i.e. the curve lands in SH-STEP, SH-GRADUAL, or SH-DEAD rather than
        in the ambiguity band or a gate failure.
      rigorous_support: >-
        RIGOROUS PART - the branch separation at the primary joint is a Poisson computation
        (fresh-code design-time tables this session, cross-checked against the frozen bands); the
        cascade is exhaustive and ordered by construction. WHAT IS HEURISTIC is the shape itself:
