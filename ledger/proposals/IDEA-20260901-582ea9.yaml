  schedule_pin:
    status: BLOCKING PRECONDITION - requires a Coordinator decision record before execution
    the_unpinned_question: >-
      For interior k the family S_k is position-dependent, so there is NO single global S-box for
      the key schedule's SubWord to use; the certified build refuses interior arms exactly on this
      (source-read this session). The pinned 363851 convention ('SubWord uses the current global
      SBOX') is well-defined at the endpoints only. A pin must be chosen before the surface is
      widened; this is a Coordinator act, not an executor or idea-generator act.
    proposed_pin: >-
      PIN-T0 (proposed): SubWord uses TPOS[0], the table at the FIRST position of the frozen order.
      Since position 0 enters P_k at k=1, this gives the identity schedule at k=0 and the AES
      schedule at every k >= 1. Rationale: it is the UNIQUE pin under which BOTH committed endpoints
      remain receipt-exact in-block (k=0 re-seat reproduces the committed affine anchor's schedule;
      k=16 re-seat reproduces the L1-AES-R5-P30 AES schedule), so every inherited gate (Gate-0x
      rebuild, F3 ramp anchor, F5 in-block re-seat) runs unchanged. Deterministic, nested, no
      data-dependent choice. Disclosure: the schedule switches identity -> AES between k=0 and k=1,
      so h(1) co-measures the first AES round-function byte AND the schedule switch; stated, not
      separated (the schedule-separated variant is the named successor control, as in 363851).
    alternative_pin: >-
      PIN-AES (alternative the Coordinator may choose): SubWord uses the AES table at every k
      including k=0 (the fixed-AES-schedule variant). Consequence: all interior readings are
      IDENTICAL to PIN-T0 (for k >= 1 both pins give the AES schedule), but the k=0 re-seat no
      longer matches the committed affine receipt's key; the F3 anchor is then verified by its LAW
      reading (hits = 2^30, W = 3 - which is key-independent within the affine class, EV-AES-b2910a
      OBS-999-2) rather than by receipt identity. If PIN-AES is chosen, the F3 wording of this
      record is amended to the law-reading form in the same decision record.
    interior_equivalence: >-
      PROVEN FROM SOURCE THIS SESSION: PIN-T0 and PIN-AES differ only at k=0; for every interior
      and k=16 seat both set the global SBOX to the AES table, hence identical schedules, identical
      trial streams, identical readings. The shape verdict over {1, 2, 8, 16} is pin-invariant;
      only the k=0 anchor's verification mode depends on the pin. No third endpoint-preserving pin
      exists (a pin preserving the k=16 seat must use the AES schedule there; the only freedom is
      k=0's schedule, which is binary: identity or AES, since SubWord needs one global bijection).

  shape_statistic:
    primary_observable: >-
      h(k) = number of W>=1 hit trials among the nontrivial trials of the arm at family point k,
      fixed (r=5, amask=1, smask=1, log2N=30, seed family, 4 threads). This is the SAME counter the
      committed lineage has always logged (whist / W_ge1_nontrivial); no new statistic is defined.
      REPORTED PER POINT, whatever the outcome: (i) h(k); (ii) excess ratio h(k)/excess_E under the
      frozen excess_E = 2^30 comparator convention (EV-AES-ec53f1); (iii) excess over the analytic
      null expectation lambda_0 = 1.0 hit per 2^30 (run-internal accidental-hit rate recomputed
      from the arm's own class counters, reported beside the design-rate value); (iv) exact Garwood
      95% CI on the per-trial rate; (v) active/inactive word split W_ge1_by_word; (vi) hit_overflow
      (must be 0). SECONDARY / REPORT-ONLY: every e field the certified instrument already logs
      (ewhist_*, per-hit detail with zero_mask_e, the X-statistic inputs) is retained as enabling
      data with an explicit NO-REOPEN clause: no excess-zero test is preregistered, computed for
      decision, or reported as a reading at any interior point; the t=1 X lane is closed by
      EV-AES-896ef2 and stays closed; any downstream paraphrase reporting these fields as a carrier
      reading violates this record's scope.
    bands: >-
      FROZEN PER-POINT BANDS (inherited from 363851 Stage 1, rebinned for the 2^30 comparator):
      NULLBAND h <= 5 (consistent with analytic null 1.0 at >= 99.9% per-point power conventions);
      RESIDUAL-BAND 6 <= h <= 40 (covers the committed 14/19 AES seats and the ~13-15 random-
      bijection level with Poisson headroom); AMBIGUITY-BAND 41 <= h <= 99; GRADUAL-THRESHOLD
      h >= 100 (~8 sd above the residual band at 2^30). bandrank: NULLBAND = 0, RESIDUAL = 1,
      AMBIGUITY = 2, THRESHOLD = 3.
    band_level_monotonicity_sentinel: >-
      The curve over tested interior points {1, 2, 8, 16} is BAND-RISING iff there exist tested
      points k_a < k_b with bandrank(h(k_b)) > bandrank(h(k_a)) - i.e. the hit rate rises by a
      WHOLE BAND as the nonlinearity dose rises. Within-band inversions (e.g. h = 15 then 17, both
      RESIDUAL) do NOT fire the sentinel: count-level monotonicity between two same-band points is
      below the per-point resolution at 2^30 (obstruction block), and the sentinel deliberately
      operates only at the resolution the exposure supports.

  k_point_design:
    selected_subset: [0, 1, 2, 8, 16]
    justification: >-
      MINIMAL INFORMATIVE SUBSET. k=1: the minimal-dose point and the PRIMARY shape joint - STEP
      predicts residual band (lambda ~ 13-19), GRADUAL predicts >= 100 hits, separated by ~8 sd at
      2^30; one arm decides the primary branch. k=2: the frozen STEP confirmation conjunct (363851:
      STEP = k=1 AND k=2 both <= 40) - guards against a single-point coincidence at k=1 and keeps
      the verdict comparable to the frozen binning. k=8: the half-dose midpoint - locates the
      transition under GRADUAL (does the drop sit between k=2 and k=8, or between k=8 and k=16?)
      and is the sentinel point for non-monotone dips (a null-band reading at k=8 between residual
      readings at k=2 and k=16 is the band-rising tell of full-table collectivity or an instrument
      fault). k=0 and k=16: the re-seated BLOCKING anchors (ramp zero and known-alive seat). EXCLUDED
      FROM THE MINIMAL DESIGN: k=4 and k=12 - each buys one extra band-resolution point on the curve
      at ~27 min baseline each; neither changes any branch condition of the cascade (verified: no
      branch conjunct mentions k=4 or k=12), so they are named refinement successors, spent only if
      the Coordinator re-ranks after a GRADUAL or OTHER verdict (locating the transition more
      finely). This is what makes the design REDUCED relative to 363851 Stages 1a/1b.
    trials_per_point: >-
      2^30 nontrivial trials per point, one arm each. Justification (power_statement): 2^30 is the
      campaign-standard decisive exposure where the comparator, the analytic null 1.0, and the dead
      band <= 8 are all pinned, so every reading is directly comparable to a committed quantity at
      matched exposure without rescaling; the primary joint is already separated by ~8 sd there, so
      escalation per point buys nothing for the branch decision (it would only buy within-band
      resolution, which the design declares out of scope and prices in the obstruction block). No
      pooling across points; no multi-trial repetition per point (seed-variance control is the
      named successor, not spent here).

  design_time_power:
    computation_provenance: >-
      DESIGN-TIME COMPUTATION THIS SESSION (fresh code, /Volumes/SSD990/llm/tmp/opencode/
      idea-shapeonly/, outside the repository; Poisson CDFs by direct summation, Garwood CIs by
      Wilson-Hilferty chi-squared quantiles; executor re-derives from the definitions). All numbers
      below are design-time predictions at the design-rate null lambda_0 = 1.0, to be recomputed at
      each arm's run-internal null rate.
    per_point_detection_floor: >-
      One-sided rejection toward excess at h >= 6 (NULLBAND complement): size P(h >= 6 | lambda=1)
      = 5.94e-4 (very conservative, discreteness). Power: 0.084 at lambda=3; 0.384 at 5; 0.554 at
      6; 0.699 at 7; 0.809 at 8; 0.884 at 9; 0.933 at 10; 0.950 at 10.5; 0.963 at 11; 0.989 at 13;
      0.997 at 15; 0.9998 at 19. DECLARED PER-POINT SENSITIVITY FLOORS: lambda_80 ~= 8.0 hits per
      2^30; lambda_95 ~= 10.5 hits per 2^30 - i.e. a point reading NULLBAND excludes a per-point
      hit-rate excess >= ~8-10.5 at 80-95% power, and excludes NOTHING below that (a true lambda=6
      point reads NULLBAND 45% of the time).
    primary_joint_k1: >-
      STEP region (lambda in 13-19): P(h <= 40) >= 0.99999; P(41 <= h <= 99) <= 8.1e-6 (lambda=19);
      P(h >= 100) ~ 0. GRADUAL region: P(h <= 40 | lambda=100) = 7.5e-12; P(h <= 40 | lambda=120)
      = 2.1e-17. AMBIGUITY-BAND PROBABILITY (disclosed honestly): at lambda=100 exactly, P(41 <= h
      <= 99) = 0.487 - a true effect sitting exactly ON the frozen threshold lands in the ambiguity
      band ~half the time; at lambda=120 it is 0.028, at lambda=150 it is 5.9e-6. The threshold is
      a frozen bin boundary, not a detection limit; an ambiguity outcome is a determinate branch
      (SH-OTHER-RESIDUAL) with a named successor, never a force-bin.
    shape_dead_branch_power: >-
      Under pure null at all interior points: P(all three points h <= 5) = 0.998. Under residual
      lambda=15 everywhere: P(misfire SH-DEAD) = 2.2e-8. At the band edge lambda=6: P(all three
      h <= 5) = 0.0885 - a lambda=6 interior population mimics SH-DEAD ~9% of the time; the
      per-point floor above is the honest limit, disclosed with any SH-DEAD verdict.
    honest_non_detection: >-
      WITHIN-RESIDUAL-BAND TRENDS ARE NOT DETECTABLE AT THIS DESIGN: Garwood 95% CIs at 2^30 are
      h=14 -> [7.6, 23.5]; h=19 -> [11.4, 29.7]; h=30 -> [20.2, 42.8]; h=100 -> [81.4, 121.6].
      A flat-residual curve (lambda ~ 14 everywhere) and a slow-within-band decay (lambda falling
      30 -> 19 -> 14 across points) produce overlapping CIs at every point; discriminating them
      needs ~4x exposure per point (2^32) or 4-seed pooling per point (~4 arms each), i.e. >= ~2 h
      baseline per point - priced in the obstruction block, named as successor, NOT spent. Count-
      level monotonicity between same-band points is likewise below resolution, which is why the
      sentinel operates at band level only.

