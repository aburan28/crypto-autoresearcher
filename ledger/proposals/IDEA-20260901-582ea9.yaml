  preregistered_decision_rule: >-
    Committed in S0-1 before any arm. ORDERING (BINDING): S0-5 dead anchor is run and ANALYZED
    BEFORE any alive reading; S0-6 ramp-zero anchor before any interior point; within S1, the k=16
    re-seat is ANALYZED FIRST, then k=1, k=2, k=8; the shape verdict is composed only after all
    interior points are read, under the cascade below. BRANCH CASCADE - exhaustive, evaluated in
    this FIXED ORDER, which IS the branch-precedence clause: (1) SH-GATE-FAIL: any integrity gate
    fails (S0-2 KAT, S0-3 freeze re-verification, S0-4 Gate-0x identity, S1-5 determinism, S1-6
    digest/source-diff, or hit_overflow > 0 on any analysis-bearing receipt) -> invalid_measurement;
    HALT; repair (rule 5); never evidence about shape. (2) SH-F6: dead anchor reads hits >= 9
    (scaled tripwire at the frozen 2^30 dead band 8) -> boundary falsifier of the sealed verdict;
    HALT in-batch flow; escalate to claim-changing review (rule 12); no interior reading admitted.
    (3) SH-ANCHOR-FAIL: k=0 re-seat fails (hits != 2^30, or any nontrivial trial with W != 3, or
    excess ratio != 1.0) -> F3 ramp-anchor indictment; HALT; no interior reading admitted; never
    evidence about shape (rule 5). (4) SH-RESEAT-FAIL: k=16 re-seat reads outside [6, 30] -> F5
    indictment of THIS record's widened table path (the committed measurements stand); HALT;
    interior readings are recorded but no shape verdict is composed; repair. (5) SH-DEAD:
    h(1) <= 5 AND h(2) <= 5 AND h(8) <= 5 -> no hit-count excess at any powered interior point;
    the r=5 count excess does not survive dilution within the tested family (it exists only at or
    near k=16, which passed the re-seat gate); recorded with the per-point floors and the named
    successor (finer dose resolution near k=16: k=12 first). (6) SH-OTHER-NONMONO: not SH-DEAD,
    and the band sequence over {1, 2, 8, 16} is BAND-RISING (some k_a < k_b with bandrank(h(k_b))
    > bandrank(h(k_a))) -> non-monotone curve; recorded as measured with the rise located; named
    successor (k=4 to interpolate the rise, or instrument review if the rise is k=8 NULL -> k=16
    RESIDUAL, which also trips the F5-adjacent scrutiny of the midpoint table path). (7) SH-STEP
    (= SHAPE-FLAT): band sequence non-rising AND h(1) <= 40 AND h(2) <= 40 -> the count excess
    persists UNDECAYED at residual level through every tested interior dose; global class
    fragility within the frozen family; the excess-zero statistic is dead at t=1 (EV-AES-896ef2)
    but the COUNT is alive and flat - recorded as a complete scoped result with per-point floors.
    (8) SH-GRADUAL (= SHAPE-DECAY): band sequence non-rising AND h(1) >= 100 -> the shortfall from
    the affine limit decays jointly with dilution toward k=0 (the hit-count excess over the null
    comparator grows gradually as the dose falls, with no flat residual plateau and no band rise);
    tunable-dose reading; recorded with the located transition (where the band falls between tested
    points) and the named refinement successors k=4/k=12. (9) SH-OTHER-RESIDUAL: DECLARED
    COMPLEMENT - any outcome matching none of the above (in particular h(1) in the AMBIGUITY band
    41-99; or h(1) <= 40 with h(2) in 41-99 without a band rise; or h(1) >= 100 with a band rise
    already excluded but h(2) also >= 100 and the curve flat at threshold) -> recorded as measured,
    never force-binned; named successors preregistered: k=1 second-seed arm at 2^30 and/or one 2^32
    k=1 arm (the 363851 ambiguity escalation), Coordinator re-rank decides. Budget halts are
    resource_exhaustion, NEVER readings (rule 5). Per-point tuples and the no-reopen clause apply
    in every branch.

  branch_precedence_clause: >-
    RESTATED STANDALONE (the mandatory clause, per the f8294e precedent applied prospectively):
    this record's decision rule is an EXHAUSTIVE ORDERED CASCADE (SH-GATE-FAIL > SH-F6 >
    SH-ANCHOR-FAIL > SH-RESEAT-FAIL > SH-DEAD > SH-OTHER-NONMONO > SH-STEP > SH-GRADUAL >
    SH-OTHER-RESIDUAL) committed in S0-1 before any arm runs. By construction no two branches can
    literally match the same outcome: branches 5-8 are mutually disjoint on their conjuncts
    (SH-DEAD requires all interior h <= 5; SH-OTHER-NONMONO requires a band rise and precedes the
    monotone-conditional branches; SH-STEP requires h(1) <= 40 while SH-GRADUAL requires h(1) >=
    100), and SH-OTHER-RESIDUAL is the declared complement. THIS REPAIRS A VERIFIED DEFECT IN THE
    FROZEN 363851 WORDING: under 'STEP = k=1 and k=2 both <= 40; OTHER = everything else
    (thresholds, non-monotone, intermediate)', the curve h = {15, 14, 2, 16} over {1, 2, 8, 16}
    literally matches BOTH STEP (first two conjuncts) and OTHER (non-monotone), the exact
    RX-WEAK-b2/RX-DEAD overlap pattern of 026d6a (EV-AES-241790 OBS-5ED-6). Repair adopted from
    the red team's RT-B wording: (a) the cascade is exhaustive and ordered, so no overlap can
    recur; (b) the dead/anchor/gate branches precede all shape branches (dead-arm-first
    discipline); (c) SH-DEAD precedes SH-OTHER-NONMONO because its defining conjunct (no excess at
    ANY powered interior point) is strictly more specific than generic non-monotony - whenever a
    more-specific-branch and a more-general-branch description both fit, the more specific governs
    the verdict and the more general branch's named successor SURVIVES as the revisit condition,
    never silently preempted; (d) the sentinel's band-level resolution is the declared granularity
    of the monotonicity conjuncts, so within-band inversions can never resurrect an overlap
    argument. The clause binds this record's own rule and is carried verbatim into the S0-1
    preregistration file.

  test_boundary: >-
    Toy tier; r=5 for all ramp arms (one r=6 known-dead reference arm); the frozen nested position
    family S_k, minimal subset {0, 1, 2, 8, 16}, not the space of all S-boxes and not even all
    family points (k=4, 12 named successors); one probe cell (amask=1, smask=1); bijective tables
    only by construction (position dilution between two bijections); one key per seed family under
    the schedule pin (the reading is about the cipher-with-pinned-schedule, stated; schedule-
    separated statements out of scope); the modified ciphers actually run, never AES beyond its own
    seat. The strongest licensed sentences: 'within the tested nested position family at the pinned
    probe cell, the r=5 hit-count excess persists undecayed at residual level through k = 1, 2, 8'
    (if SH-STEP), '...decays jointly with dilution' (if SH-GRADUAL), '...does not survive dilution
    at any tested interior point' (if SH-DEAD) - NEVER 'any S-box', never a carrier sentence about
    e, never a rho-exclusion sentence, never anything about full-round or deployed AES; no
    published-frontier comparison in either direction (R3).

