        below are carried from bcb117/363851, unchanged by the excess-zero closures (those closures
        act on the content observable, not the count). DISTRIBUTION IMITATED - none named; the
        interior arms ARE the validation, stated so a SH-GRADUAL outcome is recognized as M2
        winning.
      validation_plan: >-
