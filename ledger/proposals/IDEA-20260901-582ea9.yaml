  obstruction:
    quantity: >-
      The readability of the shape curve at 2^30 per point: the minimum detectable per-point
      hit-rate excess lambda (at 80/95% power) and the within-band indistinguishability threshold,
      over the frozen family subset {0, 1, 2, 8, 16}.
    measured_value: >-
      Design-time (this session, fresh Poisson/Garwood computation; executor re-derives): per-point
      detection floor lambda_80 ~= 8.0 and lambda_95 ~= 10.5 hits per 2^30 at design-rate null
      (size 5.94e-4 at h >= 6); a lambda=6 population evades detection 45% of the time per point.
      Within-residual-band discrimination: Garwood 95% CIs h=14 -> [7.6, 23.5] and h=30 ->
      [20.2, 42.8] OVERLAP, so flat-vs-slow-within-band is below resolution at 2^30; resolving it
      costs ~4x exposure per point (2^32, ~108 min baseline each) or 4-seed pooling per point.
      Ambiguity-band mass at the GRADUAL threshold: P(41 <= h <= 99 | lambda=100) = 0.487. Error
      bars: exact Poisson at stated lambda; Garwood CIs approximate (Wilson-Hilferty). Compare the
      standing closed-lane frontier consumed as control reading: rho_80 = 0.1183 at t=1
      (EV-AES-896ef2) - a DIFFERENT observable's floor, reported beside, never merged.
    runs_read_from: >-
