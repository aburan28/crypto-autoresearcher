    This is the EXECUTION DESIGN of the campaign's own named successor question: DEC-20260901-c3d261
    RANK 1 names exactly this shape-only reduced design; EV-AES-896ef2's unresolved_confounds and
    TASK-20260901-7df96a RT2-E item 6 name the ramp-shape question as surviving, gated, with
    per-point sensitivity floors mandatory; IDEA-20260901-363851 C3 inherits the STEP/GRADUAL/OTHER
    binning from bcb117. This record contributes what none of those contain: (i) the minimal
    informative k-point subset with per-point power justification (no prior record prices the shape
    discrimination); (ii) a precedence-repaired ordered cascade whose branches are disjoint by
    construction (the frozen 363851 STEP/OTHER wording OVERLAPS on non-monotone residual curves -
    verified this session: h = {15, 14, 2, 16} literally matches both STEP's conjuncts and OTHER's
    non-monotone clause; this record's band-level sentinel ordering repairs it prospectively, per
    the f8294e precedent); (iii) the schedule-pin analysis (the certified build's interior refusal
    is a real unpinned convention, located in source this session, with the two endpoint-preserving
    candidate pins enumerated and their interior-equivalence proven); (iv) design-time power tables
    freshly computed this session, including the honest within-band obstruction. No external method
    imported; the statistics are Poisson/Garwood counts at the campaign's own pinned comparator.

