  estimated_cost: 'Implementation: low (reading and tabulation). Compute: none. Requires one
    non-originating session.'
  recommended_priority: high
  honest_prior_of_survival: 0.8 that the test partitions the closures into more than one and
    fewer than nineteen families - the prediction this record actually makes. 0.15 that a
    single root explains nearly all of them (the outcome that would be most valuable and which
