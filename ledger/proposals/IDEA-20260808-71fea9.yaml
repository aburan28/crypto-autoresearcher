idea:
  id: IDEA-20260808-71fea9
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FIND-001
  goal_id: GOAL-FIND-001
  title: 'Are this round''s ~19 enumerated closures nineteen barriers or one? A cheap, decisive
    independence test: for each closure name the rigidity fact it invokes, check whether that
    fact predicts the closure''s QUANTITATIVE threshold rather than merely its direction,
    and exhibit a NEARBY OBJECT where the fact fails and the closure must therefore fail too
    - closures that survive on the nearby object are independent, and the residue that fits
    no root cause is the most valuable thing the round produced'
  class: measurement
  claim: "(A) THE HYPOTHESIS, STATED SO IT CAN LOSE. H-ROOT: the enumerated closures produced\
    \ across slices in this ideation round are not independent barriers but instances of a\
    \ small number of rigidity facts about the objects prime-field ECDLP hands an attacker.\
    \ Four candidate root facts, each elementary:\n  R-I   F_p has no proper subfield. (Every\
    \ working index calculus over\n        F_{q^n} substitutes a subfield; there is none to\
    \ substitute.)\n  R-II  G has PRIME order N, so no proper subgroup and no proper quotient.\n\
    \        (No Pohlig-Hellman, no CRT across moduli, no partial-modulus split.)\n  R-III\
    \ End(G) = Z/N is a FIELD, so every endomorphism acts as a scalar and\n        adds a\
    \ coordinate rather than a congruence (H-ENDO-001).\n  R-IV  Every auxiliary object attached\
    \ to the instance has residue field\n        F_p at p, so lifting and reducing loses the\
    \ torsor structure\n        (slice record E3-03's decomposition-group triviality is one\n\
    \        instance).\n(B) THE TEST, AND WHY IT DISCRIMINATES. For each closure C, three\
    \ columns:\n  (b1) WHICH ROOT. Which of R-I..R-IV does C's obstruction sentence invoke,\n\
    \       if any?\n  (b2) DOES THE ROOT PREDICT THE FORM? A root cause that predicts only\
    \ the\n       DIRECTION (\"blocked\") explains nothing; a root cause that predicts\n \
    \      the THRESHOLD is doing work. Worked examples from the round, as\n       described\
    \ to this session [round, unread]: the HGJ/BCJ representation\n       blocker is \"the\
    \ filter needs the target residue mod M, and N is\n       prime\" - R-II predicts exactly\
    \ that, and predicts the precise escape\n       (a nontrivial divisor M of N), so it passes\
    \ (b2). By contrast the\n       sigma = 1 index-calculus threshold \"loses to multi-target\
    \ sqrt(TN)\n       unless T > (m!)^2 * N\" carries a constant (m!)^2 that NO rigidity\n\
    \       fact predicts; it is a counting statement and, on this test,\n       INDEPENDENT\
    \ of R-I..R-IV - most likely an instance of\n       decomposition-yield conservation (KN-FIND-007)\
    \ instead. Likewise the\n       fully-windowed addition-tree closure (\"yield forces B\
    \ >= p^{1/2},\n       hence linear algebra >= N\") and the BKK membership-channel closure\n\
    \       (\"univariate membership polytopes are segments, so mixed volume\n       equals\
    \ Bezout\") are geometric/counting facts with thresholds no\n       rigidity fact supplies.\n\
    \  (b3) THE NEARBY-OBJECT CONTROL, WHICH IS THE PART THAT MAKES THIS A TEST\n       AND\
    \ NOT A TAXONOMY. For each claimed root fact, name an object where\n       the fact FAILS,\
    \ and check that the closure fails there too:\n         R-I fails over F_{q^n}, n composite\
    \ - and GHS/Weil descent DOES\n             work there, so any closure attributed to R-I\
    \ must visibly\n             dissolve over F_{q^n}.\n         R-II fails for composite\
    \ N - and Pohlig-Hellman DOES work there.\n         R-III fails on a non-prime-order subgroup,\
    \ where End is not a field.\n         R-IV fails at auxiliary primes q != p with residue\
    \ degree > 1.\n       A closure that still holds on the nearby object is NOT explained\
    \ by\n       that root fact, whatever its author believed. This is the\n       inventor-protocol\
    \ \"controls before belief\" rule applied to closures\n       instead of to signals.\n\
    (C) THE THREE POSSIBLE OUTCOMES, EACH ACTIONABLE. (i) MOST closures pass (b2) and (b3)\
    \ against one root: promote ONE KN-FIND with the others as cited corollaries - a large\
    \ simplification of the corpus and a far more citable statement than nineteen separate\
    \ rows. (ii) They split into two or three families (the prediction of this record: a RIGIDITY\
    \ family under R-I..R-IV, and a COUNTING family under KN-FIND-007 yield conservation):\
    \ promote that many, each with its family named. (iii) Most are independent: H-ROOT is\
    \ false, the corpus keeps nineteen records, and the round's closures are worth more, not\
    \ less - each is then a distinct barrier. (D) THE MOST VALUABLE CELL IS THE RESIDUE. Closures\
    \ fitting NO root cause are the ones whose mechanism is genuinely new; they are the ones\
    \ a future generator most needs to see, and they are exactly what a nineteen-row list\
    \ hides. One candidate already visible: the higher-dimensional-isogeny blocker for ordinary\
    \ F_p curves, whose obstruction is an EXTENSION DEGREE (~ord(pi mod M)) rather than a\
    \ missing sub-object, and which the round's own framing notes is a DIFFERENT obstruction\
    \ from KN-FIND-7e4b90's quaternion blocker - two different reasons for one lane being\
    \ closed, which matters precisely because they name different escapes. (E) PAUSE FLAG.\
    \ GOAL-FIND-001 is paused; this record proposes an analysis to run when the pause clears,\
    \ and changes no status."
  mechanism: 'Closures are cheap to accumulate and expensive to interpret. Nineteen independent
    barriers and one barrier with nineteen faces are very different states of knowledge: the
    first says the problem is hard for many reasons, the second says it is hard for one, and
    only the second tells a future generator where NOT to look. The discriminator is whether
    the proposed root predicts the closure''s quantitative form and whether it dissolves on
    an object where the root fails - the same two tests any causal claim must pass.'
  why_not_a_renamed_known_approach: 'Nearest known: writing a synthesis document that groups
    related findings. Grouping by topic is a filing decision; this is a causal test with a
    pre-declared falsifier (the nearby-object control) and a pre-declared prediction (two
    families, not one). Nearest corpus record: KN-FIND-5c1a03 records a "three-way convergence"
    in which H-PSEUDO, Betti-Yield and the Wesolowski transfer identify the same missing structural
    ingredient - that is one instance of exactly this kind of claim, made for three items
    and without a nearby-object control. This record generalises it and supplies the control
    that would have made it testable.'
  predictions:
  - observable: family structure of the round's closures
    metric: the partition of the ~19 closures induced by (b1)-(b3), reported as a table with
      one row per closure and an explicit "unassigned" bucket
    predicted: 'at least two non-trivial families - a rigidity family under R-I..R-IV and
      a counting/yield family under KN-FIND-007 - plus a non-empty unassigned bucket. Direction:
      the number of families is strictly greater than 1 and strictly less than 19'
  - observable: predictive power of each root fact
    metric: for each closure assigned to a root, whether the root predicts the closure's threshold
      (pass) or only its direction (fail)
    predicted: R-II passes on the representation-technique closures (it predicts the exact
      escape "a nontrivial divisor of N"); no root fact passes on any closure whose threshold
      carries a combinatorial constant such as (m!)^2 or a polytope-dimension count
  - observable: nearby-object dissolution
    metric: for each root-assigned closure, whether the closure demonstrably fails on the
      named nearby object where the root fact fails
    predicted: dissolution confirmed for R-I closures over F_{q^n} (GHS works there, which
      is a documented fact, not a new experiment) and for R-II closures at composite N (Pohlig-Hellman
      works). A closure that does NOT dissolve is reclassified as unassigned, and the record
      predicts at least one such reclassification
  minimal_test: Reading and tabulation, no compute. (i) Collect the round's enumerated closures
    with their obstruction sentences. (ii) Fill the three columns (b1)-(b3) for each. (iii)
    For the nearby-object column, use documented facts wherever possible (GHS over F_{q^n};
    Pohlig-Hellman at composite N) rather than new experiments - the control is a literature/corpus
    check, not a run. (iv) Report the partition, the unassigned bucket, and for each unassigned
    closure a one-sentence statement of what makes it independent. Estimated one working session
    for a non-originating reader.
  controls:
  - 'NEARBY-OBJECT CONTROL, blocking: no closure may be assigned to a root fact without exhibiting
    an object where the fact fails and confirming the closure fails there too. This is what
    distinguishes a causal assignment from a thematic one.'
  - 'NEGATIVE CONTROL ON THE CLASSIFIER: include two closures from OUTSIDE prime-field ECDLP
    (for example a lattice-side or supersingular-side closure from the corpus) where R-I..R-IV
    plainly do not apply. The classifier must place them in the unassigned bucket; if it assigns
    them to a root, the classification rule is too permissive and every count it produced
    is void.'
  - The classification must be done by a session that did not author the closures being classified
    - each author has an interest in their closure being independent (more valuable) or unified
    (more elegant), and both biases are live.
  confounders:
  - Restating a closure in root-cause language always SOUNDS like an explanation; (b2) exists
    precisely to prevent that, and any assignment passing (b1) but failing (b2) must be recorded
    as unassigned, not as a weak assignment.
  - This session did NOT read the sibling-slice closure records; the six examples above are
    as described by the Coordinator and may be mis-stated here. The test must be run against
    the records themselves, and any conclusion resting on this record's paraphrase is invalid.
  - R-I and R-II are not independent of each other in every instance (N prime and F_p prime
    often co-occur in an argument); overlapping assignments must be recorded as overlapping
    rather than forced into one bucket.
  falsification_conditions:
  - 'Every closure assignable to one root fact with (b2) and (b3) passing: H-ROOT holds in
    its strong form, this record''s own prediction of two-plus families is WRONG, and the
    corpus should collapse to one KN-FIND.'
  - 'No closure assignable to any root fact: H-ROOT is false outright.'
  - 'A closure assigned to R-I that does NOT dissolve over F_{q^n}: the assignment is wrong
    and the classifier must be re-run.'
  interpretation_limits: 'This produces a claim about the ORGANISATION of knowledge, not about
    ECDLP. A successful unification does not make any lane more or less closed than its own
    evidence made it, and a failure to unify does not make the closures stronger. It cannot
    upgrade any closure''s evidence tier: a derivation grouped with other derivations is still
    a derivation. Everything here is subject to the fact that the sibling closures were not
    read in this session.'
  assumptions:
  - The round produced roughly nineteen enumerated closures with explicit mechanisms [round,
    unread - reported by the Coordinator, not verified here].
  - R-I..R-IV as stated are elementary facts about prime-field instances (F_p has no proper
    subfield; N prime; End(Z/N) = Z/N; residue degree 1 at p for the objects in question -
    the last established for the CM ray-class case in slice record E3-03 and ASSUMED, not
    proved, in general).
  - KN-FIND-007 (decomposition-yield conservation) as the candidate root of the counting family
    [corpus].
  heuristic_assumptions:
  - id: HA-1
    statement: A root cause that predicts a closure's quantitative threshold is more likely
      to be the actual cause than one predicting only its direction. This is a methodological
      assumption, not a mathematical one, and it is the record's main epistemic commitment.
    rigorous_ingredient: 'The nearby-object control, which is a genuine falsifier independent
      of this assumption: a closure that survives where the root fails is not explained by
      the root regardless of thresholds.'
    distribution_imitated: Standard causal-inference practice (a cause must explain magnitude,
      not only sign), imported deliberately and named as imported.
    validation_route: 'The classification itself validates it: if the (b2)-passing assignments
      and the (b3)-passing assignments coincide, the two criteria agree and the assumption
      is doing no independent work. If they disagree, (b3) governs and (b2) is demoted to
      a heuristic sort key.'
    tail_checks: Report the closures where (b2) and (b3) disagree, individually and by name,
      rather than only the aggregate agreement rate.
  target_complexity:
    time_exponent: No algorithm and no exponent. The record is exponent-irrelevant by construction
      and is filed as knowledge organisation, with the justification that its payoff is in
      what future generators do NOT spend exponent-seeking effort on. Under the brief's rule
      for such items, this is stated rather than dressed up.
    memory_exponent: not applicable
    best_known_baseline: 'The status quo: nineteen closures filed separately, none cross-referenced
      by mechanism.'
    hidden_overhead_disclosure: The classification is judgement-laden; the nearby-object control
      is what keeps it from being an opinion, and where that control cannot be run the row
      must be marked unassigned rather than guessed.
    time_memory_tradeoff: not applicable
  sota_delta: 'Zero mathematically. The delta is a partition with a falsifier attached: either
    a small number of KN-FINDs with cited corollaries replacing nineteen rows, or an explicit
    finding that the barriers are independent - and in both cases a named residue of closures
    whose mechanism nothing else explains.'
