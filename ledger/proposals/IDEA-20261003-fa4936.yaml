    baseline_embedding:
      parameter_slice: The discriminants -87 and -83 and the counts 6 and 3.
      reproduction_check: >-
        Two readers must agree that the counts are 6 and 3.
    observation_collision:
      observable: The class-number gap and the product.
      distinct_preimage_search: >-
        Reporting both class numbers as 3 drops the gap. Two copies
        of class number 3 make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The two discriminants.
        predicted_gain: Integer gap. No curve enumeration.
    quantifier_order: >-
