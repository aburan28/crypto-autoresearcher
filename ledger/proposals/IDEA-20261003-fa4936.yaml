# IDEA-20261003-fa4936
# Class-number count for discriminants -87 and -83. Proposal only. Not approved.
idea:
  id: IDEA-20261003-fa4936
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    The class number of discriminant -87 is 6 and of discriminant -83 is 3
  class: measurement
  claim: >-
    Discriminant -87 has 6 reduced binary quadratic forms.
    Discriminant -83 has 3. Six exceeds three by 3. The product of
    the two class numbers is 18. Their sum is 9. The gap is a class
    number, not an ECDLP exponent and not an absolute discriminant.
  mechanism: >-
    OBJECT FRAME. The object is the set of reduced forms. The
    operation set is counting those forms, which is coordinate-dependent
    on the discriminant and is not a translation of a curve point.
    Discriminant -87 has the forms with coefficients 1, 1, 22 and
    2, -1, 11 and 2, 1, 11 and 3, 3, 8 and 4, -3, 6 and 4, 3, 6.
    Discriminant -83 has the forms with coefficients 1, 1, 21 and
    3, -1, 7 and 3, 1, 7. Two copies of class number 3 have gap 0.
    No curve is enumerated.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question asks whether a small discriminant confers an
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-IC-889857
      provenance: internal
      claim: >-
        A first-fall-degree dispute is a different object from these
        two class numbers.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two discriminants are frozen before the forms are counted.
    - No curve is enumerated.
  proof_search_map:
