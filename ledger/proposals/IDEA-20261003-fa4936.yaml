  falsification_conditions:
    - The class number of -87 is not 6.
    - The product of the two class numbers is not 18.
  confounders:
    - The absolute values 87 and 83 are not the class numbers.
  interpretation_limits:
    - A class number is not a walk length.
    - No transfer to a cryptographic discriminant.
    - This is not the class-number pair 7 and 5 of discriminants -71 and -79.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen discriminant -87 has class number 6, and the
        frozen discriminant -83 has class number 3.
      rigorous_support: >-
        No class-number theorem is re-proved here. The count is a
        reading of the reduced forms.
      validation_plan: >-
        Two independent counts of the reduced forms. A mismatch voids the gap.
