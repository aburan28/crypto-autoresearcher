idea:
  id: IDEA-20260801-012
  question_id: RQ-MLKEM-003
  title: >-
    Core-SVP convention audit at FIPS 203 dimensions: memory-charged sieve
    cost versus the category margin
  class: measurement
  claim: >-
    The core-SVP convention that ML-KEM's security categories rely on
    deliberately omits sieve memory and memory-access cost on conservatism
    grounds; a full memory-charged sieve cost at the FIPS 203 dimensions
    (Kyber-512/768/1024) can be computed under the program's charging
    conventions, and the resulting margin — the gap between the charged cost
    and the claimed category boundary — either confirms the conservatism or
    shows the charged cost crosses the category line. This decides whether
    the core-SVP margin is conservative at FIPS 203 dimensions and by how
    much.
  mechanism: >-
    The core-SVP convention counts only a fraction of the sieve's memory; a
    charged model adds the memory-access cost of the sieve's storage. The
    audit recomputes the best-known sieve cost (e.g., Nguyen-Stein or
    current-generation sieves) at the FIPS 203 dimensions with and without
    memory charging, and reports the margin to each category boundary in both
    models.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal audits the core-SVP memory-charged margin at
        FIPS 203 dimensions in this program.
    conclusion: >-
      Measurement proposal; novelty unverified against full literature; the
      core-SVP convention and memory charging are established, the specific
      margin computation is the deliverable.
  assumptions:
    - The FIPS 203 parameter set is fixed and public.
    - The best-known sieve cost model is transferable to FIPS 203 dimensions.
  predictions:
    - metric: charged_margin_over_category_boundary
      direction: lower
      minimum_effect: >-
        A charged margin below the uncharged margin by more than 20% of the
        category width at any of the three FIPS 203 sets is a signal worth
        reporting.
  minimal_test:
    design: >-
      Recompute the best-known sieve cost at Kyber-512/768/1024 under (i) the
      core-SVP convention and (ii) a memory-charged model; compute the margin
      to the category boundary under both; report the delta and sensitivity.
    controls:
      - Reproduce the category boundaries from the FIPS 203 specification.
      - Two independent sieve cost models.
    required_metrics:
      - uncharged and charged sieve costs per set
      - category boundaries per set
      - margin delta per set
  falsification_conditions:
    - Charged cost stays below the category line at all sets (margin
      conservative; convention confirmed).
    - Charged cost crosses or approaches the category line at some set
      (convention not conservative; margin question reopened).
  confounders:
    - Sieve-cost model disagreement at these dimensions.
    - Memory charging conventions (raw bits vs indexed).
  interpretation_limits:
    - Cost-model audit only; no concrete ML-KEM break.
    - A crossed line under charging does not constitute a key recovery.
  heuristic_assumptions:
    - id: HEUR-MLKEM-SVP-1
      statement: >-
        The best-known sieve cost models are accurate to within a stated
        factor at FIPS 203 dimensions.
      rigorous_support: >-
        Established sieve-cost literature; the audit reports the model
        disagreement as part of the margin sensitivity.
      validation_plan: Sensitivity analysis over the two cost models; a
        margin delta that survives model choice is the validation.
  target_complexity:
    time_exponent: n/a (cost audit)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No attack claimed. Deliverable is a memory-charged margin table at FIPS
    203 dimensions, which decides whether the core-SVP convention's
    conservatism holds.
  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: high
