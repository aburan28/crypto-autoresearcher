  title: Chevalley classification of homomorphic transfers over F_p (finite control)
  class: control
  claim: |-
    No generalized Jacobian of E over F_p with modulus of degree <= 4 (reduced gives tori, non-reduced gives unipotent parts) transfers an l-part with l not dividing p * (p^k - 1).
  mechanism: |-
    A commutative algebraic group surjecting onto E has kernel K = torus x unipotent (Chevalley / Rosenlicht). Ext(Z/l, K) != 0 needs l-torsion in K: unipotent gives l = p (Smart); torus gives l | p^k - 1 (pairings); abelian kernels reduce to isogeny by Poincare reducibility (Weil descent only). There is no fourth kind.
  novelty_status: unverified
