      tooling touching this question. NO PRIOR RECORD IN THIS CORPUS PROPOSES
      A SCHEMA-TYPED, CI-VALIDATED REACHABILITY-TABLE ARTIFACT FOR THIS OR ANY
      OTHER RESEARCH QUESTION. NEAREST NEIGHBOURS AND WHAT THIS ADDS BEYOND
      EACH. IDEA-20260922-77bf31 (this lane, filed earlier today) computes
      per-cell descent-column verdicts (COMPUTED with a g/B bound for
