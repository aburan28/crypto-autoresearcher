idea:
  id: IDEA-20260922-6028ed
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE REACHABILITY TABLE DOES NOT EXIST AS AN OBJECT, ONLY AS PROSE SPREAD
    ACROSS DOZENS OF PROPOSAL FILES, AND NOTHING NOTICES WHEN A CELL'S
    PROVENANCE ROTS. Give it one typed, schema-checked artifact plus a CI
    validator that treats every cell's verdict as a claim WITH A DEPENDENCY
    LIST, refuses a STRUCTURALLY EMPTY verdict with no certificate pointer,
    refuses a COMPUTED verdict whose cited input record has been superseded
    without the cell being touched, and turns every OPEN verdict's missing
    quantity into a live, greppable pointer instead of a dead string in a
    markdown file. Priced, tested with a synthetic-mutation battery, and
    scoped honestly: this is infrastructure, not an attack.
  class: tooling

  claim: >-
    (A) THE OBJECT DOES NOT EXIST. RQ-BINSTD-b6f698's decision_target names a
    "maintained REACHABILITY TABLE, one row per named curve and one column per
    index-calculus line, in which each cell is exactly one of: STRUCTURALLY
    EMPTY with a certificate, DEFINED WITH A COMPUTED COST..., or OPEN with the
    specific missing quantity named." As of this session that table exists only
    as PROSE: analysis/binstd-curve-audit/README.md's two-paragraph summary,
    IDEA-20260922-77bf31's per-cell descent-column verdicts embedded in a
    multi-hundred-line claim field, IDEA-20260922-2e2a58's region-table Stage 3
    output description (not yet run), and the audit scripts' own printed text.
    There is no single file a person or a CI job can open and ask "which of the
    ~30 rows x ~6 columns = ~180 cells are filled, with what, and is it still
    true." That absence is not neutral: it means (i) filling a cell requires
    re-reading several hundred-line proposal records to find the verdict
    buried in their claim/predictions text, (ii) two sibling records in this
    lane can (and do, in this batch) compute overlapping or complementary cells
    without a shared place to reconcile them, and (iii) nothing detects when a
    cell's justification has gone stale.
    (B) STALENESS IS NOT HYPOTHETICAL, IT IS THE STRUCTURE OF THIS PROGRAM. Per
    CLAUDE.md's own concurrency rules, "run records, ledger records, and
    knowledge entries are immutable -- corrections supersede, never overwrite,"
    and many concurrent worktrees write to this same ledger. A STRUCTURALLY
    EMPTY verdict resting on analysis/binstd-curve-audit/subfield_scan.py's
    output is silently wrong the moment that script (or its interpretation) is
    corrected by a CORR-* record; a COMPUTED verdict resting on 77bf31's g/B
    bound is silently wrong if 77bf31 is superseded by a record that revises
    g or the bound; an OPEN verdict naming "the covering genus g_H" as the
    missing quantity is silently STALE (should become COMPUTED) the moment some
    future record computes g_H for the five c2pnb rows, and nothing currently
    tells anyone that record exists. None of this is a hypothetical failure
    mode -- it is exactly the failure mode CLAUDE.md's "Merges to main publish
    a digest" and "Sessions talk to each other through a write-once feed"
    sections exist to prevent for OTHER kinds of state, and the reachability
    table currently has no equivalent.
    (C) THE PROPOSAL. One canonical, schema-typed data file,
    analysis/binstd-curve-audit/reachability_table.yaml, and one validator,
    tools/validate_reachability_table.py, extending the check_* pattern
    tools/validate_ledger.py already uses (check_cross_refs,
    check_schema_supersessions, check_knowledge_entries). Each cell is a typed
    record:
      {curve_row, method_column, verdict: STRUCTURALLY_EMPTY | COMPUTED | OPEN,
       certificate: {artifact_path, sha256, assertion} (required iff
       STRUCTURALLY_EMPTY), inputs: [{record_id, kind}] (required iff
       COMPUTED, non-empty), formula (required iff COMPUTED),
       extrapolation_distance (required iff COMPUTED and curve_row is deployed),
       missing_quantity (required iff OPEN, drawn from a small controlled
       vocabulary), matched_rho_row, ratio (optional, required iff COMPUTED
       and a ratio is claimed)}.
    The validator enforces schema shape, then TWO live checks with no research
    compute involved: (i) CERTIFICATE INTEGRITY -- re-hash the artifact at
    certificate.artifact_path and compare to the pinned sha256; a mismatch
    fails the cell by name, catching a silently-changed script or output
    before anyone trusts a stale STRUCTURALLY EMPTY verdict again. (ii)
    PROVENANCE FRESHNESS -- for every input record_id (a COMPUTED cell's inputs
    or a STRUCTURALLY_EMPTY cell's certificate-producing logic's owning
    record), confirm the record still exists in the ledger and carries no
    superseded_by pointer; a superseded input fails the cell by name rather
    than leaving it silently wrong, reusing the exact check_schema_supersessions
    pattern already in tools/validate_ledger.py rather than inventing a new
    mechanism. A third, non-blocking check (iii) OPEN-CELL LIVENESS -- grep
    ledger/proposals and ledger/hypotheses for any record whose title or claim
    field contains the cell's missing_quantity string, and flag the cell
    "possibly closeable, see <record_id>" as an informational note, not a
    failure -- turns a dead OPEN marker into a live forward-pointer with zero
    manual bookkeeping.
    (D) THE HONEST SCOPE. This is a schema-and-validator problem, not a
    research result. It claims no attack, no exponent, no cost bound on any
    curve. Its entire value is preventing exactly the kind of silent drift
    CLAUDE.md's concurrency section already spends several paragraphs
    preventing for other artifact classes, applied here because this specific
    artifact -- a maintained table with ~180 cells and certificate-dependent
    verdicts -- is exactly the shape of thing that rots quietly if it is prose.

  mechanism: >-
    SCOPE NOTE, STATED FIRST. This is class: tooling. The point-representation
    / operation-set / trichotomy / lossy-projection machinery of
    docs/object-frame-ideation.md is written for ECDLP ATTACK candidates that
    track a point through group operations; this record tracks no point and
    performs no group arithmetic, so that machinery does not natively apply.
    Rather than force it or silently skip it, the record offers the closest
    honest ANALOGUE below, clearly labelled as an analogue, so the record's
    structure still answers "what is tracked, under what operations, and what
    discard is licensed" in the spirit the brief asks for -- without
    pretending this is an attack-object candidate.
    TRACKED OBJECT (analogue to a "representation"): the reachability-table
    CELL as a typed record (verdict + certificate/formula/inputs pointers),
    not the full prose argument that produced it. OPERATION SET (analogue to
    "Sigma," but over LEDGER STATE, not group elements): Sigma_ledger =
    {supersede(record_id) -- file a CORR-* or new IDEA-*/RQ-*/KN-* that
    supersedes a cited record; re-run_and_change(artifact) -- edit a
    certificate-producing script or its output; append(new_record) -- file a
    record that supplies a previously-OPEN cell's missing_quantity}. These are
    exactly the mutations concurrent worktrees actually perform on this
    repository's shared state, per CLAUDE.md's own concurrency section.
    TRICHOTOMY (adapted): the typed cell is neither partial-action nor
    branching in the point-representation sense; it is best described as
    COORDINATE-DEPENDENT in the same loose sense IDEA-20260922-2e2a58's
    resource-triple object is -- a property of how the LEDGER is organised,
    not of any mathematical object -- and the record says so rather than
    forcing an ill-fitting label.
    LOSSY-PROJECTION TEST, ADAPTED TO Sigma_ledger. What the typed cell
    DISCARDS: the full prose argument (77bf31's claim field alone is several
    hundred lines; the typed cell keeps roughly eight short fields). LOSSY: a
    typed cell obviously cannot reconstruct the discarded prose, and many
    different prose arguments could in principle produce the identical typed
    cell (not injective) -- both required properties of a genuine lossy
    projection, not a change of coordinates. COMPATIBLE WITH Sigma_ledger, the
    load-bearing claim: the cell's TRUTH VALUE (does it still correctly
    describe the world) is UNCHANGED by any Sigma_ledger operation that does
    not touch anything the cell's retained pointers name, and is FORCED STALE
    -- caught by the validator, not silently wrong -- by any Sigma_ledger
    operation that DOES touch a named pointer. This is exactly the
    "compatible discard" criterion: the retained eight fields are precisely
    the part of the discarded prose whose truth Sigma_ledger can change, so
    discarding the rest loses no information Sigma_ledger could act on.
    THE ONE OPEN NUMBER: NOT APPLICABLE IN THE ATTACK-COST SENSE. No point
    representation is tracked, so there is no orbit-canonicalisation cost or
    (L, b) meter to price. The record's only real "cost" is engineering effort,
    priced honestly in estimated_cost below rather than forced into a field
    that does not fit.
    OFF-LIMITS COMPONENTS: not applicable; no attack family (F1-F7) is used as
    a component or a lens, since no attack is proposed. No new factor base is
    introduced, so KN-OPEN-020 is not engaged. No R1/R2/R3 representation is
    used; this record touches no point arithmetic.

  novelty_status: unverified

  origin:
    kind: generator_lane_F
    date: '2026-09-22'
    scope: >-
      Lane F of the BINSTD ideation batch, seam 2: a tooling proposal making
      the reachability table a checkable object CI can refuse to let rot,
