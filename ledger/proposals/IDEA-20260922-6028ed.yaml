  assumptions:
    - >-
      A YAML schema check plus a certificate-hash check plus a supersession
      check is SUFFICIENT to catch the staleness modes named in claim (B); it
      does not claim to catch every possible drift (e.g. a cited record's
      TEXT changing in a way that does not trigger a formal supersession is
      out of scope, since this program's immutability rule means records are
      not edited in place -- corrections supersede, never overwrite -- so this
      gap is small by the program's own discipline, not unaddressed).
    - >-
      The controlled vocabulary for missing_quantity strings (e.g. "covering
      genus g_H", "Krylov chain length constant", "e = ord_n(ell) for curve
      X") is maintained BY HAND as OPEN cells are added, not inferred; this is
      a real, disclosed maintenance cost, priced in estimated_cost.
    - >-
      This record does not itself compute any curve's cost, certificate, or
      bound; it only types and checks verdicts that OTHER records (77bf31,
      2e2a58, b19793, future ones) supply. Seeding the table with those
      records' own emitted verdicts is a transcription task, not a research
      claim, and any transcription error is a tooling bug, not a scientific
      finding.
    - >-
      No group arithmetic, no curve parameter, no deployed-curve computation
      is performed by this record at any point.

  proof_search_map:
    bottleneck: >-
      The exact step whose removal changes the theorem is not a mathematical
      bottleneck but an ENGINEERING one: whether a cell's typed pointers
      (certificate hash, input record IDs) are SUFFICIENT to detect every
      staleness event Sigma_ledger can produce. If they are not -- if some
      Sigma_ledger mutation can silently invalidate a cell without touching
      any of its recorded pointers -- the validator gives false confidence,
      which would be worse than no tool at all. The synthetic-mutation battery
      in the minimal test exists specifically to probe this.
    baseline_embedding:
      parameter_slice: >-
        The INCUMBENT is "no schema, no validator, prose only, staleness never
        caught automatically." That is exactly the current state of the
        reachability table (claim A) and is reproduced by this record's own
        design if the validator is never run -- i.e. the incumbent is the
        degenerate case of this proposal with the CI check disabled, not a
        strawman built to be beaten.
      reproduction_check: >-
        Zero compute: confirm that reading the SAME information the incumbent
        prose already carries (77bf31's descent-column verdicts,
        2e2a58's planned region-table cells) into the new schema produces no
        information loss relevant to the verdict itself -- every field the
        schema requires is already present, in prose form, in the source
        records cited above. If any required schema field has NO prose
        analogue in the source records, that is itself a finding (the source
        records are less complete than they appear) and is reported, not
        silently patched.
    observation_collision:
      observable: >-
        "The reachability table says cell (curve, column) = X."
      distinct_preimage_search: >-
        COLLISION EXHIBITED. Currently, the SAME prose observable "cell X"
        could be produced by: (i) a verdict that is still true and whose
        certificate/inputs are unchanged; (ii) a verdict whose certificate
        artifact has silently changed since it was written; (iii) a verdict
        whose cited input record has been superseded by a revision that
        changes the number; (iv) a verdict that is now STALE because a
        follow-on record supplied the missing quantity an OPEN cell named,
        and nobody updated the table. A reader of the current prose cannot
        tell which of the four states holds. The identifying tuple this
        record proposes every cell carry is (verdict, certificate_hash_status,
        input_supersession_status, open_cell_liveness_flag) -- exactly what
        the validator computes.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the printed verdict fixed and vary the hidden staleness state,
          exhibiting the four preimages above.
        predicted_gain: >-
          Converts "the table says X" from an unverifiable prose claim into a
          machine-checked one with a named failure mode for each of the four
          states. NO RESEARCH RESULT IS PRODUCED.
      - transform: specialization_pack
        proposed_object: >-
          The synthetic-mutation battery (six named cases in the minimal
          test) as a specialisation of Sigma_ledger's three operations,
          exercising each staleness mode individually rather than trusting
          the validator's design by inspection alone.
        predicted_gain: >-
          Makes "the validator works" itself a falsifiable, tested claim
          rather than an assertion about untested code.
    quantifier_order: >-
      CLAIMED. FOR EVERY cell whose certificate artifact is re-hashed and
      matches its pinned value, AND whose every input record_id exists and
      carries no superseded_by pointer, the validator emits no failure. FOR
      EVERY cell where either check fails, the validator names the specific
      cell and the specific failing pointer. NOT CLAIMED: that these two
      checks are a COMPLETE staleness detector (see assumptions); not claimed:
      any research result about any curve.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the reachability_table.yaml schema and the six synthetic-mutation
        test cases enumerated in the minimal test, the validator passes the
        two valid cases and fails each of the four injected-failure cases,
        naming the specific cell and pointer in every failure." It can NEVER
        certify that no OTHER staleness mode exists beyond the ones tested, or
        that any cell's underlying research content is correct -- only that
        its recorded pointers are internally consistent with current ledger
        state.
      nearby_object_control: >-
        THE UNRELATED-CHANGE CONTROL IS THE ONE THAT MATTERS MOST FOR A TOOL
        LIKE THIS. Case 6 of the synthetic battery (below) adds an entirely
        unrelated new ledger record and confirms the validator does NOT fire
        -- a validator that fails on every ledger change, relevant or not, is
        useless in a repository with this program's write volume, and this
        control is what distinguishes "the validator tracks dependencies" from
        "the validator is a tripwire on ledger size."
    proof_obligations:
      - claim: >-
          The seeded reachability_table.yaml, transcribed from 77bf31's and
          the audit's own emitted verdicts, validates cleanly against the
          schema with zero modification to the source records' content.
        responsibility: correctness
      - claim: >-
          The certificate-integrity check fires on a one-byte change to a
          cited artifact and does not fire when the artifact is unchanged.
        responsibility: correctness
      - claim: >-
          The provenance-freshness check fires when a cited input record is
          superseded and does not fire for an unrelated ledger change.
        responsibility: correctness
      - claim: >-
          The battery achieves 6/6 on the synthetic mutation cases before the
          validator is proposed for CI integration.
        responsibility: scope
  predictions:
    - metric: >-
        synthetic-mutation battery pass count (six named cases: valid table;
