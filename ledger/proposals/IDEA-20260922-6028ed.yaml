      either record's cost model), so building this tool once serves both
      rather than each record inventing its own table format. IDEA-20260922-
      b19793 (this lane, third record) emits an LA-column verdict per cell in
      the same shape and is a third, independent producer this schema is
      designed to accept without a fourth ad hoc format. analysis/binstd-
      curve-audit/README.md is the closest EXISTING artifact to a
      "reachability table" in this corpus -- it is prose with two summary
