      GHS-column STRUCTURALLY_EMPTY cells, cited and reused rather than
      duplicated. tools/validate_ledger.py already implements the exact
      check_* / Ctx pattern (check_cross_refs, check_schema_supersessions,
      check_knowledge_entries -- read this session) this record's validator
      extends; NO EXISTING check in that file inspects a per-cell certificate
      hash or a domain-specific controlled vocabulary of "missing quantities,"
      so this is a genuinely new check, not a restatement of an existing one.
      GENERIC PRECEDENT, DIFFERENT DOMAIN: this program's supersession-tracking
      discipline (superseded_by pointers, CORR-* records, the write-once
      merge-digest and agent-bus feeds documented in CLAUDE.md's concurrency
      section) is the GENERAL mechanism this record's provenance-freshness
      check reuses; this record is the first proposal to apply that mechanism
      to a RESEARCH-QUESTION-SPECIFIC DERIVED TABLE rather than to the ledger's
      own record graph.
