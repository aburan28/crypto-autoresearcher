        not the source record's content.
    - metric: >-
        open-cell-liveness informational hit rate -- for a small set of
        DELIBERATELY SEEDED OPEN cells whose missing_quantity is later
        supplied by a planted matching record, fraction correctly flagged
        "possibly closeable"
      direction: higher
      minimum_effect: >-
        This is a non-blocking, informational feature; a miss is reported but
        does not fail the battery, since a false negative here degrades
        gracefully to the current all-prose status quo rather than causing
        harm.
  minimal_test:
    design: >-
      STAGE 0 (zero compute). Write the schema (embedded as a validation
      function in tools/validate_reachability_table.py, following
      tools/validate_ledger.py's existing check_* / Ctx pattern rather than
      introducing a new validation framework).
      STAGE 1 (zero research compute, transcription only). Seed
      analysis/binstd-curve-audit/reachability_table.yaml with ONLY the
      verdicts this session's sibling records and the existing audit actually
      commit to: the GHS-column STRUCTURALLY_EMPTY cells for the 25 prime-
      extension-degree rows (certificate = subfield_scan.py's output, per the
      audit README); the descent-column verdicts IDEA-20260922-77bf31's
      Stage 0 deliverable specifies (COMPUTED with the g/B bound for
      decomposition columns on Koblitz/general-prime-degree rows, OPEN with
      g_H named for the cover column on the five c2pnb rows). Every other
      cell in the ~180-cell space is left EXPLICITLY UNFILLED (a fourth
      schema-legal state, NOT_YET_ASSESSED, distinct from OPEN, so an empty
      cell is never confused with a cell someone has actually determined is
      structurally empty or genuinely open) -- no number or verdict this
      session does not have is fabricated to fill a cell.
      STAGE 2 (mechanical, no research judgment). Implement the validator's
      three checks: schema shape; certificate-hash re-verification against
      the pinned sha256; input-record existence and non-supersession, reusing
      tools/validate_ledger.py's existing supersession-lookup machinery
      rather than re-implementing it. Implement the non-blocking open-cell-
      liveness grep as a fourth, informational-only pass.
      STAGE 3 (the falsification battery, cheap and deterministic, on a
      SCRATCH COPY of the seeded table and its cited artifacts, never on the
      live files). Six named cases: (1) the valid seeded table -> expect PASS.
      (2) flip one byte in a copy of the certificate artifact the
      STRUCTURALLY_EMPTY GHS cells cite -> expect FAIL, naming the specific
      affected cell(s). (3) a COMPUTED cell's inputs list cites a record_id
      that does not exist in ledger/ -> expect FAIL, naming the cell and the
      missing ID. (4) write a synthetic CORR-* record (in a scratch copy of
      the ledger, never committed) that supersedes one of 77bf31's cited
      inputs -> expect FAIL, naming the cell and the stale input. (5) an OPEN
      cell's missing_quantity string is set to a value not in the controlled
      vocabulary -> expect FAIL (schema violation), catching inconsistent
      naming across cells before it accumulates. (6) add an entirely
      unrelated new IDEA-* record to the scratch ledger copy, touching none of
      the seeded table's cited artifacts or inputs -> expect PASS, unchanged,
      the false-positive control.
      STAGE 4 (zero compute, contingent on 6/6). Propose (not perform, per
      this record's own class and this session's non-authority to approve
      infrastructure changes) adding the validator as a check in
      .github/workflows/main-health.yml or validate.yml, matching the
      existing pattern for other ledger checks.
      MEMORY/COST DISCIPLINE. The entire test is file I/O and string/hash
      comparisons over at most a few hundred small YAML records; no group
      arithmetic, no curve computation, sub-second runtime, negligible memory.
    controls:
      - >-
        VALID-TABLE PASS (blocking, case 1): the unmutated seeded table must
        validate cleanly, or the schema/seed mismatch is the first bug to fix
        before anything else is trusted.
      - >-
        FALSE-POSITIVE CONTROL (blocking, case 6): an unrelated ledger change
        must NOT trigger a failure; this is the control that distinguishes a
        genuine dependency tracker from a tripwire.
      - >-
        SCRATCH-COPY DISCIPLINE (blocking, all mutation cases): every
        injected failure is applied to a COPY, never to the live ledger or
        live audit artifacts, so this record's own testing cannot corrupt the
        state it is trying to protect.
      - >-
        TRANSCRIPTION-FIDELITY CHECK: the seeded table's cells are diffed
        against the source records' own emitted verdict text by a human/
        Coordinator review before Stage 3, since an automated transcription
        step could itself introduce the exact kind of silent drift this
        record exists to prevent.
    required_metrics:
      - battery_pass_count_out_of_6
      - per_case_pass_fail_with_named_cell_and_pointer
      - transcription_fidelity_fraction
      - open_cell_liveness_hit_rate_on_planted_examples
      - validator_runtime_and_peak_memory
  falsification_conditions:
    - >-
      Battery score below 6/6 on first implementation. The specific failing
      case names the exact design gap (a staleness mode the pointer schema
      does not actually catch, or a false positive on an irrelevant change);
      the validator is revised and re-run before any CI-integration proposal,
      not shipped with a known gap.
    - >-
      The seeded table (Stage 1) fails its OWN validator on the unmutated
      case. This would mean the schema does not even fit the content it is
      meant to hold -- a design failure caught before any CI investment, and
      the honest, useful outcome of catching it here rather than after
      integration.
    - >-
      The transcription-fidelity check finds a required schema field with NO
      prose analogue in 77bf31/the audit's own emitted verdicts. This means
      the schema is asking for more than the source records currently commit
      to, and is reported as a schema-design gap (loosen the schema, or note
      the missing field as a request back to the source record) rather than
      silently fabricated to make Stage 1 pass.
    - >-
      Everything holds at 6/6. Then the lane gains a single, canonical,
      schema-checked reachability-table artifact seeded with exactly the
      cells this session's sibling records actually commit to, a validator
      ready to be proposed for CI integration by the Coordinator, and an
      explicit NOT_YET_ASSESSED state distinguishing "nobody has looked" from
      "confirmed structurally empty" or "confirmed open" for the ~175 cells
      this session does not fill.

  confounders:
    - >-
      A SCHEMA CAN ENFORCE SHAPE BUT NOT TRUTH. The validator confirms a
      cell's pointers resolve and are unstale; it cannot confirm the CONTENT
      of the certificate or the correctness of the cited formula. A cell that
      passes validation and is still scientifically wrong is a real,
      undetectable-by-this-tool failure mode, disclosed rather than implied
      away.
    - >-
      THE CONTROLLED VOCABULARY FOR missing_quantity IS A MAINTENANCE
      LIABILITY. If two records name logically the same missing quantity with
      different strings ("covering genus g_H" versus "genus of the covering
      curve at m/16"), the open-cell-liveness check will miss the match; this
      is a real, disclosed limitation of a string-based check, not a claim of
      semantic understanding.
    - >-
      SCRATCH-COPY TESTING DOES NOT EXERCISE REAL GIT CONCURRENCY. The battery
      tests the validator's LOGIC against constructed inputs; it does not test
      behaviour under a genuine concurrent-worktree race (two sessions editing
      the table simultaneously), which is out of this record's scope and is
      named as forward guidance, not solved here.
    - >-
      NOT_YET_ASSESSED CELLS ARE NOT PROGRESS. Filling the schema with ~5 of
      ~180 cells is a small fraction of the table RQ-BINSTD-b6f698 envisions;
      this record's value is the CHECKABILITY of what IS filled and the
      explicit, honest marking of what is not, not the coverage itself.

  interpretation_limits:
    - >-
      NO RESEARCH RESULT IS CLAIMED. No curve's cost, memory, or feasibility
      is determined, bounded, or changed by this record. It is infrastructure.
    - >-
      The seeded table covers a small fraction of the full ~180-cell space;
      quoting "the reachability table is now complete" from this record would
      be a misreading. The explicit NOT_YET_ASSESSED marker exists precisely
      to prevent that misreading.
    - >-
      This record does not itself decide whether the validator should be
      wired into CI as a blocking check -- that is a Coordinator infrastructure
      decision, outside this session's authority, and next_gate names it
      explicitly rather than assuming it.
    - >-
      FORWARD GUIDANCE. Left open: extending the schema to accept
      IDEA-20260922-2e2a58's and IDEA-20260922-b19793's cell formats once
      those records' own Stage 3/4 deliverables exist (not done here, since
      neither has run yet); a semantic (not string-exact) match for the
      open-cell-liveness check, e.g. via the same kb/ retrieval MCP server
      this repository already runs for the knowledge corpus, as a natural
      successor rather than attempted here; and genuine concurrent-write
      testing once a second session actually edits the table, which this
      record's scratch-copy battery cannot substitute for.

  heuristic_assumptions:
    - id: H-BINSTD-TOOL-1
      statement: >-
        A cell's two live checks (certificate-hash match, input non-
        supersession) are jointly SUFFICIENT to catch the staleness modes
        named in claim (B) for the specific ledger-mutation operations
        Sigma_ledger enumerates (supersede, re-run-and-change, append).
      rigorous_support: >-
        RIGOROUS INGREDIENT: by construction, every claim (B) staleness
        scenario (script output changes, cited record superseded, missing
        quantity later supplied) maps onto exactly one of Sigma_ledger's three
        operations, and each operation is checked by one of the validator's
        mechanisms (hash re-verification for re-run-and-change; supersession
        lookup for supersede; the informational liveness grep for append).
        THE GAP: this is a design argument, not a proof that no FOURTH kind of
        drift exists outside Sigma_ledger's three named operations (e.g. a
        record's INTERPRETATION changing without any formal ledger mutation
        at all, which no automated check can catch). The classical analogue
        this imitates is a build system's dependency graph (e.g. Make's
        timestamp/hash-based staleness detection): sufficient for the
        mutations the graph models, silent on anything outside the graph.
      validation_plan: >-
        SAMPLE. The six-case synthetic battery in the minimal test, covering
        one instance of each of Sigma_ledger's three operations (cases 2, 3+4,
        5-adjacent) plus a valid case and a false-positive control.
        COMPARISON. Expected pass/fail per case, stated in advance (Stage 3).
        TAIL CHECK. None applicable at this sample size (six deterministic
        cases, not a statistical distribution); this heuristic is validated
        by exhaustive enumeration of the named operation set, not sampling.
        TRANSFER. None claimed beyond the six enumerated cases and the three
        named Sigma_ledger operations; a fourth kind of drift is explicitly
        out of scope (interpretation_limits).
  heuristic_note: >-
    This record carries one heuristic assumption rather than several, because
    it is an engineering claim, not a mathematical or statistical one: the
    question is whether a finite, enumerable set of check mechanisms covers a
    finite, enumerable set of named failure modes, which is answered by
    exhaustive testing (the six-case battery) rather than by sampling or a
    distributional model. The honestly disclosed gap is drift OUTSIDE the
    three named Sigma_ledger operations, which no schema-and-hash validator
    can address and which this record does not claim to address.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE -- no attack. The validator itself runs in O(rows *
      columns) = O(~180) cell checks, each O(1) hash comparison and O(log|ledger|)
      record lookup; sub-second on the seeded table, and still well under a
      second at the full ~180-cell target size.
    memory_exponent: >-
      NOT APPLICABLE -- no attack. O(rows * columns) cell records held in
      memory at once, each a few hundred bytes; negligible at any plausible
      table size for this population.
    best_known: >-
      NOT APPLICABLE -- there is no prior "linear algebra" or "rho" baseline
      for a validator. The relevant baseline is the CURRENT STATE (prose only,
      no automated staleness detection), reproduced as the parameter_slice of
      proof_search_map.baseline_embedding above.
    hidden_overhead: >-
      DISCLOSED. (i) String-based missing_quantity matching misses semantic
      equivalents (confounders). (ii) The battery tests six constructed cases,
      not genuine concurrent-worktree races. (iii) Schema enforcement does not
      verify scientific content, only pointer consistency.
    tradeoff_note: >-
      NOT APPLICABLE in the time-memory-parallelism sense; the only tradeoff
      is maintenance burden (keeping the controlled vocabulary and schema
      current) against the cost of silent drift the tool is built to catch,
      and that tradeoff is qualitative, not priced in exponents.

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Schema plus validator plus seed file: roughly 300-500 lines total,
      reusing tools/validate_ledger.py's existing check_* / Ctx / supersession-
      lookup machinery rather than building parallel infrastructure. The
      synthetic-mutation battery is roughly 100-150 additional lines of test
      scaffolding operating on scratch copies. No group arithmetic, no
      solver, no curve computation; runtime is sub-second, memory negligible.
      This is the cheapest of the three records this session files.

  asymptotic_claim:
    problem: >-
      NOT APPLICABLE. This record makes no claim about ECDLP, any curve, or
      any algorithm's complexity. It proposes infrastructure for tracking
      claims OTHER records make about those things.
    prior_best: NOT APPLICABLE -- no attack, no algorithm compared.
    time_exponent: NOT APPLICABLE.
    memory_exponent: NOT APPLICABLE.
    hidden_cofactor: NOT APPLICABLE.
    claim_kind: infrastructure
  dominated_by: >-
    n/a (no result claimed). This record proposes no attack, no algorithm, and
    no cost bound on any curve or group; there is no row of RQ-BINSTD-b6f698's
    baseline clause to check it against, and forcing a dominated_by entry
    against rho or any other algorithm would misrepresent a tooling proposal
    as a research result. Per docs/inventor-protocol.md section 5, this is the
    complete and honest answer for a class: tooling record.
  sota_delta:
    time: >-
      NOT APPLICABLE -- no speed claim on any axis of any algorithm. The only
      "before/after" this record changes is whether a table cell's staleness
      is caught automatically (after) or never (before, the current state).
    memory: NOT APPLICABLE.
    data_queries: NOT APPLICABLE.
  frontier_check:
    status: pending
    note: >-
      Schema-typed dependency tracking with hash-based staleness detection is
      standard practice in software engineering (build systems, data
      pipelines, "data contracts" in the data-engineering literature); this
      record's contribution, if any survives a broader search, is narrowly
      its APPLICATION to a research-question-specific derived table inside
      this program's ledger conventions, not the underlying idea of
      hash-checked dependency tracking, which is well known outside this
      corpus and was not searched externally this session. What was searched
      in this corpus and not found: any prior proposal of a schema-typed,
      CI-validated reachability-table (or equivalent per-cell derived-claim
      table) artifact for any research question in this program.
  recommended_priority: medium
  priority_rationale: >-
    Best case is explicitly not an exponent and carries no attack content at
    all; a pure infrastructure record could reasonably be ranked low. It is
    MEDIUM rather than low for two specific, stated reasons. First, it is the
    cheapest of this session's three records (estimated_cost: low across the
    board) and directly serves RQ-BINSTD-b6f698's own decision_target, which
    NAMES a maintained table as the thing this whole question is meant to
    produce -- without some version of this artifact, that decision_target has
    no home to be assembled into, regardless of how many individual cells
    other records compute. Second, it is a genuine PREREQUISITE for avoiding
    a specific, already-observed failure mode in this exact batch: three
    sibling records in this one lane (77bf31, 2e2a58, b19793) each independently
    emit reachability-table cells as prose inside their own files this same
    session, with no shared place to reconcile or cross-check them; the cost
    of NOT building this now is that the reconciliation happens by manual
    re-reading indefinitely. It is not HIGH because it produces no research
    finding of its own and the Coordinator may reasonably judge the ~180-cell
    coverage too sparse to justify CI integration yet.
  first_deliverable: >-
    The schema (Stage 0) plus the seeded reachability_table.yaml (Stage 1)
    containing only the ~5 cells this session's sibling records and the
    existing audit actually commit to, with every other cell explicitly
    NOT_YET_ASSESSED. Zero research compute, no run, no status change.
  next_gate: >-
    Coordinator decision on (i) whether to wire the validator into
    .github/workflows/validate.yml or main-health.yml as a blocking check
    once it passes 6/6 on the synthetic battery, and (ii) whether the schema
    should be extended to accept IDEA-20260922-2e2a58's and
    IDEA-20260922-b19793's cell formats before or after those records'
