idea:
  id: IDEA-20260807-45a69f
  question_id: RQ-EQLA-0d3f40
  added: '2026-08-07'
  title: >-
    THE ONE PLACE MORE THAN A CONSTANT COULD COME FROM, AND THE EXPLICIT MAP
    THAT KILLS IT: a factor base closed under a NON-UNIT endomorphism psi has
    orbit length ord_N(mu), which is unbounded rather than capped by |Aut| <= 6,
    so the unknown count falls by an unbounded factor - and the construction is
    then a table of known multiples of one point, which is the incidence oracle,
    which is generic-group simulable, and which this record reduces to BSGS with
    an explicit cost map rather than dismissing

  class: mechanism

  claim: >-
    (A) WHY THIS IS THE ONLY EXPONENT-SHAPED IDEA IN THE LANE. Every other L5
    proposal is capped at a constant because the group acting on the factor base
    is Aut(E), of order at most 6 and at most 3 on x-coordinates
    (IDEA-20260807-9ecc6f). That cap comes from insisting the acting map be an
    AUTOMORPHISM. Drop that. Let psi be any endomorphism in End_{F_p}(E) of small
    norm d > 1 - for a j = 0 curve, End = Z[zeta_3] and psi = 1 - zeta_3 has norm
    3, psi = 2 - zeta_3 has norm 7, and so on. Then:
      - psi acts on x-coordinates by a rational map of degree d, so one orbit
        step costs O(d) field operations: CHEAP;
      - psi acts on G as multiplication by mu = a + b lambda mod N, whose
        MULTIPLICATIVE ORDER L = ord_N(mu) is generically about N, and in any
        case is not bounded by 6;
      - a factor base that is a union of psi-orbits of length L has only B/L
        independent unknowns, because log([mu^t]P) = mu^t log(P);
      - so B/L relations suffice, and L is unbounded.
    AT L = B (one single orbit) the factor base carries ONE unknown, one relation
    suffices, and the relation-count saving is a factor B - which at
    B = ceil(sqrt(N)) is sqrt(N), an exponent-shaped quantity, not a constant.
    THIS RECORD THEREFORE CLAIMS MORE THAN A CONSTANT IN ITS HYPOTHETICAL LIMB,
    AND NAMES EXACTLY WHERE THE EXTRA COMES FROM: from psi not being a unit, so
    that ord_N(mu) replaces |Aut(E)| as the orbit length.

    (B) THE OBSTRUCTION, NAMED, AND THE REDUCTION THAT MAKES IT QUANTITATIVE. A
    psi-orbit is {P, [mu]P, [mu^2]P, ...}: every element is a KNOWN multiple of
    the first. So a psi-orbit-closed factor base of size B is a table of B points
    whose logarithms are known integers times a small number of unknowns. Finding
    a decomposition of a target over such a table is exactly the INCIDENCE
    QUERY - which subsets of the table sum to the target - and KN-FIND-b7e091
    records that the incidence oracle is generic-group simulable in O(m) group
    operations per query, hence closed at exponent 1/2 by Shoup. The closure is
    not asserted abstractly here; it is made concrete:
      AT ARITY m = 2, the algorithm implied by the construction is: store the
      table T = {[mu^t]P : t < B}; for each trial target R, for each entry,
      test whether R - entry lies in T. Per-trial cost B (or O(1) amortised with
      a hash, at B memory). Success probability about B^2 / (2N). Trials to one
      relation: about 2N / B^2. Total: about 2N / B group operations at B memory.
      At B = sqrt(N) this is about 2 sqrt(N) operations and sqrt(N) memory.
      THAT IS BSGS (KN-TECH-031: 2 sqrt(N) operations, sqrt(N) storage), obtained
      by a different route and dominated by it on every axis, and dominated by
      parallel rho on memory by a factor sqrt(N).
    THE OBSTRUCTION IN ONE SENTENCE: an orbit under a map that acts as a scalar
    on G is a table of known multiples, so lengthening the orbit converts index
    calculus into a meet-in-the-middle over a precomputed table, and the exponent
    it reaches is 1/2 by construction.

    (C) THE PRECISE STATEMENT OF WHAT WOULD HAVE TO BE TRUE TO ESCAPE, WHICH IS
    THE RECORD'S REAL DELIVERABLE. The reason the analogous construction IS a
    genuine published result on subfield curves (eprint 2020/1315: factor 1/n on
    polynomial systems, n^2 on linear algebra) is NOT that Frobenius orbits are
    longer. Frobenius also acts as a scalar on a prime-order subgroup, so its
    orbits are also tables of known multiples. The difference is that a
    Frobenius-stable factor base is CUT OUT BY A LOW-DEGREE ALGEBRAIC CONDITION -
    x in F_q, i.e. x^q - x = 0 - so the decomposition test is a polynomial-system
    solve whose cost does NOT scale with the orbit length, and one system solve
    yields relations for a whole orbit of targets. A psi-orbit over F_p is cut out
    by its vanishing polynomial, of degree exactly L, so the algebraic test costs
    at least L and the L-fold saving cancels exactly.
    SO THE OPEN PROBLEM, STATED SHARPLY AND HANDED FORWARD:
      Does there exist, over F_p, a set S of x-coordinates that is
        (i) cut out by a condition of degree polylog(p) (so that the Semaev
            system stays tractable), and
        (ii) stable under an endomorphism whose eigenvalue on G has
            multiplicative order superconstant?
      For the automorphisms the answer is yes and the order is at most 3. For
      non-unit endomorphisms this record exhibits no such S and argues that the
      orbit's own vanishing polynomial has degree L. It does NOT prove none
      exists, and it must not be read as doing so.

    (D) THE TWO OUTCOMES, BOTH DELIVERABLES.
      OUTCOME 1 (predicted) - the measured cost of the psi-orbit construction
        tracks the explicit BSGS map of (B) to within a constant across the whole
        (B, L) grid. Then the lane's exponent-shaped route is closed with a named
        obstruction, an explicit reduction and a quantitative cost map - which is
        the docs/inventor-protocol.md section 4 standard, not a fatigue report.
      OUTCOME 2 - the measured cost falls materially BELOW the BSGS map at some
        (B, L). Then either the simulation argument has a gap or the
        implementation is exploiting something unaccounted for; either way it is
        the single most important event this lane could produce and it triggers
        independent review at review-breakthrough before any interpretation.

  resource_label: >-
    R3 primarily (End(E) as a ring: a non-unit endomorphism, its norm, and its
    eigenvalue's multiplicative order), with R1 for the degree-d rational map on
    x-coordinates that makes the orbit computable.

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    INADMISSIBLE, and filed anyway as a recorded closure with its obstruction
    named, exactly as the BATCH-cb71b5 brief provides for. The reason is the
    DECOMPOSITION section 2 filter applied honestly: although the orbit is BUILT
    by field operations (R1/R3, genuinely non-generic and genuinely cheap), the
    INFORMATION the construction extracts is entirely "which subsets of a table
    of known multiples sum to the target", which is the incidence oracle of
    KN-FIND-b7e091 Oracle C, simulable in O(m) group operations per query and
    therefore closed at exponent 1/2 by Shoup. The non-generic resource buys the
    orbit cheaply; it does not buy any congruence the generic algorithm lacks,
    which is H-ENDO-001's point in its sharpest form - adding endomorphism
    coordinates adds coordinates, never congruences. The record's value is that
    it makes the closure QUANTITATIVE (an explicit reduction to BSGS with matched
    exponents on time and memory) rather than categorical, and that it isolates
    the exact property whose absence causes the failure (a low-degree defining
    condition), which is what (C) hands forward.

  discriminated_from:
    - >-
      IDEA-20260807-9ecc6f, which establishes the constant ceiling for AUTOMORPHISM
      equivariance and explicitly lists "endomorphisms of norm > 1 whose
      eigenvalue has large multiplicative order" as an open class handed to this
      record. This is that class, attempted rather than assumed closed.
    - >-
      H-ENDO-001, which shows that augmenting the WITNESS LATTICE with r
      endomorphisms pins the index at N and leaves the meet-in-the-middle
      exponent at 1/2 with a constant growing like 2^r. That is a statement about
      a lattice search over endomorphism coefficients. This record is about a
      FACTOR BASE closed under one endomorphism's orbit, which is a different
      construction with a different cost structure; the two share the underlying
      reason for failure (scalar action on G) and that shared reason is worth
      recording as the lane's unifying obstruction.
    - >-
      KN-FIND-b7e091 / EV-GGM-79e710 / DEC-20260804-3b4258, which close the
      incidence and endomorphism-image oracle classes at exponent 1/2. This
      record does not re-derive that closure; it EXHIBITS a concrete
      index-calculus construction that lands inside it, computes the constant,
      and shows the resulting algorithm is BSGS. A closure theorem plus a worked
      instance is strictly more useful to the next agent than the theorem alone,
      because the instance is the thing an idea generator would otherwise
      re-propose.
    - >-
      eprint 2020/1315 (Galbraith-Granger-Merz-Petit). Nothing there is
      contested. This record identifies the exact structural ingredient that
      makes their construction work - a low-degree defining condition preserved
      by the acting map - and shows it is absent for psi-orbits over F_p. That
      identification, not the closure, is the contribution.
    - >-
      IDEA-20260807-d6956c, which measures whether the CONSTANT g survives being
      charged. This record asks whether the parameter can be made unbounded at
      all. They are the two halves of "how big can the saving be" and neither
      subsumes the other.

  object_first_candidate:
    tracked_object: >-
      THE psi-ORBIT of an x-coordinate: the sequence
      x, psi(x), psi^2(x), ... of length L = ord_N(mu), tracked as a subset of
      F_p together with the known scalar relation between the logarithms of its
      lifts.
    lossiness: >-
      LOSSY AS A SET, AND THAT IS EXACTLY THE PROBLEM. The orbit forgets the
      individual points and retains only "one unknown plus a known multiplier
      sequence". It passes the section-2 test technically - the individual points
      are not recoverable from the pair (representative, multiplier sequence)
      without evaluating psi - but the projection is lossy in the WRONG
      direction: what it discards is the very independence that would make the
      extra factor-base elements worth having. A factor base whose elements are
      known multiples of each other is, informationally, a factor base of size
      B/L that has been written out L times. The lossy-projection test therefore
      passes and the object still fails, which is a useful demonstration that the
      test is necessary and not sufficient, and it is recorded as such.
    propagation: >-
      One step is exact and cheap: x -> psi(x) costs O(d) field operations, and
      the logarithm multiplier goes t -> t+1 in the exponent of mu. Fully
      deterministic. The orbit closes after exactly L steps and L is computable
      as ord_N(mu) without any discrete logarithm, since mu is publicly known.
    survival_score: >-
      Survives: arbitrary L, arbitrary norm d, both CM discriminants, any arity.
      Dies at: the decomposition test, where the orbit's only algebraic
      description is its degree-L vanishing polynomial - which is the exact point
      at which the structure dissolves and is therefore the honest answer to
      "how far does it survive": all the way to the moment it must be used.

  mechanism: >-
    STEP 1 (zero compute, derivation). Fix a j = 0 toy curve. Compute
    End_{F_p}(E) = Z[zeta_3] or the relevant order; pick psi = 1 - zeta_3
    (norm 3) and psi' = 2 - zeta_3 (norm 7). Write down the degree-d rational map
    on x-coordinates explicitly, either via Velu from the kernel or by composing
    the known automorphism with a small-degree isogeny, and VERIFY it: for random
    P, check that psi(P) computed by the rational map equals [mu]P computed by
    scalar multiplication, where mu = a + b lambda mod N. This verification is
    the whole foundation and it is a known-answer test.

    STEP 2 (cheap). Compute L = ord_N(mu) by factoring N - 1 at toy scale.
    Record the distribution of L over instances: predicted to be a large divisor
    of N - 1, usually N - 1 itself or N - 1 over a small factor.

    STEP 3. Build psi-orbit-closed factor bases at several (B, L) with L | B, by
    choosing B/L orbit representatives and iterating psi. Confirm exact closure
    and that the orbit lengths are exactly L.

    STEP 4. Run the decomposition search at arity m = 2 and m = 3, measuring
    attempts, hits, and INFORMATIVE rank arrival (the unknown count is B/L, so
    the target is B/L). Charge every group operation and every field operation.

    STEP 5. Run the explicit BSGS map of (B): implement the meet-in-the-middle
    of (B) on the same table, on the same instance, with the same accounting, and
    measure its cost. THE COMPARISON IS THE RESULT. Report the ratio
      measured psi-orbit index-calculus cost / measured BSGS-on-the-same-table
      cost
    across the (B, L) grid. Predicted: bounded above and below by constants, with
    no trend in L.

    STEP 6. Run the algebraic-cost limb, which is where the cancellation of (C)
    is made visible. Construct the vanishing polynomial of a psi-orbit of length
    L (degree L by construction) and measure the Semaev system's solving degree
    and time with that polynomial as the factor-base membership condition, as a
    function of L. Predicted: cost growing at least linearly in L, cancelling the
    L-fold relation saving exactly. CONTRAST ARM: the same measurement with the
    membership condition x^q - x = 0 in an extension-field toy instance, where
    the degree is q and the orbit length is n and they are NOT tied together -
    which is precisely why eprint 2020/1315 works there. Running both arms in one
    experiment is what turns the (C) argument into a measurement.

    STEP 7. Write the closure at the section-4 standard: obstruction (B),
    argument (STEPS 5-6), forward guidance (C's open problem). Explicitly not an
    impossibility claim.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Ripgrep over the whole repository on 2026-08-07:
      "non-unit endomorphism|norm > 1|small norm"; "orbit length";
      "multiplicative order"; "known multiples|table of multiples";
      "incidence oracle"; "vanishing polynomial"; "1315|subfield". Full reads of
      KN-FIND-b7e091, H-ENDO-001, EV-ENDO-001 (existence checked),
      IDEA-20260727-001, IDEA-20260726-002, DECOMPOSITION.md sections 2 and 4.
      External: eprint 2020/1315 abstract fetched, its two factors read verbatim.
    results: >-
      The corpus contains the automorphism route in depth (H-STR-002 lane,
      KN-TECH-018) and the lattice-augmentation route (H-ENDO-001), but the
      NON-UNIT endomorphism orbit as a factor-base construction appears NOWHERE:
      "non-unit endomorphism" and "orbit length" return no ECDLP hits, and every
      record that discusses phi assumes it is an automorphism of order 3 or 4.
      The reduction to BSGS with an explicit cost map appears nowhere. The
      identification of "low-degree defining condition" as the property that
      makes the subfield-curve construction work, and its absence here, appears
      nowhere - IDEA-20260727-001 notes the correspondence with eprint 2020/1315
      but attributes the difference to orbit length (n versus 3) rather than to
      the defining condition, which this record argues is the actual load-bearing
      difference.
    verdict: >-
      ADAPTATION with a KNOWN_NEGATIVE core. The closure conclusion is an
      instance of KN-FIND-b7e091, which is already `proved` in this corpus, so
      the OUTCOME is known-negative and this record does not claim otherwise. New
      to this corpus: the construction itself as a named candidate (so that it is
      not re-proposed), the explicit quantitative reduction to BSGS, the
      degree-L cancellation of STEP 6, and the sharpened open problem in (C).

  null_object_control: >-
    MANDATORY AND BLOCKING.
    NULL 1 - THE DOMINATION OBJECT ITSELF: BSGS with a table of the same size B
    on the same instance, in the same accounting unit, run as a first-class arm
    rather than quoted from KN-TECH-031. The psi-orbit construction is claimed to
    BE this algorithm; measuring both and comparing is the whole test, and if the
    two costs do not track, one of them is implemented wrong.
    NULL 2 - RANDOM TABLE: a factor base of B points that are known multiples of
    P but chosen with RANDOM exponents rather than the geometric sequence mu^t.
    It has the same informational content (one unknown, known multipliers) and
    none of the psi structure. PREDICTED: identical cost. If the psi arm beats
    the random-exponent arm, something about the geometric structure is being
    used and that is the one interesting event.
    DECAY PARAMETER: L, the orbit length. As L falls from B to 1, the
    construction must interpolate continuously from "one unknown, BSGS" to
    "B unknowns, ordinary index calculus", and the measured cost must move
    monotonically along that interpolation. A cost that is flat in L means L is
    not doing what the mechanism says it does and every number is void.
    SECOND DECAY PARAMETER for the algebraic limb: the degree of the membership
    condition. STEP 6's contrast arm holds the orbit length fixed while varying
    the condition degree, which is the only way to separate the two effects that
    (C) claims are tied together over F_p and untied over F_{q^n}.
    PLANTED POSITIVE: an instance where the construction MUST win - a factor base
    of B points all of whose logarithms are known and whose target is chosen to
    decompose. The pipeline must recover the logarithm immediately. If it does
    not, the pipeline cannot exploit known logarithms at all and every negative
    it produces is void.

  assumptions:
    - >-
      psi is defined over F_p and maps E(F_p) to itself; its eigenvalue on G is
      mu = a + b lambda mod N, publicly computable from the curve without solving
      any discrete logarithm. Any psi whose eigenvalue could only be obtained by
      solving a discrete logarithm is EXCLUDED, and the exclusion is stated
      because it is exactly where circularity would enter - H-ENDO-001 makes the
      same exclusion for the same reason.
    - >-
      The x-coordinate map of psi has degree d = Norm(psi) and costs O(d) field
      operations to evaluate. Verified in STEP 1 rather than assumed.
    - >-
      L = ord_N(mu) is computable at toy scale by factoring N - 1. At crypto
      scale it is computable given the factorisation of N - 1, which is not
      always available - a practical caveat that does not affect the argument.
    - >-
      Every claimed relation and every claimed solve carries a certificate
      re-verified independently of the solver, per
      docs/claims-and-verification.md. This record's OUTCOME 2 branch is a
      claimed sub-birthday attack, and the certificate requirement is what makes
      that branch reportable at all.
    - Toy scale; claim tier `toy`; no crypto-scale statement is licensed.

  proof_search_map:
    bottleneck: >-
      The decomposition test. Everything else in the construction is cheap and
      the entire question is whether testing "does this target decompose over a
      psi-orbit-closed base" can be done in time o(B) using the orbit structure.
      The record argues it cannot, because the orbit's only algebraic description
      has degree L.
    baseline_embedding:
      parameter_slice: >-
        L = 1 (psi acts trivially, i.e. mu = 1). The construction must reduce
        EXACTLY to ordinary index calculus over a generic factor base of size B
        with B unknowns. And L = B with m = 2 must reduce EXACTLY to the BSGS
        cost map of (B): about 2N/B operations at B memory.
      reproduction_check: >-
        Both slices verified numerically on the same instances, with exact
        operation counts, before any intermediate L is interpreted. A
        construction that does not reproduce BSGS at its own limiting parameter
        is not a generalisation of BSGS and its intermediate numbers mean nothing.
    observation_collision:
      observable: >-
        The measured total cost, in group operations, of recovering k.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED, and it is the record's central
        argument: the psi-orbit construction and plain BSGS on the same table are
        two distinct ground-truth algorithms with the same observable cost. The
        collision is the closure. It says the observable cannot distinguish them,
        hence the construction has no claim to being anything other than BSGS,
        and any future proposal in this shape must exhibit a separating
        observable before it is worth running.
    constructive_transforms:
      - transform: baseline_as_boundary_lift
        proposed_object: >-
          Treat BSGS as the boundary of the certificate family "index calculus
          over a factor base with c independent unknowns", which BSGS occupies at
          c = 1. The lane's automorphism route sits at c = B/3. The question is
          whether any interior point is strictly better than both ends. This is
          the correct frame and it is the reason the record measures a whole
          (B, L) grid rather than one point.
        predicted_gain: >-
          A curve rather than two points, and a demonstration that the interior
          is not better - or, if it is, a located optimum. Predicted: the cost is
          flat or worsening in L, so no interior optimum exists.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable (total cost) fixed and vary the forgotten
          structure: geometric-exponent tables (psi-orbits) versus
          random-exponent tables. An intrinsic invariant distinguishing them
          would be the first evidence that the geometric structure matters.
        predicted_gain: >-
          If no invariant separates them, the psi structure is decorative and
          the closure is complete; NULL 2 is exactly this search.
    quantifier_order: >-
      The claim being CLOSED, written with explicit quantifiers so its failure
      mode is visible: THERE EXISTS psi in End_{F_p}(E) with Norm(psi) small AND
      ord_N(mu) superconstant SUCH THAT FOR ALL targets, the decomposition test
      over a psi-orbit-closed factor base costs o(B). The record argues the
      inner clause fails for every psi it can construct. The dangerous weaker
      reading that must NOT be claimed as a closure: for each psi tested, the
      test cost was not o(B) - which is a fatigue report over a finite sample.
      The record's argument is degree-based (the vanishing polynomial has degree
      L) and therefore quantifies over all psi with the stated properties, which
      is what makes it a closure rather than a survey.
    method_ceiling:
      strongest_certifiable_claim: >-
        "A factor base closed under an endomorphism acting as a scalar on G, with
        orbit length L, carries B/L unknowns and admits a decomposition test no
        cheaper than the generic meet-in-the-middle over the same table; the
        resulting algorithm is BSGS at matched exponents." It can NEVER certify
        that no low-degree condition of the kind sought in (C) exists, that
        non-scalar actions are closed, or anything about extension fields where
        the construction genuinely works.
      nearby_object_control: >-
        THE SUBFIELD CURVE, and it is mandatory. On E/F_{q^n} with a
        Frobenius-stable factor base cut out by x^q - x = 0, the hoped-for
        conclusion HOLDS (eprint 2020/1315). The method must therefore FAIL to
        close that case, and STEP 6's contrast arm exists to check that it does.
        A closure argument that also closed the subfield case would be refuting a
        published result and would be wrong.
    proof_obligations:
      - claim: psi's rational map on x agrees with [mu] on points.
        responsibility: correctness
      - claim: A psi-orbit-closed base of size B carries exactly B/L unknowns.
        responsibility: correctness
      - claim: The vanishing polynomial of a length-L orbit has degree L.
        responsibility: size
      - claim: >-
          At m = 2 and L = B the construction costs about 2N/B operations at B
          memory, matching BSGS.
        responsibility: runtime
      - claim: The planted-known-logarithm positive control is solved immediately.
        responsibility: soundness
      - claim: The argument does NOT close the subfield-curve case.
        responsibility: scope
      - claim: >-
          Any claimed solve carries an independently re-verified certificate.
        responsibility: interface

  heuristic_assumptions:
    - id: HEUR-L5-13
      statement: >-
        For a random j = 0 curve of prime subgroup order N and psi of small norm,
        the eigenvalue mu = a + b lambda mod N has multiplicative order
        L = ord_N(mu) that is a large divisor of N - 1: specifically
        L > (N-1) / (log N)^{1+epsilon} for all but a density-o(1) set of
        instances.
      rigorous_support: >-
        Imitates the classical Artin-type expectation that a fixed non-degenerate
        element of (Z/N)^* has large multiplicative order for almost all N, and
        the standard result that the number of elements of order dividing e is
        exactly e in a cyclic group, so the density of elements of order below Y
        is Y/(N-1). It is NOT a theorem for a FIXED algebraic mu varying with the
        curve, which is exactly the Artin-conjecture-shaped difficulty; it is
        stated as a heuristic and it is not load-bearing for the closure - the
        closure holds for any L, and HEUR-L5-13 only says the interesting regime
        is reachable.
      validation_plan: >-
        Compute L = ord_N(mu) exactly on every toy instance by factoring N - 1,
        and compare the empirical distribution of L/(N-1) against the uniform
        prediction that Pr[L <= Y] = Y/(N-1) for a random element. Tail check:
        the smallest observed L over all instances, which is what would make the
        experiment degenerate. Report instances where L is small as separate
        cells rather than discarding them - a small-L instance is a free
        low-cost data point on the interpolation curve. TOY SCALE ONLY; at
        crypto scale N - 1 need not be factorable and L would be unknown, which
        is a practical caveat recorded but not load-bearing.
    - id: HEUR-L5-14
      statement: >-
        The decomposition probability of a random target over a psi-orbit-closed
        factor base of size B equals that over a random B-subset, i.e. psi-orbits
        equidistribute in the group: Pr = B^m/(m! N)(1 + o(1)).
      rigorous_support: >-
        Imitates the equidistribution of the orbit {[mu^t]P} in a cyclic group,
        which is exactly the statement that a geometric progression in the
        exponent equidistributes - a question controlled by exponential sums over
        multiplicative subgroups. Rigorous bounds exist for the discrepancy of
        {mu^t mod N} when L is large (Korobov / Shparlinski-type bounds on
        exponential sums with exponential functions), so this heuristic is
        BETTER-SUPPORTED than most in the lane, and the bound direction is stated
        rather than asserted.
      validation_plan: >-
        Measure the m-fold sumset coverage of psi-orbit bases by direct
        enumeration at small p, against generic bases at the same B, exactly as
        EV-STR-001 did for arithmetic-progression bases (which is what made that
        record decisive). Predicted: coverage 1 - exp(-B^m/(m! N)), matching the
        generic arm. Tail check: maximum multiplicity in the sumset. A coverage
        deficiency would mean the construction fails for a SECOND, independent
        reason (supply, as in EV-STR-001) and that would have to be reported
        alongside the primary obstruction rather than instead of it. TOY SCALE
        ONLY.

  predictions:
    - metric: >-
        measured psi-orbit construction cost divided by measured BSGS cost on
        the same table, same instance, same unit
      direction: different
      minimum_effect: >-
        PREDICTED in [0.5, 4] with NO trend in L across the grid. A ratio falling
        with L, reaching below 0.5 at the largest L, is OUTCOME 2 and triggers
        review-breakthrough per AGENTS.md rule 12 before any interpretation.
    - metric: Semaev solving degree / time as a function of orbit length L
      direction: higher
      minimum_effect: >-
        Growing at least linearly in L, so that (L-fold relation saving) times
        (per-relation algebraic cost) is flat or worsening. This is the exact
        cancellation of (C) and it is the record's central quantitative claim.
        A solving cost independent of L would falsify the degree-L argument and
        reopen the route.
    - metric: >-
        the same measurement in the extension-field contrast arm, with orbit
        length n and condition degree q held independent
      direction: different
      minimum_effect: >-
        Solving cost independent of n, confirming that the cancellation is
        specific to F_p and that the argument does not accidentally close the
        published subfield result. If the contrast arm also shows cancellation,
        the argument is too strong and is wrong.
    - metric: psi arm cost versus NULL 2 (random-exponent table of the same size)
      direction: different
      minimum_effect: >-
        PREDICTED identical within 20%. A psi arm materially cheaper means the
        geometric structure is being exploited beyond the known-multiple
        property, which is the one interesting event and requires replication.
    - metric: cost as a function of L at fixed B (the interpolation curve)
      direction: different
      minimum_effect: >-
        Monotone from ordinary index calculus at L = 1 to the BSGS map at L = B,
        with no interior minimum below both endpoints by more than a factor 2.
        An interior minimum would be a genuine, if constant, finding and would
        locate an optimal factor-base design.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): STEP 1's verification that psi's
      rational map agrees with [mu]. If it does not, nothing downstream exists.
      STAGE 1 (minutes): compute L = ord_N(mu) on every instance; record the
      distribution (HEUR-L5-13).
      STAGE 2 (minutes, HARD GATE): the planted-known-logarithm positive control.
      STAGE 3 (minutes): both baseline slices - L = 1 must reproduce ordinary
      index calculus, L = B with m = 2 must reproduce the BSGS map exactly.
      STAGE 4 (hours): the (B, L) grid, psi arm and NULL 1 (BSGS) and NULL 2
      (random-exponent table), same instances, same accounting, certificates on
      every claimed solve.
      STAGE 5 (hours): STEP 6's algebraic limb - solving degree and time as a
      function of L, plus the extension-field contrast arm.
      STAGE 6 (hours, small p only): the sumset coverage enumeration for
      HEUR-L5-14.
      STAGE 7 (zero compute): write the closure at the section-4 standard.
      THE CHEAPEST DECISIVE SUBSET is STAGES 0, 2, 3: verifying that the
      construction reproduces BSGS exactly at L = B costs minutes and already
      establishes the domination at the one parameter value where the claim was
      exponent-shaped.
    controls:
      - NULL 1 - BSGS on the same table, first-class arm, same accounting unit
      - NULL 2 - random-exponent table of the same size, same informational content
      - planted-known-logarithm positive control
      - L = 1 and L = B baseline slices, both reproduced exactly
      - extension-field contrast arm, where the argument must NOT close the case
      - >-
        matched parallel Pollard rho with negation (0.886 sqrt(N/6) on these
        curves) reported in group operations with memory beside it
      - >-
        independent certificate verification on every claimed solve, per
        docs/claims-and-verification.md
    required_metrics:
      - psi rational-map verification result per instance
      - L = ord_N(mu) per instance, and its empirical distribution
      - total group operations and peak memory, psi arm and both nulls, per cell
      - Semaev solving degree and wall time as a function of L
      - the same in the extension-field contrast arm as a function of n
      - m-fold sumset coverage and maximum multiplicity, psi arm and generic arm
      - the L = 1 and L = B baseline reproduction results, exactly
      - certificates for every claimed solve, with independent verification status

  falsification_conditions:
    - >-
      STEP 1's verification fails: psi's rational map does not agree with [mu].
      The construction does not exist as described; halt.
    - >-
      The L = B, m = 2 slice does not reproduce the BSGS cost map to within a
      constant. Either the implementation or the reduction in (B) is wrong, and
      the record's central argument is unsupported until reconciled.
    - >-
      The measured cost ratio against BSGS falls below 0.5 and decreases with L.
      The closure is FALSE, the construction beats BSGS, and this is a claimed
      sub-birthday result requiring review-breakthrough at max effort per
      AGENTS.md rule 12, an independently verified certificate, and replication
      before any interpretation. This is stated first among the falsifiers
      deliberately: the record must not make its own negative easy to reach.
    - >-
      The Semaev solving cost is independent of L. The degree-L cancellation
      argument of (C) is false and the algebraic route is reopened with a
      concrete target.
    - >-
      The extension-field contrast arm ALSO shows the cancellation. The argument
      is too strong, would contradict a published result, and is wrong as stated;
      it must be narrowed before it can be a closure.
    - >-
      The planted positive control is not solved. The pipeline cannot exploit
      known logarithms and every negative it produces is void.

  confounders:
    - >-
      MEMORY IS NOT FREE. The construction stores a table of B points and so
      competes against BSGS, not against constant-memory rho. KN-TECH-031 records
      Wiener's point that BSGS is sqrt(N) processor steps but N^{2/3+o(1)} FULL
      cost once memory is charged, and that treating the two as interchangeable
      is wrong. Every cost in this record must be reported with memory beside it
      and the full-cost comparison stated, or the domination claim is understated
      in the construction's favour.
    - >-
      TOY-SCALE L. At p up to 2^32, N - 1 factors easily and L is knowable; at
      crypto scale it may not be. This does not affect the closure but it does
      affect any claim that the construction is implementable at scale.
    - >-
      SMALL-NORM psi MAY NOT EXIST on a given curve. End_{F_p}(E) is an order of
      conductor f_E, and the available norms are constrained by the discriminant.
      Instances where no small-norm non-unit psi exists must be recorded as
      skipped rather than silently dropped.
    - >-
      psi AND ITS CONJUGATE. psi and its complex conjugate generate the same
      orbits up to relabelling; running both as if independent would double-count.
    - >-
      THE m = 2 CASE IS ALREADY GENERIC. At arity 2 the decomposition test is a
      meet-in-the-middle by construction and the reduction to BSGS is almost
      immediate. The interesting arithmetic is at m >= 3, where the algebraic
      route is the only alternative to a B^{m-1} search, and STEP 6 is where the
      record earns its conclusion.

  interpretation_limits:
    - >-
      THE LINEAR-ALGEBRA STAGE IS NOT THE DOMINANT COST OF PRIME-FIELD INDEX
      CALCULUS - RELATION COLLECTION IS (EV-STR-001: 0.4% to 3% of charged total).
      This record is about the relation stage and about the unknown count, which
      is why it is the only L5 proposal with an exponent-shaped limb at all; the
      linear-algebra saving it would imply (a factor L^2) is irrelevant beside
      the relation-stage cost and is not claimed.
    - >-
      A confirmed closure here closes ONE construction within a stated scope. It
      does not declare the endomorphism direction impossible - (C) names a
      concrete open problem that would reopen it - and it says nothing about
      extension fields, where the same shape of construction is a published
      success.
    - >-
      Toy tier only, claim tier `toy`. The BSGS domination map is derived
      analytically and confirmed at toy scale; the analytic derivation, not the
      toy measurement, is what carries it.
    - >-
      This record moves no hypothesis status and has no authority to.

  reachability_gate: >-
    T5's isogeny-walk form does not apply directly - the construction fixes one
    curve - but T5's SPIRIT applies with full force and is the reason this record
    is written at all. The lane's ambition was "find a curve where the acting
    group is large". T4 says the acting AUTOMORPHISM group is class-determined
    and capped at 6, so no walk helps. This record asks whether a NON-UNIT
    endomorphism escapes the cap, which requires no walk at all: End_{F_p}(E) is
    available on the curve you already have, and psi of norm 3 exists on every
    j = 0 curve. So the good object is REACHABLE AT ZERO COST - which is exactly
    why the obstruction must be located in the decomposition test rather than in
    reachability, and it is. Cost of reaching a psi with L large: O(1) field
    operations plus one factorisation of N - 1. Availability is not the problem;
    usability is.

  target_complexity:
    time_exponent: >-
      THIS RECORD'S HYPOTHETICAL LIMB CLAIMS MORE THAN A CONSTANT, AND SAYS
      EXACTLY WHERE FROM: the orbit length L = ord_N(mu) is not bounded by
      |Aut(E)| <= 6 because psi is not a unit, so the unknown count B/L can fall
      by an unbounded factor and at L = B the relation requirement falls from B
      to 1 - a factor B = N^{1/2} at the usual balance point. ITS MEASURED LIMB
      CLAIMS NOTHING: the predicted total cost is about 2N/B group operations at
      B memory, i.e. exponent 1/2 in time and 1/2 in memory at B = sqrt(N),
      identical to BSGS, with the exponent forced by KN-FIND-b7e091 and Shoup.
      The gap between the two limbs is the record's content.
    memory_exponent: >-
      1/2 at the balance point (a table of B = sqrt(N) points), which is the
      construction's decisive weakness: parallel rho achieves the same time
      exponent at O(1) memory, so the construction is Pareto-dominated on memory
      by a factor sqrt(N) even where it matches on time, and by
      Wiener's full-cost accounting (KN-TECH-031) its true cost is N^{2/3+o(1)}.
    best_known: >-
      Parallel rho with distinguished points at 0.886 sqrt(N) group operations
      and O(1) memory per processor (KN-TECH-001, KN-TECH-006); on j = 0 curves
      the automorphism-discounted variant at about 0.36 sqrt(N) (KN-TECH-018);
      BSGS at 2 sqrt(N) operations and sqrt(N) storage with full cost
      N^{2/3+o(1)} (KN-TECH-031). The construction reproduces the third and beats
      none.
    hidden_overhead: >-
      The construction's o(1) hides the decomposition test. At m = 2 that test is
      a table lookup and the accounting is transparent. At m >= 3 the test is
      either a B^{m-1} search or an algebraic solve against a degree-L membership
      condition, and it is precisely there that the L-fold saving is cancelled.
      Any presentation of this construction that quotes the L-fold relation
      saving without the per-relation test cost is hiding the entire obstruction
      in the o(1), and that is the failure mode this record exists to prevent.
    tradeoff_note: >-
      The construction is a pure time-memory tradeoff of exactly the BSGS shape:
      B memory buys 2N/B time. It sits on the BSGS line and nowhere below it. The
      parallelisation position is poor: BSGS parallelises worse than rho with
      distinguished points, which is why no record computation uses it
      (KN-TECH-031), and the construction inherits that.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES, and not null.
    (1) Parallel rho with distinguished points: 0.886 sqrt(N) group operations,
    O(1) memory per processor, near-linear parallel speedup (KN-TECH-001,
    KN-TECH-006). DOMINATES on time (0.886 versus about 2 at the balance point),
    dominates overwhelmingly on memory (O(1) versus sqrt(N)), dominates on
    parallelisation. (2) Automorphism-discounted rho on j = 0 curves, about
    0.36 sqrt(N) (KN-TECH-018) - the correct baseline for this lane's curves and
    it dominates by a further factor of about 2.4 on time. (3) BSGS at 2 sqrt(N)
    time and sqrt(N) memory (KN-TECH-031): the construction MATCHES it on both
    axes and is dominated on simplicity, since BSGS needs no endomorphism, no
    factor base and no orbit computation. There is no axis - time, memory,
    data/queries, preprocessing, or parallelism - on which this construction is
    not matched or beaten. That is the closure, stated as a Pareto fact.
  sota_delta: >-
    Zero speedup against any attack baseline, and the record predicts exactly
    zero rather than merely failing to find one: measured cost about 2N/B at B
    memory versus 0.886 sqrt(N) at O(1) memory for the correct baseline, i.e. a
    slowdown of about 2.3x in time and a memory blowup of sqrt(N) at B =
    sqrt(N), or about 6.4x in time against the automorphism-discounted baseline
    on the same curves. The hypothetical limb's factor of L = B = N^{1/2} in
    relations needed is real and is fully cancelled by the per-relation test
    cost; quantifying that cancellation, rather than asserting it, is the
    deliverable.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.05 that the construction beats BSGS or rho - the generic-group closure
    (KN-FIND-b7e091, `proved`, theorem_backed) makes this close to excluded, and
    a 0.05 rather than 0 reflects implementation surprise and the possibility of
    a gap in the simulation for m >= 3 rather than genuine doubt about Shoup.
    0.85 that the L = B slice reproduces the BSGS cost map cleanly. 0.7 that the
    Semaev solving cost grows at least linearly in L, confirming the degree-L
    cancellation. 0.9 that the extension-field contrast arm behaves differently,
    confirming the argument is correctly narrow. The record's value is almost
    entirely in the closure and in the sharpened open problem of (C), not in the
    small chance of a positive; it is proposed at medium rather than low priority
    because it is the only proposal in the lane whose hypothetical limb is
    exponent-shaped, and the inventor protocol forbids declining to attempt it.

