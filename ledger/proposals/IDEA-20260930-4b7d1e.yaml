    rows_checked: [KR-RHO-6239aa, KR-RHO-7d93f6, KR-RHO-46c2c6, KR-RHO-037e22, KR-RHO-5b1c0a, KR-IC-b0fcda, KR-IC-1fcdbc]
    nearest:
