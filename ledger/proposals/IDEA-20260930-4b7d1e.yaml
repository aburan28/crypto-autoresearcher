idea:
  id: IDEA-20260930-4b7d1e
  question_id: null
  question_id_note: >-
    Left null deliberately. H-SEMBIN-8e7ae3 carries question_id
    RQ-SEMBIN-9fa4ba, which DEC-20260928-7c3d91 ruled MIS-ATTRIBUTED. The owning
    goal GOAL-SEMBIN-5078bc lists RQ-SEMBIN-fa2e3f and RQ-SEMBIN-ade131, neither
    read in this session. Binding a question is the Coordinator's act at
    archival.
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: >-
    HEUR-GENERIC-MSUM IS CONTRADICTED AS WORDED by van Oorschot-Wiener
    golden-collision meet-in-the-middle (per-target time about 7|F|^(3m/4 - s/2)
    at store |F|^s, below |F|^(m-s) for every s < m/2). Restate it as a
    relation-harvesting statement with the table fill charged, and re-derive
    whether H-SEMBIN-8e7ae3's family bound survives HYBRID oracles (a shared
    table plus per-target golden-collision search)

  class: control

  claim: >-
    (A) Under vOW's random-function behaviour, generic m-SUM on E(F_(2^n)) per
    target admits time about 7 |F|^(3m/4 - s/2) at store |F|^s >= 2^10 (with
    l >= 2|F|^(m/2)). That is strictly below HEUR-GENERIC-MSUM's |F|^(m-s) for
    s < m/2, so the heuristic's literal statement is false for m >= 4 (and for
    m = 3 at s < 1).
    (B) This does not by itself create a sub-rho cell in H-SEMBIN-8e7ae3's
    family. A per-target golden-collision oracle pays >~ sqrt(2l) per relation
    (KR-RHO-7d93f6 applied to C = |S|/2k collisions), and the shared-table PMITM
    line with fill charged pays >= 2 sqrt(|F| l).
    (C) OPEN: whether some hybrid that shares a table across targets AND uses
    golden-collision search per target beats T*M ~ |F| l (shared table) without
    paying sqrt(l) per relation. Outcome (C-yes) would void P3 of
    H-SEMBIN-8e7ae3 as stated. Outcome (C-no) lets HEUR-GENERIC-MSUM be
    restated as "relation harvesting over F costs >= 2 sqrt(|F| l) generically,
    fill charged", which is validatable, unlike the current wording.

  mechanism: >-
    vOW §5.3 converts a two-list match f1(a) = f2(b) into a collision search for
    f(x,i) = g(f_i(x)) on |S| = 2 n1 points and finds the golden collision in
    about 2.5 sqrt(|S|^3/w) iterations (eq. 4). For m-SUM the two lists are the
    half-sums and the target-shifted half-sums, n1 = n2 = |F|^(m/2). The
    memory-limited MITM that HEUR-GENERIC-MSUM codifies is vOW's "standard
    approach", n1 n2/(2w), which the paper itself beats by 0.07 sqrt(n1/w). The
    family-level question is different: it amortises a table across targets.
    The golden-collision memory is target-specific, and a target-specific
    search must find about |S|/2k collisions, which KR-RHO-7d93f6 prices at
    >= sqrt(C |S|). A hybrid would need the target-dependent golden-collision
    walk to consult a target-independent store. Whether that can raise the hit
    rate beyond the coverage of the store is the open step.

  novelty_status: unverified
  novelty_note: >-
    The vOW technique is retrieved and known. Its application to the m-SUM
    oracle of a binary-curve index calculus, and the hybrid question, were not
    searched for in the k-SUM or index-calculus literature beyond the screen in
    TASK-20260929-c05f6e literature-screen.md §2b. Hence unverified, not
    adaptation.

  origin:
    task: TASK-20260929-c05f6e
    deliverable: D1 (contradictory source found during the literature screen)
    note: >-
      Spawned from the D1 screen, not from the D3 Frobenius analysis. It is
      Frobenius-free and applies to any binary curve the family prices.

  citations:
    - ref: KN-LIT-73f7e1
      provenance: retrieved
      claim: >-
        vOW §4.2 eq. (4): golden collision in about 2.5 sqrt(n^3/w) iterations
        for w >= 2^10. §5.3 eq. (8): MITM by collision search in about
        7 n2 sqrt(n1/w), against n1 n2/(2w) for the memory-limited standard
        approach. Line 766: precondition |R| >= 2|D1|. Display equations are
        fragmentary in the vendored text and are restated from prose plus
        fragments, consistent with the stated 0.07 sqrt(n1/w) ratio.
      verified_by: >-
        idea-generator, TASK-20260929-c05f6e, read at
        inputs/VOW-1996-PCS/paper_fulltext.md lines 316-415 and 680-774
    - ref: KR-RHO-7d93f6
      provenance: internal
      claim: >-
        Finding C collisions with time T and space S requires
        T^2 S = Theta~(C^2 N) (Dinur 2020). The row's sources are
        abstract-read.
      verified_by: idea-generator, TASK-20260929-c05f6e (row read)
    - ref: KR-RHO-46c2c6
      provenance: internal
      claim: >-
        L discrete logs cost about sqrt(2 L l) in total, tight by Yun 2015's
        generic bound. Applies to the family only by analogy, because F is
        defined non-generically (by x-coordinates).
      verified_by: idea-generator, TASK-20260929-c05f6e (row read)
    - ref: H-SEMBIN-8e7ae3
      provenance: internal
      claim: >-
        HEUR-GENERIC-MSUM statement and falsification condition (lines 56-79);
        mechanism text giving the PMITM family model; P3 (store exponent >= n/2).
      verified_by: idea-generator, TASK-20260929-c05f6e (read in full)
    - ref: "Yun, Generic hardness of the multiple discrete logarithm problem, EUROCRYPT 2015"
      provenance: recalled
      claim: Pointer only; the bound is carried by KR-RHO-46c2c6.
      verified_by: null

  assumptions:
    - >-
      The family cost model is H-SEMBIN-8e7ae3's as reconstructed from its
      mechanism text. RUN-SEMBIN-c68773 and EXP-SEMBIN-04ec3c's cost model were
      NOT read; the first step of the derivation is to read them and pin the
      model.
    - >-
      Unit cost: one group operation per function evaluation, the same unit on
      every arm and on vOW parallel rho.

  proof_search_map:
    bottleneck: >-
      The step "per-relation cost of any generic harvester is >= min(sqrt(l),
      l / store coverage)", which is what the family bound actually needs and
      HEUR-GENERIC-MSUM does not state.
    baseline_embedding:
      parameter_slice: >-
        w = n1 (full-memory MITM) makes vOW eq. (8) and the memory-limited line
        coincide at |F|^(m/2): the s = m/2 point of HEUR-GENERIC-MSUM. The
        shared-table PMITM line T = M + |F| l / M is the family baseline.
      reproduction_check: >-
        Symbolic: at s = m/2, 7|F|^(3m/4 - m/4) = 7|F|^(m/2) against |F|^(m/2).
        A numeric fixture against RUN-SEMBIN-c68773's committed rows is owed.
    observation_collision:
      observable: >-
        The (time, store) pair of an m-SUM oracle per target.
      distinct_preimage_search: >-
        FOUND. PMITM and vOW-MITM have the same store and different time, so
        "(time, store) per target" does not identify the family's cost. The
        amortisation regime (shared or target-specific memory) must be part of
        the observable. That is the restatement this idea proposes.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Restate the heuristic over relation HARVESTING (|F| relations, fill
          charged, memory shared or not) rather than single-target m-SUM.
        predicted_gain: >-
          A statement that is validatable and that survives the vOW row,
          if (C-no).
    quantifier_order: >-
      FOR ALL binary prime degrees n, fixed m, |F| = 2^D, store M and EVERY
      generic harvester H (group operations plus equality tests plus a hash on
      encodings), THE number of group operations to output |F| independent
      relations satisfies T >= c * min over regimes of [M + |F| l / M;
      |F| sqrt(l)]. The open quantifier is "every hybrid H".
    method_ceiling:
      strongest_certifiable_claim: >-
        A derivation in the collision-counting model (KR-RHO-7d93f6), not a
        generic-group-model theorem, because F is defined by x-coordinates.
        Membership-test (non-generic) oracles and algebraic oracles are outside
        it.
      nearby_object_control: >-
        m = 3 at s = 1, where vOW and PMITM coincide in exponent (|F|^2): the
        method must reproduce the program's measured m = 3 anchor (Riemann-Roch
        oracle Theta(|F|^2)) and must NOT predict a gain there.
    proof_obligations:
      - claim: vOW eq. (8) applies to the m-SUM half-sum split, with l >= 2|F|^(m/2) and a golden-collision test (group-element equality)
        responsibility: correctness
      - claim: per-target golden-collision cost >= sqrt(C |S|) with C = |S|/2k, i.e. >~ sqrt(2l) per relation
        responsibility: runtime
      - claim: shared-table PMITM with fill charged is >= 2 sqrt(|F| l)
        responsibility: baseline
      - claim: no hybrid exceeds the max of the two hit-rate sources (the open step)
        responsibility: strictness
      - claim: comparison against vOW parallel rho with the same unit and the same store charging
        responsibility: interface

  predictions:
    - metric: per-target oracle time exponent e_T(s) = log_|F| T at store |F|^s, m = 4
      direction: lower
      minimum_effect: >-
        e_T(1) = 2.5 (vOW) against 3 (HEUR-GENERIC-MSUM); a gap of 0.5 in
        exponent, i.e. a factor |F|^0.5.
    - metric: slope of log2 T against log2 w for the vOW arm on a toy m = 4 instance
      direction: different
      minimum_effect: >-
        -0.5 for the vOW arm against -1 for the memory-limited arm, separated
        by more than 3 standard errors over at least 4 memory settings.
    - metric: per-relation cost of the vOW arm relative to sqrt(l)
      direction: higher
      minimum_effect: >-
        Ratio >= 1 at every setting (prediction B). A ratio below 0.5 at any
        setting with controls passing falsifies the sketch.

  minimal_test:
    design: >-
      STEP 1, ZERO COMPUTE. A derivation note: read RUN-SEMBIN-c68773's model;
      add the vOW per-target row and the hybrid question; state the restated
      heuristic and the cells, if any, it moves.
      STEP 2, OPTIONAL TOY FIXTURE, only if step 1 leaves (C) open. One binary
      curve over F_(2^n) with n in [31, 41] and a prime-order subgroup;
      F = F_V with dim V in {8, 9, 10}; m = 4; w in {2^10, 2^12, 2^14, 2^16}.
      Arms: memory-limited MITM (the heuristic's line) and vOW golden-collision
      MITM, same op counter. At least 30 targets per cell.
      Metrics with units: group operations to first relation (count), relations
      per target (count), wall-clock (s, reported only). Thresholds above,
      stated before any run.
    controls:
      - >-
        KNOWN-POSITIVE: vOW's own random-function benchmark. A golden-collision
        search on a keyed random function on |S| = 2^20 points with w = 2^10
        must reproduce Table 1's coefficient (about 2.4-2.6 on sqrt(|S|^3/w))
        within 15 percent. Failure voids the vOW arm.
      - >-
        NULL OBJECT: the same harness on a curve-free keyed random function
        with identical list sizes. If the elliptic arm's slope differs from the
        null's by more than its standard error, the difference is attributed
        to the curve and investigated before any reading.
      - >-
        NEARBY OBJECT: m = 3, s = 1, where both arms must give exponent 2.
      - >-
        BASELINE: vOW parallel rho on the same subgroup, same op counter, as
        the reference for prediction B.
    required_metrics:
      - group operations per relation per arm per w (count)
      - fitted slope of log2 T against log2 w with standard error
      - ratio of per-relation cost to sqrt(l)
      - known-positive coefficient

  falsification_conditions:
    - >-
      (A) is false if the vOW arm's slope in log w is indistinguishable from -1
      or its exponent at s = 1 is >= 3 with controls passing, i.e. the golden
      collision search does not apply to the m-SUM split as derived.
    - >-
      (B) is false if the vOW arm yields a relation in fewer than 0.5 sqrt(l)
      group operations at any setting with all controls passing.
    - >-
      (C-no) is false if step 1 exhibits a hybrid with T * M below |F| l / 4 at
      per-relation cost below sqrt(l); that outcome is escalated, not claimed
      (AGENTS.md rule 12).

  confounders:
    - >-
      vOW's constants come from simulations of random functions. On toy sizes,
      w close to |S| leaves the formula's validity range (w <= |S|/2^10).
    - >-
      Unordered versus ordered tuples change list sizes by (m/2)!. Both arms
      must use the same convention.
    - >-
      The membership test x(P) in V is non-generic and gives a |F|^(m-1)
      O(1)-store oracle. It must not be mixed into the generic arms.

  interpretation_limits:
    - >-
      Nothing here bears on the Frobenius, on Koblitz-specific structure, or on
      algebraic (Groebner/SAT) oracles. It is about generic m-SUM pricing only.
    - >-
      A toy-scale slope is evidence about the algorithm, not about any
      deployed curve. Transfer to n = 131..571 is by the derivation, not by
      extrapolating timings.
    - >-
      Per GOAL-SEMBIN-5078bc criterion 6 and DEC-20260928-7c3d91's ruling, no
      outcome discharges criterion 4.

  heuristic_assumptions:
    - id: G1
      statement: >-
        The golden collision of f(x,i) = g(f_i(x)) for the m-SUM half-sum split
        is found by vOW at the rate their random-function simulations give:
        about 2.5 sqrt(|S|^3/w) iterations per golden collision, divided by k
        when k golden collisions exist.
      rigorous_support: >-
        vOW §4.2 Table 1 (simulated, retrieved). The lower-bound side is
        KR-RHO-7d93f6 (T^2 S >= C^2 N, abstract-read).
      validation_plan: >-
        SAMPLE: iterations to the golden collision on toy instances (step 2
        grid), at least 30 targets per cell. COMPARE: against
        2.5 sqrt(|S|^3/w)/k. TAIL: the 90th percentile against an exponential
        with the same mean. TRANSFER: assumed size-independent, as in vOW's
        Table 1 across n = 2^16 to 2^32. Stated, not tested beyond.
    - id: G2
      statement: >-
        Found collisions are not biased toward or away from the golden one
        beyond what function versioning removes. So a target-specific search
        must find about |S|/2k collisions.
      rigorous_support: >-
        vOW lines 342-351: versioning is required because a fixed function's
        golden collision may be rarely detected.
      validation_plan: >-
        From the same runs: the empirical distribution of collisions-before-
        golden against |S|/2k, with a KS test.

  target_complexity:
    time_exponent: >-
      Per target: |F|^(3m/4 - s/2) against |F|^(m-s) for s < m/2. Family level:
      NO exponent change claimed. Per-relation cost >~ sqrt(l), so no sub-rho
      index calculus follows.
    memory_exponent: '|F|^s per target (not shared across targets)'
    best_known: >-
      vOW parallel rho, about sqrt(pi l / 2) with negligible store
      (KR-RHO-6239aa), and sqrt(pi l / 4n) on Koblitz curves (KR-RHO-037e22).
    hidden_overhead: >-
      Constant 7 (eq. 8), function versioning, and the w >= 2^10 validity
      floor.
    tradeoff_note: >-
      Per target T^2 M = 49 |F|^(3m/2); parallelises linearly (vOW). In the
      shared-table regime the memory-limited line T M = |F| l remains the
      family's frontier unless (C-yes).

  estimated_cost:
    implementation: low
    compute: low
    qualification: >-
      Step 1 is a derivation note (hours). Step 2 is about 300 lines plus the
      existing toy binary-curve arithmetic, minutes to an hour of compute
      (estimates).

  asymptotic_claim:
    problem: generic m-SUM per target on E(F_(2^n)), and relation harvesting
    prior_best: HEUR-GENERIC-MSUM's |F|^(m-s) (program heuristic, unvalidated)
    time_exponent: '3m/4 - s/2 in units of log|F| per target'
    memory_exponent: 's in units of log|F|'
    hidden_cofactor: '7, versioning'
    claim_kind: heuristic_restatement

  dominated_by: >-
    n/a (no result claimed). As an ECDLP algorithm the vOW-oracle index
    calculus is dominated by vOW parallel rho in time at every memory
    (KR-RHO-6239aa, KR-RHO-037e22; per-relation >= sqrt(l)). Rows read:
    KR-RHO-6239aa, KR-RHO-037e22, KR-RHO-7d93f6, KR-RHO-46c2c6, KR-RHO-5b1c0a,
    KR-IC-b0fcda, KR-IC-1fcdbc.

  sota_delta:
    time: >-
      Against HEUR-GENERIC-MSUM: per-target exponent lower by m/4 - s/2 (0.5 at
      m = 4, s = 1). Against rho: none.
    memory: none
    data_queries: none

  frontier_check:
    status: partial
    note: >-
      Seven rows read in full. The remaining generic-rho and index-calculus
      rows were read by title only.

  recommended_priority: high
  priority_rationale: >-
    It attacks the load-bearing premise (HEUR-GENERIC-MSUM) directly, it is
    cheap, and the TASK-20260929-c05f6e design pass found the Frobenius route
    capped at a log factor. Either outcome of (C) changes a committed record's
    wording: P3 is voided, or the heuristic becomes validatable. It moves no
    ECDLP exponent and is ranked as a building block for honest pricing, not
    as an attack.

  first_deliverable: >-
    A derivation note pinned to RUN-SEMBIN-c68773's model with the vOW row
    added and the hybrid question answered or stated as open with its exact
    missing step.

  next_gate: >-
    Coordinator decision: archive this proposal; decide whether step 1 is
    carded as a zero-run derivation task under GOAL-SEMBIN-5078bc; decide
    rule-12 routing if (A) is carried into any record as a contradiction of
    HEUR-GENERIC-MSUM.

  discriminated_from: >-
    TASK-20260929-c05f6e's Frobenius-orbit analysis (DESIGN.md §3) is
    curve-structural and capped at a log factor. This idea is generic and
    Frobenius-free. EXP-ICEX-850e41 is prime-field exponent-side and bears on
    neither (DEC-20260929-3e8a1c A4); it is not cited here as support, null or
    prior.

