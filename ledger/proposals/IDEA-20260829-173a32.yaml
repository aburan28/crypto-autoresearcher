  assumptions:
  - >-
    Every rank entering a coset sum is an UNCONDITIONAL LOWER BOUND from
    exhibited points on the exact twist, re-verified on-curve in exact rational
    arithmetic by a verifier that did not find the point. No analytic rank, no
    Selmer bound, no BSD.
  - >-
    Twists whose descent hits the alarm contribute ZERO to every coset sum and
    are counted as timed_out, never as rank 0 - the discipline EV-ECRANK-b6c9b6
    already records. A censored twist therefore biases every total DOWNWARD, so
    every reported total is a lower bound in a second, independent sense.
  - >-
    Within-class multiplicity, wherever it is used, is certified by the exact
    F_l reduction route of IDEA-20260829-d53906 if that route is validated, and
    otherwise by a regulator with the weakness labelled. THE CHOICE IS RECORDED
    PER CLASS, never averaged over the certificate.
  - >-
    The base curves are used as committed. This proposal runs NO new search for
    high-rank curves over Q; it consumes the ones already certified.

  proof_search_map:
    bottleneck: >-
      T_k, the sum of twist ranks over the 2^k - 1 non-identity classes of V.
      The base rank term is now large and measured; every remaining unknown at
      k = 3 is in T_3. The step whose removal changes the answer is "raise T_3
      above 18 while keeping |V| = 8", and no lever for that has been identified,
      which is precisely why T_3 must be MEASURED as a function of the base
      rather than assumed constant.
    baseline_embedding:
      parameter_slice: >-
        k = 0, V trivial, K = Q. The construction returns exactly rank E(Q) and
        nothing more - 12 for the pencil curve, 13 for the best Mestre pool
        curve. This is the exact old-method boundary and it is a regression
        fixture, not a separate code path.
      reproduction_check: >-
        Frozen and run FIRST. The pipeline must reproduce the committed k = 3
        optimum of 20 on the committed 502-curve pool with the committed support
        set before any number computed on a new base curve is believed. A
        pipeline that returns more than 20 there has a bug that would manufacture
        the headline, and this is a stop condition.
    observation_collision:
      observable: >-
        The k = 3 optimum, as a function of the maximum twist rank present in the
        coset.
      distinct_preimage_search: >-
        SEARCHED FOR EXPLICITLY, as H-ECRANK-f2a2f7 already specifies: two cosets
        with the SAME maximum twist rank but DIFFERENT totals falsify
        separability directly. A second and more dangerous collision is
        structural and is new here - V is a SUBGROUP, so once d_1, d_2, d_3 are
        chosen the remaining four classes d_1d_2, d_1d_3, d_2d_3, d_1d_2d_3 are
        FORCED. Two searches that select the same three generators but report
        different totals would indicate a bug in the coset construction; two
        searches selecting different generators with the same product set are the
        same object counted twice and must be canonicalised modulo squares before
        any distribution over cosets is formed.
    quantifier_order: >-
      EXISTS a base curve E from the committed set and EXISTS a subgroup V of
      order 8 such that FOR ALL 8 classes d in V the exhibited points are
      non-torsion, lie on E^(d), and their per-class certified multiplicities sum
      to at least 31. The existential over (E, V) is discharged by exhibition
      over a FROZEN finite search space declared before the run; the universal is
      over 8 explicit classes. The separability claim carries a different and
      weaker quantifier and must not be stated with this one: it is "FOR the
      tested base curves and the tested coset population, the conditional mean of
      T_3 given rank E(Q) has slope beta", an estimate over a sample, never a
      statement about all curves.
    method_ceiling:
      strongest_certifiable_claim: >-
        rank E(K) >= sum over the 8 classes of the certified multiplicities, a
        LOWER bound only. The eigenspace argument alone certifies at most 8 at
        k = 3, so any degree-8 result at rank 31 needs an average multiplicity of
        nearly 4 per class. Nothing here can say anything about rank over Q
        beyond the d = 1 term, and nothing can prove degree 8 UNREACHABLE - a
        failure is a property of the search space actually enumerated, and the
        record must say so.
      nearby_object_control: >-
        Two. (i) k = 4, same pool, same bases: if the new base curves raise the
        k = 4 total well above the committed 32 while leaving k = 3 far below 31,
        that is separability failing in the informative direction, exactly as
        H-ECRANK-f2a2f7 pre-registers. (ii) THE OLD POOL AS A MATCHED ARM: rerun
        the identical k = 3 optimisation on rank-3/4 pool curves alongside the
        rank-12/13 curves, same support set, same budget, same alarm. The
        difference of the two T_3 values IS the separability measurement, and
        running only the new bases would confound the base effect with every
        change in the pipeline since 2026-08-22.
    proof_obligations:
    - claim: each exhibited point lies on its stated twist and is non-torsion
      responsibility: correctness
    - claim: within-class multiplicities are independent, by a named and recorded certificate kind
      responsibility: correctness
    - claim: V is a subgroup, so K is the field named and [K - Q] = |V|
      responsibility: interface
    - claim: the support set and coset enumeration were frozen before the run
      responsibility: strictness
    - claim: >-
        any reported shortfall is a property of the enumerated search space and
        not a proof of unreachability
      responsibility: scope

  predictions:
  - id: P1
    metric: >-
      best k = 3 total (rank certified over a degree-8 multiquadratic field) over
      the frozen search space, using the committed rank-12 and rank-13 base
      curves
    direction: >-
      increase over the committed 20, but FALL SHORT of 31
    minimum_effect: >-
      total in the interval [26, 30]. Below 26 means the base rank did not
      transfer at all and separability fails downward; 31 or above would be a new
      Pareto point and falsifies the prediction in the valuable direction.
  - id: P2
    metric: >-
      the separability slope beta in a regression of T_3 (the sum over the 7
      non-identity classes) on rank E(Q), across base curves of rank 3, 4, 11, 12
      and 13, with |d| and coefficient size matched
    direction: >-
      beta not distinguishable from 0
    minimum_effect: >-
      |beta| < 0.5 twist-rank units per unit of base rank, with a 95 percent
      interval excluding |beta| > 1.0. A beta of 1.0 or more would mean each unit
      of base rank buys another unit somewhere in the coset, which would change
      the entire degree-lowering calculus and is the outcome most worth being
      wrong about.
  - id: P3
    metric: >-
      the base rank that would be needed for a k = 3 total of 31, derived from
      the measured coset structure (GOAL-ECRANK-002 completion criterion C2)
    direction: >-
      a finite number is produced, with an error bar
    minimum_effect: >-
      the estimate is reported with a bootstrap interval over cosets whose width
      is under 6 rank units. An interval wider than that means the coset
      population is too heterogeneous for the extrapolation and the honest output
      is the heterogeneity, not the extrapolation.
  - id: P4
    metric: >-
      best k = 4 total (degree-16 field) with the new bases, against the
      committed 32
    direction: increase
    minimum_effect: >-
      at least 38. The committed rung is 32 from a rank-4-class base; adding
      about 9 of base rank should carry through at k = 4 if separability holds.
      Failure to move at k = 4 while k = 3 moves would be internally
      inconsistent and indicates a pipeline defect rather than a result.

  minimal_test:
    design: >-
      Step 0 - FREEZE, before any run: the base-curve set (the rank-12 pencil
      curve of EV-ECQ-0d142e, both rank-13 Mestre curves, a sample of 10 rank-12
      and 10 rank-11 pool curves, plus 10 matched rank-3/4 curves from the
      committed 502-curve pool as the old-pool arm); the support prime set S from
      which square classes are drawn; the coset enumeration rule; the ellrank
      alarm; and the denominators (number of cosets to be evaluated per base),
      recorded before any candidate is tested. Step 1 - REGRESSION: reproduce the
      committed k = 3 optimum of 20 on the committed pool and support. Stop
      condition on failure. Step 2 - for each base curve, compute
      rank E^(d)(Q) as a certified lower bound for every square class d in the
      frozen support, recording timeouts as timed_out. Step 3 - enumerate every
      subgroup V of order 8 and of order 16 generated inside the frozen support,
      canonicalised modulo squares, and evaluate the total. Step 4 - report the
      best total per base at k = 3 and k = 4, the full distribution over cosets,
      and the regression of T_3 on rank E(Q) with the old-pool arm included.
      Step 5 - for the single best (E, V) at each k, BUILD the certificate and
      have it checked by an implementation that did not produce it.
    controls:
    - >-
      REGRESSION on the committed k = 3 optimum of 20 (step 1). More is a bug;
      less is a bug.
    - >-
      MATCHED OLD-POOL ARM. The rank-3/4 curves are run through the identical
      pipeline in the same session. Without this arm the base effect is
      confounded with every pipeline change since the committed measurement.
    - >-
      NULL CLASS. A square class d that is a perfect square (trivial twist) must
      return the base curve itself and contribute rank E(Q), not a second
      independent copy of it. A pipeline that counts the trivial class twice
      inflates every total by rank E(Q), which at base 13 is most of the gap to
      31 - so this control is not ceremonial.
    - >-
      COSET DEGENERACY. A candidate V whose generators are multiplicatively
      dependent modulo squares has |V| < 8 and must be rejected, not scored as a
      degree-8 configuration. The count of rejected degenerate candidates is a
      required metric.
    - >-
      CENSORING AUDIT. Report the timeout rate per base curve and the Spearman
      correlation between log of the twist coefficient size and timeout, because
      EV-ECQ-0d142e measured that correlation at +0.765 and high-rank base curves
      have LARGER coefficients, so the new bases are systematically more likely
      to censor. This is the confound most likely to manufacture P1's shortfall.
    required_metrics:
    - best k = 3 and k = 4 total per base curve, with the coset exhibited
    - full distribution of totals over enumerated cosets, per base
    - T_3 per coset, and the fitted slope beta with interval
    - timeout count and rate per base, and the censoring correlation
    - number of degenerate cosets rejected
    - the derived base rank needed for 31 at k = 3, with bootstrap interval
    - certificate kind used for every multiplicity (exact F_l or regulator), per class

  falsification_conditions:
  - >-
    The regression control fails to reproduce 20 on the committed pool and
    support. Everything downstream is unreadable until fixed.
  - >-
    P1 fails upward: a k = 3 total of 31 or more is certified. That is a new
    Pareto point at degree 8 and the prediction was wrong in the direction the
    programme wants; it must then survive the full independent-verifier and
    null-object battery before it is stated anywhere.
  - >-
    P1 fails downward: the best k = 3 total with a rank-13 base is at or below
    the committed 20 from a rank-4 base. Then base rank does NOT transfer into
    the coset sum at all, separability is false in the surprising direction, and
    the entire premise of GOAL-ECRANK-002's resume_action is refuted.
  - >-
    P2 fails: |beta| exceeds 1.0 with the interval excluding 0. Then coset totals
    are coupled to base rank and every extrapolation in H-ECRANK-f2a2f7 must be
    recomputed.
  - >-
    The timeout rate on the new base curves exceeds 80 percent, making every
    total a censored lower bound of unknown depth. That is an INFRASTRUCTURE
    outcome, not a mathematical negative, and it invalidates P1 and P3 rather
    than settling them.

  confounders:
  - >-
    CENSORING BY COEFFICIENT SIZE, the dominant one. The new base curves have
    much larger coefficients than the old pool (the rank-12 curve has a6 of order
    1.4e26 and the Mestre pool reaches a4 of order 1e19 where 31 of 31 upper-bound
    descents timed out), and descent cost tracks coefficient size with a measured
    Spearman of +0.765. So the new bases are systematically more censored, which
    pushes T_3 DOWN and would manufacture P1's predicted shortfall for a purely
    instrumental reason. Mitigations: report timeout rates per arm; report totals
    at two alarm settings differing by at least a factor of 8; and report the
    total computed over COMPLETED descents only, with the denominator, as
    EV-ECQ-0d142e's boundary B-5 requires.
  - >-
    SELECTION OVER COSETS. The best total over many enumerated cosets is an
    order statistic and grows with the number enumerated. The number of cosets
    evaluated per base must be equal across arms and frozen before the run, and
    the headline must be reported beside the coset-population mean and the count.
  - >-
    THE TRIVIAL CLASS. Counting d = 1 twice, or including a class that is a
    square times another class already present, inflates the total. Covered by
    the null-class and degeneracy controls but listed here because it is the
    single most plausible route to a spurious 31.
  - >-
    MULTIPLICITY CERTIFICATE KIND. If some classes use the exact F_l route and
    others fall back on a regulator, the resulting total has mixed strength.
    Reporting one number for the rung hides that. The certificate kind is
    recorded per class and the rung carries the WEAKEST kind used anywhere in it.

  interpretation_limits:
  - >-
    NOTHING HERE IS A CLAIM ABOUT RANK OVER Q. A rank over a degree-8 number
    field is not a rank over Q and may not be presented as if it were; a previous
    campaign's multiquadratic rank result was rejected under the sibling question
    RQ-ECQ-e9b361 for exactly that conflation. Over Q, rank >= 31 is a live
    external claim and is not this program's to restate.
  - >-
    A shortfall at k = 3 is a property of the FROZEN, ENUMERATED search space and
    of the alarm budget. It is never a proof that degree 8 is unreachable, and
    the record must state the enumerated denominator wherever the shortfall
    appears.
  - >-
    The separability slope beta is estimated over the tested base curves and the
    tested coset population only. It is a conditional mean over a sample, not a
    law, and it transfers to no other family.
  - >-
    Every certified total is a LOWER bound twice over - once because only
    exhibited points count, once because censored twists contribute zero.

  heuristic_assumptions:
  - id: HA-1
    statement: >-
      Fix a base curve E/Q and let d range over squarefree integers supported on
      a fixed prime set S, excluding the trivial class. Then the ranks
      rank E^(d)(Q) are modelled as INDEPENDENT draws from a single distribution
      D(E) depending on E only through quantities that do NOT include rank E(Q);
      in particular the conditional expectation of T_k = sum over the 2^k - 1
      non-identity classes of V is (2^k - 1) times the mean of D(E), independent
      of rank E(Q). This is the SEPARABILITY assumption, restated formally and
      numbered, that H-ECRANK-f2a2f7 flags in prose as most likely wrong.
    rigorous_support: >-
      PROVEN BOUND FIXING THE QUANTITY: rank E(K) = sum over d in V of
      rank E^(d)(Q) is an exact identity, not an approximation, so T_k is a
      well-defined integer and the only modelling is of its DISTRIBUTION.
      Further proven, and this is the load-bearing rigorous half: the average
      size of the 2-Selmer group in families of elliptic curves is bounded
      unconditionally by the Bhargava-Shankar results, which caps the average
      rank in the family from above and forbids the mean of D(E) from being
      large. CLASSICAL DISTRIBUTION THEOREM IMITATED: the conjectural
      Goldfeld/Katz-Sarnak picture for quadratic twist families, under which
      ranks are 0 or 1 with density 1/2 each and higher ranks occur with
      polynomially small density, together with the Delaunay/Poonen-Rains models
      for the Selmer and Sha distributions. THE GAP IS DECLARED: the classical
      half here is conjectural where the exemplar's is a theorem, and no
      unconditional distribution theorem for twist ranks is available. That is
      recorded as an obstruction and not papered over.
    validation_plan: >-
      SAMPLE: for each of the 5 base-rank strata (3-4, 11, 12, 13) take at least
      10 base curves and compute certified rank E^(d)(Q) for every squarefree d
      supported on the frozen prime set S with |S| about 8, giving about 255
      twists per base and about 12,750 twist ranks in total. SHORTCUT FOR SCALE:
      use the committed Mestre-Nagao prefilter to order the twists, but compute
      the certified rank on a FROZEN uniform sample as well, so the distribution
      is estimated on an unselected set and the prefilter is used only to find
      the tail. PREDICTED DISTRIBUTION: the empirical rank histogram per stratum
      against a single pooled distribution, compared by a chi-squared test on
      binned ranks and by the fitted slope beta; and the pooled mean against the
      committed anchor, where the 364,756-twist scan of EV-ECRANK-b6c9b6 found NO
      twist of rank >= 5. TAIL CHECKS: the maximum twist rank per stratum, and
      whether any stratum produces a twist of rank >= 5, which the committed
      measurement never did over 364,756 candidates - a single such twist on a
      high-rank base would be a strong signal of coupling. TRANSFER ASSUMPTION
      RECORDED: |d| is bounded by the frozen support and the conclusion does not
      extend to larger d.
  - id: HA-2
    statement: >-
      Let V be generated by k independently chosen classes d_1..d_k. The
      2^k - 1 - k PRODUCT classes d_S = prod_{i in S} d_i, |S| >= 2, are modelled
      as behaving like GENERIC square classes with respect to twist rank, so that
      selecting the generators for high twist rank confers no advantage on the
      products. Consequently the expected coset total is
      rank E(Q) + k * E[rank | selected] + (2^k - 1 - k) * E[rank | generic], and
      selection buys a vanishing fraction of the total as k grows.
    rigorous_support: >-
      PROVEN BOUND: V being a subgroup is forced - the multiquadratic field
      Q(sqrt d : d in V) has degree exactly |V| only when V is a subgroup of
      Q*/(Q*)^2, so the product classes are not free parameters. That is an
      algebraic fact, not a modelling choice, and it is what makes the heuristic
      necessary. The unconditional Bhargava-Shankar cap again bounds the generic
      mean from above. CLASSICAL DISTRIBUTION THEOREM IMITATED: the same twist
      distribution as HA-1, applied to the product classes; the modelling content
      is the INDEPENDENCE of the product classes from the selected generators,
      analogous to assuming that products of selected integers behave like random
      integers of their size with respect to a multiplicative statistic.
    validation_plan: >-
      SAMPLE: from the twist ranks computed for HA-1, form all subgroups V of
      order 8 and 16 inside the frozen support and split each coset's classes
      into GENERATORS (the k chosen for high rank) and PRODUCTS. Compare the mean
      rank of the product classes against the mean rank of a size-matched uniform
      sample of classes from the same support. SCALE: about 12,750 twist ranks
      already computed; the comparison is free. PREDICTED DISTRIBUTION: equality
      of the two means, tested by a permutation test over cosets with at least
      2,000 permutations. TAIL CHECK: the maximum product-class rank against the
      maximum generic-class rank. FALSIFYING OBSERVATION: product-class mean
      exceeding the generic mean by more than 0.3 rank units would mean selection
      DOES propagate through products, which would raise every coset total and is
      the single cheapest route to degree 8 that this design could discover.

  heuristic_assumptions_note: >-
    Both heuristics govern PREDICTIONS and EXTRAPOLATIONS only. No certified rank
    depends on either: a certified coset total is a sum of unconditional
    exhibited-point lower bounds, and it stands whatever the distributions turn
    out to be. What the heuristics carry is P1's interval, P3's extrapolated base
    rank, and the interpretation of any shortfall - which is exactly where
    GOAL-ECRANK-002's C2 lives, so the conditionality must be rendered wherever
    C2's number is quoted.

  target_complexity:
    time_exponent: >-
      Certification is negligible; the cost is entirely twist-rank determination.
      Per twist, PARI ellrank is empirically superpolynomial in the coefficient
      bit-size and is run under a fixed alarm, so the honest cost model is
      (number of twists) x (alarm), with a measured completion fraction. Budget
      arithmetic: 5 strata x 10 bases x 255 twists = 12,750 descents at an alarm
      of 30 s bounds the arm at 106 CPU-hours worst case, and the committed
      measurement's mean completed descent of 7.5 s puts the expected cost near
      30 CPU-hours. Coset enumeration is combinatorial and free by comparison:
      the number of order-8 subgroups of an F_2-space of dimension |S| is
      Theta(2^{3(|S|-3)}) up to constants, so |S| must be frozen small - at
      |S| = 8 that is about 1,395 subgroups of order 8 and 200 of order 16, both
      trivial to enumerate. BEST KNOWN for the same job: none faster in this
      repository; the committed run of the same optimisation over a 502-curve
      pool is the only baseline and no cost was recorded for it separately.
    memory_exponent: >-
      O(number of twists x rank) integers for the rank table, kilobytes; O(1) per
      descent beyond PARI's own working set. Memory is not binding. Stated
      explicitly rather than omitted.
    best_known: >-
      The committed k = 3 optimum of 20 and k = 4 optimum of 32
      (EV-ECRANK-b6c9b6), obtained on a 502-curve pool of maximum rank 4. There
      is no external baseline for "rank over a degree-8 multiquadratic field with
      an exhibited-point witness", because over number fields high rank is
      classical and nobody publishes the witness at this degree; the comparison
      that matters is against this program's own committed rungs.
    hidden_overhead: >-
      DISCLOSED, AND IT IS LARGE. The alarm is the whole story: a total computed
      under a 30 s alarm with a 60 percent timeout rate is a censored lower bound
      whose depth is unknown, and un-censoring can only raise it. The o(1) here
      hides an unbounded descent cost that this program has repeatedly measured
      as fatal at large coefficients (31 of 31 upper-bound descents timing out at
      a4 of order 1e19). A second overhead: the enumerated coset denominator is a
      free parameter that inflates the best-of statistic, and it is frozen rather
      than optimised.
    tradeoff_note: >-
      TIME against CENSORING DEPTH is the real tradeoff and it is one-directional:
      more alarm buys more completed descents buys a higher and still-lower-bound
      total. The design therefore runs TWO alarm settings a factor of 8 apart so
      the censoring slope is measured rather than assumed. PARALLELIZATION:
      embarrassing - twists are independent - so wall clock is a scheduling
      question and the CPU-hour figure above is the honest cost.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST EVERY RUNG ON THIS QUESTION'S FRONTIER; `null` is
    not asserted. ROW 1 - EV-ECRANK-b6c9b6 D = 32, R = 32, float-free: dominates
    the predicted k = 3 outcome on RANK (32 > 30) but is beaten on DEGREE (32 vs
    8), so neither dominates the other and this is a genuine new Pareto cell if
    P1 lands in [26,30]. ROW 2 - same, D = 64, R = 64: dominates on rank,
    dominated on degree. ROW 3 - same, D = 16, R = 32 regulator-assisted:
    dominates on rank, dominated on degree; a k = 4 result of 38-41 would
    STRICTLY dominate this row (same degree, higher rank) and that, not the
    degree-8 rung, is this proposal's most likely concrete gain. ROW 4 - same,
    D = 32, R = 52: dominates on rank. ROW 5 - same, D = 64, R = 68: dominates on
    rank. ROW 6 - same, D = 2, R = 31 relative to an external rank-30 input:
    DOMINATES the predicted k = 3 outcome outright on both axes (higher rank,
    far smaller degree) and is the row this proposal must be compared against
    honestly; its weakness is that its 31 is relative to an external result and
    its 30x30 independence step is a floating regulator. ROW 7 - EV-ECQ-0d142e,
    D = 1, R = 12 exact over Q: dominates on degree, dominated on rank. ROW 8 -
    RUN-ECQ-f5af06-v2-A-certify, D = 1, R = 31 float-free confirmation of an
    external curve: dominates on degree AND is float-free; on rank it ties the
    target. ROW 9 - the external world record rank >= 31 over Q: dominates
    everything on degree. HONEST SUMMARY: under P1 this proposal is DOMINATED by
    rows 6, 8 and 9 on the (rank, degree) plane and produces a new cell only
    against rows 1-5. Its non-dominated deliverable is not a rung at all - it is
    the separability slope beta and the C2 number, which no row on the frontier
    contains.
  sota_delta: >-
    QUANTITATIVELY. (i) Degree-8 rung: committed value 20; predicted 26-30; the
    delta is +6 to +10 certified rank at fixed degree 8, and the target 31 is
    predicted MISSED by about 2. (ii) Degree-16 rung: committed 32; predicted at
    least 38; delta +6 or more at fixed degree, and this one would strictly
    dominate a committed row. (iii) Base rank input: the pipeline's best base
    moves from 4 (committed, 2 curves in 49,692) to 13 (committed, 2 curves in
    34,740), a factor of about 3.25 on the d = 1 term. (iv) The separability
    slope beta: currently UNMEASURED anywhere in this repository, so the entire
    degree-lowering calculus rests on an assumption its own hypothesis record
    marks as most likely wrong; after this work it is a number with an interval.
    (v) GOAL-ECRANK-002 completion criterion C2 currently has status OPEN with no
    number; this produces the number it names. NO CLAIM OF ANY KIND ABOUT RANK
    OVER Q, where the delta is exactly zero.

  estimated_cost:
    compute: >-
      About 30 CPU-hours expected, 106 CPU-hours worst case, dominated by roughly
      12,750 two-descents under a 30 s alarm, plus a second arm at a 240 s alarm
      on a 10 percent subsample for the censoring slope (a further 20 CPU-hours
      worst case). Certification and coset enumeration are minutes. Memory under
      2 GB.
    wall_clock_seconds_estimate: 216000
    human_or_agent_effort: >-
      One Executor task for the frozen twist-rank table and the coset
      optimisation; one Validator task for the regression control, the matched
      old-pool arm, and independent re-certification of the single best coset at
      each k. Substantially cheaper if IDEA-20260829-d53906 has already delivered
      the exact multiplicity certifier, because the per-class certificate step
      then needs no regulator code at all.
    inputs_required: >-
      Committed: EV-ECQ-0d142e's certified_curves.json and the carried-forward
      highrank_pool.json for the base curves; EV-ECRANK-b6c9b6's committed pool
      and support for the regression control. New: none. Network: none.
    risk_of_zero_information: >-
      Low but not negligible. The one branch that produces nothing is a timeout
      rate above 80 percent on the new bases, under which every total is a
      censored lower bound of unknown depth - and that is an infrastructure
      outcome, reported as such, never as mathematical evidence. It is also
      partly foreseeable: the censoring correlation is already measured at +0.765
      against log coefficient size and the new bases have much larger
      coefficients, which is why the two-alarm design is not optional.

  recommended_priority: high
