idea:
  id: IDEA-20260829-173a32
  question_id: RQ-ECRANK-27dcc5
  goal_id: GOAL-ECRANK-002
  goal_id_note: >-
    Named because GOAL-ECRANK-002's own resume_action states the precondition
    this proposal argues is now satisfied. Naming it is not a dispatch and does
    not unpause it; only a Coordinator decision does.
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator

  title: >-
    The degree-8 rung, with the base curves that did not exist when the question
    was asked: separability of the coset sum from the base rank, measured rather
    than assumed

  class: measurement

  claim: >-
    GOAL-ECRANK-002 was paused with its resume_action written out in advance -
    "if the over-Q work produces base curves of rank >= 8 over Q, feed them into
    the k=3/k=4 optimisation this goal already specified and answer the degree-8
    question with them." AT THE TIME THAT WAS WRITTEN THE PRECONDITION WAS FALSE.
    The pipeline of EV-ECRANK-b6c9b6 ran on a 502-curve pool that topped out at
    rank 4 over Q, its 364,756-twist Mestre-Nagao scan produced NO twist of
    rank >= 5, and its 49,692-curve small-coefficient enumeration produced
    exactly 2 curves of rank 4. THE PRECONDITION IS NOW TRUE, from a different
    goal: EV-ECQ-0d142e certifies rank EXACTLY 12 over Q for an explicit curve,
    twice independently re-derived, and its carried-forward Mestre-style pool
    holds 2 curves at certified rank 13, 29 at rank 12 and 425 at rank 11 over
    34,740 scanned, with both rank-13 curves and all 29 rank-12 curves
    exhaustively re-certified by a validator.
    THE CLAIM. Run the k = 3 and k = 4 coset optimisation of H-ECRANK-f2a2f7 on
    these base curves, and the quantity that decides the degree-8 question is not
    the base rank at all but the SEPARABILITY of the non-maximal-class
    contribution from it - the assumption H-ECRANK-f2a2f7 itself flags as "THE
    ASSUMPTION MOST LIKELY TO BE WRONG". Under separability, replacing a rank-4
    base by a rank-13 base moves the k = 3 total from the committed 20 to about
    29 - short of 31 by about 2 - and moves the k = 4 total from the committed 32
    to about 41. The prediction is therefore that DEGREE 8 STILL FAILS, by a
    small and now MEASURED margin, and that the failure converts "degree 8 is out
    of reach" from a search report into the number GOAL-ECRANK-002's completion
    criterion C2 explicitly demands.

  mechanism: >-
    For K the multiquadratic field attached to a subgroup V <= Q*/(Q*)^2 of order
    2^k, rank E(K) = sum over d in V of rank E^(d)(Q) - an exact decomposition,
    with the d = 1 term being rank E(Q) itself. Points from distinct classes are
    Z-independent by the character argument (they lie in distinct isotypic
    components of the Q[Gal(K/Q)]-module E(K) tensor Q), so no metric input is
    needed ACROSS classes; only within a class does multiplicity require a
    separate independence certificate.
    Write T_k(E, V) = sum over d in V, d != 1, of rank E^(d)(Q) for the
    non-base contribution. The whole degree-lowering question is whether T_k
    depends on rank E(Q). Two mechanisms pull in opposite directions and the
    experiment separates them:
    (A) INDEPENDENCE. A quadratic twist E^(d) for d in a generic square class has
    its own Mordell-Weil group with no structural link to E(Q); the twist ranks
    are governed by the twist family's Selmer distribution and should be
    insensitive to rank E(Q). Then T_3 is about 16 for ANY base, as measured on
    rank-3/4 pool curves, and total = rank E(Q) + T_3 = 13 + 16 = 29 at k = 3.
    (B) COUPLING. High rank E(Q) is bought with a small conductor-to-height ratio
    or with a special fibration, and either could correlate with the local data
    that drives twist ranks - the root number of E^(d) is a product of local
    terms of E and of characters of d, so the parity structure of the whole coset
    is inherited from E. Then T_3 shifts with the base and the estimate is wrong
    in a direction the experiment reports.
    The tracked object is the COSET RANK VECTOR - the map from a subgroup
    V <= Q*/(Q*)^2 of order 2^k to the integer vector (rank E^(d)(Q))_{d in V},
    read as a function of the base curve E. It is not a curve, not a point set
    and not a field: it is a 2^k-tuple of integers attached to a pair (E, V).

  lossy_projection_test: >-
    The projection is (E, V) -> (rank E^(d)(Q))_{d in V}, discarding every point,
    every coordinate, every height and the entire arithmetic of each twist,
    keeping only 2^k integers. Massively lossy - all curves with the same rank
    vector collapse together. It is discarded COMPATIBLY with the operation the
    target performs, because the target operation is base change to K and the
    exact decomposition theorem says base change acts on this projection by a
    SUM: rank E(K) = sum of the components. So the retained part propagates
    deterministically through exactly the operation being studied, and nothing
    discarded is needed to compute the answer. This is not a change of
    coordinates: the point sets, which the certificate ultimately exhibits, are
    irrecoverable from the vector. PASSES.

  novelty_status: unverified

  novelty_note: >-
    Corpus and ledger grepped this session. THIS IS NOT A NEW QUESTION AND THE
    RECORD SAYS SO: H-ECRANK-f2a2f7 already states the degree-8 hypothesis, names
    separability as its weakest assumption, and pre-registers the k = 4
    nearby-object control; GOAL-ECRANK-002 already names the resume condition.
    What is new here is (i) that the precondition is now satisfiable from
    EV-ECQ-0d142e and the carried-forward Mestre pool, which post-date the pause,
    (ii) a numeric prediction for the k = 3 total (about 29) with a stated
    shortfall (about 2) rather than an open question, and (iii) the separability
    measurement designed as the primary deliverable rather than as a side effect
    of a record attempt. The honest classification is `adaptation` of a committed
    hypothesis to newly available inputs. Filed `unverified` because the external
    literature on quadratic-twist rank distributions was not fetched this session
    and no novelty may be claimed from memory.

