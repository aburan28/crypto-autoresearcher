idea:
  id: IDEA-20260826-d61c49
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  added: '2026-08-26'
  title: >-
    SMALL |D_0| GIVES A SMALLER HORIZONTAL CRATER, NOT A LARGER ONE: track the
    curve identity (the Cl(O)-orbit position of j) under the CM class-group
    action as a genuinely lossy projection of the transported ECDLP state, and
    measure whether the number of distinct same-order re-randomised x-coordinate
    views a target admits SHRINKS with |D_0| via h(D_0) -- so that special j is,
    if anything, WORSE for any meet-in-the-middle / claw decomposition that
    harvests transported views, at matched p and matched N.
  class: mechanism

  claim: >-
    (A) THE PROJECTION. Transport theorem T1 carries an ECDLP instance
    (E, P, Q, k) along any F_p-isogeny of degree coprime to N with the SAME k.
    The tracked object is the CURVE IDENTITY -- the vertex j reached, equivalently
    the ideal class [a] in Cl(O) acting horizontally -- with the point and the
    hidden scalar k DISCARDED. This is genuinely lossy: k is invariant under
    transport, so retaining "which curve" while discarding "which point / which
    k" loses the entire secret and still propagates deterministically, because
    the class-group action [a]*E is a well-defined function of [a] and E alone.
    (B) THE MEASURED QUANTITY AND ITS RIVAL EXPLANATIONS. A
    meet-in-the-middle / claw attack that exploits an isogeny class does so by
    collecting DISTINCT x-coordinate views of the same k on classmates (cf.
    IDEA-20260807-326442). The horizontal (same-endomorphism-order) sub-supply of
    such views on the crater is exactly h(D_0) = |Cl(O)|, the class number of the
    CM order. Two rival explanations are separated at matched p and matched N:
    (H-worse) small |D_0| makes h(D_0) SMALL (by the Brauer-Siegel / Dirichlet
    class-number-formula scaling h(D_0) ~ sqrt(|D_0|) up to an L(1,chi) factor),
    so the special-j crater supplies FEWER horizontal views than a matched
    generic-|D_0| crater, and any view-harvesting MITM is strictly worse on
    special j; versus (H-neutral) the horizontal view count is irrelevant because
    the full F_p-isogeny class supply H(D) (Kronecker class number, conductor
    tower included) dominates and is |D_0|-insensitive, so special j is neither
    better nor worse. (C) NOT CLAIMED. No exponent move; the class supplies at
    most H(D) ~ p^{1/2} views and the van Oorschot-Wiener memory tradeoff already
    ties them to the sqrt(N) frontier (IDEA-20260807-326442). No attack. Under P3
    nothing is proposed as EXCEEDING the baseline; the only directional claim
    entertained is that special j is WORSE or NEUTRAL, which cannot trip P3, and
    that asymmetry is the honest content.

  mechanism: >-
    The horizontal isogeny graph on curves with endomorphism ring exactly O_{D_0}
    is a Cayley graph of Cl(O) with the small split primes as generators, and a
    non-backtracking walk on it re-randomises the curve while transporting k
    unchanged (the target-profile A5 re-randomisation shape). Its mixing time is
    O(log h(D_0)) under the expander/Ramanujan-type spectral gap for the CM
    action, but its DIAMETER and its total vertex count are bounded by h(D_0):
    you cannot reach more than h(D_0) horizontal curves however long you walk.
    For small |D_0| the Dirichlet class number formula
    h(D_0) = (w sqrt(|D_0|) / (2 pi)) L(1, chi_{D_0}) is small -- literally 1 for
    the nine class-number-one discriminants including D_0 = -3 (j=0) and D_0 = -4
    (j=1728) -- so the horizontal crater of the MOST special j-invariants is a
    SINGLE vertex (cf. IDEA-20260807-94f953). The vertical (conductor) direction
    adds views but is not a same-order re-randomisation and pays a
    2-power/ell-power isogeny cost per level. The object thus measures a concrete
    reversal of the folklore "special structure gives extra room to move": the
    special-est j-invariants give the LEAST horizontal room, and the deliverable
    is the measured view-count-vs-|D_0| curve against a matched generic-|D_0|
    null at the same p and N.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Read IDEA-20260807-326442 (h ~ p^{1/2} views, the tradeoff that kills it),
      IDEA-20260807-406fef (transport ties the multi-target baseline),
      IDEA-20260807-94f953 (small |D_0| crater = h(D_0) vertices), and
      H-JINV-5a0b9e. grep ledger/proposals for "class group", "Cl(O)",
      "mixing time", "meet-in-the-middle", "views". External CM class-group /
      expander sources NOT opened; recalled.
    results: >-
      IDEA-20260807-326442 counts views in a GENERIC class and prices the memory
      tradeoff; IDEA-20260807-94f953 notes the small-|D_0| crater is a single
      curve but frames it as abolishing the T5 reachability search, not as a
      view-supply deficit for MITM. No JINV-bound proposal tracks the
      Cl(O)-orbit curve identity as the projected object, measures the horizontal
      re-randomisation view count as a function of |D_0|, or states the WORSE-not-
      better asymmetry with a matched generic-|D_0| null.
    verdict: >-
      UNVERIFIED. Distinct tracked object (Cl(O)-orbit curve identity), distinct
      measured functional (h(D_0)-limited same-order view count), distinct
      directional claim (special j is worse/neutral). No novelty claimed against
      the external CM/expander literature, which Stage 0 must locate.

  citations:
    - ref: null
      provenance: recalled
      claim: >-
        Horizontal CM isogeny graphs are Cayley graphs of Cl(O) with rapid mixing
        (Jao-Miller-Venkatesan expansion under GRH); h(D_0) ~ sqrt(|D_0|)
        L(1,chi) by the Dirichlet class number formula and Brauer-Siegel.
      verified_by: null
    - ref: IDEA-20260807-326442
      provenance: recalled
      claim: an isogeny class supplies ~p^{1/2} x-coordinate views bound by a VW memory tradeoff
      verified_by: null
    - ref: IDEA-20260807-406fef
      provenance: recalled
      claim: transport ties but cannot beat the multi-target baseline
      verified_by: null

  nearest_existing_record: IDEA-20260807-326442 (h~p^{1/2} views and the tradeoff that kills it)
  delta_from_nearest: >-
    OBJECT: the pooled view supply of a generic class -> the Cl(O)-orbit curve
    identity as a tracked lossy projection. OBSERVABLE: total view count and its
    memory tradeoff -> the SAME-ORDER horizontal view count h(D_0) as a function
    of |D_0|. QUANTIFIER: "a class supplies ~p^{1/2} views, tradeoff kills it"
    (|D_0|-agnostic) -> "the horizontal sub-supply shrinks with |D_0| via
    h(D_0), so special j is worse for view-harvesting at matched p and N". The
    prior record never separates the horizontal (same-order) supply from the
    conductor tower and never makes the |D_0| dependence its object.

  assumptions:
    - N prime, gcd(isogeny degree, N)=1, so T1 transport carries k unchanged.
    - Toy scale; horizontal crater and its Cl(O) action fully enumerable at p up to ~32 bits.
    - >-
      "View" is a same-order horizontal classmate reached by the Cl(O) action;
      vertical (conductor) classmates are counted separately and their per-level
      isogeny cost is charged, not free.

  proof_search_map:
    bottleneck: >-
      Whether the same-order re-randomisation supply that a view-harvesting MITM
      can use scales UP or DOWN with |D_0|. It is the single quantity deciding
      whether special j helps, hurts, or is neutral for this decomposition.
    baseline_embedding:
      parameter_slice: >-
        A matched generic-|D_0| crater in a class of the SAME p and SAME N as the
        special-j crater: its horizontal view count must equal its own enumerated
        h(D_0), reproducing the class-number formula.
      reproduction_check: >-
        Frozen fixture: on committed toy classes, the enumerated horizontal
        crater size equals h(D_0) computed from the Dirichlet formula (Deuring
        weighting honoured for D_0 in {-3,-4}) before any cross-|D_0| comparison.
    observation_collision:
      observable: the horizontal same-order view count reachable by the Cl(O) action.
      distinct_preimage_search: >-
        A collision to separate: a single-vertex horizontal crater (h=1, e.g.
        D_0=-3) and a target with NO usable isogeny both present "one view", but
        for opposite reasons; the separating datum is whether h(D_0) > 1 exists at
        all, which the class-number computation settles deterministically.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The matched-order family (fix N, vary t so D_0 sweeps) restricted to a
          |D_0| ladder, giving a crossed design in which the horizontal view
          count is read against |D_0| at identical N.
        predicted_gain: >-
          Isolates the |D_0| dependence of the view supply from p and N, which a
          single class cannot.
    quantifier_order: >-
      FOR EACH toy N, FOR ALL classes in the matched-order family, the horizontal
      same-order view count is a monotone increasing function of h(D_0) and hence
      (up to L(1,chi)) of sqrt(|D_0|); THERE DOES NOT EXIST a small-|D_0| class
      whose horizontal supply exceeds a matched larger-|D_0| class.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy N, the enumerated same-order horizontal view count tracks h(D_0)
        and is smaller for smaller |D_0|. It cannot certify anything about the
        FULL class supply H(D), about the VW memory frontier, about any exponent,
        or about crypto scale, and it never claims special j beats the baseline.
      nearby_object_control: >-
        Two classes with the SAME D_0 hit by distinct trace pairs (the free
        replication set of the matched-order family): equal h(D_0) must give equal
        horizontal view count; a difference means the count is not a function of
        the CM order and the object is mis-specified.
    proof_obligations:
      - claim: Enumerated horizontal crater size equals h(D_0) with Deuring weighting.
        responsibility: correctness
      - claim: The Cl(O) walk transports k unchanged (T1) at every step used.
        responsibility: correctness
      - claim: Vertical classmates are counted separately with per-level cost charged.
        responsibility: interface
      - claim: No exponent, no VW-frontier, no attack is claimed.
        responsibility: scope

  predictions:
    - metric: horizontal same-order view count vs h(D_0)
      direction: higher
      minimum_effect: >-
        Equal to h(D_0) exactly under enumeration; the special-j (D_0 in {-3,-4})
        crater is a SINGLE vertex. A count exceeding h(D_0) voids the enumeration.
    - metric: horizontal view count as a function of |D_0| across the matched-order family
      direction: lower
      minimum_effect: >-
        Monotone increasing in |D_0| (so DECREASING toward special j). The
        pre-registered claim is that special j is worse/neutral; a count that
        somehow rises as |D_0| shrinks is the one surprising event and triggers P3.
    - metric: trace-pair replication (same D_0, different t) difference in view count
      direction: different
      minimum_effect: Zero; a nonzero difference falsifies the "function of the CM order" premise.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): compute h(D_0) from the Dirichlet formula for the
      matched-order family's discriminants; derive the WORSE-not-better
      prediction. STAGE 1: enumerate the horizontal crater of the special-j
      (D_0=-3) class and of a matched generic-|D_0| class at the same p and N;
      confirm sizes equal h(D_0). STAGE 2: sweep |D_0| across the family and
      regress the enumerated horizontal view count on h(D_0) with the trace-pair
      control. STAGE 3 (optional): a non-backtracking Cl(O) walk with measured
      mixing time to confirm the reachable set is exactly the crater, not larger.
    controls:
      - matched generic-|D_0| crater, same p, same N (blocking)
      - trace-pair replication (same D_0, different t) -> equal count
      - Deuring-weighted vertex enumeration authority (not the class-number formula alone) for D_0 in {-3,-4}
      - vertical classmates counted and cost-charged separately, never pooled with horizontal
    required_metrics:
      - enumerated horizontal crater size per class
      - h(D_0) from the class-number formula per class
      - view-count-vs-|D_0| regression with permutation distribution
      - Cl(O) walk mixing time and reachable-set size (if Stage 3 run)

  falsification_conditions:
    - >-
      F1. Enumerated horizontal crater size disagrees with h(D_0) after Deuring
      weighting. Enumeration defect; returns to executor.
    - >-
      F2 (MAIN RESULT). The horizontal view count is flat in |D_0| (H-neutral):
      then the horizontal supply is not the operative channel and the lane's
      MITM view-supply question is closed for the horizontal direction with the
      named obstruction that the conductor tower, not the CM order, sets the
      supply -- forward guidance: measure the vertical tower cost (EXP-VOLC lane).
    - >-
      F3. Trace-pair replication shows unequal counts at equal D_0. The object is
      mis-specified; withdrawn as such, not refuted.
    - >-
      F4 (P3). A small-|D_0| class shows a LARGER horizontal supply than a matched
      larger-|D_0| class. Work STOPS for independent review before the reversal is
      stated.

  confounders:
    - >-
      Conductor tower leakage: counting vertical classmates as horizontal views
      inflates the small-|D_0| count and would fabricate an advantage. Horizontal
      and vertical supplies are never pooled.
    - Deuring weighting for D_0 in {-3,-4} (j weighted 1/3, 1/2); the enumeration, not the class number, is authority.
    - p is a residual covariate across the family (p = N + t - 1); reported with |D_0|.
    - Toy scale: h(D_0) is tiny for the whole toy family, so the |D_0| trend is measured over a short ladder; drift stated.

  interpretation_limits:
    - claim_tier toy; toy N; no cryptographic-scale statement.
    - >-
      This measures a re-randomisation SUPPLY, not an attack cost. Even the full
      class supply H(D) ~ p^{1/2} is tied to the sqrt(N) frontier by the VW memory
      tradeoff (IDEA-20260807-326442); the horizontal sub-supply is a fraction of
      that and moves no exponent.
    - >-
      The directional content is that special j is WORSE or NEUTRAL for
      view-harvesting; this cannot and does not claim an advantage, so P3 is
      engaged only in the surprising H-worse-is-false branch.
    - >-
      No phi-stable factor base is built; pause P2 (H-STR-002) is not engaged.
      H-ENDO-001 is the admissibility filter, not retested.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the CM order O_{D_0}, the number of same-order horizontal classmates
        of a curve equals h(D_0) = |Cl(O)|, and h(D_0) = (w sqrt(|D_0|)/(2 pi))
        L(1, chi_{D_0}), so the horizontal view supply grows like sqrt(|D_0|) up
        to a slowly varying L-value factor.
      rigorous_support: >-
        The Deuring correspondence (Cl(O) acts simply transitively on the set of
        curves with endomorphism ring O) and the Dirichlet class number formula,
        with Brauer-Siegel controlling L(1,chi); imitating a uniformly random
        ideal class supply of size h(D_0).
      validation_plan: >-
        Enumerate horizontal craters at three toy primes for several D_0; compare
        the enumerated size to h(D_0); tail-check the class-number-one cases
        (single vertex) explicitly. For larger-parameter transfer, sample h(D_0)
        via the class-number formula rather than enumeration and state the
        transfer assumption. Deuring weighting recorded for D_0 in {-3,-4}.
    - id: H2
      statement: >-
        The non-backtracking Cl(O) walk on the horizontal crater mixes in
        O(log h(D_0)) steps and its reachable set is exactly the h(D_0)-vertex
        crater, so no walk length increases the same-order view supply beyond
        h(D_0).
      rigorous_support: >-
        Expander/Ramanujan spectral gap for the Cl(O) Cayley graph under GRH
        (Jao-Miller-Venkatesan), imitating rapid mixing of a random walk on a
        bounded-degree expander of h(D_0) vertices.
      validation_plan: >-
        On toy craters, measure the empirical mixing time and confirm the reachable
        set size saturates at the enumerated crater size; compare to O(log h(D_0)).

  target_complexity:
    time_exponent: >-
      1/2, unchanged. The horizontal supply is at most h(D_0) ~ sqrt(|D_0|), and
      even the full class supply H(D) ~ p^{1/2} is VW-tied to sqrt(N); this object
      moves nothing and, for special j, supplies LESS.
    memory_exponent: >-
      A view-harvesting MITM would trade memory w for time sqrt(N^3/w) (VW,
      IDEA-20260807-326442); the horizontal sub-supply reduces the usable w for
      small |D_0|, worsening the position rather than improving it.
    best_known: >-
      0.886*sqrt(N) parallel rho with DPs, O(1) memory (KN-TECH-001, KN-TECH-006);
      automorphism-discounted CM variant 1.2533*sqrt(N/|Aut|) (KN-TECH-018).
    hidden_overhead: >-
      No o(1) claimed. Disclosed: the per-step horizontal isogeny cost and the
      vertical-tower cost are charged, so "more views" is never free.
    tradeoff_note: >-
      The object clarifies WHERE on the VW time-memory curve special j sits:
      further toward the small-w (worse) end, not the large-w end.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY, DATA against every frontier row. Constructs no
    attack; dominated by parallel rho with DPs (0.886*sqrt(N), O(1) memory), the
    automorphism-discounted CM variant (1.2533*sqrt(N/|Aut|), KN-TECH-018), BSGS
    (sqrt(N) time/memory), kangaroo/Gaudry-Schost, and the VW view-harvesting
    frontier of IDEA-20260807-326442, which it does not beat and, for special j,
    positions below. No data/queries consumed.
  sota_delta: >-
    ZERO speedup on time, memory, data, exponent; none sought. Directional
    measurement delta: quantifies that the horizontal same-order re-randomisation
    supply of special-j curves is h(D_0)-limited (as small as 1 for j=0/j=1728),
    i.e. a WORSE not better MITM position at matched p and N -- a negative-leaning
    result the lane has asserted qualitatively but never measured against a null.

