  proof_search_map:
    bottleneck: >-
      The integer side condition gcd(eta, kappa) = 1. Removing it is
      what would make n = 4 look like n = 6. Polynomial selection,
      sieving, and linear algebra are outside this measurement.
    baseline_embedding:
      parameter_slice: >-
        The opened abstract of KN-LIT-3743: gcd(eta, kappa) = 1, with
        n = 6 and n = 12 named as practical degrees, and the opened
        abstract of KN-LIT-2061: composite prime powers excluded.
      reproduction_check: >-
        The five split counts (0, 0, 2, 0, 2) are the reproduction of
        that side condition on n in {4, 5, 6, 8, 12}. A curve of bit
        levels is not a reproduction.
    observation_collision:
      observable: >-
        The accepted-split count, and separately the checked equality
        s = 12 t.
      distinct_preimage_search: >-
        n = 4 and n = 8 are distinct and are predicted to share the
        count 0. That collision is intended: the gcd bit does not
        separate those two prime powers. n = 6 and n = 12 share the
        count 2 and are likewise not separated by this observable.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The five named n, then one logarithm in F_121.
        predicted_gain: >-
          A table of five integers and one verified equality. No
          asymptotic gain.
    quantifier_order: >-
      For all n in {4, 5, 6, 8, 12}, the accepted count equals the
      number of ordered pairs with both parts at least 2 and gcd 1.
      The pairs depend on n. Separately, there exists a generator g of
      this one field such that the logarithms of this one target satisfy
      s = 12 t. Neither quantifier ranges over deployed primes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The split table under this reading of the abstracts, and one
        independently checked discrete log in F_121. Nothing about a
        pairing-friendly prime.
      nearby_object_control: >-
        n = 5 and n = 8 must score 0. The element 1 must not be used as
        the target, because both of its logarithms are 0.
    proof_obligations:
      - claim: The five split counts match (0, 0, 2, 0, 2).
        responsibility: baseline
      - claim: The checker accepts g^s = 2 and s = 12 t.
        responsibility: correctness
      - claim: No bit level is inferred from either numeral.
        responsibility: scope
    not_applicable_reason: >-
      The map above audits a toy count and one certificate. It is not
      a proof of an exTNFS runtime.
