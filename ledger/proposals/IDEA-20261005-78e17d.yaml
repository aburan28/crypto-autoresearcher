idea:
  id: IDEA-20261005-78e17d
  question_id: RQ-PAIR-f2e31f
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Coprime tower-split counts for n = 4 and n = 6, plus one certified
    discrete log in F_121, with no pairing bit level.
  class: measurement
  claim: >-
    Read an ordered split of n as a pair of integers eta, kappa, each at
    least 2, with eta times kappa equal to n. Accept the split when
    gcd(eta, kappa) = 1. The number of accepted splits is 0 for n = 4,
    0 for n = 5, 2 for n = 6, 0 for n = 8, and 2 for n = 12. Separately,
    in F_121 = F_11[z] / (z^2 + 1), baby-step giant-step returns an
    exponent s with g^s = 2 for a generator g of the multiplicative
    group, an independent checker accepts that power, and the discrete
    log t of 2 in the prime subfield relative to g^12 satisfies
    s = 12 t. No bit level for BLS12-381 or BN254 is stated. No ECDLP
    exponent is in scope.
  mechanism: >-
    The abstract sentence that exTNFS applies when gcd(eta, kappa) = 1,
    and the practical sentence that n = 6 and n = 12 are in range, are
    scored as a count of ordered splits. Two explanations are separated
    first. Side-condition reading: n = 4 = 2 times 2 is rejected and
    n = 6 has the two ordered splits (2, 3) and (3, 2). Uniform-composite
    reading: every composite n is accepted, which would give n = 4 the
    count 1. The prime n = 5 is a null with no split of two integers
    at least 2. The field computation is a certificate that this program
    can complete one discrete log in a quadratic extension, which is the
    calibration shape named by RQ-PAIR-f2e31f, at a field that is not
    GF(p^12) for a deployed prime. A checker that accepts a wrong power
    is a failed certificate, not a logarithm. LOSSY-PROJECTION TEST.
    The object is the integer n. Operation set Sigma is writing n as
    eta times kappa. The projection keeps the gcd bit and discards the
    polynomials an exTNFS selector would still have to choose. Lossy:
    many polynomial pairs can sit over one accepted integer split, so
    the count is not the selector's output.
  novelty_status: unverified
  citations:
    - ref: KN-LIT-3743
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. The abstract
        says exTNFS applies to F_{p^{eta kappa}} whenever gcd(eta, kappa)
        = 1, and that on the practical side it can be used for n = 6 and
        n = 12. It gives neither the ordered-split counts nor a discrete
        log in F_121. The L-notation complexity sentences in that abstract
        are not used as a result of this idea.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-3743.md
    - ref: KN-LIT-2061
      provenance: internal
      claim: >-
        Title-level note only; abstract thin; PDF not opened. The abstract
        says the Kim-Barbulescu method does not work when n is a composite
        prime power. It gives no split count for n = 4 or n = 8.
      verified_by: idea-generator, this session, via knowledge/literature/KN-LIT-2061.md
    - ref: Kim-Barbulescu CRYPTO 2016
      provenance: recalled
      claim: >-
        Recalled pointer, not opened, for the paper whose abstract
        KN-LIT-3743 relays. Not support.
      verified_by: null
    - ref: KR-RHO-46c2c6
      provenance: internal
      claim: >-
        Opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-46c2c6.yaml.
        The row claim is that L discrete logs reused across distinguished
        points cost about the square root of 2Ln in total, rather than
        L times the square root of n. This idea computes one log, so
        that multi-target bound is not used.
      verified_by: idea-generator, this session, via knowledge/frontiers/ecdlp/generic-rho/KR-RHO-46c2c6.yaml
  assumptions:
    - Acceptance is only the integer condition gcd(eta, kappa) = 1 with eta, kappa at least 2. Polynomial quality is not scored.
    - z^2 + 1 is irreducible over F_11, so F_11[z] / (z^2 + 1) has 121 elements. Squares modulo 11 were listed as instance selection; 10 is not among them.
    - The subfield F_11^* is the image of the 12th-power map on F_121^*.
    - No deployed prime and no relation matrix at cryptographic size is built.
  predictions:
    - metric: accepted ordered splits at n = 4
      direction: lower
      minimum_effect: 0
    - metric: accepted ordered splits at n = 6
      direction: higher
      minimum_effect: 2
    - metric: accepted ordered splits at n = 12
      direction: higher
      minimum_effect: 2
    - metric: absolute difference between the checker exponent and 12 times the subfield exponent of 2
      direction: lower
      minimum_effect: 0
  minimal_test:
    design: >-
      Enumerate ordered pairs for n in {4, 5, 6, 8, 12} and count those
      with both parts at least 2 and gcd 1. Then in F_121 search for an
      element g of order 120, run baby-step giant-step for the target 2,
      and have a second routine recompute the power. Compute the discrete
      log of 2 in F_11^* against g^12 and test s = 12 t. Do not emit a
      bit level, a memory charge, or a cost at the BLS12-381 prime.
    controls:
      - n = 5 has no ordered split with both parts at least 2. A positive count there means the enumerator ignored the bound.
      - n = 8 is a composite prime power. The abstract of KN-LIT-2061 says that case is outside the method. A positive gcd-count there contradicts this acceptance rule.
      - The identity element 1 is not the target. Its logarithm is 0 in both groups, so it cannot show the factor 12.
      - A wrong exponent that the checker rejects is an algorithm failure, not a logarithm.
    required_metrics:
      - splits_n4
      - splits_n5
      - splits_n6
      - splits_n8
      - splits_n12
      - certificate_accepts
      - exponent_gap_s_minus_12t
  falsification_conditions:
    - splits_n4 is not 0, or splits_n6 is not 2, or splits_n12 is not 2.
    - splits_n5 or splits_n8 is positive.
    - The checker rejects the returned power, or no element of order 120 is found.
    - The checker accepts and s is not 12 t.
    - A bit level or a deployed-prime cost is emitted. That output is outside this idea.
  confounders:
    - Counting unordered pairs halves the n = 6 and n = 12 predictions. The order convention has to be fixed before the count.
    - Allowing eta = 1 admits (1, n) whenever gcd(1, n) = 1 and inflates every row.
    - A generator of a proper subgroup can produce an s that satisfies g^s = 2 and still fails s = 12 t. The order check is part of the metric, not a side comment.
  interpretation_limits:
    - The split count is the integer side condition in the opened abstracts. It is not a polynomial-selection run and not an exTNFS cost.
    - F_121 is not GF(p^12) at a pairing prime. No transfer to BLS12-381 or BN254 is claimed.
    - Not an attack claim. No ECDLP exponent is in scope. The L-notation sentences in KN-LIT-3743 are not a result of this measurement. The multi-target bound in KR-RHO-46c2c6 is not a result of this measurement.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        The acceptance predicate in the KN-LIT-3743 abstract is exactly
        gcd(eta, kappa) = 1 on ordered pairs with both parts at least 2.
        This imitates a characteristic function of coprime factorizations,
        the way the abstract itself separates n = 6 and n = 12 from the
        cases KN-LIT-2061 calls composite prime powers. The census is
        every ordered pair for five named n. No density statement for
        large n is claimed.
      rigorous_support: >-
        The gcd of two positive integers is computable by the Euclidean
        algorithm, which is the bound being checked. The abstracts name
        the predicate and the prime-power exclusion. They do not list the
        five counts. Those counts are the prediction, not a quoted theorem.
      validation_plan: >-
        List every ordered pair for n in {4, 5, 6, 8, 12}, apply the gcd
        rule, and compare with (0, 0, 2, 0, 2). One mismatched row
        falsifies HA-1 under this reading of the abstracts. If a later
        PDF read shows a further polynomial condition, record a second
        column; do not overwrite this one.
    - id: HA-2
      statement: >-
        For one generator g of F_121^* and the target 2, the discrete log
        s in the big group and the discrete log t in F_11^* against g^12
        satisfy s = 12 t. This imitates the subgroup relation
        F_q^* = (F_{q^2}^*)^{q+1} at q = 11, where q + 1 = 12. One target
        is checked. No smoothness distribution and no transfer to degree
        12 are claimed.
      rigorous_support: >-
        F_121^* is cyclic of order 120, and the unique subgroup of order
        10 is the image of the 12th-power map. That is the standard
        structure of a finite multiplicative group. The abstracts opened
        here do not discuss F_121. The equality s = 12 t is unchecked
        until the certificate runs.
      validation_plan: >-
        Find g by testing the order, run baby-step giant-step, recompute
        the power in a second routine, solve the subfield log, and test
        s - 12 t = 0. A rejected power or a nonzero gap falsifies HA-2
        at this field. No second extension degree.
  target_complexity:
    time_exponent: >-
      The split census is linear in the number of ordered factorizations
      of the named n, at most a handful. The logarithm is baby-step
      giant-step on a group of order 120, on the order of sqrt(120)
      group operations. No sub-rho claim. No exTNFS exponent is claimed.
      The multi-target expression sqrt(2Ln) from KR-RHO-46c2c6 is not
      claimed; L here is 1 and that bound is not the metric.
    memory_exponent: >-
      A table of size about sqrt(120) field elements, plus the five
      split counts.
    best_known: >-
      No ECDLP exponent is in scope. Opened baselines KN-LIT-3743 and
      KN-LIT-2061 state L-notation sentences at title level. Those
      sentences are not a baseline this idea improves. KR-RHO-46c2c6
      states a multi-target cost; this idea does not improve it.
    hidden_overhead: >-
      Generator search costs a constant number of exponentiations in
      F_121. No o(1) term from an asymptotic sieve is present because
      no sieve is run.
    tradeoff_note: >-
      Baby-step giant-step stores about sqrt(120) elements. No
      van Oorschot-Wiener tuning is relevant at this order.
