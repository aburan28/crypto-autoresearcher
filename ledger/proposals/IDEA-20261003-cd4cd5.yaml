# IDEA-20261003-cd4cd5
# Minimal-polynomial degree count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-cd4cd5
  question_id: RQ-JINV-8fc13a
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A Frobenius minimal polynomial has degree 2 and an integer multiplication has degree 1
  class: measurement
  claim: >-
    A Frobenius minimal polynomial has degree 2. Multiplication by
    an integer has minimal-polynomial degree 1. Two exceeds one by
    1. The product of the two degrees is 2. Their sum is 3. The
    gap is a polynomial degree, not an ECDLP exponent and not a
    map degree.
  mechanism: >-
    OBJECT FRAME. R3 is the endomorphism. The operation set is the
    polynomial ring that records the relation it satisfies. Frobenius
    satisfies a quadratic relation. An integer multiplication satisfies
    a linear relation. Two integer multiplications both have degree
    1, so that gap is 0. No point is multiplied.
  novelty_status: unverified
  citations:
    - ref: RQ-JINV-8fc13a
      provenance: internal
      claim: >-
        The question treats End(E) as a ring and asks for any
        advantage beyond the automorphism discount.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        The automorphism square-root factor is a different object
        from these two polynomial degrees.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two degrees are frozen before the subtraction.
    - No point is multiplied.
  proof_search_map:
    bottleneck: The degree gap 1.
    baseline_embedding:
      parameter_slice: The degrees 2 and 1.
      reproduction_check: >-
        Two readers subtract and must agree that 2 exceeds 1 by 1.
    observation_collision:
      observable: The degree gap and the product.
      distinct_preimage_search: >-
        Reporting both degrees as 1 drops the gap. Two integer
        multiplications make that gap 0.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The degrees 2 and 1.
        predicted_gain: Integer gap. No multiplication of a point.
    quantifier_order: >-
      The degrees are fixed before the gap.
