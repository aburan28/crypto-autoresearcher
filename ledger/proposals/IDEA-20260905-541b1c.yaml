idea:
  id: IDEA-20260905-541b1c
  title: Integral norm projectors for witness descent across field rungs
  class: composition
  claim: Integral Galois norm maps can turn rational invariant subspaces of a supplied Mordell-Weil module into
    explicit points over smaller fields; on a full invariant lattice the quotient by the norm image is annihilated
    by the subgroup order, giving index at most |H|^r in invariant rank r. This separates a rational projector from
    an exhibited point.
  mechanism: For a finite Galois extension K/F with subgroup H fixing F, the rational projector onto invariants
    is (1/|H|) sum_h h. Division by |H| need not yield a known point. Use the integral norm N_H(P)=sum_h h(P) instead.
    It is fixed by H and gives an exhibited F-point when coordinates and action are verified. On the invariant rational
    subspace N_H acts as multiplication by |H|, so it preserves its dimension while possibly enlarging coordinate
    heights and leaving a finite-index gap. Compose norms down a field tower and track exact transition matrices,
    torsion effects and independently certified terminal-point rank.
