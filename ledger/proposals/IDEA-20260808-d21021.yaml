    WAS UNAVAILABLE, so external novelty is NOT screened and the status is unverified rather
    than screened.'
  discriminated_from: IDEA-20260805-15258a (key-side additive energy; this is ciphertext-side
    and attacker-selectable, and adds the alpha(beta) cost curve and the average-vs-maximum
