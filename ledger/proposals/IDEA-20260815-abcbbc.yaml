idea:
  id: IDEA-20260815-abcbbc
  question_id: RQ-CRYPTO-001
  added: '2026-08-15'
  title: >-
    THE ECC PORTFOLIO HAS 26 GOALS AND NO RECORD SAYS WHICH ONES ARE STILL
    WORTH RUNNING: build a portfolio-level status matrix binding each goal
    to its blocking obligation and its nearest decision
  class: audit

  claim: >-
    This program's ECC surface spans dozens of goals in states from draft to
    completed, several blocked on each other and several deferred with no
    recorded revisit condition. Nobody can currently answer which goals are
    live, what each is waiting on, and which have a decision within reach. A
    status matrix built from committed records answers that mechanically.

  mechanism: >-
    For each ECC goal, extract status, blocking obligation, nearest
    reachable decision, and any recorded revisit condition. Flag goals
    deferred or paused with no revisit condition, which AGENTS.md rule 9
    requires.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of all ECC goal records and their next actions; grep 'revisit
      condition', 'deprioritization', 'successor'.
    results: >-
      Goal records carry status and next actions individually; no record
      assembles them into a portfolio view or checks the revisit-condition
      requirement.
    verdict: >-
      ADAPTATION. Portfolio status reporting is administrative; the
      contribution is checking each deferral against the rule that
      requires a revisit condition.

  object_first_candidate:
    tracked_object: >-
      EACH ECC GOAL'S STATE, blocking obligation and revisit condition, in
      one matrix.
    lossiness: >-
      Reducing a goal to four fields discards its content, which is
      appropriate for a portfolio view whose purpose is triage rather than
      science.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while goal records are parseable and their next actions are
      extractable; goals whose next action is prose without a decision are
      the matrix's key entries.

  null_object_control: >-
    NULL 1 -- a completed goal, which must show no blocking obligation; if
    it shows one, the extraction is wrong. NULL 2 -- an active goal with a
    clear next action, which must extract cleanly and calibrates the
    extraction against a known-good case.

  discriminated_from:
    - >-
        The reachability audit in this series, which determines which
        conclusions are reachable within the tier path; this covers the
        whole ECC surface at goal level rather than one ladder.
    - >-
        The deferred-lane costing record, which prices unblocking; this
        identifies what is blocked in the first place.

  assumptions:
    - >-
        Goal records are parseable and their statuses are current, which
        the earlier survey in this session confirmed for most but not all.
    - >-
        Blocking obligations are extractable from next actions, which are
        prose and vary enormously in precision.

  predictions:
    - metric: >-
        completed-goal null
      direction: different
      minimum_effect: >-
        FORCED no blocking obligation.
    - metric: >-
        active-goal-with-clear-action null
      direction: different
      minimum_effect: >-
        FORCED clean extraction.
    - metric: >-
        count of deferred goals with no recorded revisit condition
      direction: different
      minimum_effect: >-
        The deliverable; AGENTS.md rule 9 requires one, so each is a
        contract gap.
    - metric: >-
        goals whose next action contains no reachable decision
      direction: different
      minimum_effect: >-
        Reported separately; a next action that names no decision cannot
        advance the goal.

  minimal_test:
    design: >-
      All ECC goals, both nulls, extraction from committed records only.
    controls:
      - >-
          Completed-goal and active-goal nulls.
      - >-
          Extraction from committed records only, never from session
          memory.
      - >-
          Goals whose next action is prose without a decision reported
          as a distinct category.
      - >-
          Parse failures reported rather than skipped.
    required_metrics:
      - >-
          Per-goal status, blocking obligation, nearest decision and
          revisit condition.
      - >-
          Count of deferrals lacking a revisit condition.
      - >-
          Count of goals with no reachable decision in their next
          action.
      - >-
          List of unparseable goal records.

  falsification_conditions:
    - >-
        A null misbehaves. Extraction wrong.
    - >-
        Several deferrals lack revisit conditions. Those are contract gaps
        under AGENTS.md rule 9 and each needs one recorded, which is
        directly actionable.
    - >-
        Many goals have no reachable decision in their next action. The
        portfolio is broader than it is advanceable, which is the finding
        a campaign at this scale most needs.
    - >-
        Goal records do not parse. The portfolio cannot be surveyed
        mechanically, which is a process finding.

  confounders:
    - >-
        PROSE NEXT ACTIONS: goal next actions are long prose and
        extracting a blocking obligation from them requires judgement that
        must be recorded rather than applied silently.
    - >-
        STATUS STALENESS: a goal's recorded status may lag its actual
        state, so the matrix describes the ledger rather than the
        campaign.

  interpretation_limits:
    - >-
        An administrative view; makes no scientific claim and prioritises
        nothing.
    - >-
        Describes committed records, which may lag the campaign's actual
        state.
    - >-
        A missing revisit condition is a contract gap to be filled, not
        evidence the goal was wrongly deferred.

  heuristic_assumptions:
    - id: HEUR-PORT-1
      statement: >-
        A goal's committed record accurately reflects its current state
        and blocking obligation.
      rigorous_support: >-
        Rigorous ingredient: goal records are the campaign's declared
        state and are updated by Coordinator decision, so they are the
        authoritative source by construction. THE GAP: updates happen at
        batch boundaries, so a goal worked on between boundaries has a
        stale record, and the matrix would describe the last checkpoint
        rather than the present.
      falsification_condition: >-
        A goal whose recorded state contradicts its most recent
        committed decision.
      validation_plan: >-
        SAMPLE: all ECC goals, with each status cross-checked against
        the most recent decision citing that goal. TAIL CHECK: goals
        whose most recent decision postdates their status update.
        TRANSFER: none; the matrix is a snapshot and carries its date.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is parsing and extraction across goal
      records.
    memory_exponent: >-
      Negligible.
    best_known: >-
      No incumbent portfolio view exists; individual goal records carry
      their own state without assembly.
    hidden_overhead: >-
      Prose next actions require judgement to reduce to a blocking
      obligation, which is where the extraction is weakest.
    tradeoff_note: >-
      A mechanical matrix is cheap and shallow; it triages rather than
      prioritises, and the Coordinator's judgement supplies the rest.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As science: nothing is claimed. As a
    portfolio view of the ECC surface: none exists here. Not null on any
    axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a status matrix over the ECC
    goal surface binding each goal to its blocking obligation and nearest
    reachable decision, with explicit counts of deferrals lacking the
    revisit condition AGENTS.md rule 9 requires and of goals whose next
    action names no reachable decision.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that goal records parse and statuses extract. 0.5 that blocking
    obligations are extractable from prose next actions without excessive
    judgement. 0.6 that several deferrals lack revisit conditions, which
    would be directly actionable contract gaps.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
