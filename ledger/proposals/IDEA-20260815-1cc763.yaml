idea:
  id: IDEA-20260815-1cc763
  question_id: RQ-SSI-001
  added: '2026-08-15'
  title: >-
    THE ISOGENY GRAPH'S EXPANSION IS ASSUMED IN EVERY MIXING ARGUMENT AND
    MEASURED IN NONE OF THIS PROGRAM'S RECORDS: measure the spectral gap of
    the 2-isogeny graph at toy primes against the Ramanujan bound
  class: measurement

  claim: >-
    Every rerandomisation argument in the isogeny literature, including the
    one in the p^(1/3) algorithm, cites rapid mixing of the 2-isogeny graph
    with a walk length of order log p. The bound rests on the graph being
    Ramanujan. Measuring the actual spectral gap at toy primes checks the
    constant behind that log p and shows whether the walk lengths used in
    practice are adequate.

  mechanism: >-
    Construct the 2-isogeny graph at toy supersingular primes, compute its
    adjacency spectrum, and compare the second eigenvalue against the
    Ramanujan bound. Derive the mixing time and compare against the walk
    lengths used in published algorithms.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'spectral gap', 'Ramanujan', 'expander', 'mixing time'; read of
      the p^(1/3) paper's rerandomisation step.
    results: >-
      Mixing is cited throughout as a justification; no record in this
      corpus measures a spectral gap or derives a mixing time from one.
    verdict: >-
      ADAPTATION. The Ramanujan property of supersingular isogeny graphs
      is a theorem and mixing times follow from it; the contribution is
      measuring the constant at toy scale and checking the walk lengths
      actually used.

  object_first_candidate:
    tracked_object: >-
      THE SECOND EIGENVALUE of the 2-isogeny graph, and the mixing time it
      implies.
    lossiness: >-
      A mixing-time bound projects the whole spectrum onto one number,
      which is adequate only if the second eigenvalue is where the bound
      binds.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives at toy primes where the full graph is constructible; the
      graph has about p/12 vertices, which bounds the reachable primes
      sharply.

  null_object_control: >-
    NULL 1 -- a random regular graph of the same degree and size, whose
    spectral gap is known asymptotically and calibrates the computation.
    NULL 2 -- a deliberately poorly connected graph, where the mixing time
    must be large; a computation insensitive to that is not measuring
    connectivity.

  discriminated_from:
    - >-
        The published Ramanujan theorem for supersingular isogeny graphs,
        which this measures against rather than tests.
    - >-
        The p^(1/3) exponent-factor records in this series, which concern
        the cost assembly; this concerns the rerandomisation step's
        justification.

  assumptions:
    - >-
        The full 2-isogeny graph is constructible at toy primes; the
        vertex count grows linearly in p so the reachable range is small
        and must be stated.
    - >-
        Toy-prime spectral behaviour is indicative of larger primes, which
        the Ramanujan theorem supports asymptotically but which small
        graphs can violate badly.

  predictions:
    - metric: >-
        random regular graph calibration
      direction: different
      minimum_effect: >-
        FORCED to match the known asymptotic gap; failure means the
        spectral computation is wrong.
    - metric: >-
        poorly connected graph control
      direction: different
      minimum_effect: >-
        FORCED large mixing time.
    - metric: >-
        measured second eigenvalue against the Ramanujan bound
      direction: different
      minimum_effect: >-
        The measurement; a gap at or near the bound confirms the
        constant behind published walk lengths.
    - metric: >-
        implied mixing time against walk lengths used in published
        algorithms
      direction: different
      minimum_effect: >-
        The decision-relevant comparison; a shortfall would mean
        published rerandomisation is under-mixed at these sizes.

  minimal_test:
    design: >-
      Four toy supersingular primes, full graph construction, both nulls.
    controls:
      - >-
          Random regular graph calibration.
      - >-
          Poorly connected control.
      - >-
          Vertex count and construction completeness verified per prime.
      - >-
          Reachable prime range stated explicitly.
    required_metrics:
      - >-
          Second eigenvalue and spectral gap per prime.
      - >-
          Implied mixing time.
      - >-
          Comparison against published walk lengths.
      - >-
          Both null outcomes.

  falsification_conditions:
    - >-
        The random-graph calibration fails. Spectral computation wrong;
        halt.
    - >-
        The measured gap violates the Ramanujan bound. Either the graph
        construction is wrong or the theorem's hypotheses do not apply at
        these sizes, and both need resolving before anything else.
    - >-
        Implied mixing time exceeds walk lengths used in published
        algorithms. Those rerandomisations are under-mixed at these sizes,
        which is a scoped finding needing review.
    - >-
        Everything matches the bound. The rerandomisation justification is
        confirmed at toy scale, which is worth recording since it is
        currently assumed.

  confounders:
    - >-
        SMALL-GRAPH ARTIFACTS: spectral behaviour at p/12 vertices in the
        hundreds is far from asymptotic and can deviate sharply from the
        Ramanujan bound for reasons that vanish at scale.
    - >-
        GRAPH CONVENTION: whether the graph is directed, weighted at
        ramified vertices, or includes j=0 and j=1728 specially changes
        the spectrum, so the convention must be fixed and stated.

  interpretation_limits:
    - >-
        Measures a graph property at toy scale; makes no claim about any
        algorithm's correctness.
    - >-
        Scoped to the tested primes and the stated graph convention.
    - >-
        An under-mixing finding at toy scale does not transfer to
        cryptographic primes.

  heuristic_assumptions:
    - id: HEUR-SSI-MIX-1
      statement: >-
        The spectral gap measured at toy supersingular primes reflects
        the gap at cryptographic primes to within a constant.
      rigorous_support: >-
        Rigorous ingredient: the Ramanujan property of supersingular
        isogeny graphs is a theorem (via Deligne's bound on Fourier
        coefficients), giving the asymptotic gap. THE GAP: the theorem
        is asymptotic, and at p/12 vertices in the hundreds the graph is
        small enough that boundary effects around j=0 and j=1728 can
        dominate the second eigenvalue.
      falsification_condition: >-
        A measured gap deviating from the Ramanujan bound in a way that
        shrinks as p grows across the tested range.
      validation_plan: >-
        SAMPLE: >= 4 primes spanning as wide a range as full
        construction allows. COMPARISON: measured gap against the bound,
        as a function of p. TAIL CHECK: the smallest prime, where
        boundary effects are worst. TRANSFER ASSUMPTION: stated, and
        supported only by the asymptotic theorem.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is graph construction plus one eigenvalue
      computation per prime.
    memory_exponent: >-
      Adjacency matrix at p/12 vertices; the binding constraint on
      reachable primes.
    best_known: >-
      The incumbent is the Ramanujan theorem and the mixing bounds derived
      from it, measured here at toy scale and not improved.
    hidden_overhead: >-
      Vertex count grows linearly in p, so full-graph construction caps
      the reachable range far below anything cryptographic.
    tradeoff_note: >-
      Larger primes give more asymptotic behaviour and cost quadratically
      in memory for the dense spectrum; sparse methods extend the range at
      some accuracy cost.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a graph-theoretic result: entirely
    dominated by the Ramanujan theorem, which is used and not improved. As a
    measurement in this program: none exists. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: measured spectral gaps and
    implied mixing times for the 2-isogeny graph at toy primes, checked
    against the Ramanujan bound and against the walk lengths published
    rerandomisation arguments actually use.

  estimated_cost:
    implementation: low
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that full graphs are constructible at four toy primes. 0.85 that the
    random-graph calibration succeeds. 0.5 that small-graph boundary effects
    make the toy gap deviate visibly from the bound, which would limit what
    the measurement supports.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
