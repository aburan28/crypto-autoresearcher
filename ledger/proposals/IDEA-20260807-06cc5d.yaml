        random process", Probability Theory and Related Fields (2020),
        arXiv:2003.08117; mixing time (c + o(1))*log2(q) with
        c = 1.01136... for almost all odd q, via the entropy of an associated
        self-similar (Bernoulli-convolution-type) measure.
