idea:
  id: IDEA-20260807-06cc5d
  question_id: RQ-EWALK-8fa147
  added: '2026-08-07'
  title: >-
    MIXING BY MULTIPLICATION, AND THE EXTERNAL INGREDIENT THAT SIZES IT: the
    Chung-Diaconis-Graham process X -> 2X + b mixes in about 1.01 log2 q steps
    where the purely additive walk needs a polynomial number, so a rho step
    R -> [lambda]R + T_s should reach Teske's ideal collision constant at r = 2
    or 3 table points instead of 16-20 -- but the multiplier costs a point
    doubling (about 1.7x per step in Jacobian coordinates) against a
    collision-constant prize capped at Teske's ~20 percent, so the derived
    verdict is a NET LOSS of about 1.4x on every curve EXCEPT those with an
    O(1)-evaluable non-unit endomorphism, i.e. small-|D_0| CM curves, which T4
    makes unreachable from any other isogeny class
  class: mechanism

  claim: >-
    (A) THE EXTERNAL INGREDIENT, VERIFIED AT ABSTRACT LEVEL AND CITED WITH ITS
    LIMITS. Chung, Diaconis and Graham, "Random Walks Arising in Random Number
    Generation", Annals of Probability 15(3), 1987, doi 10.1214/aop/1176992088,
    study the process X_{n+1} = 2 X_n + b_n mod q with b_n uniform on
    {-1, 0, +1}. The mixing time is at most about 1.02*log2(q) for almost all
    odd q; Hildebrand (2009) gives a matching-order lower bound of about
    1.004*log2(q); and Eberhard and Varju, "Mixing time of the
    Chung-Diaconis-Graham random process", Probability Theory and Related
    Fields (2020), arXiv:2003.08117, sharpen this to (c + o(1))*log2(q) with
    c = 1.01136... for almost all odd q. The purely ADDITIVE walk
    X_{n+1} = X_n + b_n on Z/q with the same three-element step set needs a
    polynomial-in-q number of steps to mix. VERIFICATION STATUS: titles,
    venues, identifiers and the abstract-level statements above were confirmed
    by web search on 2026-08-07; the primary texts were NOT read in full, no
    theorem numbering is quoted, and every use below is flagged [external,
    abstract-level] rather than asserted as a read result. A KN-LIT entry
    should be minted for these before they are cited elsewhere.

    (B) WHY A MIXING RESULT IS RELEVANT TO A COLLISION ALGORITHM, AND WHERE THE
    ANALOGY STOPS. Mixing time is not collision time, and confusing the two is
    the obvious way to overclaim here, so the boundary is drawn first. Rho does
    NOT need the walk to reach stationarity: it needs enough decorrelation that
    the visited points behave like a random map, and the birthday floor
    Omega(sqrt(N)) is untouchable regardless of how fast the chain mixes
    (KN-TECH-005). The link between the two quantities is the object of
    Kijima-Montenegro, "Collision of random walks and a refined analysis of
    attacks on the discrete logarithm problem" (KN-LIT-2945), which develops a
    method for the expected time to first collision of a Markov chain and, as
    reported there, proves the first rigorous non-trivial lower bound for Rho
    and matching upper and lower bounds under a mild assumption; and of
    Kim-Montenegro-Peres-Tetali, "A Birthday Paradox for Markov chains, with an
    optimal bound for collision in the Pollard Rho algorithm for discrete
    logarithm", recorded in research/pollard-rho-generic/literature.md as the
    reason this program measures collision quality under stated partition
    assumptions rather than assuming independence. SO THE CLAIM IS BOUNDED
    BEFORE IT IS MADE: a multiplier can move the walk from the poorly-mixing
    small-r regime to the well-mixing regime, and the entire prize for doing so
    is the gap between a poorly-mixing walk's collision constant and the ideal
    one -- which KN-TECH-006 records as Teske's ~20 percent between Pollard's
    3-branch map and a well-chosen r-adding walk, and which the program's
    baseline convention has ALREADY BANKED.

    (C) THE CONSTRUCTION. Step: R |--> [lambda] R + T_{s(R)}, with exponent
    update (a, b) |--> (lambda*a + c_s, lambda*b + d_s) mod N. Memoryless, so
    van Oorschot-Wiener merging survives (KN-TECH-006). Three choices of
    lambda, with sharply different cost profiles:
      (C1) lambda = 2, i.e. the endomorphism [2]. Available on EVERY curve, no
        CM structure required, and this is the exact CDG multiplier. Cost: one
        point doubling per step in addition to the usual addition.
      (C2) lambda = the eigenvalue of an efficiently computable NON-UNIT
        endomorphism. Over F_p these exist for small |D_0| -- the classical
        GLV-type small-degree endomorphisms on curves with CM by
        sqrt(-2), sqrt(-7), sqrt(-11) and similar. Cost: a handful of field
        operations, potentially cheaper than a doubling.
      (C3) lambda = the eigenvalue of a UNIT, i.e. an automorphism. Then
        ord(lambda) <= 6 and the construction is exactly the orbit-choice map
        of IDEA-20260807-59fed3, which is FREE but whose multiplier set has
        only 6 elements. This record therefore does not duplicate that one; it
        covers the complementary, non-unit half of End(E).

    (D) THE COST DERIVATION, DONE BEFORE ANY RUN, AND IT PRODUCES A NEGATIVE.
    Charge in F_p multiplications with the curve model named. In Jacobian
    coordinates a mixed addition is about 11M and a doubling about 8M (model-
    dependent by a few M; the exact constants are a Stage-0 obligation, not a
    quotation). So:
      additive step:            about 11M
      (C1) affine step:         about 19M, i.e. 1.73x
      collision-constant prize: at most about 1.20x (Teske's headroom)
      NET:                      about 19/11 / 1.20 = 1.44x WORSE.
    A doubling-multiplier walk is therefore a derived NET LOSS of roughly 1.4x
    on any curve, and no measurement is needed to establish the sign -- only to
    establish the exact constants. THAT DERIVATION IS THE PROPOSAL'S PRIMARY
    DELIVERABLE, because it is the cheapest possible way to decline a whole
    family of "use an endomorphism in the step" ideas with a stated reason
    rather than by fatigue.

    (E) THE ONE CELL THAT COULD PAY, AND ITS GATE. (C2) is the only regime
    where the multiplier can cost less than the ~20 percent it can buy: an
    endomorphism evaluable in about 2-4 field multiplications on a small-|D_0|
    CM curve, giving an affine step of about 13-15M against 11M, i.e. 1.18-1.36x,
    against a 1.20x prize. That is a coin flip, not a win, and it is decided by
    measurement rather than argument -- which is exactly the kind of question
    worth one bounded experiment and not worth a campaign. AND IT IS GATED
    TWICE: (i) the curve must have small |D_0|, which by T4 is fixed by the
    isogeny class, so this is a property of the target and not something an
    attacker can acquire; (ii) even where it holds, the prize is bounded by
    Teske and is zero at r >= 20, so the mechanism only matters if one wants
    r = 2 or 3 for table-size reasons.

    (F) THE TWO OUTCOMES, BOTH DELIVERABLES.
      OUTCOME 1 -- the affine walk at r = 3 attains the ideal collision
        constant that the additive walk needs r >= 16 to reach. The CDG
        analogy transfers to the collision statistic, the mechanism is
        confirmed, and the honest headline is "a rho walk needs a table of 3
        instead of 16-20 if it can afford a multiplier", with the cost
        derivation (D) attached saying it usually cannot.
      OUTCOME 2 -- the affine walk at r = 3 does NOT attain the ideal constant.
        Then mixing time and collision time diverge for this family, which is a
        substantive statement about the Kijima-Montenegro / Kim-Montenegro-
        Peres-Tetali bridge in the specific case of affine maps on Z/N, and it
        is worth recording precisely because the CDG result would have
        predicted otherwise.
      Neither outcome is an attack and neither moves an exponent.

  resource_label: >-
    R3 (End(E) as a ring -- specifically its NON-UNIT elements, and the
    multiplicative order of their eigenvalues mod N; complementary to the unit
    group used by every other L6 proposal). Secondary dependence on R2 through
    the curve model, because the whole verdict is a per-step field-multiplication
    comparison and the model sets those constants.

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    INADMISSIBLE, AND THE ARGUMENT IS SHARPER HERE THAN ELSEWHERE IN THE LANE
    BECAUSE THE MULTIPLIER IS EXPLICITLY A SCALAR. On a prime-order G every
    endomorphism acts as multiplication by a scalar (H-ENDO-001), so
    [lambda]R is computable from R by log2(lambda) group operations and the
    step map R -> [lambda]R + T_s is a composition of group-oracle calls.
    That is precisely Oracle D of KN-FIND-b7e091, generic-group simulable, and
    therefore closed at exponent 1/2 by Shoup (KN-TECH-005). The efficient
    computability of phi buys ARITHMETIC SPEED, not information: a generic
    simulator reproduces the same walk at a log-factor overhead and reaches the
    same collision at the same step index. Nothing here escapes the model and
    nothing is claimed to; the record is filed as a recorded closure of a
    natural-looking family, with an external ingredient that sizes the prize
    and a cost derivation that spends it.

  discriminated_from:
    - >-
      IDEA-20260807-59fed3 (this batch), the orbit-choice map. That uses a UNIT
      as the multiplier: free to evaluate, but only |Aut| <= 6 values
      available, and it lives on the QUOTIENT. This record uses a NON-UNIT
      multiplier: large multiplicative order, expensive to evaluate unless the
      curve is special, and it lives on G itself. The two together partition
      End(E) into its unit and non-unit parts and give the mixing axis a
      complete accounting; neither is a parameterisation of the other.
    - >-
      IDEA-20260806-37eab9, whose section (C) derives that any learned or
      expensive step function is bounded by a per-step budget of about ten
      field multiplications before it is net-negative. This record is the
      concrete instance of that budget being applied to a specific, principled,
      non-learned step function with an external mixing theorem behind it, and
      it reaches the same verdict by the same arithmetic -- which is a
      consistency check on that record rather than a duplication of it.
    - >-
      KN-TECH-018 and KN-LIT-041 (GLV/GLS). Those use endomorphisms to speed
      SCALAR MULTIPLICATION by splitting the scalar. This record uses one
      inside the WALK STEP to change mixing. Same maps, unrelated purposes, and
      the GLV splitting is not invoked anywhere here.
    - >-
      KN-FIND-009 / EV-ENDO-001, which record that R_2 is the GLV decomposition
      lattice and explicitly decline to close its uses. Nothing in this record
      contradicts that; the closure here is of the affine-STEP family on cost
      grounds, not of GLV.
    - >-
      IDEA-20260802-005, which measures the orbit-representative cost gate for
      LARGE orbits. That is about quotienting by <lambda>; this is about
      MULTIPLYING BY lambda without quotienting at all. IDEA-20260807-ebcae6
      section (D) closes the quotient use; this closes the step use.

  object_first_candidate:
    tracked_object: >-
      THE MULTIPLIER WORD: the sequence of scalars u_1, u_2, ... applied by the
      step, and its running product prod u_i mod N, followed alongside the
      walk. Equivalently, the exponent pair's linear-recurrence coefficient.
    lossiness: >-
      LOSSY, AND THE TEST IS PASSED, BUT ONLY BARELY AND THE RECORD SAYS SO.
      The multiplier word forgets the group element entirely and retains a
      scalar. But the honest reading of docs/inventor-protocol.md section 2 is
      that this projection is compatible with the operations only in the
      one-sided sense that the multiplier evolves independently of the point:
      u_{t+1} depends on s(R_t), which depends on the point, so the word is NOT
      autonomous. What IS autonomous is the pair (running product, exponent
      pair), and that pair is a reparameterisation of the walk's own state --
      i.e. NOT lossy. Recorded as a partial failure of the lossy-projection
      test rather than glossed: the genuinely new content of this record is the
      COST DERIVATION and the external mixing ingredient, not a new tracked
      object, and the class is `mechanism` for that reason.
    propagation: >-
      Deterministic: u_{t+1} = lambda for the fixed-multiplier variant, or
      lambda^{j(R_t)} for the multi-multiplier variant, and the exponent pair
      follows the affine recurrence exactly mod N. Well defined on G with no
      canonicalisation needed, which is precisely why this construction has NO
      fruitless-cycle problem -- it is not a quotient walk. That absence is a
      genuine structural difference from the rest of the lane and is worth
      recording on its own.
    survival_score: >-
      Survives change of r, of size, of DP granularity, of seed. Dies at the
      charging step on every curve without an O(1)-evaluable non-unit
      endomorphism, which is almost all of them. Dies also if combined
      naively with an Aut-quotient: [lambda]canon(A) + T is not well defined on
      classes unless lambda is a unit (the well-definedness identity of
      IDEA-20260807-59fed3 requires the multiplier to normalise the orbit),
      so the mixing gain and the space gain CANNOT be composed by this
      construction -- a real incompatibility, derived, and it is the sharpest
      structural statement in this record.

  mechanism: >-
    STAGE 0 (zero compute, and it may end the line). Fix the curve model and
    write the exact per-step field-multiplication counts for: mixed addition,
    doubling, the (C2) endomorphism evaluation on each candidate small-|D_0|
    family, and the partition/DP predicate. Compute the derived net ratio of
    (D) with those numbers instead of the indicative 11M/8M. If the (C2) cell
    also comes out net-negative for every candidate family, STOP AND RECORD
    THAT -- the whole proposal reduces to a two-line closure and costs nothing
    further, which is the best possible outcome per cost.

    STAGE 1 (instrument, HARD GATE). Implement the affine step in the existing
    harness with exact exponent bookkeeping mod N, and verify on toy instances
    that the recovered k satisfies [k]P = Q on every solve (the certificate
    discipline of docs/claims-and-verification.md; harness/toycurve.py is the
    independent verifier). Reproduce the plain additive walk's constant 1.2533
    at r >= 20 in the same harness.

    STAGE 2 (the mixing measurement, in STEPS not in cost, deliberately). For
    r in {2, 3, 4, 8, 16, 32} measure the empirical collision constant
    steps/sqrt(N) for:
      arm ADD: R -> R + T_s (the Teske baseline);
      arm MUL2: R -> [2]R + T_s (the CDG multiplier, available everywhere);
      arm MULCM: R -> [lambda_phi]R + T_s on a small-|D_0| CM curve.
    PRE-REGISTERED: arm MUL2 and arm MULCM at r = 3 attain the same constant as
    arm ADD at r >= 16, within the bootstrap band. Measuring in STEPS first is
    deliberate: it isolates the mixing question from the charging question, so
    Outcome 1 versus Outcome 2 can be decided even though the charged verdict
    is already derived to be negative.

    STAGE 3 (the charging, which is the verdict). Re-report every cell in F_p
    multiplications with the model named. Report the net ratio against arm ADD
    at its best r. The expected report is: mixing confirmed, charging negative,
    net loss about 1.4x for MUL2 and within measurement error of 1.0 for
    MULCM.

    STAGE 4 (the composition check, zero compute plus one unit test). Verify
    the derived incompatibility: attempt [lambda]canon(A) + T_s on an
    Aut-quotient with a non-unit lambda and confirm by unit test that the
    m orbit elements of a point do NOT all map to the same class. This turns
    "the mixing gain and the space gain do not compose" from an assertion into
    a checked fact.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      grep -ril over ledger/, knowledge/, docs/, research/, analysis/ on
      2026-08-07 for "Chung", "Diaconis", "Graham", "affine walk",
      "multiplier", "2x + b", "mixing time", "Kijima", "Montenegro",
      "Hildebrand", "Bernoulli convolution". Web search on 2026-08-07 to
      confirm the CDG/Hildebrand/Eberhard-Varju statements. Records read in
      full: KN-LIT-2945, research/pollard-rho-generic/literature.md,
      KN-TECH-006, KN-TECH-018, IDEA-20260806-37eab9, KN-FIND-009,
      EV-ENDO-001.
    results: >-
      "Chung" / "Diaconis" / "Bernoulli convolution": ZERO hits anywhere in
      ledger/, knowledge/, docs/ or analysis/. The Chung-Diaconis-Graham
      process is absent from this program's corpus entirely. "Montenegro": 8
      files, of which the substantive ones are KN-LIT-2945 (Kijima-Montenegro,
      collision of random walks, a bulk-seeded entry whose claims are relayed
      from the abstract and explicitly NOT independently verified) and
      research/pollard-rho-generic/literature.md (Kim-Montenegro-Peres-Tetali,
      cited as motivation for measuring collision quality). "mixing time": 40+
      files, all about ISOGENY-GRAPH or class-group mixing, none about rho walk
      quality. No record anywhere proposes an affine-multiplier rho step or
      charges one.
    verdict: >-
      ADAPTATION, and the ingredient is genuinely new TO THIS PROGRAM. The CDG
      process and its mixing bounds are established external results and
      nothing about them is claimed as new. Whether the affine-step rho walk
      itself is new to the external literature is UNVERIFIED and this record
      does not claim it is not -- affine iteration functions are an obvious
      thing to try and may well appear in the walk-quality literature. Stage 0
      must search for it; a positive hit converts Stage 2 into a replication,
      which is a better outcome than a wrong novelty claim.

  null_object_control: >-
    MANDATORY AND BLOCKING, WITH AN EXPLICIT DECAY PARAMETER.
    (1) THE MATCHED ADDITIVE NULL: arm ADD at the same r, same curve, same
    table, same seeds, same DP granularity, measured in the same run. THE DECAY
    PARAMETER IS r. The advantage of the multiplier arms over arm ADD must
    DECAY TO ZERO as r grows past the Teske threshold (about 16-20), because
    arm ADD is then already at the ideal constant and there is nothing left to
    win. An advantage that persists at r = 32 or 64 means an arm is beating the
    ideal random map, which the band derivation of IDEA-20260806-37eab9
    forbids, and therefore falsifies the instrument rather than the band.
    (2) THE SCALAR-DEGENERACY NULL: lambda = 1, which makes the affine step
    identical to the additive step. Arm MUL with lambda = 1 must produce a
    BYTE-IDENTICAL step sequence to arm ADD on the same seed. Any divergence is
    an implementation defect.
    (3) THE RANDOM-ORACLE WALK realising the ideal constant by construction, as
    the reference all arms are measured against.

  assumptions:
    - >-
      [external, abstract-level] The CDG, Hildebrand and Eberhard-Varju
      statements in claim (A) are as summarised. Verified by web search of
      titles, venues, identifiers and abstract-level claims on 2026-08-07;
      primary texts not read. If any is materially different the motivation
      weakens but the cost derivation (D) is unaffected, because (D) does not
      use them -- it uses only Teske's ~20 percent ceiling from KN-TECH-006.
      This separation is deliberate: the load-bearing negative does not depend
      on an unverified external claim.
    - >-
      [open] That total-variation mixing time is a good proxy for collision
      time for affine maps on Z/N. Kijima-Montenegro (KN-LIT-2945) and
      Kim-Montenegro-Peres-Tetali supply the general bridge, but KN-LIT-2945 is
      a bulk-seeded entry whose own "Not verified here" block says its claims
      are relayed from the abstract without independent verification. The
      proxy assumption is exactly what Outcome 2 would refute, so it is stated
      as the hypothesis under test rather than as a premise.
    - >-
      The per-step field-multiplication counts (about 11M for a mixed Jacobian
      addition, about 8M for a doubling) are indicative and must be replaced by
      measured or exactly counted values at Stage 0. The derived verdict's SIGN
      is robust to a few M either way; its magnitude is not.
    - >-
      Small-|D_0| CM curves with an O(1)-evaluable non-unit endomorphism exist
      and are constructible at toy scale. This must be VERIFIED by construction
      at Stage 1, not assumed; if no such family can be built in the toy
      harness the (C2) arm is dropped and the record reports only the (C1)
      negative.
    - >-
      The generic bound KN-TECH-005 holds; the exponent is 1/2 and only the
      constant and the table size are at stake.

  proof_search_map:
    bottleneck: >-
      The per-step cost of evaluating [lambda]. Everything turns on it: the
      mixing benefit is capped at about 1.20x by Teske, so any multiplier
      costing more than about 20 percent of a step is a net loss regardless of
      how well it mixes. Removing that bottleneck means finding an
      O(1)-evaluable endomorphism with a large-order eigenvalue, which over F_p
      means small |D_0|.
    baseline_embedding:
      parameter_slice: >-
        lambda = 1. The affine step degenerates exactly to the r-adding walk of
        KN-TECH-006, which is the baseline.
      reproduction_check: >-
        Byte-identical step sequences and identical operation counts on a
        frozen seed between arm MUL at lambda = 1 and arm ADD, at the same r.
        Not "similar constants" -- identical sequences.
    observation_collision:
      observable: >-
        The empirical collision constant steps/sqrt(N).
      distinct_preimage_search: >-
        A DELIBERATE AND PREDICTED COLLISION: arm MUL2 at r = 3 and arm ADD at
        r = 16 are predicted to have the SAME observable. The separating
        observables that must be reported alongside it are the stored-point
        count (3 versus 16) and the charged per-step cost (about 19M versus
        about 11M), and reporting the constant without both is not
        identifiable. A SECOND, MORE DANGEROUS COLLISION: a walk that mixes
        badly and a walk that mixes well can have the same collision constant
        if the badly-mixing one gets lucky on the tested seeds; the
        distinguishing observable is the block entropy of the branch-symbol
        sequence, whose forced value for an ideal walk is log2(r) per symbol
        (derived in IDEA-20260806-37eab9 step 4), and it is a required metric
        here for that reason.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move "does this walk mix" out of the group and into the affine
          dynamical system X -> lambda X + b on Z/N, where an external
          literature with sharp bounds already exists (CDG, Hildebrand,
          Eberhard-Varju), with separate encoding, completeness, soundness,
          transfer and cost-loss obligations: encoding is exact (the exponent
          pair IS such a system); completeness and soundness are trivial;
          TRANSFER is the open one (mixing time to collision time) and is the
          hypothesis under test; COST-LOSS is the doubling, and it is the term
          that kills it.
        predicted_gain: >-
          Converts a walk-quality question into a question with published
          sharp answers, at the price of one unverified transfer step which the
          experiment tests directly.
      - transform: specialization_pack
        proposed_object: >-
          A per-block charged cost measure (addition, multiplier evaluation,
          partition, DP predicate, exponent update) with charges added only
          over these disjoint blocks.
        predicted_gain: >-
          Makes the 1.4x net-loss verdict attributable and reproducible rather
          than an opaque ratio.
    quantifier_order: >-
      CLAIMED: FOR EACH lambda in the tested set and EACH curve family, THERE
      EXISTS a threshold r*(lambda) such that FOR ALL r >= r*(lambda) the
      affine walk's collision constant is within the band of the ideal, and the
      prediction is r*(2) about 3 against r*(1) about 16.
      NOT CLAIMED: FOR ALL lambda -- a lambda of small multiplicative order
      (i.e. a unit) is expected to behave differently and is covered by
      IDEA-20260807-59fed3. NOT CLAIMED: that a smaller r* implies a cheaper
      algorithm; the charging step is separate and points the other way, and
      collapsing the two orders would be exactly the overclaim this record
      exists to avoid.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At the tested sizes and in this charging convention, an affine-
        multiplier rho walk attains the ideal collision constant at table size
        X, and its fully charged cost is Y times the additive baseline." It can
        NEVER certify an exponent change (KN-TECH-005 forbids it), a
        crypto-scale constant, or anything about curve models or endomorphism
        families it did not run.
      nearby_object_control: >-
        THE FREE-MULTIPLIER OBJECT: arm MUL with the multiplier evaluation
        DELETED from the cost model but retained in the walk. This has the
        mixing and none of the cost, so it must show the full ~20 percent gain.
        If the harness cannot show a gain even on the free-multiplier object,
        it cannot see mixing at all and every negative it produces is void --
        the same instrument-failure logic IDEA-20260802-005 builds its
        free-representative calibrator on, applied to a different quantity.
    proof_obligations:
      - claim: lambda = 1 reproduces the additive walk byte-for-byte.
        responsibility: baseline
      - claim: Exponent update (a,b) -> (lambda a + c, lambda b + d) is exact mod N.
        responsibility: correctness
      - claim: Every reported solve carries a re-verified [k]P = Q certificate.
        responsibility: correctness
      - claim: Per-step costs are counted in F_p multiplications with the model named.
        responsibility: interface
      - claim: The multiplier arms' advantage decays to zero as r passes 16-20.
        responsibility: scope
      - claim: >-
          [lambda]canon(A) + T is not well defined on Aut-classes for non-unit
          lambda, so mixing and space gains do not compose by this construction.
        responsibility: feasibility
      - claim: No exponent claim is made anywhere.
        responsibility: scope

  predictions:
    - metric: >-
        table size r* at which the walk first attains the ideal collision
        constant, per arm
      direction: lower
      minimum_effect: >-
        r*(MUL2) <= 4 against r*(ADD) in [12, 20]. A measured r*(MUL2) above 8
        means the CDG mixing does not transfer to the collision statistic at
        this scale, which is Outcome 2 and is a reportable finding about the
        mixing-to-collision bridge.
    - metric: >-
        fully charged cost of the best multiplier arm against the best additive
        arm, in F_p multiplications
      direction: higher
      minimum_effect: >-
        arm MUL2 predicted 1.3x to 1.6x WORSE (derived 1.44x). A measured value
        below 1.0 -- i.e. an actual win -- contradicts the derivation and is
        treated first as a charging error, since the doubling cost is not
        optional.
    - metric: >-
        fully charged cost of arm MULCM against the best additive arm on a
        small-|D_0| CM curve
      direction: different
      minimum_effect: >-
        Predicted in [0.9, 1.2], i.e. a coin flip. This is the ONLY cell where
        the sign is genuinely open, and locating it is the measurement's real
        content.
    - metric: >-
        multiplier-arm advantage at r = 32 and r = 64
      direction: different
      minimum_effect: >-
        ZERO within the band. A persistent advantage falsifies the instrument
        (see nearby_object_control), not the band.
    - metric: >-
        block entropy of the branch-symbol sequence, block lengths 1 to 4
      direction: different
      minimum_effect: >-
        Forced value log2(r) per symbol for an ideal walk. Reported for every
        arm; an arm claiming ideal collision behaviour with entropy below
        log2(r) is inconsistent and must be explained before its constant is
        believed.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, and it may terminate the proposal): exact per-step
      operation counts for the chosen model; recompute (D); external literature
      search for prior affine-step rho walks. IF THE (C2) CELL IS ALSO
      NET-NEGATIVE ON PAPER, STOP AND RECORD THE CLOSURE -- total cost, one
      afternoon, and the deliverable is a family declined with a stated reason.
      STAGE 1 (hours, HARD GATE): implement; lambda = 1 byte-identical
      regression; certificate check on every solve; construct or fail to
      construct the small-|D_0| CM toy family and report which.
      STAGE 2 (hours): the r-sweep collision-constant measurement in STEPS,
      arms ADD / MUL2 / MULCM, with the free-multiplier calibrator.
      STAGE 3 (hours): charging and the net verdict.
      STAGE 4 (minutes): the composition unit test showing mixing and space
      gains do not compose for non-unit lambda.
      THE CHEAPEST DECISIVE CELL IS STAGE 2 AT r = 3, arm MUL2 versus arm ADD:
      if the multiplier does not move the constant there, the whole mechanism
      is absent and Stage 3 is unnecessary.
    controls:
      - arm ADD at matched r, same seeds, same run (blocking)
      - lambda = 1 byte-identical regression to arm ADD (blocking)
      - free-multiplier calibrator (multiplier uncharged) -- must show the gain
      - random-oracle walk at the ideal constant (blocking)
      - r = 32 and r = 64 zero-advantage decay control
      - certificate re-verification of every claimed solve
    required_metrics:
      - collision constant steps/sqrt(N) with bootstrap interval, per arm, per r
      - r* per arm, the first r attaining the ideal within the band
      - fully charged cost in F_p multiplications, per-block attributed, model named
      - exact operation counts for addition, doubling and the CM endomorphism
      - block entropy of the branch-symbol sequence at lengths 1 to 4
      - stored-point count per arm
      - certificate pass/fail per solve
      - whether the small-|D_0| CM toy family was constructible, with its D_0

  falsification_conditions:
    - >-
      The lambda = 1 regression is not byte-identical to arm ADD.
      Implementation defect; nothing is reported.
    - >-
      A claimed solve fails its [k]P = Q certificate. Solver defect; the run set
      is invalid, not negative.
    - >-
      arm MUL2 shows no reduction in r* against arm ADD. Outcome 2: the CDG
      mixing does not transfer to the collision statistic here, and the report
      is that finding rather than a speedup.
    - >-
      The free-multiplier calibrator shows no gain. The instrument cannot see
      mixing; every negative it produced is void.
    - >-
      A multiplier arm retains an advantage at r = 64. Instrument failure by
      the band derivation.
    - >-
      The charged verdict comes out positive for arm MUL2. The doubling is not
      being charged; a charging error, not a result, until independently
      re-derived.
    - >-
      Crashes, timeouts, memory exhaustion. INFRASTRUCTURE outcome under
      AGENTS.md rule 5.

  confounders:
    - >-
      MIXING VERSUS COLLISION. The two are different statistics and the whole
      proposal rests on a transfer between them. Measuring in steps first and
      charging second keeps the two separable, and the block-entropy metric
      gives an independent read on mixing that does not go through the
      collision constant.
    - >-
      CURVE-MODEL ARITHMETIC. Whether a doubling is 8M or 5M or 12M changes the
      magnitude of the derived loss materially. Exact counts at Stage 0, and
      the model named on every number.
    - >-
      SEED LUCK AT SMALL r. At r = 2 or 3 the collision constant has enormous
      variance; medians with bootstrap intervals over many seeds, and cells
      with overlapping intervals reported as indistinguishable.
    - >-
      SMALL-N ARTEFACTS. The CDG bound is about log2(q) and at q ~ 2^20 that is
      20 steps -- comparable to the r values under test, so at toy scale the
      mixing regime and the collision regime are not cleanly separated. This is
      a genuine limitation of toy-scale measurement of a mixing claim and it
      must be disclosed with every number.
    - >-
      LAMBDA OF SMALL ORDER. If the chosen lambda happens to have small
      multiplicative order mod N, the arm degenerates toward the unit case and
      measures IDEA-20260807-59fed3's object instead. ord(lambda) mod N must be
      computed and reported per instance.

  interpretation_limits:
    - >-
      ANY MEASURED EXCESS OVER sqrt(|Aut|) ANYWHERE IN THIS LANE, AND ANY
      MEASURED COLLISION CONSTANT BELOW THE IDEAL, IS A SUSPECTED INSTRUMENT
      ARTIFACT UNTIL THE MATCHED-ADDITIVE NULL, THE lambda = 1 REGRESSION AND
      THE DECAY CONTROL ALL PASS (RQ-EWALK-8fa147 decision_target). This record
      makes no space-size claim at all, so any apparent |Aut|-like gain from it
      would be pure artifact.
    - >-
      Mixing improvements affect the CONSTANT only, and the constant on N
      states is bounded in [1.0, 1.2533]*sqrt(N) for a memoryless walk
      (IDEA-20260806-37eab9 band derivation). The practical headroom is Teske's
      ~20 percent, which KN-TECH-006 records as already banked by the program's
      baseline. So the maximum possible prize of this entire mechanism is about
      1.20x on step count and it is derived to be net-negative after charging
      on every curve without a cheap non-unit endomorphism.
    - >-
      The CDG/Hildebrand/Eberhard-Varju citations are [external,
      abstract-level] and were not read in full. Nothing load-bearing depends
      on them: the negative verdict comes from Teske's ceiling plus the
      doubling cost.
    - >-
      Toy scale, pure Python, p up to about 32 bits, and a mixing claim is
      particularly ill-served by toy scale because log2(N) and r are the same
      order there. No crypto-scale validation (AGENTS.md rule 7).
    - >-
      This closes an affine-STEP family on cost grounds. It does not close GLV,
      does not close endomorphism lattices, and does not close anything
      KN-FIND-009's boundaries block reserves.

  reachability_gate: >-
    THE GATE IS THE VERDICT HERE, NOT A FOOTNOTE. The only cell that could pay
    is (C2): a curve with an O(1)-evaluable NON-UNIT endomorphism, which over
    F_p means small |D_0|. By T4 the isogeny class fixes t, hence D, hence
    D_0 -- so whether a target curve has such an endomorphism is a property of
    its class and cannot be acquired. From a class with generic D_0, NO isogeny
    walk of any length reaches a small-|D_0| curve, at any cost: it is not
    expensive, it is impossible, because no such curve is in the class. And
    within a class that does have one, reaching it is free (0 steps, or a short
    walk if a specific curve is wanted, and by T5 reaching a SPECIFIED curve is
    the vectorization problem at about p^{1/4}, which for merely selecting a
    curve with a known endomorphism is unnecessary because the endomorphism
    exists on the whole class by transport). CONSEQUENCE: the (C2) cell is a
    statement about which curves are slightly cheaper to attack, not a
    technique an attacker can apply to a given target. That is the honest
    framing and it caps the mechanism's operational value at zero for any
    target with generic D_0.

  target_complexity:
    time_exponent: >-
      1/2, unchanged and unchangeable here (KN-TECH-005). The claim concerns
      the constant: ideal 1.2533*sqrt(N), with the mechanism claiming to reach
      it at r = 3 instead of r >= 16, and the CHARGED constant predicted about
      1.44x WORSE than the additive baseline for lambda = 2.
    memory_exponent: >-
      O(1) per processor plus the DP table, unchanged. The secondary claim is a
      step-table reduction from about 16-20 stored points to 3, a constant-
      factor saving inside the O(1) term -- and unlike
      IDEA-20260807-59fed3 this one is paid for with per-step arithmetic that
      the derivation says exceeds it.
    best_known: >-
      Teske r-adding walk at r >= 16-20 reaching the ideal constant
      1.2533*sqrt(N), or 0.886*sqrt(N) with negation (KN-TECH-006,
      KN-TECH-018). This proposal is derived NOT to beat it on any curve
      without a cheap non-unit endomorphism, and to be a coin flip on those.
    hidden_overhead: >-
      No o(1); no asymptotic claim. Disclosed: the multiplier evaluation, which
      is the whole verdict; the curve model, worth several M per step; and the
      fact that at toy scale log2(N) is comparable to r, so the mixing regime
      the CDG result describes is not cleanly separated from the collision
      regime the experiment measures.
    tradeoff_note: >-
      Trades per-step arithmetic for step-table size at fixed collision
      constant, and the derivation says the trade is unfavourable by about 1.4x
      for lambda = 2. Memorylessness is preserved so van Oorschot-Wiener
      parallelisation is unaffected. The DP granularity is held fixed to
      isolate the effect, which is a limitation. Critically, this mechanism
      does NOT compose with the Aut-quotient (Stage 4), so its constant cannot
      be multiplied into the sqrt(|Aut|) row.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every frontier row.
    DOMINATED ON TIME by parallel rho with DPs at 0.886*sqrt(N) and O(1) memory
    (KN-TECH-001, KN-TECH-006) -- by the derived factor about 1.44x for the
    lambda = 2 arm, which is the unusual case of a proposal that can state its
    own domination quantitatively before running. DOMINATED ON TIME by the
    automorphism-discounted CM variant at 1.2533*sqrt(N/|Aut|) (KN-TECH-018,
    KN-LIT-042), which it also cannot compose with (Stage 4). DOMINATED by
    BSGS on a pure time comparison at sqrt(N) and dominating it on memory,
    which is the standard rho/BSGS trade and is unchanged. Not comparable to
    kangaroo / Gaudry-Schost / Galbraith-Ruprai (KN-LIT-7437), which solve the
    interval problem. On DATA/QUERIES nothing is consumed and nothing is
    dominated. There is no axis on which this proposal is not dominated, and
    that is stated plainly rather than left as a null.
  sota_delta: >-
    NEGATIVE, DERIVED, AND QUANTIFIED: about -44 percent (i.e. about 1.44x
    worse in fully charged cost) for the universally available lambda = 2 arm,
    against the Teske additive baseline. The one open cell is the small-|D_0|
    CM arm, predicted in [0.9, 1.2] -- i.e. between 10 percent better and 20
    percent worse, on curves an attacker cannot choose. Non-cost deltas, as
    numbers: 1 external ingredient (CDG mixing at about 1.01*log2(q)) imported
    into a corpus that had zero records mentioning it; 1 derived
    incompatibility (affine multiplier does not compose with the Aut-quotient
    for non-unit lambda); and 1 declined family with a stated reason rather
    than a fatigue report.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    0.98 that the charged verdict for lambda = 2 is negative -- it is
    arithmetic on a doubling cost against a ceiling KN-TECH-006 already
    records, and only a gross error in the operation counts could flip it. 0.6
    that arm MUL2 reaches the ideal constant at r <= 4, which is the mixing
    claim and is where the genuine uncertainty sits (the mixing-to-collision
    transfer is unverified and toy scale is a poor place to test it). 0.3 that
    a small-|D_0| CM toy family with an O(1) endomorphism is constructible in
    the existing pure-Python harness within a bounded implementation budget;
    if not, the (C2) arm is dropped and the record reports only the (C1)
    negative, which is still the deliverable. Overall this is a LOW-priority
    proposal whose main value is Stage 0: it declines a natural-looking family
    for one afternoon of arithmetic, with an external theorem explaining why
    the family looked attractive in the first place.

