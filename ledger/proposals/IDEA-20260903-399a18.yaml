      IDEA-20260806-7ea402, IDEA-20260731-009 (first 70 lines),
      IDEA-20260808-812554 (first 120 lines), EV-FBG-001, EV-REP-001,
      EV-REP-002, KN-FIND-006, KN-FIND-007, KN-OPEN-5b3a08, catalogue A1-13,
      macaulay.py, harness/semaev.py, and the EXP-ALPF-011/013/020 result
