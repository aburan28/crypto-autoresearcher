idea:
  id: IDEA-20260903-399a18
  question_id: RQ-PFDR-ae2fba
  handoff_id: TASK-20260903-22c36b
  added: '2026-09-03'
  title: >-
    THE COUPLED DEGREE-BY-YIELD TABLE AS A PRE-REGISTERED MEASUREMENT
    CONTRACT - six representation rows (direct f_V, digit d = 2, digit
    d = 4, multiplicative coset, window + lattice, ALPF-011 e-ring) at matched
    effective base size B_eff in {16, 64}, five columns (gated first fall
    d_ff, Macaulay deficit at D = 3 and 4 against a support-matched null,
    decomposition count with the KN-FIND-007 forced mean quoted, charged
    per-relation cost as a fitted sigma against the enumeration and MITM
    rows, growth arm in log2 p in {12, 16, 20}), the instrument that covers
    each of the 30 cells or the words 'no instrument', a kill rule (every
    row tracks its null within the pre-declared artifact budget at every
    reachable p AND fitted sigma >= 1 - 0.05), an alive rule (a gated degree
    deficit or a sigma advantage that grows with p, absent on the null), and
    the floor-not-exact-count discipline for every corpus-derived quantity;
    the record's own zero-compute finding is that the degree column has no
    test-covered prime-field instrument today, that two rows have no solver
    instrument at all, and that the table cannot be filled before an F_p
    port of the boolean Macaulay meter exists
  class: tooling

  claim: >-
    (A) WHAT EXISTS AND WHAT DOES NOT, AS FLOORS. RQ-PFDR-ae2fba's decision
    target is a per-representation table with a degree column and a yield
    column measured on the SAME base. No such table exists in the ledger
    (grep over ledger/ and knowledge/ for a record joining d_ff, deficit,
    decomposition count and charged cost per representation returned none;
    absence is a floor). The corpus holds AT LEAST the following instrument
    fragments, each verified by Read this session: a test-covered Macaulay
    deficit meter over F_2 only (experiments/EXP-SBRG-60c55e/driver/
    macaulay.py, boolean quotient, degree-histogram-matched null); an exact
    GF(2) rank instrument (src/h012c_block_m4ri.py, present by glob, not
    opened); an S_3 Groebner proxy with an enumerative m = 2 decomposition
    certificate (harness/semaev.py; no S_4 measurement function, only
    s4_expr with the KN-OPEN-5b3a08 fix); AT LEAST three inline Sage copies of
    the ALPF leading-form first-fall meter and one gated variant
    (EXP-ALPF-009, -010, -013 sources), none test-covered, one with a
    documented D_reg bug fixed in-run; the EXP-FB3-001 exact multiset
    counter (validated in EV-FBG-001; its code path was not located by glob
    this session and is cited by the evidence record's path only). There is
    NO prime-field Macaulay deficit meter under test, NO lattice small-root
    solver for the window row (IDEA-20260808-486ae2 names fpylll as a
    prerequisite), NO FFT/circulant solver for the coset row
    (IDEA-20260808-9ef88c stage 1 is unbuilt), and NO shared cost unit
    reconciled across records (IDEA-20260815-0902c7 is proposed, not done).
    (B) THE CONTRACT. Rows R1 direct f_V (m = 2 with S_3, m = 3 with S_4);
    R2 digit d = 2 (IDEA-20260830-84cdb7, s = log2 B); R3 digit d = 4 (s =
    log4 B); R4 multiplicative coset c mu_B (9ef88c, requires B | p - 1); R5
    window [0, B) with the S = {} tree of 486ae2 (lattice solver) and, as its
    algebra-only fallback, the same window presented as R1 with the interval
    as V; R6 the exact ALPF-011 e-ring at m = 3. Matched size: nominal B in
    {16, 64} chosen so that every row can realise it exactly (16 = 2^4 = 4^2,
    64 = 2^6 = 4^3; coset rows need 16 | p - 1 respectively 64 | p - 1, which
    fixes the prime ladder to p = 1 mod 64); EFFECTIVE size B_eff (on-curve
    x-coordinates, about B/2 for interval-defined rows) is what the null is
    matched to and what the forced mean is computed from, per the convention
    of EV-FBG-001. Columns: C1 gated first fall - d_ff by exact F_p Macaulay
    rank with the localization bit of EXP-ALPF-013 (fires AND involves the
    summation rows); C2 deficit at D = 3 and D = 4 - fall_dim(D) minus the
    same for a support-matched random generator on the identical membership
    block, with the per-row artifact budget declared in (C); C3 decomposition
    count - the forced mean binom(B_eff + m - 1, m)/N QUOTED from KN-FIND-007
    as the column's value, with an in-run exact count over 200 random targets
    per cell reported only as an instrument check that must reproduce the
    mean (a deviation is a bug, never a finding) and coverage reported as the
    one free quantity; C4 charged per-relation cost - T_solve of the row's
    declared solver in a single declared unit (F_p multiplications; 12 per
    group operation for the rho control, as EXP-ALPF-020 stated), against
    enumeration 2^{m-1} B_eff^{m-1} and MITM B_eff^{ceil(m/2)} on the same
    instances, expressed as the fitted sigma of IDEA-20260808-812554 from at
    least three B values; C5 growth arm - C1, C2 and C4 at log2 p in {12, 16,
    20} at fixed B_eff and at fixed B_eff^m / p, with the sign and CI of each
    column's slope in log2 p.
    (C) ARTIFACT BUDGETS, DECLARED BEFORE ANY CELL. R2/R3: the equal-d^s
    spread of 84cdb7 (d_ff across (2,6), (4,3), (8,2) at B = 64) is the
    budget any degree effect must exceed by a factor 2; additionally, under
    IDEA-20260903-e1e38b's derivation R2's d_ff is predicted in closed form
    (4 + floor(s/2) at m = 2) and its C1 cell is a check, not a measurement.
    R1/R4/R6: the monomial-order spread of IDEA-20260807-899c5e (grevlex,
    lex, one weighted order) on the same ideal. R5 lattice arm: the
    scrambled-window null of 486ae2. Every row: the support-matched null's
    own seed-to-seed spread.
    (D) KILL AND ALIVE RULES. KILL (scoped, representation channel at tested
    scale): for every row, at every reachable p, C1's gated deficit and C2
    lie inside the row's artifact budget, AND the fitted sigma in C4 is at
    least 1 - 0.05 with CI including 1, AND C5 shows no slope with CI
    excluding 0 in the favourable direction. ALIVE (feeds a costed
    relation-collection contract under 812554's sigma table): some row shows
    EITHER a gated C1/C2 deficit exceeding its budget by a factor 2 that
    persists or grows across the three primes and is absent on its null, OR a
    fitted sigma below 1 - 0.05 with CI excluding 1 at three B values and
    three primes, absent on the null, with the enumeration and MITM rows
    reproduced as calibration on the same instances. UNRESOLVED is a
    legitimate third verdict and is reported per cell, not rounded.
    (E) THE ZERO-COMPUTE DELIVERABLE. Before any cell runs, the filled
    instrument map of (A) applied to the 30 (row, column) cells: which cells
    have a test-covered instrument (a floor of 0 today for C1/C2 over F_p),
    which have an untested instrument (the ALPF inline meters; the harness
    S_3 proxy for C4 at m = 2), and which have none (C4 for R5's lattice arm
    and for R4's FFT arm; C1/C2 for R5's lattice arm, whose 'degree' is a
    lattice reach eps, not a Macaulay degree, and is entered as
    not-comparable). The record's honest first result is that the table's
    degree column cannot be filled for any row without the F_p port of
    macaulay.py, and that two rows' cost cells cannot be filled without
    solvers that no record has built.

  mechanism: >-
    TRACKED OBJECT. The per-representation row vector (d_ff gated, deficit
    at D = 3, deficit at D = 4, forced mean, fitted sigma, growth signs) - a
    projection of everything the row's instruments compute to six numbers
    per (B_eff, p). LOSSY-PROJECTION TEST. It discards the Macaulay matrices,
    the syzygies, the solutions, the certificates and the timings, retaining
    only quantities defined identically for every row, so rows are
    comparable; it propagates deterministically under the two operations the
    table is built around - increasing p at fixed B_eff (C5) and increasing
    B_eff at fixed p (the sigma fit) - because each retained number is a
    function of (row, B_eff, p, seed) alone. It is not a change of
    coordinates: rows with different instruments and different algebra map
    to the same six-slot vector, and the vector cannot reconstruct any of
    them. Its horizon: the vector is blind to relation rank and to the
    linear-algebra stage, which KN-FIND-007 and A1-13 hold outside this
    table by declaration.
    WHY THE YIELD COLUMN IS QUOTED. KN-FIND-007's identity forces the mean
    to binom(B_eff + m - 1, m)/N for every base of size B_eff; a table that
    'measures' it measures its counter. The measured count enters only as a
    forced-value instrument check (per IDEA-20260816-62354d's discipline),
    and coverage is the one yield quantity with freedom (bounded above by
    min(1, mean), Sidon ceiling +54 percent per EV-FBG-001), reported but
    not decision-bearing.
    WHY THE COST COLUMN IS A FITTED SIGMA. 812554 shows that at sigma = 1
    the total is m! N regardless of B, so the only quantity a representation
    can move is sigma; a cost cell that reports operations at one B cannot
    separate sigma from constants, hence the three-B fit with enumeration
    and MITM on the same instances as the two calibration rows whose sigma
    is known (1 and ceil(m/2)/(m-1)).
    WHY THE FLOOR DISCIPLINE. Every count in (A) is a count over a corpus
    that grows in every worktree; the record asserts 'at least' and never
    'exactly', and the instrument map is versioned by the commit it was read
    at.

