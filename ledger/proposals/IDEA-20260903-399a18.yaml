  minimal_test:
    design: >-
      STAGE 0 (zero compute, the deliverable): write the 6-by-5 instrument map
      with, per cell, the instrument path or 'no instrument', its test
      status, the artifact budget, the forced value where one exists, and
      the commit hash; write the kill/alive/unresolved rules verbatim; freeze
      the prime ladder p = 1 mod 64 in {2^12, 2^16, 2^20} and the B_eff
      matching rule. STAGE 1 (the prerequisite, implementation medium): port
      macaulay.py to F_p with (i) squarefree columns under a^2 = a for R2/R3,
      (ii) reduction by x^B for R1/R4/R6, (iii) the localization bit of
      EXP-ALPF-013, (iv) the histogram-matched null; validate on boolean
      fixtures and on POS-A/NEG-1/NEG-2. STAGE 2 (hours): fill C1-C3 for R1,
      R2, R3, R4, R6 at B_eff in {16, 64}, p in the ladder, 3 curves, 5 seeds,
      planted and random targets; fill C4 for R1 (exact graded solve versus
      enumeration versus MITM, m = 2 and 3) and for R2/R3 (same, at the
      digit variables); R4's C4 and R5 entirely are entered as 'no
      instrument' unless their records' solvers exist by then. STAGE 3
      (hours): C5 at fixed B_eff and at fixed B_eff^m / p. STAGE 4 (zero
      compute): the verdict table with UNRESOLVED as a first-class entry.
      THE CHEAPEST VALID DISCRIMINATOR is Stage 0 itself: it either exhibits
      a test-covered F_p degree instrument in the repository (falsifying P1)
      or establishes that the RQ's table cannot be filled today, which
      re-orders the lane's work in front of any measurement. MEMORY: every
      Macaulay layer pre-flights its column count; R1 at B = 64, m = 3,
      D = D_null is excluded by name (binom(64 . 3/2 + 3, 3) columns is far
      above 50,000) and entered as 'not computable in budget'.
    controls:
      - support-matched random generator per row, same invocation (blocking)
      - random base of size B_eff for C3, same call, forced mean reproduced (blocking)
      - enumeration and MITM rows on the same instances as sigma calibration (blocking)
      - rho in the same cost unit at 8 and 12 multiplications per group operation
      - boolean fixtures and ALPF POS-A/NEG-1/NEG-2 for the ported meter (blocking)
      - planted targets with certificates verified independently; random targets reported with the unit-ideal fraction
      - R2 and R6 closed-form check cells as table calibration (blocking)
      - per-cell memory pre-flight with abort before allocation
    required_metrics:
      - 'the filled 6-by-5 instrument map with test status and commit hash'
      - 'per cell: d_ff, localization bit, fall_dim(3), fall_dim(4), null values, artifact budget'
      - 'per cell: forced mean, in-run count, coverage, random-base coverage'
      - 'per cell: T_solve, enumeration, MITM and rho in one unit; fitted sigma with CI'
      - 'per row: slopes in log2 p with CI, at fixed B_eff and fixed B_eff^m / p'
      - 'per row: kill / alive / unresolved with the rule clause that fired'
      - 'cells aborted as not computable, by name'

  falsification_conditions:
    - >-
      F1. A test-covered F_p Macaulay deficit meter exists in the repository
      at the record's commit: P1 is wrong, Stage 1 is unnecessary, and the
      instrument map is corrected with the path.
    - >-
      F2. The ported meter fails the boolean fixtures or the ALPF controls:
      instrument failure; no cell is read.
    - >-
      F3. P3 fails: a sibling derivation is wrong or the port is wrong; the
      table halts until the disagreeing cell is hand-derived.
    - >-
      F4. P4 fails: counter defect; no yield-adjacent cell is read.
    - >-
      F5. Some row meets the ALIVE rule: the representation channel is not
      killed at tested scale and the row is routed to a costed relation-
      collection contract under 812554 and to independent review.
    - >-
      F6. Every instrumented row meets the KILL rule and the uninstrumented
      rows are UNRESOLVED (expected): the scoped kill is recorded for the
      instrumented rows only, and the forward guidance is the two missing
      solvers.

  confounders:
    - >-
      B_eff versus nominal B: interval rows lose about half their x-values
      to the quadratic character; matching on B_eff changes the coset row's
      B (which must divide p - 1) and is why the prime ladder is p = 1 mod
      64.
    - >-
      COFACTOR: build_factor_base samples the whole curve by default;
      prime-order curves or the target_subgroup scope are used and the
      choice is recorded per cell.
    - >-
      UNIT IDEALS on random targets at small B_eff^m / p make ideal-invariant
      readings vacuous; planted targets are used for C1/C2/C4 and random
      targets only for the unit-ideal fraction.
    - >-
      OMEGA and the cost unit: sigma is fitted from counted operations, not
      from Ncols^omega; the omega convention enters only the rho and
      crossbred comparisons and is reported at two values.
    - >-
      FLOOR DRIFT: the instrument map is true at one commit; every count is
      'at least' and the commit is recorded, so a later worktree cannot read
      an exact number that was never asserted.
    - >-
      R5's degree cell is a lattice reach, not a Macaulay degree, and is
      entered as not-comparable rather than forced into the column.

  interpretation_limits:
    - >-
      A tooling contract; it produces no mathematical result, moves no
      exponent, and its Stage 0 finding is about this repository's
      instruments, not about prime-field decomposition.
    - >-
      A KILL verdict is scoped to the tested rows, B_eff, p, solver and
      unit; an UNRESOLVED row is not a kill.
    - >-
      The yield column is a quotation of an identity; the table adds no
      yield knowledge and cannot.
    - >-
      Nothing above 2^20 is measured; the only route to a larger growth arm
      is the correspondence sampling of IDEA-20260731-009, which this table
      does not adopt.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For every row at the tested (B_eff, p), the support-matched random
        generator on the row's membership block behaves as a semi-regular
        sequence in the Bardet-Faugere-Salvy sense, so its d_ff equals the
        first forced-kernel degree of the row's Hilbert series and its
        fall_dim(3), fall_dim(4) are zero below that degree.
      rigorous_support: >-
        RIGOROUS: the membership blocks are complete intersections with exact
        Hilbert series (093497 for x^B, 84cdb7 for the digit blocks, 9ef88c
        for the binomial block); only the single random generator's effect
        is heuristic. CLASSICAL DISTRIBUTION IMITATED: Froberg / BFS
        semi-regularity of a generic overdetermined sequence; the same
        imitation as 093497's HA-1 and 84cdb7's H1 support.
      validation_plan: >-
        SAMPLE: 5 seeds of the random generator per row per (B_eff, p) cell,
        full rank profiles. COMPARISON: the exact Hilbert-series prediction
        per degree. TAIL CHECK: the two degrees below the predicted first
        kernel, where a null fall would be most damaging; number of failing
        cells reported. TRANSFER: none.
    - id: H2
      statement: >-
        The fitted sigma from three B_eff values at fixed p is stable to
        within 0.05 under the two group-operation conversions and the two
        omega conventions.
      rigorous_support: >-
        RIGOROUS: sigma is defined by 812554 as the log-slope of T_solve in
        B; a constant-factor change of unit does not change a slope.
        CLASSICAL STATEMENT IMITATED: exponent fits are unit-invariant;
        the heuristic part is that three points suffice at toy B.
      validation_plan: >-
        SAMPLE: the sensitivity arms (8 versus 12 multiplications, omega 2
        versus 2.807) on every C4 cell. COMPARISON: the fitted sigma across
        arms. TAIL CHECK: any cell whose verdict flips between arms is
        reported as omega-indeterminate. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. The table's own cost is
      dominated by the F_p Macaulay ranks at R1, B_eff = 64, m = 2 (columns
      binom(64 + 2, 2) order, i.e. thousands) and by the exact graded solves
      for C4; single-digit CPU hours at the declared ladder; R1 at m = 3,
      B = 64 excluded by name.
    memory_exponent: >-
      Bounded by the pre-flight column cap (50,000 columns, 4 GiB working
      set) per cell; cells above it are entered as not computable.
    best_known: >-
      Pollard rho at 0.886 sqrt(N), O(1) memory; BSGS (N^{1/2}, N^{1/2});
      kangaroo; automorphism-discounted rho; Pohlig-Hellman; generic
      preprocessing S T^2 = N; algebra-free MITM index calculus at
      N^{1/2 + 1/m}; for the decomposition subtask enumeration at 2^{m-1}
      B^{m-1} and MITM at B^{ceil(m/2)}, which are the table's calibration
      rows.
    hidden_overhead: >-
      The medium implementation cost of the F_p port is the real hidden
      cost and is stated as Stage 1; a table filled with untested inline
      Sage meters would inherit the ALPF-013 class of bug and is refused.
    tradeoff_note: >-
      Not applicable; no algorithm. The methodological tradeoff is breadth
      (six rows) versus depth (three primes); the record resolves it by
      making UNRESOLVED a legal cell value rather than by dropping rows.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST CATALOGUE A1-13 ON TIME, MEMORY AND
    DATA/QUERIES: no attack is mounted; dominated on every axis by parallel
    rho with negation, BSGS, kangaroo, automorphism-discounted rho,
    Pohlig-Hellman (not comparable), generic preprocessing S T^2 = N,
    algebra-free MITM index calculus; no queries. As tooling: dominated on
    time-to-first-number by every single-row record (which can run its own
    cell without the port) and on yield fidelity by IDEA-20260816-62354d;
    undominated on the coupled-column axis, which no record occupies. Not
    null.
  sota_delta: >-
    +0 on time, memory and queries. Quantified: the corpus has 0 records
    joining a degree column and a yield column per representation; this
    supplies one 6-by-5 pre-registered contract with 30 instrument
    assignments, 8 declared controls, 2 calibration cells forced by sibling
    derivations, a floor count of test-covered F_p degree instruments (0),
    and a floor count of rows without a solver instrument (at least 2). Its
    Stage 0 alone re-orders the lane: the F_p port precedes every degree
    measurement the RQ asks for.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.95 that Stage 0's instrument-gap finding stands (P1 and P2 are floors
    read from the tree). 0.7 that the F_p port validates on the boolean and
    ALPF fixtures at first attempt. 0.8 that every instrumented row meets
    the KILL rule at tested scale (expected, and consistent with 093497,
