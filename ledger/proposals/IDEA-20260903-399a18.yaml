      experiments/EXP-FB3-001/*.py (no match), experiments/EXP-ALPF-0*/
      source/* (130 files). CLAUDE.md 'Conventions' read for the
      floor-not-exact-count rule. No web search for this corner.
    results: >-
      IDEA-20260816-62354d is a geometry-agnostic YIELD module with in-call
      nulls and port-fidelity validation - no degree column, no cost column,
      no per-representation algebra. IDEA-20260815-0902c7 reconciles cost
      models across records - it does not define a measurement table.
      IDEA-20260807-1354d8 is a six-quantity panel for comparing curve
      MODELS with a saturation test - not per-representation, no yield
      column, no kill rule in p. IDEA-20260808-093497, -84cdb7, -9ef88c,
      -486ae2 each specify one row's measurement in isolation. A1-13 is the
      attack-frontier Pareto table, not a representation table. No record
      declares a kill rule coupling a degree deficit to a fitted sigma at
      matched B_eff. Absences are floors.
    verdict: >-
      UNVERIFIED. Nothing external is claimed; the contribution is internal
      tooling - the row/column/instrument/kill/alive pre-registration and
      the instrument-gap finding. Assembled from known parts (the T11 null
      discipline of RQ-DREG-001, the FBG counting discipline, the sigma
      threshold, the localization gate).

