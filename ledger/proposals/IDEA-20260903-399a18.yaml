  assumptions:
    - >-
      Toy scale: p in {2^12, 2^16, 2^20} with p = 1 mod 64 so the coset row
      exists at both B; at least 3 prime-order curves per p; targets uniform
      by re-randomisation; factor bases drawn with the target_subgroup scope
      or the cofactor reported (KN-OPEN-5b3a08 Q2).
    - >-
      One cost unit (F_p multiplications) for every cell of C4, with the
      group-operation conversion reported at 8 and 12 as a sensitivity arm.
    - >-
      The F_p Macaulay meter, once ported, is validated on the boolean
      meter's own test fixtures (mod-2 reduction of F_p results must agree
      where the system is defined over F_2) and on the ALPF POS-A/NEG-1/
      NEG-2 controls before any row is read.
    - >-
      A cell whose instrument does not exist is entered as 'no instrument',
      never as a null result.

  proof_search_map:
    not_applicable_reason: >-
      A tooling/measurement contract; it proposes no theorem, bound,
      certificate family or closure argument. The four audits apply to the
      rows' own records (each carries its own proof_search_map) and to the
      sibling records e1e38b and 751062, which supply the closed forms
      entering the R2 and R6 check cells.

  object_first_candidate:
    tracked_object: >-
      The six-slot row vector per (representation, B_eff, p, seed).
    lossiness: >-
      Discards matrices, syzygies, solutions, certificates and timings;
      compatible with the p-step and the B-step; not a change of
      coordinates.
    propagation: >-
      Deterministic under increasing p at fixed B_eff and increasing B_eff at
      fixed p.
    survival_score: >-
      Survives for every row that has instruments for all six slots; today
      that is zero rows; the vector is blind to relation rank and linear
      algebra by declaration.

  null_object_control: >-
    C1/C2: a support-matched random generator on the identical membership
    block per row (the T11 null), plus the row-specific artifact budget of
    (C); for R2 also the block-factored null of IDEA-20260903-e1e38b; for R6
    the S_4-scrambled null of IDEA-20260903-751062. C3: a uniformly random
    base of size B_eff drawn in the same call (62354d discipline); the
    forced mean must be reproduced by both to the digit or the counter is
    broken. C4: the enumeration and MITM rows on the same instances as
    calibration with known sigma, plus a rho control in the same unit. C5:
    the null's own slope in log2 p; a row's slope counts only in excess of
    its null's. INSTRUMENT-GATE NULLS: boolean fixtures for the F_p port;
    POS-A/NEG-1/NEG-2 for the leading-form meter; planted decomposable
    targets with verified certificates so no cell reads a unit ideal by
    accident. A cell is void unless its null ran in the same invocation.

