# IDEA-20261003-3e6677
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-3e6677
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A width-7 window table stores 64 entries and a width-6 table stores 32
  class: representation
  claim: >-
    A window of width 7 stores 64 precomputed entries. A window of
    width 6 stores 32. Sixty-four exceeds thirty-two by 32. The
    product of the two table sizes is 2048. Their sum is 96. The
    gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    6 is 64. Two to the power 5 is 32. Two width-6 tables both
    store 32, so that gap is 0 and their product is 1024. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 32.
    baseline_embedding:
      parameter_slice: The widths 7 and 6 and the sizes 64 and 32.
      reproduction_check: >-
        Two readers must agree that 2 to the power 6 is 64 and that
        2 to the power 5 is 32.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 32 drops the gap. Two width-6
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-6 table.
        predicted_gain: Thirty-two fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 64 and 32. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-6 tables. Both store 32, and the gap is 0.
    proof_obligations:
      - claim: The width-7 table stores 64 entries.
        responsibility: size
      - claim: The width-6 table stores 32 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Sixty-four exceeds thirty-two by 32.
  minimal_test:
    design: >-
      Compute 2 to the power 6 and 2 to the power 5. Do not add a
      curve point.
    controls:
      - Two width-6 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-7 table size is not 64.
    - The product of the two sizes is not 2048.
  confounders:
    - A width-6 table of size 32 is a different window from a width-5 table of size 16.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 32 and 16.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-7 table has size 2 to the power 6, and the
        frozen width-6 table has size 2 to the power 5.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Sixty-four stored entries versus thirty-two, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-13bf67
      - KR-RHO-898783
      - KR-IC-5a43e5
      - KR-IC-73db3f
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 64 and 32 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 64 versus 32
    data_queries: Two frozen widths.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
