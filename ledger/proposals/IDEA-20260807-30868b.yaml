idea:
  id: IDEA-20260807-30868b
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    A NON-TRIVIAL SELF-PAIRING ON THE CRYPTOGRAPHIC SUBGROUP FORCES EMBEDDING
    DEGREE ONE - two independent arguments (the Castryck-Houben-Merz constraint
    m | Delta_O combined with the elementary congruence relating t^2 - 4p to
    (t-2)^2 and the group order, and Galois equivariance of the Tate pairing)
    both prove that a self-pairing non-trivial on G of prime order N exists if
    and only if p = 1 mod N, in which case the map IS the classical Frey-Ruck
    pairing landing in F_p; so the "computable from one point" route and the
    classical transfer coincide exactly on their common domain and the lane has
    no third option
  class: mechanism

  claim: >-
    (A) THE SHARP QUESTION. RQ-PAIR-21313f asks whether a CM-specific
    self-pairing exists that is computable from ONE point. A pairing on
    G x G with values in mu_N would solve ECDLP by
    s(P, Q) = s(P, P)^k followed by one DLP in mu_N inside F_{p^k}. The Weil
    pairing is alternating so e(P,P) = 1 always; IDEA-20260807-464ff8 closes
    the endomorphism/distortion route. What remains is the Tate pairing and the
    generalised self-pairings of KN-LIT-7489. This record closes both, by two
    arguments that must agree and whose agreement is the internal check.

    (B) ARGUMENT ONE - THE DISCRIMINANT ROUTE, AND ITS ONE-LINE CONSEQUENCE.
    KN-LIT-7489 (Castryck, Houben, Merz) states that a non-trivial self-pairing
    with cyclic domain, compatible with isogenies between O-oriented elliptic
    curves, has order m dividing Delta_O, the discriminant of the orienting
    order. Suppose such a pairing is non-trivial on G, so m = N. Then
    N | Delta_O, and since Delta_O divides D = t^2 - 4p = disc(Z[pi]) (because
    Z[pi] is contained in O, so the conductor of O divides that of Z[pi]), we
    get N | t^2 - 4p. Now the elementary identity, which is the whole content -
    writing M for the group order p + 1 - t,
        t^2 - 4p = (t-2)^2 - 4(p + 1 - t) = (t-2)^2 - 4M.
    Since N | M, reduce mod N - N | (t-2)^2, and N prime gives
    N | (t-2), i.e. t = 2 mod N. Substituting into M = p + 1 - t = 0 mod N
    gives p = t - 1 = 1 mod N. THAT IS EMBEDDING DEGREE 1. The converse is the
    same computation read backwards. So, for a prime N dividing the group
    order -
        N | disc(End(E))   <==>   t = 2 mod N   <==>   p = 1 mod N   <==>  k = 1.
    Corollary, stated because it is the useful form - if N > 2 sqrt(p) + 2 then
    N | (t-2) with |t-2| <= 2 sqrt(p) + 2 forces t = 2 exactly, i.e. the group
    order is p - 1. So among near-prime-order curves the ONLY isogeny class in
    which a CHM self-pairing can reach G is the trace-two class.

    (C) ARGUMENT TWO - THE GALOIS ROUTE, INDEPENDENT OF (B). The Tate-
    Lichtenbaum pairing is Galois equivariant, t(pi(P), pi(Q)) = t(P,Q)^p. Take
    P, Q in G, which is contained in ker(pi - 1), so pi fixes both - hence
    t(P,Q) = t(P,Q)^p, so t(P,Q)^{p-1} = 1, so t(P,Q) lies in
    mu_N intersect F_p. If k > 1 then N does not divide p - 1, so that
    intersection is trivial and t(P,Q) = 1 for ALL P, Q in G - the Tate pairing
    restricted to G x G is identically trivial, self-pairings included. If
    k = 1 then mu_N is contained in F_p, the Frey-Ruck non-degeneracy hypothesis
    holds over the base field itself, and when the group order is exactly
    divisible by N both E(F_p)[N] and E(F_p)/N.E(F_p) are cyclic of order N
    generated by (the class of) P; non-degeneracy then forces t(P,P) to be a
    PRIMITIVE N-th root of unity. So at k = 1 a non-trivial self-pairing
    computable from one point does exist - and it is exactly the Frey-Ruck
    pairing, whose target is F_p, whose use is the classical transfer, and
    whose cost is a field DLP in F_p at L_p(1/3).

    (D) THE CONCLUSION, WHICH IS THE LANE'S ANSWER. The two arguments have
    different hypotheses and the same boundary - k = 1. There is no CM-specific
    self-pairing that is non-classical - the only self-pairing usable on G is
    the k = 1 Frey-Ruck pairing, and k = 1 is precisely the case in which the
    classical MOV/Frey-Ruck transfer is already maximally effective. The lane's
    novel branch is therefore EMPTY, not merely unexplored, and it is empty for
    a reason that can be checked in two modular exponentiations per curve.
    What remains open and is NOT closed by this record - self-pairings that are
    neither of Weil/Tate type nor compatible with oriented isogenies; pairings
    into groups other than mu_N; and bilinear maps that are not pairings of
    divisors at all. Those are named in the forward guidance, not dismissed.

  resource_label: >-
    R7 (pairings into F_{p^k}) composed with R3 (End(E) as a ring - the
    discriminant Delta_O is a ring invariant invisible to G).
  admissibility: admissible
  admissibility_argument: >-
    The resource genuinely escapes the generic group model - the discriminant
    of End(E) is not a group-operation output, and a pairing value is an
    element of a different group entirely, so neither is covered by
    KN-FIND-b7e091's simulability results. The proposal is therefore
    admissible on its face and does not fall foul of the H-ENDO-001 filter -
    it never applies phi to a point of G. Its outcome is nonetheless a closure -
    the admissible resource exists, is computable, and is provably trivial on
    G except in the k = 1 case. That is the strongest kind of negative this
    campaign can produce - one where the resource was admitted and then shown
    empty, rather than excluded by the filter.

  discriminated_from:
    - >-
      IDEA-20260807-464ff8 (the same lane, filed jointly). That record closes
      the WEIL self-pairing composed with an endomorphism, by commutativity of
      End and the alternating property. This record closes the TATE
      self-pairing and the generalised oriented self-pairings, by a
      discriminant divisibility and by Galois equivariance. Different pairings,
      different arguments, same boundary - and their agreement is a cross-check,
      not a redundancy.
    - >-
      H-SPR-71a843 and IDEA-20260806-b7fdc3, which apply the SAME KN-LIT-7489
      constraint to ORIENTED SUPERSINGULAR curves and to class-group-action
      assumptions (CGL, SQIsign, CSIDH). H-SPR-71a843 explicitly states
      "Nothing here bears on plain prime-field ECDLP; H050 ... remains the
      standing answer there." This record supplies what that pointer defers to -
      the prime-field ordinary computation, which neither record performs.
      The shared ingredient is one cited theorem; the derived statements are
      disjoint.
    - >-
      H050 (inputs/h100_session/HYPOTHESES_100.md line 337; reviewed sound in
      ledger/REVIEW-H100-20260717.md line 146). H050 asserts the conclusion in
      one sentence and attributes it to "embedding-degree arguments". This
      record supplies the argument, identifies the exceptional case exactly,
      and shows the exception is not a gap but the classical transfer.
    - >-
      KN-TECH-032 / KN-LIT-084 / KN-LIT-085. The classical transfer pairs two
      independent points and is not in question. The point of this record is
      that the ONE-POINT variant reduces to the classical transfer rather than
      extending it.
    - >-
      KN-FIND-3a7d42, which records that working in F_{p^{N/2}} is equivalent
      in difficulty to the MOV attack. Adjacent cost statement, different
      question.

  object_first_candidate:
    tracked_object: >-
      THE ORDER m OF THE SELF-PAIRING - the exponent of the cyclic group on
      which a self-pairing can be non-trivial - followed as a divisor of
      Delta_O, and compared against N.
    lossiness: >-
      Strongly lossy - the entire pairing, its construction, its target field
      and its values collapse to one integer m, and everything about the curve
      collapses to the single integer Delta_O. It is not a change of
      coordinates - one cannot recover any pairing value, or even the pairing,
      from m.
    propagation: >-
      Deterministic and compatible with the operations that matter. Under an
      O-oriented isogeny the self-pairing is by hypothesis compatible, so m is
      preserved - that is exactly what "compatible with isogenies" means, and
      it is why the projection to m survives the operation set instead of
      dissolving. Under enlargement of the subgroup m can only grow through
      divisors of Delta_O. The retained integer therefore propagates without
      needing what was discarded.
    survival_score: >-
      Survives every isogeny in the oriented category and every choice of point.
      Dissolves at the boundary of that category - a self-pairing NOT compatible
      with oriented isogenies is outside the CHM hypothesis and m carries no
      information about it. That is the exact residual this record leaves open,
      and it is named rather than papered over.

  mechanism: >-
    STEP 1 - STAGE 0, BLOCKING. Obtain the primary text of Castryck-Houben-Merz
    and verify the constraint m | Delta_O verbatim, including the 2-adic
    refinements (2m | Delta_O when 4 | Delta_O, 4m | Delta_O when 8 | Delta_O)
    and, critically, the exact hypotheses on the orientation and on the
    cyclicity of the domain. KN-OPEN-3f7a21 records that this corpus's
    citation_verified markings are unreliable, and H-SPR-71a843 already carries
    the same Stage-0 obligation. Without this, (B) is void. Write the result to
    knowledge/literature as a verified transcription.
    STEP 2 - THE DERIVATION (zero compute). Write (B) and (C) with quantifiers
    explicit. Both are short. (B) needs only that Delta_O divides t^2 - 4p and
    the identity relating t^2 - 4p to (t-2)^2 and the group order. (C) needs
    only Galois equivariance of the Tate pairing and Frey-Ruck non-degeneracy.
    STEP 3 - THE NUMERICAL AGREEMENT TEST (low compute). For toy curves,
    compute independently (i) whether N | disc(End(E)), (ii) k = ord_N(p), and
    (iii) the reduced Tate self-pairing t(P,P) via the instrument of
    IDEA-20260807-e7eb5d. The three must agree on every curve - (i) true iff
    (ii) equals 1 iff (iii) is non-trivial. A disagreement on any curve
    falsifies one of the two arguments or the instrument, and the record
    commits in advance to reporting which.
    STEP 4 - THE TRACE-TWO FAMILY (low compute). Construct the corollary's
    family directly - curves whose group order is p - 1 - and confirm that they
    are exactly where the self-pairing is non-trivial, and that solving ECDLP on
    them via t(P,P) is precisely a DLP in F_p, i.e. the classical transfer,
    with the field-DLP cost charged in full per IDEA-20260807-5f24d7.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07. grep -ril for "self-pairing", "self pairing", "Delta_O",
      "Castryck", "Frey-R", "embedding degree", "distortion" over ledger/,
      knowledge/, docs/, analysis/, ideas/, inputs/. Targeted reads of
      KN-LIT-7489.md, KN-TECH-032.md, H-SPR-71a843.yaml,
      IDEA-20260806-b7fdc3.yaml, REVIEW-H100-20260717.md,
      HYPOTHESES_100.md line 337. No external web search was performed for
      prior derivations of the equivalence in (B); this is disclosed rather
      than assumed away.
    results: >-
      "self-pairing" appears in KN-LIT-7489, KN-LIT-1400, H-SPR-71a843,
      IDEA-20260806-b7fdc3 and one line of REVIEW-H100. The CHM constraint is
      in the corpus and is already being applied - but only to ORIENTED
      SUPERSINGULAR settings, and H-SPR-71a843 explicitly excludes prime-field
      ECDLP from its scope. The congruence relating t^2 - 4p to (t-2)^2 and the
      group order, and the resulting equivalence "N | disc <==> k = 1", appear
      NOWHERE in this repository. The Galois-equivariance triviality argument
      for k > 1 appears nowhere either.
    verdict: >-
      ADAPTATION. The CHM theorem is cited, not claimed; the Galois
      equivariance of the Tate pairing and Frey-Ruck non-degeneracy are
      textbook. What is new TO THIS PROGRAM is the two-line transport of both
      into the prime-field ordinary setting and the resulting exact boundary.
      NO claim of novelty against the external literature is made - the
      equivalence is elementary enough that a published statement very likely
      exists, and finding one is a Stage-0 task whose success would be an
      ingredient, not a disappointment.

  null_object_control: >-
    MANDATORY AND BLOCKING, in both directions.
    FORCED NULL - any toy curve with k > 1 must give t(P,P) = 1 exactly, on
    100 percent of points tested. This is derivable before measurement from
    (C), which is what makes the instrument able to fail.
    PLANTED POSITIVE - a toy curve whose group order is p - 1 (trace two,
    k = 1) must give t(P,P) of exact multiplicative order N. An instrument that
    cannot produce the positive cannot certify the negative.
    DECAY PARAMETER - the embedding degree k. The predicted shape is a STEP at
    k = 1, not a decay - the fraction of points with non-trivial self-pairing
    is 1 at k = 1 and 0 at every k >= 2. A GRADUAL decline in that fraction as
    k grows is the canonical artifact tell and, per
    docs/inventor-protocol.md, means the measurement is an instrument
    property. The most likely cause, named in advance, is an omitted or
    incorrect final exponentiation by (p^k - 1)/N.
    MATCHED NULL OBJECT OF THE SAME SHAPE - a random cyclic subgroup of E[N']
    with N' coprime to Delta_O. By (B) the pairing there must be exactly
    trivial with no exceptions; this is the same control H-SPR-71a843 uses in
    the supersingular setting and it calibrates the same instrument.

  assumptions:
    - >-
      [open, Stage-0 blocking] The CHM constraint m | Delta_O as transcribed in
      KN-LIT-7489 matches the primary text and applies to a cyclic subgroup of
      an ORDINARY curve over a prime field oriented by its own endomorphism
      ring. The corpus entry is a bulk-seeded abstract relay. The record is
      VOID without this verification. Argument (C) does not depend on it, which
      is why two arguments are given.
    - >-
      [textbook, not transcribed here] Galois equivariance of the
      Tate-Lichtenbaum pairing and Frey-Ruck non-degeneracy under
      mu_N contained in F_q. A KN-LIT transcription is owed.
    - >-
      N is an odd prime exactly dividing the group order, N is not p, and E is
      ordinary. The corollary in (B) additionally assumes N > 2 sqrt(p) + 2,
      which holds exactly when the cofactor is below roughly sqrt(p)/2.
    - >-
      Delta_O divides t^2 - 4p. This uses Z[pi] contained in End(E) contained
      in O_K, so the conductor of End(E) divides that of Z[pi]. Elementary but
      stated because the divisibility direction is easy to invert by accident.

  proof_search_map:
    bottleneck: >-
      The step N | (t-2)^2 implies N | (t-2). It uses primality of N and
      nothing else, and it is the step that converts a divisibility about the
      DISCRIMINANT (a curve invariant) into a congruence on p modulo N (a
      subgroup invariant). Everything downstream is substitution.
    baseline_embedding:
      parameter_slice: >-
        The k = 1 slice. Setting p = 1 mod N must REPRODUCE the known positive -
        Frey-Ruck applies over F_p with no extension, the self-pairing is
        non-degenerate, and the transfer is the classical one. If the argument
        does not reproduce that, it is wrong.
      reproduction_check: >-
        Symbolic plus a frozen toy fixture - one curve whose group order is
        p - 1, on which t(P,P) is computed and its order verified to be N, and
        on which a full ECDLP solve via the F_p DLP is certified by an
        independent check [k]P = Q per docs/claims-and-verification.md.
    observation_collision:
      observable: >-
        The boolean "t(P,P) is non-trivial", equivalently the integer k
        compared against 1.
      distinct_preimage_search: >-
        REQUIRED. Search for two curves with the same value of the observable
        but different Delta_O, different |D_0|, different j, different
        automorphism group and different volcano level. This is EXPECTED to
        succeed abundantly, and its success is the content - it establishes
        that the observable depends on (p, N) alone and on NO CM datum, which
        is precisely why the answer to "which CM families have a self-pairing"
        is "none, as a function of CM data". Reporting a CM-conditioned
        conclusion without having run this search is prohibited.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "does a non-trivial self-pairing exist on G" by the arithmetic
          predicate "p = 1 mod N", a two-line modular computation.
        predicted_gain: >-
          Converts an open-ended search over pairing constructions into a
          decidable test costing one modular exponentiation, and makes the
          scope statement for the whole lane machine-checkable.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of the observable - the set of all curves with k = 1 over a
          given p - which is the trace-two isogeny class plus, when the
          cofactor is large, classes with t = 2 mod N.
        predicted_gain: >-
          Turns the residual case into a finite, enumerable family that can be
          audited against deployed parameters (IDEA-20260807-98a970) rather
          than left as an unquantified exception.
    quantifier_order: >-
      Claimed - FORALL p > 3 prime, FORALL ordinary E/F_p, FORALL odd primes N
      exactly dividing the group order and distinct from p - [ EXISTS a
      self-pairing in the Weil/Tate or CHM-oriented families that is
      non-trivial on G ]  IF AND ONLY IF  p = 1 mod N.
      The weaker reading NOT claimed - FORALL self-pairings whatsoever. Pairings
      outside the two named families are not quantified over, and the record
      says so in (D).
    method_ceiling:
      strongest_certifiable_claim: >-
        "For ordinary prime-field curves whose group order is exactly divisible
        by N, no self-pairing in the Weil, Tate, or CHM-oriented families is
        non-trivial on the cryptographic subgroup unless p = 1 mod N, in which
        case it is the Frey-Ruck pairing." It certifies nothing about
        self-pairings outside those families, nothing about supersingular
        curves, and nothing about ECDLP hardness.
      nearby_object_control: >-
        The cyclic subgroup of order m where m is a nontrivial divisor of
        Delta_O with m much smaller than N - the closest object where the
        desired conclusion FAILS. There the CHM pairing IS non-trivial, and the
        method must say so. A version of the argument that also kills those
        pairings proves too much and is void. This control is what separates
        "the constraint m | Delta_O bites" from "self-pairings do not exist".
    proof_obligations:
      - claim: Delta_O divides t^2 - 4p.
        responsibility: correctness
      - claim: >-
          The identity t^2 - 4p = (t-2)^2 - 4M holds, where M is the group
          order p + 1 - t.
        responsibility: correctness
      - claim: N prime and N | (t-2)^2 implies N | (t-2).
        responsibility: correctness
      - claim: The Tate pairing is Galois equivariant and Frey-Ruck is non-degenerate at k=1.
        responsibility: correctness
      - claim: >-
          At k = 1, when the group order is exactly divisible by N, both sides
          of the Tate pairing are cyclic of order N generated by P.
        responsibility: strictness
      - claim: The CHM constraint applies to this setting.
        responsibility: scope
      - claim: The planted k=1 positive returns a primitive N-th root of unity.
        responsibility: baseline

  predictions:
    - metric: >-
        agreement between the three independently computed booleans
        [N divides disc(End(E))], [ord_N(p) = 1], [t(P,P) not equal to 1],
        over a toy curve sweep
      direction: different
      minimum_effect: >-
        Perfect three-way agreement on 100 percent of curves. Even one
        disagreement falsifies (B), or (C), or the instrument, and the record
        pre-commits to a diagnostic order - instrument first (run the planted
        positive), then (C), then (B).
    - metric: >-
        fraction of curves with k > 1 on which the reduced Tate self-pairing is
        non-trivial
      direction: lower
      minimum_effect: exactly zero, with no tolerance
    - metric: >-
        fraction of trace-two curves (group order p - 1) on which t(P,P) has
        exact order N
      direction: higher
      minimum_effect: >-
        100 percent. Below that, Frey-Ruck non-degeneracy is being applied
        wrongly or the divisor-shift auxiliary point is being mishandled.
    - metric: >-
        correlation between [t(P,P) non-trivial] and any CM datum
        (|D_0|, j = 0 or 1728, conductor, class number, volcano level) at fixed
        (p, N)
      direction: different
      minimum_effect: >-
        Predicted to be exactly zero - the observable is a function of (p, N)
        alone. A non-zero correlation at fixed (p, N) is logically impossible
        under (B)/(C) and would therefore indicate an instrument or bookkeeping
        error, not a CM effect.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE, blocking): verify the CHM statement in
      the primary text and transcribe it. STAGE 1 (zero compute): write (B) and
      (C). STAGE 2 (minutes, uses IDEA-20260807-e7eb5d's instrument): the
      three-way agreement sweep over ~500 toy curves at p in [2^12, 2^20],
      selected to include curves with small k by construction so that F_{p^k}
      arithmetic is feasible. STAGE 3 (HARD GATE): the k = 1 planted positive
      and the coprime-to-Delta_O forced null. STAGE 4 (hours): the trace-two
      family, including one certified end-to-end solve at toy scale to show the
      k = 1 route is the classical transfer and to charge its field-DLP cost.
    controls:
      - k = 1 planted positive (trace-two curve) - must give a primitive N-th root of unity
      - k > 1 forced null - must give exactly 1
      - subgroup of order coprime to Delta_O - must give exactly 1 by (B) alone
      - broken-instrument control - final exponentiation omitted; the positive control must then return a value outside mu_N and be rejected
      - fixed-(p,N) CM sweep - curves in one isogeny class with different End levels must all give the same answer
    required_metrics:
      - >-
        per curve, the tuple (p, trace t, group order, N, k, disc(Z[pi]), and
        disc(End(E)) where computable)
      - the reduced Tate self-pairing value and its exact multiplicative order
      - the three booleans of prediction 1 and their agreement matrix
      - pass or fail of every named control
      - for the trace-two solve, an independently re-verified certificate [k]P = Q

  falsification_conditions:
    - >-
      Stage 0 finds the CHM constraint different from the transcription, or
      inapplicable to ordinary prime-field curves. Argument (B) is void; (C)
      survives independently and the record is superseded with the narrower
      claim.
    - >-
      Any curve with k > 1 returning a non-trivial reduced Tate self-pairing,
      surviving the instrument controls. That refutes (C) and would be the most
      consequential observation this lane could produce.
    - >-
      Any curve with k = 1 and group order exactly divisible by N returning a
      trivial self-pairing. That refutes the non-degeneracy step and would mean
      the exceptional case is empty too - which would make the closure
      STRONGER, and the record commits to reporting it as such rather than as a
      failure.
    - >-
      A curve on which N | disc(End(E)) but ord_N(p) is not 1. That is
      arithmetically impossible under (B), so it means the discriminant or the
      order computation is wrong; halt and repair.
    - >-
      Toy-scale F_{p^k} arithmetic exceeding budget before any k > 1 curve is
      measured. INFRASTRUCTURE outcome under AGENTS.md rule 5, recorded as
      such, never as evidence about self-pairings.

  confounders:
    - >-
      The divisor-shift auxiliary point. Computing t(P,P) requires a divisor
      representative with support disjoint from div(f_{N,P}), typically
      (P+R) - (R) for a random auxiliary R. R is NOT a second independent point
      in G and its use does not violate the "one point" requirement - but a
      buggy implementation can make the value depend on R, which would look
      like a discovery. The instrument must report invariance across at least
      20 independent R per evaluation.
    - >-
      Small-N artifacts. At toy scale N can be small enough that mu_N is
      accidentally in F_p for reasons unrelated to the intended family,
      inflating the k = 1 population. The prime ladder must include N large
      relative to p so that the corollary in (B) is in force.
    - >-
      Conductor confusion. disc(End(E)) and disc(Z[pi]) differ by a square
      factor. The equivalence in (B) is stated for disc(End(E)) dividing
      t^2 - 4p; when N exactly divides t^2 - 4p, N | disc(End(E)) follows, but
      the general case needs care. Every reported divisibility must name which
      discriminant it used.
    - >-
      Treating the k = 1 branch as a new attack. It is not. It is
      MOV/Frey-Ruck at its most favourable parameter, and its cost is the F_p
      DLP, charged in full.

  interpretation_limits:
    - >-
      A closure of two named families of self-pairings, not of all conceivable
      bilinear maps. The residual is stated in (D) and must be carried into any
      summary.
    - >-
      Scoped to ordinary E/F_p whose group order is exactly divisible by the
      prime N. Nothing about supersingular curves, extension fields, or
      composite subgroup order.
    - >-
      Moves no exponent, produces no algorithm, and makes no curve safer than
      the standing embedding-degree screen already does.
    - >-
      The trace-two family is a real, checkable weakness class - but it is the
      classical one, and any parameter-generation procedure that already checks
      the embedding degree excludes it automatically.

  reachability_gate: >-
    ANSWERED IN THE STRONGEST FORM AND THE ANSWER IS NEGATIVE. The property
    "supports a non-trivial self-pairing on G" is equivalent to p = 1 mod N by
    (B)/(C), and both p and N are F_p-isogeny-class invariants (the trace is
    fixed on a class, so the group order is fixed, so its prime divisors are
    fixed). The property is therefore CONSTANT on the isogeny class, so T5's
    dichotomy does not arise - goodness is neither common enough to hit nor
    locally detectable, it is simply not variable. There is no curve to walk
    to, at any cost. This is the same structural fact IDEA-20260807-b92080
    develops for the embedding degree, and the two records share it
    deliberately.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS CLAIMED FOR ORDINARY CURVES WITH k > 1 - the mechanism is
      shown empty there, so the standing exponent is the rho baseline 1/2. For
      the k = 1 exceptional family the mechanism is the classical Frey-Ruck
      transfer, at pairing cost O(log N) field operations plus a DLP in F_p at
      L_p(1/3, 1.923) - subexponential, and already known.
    memory_exponent: >-
      For the k > 1 case, O(1) - nothing is stored. For the k = 1 transfer the
      memory is that of the F_p index calculus, dominated by the factor-base
      linear algebra, and it must be charged with KN-TECH-035 full-cost
      accounting rather than as processor steps.
    best_known: >-
      Rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at
      sqrt(N) time and memory (KN-TECH-031); MOV/Frey-Ruck at L_{p^k}(1/3) when
      k is small (KN-TECH-032); Balasubramanian-Koblitz for the genericity
      bound (KN-LIT-086).
    hidden_overhead: >-
      The k = 1 branch's L_p(1/3) hides the NFS constant and, more importantly,
      hides that it applies to a family of density zero among curves generated
      by any standard procedure. Quoting a subexponential exponent without the
      density statement would be the exact scope error KN-TECH-032 warns about.
    tradeoff_note: >-
      Not applicable for the closure branch. For the k = 1 branch the relevant
      tradeoff is the NFS precomputation-versus-individual-log split, which is
      a multi-target question and is not addressed here.

