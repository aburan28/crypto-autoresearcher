idea:
  id: IDEA-20260816-c9e5d2
  question_id: RQ-RSA-d46f02
  added: '2026-08-16'
  title: 'The bound is quoted as a threshold, but success is a curve: measure the width of the success
    transition in the leaked fraction at each modulus size and lattice dimension, and test whether
    the width narrows with size as a threshold picture requires or stays open as an artifact picture
    predicts.'
  class: measurement
  claim: '(A) Every statement of the form leakage above this fraction suffices presumes a step function
    in the leaked fraction u. What a machine actually produces is a success probability P(u) rising
    from near zero to near one over some width. Define the transition width w(n, D) as the difference
    between the u at which P = 0.9 and the u at which P = 0.1, measured on seeded known-answer instances
    at fixed construction, dimension and budget. (B) The claim is that w is not negligible at reachable
    sizes and that its behaviour in n is the diagnostic: a genuine threshold requires w to shrink
    as n grows, since the bound is an asymptotic statement and finite-size rounding should vanish;
    a w that stays constant or widens in n is the structural tell of section 3 of the inventor protocol,
    an excess that fails to decay under the parameter that should destroy it, and would mean the reported
    reach depends on which quantile of P one chooses to call the bound. (C) The claim is that the
    width is decomposable and that the decomposition is measurable: part of w comes from instance-to-instance
    variation in the true prime, part from the reduction being stochastic or precision-sensitive,
    and part from the read-off. Holding the instance fixed and re-running with different reduction
    seeds separates the second from the first at no extra design cost. (D) WHAT IS NOT CLAIMED: no
    attack, no speedup and no assertion that any published bound is wrong; a bound can be a correct
    sufficient condition and still be approached through a wide transition on a finite machine. No
    claim is made that w has a limit or a scaling exponent - a fitted exponent over four sizes is
    an interpolation and is reported as one, never as a law. No claim about instance classes other
    than the seeded generator used here.'
  mechanism: 'Stage 1: at each (n, D), sample P(u) on a dense grid in u rather than bisecting, using
    a fixed seeded instance set shared across all u so the curve is paired. Stage 2: fit no model;
    report the empirical quantiles u_0.1 and u_0.9 with exact binomial intervals, and w as their difference
    with a bootstrap interval over instances. Stage 3: at three chosen u values inside the transition,
    hold each instance fixed and re-run the reduction with several distinct reducer seeds or precision
    settings, giving a within-instance success rate; the average of that within-instance variance
    is the reduction-attributable component of w, and w minus it is the instance-attributable component.
    Stage 4: repeat over n and report w(n) at fixed D and w(D) at fixed n. Refutation route: if P(u)
    is already a step at the smallest tested n, so that u_0.1 and u_0.9 coincide within one grid step,
    the transition carries no information at these sizes and the entry closes with that measured statement
    plus the grid resolution that produced it.'
  novelty_status: unverified
  novelty_screen:
    method: 'Base bucket screen. Additionally: grep -rih for ''success probability'', ''transition'',
      ''threshold'' across ledger/proposals/ and reading matching lines; re-read docs/inventor-protocol.md
      section 3 on structural tells and null objects; checked entry-one style bisection designs in
      the corpus by grepping for bisection.'
    results: Threshold and success-probability language is common in the corpus but always as a reported
      success rate, never as a width. The structural-tell pattern - a quantity that should decay under
      an increasing parameter and does not - is recorded in docs/inventor-protocol.md section 3 and
      is applied there to AES round counts; no proposal applies it to a lattice reach threshold. IDEA-20260808-e2315e
      reports reach as a single number eps-hat(D) with no transition width. No proposal in the corpus
      separates instance variance from reduction variance in a reach measurement.
    verdict: 'UNVERIFIED. Nothing asserted about external literature. Claimed new relative to this
      repository: the transition width w(n, D) as the reported object, its behaviour in n read as
      a structural tell in the sense of inventor-protocol section 3, and the fixed-instance re-run
      decomposition of w into reduction-attributable and instance-attributable parts. Assembled from
      known parts: the success measurement of entry one, the structural-tell heuristic from the protocol,
      and standard paired-sampling and bootstrap practice.'
  object_first_candidate:
    tracked_object: The success-probability curve P(u) at fixed (n, D), projected to the ordered pair
      (u_0.1, u_0.9) and thence to the width w, carried across the grid in n and D.
    lossiness: 'Genuinely lossy, and deliberately less lossy than entry one. The full state is the
      per-instance, per-seed success indicator over the whole u grid. The projection keeps two quantiles
      and discards the shape of the curve between them, the identity of which instances failed, and
      all higher moments. It is compatible with the target operation, moving in n and D, because the
      quantiles are defined identically at every grid point. What it discards that matters is asymmetry:
      a curve with a long lower tail and a sharp upper edge has the same w as its mirror, so the skew
      is retained as a secondary reported statistic rather than dropped silently.'
    propagation: One step of the target operation is increasing n at fixed D. Under a threshold picture
      the finite-size correction shrinks and w must shrink with it; under an artifact picture w is
      set by instance variance or reducer variance, neither of which has any reason to shrink in n,
      so w stays put or grows. The object therefore propagates as a width whose DIRECTION of movement
      discriminates between the two pictures, which is why the direction rather than the value is
      the pre-registered prediction.
    survival_score: 'The width should remain measurable as long as it exceeds the u grid resolution.
      It dissolves when w falls below one grid step, which is expected first at the largest n if the
      threshold picture is right, and never if the artifact picture is right. Concretely: expected
      measurable at n = 128 and 256 with a 0.005 grid in u, and the size at which it stops being resolvable
      is itself the result.'
  null_object_control: 'The identical curve-sampling runs against a null constructed so that the true
    success probability is known in advance and is a genuine step: a synthetic oracle that reports
    success exactly when u exceeds a fixed constant, wired into the same measurement, bisection, quantile
    and bootstrap code path. The null must return w equal to zero within one grid step; if the pipeline
    reports a nonzero width for a synthetic step, the measured widths are an artifact of the measurement
    code and every number is void. A second null is the random-revealed-bits arm from entry one, which
    must produce P(u) identically near zero so that no quantiles are defined at all, confirming that
    the curve being measured is a recovery curve.'
  discriminated_from:
  - 'Entry one of this bucket: reports a single quantile r_hat and explicitly notes that a wide transition
    would make that quantile misleading. This entry measures the width that entry one''s projection
    discards, and is the reason that projection can be trusted or not.'
  - 'IDEA-20260808-e2315e: reports reach as a scalar eps-hat(D) and never samples a success curve
    or separates variance components.'
  - 'A statistical power analysis: this is not about how many samples are needed to estimate a threshold;
    it is about whether the underlying quantity is a threshold, which is a property of the system
    rather than of the sampling.'
  - 'Reduction-quality benchmarking: the fixed-instance re-run arm resembles a reducer variance study,
    but here it exists only to partition w, and the reported object is the partition, not the reducer.'
  - 'docs/inventor-protocol.md section 3''s AES example: same heuristic, entirely different system
    and quantity; this entry is an application of that heuristic, and names it as such rather than
    presenting the heuristic as new.'
  assumptions:
  - P(u) is monotone in u, so quantiles are well defined; non-monotonicity is detected by the dense
    grid rather than assumed away.
  - The reducer's stochasticity or precision sensitivity can be varied without changing the construction,
    so that the within-instance re-run isolates a reduction component.
  - A u grid of 0.005 is fine enough to resolve the widths of interest at the tested sizes; if it
    is not, the entry reports a bound on w rather than a value.
  - Instances from the seeded generator are exchangeable at fixed n, so bootstrap intervals over instances
    are meaningful.
  predictions:
  - metric: w(n, D) at the smallest tested n, in units of u
    direction: higher
    minimum_effect: 0.01
  - metric: w(n, D) at fixed D as n grows from 128 to 1024
    direction: different
    minimum_effect: 'No pre-committed magnitude, but the DIRECTION is the pre-commitment and it is
      two-sided: shrinking supports the threshold picture, constant or growing is the structural tell.
      Committing to a magnitude would presuppose which picture holds.'
  - metric: reduction-attributable share of w from the fixed-instance re-run arm
    direction: lower
    minimum_effect: 0.5
  - metric: w reported by the pipeline on the synthetic step-function null
    direction: lower
    minimum_effect: 0.0
  minimal_test:
    design: Fix D and take n in {128, 256} only. At each n sample P(u) on a grid of 0.005 in u spanning
      the transition, using 60 paired seeded instances shared across all u values. Report u_0.1, u_0.9,
      w and skew with bootstrap intervals over instances. At the three u values nearest the midpoint,
      re-run each instance with five distinct reducer seeds or precision settings and compute the
      within-instance success rate, giving the reduction-attributable component. Run the synthetic
      step-function null and the random-revealed-bits null through the identical code path in the
      same invocation. This discriminates because two sizes are the minimum that can show a direction
      in n, because the synthetic null is what makes any nonzero w credible at all, and because a
      reduction-attributable share near one would immediately relocate the entire question into entry
      seven's territory rather than the construction's.
    controls:
    - Synthetic step-function oracle through the identical measurement code path, which must report
      zero width.
    - Random-revealed-bits null, for which no quantiles may be definable.
    - Paired instances shared across every u value at a given (n, D).
    - Fixed-instance multi-seed re-runs at three u values inside the transition, partitioning the
      width.
    - 'Grid-resolution control: the whole analysis repeated at a coarser u grid to confirm reported
      widths are not grid artifacts.'
    required_metrics:
    - u_0.1 and u_0.9 per (n, D) with exact binomial intervals
    - w = u_0.9 - u_0.1 with bootstrap interval over instances
    - skew of the transition, as the offset of the median from the midpoint of the quantiles
    - within-instance success rate at three midpoint u values, and the derived reduction-attributable
      share of w
    - w reported on the synthetic step-function null
    - reduction wall time and peak resident memory per cell
  falsification_conditions:
  - 'The synthetic step-function null yields nonzero width above one grid step: the measurement pipeline
    manufactures width and every result is void.'
  - 'P(u) is non-monotone on the dense grid at more than one cell: quantiles are undefined and the
    object dissolves.'
  - 'w falls below one grid step at every tested n: the transition is unresolvable at this resolution
    and only an upper bound on w may be reported.'
  - 'The reduction-attributable share exceeds one, meaning within-instance variance exceeds total
    variance: a bug in the partition, run void.'
  - 'Coarse-grid re-analysis changes w by more than its bootstrap interval: the reported widths are
    grid artifacts.'
  confounders:
  - Instance heterogeneity in the true prime, for example an unusually structured high half, widens
    the transition for reasons unrelated to the construction; recorded per instance and examined in
    the skew analysis.
  - Reducer precision settings may change the construction's effective behaviour rather than only
    its variance, which would contaminate the partition; entry seven is the dedicated control and
    this entry pins settings outside the re-run arm.
  - A time cap that truncates slow instances biases P(u) downward at large u, artificially widening
    w; capped instances are reported separately and excluded from the quantile fit with the exclusion
    count stated.
  - Bootstrap intervals over instances assume exchangeability, which the seeded generator should provide
    but which is not verified independently.
  - At the smallest n the grid in u is coarse in absolute bit terms, since 0.005 of a 64-bit prime
    is less than one bit, so the effective resolution is quantised by bit granularity and this must
    be reported in bits as well as in fractions.
  interpretation_limits:
  - A wide transition does not show that any published bound is wrong; it shows that the quantile
    chosen to report a bound matters at these sizes.
  - The direction of w in n is read over four sizes at most; no scaling law is claimed and no extrapolation
    is made.
  - The partition into reduction and instance components is specific to the reducer settings varied
    and does not exhaust the sources of variance.
  - Nothing here concerns deployed RSA or any security consequence.
  target_complexity:
    time_exponent: No attack exponent is claimed. Dense-grid sampling costs more than bisection and
      that cost is measured and reported as instrument cost.
    memory_exponent: No attack memory exponent is claimed. Peak resident memory per cell is reported
      beside time.
    best_known: 'The incumbent is the threshold convention: every reach statement in this repository,
      including entry one of this bucket, reports a single quantile as if the underlying object were
      a step. No record in the corpus reports a transition width for a lattice reach measurement,
      so the incumbent value of w is unmeasured.'
    hidden_overhead: Dense sampling multiplies the run count by roughly the grid size relative to
      bisection, and the fixed-instance re-run arm multiplies again at three u values; the human cost
      is in resisting the temptation to fit a parametric curve, since a fitted sigmoid would report
      a width that is a property of the fit rather than of the data.
  dominated_by: n/a (no result claimed). No solver or attack point is proposed and no frontier row
    applies; I did not check frontier rows because there is nothing here to place on one.
  sota_delta: No attack; conceptual and measurement contribution only. The deliverable is a width
    with a bootstrap interval and its direction across sizes, in a repository that reports reach thresholds
    without any width at all.
  estimated_cost:
    implementation: low
    compute: high
  recommended_priority: medium
  honest_prior_of_survival: 'The synthetic step-function null reporting zero width: 0.9, since it
    is a direct test of the analysis code. w exceeding 0.01 in u at n = 128: 0.75, because instance
    variance alone should produce that much at a 64-bit prime. The direction of w in n being resolvable
    over the tested sizes at all: 0.5, since two or three sizes with bootstrap intervals may simply
    overlap. The reduction-attributable share being below one half: 0.6, with the alternative outcome
    being interesting rather than disappointing, since it would relocate the question to the instrument.
    The whole transition being unresolvable at 0.005 grid resolution: 0.15.'
