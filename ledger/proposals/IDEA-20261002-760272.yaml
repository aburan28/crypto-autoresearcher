idea:
  id: IDEA-20261002-760272
  question_id: RQ-ECDLP-002
  added: '2026-10-02'
  status: proposed
  approved_by: null
  title: >-
    Seed additive energy on a j = 0 curve versus a generic j curve, above
    the constant automorphism factor
  class: measurement
  claim: >-
    On prime-order short-Weierstrass curves over the same toy prime, one
    with j = 0 and one with generic j, the additive energy of successful
    decomposition seeds into a fixed subgroup H of F_p-star of order B
    (R1 of RQ-ECDLP-623a32, attack stage relation decomposition) is either
    larger on the j = 0 curve by a factor at least N to the 1/8, or the
    ratio of the two energies lies in [1/6, 6]. The second arm is the
    constant-factor regime already priced for automorphism orbits. The
    first arm is a power, and only a power moves the listing exponent theta
    by more than an additive O((log N) inverse) inside the model time
    N to the 2/(m - theta). The proposal does not assert which arm occurs.
    Matched controls are Pollard rho with the order-6 automorphism discount
    on the j = 0 curve, and plain rho and BSGS on both curves.
  mechanism: >-
    OBJECT FRAME. Representation: R1, the exponent e of an abscissa in a
    fixed public subgroup H of order B, the same H on both curves.
    Operation set Sigma: multiplication of abscissae by the constant zeta
    implementing the order-3 automorphism of a j = 0 curve, (x, y) maps to
    (zeta x, y), together with the quadratic membership step that accepts
    a seed. On the generic-j curve, zeta is not an automorphism. Sigma is
    still formally the same set of field multiplications, so the comparison
    is well-defined. Sigma does not contain elliptic translation. F6, the
    automorphism orbit, is a named component used only as the constant-factor
    null, not as the lens. The lens is the energy gap beyond that constant.
    TRICHOTOMY: branching. Acceptance of a seed is a membership event, not
    a block system of translations. The orbit under multiplication by zeta
    has size dividing 6, which is a block system of a tiny subgroup of
    F_p-star, and canonicalising that orbit costs O(1) field
    multiplications. That O(1) canonicalisation is the constant this record
    subtracts. LOSSY PROJECTION: e discards the ordinate and every abscissa
    outside H. The further quotient by the subgroup generated by zeta
    discards at most a factor 6. A gap larger than 6 is not that quotient.
    KN-OPEN-020 class: implicit-membership, same base on both curves, so
    the base is not the variable under test. The variable is the curve's
    endomorphism ring. The model link, stated so it can be checked and
    rejected: if the energy ratio is N to the epsilon with epsilon >= 1/8,
    the listing cost on the j = 0 curve is B to the theta with theta
    smaller than the generic-curve theta by at least epsilon in the exponent
    of B, up to the factor-6 orbit which is removed before the comparison.
    A ratio inside [1/6, 6] leaves theta unchanged and leaves the rho
    exponent in place, in agreement with the constant sqrt(6) iteration
    discount and not in addition to it.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-0528e7
      provenance: internal
      claim: >-
        An automorphism group of order m reduces rho iterations by sqrt(m).
        For j = 0 the factor is sqrt(6), a constant. It does not change the
        exponent 1/2. Read from the rendered generic-rho frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Symmetries and small-order torsion speed point decomposition by
        about 2 to the omega(n - 1) on extension-field twisted Edwards and
        Jacobi models. Read from the rendered index-calculus map. This
        record is a prime-field energy comparison, not that estimate.
      verified_by: idea-generator session 2026-10-02
    - ref: KR-RHO-53c89f
      provenance: internal
      claim: >-
        Pairing transfer and the anomalous-curve p-adic method apply only
        to special curves. A j = 0 curve is special. This record does not
        transfer the instance to a finite-field discrete log and does not
        lift. Read from the rendered frontier map.
      verified_by: idea-generator session 2026-10-02
    - ref: KN-FIND-ffe1df
      provenance: internal
      claim: >-
        Theorem C as read: an exactly sum-compatible bucket map on a
        prime-order group is a homomorphism, hence trivial or injective.
        The energy statistic is not claimed to be sum-compatible.
      verified_by: idea-generator session 2026-10-02
  assumptions:
    - >-
      F6 is the null, not the lens. A measured factor inside [1/6, 6] is
      recorded as the automorphism constant and is not an exponent result.
    - >-
      Both curves are ordinary prime-order curves over the same p. The j = 0
      curve is the structured public family. The generic-j curve is the
      control, not a second attack target.
    - >-
      No reduction from generic-j ECDLP to j = 0 ECDLP is claimed. A gap on
      j = 0 does not cascade to generic j.
  predictions:
    - metric: >-
        additive energy of successful seeds on the j = 0 curve, divided by
        the same energy on the generic-j curve, after removing orbits of
        size dividing 6
      direction: different
      minimum_effect: >-
        A ratio at least N to the 1/8 at N near 2 to the 20. A ratio inside
        [1/6, 6] is the constant arm.
    - metric: >-
        empirical listing exponent theta on each curve, log of membership
        tests per successful seed over log B
      direction: lower
      minimum_effect: >-
        theta(j = 0) <= theta(generic) - 1/8. A gap smaller than 1/8,
        including a gap explained by a factor 6 in the raw counts, is the
        null.
  minimal_test:
    design: >-
      One toy prime, N near 2 to the 20, B near N to the 1/4, arity m = 5.
      Build one j = 0 curve and one generic-j curve of prime order over
      that prime. For 20 decomposable targets on each curve, compute seed
      energy after folding orbits of size dividing 6. Compare. Run rho
      with and without the automorphism on the j = 0 curve for the same
      targets, as the constant-factor reference.
    controls:
      - >-
        Pollard rho, plain and with the order-6 quotient, and BSGS, on
        both curves.
      - >-
        A second generic-j curve over the same p. The energy ratio of the
        two generic curves is the null pair. A power between them falsifies
        the attribution to j = 0.
      - >-
        Random-label control: shuffle abscissae by a fresh random
        permutation before reading exponents. Structure that survives the
        shuffle is not about the curve equation.
      - >-
        Generic-group control: Z/NZ with a random injection into the
        exponent slot.
    required_metrics:
      - energy ratio after the factor-6 fold
      - theta on each curve
      - rho iteration ratio with and without the automorphism
      - energy ratio of the two generic-j curves
  falsification_conditions:
    - >-
      The folded energy ratio lies in [1/6, 6]. The endomorphism contributes
      a constant. Theta is not smaller by 1/8. The exponent stays 1/2 in
      the model.
    - >-
      The two generic-j curves differ by N to the 1/8 or more. The gap is
      not a j = 0 effect.
    - >-
      The folded ratio exceeds N to the 1/8 but the automorphism-discounted
      rho already accounts for the same seeds by an orbit walk of cost
      sqrt(6). Then the seeds are the F6 orbit and the lens was not new.
      Record that and stop.
    - >-
      No decomposable target exists at this (N, B, m) on one of the two
      curves. The comparison is undefined. Report the hit counts and do not
      impute a ratio.
  confounders:
    - >-
      Zeta may lie outside the prime field for a bad p. Choose p congruent
      to 1 mod 3 so that the automorphism is rational, and record that
      congruence. A non-rational automorphism is a different family.
    - >-
      Cofactor greater than 1 on one curve and not the other changes the
      subgroup order. Both groups are required to be prime and within a
      factor 2 in size.
    - >-
      Folding orbits before measuring energy can hide a real power if the
      power lives inside the orbit. Report the unfolded ratio as well. The
      decision uses the folded ratio only.
  interpretation_limits:
    - >-
      One prime, two curves. No statement about secp256k1 or any named
      deployed curve. No live keys.
    - >-
      A power on j = 0 does not transfer to generic j. The record forbids
      that sentence.
    - >-
      KN-OPEN-020 class of the shared base: implicit-membership. The record
      does not propose a new base.
    - >-
      The constant sqrt(6) rho discount of KR-RHO-0528e7 is the matched
      special-curve baseline. Beating that constant by another constant is
      out of scope.
  heuristic_assumptions:
    - id: H1
      statement: >-
        After discarding orbits of size dividing 6, a uniform random
        successful-seed set on either curve has additive energy within a
        factor 2 of the energy of a random subset of Z/BZ of the same
        cardinality, at N near 2 to the 20 and B near N to the 1/4.
      rigorous_support: >-
        Additive energy of a random subset of Z/BZ is a standard second-moment
        count, Theta of (size to the 2 over B) plus the diagonal. The
        successful seeds are not proved random.
      validation_plan: >-
        Draw 20 random subsets of the observed cardinality and compute their
        energy. The successful-seed energy on the generic-j curve must fall
        between the 5th and 95th percentile of that sample, or H1 fails for
        the null curve and the j = 0 comparison is not interpreted. Tail
        check: the maximum random-subset energy in the sample is recorded
        and the j = 0 energy is compared to it, not only to the mean.
    - id: H2
      statement: >-
        An energy ratio of N to the 1/8 after the fold implies a listing
        exponent gap of at least 1/8 between the two curves, at this single
        B.
      rigorous_support: >-
        This is a one-point numerical implication, not a theorem. It
        imitates the energy-increment step that turns a large energy into
        a short arithmetic progression whose listing cost is the square
        root of the ambient set. The imitation may fail when the progression
        is shorter than the energy suggests.
      validation_plan: >-
        If the ratio meets N to the 1/8, compute the shortest arithmetic
        progression cover of each seed set and set theta from the cover
        size, not from the energy. If the theta gap is below 1/8, H2 fails
        and the energy is not a listing-cost gap.
  target_complexity:
    time_exponent: >-
      Constant arm: N to the 1/2, unchanged. Power arm, if the theta gap is
      at least 1/8 and the generic curve sits at theta = 1, m = 5: the
      j = 0 model exponent is 2/(5 - (1 - 1/8)) = 2/(4 + 1/8) = 2/(33/8)
      = 16/33, which is about 0.485, a delta of 1/2 - 16/33 = 1/66 below
      the rho exponent. The arithmetic is part of the reproduction check.
      It is not a measured cost.
    memory_exponent: >-
      Matrix of width B on both curves, exponent 2/(m - theta) on the arm
      that is real. The constant arm does not change rho's polylog memory
      requirement because this record then recommends no matrix.
    best_known: >-
      On j = 0, rho discounted by sqrt(6), still exponent 1/2. On generic
      j, rho at exponent 1/2 times polylog.
    hidden_overhead: >-
      The factor 6, the cost of testing the automorphism, and (log p)
      squared per membership test. They are constants or polylog. The
      possible exponent gap 1/66 is smaller than what a sloppy Theta can
      hide, so the reproduction check expands constants before the gap is
      quoted again.
    tradeoff_note: >-
      Single target. The automorphism walk is the control, not a
      preprocessing table. No cross-curve reduction is costed because none
      is claimed.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  proof_search_map:
    bottleneck: >-
      The energy gap beyond the factor 6. A gap inside that factor does not
      move theta.
    baseline_embedding:
      parameter_slice: >-
        The generic-j curve at the same p, B, and m, whose seeds are the
        theta = 1 slice if H1 holds.
      reproduction_check: >-
        Recompute 16/33 from m = 5 and a theta gap of 1/8 by hand on the
        record's own formula 2/(m - theta). A mismatch is an algebra fault.
        Also recompute that a factor-6 energy ratio changes theta by
        log(6)/log(B), which at B near 2 to the 5 is about 0.5 and at
        cryptographic B would be negligible. The toy grid must not confuse
        that large toy log(6)/log(B) with a power of N. The check writes
        both numbers down before the curves are built.
    observation_collision:
      observable: >-
        Folded additive energy of the successful exponent set.
      distinct_preimage_search: >-
        Two seeds in one zeta-orbit. They are the same observation after
        the fold. If the unfolded energy is carried by those pairs alone,
        the observable has no second preimage outside F6.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Additive energy modulo the subgroup generated by zeta, rather
          than the raw seed set.
        predicted_gain: >-
          Separates a factor 6 from a factor N to the 1/8. Only the second
          changes the model exponent, by the 1/66 computed above, if the
          theta translation in H2 also holds.
    quantifier_order: >-
      FOR ALL 20 targets on each curve, the folded energy ratio is in
      [1/6, 6], OR EXISTS a j = 0 excess of at least N to the 1/8 against
      BOTH generic-j curves. A excess against only one generic curve is a
      confounder, not the power arm.
    method_ceiling:
      strongest_certifiable_claim: >-
        A one-prime comparison of energies and of theta. Not a generic-curve
        exponent, and not a replacement for the sqrt(6) rho analysis.
      nearby_object_control: >-
        The second generic-j curve. The desired gap is known to be
        unattributable to j = 0 if it appears between the two generic
        curves.
    proof_obligations:
      - claim: >-
          Folding by zeta removes at most a factor 6 from the energy.
        responsibility: size
      - claim: >-
          A factor 6 does not change the asymptotic exponent 1/2.
        responsibility: scope
      - claim: >-
          The 16/33 figure matches 2/(m - theta) at the stated gap.
        responsibility: runtime
    not_applicable_reason: null
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-0528e7
      - KR-RHO-fb88e6
      - KR-RHO-037e22
      - KR-RHO-53c89f
      - KR-RHO-755e35
      - KR-RHO-13bf67
      - KR-IC-955fd6
      - KR-IC-b0fcda
      - KR-IC-5931ee
    nearest:
      - ref: KR-RHO-0528e7
        provenance: retrieved
        relation: adjacent
        delta: >-
          The row gives a constant sqrt(m) on rho iterations and states
          that the exponent stays 1/2. This record uses that constant as
          the null band [1/6, 6] on a different stage, decomposition-seed
          energy. A result inside the band adds nothing. A result outside
          the band would be a different exponent on that stage only, and
          only on j = 0. It is not asserted.
      - ref: KR-IC-955fd6
        provenance: retrieved
        relation: adjacent
        delta: >-
          That row is an extension-field decomposition speedup of size
          about 2 to the omega(n - 1), a constant once n is fixed. This
          record is a prime-field energy ratio against N to the 1/8, which
          is a power, on j = 0 versus generic j. The stages match only in
          the word decomposition.
    searched:
      corpus_grep:
        - j = 0
        - automorphism orbit
        - additive energy
      web: []
      blocked: []
  dominated_by: >-
    Inside the constant band, KR-RHO-0528e7 dominates: the same curves are
    already priced at rho over sqrt(6), exponent still 1/2, and a seed
    energy that reproduces the factor 6 does not improve time or memory.
    Outside the band the conditional model exponent 16/33 is not strictly
    dominated by the rows checked. KR-RHO-755e35 says an isogeny walk does
    not reach a weaker group structure. This record does not walk isogenies.
    KR-IC-b0fcda is a Frobenius-stable factor base for subfield curves,
    a different field shape.
  sota_delta: >-
    Constant arm: time-exponent delta 0 versus automorphism-discounted rho,
    whose leading term is still p to the 1/2. Power arm at the minimum
    effect: model time exponent 16/33, which is 1/66 below 1/2, on j = 0
    only, memory the matrix at that same exponent. The 1/66 figure is an
    algebraic image of the minimum effect, not a measurement.
