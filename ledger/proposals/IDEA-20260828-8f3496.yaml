idea:
  id: IDEA-20260828-8f3496
  question_id: RQ-MLDSA-ffa0f5
  goal_id: GOAL-MLDSA-002
  added: '2026-08-28'
  proposed_by: idea-generator
  status: proposed
  title: >-
    NIST's own mandatory FIPS 140-3 conformance gate (ACVP) is the concrete,
    real-world instance of "random sign-verify testing" the RQ's motivation
    invokes but that no filed proposal has actually measured: pull the
    public ACVP ML-DSA sigGen/sigVer test-vector counts and combine them
    with IDEA-20260805-bb52fa's p_R=7.34e-9 to compute, for the first time,
    how many orders of magnitude short the CERTIFICATION PROCESS EVERY
    FIELDED IMPLEMENTATION UNDERGOES falls of ever exercising the ct0 branch.
  class: measurement

  claim: >-
    (A) THE OBJECT NO PRIOR PROPOSAL MEASURED. RQ-MLDSA-ffa0f5's own
    motivation states the ct0 rejection is "unobserved across more than one
    billion signatures, which is precisely why sign-verify testing cannot
    detect a signer that omits it." IDEA-20260821-71fc18 independently
    derives the same conclusion analytically (1/p_R = 1.36e8, 1/(p_R(1-sigma))
    = 1.5e10 signatures needed) and separately RAN a web query specifically
    targeting ACVP's ML-DSA test vectors (its logged query S4) but explicitly
    recorded "NEITHER PAGE WAS FETCHED" — the actual number of vectors NIST's
    own conformance program generates per submission has never been obtained
    in this lane. This proposal obtains it and completes the comparison
    71fc18 set up but did not finish.
    (B) THE CLAIM, PRECISELY. Let V_ACVP = the total number of ML-DSA-44
    sigGen test cases a single vendor's ACVP validation submission is
    required to pass (a fixed, small, publicly-specified number per NIST's
    ACVP algorithm capabilities registration). CLAIM 1: V_ACVP * p_R * (1 -
    sigma) << 1, i.e. the EXPECTED number of times the mandatory conformance
    test for ANY SINGLE vendor submission would ever exercise the tier-0-
    observable consequence of the omitted ct0 check is many orders of
    magnitude below 1. CLAIM 2 (aggregate, weaker evidence standard): even
    summed across EVERY ML-DSA CMVP certificate issued to date (a count
    obtainable from public CMVP certificate listings or third-party trackers,
    NOT assumed here), the total conformance-testing-derived expected
    detection count remains far below 1, UNLESS V_ACVP turns out to be far
    larger than the tens-to-low-hundreds order of magnitude typical of other
    NIST ACVP algorithm tests (an EMPIRICAL premise this proposal tests
    rather than assumes — see H1).
    (C) WHY THIS IS NOT JUST A RESTATEMENT OF 71fc18. 71fc18 computes the
    THRESHOLD (how many signatures an audit needs); this proposal supplies
    the missing OTHER HALF of the comparison — how many signatures the ONE
    REAL, NAMED, MANDATORY testing process that every certified
    implementation undergoes actually generates — which 71fc18 searched for
    but never retrieved. Without this number, "impractical" and "no amount
    of testing will find one" remain qualitative; with it, they become an
    exact ratio against a real government certification program.

  mechanism: >-
    ACVP (Automated Cryptographic Validation Protocol) is the mechanism by
    which NIST's Cryptographic Algorithm Validation Program (CAVP) issues
    algorithm validation certificates that FIPS 140-3 module validation
    (CMVP) requires; a vendor's ML-DSA implementation is submitted against a
    published capabilities/test-vector specification (maintained publicly at
    usnistgov/ACVP and usnistgov/ACVP-Server on GitHub, and formalized in the
    IETF draft-celi-acvp-ml-dsa specification, none of which are on the
    nist.gov domain the harness records as blocked) and must reproduce
    expected outputs on a FIXED, PUBLISHED set of test vectors — typically,
    across other NIST signature algorithm ACVP profiles, a small number of
    test groups (one per parameter/hash/context combination) each containing
    on the order of 10-100 individual test cases, NOT millions. Each test
    case is one signing operation on one message under one key; only a
    non-conforming implementation whose omitted check ALSO happens to fire
    on that specific, tiny set of vectors would ever be caught by this
    mechanism, and per bb52fa's p_R and 031ce2's sigma the probability of
    that for any given vector is on the order of 1e-9 to 1e-11.

  novelty_status: unverified

  citations:
    - ref: IDEA-20260821-71fc18
      provenance: internal
      claim: >-
        Logged a web query (S4) specifically targeting ACVP ML-DSA sigVer
        test vectors and the Crucible conformance harness, but recorded
        "NEITHER PAGE WAS FETCHED — both are known to this session only
        through search-result summaries," and used this only for a
        qualitative "PARTIAL DOMINANCE" statement, not a quantitative one.
      verified_by: "idea-generator subagent, 2026-08-28, read the novelty_screen and \"PARTIAL DOMINANCE\" sections in full."
    - ref: IDEA-20260805-bb52fa
      provenance: internal
      claim: "p_R = 7.34e-9 per signature at ML-DSA-44 for the ct0 disjunct."
      verified_by: "idea-generator subagent, 2026-08-28, read in full."
    - ref: IDEA-20260805-031ce2
      provenance: internal
      claim: "sigma ~ 0.991 hint-correctness survival probability."
      verified_by: "idea-generator subagent, 2026-08-28, read lines 1-120."
    - ref: "usnistgov/ACVP-Server and usnistgov/ACVP (GitHub), gen-val/json-files"
      provenance: recalled
      claim: >-
        Public repository hosting ML-DSA ACVP capabilities registrations and
        sigGen/sigVer test-vector JSON files with published expected
        results; exact vector counts per parameter set NOT verified this
        session — this is precisely what the minimal_test retrieves.
      verified_by: null
    - ref: "draft-celi-acvp-ml-dsa (IETF Internet-Draft)"
      provenance: recalled
      claim: Specifies the ACVP test methodology for ML-DSA algorithm validation.
      verified_by: null
    - ref: "NIST CMVP validated modules list"
      provenance: recalled
      claim: >-
        Public listing of issued FIPS 140-3 module certificates, from which
        a count of ML-DSA-referencing certificates could be obtained; likely
        to be a nist.gov-domain source, which this program's ledger records
        elsewhere as blocked for the harness's own network path, so the
        executed experiment must locate a non-NIST mirror or third-party
        tracker, or explicitly report this sub-claim as unobtainable.
      verified_by: null

  assumptions:
    - "bb52fa's p_R and 031ce2's sigma are correct as stated; not re-derived here."
    - >-
      ACVP's ML-DSA sigGen/sigVer test vectors are generated independently
      of any actual non-conforming implementation's internal behavior (i.e.
      they are fixed, published vectors the IUT must reproduce, not an
      adaptive fuzzing process) — if ACVP instead performs large-scale
      randomized fuzz testing with a much larger vector count than typical
      NIST signature ACVP profiles, Claim 1's numeric conclusion would need
      revision (this is exactly what H1's validation checks).

  proof_search_map:
    not_applicable_reason: >-
      This is a literature-retrieval-plus-arithmetic measurement, not an
      exponent-moving proof about a hard problem or a new algorithm; it
      reuses bb52fa's and 031ce2's already-derived rate and survival
      probability without proposing a new derivation.

  predictions:
    - metric: "V_ACVP (total ML-DSA-44 sigGen test cases per vendor ACVP submission)"
      direction: lower
      minimum_effect: >-
        Predicted to be O(10) to O(1000), consistent with the order of
        magnitude typical of other NIST signature-algorithm ACVP profiles
        (RSA, ECDSA); a measured count above 1e6 would be a surprising
        result requiring revision of Claim 1's conclusion, not confirmation.
    - metric: "V_ACVP * p_R * (1 - sigma), the expected number of tier-0-observable anomalies per single ACVP submission"
      direction: lower
      minimum_effect: >-
        Predicted below 1e-6 (i.e. essentially zero); this is the headline
        number this proposal delivers that no prior record computes.

  minimal_test:
    design: >-
      (1) Retrieve the ACVP ML-DSA algorithm capabilities registration and
      at least one published sigGen test-vector JSON file (from the GitHub
      mirrors named in citations, not nist.gov) and count test groups and
      test cases for the ML-DSA-44 parameter set specifically. (2) Compute
      V_ACVP * p_R * (1 - sigma) using bb52fa's and 031ce2's already-derived
      constants, with no new signing runs required for this sub-claim. (3)
      AS A SEPARATE, LOWER-CONFIDENCE SUB-CLAIM: attempt to obtain a count of
      issued ML-DSA-referencing CMVP certificates from a non-NIST source
      (e.g. a third-party PQC-migration tracker or vendor press releases),
      and if unobtainable within the harness's network policy, report this
      sub-claim as an explicit budget/access outcome per AGENTS.md rule 5,
      not as a negative result.
    controls:
      - >-
        CROSS-CHECK AGAINST A DIFFERENT NIST SIGNATURE ALGORITHM'S ACVP
        PROFILE (e.g. ML-DSA's ACVP sibling for ECDSA or SLH-DSA) as a null
        comparator: if THOSE profiles also show O(10)-O(1000) vectors, that
        corroborates the H1 premise as a general property of ACVP
        methodology rather than an ML-DSA-specific artifact.
      - >-
        VERSION CHECK: ACVP capabilities registrations are versioned and
        can change; the retrieved vector count must be dated and matched to
        a specific ACVP spec revision, not treated as timeless.
    required_metrics:
      - "V_ACVP (exact count, with source and retrieval date)"
      - "V_ACVP * p_R * (1 - sigma)"
      - "CMVP certificate count (if obtainable) and the resulting aggregate estimate"

  falsification_conditions:
    - >-
      V_ACVP is found to be orders of magnitude larger than O(1000) (e.g. if
      ACVP performs large-N randomized robustness testing for ML-DSA
      specifically, unlike other signature algorithms) — this would falsify
      the H1 premise and require recomputing Claim 1 with the true count,
      potentially changing the conclusion.
    - >-
      The retrieved ACVP test vectors turn out to test ONLY sigVer (verifier
      conformance against crafted/malformed inputs, as 71fc18 already notes
      Crucible and ACVP sigVer vectors do) rather than sigGen (genuine
      signer behavior) — in that case this proposal's mechanism does not
      apply at all (a sigVer-only test can never observe a SIGNER's omitted
      check), and the honest deliverable is that ACVP's conformance gate is
      STRUCTURALLY, not just numerically, blind to this defect class.
    - >-
      No non-NIST source for CMVP certificate counts exists within the
      harness's reachable sources — Claim 2 (the aggregate,
      ecosystem-history sub-claim) is reported as unobtainable, and only
      Claim 1 (single-submission) stands.

  confounders:
    - >-
      ACVP vector counts and methodology may differ meaningfully between
      sigGen (signature generation conformance) and sigVer (signature
      verification conformance) test suites; conflating the two would
      misattribute a verifier-fuzzing result to a claim about signer
      behavior. This is exactly why the minimal_test separates them.
    - >-
      A vendor could theoretically run additional, non-mandatory internal
      regression testing far beyond the mandatory ACVP minimum; this
      proposal measures only the MANDATORY conformance gate, and must state
      that scope limit explicitly rather than implying no implementation is
      ever tested more than ACVP requires.
    - >-
      p_R and sigma are ML-DSA-44-specific and derived under bb52fa's and
      031ce2's own heuristic assumptions (uniform-residue boundary-crossing
      model); if those are later revised, this proposal's headline ratio
      must be recomputed, not treated as independently validated here.

  interpretation_limits: >-
    NOT A BREAK. This measures the STATISTICAL POWER of a testing process,
    not any property of MLWE, MSIS, or SelfTargetMSIS, and asserts nothing
    about whether any real vendor's implementation omits the check — only
    that IF one did, NIST's mandatory conformance gate as currently
    specified would not catch it. Applies only to the ct0 disjunct at
    ML-DSA-44 (dead code at -65/-87 per bb52fa). A finding that ACVP has
    "zero power" here is a statement about test-suite DESIGN, not a defect
    in FIPS 204's cryptography, and must not be phrased as a criticism of
    ML-DSA's security proof.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NIST's ACVP test-vector count for a given signature algorithm's
        sigGen conformance profile is drawn from a narrow, small
        engineering-determined range (O(10) to O(1000) total test cases per
        parameter set) that is consistent ACROSS different NIST signature
        algorithms' ACVP profiles, rather than being ML-DSA-specific or
        scaling with the algorithm's own rejection-rate structure.
      rigorous_support: >-
        No cryptographic bound applies; this is an empirical premise about a
        specific, published test-suite engineering choice, not a
        probabilistic heuristic imitating a classical distribution theorem —
        stated honestly as such rather than dressed up as one. The nearest
        analogue to a "classical theorem" this imitates is simply that a
        conformance test suite is designed for COVERAGE of code paths and
        edge cases at human-auditable scale, not for STATISTICAL POWER
        against a rare-event rate, which is a design-intent argument, not a
        proof.
      validation_plan: >-
        Directly count test cases in at least two other NIST ACVP signature
        profiles (e.g. ECDSA, SLH-DSA) in addition to ML-DSA, from the same
        GitHub source, and report whether the order of magnitude is
        consistent. No toy-scale ML-DSA simulation applies to this
        assumption — it is a property of the published test suite, not of
        the cryptographic scheme — so it is validated by direct
        enumeration, not statistical sampling.
    - id: H2
      statement: >-
        Each ACVP sigGen test case constitutes an independent Bernoulli
        trial with success probability p_R (1-sigma) for observing the
        tier-0-visible consequence of an omitted ct0 check, i.e. ACVP test
        vectors use independently generated keys/randomness rather than a
        small number of fixed keys reused across many test cases (which
        would reduce effective independent trials well below V_ACVP).
      rigorous_support: >-
        Inherits IDEA-20260821-71fc18's own i.i.d.-Bernoulli detection-rate
        formula (Part D), not re-derived here. The classical statement
        imitated is the same one 71fc18 already names: the standard
        rare-event Bernoulli sample-size argument.
      validation_plan: >-
        Direct inspection of the retrieved ACVP JSON test vectors: count the
        number of DISTINCT keys/seeds used across the sigGen test cases. If
        vectors reuse a small number of fixed keys, the effective
        independent-trial count is the number of DISTINCT keys, not the
        number of test cases, and Claim 1's conclusion (already near-zero)
        is only strengthened, not weakened, by this correction — a
        one-sided validation check with a known-direction fallback.

  target_complexity:
    time_exponent: >-
      NOT AN ATTACK. The resource axis is the FIXED, PUBLISHED test-vector
      count of a specific government conformance program, not an
      algorithm's runtime.
    memory_exponent: "O(1) — arithmetic on a retrieved count and two already-derived constants."
    best_known: >-
      No prior record in this corpus, including 71fc18 which explicitly
      searched for it, has retrieved and reported the actual ACVP vector
      count; this proposal's contribution is that retrieval plus the
      resulting ratio, not a complexity improvement over any algorithm.
    hidden_overhead: >-
      None; no asymptotic claim is made and there is no o(1) term to
      disclose.
    tradeoff_note: "Not applicable — no time-memory tradeoff or parallelization question."

  dominated_by: >-
    n/a (no attack or complexity result claimed). IDEA-20260821-71fc18 is
    the nearest record and explicitly leaves the ACVP retrieval undone; no
    row in this lane computes V_ACVP * p_R * (1 - sigma) or any equivalent
    ratio against a real conformance program.
  sota_delta: >-
    First quantitative ratio in this lane between a real, named,
    government-mandated conformance-testing volume and the corpus's own
    derived ct0-omission detection rate; the delta is the ratio itself,
    predicted nine-plus orders of magnitude below 1, pending retrieval.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
