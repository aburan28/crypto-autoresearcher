# IDEA-20261004-1f8492
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-1f8492
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-18 window table stores 131072 entries and a width-17 table stores 65536
  class: representation
  claim: >-
    A window of width 18 stores 131072 precomputed entries. A window of
    width 17 stores 65536. One hundred thirty-one thousand seventy-two
    exceeds sixty-five thousand five hundred thirty-six by 65536. The
    product of the two table sizes is 8589934592. Their sum is 196608.
    The gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    17 is 131072. Two to the power 16 is 65536. Two width-17 tables both
    store 65536, so that gap is 0 and their product is 4294967296. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 65536.
    baseline_embedding:
      parameter_slice: The widths 18 and 17 and the sizes 131072 and 65536.
      reproduction_check: >-
        Two readers must agree that 2 to the power 17 is 131072 and that
        2 to the power 16 is 65536.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 65536 drops the gap. Two width-17
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-17 table.
        predicted_gain: Sixty-five thousand five hundred thirty-six fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 131072 and 65536. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-17 tables. Both store 65536, and the gap is 0.
    proof_obligations:
      - claim: The width-18 table stores 131072 entries.
        responsibility: size
      - claim: The width-17 table stores 65536 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: One hundred thirty-one thousand seventy-two exceeds sixty-five thousand five hundred thirty-six by 65536.
  minimal_test:
    design: >-
      Compute 2 to the power 17 and 2 to the power 16. Do not add a
      curve point.
    controls:
      - Two width-17 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-18 table size is not 131072.
    - The product of the two sizes is not 8589934592.
  confounders:
    - A width-17 table of size 65536 is a different window from a width-16 table of size 32768.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 65536 and 32768.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-18 table has size 2 to the power 17, and the
        frozen width-17 table has size 2 to the power 16.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: One hundred thirty-one thousand seventy-two stored entries versus sixty-five thousand five hundred thirty-six, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-38be82
      - KR-RHO-cb1c58
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 131072 and 65536 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 131072 versus 65536
    data_queries: Two frozen widths.
