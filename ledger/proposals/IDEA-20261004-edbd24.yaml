  assumptions:
    - >-
      EndRing means: input a supersingular curve E over F_{p^2}, drawn from a
      distribution declared by the candidate, with exactly the candidate's
      public auxiliary information; output a basis or generators for End(E)
      up to the output equivalence declared by the reduction. Any restriction
      to F_p, orientation, level structure, or GRH use is a different named
      variant.
    - >-
      Decryption is deterministic after its coins and validation behavior are
      fixed, and the reachable secret-dependent call set is finite in each toy
      parameter cell.
    - >-
      Equality of quotient transcripts is representation-invariant: changes
      of torsion basis and conjugate order presentations are normalized before
      comparing witnesses.
    - >-
      SÉTA's TCSSI, SiGamal's P-CSSCDH/P-CSSDDH, and LIT-SiGamal's LIT-DDH
      remain distinct assumptions unless an explicit reduction is supplied.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Small-prime exhaustive witness collisions are informative about which
        API calls are semantically used, but not about asymptotic hardness.
      validation_route: >-
        Enumerate the full declared witness and valid-ciphertext spaces for at
        least three toy primes, repeat under all torsion-basis changes, and
        state the result only as interface factorization; a proof, not
        extrapolation, is required for general p.

  proof_search_map:
    bottleneck: >-
      Proving a reverse reduction from recovery of the lowest sufficient
      quotient to the candidate's exact EndRing distribution and output
      relation.
    baseline_embedding:
      parameter_slice: >-
        Instantiate the published SÉTA Algorithms 1 and 2 at toy coprime N,D
        and use its declared finite trapdoor as the baseline quotient.
      reproduction_check: >-
        Reproduce every valid encryption/decryption round trip and the same
        plaintext after replacing the trapdoor by an equivalent normalized
        torsion-action table.
    observation_collision:
      observable: >-
        The complete ordered transcript of secret-dependent decryption calls,
        final plaintext, and accept/reject bit.
      distinct_preimage_search: >-
        Enumerate non-equivalent order/orientation presentations and torsion
        bases; search for distinct full witnesses with the same normalized
        reachable transcript.
    constructive_transforms:
      - transform: witness_quotienting
        proposed_object: >-
          A machine-readable ladder from full EndRing output through
          orientation and rho_N to minimal decryption state.
        predicted_gain: >-
          Removes at least one unsupported implication if decryption factors
          below full EndRing; gives a precise target for a reverse reduction.
    quantifier_order: >-
      For each fixed candidate and parameter set, first quantify over every
      admissible secret witness, then every valid ciphertext, then compare
      normalized transcripts. No claim over arbitrary malformed ciphertexts
      is made unless validation is part of Dec.
    method_ceiling:
      strongest_certifiable_claim: >-
        Program factorization through Q_A and exhaustive toy collisions. This
        cannot certify hardness, IND security, or asymptotic equivalence.
      nearby_object_control: >-
        A toy SQIsign-shaped operation that asks for new connecting-ideal/KLPT
        work outside a fixed rho_N table must fail the claim that the same
        fixed quotient answers all secret operations.
    proof_obligations:
      - claim: Q_A equality implies identical decryption on valid ciphertexts
        responsibility: exact program-equivalence proof
      - claim: normalization preserves the action represented by each witness
        responsibility: algebraic correctness
      - claim: quotient recovery reduces to the stated EndRing variant
        responsibility: missing security reduction, candidate-specific
      - claim: toy enumeration covers every admissible witness and ciphertext
        responsibility: test completeness
    not_applicable_reason: null

  predictions:
    - metric: valid-ciphertext decryption disagreements after quotient substitution
      direction: equal
      minimum_effect: exactly 0 for a sufficient quotient; one disagreement refutes sufficiency
    - metric: normalized transcript collisions among distinct full witnesses
      direction: greater_than
      minimum_effect: at least 1 collision in the SÉTA-shaped positive-control cells
    - metric: unresolved reverse-reduction arrows in the witness ladder
      direction: lower_is_better
      minimum_effect: >-
        0 is required for an EndRing-equivalence claim; any positive count
        forces the weaker structured/quotient assumption to be named

  minimal_test:
    design: >-
      At three toy supersingular primes, instantiate a SÉTA-shaped trapdoor,
      enumerate admissible basis changes and every valid message/randomness
      pair, trace decryption, minimize the trace table, and replay decryption
      with only that table. Produce a four-column witness ladder listing input
      distribution, output relation, forward algorithm, and reverse algorithm
      for each arrow.
    controls:
      - kind: positive
        object: >-
          Published SÉTA-shaped decryption, which should replay from its
          declared finite degree/torsion-action trapdoor.
        expected: zero replay disagreements
      - kind: negative
        object: >-
          A toy secret operation that requests an ideal-equivalent isogeny for
          a fresh norm outside the fixed torsion transcript.
        expected: >-
          Fixed-table replay is undefined or disagrees, showing that the
          tracer does not label every EndRing use quotient-only.
    required_metrics:
      - witness counts before and after normalization
      - quotient-fiber sizes
      - valid ciphertext coverage
      - transcript and plaintext disagreement counts
      - proved, assumed, and missing status for every reduction arrow
    stop_condition: >-
      Stop after the complete toy tables and arrow audit exist; do not infer a
      break or a full-size hardness result from a collision.

  falsification_conditions:
    - >-
      Any two witnesses with equal claimed quotient but different decryption
      on a valid ciphertext falsify that quotient definition.
    - >-
      A verified polynomial reduction from the lowest sufficient quotient to
      the exact EndRing variant closes the dependency gap this proposal seeks.
    - >-
      Failure of the positive control to reproduce published correctness
      invalidates the harness before any structural reading.

  confounders:
    - Torsion-basis changes can create fake witness differences without normalization.
    - Malformed-ciphertext validation may query more secret structure than valid decryption.
    - A finite quotient can still be computationally equivalent to EndRing; factorization alone does not separate hardness.
    - Toy curves may have extra automorphisms and exceptional torsion unavailable at cryptographic sizes.

  interpretation_limits:
    - No PKE construction, attack, IND proof, or EndRing algorithm is claimed.
    - No result transfers from SÉTA's TCSSI or O-UIP to plain EndRing without a reduction.
    - The audit addresses necessity of the decryption witness, not leakage from public auxiliary data.

  target_complexity:
    time_exponent: >-
      No asymptotic attack exponent claimed; symbolic tracing is polynomial in
      the candidate program size and the toy exhaustive step is exponential
      only in deliberately bounded toy witness/ciphertext spaces.
    memory_exponent: no asymptotic improvement claimed
    data_queries: complete toy valid-ciphertext space
    best_known_comparison: >-
      The matched baselines are existing PKEs under TCSSI, P-CSSCDH/P-CSSDDH,
      and LIT-DDH. There is no established plain-EndRing-only PKE baseline in
      the reviewed sources, so zero performance or security improvement is
      claimed.
    hidden_overhead: canonicalization across bases and order presentations
    tradeoff: stronger auditability in exchange for no construction-level gain

  estimated_cost:
    implementation: low
    compute: low
    detail: one symbolic tracer plus exhaustive small-prime enumeration; no full-size cryptanalysis
  dependencies:
    - a toy implementation of the candidate decryption interface
    - exact EndRing input distribution, auxiliary information, and output equivalence
    - canonical torsion-action and order-presentation normalization
  recommended_priority: high

  dominated_by:
    verdict: not_applicable
    justification: >-
      This is an assumption audit, not a competing PKE or EndRing algorithm.
      SÉTA, SiGamal, and LIT-SiGamal dominate it as constructions; they do
      not answer its reverse-reduction question.
  sota_delta:
    time_exponent_change: 0
    memory_exponent_change: 0
    quantitative_audit_delta: >-
      Replaces one undifferentiated "EndRing trapdoor" assertion by a minimum
      four-node witness ladder and an integer count of unresolved reverse
      arrows; acceptance requires that count to be 0.
  honest_accounting:
    object: reachable secret-operation transcript Q_A(w)
    depth_of_verified_structure: finite decryption interface and toy exhaustive quotient fibers
    closures:
      - closure: finite-witness sufficiency
        mechanism: exact oracle-program substitution
    open_directions:
      - prove or refute quotient-to-EndRing reductions with the exact auxiliary information
      - extend the trace to malformed-ciphertext validation without conflating correctness and CCA security
