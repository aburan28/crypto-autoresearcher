  title: >-
    FINITE-WITNESS QUOTIENT AUDIT: determine whether a proposed EndRing
    decryption trapdoor actually uses the full order, an orientation, or only
    its action on a declared torsion module
  class: control

  claim: >-
    Fix a supersingular-PKE candidate with secret witness w, public key
    pk = Pub(w), ciphertext space C_pk, and deterministic decryption Dec_w.
    Fix the complete list A of secret-dependent operations made by Dec. Define
    Q_A(w) to be the table (or executable oracle) of the answers to precisely
    those operations on every input reachable from a valid ciphertext. Then
    Dec_w(c) = Dec_w'(c) for every valid c whenever Q_A(w) = Q_A(w'). This is a
    program-equivalence lemma, not a hardness claim. The proposal applies it
    to candidate EndRing PKEs by making an explicit witness ladder
    End(E) -> oriented/order generators -> torsion representation rho_N ->
    minimal decryption state and testing at which arrow decryption ceases to
    distinguish witnesses. A candidate has an auditable dependency on the
    full EndRing problem only if it additionally supplies a reduction from
    recovering the lowest sufficient quotient back to the precisely stated
    EndRing variant, or proves that the quotient is itself equivalent to that
    variant. Sufficient access to End(E) is not evidence of necessity.

  mechanism: >-
    Instrument decryption as a typed oracle program. Each secret-dependent
    call records its domain, codomain, and answer. For a SÉTA-shaped baseline,
    the declared trapdoor is (e,d,P,Q,theta(P),theta(Q)); the inversion
    algorithm consumes degree data and the action of theta on N-torsion, not a
    canonical serialization of the entire maximal order. The audit searches
    for pairs of admissible toy witnesses with different full order/orientation
    descriptions but identical reachable transcripts. It then replaces the
    secret by the quotient transcript and checks every valid toy ciphertext.
    Collision means only that this decryption interface factors through the
    quotient. It does not by itself make quotient recovery easy, solve
    EndRing, or break the scheme.

  why_not_a_renamed_known_approach: >-
    SÉTA constructs a torsion-attack trapdoor and separately observes that an
    oriented-isogeny solver can recover its trapdoor. This proposal does not
    reproduce SÉTA, FESTA, SiGamal, or LIT-SiGamal. It supplies a cross-scheme
    necessity audit that distinguishes full-ring knowledge from the finite
    representation actually queried by decryption, and requires the missing
    reverse reduction before the phrase "based on EndRing" is accepted.

  novelty_status: adaptation
  novelty_note: >-
    The finite trapdoor interface is explicit in SÉTA; typed transcript
    minimization is an adaptation for this RQ. No claim is made that the
    witness-ladder audit or its reverse reductions are absent from all
    literature.

