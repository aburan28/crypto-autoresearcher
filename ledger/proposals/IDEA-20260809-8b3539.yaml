idea:
  id: IDEA-20260809-8b3539
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CLGRP-66ab7f
  goal_id: GOAL-CLGRP-001
  title: >-
    Forge a delay proof in a group where the countermeasure is deliberately
    switched off, to show exactly which assumption the countermeasure is buying
  class: mechanism
  claim: >-
    Succinct proofs of sequential work in hidden-order groups rest on the adaptive
    root assumption, which fails when low-order elements are available. The claim
    is that in a reference implementation over a deliberately unprotected group,
    a valid-looking proof can be produced WITHOUT performing the sequential work —
    a literal certificate — and that switching the countermeasure on removes it,
    making the countermeasure's contribution demonstrable rather than cited.
  mechanism: >-
    With a known element of small order available, the prover can adjust its
    response by that element and satisfy the verification equation without the
    honest computation. The construction is direct once the low-order element is
    in hand from IDEA-20260809-83cbc7.
  why_not_a_renamed_known_approach: >-
    The dependence of these proofs on the adaptive root assumption is stated in
    their papers. Producing the artifact — a forged proof against an unprotected
    reference implementation, plus its disappearance under the countermeasure — is
    what converts a cited assumption into a demonstrated one, and it is the
    positive control the goal's structural table needs.
  predictions:
  - observable: forged proof accepted by the honest verifier in the unprotected group
    metric: boolean plus certificate
    predicted: Accepted. Rejection would mean the assumption's role is different from the stated one and requires investigation before anything is recorded.
  - observable: forgery attempt under the countermeasure
    metric: boolean within declared budget
    predicted: Fails, isolating the countermeasure as the load-bearing element.
  minimal_test: >-
    Reference implementation of the proof system over both group variants, forgery
    attempted in each with declared budgets, certificates emitted and verified by
    an independent verifier.
  controls:
  - 'HONEST-PROOF CONTROL in both variants before any forgery is attempted.'
  - 'BUDGET DECLARATION for the protected variant, since failure there is a budget statement rather than a proof of security (AGENTS.md rule 3).'
  falsification_conditions:
  - No forgery in the unprotected group.
  - Forgery succeeds under the countermeasure, which would be a major finding requiring independent re-verification and disclosure before publication.
  interpretation_limits: >-
    The certificate is against this program's reference implementation over a
    deliberately unprotected group, labelled as such in the record title. No
    deployed system is examined, named or characterized.
  sota_delta: 'No attack on any system. Delta: a demonstrated rather than cited dependence, and the positive control for the goal''s structural audit.'
  dominated_by: Downstream of IDEA-20260809-83cbc7; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute negligible.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for VDF / adaptive root: no records. WEB NOT CHECKED.'
  source_refs:
  - Succinct proof-of-sequential-work constructions -- RECALLED, REQUIRED READS.
