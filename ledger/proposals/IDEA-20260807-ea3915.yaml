idea:
  id: IDEA-20260807-ea3915
  question_id: RQ-MTGT-2cabee
  added: '2026-08-07'
  title: >-
    THE M-GROUP PREPROCESSING MODEL AND A PROVABLE BUT WORTHLESS SEPARATION:
    define advice-based DLP over M encoded groups of the same order, conjecture
    the generic bound S*T^2 = Omega~(eps*M*N) for M INDEPENDENT encodings, and
    exhibit an F_p-isogeny class achieving S*T^2 = N*(1+o(1)) for all M at once
    -- a factor-M separation whose entire non-generic content is the statement
    "these encodings are efficiently isomorphic", which is honest, precisely
    stateable, the first provable generic escape anywhere in GOAL-ENDO-001, and
    of exactly zero attack value against any deployed curve
  class: composition

  claim: >-
    (A) THE MODEL, WRITTEN DOWN BECAUSE THIS PROGRAM HAS NEVER WRITTEN IT DOWN.
    THE M-GROUP PREPROCESSING MODEL. An adversary is given M cyclic groups
    G_1, ..., G_M, each of prime order N, each with a distinguished generator
    P_i, presented by encodings sigma_i. In an unbounded OFFLINE phase it outputs
    an advice string a of length S bits depending on all M encodings. In the
    ONLINE phase it is given (i, Q) with Q in G_i and must output k with
    Q = [k]P_i, in T group operations, with success probability at least eps.
    Two instantiations differ only in how the encodings are drawn:
      GENERIC-INDEPENDENT: the sigma_i are M independent uniformly random
        injective encodings. This is the natural M-fold lift of the
        Corrigan-Gibbs--Kogan model (KN-LIT-013, KN-TECH-005).
      ISOGENY-CLASS: G_i = <P_i> subset E_i(F_p) for E_1..E_M in one ordinary
        F_p-isogeny class with prime subgroup order N, and the encodings are the
        actual point representations. Here the sigma_i are NOT independent: an
        explicit isogeny path converts between any two of them in polylog(p)
        field operations per point.

    (B) THE CONJECTURED GENERIC BOUND, WITH ITS QUANTIFIER ORDER STATED BECAUSE
    THAT IS EXACTLY WHERE THIS KIND OF CLAIM GOES WRONG.
      CONJECTURE C1. In GENERIC-INDEPENDENT, any adversary succeeding with
      probability at least eps for a UNIFORMLY RANDOM i AND a uniformly random Q
      satisfies S*T^2 = Omega~(eps*M*N).
      THE FAILURE MODE THAT MAKES THE QUANTIFIER LOAD-BEARING, RECORDED FIRST:
      an adversary that puts ALL its advice on G_1 and gives up on the rest
      succeeds with probability ~1/M using S*T^2 ~ N. That adversary satisfies
      S*T^2 = Omega~((1/M)*M*N) = Omega~(N), consistent with C1 at eps = 1/M --
      so C1 is not violated by it, and this is the check that C1 is stated
      correctly rather than being trivially false. The WRONG statement, NOT
      conjectured, is "for every i, success probability eps on G_i", which the
      same adversary refutes at once by ignoring the other groups: under that
      reading the bound would have to be per-group and the M would vanish.
      C1 IS A CONJECTURE OF THIS RECORD. It is not cited, it is not in the
      corpus, and the record's honest position is that it is either (i) already
      a corollary of published multi-instance work, (ii) provable by a
      straightforward extension of the compression/presampling argument
      underlying KN-LIT-013 and its Coretti-Dodis-Guo generalisation, or
      (iii) false. Determining which is the deliverable.

    (C) THE CONSTRUCTION, WHICH IS THE EASY HALF AND IS ESSENTIALLY ALREADY DONE.
      THEOREM (conditional on nothing beyond T1). In ISOGENY-CLASS, there is an
      adversary with S = N^{1/3} group elements of advice -- ONE Bernstein-Lange
      table on E_1 -- and online time T = 1.77*N^{1/3} group operations plus
      O(L*ell^3) field operations, succeeding with probability ~1 for EVERY i.
      Proof: pull (P_i, Q_i) back to E_1 along a precomputed path by the dual
      isogeny; by T1 the logarithm is unchanged; run the single-curve algorithm.
      This is IDEA-20260807-a127ab Mode B, restated in the model.
      HENCE S*T^2 = N*(1 + o(1)) FOR THE WHOLE FAMILY, INDEPENDENT OF M.
    (D) THE SEPARATION, AND ITS EXACT WORTH. If C1 holds, the two instantiations
    are separated by a factor of M in the advice-time product at eps = 1:
    Omega~(M*N) generic versus N*(1+o(1)) structured. The separating resource is
    R4, and its entire content is "the M encodings are efficiently
    inter-convertible". THIS IS A REAL SEPARATION AND A CHEAP ONE. It is worth
    recording for three reasons and no more:
      (i) It is, as far as this record can determine, THE FIRST PROVABLE ESCAPE
        FROM A GENERIC BOUND ANYWHERE IN GOAL-ENDO-001, in a campaign whose
        admissibility filter has otherwise closed every candidate at exponent
        1/2. A campaign that has closed everything benefits from knowing exactly
        what a non-closure looks like, even a worthless one.
      (ii) It makes the boundary of the filter precise: the filter closes uses of
        phi WITHIN one group; this separation lives entirely in the relation
        BETWEEN groups, and the model is what makes that distinction formal
        rather than rhetorical.
      (iii) It gives the M-curve accounting of IDEA-20260807-a127ab a lower-bound
        counterpart, so that record's "factor M" claim can be scored against
        something rather than asserted.
      IT IS WORTH NOTHING AS AN ATTACK. At M = 1 the separation is a factor 1.
      Deployed systems publish one curve per parameter set, and the audit
      IDEA-20260807-e41559 pre-registers the expectation that no two standardised
      prime-field curves are isogenous. The separation is a theorem about a model
      whose affected set is, on present evidence, empty.

    (E) WHAT WOULD MAKE IT INTERESTING, STATED SO THE NEXT SESSION DOES NOT HAVE
    TO GUESS. The separation becomes interesting if and only if some natural
    cryptographic setting supplies many efficiently-isomorphic groups with
    targets in more than one of them. Candidates worth checking, all [open]:
    multi-instance key-recovery across a protocol family that rotates curve
    parameters within a class; a setting where the adversary can INDUCE the
    isomorphism (invalid-curve or fault settings -- but those reach curves of
    different order, hence different classes, per IDEA-20260807-e41559 (D)(iii));
    or a non-ECDLP group family with a cheap isomorphism oracle, where the same
    theorem would apply verbatim with no isogeny anywhere. THAT LAST OBSERVATION
    IS THE RECORD'S MOST USEFUL FORWARD POINTER: nothing in section (C) uses
    elliptic curves. It uses only "the encodings are efficiently
    inter-convertible", so the separation is really about isomorphism oracles and
    the isogeny class is one instance of a more general and possibly more
    interesting phenomenon.

  resource_label: >-
    R8 primary (the model change: M instances instead of one, with advice charged
    across the family), R4 (the isogeny graph supplies the efficient
    inter-conversion that breaks encoding independence).

  admissibility: admissible

  admissibility_argument: >-
    This record exists precisely to make the admissibility question formal. The
    DECOMPOSITION.md section 2 filter closes a lane whose only use of phi is to
    apply it to points of G -- a SINGLE-GROUP criterion. Section (C)'s adversary
    applies phi-hat to points, so under a naive reading it would be closed; and
    indeed at M = 1 it IS closed, gaining exactly nothing (IDEA-20260807-a2fb45
    proves the single-instance closure). The escape appears only at M > 1 and
    consists entirely in the fact that a GENERIC adversary handed M independent
    encodings cannot manufacture the conversion between them, while the
    isogeny-class adversary is handed it. That is a resource the generic model
    demonstrably lacks -- which is what admissibility means -- and it is the R8
    row of the taxonomy ("multi-instance / preprocessing structure: changes the
    model, not the group") read literally. The record's honesty obligation, which
    it discharges in section (D), is that an admissible resource can still be
    worthless, and this one is.

  discriminated_from:
    - >-
      IDEA-20260807-a127ab -- the algorithm and its concrete cost. This record is
      the MODEL and the LOWER-BOUND side; a127ab's construction is imported
      wholesale as section (C) rather than re-derived, and the new content is
      C1, its quantifier audit, and the separation statement.
    - >-
      IDEA-20260807-a2fb45 -- the SINGLE-instance closure, which shows the
      frontier is class-invariant. The two records are complementary and their
      boundary is the number of instances: a2fb45 says M = 1 gains nothing,
      this says M > 1 gains a factor M in the family accounting. Neither
      contradicts the other and the pair is what makes the boundary precise.
    - >-
      KN-LIT-013 / KN-TECH-005 -- the single-group preprocessing bound
      S*T^2 = Omega~(eps*N), and its Coretti-Dodis-Guo bit-fixing generalisation
      as reported in KN-LIT-013. C1 is the M-fold lift of that statement and is
      NOT claimed to be in it; whether it already is is the first thing the
      minimal test checks.
    - >-
      KN-LIT-4091 -- the tight generic bound for the MULTIPLE discrete logarithm
      problem, Theta(sqrt(M*N)), which is about M TARGETS IN ONE GROUP and
      WITHOUT advice. C1 is about M GROUPS WITH advice. Different axis, and
      conflating them is the most likely way this record gets mis-scored.
    - >-
      KN-LIT-5040 ("Multiple Discrete Logarithm Problems with Auxiliary Inputs",
      present in knowledge/SOURCES.md, NOT READ) -- the nearest-sounding corpus
      entry. Its actual content is unknown to this record and is a Stage-0
      reading target, not a citation.

  object_first_candidate:
    tracked_object: >-
      THE ADVICE STRING a, tracked as the number of groups M grows. The question
      is whether |a| must grow with M.
    lossiness: >-
      Maximally lossy: every algorithm, every table structure and every curve
      collapses to a bit length. What is retained is exactly the quantity the
      generic bound constrains.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED, AND THE PASS IS THE WHOLE CLAIM.
      What |a| discards -- the advice's internal structure -- is discarded
      compatibly with the operation "add another group to the family", PROVIDED
      the new group is efficiently isomorphic to one already covered: the same
      string then serves it, so |a| does not change. That is a deterministic
      propagation rule (|a| is invariant under adding an isogenous group) and it
      is exactly what fails for an independently-encoded group, where |a| must
      grow. The object therefore separates the two instantiations by
      construction, which is why it and not "the table" is the right thing to
      track.
    survival_score: >-
      Survives arbitrarily many added isogenous groups with no growth. Dies
      immediately on adding a group of a different order (different N, different
      problem) or a group of the same order in a different class (no efficient
      conversion). The death condition is exactly the nearby-object control.

  mechanism: >-
    STEP 1 -- LITERATURE FIRST, BECAUSE C1 MAY ALREADY EXIST. Read KN-LIT-013's
    multi-instance discussion if it has one; read KN-LIT-5040; search for
    multi-instance / batch preprocessing lower bounds in the generic group model,
    including the Coretti-Dodis-Guo presampling line named in KN-LIT-013 and any
    time-space tradeoff work for related problems. A positive hit is the BEST
    outcome: it supplies C1 and turns this record into a two-line corollary,
    which is a cheaper and more citable result than proving C1 here.
    STEP 2 -- THE QUANTIFIER AUDIT, BEFORE ANY PROOF ATTEMPT. Write C1 in full
    with eps, i and Q all quantified explicitly. Check it against the two
    degenerate adversaries: (a) all advice on one group, (b) no advice, pure
    online. Both must be consistent with C1 or C1 is misstated. This audit costs
    nothing and is where this kind of claim usually dies.
    STEP 3 -- PROOF ATTEMPT BY COMPRESSION. Attempt C1 by the standard route: an
    adversary that succeeds too well with too little advice yields a compression
    of the M encodings below their entropy. The M-fold structure should make the
    counting straightforward IF the success requirement is averaged over i
    correctly. Record where the argument breaks if it does.
    STEP 4 -- THE CONSTRUCTION, RESTATED IN THE MODEL. Import
    IDEA-20260807-a127ab section (C) Mode B and state it as a theorem in the
    M-group model, with the path-precomputation charged to the offline phase and
    the two isogeny evaluations charged to T.
    STEP 5 -- THE SEPARATION STATEMENT, with both sides' hypotheses listed.
    STEP 6 -- THE NEARBY-OBJECT CONTROL, WHICH IS BLOCKING. Instantiate the model
    with M groups of the same order N drawn from DIFFERENT isogeny classes. The
    construction must FAIL (no conversion exists) and the advice must grow with
    M. If the construction appears to work there too, it is not using the isogeny
    structure and the separation is spurious.
    STEP 7 -- TOY VERIFICATION OF THE CONSTRUCTION ONLY. On an enumerable toy
    class, build one table on E_1, solve targets on every member, and confirm
    total advice is independent of M while per-target time is not. This verifies
    the construction; it cannot verify C1, which is a lower bound and is not
    testable by measurement.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Run 2026-08-07. Commands:
      (1) grep -rin "multi-group\|many groups\|M groups" ledger/ -> 9 hits, none relevant
      (2) grep -rn "Corrigan-Gibbs" . --glob '!research_digest/**' -> 20+ records, all single-group
      (3) grep -rin "presampling\|bit-fixing\|Coretti" . --glob '!research_digest/**'
      (4) grep -rin "Multiple Discrete Logarithm" knowledge/
      (5) read of KN-LIT-013 and KN-TECH-005 in full.
    results: >-
      (1) No record defines an M-group preprocessing model.
      (2) Every corpus use of Corrigan-Gibbs--Kogan is as a single-group frontier
      for one fixed curve.
      (3) The Coretti-Dodis-Guo generalisation is named in KN-LIT-013's "Key
      claims (as reported)" and has no corpus entry of its own; the paper was not
      read.
      (4) KN-LIT-4091 (tight generic multiple-DL lower bound, bulk-seeded,
      mis-parsed title) and KN-LIT-5040 (Multiple Discrete Logarithm Problems
      with Auxiliary Inputs, listed in SOURCES.md, NOT READ) are the two nearest
      entries; neither has been read for this record.
      NO EXTERNAL LITERATURE SEARCH FOR MULTI-INSTANCE PREPROCESSING LOWER BOUNDS
      WAS PERFORMED.
    verdict: >-
      UNVERIFIED, and deliberately so. The corpus contains nothing equivalent,
      but C1 is exactly the kind of statement that a multi-instance generic-group
      paper would contain as a warm-up lemma, and no external check was run. Per
      agents/idea-generator.md an unchecked literature position is recorded as
      `unverified` and never as novel. Step 1 is what converts this.

  null_object_control: >-
    MANDATORY AND BLOCKING: THE DIFFERENT-CLASS INSTANTIATION. M groups of the
    same prime order N on M curves in DIFFERENT F_p-isogeny classes, presented
    identically. The section (C) construction must FAIL there -- no path exists,
    the pullback is unavailable, and the advice must grow linearly in M. A
    construction that appears to succeed on non-isogenous curves is not using
    the resource it claims and the separation is void.
    SECOND NULL, FOR THE MODEL ITSELF: the M = 1 instantiation, where the
    separation factor must be exactly 1. A model in which the "separation"
    survives at M = 1 has an error in its accounting.
    DECAY PARAMETER: the fraction nu of the M groups that are genuinely in the
    class, the rest drawn from other classes. Total advice must interpolate as
    S_total ~ N^{1/3} * (1 + (1-nu)*M), i.e. it must GROW as nu falls. Advice
    that does not grow as nu falls means the measurement is not charging advice
    per group and the run set is void.

  assumptions:
    - >-
      C1 IS A CONJECTURE OF THIS RECORD. It is stated, quantified and audited
      here; it is not cited and must never be cited as established. Every use of
      the word "separation" in this record is conditional on C1.
    - >-
      The single-group bound S*T^2 = Omega~(eps*N) and its tightness are relayed
      from KN-LIT-013, whose own entry records "Full paper not read; the S*T^2
      bound, its tightness, and the CDG generalization are relayed from the
      ePrint abstract and secondary sources." Confidence: reported.
    - >-
      The Corrigan-Gibbs--Kogan offline phase is UNBOUNDED (recorded in
      EV-IC-002), so path precomputation is charged at zero in that model. Under
      a charged-offline convention (Bernstein-Lange) it costs M*p^{1/4+o(1)},
      dominated by the table build for M < p^{5/12}. Both conventions are
      reported and never mixed.
    - >-
      T1 and the construction of section (C) are elementary and are imported from
      IDEA-20260807-a127ab, where they are stated in full with their cost model.
    - >-
      Toy verification tests the CONSTRUCTION ONLY. A lower bound is not testable
      by measurement and no run in this record bears on C1.

  proof_search_map:
    bottleneck: >-
      C1 itself. The construction is two lines; the entire difficulty and the
      entire value are in whether an M-fold generic advice lower bound holds, and
      in whether it is already known. Everything else in this record is
      bookkeeping around that one question.
    baseline_embedding:
      parameter_slice: >-
        M = 1. C1 must specialise EXACTLY to the Corrigan-Gibbs--Kogan bound
        S*T^2 = Omega~(eps*N), and the construction must specialise exactly to
        single-curve Bernstein-Lange with separation factor 1.
      reproduction_check: >-
        Written check, zero compute: substitute M = 1 into C1's statement and
        into the separation and confirm both reduce to the known single-group
        facts with no residual term. A conjecture that does not reproduce the
        known case at M = 1 is misstated, and this is the cheapest possible
        falsification of it.
    observation_collision:
      observable: >-
        "Total advice independent of M."
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Advice independent of M is ALSO
        achieved by (i) an adversary that ignores M-1 of the groups and fails on
        them, and (ii) any setting where the M groups are literally the same
        group presented M times. Both produce the identical observable with no
        isogeny content. The disambiguators are the success-probability
        requirement (must be ~1 for EVERY i, not for one) and the different-class
        null (advice must grow). Reporting M-independent advice without both is
        prohibited by this record.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "M isogenous curves" by "M encodings of one group with an
          efficient conversion oracle". The isogeny disappears and the theorem
          survives, which shows what the theorem is actually about.
        predicted_gain: >-
          Generalises the separation beyond elliptic curves at zero cost, and
          identifies the real resource as an ISOMORPHISM ORACLE rather than an
          isogeny -- section (E)'s forward pointer and the most portable thing
          this record produces.
      - transform: stronger_invariant
        proposed_object: >-
          Track the advice LENGTH as a function of M rather than the achievable
          (S, T) point, so the statement is about a growth rate rather than about
          one operating point.
        predicted_gain: >-
          Makes the separation a factor-M statement rather than a point
          comparison, and makes the nearby-object control (advice must grow off
          the class) a direct measurement of the same quantity.
    quantifier_order: >-
      C1 AS INTENDED: FORALL M, FORALL adversaries A with advice length S and
      online time T, IF Pr_{i uniform in [M], Q uniform in G_i, coins}[A succeeds]
      >= eps THEN S*T^2 = Omega~(eps*M*N).
      NOT CLAIMED, AND FALSE AS SHOWN IN (B): FORALL i, Pr_Q[A succeeds on G_i]
      >= eps IMPLIES the same bound -- refuted by the all-advice-on-G_1
      adversary. The probability MUST be taken over i as well as over Q, and the
      audit obligation is to confirm that every use of C1 downstream respects
      that. The CONSTRUCTION, by contrast, achieves the STRONGER per-i guarantee
      (success ~1 for every i), which is what makes the separation meaningful
      rather than an artifact of averaging: the structured adversary wins under
      the harder quantifier while the generic bound is stated under the easier
      one.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Conditional on C1, advice-based DLP over M groups requires
        Omega~(M*N/T^2) bits when the encodings are independent, and N^{1/3} bits
        when they are one F_p-isogeny class." It can NEVER certify a speedup on
        any single instance, can never certify anything at M = 1, and cannot
        certify C1 by any measurement. If C1 turns out to be published, the
        ceiling drops to "this program noticed a corollary".
      nearby_object_control: >-
        M same-order groups in DIFFERENT classes. The construction must fail and
        advice must grow linearly in M. This is the control that distinguishes
        "the class did it" from "the accounting did it", and it is blocking.
    proof_obligations:
      - claim: C1 reproduces Corrigan-Gibbs--Kogan at M = 1.
        responsibility: baseline
      - claim: C1 is not refuted by the all-advice-on-one-group adversary.
        responsibility: soundness
      - claim: C1 is not already published (Step 1).
        responsibility: scope
      - claim: The construction achieves success ~1 for EVERY i, not on average.
        responsibility: correctness
      - claim: The construction fails on the different-class instantiation.
        responsibility: soundness
      - claim: Path precomputation is charged consistently under one declared convention.
        responsibility: runtime
      - claim: No downstream summary states the separation unconditionally on C1.
        responsibility: scope

  predictions:
    - metric: total advice bits as a function of M, isogeny-class instantiation
      direction: different
      minimum_effect: >-
        CONSTANT in M up to the O(L*log p) path descriptions, i.e. a fitted slope
        of advice against M indistinguishable from zero, at every tested toy
        class. A growing slope means the construction is not reusing the table
        and the whole record is wrong.
    - metric: total advice bits as a function of M, different-class null
      direction: higher
      minimum_effect: >-
        LINEAR in M with slope ~N^{1/3} bits per group. A flat slope here means
        the accounting is not charging per group and every number is void.
    - metric: per-target online time as a function of M, isogeny-class instantiation
      direction: different
      minimum_effect: >-
        CONSTANT in M at 1.77*N^{1/3} group operations plus the additive
        transport term. Growth in M would mean the shared table degrades with
        family size, which nothing predicts.
    - metric: the nu decay sweep of the null control
      direction: different
      minimum_effect: >-
        Advice must interpolate as N^{1/3}*(1 + (1-nu)*M). A flat response to nu
        voids the run set.
    - metric: outcome of the Step 1 literature check on C1
      direction: different
      minimum_effect: >-
        Reported as one of {already published (with citation), provable here
        (with proof), open, or false (with counterexample)}. All four are
        publishable outcomes for this record and "already published" is the
        cheapest and most useful of them.

  minimal_test:
    design: >-
      STAGE 0 (reading, HARD GATE AND THE WHOLE POINT): Step 1's literature
      check plus Step 2's quantifier audit. Both cost zero compute. If C1 is
      published, the record becomes a corollary and is worth more, not less. If
      the quantifier audit refutes C1 as stated, the record is superseded before
      any effort is spent on a proof.
      STAGE 1 (zero compute): Step 3's compression proof attempt, with the break
      point recorded if it fails.
      STAGE 2 (zero compute): Steps 4 and 5 -- the construction restated in the
      model and the separation statement with both hypotheses listed.
      STAGE 3 (minutes): Step 7's toy verification of the CONSTRUCTION only, on
      one enumerable class, plus Step 6's different-class null and the nu sweep.
      This is the only compute in the record and it tests the easy half.
    controls:
      - different-class instantiation (construction must fail, advice must grow)
      - M = 1 degeneracy (separation factor exactly 1)
      - nu decay sweep between the two instantiations
      - the two degenerate adversaries of Step 2 (all-advice-on-one; no-advice)
      - per-i success requirement enforced, not averaged
    required_metrics:
      - total advice bits and per-target online cost, per M, per instantiation
      - fitted slope of advice against M, with confidence interval, per arm
      - the written statement of C1 with all quantifiers
      - the Step 1 literature outcome with citations or an explicit "not found"
      - the Step 3 proof or its recorded break point
      - per-i success rates, not averaged

  falsification_conditions:
    - >-
      C1 is refuted by an adversary the quantifier audit finds. The record is
      superseded; the construction survives but the separation claim does not,
      and that is a materially weaker record which must be labelled as such.
    - >-
      C1 is found to be published. NOT a falsification -- the best outcome -- but
      it changes novelty_status and reduces the record to a corollary, which must
      be stated plainly rather than hidden.
    - >-
      The construction's advice grows with M in the isogeny-class arm.
      Implementation error or a misunderstanding of the model; halts the line.
    - >-
      The different-class null shows constant advice in M. The accounting is not
      charging advice per group and the separation is an artifact of the
      measurement.
    - >-
      The construction succeeds on the different-class null. It is not using the
      isogeny structure; the separation is spurious.
    - >-
      C1 is provable but with a bound weaker than Omega~(M*N/T^2) -- say
      Omega~(sqrt(M)*N/T^2). The separation factor shrinks accordingly and must
      be restated at the proven strength, never at the conjectured one.

  confounders:
    - >-
      AVERAGING VERSUS PER-INSTANCE SUCCESS. The single largest risk. The bound
      is naturally stated with probability over i; the construction naturally
      achieves per-i success. Comparing them requires care and the record's
      quantifier_order block exists for exactly this.
    - >-
      OFFLINE-COST CONVENTION. Corrigan-Gibbs--Kogan charge the offline phase at
      zero; Bernstein-Lange charge it. Mixing the two makes the separation look
      larger or smaller by up to N^{2/3}. One convention per figure, declared.
    - >-
      ADVICE ENCODING. Whether a table entry costs log p bits, 2 log p bits, or a
      truncated hash changes S by a constant and S*T^2 by the same constant. The
      encoding must be frozen before any figure and is the same object as OPEN-2
      in IDEA-20260807-a2fb45.
    - >-
      TOY CLASSES ARE SMALL. Enumerable toy classes have few prime-order members,
      so M is small and the slope of advice against M is estimated from few
      points. The M-dependence must be read from the CONSTRUCTION, not
      extrapolated from a toy fit.
    - >-
      MODEL DRIFT. "M groups of the same order" is not the same as "M targets in
      one group" (KN-LIT-4091's setting) nor "one group with M advice strings".
      Every downstream citation must name which model it means.

  reachability_gate: >-
    T5 INSTANTIATED, AND THE ANSWER IS THAT THE GATE IS PAID OFFLINE. The
    construction requires an explicit path from each E_i to the hub E_1 --
    SPECIFIED endpoints, hence vectorization, hence p^{1/4+o(1)} field operations
    per curve under heuristic H1 of IDEA-20260807-a127ab, with the concrete
    caveat recorded there that the per-step model decides the verdict at 256
    bits. In THIS model the gate is comfortable for a structural reason: the
    M-group model's offline phase is unbounded in the Corrigan-Gibbs--Kogan
    convention, so path-finding costs nothing at all; and under the charged
    Bernstein-Lange convention it costs M*p^{1/4+o(1)}, dominated by the single
    table build at 1.24*p^{2/3} whenever M < p^{5/12}. The gate therefore does
    not bind for any M in the range where the separation is interesting. Its one
    binding regime is an ADAPTIVE adversary who learns i online and has no
    precomputed path, where the p^{1/4+o(1)} must be charged to T and the
    separation's online exponent becomes max(1/3, 1/4) = 1/3 asymptotically but
    is concretely marginal at 256 bits.

  target_complexity:
    time_exponent: >-
      Online 1/3 in N, independent of M -- unchanged from single-curve
      Bernstein-Lange, which is the point: the separation is on the ADVICE axis,
      not the time axis, and this record does not claim a time improvement.
    memory_exponent: >-
      1/3 in N TOTAL for the family, against a conjectured generic requirement of
      log_N(M) + 1/3. THE SEPARATION IS ENTIRELY ON THIS AXIS and is a factor M.
      Peak online memory is N^{1/3} in both.
    best_known: >-
      Single group with advice: Bernstein-Lange at S = T = N^{1/3} on the
      Corrigan-Gibbs--Kogan frontier S*T^2 = Omega~(eps*N) (KN-LIT-013,
      KN-TECH-005). Single group without advice: parallel rho at 0.886*sqrt(N),
      O(1) memory (KN-TECH-001, KN-TECH-006), automorphism-discounted by at most
      sqrt(6) (KN-TECH-018); BSGS at sqrt(N) time and memory, N^{2/3+o(1)} full
      cost (KN-TECH-031, KN-TECH-035). M targets one group: Kuhn-Struik at
      sqrt(M*N) with a tight generic bound reported in KN-LIT-4091. M GROUPS WITH
      ADVICE: NO KNOWN RESULT IN THIS CORPUS, WHICH IS WHY THE MODEL IS WRITTEN
      DOWN HERE.
    hidden_overhead: >-
      Three, all disclosed. (1) The whole separation is conditional on C1, an
      unproven conjecture of this record. (2) The Corrigan-Gibbs--Kogan
      zero-cost-offline convention hides 1.24*N^{2/3} + M*p^{1/4+o(1)} of
      preprocessing, and any figure quoted in that convention must say so. (3)
      The advice encoding constant is unfixed and enters S*T^2 squared through T.
    tradeoff_note: >-
      No movement along the single-group S*T^2 curve at all: the construction
      sits on it exactly (S*T^2 = N*(1+o(1))). What changes is the number of
      groups that one point on that curve serves. Parallelization: the online
      phase is a walk against a shared read-mostly table, so under Wiener
      full-cost accounting (KN-TECH-035) the shared table is charged once as
      occupied hardware -- which is where the factor-M saving is physically
      realised and where it should be measured if it is ever measured at all.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES.
    - Parallel rho with distinguished points, 0.886*sqrt(N) time, O(1) memory
