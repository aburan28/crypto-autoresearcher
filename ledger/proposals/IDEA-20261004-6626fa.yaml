        digit counts of the integer 134217727.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The integer 134217727 is frozen before the bits are read.
    - No curve point is added.
  proof_search_map:
    bottleneck: The digit-count gap between 27 and 26.
    baseline_embedding:
      parameter_slice: The integer 134217727 and the counts 27, 26, and 26.
      reproduction_check: >-
        Two readers must agree that the bit length is 27, the
        doubling count is 26, and the addition count is 26.
    observation_collision:
      observable: The addition count and the product.
      distinct_preimage_search: >-
        Reporting the addition count as 26 on both readings drops
        their gap. Two readings make that gap 0.
    constructive_transforms:
