  title: |-
    Embedding degree over a Mersenne prime is a Cunningham-table fact - k(l) = ord_l(2) / gcd(ord_l(2), c)
  class: control
  claim: |-
    (a) over random prime-order curves over Mersenne p the distribution of k equals the Balasubramanian-Koblitz null except that k = 2 is absent; (b) the fraction of curve orders with a prime factor l with ord_l(2) <= 10^4 matches the density predicted from the factors of 2^d - 1, d <= 10^4; (c) for P-521 the lower bound k(l) > 10^6 holds by direct exponentiation (2^j != 1 mod l for j <= 521 * 10^6), and for P-192, P-224, P-256 ord_l(p) > 10^6 likewise; (d) the special pair for F_p^* at p = 2^521 - 1 beats a budgeted GNFS polyselect in Murphy-E by a large factor, as B4 (b) predicts for 2^255 - 19.
  mechanism: |-
    For p = 2^c - 1, p^k - 1 = 2^(ck) - 1, so a prime l of the curve order divides p^k - 1 iff ord_l(2) divides ck; the embedding degree is k(l) = ord_l(2) / gcd(ord_l(2), c). Consequences: k = 2 is impossible for odd l because p + 1 = 2^c; small k happens only when l divides 2^d - 1 for small d, i.e. l is a Cunningham-table factor; for c prime, k(l) is ord_l(2) or ord_l(2)/c. The multiplicative side is the mirror image: p + 1 = 2^c is fully smooth and F_p^* has a degree-5 SNFS polynomial at p = 2^521 - 1 (16 p = (2^105)^5 - 16). For generalized Mersenne p = 2^a - 2^b - 1, p + 1 = 2^b (2^(a-b) - 1), so k = 2 needs l dividing 2^(a-b) - 1. The curve side is therefore slightly MORE protected against pairing transfer than a random prime in exactly this sense, while F_p^* and F_(p^2)^* are more exposed.
