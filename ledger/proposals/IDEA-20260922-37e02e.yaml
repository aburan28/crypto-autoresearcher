idea:
  id: IDEA-20260922-37e02e
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE MULTIPLICATIVE CLOSURE OF THE FACTOR-BASE SUBSPACE IS A MEASURABLE
    PROPERTY THAT DIMENSION DOES NOT SEE, AND IT COLLAPSES THE DESCENDED
    SYSTEM'S QUADRATIC PART: for an F_2-subspace V of F_{2^m}, define
    kappa(V) = dim_F2 span(V . V). In the Weil-descended summation system every
    product of two factor-base unknowns contributes exactly kappa(V) Boolean
    quadratic forms, not l^2 monomials. For m prime, kappa(V) >= 2l - 1 with
    equality exactly for geometric-progression subspaces a.{1, g, ..., g^{l-1}}
    (linear Kneser / Vosper analogue, recalled), so Semaev's and Trimoska's
    V = {deg x < l} is the MOST multiplicatively closed V available at prime m
    and a size-matched random V has kappa = min(m, l(l+1)/2). Whether the
    solver sees kappa is the open question, and the two answers are named:
    E1 -- the WDSat exhaustive core c . 2^{tl} is V-blind; E2 -- conflicts and
    the fake first-fall degree track kappa. Every WDSat number the program
    holds was taken at kappa = 2l - 1 and has never been compared with any
    other kappa.
  class: mechanism

  claim: >-
    (A) LEMMA (exact, elementary). Let V have F_2-basis v_0..v_{l-1}, and let
    x = sum_j c_j v_j, x' = sum_k c'_k v_k with Boolean unknowns c, c'. Then
    x x' = sum_{j,k} c_j c'_k (v_j v_k) lies in span(V.V) tensor Quad(c, c'):
    choosing a basis w_1..w_kappa of span(V.V) and writing v_j v_k = sum_s
    M_{jk}^s w_s over F_2 gives x x' = sum_s Q_s(c, c') w_s with EXACTLY kappa
    quadratic forms Q_s = sum_{jk} M^s_{jk} c_j c'_k. After Weil descent along
    any F_2-basis of F_{2^m}, every descended equation's dependence on the
    pair (x, x') factors through these kappa forms. The same holds for
    (x x')^2 (squaring is F_2-linear on the w-coordinates) and for the
    trilinear term x x' x'' with the third factor a full-field unknown u
    (which contributes m . kappa forms) or a fixed constant (kappa forms).
    (B) FOR THE SUMMATION SYSTEMS. In S_3(u, x, x') the factor-base block
    contributes kappa(V) forms; in Trimoska's direct S_4(x_1, x_2, x_3, x_R) the
    coefficient space of ALL monomials is spanned by products of at most 12
    elements of V (degree 4 in each of three variables), so for a
    geometric-progression V with ratio g every field coefficient is a power
    g^e with 0 <= e <= 12(l-1) and the descended system is the image under one
    fixed F_2-linear map (evaluation of g^e in the field basis) of a
    FIELD-INDEPENDENT vector of at most 12l - 11 Boolean polynomials.
    (C) EXTREMALITY AT PRIME m (recalled theorems, to be verified). Linear
    Kneser (Hou-Leung-Xiang 2002; Bachoc-Serra-Zemor 2018): for
    F_{2^m}/F_2 with m prime and subspaces S, T with dim S + dim T <= m + 1,
    dim(S T) >= dim S + dim T - 1. Vosper analogue (Bachoc-Serra-Zemor
    2017): equality with 2 <= dim S, dim T and dim S + dim T <= m - 2 holds
    iff S = a.{1, g, .., g^{s-1}}, T = b.{1, g, .., g^{t-1}}. Hence at prime m,
    kappa(V) >= 2l - 1 with equality iff V is a geometric progression; the
    polynomial subspace {deg x < l} is one such (g = the field generator).
    A random l-dimensional V has kappa = min(m, l(l+1)/2) with probability
    1 - O(2^{-(m - l(l+1)/2)}).
    (D) THE DISCRIMINATING QUESTION. At fixed (m, l, t) and fixed instance
    bytes otherwise, does WDSat's conflict count, the Macaulay rank series, or
    the fake first-fall degree of KN-FIND-936151 differ between kappa = 2l - 1
    (geometric progression, any ratio) and kappa = min(m, l(l+1)/2) (random)?
    E1 predicts no; E2 predicts yes, monotone in kappa.

  mechanism: >-
    OBJECT FRAME. Representation: R1 -- x-coordinates in the F_2-coordinates of
    a chosen basis of V, with V itself the design variable. Operation set
    Sigma = MULTIPLICATION of field elements (the operation the summation
    polynomial applies to factor-base coordinates), together with translation
    by factor-base points for the relation vector as always. TRICHOTOMY:
    Class I, partial-action -- the relation vector is the tracked object and
    propagates under factor-base translation; kappa is a design invariant of
    the factor base, not a projection of the group. LOSSY-PROJECTION TEST
    against Sigma = multiplication: the projection V -> span(V.V) -> kappa
    discards every element and every basis, retains one integer, and is
    compatible with multiplication in the sense that kappa(aV) = kappa(V) for
    every nonzero a and kappa(V^{2^i}) = kappa(V) (Frobenius is a field
    automorphism); it is lossy (many V per kappa). Passes. KN-OPEN-020 CLASS:
    linear subspaces -- the scoped-out class -- and this record does not escape
    it; it asks which member of the class to use. REPRESENTATION CLASS AND
    STAGE: R1; RELATION DECOMPOSITION (the per-attempt solve), with a
    secondary exact effect on the Macaulay rank at degree 2.
    WHY THIS IS A MECHANISM AND NOT A RELABELLING. Dimension fixes the
    search-space size 2^{tl} and the yield; kappa fixes how many INDEPENDENT
    quadratic forms the descended system can contain per product of two
    factor-base unknowns. Two subspaces of equal dimension with kappa = 2l - 1
    and kappa = m give Boolean systems of identical variable and equation
    counts whose quadratic parts span spaces of different dimension -- a
    difference the Macaulay matrix at degree 2 sees exactly (its rank in the
    (c, c')-block is kappa) and a Groebner or SAT solver may or may not
    exploit. This is the structural reason Semaev's Table 1 and the program's
    fake-first-fall-degree phenomenon (KN-FIND-936151) were observed on the
    polynomial subspace: they were observed at the kappa-minimal V. Nothing in
    the corpus varies kappa at fixed l; GOAL-FROB-6333a9 varies Frobenius
    stability (a different property, orthogonal to kappa -- the trace-zero
    hyperplane has kappa = m), IDEA-20260915-3119c9 varies a trace condition
    on membership, and IDEA-20260915-0d8e90 measured c . 2^{ml} at kappa = 2l - 1
    only.
    THE TWO EXPLANATIONS, and what each outcome means. Under E1 the solver's
    cost is a function of (t, l) alone and the entire subspace-choice question
    for prime m collapses to "any V of the right dimension" -- which is a
    genuine, citable closure of RQ-CERTBIN-836ce2's V-question for WDSat, with
    kappa as the named quantity that failed to matter. Under E2 the
    kappa-minimal V is either the best (if the collapse helps propagation) or
    the WORST (if the collapse creates the fake first-fall plateau that misleads
    degree-based solvers) choice, and the direction is itself the finding.
    RATIO-BLINDNESS as the internal control: two geometric progressions with
    different ratios g, g' share kappa = 2l - 1; the scaling a.V is equivalent
    to changing b on the curve (the curve isomorphism x -> a x changes the
    constant term), so E2 predicts identical cost for GP(g) and GP(g') at equal
    kappa and a different cost for random V -- a three-way comparison with one
    predicted equality and one predicted inequality.

  novelty_status: unverified

  citations:
    - ref: "Hou, Leung, Xiang, 'A generalization of an addition theorem of Kneser', J. Number Theory 97 (2002) (recalled)"
      provenance: recalled
      claim: >-
        Recalled, NOT opened: linear analogue of Kneser's theorem for field
        extensions, dim(ST) >= dim S + dim T - dim(stabiliser); for a
        prime-degree extension the stabiliser is the base field, giving
        dim(V.V) >= 2 dim V - 1. Exact hypotheses (separability, size of the
        base field) must be checked by a reviewer.
      verified_by: null
    - ref: "Bachoc, Serra, Zemor, 'An analogue of Vosper's theorem for extension fields', Math. Proc. Cambridge Philos. Soc. (2017); 'Revisiting Kneser's theorem for field extensions', Combinatorica (2018) (recalled)"
      provenance: recalled
      claim: >-
        Recalled, NOT opened: equality dim(ST) = dim S + dim T - 1 in an
        extension with no proper intermediate field characterises S and T as
        geometric progressions with a common ratio, under dimension
        hypotheses; whether the base field F_2 is admitted or excluded by a
        size condition is exactly what the exhaustive check at m = 7, 11 tests.
      verified_by: null
    - ref: KN-FIND-936151
      provenance: internal
      claim: >-
        The fake-versus-true first-fall-degree boundary; d_F <= d'_F may not be
        cited as a theorem. This record cites no degree bound and uses the
        finding's INSTRUMENT (fake first-fall degree) as a metric only.
      verified_by: idea-generator, this session, record read in the earlier part of this session
    - ref: IDEA-20260915-0d8e90
      provenance: internal
      claim: >-
        c . 2^{3l} exhaustive core on Trimoska S_4 instances with V = {deg x < l};
        every measured cell is at kappa = 2l - 1.
      verified_by: idea-generator, this session, record read directly
    - ref: KN-LIT-fa346d
      provenance: internal
      claim: >-
        Semaev 2015's Table 1 and the choice V = {deg x < l} in a polynomial
        basis; audited in GOAL-SEMBIN-*. Cited for the choice of V only.
      verified_by: idea-generator, this session, note read in the earlier part of this session
    - ref: KN-LIT-036049
      provenance: internal
      claim: Trimoska's S_4 instance generator and benchmark set (V = {deg x < l}).
      verified_by: idea-generator, this session, note read in the earlier part of this session
    - ref: GOAL-FROB-6333a9
      provenance: internal
      claim: >-
        Frobenius-stable versus random V at n = 41 / 43 on WDSat conflict ratio
        (EXP-FROB-30006a, approved, no run). Orthogonal property to kappa.
      verified_by: idea-generator, this session, goal and specification read

  assumptions:
    - m prime (no proper subfield), so the Kneser/Vosper statements apply in their no-intermediate-field form; composite m is IDEA-20260922-684291's business.
    - t . l >= m - 2 so that the decomposition probability is at least ~1/(4 t!), the standard sizing; kappa comparisons are at FIXED (m, l, t).
    - WDSat compiled from the vendored source; the pure-Python builder gf2_chained_builder.py extended to accept an explicit basis of V and (for the direct S_4 arm) to emit Trimoska-format instances.
    - The machine (4 cores, ~6 GB) reaches t = 3, l <= 8 (2^{24} conflicts per UNSAT instance under E1).

  proof_search_map:
    bottleneck: >-
      Whether ANY property of V beyond dimension changes the per-attempt
      solve cost. kappa is the candidate property with an exact algebraic
      handle on the system (Lemma A) and a provable extremal structure at
      prime m (C).
    baseline_embedding:
      parameter_slice: >-
        V = {deg x < l} at Trimoska's (15,5), (17,6), (19,6): kappa = 2l - 1 =
        9, 11, 11, where IDEA-20260915-0d8e90's c is known. NOTE m = 15 is
        composite; the record's prime-m statements are made at 17, 19, 23 and
        (15,5) is kept only as the instrument-reproduction cell.
      reproduction_check: >-
        (i) Compute kappa exactly for each V used and confirm 2l - 1 for the
        polynomial subspace and min(m, l(l+1)/2) for random V. (ii) Reproduce
        c within 6 % on the shipped cells. (iii) Exhaustively enumerate all
        l-dimensional subspaces of F_{2^7} (l = 2, 3: 2667 and 11811
        subspaces) and of F_{2^{11}} (l = 2: 698027) and check kappa >= 2l - 1
        with equality iff geometric progression -- a direct finite test of
        (C) over F_2, where the recalled theorems' base-field hypotheses are
        least certain.
    observation_collision:
      observable: >-
        kappa(V), and the rank of the degree-2 Macaulay block in the
        factor-base coordinates.
      distinct_preimage_search: >-
        Different V with the same kappa: GP(g) versus GP(g') versus a.GP(g).
        E2 predicts equal cost across these (ratio-blindness); a cost that
        differs between GP(g) and GP(g') at equal kappa says the relevant
        property is finer than kappa (e.g. the multiplicative order of g or the
        Boolean degree profile of the evaluation map) and kappa is not the
        object. The three-way design detects this.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace "which V?" by the pair (l, kappa) and ask whether the cost is
          a function of l alone (E1) or of (l, kappa) (E2).
        predicted_gain: >-
          Either answer is a closure or a redirection of the V-question with a
          named quantity, rather than another null at one arbitrary V.
      - transform: observable_fiber
        proposed_object: >-
          The fibre of kappa: GP(g) for many g at fixed l, versus random V.
        predicted_gain: Detects whether kappa is the right invariant or merely correlated with one.
    quantifier_order: >-
      Lemma (A): FORALL V, FORALL bases: the number of independent quadratic
      forms per product block equals kappa(V) -- an equality. Extremality (C):
      FORALL V of dimension l at prime m: kappa(V) >= 2l - 1, with equality iff
      GP -- recalled, to be verified at m = 7, 11 exhaustively. The solver
      claim: EXISTS (m, l, t) in the tested range at which conflicts(GP) /
      conflicts(random) differs from 1 by more than the instrument noise (E2),
      or FORALL tested cells the ratio is 1 +- noise (E1). The record predicts
      NEITHER and registers both as informative.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At prime m in {17, 19, 23}, t = 3, l in {6, 7, 8}, WDSat conflicts and
        the fake first-fall degree are / are not a function of kappa(V) at
        fixed l, with the measured ratio R(kappa)." Nothing about Groebner
        engines the machine lacks, nothing about l > 8, nothing about
        decomposition probability (which Lemma A does not touch).
      nearby_object_control: >-
        PROVES-TOO-MUCH: run the kappa comparison on the shape-matched RANDOM
        Boolean system with a planted "kappa-collapsed" quadratic block (a
        random system whose quadratic part is forced to span only 2l - 1
        forms): if WDSat's cost tracks kappa THERE, the effect is about
        Boolean-system rank, not about the curve or the summation polynomial,
        and must be reported as such. NULL OBJECT: size-matched random V at
        every cell (kappa = min(m, l(l+1)/2)).
    proof_obligations:
      - claim: Lemma (A) -- exactly kappa(V) quadratic forms per factor-base product block.
        responsibility: correctness
      - claim: kappa(V) >= 2l - 1 at prime m, equality iff GP (verified exhaustively at m = 7, 11).
        responsibility: correctness
      - claim: kappa(random V) = min(m, l(l+1)/2) with high probability.
        responsibility: size
      - claim: kappa(aV) = kappa(V), kappa(V^2) = kappa(V).
        responsibility: correctness
      - claim: The degree-2 Macaulay block rank in factor-base coordinates equals kappa.
        responsibility: correctness
      - claim: E1 versus E2 decided by the three-way comparison at the tested cells.
        responsibility: scope

  predictions:
    - metric: kappa(V) computed exactly for V = {deg x < l}, GP(g) random g, random V, at m in {17, 19, 23}, l in {6, 7, 8}
      direction: different
      minimum_effect: >-
        2l - 1 for both GP families; min(m, l(l+1)/2) = m for random V at
        every listed cell (l(l+1)/2 >= 21 > m only fails at l = 6, m = 23 where
        21 < 23 -- that cell gives kappa = 21 and is kept as the intermediate
        point). Exact agreement or the lemma is misapplied.
    - metric: rank of the degree-2 Macaulay block in (c, c') coordinates
      direction: different
      minimum_effect: equals kappa exactly at every cell (Lemma A).
    - metric: WDSat conflicts on certified-UNSAT t = 3 instances, GP(g) versus random V, identical target and curve
      direction: different
      minimum_effect: >-
        E1: ratio in [0.8, 1.25] at every cell. E2: ratio outside [0.5, 2] at
        l = 8 and monotone in kappa across the l = 6, m = 23 intermediate cell.
        Registered as a two-sided test; neither outcome is preferred.
    - metric: fake first-fall degree (KN-FIND-936151 instrument) GP versus random V
      direction: different
      minimum_effect: >-
        E2 predicts the plateau appears at kappa = 2l - 1 and is absent or
        shifted at kappa = m; E1 predicts identical readings.
    - metric: conflicts GP(g) versus GP(g') at equal kappa (ratio-blindness control)
      direction: different
      minimum_effect: ratio in [0.8, 1.25] under both E1 and E2; a violation says kappa is not the invariant.

  minimal_test:
    design: >-
      (1) Exact prelude (this machine, minutes): compute kappa for every V
      family at every cell; exhaustive Kneser/Vosper check at m = 7 (l = 2, 3)
      and m = 11 (l = 2). (2) Build chained t = 3 systems (and, for the bridge,
      direct S_4 Trimoska-format instances) at m in {17, 19, 23}, l in
      {6, 7, 8}, Koblitz or random binary curve with a prime-order subgroup,
      20 certified-UNSAT targets per (cell, V-family), three V-families:
      GP(alpha) = {deg x < l}, GP(g) for 3 random g, random V for 3 draws.
      (3) WDSat conflicts per instance; Macaulay degree-2 block rank and the
      fake first-fall degree via the program's pure-Python instruments
      (src/ic_first_fall_fast.py, h012c_block_m4ri.py) where they fit in
      memory (l <= 7). (4) Ratios per cell with bootstrap intervals. Budget
      under E1: 2^{24} conflicts per instance at l = 8 -- seconds to minutes
      each; whole design < 1 day on 4 cores.
    controls:
      - size-matched random V (kappa = m) at every cell
      - ratio-blindness: GP(g) versus GP(g') at equal kappa
      - planted-rank random Boolean null object (quadratic block forced to 2l - 1 forms)
      - instrument reproduction on the shipped Trimoska cells
      - identity: exhaustive decomposition check certifies UNSAT independently of the solver at l <= 7
    required_metrics:
      - kappa(V) per instance (exact)
      - degree-2 Macaulay block rank (exact)
      - WDSat conflicts, wall time, RSS per instance
      - fake first-fall degree per instance where computable
      - ratios with intervals per cell

  falsification_conditions:
    - Exhaustive enumeration at m = 7 or 11 finds an l-dimensional V with kappa < 2l - 1, or with kappa = 2l - 1 that is not a geometric progression: statement (C) as recalled is false over F_2 and is withdrawn; Lemma (A) and the test survive with kappa measured rather than predicted.
    - The degree-2 Macaulay block rank differs from kappa at any cell: Lemma (A) is misapplied to this system; the record is withdrawn.
    - GP(g) versus GP(g') differ by more than 25 % at equal kappa: kappa is not the invariant; the record is superseded by one naming the finer property.
    - The planted-rank null object shows the same kappa-dependence as the curve instances: the effect is Boolean-rank generic and no statement about the ECDLP follows.

  confounders:
    - WDSat variable order interacts with the basis chosen for V; use the same order convention (V-coordinates first) in every arm and also the reverse.
    - At m = 23, l = 6, random V has kappa = 21 < m; treat as a third kappa level, not as noise.
    - Certifying UNSAT independently is possible only at l <= 7 by exhaustive enumeration in Python within minutes; at l = 8 rely on WDSat completeness and record it.
    - The scaling a.V changes the curve constant; keep b fixed and V unscaled across arms.

  interpretation_limits:
    - A result at m <= 23, l <= 8 is a result there; transfer to Certicom m >= 131 is an extrapolation on H1 and is labelled so.
    - E1 closes the V-question for WDSat on these formulations; it does not close it for Groebner engines, which this machine cannot run.
    - Lemma (A) says nothing about decomposition PROBABILITY; kappa is a solver-side property.
    - No attack exponent moves under either outcome; rho at 2^{m/2}/sqrt(m) on ECC2K and 2^{m/2} on ECC2 remains the frontier.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The E1/E2 verdict measured at (m, l, t) with m in {17, 19, 23}, l in
        {6, 7, 8}, t = 3 persists at larger (m, l) with the same t: the
        conflict ratio R(kappa) is a function of kappa/l and t, not of m.
      rigorous_support: >-
        Lemma (A) is exact at every m; the extremal structure (C) is exact at
        every prime m; what is heuristic is the solver's response, imitating
        the "random Boolean system of given rank profile" model.
      validation_plan: >-
        Measure R at the nine cells; fit against kappa/l; tail check: the
        cell-to-cell spread of R at fixed kappa/l must be within the bootstrap
        interval. Transfer to m = 131 is stated as extrapolation.
    - id: H2
      statement: >-
        A uniformly random l-dimensional V has kappa = min(m, l(l+1)/2)
        except with probability O(2^{-(m - l(l+1)/2)}) when l(l+1)/2 < m.
      rigorous_support: >-
        Counting argument: the l(l+1)/2 products v_j v_k of a random basis
        are close to uniform independent field elements; imitates the
        random-matrix rank distribution over F_2.
      validation_plan: 1000 random V per cell, empirical distribution of kappa, compared with the random-rank prediction.

  target_complexity:
    time_exponent: >-
      No exponent claim. Under E1 the per-attempt cost stays c . 2^{tl}
      (WDSat) for every V; under E2 it changes by a factor R(kappa) that is
      measured, not assumed, and is at most polynomial-in-l unless a
      sub-exhaustive regime appears.
    memory_exponent: unchanged (WDSat static; instance size polynomial in m).
    best_known: rho 2^{m/2}/sqrt(m) on ECC2K-m (2^{60.9} at ECC2K-130, KN-LIT-096), 2^{m/2} on ECC2-m.
    hidden_overhead: none claimed; R(kappa) is the measured quantity.
    tradeoff_note: not applicable; the design is a controlled comparison at fixed dimension.

  dominated_by: >-
    As an attack: n/a, none claimed. As a V-selection instrument: nothing in
    the corpus varies a multiplicative property of V at fixed dimension;
    GOAL-FROB-6333a9 (Frobenius stability) and IDEA-20260915-3119c9 (trace
    condition) vary orthogonal properties and neither dominates on this axis.
    IDEA-20260915-0d8e90 dominates on having measurements at all -- every one of
    them at kappa = 2l - 1 -- and this record is the control it lacks.
  sota_delta: >-
    Zero on ECDLP cost axes. Against the program's prior state: the
    subspace-choice question for prime m acquires a named, exactly computable,
    provably extremal property (kappa) with an exact handle on the descended
    system (Lemma A), and the standing WDSat law is shown to have been measured
    at the kappa-minimal V only. Against the literature: unverified; the
    Kneser/Vosper statements are recalled and the exhaustive F_2 check at
    m = 7, 11 is part of the test.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
