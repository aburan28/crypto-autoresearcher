idea:
  id: IDEA-20260805-c4ae3d
  question_id: RQ-SQISIGN-39f231
  added: '2026-08-05'
  title: >-
    The publication boundary is one field wide: SQIsign computes the exact
    SIDH-shape auxiliary datum at key generation, keeps it in the secret key,
    and has a torsion surplus of exactly e_chl bits -- so the Kani obstruction
    is a publication boundary, not a parameter margin
  class: mechanism

  claim: >-
    Reading the SQIsign v2.0.1 specification rather than the status-report
    sentence about it changes the shape of the question. SQIsign KeyGen
    (Algorithm 4.1, step 5) EVALUATES the secret isogeny phi_sk : E_0 -> E_pk on
    the deterministic public basis B_0 = (P_0, Q_0) of E_0[2^f], producing
    phi_sk(P_0) and phi_sk(Q_0) -- which is precisely the SIDH auxiliary datum,
    at the full available torsion order 2^f. Step 9 packages it as the
    change-of-basis matrix M_sk, and step 11 puts M_sk in the SECRET key while
    step 10 puts only (E_pk, hint_pk) in the public key. The claim of this
    proposal is that the SIDH/Kani template's missing ingredient can therefore
    be NAMED EXACTLY -- it is M_sk, one field of 4 x TORSION_2POWER_BYTES =
    128 / 192 / 252 bytes -- and, crucially, that NO OTHER INGREDIENT IS
    MISSING at SQIsign's own parameters. In particular the torsion is not short:
    the specification's own heuristic (Section 3.1.6.2) puts deg phi_sk =
    nrd(I_sk) at approximately sqrt(p), while the available torsion order is
    2^f, giving a SURPLUS of f - log2(sqrt(p)) bits, which by the
    specification's own parameter formulas equals e_chl EXACTLY: 122, 184 and
    247 bits at NIST-I, III and V. A second derived consequence, obtained here
    and not found in the specification: publishing M_sk would also hand over the
    degree for free, because the Weil pairing gives d * det(M_sk) mod 2^f as a
    publicly computable quantity, so the two ingredients are not independent and
    the obstruction collapses to one. The deliverable is a NAMED OBSTRUCTION
    with forward guidance and a null control with a PRE-DERIVED THRESHOLD, not a
    reassurance.

  object_first_candidate:
    tracked_object: >-
      THE PAIR (phi_sk(P_0), phi_sk(Q_0)), followed from the moment it is
      created to the moment it is either published or withheld. Its trajectory
      through the specification is exactly five steps and is fully explicit in
      Algorithm 4.1: (1) B_0 = (P_0, Q_0) is a deterministic public basis of
      E_0[2^f], fixed as a scheme parameter (Section 4.2.1, generated by
      TorsionBasis_0); (2) step 5, IdealToIsogeny(I_sk) returns E_pk together
      with phi_sk(P_0) and phi_sk(Q_0) -- the images exist, computed, in the
      clear, inside KeyGen; (3) step 8 computes the deterministic basis B_pk =
      (P_pk, Q_pk) of E_pk[2^f] and its hint; (4) step 9 computes M_sk with
      M_sk * (phi_sk(P_0), phi_sk(Q_0))^T = (P_pk, Q_pk)^T; (5) steps 10-11
      split: pk gets (E_pk, hint_pk), sk gets (E_pk, hint_pk, I_sk, M_sk). The
      tracked object crosses the publication boundary at step 10/11 and it does
      not cross. That single line is the whole answer to this goal's central
      question about internal-versus-published.
    established_families_off_limits: >-
      Off-limits as the primary lens: generic claw / meet-in-the-middle and
      Pollard-style search on the isogeny graph; the Deuring/KLPT algebraic
      route to End(E) (KN-TECH-028) -- which is GOAL-SSI-001's property and is
      excluded by this goal's non_duplication block; transcript-versus-simulation
      distinguishing and zero-knowledge distinguishers, which are
      GOAL-SQISIGN-001's property; lattice reduction; side channels; fault
      injection; hash-function attacks on the Fiat-Shamir transform. The
      Kani/higher-dimensional family (KN-TECH-026) is NOT off-limits, and that
      is deliberate and is the one move the off-limits rule does not forbid:
      this proposal does not invent a new attack in that family, it instantiates
      a NAMED EXTERNAL TEMPLATE against a specific published surface in order to
      locate the ingredient the surface withholds. That is the task
      RQ-SQISIGN-39f231 sets.
    newness_score: >-
      The individual facts are all in the specification and are not new to its
      authors. What this corpus does not hold, and what the scouting sweep found
      absent, is (a) the item-by-item internal-versus-published classification
      carried out against the actual document, (b) the observation that the
      torsion surplus available to a Kani embedding of phi_sk equals e_chl
      exactly by the scheme's own parameter formulas, (c) the Weil-pairing
      argument showing the degree ingredient is free once M_sk is published, and
      (d) the reframing that SQIsign VERIFICATION IS ITSELF A KANI COMPUTATION,
      so the template does not fail to apply -- it applies, on every valid
      signature, and returns something already public. (d) is the part that
      changes the question from applicability to information gain, and it is the
      part most at risk of being already known in the isogeny community; that
      risk is recorded, not discounted.
    testability_score: >-
      High and cheap for the derivation; expensive for the full null. The
      surplus identity, the publication classification and the pairing
      consequence are pen-and-paper and were performed in writing this record.
      The null control -- a weakened variant that publishes the ingredient and
      against which the audit must fire -- is designed here at two tiers, an
      ingredient-availability tier that costs minutes and an executed toy Kani
      tier that does not, and only the cheap tier is proposed for the first
      contract.
    survival_score: >-
      The tracked object survives the whole of KeyGen and dies at exactly one
      line. That is unusually clean and is why the obstruction can be named
      rather than asserted. Where the object dissolves is in the SIGNING
      transcript: there, torsion images ARE published (M_chl), but of a
      different map, and separating those two maps is the analytical work.

  mechanism: >-
    ALL SPECIFICATION FACTS BELOW ARE READ FROM THE PRIMARY SOURCE. "SQIsign
    Algorithm specifications and supporting documentation, Version 2.0.1", July
    7 2025, fetched 2026-08-06 from https://sqisign.org/spec/sqisign-20250707.pdf
    (HTTP 200, 1,087,080 bytes), text extracted with a pure-zlib stream
    extractor written for this session. Extraction damage is possible; figures
    are candidates to check and the check is a declared experiment stage.

    STEP 1 -- WHAT THE TEMPLATE NEEDS. KN-TECH-026, the corpus's own record of
    the Kani glue-and-split family, states the requirement: "Requires BOTH the
    isogeny degree AND its action on a known torsion basis; without the torsion
    images (CGL, CSIDH, SQIsign) the embedding cannot be built." The
    quantitative side -- that the torsion order N must exceed the degree d so
    that an auxiliary isogeny of degree N - d exists to complete the diamond --
    is RECALLED, UNVERIFIED here. Whether the dimension-4 and dimension-8
    variants (Robert) relax the N > d requirement or merely relax the balance
    and starting-curve conditions is EXACTLY THE POINT ON WHICH THIS PROPOSAL'S
    QUANTITATIVE HALF TURNS, and it is a checkable literature step, listed as
    stage 1 of the paired experiment. Nothing below asserts it.

    STEP 2 -- WHAT SQIsign PUBLISHES PER KEY. Section 4.6 and Appendix B: pk =
    (E_pk, hint_pk), PUBLICKEY_BYTES = 1 + EC_CURVE_ENCODED_BYTES = 65 / 97 /
    129 bytes. E_pk is a Montgomery coefficient A in F_{p^2}. hint_pk is ONE
    BYTE, a flag h_A plus a 7-bit integer h. THE HINT CARRIES NOTHING NEW, and
    this is a forced value rather than an estimate: Algorithm 2.1
    TorsionBasisToHint takes as input ONLY (A, e) and returns (h_A, h)
    deterministically -- h_A is the quadratic residuosity of A, and h is the
    least positive index at which a stated non-residuosity-and-on-curve
    condition holds, capped to 0 when it reaches 128. Algorithm 2.2
    TorsionBasisFromHint with h = 0 simply re-runs TorsionBasisToHint. Hence
    hint_pk = f(A_pk) for a public function f, and the conditional mutual
    information I(hint_pk ; phi_sk | E_pk) is EXACTLY ZERO. The per-key
    auxiliary channel is 8 bits wide and 0 bits free. NO POINT IMAGE, NO TORSION
    BASIS, AND NO DEGREE IS PUBLISHED PER KEY.

    STEP 3 -- WHAT SQIsign COMPUTES AND WITHHOLDS. Section 4.3, verbatim in
    substance: "using IdealToIsogeny, the corresponding secret isogeny phi_sk :
    E_0 -> E_pk is evaluated on the 2^f-torsion to obtain the points phi_sk(P_0)
    and phi_sk(Q_0)"; "To avoid recomputing phi_sk during SQIsign:Sign, the
    information (phi_sk(P_0), phi_sk(Q_0)) is stored in the secret key"; M_sk is
    the change-of-basis matrix with M_sk * (phi_sk(P_0); phi_sk(Q_0)) = (P_pk;
    Q_pk); "The matrix M_sk is part of the secret key sk." Section 4.3 also
    notes the secret key "includes some additional data (technically not
    necessary to recover End(E_pk)) that will be useful to generate signatures".
    THE SIDH AUXILIARY DATUM IS THEREFORE PRESENT, AT FULL ORDER 2^f, AND
    DELIBERATELY UNPUBLISHED. The corpus's own KN-TECH-028 sentence "SQIsign
    reveals NO torsion images" is CORRECT AS A STATEMENT ABOUT THE PUBLIC KEY
    and is INCOMPLETE AS A STATEMENT ABOUT THE DESIGN, and that distinction is
    exactly what RQ-SQISIGN-39f231 asks to be established item by item.

    STEP 4 -- THE SURPLUS IDENTITY (the forced value). Available torsion order:
    2^f, with f = 248 / 376 / 500 and p = c*2^f - 1 (Section 5.2: p_I = 5*2^248
    - 1, p_III = 65*2^376 - 1, p_V = 27*2^500 - 1). Degree of phi_sk: I_sk is
    sampled of prime norm D_mix and then replaced by RandomEquivalentPrimeIdeal,
    of which Section 3.1.6.2 states "Heuristically, we can expect the norm of the
    output ideal to be approximately sqrt(p) which should be much smaller than
    the norm of the input in SQIsign." So log2 deg phi_sk is approximately
    log2(sqrt(p)) = e_rsp up to rounding, with e_rsp = ceil(log2 sqrt(p)) = 126 /
    192 / 253 (Appendix B). Therefore
        SURPLUS := f - log2(deg phi_sk) ~ f - e_rsp = e_chl = 122 / 184 / 247,
    since Appendix B defines e_chl := f - e_rsp. THE TORSION AVAILABLE TO A KANI
    EMBEDDING OF phi_sk EXCEEDS ITS DEGREE BY EXACTLY THE CHALLENGE-SPACE
    EXPONENT, BY THE SCHEME'S OWN PARAMETER FORMULAS. This is a derived
    coincidence of definitions, not a numerical accident, and it is the single
    sharpest number this audit can produce: the obstruction is NOT that the
    torsion is too short. It is that the images are not published.

    STEP 5 -- THE DEGREE INGREDIENT IS FREE ONCE M_sk IS. Since nrd(I_sk) is an
    odd prime, phi_sk restricts to an isomorphism E_0[2^f] -> E_pk[2^f].
    Weil-pairing compatibility gives e(phi_sk(P_0), phi_sk(Q_0)) = e(P_0,Q_0)^d
    with d = deg phi_sk, and applying the change of basis,
        e(P_pk, Q_pk) = e(P_0, Q_0)^{d * det(M_sk)}  (mod 2^f in the exponent).
    Both pairings are computable by anyone from public data, because both bases
    are deterministic functions of public curves (Algorithms 2.1-2.3), and the
    discrete logarithm in mu_{2^f} is easy because the order is 2-power smooth.
    TWO CONSEQUENCES, both derived rather than assumed. (a) The public key
    already determines the single number w := d * det(M_sk) mod 2^f -- a 248-bit
    quantity at NIST-I, computable in O(f) work, that the specification's
    security analysis does not discuss in the material read. (b) Therefore a
    variant that published M_sk would immediately yield d = w * det(M_sk)^{-1}
    mod 2^f, and since d ~ sqrt(p) < 2^{e_rsp} <= 2^f the reduction mod 2^f is
    an equality, so d is recovered EXACTLY. The two ingredients the template
    needs are not independent: M_sk implies d. The obstruction is ONE field.

    STEP 6 -- IS (a) A LEAK? NO, AND THE AUDIT MUST SAY SO. w is one equation in
    two unknowns; det(M_sk) ranges over units of Z/2^f, so the fibre over an
    observed w has 2^{f-1} elements and w alone determines neither d nor
    det(M_sk). This is an OBSERVATION COLLISION CHECK THAT RETURNED NEGATIVE for
    the attacker, and it is recorded as such because a collision search that
    finds a collision is a falsifier and one that does not is a result about
    identifiability. It also has to be checked, not assumed: if the deterministic
    basis construction constrains det(M_sk) -- and Algorithm 2.1 DOES normalise,
    since it permutes to make R + S lie above (0,0) -- then the fibre shrinks. The
    normalisation as read constrains the basis modulo 2, not the determinant
    modulo 2^f, but that is a derivation to be checked and is a proof obligation
    on the paired hypothesis.

    STEP 7 -- THE REFRAMING. SQIsign verification, Algorithm 4.9 lines 24-26,
    checks isotropy of ((4P_chl, 4P_aux), (4Q_chl, 4Q_aux)) and then calls
    Isogeny22ChainWithTorsion to compute a (2,2)-isogeny chain whose codomain is
    F_1 x F_2 with F_1 isomorphic to the commitment curve E_com. THAT IS THE KANI
    GLUE-AND-SPLIT CONSTRUCTION, running on published data, inside the verifier,
    on every signature. So the honest answer to "does the SIDH/Kani template
    apply to SQIsign's published surface?" is not "no": it is "YES, IT ALREADY
    RUNS -- IT IS THE VERIFICATION ALGORITHM -- AND ITS OUTPUT IS A DETERMINISTIC
    FUNCTION OF THE SIGNATURE, HENCE CARRIES ZERO CONDITIONAL ENTROPY GIVEN THE
    SIGNATURE." The published torsion-image data that does exist, namely M_chl
    expressing (P_chl, Q_chl) in the deterministic basis of E_chl, describes the
    RESPONSE isogeny, which the verifier is required to reconstruct in full. The
    question is therefore not applicability but INFORMATION GAIN, and the
    obstruction is correctly stated as: the template can only be pointed at a map
    whose torsion images are published, and the only such map is one the verifier
    is entitled to know completely.

    STEP 8 -- THE RESIDUAL, STATED SO IT IS NOT MISTAKEN FOR A CLOSURE. Two maps
    remain whose torsion images are NOT published and which are NOT public:
    phi_sk (blocked by step 3, one field) and phi_com : E_0 -> E_com (the
    commitment isogeny, degree D_mix, whose recovery Section 10.2.2 states is
    equivalent to key recovery). For phi_com the published surface determines
    E_com only through the verifier's own Kani computation, and whether it
    determines phi_com's action on ANY torsion subgroup is NOT settled by
    anything in this record. That is the named residual and it is where a
    successor should look.

  novelty_status: unverified

  literature_context:
    - >-
      READ, PRIMARY, THIS SESSION, and the source of every specification fact
      above: SQIsign specification v2.0.1, July 7 2025,
      https://sqisign.org/spec/sqisign-20250707.pdf. SCOPE CORRECTION FOR THE
      COORDINATOR, recorded and not acted on: Section 1.3 of that document
      describes it as "the present round-2 SQIsign submission", while
      GOAL-SQISIGN-002 and RQ-SQISIGN-39f231 both presuppose a distinct ROUND-3
      specification. Whether such a document exists is UNVERIFIED. If it does
      not, the goal's object is this document and its pause_condition about
      unobtainable sources does not fire; if it does, every figure here must be
      re-checked against it.
    - >-
      IN-CORPUS. KN-TECH-026 (higher-dimensional Kani embedding attacks) and
      KN-OPEN-015 (what the SIDH break teaches about auxiliary structure). Both
      were written 2026-07-23 from secondary sources and both list SQIsign among
      the schemes that "reveal NO torsion images". This record does not
      contradict that for the public key and does refine it for the design.
      KN-OPEN-015's framing -- "the dividing line ... is now understood for the
      specific attack, but a general characterization of which auxiliary data is
      fatal is not settled" -- is exactly the question this proposal answers for
      one scheme.
    - >-
      NOT READ -- relayed claim. Robert's dimension-4/8 embedding is recorded in
      KN-TECH-026 as giving "provable polynomial time in all cases" because "the
      reducible structure ALWAYS exists". Whether that removes the requirement
      that the known torsion order exceed the isogeny degree is NOT established
      here and is the single most load-bearing unread fact in this record. If it
      does remove it, the surplus identity of step 4 becomes decorative and the
      obstruction is purely step 3. If it does not, the surplus identity is what
      makes step 3 the ONLY obstruction rather than one of two.
    - >-
      NOT READ -- relayed claim, adjacent prior art on the same object. The
      2026-08-05 scouting brief records ePrint 2026/1305 as claiming SQIsign is
      not SUF-CMA via a basis-change matrix negatable mod 2^N in the v2.0 spec.
      That concerns M_chl, the signature-side change-of-basis matrix. It is
      adjacent to, and independent of, this proposal's subject, which is M_sk on
      the key side. It must be fetched before any novelty claim about matrices in
      SQIsign is made.
    - >-
      ABSTRACT ONLY. "SQIsign2D-West: The Fast, the Small, and the Safer",
      ePrint 2024/760: the abstract page was fetched 2026-08-06 and the only
      sentence returned was "We introduce SQIsign2D-West, a variant of SQIsign
      using two-dimensional isogeny representations." It makes no statement about
      torsion images that this record can use, and none is attributed to it.
      RQ-SQISIGN-39f231's provenance block cites it for "IdealToIsogeny producing
      torsion images"; the SPECIFICATION independently states that, and the
      specification is what is cited here.

  lossy_projection_identifiability_audit:
    projection: >-
      Full key generation state (I_sk, phi_sk, phi_sk(P_0), phi_sk(Q_0), B_pk,
      M_sk, E_pk) --> the published pair (E_pk, hint_pk), i.e. a Montgomery
      coefficient plus eight bits.
    what_is_discarded: >-
      The secret ideal, the isogeny, both torsion images, the change-of-basis
      matrix, and the degree. Everything the Kani template consumes.
    why_genuinely_lossy: >-
      Extremely lossy, and quantifiably so: the fibre over an observed E_pk is
      the set of all isogenies E_0 -> E_pk, which Section 10.2.2 argues is
      near-uniform over the supersingular set because D_mix > 2^{4 lambda}. The
      eight hint bits do not shrink it at all, because Algorithm 2.1 makes them a
      function of E_pk.
    why_compatible_with_the_operations: >-
      The projection is compatible with the verifier's operations by
      construction, because the verifier is defined to operate on exactly the
      projected data: TorsionBasisFromHint reconstructs a full basis of E_pk[2^f]
      from (A, hint) alone (Algorithm 2.2), and everything downstream in
      Algorithm 4.9 is a function of that basis and the signature. The retained
      part therefore propagates deterministically -- which is what makes the
      surface a legitimate object of audit rather than a summary.
    is_it_only_a_change_of_coordinates: >-
      NO, and the failure mode explicitly checked for is the KN-LIT-7595 one --
      a projection that discards nothing because the discarded part is
      recoverable, as (Delta, Pi) = (x xor y, x*y) is in characteristic 2. THE
      CHECK RETURNED: not a change of coordinates, because the discarded data is
      recoverable only by solving the endomorphism ring problem, which the
      specification's Section 10.2.1 places at Otilde(p^{1/2}) classically. The
      MIRROR failure -- a projection so lossy it is constant across instances --
      was also checked and returns NEGATIVE FOR THE KEY AND POSITIVE FOR THE
      HINT, and the split is the useful part: E_pk varies across instances and
      carries the whole secret implicitly, whereas hint_pk is a deterministic
      function of E_pk and is therefore constant conditional on E_pk, i.e. has
      zero comparator spread in the only direction that matters. Recording that
      the hint is the constant component, with a derivation, is precisely the
      item-by-item classification RQ-SQISIGN-39f231 asks for.
    identifiability_note: >-
      The observation-collision search of step 6 was performed and returned NO
      usable collision-based falsifier: w = d * det(M_sk) mod 2^f has 2^{f-1}
      preimages. Reported because a negative identifiability result is a result.

  assumptions:
    - >-
      That deg phi_sk is approximately sqrt(p). Stated by Section 3.1.6.2 as a
      HEURISTIC in the specification's own words, not proved there, and carried
      here as HEUR-SQ-1 with its own falsification condition. If the realised
      norms are much larger the surplus identity weakens; if much smaller it
      strengthens. This is directly measurable from KAT secret keys, since I_sk
      is encoded in sk with its norm in the clear (Section 4.6).
    - >-
      That the Kani template requires known torsion of order exceeding the
      degree. RECALLED, UNVERIFIED; see literature_context. The whole
      quantitative half of the proposal is conditional on it and says so.
    - >-
      That "published" means transmitted, per Section 4.6. An implementation
      that leaks M_sk through a channel other than the wire is a side-channel
      question and is out of scope for this goal by construction.
    - >-
      That the deterministic basis normalisation in Algorithm 2.1 does not
      constrain det(M_sk) modulo any power of 2 above 2. Derived, not assumed,
      but the derivation is short and is a stated proof obligation.

  predictions:
    - metric: >-
        published_torsion_images_of_the_secret_isogeny: the number of point
        images of phi_sk, at any order, appearing anywhere in pk or in any
        signature, per the Section 4.6 encoding
      direction: different
      minimum_effect: >-
        EXACTLY 0, derived before any run from Section 4.6 and Algorithm 4.1.
        Any value above 0 falsifies this record's central classification and
        would be the most consequential outcome available in this goal.
    - metric: >-
        conditional_hint_entropy: bits of hint_pk not determined by E_pk,
        measured as the fraction of KAT public keys whose hint byte differs from
        TorsionBasisToHint(A_pk, f) recomputed from the curve alone
      direction: lower
      minimum_effect: >-
        EXACTLY 0 mismatches out of all KAT keys tested, i.e. 100 percent
        agreement, derived from Algorithm 2.1 taking only (A, e) as input. A
        single mismatch means the hint is not a function of the curve, the 8-bit
        channel is not empty, and the per-key auxiliary surface must be
        re-examined. This control can genuinely fail.
    - metric: >-
        torsion_surplus_bits = f - ceil(log2 nrd(I_sk)), measured over KAT
        secret keys at each security level
      direction: different
      minimum_effect: >-
        PREDICTED e_chl = 122 (NIST-I), 184 (NIST-III), 247 (NIST-V), plus or
        minus 3 bits, derived from Section 3.1.6.2's sqrt(p) heuristic and
        Appendix B's e_chl = f - e_rsp. A measured surplus below 0 would mean the
        torsion is insufficient and the obstruction is parametric after all -- the
        opposite of this record's claim, and a clean falsification.
    - metric: >-
        pairing_relation_check: whether e(P_pk,Q_pk) equals e(P_0,Q_0)^{d *
        det(M_sk)} on KAT keys, with d and M_sk taken from sk
      direction: different
      minimum_effect: >-
        EXACT equality on 100 percent of tested keys. This is a derived identity;
        a single failure means the Weil-pairing argument of step 5 is wrong, the
        "degree is free" consequence collapses, and the null control must supply
        the degree separately.
    - metric: >-
        missing_ingredient_count: the number of distinct data items the audit
        must add to the real published surface before its ingredient checker
        reports the Kani template instantiable
      direction: different
      minimum_effect: >-
        EXACTLY 1 (namely M_sk, or equivalently the pair of point images it
        encodes). A count of 2 means the degree is not recoverable from M_sk and
        step 5 is wrong; a count of 0 means the template is instantiable against
        the real surface, which would be a break claim and is automatically
        routed to review-breakthrough at max under AGENTS.md rule 12.

  minimal_test:
    design: >-
      Five stages, cheapest first, and the cheapest three can each terminate the
      line. STAGE 0 (hours, zero compute): settle whether a Round-3 SQIsign
      specification distinct from v2.0.1 exists, file the document actually
      audited as a KN-LIT entry with its SHA-256 and its extraction method, and
      read the primary Kani sources to settle whether the N > d condition
      persists in dimensions 4 and 8. STAGE 1 (hours, zero compute): write the
      item-by-item published/internal classification from Section 4.6, Algorithm
      4.1 and Algorithm 4.9, with each item marked required-by-verification or
      merely-present, sealed by the byte-budget certificate of
      IDEA-20260805-244f78. STAGE 2 (minutes, integer arithmetic): evaluate the
      surplus identity and the pairing relation symbolically, and check them
      numerically against KAT keys if the KAT files are obtainable. STAGE 3
      (hours): build the INGREDIENT-AVAILABILITY CHECKER -- a procedure that,
      given a described published surface, returns the subset of {domain curve,
      codomain curve, torsion basis of stated order, images of that basis, exact
      degree} that the surface determines -- and run it on the control battery
      below. STAGE 4 (NOT PROPOSED FOR THE FIRST CONTRACT, and named so the
      deferral is explicit rather than silent): an executed toy-prime Kani
      instantiation against SQIsign-LEAK, which is where a fired null becomes a
      demonstrated one rather than an argued one.
    controls:
      - >-
        POSITIVE CONTROL / NEARBY OBJECT WHERE THE EFFECT MUST APPEAR: SIDH/SIKE
        itself. Its published surface is (E_A, phi_A(P_B), phi_A(Q_B)) with both
        degrees public. The ingredient checker MUST return the complete
        ingredient set on it. If it does not, the checker is broken and NO
        NEGATIVE RESULT ABOUT SQIsign MAY BE REPORTED AT ALL. This is the
        instrument's sensitivity demonstration and its threshold is declared
        before the run: 5 of 5 ingredients.
      - >-
        NULL OBJECT OF THE SAME SHAPE, WITH A FORCED VALUE DERIVED BEFORE THE
        RUN AND ABLE TO FAIL: SQIsign-LEAK(k), a deliberately weakened variant
        whose public key is (E_pk, hint_pk, M_sk mod 2^k). Forced values, derived
        here: the checker must return the full ingredient set for k > e_rsp
        (because the surplus identity says 2^k then exceeds deg phi_sk, and step
        5 says d follows from M_sk by pairing), and must NOT return it for k <=
        log2(deg phi_sk). THE THRESHOLD IS PRE-DERIVED AT k = ceil(log2
        nrd(I_sk)) ~ e_rsp = 126 / 192 / 253. A checker that fires at every k, or
        at no k, is not measuring the ingredient.
      - >-
        GRADED CONTROL, FOUR INTERIOR POINTS, MONOTONICITY REPORTED: k in {f/4,
        f/2, 3f/4, f} = {62, 124, 186, 248} at NIST-I. Report the fired/not-fired
        verdict at each and confirm monotonicity in k with the single transition
        bracketing the pre-derived threshold e_rsp = 126. A non-monotone result
        localises a defect in the checker; a transition far from 126 localises a
        defect in the surplus derivation. Either localisation is more useful than
        a bare pass.
      - >-
        ADVERSARIAL DISGUISED-LEAK CELL, WHICH IS THE REAL NULL-SUFFICIENCY TEST:
        a variant that supplies the ingredient in an unfamiliar encoding -- x-only
        coordinates of phi_sk(P_0), phi_sk(Q_0) plus their difference point,
        rather than a matrix. The ingredient is fully present (x-only with a
        difference point pins signs up to a global sign, which the template
        tolerates) but the syntactic shape is different. IF THE CHECKER MISSES
        THIS CELL IT IS A PATTERN MATCHER, NOT AN INGREDIENT DETECTOR, and its
        negative on real SQIsign is worthless.
      - >-
        MATCHED NEGATIVE CONTROL WHERE THE CONCLUSION MUST HOLD: CSIDH and the
        group-action constructions, which the frozen Wesolowski text names on its
        explicitly-safe list against the affected list containing SQIsign. The
        checker must return "not instantiable" there for a DIFFERENT reason than
        it does for SQIsign, and must name the reason. A checker that returns the
        same verdict with the same reason for two structurally different schemes
        has not identified the load-bearing feature.
      - >-
        ORDERING CONTROL: the ingredient checker's rules are frozen and committed
        BEFORE it is run on real SQIsign, and it is run on the positive control
        and the disguised cell FIRST. The verdict on real SQIsign is read last.
    required_metrics:
      - the item-by-item published/internal/required/merely-present classification table, with a specification section or algorithm line for every row
      - the measured torsion surplus per level, against the predicted e_chl
      - the KAT hint-recomputation mismatch count
      - the ingredient checker's verdict and named reason on each of the six control cells, in the frozen order
      - the k at which SQIsign-LEAK(k) transitions, against the pre-derived e_rsp
      - a verbatim statement of the N > d requirement as found in the primary Kani sources, or a record that it could not be obtained

  falsification_conditions:
    - >-
      Any point image of phi_sk, at any order, is found in the published surface.
      The central classification is then wrong.
    - >-
      The measured torsion surplus is negative at any level, i.e. deg phi_sk
      exceeds 2^f. The obstruction is then parametric as well as publication-
      based, this record's headline is wrong, and the correct statement is
      strictly weaker.
    - >-
      The Weil-pairing identity fails on KAT keys. Step 5 collapses, the degree
      becomes a second independent missing ingredient, and the null control must
      be redesigned as a two-factor design.
    - >-
      The primary Kani sources show that dimension-8 embedding needs no torsion
      surplus. Step 4 becomes decorative; step 3 must then carry the entire
      obstruction alone, and the record must be rewritten to say so.
    - >-
      The ingredient checker fires on real SQIsign's published surface. That is a
      break-shaped claim, triggers AGENTS.md rule 12 review-breakthrough at max,
      and nothing else in this record matters.
    - >-
      The positive control fails, or the disguised-leak cell is missed. NO
      NEGATIVE MAY BE REPORTED; the instrument is not admitted.

  confounders:
    - >-
      SECOND-HAND TEMPLATE. The Kani requirement is taken from an in-corpus
      technique record written from secondary sources, not from Castryck-Decru,
      Maino-Martindale or Robert. Stage 0 exists to remove this and the proposal
      must not proceed past it on the paraphrase.
    - >-
      VERSION DRIFT. v2.0.1 self-describes as round-2. A round-3 document, if it
      exists, may have moved the object. This is also the observation
      GOAL-SQISIGN-002's non_duplication block records for GOAL-SQISIGN-001 and
      it is NOT resolved here.
    - >-
      EXTRACTION DAMAGE. Every specification figure was obtained from a
      hand-written zlib stream extractor because the container has no working PDF
      tooling. Numbers in tables are the most fragile part.
    - >-
      ARGUMENT ASYMMETRY. Concluding that a scheme resists an attack is cheap to
      produce and reads as rigour, and it is what the community already believes.
      The control battery is designed so that the negative costs something to
      reach: it cannot be reported at all unless the checker has been shown to
      fire on SIDH and on the disguised cell.
    - >-
      DEFINITIONAL DRIFT ON "AUXILIARY TORSION INFORMATION". The status-report
      sentence, KN-TECH-028's "reveals no torsion images", and Section 4.6's
      encoding are three different statements. M_chl IS torsion-image data by
      any reasonable reading; it is of a public map. Conflating the three is the
      easiest way to reach a wrong conclusion in either direction, and the
      classification table exists to prevent it.

  interpretation_limits:
    - >-
      NOTHING HERE IS A SECURITY CLAIM ABOUT SQIsign, in either direction. A
      named obstruction says a specific template lacks a specific ingredient on a
      specific surface. It does not say the scheme is safe, and the phrase
      "SQIsign is safe from SIDH-style attacks" is forbidden by
      RQ-SQISIGN-39f231's claim_tier_ceiling and is not licensed by any outcome
      here.
    - >-
      CLAIM TIER: the classification and the surplus identity are DOCUMENTARY and
      DERIVATIONAL. Any attack behaviour, including any firing of the null
      control at toy primes, is TOY TIER WITHOUT EXCEPTION and says nothing
      directly about NIST-I/III/V parameters.
    - >-
      SCOPE OF THE NEGATIVE, per AGENTS.md rule 6: it closes exactly the Kani
      glue-and-split template as stated in KN-TECH-026, against the v2.0.1
      published surface, at the three declared parameter sets. It closes no other
      template, no other version, and no other surface.
    - >-
      THE RESIDUAL IS NAMED AND IS NOT CLOSED: phi_com. Whether the published
      surface determines the commitment isogeny's action on any torsion is not
      settled here, and Section 10.2.2 states that recovering phi_com yields an
      equivalent secret key. That is the forward guidance and a successor should
      consume it.
    - >-
      NO STATUS CHANGE to KN-TECH-026, KN-TECH-028 or KN-OPEN-015 is proposed or
      implied. Those are Coordinator decisions.

  heuristic_assumptions:
    - id: HEUR-SQ-1
      statement: >-
        FOR ALL security levels and FOR ALL honestly generated keys, log2 of
        nrd(I_sk) after RandomEquivalentPrimeIdeal lies within a small additive
        band of log2(sqrt(p)); formally, |log2 nrd(I_sk) - log2(p)/2| <= 3.
      rigorous_support: >-
        Stated as a heuristic by the specification itself (Section 3.1.6.2:
        "Heuristically, we can expect the norm of the output ideal to be
        approximately sqrt(p)"). The underlying reason is the standard one for
        reduced bases of rank-4 lattices of covolume approximately p^2 in a
        quaternion order, giving shortest-vector norms of order sqrt(p); NO
        RIGOROUS BOUND IS ASSERTED HERE and none is cited, because none was read.
      validation_plan: >-
        Direct measurement from KAT secret keys, in which nrd(I_sk) is encoded in
        the clear per Section 4.6. This is a distributional check over the KAT
        sample size and is reported as such, never as a proof.
    - id: HEUR-SQ-2
      statement: >-
        THIS ONE IS NOT A HEURISTIC AND IS RECORDED HERE TO SAY SO. hint_pk =
        TorsionBasisToHint(A_pk, f).(h_A, h) is an identity, not a distributional
        claim, because Algorithm 2.1's inputs are exactly (A, e). The conditional
        mutual information I(hint_pk ; phi_sk | E_pk) = 0 follows deterministically.
      rigorous_support: >-
        A deterministic function of a conditioned variable carries no information
        beyond it. Elementary.
      validation_plan: >-
        Recompute the hint from every KAT public key's curve coefficient and
        require 100 percent agreement. A mismatch refutes the identity outright.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY THIS PROPOSAL AND THE RECORD SAYS SO PLAINLY. It
      proposes no algorithm. The exponent AT STAKE, in the sense of what would
      move if the obstruction fell, is the whole of it: the Kani/SIDH template
      against a surface that supplied its ingredient is polynomial time
      (KN-TECH-026), against a baseline the specification states as
      Otilde(p^{1/2}) classical / Otilde(p^{1/4}) quantum. The proposal's value
      is that it converts "the ingredient is absent" from an assertion into a
      located, sized, one-field statement with a pre-derived null threshold.
    memory_exponent: >-
      n/a for the audit. For the baseline the specification claims low memory
      (Section 10.2.1); note that the frozen Wesolowski text contradicts the
      low-memory framing at a different time exponent, which is
      IDEA-20260805-2acde5's subject and not used here.
    best_known: >-
      Endomorphism ring problem: Otilde(p^{1/2}) classical, Otilde(p^{1/4})
      quantum, per SQIsign v2.0.1 Section 10.2.1 (READ).
    hidden_overhead: >-
      Not assessed. The audit stops before any cost analysis, which is the
      correct order: there is no point costing a template that cannot be
      instantiated.
    tradeoff_note: n/a

  dominated_by: >-
    n/a (no result claimed; no attack, no algorithm, no cost point). Rows checked
    across time, memory and data/queries before writing that: (i) the
    specification's own stated frontier for the endomorphism ring problem,
    Otilde(p^{1/2}) time at low memory classically and Otilde(p^{1/4}) quantumly
    (Section 10.2.1, READ); (ii) the p^{1/3+o(1)} time-and-memory point of the
    frozen Wesolowski text, whose concrete table names SQIsign NIST-I/III/V rows
    at time >= 2^106.5 / 2^157.5 / 2^204.2 with memory >= 2^92.5 / 2^138.6 /
    2^181.3 (via docs/target-result-profile.md, READ) -- a Pareto trade against
    (i), not a domination, since (i) has negligible memory; (iii) the
    van Oorschot-Wiener interpolation sqrt(N^3/w) that the same text states and
    does not optimise, which is the data/memory axis; (iv) the Kani poly-time
    point, which requires the ingredient this proposal shows is absent and is
    therefore not on the frontier for this surface; (v) the corpus: area SQISIGN
    contains no proposals, hypotheses, experiments or evidence records at all, so
    there is no internal frontier. Absence from the corpus is not evidence that
    no external prior work exists.
  sota_delta: >-
    No attack; the delta is entirely in the precision of a negative. Before: a
    one-sentence assertion, relayed and unverified, that SQIsign avoids
    auxiliary torsion information. After, if the audit holds: the obstruction is
    located at Algorithm 4.1 step 10-versus-11, sized at exactly 4 x
    TORSION_2POWER_BYTES = 128 / 192 / 252 bytes, shown NOT to be a parameter
    margin (torsion surplus = e_chl = 122 / 184 / 247 bits, a quantity a variant
    designer can check against their own parameters), shown to collapse to ONE
    ingredient rather than two (M_sk implies the degree by Weil pairing), and
    accompanied by a null control with a pre-derived firing threshold at k =
    e_rsp. Zero delta on every attack axis: time, memory, data, queries, advice,
    preprocessing.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.70 that the headline -- the sole missing ingredient is M_sk, and the
    obstruction is a publication boundary rather than a parameter margin --
    survives independent review and the control battery. It is not higher for
    three named reasons: the N > d requirement is RECALLED and UNVERIFIED and
    the dimension-8 variant is precisely the one advertised as removing
    conditions, so a fifth to a third of the quantitative content could
    evaporate at stage 0; the specification read is self-described round-2 while
    the goal asks about round-3; and the claim that the SIDH template needs
    images of the SECRET map specifically, rather than of any map in a
    reachable diagram, is the kind of thing that has been wrong before in this
    exact area. It is not lower because every load-bearing structural fact was
    read from the primary specification rather than relayed -- the images are
    computed at KeyGen step 5, M_sk is in the secret key at step 11, pk is 65
    bytes of which 64 are a curve, the hint is a function of the curve by
    Algorithm 2.1, and deg phi_sk is approximately sqrt(p) by the
    specification's own Section 3.1.6.2 -- and because the surplus identity f -
    e_rsp = e_chl is a definitional consequence of Appendix B rather than a
    fitted number. Separately: 0.90 that stages 0-3 reach a decisive reading
    within the goal's declared campaign budget, since none of them needs a
    solver or a large computation.
