  batch: EC-STRUCTURE-20260825
  cluster: 'C3-factor-base: what ''algebraically described'' actually bounds'
  title: 'LOW-HAMMING-WEIGHT FACTOR BASES ON THE SOLINAS PRIMES EVERY DEPLOYED CURVE ACTUALLY USES: a
    set that is NOT algebraically describable (so Bezout does not reach it) and IS strongly additively
    structured (which is exactly the ingredient the Betti-Yield duality says is missing) -- measure its
    decomposition yield against a random-prime null that isolates the prime''s shape'
  class: mechanism
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: Low-weight and sparse-representation factor bases appear in the wider cryptanalytic literature
    and are recalled, not verified. The proposed contribution is the pairing with SOLINAS-PRIME reduction
    structure and the random-prime null that isolates it, which makes the measurement about the deployed
    targets rather than about sparsity in general.
  claim:
    semantic_part: 'For p a Solinas or pseudo-Mersenne prime, the set W_w = {x in [0, p) : binary weight
      of x at most w} is not the zero set of a bounded-degree polynomial over F_p, so the Bezout-type
      no-go does not apply to it, while its additive structure is exactly the ''structured additive density''
      the ledger''s convergence finding names as the missing ingredient.'
    evaluator_part: 'Unestablished, and the honest prior is negative: carry propagation in modular reduction
      is expected to destroy the additive structure and put the yield at baseline. The value of the record
      is that the measurement is cheap and decisive either way, and it has never been run on the primes
      that matter.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - Fix a Solinas prime family and a weight budget w; define the factor base as points whose x-coordinate
    lies in W_w, with membership tested in O(1) by popcount rather than by a polynomial evaluation.
  - 'Measure the m-fold decomposition yield r_m(R) for random targets R and compare against three references:
    (a) the random baseline B^m/(m! N), (b) an interval factor base of identical size, (c) THE SAME weight
    construction over a random prime of the same bit length -- the null that isolates the prime''s shape
    from the weight structure.'
  - 'Record the carry statistics directly: for sampled decompositions, how often the sum''s weight exceeds
    the sum of weights, since that is the mechanism by which the structure would be destroyed.'
  - If the yield exceeds baseline, immediately re-run under the AGL(1, N) instance randomization of IDEA-20260825-b48ad8
    before any claim, because a target-presentation artifact would look identical.
  lossy_projection_test:
    tracked_object: the binary weight profile of a coordinate
    what_is_discarded: the coordinate itself, keeping only a weight statistic
    propagation: 'PARTIAL and this is the crux: weight propagates through addition only up to carries,
      so the object is one-sided rather than deterministic. Under the taxonomy of IDEA-20260825-9ad045
      this places it in a cell distinct from every deterministic-propagation family, which is why it is
      worth testing.'
    verdict: 'PASSES: genuinely lossy, and its propagation failure mode (carries) is exactly the quantity
      the experiment measures.'
  predictions:
  - id: P1
    status: established_formula
    statement: W_w is not the zero locus of a polynomial of degree bounded independently of log p, so
      the bounded-degree no-go does not apply to it.
  - id: P2
    status: unestablished
    statement: Yield of W_w over a Solinas prime exceeds yield of the same construction over a random
      prime of the same size.
  - id: P3
    status: unestablished
    statement: Yield of W_w exceeds the random baseline B^m/(m! N) by a margin that persists as p grows.
  minimal_discriminating_test:
    status: specified_not_run
    test: Toy primes of both shapes at several sizes; exhaustive or large-sample counting of 3-fold and
      4-fold decompositions into W_w; report yields with confidence intervals against all three references.
    pass: P2 and P3 both hold with the effect growing or stable in p.
    fail: Yield at or below baseline on both prime shapes closes the low-weight family for the tested
      w and m -- a controlled null, recorded as such.
  controls:
  - Random prime of matched size, same weight construction (isolates prime shape).
  - Interval factor base of matched size (isolates weight structure from mere smallness).
  - Uniform random subset of matched size (the baseline).
  - Weight-w set on the ADDITIVE group F_p with no curve, to separate the curve's contribution from the
    field's.
  confounders:
  - Matching set SIZE rather than description cost, or vice versa, changes which comparison is fair; report
    both.
  - Small p makes W_w a large fraction of the field, which manufactures yield with no structural content;
    w must scale with log p.
  - The x-coordinate map is two-to-one, so a weight condition on x is not a condition on points; the sign
    ambiguity must be charged.
  falsification:
    semantic: Yield indistinguishable from the random-prime null falsifies the mechanism for the tested
      parameters.
    evaluator: A popcount or reduction bug scopes out that cell.
    not_falsification: A timeout on the exhaustive count; switch to sampling and report the change.
  why_this_is_not_a_variant: IDEA-20260808-c31f1c identifies rank-r generalized arithmetic progressions
    as the full lattice-describable family. W_w is NOT a GAP -- it is a weight-bounded subset of a GAP,
    and weight bounding is exactly the operation that leaves the lattice-describable class. The Solinas
    reduction structure is a second ingredient no GAP-family record carries.
  limits:
  - 'Zero-run: nothing here has been executed, measured, or independently reviewed.'
  - Proposal tier only; claim ceiling is stated in claim_ceiling and is not exceeded.
  - No end-to-end ECDLP algorithm, exponent, or cost claim is made.
  - 'Novelty is unverified: no literature screen was performed for this batch.'
  - Public parameters and toy instances only; no live key, wallet, or deployed target.
