idea:
  id: IDEA-20260808-b9a74c
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-MCE-e65b3c
  goal_id: GOAL-MCE-001
  title: Refine the support-splitting signature with the Schur-square defect instead of the
    hull - the mechanism that would upgrade the alternant distinguisher from a distinguisher
    to a per-coordinate discriminator, and the exact rate distance from Classic McEliece's
    parameters
  class: algorithm
  claim: 'Sendrier''s support-splitting algorithm builds a permutation-invariant per-coordinate
    signature from hulls of punctured or shortened subcodes (KN-LIT-0f43ad), and it is efficient
    precisely when the hull is small. For alternant and Goppa codes the hull is uninformative,
    which is why the permutation contributes essentially nothing and McEliece''s security
    rests on hiding the Goppa STRUCTURE. CLAIM (A): the Schur-square defect def(C) = dim(generic
    bound) - dim(C * C) is also permutation-invariant, is NONZERO for alternant codes in the
    high-rate regime where the published distinguisher operates, and survives shortening -
    so substituting def for the hull inside the support-splitting signature yields a per-coordinate
    discriminator wherever the shortened codes still have nonzero defect. CLAIM (B), the deliverable
    GOAL-MCE-001 criterion 1 actually asks for: the shortening depth at which the defect vanishes
    is an explicit function of (m, t, n) and therefore the DISTANCE between the regime where
    (A) could work and Classic McEliece''s own parameter sets is computable in exact integer
    arithmetic, with no attack implemented and no primary text beyond what the goal already
    holds. CLAIM (C), stated so it cannot be misread: the honest predicted answer to (A) at
    Classic McEliece''s rates is that the defect is zero and the discriminator is vacuous,
    and the value of the exercise is (B)''s number.'
  mechanism: The alternant/Goppa distinguisher line detects that the square of the dual of
    an alternant code has smaller dimension than a random code's would. Shortening an alternant
    code at a coordinate yields an alternant code with the same degree over a shorter support,
    so the defect is not destroyed by shortening - it is destroyed by RATE, since the defect
    appears only above a rate threshold. Support splitting works by computing an invariant
    on each shortened code C_shortened-at-i and using the multiset of values to distinguish
    coordinates. Substituting def for the hull keeps the invariance (Schur products commute
    with coordinate permutations) and changes the discriminating power to exactly the defect.
    The mechanism therefore converts a global distinguisher into a coordinate-local one -
    which is the specific step RQ-MCE-e65b3c's "distinguisher is not break" constraint says
    must be named if it is claimed, and this record names it rather than assuming it.
  why_not_a_renamed_known_approach: The nearest known method is the filtration attack line
    on wild McEliece over quadratic extensions (Couvreur-Otmani-Tillich, RECALLED FROM MEMORY,
    UNVERIFIED), which builds a filtration of subcodes using Schur products and recovers structure.
    That is a global, structure-recovering procedure; this is a per-coordinate signature refinement
    in Sendrier's framework, which needs only a coordinate-DEPENDENT defect and not a full
    filtration. Whether that weaker requirement is ever satisfied where the filtration requirement
    is not is exactly what claim (B) computes. It is also not KN-LIT-4c8135's high-rate alternant
    key recovery, whose own text says verbatim that the attack "does not work at all when
    the alternant code has the additional structure of being a Goppa code" (per GOAL-MCE-001's
    next_action) - a scoping correction this record inherits rather than repeats.
  predictions:
  - observable: def(C) for shortened alternant and Goppa codes as a function of shortening
      depth.
    metric: Defect dimension, exact integer, at toy (m, t, n) with the rate swept across the
      published threshold.
    predicted: Nonzero above the threshold, zero below; monotone decreasing in shortening
      depth because shortening lowers the rate.
  - observable: Discriminating power of the def-based signature.
    metric: Number of coordinate classes the signature separates, at toy parameters above
      the threshold.
    predicted: Full separation above the threshold, complete failure (one class) below it.
      A partial separation below the threshold would be the surprising and valuable outcome.
  - observable: The rate distance from Classic McEliece's parameter sets to the threshold.
    metric: Rate difference and the equivalent difference in t at fixed (m, n), in exact integers,
      for each ISO parameter set (excluding mceliece348864, which GOAL-MCE-001 records as
      absent from the ISO set list).
    predicted: A large positive distance at every set. Stating it as a number is the deliverable;
      a small or negative distance at any set would be immediately security-relevant and must
      go to review.
  - observable: Whether the Goppa-versus-generic-alternant degree question moves the threshold.
    metric: Threshold computed at alternant degree t versus 2t.
    predicted: A factor-2 shift in the relevant parameter, which is exactly the audit IDEA-20260805-9704d9
      proposes - so the two records must be run together or the number will be wrong by that
      factor.
  minimal_test: (1) At toy (m, t) with m = 4..6 and t small, construct binary Goppa codes
    and generic alternant codes, compute dim(C * C) for the code and its dual, and tabulate
    def against rate and shortening depth in exact arithmetic. (2) Build the def-refined support-splitting
    signature and measure how many coordinate classes it separates. (3) Evaluate the threshold
    formula symbolically and report the distance at Classic McEliece's ISO parameter sets,
    computed at both alternant degree t and 2t. Budget order 10^3 core-seconds; linear algebra
    over F_2 and F_{2^m} only, no decoding.
  controls:
  - RANDOM-CODE NULL - compute def for random codes of the same (n, k); it must be zero within
    the generic bound. A nonzero reading on random codes means the generic bound is mis-implemented,
    which is the single most likely bug.
  - PERMUTATION-INVARIANCE CHECK - permute coordinates and confirm the signature multiset
    is unchanged. A signature that is not invariant is not a signature.
  - THRESHOLD-CROSSING SWEEP - sweep rate through the threshold and confirm the discriminating
    power collapses there; a quantity that does not collapse when the parameter meant to destroy
    it crosses its threshold is the canonical artifact tell.
  confounders:
  - The generic bound for dim(C * C) is min(n, C(k+1, 2)) and saturates; near saturation every
    code looks defective and the measurement is meaningless. Report the saturation margin
    per cell.
  - Goppa codes have alternant degree 2t rather than t for squarefree g over F_2, so every
    threshold statement is a factor-2 question (IDEA-20260805-9704d9); fix the convention
    explicitly.
  - Shortening changes n and k together, so rate and defect move jointly; report both.
  falsification_conditions:
  - def is zero for alternant codes at every toy parameter tested, contradicting the published
    distinguisher line and indicating the implementation or the convention is wrong.
  - The def-refined signature separates no coordinates even above the threshold, so the invariant
    is coordinate-independent and (A) fails at its own best case.
  - The threshold distance at Classic McEliece's sets is negative, which is a security-relevant
    positive requiring independent review and not a result of this record.
  interpretation_limits: RQ-MCE-e65b3c's claim-tier ceiling is TOY and this record does not
    authorise its relaxation. Nothing here is an attack on Classic McEliece, no distinguisher
    is promoted to a break, and the deliverable is a distance in exact arithmetic plus a toy-scale
    demonstration of a mechanism. The record explicitly predicts the mechanism does NOT reach
    Classic McEliece's parameters.
  assumptions:
  - The published alternant distinguisher's rate threshold is as described in the corpus records
    KN-LIT-13a01d and KN-LIT-7ee1a9, NONE of which has been read by this program.
  - Classic McEliece's ISO parameter sets are as recorded in GOAL-MCE-001's scheme_context.
  heuristic_assumptions:
  - id: HA-1
    statement: For a random binary Goppa code with parameters (m, t, n) below the distinguisher's
      rate threshold, dim(C * C) attains the generic bound min(n, C(k+1, 2)) with probability
      1 - o(1).
    rigorous_ingredient: The generic bound itself is a theorem (the Schur square of a random
      code attains it); only the assertion that Goppa codes behave generically below the threshold
      is assumed.
    distribution_imitated: The random-code model for Schur products - the standard genericity
      statement underlying the whole distinguisher line.
    validation_route: TOY SCALE, LABELLED AS SUCH - at m = 4..6 compute dim(C * C) for all
      Goppa codes in a sampled family and report the empirical fraction attaining the bound,
      as a function of the distance to the threshold.
    tail_checks: Report every code that fails to attain the bound below the threshold; a nonempty
      failure set is either a weak-key family or an implementation defect, and distinguishing
      which is required before anything is claimed.
  target_complexity:
    time_exponent: If (A) held at a scheme's parameters, permutation recovery would be polynomial
      in n by Sendrier's framework, i.e. a poly-time partial key recovery. It is not claimed
      to hold at Classic McEliece's parameters and is predicted not to. The computation the
      record actually performs is polynomial linear algebra.
    memory_exponent: O(n^2) field elements for the Schur product; negligible.
    best_known_baseline: For Classic McEliece key recovery, no subexponential attack is established
      in this corpus; KN-LIT-7c4620's heuristic subexponential claim is unread and its regime
      is unknown, which is exactly what GOAL-MCE-001 exists to determine.
    hidden_overhead_disclosure: The threshold formula's constants are transcribed from unread
      records; the distance in (B) is only as reliable as those transcriptions, and the record
      must carry that dependency by name.
    time_memory_tradeoff: Not applicable.
  sota_delta: Supplies GOAL-MCE-001 criterion 1's "distance between that regime and Classic
    McEliece's actual parameters, stated quantitatively" for the distinguisher line specifically,
    plus a named mechanism for the distinguisher-to-recovery upgrade that the RQ's own constraint
    demands be named whenever it is invoked. It beats no attack and claims none.
  dominated_by: Dominated in mechanism by the Schur-product filtration attacks on structured
    McEliece variants (Couvreur-Otmani-Tillich line) if those already achieve per-coordinate
    discrimination - RECALLED FROM MEMORY, UNVERIFIED. Inside the corpus, IDEA-20260805-9704d9
    dominates the alternant-degree half of the arithmetic and must be run first or jointly;
    IDEA-20260805-f58517 addresses the second assumption's complexity ceiling by a different
    route (AM-intersect -coAM transfer) and does not dominate the rate-distance computation.
  estimated_cost: Implementation MEDIUM (Goppa and alternant construction, Schur products,
    signature refinement). Compute LOW-MEDIUM.
  recommended_priority: medium
  honest_prior_of_survival: About 0.75 that the defect behaves as predicted at toy scale;
    about 0.5 that the def-refined signature separates coordinates above the threshold; about
    0.03 that anything reaches Classic McEliece's parameters, and the record is written to
    be useful at that low prior.
