  assumptions:
    - >-
      A comparison routine's prologue trip count, where one exists, is
      (-ptr) mod w for its own w. Where a routine instead dispatches on length,
      on a page-crossing test, or on a runtime CPU feature, the cell is
      reported OUT OF DOMAIN rather than assigned a sawtooth.
    - >-
      Both compared buffers can be placed at controlled offsets. Where an
      implementation copies one operand into an internally aligned scratch
      buffer before comparing, only the caller-controlled operand's residue is
      variable and the record says so per cell rather than reporting a sweep it
      did not achieve.
    - >-
      The build, key, seed, parameter set and mutation schedule are held
      byte-identical across a sweep, so that address is the only varying input.
      This is checked by re-running a = 0 at the end of each sweep and
      confirming S reproduces its first measurement exactly.
    - >-
      No conclusion transfers beyond the pinned commits, toolchains,
      allocators and implementations actually read or built.

  proof_search_map:
    bottleneck: >-
      The step from "this routine uses aligned loads" to "and therefore its
      coverage deficit is a nonzero function of the buffer address at ML-KEM
      lengths". The general arithmetic is unconditional; whether any given
      routine instantiates it is a per-implementation fact checked in Stage 1
      and measured in Stage 2, never assumed.
    baseline_embedding:
      parameter_slice: >-
        At a = 0 the corrected law gives head = 0 and tail = L mod w, which is
        IDEA-20260805-3c957e's published formula exactly. The proposal is
        therefore a strict family extension along one previously fixed
        argument, with the prior result as an exact boundary case rather than a
        rival.
      reproduction_check: >-
        Recompute the a = 0 column under the frozen Stage-0 script and diff it
        cell by cell against 3c957e's published table before any candidate is
        read. Expected: agreement at every cell except the w = 512 entry at
        L = 1568 flagged in claim (F), where this session's recomputation gives
        32 against that record's 544. Both values are reported; neither is
        adjudicated; and no conclusion of this record depends on that cell,
        since w = 512 is far outside the stride range where the alignment
        mechanism is being censused. Any ADDITIONAL disagreement would indict
        this record's script and halt the stage.
    observation_collision:
      observable: >-
        The silent set S measured at one buffer address.
      distinct_preimage_search: >-
        At a single address the alignment mechanism can collide with the
        existing taxonomy: an omitted epilogue at a mod w = r produces the
        suffix [L - r, L), which is EXACTLY the observable of C-COV(w') with
        L mod w' = r or of C-BND(L - r). All three are indistinguishable from
        one measurement -- a direct extension of -1beeca's collision to a third
        preimage that record did not enumerate. The separating condition is the
        SWEEP: C-COV and C-BND are constant in a and the alignment mechanism is
        a sawtooth in a, so two measurements at addresses differing by one byte
        separate them where any number of measurements at one address cannot.
        The prefix component, where a prologue rather than an epilogue is
        omitted, separates them in a single measurement because no existing
        class produces a prefix at all.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          The deficit function extended from L mod w to the pair
          ((-a) mod w, (L - ((-a) mod w)) mod w), enlarging the family of
          deficits the lane's arithmetic can express.
        predicted_gain: >-
          A strict inward improvement rather than mere feasibility: the
          enlarged family contains the old one as its a = 0 slice, and its
          nonzero region covers 31 of 32 addresses at w = 32 at every parameter
          set -- including the nine tabulated cells with w dividing 32, all of
          which the old family reports empty at every parameter set.
      - transform: observable_fiber
        proposed_object: >-
          S held fixed at a given suffix while the forgotten structure -- the
          buffer address -- is varied.
        predicted_gain: >-
          Separates an alignment epilogue deficit from C-COV and C-BND, which
          are invariant under the varied structure, at a cost of one extra
          measurement.
    quantifier_order: >-
      The arithmetic is universal and unconditional: FOR ALL w, FOR ALL a, FOR
      ALL L divisible by w, head + tail = w exactly when a is not divisible by
      w. No witness depends on the implementation. The reachability claim is
      existential and per-implementation: FOR the routine of implementation I,
      THERE EXISTS an address at which its coverage deficit is nonempty --
      checked by the Stage-1 census and the Stage-2 sweep, never asserted
      uniformly, and FALSE by construction for any routine using only unaligned
      loads from offset 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        For a stated, finite set of pinned routines that were read and built,
        this method certifies whether the measured silent set depends on the
        buffer address and, where it does, whether the dependence matches the
        forced sawtooth. It does NOT certify that an address-independent
        routine is otherwise correct, does not establish that any application
        ever presents a misaligned buffer, and says nothing about routines not
        fetched.
      nearby_object_control: >-
        Arm A1 -- aligned loads with a CORRECT prologue and epilogue -- is the
        nearby object on which the hoped-for conclusion must FAIL. It has every
        structural feature the method keys on (aligned loads, an
        address-dependent prologue, a nonzero trip count that varies with a)
        and it has no defect. The method must report S empty at every address
        for it. A method that flags A1 has learned to detect the IDIOM rather
        than the DEFECT, which is exactly the reachability-versus-presence
        conflation IDEA-20260821-121612 warns against, and the arm exists to
        catch it.
    proof_obligations:
      - claim: head plus tail equals w for every misaligned a when w divides L.
        responsibility: correctness
      - claim: The a = 0 slice reproduces 3c957e's published table except at the disclosed w = 512 cell.
        responsibility: baseline
      - claim: No member of C-COV, C-BND or C-RED produces a nonempty proper prefix.
        responsibility: strictness
      - claim: The sweep varies address and nothing else, verified by re-running a = 0.
        responsibility: interface
      - claim: Nothing transfers to routines not read or built, nor to any field allocator.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        baseline_reproduction_mismatches: cells where the Stage-0 table's a = 0
        column differs from IDEA-20260805-3c957e's published table, over the 21
        cells given by 7 tabulated strides and 3 parameter sets
      direction: lower
      minimum_effect: >-
        EXACTLY 1, namely the disclosed w = 512 cell at L = 1568 where this
        session computes 32 against that record's 544. Zero mismatches would
        mean this session's own recomputation of 1568 mod 512 is wrong and the
        script is indicted; two or more mismatches means a further disagreement
        exists that this record failed to disclose, and the stage halts until
        both values are reported.
    - metric: >-
        A2_prefix_profile: on the planted arm with the prologue omitted, the
        measured |S| as a function of a, and the shape of S
      direction: different
      minimum_effect: >-
        EXACTLY (-a) mod w at every a in [0, w), with no tolerance, and the
        shape must be PREFIX at every nonzero value. This is the must-fire arm;
        if the harness cannot see a prologue deficit it is constructed to see,
        no null anywhere in this record is interpretable.
    - metric: >-
        A3_suffix_profile: on the planted arm with the epilogue omitted, |S| as
        a function of a at L in {768, 1088, 1568}
      direction: higher
      minimum_effect: >-
        EXACTLY a mod w at every a, hence nonzero at 31 of 32 addresses at
        w = 32 and IDENTICAL at all three parameter sets. The
        parameter-set-independence is the sharp part: 3c957e's law predicts 0
        at all three for w = 32, so a nonzero and L-independent profile here is
        the direct demonstration that the closure's premise was doing work.
    - metric: >-
        A1_false_positive: |S| on the planted arm with a correct prologue and
        epilogue, at every address
      direction: lower
      minimum_effect: >-
        EXACTLY 0 at every a, with no tolerance. A nonzero value means the
        method flags the idiom rather than the defect and every positive
        elsewhere is void.
    - metric: >-
        A0_null: |S| on the unaligned complete comparator at every address
      direction: lower
      minimum_effect: >-
        EXACTLY 0 at every a. If the instrument reports a silent index for a
        comparator complete by construction it is broken and no negative may be
        reported, per IDEA-20260805-ee2018's own null discipline.
    - metric: >-
        census_aligned_count: over every fetched routine with a vector body,
        the number using aligned loads with an address-dependent prologue
      direction: different
      minimum_effect: >-
        No number is predicted and the refusal is deliberate: this is the
        record's discriminator. Zero means 3c957e's closure is complete on the
        fetched population and its implicit premise is now a certified one -- a
        clean strengthening of the lane's strongest result. Any nonzero count
        names the routines at which the coverage class is reachable at 31 of 32
        addresses despite 32 dividing L, and those routines' archived nulls are
        re-scoped to one address.
    - metric: >-
        sweep_determinacy: over every real routine swept, the fraction of
        addresses at which S equals S(a = 0)
      direction: different
      minimum_effect: >-
        1.0 means the (impl, L) -> S model this lane has used throughout is
        well posed for that routine and every archived silent set for it is
        unconditional. Below 1.0 means the model is under-specified and the
        record names the exact residues at which it fails.

  minimal_test:
    design: >-
      STAGE 0 IS FREE AND ALREADY DECIDES THE THEORY QUESTION: the corrected
      closed form, plus its a = 0 reproduction diff against 3c957e's published
      table, is one page of modular arithmetic under a frozen script -- no
      build, no library, minutes. It establishes, or refutes, the claim that the
      lane's strongest closure has an unstated premise, and it settles the
      disclosed w = 512 discrepancy into a reported pair of values rather than
      an ambush. STAGE 3's planted ladder is the cheapest MEASURED
      discriminator: four small standalone comparators, each swept over w = 32
      addresses at one parameter set, is under an hour of build time and
      seconds of compute, and it establishes whether the sweep instrument can
      see the sawtooth at all. Only then are Stage 1's census (bounded by fetch
      budget, reading only) and Stage 2's sweep on real libraries (bounded by
      build budget; probe cost is 32 addresses times the existing exhaustive
      single-byte suite, i.e. 32 * 255 * L probes, about 1.3 x 10^7 at
      ML-KEM-1024, seconds of comparison work) worth spending. All
      library-facing measurement uses the GNU ld --wrap interposition admitted
      by EV-MLKEM-010 with wrap_call_counts attestation, never the call-site
      macro method refuted by EV-MLKEM-009.
    controls:
      - >-
        NULL OBJECT (A0), FORCED AND ABLE TO FAIL: an unaligned complete
        comparator, forced S empty at every address. A silent index here means
        the instrument is broken.
      - >-
        MUST-FIRE ARM (A2): prologue omitted, forced S = [0, (-a) mod w) with
        PREFIX shape at every nonzero residue.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE CONCLUSION MUST FAIL (A1): aligned
        loads with a correct prologue and epilogue -- every structural feature
        of the mechanism and no defect. Forced S empty at every address.
      - >-
        THE PARAMETER-SET INVARIANCE ARM (A3 across all three L): the deficit
        must be identical at 768, 1088 and 1568, because it depends on a and
        not on L. Any dependence on L means the mechanism measured is C-COV in
        disguise, not alignment.
      - >-
        RETURN-TO-ZERO CONTROL: each sweep re-runs a = 0 at the end and must
        reproduce its own first measurement exactly, proving the address was
        the only varying input and no drift entered the harness.
      - >-
        NEARBY-OBJECT CONTROL WHERE THE METHOD MUST REPORT OUT OF POPULATION:
        a purely scalar byte-at-a-time comparator, which has no vector body and
        no alignment prologue. The predicate must report OUT OF POPULATION,
        never "address-independent pass", mirroring IDEA-20260805-ee2018's
        identical control for C-RED.
      - >-
        ORDERING CONTROL: the Stage-0 forced table, the baseline diff and the
        four planted arms' forced sawtooths are committed and hashed before any
        real routine is read or swept.
      - >-
        ARCHIVE CHECK (zero compute): recover, from each archived run manifest
        where possible, the allocation method used for the ciphertext buffers,
        and report whether the address residue is recoverable at all. Where it
        is not, say so; that is itself the finding that the archived
        measurements do not record a parameter they were conditional on.
    required_metrics:
      - the Stage-0 (w, a, L) -> (head, tail, total) table with script and hash
      - the cell-by-cell a = 0 diff against 3c957e's published table, with both values at every disagreement
      - per-planted-arm measured |S| and shape at every address, beside the forced sawtooth
      - per-routine census tuple (aligned loads?, address-dependent prologue?, first-load offset, source or disassembly excerpt)
      - per-routine sweep determinacy and, where below 1.0, the measured (head, tail) split at each residue
      - the shape classification of every nonempty S measured
      - the list of routines reported OUT OF POPULATION, AMBIGUOUS or UNMEASURABLE, with reasons
      - return-to-zero reproduction check per sweep
      - wrap_call_counts per library-facing run; every build configuration and pinned commit

  falsification_conditions:
    - >-
      The Stage-0 a = 0 column disagrees with IDEA-20260805-3c957e's published
      table at any cell OTHER than the disclosed w = 512 entry at L = 1568.
      This record's arithmetic is wrong somewhere it did not disclose and the
      stage halts before any measurement.
    - >-
      The Stage-0 recomputation reproduces 544 at w = 512, L = 1568. This
      session's own arithmetic in claim (F) is wrong, the discrepancy report is
      withdrawn, and the reader is owed the correction.
    - >-
      The A2 must-fire arm does not produce the forced prefix sawtooth. The
      harness cannot see a prologue deficit it is constructed to see and no
      reading anywhere in this record is interpretable.
    - >-
      The A1 correct-prologue arm shows any silent index. The method flags the
      idiom rather than the defect; every positive is void until repaired.
    - >-
      The A3 arm's deficit varies with L. The mechanism measured is not
      alignment and the corrected law is wrong.
    - >-
      A real routine's sweep determinacy is 1.0 everywhere and the census finds
      no aligned-load prologue anywhere. The class is absent on the fetched
      population, 3c957e's closure is complete there, and its implicit premise
      becomes a certified one. This is a NEGATIVE and it is a first-class
      deliverable of this record, not a failure of it.
    - >-
      A real routine is found with an address-dependent prologue AND a nonempty
      silent set at some address. The coverage class is reachable and present
      there; this is a live, escalable conformance finding under RQ-MLKEM-002,
      reported to the coordinator and published by no agent.
    - >-
      Buffers cannot be placed at controlled offsets for a majority of censused
      implementations. The sweep is not executable as designed for those cells
      and they are reported UNMEASURABLE rather than patched after the fact.
    - >-
      Build or fetch failures. INFRASTRUCTURE outcome under AGENTS.md rule 3,
      never negative evidence about any implementation; Stage 0 and the planted
      ladder still complete.

  confounders:
    - >-
      THE ALLOCATOR MAY NOT COOPERATE. malloc typically returns 16-byte-aligned
      pointers, so a naive sweep may only reach residues that are multiples of
      16 unless the buffers are placed by hand inside an over-allocated region.
      The design over-allocates and places explicitly for exactly this reason,
      and any cell where the requested residue could not be achieved is
      reported as not achieved rather than silently skipped.
    - >-
      AN INTERNAL COPY DEFEATS THE SWEEP. A routine that copies an operand into
      an aligned scratch buffer before comparing is address-independent by
      construction, and reporting it as a pass is correct but says nothing
      about the alignment mechanism. Such routines are reported as
      COPY-NORMALIZED, a third category beside pass and fail.
    - >-
      REACHABILITY IS NOT PRESENCE, AND PRESENCE IS NOT EXPOSURE. An
      address-dependent prologue makes the class reachable; a defective
      prologue makes it present; whether any real caller ever supplies a
      misaligned ciphertext buffer is a third question about applications that
      this record does not measure and does not speculate about.
    - >-
      TIMING IS NOT THE SUBJECT AND MUST NOT BE MEASURED. Alignment's usual
      cryptographic significance is timing, and RQ-MLKEM-002 forbids timing,
      power, EM, cache and fault measurement. Every metric here is a set of
      byte indices; no duration is recorded, and an executor tempted to record
      one is out of scope.
    - >-
      COMPILER-CHOSEN ALIGNMENT STRATEGY IS A TOOLCHAIN FACT. An
      auto-vectorised loop's prologue is emitted by the compiler under a
      semantics-preservation obligation and is therefore NOT a member of the
      hand-written-defect class, exactly as IDEA-20260821-121612 argued for
      compiler epilogues. A nonzero deficit in an auto-vectorised body is a
      statement about the vectoriser, and the census records whether the
      prologue is hand-written or compiler-generated for every cell.
    - >-
      A NULL CENSUS IS THE LIKELY OUTCOME. Cryptographic comparison code
      overwhelmingly uses unaligned loads precisely to avoid caller-alignment
      assumptions. A clean census is the expected deliverable and is worth
      having as a certified premise for 3c957e's closure; it must not be
      dressed up as more.

  interpretation_limits:
    - >-
      NOT AN ATTACK, NOT AN ORACLE, NOT AN EXPLOITATION PATH, NOT A COST
      ESTIMATE, NOT A STATEMENT ABOUT MLWE HARDNESS OR ML-KEM SECURITY AT ANY
      PARAMETER SET, AND NOT A TIMING RESULT. RQ-MLKEM-002's constraints bind
      unchanged; any newly observed conformance defect escalates to the
      coordinator and is published by no agent.
    - >-
      NO STATUS CHANGE is proposed for GOAL-MLKEM-002, for any hypothesis, or
      for any archived evidence or decision record. Re-scoping an archived
      measurement as address-conditional is a statement about what it measured,
      not a re-reading of its verdict, and only the Coordinator may act on it.
    - >-
      This record does not claim IDEA-20260805-3c957e is wrong. Its formula is
      reproduced as the a = 0 slice. What is claimed is that its scope is
      narrower than its phrasing suggests, and the corrected phrasing is
      supplied. The separately disclosed w = 512 arithmetic discrepancy is
      reported as an unresolved difference between two computations, is not
      load-bearing for anything here, and is not presented as a defect in that
      record's conclusion.
    - >-
      Claim tier laboratory/toy, not raisable by citation. Address sweeps over
      laboratory builds at three standardized ciphertext lengths are never
      crypto-scale or MLWE evidence.
    - >-
      The remaining classes EV-MLKEM-005 names as untested -- multi-byte,
      length-dependent, key-dependent and shared-defect -- are untouched by
      this record and remain open. Premature closure is a failure mode
      symmetric with overclaiming.

  heuristic_assumptions:
    - id: H1
      statement: >-
        ALIGNMENT PROLOGUE TRIP COUNT. FOR ALL comparison routines that bring a
        pointer to a w-byte boundary before entering a w-byte-strided aligned
        block loop, and FOR ALL base addresses a, the prologue processes exactly
        (-a) mod w bytes, the block loop processes exactly
        w * floor((L - ((-a) mod w))/w) bytes, and the epilogue processes
        exactly (L - ((-a) mod w)) mod w bytes; consequently, when w divides L,
        head + tail equals w for every a not divisible by w and 0 otherwise,
        independently of L.
      rigorous_support: >-
        Not a distributional heuristic; a rigorous modular-arithmetic identity
        about loop trip counts under the stated decomposition, and the exact
        analogue of IDEA-20260805-3c957e's own H1 for a remainder loop,
        evaluated at a second argument. It imitates no classical distribution
        theorem and is not presented as one. Its precondition is that the
        prologue's bound is the alignment residue and nothing else; where a
        routine bounds the prologue by a length threshold, a page-crossing
        test, or a runtime dispatch, H1 does not apply and the method reports
        OUT OF DOMAIN rather than a wrong number.
      validation_plan: >-
        Validated exhaustively rather than sampled, because the domain is
        small: for each of the four planted arms, instrument the prologue and
        epilogue trip counts directly and compare against the forced values at
        ALL 32 residues of w = 32 and all three parameter sets -- 96 cells per
        arm, 384 cells over the ladder, each a single comparison call,
        milliseconds. The prediction is exact equality with zero tolerance, so
        the comparison distribution is degenerate and the tail check is simply
        that the maximum absolute deviation over all cells is 0. On real
        routines, cross-check the measured |S(a)| sawtooth against the same
        forced values and report per-cell residuals; a residual anywhere on a
        real routine localises a prologue whose bound is not the alignment
        residue, and that cell is reclassified OUT OF DOMAIN rather than fitted.
    - id: H2
      statement: >-
        SHAPE EXCLUSIVITY. FOR ALL members of the lane's existing taxonomy --
        C-BND(N) with silent set [N, L), C-COV(w) with silent set
        [w*floor(L/w), L), and C-RED(phi, p) with silent set a union of residue
        classes modulo p -- the silent set contains no nonempty proper initial
        segment [0, r) with 0 < r < L; consequently a measured nonempty PREFIX
        component identifies a mechanism outside that taxonomy.
      rigorous_support: >-
        Rigorous by direct inspection of the three forced shapes, all of which
        are already committed in IDEA-20260805-1beeca and IDEA-20260805-ee2018
        and are quoted rather than re-derived here: two are top-of-buffer
        suffixes by construction, and a periodic residue-class set contains
        index 0 only if it contains every index congruent to 0 modulo p, which
        makes it periodic rather than an initial segment. The argument is only
        as complete as the taxonomy is, and the taxonomy is NOT proven
        exhaustive -- IDEA-20260821-13b667 says so explicitly -- so H2 excludes
        the named classes and not all possible ones, which is stated rather
        than glossed.
      validation_plan: >-
        Enumerate exhaustively over the finite grids the lane already uses:
        N in [1, L], w in {1,...,512}, and (phi, p) with p in {8,...,128} and
        phi a dyadic fraction, at each of L in {768, 1088, 1568}, and confirm
        that no member's silent set is a nonempty proper initial segment. That
        is a few hundred thousand set constructions, seconds of compute, and it
        either holds with zero exceptions or names the exception, in which case
        the prefix signature is not exclusive and this record's
        single-measurement separation claim is withdrawn in favour of the sweep
        alone.

  target_complexity:
    time_exponent: >-
      n/a -- no exponent is moved and no attack is proposed; RQ-MLKEM-002
      forbids attack-cost estimation. Stated plainly. The deliverable is a
      corrected closed form plus a bounded census and sweep, not an asymptotic
      result.
    memory_exponent: n/a
    best_known: >-
      n/a -- the nearest competing statement inside this repository is
      IDEA-20260805-3c957e's L mod w closure, which this record extends and
      reproduces as a boundary case rather than competing with. No external
      search was performed.
    hidden_overhead: >-
      n/a. The sweep multiplies an existing exhaustive probe suite by w = 32
      addresses, giving about 32 * 255 * 1568 = 1.28 x 10^7 single-byte probes
      per routine per parameter set, each a small constant-time comparison --
      seconds of compute. Nothing hides in an o(1) and there is no
      superpolynomial term.
    tradeoff_note: >-
      The one real cost note is that the address sweep is a factor of w on
      probe budget and is embarrassingly parallel across addresses, since the
      arms are independent. A coarse sweep over a subset of residues recovers
      most of the discriminating power at proportionally lower cost but cannot
      resolve the sawtooth's fine structure, and any coarse sweep must say
      which residues it did not visit.

  dominated_by: >-
    n/a (no result claimed as an algorithm; no time, memory or data/query cost,
    hence no Pareto point). Rows checked inside this repository on 2026-08-29
    for a prior treatment of buffer alignment as a coverage question: all
    eleven filed RQ-MLKEM-002 proposals, read in full or in their
    claim/mechanism/object blocks; RQ-MLKEM-001 and RQ-MLKEM-003 in full;
    EV-MLKEM-005 in full, which names alignment as untested and is the closest
    row in the corpus; RUN-MLKEM-007 summary.json in full; and a
    case-insensitive grep of the entire ledger for alignment vocabulary, whose
    only in-lane hit is that same clause. IDEA-20260805-3c957e is the row this
    record extends and it does not dominate, because it does not measure this
    quantity at any cost -- its formula is the a = 0 slice of the one derived
    here. NO EXTERNAL SEARCH was performed and no external novelty is claimed.
  sota_delta: >-
    No attack; measurement and theory-correction contribution only.
    Quantitatively, over IDEA-20260805-3c957e's published grid of 21 cells
    (7 tabulated strides by 3 parameter sets), 13 cells carry an empty deficit
    under its law and 8 carry a nonempty one; of the 13 empty cells, 9 are
    exactly the w in {8, 16, 32} rows the record identifies as covering
    "essentially every portable, SSE and AVX2 comparison in circulation". Under
    the corrected law all 13 empty cells are reopened for any routine with an
    address-dependent prologue -- at 31 of every 32 addresses when w = 32, at
    all three parameter sets rather than one, and with a deficit that does not
    depend on L at all. So the closure's reach goes from 13 of 21 cells
    unconditionally to 13 of 21 cells CONDITIONAL on a premise (the block loop
    starts at buffer offset 0) that was never stated and has never been checked
    against any implementation. The cost of checking the premise is one page of
    arithmetic plus a source census; the cost of measuring it is a factor of 32
    on an existing probe suite. This record additionally reports one arithmetic
    disagreement with that table's w = 512 row (32 versus 544 at L = 1568),
    disclosed rather than adjudicated.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
