idea:
  id: IDEA-20260829-bb55d5
  question_id: RQ-MLKEM-002
  added: '2026-08-29'
  status: proposed
  proposed_by: idea-generator
  title: >-
    The lane's strongest closure covers only the TAIL. A comparator with an
    address-dependent alignment prologue has coverage deficit
    head = (-a) mod w and tail = a mod w summing to exactly w whenever the
    buffer is misaligned -- independent of L, and therefore reachable at 31 of
    32 addresses even where 32 divides L kills the tail. Every archived
    measurement in this lane was taken at one address
  class: measurement

  claim: >-
    (A) THE OBSTRUCTION AS STATED, AND THE HIDDEN PREMISE IN IT.
    IDEA-20260805-3c957e is this lane's strongest and most-cited result: since
    L = 32*(du*k + dv) is a multiple of 32, a comparison whose vector body
    consumes w bytes per iteration with w dividing 32 has L mod w = 0, its
    remainder path executes zero iterations, and "the coverage-defect class is
    ARITHMETICALLY UNREACHABLE for w in {1, 2, 4, 8, 16, 32}, which is the
    width of essentially every portable, SSE and AVX2 comparison in
    circulation". That derivation writes the deficit as L mod w. It is correct
    exactly when the block loop begins at buffer offset 0. It has a premise
    that is never stated because it looks like nothing: THAT THE COMPARISON
    STARTS AT THE FIRST BYTE OF THE BUFFER.
    (B) THE CORRECTED LAW, DERIVED HERE AND PARAMETER-FREE. A comparison that
    uses ALIGNED vector loads must first bring its pointer to a w-byte
    boundary. Write a for the buffer's base address. The standard three-part
    shape is: a PROLOGUE covering head = (-a) mod w bytes; then
    floor((L - head)/w) aligned blocks; then an EPILOGUE covering
    tail = (L - head) mod w bytes. Now impose the lane's own arithmetic,
    w | 32 and 32 | L, so L is congruent to 0 mod w:
        head = (-a) mod w,
        tail = (L - head) mod w = (-head) mod w = a mod w,
        head + tail = w  whenever  a is not congruent to 0 mod w,  else 0.
    THE TOTAL DEFICIT IS EXACTLY w FOR EVERY MISALIGNED ADDRESS AND EXACTLY 0
    FOR AN ALIGNED ONE. It does not depend on L at all. So at w = 32 the
    coverage class is reachable at 31 of every 32 addresses, at EVERY ML-KEM
    parameter set including ML-KEM-512 and ML-KEM-768 where 3c957e reports the
    class unreachable at every stride it tabulates. The obstruction is not
    wrong; it is incomplete in a precisely specifiable way, and this record
    specifies it.
    (C) THE SHAPE IS DIFFERENT, WHICH MAKES IT IDENTIFIABLE. C-COV and C-BND
    produce a top-of-buffer SUFFIX (IDEA-20260805-1beeca); C-RED produces
    PERIODIC residue classes (IDEA-20260805-ee2018). An alignment-prologue
    deficit produces a SPLIT PAIR -- a prefix [0, (-a) mod w) and a suffix
    [L - (a mod w), L) whose sizes are complementary and sum to w. No member of
    the existing taxonomy produces a nonempty PREFIX at all. That is a new
    signature on the lane's own primary observable, and where a prefix appears
    it is distinguishable at a single parameter set and a single address,
    unlike the C-BND(1536) versus C-COV(64) collision -1beeca had to break by
    reading assembly.
    (D) THE INSTRUMENT HAS HAD ZERO POWER AGAINST IT, BY CONSTRUCTION. Every
    silent-set measurement in this lane's archive was taken with the ciphertext
    buffers allocated once, in one way, by one harness -- so the address
    residue a mod w was FIXED across every probe, every seed, every parameter
    set and every build. A quantity that is constant across the whole
    experiment cannot be measured by it. If any archived comparator had an
    alignment prologue, the measured silent set is an ADDRESS-CONDITIONAL
    quantity reported as an unconditional one, and the reported deficit could
    be anything from 0 to w depending on where the allocator happened to put
    the buffer. This is a null-that-cannot-fail (KN-TECH-1a5b7e mode 1) located
    in the HARNESS ALLOCATOR -- not in the control arm (IDEA-20260724-001/-002),
    not in the generator's support law (IDEA-20260821-13b667), not in the
    scheme's algebra. EV-MLKEM-005's own boundaries clause names the gap
    without pursuing it: its post-fix null "does not prove comparison
    correctness for multi-byte, ALIGNMENT, length-dependent, key-dependent,
    shared-defect, or timing-only classes". Alignment has sat on that list
    since 2026-07-24 and no proposal has taken it.
    (E) THE STRUCTURAL TELL, WHICH IS THE WHOLE MEASUREMENT. Inventor protocol
    section 3: ask what the measured quantity SHOULD do as the parameter meant
    to be irrelevant is varied. The silent set of a correct comparison must be
    INVARIANT under the buffer's address, because the address is not an input
    to the mathematical function being computed. So sweep a over its residues
    and watch |S|. Invariant means the (implementation, L) -> S model this lane
    has used throughout is well posed for that comparator. Varying means it is
    not, and the correct object is S(implementation, L, a mod w) with a forced
    sawtooth shape this record predicts in advance.
    (F) AN ARITHMETIC DISCREPANCY IN THE RECORD BEING EXTENDED, REPORTED AND
    NOT ADJUDICATED. IDEA-20260805-3c957e's published reachable-cell table
    gives, at w = 512, the row "L mod w = (256, 64, 544)" for
    L = (768, 1088, 1568). This session's own recomputation gives
    1568 - 3*512 = 32, not 544, while agreeing with that record at every other
    tabulated cell (768 mod 512 = 256 and 1088 mod 512 = 64 both reproduce). A
    residue cannot exceed its modulus, so 544 is not a value of 1568 mod 512
    under any reading. THIS RECORD REPORTS THE DISCREPANCY AND DOES NOT DECIDE
    IT: the divergence may be a transcription slip in that record's table, or
    it may encode a different quantity than the one its column header names.
    Stage 0's frozen script recomputes the entire table and reports every cell
    where it differs, per AGENTS.md retrieval discipline -- report the
    contradiction, do not pick a side. Nothing in this record's own derivation
    depends on that cell; it is disclosed here because a reader would otherwise
    meet it as a silent mismatch in the reproduction check.
    (G) THE DISCRIMINATING QUESTION, WITH TWO REACHABLE ANSWERS. Does any
    fetchable ML-KEM comparison routine use aligned vector loads with an
    address-dependent prologue, or do they all use unaligned loads
    (vmovdqu/vlddqu on x86, plain vld1 on AArch64) and start at offset 0?
    ALL-UNALIGNED: 3c957e's obstruction is complete on the fetched population,
    its closure is STRENGTHENED rather than weakened, the lane gains a
    certified premise it was relying on implicitly, and the archived silent
    sets are confirmed address-independent -- a clean, valuable negative.
    ANY-ALIGNED: that implementation's coverage class is reachable at 31 of 32
    addresses at every parameter set, the strongest closure in this lane does
    not apply to it, and every archived null taken against it is scoped to one
    address.
    (H) WHAT IS NOT CLAIMED. No attack, no oracle, no exploitation path, no
    attack-cost estimate, no timing/power/EM/cache/fault measurement -- and
    that last exclusion is worth stating twice, because alignment is
    conventionally a TIMING topic and this record is not about timing at all:
    it is about which BYTES a comparison functionally reads. No statement about
    MLWE hardness or ML-KEM security at any parameter set. No claim that any
    implementation has an alignment prologue or a defective one. A reachable
    class is not a present defect and the two are not conflated. Any newly
    observed conformance defect escalates to the coordinator per RQ-MLKEM-002
    and is published by no agent.

  mechanism: >-
    STAGE 0 -- FREEZE THE FORCED DEFICIT TABLE AND RE-DERIVE THE BASELINE, ZERO
    COMPUTE. Under a frozen script emit, for w in {8, 16, 32, 64} and a mod w
    in [0, w), the triple (head = (-a) mod w, tail = (L - head) mod w, total)
    at each of L in {768, 1088, 1568}. Confirm the derived identities:
    total = w for every a not divisible by w and 0 otherwise, and total
    independent of L. SEPARATELY recompute IDEA-20260805-3c957e's own published
    table over w in {8, 16, 32, 64, 128, 256, 512} and the same three lengths,
    and emit a cell-by-cell diff against the values that record publishes,
    including the w = 512 row flagged in claim (F). The diff is a REPORTED
    ARTIFACT of this stage, not a pass/fail gate: agreement at the a = 0 slice
    on the cells that do agree is the reproduction check this record needs, and
    any cell where the two disagree is recorded with both values.
    STAGE 1 -- THE SOURCE AND DISASSEMBLY CENSUS, NO PROBING. For every pinned
    comparison routine reachable within budget, determine three fields:
    (i) does the body use ALIGNED vector loads (vmovdqa/vmovaps on x86; an
    aligned form on AArch64) or UNALIGNED ones (vmovdqu/vlddqu; plain vld1);
    (ii) is there an address-dependent prologue -- any computation of the form
    (-ptr) mod w, ptr & (w-1), or a pointer-difference-driven loop bound before
    the main loop; (iii) at what buffer offset does the main loop's first load
    occur. Read from source where unambiguous and from disassembly otherwise,
    reusing IDEA-20260821-121612's frozen v2 extractor rather than reinventing
    a reader, and reporting AMBIGUOUS or UNMEASURABLE where it cannot decide,
    exactly as that record requires. A routine with no vector body at all is
    OUT OF POPULATION by definition, not a pass.
    STAGE 2 -- THE ADDRESS SWEEP, WHICH IS THE MEASUREMENT. Over-allocate the
    two comparison buffers by w bytes and place them at base + a for
    a in [0, w), holding the key, the seed, the parameter set, the mutation
    schedule and the build byte-identical across the sweep. At each a, run the
    existing exhaustive single-byte differential probe and record S(a) as an
    explicit index set. Report the sweep's determinacy (is S(a) constant), and
    where it is not, the measured (head, tail) split against the Stage-0 forced
    table. Because the ONLY thing varying is the address, any variation in S is
    attributable to the address and to nothing else -- which is the property
    that makes this a controlled measurement rather than a correlation.
    STAGE 3 -- THE PLANTED LADDER, CALIBRATING BOTH ENDS. Build four planted
    comparators and run the identical sweep on each:
      A0 -- unaligned loads, loop from offset 0, complete. FORCED: S empty at
            every a. The null object.
      A1 -- aligned loads with a CORRECT prologue and epilogue. FORCED: S empty
            at every a. This is the arm that separates "has a prologue" from
            "has a defective prologue", the distinction this record most needs
            to keep, and it mirrors IDEA-20260821-121612's
            reachability-versus-defect discipline.
      A2 -- aligned loads with the prologue OMITTED. FORCED:
            S = [0, (-a) mod w) at every a, a sawtooth of size (-a) mod w with
            a PREFIX shape. The must-fire arm.
      A3 -- aligned loads with the epilogue omitted. FORCED:
            S = [L - (a mod w), L), a sawtooth of size a mod w with a SUFFIX
            shape, nonzero for 31 of 32 addresses DESPITE 32 dividing L. This
            is the arm that exhibits the incompleteness in claim (B) directly.
    STAGE 4 -- THE SHAPE DISCRIMINATOR. For every nonempty S measured anywhere
    in Stages 2-3, classify its shape as PREFIX, SUFFIX, SPLIT-PAIR, PERIODIC
    or OTHER, and report the classification beside the existing taxonomy's
    forced shapes. The claim under test is that a nonempty PREFIX component is
    unreachable by C-COV, C-BND and C-RED and therefore identifies the
    alignment mechanism at a single parameter set and a single address, without
    the assembly read -1beeca needed to break its own collision. A SUFFIX-only
    reading does NOT identify it and must be separated by the sweep instead,
    which is stated here so that the weaker case is not quietly reported as the
    stronger one.
    STAGE 5 -- RE-SCOPE, DO NOT RE-READ. Report, for each archived measurement
    in this lane whose comparator Stage 1 classifies as having an
    address-dependent prologue, that its silent set is an address-conditional
    quantity, and name the residue it was taken at if recoverable from the run
    manifest. Where the comparator is unaligned, report the archived
    measurement as ADDRESS-INDEPENDENT and therefore unaffected -- which
    strengthens it. No archived verdict is re-read, no status is proposed, and
    only the Coordinator may act on either outcome.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Grep over the repository plus first-hand reads; the crypto-kb MCP index's
      availability was not re-checked and is not relied on. Grep of ledger
      (glob *MLKEM*) for `align|vmovdqa|unaligned|alignment`, case-insensitive:
      inside this lane the ONLY hit is EV-MLKEM-005 line 94, the boundaries
      clause listing alignment among the classes its null does not cover; every
      other hit in the repository is from unrelated GOAL-MLKEM lattice-cost
      records using "aligned" in the statistical sense (k_fft alignment, Gram
      matrix alignment) and is not about memory alignment at all. NO
      RQ-MLKEM-002 PROPOSAL MENTIONS ALIGNMENT. Read in full or in their
      claim/mechanism/object blocks this session: all eleven RQ-MLKEM-002
      proposals, RQ-MLKEM-002, RQ-MLKEM-001, RQ-MLKEM-003, EV-MLKEM-005 (full),
      RUN-MLKEM-007 summary.json (full). No web retrieval was performed for
      this record.
    results: >-
      IDEA-20260805-3c957e derives the deficit as L mod w and enumerates
      reachable cells over (w, parameter set); its object is explicitly "the
      residue L mod w -- the number of trailing ciphertext bytes left unconsumed
      by a w-byte-strided vector body", i.e. a TAIL quantity, and neither it nor
      any successor considers a head. IDEA-20260821-121612 measures whether the
      stride is well defined across TOOLCHAIN cells at a fixed call site and a
      fixed buffer, and its declared limitations name LTO and call-site
      specialization but not the buffer address; IDEA-20260828-033cb3 extends
      that to call sites, again at fixed buffers. IDEA-20260805-1beeca
      enumerates the forced SHAPES of the taxonomy (suffix for C-BND and C-COV,
      periodic for C-RED) and never encounters a prefix. EV-MLKEM-005 names
      alignment as untested and stops. Outside the repository, aligned-load
      prologues are a standard SIMD idiom and alignment is a standard topic in
      constant-time analysis, almost always for TIMING; no search was performed
      for prior work treating an alignment prologue as a FUNCTIONAL coverage
      question, and no external novelty is claimed.
    verdict: >-
      UNVERIFIED. Claimed new relative to this repository: identifying the
      unstated offset-0 premise in the lane's strongest closure; the corrected
      closed form head = (-a) mod w, tail = a mod w with total exactly w for
      every misaligned address and independent of L; the observation that this
      reopens the coverage class at parameter sets where 3c957e reports it
      unreachable at every tabulated stride; the PREFIX shape as a
      taxonomy-separating signature; the identification of the harness
      allocator as a fixed nuisance parameter that gave every archived
      measurement zero power against this class; and the reported w = 512
      arithmetic discrepancy in the record being extended. ASSEMBLED FROM KNOWN
      PARTS: the residue arithmetic is 3c957e's, evaluated at a second
      argument; the shape-identifies-mechanism idea is -1beeca's and -ee2018's;
      the frozen extractor is 121612's; the ld --wrap instrument discipline is
      EV-MLKEM-010's; the naming of alignment as untested is EV-MLKEM-005's.

  object_first_candidate:
    tracked_object: >-
      S(impl, L, a mod w), the silent set as a function of the BUFFER ADDRESS
      RESIDUE, together with the derived pair (head, tail) and the shape
      classification of S. The tracked quantity is the residue a mod w -- a
      property of the caller's allocation, not of the routine, not of the
      standard and not of the parameter set.
      ESTABLISHED FAMILIES DECLARED OFF-LIMITS as the primary lens per
      inventor-protocol section 1: (a) the silent set at a FIXED address, in
      every phrasing -- its size, profile across parameter sets, period and
      suffix shape (IDEA-20260805-1beeca, -ee2018); (b) the length residue
      L mod w as the sole deficit (IDEA-20260805-3c957e), which is here
      EXTENDED rather than restated; (c) toolchain and call-site variation of
      the compiled stride (IDEA-20260821-121612, IDEA-20260828-033cb3), a
      different nuisance axis entirely; (d) the generator's support law
      (IDEA-20260821-13b667); (e) downstream primitives
      (IDEA-20260828-40db79, -edec21); (f) control-arm wiring
      (IDEA-20260724-001, -002); (g) every cryptanalytic and physical
      side-channel lens, and TIMING in particular, excluded by RQ-MLKEM-002.
    lossiness: >-
      Genuinely lossy and compatible with the operation of interest. The full
      state at a comparison call is (the two buffers' full contents, their
      addresses, the length, the routine's entire instruction stream). The
      projection retains only the address RESIDUE a mod w and the resulting
      byte-coverage set, discarding the absolute address, the page mapping, the
      allocator's identity, both buffers' contents, and the instruction stream.
      The fibre is enormous and non-singleton: every address in the same
      residue class -- across every allocation, every run and every process --
      maps to one point, and a prologue written with a pointer mask maps to the
      same point as one written with a modular subtraction. It is not a change
      of coordinates: the address is not recoverable from its residue, and the
      routine is not recoverable from its coverage set (the same fibre argument
      IDEA-20260821-121612 established for coverage sets generally).
      COMPATIBILITY: the coverage set of an alignment-prologue comparator
      depends on the address ONLY through a mod w, because the prologue's trip
      count is exactly (-a) mod w; so the retained part determines the operation
      and propagates deterministically. It fails to propagate for a routine
      whose prologue trip count depends on something else -- a runtime CPU
      dispatch, a length threshold, a page-crossing check -- and that failure is
      declared in advance and reported as OUT OF DOMAIN rather than
      approximated.
    propagation: >-
      One step of the operation of interest is "compare two buffers based at
      address a with length L". The propagation law is closed form:
      head(a) = (-a) mod w, blocks = floor((L - head)/w),
      tail(a) = (L - head) mod w, and under 32 dividing L and w dividing 32,
      tail(a) = a mod w and head + tail = w whenever a is not congruent to 0
      mod w. The coverage deficit is the union of whichever of the two paths is
      absent or mis-bounded, and it is a SAWTOOTH in a with period w -- a
      functional form no other member of the taxonomy has, since C-COV and
      C-BND are constant in a and C-RED is constant in a.
    survival_score: >-
      Survives two steps and stops at a declared boundary. Step 1, "what is the
      prologue's trip count at this address": survives exactly, by the modular
      identity. Step 2, "which byte positions are therefore uncovered":
      survives, and gives the sawtooth with its prefix/suffix split. Step 3,
      "does an implementation's caller ever produce a misaligned buffer in
      practice": DIES here deliberately -- it depends on the application's
      allocator, on struct layout, on stack frame alignment and on whether the
      ciphertext arrives inside a larger network buffer, none of which this
      record measures or speculates about. The record measures whether the
      class is REACHABLE as a function of address, not how addresses are
      distributed in the field.

  discriminated_from:
    - >-
      IDEA-20260805-3c957e derives the deficit as L mod w and closes the class
      for w dividing 32. This record does not restate that derivation, does not
      contradict it, and reproduces it as the a = 0 slice. What it adds is the
      second argument the original does not carry, and the consequence that the
      closure's scope is "comparators whose block loop starts at offset 0"
      rather than "comparators with w dividing 32". That is a strictly sharper
      statement of an existing result, credited as such, plus one reported
      arithmetic discrepancy in that record's published table.
    - >-
      IDEA-20260821-121612 asks whether the compiled STRIDE is well defined
      across toolchain configurations at a fixed call site and buffer;
      IDEA-20260828-033cb3 asks whether it is constant across CALL SITES at a
      fixed toolchain. This record holds toolchain, call site and source fixed
      and varies only the BUFFER ADDRESS -- a third, orthogonal nuisance axis
      neither record names. Its extractor is reused as a tool; its questions
      are not repeated.
    - >-
      IDEA-20260805-1beeca establishes that the archived (0, 0, 32) profile is
      reproduced by two mechanisms and must be broken by reading assembly. This
      record supplies a shape -- a nonempty PREFIX -- that no member of that
      taxonomy can produce, so where a prefix appears the alignment mechanism
      is separable from all of them WITHOUT an assembly read. Where only a
      suffix appears the collision persists and is broken by the sweep instead.
      That is a complementary result about the same observable, not a
      restatement of the collision.
    - >-
      Alignment is conventionally studied as a TIMING and cache phenomenon.
      This record measures which BYTES are functionally compared and never
      measures a duration; RQ-MLKEM-002 forbids timing measurement and none is
      proposed, taken, or needed.
    - >-
      RQ-MLKEM-001's key-mutation census and RQ-MLKEM-003's cost-model work
      share no object with this record; the buffer address is not a
      cryptanalytic or a cost quantity.

