idea:
  id: IDEA-20261018-0eed85
  question_id: RQ-RELN-61638a
  added: '2026-10-18'
  status: proposed
  proposed_by: idea-generator
  title: >-
    Held-out bases, not only held-out targets: split any learned lift into advice about
    D versus structure of the curve, and price every routing rule at once with a pooled
    x-cell by window interaction table
  class: control
  claim: >-
    Per prime-order curve (3 curves, N=2^16..2^22, m=3) take K=32 disjoint
    negation-closed x-windows D_k of B=ceil((6N)^(1/3)) points. Table T[u,k] = sum of
    c_{D_k}(R) over targets in x-cell u (U=64 cells from Legendre class and high bits).
    Predicted: (i) main-effect chi2/dof (cells pooled over k) is 1 +- 3 sqrt(2/dof);
    (ii) the u-by-k interaction chi2/dof is the same, so no routing rule a=g(x(R))
    exists (each rule is a path through the table); (iii) a predicate fitted on even
    windows and scored on odd windows has excess lift inside 3 SD, with SD =
    sqrt((1-s)Delta/(s mu N K/2)) = 6.3e-4 at density s=1/8, N=2^20, versus 2.5e-3
    for one base; (iv) lift(held-out targets, same base) minus lift(held-out base),
    the part of a gain that is advice about D, is inside that band. ALTERNATIVE: a
    replicated significant main effect or interaction, i.e. a base-universal x-line
    cluster.
  mechanism: >-
    Pair (R1 x of the target plus the public window offset a, Sigma = generate-and-
    filter then dispatch to the window); coordinate-dependent. Object: the pushforward
    of c_{D_k}(R) to (x-cell, window) coordinates. Lossy-projection test: K*N counts
    become U*K totals, enough for dispatch. Conservation fixes each row sum
    (KN-FIND-007), so only the interaction is free. A target-dependent base is an
    instance-dependent base (IDEA-20260926-beb5b6), so routing must share unknowns
    across windows; this table prices the yield half exactly. For a random base
    Cov(c(r),c(r')) = -M/N^2 (79ff48, unreviewed), so training labels say nothing
    about held-out targets except through D; a fresh base separates D-advice from
    curve structure. Factor base: ordinary x-windows (KN-OPEN-020: none proposed).
  novelty_status: unverified
  citations:
    - ref: IDEA-20260906-79ff48
      provenance: internal
      claim: held-out targets protocol, four-arm panel, covariance derivation
      verified_by: idea-generator this session, lines 1-944 read
    - ref: IDEA-20260906-b1a568
      provenance: internal
      claim: public routing rule over overlapping charts, conservation preserved
      verified_by: idea-generator this session, lines 1-45 read
    - ref: IDEA-20260926-beb5b6
      provenance: internal
      claim: target-dependent bases collapse to instance-dependent or known-log pools
      verified_by: idea-generator this session, lines 1-75 read
  assumptions:
    - Labels come from a code path the predictor never sees; the window offset a is a public feature; windows are disjoint with gaps.
  predictions:
    - metric: interaction chi2/dof and main-effect chi2/dof per rung and curve
      direction: different
      minimum_effect: inside 1 +- 3 sqrt(2/dof), Holm-corrected; ALIVE if outside on 3 curves and 2 rungs
    - metric: Z/N windows [a,a+w), interaction chi2 and held-out-base lift (BLOCKING control)
      direction: higher
      minimum_effect: interaction chi2/dof > 100; lift near 1 without feature a, at least half the ceiling with a
    - metric: advice gap, same-base minus held-out-base excess lift
      direction: different
      minimum_effect: within the pooled band; a positive gap means advice about D
  minimal_test:
    design: >-
      Enumerate K windows per curve with the sibling enumerator (about 3e7 sums at
      2^20). Build T, run the chi2 tests, then the even/odd-window predicate ladder
      (greedy partitions of depth 6, or the table itself). Negation-forced clusters
      masked as in 79ff48.
    controls:
      - Z/N windows with known interaction c_k(r) = c_0(r - 3a_k)
      - window-label permutation (exact null) and K random matched bases on the same curve
    required_metrics: [interaction chi2/dof, main chi2/dof, pooled lift band, advice gap, cross-window correlation]
  falsification_conditions:
    - Z/N interaction not found voids every E negative.
    - Cross-window correlation above 3/sqrt(N) voids H2 and the K-fold power.
    - A significant E interaction replicated on 3 curves refutes the null for routing.
  confounders:
    - Window edge overlap; small-height windows differ in arithmetic; K draws share one curve.
  interpretation_limits:
    - Toy scale. Yield only; solve cost per window is not measured. No ECDLP claim.
  heuristic_assumptions:
    - id: H1
      statement: For random bases T[u,k] are Gaussian with mean s_u M and variance s_u M Delta_k, independent across cells beyond fixed row sums.
      rigorous_support: Exact row sums (KN-FIND-007) and near-independence of counts; imitates the chi2 test of independence.
      validation_plan: 200 ensembles of K random B-subsets per rung; ECDF of chi2/dof against chi2 with (U-1)(K-1) dof; largest residual versus the Gaussian tail.
    - id: H2
      statement: Disjoint windows have asymptotically uncorrelated count vectors.
      rigorous_support: Triples from disjoint bases collide with probability 1/N.
      validation_plan: Correlation of c_{D_j} with c_{D_k} over all pairs against 1/sqrt(N).
  target_complexity:
    time_exponent: >-
      no ECDLP algorithm. Routing beats a fixed union base of L=KB only if 1+eta >= K^2
      (cost per relation B/(mu_B(1+eta)) versus B/(K^2 mu_B)); conservation caps
      1+eta <= K^3. A measured eta below 1 is sub-break-even by K^2 = 1024.
    memory_exponent: Theta(B^2) = Theta(N^(2/3)) pair table per window; a union base needs K^2 times that
    best_known: p^(1/2) Pollard rho; 772cff ledger N^(2/3) time and memory
    hidden_overhead: K and U are constants here; an exponent claim would need K = N^c
    tradeoff_note: routing saves memory by K at a time cost K^2/(1+eta)
  dominated_by: n/a (no result claimed)
  sota_delta: zero on every ECDLP axis
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
