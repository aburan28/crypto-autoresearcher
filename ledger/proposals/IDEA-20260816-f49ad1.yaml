idea:
  id: IDEA-20260816-f49ad1
  question_id: RQ-FBG-001
  added: '2026-08-16'
  title: Test whether one scalar - the largest non-trivial character-sum modulus of the factor base's
    indicator function - predicts coverage excess across unrelated geometries, by fitting the law
    on one half of a geometry panel and validating it on a held-out half that was never seen during
    fitting
  class: mechanism
  claim: '(A) THE STATE THIS REPLACES. Factor-base geometry results in this program are point estimates
    indexed by family name: an interval family measured here, a coset family there, a greedy construction
    somewhere else. Point estimates do not compose, do not transfer to an untested family, and force
    every new geometry to be measured from scratch. A PREDICTIVE LAW would compose: one scalar computed
    from the base, and a stated function taking it to expected coverage excess. (B) THE CANDIDATE
    SCALAR. For a base D inside a cyclic group of order N, let 1_D be its indicator on the exponent
    coordinate and let its Fourier transform over the group''s characters be taken. Define the BIAS
    as the largest modulus among non-trivial frequencies, normalised by the base size. A base spread
    with no additive structure has small bias; a base concentrated in a coset or a progression has
    large bias at the corresponding frequency. The claim is that coverage excess against a matched
    random base is a monotone function of bias, that the relationship is strong enough to be fitted
    from a small panel, and - the part that makes this a claim rather than a curve fit - that the
    fitted law PREDICTS the excess of geometries held out from the fit, within a stated error band.
    (C) THE DISCIPLINE THAT MAKES IT FALSIFIABLE. The panel is split before any fitting: half the
    geometries are sealed and are not examined until the law is frozen. The law''s predictive error
    on the sealed half is the deliverable, and it is reported whether it is good or terrible. A law
    that fits the training half and fails the sealed half is a negative result of the most useful
    kind, because it says the bias scalar is insufficient and names what it missed. (D) WHAT IS NOT
    CLAIMED. No attack, no break, no speedup, no security consequence. It is NOT claimed that bias
    causes coverage excess; the contract measures association under a held-out test and explicitly
    declines a causal reading. It is NOT claimed that the fourth moment of the same transform - the
    additive energy - is uninformative; that functional is the object of another lane in this program
    and is recorded here only as a covariate to be partialled out, never as this contract''s predictor.
    It is NOT claimed that the law transfers to arities other than the tested one or to sizes beyond
    the tested range. It is NOT claimed that a high-bias base is usable for anything operational,
    since computing the transform requires a discrete-logarithm table and therefore confines the whole
    object to toy scale.'
  mechanism: 'STAGE 1. Fix a toy prime-order curve with a full discrete-logarithm table, so any base
    of curve points maps to a subset of the exponent group. Assemble a panel of at least twelve geometries
    spanning intervals, canonical small sets, cosets, progressions, greedy constructions, ceiling-attaining
    constructions and random draws, all at matched realised size. STAGE 2. Split the panel by a recorded
    seed into a training half and a sealed half, and place the sealed half behind a file the fitting
    code cannot read, enforced by a test. STAGE 3. For every base compute the bias scalar exactly
    by discrete Fourier transform over the cyclic group, and separately compute the fourth-moment
    covariate. STAGE 4. Measure exact coverage over the complete target space for every base and its
    matched random null, giving the excess ratio with intervals. STAGE 5. On the training half only,
    fit excess as a function of bias under a declared functional form with declared free parameters,
    and freeze the fit. STAGE 6. Unseal and predict: apply the frozen law to the sealed half''s bias
    values and compare with their measured excesses, reporting the predictive error distribution.
    Then repeat with the fourth-moment covariate included to see whether bias adds anything beyond
    it. STAGE 7. Refutation route. Predictive error on the sealed half comparable to the spread of
    excesses themselves means the law has no content. A law that only works once the fourth moment
    is included means the predictor is the other lane''s functional and this contract says so.'
  novelty_status: unverified
  novelty_screen:
    method: Read EV-FBG-001 in full and H-FBG-001, RQ-FBG-001, KN-OPEN-006. Read the head of experiments/EXP-RELN-0a979f/specification.yaml,
      which frames a graded additive-energy census with derived ceilings and floors and names the
      collision deficit as the free coordinate. Greps over ledger/proposals and ledger/hypotheses
      for 'Fourier', 'character sum', 'additive energy', 'bias', 'exponential sum', 'Sidon', 'coset',
      and reviewed the blacklist entry naming P(decomp) as a distribution as owned by IDEA-20260815-f9e978.
    results: 'Additive energy is squarely owned by the RELN lane: EXP-RELN-0a979f grades six arms
      by additive energy at fixed parameters and measures the deficit against derived bounds, and
      H-RELN-66c079 carries the hypothesis. That functional is the fourth moment of the same Fourier
      transform this contract uses, which is why the contract records it as a covariate and never
      as its predictor. The blacklist places P(decomp) as a distribution with IDEA-20260815-f9e978.
      What I did not find in any record I read is a predictive law validated on held-out geometries:
      every geometry result in this bucket is a point estimate for a named family, and no record fits
      a functional of the base and then tests it on families excluded from the fit. The largest non-trivial
      character-sum modulus does not appear as a measured quantity in any record I read.'
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; character sums, additive
      energy and their relation to sumset coverage are classical subjects and no publication claim
      is made here in either direction. What is claimed new is the methodological move: a single declared
      functional, frozen before unsealing, tested for predictive error on geometries withheld from
      the fit, with the competing functional already owned by another lane included only as a covariate.
      Assembled from known parts: the exact coverage pipeline and matched null from the frozen battery;
      the discrete-logarithm table from harness/toycurve.py; the geometry panel, most of whose members
      this program has already named.'
  object_first_candidate:
    tracked_object: THE NON-TRIVIAL FREQUENCY SPECTRUM of the base's indicator function over the cyclic
      group's characters, reduced to a single scalar - the largest modulus, normalised by base size
      - and carried alongside the base through the coverage computation.
    lossiness: 'Extremely lossy, which is the point. The full spectrum has N complex coefficients;
      the retained object is one real number. It discards which frequency carried the maximum, every
      other frequency, the phases, the identity of the base elements, the curve and the field. That
      is discarded compatibly with the target operation, because the operation is m-fold sumset formation
      and the Fourier transform converts it into pointwise multiplication: the transform of the m-fold
      sum-count function is exactly the m-th power of the transform of the indicator. So the retained
      maximum modulus controls the largest possible non-trivial deviation of the m-fold count function
      from uniform, which is the deviation coverage excess reads. Vast numbers of distinct bases collapse
      to one bias value, and the honest cost is that the maximum forgets how many frequencies are
      large - which is precisely what the fourth-moment covariate remembers, and precisely why the
      contract must partial it out.'
    propagation: 'One step of the target operation - convolving the current sum-count function with
      the base indicator once more - acts on the retained object by raising each frequency''s modulus
      to the next power. So the bias b propagates as b to the m after m steps, deterministically and
      exactly, with no approximation. That is an unusually clean propagation law and is the reason
      this scalar is worth testing: the prediction that excess depends on b through b to the m rather
      than through b alone is a specific, falsifiable functional form that the fit can be declared
      in terms of.'
    survival_score: 'The scalar survives all m convolution steps exactly, since the propagation is
      exact. It dissolves as a PREDICTOR when the m-th power of the bias falls below the level at
      which a single frequency dominates the deviation - roughly when b to the m times the base size
      drops under the square root of the number of targets - at which point many small frequencies
      dominate together and a maximum-modulus scalar cannot see them. Concretely: informative for
      bases with bias above about N to the minus one sixth at arity 3 and blind below it, and the
      contract measures where the panel''s geometries fall relative to that threshold rather than
      assuming they are above it.'
  null_object_control: 'The null object is a MATCHED RANDOM BASE of identical realised size in the
    same invocation, which serves twice. First, in the usual way, as the denominator of every excess
    ratio. Second, and more importantly here, as a calibration point on the law itself: a random base
    has a bias concentrated near the square root of the base size divided by the base size, computable
    in closed form up to the standard fluctuation, and its coverage excess is exactly 1.000 by definition.
    So the fitted law must pass through the random base''s point, and a law that does not is refuted
    by its own null before any held-out test. A second null is required: a PERMUTED-LABEL base, where
    the base''s exponent set is replaced by a uniformly random set of the same size and the identical
    bias and coverage computations are run, which must produce the same joint distribution as the
    matched random null. If it does not, the pipeline treats structured and unstructured inputs differently
    and no fitted law can be read.'
  discriminated_from:
  - 'EXP-RELN-0a979f and H-RELN-66c079: a graded additive-energy census measuring the collision deficit
    against derived bounds. Additive energy is the fourth moment of the same transform; this contract
    uses the maximum modulus instead, records the fourth moment only as a covariate to be partialled
    out, and its deliverable is a held-out predictive error rather than a graded census.'
  - 'IDEA-20260815-f9e978, which the blacklist names as owning P(decomp) as a distribution: this contract
    measures coverage, a single scalar per base, and fits a law across geometries rather than characterising
    a distribution within one.'
  - 'H-FBG-001 and EV-FBG-001: six named geometries each measured as a point estimate with a growth
    clause in N. This contract fits across at least twelve geometries at fixed N and tests transfer
    to unseen geometries rather than to larger N.'
  - 'IDEA-20260815-c13ef4: designed versus sampled bases with no functional of the base computed and
    no predictive claim.'
  - 'KN-OPEN-006: asks about displacement rank and structured solves, a linear-algebra object; nothing
    here forms a relation matrix or touches a solver.'
  assumptions:
  - A full discrete-logarithm table is constructible at the tested sizes, so the indicator's transform
    is computable exactly; this confines the object to toy scale and the contract accepts that as
    a hard limit rather than a temporary one.
  - Coverage is the free coordinate at fixed base size, mean yield being forced by the counting identity,
    so an excess ratio is a meaningful response variable.
  - The panel spans enough of the bias range that a fitted law is not an extrapolation on the sealed
    half; the realised bias range is measured and reported, and a sealed half lying outside the training
    range voids the transfer claim.
  - The sealing discipline is enforceable in code, verified by a test that the fitting module cannot
    read the sealed file.
  predictions:
  - metric: Spearman correlation between bias and coverage excess on the training half
    direction: higher
    minimum_effect: 0.6
  - metric: median absolute predictive error of the frozen law on the sealed half, relative to the
      interquartile spread of the sealed half's measured excesses
    direction: lower
    minimum_effect: 0.5
  - metric: matched random null's position relative to the fitted law
    direction: different
    minimum_effect: 'forced value: the law evaluated at the random base''s measured bias must return
      excess 1.00 within the interval half-width; a law failing its own null is refuted before unsealing'
  - metric: incremental predictive power of bias after the fourth-moment covariate is included
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit: the fourth moment is another lane''s object and
      I do not know how much of the association it already explains; the contract reports the incremental
      error reduction with an interval and treats a null increment as the honest finding that the
      predictor is the other functional'
  minimal_test:
    design: One curve, one size, twelve geometries, sealed split, one invocation. Take a toy prime-order
      curve with N near 2^14, build the discrete-logarithm table, and construct twelve geometries
      at matched realised size spanning intervals, cosets, progressions, canonical sets, greedy and
      ceiling-attaining constructions, plus the matched random null and a permuted-label null. Compute
      each base's bias by exact discrete Fourier transform over the cyclic group and its fourth-moment
      covariate. Measure exact coverage over the complete target space for every base and its null.
      Split six geometries into a sealed set by recorded seed, fit the declared functional form on
      the other six, freeze it, then unseal and report the predictive error on the six held out. The
      discriminating output is a single scatter of predicted against measured excess on the sealed
      half, with the random null's point marked. If the law misses its own null, stop. If the sealed
      half's bias values lie outside the training range, report extrapolation rather than transfer.
      Cost is twelve exact counts plus twelve transforms of length N, minutes at this size.
    controls:
    - Matched random base of identical realised size in the same invocation, serving as both denominator
      and law calibration point.
    - 'Permuted-label null: a uniformly random exponent set of the same size pushed through the identical
      bias and coverage path.'
    - Sealed half enforced in code, with a test asserting the fitting module cannot read the sealed
      file.
    - 'Closed-form total check per cell: summed multiset count equals binomial(B_eff + m - 1, m) exactly.'
    - 'Transform verification: Parseval''s identity checked exactly on every computed spectrum.'
    required_metrics:
    - bias scalar per base, exactly computed
    - fourth-moment covariate per base
    - exact coverage per base and per null
    - coverage excess ratio with bootstrap interval
    - training-half fit parameters, frozen before unsealing
    - predictive error per sealed-half geometry
    - realised bias range on training and sealed halves, for an extrapolation check
    - Parseval residual per spectrum, which must be zero to machine precision
  falsification_conditions:
  - 'The frozen law evaluated at the matched random null''s bias does not return excess 1.00 within
    interval width: the law fails its own calibration point.'
  - 'Median absolute predictive error on the sealed half is comparable to or larger than the spread
    of the sealed half''s own excesses: the law has no content.'
  - The sealed half's bias values lie outside the training half's range, making the test an extrapolation
    rather than a transfer.
  - Including the fourth-moment covariate absorbs all the predictive power, showing the predictor
    is the other lane's functional rather than bias.
  - The permuted-label null behaves differently from the matched random null, showing the pipeline
    handles structured and unstructured inputs differently.
  - Any Parseval residual is nonzero beyond machine precision, or any closed-form total residual is
    nonzero, voiding the computation.
  - Spearman correlation on the training half is below 0.6, in which case there is nothing worth freezing
    and the run reports that.
  confounders:
  - Base size enters both bias and coverage, so a size mismatch across the panel would create association
    from nothing; matched realised size across every panel member is therefore mandatory and must
    be verified rather than assumed.
  - The fourth moment and the maximum modulus are correlated by construction for many structured sets,
    which is exactly why the covariate analysis is required and why a clean separation may be impossible
    at this panel size.
  - Panel composition determines the bias range, and a panel chosen after seeing which geometries
    have extreme bias would manufacture the correlation; the panel is declared before any measurement.
  - Coverage saturation compresses excess ratios at the high-bias end, flattening the very part of
    the law that matters.
  - Twelve geometries is a small panel for a fit plus a held-out test, so the predictive error estimate
    is itself imprecise and its interval must be reported.
  interpretation_limits:
  - Association under a held-out test is not causation, and the contract explicitly declines a causal
    reading of bias.
  - The law is fitted at one arity and one size range; transfer to other arities or sizes is untested
    and is not claimed.
  - Computing the bias requires a discrete-logarithm table, so nothing here is computable at any size
    where the underlying problem is hard, and no operational reading is available.
  - A successful law predicts coverage excess only, which is not relation yield, decomposition cost
    or index-calculus cost.
  target_complexity:
    time_exponent: No attack exponent is claimed. The measurement costs one length-N discrete Fourier
      transform per base, order N log N, plus one exact coverage computation per base, order N times
      B squared at arity 3.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one length-N complex spectrum
      plus one length-N count vector plus the discrete-logarithm table, all linear in N.
    best_known: 'The incumbent is the current practice this contract is trying to replace: one measured
      point estimate per named geometry family, with no functional of the base recorded and no transfer
      to unseen families. On the response variable the reference row is the matched random base at
      excess exactly 1.000. There is no incumbent predictive law for coverage excess in this repository,
      so the contribution would be the law''s existence and its held-out error, not an improvement
      on an existing predictor.'
    hidden_overhead: The hidden cost is the discrete-logarithm table, without which no bias can be
      computed - it is linear in N to build and store, and it is the reason this object cannot leave
      toy scale, a fact easy to omit when reporting a clean scatter plot. A second hidden cost is
      that the fourth-moment covariate belongs to another lane, so a clean result here may simply
      re-derive that lane's finding in a different functional, and distinguishing the two at a twelve-geometry
      panel size may be beyond the data. The human overhead is the sealing discipline, which is only
      as strong as the person who wrote the test.
  dominated_by: 'n/a (no result claimed) on attack axes; no algorithm, no attack cost point, no frontier
    row displaced. On the coverage-prediction axis the Pareto check is real and I ran it against every
    relevant row this repository records: the additive-energy grading of EXP-RELN-0a979f dominates
    on theoretical grounding, since its ceilings and floors are derived rather than fitted, and this
    contract''s law is fitted and would be dominated by any derived relation covering the same range;
    the frozen battery''s per-family point estimates dominate on simplicity and are dominated on transfer,
    since they predict nothing about an unseen family; and the closed-form random-base coverage, one
    minus the exponential of minus the mean, dominates everything for the single case of an unstructured
    base and is used here as a calibration point rather than competed with.'
  sota_delta: 'No attack; predictive-measurement contribution only. Quantitatively: this bucket currently
    records coverage excesses for six named families plus two red-team constructions - 1.0012, 1.0269,
    1.1071 among them - and zero predictive laws, so the current predictive error for an unseen geometry
    is undefined because no prediction is possible. A completed run would report a median absolute
    predictive error on six held-out geometries with an interval, together with the incremental contribution
    of bias over the fourth-moment covariate. No attack cost, relation rate, solve time or exponent
    changes.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Parseval and closed-form checks passing, meaning the computation is right:
    about 0.9. Training-half Spearman correlation at or above 0.6: about 0.7 - the exact propagation
    law b to the m gives a real mechanism and I expect a visible monotone relation, with the main
    risk being that the panel''s geometries cluster at low bias and leave no range to correlate over.
    Frozen law passing its own random-null calibration point: about 0.6, lower than it sounds because
    the random base''s bias is a fluctuation quantity and the fitted form may not have the right behaviour
    at the low-bias end where the null lives. Median predictive error on the sealed half below half
    the sealed spread: about 0.4 - held-out tests are where fitted laws usually die, and a twelve-geometry
    panel is thin. Bias retaining incremental power after the fourth-moment covariate: about 0.3,
    the weakest part, and I expect the honest outcome to be that the two functionals are not separable
    at this panel size, which the contract is designed to report rather than obscure. Overall probability
    of a defensible held-out error figure in either direction: about 0.65; probability of a law that
    survives the covariate analysis: about 0.25.'
