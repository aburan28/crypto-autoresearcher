idea:
  id: IDEA-20260815-621eea
  question_id: RQ-CSIDH-64343f
  added: '2026-08-15'
  title: >-
    CSIDH PARAMETER PROPOSALS DIFFER BY A FACTOR THAT DEPENDS ENTIRELY ON
    THE ORACLE COST ASSUMPTION: measure the actual cost of the class-group
    action evaluation the quantum oracle must implement
  class: measurement

  claim: >-
    Every CSIDH quantum estimate multiplies a query count by an oracle cost.
    The query count is disputed and heavily studied; the oracle cost is
    usually a classical circuit estimate carried in from a different
    setting. Measuring the classical cost of the group-action evaluation at
    proposed parameters pins one factor of the product with a number rather
    than an assumption.

  mechanism: >-
    Implement the class-group action evaluation at proposed CSIDH parameter
    sets. Measure operation counts and depth for the classical circuit.
    Report the oracle cost and propagate it through the published query
    counts.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-CSIDH-001; grep 'oracle cost', 'group action
      evaluation', 'Kuperberg' (44).
    results: >-
      Query-count analyses dominate the corpus; no record measures the
      group-action evaluation cost that every estimate multiplies by.
    verdict: >-
      UNVERIFIED here as a measurement; CSIDH implementations are
      published and their costs are known in the constant-time-
      implementation literature, so a literature check is a blocking
      stage-one task.

  object_first_candidate:
    tracked_object: >-
      THE CLASSICAL COST of one class-group action evaluation at proposed
      parameters.
    lossiness: >-
      An oracle cost is one number standing for a whole circuit, so depth
      and width are reported separately since a quantum setting charges
      them differently.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while the action is implementable at proposed parameters;
      parameters beyond reach are reported unmeasured rather than
      extrapolated.

  null_object_control: >-
    NULL 1 -- a parameter set with a published implementation cost, which
    must be reproduced. NULL 2 -- a trivial action (identity class),
    bounding the harness overhead.

  discriminated_from:
    - >-
        Published CSIDH constant-time implementation work, which measures
        classical cost for deployment rather than as a quantum oracle
        input.
    - >-
        The CSIDH cost-model reconstruction in this series, which
        reconciles published estimates; this one measures a factor those
        estimates assume.

  assumptions:
    - >-
        The action is implementable at proposed parameters; where not, the
        parameter set is reported unmeasured.
    - >-
        Classical operation counts are a defensible proxy for the
        reversible-circuit cost the quantum oracle needs, which is an
        approximation and is stated as one.

  predictions:
    - metric: >-
        published-cost reproduction
      direction: different
      minimum_effect: >-
        FORCED to reproduce; failure means the implementation is not
        comparable.
    - metric: >-
        measured oracle cost at proposed parameters
      direction: different
      minimum_effect: >-
        The measurement; reported as operations and depth separately.
    - metric: >-
        published estimates recomputed with the measured oracle cost
      direction: different
      minimum_effect: >-
        Shows how much of the estimate spread is oracle-cost assumption
        rather than query-count dispute.

  minimal_test:
    design: >-
      One proposed parameter set plus the reproduction control.
    controls:
      - >-
          Published-cost reproduction.
      - >-
          Identity-action harness-overhead bound.
      - >-
          Operations and depth reported separately, since the quantum
          setting charges them differently.
    required_metrics:
      - >-
          Operation count and depth per parameter set.
      - >-
          Reproduction agreement.
      - >-
          Published estimates recomputed with the measured cost.

  falsification_conditions:
    - >-
        Published cost is not reproduced. Implementation not comparable;
        halt.
    - >-
        The measured oracle cost differs materially from what estimates
        assume. A substantial part of the estimate spread is oracle-cost
        assumption, which is a useful reattribution.
    - >-
        The measured cost matches assumptions. The dispute really is about
        query counts, which focuses the argument.

  confounders:
    - >-
        CLASSICAL-TO-REVERSIBLE GAP: a classical operation count is not a
        reversible circuit cost, and the conversion factor is itself
        contested.
    - >-
        IMPLEMENTATION MATURITY: constant-time CSIDH implementations are
        highly optimised, so a fresh implementation likely overstates
        cost.

  interpretation_limits:
    - >-
        Measures a classical cost used as a quantum-oracle input; makes no
        quantum claim.
    - >-
        Scoped to the measured parameter sets and the classical-to-
        reversible approximation.
    - >-
        Recomputed estimates inherit every other assumption of their
        source analyses.

  heuristic_assumptions:
    - id: HEUR-CSIDH-ORAC-1
      statement: >-
        The classical operation count of the class-group action
        evaluation is proportional to the reversible-circuit cost the
        quantum oracle requires.
      rigorous_support: >-
        Rigorous ingredient: standard reversible-computation simulation
        gives a polynomial relationship between classical and reversible
        cost. THE GAP: the constant depends on uncomputation strategy
        and ancilla budget, which vary widely across designs, so
        proportionality with an unknown constant is weak support for a
        specific number.
      falsification_condition: >-
        A published reversible implementation whose cost departs from
        the measured classical cost by more than the assumed factor.
      validation_plan: >-
        SAMPLE: measured classical cost at >= 2 parameter sets against
        any published reversible cost. TAIL CHECK: the largest parameter
        set, where uncomputation overhead is worst. TRANSFER: stated and
        unjustified.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Cost is implementing and running the action
      evaluation.
    memory_exponent: >-
      Modest; the action's working set.
    best_known: >-
      Incumbents are the published constant-time CSIDH implementations,
      which are faster than any fresh implementation and should be
      measured rather than reimplemented where available.
    hidden_overhead: >-
      The classical-to-reversible conversion is the dominant hidden term
      and is not resolved by this record.
    tradeoff_note: >-
      Measuring classical cost is cheap and buys one factor of the
      estimate; the reversible conversion remains assumed and is flagged.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As implementation: dominated by published
    constant-time CSIDH work. As a quantum-oracle input measurement: none
    exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: a measured classical cost for
    the group-action evaluation every CSIDH quantum estimate multiplies by,
    and a recomputation of published estimates showing how much of their
    spread is oracle-cost assumption rather than query-count dispute.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.7 that a published implementation can be measured rather than
    reimplemented, which is much cheaper and more accurate. 0.85 that
    reproduction succeeds if so. 0.4 that the measured cost materially
    reattributes the estimate spread.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-CSIDH-64343f
    - GOAL-CSIDH-001
    - KN-OPEN-014
    - KN-TECH-056
    - KN-TECH-080
    - docs/inventor-protocol.md
  id_allocation_provenance: >-
