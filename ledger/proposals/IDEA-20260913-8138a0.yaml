  assumptions:
    - >-
      Standalone mathematical instances and derivations only. No deployed target, no
      private key, no claim about the security of any FIPS PUB 186-4 binary curve in
      either direction. The n values are parameter labels in a cost model whose
      internal consistency is what is under test.
    - >-
      The cost model is Semaev's own, eqs. (15)-(16), with exactly one substitution:
      the yield 1/P is taken as 2^{n-mk} in place of m! 2^{n-mk}, the relation count
      as m 2^k in place of 2^k, and stage 2 as (m 2^k)^{omega'} in place of
      2^{k omega'}. Those three substitutions are GG's own accounting and are not
      invented here. Every other term is unchanged.
    - >-
      The claim that the coset-typed chained Boolean system has the same equation
      count, variable count and algebraic degree as the untyped one is an algebraic
      identity to be checked by construction in step 1 of the minimal test, not
      assumed. If a coset shift changes the count, (C2) fails and the proposal fails
      with it.
    - >-
      omega and omega' are carried as ranges (omega in {2.376, 2.807, 3}, omega' in
      {2, 3}) and never fixed silently; every quoted exponent above states which.
    - >-
      MAGMA is not available to this program, so nothing here can reproduce Semaev's
      d_F4 in its exact operational sense. Degree statements are made about a NAMED
      open-source engine and about the algorithm-independent degree-4 closure
      predicate, and the gap between those and d_F4 is the subject of
      IDEA-20260913-449d2b, not of this record.
  predictions:
    - metric: >-
        exponent constant of the symmetry-broken objective, fitted from the exact
        cost surface over 2 <= m <= n at n up to 10^5
      direction: lower
      minimum_effect: >-
        No positive constant c_typed exists: the fitted objective must be
        monotonically decreasing in m over the whole feasible range at every tested
        n, so the argmin sits at the boundary m = n. Falsified if an interior minimum
        in m appears at any tested n, which would mean a rising term was missed and
        (C1) is wrong.
    - metric: >-
        untyped reproduction of Table 3 at n in {100, ..., 571}
      direction: different
      minimum_effect: >-
        The untyped arm must reproduce all 36 Table 3 cells to within the 0.7%
        already established in tables.yaml derived_checks, and recover
        c = 1.6986 and m* = sqrt(2 ln 2 n / ln n). Failure is a procedure defect and
        stops the derivation; this session's independent check already lands at
        2^{187.1} against Table 3's 2^{186.0} at n = 571 under the ceiled-k reading,
        which is within the known ceiled-vs-unceiled discrepancy and not yet a
        verified reproduction.
    - metric: >-
        typed-minus-untyped stage-1 saving at fixed (n, m), in bits
      direction: lower
      minimum_effect: >-
        Exactly log2((m-1)!) to within 0.1 bit. At n = 571, m = 12 that is
        log2(11!) = 25.25 bits; this session computes 186.3 - 161.0 = 25.26. Any
        other value means the three GG substitutions were applied wrongly.
    - metric: >-
        Boolean equation count, variable count and maximum algebraic degree of the
        coset-typed chained system against the untyped one at matched (n, m, t, k)
      direction: different
      minimum_effect: >-
        Identical: n(t-1) equations, n(t-2) + kt variables, degree 3, for every
        tested (n, t, k) and every choice of coset representatives v_i. A single
        mismatch refutes (C2).
    - metric: >-
        first fall degree of the coset-typed chained system, measured by
        src/ic_first_fall_fast.py, at n in {12, 15, 17, 21}, t = m in {2, 3}
      direction: different
      minimum_effect: >-
        Exactly 4, matching the untyped system, for every choice of v_i -- this is
        predicted as a THEOREM by (C3) and its failure would refute the theorem
        rather than the assumption. A measured value of 4 in the typed arm and
        something else in the untyped arm at the same cell instead indicates an
        instrument or builder defect and invalidates the cell.
    - metric: >-
        degree-4 closure predicate and the productive step-degree profile of one
        named open-source engine, typed against untyped, as a function of m at fixed
        n and k
      direction: higher
      minimum_effect: >-
        NO POINT PREDICTION, and this is the deciding measurement. Two outcomes are
        pre-registered with their meanings. (A) The typed solving degree rises with m
        while the untyped one does not: the m! is CONSERVED, exchanged from
        probability into degree, and the right deliverable is that conservation law
        with its measured exchange rate -- which would also be the first direct
        evidence for a specific growth law in m for this family. (B) The typed and
        untyped degrees track each other as m grows over the reachable range: the
        conditional exponent improvement of (C5) is live at the tested scale and must
        go to independent review-breakthrough rather than into a summary.
        Galbraith-Gebregiyorgis's m = 3 observation (D_reg often 3 typed against 4
        untyped) is weak prior evidence for (B) in a different presentation and is
        not treated as support.
    - metric: >-
        minimum solving degree d(n, m) required for the typed variant not to undercut
        2^{1.6986 sqrt(n ln n)}
      direction: higher
      minimum_effect: >-
        d >= 0.196 sqrt(n / ln n) at omega = 3 and d >= 0.248 sqrt(n / ln n) at
        omega = 2.376, both asymptotically. This is a derived inequality, so it is
        falsified only by an arithmetic error in the derivation; it is listed as a
        prediction because it is the record's quantitative deliverable and must be
        re-derived blind.
    - metric: >-
        satisfiability of Lemma 2's hypothesis under typing, counted exactly at small
        (n, k) by enumeration
      direction: lower
      minimum_effect: >-
        The number of proper-subset systems that must be unsatisfiable is the same
        (2^m - m - 2 of them), but the number of candidate tuples per subset falls
        from binom(2^k, i) to 2^{ik}/(coset count), so the measured rate at which the
        hypothesis fails must be no higher in the typed arm than in the untyped arm
        at matched (n, m, k). A HIGHER typed failure rate would mean typing costs
        correctness and must be charged before any cost claim.
  minimal_test:
    execution_status: design_only
    design: >-
      Zero authorized runs here. Four steps; the load-bearing parts (1) and (2) need
      arbitrary-precision arithmetic and no algebra engine at all, which is why this
      is ranked first.

      (1) DERIVATION AND CALIBRATION, no compute beyond mpmath. Recompute the untyped
      two-stage balance symbolically and confirm c' = sqrt(2 ln 2), m* and
      c = 1.6986 fall out of eqs. (15)-(16) with the m! as the only m-growing term;
      reproduce all 36 Table 3 cells to 0.7% under both the ceiled and unceiled k
      readings that tables.yaml records as disagreeing. Then recompute with the three
      GG substitutions, over every integer m in [2, n] and n in {100, ..., 1000} plus
      {10^4, 10^5}, at omega in {2.376, 2.807, 3} and omega' in {2, 3}, reporting the
      full surface and not only the argmin.

      (2) THE AFFINE-INVARIANCE LEMMA, symbolic, no compute. Prove or refute by
      direct expansion that deg_{F_2} S_3(u, v_1+y_1, v_2+y_2) = 3 and
      deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2) = 3 for all v_1, v_2 in F_{2^n}, and the
      corresponding statements for the middle and terminal chain equations. Then
      build the coset-typed descended system independently from the frozen
      S_3 = (x_1x_2 + x_1x_3 + x_2x_3)^2 + x_1x_2x_3 + B and compare its generator
      multiset coefficient-wise against the untyped builder's output at matched
      (n, m, t, k) and matched basis of F_{2^n}, confirming equal counts and equal
      degree.

      (3) DEGREE PROFILE, typed against untyped, the deciding arm. At
      n in {12, 15, 17, 21} with t = m in {2, 3} and k = ceil(n/m), and at fixed
      (n, k) = (12, 2) with m in {2, 3, 4, 6} to get an m-trend at constant field
      size, sample at least 40 instances per cell stratified 50/50 by independently
      enumerated satisfiability, and compute per instance: d_ff; the degree-4 closure
      predicate of IDEA-20260913-449d2b; the exact GF(2) Macaulay rank and
      semi-regular deficit at D = 4; and the full productive / no-pairs-to-reduce
      step-degree trace of one named open-source engine with per-step time and peak
      RSS. Run every cell twice, once typed and once untyped, with the same seeds.
      Dense bit-packed D = 4 upper bounds at these sizes are the ones
      IDEA-20260913-449d2b computed (0.006 GiB at n = 12 m = t = 3; 0.288 GiB at
      n = 21 m = t = 3; 1.52 GiB at n = 12 m = t = 6), and typing does not change the
      matrix dimensions, so the same envelope applies.

      (4) YIELD CHECK BY EXACT ENUMERATION, cheap and decisive for HEUR-YT. At
      n in {12, 15, 17} and k in {2, 3, 4}, enumerate ALL typed tuples
      (x_1, ..., x_m) in prod (V + v_i) and all untyped multisets from V, compute the
      exact number of distinct achievable sums in each case, and compare the ratio
      against the predicted m!. Cost is 2^{mk} = 2^{n} field operations at the
      diagonal, i.e. 2^{17} at worst here, which is trivial. This is the one
      measurement that can refute the whole proposal at a cost of seconds: if the
      distinct-sum ratio is not ~m!, coset typing does not buy the yield and (C2)
      dies.
    matched_null: >-
      Two nulls. (a) SHUFFLED TYPES: replace the m distinct cosets V + v_i by m
      copies of the SAME coset V + v_1 -- formally a typed system, structurally the
      untyped one. Every typed effect must vanish exactly here; an effect that
      survives is an artifact of the coset-shift bookkeeping rather than of typing.
      (b) SUPPORT-MATCHED SEMI-REGULAR NULL: EXP-DREG-001's random Boolean system
      with the same variable count, the same quadratic/cubic generator split and the
      same support profile, carried through d_ff, the closure predicate, the Macaulay
      rank and the step-degree trace in both arms. A degree statistic that does not
      separate the structured system from this null is measuring shape, not typing.
    known_false: >-
      Three objects on which the conclusion is known false, all required. (i) The
      cost formula run at m = n, k = 1, where the decomposition problem IS subset-sum
      over n group elements and no polynomial-time solve exists: the formula must be
      shown to return a polynomial value there, because that is the reductio, and a
      formula that refuses to return a value there has been silently patched. (ii)
      A PLANTED-CONTRADICTION instance: take a typed system, corrupt one coefficient
      of one generator so the system is unsatisfiable while its shape, support and
      degree profile are unchanged; the closure predicate must certify inconsistency
      and must not report the planted solution count. (iii) The paper's own conceded
      off-diagonal family k > ceil(n/m), where Section 4.5.1 states the regularity
      degree "generally exceeds 4" while d_ff stays 4: the typed and untyped arms must
      BOTH show the degree rise there. An instrument that cannot see the rise where
      the paper says it happens cannot be trusted to see its absence elsewhere.
    invalid_input_reject: >-
      Four rejects that must be refused rather than scored. (i) Coset representatives
      v_i that are not in distinct cosets of V -- the types collapse, the m! is not
      removed, and the run must reject rather than report a small saving. (ii) m > n
      or k < 1 -- outside the feasible set. (iii) t = 1, where eq. (5) has no
      equations. (iv) An instance whose satisfiability or solution count was not
      obtained by independent enumeration, which the closure predicate's satisfiable
      branch is defined against.
    controls:
      - kind: matched_null
        design: Same-coset shuffled-type arm, plus EXP-DREG-001's support-matched semi-regular null in both arms.
      - kind: known_false
        design: >-
          The m = n, k = 1 subset-sum corner (where the formula must return a
          polynomial and thereby exhibit the reductio); a one-coefficient corruption
          of a planted-solution typed instance; and the paper's own k > ceil(n/m)
          family where a degree rise is predicted by the paper itself.
      - kind: invalid_input
        design: Non-distinct cosets, m > n, k < 1, t = 1, and unenumerated solution counts all reject.
      - kind: baseline
        design: >-
          Exact reproduction of Table 3's 36 cells and of the Table 1 / Table 2
          d_F4 = 4 cells in the UNTYPED arm, on the same engine and machine as the
          typed arm. Without it a typed-untyped difference is equally explicable as
          an engine difference.
      - kind: satisfiability_stratification
        design: >-
          Planted instances (z = x-coordinate of a sum of one point from each typed
          base) against uniform-z instances, with satisfiability and solution count
          determined independently by O(2^{(t-1)k}) enumeration through the auxiliary
          chain. KN-LIT-e77232 flags this as the confound that makes null-derived
          degree ceilings optimistic.
      - kind: representation_control
        design: >-
          The typed system built with (a) multiplicative translates g_i V and
          (b) GG's additive cosets V + v_i, at matched k. Both remove the m!; if only
          one changes the degree, the effect is about the representation and not about
          typing, which is the distinction IDEA-20260913-116951 measures directly.
      - kind: strategy_control
        design: >-
          Each ideal under at least 2 degree-compatible monomial orders and 2
          selection strategies, so a typed-untyped step-degree difference cannot be
          an ordering artifact.
    decision_threshold: >-
      (C1) established if the symbolic derivation returns c' = sqrt(2 ln 2) and
      c = 1.6986 with log2(m!) as the unique m-growing term, AND the typed surface
      has no interior minimum in m at any tested n. (C2) established if the typed and
      untyped generator counts and degrees match exactly at every tested cell and the
      exact-enumeration distinct-sum ratio is m! to within 10%. (C3) established if
      the affine-invariance expansion closes symbolically and the measured typed d_ff
      is 4 at every cell. (C4) established if the typed cost surface is monotone
      decreasing in m and returns a polynomial at m = n / ceil(log2 n). (C5)
      established if the required-degree inequality survives an independent blind
      re-derivation. Outcome (A) or (B) of the deciding prediction is reported as
      measured, with its meaning as pre-registered, and outcome (B) is escalated
      rather than summarised. Any cell exceeding its declared RSS or wall-clock cap
      is an impediment with a recheck, never a degree result.
    stopping_rules:
      - >-
        Stop and report the mismatch as the finding if step (2)'s coefficient-wise
        builder comparison fails: every later typed-untyped comparison would be
        between two different systems.
      - >-
        Stop the whole proposal and record it as refuted if step (4)'s exact
        enumeration does not show a distinct-sum ratio of about m!. That is a
        seconds-long check and it gates everything downstream.
      - >-
        Stop the cell and record an impediment with its recheck if peak RSS or wall
        clock exceeds the declared cap. Resource exhaustion is never negative
        mathematical evidence (AGENTS.md rule 5).
      - >-
        Stop and invalidate the cell if two independent GF(2) rank routines disagree
        on the closure predicate.
      - No run is authorized by this record.
    required_artifacts:
      - symbolic derivation of c' = sqrt(2 ln 2) and c = 1.6986 with every m-dependence exhibited term by term
      - full typed and untyped cost surfaces over (n, m) at every (omega, omega') and both k readings, as data not as argmins
      - the 36-cell Table 3 reproduction with its residuals under both k readings
      - symbolic proof or refutation of the affine-invariance of the d_ff = 4 argument, written out
      - coefficient-wise typed-vs-untyped builder equality report per cell
      - exact distinct-sum counts, typed and untyped, with the measured ratio against m!
      - per-instance d_ff, closure predicate with its certifying rank, Macaulay rank and deficit at D = 4, and full step-degree trace with per-step time and peak RSS, in both arms with shared seeds
      - independently enumerated satisfiability and solution count per instance
      - both null arms and all three known-false arms in the identical format
      - engine, version, monomial order and selection strategy per run
      - impediment records with rechecks for every cell not reached
    budget:
      authorized_runs_in_this_task: 0
      future_experiment_status: >-
        Requires a new approved frozen handoff and contract. Steps (1), (2) and (4)
        are derivation and exact enumeration and are separable from step (3), which
        is the only part needing an algebra engine; splitting them into two contracts
        is recommended so the cheap reductio is not blocked behind the degree
        measurement. This record neither creates, approves nor dispatches either.
  falsification_conditions:
    - >-
      Exact enumeration at n in {12, 15, 17} shows the distinct-sum ratio between
      typed and untyped families is not about m!. Coset typing does not buy the
      yield, (C2) fails, and the whole proposal dies at a cost of seconds. This is
      the cheapest and most likely refutation and it is deliberately placed first.
    - >-
      The coset-typed descended system has a different equation count, variable count
      or algebraic degree than the untyped one. (C2)'s zero-cost claim fails and the
      substitution is not free.
    - >-
      The affine-invariance expansion fails: deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2)
      is 4 for some v_1, v_2. Then Assumption 1's justification does NOT transfer,
      (C3) is refuted, and the collapse argument loses its force -- this would be a
      genuinely good outcome, because it would identify the coset shift as the thing
      the first-fall argument is sensitive to.
    - >-
      The typed cost surface has an interior minimum in m at some tested n. A rising
      term in m was missed, (C1)'s exponent localisation is wrong, and the term must
      be named.
    - >-
      The untyped arm fails to reproduce Table 3 to 0.7% or to recover m* and
      c = 1.6986. Procedure defect; the derivation stops and no claim is made.
    - >-
      The typed solving degree rises with m at a rate at or above
      0.196 sqrt(n / ln n) over the reachable range. The collapse is blocked by a
      genuine degree growth, (C5)'s inequality is SATISFIED rather than violated, and
      the deliverable becomes the measured conservation law -- which is outcome (A)
      and is a result, not a failure.
    - >-
      Lemma 2's hypothesis fails more often in the typed arm than in the untyped arm
      at matched (n, m, k). Typing costs correctness, and the cost must be charged
      before any cost claim; a typed algorithm that emits non-relations is wrong, not
      fast.
    - >-
      A reader finds that Diem's use of different factor bases, or any other prior
      work, already composes a typed factor base with an auxiliary-variable
      presentation and derives the degree consequence. novelty_status drops to
      `known` and the record's contribution reduces to the quantitative bound.
  confounders:
    - >-
      THE TWO FACTORIALS. The probability m! of eq. (11) and the search m! of
      Trimoska et al. are different quantities with the same name. Any report that
      does not say which one it removed is uninterpretable, and a claim to have
      removed both must exhibit both removals separately.
    - >-
      The m-times-larger factor base. Coset typing multiplies the relation count by m
      and the stage-2 sparse linear algebra by m^2, which is why the net is (m-1)! and
      not m!. Quoting m! would overstate the gain by a factor m; GG state this
      explicitly and it is charged in every number above.
    - >-
      Satisfiability. Semaev's own experimental probabilities run 0.00 to 0.47, so
      his 2300 systems are heavily weighted to unsatisfiable instances, and he states
      the unit-ideal case never left step degree 4. A typed-untyped degree comparison
      that does not stratify is comparing mixtures, and typing CHANGES the
      satisfiable fraction by about m! at fixed k -- so the strata must be matched by
      construction, not by sampling.
    - >-
      Monomial order and selection strategy for any step-degree number; MAGMA's F4 is
      not reproducible here at all, so no cross-engine step-degree equality may be
      asserted in either direction.
    - >-
      The coset representatives. A "random" v_i may accidentally lie in V or in a
      coset already used, silently collapsing types. GG note the v_i must be "of a
      certain form so that the sets V + v_i are all distinct"; this must be checked
      per instance and not assumed.
    - >-
      Multiplicative versus additive translates. g_i V and V + v_i both remove the
      m! but they interact differently with the monomial support of the descent --
      g_i V preserves the products' dimension while relocating them, V + v_i
      preserves the coordinate basis while adding lower-degree terms. Conflating them
      would attribute a representation effect to typing. This is the axis
      IDEA-20260913-116951 isolates.
    - >-
      Table 1 fixes B = 1 while Table 2 draws B at random, so pooling them mixes a
      curve-specific effect with an n effect.
  interpretation_limits:
    - >-
      What this record ASSERTS is a dichotomy and an inequality, not an algorithm. The
      polynomial-time branch is offered as a reductio against Assumption 1', not as a
      result, and must never be quoted as an attack. If a summary of this record reads
      as "ECDLP in n^{14}", the summary is wrong.
    - >-
      Assumption 1 and Assumption 2 are different claims and must never be refuted as
      one object. (C5) bears on both but by different margins: Assumption 1 is
      contradicted asymptotically by the polynomial branch, while Assumption 2 is
      contradicted by a constant factor in the required degree growth.
    - >-
      The quantitative floor 0.196 sqrt(n / ln n) is a statement about SEMAEV'S COST
      MODEL under GG's accounting. It is not a lower bound on the degree of regularity
      of any concrete system, and it becomes one only for an algorithm actually built
      and measured.
    - >-
      At n = 571 the floor evaluates to 1.86, which is BELOW Assumption 1's 4, so
      there is no contradiction with Assumption 1 at concrete FIPS-labelled
      parameters from the floor alone. The floor exceeds 4 only around n ~ 3400 at
      omega = 3. The concrete-n force of the argument comes instead from the
      monotonicity in m, not from the floor, and conflating the two would overstate
      the result at small n.
    - >-
      Galbraith-Gebregiyorgis's D_reg = 3 observation is at m = 3, in a different
      presentation, on binary Edwards curves with symmetrised coordinates, from a
      table whose authors call their own results "not conclusive". It motivates the
      experiment and supports nothing.
    - >-
      No statement about the security of any deployed curve, in either direction,
      follows from anything in this record. The FIPS n appear only as labels on rows
      of a cost table whose internal consistency is the object of study.
    - >-
      This record does not touch the memory axis beyond the m^2 stage-2 factor. The
      typed relation store is m 2^{ceil(n/m)} and at m = n that is 2n points, which
      looks free -- but the stage-1 Macaulay working set at m = n is enormous and
      is NOT costed here. H-SEMBIN-83999d and IDEA-20260913-9c54f9 own the memory
      column; a typed memory table is forward work and is named, not claimed.
  heuristic_assumptions:
    - id: HEUR-A1T
      statement: >-
        (Typed first-fall-degree assumption.) Let q = 2^n, 2 <= m < n,
        k = ceil(n/m), and let V be an F_2-subspace of F_{2^n} of dimension k with
        v_1, ..., v_m in F_{2^n} lying in pairwise distinct cosets of V. Then for
        every 2 <= t <= m, the Boolean system equivalent to (5) with the constraint
        x_i in V + v_i has d_F4 <= 4. Formally: for all such (n, m, k, t, V, {v_i})
        and all instances z in F_{2^n}, d_F4 <= 4. This is Semaev's Assumption 1
        with "V" replaced by the coset family; it is NOT asserted by Semaev and is
        authored here so that the collapse argument has a named premise instead of a
        silent inheritance.
      rigorous_support: >-
        The rigorous half is (C3): Semaev's Section 4.5 proof that d_ff = 4 rests on
        deg_{F_2} S_3 = 3 and deg_{F_2} x_1 S_3 = 3, which are statements about
        Hamming weights of exponent vectors and are therefore invariant under the
        affine substitution x_i = v_i + y_i. So d_ff = 4 for the typed system is
        provable exactly where it is provable for the untyped one. The step
        d_F4 <= d_ff is the heuristic and is exactly as unproved here as it is in the
        paper -- Assumption 1 IS that step. The classical result the step imitates is
        the semi-regular-sequence picture of Bardet-Faugere-Salvy (KN-LIT-029), under
        which no syzygies beyond the trivial ones appear below the degree of
        regularity; KN-LIT-029's own record carries the hedge that identifying the
        degree of regularity with the observed first-fall or solving degree is a
        heuristic and that semi-regularity need not hold for structured systems.
      random_model_justification: >-
        The system is modelled as behaving, above its exhibited degree-4 syzygies,
        like a uniformly random Boolean system of the same variable count and the
        same quadratic/cubic generator split -- the same model the paper's
        Section 4.5.1 uses when it substitutes "the X-coordinate R_X of a random R
        ... by a random element z from F_{2^n}". The coset shift is an affine change
        of variables and affine changes act transitively on the relevant Boolean
        variable space, so a random-model justification that holds for one coset
        family holds for all of them; this is the one place where typing is cleanly
        neutral under the model, and if the measurement disagrees it is the MODEL
        that is refuted, which is the informative outcome.
      validation_plan: >-
        Sample at least 40 instances per cell at n in {12, 15, 17, 21} with t = m in
        {2, 3}, k = ceil(n/m), and additionally at fixed (n, k) = (12, 2) with
        m in {2, 3, 4, 6} to obtain an m-trend at constant field size; stratify
        50/50 by independently enumerated satisfiability; measure d_ff, the degree-4
        closure predicate, the D = 4 Macaulay rank and deficit, and the separated
        productive / no-pairs-to-reduce step-degree trace under 2 orders x 2
        strategies. Comparison distribution: the untyped arm at the same cell with
        the same seeds, and the support-matched semi-regular null. Tail checks: the
        largest step degree observed across all strategies in each arm, against
        Semaev's reported trailing 5, 6, 7; and the largest typed-minus-untyped
        degree difference over all instances rather than its mean, since a
        conservation law would show first in the tail. Sampled parameters recorded
        exactly. TRANSFER ASSUMPTION, stated: nothing is claimed for MAGMA's F4,
        nothing for n > 21 at t = m = 3, and nothing for m beyond 6. The m-trend is
        an extrapolation over a reachable range of four points and is reported as
        such.
      falsification_condition: >-
        A typed cell with degree-4 closure false, or with productive step degree
        above 4 on the unsatisfiable stratum, where the untyped cell at the same
        (n, m, t, k) and seed is at 4. HEUR-A1T is then refuted at that cell, the
        collapse is blocked, and the measured exchange rate between the removed m!
        and the added degree becomes the deliverable.
    - id: HEUR-YT
      statement: >-
        (Typed yield law.) With V of dimension k and v_1, ..., v_m in pairwise
        distinct cosets of V, the map
        (x_1, ..., x_m) in prod_i (V + v_i) -> S_{m+1}(x_1, ..., x_m, z) behaves, for
        random z in F_{2^n}, like a uniformly random map from a set of size 2^{mk}
        into F_{2^n}, so P(satisfiable) = 1 - (1 - 2^{-n})^{2^{mk}} ~ 1 - e^{-2^{mk-n}}
        with NO 1/m! and no other symmetry factor. Formally: for all n, k, m and all
        admissible {v_i}, the number of distinct values attained is
        2^{mk}(1 + o(1)) whenever mk <= n - omega(1).
      rigorous_support: >-
        The rigorous half is a counting bound in the other direction: with a single
        base the number of distinct achievable sums is at most
        binom(2^k + m - 1, m) ~ 2^{mk}/m!, an information-theoretic cap, whereas with
        m distinct cosets it is at most 2^{mk}. So the m! is a genuine cap on the
        untyped family and its removal is not an accounting choice. The classical
        distribution theorem imitated is the balls-into-bins / random-surjection law
        already used by Semaev's eq. (11) -- this heuristic is eq. (11) with the
        symmetry quotient removed and nothing else changed. GG assert the same
        heuristic for the same construction in their section 4.2.
      random_model_justification: >-
        S_{m+1} restricted to a product of cosets is a polynomial map of degree
        2^{m-1} in each variable; the random-map model is the assumption that its
        image is not concentrated. Concentration is exactly what a small subgroup or
        a small multiplicative structure in the v_i could cause, which is why the
        representation control (multiplicative translates against additive cosets) is
        in the design and why step (4) measures the image size exactly rather than
        assuming it.
      validation_plan: >-
        Exact enumeration, not sampling, at n in {12, 15, 17} and k in {2, 3, 4} with
        m = ceil(n/k): enumerate prod_i (V + v_i) and count |image| exactly, and do
        the same for the untyped multiset family from V; report the ratio against the
        predicted m! and the absolute image size against the predicted
        2^{mk}(1 + o(1)). Cost is at most 2^{n} = 2^{17} field operations. Tail check:
        the most-hit and least-hit fibres, against the Poisson prediction
        Pois(2^{mk-n}) for fibre sizes -- a heavy-tailed fibre distribution means
        concentration and refutes the model even when the mean image size matches.
        Repeat over at least 20 independent draws of {v_i} and over both additive and
        multiplicative translate families, reporting the spread across draws rather
        than one draw.
      falsification_condition: >-
        Measured image-size ratio between typed and untyped families materially below
        m! (say under m!/2) at any cell, or a fibre-size distribution significantly
        heavier-tailed than Poisson. Either refutes HEUR-YT, and since (C2) rests on
        it, the proposal's cost claims fall with it.
  target_complexity:
    time_exponent: >-
      CONDITIONAL, and the conditions are the point. Under HEUR-A1T with d_F4 <= 4:
      n^{O(1)} -- O(n^{14}) with the block solver and O(n^{26}) with plain F4 at
      omega = 3, at m = n/ceil(log2 n). Under Semaev's Assumption 2 extended to the
      typed family: 2^{epsilon sqrt(n ln n)} for every constant epsilon > 0, so no
      positive constant survives. NEITHER is claimed as achievable; both are offered
      as reductiones. What the record asserts UNCONDITIONALLY is the contrapositive
      inequality d(n, m) >= 0.196 sqrt(n / ln n) at omega = 3 (0.248 at
      omega = 2.376) as a necessary condition for Semaev's own bound to survive
      typing.
    memory_exponent: >-
      Typed relation store m 2^{ceil(n/m)} against Semaev's 2^{ceil(n/m)}, i.e. an
      extra factor m; at m = n/log2 n that is about n^2/log2 n points, which is
      polynomial. The stage-1 Macaulay working set at large m is NOT costed here and
      is the most likely place the collapse branch is actually blocked by resources
      rather than by degree -- disclosed rather than absorbed. Semaev states no
      memory column at all; tables.yaml derives 2^{48} relations at n = 571 and a
      2^{91.8}-bit dense F4 working set, which IDEA-20260913-9c54f9 prices.
    best_known: >-
      For E(F_{2^n}) with n prime: van Oorschot-Wiener parallel Pollard rho with
      distinguished points, ~0.886 * 2^{n/2} group operations total and 2^{n/2}/M per
      processor with near-linear speedup in M, small per-processor memory,
      unconditional (KN-TECH-006, KN-LIT-012). Every index-calculus number in this
      record is conditional; the comparator is not.
    best_known_comparator: >-
      vOW parallel rho; serial Pollard rho; BSGS; Semaev 2015 conditional
      2^{1.6986 sqrt(n ln n)}; Karabina 2015 conditional, crossover stated at
      n > 457 at m = 5; Petit-Quisquater 2012 conditional 2^{c n^{2/3} ln n};
      Trimoska-Ionica-Dequen 2019 O~(2^{n+l}); Gaudry / Diem index calculus over
      non-prime extension degree (out of scope, n prime here).
    hidden_overhead: >-
      Three disclosures. (i) The o(1) in every exponent above hides the
      n^{4 omega} or [n(m-1)]^{4 omega} per-solve cofactor, which at omega = 3 and
      n = 571 is 2^{109.9} and therefore EXCEEDS the 2^{94.8} stage-2 term it is
      balanced against -- the cofactor is not a cofactor at these n, which is
      sub-objective 4 of the goal and is charged in H-SEMBIN-b1708c. (ii) The typed
      variant's monotone-in-m behaviour means its quoted costs are boundary values,
      and the boundary m = n is where the cost model is least credible; the number
      2^{120} at n = 571 should be read as a measure of the model's breakdown, not of
      anything's cost. (iii) The o(1) in Assumption 2's o(sqrt(n / ln n)) is exactly
      where the whole dispute lives, and the record's inequality is a statement about
      that o(1).
    tradeoff_note: >-
      No new time-memory tradeoff is offered. Positioning: vOW rho is the
      low-memory, embarrassingly parallel endpoint at 2^{n/2} time and negligible
      memory; every chained-S_3 variant, typed or not, sits at exponential memory
      2^{ceil(n/m)} with a conditional time claim, and its stage 1 parallelises
      trivially over R while stage 2 does not. A typed variant at large m moves
      TOWARD low memory (2^{ceil(n/m)} shrinks) and toward an enormous per-solve
      working set, so it trades relation-store memory for solver memory -- a trade
      nobody has priced, and the most concrete piece of forward work this record
      names.
    cost_model: >-
      Arbitrary-precision arithmetic on eqs. (15)-(16) with GG's three substitutions,
      plus exact GF(2) linear algebra and exact enumeration at n <= 21. Every number
      quoted in this record was computed in this session from those formulas and is
      reproducible from them; none was measured and none is a timing.
    data_query_cost: >-
      Relation collection queries the group only through R = uP + vQ, m 2^{ceil(n/m)}
      relations needed, each requiring one solve; the exact-enumeration validation
      costs 2^{mk} <= 2^{17} field operations per cell. No oracle, no precomputation
      beyond the factor base.
    established_exponent_gain: 0
  estimated_cost:
    implementation: medium
    compute: low
    proposal_task:
      maximum_runs: 0
      wall_clock_cap_seconds: 3600
      memory_cap_gb: 4
    future_test: >-
      Steps (1), (2) and (4) together are under 1 CPU-hour and need no algebra
      engine: arbitrary-precision arithmetic, symbolic expansion by hand or sympy,
      and 2^{17}-element enumeration. Step (3) is the expensive arm, under 10
      CPU-hours for the D = 4 cells named, doubled because every cell runs twice
      (typed and untyped) with shared seeds.
    dominant_cost: >-
      Step (3)'s exact GF(2) degree-4 closure and the independent satisfiability
      enumeration, doubled across arms.
  recommended_priority: high
  proof_search_map:
    bottleneck: >-
      The factor m! in eq. (11), and hence in eq. (15). It is the unique term in
      Semaev's two-stage balance that grows with m, so it alone sets both m* and the
      constant c = 1.6986. Removing it does not improve the algorithm's solve, its
      topology, its subspace or its cofactor -- it dissolves the optimisation that
      produced the exponent. Everything else in the construction is a cofactor by
      construction.
    baseline_embedding:
      parameter_slice: >-
        The exact old-method boundary is the degenerate typing v_1 = ... = v_m, at
        which the typed family IS the untyped family. On that slice every formula,
        every cost surface and every degree measurement must return Semaev's own
        values, including m* = sqrt(2 ln 2 n / ln n), c = 1.6986, and the 36 cells of
        Table 3.
      reproduction_check: >-
        Frozen fixture: the 36 numeric cells of Table 3 and the (n, m, t, k,
        exp_prob, P_theoretical, d_F4, avg_seconds, total_MB) rows of Tables 1 and 2
        in inputs/SEMAEV-2015-310/tables.yaml, reproduced to the 0.7% already
        established there, under both the ceiled and unceiled k readings that file
        records as disagreeing. A reproduction is accepted only if it also recovers
        c' = sqrt(2 ln 2) symbolically, since that is what identifies the m! as the
        carrier rather than merely fitting the number.
    observation_collision:
      observable: >-
        The single number "total cost exponent" that eq. (17) reports, and the single
        number "d_F4" that Assumption 1 bounds.
      distinct_preimage_search: >-
        Two searches on the two observables. (a) For the cost exponent: exhibit two
        distinct cost models -- Semaev's untyped model with d_F4 <= 4, and the typed
        model with d_F4 ~ 0.196 sqrt(n / ln n) -- that produce the SAME total exponent
        1.6986 sqrt(n ln n). They do so by construction, which is the content of (C5):
        the published exponent does not identify the degree, so no measurement of the
        exponent can ever confirm Assumption 1. (b) For d_F4: exhibit a typed and an
        untyped instance at the same (n, m, t, k) and the same seed whose measured
        step degrees collide at 4 while their yields differ by m!. Both collisions are
        cheap and both are predicted; either one alone shows that the paper's two
        headline numbers are not jointly identifiable from what it reports.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the single factor base F = {P : x(P) in V} by the coset-typed
          family F_i = {P : x(P) in V + v_i}, equivalently replace the tracked object
          "unordered multiset of factor-base points" by "type-indexed tuple".
        predicted_gain: >-
          A factor (m-1)! in stage 1 at fixed (n, m, k) -- exactly log2((m-1)!) bits,
          25.25 bits at n = 571, m = 12 -- at zero cost in equation count, variable
          count or algebraic degree, and with the d_ff = 4 argument intact. The
          exponent consequence is not a gain but a collapse, and the collapse is the
          deliverable.
      - transform: boundary_lift
        proposed_object: >-
          m released from Semaev's optimum sqrt(2 ln 2 n / ln n) to the full feasible
          range 2 <= m <= n, which is only meaningful once the m! is gone because
          with the m! present the optimum is interior and the release changes nothing.
        predicted_gain: >-
          Exposes that the typed objective has no interior optimum, which is the
          structural signature that a constraint is missing from the model. No
          algorithmic gain is claimed; the diagnostic is the gain.
      - transform: observable_fiber
        proposed_object: >-
          Hold the exponent 1.6986 sqrt(n ln n) fixed and vary the forgotten
          structure: the symmetry factor, the degree, and the cofactor. The fibre is
          two-dimensional (symmetry factor x degree) and the published number picks
          out a curve in it, not a point.
        predicted_gain: >-
          Names precisely which published claims are jointly identifiable from
          eq. (17) and which are not, and converts "is Assumption 1 true" into "what
          is the exchange rate between the symmetry factor and the degree", which is
          measurable at n <= 21.
    quantifier_order: >-
      ASSERTED HERE: FOR ALL n, FOR ALL m with 2 <= m <= n, FOR ALL k = ceil(n/m),
      FOR ALL F_2-subspaces V of dimension k, FOR ALL coset representatives
      v_1, ..., v_m in pairwise distinct cosets of V -- IF the typed Boolean system
      equivalent to (5) has d_F4 <= 4 (HEUR-A1T) AND the typed yield law HEUR-YT
      holds, THEN ECDLP on E(F_{2^n}) is solved in n^{O(1)} operations by the stated
      algorithm. Contrapositive, which is the operative form: FOR ALL n, IF ECDLP on
      E(F_{2^n}) requires more than 2^{1.6986 sqrt(n ln n)} operations, THEN THERE
      EXISTS m <= n at which d_F4 for the typed system exceeds
      0.196 sqrt(n / ln n) / (1 + o(1)). Note the existential on m in the
      contrapositive: the record does NOT claim the degree is large at Semaev's
      m* = 11, only that it is large SOMEWHERE in the range Assumption 1 quantifies
      over. Collapsing that existential into a universal would overstate the result,
      and is the specific misreading to guard against.
    method_ceiling:
      strongest_certifiable_claim: >-
        Exactly and without compute: the symbolic identity that log2(m!) is the unique
        m-growing term in the untyped balance and therefore fixes c' and c; the affine
        invariance of the d_ff = 4 argument; the counting cap 2^{mk}/m! on the untyped
        image and 2^{mk} on the typed one; the full typed and untyped cost surfaces
        under stated (omega, omega'); and the necessary-condition inequality on d.
        With compute at n <= 21: exact typed and untyped image sizes, d_ff, the
        degree-4 closure predicate, Macaulay ranks at D = 4, and step-degree traces
        for one named open-source engine. It CANNOT certify anything about MAGMA's F4,
        anything about d_F4 at m > 6, or anything at n = 409 or n = 571.
      nearby_object_control: >-
        Two nearby objects where the argument's conclusion is known false, and the
        argument must fail on both. (i) Galbraith-Gebregiyorgis's OWN setting: the
        single summation polynomial in elementary symmetric coordinates, where coset
        typing demonstrably costs extra variables and their measured benefit is
        "moderate" and "not conclusive". The argument must NOT go through there, and
        the reason it does not -- symmetrised coordinates -- is exactly (C2)'s
        mechanism. An argument that also collapses GG's setting to polynomial time
        has proved too much and is wrong. (ii) Trimoska et al.'s setting, where the
        m! is removed on the search side and the total is O~(2^{n+l}), worse than
        2^{n/2}. The argument must not collapse that either, and the reason it does
        not is that their solve is exponential in l. These two controls are what
        distinguish a real mechanism from an arithmetic slip, and they cost nothing.
    proof_obligations:
      - claim: >-
          log2(m!) is the unique term in eqs. (15)-(16) whose leading order grows
          with m, and equating the two stages returns c' = sqrt(2 ln 2) and
          c = 2/(2 ln 2)^{1/2} = 1.69864
        responsibility: baseline
      - claim: >-
          deg_{F_2} S_3(u, v_1+y_1, v_2+y_2) = 3 and
          deg_{F_2} y_1 S_3(u, v_1+y_1, v_2+y_2) = 3 for all v_1, v_2, so the
          d_ff = 4 argument is affine-invariant and transfers to the typed system
        responsibility: correctness
      - claim: >-
          The coset-typed chained Boolean system has exactly n(t-1) equations,
          n(t-2) + kt variables and algebraic degree 3, identical to the untyped one
        responsibility: size
      - claim: >-
          A single factor base of size 2^k admits at most binom(2^k + m - 1, m)
          distinct m-fold sums, so the m! is an information-theoretic cap and not an
          accounting artifact; m distinct cosets lift the cap to 2^{mk}
        responsibility: success_probability
      - claim: >-
          Under HEUR-A1T and HEUR-YT the typed algorithm runs in n^{O(1)}, with
          O(n^{14}) block and O(n^{26}) plain at omega = 3
        responsibility: runtime
      - claim: >-
          Lemma 2's conditional equivalence holds for the typed system under the
          type-indexed proper-subset hypothesis, which quantifies over strictly fewer
          tuples than the untyped hypothesis; and the order-2 channel is unaffected
        responsibility: correctness
      - claim: >-
          For Semaev's bound to survive typing, d(n, m) >= 0.196 sqrt(n / ln n) at
          omega = 3, contradicting Assumption 2's o(sqrt(n / ln n))
        responsibility: strictness
      - claim: >-
          The argument does NOT go through in GG's symmetrised presentation nor in
          Trimoska et al.'s search-side setting
        responsibility: scope
      - claim: >-
          Nothing here bears on the security of any deployed curve in either
          direction, and the polynomial-time branch is a reductio and not a claim
        responsibility: scope
    not_applicable_reason: null
  dominated_by:
    status: >-
      n/a (no algorithm claimed). The record's asserted content is a dichotomy and a
      necessary-condition inequality on a degree, which put no point on the
      time/memory/data frontier. The two CONDITIONAL branches would, if their
      premises held, dominate every row below on time -- which is precisely the
      argument that their premises do not hold. Stating that as a Pareto improvement
      would be a fabrication of the kind AGENTS.md core rule 5 forbids.
    checked_rows:
      - name: van Oorschot-Wiener parallel rho with distinguished points
        time: ~0.886 * 2^{n/2} group operations total; 2^{n/2}/M per processor
        memory: distinguished-point store only, small per processor
        data: group-law walk queries; no oracle
        conditionality: unconditional apart from the random-walk heuristic, which is measured to hold
      - name: Pollard rho (serial, 1978)
        time: ~2^{n/2}
        memory: O(1)
        data: walk queries
        conditionality: unconditional apart from the same heuristic
      - name: BSGS
        time: ~2^{n/2}
        memory: ~2^{n/2}
        data: ~2^{n/2} table entries
        conditionality: unconditional
      - name: Semaev 2015 chained S_3, untyped (the construction being developed)
        time: conditional 2^{1.6986 sqrt(n ln n)}; Table 3 gives 2^{186.0} at n = 571
        memory: 2^{ceil(n/m)} relations, 2^{48} at n = 571, plus an F4 working set derived at 2^{91.8} bits; no memory column in the paper
        data: ~2^{ceil(n/m)} relations
        conditionality: Assumption 1, or Assumption 2 for the bound alone
      - name: Semaev 2015 chained S_3, coset-typed (this record)
        time: conditional n^{O(1)} under HEUR-A1T; 2^{epsilon sqrt(n ln n)} for all epsilon under typed Assumption 2
        memory: m 2^{ceil(n/m)} relations plus an uncosted large-m solver working set
        data: m 2^{ceil(n/m)} relations
        conditionality: HEUR-A1T and HEUR-YT, both of which this record argues against
      - name: Karabina 2015/319 section 5 all-S_3 at m = 5
        time: conditional ~2^{31} 2^{n/5} n^{12} + 2^{2n/5}; crossover stated at n > 457
        memory: 2^{n/5} relations; Table 2 reports 6421.9 MB at n = 15 falling to 256.3 MB with wing preprocessing
        data: 2^{n/5} relations
        conditionality: D_reg staying at its observed 4, which the paper calls only "tempting"
      - name: Petit-Quisquater 2012
        time: conditional 2^{c n^{2/3} ln n}, c < 2
        memory: not stated in the corpus record
        data: relations
        conditionality: a first-fall-degree assumption
      - name: Trimoska-Ionica-Dequen 2019/313 SAT with search-side symmetry breaking
        time: O~(2^{n+l}); PDP worst case 2^{ml}/m!
        memory: reported as a non-constraint -- 17 MB where Groebner needed over 200 GB
        data: 2^l relations
        conditionality: worst-case bound is proved for their solver; the yield uses the standard heuristic
      - name: Gaudry / Diem index calculus
        time: subexponential along non-prime extension degree
        memory: relation store
        data: relations
        conditionality: out of scope -- n is prime here
      - name: Faugere-Gaudry-Huot-Renault symmetrised index calculus
        time: claimed ~2^{omega(n-1)} reduction in the decomposition solve for curves with the relevant symmetries
        memory: not stated in the corpus record
        data: relations
        conditionality: corpus record only; full text unread
    missing_comparisons:
      - >-
        No quantum row. Shor's algorithm dominates every classical row on time and is
        omitted deliberately: the frontier here is the classical one the goal's
        crossover claim is stated against, and saying so is part of checking rather
        than an oversight.
      - >-
        Joux-Vitse's hybrid / "m = n-1 with a smaller factor base" point was NOT
        placed on the frontier; it is the nearest untabulated row and is named as a
        gap rather than left silent.
      - >-
        No numerical Pareto sweep over (m, k) at fixed n was performed here; the
        untyped sweep belongs to IDEA-20260913-9c54f9 and the typed sweep is forward
        work.
    note: >-
      dominated_by is "n/a (no result claimed)" and NOT null. Every row above was
      checked on time, memory and data/queries, and the conditionality column is
      carried because a conditional row and an unconditional row are not comparable
      on the same axis -- vOW rho at 2^{n/2} with negligible memory dominates every
      conditional index-calculus row in the only sense that matters today, namely
      that it is known to work.
  sota_delta:
    established_time_exponent_improvement: 0
    established_memory_exponent_improvement: 0
    conditional_delta: >-
      Under HEUR-A1T: from 2^{1.6986 sqrt(n ln n)} to n^{O(1)}, i.e. the exponent
      goes from Theta(sqrt(n ln n)) to Theta(log n) -- offered as a reductio, not as
      a result. Under typed Assumption 2: the constant 1.6986 becomes arbitrarily
      small, i.e. 0 conditional exponent improvement in the Theta sense but a
      complete loss of the constant. At fixed (n, m) the typed stage-1 saving is
      exactly log2((m-1)!) bits: 25.25 bits at n = 571, m = 12; 21.8 bits at
      n = 571, m = 11; 15.3 bits at n = 283, m = 8. What the record ESTABLISHES is
      0 improvement and one inequality.
    quantitative_statement: >-
      Decides, by derivation at zero compute cost, which of GOAL-SEMBIN-cbf422's four
      unrevisited choices can move the exponent: none, because the exponent is fixed
      by a single term the four choices do not touch. Produces a numbered necessary
      condition, d >= 0.196 sqrt(n / ln n) at omega = 3, that any defence of
      eq. (17) against a published factor-base device must meet, and that contradicts
      the paper's own Assumption 2 by a constant factor. Reduces the uncertainty in
      the goal's objective from "which of four" to "one specific term, plus a
      measurable exchange rate", at an expected cost under 1 CPU-hour for the
      load-bearing parts.
    measurement_status: unmeasured
  authorized_runs: 0
  inference:
    requested_policy: research-deep
    requested_reasoning_effort: high
    model_verified: false
    api_probe_performed: false
    fallback_used: false
    degraded_requirements: []
