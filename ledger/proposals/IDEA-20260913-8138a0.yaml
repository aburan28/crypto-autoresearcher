idea:
  id: IDEA-20260913-8138a0
  title: >-
    The m! is the only exponent carrier: coset-typed factor bases in the chained
    S_3 system erase the constant 1.6986 under Semaev's own Assumption 2 and
    collapse the construction to polynomial time under his Assumption 1, so the
    first-fall-degree step must fail by at least 0.196 sqrt(n / ln n)
  class: mechanism
  claim: >-
    SCOPE. Standalone mathematical instances and derivations from Semaev 2015
    (KN-LIT-fa346d, frozen at inputs/SEMAEV-2015-310/) and Galbraith-Gebregiyorgis
    2014/806 (KN-LIT-439, full text read in this task). The n values below are
    parameter labels in a cost model. NO claim about the security of any FIPS PUB
    186-4 binary curve in either direction, and no claim that any algorithm here is
    fast -- the load-bearing conclusion runs the other way, against an assumption.

    CLAIM, in five independently falsifiable parts.

    (C1) EXPONENT LOCALISATION -- a derivation, not a heuristic. In Semaev's own
    two-stage model, write m = c' sqrt(n / ln n). Then log2 of stage 1 (eq. 15) is
    [c'/(2 ln 2) + 1/c'] sqrt(n ln n) + O(log n) and log2 of stage 2 (eq. 16) is
    (2/c') sqrt(n ln n). Equating them gives c'^2 = 2 ln 2, hence
    c' = sqrt(2 ln 2) = 1.17741 -- which is exactly the m* of eq. (17) -- and total
    exponent 2/c' = 1.69864, which is exactly Semaev's
    c = 2/(2 ln 2)^{1/2}. The ONLY term in that balance that grows with m is
    log2(m!) ~ (c'/(2 ln 2)) sqrt(n ln n), contributed by the 1/t! of the Section 4.3
    yield model. Delete it and the objective is monotonically DECREASING in m with
    no interior optimum. Therefore the symmetry factor m! alone fixes the constant
    1.6986; k, t, the chaining topology, the choice of subspace and the n^{4 omega}
    cofactor contribute O(log n) to the exponent and cannot move it. This answers
    GOAL-SEMBIN-cbf422's central question directly, and it answers it in the
    negative for three of its four sub-objectives.

    (C2) THE m! IS REMOVABLE AT ZERO COST IN THIS PRESENTATION, which is exactly
    what is not true in the presentation where the device was published. Replace the
    single factor base F = {P : x(P) in V} by m coset-typed bases
    F_i = {P : x(P) in V + v_i} with the V + v_i distinct -- verbatim
    Galbraith-Gebregiyorgis section 4.2, read in this task: "we expect the number of
    points in {P_1 + ... + P_m : P_i in F_i} to be roughly 2^{lm}. Note that there is
    no 1/m! term here." Their net gain is (m-1)! rather than m! because the factor
    base is m times larger, and they report the device costs them extra variables --
    but ONLY because they express summation polynomials in ELEMENTARY SYMMETRIC
    variables, and the additive coset shift is what obstructs the symmetrisation
    ("we require one more variable than the previous case, and things get worse for
    higher degree terms"). Semaev's chained system contains no symmetric variables
    at all: x_1, ..., x_t appear individually. Substituting x_i = v_i + y_i with
    y_i in V is then an AFFINE change of the Boolean variables, so the coset-typed
    chained system has the identical equation count n(t-1), the identical variable
    count n(t-2) + kt, and the identical algebraic degree 3. GG's own objection to
    their own device therefore does not transfer, and that asymmetry is the
    mechanism.

    (C3) THE FIRST-FALL-DEGREE ARGUMENT TRANSFERS VERBATIM -- provable, not assumed.
    Semaev's Section 4.5 proof that d_ff = 4 is the pair of facts
    deg_{F_2} S_3(x_1,x_2,x_3) = 3 and deg_{F_2} x_1 S_3(x_1,x_2,x_3) = 3 against
    deg_{F_2} x_1 + deg_{F_2} S_3 = 4. Both are statements about F_2-degrees of
    coordinate functions, i.e. about Hamming weights of exponent vectors, and are
    invariant under any affine F_2-substitution of the field variables. Writing
    x_i = v_i + y_i, the top monomials of y_1 S_3(u, v_1+y_1, v_2+y_2) are
    y_1^2 y_2 u, y_1^3 y_2^2, y_1^3 u^2 and y_1 y_2^2 u^2, of F_2-degrees 3, 3, 3, 3
    -- the degree fall at 4 survives. So Assumption 1's ENTIRE published
    justification applies to the coset-typed chained system exactly as it applies to
    the untyped one. The proposal therefore does not weaken Assumption 1 to get its
    conclusion; it applies it where its own stated reason reaches.

    (C4) THE CONDITIONAL COLLAPSE, with numbers computed in this task from the
    paper's own formulas. Let Assumption 1' be Assumption 1 with "a subspace V of
    dimension k" replaced by "coset-typed bases V + v_i of dimension k". Under
    Assumption 1', the coset-typed chained algorithm runs in time n^{O(1)}: take
    m = n / ceil(log2 n), so k = ceil(log2 n), the yield is Theta(1), the factor base
    has m 2^k ~ n^2 / log2 n points, and each solve costs n^{4 omega} (block form) or
    [n(m-1)]^{4 omega} (plain F4) -- giving O(n^{14}) and O(n^{26}) respectively at
    omega = 3. At CONCRETE parameters the same formulas, with k = ceil(n/m) and the
    2^{n-mk} correction, return (stage-1 exponents, base 2, computed here):
      n = 283: untyped m* = 8 -> 2^{149.0} block / 2^{182.8} plain;
               typed m = n -> 2^{106.9} block / 2^{204.6} plain; model rho 2^{141.5}.
      n = 409: untyped m* = 10 -> 2^{166.9} / 2^{204.9};
               typed m = n -> 2^{113.8} / 2^{217.9}; model rho 2^{204.5}.
      n = 571: untyped m* = 11 -> 2^{187.1} / 2^{227.0} (Table 3 reports 2^{186.0}
               at m = 12, so the reproduction calibrates);
               typed m = n -> 2^{120.0} / 2^{229.9}; model rho 2^{285.5}.
      n = 1000: typed m = n -> 2^{130.6} block / 2^{250.1} plain; model rho 2^{500}.
    The diagnostic is not the size of any single number, it is that the typed cost is
    MONOTONICALLY DECREASING IN m with no minimum inside 2 <= m <= n. A cost model
    with no optimum is a model that has lost a constraint. At m = n = 571 the system
    Assumption 1' is being asked about has N = 325,470 Boolean variables and the
    assumption asserts that a degree-4 Macaulay closure determines its solutions.

    (C5) THE CONTRAPOSITIVE, quantified, which is what this record actually asserts.
    Since the conclusion of (C4) is not believed, Assumption 1' fails, and the
    minimum failure rate is computable. For the typed variant not to beat Semaev's
    own 2^{1.6986 sqrt(n ln n)} at any m, the solving degree must satisfy
      d(n, m) >= [c - 1/c'] sqrt(n ln n) / (omega log2(n(m-1))),
    which at the m = n/log2 n route and omega = 3 is
      d >= (c ln 2) / (2 omega) sqrt(n / ln n) = 0.196 sqrt(n / ln n),
    and 0.248 sqrt(n / ln n) at omega = 2.376. This CONTRADICTS Semaev's own
    Assumption 2 (Section 4.6: d_F4 = o(sqrt(n / ln n))) by a constant factor.
    Equivalently and more sharply: under Assumption 2 as literally stated -- which
    quantifies over m = O(sqrt(n / ln n)), hence over every constant c' -- the
    coset-typed variant runs in 2^{(2/c') sqrt(n ln n)} for every constant c', so
    for every epsilon > 0 there is an algorithm at 2^{epsilon sqrt(n ln n)} and NO
    positive constant survives in front of sqrt(n ln n). Semaev's Section 4.6
    sentence "the asymptotical bound does not depend on any first fall degree
    assumption" is therefore true only because the m! is left in place; the bound
    (17) is a statement about the symmetry loss and not about the degree.

    WHAT WOULD MAKE THIS A POSITIVE RESULT INSTEAD. If the measured solving degree
    of the coset-typed chained system tracks the untyped one as m grows, the
    conditional exponent improvement of (C5) stands as a conditional exponent
    improvement and must go to review-breakthrough. Galbraith-Gebregiyorgis's own
    measurement points that way rather than away: at m = 3 they report that "for
    larger values of n, the degree of regularity D_reg is often 3 when using
    symmetry-breaking while it is 4 for most values in experiment 2. The reason for
    this is unclear." The degree went DOWN, not up. That is one cell of one table in
    a different presentation and it settles nothing; it is why the experiment is
    worth running rather than argued.
  mechanism: >-
    OBJECT FRAME. The tracked object in the Section 4.3 yield model is the
    UNORDERED multiset {x_1, ..., x_t}, which is the S_t-orbit of the ordered tuple.
    That is a genuinely lossy projection of the tuple: it discards the ordering, and
    eq. (11)'s K ~ |V|^t / t! is the price of the discard, charged as inverse success
    probability. A lossy projection is a RESOURCE only if the algorithm downstream
    of it works in the quotient. Faugere-Gaudry-Huot-Renault (KN-LIT-004) do exactly
    that: they solve in elementary symmetric coordinates and collect a claimed
    ~2^{omega(m-1)} reduction in the solve. Semaev's chain does not: it is a path of
    S_3 constraints on the individual x_i and the auxiliary partial sums, and the
    partial sums are not S_t-invariant, so the chain is not a computation in the
    quotient at all. The chained presentation therefore PAYS THE COST OF A
    PROJECTION IT DOES NOT USE. Coset typing un-projects: it replaces the orbit by
    the ordered tuple with typed coordinates, which is not a lossy projection and
    hence carries no orbit-canonicalisation price. The lossy-projection test is what
    distinguishes this from GG's setting, where the projection IS used and
    un-projecting costs their symmetrisation.

    WHY THE TWO PUBLISHED m! REMOVALS ARE NOT THIS. There are two distinct factorials
    in the literature and conflating them is the standing trap. (i) The PROBABILITY
    m!, in eq. (11), removed by coset-typed bases (GG 2014/806 section 4.2, net
    (m-1)!). (ii) The SEARCH m!, the redundancy of the m! permuted satisfying
    assignments inside one solver call, removed by Trimoska-Ionica-Dequen 2019/313
    with an ordering constraint x_1 <= ... <= x_m in a DPLL solver, taking worst-case
    PDP cost from 2^{ml} to 2^{ml}/m!. Their Theorem 1 keeps the probability
    factorial explicitly -- "the probability that a random point can be written as a
    sum of m factor basis elements is heuristically approximated by 2^{ml}/(m! 2^n)"
    -- and their total is O~(2^{n+l}), worse than 2^{n/2}, precisely because their
    solve is exponential in l. So: removal (ii) is coupled to an exponential solver
    and buys nothing asymptotically; removal (i) has never been combined with a
    presentation whose solve is claimed POLYNOMIAL. Semaev's chain is the first such
    presentation, and the combination is unexamined. That, and nothing else, is the
    novelty here.

    WHY THE COLLAPSE IS STRUCTURAL RATHER THAN ARITHMETIC. With the m! present, the
    objective n/m + log2(m!) + 2n/m has a genuine interior minimum because
    log2(m!) ~ m log2 m rises while 2n/m falls -- the balance is between a symmetry
    loss that grows with the number of summands and a relation store that shrinks
    with it. Remove the rising term and no balance exists: every cost term falls with
    m, so the model's optimum runs to the boundary m = n where the factor base is m
    single points and the decomposition problem is a subset-sum over n group
    elements. A model that prices subset-sum over n generators at n^{14} is
    mispricing something, and the only thing left to misprice is the degree. This is
    "controls before belief" applied to an argument rather than a measurement: the
    cost formula is run at parameters where its conclusion is known false, and it
    still goes through.

    WHAT MUST HAPPEN TO LEMMA 2, stated because the goal requires it. Lemma 2's
    conditional equivalence has hypothesis "S_{i+1}(x_1,...,x_i,R_X) = 0 not
    satisfiable for 2 <= i < t with x_1,...,x_i in V". Under coset typing the
    hypothesis becomes: for every proper subset S of the type set, the system
    S_{|S|+1}(x_i : i in S, R_X) = 0 has no solution with x_i in V + v_i. That
    quantifies over FEWER tuples than the untyped hypothesis at the same k, so it is
    strictly EASIER to satisfy and the conditional equivalence is more often in
    force, not less. Two further consequences must be carried and neither is free:
    (a) the algorithm as written in Section 3 step 3 loops t = 2, ..., m, and under
    typing the length-t sub-systems are indexed by which t of the m types are used,
    so a literal loop would cost C(m,t) systems; the typed algorithm does NOT take
    that loop -- it solves only the full length-m typed system, whose yield is
    exactly the 2^{mk-n} the model charges, and it therefore forgoes the
    "probability of solving at least one of the first t-1 systems" bonus that
    Section 4.3 leans on. (b) Lemma 2 part 1's order-2 channel is untouched by
    typing: H = (x_1,y_1) + ... + (x_s,y_s) is a rational point of order exactly 2
    regardless of which coset each x_i came from, so typed solutions with
    y_i in F_{q^2} \ F_q remain usable relations on the same terms
    (quantified separately in IDEA-20260913-6814f7).
