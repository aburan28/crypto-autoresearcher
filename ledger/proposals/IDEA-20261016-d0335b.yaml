idea:
  id: IDEA-20261016-d0335b
  question_id: RQ-SEMBIN-9e8f82
  status: proposed
  added: '2026-10-16'
  title: "Chain-length law of the assumption-free solving degree: HKYY constructible-space pinning/refutation degree D(m) on coset-typed chains versus chain, balanced-tree and topology-matched nulls: flat (Theorem 1), saturating, or linear in m (measured obstruction)"
  class: measurement
  claim: |
    On Weil-descended typed chains EQS4(m) at toy (n,k) let D_pin(m) be the least D with the reduced Groebner basis inside the HKYY space V_{F,D} (arXiv:1505.02532 Def 2.1: smallest space containing F, closed under multiplication while degree <= D): for a satisfiable instance with a UNIQUE decomposition the N linear forms y_j+z_j; for an unsatisfiable one (D_ref) the constant 1. By Prop 2.6(ii), 2.8 this is an assumption-free certificate d_lf <= D and a solve cost <= poly((N+D)^D). Claim: D(m) is not bounded by 4; the least-squares slope b = dD/dm on m in [3, m_max] satisfies b >= 0.5, against Theorem 1's 0. Second readout l_D(m): fraction of bits pinned by linear forms in V_D, D = 4, 5.
    First fall is LOCAL (min over blocks; IDEA-20261016-e191a8); the last fall is global and is what Theorem 1 needs at m ~ n/C_0. Semaev's Magma runs already show F4 final steps at degrees 5, 6, 7 on satisfiable systems at m <= 6 (lines 633-637): D_pin > 4 is expected at small m; the LAW in m is the question.
  mechanism: |
    OBJECT FRAME. Representation: R1 (x on disjoint cosets V+v_i, descended). Sigma: translation by Fb elements; Class I partial-action. Tracked object: V_D of the whole chain projected to its linear-form and constant content; lossy (drops degree >= 2 content), Sigma-compatible (affine variable shifts map V_D to V_D, HKYY Prop 2.3(iv)).
    R enters only the last block, so linking block 1 to R crosses m-2 n-bit variables; partial sums P_i = {x(P_1+..+P_i)} have 2^{ki} points and, if generic, a degree-d description needs C(n,<=d) >= 2^{ki} (IDEA-20261016-7a138a). Laws: (L) flat <= 4 after a radius (Theorem 1's shape; breakthrough-adjacent); (P) D ~ a + b m (obstruction); (S) semi-regular null D ~ cN. Arms: chain; balanced S_3 tree at identical (N, equations, yield; IDEA-20260913-c94e52 C1), which separates graph distance (tree better) from bits per merge (tree worse); topology-matched random-cubic null (IDEA-20260808-11b8c7), which separates elliptic structure from wiring.
  novelty_status: speculative
  citations:
    - {ref: "arXiv:1505.02532 Def 2.1, 2.5, Prop 2.6, 2.8, Thm 1.1", provenance: retrieved, claim: "last fall = largest degree fall; solving by V_d at cost poly((m+d)^d)", verified_by: "PDF pp.1-6 read; Sec 6: Thm 1.1 not useful for summation systems"}
    - {ref: "Semaev 2015 Tables 1-2 (KN-LIT-fa346d)", provenance: internal, claim: "F4 steps 4, then 5,6,7 on satisfiable systems, m <= 6, n 12-17", verified_by: "read lines 630-760"}
    - {ref: "arXiv:1906.05594 (KN-LIT-024)", provenance: kb, claim: "first fall of S_{m+1} presentation ~ m^2-m", verified_by: abstract_read}
  assumptions: ["Planted-R instances with a unique decomposition represent satisfiable instances.", "Toy k in {1,2}, n in {6,8,10}: the law, not the constant, is the claim."]
  proof_search_map:
    bottleneck: "Assumption 1 at N ~ n^2/C_0 (EV-SEMBIN-f4408c: successor is 'a measured degree on EQS4')"
    baseline_embedding: {parameter_slice: "m=3..6 unshifted, n=12 (Semaev Table 1)", reproduction_check: "D_ref <= 4 on unsat cells, D_pin in [4,7] on sat cells; sizing from EXP-SEMBIN-7e1371"}
    observation_collision: "systems with equal (N, first fall) and different D_pin show first fall is too coarse"
    quantifier_order: "Theorem 1 needs FORALL m <= n/C_0: D(m) <= 4; one satisfiable cell with D > 4 and positive slope refutes it at that scope"
    method_ceiling: {strongest_certifiable_claim: "instance-level d_lf <= D at toy sizes plus a fitted law", nearby_object_control: "random cubic system, same wiring and support"}
  predictions:
    - {metric: "slope b of D_pin(m), typed chain", direction: higher, minimum_effect: "b >= 0.5 per link (competing |b| < 0.2)"}
    - {metric: "slope ratio b_chain / b_null-wiring", direction: different, minimum_effect: "outside [0.8, 1.25] = structure; inside = wiring"}
    - {metric: "D_ref(m) - D_pin(m)", direction: different, minimum_effect: "sign and size; refutation cheaper than pinning justifies a two-stage filter"}
  minimal_test:
    design: "n in {6,8,10}, k in {1,2}, m = 3..m_max; sizes sum_{j<=D} C(N,j) priced by the BATCH-9d649f sizing first; D <= 6; 30 planted + 30 unsatisfiable targets per cell; arms typed chain, balanced tree, wiring null, v_i in V (untyped; l_D only). Closure in HKYY-literal (polynomial ring with S_fe) and Boolean-ring variants, both reported. Bootstrap CI on the fit."
    controls: ["wiring null", "v_i in V exact null (IDEA-20261016-e191a8)", "n-scaling at fixed m (D/N) for small-n saturation"]
    required_metrics: ["D_pin, D_ref, l_4, l_5", "closure variant", "N, sum C(N,<=D)"]
  falsification_conditions: ["D_pin <= 4 at every m <= m_max, slope CI containing 0, while the null grows: corroborates Assumption 1 at toy scale (breakthrough-adjacent; review-breakthrough; no curve claim).", "b >= 0.5 in the structured arm AND the null: growth is wiring, not elliptic structure.", "Infrastructure failure is not evidence."]
  confounders: ["small-n saturation", "k=1 gives |Fb_i| = 2", "empty cosets", "definition variant (EV-SEMBIN-c71cad)", "planted vs random R"]
  interpretation_limits: ["Toy scale; no transfer to n = 163..571.", "D_pin upper-bounds d_lf.", "No claim about any curve."]
  heuristic_assumptions:
    - {id: H1, statement: "D_pin over planted unique-decomposition R has the law of D_pin over random satisfiable R", rigorous_support: "planted R is uniform over the sumset image", validation_plan: "n <= 8: all satisfiable R by enumeration; two-sample KS"}
    - {id: H2, statement: "D(m) = a + b m with residual SD <= 0.5", rigorous_support: "HKYY Thm 1.1 as paraphrased by the fetch tool is linear in m up to logs (formula unverified)", validation_plan: "hold out last m; constant vs sqrt(m) vs linear by AIC"}
  target_complexity: {time_exponent: "claims none. If b > 0 cost is N^{(a+bm)w} = exp(Theta(n log n / C_0)) and the lane is dominated by rho; if b = 0 Theorem 1's shape is supported at toy scale", memory_exponent: "(N+D)^{2D} dense", best_known: "Nagao n^{8w+1} conditional; vOW 2^{n/2}", hidden_overhead: "p^{C_0}/C_0, C(N+D,D)", tradeoff_note: none}
  estimated_cost: {implementation: high, compute: medium}
