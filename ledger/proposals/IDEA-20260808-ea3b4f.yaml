idea:
  id: IDEA-20260808-ea3b4f
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-FIND-001
  goal_id: GOAL-FIND-001
  title: 'The three GGM-simulability closures are being cited as if they closed RESOURCES
    when they closed ORACLES: KN-FIND-002 / -b7e091 / -982fdf say a certain oracle class is
    simulable in the generic group model, which by construction says nothing about resources
    R1 (field data), R6 (lifts) and R7 (pairings) that are not group-oracle outputs - and
    the proposal is to test that scope conformance on real citations rather than to assert
    it'
  class: control
  claim: '(A) WHAT THE THREE FINDINGS SAY. KN-FIND-002 ("jet and endomorphism ECDLP oracles
    are GGM-simulable with O(1) overhead"), KN-FIND-b7e091 ("GGM closure of incidence and
    endomorphism oracle classes"), and KN-FIND-982fdf ("C_t-minimality theorem - the threshold
    oracle is the minimal non-simulable order-based factor-base identifier") are statements
    about ORACLES: augmentations of the generic group-operation oracle whose outputs a simulator
    can produce from the group structure alone. Their force is exactly Shoup''s bound: an
    algorithm using a simulable oracle inherits the Omega(sqrt(N)) lower bound. (B) WHAT THEY
    CANNOT SAY, AS A MATTER OF THE MODEL. The generic group model hides the ENCODING. A method
    whose input is not an oracle response but the actual field element x(P) in F_p - index
    calculus and Semaev, resource R1 in DECOMPOSITION.md''s taxonomy - is outside the model
    by construction, which is precisely why prime-field index calculus is an open problem
    (KN-OPEN-001) rather than a closed one. Likewise resources R6 (lifts to char 0 or Z_p:
    a DIFFERENT group) and R7 (pairings into F_{p^k}: a DIFFERENT group) are not oracle augmentations
    of G. So the three findings close their oracle classes and nothing else, and any citation
    of them against an R1, R6 or R7 method is a scope overreach. (C) WHY THIS NEEDS A TEST
    RATHER THAN AN ASSERTION. The generator brief given to this bulk round lists KN-FIND-002
    / b7e091 / 982fdf under "closes whole families of ideas" and instructs generators not
    to propose against them "without an explicit, stated reason why your idea escapes the
    closure". That instruction is correct for oracle-shaped proposals and over-broad for R1/R6/R7-shaped
    ones, and a generator reading it under time pressure has an incentive to self-censor a
    legitimate R1 idea. The failure mode is therefore false NEGATIVES in ideation - the direction
    the inventor protocol names as symmetric with overclaiming - and it is invisible unless
    someone counts. (D) THE PROPOSED CHECK, WITH A BINARY CRITERION. Take every record in
    ledger/ and ideas/ that cites one of the three findings as a closure. For each, classify
    the cited-against method by resource (R1-R8, or "oracle"). A citation is CONFORMANT if
    the method is oracle-shaped, or if the record states an additional argument covering the
    non-oracle resource; NON-CONFORMANT otherwise. Report the counts, and for each non-conformant
    citation state what the record would need to add. If the count is zero, the corpus is
    sound on this axis and the check is retired - a legitimate and likely outcome. (E) PAUSE
    FLAG. GOAL-FIND-001 is paused. This is an idea filed against a paused goal at the requesting
    agent''s instruction, not a request to resume it, and it changes no record''s status.'
  mechanism: 'A closure''s force comes from a model, and a model has a boundary. Citations
    migrate across that boundary silently because the finding''s TITLE names the conclusion
    ("closed") without naming the model''s input assumption. The corrective is the same as
    for any measurement: state the boundary in the record and then check, empirically, whether
    uses respect it.'
  why_not_a_renamed_known_approach: 'Nearest known: lane L12 / RQ-GGMB-6eaabc, which is the
    campaign''s internal falsifier and passes NEW oracle classes through a simulability audit.
    That lane checks whether new oracles simulate. This check runs in the opposite direction:
    it audits whether EXISTING closure citations stay inside the model, which L12 does not
    do and which no record in the corpus does. IDEA-20260807-569c82 and -d73e83 submit new
    oracles (PAIR, TRANSPORT) to L12; both are examples of the correct use this check would
    confirm.'
  predictions:
  - observable: conformance rate of closure citations
    metric: number of records citing KN-FIND-002 / b7e091 / 982fdf as a closure, classified
      conformant vs non-conformant by the (D) criterion
    predicted: 'conformance rate high but strictly below 1: the corpus is careful, and the
      most likely non-conformant cases are brief-level or summary-level restatements rather
      than ledger records. Direction: at least one non-conformant citation exists in the round-level
      scaffolding'
  - observable: asymmetry of the failure
    metric: for each non-conformant citation, whether it makes a claim STRONGER (closure over-applied)
      or WEAKER than the source
    predicted: essentially all over-application, none under-application, because a closure
      is quoted to save work and never to create it
  - observable: whether the check finds a live suppressed idea
    metric: number of R1/R6/R7 ideas in this bulk round declined or downgraded with one of
      the three findings cited as the reason
    predicted: small but non-zero; and each such case is a candidate for regeneration, which
      is the check's actual payoff
  minimal_test: A grep over ledger/ and ideas/ for the three finding ids, followed by a hand
    classification of each hit against the R1-R8 taxonomy in DECOMPOSITION.md section 2. Report
    a table with one row per citing record. No compute, under two hours. The check is designed
    so that the null result (all conformant) is cheap to establish and is a publishable outcome.
  controls:
  - 'POSITIVE CONTROL: include in the classification set two records known to be conformant
    (IDEA-20260807-569c82 and -d73e83, which submit new oracles to L12 correctly). The classifier
    must mark them conformant; if it marks them non-conformant it is too strict and its counts
    are meaningless.'
  - 'NEGATIVE CONTROL: construct one synthetic non-conformant citation (an R1 index-calculus
    idea declined with KN-FIND-002 as the sole reason) and confirm the classifier flags it.
    Two-directional, as the inventor protocol requires of any instrument.'
  - Independent classification of a 20% sample by a second session, with disagreements reported
    rather than reconciled silently.
  confounders:
  - Many records cite these findings as CONTEXT rather than as a closure; counting those as
    non-conformant would manufacture a defect. The criterion must distinguish "cited as the
    reason for declining" from "cited as related work", and the classification rule must be
    fixed before the grep.
  - Some R1 methods really are oracle-shaped in disguise (a factor-base membership test IS
    an oracle). Those are conformant, and mislabelling them would overstate the defect.
  - The author of this record is an idea generator in the same round; the classification should
    be done by a different session to avoid the obvious conflict of interest, and that is
    stated as a requirement, not a caveat.
  falsification_conditions:
  - 'Zero non-conformant citations across the whole corpus: the concern is unfounded, the
    check is retired, and the finding is that the corpus respects its own model boundaries
    - a clean and useful null.'
  - 'A demonstration that the three findings DO cover R1 (for example, a simulator that reproduces
    x-coordinate field data): then the closures are broader than this record says and this
    record is wrong in the direction that matters, since it would mean prime-field index calculus
    is closed - which would contradict KN-OPEN-001 and would be a far larger event.'
  interpretation_limits: This audits citations, not mathematics. It cannot show any closure
    is wrong; at most it shows some uses of a correct closure exceed its scope. It creates
    no permission to propose an oracle-shaped idea against the three findings, and any record
    it flags must still meet the ordinary bar on its own merits. No status changes; only the
    Coordinator may make those.
  assumptions:
  - The three findings are statements about oracle simulability in the generic group model
    [corpus, from their titles and from KN-FIND-b7e091's use in DECOMPOSITION.md section 2].
  - The R1-R8 resource taxonomy of DECOMPOSITION.md section 2 is the classification scheme
    [corpus].
  - KN-OPEN-001 ("does index calculus beat Pollard rho for prime-field ECDLP?") is open, which
    is itself evidence that R1 is not closed by any GGM result [corpus].
  heuristic_assumptions:
  - id: HA-1
    statement: No heuristic. The check is a census with a fixed criterion; its output is a
      count, not an estimate.
    rigorous_ingredient: The definition of the generic group model, in which the encoding
      of group elements is a random injection and field-level data about x-coordinates is
      not available to the algorithm.
    distribution_imitated: not_applicable
    validation_route: The two-directional control (known-conformant and synthetic non-conformant
      citations) validates the classifier before the census runs.
    tail_checks: not_applicable
  target_complexity:
    time_exponent: Not applicable; no algorithm. The record is explicitly exponent-irrelevant
      and is filed as an ideation-integrity control, with the justification that its payoff
      is measured in ideas incorrectly suppressed rather than in operations saved.
    memory_exponent: not applicable
    best_known_baseline: The current practice, in which closure scope is respected by convention
      and never audited.
    hidden_overhead_disclosure: none
    time_memory_tradeoff: not applicable
  sota_delta: 'Zero mathematically. Operationally: bounds a false-negative failure mode that
    the inventor protocol names as symmetric with overclaiming, at two hours of hand classification,
    with a cheap and informative null outcome.'
  dominated_by: n/a (no result claimed). No ECDLP frontier row is involved. Within the audit
    column, RQ-GGMB-6eaabc/L12 audits NEW oracles and is the closest thing; it does not dominate
    this check because it runs in the opposite direction and would not detect a scope-overreaching
    citation.
  estimated_cost: 'Implementation: low (grep plus a fixed classification rule). Compute: none.
    Requires an independent session for the classification.'
  recommended_priority: low
  honest_prior_of_survival: 0.6 that at least one non-conformant citation is found (the corpus
    is visibly careful, so the null is a real possibility). 0.25 that the check causes any
    idea to be regenerated. Filed LOW because the most likely outcome is a clean null and
    because the goal it serves is paused - but filed, because a clean null on this axis is
    itself worth having on record before the next bulk round cites the same three findings
    again.
  novelty_status: unverified
  novelty_screen: Screened against KNOWLEDGE_BARRIERS.txt (KN-FIND-002, b7e091, 982fdf, KN-OPEN-001,
    KN-OPEN-005, KN-OPEN-019), DECOMPOSITION.md section 2 and lane L12, EXISTING_PROPOSALS
    rows for RQ-GGMB-6eaabc (IDEA-20260807-569c82, -d73e83), GOAL-FIND-001.yaml, and the generator
    brief's own barrier list. WEB SEARCH UNAVAILABLE and not required for this record.
  discriminated_from: 'RQ-GGMB-6eaabc / lane L12 and its proposals (IDEA-20260807-569c82,
    -d73e83): those submit NEW oracle classes to a simulability audit; this record audits
    EXISTING citations for scope conformance and would flag the opposite error. IDEA-20260806-530fdd
    engages KN-FIND-002 and b7e091 on the merits of the model itself; this record takes the
    findings as correct and asks only whether their uses stay inside them.'
  source_refs:
  - '[corpus] KN-FIND-002; KN-FIND-b7e091; KN-FIND-982fdf; KN-OPEN-001; KN-OPEN-005; KN-OPEN-019;
    DECOMPOSITION.md section 2 (R1-R8) and lane L12; IDEA-20260807-569c82; IDEA-20260807-d73e83;
    docs/inventor-protocol.md (premature closure as a failure mode).'
