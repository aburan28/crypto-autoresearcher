    - "closed fraction of opposite-sign arms below 0.30 in the exact all-pair census"
    - "an (A,B) with f_-=1 and |B| prime but A-B != 2 and A+B != 0 (S4 wrong)"
  confounders: ["lifts with B in +-Q*^2 or D square are outside the screen: list them", "small N makes 1/N events correlated (2-group at p=31)"]
