idea:
  id: IDEA-20261016-6ad2a5
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Finite-field relation-class screen: which eligible arms can host any exact
    dependent lift at any height (plus the prime-prime obstruction on x^2-x+16)
  class: control
  claim: >-
    Depends on IDEA-20261016-bf8f49 (S2 and its same-sign analogue). Take an arm with
    lifts having B not in +-Q*^2 and D nonsquare, and a primitive exact relation
    aP+bQ=O (a,b coprime, |a|,|b|<=8). Parity classes: (+,-) arm: a odd on the
    plus point, b even on the minus point (30 vectors up to sign); (-,-) arm:
    a,b both odd (26); (+,+) arm: unrestricted (86). Since E(Q)->E(F_p) is a
    homomorphism, an arm is LIVE only if some admissible vector has
    aP^+bQ^=O in E^(F_p). A closed arm contains no exact dependent lift at any
    height. Separately (S4): if B=+-prime and D=prime in an opposite-sign arm
    then f_-=1 (up to P->-P) and A-B=2 or A+B=0 over Z, so no such lift
    reduces to (A,B)=(-1,16) mod p unless p divides 3*5*19; excludes
    p in {31,43,59,83,353}. Cheon-Lee-Hahn-Chee Remark 3 (retrieved) uses
    reductions to test independence; here reductions prune arms before any
    lift is built.
  mechanism: >-
    PAIR: representation = relation vectors of the F_p reduction classed by
    the parity forced by the signed-square sign pattern; operation set =
    group law of E^(F_p) (finite, so every orbit is exactly canonicalised).
    TRICHOTOMY: Class I partial-action (the screen is defined only on the
    S2 hypotheses). LOSSY-PROJECTION TEST: reduction mod p is a homomorphism
    discarding the kernel of reduction; the retained relation lattice
    L_p contains the Q-relation lattice, so a vector outside L_p is excluded
    exactly. Parity: P=kH+t1, Q=lH+t2 with alpha(P)=1, alpha(Q)=-1 forces
    k even, l odd; (-,-) forces k,l odd (notes). S4: with f_-=1 write
    u=w-s^2; then A=2u+1, B=u^2-s^2=(u-s)(u+s); |B| prime forces a factor
    +-1, giving A-B=2 or A+B=0. Elimination uses 4 cases (notes).
    The 2-isogeny only ever sees the 2-part of #E^(F_p) (forced even by the
    rational 2-torsion), which Pohlig-Hellman gives for free.
