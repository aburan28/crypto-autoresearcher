  minimal_test:
    design: >-
      Pure F_p arithmetic, no lift search. For p in {31,43,59,83,353}
      enumerate E^(F_p) (31 is cyclic of order 32 by hand count, to be
      machine-checked); for the 32 frozen pairs and for ALL ordered point
      pairs compute the admissible vectors and liveness per arm class.
      Validate parity on planted rational data: random E over Q, random H,
      (P,Q)=(bH,-aH) with admissible (a,b); record the realised sign pattern
      over Q and compare with the predicted class. Brute-force S4 over s<=300.
    controls: ["planted dependent lifts of every class stay live", "arms with a relation planted in the wrong parity class are flagged"]
    required_metrics: [closed/live counts per p and arm, exact all-pair census, parity mismatches, S4 case counts]
