      verified_by: this idea-generator session, corpus note read
    - ref: KN-LIT-094
      provenance: kb
      claim: >-
        Full cost is hardware times time occupied; memory is not free. The
        reason the triple, not the scalar, is the deliverable.
      verified_by: this idea-generator session, corpus note read
    - ref: KN-LIT-2663
      provenance: kb
      claim: >-
        Area-time costing of NFS; the frontier row the charged triple is
        eventually compared against, not here.
      verified_by: this idea-generator session, corpus note read

  novelty_screen:
    method: >-
      FILESYSTEM AND LEDGER SCREENING, WEB FOR THE 240-DIGIT PAPER. Grepped
      ledger/proposals for CADO-NFS, crossover, block Lanczos, cofactor,
      hardware counters; read the claim blocks of the five RSA-afe33c cost
      records nearest this one. The crypto-kb MCP server was unavailable.
    results: >-
      No filed record runs the two problems on one implementation at any
      size. IDEA-20260805-72bcb5 and IDEA-20260808-589c19 are analyses of
      published parameters; IDEA-20260808-0cdd09 is a ratio test on published
      records; the RQs list small-but-real runs as a METHOD without any
      proposal instantiating it. Bisseling-Flesch 2006 and the GPU block-
      Wiedemann papers found in the web search measure the linear algebra
      alone. The two-arm design (default versus matched parameters) is not in
      any record read.
    verdict: >-
      UNVERIFIED. The measurement itself is standard practice in the NFS
      community and the 240-digit paper is its record-scale exemplar; what is
      new to THIS LEDGER is the run, the charged triple, and the matched arm.
      No literature claim of novelty is made.

  object_first_candidate:
    tracked_object: >-
      THE PER-STAGE TRIPLE (time, peak memory, bytes moved), followed through
      the pipeline of one implementation and across the two problems at one
      size. Off-limits as the primary lens: every speedup family -- polynomial
      selection improvement, sieving variants, cofactorisation offload, linear
      algebra variants. This record proposes no speedup; it proposes the
      instrument every speedup would have to be measured with.
    lossiness: >-
      PASSES. The triple discards the relations, the matrix, the polynomials
      and the machine state and keeps three numbers per stage; it is lossy by
      orders of magnitude. What it discards is discarded compatibly with the
      operation of interest, comparison across problems and sizes, because
      the L-model and the full-cost model act on exactly these three
      quantities. It is not a change of coordinates because infinitely many
      runs share a triple.
    propagation: >-
      One step is one stage. The triple of stage k+1 is a deterministic
      function of the artifacts stage k produced (relation count and quality
      determine the matrix; matrix dimension and density determine the
      Krylov cost), and the record measures each link separately so that a
      surprise is localised to a link rather than to the pipeline.
    survival_score: >-
      Survives at every size the implementation runs; dissolves only where a
      stage cannot be isolated (CADO fuses filtering steps, and cofactorisation
      time is reported by the sieve's own timers rather than measured
      independently, both declared).

  proof_search_map:
    bottleneck: null
    baseline_embedding:
      parameter_slice: null
      reproduction_check: null
    observation_collision:
      observable: null
      distinct_preimage_search: null
    constructive_transforms: []
    quantifier_order: null
    method_ceiling:
      strongest_certifiable_claim: null
      nearby_object_control: null
    proof_obligations: []
    not_applicable_reason: >-
      Not a proof-oriented proposal; it is a toy-tier measurement whose
      controls are the two arms and the null microbenchmark. The only
      inference it licenses is a stage-localised ratio at the sizes run.

  assumptions:
    - >-
      CADO-NFS at a pinned commit builds and runs both factoring and prime-
      field DLP end to end at 60-100 digits on the available machine; if the
      100-digit runs exceed the budget they are dropped and the record reports
      two sizes, which is a budget outcome and not evidence.
    - >-
      Hardware counters (last-level-cache misses, instructions, cycles) are
      readable for the sieve process on the machine; if not, the bytes-moved
      coordinate is reported as missing rather than estimated.
    - >-
      The DLP arm uses openly random primes of the same bit size as the
      semiprimes; no special-form or trapdoored prime is used here (that is
      IDEA-20260901-e849e4's and GOAL-SNFS-001's territory).

  predictions:
    - metric: >-
        matched_sieving_ratio, DLP over factoring relation-collection CPU time
        per unique relation in the MATCHED arm at each size
      direction: different
      minimum_effect: >-
        Within [0.7, 1.4]. This is the shared-ingredient prediction. A ratio
        outside [0.5, 2] at any size means the two pipelines do not share the
        sieving ingredient as claimed, and the norm-size measurement of the
        two polynomial pairs (a required metric) decides whether polynomial
        selection or something else is responsible.
    - metric: >-
        matched_la_ratio_per_entry, DLP over factoring Krylov CPU time divided
        by (rows times density) in the MATCHED arm
      direction: higher
      minimum_effect: >-
        At least 10 and at most 200; the arithmetic-width ratio of the two
        rings. Below 10 means the GF(2) code is far from its packed
        efficiency or the mod-ell code is far better than expected; above
        200 means the mod-ell path is memory-bound in a way the GF(2) path is
        not, which is the traffic-bound branch of IDEA-20260805-72bcb5.
    - metric: >-
        default_shift_sign, in the DEFAULT arm, the sign of (DLP matrix rows
        minus factoring matrix rows) and of (DLP sieving time minus factoring
        sieving time) at each size
      direction: different
      minimum_effect: >-
        Rows negative and sieving positive at every size, reproducing the
        240-digit direction; magnitudes reported and NOT predicted. Either
        sign reversed means CADO's default balance at small sizes does not
        behave like the record balance, which is itself a finding for the
        cost model.
    - metric: >-
        throughput_knee, in the sieve ablation, the ratio of time-per-update
        above the last-level-cache threshold to that below it
      direction: higher
      minimum_effect: >-
        At least 1.3 supports explanation (M); within [0.9, 1.1] supports
        (A); in between is reported as mixed with the fitted term weights.
    - metric: >-
        two_term_fit, the fraction of variance in time-per-special-q across
        the sweep explained by the arithmetic term alone versus by the two-term
        model
      direction: different
      minimum_effect: >-
        A two-term R^2 improvement of at least 0.2 over the one-term fit is
        (M); below 0.05 is (A).
    - metric: >-
        size_ratio_residual, observed 80-to-60 and 100-to-80 total-time ratios
        divided by the L[1/3, 1.923] prediction with the same f(n) as
        IDEA-20260808-0cdd09
      direction: different
      minimum_effect: >-
        Reported with no prediction of its value; a residual outside [0.3, 3]
        is flagged as the o(1) being large at these sizes, consistent with Le
        Gluher-Spaenlehauer-Thome, and forbids any extrapolation.
    - metric: >-
        cofactorisation_fraction, share of relation-collection CPU time in
        cofactorisation at default parameters
      direction: different
      minimum_effect: >-
        Reported per size and per problem with no predicted value; the DLP
        versus factoring difference in this share is a required output because
        Joux-Lercier norms are unbalanced between the sides.

  minimal_test:
    design: >-
      FIVE STEPS. STEP 0 (blocking, zero compute): pin the CADO-NFS commit,
      the machine (CPU model, cache sizes, memory), the counter tool, the
      parameter files for the default arm and the matched-arm parameter set
      per size, and the seeds; commit them before any run. STEP 1: generate
      the instances -- balanced semiprimes with recorded factors at 60, 80,
      100 digits, and random primes of the same bit sizes with a recorded
      large prime factor of p - 1 as the DLP subgroup -- and record the
      certificates the wrapper will re-verify (product of factors equals N;
      g^x equals h in the subgroup). STEP 2 (default arm): run each problem
      end to end with CADO's own parameter file, three repetitions, collecting
      per stage wall and CPU time, peak RSS, counters, matrix rows and
      density, relation counts. STEP 3 (matched arm): repeat with the matched
      sieving parameters on both problems. STEP 4 (ablation, factoring only,
      one size): sweep I over four values and the algebraic factor-base bound
      over four values at fixed lpb, run a fixed special-q sample with
      counters, count the sieve updates from the factor base and the region,
      and fit the two-term model; run the arithmetic-only microbenchmark as
      the null. STEP 5: emit the stage triples, the ratio vectors, the
      tradeoff curve, and the size-ratio residuals, each with intervals from
      the repetitions.
    controls:
      - >-
        THE MATCHED ARM is the control for the default arm; the default arm
        is the control for the record comparison.
      - >-
        NULL MICROBENCHMARK for the ablation, the same sieve inner loop over
        cache-resident data, so the memory term has a measured zero.
      - >-
        REPETITION with pinned cores and a quiet machine, three runs per cell,
        intervals reported; a cell whose spread exceeds 20 per cent is
        re-run or reported as unstable.
      - >-
        CERTIFICATES re-verified independently by the run wrapper, per
        docs/claims-and-verification.md, before any timing is read.
      - >-
        NORM-SIZE CHECK of both polynomial pairs at each size (mean log2 norm
        product over a sample of the sieve region), so a sieving-ratio
        surprise can be attributed to polynomial selection or excluded from
        it.
    required_metrics:
      - per-stage triples (time, peak RSS, bytes moved) for both problems, both arms, all sizes
      - matrix rows, density and Krylov bytes per iteration
      - matched and default ratio vectors with intervals
      - throughput knee, two-term fit weights and R^2 improvement
      - (time, peak RSS) Pareto points of the ablation sweep
      - size-ratio residuals against the L-model
      - polynomial-pair norm sizes and cofactorisation shares
      - commit hash, machine description, parameter files, seeds, certificates, rebuild receipt

  falsification_conditions:
    - >-
      Matched sieving ratio outside [0.5, 2] with polynomial norm sizes
      within 5 bits of each other. The shared-ingredient premise fails at
      these sizes; the record reports which stage carries the difference and
      the DLP control cannot be used as a free check until that is
      explained.
    - >-
      Default-arm shift sign reversed at all sizes. Then the 240-digit balance
      is not what CADO's small-size defaults do, and any cost model
      calibrated on small runs must say so.
    - >-
      Throughput knee within [0.9, 1.1] and no two-term improvement. Relation
      collection is arithmetic-bound at these sizes and memory can be
      charged at zero for the sieve here, which is HEUR-NFS-2's direction
      and is reported as such, scoped to the sizes.
    - >-
      Runs that time out or crash. Not evidence of anything (AGENTS.md rule
      3); reported as a budget outcome with the cell marked missing.

  confounders:
    - >-
      PARAMETER FILES ARE TUNED DIFFERENTLY FOR THE TWO PROBLEMS by CADO's
      maintainers, so a default-arm difference may be tuning rather than
      algorithm. MITIGATION: the matched arm exists for exactly this reason,
      and the default arm's parameters are recorded verbatim.
    - >-
      JOUX-LERCIER PAIRS ARE UNBALANCED between sides, so the per-side sieve
      settings that are 'matched' in numbers are not matched in effect.
      MITIGATION: norm sizes per side are measured and reported, and the
      matched arm is repeated with the sides' roles swapped for the DLP case
      if the first pass shows a large asymmetry.
    - >-
      MACHINE NOISE, thermal throttling, frequency scaling. MITIGATION:
      pinned cores, fixed frequency governor where available, repetitions,
      and the null microbenchmark run interleaved.
    - >-
      HYPERTHREADING AND MEMORY BANDWIDTH SHARING inflate the memory term
      when many sieve processes run at once. MITIGATION: the ablation runs
      one process on an otherwise idle socket; the end-to-end runs report
      the process count.
    - >-
      COUNTER ATTRIBUTION. Last-level-cache misses include prefetch and
      kernel activity. MITIGATION: user-space-only counting where the tool
      allows, and the microbenchmark's miss count as the baseline subtracted.

  interpretation_limits:
    - >-
      CLAIM TIER (b) of RQ-GNFS-c6ce52, a toy-tier measured statement about
      stages on one implementation at 60-100 digits on one machine. No
      transfer to record or deployed sizes; the size-ratio residual is
      reported precisely so that any later extrapolation carries an error
      bar it currently lacks.
    - >-
      The bytes-moved coordinate is an estimate from cache-miss counters, not
      a measurement of interconnect traffic; at these sizes the linear
      algebra runs on one node and the interconnect term of the communication
      wall is NOT observed. IDEA-20260901-df12e1 addresses the structure that
      would govern it.
    - >-
      The DLP arm uses random primes; nothing here is a statement about any
      deployed group, and nothing about trapdoored parameters.
    - >-
      A default-arm ratio is a statement about CADO's parameter files at
      these sizes, not about the algorithms' intrinsic balance.

  heuristic_assumptions:
    - id: H1
      statement: >-
        STAGE ADDITIVITY AND TWO-TERM SIEVE COST. Time per special-q equals
        a times (sieve updates) plus b times (last-level-cache misses) plus
        (cofactorisation time as reported), with a and b constants over the
        sweep at fixed size and machine, and the stage times sum to the total
        within 10 per cent.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the count of sieve updates is exactly computable
        from the factor base and the region (sum over factor-base primes of
        roots times region over p); cache misses are measured, not modelled.
        CLASSICAL STATEMENT IMITATED: the roofline model of a memory-bound
        kernel, time = max or sum of a compute term and a traffic term. THE
        GAP: additivity assumes no overlap between arithmetic and memory
        stalls, which out-of-order cores partially provide; the fit is a
        model of the sieve, not a theorem, and its residual is reported.
      falsification_condition: >-
        Two-term fit residual above 20 per cent of the mean, or fitted a or b
        negative, or stage sum differing from the total by more than 10 per
        cent.
      validation_plan: >-
        SAMPLE: 16 sweep cells times 3 repetitions times a fixed special-q
        sample of 200 at one size, factoring only, plus the null
        microbenchmark. SHORTCUT: none needed. COMPARISON: the two-term
        regression against the one-term regression, with the microbenchmark
        fixing the arithmetic constant a independently, so the fit has one
        free constant b. TAIL CHECK: the cells at the largest I and largest
        lim, where the memory term should be largest, are held out and
        predicted from the fit on the other cells. RECORDED PARAMETERS:
        machine, cache sizes, commit, sweep grid, special-q sample.
    - id: H2
      statement: >-
        SIZE TRANSFER THROUGH THE L-MODEL ONLY. Ratios between sizes follow
        T(n2)/T(n1) = exp((c + eps) (f(n2) - f(n1))) with c = 1.923 and eps a
        slowly varying unknown; no other size dependence is assumed.
      rigorous_support: >-
        RIGOROUS INGREDIENT: none; this is the heuristic NFS complexity
        itself. CLASSICAL STATEMENT IMITATED: the L[1/3] asymptotic under
        Canfield-Erdos-Pomerance smoothness. THE GAP: Le Gluher-
        Spaenlehauer-Thome (retrieved, abstract) show the o(1) converges only
        beyond exp(exp(25)); at 60-100 digits eps is not small and the
        residual is expected to be far from 1, which is why it is REPORTED
        and not used.
      falsification_condition: >-
        Not falsifiable at these sizes and not relied on; the residual is a
        deliverable, not a test.
      validation_plan: >-
        SAMPLE: the three sizes' total times. COMPARISON: the predicted ratio
        from f(n). TAIL CHECK: the 100-to-60 ratio against the product of the
        two adjacent ratios (consistency). TRANSFER: none claimed.

  target_complexity:
    time_exponent: >-
      NO EXPONENT OR CONSTANT IS CLAIMED OR MOVED; L[1/3, 1.923] before and
      after. The record is a building block and says so, the calibration
      instrument that GOAL-RSA-001's cost model, the theta family of
      IDEA-20260805-1775f2, HEUR-NFS-2's test in IDEA-20260808-589c19 and the
      byte charge of IDEA-20260805-72bcb5 all need at a size where runs exist.
      The instrument's own cost is the runs, hours to a few days of one
      workstation.
    memory_exponent: >-
      Unchanged; the record MEASURES peak memory per stage, which is the
      point.
    best_known: >-
      For the measurement itself, the 240-digit experiment is the record-
      scale exemplar (retrieved, relayed); for the algorithm, the frontier
      rows listed in IDEA-20260901-d88b5c.
    hidden_overhead: >-
      DISCLOSED. The runs are at sizes where the o(1) dominates; nothing here
      is an asymptotic statement. Filtering is fused in CADO and reported as
      one stage; descent for DLP is reported as one stage.
    tradeoff_note: >-
      The (time, peak RSS) Pareto front of the ablation sweep IS the
      deliverable for relation collection's time-memory position at these
      sizes; parallel behaviour is reported as the process count used and is
      not extrapolated.

  dominated_by: >-
    CHECKED, n/a (no result claimed). No attack point is offered. As a
    measurement it is dominated in scale by Boudot et al. 2020 (retrieved,
    relayed) by three orders of magnitude and is not dominated in kind by
    any record in this ledger, none of which has run either problem.
  sota_delta: >-
    +0 on every attack axis. What moves, quantitatively: the number of
    stage-cost triples this program holds from its own runs goes from zero
    to (5 stages times 2 problems times 2 arms times 2-3 sizes); the number
    of DLP-control comparisons executed goes from zero to one per size; the
    sieve's arithmetic-versus-memory question goes from asserted (KN-LIT-2936
    abstract) to fitted with a stated residual, at the sizes run.

  discriminated_from:
    - >-
      IDEA-20260805-72bcb5 charges the linear algebra in bytes from published
      dimensions; this record measures bytes on runs and covers every stage.
    - >-
      IDEA-20260808-589c19 evaluates an access-rate criterion on published
      parameters; this record measures the access pattern with counters on a
      sweep and can supply 589c19's ratio an observed value.
    - >-
      IDEA-20260808-0cdd09 tests the L-model on record ratios; this record
