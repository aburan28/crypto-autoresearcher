idea:
  id: IDEA-20260901-dedcea
  question_id: RQ-GNFS-c6ce52
  research_question: RQ-GNFS-c6ce52
  goal_id: null
  added: '2026-09-01'
  title: >-
    RUN THE CONTROL THE LITERATURE SET UP, AT A SIZE THIS PROGRAM CAN REACH.
    Matched factoring and prime-field-DLP runs of one open implementation on
    one machine at three sizes, emitting per stage the TRIPLE (time, peak
    memory, bytes moved) rather than a core-year, in two arms -- each
    problem's own default balance, and a MATCHED-parameter arm where both
    problems sieve with identical bounds -- so that the stage on which the
    two problems diverge is located by measurement; with a sieve-throughput
    ablation across sieve-region and factor-base sizes that decides, by a
    two-term fit with hardware counters, whether relation collection at these
    sizes is arithmetic-bound or memory-bound, and where its time-memory
    tradeoff position sits
  class: measurement

  claim: >-
    FOUR SEPARABLE CLAIMS. (A) THE MATCHED PAIR. Integer factorisation and
    prime-field discrete logarithm by the number field sieve share every
    ingredient up to the linear algebra ring and the final stage; RQ-GNFS-
    c6ce52 makes the DLP control mandatory for every cost claim and the
    program has never run it. This record runs both problems at 60, 80 and
    (budget permitting) 100 digits on CADO-NFS on one machine and emits, per
    stage -- polynomial selection, relation collection split into sieving
    and cofactorisation, filtering, linear algebra split into the three
    block-Wiedemann phases, square root or descent -- the triple (wall and
    CPU time, peak resident memory, bytes moved estimated from last-level-
    cache miss counters times line size, plus the matrix bytes streamed per
    Krylov iteration). A core-year alone is declared incomplete by the
    question's constraints; this is the first record that produces the
    charged form from runs rather than from published numbers. (B) TWO ARMS
    THAT SEPARATE INGREDIENT FROM BALANCE. The 240-digit experiment (Boudot
    et al. 2020, retrieved through a fetch-tool summary of the ar5iv
    rendering, figures relayed) reports RSA-240 at 76 / 794 / 83 core-years
    for polynomial selection / relation collection / linear algebra with a
    282M-row matrix of density 200, and DLP-240 at 152 / 2400 / 625 with a
    36M-row matrix of density 253. The DLP matrix is eight times SMALLER and
    its sieving three times LARGER: the balance was shifted toward sieving
    because linear algebra modulo a large prime is dearer than over GF(2).
    A stage-cost vector read from default runs therefore mixes the
    INGREDIENT difference (arithmetic ring, polynomial selection method) with
    the BALANCE difference (parameter choice). The record runs a DEFAULT arm
    (each problem's own CADO parameter file, which should reproduce the
    DIRECTION of the 240-digit shift) and a MATCHED arm (identical lim, lpb,
    I, mfb and special-q range on both problems at the same bit size, so
    only the ingredients differ). The matched-arm sieving ratio DLP over
    factoring is predicted near 1, the matched-arm linear-algebra ratio per
    (rows times density) is predicted to be the arithmetic-width ratio of the
    two rings, and the default-arm vector is predicted to reproduce the sign
    of the 240-digit shift. (C) THE SIEVE ABLATION. Over a sweep of the
    sieve-region parameter I and the factor-base bounds at fixed size, fit
    time per special-q to a two-term model, arithmetic term proportional to
    the counted sieve updates and memory term proportional to measured
    last-level-cache misses, with cofactorisation time separated by CADO's
    own timers. Two explanations are discriminated before the run: (M) the
    memory term dominates once the bucket region exceeds the last-level
    cache, throughput per update falling by at least 30 per cent across the
    threshold; (A) the arithmetic term dominates and throughput per update is
    flat within 10 per cent. The (time, peak memory) pairs across the sweep
    are the measured time-memory tradeoff position of relation collection at
    these sizes, which RQ-GNFS-c6ce52 target 3 asks for and which no record
    holds. (D) NOT CLAIMED. No factorisation or discrete-logarithm record, no
    speedup, no exponent, no extrapolation to any deployed size; the sizes
    run are 60-100 digits and every number is scoped to CADO-NFS at a named
    commit on a named machine.

  mechanism: >-
    The two problems are the same algorithm with two substitutions, the
    polynomial selection (Kleinjung base-m versus Joux-Lercier, which
    IDEA-20260901-d88b5c shows is exactly the root-extraction asymmetry) and
    the linear-algebra ring (GF(2), bit-packed 64 wide, versus Z modulo a
    prime of the field's bit size). Everything else -- lattice sieving,
    bucket sieving, large-prime cofactorisation, filtering, block Wiedemann's
    Krylov / Berlekamp-Massey / solution structure -- is shared code. Hence a
    matched-parameter run isolates those two substitutions, and the ratio
    vector across stages must be near 1 everywhere except polynomial
    selection and linear algebra; a deviation elsewhere is a measurement of
    something the shared-ingredient premise misses (for instance a different
    cofactorisation profile because Joux-Lercier norms are unbalanced between
    the two sides). The sieve ablation works because CADO's las reports
    per-special-q timings and its sieve updates are countable from the
    factor base and the region, while hardware counters give the memory
    traffic; the two-term regression separates them because the sweep moves
    the two terms differently (I moves the region and hence both; lim moves
    the number of large primes bucket-sieved and hence mostly the memory
    term).

  novelty_status: unverified

  citations:
    - ref: >-
        Boudot, Gaudry, Guillevic, Heninger, Thome, Zimmermann, Comparing the
        difficulty of factorization and discrete logarithm, a 240-digit
        experiment, CRYPTO 2020, ePrint 2020/697, arXiv 2006.06197
      provenance: retrieved
      claim: >-
        RELAYED FROM A FETCH-TOOL SUMMARY OF THE ar5iv RENDERING, NOT READ
        LINE BY LINE. RSA-240 phase costs 76 / 794 / 83 core-years (polynomial
        selection / relation collection / linear algebra as Krylov 69 plus
        Lingen 0.8 plus Mksol 13), matrix 282M rows density 200, 8.94G raw and
        6.01G unique relations, lpb 2^36 and 2^37, sieve area 2^32; DLP-240
        152 / 2400 / 625 (544 plus 12 plus 69), matrix 36M rows density 253,
        3.82G raw and 2.38G unique relations, lpb 2^35 both sides, sieve area
        2^31; reference CPU Intel Xeon Gold 6130 at 2.10 GHz; the paper's
        stated total ratio 3177 versus 953 core-years, 3.3. Kleinjung (6, 1)
        for RSA-240, Joux-Lercier (4, 3) for DLP-240. Every figure must be
        re-read from the PDF before it is used as a baseline.
      verified_by: >-
        this idea-generator session, fetch-tool summary of the ar5iv page
        only
    - ref: IDEA-20260805-72bcb5
      provenance: internal
      claim: >-
        Charges block Wiedemann in bytes with a matrix-traffic identity and a
        sequential-depth floor, from PUBLISHED dimensions; names the DLP-240
        versus RSA-240 linear-algebra ratio as a free adjudicator between an
        arithmetic-bound and a traffic-bound model. This record measures the
        same ratio on runs at reachable sizes, which 72bcb5 does not do.
      verified_by: this idea-generator session, claim block read
    - ref: IDEA-20260808-589c19
      provenance: internal
      claim: >-
        Decides HEUR-NFS-2 from PUBLISHED sieving parameters via an access-
        rate ratio; pre-registers outcomes O-A, O-B, O-C. This record's
        ablation measures the access pattern on runs and can feed 589c19's
        ratio an observed value; it does not restate its criterion.
      verified_by: this idea-generator session, claim block read
    - ref: IDEA-20260808-0cdd09
      provenance: internal
      claim: >-
        Validates the L-model on RATIOS between record computations. This
        record supplies size ratios between its own runs (60 to 80 to 100
