      verified_by: this idea-generator session, claim block read
    - ref: IDEA-20260805-1775f2
      provenance: internal
      claim: >-
        The theta family; predicts that charging memory moves the optimum
        toward a smaller factor base and more sieving, which is the direction
        of the 240-digit DLP shift and is a pre-registered comparison here.
      verified_by: this idea-generator session, claim block read
    - ref: KN-LIT-2936
      provenance: kb
      claim: >-
        Cofactorisation is a compute-intensive part of relation collection
        that can be farmed out, leaving CPUs on 'memory-intensive sieving';
