idea:
  id: IDEA-20260916-e6540d
  question_id: RQ-DREG-bd6c86
  added: '2026-09-16'
  proposed_by: idea-generator
  status: proposed
  title: >-
    DEGREE-CAPPED CERTIFIED DECOMPOSITION: cap the Macaulay degree at D_0, emit
    a SOLVED certificate, an UNSAT certificate, or an UNDECIDED verdict, and
    discard the undecided instances by re-randomising the target - which
    replaces the first-fall-degree assumption in Semaev's cost model by a
    MEASURABLE certification yield pi(D_0), makes the per-attempt cost
    deterministically N^{D_0 * omega}, and turns the whole subexponential claim
    into the single falsifiable condition -log2 pi = o(sqrt(n log n)); with a
    mandatory proves-too-much audit of Huang's 2023 semi-local last-fall-degree
    bound as the candidate rigorous ingredient that would fix D_0 outright
  class: composition

  claim: >-
    (A) THE RESTRUCTURING. Semaev's characteristic-2 index calculus
    (KN-LIT-fa346d) costs stage 1 at about m! * 2^{n/m} * 2^k * n^{4*omega} /
    2^{mk} and reaches 2^{1.6986 sqrt(n ln n)} ONLY under Assumption 1
    (d_F4 <= 4), an unproved degree assumption whose measured support is
    confined to n <= 21, m <= 6 plus one cell at n = 40, and which the paper
    itself reports failing once k > ceil(n/m). REPLACE THE ASSUMPTION BY A
    PROCEDURE. Fix a cap D_0. For each decomposition instance build the
    degree-D_0 Macaulay system of the chained descended equations TOGETHER WITH
    the field equations and reduce it once. Exactly three outcomes, each
    certified:
      SOLVED    - the reduced system determines every variable, a decomposition
                  is read off, and it is re-verified INDEPENDENTLY by point
                  addition on the curve (the solution certificate required by
                  docs/claims-and-verification.md);
      UNSAT     - 1 lies in the degree-D_0 row space, which is a checkable
                  linear-algebra certificate that no decomposition exists for
                  this target over this factor base;
      UNDECIDED - neither; the instance is DISCARDED and a fresh target is
                  drawn.
    The per-attempt cost is then DETERMINISTIC AND POLYNOMIAL, O(N^{D_0 omega})
    with N = n(m-1) the Boolean variable count, with no assumption of any kind
    about degrees of regularity, first fall degrees, or F4 behaviour.
    (B) WHERE THE ASSUMPTION WENT. It became the yield
    pi(D_0; n, m, k) := Pr[outcome is not UNDECIDED] over the instance
    distribution. Relation collection now costs the old stage-1 expression with
    n^{4 omega} replaced by N^{D_0 omega} and DIVIDED BY pi. So the entire
    subexponential claim reduces to ONE MEASURABLE CONDITION:
        the exponent 2^{c sqrt(n ln n)} survives  <=>  -log2 pi(D_0) =
        o(sqrt(n ln n)).
    Assumption 1 is the special case pi = 1 at D_0 = 4. This is not a weaker
    claim dressed up: it is the SAME claim with its unprovable ingredient
    replaced by a quantity that can be sampled at n = 12..24 and whose decay
    law can be fitted and reported with an honest extrapolation flag.
    (C) THE RE-RANDOMISATION IS EXACT, NOT A WALK. The discard step is only
    sound if fresh instances are as good as the discarded ones and the answer
    is still usable. Both hold for free here: the target of a relation-
    collection step is already R = aP + bQ with a, b drawn uniformly, so
    redrawing is a single exact uniform re-randomisation of the subgroup with
    NO mixing-time heuristic and NO loss - the logarithm is recovered from the
    known (a, b) exactly as in the unmodified algorithm. This is the one place
    where the usual "random walk with a mixing argument" of the exemplar
    profile is replaced by something strictly better, and the record claims
    only that, not a new walk.
    (D) THE CANDIDATE RIGOROUS INGREDIENT, WITH ITS AUDIT ATTACHED. If D_0
    could be BOUNDED rather than chosen, pi would be 1 by theorem and the whole
    construction would be unconditional. Huang, "Last fall degree of semi-local
    polynomial systems" (arXiv:2311.02804, 2023), is - on its abstract, which
    is all this session read - exactly the shape of ingredient that would do
    it: it "bounds the last fall degree of a semi-local polynomial system in
    terms of the number of closed point solutions" and gives "an efficient
    algorithm for finding all rational-point solutions when the prime
    characteristic of the finite field and the number of rational solutions are
    small". A descended Semaev system with field equations is zero-dimensional
    (hence semi-local), lives in characteristic 2 (small), and has a SMALL
    NUMBER of rational solutions (a target typically has zero or a handful of
    decompositions over the factor base). THAT COMBINATION IS SUSPICIOUSLY
    FAVOURABLE, WHICH IS WHY THIS RECORD ATTACHES A PROVES-TOO-MUCH AUDIT
    RATHER THAN AN APPLICATION: read literally and without its hypotheses, the
    same reading would apply to a RANDOM Boolean quadratic system with one
    planted solution, and would assert that such systems are efficiently
    solvable - contradicting the standard hardness expectation for random MQ
    with a planted solution, and directly testable at small n with the fall
    profile meter. CLAIM D is therefore NOT that the bound applies. It is that
    the audit is cheap, decisive, and has not been done: either the hypotheses
    exclude the Semaev case (and the bound is not the missing ingredient, which
    is a useful closure), or they do not (and the ingredient is real and must
    be taken to the Coordinator immediately), or the naive reading proves too
    much (and the corpus records exactly which hypothesis does the work).
    (E) WHAT IS BEING CLAIMED AND WHAT IS NOT. Claimed: the accounting
    restructuring of (A)-(B) is sound, the certificates are checkable, the
    re-randomisation is exact, and pi is measurable at the toy ladder. NOT
    claimed: that pi is large, that any exponent is improved, or that any curve
    is affected. The measurement could kill this proposal outright and the
    threshold at which it does is pre-registered below.

  mechanism: >-
    OBJECT FRAME. Representation: the Weil-descended chained Semaev system with
    field equations, in the degree-D_0 truncated Macaulay presentation - an
    R1-class representation, attacking the RELATION DECOMPOSITION stage.
    Operation set Sigma: the capped Macaulay/XL step set (multiply by monomials
    up to total degree D_0; F_2-linear combination), composed with the exact
    target re-randomisation R -> R + [r]P + [s]Q. Trichotomy class
    (IDEA-20260806-c5d183): BRANCHING, explicitly and by design. Index calculus
    itself is Class I partial-action - the relation vector propagates
    deterministically only under translation by factor-base elements - and
    "whether a decomposition exists at all is the branching event the meter
    prices" (IDEA-20260806-c5d183 as recorded in the object-frame handoff).
    THIS RECORD ADDS A SECOND BRANCHING EVENT AT THE SAME STEP - whether the
    decomposition is CERTIFIABLE AT DEGREE D_0 - and pi is exactly the
    (L, b) meter of IDEA-20260802-002 applied to it: the branching factor is
    1/pi and the loss L is the log of the number of instances represented by a
    discarded verdict, which is zero because a discarded instance is
    regenerated rather than represented.
    LOSSY-PROJECTION TEST AGAINST THAT Sigma. The tracked object is the
    TRUNCATED IDEAL STATE: the row space of the degree-D_0 Macaulay matrix,
    projected to its certificate verdict in {SOLVED, UNSAT, UNDECIDED} plus, on
    SOLVED, the solution vector. Genuinely lossy: from the verdict one cannot
    recover the row space, the system, the curve or the target; UNDECIDED in
    particular collapses an enormous set of distinct algebraic states to one
    symbol. And the discard is Sigma-compatible in the operative sense - the
    verdict is computed by Sigma-operations alone and is stable under them
    (further Sigma-steps at degree <= D_0 cannot change SOLVED or UNSAT, only
    UNDECIDED can move, and it moves only by raising the cap, which is a
    different object). The projection therefore propagates deterministically on
    the two decided branches and branches on the third, which is precisely the
    branching-object pattern the object-frame document requires to be priced
    rather than asserted. Contrast the protocol's worked failure - tracking
    (x + y, xy) in characteristic 2 loses nothing because the pair is
    recoverable from a quadratic - here UNDECIDED is an irreversible collapse
    and the whole cost model turns on its frequency.
    WHY THIS IS THE RIGHT THING TO DO WITH A CONTESTED ASSUMPTION. The
    literature disagreement in this lane is entirely about a degree that nobody
    can bound: Semaev assumes d_F4 <= 4; Nagao applies the same assumption at
    N ~ n^2 variables to reach a POLYNOMIAL claim; Kosters-Yeo and
    Huang-Kosters-Yeo argue the assumption is unlikely to hold; Kosters reports
    step degree 5 at n = 45; Semaev's own paper reports the regularity degree
    exceeding 4 once k > ceil(n/m). An algorithm that CAPS the degree does not
    need to win that argument - it pays a known price and measures how often it
    gets an answer. That is the move that converts a decade-old unresolved
    heuristic into an experiment, and it is available precisely because linear
    algebra at a fixed degree is bounded work while F4 is not.
    WHY THE FILTERING MIGHT DESTROY THE ALGORITHM, STATED UP FRONT. The
    retained relations are a BIASED SUBSET of the relation lattice - exactly
    those whose systems linearise at degree D_0 - and the linear-algebra stage
    needs the collected relations to have full rank modulo the factor base.
    If certifiability correlates with an algebraic property that also makes
    relations dependent, the collected matrix is rank-deficient and no amount
    of collection finishes. This is the most likely way the proposal dies, it
    is measurable at toy scale by comparing the rank growth of filtered and
    unfiltered relation matrices, and it is a pre-registered falsifier rather
    than a discovered surprise.

  novelty_status: unverified

