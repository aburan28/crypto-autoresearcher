  assumptions:
    - >-
      OFF-LIMITS COMPONENT DECLARED AND CENTRAL: family F2 (factor-base
      decomposition) is used as a component, not as a new lens. What is added
      is the degree cap, the three-way certificate, and the replacement of an
      unproved degree assumption by a measured yield. No new factor base is
      proposed, so KN-OPEN-020 is not engaged and no escape class is claimed.
    - >-
      The factor base, the descent, the chain topology and the curve family are
      Semaev's, unchanged, so that pi is measured against HIS cost model and
      not against a re-tuned one. Any change to those would require re-deriving
      the stage-1 expression before pi means anything.
    - >-
      Field equations are included in the degree-D_0 system. Without them the
      UNSAT certificate and the determinacy test are both different objects.
    - >-
      Exact arithmetic over GF(2); the SOLVED certificate is re-verified by
      independent point addition, and the UNSAT certificate by an independent
      re-derivation of 1 from the recorded combination.
    - >-
      All toy-scale, public, self-generated curves; no live keys; lawful
      defensive cryptanalysis only.

  proof_search_map:
    bottleneck: >-
      Assumption 1 - the unproved step from a first fall degree of 4 to an F4
      computation that never exceeds degree 4 - which is the single input to
      Semaev's 2^{1.6986 sqrt(n ln n)} and to Nagao's polynomial claim.
      Removing it changes the theorem from "conditional on an unmeasurable
      degree bound" to "conditional on a measured yield", which is a different
      epistemic object at the same cost.
    baseline_embedding:
      parameter_slice: >-
        pi = 1. At pi = 1 the capped algorithm IS Semaev's algorithm with
        D_0 = 4 and the cost expression reduces to his stage-1 formula with
        n^{4 omega} in place. That is the exact old-method boundary and it must
        be reproduced symbolically before any measurement.
      reproduction_check: >-
        Symbolic: substitute pi = 1, D_0 = 4, N = n(m-1) into the capped
        expression and check it equals m! * 2^{n/m} * 2^k * n^{4 omega} /
        2^{mk} up to the stated constant, and that balancing over m reproduces
        m* ~ sqrt(2 ln2 * n/ln n) and c = 1.6986. Numerically: reproduce the 36
        cells of Semaev's Table 3 from the formula, which the corpus records as
        already reproducing to within 0.7 percent from
        inputs/SEMAEV-2015-310/tables.yaml, and require the capped formula at
        pi = 1 to agree cell for cell.
    observation_collision:
      observable: >-
        The three-way verdict (SOLVED, UNSAT, UNDECIDED) at cap D_0.
      distinct_preimage_search: >-
        REQUIRED, and the dangerous collision is named: two instances, one with
        NO decomposition and one with a decomposition that the degree-D_0
        system fails to reveal, can BOTH return UNDECIDED. If the algorithm
        ever conflated UNDECIDED with UNSAT it would silently lose relations
        and bias the yield upward. The design separates them by requiring an
        explicit 1-in-the-row-space certificate for UNSAT, and the search is
        the test: construct instances of both kinds at toy scale (planted
        decompositions and provably decomposition-free targets verified by
        exhaustive search over V^m) and require the verdicts to be correct on
        every one. A single SOLVED-or-UNSAT verdict that disagrees with
        exhaustive ground truth voids the instrument.
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "F4 terminates and we read a
          degree" to "the degree-D_0 truncation either decides the instance
          with a checkable certificate or declares itself undecided", and prove
          a STRICT inward improvement in what is certifiable: every instance
          Semaev's Assumption 1 covers is decided here at the same degree, and
          instances it does not cover are now DETECTED rather than silently
          mis-costed. The improvement claimed is in certifiability, not in
          cost, and the record says so.
        predicted_gain: >-
          Per-attempt cost becomes deterministic O(N^{D_0 omega}) with no
          degree assumption; the whole conditionality of the exponent moves
          into one measurable number.
      - transform: specialization_pack
        proposed_object: >-
          pi(D_0; n, m, k) as a problem-specific resource measure, realised by
          sampling at the toy ladder and charged only over instance classes
          proved disjoint (satisfiable / unsatisfiable / degenerate), never
          pooled.
        predicted_gain: >-
          A decay law for -log2 pi against sqrt(n ln n) with a fitted slope and
          a confidence interval, which is the quantity the exponent condition
          in (B) turns on.
    quantifier_order: >-
      CLAIMED: FORALL instances (curve, factor base, target) in the stated
      family, FORALL caps D_0, the capped procedure terminates in
      O(N^{D_0 omega}) operations and returns one of three verdicts, and on the
      two decided verdicts the returned certificate is independently
      verifiable. That is uniform and needs no heuristic. SEPARATELY AND
      HEURISTICALLY: FOR THE INSTANCE DISTRIBUTION at a cell, pi is the
      probability of a decided verdict, and the cost statement quantifies over
      the distribution, not over instances. The dangerous conflation - "for
      every instance the cost is N^{D_0 omega} AND the answer is obtained" - is
      FALSE and is exactly what the UNDECIDED branch prevents anyone from
      writing.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For these cells, relation collection with a degree-D_0 cap decides a
        fraction pi of instances at a deterministic per-attempt cost, and the
        collected relations have full rank; therefore the total cost is the
        stage-1 expression divided by pi, with NO degree assumption." It can
        NEVER certify a subexponential ECDLP algorithm, because that requires
        the decay law for pi at n = 409 or 571, which no toy measurement can
        supply - only an explicitly labelled extrapolation, or the rigorous
        ingredient of (D) if its audit succeeds.
      nearby_object_control: >-
        BLOCKING, AND IT IS THE PROVES-TOO-MUCH FIXTURE. Apply the same capped
        procedure, and any reading of Huang's semi-local bound, to a RANDOM
        Boolean quadratic system in N variables with exactly one planted
        solution - small characteristic, small rational-solution count, exactly
        the favourable-looking regime. If the capped procedure decides those at
        constant D_0 with high probability, then either random MQ with a
        planted solution is easy (which would be an enormous result requiring
        its own verification, not a footnote) or the instrument is wrong. The
        expected and predicted outcome is that pi collapses rapidly with N on
        the random MQ control while being materially larger on the Semaev
        systems - and THAT GAP, if it exists, is the first quantitative
        evidence in this program that Semaev systems are algorithmically
        special in a way a cost model can use. If the gap is absent, the whole
        "slower than random" intuition loses its algorithmic reading.
    proof_obligations:
      - claim: >-
          The degree-D_0 determinacy test and the 1-in-row-space test are
          correct: SOLVED implies a genuine decomposition and UNSAT implies
          none exists.
        responsibility: correctness
      - claim: >-
          Every SOLVED verdict's certificate is re-verified by independent
          point addition, and every UNSAT verdict's certificate by independent
          re-derivation.
        responsibility: interface
      - claim: >-
          Per-attempt cost is O(N^{D_0 omega}) with the constant measured, and
          memory is bounded by the degree-D_0 monomial count.
        responsibility: runtime
      - claim: >-
          Target re-randomisation is exact and the logarithm is recovered from
          the known (a, b).
        responsibility: correctness
      - claim: >-
          The retained relations are not rank-deficient relative to unfiltered
          collection at matched counts.
        responsibility: feasibility
      - claim: >-
          pi is measured with its instance-class stratification and its decay
          law reported with an extrapolation flag.
        responsibility: success_probability
      - claim: >-
          At pi = 1, D_0 = 4 the cost expression reproduces Semaev's Table 3.
        responsibility: baseline
      - claim: >-
          The random-MQ proves-too-much control behaves as a control and not as
          a success.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        verdict correctness against exhaustive ground truth on toy cells
        (n <= 16, m = 3, k = ceil(n/3)), 200 instances with planted
        decompositions and 200 verified decomposition-free targets
      direction: different
      minimum_effect: >-
        FORCED PERFECT: zero SOLVED verdicts without a verifying point
        addition, zero UNSAT verdicts where an exhaustive search over V^m finds
        a decomposition. A single error voids the instrument and the battery
        stops.
    - metric: >-
        pi(D_0 = 4; n, m = 3, k = ceil(n/3)) for n in {12, 15, 18, 21, 24}
      direction: lower
      minimum_effect: >-
        THE CENTRAL MEASUREMENT, with a pre-registered reading. If pi stays
        above 0.5 across the ladder, the capped scheme is alive and the decay
        law is fitted and reported. If pi falls below 2^{-0.1 n} at any two
        consecutive n, the scheme is dead as an exponent proposal at D_0 = 4
        and the record says so - at n = 24 that is pi below 0.06, an easily
        measured threshold. The intermediate regime is reported as a fitted
        law with its confidence interval and an explicit extrapolation flag.
    - metric: >-
        the D_0 ladder: pi(D_0) for D_0 in {4, 5, 6} at fixed n
      direction: higher
      minimum_effect: >-
        pi must be non-decreasing in D_0 by construction (a larger cap can only
        decide more), which is a CORRECTNESS CHECK, not a finding; a measured
        decrease is an implementation defect. The finding is the SHAPE: how
        much cap must be bought to restore pi, since the cost multiplies by
        N^{omega} per unit of D_0 and the trade is the whole engineering
        question.
    - metric: >-
        rank of the collected relation matrix versus the number of relations
        collected, filtered versus unfiltered, at matched counts
      direction: different
      minimum_effect: >-
        THE KILL SWITCH. Predicted equal to within 2 percent - i.e. filtering
        does not bias the relation lattice. If the filtered matrix's rank grows
        measurably slower, the scheme cannot complete stage 2 regardless of pi
        and the proposal is dead for a reason that has nothing to do with
        degrees. This metric is required and is reported first.
    - metric: >-
        pi on the random-MQ planted-solution control at matched (N, D_0)
      direction: lower
      minimum_effect: >-
        Predicted to collapse with N far faster than on the Semaev arm, with
        the ratio pi_Semaev / pi_MQ growing. If the two are indistinguishable,
        the Semaev systems have no measurable algorithmic advantage at a fixed
        cap and "slower than random" has no cost-model content at these cells -
        a clean, publishable negative for the whole lane.
    - metric: >-
        the (D) audit verdict on Huang arXiv:2311.02804
      direction: different
      minimum_effect: >-
        A WRITTEN VERDICT IS THE DELIVERABLE, one of exactly three: (i) the
        hypotheses exclude descended Semaev systems, with the excluding
        hypothesis quoted - a useful closure; (ii) they do not, with the bound
        instantiated and a numerical D_0 stated - which would be a major
        ingredient and goes to the Coordinator immediately; (iii) the naive
        reading proves too much on the random-MQ control, with the specific
        hypothesis that must be doing the work identified. Returning no verdict
        is not an option and the audit is ZERO COMPUTE beyond reading.

  minimal_test:
    design: >-
      STAGE 0 - ZERO COMPUTE, THE AUDIT AND THE BASELINE. (i) Fetch and read
      arXiv:2311.02804 in full; state which hypotheses a descended Semaev
      system with field equations satisfies and which it does not; write the
      verdict. (ii) Symbolically reproduce Semaev's stage-1 expression from the
      capped formula at pi = 1, D_0 = 4, and re-check the Table 3 cells against
      inputs/SEMAEV-2015-310/tables.yaml. Both are reading and arithmetic.
      STAGE 1 - CORRECTNESS GATE, HOURS. Implement the three-way verdict on the
      existing descended chained system at n <= 16, and validate against
      exhaustive ground truth over V^m on 400 instances (200 planted, 200
      verified decomposition-free). Zero errors required.
      STAGE 2 - THE KILL SWITCH, HOURS. Collect relations filtered and
      unfiltered at n in {12, 15}, matched counts, and compare rank growth.
      If filtering biases the lattice, STOP AND REPORT - the rest of the
      battery is pointless and the record says so in advance.
      STAGE 3 - THE YIELD LADDER, THE MAIN COST. pi(D_0 = 4) at
      n in {12, 15, 18, 21, 24}, m = 3, k = ceil(n/3), 200 uniformly random
      targets per cell, stratified reporting by instance class (satisfiable /
      unsatisfiable / degenerate) and never pooled. Every cell that exceeds the
      memory contract is reported as NOT MEASURED with its pre-flight monomial
      count; that is an infrastructure stop, never evidence about degrees.
      STAGE 4 - THE CAP LADDER, HOURS. pi(D_0) for D_0 in {4,5,6} at n = 12, 15
      with the monotonicity check.
      STAGE 5 - THE PROVES-TOO-MUCH CONTROL, HOURS. The same procedure on
      random Boolean quadratic systems with one planted solution at matched
      (N, D_0), and the ratio pi_Semaev / pi_MQ.
      STAGE 6 - ZERO COMPUTE. Report: the audit verdict, the yield table, the
      fitted decay law with an explicit extrapolation flag, the rank-bias
      result, the MQ ratio, and the exponent condition -log2 pi =
      o(sqrt(n ln n)) evaluated AS A CONDITION ON THE FIT, never as a claim
      about n = 409 or 571.
    controls:
      - >-
        EXHAUSTIVE GROUND TRUTH at n <= 16 for every verdict (blocking).
      - >-
        RANK-BIAS CONTROL: filtered versus unfiltered relation collection at
        matched counts (blocking; the kill switch).
      - >-
        RANDOM-MQ PLANTED-SOLUTION CONTROL (blocking nearby object; the
        proves-too-much fixture).
      - >-
        MONOTONICITY IN D_0 as a correctness check.
      - >-
        POLLARD RHO ON THE SAME TOY CURVES as the mandatory matched cost
        control, so no "faster" is ever reported without the baseline that
        actually has to be beaten.
      - >-
        GENERIC-GROUP CONTROL: repeat any claimed information gain on a
        relabelled Z/nZ with the same acquisition budget, per the object-frame
        requirement for a branching object.
      - >-
        UNSAT CERTIFICATE RE-DERIVATION by an independent checker, and SOLVED
        certificate re-verification by independent point addition.
      - >-
        DEGENERATE-INSTANCE ARM: targets in the factor base, 2-torsion targets,
        and the order-2 channel of KN-TECH-b18366 enumerated and reported
        separately.
    required_metrics:
      - 'verdict counts by class and cell; verdict errors against ground truth (must be 0)'
      - 'pi(D_0; n, m, k) per cell with binomial confidence intervals, stratified by instance class'
      - 'per-attempt wall time, peak RSS, and the measured constant in N^{D_0 omega}'
      - 'rank of collected relation matrix versus count, filtered and unfiltered'
      - 'pi on the random-MQ control at matched (N, D_0), and the ratio'
      - 'fitted decay law for -log2 pi with CI and an explicit extrapolation flag'
      - 'Pollard rho cost on the same toy curves'
      - 'the written audit verdict on arXiv:2311.02804 with quoted hypotheses'
      - 'NOT MEASURED cells with pre-flight monomial counts'

  falsification_conditions:
    - >-
      Any verdict disagrees with exhaustive ground truth. The instrument is
      wrong and the battery stops; nothing is reported about yields.
    - >-
      Filtered relation collection has measurably slower rank growth than
      unfiltered at matched counts. The scheme cannot complete stage 2 and is
      dead independently of pi. This is the pre-registered kill switch.
    - >-
      pi(D_0 = 4) falls below 2^{-0.1 n} at two consecutive n. The capped
      scheme at D_0 = 4 is dead as an exponent proposal, and the honest report
      is that Assumption 1 is not merely unproved but quantitatively far from
      holding at those cells - which would be a substantive negative about the
      literature's central assumption.
    - >-
      pi is not monotone in D_0. Implementation defect; every number is void.
    - >-
      pi on the Semaev arm is statistically indistinguishable from pi on the
      random-MQ control. "Slower than random" has no algorithmic content at
      these cells, and the lane's central intuition loses its cost-model
      reading.
    - >-
      The (D) audit finds the naive reading proves too much AND cannot identify
      which hypothesis prevents it. The ingredient is unusable and is recorded
      as such, with the specific unresolved point named.
    - >-
      At pi = 1, D_0 = 4 the capped cost expression fails to reproduce Semaev's
      Table 3. The restructuring is not an embedding of his algorithm and the
      whole accounting is wrong.

  confounders:
    - >-
      SELECTION BIAS IN THE RELATION LATTICE. The kill-switch control exists
      because this is the dominant risk and it is not detectable from pi alone.
    - >-
      pi IS DISTRIBUTION-DEPENDENT. It is defined over the instance
      distribution the algorithm actually generates (uniform a, b), and a
      measurement over a different target distribution measures a different
      number. The distribution is declared per cell and stratified reporting is
      mandatory because satisfiable and unsatisfiable instances are expected to
      have very different yields and pooling them would create an artifact.
    - >-
      THE UNSAT BRANCH MAY DOMINATE. At Semaev's parameters most targets have
      NO decomposition, so most verdicts should be UNSAT; a high pi driven
      entirely by cheap UNSAT certificates says nothing about the algorithm's
      ability to FIND relations. Yields are therefore reported per class and
      the operative quantity for the cost model is pi restricted to satisfiable
      instances, stated separately.
    - >-
      MEMORY IS NOT IN THE MODEL. Semaev's own analysis omits memory while
      stage 2 must store Theta(2^k) relations (2^38 at n = 409, 2^48 at
      n = 571, with Galbraith's dense reading at 2^91 bits). The capped scheme
      inherits that gap unchanged and does not fix it; any comparison against
      Pollard rho, whose memory is negligible, must charge it (KN-OPEN-86e7e1).
    - >-
      DEGREE CONVENTION AND FIELD EQUATIONS. The cap D_0 is a total degree
      after Boolean reduction; a different convention is a different algorithm.
      This is the true/fake first-fall-degree distinction of KN-OPEN-7f0511
      reappearing as an implementation choice, and it is declared per run.
    - >-
      omega. The exponent N^{D_0 omega} carries the linear-algebra exponent;
      2.376 <= omega <= 3 is quoted in the source, and the record reports both
      ends rather than choosing the flattering one.

  interpretation_limits:
    - >-
      NO SUBEXPONENTIAL CLAIM IS MADE. The record restructures a conditional
      cost model so that its condition is measurable. A measured pi at n <= 24
      says nothing about n = 409 or 571 and any statement there is an
      explicitly flagged extrapolation, never a conclusion.
    - >-
      Nothing here bears on the security of any deployed curve in either
      direction. A small pi does NOT refute Semaev's Assumption 2, and a large
      pi does NOT establish Assumption 1; the two must not be refuted or
      supported as one (KN-OPEN-d218ec's explicit warning).
    - >-
      Claim (D) rests on an ABSTRACT ONLY. Nothing in (A), (B), (C) or (E)
      depends on Huang's bound; (D) is an audit task with three pre-declared
      outcomes.
    - >-
      Toy scale only for every measured cell; curves are public and
      self-generated; lawful defensive cryptanalysis.
    - >-
      KN-OPEN-020 class: not applicable - the existing factor base is used
      unchanged and no new membership description is proposed.
    - >-
      This is an ALGORITHM-SHAPED ACCOUNTING PROPOSAL, and its best realistic
      outcome is a measured obstruction, not a faster attack.

  heuristic_assumptions:
    - id: H1
      statement: >-
        Over the algorithm's own instance distribution (targets R = aP + bQ
        with a, b uniform, factor base fixed), the capped verdicts are
        independent across attempts, so the number of attempts to a decided
        relation is geometric with parameter pi and the expected relation-
        collection cost is the per-attempt cost divided by pi.
      rigorous_support: >-
        The rigorous ingredient is that the re-randomisation is EXACT: a fresh
        (a, b) gives a uniformly distributed target in the subgroup by
        construction, with no mixing-time argument required, so the instances
        are genuinely i.i.d. given the fixed factor base. What remains
        heuristic is only that the FIXED factor base does not induce
        correlation across targets - the classical statement imitated is the
        standard independence heuristic used in every index-calculus yield
        analysis, including Semaev's own Section 4.3 model treating
        x_1..x_t -> S_{t+1}(x, z) as a symmetric random map.
      validation_plan: >-
        SAMPLE - 2000 consecutive attempts at n = 12 and n = 15 with a FIXED
        factor base, recording the verdict sequence. COMPARISON DISTRIBUTION -
        the observed run-length distribution of UNDECIDED streaks against the
        geometric distribution with the measured pi; a chi-square goodness of
        fit at the 1 percent level, reported per cell with the NUMBER OF
        FAILING CELLS rather than the best cell. TAIL CHECKS - (a) the longest
        observed UNDECIDED streak against the geometric upper tail at the
        1/1000 level, since positive correlation would show up first in the
        tail; (b) the yield measured with 5 DIFFERENT factor bases at the same
        n, to separate factor-base effects from target effects; (c) the
        autocorrelation of the verdict indicator at lags 1-10. SAMPLED
        PARAMETERS RECORDED - n, m, k, curve, curve order, factor base seed,
        (a, b) seed, D_0, degree convention. TRANSFER ASSUMPTIONS - none;
        independence measured at n <= 15 is not assumed at n = 24, and the
        n = 24 cell carries its own shorter check or is reported without it.
    - id: H2
      statement: >-
        -log2 pi(D_0 = 4; n) grows at most polylogarithmically in n over the
        tested ladder, i.e. the fitted exponent in a model
        -log2 pi = alpha * n^beta has beta < 1/2 with its confidence interval
        excluding 1/2, which is the condition under which the capped scheme
        preserves Semaev's subexponential form.
      rigorous_support: >-
        NO THEOREM SUPPORTS THIS AND THE RECORD SAYS SO PLAINLY - it is the
        replacement for Assumption 1 and it is EXPECTED to be the assumption
        that breaks. The rigorous anchor is one-sided and weak: pi is
        non-decreasing in D_0 and equals 1 whenever Assumption 1 holds, so any
        measured pi < 1 is direct quantitative evidence against Assumption 1 at
        that cell, which is a rigorous consequence of the measurement whatever
        the fit does. The classical statement imitated is the usual
        smoothness-probability shape in subexponential index calculus, where a
        yield decaying like a power of a subexponential quantity leaves the
        overall form intact.
      validation_plan: >-
        SAMPLE - 200 targets per cell at n in {12,15,18,21,24}, m = 3, plus a
        second m arm (m = 4 at the n where it is affordable) so that beta is
        not fitted along a single ray in (n, m, k). COMPARISON DISTRIBUTION -
        the fitted alpha * n^beta against the alternative alpha * 2^{gamma n}
        (exponential decay), with model selection reported by both fits'
        residuals rather than by choosing one; and against the random-MQ
        control's fit, which supplies the empirical "no structure" shape.
        TAIL CHECKS - (a) the worst cell's pi reported individually; (b) the
        satisfiable-only pi reported separately, since it is the operative one
        and is expected to be the smaller; (c) the fit repeated with the
        largest n dropped, to show whether the conclusion rests on one cell.
        SAMPLED PARAMETERS RECORDED - as H1 plus the instance class.
        TRANSFER ASSUMPTIONS - EXPLICIT AND FLAGGED: extending the fit to
        n = 409 or 571 is an extrapolation of 17x to 24x in n beyond the
        measured ladder, comparable to the 27x extrapolation the corpus already
        flags in Semaev's own Assumption 1 support, and no conclusion at those
        n is drawn.

  target_complexity:
    time_exponent: >-
      CONDITIONAL AND STATED AS A FORMULA, NOT A NUMBER. Relation collection
      costs about m! * 2^{n/m} * 2^k * N^{D_0 omega} / (2^{mk} * pi) with
      N = n(m-1), plus stage 2 at 2^{k omega'} with omega' = 2. At pi = 1 and
      D_0 = 4 this is exactly Semaev's expression and balances to
      2^{1.6986 sqrt(n ln n)}. In general the exponent becomes
      1.6986 sqrt(n ln n) + log2(1/pi) + (D_0 - 4) omega log2 N, so the
      subexponential form survives IF AND ONLY IF log2(1/pi) =
      o(sqrt(n ln n)) - which is the measurable condition and is the entire
      content of the proposal. NO IMPROVEMENT ON SEMAEV IS CLAIMED; at pi < 1
      the capped scheme is strictly SLOWER than his conditional claim, and what
      it buys is that its cost is not conditional on an unmeasurable degree.
    memory_exponent: >-
      Per attempt: the degree-D_0 Macaulay matrix, O(N^{D_0}) bits before
      sparsity, which is polynomial and bounded in advance by a pre-flight
      monomial count. Overall: UNCHANGED AND UNFIXED - stage 2 still stores
      Theta(2^k) relations, 2^{38} at n = 409 and 2^{48} at n = 571 on
      Semaev's own parameters, with Galbraith's dense reading at 2^{91} bits
      and this program's independent recovery of 2^{91.8}. The capped scheme
      inherits that entirely and this record does not pretend otherwise.
    best_known: >-
      Pollard rho at 0.886 sqrt(N) group operations with O(1) memory - the
      unconditional baseline and the one that must actually be beaten. Semaev's
      2^{1.6986 sqrt(n ln n)} CONDITIONAL on Assumption 1, with a claimed rho
      crossover at n > 310. Nagao's O(n^{8w+1}) CONDITIONAL on the same
      assumption plus an unproved Proposition 5. Karabina's all-S_3 route with
      a stated crossover at n > 457 conditional on D_reg <= 4. Every one of
      these is conditional on the quantity this record replaces by a
      measurement.
    hidden_overhead: >-
      Four disclosures. (1) pi is UNMEASURED - the record's whole cost claim is
      a formula with an empty slot, and the honest reading is that it proposes
      to fill it. (2) The D_0 ladder costs N^{omega} per unit of cap, so a
      scheme that needs D_0 = 6 pays a factor N^{2 omega} over D_0 = 4, which
      at N ~ n^{3/2} is not small. (3) Memory is inherited unfixed. (4) omega
      is quoted as a range, not a value.
    tradeoff_note: >-
      Per-attempt work is embarrassingly parallel across targets with zero
      communication and O(1) shared state, which is the favourable half; stage
      2's sparse linear algebra over Theta(2^k) relations is the unfavourable
      half and is the same bottleneck as in the unmodified algorithm. Against
      van Oorschot-Wiener parallel rho, which has negligible memory and perfect
      parallel scaling, the capped scheme must charge 2^k storage and its
      access pattern; no interpolation between them is proposed here.

  dominated_by: >-
    CHECKED ROW BY ROW AGAINST EVERY FRONTIER ENTRY. On TIME at the parameters
    where any of this is measured (toy, n <= 24): DOMINATED BY POLLARD RHO,
    decisively, and the mandatory rho control makes that visible in every
    report. On TIME asymptotically: DOMINATED BY SEMAEV'S OWN CONDITIONAL
    CLAIM whenever pi < 1, since this is his algorithm with a cap and a discard
    - the record improves his EPISTEMIC position, not his cost, and epistemic
    position is not a Pareto axis. On MEMORY: dominated by rho (O(1)) and by
    van Oorschot-Wiener; it inherits Semaev's 2^k storage unchanged and
    improves nothing. On DATA/QUERIES: no oracle access beyond the instance,
    same as rho; not dominated and not improved. Also checked: BSGS
    (N^{1/2}, N^{1/2}), multi-target rho sqrt(TN), the preprocessing frontier
    S T^2 = Omega~(N), meet-in-the-middle index calculus (N^{1/2 + 1/m},
    N^{1/2}), Nagao's conditional polynomial claim, and Karabina's conditional
    crossover. NOTHING IS APPROACHED ON ANY AXIS AND THE RECORD CLAIMS NO
    PARETO IMPROVEMENT.
  sota_delta: >-
    Zero on time, memory and data at every measured scale, and the rho control
    is required precisely so that stays visible. The quantified delta is
    elsewhere and is stated exactly: the exponent 1.6986 sqrt(n ln n) currently
    rests on an assumption whose support is 2300 systems at n <= 21, m <= 6
    plus one cell at n = 40, with unreproduced counter-data at n = 45, and
    which the source paper itself reports failing off the diagonal
    k = ceil(n/m). This record replaces that assumption by a number measurable
    at n = 12..24 and turns the asymptotic claim into the single condition
    log2(1/pi) = o(sqrt(n ln n)). If pi is measured and large, the literature's
    central heuristic acquires its first quantitative support of a new kind; if
    pi is measured and small, the corpus gains the first quantitative evidence
    AGAINST Assumption 1 that is not an unreproduced blog comment. Either way
    the delta is an epistemic one, and this record does not dress it as a
    speedup.

  estimated_cost:
    implementation: medium
    compute: medium
    basis: >-
      Implementation MEDIUM: the descended system builder, the exact GF(2) rank
      engine and the pre-flight abort exist; what is new is the three-way
      verdict (a determinacy test and a 1-in-row-space test on the same
      matrix), the two independent certificate checkers, the filtered/unfiltered
      relation-collection harness, and the random-MQ control generator. The
      corpus records one wrong-observable incident in this lane
      (KN-OPEN-5b3a08), so the exhaustive-ground-truth gate is not optional.
      Compute MEDIUM: Stage 1 is hours; Stage 3's 200 attempts per cell at five
      cells is the dominant cost and is bounded per attempt by the degree-4
      monomial count, with n = 24 expected to be the first NOT-MEASURED cell.
      Stage 5 doubles Stage 3. All budgets are advisory per the standing
      research-budget policy.

  recommended_priority: medium

  discriminated_from: >-
    This is NOT "run XL at degree 4", which is standard and would be
    `known`: the content is (i) the three-way CERTIFIED verdict with an
    explicit UNDECIDED branch that is discarded rather than escalated,
    (ii) the exact re-randomisation that makes discarding free, and (iii) the
    replacement of Semaev's Assumption 1 by pi in his own cost expression with
    the exponent condition stated. KN-OPEN-d218ec's resolution criterion 4
    proposes CERTIFYING that a degree-5 step is entered; this record makes that
    certificate the algorithm's control flow rather than a diagnostic.
    IDEA-20260916-4b7c1e supplies the bounded rank primitives and is a
    prerequisite. IDEA-20260916-9d2fa6 and IDEA-20260916-71ab94 are about the
    degree's structure; this one is about not needing to know it.

