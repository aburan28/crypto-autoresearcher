idea:
  id: IDEA-20260815-47638d
  question_id: RQ-ICEX-001
  added: '2026-08-15'
  title: >-
    RUN THE ICEX COMPARISON NOW ON OPTIMISTIC HANDED-OVER INPUTS, AS A PURE
    GO/NO-GO: if index calculus loses to rho even when every blocked G4-G6
    input is replaced by its most favourable admissible value, the entire
    Tier-2 measurement programme is unnecessary and the campaign can stop
    paying for it
  class: cost-model

  claim: >-
    GOAL-ICEX-001 is non-executing pending charged SDEG, MONO and RELN
    packages, and those are each deferred. So the campaign is paying for
    three expensive measurement lanes whose only consumer is blocked. There
    is a zero-risk shortcut nobody has taken: instantiate the ICEX
    comparison with each missing input set to THE MOST FAVOURABLE VALUE ANY
    ADMISSIBLE MEASUREMENT COULD RETURN, and see whether index calculus
    wins. IF IT STILL LOSES, no achievable measurement outcome can change
    the verdict and the whole Tier-2 programme is dominated before it runs.
    If it wins, the comparison is sensitive to the inputs, which tells the
    campaign exactly WHICH input the verdict hinges on and therefore which
    lane to fund first. Either outcome is decision-relevant and the compute
    cost is essentially zero.

  mechanism: >-
    Enumerate every input ICEX consumes. For each, derive the most
    favourable value consistent with admissible bounds -- Bezout and tuple-
    image counting caps for relation supply, best-case solving degree, zero-
    cost rerandomization, free preprocessing, ideal sparse linear algebra.
    Instantiate the charged comparison at those values, sweep toy sizes, and
    report the exponent. Then perform a one-at-a-time sensitivity analysis
    to rank inputs by how much the verdict moves with each.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Read of GOAL-ICEX-001's next_action and DEC-20260731-015 / EV-
      ICEX-001; grep for 'optimistic upper bound' (0), 'go/no-go' (0),
      'handed-over' (1), 'best case input', 'sensitivity ranking'.
    results: >-
      The lane is explicitly non-executing and no measurement is
      authorised. No record performs an optimistic-bound instantiation or
      ranks the inputs by verdict sensitivity. The zero hits on the
      framing terms are consistent with the lane treating execution as
      all-or-nothing.
    verdict: >-
      UNVERIFIED. Optimistic-bound screening is elementary operations
      research and nothing methodological is new; the contribution is
      applying it to unblock a campaign decision that is currently waiting
      on three deferred lanes.

  object_first_candidate:
    tracked_object: >-
      THE ICEX VERDICT ITSELF as a function of its inputs, rather than as
      a number awaiting them.
    lossiness: >-
      Replacing a distribution of possible measurement outcomes by its
      most favourable extreme is deliberately lossy in one direction only,
      which is what makes a negative conclusive and a positive
      uninformative.
    propagation: >-
      Not applicable; cost-model instantiation.
    survival_score: >-
      Survives as long as each input has a defensible admissible upper
      bound. Inputs with no such bound are the record's real limitation
      and must be listed explicitly rather than assigned a guess.

  null_object_control: >-
    NULL 1 -- THE PESSIMISTIC INSTANTIATION at the other extreme, which
    bounds the verdict from below and brackets the achievable range;
    reporting only the optimistic end would be indefensible. NULL 2 -- rho
    and BSGS costed under the SAME cost model and the same optimism, since
    optimism applied to only one side of a comparison is exactly how a
    favourable result gets manufactured. NULL 3 -- a sanity instantiation at
    published literature values, which should reproduce published
    conclusions.

  discriminated_from:
    - >-
        The blocked ICEX measurement programme. NOT A SUBSTITUTE FOR IT
        and produces no measurement: it produces a bound on what the
        measurements could conclude. A negative here would retire the
        programme; a positive leaves every measurement obligation exactly
        where it is.
    - >-
        IDEA-20260727-003 (free-oracle admissibility frontier). CLOSE
        NEIGHBOUR: that record measures the relation-count and linear-
        algebra floor any prime-field index calculus must clear. This one
        instantiates the full comparison at optimistic values across all
        inputs, and should CONSUME that record's floor as one of its
        admissible bounds rather than recomputing it.

  assumptions:
    - >-
        Every ICEX input has a defensible admissible optimistic bound.
        FALSE FOR SOME INPUTS -- notably any whose favourable direction is
        unbounded -- and those must be listed as unbounded rather than
        assigned an arbitrary value, which would make the whole exercise
        circular.
    - >-
        Rho and BSGS baselines are costed under the identical model. Non-
        negotiable: asymmetric optimism invalidates the comparison
        entirely.

  predictions:
    - metric: >-
        literature-value sanity instantiation
      direction: different
      minimum_effect: >-
        FORCED to reproduce published conclusions. Failure means the
        comparison harness is wrong and no verdict from it is
        admissible.
    - metric: >-
        ICEX exponent under fully optimistic inputs versus matched-
        optimism rho
      direction: different
      minimum_effect: >-
        The go/no-go. A loss under full optimism is conclusive against
        the programme; a win is uninformative about reality and only
        identifies sensitivity.
    - metric: >-
        one-at-a-time sensitivity ranking of inputs
      direction: different
      minimum_effect: >-
        Produces an ordered list of which lane to fund first. Even under
        a negative verdict this ranking is the campaign's most
        actionable output.
    - metric: >-
        number of inputs with no admissible bound
      direction: different
      minimum_effect: >-
        Reported explicitly. A large count weakens the record
        proportionally and must be stated up front, not buried.

  minimal_test:
    design: >-
      Symbolic instantiation plus a small numeric sweep at toy sizes. No
      experiment, no curve arithmetic, hours of work. It is the cheapest
      decision-relevant artifact available to this campaign right now.
    controls:
      - >-
          Pessimistic instantiation, bracketing the range.
      - >-
          Matched optimism applied to rho and BSGS.
      - >-
          Literature-value sanity check reproducing published
          conclusions.
      - >-
          Explicit list of inputs with no admissible bound.
    required_metrics:
      - >-
          Exponent under optimistic, pessimistic and literature
          instantiations.
      - >-
          Sensitivity ranking of inputs by verdict movement.
      - >-
          Count and identity of unbounded inputs.
      - >-
          The cost model, stated once and applied to both sides.

  falsification_conditions:
    - >-
        The literature instantiation does not reproduce published
        conclusions. Harness wrong; halt.
    - >-
        Too many inputs lack admissible bounds. The exercise is not
        decision-relevant and must say so rather than proceed with
        guesses.
    - >-
        Optimistic index calculus still loses to matched-optimism rho.
        Tier-2 programme retired -- the record's highest-value outcome.
    - >-
        Optimistic index calculus wins by a wide margin across all
        instantiations. The verdict is input-insensitive in the other
        direction and the measurement programme is genuinely necessary.

  confounders:
    - >-
        ASYMMETRIC OPTIMISM, the dominant risk: optimism applied to index
        calculus but not to rho manufactures a win. Matched treatment is
        enforced mechanically by costing both under one model in one code
        path.
    - >-
        UNBOUNDED INPUTS silently assigned plausible values, which
        converts a bound into a guess while retaining the language of a
        bound.
    - >-
        TOY-SIZE ARTIFACTS: exponents fitted at toy sizes are not
        asymptotic and the go/no-go must be stated at the tested sizes
        only.

  interpretation_limits:
    - >-
        A negative retires the programme within the stated bounds and cost
        model, not universally.
    - >-
        A positive establishes nothing about reality -- it is an upper
        bound and says only that measurement is warranted.
    - >-
        No measurement, no evidence about actual index-calculus
        performance, no crypto-scale claim.

  heuristic_assumptions:
    - id: HEUR-ICEX-OPT-1
      statement: >-
        The most favourable admissible value of each ICEX input is
        simultaneously achievable, so the optimistic instantiation
        upper-bounds any achievable index-calculus exponent.
      rigorous_support: >-
        The rigorous ingredient is that each individual bound is
        admissible by a cited counting or complexity argument. THE GAP,
        WHICH IS REAL: the inputs are not independent -- a factor base
        large enough to maximise relation supply also maximises linear-
        algebra cost -- so the joint optimum may be unachievable and the
        instantiation may be optimistic beyond what any real
        configuration attains. That makes a NEGATIVE verdict stronger
        and a positive one weaker, which is the safe direction for a
        go/no-go.
      falsification_condition: >-
        Exhibiting an input combination that is jointly infeasible yet
        was instantiated as simultaneously optimal.
      validation_plan: >-
        SAMPLE: the full input list, checked pairwise for antagonistic
        coupling. COMPARISON: joint-optimum instantiation against a
        constrained optimisation respecting known couplings. TAIL CHECK:
        the input pairs with the strongest coupling reported explicitly.
        TRANSFER ASSUMPTION: none; the record is a bound, not a
        prediction.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Stated explicitly rather than omitted. The record
      computes an upper bound on an exponent under stated inputs; the
      exponent is not claimed as achievable and is explicitly an artifact
      of optimistic instantiation.
    memory_exponent: >-
      Negligible; symbolic and small numeric sweeps.
    best_known: >-
      The incumbents are Pollard rho and BSGS at O(sqrt(N)), costed here
      under matched optimism as the comparison baseline and not improved.
    hidden_overhead: >-
      The unbounded-input list is the hidden weakness: every input without
      a defensible bound reduces the record's conclusiveness, and the
      count must be reported prominently rather than in a footnote.
    tradeoff_note: >-
      Optimism buys conclusiveness on the negative side and destroys it on
      the positive side. The record is designed to be decisive in exactly
      one direction and says so.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed). As a
    measurement: dominated entirely by the blocked ICEX programme, which
    would produce real numbers where this produces bounds. As a bound: not
    dominated, because no optimistic instantiation exists in this program.
    As methodology: standard optimistic-bound screening, dominated by the
    operations-research literature. Not null on any axis.
  sota_delta: >-
    No attack, no exponent claim. Content delivered: a decision-relevant
    go/no-go available at essentially zero compute while three lanes sit
    deferred; a sensitivity ranking telling the campaign which blocked lane
    actually determines the verdict; an explicit list of inputs with no
    admissible bound; and a bracketing pessimistic instantiation so the
    optimistic number is never quoted alone.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.75 that enough inputs have defensible bounds for the exercise to be
    decision-relevant. 0.9 that the sensitivity ranking is produced and
    useful regardless of the verdict. 0.35 that optimistic index calculus
    still loses, which would retire the Tier-2 programme and is the outcome
    with by far the highest campaign value. 0.5 that the joint-achievability
    gap in HEUR-ICEX-OPT-1 is large enough that a red team would contest a
    positive verdict.

