idea:
  id: IDEA-20260813-5988b7
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-UOV-001
  goal_id: GOAL-UOV-001
  title: Same-oil conditional fibre diagnostics for compressed public maps
  class: measurement
  claim: >-
    After conditioning compressed and uncompressed toy public-map ensembles on
    the identical planted oil space and public dimensions, compression changes at
    least one preregistered certificate-fibre statistic beyond an exact seed-null
    envelope; falsify this claim if all statistics remain inside that envelope
    across the complete toy census and increasing sampled strata.
  mechanism: >-
    Compression may alter coefficient dependencies without altering the planted
    secret. Compare conditional ensembles using projection-fibre length,
    certificate multiplicity, Jacobian corank, and verifier-accepted extraneous
    branch count. Conditioning on the same oil space isolates compression-induced
    public-map structure from secret selection and parameter arithmetic.
  why_not_a_renamed_known_approach: >-
    IDEA-20260805-74349c asks whether seed entropy affects oil-space structure;
    this proposal fixes the exact oil space and measures solution-fibre geometry.
    IDEA-20260808-2b4581 is a cross-descendant discount ledger, not a conditional
    ensemble test. It stays in plain UOV and does not open MAYO/QRUOV/SNOVA lanes.
  predictions:
    - observable: Certificate-fibre scheme length
      metric: Conditional distribution and two-sample distance with exact permutation p-value
      predicted: A compression effect appears outside the exact seed-null envelope; otherwise the claim fails at the tested scope
    - observable: Jacobian corank on verifier-accepted and extraneous branches
      metric: Joint histogram conditioned on the identical oil space
      predicted: Genuine dependency structure changes branch geometry, while mere seed relabelling does not
    - observable: Effect persistence as seed entropy is destroyed
      metric: Standardized effect size over a preregistered seed-collision ladder
      predicted: A structural effect changes monotonically with dependency strength; nondecay under the null ladder indicates an artifact
  minimal_test:
    parameter_slice: Exhaustive smallest valid field/dimension slice plus two increasing toy slices under a source-checked compressed-key generator.
    procedure:
      - Sample one oil space, then generate paired compressed, uncompressed, exact-null, and planted-positive public maps conditioned on it.
      - Build the same attack formulation and enumerate or certify all toy branches without selecting successful seeds.
      - Compute fibre length, multiplicity, Jacobian corank, and certificate validity with frozen code and statistics.
      - Use paired randomization and report every seed, failed construction, and resource stop.
    discriminating_outcomes:
      - A paired effect absent from the exact null supports compression-induced dependencies rather than oil-space selection.
      - An effect reproduced by the null supports generator or seed-labelling artifact.
      - More roots without more verifier-accepted certificates supports extraneous algebraic branching rather than easier recovery.
  controls:
    - Exact null: replace the compression seed expansion by a uniformly random coefficient vector of the same length, then apply an independently random invertible relabelling while retaining the exact planted oil space and all public dimensions.
    - Planted positive: force a declared repeated coefficient block into otherwise uncompressed maps conditioned on the same oil space; the dependency detector must recover the known block and its induced fibre change.
    - Generator control: hash and compare expanded coefficient tensors before constructing systems so serialization differences cannot masquerade as structure.
    - Nearby random-public-map control: uniformly random public quadratic maps conditioned on the same planted oil space.
  confounders:
    - An unverified Round-3 compression specification or incorrect seed expander.
    - Seed collisions, serialization bias, or rejection sampling that changes the conditional distribution.
    - Nonreduced roots counted as distinct branches or verifier bugs.
    - Toy fields exaggerating dependencies that vanish at target parameters.
  falsification_conditions:
    - Every preregistered statistic lies within the exact-null envelope on the exhaustive slice and both increasing toy slices.
    - The planted positive is not detected at its known dependency strength.
    - Effects disappear after coefficient-tensor identity is enforced or are explained entirely by rejection counts.
    - Reported extra branches do not yield distinct scheme length or verifier outcomes.
  interpretation_limits:
    - Detection of structure is not an attack and implies no concrete-bit discount without a recovery path and cost model.
    - A null toy result does not prove compressed keys preserve Round-3 security.
    - Conditional same-oil results do not describe unconditional key-generation probabilities without reweighting.
    - No descendant-scheme inference is permitted.
  assumptions:
    - Primary Round-3 key-generation and compression specifications are retrieved and independently reimplemented first.
    - Paired compressed and uncompressed maps can be sampled conditional on an identical valid oil space.
    - A certificate verifier and multiplicity-aware toy solver are available.
  heuristic_assumptions:
    - id: H1
      statement: The selected fibre statistics are sensitive to exploitable coefficient dependencies.
      validation: Calibrate power against planted repeated-block strengths and require monotone response; failure rejects the statistic.
    - id: H2
      statement: Standardized conditional effects transfer beyond toy parameters.
      validation: Fit no asymptotic extrapolation until effect direction is stable across increasing slices and an analytically justified compression-dependency model exists.
  proof_search_map:
    bottleneck: Relate a detected conditional fibre shift to an explicit algebraic dependency and distinguish it from seed-generation artifacts.
    baseline_embedding:
      parameter_slice: One fixed toy oil space with paired maps under exact source-derived generators.
      reproduction_check: Independently reproduce coefficient tensors, public maps, and baseline attack-system statistics before comparing ensembles.
    observation_collision:
      audit: Search for compressed and uncompressed tensors with identical measured fibre vectors but different dependency ideals, and vice versa.
      failure_response: State the diagnostic collision and do not infer structural equivalence or security.
    constructive_transforms:
      - Conditional sampler fixing the oil-space certificate
      - Seed-null coefficient relabelling with exact distribution accounting
      - Dependency-ideal witness mapping a detected statistic to coefficient relations
    quantifier_order: Fix statistics, oil spaces, seed ladder, and stopping rules before drawing paired maps; claims quantify over the tested conditional ensemble only.
    method_ceiling:
      statement: Conditional two-sample diagnostics can reveal distribution shifts but cannot establish a lower recovery exponent.
      nearby_counterobject: A non-UOV random public-map ensemble with the same planted oil space and deliberately repeated coefficients.
    proof_obligations:
      - Conditional-sampler correctness
      - Exact-null exchangeability
      - Multiplicity-aware statistic correctness
      - Planted-positive power calibration
      - Any claimed attack link requires a separate certificate-preserving recovery and full cost proof
