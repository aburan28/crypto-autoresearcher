idea:
  id: IDEA-20261007-71c7df
  question_id: RQ-ECDLP-623a32
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Image size of x(P) + x(2P) on y^2 = x^3 + 4x + 1 over F_43
  class: measurement
  claim: >-
    On the nonsingular curve E: y^2 = x^3 + 4x + 1 over F_43, let D be
    the affine points with y(P) ≠ 0. Let t(P) = x(P) + x(2P). The
    image |t(D)| is at least |D|/3. This is an R1 chart statistic on
    the x-coordinate and its double. It is not a Hamming weight of x,
    not a modular bucket of x, and not a tangent-slope fiber.
  mechanism: >-
    OBJECT FRAME. The representation is the field element t(P). Sigma
    is the singleton {[2]}. TRICHOTOMY. Coordinate-dependent. x is
    invariant under negation, so t(P) = t(-P), and t is a function of
    the Kummer x-coordinate composed with doubling. The projection
    that keeps only t discards x itself. LOSSY-PROJECTION TEST. The
    duplication formula writes x(2P) as a rational function of x(P),
    so t is constant on the two points over one x, and |t(D)| is at
    most the number of distinct x-coordinates. The priced number is
    whether that image is still at least |D|/3. Families F1–F7 are
    not the lens. The sum x(P) + x(2P) is the object; a slope is not.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-623a32
      provenance: internal
      claim: >-
        Degree-2 coordinates are the Kummer line at model lever 1.
        This proposal does not claim a new model. It prices the image
        of one function of x.
      verified_by: ledger/questions/RQ-ECDLP-623a32.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A sub-square-root algorithm must exploit the representation.
        This proposal does not claim to go under the bound.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
    - ref: KR-RHO-fbd582
      provenance: internal
      claim: >-
        A shared inversion makes x(P-Q) cheap once x(P+Q) is known.
        This proposal does not use that identity.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-fbd582.yaml
  assumptions:
    - >-
      4·4^3 + 27·1^2 = 283 ≡ 25 (mod 43), so the discriminant is
      nonzero and E is nonsingular.
    - >-
      x(2P) is computed from the duplication formula after substituting
      y^2 = x^3 + 4x + 1. A point with y = 0 is outside D.
    - The curve y^2 = x^3 + x + 1 is not used.
  predictions:
    - metric: the ratio |t(D)| / |D|
      direction: higher
      minimum_effect: '>= 1/3'
  minimal_test: >-
    Enumerate E(F_43). Drop points with y = 0. Compute
    t(P) = x(P) + x(2P) and report |t(D)| and |D|. A second
    enumeration must agree. A control that reports the number of
    distinct x-coordinates must be at least |t(D)|, because t factors
    through x. If the distinct-x count is smaller than |t(D)|, the
    counter is void.
  controls:
    - two enumerations agree on |t(D)| and |D|
    - the number of distinct x-coordinates is at least |t(D)|
    - points with y = 0 are excluded
    - negation does not change t
    - y^2 = x^3 + x + 1 is not used
  falsification_conditions:
    - >-
      |t(D)| < |D|/3, the two enumerations agree, and the number of
      distinct x-coordinates is at least |t(D)|.
    - >-
      The distinct-x count is smaller than |t(D)|, or the two
      enumerations disagree. The counter is then void.
  confounders:
    - >-
      Using both square roots as two values of t when they share x
      would double-count the domain and inflate |D| without inflating
      the image.
    - >-
      A point with 2P at infinity has no x(2P). It stays outside D.
  interpretation_limits:
    - >-
      A ratio of at least 1/3 does not change the rho exponent 1/2
      and does not move the Kummer model lever.
    - >-
      A ratio below 1/3 falsifies this claim on this one curve only.
    - >-
      This is not the Hamming-weight comparison of x(P) with x(3P),
      not the largest modular bucket of x, and not a slope fiber.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The rational function x + x(2P) on this x-line takes at least
        |D|/3 distinct values. Doubling has degree 4 as a map on x,
        so a non-constant rational function of that shape has at most
        4 preimages on the x-line unless it collapses further. H1
        says it does not collapse below the threshold |D|/3.
      rigorous_support: >-
        The degree-4 shape of x(2P) is the duplication formula after
        clearing y^2. That bounds fibers of x(2P) on the x-line. It
        does not by itself force the image of x + x(2P) to meet
        |D|/3. The threshold is pre-registered.
      validation_plan: >-
        Compute the ratio on this curve. H1 fails if the ratio is
        strictly below 1/3 while the distinct-x count is at least
        |t(D)| and the two enumerations agree. Sample size is D.
  target_complexity:
    time_exponent: >-
      Unchanged at 1/2. An image size is not an exponent.
    memory_exponent: >-
      Unchanged. The census stores O(p) field elements at p = 43.
    best_known: >-
      KR-RHO-13bf67, Omega(N^{1/2}) generic-group operations, and
      KR-RHO-fbd582, a constant-factor saving on x(P-Q). Both files
      were opened for this proposal.
    hidden_overhead: >-
      No new o(1) cofactor is claimed.
    tradeoff_note: >-
      No time-memory tradeoff. The census is a single pass.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
