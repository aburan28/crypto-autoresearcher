idea:
  id: IDEA-20260809-c059a7
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ARGON-141710
  goal_id: GOAL-ARGON-001
  title: >-
    The only ratio that matters is defender-cost-per-login to attacker-cost-per-guess
    — measure it directly across the parameter space
  class: composition
  claim: >-
    Every parameter choice in password hashing is an attempt to maximize the
    attacker's cost per guess subject to the defender's cost per authentication.
    The claim is that both quantities are directly measurable on one harness, that
    their ratio across the parameter space is the single quantity a deployment
    actually needs, and that the ratio's maximum does not sit where the
    recommendation table's default sits — or does, which would be a strong
    validation of the defaults.
  mechanism: >-
    Measure defender cost as the honest evaluation's time and memory at each
    parameter point; measure attacker cost per guess as the best point on the
    tradeoff curve under a declared hardware profile; report the ratio surface.
  why_not_a_renamed_known_approach: >-
    The framing is the standard one in password-hashing guidance and is usually
    argued rather than measured. Producing the ratio surface from this program's
    own measurements of both sides is the contribution, and it depends on all the
    earlier records in the goal.
  predictions:
  - observable: ratio surface over the parameter space
    metric: attacker cost per guess divided by defender cost per authentication
    predicted: A ridge rather than a peak, since the two costs move together along one direction; the ridge's location is the deliverable.
  - observable: position of the recommendation table's defaults relative to the ridge
    metric: distance in parameter space
    predicted: >-
      Reported as measured. The record states the position and makes no
      recommendation, since the choice depends on a threat model this program
      does not own.
  minimal_test: >-
    Evaluate both costs across the parameter grid under one declared hardware
    profile, compute the ratio surface, and locate both the ridge and the defaults.
  controls:
  - 'SAME-HARNESS CONTROL: both costs measured in the same runs on the same machine, since a ratio between numbers from different environments is meaningless.'
  - 'PROFILE SENSITIVITY: the ridge is recomputed under a second hardware profile, and if it moves, the record reports the movement rather than a single ridge.'
  falsification_conditions:
  - The ratio surface is flat, meaning parameter choice does not affect the exchange.
  - The ridge moves substantially with the hardware profile, in which case no single ridge may be reported.
  interpretation_limits: >-
    The ratio is computed under declared assumptions with synthetic inputs and is
    not advice. Deployment choices depend on a threat model, an authentication
    volume and a hardware landscape this program does not model.
  sota_delta: 'No attack. Delta: a measured exchange surface where guidance is usually argued from principles.'
  dominated_by: Downstream of the whole goal; not dominated by any corpus record.
  estimated_cost: Implementation small on top of earlier records; compute high.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep: no password-hashing records. WEB NOT CHECKED.'
  source_refs:
  - RFC 9106 -- REQUIRED READ.
