idea:
  id: IDEA-20260815-e0a428
  question_id: RQ-PROP-24458b
  added: '2026-08-15'
  title: >-
    A COMPLETENESS CLAUSE FOR COFACTOR AUDITS, WHICH IS THE ONE THING EVERY
    EXISTING CHECKLIST LACKS: the rigidity theorem says every exactly-propagating
    lossy projection of a deployed curve group factors through a subgroup quotient,
    and each such quotient IS the computable map R |-> dR for d dividing h*N, so
    the divisors of the cofactor h enumerate the ENTIRE tractable attack class --
    an audit covering them is provably complete rather than merely thorough
  class: audit

  claim: >-
    (A) WHAT AUDITS CANNOT CURRENTLY SAY. Small-subgroup and invalid-curve attacks
    on deployed ECC are textbook, and this repository already carries 121 records
    touching cofactors. Every checklist for them is a LIST OF KNOWN CASES. None
    carries the clause a reviewer actually wants, which is "and there is nothing
    else of this kind". That clause is not rhetorical: its absence is why cofactor
    handling keeps being re-litigated per protocol and per library, and why a
    negative audit result reads as "we checked the cases we thought of".

    (B) THE CLAUSE, AND WHERE IT COMES FROM. Let the deployed group be
    G = <P> of order h*N with N a large prime and h the small cofactor. Two facts
    compose.
      FACT 1 (RIGIDITY, IDEA-20260807-df906f, generalised off prime order). If
      v: G -> S propagates exactly, the argument in that record shows v is constant
      on cosets of the subgroup H generated by all differences D with
      v(T) = v(T+D); so v factors through G/H. On PRIME order that forces injective
      or constant, which is that record's theorem. On COMPOSITE order it forces
      exactly this: every exactly-propagating map is a subgroup quotient composed
      with an injection. THERE IS NO THIRD POSSIBILITY, and that is the
      completeness the clause needs.
      FACT 2 (EFFECTIVITY). For cyclic G of order h*N, the quotient by the subgroup
      of order d is realised by the map R |-> dR, whose kernel is exactly that
      subgroup. So every quotient in Fact 1 is not merely abstract but PUBLICLY
      COMPUTABLE by one scalar multiplication.
    Together: the complete set of exactly-propagating lossy projections on a
    deployed curve group is { R |-> dR : d divides h*N }, all computable, and the
    ones an attacker can exploit are those whose image has tractable order -- i.e.
    order dividing h, since order divisible by N is as hard as the full problem.
    THE DIVISORS OF h ENUMERATE THE ENTIRE CLASS.

    (C) WHAT THIS BUYS AND WHAT IT DOES NOT. IT BUYS a completeness clause for one
    precisely delimited attack class, so an audit covering every divisor of h can
    state that no further map of that kind exists -- backed by an argument rather
    than by having thought hard. IT DOES NOT COVER: invalid-curve attacks (the
    point is not in G at all, so no map out of G is involved); twist attacks (a
    different group entirely); fault and side-channel attacks (not maps out of G);
    or anything probabilistic (bounded by IDEA-20260815-f558e4, not by this).
    STATING THE BOUNDARY IS MOST OF THE VALUE, because a completeness clause
    quoted outside its scope is worse than none -- it would license skipping the
    checks it never covered.

    (D) THE DELIVERABLE. A machine-checkable audit specification: given (curve, h,
    protocol), emit the complete divisor list, the corresponding tractable-image
    orders, the concrete test vector for each, and a scope statement naming the
    four excluded classes in (C). Plus a validation pass against curves whose
    cofactors differ structurally -- h = 1 (nothing to check, and the tool must say
    so rather than emit noise), h = 8 (Curve25519 shape), h = 4 (Ed448 shape) -- so
    the enumeration is exercised where it is trivial and where it is not.

  mechanism: >-
    STAGE 1 (SYMBOLIC). Write Fact 1's composite-order generalisation properly.
    IDEA-20260807-df906f proves the prime-order case; the coset argument is the
    same but the conclusion differs, and the generalisation must be stated and
    checked rather than assumed to follow "by the same argument". Include the
    degenerate cases: non-cyclic E(F_p), h sharing a factor with N, and h not
    coprime to the embedding degree.
    STAGE 2 (ENUMERATION TOOL). Given (p, curve, h, N) emit the divisor list, the
    map R |-> dR per divisor, the image order, and a tractability verdict per
    image. Exhaustive by construction -- the divisors of an integer are a finite
    computable set, which is what makes the completeness clause mechanical rather
    than editorial.
    STAGE 3 (VALIDATION AGAINST GROUND TRUTH). Run against curves where the answer
    is known: h = 1 curves (must emit an empty tractable list), h = 8 and h = 4
    standardized shapes (must emit exactly the known small-subgroup orders), and a
    deliberately constructed h with several prime factors (must emit all of them,
    including composite divisors, which is where a naive implementation that only
    lists PRIME divisors will fail -- and that failure mode is the specific bug
    Stage 3 exists to catch).
    STAGE 4 (SCOPE STATEMENT AND HANDOFF). Emit the four-class exclusion statement
    of (C) alongside every report, mechanically, so the clause cannot travel
    without its boundary.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep over ledger/proposals, ledger/hypotheses and knowledge/ for "cofactor"
      (121 hits), "small subgroup" (7), "small-subgroup" (8), "invalid curve" (6),
      "completeness of the audit" (0), plus a read of the rigidity record for
      whether it treats composite order.
    results: >-
      The attack class is thoroughly represented; the COMPLETENESS CLAUSE is not.
      No record derives the enumeration from a structural theorem, and
      IDEA-20260807-df906f treats prime order only -- composite order appears there
      solely as the boundary where its theorem stops.
    verdict: >-
      ADAPTATION, and the label is chosen deliberately rather than defended. The
      attack class is textbook, the maps R |-> dR are elementary, and the theorem
      is this program's own. NOTHING MATHEMATICAL IS NEW HERE. What is new is the
      composition into a completeness clause and the mechanical scope statement
      that keeps it honest. A record claiming more than `adaptation` for this would
      be overclaiming.

  object_first_candidate:
    tracked_object: >-
      NONE INTRODUCED. This record proposes no attack family and tracks nothing; it
      applies an existing structural theorem to bound an existing attack class.
      Recorded explicitly rather than left blank, per docs/inventor-protocol.md
      section 5.
    lossiness: >-
      Not applicable at this record's level. The maps it enumerates are lossy
      exactly when d > 1, which is the whole content of the enumeration.
    propagation: >-
      Exact, by construction -- R |-> dR is a group homomorphism.
    survival_score: not_applicable

  null_object_control: >-
    NULL 1 -- h = 1 CURVES, where the tractable list must be EMPTY. A tool that
    emits any finding on a prime-order curve is fabricating, and this check costs
    one line.
    NULL 2 -- A RANDOM INTEGER in place of the true cofactor, to confirm the tool
    is reading the curve's actual group order rather than a constant.
    NULL 3 -- A CURVE WITH LARGE PRIME COFACTOR (h itself a large prime), where the
    divisor list is non-empty but NOTHING IS TRACTABLE. This separates "the map
    exists" from "the map helps", which is exactly the distinction a naive
    enumeration collapses and the one most likely to generate a false finding.

  discriminated_from:
    - >-
      IDEA-20260807-df906f. NOT A RESTATEMENT: that record proves and uses the
      PRIME-ORDER case, where the conclusion is injective-or-constant. This one
      needs the COMPOSITE-ORDER form, which that record does not state and which
      Stage 1 must derive. The dependency is acknowledged and total.
    - >-
      IDEA-20260815-f558e4 and IDEA-20260815-14872b. DIFFERENT REGIME: those bound
      PROBABILISTIC propagation and AUXILIARY-STATE objects on prime-order
      subgroups. This record is purely exact-regime and purely about the cofactor
      part. The completeness clause here says nothing about their regimes and must
      never be quoted as if it did.
    - >-
      The existing cofactor corpus (121 records). NOT A REPLACEMENT for any of it:
      those record cases, mitigations and deployment facts; this adds only the
      clause that the case list is exhaustive for its class. Where an existing
      record already enumerates divisors for a specific curve, this record supplies
      the justification that the enumeration is complete, and should cite rather
      than duplicate it.
    - >-
      Invalid-curve and twist attacks. EXPLICITLY OUT OF SCOPE per (C), because
      they do not proceed through a map out of G. Named here because a reader
      skimming for "small subgroup" will expect them and their absence must be
      deliberate and visible.

  assumptions:
    - >-
      E(F_p) is cyclic, or the target group G = <P> is. IF E(F_p) IS NOT CYCLIC the
      subgroup lattice is larger than the divisor set and the enumeration as
      written is INCOMPLETE -- which would silently break the completeness clause,
      the one thing this record exists to provide. Stage 1 must handle the
      non-cyclic case explicitly or the tool must refuse those curves outright.
    - >-
      h and N are known and correct for the deployed curve. An audit inheriting a
      wrong group order produces a confidently wrong completeness claim, so the
      tool must recompute or verify the order rather than accept it as input.
    - >-
      "Tractable" is definable by a stated threshold on image order. The threshold
      is a policy choice, must be recorded per report, and must not be presented as
      a mathematical boundary.

  proof_search_map:
    bottleneck: >-
      THE COMPOSITE-ORDER GENERALISATION OF FACT 1, and specifically the non-cyclic
      case. Everything else is arithmetic on divisors. If E(F_p) can be non-cyclic
      in the deployment scope, the divisor enumeration is the wrong object and must
      be replaced by a subgroup-lattice enumeration.
    baseline_embedding:
      parameter_slice: >-
        Curve25519 shape: h = 8, N the large prime. The known tractable orders are
        1, 2, 4, 8.
      reproduction_check: >-
        The tool must emit exactly {1,2,4,8} as tractable image orders and nothing
        else, matched against the published small-subgroup orders for that curve.
        A frozen fixture; disagreement is an implementation bug and blocks the
        record.
    observation_collision:
      observable: >-
        The emitted tractable-divisor list.
      distinct_preimage_search: >-
        The collision that matters: TWO CURVES WITH THE SAME h BUT DIFFERENT
        SUBGROUP STRUCTURE producing the same list. If E(F_p) is non-cyclic for one
        of them, the lists should DIFFER and an identical list proves the tool is
        keying on h alone and has lost the completeness property. This is the
        direct falsifier for the record's central claim and Stage 3 must include
        such a pair.
    constructive_transforms:
      - transform: baseline_as_boundary_lift
        proposed_object: >-
          Lift a case-list audit to an enumerated-class audit by supplying the
          "nothing else exists" boundary from a structural theorem. ENCODING:
          attack class as the set of exactly-propagating maps out of G.
          COMPLETENESS: this is the obligation being discharged and it holds only
          under the cyclicity assumption. SOUNDNESS: each enumerated map is a real,
          computable map. TRANSFER: to deployed protocols only through the four
          exclusions of (C). COST LOSS: none.
        predicted_gain: >-
          An audit that can state exhaustiveness for its class instead of
          thoroughness, which is a qualitatively different report.
    quantifier_order: >-
      THE CLAIM: FOR ALL deployed cyclic G of order h*N, FOR ALL exactly
      propagating v out of G, THERE EXISTS d dividing h*N with v factoring through
      R |-> dR. THE TRAP, NAMED: the clause is FOR ALL v, and it is that
      universality alone that makes it a completeness statement. Weakening it to
      "for all v WE CONSIDERED" returns exactly the case-list audit this record
      exists to replace, and any Stage 1 gap that forces that weakening must be
      reported as fatal to the record's purpose rather than absorbed.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "for cyclic G, the exactly-propagating maps out of G are the
        divisor maps, these are the tractable ones, here are the test vectors, and
        these four attack classes are NOT covered." IT IS NOT A SECURITY PROOF of
        any protocol and does not bound probabilistic, fault, side-channel,
        invalid-curve or twist attacks.
      nearby_object_control: >-
        A NON-CYCLIC E(F_p), where the divisor enumeration must FAIL to be
        complete. If the tool reports the same confidence there, it has not
        identified the load-bearing structure -- cyclicity -- and its completeness
        clause is void everywhere.
    proof_obligations:
      - claim: every exactly propagating map out of cyclic G factors through a divisor map.
        responsibility: correctness
      - claim: each divisor map is computable by one scalar multiplication.
        responsibility: correctness
      - claim: the tool emits an empty tractable list on h = 1 curves.
        responsibility: interface
      - claim: the tool emits composite divisors, not only prime ones.
        responsibility: correctness
      - claim: the four-class exclusion statement accompanies every report.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: tractable-divisor list on h = 1 curves
      direction: lower
      minimum_effect: >-
        FORCED EMPTY. Any output is fabrication and halts the tool.
    - metric: tractable-divisor list on Curve25519 and Ed448 shapes
      direction: different
      minimum_effect: >-
        FORCED to equal the published small-subgroup orders exactly -- {1,2,4,8}
        and {1,2,4}. Any deviation is an implementation bug.
    - metric: composite-divisor emission on a multi-prime cofactor
      direction: different
      minimum_effect: >-
        FORCED: all divisors, not only the prime ones. This is the specific naive
        bug Stage 3 hunts.
    - metric: behaviour on a non-cyclic group
      direction: different
      minimum_effect: >-
        FORCED: refuse, or emit a subgroup-lattice enumeration with the completeness
        clause explicitly withdrawn. Silent divisor output there voids the record.
    - metric: large-prime-cofactor control
      direction: different
      minimum_effect: >-
        FORCED: non-empty divisor list, EMPTY tractable list. Conflating the two is
        the most likely false-finding mode.

  falsification_conditions:
    - >-
      Stage 1 cannot establish Fact 1 for composite order. The completeness clause
      is unavailable and the record is withdrawn -- it has no other content.
    - >-
      Deployment scope includes non-cyclic groups and Stage 1 does not handle them.
      Same consequence, and it must be reported rather than scoped away quietly.
    - >-
      The tool emits findings on an h = 1 curve. Fabrication; halt.
    - >-
      Two curves with the same h but different subgroup structure receive identical
      lists. The tool keys on h alone and the completeness property is lost.
    - >-
      A report is emitted without the four-class exclusion statement. Contract
      violation: the clause has escaped its scope, which is the specific harm this
      record is most likely to cause.

  confounders:
    - >-
      SCOPE LEAKAGE, WHICH IS THE DOMINANT RISK AND IS NOT A TECHNICAL ONE. A
      completeness clause is exactly the kind of sentence that gets quoted without
      its four exclusions, and a reader who takes "the audit is complete" to cover
      invalid-curve or fault attacks is LESS safe than with no clause at all. The
      mechanical emission of the exclusion statement is the mitigation and it is
      why Stage 4 exists as a stage rather than as a documentation note.
    - >-
      CYCLICITY ASSUMED RATHER THAN CHECKED. The completeness property is false for
      non-cyclic groups and the failure is silent -- the tool still emits a
      plausible list. Cyclicity must be verified per curve, not assumed from the
      fact that deployed curves usually are.
    - >-
      TRACTABILITY THRESHOLD DRIFT. "Small enough to attack" is a policy number
      that changes with hardware; a report that hardcodes it will age badly and
      must record the threshold it used.
    - >-
      FALSE COMFORT FROM A NEGATIVE. An empty tractable list means one class is
      clear, not that the deployment is sound. The report wording must not permit
      the second reading.

  interpretation_limits:
    - >-
      Covers ONE attack class -- exactly-propagating maps out of the group -- and
      explicitly not invalid-curve, twist, fault, side-channel, or probabilistic
      attacks.
    - >-
      No new mathematics, no attack, no exponent. The record is an application of
      an existing theorem to an existing class.
    - >-
      The completeness clause holds only under cyclicity and only for the stated
      group. It is void outside both and the tool must say so rather than degrade
      gracefully.
    - >-
      This is an engineering-grade audit deliverable, NOT a target-class result
      under docs/target-result-profile.md: it moves no exponent and answers C1 with
      a clear no. It is proposed as useful, not as important.

  heuristic_assumptions:
    - id: HEUR-COF-1
      statement: >-
        For cyclic G of order h*N, every exactly-propagating map out of G factors
        through R |-> dR for some d dividing h*N.
      rigorous_support: >-
        NOT A HEURISTIC BUT A DERIVATION, recorded here because the record rests on
        it entirely. The rigorous ingredient is the coset argument of
        IDEA-20260807-df906f's theorem (A), which does not use primality until its
        final step; the structural ingredient is the classification of subgroups of
        a finite cyclic group by divisors, which is elementary and classical. THE
        NON-CYCLIC CASE IS NOT COVERED and is the declared gap.
      falsification_condition: >-
        An exactly-propagating map out of a cyclic G not factoring through any
        divisor map.
      validation_plan: >-
        SAMPLE: exhaustive enumeration of all maps out of Z/n for n in {6, 8, 12,
        16, 24, 30} into small target sets, checking every exactly-propagating one
        against the divisor factorisation. These n are small enough to enumerate
        completely, so this is a decision rather than an estimate. TAIL CHECK:
        report any map that propagates on all but a handful of pairs, since a
        near-miss would indicate the definition is not doing what is intended.
        TRANSFER ASSUMPTION: none -- the statement is finitary per n and the general
        case is derived. The non-cyclic analogue is NOT validated by this plan and
        is out of scope.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE APPLIES -- the record proposes no
      algorithm and moves nothing. Stated explicitly rather than omitted. Tool cost
      is the cost of factoring h, which is trivial since h is small by construction,
      plus one scalar multiplication per emitted test vector.
    memory_exponent: negligible; the divisor list of a small integer.
    best_known: >-
      The best known handling of this attack class is the existing body of
      deployment guidance and library practice, which this record DOES NOT IMPROVE
      operationally -- the same checks get run. It improves only what can be said
      about their coverage. No performance comparison is meaningful.
    hidden_overhead: >-
      The overhead is entirely in scope discipline: a completeness clause imposes a
      permanent obligation to carry its exclusions, and that obligation is easy to
      drop and expensive when dropped.
    tradeoff_note: >-
      The tradeoff is breadth against strength: the clause is strong precisely
      because the class is narrow. Widening the class to anything probabilistic or
      to invalid-curve settings immediately destroys the completeness, which is why
      the boundary is drawn where it is and not further out.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. AS AN ATTACK: n/a (no result claimed) -- no attack is
    proposed and no frontier row applies. AS OPERATIONAL GUIDANCE: dominated by the
    existing deployment corpus and by standard library practice, both of which
    already prescribe the same concrete checks; this record adds a justification,
    not a check, and is strictly weaker as guidance. AS A STRUCTURAL RESULT:
    strictly downstream of IDEA-20260807-df906f, from which its only real content
    is derived. AS A TARGET-CLASS RESULT: not one at all -- C1 of
    docs/target-result-profile.md is answered NO and the record classifies itself as
    engineering. Null is NOT claimed on any axis.
  sota_delta: >-
    No attack, no speedup, no exponent; engineering contribution only. CONTENT
    DELIVERED: a derivation that the divisor maps exhaust the exactly-propagating
    maps out of a cyclic deployed curve group; the resulting completeness clause,
    which converts a case-list audit into an enumerated-class audit for that one
    class; a mechanical four-class exclusion statement that travels with every
    report; and validation fixtures at h = 1, h = 4, h = 8 and a multi-prime
    cofactor. Against the prior state -- 121 records on cofactors, none carrying a
    completeness justification -- the delta is the clause and its boundary, and
    explicitly not any new check.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low

  honest_prior_of_survival: >-
    0.85 that Fact 1 generalises cleanly to composite cyclic order -- the coset
    argument does not use primality until its last step, so this is close to
    mechanical. 0.4 that the non-cyclic case can be handled without the
    enumeration becoming unwieldy enough to lose the practical value; if deployed
    scope includes non-cyclic groups this record shrinks considerably. 0.95 that
    the tool reproduces the known Curve25519 and Ed448 lists, which is a
    correctness check rather than a research risk. 0.3 that the completeness clause
    is actually USED as intended rather than quoted out of scope -- this is a
    social risk, not a technical one, and it is the reason recommended_priority is
    low despite the mathematics being the easiest in this batch.

