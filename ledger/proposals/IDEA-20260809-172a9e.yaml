idea:
  id: IDEA-20260809-172a9e
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-PAIR-f2e31f
  goal_id: GOAL-PAIR-001
  title: >-
    Published pairing security levels evaluate ONE polynomial selection; measure
    the distribution over selections and report its tail, not its mode
  class: algorithm
  claim: >-
    Polynomial selection for the target field is a search whose output quality
    varies, and a security estimate is a function of the selection actually
    found. Published levels correspond to one selection each. The claim is that
    the distribution of achievable quality over a declared search budget is wide
    enough that the estimate's TAIL — what an adversary with a larger selection
    budget finds — differs materially from its mode, and that the difference is
    measurable at small sizes and extrapolable.
  mechanism: >-
    Run the selection search repeatedly under increasing budgets, score each
    candidate by the standard quality measure, and record the distribution.
    Selection is a one-time precomputation for an attacker, so the relevant
    statistic is the best of many, not the typical.
  why_not_a_renamed_known_approach: >-
    Polynomial selection quality distributions are studied for factoring. The
    transfer to a TOWER target field with a fixed deployed prime, and the framing
    as a best-of-N precomputation whose budget the defender's estimate implicitly
    fixes, is what this record proposes to measure.
  predictions:
  - observable: best quality score as a function of selection budget
    metric: score versus log budget
    predicted: Improves and then saturates. Where it saturates determines whether a larger adversary selection budget matters at all; saturation at small budget would be a reassuring and publishable negative.
  - observable: spread between median and best-of-N selection quality
    metric: score difference translated into estimated cost bits
    predicted: At least one bit, plausibly several. A spread below the reporting resolution falsifies the concern.
  minimal_test: >-
    At two small field sizes with the same tower shape, run selection at four
    budgets with declared seeds, record the full score distribution, and
    translate the score spread into cost bits using the calibrated model from
    IDEA-20260809-15e1cd.
  controls:
  - 'SEED CONTROL: repeated runs at the same budget with different seeds must give consistent distributions; a heavy dependence on seed at fixed budget means the search is not sampling the space and the distribution is not the object claimed.'
  - 'SCORING CONTROL: two independent implementations of the quality score must rank the top candidates identically.'
  falsification_conditions:
  - Best-of-N quality saturates immediately, making selection budget irrelevant.
  - Score-to-cost translation is not stable enough to convert a spread into bits, in which case the measurement cannot support the claim.
  interpretation_limits: >-
    Measured at small field sizes; extrapolation to the deployed prime carries
    its own interval and is not a security verdict.
  sota_delta: 'No attack. Delta: a distribution where the literature reports a point, with the tail identified as the adversary-relevant statistic.'
  dominated_by: Depends on IDEA-20260809-15e1cd for the score-to-cost translation; not dominated by any corpus record.
  estimated_cost: Implementation medium; compute moderate and parallel.
  recommended_priority: high
  novelty_status: unverified
  novelty_screen: 'Corpus grep for polynomial selection: only NFS-adjacent RSA records, none for tower fields. WEB NOT CHECKED.'
  source_refs:
  - exTNFS and pairing key-size references -- RECALLED, REQUIRED READS.
