idea:
  id: IDEA-20260807-1354d8
  question_id: RQ-MODEL-e61cb2
  added: '2026-08-07'
  title: >-
    THE METER THAT ANSWERED THE MODEL QUESTION HAD NO DYNAMIC RANGE - EV-REP-001
    and EV-REP-002 report d_reg = 2 FLAT in every arm, at every factor-base degree,
    at m = 2 and m = 3, for both models; a meter pinned at its floor cannot
    distinguish models, so "model-invariant" is currently a statement about the
    instrument; this record specifies the six-quantity model-discriminating panel,
    with a pre-registered saturation test that decides in advance whether each
    quantity CAN separate the arms
  class: measurement

  claim: >-
    (A) THE OBSERVATION, TAKEN DIRECTLY FROM THE LEDGER. EV-REP-001 records
    "W_semaev ... d_reg = 2 flat across d in {4,6,8,12,16}, vdim = 2" and
    "ED_x and ED_y (Edwards native): d_reg = 2 flat, vdim = 2 ... identical to the
    Weierstrass baseline at every d". EV-REP-002 records "m = 3: W_semaev_m3 and
    ED_native_m3 both d_reg = 2 flat across d in {4,6,8}, vdim = 6". So across
    two arities, five factor-base degrees, three seeds and two models, the reported
    metric took ONE value. That is not a null result about models; it is a metric
    with a range of size one over the whole design.

    (B) WHY IT SATURATED, WHICH MATTERS BECAUSE IT PREDICTS WHERE IT WILL SATURATE
    AGAIN. The metric is "output Groebner basis maximum total degree" (H-REP-001
    assumption 3 names it explicitly, and harness/semaev.py returns exactly this as
    groebner_basis_max_degree with the in-code comment "proxy, NOT degree of
    regularity"). The system solved is
      {S_m(...) = 0} union {prod_{v in V}(x_i - v) = 0 for each i},
    whose membership factors force each variable into a finite explicitly-listed
    set. A grevlex Groebner basis of such an ideal typically reduces to a shape
    where the quotient ring is spanned by low-degree monomials, so the OUTPUT basis
    has small maximum degree regardless of how hard the computation was. The
    quantity that varies is the degree REACHED DURING the computation, which sympy
    does not expose - as harness/semaev.py's own docstring says. The instrument
    reports a floor and the floor was reported as a result.

    (C) THIS IS NOT A CRITICISM OF THE ORIGINAL WORK, IT IS THE NEXT STEP. The
    original records were explicit and honest: the module docstring says the
    reported numbers are "implementation-bound proxies, never ... the theoretical
    degree of regularity" and that "only trends versus parameters are interpreted".
    EV-REP-001's boundaries even record "d_reg metric only; wall-time sub-ms, not
    exponent-informative here". The defect is downstream: DEC-20260716-002 and
    KN-FIND-023 converted a flat proxy into "model not a solving-degree lever",
    which is a stronger statement than a saturated meter can support. The remedy is
    a meter with range, not a retraction.

    (D) THE SIX-QUANTITY PANEL, WITH THE PREDICTED RANGE OF EACH STATED IN ADVANCE.
    Every L11 arm reports all six on identical instances.
      M1 PER-VARIABLE DEGREE of the reduced summation polynomial. Range predicted:
        NONE - constant 2^(m-2) across all degree-2 coordinates
        (IDEA-20260807-dadcd2). Included precisely because its predicted range is
        zero: a quantity known in advance to be invariant is the panel's internal
        negative control, and if it ever varies the pipeline is broken.
      M2 MONOMIAL SUPPORT SIZE and the explicit support set. Range predicted: 13
        (short Weierstrass) to 27 (generic reparametrisation), with twisted
        Edwards at most 14. Range of 14 over the design - genuine discrimination.
      M3 NEWTON POLYTOPE and BKK MIXED VOLUME of the full decomposition system
        (KN-TECH-007). Range predicted: [open], and the pre-registered saturation
        test is MV/Bezout - if that ratio is near 1 in every arm the polytopes are
        Newton-saturated, sparse solving equals dense solving, and M3 carries no
        information, which KN-TECH-007 itself names as "the candidate's own
        disproof track".
      M4 MACAULAY MATRIX DIMENSION AT THE FIRST-FALL DEGREE, computed from the
        degree multiset and the variable count via the Froberg series
        (KN-TECH-011, and the inherited semireg_Dreg construction). Range
        predicted: this is the quantity EV-REP-002's variable-count difference
        (4 versus 8 variables) actually moved, and it should show the Edwards
        native arm as dramatically larger - explaining the 0.09s versus 31s gap
        without any model content.
      M5 MAXIMUM DEGREE REACHED DURING the computation - not the output degree.
        Range predicted: [open]. sympy does not expose it, so this requires either
        instrumenting the Buchberger loop or computing the Macaulay rank profile
        directly. THIS IS THE QUANTITY THE ORIGINAL EXPERIMENT WANTED AND DID NOT
        HAVE, and obtaining it is the panel's main implementation cost.
      M6 WALL TIME and Groebner basis size, retained for continuity with
        EV-REP-001/002 and explicitly labelled as the weakest member of the panel
        at toy scale, where sympy overhead dominates.
    Additionally reported for every arm: VARIABLE COUNT, because it is the
    confounder that produced the original result and it must be visible in every
    table row rather than buried in a method section.

    (E) THE PRE-REGISTERED SATURATION TEST, WHICH IS WHAT MAKES THIS A DESIGN AND
    NOT A WISH LIST. Before any model comparison is interpreted, each quantity is
    checked for RANGE over a deliberately varied design: two models, five
    factor-base degrees, three seeds, five primes, two arities, and the 30
    random-reparametrisation draws of IDEA-20260807-4fc635. A quantity whose
    observed range over that entire design is a single value is declared SATURATED
    and is reported as "no information at this scope" rather than as "no
    difference". That distinction is exactly the one the current ledger elides,
    and pre-registering it prevents this record from repeating the error it
    diagnoses.

    (F) THE TWO OUTCOMES.
      OUTCOME 1 - M2 through M5 show range and the models still tie. Then
        "model-invariant" becomes a supported statement rather than an artifact of
        a floored meter, and KN-FIND-023 is upgraded rather than contradicted.
      OUTCOME 2 - some quantity shows range AND separates the models after the
        null battery is applied. Then L11 has a genuine finding and the panel
        identifies exactly which quantity carries it, which is what a meter is for.
      Either way the deliverable is a meter the rest of the campaign can reuse,
      which is DECOMPOSITION.md L14's stated purpose applied inside L11.

  resource_label: >-
    "audit: consumes no resource" - a measurement record. It mounts no attack and
    claims no non-generic structure; it exists so that other records' resource
    claims can be measured with an instrument that has range.
  admissibility: admissible
  admissibility_argument: >-
    ADMISSIBLE VACUOUSLY. The admissibility filter asks which non-generic resource
    a lane consumes; a meter consumes none, because it makes no claim about the
    ECDLP. Filing it inside L11 rather than L14 is scoping: the panel's members are
    chosen specifically for their ability to separate coordinate choices, and a
    general instrumentation lane would not contain M2 or M3 in this form.

  discriminated_from:
    - >-
      KN-TECH-004 and KN-TECH-011, which define degree of regularity and first-fall
      degree. Those are the theory; this record is about which observable PROXY for
      them the harness can actually produce, and about the fact that the one it
      currently produces is floored.
    - >-
      EV-REP-001 / EV-REP-002 / DEC-20260716-002 / KN-FIND-023. This record does
      NOT contradict their observations - the numbers are what they are - and does
      not reopen H-REP-001, which was rejected on its own falsification criterion.
      It challenges the INFERENCE from a saturated proxy to a model-invariance
      claim, and proposes the instrument that would make that inference sound.
    - >-
      IDEA-20260806-e4f96e, which proposes polynomial-calculus refutation degree as
      a solver-independent lower bound. That is a different and stronger object
      than M5; if it is built, M5 becomes redundant and the panel should adopt it.
      This record's M5 is the cheap version - the maximum degree actually reached
      by one solver - and it explicitly defers to e4f96e where the two overlap.
    - >-
      IDEA-20260807-4fc635, the NULL battery. That record supplies what to measure
      AGAINST; this one supplies WHAT to measure. Running either alone reproduces a
      known failure mode: a good null with a floored meter yields confident
      nothings, and a good meter with no null yields confident artifacts.
    - >-
      The inherited semireg_Dreg / Froberg machinery described in
      inputs/refs/research/proofs_Dreg_conservation_weil_invariance.md D0.3-D0.4,
      which computes a semi-regular degree of regularity and a first-fall degree
      with a localisation gate. M4 adopts that construction directly and claims no
      novelty for it; what is new here is applying it across MODELS rather than
      across symmetric-function coordinate changes.

  object_first_candidate:
    tracked_object: >-
      THE DYNAMIC RANGE OF A METRIC over a declared experimental design - the pair
      (number of distinct values observed, the design over which they were
      observed), tracked per candidate metric.
    established_families_off_limits: >-
      Off-limits as primary lens: every attack family, since no attack is
      proposed. The object is a property of a measurement procedure.
    lossiness: >-
      LOSSY AND COMPATIBLY SO. The projection "metric -> its range over the design"
      forgets every individual value and retains only how many distinct ones
      occurred. It is not a change of coordinates - the fibre over "range 1"
      contains every constant metric regardless of its value. It propagates
      deterministically under the operation this record cares about, namely
      ENLARGING THE DESIGN: range is monotone non-decreasing as design cells are
      added, so one step (add a cell) either leaves the range fixed or increases
      it, and never decreases it. That monotonicity is what makes "range 1 over a
      large design" a meaningful statement and "range 1 over one cell" a vacuous
      one, and it is the exact reason the original design's five factor-base
      degrees x three seeds x two models with range 1 is diagnostic.
    propagation: >-
      Add a design cell, observe whether the range grows. A metric whose range
      never grows as the design is enlarged in every available direction is
      saturated at that scope, which is a positive statement about the metric
      rather than a negative one about the models.
    survival_score: >-
      Survives as a diagnostic for any metric and any design. Dies as an argument
      the moment the design is not actually enlarged - a range of 1 over one cell
      says nothing, so the record's value is entirely in the breadth of the
      declared design, which is why (E) specifies it in full.

  mechanism: >-
    STEP 1 - REPRODUCE THE ORIGINAL NUMBER EXACTLY. Re-run the EV-REP-001 design
    (m = 2, d in {4,6,8,12,16}, three seeds) with harness/semaev.py and confirm
    groebner_basis_max_degree = 2 in every cell. If it does not reproduce, the
    disagreement is the finding and everything else waits. GATE.
    STEP 2 - INSTRUMENT M5. Two routes, cheapest first. Route A: wrap sympy's
    Buchberger loop to log the total degree of every S-polynomial and every
    reduced polynomial considered, and report the maximum. Route B (independent,
    and the cross-check): build the Macaulay matrix degree by degree from the
    system's leading forms and compute the rank profile, extracting the first-fall
    degree by the D0.4 construction of the inherited document. Agreement between
    the two routes on the Weierstrass baseline is the acceptance condition for
    both.
    STEP 3 - IMPLEMENT M2, M3, M4. Support counting is trivial. Newton polytopes
    and mixed volume reuse whatever the BKK lane already has (KN-TECH-007,
    KN-FIND-2a8b7e). Macaulay dimension at first fall is a binomial from the
    degree multiset and variable count.
    STEP 4 - THE SATURATION SWEEP. Run all six metrics over the full declared
    design of (E). For each metric record the number of distinct values and the
    range. Publish the saturation table BEFORE any model comparison is read.
    STEP 5 - THE MODEL COMPARISON, WITH VARIABLE COUNT PINNED. Compare short
    Weierstrass Semaev against Edwards y-only (IDEA-20260807-78eafe), Montgomery
    (IDEA-20260807-e6d79e) and Hessian-s (IDEA-20260807-5f5ace), ALL WITH THE SAME
    VARIABLE COUNT, on identical curves, points and factor bases. Report every
    non-saturated metric with its null-battery distribution alongside.
    STEP 6 - THE RE-READ. State explicitly, for each metric, whether the original
    "model-invariant" conclusion is CONFIRMED on a metric with range, REFUTED, or
    still UNRESOLVED because the metric saturated again. All three are legitimate
    and the third is the one the current ledger cannot express.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Grep over ledger/ and knowledge/ for "d_reg", "degree of regularity",
      "first-fall", "saturat" (2026-08-07). Full reads of harness/semaev.py
      (including the module docstring and the groebner_basis_max_degree comment),
      ledger/H-REP-001.yaml, ledger/EV-REP-001.yaml, ledger/EV-REP-002.yaml,
      ledger/DEC-20260716-002.yaml, knowledge/findings/KN-FIND-023.md,
      KN-TECH-011, KN-TECH-007, KN-FIND-2a8b7e, KN-FIND-c7d31e,
      ledger/proposals/IDEA-20260806-e4f96e.yaml, and inputs/refs/research/
      proofs_Dreg_conservation_weil_invariance.md D0.2-D0.5.
    results: >-
      INTERNAL - the program is fully aware that its d_reg proxy is a proxy;
      harness/semaev.py says so in its docstring and KN-TECH-011 records the
      distinction between output degree and reached degree. What no record does is
      compute the RANGE of that proxy over the design and note that it was 1.
      IDEA-20260806-e4f96e is the nearest neighbour and is a strictly stronger
      instrument proposal (solver-independent refutation degree); this record
      defers to it and is the cheap complement. No duplicate found.
      EXTERNAL - no novelty claimed. Reporting a metric's dynamic range before
      interpreting a null is ordinary experimental practice.
    verdict: adaptation

  null_object_control: >-
    MANDATORY AND OF TWO KINDS, because a meter needs both directions.
    NEGATIVE NULL - the matched null of IDEA-20260807-4fc635 (random Moebius
    reparametrisation of the same model), on which every metric must behave as
    that record predicts; in particular M1 must be exactly constant. DECAY
    PARAMETER: the number of randomised variables r, 0 to m. A metric that shows a
    "model effect" of the same size under the random null as under a named model
    is measuring reparametrisation, and the panel reports it that way.
    POSITIVE NULL - A PLANTED DIFFICULTY. Construct two systems on the SAME curve
    that are known in advance to differ in solving cost - the 3-variable
    y-eliminated Weierstrass Semaev system versus the explicit-y collinearity
    system that EV-REP-001 already measured as d_reg growing 4 -> 12 - and confirm
    that each panel member either detects the difference or is honestly recorded as
    blind to it. A panel that reports "no difference" between those two systems is
    unusable, and EV-REP-001's own data gives us the answer key for free: the
    output-degree proxy DID separate them (2 versus 4-12), so it has range in that
    direction and is floored only within the membership-constrained family. That
    nuance must appear in the saturation table.

  assumptions:
    - >-
      harness/semaev.py's reported groebner_basis_max_degree is what H-REP-001's
      assumption 3 called d_reg. Verified by re-running, not assumed.
    - >-
      sympy's Groebner routine can be instrumented without changing its behaviour.
      If wrapping perturbs the computation, Route B (Macaulay rank profile) is the
      fallback and Route A is abandoned.
    - >-
      The Froberg semi-regular degree is a heuristic, not a theorem, for these
      structured systems - the inherited document says so explicitly at D0.3 and
      section 1.4 item 1. M4 is therefore reported as a computed prediction, never
      as a measured degree.
    - >-
      All arms in Step 5 can be brought to the same variable count. For Edwards
      this requires the elimination of IDEA-20260807-78eafe to succeed; if it does
      not, the comparison cannot be matched and must be reported as unmatched.

  proof_search_map:
    not_applicable_reason: >-
      Purely instrumental and empirical. This record proposes no theorem, no
      asymptotic bound, no certificate family, no reduction and no closure
      argument; it specifies a measurement panel and a pre-registered saturation
      test. The one inherited theoretical ingredient - the Froberg semi-regular
      degree-of-regularity construction used by M4 - is quoted from
      inputs/refs/research/proofs_Dreg_conservation_weil_invariance.md D0.3 with
      its own conditionality (H-SR) intact, and no new claim is made about it. Any
      claim about what M5 would imply for solver-independence belongs to
      IDEA-20260806-e4f96e, which carries the corresponding proof_search_map.

  predictions:
    - metric: >-
        dynamic range of groebner_basis_max_degree over the full declared design
        (2 models x 5 factor-base degrees x 3 seeds x 5 primes x 2 arities)
      direction: different
      minimum_effect: >-
        Predicted range EXACTLY 1 (the single value 2), reproducing EV-REP-001/002
        and confirming saturation. A range of 2 or more would mean the original
        design simply did not span far enough and the metric is usable after all.
    - metric: dynamic range of monomial support size over the same design
      direction: higher
      minimum_effect: >-
        At least 3 distinct values (13, 14, 27 expected). A range of 1 here would
        contradict the hand computations of IDEA-20260807-e6d79e and -78eafe.
    - metric: MV/Bezout ratio for the arity-3 decomposition system, per model
      direction: different
      minimum_effect: >-
        Pre-registered decision rule: a ratio above 0.9 in every arm declares the
        polytopes Newton-saturated and M3 uninformative at this scope, per
        KN-TECH-007's own disproof track. A ratio below 0.5 in any arm makes M3 the
        panel's most informative member.
    - metric: >-
        Macaulay dimension at first fall, 4-variable Weierstrass Semaev versus
        8-variable Edwards native at m = 3
      direction: higher
      minimum_effect: >-
        Edwards native at least 10x larger, which would account for EV-REP-002's
        0.09s versus 31s wall-time gap by variable count alone, with no model
        content. If it does NOT account for the gap, something model-specific is
        happening that no record in this lane predicts - the most interesting
        possible outcome of this proposal.
    - metric: >-
        maximum degree REACHED during computation (M5), Route A versus Route B, on
        the Weierstrass baseline
      direction: different
      minimum_effect: >-
        Exact agreement between the two independent routes. Disagreement means at
        least one is wrong and neither may be reported.
    - metric: >-
        M5 across models, on matched-variable-count systems, with the null battery
      direction: different
      minimum_effect: >-
        [open]. Pre-registered: a difference of at least 2 in the reached degree
        that SURVIVES the random-Moebius null is a genuine model effect; a
        difference of 1 is declared inconclusive in advance; no difference on a
        metric that has demonstrated range elsewhere is a supported invariance
        claim and would upgrade KN-FIND-023.

  minimal_test:
    design: >-
      STAGE 1 (minutes, GATE): reproduce EV-REP-001's m = 2 numbers exactly.
      STAGE 2 (hours): implement M5 by both routes and cross-check on the
      Weierstrass baseline.
      STAGE 3 (an hour): implement M2, M3, M4 and validate M3 against a
      brute-force F_p solution count as KN-TECH-007 describes.
      STAGE 4 (hours): the saturation sweep over the full design; publish the
      saturation table before reading any model comparison.
      STAGE 5 (hours): the matched-variable-count model comparison with the null
      battery of IDEA-20260807-4fc635 applied to every arm.
      STAGE 6 (zero compute): the per-metric re-read of the original conclusion -
      CONFIRMED, REFUTED, or STILL UNRESOLVED.
    controls:
      - the EV-REP-001 reproduction as the anchor
      - >-
        the planted-difficulty positive null (y-eliminated versus explicit-y
        Weierstrass systems, whose separation EV-REP-001 already measured)
      - the random-Moebius negative null with decay parameter r
      - >-
        MV validated against brute-force solution counting, so the polytope code
        is checked before its numbers are used
      - >-
        Route A versus Route B for M5, two independent implementations of the same
        quantity
      - variable count reported in every table row, never aggregated away
    required_metrics:
      - all six panel members per arm per cell
      - variable count per arm
      - number of distinct values and range per metric over the design
      - MV/Bezout ratio per arm with the saturation verdict
      - Route A versus Route B agreement for M5
      - the filled saturation table and the filled re-read table

  falsification_conditions:
    - >-
      Stage 1 fails to reproduce EV-REP-001's d_reg = 2. The disagreement is the
      finding and is escalated before anything else runs.
    - >-
      groebner_basis_max_degree shows range over the enlarged design. Then it was
      not saturated, the original conclusion needs no repair on that ground, and
      claim (A) of this record is wrong.
    - >-
      Route A and Route B disagree on M5 for the baseline. Neither is reportable.
    - >-
      MV/Bezout is above 0.9 everywhere. M3 is uninformative and is dropped from
      the panel with that reason recorded - KN-TECH-007 anticipates exactly this.
    - >-
      The planted-difficulty positive null is not detected by any panel member.
      The panel is blind and no negative from it is publishable.
    - >-
      The Edwards elimination of IDEA-20260807-78eafe fails, so no matched-variable
      comparison is possible. Then Step 5 is reported as unmatched and the
      conclusion is explicitly scoped to that.
    - >-
      Instrumenting sympy changes its results. Route A is abandoned; that is an
      implementation outcome, not a mathematical one (AGENTS.md rule 5).

  confounders:
    - >-
      VARIABLE COUNT, which is the confounder that produced the original result.
      It must be pinned in Step 5 and printed in every row.
    - >-
      MEMBERSHIP-CONSTRAINT DOMINANCE. When the membership polynomials have degree
      d much larger than the summation polynomial's degree, the degree multiset is
      dominated by the membership block and every model looks alike. Sweeping d
      from small to large is therefore not optional - the model effect, if any,
      should be largest at small d, and a design that only samples large d would
      manufacture invariance.
    - >-
      TOY-SCALE SYMPY OVERHEAD dominating M6. Wall time at 16 bits measures the
      interpreter as much as the mathematics; M6 is retained for continuity and
      explicitly down-weighted.
    - >-
      SEMI-REGULARITY. M4's Froberg number is a heuristic prediction and the
      inherited document records that these systems are NOT semi-regular (true
      first fall below the semi-regular D_reg). M4 must never be reported as a
      measured degree.
    - >-
      Reading a saturated metric as a null result is the exact error this record
      exists to prevent, and the pre-registered saturation table in Stage 4 is the
      mechanism that prevents the record from committing it itself.

  interpretation_limits:
    - >-
      ASYMPTOTIC CEILING, STATED AS THE BRIEF REQUIRES. This record claims NO
      exponent change and makes no claim about the ECDLP. It is a meter. Even in
      its best outcome it can only show that some measurable quantity separates two
      models at m in {2,3} on toy curves - a small-m, constant-factor observation.
      Diem's and Gaudry's asymptotics are model-agnostic in their asymptotic form
      and no measurement here can touch them; the deck-group law of
      IDEA-20260807-dadcd2 already forbids a degree change.
    - >-
      A metric with range that shows no model difference supports invariance ONLY
      at the tested scope (AGENTS.md rule 6): those models, those arities, those
      factor-base degrees, that solver.
    - >-
      M4 and M5 are solver-and-encoding dependent. A different monomial order or a
      different solver can move them, and the stronger solver-independent object is
      IDEA-20260806-e4f96e's refutation degree, not anything here.
    - >-
      Toy scale throughout; claim_tier toy (AGENTS.md rule 7). No crypto-scale
      statement is licensed by any panel member.
    - >-
      This record does NOT reopen H-REP-001. That hypothesis claimed a strictly
      lower SCALING of d_reg in the factor-base degree and was rejected against its
      own pre-registered falsification criteria. Nothing here revives that claim;
      what is questioned is only the strength of the downstream invariance
      statement.

  reachability_gate: >-
    TRIVIAL AND STATED EXPLICITLY. T5 (DECOMPOSITION.md section 3) charges for
    reaching a specified curve in an isogeny class. This record reaches no curve
    and moves no instance: it re-measures the same curves, the same points and the
    same factor bases the existing records used, with more instruments attached.
    Model change, where it occurs in Step 5, is a coordinate substitution costing
    O(1) field operations with probability 1 - no walk, no mixing time, no
    vectorization. The only non-trivial cost anywhere in the record is
    IMPLEMENTATION (instrumenting the solver for M5), which is an engineering cost
    and is charged in estimated_cost rather than in a reachability gate.

  target_complexity:
    time_exponent: >-
      NOT APPLICABLE - no algorithm and no attack. The record's own cost is the
      full design sweep at toy scale plus one solver instrumentation.
    memory_exponent: >-
      NOT APPLICABLE for cryptanalysis. The panel's own memory-dominant member is
      M4/M5 via the Macaulay matrix at the reached degree, whose dimension is
      binomial(n + D, D) (KN-TECH-011); that is the binding constraint on how far
      the design can be pushed and it is measured and reported per cell.
    best_known: >-
      For the ECDLP, unchanged: rho at 0.886 sqrt(N) with O(1) memory
      (KN-TECH-001, KN-TECH-006), BSGS at sqrt(N)/sqrt(N) (KN-TECH-031),
      automorphism-discounted rho (KN-TECH-018), Semaev index calculus at
      exp(c sqrt(log N log log N)) (KN-FIND-f8c290) with BKK constants
      (KN-FIND-2a8b7e, KN-FIND-c7d31e). For METERS, the incumbents are
      groebner_basis_max_degree as implemented in harness/semaev.py and the
      degree-of-regularity / first-fall pair of KN-TECH-004 and KN-TECH-011.
    hidden_overhead: >-
      No o(1) is claimed. The honest cost disclosure is that the panel is roughly
      6x the measurement cost per cell plus the 30x null multiplier of
      IDEA-20260807-4fc635, i.e. about 180x the current per-cell cost - which at
      16 bits and m = 3 is still minutes, and which becomes the binding constraint
      at m = 4.
    tradeoff_note: >-
      Not a cryptanalytic tradeoff. The methodological one is panel breadth versus
      design breadth at fixed budget: six metrics over a small design detects
      nothing, one metric over a large design detects only what that metric sees.
      The record resolves it by ordering - saturation sweep first, model comparison
      only on metrics that survived it.
  dominated_by: >-
    AS AN ATTACK - n/a, no result claimed; nevertheless checked against every
    frontier row so this is not a bare null: parallel rho with distinguished points
    (0.886 sqrt(N) group operations, O(1) memory, 0 queries)
    KN-TECH-001/KN-TECH-006; automorphism-discounted rho on CM curves KN-TECH-018;
