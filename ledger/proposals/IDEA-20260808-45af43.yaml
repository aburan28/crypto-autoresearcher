idea:
  id: IDEA-20260808-45af43
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-JINV-8fc13a
  goal_id: GOAL-ENDO-001
  title: "The sextic-twist family of a j=0 curve supplies SIX distinct group orders - exactly\
    \ the second modulus whose absence is the named obstruction O-ONEMODULUS - and it still\
    \ gives nothing, for a different and cheaper reason: >-\n  by Tate's theorem the six twists\
    \ lie in six DIFFERENT F_p-isogeny\nclasses, so no F_p-rational transport exists, and\
    \ the F_{p^6} correspondence that does exist is a Weil restriction that splits completely"
  class: mechanism
  claim: "(A) THE SIX MODULI ARE REAL. For p = 1 mod 3 write 4p = a^2 + 3 b^2, which determines\
    \ a and b up to sign and is computable in polynomial time (Cornacchia). The curves E_u\
    \ : y^2 = x^3 + u*B, for u running over the six classes of F_p^*/(F_p^*)^6, are the sextic\
    \ twists of E : y^2 = x^3 + B, and their Frobenius eigenvalues are alpha_i = zeta_6^i\
    \ * alpha where alpha is a root of X^2 - tX + p. Hence their traces run over {+-a, +-(a\
    \ + 3b)/2, +-(a - 3b)/2} and their group orders N_i = p + 1 - t_i are SIX DIFFERENT INTEGERS.\
    \ The identity\n    product over the six twists of #E_i(F_p) = #E(F_{p^6})\nfollows from\
    \ prod_{i=0..5} (1 - zeta_6^i alpha)(1 - zeta_6^i alphabar) = (1 - alpha^6)(1 - alphabar^6),\
    \ and is an exact arithmetic check on the whole picture. (B) WHY THIS LOOKS LIKE THE MISSING\
    \ INGREDIENT. IDEA-20260807-7c00e6 closes the transport-ensemble family with the named\
    \ obstruction O-ONEMODULUS: \"the isogeny class fixes the group order, so transport multiplies\
    \ representations without multiplying moduli\". The sextic twists are NOT in the isogeny\
    \ class and DO multiply moduli. If any k-preserving F_p-rational map existed from G into\
    \ a twist, the ensemble would carry congruences to six coprime moduli and a CRT combination\
    \ would be available. (C) THE CLOSURE, IN THREE INDEPENDENT LIMBS.\n  (C1) TATE. Two elliptic\
    \ curves over F_p are F_p-isogenous if and only if\n       they have the same number of\
    \ points. The six twists have six\n       different traces, hence are pairwise NON-isogenous\
    \ over F_p. There\n       is therefore no F_p-rational isogeny at all between E and any\
    \ E_u,\n       so transport theorem T1 has nothing to transport. This is not a\n     \
    \  cost statement; it is an existence statement.\n  (C2) COUNTING. Even granting an arbitrary\
    \ group homomorphism\n       psi : G -> E_u(F_p), the image is a subgroup of order dividing\
    \ the\n       prime N and dividing N_u. Generically gcd(N, N_u) = 1 (N is a large\n  \
    \     prime dividing N_1 only), so psi = 0. A nonzero psi requires\n       N | N_u, which\
    \ for large prime N and N_u < p + 1 + 2 sqrt(p) forces\n       N_u = N - a contradiction\
    \ with distinct traces.\n  (C3) WEIL RESTRICTION. The one F_p-rational object relating\
    \ the twists is\n       Res_{F_{p^6}/F_p} of the base change of E, an abelian variety\
    \ of\n       dimension 6 over F_p. Its point count factors as in (A), and it is\n    \
    \   F_p-isogenous to the PRODUCT of the six twists - completely split.\n       GHS-style\
    \ Weil descent gains only when the restriction of scalars\n       contains a Jacobian\
    \ of a curve of controlled genus that does NOT\n       split; here the splitting is total,\
    \ so there is no cover to descend\n       along. The named obstruction is O-SPLITRESTRICTION.\n\
    (D) THE ONE POSITIVE CONSEQUENCE, WHICH BELONGS TO GOAL-ECTD-001. The six twist orders\
    \ are computable from (p, a, b) in polynomial time with no point counting. So a designer\
    \ choosing among the six twists is choosing among six PUBLIC options; sextic-twist choice\
    \ can never be a trapdoor secret. This extends DECOMPOSITION.md T4 (which says the class\
    \ fixes t) to the twist family (which does not fix t, and is still public)."
  mechanism: 'Multiplying moduli requires maps, and over F_p the only maps between curves
    with different traces are zero. The twist isomorphisms exist but are defined over F_{p^6},
    and descending them to F_p is exactly what Weil restriction does - producing a 6-dimensional
    abelian variety whose complete splitting is the precise reason no information crosses
    between the twists. The classical GHS mechanism needs the opposite situation: a restriction
    of scalars containing an irreducible piece of small dimension that is a Jacobian of a
    curve one can do index calculus on.'
  why_not_a_renamed_known_approach: 'Nearest known: GHS Weil descent over composite extension
    fields, already recorded in this corpus as inapplicable over prime fields (RQ-ECTD-001;
    H-CRYPTO-f5cf88 P5; H-IT-001). Those records say "over generic F_p the architecture cannot
    hide" and treat prime fields as having no subfield to descend from. This record considers
    the opposite direction - going UP to F_{p^6} where a j=0 curve genuinely acquires six
    twists and six moduli, and coming back down by restriction of scalars - and closes it
    with a splitting statement plus an arithmetic identity, neither of which appears in those
    records. Nearest second: DEC-20260804-760bae disposes of a quadratic-twist co-attack as
    "the known twist anomalous" case; that is the n = 2, special- order case, not the j =
    0 sextic structure, and it does not mention the Weil restriction.'
  predictions:
  - observable: the product identity
    metric: 'for >= 100 toy j = 0 curves at 20-30 bits, the exact integer product of the six
      twist orders against #E(F_{p^6}) computed from alpha^6 + alphabar^6'
    predicted: exact equality in 100% of samples; any mismatch falsifies (A)
  - observable: pairwise coprimality of the moduli
    metric: 'fraction of samples with gcd(N, N_u) = 1 for all five u != 1, where N is the
      large prime factor of #E(F_p)'
    predicted: at least 0.95 (failures only when a small prime happens to divide two orders,
      which does not create a nonzero homomorphism on G anyway)
  - observable: non-isogeny of the twists
    metric: number of distinct traces among the six twists, and the number of pairs with equal
      trace
    predicted: six distinct traces whenever a, b, (a+3b)/2, (a-3b)/2 are pairwise distinct
      in absolute value, which holds except on an explicitly computable thin set (b = 0 or
      a = 0 or a = 3b); those degenerate cases must be reported separately, not discarded
  minimal_test: Pure arithmetic, minutes. Generate 100-500 j = 0 curves at 20-30 bits; solve
    4p = a^2 + 3b^2 by Cornacchia; enumerate the six sextic twists by choosing u in each class
    of F_p^*/(F_p^*)^6; point-count each twist independently (do NOT derive its order from
    the formula being tested); check the product identity, the distinct-trace count, and the
    pairwise gcds. The independent point counting is what makes this a test rather than an
    assertion.
  controls:
  - "NULL: >-\n  run the same pipeline on j != 0, 1728 curves, where only the\nquadratic twist\
    \ exists. The product identity must then hold with two factors and #E(F_{p^2}), and the\
    \ six-way structure must be absent. If the code reports six twists there, the twist enumeration\
    \ is wrong."
  - "PLANTED: >-\n  construct a degenerate case (b = 0 is impossible for p = 1 mod 3\nwith\
    \ 4p = a^2 + 3b^2 and p prime, but a = 3b can occur); verify the pipeline reports fewer\
    \ than six distinct traces there rather than silently producing six."
  - Independent point counting by two methods (baby-step giant-step on random points; and
    the CM formula) to separate an implementation error from an arithmetic claim.
  confounders:
  - The sign/normalisation convention for a and b in 4p = a^2 + 3b^2 must be pinned; the wrong
    branch permutes the six traces and can make the product identity appear to fail for a
    purely bookkeeping reason.
  - F_p^*/(F_p^*)^6 has order 6 only when 6 | p - 1; for p = 1 mod 3 but p = 3 mod 4 the sextic
    structure is still present via p = 1 mod 3 and p = 1 mod 2, so the twist group is cyclic
    of order 6 - this must be checked per prime rather than assumed.
  - Small primes dividing several twist orders will produce gcd > 1 without contradicting
    (C2), because (C2) concerns the LARGE prime N.
  falsification_conditions:
  - 'The product identity failing on any correctly-normalised sample: (A) is wrong and the
    whole picture must be redone.'
  - 'A twist E_u with gcd(N, N_u) = N for the large prime N: then a nonzero homomorphism could
    exist and (C2) fails on that instance; the record would then owe an explicit construction
    or a sharper argument.'
  - 'A demonstrated F_p-rational map between curves of different trace: Tate''s theorem would
    be violated, which would be a far larger event than this record.'
  interpretation_limits: j = 0 only (and the analogous j = 1728 quartic case, not worked here).
    Toy scale for the verification; the arithmetic identities are exact and scale, but no
    crypto-scale claim is made. This closes ONE route to a second modulus; it does not prove
    no second modulus exists, and the record says what would count as one (a nonzero F_p-rational
    homomorphism between curves of different trace, which Tate forbids).
  assumptions:
  - 'p > 3, p = 1 mod 3, E : y^2 = x^3 + B with B != 0 (so j = 0).'
  - 'Tate''s isogeny theorem over finite fields: F_p-isogenous iff equal point counts [recall-confident,
    standard].'
  - Sextic twisting multiplies the Frobenius eigenvalue by a primitive sixth root of unity
    [recall-confident; the classical j = 0 twist description].
  - Res_{F_{q^n}/F_q} of a base-changed curve decomposes according to the characters of the
    cyclic Galois group, giving the product of the twists up to F_q-isogeny [recall-uncertain
    for n = 6; CERTAIN for n = 2, where E(F_{q^2}) = E(F_q) + E^d(F_q) as groups. The n =
    6 statement is exactly what the product identity in (A) tests, so the record makes the
    test do the verification rather than assuming it.]
  heuristic_assumptions:
  - id: HA-1
    statement: For j = 0 curves sampled by choosing p = 1 mod 3 at random and B at random,
      the six twist orders N_i have pairwise gcd equal to a product of small primes only,
      with the large prime factor of each N_i dividing no other N_j, with probability 1 -
      O(1/log p).
    rigorous_ingredient: The exact trace formula {+-a, +-(a+3b)/2, +-(a-3b)/2} from 4p = a^2
      + 3b^2, so the six orders are explicit integers, not modelled ones.
    distribution_imitated: Coprimality of independently sampled integers of the same size,
      i.e. the 1/zeta(2) heuristic, restricted to the large prime factors.
    validation_route: Directly measured in the minimal test at 20-30 bits by factoring all
      six orders. TOY SCALE, labelled toy; at crypto scale the six orders are still computable
      but their factorisations are not, so the heuristic could only be validated on the gcd,
      not on the large prime factors.
    tail_checks: Report the observed maximum common factor over the sample against the predicted
      tail P(gcd > x) ~ 1/x; and report separately the count of samples where two twists share
      a prime factor above 2^10.
  target_complexity:
    time_exponent: No improvement claimed. What is foreclosed is a hypothetical CRT combination
      across six moduli, which would have multiplied the effective modulus and could in principle
      have reduced the meet-in-the-middle exponent; the record shows the moduli cannot be
      combined and the exponent stays 1/2.
    memory_exponent: not applicable to a closure.
    best_known_baseline: rho at 0.886 sqrt(N/3) on j = 0 curves (the automorphism discount
      with r = 3, KN-TECH-018), O(1) memory.
    hidden_overhead_disclosure: None. The one uncertain input (the n = 6 Weil-restriction
      decomposition) is converted into a measurable prediction rather than assumed.
    time_memory_tradeoff: not applicable.
  sota_delta: 'Zero speedup. Delta: fills the exact gap left open by O-ONEMODULUS with an
    independent obstruction (Tate non-isogeny plus split Weil restriction), and delivers a
    reusable arithmetic identity (product of twist orders = #E(F_{p^6})) that any future twist-based
    proposal must satisfy.'
  dominated_by: 'n/a (no result claimed). Frontier rows checked: rho 0.886 sqrt(N) / O(1);
    automorphism-discounted rho 0.886 sqrt(N/3) / O(1) - the relevant baseline for j = 0;
    BSGS sqrt(N) / sqrt(N); van Oorschot-Wiener sqrt(N^3/w) / w. None approached.'
  estimated_cost: "Implementation: >-\n  low (Cornacchia, sextic twist enumeration, BSGS point\n\
    counting - all short). Compute: low (minutes)."
  recommended_priority: medium
  honest_prior_of_survival: 0.9 that the product identity and distinct-trace predictions verify.
    0.02 that any usable second modulus survives. The record's value is that "use the twists
    to get a second modulus" is the obvious next thought after O-ONEMODULUS and will otherwise
    be re-proposed.
  novelty_status: unverified
  novelty_screen: 'Same corpus screen as E3-01, plus grep of ledger/ for "Weil restriction|
    GHS|sextic twist|Weil descent|quadratic twist" (25 hits inspected: all are either extension-field
    GHS statements, the twist-anomalous disposal DEC-20260804-760bae, or IDEA-20260807-13c821''s
    sextic-twist-class bookkeeping inside the canonical-lift lane). No record combines the
    six moduli, Tate non-isogeny, and the split Weil restriction. WEB SEARCH UNAVAILABLE.'
  discriminated_from: 'IDEA-20260807-7c00e6: closes transport ensembles by O-ONEMODULUS; this
    record addresses the family that O-ONEMODULUS does NOT cover (non-isogenous twists with
    genuinely different moduli) and closes it by different means. IDEA-20260807-13c821: tracks
    the sextic twist class as a bookkeeping constraint inside the canonical-lift lane (never
    pool the six classes); this record asks whether the six classes can be COMBINED and answers
    no. DEC-20260804-760bae: disposes of the quadratic-twist co-attack as the known twist-anomalous
    case; that is an order-based special family, this is a structural argument about maps.'
