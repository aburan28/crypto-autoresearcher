idea:
  id: IDEA-20261017-9b7e04
  question_id: RQ-ECDLP-002
  added: '2026-10-17'
  title: >-
    Names that are not logarithms: CM-volcano points of a modular E_0 reduced at p. Supply Theta~(sqrt p),
    Hecke relations with corank fraction >= phi(f)/f (classes ii, iii, iv of EXP-CANL-1064e0)
  class: mechanism
  claim: >-
    K=Q(sqrt(-D0)) small, p=pi*pibar split, 4p=t^2+D0 f^2. (1) The F_p-curves of trace t number
    H(t^2-4p)=sum_{g|f} h(-D0 g^2)=Theta~(sqrt p); each is named by (g|f, ideal class in Cl(O_g)), about
    (1/2)log2 p bits, independent of any discrete logarithm. (2) If E_p lifts to a modular E_0/Q of conductor
    M, phi: X_0(M)(F_p)->E_0(F_p) satisfies sum_{x' in T_l(x)} phi(x')=a_l*phi(x) (base cusp infinity). For
    l|f, l not dividing M, all l+1 neighbours of x are F_p-rational iff x is not on the l-floor of its volcano;
    a floor vertex brings one new unknown (a Frobenius-orbit sum). (3) On the complete volcano forest the
    solution space has dimension prod_i F_i (F_i = floor count in direction l_i): corank fraction
    >=prod_{l|f}(1-1/l)=phi(f)/f >=0.12 for f<=2^128. (4) A generic E_p has no small-conductor lift (j(E_p)
    has rational height >=(1/2)log p except for a p^(-1/2) fraction; Szpiro, conditional: M>=p^(1/12-eps));
    y^2=x^3+7 (secp256k1) is small. Net: supply sqrt(p), the logs of the supply are never determined by its
    relations, a random target is hit with probability ~p^(-1/2).
  mechanism: >-
    PAIR: representation = CM-volcano position (R3; name = path from the crater) of (E_1,E_2) in X_0(M)(F_p),
    mapped to E_0(F_p) by the modular parametrization; Sigma = Hecke correspondences T_l, l|f. TRICHOTOMY:
    branching with an exact linear relation. LOSSY TEST: nothing is discarded (change of coordinates) unless
    quotiented by volcano level; the corank in (3) is that quotient. PRICE: one phi-evaluation per vertex
    (poly(M)); relations save at most prod(1-1/l). FACTOR-BASE: implicit membership + target-dependent
    description (KN-OPEN-020); charged sqrt(p) description, enumerate-and-test. Auxiliary primes l|f are the
    second primes of class (ii).
