idea:
  id: IDEA-20261016-8961d2
  question_id: RQ-CZLIFT-b9f765
  added: '2026-10-16'
  title: >-
    Exact census of a whole section class: Smart-ratio success over every
    defect function in L(kO) is k-wise independent with exact moments, so 1/p
    is the class mean by an identity
  class: measurement
  claim: >-
    E/F_p ordinary, <P> of prime order n!=p, V_k=L(kO)(F_p) (dim k, k=3,4). Each
    f in V_k gives the section s_f(R)=s_tor(R)+Ehat(z=p*f(R)); its Smart ratio is
    f(Q)/f(P) (psi(R)=log([n]s_f(R))/n=p*f(R) mod p^2). N(f)=#{d in [2,n-2]:
    f(dP)=d*f(P)}, f(P)!=0. (C1) lambda_d(f)=f(dP)-d*f(P) is nonzero on V_k (f=1
    gives 1-d); when {lambda_d,ev_P} are independent #{f: lambda_d(f)=0,
    f(P)!=0}=p^(k-1)-p^(k-2), so E_f[N]=(n-3)/p EXACTLY. (C2) #{f: S(d) for all d
    in T}=p^(k-r_T)-p^(k-r'_T) from ranks: factorial moments of N equal the
    binomial(n-3,1/p) ones to order k-1 except at listed rank-deficient T (even f
    makes S(d),S(-d) exclusive). (C3) max_f N(f) lies in [k-1, k-1+log p/loglog p]:
    interpolation reaches k-1 only on d's chosen in advance (needs d); a maximum
    of order sqrt(p) (the Weil-level allowance) falsifies independence and marks a
    hidden algebraic family.
  mechanism: >-
    PAIR: representation = F_p-valued defect function of the point (R1); Sigma =
    scalar multiples d*P with d's integer rep (not translation). TRICHOTOMY:
    coordinate-dependent. LOSSY TEST: R->f(R) discards the base point, lossy
    through collisions of f; the success event is one linear condition per d. This
    is the lane's Smart-ratio criterion run exhaustively over a finite class
    instead of the five sampled sections of EXP-CZLIFT-ae0a13/-bdae69. Hom(<P>,
    F_p)=0 (n prime to p) keeps lambda_d from vanishing.
