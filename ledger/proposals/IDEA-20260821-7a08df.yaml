  repair_provenance: >-
    REPAIRED 2026-08-24 by idea-generator, in response to an independent
    red-team screen against lane HQC-001 (finding BLOCKING 1 against this
    record). Identifiers, question_id, class, status, novelty_status and
    proposed_at are unchanged.
    BLOCKING 1 (the headline identity was false under the record's own
    operational definition of the margin). CLEARED, by restoring the definition
    rather than rewording the claim.
    THE DEFECT: claim (A) asserted "AN EXACT RE-EXPRESSION OF THE FAILURE EVENT
    ... DFR = P[M_(delta_e+1) < 0]" with the margin described as "the best
    codeword correlation minus the runner-up", while Stage 1 computed
    "M_j = (largest |peak|) - (second largest |peak|)". That quantity is
    non-negative by construction, so {M_j < 0} was the empty event, the identity
    was false, and the mandatory per-sample decoder-consistency check
    ("must be 100%") would have failed on every sample and voided the package.
    THE REPAIR: IDEA-20260816-6536d7's signed definition was re-read directly
    from the file (its lines 11-13: "Define the margin M_j := (correlation of the
    transmitted codeword) minus (maximum correlation over all other codewords).
    Then F_j = 1{M_j < 0} exactly, with the deployed deterministic rule resolving
    M_j = 0.") and restored verbatim in claim (A), in mechanism Stage 1, in the
    decoder-consistency control, in assumptions[1], in proof_obligation 1, in the
    tracked_object, and in every place R_k(u) is defined. The record now states
    explicitly, in a new claim (F), that the non-negative largest-minus-runner-up
    quantity is a DIFFERENT OBJECT - D_j = |M_j|, 6536d7's reliability measure and
    the object of eprint 2026/656 and arXiv:2603.20156 - and states which of the
    two R_k(u) is estimated on: THE SIGNED M_j IS THE HEADLINE ESTIMAND; the
    unsigned D_j is a declared secondary table.
    CONSEQUENTIAL CHANGES MADE RATHER THAN COSMETIC ONES: (a) the
    lossy-projection argument now shows that M -> |M| fails the compatibility
    half of the test, because no function of D determines the decoded symbol, so
    the unsigned object could not have propagated deterministically through the
    outer decode; (b) a new control NULL-SIGN runs the identical estimator on D
    and reports both tables and their divergence depth, so a future reader cannot
    repeat the confusion; (c) a new falsification condition covers the case where
    the two tables agree everywhere, which would mean the conditioned region
    contains no wrong decodes and no DFR-relevant conclusion follows; (d) a new
    numbered heuristic H4 states the nesting of {M_j < q_u} toward {M_j < 0} and
    records that the unsigned events nest toward the TIE set instead, with a
    measured gap log2 u - log2 P[M_j < 0] reported beside every headline cell;
    (e) the float-precision confounder is upgraded from rank flips to SIGN flips,
    with a required zero sign-disagreement rate and a preference for exact-integer
    arithmetic; (f) a second reproduction fixture requires the measured marginal
    P[M_j < 0] to match SPEC Table 11's inner DFR at HQC-1; (g) the
    observation_collision block gains a third, named collision - the one this
    record fell into - with its two separating conditions; (h) the
    method_ceiling's nearby_object_control now names D as the nearest object on
    which the identity provably fails; (i) an assumption is added that the signed
    margin requires the transmitted codeword and is therefore a SIMULATION
    instrument, with the corresponding interpretation limit.
    ATTRIBUTION: IDEA-20260816-6536d7 is added to citations (provenance internal,
    verified_by idea-generator@2026-08-24 - the definition was read directly from
    the file during this repair), the margin object is explicitly not claimed as
    new in novelty_screen.verdict, best_known and sota_delta, and
    discriminated_from records that this record had corrupted 6536d7's definition
    and has restored it.
    PRIORITY: recommended_priority UNCHANGED at high. The finding was a defect in
    the record's operational definition, not in its value; with the signed object
    restored, the identity, the estimand and the discriminating design are intact
    and the head-to-head against two published models still stands. No payoff
    claim was withdrawn.
    NOT DONE, AND DISCLOSED: this session had no shell, so
    `python3 -c "import yaml; yaml.safe_load(...)"` could NOT be run against this
    file. The record was rewritten whole with the Write tool and its YAML
    structure was checked by eye only. A parse check must be run before this
    record is relied on. No experimental outcome, timing or measurement is
    asserted anywhere in this repair; the only numbers added are the marginal
    failure probability of about 2^-10.8 implied by SPEC Table 11, which was
    already carried in the record, and the derived storage figures.

