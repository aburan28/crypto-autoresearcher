idea:
  id: IDEA-20260821-7a08df
  question_id: RQ-HQC-001
  added: '2026-08-21'
  title: >-
    Two published DFR models for HQC now disagree about the same object, and the
    place they must disagree is measurable at DEPLOYED parameters: HQC's failure
    event is EXACTLY the sign of the (delta_e + 1)-th order statistic of the
    joint SIGNED inner-margin vector, so measure that order statistic's
    tail-dependence profile against a cross-ciphertext block re-pairing null
    whose value is forced to the independence answer, and let the data referee
    SPEC's Theorem 6.1 against the independence-free closed-form model
  class: measurement

  claim: >-
    (A) AN EXACT RE-EXPRESSION OF THE FAILURE EVENT, WITH NO MODEL IN IT. Let
    M = (M_1, ..., M_{n_e}) be the vector of inner-decoder SIGNED MARGINS for one
    ciphertext, WHERE THE MARGIN IS DEFINED EXACTLY AS IN IDEA-20260816-6536d7,
    WHICH INTRODUCED THIS OBJECT:
      M_j := (correlation of the TRANSMITTED codeword)
             - (maximum correlation over ALL OTHER codewords).
    M_j IS SIGNED. It is negative precisely when some wrong codeword correlates
    at least as strongly as the transmitted one, so block j fails exactly when
    M_j < 0, with M_j = 0 resolved by the deployed decoder's deterministic tie
    rule. The transmitted codeword is KNOWN IN SIMULATION - the pipeline draws
    the message and therefore the codeword - so M_j is computable on every
    sample at no extra asymptotic cost, as 6536d7 establishes (a second maximum
    over an array the decoder already materialises, plus one lookup of the known
    transmitted codeword's correlation).
    CORRECTED BY REPAIR 2026-08-24, AND THE CORRECTION IS LOAD-BEARING RATHER
    THAN COSMETIC: this record originally wrote the margin as "the best codeword
    correlation minus the runner-up" in claim (A) and computed
    "(largest |peak|) - (second largest |peak|)" in Stage 1. THAT QUANTITY IS
    NON-NEGATIVE BY CONSTRUCTION, so under it {M_j < 0} is the EMPTY event, the
    headline identity was false, and the mandatory per-sample decoder-consistency
    check would have failed on 100% of samples and voided the package. The
    non-negative quantity is a DIFFERENT OBJECT: it is
      D_j := (largest correlation) - (second largest correlation) = |M_j|,
    6536d7's RELIABILITY MEASURE - the decoder's confidence, which carries no
    information about whether the decision was right. D_j is retained in this
    record as a SECONDARY observable (see (F)) and is never the object of the
    identity.
    HQC's concatenated decoder fails exactly when more than delta_e blocks fail,
    i.e. WHEN THE (delta_e + 1)-TH SMALLEST COORDINATE OF THE SIGNED VECTOR M IS
    NEGATIVE. That is an identity, not an approximation: it uses only A18 (one
    failed inner block is exactly one Reed-Solomon symbol error, which is exact
    because the inner code's dimension is 8 and one F_256 symbol is 8 bits) and
    the SIGNED margin definition above. It uses NEITHER A5 (coordinate
    independence of e') NOR A17 (independence of the n_e block outcomes).
    Written this way, DFR = P[M_(delta_e+1) < 0], and the entire content of A17
    is the claim that this order statistic behaves as if the coordinates of M
    were independent.

    (B) THE OBJECT IS NOW MEASURABLE WHERE THE DFR IS NOT. Counting decryption
    failures at HQC-1 needs about 2^128 trials; this campaign's own BATCH-003
    priced a related direct measurement at 3.4e41 trials. But the DEPENDENCE
    STRUCTURE of M does not need failures to be observed: it is estimable from
    the joint law of the SIGNED margins at moderate tail depth, at HQC's TRUE
    deployed parameters (n = 17669, omega = 66, omega_r = omega_e = 75, n_e = 46,
    n_2 = 384, delta_e = 15 at HQC-1), because sampling e' costs two sparse ring
    multiplications and evaluating 46 inner margins costs 46 fast Walsh-Hadamard
    transforms of length 128. THE ESTIMAND, AND THE REPAIR STATES EXPLICITLY
    WHICH OBJECT IT IS ESTIMATED ON: for a ladder of quantile levels u, the
    k-block joint LOWER-tail exceedance ratio OF THE SIGNED MARGIN
    R_k(u) = P[k specified blocks all have SIGNED margin M_j below their own
    lower u-quantile] / u^k.
    THE SIGNED MARGIN IS THE HEADLINE OBJECT because its lower tail is the tail
    that contains the failure event: as u -> P[M_j < 0], the conditioned region
    converges on failure itself, which is exactly the continuity that makes a
    dependence measured at u = 1e-4 relevant to a probability at 2^-128 (subject
    to H2's extrapolation caveat).
    UNDER A17 THIS IS EXACTLY 1 FOR EVERY k AND EVERY u. It is a pure,
    dimensionless test of A17 that needs no model of what p_i is.

    (C) THE HEAD-TO-HEAD, WHICH IS WHY THIS DISCRIMINATES RATHER THAN EXPLORES.
    Two published models now make DIFFERENT predictions for R_k(u), and this
    session verified that both exist. SPEC's Theorem 6.1 predicts R_k(u) = 1 for
    all k, u, by construction. Annechini, Barenghi and Pelosi (eprint 2026/795)
    report a closed-form DFR model for HQC that removes the independence
    assumption; a search summary of that paper states its mechanism as "decoding
    failures for some DRM codewords imply that the amount of errors left in the
    other codewords is lower than average", which is an explicitly NEGATIVE
    dependence and predicts R_k(u) < 1. This program's own EV-HQC-b71230
    measured joint failure moments BELOW the independence prediction at every
    order k = 2..18 on one reduced parameter set, i.e. the same sign, at toy
    scale, with a null that could fire and did not. THREE OUTCOMES ARE
    PRE-DECLARED AND EACH MEANS SOMETHING DIFFERENT: R_k(u) < 1 stably, matching
    the 2026/795 mechanism, means SPEC's Theorem 6.1 is CONSERVATIVE by a
    quantified amount at DEPLOYED parameters and this program has independently
    corroborated an external result at a scale nobody in this corpus has reached;
    R_k(u) = 1 within error at every depth tested means both corrections sit
    below the measurable depth and A17 survives at that depth, which is a genuine
    obstruction with a number attached; R_k(u) > 1 means BOTH published models
    are optimistic and the DFR is heavier-tailed than either predicts, which
    would be the most consequential result this program has produced and which is
    exactly why it is pre-declared, so that it cannot be reached by accident.

    (D) THE SIGN IS NOT FORCED, AND HERE IS THE DERIVATION THAT SHOWS IT. Two
    mechanisms push R_2 in OPPOSITE directions and neither is guaranteed to
    dominate. CONSERVATION pushes DOWN: e' has a total weight W = omega(e') whose
    distribution is concentrated, and errors spent inside one block are errors
    not available to another, so conditioned on W the block weights are
    negatively associated and R_2 < 1. MIXTURE PUSHES UP: W is not deterministic,
    the per-block failure probability p_i(W) is steeply increasing in W, and a
    mixture of independent-block laws over a fluctuating common parameter is
    OVER-dispersed, contributing R_2 = 1 + Var(p_i(W))/E[p_i(W)]^2 > 1 from that
    term alone. The measured R_2 is the competition of the two, and which wins is
    a property of HQC's actual parameters that neither published model's sign can
    be assumed from. THIS IS THE FORCED-VALUE DERIVATION KN-TECH-1a5b7e
    OBLIGATION 4 DEMANDS, AND ITS ANSWER IS THAT THE CONTRAST IS NOT FORCED -
    which is what makes the measurement about something.

    (E) WHAT IS NOT CLAIMED. No attack, no chosen-ciphertext procedure, no
    decryption-failure oracle, no query count, no key recovery. No DFR value is
    produced: R_k(u) is a dimensionless dependence ratio and converting it into a
    DFR at k = delta_e + 1 = 16 requires an extrapolation in k that is stated as
    a numbered heuristic and reported with its bracket, never as a measurement.
    Nothing here says HQC is weak or strong. The measurement is at deployed
    parameters, which is unusual for this lane and is the point, but a
    measurement of a DEPENDENCE RATIO at deployed parameters is still not a
    measurement of the DFR, and the record must never be cited as if it were.

    (F) THE TWO MARGIN OBJECTS, AND WHY BOTH ARE RECORDED. ADDED BY REPAIR
    2026-08-24, because the original record conflated them and a reader must not
    be able to repeat that.
    THE SIGNED MARGIN M_j = corr(transmitted) - max corr(others). Range: all of
    R. Sign carries the failure bit exactly: F_j = 1{M_j < 0}. THIS IS THE OBJECT
    OF CLAIM (A)'S IDENTITY AND OF THE HEADLINE R_k(u).
    THE RELIABILITY MEASURE D_j = |M_j| = (largest correlation) - (second
    largest). Range: [0, infinity). Carries NO failure information: a confidently
    wrong decode and a confidently right one have the same D_j. This is the
    quantity eprint 2026/656's reliability-based decoding framework uses to
    assign erasures, and it is 6536d7's stated variance-reduction handle.
    BOTH ARE RECORDED PER SAMPLE AND BOTH ARE ANALYSED, BUT ONLY THE SIGNED ONE
    IS THE HEADLINE. R_k(u) computed on D_j's lower tail is a SEPARATE,
    SECONDARY estimand - the joint tail dependence of decoder CONFIDENCE - and it
    is reported in its own table, labelled, and never substituted for the signed
    one. The comparison of the two is itself informative: the signed and unsigned
    tails coincide only where the decoder is nearly always correct, so a
    divergence between them locates the depth at which the confidence measure
    stops proxying for correctness, which is the exact quantity a
    reliability-based outer decoder depends on.

  mechanism: >-
    STAGE 0 (PRE-REGISTRATION, BEFORE ANY DATA EXISTS). Freeze: the SIGNED margin
    definition of claim (A) and the exact tie rule (IDEA-20260816-2e03d4
    established that the deployed decoder resolves maximum-likelihood ties
    deterministically rather than by a coin, and every symmetry statement about M
    depends on which is used - BOTH arms are run and reported); the fact that the
    secondary object D_j = |M_j| is a different quantity with its own table; the
    quantile ladder u in {1e-1, 3e-2, 1e-2, 3e-3, 1e-3, 3e-4, 1e-4}; the orders
    k in {2, 3, 4, 6, 8}; the block pairs used for R_2, chosen to span every
    cyclic separation class because IDEA-20260816-b68344 derives that the
    pairwise structure can depend only on block separation; the estimator and its
    variance formula; and the extrapolation law in k, declared in advance with
    its functional form fixed. A quantile ladder or a pair set chosen after
    seeing data would inflate any effect arbitrarily.

    STAGE 1 (SAMPLING AT DEPLOYED PARAMETERS). Draw the message m, form its
    Reed-Solomon codeword and the n_e transmitted inner (duplicated Reed-Muller)
    codewords - THE TRANSMITTED CODEWORD PER BLOCK IS THEREFORE KNOWN, which is
    what makes the signed margin computable. Draw x, y, r_1, r_2, e with the
    deployed fixed-weight sampler AND, as a declared second arm, with an
    exact-uniform Fisher-Yates sampler, because IDEA-20260816-967721 established
    the deployed sampler as an object with its own null and a dependence ratio
    measured only under the biased sampler would be scoped to the sampler.
    Form e' = x.r_2 - r_1.y + e in R = F_2[X]/(X^n - 1) and truncate to
    N = n_e.n_2. Cost per sample: two sparse products, each omega.omega_r =
    4950 shift-XORs of a 17669-bit vector. Split into n_e = 46 blocks of
    n_2 = 384, fold each block's 3-fold duplication to length 128, run a
    length-128 fast Walsh-Hadamard transform, and record
      M_j := (correlation of the TRANSMITTED codeword of block j)
             - (maximum correlation over ALL OTHER codewords),
    the SIGNED margin of IDEA-20260816-6536d7, together with the secondary
    reliability measure D_j := (largest correlation) - (second largest), which
    equals |M_j|. CORRECTED BY REPAIR 2026-08-24: Stage 1 previously recorded
    only the non-negative D_j and called it M_j, which made claim (A)'s identity
    false and the decoder-consistency check unpassable. Both are now recorded and
    they are never interchanged. Record the FULL SIGNED margin vector, not the
    failure indicator: the whole proposal is that the vector carries what the
    indicator cannot at this sample size. Also record W = omega(e'), because W is
    the candidate latent and stage 4 needs it.

    STAGE 2 (THE ESTIMATOR). Estimate each block's marginal lower u-quantile of
    the SIGNED margin from the pooled data (marginals are equal across blocks by
    the exact cyclic symmetry IDEA-20260816-b68344 derives, and that equality is
    itself checked as a precondition rather than assumed). Then estimate R_k(u)
    as the empirical joint exceedance count over T u^k, with a bootstrap interval
    over at least 200 resamples. Run the identical estimator a second time on
    D_j, as the declared secondary table. Report the effective sample size in the
    conditioned region at every (k, u) cell, and REFUSE to report any cell whose
    expected count under independence is below 30 - a declared reporting floor,
    fixed in stage 0, so that the ladder's depth is limited by data and not by
    taste.

    STAGE 3 (THE NULL, AND IT IS THE HEART OF THE DESIGN). CROSS-CIPHERTEXT
    BLOCK RE-PAIRING: build a synthetic dataset in which block j's signed margin
    is taken from ciphertext pi_j(t) for independent uniform permutations pi_j.
    This preserves EVERY MARGINAL EXACTLY - the multiset of block-j signed
    margins is unchanged - and destroys ONLY the within-ciphertext coupling. Its
    true R_k(u) is EXACTLY 1 by construction, so whatever the estimator returns
    on it is the estimator's bias-plus-noise floor at that sample size and that
    depth. THE NULL CAN FAIL, and that is the point: if the re-paired arm returns
    R_k(u) materially different from 1 at any cell, the estimator is responding
    to something other than dependence - quantile estimation error, a
    reporting-floor artefact, or a bug - and no signal-arm cell at that depth is
    reportable.
    OBLIGATION 1 IN FULL: object removed = the within-ciphertext coupling of the
    signed margin vector; object PRESERVED = every block's marginal signed margin
    law, the total sample size, the sampler, the decoder, the tie rule, and the
    block index structure.

    STAGE 4 (THE MECHANISM ARM, WHICH SEPARATES CORRELATION FROM CAUSE). Repeat
    the whole estimate CONDITIONED ON W in narrow bins. If the dependence is
    entirely the mixture effect of (D), conditioning on W must remove it and the
    conditional R_k(u) must drop toward or below 1. If it is conservation, the
    conditional R_k(u) must stay below 1 and the unconditional must be closer to
    1. If neither happens, a third mechanism is operating and the residual is the
    deliverable rather than an embarrassment. THIS ARM IS WHAT STOPS THE RECORD
    FROM CONVERTING A CORRELATION INTO A MECHANISM, which is an explicit
    prohibition in the Idea Generator contract.

    STAGE 5 (GRADED SENSITIVITY, RUN BEFORE THE REAL ARM IS READ). A synthetic
    signed-margin generator with a shared latent of tunable strength t:
    M_j = sqrt(1-t) Z_j + sqrt(t) Z_0 with Z_j, Z_0 independent and the marginals
    matched to the measured SIGNED ones. At t = 0 the estimator must return
    R_k(u) = 1 at every cell; at t = 0.5 it must return a value well above 1;
    AND AT AT LEAST THREE INTERIOR POINTS t in {0.1, 0.25, 0.35} MONOTONICITY IN
    t MUST BE REPORTED, because KN-TECH-1a5b7e's own most recent worked case is a
    two-point gate that passed while the statistic was non-monotone in between,
    so that a verdict could be read as a departure but not as a direction. The
    comparator is named (the re-paired null), the spread it is scored against is
    the same bootstrap spread used for the headline, and the numeric threshold is
    declared before the run.

    STAGE 6 (THE REFEREE STEP). Transcribe eprint 2026/795's closed-form model
    from the primary PDF - NOT DONE IN THIS SESSION, which had no PDF renderer -
    and evaluate its prediction for R_k(u) at HQC-1's parameters. Compare
    against the measured profile and against SPEC's flat R = 1. Report which, if
    either, the data is consistent with, at every cell, with the comparison
    pre-registered. IF THE TRANSCRIPTION CANNOT BE OBTAINED, the head-to-head is
    reported as BLOCKED and only the SPEC comparison is made - an infrastructure
    outcome under AGENTS.md rule 3, never a mathematical one.

