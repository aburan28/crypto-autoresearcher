  assumptions:
    - >-
      That the failure event is EXACTLY {M_(delta_e+1) < 0}. This rests on A18,
      which the transcription shows is exact rather than approximate (dimension 8
      = one F_256 symbol), and on the margin's sign convention matching the
      decoder's decision. It is checked, not assumed: the pipeline verifies on
      every sample that the deployed decoder's symbol output disagrees with the
      transmitted symbol exactly when M_j < 0.
    - >-
      That sampling e' at deployed parameters is affordable at T = 10^7 or above.
      Two sparse products of 4950 shift-XORs each on a 17669-bit vector, plus 46
      length-128 Walsh-Hadamard transforms, is of order 6 x 10^4 word operations
      per sample in a C implementation.
    - >-
      That the reporting floor (expected count >= 30 under independence) is fixed
      before the run and is what limits the ladder's depth, so that the depth is
      set by data and not by which cells look interesting.
    - >-
      That the tie rule is pinned and BOTH the deployed deterministic rule and a
      random-tie-break arm are run, per IDEA-20260816-2e03d4.
    - >-
      That the marginals are equal across blocks, as IDEA-20260816-b68344's
      circulant-covariance derivation forces. This is a PRECONDITION CHECK: if the
      measured marginals differ across blocks beyond sampling error, either the
      derivation or the implementation is wrong and the pooled-quantile estimator
      is invalid.
    - >-
      NO ASSUMPTION IS MADE that eprint 2026/795's model is correct, or that its
      snippet-level description is accurate. Stage 6 transcribes it or reports
      BLOCKED.

  predictions:
    - metric: 'R_k(u) on NULL-A (cross-ciphertext re-paired arm), all cells'
      direction: different
      minimum_effect: >-
        1.00, within the 16-draw interval, at every reported cell. A hard gate:
        any cell where NULL-A's interval excludes 1 is unreportable in the signal
        arm at that depth.
    - metric: 'Agreement between NULL-A and NULL-B intervals'
      direction: different
      minimum_effect: >-
        Overlapping intervals at every cell. Disagreement means the estimator
        reads something other than within-ciphertext coupling and no signal
        number is reportable.
    - metric: 'R_2(u) in the signal arm, at u = 1e-2, deployed HQC-1 parameters'
      direction: different
      minimum_effect: >-
        A DEPARTURE FROM 1 OF AT LEAST 0.02 IN ABSOLUTE VALUE, declared before
        the run, scored against the 16-draw NULL-A interval and not against an
        asymptotic reference. THE SIGN IS DELIBERATELY NOT PREDICTED, and the
        derivation in claim (D) is the reason: conservation forces down, mixture
        forces up, and this program has no basis at deployed parameters for
        saying which wins. Reporting a signed prediction I cannot justify would
        be the overclaim.
    - metric: 'R_k(u) as k increases through {2, 3, 4, 6, 8}'
      direction: different
      minimum_effect: >-
        THE PROFILE'S SHAPE IS THE DELIVERABLE. Pre-registered: if a departure
        exists at k = 2 it must GROW in magnitude with k, because a per-pair
        multiplicative deviation compounds - a departure that vanishes as k grows
        means the dependence dies before it reaches index 16 and the DFR-relevant
        conclusion is null even though the k = 2 cell fired. That is the single
        most likely way this record produces a null and it is named in advance.
    - metric: >-
        Conditional R_2(u) given W = omega(e') in narrow bins, against the
        unconditional
      direction: different
      minimum_effect: >-
        A CHANGE OF AT LEAST 50% OF THE UNCONDITIONAL DEPARTURE, in either
        direction, which is the mechanism arm's discrimination threshold. If
        conditioning on W removes most of the departure, the mechanism is the
        mixture over total weight; if it leaves it, the mechanism is conservation
        or something else; if the conditional departure has the OPPOSITE sign to
        the unconditional, both mechanisms are present and their magnitudes are
        separately reportable.
    - metric: 'Real arm versus NULL-C (i.i.d. Bernoulli(p*) input)'
      direction: different
      minimum_effect: >-
        This contrast is the combined A5+A17 error at deployed parameters and is a
        second deliverable. Pre-registered only in direction of the CHECK, not of
        the result: NULL-C must land on the SAME SIDE of NULL-A as the real arm
        or on NULL-A itself. Landing on the opposite side means the statistic is
        not tracking the object (KN-TECH-1a5b7e mode 2) and voids the package.
    - metric: 'Graded control: R_2(u) at t in {0, 0.1, 0.25, 0.35, 0.5}'
      direction: higher
      minimum_effect: >-
        1.00 at t = 0 and at least 1.5 at t = 0.5, both declared before the run,
        AND monotonicity across the three interior points REPORTED. If it is not
        monotone, the instrument detects a departure but cannot sign one, and no
        directional reading is attached to any verdict.
    - metric: >-
        Marginal equality across the 46 blocks (precondition check)
      direction: different
      minimum_effect: >-
        Block-wise u-quantiles agreeing within sampling error at every u. A
        systematic difference contradicts IDEA-20260816-b68344's derivation and
        halts the package until the disagreement is located.

  minimal_test:
    design: >-
      ONE PARAMETER SET (deployed HQC-1: n = 17669, omega = 66,
      omega_r = omega_e = 75, n_1 = n_e = 46, n_2 = 384, delta_e = 15), FOUR ARMS
      (signal, NULL-A x16 draws, NULL-B, NULL-C), TWO SAMPLER ARMS (deployed
      biased and exact-uniform Fisher-Yates), TWO TIE-RULE ARMS (deployed
      deterministic and random), ONE INVOCATION. T = 10^7 samples in the primary
      run with a declared sample-size ladder at T in {10^5, 10^6, 10^7} so that
      convergence is a reporting precondition rather than an assumption; a run
      whose R_2 estimate changes by more than its own interval between the last
      two rungs is not an estimate and no value is reported. Store only
      (W, M_1..M_46) per sample: 47 floats, so the whole table is about 4 GB at
      T = 10^7 in float64 and under 2 GB in float32, and float32 is sufficient
      because only quantile ranks are used - a claim the pipeline verifies by
      recomputing one rung in float64.
      WHY THIS IS THE MINIMAL DISCRIMINATING DESIGN: the head-to-head needs only
      the dependence ratio, and the dependence ratio needs only moderate tail
      depth, so nothing here requires observing a decryption failure - which is
      what makes a deployed-parameter measurement possible at all. Removing any
      arm removes a specific alternative explanation: without NULL-A the
      estimator's floor is unknown; without NULL-B the floor cannot be attributed;
      without NULL-C the A5 half is unmeasured; without the W-conditioning arm a
      correlation would be sold as a mechanism; without the graded control the
      instrument's direction is unverified.
      COMPUTE: of order 6 x 10^11 word operations for generation at T = 10^7,
      i.e. tens of core-hours in C, dominated by the two sparse ring products.
      This is the expensive proposal of the batch and it is the one aimed at the
      lane's highest-value question.
    controls:
      - >-
        NULL-A, cross-ciphertext block re-pairing, 16 independent draws, interval
        reported, forced value 1 derived before the run, CAN FAIL.
      - >-
        NULL-B, decoder-free structural null matched to the measured marginals,
        required to agree with NULL-A.
      - >-
        NULL-C, i.i.d. Bernoulli(p*) input through the identical decoder - the
        maximal-removal control, required to be on the same side as the real arm.
      - >-
        GRADED CONTROL with >= 3 interior points and MONOTONICITY REPORTED, with
        the comparator named (NULL-A), the spread the same bootstrap spread as
        the headline, and the threshold numeric and pre-declared.
      - >-
        SAMPLE-SIZE LADDER in T with convergence as a reporting precondition.
      - >-
        SAMPLER ARM: deployed biased sampler versus exact-uniform Fisher-Yates,
        so that a dependence measured only under the deployed sampler is scoped
        to it (IDEA-20260816-967721).
      - >-
        TIE-RULE ARM: deterministic versus random tie-break
        (IDEA-20260816-2e03d4), because A13's 1/2-credit model assumes a coin the
        deployed decoder does not flip.
      - >-
        PRECONDITION CHECK on marginal equality across blocks, from
        IDEA-20260816-b68344's derivation.
      - >-
        DECODER CONSISTENCY CHECK on every sample: the deployed decoder's symbol
        output must disagree with the transmitted symbol exactly when M_j < 0.
      - >-
        PRE-REGISTRATION of the quantile ladder, the k set, the pair set, the
        estimator, the reporting floor and the extrapolation law, in a document
        that provably predates the data.
    required_metrics:
      - 'R_k(u) with bootstrap interval, per (k, u, arm, sampler, tie-rule) cell'
      - 'NULL-A 16-draw interval per cell, and the derived leave-one-out false-positive rate'
      - 'NULL-B and NULL-C values and intervals'
      - 'the R_k profile as a function of k, with its trend'
      - 'conditional R_2 given W in narrow bins, against the unconditional'
      - 'graded-control values at t in {0, 0.1, 0.25, 0.35, 0.5} with a monotonicity verdict'
      - 'block-wise marginal quantiles, as the precondition check'
      - 'effective conditioned sample count per cell, and which cells the reporting floor excluded'
      - 'sample-size ladder values and the convergence verdict'
      - 'decoder consistency check pass rate (must be 100%)'
      - 'the transcribed eprint 2026/795 prediction for R_k(u), or a BLOCKED marker'

  falsification_conditions:
    - >-
      NULL-A's interval excludes 1 at a cell. That cell is unreportable; if it
      happens at most cells, the estimator is broken and the package is void.
    - >-
      NULL-A and NULL-B disagree. The estimator responds to something other than
      within-ciphertext coupling; no signal number is reportable.
    - >-
      NULL-C lands on the opposite side of NULL-A from the real arm. Total
      removal is less extreme than partial removal and on the wrong side; the
      statistic is not tracking the object (mode 2) and the package is void.
    - >-
      The graded control is not monotone across its interior points. The
      instrument can detect a departure but cannot sign one; every verdict is
      reported without a directional reading, and the record says so where the
      verdict appears.
    - >-
      The estimate does not converge across the T ladder. It is not an estimate
      and none is reported.
    - >-
      THE PRIMARY NULL OUTCOME: R_k(u) = 1 within interval at every reported cell.
      Then the joint margin law is the product of its marginals at every depth
      reachable at T = 10^7, A17 survives at the tested depth AT DEPLOYED
      PARAMETERS - which no record in this corpus can currently say - and the
      deliverable is an OBSTRUCTION recorded with its quantity, its value with
      error bars, the runs it is read from, and its scope: "the A17 correction, if
      any, is below X in magnitude at quantile depth 1e-4 at HQC-1". That is a
      first-class result, it does NOT close RQ-HQC-001, and it names what remains
      open (depths below 1e-4, orders above k = 8, and HQC-3/HQC-5).
    - >-
      THE PROFILE DIES IN k: a departure at k = 2 that shrinks toward 1 as k
      grows. The dependence does not reach the index delta_e + 1 = 16 that the
      DFR depends on, the DFR-relevant conclusion is null, and the k = 2 finding
      must NOT be reported as a DFR statement.
    - >-
      R_k(u) > 1 stably and growing in k. Both published models are optimistic.
      THIS OUTCOME MAY NOT BE STATED UNTIL IT HAS BEEN REPRODUCED BY AN
      INDEPENDENT IMPLEMENTATION (IDEA-20260816-50d270's second-implementation
      discipline) AND HAS PASSED INDEPENDENT VALIDATOR AND RED-TEAM REVIEW, and
      even then it is a statement about a dependence ratio at deployed parameters
      and not about HQC's DFR, its IND-CCA security, or any deployed system.

  confounders:
    - >-
      QUANTILE ESTIMATION ERROR IS THE DOMINANT ONE AND IT GROWS WITH DEPTH. At
      u = 1e-4 and T = 10^7 each block's quantile is estimated from about 1000
      order statistics pooled over 46 blocks; an error in the quantile propagates
      into R_k as roughly k times the relative quantile error. THE DEFENCE IS
      THAT NULL-A INHERITS EXACTLY THE SAME QUANTILE ERROR, because it uses the
      same pooled quantiles on the same marginals - which is why the null is a
      re-pairing and not a fresh generation.
    - >-
      THE REPORTING FLOOR IS A SELECTION RULE. Cells excluded by the floor are
      excluded on a criterion computed under independence, which is the
      hypothesis under test; the floor is therefore declared in advance and the
      excluded cells are LISTED rather than silently dropped.
    - >-
      FLOAT PRECISION IN THE MARGIN. Near-ties produce margins near zero, and
      float32 rank comparisons can reorder them. The pipeline recomputes one rung
      in float64 and reports the rank-disagreement rate; a nonzero rate at the
      depths reported voids those depths.
    - >-
      THE DEPLOYED SAMPLER. A dependence measured only under the biased sampler
      is a statement about the sampler, not the scheme. The exact-uniform arm is
      what separates them, and IDEA-20260816-967721 establishes that the sampler
      deserves its own null.
    - >-
      THE TIE RULE. A13 credits 1/2 on two-way ties, i.e. assumes a coin; the
      deployed decoder uses a deterministic rule (IDEA-20260816-2e03d4). A
      deterministic rule can induce dependence across blocks that a coin would
      not, because the same rule breaks every tie the same way. Both arms are run
      for exactly this reason.
    - >-
      TRUNCATION. Only 5 of 17669 coordinates are truncated at HQC-1, so the
      effect is small, but it breaks the exact cyclic symmetry that makes block
      marginals equal, and the precondition check is where that would show up.
    - >-
      SHARED SEEDS ACROSS ARMS SHRINKING APPARENT VARIANCE IN ARM DIFFERENCES.
      Arms use disjoint seed streams, declared in stage 0.
    - >-
      A SUBTLY WRONG SAMPLER WOULD REPRODUCE ANY RESULT PERFECTLY. This is
      EV-HQC-b71230's own largest unresolved confound (OPEN-6): its validator's
      exact recomputation certified arithmetic "FROM THE HISTOGRAM FORWARD AND
      NOTHING BEHIND IT". NULL-C is the answer here - a decoder-and-sampler-free
      i.i.d. input arm that must return 1 - and it is the arm that OPEN-6 did not
      have.

  interpretation_limits:
    - >-
      A DEPENDENCE RATIO IS NOT A DECODING FAILURE RATE. R_k(u) at u = 1e-4 and
      k = 8 says nothing directly about a probability of 2^-128 at k = 16, and
      the extrapolation to k = delta_e + 1 is a numbered heuristic (H2 below)
      reported with its bracket. No DFR value is produced by this record and none
      may be inferred from it.
    - >-
      Deployed PARAMETERS are not a deployed CLAIM TIER. The measurement runs at
      HQC-1's published parameters, which is unusual and valuable, but
      RQ-HQC-001's toy claim-tier ceiling is set by the certificate standard in
      docs/claims-and-verification.md and not by the parameter values, and it
      applies unchanged. Nothing here carries a certificate of anything.
    - >-
      Scoped to HQC-1 unless HQC-3 and HQC-5 are run. Their inner codes
      ([640, 8, 320]) and outer codes differ, and SPEC Table 11 shows their inner
      DFRs are not monotone in the security level, so nothing transfers.
    - >-
      Scoped to the deployed decoder, the pinned tie rule, and the two samplers
      run. Not a statement about maximum-likelihood decoding of the whole
      concatenated code (IDEA-20260816-3994ef's object).
    - >-
      No attack, no oracle, no query count, no key recovery, no security
      consequence. A DFR bound that is conservative is not a vulnerability and a
      dependence ratio above 1 is not an attack.
    - >-
      This session read no full text of eprint 2026/795. Every statement about
      what that model predicts is provisional until stage 6 transcribes it, and a
      head-to-head reported before that transcription is a head-to-head against a
      model I have described from a search snippet.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FOR ALL blocks j and FOR ALL quantile levels u in the declared ladder, the
        pooled empirical u-quantile of the margin distribution is a consistent
        estimator of every block's own u-quantile, uniformly in j. Formally:
        the 46 block margin laws are identical, so pooling multiplies the
        effective sample size by 46 without bias.
      rigorous_support: >-
        IDEA-20260816-b68344's zero-compute derivation that the untruncated
        error's coordinate covariance is exactly circulant, which forces
        per-block marginals to be exactly equal by cyclic symmetry; plus the
        exactness of the marginal-invariance argument in SPEC's Prop 6.1.2, which
        computes P[e'_k = 1] identically for every k. The classical statement
        this imitates is the exchangeability of coordinates of a cyclically
        invariant random vector.
      validation_plan: >-
        SAMPLE: block-wise empirical quantiles at every u on the ladder, from the
        same T = 10^7 draws, at deployed HQC-1 parameters - no surrogate and no
        shortcut is needed because the sampling is already affordable at scale.
        COMPARISON: a chi-square of the 46 block-wise quantile estimates against
        their pooled value at each u, with the truncation of 5 of 17669
        coordinates as the only known symmetry-breaker and its predicted effect
        size (of order 5/17669) computed in advance. TAIL CHECK: the block-wise
        MINIMUM margin over all T draws, compared across blocks; a block whose
        extreme is systematically different from the others exposes an indexing
        defect that a quantile comparison at u = 1e-2 would miss.
        TRANSFER ASSUMPTIONS: none - this is measured at the parameters it is
        claimed for.
    - id: H2
      statement: >-
        FOR THE EXTRAPOLATION STEP ONLY, AND IT IS THE WEAKEST LINK IN THE
        RECORD. There exists a declared functional form f such that
        R_k(u) = f(k; theta) with theta estimated from k in {2, 3, 4, 6, 8} and
        f extrapolating to k = delta_e + 1 = 16. The form is fixed in stage 0
        before data - a log-linear law log R_k = (k-1) log rho is the declared
        default, corresponding to a pairwise-multiplicative dependence - and any
        other form fitted after seeing data is a fit and is reported as one.
      rigorous_support: >-
        NONE THAT IS RIGOROUS, and this entry exists to say so. The log-linear
        form is the one a pairwise-exchangeable dependence with no higher-order
        structure would produce, and it is exactly the shape EV-HQC-b71230
        reported for a DIFFERENT statistic on a DIFFERENT parameter set
        ("log2 A-hat_k tracks C(k,2) * log2 A-hat_2 to within 0.4 to 6.4 percent
        across k = 2..18"), which is a C(k,2) law rather than a (k-1) law - so
        this program's own nearest data POINTS AT A DIFFERENT FORM and both are
        fitted and reported side by side rather than one being chosen.
      validation_plan: >-
        SAMPLE: the measured R_k at k in {2, 3, 4, 6, 8}, five points, at every u
        on the ladder. COMPARISON: leave-one-out - fit theta on four of the five
        k values and predict the fifth, reporting the prediction error at every
        u. That is the only honest internal check available and it is what
        converts the extrapolation from an assertion into a measured error bar.
        TAIL CHECK: the extrapolated R_16 must be bracketed by the two functional
        forms (log-linear and C(k,2)), and the BRACKET, not a point, is what is
        reported. If the bracket at k = 16 spans more than 3 orders of magnitude,
        THE EXTRAPOLATION IS REFUSED and the record reports the measured profile
        only, with an explicit statement that no DFR-relevant conclusion follows.
        TRANSFER ASSUMPTION, STATED: k = 16 is twice the largest measured order,
        and no amount of internal cross-validation makes an extrapolation of that
        length safe.
    - id: H3
      statement: >-
        The mixture and conservation decomposition of claim (D) is complete at
        second order: R_2 = 1 + Var(p_i(W))/E[p_i(W)]^2 - C + o(.), where C is the
        conservation term and the neglected remainder is third order in the
        per-block failure probability.
      rigorous_support: >-
        The mixture term is the standard over-dispersion identity for a mixture of
        independent Bernoulli vectors over a common parameter, exact in that
        model. The conservation term is bounded by negative-association results
        for fixed-total-weight allocations, which is the same rigorous ingredient
        IDEA-20260808-cbb848 builds its sandwich from. The classical distribution
        statement being imitated is the multivariate hypergeometric urn allocation.
      validation_plan: >-
        SAMPLE: the W-conditioned arm at deployed parameters. The mixture term is
        DIRECTLY COMPUTABLE from the measured Var(p_i(W)) and E[p_i(W)] over the
        W bins, so it is predicted and then compared against the measured
        difference between the unconditional and conditional R_2. COMPARISON: the
        predicted mixture contribution against the measured (unconditional minus
        conditional) departure, which should agree if the decomposition is
        complete. TAIL CHECK: the agreement must hold at every u on the ladder,
        not just the shallowest; a decomposition that works at u = 1e-1 and fails
        at u = 1e-4 is a second-order statement being used in a tail, which is
        exactly the misuse KN-TECH-1a5b7e's correction 2 records.

  proof_search_map:
    bottleneck: >-
      Not a proof-oriented proposal in the theorem sense, but the audits apply and
      are answered. The exact step whose removal changes the conclusion is A17's
      substitution of a product law for the joint law of the 46 block outcomes at
      the tail index delta_e + 1. Everything Theorem 6.1 says is that substitution.
    baseline_embedding:
      parameter_slice: >-
        R_k(u) identically 1 IS SPEC's Theorem 6.1, exactly. The published model
        is the boundary case of the measured object, so the embedding is an
        equality rather than a resemblance.
      reproduction_check: >-
        FROZEN FIXTURE: NULL-C, the i.i.d. Bernoulli(p*) input arm, must return
        R_k(u) = 1 at every cell within the NULL-A interval. That is a symbolic
        prediction checked numerically, and it is the same check as "does the
        pipeline reproduce the baseline when fed the baseline's own input model".
    observation_collision:
      observable: >-
        The ratio R_k(u) and the branch the frozen rule emits from it.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS NAMED, AND IT IS THE REASON THE W-CONDITIONING
        ARM IS MANDATORY. Two distinct mechanisms produce R_2 > 1: a genuine
        block-to-block coupling in the decoder, and a pure mixture over the
        fluctuating total weight W with blocks conditionally independent. These
        are on opposite sides of what "A17 is wrong" would mean - the second is
        arguably a failure of A5 propagating upward rather than of A17 itself.
        THE SEPARATING CONDITION is conditioning on W, and it is stage 4. A
        package reporting R_2 > 1 without the conditional arm has not separated
        the preimages and its verdict is not a mechanism claim.
        A SECOND COLLISION: R_2 < 1 is produced both by conservation and by a
        deterministic tie rule that systematically resolves near-ties the same
        way. The separating condition is the random-tie-break arm.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The continuous margin vector instead of the binary failure indicator -
          preserving more state than the failure event requires, precisely because
          the extra state is what survives into the tail where the indicator has
          no samples at all.
        predicted_gain: >-
          Access to quantile depth 1e-4 per block at T = 10^7, against a per-block
          failure probability of about 2^-10.8 - i.e. roughly three orders of
          magnitude of extra tail reach at the same sample size, and the ability
          to run at DEPLOYED parameters rather than at a reduced surrogate.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable R_k(u) fixed and vary the forgotten structure - the
          sampler, the tie rule, the total weight W - to find which of them the
          ratio actually depends on. That is what the four control arms are.
        predicted_gain: >-
          Converts a single number into an attribution, which is the difference
          between a correlation and a mechanism.
    quantifier_order: >-
      FOR ALL k in the declared set and FOR ALL u in the declared ladder, THERE
      EXISTS an estimate R-hat_k(u) with a 16-draw null interval such that either
      the interval contains 1 (A17 not contradicted at that depth) or it does not
      (A17 contradicted at that depth, with a signed magnitude). THE QUANTIFIER ON
      (k, u) IS UNIVERSAL OVER THE DECLARED LADDER AND EXPLICITLY NOT OVER ALL
      DEPTHS: a statement about depth 1e-4 is not a statement about depth 2^-128,
      and the record may never be phrased as if the ladder were the real line.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At HQC-1's deployed parameters, under the deployed decoder and a pinned
        tie rule, the joint law of the inner-margin vector departs from the
        product of its marginals by a factor R at order k and depth u, with a
        null interval of width W." It can NEVER certify a DFR value, that HQC is
        secure or insecure, that eprint 2026/795's model is right, or anything at
        depths beyond the ladder.
      nearby_object_control: >-
        NULL-C is exactly the nearby object where the hoped-for conclusion must
        FAIL: an i.i.d. Bernoulli(p*) input has no dependence to find, so a method
        that reports a departure there has not identified the load-bearing
        structure. A second nearby object, cheap and worth running: the same
        pipeline on a matched NON-circulant random-linear surrogate
        (IDEA-20260816-b0322a's object), where quasi-cyclicity is removed but the
        length, rate, weights and sampler are matched.
    proof_obligations:
      - claim: 'DFR = P[M_(delta_e+1) < 0] exactly, given A18 and the margin sign convention'
        responsibility: correctness
      - claim: 'The re-pairing null preserves every marginal exactly'
        responsibility: baseline
      - claim: 'R_k(u) = 1 identically under A17'
        responsibility: baseline
      - claim: 'The estimator is consistent and its bias is bounded by the NULL-A floor'
        responsibility: success_probability
      - claim: 'Generation and estimation at T = 10^7 fit the declared budget'
        responsibility: runtime
      - claim: 'The extrapolation to k = 16 is reported as a bracket or refused'
        responsibility: scope
      - claim: 'Nothing is inferred about depths beyond the ladder'
        responsibility: scope
    not_applicable_reason: null

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD FOLLOW - this record produces
      no procedure, no query count and no adversary. The MEASUREMENT costs
      O(T . (omega.omega_r . n/64 + n_e . n_2 . log n_2)) word operations, i.e.
      of order 6 x 10^4 per sample and 6 x 10^11 at T = 10^7, dominated by the two
      sparse ring products. Tens of core-hours in C; the estimator itself is
      O(T . n_e log n_e) and is negligible beside generation.
    memory_exponent: >-
      O(T . (n_e + 1)) floats for the margin table: about 2 GB at T = 10^7 in
      float32, 4 GB in float64. The 16 null draws are permutations of the same
      table and add O(T . n_e) indices, not a second table. Stated beside time
      because docs/claims-and-verification.md requires it always.
    best_known: >-
      IN THIS REPOSITORY: EV-HQC-b71230's joint-moment table is the nearest
      measured object. It dominates this proposal on trial count for a binary
      statistic (T = 1e7 with independent validator recomputation) and on
      certification, and it is DOMINATED on parameter scale (PS-R3, a reduced set,
      with its own boundaries stating no cell at true HQC parameters is
      certified), on observable richness (binary indicator versus continuous
      margin) and on null design (a frozen independence interval versus a
      marginal-preserving re-pairing drawn 16 times). EXTERNALLY: eprint 2026/795
      is an analytic model, not a measurement, and this session did not read it;
      whether anyone has measured the joint tail at deployed parameters is
      UNKNOWN HERE and stage 6 is where it gets checked.
    hidden_overhead: >-
      Three honest disclosures. (i) THE EXTRAPOLATION IN k IS WHERE ALL THE
      OPTIMISM WOULD LIVE if it were allowed to, which is why H2 carries a refusal
      condition: a bracket spanning more than 3 orders at k = 16 means no
      DFR-relevant conclusion is reported at all. (ii) The reporting floor limits
      the ladder to depths where the expected count is at least 30, so the deepest
      cell is set by T and not by ambition, and cells excluded by the floor are
      listed. (iii) Quantile estimation error grows like k times the relative
      quantile error, so the deep-k, deep-u corner is the least reliable and is
      reported with its widened interval rather than trimmed.
    tradeoff_note: >-
      The relevant tradeoff is SAMPLE SIZE against TAIL DEPTH, and it is explicit:
      the deepest reportable u scales like 30/(T . 46) per block, so a decade of
      extra depth costs a decade of T. Parallelisation is embarrassing - samples
      are independent - so the wall-clock cost divides by cores exactly, and the
      binding resource is the margin table's memory rather than the compute.

  dominated_by: >-
    n/a (no result claimed on any attack axis). Frontier rows checked, across all
    three axes inventor-protocol section 5 names. TIME: EV-HQC-b71230's committed
    measurement cost is smaller per sample (binary indicator, reduced parameters)
    and it therefore dominates on cost for ITS estimand - but its estimand is a
    different functional of a different joint law and its data cannot answer this
    question even in principle, because margins were never recorded. MEMORY: no
    in-corpus object holds a 2 GB margin table, so nothing dominates. DATA /
    QUERIES: zero queries to any oracle; T = 10^7 self-generated samples, which
    no in-corpus HQC record exceeds at deployed parameters because no in-corpus
    HQC record measures at deployed parameters. ON THE QUESTION MEASURED: eprint
    2026/795 may well dominate ANALYTICALLY - a closed-form model needs no samples
    at all - and that possibility is recorded here rather than discovered by a
    referee. THIS PROPOSAL DOES NOT DOMINATE IT; it measures where that model
    predicts, which is a different and complementary act, and if the two agree the
    program has an independent corroboration at deployed parameters and if they
    disagree the program has the most interesting result in the lane.
  sota_delta: >-
    No attack; measurement contribution only. QUANTITATIVELY: measurements of
    HQC's joint block-failure structure at DEPLOYED parameters in this repository
    before, 0 - EV-HQC-b71230's own boundaries state "NO CELL AT TRUE HQC
    PARAMETERS IS CERTIFIED". After, a (k x u x arm x sampler x tie-rule) surface
    at HQC-1. Tail depth reachable for the block-failure structure before, of
    order the reduced-parameter failure rate; after, quantile depth 1e-4 per block
    at deployed n_2 = 384, which is roughly three orders deeper than the deployed
    per-block failure probability of about 2^-10.8 and is what the continuous
    observable buys. AGAINST THE EXTERNAL STATE OF THE ART: zero delta on every
    attack axis, and an UNKNOWN delta on the measurement axis until eprint
    2026/795 is read - which is the honest statement and not a hedge.

  estimated_cost:
    implementation: medium
    compute: high

  recommended_priority: high

  honest_prior_of_survival: >-
    BY PART, because a single number would hide where the risk is.
    (i) That the exact identity DFR = P[M_(delta_e+1) < 0] holds under the
    deployed decoder and survives the per-sample consistency check: ~0.9. It
    follows from A18's exactness, and the 0.1 is the tie rule and the sign
    convention.
    (ii) That the pipeline samples e' at deployed HQC-1 parameters at T = 10^7
    inside a plausible budget: ~0.85.
    (iii) That NULL-A returns 1 at every reported cell, licensing the instrument:
    ~0.75. Quantile estimation error at u = 1e-4 is the risk.
    (iv) That the signal arm departs from NULL-A by the pre-declared 0.02 at
    k = 2, u = 1e-2: ~0.6. Some departure is close to certain in principle - the
    conservation and mixture mechanisms are both real - but their competition
    could cancel to well inside the interval, and cancellation is a perfectly
    plausible outcome that I would not be surprised by.
    (v) That the departure GROWS in k rather than dying, i.e. that it reaches the
    index that matters: ~0.4, AND THIS IS THE PART I WOULD BET AGAINST MOST
    READILY. It is also the part that decides whether the record says anything
    about the DFR.
    (vi) That the W-conditioning arm cleanly attributes the departure to one of
    the two named mechanisms rather than leaving a residual: ~0.5.
    (vii) That stage 6 obtains eprint 2026/795's model and the head-to-head is
    actually run: ~0.55, limited by whether a future session has a PDF renderer,
    which this one did not.
    (viii) That the run produces a defensible number or a defensible obstruction:
    ~0.9.

