    results: >-
      IN-CORPUS, AND THE ADJACENCY IS REAL AND IS NAMED RATHER THAN MINIMISED.
      IDEA-20260816-6536d7 introduces the per-block SIGNED MARGIN as a continuous
      observable and proposes it as a variance-reduced estimator of the inner
      failure rate p_i, and separately identifies the non-negative reliability
      measure (largest minus runner-up). That is a MARGINAL object and a
      different estimand; this record takes 6536d7's SIGNED margin as a given
      ingredient, with its definition unchanged, and tracks the JOINT vector's
      order statistic. IDEA-20260816-208783 and EV-HQC-b71230 measure joint
      failure MOMENTS of the binary block-failure indicator under an independence
      null at a REDUCED parameter set (PS-R3, T = 1e7), and EV-HQC-b71230's own
      boundaries state that "NO CELL AT TRUE HQC PARAMETERS IS CERTIFIED".
      IDEA-20260808-cbb848 proposes to SIGN A17 without measuring it, by a
      two-sided sandwich in which negative association bounds the conditional
      term and the mixture term is exactly computable - the same two mechanisms
      this record measures, approached analytically rather than empirically, and
      the two are complements. IDEA-20260808-9f9ed8 brackets the DFR by
      Bonferroni and needs, for its OUTER half, a conditional-independence
      heuristic HA-2 that this record measures directly.
      IDEA-20260816-b68344 derives that the untruncated error's coordinate
      covariance is exactly circulant and forces pairwise block-failure
      probabilities to depend only on block separation - which this record uses
      as a design input for choosing the R_2 pairs and as a precondition check.
      NO RECORD IN THIS LANE MEASURES A JOINT TAIL AT DEPLOYED PARAMETERS, USES
      A CROSS-CIPHERTEXT RE-PAIRING NULL, OR TRACKS AN ORDER STATISTIC AT THE
      INDEX delta_e + 1.
      EXTERNAL, AND THIS IS THE PART THAT CHANGES THE PROPOSAL'S STATUS. Three
      2025-2026 results bear on it and all three were found this session.
      Bombar-Resch-Wiedijk (arXiv:2501.02626) "uncover cases where this modeling
      fails" for the coordinate-independence assumption in HQC's DFR analysis.
      Annechini-Barenghi-Pelosi (eprint 2026/795) report a closed-form DFR model
      with the independence assumption removed, concluding that HQC's current
      DFRs are LOWER than required; a WebSearch summary of that paper's text
      (not the PDF, which I could not open) describes the mechanism as accounting
      for the fact that failures in some DRM codewords imply fewer errors left in
      the others - i.e. it addresses A17 and not only A5. Bitzer-Purtipli-
      Wachter-Zeh (eprint 2026/656) and Cai-Zhang (arXiv:2603.20156) both build
      soft-information outer decoders for HQC and both are DESIGN improvements,
      not model audits; they are recorded here because they establish that the
      inner decoder's reliability carries substantial extra information about
      symbol correctness - and, after the repair, because their object is
      precisely this record's SECONDARY observable D_j = |M_j| and not its
      headline signed M_j, which is a distinction the original record could not
      draw because it had conflated the two.
    verdict: >-
      UNVERIFIED, and the honest reason is specific: eprint 2026/795 appears to
      have done, analytically, a large part of what this record proposes to test,
      and I could not read it. CLAIMED NEW RELATIVE TO THIS REPOSITORY: the exact
      order-statistic re-expression DFR = P[M_(delta_e+1) < 0] ON THE SIGNED
      MARGIN; measurement of the joint tail-dependence profile R_k(u) at DEPLOYED
      HQC parameters rather than at a reduced surrogate; the cross-ciphertext
      block re-pairing null, whose value is forced to 1 while every marginal is
      preserved exactly; the paired signed-versus-reliability tables of claim (F);
      and the head-to-head framing in which the data referees two named published
      models rather than testing one against a straw null. EXPLICITLY NOT CLAIMED
      NEW: the signed margin object itself, which is IDEA-20260816-6536d7's and is
      used here with its definition restored verbatim after the repair.
      CLAIMED NEW EXTERNALLY: NOTHING, pending a reading of eprint 2026/795. If
      that paper's model already predicts R_k(u) at HQC's parameters, this record
      becomes an INDEPENDENT EMPIRICAL TEST OF A PUBLISHED MODEL AT DEPLOYED
      PARAMETERS, which is exactly what RQ-HQC-001's phrase "under independent
      measurement" asks for and is a legitimate and valuable deliverable - but it
      is a different deliverable from a novel finding, and the difference is
      stated here rather than discovered by a referee.

  object_first_candidate:
    tracked_object: >-
      The JOINT SIGNED INNER-MARGIN VECTOR M = (M_1, ..., M_{n_e}) of a single
      ciphertext, with M_j = corr(transmitted codeword) - max corr(other
      codewords) per IDEA-20260816-6536d7, followed from the sampling of the
      message and of (x, y, r_1, r_2, e), through the two sparse ring products,
      the mod-2 reduction, the truncation, the block split and the 46 independent
      Walsh-Hadamard evaluations, to the readout - and specifically its ORDER
      STATISTIC M_(delta_e+1), whose sign IS the failure event. The unsigned
      reliability vector D = |M| is tracked alongside as a declared secondary
      object and is never the headline.
    established_families_off_limits: >-
      Declared off-limits as the primary lens, per inventor-protocol section 1,
      because the DFR flank of this lane is heavily mined: (i) the scalar failure
      RATE and any estimator of it, which is IDEA-20260801-011's and
      IDEA-20260816-6536d7's territory; (ii) the binary block-failure INDICATOR
      and its joint moments, which is H-HQC-18d1b4's, EXP-HQC-982268's and
      EV-HQC-b71230's; (iii) the ANALYTIC bounding of A17, which is
      IDEA-20260808-cbb848's and IDEA-20260808-9f9ed8's; (iv) the SECRET-side
      objects - additive energy, autocorrelation, sampler bias - which are
      IDEA-20260805-15258a's, IDEA-20260816-6f9d8f's and IDEA-20260816-967721's;
      (v) soft-decision OUTER decoding driven by the RELIABILITY measure, which
      the external literature has already taken (eprint 2026/656,
      arXiv:2603.20156) and which is a design improvement rather than a model
      audit. The joint SIGNED continuous vector and its order statistic is the
      lens for this record.
    lossiness: >-
      LOSSY IN A WAY THAT IS EXACTLY MATCHED TO THE TARGET'S OPERATIONS, AND THE
      TEST IS PASSED BY AN ARGUMENT, NOT BY ASSERTION. The underlying state is
      e' in F_2^{17669}, about 17669 bits. The projection keeps 46 real numbers,
      discarding which coordinates were in error, the identity of the runner-up
      codeword, and everything about the 5 truncated trailing coordinates.
      WHAT MAKES THE DISCARD COMPATIBLE: the decoder's next operation - the
      outer Reed-Solomon bounded-distance decode - reads ONLY the per-block
      decoded symbol, and by A18 that is a deterministic function of the SIGN of
      M_j. So the retained part propagates deterministically through the exact
      operation that follows it. IT IS NOT A CHANGE OF COORDINATES, and the
      relevant check is the KN-LIT-7595 one: (Delta, Pi) = (x XOR y, x.y) failed
      because the pair was recoverable as the roots of a quadratic. Here e'
      cannot be recovered from M: the fibre over any margin vector contains an
      astronomically large set of error patterns, since a length-384 block's
      2^384 patterns map onto a single real number, and the map is not injective
      on any block. The discard is genuine, it is enormous, and the retained part
      is still exactly sufficient for the failure event.
      WHY THE SIGN MAY NOT BE DISCARDED, ADDED BY REPAIR 2026-08-24: the further
      projection M_j -> |M_j| = D_j is STRICTLY LOSSIER AND LOSSY IN THE WRONG
      DIRECTION. It discards exactly the bit the outer decoder consumes, so D
      does NOT propagate deterministically through the target's next operation -
      no function of D determines the decoded symbol. Under inventor-protocol
      section 2 the unsigned vector therefore FAILS the lossy-projection test as
      a candidate for this claim, while passing it for a different claim (the
      reliability-based decoding of eprint 2026/656). The original version of this
      record tracked D and asserted M's identity, which is precisely the
      incompatibility the test exists to catch.
      A SECOND, DELIBERATE LOSS: the reduction from M to M_(delta_e+1) discards
      WHICH blocks are bad and keeps only the order. That is the loss the outer
      bounded-distance decoder itself performs, since it corrects any delta_e
      symbol errors regardless of position - so the second projection is not
      merely compatible with the target's operation, it IS the target's
      operation.
    propagation: >-
      One step of the target operation is one inner-block decode, which writes
      one coordinate of the signed vector M. Each such write is the only channel
      through which the shared state (the error vector e' and its total weight W)
      can influence the observation. The propagation law of interest is therefore
      the JOINT law P[M_j < q_u for all j in S], and the measurement decomposes it
      into the independence prediction u^{|S|} times the ratio R_{|S|}(u). That
      decomposition is itself a reported quantity and supplies a cheap internal
      falsifier: if R_k(u) = 1 at every cell, the joint law is the product of its
      marginals at every depth tested, the vector carries nothing the scalar rate
      does not, and the whole reason for tracking the vector rather than the
      indicator disappears.
    survival_score: >-
      Survives exactly two steps and then dissolves in a way that is reported
      rather than hidden. Step one: the inner decode, where the shared error
      vector writes 46 coupled signed margins. Step two: the order statistic,
      where 46 numbers collapse to one. At step three - the outer decode -
      everything collapses to a single bit, and the ratio
      I(shared state ; M) / I(shared state ; failure bit) is the concrete number
      expressing how much survives. The proposal reports the measured
      R_k(u) profile as a function of k, which IS the survival curve: a profile
      that returns to 1 as k grows means the dependence dies before it reaches
      the index delta_e + 1 that matters, and that is the single most likely way
      this record produces a null.

  null_object_control: >-
    THREE ARMS, ALL ON THE IDENTICAL ESTIMATOR CODE PATH AND ALL ON THE SIGNED
    MARGIN, WITH THE FORCED VALUES DERIVED BEFORE THE RUN AND THE VERDICT EMITTED
    ON THE NULL ARMS FIRST.
    NULL-A, CROSS-CIPHERTEXT RE-PAIRING (the primary null). Block j's signed
    margin is drawn from ciphertext pi_j(t) with independent uniform permutations
    pi_j. OBJECT REMOVED: the within-ciphertext coupling. OBJECT PRESERVED, and
    this list matters more than the removal list: every block's marginal signed
    margin law exactly (the multiset of block-j values is unchanged), the sample
    size, the sampler, the decoder, the tie rule, the truncation, the block index
    structure, and the estimated quantiles. FORCED VALUE: R_k(u) = 1 exactly,
    for every k and u, by construction. CAN IT FAIL? YES, and in a way that has
    happened to this program before: if quantile estimation error, the reporting
    floor, or an indexing bug is generating the signal, NULL-A returns something
    other than 1 and no signal cell at that depth is reportable. THE COMPARATOR
    IS GENERATED, SO IT IS A MEASUREMENT AND NEEDS A SAMPLE SIZE: NULL-A is drawn
    at least 16 times with independent permutation families and the INTERVAL is
    reported, never a single draw - this is KN-TECH-1a5b7e mode 5, which cost
    that entry's own campaign a residual it could not resolve, and 16 draws here
    cost one extra pass over an existing table.
    NULL-B, DECODER-FREE STRUCTURAL NULL. Generate signed margin vectors from a
    key-independent process matched to the measured signed marginals with no
    coupling at all, and estimate again. NULL-A and NULL-B must agree within
    their intervals; if they do not, the estimator responds to something other
    than within-ciphertext coupling and no signal number is reportable.
    NULL-C, MAXIMAL REMOVAL. Replace e' by a genuine i.i.d. Bernoulli(p*) vector
    of the same length - the binary symmetric channel SPEC's A5 asserts e'
    behaves like - and run the entire pipeline unchanged, INCLUDING the signed
    margin computation against the known transmitted codeword. FORCED VALUE:
    R_k(u) equals 1 up to the finite-block-length coupling induced by nothing at
    all, i.e. 1. TOTAL REMOVAL MUST BE AT LEAST AS EXTREME AS PARTIAL REMOVAL AND
    ON THE SAME SIDE (KN-TECH-1a5b7e mode 2); if the BSC arm lands on the
    opposite side of NULL-A from the real arm, the statistic is not tracking the
    object.
    NOTE THAT NULL-C IS ALSO THE SHARPEST POSSIBLE STATEMENT OF WHAT A5 CLAIMS,
    so the real-versus-NULL-C contrast is a direct measurement of the combined
    A5+A17 error at deployed parameters, which is a second deliverable from the
    same run.
    RULE-ON-THE-NULL-FIRST: the three-branch verdict of claim (C) is emitted on
    NULL-A, NULL-B and NULL-C before any real cell is read. If it emits the same
    branch on a null arm as on the real arm, it discriminates nothing and is
    rewritten before the real arm is looked at.
    RULE FALSE-POSITIVE RATE, DERIVED BEFORE THE RUN: with a 16-draw min/max
    tolerance interval, applying the OUTSIDE rule leave-one-out to the null
    ensemble's own members must return OUTSIDE for exactly 2 of 16 (one LOW, one
    HIGH) whenever the draws are pairwise distinct, so the honest per-cell
    false-positive rate to quote beside any OUTSIDE verdict is 12.5% in either
    direction and 6.25% one-sided. Cells sharing null draws are NOT independent
    and their rates must not be multiplied into a joint p-value.
    A FOURTH ARM ADDED BY REPAIR 2026-08-24, CHEAP AND DIAGNOSTIC:
    NULL-SIGN, THE OBJECT-CONFUSION CONTROL. Run the identical estimator on the
    UNSIGNED reliability vector D = |M| and report its R_k(u) table beside the
    signed one. THIS ARM HAS NO FORCED VALUE and is not a null in the
    KN-TECH-1a5b7e sense; it is a discrimination check on the record's own
    definition. Its purpose is that any future reader who mistakes D for M - as
    this record's original text did - can see immediately that the two tables
    differ and that the failure event lives only in the signed one. If the two
    tables are numerically indistinguishable at every cell, that itself is
    reportable: it would mean the decoder is essentially never wrong in the
    conditioned region, which bounds the depth at which the measurement can say
    anything about failure at all.

  discriminated_from:
    - >-
      IDEA-20260816-6536d7 DEFINES the signed margin M_j := corr(transmitted) -
      max corr(others) and measures its MARGINAL distribution, using it as a
      variance-reduced estimator of p_i. That is a one-dimensional object
      answering "what is the inner failure rate". This is a 46-dimensional object
      answering "is the joint law the product of its marginals at the depth that
      matters". 6536d7's definition and its estimator are INGREDIENTS here and
      are cited as such - the repair of 2026-08-24 restored 6536d7's definition
      verbatim after this record had corrupted it - and a perfect 6536d7 result
      would leave this question completely open, because a rate says nothing
      about a copula.
    - >-
      IDEA-20260816-208783 / EXP-HQC-982268 / EV-HQC-b71230 measure joint MOMENTS
      of the BINARY block-failure indicator at a REDUCED parameter set. Three
      differences, each material: the observable is binary rather than
      continuous, so the deep tail is inaccessible at any feasible T; the
      parameters are PS-R3 and the evidence record's own boundaries state that no
      cell at true HQC parameters is certified; and the null is a frozen
      independence interval rather than a marginal-preserving re-pairing. The
      committed runs do not record margins at all, so their data cannot answer
      this even in principle.
    - >-
      IDEA-20260808-cbb848 signs A17 ANALYTICALLY by sandwiching a conditional
      term with negative association and computing a mixture term exactly. It
      names the same two mechanisms this record measures, which is a strength of
      both: cbb848 predicts the sign, this measures it, and a disagreement
      between them at deployed parameters would be far more informative than
      either alone. They are complements and neither is a substitute.
    - >-
      IDEA-20260808-9f9ed8 produces a Bonferroni bracket whose OUTER half rests
      on HA-2, a conditional-independence assumption across blocks. This record
      measures HA-2's error directly at deployed parameters. A negative here
      (R = 1) would strengthen 9f9ed8's outer half; a positive would tell it
      exactly how much its bracket must widen.
    - >-
      IDEA-20260816-b68344 derives at zero compute that the untruncated error's
      coordinate covariance is exactly circulant, forcing pairwise block-failure
      probabilities to depend only on block separation and per-block marginals to
      be exactly equal. That derivation is USED here, twice: as a design input
      for choosing the R_2 pairs, and as a precondition check on the measured
      marginals. b68344 predicts a structure; this measures a magnitude in the
      tail, which its covariance argument - a second-moment statement - cannot
      reach.
    - >-
      IDEA-20260816-b336a3 counts BITS of information about a key functional in
      the failure pattern, conditioned on a failure having occurred, at reduced
      parameters where failures are common. This measures a DEPENDENCE RATIO
      among signed margins at deployed parameters where failures never occur,
      conditions on nothing, and involves no key functional. b336a3's estimand is
      an information-theoretic bound on what an adversary could learn; this
      record's is a correction factor to a published DFR bound. Different
      quantity, different regime, different consequence.
    - >-
      IDEA-20260816-3994ef separates "model wrong" from "decoder suboptimal" by
      running a whole-code maximum-likelihood decoder beside the deployed one at
      reduced parameters where full ML is affordable. This record does not
      question the decoder at all - it takes the deployed decoder as the
      definition of the object and asks whether its failure event's joint law is
      the modelled one, at deployed parameters. The two answer different halves
      of the same question and 3994ef's half is not reachable at deployed scale.
    - >-
      eprint 2026/656 and arXiv:2603.20156 build BETTER outer decoders for HQC
      using inner RELIABILITY - i.e. using D_j = |M_j|, this record's SECONDARY
      object, not its headline signed M_j (erasure-assignment and
      generalized-minimum-distance respectively). Those are design proposals that
      change the scheme. This record changes nothing and measures the deployed
      scheme. They are cited because they pre-empt the obvious adjacent proposal,
      because they independently establish that inner reliability is informative,
      and - after the repair - because the signed/unsigned distinction of claim
      (F) is exactly the distinction between their object and this one.

