  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE COULD FOLLOW - this record produces
      no procedure, no query count and no adversary, and its headline observable
      requires the transmitted codeword, which an adversary does not have. The
      MEASUREMENT costs
      O(T . (omega.omega_r . n/64 + n_e . n_2 . log n_2)) word operations, i.e.
      of order 6 x 10^4 per sample and 6 x 10^11 at T = 10^7, dominated by the two
      sparse ring products. Tens of core-hours in C; the estimator itself is
      O(T . n_e log n_e) and is negligible beside generation. Computing the signed
      margin rather than the unsigned one adds one array lookup per block and does
      not change any exponent.
    memory_exponent: >-
      O(T . (n_e + 1)) floats for the signed margin table: about 2 GB at T = 10^7
      in float32, 4 GB in float64; the unsigned table is derived at analysis time
      and costs no additional storage. The 16 null draws are permutations of the
      same table and add O(T . n_e) indices, not a second table. Stated beside
      time because docs/claims-and-verification.md requires it always.
    best_known: >-
      IN THIS REPOSITORY: EV-HQC-b71230's joint-moment table is the nearest
      measured object. It dominates this proposal on trial count for a binary
      statistic (T = 1e7 with independent validator recomputation) and on
      certification, and it is DOMINATED on parameter scale (PS-R3, a reduced set,
      with its own boundaries stating no cell at true HQC parameters is
      certified), on observable richness (binary indicator versus continuous
      signed margin) and on null design (a frozen independence interval versus a
      marginal-preserving re-pairing drawn 16 times). The margin OBJECT itself is
      IDEA-20260816-6536d7's and is not claimed here. EXTERNALLY: eprint 2026/795
      is an analytic model, not a measurement, and this session did not read it;
      whether anyone has measured the joint tail at deployed parameters is
      UNKNOWN HERE and stage 6 is where it gets checked.
    hidden_overhead: >-
      Three honest disclosures. (i) THE EXTRAPOLATION IN k IS WHERE ALL THE
      OPTIMISM WOULD LIVE if it were allowed to, which is why H2 carries a refusal
      condition: a bracket spanning more than 3 orders at k = 16 means no
      DFR-relevant conclusion is reported at all. (ii) The reporting floor limits
      the ladder to depths where the expected count is at least 30, so the deepest
      cell is set by T and not by ambition, and cells excluded by the floor are
      listed. (iii) Quantile estimation error grows like k times the relative
      quantile error, so the deep-k, deep-u corner is the least reliable and is
      reported with its widened interval rather than trimmed.
    tradeoff_note: >-
      The relevant tradeoff is SAMPLE SIZE against TAIL DEPTH, and it is explicit:
      the deepest reportable u scales like 30/(T . 46) per block, so a decade of
      extra depth costs a decade of T. Parallelisation is embarrassing - samples
      are independent - so the wall-clock cost divides by cores exactly, and the
      binding resource is the margin table's memory rather than the compute.

  dominated_by: >-
    n/a (no result claimed on any attack axis). Frontier rows checked, across all
    three axes inventor-protocol section 5 names. TIME: EV-HQC-b71230's committed
    measurement cost is smaller per sample (binary indicator, reduced parameters)
    and it therefore dominates on cost for ITS estimand - but its estimand is a
    different functional of a different joint law and its data cannot answer this
    question even in principle, because margins were never recorded. MEMORY: no
    in-corpus object holds a 2 GB margin table, so nothing dominates. DATA /
    QUERIES: zero queries to any oracle; T = 10^7 self-generated samples, which
    no in-corpus HQC record exceeds at deployed parameters because no in-corpus
    HQC record measures at deployed parameters. ON THE MARGIN OBJECT ITSELF:
    IDEA-20260816-6536d7 owns the definition and the marginal estimand, and this
    record does not dominate it and does not claim it. ON THE QUESTION MEASURED:
    eprint 2026/795 may well dominate ANALYTICALLY - a closed-form model needs no
    samples at all - and that possibility is recorded here rather than discovered
    by a referee. THIS PROPOSAL DOES NOT DOMINATE IT; it measures where that model
    predicts, which is a different and complementary act, and if the two agree the
    program has an independent corroboration at deployed parameters and if they
    disagree the program has the most interesting result in the lane.
  sota_delta: >-
    No attack; measurement contribution only. QUANTITATIVELY: measurements of
    HQC's joint block-failure structure at DEPLOYED parameters in this repository
    before, 0 - EV-HQC-b71230's own boundaries state "NO CELL AT TRUE HQC
    PARAMETERS IS CERTIFIED". After, a (k x u x arm x sampler x tie-rule) surface
    at HQC-1 on the signed margin, plus a secondary surface on the reliability
    measure. Tail depth reachable for the block-failure structure before, of
    order the reduced-parameter failure rate; after, quantile depth 1e-4 per block
    at deployed n_2 = 384, which is roughly three orders deeper than the deployed
    per-block failure probability of about 2^-10.8 and is what the continuous
    observable buys. THE MARGIN OBJECT CONTRIBUTES 0 DELTA - it is
    IDEA-20260816-6536d7's - and the delta claimed here is the JOINT law of it.
    AGAINST THE EXTERNAL STATE OF THE ART: zero delta on every attack axis, and an
    UNKNOWN delta on the measurement axis until eprint 2026/795 is read - which is
    the honest statement and not a hedge.

  estimated_cost:
    implementation: medium
    compute: high

  recommended_priority: high

  honest_prior_of_survival: >-
    BY PART, because a single number would hide where the risk is.
    (i) That the exact identity DFR = P[M_(delta_e+1) < 0] holds for the SIGNED
    margin under the deployed decoder and survives the per-sample consistency
    check: ~0.9. It follows from A18's exactness and from
    IDEA-20260816-6536d7's own statement that F_j = 1{M_j < 0} exactly, and the
    0.1 is the tie rule and the lattice-valued correlation alphabet. NOTE, AFTER
    THE REPAIR: this prior was ~0.9 in the original record too, but it was
    attached to a definition under which the identity was FALSE with probability
    1. The number is unchanged; what changed is that it now attaches to a claim
    that can be true.
    (ii) That the pipeline samples e' at deployed HQC-1 parameters at T = 10^7
    inside a plausible budget: ~0.85.
    (iii) That NULL-A returns 1 at every reported cell, licensing the instrument:
    ~0.75. Quantile estimation error at u = 1e-4 is the risk.
    (iv) That the signal arm departs from NULL-A by the pre-declared 0.02 at
    k = 2, u = 1e-2: ~0.6. Some departure is close to certain in principle - the
    conservation and mixture mechanisms are both real - but their competition
    could cancel to well inside the interval, and cancellation is a perfectly
    plausible outcome that I would not be surprised by.
    (v) That the departure GROWS in k rather than dying, i.e. that it reaches the
    index that matters: ~0.4, AND THIS IS THE PART I WOULD BET AGAINST MOST
    READILY. It is also the part that decides whether the record says anything
    about the DFR.
    (vi) That the W-conditioning arm cleanly attributes the departure to one of
    the two named mechanisms rather than leaving a residual: ~0.5.
    (vii) That stage 6 obtains eprint 2026/795's model and the head-to-head is
    actually run: ~0.55, limited by whether a future session has a PDF renderer,
    which this one did not.
    (viii) That the signed and unsigned tables diverge at some reachable depth,
    i.e. that the signed object is doing work the reliability object cannot at
    the depths measured: ~0.7. Added by repair 2026-08-24; if it fails, the
    measurement is about confidence rather than correctness and says nothing
    about the DFR, which is a distinct and now pre-declared null.
    (ix) That the run produces a defensible number or a defensible obstruction:
    ~0.9.

