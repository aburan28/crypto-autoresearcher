idea:
  id: IDEA-20260808-fa1d80
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-ECDLP-002
  goal_id: GOAL-ECDLP-001
  title: 'Tracked object: the split-quotient certificate. ECDLP is exactly the problem of
    identifying which of the ~N+1 Lagrangian subgroups of (E x E)[N] containing <(P,Q)> yields
    a REDUCIBLE quotient abelian surface, and the Igusa invariant chi_10 is a genuinely lossy,
    computable certificate for it.'
  class: representation
  claim: 'Let G = <P> of prime order N, Q = [k]P, and consider the abelian surface A = E x
    E with its product principal polarisation. The vector v = (P, Q) in (E x E)[N] is isotropic
    for the Weil pairing (e(P,P)e(Q,Q) = 1). Lagrangian subgroups K of (E x E)[N] containing
    v are in bijection with the N+1 isotropic lines of the 2-dimensional symplectic space
    v^perp / <v>. Exactly one of them is the graph K_k = {(R, [k]R) : R in E[N]}, and its
    quotient (E x E)/K_k contains the image of the graph curve, hence is REDUCIBLE (isogenous
    to a product); a generic K gives an irreducible principally polarised abelian surface,
    i.e. a genus-2 Jacobian. Reducibility is decided by the vanishing of the Igusa invariant
    chi_10 of the quotient. THE CLAIM: (i) chi_10 of the quotient is a genuinely lossy projection
    of the ECDLP state — it maps an N-element search space onto a single bit — and it is a
    CERTIFICATE, not a coordinate change, so it passes the lossy-projection test on the "loses
    information" clause; (ii) it FAILS the compatibility clause, because the map K -> chi_10((E
    x E)/K) has no known one-step propagation under any operation that moves K cheaply; and
    (iii) the exact quantity that would make it an attack is a cheap propagation rule for
    chi_10 along the N+1 Lagrangians, which is a concrete, statable, testable object. Filed
    as a representation whose lossy-projection audit is done in the proposal, as the inventor
    protocol requires, and whose negative half is stated before any compute.'
  mechanism: 'The split/non-split dichotomy is the only known invariant that separates the
    graph Lagrangian from its N competitors using ONLY (E, P, Q) and no knowledge of k. It
    is computable in principle: the quotient by an (N,N)-isogeny has theta/Igusa invariants,
    and chi_10 = 0 iff the surface is a product. It converts "find k" into "find the split
    member of an explicit pencil of N+1 quotients", which is a genuinely different search
    than the group-element search rho performs, and is therefore a genuinely different tracked
    object in the sense of docs/inventor-protocol.md sections 1-2.'
  why_not_a_renamed_known_approach: "Not the Kani/SIDH machinery (KN-TECH-026): those RECOVER\
    \ an isogeny from torsion images with degree below the torsion level; here the relevant\
    \ endomorphism [k] has degree k^2 far above N, so the Kani hypothesis fails and the construction\
    \ is used only as a classifier, not as a recovery. Not a pairing attack (RQ-PAIR-21313f):\
    \ no pairing value is used as an oracle and no embedding degree is involved. Not IDEA-20260806-c5d183's\
    \ rigidity target: >-\n  the object lives on Lagrangians of (E x E)[N], not on <P>, so\
    \ the rigidity theorem\nabout maps on the cyclic group does not apply to it — this is\
    \ exactly why it is worth writing down even though its prognosis is poor."
  predictions:
  - observable: chi_10 of the quotient for the graph Lagrangian vs a random Lagrangian
    metric: chi_10 = 0 indicator, at toy N (N in [11, 101]) with quotients computed explicitly
    predicted: exactly zero for K_k and nonzero for all others, at every tested instance;
      any exception falsifies the certificate outright
  - observable: cost of computing one quotient
    metric: field operations to evaluate chi_10((E x E)/K) for one K
    predicted: superpolynomial in log N for prime N, because an (N,N)-isogeny with N prime
      admits no smooth decomposition; this is the operative obstruction and must be measured
      rather than assumed
  - observable: existence of a propagation rule
    metric: whether chi_10((E x E)/K') is computable from chi_10((E x E)/K) and the transition
      K -> K' for adjacent Lagrangians, in polylog time
    predicted: no; the map is expected to be as unstructured as a random function on the N+1
      lines. A positive answer would be an exponent-moving result and is the only outcome
      worth chasing
  minimal_test: 'Toy, N in {11, 13, ..., 101} on small ordinary curves: enumerate all N+1
    Lagrangians containing (P,Q), compute each quotient explicitly (feasible at these N via
    theta or via Mumford/Richelot-style constructions), tabulate chi_10, and (a) confirm the
    certificate fires exactly on K_k, (b) test the tabulated chi_10 values against a random-function
    null for any propagation structure along the natural P^1 parameterisation of the lines.'
  controls:
  - 'Random-function null on the P^1 of Lagrangians: the measured chi_10 sequence must be
    indistinguishable from a random assignment with one planted zero, or the difference is
    the finding.'
  - 'Planted control: run the same enumeration with k known, to verify the certificate implementation
    before any blind run.'
  - 'Null curve: a pair (P, Q'') with Q'' NOT in <P> (so no graph exists); no Lagrangian should
    give a split quotient, which tests the certificate''s specificity.'
  confounders:
  - Reducible quotients can also arise from Lagrangians that are graphs of OTHER isogenies
    between E and E (e.g. via endomorphisms), so chi_10 = 0 may have several solutions; the
    multiplicity must be measured, not assumed to be one.
  - At tiny N the N+1 lines are few and coincidences are likely; the null must be sized accordingly.
  falsification_conditions:
  - chi_10 = 0 for many Lagrangians => the certificate is not specific and the object dies.
  - Quotient computation is confirmed superpolynomial with no propagation structure => the
    object is lossy but incompatible, i.e. it fails the second clause of the lossy-projection
    test, and the record closes with that as the named obstruction.
  - A polylog propagation rule is found => an exponent-moving algorithm follows immediately
    (search the P^1 of lines by any sublinear method), and this becomes a flagship.
  interpretation_limits: Even a perfect certificate gives an N-candidate search, i.e. cost
    N unless propagation or a sublinear search exists; this record does not claim one. Toy-N
    results cannot be extrapolated to crypto N, since the (N,N)-isogeny cost is exactly what
    changes.
  assumptions:
  - 'N prime, N^2 does not divide #E(F_p); (P,Q) isotropic for the Weil pairing.'
  - Igusa chi_10 vanishes exactly on products among principally polarised abelian surfaces.
  heuristic_assumptions:
  - id: HA-1
    statement: For a uniformly random Lagrangian K containing (P,Q), the quotient (E x E)/K
      is an irreducible principally polarised abelian surface with probability 1 - O(1/N).
    rigorous_ingredient: The count of Lagrangians through a fixed isotropic vector is exactly
      N+1, and at most O(1) of them are graphs of isogenies of bounded degree.
    distribution_imitated: '"Genericity of Jacobians in the moduli of principally polarised
      abelian surfaces (chi_10 nonvanishing off the product locus)."'
    validation_route: Toy enumeration as above; count the number of split quotients per instance
      and compare against O(1). Label toy.
    tail_checks: If the number of split quotients grows with N, the certificate is not a bit
      but a set, and the whole framing changes.
  target_complexity:
    time_exponent: 'As stated: N * (cost of one (N,N)-isogeny) — strictly worse than rho,
      and this is disclosed as the record''s own prognosis. The only route to an exponent
      is the propagation rule in prediction 3; without it, no exponent is claimed.'
    memory_exponent: '"O(1) as stated (streaming over the N+1 lines)."'
    best_known_baseline: '"rho N^{1/2}, memory O(1)."'
    hidden_overhead_disclosure: The (N,N)-isogeny for prime N has no smooth decomposition,
      so its cost is the dominant and possibly superpolynomial term; quoting 'polynomial-time
      higher-dimensional isogenies' here would be wrong (see E1-07).
    time_memory_tradeoff: '"n/a at present."'
  sota_delta: 'Negative as an algorithm (cost >= N). Positive as taxonomy: it adds a tracked
    object to the ECDLP object list that KN-OPEN-019 says does not yet exist, with its lossy-projection
    audit completed before any compute, which is what the protocol asks for.'
  dominated_by: 'Pollard rho / vOW at N^{1/2}, memory O(1), dominates it by at least a factor
    N^{1/2}, and BSGS also dominates it. Frontier rows checked: rho/vOW, BSGS, Kuhn-Struik,
    preprocessing frontier, special-curve attacks. Stated plainly: this object is dominated
    today.'
  estimated_cost: '"Implementation high (explicit (N,N)-isogenies and Igusa invariants at
    toy N); compute low."'
  recommended_priority: low
  honest_prior_of_survival: ~0.5 that the certificate is specific (chi_10 fires only on the
    graph). ~0.02 that a propagation rule exists. Priority is low precisely because the prognosis
    is poor, but it is filed because KN-OPEN-019 is open and this is a genuinely new entry
    for it.
  novelty_status: unverified
  novelty_screen: 'Grepped the dedup corpus for "Kani|abelian surface|genus-2|Igusa|theta-null":
    all hits are supersingular-lane. REJECTED_TITLES.txt contains ECDLP-IDEA-015 (compressed
