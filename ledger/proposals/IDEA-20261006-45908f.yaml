idea:
  id: IDEA-20261006-45908f
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: coordinator
  title: >-
    One point of y^2 = x^3 + x + 1 over F_49 has Frobenius orbit
    size 2
  class: control
  claim: >-
    Let E be y^2 = x^3 + x + 1. Let F_49 = F_7[a]/(a^2 - a - 1).
    Let σ be the 7-power Frobenius on coordinates. The claim is
    that a^2 - a - 1 is irreducible over F_7, that E is
    nonsingular over F_7, and that the lexicographically least
    affine point P of E(F_49) that does not lie in E(F_7) satisfies
    σ^2(P) = P and that the set {P, σ(P)} has two distinct points.
    No index-calculus cost is charged, and the rho exponent is not
    claimed to move. If the polynomial is reducible, or no such P
    exists, the claim is false.
  mechanism: >-
    The tracked object is one affine point and its image under the
    base-field Frobenius. The representation is short Weierstrass
    coordinates over the frozen quadratic. The operation is σ, not
    a rho step and not an isogeny. Lossy-projection test: the
    projection keeps the cardinality of {P, σ(P)} and discards the
    coordinates. Many points can share the cardinality 2. One-line
    reason: for a prime extension degree, a point outside the
    subfield has orbit size equal to that degree when σ^n fixes
    it. This record asks only for n = 2 on one point. It does not
    measure a factor-base reduction.
  novelty_status: unverified
  citations:
    - ref: KR-RHO-037e22
      provenance: internal
      claim: >-
        On a binary Koblitz curve, walking on Frobenius classes
        reduces parallel rho by sqrt(2m). This record is in odd
        characteristic and counts one orbit. It does not walk.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-037e22.yaml
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: >-
        A Frobenius-invariant factor base reduces the number of
        decomposition systems by up to 1/n. This record builds no
        factor base and does not claim that factor.
      verified_by: knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        A generic algorithm needs Omega of the square root of the
        group order. An orbit of two points is not a generic
        algorithm.
      verified_by: knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  assumptions:
    - The field polynomial is a^2 - a - 1, and the test checks that it has no root in F_7.
    - Nonsingularity is 4A^3 + 27B^2 nonzero in F_7, with A = 1 and B = 1.
    - A point lies in E(F_7) when both coordinates have zero coefficient on a.
  predictions:
    - metric: cardinality of {P, σ(P)}
      direction: higher
      minimum_effect: exactly 2
    - metric: whether σ^2(P) equals P
      direction: higher
      minimum_effect: equality holds
  minimal_test:
    design: >-
      Confirm a^2 - a - 1 has no root in F_7 and that the curve
      discriminant is nonzero in F_7. Enumerate affine points of
      E(F_49). Order them by (x0, x1, y0, y1) for coordinates
      x0 + x1*a and y0 + y1*a. Skip points with x1 = y1 = 0. Let
      P be the least remaining point. Compute σ(P) = (x^7, y^7)
      and σ^2(P). The claim holds if σ^2(P) = P and P is distinct
      from σ(P). Record the polynomial check, P, and the two
      booleans.
    controls:
      - >-
        σ^2 on a point of E(F_7), the point at infinity excluded,
        must fix that point. A subfield point moved by σ^2 voids
        the Frobenius.
      - >-
        If a^2 - a - 1 has a root in F_7, do not swap in another
        polynomial. The run is void.
      - >-
        The point at infinity is not eligible. Reporting it as P
        voids the run.
    required_metrics:
      - whether the polynomial is irreducible
      - P or the statement that none exists
      - whether σ^2(P) = P
      - the cardinality of {P, σ(P)}
  falsification_conditions:
    - >-
      The polynomial is irreducible, the curve is nonsingular, and
      every affine point of E(F_49) lies in E(F_7).
    - >-
      Such a P exists and either σ^2(P) is not P or the orbit has
      size other than 2.
    - The field polynomial is reducible over F_7.
  confounders:
    - >-
      Treating a subfield point as outside E(F_7) can fake an orbit
      of size 1.
    - >-
      Computing the 49-power map instead of the 7-power map makes
      every rational point look fixed and hides σ(P).
    - >-
      A factor-base cardinality is not this claim. Reporting one
      would be a different experiment.
  interpretation_limits:
    - >-
      An orbit of size 2 does not charge the 1/n factor-base saving
      in KR-IC-b0fcda and does not realise the sqrt(2m) factor in
      KR-RHO-037e22.
    - >-
      One curve over F_49 is not a statement about every subfield
      curve, and n = 2 is not a cryptographic extension degree.
    - >-
      The rho exponent stays 1/2. This record does not run a walk.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On an elliptic curve over F_q, the q-power Frobenius fixes
        E(F_{q^n}) and a point outside every proper subfield has
        orbit size n when n is prime. Here q = 7 and n = 2, so the
        predicted orbit size is 2. No mixing time is claimed.
      rigorous_support: >-
        KR-RHO-037e22, opened in this session, states a sqrt(2m)
        walk factor on binary Koblitz curves and does not exhibit
        this odd-characteristic point. The test checks σ^2(P) = P
        directly. No file opened here proves that E(F_49) properly
        contains E(F_7).
      validation_plan:
        sampling: >-
          The lexicographically least affine point of this one
          curve outside E(F_7). Not a sample of curves.
        comparison: >-
          The orbit cardinality against 2, and σ^2(P) against P.
        tail_check: >-
          If no point lies outside E(F_7), that absence is kept and
          falsifies the claim. It is not dropped.
        parameters: >-
          q = 7, n = 2, polynomial a^2 - a - 1, curve
          y^2 = x^3 + x + 1. No transfer to another extension.
  target_complexity:
    time_exponent: >-
      unchanged at 1/2, from KR-RHO-13bf67. KR-IC-b0fcda places a
      factor up to 1/n on the number of decomposition systems for a
      subfield curve. This record does not build a factor base, so
      it does not realise that factor.
    memory_exponent: >-
      unchanged. The test stores the affine points of one curve
      over a field of 49 elements.
    best_known: >-
      KR-RHO-037e22 for the Koblitz Frobenius-class factor and
      KR-IC-b0fcda for the invariant factor base. Neither row is
      improved.
    hidden_overhead: >-
      None. No o(1) in an exponent is claimed. An orbit cardinality
      is an integer.
    tradeoff_note: >-
      No time-memory tradeoff. Two stored points do not replace a
      distinguished-point table.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-037e22
      - KR-IC-b0fcda
      - KR-RHO-13bf67
    nearest:
      - ref: KR-IC-b0fcda
        provenance: internal
        relation: adjacent
        delta: >-
          That row reduces the number of decomposition systems by
          up to 1/n for a Frobenius-invariant factor base. This
          record's output is one orbit cardinality, predicted
          equal to 2, at q = 7 and n = 2. The exponent delta is
          zero. Shared factor bases: 0.
      - ref: KR-RHO-037e22
        provenance: internal
        relation: orthogonal
        delta: >-
          That row is a sqrt(2m) iteration factor on binary Koblitz
          curves. This record uses odd characteristic and counts
          points, not iterations. Shared binary curves: 0. The
          exponent delta is zero.
      - ref: KR-RHO-13bf67
        provenance: internal
        relation: adjacent
        delta: >-
          The row's exponent is 1/2 for a generic discrete
          logarithm. This record changes that exponent by 0.
    searched:
      corpus_grep:
        - question_id RQ-FROB-7d8dd4 in ledger/proposals
        - a^2 - a - 1
        - orbit size 2 on F_49
      web: []
      blocked:
        - No web fetch in this session.
  dominated_by: >-
    Checked KR-RHO-037e22, KR-IC-b0fcda, and KR-RHO-13bf67, all
    opened. Pollard rho at exponent 1/2 dominates any reading of
    this orbit as a discrete-logarithm algorithm. The sqrt(2m)
    Koblitz factor and the 1/n factor-base factor dominate any
    reading of it as a speedup. An orbit of size 2 does not beat
    those rows.
  sota_delta: >-
    Zero change to the 1/2 exponent, zero change to the sqrt(2m)
    factor, and zero change to the 1/n factor-base factor. The
    predicted gap is an orbit cardinality of exactly 2 against a
    cardinality other than 2, on one curve over F_49.
  proof_search_map:
    not_applicable_reason: >-
      This is an orbit count on one curve over a field of 49
      elements. It does not propose a theorem on Frobenius
      speedups, a factor-base cost, or a closure of subfield index
      calculus.
