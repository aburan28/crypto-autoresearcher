idea:
  id: IDEA-20260820-a0649e
  question_id: RQ-SQISIGN-001
  added: 2026-08-20
  title: Conditional-independence graph audit of serialized SQIsign transcripts
  class: structured transcript distinguisher
  claim: >-
    Real signing and genuine simulation should satisfy the same public
    conditional-independence relations among decompressed algebraic fields,
    serializer branches, challenge features, and verifier outcomes. A
    graph-structured audit may localize mismatch missed by pairwise tests. This
    is an unverified toy proposal, not evidence of key leakage.
  mechanism: >-
    Derive a public dependency graph from the specified sampling and
    serialization order, separating deterministic verifier edges from claimed
    conditional independences. For each missing edge X-Y given Z, run a
    cross-fitted conditional randomization test under real and simulated laws.
    Aggregate only preregistered residuals. The earliest replicating residual in
    protocol order localizes the public interface where factorization diverges.
  novelty_status: unverified
  status: proposed
  source_refs:
    - id: RQ-SQISIGN-001
      provenance: internal
      use: transcript versus simulator scope
    - id: KN-TECH-057
      provenance: internal
      use: full cost and transcript-processing baseline
    - id: KN-TECH-058
      provenance: internal
      use: current Fp2 unconditional and conditional caveats
    - id: EXP-SSI-7c41d9
      provenance: internal
      use: three-replicate qualified true-simulator precedent; unarchived
    - id: IDEA-20260815-56f047
      provenance: internal
      use: nearest pathwise localization proposal
    - id: KN-LIT-1248
      provenance: kb
      use: unreviewed structural pointer, not graph support
  predictions:
    - A true-simulator/null split yields calibrated edgewise tests and no held-out residual beyond the error budget.
    - A planted marginal-preserving dependency between one challenge feature and one serializer branch produces a localized residual increasing with epsilon.
    - Any real/sim factorization mismatch is stable under alternate feature encodings and held-out seeds.
  controls:
    true_simulator_null: genuine simulator compared with an independent genuine-simulator sample through identical serialization
    planted_positive: marginal-preserving planted edge between a challenge feature and serializer branch
    nearby_object: field-permuted transcripts preserving univariate marginals and public stratum sizes
    parser: byte-exact round trip and deterministic-field checks before statistics
  falsification_conditions:
    - The genuine-simulator null is uncalibrated.
    - The marginal-preserving planted edge is not detected at preregistered power.
    - Every real/sim edge residual disappears under cross-fitting and held-out replication.
  confounders:
    - deterministic edges mistakenly tested as stochastic
    - sparse conditional strata and nuisance-model misspecification
    - parser or decompressor disagreement
    - feature encoding chosen after seeing evaluation residuals
  interpretation_limits:
    - Graph agreement does not establish equality outside tested variables and conditional models.
    - A positive edge is not a recovered secret or certified ideal.
    - Null scope is the declared graph, encodings, sample size, and parameters.
  heuristic_assumptions:
    - H-CIG-1: the public dependency graph correctly reflects the specification at tested scale.
    - H-CIG-2: cross-fitted conditional randomization controls type-I error in sparse strata.
  target_complexity:
    objective: localize conditional factorization mismatch; no recovery or attack exponent
    unconditional_fp2: p^(1/2)*(log p)^O(1) time, polynomial memory
    conditional_fp2: p^(1/3+o(1)) time and memory under Heuristic 1, superpolynomial hidden overhead
    conditional_fp: retain a distinct field-sensitive KN-TECH-057 row
    success_accounting: charge edge multiplicity, conditional fitting, parser exclusions, and inverse power
  cost_model:
    time: O(E*N*C_crt) for E tested edges and randomization cost C_crt
    memory: O(N*k) retained cross-fit features or O(E*S) summaries
    data_or_queries: N real, N true-simulator, and N planted-control transcripts per replication
    preprocessing: derive and freeze graph, encodings, strata, and deterministic-edge exclusions
    success_retries: at least three seeds, K folds, and sparse-stratum reruns charged
    verification: independent graph derivation, byte-round-trip audit, and residual recomputation
  proof_search_map:
    exact_baseline_reproduction: reproduce parser, decompressor, simulator null, and KN-TECH-057 rows
    observation_collision_search: find transcripts with identical graph observables and distinct conversion witnesses
    quantifier_order: freeze graph and tests before sampling; fit nuisance models on disjoint folds
    method_ceiling: graph agreement cannot imply full distributional equality
    nearby_object_control: marginal-preserving permutation tests spurious power from univariate imbalance
  nearest_neighbors:
    - id: IDEA-20260815-56f047
      discriminator: audits conditional-independence edges across algebraic and serialization interfaces rather than conversion-path divergence
    - id: IDEA-20260801-020
      discriminator: tests a preregistered dependency graph with marginal-preserving controls rather than generic independence
  dominated_by: n/a (no result claimed)
  sota_delta:
    time_exponent: 0
    memory_exponent: 0
    data_or_queries: three N-transcript suites per replication plus cross-fit training
    quantitative_statement: no SOTA improvement; proposed delta is interface-level diagnostic resolution
  recommended_priority: medium
  recommended_cost: medium because E conditional tests multiply transcript cost
  recommended_prior: 0.20 probability of a stable localized edge residual at toy scale
  recommended_provenance: idea-generator judgement; unverified

