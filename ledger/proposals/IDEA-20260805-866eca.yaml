idea:
  id: IDEA-20260805-866eca
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-001
  added: '2026-08-05'
  title: >-
    The matched null for the only structure-dependent number GOAL-MLKEM-001 ever
    had: the 0.0-0.8 bit "isometric MLWE gain" is a difference of two seedless
    randomized optimizer outputs, and its own archive says so

  class: control

  claim: >-
    Across six batches GOAL-MLKEM-001 produced exactly one quantity that
    purported to depend on ML-KEM's ring structure: the matched gap between the
    unstructured-LWE and isometric-MLWE columns of the corrected code-based dual
    estimates, recorded as C0 0.0/0.0/0.1, CC 0.2/0.0/0.6, CN 0.3/0.8/0.1 bits at
    ML-KEM-512/768/1024, and summarised as "the maximum matched structure gain is
    0.8 bit, not the published 2-3 bits". That gap has NEVER been run against a
    null of its own shape, and the archive that carries it records, in its own
    caveat field, that the outputs it is differenced from "contain repeated
    optimizer results and randomized polar-code data without recorded seeds" and
    that "raw precision is not treated as reproducible accuracy". A difference of
    two seedless randomized outputs is not a measurement of anything until the
    same-arm, different-randomization spread has been measured -- and it never
    was. This proposal derives, before any run, two consequences that the
    archived decimals must satisfy IF the gap is a structural effect, shows that
    the archived decimals already violate one of them, and specifies the
    two-cell null that decides it. FORCED VALUE, DERIVED HERE: the negacyclic
    isometry group has order 2n = 512 independent of the module rank k, so a gain
    arising from it must be approximately RANK-INVARIANT at fixed cost label; the
    archived CN gaps are 0.229 / 0.738 / 0.127 at k = 2/3/4, non-monotone with a
    5.8x spread. SECOND FORCED VALUE: the C0 column is bit-identical to ten
    decimal places at ML-KEM-512 and ML-KEM-768 between the two arms, which means
    the optimizer selected the same interior parameters, and any cost label that
    is a deterministic function of those same parameters must therefore ALSO be
    identical -- yet CN differs by 0.738 bits at exactly the parameter set where
    C0 differs by 0.000000000. Either an extra randomized ingredient enters CN
    and CC but not C0, which is precisely the seedless polar-code data the
    archive warns about, or the arms are not matched. Both readings are
    reportable, both are cheap to separate, and neither has ever been written
    down.

  object_first_candidate:
    tracked_object: >-
      THE GAP ITSELF, Delta(label, k) = cost_unstructured(label, k) -
      cost_isometric(label, k), tracked as an object in its own right through
      the three cost labels and the three module ranks, with its own null
      distribution. Not the attack, not the estimator, not the secret: the
      difference statistic, treated the way this program treats any other
      measured statistic -- as an artifact until a matched null says otherwise
      (inventor protocol section 3).
    established_families_off_limits: >-
      Off-limits as the primary lens: primal/uSVP, dual-sieve score statistics
      and their tails, hybrid MITM, decryption failures and CCA oracles,
      implementation side channels, class-group/PIP routes, algebraic attacks,
      and any proposal to build a new attack at all. This proposal proposes no
      attack. It audits one number that three prior records treat as settled.
    newness_score: >-
      Genuinely unattacked in this corpus. The number has been quoted in
      EV-MLKEM-001, EV-MLKEM-002 and the BATCH-002 archive; the corpus-wide
      controls census the session brief reports (39 of 1694 run directories are
      controls; 166 of 229 evidence records carry no null anywhere) predicts
      exactly this gap, and it is present. What is new is not a technique but
      the act: run the identical measurement on a null object of the same shape
      and report the RATIO rather than the raw statistic.
    testability_score: >-
      The cheapest gate is ZERO COMPUTE and is already decisive on internal
      consistency: it is arithmetic on ten-decimal numbers that are already
      committed in this repository. The second gate needs the pinned
      lattice-estimator and is infrastructure-gated; the third needs the
      external Hou-Jiang repositories and may be unreachable, which must be
      reported as infrastructure and never as evidence.
    survival_score: >-
      The gap survives as an object precisely as long as it is not differenced
      across labels or across randomizations. Its fragility IS the finding: a
      statistic that cannot survive its own null is not a small effect, it is
      not an effect.

  mechanism: >-
    DERIVED IN THIS RECORD from numbers READ THIS SESSION in
    coordination/goals/GOAL-MLKEM-001/batches/BATCH-002/tasks/TASK-20260722-206/cost_baseline_report.yaml
    (an archived in-repo task artifact of this goal's BATCH-002). Every external
    attribution -- Ogilvie, Hou-Jiang, Carrier, MATZOV, Wu-Xu, the source ids
    S08/S09/R01/R02 -- is NOT READ, RELAYED through that artifact. No page,
    theorem or table number from any external paper is asserted anywhere here.

    THE ARCHIVED NUMBERS. raw_repository_outputs, ten decimal places:
      unstructured  C0: 121.8739039065 / 173.0147334810 / 237.4610475866
      isometric     C0: 121.8739039065 / 173.0147334810 / 237.3688668105
      unstructured  CC: 139.3027469708 / 194.7388243958 / 259.6029042249
      isometric     CC: 139.1190879063 / 194.7194941097 / 258.9961181565
      unstructured  CN: 134.7524036216 / 189.4790954189 / 254.1848102613
      isometric     CN: 134.5237207556 / 188.7412506867 / 254.0576918916
    Differences, computed this session:
      C0: 0.0000000000 / 0.0000000000 / 0.0921807761
      CC: 0.1836590645 / 0.0193302861 / 0.6067860684
      CN: 0.2286828660 / 0.7378447322 / 0.1271183697
    The archive's own caveat on these same numbers, quoted: "Output files
    contain repeated optimizer results and randomized polar-code data without
    recorded seeds. The rounded Hou-Jiang table is the stable publication claim;
    raw precision is not treated as reproducible accuracy." And its disputed
    values entry D03: "Ogilvie rotation code passed nfft instead of beta1 to
    lambda_2 ... status fixed_and_author_confirmed ... effect: published 2-3-bit
    MLWE gap shrinks to 0-0.8 bit."

    DERIVATION 1 -- RANK INVARIANCE IS FORCED. The negacyclic isometry group of
    R = Z_q[X]/(X^n + 1) is generated by multiplication by X and by negation and
    has order 2n = 512. Multiplying an MLWE relation b = As + e by X^j yields
    X^j b = A(X^j s) + X^j e, a valid relation with secret X^j s, for EVERY
    module rank k. So the number of free equal-norm targets an isometry-aware
    attack gains is 2n, independent of k. Whatever function converts "2n extra
    targets, no extra samples" into bits, it is a function of 2n and of the
    attack's own internal parameters, NOT of k except through those parameters,
    which vary smoothly. THEREFORE, at a fixed cost label, Delta should be
    approximately constant in k, or at worst monotone and slowly varying. It is
    neither: CN gives 0.229 / 0.738 / 0.127 at k = 2/3/4, a 5.8x spread with a
    maximum in the middle. CC gives 0.184 / 0.019 / 0.607, a 31x spread, also
    non-monotone. This is the classical artifact tell in its exact form -- a
    quantity that fails to behave as the parameter it should depend on is varied.

    DERIVATION 2 -- THE LABEL CONTRADICTION IS FORCED AND IS SHARPER. C0 (core-SVP
    abstraction), CC (classical-circuit) and CN (classical nearest-neighbour) are
    three costings of ONE optimizer run, as the archive's own cost_model_legend
    describes them. If the isometry feature changed the optimizer's chosen
    interior parameters (block size, sample count, guessing dimension), C0 would
    move, since C0 is the leading function of the block size. At ML-KEM-512 and
    ML-KEM-768 the two arms agree in C0 to TEN DECIMAL PLACES -- 0.0000000000 --
    which is not "close", it is the signature of an identical interior parameter
    choice. But CN then differs by 0.2287 and 0.7378 bits at those same two
    parameter sets. A deterministic function of identical inputs cannot produce
    different outputs. So at least one of the following holds, and the audit's
    job is to say which: (A) CC and CN consume an additional randomized input
    that C0 does not -- the seedless polar-code sampling the archive itself
    names -- in which case the CC and CN gaps at 512 and 768 are randomization
    noise and the "0.8 bit maximum structure gain" is an upper bound on noise,
    not on structure; (B) the two arms differ in an input other than the
    isometry feature, in which case they are not matched and no gap may be
    attributed to structure at all; (C) C0's ten-decimal agreement is an artifact
    of rounding or of a shared code path, in which case the agreement carries
    less information than argued here and derivation 2 is weakened -- this is
    the branch that would falsify the argument, and it is named in advance.

    DERIVATION 3 -- THE ONLY NULL THAT SETTLES IT, AND ITS FORCED VALUE. Run the
    SAME arm twice with different randomization and nothing else changed. Call
    the resulting same-arm spread sigma_null. FORCED VALUE UNDER THE STRUCTURAL
    READING: sigma_null must be small compared with the gap, and the pre-declared
    threshold is sigma_null < 0.1 bit, one order below the 0.8-bit headline.
    FORCED VALUE UNDER THE NOISE READING: sigma_null is of order the gap itself,
    0.1-0.8 bit. These are disjoint, both are reachable, and the null CAN FAIL in
    either direction -- which is what makes it a null and not a decoration. The
    same run also yields the C0 same-arm spread, which under both readings should
    be ZERO if C0 is deterministic given the interior parameters; a nonzero C0
    spread would falsify derivation 2's premise directly.

    WHAT THE AUDIT CANNOT DO. It cannot compute the true structural gain. If the
    noise reading wins, the honest output is that the corpus does not know the
    gain to better than sigma_null bits and that the sentence "the maximum
    matched structure gain is 0.8 bit" must be rescoped to "the observed
    difference is 0.8 bit and is not separated from run-to-run randomization".
    That is a rescoping of a measurement, not a claim that the gain is zero.

  novelty_status: unverified

  literature_context:
