  lossy_projection_identifiability_audit:
    projection: >-
      (full optimizer state: interior parameters, code choices, randomization,
      cost model) --> the single scalar Delta = cost_unstructured -
      cost_isometric, per (label, k).
    what_is_discarded: >-
      Everything that produced the two numbers: which block size was chosen,
      which polar code was drawn, which randomization seed was used (there was
      none recorded), whether the two arms shared a code path.
    why_genuinely_lossy: >-
      Extremely lossy, and that is the problem the audit exists to expose rather
      than a virtue to be claimed. The fibre over "Delta = 0.738 bits" contains
      both "the ring structure is worth 0.738 bits" and "two draws of an unseeded
      polar code differ by 0.738 bits". THE OBSERVATION COLLISION IS THE ENTIRE
      POINT: two ground-truth situations, one on each side of the claimed
      conclusion, share the observable exactly.
    why_compatible_with_the_operations: >-
      Compatible in the weak sense that differences of costs compose additively,
      which is exactly why the corpus has been differencing them; and INCOMPATIBLE
      in the sense that matters, because the archive's own cost_model_legend
      forbids subtraction across labels and the arms may not be matched within a
      label either.
    is_it_only_a_change_of_coordinates: >-
      Neither classical failure, and the third one. It is not the (Delta, Pi)
      char-2 failure (a great deal is discarded, irreversibly). It is not the
      mirror failure of a constant projection (the values differ across cells).
      It is the failure the lossy-projection test is NOT designed to catch and
      the matched null is: a projection whose fibre contains the null hypothesis
      and the alternative simultaneously. FAILURE MODE CHECKED FOR: identifiability.
      RESULT OF THE CHECK: a collision is exhibited above, at ML-KEM-768 CN,
      where the same observable is produced by C0-identical interior parameters.

  assumptions:
    - >-
      That the three labels C0, CC, CN in the archived report are three costings
      of one optimizer run rather than three independent optimizations. THE
      ARCHIVE'S LEGEND IS CONSISTENT WITH EITHER READING AND THE AUDIT MUST
      SETTLE IT AT STAGE 0 BY READING THE CODE, because derivation 2 depends on
      it entirely. If they are three independent optimizations, derivation 2 is
      void and only derivation 1 (rank invariance) survives -- a weaker but still
      live argument. This is the most likely single failure of the proposal as
      written and it is named here rather than discovered later.
    - >-
      That "unstructured_LWE" and "isometric_MLWE" in the archive denote two
      runs of the same code differing only in the isometry feature. If they
      denote different codebases the gap is meaningless and that is itself the
      finding.

  proof_search_map_note: >-
    The four-audit proof_search_map is carried on the paired hypothesis
    H-MLKEM-cad0a5.

  predictions:
    - metric: >-
        rank_invariance_spread: max_k Delta(label, k) / min_k Delta(label, k) at
        fixed cost label, computed from the archived ten-decimal outputs
      direction: lower
      minimum_effect: >-
        Under the structural reading, at most 2.0 (the isometry group order is
        rank-independent, so the gain should be nearly flat in k). ALREADY
        COMPUTED FROM COMMITTED NUMBERS THIS SESSION: CN 0.7378/0.1271 = 5.80,
        CC 0.6068/0.0193 = 31.4. Both exceed 2.0. This prediction is therefore
        already violated by archived data, which is why the proposal exists; the
        experiment re-derives it under a frozen protocol so it becomes citable.
    - metric: >-
        label_consistency: |Delta(CN, k) - Delta(C0, k)| at the parameter sets
        where Delta(C0, k) = 0.0000000000 exactly
      direction: lower
      minimum_effect: >-
        EXACTLY 0.0 under the hypothesis that all three labels are deterministic
        functions of one optimizer's interior parameters. OBSERVED IN THE
        ARCHIVE: 0.2287 at ML-KEM-512 and 0.7378 at ML-KEM-768. A nonzero value
        forces at least one additional input into CC/CN, and the audit's job is
        to name it.
    - metric: >-
        sigma_null: standard deviation of the C0/CC/CN outputs across >= 10
        repeat runs of the SAME arm with different randomization and no other
        change
      direction: different
      minimum_effect: >-
        NO VALUE IS PREDICTED -- this is the number the audit exists to obtain
        and predicting it would be the forced-quantity error. The DECISION RULE
        is frozen here instead: sigma_null(CN) < 0.10 bit at every parameter set
        supports the structural reading; sigma_null(CN) >= 0.30 bit at any
        parameter set means the 0.738 gap is inside the noise and the
        "maximum matched structure gain is 0.8 bit" sentence must be rescoped;
        anything between is reported as indeterminate at this budget.
    - metric: >-
        sigma_null(C0): same-arm spread of the C0 column alone
      direction: lower
      minimum_effect: >-
        EXACTLY 0.0. Forced: if C0 is a deterministic function of the interior
        parameters and the randomization does not change them, repeats must be
        bit-identical. A nonzero C0 spread falsifies derivation 2's premise
        directly and is the cheapest available refutation of this proposal.
    - metric: >-
        primary_verifiability: number of the archived external attributions
        (Ogilvie, Hou-Jiang, Carrier, Wu-Xu, and source ids S08/S09/R01/R02)
        for which a primary record could actually be retrieved at stage 0
      direction: higher
      minimum_effect: >-
        Reported as a count out of the total, with the endpoint tried for each.
        No threshold. The point is that the number is currently unknown and every
        downstream citation in this corpus has been written as if it were the
        total.

  minimal_test:
    design: >-
      Three stages, cheapest first, and STAGE 1 CAN TERMINATE THE WHOLE LINE.
      STAGE 0 (zero compute, ~1 h): read the archived report and, where
      reachable, the pinned repositories, to settle the two assumptions above --
      are C0/CC/CN three costings of one run, and do the two arms differ only in
      the isometry feature. Record which primary sources could and could not be
      retrieved, with the endpoint tried.
      STAGE 1 (zero compute, minutes): recompute the nine differences from the
      committed ten-decimal outputs; evaluate rank_invariance_spread and
      label_consistency; freeze the decision rule. If stage 0 shows the labels
      are independently optimized, derivation 2 is withdrawn here and the package
      proceeds on derivation 1 alone.
      STAGE 2 (infrastructure-gated): obtain a runnable arm and measure
      sigma_null over >= 10 repeats. Preference order, declared in advance:
      (a) the external pinned repositories, if retrievable; (b) the in-repo
      sage-free lattice-estimator harness with its own known-answer control run
      and its output pasted verbatim, used as a SURROGATE arm whose surrogacy is
      declared in every sentence that cites it; (c) neither, in which case the
      package reports stages 0-1 and records an infrastructure outcome. A failure
      to obtain (a) or (b) is an INFRASTRUCTURE OUTCOME AND IS NEVER EVIDENCE
      ABOUT ML-KEM (AGENTS.md rule 5).
    controls:
      - >-
        NULL-SAME-ARM (the matched null; same shape, same everything). Ten or
        more repeats of ONE arm with only the unrecorded randomization varying.
        FORCED VALUES DERIVED BEFORE THE RUN: sigma_null(C0) = 0.0 exactly;
        sigma_null(CN) either < 0.10 (structural reading) or >= 0.30 (noise
        reading). THIS NULL CAN FAIL IN BOTH DIRECTIONS and its two outcomes
        lead to different, both-publishable conclusions.
      - >-
        POSITIVE CONTROL, PLANTED-GAIN (the effect MUST appear). Construct an arm
        in which the number of usable targets is doubled by a change that is NOT
        the isometry -- for example by supplying twice the sample budget -- so
        that a gain of the order of one bit MUST be produced. If the instrument
        does not show a gain there, it cannot see gains of this size at all and
        NO negative result about the isometry gap may be reported. This is the
        sensitivity demonstration the corpus-wide census says 188 of 229 evidence
        records lack.
      - >-
        GRADED CONTROL, >= 3 interior points, monotonicity reported. Sweep the
        planted gain over 4 levels (1.00x, 1.25x, 1.50x, 2.00x sample budget) and
        report whether the measured gain is monotone in the level and how it
        compares with sigma_null at each. This localises the instrument's
        detection floor instead of leaving "we could not tell".
      - >-
        ORDERING CONTROL. sigma_null and the positive control are measured, and
        their results hash-committed, BEFORE the isometry arms are looked at.
        The frozen decision rule is executed on the null first; if it emits the
        same verdict on the null as on the treatment it discriminates nothing
        and must be rewritten before the treatment is read.
      - >-
        ARCHIVE CHECK (zero compute). Enumerate every prior null run against any
        estimator output in this corpus. Recorded expectation: none is known to
        the author of this record, and that absence is reported as an absence,
        not as a passed check.
    required_metrics:
      - the nine differences recomputed from the committed decimals, to 10 places
      - rank_invariance_spread and label_consistency per label
      - sigma_null per label per parameter set, with the repeat count and what
        was varied
      - the positive control's measured gain at each of the 4 graded levels
      - the retrieval log for every external attribution, with the endpoint tried
      - the known-answer control's verbatim output if the surrogate arm is used

  falsification_conditions:
    - >-
      sigma_null(C0) is nonzero. Derivation 2's premise fails, the label
      contradiction dissolves, and the proposal's sharpest argument is withdrawn.
    - >-
      Stage 0 establishes that C0, CC and CN are independently optimized. Same
      consequence: derivation 2 is void, and only rank invariance survives.
    - >-
      sigma_null(CN) < 0.10 bit at every parameter set AND the planted positive
      control fires. The gap is then a real effect at the 0.1-bit resolution,
      the noise reading is refuted, and the corpus's 0.8-bit sentence stands as
      written -- a clean negative for this proposal and a real strengthening of
      an existing record.
    - >-
      The planted positive control does not fire. Nothing negative may be
      reported at all.
    - >-
      A reviewer exhibits a mechanism by which the isometry gain is legitimately
      rank-DEPENDENT with a 5.8x spread. Derivation 1 is then wrong; the audit
      wants that mechanism named, because it would be a genuine structural
      finding about the attack.

  confounders:
    - >-
      SECOND-HAND EVERYTHING. The nine decimals are read from one archived task
      artifact. If that artifact transcribed them wrongly, every argument here is
      about a transcription. Stage 0 exists to check the transcription against a
      primary source and must report failure to do so as failure, not as absence
      of a problem.
    - >-
      ROUNDING. The published Hou-Jiang table is rounded to one decimal and the
      archive says the rounded table, not the raw decimals, is the stable claim.
      The ten-decimal agreement in C0 could in principle be an artifact of how
      the raw file was produced. This is falsification branch (C) above and it is
      the most likely way derivation 2 dies.
    - >-
      SURROGATE DRIFT. If stage 2 uses the in-repo sage-free estimator as a
      surrogate arm, it is measuring the noise of a DIFFERENT optimizer. That
      measurement bounds nothing about the Hou-Jiang code and every sentence
      citing it must say so. The surrogate's value is that a nonzero surrogate
      sigma_null establishes that estimator pipelines of this shape CAN carry
      randomization noise of the observed size; it cannot establish that this one
      did.
    - >-
      REFUTATION IS CHEAP AND READS AS RIGOUR. Attacking someone else's number
      costs less than producing one. The positive control and the two-sided
      decision rule exist precisely so that the noise reading has to be earned.

  interpretation_limits:
    - >-
      NOTHING HERE IS AN ATTACK, AND NOTHING HERE SAYS THE ISOMETRY GAIN IS
      ZERO. The strongest available negative outcome is: the corpus does not
      know the gain to better than sigma_null bits, and the sentence "the maximum
      matched structure gain is 0.8 bit" must carry that resolution. Rescoping a
      measurement is not refuting a mechanism.
    - >-
      NO STATUS CHANGE to EV-MLKEM-001, EV-MLKEM-002, IDEA-20260722-001,
      GOAL-MLKEM-001 or any external claim is proposed or implied. If the noise
      reading wins, the correct instrument is a NEW superseding record, never an
      edit (AGENTS.md rule 4).
    - >-
      The audit says nothing about ML-KEM's security. A 0.8-bit quantity at
      139 bits is not a security question either way; the reason it matters is
      that it is the ONLY structure-dependent number this goal produced, and a
      campaign that never measures its own only signal against a null has not
      measured it.
    - >-
      Claim tier: derivation for stage 1, and for stage 2 the tier of whatever
      arm was actually run -- which for the surrogate is toy and must be labelled
      toy no matter that its inputs are FIPS 203 parameters.

  heuristic_assumptions:
    - id: H1
      statement: >-
        FORALL cost labels L and FORALL module ranks k in {2,3,4}, if the
        isometric gain arises from the negacyclic isometry group, then
        Delta(L, k) is approximately independent of k, because the group has
        order 2n = 512 for every k.
      rigorous_support: >-
        The group-order computation is exact and elementary (multiplication by X
        and negation generate a group of order 2n acting on R^k for every k, and
        it maps MLWE relations to MLWE relations). What is HEURISTIC is the step
        from "the number of free targets is rank-independent" to "the resulting
        bit gain is rank-independent": the conversion passes through the attack's
        interior optimum, which does vary with k. The heuristic asserts that the
        variation is smooth and small, not that it is absent.
      validation_experiment_ids: [EXP-MLKEM-9fc13b]
      falsification_condition: >-
        A named mechanism by which the bit gain from a fixed-size target orbit
        varies non-monotonically by 5.8x across k = 2, 3, 4. If such a mechanism
        exists the heuristic is refuted and derivation 1 must be withdrawn.
    - id: H2
      statement: >-
        C0, CC and CN are three deterministic costings of one optimizer run, so
        that identical C0 outputs imply identical interior parameters.
      rigorous_support: >-
        NONE. This is an assumption about code the author of this record has not
        read, and it is stated as the proposal's weakest link. The archive's
        cost_model_legend is consistent with it but does not establish it.
      validation_experiment_ids: [EXP-MLKEM-9fc13b]
      falsification_condition: >-
        Stage 0 code reading shows independent optimizations per label, or
        sigma_null(C0) is measured nonzero.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED. The audited quantity is 0.0-0.8
      bit against totals of 121.9-259.6 bits, i.e. at most 0.6 per cent of one
