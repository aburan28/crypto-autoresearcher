  honest_prior_of_survival: >-
    0.65 that the noise reading wins, i.e. that sigma_null is large enough to
    swallow the 0.6-0.8 bit gaps. It is that high and not higher because the
    archive itself warns that the raw decimals are not reproducible accuracy and
    names unseeded polar-code randomization as the cause, because the observed
    gaps are non-monotone in k in a way a fixed-order isometry group does not
    predict, and because a 0.7378-bit CN difference coexists with a
    0.0000000000-bit C0 difference at the same parameter set. It is not higher
    than 0.65 because H2 is an unverified assumption about unread code, because
    rounding could explain the ten-decimal C0 agreement, and because the
    published rounded table -- which the archive calls the stable claim -- may
    have been produced with more care than the raw files. Separately: 0.95 that
    stage 1 reaches a decisive internal-consistency reading, because it is
    arithmetic on committed numbers; about 0.35 that stage 2 obtains a genuine
    (non-surrogate) arm, because it needs external repositories over a network
    whose ePrint PDF endpoint is already known to return 403.
