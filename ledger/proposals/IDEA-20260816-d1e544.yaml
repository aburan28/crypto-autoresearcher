idea:
  id: IDEA-20260816-d1e544
  question_id: RQ-WFS-e776b6
  added: '2026-08-16'
  title: 'Count the per-layer soundness loss of recursive composition as an integer ledger rather
    than a proof sketch: build a toy protocol that verifies its own predecessor for L layers, measure
    the attained cheating advantage exhaustively at each L, and report the measured compounding against
    the product the layered accounting charges'
  class: composition
  claim: '(A) Recursive composition is where a per-layer soundness loss compounds: a layer-L argument
    attests that a layer-(L minus 1) verifier accepted, and each layer contributes its own soundness
    error plus whatever loss the embedding of the inner verifier into the outer statement adds. The
    accounting is normally a product or a sum written once and then trusted; the number it produces
    at a named L is rarely computed against a measured advantage. (B) For a toy protocol whose single-layer
    cheating advantage is exactly computable by enumeration, and whose verifier is small enough to
    be expressed as a statement of the same protocol, the L-layer attained advantage is measurable
    for L equal to 1, 2, 3 and 4 by enumerating the composed strategy space at each layer or, where
    that is infeasible, by an exhaustively optimal per-layer prover with a declared composition rule.
    The deliverable is the integer ledger: measured advantage per L, the accounting''s predicted product
    per L, and the signed bit residual between them, at named parameters. (C) The interesting quantity
    is the SHAPE of the residual in L: whether the measured advantage tracks the product, sits below
    it because the layers are not independent in the adversary''s favour, or exceeds a naive sum because
    an inner cheat can be reused across layers. Which of the three occurs is exactly what this record
    measures, and any of the three is a reportable result. (D) NOT CLAIMED: no attack on recursion,
    no claim that any layered accounting is wrong, no claim about any deployed, third-party or standardized
    recursive proof system, none of which is examined; no extraction or knowledge-soundness statement
    is made, since only decision soundness is measured; and no security consequence, since a residual
    measured at four toy layers says nothing about any real recursion depth.'
  mechanism: 'STAGE A: fix a single-layer protocol whose attained cheating advantage eps_1 is exactly
    computable, reusing the enumerable commit-challenge-response shape used elsewhere in this set
    with the challenge derived by Fiat-Shamir. STAGE B: make the verifier expressible. Write the layer-1
    verifier as a small circuit over the same field, then define the layer-2 statement to be the assertion
    that this circuit accepts a given proof. The embedding is the load-bearing step and its cost,
    in added statement size and added constraint degree, is recorded as an integer, not hidden. STAGE
    C: measure eps_1 exhaustively. STAGE D: measure eps_2 by enumerating the layer-2 prover''s options:
    it may cheat at the inner layer, at the outer layer, or at the embedding, and the enumeration
    covers all three with the strategy space labelled. STAGE E: extend to L equal to 3 and 4, at which
    point full enumeration fails and the prover is replaced by a declared exhaustive-per-layer optimum
    with a named composition rule, which is a lower bound on the attained advantage and is labelled
    as such throughout. STAGE F: compare against the accounting''s product prediction and report the
    signed bit residual per L. STAGE G: run the null arm below, in which the inner verifier is replaced
    by a random predicate of the same shape, breaking any reuse across layers, and require the residual
    to vanish there.'
  novelty_status: unverified
  novelty_screen:
    method: Grepped ledger/proposals/ and ledger/hypotheses/ for recursive proof, proof composition,
      union bound, extractor and rewinding. Read the titles of all thirteen RQ-WFS-e776b6 proposals
      from a PyYAML scan of ledger/proposals/. Read ledger/questions/RQ-WFS-e776b6.yaml in full. Read
      the title and class of the closest record, IDEA-20260809-82c5f5, which is classed as composition
      on this same question.
    results: IDEA-20260809-82c5f5 is the only composition-classed record on RQ-WFS and asks, when
      one proof is verified inside another, whose transcript the challenge is derived from; that is
      a transcript-binding question and its deliverable is a determination about derivation scope.
      The strings recursive proof and proof composition otherwise hit only knowledge/ files including
      knowledge/literature/KN-LIT-6181.md and knowledge/literature/KN-LIT-3948.md. The string extractor
      hits IDEA-20260805-59fa23, IDEA-20260731-002, IDEA-20260731-005 and IDEA-20260806-071255, none
      on RQ-WFS. No record on this question measures an advantage as a function of composition depth
      or reports a per-layer residual.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature; layered soundness accounting
      for recursive composition is standard and treated here as known, as is the fact that recursion
      costs a per-layer loss. What is claimed new is only internal: no record here produces a measured
      advantage per composition depth alongside the accounting''s prediction and reports the signed
      residual. The parts assembled, an enumerable toy protocol, an embedded verifier circuit, and
      exhaustive strategy enumeration, are all known and are used elsewhere in this same set.'
  object_first_candidate:
    tracked_object: The layer-indexed advantage vector a, whose L-th entry is the attained cheating
      advantage of the L-layer composed argument at fixed parameters. Every reported quantity is a
      functional of a, specifically its ratio to the accounting's predicted product and the differences
      between consecutive entries.
    lossiness: Genuinely lossy. The full state is the entire composed prover strategy across all layers,
      whose size grows multiplicatively in L; the advantage vector keeps L numbers and discards which
      layer the cheat occurred at, which inner proof was reused, and every structural detail of the
      strategy. The discard is compatible with the target operation because a verifier at the top
      layer accepts or rejects, so the only thing that propagates outward is the probability of acceptance;
      nothing about where the cheat lives can affect an outer decision except through that probability.
      The retained vector propagates deterministically under adding one more layer, which is the operation
      whose accounting is in question.
    propagation: 'One step of the target operation is adding one layer of recursion. On the tracked
      object it acts by mapping a[L] to a[L plus 1], and the accounting asserts that this map is approximately
      multiplication by the per-layer soundness error plus an additive embedding term. The measurement
      asks which it is: if inner cheats cannot be reused, the map is multiplicative and the vector
      decays geometrically; if an inner cheat can be carried outward, the map is closer to the identity
      and the vector is flat, which would be the interesting shape. The record measures the map at
      four points and reports its shape without asserting that shape holds beyond them.'
    survival_score: The object survives while the composed advantage is computable, which is exact
      at L equal to 1 and 2 for the named toy parameters and becomes a labelled lower bound at L equal
      to 3 and 4 under the declared composition rule. It dissolves at L equal to 5 and beyond at these
      parameters, because the embedded verifier's statement size grows at each layer and the strategy
      space outruns any enumeration; that boundary is named rather than crossed, and the record reports
      four points, not a limit.
  null_object_control: 'NULL OBJECT: the identical L-layer pipeline with the inner verifier circuit
    replaced by a random predicate of the same input shape and the same acceptance density, so the
    outer statement has the same size and the same honest acceptance probability but carries no structural
    relationship to the inner protocol. This runs in the same invocation as the signal arm, through
    the identical enumeration and the identical accounting comparison. For the signal arm to mean
    anything the null must show a residual consistent with zero at every L, since a random predicate
    offers nothing to reuse across layers and its layered advantage must be the plain product. If
    the null shows the same residual shape as the signal arm, the residual is a property of the enumeration
    or of the composition rule rather than of recursion, and the record closes as a controlled null.
    A second null sets L equal to 1, where composition is vacuous and the measured advantage must
    equal eps_1 exactly.'
  discriminated_from:
  - IDEA-20260809-82c5f5 asks whose transcript a challenge is derived from across a composition boundary,
    a binding question whose answer is a determination about scope. This record fixes the binding
    as correct and measures the numerical advantage as depth grows; the two do not overlap in object
    or deliverable.
  - IDEA-20260815-85378c enumerates transcript omission classes with a forged proof each. Nothing
    is omitted here; the transform is correctly instantiated at every layer and the measured loss
    is the residual that remains when nothing is wrong.
  - The query-budget record in this set, whose independent variable is the adversary's number of hash
    queries at a fixed single-layer protocol. Here the query budget is fixed and the composition depth
    is the independent variable.
  - IDEA-20260816-8ee18f measures covariance between repetition-level success events under a shared
    salt. Repetitions are parallel instances of one protocol; layers are nested instances where the
    inner verifier becomes the outer statement, and the accounting term is a different one.
  - 'A generic statement that recursion costs a per-layer loss: that is the accounting this record
    measures against, not a competing measurement.'
  assumptions:
  - The layer-1 verifier can be expressed as a circuit small enough to serve as a layer-2 statement
    without changing the protocol family, so that the same enumeration machinery applies at every
    layer.
  - At L equal to 3 and 4 the declared composition rule yields a lower bound on the attained advantage;
    it is never reported as an attained maximum.
  - Only decision soundness is measured; no extraction, knowledge soundness, or witness recovery is
    attempted, and no statement about them is made.
  - The Fiat-Shamir transform is correctly instantiated at every layer with domain separation between
    layers, so the measured residual is attributable to composition rather than to transcript binding.
  - The embedding cost, in added statement size and constraint degree per layer, is recorded as an
    integer and is part of the deliverable rather than an implementation detail.
  predictions:
  - metric: measured advantage at L equal to 1
    direction: different
    minimum_effect: 'forced value: exactly eps_1 as computed by single-layer enumeration; disagreement
      voids the instrument'
  - metric: signed bit residual between measured advantage and the accounting product, at L equal
      to 2
    direction: different
    minimum_effect: 'explicit refusal to pre-commit a magnitude: whether an inner cheat is reusable
      across the embedding is precisely the unknown, and pre-committing a residual would invent the
      answer; only the sign convention and the zero hypothesis are pre-registered'
  - metric: null-arm residual at every L
    direction: different
    minimum_effect: 'forced value: consistent with zero within the enumeration''s counting error;
      a nonzero null residual voids the comparison'
  - metric: shape of the advantage vector across L equal to 1 to 4
    direction: lower
    minimum_effect: 'forced structure: non-increasing in L, since adding a layer cannot make cheating
      easier under the stated composition rule; an increasing vector indicates the composition rule
      is mis-specified'
  minimal_test:
    design: One script plus one circuit description, a day of work and a few hours of compute. Fix
      the layer-1 protocol at p equal to 257 with attainable-set size d equal to 4 so eps_1 equals
      4 over 256, and express its verifier as a circuit of at most 64 gates over F_257. At L equal
      to 1 enumerate the full strategy space and record eps_1. At L equal to 2 enumerate the composed
      strategy space, which is the product of the inner strategy space and the outer commitment space
      capped at 2 to the 22 nodes, and record the attained advantage together with which layer the
      argmax cheat lived at. At L equal to 3 and 4 apply the declared per-layer optimum composition
      rule and record the resulting lower bound. Run the random-predicate null and the L equal to
      1 degenerate control in the same invocation. The discriminating output is a four-entry table
      of measured advantage, predicted product and signed bit residual, with the null column beside
      it. If the residual is zero at every L, the accounting is confirmed at these depths and that
      is the reportable measured result.
    controls:
    - Random-predicate null with matched acceptance density through the identical pipeline in the
      same invocation.
    - L equal to 1 degenerate control, where the measured advantage must equal eps_1 exactly.
    - Zero-advantage control with d equal to zero, where every layer must report advantage exactly
      zero.
    - Full-advantage control with d equal to q, where every layer must report advantage exactly one.
    - 'Domain-separation control: the same run with layer indices omitted from the transcript, which
      must change the measured advantage, confirming the instrument is sensitive to binding and that
      the main arm''s binding is doing work.'
    - Seed replay reproducing every enumeration count exactly.
    required_metrics:
    - attained advantage per composition depth L
    - accounting's predicted product per L
    - signed bit residual per L
    - argmax layer at which the cheat occurred, per L
    - embedding cost per layer in statement size and constraint degree
    - null-arm advantage and residual per L
    - strategy space node count and enumeration wall time per L
  falsification_conditions:
  - The L equal to 1 measurement disagrees with the independently computed eps_1.
  - The zero-advantage or full-advantage control does not return its forced value.
  - The advantage vector is increasing in L, indicating a mis-specified composition rule rather than
    a finding about recursion.
  - The null arm shows the same residual shape as the signal arm, closing the record as a controlled
    null with the enumeration geometry named.
  - The residual is consistent with zero at every L, which falsifies the conjecture that composition
    introduces a measurable deviation from the product accounting at these depths and closes with
    that obstruction and the depth that would need to be reached to reopen it.
  - The domain-separation control does not change the measured advantage, showing the instrument cannot
    see binding at all and therefore cannot be trusted to attribute the residual.
  confounders:
  - The declared composition rule at L equal to 3 and 4 silently determines the shape of the vector;
    a rule that forbids reuse across layers would produce a geometric decay by construction, which
    must not be read as a measurement.
  - Embedding cost growth changes the effective parameters at each layer, so a residual could reflect
    a shrinking relative challenge space rather than composition itself.
  - Omitting layer indices from the transcript would introduce a transcript-binding effect owned by
    another record and would be miscredited to composition.
  - Truncating the L equal to 2 enumeration converts an attained maximum into a lower bound, which
    flattens the residual if not labelled.
  - The random-predicate null must match acceptance density exactly, or the comparison measures density
    rather than structure.
  interpretation_limits:
  - Results are scoped to the named toy protocol, the named parameters and depths one through four;
    nothing about real recursion depths or about any recursive proof system follows.
  - Only decision soundness is measured, so nothing about extraction or knowledge soundness follows,
    and the layered accounting for those is untouched.
  - At L equal to 3 and 4 the reported advantage is a lower bound under a declared composition rule,
    not an attained maximum.
  - No statement about any deployed, third-party or standardized recursive proof system follows from
    any outcome.
  target_complexity:
    time_exponent: No attack exponent is claimed. Enumeration cost grows multiplicatively in L and
      is capped at 2 to the 22 nodes per layer by the stopping rule.
    memory_exponent: No attack memory exponent is claimed. Peak memory is O(node cap) for the strategy
      table, bounded under four gigabytes at the named cap.
    best_known: The incumbent is the standard layered soundness accounting for recursive composition,
      in which the L-layer error is charged as a product or sum of per-layer terms plus an embedding
      term. This record does not beat that accounting; it measures the residual against it at four
      toy depths.
    hidden_overhead: 'The dominant hidden cost is the embedding: expressing a verifier as a statement
      of the same protocol family is most of the work, and the added statement size and constraint
      degree per layer change the effective parameters in ways that are easy to miscredit to composition.
      The declared composition rule at depths beyond full enumeration is the other hidden lever, and
      it can produce the answer by construction if it is not stated in advance.'
  dominated_by: n/a (no result claimed). No solve, forgery or cost improvement is proposed, so no
    time, memory or query frontier row exists to compare against; asserting null would be a fabrication.
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is a four-entry
    residual ledger at named toy parameters and depths, with no cost comparison to any algorithm.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium
  honest_prior_of_survival: 'Part A, that the layer-1 verifier can be expressed as a statement of
    the same protocol family at these parameters: about 0.55, and this is the crux; if the embedding
    forces a different protocol family the whole measurement changes meaning. Part B, that L equal
    to 2 is fully enumerable within the node cap: about 0.6. Part C, that the residual at L equal
    to 2 differs measurably from zero: about 0.2, and I expect it not to; the honest expectation is
    that the product accounting is confirmed and the deliverable is the confirmed ledger plus the
    embedding cost integers. Part D, that the embedding cost integers per layer are themselves a useful
    artifact for other records: about 0.65.'
