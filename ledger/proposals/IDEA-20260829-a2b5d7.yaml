idea:
  id: IDEA-20260829-a2b5d7
  question_id: RQ-MLDSA-ffa0f5
  status: proposed
  proposed_by: idea-generator
  added: '2026-08-29'
  title: >-
    The one FIPS 204 decoder that is NOT a bijection onto its declared domain is
    skDecode, and the standard closes the hole with the sentence "trusted
    sources" rather than a check. Derive the exact fraction of length-correct
    private keys that decode OUT OF RANGE (1 minus (5/8)^2048 at ML-DSA-44), and
    then measure which malformations are SELF-ENFORCING (a verifier catches
    them) and which are SILENT but destroy the rejection-sampling uniformity
    that makes z independent of s1 - decided by a hole census in the accepted-z
    support with a placebo band as the positive control.
  class: control

  claim: >-
    (A) THE SPECIFICATION CLAIM, WHICH IS ALL THAT IS ASSERTED HERE ABOUT THE
    DOCUMENT. FIPS 204's private-key decoder accepts every byte string of the
    correct length. Its own algorithm listing annotates the s1 and s2 unpacking
    with a remark that the decoded values may lie outside [-eta, eta] if the
    input is malformed, in explicit contrast with the t0 unpacking, which is
    annotated as always in range. RECALLED FROM MEMORY AND FROM THIS CORPUS'S
    OWN TRANSCRIPTION (IDEA-20260805-bb52fa mechanism (2)); NOT RE-FETCHED THIS
    SESSION. The standard's remedy is a precondition - that skDecode be run only
    on input from trusted sources - and NOT a normative range check. THAT IS A
    SPECIFICATION STATEMENT AND IT IS WHERE THIS RECORD'S DOCUMENT CLAIM STOPS.
    Whether the precondition is prudent, whether an implementation is
    non-conformant for omitting a check the standard never mandates, and whether
    NIST intends to change it are all outside this record.

    (B) THE ARITHMETIC CLAIM, WHICH IS EXACT AND NEEDS NO MEASUREMENT.
    s1 and s2 are packed at bitlen(2 eta) bits per coefficient as the unsigned
    value eta - s. At eta = 2 that is 3 bits, so 8 codes represent 5 legal
    values and 3 of 8 per-coefficient codes decode to s in {-3, -4, -5}. At
    eta = 4 it is 4 bits, so 16 codes represent 9 legal values and 7 of 16
    decode to s in {-5, ..., -11}. Over the 256(k + l) coefficients of (s1, s2)
    the fraction of length-correct private keys that decode entirely IN range is
    GENERATOR-COMPUTED, RE-DERIVATION REQUIRED:
      ML-DSA-44  (eta 2, 3 bits, 2048 coefficients)  (5/8)^2048  = 1.0e-418
      ML-DSA-65  (eta 4, 4 bits, 2816 coefficients)  (9/16)^2816 = 2.0e-704
      ML-DSA-87  (eta 2, 3 bits, 3840 coefficients)  (5/8)^3840  = 1.6e-784
    So essentially EVERY length-correct byte string that is not an honest key
    decodes to an out-of-range key, and skDecode as specified returns it.
    CONSISTENCY CHECK CARRIED BY THE SAME ARITHMETIC: 128 + 32(l + k)bitlen(2
    eta) + 32 * 13 k evaluates to 2560 / 4032 / 4896 bytes, which reproduces the
    private-key sizes recalled from FIPS 204 Table 2 exactly at all three sets.
    A record whose packing widths were wrong would miss those three numbers.

    (C) THE MATHEMATICAL CLAIM, WHICH IS SEPARATE AND WEAKER. beta = tau * eta
    is the bound on the sup-norm of c s1 and c s2 that the whole correctness and
    zero-knowledge argument rides on. An out-of-range key breaks it by a known,
    exact factor: the extreme decodable magnitude is 2^bitlen(2 eta) - 1 - eta,
    i.e. 5 / 11 / 5, so the true sup-norm envelope becomes tau times that,
    GENERATOR-COMPUTED as 195 / 539 / 300 against beta = 78 / 196 / 120.
    TWO CONSEQUENCES, WITH OPPOSITE DETECTABILITY, AND SEPARATING THEM IS THE
    POINT OF THE EXPERIMENT.
    (C1) CORRECTNESS, POSSIBLY SELF-ENFORCING. The Line-23 check enforces the
    low-part bound against the WRONG beta, so HighBits(w - c s2) can differ from
    HighBits(w) and the signature fails to verify. The fraction of emissions on
    which the guarantee LAPSES is bounded above by
    1 - (1 - (envelope - beta)/(2 gamma2))^(256k), GENERATOR-COMPUTED as
    0.467 / 0.634 / 0.505. That is an UPPER BOUND on the verification-failure
    rate and not a prediction of it, because the lapse only bites when the
    offending coefficient of c s2 actually attains a large value.
    (C2) ZERO KNOWLEDGE, SILENT BY CONSTRUCTION. The accepted z is uniform on
    the box of radius gamma1 - beta ONLY IF the sup-norm of c s1 is at most
    beta. When a coefficient a of c s1 exceeds beta, the accepted z coefficient
    is uniform on the INTERSECTION of (-gamma1 + a, gamma1 + a] with the
    acceptance box, which is the box minus a one-sided HOLE of width
    |a| - beta at one end. A verifier cannot see this: every emitted signature
    is a syntactically and algebraically valid ML-DSA signature under a valid
    public key. THE FALSIFIABLE CLAIM IS THE HOLE. For a maximally out-of-range
    s1 at ML-DSA-44 the hole has relative width up to 117/261988 = 4.47e-4 of
    the accepted support, it appears on the roughly 1.2 per cent of coefficients
    whose |c s1| exceeds beta, and the number of accepted z coefficients landing
    inside the predicted hole regions is EXACTLY ZERO, against about 54 expected
    over 10^4 signatures if the accepted z law were the uniform one the scheme
    advertises.

    (D) WHAT THIS IS NOT. NOT A BREAK OF ML-DSA. Every object here concerns a
    key that ML-DSA.KeyGen cannot produce, so nothing is asserted about MLWE,
    MSIS or SelfTargetMSIS in any direction, and no forgery under an unknown key
    is constructed. NOT A FAULT ATTACK: no computation is glitched and no device
    is touched; a byte string is handed to a documented API entry point, which
    is the import path the pqc-forum thread cited below is about. NOT A
    CONFORMANCE VERDICT on any implementation.

  mechanism: >-
    (1) WHY THIS OBJECT IS DIFFERENT FROM EVERY PRIOR PROPOSAL IN THE LANE. All
    twelve filed records track something downstream of a VALID key: the four
    Algorithm 7 rejection predicates and their rates (031ce2, bb52fa, 4f83f6,
    60ba98, 6d1b97), the t0 channel and its price (630606, 6109f8, 65739b,
    71fc18), the signature byte fibre with pk fixed (e5f947), or the testing and
    deployment volumes that would exercise them (8f3496, fa04dc). The tracked
    object HERE is the KEY-VALIDITY PREDICATE as a function of the private-key
    byte string, followed forward into three separate downstream observables -
    signing termination, verification outcome, and the shape of the accepted z
    support. It enters the computation strictly before every object those twelve
    records track.

    (2) THE LOSSY PROJECTION, AND WHY IT IS NOT A CHANGE OF COORDINATES. The
    projection sends a 2560-to-4896-byte private key to the triple
    (max |s1| - eta, max |s2| - eta, consistency flag), where the consistency
    flag records whether t1 * 2^d + t0 equals A s1 + s2 and whether tr equals
    H(pk). Everything else is discarded: the message, the randomness, the seed,
    the individual coefficients, t0 itself. The fibre over an observed triple is
    astronomically large, so nothing reconstructs the key from it. The discard
    is COMPATIBLE with the target's operations because every downstream
    quantity that the experiment measures is a function of sup-norms and of the
    consistency flag alone - the correctness lapse in (C1) is driven by the
    sup-norm of c s2, which is bounded by tau times max |s2|, and the hole in
    (C2) by the sup-norm of c s1 - so the retained part propagates
    deterministically through the signing loop. THE MIRROR FAILURE WAS CHECKED
    AND DOES NOT OCCUR: the projection is not constant across instances, because
    it takes at least four materially different values in the design (conforming
    zero excess; small excess; maximal excess; consistent-components-broken),
    and those four values are predicted to give three DIFFERENT downstream
    verdicts. A projection returning the same verdict on all four arms is the
    pre-registered tell that the instrument is dead.

    (3) THE THREE MALFORMATION CLASSES, WHICH THE EXPERIMENT MUST SEPARATE.
    CLASS R (RANGE): s1 or s2 coefficients outside [-eta, eta], everything else
    consistent. Predicted PARTIALLY SILENT: some emissions fail verification,
    most do not, and the accepted-z hole is present on every emission.
    CLASS C (COMPONENT CONSISTENCY): s1, s2 in range but t0, t1 or rho taken
    from a different key, so that t1 * 2^d + t0 is not A s1 + s2. Predicted
    FULLY SELF-ENFORCING: the verifier's reconstruction misses and essentially
    no emission verifies, because the identity A z - c t1 2^d = w - c s2 + c t0
    that IDEA-20260805-630606 mechanism (2) derives fails coefficient-wise.
    CLASS T (BINDING): s1, s2, t0, t1 all consistent but tr not equal to H(pk).
    Predicted FULLY SELF-ENFORCING for a verifier holding the real pk, since mu
    differs and the challenge equality misses; and this is the arm that also
    tests whether an implementation recomputes tr rather than trusting it.
    A DESIGN THAT REPORTED ONE NUMBER FOR "MALFORMED KEYS" WOULD AVERAGE THESE
    THREE AND SAY NOTHING. The deliverable is the three-row table.

    (4) THE HOLE CENSUS, WHICH IS THE ONE MEASUREMENT THAT CANNOT BE FAKED. Hold
    sk (the auditor holds it; this is a measurement, not an attack). For each
    signature and each coefficient index, compute a = (c s1)_j exactly. If
    |a| <= beta the coefficient contributes nothing. If |a| > beta, the
    predicted hole is the interval of accepted z values of width |a| - beta at
    the end of the acceptance box on the side away from a. COUNT how many
    accepted z coefficients fall inside their own predicted hole. FORCED VALUE
    UNDER THE MECHANISM: exactly 0, always, at any sample size, because those
    values are unreachable. FORCED VALUE UNDER THE NULL THAT THE MECHANISM IS
    WRONG (accepted z genuinely uniform on the full box): Poisson with mean
    equal to the summed relative hole measure, GENERATOR-COMPUTED at about 54
    over 10^4 signatures at ML-DSA-44 with a maximally out-of-range s1. A
    Poisson(54) variable equals 0 with probability e^-54, so 10^4 signatures
    decide it outright.

    (5) THE PLACEBO BAND, WHICH IS THE POSITIVE CONTROL AND IS MANDATORY. A
    counter that returns 0 has demonstrated nothing until it has been shown to
    count. For every predicted hole, construct a PLACEBO BAND of identical width
    placed at a seeded random location inside the acceptance box away from both
    ends, and run the identical counter over it. FORCED VALUE: Poisson with the
    same mean, about 54 over 10^4 signatures. IF THE PLACEBO COUNT IS ALSO ZERO,
    THE COUNTER IS BROKEN AND NO ZERO FROM THE REAL BAND MAY BE REPORTED. This
    is the instrument-fires requirement stated as an executable arm, and it is
    the reason this design can distinguish "the hole is real" from "the counter
    never fires".

    (6) WHAT EACH OUTCOME MEANS, DECLARED BEFORE THE RUN. E1 SELF-ENFORCING: the
    class-R verification-failure rate is at least 1e-3 at 10^4 emissions. Range
    malformation is then caught by ordinary sign-then-verify testing, the
    defect class is NOT of the GOAL-MLKEM-002 shape, and the standard's
    trusted-source precondition is doing less work than it appears to. E2
    SILENT: the class-R failure rate is below 1e-3 while the hole census returns
    0 against a firing placebo. Range malformation is then invisible to every
    verifier and visible only to a party holding sk, which IS the
    GOAL-MLKEM-002 shape, and the honest replacement for the standard's sentence
    is a number - the hole measure - rather than a precondition. E3 INSTRUMENT
    FAILURE: the placebo does not fire, or the conforming arm emits a
    non-verifying signature; nothing is reported.

  novelty_status: unverified

