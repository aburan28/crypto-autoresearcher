  assumptions:
    - >-
      That the s1/s2 packing is unsigned-then-subtract at bitlen(2 eta) bits, so
      that codes above 2 eta decode to values below -eta. If the packing instead
      rejects or saturates, claim (B) is void and the proposal is withdrawn.
      Stage 0 checks this and the private-key size arithmetic is the free
      cross-check.
    - >-
      That skDecode as specified performs no range test on s1 and s2. If a
      normative range test exists elsewhere in the standard's prose, the
      specification claim in (A) is wrong and the record is superseded; the
      arithmetic in (B) and the mechanism in (C) survive as statements about an
      implementation that omits the prose requirement.
    - >-
      That an implementation is available that accepts an expanded private key
      as a byte string. Seed-only implementations are OUT OF SCOPE by
      construction, and the record says so rather than generalising.

  proof_search_map:
    bottleneck: >-
      The step whose removal changes the conclusion is the inference from
      "sup-norm of c s1 exceeds beta" to "the accepted z support has a hole".
      Everything else is counting. That inference needs the accepted z law to be
      the y law shifted by c s1 and then truncated to the acceptance box, which
      is exactly what Algorithm 7 does, and it needs the shift to be applied
      BEFORE the norm test rather than after.
    baseline_embedding:
      parameter_slice: >-
        The old-method boundary is the conforming key, i.e. max |s1| = eta.
        There the hole width max(0, |c s1| - beta) is identically zero for every
        coefficient, every prediction of this record collapses to "accepted z is
        exactly uniform", and the scheme's own uniformity lemma is recovered.
      reproduction_check: >-
        Symbolic: substitute |c s1| <= beta into the hole-width formula and
        check it vanishes identically. Empirical: on a conforming key, the hole
        census must be vacuous (empty band set) and the placebo band must still
        fire at its Poisson mean. Frozen fixture of 10^3 conforming signatures.
    observation_collision:
      observable: >-
        The certificate carrying the conclusion is the pair (hole count,
        placebo count) together with the exhibited malformed private key and one
        signature it produced.
      distinct_preimage_search: >-
        Two distinct ground-truth situations giving the same observable were
        searched for and one was found. (i) A genuinely out-of-range key with a
        real hole. (ii) A CONFORMING key run through a buggy counter whose band
        arithmetic is off by one, which also returns hole count 0. The separator
        is the placebo arm, which returns about 54 in case (i) and also about 54
        in case (ii) - so the placebo alone does NOT separate them. The
        additional separating condition is the GRADED arm: a key with excess
        exactly 1 above eta has a hole of width tau, and a key with excess 3 has
        a hole of width 3 tau, so the placebo-matched sensitivity must scale
        linearly in the excess. A counter that returns 0 at every excess
        including excess 0 is in case (ii).
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Carry the per-coefficient pair (excess of |c s1| above beta, side of
          the box on which the hole sits) rather than the scalar "key is
          malformed". The stronger state is what survives the rejection loop and
          what makes the census a deterministic prediction instead of a
          statistical one.
        predicted_gain: >-
          Converts a distributional claim requiring a hypothesis test into an
          exact-zero prediction with a matched placebo, which is decidable at
          10^4 signatures instead of at an unknown sample size.
      - transform: observable_fiber
        proposed_object: >-
          Hold the observable "signature verifies" fixed and vary the forgotten
          structure - which of classes R, C, T produced the key. The intrinsic
          invariant that separates them is the hole census, which is nonvacuous
          only for class R.
        predicted_gain: >-
          Separates detectable malformation from silent malformation, which the
          standard's single trusted-source sentence conflates.
    quantifier_order: >-
      FOR ALL parameter sets in {44, 65, 87}, FOR ALL private-key byte strings
      sk that skDecode accepts, THERE EXISTS a per-coefficient excess function
      e_j(sk, c) = max(0, |(c s1)_j| - beta) such that FOR ALL messages and FOR
      ALL accepted signatures, z_j avoids an interval of width e_j at one end of
      the acceptance box. Note the order: the excess depends on the key AND the
      challenge, and it is quantified before the message, which is why the
      prediction is per-signature and deterministic rather than an average.
      A claim with the quantifiers reversed - one hole for all challenges - is
      NOT made.
    method_ceiling:
      strongest_certifiable_claim: >-
        The strongest thing this method can certify is that a party HOLDING sk
        can distinguish a range-malformed signer from a conforming one from
        signatures alone, and at what rate. It cannot certify that a party
        without sk can, it cannot certify recovery of s1, and it cannot certify
        anything about a key that ML-DSA.KeyGen could have produced.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a key with
        max |s1| = eta exactly - a conforming key at the boundary. There the
        hole width is exactly zero and the census is vacuous. A method that
        reported a hole there would be reporting an artifact, which is why the
        conforming arm is run first and its verdict committed before any
        malformed arm is examined.
    proof_obligations:
      - claim: >-
          The fraction of length-correct private keys decoding entirely in range
          is (5/8)^2048, (9/16)^2816 and (5/8)^3840
        responsibility: size
      - claim: >-
          The accepted z coefficient law is the y law shifted by c s1 and
          truncated to the acceptance box, hence has a hole of width
          max(0, |c s1| - beta)
        responsibility: correctness
      - claim: >-
          The verification-failure rate for class R is at most
          0.467 / 0.634 / 0.505
        responsibility: strictness
      - claim: >-
          The placebo counter returns a Poisson count with the derived mean on a
          conforming key
        responsibility: interface
      - claim: >-
          Class C and class T emissions fail verification at rates
          indistinguishable from 1
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        fraction of length-correct private-key byte strings that decode entirely
        within [-eta, eta], recomputed in exact rational arithmetic from the
        packing widths
      direction: lower
      minimum_effect: >-
        FORCED VALUES, DERIVED BEFORE ANY RUN, 1.0e-418 / 2.0e-704 / 1.6e-784 at
        ML-DSA-44 / -65 / -87, with the per-coefficient in-range code fractions
        exactly 5/8, 9/16 and 5/8. Any deviation in the exponent's leading digit
        falsifies the packing arithmetic and halts the package.
    - metric: >-
        verification rate of emissions from a class-R (maximally out-of-range)
        signer under an independently written verifier, 10^4 emissions per
        parameter set
      direction: lower
      minimum_effect: >-
        Strictly between 1 - 0.467 and 1 at ML-DSA-44 and correspondingly at the
        other two sets. The pre-registered split is at a failure rate of 1e-3,
        which separates outcome E1 from outcome E2 as defined in mechanism (6).
        A measured failure rate of exactly 0 over 10^4 emissions is reported as
        an upper bound of 3.0e-4 with its sample size, never as zero.
    - metric: >-
        hole census - number of accepted z coefficients falling inside their own
        predicted hole interval, class-R key, 10^4 signatures at ML-DSA-44
      direction: lower
      minimum_effect: >-
        FORCED VALUE 0, exactly, at any sample size. The comparator is the
        placebo band's count on the same run, forced to Poisson with mean about
        54 at that sample size. A nonzero hole count falsifies the mechanism in
        (C2) outright and is the single most informative negative available.
    - metric: >-
        placebo band count, identical counter, matched total band measure,
        conforming key AND class-R key
      direction: higher
      minimum_effect: >-
        At least 20 on both arms at 10^4 signatures (a Poisson(54) variable
        falls below 20 with probability under 1e-7). BELOW THAT THE COUNTER HAS
        NO POWER AND THE ZERO FROM THE REAL BAND IS UNINTERPRETABLE; nothing
        else in the package may be reported.
    - metric: >-
        verification rate of emissions from class-C (inconsistent components)
        and class-T (wrong tr) signers
      direction: lower
      minimum_effect: >-
        Below 1e-3 at 10^4 emissions, i.e. essentially all emissions fail. If
        either class verifies at a rate above 0.01 the census in mechanism (3)
        is wrong and the three-row table is restated before anything else is
        said.
    - metric: >-
        graded sensitivity - hole census placebo-matched detection threshold as
        the s1 excess above eta is swept over {0, 1, 2, 3, extreme}
      direction: higher
      minimum_effect: >-
        The predicted hole measure must grow monotonically and approximately
        linearly in the excess, and must be exactly zero at excess 0. A
        detection statistic that does not decay to the placebo level at excess 0
        is the canonical artifact tell of docs/inventor-protocol.md section 3.

  minimal_test:
    design: >-
      FOUR STAGES, CHEAPEST FIRST, EACH ABLE TO TERMINATE THE LINE.
      STAGE 0 (reading, zero compute, TERMINATING). Re-obtain FIPS 204 under a
      run record and read verbatim, with page numbers, the s1/s2 packing width,
      the skDecode range annotations, the trusted-source sentence, and Table 2's
      private-key sizes. Open the C2SP/wycheproof ML-DSA test-vector set and
      record whether a malformed-private-key vector already exists; if it does,
      this record's exhibition half is dominated and says so. If the packing is
      not unsigned-then-subtract, STOP.
      STAGE 1 (arithmetic, milliseconds, TERMINATING). Recompute the in-range
      fractions, the extreme decodable magnitudes 5 / 11 / 5, the envelopes
      195 / 539 / 300 against beta 78 / 196 / 120, and the three
      guarantee-lapse upper bounds. Reproduce 2560 / 4032 / 4896. If any of
      these misses, STOP and re-derive.
      STAGE 2 (conforming baseline plus placebo, minutes). Build a pure-Python
      ML-DSA on hashlib SHAKE plus an INDEPENDENTLY WRITTEN verifier sharing no
      code path with the signer. Emit 10^3 conforming signatures per parameter
      set, confirm 100 per cent verification, and run the placebo counter to
      confirm it fires at its Poisson mean. COMMIT THIS VERDICT BEFORE ANY
      MALFORMED ARM IS EXAMINED.
      STAGE 3 (the three malformation classes, minutes to an hour). Construct
      one class-R, one class-C and one class-T private key per parameter set as
      byte strings, decode them, emit 10^4 signatures each, and record
      verification rate, hole census, placebo count, and the graded excess
      sweep. Emit as the deliverable artifact, per parameter set, the tuple
      (malformed sk hex, pk hex, message, signature hex, verifier verdict from
      two independent implementations, hole count, placebo count, seed).
      WHAT DISCRIMINATES. Stage 3's class-R verification rate separates E1 from
      E2 at a threshold fixed in advance. The hole census against the placebo
      separates "silent malformation leaves a deterministic trace in the
      transcript" from "silent malformation is also traceless". The class-C and
      class-T arms separate "malformed keys are dangerous in general" from
      "exactly one of three malformation classes is silent", which is the
      difference between a headline and a correct headline.
    controls:
      - >-
        CONFORMING NULL, FORCED VALUE PRE-DERIVED, CAN FAIL. 10^3 conforming
        emissions per parameter set must verify 10^3 out of 10^3 under the
        independent verifier and the hole band set must be empty. Any conforming
        emission that fails means the implementation is wrong and NOTHING in the
        package may be reported.
      - >-
        PLACEBO BAND POSITIVE CONTROL, MANDATORY, MUST FIRE. Identical counter,
        identical total band measure, seeded random placement away from the box
        ends, run on BOTH the conforming and the class-R arms. Forced value
        Poisson mean about 54 at 10^4 signatures. A placebo count below 20 voids
        every zero in the package. This is the arm that answers "has this check
        ever been shown to trigger".
      - >-
        DELIBERATELY MALFORMED POSITIVE CONTROL FOR THE VERIFIER. A signature
        with one z coefficient set just above gamma1 - beta must be REJECTED by
        the independent verifier. If it is accepted, the verifier is not
        enforcing the norm check and no verification rate from any arm is
        interpretable.
      - >-
        GRADED EXCESS SWEEP, FIVE POINTS {0, 1, 2, 3, extreme}, MONOTONICITY
        REPORTED. The hole measure must be exactly 0 at excess 0 and grow
        approximately linearly thereafter.
      - >-
        SECOND INDEPENDENT VERIFIER for every exhibited artifact. A certificate
        re-verified by only one implementation is not a certificate under
        RQ-MLDSA-ffa0f5's methods clause.
      - >-
        ARCHIVE CHECK, ZERO COMPUTE. Record that no prior measurement of this
        observable exists in this corpus, as an ABSENCE and not as a passed
        check, and record the Stage 0 wycheproof finding beside it.
    required_metrics:
      - the packing width, the range annotations and the trusted-source sentence quoted verbatim with pages and a fetch receipt
      - the three in-range fractions, the three extreme magnitudes, the three envelopes and the three lapse bounds, as exact rationals and as floats
      - conforming verification rate per parameter set with seeds, committed before any malformed arm
      - placebo count per arm with its Poisson mean and interval
      - hole census count per arm at 10^4 signatures
      - verification rate per malformation class per parameter set with Clopper-Pearson intervals, zero counts reported as upper bounds with sample size
      - the graded excess sweep with monotonicity reported
      - the exhibited artifact tuple per class per parameter set, with two independent verifier verdicts

  falsification_conditions:
    - >-
      The packing is not unsigned-then-subtract, or a normative range check on
      s1 and s2 exists in the standard. Claim (A) or claim (B) is then wrong and
      the record is superseded rather than patched.
    - >-
      The recomputed in-range fractions or the private-key sizes 2560 / 4032 /
      4896 do not reproduce. The arithmetic is wrong and the package halts.
    - >-
      The hole census returns a nonzero count on the class-R arm while the
      conforming null is clean. The mechanism in (C2) is false, the accepted z
      law is not the truncated shifted law, and this is the most interesting
      outcome available.
    - >-
      The placebo band does not fire. The counter has no power; no zero is
      reportable; the outcome is an instrument statement under AGENTS.md rule 3
      and never evidence about the scheme.
    - >-
      The class-R verification rate is indistinguishable from 1 AND the hole
      census is inconclusive. Range malformation is then invisible on every axis
      this design can see, which is a bounded negative reported with its
      sensitivity and its searched classes, not a clean bill of health.
    - >-
      Class C or class T emissions verify at an appreciable rate. The
      three-class census is wrong; restate before reporting anything.

  confounders:
    - >-
      IMPLEMENTATION SELF-CONFIRMATION. Measuring what a verifier accepts with a
      verifier written by the same hand as the signer tests nothing. The
      independent-verifier requirement is the main threat to validity, not a
      formality.
    - >-
      A ZERO IS COMFORTABLE. "The hole census returned 0" is exactly what the
      mechanism predicts and exactly what a broken counter returns. The placebo
      band exists so that the zero costs something to assert, and the graded
      sweep exists so that the placebo cannot be satisfied by a counter that
      fires only on wide bands.
    - >-
      PURE-PYTHON SCALE. A pure-Python signer is roughly three orders of
      magnitude slower than an optimised C one, which is why the design is sized
      at 10^4 emissions per arm and why every rate below 3e-4 is reported as a
      bound rather than a measurement.
    - >-
      MAXIMALLY OUT OF RANGE IS NOT TYPICAL. The class-R key used for the
      headline is the extreme one. A key that is out of range by one unit on a
      handful of coefficients has a hole measure smaller by orders of magnitude
      and may be undetectable at this sample size; the graded sweep is what
      keeps the record from generalising from the extreme to the typical.
    - >-
      THE THREE CLASSES ARE NOT EXHAUSTIVE. Malformations that mix classes, or
      that put t0 out of its own range (which the standard annotates as
      impossible), are not searched, and the negative rows bound only the
      searched classes.

  interpretation_limits:
    - >-
      NOT A BREAK, NOT A FORGERY, NOT A VULNERABILITY REPORT AGAINST ANY
      IMPLEMENTATION. Every key discussed is one that ML-DSA.KeyGen cannot
      produce. Nothing here bears on MLWE, MSIS or SelfTargetMSIS in any
      direction, and any downstream sentence readable as such is defective
      regardless of what was measured.
    - >-
      THE SPECIFICATION CLAIM AND THE MATHEMATICAL CLAIM MUST NEVER BE MERGED.
      "FIPS 204 states a precondition rather than mandating a check" is a
      statement about a document, checkable by reading it. "An out-of-range key
      breaks the accepted-z uniformity" is a statement about mathematics,
      checkable by derivation and measurement. A record that lets the first
      slide into "FIPS 204 is wrong" has committed the error this lane exists to
      avoid.
    - >-
      The hole in (C2) is a trace visible to a party HOLDING sk. Nothing here
      says a party without sk can see it, and no signature count for recovering
      s1 is claimed, estimated or implied.
    - >-
      Seed-only private-key implementations are outside the scope by
      construction, and the IETF draft cited above states that the seed format
      makes malformed keys impossible. A result here is a statement about the
      expanded-key import path only.
    - >-
      NO STATUS CHANGE to any record is proposed or implied, and no criticism of
      the pqc-forum participants or of the IETF draft is made; both are cited as
      the prior art that makes this record's contribution measurement rather
      than discovery.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The coefficients of LowBits(w) and of y, with w = A y and y drawn fresh
        by ExpandMask at each attempt, behave as independent uniforms on their
        respective ranges - 2 gamma2 integers for LowBits(w) and 2 gamma1
        integers for y - for the purpose of computing the guarantee-lapse upper
        bounds 0.467 / 0.634 / 0.505 and the placebo Poisson mean of about 54 at
        10^4 signatures.
      rigorous_support: >-
        The classical statement imitated is that a linear image of a uniformly
        drawn mask, taken modulo a fixed bucket width, is uniform. The rigorous
        half is exact and is carried over from IDEA-20260805-bb52fa: over Z_q
        the reduction mod 2^d is uniform except for a 1/1023 excess at the
        single class 0, because q - 1 = 1023 * 8192, and that excess sits at the
        centre so it can only thin the tails. The independence across the 256k
        coefficients is NOT proved and is the weak half; its failure would move
        the placebo mean but not the FORCED ZERO of the real band, which is
        deterministic and needs no distribution at all.
      validation_plan: >-
        Measure the empirical accepted-z marginal on the CONFORMING arm at 10^4
        signatures per parameter set and compare against the exact uniform on
        the acceptance box by a chi-square over 256 equal bins, reporting the
        statistic and its p-value; and measure the placebo count against its
        Poisson mean with an exact interval. Tail check: the largest observed
        |z| against the exact quantile at 1 - 1/(256 l N). A conforming arm that
        fails the uniformity test invalidates the placebo calibration and hence
        every zero in the package, and must be reported before any malformed
        arm.
    - id: H2
      statement: >-
        For a class-R key with all s1 coefficients at the extreme decodable
        magnitude, the coefficients of c s1 behave as signed sums of tau
        independent values of that magnitude, so that the fraction of
        coefficients with |c s1| exceeding beta is about 1.2 per cent at
        ML-DSA-44, which is what converts the per-coefficient hole width into
        the aggregate hole measure and hence into the placebo mean of about 54.
      rigorous_support: >-
        Unconditional envelope, no distribution needed: |c s1| is at most tau
        times the extreme magnitude, i.e. 195 / 539 / 300, which is what bounds
        the hole width. The classical statement imitated for the FRACTION is the
        discrete Irwin-Hall law for a signed sum of tau bounded terms, whose
        standard deviation is the extreme magnitude times the square root of
        tau, i.e. 31.2 at ML-DSA-44, putting beta = 78 at about 2.5 standard
        deviations.
      validation_plan: >-
        Sample 10^5 challenges from SampleInBall against a fixed class-R s1 and
        measure the empirical fraction of coefficients with |c s1| > beta
        against the pre-registered 1.2 per cent, and the empirical standard
        deviation against 31.2. This is a direct measurement of the same
        quantity at the same parameters, needs no signing, and costs seconds; a
        deviation beyond three standard errors means the placebo mean is
        mis-set and the sample size must be re-derived before the census is
        read.
    - id: H3
      statement: >-
        NONE LOAD-BEARING FOR THE HEADLINE. The in-range fractions in claim (B),
        the extreme magnitudes, the envelopes 195 / 539 / 300, and the FORCED
        ZERO of the hole census on a class-R key follow from the packing
        definition, the triangle inequality, and the fact that a truncated
        shifted uniform cannot take values outside the shifted support. This
        entry records that the record's central prediction is unconditional and
        that its only remaining assumptions are evidentiary.
      rigorous_support: >-
        Counting over a finite code alphabet; sup-norm subadditivity under
        multiplication by a fixed-weight ternary polynomial; the definition of
        conditioning.
      validation_plan: >-
        Symbolic re-derivation by a second party, plus an exhaustive check at a
        reduced ring degree that the decodable-value set is exactly as counted,
        plus the private-key-size cross-check against 2560 / 4032 / 4896.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED AND NONE IS CLAIMED. This is a conformance and
      correctness measurement about a fielded standard, and saying so plainly is
      what docs/target-result-profile.md's cost-honesty clause requires. The
      exponent this lane must never claim to move is the MLWE / MSIS /
      SelfTargetMSIS one, and RQ-MLDSA-ffa0f5 forbids it explicitly. The one
      quantity here with exponent-like character is the fraction of
      length-correct private keys that decode in range, which is 10^-418 at
      ML-DSA-44 - a statement about an encoding, not about a hard problem. The
      measurement cost is 4 arms x 3 parameter sets x 10^4 signing operations,
      i.e. about 1.2e5 signatures total.
    memory_exponent: >-
      Negligible. The census is two integer counters per coefficient index; the
      peak working set is one signature plus a 256k-entry band table, under
      100 MB even with transcripts retained.
    best_known: >-
      IN CORPUS - nothing; no ML-DSA experiment, run or evidence record exists,
      and none of the twelve RQ-MLDSA-ffa0f5 proposals tracks key validity.
      EXTERNAL - the pqc-forum thread and the IETF security-considerations draft
      state the object qualitatively and give no rate, no hole, and no artifact;
      the C2SP/wycheproof ML-DSA vector set may already contain a
      malformed-private-key vector and was NOT opened, which is the single most
      likely way this record's exhibition half is already dominated.
    hidden_overhead: >-
      The real cost is writing the second, independent verifier, and it is
      deliberate: a shared implementation would be cheaper and worthless. The
      second hidden cost is that every rate below 3e-4 remains a bound at 10^4
      emissions however the arms are arranged, which no cleverness in the
      estimator removes.
    tradeoff_note: >-
      The trade is budget rather than time against memory. The design buys a
      deterministic exact-zero prediction with a matched placebo at 10^4
      signatures instead of a distributional hypothesis test at an unknown and
      possibly unaffordable sample size. Every arm is embarrassingly parallel
      across keys and messages; nothing here needs a shared table.

  dominated_by: >-
    n/a (no attack, no cost triple, no Pareto point claimed). ROWS ACTUALLY
    CHECKED BEFORE WRITING. (i) All twelve RQ-MLDSA-ffa0f5 proposals, read in
    full or in large part this session - IDEA-20260805-031ce2, -630606, -bb52fa,
    IDEA-20260808-4f83f6, -e5f947, IDEA-20260821-60ba98, -6109f8, -65739b,
    -6d1b97, -71fc18, IDEA-20260828-8f3496, -fa04dc. None tracks key validity;
    bb52fa mentions skDecode only to establish that t0 is always in range, which
    is the CONTRAST this record uses. (ii) The sibling RQ-MLDSA-001, whose scope
    is assumption calibration and fault classes, neither of which is touched.
    (iii) Targeted greps over ledger/proposals for skDecode, malformed key and
    related terms, which return only bb52fa's t0 range annotation and unrelated
    ML-KEM records. (iv) The three cost axes on which a competitor could
    dominate - TIME (about 1.2e5 signatures against the 10^9 a direct rate
    measurement of the ct0 predicate would need), MEMORY (negligible),
    DATA/QUERIES (all queries are to a signer whose key the auditor already
    holds, so there is no query cost in the adversarial sense at all).
    NOT CHECKED, AND SAID SO - whether the C2SP/wycheproof ML-DSA test vectors
    already include malformed-private-key cases, and whether any published
    implementation-security paper measures the accepted-z hole. Absence of a
    search result is never evidence that something was not done.
  sota_delta: >-
    no attack; specification and measurement contribution only. Quantitatively,
    it replaces "skDecode should only be run on input from trusted sources" with
    four numbers per parameter set - the fraction of length-correct keys
    decoding in range (1.0e-418 / 2.0e-704 / 1.6e-784), the broken envelope
    (195 / 539 / 300 against beta 78 / 196 / 120), the guarantee-lapse upper
    bound (0.467 / 0.634 / 0.505), and a measured verification-failure rate -
    plus a three-class partition of malformations into self-enforcing and
    silent, plus a portable artifact tuple a second implementation re-verifies.
    Against the external state of the art the delta is quantification, not
    discovery: the pqc-forum thread and the IETF draft already name the hole and
    stop at "or worse, vulnerabilities".

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    BY PART. (i) That the in-range fractions and the private-key-size
    cross-check survive independent re-derivation, about 0.9 - the packing
    widths are forced by three size identities landing exactly, and the main
    remaining risk is that the packing is signed rather than
    unsigned-then-subtract. (ii) That the specification claim in (A) survives a
    fresh read of FIPS 204, about 0.85 - it is corroborated by two independent
    retrieved external sources, and the residual risk is a normative range
    requirement stated in prose away from the algorithm listing. (iii) That the
    hole census returns an exact zero against a firing placebo, about 0.8 - the
    prediction is deterministic, so the risk is entirely in the counter's band
    arithmetic, which is what the graded sweep is for. (iv) That class R turns
    out SILENT (outcome E2) rather than self-enforcing, about 0.5 - the
    guarantee-lapse bound is an upper bound and the true failure rate could sit
    anywhere below it, which is precisely why the threshold is fixed in advance.
    (v) That this is NEW rather than already sitting in a public test-vector
    corpus, about 0.3, and I would not bet on novelty here.
