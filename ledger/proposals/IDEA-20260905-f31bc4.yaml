idea:
  id: IDEA-20260905-f31bc4
  added: '2026-09-05'
  recorded_at: '2026-09-05'
  title: >-
    THE DL-SPECTRUM CENSUS: tabulate the discrete log of every point of a toy
    prime-order subgroup, Fourier-transform a frozen library of cheap coordinate
    functions in the group-character basis, and read off directly whether any
    coordinate bias concentrates on a structured subset of frequencies -- with the
    2-torsion descent symbol on an even-order curve as the known-true object where
    a coordinate predicate IS a group character and the whole spectrum sits on one
    frequency
  class: measurement
  question_id: RQ-ECDLP-4fcbd3
  question_ids: [RQ-ECDLP-4fcbd3, RQ-ECDLP-002, RQ-CRYPTO-001]
  goal_ids: [GOAL-ECDLP-001, GOAL-CRYPTO-001]
  goal_applicability:
    GOAL-ECDLP-001: >-
      Cheapest decisive gate on the coordinate-bias mechanism: a single exhaustive
      toy computation either measures the obstruction (white spectrum at the Weil
      level, decaying as p^-1/2) or exhibits a frequency set carrying concentrated
      mass, which is the only shape a coordinate distinguisher can take.
    GOAL-CRYPTO-001: >-
      Supplies the pre-registered null that any later coordinate-side proposal must
      beat, and the instrument that detects the two known leaks (2-torsion, pairing)
      so a future positive is not an artifact of a blind instrument.
  status: proposed
  proposed_by: claude-code-session
  claim: >-
    (A) THE OBJECT. Let G = <P> be a subgroup of odd prime order N of E(F_p) and
    log_P: G -> Z/N its discrete logarithm. For any function g: G -> C define its
    DL-spectrum g^(a) = sum over W in G of g(W) * e(a*log_P(W)/N), a in Z/N. The
    spectrum is the exact list of correlations between g and every eigenvector of
    the random-branch walk operator, because on a cyclic group those eigenvectors
    are the characters. "Bias concentrated on a structured subset" has one precise
    meaning in this basis: by Parseval, sum over a of |g^(a)|^2 <= N^2, so a WHITE
    spectrum has |g^(a)| of order sqrt(N) at every a, and any concentration of the
    mass on a set A of frequencies lifts |g^(a)| to about N/sqrt(|A|) on A.
    (B) THE PREDICTIONS, PRE-REGISTERED. For every g in a frozen library of cheap
    coordinate functions (residues x mod m for m <= 64, the low k bits of x and y,
    Legendre symbols of x, x+c, y and of the harness walk's own partition value,
    interval indicators x < p/2^j, the distinguished-point predicate, and the
    r-adding partition function s(W) = x(W) mod r itself), on a prime-order
    subgroup the maximal spike max over a != 0 of |g^(a)| is at the white-noise
    extreme level c_g * sqrt(N * log N) and the fraction of frequencies needed to
    carry half the spectral energy is 1/2 up to O(N^-1/2). Both statistics are
    predicted to follow the same law on the null object (a uniformly random
    function with the same marginal distribution as g, same seed discipline). The
    decay tell is the slope of max spike / sqrt(N) against log p, predicted 0
    within +-0.1 across the toy ladder; a slope of +0.25 or more is the structure
    signature, and a slope that does not decay when the parameter meant to destroy
    it (p) grows is the canonical artifact tell only if it also appears on the null.
    (C) THE KNOWN-TRUE OBJECT. On a cyclic curve of order 2q with one F_p-rational
    2-torsion point T = (e, 0), the coordinate function delta(W) = Legendre symbol
    of (x(W) - e) (with the standard values at O and T) is a group homomorphism to
    {+1, -1} whose kernel has index 2 (recalled: the 2-isogeny descent map; the
    homomorphism property is verified EXHAUSTIVELY in the experiment before use).
    Its DL-spectrum with respect to a generator of the cyclic group therefore sits
    on the single frequency q with |delta^(q)| = 2q. This is Pohlig-Hellman's
    parity leak written in the instrument's language, and the instrument must
    report it as a spike of relative size N^(1/2) above white noise or the
    instrument is void.
    (D) WHAT A POSITIVE WOULD MEAN, WITH THE BREAK-EVEN STATED. A spike |g^(a)| at
    a != 0 is an advantage of about |g^(a)|/N at predicting the DL-character
    predicate cos(2 pi (a log W)/N) from coordinates. IDEA-20260905-b6154d derives
    the break-even: an advantage of N^(-1/4) (a spike of N^(3/4), equivalently the
    energy concentrated on about sqrt(N) frequencies) is where a hard-core-bit
    amplification of cost polylog/eps^2 ties with rho. The Weil-level ceiling for
    bounded-degree coordinate functions is |g^(a)| <= c*deg*sqrt(p), a spike of
    N^(1/2). The whole lane lives in the gap between N^(1/2) and N^(3/4), and this
    census measures where in that gap every cheap function actually sits.
  mechanism: >-
    WHY THIS IS THE RIGHT FIRST MEASUREMENT AND NOT A WALK EXPERIMENT. The walk is a
    middleman. Any coordinate distinguisher that could leak into key recovery must
    correlate with SOME function of the discrete log, and every function of the
    discrete log is a combination of group characters. So the Fourier transform of
    g over the DL-ordering of the group is the complete answer to "is g correlated
    with an eigenvector of the transition operator" for the random-branch operator,
    for every table at once, and it is computable exhaustively at toy scale with one
    tabulation of logs and one FFT of length N. The deterministic coupling that the
    real walk adds (branch chosen by coordinates) is a separate question and is the
    subject of IDEA-20260905-9c4f0c; this record settles the eigenvector question
    first because it is cheaper and because a null here bounds what the walk can add.
    WHY A WHITE SPECTRUM IS EXPECTED, STATED AS THE THEOREM SHAPE THAT WOULD PROVE IT.
    For a bounded-degree rational function f on E and a nontrivial character chi of
    G, the sum over G of chi(W) psi(f(W)) for a nontrivial additive character psi of
    F_p is bounded by c*deg(f)*sqrt(p): the character chi is the trace function of a
    rank-one Lang torsor on E, psi(f) is an Artin-Schreier sheaf, and the Weil bound
    applies to their product on the curve unless the product is geometrically
    trivial, which for odd prime N and an Artin-Schreier sheaf it never is (recalled:
    Bombieri 1966 for the curve bound, Kohel-Shparlinski 2000 for sums over subgroups
    of E(F_p); both are pointers for the reviewer, neither has been opened here).
    Residue classes, low bits and intervals are not algebraic conditions, but each
    expands in additive characters with an l^1 Fourier norm of O(log p), so they
    inherit the bound with a logarithm. The multiplicative case (Legendre symbols of
    a rational function) is bounded the same way unless the Kummer sheaf coincides
    with a Lang torsor of G, which for an order-2 character is impossible when N is
    odd (that coincidence is EXACTLY the 2-torsion positive control) and for an
    order-N Kummer character requires N | p - 1 (that coincidence is EXACTLY the
    pairing transfer, KN-TECH-032). The census therefore has a theorem-shaped null
    with two named exceptions, and the experiment carries one exception as its
    positive control.
    THE LOSSY-PROJECTION TEST. The tracked object is the DL-spectrum of a bounded
    function, which discards the point-by-point values of g (N complex numbers are
    kept, but the retained information is the correlation structure with the group
    law, not the coordinates) and is compatible with the group operation: translation
    by a known multiple of P multiplies g^(a) by a phase, so spectral MAGNITUDES are
    invariant under the walk's affine bookkeeping. That is the property that lets a
    single census speak for every table choice. A change of curve model (Montgomery,
    Edwards) is a rational change of coordinates of bounded degree and leaves the
    bounded-degree class, so the census is model-independent up to the degree
    constant, which is reported.
  novelty_status: unverified
  novelty_screen:
    method: >-
      search_knowledge unavailable in this container (CRYPTO_KB_QDRANT_URL is
      :memory:, index empty). Local grep over ledger/questions, ledger/proposals,
      ledger/hypotheses and knowledge/ for bias, distinguisher, eigenvector,
      transition operator, x-coordinate distribution, exponential sum, character sum,
      Shparlinski, Kohel, hard-core; nearest records read in full or in the sections
      named in citations. The search is incomplete and no global novelty is claimed.
    nearest_internal_record: IDEA-20260905-afa907
    precise_difference: >-
      The neighbour measures the total-variation defect of a feature-only transition
      kernel on tiny cyclic groups (orders 11 and 17) as an approximate-lumpability
      question. This record measures the correlation of a coordinate function with
      every group character at once, on prime-order subgroups up to 2^24, with a
      theorem-shaped null, a decay test in p, a matched random-function null and a
      known-true object. The neighbour's object is a kernel; this record's object is
      a spectrum, and it says nothing about simulators.
    second_nearest: IDEA-20260830-c5c614
    second_difference: >-
      c5c614 measures the yield lift of x-line predicates on the target side of
      factor-base decomposition. This record measures correlation with the discrete
      log itself, which is the quantity a key-recovery reduction consumes; a null here
      bounds the DL-relevant content of any x-line lift, while c5c614's lift can be
      nonzero with a white DL-spectrum.
    scope: No global novelty claim.
