      verified_by: null
  assumptions:
    - >-
      G has odd prime order N and the discrete log of every element is tabulated at
      toy scale by exhaustive enumeration i -> iP, certified on a random sample by
      independent recomputation.
    - >-
      The library of coordinate functions is frozen before any spectrum is computed
      and every member is evaluable from affine coordinates at O(1) field operations
      plus O(log p) bit operations; the walk's partition function and the harness's
      distinguished-point predicate are included so the census speaks to the walk.
    - >-
      Toy scale only, field_bits 12 to 24. No transfer to cryptographic scale is
      offered; the decay slope in p is the only scale statement.
  proof_search_map:
    bottleneck: >-
      The step that would turn a measured coordinate bias into a DL predictor: it
      requires a spike |g^(a)| well above the Weil level sqrt(p) at some a != 0.
      Nothing downstream exists if no such spike exists, so the spike is the exact
      quantity to measure.
    baseline_embedding:
      parameter_slice: >-
        The 2-torsion descent character on a cyclic curve of order 2q, where the
        spike is known to be maximal (|delta^(q)| = 2q); and the random-function null
        with the same marginal as each library member, where the spectrum is white by
        construction.
      reproduction_check: >-
        The instrument must report the descent character's spectrum as a single
        frequency carrying all the energy, and the random null's spectrum as white
        with extreme value at the Gumbel level for N samples; both are exact checks
        at toy scale.
    observation_collision:
      observable: max over a != 0 of |g^(a)| / sqrt(N), and the half-energy frequency fraction
      distinct_preimage_search: >-
        A large spike has two preimages: genuine correlation with a group character,
        and a library member that is itself nearly constant (tiny variance, so a
        normalised spike is inflated by the mean term at a = 0 leaking through poor
        centring). The census centres every g to mean zero exactly and reports
        Var(g) beside every spike, so the second preimage is visible.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The DL-spectrum as a function of the coordinate function, evaluated across
          the frozen library, so that the fibre of "white spectrum" over the library
          is enumerated rather than assumed.
        predicted_gain: >-
          None on the exponent. The gain is a measured obstruction with a slope,
          reusable by every later coordinate-side proposal.
    quantifier_order: >-
      FOR ALL prime-order subgroups in the toy ladder, FOR ALL library members g,
      FOR ALL a != 0: |g^(a)| is at the white-noise extreme level. The alternative
      is an existential: THERE EXISTS a curve family, a member g and a frequency set
      A with |A| << N carrying a constant fraction of the energy, persisting across
      the ladder. Choosing a fresh library member after seeing the spectra is
      excluded; the library is frozen.
    method_ceiling:
      strongest_certifiable_claim: >-
        At toy scale, for the frozen library, the measured maximal spike and its
        decay slope; plus detection of the two known-true objects. The census cannot
        certify that NO cheap function has a concentrated spectrum, only that none in
        the library does, and it says nothing about functions of unbounded degree
        such as deep walk itineraries (IDEA-20260905-9c4f0c).
      nearby_object_control: >-
        The cyclic even-order curve with its descent character (spectrum on one
        frequency), and, as an optional second object, a subgroup of small embedding
        degree with the Tate pairing against a fixed point (a cheap coordinate
        function that is an order-N character). Both are objects on which the white
        spectrum conclusion is KNOWN FALSE and on which the theorem-shaped null's
        hypotheses visibly fail.
    proof_obligations:
      - claim: The tabulated logs are correct (certificate on a random sample).
        responsibility: correctness
      - claim: The descent character is a homomorphism on the control curve (exhaustive check).
        responsibility: baseline
      - claim: White-noise extreme level for N frequencies is the Gumbel level used as the null line.
        responsibility: size
      - claim: FFT of length N up to 2^24 within 8 GB and one tool window.
        responsibility: runtime
      - claim: Toy tier only; no transfer asserted.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: max_spike_over_sqrtN
      direction: different
      minimum_effect: >-
        Null: within a factor 2 of the Gumbel extreme level sqrt(2 log N) for every
        library member at every p, matching the random-function null within the
        bootstrap band. Structure: a member exceeding 8 times that level at the two
        largest p, with a positive slope in log p.
    - metric: half_energy_frequency_fraction
      direction: different
      minimum_effect: >-
        Null: 0.5 +- 0.05 for every member. Structure: a member below 0.1 at every
        p in the ladder. Positive control: below 2/N (one frequency).
    - metric: spike_slope_vs_log_p
      direction: different
      minimum_effect: >-
        Null: slope of log(max spike / sqrt(N)) against log p within +-0.1 of zero.
        Structure: slope at or above +0.25.
    - metric: positive_control_detection
      direction: higher
      minimum_effect: >-
        The descent character's spike at frequency q must be at least N^(1/2)/4
        times the white-noise level, deterministically. Failure voids the instrument.
  minimal_test:
    design: >-
      For field_bits in {12, 14, 16, 18, 20, 22, 24} and three seeds each, generate
      prime-order curves by rejection from the harness generator, enumerate G,
      tabulate logs, evaluate the frozen library, FFT each centred member over the
      DL ordering, and record the max spike, the half-energy fraction, and the
      matched random-function null. On a cyclic order-2q curve per size, run the
      identical pipeline on the descent character. Report slopes across the ladder.
    controls:
      - random function with the same marginal distribution as each member, same
        seed discipline (null object of the same shape)
      - a second curve family per size (random seeds) so the comparison is not
        curve-specific
      - the 2-torsion descent character on a cyclic even-order curve (known-true
        positive control; must be detected)
      - certificate check of the log table on a random sample of 1000 points by
        independent recomputation of iP
    required_metrics:
      - max_spike_over_sqrtN per member per curve, with the null's value beside it
      - half_energy_frequency_fraction per member per curve
      - slope of both against log p across the ladder, with bootstrap intervals
      - positive-control spike and its frequency
      - wall seconds and peak bytes per cell
  falsification_conditions:
    - >-
      A library member's max spike exceeds 8 times the Gumbel level at the two
      largest sizes with a positive slope, AND the same statistic on the
      random-function null stays at the Gumbel level. The white-spectrum claim is
      FALSE for that member; the finding is replicated on a second curve family
      before anything is interpreted.
    - >-
      The descent character is NOT reported as a single-frequency spectrum. The
      instrument is void and no reading from it supports anything.
    - >-
      The random-function null shows spikes above 8 times the Gumbel level. The
      normalisation or the FFT is wrong; instrument defect, nothing is reported.
  confounders:
    - >-
      Poor centring lets the a = 0 term leak into neighbouring frequencies for
      non-power-of-two N; the FFT is exact for any N (Bluestein) and g is centred
      exactly, and this is checked by asserting g^(0) = 0 to machine precision.
    - >-
      The generator's cofactor. A subgroup G with cofactor h > 1 is a legitimate
      prime-order object, but "cheap coordinate function on E" then sees the cofactor
      structure; the primary arm uses cofactor 1 curves and cofactor > 1 curves are a
      separate labelled arm.
    - >-
      The harness partition function is x mod r; at tiny p and large r the residues
      are not equidistributed on E, which is a marginal effect the null shares.
  interpretation_limits:
    - Toy tier. Nothing here is evidence about cryptographic-size curves beyond the
      measured slope, and a slope of zero over 12 bits of p is consistent with a
      structure that appears only at larger p; that is stated, not hidden.
    - A white spectrum for the frozen library says nothing about functions outside
      it, in particular about unbounded-degree cheap functions (deep itineraries).
    - No attack, no exponent moved; the deliverable is a measured obstruction with
      its resource reading (a concentrated spectrum, if found, is the resource
      IDEA-20260905-b6154d's break-even consumes).
  heuristic_assumptions:
    - id: H1
      statement: >-
        White-spectrum heuristic: for every bounded-Fourier-complexity coordinate
        function g on an odd-prime-order subgroup, the DL-spectrum behaves like that
        of a random function with the same marginal, so the maximal spike is at the
        Gumbel extreme level for N independent Gaussian-like coefficients.
      rigorous_support: >-
        The Weil-level bound |g^(a)| <= c*deg*sqrt(p)*polylog(p) for each fixed a
        (recalled: Bombieri 1966 via Kohel-Shparlinski 2000; unverified here), which
        forbids any spike above sqrt(p) polylog but does not itself give the Gumbel
        law; the Gumbel law is the classical extreme-value statement imitated.
      validation_plan: >-
        This record's census: empirical max-spike distribution across the library
        and the ladder versus the Gumbel prediction, with the tail check that the
        single largest spike observed anywhere in the census has a predicted
        exceedance probability above 1/(number of cells * library size).
  target_complexity:
    time_exponent: >-
      No exponent claim. If a member had a spike of N^(3/4) the amplification
      route of IDEA-20260905-b6154d would tie with rho; no member is predicted to.
    memory_exponent: No claim; the census itself is O(N) memory at toy scale.
    best_known: 'Generic rho: 0.886*sqrt(N) group operations, O(1) memory (KN-TECH-006).'
    hidden_overhead: None claimed; the census is a measurement.
    tradeoff_note: Not applicable.
  estimated_cost:
    implementation: low
    compute: low
    note: >-
      Pure Python plus numpy: 2^24 group additions is minutes, an FFT of length
      2^24 is seconds; the whole ladder with three seeds and the library of about
      40 members fits in a few CPU hours.
  recommended_priority: high
  dominated_by: null
  dominated_by_check: >-
    Checked against the frontier rows this record could be dominated by: it is a
    measurement, not an attack, so time/memory dominance does not apply; on the
    data axis it is dominated by nothing in the ledger because no record computes a
    DL-spectrum. Set to null after that check.
  sota_delta: >-
    Zero on the attack exponent by construction. The deliverable is a measured
    upper bound on the DL-spectral concentration of cheap coordinate functions at
    toy scale, with a decay slope, which currently does not exist in the ledger.
  inference:
    policy: research-deep
    requested_policy: research-deep
    reasoning_effort: max
    resolved_model_id: null
    model_verified: false
    fallback_used: false
    degraded_requirements: []
    runtime_provenance: >-
      Authored directly in the top-level Claude Code session at max effort on the
      user's direction, not by a dispatched idea-generator subagent; no batch or
      task envelope exists for it. Model identifier not probed.
