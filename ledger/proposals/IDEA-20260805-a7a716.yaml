idea:
  id: IDEA-20260805-a7a716
  question_id: RQ-FB3-001
  added: '2026-08-05'
  goal_context: GOAL-ICLIFT-001
  title: >-
    The coverage channel of factor-base geometry is bounded by e/(e-1) = 1.581977
    for every base, every N and every m -- and the Bose-Chowla arm that
    DEC-20260724-020 names as its own cheapest overturning control is a control
    that cannot fail
  class: control

  claim: >-
    Two derivable statements about the EXP-FB3-001 measurement apparatus, neither
    of which requires a new battery. FIRST (a bound, not a tally): for any factor
    base D of B distinct elements in a group of order N, under the frozen
    convention (unsigned m-multisets, targets uniform over the whole group,
    one relation harvested per hit target), coverage(D) <= min(1, mu) exactly,
    where mu = C(B+m-1, m)/N is the conserved mean yield. Against a matched
    random base with coverage 1 - e^-mu, the coverage ratio of EVERY geometry is
    therefore at most min(1, mu)/(1 - e^-mu), whose supremum over all mu is
    e/(e-1) = 1.581977..., attained only at mu = 1. The bound is free of N, of m,
    of the curve and of the geometry. The growth clause of RQ-FB3-001 -- an
    advantage that GROWS with N -- is therefore unreachable in this channel not
    for the six pre-registered geometries but for all of them, and that is an
    argument rather than a count of screened mechanisms.
    SECOND (an audit of the control): DEC-20260724-020's next_actions name a
    Bose-Chowla B_3 (Sidon) arm as the cheapest falsifying control and declare
    that it overturns the decision only if its coverage-ratio CI excludes 1
    upward AND its slope versus log2 N excludes 0 upward. A B_3 set has, by
    definition, all C(B+2,3) 3-multiset sums distinct, so its coverage is exactly
    min(1, mu) -- the ceiling -- and its ratio is a function of mu ALONE. The
    frozen matched-size convention B = ceil((6N)^(1/3)) pins mu near 1 at every
    size. The arm's headline number is thus forced by the convention before any
    run, its CI excludes 1 by construction, and the only question left is the
    slope, which is also forced. This proposal predicts both forced values in
    advance and predicts, specifically, that the red team's already-recorded
    coverage ratio of 1.1071 corresponds to mu ~= 0.2071, i.e. to a base about
    1.8x SMALLER than the battery's matched B, and is therefore BELOW -- not 36x
    above -- what an ideal base could reach at the battery's own operating point
    (1.481 / 1.520 / 1.543 at N = 2^14 / 2^16 / 2^18). No attack, no exponent
    improvement, and no claim that any base is good is made anywhere here.

  object_first_candidate:
    tracked_object: >-
      The FULL YIELD HISTOGRAM of a factor base: h_k(D) = #{targets T in the
      group : exactly k unsigned m-multisets from D sum to T}, followed through
      the relation-collection stage. Not the mean (which conservation FIXES at
      C(B+m-1,m)/N for every D), and not the coverage (which is the single
      functional 1 - h_0/N). The object of interest is the direction of the
      histogram that conservation does NOT fix: the second factorial moment
      Coll(D) = sum_k k(k-1) h_k = #{ordered pairs of distinct m-multisets with
      equal sum}. Each such pair is a genuine short vector of the log-relation
      lattice L_D = {v in Z^B : sum_i v_i d_i = 0 mod N}, where d_i = log P_i;
      Coll is the count of the short vectors of L_D that the pipeline can
      actually produce.
    established_families_off_limits: >-
      Declared off-limits as the primary lens for this proposal: (1) the six
      pre-registered EXP-FB3-001 geometries (high_bit_interval, small_height,
      mixed_two_base, coset_union, greedy_optimized, asymmetric_sizing) and any
      relabelling of them; (2) summation-polynomial / Semaev decomposition and
      every variant of the point-decomposition SOLVE; (3) Gaudry-Diem
      extension-field index calculus; (4) negation and automorphism quotients of
      the factor base; (5) sieving and smoothness heuristics; (6) the
      lattice/BKK sparse-elimination family; (7) rho, kangaroo and every
      birthday-type generic method. The proposal does not use any of these as its
      lens. It uses counting on the target space alone.
    newness_score: >-
      The pigeonhole step (each m-multiset sums to exactly one target, so at most
      C(B+m-1,m) targets are covered) is elementary and certainly known outside
      this program. What is not in this corpus is the CONSEQUENCE drawn from it:
      that the geometry channel has a closed-form, N-free, m-free constant
      ceiling of e/(e-1), so the growth clause was decidable before the battery
      ran; and that the battery's own named overturning control inherits that
      ceiling and cannot falsify the decision as specified. EV-FBG-001 records
      the red team's bound min(1, mu)/(1 - e^-mu) <= 1.582 as a cost remark
      inside an evidence record. It has never been derived as a closure, never
      been evaluated at the frozen sizes, and never been used to audit the
      control the decision proposes.
    testability_score: >-
      Maximal. Stage 0 is pen and paper. Stage 1 is arithmetic on nine integers.
      The whole battery re-run at the largest frozen size is about 3 x 10^5
      multiset sums per base, which is seconds in pure Python. numpy 2.4.6 is
      present in this container (verified in session: `python3 -c "import numpy"`
      succeeds); sympy and Sage are ABSENT (both imports fail). Nothing here
      needs any of them.
    survival_score: >-
      The bound survives to arbitrary N and m unchanged, because nothing in it
      depends on either. What does NOT survive is its scope: it holds only under
      the frozen target model (uniform over the whole group) and the
      one-relation-per-hit-target harvest model, and it says nothing at all about
      the solve, the linear algebra, or non-uniform target measures.

  mechanism: >-
    DERIVED IN SESSION; every step below is elementary and is to be re-derived by
    the reviewer rather than taken on trust.

    (1) CONSERVATION (already pre-registered and confirmed by the battery's
    analytic arm, EV-FBG-001). Let D be a set of B distinct elements of an
    abelian group G of order N. Each unsigned m-multiset from D sums to exactly
    one target, so sum_{T in G} Y_D(T) = C(B+m-1, m) =: M1, independent of D.
    Hence the mean yield mu := M1/N is a function of (B, m, N) alone. This is why
    the battery's PRIMARY metric returned exactly 1.000000 for every untyped
    geometry at every size: the metric was vacuous by construction, as
    DEC-20260724-020 states.

    (2) THE COVERAGE CEILING. Coverage is cov(D) := #{T : Y_D(T) >= 1}/N. Since
    at most one target per multiset can be newly covered,
    N * cov(D) <= min(N, M1), i.e. cov(D) <= min(1, mu), with equality if and
    only if the M1 multiset sums are pairwise distinct -- exactly the defining
    property of a B_m (Sidon-m) set. So the ceiling is attained precisely by
    Sidon sets and by nothing else.

    (3) A SHARPER TWO-SIDED FORM linking coverage to the tracked object.
    Write Coll(D) = sum_T Y(Y-1). For every T with Y >= 2 we have
    (Y - 1) <= Y(Y-1)/2, so the number of "wasted" multisets satisfies
    sum_T (Y-1)^+ <= Coll/2, giving
        mu - Coll(D)/(2N)  <=  cov(D)  <=  min(1, mu).
    Coverage is therefore a first-order readout of the collision count and
    nothing more: the entire dynamic range of coverage is controlled by Coll.

    (4) THE NULL'S VALUE. For a uniformly random B-subset the M1 sums behave as
    M1 independent uniform draws to leading order, giving
    cov_rand = 1 - (1 - 1/N)^{M1} -> 1 - e^-mu. This is heuristic (HEUR-FBG-N1
    below) and is the ONLY heuristic step; every other step is exact. It is also
    already measured exactly by the battery's matched-random arm, so the ratio
    bound can be stated against the MEASURED denominator and remain
    unconditional.

    (5) THE CHANNEL BOUND. Combining (2) and (4),
        cov(D)/cov_rand  <=  f(mu) := min(1, mu)/(1 - e^-mu).
    f is continuous, f(0+) = 1, f(1) = e/(e-1) = 1.581977..., f(inf) = 1, and f
    is unimodal with its unique maximum at mu = 1. Therefore for EVERY base D, at
    EVERY N, for EVERY m: the coverage advantage over a matched random base is at
    most e/(e-1) ~ 1.582. A quantity bounded by an absolute constant cannot grow
    with N. The RQ-FB3-001 growth clause is unreachable in this channel by
    argument, not by exhaustion.

    (6) WHY THE FROZEN OPERATING POINT IS THE MOST FAVOURABLE ONE, EXACTLY. The
    matched size B = ceil((6N)^(1/3)) is chosen so that M1 = C(B+2,3) ~ N, i.e.
    mu ~ 1, which is exactly where f peaks. Computing exactly at the frozen sizes
    (session-computed with the integer ceiling, to be recomputed in harness):
      N = 2^14: B = 47,  M1 = 18424,  mu = 1.124512, cov_rand = 0.675200, f = 1.481042
      N = 2^16: B = 74,  M1 = 70300,  mu = 1.072693, cov_rand = 0.657917, f = 1.519949
      N = 2^18: B = 117, M1 = 273819, mu = 1.044537, cov_rand = 0.648146, f = 1.542863
    The ceiling is NOT flat across the frozen sizes: it rises monotonically,
    because ceil((6N)^(1/3)) drives mu down toward 1 from above as N grows. Its
    slope over the three frozen sizes is +0.015455 per bit, and over 2^13..2^24
    it increases monotonically toward e/(e-1). CONSEQUENCE FOR THE FROZEN
    PROTOCOL: the growth clause tests a coverage-ratio slope against a null of
    ZERO. A base that saturated the ceiling at every size would produce a slope
    of +0.0155/bit, not 0. The frozen slope test is therefore mis-specified
    against its own convention: it can register "growth" from a base that is
    merely tracking a drifting ceiling, and it charges a real ceiling drift
    against a hypothesis that never claimed it.

    (7) THE CONTROL AUDIT. A Bose-Chowla B_3 set of size q lives in Z_{q^3 - 1}
    (RECALLED, UNVERIFIED -- the Bose-Chowla construction is recalled from memory
    and its verification is stage 2 of the paired experiment; the B_3 PROPERTY of
    whatever set is used is to be checked directly, which needs no citation). For
    such a set, mu = C(q+2,3)/(q^3 - 1) -> 1/6, so f -> (1/6)/(1 - e^{-1/6}) =
    1.08577..., and at small q: 1.126374 (q=7), 1.110995 (q=11), 1.106945 (q=13),
    1.094074 (q=32), 1.089817 (q=64). The red team's recorded 1.1071 sits inside
    that window, and solving f(mu) = 1.1071 on the mu < 1 branch gives
    mu = 0.207059. PREDICTION, MADE HERE BEFORE ANY LOOK AT THE ARCHIVED
    CONFIGURATION: the recorded Bose-Chowla probe was run at mu ~ 0.207, i.e. at
    a base roughly 6^(1/3) = 1.817x smaller than the battery's matched B, and its
    1.1071 is not "36x the headroom the battery observed" in any comparable
    sense -- it is the Sidon ceiling at a DIFFERENT and less favourable operating
    point, strictly below the 1.481-1.543 an ideal base could reach at the
    battery's own mu. If instead the probe really was run at matched B, then
    since no B_3 set of size 117 exists in Z_{2^18} at all (C(119,3) = 273819 >
    262144 = N, so the sums cannot be distinct by pigeonhole), the recorded set
    was not B_3 and the label is wrong. Both outcomes are informative and one of
    them must hold.

    (8) WHERE THE DYNAMIC RANGE ACTUALLY LIVES. Coverage is capped at ratio
    1.582; Coll is not. Coll(Sidon) = 0 exactly. Coll(random) ~ N mu^2 = M1 mu ~
    M1 = Theta(B^3). So the collision channel has dynamic range Theta(B^3) --
    unbounded and growing with N -- while the channel the battery measured has
    dynamic range bounded by a constant. THE BATTERY MEASURED THE CHANNEL THAT
    IS PROVABLY CONSTANT AND DID NOT MEASURE THE CHANNEL THAT PROVABLY GROWS.
    That is the honest statement of what EV-FBG-001's own boundary line
    ("relation rank and independence were not measured") costs.

    (9) A CORRECTION THIS DERIVATION FORCES, offered for the record and not
    acted on here (no existing file is edited by this proposal). EV-FBG-001
    states that the metrics "score a rank-deficient base (for example logs
    {1..B}) as tied with a random base of the same size". That is true of the
    MEAN metric and false of the COVERAGE metric: for D with logs {1,...,B} the
    3-multiset sums lie in [3, 3B], so cov = (3B-2)/N exactly, which at N = 2^18,
    B = 117 is 349/262144 = 0.00133 against a random base's 0.648 -- a ratio of
    0.002, not 1. The arithmetic-progression base is thus a designed null object
    that the coverage metric detects overwhelmingly, and it belongs in the
    battery as a sensitivity demonstration. Its forced value is exact and it can
    fail.

  novelty_status: unverified

  literature_context:
    - >-
      DEC-20260724-020 (READ in full, this session) -- the scoped rejection of
      H-FB3-001. Its limitations list forbids, correctly, the sentences "the
      coverage channel is closed" and "structured factor bases cannot help index
      calculus". THIS PROPOSAL DOES NOT ASSERT EITHER. It asserts the strictly
      weaker and provable statement that the coverage ratio is bounded by
      e/(e-1), which does not say the channel is closed -- it says the channel
      exists, is worth at most 58%, and cannot grow.
    - >-
      EV-FBG-001 (READ in full) -- records the red-team cost bound
      "min(1, mu)/(1 - e^-mu) <= 1.582, maximized at mu = 1, which is where the
      frozen matched size B places the battery" and the Bose-Chowla coverage
      ratio 1.1071 and greedy 1.0269. The bound is present as an observation; it
      has never been evaluated at the frozen sizes, never used to compute the
      ceiling's slope, and never used to audit the falsifying control. The 1.1071
      is reported as headroom; this proposal predicts it is a forced value of mu.
    - >-
      ANGLE-BRIEF item 28 assigns "Bose-Chowla/Sidon factor-base arm plus the
      slope-vs-log2N clause" to GOAL-RELN-001, and DEC-20260804-2bfc30
      (BATCH-117, "small-x is already optimal") is recorded there as having no
      Sidon arm. NOT READ -- relayed from the brief. This proposal deliberately
      does NOT propose running that arm: it predicts the arm's outcome and shows
      the arm as specified cannot falsify anything. If the prediction is right,
      GOAL-RELN-001 should be told before it spends the compute; if it is wrong,
      this proposal is falsified cheaply. Either way the arm should not be run
      blind.
    - >-
      Bose-Chowla B_h sets, Sidon sets, and the associated q-in-Z_{q^h-1}
      construction: RECALLED, UNVERIFIED. No citation is asserted. Every use of a
      "B_3 set" in the paired experiment is accompanied by a direct verification
      that all C(B+2,3) sums are distinct, which makes the construction's
      provenance irrelevant to the result.
    - >-
      The claim that a uniformly random B-subset's coverage tends to 1 - e^-mu is
      the standard occupancy heuristic and is carried here as HEUR-FBG-N1, not as
      a theorem. It was checked in session at two toy points (N = 4093, B = 29:
      measured 0.66538 versus 0.66653 predicted; N = 16381, B = 47: measured
      0.68153 versus 0.67526 predicted, 5 draws each). THESE ARE SESSION-COMPUTED
      NUMBERS OUTSIDE THE HARNESS, NOT RUNS, and they are to be reproduced
      in-harness before any record cites them.

  lossy_projection_identifiability_audit:
    projection: >-
      Full factor base D (equivalently, the multiset of B discrete logs
      d_1..d_B in Z_N) --> yield histogram h(D) --> coverage cov(D) = 1 - h_0/N.
      The battery projects all the way to the last of these; this proposal stops
      at the middle one and specifically at its second factorial moment.
    what_is_discarded: >-
      The projection D -> h discards WHICH targets are hit and the identity of
      the base elements entirely, retaining only how many targets have each
      multiplicity. It is invariant under any group automorphism and under
      translation of D, and that invariance is what makes it a legitimate
      instance-independent summary. The further projection h -> cov discards
      everything except h_0, i.e. every moment above the first apart from what
      leaks through inequality (3) of the mechanism.
    why_genuinely_lossy: >-
      Massively lossy: the fibre over a given histogram contains
      astronomically many bases (any relabelling of the group by an automorphism
      preserves h). No inversion exists, so this is not a change of coordinates.
      Contrast the canonical failure (Delta, Pi) = (x xor y, x*y) in
      characteristic 2, where the unordered pair is recovered as the roots of
      t^2 + Delta t + Pi and nothing is gained: here nothing is recoverable, and
      the retained part still propagates deterministically because Y_D(T) is
      exactly the per-target success count the relation-collection stage
      consumes.
    is_it_only_a_change_of_coordinates: >-
      No, and the failure this audit actually caught is the MIRROR one, in
      quantitative form. The further projection h -> cov is not constant across
      instances, but its RANGE is bounded: relative to a matched random base it
      lies in [~0, 1.582] and, at the frozen matched size, in a band whose upper
      end moves only from 1.481 to 1.543 across the entire tested N range. A
      comparator whose achievable spread is capped by an absolute constant cannot
      exhibit growth, which is precisely the failure mode the mirror test hunts.
      The check performed was: "is the projection constant, or near enough to
      constant that the pre-registered effect is unreachable?" The answer is the
      second, with the exact ceiling computed. The retained direction that is NOT
      capped is Coll, whose range is Theta(B^3), and that is why the tracked
      object is Coll and not cov.

  assumptions:
    - >-
      The frozen EXP-FB3-001 convention is taken as given: unsigned m-multisets
      of factor-base elements, targets uniform over the whole group, matched size
      B = ceil((6N)^(1/3)), m = 3, one relation harvested per hit target. Every
      statement is scoped to that convention and to no other.
    - >-
      Discrete logs are known by construction, for measurement only, exactly as
      in the frozen battery. No cost, speedup, or attack claim follows from
      anything here (EV-FBG-001 records that counting at 2^18 costs far more than
      solving the same toy ECDLP by rho, and that remains true).
    - >-
      "Matched random base" means a uniformly random B-subset of the group,
      matching only in size. If the battery's matched-random draw range is
      [1, N) rather than [0, N) -- a discrepancy the validator already flagged in
      TASK-20260724-232 -- the difference is O(1/N) and cannot move any
      conclusion here, but it is to be recorded rather than absorbed.

  proof_search_map_note: >-
    This idea is proof-oriented (it proposes a bound and a scoped closure
    argument). Its proof_search_map is carried in full on the paired hypothesis
    H-ICLIFT-d31664 rather than duplicated here.

  predictions:
    - metric: >-
        sup_D cov(D)/cov_random, over every base D, computed as the ceiling
        f(mu) = min(1, mu)/(1 - e^-mu)
      direction: lower
      minimum_effect: >-
        FORCED VALUE, derived before any run: sup = e/(e-1) = 1.5819767...,
        attained only at mu = 1. Any measured coverage ratio above 1.582 at any
        size falsifies the derivation outright (and would mean the counter is
        wrong, since the bound is a pigeonhole).
    - metric: >-
        ceiling f(mu_N) evaluated at the three frozen battery sizes with
        B = ceil((6N)^(1/3)), m = 3
      direction: higher
      minimum_effect: >-
        FORCED VALUES: 1.481042 at N = 2^14, 1.519949 at N = 2^16, 1.542863 at
        N = 2^18. Tolerance for reproduction: exact to 6 decimal places given the
        stated cov_rand formula. A disagreement in the third decimal means the
        matched-size convention was not implemented as documented.
    - metric: >-
        slope of the ceiling f(mu_N) versus log2 N over the three frozen sizes
      direction: higher
      minimum_effect: >-
        FORCED VALUE +0.015455 per bit, strictly positive and monotone over
        2^13..2^24. Consequence to be reported as the headline of this arm: the
        frozen growth-clause null of slope = 0 is the wrong null for a
        ceiling-tracking base.
    - metric: >-
        mu implied by the archived red-team Bose-Chowla coverage ratio of 1.1071,
        recovered by inverting f
      direction: lower
      minimum_effect: >-
        PREDICTED 0.2071 (mu < 1 branch), equivalently a base of size about
        (N)^(1/3) rather than (6N)^(1/3). The alternative root of f(mu) = 1.1071
        is mu = 2.3357, which the matched-size convention excludes. If the
        archived configuration shows neither, the 1.1071 is not a Sidon ceiling
        and its interpretation as headroom must be revisited.
    - metric: >-
        cov of the arithmetic-progression base D with logs {1..B}, at matched B
      direction: lower
      minimum_effect: >-
        FORCED VALUE exactly (3B-2)/N, i.e. 0.001331 at N = 2^18, B = 117,
        against a matched random base's 0.648146 -- a coverage ratio of 0.00205.
        Its MEAN-yield ratio is forced to exactly 1.000000 by conservation. This
        single base demonstrates both that the mean metric is blind and that the
        coverage metric is not, and it is the sensitivity demonstration the
        battery never carried.
    - metric: >-
        Coll(D) = sum_T Y(Y-1) for a verified B_3 base and for a matched random
        base at the same (N, B, m)
      direction: different
      minimum_effect: >-
        FORCED VALUES: exactly 0 for any verified B_3 set (definitional); ~ M1*mu
        for a random base, i.e. ~2.86e5 at N = 2^18. Ratio unbounded. This is the
        quantitative statement that the unmeasured channel has dynamic range
        Theta(B^3) while the measured one is capped at 1.582.

  minimal_test:
    design: >-
      Four stages, cheapest first, each able to terminate the line. STAGE 0
      (pen and paper, zero compute): derive the ceiling and the two-sided
      inequality; if either fails the proposal dies here and nothing else runs.
      STAGE 1 (arithmetic on nine integers, seconds): evaluate the ceiling and
      its slope at the frozen sizes; invert f at 1.1071. STAGE 2 (minutes, pure
      Python + numpy): the mu-sweep with the four designed bases. STAGE 3
      (minutes): the collision counts and the archived-configuration
      reconciliation. Full contract: experiments/EXP-ICLIFT-7c0728.
    controls:
      - >-
        NULL OBJECT (matched random base, same N, same B, same m, same counting
        code). FORCED VALUE DERIVED BEFORE THE RUN: cov = 1 - (1 - 1/N)^{M1},
        equal to 0.675200 / 0.657917 / 0.648146 at the three frozen sizes;
        Coll ~ M1*mu. THIS NULL CAN FAIL: if the measured random coverage
        departs from the occupancy value by more than 2% at any size, HEUR-FBG-N1
        is refuted at that size and every ratio in the battery, past and future,
        needs its denominator restated.
      - >-
        POSITIVE CONTROL / NEARBY OBJECT (a set VERIFIED to be B_3 at the tested
        size, by direct pairwise-distinctness of all C(B+2,3) sums, whatever its
        construction). THE EFFECT MUST APPEAR: its coverage must equal M1/N
        EXACTLY and its Coll must be EXACTLY 0. If it does not, the counter is
        broken and NO negative result may be reported from any arm (inventor
        protocol section 3; AGENTS.md rule 5).
      - >-
        DESIGNED-FAILURE NULL (arithmetic-progression base, logs {1..B}). FORCED
        VALUE cov = (3B-2)/N exactly and mean-yield ratio exactly 1. It CAN fail
        in both directions: a mean ratio different from 1 means conservation is
        mis-implemented; a coverage different from (3B-2)/N means the counter
        double-counts. It is also the demonstration that coverage is a
        sensitive instrument and mean yield is not.
      - >-
        GRADED CONTROL, >= 5 interior points, monotonicity reported. Sweep mu
        over {0.05, 0.2, 0.5, 1.0, 2.0, 5.0} at fixed N by varying B off the
        matched-size convention, and report the measured coverage ratio of the
        B_3 arm against the predicted f(mu). The predicted curve is unimodal with
        its maximum exactly at mu = 1 and tends to 1 at both ends. A measured
        curve that is monotone, or peaks elsewhere, localises the failure to the
        occupancy denominator rather than leaving "it did not work".
      - >-
        ORDERING CONTROL. The null and designed-failure arms are computed,
        recorded and hashed BEFORE the B_3 arm is looked at, and the decision
        rule is executed on the nulls first. If the rule emits the same verdict
        on the random null as on the B_3 arm, it discriminates nothing and is
        rewritten before the treatment arm is read.
      - >-
        ARCHIVE CHECK. The archived EXP-FB3-001 run directories are read for the
        matched-random absolute coverage values and for the red team's
        Bose-Chowla configuration. If they cannot be read, that is recorded as
        an infrastructure observation and the reconciliation arm is reported as
        NOT PERFORMED -- never as agreement.
    required_metrics:
      - the derivation of cov <= min(1, mu), written out, with the pigeonhole step explicit
      - f(mu_N) and its slope at the three frozen sizes, to 6 decimals, with the integer ceiling shown
      - measured coverage and Coll for all four base families at every swept mu
      - the mu recovered by inverting f at 1.1071, and the archived probe's actual (N, B) if readable
      - explicit statement of which stage, if any, terminated the run and why

  falsification_conditions:
    - >-
      Any measured coverage ratio strictly above min(1, mu)/cov_random at any
      cell. The bound is a pigeonhole; exceeding it means the counter is wrong,
      and the whole proposal is void until the counter is fixed.
    - >-
      A verified B_3 set whose measured coverage is not exactly M1/N. Positive
      control failed; no negative may be reported from any arm.
    - >-
      Measured random-base coverage departing from 1 - e^-mu by more than 2% at
      any tested size. HEUR-FBG-N1 refuted there; the ratio ceiling then holds
      only against the measured denominator, and the constant e/(e-1) must be
      withdrawn and replaced by the measured one.
    - >-
      The archived Bose-Chowla probe turning out to have been run at mu ~ 1 with
      a genuinely B_3 set. That is impossible by pigeonhole at the frozen matched
      B, so observing it falsifies either the archived configuration record or
      this derivation, and the discrepancy must be resolved before either is
      cited.
    - >-
      Any demonstration that the frozen convention does NOT harvest one relation
      per hit target -- e.g. that the pipeline consumes all Y(T) decompositions.
      Under a harvest-all model the relations per solve equal the mean and are
      exactly geometry-invariant (EV-FBG-001 already records this), so the
      coverage ratio is not the operative quantity at all and this proposal's
      framing, not its algebra, is wrong.

  confounders:
    - >-
      THE HEURISTIC DENOMINATOR. Only the ratio's denominator is heuristic. Every
      conclusion is stated in two forms -- against the occupancy value and
      against the measured matched-random coverage -- and the second is
      unconditional. Reports that quote only the first are incomplete.
    - >-
      CEILING VERSUS ATTAINMENT. cov <= min(1, mu) does not assert that any base
      attains it; at mu > 1 the ceiling of 1 is unattainable by any set (perfect
      covering designs do not generally exist), and no B_3 set of size
      ceil((6N)^(1/3)) exists at all. Reporting f(mu) as "the achievable
      advantage" would overstate it, and the record must say ceiling, never
      achievable.
    - >-
      CONVENTION DEPENDENCE. Signed sums (+-P_i) change M1 from C(B+m-1,m) to
      roughly 2^m times as large, moving mu and hence f. The bound's FORM is
      unchanged but its numerical evaluation is not, and no number here transfers
      to a signed convention without recomputation.
    - >-
      SELECTION OF THE OPERATING POINT. Because f peaks at mu = 1 and the frozen
      convention sits there, this proposal's ceiling is the most generous one the
      battery could have faced. Quoting 1.582 at an arbitrary operating point
      would overstate the channel elsewhere.

  interpretation_limits:
    - >-
      This bounds the COVERAGE / relation-collection channel only. It says
      nothing about the cost of FINDING a decomposition (the summation-polynomial
      solve), nothing about the linear-algebra stage, nothing about relation rank
      or independence, and nothing about non-uniform target measures. All four
      remain open and all four are where an exponent could still live.
    - >-
      It does not license "structured factor bases cannot help index calculus",
      "the coverage channel is closed", or "the F3 family is dead" -- the three
      sentences DEC-20260724-020 explicitly forbids. A factor of up to 1.582 is
      a real if modest advantage, and the record must say so.
    - >-
      KN-OPEN-001 (whether index calculus can beat rho over prime fields) is
      untouched, as EV-FBG-001 already states for the battery.
    - >-
      Toy claim tier. Every measured number is at N <= 2^20 with known logs. The
      BOUND is scale-free algebra and is not a toy-scale extrapolation; the
      MEASUREMENTS confirming it are toy and are labelled toy.

  heuristic_assumptions:
    - id: HEUR-FBG-N1
      statement: >-
        For a uniformly random B-subset D of an abelian group of order N, the M1
        = C(B+m-1, m) multiset sums behave, for the purpose of occupancy
        statistics, as M1 independent uniform draws from the group; hence
        E[cov(D)] = 1 - (1 - 1/N)^{M1} + o(1) -> 1 - e^-mu.
      rigorous_support: >-
        The first moment is EXACT and needs no heuristic: E[#covered] is
        determined by conservation only in aggregate, but the pairwise
        correlations among multiset sums sharing an element are the entire
        content of the approximation. No rigorous bound is asserted here. What IS
        rigorous is the ceiling cov <= min(1, mu), which is where the load
        actually sits: HEUR-FBG-N1 supplies only the DENOMINATOR of the ratio,
        and the battery has already measured that denominator exactly, so every
        conclusion can be restated unconditionally against the measurement.
      validation_plan: >-
        Measure cov of >= 32 independent random bases at each swept (N, B) and
        compare to 1 - (1-1/N)^{M1}; report the ratio and its spread. Session
        check at two toy points gave 0.66538 vs 0.66653 and 0.68153 vs 0.67526
        (SESSION-COMPUTED OUTSIDE THE HARNESS, 5 draws, not a run, to be
        reproduced).
      falsification_condition: >-
        A > 2% departure at any tested (N, B) with >= 32 draws.
    - id: HEUR-FBG-N2
      statement: >-
        The relation-collection stage harvests at most one usable relation per
        hit target (targets are drawn uniformly and independently, and a repeat
        target contributes no new information).
      rigorous_support: >-
        None. This is a MODEL of the pipeline, inherited from EV-FBG-001's
        red-team cost bound, and it is load-bearing: under the alternative
        harvest-all model the relations obtained per solve equal the conserved
        mean and are exactly geometry-invariant, which makes the geometry channel
        exactly 1 rather than at most 1.582.
      validation_plan: >-
        Not validated by this experiment; it is DECLARED and its two branches are
        both reported. The deliverable states the ceiling under both models
        (1.582 under harvest-one, exactly 1 under harvest-all), so the conclusion
        "no growth in this channel" holds under either and does not depend on
        resolving it.
      falsification_condition: >-
        A documented index-calculus pipeline that extracts more than one
        independent relation from repeated decompositions of the same target;
        this would not overturn the bound but would change which of the two
        models is the operative one.

  target_complexity:
    exponent_moved: >-
      NONE, and deliberately so. This proposal moves no exponent and does not
      claim to. What it does is PROVE that a channel this program has been
      measuring cannot move one: the coverage advantage of factor-base geometry
      is bounded by e/(e-1) uniformly in N and m, so it is a constant-factor
      channel by argument rather than by exhaustion. Stating the exponent
      plainly, as required: the relation-collection stage costs Theta(B/cov) and
      geometry can change that by a factor in [1/1.582, 1.582] and by nothing
      more; the exponent of the stage is set by B and cov ~ min(1, mu), i.e. by
      the matched-size convention, not by geometry.
    memory_exponent: >-
      Unchanged by anything here. The measurement itself is O(M1) time and O(N)
      memory per cell (a target-indexed counter), i.e. about 262144 counters at
      N = 2^18 -- trivial, and stated so that the cost is charged rather than
      omitted.
    best_known: >-
      For the specific question "can a structured factor base beat a matched
      random one on decomposition coverage", the incumbent is EV-FBG-001's
      measured +0.30% inside the battery and the red team's 1.1071 (Bose-Chowla)
      and 1.0269 (corrected greedy) outside it. This proposal predicts all three
      from mu and adds the ceiling they all live under.
    hidden_overhead: >-
      None in the bound (it is exact). In the measurement, the O(N) counter and
      the exact enumeration of C(B+2,3) multisets dominate; both are reported.

  dominated_by: >-
    n/a (no attack or algorithm is claimed). Rows of the frontier checked before
    setting this, as required: (time) rho / kangaroo at O(sqrt(N)) group
    operations -- untouched, and the battery's own record notes exact counting at
    2^18 costs more than solving the toy instance by rho; (memory) rho at O(1)
    memory versus this measurement's O(N) counters -- this proposal is strictly
    dominated as a computation and is not offered as one; (data/queries) no
    oracle or query model is involved; (index-calculus frontier) Gaudry-Diem
    extension-field index calculus, whose advantage EV-FBG-001 records as living
    in the SOLVE, which this proposal does not touch; (prime-field index
    calculus) KN-OPEN-001, open, untouched. Searched within this corpus for a
    prior derivation of the e/(e-1) ceiling: EV-FBG-001's red-team remark is the
    only occurrence of the expression and it is not derived, not evaluated and
    not applied to the control. Absence of a search result is not evidence that
    no prior derivation exists (AGENTS.md retrieval policy).
  sota_delta: >-
    Quantitatively: converts a six-geometry empirical null at three sizes into a
    closed-form ceiling of 1.581977 valid for all bases, all N and all m --
    i.e. from 6 tested objects to all objects, at a cost of zero new compute for
    the argument and minutes for its confirmation. Second component: predicts the
    outcome of a control that DEC-20260724-020 has queued as its own falsifier,
    including the specific value 1.1071 <-> mu = 0.2071, thereby either saving
    that arm's compute or falsifying this proposal. No attack speedup is claimed
    and none follows.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.85 that the ceiling derivation and the frozen-size forced values survive
    review unchanged. It is not higher because the whole argument rests on the
    harvest-one-relation-per-target model (HEUR-FBG-N2), which is a model of the
    pipeline rather than a fact about it, and because the denominator 1 - e^-mu
    is heuristic; if the reviewer prefers the harvest-all model the ceiling
    collapses to exactly 1, which changes the number though not the direction.
    It is not lower because steps (1), (2), (3) and (5) are pigeonhole arithmetic
    with no free parameters, because the battery's own analytic arm already
    confirmed step (1) against 336 measured cells with zero violations, and
    because the red team independently wrote down the same bound.
    Separately: 0.6 that the archived Bose-Chowla probe is found to have been run
    at mu ~ 0.207 as predicted. Not higher because the archived configuration has
    not been read and the inversion has two roots; not lower because the
    predicted value reproduces the recorded 1.1071 to within the q-dependence of
    the Bose-Chowla family (1.1069 at q = 13, 1.1110 at q = 11) with no fitted
    parameter.
