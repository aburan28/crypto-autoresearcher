idea:
  id: IDEA-20260803-fa9839
  question_id: RQ-ICEX-001
  title: >-
    The arity threshold - write down, and validate against a known exponent, exactly how
    cheap the decomposition oracle must be for point-decomposition index calculus to beat
    rho at each arity m
  class: cost-model
  claim: >-
    THE CENTRAL COMPARISON THIS PROGRAM EXISTS TO DECIDE HAS NEVER BEEN WRITTEN DOWN AS A
    FORMULA, AND IT CAN BE, IN CLOSED FORM, WITH ZERO COMPUTE, FROM A CONSERVATION
    IDENTITY THE PROGRAM ALREADY OWNS.
    Charge point-decomposition index calculus over a group of prime order N with a factor
    base of size B, arity m, per-trial decomposition-decision cost D_trial, and sparse
    linear algebra at c_LA * B^2. KN-FIND-007 fixes the expected relations per trial
    EXACTLY and GEOMETRY-INDEPENDENTLY at C(B+m-1,m)/N ~ B^m/(m! N), so the total charged
    cost is forced:
      T(m,B,D) = m! * N * D_trial / B^(m-1)  +  c_LA * B^2,
    minimized at B* = [ (m-1) m! N D_trial / (2 c_LA) ]^(1/(m+1)), giving
      T*(m) = c_LA * (m+1)/(m-1) * B*^2 = Theta( (m! N D_trial)^(2/(m+1)) ).
    WRITING D_trial = N^d, THIS BEATS RHO IF AND ONLY IF d < (m-3)/4. That is the threshold
    the whole prime-field question turns on, and it has consequences immediately:
    at m <= 3 no admissible D_trial >= 1 satisfies it WITHIN THIS MODEL; at m = 4 the
    decomposition oracle must run below N^(1/4); at m = 5, below N^(1/2).
    THE CLAIM IS NOT THAT THIS MODEL IS CORRECT. IT IS THAT THE MODEL IS FALSIFIABLE
    AGAINST A KNOWN ANSWER AND HAS NEVER BEEN CHECKED. Instantiated at N = q^n, m = n,
    D_trial = N^o(1) - the extension-field setting where the answer is known - the model
    predicts exponent 2n/(n+1) and therefore predicts index calculus wins only for
    n >= 4. The exponent reported in the literature for that setting is 2 - 2/n, which
    wins at n = 3. The model is therefore NOT TIGHT, and the discrepancy is not vague: it
    is EXACTLY 2/(n(n+1)) at every n, since 2n/(n+1) - (2 - 2/n) = 2/(n(n+1)) identically.
    FALSIFIED, AS A MODEL, IF the transcribed primary-source exponent for the tested
    extension-field family differs from 2 - 2/n, or if the measured discrepancy against
    this model's prediction is not 2/(n(n+1)) at every n in the transcribed range. EITHER
    OUTCOME IS DECISION-RELEVANT: an exact match localizes the missing ingredient to one
    identified term, and a mismatch means the two-term charge itself is wrong and no
    prime-field corollary may be drawn from it.
  mechanism: >-
    THE DEADLOCK THIS BREAKS IS STRUCTURAL AND IS DOCUMENTED IN SIX GOAL RECORDS.
    GOAL-ICEX-001 exists to decide a charged index-calculus exponent against rho and is
    held "until charged SDEG/MONO/RELN measurement packages exist". GOAL-SDEG-001 defers
    until ECDLP residuals clear. GOAL-RELN-001 defers until PATH prioritizes. GOAL-SIG-001
    defers until capacity. GOAL-PATH-001 will authorize "exactly one next batch when
    capacity opens". GOAL-MONO-001 is paused on a re-scoping question. Each protocol has
    PASSED review; none may run; eight consecutive GOAL-ECDLP-001 batches have executed
    zero experiments. The composition is a measurement deadlock even though every
    individual deferral is defensible.
    THE EXIT DOES NOT REQUIRE A MEASUREMENT. The comparison ICEX was built to make is a
    two-term minimization whose first term is FULLY DETERMINED by KN-FIND-007 - the
    conservation identity is exact, holds for every factor base of size B, and was
    measured at maximum absolute deviation exactly 0 across 144 cells. The only free
    parameter is D_trial. So the ordering of the whole research programme inverts: rather
    than measuring solving degrees and then asking whether they help, WRITE THE THRESHOLD
    FIRST and read off whether any measurable solving degree could land inside it.
    WHAT THAT DOES TO THE DEFERRED MEASUREMENTS, CONCRETELY. GOAL-SDEG-001 measures a
    Semaev solving-degree scaling law; GOAL-DREG-001 measures a degree-of-regularity
    deficit; GOAL-SIG-001 measures a syzygy cascade. Each produces a solving degree
    d_reg(m, p), which converts to a charged D_trial through the standard linear-algebra-
    on-the-Macaulay-matrix charge. The threshold turns each of those numbers into a
    VERDICT rather than a datum: a measured D_trial at or above N^((m-3)/4) closes that
    arity within the model, and one below it is the first positive prime-field signal the
    programme has ever had. Neither reading is currently available, because the threshold
    does not exist in the corpus.
    WHY THE BASELINE-REPRODUCTION GATE IS THE WHOLE EXPERIMENT AND NOT A FORMALITY.
    KN-TECH-080 requires exact bottleneck identification and baseline reproduction before
    a proof-oriented proposal is approved. Here the baseline is available and adversarial:
    the extension-field exponent is KNOWN, so the model can be checked against an answer
    it did not choose. The model predicts 2n/(n+1); the recalled reported value is
    2 - 2/n; the difference is exactly 2/(n(n+1)). Under this model that discrepancy has a
    forced interpretation - the reported algorithm attains linear algebra at
    B = q^((n-1)/n), a SMALLER base than the model's optimum q^(n/(n+1)), at which the
    model's own relation-search term would read q^(2 - 1/n) and DOMINATE. So the reported
    exponent cannot be reached by rebalancing B alone: it requires the relation-search
    term itself to be cheaper than m! N / B^(m-1) trials, which under an exact
    conservation mean can only come from harvesting more than one usable relation per
    trial - the large-prime / partial-relation family. NAMING THAT TERM IS THE RESULT. It
    is the one ingredient the prime-field setting has never been charged for, and whether
    it is portable to prime fields is then a well-posed question rather than a hope.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-03'
    corpus_paths_grepped:
    - ledger/proposals
    - knowledge/findings/KN-FIND-007.md
    - knowledge/open-problems/KN-OPEN-001.md
    - knowledge/open-problems/KN-OPEN-020.md
    - ledger/goals/GOAL-ICEX-001.yaml
    - ledger/goals/GOAL-SDEG-001.yaml
    - ledger/evidence/EV-ICEX-001.yaml
    grep_results:
    - >-
      GOAL-ICEX-001 / EV-ICEX-001 hold a review-only ICEX exponent protocol at design
      PASS, explicitly NOT AUTHORIZED to measure until SDEG/MONO/RELN packages exist.
      THAT PROTOCOL IS THE CLOSEST PRIOR RECORD AND THIS PROPOSAL IS ITS COMPLEMENT, NOT
      ITS DUPLICATE: the frozen ICEX protocol is a MEASUREMENT protocol whose inputs do
      not exist; this is the CLOSED-FORM comparison that says which of those inputs would
      change a verdict. It can be executed while ICEX remains unauthorized and reduces
      ICEX's required measurement surface rather than competing with it.
    - >-
      KN-FIND-007 states the conservation identity and its consequences for MEAN YIELD,
      and explicitly records that it "says nothing about the cost of FINDING a
      decomposition ... or about the linear-algebra stage - which is where the
      index-calculus cost actually sits." This proposal is exactly the composition
      KN-FIND-007 declines to make, with the cost of finding left as a free parameter
      rather than assumed.
    - >-
      IDEA-20260802-007 proposes a charged-unit accounting LIBRARY. That is an
      instrument for measuring costs consistently. This is an ANALYTIC model of what the
      costs must be. Complementary; this proposal needs no library because it runs no
      algorithm.
    - >-
      No corpus record contains the two-term minimization, the optimizer
      B* = N^(1/(m+1)), the exponent 2/(m+1), or the threshold d < (m-3)/4. Grep for
      "m+1", "threshold", "arity" across ledger/proposals returned no such object.
    literature_verified: []
    literature_unverified:
    - >-
      THE EXTENSION-FIELD EXPONENT 2 - 2/n FOR GAUDRY-TYPE INDEX CALCULUS OVER F_{q^n} AT
      FIXED n IS AN UNVERIFIED RECOLLECTION AND IS RECORDED AS EXACTLY THAT. Primary
      sources (eprint.iacr.org, arxiv.org) are unreachable from this environment. THE
      RECOLLECTION MAY NOT BE USED AS EVIDENCE. Transcribing it from a primary source is a
      BLOCKING SUBTASK of the minimal test, and if the transcription yields a different
      exponent the model's gate is evaluated against the transcribed value, not against
      the recollection. If no primary source can be obtained, the baseline-reproduction
      gate is reported UNRUN under AGENTS.md rule 5 and NO prime-field corollary may be
      cited.
    - >-
      The 1/n! decomposition probability for the subfield-line factor base over F_{q^n} is
      recorded in KN-FIND-007 as consistent with the conservation mean (B = q, N = q^n
      gives B^n/(n! N) = 1/n!), which is an internal cross-check available without any
      external source and is used as such.
    conclusion: >-
      Adaptation. Two-term index-calculus cost balancing is standard practice in the
      analysis of every index-calculus algorithm. THE CONTRIBUTION IS NOT THE MODEL: it is
      (i) instantiating it against an EXACT conservation identity rather than a heuristic
      yield estimate, (ii) the explicit threshold d < (m-3)/4 as a screening rule for this
      programme's deferred measurements, and (iii) the exact-discrepancy gate 2/(n(n+1))
      that makes the model falsifiable against a known answer before any prime-field
      conclusion is drawn.
  assumptions:
  - >-
    Sparse linear algebra on a B x B matrix with O(m) nonzeros per row is charged at
    c_LA * B^2 field operations (Wiedemann / Lanczos). The constant c_LA and the field-op
    to group-op conversion are PINNED IN THE CONTRACT BEFORE any threshold number is
    computed. A threshold whose sign depends on c_LA is reported as sign-indeterminate.
  - >-
    Approximately B independent relations are required. Relation RANK is not modelled;
    KN-FIND-007 explicitly records that the conservation mean "scores a rank-deficient
    base as tied with a random base of the same size". Rank deficiency can only make the
    real cost HIGHER, so the model is a LOWER BOUND on cost and its no-go readings are
    conservative in the safe direction, while its positive readings are NOT.
  - >-
    The rho baseline is charged at c_rho * sqrt(N) group operations with c_rho pinned in
    the contract; both the 0.886*sqrt(N) plain and the negation-map variant are emitted so
    that no threshold is quoted under an unstated baseline.
  - >-
    D_trial is the charged cost of deciding ONE candidate target, including forming the
    target, running the decomposition solver, and verifying the output. Amortized
    precomputation (factor-base construction, tables) is charged separately and must be
    stated, not folded into D_trial.
  proof_search_map:
    bottleneck: >-
      The two-term balance between relation search and linear algebra. The exact
      bottleneck claim is that the first term is FULLY determined by the KN-FIND-007
      conservation identity and the free parameter is D_trial alone; every other quantity
      in the model is either exact or a pinned constant.
    baseline_embedding:
      parameter_slice: >-
        N = q^n, m = n, factor base = the subfield line {P : x(P) in F_q} of size ~q,
        D_trial = N^o(1) - the setting in which the answer is externally known.
      reproduction_check: >-
        The model must reproduce, or state its exact signed discrepancy against, the
        transcribed primary-source exponent for that family at every n in the transcribed
        range. PRE-REGISTERED PREDICTION: model exponent 2n/(n+1), transcribed exponent
        2 - 2/n, discrepancy exactly 2/(n(n+1)) - which is an ARITHMETIC IDENTITY and must
        hold to machine precision at n = 2,3,4,5,6 if the transcription matches the
        recollection. Additionally the model must reproduce the 1/n! decomposition
        probability from the conservation identity, which is checkable with no external
        source.
    observation_collision: >-
      The observable is the pair (exponent, optimizing factor-base size). The model
      predicts the pair (2n/(n+1), q^(n/(n+1))); the recalled reported exponent 2 - 2/n
      corresponds to linear algebra at q^((n-1)/n), a DIFFERENT and smaller base at which
      the model's own relation-search term reads q^(2 - 1/n) and dominates. TWO DISTINCT
      PREIMAGES REACH DIFFERENT EXPONENTS THROUGH THE SAME OBSERVABLE, which localizes the
      missing ingredient to the relation-search term rather than to the linear-algebra
      charge. The search for further preimages must cover: harvest-all multi-relation
      yield, large-prime and double-large-prime partial relations, descent reuse across
      targets, and any structure that makes successive trials dependent.
    quantifier_order: >-
      For every fixed arity m >= 2 and every family of factor bases of size B(N), IF the
      charged per-trial decomposition cost satisfies D_trial = N^d with d < (m-3)/4, THEN
      the two-term model's optimum is asymptotically below c_rho*sqrt(N). The quantifier
      order matters and must not be inverted: this is NOT "there exists a factor base",
      and it asserts NOTHING about whether such a D_trial is achievable. The existence
      question is exactly KN-OPEN-001 and is untouched.
    method_ceiling: >-
      The model can never establish a prime-field ADVANTAGE, only a threshold and a set of
      no-go readings, because it leaves D_trial free and takes no position on its
      achievability. Its ceiling as a positive instrument is therefore zero by
      construction, and this must be stated in every deliverable.
    nearby_object_control: >-
      The nearby object is the SAME model with the conservation mean replaced by an
      independently estimated yield. If the threshold's numerical value moves materially
      under that substitution, the model is being carried by the estimate rather than by
      the identity, and the exactness of KN-FIND-007 is not doing the work claimed for it.
  predictions:
  - metric: baseline_reproduction_discrepancy_identity
    direction: same
    minimum_effect: >-
      'Model exponent minus transcribed exponent equals 2/(n(n+1)) to within 1e-12 at
      every n in the transcribed range. This is an arithmetic identity given the two
      exponent expressions and therefore a POINT PREDICTION THAT CAN FAIL - it fails if
      the transcribed exponent is not 2 - 2/n, which would mean the recollection is wrong
      and the gate must be re-evaluated against the true value.'
  - metric: model_optimizer_exponent
    direction: same
    minimum_effect: >-
      'B* = N^(1/(m+1)) exactly, and T* = c_LA*(m+1)/(m-1)*B*^2, verified symbolically
      against the stationarity condition and numerically at m = 2..8 to 1e-12. A
      symbolic-numeric mismatch is an algebra error and blocks everything downstream.'
  - metric: internal_cross_check_decomposition_probability
    direction: same
    minimum_effect: >-
      'The conservation identity at B = q, N = q^n, m = n returns 1/n! exactly for
      n = 2..8. Requires no external source and must hold exactly; it is the only gate
      that survives a total failure to obtain primary sources.'
  - metric: arity_threshold_table
    direction: same
    minimum_effect: >-
      'A committed table of d_max(m) = (m-3)/4 and of the absolute budget
      D_max(m, N) at N in {2^160, 2^224, 2^256, 2^384}, with c_LA and c_rho pinned and
      with the m <= 3 rows reading INFEASIBLE-WITHIN-MODEL. The table is the deliverable
      and must be machine-readable.'
  - metric: deferred_measurement_ranking
    direction: same
    minimum_effect: >-
      'For each of GOAL-SDEG-001, GOAL-DREG-001, GOAL-SIG-001, an explicit statement of
      what measured value of its own primary metric would place D_trial inside the m = 4
      and m = 5 windows, or a statement that its metric does not convert to D_trial and
      why. A goal for which no such statement can be written is reported as
      NOT-THRESHOLD-CONVERTIBLE, which is itself decision-relevant.'
  minimal_test:
    design: >-
      ZERO COMPUTE BEYOND EXACT ARITHMETIC. (1) Freeze c_LA, c_rho, the field-op/group-op
      conversion, and the definition of D_trial in a hash-bound specification BEFORE any
      number is computed. (2) Derive the optimizer and T* symbolically; verify numerically
      at m = 2..8. (3) Run the internal cross-check (conservation identity returns 1/n!).
      (4) BLOCKING SUBTASK - obtain a primary source for the extension-field exponent and
      transcribe it with a quoted excerpt and a hash; if unobtainable, STOP and report the
      gate UNRUN under AGENTS.md rule 5. (5) Evaluate the discrepancy identity against the
      TRANSCRIBED value. (6) Only if (5) passes, emit the arity threshold table and the
      deferred-measurement ranking. (7) Name the missing relation-search ingredient
      implied by the observation collision, and state explicitly whether it is portable to
      prime fields or why that is unknown.
    controls:
    - >-
      BASELINE-REPRODUCTION GATE AS A HARD BLOCKER. Step (6) may not execute if step (5)
      fails or step (4) is unrun. This is the control that distinguishes this proposal
      from writing down a plausible formula: the model is checked against an answer it did
      not choose before it is applied where the answer is unknown.
    - >-
      NULL-OBJECT CONTROL ON THE CONSERVATION IDENTITY. Re-derive the threshold with the
      exact mean replaced by a naive independent-uniform yield estimate. The threshold
      exponent must be UNCHANGED (both give B^m/(m! N) to leading order); if it moves, the
      claimed role of KN-FIND-007's exactness is overstated and must be re-described.
    - >-
      SIGN-ROBUSTNESS SWEEP. Vary c_LA and c_rho over a declared range and report whether
      any threshold row changes sign. Rows whose sign is not robust are marked
      SIGN-INDETERMINATE and may not be cited as no-gos.
    - >-
      RANK-DEFICIENCY DIRECTION CHECK. Confirm in writing that omitting relation rank can
      only lower the modelled cost, so that no-go readings are conservative and positive
      readings are not - and mark every positive reading accordingly.
    required_metrics:
    - symbolic and numeric optimizer verification residuals at m = 2..8
    - conservation-identity cross-check values against 1/n! at n = 2..8
    - transcribed extension-field exponent with source hash and quoted excerpt
    - signed discrepancy against 2/(n(n+1)) at every transcribed n
    - the arity threshold table, machine-readable, with pinned constants
    - per-goal threshold-convertibility statements for SDEG, DREG, SIG
  falsification_conditions:
  - >-
    'F1 - the transcribed extension-field exponent is not 2 - 2/n: the recollection was
    wrong. The gate is re-evaluated against the transcribed value and the discrepancy
    identity 2/(n(n+1)) is WITHDRAWN. This does not by itself void the model.'
  - >-
    'F2 - the model cannot be reconciled with the transcribed exponent by ANY named
    ingredient in the relation-search term: THE TWO-TERM CHARGE IS WRONG. No prime-field
    corollary may be drawn, the threshold table is not emitted, and the failure is the
    reported result.'
  - >-
    'F3 - the optimizer or T* does not verify symbolically: algebra error, everything
    downstream is void.'
  - >-
    'F4 - the conservation cross-check does not return 1/n! exactly: either KN-FIND-007 or
    this instantiation is wrong, and that must be routed to a correction record rather
    than absorbed.'
  - >-
    'F5 - the threshold sign is not robust to the declared constant ranges at m = 4 or
    m = 5: those rows are unusable and must be reported as such rather than quoted.'
  confounders:
  - >-
    THE MODEL OMITS DESCENT. A full index calculus must also express the target in terms
    of the factor base after collecting relations; a descent stage with its own cost is
    not charged here. This makes the model a LOWER BOUND on cost, which is the safe
    direction for no-go readings and the UNSAFE direction for any positive reading. Every
    positive reading must carry this caveat.
  - >-
    D_trial IS NOT A SINGLE NUMBER for a real solver: Groebner cost varies enormously
    across instances and the tail matters more than the mean when trials are repeated
    ~N/B^m times. The model uses an expectation; a heavy-tailed D_trial breaks that. The
    contract must state that the threshold is an expectation-level statement and that a
    measured D_trial with an unbounded second moment does not satisfy it.
  - >-
    c_LA CONFLATES field and group operations. The conversion is a pinned constant here
    and a real modelling choice; the sign-robustness sweep exists to bound its effect and
    does not eliminate it.
  - >-
    THE EXTENSION-FIELD BASELINE IS A DIFFERENT PROBLEM. Reproducing its exponent
    validates the SHAPE of the charge, not the applicability of the model to prime fields,
    where the factor base has no subfield description at all. This is the largest
    interpretive gap in the proposal and must be stated in every deliverable.
  interpretation_limits:
  - >-
    THIS CANNOT ESTABLISH THAT PRIME-FIELD INDEX CALCULUS FAILS, AND IT CANNOT ESTABLISH
    THAT IT SUCCEEDS. It fixes a threshold with D_trial free. KN-OPEN-001 remains open in
    both directions and this record does not narrow it.
  - >-
    THE m <= 3 READING IS WITHIN-MODEL ONLY, AND THE MODEL IS KNOWN NOT TO BE TIGHT - the
    recalled extension-field exponent beats it at n = 3. "No admissible D_trial within
    this model" must NEVER be written as "m <= 3 is impossible". The discrepancy is the
    proposal's own headline finding and forbids that reading.
  - >-
    No claim tier above `toy` is available for any threshold number until the pinned
    constants are themselves validated against a measured implementation, which this
    proposal does not do.
  - >-
    Nothing here bears on the security of any deployed curve or scheme.
  heuristic_assumptions:
  - id: HEUR-AT-1
    statement: >-
      Expected relations per trial equals the conservation mean C(B+m-1,m)/N, i.e. trials
      are independent and the per-target count concentrates well enough that an
      expectation-level charge predicts the total.
    rigorous_support: >-
      The MEAN is EXACT and geometry-independent - that is the theorem content of
      KN-FIND-007, measured at maximum absolute deviation exactly 0 across 144 cells.
      INDEPENDENCE AND CONCENTRATION ARE NOT PROVED. KN-FIND-007 itself bounds the
      one-relation-per-target correction at min(1,mu)/(1 - e^-mu) <= 1.582, so the
      constant-factor exposure is bounded; the tail exposure is not.
    validation_plan: >-
      Report the threshold under BOTH the harvest-all and one-relation-per-target
      conventions and require the exponent to be identical under both (it is; only the
      constant moves, by at most 1.582). A convention under which the exponent moves
      indicates the charge is wrong. TOY SCALE and analytic only.
  - id: HEUR-AT-2
    statement: >-
      Sparse linear algebra at B x B with O(m) nonzeros per row costs Theta(B^2) and no
      structured-solve improvement changes that exponent.
    rigorous_support: >-
      Standard for Wiedemann/Lanczos. NOT UNIVERSAL: EV-STR-002 measured a structured
      solve beating Wiedemann by 3x-90x at B >= 55 on endomorphism-invariant bases, and
      EV-STR-003 subsequently WITHDREW the comparative limb of that claim while leaving the
      phi_alpha metric UNADJUDICATED. So a displacement-rank improvement is neither
      established nor excluded in this corpus.
    validation_plan: >-
      Emit the threshold under a parameterized linear-algebra exponent
      c_LA * B^(2 - eps) and report d_max(m, eps), so that any future structured-solve
      result reads off its own consequence rather than invalidating the table. eps = 0 is
      the headline row and every other row is explicitly conditional.
  - id: HEUR-AT-3
    statement: >-
      The reported extension-field exponent 2 - 2/n is attained by an algorithm whose
      relation-search term is cheaper than m! N D / B^(m-1) trials, and the responsible
      ingredient is partial-relation (large-prime) harvesting rather than a different
      linear-algebra charge.
    rigorous_support: >-
      DERIVED WITHIN THIS PROPOSAL AND NOT VERIFIED. It follows from the observation
      collision - at B = q^((n-1)/n) the model's relation-search term reads q^(2 - 1/n)
      and dominates q^(2 - 2/n) - so rebalancing B alone cannot reach the reported
      exponent. The specific attribution to large-prime harvesting is an INFERENCE FROM
      ELIMINATION and is the weakest link in the proposal.
    validation_plan: >-
      Confirm or refute against the transcribed primary source directly. If the source
      does not identify the ingredient, the attribution is recorded UNVERIFIED and the
      portability question to prime fields is deferred rather than answered. NEVER assert
      the ingredient from elimination alone in a deliverable.
  target_complexity:
    time_exponent: >-
      No attack is proposed and no exponent is claimed. The OBJECT produced is the
      function d_max(m) = (m-3)/4 relating a free parameter to the rho crossover.
    memory_exponent: >-
      B* = N^(1/(m+1)) elements at the optimum, emitted alongside every time row so that a
      threshold is never quoted without its memory. At m = 5 and N = 2^256 that is
      2^(256/6) ~ 2^42.7 stored elements, which is itself a feasibility constraint the
      table must show.
    best_known: >-
      Pollard rho at c_rho*sqrt(N); prime-field index calculus has NO known advantage
      (KN-OPEN-001) and this programme's single support verdict for it was retracted
      (EV-IC-002).
    hidden_overhead: >-
      Descent is omitted; relation rank is omitted; D_trial tail behaviour is omitted. All
      three push real cost UP relative to the model, which is stated as the reason no-go
      readings are conservative and positive readings are not.
    tradeoff_note: >-
      The whole object IS a tradeoff curve: relation search falls as B^-(m-1) while linear
      algebra rises as B^2, and the threshold is the value of the balance point against
      sqrt(N).
  dominated_by: >-
    Not applicable as an attack - no algorithm is proposed and no Pareto point is claimed.
    Written explicitly rather than left null. As an ANALYTIC INSTRUMENT the incumbent is
    the absence of any written comparison, which is what GOAL-ICEX-001's eight-batch
    deferral chain rests on.
  sota_delta: >-
    Zero on every ECDLP cost axis; no attack, no measurement, no exponent moved. The
    instrument delta is from six goals deferring a comparison that has never been written
    down, to a committed threshold table plus a per-goal statement of what each deferred
    measurement would have to read to change a verdict.
  instrument_failure_guards:
    decision_variable: >-
      The signed discrepancy between the model exponent and the TRANSCRIBED
      extension-field exponent, and the threshold table's sign robustness.
    what_would_make_it_vary: >-
      The arity n of the extension-field baseline, which is an externally fixed knob with
      a known and monotone predicted effect - the discrepancy must fall as 2/(n(n+1)),
      from 0.3333 at n=2 to 0.0476 at n=6. A discrepancy that does not track that curve
      means the model is not responding to the parameter it claims to model.
    power_against: >-
      An incorrect two-term charge, an algebra error in the optimizer, a wrong
      instantiation of the conservation identity, and a threshold whose sign is an artifact
      of unpinned constants.
    no_power_against: >-
      Whether any prime-field factor base achieving a given D_trial EXISTS - the model is
      silent by construction and this is its central limitation. Also: descent cost,
      relation rank, D_trial tail behaviour, and any question about deployed curves.
    demonstrated_movement: >-
      BY THE BASELINE GATE, WHICH IS A KNOWN-ANSWER CASE. The instrument is required to
