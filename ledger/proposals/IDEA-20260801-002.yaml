idea:
  id: IDEA-20260801-002
  question_id: RQ-DREG-001
  title: >-
    Direct d_reg(n) measurement without Gröbner solve: pivot-degree Hilbert
    function on the chained boolean Semaev system at m=3, t=3
  class: measurement
  claim: >-
    The boolean chained Semaev (m=3, t=3) system's graded pivot-degree Hilbert
    function, computed by exact row-echelonization of the full-column
    Macaulay-like matrix at each degree, decides whether d_reg(n) tracks the
    T11-support-matched semi-regular null or departs non-generically, without
    ever running a Gröbner basis solve and without subset-column coranks
    (which are artifacts per h012 finding iv).
  mechanism: >-
    The solving degree equals the first degree at which the leading-coefficient
    pivot structure of the homogenized system becomes full-rank-stable; the
    graded pivot-degree Hilbert function exposes exactly that sequence. Full
    column sets at each degree are admissible evidence under the goal; subset
    columns are not. Implement an exact linear algebra pass over the full
    degree-by-degree column sets and read off gap(n) = d_reg(n) - d_ff(n)
    directly.
  novelty_status: adaptation
  novelty_screen:
    screened_on: '2026-08-01'
    corpus_paths_grepped:
      - knowledge/literature
      - ledger/proposals
    grep_results:
      - No existing proposal measures the graded pivot-degree Hilbert function
        on this exact system.
      - Semi-regular null and degree-of-regularity theory are established
        literature; the adaptation is the measurement route.
    conclusion: >-
      Known technique (Hilbert function, semi-regular bound) applied to the
      exact boolean chained Semaev m=3,t=3 system; novelty is the measurement
      lane, not the mathematics.
  assumptions:
    - Exact row-echelonization of full-column sets is tractable at the n range
      where the null-vs-departure decision is expected.
    - Full-column rank at every degree is computable without materializing the
      entire matrix at once.
  predictions:
    - metric: gap(n)_vs_semiregular_null
      direction: different
      minimum_effect: >-
        Any nonzero gap(n) sequence that diverges from the T11-matched
        semi-regular null at 3+ consecutive n constitutes a departure signal
        (bounded d_reg or growing deficit), per the goal's evidence rules.
  minimal_test:
    design: >-
      Implement the pivot-degree Hilbert function pass; run on the same frozen
      boolean chained system as the prior experiments; compare gap(n) to the
      T11-support-matched semi-regular null at n in the goal's committed range;
      emit the decision for RQ-DREG-001.
    controls:
      - Subset-column corank pass as a negative control (must be labeled artifact).
      - Null system with matched T11 support as a calibration control.
    required_metrics:
      - gap(n) sequence
      - full-column rank at each degree
      - run wall-clock and memory at each n
  falsification_conditions:
    - The Hilbert function pass yields a gap sequence identical to the
      semi-regular null at all n tested (tracks the null; KILL of the
      sub-rho scenario in scope).
    - The pass yields a growing gap(n) with bounded d_reg (departure;
      sub-rho scenario not killed).
  confounders:
    - Homogenization convention shifting d_reg by constants.
    - Field-size and degree-truncation artifacts in exact pivoting.
  interpretation_limits:
    - Toy-scale n only; no crypto-scale claim.
    - The measurement discriminates null-vs-departure, not ECDLP hardness.
  heuristic_assumptions:
    - id: HEUR-DREG-HILB-1
      statement: >-
        The graded pivot-degree Hilbert function of the homogenized boolean
        chained Semaev system has its first full-rank-stable degree equal to
        the system's solving degree d_reg(n).
      rigorous_support: >-
        Standard Gröbner-basis / Hilbert-function theory for zero-dimensional
        ideals over finite fields (semi-regularity literature).
      validation_plan: >-
        Compare against a direct F4/F5 solve on the same instances at small n;
        agreement is the validation.
  target_complexity:
    time_exponent: n/a (measurement; cost is exact linear algebra on toy n)
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: null
  sota_delta: >-
    No complexity claim. Value is a measurement route that avoids a Gröbner
    solve while respecting the goal's admissible-evidence rules.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
