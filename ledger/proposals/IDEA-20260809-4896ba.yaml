idea:
  id: IDEA-20260809-4896ba
  question_id: RQ-FIND-001
  added: '2026-08-09'
  title: 'The knowledge corpus has no back-pressure from evidence: zero of 89 KN-TECH and zero
    of 58 KN-FIND entries have ever been superseded, three of the four declared supersession edges
    have a null back-edge, and no tool checks -- so superseded content is still cited as live'
  class: control
  claim: 'Every knowledge entry carries a superseded_by field and CLAUDE.md rule 2 makes supersession
    the ONLY legal way to correct one. Re-measured at HEAD: knowledge/techniques 0 of 89 non-null
    superseded_by; knowledge/findings 0 of 58; knowledge/open-problems 1 of 28; knowledge/literature
    3 non-null against 4 declared forward edges. Eight entries declare a forward supersedes: --
    KN-TECH-058 -> KN-TECH-029, KN-TECH-6c0e15 -> KN-TECH-9d21c4, KN-TECH-1a5b7e -> KN-TECH-6c0e15,
    KN-OPEN-028 -> KN-OPEN-027, plus KN-LIT-7674/7642/7607/7640 -- and only ONE back-edge in the
    TECH/OPEN set was ever written. So KN-TECH-029 reads superseded_by: null although KN-TECH-058''s
    own title is ''supersedes KN-TECH-029''s classical F_p^2 figure'', and 20 ledger records cite
    KN-TECH-029; KN-TECH-6c0e15 is simultaneously superseder and superseded and reads null, with
    7 records citing it and 7 citing KN-TECH-9d21c4 including GOAL-MLKEM-004 and four decisions.
    No script in tools/ validates the back-edge (superseded_by appears only in build_source_index.py
    as a passthrough, and in run-manifest supersession code that never touches knowledge). Structurally:
    CLAUDE.md''s typical loop names a knowledge-PROMOTION gate and names no demotion or supersession
    gate anywhere; there is no Coordinator queue for owed back-edges and no measurement of how
    many live entries an evidence record has since contradicted.'
  mechanism: 'Two deliverables, both zero-compute, and the second is the interesting one. (1)
    MECHANICAL BACK-EDGE AUDIT: for every declared supersedes: in knowledge/, check the target''s
    superseded_by:, and report the citation count of every entry that is superseded-in-fact but
    null-in-record. Add it to tools/validate_ledger.py so the next one cannot land silently. (2)
    REVERSE-PROMOTION SCAN: for each KN-TECH/KN-OPEN entry with superseded_by: null, ask whether
    any committed evidence record contradicts its stated Current-state. Run it on a PRE-REGISTERED
    SAMPLE rather than the whole corpus, so the recall of the scan itself is measurable rather
    than asserted. NULL-OBJECT CONTROL, and it matters here: if the scan finds nothing outside
    the four already-declared cases, the corpus really is current and the null back-edges are
    a bookkeeping nit rather than a research defect -- a genuinely reassuring outcome the register
    should be able to record, and the one this proposal must be willing to return.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-09'
    grep_results:
    - 'Three separate proposals each hit their own instance and patched only their own, which
      is the signature of a mechanism nobody owns: IDEA-20260805-1f4a11 (''all three with superseded_by:
      null, all three internal''), IDEA-20260805-c4f675 (''Both have superseded_by: null, so neither''),
      and IDEA-20260805-5b8f95, which names the cause and its own powerlessness -- ''to set superseded_by
      on the old entry is a Coordinator act this record [cannot take]''. None counts the corpus,
      none names it as a mechanism, and their titles show them to be a BKK-trichotomy proposal
      and an AES-baseline proposal respectively. IDEA-20260807-5a8d61 audits ONE closure series
      (2026-08-04) for missing reviews and owed promotions -- a batch''s review artifacts, not
      the corpus''s supersession graph -- and does not touch KN-TECH-029/058, KN-TECH-6c0e15/9d21c4/1a5b7e
      or KN-OPEN-027/028. Verified: only 4 proposals mention superseded_by at all, and all four
      are the instance-level patches above plus IDEA-20260725-004 (a decision-quantity contract
      block).'
    conclusion: Screened against all 459 records in ledger/proposals, 271 in ledger/hypotheses
      and knowledge/; external novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any cryptographic claim. The object is the SUPERSESSION
      EDGE in the knowledge corpus.'
    tracked_object: Per knowledge entry, the pair (declared forward `supersedes`, target's `superseded_by`
      back-edge) plus the entry's live citation count.
    one_step_propagation_rule: A supersession is complete iff both edges exist; the graph composes
      and its incompleteness is exactly computable.
    newness_score: Nil as mathematics. This is the demotion half of a promotion pipeline that
      has only ever run in one direction.
  lossy_projection_identifiability_audit:
    projection: the knowledge corpus -> its supersession graph.
    what_is_discarded: All content; only the edges remain.
    is_it_only_a_change_of_coordinates: 'NO -- the back-edges are missing, so the graph as recorded
      differs from the graph as intended. Honest caveat: the mechanical half is bookkeeping.'
    mirror_failure_check: CHECKED. One back-edge in the TECH/OPEN set WAS written, so the corpus
      can express a complete edge and the audit is not measuring an impossible standard.
  null_object_control:
    primary_null: 'THE NULL-OBJECT OUTCOME MATTERS HERE AND MUST BE ACCEPTABLE: if the reverse-promotion
      scan finds nothing outside the four already-declared cases, the corpus really is current
      and the null back-edges are a bookkeeping nit rather than a research defect. That is a genuinely
      reassuring result the register must be willing to return.'
    secondary_nulls:
    - 'PRE-REGISTERED SAMPLE: run the reverse scan on a sample fixed in advance so the scan''s
      own recall is measurable rather than asserted.'
  assumptions: []
  predictions:
  - metric: knowledge entries superseded-in-fact but null-in-record
    direction: higher
    minimum_effect: Three are already identifiable (KN-TECH-029, KN-TECH-6c0e15, KN-OPEN-027);
      the deliverable is their live citation counts.
  - metric: live entries a committed evidence record contradicts
    direction: different
    minimum_effect: Any nonzero count outside the declared four is a reverse-promotion backlog.
  minimal_test:
    design: Mechanical back-edge audit over all declared `supersedes` edges with citation counts;
      then a reverse-promotion scan on a pre-registered sample of null-superseded_by entries against
      committed evidence.
    controls:
    - pre-registered sample for measurable recall
    - null-object acceptance
    required_metrics:
    - incomplete-edge list with citation counts
    - reverse-scan hit rate on the pre-registered sample
  falsification_conditions:
  - 'Every declared supersession already has its back-edge: the mechanical half is unfounded.'
  - 'The reverse scan finds nothing beyond the declared four: the corpus is current, which is
    the reassuring outcome and must be recorded as such.'
  - 'The scan''s recall on the pre-registered sample is too low to interpret: the instrument is
    unusable and no backlog claim is admissible.'
  confounders:
  - '`supersedes` can mean ''refines'' rather than ''replaces''; the audit must read the pair
    before calling an edge owed.'
  - A high citation count on a superseded entry is not proof anyone was misled.
  - Reverse-promotion judgements are interpretive and should be proposed, not applied.
  interpretation_limits:
  - Corpus hygiene. No cryptographic claim.
  - Setting superseded_by is a Coordinator act, as IDEA-20260805-5b8f95 already records about
    itself; this record supplies the audit.
  heuristic_assumptions:
  - id: HEUR-KSUPR-1
    statement: An entry cited N times and superseded in fact has misled at least one reader.
    rigorous_support: None; citation is not reading.
    validation_plan: Report citation counts as exposure, not as harm.
  target_complexity:
    time_exponent: n/a
    memory_exponent: n/a
    best_known: n/a
    hidden_overhead: n/a
    tradeoff_note: n/a
  dominated_by: n/a (no result claimed; corpus supersession audit)
  sota_delta: 'ZERO on every attack axis; no attack is proposed. The knowledge corpus is what
    every ideation session reads by default and what the novelty screen greps. If it cannot be
    corrected downward, its error rate only grows and the growth is invisible: a reader landing
    on KN-TECH-029 today gets a figure the corpus itself has superseded, with no warning, and
    20 records already cite it. This is the demotion half of a promotion pipeline that has only
    ever run in one direction.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 0.95 that the mechanical audit confirms the missing back-edges (three
    are already identified). 0.45 that the reverse scan finds anything beyond the declared four
    -- the corpus may simply be current, and that outcome is as valuable as the alternative.
