idea:
  id: IDEA-20260805-2f2863
  question_id: RQ-SNOVA-001
  added: '2026-08-06'
  title: >-
    A weak-key density is not a cost until you know which group fixes it: the
    orbit-invariance dichotomy that decides whether SNOVA's weak-key family is
    a caveat, a work multiplier, or nothing at all
  class: cost_model_audit

  claim: >-
    Every use of a weak-key density delta as a security statement assumes,
    silently, that the attacker cannot move a target key into the weak class.
    For SNOVA that assumption is decidable, cheaply, and it decides between
    three completely different threat statements. Let Gamma be the
    self-reduction group of the scheme: the transformations L of the variable
    space that keep a public key inside the SNOVA family and for which a break
    of P o L yields a break of P. Under the recalled structure Gamma contains
    GL_n(F_q[S]) acting by A-linear change of the n ring coordinates, and
    breaking P o L recovers L^{-1}(O), hence O. THE DICHOTOMY, DERIVED BELOW
    AND EXACT: if the weak-key predicate W depends only on the secret CENTRAL
    MAP, it is constant on Gamma-orbits, the attacker cannot randomize into the
    weak class, and delta is a genuine per-key density - a real caveat, and a
    1/delta multiplier only for an attacker who gets to choose among many
    targets. If instead W depends on the secret TRANSFORMATION or equivalently
    on the oil space, it is NOT constant on Gamma-orbits, the attacker composes
    a single fixed target with random L in Gamma until a weak representative
    appears, and delta stops being a probability the defender enjoys and
    becomes 1/delta units of the attacker's own work against EVERY key - which
    converts a weak-key result into a universal one at a stated price. The two
    readings differ in kind, not in magnitude, and nothing in this program
    currently distinguishes them. The audit that distinguishes them needs no
    attack, no solver, and - in its decisive form - no compute at all.
    GOAL-SNOVA-001's next_action forbids restating this program's inherited
    secondhand weak-key figures; no numerical density appears anywhere in this
    record, and none is needed, because the dichotomy is about the symbol
    delta, not its value.

  object_first_candidate:
    tracked_object: >-
      The weak-key indicator W as a FUNCTION ON THE ORBIT SPACE of the
      self-reduction group Gamma. Followed through: key generation samples
      (central map F, transformation T) -> the public map P = F o T -> the
      Gamma-orbit of P -> the restriction of W to that orbit -> the single
      quantity carried to the end, namely whether W is constant on the orbit
      and, if not, the fraction of the orbit on which W holds. The object is a
      function on orbits, not a key and not an attack.
    established_families_off_limits: >-
      Off-limits as the primary lens: the wedge-product attack, MinRank and
      rectangular MinRank, Kipnis-Shamir, reconciliation, intersection attacks,
      direct Groebner solving, hybrid guess-and-solve, quantum MQ solvers, and
      every implementation attack. Also explicitly off-limits: searching for a
      NEW weak-key family. This proposal deliberately does not hunt weak keys.
      It audits what a weak-key density means once one exists, which is the
      question that determines how any such result must be costed and which no
      record in this corpus asks.
    newness_score: >-
      The self-reducibility of multivariate schemes under isomorphism-of-
      polynomials transformations is old, and the observation that a
      random-self-reducible problem cannot have a nontrivial weak-instance
      density is a standard piece of complexity folklore. No novelty against
      the literature is claimed. What is new as a record here is the
      application to SNOVA's weak-key story specifically, with the group named,
      the dichotomy stated as a decision procedure over a closed list of
      predicate shapes, and forced invariance rates derived for each shape
      before any computation.
    testability_score: >-
      Very high and unusually cheap, because the decisive version is a reading
      task: once the weak-key criterion is written down, whether it is a
      function of F alone is answered by inspection. The computational backup -
      measuring orbit-invariance rates for a closed list of synthetic predicate
      shapes at toy parameters - runs in pure Python and does not depend on
      obtaining any attack paper, which matters given that this corpus's own
      network survey records ePrint PDF bodies returning 403.
    survival_score: >-
      The object survives to a categorical verdict rather than a number, which
      is its strength and its ceiling: it says which of three threat statements
      is the right one, and it never says how expensive the attack is.

  mechanism: >-
    SOURCE DISCIPLINE, STATED FIRST BECAUSE THIS PROPOSAL IS ABOUT A REPORTED
    RESULT. GOAL-SNOVA-001's next_action explicitly forbids restating the
    secondhand weak-key density, margin-loss and SNOVA-I figures carried in the
    goal and question records. NONE OF THEM APPEARS IN THIS RECORD, and the
    derivation below is written entirely in terms of the symbol delta so that
    it cannot accidentally launder one. Sources touched in this session,
    2026-08-06: https://snova.pqclab.org/ FETCHED (HTTP 200, model-rendered),
    giving the eleven parameter rows and the ring definition;
    https://eprint.iacr.org/2026/237 ABSTRACT PAGE FETCHED, body NOT READ. THE
    WEAK-KEY PAPER ITSELF WAS NOT IDENTIFIED, NOT FETCHED AND NOT READ IN THIS
    SESSION; its existence is known here only as a relayed claim inside this
    program's own RQ-SNOVA-001 record, which itself labels the claim
    unverified. Locating it and filing it as a KN-LIT entry from primary text
    is Stage 0 and is the goal's own declared prerequisite.

    THE GROUP. Under the recalled structure (RECALLED, UNVERIFIED, and the
    branch this shares with IDEA-20260805-70aa6e and IDEA-20260805-54723a) a
    SNOVA public map is P = F o T with F the central map and T in GL_n(A),
    A = F_q[S]. For any L in GL_n(A) the composite P o L = F o (T L) is again a
    public map of the same family, produced by key generation with probability
    equal to that of any other, and its oil space is L^{-1}(O). An algorithm
    that recovers the oil space of P o L therefore recovers O by applying L.
    So Gamma = GL_n(A) is a genuine SELF-REDUCTION group: it is a group of
    transformations the attacker can apply, for free, to a target it did not
    choose, without losing the ability to translate a success back. That is the
    whole engine of the argument and it requires no cryptanalysis.

    THE DICHOTOMY. Write W(F, T) in {0, 1} for the weak-key indicator. Gamma
    acts by T -> T L and fixes F. Two extreme shapes:
      SHAPE-F. W(F, T) = W_0(F) depends on the central map only. Then W is
        CONSTANT ON EVERY Gamma-ORBIT, invariance rate exactly 1. The attacker
        gains nothing by randomizing; delta is a genuine density over key
        generation. The correct threat statement is multi-target: an adversary
        with K independent targets expects K delta weak ones, and 1/delta is
        the number of TARGETS needed, not the work per target. A single fixed
        target is weak or it is not, and no amount of the attacker's work
        changes that.
      SHAPE-T. W(F, T) = W_1(T) or W_1(O) depends on the transformation or the
        oil space. Then Gamma acts transitively on the relevant data, W is NOT
        constant on orbits, and the orbit fraction on which W holds is delta
        itself. The attacker draws L uniformly, tests W on P o L, and repeats;
        expected 1/delta draws, each cheap, for EVERY target. delta has left
        the defender's side of the ledger entirely and become a work multiplier
        1/delta on a universal attack. Whether that is dangerous depends only
        on whether 1/delta times the cost of the weak-key attack beats the
        generic attack - which is a comparison this program can make once, in
        arithmetic, with no new cryptanalysis.
      SHAPE-MIXED. W depends on both. The relevant quantity is then the maximum
        over the orbit, and the honest statement is a bound between the two
        extremes with the orbit-fraction measured rather than assumed.
    A THIRD CONSEQUENCE THAT FALLS OUT AND IS WORTH MORE THAN EITHER. If the
    scheme is genuinely self-reducible under Gamma and W is of SHAPE-T, then a
    weak-key attack at cost C and density delta is exactly an attack on ALL
    keys at cost C/delta, so the published security level of every parameter
    set is at most log2(C/delta) - a bound that follows from the weak-key
    result alone, with no new attack, and which nobody has to run anything to
    obtain. If instead W is of SHAPE-F, no such bound follows and the weak-key
    result is genuinely a statement about unlucky key generation, repairable by
    a rejection-sampling tweak in key generation - which is a concrete,
    cheap, and checkable Round-3 remedy that this audit would be able to name.
    THE AUDIT THEREFORE PRODUCES A DELIVERABLE IN BOTH BRANCHES, and the
    branches recommend opposite things.

    WHAT MAKES THIS FALSIFIABLE RATHER THAN A DEFINITION. The claim that Gamma
    is a self-reduction group is not free: it requires that L^{-1}(O) is
    recoverable from a break of P o L (true by construction), that P o L is
    distributed as a fresh key (requires T L to be uniform when T is, which
    holds if T is uniform on GL_n(A) - RECALLED, UNVERIFIED, and testable), and
    that testing W on a candidate is cheap relative to the attack (which is a
    property of the weak-key criterion and is unknown until it is read). Any
    one of those three failing collapses SHAPE-T back toward SHAPE-F, and each
    is a separate, checkable proof obligation rather than an assumption.

  novelty_status: unverified

  literature_context:
    - >-
      RQ-SNOVA-001's motivation field is the only in-corpus source for the
      existence of a SNOVA weak-key family, and that record labels its own
      per-scheme claims UNVERIFIED and secondhand. This proposal treats the
      existence of such a family as a HYPOTHESIS TO CONFIRM FROM PRIMARY TEXT,
      not as a fact, and its design is deliberately built so that the
      synthetic-predicate arm runs even if the family turns out not to exist or
      the source cannot be obtained.
    - >-
      SNOVA project page, FETCHED 2026-08-06 (HTTP 200, model-rendered):
      eleven parameter rows, q = 16, ell in {2,3,4,5}, ring F_q[S]. THE
      SPECIFICATION DOCUMENT WAS NOT READ, so the key-generation distribution -
      in particular whether T is drawn uniformly from GL_n(F_q[S]) - is NOT
      established and is a Stage-0 reading task.
    - >-
      ePrint 2026/237, "Exploiting SNOVA's Structure in the Wedge Product
      Attack" (Bros, Le, Lichtinger, Minaud, Perlner, Smith-Tone, Valenzuela,
      2026-02-13). ABSTRACT FETCHED, BODY NOT READ. Not used in any derivation
      here; recorded because Stage 0 must check whether that paper's attack is
      itself keyed to a weak class, which would put it on the same dichotomy.
    - >-
      Random self-reducibility as an obstruction to nontrivial weak-instance
      densities is standard complexity folklore. NO CITATION IS ASSERTED
      because none was read in this session; the argument is derived in the
      mechanism from the group action and nothing else.

  lossy_projection_identifiability_audit:
    projection: >-
      Full key pair (central map F, secret transformation T) --> the single bit
      W(F, T), and then --> the restriction of that bit to the Gamma-orbit of
      the public key.
    what_is_discarded: >-
      Everything except one bit per key, and then everything except a rate per
      orbit.
    why_genuinely_lossy: >-
      Maximally lossy. The fibre over W = 1 is an enormous set of keys, and the
      fibre over an orbit-invariance verdict is larger still.
    why_compatible_with_the_operations: >-
      Compatible in the only sense that matters here: W propagates
      deterministically under the one operation the audit applies, namely the
      Gamma-action, and the whole question is HOW it propagates - constantly or
      not. Unlike most lossy projections, this one is chosen precisely so that
      its behaviour under the operation is the observable.
    is_it_only_a_change_of_coordinates: >-
      CHECKED, AND NO - the map from a key to a single bit is nowhere near
      injective, so there is no analogue of recovering the pair {x, y} from
      (x xor y, x . y).
    mirror_failure_check: >-
      CHECKED, AND THIS IS THE FAILURE THE DESIGN HAS TO SURVIVE. A projection
      to one bit can easily be constant across all instances - if W is
      identically 0 at the toy parameters used, the instrument reports nothing
      and every orbit is trivially invariant, which would look like a SHAPE-F
      verdict while actually being a dead measurement. The design answers this
      directly: the synthetic-predicate arm PLANTS predicates of each shape with
      pre-derived invariance rates, so the instrument's ability to return
      "not invariant" is demonstrated before any real predicate is examined,
      and a real predicate that is identically 0 is reported as UNMEASURABLE AT
      THIS SCALE rather than as invariant.

  assumptions:
    - >-
      That SNOVA's secret transformation is A-linear with A = F_q[S] and that
      Gamma = GL_n(A) preserves the family. RECALLED, UNVERIFIED. If the family
      is preserved by a smaller group, the orbits are smaller and SHAPE-T's
      randomization is correspondingly weaker; the audit measures the orbit
      size rather than assuming it.
    - >-
      That key generation draws T uniformly from GL_n(A). RECALLED, UNVERIFIED
      and load-bearing: if T is drawn from a proper subset, T L need not be
      distributed as a fresh key and the self-reduction is only approximate.
      Stage 0 reads this from the specification; if it cannot, the conclusion
      is stated conditionally on it.
    - >-
      That testing W on a candidate public key is much cheaper than running the
      weak-key attack. Unknown until the weak-key criterion is read. If testing
      costs as much as attacking, SHAPE-T's 1/delta randomization buys nothing
      and the dichotomy collapses - this is the single most likely way the
      proposal turns out to be void, and it is checked before anything else is
      concluded.

  predictions:
    - metric: >-
        orbit_invariance_rate_shapeF: fraction of sampled Gamma-orbits on which
        a planted SHAPE-F synthetic predicate (a function of the central map
        alone) is constant, at toy (v, o, q, ell)
      direction: higher
      minimum_effect: >-
        EXACTLY 1.000 on every sampled orbit, forced by construction because
        Gamma fixes the central map. This is the POSITIVE CONTROL: if it is not
        1, the orbit sampler or the predicate evaluator is broken and no other
        number from the run may be reported.
    - metric: >-
        orbit_invariance_rate_shapeT: same, for a planted SHAPE-T predicate
        depending on the secret transformation
      direction: lower
      minimum_effect: >-
        BELOW 0.05 at the sampled orbit sizes, and predicted to approach 0 as
        the orbit sample grows. This is the NULL that can actually fail: a
        SHAPE-T predicate that comes out invariant means the sampler is not
        moving inside the orbit at all, and the instrument reports nothing.
    - metric: >-
        graded_decay: orbit-invariance rate of a graded predicate family
        W_k, where W_k depends on the first k of the n ring coordinates of T,
        for k = 0, 1, 2, 3, ..., with k = 0 being SHAPE-F
      direction: lower
      minimum_effect: >-
        STRICTLY DECREASING in k, from exactly 1 at k = 0 to below 0.05 at the
        largest k. This is the canonical artifact test: the quantity is
        supposed to be destroyed as the predicate is made to depend on more of
        the randomizable data, and A RATE THAT FAILS TO DECAY IS THE SIGNATURE
        OF A MEASUREMENT ARTIFACT rather than of structure. At least three
        interior points are required, and monotonicity is reported explicitly
        so that a failure localises which k breaks it.
    - metric: >-
        classification_verdict: which of SHAPE-F, SHAPE-T, SHAPE-MIXED the
        actual reported SNOVA weak-key criterion falls into, once read from
        primary text
      direction: different
      minimum_effect: >-
        A categorical verdict with the criterion quoted verbatim and the
        argument shown, or an explicit NOT OBTAINABLE with the list of URLs and
        status codes tried. NO VERDICT MAY BE RECORDED FROM RECALL. If the
        criterion cannot be obtained, the deliverable is the synthetic arm plus
        the recorded blocker, which is a real deliverable and is not a failure.
    - metric: >-
        universal_bound_if_shapeT: log2(C / delta) as a security bound implied
        for every key of the affected parameter set
      direction: different
      minimum_effect: >-
        NOT EVALUATED IN THIS PROPOSAL, and deliberately: evaluating it needs C
        and delta from a source this session did not read, and the goal's
        next_action forbids restating the inherited figures. The prediction
        recorded here is only that the FORMULA log2(C/delta) is the right one
        under SHAPE-T and that no such bound follows under SHAPE-F. Whoever
        later has the source computes the number.

  minimal_test:
    design: >-
      Three stages, cheapest first, and the cheapest is decisive. STAGE 0
      (reading, zero compute): identify and obtain the SNOVA weak-key source
      through the abstract page, arXiv, and an author copy in that order,
      recording every URL and status code; quote the weak-key criterion
      verbatim; classify it into SHAPE-F / SHAPE-T / SHAPE-MIXED by inspection,
      showing the argument. THIS STAGE CAN END THE WHOLE LINE - a SHAPE-F
      verdict settles the question at zero compute and the remaining stages
      become optional confirmation. STAGE 1 (minutes, pure Python, no
      dependencies): build a toy SNOVA-shaped key generator and a Gamma-orbit
      sampler, plant the closed list of synthetic predicates, and measure
      orbit-invariance rates against the forced values - the SHAPE-T null arm
      first, committed and hashed before the SHAPE-F arm is looked at. STAGE 2
      (minutes): the graded W_k ladder and the monotonicity report.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE THAT CAN FAIL: the planted SHAPE-T
        predicate, whose orbit-invariance rate is forced BELOW 0.05 before the
        run. If it returns 1, the orbit sampler is not moving and nothing may
        be reported.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR: the planted SHAPE-F
        predicate, whose invariance rate is forced to EXACTLY 1 by
        construction. If it is not 1 the instrument is broken and NO negative
        result may be reported at all.
      - >-
        GRADED CONTROL, at least three interior points, monotonicity reported:
        the W_k family for k = 0, 1, 2, 3. The rate must decay; a rate that
        does not decay as k grows is the artifact tell and is reported as such
        rather than as a finding.
      - >-
        DEAD-PREDICATE GUARD: any predicate that evaluates to the same value on
        100 per cent of ALL sampled keys, orbits or not, is reported as
        UNMEASURABLE AT THIS SCALE and is excluded from the invariance
        statistics. Without this guard an identically-false predicate would be
        scored as perfectly invariant.
      - >-
        ORBIT-SIZE CONTROL: report the measured orbit sample size and the
        fraction of |Gamma| it covers. An invariance verdict on a sample too
        small to contain a counterexample is not a verdict, and the minimum
        detectable non-invariance rate is computed and reported alongside every
        rate.
      - >-
        ARCHIVE CHECK, zero compute: no prior record in this corpus measures
        orbit invariance of any weak-key predicate for any scheme. Recorded as
        unavailable, not as a passed check.
    required_metrics:
      - orbit-invariance rate per planted predicate, with the forced value it was compared against
      - the SHAPE-T null commitment hash and proof it preceded the SHAPE-F arm
      - measured orbit sample size, |Gamma| estimate, and minimum detectable non-invariance rate
      - the verbatim weak-key criterion and its classification argument, or the recorded source blocker with URLs and status codes
      - the monotonicity table for W_k

  falsification_conditions:
    - >-
      The planted SHAPE-F predicate does not return invariance rate 1. The
      instrument is broken; nothing is reportable.
    - >-
      The planted SHAPE-T predicate returns invariance rate near 1. The orbit
      sampler is not moving inside the orbit; the measurement is void.
    - >-
      The graded W_k rate fails to decay in k. Artifact tell; report as an
      artifact and do not report a classification.
    - >-
      Stage 0 establishes that testing the weak-key criterion on a candidate is
      as expensive as running the weak-key attack. The SHAPE-T randomization
      buys nothing, the dichotomy collapses, and the proposal's central claim
      is withdrawn as a superseding record.
    - >-
      Stage 0 establishes that key generation does not draw T from a
      Gamma-invariant distribution. The self-reduction is only approximate and
      every conclusion must be restated with the approximation quantified.

  confounders:
    - >-
      SOURCE ABSENCE. The weak-key family is known to this program only through
      an unverified secondhand sentence in its own question record. If no
      primary source is found, the categorical verdict cannot be produced and
      the honest deliverable is the synthetic arm plus a recorded blocker.
      Reporting a verdict from recall would be a fabrication under rule 5.
    - >-
      TOY ORBITS. At the parameters where orbits can be sampled, |Gamma| is
      small and the minimum detectable non-invariance rate is coarse. That
      floor is computed and reported with every rate rather than left implicit.
    - >-
      SHAPE AMBIGUITY. Real weak-key criteria are rarely purely a function of F
      or purely of T. The SHAPE-MIXED branch exists so that the audit does not
      force a binary answer onto a criterion that does not admit one, and the
      measured orbit fraction is the honest output in that case.
    - >-
      REPUTATIONAL ASYMMETRY. A SHAPE-T verdict is the dramatic one - it would
      turn a weak-key result into a universal bound - and is therefore the one
      most likely to be reached carelessly. The design puts the boring SHAPE-F
      positive control first and requires it to pass before anything else is
      read.

  interpretation_limits:
    - >-
      NO ATTACK IS CLAIMED, NO DENSITY IS ASSERTED, AND NO NUMERICAL SECURITY
      LEVEL IS PRODUCED. The audit classifies what a density MEANS; it does not
      measure one, and it uses no value of delta.
    - >-
      A SHAPE-T verdict does NOT by itself break anything. It licenses the
      formula log2(C/delta) as a bound, and that bound is only interesting if C
      and delta are known from a source, which this session did not read.
    - >-
      A SHAPE-F verdict does NOT vindicate the scheme. It says the weak class
      is not attacker-reachable, which leaves the multi-target statement
      untouched and says nothing about any other attack.
    - >-
      Toy tier throughout for the computational arms. The categorical verdict,
      if reached, is a statement about a definition and carries no scale
      dependence - but it is only as good as the text it is read from.
    - >-
      This record neither confirms nor contradicts any reported SNOVA result,
      and restates none of the figures GOAL-SNOVA-001's next_action places out
      of bounds.

  heuristic_assumptions:
    - id: H1
      formal_statement: >-
        For L drawn uniformly from Gamma = GL_n(A) and T drawn uniformly from
        the same group, T L is distributed exactly as T. Hence P o L is
        distributed exactly as a fresh public key.
      rigorous_support: >-
        Exact, not heuristic, IF T is uniform on the group: right translation
        by a fixed element permutes a group and preserves the uniform measure.
        It is recorded as a heuristic here only because the antecedent - that
        key generation samples T uniformly on GL_n(A) - is RECALLED and
        UNVERIFIED. The mathematics is unconditional; the applicability is not.
      validation_plan: >-
        Stage 0 reads the key-generation procedure. If the specification cannot
        be obtained, Stage 1 measures the empirical distribution of a cheap
        statistic of T before and after right translation at toy parameters and
        reports the total-variation gap it can resolve.
    - id: H2
      formal_statement: >-
        A uniformly random quadratic map of matched shape has weak-key
        indicator 0 with probability 1 - o(1), so a nonzero measured invariance
        rate on the treatment arm is not explained by the base rate.
      rigorous_support: >-
        Stated so that the base rate is measured rather than assumed; no
        support is claimed for it and it is not load-bearing anywhere in the
        derivation.
      validation_plan: >-
        Measured directly as part of the dead-predicate guard.

  target_complexity:
    time_exponent: >-
      This proposal moves NO exponent and proposes no algorithm. It changes
      which exponent a REPORTED result licenses: under SHAPE-T a weak-key
      attack of cost C at density delta implies a universal bound of
      log2(C/delta) bits on every key of the affected parameter set, which is
      an exponent statement about an existing result rather than a new one;
      under SHAPE-F it implies no such bound at all. That difference is the
      entire deliverable and it is stated as a conditional, not a claim.
    memory_exponent: >-
      n/a for the audit. Noted for the branch: under SHAPE-T the randomization
      loop is memoryless, so the 1/delta multiplier costs no memory - which is
      exactly the kind of charge this program's own T-D template says goes
      unrecorded, and here it is recorded as ZERO rather than omitted.
    best_known: >-
      Not applicable; nothing is compared to an attack. The reported best known
      for SNOVA key recovery is ePrint 2026/237, ABSTRACT-RELAYED and not read.
    hidden_overhead: >-
      The cost of TESTING the weak-key predicate on each randomized candidate.
      This is the one quantity that can silently destroy the SHAPE-T branch and
      it is promoted to an explicit proof obligation rather than hidden in the
      1/delta.
    tradeoff_note: >-
      Under SHAPE-T there is a genuine tradeoff worth drawing: the attacker
      spends 1/delta randomizations against one target, or acquires 1/delta
      targets and spends one attack. Those are different resources -
      computation versus data - and no record in this corpus has ever
      distinguished them for a weak-key result.

  dominated_by: >-
    n/a (no result claimed). No algorithm, no cost and no Pareto point is
    proposed, so no frontier row can dominate it. Rows checked before writing
    that: (i) the corpus, by grep for SNOVA across knowledge/, ledger/ and
    docs/ - hits are KN-LIT-7620, the SNOVA goal and question records,
    IDEA-20260801-014, IDEA-20260801-016 and four 2026-08-05 UOV/MAYO
    proposals; none audits a weak-key density, none names a self-reduction
    group, and the SNOVA area has no experiments, evidence or hypotheses at
    all; (ii) the time, memory and data axes, considered explicitly and
    inapplicable because nothing is computed to a cost - except that the
    tradeoff_note above records the one place where a real time-versus-data
    distinction exists and is unrecorded elsewhere; (iii) the external
    frontier, ePrint 2026/237, ABSTRACT ONLY, which is a different attack and
    does not dominate an audit. What this check cannot establish is novelty
    against the multivariate literature, where self-reducibility arguments are
    old; none is claimed.
  sota_delta: >-
    Zero on every attack axis. The quantitative contribution is a conditional
    exponent: under SHAPE-T, every key of an affected parameter set inherits a
    bound of log2(C/delta) bits from an already-published weak-key result, at
    zero new cryptanalysis; under SHAPE-F, exactly zero bits are inherited and
    the correct remedy is a rejection-sampling tweak in key generation, which
    is a concrete Round-3 recommendation. The delta between those two readings
    is the difference between "some keys are bad" and "all keys are weaker than
    claimed", and this program currently records neither.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.6 that the dichotomy is well-posed and produces a categorical verdict,
    and 0.3 that the verdict is SHAPE-T. The first is only 0.6 because three
    separate recalled facts have to hold - the group, the uniformity of T, and
    the cheapness of testing the predicate - and the third is genuinely unknown
    without the source; it is not lower because the argument itself is
    elementary group theory that does not depend on any cryptanalysis, and the
    synthetic arm delivers the instrument even if all three recalled facts
    fail. The second is 0.3 rather than 0.5 because weak-key families in the
    multivariate literature more often come from degeneracies of the CENTRAL
    map (a singular or low-rank component) than from the transformation, which
    would put the criterion in SHAPE-F; it is not lower because SNOVA's reported
    weak keys are associated with a group-action structure, and a group-action
