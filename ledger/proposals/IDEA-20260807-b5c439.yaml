idea:
  id: IDEA-20260807-b5c439
  question_id: RQ-EQIC-8cb959
  added: '2026-08-07'
  title: >-
    A STRUCTURED FACTOR BASE THAT IS phi-STABLE BY CONSTRUCTION: put the
    Gaudry/Diem "small x-coordinate" prime-field factor base on the INVARIANT
    LINE instead of the x-line -- V = {x : x^3 mod p lies in a short interval or
    a subgroup coset} -- so that structure and phi-stability coexist for the
    first time, and measure whether the norm form's degree inflation destroys
    whatever the structure was worth
  class: composition

  claim: >-
    (A) THE INCOMPATIBILITY THIS PROPOSAL RESOLVES, AND WHY IT IS A REAL
    OBSTACLE. Prime-field point-decomposition index calculus has one classical
    factor-base design lever: choose V structured, e.g. V = {x : x < B} (the
    Gaudry/Diem short-interval base). It has, separately, one endomorphism lever:
    choose V phi-stable. THESE TWO ARE INCOMPATIBLE ON THE x-LINE. A short
    interval [0, B) is not stable under x -> zeta x: multiplication by a cube
    root of unity is a wild permutation of F_p with respect to the integer
    order, so zeta * [0, B) is a scattered set, and no nonempty interval other
    than {0} is mu_3-stable. Any lane that wants both must therefore change
    where the structure lives.

    (B) THE RESOLUTION, EXACTLY. Impose the structure on the INVARIANT
    coordinate u = x^3, not on x:
      V_W = { x in F_p^* : x^3 mod p lies in W },  W a chosen subset of F_p^*.
    V_W is mu_3-stable for ANY W, because x and zeta x share the same u. And by
    the theorem of IDEA-20260807-4d7e8e, on a j = 0 curve the on-curve condition
    is also a function of u alone, so
      V_W intersect X_E = { x : x^3 in W and x^3 + b is a square },
    which is again a union of complete orbits. Taking W a short interval
    [0, U) gives about U/3 cubes in W, hence about U/3 orbits, hence
    |V_W intersect X_E| about U/2 after the residue condition -- a factor-base
    universe with BOTH a size parameter and an interval structure, and
    phi-stable at no extra cost. Membership testing costs one cube and one
    interval comparison.

    (C) THE THREE STRUCTURE FAMILIES WORTH SEPARATING, because they behave
    differently and lumping them is how this kind of proposal goes wrong.
      W-INT: W = [0, U), a short interval on the invariant line. This is the
        direct transport of the Gaudry/Diem base. The membership polynomial
        g(T) = prod_{u in W, u a cube, u + b square} (T - u) has degree about
        U/6 and NO special structure beyond its support.
      W-SUB: W = the subgroup of cubes itself, or a coset of a small-index
        subgroup H <= F_p^*. Then membership is a single exponentiation
        u^{(p-1)/d} = fixed, with NO polynomial of degree |W| needed at all --
        the membership CONSTRAINT becomes a residuosity condition rather than a
        vanishing condition. This is the only member of the family in which the
        degree-m membership polynomial disappears entirely, and it is the one
        with a genuinely different algebraic character.
      W-SPARSE: W = the image of a low-degree map, e.g. W = {t^2 : t < U} or
        W = {c t + d : t < U}. Then g has a compact description and the system
        can be re-parameterised in t, trading one variable of degree |W| for one
        variable of small degree with an auxiliary equation.
    Only W-INT and W-SPARSE stay inside the Groebner framework as stated; W-SUB
    leaves it, and that is precisely why it is worth carrying.

    (D) THE PRE-REGISTERED PREDICTION, AND IT IS NEGATIVE. The decomposition
    system on the invariant line is
      { T(u1, u2) = 0, u1 in W, u2 in W },
    where T is the norm form of IDEA-20260807-1ea327, of bidegree (6, 6) rather
    than S_3's (2, 2). THE OBSTRUCTION NAMED IN ADVANCE: the r-fold per-variable
    degree inflation of the norm (2 -> 6 at r = 3) applies to EVERY structured
    base equally, while the interval structure's benefit -- fewer candidates,
    smaller membership degree -- is exactly the r-fold deflation already
    available from any phi-stable base. So the two effects are predicted to
    cancel to within measurement noise, and the structured invariant base is
    predicted to perform indistinguishably from the unstructured phi-stable base
    of the same cardinality. THE COMPETING EXPLANATION that would make this
    proposal interesting: the interval structure on the u-line interacts with
    the norm form's Newton polytope in a way the unstructured base does not, so
    that the measured solving-degree proxy for W-INT is strictly below both the
    unstructured phi-stable base AND the x-line short-interval base at matched
    cardinality. Either outcome is a deliverable; the first is a closure with a
    named obstruction, the second would be the first structure-times-symmetry
    interaction measured in this lane.

    (E) RELATION-COUNT ARITHMETIC, UNCHANGED AND STATED ANYWAY. V_W intersect
    X_E is a union of m complete orbits, |V| = 3m, and the reduced system has m
    unknowns. Each successful decomposition contributes ONE independent equation
      a_t + b_t k = eps_1 lambda^{c_1} l_{j_1} + eps_2 lambda^{c_2} l_{j_2}
    over those m unknowns. The phi-images of that relation are lambda-multiples
    and contribute rank 0 (IDEA-20260807-5dfe4a). Structuring W changes WHICH
    orbits are in the base and the cost of the membership test; it does not
    change that one search yields one equation, and it does not change the
    per-search success probability, which depends on |V| and the arity. Nothing
    in this proposal manufactures relations.

  resource_label: R1, R2
  admissibility: admissible
  admissibility_argument: >-
    R1 in its strongest form: the factor base is DEFINED by a condition on
    x-coordinates as field elements -- an interval in the integer
    representative, or a multiplicative-subgroup membership -- which is
    information a generic-group oracle does not expose. A simulator returning
    opaque handles cannot decide "is this point's x-coordinate below U" or "is
    it a cube", so neither the base nor the membership test is simulable in the
    sense of KN-FIND-b7e091. R2: the identification of V_W with a union of
    complete orbits uses the curve equation a = 0 through the theorem of
    IDEA-20260807-4d7e8e. phi is never applied to a point of G to gain
    information.

  discriminated_from:
    - >-
      H-STR-002 (weakened, DEC-20260727-009; DEFER-BATCH009-001 OPEN). Nothing
      asserted about it in either direction: no displacement rank, no relation
      matrix structure, no linear-algebra cost. The variable this record moves
      is the DEFINITION OF THE FACTOR BASE'S SUPPORT, which H-STR-002 fixes
      (a union of orbits drawn pseudorandomly by _build_phi_invariant_factor_base)
      and never varies. The mechanism the weaken did not touch is the
      equivariance of the system; this record does not touch it either.
    - >-
      IDEA-20260807-1ea327. That record fixes the base and varies the ENCODING
      (three encodings of the same system). This record fixes the encoding (the
      invariant one) and varies the BASE'S SUPPORT (three structure families
      plus the unstructured control). They are orthogonal factors of the same
      design and are deliberately separated so that a positive result in either
      is attributable.
    - >-
      IDEA-20260807-4d7e8e. That derives that V_W is a union of complete orbits;
      this record USES that as a lemma and asks a cost question it does not
      address. Explicit dependency, recorded rather than duplicated.
    - >-
      The Gaudry/Diem short-interval prime-field factor base as surveyed in
      KN-LIT-006. That base lives on the x-line, is not phi-stable, and is
      recorded there as not producing an advantage over prime fields. This
      record transports the same idea to the invariant line, which is a
      different set with a different membership polynomial. It is an ADAPTATION
      of a surveyed dead end, and KN-LIT-006's verdict on the x-line version is
      the prior that makes the expected outcome negative.
    - >-
      KN-LIT-004 (FGHR symmetries and curve models). That varies the MODEL
      (Edwards, twisted Jacobi intersections) to change the symmetry group. This
      record keeps the short Weierstrass model and varies the factor base's
      support. Composable in principle; not composed here.

  object_first_candidate:
    tracked_object: >-
      THE SUPPORT SET W ON THE INVARIANT LINE -- the subset of the u-line that
      defines the factor base -- tracked together with the induced membership
      polynomial g and its Newton polytope in the reduced system.
    lossiness: >-
      LOSSY in the same way as the invariant coordinate itself: W forgets which
      cube root is meant, a 3-to-1 loss. It also forgets, deliberately, the
      x-line geometry of V_W: a short interval in u corresponds to a SCATTERED
      set in x, with no integer-size structure at all. That is the substantive
      loss and it is the reason the proposal is not merely a relabelling: the
      structure exists on one line and provably not on the other.
    propagation: >-
      Deterministic through membership (u in W is decidable from u alone) and
      through the on-curve condition (u + b in QR, by IDEA-20260807-4d7e8e).
      It does NOT propagate through the group law -- E / Aut is rational, not a
      group -- so a relation found on the u-line must be lifted to x before it
      means anything, at the cost of resolving nine phase pairs.
    survival_score: >-
      Survives: change of |V|, change of target, change of arity in principle.
      Dies at: a != 0 (no invariant line); W-SUB at arity above 2 (the
      residuosity constraint does not combine with the norm form as an
      algebraic equation); and, most likely, at the first honest cost
      accounting, which is what the pre-registered negative in claim (D)
      predicts.

  mechanism: >-
    STEP 1 -- BUILD THE BASES, ALL AT MATCHED CARDINALITY 3m. On a fixed j = 0
    instance construct four factor bases, all of cardinality exactly 3m:
      ARM W-INT:   orbits whose u lies in [0, U), U chosen so that the count of
                   qualifying orbits is exactly m.
      ARM W-SUB:   orbits whose u lies in a fixed coset of the index-d subgroup
                   of F_p^* for the smallest d giving at least m orbits;
                   membership is one exponentiation.
      ARM W-RAND:  orbits drawn uniformly (the unstructured phi-stable control).
      ARM X-INT:   the x-line short-interval base {x < B} intersected with X_E,
                   NOT phi-stable, of the same cardinality 3m -- the classical
                   comparator.
    Record for each: the exact orbit count available, the realised cardinality,
    and the membership polynomial degree.

    STEP 2 -- SOLVE THE SAME TARGET STREAM ON ALL FOUR. Using the ENC-SYM
    invariant encoding of IDEA-20260807-1ea327 for the three phi-stable arms and
    ENC-X for ARM X-INT, run the arity-2 decomposition on an identical stream of
    targets, recording wall time, basis size, maximum reduced-basis total
    degree, solutions found, and solutions certified.

    STEP 3 -- THE W-SUB SPECIAL CASE, TREATED SEPARATELY BECAUSE IT LEAVES THE
    FRAMEWORK. For W-SUB the membership condition is u^{(p-1)/d} = c, a
    residuosity test rather than a polynomial of degree m. Two sub-arms:
      W-SUB-poly: encode membership as the degree-m polynomial anyway (so the
        comparison with W-INT is like for like);
      W-SUB-filter: do not encode membership at all -- solve
        T(u1, u2) = 0 for u2 given u1 by univariate root-finding of a degree-6
        polynomial, then FILTER the roots by the residuosity test. This changes
        the algorithm from "solve a system" to "root-find and filter", and its
        cost is O(m) root-findings of degree 6 per target instead of one
        Groebner run. Whether that is faster is a measurement, and it is the
        genuinely different thing in this proposal.

    STEP 4 -- THE NULLS AND THE DECAY. Run STEP 2 on the size-matched
    unstructured random x-line base (no orbits, no interval) as the outermost
    control, and run the epsilon orbit-breaking ladder of IDEA-20260807-b42544
    on ARM W-INT. Any advantage attributed to the invariant-line structure must
    decay as the structure is destroyed: replace a fraction of the qualifying
    orbits by orbits drawn from outside W, at fixed cardinality, and require
    monotone decay to ARM W-RAND.

    STEP 5 -- ACCOUNT THE MEMBERSHIP TEST HONESTLY. Every arm's cost must
    include the cost of DECIDING membership, because that is where W-SUB is
    cheap and W-INT is not. Report field operations per membership decision
    alongside the Groebner numbers, or W-SUB will be credited with a saving it
    pays for elsewhere.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps run 2026-08-07 in this session:
      (1) 'Veronese|norm of the summation|cube substitution|u = x\^3|
      x\^3 invariant|mu_3' over the repository, content mode;
      (2) 'invariant ring|Molien|symmetric summation|elementary symmetric' over
      the repository, content mode;
      (3) 'orbit representative|factor.base quotient|quotient the factor base|
      reduced factor base' over ledger/, content mode.
      Records read: KN-LIT-006 (the prime-field survey and this program's
      designated "already ruled out" reference), KN-LIT-004, KN-TECH-003,
      KN-TECH-011, KN-FIND-b7e091, DEC-20260727-009, H-STR-002,
      harness/endomorphism_la.py, harness/semaev.py. External web searches as
      recorded in IDEA-20260807-1ea327.
    results: >-
      No record in this repository defines a factor base by a condition on the
      INVARIANT coordinate; grep (1) returned about 30 mu_3 hits, all in the
      XEDN lifting lane or unrelated campaigns. The x-line short-interval base
      is present as background in KN-TECH-003 and KN-LIT-006, which record that
      no structured prime-field factor base is known to give an advantage -- the
      prior that makes claim (D)'s negative the expected outcome. The
      incompatibility argued in claim (A) (no nonempty interval is mu_3-stable)
      appears nowhere and is elementary.
    verdict: >-
      ADAPTATION, and of a surveyed dead end. Structured factor bases over prime
      fields are old and KN-LIT-006 records that they do not help; moving the
      structure to the invariant line is a new PLACE to put an old idea, not a
      new idea. Filed at LOW priority for exactly that reason, and filed at all
      because the incompatibility in claim (A) means nobody in this lane could
      previously have both structure and phi-stability, so the composition has
      not been tried here even in principle. NO EXTERNAL NOVELTY IS CLAIMED and
      a full read of KN-LIT-006 and KN-LIT-004 is a Stage-0 obligation.

  null_object_control: >-
    MANDATORY AND BLOCKING, THREE LAYERS.
    NULL-1, THE UNSTRUCTURED phi-STABLE BASE (ARM W-RAND) at the SAME
    cardinality 3m: isolates the structure from the phi-stability. If W-INT does
    not beat W-RAND, the interval structure contributes nothing and the honest
    report is the pre-registered negative.
    NULL-2, THE CLASSICAL x-LINE SHORT-INTERVAL BASE (ARM X-INT) at the same
    cardinality: isolates the invariant-line placement from the interval idea
    itself. If X-INT does as well, the placement is irrelevant.
    NULL-3, THE FULLY UNSTRUCTURED RANDOM x-LINE BASE at the same cardinality:
    the outermost control, and the one against which KN-LIT-006's verdict is
    calibrated.
    DECAY PARAMETER: the STRUCTURE-BREAKING FRACTION delta -- the fraction of
    qualifying orbits replaced by orbits drawn from outside W, at fixed
    cardinality 3m. Any measured advantage of W-INT must decay monotonically to
    the W-RAND value as delta goes 0 -> 1/3 -> 2/3 -> 1. Flatness in delta is
    the canonical artifact tell and the advantage may not be attributed to the
    structure. The orbit-breaking parameter epsilon of IDEA-20260807-b42544 is
    inherited as a second, independent decay axis.

  assumptions:
    - >-
      p = 1 mod 3, a = 0, b != 0, zeta verified per instance.
    - >-
      IDEA-20260807-4d7e8e's theorem holds, so V_W is a union of complete
      orbits. THIS IS A DEPENDENCY, NOT A PREMISE: if that record's minimal test
      fails, this proposal's base construction is invalid and must be redesigned.
    - >-
      Enough qualifying orbits exist in W to reach cardinality 3m. For W-INT
      this requires U about 6m; the count is computed exactly, per instance,
      before the arm is run, and a cell that cannot reach 3m is skipped and
      recorded rather than run short.
    - >-
      x = 0 excluded everywhere.
    - >-
      Toy scale: p up to about 20 bits, pure Python, sympy Groebner. Solving-
      degree numbers are implementation-bound proxies (KN-TECH-004) and only
      cross-arm trends on the identical solver are interpreted.

  proof_search_map:
    bottleneck: >-
      The arity-2 Groebner solve of the invariant system, and specifically the
      interaction between the norm form's Newton polytope and the support of the
      membership polynomial g. That interaction is the only place a structured W
      could act, and if it does not act there the proposal is dead. Naming it
      precisely is what makes the negative prediction falsifiable rather than
      vague.
    baseline_embedding:
      parameter_slice: >-
        W = the whole set of cubes (no structure). Then V_W intersect X_E is the
        entire orbit universe and the arm degenerates EXACTLY to ARM W-RAND with
        m = Omega. That is the incumbent recovered as a parameter slice, and it
        is exact, not approximate.
      reproduction_check: >-
        Frozen fixture: with W the full cube set and m = Omega, the constructed
        base must equal the full orbit set as a sorted list, and the ENC-SYM
        Groebner run must reproduce ARM W-RAND's basis exactly on a fixed
        target. A mismatch means the W-filter is changing the base in a way not
        accounted for, and no comparative number may be reported.
    observation_collision:
      observable: >-
        The maximum reduced-basis total degree and the Groebner wall time on the
        invariant system.
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED. Find a structured W and an
        unstructured W' of the same size with the same observable. That is the
        pre-registered negative of claim (D), and it BOUNDS the conclusion to
        "the observable is a function of |W| alone". The collision that would be
        informative in the other direction is two W's of the same size with
        DIFFERENT observables, and identifying which feature of W separates them
        would be the actual finding.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Represent the factor base by a CONDITION on the invariant coordinate
          rather than by an explicit list, so that membership is a test rather
          than a lookup. Encoding: u in W. Completeness and soundness: exact,
          since V_W intersect X_E is characterised by two residue conditions.
          Transfer: the recovered relation is one equation over the m reduced
          unknowns after cube-root lifting. Cost loss: the phase resolution and,
          for W-SUB-filter, the loss of the algebraic system entirely in favour
          of root-finding plus filtering.
        predicted_gain: >-
          For W-SUB the membership polynomial of degree m disappears from the
          system, which is the largest structural change available in this
          proposal. Whether removing it helps is the measurement; the honest
          prior is that root-finding a degree-6 univariate m times per target
          costs about the same as the Groebner run it replaces.
      - transform: specialization_pack
        proposed_object: >-
          Specialize W to a low-degree image (W-SPARSE, e.g. W = {t^2 : t < U})
          and re-parameterise the system in t, replacing one variable of
          membership degree m by one variable of small range with an auxiliary
          equation u = t^2.
        predicted_gain: >-
          Trades membership degree for an extra variable. Predicted net loss at
          arity 2 (more variables dominates lower degree at this size) and
          carried only so the trade is measured rather than assumed.
    quantifier_order: >-
      Intended: FOR ALL j = 0 curves in the declared family, FOR ALL
      cardinalities 3m in the declared range, THERE EXISTS a structure family
      among {W-INT, W-SUB, W-SPARSE} whose measured cost is below ARM W-RAND's.
      The pre-registered expectation is the NEGATION of this: FOR ALL structure
      families, the cost equals W-RAND's within noise. The audit obligation is
      that a winning family must win UNIFORMLY across m, not at a single m,
      because a single-m win is a size artifact and this proposal's whole point
      is that size is controlled.
    method_ceiling:
      strongest_certifiable_claim: >-
        "At arity 2 on these toy j = 0 curves with this solver, the
        invariant-line structured base costs a measured factor F relative to the
        unstructured phi-stable base of the same cardinality." It can NEVER
        certify an exponent change, anything about a != 0, anything at higher
        arity, or anything about the ECDLP; and because prime-field structured
        bases are already surveyed as unhelpful (KN-LIT-006), even a positive F
        would be a constant on an already-dominated method.
      nearby_object_control: >-
        ARM X-INT, the x-line short-interval base of the same cardinality: the
        closest object where the hoped-for conclusion (that the INVARIANT-LINE
        placement matters) must fail. A method that cannot separate W-INT from
        X-INT has not identified the load-bearing structure.
    proof_obligations:
      - claim: no nonempty interval other than {0} is mu_3-stable on the x-line.
        responsibility: correctness
      - claim: V_W is mu_3-stable for every W.
        responsibility: correctness
      - claim: the qualifying-orbit count in W reaches m before the arm is run.
        responsibility: feasibility
      - claim: W = all cubes reproduces ARM W-RAND exactly.
        responsibility: baseline
      - claim: every reported decomposition carries a re-verified certificate.
        responsibility: soundness
      - claim: membership-decision cost is charged to the arm that incurs it.
        responsibility: scope

  predictions:
    - metric: >-
        Groebner wall time, ARM W-INT against ARM W-RAND, matched cardinality
        3m, identical target stream and encoding
      direction: different
      minimum_effect: >-
        PRE-REGISTERED EXPECTATION IS NO DIFFERENCE: ratio in [0.85, 1.18]. A
        ratio below 0.85 sustained over at least 20 targets and INCREASING in m
        is the positive branch and would be the first structure-times-symmetry
        interaction in this lane. A ratio above 1.18 means the structure hurts,
        which is also informative and is reported.
    - metric: >-
        maximum reduced-basis total degree, ARM W-INT against ARM W-RAND
      direction: different
      minimum_effect: >-
        Predicted EQUAL. A difference of 2 or more is required before any
        structural claim is made.
    - metric: >-
        ARM W-INT against ARM X-INT (the classical x-line short-interval base)
        at matched cardinality
      direction: lower
      minimum_effect: >-
        A factor of at least 1.5 in wall time is required to claim that the
        invariant-line PLACEMENT matters. Below that, the placement is
        irrelevant and the honest report says so.
    - metric: >-
        ARM W-SUB-filter (root-find and filter) against ARM W-RAND (solve the
        system), field operations per certified relation
      direction: lower
      minimum_effect: >-
        A factor of at least 2. This is the arm with the largest structural
        difference and the one most likely to move; the prior is still against
        it, since m degree-6 root-findings per target is comparable work to one
        small Groebner run.
    - metric: delta-decay of any W-INT advantage
      direction: lower
      minimum_effect: >-
        Monotone decay to the W-RAND value by delta = 1. Flatness is the
        artifact tell and voids the attribution.

  minimal_test:
    design: >-
      CHEAPEST VALID DISCRIMINATOR, MINUTES AND ZERO CURVE WORK: verify claim
      (A) computationally -- for a sample of primes p = 1 mod 3, confirm that
      zeta * [0, U) intersect [0, U) has size about U^2 / p (i.e. the interval
      is essentially unstable) for every U in a ladder. That single check
      establishes the incompatibility this proposal exists to resolve, and if it
      fails -- if some interval IS approximately mu_3-stable -- the entire
      framing changes and the cheaper design is on the x-line after all.
      THEN, an hour: build the four arms at matched cardinality on one 16-bit
      j = 0 instance and confirm the exact orbit counts and cardinalities before
      any solving.
      THEN, hours: STEP 2 at field_bits in {12, 16, 20}, seeds {1, 2, 3},
      20 targets per cell, all four arms plus NULL-3.
      THEN, an hour: the delta ladder on ARM W-INT at the largest affordable
      instance.
    controls:
      - ARM W-RAND, unstructured phi-stable, matched cardinality (blocking)
      - ARM X-INT, classical x-line short interval, matched cardinality
      - NULL-3, fully random x-line base, matched cardinality
      - delta ladder {0, 1/3, 2/3, 1} at fixed cardinality
      - epsilon orbit-breaking ladder inherited from IDEA-20260807-b42544
      - W = all cubes degeneration fixture reproducing ARM W-RAND exactly
      - independent certificate re-verification of every claimed decomposition
      - membership-decision cost measured and charged per arm
    required_metrics:
      - Groebner wall time, basis size, max total degree, per arm per target
      - exact qualifying-orbit count and realised cardinality per arm
      - membership-decision field operations per test, per arm
      - certified solutions per arm
      - delta ladder and epsilon ladder curves
      - sha256 of each factor base and each membership polynomial

  falsification_conditions:
    - >-
      Claim (A) is wrong: some nonempty interval is (approximately) mu_3-stable.
      The framing collapses and the record is superseded by a cheaper x-line
      design.
    - >-
      W = all cubes does not reproduce ARM W-RAND exactly. The base construction
      is buggy; no comparative number may be reported.
    - >-
      W-INT matches W-RAND within [0.85, 1.18] on every metric at every m. THE
      PRE-REGISTERED NEGATIVE FIRES: the invariant-line structure contributes
      nothing beyond cardinality, the obstruction is named (the norm's r-fold
      degree inflation applies uniformly and cancels the structure's deflation),
      and this is a closure at the docs/inventor-protocol.md section 4 standard
      with forward guidance pointing to W-SUB-filter and to higher arity.
    - >-
      An apparent W-INT advantage does not decay in delta. Artifact; the
      attribution is void.
    - >-
      Too few qualifying orbits exist in W to reach 3m at the declared U. A
      feasibility outcome; the cell is skipped and recorded, and it is not
      evidence about structure.

  confounders:
    - >-
      CARDINALITY DRIFT. The qualifying-orbit count in an interval is not exactly
      U/6; if U is chosen by formula rather than by counting, the arms will not
      be cardinality-matched and the entire comparison collapses into the size
      artifact this lane exists to avoid. U MUST be chosen by counting until
      exactly m orbits qualify.
    - >-
      INTERVAL ENDPOINT EFFECTS. A short interval starting at 0 includes small
      u whose cube roots may have special structure (e.g. u = 1 has cube root 1).
      Randomising the interval's start and reporting the spread is required.
    - >-
      W-SUB COSET CHOICE. Different cosets of the same subgroup can have
      materially different intersections with the on-curve condition at small p.
      Multiple cosets must be tested and the spread reported, not one coset.
    - >-
      MEMBERSHIP COST MISCHARGING. W-SUB's cheap membership test is its main
      structural advantage; failing to charge W-INT's polynomial-degree
      membership on the same footing would manufacture that advantage.
    - >-
      SOLVER IDIOSYNCRASY. As in IDEA-20260807-1ea327, sympy's routine may
      respond to support structure in ways an optimized F4 would not; all
      conclusions are within-solver.

  interpretation_limits:
    - >-
      NO EVIDENCE ABOUT H-STR-002 IN EITHER DIRECTION; DEFER-BATCH009-001
      remains open and untouched.
    - >-
      Toy tier, claim_tier toy, arity 2, j = 0 only, a measure-zero family
      unreachable by isogeny walking from a class without D_0 = -3 (T4).
    - >-
      KN-LIT-006 records that structured prime-field factor bases are not known
      to give an advantage. This proposal does not contradict that and does not
      claim to; it tests one placement that was previously unavailable because
      of the incompatibility in claim (A).
    - >-
      Even a maximal positive result is a constant factor on the Groebner step
      of a method whose arity-2 total cost is linear in N. It is not an attack.
    - >-
      W-SUB-filter changes the algorithm's shape (root-find plus filter rather
      than solve). Its numbers are therefore not directly comparable to the
      Groebner arms and must be reported in field operations per certified
      relation, not in Groebner seconds.

  reachability_gate: >-
    NOT APPLICABLE TO THE DESIGN: no curve is moved; the four arms differ only
    in factor-base support on one fixed curve, and the comparator curves are
    constructed. T5 does not bind. T4 binds on the scope exactly as elsewhere in
    this lane: the invariant line exists only because a = 0, which is fixed by
    the isogeny class, so no target curve can be moved into this family. A
    second, weaker reachability question specific to this record is stated for
    completeness: within the FIXED curve, is a good W reachable? Yes and
    cheaply -- W is chosen by the experimenter at zero cost, which is exactly
    why the negative prediction is meaningful: if a freely choosable structure
    does not help, structure is not the missing ingredient.

  target_complexity:
    time_exponent: >-
      NO EXPONENT MOVES. The arity-2 prime-field collection total remains about
      2 c N / r, linear in N, with r = 3 from the phi-stability and c the
      per-search cost that this proposal tries to lower by a constant. For
      contrast, the exponent the lane would need to move lives at higher arity,
      in the Groebner cost G(m, B), and is IDEA-20260807-e57607's target.
    memory_exponent: >-
      Unchanged; the Groebner memory is the Macaulay dimension at arity 2, small
      at toy scale. W-SUB-filter is the only arm with a materially different
      profile: it stores no system, only the current degree-6 univariate, so its
      memory is O(1) beyond the factor base.
    best_known: >-
      Parallel rho with distinguished points, 0.886 sqrt(N) and O(1) memory
      (KN-TECH-001, KN-TECH-006); automorphism-discounted rho on j = 0,
      0.886 sqrt(N)/sqrt(6) (KN-TECH-018); BSGS, sqrt(N) time and memory. For
      structured prime-field factor bases specifically, the state of the art is
      the surveyed conclusion in KN-LIT-006 that none is known to help.
    hidden_overhead: >-
      Two disclosures. (a) The cube-root lifting needed to turn a u-line
      solution into a point costs one exponentiation plus phase resolution, and
      it is charged per certified relation. (b) For W-INT the membership
      polynomial g has degree m with no special support, so writing it down
      costs O(m) coefficients and evaluating it costs O(m) -- the structure is
      in WHICH u's are chosen, not in a compact g, and that is the reason the
      predicted gain is small.
    tradeoff_note: >-
      W-SUB-filter is the one arm with a genuine time-memory profile change:
      O(1) working memory and O(m) root-findings per target, against the
      Groebner arms' Macaulay-dimension memory and one solve per target. That is
      a within-method tradeoff at constant total cost, not a cryptanalytic one,
      and it is reported as such. Parallelization is unaffected in every arm.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA/QUERIES. As an attack:
    dominated by parallel rho with distinguished points (0.886 sqrt(N) time,
    O(1) memory, KN-TECH-001/006); by automorphism-discounted rho on this exact
    family (0.886 sqrt(N)/sqrt(6), O(1) memory, KN-TECH-018); by BSGS (sqrt(N)
    time, sqrt(N) memory); and by prime-field point-decomposition index calculus
    generally (KN-TECH-003, KN-LIT-006), which is itself dominated by the first
    three. On data/queries it consumes O(N/r) decomposition attempts against
    rho's O(sqrt(N)) group operations, so it is dominated there too. AS A
    FACTOR-BASE DESIGN the incumbents are the unstructured phi-stable base
    (ARM W-RAND) and the classical x-line short-interval base (ARM X-INT); this
    proposal is not known to dominate either, and the pre-registered prediction
    is that it dominates neither, which is the point of running it.
  sota_delta: >-
    Zero speedup against any attack baseline, and the pre-registered expectation
    is zero delta against the in-lane comparators as well: W-INT within
    [0.85, 1.18] of W-RAND. The quantities being traded, stated numerically:
    membership polynomial degree 3m -> m (shared with every phi-stable base, not
    specific to the structure); per-variable system degree 2 -> 6 (the norm's
    inflation, shared by every invariant-encoded arm); candidate count 9m^2 ->
    m^2 (likewise shared); and, unique to this proposal, the membership DECISION
    cost, which drops from an O(m) polynomial evaluation to one exponentiation
    in W-SUB. That last one is the only number this record can move on its own
    and it is a constant on a subdominant step.

  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: low

  honest_prior_of_survival: >-
    0.95 that claim (A) checks out (no nonempty interval is mu_3-stable is
    near-certain; the computational check is a formality). 0.85 that all four
    arms can be built at exactly matched cardinality, the residual being the
    orbit-count feasibility at small p. 0.12 that W-INT beats W-RAND by the
    pre-registered margin -- KN-LIT-006's surveyed verdict on structured
    prime-field bases is the dominant prior and it points the other way. 0.20
    that W-SUB-filter beats the Groebner arms in field operations per certified
    relation, which is the highest single-arm prior here and the reason the
    proposal is filed at all rather than dropped. Overall this is filed at LOW
    priority as an honest low-expected-value item whose negative would be a
    clean closure with a named obstruction.

