      verified_by: null
  assumptions:
    - >-
      An affine solution is a pair (x, y) in F_11^2 with y^2 equal to
      the polynomial value. The point at infinity is not counted.
    - >-
      A nonzero field element contributes two y values when it is a
      square and zero y values when it is not. The value 0 contributes
      one solution, y=0.
    - >-
      Squarefree for f means that x^2+1, x^2+x+1, and x^2+x+2 share no
      common root in an algebraic closure and that none is a square.
      The control g has a squared factor by construction.
