idea:
  id: IDEA-20261006-18ab55
  question_id: RQ-HYPER-7ca025
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: Affine point gap of one admissible sextic over F_11 against its repeated-factor control
  class: measurement
  claim: >-
    Let f = (x^2 + 1)(x^2 + x + 1)(x^2 + x + 2) over F_11, and let
    g = (x^2 + 1)^2 (x^2 + x + 2). The three quadratics in f are
    pairwise coprime and f is squarefree of degree 6. The equation
    y^2 = f has 12 affine solutions in F_11^2. The equation y^2 = g
    has 10 affine solutions in F_11^2. A recomputation that returns any
    other pair of affine counts falsifies the gap. Points at infinity
    are not included. This is not a Richelot codomain triple, not a
    Cantor doubling, and not an ECDLP solver.
  mechanism: >-
    The squarefree product and the repeated-factor polynomial are the
    two objects. A gap of 2 means the admissibility failure changes the
    affine point count of this pinned pair. Equal counts would mean this
    pair does not witness that failure in the point count, so a later
    formula comparison would need a different control. LOSSY-PROJECTION
    TEST. The tracked object is the set of affine F_11-points of
    y^2 = f; the operation set is the hyperelliptic involution
    (x, y) |-> (x, -y), not Jacobian translation and not an elliptic
    factor-base action. Discarded: the sign of y and the identity of
    the points, retaining the cardinality. The cardinality propagates
    because the involution is a bijection of that affine set. The
    projection is lossy because the cardinality does not recover the
    sextic, and f and g are distinct polynomials.
  novelty_status: unverified
