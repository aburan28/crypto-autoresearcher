  predictions:
    - metric: affine_point_count
      direction: different
      minimum_effect: >-
        12 affine points on y^2 = f versus 10 on y^2 = g, a gap of 2.
  minimal_test:
    design: >-
      Expand or evaluate f and g at each of the 11 field elements.
      Count affine solutions by the rule in the assumptions. Separately
      confirm that x^2+1 and x^2+x+1 have nonzero discriminant that is
      a nonresidue modulo 11, and that x^2+x+2 has two distinct roots
      that are not roots of the other two quadratics.
    controls:
      - >-
        The repeated-factor polynomial g is the nearby object. The
        claim predicts 10 affine points there. Any other count on g
        falsifies the gap.
      - >-
        The zero polynomial is not a control. A run that reports a
        point total outside 0..22 on either polynomial is invalid.
    required_metrics:
      - affine point count of y^2 = f
      - affine point count of y^2 = g
      - pairwise-coprime bit of the three quadratics in f
  falsification_conditions:
    - >-
      The affine count on y^2 = f is not 12. That single total is a
      negative.
    - >-
      The affine count on y^2 = g is not 10. That single total is a
      negative.
    - >-
      The three quadratics in f are not pairwise coprime, or f is not
      squarefree. That voids the admissibility pin. It is not a point
      gap.
  confounders:
    - >-
      Including either point at infinity adds the same integer to a
      smooth model and is undefined for the repeated-factor polynomial.
      Both totals in this claim are affine.
    - >-
      A Legendre symbol that treats 0 as a nonresidue drops the two
      roots of x^2+x+2 and changes both totals.
    - >-
      IDEA-20261005-fb6ec7 compares normalized Richelot triples on the
      first lexicographic admissible triple. This record does not
      evaluate (U, V, W) and pins a different explicit product.
  interpretation_limits:
    - >-
      The gap of 2 is for these two polynomials over F_11. It is not a
      genus-2 Jacobian order, not a (2,2)-isogeny, and not an identity
      between the Wronskian and subresultant formulae in KN-LIT-1371.
    - >-
      The relayed 1.46–1.70 times speedup in KN-LIT-1371 is not a
      measurement of this count. Evaluators timed: 0.
    - >-
      KR-IC-5a43e5's summation polynomials are not used. Factor-base
      elements charged: 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a fixed polynomial h over F_11, the affine point count of
        y^2 = h equals the sum over x in F_11 of the number of square
        roots of h(x). That identity is the counting rule. It does not
        assert that a uniform random degree-6 polynomial has count 12
        or 10. The integer gap is the claim under test, not a
        consequence of a distribution theorem.
      rigorous_support: >-
        In an odd finite field every nonzero square has two square
        roots and every nonresidue has zero. The element 0 has one
        square root. No genus-2 formula is required for the affine
        count.
      validation_plan:
        sampling: >-
          Evaluate both pinned polynomials at all 11 field elements.
          There is no random sample. A second implementation repeats
          the same 22 evaluations.
        comparison: >-
          Each implementation's two totals against 12 and 10.
        tail_check: >-
          A square-root counter that returns a value outside {0,1,2},
          or a total outside {0,1,...,22}, rejects the run. Agreement
          of the two implementations on a total other than the
          predicted pair falsifies the claim rather than confirming the
          implementation.
        parameters: >-
          Field F_11, two pinned degree-6 polynomials, 11 abscissae
          each. No transfer to other primes, to Jacobian orders, or to
          the codomain triple (U, V, W).
