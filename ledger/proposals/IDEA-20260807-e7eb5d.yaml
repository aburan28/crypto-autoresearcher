idea:
  id: IDEA-20260807-e7eb5d
  question_id: RQ-PAIR-21313f
  added: '2026-08-07'
  title: >-
    THE SELF-PAIRING INSTRUMENT AND ITS NULL - a pure-Python Miller-loop
    calculator for the Weil and reduced Tate pairings on toy curves, certified
    in BOTH directions before any lane result is believed - it must return a
    NON-TRIVIAL value on three planted positives (a supersingular curve with its
    textbook distortion map, an ordinary curve with p = 1 mod N, a curve with a
    known small k and two independent points) and EXACTLY 1 on the forced null
    (ordinary, k > 1, self-pairing), with the artifact tell named in advance -
    a non-trivial self-pairing at k >= 2 is a missing or wrong final
    exponentiation, not a discovery
  class: control

  claim: >-
    (A) WHY THIS EXISTS. This lane's three closure records
    (IDEA-20260807-464ff8, IDEA-20260807-30868b, IDEA-20260807-b92080) all
    assert NEGATIVES about pairing values. Under docs/inventor-protocol.md,
    "controls before belief", a reported signal is an artifact until the
    identical measurement has been run against a null object of the same shape -
    and the symmetric requirement for a negative is that the instrument must be
    shown able to produce the corresponding positive. This program has NO
    pairing code - grep for "Miller" over harness/ returns nothing, and
    harness/toycurve.py implements the group law and nothing else. Every
    negative in this lane is currently uninstrumented.

    (B) WHAT THE INSTRUMENT IS. Pure Python, no Sage, following the existing
    harness conventions. Components -
      (i) F_{p^k} arithmetic by polynomial arithmetic modulo an irreducible
      polynomial found by trial, for small k only (k <= 12 at toy p);
      (ii) Miller's algorithm computing f_{N,P} evaluated at a divisor, with an
      explicit line-function accumulator;
      (iii) the Weil pairing e_N(P,Q) as a ratio of two Miller values, and the
      reduced Tate pairing t(P,Q) = f_{N,P}(D_Q)^{(p^k - 1)/N};
      (iv) the divisor-shift handling that a SELF-pairing requires - to evaluate
      f_{N,P} at a divisor equivalent to (P) - (O) one must use
      (P + R) - (R) for an auxiliary R with support disjoint from
      div(f_{N,P}). R IS NOT A SECOND INDEPENDENT POINT OF G and its use does
      not violate the one-point requirement of RQ-PAIR-21313f, but this is
      exactly where a false positive or false negative is most likely to be
      manufactured, so the instrument must expose R and report invariance
      across it.

    (C) THE CERTIFICATION PROTOCOL, WHICH IS THE ACTUAL PROPOSAL. Six gates,
    all of which must pass before any lane record cites a pairing value.
      G1 BILINEARITY - e(aP, bQ) = e(P,Q)^{ab} for random a, b, on 100 random
        triples. Failure means the Miller loop is wrong.
      G2 ALTERNATION - e_N(P,P) = 1 for the Weil pairing, on every curve. This
        is a property of the construction, not of the curve, so it must hold
        even on the planted positives. A Weil self-pairing other than 1 is a
        pure implementation bug.
      G3 PLANTED POSITIVE ONE, SUPERSINGULAR DISTORTION - the curve
        y^2 = x^3 + x over F_p with p = 3 mod 4, with psi(x,y) = (-x, i.y),
        i^2 = -1 in F_{p^2}. Here e_N(P, psi(P)) MUST be a primitive N-th root
        of unity. This is the textbook distortion map and it is the only
        positive control that exercises the modified-pairing code path.
      G4 PLANTED POSITIVE TWO, ORDINARY k = 1 - a curve with p = 1 mod N, where
        by IDEA-20260807-30868b the reduced Tate self-pairing t(P,P) must have
        exact multiplicative order N in F_p^*. Constructing one is easy - search
        toy p and small trace until N divides p - 1, or take a trace-two curve
        of order p - 1 directly.
      G5 PLANTED POSITIVE THREE, SMALL k WITH TWO POINTS - an ordinary curve
        with k in {2,3,4,6} and a point Q in E(F_{p^k}) outside G; the classical
        MOV transfer must succeed end-to-end, and the recovered logarithm must
        be independently re-verified as [x]P = Q ON THE CURVE, per
        docs/claims-and-verification.md, never in the field.
      G6 FORCED NULL - ordinary curves with k >= 2 - t(P,P) must equal exactly 1
        for every P of order N, and e_N(P, psi(P)) must equal exactly 1 for
        every available endomorphism psi.

    (D) THE NULL AND ITS DECAY PARAMETER, STATED PRECISELY BECAUSE THE SHAPE
    IS UNUSUAL. The decay parameter is the embedding degree k. The PREDICTED
    shape is a STEP FUNCTION - the fraction of points of order N with a
    non-trivial reduced Tate self-pairing is 1 at k = 1 and 0 at every k >= 2,
    with nothing in between. A gradual decline as k grows is the canonical
    artifact tell of docs/inventor-protocol.md and, in this specific setting,
    has a specific most-likely cause named in advance - an omitted, truncated,
    or wrongly-exponentiated final exponentiation by (p^k - 1)/N, which leaves
    residues in F_{p^k}^* that are not in mu_N and that look non-trivial while
    carrying no pairing information. The second most likely cause is evaluating
    f_{N,P} at (P) - (O) directly instead of at (P+R) - (R), which divides by
    zero or silently produces garbage depending on the implementation. A THIRD
    decay parameter is available and should be used - the auxiliary point R.
    The computed value must be EXACTLY invariant across at least 20 independent
    random R; variance across R is a definitive instrument failure and is
    cheaper to detect than any of the above.

    (E) THE TWO OUTCOMES, BOTH DELIVERABLES. If all six gates pass, this lane's
    negatives become citable and the campaign gains a reusable pairing
    instrument that lanes L3 and L13 can also use. If a gate fails, the failure
    localises the defect - G1/G2 to the Miller loop, G3 to the extension-field
    arithmetic, G4 to the final exponentiation or the divisor shift, G5 to the
    end-to-end transfer, G6 to any of them - and no lane record may cite a
    pairing value until it is repaired. There is no outcome in which the work
    produces nothing.

  resource_label: >-
    audit - consumes no resource. The instrument computes R7 quantities but
    mounts no attack and takes no position on admissibility; it exists to make
    other records' claims about R7 checkable.
  admissibility: admissible
  admissibility_argument: >-
    An instrument proposal is admissible by construction - it asserts nothing
    about the ECDLP and therefore cannot fall foul of the H-ENDO-001 filter or
    of KN-FIND-b7e091. Recorded explicitly so that the campaign's resource table
    has no blank cells and so that no downstream reader mistakes instrument
    admissibility for evidence that a pairing attack is admissible.

  discriminated_from:
    - >-
      IDEA-20260807-464ff8, IDEA-20260807-30868b and IDEA-20260807-b92080 -
      those are claims; this is the apparatus that makes them checkable. All
      three depend on it and it depends on none of them, which is why it should
      be built first.
    - >-
      ideas/catalogue-20260805/A4-transfers-lattice.md item A4-2, a synthetic
      marked-set TRANSFER harness with a density sweep. That instrument
      certifies isogeny path-finding and log pullback; this one certifies
      pairing evaluation. Disjoint code, disjoint failure modes. A4-2 is
      catalogue-only and unrun.
    - >-
      A4-5's proposed C_MOV cost oracle, which is an accounting instrument that
      never evaluates a pairing. This one evaluates pairings and never costs
      them. IDEA-20260807-5f24d7 is the costing half.
    - >-
      harness/toycurve.py, harness/rho.py, harness/semaev.py,
      harness/endomorphism_la.py - the existing instruments. None implements a
      pairing, an extension field, or a Miller loop; a grep for "Miller",
      "Tate pairing" or "final exponentiation" over harness/ returns nothing.
      This is new code in this repository.
    - >-
      NOT an attack and NOT the classical transfer. G5 runs the classical
      transfer once, deliberately, as a positive control on a curve chosen to
      make it work - which is a certification, not a result.

  object_first_candidate:
    tracked_object: >-
      THE INSTRUMENT'S RESPONSE CURVE - the fraction of sampled points of order
      N whose reduced Tate self-pairing is non-trivial, as a function of the
      embedding degree k, together with the invariance of every computed value
      under the auxiliary point R.
    lossiness: >-
      Lossy - it discards every pairing value, every curve and every point, and
      retains one fraction per k plus one boolean per evaluation. It is not a
      change of coordinates; no value is recoverable from the response curve.
    propagation: >-
      Deterministic under the operation the instrument is subjected to, namely
      varying k across the sampled curve population. What is discarded (the
      values themselves) is discarded compatibly, because the theory predicts
      the retained fraction exactly - 1 at k = 1, 0 at k >= 2 - so the retained
      part propagates as a known step function and any deviation is
      attributable.
    survival_score: >-
      Survives until the pairing is replaced by one whose triviality is not
      predicted in advance, at which point the response curve has no reference
      shape and stops being a control. That boundary is exactly the residual
      IDEA-20260807-30868b leaves open (self-pairings outside the Weil, Tate and
      CHM-oriented families), and this instrument cannot certify those.

  mechanism: >-
    STEP 1 - EXTENSION FIELD LAYER. Represent F_{p^k} as F_p[x]/(f) with f
    irreducible found by random search plus a primitivity check; implement
    add, multiply, invert (extended Euclid) and Frobenius. Validate against
    known field-order facts - the multiplicative group has order p^k - 1, a
    random element raised to that power is 1, and the number of solutions of
    x^N = 1 is gcd(N, p^k - 1). Three checks, all cheap, all decisive.
    STEP 2 - MILLER LOOP. Double-and-add over the binary expansion of N,
    accumulating line and vertical functions evaluated at the target divisor.
    Validate by G1 (bilinearity) and by the identity f_{N,P}(D) computed two
    ways - directly, and via f_{N,P} = f_{a,P}^b . f_{b,aP} . (line corrections)
    for a random split N = ab + c. Two independent computations agreeing is a
    much stronger check than either alone.
    STEP 3 - WEIL AND TATE. Weil as a ratio of Miller values with the standard
    sign convention; Tate with the final exponentiation (p^k - 1)/N. Validate G2
    (alternation) and the containment of every reduced Tate value in mu_N,
    checked by raising to N and comparing to 1. THE mu_N MEMBERSHIP CHECK IS THE
    SINGLE MOST IMPORTANT LINE IN THE INSTRUMENT - it catches the final
    exponentiation bug directly, and it must be applied to every value the
    instrument ever emits, including the ones it reports as trivial.
    STEP 4 - DIVISOR SHIFT FOR SELF-PAIRINGS. Implement t(P,P) via
    (P + R) - (R) with R random, reject R whose support meets div(f_{N,P}),
    and report the value together with the list of R used. Emit a per-evaluation
    invariance flag.
    STEP 5 - THE SIX GATES of (C), run as a suite, with a machine-readable
    pass/fail record and the exact seeds.
    STEP 6 - THE RESPONSE CURVE. Sample toy curves stratified by k in
    {1,2,3,4,6,8,12} - which requires deliberately CONSTRUCTING small-k curves,
    since random ones will not have them - and emit the fraction with
    non-trivial self-pairing per k, with exact binomial intervals.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Run 2026-08-07. grep -i for "Miller loop", "Miller's algorithm", "reduced
      Tate", "final exponentiation" across the repository; inspection of
      harness/toycurve.py's function list; grep of ledger/ for pairing
      instruments.
    results: >-
      No pairing implementation exists in harness/. The four hits for "Miller"
      elsewhere are in research_digest chunks, in KN-LIT notes, in
      ideas/ECDLP-IDEA-007 (a "Miller's unit descent" hypothesis, unrelated -
      it concerns Miller's algorithm only by name), and in
      ledger/EV-NET-001 / experiments/EXP-NET-001 (elliptic nets, which are a
      different computational route to the same pairings and are NOT a
      general pairing instrument). No certified pairing instrument exists in
      this program.
    verdict: >-
      ADAPTATION. Miller's algorithm is thirty-five years old and nothing about
      it is claimed as new. What is new to this program is having one, and
      specifically having one with a six-gate certification protocol whose
      forced null is DERIVED IN ADVANCE from IDEA-20260807-30868b's argument
      rather than measured and then rationalised. NOTE - experiments/EXP-NET-001
      may already contain reusable elliptic-net machinery; Stage 0 must inspect
      it before writing new code, and reusing it would be a better outcome than
      duplicating it.

  null_object_control: >-
    THIS RECORD IS ITSELF A NULL-OBJECT PROPOSAL, so the requirement is
    reflexive and is met by requiring the instrument to be certified in BOTH
    directions rather than one.
    FORCED NULL - ordinary curves with k >= 2 - self-pairing exactly 1, on 100
    percent of points, with the value's membership in mu_N separately verified.
    MATCHED NULL OF THE SAME SHAPE - the same Miller loop evaluated at a random
    point of E(F_{p^k}) that is NOT in E[N]; the reduced value must not lie in
    mu_N, which proves the mu_N test has resolving power rather than always
    passing.
    DECAY PARAMETERS, THREE - (i) k, over which the non-trivial fraction must
    step from 1 to 0 between k = 1 and k = 2 and stay at 0; (ii) the auxiliary
    point R, over which every value must be exactly invariant; (iii) the number
    of sampled points per curve, over which the measured fraction must
    concentrate rather than wander.
    NEGATIVE-CONTROL INSTRUMENT - a DELIBERATELY BROKEN copy with the final
    exponentiation removed. It must FAIL G4's mu_N check and must produce
    apparently non-trivial self-pairings at k >= 2. If the broken copy passes
    the suite, the suite does not test what it claims to test and the whole
    instrument is void.

  assumptions:
    - >-
      Toy scale, p <= 2^32 and k <= 12, pure Python, no Sage. F_{p^k}
      arithmetic at k = 12 and p near 2^20 means elements are 12 coefficients
      of 20 bits - entirely feasible. Nothing here extrapolates to
      cryptographic scale and no evidence produced by this instrument may be
      recorded above claim_tier toy.
    - >-
      Small-k curves must be CONSTRUCTED, not sampled - a random toy curve has
      large k with overwhelming probability (KN-LIT-086). The construction is
      part of the instrument's cost and is the main implementation risk.
    - >-
      [textbook, not transcribed here] Miller's algorithm, the Weil pairing's
      alternating property, Frey-Ruck non-degeneracy, and the standard
      supersingular distortion map on y^2 = x^3 + x. A KN-LIT transcription of
      at least the distortion map is owed before G3 is cited as a control in a
      published record.
    - >-
      The auxiliary point R is not a second independent point of G. This is an
      assumption about what RQ-PAIR-21313f's "one point" requirement means, and
      it is stated so a reviewer can disagree with it explicitly rather than
      silently.

  proof_search_map:
    not_applicable_reason: >-
      Purely instrumental. No theorem, asymptotic bound, certificate family,
      reduction or closure argument is claimed. The one derived quantity - that
      the forced null must be exactly 1 for k >= 2 - is imported from
      IDEA-20260807-30868b's argument (C) and is used here as a control rather
      than established here. The end-to-end solve in G5 emits a solution
      certificate per docs/claims-and-verification.md, which is a verification
      obligation and not a proof obligation.

  predictions:
    - metric: >-
        fraction of points of order N with non-trivial reduced Tate
        self-pairing, as a function of k
      direction: different
      minimum_effect: >-
        A STEP - exactly 1.00 at k = 1 and exactly 0.00 at every k in
        {2,3,4,6,8,12}, with no intermediate value at any k. Any intermediate
        value at any k is an instrument failure and the record pre-commits to
        diagnosing the final exponentiation first, the divisor shift second, and
        the Miller loop third, in that order.
    - metric: >-
        invariance of each computed self-pairing value across 20 independent
        auxiliary points R
      direction: different
      minimum_effect: >-
        Exact equality in all 20 cases, on 100 percent of evaluations. A single
        disagreement voids every value the instrument has produced.
    - metric: >-
        e_N(P, psi(P)) on the supersingular positive control
      direction: higher
      minimum_effect: >-
        A primitive N-th root of unity on 100 percent of trials. Anything else
        means the instrument cannot see a distortion map and no negative from it
        is interpretable.
    - metric: >-
        pass rate of the deliberately broken copy on the six-gate suite
      direction: lower
      minimum_effect: >-
        It must FAIL at least G4 and G6. A broken copy that passes proves the
        suite is decorative.
    - metric: >-
        end-to-end logarithm recovery on the G5 small-k curve, verified as
        [x]P = Q on the curve
      direction: higher
      minimum_effect: >-
        100 percent recovery with certificate verification independent of the
        solver. A recovery verified only in the field is rejected outright -
        that is the exact defect pattern recorded against EV-IT-002.

  minimal_test:
    design: >-
      STAGE 0 (hours): inspect experiments/EXP-NET-001 and harness/ for
      reusable machinery; reuse beats rewrite. STAGE 1 (day): extension-field
      layer plus its three validation checks. STAGE 2 (day): Miller loop plus
      G1 and the two-way split validation. STAGE 3 (hours): Weil and Tate plus
      G2 and the mu_N membership test on every emitted value. STAGE 4 (hours,
      HARD GATE): G3 supersingular distortion positive. STAGE 5 (hours, HARD
      GATE): G4 ordinary k = 1 positive, including the divisor-shift invariance
      sweep over R. STAGE 6 (hours): G5 end-to-end transfer with an
      independently verified certificate. STAGE 7 (hours): G6 forced null and
      the response curve over k. STAGE 8 (hours, HARD GATE): the deliberately
      broken copy must fail.
      THE CHEAPEST GATE THAT COULD KILL THE WHOLE LINE IS G2 PLUS THE mu_N
      MEMBERSHIP CHECK - both are one line each and both fail loudly on the two
      most common implementation errors.
    controls:
      - supersingular distortion positive (G3)
      - ordinary k = 1 positive (G4)
      - small-k two-point transfer with an on-curve certificate (G5)
      - ordinary k >= 2 forced null (G6)
      - deliberately broken copy with the final exponentiation removed
      - random non-N-torsion point, whose reduced value must lie outside mu_N
      - 20-fold auxiliary-point invariance sweep
    required_metrics:
      - per evaluation - the pairing value, its order, its mu_N membership, the auxiliary R used
      - >-
        per curve - the tuple (p, a, b, trace t, group order, N, k, and whether
        the curve is ordinary or supersingular)
      - the response curve - non-trivial fraction per k with exact binomial intervals
      - per gate - pass or fail, with seeds and the exact command
      - broken-copy suite results
      - wall-clock and peak memory per k, to record where toy feasibility ends

  falsification_conditions:
    - >-
      Any gate failing. The instrument is not certified and no lane record may
      cite a pairing value until it is. This is an infrastructure outcome under
      AGENTS.md rule 5, never mathematical evidence about self-pairings.
    - >-
      The deliberately broken copy passing the suite. The suite is decorative
      and must be redesigned before anything is reported.
    - >-
      A non-trivial self-pairing appearing at k >= 2 and SURVIVING all three
      decay parameters and the broken-copy comparison. That would refute
      IDEA-20260807-30868b's argument (C), which is a textbook argument, so the
      record pre-commits to treating it as an instrument failure until an
      independent reimplementation reproduces it - and to escalating it for
      independent review-breakthrough scrutiny if one does.
    - >-
      F_{p^k} arithmetic at k = 12 exceeding budget. Infrastructure outcome;
      the response curve is truncated at the largest feasible k and reported as
      truncated, never as a measurement at the missing k.

  confounders:
    - >-
      The final exponentiation. Omitting or mis-computing (p^k - 1)/N is the
      single most common pairing implementation error and it manufactures
      exactly the false positive this lane is most at risk of. The mu_N
      membership check on every emitted value is the mitigation and it is
      mandatory.
    - >-
      The divisor shift. Evaluating f_{N,P} at (P) - (O) rather than
      (P + R) - (R) either divides by zero or silently returns a value with no
      pairing meaning. The R-invariance sweep is the mitigation.
    - >-
      Curve selection. A "random toy curve" has large k, so a suite run only on
      random curves exercises G6 and nothing else, and would certify an
      instrument that has never produced a non-trivial value. Small-k curves
      must be constructed deliberately and their construction is part of the
      instrument.
    - >-
      Supersingular versus ordinary confusion. The G3 control is supersingular
      BY DESIGN; a reader who takes its positive result as evidence about
      ordinary curves has inverted the control's purpose. Every report of G3
      must carry that sentence.
    - >-
      Reusing EXP-NET-001's elliptic-net code without re-certifying it. Elliptic
      nets compute the same pairings by a different recurrence and inherit none
      of this suite's gates. If reused, the gates must be run against it.

  interpretation_limits:
    - >-
      An instrument. It establishes nothing mathematical, moves no exponent, and
      its passing certifies only that measurements taken with it are worth
      discussing.
    - >-
      Toy scale only, p <= 2^32 and k <= 12. No result obtained with it may be
      recorded above claim_tier toy, and the response curve at k <= 12 says
      nothing about k at cryptographic size.
    - >-
      G5's successful transfer is a POSITIVE CONTROL ON A CURVE CHOSEN TO MAKE
      IT WORK. It is not evidence that any curve of interest is vulnerable, and
      quoting it as such would be the exact scope error KN-TECH-032 warns about.
    - >-
      The instrument cannot certify self-pairings outside the Weil, Tate and
      distortion-modified families, because for those the reference value is not
      predicted in advance and the null has no shape.

  reachability_gate: >-
    NOT APPLICABLE - the instrument moves between no curves. It does, however,
    have to REACH small-k curves by construction in order to have positive
    controls at all, and the cost of that construction is the honest
    reachability statement here - a random toy curve will not do, a CM
    construction or an exhaustive small-p search is required, and if that
    construction cannot be completed within budget then G3, G4 and G5 are
    unavailable and the instrument is certified only in the negative direction,
    which is not enough. That contingency is stated in advance rather than
    discovered.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT. The instrument's own cost - one Miller loop is
      O(log N) operations in F_{p^k}, each O(k^2) or O(k^{1.58}) F_p
      multiplications, so a self-pairing costs roughly k^2 log N word
      operations at toy scale. The response curve over seven values of k and a
      few hundred curves is minutes to hours.
    memory_exponent: >-
      O(k log p) bits per field element; negligible at toy scale. Recorded
      because the SAME quantity is the binding obstruction at cryptographic k
      (IDEA-20260807-5f24d7), and having measured it at toy scale makes the
      large-k statement concrete rather than rhetorical.
    best_known: >-
      Not applicable to an instrument. The baselines the instrument's outputs
      will be compared against are rho at 0.886 sqrt(N) (KN-TECH-001,
      KN-TECH-006) and BSGS (KN-TECH-031), and G5's transfer must be charged
      against them with the field DLP included.
    hidden_overhead: >-
      The construction of small-k toy curves is the hidden cost and it is
      larger than the pairing code itself. Disclosed here so the budget is not
      surprised by it.
    tradeoff_note: >-
      Not applicable - no algorithm is produced.

  dominated_by: >-
    n/a as an attack - no result is claimed and no point on any cost frontier
    is occupied. Checked anyway across every row, since an unchecked null is a
    fabrication - rho at 0.886 sqrt(N) with O(1) memory (KN-TECH-001,
    KN-TECH-006), automorphism-discounted rho (KN-TECH-018), BSGS at
    sqrt(N)/sqrt(N) (KN-TECH-031) with n^{2/3+o(1)} full cost (KN-TECH-035),
    MOV/Frey-Ruck at small k (KN-TECH-032), the anomalous transfer
    (KN-TECH-033) - none is competed with, all dominate a null attack trivially.
    As an INSTRUMENT the only incumbent in this repository is
    experiments/EXP-NET-001's elliptic-net machinery, which computes related
    quantities by a different recurrence and carries none of this suite's
    gates; whether it dominates on coverage is a Stage-0 question and the answer
    "reuse it" would be a good outcome.
  sota_delta: >-
    Zero against every attack baseline. Instrument delta, quantified - from
    ZERO certified pairing evaluations in this program to a six-gate suite with
    three planted positives, one forced null derived in advance, three decay
    parameters, and a deliberately broken negative-control copy; and from zero
    to seven values of k on a measured response curve with exact binomial
    intervals. Every negative in IDEA-20260807-464ff8, -30868b and -b92080 is
    uncitable without it.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that the six-gate suite can be built and passed in pure Python within
    budget - Miller's algorithm at toy scale is a known quantity and the risk is
    concentrated in the extension-field layer and the divisor shift, not in the
    mathematics. 0.60 that all three planted positives are available, the
    binding risk being the construction of a small-k ordinary curve with
    k in {3,4,6} at toy p, which needs a CM construction the harness does not
    have; the k = 1 and supersingular positives are near-certain. 0.95 that the
    forced null returns exactly 1 wherever it is run, since the prediction is a
    theorem. 0.99 that a first implementation fails at least one gate on the
    first attempt, which is the normal and intended behaviour of a suite built
    to be failed.

