# IDEA-20261004-e6d436
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-e6d436
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-25 window table stores 16777216 entries and a width-24 table stores 8388608
  class: representation
  claim: >-
    A window of width 25 stores 16777216 precomputed entries. A window of
    width 24 stores 8388608. Sixteen million seven hundred seventy-seven
    thousand two hundred sixteen exceeds eight million three hundred
    eighty-eight thousand six hundred eight by 8388608. The product of the
    two table sizes is 140737488355328. Their sum is 25165824. The gap is a
    table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    24 is 16777216. Two to the power 23 is 8388608. Two width-24 tables both
    store 8388608, so that gap is 0 and their product is 70368744177664. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 8388608.
    baseline_embedding:
      parameter_slice: The widths 25 and 24 and the sizes 16777216 and 8388608.
      reproduction_check: >-
        Two readers must agree that 2 to the power 24 is 16777216 and that
        2 to the power 23 is 8388608.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 8388608 drops the gap. Two width-24
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-24 table.
        predicted_gain: Eight million three hundred eighty-eight thousand six hundred eight fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 16777216 and 8388608. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-24 tables. Both store 8388608, and the gap is 0.
    proof_obligations:
      - claim: The width-25 table stores 16777216 entries.
        responsibility: size
      - claim: The width-24 table stores 8388608 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Sixteen million seven hundred seventy-seven thousand two hundred sixteen exceeds eight million three hundred eighty-eight thousand six hundred eight by 8388608.
  minimal_test:
    design: >-
      Compute 2 to the power 24 and 2 to the power 23. Do not add a
      curve point.
    controls:
      - Two width-24 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-25 table size is not 16777216.
    - The product of the two sizes is not 140737488355328.
  confounders:
    - A width-24 table of size 8388608 is a different window from a width-23 table of size 4194304.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 8388608 and 4194304.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-25 table has size 2 to the power 24, and the
        frozen width-24 table has size 2 to the power 23.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Sixteen million seven hundred seventy-seven thousand two hundred sixteen stored entries versus eight million three hundred eighty-eight thousand six hundred eight, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-38be82
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 16777216 and 8388608 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 16777216 versus 8388608
    data_queries: Two frozen widths.
