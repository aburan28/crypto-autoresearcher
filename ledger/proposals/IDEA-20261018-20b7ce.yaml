idea:
  id: IDEA-20261018-20b7ce
  question_id: RQ-SBRG-f31cb2
  added: '2026-10-18'
  status: proposed
  approved_by: null
  proposed_by: idea-synthesist
  title: >-
    The generic-rank-matched null for Macaulay-side reuse claims: forced
    certificate sharing is a corank-law probability from the flag-tensor table
  class: control
  claim: >-
    BRIDGE of the 845d35 design probe, IDEA-20261017-5f29b6, -a6a5ae, -bd337d.
    With structural rows S and target rows T(r) = T_0 + sum r_i T_i (5f29b6),
    the certificates of a refuted r form an affine subspace Lambda(r) of
    dimension s(r) = rows - rank[S; T(r)] in the c-dimensional coefficient
    space. (A) Two refuted targets share a certificate iff Lambda(r), Lambda(r')
    meet; at the generic (rank, s) profile P_forced = 1 - O(2^(-(s+s'-c))) when
    s + s' > c, else about 2^(-(c-s-s')). The probe's 8/8 at n = 7, D = 6
    (s about 9000 of c = 17619) is P_forced near 1: the 845d35 E-point met the
    wrong null. (B) (c, s) follows from one leaf-block table N_A(a, w) for
    balanced trees (a6a5ae), so the null needs no elimination of the real
    system. (C) A coset certificate is a negative group test: classify-all
    saves at most 1/H_2(1/t!) (bd337d), a free UNSAT-skip oracle at most t!,
    both N-constants. Prediction: pi_share - P_forced = 0 within binomial error
    at (n, D) = (7, 6), (9, 6); d_star equals its generic value. See notes.
  mechanism: >-
    PAIR (R1 F_2 bit coordinates after Weil descent; Sigma = additive
    translations of the target bit vector, not group translation);
    coordinate-dependent. Object: the (rank profile, s) of the pencil, lossy
    and invariant under row and column operations; the forced term of the null
    is the generic rank (term (c) of IDEA-20261018-5fa71b). KN-OPEN-020: scoped.
  novelty_status: unverified
  citations:
    - {ref: analysis/sbrg-845d35-design-probe-20261017/README.md, provenance: internal, claim: 8/8 pairs share; s about 9000 of 17619, verified_by: idea-synthesist 2026-10-18}
    - {ref: IDEA-20261017-845d35, provenance: internal, claim: sharing law; E-point 0; support-only null, verified_by: idea-synthesist 2026-10-18}
    - {ref: Kolchin; Brent-McKay corank law, provenance: recalled, claim: P(corank k) = alpha 2^(-k^2)/prod(1 - 2^(-i))^2, verified_by: null}
  assumptions: []
  predictions:
    - {metric: pi_share(real) minus P_forced(matched profile) per cell, direction: different, minimum_effect: within binomial error (20,000 pairs); excess above 3 sd replicated is structure}
    - {metric: d_star (845d35) minus its generic value, direction: different, minimum_effect: 0; positive means a universal component}
    - {metric: planted universal component of dimension d_p, direction: different, minimum_effect: recovered exactly (blocking)}
  minimal_test:
    design: >-
      Stage 0: P_forced formula and the (c, s) table from N_A for chain_t3 n =
      7, 9 and balanced_t4 n = 8 at D = 5, 6. Stage 1: random pencils at the
      same (rank, s) profile, 20,000 pairs each, sharing vs P_forced. Stage 2:
      real systems at the same cells (probe code n = 7; C eliminator n = 9):
      pi_share, d_star, planted component. Stage 3: bd337d slope vs generic.
    controls:
      - random pencil at matched (rank, s) profile (the null); support-only pencil (845d35 null)
      - planted universal component (blocking positive)
    required_metrics: [c, s per target, P_forced, pi_share, d_star, planted recovery]
  falsification_conditions:
    - Planted component not recovered: instrument defect, halt.
    - Profile-matched random pencils differ from P_forced beyond binomial error: formula wrong.
    - Real pi_share equal to P_forced everywhere: reuse generic there; 845d35 closed at those cells.
  confounders:
    - Trivial syzygies inflate s equally in real and null once matched; report per E/2E class.
  interpretation_limits:
    - Toy binary cells, Macaulay not F4; no exponent; targets vary here, curves in the DREG census.
  heuristic_assumptions:
    - id: H1
      statement: After matching the (rank, s) profile, certificate spaces of distinct targets are generic.
      rigorous_support: counting of affine subspaces over F_2 and the limiting corank law (recalled).
      validation_plan: Stage 1 random pencils, 20,000 pairs per cell, observed rate vs formula.
  target_complexity:
    time_exponent: none; a coset library moves an exponent only if L = poly(n) with shared dimension Theta(n)
    memory_exponent: library L n (n - d) bits; the matched null costs one block table
    best_known: Pollard rho 0.886 sqrt(N) (KR-RHO-13bf67); per-target elimination (KR-IC-f3da82)
    hidden_overhead: the C eliminator for n = 9 at D = 6; caps t! and 1/H_2(1/t!) are N-constants
  estimated_cost: {implementation: medium, compute: low}
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
