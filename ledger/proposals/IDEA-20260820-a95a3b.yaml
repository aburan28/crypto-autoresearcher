idea:
  id: IDEA-20260820-a95a3b
  question_id: RQ-SQISIGN-001
  added: '2026-08-20'
  title: Component-wise conditional-randomization knockoff test for SQIsign transcripts
  class: simulator_localization_diagnostic
  claim: >-
    Conditional-randomization knockoffs for individual public transcript
    components may localize which declared simulator conditional law is
    misspecified while preserving the remaining public transcript shape. This
    proposed localization tool does not claim that a mismatch exists or is
    exploitable.
  mechanism: >-
    Freeze a public transcript decomposition and, for each selected component
    X_j, a public Markov blanket B_j under the declared simulator factorization.
    Construct a knockoff X_j' by resampling from the simulator conditional law
    given B_j while holding all other public fields fixed. Compare a frozen
    verifier-compatible score on the original and knockoff transcripts using a
    sign-flip or exchangeability statistic. The planted positive tilts only one
    component conditional by epsilon while preserving its unconditional
    marginal through compensating public strata.
  novelty_status: unverified
  status: proposed
  source_refs:
    - ref: RQ-SQISIGN-001
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: simulator research scope
    - ref: KN-TECH-058
      provenance: kb
      verified_by: TASK-20260820-5f47b5
      use: baseline caveats; inherited reductions and heuristic assumptions remain unverified
    - ref: IDEA-20260820-a0649e
      provenance: internal
      verified_by: TASK-20260820-5f47b5
      use: nearest graph-audit predecessor; this record adds component-wise knockoff exchangeability and localization
  predictions:
    - id: P1
      statement: >-
        Under genuine-simulator nulls, original/knockoff score signs are
        exchangeable and familywise component rejection is at most 0.05 plus
        Monte Carlo error over 100 repetitions.
    - id: P2
      statement: >-
        With one component conditional tilted to conditional total variation
        0.10 while preserving its marginal, the designated component is ranked
        first in at least 80% of 100 planted-positive repetitions.
    - id: P3
      statement: >-
        Nontarget components retain rejection probability at most 0.05 plus
        multiplicity-adjusted Monte Carlo error in the planted condition.
  controls:
    true_simulator_null: >-
      Draw base transcripts and every component knockoff from the declared
      simulator, using disjoint coins and the identical frozen public blankets.
    planted_positive: >-
      Tilt one component conditional to total variation 0.10 in opposite
      directions across two matched public strata so its unconditional marginal
      remains within total variation 0.02 of the null marginal.
    observation_collision: >-
      For distinct hidden paths producing the same public transcript and
      knockoff component, require identical scores and component rankings.
    nearby_object: >-
      Resample the target from its unconditional marginal instead of its
      conditional law; this deliberately wrong knockoff must be detected on a
      synthetic dependency benchmark before any SQIsign interpretation.
  falsification_conditions:
    - Familywise null rejection exceeds 0.05 beyond Monte Carlo error.
    - The conditional resampler requires secret, path, retry, or timing information.
    - Target-first localization power at conditional total variation 0.10 is below 0.80.
    - The planted unconditional marginal moves by total variation above 0.02.
  confounders:
    - misspecified or overly broad public Markov blankets
    - invalid transcripts after holding non-target components fixed
    - support holes in conditional resampling
    - shared randomness among component knockoffs
  interpretation_limits:
    - Localization identifies a failed declared conditional law, not a security exploit.
    - Passing covers only selected components, blankets, scores, and tested parameters.
    - Hard-problem, recovery, leakage-rate, and asymptotic conclusions are excluded.
  heuristic_assumptions:
    - Each frozen component conditional can be sampled on its public support.
    - Verifier-compatible reconstruction after component replacement is well-defined or explicitly rejected.
    - KN-TECH-058 reductions and heuristics remain inherited and unverified.
  target_complexity:
    time: O(q * k * (C_cond + C_verify + C_score))
    memory: O(k) streaming component summaries
    data: q public base transcripts plus k knockoffs per transcript
    scope: k preregistered public components and blankets
  cost_model:
    time: k conditional resamples, verifier checks, and score evaluations per base transcript
    memory: one base transcript, one knockoff, and k accumulators
    data: q independent base transcripts per condition
    preprocessing: freeze decomposition, blankets, conditional samplers, score, and multiple-testing rule
    oracle_access: declared simulator conditional sampler only
    verification: replay conditional draws, public reconstruction, verifier checks, and sign statistics
  proof_search_map:
    exact_baseline_reproduction: Enumerate a toy public factorization and verify exact original/knockoff exchangeability.
    observation_collision_search: Enumerate hidden-path collisions and require identical public knockoff scores.
    quantifier_order_statement: Freeze components, blankets, conditional samplers, and score before evaluation data.
    method_ceiling: Bound localization to selected conditionals; do not infer full-law equality or exploitability.
    nearby_object_control: Use an unconditional rather than conditional knockoff on a known-dependent synthetic benchmark.
  nearest_neighbors:
    - IDEA-20260820-a0649e
    - IDEA-20260820-c69c74
    - IDEA-20260820-653179
  dominated_by: n/a (no result claimed)
  sota_delta:
    metric: claimed SQIsign leakage
    baseline: 0
    proposed: 0
    delta: 0
    units: bits per transcript
    rationale: new localization diagnostic only
  recommended:
    next_test: Exact toy exchangeability proof, wrong-knockoff benchmark, then frozen genuine-null and one-component positive calibration.
    stopping_rule: Stop at preregistered q and k; no component or blanket selection after evaluation starts.
    required_artifacts: [component_schema, blanket_spec, conditional_sampler, reconstruction_checks, seeds, knockoff_statistics]

