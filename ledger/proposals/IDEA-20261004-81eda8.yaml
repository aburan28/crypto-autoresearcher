  title: >-
    Multiplication by 24 has degree 576 and multiplication by 23 has degree 529
  class: measurement
  claim: >-
    Multiplication by 24 has degree 576. Multiplication by 23 has
    degree 529. Five hundred seventy-six exceeds five hundred
    twenty-nine by 47. The product of the two degrees is 304704. Their
    sum is 1105. The gap is a map degree, not an ECDLP exponent and not
    the degree pair 529 and 484.
  mechanism: >-
    OBJECT FRAME. R3 is the multiplication endomorphism. The
    operation set is reading the degree, which is coordinate-dependent
    on the integer multiplier and is not a translation of a curve
    point. Twenty-four squared is 576. Twenty-three squared is 529. Two
    maps of degree 529 have gap 0 and product 279841. No point is mapped.
