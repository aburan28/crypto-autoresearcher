idea:
  id: IDEA-20260816-576d70
  question_id: RQ-MCE-e65b3c
  added: '2026-08-16'
  title: Compile this program's own committed reading of the arXiv:2304.14757 boundary -- RQ-MCE-3f7c02's
    family exclusion as completed by RQ-MCE-f8fca0's present-tense, phase-scoped, explicitly-unproved
    qualification -- into a three-valued machine-checkable predicate over a parameter tuple, and lint
    every committed GOAL-MCE-001 deliverable sentence against it.
  class: theory
  claim: '(A) The two committed clause-supersession records already in this repository determine,
    without re-reading any external text, a predicate APPLIES(clause, params) whose range has THREE
    values and not two: applies; excluded_by_family; excluded_but_the_authors_conjecture_the_exclusion_falls.
    RQ-MCE-3f7c02 supplies the family conjunct verbatim and its Table 1 restriction row; RQ-MCE-f8fca0
    supplies four passages Q-1..Q-4 establishing that the same exclusion is presented as a present-tense
    obstruction to one phase, explicitly not proved, which the authors conjecture will fall. The third
    value is the one the program has demonstrably lost twice: DEC-20260808-a67816 D-5 records that
    the omission ran in one direction, toward dismissal. (B) A predicate is cheap and checkable where
    prose is not. A short pure-Python function plus a truth table over every parameter tuple the repository
    holds, plus a linter that flags any committed sentence asserting a two-valued reading, converts
    a correction that currently lives in two long YAML records into an artifact a later session cannot
    skim past. (C) NOT CLAIMED, explicitly: nothing about what arXiv:2304.14757 actually says beyond
    what this program''s own committed records already quote; no re-reading, no new transcription,
    no PDF fetch, no assertion about what any literature contains; no security consequence; and above
    all NOT a claim that the exclusion holds or that it falls. The predicate encodes the program''s
    committed statement of a boundary and its modality; it adjudicates nothing about the mathematics.
    (D) The construction is falsifiable in a way prose corrections are not: if permuting the modal
    fields across conjuncts leaves the truth table unchanged, then modality is not load-bearing, the
    three-valued design is decoration, and this proposal is refuted by its own null arm at essentially
    zero cost.'
  mechanism: 'STAGE 1: extract, not paraphrase. Pull the clause tuples directly out of the two YAML
    records -- RQ-MCE-3f7c02.corrected_boundary (quotation_verbatim, quotation_location, the Table
    1 restriction row) and RQ-MCE-f8fca0.the_sources_own_qualification.passages (Q-1..Q-4, each with
    locus and what_it_establishes) -- into a machine-readable clause file whose every string is a
    byte-for-byte copy from a committed record, with the record id and field path carried alongside
    so provenance is checkable by string match. STAGE 2: normalise each conjunct into (predicate over
    parameters, tense, proof_status, conjecture_status, restricted_phase). The family conjunct is
    a predicate over the code family; the characteristic and extension-degree conditions from the
    Table 1 restriction row are predicates over (q, m); the phase restriction is a predicate over
    which stage of an attack is being discussed. STAGE 3: define APPLIES as the meet over conjuncts
    in a four-element lattice with ''undetermined'' absorbing, so that composition of two partial
    readings cannot manufacture certainty. STAGE 4: evaluate the truth table over every parameter
    tuple committed in the repository -- the toy grid of RQ-MCE-b38a8b, the five parameter sets referenced
    by EXP-MCE-350abf, the cells of EXP-MCE-3ffdf9 -- and publish it. STAGE 5: lint. Scan committed
    GOAL-MCE-001 deliverable text for sentences asserting applicability and check each against the
    predicate value at the tuple it names, counting mismatches by direction. STAGE 6: run the modality-scrambled
    null.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read RQ-MCE-3f7c02.yaml and RQ-MCE-f8fca0.yaml in full, including one_defect_three_sites,
      corrected_boundary, the_defect_being_completed, the_sources_own_qualification and passage_provenance.
      Read RQ-MCE-e65b3c.yaml constraints and scope.targets. Ran grep -ril ''goppa'' ledger/proposals/
      and inspected the titles and classes of all twelve proposals bound to RQ-MCE-e65b3c and RQ-MCEQ-fcb504.
      Listed tools/ and noted the existing linters: claim_class_audit.py, validate_ledger.py, check_merge_hygiene.py,
      obstruction_registry.py. Read docs/inventor-protocol.md sections 3 and 4 for the controls-before-belief
      and closure-standard requirements.'
    results: 'The two supersession records exist and are thorough, but both state explicitly ''This
      record asks no question and admits no experiment'' and neither emits a checkable artifact --
      which is why this proposal is filed against RQ-MCE-e65b3c rather than against them. IDEA-20260808-b6ba7a
      is the nearest neighbour: it demands that the comparison parameter for the word ''subexponential''
      be fixed and a single decisive number pre-registered, but it targets KN-LIT-7c4620 (the 2026
      heuristic line) and depends on obtaining an unread PDF; this proposal targets arXiv:2304.14757
      and consumes no unread text at all. IDEA-20260805-9704d9 offers a candidate MECHANISM for the
      exclusion (alternant degree doubling); it explains, this formalises. tools/claim_class_audit.py
      already lints claim classes repository-wide, so a linter harness exists and should be reused
      rather than duplicated. No record in the repository holds a machine-checkable applicability
      predicate for any external result.'
    verdict: 'UNVERIFIED. No agent here can read external literature, so nothing is asserted about
      whether formalising a paper''s applicability boundary as a predicate is novel anywhere outside
      this repository; formal-methods work of that shape is common enough that the honest prior is
      that it is not. What is claimed new is local and narrow: the repository holds two records that
      correct each other in sequence about a single boundary, the second because the first stopped
      at a full stop, and it holds no mechanism that prevents a third session from making the same
      one-directional omission. The parts -- extract, normalise, evaluate on a lattice, lint, scramble
      as a null -- are all standard. The assembly''s only non-obvious moves are making ''undetermined''
      absorbing and making the modality-scramble the null that can refute the whole design.'
  object_first_candidate:
    tracked_object: 'The clause as a tuple, not as prose: (source paper id, ordered list of restriction
      conjuncts, tense of each, proof status of each, conjecture status of each, the phase of the
      attack each restricts, and the committed record id plus field path from which each conjunct
      was copied). The object followed through the computation is that tuple, and everything downstream
      -- truth table, lint verdict, null scramble -- reads only it.'
    lossiness: Genuinely lossy, aggressively so. The paper's mathematics, its proofs, its exponents,
      its Table 1 numeric columns beyond the restriction row, and every argument in it are discarded.
      What is retained is the conjunct structure and the modal status of each conjunct, roughly a
      dozen fields. That still propagates because the only operation applied downstream is 'does a
      claim about applicability at this parameter tuple follow', and that operation reads conjuncts
      and modality and nothing else. The discard is compatible with the operation, which is exactly
      the section 2 requirement; a reading that retained the proofs would be a change of medium, not
      a projection.
    propagation: 'One step of the target operation is: a deliverable emits a sentence asserting something
      about applicability at a named parameter tuple. The predicate maps (clause tuple, parameter
      tuple) into {applies, excluded_by_family, excluded_but_conjectured_to_fall, undetermined}. Composition
      of two deliverables that both speak to the same tuple is the lattice meet of their values, with
      undetermined absorbing. That absorbing choice is the whole content of the propagation rule and
      it is the one thing the design gets to be wrong about: the observed failure mode, twice recorded,
      is a deliverable silently promoting undetermined or conjectured-to-fall up to excluded, and
      an absorbing bottom is the only propagation rule under which that promotion is detectable as
      a lattice violation rather than as a matter of tone.'
    survival_score: 'The object survives exactly as far as the committed quotations reach: five passages
      -- the verbatim exclusion sentence and the Table 1 restriction row in RQ-MCE-3f7c02, plus Q-1
      through Q-4 in RQ-MCE-f8fca0 -- and no further. Beyond them the predicate returns undetermined
      by construction, and that is where the structure dissolves. Stated as a number: five passages,
      one source, zero extrapolation steps. Any attempt to extend the predicate to a sixth passage
      requires new committed transcription and is out of scope here.'
  null_object_control: 'The identical compiler is run, in the same invocation, against a SCRAMBLED
    clause set: the same conjuncts from the same records, but with the modal fields (tense, proof_status,
    conjecture_status, restricted_phase) permuted uniformly at random across conjuncts under a fixed
    seed, repeated 1000 times. The null must show that the truth table MOVES -- that for at least
    a stated fraction of scrambles, at least one parameter tuple changes its predicate value. If the
    truth table is invariant under modality permutation, then the modal fields are not load-bearing,
    the three-valued construction is decoration over a two-valued fact, and this proposal is refuted
    by its own control at zero compute cost. That outcome would be reported as a measured negative
    with its scramble count, not suppressed, and it is a genuinely usable obstruction: it would mean
    the correction in RQ-MCE-f8fca0 changes no downstream applicability verdict, which is itself a
    fact worth having on the record.'
  discriminated_from:
  - 'RQ-MCE-3f7c02 and RQ-MCE-f8fca0 themselves: they RECORD the corrected reading in prose and both
    state they admit no experiment. This proposal makes their content mechanically checkable and treats
    them strictly as sources, asserting nothing beyond the strings they already committed.'
  - 'IDEA-20260808-b6ba7a: fixes the comparison parameter for the word ''subexponential'' against
    KN-LIT-7c4620, an unread 2026 paper, and needs a PDF this environment may not obtain. This proposal
    targets a different paper and needs no external text whatever.'
  - 'IDEA-20260805-9704d9: proposes a MECHANISM for why the exclusion holds (squarefree doubling and
    alternant degree 2t). Explaining a boundary and formalising the program''s committed statement
    of it are different acts; if 9704d9 succeeds, this predicate gains a conjunct and does not change
    shape.'
  - 'tools/claim_class_audit.py: an existing repository-wide linter over claim classes. This is a
    different predicate, over one external result''s applicability rather than over claim tiers, and
    it should reuse that linter''s harness rather than build a second one.'
  - 'A generic literature-summary record: those assert content; this asserts only structure over content
    already committed, and it returns undetermined wherever the committed text runs out.'
  assumptions:
  - The verbatim strings in RQ-MCE-3f7c02.corrected_boundary and RQ-MCE-f8fca0.passages are accurate
    transcriptions; the validator VAL-20260808-71bdb1 is recorded as having checked four of them character
    for character, and this proposal inherits that provenance rather than re-establishing it.
  - No new external text is required, requested, or fetched; the predicate is closed over committed
    repository content by design.
  - The lattice with undetermined absorbing is the right propagation rule; this is a design choice,
    and the modality-scramble null is what tests whether it has any content.
  - The set of committed GOAL-MCE-001 deliverable sentences that assert applicability is finite and
    machine-locatable by pattern; if it is not, the lint arm returns a coverage figure rather than
    a verdict.
  predictions:
  - metric: number of distinct outcome values the compiled predicate takes over the committed parameter
      tuples
    direction: different
    minimum_effect: 'forced value: at least 3. If the predicate takes only 2 values over every committed
      tuple, the three-valued design is falsified and reported as such.'
  - metric: count of committed GOAL-MCE-001 sentences that lint as excluded_by_family where the completed
      reading gives excluded_but_conjectured_to_fall
    direction: higher
    minimum_effect: 1
  - metric: fraction of 1000 modality-scrambles that change at least one truth-table cell
    direction: higher
    minimum_effect: 0.1
  - metric: directional asymmetry of lint mismatches, measured as (mismatches toward dismissal minus
      mismatches toward alarm) divided by total mismatches
    direction: higher
    minimum_effect: 'explicit refusal to pre-commit a magnitude: DEC-20260808-a67816 D-5 already records
      the direction as toward dismissal, so pre-committing a number here would be fitting a prediction
      to a known answer. The sign is predicted positive; the magnitude is measured.'
  minimal_test:
    design: 'The whole thing is a zero-compute symbolic artifact and its cheapest discriminating form
      fits in one afternoon. Copy the five committed passages into a clause file with record id and
      field path attached to each string. Normalise them into conjunct tuples by hand, then commit
      the normalisation before evaluating anything. Write the predicate as roughly sixty lines of
      pure Python over a four-element lattice. Evaluate it on exactly three parameter tuples: one
      toy cell from RQ-MCE-b38a8b, one from EXP-MCE-3ffdf9, and one of the parameter sets named by
      EXP-MCE-350abf. If the three tuples do not receive at least two distinct values, the predicate
      has no discriminating power and the design fails immediately. Then run the modality scramble
      1000 times and count how often any of the three cells moves. Total cost: no compute worth measuring,
      no external fetch, no dependency. The discrimination is that a decoration cannot survive its
      own scramble.'
    controls:
    - Modality-scrambled clause set, 1000 permutations under a fixed seed, run in the same invocation
      as the signal arm.
    - 'Provenance control: every string in the clause file must match a substring of a committed record
      by exact string comparison, checked automatically; any string that does not match is a fabrication
      and fails the build.'
    - 'Two-valued ablation: evaluate the same truth table with the conjecture_status field deleted,
      to isolate how much of the three-valued behaviour comes from that one field.'
    - 'Blind re-normalisation: a second pass normalises the same five passages into conjunct tuples
      without seeing the first pass, and the two normalisations are compared, since normalisation
      is where a human reading could smuggle in a verdict.'
    required_metrics:
    - number of distinct predicate values over committed tuples
    - truth table itself, as a committed artifact
    - count and direction of lint mismatches on committed deliverable text
    - fraction of modality scrambles that move at least one cell
    - agreement rate between the two blind normalisations, per conjunct field
    - count of clause-file strings failing the exact-substring provenance check (must be zero)
  falsification_conditions:
  - The predicate takes only two values over every committed parameter tuple, falsifying the three-valued
    design.
  - Fewer than 10 percent of modality scrambles move any truth-table cell, showing modality is not
    load-bearing and the construction is decoration.
  - Any string in the clause file fails the exact-substring provenance check against a committed record.
  - The two blind normalisations disagree on the conjunct structure of any of the five passages, showing
    the normalisation step carries the verdict rather than the source.
  - Zero lint mismatches on committed deliverable text, which would mean the correction was already
    fully propagated and the linter has no work to do -- a clean negative and a good outcome to record.
  - 'The predicate returns ''applies'' at any tuple, which it must not: nothing in the committed passages
    supports an affirmative applicability verdict, and an affirmative output would indicate a compiler
    bug.'
  confounders:
  - Normalisation is a human reading step and can smuggle the desired verdict into the conjunct structure;
    the blind double-normalisation control exists solely for this and may not fully remove it.
  - The committed passages are themselves a selection made by two prior sessions; a passage neither
    session quoted cannot enter the predicate, and its absence is invisible here.
  - 'Lint pattern coverage: sentences asserting applicability in unusual phrasing will be missed,
    and a low mismatch count could reflect poor coverage rather than a clean corpus.'
  - The lattice choice with undetermined absorbing is not neutral and partly determines the mismatch
    direction it detects.
  interpretation_limits:
  - The predicate encodes this program's committed statement of a boundary, not the boundary; it says
    nothing about whether arXiv:2304.14757's exclusion holds, and it must never be cited as though
    it did.
  - A lint mismatch is a documentation defect, not a mathematical finding, and it carries no weight
    for or against any structural claim.
  - Coverage is five passages from one source; every other result in the alternant and Goppa line
    returns undetermined and that is the correct output, not a gap to be filled by inference.
  - A clean lint result would mean the corpus is internally consistent, which is much weaker than
    the corpus being right.
  target_complexity:
    time_exponent: No attack exponent is claimed; this proposal produces no algorithm against any
      problem. Predicate evaluation is linear in the number of tuples.
    memory_exponent: No attack memory exponent is claimed. Memory is a few kilobytes of clause tuples.
    best_known: 'The incumbent is prose: RQ-MCE-3f7c02 and RQ-MCE-f8fca0 read by a human, in the right
      order, in full, every time a deliverable makes an applicability statement. That incumbent has
      already failed once in exactly the recorded way, which is why RQ-MCE-f8fca0 exists.'
    hidden_overhead: 'Entirely human. Normalising five prose passages into modal conjuncts is judgement
      work, and the truth table is only as good as that judgement; the double-blind normalisation
      control charges some of that cost back but does not remove it. There is also a maintenance overhead:
      the predicate must be superseded, never edited, whenever a sixth passage is committed.'
  dominated_by: 'n/a (no result claimed). The Pareto check is performed in the only sense that applies:
    this proposal emits no time, memory or data figure for any adversary against any problem, so there
    is no frontier row it can occupy. It is dominated as documentation practice by a competent human
    reader who never omits, which is the incumbent that already failed.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively the delta is: zero
    machine-checkable applicability predicates over external results in this repository before, one
    after, plus a measured count and direction of mismatches on already-committed deliverable text
    and a measured scramble sensitivity for the modal fields.'
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'P(the clause file passes the exact-substring provenance check on all
    five passages) = 0.9; the records quote verbatim and this is mostly mechanical. P(the predicate
    takes at least three distinct values over committed tuples) = 0.7; the risk is that every committed
    tuple is a binary Goppa tuple, in which case the family conjunct dominates and the third value
    never surfaces, which would itself be informative. P(at least one lint mismatch is found in committed
    deliverable text) = 0.55; RQ-MCE-f8fca0 asserts the defect propagates by design into future deliverables,
    but the corrected records are recent and the corpus of applicability sentences may be small. P(the
    modality scramble moves at least 10 percent of the time) = 0.6, and this is the part most likely
    to refute the design. P(the two blind normalisations agree on all five passages) = 0.5, which
    is low on purpose: normalisation is the weakest joint.'
