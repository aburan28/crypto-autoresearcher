  assumptions:
    - >-
      Good reduction, p >= 3, gcd(n, p) = 1, E_1(Q_p) torsion-free and uniquely
      n-divisible; these are the hypotheses under which the splitting holds and
      (D1) is their failure.
    - >-
      "Polylog description" means an object of polylog(p) bits produced by a
      polylog(p)-time algorithm from (E^, S^, T) and public data; a description
      using target-dependent data at another place is outside (C) and is open
      class (ii).
    - >-
      The canonical height comparison |h^ - h_x/2| = O(log|Delta|) (recalled) is
      used only for the size law and is measured in EXP-ECDLP-a26bde rather than
      assumed.
  proof_search_map:
    bottleneck: >-
      The digit identity psi(E_1(m S^)) = m psi(X_S) together with the decodability
      dichotomy. If some non-decodable polylog description admitted a polylog
      functional not factoring through T, the dichotomy would be false; if the
      identity failed, faces F1 and F4b would decouple and a consistent local lift
      could exist without the global height price.
    baseline_embedding:
      parameter_slice: >-
        Rank-one toy global points (EXP-ECDLP-a26bde): the digit of m S^ must equal
        m times the digit of S^ exactly for every m with n not dividing m, and the
        bit-size of x(m S^) must scale as m^2.
      reproduction_check: >-
        Exact integer equality of the digits and a fitted size slope of 2.00 within
        0.05; the anomalous toy curve must make the torsion-section step refuse
        (division by n = p in E_1), which is the argument breaking at the named
        hypothesis and nowhere else.
    observation_collision:
      observable: T^ modulo p^(v+1) (decodable) versus T (non-decodable)
      distinct_preimage_search: >-
        The decodable observable is injective in m; the non-decodable observable
        collides completely across m + jn. A description that is claimed succinct
        must say which observable it determines, and the record's content is that
        there is no third kind for descriptions built from (E^, S^, T).
    constructive_transforms:
      - transform: boundary_lift
        proposed_object: >-
          From the global size barrier h^ = m^2 h^(S^) to the local digit d = m u
          mod p; the barrier is relocated from "too big to write" to "one digit
          nobody can compute", which is the honest location.
        predicted_gain: none on the exponent; a unified map of three faces
      - transform: representation_reduction
        proposed_object: >-
          Descriptions of T^ reduced to their decodability; decodable ones are m,
          the rest are T.
        predicted_gain: a zero-compute audit closing the succinct-description route for the stated class
    quantifier_order: >-
      FOR ALL E/F_p with gcd(n, p) = 1, FOR ALL global S^ reducing to S, FOR ALL m:
      the identity holds. FOR ALL polylog descriptions D of T^ built from
      (E^, S^, T): decodable or a function of T. The alternative is existential:
      THERE EXISTS a non-decodable D and a polylog functional of D that is not a
      polylog function of T, which is a contradiction in terms for that class and
      so the only escapes are the class boundary (ii) and the cheap-function
      correlation measured elsewhere.
    method_ceiling:
      strongest_certifiable_claim: >-
        A derivation-level closure of succinct descriptions built from
        (E^, S^, T), verified numerically at toy scale on the identity and the size
        law. It certifies nothing about second-prime constructions, nothing about
        the correlation of cheap functions of T with characters (a measurement),
        and nothing at cryptographic scale beyond the derivation's own generality.
      nearby_object_control: >-
        (D1) an anomalous toy curve, where the torsion section does not exist and
        the digit of ANY lift is linear in the scalar; (D2) a small-embedding-degree
        subgroup, where a cheap function of T is a full character.
    proof_obligations:
      - claim: uniqueness of the homomorphic section (linear gate)
        responsibility: correctness
      - claim: the digit identity d(m S^) = m d(S^) mod p
        responsibility: correctness
      - claim: the size law bit-size ~ m^2 h^(S^), with the recalled height comparison measured
        responsibility: size
      - claim: decodable implies m in polylog time (digit extraction cost)
        responsibility: runtime
      - claim: the argument breaks on (D1) at the section step and on (D2) at the class boundary
        responsibility: baseline
      - claim: descriptions using target-dependent data at another place are outside scope
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: digit_identity_exact_agreement_rate
      direction: different
      minimum_effect: >-
        1.0 on every toy global lift for every m with n not dividing m; a single
        disagreement falsifies the identity as stated.
    - metric: size_law_slope
      direction: different
      minimum_effect: 2.00 within 0.05 on the fitted log bit-size against log m for m >= 16.
    - metric: teichmuller_section_digit_linearity_rate
      direction: lower
      minimum_effect: >-
        At the chance level 1/p: the canonical non-homomorphic section must NOT
        satisfy the identity, or it would be a homomorphic section and contradict
        uniqueness.
    - metric: anomalous_break_step
      direction: different
      minimum_effect: the torsion-section construction refuses at division by n = p; any other failure mode is an implementation defect.
  minimal_test:
    design: >-
      Zero compute for the dichotomy; EXP-ECDLP-a26bde for the identity, the
      size law, the explicit-lift leak demonstration, the non-homomorphic contrast
      and the anomalous break step.
    controls:
      - the Teichmuller section as the non-homomorphic contrast (identity must fail)
      - the anomalous toy curve as the proves-too-much object (argument must break at the section step)
      - exact certificate [m]S = T for every recovered scalar in the leak arm
    required_metrics:
      - digit agreement rate, size slope, contrast failure rate, break step
  falsification_conditions:
    - >-
      The digit identity fails on any toy global lift after the instrument passes
      its consistency checks. The splitting argument is wrong somewhere and the
      unification (B3) is withdrawn.
    - >-
      The Teichmuller section satisfies the identity at a rate far above 1/p. Then
      a second homomorphic section exists, contradicting uniqueness, and the linear
      gate must be re-derived.
    - >-
      A polylog description built from (E^, S^, T) is exhibited that is not
      decodable yet yields a functional of T^ not computable from T in polylog time.
      The dichotomy is false for that description and (C) is superseded.
  confounders:
    - >-
      v_p(psi(X_S)) > 1 for a particular global point (the point is p-adically
      close to torsion); the digit is then read at p^v and the leak needs
      precision v + 1, which is recorded per instance.
    - >-
      Precision: an identity checked at precision k is a statement mod p^k; the
      contract checks k = 2 and 3 and requires agreement under truncation.
  interpretation_limits:
    - >-
      A proof map with a toy verification is not a theorem about cryptographic
      curves; the derivation is general but its recalled ingredients must be read.
    - >-
      Closing succinct descriptions of the stated class leaves open the two named
      classes; no lane is declared dead.
    - No attack, no exponent moved.
