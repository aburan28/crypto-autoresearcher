idea:
  id: IDEA-20260905-848b77
  added: '2026-09-05'
  recorded_at: '2026-09-05'
  title: >-
    THE HARD LIFT, LOCALISED: for gcd(n, p) = 1 the p-adic points split as
    torsion section plus formal group, so the global hard lift T^ = m S^ is the
    torsion lift of T plus a formal-group point whose logarithm is m times a
    computable unit -- any explicit global lift leaks m through ONE p-adic digit,
    the p^2-bit barrier is the price of writing that digit globally, the p-adic
    reduction of T^ to precision k is already a succinct manipulable description
    whose only unknown is that digit string, and Silverman's closing question
    reduces to a decodability dichotomy: every polylog description of T^ built from
    (E^, S^, T) is polynomially equivalent either to m or to T
  class: mechanism
  question_id: RQ-ECDLP-c1b7b1
  question_ids: [RQ-ECDLP-c1b7b1, RQ-ECDLP-4fcbd3, RQ-CANL-63098f, RQ-ECDLP-002]
  goal_ids: [GOAL-ECDLP-001, GOAL-CRYPTO-001]
  goal_applicability:
    GOAL-ECDLP-001: >-
      Supplies the proof-architecture map (KN-TECH-080) for the one lifting face
      with no algorithm attached, unifies faces F1, F2 and F4b through one identity,
      and states the two objects on which the closure is known false. Zero compute
      apart from the toy verification contract EXP-ECDLP-a26bde.
    GOAL-CRYPTO-001: >-
      Converts "a succinct description of T^ manipulable without coordinates" into
      a decidable statement about what such a description can and cannot be, so no
      later record can claim progress on hard lifting by exhibiting a compressed
      representation that is m in disguise.
  status: proposed
  proposed_by: claude-code-session
  claim: >-
    (A) THE SETTING AND THE SPLITTING. E/F_p with good reduction, p >= 3, E^/Q_p any
    lift (the naive one with the same coefficients suffices), S of order n with
    gcd(n, p) = 1, T = m S. The reduction sequence 0 -> E_1(Q_p) -> E^(Q_p) ->
    E(F_p) -> 0 splits on the prime-to-p part: the torsion lift t: E(F_p)[n] ->
    E^(Q_p)[n] is a homomorphic section, and it is the ONLY homomorphic section,
    because two sections differ by a homomorphism from a group of order n into the
    pro-p torsion-free group E_1, which is zero (the linear gate of ECFG-P1543-R1
    and IDEA-20260807-dbb250). So every point of E^(Q_p) reducing into <S> is
    uniquely t(R) + X with X in E_1, and psi: E_1 -> pZ_p (formal logarithm) is an
    isomorphism onto its image.
    (B) THE IDENTITY. Let S^ be a global point of E^(Q) reducing to S, and write
    S^ = t(S) + X_S with X_S = [n]^(-1)[n]S^ in E_1, computable to any precision.
    Then the hard lift satisfies m S^ = t(m S) + m X_S = t(T) + m X_S, hence
        psi(E_1-component of m S^) = m psi(X_S).
    The unknown scalar enters the local picture LINEARLY, in one p-adic number.
    Writing v = v_p(psi(X_S)) >= 1, the digit d(P) := (psi(E_1-component of P) /
    p^v) mod p is a function on lifts of points of <S>, and d(m S^) = m d(S^) mod p
    with d(S^) a unit. Three consequences.
    (B1) ANY EXPLICIT GLOBAL LIFT OF T LEAKS m. In rank one, the global lifts of T
    are (m + j n) S^ (plus torsion); an explicit one reveals m + j n mod p from its
    digit and |m + j n| from its height, hence m. In rank r an explicit lift yields
    the multigenerator preimage of P1543-R1's Mordell-Weil coordinate gate, i.e. an
    r-term relation priced by IDEA-20260807-6533fd. Nothing is gained: producing
    the explicit lift is the problem, and this is the sharp form of "no algorithm
    is known to find T^ even when it is known to exist".
    (B2) THE SIZE BARRIER IS GLOBAL, NOT LOCAL. h^(m S^) = m^2 h^(S^) makes the
    global coordinates Theta(m^2 h^(S^)) bits; the p-adic reduction of the same
    point to precision k is k log p bits and every group operation on it is
    polylog. The p^2 bits are the cost of the archimedean and all-ell content of a
    canonical coordinate system, not information: the object has log n bits of
    information (m) and Silverman's question turns on exactly that distinction.
    (B3) UNIFICATION OF THE FACES. Face F1 (local nontorsion): the "consistent
    choice" of lift of T at each precision step is the reduction of the global
    hard lift, and its digit is d(T^) = m d(S^); F2 (local torsion): the torsion
    lift is the E_1-free part and carries nothing, which is KN-TECH-73630e; F4b
    (hard lift): the height is the price of writing the consistent choice
    globally. One identity, three walls.
    (C) THE DECODABILITY DICHOTOMY, WHICH IS SILVERMAN'S QUESTION FORMALISED. Call a
    description D of T^ DECODABLE if T^ mod p^(v+1) is computable from D in
    polylog(p) time. Decodable implies m computable, by the digit. Any description
    constructible in polylog time from (E^, S^, T) that is NOT decodable is a
    function of T and public data; every polylog functional evaluated on it is a
    polylog function of T. So for such descriptions the question "can a
    non-homomorphic functional of T^ (height, real elliptic logarithm, denominator
    support, sign of a coordinate) be computed" IS the question "does a cheap
    function of T correlate with that functional of m", and since T <-> m is a
    bijection there is no information barrier at all, only the computational one
    measured by the DL-spectrum census of RQ-ECDLP-4fcbd3. The hard-lift
    functionals sit in a specific place there: d(T^) = m u mod p is a ramp in m,
    whose spectrum concentrates on the arithmetic progression of frequencies that
    are multiples of the ramp's slope, and h^(T^) = m^2 h^ is a quadratic ramp;
    both are detected by the half-energy-fraction statistic already in
    EXP-ECDLP-184fc4. Straight-line programs are the same dichotomy: the length
    O(log m) program for m S^ IS m (its addition chain), and a program not derived
    from m must be found by search over programs whose outputs are the multiples
    j S^ with |j| <= 2^L, which is a search over j.
    (D) THE TWO KNOWN-FALSE OBJECTS, AND THE HYPOTHESIS EACH BREAKS. (D1) n = p:
    the sequence does not split (E_1 has no section for the p-part), the torsion
    section does not exist, and psi([p] P') mod p^2 is well defined for ANY lift
    P' and linear in the scalar: Smart / Satoh-Araki / Semaev. The argument breaks
    at "t exists and is unique", exactly where dbb250's gate breaks. (D2) small
    embedding degree: the Tate pairing with a fixed point is a cheap function of T
    that is a full character of <S>, so the census correlation is maximal; the
    dichotomy still holds (the pairing is a decodable-free function of T) and it
    is the Weil-level expectation for cheap functions of T that fails, because the
    pairing is a fast high-degree function outside the bounded-degree class of
    IDEA-20260905-b6154d. Both objects are on the known-false side and both are
    named so the closure can be run against them.
    (E) WHAT REMAINS OPEN, NAMED. (i) The canonical non-homomorphic sections and
    their defect digits: whether the Teichmuller section's defect, the torsion
    lift's second digit, or the Fermat-quotient digit correlates with a character
    of <S> is a measurement, IDEA-20260905-3a30d5. (ii) Constructions constrained
    at a second prime (IDEA-20260807-cfe576 class (ii)): not addressed here. (iii)
    Compressed representations (cfe576 class (iii), 6533fd's bottleneck): answered
    by (C) for representations built from (E^, S^, T); a representation built
    from other target-dependent data at another place is (ii).
  mechanism: >-
    WHY ONE IDENTITY SETTLES THE SHAPE OF THE LANE. Every lifting attack must obtain
    information about m from somewhere other than the finite group, and the only
    places available are the completions of the global model. At p, the local
    points are torsion section plus formal group; the torsion part is the finite
    group again (KN-TECH-73630e) and the formal part of the global hard lift is m
    times a computable unit. At the archimedean place the hard lift's real
    elliptic logarithm is m theta mod 1 with theta computable. At another prime ell
    the hard lift reduces to m S_ell. Each of these is a function of m that would
    solve the problem if computable from T, and each is not determined by T
    computationally; the identity in (B) is the exact statement of that at p, and
    it is the one place where the statement is a two-line proof rather than a
    heuristic. THE LOSSY-PROJECTION TEST. The tracked object is the pair (torsion
    part, formal-group digit) of a lift; it discards all higher p-adic digits and
    the global coordinates, and it propagates deterministically under the group
    law: the torsion part adds, the digit adds. It is lossy (a lift has infinitely
    many digits) and compatible. It is a change of coordinates only for lifts that
    are known explicitly, which is precisely the decodable case.
