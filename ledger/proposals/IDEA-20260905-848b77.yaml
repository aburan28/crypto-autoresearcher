      the hard lift or Silverman's closing question by name. The splitting and the
      digit identity are standard local arithmetic and are claimed only as the
      lane's proof map, never as new mathematics.
    nearest_internal_record: IDEA-20260807-cfe576
    precise_difference: >-
      cfe576 closes canonical point-lifting routes by a target-independence
      counting argument and leaves compressed representations open as class
      (iii). This record answers class (iii) for representations built from
      (E^, S^, T) by the decodability dichotomy, localises the hard lift through
      the digit identity, and unifies faces F1, F2 and F4b; it does not touch the
      counting argument and does not address cfe576's class (ii).
    second_nearest: ECFG-P1543-R0/R1 (ledger/FINDING-PF-IC-001.md lines 2016-2110)
    second_difference: >-
      P1543 records the torsion-or-defect dichotomy and the pro-p homomorphism
