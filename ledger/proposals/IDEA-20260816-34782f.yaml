idea:
  id: IDEA-20260816-34782f
  question_id: RQ-ALECF-001
  added: '2026-08-16'
  title: The ALECF benchmark collapses a two-axis resource vector onto the scalar product Toffoli
    times peak qubits; treat that product as one scalarization among many, and measure over a population
    of reversible arithmetic circuits what fraction of circuit pairs reverse their ranking when the
    scalarization is changed.
  class: representation
  claim: '(A) The ALECF score is a scalarization, not a measurement. The committed artifacts show
    it exactly: EXP-ALECF-001 and EXP-ALECF-002 carry a byte-identical score.json (score 1516125312,
    toffoli 1316081, qubits 1152) and EXP-ALECF-003 carries score 1624467943 with toffoli 1423723
    and qubits 1141. Recomputing, 1316081 times 1152 equals 1516125312 and 1423723 times 1141 equals
    1624467943, so the scoring functional is confirmed to be the plain product. But the two resource
    vectors are Pareto-incomparable: relative to 001/002, the 003 circuit spends 8.18 percent more
    Toffoli gates and 0.95 percent fewer peak qubits. Neither dominates. The product picks 001/002;
    a peak-width-only objective picks 003. (B) The claim is that this incomparability is not an accident
    of three data points but a measurable property of the space of reversible arithmetic circuits,
    quantifiable as a rank-inversion rate: given a population of circuits and a set of admissible
    scalarizations (T alone, Q alone, T times Q, T times Q squared, T times depth, space-time volume),
    the fraction of unordered circuit pairs whose ordering flips between two scalarizations is a number,
    it can be estimated at toy scale, and it is the honest replacement for a leaderboard position.
    (C) The claim is further that the correct deliverable for a circuit-scoring question is the Pareto
    frontier plus the inversion rate, and that a single score should be reported only with the frontier
    it was extracted from. (D) WHAT IS NOT CLAIMED: nothing here says any circuit is good or bad,
    that the ALECF score is wrong, that some other scalarization is correct, or that any quantum attack
    is more or less feasible. No claim is made about the circuits behind the three committed score
    files, whose source code is not in this repository. A rank-inversion rate is a statement about
    a scoring functional over a population, not about cryptographic security, and it does not transfer
    to any parameter set or curve outside the population measured.'
  mechanism: 'STAGE 1: fix the scoring functionals. Write each as a pure function of a resource vector
    (toffoli, peak_qubits, depth, clifford, ancilla_lifetime_integral), with the ALECF functional
    defined exactly as observed, including its rounding behaviour: the committed final log row for
    EXP-ALECF-001 records toffoli 1316080.523, and score.json records 1316081, so the average is rounded
    to an integer before multiplication, which is a documented step of the functional and not a typo.
    STAGE 2: generate the population. Build reversible modular-arithmetic circuits over small prime
    fields in a Python interpreter, varying only scheduling and ancilla-reuse policy, so that every
    circuit computes the same function and differs only in where it sits in resource space. This makes
    the population an honest model of a leaderboard: many valid solutions to one specification. STAGE
    3: compute the exact Pareto frontier of the population under the partial order on (toffoli, peak_qubits,
    depth), and record frontier membership per circuit. STAGE 4: for every pair of scalarizations,
    compute the rank-inversion rate over all unordered circuit pairs, and separately over pairs that
    are Pareto-incomparable, because inversions among comparable pairs would indicate a broken scalarization
    rather than a genuine tradeoff. STAGE 5: run the identical pipeline on the null population (Section
    3 control) and compare inversion rates. STAGE 6: report the frontier, the inversion matrix, and
    the difference from null, with no recommendation about which scalarization to adopt.'
  novelty_status: unverified
  novelty_screen:
    method: 'Read ledger/questions/RQ-ALECF-001.yaml in full and confirmed it carries zero proposals
      via ''grep -rl RQ-ALECF-001 ledger/proposals/'' (result: 0 files). Ran ''grep -rl RQ-QRE-6dba8c
      ledger/proposals/'' (10 files) and read the title and class lines of all ten. Ran ''grep -rliE
      "toffoli|magic.state|surface.code|uncomputation|reversible|t.count|qubit" ledger/proposals/''
      (143 files) and inspected titles. Read experiments/EXP-ALECF-001/source/{README.md,score.json,results.tsv}
      and the same files under EXP-ALECF-002 and EXP-ALECF-003, plus ledger/evidence/EV-ALECF-001.yaml
      and experiments/EXP-ALECF-001/specification.yaml. Read docs/inventor-protocol.md sections 1
      through 5.'
    results: The closest existing record is IDEA-20260809-61bedf, 'Report space-time volume, not N
      qubits for T hours', which argues that a published quantum estimate quoted as a qubit-count/runtime
      pair hides a tradeoff dial. That proposal is about the reporting format of published headline
      estimates under RQ-QRE-6dba8c. This proposal is about the scoring functional of the ALECF point-addition
      benchmark and about measuring an inversion rate over a circuit population, which no record found
      does. IDEA-20260809-623d8d (windowed arithmetic tradeoff curve) traces a tradeoff generated
      by one algorithmic knob, window size, rather than measuring scalarization-induced rank inversion.
      No proposal under any question referenced EXP-ALECF-001, EXP-ALECF-002 or EXP-ALECF-003; grep
      for those ids across ledger/proposals/ returned nothing.
    verdict: 'UNVERIFIED. This program cannot read external literature, so nothing is asserted about
      what has or has not been published on multi-objective circuit benchmarking, which is a mature
      topic elsewhere for all this screen can tell. What is claimed new here is only the specific
      move of treating this repository''s own imported ALECF score as a scalarization and measuring
      its rank-inversion rate against a synthetic circuit population with a null arm. Assembled from
      known parts: Pareto dominance, scalarization, rank-correlation statistics, and the inventor-protocol
      Section 5 dominated_by discipline are all standard and are used as-is.'
  object_first_candidate:
    tracked_object: 'The resource vector of a reversible circuit: the tuple (toffoli, peak_qubits,
      depth, clifford, ancilla_lifetime_integral) attached to a circuit that computes a fixed arithmetic
      function. The object followed through the computation is not the circuit''s state but its cost
      coordinates, followed through the scheduling transformations that move a circuit within the
      space of valid implementations of one specification.'
    lossiness: 'The projection from a circuit to its resource vector is heavily lossy: gate order,
      qubit identity, the arithmetic algorithm, and the entire semantic content are discarded, and
      only five integers survive. The discard is compatible with the operation of interest because
      the operation here is scalarization and ranking, which by construction consumes only the resource
      vector. The second projection, from the resource vector to the ALECF scalar, is also lossy and
      that is the point: the preimage of a fixed score is a discrete hyperbola in the (T, Q) plane,
      so the scalar cannot distinguish circuits lying along it. The propagation that survives is the
      partial order: Pareto dominance is defined on the vector and is preserved under any monotone
      scalarization, which is exactly why inversions can only occur among incomparable pairs. That
      is the deterministic residue.'
    propagation: 'One step of the target operation is a scheduling transformation applied to a valid
      circuit: re-time an uncomputation, reuse an ancilla, unroll or re-roll a subroutine. Such a
      step acts on the resource vector by moving it along a locally monotone curve, typically trading
      peak_qubits against toffoli and depth. Under the partial order, a step either moves the vector
      to a dominating point (a strict improvement, no scalarization disagrees), a dominated point
      (a strict regression), or an incomparable point. Only the third kind of step can produce a rank
      inversion, so the propagation rule directly predicts where inversions live and gives the experiment
      its stratification.'
    survival_score: 'The partial order survives all the way: it is preserved by every monotone scalarization
      by definition, so it never dissolves. What dissolves is the total order. Concretely, the structure
      survives exactly one comparison: given two circuits, dominance answers the question when it
      applies, and it stops applying as soon as the two vectors are incomparable, which for the three
      committed ALECF vectors is already the case at n equals 3, since 003 at (1423723, 1141) and
      001/002 at (1316081, 1152) are mutually non-dominating. The measurable survival quantity is
      the fraction of pairs on which the partial order still decides; that fraction is the deliverable
      and it is expected to fall as the population grows.'
  null_object_control: 'The null object is a population of resource vectors drawn independently from
    the same marginal distributions as the measured population, with the joint dependence destroyed:
    sample toffoli values from the empirical toffoli marginal and peak_qubits from the empirical peak_qubits
    marginal, independently, producing the same number of vectors of the same shape and the same per-axis
    spread but no scheduling-induced coupling. The identical scalarization and inversion-rate code
    runs on the null. For the signal arm to mean anything the null must show a DIFFERENT inversion
    rate: if independently sampled vectors invert at the same rate, then the inversion rate measures
    only the marginal spread of the axes and says nothing about the tradeoff structure that scheduling
    induces, and the honest record is a controlled null. Both arms are executed in the same invocation
    of the same script from the same seed file.'
  discriminated_from:
  - 'IDEA-20260809-61bedf (space-time volume as a reporting format for published resource estimates):
    that record argues a presentation change for headline totals under RQ-QRE-6dba8c; this one measures
    a rank-inversion rate over a circuit population and produces a frontier, and it targets the ALECF
    benchmark''s own scoring functional rather than any published estimate.'
  - 'IDEA-20260809-623d8d (windowed arithmetic tradeoff curve): traces a curve generated by varying
    one algorithmic parameter; this proposal holds the algorithm fixed and varies only scheduling,
    so the population is a leaderboard model rather than a parameter sweep.'
  - 'IDEA-20260815-f4c398 (reproduce the 256-bit ECDLP quantum resource estimate and find the dominant
    assumption): reproduces a headline number and ranks assumptions by sensitivity; this proposal
    does not reproduce any estimate and ranks nothing by sensitivity.'
  - 'Plain multi-objective optimization as a technique: standard Pareto analysis would report the
    frontier and stop; the specific added content is the inversion rate stratified by comparability
    plus a marginal-matched null, which converts a frontier picture into a falsifiable measurement.'
  assumptions:
  - A population of valid reversible circuits computing one fixed arithmetic function, differing only
    in scheduling, is a usable model of the space a benchmark leaderboard samples.
  - Toy-scale modular arithmetic over small primes produces resource-vector tradeoffs of the same
    qualitative shape as 256-bit circuits; this is an assumption and no numeric transfer is claimed.
  - The ALECF scoring functional is exactly round(mean_toffoli) times peak_qubits, as verified against
    both committed score.json files.
  - Depth can be defined unambiguously for the circuits generated here as the longest path in the
    gate dependency DAG under a stated gate-set granularity.
  predictions:
  - metric: fraction of unordered circuit pairs that are Pareto-incomparable under (toffoli, peak_qubits,
      depth)
    direction: higher
    minimum_effect: 0.25
  - metric: rank-inversion rate between the ALECF product scalarization and a peak-qubits-only scalarization,
      restricted to incomparable pairs
    direction: higher
    minimum_effect: 0.1
  - metric: difference in inversion rate between the measured population and the marginal-matched
      null population
    direction: different
    minimum_effect: No pre-commitment to a magnitude. The direction of the difference depends on whether
      scheduling induces positive or negative coupling between the axes, which is exactly the unknown
      the run measures; pre-committing a sign would be guessing.
  - metric: number of distinct Pareto-frontier members in a population of 200 scheduling variants
    direction: higher
    minimum_effect: 5
  minimal_test:
    design: 'The cheapest discriminating measurement needs no quantum anything and no large circuits.
      Generate 200 valid reversible modular-adder-and-multiplier compositions over F_p for p a 13-bit
      prime, all computing the identical function, differing only in ancilla-reuse policy and uncomputation
      placement. Verify every one by exhaustive or large-sample classical simulation, including ancilla
      restoration, so that the population contains only valid members. Record the resource vector
      for each. Then compute, in one script: the exact Pareto frontier, the incomparability fraction,
      and the pairwise inversion matrix across six scalarizations, and immediately afterwards the
      same three quantities on the marginal-matched null population generated from the measured marginals
      with a fixed seed. The discriminating comparison is a single number per scalarization pair:
      measured inversion rate minus null inversion rate. If that difference is indistinguishable from
      zero across all pairs, the tradeoff structure is not detectable at this scale and the record
      is a controlled null. Total compute is minutes on one core.'
    controls:
    - Marginal-matched null population, executed in the same script invocation as the signal arm.
    - 'Validity gate: every circuit in the population is classically simulated and must restore all
      ancillas to zero, so invalid circuits cannot enter the frontier.'
    - 'Identical-function gate: all population members are checked to compute the same function on
      the same test vectors, so resource differences cannot come from computing something else.'
    - 'Seed manifest: the population generator and the null generator both read seeds from a committed
      file, so the two arms are reproducible independently.'
    - A degenerate scalarization control (toffoli alone) whose inversion rate against itself must
      be exactly zero, as an instrument check on the inversion-rate code.
    required_metrics:
    - toffoli count per circuit
    - peak live-qubit count per circuit
    - circuit depth under the declared gate-set granularity
    - Pareto-frontier membership indicator
    - fraction of unordered pairs that are incomparable
    - pairwise rank-inversion rate per scalarization pair
    - null-arm inversion rate per scalarization pair
    - ancilla-restoration pass indicator per circuit
  falsification_conditions:
  - The incomparability fraction is below 0.05, meaning the partial order almost always decides and
    a single scalar loses almost nothing at this scale.
  - Inversion rates on the measured population match the null population within the reported confidence
    interval for every scalarization pair.
  - The degenerate self-comparison control returns a nonzero inversion rate, which falsifies the instrument
    rather than the hypothesis and stops the run.
  - Scheduling variation fails to produce measurable spread in peak_qubits (coefficient of variation
    below 0.01), so the population is not a model of a leaderboard.
  - Depth turns out to be a deterministic function of (toffoli, peak_qubits) in this population, in
    which case the third axis is not independent and the frontier is two-dimensional after all.
  confounders:
  - 'Population construction bias: if the scheduling policies are drawn from a family that systematically
    trades one axis for another, the inversion rate reflects the generator, not circuit space. Mitigated
    only partially by using several unrelated policy families and reporting per-family rates.'
  - 'Gate-set granularity: depth and even Toffoli count depend on whether a Toffoli is atomic or decomposed,
    so the same circuit has several resource vectors. Every number must be tagged with its granularity.'
  - 'Small-prime artifacts: at 13 bits, register widths are small enough that peak_qubits is dominated
    by fixed overhead rather than by scheduling.'
  - The rounding step in the ALECF functional can itself create ties or break them at the margin;
    with integer counts in the toy population this confounder is absent, which means the toy population
    does not exercise it.
  interpretation_limits:
  - An inversion rate measured on 13-bit toy circuits is a statement about that population only, and
    nothing about 256-bit secp256k1 circuits follows numerically.
  - The result says nothing about whether any specific circuit is efficient, and cannot be cited as
    a critique of the circuits behind the three committed ALECF score files, whose source is not in
    this repository.
  - A high inversion rate is an argument for reporting frontiers, not an argument that any published
    or imported score is incorrect.
  target_complexity:
    time_exponent: No attack exponent is claimed. This proposal produces no algorithm for any hard
      problem and makes no statement about the running time of any attack.
    memory_exponent: No attack memory exponent is claimed. The memory measured is the peak ancilla
      width of toy reversible arithmetic circuits, which is a property of the circuits generated here
      and not of any attack.
    best_known: The incumbent is the ALECF benchmark's own single-scalar ranking as instantiated in
      the committed score.json files (EXP-ALECF-001/002 at 1516125312 and EXP-ALECF-003 at 1624467943).
      That ranking is what a frontier-plus-inversion-rate report would replace as a reporting convention,
      not beat as a result.
    hidden_overhead: 'The human cost is in the validity gate: generating 200 scheduling variants is
      easy, but proving each computes the same function and restores every ancilla is where the engineering
      time goes, and a weak gate silently admits broken circuits that then populate the frontier.
      Lower-order terms hide in the gate-set granularity choice, which multiplies both depth and Toffoli
      count by convention-dependent constants that never appear in the headline inversion rate.'
  dominated_by: n/a (no result claimed). I checked the only cost frontier this repository actually
    commits for this bucket, which is the two-point set {(toffoli 1316081, qubits 1152), (toffoli
    1423723, qubits 1141)} from the three ALECF score.json files, and this proposal contributes no
    circuit and therefore no row to it. There is no time/memory/data frontier for an attack because
    no attack is proposed.
  sota_delta: no attack; conceptual/measurement contribution only. The only quantitative comparison
    offered is between scalarizations of the same fixed resource vectors, where the two committed
    ALECF points differ by +8.18 percent in Toffoli count and -0.95 percent in peak qubits, a pair
    that the product functional resolves in favour of the lower-Toffoli circuit by 6.67 percent of
    score.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'Part (A), that the ALECF score is exactly round(mean_toffoli) times peak_qubits
    and that the two committed vectors are Pareto-incomparable: 0.97, because both are arithmetic
    facts already recomputed from committed files, with the residual uncertainty being that I have
    misread which artifact is authoritative. Part (B), that a scheduling-only population shows an
    incomparability fraction above 0.25 at toy scale: 0.5, because toy register widths may make peak_qubits
    nearly constant and collapse the frontier. Part (C), that the inversion rate differs measurably
    from the marginal-matched null: 0.4, since the null is deliberately strong and marginal spread
    alone can generate most inversions. Part (D), that the resulting report changes how any downstream
    record cites a circuit score: 0.25, since reporting conventions are sticky and this program has
    no authority over the imported benchmark.'
