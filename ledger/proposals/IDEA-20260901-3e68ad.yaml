idea:
  id: IDEA-20260901-3e68ad
  question_id: RQ-ECDLP-165d4b
  goal_id: null
  goal_id_note: >-
    RQ-ECDLP-165d4b has no bound GOAL record at filing time (context file for
    TASK-20260901-da5e05). Left null deliberately.
  added: '2026-09-01'
  title: >-
    THE CENSUS'S "AUTOMORPHISM QUOTIENT" COLUMN CANNOT BE ENLARGED BY ANY
    SYMMETRY OF THE CURVE THAT MOVES THE ORIGIN: on a prime-order curve every
    finite F_p-rational group of curve automorphisms that does not contain
    the whole point group is a translation-conjugate of a subgroup of
    Aut(E, O), because H^1(H, E(F_p)) = 0 when gcd(|H|, N) = 1 -- so the
    shifted involution R -> T - R, and every other origin-moving symmetry, is
    the negation or Aut quotient in shifted coordinates and buys exactly the
    known sqrt(|Aut|/2); the closure is exact, costs one page and one
    enumeration at N ~ 10^3, and its nearby failures (composite order with
    rational 2-torsion; N dividing |Aut|) are where a genuinely new quotient
    object lives
  class: mechanism

  claim: >-
    (A) SETTING. E/F_p ordinary, E(F_p) = G cyclic of prime order N > 3 (the
    RQ's primary cells). The F_p-rational automorphisms of E AS A CURVE
    (not necessarily fixing O) form the group Aut_var(E) = G semidirect
    Aut(E, O), every element being tau_T o sigma with tau_T translation by
    T in G and sigma in Aut(E, O), |Aut(E, O)| in {2, 4, 6}. A quotient walk
    "modulo a symmetry group H" -- the mechanism behind the negation and
    automorphism quotients of KN-TECH-018 and of H-ECDLP-{1853dc,...,e42bda}
    -- requires H to be a finite subgroup of Aut_var(E), acting on walk
    states.

    (B) THE THEOREM (elementary, derivation tier). Let H be a finite subgroup
    of Aut_var(E). Then EITHER G is contained in H, OR H is conjugate by a
    translation to a subgroup of Aut(E, O): there exists T_0 in G with
    H = tau_{-T_0} Hbar tau_{T_0} for Hbar = the image of H in Aut(E, O).
    PROOF. H meets the normal subgroup G in a subgroup of G; N prime forces
    H cap G in {1, G}. If H cap G = 1 then H maps isomorphically onto Hbar
    and H = { tau_{c(sigma)} o sigma : sigma in Hbar } for a 1-cocycle
    c: Hbar -> G (the cocycle identity c(sigma tau) = c(sigma) +
    sigma(c(tau)) is the group law of the semidirect product). Since |Hbar|
    divides |Aut(E, O)| in {2, 4, 6} and N > 3 is prime, gcd(|Hbar|, N) = 1,
    so H^1(Hbar, G) = 0 (multiplication by |Hbar| is invertible on G and
    kills cohomology). Hence c is a coboundary, c(sigma) = sigma(T_0) - T_0
    for some T_0 in G, and a direct check gives
    tau_{sigma(T_0) - T_0} o sigma = tau_{-T_0} o sigma o tau_{T_0}. QED.

    (C) WHAT IT SAYS ABOUT WALKS, EXACTLY. Case G in H: the quotient map is
    constant on G (total loss; the projected state carries no information),
    so no walk lives there. Case H conjugate: in the shifted coordinate
    S = R + T_0 the H-orbit of R is the Hbar-orbit of S, the x-coordinate of
    S is the canonical form for Hbar = {+-1}, and an r-adding step
    R -> R + M_h becomes S -> S + M_h -- the identical walk. So every
    origin-moving quotient walk IS an Aut(E, O)-quotient walk in other
    coordinates: the projection to E/H differs from the projection to E/Hbar
    by a bijection, and the lossy-projection test of docs/inventor-protocol.md
    section 2 records it as a change of coordinates, not a new object.
    Worked instance for |Aut(E, O)| = 2: the involution iota_T: R -> T - R.
    The affine walks f(R) = [c]R + M that commute with iota_T are exactly
    those with M = [(1 - c)/2] T (N odd, so 2 is invertible), and in
    S = R - [1/2]T they read S -> [c]S -- the negation-quotient walk with a
    purely multiplicative step, which is a known and poor mixer. The gain is
    sqrt(2), already inside the 0.886 convention.

    (D) THE CONSEQUENCE FOR THE CENSUS. RQ-ECDLP-165d4b's method list
    contains "negation quotient" and "automorphism quotient". (B) says the
    column indexed by those methods is COMPLETE for symmetry quotients: no
    F_p-rational symmetry of a prime-order curve gives a quotient object
    beyond E/Aut(E, O) up to a shift, so the ceiling sqrt(|Aut|/2) <= sqrt(3)
    recorded in KN-TECH-018 and attained in EV-ENDO-10109d is the ceiling
    of the whole column. Together with IDEA-20260901-863e36 (C5) -- which
    closes quotients by SCALAR actions outside the image of Aut(E, O), since
    those are isogenies of degree > 1 and induce no morphism quotient --
    the two records cover the two ways a "symmetry" can fail to be in
    Aut(E, O): moving O (this record) or not being an automorphism at all
    (863e36).

    (E) THE NEARBY OBJECTS WHERE THE THEOREM FAILS, WHICH ARE ITS CONTENT.
    (i) COMPOSITE ORDER WITH A RATIONAL 2-TORSION POINT T_2: H = <tau_{T_2}>
    is a finite subgroup meeting G non-trivially and not containing it; it is
    NOT conjugate to anything in Aut(E, O), and E/H is the 2-ISOGENOUS curve
    -- a genuinely different object, whose quotient walk is the ell = 2
    transport cell of the isogeny arm, not a symmetry quotient. (ii) N
    DIVIDING |Aut(E, O)|, i.e. N in {2, 3} on j = 1728 / j = 0: then
    H^1(Hbar, G) can be non-zero and non-conjugate complements exist. Both
    are excluded from the census's primary cells and both are cheap to
    exhibit, so they serve as the nearby-object controls: a method that
    reports "all conjugate" on them has not identified the load-bearing
    hypothesis (gcd(|H|, N) = 1).

    (F) WHAT IS NOT CLAIMED. No exponent, no constant beyond the known one,
    no statement about isogeny transport (which is not a symmetry of E), no
    statement about non-morphism canonical forms (863e36's open cell C6).

  mechanism: >-
    THE TRACKED OBJECT is the H-orbit of a walk state for a finite symmetry
    group H of the curve; the claim is that the family of such objects,
    indexed by H, collapses to the family indexed by subgroups of Aut(E, O)
    under a translation. STAGE 0 (zero compute): write (B) with the cocycle
    identity spelled out and the coboundary check done by hand; write (C)'s
    worked involution. STAGE 1 (minutes, THE ENUMERATION): for prime-order
    toy curves with N in {101, 211, 1009, 2003} and |Aut(E, O)| in {2, 4, 6}
    (j = 1728 with p = 1 mod 4, j = 0 with p = 1 mod 3, and generic j),
    enumerate all finite subgroups of G semidirect Aut(E, O) not containing
    G by closing every pair (tau_T o sigma, tau_T' o sigma') under
    composition, classify by translation-conjugacy, and assert that the
    number of conjugacy classes with H cap G = 1 equals the number of
    subgroups of Aut(E, O) (2, 3 and 4 for orders 2, 4 and 6). STAGE 2
    (minutes, THE WALK IDENTITY): at N = 101, enumerate all affine walks
    f(R) = [c]R + M and count those commuting with iota_T; assert the count
    is exactly N - 1 (one M per c in (Z/N)^*) and that each equals
    S -> [c]S in the shifted coordinate. STAGE 3 (minutes, NEARBY OBJECTS):
    repeat STAGE 1 on a composite-order curve with a rational 2-torsion
    point and on a j = 0 curve with N = 3; the conjugacy count must EXCEED
    the subgroup count of Aut(E, O) in both. STAGE 4 (zero compute): emit
    the census column note "symmetry quotients: complete at Aut(E, O) up to
    shift; ceiling sqrt(|Aut|/2)" with forward guidance to the two open
    classes named in (E) and to 863e36's arithmetic selectors.

  novelty_status: unverified

  novelty_screen:
    method: >-
      crypto-kb retrieval UNAVAILABLE (index ':memory:', empty; not called).
      Direct reading 2026-09-01 of IDEA-20260901-863e36 (C1-C6),
      IDEA-20260807-df906f (claim A-C), IDEA-20260807-f00729 (claim A-B),
      H-ENDO-001 (statement), the five H-ECDLP hypotheses, KN-TECH-018,
      KN-FIND-b7e091 header, IDEA-20260829-20b05f. Greps over ledger/,
      knowledge/, analysis/ for 'H\^1|cocycle|coboundary|translation.{0,40}
      conjugat|involution|iota_T|shifted negation|variety automorphism|
      semidirect' returned no ECDLP record on origin-moving curve
      symmetries. No external source opened; the vanishing of H^1 for
      coprime orders and the structure of Aut of a genus-one curve with a
      rational point are textbook and are marked recalled.
    results: >-
      863e36 (C5) closes scalar actions outside Aut(E, O) (isogenies of
      degree gamma^2 induce no quotient morphism); df906f closes
      translation-INVARIANT projections (regular action has no block
      systems); f00729 records that the Aut-orbit projection is not a
      homomorphism. NONE considers symmetries that move O, states the
      semidirect structure, or uses the coprimality/H^1 argument. The
      mathematical content is elementary and almost certainly known in
      general form (automorphism groups of elliptic curves as varieties);
      what is claimed is its application as a census column closure with
      its nearby failures, not the theorem.
    verdict: >-
      UNVERIFIED. The theorem is claimed as a derivation of textbook facts;
      no external literature was opened; the census-closure framing has no
      located precedent in the corpus.

  citations:
    - ref: IDEA-20260901-863e36
      provenance: internal
      claim: >-
        (C1) block-system classification for scalar operation groups; (C5)
        for gamma outside the image of Aut(E, O), multiplication by an
        integer representative is an isogeny of degree gamma_0^2 > 1 and
        induces no algebraic quotient; (C6) arithmetic selectors as the one
        open cell.
      verified_by: TASK-20260901-da5e05 (read in full 2026-09-01)
    - ref: IDEA-20260807-df906f
      provenance: internal
      claim: >-
        On a prime-order group every exactly propagating projection under
        the group law is injective or constant; escape E4 (objects not
        tracked under the group law) left open.
      verified_by: TASK-20260901-da5e05 (claim A-C read 2026-09-01)
    - ref: IDEA-20260807-f00729
      provenance: internal
      claim: >-
        The Aut-orbit projection is lossy and not a homomorphism; it is
        compatible with equality tests (rho's sqrt(|Aut|)) and relation
        transport only.
      verified_by: TASK-20260901-da5e05 (claim A-B read 2026-09-01)
    - ref: KN-TECH-018
      provenance: internal
      claim: >-
        Walking on equivalence classes modulo Aut gives about sqrt(|Aut|);
        a constant factor; larger factors need special CM structure.
      verified_by: TASK-20260901-da5e05 (read in full 2026-09-01)
    - ref: EV-ENDO-10109d
      provenance: internal
      claim: >-
        j = 0 and j = 1728 rho arms sit on the sqrt(|Aut|/2) ceiling
        (ratio-to-ceiling means 1.0043 and 1.0442 over 20 seeds).
      verified_by: TASK-20260901-da5e05 (observations read 2026-09-01)
    - ref: H-ENDO-001
      provenance: internal
      claim: >-
        Every endomorphism acts on a prime-order subgroup as multiplication
        by a scalar (the admissibility filter).
      verified_by: TASK-20260901-da5e05 (statement and mechanism read 2026-09-01)
    - ref: null
      provenance: recalled
      claim: >-
        (i) The automorphism group of an elliptic curve E as a curve is
        E semidirect Aut(E, O) (Silverman, AEC, exercises on automorphisms of
        genus-one curves); (ii) H^1(H, A) = 0 when |H| is invertible on the
        module A; (iii) Teske 2001 on the poor mixing of purely
        multiplicative walks. Load-bearing for (B) and (C); NOT opened this
        session.
      verified_by: null

  assumptions:
    - >-
      E(F_p) = G of prime order N > 3 (so no rational 2-torsion and
      gcd(|Aut(E, O)|, N) = 1). Both are used; both fail on the nearby
      objects in (E), which is why those are the controls.
    - >-
      F_p-rationality of every symmetry in H; symmetries defined only over an
      extension act on E(F_p) only through their rational sub-part and are
      excluded from the census's own scope line ("verified F_p-defined
      automorphism").
    - >-
      Aut(E, O) is {+-1} for j not in {0, 1728}, mu_4 at j = 1728 with p = 1
      mod 4, mu_6 at j = 0 with p = 1 mod 3 (KN-TECH-018; IDEA-20260829-2dc43c
      counts the cells).

  proof_search_map:
    bottleneck: >-
      The step "is there a symmetry quotient of E beyond E/Aut(E, O)". Every
      proposal to enlarge the automorphism column passes through it, and (B)
      answers it with a hypothesis (coprimality) that fails on exactly the
      cells the census already excludes.
    baseline_embedding:
      parameter_slice: >-
        H = Aut(E, O) itself (T_0 = O): the theorem is trivially true and the
        quotient walk is KN-TECH-018's. H = {1, iota_O} = {+-1}: the negation
        quotient, sqrt(2), inside the 0.886 convention.
      reproduction_check: >-
        STAGE 1's enumeration must return exactly the subgroups of Aut(E, O)
        among conjugacy classes, and STAGE 2 must recover the negation walk
        at T = O as the c-parametrised family with M = 0.
    observation_collision:
      observable: the conjugacy-class count of finite subgroups with H cap G = 1
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED: the count "equals the number of
        subgroups of Aut(E, O)" is produced both by the theorem holding AND
        by an enumeration that only ever generates subgroups inside
        Aut(E, O) because it never composes a translation with an
        automorphism. The separating condition is STAGE 3: on the composite
        and N = 3 controls the same code must return MORE classes. BLOCKING.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          The pair (H cap G, the cohomology class of the cocycle c) as the
          complete invariant of a finite symmetry group up to conjugation.
        predicted_gain: >-
          Reduces the open-ended "which symmetries give quotients" to two
          finite checks and closes the symmetry column of the census with a
          hypothesis whose failure cells are named.
    quantifier_order: >-
      CLAIMED: FOR ALL ordinary E/F_p with E(F_p) of prime order N > 3 and
      FOR ALL finite subgroups H of Aut_var(E)(F_p), EITHER G is contained in
      H OR THERE EXISTS T_0 in G with H = tau_{-T_0} Hbar tau_{T_0}. The
      existential is inside the conclusion and T_0 depends on H, which is
      allowed. NOT CLAIMED: anything for composite order, for N in {2, 3},
      for non-rational symmetries, or for correspondences that are not
      automorphisms (isogenies).
    method_ceiling:
      strongest_certifiable_claim: >-
        "Symmetry quotients of a prime-order curve over F_p are exhausted by
        Aut(E, O) up to translation; the census's automorphism column is
        complete with ceiling sqrt(|Aut|/2)." It can NEVER certify anything
        about non-morphism canonical forms (863e36 C6), isogeny transport,
        or non-generic mechanisms outside quotient walks.
      nearby_object_control: >-
        Composite order with rational 2-torsion (extra class <tau_{T_2}>,
        quotient the 2-isogenous curve) and j = 0 with N = 3 (H^1 non-zero).
        BLOCKING: both must show strictly more conjugacy classes.
    proof_obligations:
      - claim: "Aut_var(E)(F_p) = G semidirect Aut(E, O)."
        responsibility: correctness
      - claim: "H cap G in {1, G} for N prime."
        responsibility: correctness
      - claim: "H^1(Hbar, G) = 0 for gcd(|Hbar|, N) = 1, so every complement is conjugate."
        responsibility: correctness
      - claim: "The shifted walk is the same walk: the conjugation carries adding steps to adding steps."
        responsibility: strictness
      - claim: "The two nearby objects show non-conjugate subgroups."
        responsibility: baseline
      - claim: "The record claims nothing about isogenies or arithmetic selectors."
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The H-orbit label of a walk state for a finite F_p-rational symmetry
      group H of E not fixing O; concretely the x-coordinate of R + T_0 for
      the conjugating translation T_0.
    lossiness: >-
      Lossy (|H| points share a label) and compatible with the H-action by
      construction; but the projection to E/H equals the projection to
      E/Hbar composed with the bijection R -> R + T_0, so relative to the
      known Aut-quotient it is a CHANGE OF COORDINATES and the
      lossy-projection test records no new object. That is the closure.
    propagation: >-
      Exact under H; under the walk step it propagates exactly as the
      Aut-quotient does (re-canonicalisation on the shifted x-coordinate).
    survival_score: >-
      Not applicable: the object is shown to coincide with an existing one.

  null_object_control: >-
    NULL-1 (blocking): the composite-order curve with rational 2-torsion --
    the enumeration must return strictly more conjugacy classes than
    subgroups of Aut(E, O), exhibiting <tau_{T_2}>. NULL-2 (blocking): j = 0
    with N = 3 -- must exhibit a non-conjugate complement. POSITIVE CONTROL:
    T_0 = O recovers the ordinary Aut-quotient and the negation walk. DECAY
    PARAMETER: none is meaningful for an exact statement; the record instead
    carries the two failure cells as its boundary. CM CELLS: the
    automorphism-discounted rho baseline (KN-TECH-018) is the control and is
    predicted to be the ceiling of the entire column. MATCHED RHO/BSGS ROWS:
    at STAGE 2, a shifted negation-quotient walk and the ordinary one must
    show identical charged work at matched seeds (the identity is exact);
    BSGS is unaffected by symmetry quotients (KN-TECH-031) and is reported
    unchanged.

  discriminated_from:
    - >-
      IDEA-20260901-863e36 (nearest). Closes quotients by scalar subgroups
      Gamma of (Z/n)^* not in the image of Aut(E, O) because such scalars
      are isogenies, not automorphisms (C5), and leaves arithmetic selectors
      open (C6). EXACT DELTA: 863e36 varies the OPERATION GROUP acting by
      scalars; this record varies the SYMMETRY GROUP of the curve as a
      variety, including elements that move O, and closes it by H^1 = 0. The
      two are complementary halves of "is Aut(E, O) the whole story".
    - >-
      IDEA-20260807-df906f. Proves translation-INVARIANT projections are
      trivial on prime order (regular action). This record concerns finite
      groups GENERATED WITH translations, which are never translation-
      invariant projections; df906f's theorem is used nowhere here.
    - >-
      IDEA-20260807-f00729. Records that the Aut(E, O)-orbit projection is
      not a homomorphism and closes propagation-based j = 0 mechanisms. This
      record does not touch propagation; it shows other symmetry orbits are
      the same orbits shifted.
    - >-
      H-ECDLP-{1853dc,63d136,63eecd,80fceb,e42bda}. Test the Aut(E, O)
      quotient's constant on certified curves. This record states that no
      other symmetry quotient exists to test, so a null on those hypotheses
      is a null on the whole symmetry column.
    - >-
      IDEA-20260829-20b05f and IDEA-20260829-2dc43c. Close the isogeny
      column set and count the automorphism cell; this record closes the
      symmetry column's METHOD set, an orthogonal axis.

  predictions:
    - metric: >-
        M1 -- number of translation-conjugacy classes of finite subgroups H
        with H cap G = 1, by exhaustive enumeration at N in {101, 211, 1009,
        2003} for |Aut(E, O)| in {2, 4, 6}
      direction: different
      minimum_effect: >-
        EXACTLY 2, 3 and 4 respectively (the subgroup counts of Z/2, Z/4,
        Z/6). Any other value on any tested curve refutes (B) and is the
        finding.
    - metric: >-
        M2 -- number of affine walks f(R) = [c]R + M commuting with
        iota_T at N = 101
      direction: different
      minimum_effect: >-
        EXACTLY N - 1 = 100, one per c in (Z/N)^*, with M = [(1-c)/2]T.
    - metric: >-
        M3 -- conjugacy-class count on the composite-order 2-torsion control
        and on the j = 0, N = 3 control
      direction: higher
      minimum_effect: >-
        STRICTLY MORE than the Aut(E, O) subgroup count on both. Equality on
        either voids STAGE 1's result.
    - metric: >-
        M4 -- charged rho work of the shifted negation-quotient walk versus
        the ordinary one at matched seeds, 20 seeds, one 16-bit curve
      direction: different
      minimum_effect: >-
        IDENTICAL step counts (the conjugation is exact). A difference is an
        implementation fault, not a result.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, one hour): the derivation (B), the coboundary
      check, and the worked involution (C). STAGE 1 (minutes, pure Python):
      the subgroup enumeration and conjugacy classification at four toy N
      and three automorphism sizes. STAGE 2 (minutes): the equivariant-walk
      count at N = 101. STAGE 3 (minutes, BLOCKING): the two nearby-object
      controls. STAGE 4 (minutes): the M4 identity check on one 16-bit curve
      with harness/rho.py extended by a shift. The cheapest valid
      discriminator is STAGE 1 plus STAGE 3 together: the theorem's count on
      the primary cells and its failure on the controls, both exact.
    controls:
      - composite-order rational-2-torsion control, must show extra classes (blocking)
      - j = 0 with N = 3 control, must show a non-conjugate complement (blocking)
      - T_0 = O positive control recovering the Aut-quotient and negation walk
      - shifted versus ordinary negation walk identity at matched seeds (M4)
      - automorphism-discounted rho baseline on CM cells (KN-TECH-018)
      - BSGS row unchanged (KN-TECH-031)
    required_metrics:
      - conjugacy-class counts per (N, |Aut|) with the enumerated subgroups listed
      - equivariant-walk count and the recovered M(c) law at N = 101
      - control counts on both nearby objects
      - matched-seed step counts, shifted versus ordinary
      - pass or fail of every blocking control

  falsification_conditions:
    - >-
      F1. STAGE 1 returns a conjugacy class not represented in Aut(E, O) on
      a prime-order curve with N > 3. Theorem (B) is false as stated; the
      record is superseded and the new subgroup is the lane's forward
      direction.
    - >-
      F2. STAGE 3 returns no extra class on either control. The enumeration
      never composes translations with automorphisms; STAGE 1's count is
      void.
    - >-
      F3. STAGE 2 returns a count other than N - 1 or an M law other than
      [(1-c)/2]T. Claim (C)'s worked instance is wrong; the closure is
      re-derived before use.
    - >-
      F4. M4 differs. Implementation fault in the shift; infrastructure
      outcome.
    - >-
      F5. All stages pass. The symmetry column is closed with mechanism;
      recorded as a scoped derivation-tier closure with forward guidance to
      (E) and to 863e36 C6.

  confounders:
    - >-
      RATIONALITY. A symmetry defined over F_{p^2} (e.g. mu_6 at j = 0 with
      p = 2 mod 3, where the curve is supersingular anyway) acts on E(F_p)
      only through its rational part; the enumeration must be over
      F_p-rational maps, which is the census's own scope line.
    - >-
      CONFUSING TRANSLATION-CONJUGACY WITH ISOMORPHISM. Two subgroups can
      be abstractly isomorphic without being conjugate; the classification
      must be by conjugacy in Aut_var(E), and STAGE 3's controls exist to
      show the code distinguishes them.
    - >-
      THE N = 3 CONTROL IS A TOY-ONLY OBJECT and lies far outside the census;
      it is used only to show the coprimality hypothesis is load-bearing.
    - >-
      READING THE CLOSURE AS "NO NON-GENERIC MECHANISM EXISTS". It closes
      symmetry quotients only; isogeny transport and non-morphism canonical
      forms are explicitly outside it.

  interpretation_limits:
    - "claim_tier: toy for every enumerated number; the derivation (B) is size-independent algebra and is labelled derivation, never proved."
    - >-
      Scoped to ordinary prime-order curves over F_p with N > 3 and
      F_p-rational symmetries; fails, by design, on the two nearby objects
      named in (E).
    - >-
      No exponent, no new constant, no status change. The record's value is
      a complete column with a named boundary, at negligible cost.
    - >-
      Per KN-OPEN-019 this program has no object enumeration for the ECDLP;
      this closes one method column of one RQ, not a taxonomy.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO DISTRIBUTIONAL HEURISTIC IS USED BY THE CLOSURE. The one
        statistical claim (M4: shifted and ordinary negation-quotient walks
        have identical charged work at matched seeds) is exact by
        conjugation, and is stated here as an assumption only so that it is
        checked rather than assumed of the implementation.
      rigorous_support: >-
        Exact: tau_{-T_0} conjugation carries the adding step to the adding
        step and the H-orbit to the Hbar-orbit, so the two walks visit
        corresponding states at every step.
      validation_plan: >-
        SAMPLE: one 16-bit prime-order curve, 20 seeds, T_0 drawn per seed,
        matched multipliers. COMPARISON: step-by-step equality of the
        shifted and ordinary walks' orbit labels and of their collision
        indices; not a distribution but an identity. TAIL CHECK: none
        needed; a single mismatch falsifies. SAMPLED PARAMETERS RECORDED:
        p, N, seeds, T_0 list, harness commit. TRANSFER: exact algebra;
        no transfer assumption.

  target_complexity:
    time_exponent: >-
      1/2, UNCHANGED, and the record states why no symmetry quotient can
      move it: the column's ceiling is sqrt(|Aut(E, O)|/2) <= sqrt(3), a
      constant, and the column is complete.
    memory_exponent: O(1) for rho, unchanged; the enumeration stores O(N * |Aut|) group elements at toy N only.
    best_known: >-
