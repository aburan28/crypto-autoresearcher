idea:
  id: IDEA-20260807-13c821
  question_id: RQ-CANL-63098f
  added: '2026-08-07'
  title: >-
    THE ONE FREE KNOB IN THE LANE, PRICED: for a j = 0 curve the canonical lift
    is y^2 = x^3 + (b + m p) over Q for EVERY integer m, a one-parameter family
    of global CM curves all reducing to E, so rank can be searched instead of
    imposed -- but IDEA-20260807-6533fd's threshold demands Z-rank > 8 in the CM
    case, Lang's bound (unconditional for integral j) forces generator heights
    to be Omega(log|m p|), and the search over m has no local goodness test
    cheaper than the rank computation itself
  class: algorithm

  claim: >-
    (A) THE KNOB, AND WHY IT IS THE ONLY ONE. IDEA-20260807-44ba75 observes
    that the canonical lift is a FUNCTION of E, so the attacker has no choice
    of lift and no quantifier to exploit. That is true for the lift's
    ISOMORPHISM CLASS OVER Z_p. It is NOT true for the global model. For a
    j = 0 curve E/F_p (p = 1 mod 3), every curve
        Ẽ_m : y^2 = x^3 + (b + m p),   m in Z,
    reduces mod p to the same curve y^2 = x^3 + b, has j = 0, and has CM by
    Z[zeta_3]. So the lane does have a free parameter after all: an infinite
    family of global CM curves, all reducing correctly, differing in rank,
    regulator, torsion and discriminant. THE SAME HOLDS FOR j = 1728 WITH
    y^2 = x^3 + (a + m p) x. This is the honest counterweight to 44ba75's
    "no quantifier is available", and it is why that record's claim is
    carefully phrased about the CANONICAL lift rather than about global models.

    (B) WHAT THE KNOB WOULD HAVE TO BUY. By IDEA-20260807-6533fd, the
    representation cost of one usable lift is Theta(N^{2/r_eff}) with
    r_eff = r_O in the CM regime, so beating rho's N^{1/2} on size alone
    requires r_O >= 3, i.e. Z-RANK AT LEAST 6, and beating it with margin
    requires Z-rank 8 or more. So the search over m is a search for a curve in
    the family y^2 = x^3 + k with k = b + m p and Z[zeta_3]-rank at least 3.
    THAT IS THE ENTIRE ALGORITHMIC CONTENT OF THIS PROPOSAL, stated as a
    concrete, checkable target rather than as a hope.

    (C) THE THREE COSTS, EACH QUANTIFIED.
      C1 SEARCH DENSITY. The rank of y^2 = x^3 + k as k varies is small on
        average; high-rank members exist but are sparse, and their density at
        a given size is the empirical quantity this proposal measures. [open]
        NO DENSITY IS ASSERTED HERE -- the record refuses to quote a
        literature number it has not verified. What IS asserted is the shape
        of the cost: if the density of Z-rank >= 6 members at parameter size
        M is delta(M), the search costs 1/delta(M) rank computations.
      C2 PER-CANDIDATE COST. Establishing a rank LOWER bound needs a point
        search of cost B^{r/2}; establishing an UPPER bound needs descent.
        Only lower bounds are needed here (a high-rank witness is what the
        attack wants), so the per-candidate cost is a point search -- which is
        the SAME search the attack itself needs, so nothing is saved by
        screening.
      C3 THE HEIGHT FLOOR, AND IT IS UNCONDITIONAL HERE. The curves Ẽ_m have
        j = 0, hence INTEGRAL j-invariant, and Lang's height conjecture is a
        theorem for elliptic curves with integral j-invariant
        (Hindry-Silverman, Invent. Math. 93 (1988) 419-450; RELAYED FROM A
        WEB-SEARCH ABSTRACT 2026-08-07, FULL PAPER NOT READ). So
        hhat(P~) >= c log|Delta(Ẽ_m)| = c log(432 (b + m p)^2) ~ 2c log(m p)
        for every non-torsion P~. THE GENERATORS CANNOT BE SHORT, and the
        floor GROWS with the search parameter m: the deeper the search, the
        worse the object it finds. That is a genuine anti-correlation between
        search depth and object quality, and it is the sharpest thing in this
        record.

    (D) THE STRUCTURAL POINT WORTH RECORDING EVEN IF THE ATTACK DIES. CM makes
    the JKSST failure analysis UNCONDITIONAL. ECFG-P1543-R1 records that the
    Xedni "C_0/p theorem reconstructs only under Lang, its discriminant-height
    comparison, and fixed arity 2 <= r <= 9". On a CM lift, Lang is a theorem
    (C3). SO THE ONE THING CM DEMONSTRABLY CHANGES ABOUT THE XEDNI FAILURE IS
    ITS LOGICAL STATUS, FROM CONDITIONAL TO UNCONDITIONAL -- in the defender's
    favour. That is a real answer to RQ-CANL-63098f's question "does CM change
    the specific quantity", and it is the answer nobody hoped for: CM does not
    change the value of the quantity, it removes a hypothesis from the theorem
    that bounds it.

    (E) THE TWO OUTCOMES. OUTCOME 1: the measured density of Z-rank >= 6
    members in the reachable window is 0, and the height floor grows as
    predicted. The knob is priced and closed with a named obstruction
    (anti-correlation of search depth and height floor), and part (D) stands
    as the lane's positive deliverable. OUTCOME 2: Z-rank >= 6 members are
    found at a density making the search cheaper than N^{1/2} rank
    computations. Then the lane has an object worth costing end to end and
    this record is superseded by one that does so. Both are reportable.

  resource_label: >-
    R6 (the global model and its Mordell-Weil group), R3 (CM by Z[zeta_3],
    which fixes the family and supplies the integral j-invariant), and R2 (the
    curve equation as the searchable parameter -- the family is a family of
    EQUATIONS, which is exactly resource R2 in DECOMPOSITION.md section 2).
  admissibility: admissible
  admissibility_argument: >-
    The searched object is a curve equation over Z, not a group element; the
    rank and the generators are characteristic-zero data invisible to any
    group oracle. The one step that touches G is the final reduction of a
    global relation, which by H-ENDO-001 is a scalar relation -- and, exactly
    as in IDEA-20260807-fd5a24, being a scalar relation is what makes it
    USABLE rather than vacuous, because the scalar depends on the coefficients.
    The proposal would be inadmissible if the search over m were guided by
    anything computed from G; it is not, and cannot be, which is precisely the
    obstruction C2 identifies (no cheap local goodness test).

  discriminated_from:
    - >-
      IDEA-20260807-44ba75: that record establishes that the CANONICAL lift is
      determined by E. This one exploits the residual freedom in the GLOBAL
      MODEL, which 44ba75 explicitly defers here. They are consistent, and
      neither is complete without the other's scope statement.
    - >-
      Silverman's original Xedni (KN-LIT-020): there the global curve is
      chosen to pass through prescribed lifted POINTS, with Mestre-style
      conditions imposed to force small rank. Here the global curve is chosen
      from a CM family with the points UNKNOWN, and rank is searched for
      LARGE rather than imposed small. Opposite direction on the rank, and no
      Mestre conditions at all -- which is exactly what makes it worth pricing
      separately from the classical failure.
    - >-
      IDEA-20260807-11b93d: that record works inside a fixed small-|D_E| lift
      and counts coefficient shells. This one varies the lift.
    - >-
      L3 / RQ-JINV-8fc13a: j = 0 as a parameter for index-calculus cost
      functionals. Shared parameter, disjoint functional (rank of a global
      model versus solving degree).

  object_first_candidate:
    tracked_object: >-
      THE RANK FUNCTION ON THE LIFT FAMILY: m |-> (r_O(Ẽ_m), Reg(Ẽ_m),
      log|Delta(Ẽ_m)|), followed as m ranges over an arithmetic progression
      determined by E.
    lossiness: >-
      LOSSY: it discards the curve's points, its L-function, its torsion, and
      everything about E except the residue class b mod p that pins the
      family. The discard is compatible with the operation that matters --
      moving to the next m -- because the family is defined by a congruence
      and the retained triple is what the height-budget identity consumes. It
      is NOT a change of coordinates: two m with the same triple are
      interchangeable for the attack and are genuinely different curves, and
      the attack cannot tell them apart, which is the informative collapse.
    propagation: >-
      One step = m -> m + 1. The discriminant term propagates deterministically
      (log|Delta| = log(432(b+mp)^2), exactly computable); the rank and
      regulator do NOT propagate deterministically -- they jump irregularly,
      which is precisely the obstruction C2 names as "no local goodness test".
      SO THE OBJECT PROPAGATES DETERMINISTICALLY IN ONE COORDINATE AND NOT IN
      THE OTHER TWO, and that split is the honest survival analysis: the
      deterministic coordinate is the one that hurts.
    survival_score: >-
      SURVIVES: any m, any p, any twist within the family. DIES: at the point
      where log|Delta| growth makes the Lang floor exceed the height budget
      B ~ N^{2/r_O}, which is computable and is where the search must stop.

  mechanism: >-
    STEP 1 -- BUILD THE FAMILY. Given E : y^2 = x^3 + b over F_p with p = 1 mod
    3, form Ẽ_m : y^2 = x^3 + (b + m p) for m = 0, 1, ..., M. Verify each
    reduces to E (immediate) and record log|Delta_m| exactly.
    STEP 2 -- EXHIBIT RANK LOWER BOUNDS CHEAPLY. For each m, search for points
    with x = u/w^2, |u| <= U, w <= W; test Z-independence by the numerical
    height Gram determinant; report the number of independent points found.
    THIS IS A LOWER BOUND ONLY and every statement is phrased that way.
    STEP 3 -- MEASURE THE HEIGHT FLOOR AGAINST LANG. For every exhibited
    point, compute hhat and the ratio hhat / log|Delta_m|. Fit the minimum of
    that ratio against m; Lang predicts it is bounded below by a positive
    constant c independent of m. A ratio trending to 0 would falsify the
    unconditional floor as applied and would be a significant observation.
    STEP 4 -- MEASURE THE DENSITY. Report the empirical frequency of
    exhibited-rank >= 2, 3, 4, 6 across the searched m, with the search bounds
    stated, as a LOWER BOUND on the true density.
    STEP 5 -- TEST FOR A LOCAL GOODNESS PREDICTOR. This is the arm that could
    change the cost model: is there any cheap statistic of m -- the
    factorisation of b + mp, its cube-free part, congruence conditions, a
    2-descent-free Selmer proxy -- that CORRELATES with exhibited rank? Measure
    the correlation against a matched shuffled null. A predictor with
    predictive power would convert the search from 1/delta rank computations
    into 1/delta cheap tests plus a few rank computations, which is the only
    way C2 improves.
    STEP 6 -- CHARGE IT. Combine density, per-candidate cost and the height
    floor into a total cost and compare with 0.886 sqrt(N). Report exponents.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      2026-08-07 shared L9 screen plus greps for "twist family|rank search|
      Mestre|y^2 = x^3 + k" across ledger/, knowledge/, docs/, analysis/, and
      reads of KN-LIT-020, KN-LIT-021 and ECFG-P1543-R0/R1.
    results: >-
      Mestre's method is referenced only inside the KN-LIT-020 summary. No
      record searches a lift family for rank, and no record states the
      congruence family y^2 = x^3 + (b + mp) as the residual freedom of a
      j = 0 canonical lift. The Hindry-Silverman unconditionality point does
      not appear anywhere.
    verdict: >-
      ADAPTATION. Rank searches in the family y^2 = x^3 + k are a classical
      pastime in the literature and nothing about them is claimed as new; the
      external state of the art on record ranks in that family is NOT quoted
      here because it was not verified, and Stage 0 must retrieve it. New to
      this program: the family as the canonical lift's residual freedom, the
      Z-rank > 8 threshold from the CM effective-rank correction, and the
      search-depth/height-floor anti-correlation.

  null_object_control: >-
    MANDATORY AND BLOCKING. NULL OBJECT: the family y^2 = x^3 + k with k drawn
    UNIFORMLY at random from the same size window, rather than from the
    arithmetic progression b + mp. Same searches, same bounds, same metrics.
    The congruence condition k = b mod p is the only thing distinguishing the
    lift family from a generic sextic-twist family, and if the rank
    distribution and height floors are identical then the "lift" structure
    contributes nothing and the search is just a generic high-rank hunt with
    no connection to E. THAT IS THE EXPECTED OUTCOME and it is pre-registered.
    DECAY PARAMETER: p. As p grows the progression b + mp becomes sparser in
    any fixed window, so any apparent enrichment of the lift family over the
    random family MUST decay like 1/p. An enrichment that fails to decay with
    p is the canonical artifact tell.
    SECOND NULL for Step 5: shuffle the (statistic, rank) pairing and recompute
    the correlation; the predictor must beat its own shuffle.
    POSITIVE CONTROL: plant a high-rank member by constructing a curve with
    several prescribed points and confirming the pipeline exhibits them.

  assumptions:
    - >-
      Every Ẽ_m reduces to E mod p. Immediate from the congruence, but the
      SEXTIC TWIST class must be tracked: y^2 = x^3 + k and y^2 = x^3 + k'
      are F_p-isomorphic iff k/k' is a sixth power mod p, so the family covers
      one twist class and the other five are separate families. Recorded per
      run; conflating them would be an error.
    - >-
      Lang's conjecture holds for integral-j curves (Hindry-Silverman).
      RELAYED FROM A WEB-SEARCH ABSTRACT, FULL PAPER NOT READ. If it fails to
      verify, C3 becomes conditional and the record says so; the measurement
      in Step 3 is designed to test the floor empirically regardless.
    - >-
      Only rank LOWER bounds are established. No upper bound, no descent, no
      Selmer computation. Every "rank r" means "r independent points
      exhibited below the search bound".
    - >-
      No external record-rank number is quoted. The density is measured, not
      cited, and the record explicitly does not claim to know the literature's
      maximum rank in this family.

  proof_search_map:
    bottleneck: >-
      Step 5: whether any cheap statistic of m predicts rank. Everything else
      is bookkeeping. If a predictor exists the search cost drops from
      1/delta rank computations to 1/delta cheap tests, and the knob becomes
      worth costing end to end; if none does, C2 is binding and the knob is
      dead at a cost of 1/delta point searches, each of which is the attack's
      own search.
    baseline_embedding:
      parameter_slice: >-
        m = 0 with b small, i.e. a named curve y^2 = x^3 + b whose rank and
        generators are available from a public table. The pipeline must
        exhibit exactly those generators (up to sign and torsion) within the
        declared search box.
      reproduction_check: >-
        Frozen fixture: named b, named generators with exact coordinates,
        exact canonical heights to 10 digits. A mismatch is an instrument
        failure and blocks the line.
    observation_collision:
      observable: "The exhibited rank of Ẽ_m."
      distinct_preimage_search: >-
        SUCCEEDS AND IS BLOCKING: a member of the lift family with exhibited
        rank 2 and a uniformly random member of y^2 = x^3 + k with exhibited
        rank 2 are indistinguishable by the observable. That is the null N and
        it says the observable carries no information about E. The collision
        FAILS -- and the record becomes interesting -- only if the lift family
        is enriched in rank relative to the random family after the 1/p decay
        is accounted for. There is no arithmetic reason to expect enrichment,
        and the record says so.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold exhibited rank fixed and vary the forgotten structure: the
          congruence class mod p. The intrinsic invariant separating the
          fibres is whether the curve reduces to E at all -- which the rank
          observable cannot see. This is simultaneously the null construction
          and the demonstration that rank is the wrong tracked quantity for
          connecting the global family to E.
        predicted_gain: >-
          None to an attacker; it establishes that the search is disconnected
          from the instance, which is the record's likely negative.
      - transform: stronger_invariant
        proposed_object: >-
          Track (exhibited rank, min hhat / log|Delta|) rather than rank
          alone. The pair carries the Lang floor and therefore the height
          budget, which rank alone hides; a rank-6 curve with a floor twice as
          high is worse than a rank-4 curve with a low floor, and only the
          pair can say so.
        predicted_gain: >-
          Converts a rank hunt into a cost-aware hunt and is what makes the
          anti-correlation in C3 measurable.
    quantifier_order: >-
      THE CLAIM BEING TESTED: THERE EXISTS m <= M such that r_O(Ẽ_m) >= 3 AND
      the generators have height below the budget N^{2/3}. THE TRAP: the
      weaker and useless "for every budget there exists an m with rank 3",
      which is plausibly true with M growing and is worthless because the
      Lang floor grows with m. The record's formulation binds M and the height
      budget together, which is the only order in which the search has a cost.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "in the searched window, the lift family's exhibited-rank
        distribution and height-floor distribution are indistinguishable from
        a size-matched random sextic family, and no tested cheap statistic
        predicts rank above its own shuffle." It CANNOT certify that no m
        gives high rank, cannot establish rank upper bounds, cannot rule out a
        predictor it did not test, and cannot bear on crypto scale.
      nearby_object_control: >-
        The nearby object where the hoped-for conclusion fails is a family
        with a KNOWN rank-forcing construction -- e.g. curves built to contain
        several prescribed rational points, which have high rank by
        construction. A method that failed to exhibit high rank there is
        broken; that is the planted positive control and it is mandatory.
    proof_obligations:
      - claim: "Every Ẽ_m reduces to E mod p within its sextic twist class."
        responsibility: correctness
      - claim: "Ẽ_m has j = 0 hence integral j hence Lang is unconditional."
        responsibility: baseline
      - claim: "hhat >= c log|Delta_m| ~ 2c log(mp), so the floor grows with m."
        responsibility: size_bound
      - claim: "Beating rho on size alone requires r_O >= 3 (Z-rank >= 6)."
        responsibility: runtime
      - claim: "Only rank lower bounds are established."
        responsibility: strictness
      - claim: "The lift family is compared against a size-matched random family."
        responsibility: baseline
      - claim: "No external record-rank number is quoted unverified."
        responsibility: scope

  predictions:
    - metric: >-
        exhibited-rank distribution over m = 0..M for the lift family versus
        the size-matched random family
      direction: different
      minimum_effect: >-
        Predicted INDISTINGUISHABLE (two-sample test p-value above 0.05). A
        reproducible enrichment of the lift family that survives the 1/p decay
        control is the pre-registered reopening condition.
    - metric: >-
        min over exhibited points of hhat / log|Delta_m|, fitted against log m
      direction: different
      minimum_effect: >-
        Predicted BOUNDED BELOW by a positive constant, with slope 0 against
        log m -- i.e. the Lang floor holds uniformly. A slope trending
        negative and approaching 0 would falsify the unconditional floor as
        applied and is a significant observation in its own right.
    - metric: >-
        measured height floor times the height budget: c log|Delta_m| versus
        N^{2/r_O}
      direction: higher
      minimum_effect: >-
        Report the m at which the floor exceeds the budget; that m is the
        search's hard stop and its value is the record's central cost number.
    - metric: >-
        best exhibited Z-rank over the searched window
      direction: higher
      minimum_effect: >-
        Predicted below 6 in any window reachable at toy scale. Reaching 6 is
        the threshold event; reaching 8 would clear the CM-corrected threshold
        and would be reported immediately.
    - metric: >-
        correlation between each candidate cheap statistic and exhibited rank,
        against its own shuffled null
      direction: higher
      minimum_effect: >-
        Predicted no statistic beats its shuffle at the 0.01 level after
        multiple-comparison correction across the tested statistics. THE
        CORRECTION IS MANDATORY: testing many statistics without it is the
        standard way to manufacture a predictor that does not exist.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): verify or downgrade the
      Hindry-Silverman citation; retrieve and record the external state of
      the art on ranks in y^2 = x^3 + k with verification status. A high
      published record rank would RAISE this proposal's priority, not lower it.
      STAGE 1 (hours): frozen known-generator fixture at m = 0.
      STAGE 2 (hours): the family scan for M up to the largest affordable,
      with the identical scan on the size-matched random family.
      STAGE 3 (hours): height floor measurement and fit.
      STAGE 4 (hours): the predictor hunt with shuffled nulls and
      multiple-comparison correction.
      STAGE 5 (minutes): planted high-rank positive control.
      STAGE 6 (zero compute): charge the search against 0.886 sqrt(N).
    controls:
      - Size-matched random sextic family (the null object).
      - 1/p decay control across at least three p.
      - Shuffled-pairing null for every candidate predictor.
      - Planted high-rank positive control.
      - Known-generator frozen fixture.
      - Sextic twist class tracked and never pooled.
    required_metrics:
      - Exhibited rank per m, both arms, with search bounds
      - "hhat and hhat/log|Delta_m| per exhibited point"
      - Density of exhibited rank >= 2, 3, 4, 6 per arm
      - Predictor correlations with shuffled baselines and corrected p-values
      - The hard-stop m where the Lang floor exceeds the budget
      - Wall clock per m and total search cost

  falsification_conditions:
    - >-
      The known-generator fixture does not reproduce. Instrument failure under
      AGENTS.md rule 5; nothing reported.
    - >-
      The lift family is enriched in rank relative to the random family and
      the enrichment does not decay like 1/p. Artifact tell -- most likely a
      twist-class or search-bound asymmetry between the arms.
    - >-
      The lift family is enriched AND the enrichment decays correctly. Outcome
      2: the congruence carries information, the knob is live, and this record
      is superseded by an end-to-end costing.
    - >-
      A cheap statistic beats its shuffle after correction. C2 is not binding;
      the search cost model changes and the record is superseded.
    - >-
      min hhat / log|Delta_m| trends to 0. Lang's floor as applied is wrong;
      part C3 and part D are both withdrawn.
    - >-
      The planted high-rank control is not detected. No negative may be
      reported from any arm.

  confounders:
    - >-
      Sextic twist class. Six classes, six families; pooling them would
      manufacture an apparent enrichment. Tracked per run.
    - >-
      Search-bound asymmetry. The lift family's k values are ~ mp while the
      random family's are ~ same size by construction -- the match must be on
      |k|, not on m, or the arms differ in discriminant and hence in the Lang
      floor.
    - >-
      Rank lower bounds only. A curve reported "rank 1" may have rank 5 with
      tall generators. Every density is a lower bound and is labelled so.
    - >-
      Multiple comparisons in the predictor hunt. Correction is mandatory and
      the number of statistics tested must be pre-registered.
    - >-
      Cube-free reduction. y^2 = x^3 + k and y^2 = x^3 + k t^6 are isomorphic
      over Q; k must be reduced to its sixth-power-free part before ranks are
      compared, or duplicates inflate the density.

  interpretation_limits:
    - >-
      Toy scale, claim_tier toy, j = 0 (and optionally j = 1728) only, rank
      lower bounds only, one twist class at a time.
    - >-
      A negative closes "search the lift family for rank" within the searched
      window and the tested predictors. It does NOT close lifting, does NOT
      bound the rank of the family, and does NOT bear on any deployed curve --
      including j = 0 curves, on which this record's conclusion is negative.
    - >-
      Part (D) -- that CM makes the Xedni failure analysis unconditional -- is
      the record's most durable content and is independent of the search's
      outcome. It should be promoted separately if it verifies, and it must
      carry the Hindry-Silverman citation's verification status with it.
    - >-
      The anti-correlation in C3 is a statement about the FAMILY, not a
      theorem about all lifts: a different global model with small
      discriminant and high rank is not excluded by anything here.

  heuristic_assumptions:
    - id: HEUR-CANL-M1
      statement: >-
        FOR ALL m in the searched window, the exhibited-rank distribution of
        Ẽ_m is that of a uniformly random sextic-twist curve of the same
        size, i.e. the congruence k = b mod p is independent of rank.
      rigorous_support: >-
        None as a theorem. It imitates the standard expectation that rank in a
        twist family depends on the curve's arithmetic (Selmer groups,
        L-values) and not on a congruence modulo an unrelated prime -- the
        same independence expectation that underlies every twist-family rank
        heuristic. It CAN FAIL and the null arm is designed to detect the
        failure.
      falsification_condition: >-
        A reproducible, correctly-decaying enrichment of the lift family.
      validation_plan: >-
        Sample: M >= 10^4 values of m per p, at three p spanning two decades,
        against an equal number of size-matched random k. Predicted
        distribution: identical exhibited-rank histograms; compare by a
        two-sample test and report the effect size, not only the p-value.
        Tail check: the highest exhibited rank in each arm. TOY SCALE ONLY and
        labelled as such.
    - id: HEUR-CANL-M2
      statement: >-
        No statistic of m computable in polylog(mp) time correlates with
        exhibited rank beyond its shuffled null, within the tested set.
      rigorous_support: >-
        None; it is a claim about a finite tested set and is explicitly a
        hypothesis about the search rather than about the space, per
        docs/inventor-protocol.md. The tested set must be pre-registered and
        its size reported with every verdict.
      falsification_condition: Any tested statistic beating its shuffle after correction.
      validation_plan: >-
        Pre-register the statistic list (cube-free part, small-prime
        factorisation pattern, congruences mod small primes, quadratic
        character values, root-number proxies where computable). Report the
        full correlation table, not only the best entry -- reporting only the
        best is how a false predictor is manufactured.

  target_complexity:
    time_exponent: >-
      Search cost 1/delta(M) point searches, each of cost B^{r/2} with
      B >= c log|Delta_M|. NO EXPONENT IN N IS CLAIMED because delta is
      measured, not assumed; the record's output is the measured delta and the
      resulting total. For the mechanism to beat rho at N^{1/2} it needs
      exhibited Z-rank >= 6 AND 1/delta below N^{1/2}, and the record predicts
      neither holds in a reachable window.
    memory_exponent: >-
      O(number of exhibited points) per candidate, negligible; the scan is
      streaming in m.
    best_known: >-
      Parallel rho at 0.886 sqrt(N), O(1) memory (KN-TECH-001, KN-TECH-006);
      on a j = 0 curve the automorphism-discounted variant is a further
      sqrt(6) faster (KN-TECH-018), which is the correct baseline here
      precisely because this record's family is the j = 0 family; BSGS at
      sqrt(N)/sqrt(N) (KN-TECH-031).
    hidden_overhead: >-
      Two disclosed. (i) The per-candidate point search is the SAME search the
      attack needs, so screening candidates is not cheaper than attacking --
      the search has no economy of scale. (ii) The Lang floor grows with the
      search depth, so the marginal candidate is worse than the first: an
      anti-economy of scale, which is unusual and is the record's most
      distinctive cost feature.
    tradeoff_note: >-
      Deeper search buys more candidates at a rate delta(M) and worse
      candidates at a rate log M in the height floor. The product is
      monotonically unfavourable, so there is no interior optimum: the best
      point of the tradeoff curve is the smallest m, which is m = 0, which is
      the curve you already had. Stating that explicitly is the cleanest form
      of the knob's failure.

  dominated_by: >-
    CHECKED ACROSS EVERY FRONTIER ROW ON TIME, MEMORY AND DATA/QUERIES.
    Dominated by parallel rho with distinguished points (0.886 sqrt(N) time,
    O(1) memory) -- and on the j = 0 family specifically by the
    automorphism-discounted rho (KN-TECH-018), which is sqrt(6) faster still
    and needs no lift, no rank and no search. Dominated by BSGS on time.
    Dominated even by the trivial strategy of not lifting at all, since the
    per-candidate cost is itself a point search of the same order. Not
    comparable to index-calculus rows except on total time, where it is also
    dominated. NOT null.
  sota_delta: >-
    Zero speedup against every baseline; the tradeoff has no interior optimum
    and its best point is the null action. Quantitative content delivered:
    the CM-corrected rank threshold (Z-rank >= 6 to match rho on size, >= 8
    for margin), the Lang floor c log(432(b+mp)^2) growing like 2c log m, the
    hard-stop m where the floor exceeds the budget N^{2/r_O}, and a measured
    lower bound on the density of high-rank members in the lift family with a
    size-matched random control.

