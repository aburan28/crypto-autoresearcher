    - >-
      F3. |Stab(B)| over the splitting field is not 2|Aut| for some curve, or
      the lambda-classification disagrees with j. Implementation defect; run
      INVALID.
    - >-
      F4. The random-4-point null (C2) reports enlarged stabilisers at
      appreciable rate. The enumeration is finding spurious structure; every
