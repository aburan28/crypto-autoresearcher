    - >-
      F5 (THE MAIN NEGATIVE, AND IT IS THE INTENDED DELIVERABLE). Every
      prediction holds. Then the lane acquires: a derived rather than quoted
      sqrt(|Aut|) ceiling; an explicit accounting of the factor 4 it never had;
      a third obstruction (coset non-preservation) independent of H-ENDO-001 and
