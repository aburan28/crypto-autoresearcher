      (2) WebSearch and WebFetch: BOTH FAILED with a backend model error on
          every attempt this session. NO EXTERNAL LITERATURE WAS CHECKED.
      (3) grep of ledger/proposals/ for question_id RQ-JINV-8fc13a -> 19 files;
          titles and claims read; IDEA-20260807-f00729, IDEA-20260807-94f953
          read in full; IDEA-20260807-8b9486, IDEA-20260807-778375,
          IDEA-20260807-13c821, IDEA-20260808-45af43 and IDEA-20260807-653dda
          read in part.
      (4) grep -i "sextic twist|eigenspace|trace-zero|Verheul" over
          ledger/proposals/ and knowledge/literature/ -> the corpus's Verheul
          entries are XTR and credential papers, not the pairing-inversion
          theorem; IDEA-20260808-45af43 already covers the six sextic twists and
          the F_{p^6} Weil restriction.
      (5) grep -i "canonical representative|orbit representative|canonicalis" ->
          IDEA-20260807-18d2f7 identified and read; its ladder is indexed by
          subgroups of (Z/N)^* acting by SCALARS and contains no geometric
          symmetry of the x-line and no translations.
    results: >-
      NO RECORD FOUND IN THIS REPOSITORY MENTIONS THE BRANCH-LOCUS STABILISER,
      THE CROSS-RATIO TRICHOTOMY, OR THE GROUP E[2] SEMIDIRECT Aut/{+-1}. The
      lane's automorphism records (f00729, 5ddccf, and KN-TECH-018) all take
      Aut(E) as the group and never ask whether a larger cheap group acts on the
      x-line. IDEA-20260807-18d2f7's ladder is over subgroups of (Z/N)^*, i.e.
      scalar actions on G, which is a disjoint family: translations are not
      scalars and do not appear in it.
    verdict: >-
      UNVERIFIED, and the MATHEMATICS IS CLASSICAL AND IS NOT CLAIMED AS NEW.
      The generic/harmonic/equianharmonic trichotomy of a 4-point set on P^1,
      the identification of the harmonic and equianharmonic cases with j = 1728
      and j = 0, the structure of the automorphism group of a genus-1 curve as
      translations semidirect Aut(E), and the formula x(P + T) = b/x(P) for
      2-torsion translation are all textbook (Silverman, Arithmetic of Elliptic
      Curves, III.1 and III.10 for Aut(E) and the lambda-line; the PGL_2
      stabiliser of four points is classical invariant theory) - CITED FROM
      MEMORY AND NOT RE-VERIFIED THIS SESSION, since no external source was
      reachable. What may be new to this program is the USE: assembling them
      into a ceiling argument for the ECDLP walk, naming the coset-preservation
      obstruction as distinct from the two obstructions the lane already has,
      and delivering the four-row table.
    external_check_that_would_settle_it: >-
      NAMED PRECISELY. (1) Silverman, Arithmetic of Elliptic Curves, III.10
      (Aut(E) and the j-invariant) and III.1 Exercise set (the lambda-line and
      the six values of lambda giving one j) - confirm the trichotomy and the
      order 4/8/12. (2) Any treatment of the "reduced automorphism group" of a
      hyperelliptic curve (the automorphism group modulo the hyperelliptic
      involution) - e.g. the genus-2 literature on Shaska-Voelklein reduced
      automorphism groups - which states exactly the group E[2] semidirect
      Aut/{+-1} for genus 1 and would settle whether the ceiling use is
      standard. (3) The rho-with-equivalence-classes literature
      (Wiener-Zuccherato SAC 1998; Duursma-Gaudry-Morain ASIACRYPT 1999;
      Galbraith-Gaudry DCC 2016 survey) - do any of them consider quotienting by
      2-torsion translations and reject it for the coset reason given here? If
      one does, novelty_status becomes `known` and this record's value collapses
      to the internal table and the KN-OPEN-019 sub-enumeration.

  assumptions:
    - >-
      [fact] p > 3 and E ordinary. In characteristic 2 and 3 the trichotomy and
      the automorphism orders differ and nothing here applies; j = 0 and
      j = 1728 coincide in characteristic 3.
    - >-
      [fact] A Mobius transformation fixing three points of P^1 is the identity,
      so Stab(B) injects into Sym(B) = S_4 and |Stab(B)| divides 24.
    - >-
      [fact] For T in E[2], x(P + T) is a degree-1 rational function of x(P);
      concretely for y^2 = x(x^2 + ax + b) and T = (0,0) it is b/x. For T not in
      E[2] the assignment is not a function of x(P) at all, which is why the
      group is E[2] and not E. Verified symbolically in Step 1 and numerically
      in Step 2.
    - >-
      [fact] N is an odd prime and T has order 2, so T is not in G and G and
      G + T are disjoint. This is Obstruction 2 and it is elementary.
    - >-
      [scope] Toy scale for Step 2: G must be enumerable, so p up to about 2^20.
      The claim being tested is an exact set equality, so the test is exhaustive
      per curve rather than sampled and no statistical power question arises.
    - >-
      [scope] Everything is over F_p. Over extension fields Frobenius supplies
      further cheap maps of the x-line and both obstructions would have to be
      re-derived; nothing here transfers.

  heuristic_assumptions:
    - id: H1
      statement: >-
        NO PROBABILISTIC HEURISTIC IS USED ANYWHERE IN THIS RECORD, and this
        entry exists to say so explicitly rather than to leave the block empty.
        Every quantity claimed is an exact finite invariant: |Stab(B)| is the
        order of a subgroup of S_4; the subgroup preserving x(G) is decided by a
        finite set equality; and Obstruction 2 is the elementary statement that
        an odd-order subgroup does not contain an element of order 2. The only
        assumption with any content is an OPERATIONAL one: that the Step 2
        enumeration of candidate Mobius maps is complete, i.e. that every
        element of Stab(B) is found by ranging over the assignments of three
        points of B to three points of B.
      rigorous_support: >-
        RIGOROUS, NOT HEURISTIC. A Mobius map is determined by the images of
        three distinct points, so ranging over the at most 4*3*2 = 24 injective
        assignments of three chosen points of B into B, constructing the unique
        map for each, and testing whether it maps B to B, enumerates Stab(B)
        exhaustively. The classical distribution theorem this would otherwise
        imitate does not exist and is not invoked.
      validation_plan: >-
        WHAT TO SAMPLE: nothing is sampled. The check is exhaustive per curve.
        VALIDATION OF THE ENUMERATION ITSELF: on every curve, the enumerated
        |Stab(B)| over the splitting field must equal 2|Aut(E)| as predicted by
        j, computed independently from j via the classical formula for |Aut|
        (6 at j = 0, 4 at j = 1728, 2 otherwise). Two independent routes to the
        same integer on every curve is the validation, and a mismatch is an
        implementation defect that voids the run.
        TAIL CHECK: report the cross-ratio lambda and its orbit under the
        six-element group generated by lambda -> 1-lambda and lambda -> 1/lambda
        on every curve, and check that the classification generic / harmonic /
        equianharmonic agrees with j computed from the curve equation. The six
        lambda values giving one j is the classical redundancy and is a free
        internal consistency check.
      falsification_condition: >-
        Any curve on which the enumerated |Stab(B)| over the splitting field is
        not 2|Aut(E)|, or on which the lambda-orbit classification disagrees with
        j. Implementation defect; the run is INVALID and returns to the
        executor.

  proof_search_map:
    bottleneck: >-
      The lane treats Aut(E) as the complete supply of cheap symmetry and never
      asks what the largest cheap symmetry group of the x-line is. That framing
      is the bottleneck: it makes the sqrt(|Aut|) ceiling look like a fact about
      the curve when it is a fact about which symmetries survive to the
      prime-order subgroup, and it leaves the generic curve looking symmetry-free
      when its x-line in fact carries a Klein four-group.
    baseline_embedding:
      parameter_slice: >-
        The generic curve, j not in {0, 1728}, with N prime. There |Stab(B)| = 4
        over F_pbar, the F_p-rational part is trivial (no rational 2-torsion
        when N is odd), the part preserving x(G) is trivial, and the ceiling is
        sqrt(2) - which is exactly the negation factor already inside the
        0.886*sqrt(N) convention (KN-TECH-006). The framework must reproduce
        that known boundary.
      reproduction_check: >-
        FROZEN FIXTURE. On a generic toy curve with N prime the run must report
        |Stab(B)| over F_pbar = 4, |Stab(B)| over F_p = 1, and
        |{sigma preserving x(G)}| = 1, and must independently confirm |Aut| = 2
        from j. Any deviation halts the line before any special-j curve is
        touched.
    observation_collision:
      observable: >-
        The pair ( |Stab(B)| , |{sigma in Stab(B) : sigma(x(G)) = x(G)}| ).
      distinct_preimage_search: >-
        THE FIRST COMPONENT COLLIDES BY DESIGN AND THE RECORD SAYS SO: all
        curves with the same j have the same |Stab(B)|, and there are about 2p
        curves for each j-invariant over F_p once twists are counted, so the
        observable is massively non-identifying for the curve. That is not a
        falsifier - it is the content, since the claim is precisely that the
        first component is a function of j alone. THE DANGEROUS COLLISION TO
        SEARCH FOR IS IN THE SECOND COMPONENT: two curves with the SAME j and
        the SAME |Stab(B)| but DIFFERENT counts of symmetries preserving x(G).
        The claim says this cannot happen when N is an odd prime, so finding it
        would refute the claim directly. The search is free: it is the
        cofactor-even arm of Step 3.
    constructive_transforms:
