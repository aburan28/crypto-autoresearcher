  minimal_test:
    design: >-
      THE CHEAPEST VALID DISCRIMINATOR COSTS ZERO COMPUTE AND IS OBSTRUCTION 2:
      N is an odd prime and T has order 2, so T is not in G and G + T is
      disjoint from G; therefore no non-trivial 2-torsion translation acts on G
      at all. One line, and it settles the factor 4 for every curve
      simultaneously, including the curves where the translation IS rational and
      IS cheap. Obstruction 1 is a second, independent one-liner covering the
      prime-order case.
      THE CHEAPEST EMPIRICAL DISCRIMINATOR IS THE EVEN-COFACTOR ARM, AND IT IS
      AN EXACT SET EQUALITY RATHER THAN A STATISTIC: take one toy curve with
      full rational 2-torsion and a large odd prime-order subgroup G, enumerate
      x(G), and test the three non-trivial rational translations for preserving
      it. Three set comparisons on a curve of a few thousand points. If any
      preserves x(G), Obstruction 2 is false and the lane's ceiling is wrong; if
      none does, the factor 4 is closed empirically on the one family where the
      closure is not already forced by irrationality. Seconds of compute.
      Step 2's full enumeration across all three j-families is corroboration and
      supplies the table.
    controls:
      - >-
        C1 GENERIC-CURVE BASELINE, BLOCKING: |Stab(B)| = 4 over the splitting
        field, 1 over F_p when N is odd prime, usable subgroup 1, |Aut| = 2 from
        j. Three families must give three different first-row values (4, 8, 12),
        which is a far stronger instrument test than a single comparison.
      - >-
        C2 NULL OBJECT - A RANDOM 4-POINT SET on P^1 that is NOT a branch locus
        of any curve in the run. Its PGL_2 stabiliser must still be computed by
        the same code and must come out 4 generically; if the code reports 8 or
        12 on random sets at any appreciable rate it is finding structure that
        is not there and every number is void.
      - >-
        C3 NULL OBJECT - A RANDOM SUBSET S of F_p of the same cardinality as
        x(G), in place of x(G), tested against the same sigma. No sigma should
        preserve it. If some sigma preserves a random set at non-negligible
        rate, the set-equality test is broken.
      - >-
        C4 THE COFACTOR SWEEP AS THE DECAY PARAMETER: curves with
        |E[2](F_p)| = 1, 2, 4 at each j-family. |Stab(B) over F_p| must GROW
        with |E[2](F_p)| by exactly that factor, while |{preserving x(G)}| must
        stay EXACTLY |Aut|/2. The predicted shape is one curve rising and one
        curve flat; if both rise, Obstruction 2 is false, and if neither rises,
        the rationality computation is broken. Stating the predicted shape of
        both curves in advance is what makes this a test.
      - >-
        C5 TWIST CONTROL: the quadratic twist of each curve has the same j and
        must give the same first row and a possibly different second row. Any
        difference in the first row refutes "|Stab(B)| is a function of j".
    required_metrics:
      - per curve: p, a, b, j, lambda and its six-element orbit, N, cofactor
      - '|E[2](F_p)| and the rational 2-torsion x-coordinates'
      - '|Stab(B)| over F_p and over the splitting field, with the group listed'
      - the explicit Mobius coefficients of every element of Stab(B)
      - '|{sigma : sigma(x(G)) = x(G)}| and which sigma they are'
      - agreement of |Aut| computed from j with |Stab(B)|/|E[2]|
      - pass/fail of C1-C5

  falsification_conditions:
    - >-
      F1 (ZERO COMPUTE, PRIMARY). Obstruction 2 is wrong: G + T meets G for some
      2-torsion T and odd prime N. This is elementary group theory and its
      failure would mean the setup is mis-stated; the record is withdrawn by a
