idea:
  id: IDEA-20260811-e1ae92
  question_id: RQ-JINV-8fc13a
  added: '2026-08-11'
  title: >-
    j IS LITERALLY THE ORDER OF THE CHEAP SYMMETRY GROUP OF THE x-LINE, AND THE
    LANE IS USING ONLY A THIRD OF IT: the Mobius transformations of P^1 = E/{+-1}
    induced by curve automorphisms form E[2] semidirect (Aut(E)/{+-1}), of order
    2|Aut| = 4, 8, 12 at generic j, j = 1728, j = 0 - the classical
    generic/harmonic/equianharmonic trichotomy that DEFINES j - so the would-be
    walk ceiling is sqrt(12) = 3.46, not sqrt(6) = 2.449; the missing factor 4 is
    the 2-torsion translations and it is unusable for TWO INDEPENDENT reasons,
    neither of which is H-ENDO-001's scalar argument and neither of which is
    IDEA-20260807-f00729's non-homomorphism
  class: mechanism

  claim: >-
    (A) THE OBJECT, AND WHY IT IS EXACTLY THE j-INVARIANT. Let E/F_p be
    ordinary with p > 3, written y^2 = f(x) with f cubic, and let x: E -> P^1 be
    the degree-2 quotient by {+-1}, branched over the 4-point set
    B = {e_1, e_2, e_3, infinity} where the e_i are the roots of f. Consider the
    group
        Stab(B) = { sigma in PGL_2 : sigma(B) = B },
    the Mobius transformations of the x-line that preserve the branch locus -
    equivalently, the automorphisms of P^1 that lift to automorphisms of E as a
    CURVE. The restriction map Stab(B) -> Sym(B) = S_4 is injective, because a
    Mobius map fixing three points is the identity. Its image always contains the
    Klein four-group V of double transpositions, and:
        |Stab(B)| = 4   for a generic cross-ratio,
        |Stab(B)| = 8   for the harmonic cross-ratio lambda in {-1, 2, 1/2},
        |Stab(B)| = 12  for the equianharmonic cross-ratio lambda^2-lambda+1 = 0.
    THE TRICHOTOMY IS THE DEFINITION OF j: with
    j = 256(lambda^2-lambda+1)^3 / (lambda^2(lambda-1)^2), harmonic is exactly
    j = 1728 and equianharmonic is exactly j = 0. So |Stab(B)| is a function of
    j and of nothing else, and it takes the values 4, 8, 12 exactly where |Aut|
    takes the values 2, 4, 6. Structurally
        Stab(B) = E[2] semidirect (Aut(E)/{+-1}),   |Stab(B)| = 2|Aut(E)|,
    with the V-part realised by the translations x -> x(P + T) for
    T in E[2] (each of which IS a Mobius map, because x(P+T) is a degree-1
    rational function of x(P) exactly when T is 2-torsion) and the quotient
    realised by the extra automorphisms x -> zeta_3 x at j = 0 and x -> -x at
    j = 1728.
    THIS RECORD'S FIRST POINT: the cheap symmetry group of the x-line is
    2|Aut| = 12 at j = 0, not 6, and it is 4 even on a generic curve where the
    lane assumes there is nothing. The lane has been counting Aut(E) and
    ignoring the other factor 4.

    (B) THE WOULD-BE CEILING, AND WHY IT IS NOT THE CEILING. If all of Stab(B)
    acted usably on the prime-order subgroup G, a collision search on
    G/Stab(B) would run on N/(2|Aut|) classes and the birthday saving would be
    sqrt(2|Aut|) = sqrt(12) = 3.4641 at j = 0 and sqrt(8) = 2.8284 at j = 1728 -
    and sqrt(4) = 2 on EVERY curve, generic j included. The lane's stated
    ceiling is sqrt(6) = 2.4495. The gap is a factor sqrt(2) at j = 0 and a
    factor 2 at generic j, and closing it requires an argument, which is what
    follows.

    (C) TWO INDEPENDENT OBSTRUCTIONS, EITHER ONE SUFFICIENT, AND NEITHER IS
    ALREADY IN THE CORPUS FOR THIS OBJECT.
      OBSTRUCTION 1 - IRRATIONALITY. The translation by T = (e, 0) is
        F_p-rational if and only if e is in F_p, i.e. if and only if E has a
        rational point of order 2, i.e. if and only if #E(F_p) is even. In the
        standard ECDLP setting #E(F_p) = N is prime (cofactor 1), so
        E[2](F_p) = {O}, no non-identity element of V is defined over F_p, and
        the maps require F_{p^2} or F_{p^3} arithmetic to write down at all. On
        such curves the F_p-rational part of Stab(B) is exactly Aut(E)/{+-1},
        of order 1, 2 or 3, and the factor 4 does not exist over F_p.
      OBSTRUCTION 2 - COSET NON-PRESERVATION, WHICH BITES EVEN WHEN
        OBSTRUCTION 1 DOES NOT. Suppose the cofactor is even so that T is
        F_p-rational and translation by T costs O(1) field operations. Then
        translation maps G to the coset G + T. Since N is an odd prime and T has
        order 2, T is not in G, so G and G + T are DISJOINT: translation by T
        does not act on G at all, and a walk whose state space is G cannot use
        it. The map is cheap, rational, of degree 1, and simply not an operation
        on the object the ECDLP lives in.
      NOTE WHAT NEITHER OBSTRUCTION IS. It is not H-ENDO-001's scalar argument:
      translation by T is NOT an endomorphism (it does not fix O), so
      "every endomorphism acts as a scalar" does not apply to it and cannot
      close it. It is not IDEA-20260807-f00729's non-homomorphism of the orbit
      map either: f00729 closes objects whose transition is ADDITION OF TWO
      PROJECTED STATES, and Obstruction 2 kills translation before any addition
      is attempted, at the level of what the map does to the state space. THE
      LANE THEREFORE HAS A THIRD, INDEPENDENT OBSTRUCTION, and writing it down
      is the point of this record.

    (D) THE COMPLETE ACCOUNTING, AS A TABLE, WHICH IS THE DELIVERABLE.
      For each curve family, three group orders and one usable one:
        |Stab(B)| over F_pbar          = 2|Aut| = 4 / 8 / 12
        |Stab(B)| over F_p             = |E[2](F_p)| * |Aut|/2
        |{sigma in Stab(B) : sigma(x(G)) = x(G)}| = |Aut|/2 = 1 / 2 / 3
        resulting rho ceiling on G     = sqrt(|Aut|) = sqrt2 / 2 / sqrt6
      The first row is a function of j alone. The second depends on the
      2-torsion rationality, i.e. on the cofactor. The third is claimed to be
      EXACTLY Aut(E)/{+-1} on every curve with N an odd prime, by (C). The
      fourth is KN-TECH-018's recorded constant, now derived rather than
      quoted.

    (E) WHAT THIS CONTRIBUTES TO KN-OPEN-019. docs/inventor-protocol.md section
    1 records that this program has NO written enumeration of tracked objects
    for the ECDLP and that writing one is KN-OPEN-019. This record supplies one
    complete sub-enumeration: the cheap symmetries of the x-line of a
    prime-field curve are exactly E[2] semidirect (Aut/{+-1}), that group is
    finite of order at most 12, its order is a function of j, and the subgroup
    surviving to the prime-order subgroup is exactly Aut/{+-1}. It is a
    sub-enumeration and is labelled as one; it is not a taxonomy of ECDLP attack
    objects and does not claim to be.

    (F) THE ONE PLACE THE FACTOR 4 IS NOT CLOSED, NAMED HONESTLY. Index calculus
    and multi-target preprocessing use a factor base or table drawn from
    E(F_p), NOT from G. On a curve with rational 2-torsion, such a set CAN be
    taken V-stable, and a table indexed by x-line classes modulo V is 4 times
    smaller. IDEA-20260807-f00729's forward guidance G1 already flags
    table-based mechanisms as genuinely open because a table is queried by
    equality and never added. THIS RECORD DOES NOT CLOSE THAT and states the
    reason it is nevertheless unpromising: relation transport fails, because
    summing a relation over translated points gives
    sum(P_i + T) = sum(P_i) + mT, which is not zero, so a V-quotient buys table
    size but destroys relation validity - f00729's obstruction reappearing in a
    new instance. Anyone proposing the V-quotient factor base must address that
    identity first, and now does not have to rediscover it.

    (G) WHAT IS NOT CLAIMED. No attack, no exponent, no speedup. sota_delta is
    ZERO on every axis. The deliverable is a derivation, a table, and a cheap
    exact check.

  resource_label: >-
    R2 (the curve equation and model) and R1 (x-coordinates as field elements).
    The object is a group of Mobius transformations of the x-line; no
    endomorphism is applied to a point of G and no group-operation output is
    consumed.

  admissibility: admissible
  admissibility_argument: >-
    The object is a finite group of automorphisms of P^1 determined by the
    curve's branch locus. It is not a generic-group object: a generic group
    oracle exposes no branch locus and no x-coordinates, so KN-FIND-b7e091's
    closure of the incidence and endomorphism-image oracle classes does not
    reach it, and it consumes R1/R2 rather than R3. H-ENDO-001 is not applicable
    to translations at all, which is one of this record's points; it remains the
    admissibility filter for the Aut(E)/{+-1} part, where it is used and not
    retested. For criterion C3: NO NEW ORACLE IS INVENTED, so the RQ-GGMB-6eaabc
    audit applies vacuously and is recorded as such rather than left implicit.

  discriminated_from:
    - >-
      IDEA-20260807-f00729 (this lane), which closes mechanisms whose tracked
      object is the Aut(E)-orbit and whose transition is addition, by the r-fold
      branching of the orbit map. That record's group is Aut(E); this record's
      group is strictly larger (E[2] semidirect Aut/{+-1}), its obstruction acts
      at a different place (the state space, before any addition), and its
      generic-curve value is 4 rather than 1 - i.e. f00729's argument says
      nothing at all about a generic curve, where this one says the cheap x-line
      symmetry group has order 4 and none of it survives to G. Neither record
      implies the other.
    - >-
      H-ENDO-001, whose obstruction is that every endomorphism of a prime-order
      subgroup acts as a scalar. Translation by a 2-torsion point is not an
      endomorphism and is outside that argument entirely; this record supplies
      the argument that covers it. Stating that gap is part of the contribution,
      because a reader could otherwise assume H-ENDO-001 covers all cheap maps.
    - >-
      IDEA-20260807-5ddccf (this lane), the |Aut| scaling law across three curve
      families. That record measures how a cost functional scales with |Aut|;
      this one asks whether |Aut| is the right group to be scaling against and
      answers that the geometrically natural group is 2|Aut| while the usable
      one is |Aut|. If both run, 5ddccf's abscissa should be checked against
      this record's table before its scaling exponent is interpreted.
    - >-
      IDEA-20260807-a6fb2a (this lane), on the algebraic versus arithmetic size
      of j being level-blind. That record is about j as a NUMBER; this one is
      about j as the classifier of a cross-ratio orbit, which is the sense in
      which j is defined. Different objects, no overlap in argument.
    - >-
      IDEA-20260807-8b9486, which shows the summation polynomial's SUPPORT is a
      function of the bits (a = 0?, b = 0?) and degenerates only at j = 0 and
      j = 1728. That is a statement about the equation; this is a statement
      about the branch locus and its PGL_2 stabiliser. Both single out the same
      two j-values, for related but distinct reasons, and the record notes the
      coincidence rather than claiming it as independent confirmation.
    - >-
      IDEA-20260807-11b93d and IDEA-20260807-fd5a24 (norm-form gap / small
      discriminant escape), which are about D_0 and the CM norm form. This
      record is independent of D_0: the branch-locus stabiliser is determined by
      j, and j = 0 forces D_0 = -3 but small |D_0| does NOT enlarge Stab(B).
      That asymmetry - small |D_0| gives a cheap ENDOMORPHISM but no extra
      x-line SYMMETRY - is stated here explicitly and is the record's answer to
      the small-|D_0| clause of RQ-JINV-8fc13a.

  object_first_candidate:
    tracked_object: >-
      THE ORBIT OF x(P) UNDER Stab(B) - the branch-locus stabiliser acting on
      the x-line - rather than under Aut(E). This is a strictly larger group
      than the lane's current object and it is the geometrically canonical one:
      it is the full group of automorphisms of the x-line that lift to the
      curve.
    lossiness: >-
      LOSSY: discards log2|Stab(B)| = up to 3.58 bits, versus log2|Aut| = up to
      2.58 for the current object. It is a genuine projection: many x-values map
      to one Stab(B)-orbit and the orbit does not determine which. It is not a
      change of coordinates - recovering x from its Stab(B)-orbit requires
      naming the group element, which is exactly the discarded data.
    propagation: >-
      THIS IS WHERE IT FAILS, AND THE FAILURE IS THE FINDING, AND IT IS AT A
      DIFFERENT PLACE FROM f00729's. The retained part must propagate through
      the operation the target uses. For the Aut/{+-1} part the orbit propagates
      under the walk step exactly as the current object does. For the V part it
      does not propagate at all, because the V-action does not preserve G: the
      state leaves the state space on the first application. So the object is
      lossy in the right way but its group does not act on the right set, which
      is a THIRD distinct failure mode alongside "loses nothing" and "does not
      propagate through addition".
    survival_score: >-
      NOT genuinely new mathematics - the generic/harmonic/equianharmonic
      trichotomy and the group E[2] semidirect Aut/{+-1} are classical (see the
      novelty screen). CONCRETELY TESTABLE - |Stab(B)| and the subgroup
      preserving x(G) are exact finite computations on any toy curve, with
      predicted integer answers. SURVIVES exactly zero steps for the V-part on
      G, and as far as the current object for the Aut-part; the boundary is
      sharp and is an integer, not a threshold.

  mechanism: >-
    STEP 1 (ZERO COMPUTE - THE DERIVATION, AND IT IS THE DELIVERABLE). Write out
    (A) through (D): the injectivity of Stab(B) -> S_4; the always-present Klein
    group; the harmonic and equianharmonic enlargements and their identification
    with j = 1728 and j = 0 through the lambda-line formula; the structure
    Stab(B) = E[2] semidirect (Aut(E)/{+-1}); the explicit Mobius form of
    translation by a 2-torsion point (for y^2 = x(x^2 + ax + b) and T = (0,0),
    x(P + T) = b/x(P), an involution); the two obstructions; the four-row table.
    Nothing here needs a machine and none of it is conditional.

    STEP 2 (THE EXACT FINITE CHECK, MINUTES OF COMPUTE). On a frozen set of toy
    curves covering the three j-families and both 2-torsion rationality cases:
      (i) compute B, the cross-ratio lambda, and j; classify as generic,
          harmonic or equianharmonic;
      (ii) compute Stab(B) over F_p by brute force over the finitely many Mobius
          maps determined by their action on three points of B (at most 24
          candidates, each determined by where it sends three of the four points
          and then checked), and report |Stab(B) over F_p|;
      (iii) compute the F_pbar order by the same method over the splitting field
          of f, and check it equals 2|Aut| = 4, 8 or 12 as predicted by j;
      (iv) enumerate G, form the set x(G), and for EVERY sigma in Stab(B) over
          F_p test whether sigma(x(G)) = x(G) as a set. Report the order of the
          subgroup that does.
    PREDICTION, FIXED IN ADVANCE: row (iii) equals 2|Aut| exactly, determined by
    j alone; row (iv) equals |Aut|/2 exactly - 1 on a generic curve, 2 at
    j = 1728, 3 at j = 0 - on every curve with N an odd prime, INCLUDING the
    curves where the 2-torsion IS rational and row (ii) is therefore 4 times
    larger than row (iv).

    STEP 3 (THE DECISIVE CONTRAST, WHICH IS WHAT MAKES STEP 2 A TEST AND NOT A
    TAUTOLOGY). The curves with even cofactor and rational 2-torsion are the
    ones where Obstruction 1 does NOT apply and only Obstruction 2 does. On
    those curves rows (ii) and (iv) must differ by exactly the factor
    |E[2](F_p)|. If they do not - if some rational translation preserves x(G) -
    then Obstruction 2 is false, the ceiling rises from sqrt(|Aut|) to
    sqrt(|Aut| * |E[2](F_p)|), and GOAL-ENDO-001 pause condition P3 fires. That
    is the record's falsifier and it is checkable exactly, in one set
    comparison, on a curve small enough to enumerate.

    STEP 4 (FORWARD GUIDANCE). Name what remains open: (F)'s table-based
    mechanisms over E(F_p) rather than G, with the sum(P_i) + mT identity
    attached so the next session starts from the obstruction rather than from
    the idea; and the extension-field case, where Frobenius enlarges the group
    of cheap x-line maps and neither obstruction is re-derived here.

  novelty_status: unverified
  novelty_screen:
    method: >-
      Run 2026-08-11 from the repository root of this worktree.
      (1) mcp crypto-kb search_knowledge: UNAVAILABLE (index configured :memory:
          and empty, verified by the orchestrating session). Absence of a result
