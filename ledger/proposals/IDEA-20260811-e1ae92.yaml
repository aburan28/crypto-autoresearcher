  confounders:
    - >-
      A CURVE WITH N PRIME HAS NO RATIONAL 2-TORSION, SO OBSTRUCTIONS 1 AND 2
      ARE CONFOUNDED THERE. Any run using only cofactor-1 curves cannot tell
      which obstruction is doing the work. The even-cofactor arm is therefore
      NOT optional; it is the only place the two separate.
    - >-
      THE x-MAP'S BRANCH LOCUS INCLUDES THE POINT AT INFINITY, and an
      implementation working in affine coordinates will silently drop it,
      turning a 4-point set into a 3-point set whose stabiliser is S_3 of order
      6 - a wrong answer that looks plausible. The run must handle infinity
      explicitly and the C1 generic control (which must return 4, not 6) is what
      catches this.
    - >-
      CHARACTERISTIC 3 COLLAPSES j = 0 AND j = 1728 and characteristic 2 changes
      Aut entirely. p > 3 is a hypothesis, not a convenience.
    - >-
      j IS A FUNCTION OF THE CURVE, THE CROSS-RATIO IS A FUNCTION OF AN ORDERING
      OF THE ROOTS. lambda depends on which ordering is chosen and takes six
      values for one j; only its orbit is invariant. Reporting a single lambda
      without its orbit invites a spurious "the cross-ratio varies" observation.
    - >-
      THIS RECORD DOES NOT MEASURE ANY COST. It counts group elements. A larger
      usable group would raise a ceiling but the realised constant is
      IDEA-20260811-7a44a5's subject, and the two must not be conflated: a
      ceiling is not a measurement.

