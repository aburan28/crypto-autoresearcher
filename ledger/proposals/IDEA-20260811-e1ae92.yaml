    - >-
      F2 (THE DECISIVE EMPIRICAL FALSIFIER, AND IT IS CHEAP). On a curve with
      rational 2-torsion, some non-trivial sigma in Stab(B) over F_p satisfies
      sigma(x(G)) = x(G). Then the usable cheap symmetry group on G is larger
      than Aut(E)/{+-1}, the walk ceiling rises above sqrt(|Aut|), and
