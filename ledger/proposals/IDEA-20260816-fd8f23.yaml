idea:
  id: IDEA-20260816-fd8f23
  question_id: RQ-PMA-001
  added: '2026-08-16'
  title: Find and publish the exact exhaustion boundary for 4x4 principal-minor assignment over F_q
    by quotienting the enumeration by the diagonal-conjugation torus and transposition first, reporting
    the largest (n, q) actually completed and the projected cost of the first pair that fails
  class: tooling
  claim: '(A) The 4x4 case is exhaustible over F_3 and is not exhaustible over F_5 within any budget
    this program would grant, and the useful deliverable is the BOUNDARY stated as measured wall clock
    rather than as an assertion: 3^16 = 43046721 matrices versus 5^16 = 152587890625. (B) The boundary
    can be moved, not by more compute, but by quotienting the domain before enumerating: principal
    minors are invariant under A maps to D A D^{-1} for invertible diagonal D and under transposition,
    so the enumeration only needs one representative per orbit of a group of order (q-1)^(n-1) times
    2 acting on the matrix space, which is 16 at (n=4, q=3) and 128 at (n=4, q=5). Fixing the first
    row''s nonzero off-diagonal entries to 1 is a concrete and checkable orbit-representative normalisation.
    (C) The claim to be tested is quantitative and pre-committed: the normalised enumeration reduces
    the (n=4, q=3) matrix count by a factor of at least 8 and the (n=4, q=5) count by a factor of
    at least 32, and the resulting (n=4, q=5) cost is STILL above 4e9 representatives and therefore
    still outside budget -- so the boundary moves but does not cross q = 5. (D) What is NOT claimed:
    that the quotient is the best possible reduction, that any algebraic-geometry or symmetry technique
    beyond these two invariances has been considered, that a failure to exhaust at q = 5 says anything
    mathematical about PMA4 over F_5, or that any of this bears on k(t), which is infinite and where
    exhaustion is not a concept. A budget exhaustion is an infrastructure boundary and is never negative
    mathematical evidence (AGENTS.md rule 3). No attack, speedup or security consequence is claimed.
    (E) Also not claimed: that the boundary is a property of the problem. It is a property of this
    budget, this implementation and this machine class, and the record must say so on its face.'
  mechanism: 'Stage 1 implements the orbit-representative normalisation and PROVES it correct computationally
    rather than by assertion: for a sample of matrices, the normalisation map must be idempotent,
    must preserve the full 15-tuple of nonempty principal minors exactly, and must send every member
    of a randomly generated orbit to the same representative. Stage 2 measures the actual reduction
    factor by enumerating the representative set at (n=3, q=3), (n=3, q=5), (n=4, q=3) and comparing
    its size to q^(n^2). Stage 3 runs the full (n=4, q=3) representative enumeration to completion,
    accumulating the image of the 15-tuple map and the fiber histogram, with the same exact accounting
    identity as entry 1 -- the sum of orbit sizes over all representatives must equal q^16 exactly.
    Stage 4 does NOT attempt (n=4, q=5); it instead measures throughput (representatives per second)
    on a bounded random subsample and reports the projected wall clock, clearly labelled as a projection
    from a measured rate, never as a result. Stage 5 records the boundary as a table of (n, q, representative
    count, completed yes/no, measured or projected seconds). The claim is refuted if the normalisation
    is not minor-preserving, if the orbit accounting does not close, or if the measured reduction
    factors fall below the pre-committed 8 and 32.'
  novelty_status: unverified
  novelty_screen:
    method: 'Same screen as entry 1 of this bucket plus targeted greps over ledger/proposals/ and
      ledger/hypotheses/ for: diagonal conjugation, gauge orbit, orbit representative, exhaust, exhaustion
      boundary, canonical form, normalisation. Read experiments/EXP-PMA-001/specification.yaml in
      full for its declared grid caps and budget. Read ledger/hypotheses/H-PMA-001.yaml test_boundary
      block for the frozen budget numbers.'
    results: diagonal conjugation returns ZERO hits across ledger/proposals/ and ledger/hypotheses/.
      gauge orbit hits are all ECDLP isogeny-reachability records (IDEA-20260807-c36472, IDEA-20260811-bbcd68,
      IDEA-20260807-0ff796, IDEA-20260811-c72830, IDEA-20260811-7734c5, IDEA-20260807-692e9b) with
      no matrix content. exhaust hits (IDEA-20260815-528b6e, IDEA-20260808-51e40f, IDEA-20260815-ad4b55,
      IDEA-20260806-c5d183, IDEA-20260811-565915, IDEA-20260727-006) are all Groebner, factor-base
      or search-space records in other areas. H-PMA-001 declares a total budget of 1.75 CPU hours
      and a grid_instance_cap of 60, which is a per-instance budget and contains no enumeration cost
      model at all; the frozen contract therefore has no exhaustion boundary anywhere in it.
    verdict: 'UNVERIFIED. Nothing is asserted about literature outside this repository. Claimed new
      inside it: the exhaustion boundary as a stated, measured deliverable, and the orbit-quotient
      normalisation as the lever that moves it, neither of which appears in any record. Assembled
      from known parts: the invariance of principal minors under diagonal conjugation and transpose
      is elementary and is implicitly relied on by IDEA-20260726-012''s use of anchored gauge choices;
      the idea of reporting an infrastructure boundary rather than a null result is AGENTS.md rule
      3 applied deliberately rather than defensively.'
  object_first_candidate:
    tracked_object: The ORBIT of a matrix under the group G = (diagonal torus acting by conjugation)
      semidirect (transposition), followed as a normalised representative plus an orbit size. What
      propagates through the computation is the pair (representative, |orbit|), and the enumeration
      walks representatives only.
    lossiness: 'Lossy by exactly the orbit size and nothing else, which is the cleanest possible instance
      of the lossy-projection test: the discarded information is precisely the group coordinate, of
      size at most (q-1)^(n-1) times 2, and it is discarded compatibly with the target operation because
      principal minors are constant on orbits by construction. The projection therefore loses (n-1)
      log(q-1) + 1 bits per matrix and retains everything the principal-minor map can see. Crucially,
      this is a MUCH smaller loss than entry 1''s projection to the minor tuple: here the fibers of
      the projection are exactly the orbits, whereas the minor map has fibers strictly larger than
      orbits whenever two inequivalent matrices share a table. The gap between orbit size and fiber
      size is itself a measured quantity here.'
    propagation: 'One step of the target operation is extending a partial matrix by one more entry
      during the enumeration. Under the normalisation, entries in the first row (off-diagonal, nonzero)
      are forced to 1, so a step in those positions is a no-op on the representative and the orbit
      size divides accordingly; a step in any other position is free. The propagation rule is therefore
      explicit: the representative set is a product of forced coordinates and free coordinates, and
      its size is computable in closed form before any enumeration runs, which is what makes the projected
      cost checkable.'
    survival_score: 'The structure survives to exactly the pair (n=4, q=3): 43046721 divided by at
      least 8 gives at most 5.4e6 representatives, comfortably enumerable. It dissolves at (n=4, q=5):
      1.526e11 divided by at most 128 is still at least 1.19e9 representatives, above the budget stated
      here. At (n=5, q=3) it dissolves outright: 3^25 = 8.47e11 divided by 32 is 2.6e10. The boundary
      is therefore between (4,3) and (4,5), and the deliverable is to pin it with measured throughput
      rather than with these arithmetic estimates.'
  null_object_control: 'The identical normalisation and identical orbit accounting are applied to
    a null object of the same shape: matrices over F_q equipped with a RANDOM group action of the
    same order, namely a fixed random permutation action of a group of order (q-1)^(n-1) times 2 on
    the matrix space, drawn once from a declared seed. The null must show that the orbit accounting
    closes (any correct group action does) but that the representative set has NO reduction advantage
    for the minor map -- specifically, the null''s representatives must not collapse the minor-tuple
    image at all, whereas the signal arm''s representatives must reproduce the full image with strictly
    fewer enumerated points. If the null arm also reproduces the full minor image from its representatives,
    then the reduction is an accounting trick with no relation to principal minors and the record
    says so.'
  discriminated_from:
  - 'Entry 1 of this bucket (the n = 3 complete census): that entry enumerates the FULL domain and
    its object is the fiber of the minor map. This entry enumerates a QUOTIENT and its object is the
    orbit; the two differ in what is stored and in which of them can reach n = 4 at all.'
  - 'IDEA-20260726-012: a symbolic square-class certificate over k(t) with no enumeration anywhere.
    Exhaustion is not a concept over an infinite field, and this entry makes no square-class computation.'
  - 'EXP-PMA-001''s grid_instance_cap of 60 and 1.75 CPU hours: that is a per-instance decision budget
    over k(t) for 60 prescribed tables; this entry has no prescribed tables and no per-instance decisions,
    and its budget model is representatives per second.'
  - 'Generic brute-force with symmetry reduction as a solving technique: nothing is solved. The output
    is a boundary table plus a completed image at one (n, q), which is a measurement about feasibility.'
  - 'The ECDLP gauge-orbit reachability records: those measure whether a specified isogeny class member
    can be transported at a cost; the group, the object and the question share only the word orbit.'
  assumptions:
  - Principal minors are exactly invariant under A maps to D A D^{-1} for invertible diagonal D and
    under transposition; this is asserted as elementary and is CHECKED computationally in stage 1
    rather than assumed.
  - The first-row normalisation reaches a unique representative per orbit for matrices whose relevant
    first-row off-diagonal entries are nonzero; matrices where it does not are branched into a declared
    exceptional class and enumerated without normalisation, with their count reported.
  - Throughput measured on a random subsample of the (n=4, q=5) representative space is representative
    of the whole, which is a projection assumption and is labelled as such wherever the projected
    cost appears.
  - Wall clock on this machine class is a valid budget proxy for feasibility; single-machine timing
    is used here only to state a boundary and never as a comparative performance claim, so it does
    not enter the territory of the program's cost-model audits.
  predictions:
  - metric: reduction_factor_n4_q3
    direction: higher
    minimum_effect: at least 8, i.e. representative count at most 43046721 / 8 = 5380840.125, rounded
      up to 5380841
  - metric: reduction_factor_n4_q5
    direction: higher
    minimum_effect: at least 32 measured on the closed-form representative count
  - metric: orbit_sum_accounting_residual
    direction: lower
    minimum_effect: exactly 0 -- the sum of orbit sizes over representatives plus the exceptional
      class must equal q^(n^2) exactly
  - metric: projected_n4_q5_representative_count
    direction: higher
    minimum_effect: at least 1e9, i.e. the boundary does NOT cross q = 5 under this reduction; a projected
      count below 1e9 falsifies the pre-committed boundary placement
  - metric: minor_preservation_violations_under_normalisation
    direction: lower
    minimum_effect: exactly 0 across 10^5 sampled matrices
  minimal_test:
    design: 'Run stages 1 and 2 only, at (n=3, q=3) and (n=3, q=5), for a total of 19683 plus 1953125
      matrices, seconds of compute. That already discriminates everything structural: whether the
      normalisation is idempotent and minor-preserving, whether the orbit accounting closes exactly,
      whether the measured reduction factor matches the closed-form prediction (q-1)^(n-1) times 2
      on the free locus, and how large the exceptional non-free class is. If the reduction factor
      at n = 3 falls short of its closed-form value by more than the exceptional-class fraction, the
      normalisation is wrong and no n = 4 run should be authorised. Only then does (n=4, q=3) run,
      and the (n=4, q=5) arm is never run at all -- it is a measured-throughput projection by design,
      because running it is precisely what the entry claims is infeasible. The cheapest discriminating
      measurement is therefore the pair (reduction factor at n=3, orbit accounting residual at n=3),
      costing under a minute.'
    controls:
    - 'Idempotence control: normalise(normalise(A)) equals normalise(A) for 10^5 sampled matrices
      per (n, q).'
    - 'Minor-preservation control: the 2^n minus 1 nonempty principal minors of A and of normalise(A)
      agree exactly for 10^5 sampled matrices.'
    - 'Orbit-closure control: for 10^3 sampled matrices, every element of the explicitly generated
      orbit normalises to the identical representative.'
    - 'Accounting control: sum of orbit sizes over representatives plus the exceptional class equals
      q^(n^2) exactly.'
    - 'Null-arm control: identical normalisation machinery driven by a random group action of the
      same order, run in the same invocation, must close its accounting and must NOT reproduce the
      minor image from a reduced set.'
    - 'Exceptional-class control: matrices where the normalisation is not free are enumerated separately
      and their count is reported, never folded into the reduction factor.'
    required_metrics:
    - representative count per (n, q), measured and in closed form
    - reduction_factor per (n, q) equal to q^(n^2) divided by representative count
    - orbit_sum_accounting_residual per (n, q)
    - exceptional (non-free) class size per (n, q)
    - measured throughput in representatives per second per (n, q)
    - projected wall clock for (n=4, q=5), explicitly labelled a projection
    - minor_preservation_violations and idempotence_violations
    - completed image cardinality of the 15-tuple map at (n=4, q=3)
  falsification_conditions:
  - 'Any minor-preservation violation under normalisation: the normalisation is not a PMA symmetry
    and the entire reduction is void.'
  - Any idempotence violation or any orbit member normalising to a different representative.
  - Nonzero orbit-sum accounting residual at any (n, q).
  - 'Measured reduction factor at (n=4, q=3) below 8, or closed-form reduction at (n=4, q=5) below
    32: the pre-committed quantitative claim fails.'
  - 'Projected (n=4, q=5) representative count below 1e9: the boundary placement was wrong and the
    record must say the boundary crosses q = 5, which would be a more useful outcome than the predicted
    one.'
  - 'The null arm reproduces the full minor image from a reduced representative set: the reduction
    is an accounting artifact unrelated to principal minors.'
  confounders:
  - Wall clock on one machine conflates implementation quality with feasibility; a slow implementation
    can manufacture a boundary. The record must report representatives per second and the closed-form
    count separately so a later reader can re-place the boundary against a better implementation.
  - The exceptional non-free class can be large at small q (at q = 3 the torus has order 2 per coordinate),
    inflating the apparent reduction if silently merged.
  - Memory rather than time may be the binding constraint at (n=4, q=3) if the full image set is materialised;
    the two must be reported separately so the boundary is attributed to the right resource.
  - Subsample throughput for the q = 5 projection may be unrepresentative if the representative space
    has structurally cheaper regions; the subsample must be drawn uniformly over the representative
    index space and the variance reported.
  - Transposition and diagonal conjugation do not generate a free action everywhere, so (q-1)^(n-1)
    times 2 is an upper bound on orbit size, not a constant; treating it as constant would overstate
    the reduction.
  interpretation_limits:
  - A boundary is a fact about this budget, this implementation and this machine class, not about
    the problem. It must never be read as a statement that PMA4 over F_5 is hard.
  - A failure to complete an enumeration is an infrastructure outcome under AGENTS.md rule 3 and is
    not negative mathematical evidence about principal-minor assignment.
  - Nothing here transfers to k(t), which is infinite; RQ-PMA-001's actual scope is untouched by any
    exhaustion statement.
  - The projected (n=4, q=5) cost is an extrapolation from a measured rate and carries the variance
    of that measurement; it is not a run.
  target_complexity:
    time_exponent: No attack exponent is claimed. The enumeration cost is q^(n^2) divided by the orbit
      size, i.e. approximately q^(n^2 - n + 1) / 2 representatives, stated as an enumeration cost
      model for a toy algebraic census and not as a cryptanalytic complexity.
    memory_exponent: No attack exponent is claimed. Peak storage is bounded by the image indicator
      over q^(2^n - 1) tuples, which is 3^15 = 14348907 bits at (n=4, q=3), plus a representative-count
      accumulator.
    best_known: The incumbent is the unreduced enumeration, i.e. q^(n^2) matrices, which is what a
      naive implementation of module B of experiments/EXP-PMA-001/specification.yaml would cost if
      asked to census rather than to decide. There is no other enumeration cost model recorded anywhere
      in this repository to compare against.
    hidden_overhead: 'The normalisation itself costs work per matrix, so a reduction factor of 8 in
      count is not a factor of 8 in wall clock; the record must report both. Human cost hides in the
      exceptional-class bookkeeping, which is where a wrong reduction factor would be laundered. Also
      hidden: the projection to (n=4, q=5) invites a later reader to treat the boundary as movable
      by hardware, when the gap is three orders of magnitude.'
  dominated_by: 'n/a (no result claimed). Checked explicitly against every cost axis: this entry claims
    no time, memory, or data/query point on any cryptanalytic frontier and produces no source-to-scalar
    candidate, so no frontier row applies. Within this repository the only comparable cost model is
    the unreduced enumeration, which this entry strictly improves on by the measured reduction factor
    -- that is an internal engineering comparison, not a Pareto claim.'
  sota_delta: 'no attack; conceptual/measurement contribution only. Quantitatively: at (n=4, q=3)
    the reduction is predicted to take 43046721 enumerated points down to at most 5380841, a factor
    of at least 8; at (n=4, q=5) it is predicted to take 152587890625 down to at least 1.19e9, which
    remains infeasible under the declared budget. Both numbers are counts, not speedups against any
    published method.'
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part A (normalisation is minor-preserving and idempotent, accounting
    closes at n = 3): 0.9 -- elementary and directly checked, with implementation bugs the only real
    risk. Part B (measured reduction factor at (n=4, q=3) reaches 8): 0.7 -- the exceptional non-free
    class at q = 3 is proportionally large because the torus is tiny, and this is the single most
    likely place the pre-committed number fails. Part C ((n=4, q=3) enumeration completes within budget):
    0.75 -- 5.4e6 representatives times 15 exact minors is comfortable in numpy but the image materialisation
    is where memory could bind. Part D (the boundary does NOT cross q = 5, i.e. projected count at
    least 1e9): 0.9 -- this follows from arithmetic I can check by hand, and would only fail if a
    much stronger reduction than the two invariances exists, which I have not looked for and do not
    claim does not exist. Part E (the null arm cleanly separates): 0.6 -- a random group action of
    the same order will close its accounting trivially, and whether it fails to reproduce the minor
    image depends on details of the action that the Coordinator still has to fix.'
