      general survey material, none of which measures or derives a multi-target amortisation
      exponent for the hash arm of SelfTargetMSIS. The retrieved IETF security-considerations
      draft was checked directly for this: it discusses EUF-CMA and says nothing about
      per-key versus per-target claims - i.e. the question this record asks is not answered in
      the document practitioners are pointed at.
      INSIDE THE REPOSITORY, after the second pass, the picture is unchanged in its conclusion
      and completely changed in its evidence. THE NEAREST INTERNAL RECORD IS
      IDEA-20260808-c1abd1, and its adjacency is now stated precisely instead of loosely: it
      DOES track an amortisation, in its own words "steps (ii) across many candidate c share
      ONE lattice, so one BKZ reduction is amortised over L decodings", and it even carries a
      null in which "each candidate c requires its OWN reduction (no shared lattice); g must
      become 0. That isolates amortisation as the mechanism rather than the arithmetic." That
      is a shared-LATTICE amortisation over CANDIDATE CHALLENGES inside ONE key, dialled by L.
      This record's is a shared-SPONGE-PREFIX amortisation over INDEPENDENT TARGETS, dialled by
      N. The dials are different, the shared object is different, and neither exponent is
      computable from the other - but a reviewer should read c1abd1 first, because it is the
      record whose method this one most resembles. IDEA-20260805-5194f9 compares the two arms
      at fixed N = 1 and argues the lattice-versus-hash ordering is convention-dependent.
