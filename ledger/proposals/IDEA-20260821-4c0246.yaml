idea:
  id: IDEA-20260821-4c0246
  question_id: RQ-MLDSA-001
  added: '2026-08-21'
  title: >-
    Measure the multi-target amortisation exponent alpha of SelfTargetMSIS's hash arm by
    running it to completion against N simultaneous keys at reduced parameters where a
    forgery is certifiable. The tracked object is the SHARED SHAKE ABSORB PREFIX: a
    generic multi-target preimage search has alpha = 1 exactly because one squeeze scores
    against all N targets, and ML-DSA's c-tilde = H(mu || w1) puts per-target material
    (mu carries tr = H(pk); w1 carries A and t) FIRST, so the shared prefix is empty and
    alpha = 0 - a derivable integer (prefix length in bytes) and a measurable exponent
    that must agree.
  class: algorithm
  claim: >-
    (A) THE RESOURCE AXIS NOBODY IN THIS LANE HAS TURNED. All seven pre-existing
    RQ-MLDSA-001 proposals, and all ten proposals of the sibling question RQ-MLDSA-ffa0f5,
    cost SelfTargetMSIS against ONE public key. FIPS 204's category claim is
    stated per key; a deployment has many. Define W(N) = the expected number of hash
    evaluations to produce a valid forgery against ANY of N independently generated ML-DSA
    public keys by the hash arm, and define alpha by W(N) proportional to N^{-alpha}.
    (B) THE DERIVATION, WHICH COSTS NO COMPUTE. A hash evaluation can be scored against more
    than one target only if some prefix of its input is target-independent, so that one
    sponge absorb state serves many targets and the per-target marginal cost falls to a table
    lookup - which is exactly why generic multi-target preimage search over N targets has
    alpha = 1. In ML-DSA the commitment hash is c-tilde = H(mu || w1) with mu = H(tr || M),
    tr = H(pk), and w1 = HighBits(A y - c t); both operands are functions of the target's own
    public key, and the per-target material occupies the FIRST absorbed bytes. THE SHARED
    ABSORB PREFIX IS THEREFORE ZERO BYTES LONG, and that length is an integer readable off
    the algorithm's line ordering, not a probabilistic claim. PREDICTION: alpha = 0 within
    measurement error.
    (C) WHY MEASURE SOMETHING PREDICTED TO BE ZERO. Because the prediction is exactly the
    assumption the standard's per-target cost accounting silently makes, because a measured
    alpha strictly above 0 would mean an unnoticed batching structure and would make the
    published hash-arm figure optimistic by a factor N at deployment scale, and because the
    instrument is validated by a control whose alpha is FORCED to 1. Discrimination is
    therefore sharp and three-way: alpha = 0 confirms the tr/w1 binding is load-bearing and
    prices it (the same experiment, run on a mu-without-tr variant, says by how much);
    0 < alpha < 1 localises a partial batching structure; alpha = 1 would mean the binding is
    not doing the job the derivation assigns it.
    (D) THE SECOND, DERIVED-ONLY HALF, STATED SO IT IS NOT SILENTLY ASSUMED. The lattice arm
    is NOT measured here. Its amortisation question is: does solving one of N independent
    MSIS instances cost less than N^0 times solving one? Because A is expanded from a
    per-key 32-byte seed rho, the N instances share no lattice, and this record ASSERTS
    NOTHING about the lattice arm's alpha beyond recording that no shared structure was
    identified and that the question is open. If the lattice arm did amortise and the hash
    arm did not, the binding-arm identity would move with N - which is the reason the axis
    matters and is the successor question this record names.
    (E) WHAT IS NOT CLAIMED. No forgery against FIPS 204 parameters, no attack, no exponent
    improvement against any published algorithm. Toy-tier only: the whole design depends on
    choosing tau and n so the challenge space is exhaustible, which FIPS 204's is not by
    roughly 150 orders of magnitude.
  mechanism: >-
    STAGE 0, THE PREFIX AUDIT (no compute). Write out, for FIPS 204's commitment hash and
    for the reduced-parameter surrogate, the exact byte sequence absorbed before the first
    target-dependent byte. Report that integer. If it is non-zero for the surrogate but zero
    for FIPS 204, the surrogate is mis-specified and is fixed before any run.
    STAGE 1, INSTRUMENT. Implement reduced-parameter ML-DSA with tau and n chosen so that
    log2|B_tau| is between 22 and 26, i.e. the hash arm is exhaustible in minutes. Implement
    the hash-arm forger: repeatedly draw (y, c), compute w1 = HighBits(A y - c t) for a chosen
    target, compute c-tilde' = H(mu || w1), and accept when SampleInBall(c-tilde') equals c
    and the norm predicates hold. Every accepted output is emitted as a FORGERY CERTIFICATE
    and independently re-verified by a separate verifier implementation, per
    docs/claims-and-verification.md.
    STAGE 2, THE N-LADDER. For N in {1, 2, 4, 16, 64, 256, 1024}, run the best batched forger
    the implementer can write - explicitly including the attempt to reuse work across targets
    (shared y, shared c, shared sponge state, sorted table of target-derived values) - and
    record the total number of hash evaluations and the total wall time to the first accepted
    forgery, over >= 30 independent repetitions per N. Fit alpha by regression of log W against
    log N and report the fit with its interval.
    STAGE 3, THE FORCED-ONE CONTROL. Run the identical harness on a generic multi-target
    preimage problem: given N random 2*lambda'-bit targets, find x with H(x) equal to any of
    them, using the same sorted-table machinery. Its alpha is exactly 1 by construction, so it
    is the sensitivity demonstration with a numeric threshold declared before the run (fitted
    alpha in [0.9, 1.1]); if the harness cannot recover alpha = 1 there, no alpha it reports
    elsewhere means anything.
    STAGE 4, THE PRICING VARIANT. Repeat stage 2 on a MODIFIED surrogate in which mu is a
    global constant (tr binding removed) AND all N keys share one matrix A, so that the
    absorbed prefix before the first target-dependent byte is maximised. This measures what
    the tr/w1 binding is WORTH on this axis, in fitted alpha and in bytes of shared prefix,
    rather than asserting that it is worth something.
  novelty_status: unverified
  novelty_screen:
    method: >-
