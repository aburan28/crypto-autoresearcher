      multi-target attack theory (Biham-style batch key search; Chatterjee-Menezes-Sarkar and
      the multi-user Fiat-Shamir literature) is recalled, not read, this session. It is
      entirely possible that alpha = 0 for ML-DSA's hash arm is folklore stated somewhere in
      the Dilithium documentation; the derivation here is elementary and this record does not
      claim it as new mathematics. Claimed NEW: the shared-absorb-prefix formulation as a
      tracked object, the forced-alpha = 1 control that licenses the instrument, and the
      measurement of the exponent to completion at a scale where forgeries carry
      certificates. ASSEMBLED FROM KNOWN PARTS: multi-target preimage batching is textbook;
      the pricing-variant idea is the standard "remove the binding and see" ablation.
  object_first_candidate:
    tracked_object: >-
      The SHARED SPONGE ABSORB PREFIX of the commitment hash across N simultaneous targets:
      the SHAKE state reached after absorbing every input byte that is common to all targets,
      followed through one attack trial from the choice of (y, c) to the accept/reject
      decision. Equivalently, the bipartite incidence between one unit of hash work and the
      set of targets that unit can score against.
    lossiness: >-
      GENUINELY LOSSY, and the discard is exactly what makes it propagate. The projection
      sends the full trial state (y, c, w1, mu, c-tilde', the accept bit) to a single sponge
      state plus a residual byte count. It discards the entire algebraic content of the
      trial: from the shared prefix state one cannot recover y, c, w1, or which target was
      being attacked. It is not a change of coordinates - the fibre of the projection is the
      whole set of trials sharing that prefix, which is every trial when the prefix is empty.
      The discard is compatible with the target's operations because sponge absorption is a
      deterministic state machine: the shared-prefix state is precisely the part of the
      computation that a batching adversary is permitted to compute once and reuse, and
      everything discarded is precisely the part it must recompute per target.
    propagation: >-
      One step is one absorbed block. The propagation law is: prefix state P_i after block i
      remains shared iff block i is identical across all N targets. The measurement therefore
      has an exact one-step observable - the number of leading blocks that are target-common -
      and an exact prediction from it: alpha = 1 when the target-specific material is confined
      to a suffix that can be enumerated once and matched by table lookup, alpha = 0 when the
      target-specific material occupies the first block. FIPS 204 places mu first, so the
      one-step observable is zero blocks.
    survival_score: >-
      Zero steps in ML-DSA and full-length in the control. That contrast IS the result: the
      object survives the entire computation of a generic multi-target preimage search (where
      the target enters only at the comparison, after all hashing) and dissolves at the very
      first absorbed block of ML-DSA's commitment hash. The proposal reports the surviving
      prefix length in bytes for both, alongside the fitted alpha for both, and the two must
      agree; a byte count of zero with a fitted alpha near 1, or vice versa, falsifies the
      whole framing rather than the scheme.
  null_object_control: >-
    THE FORCED-ONE CONTROL, and it can fail. The identical harness, the identical table
    machinery, the identical timing instrumentation, run on generic multi-target preimage
    search over N random targets, whose amortisation exponent is exactly 1 by construction
    (one squeeze, N-way sorted-table comparison). Declared before the run: the fitted alpha
    there must land in [0.9, 1.1] at every N on the ladder, against the spread of the same
    30-repetition ensemble used for the headline. If it does not, the harness cannot detect
    amortisation and reports no alpha at all. FORCED-VALUE DERIVATION for the headline arm,
    also declared before the run: alpha = 0 exactly, because the shared prefix is zero bytes.
    Note carefully that this makes the headline arm a case where the EXPECTED answer is the
    null value - which is why the forced-one control is mandatory rather than decorative, and
    why the pricing variant (stage 4) exists: without a second arm whose alpha is expected to
    MOVE, the experiment would only be able to confirm a constant. The stage-4 arm is that
    second arm, and if it too returns alpha = 0 the framing is wrong. COMPARATOR REPLICATION:
    the 30-repetition ensemble at each N is drawn as an ensemble and reported as an interval,
    never as a point (KN-TECH-1a5b7e mode 5).
  discriminated_from:
  - >-
    IDEA-20260808-c1abd1 IS THE NEAREST INTERNAL RECORD and the first screen underweighted it.
    It treats SelfTargetMSIS as a claw between L lattice decodings and Q_H hash queries inside
    ONE fixed lattice for ONE key, argues the honest cost is max(C_reduce, |B_tau|), and it
    explicitly tracks an AMORTISATION - "one BKZ reduction is amortised over L decodings" -
    with a null that forces the amortisation gain to 0 by giving each candidate its own
    reduction. So the two records share a method shape and even share the word. WHAT DIFFERS:
    the SHARED OBJECT (one lattice, reused across candidate challenges, versus one sponge
    absorb state, reused across independent public keys) and the DIAL (L, the work split at
    N = 1, versus N, the number of targets at fixed work split). Neither exponent determines
    the other: c1abd1's gain is about reduction reuse inside a key and vanishes if each
    candidate needs its own lattice; this record's is about absorb-state reuse across keys and
    vanishes if the first absorbed block is target-dependent, which is what the derivation says
    it is. A reviewer should read c1abd1 before this record.
  - >-
    IDEA-20260805-5194f9 shows the two SelfTargetMSIS arms are incommensurable and that the
    lattice-versus-hash ordering can flip under a monotone cost-model change, at fixed single
    target. This record holds the cost model fixed and turns a different dial, N, which
    5194f9 does not mention; the two are compatible and the results compose, since an
    alpha > 0 would be exactly a monotone-in-N shift of the hash arm.
  - >-
    IDEA-20260801-008 (metrical audit of module dimension and hash-to-ring mapping) is a
    re-derivation of the published per-target estimate. This record takes that per-target
    estimate as given and asks only whether it multiplies by N.
  - >-
    THE TEN PROPOSALS OF THE SIBLING QUESTION RQ-MLDSA-ffa0f5, screened as a set on 2026-08-24
    because the first screen never opened them. IDEA-20260808-4f83f6 partitions the four
    Algorithm 7 rejection gates into public and secret; IDEA-20260805-bb52fa proves
    ||c t0||_inf <= tau*2^(d-1) and settles reachability per parameter set;
    IDEA-20260805-630606 derives the 34 / 60 / 58 hint-channel signature floor;
    IDEA-20260805-031ce2 censuses the Algorithm 7 predicates; IDEA-20260821-6d1b97 measures the
    ML-DSA-44 ct0 rate by challenge tilting. ALL FIVE, AND THE OTHER FIVE, LIVE AT N = 1 AND
    CONSUME SIGNATURES OR PREDICATES; none defines W(N), none holds a second public key, and
    none is on this record's axis. They are named here so that a reviewer can check the claim
    rather than take it.
  - >-
    THE SEVEN COMMITTED EXPERIMENT SPECIFICATIONS experiments/EXP-MLDSA-{1c66ac, 15866e,
    2b6f17, 462ea2, 3f7ab2, 8c8fa2, a8d531}/specification.yaml, of which 2b6f17, 3f7ab2 and
    a8d531 carry committed run records. Two are fault-model placement, one is the
    SelfTargetMSIS margin re-derivation at academic parameters, one is a calibrate-first
    lattice audit, one derives a faulty-signature bracket, one censuses Algorithm 7 and one
    computes the t0 hint-channel floor. NONE instruments a second key or measures a scaling in
    the number of targets, so none of them re-runs any part of this design - and this record's
    stage-1 forger is not a re-execution of any of their protocols.
  - >-
    THE SEVEN H-MLDSA-* HYPOTHESIS BODIES, read in full on 2026-08-24: c7b4e8, acac6d, 2d4123,
    12f563, 2ae88d, d1e509, f3a291. A targeted grep of all seven for "multi-target|multi-user|
    amortis|N targets|N public keys|sponge|shared prefix" returns NO MATCH IN ANY OF THEM.
    H-MLDSA-d1e509, the CMA-to-NMA tightness hypothesis, is the closest in subject matter and
    is at status `specified`; it concerns a reduction factor at one key and says nothing about
    target count.
  - >-
    Multi-signature and threshold-ML-DSA results (ePrint 2025/2198; the threshold ML-DSA
    conference paper) concern several signers holding shares of ONE key or co-signing. This
    record concerns independent keys and a forger holding none of them.
  - >-
    ePrint 2024/1373 recovers t0 from many signatures under ONE key. Different axis entirely
    (Q_S, not N) and a different secret; that axis is IDEA-20260821-4d4e5f's, and inside this
    program it is already floored by IDEA-20260805-630606 and EXP-MLDSA-8c8fa2.
