    verified_by: 'idea-generator@2026-08-21 (read in repository); re-read in full 2026-08-24'
  - ref: 'docs/claims-and-verification.md'
    provenance: internal
    claim: >-
      Any claimed solve or relation carries a certificate the run wrapper re-verifies
      independently. Every accepted forgery in this design is emitted as such a certificate.
    verified_by: 'idea-generator@2026-08-21 (referenced; claim-tier discipline applied)'
  assumptions:
  - >-
    A reduced parameter set exists with log2|B_tau| in [22, 26] that retains the four
    rejection gates, the beta = tau*eta relation, and the mu = H(tr || M) / c-tilde =
    H(mu || w1) input ordering. If IDEA-20260821-5bbea6's grid search finds no such set that
    also preserves the arm ratio, this record still runs - its claim is about the INPUT
    ORDERING of a hash, which is preserved by construction - but the transfer of any RATIO
    between arms is then explicitly forfeited.
  - >-
    The implementer genuinely attempts the batched forger rather than a per-target loop. A
    measured alpha = 0 from an unbatched implementation is worthless. The protocol therefore
    requires the stage-3 control to be written FIRST, in the same harness, and to reach
    alpha = 1 before any headline arm is run.
  - >-
    Hash evaluations, not wall time, are the primary cost unit; wall time is recorded
    alongside as a secondary metric because table lookups at N = 1024 are not free.
  - >-
    The N public keys are generated independently with independent rho, matching FIPS 204
    key generation.
  proof_search_map:
    bottleneck: >-
      The per-target marginal cost of one hash evaluation in a batched hash-arm attack: the
      step whose removal (by making one evaluation score against all N targets) would change
      the cost from N^0 to N^{-1}.
    baseline_embedding:
      parameter_slice: >-
        N = 1 must reproduce the single-target hash-arm cost |B_tau| exactly, in hash
        evaluations, at the reduced parameters.
      reproduction_check: >-
        Frozen regression fixture: at the reduced parameters the mean number of hash
        evaluations to a certified forgery at N = 1 must equal 2^{log2|B_tau|} within the
        30-repetition interval, with |B_tau| recomputed from (n, tau) in the fixture rather
        than read from any prior record. A curve that merely looks flat is not a
        reproduction.
    observation_collision:
      observable: >-
        The fitted exponent alpha in W(N) proportional to N^{-alpha}, together with the
        derived shared-absorb-prefix length in bytes.
      distinct_preimage_search: >-
        Two distinct ground-truth situations can give alpha = 0: (i) no batching structure
        exists (the intended conclusion), and (ii) batching structure exists but the
        implementer did not find it. These are OBSERVATIONALLY IDENTICAL and the experiment
        cannot separate them - this is a real identifiability failure and it is why the
        prefix-length derivation is reported beside the exponent and why the stage-4 pricing
        variant is mandatory. The additional condition that separates them is the byte count:
        alpha = 0 with a zero-byte shared prefix is consistent with (i); alpha = 0 with a
        LARGE shared prefix in the stage-4 variant indicates (ii) and voids the headline.
    constructive_transforms:
    - transform: representation_reduction
      proposed_object: >-
        The shared sponge absorb prefix, moving the question "does the hash arm amortise" into
        the model "is there a non-empty target-common input prefix", where the hypothesis is an
        exact equality of byte strings rather than a probabilistic claim.
      predicted_gain: >-
        Converts an unbounded search over attack strategies into a finite, checkable integer
        (prefix length) plus one measured exponent. Predicted gain is DIAGNOSTIC, not
        computational: no speedup is claimed.
    quantifier_order: >-
      FOR ALL reduced parameter sets in the declared family, FOR ALL N on the declared ladder,
      THERE EXISTS no batched hash-arm forger in the declared strategy class whose expected
      hash-evaluation count is below (1/2) * |B_tau| - i.e. the existential is over
      IMPLEMENTED strategies in a NAMED class, not over all algorithms. The claim is
      deliberately not uniform over all adversaries and must never be restated as if it were.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Within the declared strategy class and at the reduced parameters, the measured
        amortisation exponent of the hash arm is alpha, with interval [a, b], while the same
        harness recovers alpha = 1 on a problem where it is forced." Nothing about FIPS 204
        parameters, and nothing about strategies outside the class.
      nearby_object_control: >-
        The stage-4 variant with tr removed and A shared is the nearby object on which the
        hoped-for conclusion (alpha = 0) is expected to FAIL. A method that returns alpha = 0
        for both has not identified the load-bearing structure and its headline is withdrawn.
    proof_obligations:
    - claim: 'The shared absorb prefix of c-tilde = H(mu || w1) across independently generated keys is zero bytes.'
      responsibility: correctness
    - claim: 'At N = 1 the harness reproduces |B_tau| expected hash evaluations to a certified forgery.'
      responsibility: baseline
    - claim: 'The harness recovers alpha = 1 on generic multi-target preimage search within [0.9, 1.1].'
      responsibility: feasibility
    - claim: 'Every accepted forgery verifies under an independent verifier implementation.'
      responsibility: correctness
    - claim: 'The 30-repetition ensemble at each N is reported as an interval, not a point.'
      responsibility: success_probability
    - claim: 'No statement about FIPS 204 parameters follows from any reduced-parameter result.'
      responsibility: scope
    not_applicable_reason: null
  predictions:
  - metric: 'fitted amortisation exponent alpha for the ML-DSA-shaped hash arm over N in {1,...,1024}'
    direction: different
    minimum_effect: 'predicted 0.00; a fitted alpha whose interval excludes 0 by more than 0.10 is the positive finding'
  - metric: 'fitted alpha for the generic multi-target preimage control'
    direction: higher
    minimum_effect: '0.90 - must land in [0.9, 1.1] or no alpha is reported anywhere'
  - metric: 'shared target-common absorb prefix length, in bytes, for the ML-DSA-shaped arm'
    direction: lower
    minimum_effect: '0 bytes exactly'
  - metric: 'fitted alpha for the stage-4 pricing variant (tr removed, A shared)'
    direction: higher
    minimum_effect: '0.10 above the headline arm, or the framing is falsified'
  - metric: 'mean hash evaluations to certified forgery at N = 1, divided by 2^{log2|B_tau|}'
    direction: different
    minimum_effect: 'within the 30-repetition interval of 1.0'
  minimal_test:
    design: >-
      One reduced parameter set, three arms, one invocation. Pick n = 64 and tau such that
      log2|B_tau| is about 24, (k, l) = (2, 2), an NTT-friendly q. Arm 1: generic
      multi-target preimage control at N in {1, 4, 64, 1024}, 30 repetitions each, sorted
      table; fit alpha and check it lands in [0.9, 1.1]. Arm 2: the ML-DSA-shaped hash arm at
      the same N ladder, same repetitions, with the batched forger; fit alpha; emit and
      independently re-verify every forgery certificate. Arm 3: the stage-4 pricing variant.
      Report three fitted alphas with intervals plus the three prefix byte counts. THIS
      DISCRIMINATES because arm 1's exponent is forced to 1 and pins the instrument; because
      arm 3's exponent is expected to move away from arm 2's and if it does not the framing
      is dead; and because the prefix byte counts are derivable in advance so a disagreement
      between the derived integer and the measured exponent falsifies the object rather than
      the scheme. Cost at log2|B_tau| about 24: order 2^25 hash evaluations per repetition
      summed over the ladder, i.e. WELL UNDER ONE HOUR OF SINGLE-CORE COMPUTE in a compiled
      inner loop. This is the cheapest of the five records in this batch.
    controls:
    - 'Generic multi-target preimage arm with alpha forced to 1 (sensitivity demonstration, numeric threshold [0.9, 1.1] declared before the run).'
    - 'Stage-4 pricing variant with tr removed and A shared (nearby-object control on which alpha must move).'
    - 'N = 1 baseline reproduction against a fixture-recomputed |B_tau|.'
    - 'Independent verifier re-checking every emitted forgery certificate.'
    - '30-repetition ensembles at every N, reported as intervals.'
    - 'Hash-evaluation counts and wall time reported separately, so a table-lookup cost is not mistaken for an exponent.'
    required_metrics:
    - 'fitted alpha with interval, per arm'
    - 'mean and interval of hash evaluations to first certified forgery, per (arm, N)'
    - 'shared target-common absorb prefix length in bytes, per arm'
    - 'number of forgery certificates emitted and number independently re-verified'
    - 'wall time per (arm, N) alongside hash-evaluation counts'
    - 'the recomputed |B_tau| used in the baseline check'
  falsification_conditions:
  - 'The control arm does not recover alpha in [0.9, 1.1]: the harness cannot detect amortisation and NO alpha is reported for any arm.'
  - 'The N = 1 baseline does not reproduce |B_tau| within its interval: the forger is not implementing the hash arm and nothing downstream is reportable.'
  - 'The stage-4 pricing variant returns the same alpha as the headline arm: the shared-prefix object does not control the exponent, the framing is falsified, and that is the recorded finding.'
  - 'The derived prefix byte count and the measured exponent disagree (zero bytes with alpha above 0.1, or a large shared prefix with alpha at 0): the object is wrong, not the scheme.'
  - 'Any emitted forgery fails the independent verifier: the run is void under docs/claims-and-verification.md.'
  - 'A fitted alpha above 0.1 for the ML-DSA-shaped arm is the POSITIVE outcome and must then be attributed to a named batching mechanism before any interpretation; an unattributed positive alpha is an implementation bug until shown otherwise.'
  confounders:
  - 'Implementation quality: an unbatched forger returns alpha = 0 trivially. Mitigated only by requiring the forced-one control to be written in the same harness first.'
  - 'Table-lookup and memory-hierarchy costs at N = 1024 inflate wall time without changing the hash-evaluation exponent; both are reported so the two cannot be conflated.'
  - 'At log2|B_tau| near 24 the number of forgeries per repetition is small, so the variance of W is large; 30 repetitions is a declared minimum and the interval is reported, never a point.'
  - 'Choosing tau small enough to exhaust the challenge space may make the norm gates behave unlike FIPS 204, which is a scope limit on any statement about the ARMS but not on the prefix-ordering claim.'
  - 'A batching structure could exist that depends on parameter sizes and appears only at large tau; the toy scale cannot see it, and the record says so rather than concluding absence.'
  interpretation_limits:
  - 'The claim is over a NAMED strategy class, not over all adversaries. A measured alpha = 0 does not prove no batched attack exists.'
  - 'Toy-tier only. FIPS 204 has log2|B_tau| = 192.760 / 225.345 / 257.015; the surrogate is about 24. No forgery, cost or ordering statement transfers.'
  - 'The lattice arm is not measured. Any statement about which arm binds as N grows requires the lattice arm''s exponent, which this record explicitly leaves open.'
  - 'A negative (alpha = 0) is a scoped confirmation that the per-target accounting multiplies, which is what the standard implicitly assumes; it adds a number and an instrument, not a new security claim.'
  - 'The corpus screen behind novelty_status is bounded by a tool truncation recorded in novelty_screen.method; "no internal record turns the N dial" is a screen result over the ML-DSA lane, not a proof over the whole ledger.'
  heuristic_assumptions:
  - id: H1
    statement: >-
      At the reduced parameters, for uniformly random (y, c) and a fixed target, the event
      SampleInBall(H(mu || HighBits(A y - c t))) = c occurs with probability 1/|B_tau|,
      uniformly over targets and independently across trials.
    rigorous_support: >-
      The rigorous ingredient is the flatness of SampleInBall's fibres: c-tilde has 2*lambda
      bits and B_tau has 2^{log2|B_tau|} elements with log2|B_tau| < 2*lambda at every FIPS
      204 category (192.760 < 256, 225.345 < 384, 257.015 < 512), so the fibres of
      SampleInBall have mean size 2^{2*lambda - log2|B_tau|} and, under a random-function
      model for SHAKE, Poisson-concentrated around it - the min-entropy deficit relative to
      log2|B_tau| is of order 2^{-63} at ML-DSA-44 and smaller at 65 and 87. The classical
      statement being imitated is the balls-in-bins/Poissonisation law for a random map from
      2^{2*lambda} inputs onto 2^{log2|B_tau|} outputs.
    validation_plan: >-
      At the reduced parameters, where |B_tau| is about 2^24 and the input space is small
      enough, compute the ENTIRE fibre-size histogram of SampleInBall by exhaustive
      enumeration and compare it against the Poisson prediction with the matching mean, with
      a TAIL CHECK on the largest observed fibre against the predicted maximum of
      2^{log2|B_tau|} Poisson draws. Also estimate the per-trial acceptance rate directly over
      10^7 trials and compare it against 1/|B_tau|. Sampled parameters (n, tau, q, lambda')
      recorded. TRANSFER ASSUMPTION, stated and NOT discharged: that fibre flatness at 2^24
      predicts fibre flatness at 2^192.76, which the Poisson argument supports but which no
      run under this record measures.
  - id: H2
    statement: >-
      The number of hash evaluations to the first certified forgery at N targets is
      geometric with success parameter N-dependent only through the incidence structure of
      stage 2, so that log E[W(N)] is linear in log N with slope -alpha over the declared
      ladder.
    rigorous_support: >-
      Imitates the standard geometric model for independent Bernoulli search trials. Its
      rigorous support is that under H1 each trial succeeds independently, and that the only
      N-dependence a batched strategy can introduce is the number of targets one trial is
      scored against.
    validation_plan: >-
      Test linearity by reporting the residuals of the log-log regression and by refitting on
      the two halves of the ladder separately; a slope that differs between halves means the
      power law is wrong and no single alpha is reported. Test the geometric fit of W at
      N = 1 by a chi-squared goodness-of-fit on the 30-repetition sample, and check that the
      forced-one control's residuals behave the same way. Sampled parameters recorded; no
      transfer to FIPS parameters is asserted.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IMPROVEMENT IS CLAIMED. The quantity produced is an exponent alpha in
      the number of TARGETS, not in the security parameter: W(N) proportional to |B_tau| *
      N^{-alpha}. The predicted value alpha = 0 leaves the hash arm at |B_tau| per target,
      i.e. 2^192.760 / 2^225.345 / 2^257.015 at ML-DSA-44 / 65 / 87 - unchanged. The
      experiment's own cost is O(|B_tau_toy| * R * |ladder|) hash evaluations, about 2^25
      total at the declared toy scale.
    memory_exponent: >-
      The batched forger's memory is O(N) target-derived table entries, i.e. 2^10 entries at
      the top of the ladder - negligible. Were alpha > 0 to be found at scale, the
      corresponding attack would carry an O(N) memory cost that must be charged against the
      time saved, and any such trade would have to be reported as a triple, never as a time
      figure alone.
    best_known: >-
      The incumbent is the per-target accounting implicit in the ML-DSA specification and
      re-derived in IDEA-20260801-008 and IDEA-20260805-5194f9: cost |B_tau| per target, i.e.
      alpha = 0 assumed and never measured. This record's contribution is to measure it. On
      the ADJACENT axis of generic multi-target attacks, the incumbent is alpha = 1 for
      preimage search, which is the control.
    hidden_overhead: >-
      The o(1) here hides the strategy class. "alpha = 0" is a statement about the strategies
      an implementer wrote in a bounded budget, and the gap between that and "no batched
      strategy exists" is not small and is not measured. Second, the toy-to-FIPS transfer of
      a scaling exponent is itself a heuristic: an exponent measured over N in [1, 1024] at
      |B_tau| = 2^24 need not persist at |B_tau| = 2^192.76, and no argument here forces it to.
    tradeoff_note: >-
      Memory is negligible at the measured scale, so no time-memory interpolation applies.
      Parallelisation is embarrassing in N and in trials, so the exponent is unaffected by
      parallelism - which is precisely why alpha, and not wall time, is the reported quantity.
  dominated_by: >-
    n/a (no attack result claimed) - and this is asserted after checking every frontier row
    available, with the row set CORRECTED on 2026-08-24 because the first version of this list
    checked only the seven pre-existing RQ-MLDSA-001 proposals and named two experiment
    specifications where there are seven. Rows checked: (i) the published hash-arm cost |B_tau|
    per target, which this record does not beat and predicts it will confirm; (ii) the
    published lattice arm / core-SVP MSIS estimate, untouched here; (iii) ePrint 2025/214, key
    recovery given a single power trace, which is not comparable because it assumes physical
    access and this record assumes none; (iv) ePrint 2024/1373, t0 recovery from 2*10^5-5*10^5
    signatures, on a different axis (Q_S, not N) and against a different secret; (v)
    KN-LIT-4f3b80 (Jendral glitch, 0.582), fault model, not comparable; (vi) all twelve
    RQ-MLDSA-001 proposals, including this batch's five, none of which produces an attack cost
    triple; (vii) ALL TEN proposals of the sibling question RQ-MLDSA-ffa0f5 - 031ce2, 630606,
    bb52fa, 4f83f6, e5f947, 60ba98, 6109f8, 65739b, 6d1b97, 71fc18 - of which the strongest
    quantitative rows are IDEA-20260805-630606's 34 / 60 / 58 signature floor and
    IDEA-20260805-bb52fa's exact reachability envelope; both are at N = 1 and neither produces
    an attack cost triple; (viii) ALL SEVEN committed experiment specifications
    EXP-MLDSA-{1c66ac, 15866e, 2b6f17, 462ea2, 3f7ab2, 8c8fa2, a8d531}, of which 2b6f17, 3f7ab2
    and a8d531 have committed run records; none reports a cost triple in the number of targets;
    (ix) all seven H-MLDSA-* hypotheses. No row on that list dominates a measurement of the
    multi-target exponent because no row on that list contains one.
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively: the predicted outcome alpha = 0
    leaves the hash-arm cost at 2^192.760 / 2^225.345 / 2^257.015 per target at ML-DSA-44 /
    65 / 87 - a delta of exactly 0 bits against the incumbent accounting. The contribution is
    that the incumbent's alpha = 0 becomes a measured number with an interval and an
    instrument validated against a forced alpha = 1, where before it was an unexamined
    assumption. If alpha were measured above 0.1 at toy scale, the corresponding statement
    would be that the per-target figure is optimistic by up to N^0.1 - which at a deployment
    of N = 2^30 keys would be 3.0 bits, and that is the smallest movement this experiment
    could report as interesting.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That a reduced parameter set with log2|B_tau| about 24 and ML-DSA-shaped
    hash input ordering exists: ~0.95 - this is nearly a definition. (ii) That the harness
    recovers alpha = 1 on the forced control: ~0.85. (iii) That the N = 1 baseline reproduces
    |B_tau|: ~0.9. (iv) That the headline arm returns alpha = 0 as derived: ~0.85 - I expect
    the derivation to be right and would be surprised by a positive. (v) That the stage-4
    pricing variant returns a materially larger alpha, licensing the framing: ~0.6, and this
    is the part I would bet against most readily, because removing tr still leaves w1
    target-dependent through t, so the shared prefix may stay short even there - if so, the
    stage-4 variant must be redesigned to share t as well, and that redesign is itself part of
    the deliverable. (vi) That the run produces a defensible exponent with an interval either
    way: ~0.9. The 2026-08-24 re-screen did not move any of these six: it corrected the
    EVIDENCE behind the novelty statement without finding a record that competes on the axis.
