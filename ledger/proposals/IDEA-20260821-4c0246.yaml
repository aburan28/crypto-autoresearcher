      internal neighbour is IDEA-20260808-c1abd1's amortisation of ONE lattice reduction over L
      candidate challenges within ONE key - a different shared object on a different axis,
      named in discriminated_from and in results above. THAT IS A CORPUS SCREEN, NOT A PROOF OF
      CORPUS NOVELTY, and one bound on it is recorded above: the proposal-directory grep for
