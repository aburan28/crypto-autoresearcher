idea:
  id: IDEA-20260809-2e974b
  added: '2026-08-09'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-NTRU-9015ee
  goal_id: GOAL-NTRU-001
  title: >-
    Correctness pushes q up and fatigue pulls it down — plot the two constraints
    on one axis and measure how much room is actually left
  class: composition
  claim: >-
    A designer choosing q faces two opposing constraints: decryption correctness
    (or, in higher-functionality variants, noise growth) forces q upward, and the
    overstretched event forces it downward. These are analysed in separate
    literatures. The claim is that plotting both as measured curves on one axis
    for a fixed n produces a WINDOW whose width is computable, that the window
    narrows as the error or message space grows, and that the narrowing rate
    tells designers of higher-rate or higher-functionality variants where the
    approach stops working.
  mechanism: >-
    Measure the failure-probability curve against q at fixed n by direct sampling,
    measure the transition curve from the goal's main sweep, and intersect. The
    window is bounded below by the correctness requirement at a declared failure
    target and above by the transition minus a declared margin.
  why_not_a_renamed_known_approach: >-
    Both constraints are individually standard and the tension is understood
    qualitatively. The composition — one measured window, its width, and its
    scaling with the noise budget — is what does not exist as a number and what a
    designer of a variant actually needs.
  predictions:
  - observable: window width in log q at fixed n
    metric: width with interval
    predicted: Positive and comfortable at parameters resembling deployed ones. A narrow or empty window at some noise budget locates where the design space closes, which is the useful output.
  - observable: window width versus noise budget
    metric: width as a function of error magnitude
    predicted: Narrowing monotonically. Non-monotone behaviour would indicate one of the two curves is mismeasured.
  minimal_test: >-
    At one toy n, measure failure probability across q by direct sampling with at
    least ten thousand trials per point, take the transition curve from the main
    sweep, and report the window at three noise budgets.
  controls:
  - 'FAILURE-MEASUREMENT CONTROL: failure probabilities are measured by sampling with reported confidence intervals, never taken from an analytic bound, since the analytic bound is exactly the kind of inherited quantity this program exists to check.'
  - 'CONSISTENCY CONTROL: at the noise budget matching the main sweep, the window''s upper edge must agree with the independently measured transition.'
  falsification_conditions:
  - The window is empty at every measured noise budget, which would contradict the existence of working parameter sets and indicate a measurement error.
  - Failure sampling cannot reach the required precision within budget, in which case the lower edge is unavailable and the window cannot be reported.
  interpretation_limits: >-
    Toy dimension, sampled failure rates, and a declared margin convention. The
    window is a design-space observation, not a safety statement about any
    parameter set.
  sota_delta: 'No attack. Delta: a single measured window where the field has two separately argued constraints.'
  dominated_by: Not dominated by any corpus record; GOAL-HQC-001 measures decoding failure rates for a code-based scheme, a different mechanism with no transfer.
  estimated_cost: Implementation small; compute moderate because of the sampling depth.
  recommended_priority: medium
  novelty_status: unverified
  novelty_screen: 'Corpus grep for decryption failure: HQC records only, different primitive. WEB NOT CHECKED.'
  source_refs:
  - NTRU submission specifications -- REQUIRED READS.
