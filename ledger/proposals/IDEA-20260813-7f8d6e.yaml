idea:
  id: IDEA-20260813-7f8d6e
  added: '2026-08-13'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-SLHDSA-001
  goal_id: GOAL-SLHDSA-001
  title: Fault-oracle persistence automaton and minimal ADRS repair boundary
  class: control
  claim: >-
    For a frozen stateless fault oracle, a finite persistence automaton over ADRS
    writes identifies the earliest recomputation or consistency-check boundary that
    cuts every certified alias path from IDEA-20260813-945a67, with exact added
    operations per signature; falsify if any bounded path survives the proposed cut
    or if the cut relies on undeclared persistent state.
  mechanism: >-
    Lift each address field to states correct, stale, overwritten, skipped, or
    unchecked, with transitions at writes, copies, type changes, and hash calls.
    Compute minimal hitting sets of transitions on certified alias paths. Candidate
    boundaries recompute typed ADRS from immutable logical coordinates or compare
    redundant encodings. This is a stateless fault-control proposal, not an ordinary
    proof reduction and not a claim about physical countermeasure efficacy.
  why_not_a_renamed_known_approach: >-
    IDEA-20260807-c4f1fc concerns normal-operation reachable hash-input sets under
    fixed PK seed/ADRS. Here an explicit fault oracle changes address state, paths
    end only at a reuse certificate, and the output is a cut set with exact cost.
    KN-LIT-748 and KN-LIT-3858 are only title-level SCA/SIFA/fault-template collision
    risks; no countermeasure or theorem is attributed to them.
  predictions:
    - observable: Certified alias paths surviving each repair boundary
      metric: Exact count by fault primitive and injection window
      predicted: Zero for a claimed complete boundary; one survivor falsifies it
    - observable: Minimal cut size and placement
      metric: Number of recomputations/checks and operations per signature
      predicted: Typed boundary cuts outperform indiscriminate per-hash duplication on at least one declared cost axis, if the idea survives
    - observable: Non-alias fault outcomes
      metric: Crash, incorrect signature, silent corruption, and verifier rejection counts
      predicted: Alias elimination need not eliminate other faults; those remain explicitly separate
  minimal_test:
    parameter_slice: Same source-verified toy trace and single-fault oracle as IDEA-20260813-945a67.
    procedure: [Build the persistence automaton, import only replayable alias certificates, enumerate minimal transition cuts, instrument conceptual repair boundaries, and replay all toy injection paths with exact operation counts]
    discriminating_outcomes:
      - Zero aliases with surviving non-alias failures supports a narrow alias control.
      - Surviving aliases falsify cut completeness.
      - Zero failures only because signing aborts supports detection, not transparent correction.
  controls:
    - Exact null: apply proposed recomputation to fault-free traces; output signatures and typed hash-call tuples must be identical.
    - Planted positive: insert a known stale ADRS copy spanning one hash interval; a boundary inside the interval must cut it and a boundary after it must not.
    - Sham-control: recompute only a checksum derived from the already-faulted ADRS; it should fail against common-mode corruption.
    - Nearby data-fault control: mutate hash-input data with correct ADRS to ensure the alias cut is not misreported as general fault protection.
  confounders: [Immutable logical coordinates may share the same fault domain, compiler optimization may remove redundancy, aborts may leak information, and multi-fault paths are outside the automaton]
  falsification_conditions: [Any certified alias path survives, fault-free output changes, planted temporal ordering is misclassified, or cost omits coordinate recovery, comparison, abort, and verification]
  interpretation_limits: [Abstract single-fault oracle only, no physical efficacy or side-channel claim, alias-path coverage only, and no change to conventional FIPS 205 proof security]
  assumptions: [IDEA-20260813-945a67 certificates are independently checked, logical coordinates can be reconstructed statelessly, and repair operations have an implementation-independent operation model]
  heuristic_assumptions:
    - id: H1
      statement: Minimal abstract cuts map to compiler-preserved implementation boundaries.
      validation: Require separate assembly-level data-flow verification on each implementation; until then the mapping is unverified.
    - id: H2
      statement: Added operation counts approximate actual countermeasure cost.
      validation: Later measure latency, memory traffic, code size, and randomness separately; operation counts alone cannot support deployment claims.
  proof_search_map:
    bottleneck: Prove cut completeness against the frozen fault oracle while preserving stateless semantics and exact costs.
    baseline_embedding:
      parameter_slice: The complete certified toy alias-path set and fault-free address trace.
      reproduction_check: Replay every certificate and the fault-free signature before inserting any boundary.
    observation_collision:
      audit: Search two fault paths with identical automaton states but different physical provenance or reuse certificates.
      failure_response: Refine state with the missing provenance or weaken completeness.
    constructive_transforms: [Fault-path persistence automaton, alias-path hypergraph, minimal transition hitting set, typed ADRS recomputation]
    quantifier_order: Fix oracle, paths, and repair boundary first; for every allowed single injection and trace, no certified alias reaches a hash-call sink.
    method_ceiling:
      statement: A hitting set for abstract paths cannot prove resistance to common-mode, multi-fault, compiler, or physical attacks.
      nearby_counterobject: A common-mode fault corrupting both ADRS and the logical coordinates used for recomputation.
    proof_obligations: [Automaton simulation of fault semantics, path-certificate correspondence, cut completeness, fault-free functional equivalence, exact cost table and out-of-model list]
    not_applicable_reason: null
  target_complexity:
    time_exponent: null
    memory_exponent: null
    best_known_baseline: Unprotected source-verified FIPS 205 address construction and the exact alias paths from IDEA-20260813-945a67; no paper countermeasure baseline is asserted.
    hidden_overhead_disclosure: Coordinate retention, recomputation, comparisons, branches, aborts, memory traffic, code size, certificate replay, and verification are charged.
    time_memory_tradeoff: Retaining immutable coordinate tuples costs memory but saves reconstruction; recomputing from loop state saves storage and adds operations.
  sota_delta: No security-bit delta; target is zero surviving certified alias paths with exact extra operations, bytes, and checks per signature relative to the unprotected baseline.
