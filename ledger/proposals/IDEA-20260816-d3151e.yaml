idea:
  id: IDEA-20260816-d3151e
  question_id: RQ-SHAONE-081e3a
  added: '2026-08-16'
  title: 'Decide semantic collision-exploitability as a two-level predicate over container-format
    grammars: for a named finite set of formats, mechanically test whether the SHA-1-hashed region
    admits an attacker-length-free uninterpreted field (P1) and whether that field is reachable and
    rendering-divergent (P2), then report the counts of passes and the enumerated reason each fail
    fails.'
  class: measurement
  claim: '(A) A chosen-prefix collision has a semantic meaning for a format only when the format''s
    grammar leaves the collision blocks somewhere a verifier hashes but does not otherwise constrain,
    and where the two colliding files can then be made to render or be accepted differently. Whether
    a format grammar has that property is not an anecdote to be recalled but a predicate to be decided
    over a finite formal object: the grammar''s field list, each field annotated with four booleans
    -- admits attacker-chosen uninterpreted bytes of free length (SLACK), lies inside the SHA-1-hashed
    byte range (HASHED), that digest is actually consulted by at least one verifier in the format''s
    processing (CONSULTED), and the field''s bytes can steer what a verifier accepts or displays (DIVERGENT).
    (B) Define two predicates over a formalized grammar G. P1(G) = there exists a field with SLACK
    and HASHED: a collision-admitting region exists at all. P2(G) = there exists a field with SLACK
    and HASHED and CONSULTED and DIVERGENT: a collision could change what a verifier accepts. P1 and
    P2 are DIFFERENT predicates, and the gap between them -- formats where a collision can be hidden
    but cannot matter -- is the object this proposal isolates. Both are decidable by scanning a finite
    annotated field list. (C) The claim is that these predicates are well-defined once the annotation
    rules are declared, that they can be evaluated mechanically on a named set of formalized grammars
    including a declared zero-slack negative control and a declared known-slack positive control,
    and that the output is two counts plus, for every fail, the specific missing conjunct. (D) WHAT
    IS NOT CLAIMED: passing P1 or P2 is NOT a demonstrated attack, not a collision, not a statement
    that any real deployed instance of the format is exploitable, and not a claim about what the literature
    reports for that format. A pass is the demonstrated ABSENCE of one structural obstacle over MY
    stated grammar model, which may differ from the real format; the model, not the format, is what
    is decided. No security consequence for any repository, certificate, or system follows. (E) A
    run in which the negative control fails P1, the positive control passes P2, and the real formats
    split is a fully valuable result whether the split is mostly-pass or mostly-fail, because the
    enumerated fail reasons are a reusable map of WHICH structural conjunct blocks exploitability
    where.'
  mechanism: 'STAGE 1: declare the annotation rules. Fix exactly what SLACK, HASHED, CONSULTED and
    DIVERGENT mean as decidable tests over a grammar field, in prose precise enough that two people
    annotating the same grammar agree. This declaration bounds every count; it is written before any
    format is annotated and frozen. STAGE 2: formalize the grammar of each named format as a machine-readable
    field list -- field name, whether its length is fixed or attacker-free, its byte range relative
    to the hashed region, and whether a verifier consults the digest and renders the field. Each grammar
    is a stated model with a provenance note distinguishing what is structural from what is assumed.
    STAGE 3: build the two zero-cost controls. Negative: a fixed-length fully-hashed record format
    with no free field, which MUST fail P1. Positive: a format with a declared length-free uninterpreted
    hashed-and-rendered field, which MUST pass P2. If either control behaves wrongly the annotation
    rules or the evaluator are broken and no other verdict is admissible. STAGE 4: evaluate P1 and
    P2 on every grammar by scanning its field list; record the verdict and, for each fail, the first
    missing conjunct in a fixed order (SLACK, then HASHED, then CONSULTED, then DIVERGENT). STAGE
    5: the null control -- generate random grammars of the same shape (same field count and same marginal
    frequency of each of the four booleans) but with the booleans assigned to fields independently,
    and evaluate the identical predicates. If real formats pass at the same rate as size-and-marginal-matched
    random grammars, the verdict is a function of how many annotated fields a format has, not of the
    structured alignment of the four conjuncts on one field, and the count means nothing about deployed
    formats specifically. STAGE 6: report both counts, the per-fail reason table, and the signal-versus-null
    gap.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHAONE-081e3a in full. grep -ril over ledger/proposals for 'container format',
      'format grammar', 'attacker-controllable slack', 'slack', 'semantic exploitab', 'decidable predicate'.
      Read the four sibling SHAONE proposals IDEA-20260816-3edd14, -8e0b9c, -fa13f6, -ade53e in full
      and the opening claim of IDEA-20260816-71d4dd, -1e36fa, -962936, -389b1b, -70b60d. Checked the
      PDF/format grep hits (IDEA-20260808-51e40f, IDEA-20260805-59fa23, IDEA-20260731-002) for their
      question_id.
    results: 'No proposal in ledger/proposals uses ''container format'', ''semantic exploitability'',
      or ''decidable predicate'' in the SHAONE sense. The ''attacker-controllable'' grep hit IDEA-20260816-8640ad
      (a symmetric-cipher weight/Pareto record) and IDEA-20260807-bfa86b (unrelated round structure),
      neither about formats. The PDF/format grep hits resolve to RQ-MQOM-001, RQ-FAEST-001 and IDEA-20260731-002
      -- none in the SHAONE bucket. The nine SHAONE siblings partition cleanly: detector-coverage
      enumeration (3edd14), detector as instrument / false-positive rate (70b60d), identical-vs-chosen-prefix
      ratio (8e0b9c), birthday-phase reuse amortization (fa13f6), restart tail index (ade53e), birthday-phase
      efficiency vs memory/interconnect (71d4dd), near-collision chain N(k) as counted object (1e36fa),
      elasticity-vector cost model (962936), hardware efficiency coefficient (389b1b). All are cost-model
      or detector records; none formalizes format-level semantic exploitability as a predicate.'
    verdict: 'UNVERIFIED. No agent here can read external literature, so whether the two-predicate
      P1/P2 grammar formalization exists in published format-security work is unknown and is not asserted
      either way. NEW relative to this repository''s corpus: casting per-format semantic exploitability
      as a decidable predicate over an annotated grammar, with the explicit P1 (collision-admitting)
      vs P2 (accept-changing) split, a zero-slack negative control, a known-slack positive control,
      and a marginal-matched random-grammar null. ASSEMBLED from known parts: the four field annotations
      name obstacles that are individually familiar as informal collision-attack folklore; the object-first
      / null-control / control-before-belief discipline is inventor-protocol sections 1-3.'
  object_first_candidate:
    tracked_object: 'The slack witness: for a formalized grammar G, the set W(G) of fields carrying
      the boolean tuple (SLACK, HASHED, CONSULTED, DIVERGENT), and the two derived indicators P1 =
      any field with (SLACK and HASHED) and P2 = any field with all four. The object followed through
      the computation is this annotated field list and the conjunctions read off it, not the format''s
      bytes.'
    lossiness: 'Genuinely lossy. Discarded: the actual byte semantics of every field, the format''s
      parser code, the collision blocks themselves, and all quantitative cost. Retained: four booleans
      per field and their conjunction. The retained part propagates deterministically under grammar
      operations because SLACK, HASHED, CONSULTED and DIVERGENT are each defined as structural tests
      that a grammar refinement either preserves or removes -- narrowing a field''s length freedom
      can only clear SLACK, never set it, so P1 and P2 move monotonically as a grammar is made more
      precise. That monotonicity is exactly what would be lost by keeping the bytes: it is the discard
      of content that makes the predicate stable under model refinement.'
    propagation: 'One step of the target operation is a grammar refinement: replacing a field''s ''attacker-free
      length'' with a concrete constraint, marking a region as parsed rather than uninterpreted, or
      removing a verifier from the CONSULTED set. Each such step can only turn a boolean from true
      to false (a refinement adds constraints), so P1 and P2 are antitone under refinement. A format
      that fails P2 stays failing under every refinement; a format that passes P2 may fail after a
      refinement names the missing constraint. This gives every verdict a direction: a P2 pass on
      a coarse model is an upper bound on exploitability that later refinement can only tighten.'
    survival_score: The structure survives exactly as long as the annotation rules from STAGE 1 remain
      decidable per field. It dissolves at the first field whose SLACK or CONSULTED status is not
      decidable from the grammar alone -- e.g. a field whose length freedom depends on runtime verifier
      configuration rather than the format spec. Concretely, over a set of six-to-ten formats the
      object is expected to survive cleanly for the controls and for formats with well-separated fixed-vs-free
      length fields, and to hit an undecidable annotation (recorded as UNKNOWN, not as pass or fail)
      for at least one real format; the count of UNKNOWN annotations is itself a reported number.
  null_object_control: 'A random grammar of the same shape: same field count as a target format and
    the same marginal frequency of each of the four booleans across fields, but with the four booleans
    assigned to fields independently (destroying any correlation that puts SLACK, HASHED, CONSULTED
    and DIVERGENT together on one field). The identical P1/P2 evaluator runs against it. For the signal
    arm to mean anything about deployed formats specifically, the real formats'' pass rate must differ
    from the marginal-matched random grammars'' pass rate: if they match, the verdict is a function
    of field count and marginal boolean frequency alone, and reveals nothing about the structured
    alignment that a real attack needs.'
  discriminated_from:
  - 'IDEA-20260816-3edd14 (detector coverage enumeration): that record counts which disturbance vectors
    a detector criterion covers; this record counts which FORMAT GRAMMARS admit a semantic collision
    at all, a disjoint object at the format layer rather than the cryptanalytic layer.'
  - 'IDEA-20260816-70b60d (detector as instrument, false-positive rate): measures a detector predicate''s
    error rates on messages; this measures a format-grammar predicate''s verdict over formats, and
    never runs the detector.'
  - 'IDEA-20260816-962936 / -1e36fa (cost-model records): those quantify the PRICE and BLOCK-COUNT
    of producing a collision; this deliberately discards all cost and asks only whether a produced
    collision could be semantically placed. The cost model is a sibling''s object by explicit directive.'
  - 'Informal ''formats vulnerable to collision'' anecdote lists: an anecdote list is not decidable
    and has no null control; this replaces the list with a predicate, a negative control that must
    fail P1, a positive control that must pass P2, and a marginal-matched random-grammar null.'
  - 'IDEA-20260816-8e0b9c (identical-vs-chosen-prefix ratio): a cryptanalytic-cost ratio at analogue
    widths; this record does not depend on which collision variant is used and makes no cost measurement.'
  assumptions:
  - A format's exploitability-relevant structure can be captured as a finite annotated field list
    at the fidelity the STAGE 1 rules require; fields that cannot be so captured are recorded UNKNOWN
    rather than forced.
  - The four annotation booleans are decidable from a stated grammar model for the chosen formats,
    or explicitly marked undecidable.
  - A grammar refinement can only add constraints, so the four booleans are antitone under refinement
    (used to justify the direction of every verdict).
  - 'The controls behave as declared: the negative control genuinely has no free hashed field and
    the positive control genuinely does, by construction rather than by claim about a real deployed
    format.'
  predictions:
  - metric: P1 verdict on the zero-slack negative control
    direction: different
    minimum_effect: 'forced FALSE: the negative control must fail P1 or the evaluator is broken'
  - metric: P2 verdict on the known-slack positive control
    direction: different
    minimum_effect: 'forced TRUE: the positive control must pass P2 or the evaluator is broken'
  - metric: gap between P1-pass count and P2-pass count across the real formats
    direction: higher
    minimum_effect: at least 1 format that passes P1 but fails P2 (a collision-admitting but not accept-changing
      grammar), else the two-predicate split is refuted as vacuous on this set
  - metric: real-format P2 pass rate minus marginal-matched random-grammar P2 pass rate
    direction: different
    minimum_effect: 'refuse to pre-commit a magnitude: the null''s pass rate is a computed quantity
      not known before the grammars are annotated; only the requirement that the two differ is pre-committed'
  minimal_test:
    design: 'Cheapest discriminating measurement: hand-formalize six grammars -- one zero-slack negative
      control, one known-slack positive control, and four real-format models -- as JSON field lists
      with the four booleans per field. Write a ~150-line Python evaluator that reads a grammar, computes
      P1 and P2 by scanning fields, and for each fail records the first missing conjunct in fixed
      order. Run it on all six. Then generate, per real format, 1000 marginal-matched random grammars
      and compute the null P1/P2 pass rates. The single discriminating comparison is: do the two controls
      behave as forced, does at least one real format sit in the P1-pass/P2-fail gap, and does the
      real-format pass rate fall outside the null''s bootstrap interval. This needs no cryptographic
      compute, no collision, and no hash evaluation at all.'
    controls:
    - 'Zero-slack negative control: fixed-length fully-hashed record, must fail P1.'
    - 'Known-slack positive control: format with a declared length-free uninterpreted hashed-and-rendered
      field, must pass P2.'
    - 'Marginal-matched random-grammar null: same field count and boolean marginals, booleans assigned
      independently.'
    - Fixed conjunct-order fail attribution, so the same fail is always attributed to the same missing
      conjunct across formats and across the null.
    - Two-annotator agreement check on at least one real grammar to bound annotation subjectivity.
    required_metrics:
    - P1 pass count over the named set
    - P2 pass count over the named set
    - count of formats in the P1-pass/P2-fail gap
    - per-fail first-missing-conjunct table
    - count of UNKNOWN annotations (undecidable per stated rules)
    - real-format vs null P1/P2 pass-rate difference with bootstrap interval
    - two-annotator disagreement rate on the audited grammar
  falsification_conditions:
  - The zero-slack negative control passes P1 -- the predicate does not encode the obstacle it claims
    to.
  - The known-slack positive control fails P2 -- the predicate misses a slack that is present by construction.
  - No real format sits in the P1-pass/P2-fail gap -- the two-predicate split is vacuous on this set
    and P1 alone would have sufficed.
  - Real-format pass rate is inside the marginal-matched null's bootstrap interval -- the verdict
    tracks field count and boolean frequency, not structured alignment, so it says nothing specific
    about the formats.
  - More than half of real-format fields annotate as UNKNOWN -- the grammars are not decidable at
    the required fidelity and no count is admissible.
  - Two annotators disagree on more than a declared threshold of a grammar's fields -- the annotation
    rules are not objective enough to support a count.
  confounders:
  - 'Annotation subjectivity: an annotator who wants a format to pass can mark a borderline field
    SLACK; mitigated by two-annotator agreement and UNKNOWN as a first-class value.'
  - 'Model-vs-reality gap: the formalized grammar is a model and may omit a constraint the real format
    enforces, inflating passes; mitigated by antitone refinement (a pass is an upper bound) and explicit
    provenance notes.'
  - 'Field granularity: splitting one field into two or merging two into one changes field count and
    can move both the verdict and the null marginals; requires a declared canonical field-decomposition
    rule.'
  - 'Selection of the named set: choosing formats known informally to have slack biases the pass count;
    the set and its selection reason are declared and the null controls for size.'
  - CONSULTED depends on verifier population, not format alone; a format may be consulted by one verifier
    and not another, blurring a per-format boolean.
  interpretation_limits:
  - A P2 pass is the absence of one structural obstacle over a stated grammar model, never a demonstrated
    attack, collision, or statement about a real deployed instance.
  - The counts are over the named finite set and MY formalizations; they do not generalize to formats
    outside the set or to refinements of the grammars.
  - CONSULTED is scoped to the verifier set assumed in the grammar; a different verifier population
    can flip the verdict.
  - UNKNOWN annotations are a genuine gap, not a pass, and a set dominated by UNKNOWN yields no usable
    count.
  - The predicate says nothing about the cryptographic cost of producing a collision -- that is a
    separate sibling's object.
  target_complexity:
    time_exponent: No attack exponent claimed. This is a zero-cryptographic-compute symbolic audit
      over grammars.
    memory_exponent: No attack exponent claimed. Memory is that of storing a few hundred small JSON
      grammars and bootstrap samples; negligible and not a cryptanalytic quantity.
    best_known: The incumbent is the informal, undecidable anecdote list of 'formats where a chosen-prefix
      collision is meaningful' that circulates without a stated predicate, a control, or a null. There
      is no decidable-predicate formalization of format-level semantic exploitability in this repository's
      corpus to compare against.
    hidden_overhead: 'The human cost hides in STAGE 1 and STAGE 2: writing annotation rules objective
      enough that two annotators agree, and formalizing each grammar faithfully, is the real work
      and the main source of error. The evaluator itself is trivial. A lower-order but real risk is
      that UNKNOWN is used to dodge hard annotations, silently shrinking the denominator the way inventor-protocol
      section 3 warns about for feasibility filters.'
  dominated_by: 'n/a (no result claimed). Checked against the SHAONE frontier rows: every sibling
    (3edd14, 8e0b9c, fa13f6, ade53e, 71d4dd, 1e36fa, 962936, 389b1b, 70b60d) measures a cost or detector
    quantity, none a format-grammar predicate, so no time/memory/data frontier row dominates a measurement
    that claims no attack and produces no collision.'
  sota_delta: 'No attack; conceptual/measurement contribution only. The delta over the informal anecdote
    list is qualitative: a decidable predicate with a forced-behavior negative and positive control
    and a marginal-matched null, versus an undecidable, uncontrolled list. No numbers are moved on
    any attack cost axis.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: 'The evaluator and the two controls surviving (negative fails P1, positive
    passes P2): ~0.9, since these are near-tautological if STAGE 1 is written carefully. At least
    one real format landing in the P1-pass/P2-fail gap: ~0.55, because it depends on whether the chosen
    set actually contains a collision-admitting-but-inert format; if not, the split is measured vacuous,
    which is itself a reportable outcome. Real-format pass rate separating from the marginal-matched
    null: ~0.5, the genuinely uncertain part -- structured alignment of four booleans on one field
    may or may not exceed what independent assignment produces at these field counts, and a null match
    is the most informative single failure this design can return.'
