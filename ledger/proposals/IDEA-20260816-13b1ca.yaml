idea:
  id: IDEA-20260816-13b1ca
  question_id: RQ-SHATHREE-cd2cb2
  added: '2026-08-16'
  title: 'The nearby-object control this bucket cannot skip: build a random permutation of exactly
    Keccak''s shape that is z-translation-equivariant by construction, run the identical symmetry-decay
    measurement on it, and determine whether the decay curve is a fact about SHA-3 or a fact about
    the shape'
  class: control
  claim: '(A) THE CONTROL IS THE POINT. Every other entry in this bucket measures a curve over Keccak-f[1600]
    and asks whether it predicts something. None of them can mean anything until the same measurement
    is run on an object of the same shape that has no reason to behave the same way. This entry constructs
    that object explicitly and executes the identical measurement in the same invocation. (B) THE
    CONSTRUCTION, AND WHY IT IS THE RIGHT NULL. A Keccak-shaped random permutation is built as: a
    random GF(2)-linear layer that is z-translation-equivariant by construction and matched to theta.rho.pi
    in branch-number-relevant density; a nonlinear layer that applies a randomly drawn 5-bit permutation
    independently to every row (preserving row locality, hence z-equivariance); and a constant-addition
    layer using random constants of matched support shape. Because equivariance is imposed by construction,
    this null PRESERVES the fixed subspaces S_t exactly, just as Keccak does. That is the crucial
    design feature: it makes the null share the qualitative structural property, so any signal must
    come from RATES, not from the existence of the symmetry. A null that broke equivariance would
    be a straw man and would let this bucket claim structure it has not earned. (C) THE SECOND NULL,
    DELIBERATELY BROKEN. A matched-density random linear layer with NO equivariance constraint, so
    that S_t is not preserved. This arm establishes what the measurement looks like when the load-bearing
    property is absent, which is what makes the first null interpretable. (D) THE PREDICTION AND WHAT
    IS NOT CLAIMED. It is predicted that Keccak''s active-row curve is NOT distinguishable from the
    equivariant random null at the level of curve shape, and IS distinguishable from the non-equivariant
    null. That is, symmetry preservation is generic to the shape and carries no SHA-3-specific information,
    while the rate of deviation growth may or may not. It is NOT claimed that a match constitutes
    evidence against SHA-3''s design or for it; a match means the companion contracts'' curves are
    properties of the architecture class, which constrains what they may be credited with explaining.
    No attack, no complexity, no statement about full 24-round SHA-3, and no assertion about any published
    analysis of Keccak or of any random permutation family.'
  mechanism: 'STAGE 1: define the shape formally -- state 5x5x64, a GF(2)-linear layer commuting with
    all tau_t, a row-local nonlinear layer, a lane-(0,0) constant addition -- and prove by construction
    that every element of this family preserves every S_t; verify by rank computation on 100 sampled
    members that dim ker(I XOR tau_t) is unchanged after applying the member, for all t | 64. STAGE
    2: sample the equivariant linear layer by drawing a random 25x25 matrix of polynomials in GF(2)[z]/(z^64
    - 1) -- the exact algebraic form of a z-equivariant linear map on 25 lanes -- with density matched
    to theta.rho.pi, and reject draws that are singular. STAGE 3: sample the nonlinear layer as one
    uniformly random 5-bit permutation applied to all rows, plus a variant with an independently drawn
    permutation per y, so the null covers both a Keccak-like uniform choice and a richer one. STAGE
    4: run the identical deviation-recursion code from the companion active-row contract on 1000 members
    of the equivariant family, 1000 members of the non-equivariant family, and the FIPS arm, emitting
    active-row, Hamming-weight and z-support curves for r = 1..12. STAGE 5: compute where the FIPS
    curve sits in each null distribution, per round and per statistic. STAGE 6: report the three-way
    comparison. REFUTATION: the construction fails if a sampled equivariant member does not preserve
    S_t, which would mean the algebraic characterisation of equivariance is wrong; and the control
    fails to discriminate if the equivariant and non-equivariant nulls have indistinguishable curves,
    which would mean the measurement is blind to the property it was built to detect.'
  novelty_status: unverified
  novelty_screen:
    method: 'Ran `grep -ril "keccak\|sha-3\|sha3" ledger/ knowledge/ experiments/ docs/` from the
      repository root: four proposals (IDEA-20260805-5194f9, IDEA-20260807-c4f1fc, IDEA-20260809-ce875b,
      IDEA-20260809-7f2d9c), one question (RQ-SHATHREE-cd2cb2), GOAL-SHA3-001 and five sibling goals,
      two decisions, and a block of KN-LIT files. Then per-noun counts over ledger/proposals/ and
      ledger/hypotheses/: translation-invariant (4, all ECDLP/AES), symmetry-decay (0), "internal
      differential" (0), sponge (2), "invariant subspace" (2), "chi step" (0), "rate/capacity" (0).
      Read RQ-SHATHREE-cd2cb2 in full, GOAL-SHA3-001, KN-TECH-080 in full, docs/inventor-protocol.md
      sections 1-8, and headers of KN-TECH-066, KN-TECH-073, KN-TECH-074, KN-TECH-056. Additionally
      grepped ledger/proposals and ledger/hypotheses for `random permutation`, `null object`, `matched
      shape` and `nearby object`, and read the AES null-control framing referenced in the established-results
      list.'
    results: Null-object controls are pervasive in this repository as a methodology (docs/inventor-protocol.md
      section 3, KN-TECH-056, KN-TECH-080 audit 4) and the AES r=5..7 lane already carries measured
      effects with their null controls as an established internal result. What does not exist anywhere
      is a Keccak-shaped random permutation family or any null for a sponge permutation. No record
      constructs a z-equivariant random linear layer or any circulant-over-GF(2)[z]/(z^64-1) object.
    verdict: 'UNVERIFIED. Nothing asserted about external literature, where random-permutation families
      of this type are very likely standard. NEW relative to this repository: the shape-matched equivariant
      null family and the three-way comparison. ASSEMBLED FROM KNOWN PARTS: the null-object discipline
      is inventor-protocol section 3 verbatim; the nearby-object control is KN-TECH-080 audit 4 verbatim;
      the measurement code is the companion active-row contract''s, reused unchanged, which is deliberate
      -- a control that runs different code is not a control.'
  object_first_candidate:
    tracked_object: The same deviation vector D_r = A_r XOR tau_32(A_r) that the companion contracts
      track, but followed under a randomly drawn member of the Keccak shape class rather than under
      Keccak itself; the object of study is the DISTRIBUTION of the resulting curves over the shape
      class, with Keccak as one point in it.
    lossiness: 'The deviation vector discards the 800-dimensional symmetric component exactly as in
      the companion contract. The additional projection specific to this entry is the reduction of
      a whole permutation to its curve triple (active rows, weight, z-support) per round: an enormous
      discard, from a member of a family of size far beyond 2^1000 down to 36 integers. That discard
      is compatible with the question being asked -- whether Keccak''s curve is typical -- precisely
      because typicality is a statement about the low-dimensional summary and not about the permutation.
      It is honestly noted that two permutations with identical curve triples can behave completely
      differently, which is the subject of the separate observation-collision entry.'
    propagation: One round of a sampled member acts on the deviation as D -> M(D) XOR c(D, A) XOR
      eps, where M is the sampled equivariant linear layer (a 25x25 matrix over GF(2)[z]/(z^64-1),
      guaranteed to commute with every tau_t) and c is the row-local nonlinear correction. The propagation
      law is structurally identical to Keccak's, which is what makes the comparison fair; only the
      coefficients differ.
    survival_score: For each arm, the round at which the active-row count first exceeds 160 and the
      round at which z-support first saturates at 64, reported as distributions over the 1000 sampled
      members with Keccak's values marked. The entry's headline is not a survival number but the QUANTILE
      at which Keccak's survival numbers sit within the equivariant null distribution.
  null_object_control: 'This entry IS the null-object control for the bucket, so its own control is
    a positive one: the non-equivariant arm, in which the linear layer is drawn with matched density
    but no commutation constraint. For the equivariant null to be interpretable, the non-equivariant
    arm must show visibly different behaviour -- specifically the fixed subspaces S_t must fail to
    be preserved, and the deviation must become nonzero even with all constants set to zero. If the
    two null arms are indistinguishable on every reported statistic, the measurement cannot see the
    property it was designed around and the entire bucket''s framing needs rebuilding, which is the
    most valuable single outcome this entry could produce.'
  discriminated_from:
  - The companion active-row contract's NULL-A and NULL-B arms -- those randomise only the round constants
    and keep Keccak's linear and nonlinear layers, so they cannot separate 'property of Keccak' from
    'property of the shape'; this entry randomises the layers, which is the separation they cannot
    make.
  - 'The AES r=5..7 null controls, an established internal result -- same methodological role, entirely
    different object: a byte-oriented SPN with no translation group, and its nulls are not shape-matched
    permutations of a sponge state.'
  - Generic 'compare to a random function' baselines -- the null here is constrained to preserve the
    exact symmetry structure under study, which is the opposite of a generic baseline and is what
    makes a match informative rather than trivial.
  - The observation-collision entry in this bucket -- that one holds the curve fixed and varies the
    permutation within a characterised fiber; this one varies the permutation freely and looks at
    the curve distribution.
  assumptions:
  - A z-equivariant GF(2)-linear map on 25 lanes of 64 bits is exactly a 25x25 matrix over the ring
    GF(2)[z]/(z^64 - 1); this algebraic characterisation is verified on sampled members rather than
    assumed.
  - Density matching between the sampled linear layer and theta.rho.pi is a fair basis for comparison;
    alternative matchings (branch number, rank profile) are reported as sensitivity arms.
  - A uniformly random 5-bit permutation is an adequate stand-in for chi in the nonlinear slot; a
    degree-2-only variant is listed as a derivation gap.
  - 1000 samples give usable resolution on curve quantiles; this is a declared design choice, not
    a power calculation.
  predictions:
  - metric: fraction of sampled equivariant members that preserve every S_t for t | 64
    direction: higher
    minimum_effect: 1.0
  - metric: quantile of Keccak's round-6 active-row count within the equivariant null distribution
    direction: different
    minimum_effect: predicted to fall INSIDE the central 80 percent, i.e. Keccak is typical for its
      shape on this statistic; a position outside is the interesting outcome and is not pre-committed
      against
  - metric: fraction of non-equivariant members with nonzero deviation under all-zero constants
    direction: higher
    minimum_effect: 0.99
  - metric: separation between the equivariant and non-equivariant null distributions on round-6 active-row
      count
    direction: different
    minimum_effect: 50
  minimal_test:
    design: 'The cheapest discriminating version needs 50 samples per arm and about twenty minutes
      of CPU. Draw 50 random 25x25 matrices over GF(2)[z]/(z^64 - 1) with density matched to theta.rho.pi,
      reject singular draws, and verify on each that the induced 1600x1600 GF(2) matrix commutes with
      tau_t for all six nontrivial divisors -- a deterministic matrix check with no sampling. Draw
      50 non-equivariant matrices of the same density and verify that they do NOT commute. Then, with
      all round constants set to zero, run the deviation recursion from a symmetric start on both
      arms: the equivariant arm must give an identically zero deviation at every round, and the non-equivariant
      arm must give a nonzero one almost always. That single pair of outcomes validates the entire
      control design before a single curve is compared, and costs almost nothing. Only then draw the
      constants and run the twelve-round curves for the three arms. If the zero-constant validation
      fails, the family construction is wrong and no curve comparison would have been interpretable.'
    controls:
    - 'Zero-constant validation: equivariant members must give identically zero deviation from a symmetric
      start; non-equivariant members must not.'
    - 'Commutation check: every sampled equivariant member''s induced 1600x1600 matrix must commute
      with tau_t for all t | 64, by exact matrix comparison.'
    - 'Singularity rejection: non-invertible linear layers are rejected and the rejection rate is
      reported, since a singular layer is not a permutation and would bias the curves.'
    - 'Density-matching sensitivity: repeat with branch-number matching and with rank-profile matching
      as declared secondary arms.'
    - 'Code-identity control: the curve computation is the byte-identical function used by the companion
      active-row contract, invoked with a different permutation object.'
    required_metrics:
    - commutation verdict per sampled member per t
    - zero-constant deviation weight per arm
    - active-row, Hamming-weight and z-support curves for r = 1..12, per member
    - quantile position of Keccak's curve within each null distribution, per round and statistic
    - singular-draw rejection rate
    - separation statistic between equivariant and non-equivariant null distributions
  falsification_conditions:
  - A sampled equivariant member fails to commute with some tau_t, falsifying the algebraic characterisation
    of the family.
  - The equivariant arm shows nonzero deviation under zero constants, falsifying the construction.
  - The non-equivariant arm shows zero deviation under zero constants, meaning the arm is not actually
    breaking the symmetry.
  - The equivariant and non-equivariant null distributions are indistinguishable on every statistic
    -- the measurement is blind to its target property and the bucket's framing must be rebuilt.
  - Keccak's curve falls outside the central 99.9 percent of the equivariant null on every statistic
    at every round, which would be a surprisingly strong signal and would demand its own replication
    before anything is inferred.
  confounders:
  - Density is only one way to match a linear layer, and a density-matched random circulant may have
    a very different branch number from theta.rho.pi, making Keccak look atypical for reasons unrelated
    to symmetry; the two sensitivity arms exist for this.
  - A uniformly random 5-bit permutation has different degree and DDT profile from chi, so nonlinear-layer
    differences could be attributed to the linear layer.
  - Rejecting singular draws changes the sampling distribution in a way that is hard to characterise;
    the rejection rate is reported so a reviewer can judge it.
  - Quantile positions over 1000 samples have coarse tails, so 'outside the central 99.9 percent'
    is barely resolvable and is reported as such rather than as a p-value.
  - Reusing the companion contract's code makes the control faithful but also means a bug in that
    code affects both arms identically and cancels rather than shows -- the zero-constant validation
    is the guard against this.
  interpretation_limits:
  - A match between Keccak and the equivariant null is not a criticism of SHA-3 and not evidence about
    its security; it constrains what the companion contracts' curves may be credited with explaining.
  - A separation between Keccak and the null is not evidence of a weakness either; it would only mean
    the curve carries SHA-3-specific information, which is a prerequisite for, not an instance of,
    cryptanalysis.
  - The shape class is defined by this contract and is not the only reasonable one; conclusions are
    scoped to the family as constructed.
  - Round-reduced structural measurement only; nothing bears on full 24-round SHA-3 or any deployed
    use.
  target_complexity:
    time_exponent: No attack exponent is claimed. Sampling and curve computation for 2000 members
      at twelve rounds is under 2^38 bit operations.
    memory_exponent: No attack memory exponent is claimed. One 1600x1600 GF(2) matrix per member held
      transiently, about 320 KiB.
    best_known: No incumbent is challenged; this contract produces no attack. Within this repository
      the incumbent control practice for symmetric primitives is the AES lane's null controls, and
      this entry extends that practice to a permutation with a translation group, which the AES object
      does not have.
    hidden_overhead: 'The human cost is in the fairness of the matching, which is where a control
      quietly becomes a straw man. The lower-order term is the nonlinear slot: a uniformly random
      5-bit permutation is easy to sample and is not what chi is, and the gap between them absorbs
      an unknown share of any observed separation.'
  dominated_by: 'n/a (no result claimed). Every frontier axis checked: no attack time, memory or data/query
    row is produced, so no frontier position is held. The comparison performed is between curve distributions
    of permutation families, which is not an attack frontier.'
  sota_delta: no attack; conceptual/measurement contribution only. Output is a set of curve distributions
    and Keccak's quantile position within them.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the algebraic characterisation of z-equivariant linear layers as
    25x25 matrices over GF(2)[z]/(z^64-1) checks out on sampled members: 0.9. That the zero-constant
    validation separates the two null arms cleanly: 0.9. That Keccak''s curve falls inside the central
    80 percent of the equivariant null: 0.65 -- this is my expected outcome and it is the one that
    most constrains the rest of the bucket. That the entry changes a downstream decision: 0.6, higher
    than most entries here precisely because a controlled-null outcome would force the companion contracts
    to restate their claims.'
