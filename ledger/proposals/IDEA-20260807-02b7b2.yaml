      class-invariance statement the incumbent is T4 of the campaign's own
      decomposition, which lists fixed and varying quantities informally; this
      record replaces part of that list with a criterion and corrects one
      wording ambiguity in it.
    hidden_overhead: >-
      Nothing hides in an o(1) because there is no asymptotic claim. What DOES
      need disclosure: the entire practical value rests on the Step 2
      partition being drawn correctly, and a functional wrongly classified as
      an (O, pi, n)-function would produce a false flatness prediction. The
      partition is therefore pre-registered and auditable rather than asserted
      in passing.
    tradeoff_note: >-
      Not applicable -- no algorithm is produced and no cost is traded.

  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
