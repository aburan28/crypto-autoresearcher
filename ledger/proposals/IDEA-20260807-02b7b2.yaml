  heuristic_assumptions:
    - id: H1
      statement: >-
        NO HEURISTIC IS LOAD-BEARING. The ideal-subgroup correspondence, its
        equivariance, the constancy of (O, pi) on a crater, and the conductor
        formula are all theorems. Every prediction in this record is an exact
        integer or an exact equality, which is precisely why it makes a good
        calibration for lanes whose own predictions are statistical.
      rigorous_support: >-
        Deuring/Waterhouse/Kohel for the correspondence and the volcano
        structure; Cox for the conductor formula. Stated explicitly so that no
        conditionality is imported.
      validation_plan: >-
        The exact-equality predictions ARE the validation: a pipeline
        reproducing them exactly is working and one that does not is broken. No
        distributional comparison applies. LABELLED TOY SCALE for the
        implementation only.
    - id: H2
      statement: >-
        For a toy isogeny class enumerated by brute force, the number of
        F_p-isomorphism classes with End_{F_p} = O equals h(O) exactly, i.e.
        the Cl(O)-action on the crater is free and transitive.
      rigorous_support: >-
        This is the Deuring/Waterhouse theorem, not a heuristic; it is listed
        here because it is the one statement whose EMPIRICAL verification is
        both cheap and diagnostic, and because a mismatch is the fastest
        indicator that the enumeration or the twist handling is wrong.
      validation_plan: >-
        Count distinct F_p-isomorphism classes per crater over the full toy
        ladder and compare against h(O) computed independently by counting
        reduced binary quadratic forms -- two independent computations of the
        same integer. Tail check: the largest and smallest craters in the
        ladder, where off-by-one and twist errors show up first. LABELLED TOY
        SCALE.

  reachability_gate: >-
    T5 IS ANSWERED IN THE NEGATIVE DIRECTION FOR THIS LANE, AND THAT IS THE
    RECORD'S CONTRIBUTION TO THE GATE. T5 says a cost-minimising curve in the
    class is useful only if goodness is common enough to hit by random walking
    or detectable by a local test. This record shows there is NO goodness TO
    reach for any (O, pi, n)-functional: the landscape is exactly flat on the
    crater, so both branches of the dichotomy are vacuous for that family and
    the reachability question does not even arise. Concretely, no proposal in
    this lane may claim value from walking to a better curve as measured by an
    R3/R4 functional, at any cost, because there is no better curve. The gate
    therefore binds trivially here, and the open reachability question is
    confined to the R1/R2 functionals -- which is exactly where lanes L1 and
    L11 already put it.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR IMPLIED. The record produces a variance
      statement, not an algorithm. Its own computational cost is one toy class
      enumeration, dominated by point counting over all curves at a toy p,
      which is O(p) curves times a point count each -- affordable only at toy
      scale and shared with lane L1's instrument.
    memory_exponent: >-
      O(h) per crater to store the curve list and their invariants; negligible.
    best_known: >-
      For prime-field ECDLP, 0.886 sqrt(N) parallel rho with O(1) memory
