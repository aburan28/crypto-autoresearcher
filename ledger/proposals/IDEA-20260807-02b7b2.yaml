idea:
  id: IDEA-20260807-02b7b2
  question_id: RQ-CLGP-b99df5
  added: '2026-08-07'
  title: >-
    A PROVED ZERO-VARIANCE FAMILY FOR THE CAMPAIGN'S GATING LANE: the target
    subgroup's kernel ideal is n = (N, pi - 1), literally the SAME ideal of O
    for every curve on a crater, so every attack-cost functional that is a
    function of (O, pi, n) alone has provably zero within-crater variance --
    which tells lane L1 in advance which functionals cannot possibly vary, and
    predicts that all between-level variation is exactly accounted for by the
    conductor formula with no residual
  class: measurement

  claim: >-
    (A) THE ELEMENTARY FACT, STATED SHARPLY. Let E/F_p be ordinary with
    End_{F_p}(E) = O and Frobenius pi, and let G be the subgroup of E(F_p) of
    prime order N with N^2 not dividing #E(F_p). Then G = E[n] for the O-ideal
        n = (N, pi - 1),
    of norm N, dividing (pi - 1) because G is contained in ker(pi - 1) =
    E(F_p). Now let E' = [a] * E be any other curve on the SAME CRATER (same
    O, hence same level of every ell-volcano for ell not dividing the
    conductor), reached by an isogeny phi_a of degree coprime to N. The
    ideal-subgroup correspondence is equivariant for the class-group action, so
        phi_a( E[n] ) = E'[n],
    with THE SAME IDEAL n. The pair (O, pi) is a class invariant by
    construction (the class fixes t, hence pi and its minimal polynomial), and
    n = (N, pi - 1) is written in terms of (O, pi, N) alone. HENCE n IS THE
    SAME OBJECT FOR EVERY CURVE ON THE CRATER, and so is its class [n] in
    Cl(O).

    (B) THE CONSEQUENCE, WHICH IS THE POINT. Let C be any attack-cost
    functional on curves that can be written as a function of (O, pi, n) --
    equivalently, of the arithmetic of the endomorphism ring together with the
    kernel ideal of the target subgroup, with no reference to the curve's
    equation, model or coordinates. Then
        C IS CONSTANT ON EVERY CRATER, exactly, with zero variance.
    This is a THEOREM, not a measurement, and it is exactly the kind of
    statement lane L1 (RQ-ICINV-475b5e) exists to produce -- T3 of the
    campaign's decomposition says an attack-cost functional provably constant
    on the isogeny class closes that axis for that functional, with a named
    obstruction, and that this is a legitimate closure. This record supplies
    such a closure for a whole FAMILY of functionals in advance, at zero
    compute, so L1 need not spend measurement budget discovering it.

    (C) THE FAMILY, ENUMERATED CONCRETELY SO IT IS USABLE. Provably
    within-crater constant: h(O) and the full group structure of Cl(O); the
    class [n] and its order in Cl(O); the norm form of O and every
    representation number; the splitting behaviour of every rational prime in
    O, hence the Elkies/Atkin classification and the number of rational
    ell-isogenies at each level; the discriminant D and conductor f;
    #E(F_p) = N(pi - 1), N, the cofactor, and the embedding degree; the
    minimal norm of an ideal in any fixed class; the entire ell-volcano shape.
    Provably NOT in the family, hence permitted to vary: the j-invariant; the
    Weierstrass or Montgomery coefficients; every x-coordinate statistic;
    Semaev summation-polynomial coefficients and every Groebner-basis proxy
    computed from them; the height of j; the model-dependent quantities lane
    L11 studies. The dividing line is exactly RESOURCE: R3/R4 quantities are
    in the family, R1/R2 quantities are not.

    (D) THE BETWEEN-LEVEL PREDICTION, WHICH IS THE FALSIFIABLE PART. Curves in
    one isogeny class at DIFFERENT volcano levels have different orders O_f of
    conductor f, so (A) applies per level and not across levels. Across levels
    the family's members change, but they change COMPUTABLY, by the class
    number formula for non-maximal orders
        h(O_f) = h(O_K) f prod_{l | f} (1 - (D_K/l)/l) / [O_K^* : O_f^*].
    PREDICTION: for every functional in the family, ALL between-level variation
    is explained by that formula with NO RESIDUAL. Any residual between-level
    variation in an (O, pi, n)-functional would mean the functional is not
    actually in the family, or that the level classification is wrong.
    This turns a definition into a testable statement, and it is the reason
    this record is a measurement proposal rather than a note.

    (E) THE DISCRIMINATION, AND BOTH OUTCOMES ARE USEFUL.
      OUTCOME 1 (predicted). Every family functional measures exactly constant
      within crater and exactly conductor-explained across levels, while every
      non-family functional (j, the coefficients, the Groebner proxies) varies
      within crater. Then lane L1's within-class variance question is settled
      for the R3/R4 half of its functional list BY PROOF, and L1's budget goes
      entirely to the R1/R2 half where the answer is genuinely unknown. That
      is a real saving and a real closure.
      OUTCOME 2. Some family functional measures NON-constant within a crater.
      Then either the crater classification is wrong (most likely: the
      conductor or the level was misidentified, or N^2 divides the group order
      so G is not unique), or the equivariance of the ideal-subgroup
      correspondence is being violated by the implementation. Either way it is
      an instrument failure that must be fixed before ANY L1 measurement is
      trusted -- which makes this record a prerequisite calibration for the
      gating lane rather than a competitor to it.

  resource_label: >-
    R3 (End(E) as a ring: the order O, the ideal n = (N, pi - 1), the class
    group and the conductor formula) and R4 (the class-group action, whose
    equivariance is what makes n class-wide). No R1 or R2 quantity is used;
    identifying which functionals lie outside R3/R4 is part of the deliverable.
  admissibility: admissible
  admissibility_argument: >-
    Admissible: the resource is the ring structure of O and the ideal n, both
    invisible to a generic group oracle for G -- a generic oracle cannot
    express "the ideal of norm N dividing pi - 1". No endomorphism is applied
    to a point of G, so H-ENDO-001's scalar collapse does not apply and neither
    closed oracle class of KN-FIND-b7e091 is used. The proposal then produces a
    NEGATIVE (zero variance) for a reason unrelated to admissibility, which is
    the useful outcome: it shows that a lane can clear the resource filter and
    still contain a provably flat cost landscape.

  discriminated_from:
    - >-
      Lane L1 (RQ-ICINV-475b5e), which MEASURES within-class variance of
      Groebner/Semaev proxies. This record PROVES zero variance for a disjoint
      family -- the R3/R4 functionals -- and predicts that L1's own functionals
      (R1/R2) are exactly the ones permitted to vary. It does not duplicate L1
      and it does not pre-empt L1's measurement; it partitions L1's functional
      list into a proved half and an open half.
    - >-
      Lane L2 (RQ-VOLC-f6253b), which stratifies measurements by volcano
      level. This record supplies L2's between-level NULL MODEL: the conductor
      formula, against which any claimed level effect must be compared. A level
      effect fully explained by the conductor formula is not a finding; L2's
      real question is whether any RESIDUAL survives, and this record makes
      that question precise.
    - >-
      IDEA-20260807-5d7606, which uses the same ideal n to prove the
      point-to-curve bridge constant in k. That is a statement about varying k
      with the curve FIXED. This is a statement about varying the CURVE with
      k irrelevant. The two are orthogonal and each uses n for a different
      purpose; together they say n is constant in both directions, which is
      why the lane is flat.
    - >-
      T2 of the campaign's decomposition (class-wide vulnerability), which says
      ECDLP difficulty is constant across the class up to transport cost. That
      is a statement about the PROBLEM. This is a statement about a family of
      MEASURED FUNCTIONALS, which is finer: T2 does not by itself tell you
      which measurable proxies are flat, and several are not.

  object_first_candidate:
    tracked_object: >-
      THE KERNEL IDEAL n = (N, pi - 1) OF THE TARGET SUBGROUP, and its class
      [n] in Cl(O), followed as the curve moves around the crater and up and
      down the volcano.
    lossiness: >-
      LOSSY: it forgets the curve's equation, its j-invariant, its model, the
      points themselves, and the choice of generator P, retaining an ideal of
      the endomorphism ring. What it discards is discarded compatibly with the
      target's operations because the ideal-subgroup correspondence is
      equivariant for the class-group action -- so the retained part propagates
      deterministically under precisely the operations that move a curve within
      its class. It is not a change of coordinates: the whole crater, of size
      h ~ sqrt(p), collapses to one ideal.
    propagation: >-
      One-step propagation is defined and CHEAPLY MEASURABLE, which is what
      makes this a real object rather than a definition: apply one small-prime
      isogeny step and recompute n on the target curve. Within the crater the
      answer is the identical ideal, every time. Crossing a volcano level
      changes the ambient ring and the propagation is given by the conductor
      formula. Both propagations are stated before measurement, and the
      within-crater one has zero degrees of freedom.
    survival_score: >-
      Survives every isogeny of degree coprime to N on a fixed crater --
      indefinitely, since it never changes. Changes computably across volcano
      levels. DIES as a well-defined object when N^2 divides #E(F_p) (G is no
      longer the unique order-N subgroup) or when the transporting isogeny has
      degree divisible by N (transport is no longer injective on G). Both death
      conditions are checkable per instance and both are excluded by
      hypothesis, so the object's domain of validity is explicit.

  mechanism: >-
    STEP 1 (zero compute). Prove (A): state the ideal-subgroup correspondence
    for ordinary curves with End_{F_p}(E) = O, verify n = (N, pi - 1) has norm
    N and annihilates G, and verify equivariance phi_a(E[n]) = E'[n] for a
    coprime to n. Record the two hypotheses (N^2 not dividing the group order;
    deg phi coprime to N) as the object's domain.

    STEP 2 (zero compute). Enumerate the family (C) explicitly and, for each
    candidate functional the campaign's other lanes propose to measure, decide
    IN ADVANCE whether it is an (O, pi, n)-function. Publish the partition
    before L1 measures anything, so that a flat measurement is a CONFIRMED
    PREDICTION rather than a post-hoc explanation. This pre-registration is the
    record's main methodological contribution.

    STEP 3 (toy compute, cheap). Enumerate a complete toy isogeny class:
    all curves with a fixed trace t at a toy p, classified by volcano level via
    counting rational ell-isogenies for each small ell dividing the conductor.
    For every curve compute O, h(O), n, [n] and the order of [n]; assert exact
    equality of the family functionals within each crater.

    STEP 4 (toy compute, THE DISCRIMINATING CONTROL). On the SAME enumerated
    class, compute a set of NON-family functionals -- j-invariant, Weierstrass
    coefficients, a low-cost Semaev/Groebner proxy at m = 3, and an
    x-coordinate distribution statistic -- and assert they DO vary within the
    crater. This is the control that makes the zero-variance result meaningful:
    an instrument that reports zero variance for everything is broken, and
    without this arm the family result is untestable.

    STEP 5 (toy compute). The between-level test: compare measured
    level-to-level ratios of h(O) against the conductor formula, and report the
    RESIDUAL. Predicted exactly zero (to floating-point or exact arithmetic
    precision, since these are integers).

    STEP 6 (zero compute). Hand the partition and the between-level null model
    to lanes L1 and L2 with an explicit statement of what remains open: the
    R1/R2 half of L1's functional list, where nothing here applies.

  novelty_status: adaptation
  novelty_screen:
    method: >-
      Repository greps on 2026-08-07 over ledger/, knowledge/, docs/,
      analysis/: "kernel ideal|ideal-subgroup"; "class invariant|within-class
      variance|isogeny class invariance"; "conductor formula|volcano level";
      "(N, pi - 1)". Full reads: DECOMPOSITION.md sections 3-5 (T1-T5, lanes
      L1, L2, L10), RQ-ICINV-475b5e, RQ-VOLC-f6253b, RQ-CLGP-b99df5,
      KN-FIND-b7e091. Also inspected inputs/refs/research/
      p256_isogeny_class_invariance.md as a prior-art pointer, noting it is an
      INPUT document and not a ledger or knowledge record, so it carries no
      evidential standing in this program.
    results: >-
      DECOMPOSITION.md T4 already lists what is fixed by fixing t (p, N,
      #E(F_p), embedding degree, K, D) and what varies (j, the model, the
      volcano level, h(End(E)), the number of rational ell-isogenies). This
      record is finer in two ways not present anywhere in the corpus: it
      identifies the KERNEL IDEAL n as a class-wide constant, and it converts
      "what is fixed" into a PROVED CLOSURE for an entire functional family
      with a stated criterion. Note one correction this record owes to T4: T4
      lists "the number of F_p-rational ell-isogenies at each level" as
      varying, whereas within a fixed crater it is determined by the splitting
      of ell in O and is therefore constant -- the variation T4 refers to is
      BETWEEN levels. That distinction is exactly what (A) and (D) separate,
      and flagging it is part of this record's value.
    verdict: >-
      ADAPTATION. The ideal-subgroup correspondence, its equivariance, and the
      conductor formula are all classical (Deuring, Waterhouse, Kohel; Cox for
      the conductor formula). New to this corpus: the identification of
      n = (N, pi - 1) as the class-wide kernel ideal of the ECDLP target
      subgroup, the (O, pi, n)-functional family as a proved zero-variance
      class, the pre-registered partition of L1's functional list, and the
      conductor formula as L2's between-level null model. No external novelty
      is claimed; all of this is likely folklore to a specialist and a citation
      would be strictly better than this record.

  null_object_control: >-
    MANDATORY AND BLOCKING, and here the null is a NON-NULL: the control arm
    of Step 4. Matched object of the same shape: the identical enumerated
    crater, the identical pipeline, the identical assertion of within-crater
    equality -- applied to functionals OUTSIDE the family (j-invariant,
    Weierstrass coefficients, an m = 3 Groebner proxy, an x-coordinate
    statistic). Those MUST vary. A pipeline that reports zero within-crater
    variance for the j-invariant is comparing the wrong objects (most likely it
    has collapsed isomorphic curves incorrectly, or is enumerating one curve
    repeatedly), and every zero-variance result it produces is void: the run
    set is INVALID, not confirmatory.
    DECAY PARAMETER: h(O), the crater size. As h grows, the within-crater
    variance of the NON-family functionals must GROW (more distinct curves,
    more distinct j-invariants) while the family functionals stay exactly
    constant. The two must move in opposite directions under the same
    parameter, which is a much stronger check than either alone. A family
    functional whose measured variance grows with h is the canonical artifact
    tell and indicates the crater classification is leaking curves from another
    level.
    SECOND CONTROL: a PLANTED violation. Deliberately mis-assign one curve to
    the wrong volcano level and confirm the pipeline detects the resulting
    inconsistency in h(O). An instrument that cannot detect a deliberately
    misclassified curve cannot certify a correct classification.

  assumptions:
    - >-
      E is ordinary over F_p, End_{F_p}(E) = O, and N is prime with N^2 not
      dividing #E(F_p), so G is the unique subgroup of order N and n is
      well defined. CHECKED per instance and instances failing it are recorded
      separately, since they are a legitimate and interesting boundary case
      rather than noise.
    - >-
      All transporting isogenies have degree coprime to N. Automatic for the
      small-prime walks used, since N ~ p.
    - >-
      Volcano level is determined by counting F_p-rational ell-isogenies for
      each small ell dividing the conductor, i.e. by the Kohel/Fouquet-Morain
      classification. The classification is implemented and CHECKED against the
      conductor formula rather than trusted, because a misclassification is the
      most likely cause of a false positive in Outcome 2.
    - >-
      Toy scale: p up to ~24 bits, so a complete isogeny class can be
      enumerated by brute-force point counting over all curves and Cl(O)
      computed exactly by counting reduced binary quadratic forms.
    - >-
      The conductor formula for h(O_f) is quoted as classical (Cox, Primes of
      the form x^2 + n y^2, Theorem 7.24 or equivalent). It is verified
      numerically at toy scale rather than assumed.

  proof_search_map:
    bottleneck: >-
      Step 2's classification of each candidate functional as inside or outside
      the (O, pi, n) family. The theorem in (A) is elementary; the entire
      practical value depends on whether the partition is drawn correctly, and
      a functional wrongly placed inside the family would produce a false
      prediction of flatness that L1 would then measure and contradict.
    baseline_embedding:
      parameter_slice: >-
        h(O) = 1, a crater with a single curve. Every functional is then
        trivially constant, family or not, and the design must NOT report that
        as a confirmation. This degenerate slice is where a careless pipeline
        would declare victory, so it is the explicit baseline check.
      reproduction_check: >-
        Frozen fixture: one toy class with h(O) = 1 and one with h(O) >= 20.
        The h = 1 case must be flagged as UNINFORMATIVE by the pipeline itself,
        automatically, and the h >= 20 case must show family flat and
        non-family varying. A pipeline that treats h = 1 as evidence is
        rejected.
    observation_collision:
      observable: >-
        The ideal n and its class [n] in Cl(O).
      distinct_preimage_search: >-
        REQUIRED AND EXPECTED TO SUCCEED TOTALLY: find two distinct curves on
        the crater with the same n. Predicted: all h of them, so the fibre of
        the observable over its single value is the entire crater. This is the
        maximal collision and it IS the zero-variance statement. The
        informative question is the complementary one, and it is asked in the
        control arm: do the NON-family observables separate the curves? They
        must, or the crater has not actually been enumerated.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the ad hoc list of "things fixed by fixing t" in T4 with the
          structured statement "every (O, pi, n)-function is crater-constant",
          which is a criterion rather than a list and therefore covers
          functionals nobody has thought of yet.
        predicted_gain: >-
          Closes an unbounded family of future proposals at zero compute, and
          gives the campaign a one-line test to apply to any newly proposed
          cost functional before budgeting a measurement for it.
      - transform: specialization_pack
        proposed_object: >-
          Decompose the class into craters by level and treat each level
          separately, packing the levels back together via the conductor
          formula.
        predicted_gain: >-
          Converts a single noisy "within-class variance" number into a
          two-part decomposition -- exactly zero within crater, exactly
          conductor-explained between craters -- which is far more diagnostic
          and makes any residual immediately visible.
    quantifier_order: >-
      ASSERTED: FORALL ordinary E/F_p with End_{F_p}(E) = O and N prime with
      N^2 not dividing #E(F_p), and FORALL E' on the same crater reached by an
      isogeny of degree coprime to N, THERE EXISTS a single ideal n of O --
      namely (N, pi - 1) -- such that FORALL such E', the target subgroup of
      E' equals E'[n].
      The order matters: n is quantified BEFORE E', which is what makes it a
      class-wide constant rather than a per-curve object. The weaker and
      useless reading, NOT claimed: FORALL E' THERE EXISTS an ideal n_{E'}
      with G' = E'[n_{E'}] -- true for every curve separately and carrying no
      invariance content whatever. Distinguishing these two is the entire
      difference between a theorem and a triviality, and it is the reason the
      order is written out.
      CONSEQUENTLY: FORALL functionals C expressible as a function of
      (O, pi, n), FORALL craters, C is constant on the crater.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Every attack-cost functional expressible in terms of (O, pi, n) has
        exactly zero within-crater variance, and its between-level variation is
        exactly the conductor formula." It can NEVER certify anything about
        R1/R2 functionals -- j-invariant, curve model, x-coordinate statistics,
        Semaev/Groebner proxies -- which are precisely lane L1's actual
        subject, nor anything about ECDLP hardness.
      nearby_object_control: >-
        THE NON-FAMILY FUNCTIONALS of Step 4, where the conclusion FAILS by
        construction. The argument must not "prove" the j-invariant constant on
        the crater; if a version of it does, it has confused isomorphism
        classes with isogeny classes, which is the single most likely error in
        this area.
    proof_obligations:
      - claim: >-
          n = (N, pi - 1) has norm N and G = E[n].
        responsibility: correctness
      - claim: >-
          phi_a(E[n]) = E'[n] for a coprime to n (equivariance).
        responsibility: correctness
      - claim: >-
          (O, pi) is constant on the crater.
        responsibility: correctness
      - claim: >-
          Hence every (O, pi, n)-function is crater-constant.
        responsibility: correctness
      - claim: >-
          Between-level variation of h(O_f) matches the conductor formula with
          zero residual.
        responsibility: baseline
      - claim: >-
          The non-family control functionals do vary within the crater.
        responsibility: soundness
      - claim: >-
          The functional partition of Step 2 assigns each of L1's candidate
          functionals correctly.
        responsibility: scope

  predictions:
    - metric: >-
        within-crater variance of each family functional (h(O), [n], order of
        [n], splitting type of small primes, number of rational ell-isogenies
        at the level)
      direction: lower
      minimum_effect: >-
        EXACTLY ZERO, in exact integer arithmetic, on 100 percent of craters
        with h(O) >= 20. Not "small" -- exactly zero. Any nonzero value is an
        instrument or classification failure and halts the line.
    - metric: >-
        within-crater variance of each control functional (j-invariant,
        Weierstrass coefficients, m = 3 Groebner proxy, x-coordinate statistic)
      direction: higher
      minimum_effect: >-
        Strictly positive on 100 percent of craters with h(O) >= 20, with the
        number of distinct j-invariants equal to h(O). Fewer distinct
        j-invariants than h(O) means the enumeration is collapsing curves and
        the whole run set is void.
    - metric: >-
        residual between-level variation of h(O_f) after the conductor formula
        is applied
      direction: lower
      minimum_effect: >-
        Exactly zero in exact arithmetic. A nonzero residual means either the
        level classification or the formula implementation is wrong, and lane
        L2's stratification would inherit the same error.
    - metric: >-
        number of distinct j-invariants on a crater as a function of h(O)
      direction: higher
      minimum_effect: >-
        Exactly h(O), confirming the free transitive action empirically. This
        is the cheapest possible verification of the Deuring/Waterhouse
        statement the whole lane rests on, and it should be run first.

  minimal_test:
    design: >-
      STAGE 0 (zero compute): prove (A); enumerate the family; pre-register
      the partition of L1's candidate functional list. This is the entire
      intellectual content and it costs nothing.
      STAGE 1 (minutes): enumerate one complete toy isogeny class by brute
      force over all curves at a toy p; count distinct j-invariants per crater
      and compare against h(O). This single check verifies the free transitive
      action empirically and is the cheapest sanity gate in the batch.
      STAGE 2 (minutes, HARD GATE): compute the family functionals per curve
      and assert exact within-crater equality; compute the control functionals
      and assert within-crater variation. Both must fire.
      STAGE 3 (minutes): the between-level conductor-formula residual, in
      exact arithmetic.
      STAGE 4 (minutes): the planted-misclassification control.
      STAGE 5 (zero compute): hand the partition and the null model to L1 and
      L2.
      NOTE ON EXECUTION: Stages 1-4 share their entire instrument with lane
      L1's enumeration. The coordinator should schedule this as a rider on
      L1's run rather than as a separate experiment; its marginal compute cost
      is then near zero.
    controls:
      - >-
        non-family functionals -- MUST vary within crater
      - >-
        distinct j-invariant count equal to h(O) -- verifies free transitivity
      - >-
        planted misclassification of one curve's level -- MUST be detected
      - >-
        h(O) = 1 craters flagged automatically as uninformative
      - >-
        instances with N^2 dividing the group order recorded separately, not
        discarded
    required_metrics:
      - per-curve (p, t, D, f, level, O, h(O), n, [n], order of [n])
      - within-crater variance of every family and control functional, in exact
        arithmetic
      - distinct j-invariant count per crater against h(O)
      - between-level h(O_f) ratios against the conductor formula, with residual
      - pass/fail of the planted-misclassification control

  falsification_conditions:
    - >-
      Any family functional varies within a crater with h(O) >= 20 while the
      level classification control passes. Either the equivariance claim or the
      crater classification is wrong; halt, debug, and do NOT report as
      mathematics until independently replicated -- the underlying statement is
      elementary, so a violation is far more likely an implementation error,
      but if it survives replication it invalidates lane L2's stratification
      too and must be escalated.
    - >-
      A control functional (notably the j-invariant) is constant within a
      crater. The enumeration is collapsing curves; every zero-variance result
      is void and the run set is INVALID rather than confirmatory.
    - >-
      The distinct j-invariant count differs from h(O). The free transitive
      action is not being realised as implemented; nothing downstream is
      interpretable.
    - >-
      A nonzero residual survives the conductor formula between levels. The
      between-level null model is wrong and lane L2 must not use it.
    - >-
      The planted misclassification is not detected. Instrument blind; the
      classification cannot be certified and neither can any stratified
      measurement built on it.

  confounders:
    - >-
      ISOMORPHISM VERSUS ISOGENY. The single most dangerous confounder here.
      Curves isomorphic over F_p share a j-invariant but so can non-isomorphic
      twists; and the class-group action is on F_p-isomorphism classes with
      End exactly O. A pipeline that deduplicates by j-invariant alone will
      merge twists and produce a distinct-j count below h(O). Deduplication is
      by F_p-isomorphism class, and the twist handling is stated explicitly.
    - >-
      TWISTS ARE NOT IN THE CLASS. E and its quadratic twist have traces t and
      -t. Including twists inflates the apparent class size by a factor 2 and
      would break every count.
    - >-
      LEVEL MISCLASSIFICATION. Counting rational ell-isogenies is the standard
      level test but is delicate when ell is small or divides the conductor to
      high multiplicity. The planted-misclassification control exists for
      exactly this and is blocking.
    - >-
      N^2 DIVIDING THE GROUP ORDER. Then G is not the unique order-N subgroup
      and n is not uniquely determined by (N, pi - 1) as claimed. These
      instances are recorded separately; they are a boundary case worth its own
      note, not noise to be dropped.
    - >-
      TINY CRATERS. At h(O) <= 3 everything is nearly constant for trivial
      reasons. The h >= 20 threshold is pre-registered and h is reported with
      every number.
    - >-
      T4 WORDING. The campaign's own decomposition lists the number of rational
      ell-isogenies as varying within the class; that is true BETWEEN levels
      and false WITHIN a crater. Any pipeline written against T4's wording
      rather than against (A) will encode the wrong prediction, and the
      write-up must flag the distinction rather than silently differ from the
      frozen decomposition.

  interpretation_limits:
    - >-
      A ZERO-VARIANCE RESULT IS A CLOSURE FOR THAT FUNCTIONAL FAMILY ONLY. It
      says nothing about the R1/R2 functionals that lane L1 actually measures,
