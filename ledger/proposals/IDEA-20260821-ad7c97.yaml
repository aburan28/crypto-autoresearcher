  novelty_screen:
    method: >-
      Filesystem screening only; the crypto-kb MCP retrieval server is bound to
      ':memory:' in this session and returns nothing, which is disclosed rather
      than worked around. Read: the session prior-art digest covering the claim
      of every one of the 197 filed ENDO-family proposals (12 under
      RQ-VOLC-f6253b); ledger/goals/GOAL-ENDO-001/goal.yaml; the RQ records for
      VOLC, TORS, MTGT, EWALK, CLGP; ledger/evidence/EV-ENDO-001.yaml and
      EV-ENDO-10109d.yaml in full; harness/exp_icinv.py and harness/run_blocknull.py
      in the relevant regions. WebSearch was used for external ingredient
      scouting on a different record in this session; no web source was opened
      for this record and none is cited as read.
    results: >-
      NEAREST FILED WORK, NAMED. (1) IDEA-20260808-4d77a6 derives that the
      volcano level is partially readable from the public group structure. It
      stops at readability and proposes no measurement. (2) IDEA-20260815-101067
      proposes running the standard cost battery across levels to test whether
      any campaign cost varies with level, with same-level and cross-class nulls.
      It is a generic stratification design that names no mechanism, no
      transmission channel and no specific class. (3) IDEA-20260811-565915 warns
      that every volcano regressor collapses to the single divisor f_E | c;
      this record uses that collapse deliberately rather than fighting it, since
      the 2-part of f_E is exactly the intended regressor. (4)
      IDEA-20260807-3f5545 treats the level as the vector (v_ell(f_E))_ell rather
      than a number. (5) EV-ICINV-343679 measured the 66/72 split and withdrew it
      as non-novel because it equals two_torsion_x_count, whose docstring already
      says it is not a class invariant.
    verdict: >-
      UNVERIFIED, and distinct from all five. What is new here is not that the
      level is readable, nor that cost might vary with level, but the closed-form
      identification of THIS committed census as the D_0 = -59, f = 16 class with
      level sizes (3, 9, 18, 36, 72) summing to exactly 138; the derivation that
      (pi - 1)/2 lies in O_c iff c | 8, which makes the already-measured and
      already-withdrawn 66/72 split the ell=2 floor indicator; and the
      identification of two concrete transmission channels (CH1 factor-base
      deficit, CH2 index-2 sampler confinement) that predict the campaign's own
      standing unexplained over-dispersion. No filed record connects the withdrawn
      66/72 split to the over-dispersion, and none observes that the sampler is
      subgroup-confined on exactly 66 of the 138 curves. Classical volcano theory
      and Lenstra's theorem are of course known; the honest label is `unverified`
      because no external source was opened in this session.

  object_first_candidate:
    tracked_object: >-
      The pair (H_E, +-F_V(E)) -- the sampler-reachable cyclic subgroup of
      E(F_p) together with the negated factor base -- followed across the
      isogeny class. Established families declared off-limits as the primary
      lens for this record: Semaev/Groebner solving-degree functionals, relation
      yield, rho step counts, and j-invariant support counts. The object here is
      neither a cost nor an invariant of the curve equation; it is a subgroup.
    lossiness: >-
      PASSES THE LOSSY-PROJECTION TEST. The projection E |-> (H_E, |+-F_V(E)|)
      discards the entire curve equation, all y-coordinates, the isogeny class
      structure, and every point of E(F_p) outside H_E; what survives is a
      subgroup index in {1,2} and an integer. It is not a change of coordinates:
      the fibre over (index 2, size 25) contains many non-isomorphic curves at
      four distinct volcano levels. The discarded part is discarded compatibly
      with the operation the measurement performs, because the m-fold sum-set
      operation restricted to H_E is closed exactly when every summand's parity
      class in E(F_p)/H_E ~= Z/2 sums to zero -- so the retained part propagates
      deterministically under the group law, which is precisely the required
      compatibility.
    propagation: >-
      One-step propagation is defined and measurable: for P_1, P_2, P_3 in
      +-F_V(E) the class of P_1 + P_2 + P_3 in E(F_p)/H_E is the sum of the three
      parity classes. Writing B_0, B_1 for the counts of factor-base points in
      and out of H_E, the count of m=3 sums landing in H_E is
      (B_0^3 + 3 B_0 B_1^2)/6 before collisions, which by the identity
      (u+d)^3 + 3(u+d)(u-d)^2 = 4(u^3 + d^3) with u = B/2, d = (B_0-B_1)/2 equals
      (B^3/2 + 4 d^3)/6 -- so the leading term is unbiased and the DEVIATION is
      CUBIC in the parity imbalance d, hence sign-symmetric and heavy-tailed.
      That is a concrete, pre-registrable prediction about the SHAPE of the
      over-dispersion (excess kurtosis on the 66-curve cell), not merely its size.
    survival_score: >-
      Survives exactly as far as a single index-2 subgroup is well defined, i.e.
      wherever 4 | #E(F_p) and the class has curves at levels above the ell=2
      floor. It dissolves for classes with odd conductor at 2, for classes where
      2 splits or ramifies in O_K (different level cardinalities), and for
      prime-order groups -- which is why the p=6007 class is the mandatory
      nearby-object control rather than a replication.

  proof_search_map:
    bottleneck: >-
      The attribution step. GOAL-ENDO-001 criterion C2 turns on whether the
      within-class variance of an attack-cost functional exceeds its matched
      null. The bottleneck is not measuring the variance -- that is committed --
      but deciding whether it is a property of the curve or of the pair
      (curve, sampler-reachable subgroup). Removing this bottleneck changes what
      the campaign's single most-cited open number means.
    baseline_embedding:
      parameter_slice: >-
        The committed RUN-ICINV-p4001-degenfix rows, at factor base FB_M3 = 13,
        N_TARGETS = 400, the p=4001 t=30 138-curve census, with the post-fix
        targets_uniform sampler.
      reproduction_check: >-
        Before any new arm runs, recompute the committed variance ratios
        decomp_rate_m2 = 1.416 and decomp_rate_m3 = 2.298 bit-for-bit from the
        committed raw-result.json using harness/exp_icinv.py::binomial_null_verdict
        on the committed hit vectors. A mismatch halts the experiment and is
        reported as an instrument-integrity finding, never as a mathematical
        result.
    observation_collision:
      observable: >-
        The per-curve pair (two_torsion_x_count, decomp_rate_m3).
    distinct_preimage_search: >-
      A COLLISION EXISTS AND IS NAMED BEFORE THE EXPERIMENT RUNS. All four levels
      f_E in {1,2,4,8} -- 66 curves -- share two_torsion_x_count = 3, so the
      observable cannot separate the crater from level 8. The claim this record
      can support is therefore a TWO-CELL statement, never a five-level one, and
      any five-level reading of the outcome is unsupported. This is a direct
      identifiability limit, disclosed rather than discovered later.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace two_torsion_x_count by the full group-structure invariant
          (n_1, n_2) with E(F_p) ~= Z/n_1 x Z/n_2, and where that is still
          constant on a cell, by v_2(f_E) computed independently via Velu
          2-isogeny descent on the certified census.
        predicted_gain: >-
          Separates five levels instead of two, and converts the collision above
          into a resolved stratification; it is the only transform that can
          license a level-resolved claim.
      - transform: observable_fiber
        proposed_object: >-
          Hold decomp_rate_m3 fixed within a narrow band and vary the forgotten
          structure (level, |+-F_V|, parity imbalance d); report which of CH1,
          CH2, CH3 still separates curves inside the band.
        predicted_gain: >-
          Attributes the residual to a channel rather than to a label, which is
          what distinguishes a mechanism from a correlation.
    quantifier_order: >-
      FORALL curves E in the committed 138-member p=4001, t=30 census, THERE
      EXISTS f_E | 16 with End_{F_p}(E) = O_{f_E}, AND E(F_p)[2] ~= (Z/2)^2 IF
      AND ONLY IF f_E | 8. The witness f_E DEPENDS on E; the claim is explicitly
      not uniform over the class, and no statement of the form "for all curves in
      the class, ..." about the group structure is asserted. The prediction about
      the over-dispersion is quantified as: FORALL cells C in {two_torsion = 1,
      two_torsion = 3}, the within-cell variance ratio is below the pooled ratio
      by the stated minimum effect.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On this one class, at this one factor base, the measured within-class
        variance of decomp_rate_m3 is (or is not) accounted for by a two-cell
        mixture indexed by rational 2-torsion, with the sampler-free functional
        |3V|/#E as the arbiter, at claim_tier toy." It can never certify anything
        about ECDLP hardness, about crypto-scale curves, or about classes with a
        different 2-adic conductor structure.
      nearby_object_control: >-
        THE p=6007 CLASS. Its trace, D, D_0 and conductor must be derived first.
        If 2 splits or ramifies in its O_K, or if its conductor is odd at 2, the
        66/72-type dichotomy CANNOT occur there and the identical instrument must
        report NO cell structure. If it reports one anyway, the instrument is
        detecting something other than rational 2-torsion and the whole mechanism
        is void. A second nearby object: a class of PRIME order, where every
        curve's group is cyclic and CH2 is identically absent; the over-dispersion
        must then be attributable to CH1 and CH3 alone.
    proof_obligations:
      - claim: "D = -15104 = -59 * 16^2, D_0 = -59 fundamental, h(-59) = 3"
        responsibility: baseline
      - claim: "(-59/2) = -1, level sizes (3, 9, 18, 36, 72), total 138"
        responsibility: size
      - claim: "pi = 7 + 16*omega, N(pi - 1) = 3972"
        responsibility: correctness
      - claim: "(pi - 1)/2 = 3 + 8*omega lies in O_c iff c | 8"
        responsibility: strictness
      - claim: "E(F_p)[2] ~= (Z/2)^2 iff (pi-1)/2 in End(E), via Lenstra"
        responsibility: interface
      - claim: "targets_uniform is confined to an index-2 subgroup on the 66 non-cyclic curves"
        responsibility: feasibility
      - claim: "cell-conditioned variance ratio falls below the pooled ratio by the stated minimum effect"
        responsibility: success_probability
      - claim: "toy tier, one class, one prime, no transfer asserted"
        responsibility: scope
    not_applicable_reason: null

  assumptions:
    - >-
      The committed 138-curve census is complete for the class (RQ-INSTR-f8faa0's
      completeness concern, IDEA-20260807-1c14d7). If it is a subset, the level
      cardinalities will not reproduce (3, 9, 18, 36, 72) and step (A) fails
      loudly rather than silently -- which is a feature of this design.
    - >-
      two_torsion_x_count as committed counts roots of x^3 + a x + b in F_p, not
      in the factor-base window. CH1 requires the WINDOWED count and must be
      recomputed; the two are not the same quantity.
    - >-
      Vertical 2-isogeny construction is NOT required for the primary arms. N18
      of GOAL-ENDO-001 (a Frobenius-eigenspace kernel-polynomial isogeny method)
      remains unimplemented, and every arm of this proposal is deliberately
      designed to avoid needing it: levels are inferred from group structure and
      from Hilbert class polynomial roots, not from constructed vertical isogenies.

  predictions:
    - metric: >-
        group_structure_agreement: fraction of the 138 curves on which the
        exhaustively computed group exponent lambda(E(F_p)) equals 1986 exactly
        when two_torsion_x_count = 3 and 3972 exactly when it equals 1
      direction: different
      minimum_effect: >-
        138/138, zero tolerance. Any single disagreement falsifies claim (B) as
        stated and voids every downstream arm.
    - metric: >-
        level_cardinality_vector: the multiset of curve counts per f_E computed
        from roots of the Hilbert class polynomials H_{-59 f_E^2} mod 4001
      direction: different
      minimum_effect: >-
        Exactly (3, 9, 18, 36, 72). Any other vector falsifies claim (A).
    - metric: >-
        cell_conditioned_variance_ratio for decomp_rate_m3, computed separately
        inside each two_torsion cell against NULL-B
      direction: lower
      minimum_effect: >-
        Both cell ratios <= 1.5 against the committed pooled 2.298, i.e. a
        reduction of at least 35%. A reduction below 20% does not support the
        mixture explanation.
    - metric: >-
        samplerfree_variance_ratio: within-class variance ratio of the exact
        functional |3V(E)|/#E computed by harness/run_blocknull.py::sumset_m3,
        no targets and no sampling
      direction: lower
      minimum_effect: >-
        <= 1.3, i.e. at or below the floor of the committed [1.3, 3.6] band. If
        the sampler-free functional is over-dispersed at the same magnitude as
        the sampled one, CH2 is not the channel and the diagnosis is wrong.
    - metric: >-
        parity_imbalance_kurtosis: excess kurtosis of the residual
        decomp_rate_m3 on the 66-curve non-cyclic cell after removing the cell
        mean
      direction: higher
      minimum_effect: >-
        Excess kurtosis >= 1.0 against the 72-curve cell, as predicted by the
        cubic-in-d propagation identity. A symmetric, mesokurtic residual on both
        cells is evidence AGAINST the parity channel specifically, while leaving
        CH1 and CH3 open.
    - metric: >-
        matched_null_variance_ratio on 138 synthetic objects -- uniformly random
        negation-symmetric subsets of Z/3972 of the observed per-curve sizes,
        with exactly 66 of them scored only on a fixed index-2 subgroup
      direction: different
      minimum_effect: >-
        If the null reproduces the pooled ratio to within its Monte-Carlo
        interval, the entire effect is sum-set combinatorics plus the sampler and
        NO curve-theoretic content remains. If the null sits at 1.0 +- 0.1 while
        the real arm is over-dispersed after cell conditioning, the residual is
        real at this scope.

  minimal_test:
    design: >-
      SIX ARMS, ORDERED, EACH CHEAP, ON THE COMMITTED p=4001 t=30 CENSUS.
      ARM 0 (zero compute, gate): re-derive D, D_0, f, h(-59), the Kronecker
      symbol, the level cardinalities, pi, N(pi - 1) and the c | 8 condition
      symbolically. Halt the whole experiment if 3+9+18+36+72 != 138.
      ARM 1 (minutes): for each of the 138 curves enumerate E(F_p) exactly
      (3972 points) and record the group exponent and (n_1, n_2); cross-tabulate
      against two_torsion_x_count. This tests prediction 1 at zero risk.
      ARM 2 (gate): reproduce the committed variance ratios 1.416 and 2.298 from
      the committed raw-result.json.
      ARM 3: recompute the pooled ratio and both cell-conditioned ratios for
      decomp_rate_m2 and m3 at the frozen factor base.
      ARM 4 (sampler-free): compute |2V(E)| and |3V(E)| for all 138 curves with
      the existing sumset_m2/sumset_m3, and the within-class variance ratio of
      |3V|/#E, pooled and per cell.
      ARM 5 (channel separation): repeat ARM 3 with every 2-torsion x-value
      excluded from every curve's factor base, so |+-F_V| is equalised and CH1 is
      switched off. Attribution: if the ratio dies in ARM 5, CH1; if it dies only
      under cell conditioning in ARM 3 but survives ARM 5, CH2; if it survives all
      of ARM 3, 4 and 5, none of the three channels explains it.
      ARM 6 (matched null and nearby object): the synthetic null of prediction 6,
      plus the full ARM 0-4 sequence on the p=6007 class and on one prime-order
      toy class.
    controls:
      - >-
        NULL OBJECT: 138 uniformly random negation-symmetric subsets of Z/3972 of
        the observed sizes, 66 of them scored on a fixed index-2 subgroup, run
        through the identical statistic (inventor protocol section 3).
      - >-
        POSITIVE CONTROL: plant a synthetic level-dependent shift of known size
        (e.g. 5% on the 66-curve cell) and confirm the cell-conditioned instrument
        recovers it. Required by GOAL-ENDO-001 C4 and RQ-INSTR-f8faa0; a negative
        may not be recorded from an instrument that fails it.
      - >-
        DECAY CONTROL: sweep the factor-base window W. A saturation artifact must
        decay as the sum-set fills; the committed sweep reports monotonic_decay
        False, so this control must be re-run under cell conditioning and its
        outcome reported either way.
      - >-
        IDENTICAL FACTOR BASE: the same x-value set V for every curve, as in
        IDEA-20260811-7734c5's design, so no per-curve factor-base freedom exists.
      - >-
        NEARBY-OBJECT CONTROL: the p=6007 class and a prime-order toy class, per
        the method ceiling above.
      - >-
        SOURCE PINNING: every arm records the exact source blob hash of the
        harness modules used, per CORR-20260810-676b0d's recorded
        source-reproducibility gap (three untracked exp_icinv_geometry.py versions
        across five runs).
    required_metrics:
      - group exponent and (n_1, n_2) per curve, with the exhaustive point count as its certificate
      - two_torsion_x_count per curve, both field-wide and windowed
      - level assignment f_E per curve with the method used to obtain it
      - decomp_rate_m2 and m3 per curve, pooled and per-cell variance ratios against NULL-B
      - "|2V|, |3V| per curve and the variance ratio of |3V|/#E"
      - parity split (B_0, B_1) and imbalance d per curve on the 66-curve cell
      - residual excess kurtosis per cell
      - matched-null ratio with its Monte-Carlo interval
      - positive-control recovery and decay-sweep outcome
      - artifact manifest with hashes and a from-scratch rebuild receipt

  falsification_conditions:
    - >-
      Level cardinalities do not come out (3, 9, 18, 36, 72) summing to 138.
      Claim (A) is false, the class is not the D_0 = -59, f = 16 class as
      identified, and the record is retracted at ARM 0 for the cost of a page of
      arithmetic.
    - >-
      Any curve violates "group exponent 1986 iff two_torsion_x_count = 3".
      Claim (B) is false as stated and every channel argument built on it falls.
    - >-
      Cell conditioning reduces the variance ratio by less than 20% AND the
      sampler-free functional |3V|/#E is over-dispersed at the same magnitude as
      the sampled one. The two-cell mixture explanation is refuted; the campaign's
      residual survives its strongest cheap explanation and becomes a positive
      C2 lead requiring an independent review-adversarial session before any
      record states it (GOAL-ENDO-001 P3).
    - >-
      The matched synthetic null reproduces the pooled over-dispersion at full
      magnitude. The effect is sum-set combinatorics and the sampler; no
      curve-theoretic content survives, and the correct deliverable is a named
      obstruction on the statistic rather than on the mathematics.
    - >-
      The positive control fails to recover a planted 5% cell shift. Under
      GOAL-ENDO-001 P1 measurement stops, all arms are marked
      attempted_and_inconclusive, and no negative is recorded.

  confounders:
    - >-
      CH1 AND CH2 ARE COLLINEAR BY CONSTRUCTION. Both are exact functions of the
      same 66/72 split, so a cell-conditioned reduction alone CANNOT attribute the
      effect to either. ARM 5 exists solely to break the collinearity by equalising
      |+-F_V| while leaving the subgroup index untouched. Without ARM 5 the
      experiment can detect the mixture but cannot name the channel, and any
      channel claim made without it is unsupported.
    - >-
      CELL SIZE ASYMMETRY. 66 versus 72 is nearly balanced, which is fortunate,
      but the variance-ratio estimator is itself noisy at n = 66; the
      cell-conditioned ratios need their own confidence intervals and the
      reduction threshold must be tested against them, not against point estimates.
    - >-
      THE COMMITTED RATIOS COME FROM RUNS WITH A KNOWN SAMPLER HISTORY.
      RUN-ICINV-p4001-a used the confounded hash-and-lift _targets and
      CORR-20260807-a05e1e forbids citing its decomposition rows;
      RUN-ICINV-p4001-uniform used the pre-fix targets_uniform. Only the degenfix
      run is a legitimate reproduction target and the experiment must say so.
    - >-
      #E(F_p) = 3972 IS NOT PRIME, so "the ECDLP instance" on these curves lives
      in a subgroup of order 331 or 993 and the decomposition functional is not
      the attack quantity it is named after. This is a pre-existing property of
      the campaign's toy class, not introduced here, but it bounds every reading.
    - >-
      HILBERT CLASS POLYNOMIAL ROOT-FINDING mod p is an independent
      implementation with its own failure modes; the level assignment must agree
      with the group-structure assignment on the 2-part or the disagreement is
      itself the finding.

  interpretation_limits:
    - >-
      TOY TIER, ONE CLASS, ONE PRIME, ONE FACTOR BASE. Nothing transfers to
      cryptographic scale and no transfer is offered. p = 4001 is 12 bits.
    - >-
      NO ECDLP CLAIM IN EITHER DIRECTION. No discrete logarithm is solved, no
      relation is collected, no cost model is moved, and sota_delta is zero on
      every axis whatever the outcome.
    - >-
      A CONFIRMED MIXTURE EXPLAINS A MEASUREMENT, NOT THE MATHEMATICS. It would
      show that the campaign's within-class variance is instrument-and-combinatorics
      rather than attack structure ON THIS CLASS AT THIS FACTOR BASE, and would
      say nothing about other functionals, other arities, other classes, or the
      T1 transport question itself.
    - >-
      THE TWO-CELL OBSERVABLE CANNOT RESOLVE FIVE LEVELS. Any level-resolved
      statement requires the stronger invariant named in the proof search map and
      is out of scope for this record.
    - >-
      THE SAMPLER DEFECT IS A PROPERTY OF THIS HARNESS. It is not a statement
      about ECDLP, about elliptic curves, or about any published algorithm.

  heuristic_assumptions:
    - id: H1
      statement: >-
        SUM-SET POISSONISATION. For a negation-symmetric subset S of an abelian
        group A of order n with |S| = 2B, the representation counts
        r_3(R) = #{(P_1,P_2,P_3) in S^3 : P_1+P_2+P_3 = R} behave, for R ranging
        over A, like independent Poisson variables of mean lambda = |S|^3/(6n),
        so that |3S|/n is concentrated at 1 - exp(-lambda) with fluctuation of
        relative order (n lambda)^{-1/2}.
      rigorous_support: >-
        RIGOROUS INGREDIENT: sum_R r_3(R) = |S|^3 exactly, and the second moment
        sum_R r_3(R)^2 is the additive energy of S, which for a uniformly random
        subset of A concentrates at its mean up to O(|S|^{3/2}) by a standard
        second-moment computation. CLASSICAL STATEMENT IMITATED: the Poisson
        approximation to the occupancy problem (balls in boxes), which is the
        exact analogue used when treating |3S| as a coupon-collector coverage.
        THE GAP, STATED: S here is NOT uniformly random -- it is negation
        symmetric, so P + (-P) = O always, giving a deterministic excess in
        r_2(O) and hence in r_3 near the identity coset. The assumption is that
        this excess is O(|S|) and does not affect the leading concentration.
      falsification_condition: >-
        The matched null's measured variance of |3S|/n departs from
        (n lambda)^{-1} scaling by more than a factor of 2 across the tested
        density range.
      validation_plan: >-
        SAMPLE: 10^4 uniformly random negation-symmetric subsets of Z/3972 at each
        of the committed densities 0.024 to 0.97, matching the observed per-curve
        |+-F_V| distribution exactly. COMPARISON: empirical variance of |3S|/n
        against the Poisson-occupancy prediction, and empirical CDF of |3S|
        against the predicted law. TAIL CHECK: the smallest and largest observed
        |3S| against the predicted 1/10^4 quantiles. TRANSFER: none; the null is
        run at exactly the parameters of the real arm and is not extrapolated.
    - id: H2
      statement: >-
        PARITY-IMBALANCE MODEL. For a curve with E(F_p) ~= Z/2 x Z/1986 and
        sampler-reachable subgroup H_E of index 2, the split (B_0, B_1) of the
        negated factor base across E(F_p)/H_E behaves like a Binomial(|+-F_V|, 1/2)
        draw, so the imbalance d = (B_0 - B_1)/2 has mean 0 and standard deviation
        sqrt(|+-F_V|)/2.
      rigorous_support: >-
        RIGOROUS INGREDIENT: the parity class of a point is the value of a
        quadratic character on the group, and the factor base is defined by an
        unrelated coordinate condition (x in V), so equidistribution follows from
        a character-sum bound of Weil type with error O(sqrt(p) log p). CLASSICAL
        STATEMENT IMITATED: equidistribution of a fixed set of x-coordinates
        across the cosets of an index-2 subgroup, the same shape of assumption
        liftable_density already carries in harness/exp_icinv.py, whose docstring
        cites exactly this Weil bound.
      falsification_condition: >-
        The measured distribution of d over the 66 non-cyclic curves has variance
        differing from |+-F_V|/4 by more than a factor of 1.5, or a non-zero mean
        exceeding 2 standard errors.
      validation_plan: >-
        SAMPLE: all 66 non-cyclic curves, exact computation of (B_0, B_1) -- this
        is exhaustive, not sampled, so the comparison is against the binomial law
        directly. COMPARISON: chi-square goodness of fit of the observed d against
        Binomial(|+-F_V|, 1/2) centred. TAIL CHECK: the maximum |d| against the
        binomial's 1/66 quantile. TRANSFER: none.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED OR MOVED. This is a control experiment on the
      campaign's own instrument. Experiment cost: 138 exhaustive point
      enumerations of 3972 points each (ARM 1), 138 exact 3-fold sum-set
      enumerations at |+-F_V| ~ 25 points (ARM 4, ~10^4 group operations each),
      and 10^4 synthetic null draws -- all seconds to minutes on one core.
    memory_exponent: >-
      O(#E) = O(3972) points held per curve; negligible. No table, no
      preprocessing, no time-memory tradeoff is involved.
    best_known: >-
      For the ECDLP on these curves: Pollard rho at ~0.886 sqrt(pi N / 2) with
      O(w) memory, automorphism-discounted by sqrt(|Aut|) per KN-TECH-018, and
      BSGS at ~sqrt(N) time and memory. Both are matched controls under
      RQ-VOLC-f6253b's constraints and neither is challenged here. For the
      identification claims: classical CM and volcano theory, which this record
      applies rather than extends.
    hidden_overhead: >-
      NOTHING HIDES IN AN o(1) BECAUSE NO ASYMPTOTIC IS CLAIMED. What does hide,
      and is disclosed: the level assignment via Hilbert class polynomials mod p
      costs O(h(D_0 f_E^2)^2) field operations per level and is the only step
      whose cost is not trivially bounded at larger p.
    tradeoff_note: >-
      Not applicable -- no algorithm is proposed. The relevant tradeoff statement
      is the negative one: even if the within-class variance were real and
      exploitable, DECOMPOSITION.md T5's reachability gate would still apply,
      since reaching a specified minimising curve is the vectorization problem at
      ~sqrt(h) ~ p^{1/4}, and nothing in this record touches that.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS OF THE FRONTIER BEFORE ANSWERING. As an ECDLP
    attack: n/a (no result claimed) -- no time, memory or data/query point is
    offered, so no frontier row applies. As a theorem about the class: dominated
    by classical CM theory (Deuring, Lenstra, Kohel), which already contains every
    ingredient of claims (A) and (B); the assembly is new to this program, the
    mathematics is not, and this record does not pretend otherwise. As a
    measurement of the campaign's residual over-dispersion: nothing in the
    corpus dominates it, because no committed record has explained that quantity
    at all -- EV-ENDO-10109d records it explicitly as unexplained. As an
    instrument critique: partially anticipated by the targets_uniform docstring
    itself, which names the non-cyclic limitation but does not connect it to the
    over-dispersion or to any class.
  sota_delta: >-
    ZERO on every attack axis, in both branches of the outcome. Quantitatively:
    time exponent unchanged at 1/2, memory unchanged, no query model touched,
    claim_tier toy. What the record delivers is a decision about one committed
    number -- whether a variance ratio of 2.298 at p=4001 is a two-cell mixture
    indexed by End(E) or a residual that survives it -- and, in the first branch,
    the retirement of the campaign's most-cited open question at a cost of
    minutes of compute against the months of batch time it has already consumed.

  discriminated_from:
    - >-
      IDEA-20260808-4d77a6 derives that the volcano level is readable from the
      public group structure. It supplies the identity; it names no measurement,
      no class, and no consequence for any committed number. This record supplies
      the class, the exact level cardinalities, the c | 8 condition, and the
      prediction.
    - >-
      IDEA-20260815-101067 proposes running the standard cost battery across
      levels with same-level and cross-class nulls. It is the generic version of
      the question and pre-commits no direction. This record predicts a specific
      two-cell split, names three transmission channels, gives a channel-separating
      arm, and predicts the SHAPE (cubic-in-d, hence high-kurtosis) of the effect.
    - >-
      IDEA-20260811-565915 warns that volcano regressors collapse to f_E. This
      record agrees and exploits the collapse: the 2-part of f_E is exactly the
      regressor wanted, and the collision it forces is disclosed in the proof
      search map rather than treated as an obstacle.
    - >-
      EV-ICINV-343679 measured the 66/72 split and withdrew it as non-novel.
      This record does not re-assert it as a novel isogeny-class finding -- it
      accepts the withdrawal and asks a different question: what that already-known
      quantity is the hypothesis OF, which is the resource reading
      docs/inventor-protocol.md section 4 requires.
    - >-
      IDEA-20260807-1c14d7 (RQ-INSTR) argues census completeness is load-bearing
      for within-class variance. This record turns that into a checkable
      arithmetic test rather than a caveat: the level cardinalities must sum to
      the census size.

  estimated_cost:
    implementation: low
    compute: low

  recommended_priority: high

  honest_prior_of_survival: >-
    0.85 that ARM 0 reproduces 138 as 3+9+18+36+72 (the arithmetic is done in
    this record and is checkable by hand; the residual risk is that the census is
    not the full class or that t = 30 is misremembered from the goal head).
    0.8 that prediction 1 holds exactly 138/138. 0.55 that cell conditioning plus
    the sampler-free arm together drive the ratio below 1.5. 0.15 that the
    residual survives all three channels, which is the branch that would matter
    most and is why the experiment is worth running rather than assumed.

