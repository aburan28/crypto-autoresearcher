idea:
  id: IDEA-20260821-ad7c97
  question_id: RQ-VOLC-f6253b
  research_question: RQ-VOLC-f6253b
  added: '2026-08-21'
  title: >-
    THE p=4001 t=30 CENSUS IS THE D_0 = -59, f = 16 CLASS AND ITS COMMITTED 66/72
    SPLIT IS THE ell=2 VOLCANO FLOOR INDICATOR: a derived, zero-compute
    prediction that the campaign's unexplained within-class over-dispersion is a
    two-cell mixture indexed by End(E), transmitted by a target sampler that is
    provably confined to an index-2 subgroup on 66 of the 138 curves
  class: control

  claim: >-
    STATED AS FOUR SEPARABLE CLAIMS, THE FIRST THREE OF WHICH ARE DERIVATIONS
    COSTING NO COMPUTE AND THE FOURTH OF WHICH IS THE MEASUREMENT THEY LICENSE.

    (A) THE CLASS IS IDENTIFIED EXACTLY. For p = 4001, t = 30: #E(F_p) =
    p + 1 - t = 3972 = 2^2 * 3 * 331, and D = t^2 - 4p = 900 - 16004 = -15104 =
    -(2^8 * 59). Since -59 = 1 mod 4 and 59 is prime, D_0 = -59 is fundamental
    and the Frobenius conductor is f = 16, i.e. D = D_0 * 16^2. The reduced forms
    of discriminant -59 are (1,1,15) and (3,+-1,5), so h(-59) = 3. Because
    -59 = 5 mod 8 the Kronecker symbol (-59/2) = -1, so 2 is INERT in O_K and
    h(D_0 * 4^j) = h(D_0) * 2^j * (1 - (-1)/2) = 3 * 2^j * (3/2) for j >= 1.
    The five ell=2 volcano levels f_E in {1,2,4,8,16} therefore carry
    3, 9, 18, 36, 72 curves, TOTAL 138 -- exactly the size of the certified
    census committed under EV-ICINV-343679. This is a strong, falsifiable
    identification: the arithmetic either reproduces 138 or the identification
    is wrong.

    (B) THE 66/72 SPLIT IS THE FLOOR INDICATOR, DERIVED. With
    omega = (1 + sqrt(-59))/2 one has sqrt(-59) = 2*omega - 1, so
    pi = (t + sqrt(D))/2 = 15 + 8*sqrt(-59) = 7 + 16*omega, confirming
    Z[pi] = Z + 16*O_K = O_16. Its norm check: for a + b*omega,
    N = a^2 + ab + 15b^2, and pi - 1 = 6 + 16*omega gives
    36 + 96 + 15*256 = 3972 = #E(F_p), as required. Now
    (pi - 1)/2 = 3 + 8*omega, which lies in O_c = Z + c*O_K if and only if
    c | 8. By Lenstra's CM structure theorem E(F_p) ~= O_{f_E}/(pi - 1) as an
    O_{f_E}-module, so E(F_p)[2] ~= (Z/2)^2 if and only if (pi - 1)/2 lies in
    End_{F_p}(E) = O_{f_E}, i.e. if and only if f_E | 8. CONSEQUENCE: the
    3 + 9 + 18 + 36 = 66 curves at levels f_E in {1,2,4,8} have full rational
    2-torsion (x^3 + a x + b splits completely, two_torsion_x_count = 3) and
    E(F_p) ~= Z/2 x Z/1986, while the 72 floor curves (f_E = 16) have
    two_torsion_x_count = 1 and E(F_p) cyclic of order 3972. The 66/72 split
    that EV-ICINV-343679 measured and then WITHDREW as "not a novel
    isogeny-class finding" is therefore exactly the ell=2 volcano floor
    indicator, i.e. an exact function of End_{F_p}(E) -- the very quantity
    RQ-VOLC-f6253b exists to interrogate.

    (C) THE INSTRUMENT TRANSMITS IT. harness/exp_icinv.py::targets_uniform draws
    targets as pseudorandom multiples of a single highest-order point found among
    at most 200 liftable x-candidates, and its own committed docstring states:
    "It still cannot reach a non-cyclic group's full structure from one generator
    -- a genuine limitation of any single-generator sampler, not a bug." On the
    66 non-cyclic curves the maximum point order is 1986, so every target lies in
    an index-2 subgroup H_E; on the 72 floor curves the sampler reaches all 3972
    points. The functional the campaign calls decomp_rate_m2/m3 is therefore not
    a function of the curve at all but of the PAIR (curve, sampler-reachable
    subgroup): it measures |mV intersect H_E| / |H_E|, not |mV| / #E.

    (D) THE PREDICTION. EV-ENDO-10109d records, as "the campaign's most important
    open question", a within-class over-dispersion of decomp_rate_m2/m3 whose
    variance ratio to NULL-B sits in [1.3, 3.6] at every factor-base density from
    0.024 to 0.97 at both p = 4001 and p = 6007, with monotonic_decay False at
    both -- which its own independent Validator flagged as "exactly the canonical
    artifact tell the operating rules warn about". CLAIM: at p = 4001 that
    over-dispersion is a two-component mixture indexed by the 66/72 split of (B),
    delivered through the three named channels CH1 (2-torsion x-values inside the
    window reduce |+-F_V| by 3 rather than 1, a deterministic ~8% change in the
    point count and hence ~24% in B^3), CH2 (the index-2 reachable-subgroup
    restriction of (C)), and CH3 (additive-collision structure of the m-fold
    sum-set in Z/2 x Z/1986 versus Z/3972). Conditioning on the split and, in a
    second arm, removing the sampler entirely by scoring the exact functional
    |3V(E)|/#E, must drive the ratio to its null. IF IT DOES NOT, the campaign
    holds a class-varying functional that survives the strongest cheap
    explanation available, which is a positive lead on completion criterion C2
    and must be routed to independent review before any record states it.

  mechanism: >-
    T1 says the ECDLP transports exactly along F_p-isogenies of degree coprime to
    N, so a genuine attack-cost functional cannot vary within a class beyond
    transport cost. The campaign's measured within-class variance therefore has
    to come from somewhere other than the ECDLP, and this record names the place.
    End_{F_p}(E) varies across the class exactly by the conductor f_E | 16.
    Lenstra's theorem converts that variation into a variation of the F_p-rational
    GROUP STRUCTURE -- here a clean dichotomy Z/2 x Z/1986 versus Z/3972 --
    and the group structure is what the measurement instrument's target sampler
    consumes. So an endomorphism-ring quantity reaches a "cost" statistic not
    through any attack mechanism but through the sampler's reachable subgroup and
    through the size of the negated factor base. Both channels are deterministic,
    both are computable from public data in polynomial time, and both are
    IRRELEVANT to the discrete logarithm: nothing here is an attack, and the
    positive branch of the experiment is a finding about the campaign's own
    functional, not about ECDLP hardness.

