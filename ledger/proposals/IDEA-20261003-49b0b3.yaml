# IDEA-20261003-49b0b3
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261003-49b0b3
  question_id: RQ-ECDLP-002
  added: '2026-10-03'
  status: proposed
  approved_by: null
  title: >-
    A width-9 window table stores 256 entries and a width-8 table stores 128
  class: representation
  claim: >-
    A window of width 9 stores 256 precomputed entries. A window of
    width 8 stores 128. Two hundred fifty-six exceeds one hundred
    twenty-eight by 128. The product of the two table sizes is 32768.
    Their sum is 384. The gap is a table size, not an ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    8 is 256. Two to the power 7 is 128. Two width-8 tables both
    store 128, so that gap is 0 and their product is 16384. No curve
    point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-03, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-03, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 128.
    baseline_embedding:
      parameter_slice: The widths 9 and 8 and the sizes 256 and 128.
      reproduction_check: >-
        Two readers must agree that 2 to the power 8 is 256 and that
        2 to the power 7 is 128.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 128 drops the gap. Two width-8
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-8 table.
        predicted_gain: One hundred twenty-eight fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 256 and 128. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-8 tables. Both store 128, and the gap is 0.
    proof_obligations:
      - claim: The width-9 table stores 256 entries.
        responsibility: size
      - claim: The width-8 table stores 128 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Two hundred fifty-six exceeds one hundred twenty-eight by 128.
  minimal_test:
    design: >-
      Compute 2 to the power 8 and 2 to the power 7. Do not add a
      curve point.
    controls:
      - Two width-8 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-9 table size is not 256.
    - The product of the two sizes is not 32768.
  confounders:
    - A width-8 table of size 128 is a different window from a width-7 table of size 64.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 128 and 64.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-9 table has size 2 to the power 8, and the
        frozen width-8 table has size 2 to the power 7.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Two hundred fifty-six stored entries versus one hundred twenty-eight, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-38be82
      - KR-RHO-cd86f5
      - KR-RHO-13bf67
      - KR-RHO-898783
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 256 and 128 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 256 versus 128
    data_queries: Two frozen widths.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
