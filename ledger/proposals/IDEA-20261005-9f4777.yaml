idea:
  id: IDEA-20261005-9f4777
  question_id: RQ-QLWE-9108dc
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: Log-unit certificate appears only on the cyclotomic ideal
  class: control
  claim: >-
    At lattice dimension 128, a log-unit decoding certificate is produced for a
    principal ideal in Z[x]/(x^128+1) with a planted ternary generator, and is
    not produced for a ternary NTRU lattice of dimension 128 at q=32 or at
    q=1024, nor for a plain LWE lattice of dimension 128, nor for a rank-2
    module lattice of dimension 128 whose only added symmetry is the
    coefficient map x |-> x^5. The approximation-factor label exp(O~(sqrt(n)))
    is attached only to a vector that carries that certificate. This record
    does not move that factor, does not claim Ring-LWE is broken, and does not
    claim a bit-security improvement.
  mechanism: >-
    The tracked object is the log-unit decoding certificate: a generator
    recovered by decoding in the log-embedding of the cyclotomic unit lattice,
    as composed in the class-group chain (quantum class-group / principal-ideal
    step, short-generator recovery, Stickelberger close principal multiple).
    That projection discards the ideal's non-unit data and still propagates
    under the unit-group action, so it is lossy rather than a change of
    coordinates. An overstretched NTRU modulus plants a dense sublattice, not a
    unit-lattice decoding. A coefficient isometry of a module lattice permutes
    coefficients; it does not supply the cyclotomic unit lattice. Plain LWE has
    no unit lattice, so the certificate is undefined there. The published
    Ideal-SVP ceiling remains exp(O~(sqrt(n))) in quantum polynomial time on
    cyclotomic ideal lattices. A BKZ approximation factor that is numerically
    near that band on every cell is the structure-blind baseline, not this
    certificate.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-046
      provenance: internal
      claim: >-
        Ideal-SVP in quantum polynomial time at approximation factor
        exp(O~(sqrt(n))) in cyclotomic fields; Ring-LWE at polynomial
        approximation factors is not claimed broken. Read from
        knowledge/techniques/KN-TECH-046.md. The factor was not re-derived.
      verified_by: knowledge/techniques/KN-TECH-046.md
    - ref: RQ-QLWE-9108dc
      provenance: internal
      claim: >-
        The question requires a plain-LWE null object and a nearby ring with
        the claimed structure removed, and it separates large-gamma ideal
        lattices from small-gamma average-case Ring-LWE. Read from
        ledger/questions/RQ-QLWE-9108dc.yaml.
      verified_by: ledger/questions/RQ-QLWE-9108dc.yaml
  assumptions:
    - >-
      The toy certificate is the classical log-unit decoding step on a planted
      principal ideal. The quantum class-group computation and the Stickelberger
      close-principal-multiple step are not run.
    - >-
      Same ambient dimension (128) is the match across cells. Ring degree is
      128 on the ideal cell and 64 on the NTRU and module cells, because those
      constructions embed in dimension 2n and k*n respectively.
    - Ternary planted generator and ternary NTRU secrets. No other secret law.
  predictions:
    - metric: log_unit_certificate
      direction: different
      minimum_effect: >-
        1 on the degree-128 principal ideal and 0 on ternary NTRU at q=32, on
        ternary NTRU at q=1024, on plain LWE of dimension 128, and on the k=2
        module lattice with only x |-> x^5.
    - metric: approximation_factor_label
      direction: different
      minimum_effect: >-
        The label exp(O~(sqrt(n))) is recorded only with the certificate. At
        degree 128 that reported label is exp(sqrt(128)) ≈ 8.2e4. BKZ factors
        on the NTRU and plain-LWE cells do not receive the label.
  minimal_test:
    design: >-
      Four cells, dimension 128. (A) Principal ideal in Z[x]/(x^128+1),
      generator coefficients in {-1,0,1}, classical log-unit decoding.
      (B) Ternary NTRU in Z[x]/(x^64+1) at q=32 and at q=1024 (fatigue ratios
      against 0.004*n^2.484 intended below 1 and above 1; the harness
      evaluates the ratio and aborts the cell label if the sign disagrees).
      (C) Plain LWE q-ary lattice, dimension 128, q=32, ternary secret.
      (D) Module lattice, k=2, ring Z[x]/(x^64+1), dimension 128, q=32, with
      the coefficient map x |-> x^5 applied and no NTRU trapdoor. Run one
      fixed small BKZ block size on A–C as the structure-blind baseline and
      record its approximation factor separately from the certificate.
    controls:
      - Plain LWE, same dimension, no ring.
      - Ternary NTRU below the reported fatigue point and above it.
      - Module lattice with a coefficient isometry and no ideal of degree 128.
      - Same BKZ budget on A, B, and C.
    required_metrics:
      - log_unit_certificate in {0,1} per cell
      - achieved approximation factor of any returned vector, and whether the exp(O~(sqrt(n))) label was attached
      - BKZ approximation-factor ratio of the ideal cell to the plain-LWE cell
      - fatigue ratio r = q/(0.004*n^2.484) on each NTRU cell, computed in the harness
  falsification_conditions:
    - >-
      The certificate is 1 on either NTRU cell, on plain LWE, or on the
      isometry-only module cell. The quantity is then not specific to the
      class-group/log-unit chain.
    - >-
      The certificate is 0 on the planted cyclotomic principal ideal. This
      design does not detect the chain.
    - >-
      Under the fixed BKZ budget, the ideal cell's approximation factor sits
      in the exp(sqrt(128)) band and the plain-LWE cell matches it within a
      factor of 2, with no log-unit certificate on the ideal. That split is a
      BKZ artifact.
    - >-
      Raising the NTRU modulus from q=32 to q=1024 flips the certificate from
      0 to 1. The quantity moved under an overstretched modulus.
  confounders:
    - >-
      At degree 128, exp(sqrt(128)) ≈ 8.2e4 overlaps low-degree polynomial
      factors, so a bare number is not a regime label. The certificate is the
      discriminator.
    - >-
      Recovering a planted short generator shows the log-unit step at
      polynomial length. It does not exhibit the Stickelberger approximation
      factor. The exp(O~(sqrt(n))) label stays the reported ceiling, not a
      measured improvement.
    - Dimension match with unequal ring degree.
    - A failed decoder is an implementation outcome, not evidence the chain is absent from the literature.
  interpretation_limits:
    - Toy dimension only. No statement about any deployed system.
    - Does not claim Ring-LWE or Module-LWE is broken at polynomial approximation factors.
    - Does not claim a bit-security improvement.
    - >-
      A 2–15 bit BKZ gap is the coefficient-isometry line. A dense-sublattice
      transition that flips only when the NTRU fatigue ratio crosses 1 is the
      overstretched-NTRU line. Neither is a positive for this record.
    - >-
      RQ-QLWE-9108dc requires a proof_search_map before implementation
      approval. The quantifier order of this control is: the certificate is an
      ideal-lattice object at the reported factor exp(O~(sqrt(n))), not an
      average-case Ring-LWE statement at polynomial factor.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Cyclotomic Ideal-SVP is reported solvable in quantum polynomial time at
        approximation factor exp(O~(sqrt(n))), and that factor is not claimed
        to reach polynomial approximation factors used by Ring-LWE.
      rigorous_support: >-
        Reported composition in KN-TECH-046 (class group and S-units, log-unit
        short-generator recovery, Stickelberger close principal multiple), read
        from that note's account of the source abstracts. Not re-derived here.
      validation_plan: >-
        Toy measurement only. Ring Z[x]/(x^128+1) for the ideal cell; NTRU and
        module rings Z[x]/(x^64+1); dimension 128; NTRU q=32 and q=1024;
        plain LWE dimension 128 at q=32. Record certificate presence per cell.
        Do not fit a new approximation exponent.
  target_complexity:
    time_exponent: >-
      Quantum polynomial time, the published Ideal-SVP ceiling in cyclotomics.
      This proposal measures a discriminator and does not move that exponent.
    memory_exponent: >-
      Memory of that same quantum polynomial-time Ideal-SVP procedure, as
      reported. This proposal does not move it.
    best_known: >-
      Ideal-SVP in quantum polynomial time at approximation factor
      exp(O~(sqrt(n))) in cyclotomic fields (KN-TECH-046).
    hidden_overhead: >-
      The O~ in exp(O~(sqrt(n))) hides polylog factors in the published
      statement. Not re-derived. No new overhead is claimed.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. The discriminator is which instance
      shape receives the certificate.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP frontier row. The line was read from
      knowledge/techniques/KN-TECH-046.md.
    nearest:
      - ref: KN-TECH-046
        provenance: internal
        relation: adjacent
        delta: >-
          Quantitative separator is the reported Ideal-SVP approximation factor
