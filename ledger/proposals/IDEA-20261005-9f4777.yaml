  dominated_by: >-
    Baseline named: quantum polynomial-time Ideal-SVP at approximation factor
    exp(O~(sqrt(n))) in cyclotomics (KN-TECH-046), not beaten. n/a (no attack
    result claimed)
  sota_delta: >-
    Not an attack claim. Numeric separator: approximation factor
