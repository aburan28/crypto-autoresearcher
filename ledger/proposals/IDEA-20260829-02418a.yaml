idea:
  id: IDEA-20260829-02418a
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-e72c0b
  title: >-
    Height-lattice forensics: read the BASE RANK of an unknown record curve off the
    Neron-Tate height lattice of its exhibited points, without ever seeing the family

  class: measurement

  claim: >-
    Let E/Q be a specialisation E_{t0} of a non-isotrivial family E/Q(t) whose
    Mordell-Weil group over Q(t) has rank r and height-pairing Gram matrix G_fam
    (rational, with denominator dividing a fixed integer N determined by the fibre
    types). Then the r x r Neron-Tate height Gram matrix of the r specialised
    sections inside E_{t0}(Q) equals h(t0) * G_fam + E, where h(t0) is the naive
    height of the specialisation parameter and E is an error matrix whose entries
    are o(h(t0)). CONSEQUENCE UNDER TEST: the isometry class of the Neron-Tate
    height lattice of ANY sufficiently high-height specialisation contains a
    detectable rank-r sublattice that becomes (1/N)-integral after a single global
    rescaling by an unknown positive scalar lambda, and lambda and r can be
    recovered from the lattice alone. Applied to the frozen ICARM curve-302 record
    snapshot (rank lower bound 31, 31 witness points) this yields an INTEGER
    ESTIMATE r* of the base rank behind the current world record. The claim is
    falsifiable in both directions and both directions are informative:
    r* >= 15 supports the recalled comparator "the record ladder rests on base
    rank roughly 18-20" that EV-ECQ-0d142e boundary B-8 flags as NEVER MEASURED by
    this program; r* <= 9 contradicts it and says the ladder is bought by search
    volume, not by base rank, which reprices every base-rank lever in this
    programme.

  mechanism: >-
    Silverman's specialisation theorem gives hhat_{E_t}(sigma_P(t)) / h(t) ->
    hhat_{E/Q(t)}(P) as h(t) -> infinity, and Tate's variation theorem sharpens the
    convergence to an O(h(t)^{1/2}) error. Polarising the quadratic form propagates
    the same statement to the full pairing, so the specialised Gram matrix is
    h(t0) * G_fam + O(h(t0)^{1/2}) entrywise. Shioda's height pairing on the
    Mordell-Weil lattice of an elliptic surface is <P,P> = 2*chi + 2*(P.O) -
    sum_v contr_v(P), which is rational with denominator dividing a fixed N read
    off the reducible fibres, and is an EVEN INTEGER when every fibre is
    irreducible. So the family contributes an arithmetically rigid, small-
    denominator quadratic form, and specialisation multiplies that rigid form by
    one unknown positive real. Any point of E_{t0}(Q) that is NOT in the image of
    the specialisation homomorphism -- the "extra" of EV-ECQ-0d142e boundary B-2 --
    carries no such constraint and contributes generic real height values. The
    signal is therefore a partial arithmetic rigidity inside an otherwise generic
    positive-definite lattice, and rigidity of that kind is detectable by a
    basis-independent statistic: enumerate short vectors of the height lattice,
    scale their norms by a trial lambda, and look for a comb (concentration of
    lambda * hhat(v) near (1/N)Z) instead of a uniform distribution mod 1/N. The
    detector is a periodogram over lambda; the null is exactly uniform.

  tracked_object:
    object: >-
      The isometry class of the Neron-Tate height lattice (E(Q)/tors, hhat) of the
      exhibited point set, together with the one-parameter rescaling family
      lambda * hhat. NOT the points, NOT the curve, NOT the family.
    lossy_projection_test: >-
      PASSES, and the loss is large and explicit. The projection sends a set of 31
      rational points on a specific curve over Q to a positive-definite integral-
      free quadratic form of rank 31 up to GL_31(Z). It discards: the coordinates
      of every point, the a-invariants, the conductor, every local datum, the
      basis, and the family. From the Gram matrix one cannot recover the curve, the
      points, or the fibration -- so this is not a change of coordinates. What is
      retained propagates DETERMINISTICALLY under the operation the target actually
      performs, because the target operation is specialisation, specialisation is a
      group homomorphism from E(Q(t)) to E_{t0}(Q), and the canonical height is a
      quadratic form pushed forward along it with a scalar factor. That is exactly
      the compatibility the protocol requires.
    what_the_loss_buys: >-
      Independence from the family model. IDEA-20260824-155411 answers a sharper
      question (WHICH fibration) but requires the explicit j-map of the record
      fibration, which GOAL-ECQ-2298dc records as unavailable and is blocked on.
      This object answers a coarser question (HOW MUCH base rank) from data this
      program already holds under a content hash.
    what_the_loss_costs: >-
      The observable cannot identify a family. Infinitely many pairwise non-
      isomorphic rational elliptic surfaces share the Mordell-Weil lattice E8, so
      the observable has an unbounded fibre. This is recorded below as the method
      ceiling, not as a defect discovered later.

  novelty_status: unverified
  novelty_note: >-
    Corpus check performed this session: grep over knowledge/ and ledger/ideas/
    for "height pairing", "canonical height", "lattice reduction", "Shioda",
    "Mordell-Weil" found no record proposing height-lattice rationality as a
    forensic for base rank. The eight committed IDEA-20260824-* records for the
    sibling question RQ-ECQ-e9b361 were read at title/class/claim level and none
    tracks this object. External check was PARTIAL: two web searches and one
    WebFetch this session found no method description for the rank-30/31 records
    and no paper proposing this statistic, but the underlying ingredients
    (Silverman 1983, Tate 1983, Shioda 1990) are recalled only, and no literature
    search was run against the specific question "has anyone used specialisation
    height rigidity to detect a base family". `unverified` is therefore the
    honest label and is not a hedge about the mathematics.

