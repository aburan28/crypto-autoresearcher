  assumptions:
    - >-
      The 31 witness points in the frozen curve-302 snapshot lie on the stated
      curve and are independent as the site's verifier reported. The design
      re-verifies both in exact rational arithmetic before any lattice work and
      treats a failure there as an input defect, not as a result.
    - >-
      Canonical heights on a curve with a6 of about 10^100 can be computed to 60
      or more significant digits at acceptable cost by PARI ellheight and
      ellheightmatrix. This is a capability assumption and is checked in step 0 of
      the design.
    - >-
      The record curve is a specialisation of SOME family at SOME t0 of height
      large enough for the asymptotic to bite. If it is not a specialisation at
      all, the correct answer is r* small and the measurement is still valid.

  proof_search_map:
    bottleneck: >-
      The programme cannot state the base rank of the published record ladder
      because it does not possess the fibration. Every axis-1 gap number in
      GOAL-ECQ-001 (C2 as adjudicated) rests on an unmeasured comparator. The
      bottleneck is comparator ACCESS, and this idea removes it by replacing an
      input requirement (the family model) with a computation on data already held.
    baseline_embedding:
      parameter_slice: >-
        The in-repo pencil at t = -65/22, where the family, its base rank 8, its
        all-I_1 fibre structure and the identity of the 8 specialised sections are
        all certified in EV-ECQ-0d142e and re-derived twice independently. The
        method must return r* = 8 there. This is an exact parameter slice of the
        general claim, not a lookalike.
      reproduction_check: >-
        Frozen fixture. Regress hhat_i(t) against h(t) across the 137 certified
        fibres of certified_curves.json (sha256 a342ff9c...d15aee) for each of the
        8 sections. Predicted slopes are the E8 Gram diagonal, i.e. even integers
        starting at 2. A fitted slope set that is not near-rational with small
        denominator falsifies the mechanism BEFORE the record curve is touched.
    observation_collision:
      observable: >-
        The scaled isometry class (lambda * hhat) of the height lattice, summarised
        by the periodogram peak and the recovered sublattice rank r*.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IS EXHIBITED IN ADVANCE, which is the honest outcome
        of this audit. Infinitely many pairwise non-isomorphic rational elliptic
        surfaces over Q have Mordell-Weil lattice isometric to E8, so distinct
        ground-truth families share the observable exactly. The collision is on
        FAMILY IDENTITY, not on RANK: all colliding preimages have r = 8. The
        method is therefore identifiable for r and provably non-identifiable for
        the family, and no downstream record may read a family identification out
        of it.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the height lattice fixed and vary the forgotten structure (which
          family, which t0). The intrinsic invariant that survives is the
          denominator N and the rank r of the rigid sublattice.
        predicted_gain: >-
          Converts an unmeasured comparator into an integer with a null-calibrated
          false-positive rate, at a compute cost four to six orders of magnitude
          below reconstructing the record fibration.
      - transform: specialization_pack
        proposed_object: >-
          The resource measure is the periodogram mass of lambda * hhat
          concentrated near (1/N)Z; it is realised by the specialisation
          E(Q(t)) -> E_{t0}(Q) and charged only over short vectors enumerated in a
          pre-declared norm window, which are disjoint blocks by norm.
        predicted_gain: >-
          A single scalar statistic with a computable null, rather than a
          basis-dependent inspection.
    quantifier_order: >-
      FIXED BEFORE SEEING THE RECORD CURVE: for all curves E in the test set, with
      N at most 12, epsilon = 0.05, norm window [m, 40m] where m is the first
      minimum, and lambda ranging over a declared grid of 10^5 values in
      [lambda_min, lambda_max] -- THERE EXISTS lambda and THERE EXISTS a sublattice
      M of rank r* such that for all v in M with hhat(v) in the window,
      dist(lambda*hhat(v), (1/N)Z) < epsilon. lambda is ALLOWED to depend on the
      curve (it is h(t0), an instance-dependent quantity). N, epsilon, the window
      and the grid are NOT allowed to depend on the curve and are frozen in the
      contract. Any tuning of N or epsilon after seeing curve 302 voids the
      measurement.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The height lattice of this curve contains a rank-r* sublattice consistent
        with being h(t0) times a (1/N)-integral form, at a false-positive rate p
        calibrated on random lattices." That is a statistical statement about a
        lattice. It is NEVER a proof that the curve is a specialisation, NEVER an
        identification of a family, and NEVER a rank statement about anything.
      nearby_object_control: >-
        A high-rank curve with NO family behind it. Concretely: the highest-rank
        curves this program can build from a rank-0 or rank-1 twist family
        (EV-ECRANK-b6c9b6 pool), and synthetic lattices drawn from the same
        spectrum as curve 302's. The method must return r* small on these. If the
        detector fires on a random positive-definite lattice, it is measuring the
        freedom in lambda and N, not arithmetic.
    proof_obligations:
      - claim: The specialised Gram is h(t0)*G_fam + o(h(t0)) at the heights actually available.
        responsibility: correctness
      - claim: The periodogram null for scaled norms over random lattices is uniform mod 1/N.
        responsibility: success_probability
      - claim: Short-vector enumeration in dimension 31 within the declared window is affordable.
        responsibility: runtime
      - claim: r* on the in-repo positive control equals 8, and equals a small number on the null objects.
        responsibility: baseline
    not_applicable_reason: null

  predictions:
    - metric: >-
        positive_control_slope_rationality -- max over the 8 sections of the
        distance from the regressed slope of hhat_i(t) against h(t) to the nearest
        even integer, over the 137 certified fibres
      direction: lower
      minimum_effect: >-
        below 0.15 absolute for at least 6 of the 8 sections; if it exceeds 0.5 for
        more than 2 sections the mechanism is falsified at the heights available
        and the idea stops here
    - metric: >-
        periodogram_peak_ratio -- height of the largest periodogram peak of scaled
        norms over the declared lambda grid, divided by the 95th percentile of the
        same statistic on 200 null lattices matched on dimension and spectrum
      direction: higher
      minimum_effect: >-
        at least 5.0 on the in-repo rank-12 positive control; the same statistic
        must be below 2.0 on the nearby-object controls
    - metric: >-
        r_star_record -- estimated base rank behind ICARM curve 302
      direction: different
      minimum_effect: >-
        reported as an integer with a null-calibrated false-positive rate at or
        below 0.05. The two pre-declared readings are r* >= 15 (CONSISTENT with the
        recalled 18-20 comparator; the ladder is bought with base rank and this
        program's axis-1 gap of 10-12 is confirmed as roughly right) and r* <= 9
        (INCONSISTENT; the ladder is bought with search volume from a base no
        better than this program's own, which would make the sieve-economics ideas
        the correct lane and the base-rank lane a misallocation)
    - metric: >-
        denominator_N_recovered on the positive control
      direction: different
      minimum_effect: >-
        exactly 1 (an integral, indeed even, form) is predicted for the all-I_1
        pencil; recovering N greater than 4 there indicates the detector is fitting
        noise

  minimal_test:
    design: >-
      STAGE 0 (input hygiene, about 10 min). Re-verify in exact rational arithmetic
      that all 31 witness points of the frozen curve-302 snapshot lie on the stated
      curve; record any failure as an input defect and stop.
      STAGE 1 (mechanism check on ground truth, about 1 CPU-hour). From
      certified_curves.json (137 fibres, 8 specialised sections each, all
      identified by the validator), compute hhat_i(t) at 60 digits for each section
      on each fibre and regress against h(t) = log max(|p|,|q|). Report the 8
      slopes and the residual scaling. THIS IS THE FALSIFICATION GATE for the whole
      idea.
      STAGE 2 (detector calibration, about 2 CPU-hours). Implement the periodogram
      detector. Freeze N at most 12, epsilon, the norm window and the lambda grid.
      Calibrate the null on 200 random positive-definite rank-31 lattices matched
      on spectrum, and on 200 lattices formed from genuinely non-family high-rank
      point sets. Record the false-positive rate at the frozen settings.
      STAGE 3 (positive control, about 1 CPU-hour). Run the frozen detector on the
      20-point lattice of the in-repo rank-12 curve, whose first 8 points are
      certified specialised sections. It must return r* = 8, N = 1, and a peak
      ratio above 5. Also run it on the two rank-13 Mestre curves, whose
      construction ceiling is measured at 9 before augmentation.
      STAGE 4 (the measurement, about 1 CPU-hour). Run the frozen detector once on
      curve 302's 31-point lattice. Report r*, lambda, N, the peak ratio, and the
      calibrated p-value. ONE RUN, NO RETUNING.
    controls:
      - >-
        POSITIVE CONTROL WITH KNOWN ANSWER: the in-repo rank-12 curve at t = -65/22
        where the base rank is 8 by a theorem and the 8 sections are identified.
        Expected r* = 8.
      - >-
        SECOND POSITIVE CONTROL AT A DIFFERENT KNOWN VALUE: the two certified
        rank-13 Mestre curves, whose route has a measured function-theoretic
        ceiling of 9 before augmentation. Expected r* near 9, and crucially NOT 8 --
        a detector that returns the same number on both is returning a constant.
      - >-
        NULL OBJECT: 200 random positive-definite rank-31 lattices matched to
        curve 302 on dimension and on the empirical eigenvalue spectrum. Expected
        r* small and peak ratio near 1.
      - >-
        NEARBY-OBJECT CONTROL: high-rank curves from the EV-ECRANK-b6c9b6 twist
        pool, where the base rank is 0 or 1 by construction. Expected r* at most 1.
      - >-
        PROVES-TOO-MUCH CONTROL: run the detector on the SAME 31 points but with
        their heights perturbed by multiplicative noise of the size of the measured
        Stage-1 residual. If the signal survives that, it is not arithmetic.
      - >-
        EMPTY AND DEGENERATE SUPPORT: a rank-1 lattice and a rank-0 (empty) support
        must return r* = 0 or 1 and never more.
    required_metrics:
      - eight regressed slopes and their distances to the nearest even integer, with residuals
      - periodogram peak ratio against the matched null, per test object
      - recovered lambda, recovered N, recovered r*, with the frozen settings restated
      - calibrated false-positive rate of the frozen detector on both null families
      - exact-arithmetic on-curve verification count for all 31 witness points
      - wall clock and peak RSS per stage, and the precision at which every height was computed

  falsification_conditions:
    - >-
      STAGE 1 GATE. If the regressed slopes of the section heights against h(t) on
      the 137 in-repo fibres are not near-rational with denominator at most 4 for
      at least 6 of the 8 sections, the specialisation-rigidity mechanism does not
      bite at the heights this programme can reach, and the idea is falsified
      before the record curve is opened.
    - >-
      If the frozen detector's false-positive rate on matched random lattices
      exceeds 0.05 at the frozen settings, the statistic is measuring the freedom
      in lambda rather than arithmetic and no reading of curve 302 may be reported.
    - >-
      If the detector returns the SAME r* on the rank-8-base and rank-9-base
      positive controls, it does not resolve base rank at unit granularity and any
      r* on curve 302 is uninterpretable.
    - >-
      If the detector fires at full strength on the noise-perturbed version of
      curve 302's own lattice, the signal is not arithmetic.
    - >-
      If canonical heights on curve 302 cannot be computed to the precision the
      frozen epsilon requires within the declared budget, that is an OPERATIONAL
      outcome (AGENTS.md rule 3), reported as an instrument limit and never as
      r* = 0.

  confounders:
    - >-
      LAMBDA FREEDOM IS THE PRIMARY CONFOUND. With a free positive scalar and a
      free denominator, ANY finite set of reals can be made to look near-rational.
      Controlled by freezing N, epsilon, the norm window and the lambda grid before
      the record curve is touched, and by publishing the measured false-positive
      rate at exactly those settings.
    - >-
      DILUTION BY THE EXTRA. If curve 302 has base rank r and excess 31 minus r,
      only an r-dimensional sublattice is rigid and short vectors need not lie in
      it. The positive control (8 rigid of 20) measures the dilution penalty
      directly and sets the detector's resolution.
    - >-
      SATURATION AND BASIS MIXING. The published witness points need not be the
      specialised sections; any GL_31(Z) mixing is invisible to the lattice. This
      is why the statistic is basis-independent. It also means the method cannot
      say WHICH points are sections.
    - >-
      LOW SPECIALISATION HEIGHT. If t0 has small height the O(h^{1/2}) error is
      comparable to the signal. Curve 302's coefficient sizes (about 10^66 and
      10^100) suggest a large h(t0) if it is a specialisation at all, but that is
      an inference, not a measurement, and it is recorded as such.
    - >-
      PRECISION ARTEFACTS. EV-ECQ-0d142e UC-1 records an unexplained uniform
      17th-significant-digit divergence between two internally stable regulator
      computations in this programme. Every height here is computed at two
      precisions (60 and 150 digits) and any statistic that changes between them is
      reported as precision-bound, not as signal.

  interpretation_limits:
    - >-
      A NUMBER r* IS NOT A RANK. It is a statistical estimate of the rank of a
      rigid sublattice, never a certified Mordell-Weil rank of anything, and it may
      not be cited in any record as a rank.
    - >-
      THE METHOD CANNOT IDENTIFY A FAMILY, by the collision exhibited in the
      proof_search_map. Any downstream text saying "the record uses fibration X"
      on the strength of this idea is unsupported.
    - >-
      This measures the RECORD's structure. It exhibits no curve, certifies no
      rank, and is not progress toward GOAL-ECQ-e72c0b's completion criteria; rank
      at least 32 over Q is untouched by it and rank at least 31 remains a claimed
      live record held by others.
    - >-
      Scoped to the frozen 2026-08-24 curve-302 snapshot. Later board movement is
      reported against that snapshot and never absorbed into it.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (SPECIALISATION RIGIDITY.) For the families in scope and for t0 with
        h(t0) at least 3, the r x r Neron-Tate Gram matrix of the specialised
        sections satisfies max over i,j of the absolute value of
        G_{ij} - h(t0) * (G_fam)_{ij}, bounded by C * h(t0)^{1/2}, with C an
        absolute constant of size at most 3 for the families measured here.
        Equivalently, after rescaling by 1/h(t0) the Gram entries lie within
        C*h(t0)^{-1/2} of a fixed (1/N)-integral matrix.
      rigorous_support: >-
        Composition in the exemplar pattern. RIGOROUS BOUND: Silverman's
        specialisation theorem gives the limit of the specialised height divided by
        h(t) tending to the function-field canonical height, and Tate's variation
        theorem is recalled as supplying an O(h(t)^{1/2}) error. STRUCTURAL FACT:
        Shioda's height pairing is (1/N)-integral with N determined by the
        reducible fibres and is even integral when all fibres are irreducible. The
        heuristic content is only that the constant C is small enough at the
        heights available, which is precisely what Stage 1 measures.
      validation_plan: >-
        Sample: all 137 certified fibres in certified_curves.json (sha256
        a342ff9c...d15aee), 8 sections each, t = p/q with |p| at most 2000 and q at
        most 40, so h(t) ranges over roughly 0.7 to 7.6. Shortcut that makes
        sampling feasible: the sections are already exhibited over Q(t) in
        qt_family.json (sha256 4646194...3f919b), so specialising costs one
        substitution instead of a descent. Compare: regress the specialised heights
        on h(t) and test the fitted slope against the predicted E8 diagonal (even
        integers, minimum 2) and the residual against the predicted h^{1/2}
        envelope by fitting the exponent of the residual growth. Tail check: the
        fibres of LOWEST h(t) are where the heuristic must fail first; report the
        residual at the five smallest h(t) against the envelope, and report the
        smallest h(t) at which the slope is recovered to within 0.15. TRANSFER
        ASSUMPTION, STATED: extrapolating C from h(t) at most 7.6 on a chi = 1
        surface to whatever h(t0) and chi curve 302 has is an extrapolation of
        unknown validity and every reported r* carries it.
    - id: H2
      statement: >-
        (NULL UNIFORMITY.) For a positive-definite lattice with no arithmetic
        rigidity, the values of lambda times the norm, reduced mod 1/N, over short
        vectors in the declared norm window, are equidistributed for every lambda
        in the grid, so the periodogram statistic has the standard exponential null
        and the grid-maximum has the corresponding extreme-value law.
      rigorous_support: >-
        Imitates the classical equidistribution of the fractional parts of n*alpha
        for irrational alpha and the standard chi-squared or exponential null for a
        periodogram ordinate of white noise. No rigorous theorem is claimed for
        lattice norm spectra; this is why the null is CALIBRATED BY SIMULATION
        rather than assumed.
      validation_plan: >-
        Sample: 200 random positive-definite rank-31 Gram matrices drawn to match
        curve 302's empirical eigenvalue spectrum, plus 200 lattices from genuinely
        family-free high-rank point sets in the EV-ECRANK-b6c9b6 pool. Compare: the
        empirical distribution of the grid-maximum periodogram against the
        exponential or extreme-value prediction. Tail check: the 99th percentile of
        the simulated null against the predicted tail, and the observed maximum
        over all 400 nulls against the predicted maximum. If the simulated null is
        heavier than predicted, the SIMULATED quantiles govern and the analytic
        null is discarded.

  target_complexity:
    time_exponent: >-
      NO ALGORITHMIC EXPONENT IS CLAIMED OR MOVED. Cost is O(n^3) LLL in n = 31
      plus enumeration of the short vectors in the declared window (budgeted at
      10^6 vectors) plus 10^5 periodogram evaluations: minutes of CPU. Canonical
      heights at 150 digits on 100-digit coefficients dominate at roughly 10^2 to
      10^3 height evaluations.
    memory_exponent: >-
      O(n^2) for the Gram plus O(n times 10^6) for the enumerated short vectors,
      under 1 GB at the declared window.
    best_known: >-
      For the question "what is the base rank behind curve 302" the best known
      method is to obtain the family and read Shioda-Tate off it: exact, and
      unavailable (GOAL-ECQ-2298dc is blocked on precisely that input). There is no
      known cheaper exact method and no known statistical competitor in this
      corpus.
    hidden_overhead: >-
      The o(1) here is not asymptotic slack but STATISTICAL slack: the entire
      result is a p-value at frozen settings, and the extrapolation of the constant
      C in H1 from chi = 1 and h(t) at most 7.6 to an unknown chi and unknown h(t0)
      is not quantified by anything measured. This is the single largest
      unquantified transfer in the proposal and is stated rather than absorbed.
    tradeoff_note: >-
      Time-memory trade is in the norm window: a wider window buys more short
      vectors and a sharper peak at linear cost in memory. Trivially parallel over
      the lambda grid and over test objects. No claw-finding structure, no
      van Oorschot-Wiener position.

  dominated_by: >-
    ON THE QUESTION ASKED, TWO THINGS DOMINATE, AND BOTH ARE CHECKED AND CURRENTLY
    UNAVAILABLE. (1) A disclosure of the construction by its authors, which
    GOAL-ECQ-2298dc pursues through a human-sent email and which would be exact
    rather than statistical -- blocked, and this program cannot take that action.
    (2) IDEA-20260824-155411's j-invariant match against the explicit rank-17 K3
    fibration, which identifies the FAMILY and not merely the rank -- blocked on
    the same missing model, and independently confirmed unavailable by this
    session's WebFetch of the ICARM news item, which carries no method description.
    Frontier rows checked for Pareto domination across time, memory and data: the
    exact Shioda-Tate route (dominates on certainty, loses on input availability);
    the j-map match (dominates on specificity, loses on input availability); direct
    2-descent on curve 302 (answers a different question -- the rank, not the base
    rank -- and this program has measured 31 of 31 descent timeouts at coefficients
    four orders of magnitude SMALLER than curve 302's). On the axes this idea
    competes on -- cost, and availability of inputs today -- no row dominates it.
  sota_delta: >-
    QUANTITATIVELY: the comparator base rank for this research question is at
    present the string "roughly 18-20", explicitly labelled recalled background and
    NOT measured (EV-ECQ-0d142e B-8), which makes the campaign's headline axis-1
    gap of "10 to 12" a difference against a number nobody in this program has
    measured. This idea replaces it with an integer r* carrying a false-positive
    rate calibrated at frozen settings on 400 null objects, at an estimated cost of
    roughly 5 CPU-hours against the alternatives' cost of "obtain a model this
    program cannot obtain". It moves no complexity exponent and improves no rank:
    delta on rank over Q is exactly ZERO.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is one height-regression script, one LLL and short-vector
      enumeration, one periodogram, and a null simulator; no new mathematics to
      code. Compute is roughly 5 CPU-hours total across four stages, dominated by
      150-digit canonical heights on 100-digit coefficients. Peak memory under
      1 GB at the declared window.

  recommended_priority: high
