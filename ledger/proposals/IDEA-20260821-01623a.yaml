  repair_provenance: >-
    REPAIRED IN PLACE ON 2026-08-21 under a red-team screen of this record, at the orchestrating
    session's instruction, keeping the same identifier and path. One BLOCKING finding was cleared:
    Stage 0 -- the whole minimal test -- solved for the wrong statistic, and the error ran in
    exactly the direction that manufactures the escalation branch. Two corrections, both structural
    rather than verbal. (a) THE CONDITION. A robust regression fitting p unknowns needs at least p
    INLIER ROWS, so the Stage-0 condition is a QUANTILE of the reduced row-norm profile at
    blocksize beta -- the p-th (or 2p-th) smallest row norm of the omega-penalised embedding,
    computed from its GSA/Z-shape profile -- and not the lambda_1 "best achievable vector length"
    the earlier draft solved for. (b) THE CEILING. The flat 1/2 breakdown point is the p/m -> 0
    asymptotic limit of the finite-sample Donoho-Huber bound (floor((m-p)/2)+1)/m ~ (1-p/m)/2, so
    the required inlier fraction is p_req ~ (1+p/m)/2 -- 0.75 at m = 2p, not 0.5. Both are now
    stated in proof_obligations, the flat 1/2 is retained only as the asymptotic corner (with its
    own fixture), Stage 1 sweeps rows-per-unknown m/p as well as p_req because varying the fraction
    alone does not cover the finite-sample bound, p and m are declared quantities including the
    amplification factor, beta_NoMod is reported as a surface over (p, m/p) rather than as a number,
    and a new heuristic H3 carries the profile-model burden the change of statistic introduces. The
    earlier draft's calibration figure for the lambda_1 version is not carried forward. Readers of
    any earlier copy should treat the lambda_1 condition and the flat-1/2 "hard ceiling" as
    withdrawn, and should not read any E2 obtained under them as an escalation trigger.
