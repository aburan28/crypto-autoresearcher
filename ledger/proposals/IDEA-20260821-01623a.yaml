idea:
  id: IDEA-20260821-01623a
  question_id: RQ-MLKEM-001
  added: '2026-08-21'
  title: >-
    NoMod (arXiv 2510.02162) publishes its own inlier model, P_inlier = erf(q / (2*sqrt(2)*
    sigma_btilde)) -- turn it against itself, but score it on the statistic a regression actually
    needs: not lambda_1 but the p-th smallest ROW NORM of the omega-penalised embedding at
    blocksize beta, where p is the number of unknowns recovered, and not the flat 1/2 breakdown
    point but the finite-sample regression-equivariant bound (floor((m-p)/2)+1)/m. Derive the BKZ
    blocksize any robust-regression attack needs to put ML-KEM's DENSE CBD secret above that
    bound, compare it with the primal blocksize, and carry an empirical wrap-rate arm and a
    NORM-MATCHED NON-LATTICE null that can void the erf model outright
  class: measurement
  claim: >-
    (A) THE EXTERNAL INGREDIENT, STATED WITHOUT ENDORSEMENT. NoMod treats modular wrap-around as
    statistical corruption: after lattice preprocessing it fits b~ = A s + e by robust regression
    with Tukey's biweight loss, downweighting the equations that wrapped. Its reported successes
    are at REDUCED parameters and SPARSE secrets -- from the paper's own tables as extracted this
    session: Ring-LWE n=256 at max Hamming weight 6; Module-LWE (n,k) = (256,2) at max Hamming
    weight 6; (n,k) = (128,3) at max Hamming weight 3; dense secrets only up to n = 120; and for
    "Kyber (n=256, k=3)" the preprocessing was HALTED AT BLOCK SIZE 10 for time reasons. ML-KEM's
    secret is not sparse: a CBD_2 coefficient is nonzero with probability 10/16, so ML-KEM-768's
    key-side secret has expected Hamming weight 480 out of 768, roughly eighty times the largest
    weight the paper reports recovering at comparable n.
    (B) THE FORCED VALUE, WHICH USES THE PAPER'S OWN MODEL AND NOT A HOSTILE ONE. NoMod estimates
    the per-equation inlier probability as P_inlier,i = erf(q / (2*sqrt(2)*sigma_btilde,i)). After
    preprocessing, equation i is a short lattice vector v_i paired against the concatenated secret
    and error, so sigma_btilde,i = ||v_i|| * sigma to first order, with sigma the standard
    deviation of the joint (s,e) coordinates -- which is where SECRET DENSITY enters, since a
    weight-h secret in n coordinates contributes variance proportional to h/n rather than to 1.
    Inverting the erf converts a required inlier probability p_req into a ceiling on the admissible
    reduced-row length, ||v||* = q / (2*sqrt(2)*erfinv(p_req)*sigma).
    (B2) WHAT p_req IS, AND WHY IT IS NOT 1/2. An earlier draft of this record set p_req = 1/2 and
    called it "a HARD CEILING", on the grounds that no affine-equivariant regression estimator has
    breakdown point above 1/2. THAT VALUE IS THE ASYMPTOTIC LIMIT AND NOT THE BOUND THAT BINDS
    HERE. For a regression-equivariant estimator fitting p unknowns from m rows, the finite-sample
    Donoho-Huber breakdown point is at most (floor((m-p)/2)+1)/m, which is approximately
    (1 - p/m)/2; the flat 1/2 is what that expression tends to as p/m -> 0 and is therefore the
    MOST GENEROUS case, never the operating one. The required inlier fraction is
    p_req = 1 - (floor((m-p)/2)+1)/m ~ (1 + p/m)/2. At m = 2p this is 0.75, not 0.5. Proposer's
    arithmetic at q = 3329, sigma = 1, to be recomputed in-harness: ||v||* = 2467 at the asymptotic
    p_req = 0.5; 2203 at m = 10p; 1876 at m = 4p; 1447 at m = 2p. The finite-sample ceiling at
    m = 2p is a factor 1.705 SHORTER than the asymptotic one, hence strictly harder to reach.
    (B3) THE STATISTIC THE CONDITION MUST BE IMPOSED ON, WHICH IS NOT lambda_1. An earlier draft
    solved for "the smallest blocksize whose BEST ACHIEVABLE VECTOR LENGTH reaches ||v||*", i.e. a
    lambda_1 condition. A robust regression fitting p unknowns needs at least p INLIER ROWS, not
    one short vector, so the condition is a QUANTILE of the reduced ROW-NORM PROFILE at blocksize
    beta. THE CLAIM: the right Stage-0 condition is that the p-th (equivalently, under the
    tighter reading, the 2p-th) smallest row norm of the reduced basis of the omega-penalised
    embedding at blocksize beta satisfies ||v|| <= ||v||*(p_req), where the profile is read off
    the GSA/Z-shape model of that embedding rather than from lambda_1 alone; and that computing
    the resulting beta_NoMod and comparing it with the blocksize beta_primal of the direct primal
    attack at the same parameter set is a decisive, cheap scope test that NoMod's own paper does
    not perform and that this repository has never performed for any attack. THE DIRECTION OF THE
    EARLIER ERROR IS RECORDED BECAUSE IT MATTERS: a lambda_1 condition with p_req = 1/2 is a lower
    bound on a lower bound, so it UNDERSTATES beta_NoMod and manufactures the E2 branch -- the very
    branch the record says must be escalated. The corrected statistic moves beta_NoMod UP on both
    counts, which makes E1 more likely and E2 correspondingly harder to reach, and that is the
    honest direction for the record's own headline prediction to move.
    (C) WHAT THE TWO OUTCOMES MEAN, DECLARED BEFORE THE RUN. E1 (SPARSITY PHENOMENON): beta_NoMod
    > beta_primal at every ML-KEM parameter set, at every point of the (p_req, m/p) grid, and the
    gap shrinks sharply when sigma is replaced by its sparse-secret value at the Hamming weights
    the paper actually attacked. Then NoMod's successes are explained by sparsity and reduced
    dimension, the robust-regression route is strictly dominated by the reduction it depends on,
    and the lane gains a measured obstruction with a number: "robust-regression attacks on ML-KEM
    require X more blocksize than the primal attack they preprocess with." E2 (PREPROCESSING
    PHENOMENON): beta_NoMod <= beta_primal at some parameter set somewhere on that grid. Then
    robust estimation over wrap-free equations is a genuinely cheaper route than the primal attack
    whose preprocessing it borrows, ML-KEM has a live mechanism in it, and this is the
    highest-value outcome available in the lane. E2 is only meaningful if it survives on the
    CORRECTED statistic; an E2 read off the lambda_1 version at p_req = 1/2 is an artefact of the
    wrong condition and must not be escalated.
    (D) THE MODEL ITSELF IS ON TRIAL, NOT ONLY ITS CONSEQUENCE. The erf expression assumes the
    reduced-equation value is Gaussian with standard deviation ||v||*sigma and that wrap events are
    independent across equations. Both are testable directly and cheaply, and the empirical arm is
    designed so the MODEL can fail even if the arithmetic is right.
    (E) NOT CLAIMED. No attack, no break, no speedup, no exponent. No assertion that NoMod is
    wrong: its reported results at its reported parameters are taken at face value and are not
    re-run here. No assertion about what the literature does or does not contain. Every number in
    this record is the proposer's arithmetic on published constants and on quantities extracted
    from the paper's HTML this session, NOT a measurement from any committed run. No direction is
    declared impossible.
  mechanism: >-
    STAGE 0 (closed form, no compute, the decider -- AND IT IS SCORED ON A ROW-NORM QUANTILE, NOT
    ON lambda_1). Four quantities are fixed before anything is solved for, and each is reported:
    (0a) sigma. From FIPS 203 constants compute sigma for the joint (s, e) vector at each parameter
    set: for ML-KEM-768/1024 both s and e are CBD_2, sigma = 1; for ML-KEM-512 the key-side secret
    is CBD_3 (sigma = sqrt(1.5) = 1.2247) and the error is CBD_2, so the joint sigma is the
    appropriate mixture and must be computed per block rather than assumed uniform.
    (0b) p, THE NUMBER OF UNKNOWNS THE FIT RECOVERS. Declared per configuration -- full-secret
    recovery at ML-KEM-768 has p = 768 key-side coordinates (2*768 if the error block is also
    fitted), and any block-wise or hybrid variant declares its own smaller p. p is a design choice
    of the attack and the ledger reports beta_NoMod as a function of it, because the ceiling
    depends on it through p/m.
    (0c) m, THE ROW COUNT ACTUALLY USED, INCLUDING AMPLIFICATION. NoMod's algebraic amplification
    and reduced-vector saving generate more equations than one reduced basis has rows, and those
    extra rows are LONGER. m is therefore the post-amplification row count and the profile in (0e)
    must be the profile of the rows actually fed to the estimator, not of one reduced basis. The
    ledger sweeps m/p over {2, 4, 10, 100} and reports the whole curve.
    (0d) p_req, FROM THE FINITE-SAMPLE BOUND. Compute the breakdown ceiling
    eps* = (floor((m-p)/2)+1)/m ~ (1 - p/m)/2 and set p_req = 1 - eps* ~ (1 + p/m)/2. Report the
    flat 1/2 ONLY as the p/m -> 0 asymptotic limit and label it as the most generous case; it is
    never used as the operating point. Then invert the erf: ||v||*(p_req) =
    q/(2*sqrt(2)*erfinv(p_req)*sigma).
    (0e) THE CONDITION. Build the GSA/Z-shape row-norm profile of the OMEGA-PENALISED embedding at
    blocksize beta -- omega = 4 for CBD errors and omega = 10 for Gaussian sigma = 3 per the
    paper's own preprocessing -- with the sample count optimised exactly as the primal baseline
    optimises it. Solve for the smallest beta such that THE p-th SMALLEST ROW NORM of that profile
    satisfies ||v|| <= ||v||*(p_req). Report the same solve under the tighter 2p-th-smallest
    reading, and under a refined expected-count variant in which the condition is
    sum over rows of erf(q/(2*sqrt(2)*||v_i||*sigma)) >= p / (1 - eps*), so that the verdict is not
    an artefact of one quantile convention. Report beta_NoMod beside beta_primal from the same
    model, per parameter set, as a SIGNED DIFFERENCE, on the full (p, m/p, quantile-convention)
    grid.
    (0f) CALIBRATION FIRST. Run the identical arithmetic at NoMod's own attacked settings (n=256
    k=2 with weight-6 sparse secrets; n=128 k=3 with weight-3), with p and m set to what those
    experiments actually used, so the method is calibrated on a point where the paper reports
    success. IF STAGE 0 SAYS THE PAPER'S OWN SUCCESSFUL CELLS ARE INFEASIBLE, STAGE 0 IS WRONG AND
    NOTHING ELSE IS REPORTABLE. That calibration is the load-bearing control of the whole design,
    it is run first, and the corrected (tighter) ceiling gives it MORE power to fail than the
    earlier draft's version had -- which is the point of running it first.
    STAGE 1 (sensitivity over BOTH axes, because varying one does not cover the other). The
    earlier draft swept only the required inlier fraction over {0.5, 0.7, 0.9}, which does not
    reach the defect: the finite-sample bound moves with the NUMBER OF ROWS PER UNKNOWN, not with
    a freely chosen fraction. Sweep the two axes jointly: p_req over {the value forced by the
    finite-sample bound at the current m/p, 0.7, 0.9} and m/p over {2, 4, 10, 100}, and report
    beta_NoMod as a surface. 50% remains in the table only as the p/m -> 0 corner. Also report the
    sensitivity to the Tukey tuning constant, which the paper does not state: a real
    iteratively-reweighted biweight fit degrades well before its theoretical breakdown point and
    in high dimension needs a comfortable inlier majority, so the surface's high-p_req corner is
    the realistic one and the low corner is the generous one.
    STAGE 2 (empirical wrap-rate arm, at reduced parameters, at true FIPS q). Build ML-KEM-shaped
    q-ary lattices at q = 3329 with reduced (n, k) -- n in {64, 128, 256}, k in {2, 3} -- with real
    CBD errors and real CBD secrets at declared densities (dense CBD_2; and sparsified variants at
    the Hamming weights the paper reports, as the dose axis). Run LLL and BKZ at a ladder of
    blocksizes on the omega-penalised embedding. RECORD THE FULL ROW-NORM PROFILE, not a single
    representative length: for every row v used, record ||v|| and the ACTUAL wrap count of the
    resulting equation, computed with knowledge of the planted secret. Compare the measured
    wrap-free fraction against the erf prediction erf(q/(2*sqrt(2)*||v||*sigma)) row by row, and
    compare the measured p-th and 2p-th smallest row norms against the GSA/Z-shape prediction used
    in Stage 0 -- that comparison is what validates Stage 0's profile model and it has no analogue
    in the earlier draft. Report residuals as signed absolute differences, not ratios.
    STAGE 3 (the null that can void the model). Generate a NORM-MATCHED NON-LATTICE control: rows
    drawn as random directions in R^d scaled to reproduce, row for row, the norm multiset of the
    Stage-2 reduced basis, paired against the SAME planted (s, e). The erf model depends on the row
    only through its norm, so IF THE MODEL IS RIGHT THE TWO ARMS MUST HAVE THE SAME WRAP-FREE
    FRACTION AT MATCHED NORM. If they differ beyond the declared threshold, lattice reduction is
    correlating the row with the secret in a way the model does not capture -- which would be a
    finding in its own right and would void every Stage-0 number that rests on the erf. The
    comparator is generated, so it is drawn at least 8 times and reported as an interval, never as
    a point (KN-TECH-1a5b7e, mode 5).
    STAGE 4 (independence, the model's second assumption, and it feeds straight back into p_req).
    Reduced rows of one basis are strongly dependent. Measure the pairwise correlation of wrap
    indicators across rows of the same reduced basis, and compare with the independent-Bernoulli
    prediction at the matched per-row rate. A robust estimator's effective sample size is what
    matters, and correlated corruption at a nominal 40% rate can behave like an uncorrelated 60%
    rate. Report the measured EFFECTIVE inlier count, and re-enter it into (0d) as an effective m:
    correlation reduces m at fixed p, which raises p/m, which raises p_req, which lowers ||v||*
    and raises beta_NoMod again. That feedback path is the reason Stage 4 is not decorative.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant; it answers
      nothing). NO SHELL is available either, so every corpus search was run with the Grep
      (ripgrep) tool and is recorded below as a pattern and a path.
      GREPS RUN:
      (1) 'NoMod|wrap-around|wraparound|non-modular|Tukey|robust regression|breakdown point|
      biweight' -i over the repository root -> 65 occurrences across 44 files, overwhelmingly
      unrelated uses of "wrap-around".
      (2) The narrowed follow-up 'NoMod|Tukey|biweight|breakdown point|robust regression|
      non-modular' -i over the repository root -> 16 files: knowledge/sources.json,
      knowledge/SOURCES.md, research_digest/manifest.jsonl, research_digest/chunks/chunk_095.txt,
