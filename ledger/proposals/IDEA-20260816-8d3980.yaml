idea:
  id: IDEA-20260816-8d3980
  question_id: RQ-SHATWO-f196c7
  added: '2026-08-16'
  title: 'Build and self-test the step-reduced certificate machinery before any characteristic is
    searched for: a declared certificate schema, two independent verifiers, and a synthetic collision
    found by birthday search on a truncated step-reduced variant so the whole chain is exercised end
    to end today'
  class: tooling
  claim: '(A) RQ-SHATWO-f196c7 requires that any claimed collision, semi-free-start collision or preimage
    be emitted as a literal input pair and re-verified independently, and its own constraints block
    experiment design until a specific published attack is filed as a KN-LIT entry from primary text.
    That blocking condition applies to the ATTACK, not to the MACHINERY. The verification chain -
    a certificate schema, a canonical serialization, two independently written FIPS 180-4 implementations,
    a step-reduced evaluator parameterized by step count and initial chaining value, and a verifier
    that recomputes rather than trusts - can be built and exercised in full today against a certificate
    this program produces itself. (B) The self-test is the load-bearing part: take a step-reduced
    variant with output truncated to 40 bits, find a genuine colliding pair by ordinary birthday search
    in seconds, emit it through the schema, and require both verifiers to accept it and to reject
    each of a declared family of corrupted certificates - wrong step count, wrong chaining value,
    flipped message bit, transposed byte order, truncation mismatch. A verifier that accepts a corrupted
    certificate is the failure this exists to find, and finding it costs minutes now rather than invalidating
    a campaign later. (C) NOT CLAIMED: that any collision on a truncated step-reduced variant is cryptanalysis
    - it is a birthday search on a 40-bit output and is deliberately trivial; that the machinery reproduces
    any published result, which it explicitly does not attempt and cannot until primary text is filed;
    that verification capability implies search capability, which it does not; and nothing about SHA-256
    at any step count, HMAC-SHA-256, or any deployed system. The deliverable is infrastructure plus
    a reproduction receipt recording exactly what could and could not be obtained.'
  mechanism: 'STAGE A. Write the certificate schema: primitive name, word width, step count s, initial
    chaining value, the two messages as canonical hex, the claimed relation (collision, semi-free-start
    collision, preimage), the truncation if any, and the schema version. STAGE B. Implement two independent
    step-reduced evaluators - different authors'' code paths, different internal representations -
    each validated at s = 64 against hashlib on NIST test vectors so that the step-reduced path is
    anchored at its full-step endpoint. STAGE C. Write the verifier as a pure function from certificate
    to accept or reject, which recomputes the relation from the messages and never reads any claimed
    digest. STAGE D. Produce the self-test certificate by birthday search on a 40-bit-truncated step-reduced
    variant, which requires roughly a million evaluations and no cryptanalysis. STAGE E. Corruption
    battery: generate the declared family of corrupted certificates and require rejection of every
    one by both verifiers. STAGE F. Emit a reproduction receipt that records, as a first-class artifact,
    that no published attack was reproduced, why - no KN-LIT entry with primary text exists - and
    exactly what would unblock it. Refutation route: if a verifier accepts any corrupted certificate,
    the machinery is rebuilt before anything else in this bucket proceeds.'
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-SHATWO-f196c7 in full, including its constraints block requiring a filed KN-LIT
      entry before experiment design and requiring a pinned FIPS 180-4 implementation validated against
      NIST vectors. Read ledger/goals/GOAL-SHA2-001.yaml and docs/claims-and-verification.md by reference
      from AGENTS.md rule 4. Ran grep -rl 'RQ-SHATWO' over ledger/ experiments/ knowledge/ coordination/;
      grep -ril 'step-reduced|semi-free-start' over ledger/proposals/ ledger/hypotheses/ knowledge/.
    results: '''step-reduced|semi-free-start'' matched only knowledge/literature/ entries and knowledge/sources.json
      - never a proposal and never a hypothesis - so no record in this repository proposes producing
      or verifying a step-reduced certificate. RQ-SHATWO-f196c7''s own constraints state that no experiment
      may be designed until the specific attack to be reproduced is filed as a KN-LIT entry at a stated
      provenance level, and its provenance block states that every step count and complexity figure
      it mentions was obtained by web-search excerpt on 2026-08-09, is not filed as KN-LIT, and is
      UNVERIFIED. GOAL-SHA2-001''s objective names reproducing a published step-reduced collision
      as the first deliverable and its non_duplication block assigns instrument calibration to GOAL-MD5-001
      and real-world collision cost to GOAL-SHA1-001. The RQ-SHATWO grep returns only the question,
      GOAL-SHA2-001 and RQ-SHATHREE-cd2cb2, so this lane holds no proposals.'
    verdict: 'UNVERIFIED. This program cannot read external literature and this record asserts nothing
      about what it contains, including whether any step-reduced SHA-256 collision has ever been published;
      RQ-SHATWO-f196c7 itself marks every such figure it quotes as unverified excerpt. Claimed new:
      nothing technical - certificate schemas, double implementation and corruption batteries are
      ordinary engineering hygiene. The contribution claimed is scheduling and honesty: separating
      the machinery from the blocked reproduction so the machinery is built, self-tested and gated
      NOW rather than under time pressure beside a claimed result, and making the reproduction receipt
      - including a BLOCKED verdict - a first-class emitted artifact rather than an omission. Within
      this repository the verifiable fact is that no proposal or hypothesis mentions step-reduced
      or semi-free-start anything, and RQ-SHATWO carries no proposals.'
  object_first_candidate:
    tracked_object: 'The certificate itself as a self-contained object: a serialized tuple (primitive,
      word width, step count, initial chaining value, message pair, claimed relation, truncation,
      schema version) together with the accept-or-reject verdict that a recomputing verifier returns
      on it, followed through serialization, corruption and independent re-verification.'
    lossiness: 'Lossy in the direction that matters. The certificate discards everything about HOW
      the pair was found - the search, the characteristic, the conditions, the solver, the budget
      - and retains only what is needed to recheck the claim from scratch. Two pairs found by utterly
      different means are indistinguishable as certificates, which is exactly the point: the verdict
      must not depend on provenance. Why the remainder still propagates: the retained fields are sufficient
      to recompute the relation deterministically, so a verifier needs nothing that was discarded,
      and the discarded material cannot influence the verdict even in principle. This is the one entry
      in this bucket where losing information is the design goal rather than a cost.'
    propagation: 'The operation applied to the object is corruption followed by re-verification. One
      step is a single declared mutation - flip a message bit, change the step count by one, permute
      byte order, alter the chaining value, change the truncation width - applied to a valid certificate.
      A correct verifier maps every such mutation to reject, and maps the unmutated certificate to
      accept. The propagation law is therefore a total function from the corruption family to verdicts,
      fully enumerable at the declared family size, with no probability anywhere: a single wrong verdict
      is a hard failure rather than a rate.'
    survival_score: 'The chain survives exactly as far as a certificate can be rechecked from its
      own contents, which is total for collisions and semi-free-start collisions at any step count,
      and it dissolves precisely at complexity claims: a statement that a pair was found in 2^k operations
      is not recheckable from the certificate and this machinery makes no attempt to verify it, which
      is stated as the ceiling. It also dissolves at the reproduction question - the machinery can
      verify a certificate someone supplies, and cannot itself produce one for a nontrivial step count,
      and the receipt says so.'
  null_object_control: 'The corruption battery is the null object and it runs in the same invocation
    as the accept test: a family of certificates of identical shape that are wrong by construction,
    one mutation each, at least 200 of them spanning every field of the schema, plus 200 certificates
    whose message pairs are independent uniform random values with the same lengths. For the accept
    verdict to mean anything, both verifiers must reject 100 percent of the corruption battery and
    100 percent of the random-pair certificates, while accepting the genuine self-test certificate.
    A verifier that accepts anything in either null family is not a verifier, and its acceptance of
    the genuine certificate carries no information at all.'
  discriminated_from:
  - RQ-SHATWO-f196c7's constraints block, which requires a pinned FIPS 180-4 implementation validated
    against NIST vectors; this builds that and adds the certificate schema, the step-reduced parameterization,
    the second independent verifier and the corruption battery, none of which the constraint names.
  - GOAL-SHA2-001's first objective, reproducing a published step-reduced collision, which is blocked
    by the same question's own KN-LIT constraint; this deliberately does not attempt it and emits
    a BLOCKED receipt instead, so the two are sequential rather than duplicative.
  - GOAL-MD5-001, which GOAL-SHA2-001's non_duplication block assigns instrument calibration to; this
    builds no search instrument at all and calibrates nothing, it only verifies.
  - Ordinary unit testing of a hash implementation, which checks digests against test vectors; the
    corruption battery checks a different property - that the verifier's semantics match the claimed
    relation - which passing test vectors cannot establish.
  - KN-TECH-080 audit 1 (baseline reproduction), which requires reproducing a best-known baseline;
    this reproduces nothing and says so, because the primary text that audit needs is not available
    in this environment.
  assumptions:
  - FIPS 180-4 is the correct specification and both implementations match hashlib on the NIST test
    vectors at s = 64, which anchors the step-reduced path at its full-step endpoint.
  - A birthday search on a 40-bit-truncated step-reduced output finds a genuine collision in about
    2^20 evaluations, which is a counting fact about the truncation and not a cryptanalytic claim.
  - The declared corruption family covers every field of the schema; coverage is asserted by construction
    and checked by requiring at least one mutation per field.
  - Two implementations written independently do not share a bug; this is the standard weakness of
    double implementation and is stated rather than assumed away, which is why hashlib provides a
    third anchor at full steps.
  predictions:
  - metric: verifier verdict on the genuine self-test certificate, both verifiers
    direction: higher
    minimum_effect: 'forced value: accept, from both, on every run'
  - metric: rejection rate over the corruption battery, both verifiers
    direction: higher
    minimum_effect: 1.0 exactly; a single acceptance is a hard failure that stops the lane
  - metric: rejection rate over 200 random-pair certificates of matched shape
    direction: higher
    minimum_effect: 1.0 exactly at 40-bit truncation, where an accidental collision has probability
      about 2^-40 per pair
  - metric: agreement between the two independent step-reduced evaluators on 10^6 random inputs at
      every step count from 1 to 64
    direction: higher
    minimum_effect: 1.0 exactly; any disagreement voids the chain
  - metric: number of published step-reduced attacks reproduced by this contract
    direction: different
    minimum_effect: forced value 0, declared in advance, because the reproduction is blocked by RQ-SHATWO-f196c7's
      own KN-LIT constraint and this contract does not attempt it; the receipt records the blocking
      condition rather than leaving the gap silent
  minimal_test:
    design: 'Cheapest sufficient version: one word width, one truncation at 40 bits, one step count,
      one genuine self-test certificate, and a corruption battery of 200. Birthday search costs about
      2^20 evaluations of a step-reduced compression function in plain Python, which is seconds to
      a couple of minutes, and requires no solver, no encoder and no search machinery. The whole chain
      - schema, serialization, two evaluators, verifier, corruption battery, receipt - is exercised
      end to end by that single certificate, and the discriminating observation is binary: does any
      verifier accept anything in the corruption battery. If one does, the chain is broken and nothing
      downstream in this bucket is trustworthy; if neither does, the chain is exercised and the receipt
      records BLOCKED for the published-attack reproduction with the exact unblocking condition named.
      Nothing about this depends on any attack existing, which is why it can run today.'
    controls:
    - Corruption battery of at least 200 single-mutation certificates spanning every schema field,
      rejected by both verifiers in the same invocation.
    - 200 random-pair certificates of matched shape, rejected by both verifiers.
    - Two independently written step-reduced evaluators cross-checked on 10^6 random inputs at every
      step count from 1 to 64.
    - hashlib as a third independent anchor at s = 64 against the NIST test vectors.
    - 'Round-trip serialization control: every certificate serialized, reparsed and re-verified, with
      the verdict required to be identical.'
    required_metrics:
    - accept verdict on the genuine self-test certificate, per verifier
    - rejection rate over the corruption battery, per verifier and per mutated field
    - rejection rate over random-pair certificates, per verifier
    - cross-implementation agreement rate at every step count
    - serialization round-trip verdict stability
    - reproduction receipt status with the named blocking condition
  falsification_conditions:
  - Either verifier accepts any member of the corruption battery.
  - Either verifier accepts any random-pair certificate.
  - The two step-reduced evaluators disagree at any step count on any of the 10^6 cross-check inputs.
  - Either implementation misses a NIST test vector at s = 64.
  - A certificate's verdict changes across a serialization round trip.
  - The corruption family fails to cover some schema field, meaning a whole class of wrong certificates
    is untested.
  confounders:
  - Two implementations written by the same agent in one session are not truly independent and may
    share a misreading of the specification; hashlib anchors this only at full steps, and the residual
    risk at intermediate step counts is stated rather than removed.
  - A corruption family generated by the same code that generates valid certificates may inherit its
    blind spots, so the family construction is written against the schema fields rather than against
    the generator.
  - Truncation to 40 bits makes the self-test collision trivial, which is intended, but it also means
    the chain is exercised only at that truncation and not at full digest width.
  - Serialization conventions - endianness, hex case, padding - are where verifiers silently diverge,
    and the round-trip control catches only the conventions the round trip exercises.
  interpretation_limits:
  - A working verification chain is not a search capability and does not indicate any ability to find
    a nontrivial collision.
  - The self-test collision is a birthday search on a 40-bit truncated output and is not cryptanalysis
    of anything.
  - The machinery verifies relations, not complexity claims; a claimed operation count is not recheckable
    from a certificate and is out of scope.
  - Nothing here is a statement about SHA-256 at any step count, full 64-step SHA-256, HMAC-SHA-256,
    or any deployed system.
  target_complexity:
    time_exponent: No attack exponent is claimed. The self-test birthday search is about 2^20 step-reduced
      compression evaluations by construction of the 40-bit truncation, which is a counting fact about
      truncation rather than a cryptanalytic result.
    memory_exponent: No attack memory exponent is claimed. The birthday search holds about 2^20 truncated
      outputs in a hash table, a few tens of megabytes, and the verifier is constant-memory.
    best_known: No incumbent attack. The incumbent this improves on is the absence recorded in RQ-SHATWO-f196c7
      itself, which states that this program has never produced a certificate of this kind and does
      not know whether it can, and in the corpus, where 'step-reduced' and 'semi-free-start' match
      no proposal or hypothesis at all.
    hidden_overhead: 'The hidden cost is entirely human and entirely in conventions: endianness, padding,
      chaining-value handling at reduced step counts, and whether a semi-free-start relation fixes
      the chaining value before or after the feed-forward. These are where two implementations silently
      diverge and where a verifier silently accepts the wrong thing, and no amount of compute substitutes
      for writing them down. A second hidden cost is organizational: a BLOCKED reproduction receipt
      is an uncomfortable artifact to emit, and the temptation to substitute a weaker reproduction
      for the real one is exactly what the forced value of zero reproduced attacks is written to prevent.'
  dominated_by: 'n/a (no result claimed). Pareto check across time, memory and data/queries: I checked
    every frontier row present in this repository and found none - no experiment directory, evidence
    record, proposal or hypothesis produces or verifies a hash certificate of any kind, and RQ-SHATWO
    carries no proposals - so there is no prior row to dominate this one. Against external work this
    repository cannot adjudicate in either direction and this record does not attempt to.'
  sota_delta: 'no attack; conceptual/measurement contribution only. The delta is from no certificate
    capability to a self-tested one: currently this program holds zero verified hash certificates
    of any kind, and a run would hold one genuine self-test certificate accepted by two independent
    verifiers, a 400-member null battery rejected at rate 1.0, cross-implementation agreement across
    all 64 step counts, and a reproduction receipt naming its blocking condition.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'By part. (1) That the chain can be built and the self-test certificate
    produced and accepted: ~0.95, since birthday search on a 40-bit truncation is elementary and the
    rest is engineering. (2) That the corruption battery is rejected at rate 1.0 on the FIRST attempt:
    ~0.5, and deliberately near even, because verifiers that accept a wrong step count or a transposed
    byte order are the single most common defect in this kind of code and the battery exists because
    I expect it to fire at least once. (3) That the two independent implementations agree at every
    step count without iteration: ~0.6, with chaining-value handling at reduced step counts the likeliest
    divergence. (4) That any published step-reduced attack gets reproduced by this contract: 0 by
    construction and by declaration, since RQ-SHATWO-f196c7''s own constraint blocks it and this contract
    does not attempt it. The value here is almost entirely in parts (2) and (3) firing early rather
    than beside a claimed result.'
