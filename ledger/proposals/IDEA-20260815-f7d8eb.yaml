idea:
  id: IDEA-20260815-f7d8eb
  question_id: RQ-GGMB-6eaabc
  added: '2026-08-15'
  title: >-
    THE GENERIC GROUP BOUND IS QUOTED AS A BARRIER BUT EVERY INTERESTING
    METHOD LEAVES THE MODEL: enumerate the exact model extensions each known
    method requires and check which are simulable
  class: theory

  claim: >-
    The sqrt(p) generic bound constrains algorithms that see only the group
    operation. Index calculus, isogeny methods and endomorphism methods all
    leave the model, and each leaves it in a specific way -- by seeing
    coordinates, by seeing other curves, by seeing an extra map. Enumerating
    the minimal model extension each requires, and asking which are
    simulable by a generic algorithm, says which methods the bound actually
    constrains.

  mechanism: >-
    For each known method, state the minimal oracle or structural access
    beyond the group operation that it needs. For each such extension,
    determine whether a generic algorithm can simulate it, which would mean
    the extension buys nothing.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Grep 'generic group' , 'GGM', 'simulability', 'augmented oracle';
      read of KN-TECH-005 and IDEA-20260726-004.
    results: >-
      IDEA-20260726-004 proposes a machine-checkable simulability
      certificate for augmented oracles and IDEA-20260726-006 concerns a
      Frobenius-collapse simulator; no record enumerates the minimal
      extension per method across the full inventory.
    verdict: >-
      ADAPTATION. GGM simulability arguments are standard and this program
      has records on specific oracles; the contribution is the per-method
      enumeration of minimal extensions.

  object_first_candidate:
    tracked_object: >-
      THE MINIMAL MODEL EXTENSION each known method requires, and its
      simulability.
    lossiness: >-
      Reducing a method to its minimal extension discards its algorithmic
      content, which is appropriate for asking what the bound constrains.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while methods' access requirements are statable precisely;
      methods whose requirements resist statement are the enumeration's
      real content.

  null_object_control: >-
    NULL 1 -- Pollard rho, which requires no extension and must be
    constrained by the bound; a framework saying otherwise is wrong. NULL 2
    -- a method given full access to everything, which must be
    unconstrained; a framework constraining it has an error.

  discriminated_from:
    - >-
        IDEA-20260726-004, which builds simulability certificates for
        specific augmented oracles; this enumerates which oracles each
        method needs and should feed that record its list.
    - >-
        The operation-indexed taxonomy record in this series, which
        indexes by operation; this indexes by model extension, and the two
        are related but not identical.

  assumptions:
    - >-
        Each method's access requirements are statable as a minimal
        extension; methods needing several extensions jointly are reported
        as such rather than reduced to one.
    - >-
        Simulability is decidable for the enumerated extensions, at least
        at the level of a sketch; undecided cases are reported as open.

  predictions:
    - metric: >-
        rho null
      direction: different
      minimum_effect: >-
        FORCED constrained by the bound.
    - metric: >-
        full-access null
      direction: different
      minimum_effect: >-
        FORCED unconstrained.
    - metric: >-
        simulability verdict per extension
      direction: different
      minimum_effect: >-
        The deliverable; a simulable extension means the method buys
        nothing beyond generic and is a genuine finding about that
        method.

  minimal_test:
    design: >-
      Symbolic enumeration over the known-method inventory, both nulls
      first.
    controls:
      - >-
          Rho constrained-by-bound null.
      - >-
          Full-access unconstrained null.
      - >-
          Methods needing joint extensions reported as such.
      - >-
          Undecided simulability cases reported open, never assumed
          either way.
    required_metrics:
      - >-
          Minimal extension per method.
      - >-
          Simulability verdict or open status per extension.
      - >-
          Count of methods whose requirements resist statement.

  falsification_conditions:
    - >-
        A null misbehaves. The framework is wrong; halt.
    - >-
        An extension turns out simulable. The method using it buys nothing
        beyond generic, which is a real result about that method.
    - >-
        Most requirements resist statement. The enumeration cannot
        conclude and reports that.
    - >-
        All extensions are non-simulable. The bound constrains only rho-
        like methods, which is the expected outcome and is worth stating
        with an argument rather than assuming.

  confounders:
    - >-
        SIMULABILITY SKETCHES: an argument that an extension is simulable
        is easy to state loosely and hard to make rigorous, so undecided
        cases must stay open rather than being resolved by plausibility.
    - >-
        MINIMALITY: a method's stated requirement may not be minimal, and
        a non-minimal extension can look non-simulable when a weaker
        sufficient one is simulable.

  interpretation_limits:
    - >-
        Classifies model extensions; establishes no attack and no bound.
    - >-
        Scoped to the enumerated methods and stated extensions.
    - >-
        A simulability verdict at sketch level is not a proof and is
        labelled accordingly.

  heuristic_assumptions:
    - id: HEUR-GGM-EXT-1
      statement: >-
        Every known ECDLP method's advantage over generic algorithms is
        attributable to a statable minimal model extension.
      rigorous_support: >-
        Rigorous ingredient: the generic bound is a theorem about
        algorithms restricted to the group operation, so any method
        beating it must use something else. THE GAP: 'something else'
        need not be a clean oracle -- it can be a distributional
        assumption about instances, which is not a model extension at
        all and which this enumeration would miss entirely.
      falsification_condition: >-
        A method beating generic performance without any statable
        extension.
      validation_plan: >-
        SAMPLE: the full enumerated method inventory. TAIL CHECK:
        methods whose advantage seems distributional rather than
        structural, reported separately. TRANSFER: none; the enumeration
        binds the inventory.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic; no compute.
    memory_exponent: >-
      Negligible.
    best_known: >-
      The incumbent is KN-TECH-005's generic bound and the published GGM
      literature, used here and not improved.
    hidden_overhead: >-
      Distributional advantages are invisible to a model-extension framing
      and are the enumeration's structural blind spot.
    tradeoff_note: >-
      A precise extension list gives sharp simulability questions and may
      exclude methods whose advantage is distributional.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As a bound: entirely dominated by the
    published generic-group lower bound. As a per-method extension
    enumeration: none exists here. Not null on any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the minimal model extension
    each known ECDLP method requires, with a simulability verdict or an
    explicit open status per extension, and a named blind spot for methods
    whose advantage is distributional rather than structural.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.85 that both nulls behave. 0.6 that most methods' requirements are
    statable. 0.2 that any enumerated extension turns out simulable, which
    would be a real result about the method using it.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
  source_refs:
    - RQ-GGMB-6eaabc
