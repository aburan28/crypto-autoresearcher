    results: >-
      The corpus has four CSIDH records and all four are resource accounting or
      oracle cost. Self-pairings appear once, in IDEA-20260806-b7fdc3, as a
      zero-compute admissibility screen. The phrase representation technique
      appears nowhere in the SSI lane. No record prices what a partial class-group
      digest is worth.
    verdict: >-
      UNVERIFIED. The representation technique and the subset-sum exponents are
      recalled from memory and no source was opened; the CSIDH literature was not
      searched at all, and there may well be published work on meet-in-the-middle
      improvements for the CSIDH keyspace that this session cannot see. Novelty is
      therefore not labelled above unverified, and a reviewer with retrieval
      should treat the recalled citations below as the first place to look.

