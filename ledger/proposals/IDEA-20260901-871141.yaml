idea:
  id: IDEA-20260901-871141
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  added: '2026-09-01'
  status: proposed
  proposed_by: idea-generator

  title: >-
    CSIDH KEY RECOVERY IS A SUBSET-SUM MEET-IN-THE-MIDDLE THAT HAS NEVER BEEN
    GIVEN THE REPRESENTATION TECHNIQUE, AND THE EXACT REASON IS A MISSING OBJECT
    WITH A NAME. The technique needs a homomorphic digest of the class-group
    element that is computable from the CURVE and cheaper to evaluate than its
    own image size; the orbit digest costs exactly what it saves, self-pairings
    are the one known cheap digest, and the whole family is priced by one law
    cost = max(K/R, sqrt(K)) that turns a binary weak-instance flag into a graded
    exponent

  class: algorithm

  claim: >-
    (A) THE SHAPE NOBODY HAS USED. CSIDH key recovery, in the vectorization
    formulation, is: given E_0 and E_1 = [a] E_0 in the F_p-supersingular set
    acted on by Cl(O), find a. The deployed secret is not a uniform class-group
    element but an EXPONENT VECTOR e in [-m, m]^n over the n small split primes,
    with keyspace K = (2m+1)^n chosen to be about the class number h, which is
    about p^{1/2}. The best classical attack in this program's corpus is
    meet-in-the-middle or van Oorschot-Wiener at sqrt(K) = p^{1/4}. That is
    EXACTLY the structure of a subset-sum instance, and subset sum has not been
    attacked by plain meet-in-the-middle since the representation technique
    replaced it, moving 2^{0.5 n} to 2^{0.337 n}. NO RECORD IN THIS CORPUS HAS
    EVER ASKED WHY THE SAME MOVE IS NOT AVAILABLE HERE. The corpus's CSIDH
    records (IDEA-20260729-001, IDEA-20260801-007, IDEA-20260807-726e55,
    IDEA-20260815-621eea) are all cost-model or oracle-cost work and none of them
    proposes a search structure at all.

    (B) THE EXACT GATE, DERIVED HERE. The representation technique writes the
    secret e = e' + e'' with both halves drawn from a LARGER box, so the solution
    has R representations rather than one; it then imposes a random constraint of
    size R so that exactly one representation survives, and works with lists
    shrunk by the factor R. The constraint must be a map f whose value at a
    partial solution is COMPUTABLE, and in subset sum it is the partial sum
    reduced modulo a random integer. Here the analogue of the partial sum is the
    class-group element, and what the attacker holds is not the element but the
    CURVE it acts to. So the technique requires an object this record names and
    the corpus does not have:
        A HOMOMORPHIC DIGEST is a map f from the torsor to a set of size R with
        f([b] E_0) computable in time T_f from j([b] E_0) alone, and satisfying
        f([b+c] E_0) = f([b] E_0) + f([c] E_0) as elements of a group of order R.
    Given such a digest, the two-list representation search costs
        COST = max( K / R , sqrt(K) ) times T_f up to polynomial factors,
    and multi-level (four-list) versions push the first term further, down toward
    the subset-sum ratio 0.337/0.5 of the plain exponent in the best case.

    (C) THE TWO OBSTRUCTIONS, BOTH EXACT AND BOTH NAMED. First, the OBVIOUS
    digest is self-defeating: taking f = the image in the quotient by a subgroup
    H, evaluated by enumerating the H-orbit of the curve, costs T_f = |H| = R, so
    the total is R times K/R = K and the technique buys exactly nothing. THE
    DIGEST MUST BE EVALUABLE IN TIME SUBLINEAR IN ITS OWN IMAGE SIZE, and that is
    the whole content of the gate. Second, the only complete invariant available
    from the curve -- the j-invariant itself -- is not homomorphic, so it cannot
    filter; and the group law on the torsor is exactly what an attacker cannot
    evaluate without solving the problem.

    (D) WHERE A DIGEST ACTUALLY EXISTS, WHICH IS WHY THIS IS NOT AN EMPTY
    QUESTION. The oriented self-pairing machinery already in this corpus
    (KN-LIT-7489, Castryck, Houben, Merz, recorded with citation_verified read but
    NOT read by this session) produces, for suitable discriminants, a pairing
    value computable from an oriented curve whose order m divides the orientation
    discriminant, and pairing values multiply under composition. That is a
    homomorphic digest of size m evaluable in polynomial time -- exactly the
    object the gate requires. The corpus records self-pairings only as a BINARY
    WEAK-INSTANCE FLAG. This record's claim is that the cost law in (B) converts
    that flag into a GRADED quantity: a digest of size R is worth K/R, so the
    question stops being is this instance weak and becomes how many bits of
    digest does this instance leak and what exponent does that buy.

    (E) WHAT IS NOT CLAIMED. NO ATTACK ON ANY DEPLOYED CSIDH PARAMETER SET IS
    CLAIMED, NO DIGEST FOR A NON-SPECIAL DISCRIMINANT IS EXHIBITED, AND THE
    EXPONENT IN (B) IS CONDITIONAL ON AN OBJECT THAT MAY NOT EXIST. The expected
    outcome is a closure at the standard of docs/inventor-protocol.md section 4:
    named obstruction (the digest must beat its own image size), argument (the
    orbit digest costs R and saves R), forward guidance (self-pairings and any
    other polynomial-time class-group residue map are the live class, and every
    bit they leak is worth a stated amount of exponent).

  mechanism: >-
    TRACKED OBJECT. The HOMOMORPHIC DIGEST of the hidden class-group element --
    the image f([b] E_0) in a group of order R, followed under the group action
    rather than through an isogeny computation. The one-step propagation is
    defined and is what makes the object usable: acting by a generator g_i sends
    the digest to digest plus f(g_i), a fixed precomputable constant, so the
    digest of a partial exponent vector is a linear form in the exponents and can
    be maintained incrementally at no cost.

    LOSSY-PROJECTION TEST (algebraic, zero compute, and it PASSES non-trivially).
    The digest is a group homomorphism onto a set of size R while the torsor has
    size h, so the fibre has size h/R and the projection is genuinely lossy
    whenever R < h. What it discards -- the coset representative -- is discarded
    COMPATIBLY with the operation the attack applies, namely the group action,
    precisely because f is a homomorphism: the retained part propagates
    deterministically under every action step, which is exactly the property
    plain meet-in-the-middle cannot use and the representation technique
    requires. This is the reason the object is the right one rather than a
    re-coordinatisation: the j-invariant is a complete invariant, hence a
    projection that loses nothing, hence by the test of
    docs/inventor-protocol.md section 2 a change of coordinates and not an
    object; the digest is its lossy quotient and the whole attack lives in the
    difference.

    THE ALGORITHM, STATED SO IT CAN BE PRICED. Precompute f(g_i) for each of the
    n generators, at cost n T_f. Split the exponent box into two halves drawn
    from a widened box so the true solution has R representations. Enumerate each
    half restricted to the linear condition (digest of the half equals a fixed
    random value), which is a linear-algebra restriction and is sub-enumerable
    rather than filtered after the fact. Match the two restricted lists by curve.
    Verify each candidate by evaluating the action, which the effective group
    action machinery makes polynomial. Every step except the digest exists today.

  novelty_status: unverified

  novelty_screen:
    kb_retrieval: >-
      NOT AVAILABLE THIS SESSION. The retrieval index is empty because
      CRYPTO_KB_QDRANT_URL is the in-memory sentinel; no query was issued and no
