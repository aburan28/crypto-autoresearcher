  assumptions:
    - The class group Cl(O) and its structure are known to the attacker, which
      for CSIDH-512 the corpus records as having been computed publicly.
    - The action can be evaluated in polynomial time for the group elements the
      algorithm needs, so verification is not the bottleneck.
    - The keyspace is the deployed exponent box rather than the full class group,
      so a representation split of the box is meaningful.

  object_first_candidate:
    established_families_off_limits: >-
      Off-limits as the primary lens: Kuperberg and collimation-sieve quantum
      hidden shift, the FC0 resource-vector formalism, plain meet-in-the-middle
      and van Oorschot-Wiener distinguished points, lattice reduction on the
      relation lattice, endomorphism-ring recovery, and the whole
      supersingular-over-F_{p^2} ball machinery.
    tracked_object: >-
      The homomorphic digest f([b] E_0) of the hidden class-group element, in a
      group of order R, followed under the group action.
    newness_score: >-
      Genuinely new in this corpus and, as far as this session can determine
      without retrieval, not previously framed this way for group actions. The
      nearest corpus object is the self-pairing value, which is recorded only as
      a yes-or-no weakness flag and never as a filter inside a search.
    testability_score: >-
      High, and testable WITHOUT solving anything, because the digest can be
      supplied as an oracle of tunable size R on a toy group action and the cost
      law measured directly against a null digest.
    survival_score: >-
      The digest survives arbitrarily many action steps by homomorphy -- it never
      decays, which is unusual and is exactly why it would be valuable. What
      limits it is not decay but existence and evaluation cost.

  proof_search_map:
    bottleneck: >-
      The meet-in-the-middle lists have size sqrt(K) because there is no way to
      filter a partial guess before matching. Every improvement over sqrt(K) for
      a search of this shape in the symmetric and coding literature comes from a
      cheap partial-consistency test, and here there is none.
    baseline_embedding:
      parameter_slice: >-
        R = 1, i.e. no digest. The cost law max(K/R, sqrt(K)) returns sqrt(K),
        which is exactly the plain meet-in-the-middle baseline p^{1/4} recorded
        by this program. R = h with a free digest returns K/h times polynomial,
        which is polynomial and is the fully-broken case the self-pairing results
        already occupy for special discriminants. Both endpoints are known and
        the law must reproduce them.
      reproduction_check: >-
        Numerical, on a toy group action with a known order and a known secret:
        run the implementation with R = 1 and confirm the measured operation
        count matches sqrt(K) within a small factor, and with R = h and confirm
        it matches polynomial. A frozen fixture pins both endpoints before any
        intermediate R is reported.
    observation_collision:
      observable: >-
        The digest value f([b] E_0), a residue in a group of order R.
      distinct_preimage_search: >-
        Collisions are guaranteed by construction: the fibre has size h/R. THAT
        IS THE POINT AND NOT A DEFECT, because the digest filters and never
        certifies -- the certificate is a recovered exponent vector verified by
        re-evaluating the action, which the run wrapper checks independently.
        The audit that matters is whether the digest is EQUIDISTRIBUTED on the
        fibre, since a digest concentrated on a few values has effective size far
        below R and buys correspondingly less. The minimal test measures the
        empirical entropy of the digest and uses the EFFECTIVE size, not the
        nominal R, in every downstream number.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the vectorization instance to a model where the partial-solution
          condition is an exact linear equation over Z/R, namely the digest
          equation sum_i e_i f(g_i) = r. Encoding, completeness, soundness,
          transfer and cost loss are then separate obligations, and the cost loss
          is precisely T_f.
        predicted_gain: >-
          cost = max(K/R, sqrt(K)) times T_f. Zero when no digest exists, which
          is the predicted outcome for generic discriminants; substantial where a
          self-pairing digest exists, which is the case the corpus currently
          records only as broken or not broken.
      - transform: specialization_pack
        proposed_object: >-
          A resource measure equal to (list size) times (digest evaluation cost),
          realised by specialising to a toy commutative group action with an
          oracle digest of tunable size, with charges added over the disjoint
          blocks (precompute, enumerate, match, verify).
        predicted_gain: >-
          Converts the qualitative claim that a partial invariant would help into
          a measured curve of cost against R with a null.
    quantifier_order: >-
      exists a group order R and a map f, for all p in the family and all
      instances (E_0, E_1) of the deployed shape, f is computable from j alone in
      time T_f much smaller than R and satisfies the homomorphy identity. The
      quantifier order is the whole difficulty: a digest allowed to depend on the
      INSTANCE would be trivial to write down (take f = the answer) and useless,
      while a digest allowed to cost R is the orbit digest and buys nothing. Both
      degenerate readings are excluded by the order and by the cost bound, and
      naming that is a large part of what this record contributes.
    method_ceiling:
      strongest_certifiable_claim: >-
        A classical time exponent for CSIDH-style vectorization of the form
        max(K/R, sqrt(K)) times T_f, conditional on a digest of effective size R
        and cost T_f, over the exponent-box keyspace only. The method cannot
        certify anything about the quantum setting, cannot certify anything about
        uniform class-group secrets rather than box secrets, and cannot exhibit a
        digest.
      nearby_object_control: >-
        Apply the identical machinery to a group action with a PROVABLY
        structureless digest, namely a random function of the curve with the same
        output size and no homomorphy. The conclusion (cost below sqrt(K)) is
        known false there because a non-homomorphic filter cannot be maintained
        under the action. If the implementation still reports a speedup with the
        random digest, the argument proves too much and the measurement is wrong.
    proof_obligations:
      - claim: R = 1 reproduces sqrt(K), the recorded classical baseline.
        responsibility: baseline
      - claim: The digest equation is linear in the exponents and sub-enumerable.
        responsibility: feasibility
      - claim: Number of representations R_max of a box split, computed exactly.
        responsibility: size
      - claim: cost = max(K/R, sqrt(K)) times T_f up to polynomial factors.
        responsibility: runtime
      - claim: Memory equals the shrunk list size K/R, not K.
        responsibility: memory
      - claim: >-
          The orbit digest has T_f = R and therefore total cost K, so it is
          excluded; any admissible digest must have T_f much smaller than R.
        responsibility: strictness
      - claim: Verification of a candidate is polynomial via an effective action.
        responsibility: interface
      - claim: >-
          Scope is classical cost, exponent-box keyspace, and the specific group
          action tested; no quantum and no deployed-parameter claim.
        responsibility: scope
    not_applicable_reason: null

  predictions:
    - metric: >-
        measured operation count of the representation search on a toy group
        action, as a function of oracle digest size R, in units of group-action
        evaluations
      direction: lower
      minimum_effect: >-
        Predicted to follow max(K/R, sqrt(K)) within a factor of 4 across at
        least three decades of R. A measured curve that does not bend at
        R = sqrt(K) falsifies the law
    - metric: >-
        measured operation count with a NON-homomorphic random digest of the same
        output size
      direction: different
      minimum_effect: >-
        Predicted to be sqrt(K) at every R, i.e. NO speedup at all. Any measured
        speedup here is an artifact and invalidates the treatment arm
    - metric: >-
        empirical entropy of the digest over the torsor, reported as an effective
        size R_eff
      direction: lower
      minimum_effect: >-
        Predicted R_eff within a factor 2 of R for a homomorphic digest onto a
        cyclic quotient. If R_eff is far below R the nominal size overstates the
        gain and every downstream number must use R_eff
    - metric: >-
        exact count R_max of representations of a box secret under a widened-box
        split, computed combinatorially for the deployed CSIDH-512 shape
      direction: higher
      minimum_effect: >-
        Predicted about m^n, which at m = 5 and n = 74 is about 2^{172}. This is a
        zero-compute arithmetic check and bounds the best R the technique could
        ever exploit
    - metric: >-
        the digest evaluation cost T_f of every candidate digest the survey finds,
        expressed as a ratio to its image size R
      direction: lower
      minimum_effect: >-
        The gate is T_f/R much smaller than 1. Predicted that the only candidates
        achieving it are self-pairing-type maps at special discriminants, and that
        every generic candidate returns T_f/R at least 1

  minimal_test:
    design: >-
      THE MINIMAL TEST DELIBERATELY DOES NOT TOUCH CSIDH. It tests the cost law
      and the gate on a toy commutative group action where ground truth is free,
      because the law is what decides whether hunting for a digest is worth
      anything. Stage 0, zero compute: compute R_max for the deployed box shape
      exactly, and verify the two endpoints of the cost law symbolically. Stage 1:
      implement a toy free transitive action of a cyclic or small abelian group of
      order h in the range 2^{20} to 2^{30} on an abstract set, with a box-shaped
      keyspace of the same size, together with an ORACLE digest f of tunable size
      R that is a genuine homomorphism. Run plain meet-in-the-middle and the
      two-list representation search, and record operation counts and peak memory
      against R. Stage 2: repeat with the null digests. Stage 3, survey, zero
      compute: enumerate every candidate digest this program can name for the real
      CSIDH setting -- self-pairing values, orbit digests, class-group characters
      evaluated on the curve, any invariant derived from the F_p point counts --
      and for each record whether it is homomorphic and what T_f/R it achieves,
      with the honest answer unknown where it is unknown.
    controls:
      - >-
        NULL OBJECT ONE, random non-homomorphic digest. Identical output size,
        identical pipeline, digest replaced by a random function of the set
        element. Predicted no speedup at any R. This is the control that decides
        whether the measured effect is homomorphy or bookkeeping.
      - >-
        NULL OBJECT TWO, orbit digest with its true cost charged. Implement the
        digest by enumerating the subgroup orbit and charge T_f = R honestly.
        Predicted total cost K at every R, i.e. exactly no gain, which is the
        exact obstruction of claim (C) turned into a measurement.
      - >-
        BASELINE ARM. R = 1 must reproduce plain meet-in-the-middle at sqrt(K)
        within a small factor before any R > 1 number is quoted.
      - >-
        DECAY CHECK. The measured cost must FALL as R rises and must FLATTEN at
        sqrt(K). A cost that does not respond to R is the artifact tell of
        docs/inventor-protocol.md section 3 and the run is rejected.
      - >-
        SHUFFLED-SECRET CONTROL. Re-run with the secret drawn uniformly from the
        whole group rather than from the box. The representation gain must
        disappear, because the technique exploits the box; if it does not, the
        implementation is exploiting something other than what is claimed.
    required_metrics:
      - group-action evaluations and peak memory against R, per arm
      - measured exponent of cost against K at fixed R/K ratio, across three h sizes
      - empirical digest entropy and R_eff
      - exact R_max for the deployed box shape
      - for each surveyed candidate digest, the pair (homomorphic yes or no, T_f/R)

  falsification_conditions:
    - >-
      The measured cost with a genuine homomorphic oracle digest does NOT follow
      max(K/R, sqrt(K)) within a factor of 4. The cost law is wrong and the whole
      record is superseded, including its gate.
    - >-
      The random non-homomorphic digest arm shows a speedup. The treatment
      measurement is an artifact and nothing may be read from it.
    - >-
      The R = 1 baseline arm does not reproduce sqrt(K). The instrument is broken
      and no number is quotable.
    - >-
      The survey finds NO candidate digest with T_f/R below 1 other than
      self-pairings at special discriminants. The lane is then CLOSED for generic
      discriminants at the standard of section 4, with the named obstruction
      being that every known class-group residue map on the torsor costs at least
      its own image size, the argument being the orbit-digest computation, and
      the forward guidance being that the live class is polynomial-time pairings
      and any future class-group character evaluable from the curve. The
      obstruction block records the measured T_f/R for every surveyed candidate.
    - >-
      The survey finds a homomorphic digest with T_f/R below 1 at a NON-special
      discriminant. The lane opens, the exponent 1/4 is no longer the classical
      baseline for that family, and under AGENTS.md rule 12 the claim goes to
      independent review-breakthrough at max effort before anything else.

  confounders:
    - >-
      A toy group action is not CSIDH and the measured constants do not transfer.
      Only the SHAPE of the cost curve transfers, and H2 states that assumption
      explicitly.
    - >-
      The two-list representation search is the weakest form of the technique.
      Measuring only it will understate the achievable gain relative to
      four-list and recursive versions, so the record must report which variant
      was measured and must not quote the subset-sum 0.337 figure as if measured.
    - >-
      Sub-enumeration of the digest-restricted list is a real implementation
      requirement, not a detail. An implementation that enumerates and then
      filters will measure cost K rather than K/R and will falsely refute the law.
      The design requires the restricted enumeration to be implemented and its
      correctness checked by counting.
    - >-
      Box structure interacts with the class-group relation lattice, so the true
      number of representations for real CSIDH may differ from the naive
      combinatorial count. The record computes the naive count and flags it as an
      upper estimate.

  interpretation_limits:
    - >-
      NO DIGEST FOR A GENERIC CSIDH DISCRIMINANT IS EXHIBITED AND NONE IS ASSERTED
      TO EXIST. The exponent claim is conditional on an object that may not exist,
      and the predicted outcome is that it does not for generic parameters.
    - >-
      No claim is made about any deployed CSIDH parameter set. The concrete
      figures in the claim are illustrative arithmetic on recalled parameters and
      carry the provenance of those citations.
    - >-
      Classical costs only. Nothing here bears on Kuperberg, collimation, or any
      quantum cost, and it must not be quoted in that context.
    - >-
      The frozen source explicitly lists group-action constructions including
      CSIDH as SAFE from its p^{1/3} algorithm. That scope statement is
      untouched by this record, which concerns a different attack entirely.
    - >-
      Academic and defensive analysis only, per RQ-SSI-001 constraints.

  heuristic_assumptions:
    - id: H1
      statement: >-
        For the deployed exponent-box keyspace and a split into two widened
        boxes, the number of representations of a uniformly random secret is
        concentrated around its mean R_max, with the fraction of secrets having
        fewer than R_max/2 representations bounded by a constant less than 1/2.
      rigorous_support: >-
        Rigorous side: R_max is an exact product of per-coordinate counts and is
        computable by a closed formula, so the mean is not assumed. Classical
        side: the assumption imitates the standard concentration statement used
        in the subset-sum representation analysis, where the count is a product
        of independent per-coordinate terms and concentrates by a Chernoff bound.
      validation_plan: >-
        Sample. Draw 10^6 secrets from the deployed box shape (n = 74, m = 5 as
        recalled, and re-run for whatever shape the corpus's own CSIDH parameter
        record actually holds), count representations exactly per secret by the
        product formula, and build the empirical distribution. Scale. The count
        is combinatorial so this is exact at deployed parameters with no toy
        transfer at all -- this heuristic is validated at full scale by
        construction. Comparison. Empirical distribution against the Chernoff
        prediction. Tail check. Report the 1st percentile of the representation
        count, since the attack's success is governed by the tail and not the
        mean.
    - id: H2
      statement: >-
        The cost curve max(K/R, sqrt(K)) measured on a toy commutative group
        action with an oracle digest transfers in SHAPE, though not in constants,
        to any free transitive commutative group action of cryptographic size
        with a digest of the same effective size.
      rigorous_support: >-
        NONE beyond the observation that the analysis uses only the group law and
        list sizes and never any property of the underlying set. That is
        suggestive and is not a proof, and it is isolated here so a reviewer can
        reject it without touching H1 or the gate.
      validation_plan: >-
        Measure the curve at three toy group sizes spanning at least 2^{10} and
        fit the exponent of cost against K at fixed R/K. If the fitted exponent
        drifts with K, the shape does not transfer and H2 is refuted at the tested
        scope. Report the drift with an interval rather than asserting stability.
    - id: H3
      statement: >-
        A self-pairing value of the kind recorded in KN-LIT-7489 is a homomorphic
        digest in the sense of claim (B), i.e. its value at [b+c] E_0 is
        determined by its values at [b] E_0 and [c] E_0 through the group law of
        the pairing target.
      rigorous_support: >-
        NONE ESTABLISHED HERE. This session did not open KN-LIT-7489 and is
        relying on the corpus summary in IDEA-20260806-b7fdc3, which states an
        order-divisibility property and isogeny compatibility but which this
        session cannot convert into the homomorphy identity without reading the
        source. THIS IS THE SINGLE MOST IMPORTANT UNVERIFIED STEP IN THE RECORD
        AND IT IS FREE TO CHECK.
      validation_plan: >-
        Zero compute, and it should be done before anything else: read
        KN-LIT-7489 and answer one binary question with a citation -- is the
        self-pairing value multiplicative under composition of the class-group
        action, and is it computable from the curve alone in polynomial time. If
        the answer is no, claim (D) is withdrawn and the record's only live
        content is the gate and the closure. If yes, instantiate the cost law at
        the discriminants where the pairing has order m and report the exponent
        K/m against sqrt(K) for each.

  target_complexity:
    time_exponent: >-
      Classical, conditional on a homomorphic digest of effective size R and cost
      T_f: max(K/R, K^{1/2}) times T_f, with K about p^{1/2} for deployed CSIDH
      shapes, so the exponent in p runs from 1/4 at R = 1 down to
      (1/2) log_p(K/R) as R grows. At the combinatorial ceiling R = R_max about
      m^n the illustrative arithmetic on recalled CSIDH-512 parameters gives
      about 2^{84} against the 2^{128} baseline, i.e. an exponent near 0.16 in p
      -- STATED AS AN UPPER BOUND ON THE UPSIDE AND NOT AS A CLAIM, since no
      digest of that size is known or plausible.
    memory_exponent: >-
      The shrunk list size K/R, so memory falls with the same factor as time in
      the K/R branch and equals K^{1/2} in the saturated branch. Unlike the
      supersingular ball algorithms, this family improves memory and time
      together, which is worth recording because memory is the binding constraint
      in the neighbouring lane.
    best_known: >-
      Classical meet-in-the-middle or van Oorschot-Wiener at K^{1/2}, which for
      deployed CSIDH shapes is about p^{1/4}; the program's own baseline records
      for the CSIDH lane are IDEA-20260801-007 and the FC0 series, none of which
      improves on it. Quantum bounds are out of scope for this record.
    hidden_overhead: >-
      T_f multiplies everything and is charged explicitly, never absorbed. The
      restricted enumeration carries a polynomial factor in n. The verification
      step carries the cost of an effective group action evaluation, which the
      recalled Pegasis line makes polynomial but with constants this record does
      not estimate. Nothing superpolynomial is hidden, which is a difference from
      the neighbouring supersingular lane and should not be read as a strength
      until the digest exists.
    tradeoff_note: >-
      The K/R branch is not a claw search and does not sit on the van
      Oorschot-Wiener curve; it is a filtered list match, so its memory cannot be
      traded down by distinguished points in the usual way and a low-memory
      variant is an open sub-question rather than a known interpolation. The
      saturated branch K^{1/2} is an ordinary claw and does interpolate as usual.
      Parallelisation is straightforward for both enumeration and matching.

  estimated_cost:
    implementation: medium
    compute: low
    detail: >-
      Stage 0 and stage 3 are zero compute and are where most of the decision
      value sits. Stage 1 is a self-contained implementation on an abstract group
      action with no isogeny arithmetic at all, which is a few hundred lines and
      hours of runtime at h up to 2^{30}. The single cheapest and most valuable
      action in the whole record is the H3 reading of KN-LIT-7489, which costs
      nothing and either supplies the one known digest or withdraws claim (D).

  deduplication:
    closest_existing:
      - id: IDEA-20260806-b7fdc3
        difference: >-
          b7fdc3 uses the self-pairing as a ZERO-COMPUTE ADMISSIBILITY SCREEN
          over assumptions -- a binary flag saying an instance is or is not in the
          known weak class -- and its deliverable is a screen never run. This
          record uses a digest INSIDE A SEARCH and prices it as a graded quantity
          by the law max(K/R, sqrt(K)), so a pairing of order m stops being a flag
          and becomes worth a stated exponent. If b7fdc3 runs first, its output
          feeds this record; the two are complementary and their tests share no
          arm.
      - id: IDEA-20260801-007
        difference: >-
          007 measures the effective collision surface available to a van
          Oorschot-Wiener distinguished-point attack on the CSIDH action at toy
          scale. That is a measurement of the EXISTING sqrt(K) attack's surface.
          This record proposes a different search structure entirely and its
          baseline arm is exactly 007's object, used as a calibration rather than
          as the subject.
      - id: IDEA-20260807-726e55
        difference: >-
          726e55 writes a charged quantum collimation-sieve cost equation and
          argues the quantum lane was wrongly deferred. Quantum, cost-model, and
          about the sieve. This record is classical, structural, and about the
          keyspace geometry. No overlap beyond the word CSIDH.
      - id: IDEA-20260815-621eea
        difference: >-
          621eea measures the class-group action evaluation cost that the quantum
          oracle must implement. This record uses effective action evaluation as
          an assumed polynomial primitive and does not measure it; if 621eea
          returns a large cost, this record's T_f and verification terms inherit
          it, which is a dependency and not an overlap.
      - id: IDEA-20260729-001
        difference: >-
          729-001 is the FC0 typed resource-vector gate, a source-reconciliation
          formalism for quantum resource accounting. Its own successor record
          IDEA-20260803-82b2b7 proposes terminating it. Nothing about it concerns
          a classical search structure.
      - id: IDEA-20260901-65c009 and IDEA-20260901-deaf80
        difference: >-
          Sibling records filed the same session, both on the supersingular
          F_{p^2} side with balls and minimal degrees. This record touches
          neither; its object lives on the class-group torsor and its baseline is
          p^{1/4} rather than p^{1/3}. The only shared content is the discipline.
    not_a_restatement_of: >-
      Not a restatement of the twelve BATCH-046 closures, none of which concerns
      CSIDH at all -- the frozen source itself lists group-action constructions as
      outside the range of the p^{1/3} algorithm, and this program's CSIDH lane
      has produced no structural proposal in roughly thirty batches, which
      IDEA-20260807-726e55 records in those terms.

  dominated_by: >-
    Classical meet-in-the-middle and van Oorschot-Wiener at K^{1/2}, about
    p^{1/4}, dominates this record as filed, because no digest is exhibited and
    at R = 1 the law returns exactly that baseline. Checked against every
    frontier row this program records for the CSIDH lane: (i) plain
    meet-in-the-middle, time K^{1/2}, memory K^{1/2} -- tied at R = 1, not
    beaten; (ii) van Oorschot-Wiener distinguished points, time K^{1/2} with
    tunable low memory -- DOMINATES this record on the memory axis at R = 1,
    since the record's saturated branch has no known low-memory variant;
    (iii) Kuperberg and collimation, quantum subexponential -- a different cost
    model and not comparable classically, recorded here rather than ignored;
    (iv) self-pairing attacks at special discriminants, polynomial time -- these
    DOMINATE this record entirely on exactly the instances where a digest is known
    to exist, which is an uncomfortable and important fact: the one place the
    mechanism is instantiable is already broken by a cheaper attack. The live
    region is therefore instances with a SMALL digest that is not large enough to
    break them outright, and whether that region is non-empty is itself open.
  sota_delta: >-
    +0 as filed, quantitatively, since R = 1 reproduces the baseline exactly.
    Conditional delta, stated as a function so it cannot be inflated: with an
    effective digest of size R, time and memory fall from K^{1/2} to K/R while
    K/R exceeds K^{1/2}, i.e. a saving of a factor R/K^{1/2}; in exponent terms
    over p the exponent falls from 1/4 to (1/2)(1 - log_K R). Illustrative only,
    on recalled CSIDH-512 parameters, R = 2^{172} would give about 2^{84} against
    2^{128}, i.e. 44 bits -- and no digest remotely that large is known, plausible
    or claimed. The deliverable actually expected is the closure plus a measured
    table of (homomorphic, T_f/R) for every candidate digest the survey names.

  recommended_priority: medium
