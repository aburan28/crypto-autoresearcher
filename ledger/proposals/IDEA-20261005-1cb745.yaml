      nearby_object_control: not_applicable
    proof_obligations:
      - claim: not_applicable
        responsibility: not_applicable
    not_applicable_reason: >-
      Exhaustive support count on 480 differences. Not a theorem, reduction,
      certificate family, or asymptotic bound.
  predictions:
    - metric: min_active_sboxes_after_linear_layer
      direction: higher
      minimum_effect: >-
        At least 2, which is 1 above the identity map's minimum of 1 on the
        same 480 differences.
  minimal_test:
    design: >-
      Pin the S-boxes and the linear transformation. Reject the run unless
      one published full-round test vector matches. Apply the linear
      transformation to each of the 480 single-S-box differences and record
      the minimum number of active 4-bit windows. Repeat with the identity
      map.
    controls:
      - >-
        Identity map on the same 480 differences. Its minimum is 1. A run
        that does not return 1 on the identity is invalid.
      - >-
        The zero difference, computed separately. It has 0 active S-boxes
        and is not included in the minimum.
    required_metrics:
      - minimum active-S-box count on the 480 images
      - identity-map minimum on the same 480 inputs
      - test-vector pass or fail
  falsification_conditions:
    - >-
      The completed minimum on the 480 images is 1 or 0.
    - >-
      The identity control does not return minimum 1. That voids the run.
      It is not evidence about Serpent.
  confounders:
    - >-
      A transposed or byte-wise windowing changes the count. The windowing
      is part of the pin.
    - >-
      A failed test vector means the pin is wrong. That is an
      infrastructure outcome, not a branch result.
    - >-
      IDEA-20260808-76260d and IDEA-20260808-83b3ba, both opened, are AES
      active-S-box claims on RQ-AES-001 and RQ-AES-003. They are not this
      count.
    - >-
      KR-RHO-fb88e6 is a Pollard-rho negation walk. A string match on
      "cycle" or "map" does not make the 480 differences into group steps.
    - >-
      KR-IC-73db3f is a binary-field factor-base subspace V. The 32 Serpent
      S-box windows are not an F_2-subspace of curve x-coordinates.
  interpretation_limits:
    - >-
      A minimum of 2 on this input class does not bound differences that
      start in two or more S-boxes, does not give a differential
      probability, and does not reach the 11-round figure relayed by
      KN-LIT-3430.
    - >-
      The corpus entry's plaintext and time figures were not checked
      against the paper.
    - >-
      The square-root-of-2 iteration factor and the 1.29 practical gain in
      KR-RHO-fb88e6 are not applied to this count.
    - >-
      KR-IC-73db3f's degree drop from a small product space V^(i) is not
      applied. Factor-base elements used: 0.
  heuristic_assumptions:
    - id: H1
      statement: >-
        A uniform random element of GL(16, F_2), in the 16-bit model with
        four 4-bit windows, sends a fixed nonzero vector to a uniform
        nonzero vector. The probability that the image lies in one window
        is 4*(2^4-1)/(2^16-1) = 60/65535.
      rigorous_support: >-
        Counting. There are 4 windows and 15 nonzero patterns in each.
        There are 2^16-1 nonzero vectors. No Serpent theorem is used. The
        16-bit model checks this count. It is not a sample of the 128-bit
        linear transformation.
      validation_plan:
        sampling: >-
          Draw 200 independent uniform elements of GL(16, F_2) by rejection
          sampling on invertible matrices, apply each to one fixed
          weight-1 vector, and record whether the image lies in a single
          4-bit window.
        comparison: >-
          The observed fraction against 60/65535.
        tail_check: >-
          The number of single-window hits. Under a binomial model with
          n=200 and p=60/65535 the expected count is below 1. Eight or more
          hits rejects the counting implementation.
        parameters: >-
          Dimension 16, four windows, 200 draws, one fixed weight-1 input.
          No transfer to the 128-bit Serpent map is claimed.
  target_complexity:
    time_exponent: >-
      No attack exponent. The count is 480 applications of one pinned
      128-bit linear map. Rho iterations charged: 0. Factor-base elements
      charged: 0.
    memory_exponent: >-
      One 128-bit vector at a time. No memory exponent.
    best_known: >-
      KN-LIT-3430 relays an 11-round differential-linear attack. KR-RHO-fb88e6
      states a square-root-of-2 reduction in expected rho iterations, with
      practical gain 1.29. KR-IC-73db3f states a degree drop from a small
      product space after Weil descent. This record does not improve any of
      those figures and does not treat the printed 2125.3 and 2139.2 as
      checked costs.
    hidden_overhead: >-
      Bit-order pinning and one full-round test vector. No o(1) attack
      term is claimed.
    tradeoff_note: >-
      Data is the 480 differences, exhaustive inside that class. Parallelism
      across differences does not change the minimum. The negation-map
      fruitless-cycle term 1/(2r) is not a term in this count. The factor-base
      dimension dim V^(i) is not a term in this count.
