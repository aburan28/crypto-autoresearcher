      verified_by: idea-generator session 2026-10-05, KN-LIT-3430.md opened
    - ref: KN-TECH-066
      provenance: internal
      claim: >-
        The technique note separates keyed differential data, paid at
        p^{-1}, from unkeyed freedom-degree accounting. This record is a
        keyed linear-layer support count and spends no freedom degrees.
      verified_by: idea-generator session 2026-10-05, KN-TECH-066.md opened
    - ref: KR-RHO-fb88e6
      provenance: internal
      claim: >-
        The opened row states that walking on {±P} classes gives a square-root-of-2
