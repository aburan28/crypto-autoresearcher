        r-adding walk. Best practical gain stated there is 1.29. This
        Serpent count performs 0 rho iterations and 0 negation-class walks.
      verified_by: idea-generator session 2026-10-05, KR-RHO-fb88e6.yaml opened
    - ref: KR-IC-73db3f
      provenance: internal
      claim: >-
        The opened row states that in binary-field point decomposition the
        factor base is the set of points whose x-coordinate lies in an
        F_2-subspace V, and that choosing V so the product spaces V^(i)
        have small dimension lowers degree and variable count after Weil
        descent. This Serpent count uses 0 factor-base elements and 0
        product spaces V^(i).
      verified_by: idea-generator session 2026-10-05, KR-IC-73db3f.yaml opened
    - ref: Biham-Anderson-Knudsen Serpent AES submission
      provenance: recalled
      claim: >-
        Recalled as the source of the eight 4-bit S-boxes and the bitsliced
        linear transformation. Pointer only. This session did not open the
        submission. Nothing in the claim depends on a remembered branch
        number.
  assumptions:
    - >-
      XOR differences ignore key addition, so omitting whitening does not
      change S-box activity.
    - >-
      Activity means the four bits of one published S-box window are not
      all zero. The windowing and bit order are those of the pinned
      implementation that passed the test vector.
    - >-
      The 480 inputs are exactly the differences whose support lies in one
      of the 32 windows. The zero difference is excluded.
  proof_search_map:
    bottleneck: not_applicable
    baseline_embedding:
      parameter_slice: not_applicable
      reproduction_check: not_applicable
    observation_collision:
      observable: not_applicable
      distinct_preimage_search: not_applicable
    constructive_transforms:
