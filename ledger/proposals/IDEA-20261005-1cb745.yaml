idea:
  id: IDEA-20261005-1cb745
  question_id: RQ-SERP-722a09
  added: '2026-10-05'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Serpent linear-layer branch on the 480 single-S-box differences
  class: measurement
  claim: >-
    Under the reduced-round convention that omits key whitening, pins the
    published Serpent S-boxes and linear transformation, and checks one
    full-round test vector before any count, the minimum number of active
    4-bit S-boxes in the image of that linear transformation, taken over the
    480 nonzero differences supported in a single S-box, is at least 2. The
    identity map on the same 480 differences has minimum 1. A completed count
    whose minimum is 1 or 0 falsifies the branch claim. The count is not a
    distinguisher, not a key-recovery attack, and not a statement about any
    round beyond this one linear layer.
  mechanism: >-
    Activity is the support of an XOR difference across the 32 published
    4-bit windows. Key addition cancels in an XOR difference, so whitening
    does not change the count. The identity map preserves a single-S-box
    support, so its minimum on this input class is 1 whenever the difference
    is nonzero. The published linear transformation is the only map under
    test. Two outcomes mean different things. Minimum at least 2 means every
    single-S-box input difference is sent into at least two S-boxes.
    Minimum 1 means at least one single-S-box difference stays inside one
    S-box, so this layer does not force a branch on that class. Minimum 0
    means the pinned map sent a nonzero difference to zero.
  novelty_status: unverified
  citations:
    - ref: RQ-SERP-722a09
      provenance: internal
      claim: >-
        The question asks, family by family, at which round a certified
        bound stops, and it requires a random-permutation or nearby-object
        null before a bias is believed. This record measures one linear
        layer, not an 11-round attack.
      verified_by: idea-generator session 2026-10-05, question file opened
    - ref: KN-LIT-3430
      provenance: internal
      claim: >-
        The corpus entry, confidence reported, relays an abstract claiming
