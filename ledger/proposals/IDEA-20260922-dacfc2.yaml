    (B-571) group operations at O(w) memory and full vOW parallel efficiency.
    FRONTIER ROWS CHECKED: (i) negation-only rho; (ii) <tau,-1> rho; (iii)
    vOW at its Pareto minimum; (iv) exhaustive search; (v) Semaev 2015's
