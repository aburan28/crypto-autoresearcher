idea:
  id: IDEA-20260922-dacfc2
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE MEMORY AXIS IS THE UNTESTED CURVE-GRANULARITY DISCRIMINATOR: every
    K/B comparison this lane has filed today (IDEA-20260922-1a081a's C1-C3,
    IDEA-20260922-8ac1ea's factorial) is TIME-only and says so explicitly,
    while RQ-SEMBIN-fa2e3f's own decision target (d) names a memory-charged
    crossover that "no memory-charged crossover has been computed by anyone,
    in the paper or since". KN-LIT-796's own already-cited claim -- that a
    Frobenius-invariant factor base divides the relation-search polynomial-
    system COUNT by m and the LINEAR-ALGEBRA cost by m^2 -- is a statement
    about matrix DIMENSION, hence a memory statement as much as a time one,
    and nobody has read it that way at curve granularity.
  class: measurement
  claim: >-
    R1-neutral (field representation of coordinates, inherited from whatever
    line it indexes). The attack stage whose charged MEMORY this record puts
    on the table for the first time in this lane is LINEAR ALGEBRA -- the
    phase RQ-BINSTD-b6f698's own methods block names as its own column,
    "in field operations and bytes", and which every filed binary cost law
    this session has read (1a081a's C1-C3, 8ac1ea's factorial) has reported
    only on the TIME axis.

    (M1) THE GAP, STATED PRECISELY. IDEA-20260922-1a081a's target_complexity
    block reads, verbatim: "memory_exponent: Unchanged and inherited per
    line." That is an honest disclosure, not an oversight, but it leaves the
    question's own decision_target -- "each phase charged in a hardware-
    independent primary unit... Beside every non-empty cell, matched rho...
    and the ratio" -- with a memory column that is empty for every one of the
    ten FIPS rows. RQ-SEMBIN-fa2e3f's decision_target (d) independently names
    the same gap for the SEMBIN lane's own field-granularity table. Neither
    gap has been filled by a curve-indexed number.

    (M2) THE CANDIDATE FILL, FROM A SOURCE ALREADY IN THIS SESSION'S CITATION
    CHAIN. KN-LIT-796 (Galbraith-Granger-Merz-Petit, ePrint 2020/1315, quoted
    inside IDEA-20260915-8fe0ef and re-cited by both this lane's sibling
    records): "Frobenius-invariant factor bases reduce the number of
    polynomial systems by 1/n and linear algebra by n^2." The first factor
    (1/n) is a statement about how many decomposition ATTEMPTS are needed --
    the relation-count multiplier both siblings already treat as the
    Frobenius-aware branch's mechanism. The SECOND factor (n^2) is a
    statement about the LINEAR-ALGEBRA MATRIX -- its two dimensions (rows:
    the number of relations retained; columns: the factor-base size, or its
    orbit-quotiented reduction) each shrink by a factor of n under a
    Frobenius-invariant construction, giving n^2 fewer matrix entries. This
    is exactly the "bytes" half of RQ-BINSTD's own linear-algebra column, and
    it applies ONLY on curves where tau is an endomorphism -- i.e. ONLY on
    the K-rows, by (P3) of IDEA-20260922-8ac1ea's own factorisation (tau
    exists iff a AND b both lie in F_2, which this session's own hex
    decoding of the audit dump confirms holds for K-163 (a=1,b=1) and for
    K-233/283/409/571 (a=0,b=1), and fails for every B-partner: B-163 has
    a=1 but b a 163-bit generic value; B-233/283/409/571 have a=1 -- also in
    F_2 -- but b generic in every case, so tau fails on the b side for all
    five B-curves, matching 8ac1ea's own reading).

    (M3) THE PREDICTION THIS RECORD ADDS. Because the attack's TIME law is
    curve-blind except through lambda_x (1a081a's C1, a corpus census this
    record does not re-derive), the MEMORY prediction that follows from
    KN-LIT-796 taken at curve granularity is: under a Frobenius-BLIND line,
    the linear-algebra matrix has the SAME dimensions on K-m and B-m (no
    orbit quotient is available or used), so the memory ratio
    Mem_IC(K-m)/Mem_IC(B-m) = 1, exactly mirroring (C1)'s time-side result.
    Under a Frobenius-AWARE line, the ratio is predicted 1/m on the ROW axis
    alone (fewer relations retained) and as low as 1/m^2 on BYTES (both
    dimensions shrink) if the implementation actually realises the column-
    side quotient too, not merely the row-side one. THIS IS THE SINGLE
    MEASURABLE QUANTITY THE BRIEF ASKS FOR AT CURVE GRANULARITY, and it is
    ORTHOGONAL to which of Assumption 1's four resolutions (A1-A4, per
    1a081a's "WHAT THE REACH FAN IS") supplies the TIME number: d_F4's value
    is a decomposition-degree question, untouched by whether the factor base
    used happens to be tau-stable. So the memory ratio multiplies into EVERY
    ONE of the four resolutions' reach verdicts identically, and none of
    them currently carry it -- 1a081a's fan is silent on memory at every
    cell, by its own declared scope.

    (M4) WHY THIS IS NOT A RESTATEMENT OF (C3). 1a081a's C3 is a TIME margin
    sign flip, M(K-m) - M(B-m), read off group-operation counts. This record
    proposes a MEMORY ratio, read off matrix dimensions or bytes, and its
    value (1 vs 1/m vs 1/m^2) is a DIFFERENT quantity with a DIFFERENT
    falsification surface: a K/B pair could have identical time margins
    (e.g. if the Frobenius-aware relation-count gain is entirely absorbed
    into a slower per-relation search) while still differing sharply in
    memory, or vice versa. Reporting them together, not as one number, is
    the record's actual content, and it is required precisely because
    RQ-BINSTD's decision_target treats memory as its own charged column, not
    a derivative of time.
  mechanism: >-
    OBJECT FRAME. This record introduces no new tracked object. Representation
    R1 (field representation of coordinates, inherited); operation set Sigma =
    translation by factor-base elements (Class I, PARTIAL-ACTION of
    IDEA-20260806-c5d183), unchanged from every filed index-calculus line in
    this lane. DECLARED OFF-LIMITS COMPONENT: F2 (factor-base decomposition)
    of IDEA-20260802-002, as the question requires; nothing here escapes
    KN-OPEN-020 and no escape is claimed.

    WHY THE n^2 REDUCTION IS A DIMENSION STATEMENT, NOT A SYMMETRY STATEMENT,
    AND HOW THAT DIFFERS FROM 1a081a'S CITATION OF THE SAME SOURCE. 1a081a
    cites KN-LIT-796 (via IDEA-20260906-a77711 and IDEA-20260915-8fe0ef) only
    for its RELATION-COUNT term, and explicitly frames the Frobenius gain as
    "a dimension gain, not a symmetry gain" (a77711's own title) -- an
    argument about how many INSTANCES need solving. This record reads the
    SAME source's SECOND clause -- linear algebra by n^2 -- literally: a
    matrix has two dimensions, and an n-fold reduction in EACH gives n^2 in
    total memory (if the reduction is realised on both rows and columns) or
    n if realised only on rows (fewer relations kept, same-size factor
    base). Which of the two the implementation actually achieves is an open
    number this record prices, not assumes.

    THE ONE OPEN NUMBER, PRICED. The quantity IDEA-20260802-002's meter
    requires is the LOSS of the projection "keep only one representative row
    per tau-orbit of relations" -- this is a QUOTIENT construction (a
    block system of <tau>, per IDEA-20260901-863e36's framing of lossy
    objects under an operation set), and its price is the orbit-
    canonicalisation cost: for each retained relation, identifying which of
    its m tau-conjugates is the canonical representative costs O(log m)
    Frobenius applications and one comparison, charged per relation, and is
    a SMALL cost relative to the matrix-size saving it buys -- but whether
    the SAVING is actually realised in bytes (not merely in row count) is
    what the minimal test measures, not what this record assumes.

    HOW THIS IS NOT A CHANGE OF COORDINATES. The lossy-projection test: the
    projection (raw relation matrix) -> (orbit-quotiented relation matrix)
    discards, for each tau-orbit represented, which specific one of its m
    members was found first; it is Sigma-compatible because tau is an
    endomorphism of the SAME curve whose factor base V is tau-stable (so a
    relation over one orbit member transports to a relation over any other by
    applying tau throughout, per H-SEMBIN-83a856-adjacent reasoning already
    used by IDEA-20260915-8fe0ef); and it is lossy in the representation used
    whenever the raw (non-quotiented) matrix would otherwise carry m distinct
    rows for what the quotiented matrix carries as one, which is exactly the
    m > 1 regime every K-curve in this population sits in.
