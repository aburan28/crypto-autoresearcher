  assumptions:
    - >-
      DECLARED COMPONENT: F2 (factor-base decomposition), as the question
      requires. No new factor base, no new relation mechanism; KN-OPEN-020
      is engaged only through whatever class the underlying V already
      belongs to, and no escape is claimed.
    - >-
      "Linear-algebra memory" here means the bytes needed to store the
      relation matrix before elimination (rows x columns x bits-per-entry
      for a dense encoding, or nonzero-entry count for a sparse one); the
      minimal test reports both and states which is charged, since the two
      can diverge sharply for a sparse Semaev-derived system.
    - >-
      The n^2 prediction assumes BOTH the row-side (relation count) and
      column-side (factor-base dimension) reductions are realised by the
      SAME construction; if only one is, the honest prediction is 1/m, not
      1/m^2, and the minimal test is designed to tell the two apart.
  proof_search_map:
    bottleneck: >-
      No filed record in this lane charges memory at curve granularity. The
      time-only tables (1a081a) and the per-instance factorial (8ac1ea) both
      leave RQ-BINSTD's own linear-algebra "bytes" column empty for all ten
      FIPS rows, and RQ-SEMBIN-fa2e3f's decision target independently flags
      the same absence for its own field-granularity table.
    baseline_embedding:
      parameter_slice: >-
        m_a = 1, no tau-stable factor base used (the Frobenius-blind
        degenerate case): the memory ratio must reduce to exactly 1, since
        there is no orbit quotient to apply. This is the same degenerate
        slice 1a081a's own baseline_embedding uses for its time-side check.
      reproduction_check: >-
        At this slice, reproduce 1a081a's own rho memory convention (O(w)
        distinguished points, van Oorschot-Wiener Pareto minimum per
        EV-SEMBIN-71e5cd O-6/O-7) exactly, and confirm the attack-side matrix
        dimension for a plain (non-quotiented) factor base equals the raw
        relation count with no m-dependent shrink on either curve -- a
        pipeline that reports a nonzero ratio at this slice has not
        implemented the degenerate case correctly.
    observation_collision:
      observable: >-
        the linear-algebra matrix memory ratio Mem_IC(K-m)/Mem_IC(B-m),
        measured in both row count and bytes (nonzero-entry count).
      distinct_preimage_search: >-
        A measured ratio near 1/m (rather than 1/m^2) has at least two
        distinct preimages: (a) the implementation quotients relations
        (rows) but not the factor-base dimension (columns) -- a genuine,
        real partial realisation of KN-LIT-796's claim, reported as such; or
        (b) the underlying system is not actually building a column-side
        quotient because the factor base V itself, while tau-stable as a
        SET, is not being represented in an orbit-compressed BASIS for the
        linear-algebra phase -- a representation choice this record's
        sibling proposal IDEA-20260922-f37254 studies for a different reason
        (basis-dependence of decomposition search), and which this record
        flags as a possible SHARED root cause without re-deriving it. The
        two are distinguished by inspecting the actual column count of the
        constructed matrix, not merely the ratio.
      constructive_transforms:
        - transform: representation_reduction
          proposed_object: >-
            the reachability table's linear-algebra column re-presented as a
            per-curve byte figure beside its already-filed time figure,
            rather than left blank.
          predicted_gain: >-
            turns "does K-m's Frobenius structure help" from a time-only
            question into a genuinely two-axis one, and exposes any line
            that claims a Frobenius advantage in time while silently paying
            for it in memory (or vice versa) -- a crossover neither sibling
            record's design can see.
    quantifier_order: >-
      FOR a Frobenius-blind line and FOR EVERY m in the FIPS set, the memory
      ratio is 1 (a corollary of the same census (C1) already performed by
      1a081a, extended to the memory axis, and falsifiable the same way: by
      exhibiting a filed law whose memory DOES depend on the curve). FOR a
      Frobenius-aware line, THERE EXISTS a construction (the tau-orbit
      quotient) achieving a ratio between 1/m and 1/m^2, with the exact
      value an EMPIRICAL question this record's minimal test answers, not
      assumes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On toy Koblitz curves at n in {17, 23, 29, 31, 37, 41} with a
        tau-stable factor base of dimension l, the linear-algebra matrix
        built from the orbit-quotiented relation set has row count/byte
        count [table], the matched non-Koblitz control at the same n and l
        has row count/byte count [table], and the ratio is [measured value],
        compared against the predicted band [1/m, 1/m^2]." Conditional on
        the toy scale tested, silent on m >= 131, and asserting nothing about
        Assumption 1's resolution.
      nearby_object_control: >-
        A non-Koblitz curve of the SAME n and the SAME l (the C-KG cell of
        IDEA-20260922-8ac1ea's own factorial, or simply any random a,b with
        b not in F_2) must show ratio 1 against ITSELF at two independent
        draws (identity-shape null) and must NOT show any orbit-quotient
        reduction, since no tau exists to quotient by. sect193r1/r2 (m=193,
        no subfield structure at all, per the audit) is the deployed-scale
        analogue: a pipeline that reports any nonzero memory reduction for
        them has applied the correction by extension degree, not by curve,
        exactly the confound 1a081a's own nearby_object_control names.
    proof_obligations:
      - claim: The degenerate (m_a=1, no orbit quotient) slice reproduces ratio exactly 1.
        responsibility: correctness
      - claim: Row-count and byte-count ratios are reported separately, never conflated.
        responsibility: correctness
      - claim: Non-Koblitz controls (C-KG, sect193r1/r2 analogue) show no reduction.
        responsibility: baseline
      - claim: The orbit-canonicalisation cost per retained relation is charged, not free.
        responsibility: qualification
      - claim: No claim about any deployed curve's security at any outcome.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        linear-algebra matrix ROW-COUNT ratio, K-n / (matched non-Koblitz
        control), toy curves with a tau-stable factor base
      direction: lower
      minimum_effect: >-
        ratio in a band centred on 1/n, within a factor of 2 of 1/n at the
        tested toy n (17 to 41)
    - metric: >-
        linear-algebra matrix BYTE-COUNT (nonzero-entry) ratio, same pairs
      direction: lower
      minimum_effect: >-
        EITHER a band centred on 1/n^2 (full KN-LIT-796 realisation) OR a
        band centred on 1/n (row-only realisation) -- these are the two
        non-overlapping predictions the design must separate; a ratio near 1
        would mean neither reduction is realised in this program's own
        implementation and is the most informative possible outcome
    - metric: memory ratio at the degenerate m_a=1/no-quotient baseline slice
      direction: higher
      minimum_effect: exactly 1, within measurement noise
    - metric: memory ratio on the non-Koblitz nearby-object control (two independent draws)
      direction: higher
      minimum_effect: within the identity-shape noise floor of a single curve run twice
  minimal_test:
    design: >-
      Toy scale, n in {17, 23, 29, 31, 37, 41} (prime, matching the lane's own
      range). Step 1: build a Koblitz curve (a,b in F_2) and a matched
      non-Koblitz control at each n, with a tau-stable factor base V (per
      IDEA-20260915-8fe0ef's ker g(tau) construction) of fixed dimension l.
      Step 2: run relation collection on both, building the RAW (un-quotiented)
      relation matrix on the control and BOTH the raw and the orbit-quotiented
      matrix on the Koblitz curve (so the reduction is measured, not assumed).
      Step 3: report row count and nonzero-entry byte count for all three
      matrices at each n, and the two ratios (K-quotiented/control-raw,
      K-raw/control-raw as a sanity check that should read 1). Step 4:
      charge the orbit-canonicalisation cost (Frobenius applications per
      relation) as a separate line item, not folded into the matrix bytes.
      OUTCOMES. (A) Byte ratio near 1/n^2: KN-LIT-796's claim is realised in
      full at this program's own toy scale; the reachability table gains a
      genuine memory column with a numbered heuristic behind it. (B) Byte
      ratio near 1/n (row-only): the column-side reduction is NOT realised
      by this program's current tooling even though the row-side is;
      reported as an implementation gap, not a mathematical one, and the
      claim is re-scoped to 1/n. (C) Ratio near 1 throughout: neither
      reduction is realised; this is a scope limit on every filed
      Frobenius-aware cost law in this lane that has assumed KN-LIT-796's
      figure applies without checking, and is the most valuable possible
      negative result here.
    controls:
      - >-
        DEGENERATE SLICE: same curve, m_a = 1, no quotient applied -- ratio
        must read 1 exactly, or the instrument is broken.
      - >-
        NON-KOBLITZ NULL: the matched control curve, two independent seeds --
        the (N1)-style noise floor against which any Koblitz-side reduction
        is read.
      - >-
        KNOWN-FALSE: apply the orbit quotient to the NON-Koblitz control
        (where no tau exists) -- this must be undefined/refused by the
        pipeline, or a silent "reduction" on a curve with no tau would mean
        the instrument is quotienting by something other than the curve's
        own endomorphism.
      - >-
        REPRODUCTION: the degenerate-slice rho memory convention matches
        1a081a's own cited vOW Pareto-minimum accounting exactly before any
        cell is reported.
    required_metrics:
      - per curve pair and n -- row count and byte count, raw and quotiented
      - the two ratios (row, byte) with their predicted bands
      - orbit-canonicalisation cost, charged separately
      - the non-Koblitz control's ratio at two seeds (noise floor)
  falsification_conditions:
    - >-
      A measured byte ratio outside [1/(2n^2), 2/n] at any tested n falsifies
      BOTH the 1/n and 1/n^2 predictions and means the memory effect, if any,
      does not scale as KN-LIT-796's figure predicts at this program's own
      toy scale; the record is then a finding about the gap between the
      cited literature figure and this program's own implementation.
    - >-
      A nonzero reduction on the non-Koblitz control (no tau available)
      falsifies the instrument's correctness, not the hypothesis, and halts
      the design until located.
    - >-
      A degenerate-slice ratio different from 1 falsifies the baseline
      embedding and is an instrument bug.
  confounders:
    - >-
      DENSE VS SPARSE ENCODING. Row count and byte count can move in opposite
      directions if the quotiented matrix is denser per row than the raw one;
      both must be reported, never only one.
    - >-
      BASIS DEPENDENCE OF THE FACTOR BASE'S OWN REPRESENTATION. Whether the
      column-side reduction is realised may itself depend on which basis the
      factor base V is expressed in for the linear-algebra phase -- the same
      axis IDEA-20260922-f37254 studies for the decomposition-search phase.
      This record does not resolve that dependency; it reports it as a
      possible shared cause if outcome (B) is observed.
    - >-
      COFACTOR ASYMMETRY. h=4 on K-233..571 versus h=2 on their B partners
      (per 1a081a's C2) affects the RAW relation count needed on both sides
      identically and must not be misread as part of the Frobenius effect.
    - >-
      ORBIT-CANONICALISATION COST HIDING IN THE MATRIX FIGURE. If the
      canonicalisation cost is folded into per-relation collection time
      rather than charged separately, a real memory saving could be
      misreported as free; Step 4 exists specifically to prevent this.
  interpretation_limits:
    - >-
      Scoped to the tested toy n, the specific tau-stable V construction of
      IDEA-20260915-8fe0ef, and this program's own relation-collection
      tooling. Nothing transfers to m >= 131 without the stated extrapolation
      assumption, and no claim about any deployed curve's security follows
      from any outcome.
    - >-
      KN-LIT-796's n^2 figure is a second-hop relay in this record's citation
      chain; any deliverable at claim strength re-opens ePrint 2020/1315
      directly before charging a specific exponent.
    - >-
      This record measures a MEMORY ratio only; it says nothing new about
      the TIME margin, which remains exactly 1a081a's C1-C3 content.
  heuristic_assumptions:
    - id: HM-1
      statement: >-
        (LINEAR-ALGEBRA DIMENSION REDUCTION) For a Koblitz curve E/F_{2^m}
        with a tau-stable factor base V of dimension l, the relation matrix
        built from tau-orbit-canonicalised relations has row count
        U(K-m)/m + O(1) where U(K-m) is the raw relation count needed, and
        (conditionally) column count on the order of |V|/m if V's own basis
        is orbit-compressed, giving a total byte reduction between 1/m and
        1/m^2 relative to the non-quotiented matrix on a matched non-Koblitz
        curve of the same (n, l).
      rigorous_support: >-
        RIGOROUS PART: the row-side reduction follows directly from tau
        being an endomorphism of E and V being tau-stable -- a relation over
        one orbit representative transports to a relation over every
        conjugate by applying tau, so retaining one representative per orbit
        loses no rank (an argument of the same shape as H-SEMBIN-83a856's
        quotient map, applied to relations rather than to E/2E cosets).
        HEURISTIC PART: whether the COLUMN-side reduction is realised
        depends on whether V's own representation for the linear-algebra
        phase is orbit-compressed, which is an implementation fact, not a
        mathematical necessity -- the minimal test is designed precisely to
        measure, not assume, this. CLASSICAL ANALOGUE IMITATED: block
        decomposition of a matrix under a finite group action into isotypic
        components (the same principle IDEA-20260916-c38e50 uses for S_m on
        a different matrix), here applied to the cyclic group <tau> of
        order m.
      validation_plan: >-
        WHAT TO SAMPLE: toy Koblitz curves at n in {17, 23, 29, 31, 37, 41},
        tau-stable V of dimension l in a small tested range (l = 6 to 12,
        where the exhaustive relation-collection budget of DEC-20260913-47bbb7
        applies), against matched non-Koblitz controls at the same (n, l).
        SHORTCUT: none needed at this scale -- exhaustive relation collection
        already used by IDEA-20260922-8ac1ea's own (M2) instrument. PREDICTED
        DISTRIBUTION: byte ratio concentrated near 1/n^2 (full realisation)
        or 1/n (row-only realisation), a bimodal rather than continuous
        prediction, since the mechanism is either implemented on both axes or
        one. TAIL CHECK: any ratio outside [1/(2n^2), 2/n] across more than
        one tested n is the falsifier. TRANSFER ASSUMPTION, STATED: nothing
        here transfers to m >= 163; a deployed-row memory figure requires the
        same numbered assumption 1a081a's own C2 uses for time, restated for
        memory, with its own extrapolation distance disclosed separately.
  heuristic_note: >-
    HM-1's row-side clause is close to rigorous (a direct corollary of tau
    being an endomorphism, mirroring an already-cited quotient argument);
    its column-side clause is genuinely open and is the record's actual
    target -- a failure to realise 1/n^2 is itself the most useful outcome,
    since it locates exactly where this program's tooling falls short of the
    literature figure it has been citing without measuring.
  target_complexity:
    time_exponent: >-
      Unchanged. This record moves no time exponent and makes no new time
      claim; it inherits 1a081a's C1-C3 in full.
    memory_exponent: >-
      This IS the record's content. It predicts a curve-dependent, m-scaled
      CONSTANT-FACTOR reduction in linear-algebra memory (a factor between m
      and m^2, not a change of complexity class) on Koblitz rows only, under
      a Frobenius-aware line, and exactly 1 (no reduction) under a
      Frobenius-blind line or on any B-row. Honest disclosure: this is a
      polynomial-in-m constant-factor claim, not an exponent-class move, and
      the record says so explicitly rather than dressing it as one.
    best_known: >-
      Matched rho, memory O(w) distinguished points at the van
      Oorschot-Wiener Pareto minimum, identically on K-m and B-m (rho's
      memory footprint does not depend on the curve's coefficients at all,
      only on the group order and the parallel budget w) -- a fact worth
      stating explicitly since it means the memory axis studied here can
      only ever move the ATTACK side, never the baseline.
    hidden_overhead: >-
      The orbit-canonicalisation cost per relation (O(log m) Frobenius
      applications), charged as its own line item and never folded silently
      into the reported matrix bytes.
    tradeoff_note: >-
      No new time-memory tradeoff is proposed; the record reports the memory
      column beside 1a081a's already-filed time column so that a
      time-favourable and memory-favourable verdict can be told apart per
      curve, which neither sibling record's design can currently do.
  estimated_cost:
    implementation: medium
    compute: low
    qualification: >-
      Advisory. Shares relation-collection and tau-stable-V tooling with
      IDEA-20260915-8fe0ef and IDEA-20260922-8ac1ea; the marginal cost is
      the matrix byte-accounting instrumentation, not new arithmetic. No run
      at m >= 131 is requested or implied.
  asymptotic_claim:
    problem: >-
      linear-algebra phase memory for index calculus on the ten FIPS binary
      curves and their nearby-object controls
    prior_best: >-
      KN-LIT-796's n^2 figure (relayed, second-hop, not independently
      re-verified this session) against matched rho at O(w) memory
    time_exponent: unchanged
    memory_exponent: >-
      conditional, between 1/m and 1/m^2 on Koblitz rows under a
