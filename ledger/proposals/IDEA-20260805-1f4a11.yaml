idea:
  id: IDEA-20260805-1f4a11
  question_id: RQ-ECDLP-002
  added: '2026-08-05'
  title: >-
    Three live, mutually incompatible BKK-speedup formulas, one of them a
    theorem: the half-space membership vector is a forced-value object that
    decides the trichotomy at zero compute, and an Amdahl ceiling caps every
    member of it at 2x end-to-end
  class: control

  claim: >-
    This goal has produced four unsuperseded records making quantitatively
    incompatible claims about the same object -- the speedup obtained by
    checking (B/2)^{m-1} rather than B^{m-1} factor-base tuples in Semaev
    relation collection:
      KN-FIND-8f2c90:  2 gamma = 1.5-1.7x, measured at m = 2 only;
      KN-FIND-2a8b7e:  1.72 x 1.36^{m-2}, geometric, "3-5x at crypto scale";
      KN-FIND-c7d31e:  a THEOREM, gamma_m = (m+1)/2^m, hence speedup (m+1)/2,
                       linear;
      EV-SEMAEV-6ef060 versus EV-SEMAEV-95eebe: "22-150x" against
                       "3-5x (revised from ~50x)".
    At m = 7 these read 4x, 8x, and 22-150x. Nothing supersedes anything.
    THE TRICHOTOMY IS DECIDABLE ON PAPER AND THIS PROPOSAL DECIDES IT THREE
    TIMES OVER.
    (1) FORCED VALUE. Under the model both surviving formulas assume -- indices
    i.i.d. Uniform{1..B} -- the tracked quantity is EXACTLY, not at least,
    gamma_m = Pr[at least m-1 of m indices in the first half] = (m+1)/2^m.
    KN-FIND-c7d31e states this equality and then calls it a "provable lower
    bound", which is what allows KN-FIND-2a8b7e's fitted gamma_m = 0.86 x
    0.68^{m-2} to be read as compatible with it. It is not compatible: the ratio
    of the fitted model to the theorem is 1.147 at m = 2 and 2.42 at m = 8, and
    it GROWS GEOMETRICALLY at rate (0.68/0.5) = 1.36 per unit m -- which is
    precisely the 1.36^{m-2} that KN-FIND-2a8b7e reports as its headline. THE
    ENTIRE CLAIMED GROWTH IN m IS THE DIVERGENCE BETWEEN A FOUR-POINT FIT AND A
    THEOREM DERIVED FROM THE SAME RECORD'S OWN MODEL. Either the i.i.d. model is
    false, in which case the theorem's cost accounting does not apply either, or
    the fit is noise, in which case the speedup is linear in m and about 2.5x at
    the crypto-relevant m = 4.
    (2) AMDAHL CEILING, NEVER CHARGED. All four records count RELATION-COLLECTION
    CHECK OPERATIONS ONLY. Index calculus also pays sparse linear algebra, and
    the factor-base size B is chosen to BALANCE the two stages. If collection is
    a fraction s of end-to-end cost, an infinite collection speedup gives
    end-to-end 1/(1-s); at the balanced optimum s is approximately 1/2, so
    EVERY NUMBER IN THE TRICHOTOMY IS CAPPED AT ABOUT 2x END TO END, and 22-150x
    is capped at 2x just as firmly as 4x is. No record in the lane reports s.
    (3) THE o(1) SELF-REFUTATION. EV-SEMAEV-6ef060 states that the method
    improves the constant c in exp(c sqrt(log N log log N)) "by
    ~log 2 / log log N". A constant-factor speedup S shifts c by
    ln S / sqrt(ln N ln ln N), which at N = 2^256 is 0.069 for S = 8 and falls
    to 0.046 at 2^512, 0.030 at 2^1024 and 0.014 at 2^4096. It is o(1) BY
    CONSTRUCTION, and an o(1) improvement to c is not an improvement to c. The
    record refutes itself in its own sentence.
    The proposal is to run the missing MATCHED NULL -- pure combinatorial
    indices with no elliptic curve anywhere -- against the same instrument, and
    to publish the three forced values above with the residual share s measured.

  object_first_candidate:
    tracked_object: >-
      The HALF-SPACE MEMBERSHIP VECTOR eps in {0,1}^m of a factor-base m-tuple,
      eps_i = 1 exactly when index a_i <= B/2. The BKK sparse check succeeds
      exactly when |eps| >= m-1, so eps determines the outcome and nothing else
      about the tuple does. Every prior record in this lane tracked the tuple,
      or the yield, or a wall-clock ratio; eps is the object whose one-step
      propagation is definable and whose distribution is the entire content of
      the claimed speedup.
    established_families_off_limits: >-
      Off-limits as the primary lens: Pollard rho and BSGS; Weil descent;
      isogeny and CM structure; pairing transfer; Groebner solving-degree and
      first-fall instrumentation; lattice and Coppersmith methods. Summation
      polynomials are the OBJECT under audit rather than the lens: this
      proposal offers no new relation-collection mechanism and no new factor
      base, and any reading of it as a Semaev variant is a misreading. It is
      inventor-protocol move 2 -- find the quantity a claimed pipeline is forced
      to produce -- applied to this goal's only claimed algorithmic advance.
    newness_score: >-
      The binomial computation is elementary and KN-FIND-c7d31e already performs
      it. What is not in this corpus is (a) the observation that the theorem and
      the fitted model DIVERGE GEOMETRICALLY rather than agreeing within a
      "bonus", (b) the matched combinatorial null that separates "EC group law
      bonus" from "fit residual", and (c) the Amdahl ceiling, which is the one
      number that makes the whole trichotomy moot and which no record computes.
    testability_score: >-
      Maximal. gamma_m for a pure combinatorial null is exact rational
      arithmetic; the empirical gamma on a real curve is a loop over m-tuples at
      p = 1009 costing seconds; s is a ratio of two operation counts already
      instrumented in the lane. No solver, no numpy, no Sage required.
    survival_score: >-
      The object survives all the way to the crypto-relevant m = 4-6, because
      eps's distribution under the i.i.d. model is m-independent in form. It
      dissolves exactly where the i.i.d. model does -- at small B, where indices
      of a decomposition are constrained by the group law -- and locating that
      dissolution is the measurement.

  mechanism: >-
    DERIVED IN-REPO THIS SESSION; all arithmetic is on values committed in
    KN-FIND-8f2c90, KN-FIND-2a8b7e and KN-FIND-c7d31e, all three READ IN FULL.

    THE FORCED VALUE. Let the m indices of a decomposition be i.i.d.
    Uniform{1,...,B}, and let eps_i = 1[a_i <= B/2]. Then |eps| ~ Binomial(m,
    1/2) and the BKK check, which enumerates (m-1)-tuples from the first half,
    finds the decomposition exactly when |eps| >= m-1. Hence
      gamma_m = ( C(m, m-1) + C(m, m) ) / 2^m = (m+1)/2^m,   EXACTLY.
    KN-FIND-c7d31e derives this and then writes "gamma_m >= (m+1)/2^m
    (provable lower bound)". Under its own stated model it is an EQUALITY. The
    distinction is not pedantry: an equality is falsified by any measured
    excess, whereas a lower bound absorbs one. The record's own verification
    table reports measured gamma of 0.86, 0.66, 0.35, 0.27 at m = 2,3,4,5
    against theory 0.750, 0.500, 0.3125, 0.1875 -- excesses of 14.7, 32, 12 and
    44 per cent -- and attributes them to "EC group law gives ~0.1 bonus in
    gamma above the theoretical floor". A 0.1 additive bonus does not describe
    that table: the excess is neither additive (it ranges 0.037 to 0.16) nor
    constant multiplicatively (1.15 to 1.44). It is unmodelled.

    THE DIVERGENCE IS THE HEADLINE. KN-FIND-2a8b7e fits gamma_m = 0.86 x
    0.68^{m-2} to those four points and extrapolates. The ratio of that fit to
    the theorem is (0.68/0.5)^{m-2} x 1.147 = 1.147 x 1.36^{m-2}, computed here
    as 1.147, 1.170, 1.273, 1.442, 1.681, 2.001, 2.419 at m = 2..8. The claimed
    "growing-with-m speedup 1.72 x 1.36^{m-2}" is ARITHMETICALLY IDENTICAL to
    that divergence: 2^{m-1} gamma_fit = 2^{m-1} x 0.86 x 0.68^{m-2} =
    1.72 x 1.36^{m-2}, while 2^{m-1} gamma_theory = (m+1)/2. The growth claim IS
    the gap between a four-point two-parameter fit and a theorem proved from the
    same model, and it is presented as a discovery about BKK theory. Note
    further that the fit does not even describe its own four points well:
    residuals are 0.0, -11.4, +13.6 and 0.0 per cent at m = 2,3,4,5 -- it passes
    exactly through the two endpoints and misses both interior points in
    opposite directions, which is what a two-parameter geometric fit to four
    noisy points does.

    WHAT THE MATCHED NULL DECIDES, AND WHY IT HAS NEVER BEEN RUN. Draw m indices
    i.i.d. Uniform{1..B} with NO curve, NO group law and NO decomposition --
    pure combinatorics -- and measure gamma by the identical code path. FORCED
    VALUE: exactly (m+1)/2^m, within binomial sampling error
    sqrt(gamma(1-gamma)/n). Then measure gamma on the actual EC decompositions
    at the same B and m. THE DIFFERENCE, AND ONLY THE DIFFERENCE, IS THE
    "EC GROUP LAW BONUS". If the null itself returns 0.86 at m = 2, the excess
    is an artifact of the enumeration (most likely: the check is not testing
    what the model says it tests, e.g. i < j ordering, or the second index being
    determined rather than drawn) and the entire lane's numbers are instrument
    readings. If the null returns 0.75 and the EC arm returns 0.86, the bonus is
    real, is worth its own record, and the i.i.d. model that the theorem depends
    on is false -- which invalidates the theorem's COST accounting even while
    its combinatorics stand.

    THE AMDAHL CEILING. Semaev index calculus with factor base size B needs
    about B relations; relation collection costs T_rel = B x (cost per trial) x
    (1/Pr[decomposition]); linear algebra on a sparse B x B system costs
    T_la = O(B^2 w) by Wiedemann/Lanczos. B is CHOSEN to balance these -- that
    is what "optimal B" means in every record in this lane. Writing
    s = T_rel/(T_rel + T_la), a speedup S applied to collection alone gives
      end-to-end speedup = 1 / (1 - s + s/S)  ->  1/(1-s)  as S -> infinity.
    At the balanced optimum s is approximately 1/2 and the ceiling is 2.0. Even
    granting EV-SEMAEV-6ef060's 150x, the end-to-end figure is
    1/(1 - 0.5 + 0.5/150) = 1.987. THE CEILING IS BELOW THE SMALLEST NUMBER IN
    THE TRICHOTOMY AT LARGE m AND ABOVE NONE OF THEM AT SMALL m, so measuring s
    settles the practical question regardless of which gamma is right. No record
    in this lane reports s. It is a ratio of two counters.

    THE o(1) ARITHMETIC. exp(c sqrt(ln N ln ln N)) divided by a constant S is
    exp(c sqrt(ln N ln ln N) - ln S) = exp(c' sqrt(...)) with
    c' = c - ln S / sqrt(ln N ln ln N). At N = 2^256, sqrt(ln N ln ln N) = 30.31,
    so Delta c = 0.0229 (S=2), 0.0457 (S=4), 0.0686 (S=8), 0.0915 (S=16),
    0.1653 (S=150). At N = 2^512, 2^1024, 2^4096 the S = 8 value falls to
    0.0455, 0.0305, 0.0138. Delta c -> 0: a constant-factor speedup NEVER moves
    c, by definition of c. KN-FIND-8f2c90 states "the constant c is reduced by
    factor 1/sqrt(2 gamma) ~ 0.77. A ~23% improvement in the constant c" -- that
    is a DIFFERENT and incompatible accounting (multiplicative on c rather than
    additive on the exponent), and it is the one that would be exponent-relevant
    if true. Which of the two accountings is correct is a one-page derivation
    that no record performs, and the two differ by whether the speedup enters
    inside or outside the sqrt. THIS IS THE SINGLE CHEAPEST OPEN QUESTION IN
    THE LANE AND IT IS PURE ALGEBRA.

  novelty_status: unverified

  literature_context:
    - >-
      KN-FIND-8f2c90, KN-FIND-2a8b7e, KN-FIND-c7d31e: all three READ IN FULL
      this session, all three with superseded_by: null, all three internal.
      Their confidence fields are preliminary_empirical, preliminary_empirical
      and proved respectively; only the third carries a derivation.
    - >-
      EV-SEMAEV-6ef060 ("22-150x") and EV-SEMAEV-95eebe ("3-5x, revised from
      ~50x") are named by this session's ANGLE-BRIEF as an unresolved
      contradiction. NOT READ -- relayed from the brief. The experiment's first
      stage opens both and quotes them; nothing here treats either number as
      established.
    - >-
      The BKK / Bernstein-Khovanskii-Kushnirenko mixed-volume bound itself is
      classical. NOT READ -- no source opened. It is not load-bearing for this
      proposal, which audits only the combinatorial accounting the internal
      records perform, and which makes no claim about mixed volumes.
    - >-
      Amdahl's law is elementary and is derived above rather than cited.

  lossy_projection_identifiability_audit:
    projection: >-
      Factor-base m-tuple (a_1, ..., a_m) in {1..B}^m --> half-space membership
      vector eps in {0,1}^m --> its weight |eps|.
    what_is_discarded: >-
      log2(B/2) bits per coordinate: everything about WHERE in its half each
      index lies. At B = 54 (the lane's near-optimal value at p = 1009, m = 2)
      that is about 4.75 bits per coordinate.
    why_genuinely_lossy: >-
      Strictly lossy, with fibre size (B/2)^m over each eps. The tuple is NOT
      recoverable from eps -- contrast the (Delta, Pi) = (x xor y, x*y) failure,
      where the unordered pair is recovered as the roots of t^2 + Delta t + Pi
      and nothing was gained. Here nothing is recoverable.
    why_compatible_with_the_operations: >-
      Compatible in the required sense: the BKK sparse check's outcome is a
      DETERMINISTIC function of eps alone (success iff |eps| >= m-1), so the
      retained part propagates through the one operation that matters without
      consulting the discarded part. This is the cleanest instance of
      inventor-protocol section 2 compatibility among the four proposals filed
      in this batch, and it is why the object is worth tracking at all.
    is_it_only_a_change_of_coordinates: >-
      CHECKED FOR BOTH FAILURE MODES AND IT PASSES BOTH. Not a change of
      coordinates (fibres of size (B/2)^m). Not constant across instances:
      |eps| takes m+1 values with Binomial(m,1/2) weights, so the comparator
      spread is maximal rather than zero. THE AUDIT'S FINDING IS INSTEAD ABOUT
      WHAT THE OBJECT IS SENSITIVE TO: under the i.i.d. model eps is a function
      of NOTHING elliptic -- it is pure combinatorics, and gamma_m carries zero
      EC information. Any EC-specific content therefore lives entirely in the
      DEPARTURE of the measured eps distribution from Binomial(m,1/2), which is
      exactly the quantity the matched null isolates and which no record has
      ever isolated. A projection that passes both classical failure tests and
      is still uninformative about the target unless a null is subtracted is a
      third failure mode worth naming, and it is named here.

  assumptions:
    - >-
      That the four records' "check operations" are commensurable. They may not
      be: a check in the standard arm and a check in the BKK arm need not cost
      the same, and no record states the unit. The experiment must define the
      unit and report both arms in it or refuse to report a ratio.
    - >-
      That B is chosen at the balancing optimum, which is what makes s
      approximately 1/2. If the lane's B is chosen by some other criterion, s is
      whatever it is and must be measured, not assumed. The Amdahl ceiling is
      stated as a function of s precisely so it survives that.
    - >-
      That the indices of a genuine EC decomposition are exchangeable. They are
      not exactly (the last index is determined by the first m-1 and the
      target), and that is the most likely mechanism for the measured excess.
      The experiment measures it rather than assuming either way.

  predictions:
    - metric: >-
        gamma_null(m), measured on i.i.d. Uniform{1..B} indices with no curve,
        at m = 2..6, B = 54, at least 10^6 draws per cell
      direction: different
      minimum_effect: >-
        EXACTLY (m+1)/2^m = 0.7500, 0.5000, 0.3125, 0.1875, 0.1094, within
        3 sqrt(gamma(1-gamma)/n) (below 0.002 at 10^6 draws). ANY DEPARTURE
        BEYOND THAT MEANS THE INSTRUMENT DOES NOT IMPLEMENT THE MODEL, and no
        conclusion about the EC arm may be drawn.
    - metric: >-
        gamma_EC(m)/gamma_null(m) at the same (B, m), at p = 1009 and p = 4001
      direction: higher
      minimum_effect: >-
        The committed table forces a prediction of 1.147, 1.320, 1.120, 1.440 at
        m = 2,3,4,5 if the excess is genuinely EC. THE DECISIVE ALTERNATIVE:
        if the ratio is 1.00 within error at every m, the excess is an
        enumeration artifact, KN-FIND-2a8b7e's geometric model has no support,
        and the speedup is the theorem's (m+1)/2. Either outcome is a result;
        the ratio being NON-MONOTONE in m (as the committed table's 1.32 then
        1.12 already is) is a third outcome indicating noise at these sample
        sizes, and the contract must report the sample size per cell, which no
        prior record does.
    - metric: >-
        s = T_rel/(T_rel + T_la), the relation-collection share of end-to-end
        cost, at p in {1009, 4001, 9001} with the lane's own B
      direction: different
      minimum_effect: >-
        Report the number. FORCED CONSEQUENCE stated before the run: whatever s
        is, the end-to-end speedup is 1/(1 - s + s/S) and is bounded by
        1/(1-s). If s < 0.9 then no collection speedup whatever can exceed 10x
        end to end, and if s is near 0.5 the bound is 2.0. There is no
        measurement that can make 150x an end-to-end number unless s > 0.993.
    - metric: >-
        Which of the two c-accountings is correct: additive (c' = c - ln S /
        sqrt(ln N ln ln N)) or multiplicative (c' = c / sqrt(2 gamma))
      direction: different
      minimum_effect: >-
        Exactly one is right and the derivation is one page. FORCED
        CONSEQUENCES: under the additive accounting Delta c -> 0 and no
        constant speedup is exponent-relevant, ever. Under the multiplicative
        accounting a 23 per cent reduction in c WOULD be exponent-relevant and
        would be the most significant result in this goal's history. The two
        cannot both hold and the lane currently asserts both.
    - metric: >-
        gamma_EC at m = 6, 7, 8 at p = 1009 -- the range where the theorem and
        the fitted model diverge by 1.68x, 2.00x and 2.42x
      direction: lower
      minimum_effect: >-
        Closer to (m+1)/2^m than to 0.86 x 0.68^{m-2}. This is the direct
        extrapolation test and it has never been run: every measurement in the
        lane stops at m = 5, exactly where the two models are still within
        44 per cent of each other. A measurement at m = 7, where they are 2x
        apart, is cheap and decisive.

  minimal_test:
    design: >-
      Four stages, cheapest first; stages 0 and 1 can each terminate the line.
      STAGE 0 (pen and paper, zero compute): derive gamma_m = (m+1)/2^m,
      compute the theorem-versus-fit divergence table, derive the Amdahl bound
      as a function of s, and settle the additive-versus-multiplicative c
      accounting. If the c accounting comes out additive, every claim in the
      lane is a constant factor and the exponent language must be withdrawn --
      that alone is the deliverable and nothing further need run.
      STAGE 1 (pure Python, seconds): the matched combinatorial null at
      m = 2..8, 10^6 draws per cell, against the exact forced values.
      STAGE 2 (pure Python, minutes): gamma_EC at p = 1009 and 4001, m = 2..8,
      identical code path, ratio against the null.
      STAGE 3 (instrumentation, minutes): measure s by counting operations in
      both stages of an actual toy index-calculus run at the lane's own B.
    controls:
      - >-
        NULL OBJECT OF THE SAME SHAPE (CAN FAIL). Pure i.i.d. Uniform{1..B}
        indices, no curve, no group law, no target, the identical eps predicate
        and the identical counting code. FORCED VALUE DERIVED BEFORE THE RUN:
        (m+1)/2^m exactly. It can fail: if the enumeration has an i<j
        restriction, or draws only m-1 indices and derives the last, the null
        will NOT return (m+1)/2^m, and that failure identifies the bug that most
        plausibly explains the entire measured excess.
      - >-
        POSITIVE CONTROL WHERE THE EFFECT MUST APPEAR (PLANTED). Draw indices
        i.i.d. Uniform{1..B/2} -- every index in the first half by construction.
        FORCED VALUE: gamma = 1.000 EXACTLY at every m, and speedup exactly
        2^{m-1}. THE INSTRUMENT MUST RETURN 1.000. A second planted arm: draw
        all indices from the SECOND half, forcing gamma = 0 exactly at every
        m >= 2. An instrument that cannot return both 1 and 0 on these two arms
        is not measuring gamma, AND NO NEGATIVE RESULT MAY BE REPORTED FROM ANY
        OTHER ARM.
      - >-
        GRADED CONTROL, >= 3 INTERIOR POINTS, MONOTONICITY REQUIRED. Draw each
        index from the first half with probability q, for q in {0.0, 0.25, 0.5,
        0.75, 1.0}. FORCED CURVE: gamma(q) = q^m + m q^{m-1}(1-q), i.e. at
        m = 4 the values 0, 0.0508, 0.3125, 0.7383, 1.0. The measured curve must
        match pointwise and must be monotone increasing. A quantity that fails
        to move as the parameter that controls it is swept is the canonical
        artifact tell; this arm is what makes that tell visible, and its forced
        values are exact rationals.
      - >-
        ORDERING CONTROL. The null arm at every (m, B) cell is measured, hashed
        and committed BEFORE any EC arm is generated, and the verdict rule
        ("excess present / absent") is executed on the null first. If it reports
        an excess on the null, the rule is measuring the instrument.
      - >-
        ARCHIVE CHECK (zero compute). Prior measurements of gamma in this
        corpus: KN-FIND-c7d31e's four-cell verification table and
        KN-FIND-2a8b7e's four-cell table (they are the same four cells, reported
        with different gamma values at m = 3 and m = 4 -- 0.66 versus 0.66 and
        0.35 versus 0.35 agree, but the derived speedups differ). NO SAMPLE SIZE
        IS RECORDED IN EITHER, which is itself a reportable finding.
    required_metrics:
      - gamma_null per (m, B) cell with sample size and binomial error bar
      - gamma_EC per (m, B, p) cell with sample size and error bar
      - the ratio and its error, with the exact forced null value beside it
      - the graded q-sweep against its exact rational forced curve
      - T_rel, T_la, s, and the unit of a "check operation", explicitly defined
      - a written derivation of the c accounting, with the losing branch stated

  falsification_conditions:
    - >-
      gamma_null departs from (m+1)/2^m by more than 3 binomial sigma at any
      cell. The instrument does not implement its own model; nothing may be
      reported and the finding becomes an instrument defect (which is still a
      deliverable).
    - >-
      gamma_EC/gamma_null = 1.00 within error at every m. The claimed EC bonus
      does not exist, KN-FIND-2a8b7e's geometric extrapolation loses its basis,
      and the speedup is the theorem's (m+1)/2. This is the outcome this
      proposal expects and it FALSIFIES the lane's headline, not this record.
    - >-
      gamma_EC at m = 7 lands within 10 per cent of 0.86 x 0.68^5 = 0.125 and
      more than 50 per cent above (m+1)/2^m = 0.0625. The geometric model is
      vindicated at the point where it matters, this proposal's reading is
      WRONG, and the lane has a real growing-with-m effect that deserves a
      mechanism.
    - >-
      The planted controls do not return exactly 1 and exactly 0. Instrument
      broken; no negative admissible.
    - >-
      s is measured above 0.99. The Amdahl ceiling is not binding at toy scale
      and the end-to-end argument must be restated (though it would still bind
      asymptotically, since T_la grows as B^2 while T_rel grows as B).

  confounders:
    - >-
      B IS TINY IN THE COMMITTED TABLE. KN-FIND-2a8b7e's own table has B = 54,
      18, 12, 10 at m = 2,3,4,5. At B = 10 the "first half" is 5 elements and
      the Binomial(m,1/2) approximation to the index distribution has
      discretisation error of order 1/B = 10 per cent -- comparable to the
      entire claimed excess. The p = 1009, m = 5, B = 10 cell may be measuring
      rounding.
    - >-
      NO SAMPLE SIZE IS RECORDED anywhere in the lane. A gamma of 0.27 at m = 5
      from, say, 100 successful decompositions has a standard error of 0.044 --
      which spans the entire theory-versus-fit gap at that m. The excess may be
      entirely within sampling error and no record permits the check.
      Re-measuring with a stated n is most of the value here.
    - >-
      THE LAST INDEX IS NOT FREE. In a genuine m-fold decomposition of a target,
      the first m-1 indices are searched and the m-th is determined by the
      summation polynomial. If the instrument nonetheless treats all m as drawn,
      the effective model is Binomial(m-1, 1/2) plus a constrained coordinate,
      whose success probability is NOT (m+1)/2^m. This is the single most likely
      explanation of the measured excess and it is a bug rather than a
      discovery. The null arm is designed to expose it.
    - >-
      AUTHORSHIP ASYMMETRY. This record audits the only positive algorithmic
      claim this goal has produced. Refuting it is cheap and reads as rigour; the
      planted positive controls exist so that a refutation costs something, and
      the m = 7 prediction is written so that vindication of the lane is a
      clearly stated, reachable outcome.

  interpretation_limits:
    - >-
      NO ATTACK, NO EXPONENT MOVED. This audits an existing constant-factor
      claim; it does not propose a faster algorithm. Pollard rho remains the
      baseline and sota_delta is zero on every attack axis.
    - >-
      TOY TIER. p <= 9001, m <= 8. Nothing here establishes anything at
      crypto scale in either direction, and the crypto-scale extrapolations in
      the audited records are exactly what the audit says are unlicensed.
    - >-
      IT DOES NOT REFUTE THE BKK BOUND, the mixed-volume theory, or
      KN-FIND-c7d31e's combinatorics, which are correct as stated. It disputes
      the reading of an equality as a lower bound, the extrapolation of a
      four-point fit past the range where it agrees with that equality, and the
      omission of the linear-algebra stage from the accounting.
    - >-
      NO STATUS CHANGE to KN-FIND-8f2c90, KN-FIND-2a8b7e, KN-FIND-c7d31e,
      EV-SEMAEV-6ef060 or EV-SEMAEV-95eebe is proposed or implied. Under
      AGENTS.md retrieval policy item 7 the contradictions are REPORTED.
    - >-
      Forward guidance, mandatory: what remains open regardless of outcome is
      (a) whether a BKK-derived restriction can be applied to the LINEAR ALGEBRA
      stage, which is where the Amdahl ceiling says the remaining factor lives
      and which no record has attempted; (b) whether the departure of the index
      distribution from i.i.d. uniform -- if it is real -- can be exploited
      DIRECTLY rather than as a bonus to an existing check; (c) the correct c
      accounting, which is a one-page derivation nobody has written.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The m indices of a Semaev m-fold decomposition of a uniformly random
        target, at factor base size B, are i.i.d. Uniform{1,...,B}.
      rigorous_support: >-
        NONE, and it is the assumption both audited records rest on without
        stating it as an assumption. It is false in at least one respect (the
        m-th index is determined by the other m-1 and the target), and the
        measured excess over (m+1)/2^m is consistent with exactly that. It is
        stated formally here for the first time in this lane.
      validation_plan: >-
        Directly falsifiable at zero compute beyond a histogram: measure the
        empirical distribution of the index vector at p = 1009, m = 3, and test
        it against Uniform{1..B}^m by a chi-square on the marginals and on
        |eps|. If it fails, gamma_m = (m+1)/2^m is not the right forced value
        and the correct one must be re-derived under the true model -- which is
        a better outcome than either current formula.
    - id: H2
      statement: >-
        s = T_rel/(T_rel + T_la) is approximately 1/2 at the factor-base size
        this lane calls optimal.
      rigorous_support: >-
        A modelling argument only: "optimal B" in index calculus conventionally
        means the B balancing the two stages, and at a balance point s = 1/2 by
        definition. Whether the lane's B is that B is unverified and is measured
        rather than assumed. The Amdahl ceiling is stated as 1/(1-s) precisely
        so that the conclusion does not depend on this value.
      validation_plan: >-
        Stage 3 measures T_rel and T_la directly in a toy run at p = 1009, 4001,
        9001 and reports s with the operation unit defined.

  target_complexity:
    time_exponent: >-
      NO EXPONENT IS MOVED BY ANYTHING IN THIS RECORD OR IN THE RECORDS IT
      AUDITS, and establishing that is half the point. The relevant exponent is
      the constant c in the conditional subexponential ceiling
      exp(c sqrt(log N log log N)) for Semaev index calculus. A constant-factor
      speedup S shifts c by ln S / sqrt(ln N ln ln N) = 0.069 at N = 2^256 for
      S = 8, falling to 0.014 at N = 2^4096 -- an o(1), hence not a change to c.
      Against Pollard rho's N^{1/2} = 2^{128} for secp256k1, none of the audited
      claims changes the comparison at all.
    memory_exponent: >-
      Not charged by any audited record, and the omission matters: the BKK
      sparse check restricts the SEARCH but not the relation matrix, so the
      linear-algebra memory (O(B) sparse entries, O(B^2) dense fallback) is
      unchanged by every variant in the trichotomy. A speedup that leaves memory
      fixed while reducing time still moves along the frontier, and none of the
      records says which way.
    best_known: >-
      Pollard rho, O(sqrt N) time and negligible memory, remains the best known
      prime-field ECDLP algorithm at every size. No Semaev index-calculus
      variant in this corpus has a measured advantage over it at any p.
    hidden_overhead: >-
      The audited "speedups" are ratios of CHECK-OPERATION COUNTS with the unit
      undefined, exclude linear algebra entirely, and exclude the cost of
      forming the restricted enumeration. All three hide in the reported number.
    tradeoff_note: >-
      The Amdahl ceiling 1/(1-s) is the tradeoff statement the lane is missing.

  dominated_by: >-
    Pollard rho dominates every member of the trichotomy, and this is stated
    rather than left as n/a because the audited records DO make cost claims.
    Frontier rows checked: TIME -- rho at 2^{128} group operations for
    secp256k1, BSGS at 2^{128}; the fastest Semaev variant in this corpus has no
    measured crypto-scale runtime at all, only a claimed constant factor on a
    stage of an algorithm never run at scale. MEMORY -- rho with distinguished
    points at negligible memory versus Semaev's O(B) sparse matrix with
    B ~ sqrt(N); the BKK variants change neither. DATA/QUERIES -- both are
    query-free on public parameters. On every axis the audited claims are
    dominated by rho, and a constant factor on a dominated point does not move
    it onto the frontier. This proposal itself claims no cost point.
  sota_delta: >-
    ZERO on every attack axis. Quantitatively the deliverable is: an exact
    forced value gamma_m = (m+1)/2^m replacing a "lower bound"; the divergence
    factor 1.147 x 1.36^{m-2} between the fitted model and that value, reaching
    2.42x at m = 8; an Amdahl ceiling of 1/(1-s), approximately 2.0 at the
    balanced optimum, applied to claims ranging from 1.5x to 150x; and
    Delta c = 0.069 at N = 2^256 falling to 0.014 at N = 2^4096, establishing
    that the c-improvement language is o(1). Against a lane currently holding
    4x, 8x and 22-150x simultaneously, the delta is a decision procedure.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    0.70 that gamma_EC/gamma_null comes out within 5 per cent of 1.00 at every
    m, i.e. that the "EC group law bonus" is an instrument artifact. It is not
    higher because the measured excess is monotone in m over the four committed
    cells in a way pure noise would not usually be, because the last-index
    constraint is a real feature of decompositions and could plausibly bias eps
    upward, and because no sample sizes are recorded so the excess cannot
    currently be dismissed as sampling error either. It is not lower because the
    excess is non-monotone between m = 3 (1.32) and m = 4 (1.12), because B is
    as small as 10 in the cells carrying the largest claimed excess, and because
    the fitted model misses its own interior points by +-13 per cent.
    Separately: 0.99 that the Amdahl ceiling and the o(1) c-arithmetic survive,
    since both are algebra performed in this record; and 0.90 that stage 0 alone
    changes what the lane may claim, independently of any measurement.
