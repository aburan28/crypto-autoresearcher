  nearest_existing_record: IDEA-20260808-bfee7e
  delta_from_nearest: >-
    PROBLEM - bfee7e derives the EXPECTED NONLINEAR hit count E_geom for cell (A={0}, S={0})
    from coset geometry and pre-registers a dichotomy (E_geom near 59 = geometric artifact vs
    near 4.0 = genuine). This record derives the AFFINE-LIMIT exact law for ALL frozen cells and
    ALL round counts 1..10, which bfee7e does not touch. OBJECT - bfee7e's object is the
    S-box-free coset lattice expectation under a nonlinear bijective S-box; this record's object
    is the rank quadruple of T_{r,S} under SBOX = id, an exact quantity where bfee7e's is an
    expectation with an error term (its HA-1). DIRECTION - bfee7e asks "is 4.0 the wrong null";
    this record asks "does the exactly-computable skeleton carry the excess's round-count
    location", a question that only became well-posed once BATCH-b41ba9 measured the affine
    limit at probability 1 per trial - a result bfee7e's dichotomy did not anticipate (its two
    branches are 59-scale and 4-scale, and the affine arm measured 2^32-scale). CONSISTENCY -
    the two are complementary, not contradictory: if bfee7e's derivation is ever executed it
    must return E = N (probability 1) in the affine limit, which is a new check its record does
    not carry and this record's census supplies. SECOND NEAREST - IDEA-20260808-83b3ba (branch
    number as knob): empirical linear-layer variation without exact predictions; its arms are a
    subset of IDEA-20260901-69912d, which consumes this record's census as its gate. THIRD
    NEAREST - the archived affine arm itself (one census cell).

  assumptions:
    - >-
      [fact, committed] The cipher convention E_K^r = ARK_r . SR . SB . [ARK_i . MC . SR . SB]
      . ARK_0 with the FIPS-197 ShiftRows offsets and MixColumns matrix is pinned operationally
      (BATCH-002 preregistration section 1; FIPS-197 KAT-passed). The census computes M_r under
      exactly this convention; a convention mismatch between the census code and the probe
      binary is the dominant implementation risk and is controlled by the blocking anchor
      reproduction (P4-i).
    - >-
      [fact, committed] The affine anchor cell reading (ranks 32,0,0,0; E[W>=1] = 1.0; W=3 on
      every nontrivial trial; seed-independent) is validated measurement, EV-AES-048545 O-7.
    - >-
      [derivation, to be checked] P1's exactness - one paragraph of GF(2) linear algebra. It is
      stated as a derivation, never as a theorem of record, and F1/F2 exist precisely because a
      misapplication would look like a clean census.
    - >-
      [scope] Toy tier throughout. Every arm is the pinned r<=10 AES-shaped SPN probe at
      2^30..2^32 on this machine; no crypto-scale or deployed-AES claim is made or implied.
    - >-
      [scope] The census applies ONLY to the affine limit. Its predictions for cells measured
      with nonlinear S-boxes are not claims; the residual is a separate object
      (IDEA-20260901-bcb117).

  proof_search_map:
    bottleneck: >-
      Whether the affine skeleton's death round matches AES's measured death round. It is the
      only step that decides whether the round-count LOCATION of the excess is a linear-geometry
      property or a nonlinearity-driven one, and it is decidable at zero cipher compute.
    baseline_embedding:
      parameter_slice: >-
        The anchor cell (r=5, A={0}, S={0}) under SBOX = id, where the committed measurement
        lives (ranks 32,0,0,0, probability 1 per trial). The census must reproduce it exactly;
        reproducing the known point is the baseline and the blocking control.
      reproduction_check: >-
        FROZEN FIXTURE, BLOCKING. Fresh implementation of the affine cipher at r=5, A={0},
        S={0}, 2^30 trials: required W=3 on 100% of nontrivial trials and rank quadruple
        32,0,0,0 recomputed independently of the census code. Failure voids every census
        reading as an instrument defect (never negative evidence, rule 5).
    observation_collision:
      observable: >-
        The per-cell predicted law (rank quadruple + W distribution).
      distinct_preimage_search: >-
        REQUIRED: at least two census cells with IDENTICAL predicted laws but different (r, A, S)
        are exhibited so that agreement-on-one-number cannot masquerade as validation of the map;
        and the cells predicted NULL while the anchor is predicted MAXIMAL are the dangerous
        collision hunt - an instrument that reports the anchor but also reports excess in a
        null-predicted cell is not measuring the skeleton at all.
    quantifier_order: >-
      CLAIMED IN THIS ORDER FOR P1. FOR ALL round counts r >= 1 under the pinned convention, FOR
      ALL cells (A, S) with S neither empty nor full, FOR ALL keys and seeds: the affine probe
      law equals the census prediction. The universal quantifier over keys/seeds is the content
      of key-independence and is testable because the affine arms cost minutes.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The affine limit of the yoyo probe is exactly the rank census, and its death round
        matches/does not match AES's measured death round." IT CAN NEVER CERTIFY - the mechanism
        of the NONLINEAR residual (why a bijective nonlinear S-box suppresses probability 1 to
        ~15 x 2^-30), anything about substitute cipher families that are not SPNs of this
        geometry, anything about full-round or deployed AES.
      nearby_object_control: >-
        THE AFFINE CIPHER IN A NULL-PREDICTED CELL is the nearby object on which the hoped-for
        conclusion (excess) is KNOWN FALSE by derivation: a maximally structured object that must
        read null in that specific cell. This record runs it (P4-ii); an excess there is the
        proves-too-much indictment.
    proof_obligations:
      - claim: 'P1 exactness: the affine probe law is a function of the rank quadruple alone.'
        responsibility: correctness
      - claim: 'Key- and seed-independence of every affine cell.'
        responsibility: strictness
      - claim: 'The anchor cell reproduces ranks 32,0,0,0 and probability 1 per trial.'
        responsibility: baseline
      - claim: 'Null-predicted cells read null when measured on the affine cipher.'
        responsibility: feasibility
      - claim: 'No sentence transfers an affine-limit statement to a nonlinear S-box.'
        responsibility: scope
    not_applicable_reason: null

