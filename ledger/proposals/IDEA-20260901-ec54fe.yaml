idea:
  id: IDEA-20260901-ec54fe
  question_id: RQ-AES-003
  goal_id: GOAL-AES-003
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  class: mechanism

  title: >-
    THE AFFINE ARM'S EXACT REPRODUCTION IS ONE CELL OF A FULLY COMPUTABLE RANK CENSUS. With
    SBOX = identity the r-round cipher is affine over GF(2), so the yoyo probe's per-trial hit
    law in EVERY cell (round count r, active-word mask A, swap mask S) is an exact GF(2) rank
    computation with ZERO cipher evaluations - the archived anchor (r=5, A={0}, S={0}: word-map
    ranks 32,0,0,0, E[W>=1] = 1.0 per trial, W=3 on every nontrivial trial, deterministic over
    all seeds) is a single point of a map that can be drawn before any measurement. Compute the
    census over r=1..10 and a frozen cell set; then the AFFINE DEATH ROUND - the first r at which
    the skeleton's predicted per-trial probability falls to the null - compared against AES's
    measured death round (alive at r=5, dead at r=6) is the single sharpest localization datum
    available, and the census's null-predicted cells are known-answer instrument controls on a
    cipher KNOWN to be maximally structured elsewhere.

  object: >-
    TRACKED OBJECT - THE AFFINE YOYO SKELETON. With SBOX = id the cipher convention of the
    campaign (E_K^r = ARK_r . SR . SB . [ARK_i . MC . SR . SB]_{i=r-1..1} . ARK_0) reduces to
    E_K^r(x) = M_r x + k_r with M_r a 128x128 GF(2) matrix (a product of the ShiftRows and
    MixColumns linear maps) and k_r a key-dependent constant. The probe acts on DIFFERENCES:
    for an input difference d supported on the active plaintext words PW[A], the swapped and
    decrypted difference is T_{r,S}(d) = M_r^{-1} . Z_{CW[S]} . M_r . d, where Z_{CW[S]} zeroes
    the swapped ciphertext word(s). W counts the plaintext words PW[j] on which T_{r,S}(d)
    vanishes, so the entire per-trial law of the probe in cell (r, A, S) is determined by the
    ranks and joint kernel structure of the four word maps T_{r,S,j} : GF(2)^{32|A|} -> GF(2)^32
    obtained by restricting T_{r,S} to PW[j]. AddRoundKey drops out (translation on differences),
    which is why the archived affine outcome is deterministic over all seeds
    (DEC-20260804-73977c D-8(ii)). The retained object per cell is one rank quadruple plus the
    induced W-distribution - an exact, key-free, seed-free quantity.
    ESTABLISHED FAMILIES DECLARED AS INPUTS RATHER THAN LENSES: the five substitute exclusions
    (EV-AES-e4c091 ideal table, EV-AES-dec938 + EV-AES-5478a0 keyed murmur3-fmix64 Feistel
    class, EV-AES-4ba350 fresh-key SipRound Feistel, EV-AES-048545 random-bijective-S-box
    reproduction) and the BATCH-b41ba9 affine reproduction are cited as the measurements this
    record must accommodate, not as methods it reuses. IDEA-20260808-bfee7e's coset-null
    derivation is the nearest proposed method and is discriminated below.

  lossy_projection_test: >-
    The projection (cipher, key, seed, trial stream) -> (rank quadruple of T_{r,S,j}) discards
    everything nonlinear and everything key-dependent; under SBOX = id nothing of probe relevance
    is discarded, because the composed trial map on differences IS the affine map T_{r,S}. The
    fibres are enormous (all keys and all seeds of the affine cipher map to the same ranks), so
    the projection is maximally lossy and is not a change of coordinates.
    COMPATIBILITY WITH THE OPERATION THE RECORD USES IT UNDER: the operation is the yoyo trial
    on differences, and under it the retained part propagates DETERMINISTICALLY and exactly -
    that is the content of claim P1. The projection is NOT compatible with any nonlinear S-box
    (SubBytes does not commute with it), and the record says so: the census is an exact account
    of the AFFINE limit only, and its relation to the nonlinear residual is the question this
    record poses, not an answer it assumes.
    THE TEST'S SHARP EDGE: the projection is exact in the affine limit precisely because the
    affine arm measured E[W>=1] = 1.0 per trial with ratio 1.0000000000002 to the frozen value
    (EV-AES-048545 O-7). If any census-predicted affine cell fails to reproduce its prediction
    when measured, the projection is not exact and the instrument or the derivation is defective
    - that is falsification F1/F2, stated rather than hidden.

  why_not_a_renamed_known_approach: >-
    Nearest known method - the affine/linear-trail description of swap-based distinguishers on
    reduced-round AES-like SPNs (recalled, unverified; the yoyo/exchange/mixture family is
    recalled as the probe's literature class, no specific source named, none reachable, and
    never used as authority). The classical use of such affine descriptions is to DERIVE a
    distinguisher's probability; this record inverts the use - the affine limit is computed as
    a CENSUS OF EXACT KNOWN-ANSWER FIXTURES for an already-measured statistic, and the census's
    own death round is compared against the campaign's measured death round. Nearest internal
    records - IDEA-20260808-bfee7e (nonlinear expectation E_geom for one cell; never executed;
    its dichotomy predates and does not anticipate the affine maximal result), the archived
    affine arm (one census cell, measured not computed), IDEA-20260808-83b3ba (empirical
    linear-layer variation without affine predictions). The delta against all three is stated
    in nearest_existing_record / delta_from_nearest; this record computes what none of them
    computes and pre-registers the comparison the campaign has never posed (affine death round
    vs measured death round).

  claim: >-
    Four statements. P1 is a derivation, P2 is a pre-registered zero-compute computation, P3 is
    the dichotomy the computation decides, P4 is the measurement that binds the derivation to
    the instrument.

    (P1) AFFINE EXACTNESS. Under SBOX = id, in any cell (r, A, S), the multiset of W-values over
    nontrivial trials is an exact function of the joint kernel structure of the four word maps
    T_{r,S,j} restricted to the nonzero differences supported on PW[A]. In particular the
    per-trial probability P(W >= 1), the full 5-bin W histogram, and the set of diagonals that
    vanish are all determined by the ranks and the intersection pattern of the kernels. The key
    and the seed do not appear. This is a one-paragraph linear-algebra derivation over GF(2);
    it is a DERIVATION under docs/claims-and-verification.md, not a theorem of record, and the
    archived anchor cell (ranks 32,0,0,0 at r=5, A={0}, S={0}; E[W>=1] = 1.0; W=3 on every
    nontrivial trial) is its only committed instance.

    (P2) THE CENSUS. Compute, with zero cipher evaluations (sparse 128x128 GF(2) matrix
    products), the rank quadruple and the induced per-trial law for every cell in the frozen set
    C = { (A={0},S={0}), (A={0},S={1}), (A={0},S={2}), (A={0},S={3}), (A={i},S={i}) for i=1,2,3,
    (A={0,1},S={0}), (A={0},S={0,1}), (A={0,1,2,3},S={0}) } at every r in 1..10. The last cell
    is the affine prediction of the campaign's structure-destroyed control. The census, its
    code, and its digest are committed BEFORE any new measurement arm runs (the TASK-20260801-807
    pre-registration practice; committed digest, not file mtime - defect V-804-2).

    (P3) THE AFFINE DEATH ROUND DICHOTOMY. Define r*_aff as the smallest r >= 2 at which the
    census-predicted per-trial P(W >= 1) for cell (A={0}, S={0}) falls to or below the analytic
    null 2^-30 (equivalently: the predicted hit count at the frozen exposure lies inside the
    campaign's null band). AES's death round is MEASURED by this campaign: alive at r=5, dead at
    r=6 (EV-AES-d33b1c OBS-B2-5; one-sided bound 1.72x pooled on any r=6 excess). Pre-registered
    exclusive readings:
      (MATCH) r*_aff = 6. Then the skeleton dies where AES dies; the round-count location of the
      excess is a property of the LINEAR geometry, and any mechanism account of the nonlinear
      residual must ride on a skeleton that is already dead at r=6.
      (MISMATCH-ALIVE) r*_aff > 6 (or the skeleton never dies within r<=10). Then the skeleton
      is alive at round counts where AES is at the null, and the death of the AES excess at r=6
      is driven by the INTERACTION of nonlinearity with the geometry, not by the geometry alone;
      the localization question relocates to "what does the S-box do at r=6 that it does not do
      at r=5" (IDEA-20260901-bcb117's ramp is the follow-on instrument).
      (MISMATCH-DEAD) r*_aff <= 5. Then the skeleton is already dead where AES is alive; the
      affine reproduction at r=5 would be unexplained by the census and P1 is indicted. This
      branch is not expected (the anchor cell is committed) but is stated so the rule is total.

    (P4) VERIFICATION ARMS. (i) BLOCKING anchor reproduction: re-run the affine cipher in cell
    (r=5, A={0}, S={0}) at 2^30 with a fresh implementation; prediction W=3 on 100% of
    nontrivial trials, excess ratio 1.0 to within the deterministic-exactness tolerance of the
    archived arm. (ii) At least two census cells predicted NULL (P(W>=1) = 2^-30 per trial,
    whichever cells the census names) measured on the AFFINE cipher at matched exposure: the
    count must lie inside the null band. These are KNOWN-FALSE controls: the object is known to
    produce maximal signal in the anchor cell under the same pipeline, and the algebra says
    these cells carry none. (iii) The structure-destroyed cell (A={0,1,2,3}, S={0}) affine
    prediction computed and compared with the committed AES amask=15 readings (1.00x BATCH-002
    A4; 4 at N=2^32 BATCH-713991 R3-A5): the census must be consistent with ~null there or the
    derivation is misaligned with the instrument's masks.

    (WHAT IS NOT CLAIMED) No statement about AES with any nonlinear S-box beyond citing the
    committed measurements; no statement about full-round or deployed AES at any scale; no
    comparison to published cryptanalysis in either direction (RQ-AES-003 R3); no claim that the
    skeleton EXPLAINS the nonlinear residual (that is what the dichotomy tests); nothing about
    the Feistel substitute families except that the census does not apply to them (they are not
    SPNs of this geometry, which is itself a datum for the mechanism question).

  mechanism: >-
    The excess needs AES's round geometry operating on AES-like round content (standing
    conclusion of the campaign), but BATCH-b41ba9 showed something stronger than the campaign's
    framing assumed: with the identity S-box the excess does not merely SURVIVE, it is MAXIMAL
    and DETERMINISTIC - every nontrivial trial hits, W=3, key-free, seed-free. A deterministic,
    key-free excess cannot be a statistical property of the S-box or of the key schedule; it is
    a linear-algebraic identity about the composition M_r^{-1} . Z . M_r in the probe's diagonal
    coordinates. The mechanism candidate this record pursues is therefore: the r=5 excess has a
    linear-algebraic SKELETON forced by the ShiftRows/MixColumns composition at exactly the
    probe's round count and geometry, the skeleton is exactly computable, and the measured
    nonlinear residual (~15x at r=5 for AES, for random bijections, and for the AES S-box alike)
    is what remains when a bijective nonlinear S-box perturbs that skeleton. Whether the skeleton
    also carries the DEATH ROUND - the most localized fact about the excess, alive at 5 and dead
    at 6 - is the question the census answers, and it is the question no committed record has
    yet posed with a computable prediction attached.

