      direction: different
      minimum_effect: >-
        A pre-registered per-r predicted W value (the anchor gives W=3 at r=5; the r=2 control
        gives W=3 at r=2 even with the real S-box). Where the census predicts a different W for
        some r, a single cheap affine arm at that r decides whether the fingerprint holds; the
        fingerprint is a finer invariant than the hit count and costs nothing to predict.

  minimal_test: >-
    STAGE 0 (zero cipher compute, bulk of the deliverable): implement the census as sparse
    GF(2) matrix products under the pinned convention; compute PR-2's table and commit it with
    its digest. STAGE 1 (blocking, minutes): anchor reproduction PR-1 with a fresh
    implementation. STAGE 2 (one producer slot): measure the two NULL-predicted cells (PR-4)
    and, if the census names a round count r != 5 with SKELETON-ALIVE and a different predicted
    W, one 2^30 affine arm there (PR-6). Total new measurement: 3-4 arms at exposures already
    demonstrated affordable (the affine arm at 2^32 ran inside a normal producer window;
    D-5 costed one 2^32 arm at ~255 s).
  preregistered_decision_rule: >-
    Committed before Stage 2 runs, keyed to PR-3: (MATCH) r*_aff = 6 AND all measured cells
    agree with their census predictions -> record the conclusion "the round-count location of
    the excess is carried by the linear skeleton" at toy tier and route the residual question
    to IDEA-20260901-bcb117; (MISMATCH-ALIVE) r*_aff > 6 AND measured cells agree -> record
    "the skeleton outlives the AES excess; death-round is nonlinearity-driven" and the ramp
    becomes RANK 1; (MISMATCH-DEAD) or ANY measured cell disagreeing with its exact prediction
    -> F1/F2 fires, all readings VOID as instrument/derivation defect, repair dispatched, no
    mechanism conclusion recorded. A budget halt is resource_exhaustion, never a reading.

  test_boundary: >-
    The census and all arms are statements about the pinned reduced-round AES-shaped SPN with
    SBOX = id (or the committed nonlinear arms cited as inputs), r <= 10, one probe family, one
    machine, toy tier. NOTHING transfers to nonlinear S-boxes (the residual is a separate
    object), to substitute cipher families (Feistel, ideal table), to other probe geometries
    beyond the frozen cell set, to full-round AES, or to any deployed cipher. The death-round
    comparison is between two toy-tier measurements of the same probe and asserts nothing about
    any published death round in either direction (R3).

  falsification_conditions:
    - >-
      F1 (BLOCKING). The anchor reproduction fails - W != 3 on some nontrivial trial, or the
      recomputed ranks are not 32,0,0,0. Instrument or convention defect; every census reading
      is VOID; the run returns as invalid_measurement, never as evidence against the skeleton.
    - >-
      F2 (PROVES-TOO-MUCH). A census NULL-predicted cell reads excess on the affine cipher
      (count above the null band at matched exposure). The pipeline manufactures excess on a
      known-structured object; the instrument is indicted; this indicts the whole localization
      program's interpretability and escalates to IDEA-20260901-02f7c4's battery and to
      independent review before any further mechanism reading.
    - >-
      F3 (THE CONSEQUENTIAL MECHANISM FALSIFIER). The census is internally consistent and all
      affine arms agree, but r*_aff != 6 (MISMATCH-ALIVE or MISMATCH-DEAD). The skeleton does
      not carry the death round; the claim "the round-count location of the excess is a
      linear-geometry property" is falsified and the record says so plainly. This is a complete
      result, not a failed run, and its forward guidance names what remains open (the
      nonlinearity-driven decay question, IDEA-20260901-bcb117).
    - >-
      F4. The structure-destroyed cell prediction disagrees with the committed amask=15
      readings (PR-5 fails). Census mask semantics are misaligned; the table is void pending
      repair; recorded as a derivation defect.
    - >-
      NOT A FALSIFICATION - any budget halt, crash, or implementation failure (rule 5); and a
      MISMATCH reading confirmed by measurement is F3, a mechanism result, not an instrument
      defect.

  controls:
    - >-
      NULL OBJECT - the standing ideal-permutation null (EV-AES-e4c091) at the battery's
      exposure as the anchor seat for what ~null looks like under this pipeline.
    - >-
      KNOWN-FALSE CONTROL (proves-too-much) - the census NULL-predicted cells measured on the
      AFFINE cipher: objects known to be maximally structured in the anchor cell, on which the
      algebra says THIS cell carries no signal. This is the strongest available known-false
      object in the campaign - stronger than the ideal permutation, because the same pipeline
      demonstrably produces signal on the same cipher elsewhere.
    - >-
      POSITIVE CONTROL - the anchor cell itself (PR-1), blocking.
    - >-
      DECAY PARAMETER - r itself, swept 1..10 in the census and at selected r in measurement;
      the canonical artifact tell (a quantity that fails to decay when the parameter meant to
      destroy it increases) is pre-registered as the MISMATCH-ALIVE branch, and its reading is
      attached in advance rather than discovered afterwards.
    - >-
      PRE-REGISTRATION AS COMMITTED DIGEST - the census table and its digest committed before
      any Stage 2 arm (V-804-2 discipline).

  confounders:
    - >-
      CONVENTION MISMATCH between the census code and the probe binary (round order, state
      endianness, PW/CW table emission) is the dominant risk; the blocking anchor reproduction
      and the probe's run-time PW/CW table emission check (BATCH-002 section 2 discipline)
      target exactly it.
    - >-
      THE ANCHOR WAS MEASURED BY ONE PRODUCER LINEAGE (BATCH-b41ba9's task) and validated by
      from-scratch matrix build; PR-1 re-measures it on a fresh implementation, which is also
      the lineage-confound mitigation.
    - >-
      SHARED-HARNESS BUGS CONDITIONAL ON THE ROUND FUNCTION (BATCH-010 red team's residual risk
      class) are not ruled out by any affine arm alone, since all affine arms share the SBOX=id
      code path; the cross-lineage re-measurement in IDEA-20260901-02f7c4 arm B3 is the named
      mitigation and this record does not claim to discharge it.
    - >-
      THE CENSUS IS EXACT ONLY FOR THE FROZEN CELL SET; a cell outside C is not predicted and
      must not be measured and read against an absent prediction (post-hoc prediction is the
      V-804-2 failure in a new costume).

  interpretation_limits:
    - >-
      claim_tier toy. P1 is a derivation under docs/claims-and-verification.md; the arms verify
      the derivation over a finite cell set, never universally.
    - >-
      A MATCH reading does NOT explain the nonlinear residual's MAGNITUDE (~15x) - it locates
      the death round in the skeleton and nothing more; the residual remains open and is owned
      by IDEA-20260901-bcb117.
    - >-
      NOTHING about the Feistel substitute families follows from the census except the
      tautology that they are outside its domain; their absence readings stand on their own
      records.
    - >-
      Timeouts, crashes and infrastructure failures are never negative mathematical evidence
      (rule 5).
    - >-
      No comparison to published cryptanalysis in either direction; no statement about
      full-round or deployed AES (RQ-AES-003 R6, R3).

  heuristic_assumptions:
    - id: H1
      statement: >-
        SKELETON-RESIDUAL COUPLING. For a bijective nonlinear S-box, the r=5 residual excess
        (~15x) is concentrated on trials whose difference evolution shadows the affine skeleton
        - i.e. the residual rides on the skeleton rather than coexisting with it.
      rigorous_support: >-
        RIGOROUS PART - in the affine limit the skeleton's law is exact (P1), and the r=2
        control shows the exact law survives one round of real S-box nonlinearity (W=3 on 100%
        of nontrivial trials, BATCH-002 PR-1). What is heuristic is only that the coupling
        persists in attenuated form to r=5. DISTRIBUTION IMITATED - none claimed; this is a
        coupling hypothesis tested by IDEA-20260901-bcb117's anisotropy arm, stated here only
        so the census's follow-on use is explicit.
      validation_plan: >-
        Not validated in THIS record - the census is affine-only by design. The plan lives in
        IDEA-20260901-bcb117 (joint (W, vanishing-diagonal) distribution against the skeleton
        prediction).
      falsification_condition: >-
        Owned by IDEA-20260901-bcb117 F4: isotropic residual hits would refute the coupling and
        leave the census intact as an account of the affine limit only.
    - id: H2
      statement: >-
        CENSUS-INSTRUMENT ALIGNMENT. The pinned probe binary realizes exactly the trial map
        T_{r,S} of P1 under SBOX = id, including the trivial-trial exclusion's effect on the
        affine law (in the anchor cell the exclusion removes trials of measure 2^-32, below the
        census granularity, which is stated rather than ignored).
      rigorous_support: >-
        RIGOROUS PART - the exclusion's expected rate 2^-32 at |S|=1 is committed (BATCH-002
        section 3) and is six orders below the anchor's probability 1; its effect on any
        null-predicted cell is at most one forced-W=3 trial per 2^32, inside the null band.
      validation_plan: >-
        PR-1 (anchor) plus IDEA-20260901-02f7c4 arm B4 (exclusion toggle audit with exact
        signed-delta prediction).
      falsification_condition: >-
        Any affine arm disagreeing with its exact census prediction (F1/F2).

  obstruction:
    quantity: >-
      Per-trial hit probability P(W>=1) of the yoyo probe as a function of round count r in the
      anchor cell, in the AFFINE limit - currently a single measured point (r=5: 1.0) beside a
      single nonlinearity point (AES r=5: ~1.4e-8; AES r=6: at the null).
    measured_value: >-
      1.0 exactly at r=5 (BATCH-b41ba9, ratio 1.0000000000002 to the frozen value, deterministic
      over all seeds); ~1.4e-8 for AES at r=5 (59 hits at N=2^32, Garwood CI on the count);
      at the null for AES at r=6 (one-sided bound 1.72x pooled). Error bars: the affine point is
      exact (deterministic); the AES points carry Poisson/Garwood intervals as committed.
    runs_read_from: >-
      BATCH-b41ba9 (TASK-20260806-47f217), BATCH-713991 RANK 3, BATCH-002 A1/A2, BATCH-013 RC-C
      reference distribution.
    scope_claimed: >-
      Toy tier, one probe geometry, r in {5,6} measured for AES, r=5 measured for the affine
      limit; nothing between, nothing beyond r=6, nothing for other cells.
    resource_check:
      examined: true
      reading: >-
        The same determination that obstructs a purely statistical reading of the excess (the
        affine limit is EXACT and key-free, so the excess cannot live in the S-box values or the
        key schedule) is the ASSET of this record: exactness is what makes the census computable
        at zero cipher cost, and the cells where the computation predicts null become the
        known-answer fixtures of IDEA-20260901-02f7c4. The gap between 1.0 and ~1.4e-8 - nine
        orders of magnitude of unmeasured suppression - is simultaneously the obstruction to a
        skeleton-sufficiency account and the asset IDEA-20260901-bcb117 reads as a dose-response
        curve.

  target_complexity:
    time_exponent: >-
      No attack, no exponent. Stage 0 is zero cipher compute (sparse GF(2) matrix products on
      128x128 matrices, seconds); Stage 1-2 are 3-4 arms at 2^30..2^32, minutes each at the
      campaign's measured rates (~255 s per 2^32 arm, D-5).
    memory_exponent: >-
      O(1) per query for the affine arms (direct evaluation, table-free); the census itself is
      negligible.
    best_known: >-
      The campaign's own committed arms are the baseline - affine anchor (probability 1 per
      trial), AES 59/2^32, null 4.0/2^32. No improvement claimed on any axis; this is a
      localization measurement.
    hidden_overhead: >-
      Disclosed: the census predicts exact laws only for the frozen cell set; any cell added
      after seeing data is post-hoc and void. The affine arms' cost hides nothing - they are
      cheaper than every substitute arm the campaign has run.
    tradeoff_note: >-
      No time-memory tradeoff in the content. The evidential tradeoff is stated: the census is
      strongest exactly where it is exact (the affine limit), and says nothing about the
      nonlinear residual's magnitude - which is why the record routes that question out rather
      than smoothing over it.

  dominated_by: >-
    CHECKED ROW BY ROW across time, memory and data/queries against the internal frontier (the
    published frontier is unadjudicable in this environment, R3/R5, and no margin is claimed so
    no frontier row is competed with). ROW 1, executed exclusions EV-AES-e4c091 / EV-AES-dec938
    / EV-AES-4ba350 / EV-AES-5478a0 / EV-AES-048545: substitute-class exclusions and the affine
    anchor; NONE computes a rank, a census, or a death-round prediction - they narrow what the
    excess is not, which is exactly the input this record consumes. ROW 2, IDEA-20260808-bfee7e:
    derives the nonlinear expectation for ONE cell at nonzero compute of a different kind
    (coset counting with an error term); does not dominate the affine census (different object,
    exact where bfee7e is approximate, all r where bfee7e is one r), and its own dichotomy is
    superseded at the affine limit, which it never computed. ROW 3, IDEA-20260808-83b3ba:
    empirical branch-number ladder at strictly higher compute per bit of discrimination (each
    rung is a measured arm where this record's Stage 0 is free) and no exact predictions; it
    does not dominate. ROW 4, IDEA-20260807-bbefda: k-profile at fixed r and S-box, different
    axis, no overlap. ROW 5, the archived affine arm: one cell of this census, subsumed. Every
    row checked; none dominates, so null is written honestly and not by omission.
  sota_delta:
    time_exponent: '0 (no attack)'
    memory_exponent: '0 (no attack)'
    data_or_query_exponent: '0 (no attack)'
    note: >-
      The delta is discrimination, quantified: (i) ONE archived exact cell becomes a complete
      exact map over 8 cells x 10 round counts at zero cipher compute; (ii) the map decides a
      pre-registered dichotomy that separates TWO mechanism classes no committed record has
      separated (linear-geometry-driven death round vs nonlinearity-driven decay); (iii) it
      manufactures at least two known-answer instrument controls (NULL-predicted cells on a
      known-structured cipher) that no existing control matches in strength; (iv) it supersedes
      the stale queued identity/affine discriminator (executed, DEC-20260804-73977c D-6) by
      turning its single point into a map. Published-frontier comparison unadjudicable (R3) and
      irrelevant - no margin claimed.

  estimated_cost:
    implementation: low-medium
    compute: low
  compute_budget_note: >-
    Stage 0 zero cipher compute; Stage 1 one 2^30 arm (minutes); Stage 2 two-to-three 2^30/2^32
    arms. One producer slot suffices; the affine arms are cheaper than any substitute arm the
    campaign has run to date.
  recommended_priority: high

  honest_prior_of_survival: >-
    P(census reproduces the anchor under fresh implementation) ~ 0.9; P(all measured affine
    cells agree with exact predictions) ~ 0.85; P(the dichotomy resolves cleanly either way)
    ~ 0.95; P(MATCH) ~ 0.35 as recorded in PR-3. The record is designed to deliver a determinate
    mechanism verdict or a determinate instrument verdict in every branch.

  relation_to_existing_records:
    distinct_from: >-
      IDEA-20260808-bfee7e (nonlinear expectation, one cell), IDEA-20260808-83b3ba (empirical
      branch-number ladder), IDEA-20260807-bbefda (k-profile). No contradiction with any of
      them; the consistency statements are in delta_from_nearest.
    consumes: >-
      EV-AES-048545 O-7/O-8 (the anchor), the BATCH-002 frozen probe definition, the five
      exclusion records as inputs the census must accommodate.
    feeds: >-
      IDEA-20260901-69912d (mutations are gated on this census's affine predictions),
      IDEA-20260901-bcb117 (the ramp's k=0 prediction and the residual's anisotropy target come
      from this census), IDEA-20260901-02f7c4 (NULL-predicted cells are its known-false
      fixtures).

