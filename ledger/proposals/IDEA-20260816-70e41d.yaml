idea:
  id: IDEA-20260816-70e41d
  question_id: RQ-MLKEM-003
  added: '2026-08-16'
  title: Locate the enumeration/sieving crossover as a curve over a one-parameter memory price rather
    than as a single dimension quoted at free memory, by measuring step counts and peak list sizes
    for both algorithms on identical lattices and composing them with a priced cost functional
  class: measurement
  claim: '(A) KN-OPEN-017 states that the measured G6K-versus-FPLLL crossover near dimension 70 is
    a step-count comparison between an algorithm using at least 2^{0.2075n} memory and one using polynomial
    space, and asks where the crossover moves under Wiener-style full cost. The object this proposal
    tracks is not a crossover dimension. It is the crossover as a function n*(mu), where mu is an
    explicit memory price and n*(mu) is the smallest dimension at which the priced sieve cost falls
    below the priced enumeration cost on the same lattice distribution. (B) The claim is that n*(mu)
    is directly measurable at dimensions far below any crossover, because the two ingredients it needs,
    the measured time and the measured peak memory of each algorithm as functions of n, are separately
    measurable at n = 20 to 44 in pure Python, and the composition into a priced cost is arithmetic.
    The deliverable is the curve n*(mu) over mu spanning free memory to memory priced equally with
    time, together with the fitted exponents of both algorithms'' time and memory in the tested band
    and the honest interval on the extrapolation each fit supports. (C) The entry commits in advance
    to reporting the two failure modes KN-OPEN-017 itself anticipates: that the correction may be
    a constant factor rather than an exponent change at reachable dimensions, and that the fits''
    o(1) terms may be too loose to place n*(mu) at all. Either is recorded as the measured result
    with its interval. (D) NOT CLAIMED: no attack, no speedup, no re-ranking of primal, dual or enumeration-based
    attacks at cryptographic dimensions, no statement that any parameter set is affected, and no assertion
    about the true asymptotic crossover. The pure-Python sieve is not competitive with G6K and is
    not claimed to be; it is an instrument for measuring an exponent pair on identical inputs, not
    an implementation of record.'
  mechanism: 'STAGE 1. Fix one lattice distribution and generate bases at n = 20, 22, ..., 44, each
    with a recorded exact-integer basis and a recorded true shortest-vector norm obtained independently
    by exhaustive enumeration at the smallest dimensions and by agreement of the two algorithms above
    that. STAGE 2. Run a pure-Python enumeration solving exact SVP on each basis, instrumenting exact
    node count and peak stack depth. STAGE 3. Run a pure-Python Gauss-style sieve on the same basis,
    instrumenting exact reduction-attempt count and peak list size in vectors. STAGE 4. Verify both
    return the same norm; disagreement halts the run and is reported as an instrument defect, never
    as a mathematical result. STAGE 5. Fit log2(T_enum), log2(T_sieve), log2(M_enum), log2(M_sieve)
    against n with intervals. STAGE 6. Define the priced cost C(T, M; mu, theta) = T * (1 + mu * M^theta)
    and compute n*(mu) for theta in a stated set by solving C_sieve = C_enum on the fitted curves.
    STAGE 7. Report n*(mu) as a curve with a confidence band derived from the fit intervals, and report
    explicitly where the band is too wide to place a crossover. Refutation: if the fitted memory-exponent
    gap is inside its own interval, n*(mu) is unplaceable and the entry says so with the band.'
  novelty_status: unverified
  novelty_screen:
    method: grep -rilE 'crossover|enumeration' ledger/proposals/; grep -rilE 'memory.charg|full.cost|wiener'
      ledger/proposals/; grep -rilE 'g6k|fplll|kissing' ledger/proposals/ knowledge/. Read in full
      knowledge/open-problems/KN-OPEN-017.md and the head of knowledge/techniques/KN-TECH-044.md.
      Read titles and claim heads of IDEA-20260805-554b9d, IDEA-20260808-baf8bc, IDEA-20260801-006,
      IDEA-20260806-3b91c7, IDEA-20260805-fc6361.
    results: The corpus has a live full-cost lane, but on codes and on the ECDLP, not on lattice SVP.
      IDEA-20260805-554b9d re-costs the ISD family under Wiener full cost with comparator tau+mu.
      IDEA-20260808-baf8bc computes a constrained ISD frontier T_V(mu) and asks whether advanced-ISD
      optima collapse onto Dumer/Stern below a memory threshold, the closest methodological sibling
      found, and it is about decoding rather than lattices. IDEA-20260806-3b91c7 puts rho on a memory-parameterised
      tradeoff. IDEA-20260801-006 verifies a Wesolowski concrete-cost table with a charged golden-ratio
      tradeoff. On the lattice side IDEA-20260805-fc6361 measures a saturation-ball constant and IDEA-20260805-f7c912
      measures delta(beta) by running reduction, but neither prices memory. KN-OPEN-017 records explicitly
      that no source in the corpus computes the crossover under full cost.
    verdict: 'UNVERIFIED. Nothing is asserted about external literature. Claimed new relative to this
      repository: applying the corpus''s own full-cost discipline (KN-TECH-035, KN-TECH-044) to the
      enumeration/sieving pair by measuring both algorithms'' time and memory on identical bases and
      reporting the crossover as a curve over the price rather than a single number. Assembled from
      known parts: the price-parameterised frontier method already used for ISD in IDEA-20260808-baf8bc,
      standard enumeration and Gauss-sieve algorithms, and ordinary least-squares exponent fitting
      with intervals.'
  object_first_candidate:
    tracked_object: The ordered pair (T(n), M(n)) of exact operation count and exact peak list size,
      measured per algorithm per basis, and its image n*(mu) under a stated one-parameter price functional.
    lossiness: 'Genuinely lossy. The full state of a run is the entire trajectory of the algorithm,
      every visited node, every stored vector, every reduction attempt. The tracked object retains
      two integers per run and discards the trajectory entirely. This is compatible with the operation
      of interest because the price functional consumes only hardware quantity and time occupied,
      which is what KN-TECH-035''s full-cost discipline defines; nothing in the price depends on the
      order of operations. The retained pair still propagates deterministically under the composition
      studied, since C(T, M) is a function of the pair alone. The cost of the loss is explicit: any
      locality structure in the memory accesses is invisible to this object, which is exactly why
      a separate entry in this batch tracks the access pattern instead.'
    propagation: One step of the target operation is incrementing the dimension by one. Under that
      step T_enum multiplies by roughly n^{c} for a superexponential-in-log factor while M_enum stays
      polynomial; T_sieve and M_sieve both multiply by constants strictly greater than one, the memory
      constant floored by the kissing-number bound recorded in KN-LIT-104. The priced cost propagates
      as C(n+1) = T(n+1) * (1 + mu * M(n+1)^theta), and the crossover moves by however much the two
      propagation constants differ. Measuring those constants in the reachable band is the whole content.
    survival_score: Pure-Python enumeration solving exact SVP is affordable to about n = 44 within
      an hour per basis; the pure-Python sieve's list grows past a million vectors near n = 46 and
      dissolves in memory. The measured band is therefore n = 20 to 44, roughly twenty-five dimensions,
      enough to fit a slope but not enough to see a crossover directly. The structure survives as
      a fitted exponent pair with an interval and dissolves as a directly observed crossover. That
      gap is the entry's central honesty burden and is reported as a band, never bridged by assertion.
  null_object_control: 'The identical measurement runs against a null lattice of the same shape: bases
    of the same dimension and determinant obtained by applying a random unimodular transform to a
    scaled orthogonal lattice, so the true shortest vector is known exactly and the instance has no
    hard structure. Both algorithms run on it in the same invocation from the same seed stream. The
    null must show a materially different exponent pair, enumeration nearly linear in n and sieve
    list size collapsing, and must show n*(mu) either undefined or far from the signal arm''s. If
    the null arm produces the same exponent pair as the signal arm, the instrument is measuring implementation
    overhead rather than instance hardness and every signal-arm exponent is an artifact, recorded
    as a controlled null.'
  discriminated_from:
  - 'IDEA-20260808-baf8bc: the same price-parameterised-frontier method applied to ISD variants on
    codes with asymptotic exponent optimisation. This entry measures rather than optimises and its
    object is lattice SVP; the two share a method and no object.'
  - 'IDEA-20260805-554b9d: Wiener full-cost re-costing of the ISD lineage, again codes and again analytic.
    This entry runs both algorithms on identical bases and reports measured integers.'
  - 'KN-TECH-044: the corpus''s technique note recording that full cost should be applied to sieving.
    It states the discipline and explicitly lacks the number; this entry attempts to supply a measured
    exponent pair and cites the note as warrant rather than reproducing it.'
  - 'IDEA-20260805-f7c912: measures the blocksize-to-root-Hermite map delta(beta) by running reduction
    on ML-KEM-shaped lattices. That measures reduction quality; this measures time and peak memory
    of two SVP solvers and prices them.'
  - 'A bare lattice-estimator rerun: the estimator is never invoked. Every number in the primary result
    comes from an instrumented run.'
  assumptions:
  - Pure-Python operation counts faithfully proxy the algorithms' abstract step counts, since both
    are instrumented at the same abstraction level (nodes visited, reduction attempts) rather than
    by wall clock.
  - Peak list size in vectors is the right memory unit for the price; per-vector bit-size is tracked
    separately as a secondary metric and its omission from the price is stated.
  - The price family C = T*(1 + mu*M^theta) with theta in a stated set brackets the wiring models
    of interest; no claim is made that any particular theta is physically correct.
  - A slope fitted over n = 20 to 44 supports extrapolation only with a stated and widening interval;
    the entry reports the interval and does not choose a point estimate at n = 70.
  - Both algorithms return the true shortest vector, verified by agreement and by exhaustive enumeration
    at the smallest dimensions.
  predictions:
  - metric: fitted slope of log2(M_sieve) against n in the tested band
    direction: higher
    minimum_effect: 0.18
  - metric: fitted slope of log2(M_enum) against n
    direction: lower
    minimum_effect: 0.02
  - metric: n*(mu) at mu=0 minus n*(mu) at the largest tested mu, in dimensions
    direction: different
    minimum_effect: 'refusal to pre-commit on magnitude: KN-OPEN-017 names both a constant-factor
      outcome and an exponent-change outcome as honest possibilities, and pre-committing to a shift
      size would prejudge which. A displacement of at least 2 dimensions is the threshold below which
      the entry reports no measured movement.'
  - metric: width of the 95 percent band on n*(mu) at the largest tested mu, in dimensions
    direction: lower
    minimum_effect: 12
  minimal_test:
    design: Three dimensions, two algorithms, one price sweep. Take n in {24, 32, 40}, ten bases each
      from one fixed distribution. Run pure-Python enumeration and a pure-Python Gauss sieve on every
      basis in the same invocation, instrumenting node count, reduction-attempt count and peak list
      size. Verify norm agreement. Immediately run the null arm, unimodularly scrambled scaled-orthogonal
      bases of the same dimension and determinant, through the identical code path. Fit four slopes
      with intervals from thirty points each. Compose into n*(mu) for mu on a log grid from 0 to 1
      and theta in {0.5, 1.0}. Report the curve with its band. This discriminates because the entire
      question is whether the two memory slopes differ enough that pricing moves the crossing, and
      three well-separated dimensions with ten seeds each is the smallest design producing slopes
      with intervals narrow enough to answer that, while the null arm establishes that the slopes
      are properties of the instances rather than of the code.
    controls:
    - 'Null arm: unimodularly scrambled scaled-orthogonal bases of matched dimension and determinant,
      run through the identical code path in the same invocation.'
    - 'Norm-agreement control: enumeration and sieve must return the same shortest norm on every basis;
      disagreement halts the run.'
    - Exhaustive ground truth at n <= 26 by full enumeration over a proven radius.
    - 'Cost-unit control: both algorithms additionally instrumented by wall clock, reported only as
      a secondary metric to expose divergence between abstract counts and real time.'
    - 'Determinant control: all bases in a dimension normalised to the same determinant so norms are
      comparable.'
    required_metrics:
    - exact enumeration node count per basis
    - exact sieve reduction-attempt count per basis
    - peak sieve list size in vectors
    - peak enumeration stack depth
    - returned shortest-vector squared norm per algorithm per basis
    - fitted slopes and intercepts with 95 percent intervals for all four series
    - n*(mu) curve with band
  falsification_conditions:
  - 'Null-arm slopes match signal-arm slopes: the instrument measures code overhead rather than instance
    hardness and every exponent is void.'
  - 'Norm disagreement between the two algorithms on any basis: instrument defect, run void.'
  - 'The interval on c_sieve - c_enum contains zero: the memory-exponent gap is unresolved in the
    tested band and n*(mu) is declared unplaceable, which is the reported result.'
  - Sieve list size saturates rather than growing, indicating the implementation is not a faithful
    Gauss sieve; the memory series is void.
  - 'n*(mu) displacement below 2 dimensions across the whole price sweep: pricing is measured not
    to move the crossover in the tested regime, refuting the entry''s motivating expectation.'
  confounders:
  - Implementation constants differ between the two algorithms and enter the intercepts, so an apparent
    crossover displacement could be an intercept artifact; intercepts are reported separately from
    slopes.
  - Basis quality varies by seed, and a badly conditioned basis inflates enumeration nodes without
    changing instance hardness.
  - Peak list size depends on the saturation criterion chosen for the sieve, which is a parameter
    rather than a property of sieving.
  - Python object overhead makes per-vector memory in bytes unrepresentative, which is why the price
    uses vector count and the byte figure is secondary.
  - The narrow dimension band means the four fits share a small range, so slope estimates are correlated
    with intercepts and the band on n*(mu) inherits that correlation.
  interpretation_limits:
  - An exponent pair measured at n <= 44 in pure Python is not a statement about G6K, FPLLL or any
    optimised implementation.
  - A crossover displacement computed from extrapolated fits is a banded projection, not an observation,
    and where the band is wide the entry declines to place it.
  - Nothing here re-ranks any attack at cryptographic dimensions, and nothing bears on ML-KEM, FIPS
    203 or any deployed system.
  - theta is a modelling choice bracketing wiring assumptions; no value of theta is asserted to be
    physically correct here.
  target_complexity:
    time_exponent: No attack exponent is claimed for either algorithm beyond the measured in-band
      fits, which are reported with intervals and are properties of these implementations at these
      dimensions.
    memory_exponent: No attack memory exponent is claimed. The measured in-band memory slopes are
      reported with intervals; the kissing-number bound of KN-LIT-104 is cited as context and is not
      re-derived or tested.
    best_known: The incumbent is the step-count crossover recorded in KN-OPEN-017, the measured G6K-versus-FPLLL
      crossing near dimension 70 at free memory. This entry does not beat it, reproduce it, or contest
      it; it measures the ingredients that would move it under a price and reports how wide the resulting
      band is.
    hidden_overhead: 'The dominant hidden cost is human: writing a faithful Gauss-style sieve and
      a correct exact-SVP enumeration in pure Python with matched instrumentation, and defending that
      the two are instrumented at the same abstraction level. A second hidden term is the saturation
      criterion, which silently sets the memory series and is a judgement rather than a measurement.'
  dominated_by: 'n/a (no result claimed). Frontier rows checked for relevance and found not to be
    frontiers this entry sits on: IDEA-20260808-baf8bc''s memory-constrained ISD frontier, IDEA-20260805-554b9d''s
    Wiener-costed ISD lineage, IDEA-20260806-3b91c7''s memory-parameterised rho tradeoff, and the
    kissing-number memory floor of KN-LIT-104. This entry produces an exponent pair and a banded crossover
    projection, not a cost on any of those frontiers.'
  sota_delta: no attack; conceptual/measurement contribution only. The deliverable is four measured
    exponents with intervals on identical bases, a null arm, and a banded n*(mu) curve including the
    explicit case where the band forbids placing a crossover.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Three separable parts. (i) That both algorithms run correctly with matched
    instrumentation to n = 44 and agree on norms: about 0.7, the enumeration being the easier half
    and the sieve the risk. (ii) That the memory-slope gap c_sieve - c_enum is resolved with an interval
    excluding zero: about 0.8, since the two memory behaviours differ qualitatively and twenty-five
    dimensions should separate them. (iii) That the resulting band on n*(mu) is narrow enough to report
    a displacement of at least 2 dimensions: about 0.3, and I decline to raise it, because extrapolating
    four correlated fits far outside a twenty-five-dimension band is exactly the move that widens
    bands fastest.'
