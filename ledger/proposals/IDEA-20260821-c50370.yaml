    results: >-
      Inside the repository: none of the eight existing lane proposals touches the reduction's
      resources. IDEA-20260816-8596af is the closest and is squarely about the ADVANTAGE
      coordinate - it enumerates constants, lower-order terms and absorbed inequalities dropped
      along a chain of game hops. A memory term is not a forgiven constant in the advantage.
      IDEA-20260816-583998, -d270bc and -7b9457 are also coordinate-1 instruments.
      EXTERNALLY, AND THIS IS THE MATERIAL CHANGE AT REPAIR TIME: memory-tightness of FO
      reductions is not an open gap but a published result. Bhattacharyya (eprint 2020/075,
      abstract read) states that Auerbach et al. (CRYPTO 2017) introduced memory-tightness, that
      their techniques 'do not extend directly to the reductions involving intricate
      RO-programming', that 'all the other existing results on memory-tightness are lower bounds
      and impossibility results', and that the paper proves 'memory-tight reductions for
      different variants of Fujisaki-Okamoto Transformation ... applicable to several
      lattice-based KEM candidates'. That both DOMINATES the record's original conceptual claim
      and supplies its nearby-object control and its discriminating question (does the technique
      reach the 2025 SALTED FO transform).
    verdict: >-
      UNVERIFIED, and after repair the honest substantive label is closer to `known` for the
      concept and `adaptation` for the FrodoKEM/SFO-specific question. Charging a reduction's
      memory is published (ACFK 2017; Bhattacharyya 2020, abstract read this session), and
