  object_first_candidate:
    tracked_object: >-
      The reduction's STORE: log2 m_B as a function of the adversary's (q_G, q_H, q_D), followed
      hop by hop along the transcribed game chain, together with the KEY each stored record is
      indexed by - because the key is what decides whether a record can be regenerated from a
      PRF instead of stored, which is the whole content of the memory-tight technique.
    lossiness: >-
      GENUINELY LOSSY. The projection keeps, per hop, (log2 store size, index key type) and
      discards the record CONTENTS, the constants, and the machine model: a table of 2^40
      ciphertext/message pairs and one of 3 x 2^40 salt/seed pairs keyed the same way are the
      same object. The discard is compatible with the target's operation - sequential
      composition of game hops - because the composed store is a deterministic function of the
      per-hop sizes alone (log-sum-exp, see H1), and because regenerability is a property of the
      index key alone and not of the contents. It is NOT a change of coordinates: the sizes and
      contents cannot be reconstructed from the retained pair, and the standard accounting,
      which retains only the advantage, is a strict further projection.
      CORRECTED AT REPAIR: the earlier version of this block asserted that 'in log coordinates
      composition is ADDITION'. That is false. Composition adds resources in LINEAR coordinates,
      so in log coordinates it is log-sum-exp, and the claim that additive constants 'stay
      separable from the exponents' is withdrawn. Discarding a per-hop multiplicative constant
      c_i perturbs the composed log by at most log2(max_i c_i), which is the honest and much
      weaker separability statement.
    propagation: >-
      One game hop = one update of the store vector. The CORRECTED law: if hop i holds a store
      of 2^{m_i} records and stores persist along the chain, the composed store is
      log2(sum_i 2^{m_i}), which lies in [max_i m_i, max_i m_i + log2 H] for a chain of H hops -
      NOT sum_i m_i. A hop that installs a list-based RO simulator contributes m_i = log2 q_RO
      + O(1); a hop that installs a PRF-regenerated simulator in the sense of ACFK/Bhattacharyya
      contributes m_i = O(log q_RO) or O(1) and is exactly what the STAGE 4 discriminator is
      looking for; an advantage-only hop contributes nothing.
    survival_score: >-
      Survives the entire classical ROM chain and dissolves at the first hop whose simulator
      store is not a function of the adversary's query counts - rewinding, non-uniform advice,
      or a QROM hop stated only asymptotically (a compressed-oracle simulator's state is a
      different object again). Naming that first hop is a required output and is a reusable fact
      about the proof whatever the numbers say.
  null_object_control: >-
    FIVE controls, each able to fail, all in the same invocation as the signal arm.
    NULL-0, THE COMPOSITION-LAW CONTROL, ADDED AT REPAIR AND RUN FIRST. Feed the pipeline a
    synthetic two-hop chain in which both hops cost exactly 2^l (in time and in store). The
    correct composed answer is l + 1. The law this record previously used - additive logs -
    returns 2l. If the pipeline returns 2l, or anything other than l + 1 within rounding, its
    composition law is wrong and NO number from any other arm is reportable. This control exists
    because the four original controls were all blind to the error: NULL-1 below is satisfied by
    both laws, and NULL-3's expected value was EXACTLY FORCED by the wrong law.
    NULL-1, THE ZERO-COST REDUCTION: run the identical pipeline on a chain in which every hop is
    declared to cost the simulator nothing beyond t_A and to store nothing. The memory ceiling
    MUST come back 'no ceiling' and the composed log2 m_B MUST come back at the declared floor.
    DECLARED LIMITATION: this control cannot distinguish a correct composition law from an
    incorrect one, which is why NULL-0 exists.
    NULL-2, THE FORCED-VALUE DERIVATION, run before any evaluation (KN-TECH-1a5b7e obligation
    4). Two parts, and the first is forced. (i) IF the transcribed simulator is the archetypal
    list-based one, then log2 m_B = log2 q_RO + O(1) is entailed by the transcription and is NOT
    a discovery; it is derived here in advance and reported as forced. (ii) The NON-forced part,
    which is the real estimand: whether the primary text states any bound on m_B, and whether a
    memory-tight simulator is admissible for the SFO chain. Both can come out either way.
    NULL-3, THE SENSITIVITY DEMONSTRATION with a named comparator and a threshold derived under
    the CORRECTED law. Take the transcribed chain and multiply ONE hop's store by 2^10, holding
    everything else fixed. The comparator is the unmodified transcribed chain. THE EXPECTED
    VALUE IS NOT UNCONDITIONALLY 10.0 BITS - that was the artefact of the discarded additive
    law. Under log-sum-exp the movement is log2((S - 2^{m_j} + 2^{m_j+10}) / S) with
    S = sum_i 2^{m_i}, so: it equals 10.0 within rounding IF AND ONLY IF hop j dominates the
    chain before inflation (2^{m_j} >= S - 2^{m_j} by a margin exceeding the rounding
    tolerance); it is strictly less than 10.0 otherwise, and tends to
    log2(1 + (2^10 - 1) * 2^{m_j} / S) in general. THE REGIME MUST BE DECLARED BEFORE THE RUN:
    identify the dominating hop from the transcription, state whether j is it, and state the
    predicted movement to two decimals accordingly. Also run x2^-10, x2^-5, x2^0, x2^5, x2^10
    and REPORT WHETHER THE STATISTIC IS MONOTONE, because exhibiting two ends does not exhibit
    a direction.
    NULL-4, THE ADVANTAGE-COORDINATE INVARIANCE CHECK: every manipulation in NULL-3 must leave
    the ADVANTAGE-measure bit security bitwise unchanged. If it moves, the pipeline is mixing
    coordinates and the framing is void.
    CAN THIS NULL FAIL: yes, on five independent routes. NULL-0 is a hard arithmetic
    discriminator between two named laws, one of which this record previously used.
