  assumptions:
    - >-
      The transcription records the game chain hop by hop, not only the final inequality. A
      final inequality alone cannot be decomposed into per-hop store sizes.
    - >-
      Stores persist along the chain, so the composed store is the log-sum-exp of the per-hop
      stores. A hop that provably releases its store before the next begins is flagged and
      excluded from the sum; a hybrid over N instances multiplies rather than adds and must be
      flagged.
    - >-
      The physical memory ladder in STAGE 3 is a set of declared assumptions, each labelled, and
      not a fact about the world. No single 'realistic memory' figure is asserted.
    - >-
      No LWE hardness estimate is produced or re-derived; the hardness figure enters as a given
      symbol. In particular 149.8 / 212.6 / 266.8 are beyond-core-SVP cryptanalysis outputs and
      enter only as given inputs.
    - >-
      Whether a memory-tight simulator EXISTS for the SFO chain is the open question, not an
      assumption in either direction.
  proof_search_map:
    bottleneck: >-
      The step at which the ROM simulator's data structure is specified. Everything this record
      measures is fixed there, and it is also the exact step the published memory-tight
      technique replaces (regenerate the transcript from a PRF instead of storing it). Whether
      that replacement is available for a SALTED FO chain is the bottleneck's live question.
    baseline_embedding:
      parameter_slice: >-
        The regime in which the transcribed simulator stores O(1) records per hop - i.e. a
        memory-tight instantiation. There this record must report no ceiling and must reproduce
        the published accounting exactly. That is the old-method boundary.
      reproduction_check: >-
        REPAIRED AT 2026-08-24, and this is BLOCKING-1 in this record. The inherited gate
        formerly read 'recompute 149.8 / 212.6 / 266.8 at the published inputs from the
        transcribed bound'. THAT GATE IS WITHDRAWN AS A CATEGORY ERROR: the CFRG
        security-considerations draft, re-read verbatim this session, attributes those three
        figures to the 'beyond-core-SVP' methodology, i.e. to LWE cryptanalysis of the FrodoKEM
        instances, and they are therefore not outputs of any FO/SFO reduction bound. A pipeline
        that reproduced them from the transcribed bound would be wrong, and the discrepancy such
        a gate would emit would be an artefact.
        THE REPAIRED GATE HAS TWO PARTS. (i) REDUCTION ARM: the transcribed bound, evaluated at
        the paper's OWN stated inputs, must reproduce the paper's OWN stated IND-CCA (ROM) bit
        figure per parameter set. THE NUMERIC TARGET IS DELIBERATELY LEFT UNFILLED HERE: it is a
        required BATCH-001 transcription output (the red-team screen states it is eprint
        2025/1861 Table 4 and gives values, but this agent has not read the table and will not
