    (iv) That the work-factor movement exceeds 1.0 bit somewhere in the covered region: 0.5.
    (v) That the memory ceiling of claim (C) lands inside the region the category claim covers
    and is not already stated anywhere: 0.65 - this is the part I would defend longest, because
    a store of one record per hash query at query counts near the security level is arithmetic,
