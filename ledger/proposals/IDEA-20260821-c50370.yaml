    - >-
      Claim tier SPLIT: crypto tier for the arithmetic and the symbolic decomposition; nothing
      above toy tier for any reading about FrodoKEM's actual security.
    - >-
      The concept of charging a reduction's memory is PUBLISHED and is not claimed here. Any
      write-up presenting it as a new observation misrepresents this record.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Log-sum-exp hop composition. CORRECTED AT REPAIR - the previous additive-log form was
        mathematically wrong.) FOR EACH sequential game hop i in the transcribed chain with
        resource 2^{r_i} (time in gates, or store in records), the composed resource of the
        chain of H hops is 2^R with R = log2(sum_i 2^{r_i}), so that
        max_i r_i <= R <= max_i r_i + log2 H. Sequential composition adds resources in LINEAR
        coordinates; it does NOT add logarithms. FOR ALL hybrid hops over N instances the
        composition is multiplicative in N and must be flagged rather than summed.
      rigorous_support: >-
        Elementary and exact: sequential composition of algorithms adds running times, and
        persistent stores add sizes; log of a sum of at most H non-negative terms lies between
        the log of the maximum and log H plus the log of the maximum. WORKED COUNTEREXAMPLE TO
        THE DISCARDED LAW, recorded so it cannot recur: two hops each costing 2^40 compose to
        2^41, i.e. R = 41, whereas the discarded additive-log law returns 80. The HEURISTIC half
        is that no hop of the transcribed chain hides a hybrid, a rewinding, or a non-black-box
        step whose cost is not a function of the adversary's query counts, and that stores
        persist rather than being released between hops - neither of which can be known before
        the chain is read.
      validation_plan: >-
        (i) Run NULL-0 before anything else: the synthetic two-hop equal-cost chain, correct
        answer l + 1, discarded-law answer 2l, at three values of l. (ii) Audit hop by hop
        against the transcribed text, classifying each hop as sequential, hybrid, rewinding or
        reprogramming, and report the counts and the dominating hop. (iii) Numerical cross-check
        against the end-to-end simulator description where the primary text supplies one: the
        discrepancy from the per-hop log-sum-exp must be at most the derived log2 H, and its
        measured value is reported. Sampled parameters recorded: chain length H, classification
        counts, dominating hop index, discrepancy in bits. TRANSFER ASSUMPTION: classical ROM
        additivity is NOT assumed to transfer to a QROM arm, where the composition must be
        re-derived or the arm declared undefinable.
    - id: H2
      statement: >-
        (Store irreducibility on the TRANSCRIBED chain only. SUBSTANTIALLY WEAKENED AT REPAIR.)
        FOR ALL evaluation points in the declared region, the simulator AS DESCRIBED IN THE
        TRANSCRIBED TEXT holds at least one record per distinct random-oracle query, in the RAM
        model with unit-cost probes. NO CLAIM IS MADE that this is irreducible: a different
        simulator for the same theorem may store asymptotically less.
      rigorous_support: >-
        The rigorous half is the structure of the FO decapsulation simulation as usually
        written: without the secret key, the simulator recognises a queried ciphertext among
        re-encryptions of recorded oracle queries, which requires recording them.
        WITHDRAWN AT REPAIR: the previous version of this field invoked the omega(q)-bit lower
        bound for exact membership testing as evidence that 'the store cannot be compressed away
        by cleverness alone'. That inference is WRONG in this setting and is retracted -
        Bhattacharyya (eprint 2020/075, abstract read) obtains memory-tight FO reductions
        precisely by regenerating oracle answers rather than storing them, and the membership
        lower bound does not apply to a simulator that recomputes a transcript from a short key.
        WHAT REMAINS HEURISTIC is the unit-cost RAM model and the identification of the
        transcribed simulator with the one the published accounting refers to.
      validation_plan: >-
        (i) The decisive test is STAGE 4 itself, and it is adversarial to this assumption:
        attempt to instantiate Bhattacharyya's RO-simulation technique on the transcribed SFO
        chain hop by hop, and report either a memory-tight instantiation - which FALSIFIES the
        interesting reading of H2 - or the first hop at which it fails, with the reason. The
        specific candidate obstruction to look for is that the SFO salt is sampled by the
        encapsulator and is not a function of the message, so a PRF-regenerated transcript may
        not reproduce it; this is a hypothesis to test against the text, not a finding.
        (ii) Implement the transcribed simulator's decapsulation-answering step at TOY
        FrodoKEM-shaped parameters, measure probes and records per query as a function of q_RO
        over a declared ladder, and report the fitted exponent with its confidence interval and
        its discrepancy from the transcribed prediction. Tail check: the largest q_RO reached
        must show the predicted growth and not a plateau; a plateau is reported, not fitted
        around. (iii) Record the toy parameters, the machine, and the transfer assumption:
        TOY SCALE NEVER SPEAKS FOR THE FIPS-SIZED PARAMETER SETS, and measured constants bound
        only orders of magnitude in the declared cost model.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED, AND THE REDUCTION-TIME EXPONENT IS WITHDRAWN. The previous
      revision claimed a reduction time exponent 'of order a + b for q_D = 2^a and q_G = 2^b'.
      That is withdrawn: per the red-team screen, the primary text states t_B and
      Glabush-Hovelmanns-Stebila state Time(B) = Time(A) + O(q_D), i.e. an exponent of order a,
      not a + b, and it is stated rather than hidden. This record makes no time-exponent claim.
    memory_exponent: >-
      The reduction's store on the TRANSCRIBED chain: log2 m_B of order c for q_RO = 2^c, if the
      transcribed simulator is the archetypal list-based one - a value NULL-2(i) declares FORCED
      by the transcription rather than discovered. Against a published accounting that, per the
      screen, discloses that it ignores the reduction's overhead. THE HONEST STATEMENT OF THE
      DELTA IS THEREFORE: not 'c versus 0' but 'c versus a disclosed omission', and the open
      quantity is whether c is reducible to O(1) on the SFO chain by the published memory-tight
      technique.
    best_known: >-
      The incumbent is external and strong: Auerbach et al. (CRYPTO 2017) for the notion, and
      Bhattacharyya (PKC 2020, eprint 2020/075, abstract read this session) for memory-tight
      reductions covering HHK-family FO variants including QFO_m^perp, withstanding correctness
      errors and stated to be applicable to lattice-based KEM candidates. Within this
      repository there is no incumbent: no ledger record accounts for any reduction's memory.
      The repository-relative gap is real; the conceptual gap is not, and is not claimed.
    hidden_overhead: >-
      The cost model hides everything: a crossing point is a crossing point only under one
      record size, one machine model and one memory ladder, none of which is a fact. Disclosed,
      not absorbed. A second hidden overhead is that the whole analysis is of ONE transcribed
      proof: because the theorem's quantifier is EXISTS B, a different proof of the same theorem
      could have any store, so nothing here bounds what is PROVABLE about FrodoKEM. A third: the
      withdrawal of claims (A) and (B) rests on quotations this agent did not verify.
    tradeoff_note: >-
      WEAKENED AT REPAIR. The previous revision asserted that the reduction's memory admits NO
      time-memory tradeoff, on the ground that the simulator's table holds the ADVERSARY'S
      queries and cannot be regenerated. That asserted too much: the memory-tight literature
      trades store for recomputation exactly here, by regenerating oracle answers from a short
      key rather than storing them, at a time cost. The honest statement is that a tradeoff of
      that shape is the published technique, that its applicability to SFO is unknown to this
      record, and that STAGE 4 is the test. Parallelization is not relevant: the reduction is a
      bookkeeping wrapper, not a search.
  dominated_by: >-
    n/a (no attack, cost or complexity result about any adversary is claimed, so no Pareto
    frontier row across time, memory and data/queries applies; writing 'null' would be a
    fabrication under AGENTS.md rule 5). PARETO-SENSE DOMINATION ON THE PROOF-SIDE AXIS IS
    ANOTHER MATTER AND IS ACKNOWLEDGED EXPLICITLY: Bhattacharyya, eprint 2020/075, DOMINATES
    this record's original conceptual contribution - it defines and achieves memory-tight FO
    reductions, which is strictly stronger than observing that a particular FO reduction is not
    memory-tight - and Auerbach et al. (CRYPTO 2017) dominates the notion itself. Also checked:
    the Glabush-Hovelmanns-Stebila multi-target attack figures are attack-side and on a
    different axis; GOAL-MLKEM-004's memory-charged sieve costs are attack-side for a different
    scheme. What is NOT dominated, as far as this session could check, is the narrow question of
    whether the published technique reaches the 2025 SALTED FO transform.
  sota_delta: >-
    No attack; a narrow proof-side accounting question only, and materially smaller than this
    record originally claimed. Repository-relative: zero records account for any reduction's
    memory, zero per-hop resource vectors exist, so this would be the first such accounting and
    the first application of the program's own memory-charging standard (GOAL-MLKEM-004) to a
    proof rather than an attack. Externally the delta is SMALL AND IS STATED AS SMALL: the
    notion is published (CRYPTO 2017), memory-tight FO reductions are published (PKC 2020,
    abstract read), and the claim that the published accounting hides a time cost is WITHDRAWN
    because the screen shows the omission is disclosed and the measure already normalizes by
    time. The residual delta is exactly two documentary/technical questions: does FrodoKEM's own
    statement bound m_B, and does the published memory-tight technique instantiate on SFO. That
    is worth an afternoon, not a campaign.
