      NON-forced facts - does the text bound m_B, and what is each hop's index key. (3) Run the
      nearby-object control on the published memory-tight QFO_m^perp chain; the store must not
      grow with q_RO. Only then run STAGE 3's crossings and STAGE 4's instantiation attempt.
      THIS DISCRIMINATES because the two explanations - 'the memory coordinate of the FrodoKEM
      SFO chain is closable by the published technique' versus 'it is not, and here is the hop
      where it fails' - predict different STAGE 4 outputs on the same transcription, and because
      NULL-0 and the nearby-object control pin the instrument before the signal arm is read.
