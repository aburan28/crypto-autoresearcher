idea:
  id: IDEA-20260821-c50370
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    A reduction can be TIGHT IN ADVANTAGE and LOSSY IN TIME AND MEMORY, and the published
    FrodoKEM accounting charges neither: re-express the transcribed bound in (advantage, time,
    memory) coordinates, track the simulator's own resource vector through every game hop, and
    report (a) the bit-security movement in the work-factor measure log2(t/Adv) and (b) the
    query count above which the reduction's OWN memory requirement exceeds any physically
    realizable store, which is an unstated ceiling on the region the ROM proof certifies.
  class: representation
  claim: >-
    (A) THE COORDINATE CHANGE. A concrete security statement is a claim about a triple
    (advantage, running time, memory) of the reduction B given an adversary A. Published
    KEM accounting projects that triple onto the ADVANTAGE alone and calls the result 'tight'
    or 'non-tight'. This record tracks the discarded coordinates. (B) THE CLAIM ABOUT TIME. In
    the classical ROM analysis of an FO-style transform, the simulator must answer each
    decapsulation query without the secret key, which it does by searching or table-indexing
    the record of the adversary's hash queries and re-encrypting candidates. Its running time
    is therefore t_B = t_A + f(q_D, q_G) * c_enc for a function f determined by the
    transcribed proof and a per-encryption cost c_enc, and its memory is m_B = g(q_G) records.
    The claim: over the query region a category claim is supposed to cover, the term
    log2(f(q_D, q_G) * c_enc / t_A) is STRICTLY POSITIVE and is charged nowhere in the
    published bit-security figures 149.8 / 212.6 / 266.8. Under a bit-security measure that
    normalizes advantage by running time - the measure standard for search problems - a
    reduction tight in advantage still moves the figure by exactly that term, and its size is
    computable from the transcription. (C) THE CLAIM ABOUT MEMORY, WHICH IS THE SHARPER ONE.
    The reduction stores a record per hash query. At q_G near the claimed security level the
    simulator's own store is of the order of the query count, i.e. astronomically beyond any
    realizable memory. A statement of the form 'for all A making q_G queries there EXISTS a
    reduction B' is mathematically unaffected by this - B need not be buildable - but the
    concrete-security READING of it, in which the bound's right-hand side is compared against
    an assumed hardness figure for LWE, silently assumes a reduction whose resources are never
    charged. This program already refuses to cost a lattice sieve without charging memory
    (GOAL-MLKEM-004). The claim is that the same accounting standard, applied to the
    REDUCTION rather than to the attack, produces a named and previously unstated region
    boundary. (D) WHAT IS NOT CLAIMED. No attack. No break. No assertion that FrodoKEM is
    insecure or that any parameter should change. A reduction's resource cost is a property of
    a PROOF; it says nothing about what an adversary can do, and an expensive reduction is not
    a weak scheme. No claim that the work-factor measure is the RIGHT measure - the deliverable
    is the movement between two named measures, with both reported, so the reader chooses.
  mechanism: >-
    STAGE 0 (GATE, inherited): requires the GOAL-FRODO-002 BATCH-001 transcription, and
    requires it to include what the published proof says about the SIMULATOR, not only about
    the advantage. If the primary text states the reduction's running time (many FO analyses
    do, as 't_B approximately equals t_A plus ...'), transcribe it verbatim; if it does not,
    record THAT as the finding - a bound whose reduction's cost is not stated cannot be
    charged, and the absence is itself the answer to the lane's question about uncharged
    non-tightness. STAGE 1: build the resource vector per game hop. For each hop of the
    transcribed chain, record the triple (delta log2 Adv, delta log2 t, delta log2 m) as a
    function of the adversary's parameters. Hops that only lose advantage contribute to the
    first coordinate; hops that install a simulator contribute to the second and third. STAGE
    2: sum the vector along the chain and emit two scalars per evaluation point: the
    ADVANTAGE-MEASURE bit security (the published convention) and the WORK-FACTOR bit security
    log2(t/Adv). Their difference is the deliverable. STAGE 3: compute the memory ceiling.
    Solve m_B(q_G) = M_phys for a declared ladder of physical memory budgets, each stated as an
    assumption rather than as a fact, and report the q_G at which the simulator's store exceeds
    each. Report this as a REGION BOUNDARY of the concrete reading, explicitly labelled as not
    a mathematical restriction on the theorem. STAGE 4: run the same pipeline on the QROM
    statement, which the retrieved CFRG draft describes as non-tight, so the two models can be
    compared in the same coordinates. STAGE 5: controls, below, all in the same invocation.
  novelty_status: unverified
  novelty_screen:
    method: >-
      THE crypto-kb MCP RETRIEVAL INDEX IS UNAVAILABLE THIS SESSION (in-memory Qdrant; answers
      nothing), so no `kb` provenance appears. Instrument: Grep tool (ripgrep), the
      pre-extracted lane inventory, WebSearch/WebFetch. Actual searches run 2026-08-21 from
      /home/user/crypto-autoresearcher, with counts:
      Grep 'Micciancio-Walter|Micciancio and Walter|advantage/time|advantage per unit time|reduction runtime|runtime of the reduction'
      over the whole repository -> content matches ONLY in research_digest chunks/manifest and
      in knowledge/literature/KN-LIT-6702.md, whose hit is 'slide reduction with the DBKZ
      algorithm of Micciancio and Walter [Eurocrypt 16]' - a lattice-reduction citation,
      entirely unrelated to bit-security definitions. NO LEDGER RECORD IN THIS REPOSITORY USES
      A WORK-FACTOR OR ADVANTAGE-PER-TIME BIT-SECURITY MEASURE.
      Grep 'running time of the reduction|reduction.s running time|simulator|work factor|work-factor|Micciancio|bit security definition'
      in ledger/proposals/ -> 95 files, but inspection shows the hits are carried by the
      generic word 'simulator'; recorded as NON-DISCRIMINATING rather than as prior art, and the
      narrower grep above is the one that carries the conclusion.
      Grep 'eFrodoKEM|ephemeral variant' repo-wide -> 2 files, both the lane's own framing records.
      Grep 'FrodoKEM|Frodo-640|eFrodoKEM' in knowledge/ -> 7 files, none stating a FrodoKEM bound.
      Grep 'multi-target|multi-user|multi-ciphertext' in ledger/proposals/ -> 434 occurrences,
      122 files.
      READ IN FULL: the 8-line lane inventory, RQ-FRODO-a2dbe2, GOAL-FRODO-002, the exemplar
      IDEA-20260816-b336a3, docs/inventor-protocol.md (all 8 sections),
      docs/target-result-profile.md, knowledge/techniques/KN-TECH-1a5b7e.md, the GOAL-MLKEM-005
      census.md.
      WEB, fetched and read: https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/
      ; https://cic.iacr.org/p/3/1/20 ; https://eprint.iacr.org/2025/1861 (abstract page) ;
      https://datatracker.ietf.org/doc/draft-smyslov-lamps-frodokem-certificates/ . WebSearch
      queries run: 'Fujisaki-Okamoto transform tightness reduction running time loss bit
      security Micciancio Walter'; 'Micciancio Walter "On the bit security of cryptographic
      primitives" Eurocrypt 2018 advantage running time definition'; 'FrodoKEM 2025
      specification per-ciphertext salt IND-CCA security proof eFrodoKEM'; '"salted
      Fujisaki-Okamoto" SFO transform multi-target tight security proof salt'. ACQUISITION
      FAILURES, recorded as such and never as evidence: the ePrint PDFs for 2025/1861 and for
      the Glabush-Hövelmanns-Stebila preprint both returned unreadable compressed-stream
      extractions. Micciancio-Walter (eprint 2018/077) and Hofheinz-Hövelmanns-Kiltz (eprint
      2017/604) were NOT OPENED - only search-result summaries were seen - and are therefore
      cited as `recalled`, which is why this record's novelty_status is `unverified`.
    results: >-
      Inside the repository: none of the eight existing lane proposals touches the reduction's
      resources. IDEA-20260816-8596af is the closest and is squarely about the ADVANTAGE
      coordinate - it enumerates constants, lower-order terms and absorbed inequalities dropped
      along a chain of game hops and multiplies them into an 'accumulated amnesty' in bits. A
      running-time or memory term is not a forgiven constant in the advantage: it is a quantity
      that lives in a different coordinate and does not appear in that ledger at all, so
      8596af's procedure cannot find it however carefully it is run. IDEA-20260816-583998
      converts a ROM-to-QROM gap into an integer exponent vector over INPUT VARIABLES of the
      advantage bound - the same coordinate again. IDEA-20260816-d270bc labels dominant additive
      terms of the advantage. IDEA-20260816-7b9457 propagates intervals through the advantage.
      The lane has, collectively, eight ways of reading one coordinate of a three-coordinate
      object. Program-wide, the narrow grep establishes that no record anywhere uses an
      advantage-per-time security measure. Externally: the retrieved CFRG draft states the ROM
      proof is tight and 'a similar (non-tight) proof is given in the QROM', but gives no
      inequality and says nothing about the reduction's own cost; the search summary for the
      FO literature says the ROM reduction 'loses a factor of qG' - an advantage-coordinate
      statement.
    verdict: >-
      UNVERIFIED, and that is the honest label because the two external works this record leans
      on hardest - Micciancio-Walter's bit-security definition and the FO analyses that state
      simulator running times - were NOT OPENED this session. Charging a reduction's running
      time is a known and long-discussed idea in the literature (that is precisely why
      Micciancio-Walter exists), so nothing here is claimed as a new concept. What is claimed as
      new RELATIVE TO THIS REPOSITORY is: the coordinate change applied to FrodoKEM's
      transcribed bound, the per-hop resource vector as a tracked object, and the memory-ceiling
      computation on the SIMULATOR, which the program already performs on sieves but has never
      performed on a reduction. A reviewer with access should check first whether the FrodoKEM
      primary text already states t_B, in which case part (B) collapses to arithmetic on a
      published quantity - still useful, no longer a gap.
  object_first_candidate:
    tracked_object: >-
      The reduction's RESOURCE VECTOR: the triple (log2 Adv_B, log2 t_B, log2 m_B) as a
      function of the adversary's (t_A, q_G, q_H, q_D), followed hop by hop along the
      transcribed game chain instead of being collapsed to its first coordinate at the end.
    lossiness: >-
      GENUINELY LOSSY, in a different direction from the standard projection. The standard
      accounting projects the triple onto coordinate 1. This object keeps all three coordinates
      but discards their CONSTANTS and their machine model: it retains only base-2 logarithms
      up to additive O(1), so a reduction costing 3 x 2^40 hash-table probes and one costing
      2^40 probes are the same object, and the difference between a RAM probe and a cache miss
      is gone. That discard is compatible with the operation the target performs - sequential
      composition of game hops - because in log coordinates composition is ADDITION, and
      additive constants accumulate additively and stay separable from the exponents. The
      retained part therefore propagates deterministically hop to hop. It is NOT a change of
      coordinates in the inventor-protocol section 2 sense: the numbers cannot be reconstructed
      (the constants are gone), and the standard accounting is a strict further projection of
      this object, so this one strictly refines it rather than renaming it.
    propagation: >-
      One game hop = one vector addition. The law: an advantage-only hop adds
      (delta, 0, 0); a hop that installs a simulator adds (delta, log2 f(q), log2 g(q)); a hop
      that reprograms an oracle adds a term in coordinate 2 for the bookkeeping and a term in
      coordinate 3 for the table. The whole chain is a sum, and the two reported scalars are
      linear functionals of that sum.
    survival_score: >-
      Survives the entire classical ROM chain, which is what makes it worth tracking, and
      dissolves at the first hop whose simulator cost is not a function of the adversary's
      query counts - rewinding, non-uniform advice, or a QROM hop whose cost is stated only
      asymptotically. Naming that first hop is a required output: it is a reusable fact about
      the proof that no run of this record can avoid producing, whatever the numbers say.
  null_object_control: >-
    FOUR controls, each able to fail, all in the same invocation as the signal arm.
    NULL-1, THE ZERO-COST REDUCTION: run the identical pipeline on a game chain in which every
    hop is declared to cost the simulator nothing beyond t_A. The work-factor movement MUST come
    back exactly 0.000 bits and the memory ceiling MUST come back 'no ceiling'. If the pipeline
    reports a positive movement on a chain with no simulator cost in it, the movement it reports
    on the real chain is manufactured by the pipeline. THIS IS THE CONTROL THAT CAN MOST EASILY
    FAIL, because a coordinate-change tool that quietly adds a per-hop constant will fail it.
    NULL-2, THE FORCED-VALUE DERIVATION, run before any evaluation (KN-TECH-1a5b7e obligation 4):
    derive analytically what the work-factor movement MUST be when f(q_D, q_G) * c_enc <= t_A. It
    is zero by definition of the measure, and the region where that inequality holds is
    computable in advance. If the signal arm reports a movement inside that region, the arm is
    wrong; if the ENTIRE deployment-plausible region lies inside it, the record's claim (B) is
    refuted before any table is produced - and that derivation costs one line, not a run.
    NULL-3, THE SENSITIVITY DEMONSTRATION with a NAMED COMPARATOR and a NUMERIC THRESHOLD
    declared before the run (KN-TECH-1a5b7e obligation 3): take the transcribed chain and
    multiply one hop's simulator cost by 2^10, holding everything else fixed. The comparator is
    the unmodified transcribed chain - the arm the null is about, not whichever arm separates
    best - and the movement must increase by 10.0 bits, exactly, in the work-factor measure.
    Report the dynamic range by also running x 2^-10, and run at least three interior points
    (x2^-10, x2^-5, x2^0, x2^5, x2^10) and REPORT WHETHER THE STATISTIC IS MONOTONE across them,
    because exhibiting two ends does not exhibit a direction.
    NULL-4, THE ADVANTAGE-COORDINATE INVARIANCE CHECK: every manipulation in NULL-3 must leave
    the ADVANTAGE-measure bit security bitwise unchanged. If it moves, the pipeline is mixing
    coordinates and the whole framing is void.
    CAN THIS NULL FAIL: yes, on four independent routes, and NULL-1 and NULL-4 in particular are
    invariance tests whose expected value is derived rather than measured.
  discriminated_from:
    - >-
      IDEA-20260816-8596af enumerates every constant, lower-order term and absorbed inequality
      forgiven along a chain of game hops and multiplies them into a bits-of-amnesty figure.
      That is an audit of coordinate 1 (advantage). A simulator's running time and store are
      not forgiven constants of the advantage - they are absent from that ledger by
      construction, and a perfect execution of 8596af would report zero for them. The two
      records are complementary and use the same transcribed chain.
    - >-
      IDEA-20260816-583998 extracts the exponent of every INPUT VARIABLE in each of ROM and
      QROM and subtracts, converting the gap into a bit movement. Its exponents are exponents of
      the advantage bound. This record's exponents are exponents of the reduction's own cost,
      which do not appear in 583998's vector at all. Running both on the same chain yields two
      different numbers and the difference is meaningful.
    - >-
      IDEA-20260816-d270bc labels which additive term of the advantage bound dominates over a
      grid; IDEA-20260816-7b9457 propagates an interval through the advantage bound. Both are
      coordinate-1 instruments.
    - >-
      IDEA-20260816-72e5e5 certifies the evaluation pipeline as an instrument using unstructured
      FrodoKEM as a free control. That certification is about the pipeline reading a bound
      correctly; it has nothing to say about whether the bound's own reduction is affordable,
      and a fully certified pipeline reports the same uncharged figure.
    - >-
      GOAL-MLKEM-004 charges memory in sieve cost models. That is memory of an ATTACK. This
      record charges memory of a REDUCTION. The accounting standard is deliberately borrowed
      and the borrowing is declared; the object is different and the conclusion is a statement
      about a proof rather than about an attack cost.
    - >-
      IDEA-20260821-c05d5f and IDEA-20260821-c2242b (this batch) both concern the INPUTS to the
      bound - where their values come from, and which quantifier they sit under. This record
      concerns the reduction that the bound is a statement about, and would be run even if every
      input were perfectly sourced and perfectly quantified.
  citations:
    - ref: 'https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/ (draft-longa-cfrg-frodokem-security-considerations-00)'
      provenance: retrieved
      claim: >-
        Verbatim from the fetched rendering: 'security proof that shows that the IND-CCA2
        security of FrodoKEM is tied to the security of concrete instances of the decisional
        normal-form LWE problem in the classical ROM. A similar (non-tight) proof is given in
        the QROM'; and 'security estimates of 149.8 bits for (e)FrodoKEM-640, 212.6 bits for
        (e)FrodoKEM-976 and 266.8 bits for (e)FrodoKEM-1344'. The fetch also reported that the
        document contains no explicit inequality and no concrete oracle-query bounds - which is
        the specific documentary fact this record's STAGE 0 turns into a possible finding.
      verified_by: idea-generator@2026-08-21
    - ref: 'https://eprint.iacr.org/2025/1861 (FrodoKEM: A CCA-Secure LWE KEM; Glabush, Longa, Naehrig, Peikert, Stebila, Virdia; 2025-10-08; IACR CiC 2(3):25)'
      provenance: retrieved
      claim: >-
        Abstract read: single-target IND-CCA via an FO variant on FrodoPKE; tight multi-target
        security via the Salted FO transform. The abstract says nothing about the reduction's
        running time or memory. PDF fetch FAILED to extract theorem text, so this session has
        NOT established whether the paper states t_B; establishing that is STAGE 0.
      verified_by: idea-generator@2026-08-21
    - ref: 'Micciancio, Walter, On the Bit Security of Cryptographic Primitives, EUROCRYPT 2018 (eprint 2018/077)'
      provenance: recalled
      claim: >-
        A bit-security definition intended to make 'k-bit security' mean 'as hard as brute
        force on a k-bit key', which for SEARCH games coincides with the conventional advantage
        reading and for DECISION games differs from the naive generalization. A WebSearch on
        2026-08-21 returned the title, authors, venue and an ePrint URL consistent with this
        recollection, together with summary sentences to that effect; THE PAPER WAS NOT OPENED.
        This record uses only the uncontroversial normalization log2(t/Adv) and does NOT depend
        on the decision-game subtleties, but a reviewer must check which normalization the
        FrodoKEM figures were computed under before any movement is attributed.
      verified_by: null
    - ref: 'Hofheinz, Hövelmanns, Kiltz, A Modular Analysis of the Fujisaki-Okamoto Transformation, TCC 2017 (eprint 2017/604)'
      provenance: recalled
      claim: >-
        The T / U modular decomposition of FO and a ROM loss linear in the number of
        random-oracle queries; FO analyses of this family typically state the reduction's
        running time explicitly as t_B approximately t_A plus a term in the query counts. A
        WebSearch on 2026-08-21 returned the title, venue and ePrint URL and a summary sentence
        that the ROM reduction 'loses a factor of qG'. NOT OPENED. The specific form of f(q_D,
        q_G) is exactly what must be transcribed rather than recalled.
      verified_by: null
    - ref: 'Hövelmanns, Hülsing, Majenz, Failing Gracefully: Decryption Failures and the Fujisaki-Okamoto Transform, ASIACRYPT 2022 (eprint 2022/365)'
      provenance: recalled
      claim: >-
        QROM treatment of decryption failures in FO, in which failures are handled by a
        reduction solving a search task and a Grover-style bound results, with implicit
        rejection needed for a reasonable QROM bound. Seen only as a WebSearch result summary on
        2026-08-21; NOT OPENED. Relevant because a Grover-style hop's simulator cost is exactly
        the kind of hop STAGE 4 must place in the resource vector, and because it is where the
        object is most likely to dissolve.
      verified_by: null
    - ref: 'GOAL-MLKEM-004'
      provenance: internal
      claim: >-
        The program's existing commitment to charging memory in sieve cost models, borrowed here
        as an accounting standard and applied to a reduction rather than to an attack. Cited to
        make the borrowing explicit; NO result of that goal is scored as evidence here, and no
        sieve cost is derived, per GOAL-FRODO-002.non_duplication[1].
      verified_by: idea-generator@2026-08-21
  assumptions:
    - >-
      The transcription records the game chain hop by hop, not only the final inequality. A
      final inequality alone cannot be decomposed into per-hop resource vectors.
    - >-
      Composition of hops is sequential and the resource costs add. Any hop with a hybrid
      argument over many instances multiplies rather than adds and must be flagged.
    - >-
      c_enc, the cost of one FrodoPKE encryption in the simulator's unit, is taken from a
      declared cost model stated as an assumption. The published FrodoKEM implementation timings
      (0.97 ms at level 1 on a server-class processor, per the retrieved abstract) are cited as
      a SANITY ANCHOR ONLY and are not converted into a bit figure without the conversion being
      declared as an assumption with its machine model.
    - >-
      The physical memory ladder in STAGE 3 is a set of declared assumptions, each labelled, and
      not a fact about the world. No single 'realistic memory' figure is asserted.
    - >-
      No LWE hardness estimate is produced or re-derived; the hardness figure enters as a given
      symbol.
  proof_search_map:
    bottleneck: >-
      The final projection step, where a three-coordinate statement about a reduction is
      collapsed to a one-coordinate 'tight / non-tight' verdict before the bit figure is
      computed. Everything this record measures is destroyed at that step, and nothing
      downstream of it can recover the discarded coordinates.
    baseline_embedding:
      parameter_slice: >-
        The region where f(q_D, q_G) * c_enc <= t_A. There the work-factor measure and the
        advantage measure coincide exactly and this record must reproduce the published figures
        term for term. That region is the old-method boundary, and it is computable in closed
        form before any evaluation.
      reproduction_check: >-
        Symbolic identity inside that region, plus the inherited numeric gate: recompute
        149.8 / 212.6 / 266.8 at the published inputs from the transcribed bound. A frozen
        fixture holds the three figures, the inputs, and the tolerance.
    observation_collision:
      observable: >-
        The scalar 'work-factor bit security' log2(t/Adv) at an evaluation point.
      distinct_preimage_search: >-
        Two reductions with the SAME work-factor scalar but opposite readings are easy to
        construct and the search must be run rather than assumed: one that loses 2^40 in
        advantage and nothing in time, and one that is advantage-tight but pays 2^40 in time.
        They collide on the scalar. THE COLLISION IS REAL AND IT IS A DIRECT FALSIFIER OF
        IDENTIFIABILITY for the scalar alone, so the deliverable must be the VECTOR with the
        scalar reported beside it, never the scalar alone. Recording this before the run is the
        point of the audit; discovering it afterwards would be the failure.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Preserve the full (Adv, t, m) triple through the recursion instead of the advantage
          alone, because the triple is what composes and the scalar is not.
        predicted_gain: >-
          Makes the memory ceiling of STAGE 3 expressible at all - it is invisible in the
          advantage coordinate - and makes ROM and QROM comparable in matched coordinates. No
          attack exponent is claimed; the gain is in what the accounting can express.
      - transform: representation_reduction
        proposed_object: >-
          Move the bound into log-resource coordinates where hop composition is vector addition,
          so that per-hop responsibilities separate cleanly.
        predicted_gain: >-
          Separable encoding, completeness, soundness and cost-loss obligations, each of which
          can fail visibly and separately.
    quantifier_order: >-
      The published form is: FORALL A with resources R, EXISTS B such that Adv_A <= g(Adv_B,
      ...). The existential over B is unrestricted in resources. Written with resources bound:
      FORALL A with (t_A, q_G, q_H, q_D), EXISTS B with (t_B, m_B) satisfying t_B <= h(t_A, q),
      m_B <= k(q), such that ... . The audit question is whether the primary text binds t_B and
      m_B at all. If it does not, the existential ranges over reductions of unbounded resources
      and the concrete reading - comparing the right-hand side against an assumed hardness
      figure for a resource-bounded LWE adversary - is comparing quantities under different
      resource quantifiers. Stating that precisely, without asserting it is a defect, is the
      record's principal proof-side output.
    method_ceiling:
      strongest_certifiable_claim: >-
        'Under the transcribed chain and the declared cost model, the reduction's resource
        vector is V, the work-factor bit security differs from the advantage-measure bit
        security by D bits at evaluation point P, and the simulator's store exceeds memory
        budget M at q_G = Q.' The method can NEVER certify that FrodoKEM is weaker than claimed,
        that a better reduction does not exist (a tighter or cheaper reduction may exist and
        would change every number here), or that any adversary gains anything.
      nearby_object_control: >-
        A scheme with a KNOWN resource-cheap reduction in the same coordinates - the natural
        candidate being a hop chain in which the simulator answers decapsulation queries by an
        O(1) table lookup rather than a search. On that object the hoped-for conclusion (a large
        time movement) must FAIL. If the method reports a large movement there too, it has not
        identified the load-bearing structure and is measuring the chain's length rather than
        its cost.
    proof_obligations:
      - claim: The transcribed chain is decomposed hop by hop with each hop's simulator described.
        responsibility: interface
      - claim: Inside the region f * c_enc <= t_A the two measures coincide and the published figures reproduce.
        responsibility: baseline
      - claim: The per-hop resource vector sums correctly along the chain.
        responsibility: correctness
      - claim: The simulator's running time is bounded by the stated f(q_D, q_G).
        responsibility: runtime
      - claim: The simulator's store is bounded by the stated g(q_G).
        responsibility: memory
      - claim: The work-factor movement is strictly positive somewhere in the covered region.
        responsibility: strictness
      - claim: No statement about an adversary, an attack, or FrodoKEM's security appears in the deliverable.
        responsibility: scope
  predictions:
    - metric: >-
        signed difference, in bits, between work-factor bit security log2(t/Adv) and
        advantage-measure bit security, at each declared evaluation point, per parameter set
      direction: different
      minimum_effect: >-
        1.0 bit somewhere in the declared region for the claim to be interesting; exactly 0.0
        everywhere is the clean refutation of claim (B) and is a complete, reportable answer
    - metric: >-
        log2 of the simulator's store g(q_G), in records and in bits, at the query counts the
        category claim covers
      direction: higher
      minimum_effect: >-
        report the value; the interesting threshold is whether it exceeds each declared physical
        memory budget in the ladder, and if it never does, claim (C) is refuted
    - metric: >-
        query count q_G at which the simulator's store crosses each declared memory budget
      direction: different
      minimum_effect: >-
        report all crossings with the budget each is relative to, or 'no crossing in range'
    - metric: >-
        NULL-1 work-factor movement on the zero-cost chain
      direction: different
      minimum_effect: >-
        must be exactly 0.000; any other value voids the run
    - metric: >-
        NULL-3 movement under a 2^10 inflation of one hop's simulator cost
      direction: higher
      minimum_effect: >-
        10.0 bits, exactly, with the monotonicity across five graded points reported
    - metric: >-
        whether the primary text states the reduction's running time at all
      direction: different
      minimum_effect: >-
        a binary answer with the location quoted, or the recorded absence with the search terms
        that established it; the absence is itself a first-class result for this lane
  minimal_test:
    design: >-
      TWO-HOP PILOT, cheap and decisive about the INSTRUMENT before anything decisive about
      FrodoKEM. (1) From the transcription, take only the hops in which a simulator answers
      decapsulation queries - typically one or two - and write their resource vectors. (2) Run
      NULL-2's forced-value derivation on paper first and compute the region where the movement
      must be zero; if the whole deployment-plausible region lies inside it, STOP and report
      claim (B) refuted, at a cost of one afternoon. (3) Otherwise run NULL-1 (zero-cost chain,
      must give 0.000), NULL-4 (advantage coordinate invariant), and NULL-3's five graded points
      with the 10.0-bit threshold declared in advance. (4) Only then evaluate the two scalars
      over the declared grid and compute the STAGE 3 memory crossings. THIS DISCRIMINATES
      because the two explanations - 'the reduction is tight in every coordinate' versus 'it is
      tight in advantage and lossy in time and memory' - predict 0.0 and a computable positive
      value for the same scalar, and because NULL-1 and NULL-4 pin the instrument's floor before
      the signal arm is read. Compute: minutes. Cost is transcription and reading.
    controls:
      - NULL-1 zero-cost chain, same invocation, must return exactly 0.000 bits.
      - NULL-2 forced-value derivation of the zero-movement region, done before any evaluation.
      - >-
        NULL-3 graded sensitivity, comparator named as the unmodified transcribed chain,
        threshold 10.0 bits declared before the run, five graded points, monotonicity reported.
      - NULL-4 advantage-coordinate invariance under NULL-3's manipulations.
      - Baseline embedding at f * c_enc <= t_A, where the measures must coincide.
      - Inherited gating reproduction of the three published bit figures.
      - >-
        Nearby-object control: an O(1)-lookup simulator chain, on which the large-movement
        conclusion must fail.
      - >-
        Cost-model ablation: recompute every figure under two declared c_enc values an order of
        magnitude apart, so a conclusion that depends entirely on the cost model is exposed.
    required_metrics:
      - per-hop resource vector (delta log2 Adv, delta log2 t, delta log2 m) for every hop
      - summed vector and both scalars at every evaluation point
      - the signed difference between the two scalars, with intervals
      - simulator store in records and bits versus q_G, with crossings per declared budget
      - NULL-1, NULL-3 and NULL-4 outcomes with their declared thresholds
      - the identity of the first hop at which the resource vector cannot be defined
      - whether the primary text states t_B and m_B, quoted or recorded absent with search terms
  falsification_conditions:
    - >-
      The work-factor movement is 0.0 bits across the entire covered region (because f * c_enc
      <= t_A there, or because the published proof uses an O(1)-lookup simulator). Claim (B) is
      refuted, the advantage-only accounting is sound in the time measure for FrodoKEM, and that
      is a positive finding to be reported as such.
    - >-
      The simulator's store never exceeds any declared memory budget over the covered region.
      Claim (C) is refuted.
    - >-
      NULL-1 returns anything other than exactly 0.000: the pipeline manufactures movement and
      no signal-arm number is reportable.
    - >-
      NULL-4 shows the advantage coordinate moving under a time-only manipulation: the
      coordinates are mixed and the framing is void.
    - >-
      NULL-3 fails to return 10.0 bits under a 2^10 inflation, or the five graded points are
      non-monotone: the movement cannot be read directionally and no directional claim is made.
    - >-
      The primary text turns out to state t_B and m_B explicitly and to charge them in the
      published figure. Then there is no uncharged cost, the record's premise is wrong, and the
      correct output is the citation that settles it.
    - >-
      The resource vector is undefinable at the first simulator hop (e.g. the cost is stated
      only asymptotically). Then the object dissolves immediately, the survival score is zero,
      and the record reports that rather than substituting an invented constant.
  confounders:
    - >-
      The cost model. c_enc, the unit of t_A, and the machine model are all choices, and a
      movement of a few bits can be manufactured or erased by them. The two-value ablation is
      the mitigation and the movement must be reported with its cost model attached in the same
      sentence.
    - >-
      Measure choice. The work-factor measure is one convention among several; the published
      figures may have been computed under a different one. Reporting BOTH scalars, never the
      difference alone, is what keeps this from becoming a rhetorical trick.
    - >-
      Observation collision, already named in the proof_search_map: the work-factor scalar
      confuses an advantage loss with a time loss. Reporting the vector is mandatory.
    - >-
      A tighter or cheaper reduction may exist and would change every number. Nothing here is a
      property of FrodoKEM; it is a property of the transcribed proof.
    - >-
      The memory ceiling is an argument about physical realizability applied to a mathematical
      existential, and the two are genuinely different things. Presenting the ceiling as a
      restriction on the theorem would be an error; it is a restriction on one READING of it,
      and the deliverable must say which.
    - >-
      Asymptotic hops in the QROM arm may have no well-defined resource vector, silently
      truncating STAGE 4 and making ROM and QROM look more comparable than they are.
  interpretation_limits:
    - >-
      A reduction's cost is a property of a PROOF. It is not an attack, not a weakness, not
      evidence about LWE, and not a reason to change a parameter. RQ-FRODO-a2dbe2.constraints[3]
      binds absolutely.
    - >-
      An expensive reduction does not make a scheme less secure; it makes the proof establish
      less than a cheap one would, under one named measure.
    - >-
      All figures are scoped to the transcribed chain, the declared cost model, the declared
      memory ladder, and the parameter sets evaluated.
    - >-
      The memory ceiling is stated relative to declared budgets which are assumptions, not
      facts, and it constrains a concrete reading rather than the theorem.
    - >-
      Claim tier SPLIT: crypto tier for the arithmetic and the symbolic decomposition; nothing
      above toy tier for any reading about FrodoKEM's actual security.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Additive hop composition.) FOR EACH sequential game hop in the transcribed chain, the
        reduction's log-resources compose additively: log2 t of the composed reduction equals
        the sum of the per-hop log2 t contributions up to an additive O(1) per hop, and likewise
        for log2 m. FOR ALL hybrid hops over N instances, the composition is multiplicative in
        N and must be flagged rather than summed.
      rigorous_support: >-
        The rigorous half is elementary: sequential composition of algorithms adds running times
        exactly, and log of a sum of at most H terms is bounded by log of H times the maximum,
        so additivity in log coordinates is correct up to an additive log2 H. The heuristic half
        is that no hop of the transcribed chain hides a hybrid, a rewinding, or a
        non-black-box step whose cost is not a function of the adversary's query counts - which
        cannot be known before the chain is read.
      validation_plan: >-
        Audit hop by hop against the transcribed text, classifying each hop as sequential,
        hybrid, rewinding, or reprogramming, and report the counts. Then a numerical
        cross-check: compute the composed t_B directly from the end-to-end simulator description
        (where the primary text supplies one) and compare with the per-hop sum; the discrepancy
        must be at most the derived additive log2 H, and its measured value is reported. Sampled
        parameters recorded: the chain length H, the classification counts, and the discrepancy
        in bits. TRANSFER ASSUMPTION: the classical ROM chain's additivity is NOT assumed to
        transfer to the QROM arm, where STAGE 4 must re-derive it or declare the arm undefinable.
    - id: H2
      statement: >-
        (Simulator cost realism.) FOR ALL evaluation points in the declared region, one
        simulated decapsulation query costs the simulator at least one FrodoPKE encryption per
        candidate it tests, and its bookkeeping store holds at least one record per distinct
        hash query, in the RAM model with unit-cost probes.
      rigorous_support: >-
        The rigorous half is the structure of the FO decapsulation simulation itself: without
        the secret key, the simulator's only route to a consistent answer is to recognize the
        queried ciphertext among re-encryptions of recorded oracle queries, which requires
        storing them and re-encrypting. The classical distribution-theorem analogue is the
        standard lower bound for exact membership testing against an adversarially chosen key
        set: any data structure answering exact membership over a set of size q stores omega(q)
        bits in the worst case, so the store cannot be compressed away by cleverness alone.
        WHAT IS HEURISTIC is the unit-cost RAM model and the assumption that the transcribed
        proof's simulator is the cheapest one the proof admits.
      validation_plan: >-
        (i) Implement the simulator's decapsulation-answering step at TOY FrodoKEM-shaped
        parameters and measure probes and encryptions per query as a function of q_G over a
        declared ladder, comparing the measured growth against the predicted f(q_D, q_G);
        report the fitted exponent with its confidence interval and the discrepancy from the
        prediction. (ii) Tail check: the largest q_G reached must show the predicted growth and
        not a plateau; a plateau indicates the toy implementation is memory-resident in a way
        the model does not capture, and that is reported rather than fitted around.
        (iii) Record the toy parameters, the machine, and the transfer assumption explicitly:
        TOY SCALE NEVER SPEAKS FOR THE FIPS-SIZED PARAMETER SETS, and the measured constants
        are used only to bound c_enc's order of magnitude in the declared cost model, never to
        produce a bit figure for a standardized parameter set.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED. The exponents this record produces are the REDUCTION'S:
      time exponent log2 f(q_D, q_G) + log2 c_enc, which for the archetypal FO simulator that
      scans recorded oracle queries per decapsulation query is of order a + b for q_D = 2^a and
      q_G = 2^b, against an implicit published accounting that treats the reduction's time as
      t_A, i.e. exponent 0 in the query counts. That difference - not an attack speedup - is the
      quantity being moved from unstated to stated.
    memory_exponent: >-
      Reduction memory exponent log2 g(q_G), of order b for q_G = 2^b, against an implicit
      published accounting of 0. This is the sharper of the two and is the one with no
      time-memory tradeoff available: the simulator cannot recompute what it did not store,
      because the adversary's oracle queries are not reproducible.
    best_known: >-
      This repository has no incumbent: the narrow grep establishes that no ledger record uses
      an advantage-per-time measure anywhere. Externally the incumbent framework is
      Micciancio-Walter's bit-security definition (RECALLED, not opened this session), and FO
      analyses in the HHK family routinely state t_B explicitly (also recalled). So the CONCEPT
      has a strong incumbent and this record does not claim it; the FrodoKEM-specific evaluation
      and the simulator memory ceiling are what is claimed as absent from this program.
    hidden_overhead: >-
      The cost model hides everything. A movement of D bits is D bits only under one c_enc, one
      unit for t_A, and one machine model, and none of those is a fact. Disclosed rather than
      absorbed, with a mandatory two-value ablation. A second hidden overhead is that the whole
      analysis is of ONE transcribed proof: a different proof of the same theorem could have any
      resource vector, so nothing here bounds what is provable about FrodoKEM.
    tradeoff_note: >-
      The reduction's memory admits NO time-memory tradeoff of the van Oorschot-Wiener kind,
      and saying why is part of the contribution: a claw-finding search can trade table size for
      repetitions because it can recompute its own inputs, whereas the FO simulator's table
      holds the ADVERSARY'S queries, which it cannot regenerate. Parallelization is likewise
      irrelevant: the reduction is not a search, it is a bookkeeping wrapper, and its cost is
      driven by query volume rather than by a search space.
  dominated_by: >-
    n/a (no attack or algorithmic cost result is claimed, so no Pareto frontier row across time,
    memory and data/queries applies; writing 'null' would be a fabrication under AGENTS.md rule
    5). Checked against every cost-bearing row this session could reach: the
    Glabush-Hövelmanns-Stebila multi-target attack figures are attack-side and on a different
    axis; GOAL-MLKEM-004's memory-charged sieve costs are attack-side for a different scheme;
    Micciancio-Walter is a definitional framework rather than a cost row and DOMINATES this
    record conceptually - it is where the measure comes from, it is cited, and no conceptual
    novelty is claimed over it.
  sota_delta: >-
    No attack; representational and accounting contribution only. Quantitatively: this
    repository contains zero records using an advantage-per-time bit-security measure (measured
    by the narrow grep, whose only hit is an unrelated DBKZ citation in KN-LIT-6702), zero
    per-hop resource vectors, and zero memory accounting for any reduction. The delta is the
    first such accounting in the program and, specifically, the first application of the
    program's own memory-charging standard (GOAL-MLKEM-004) to a proof rather than to an
    attack. Against the external literature the delta is small and is stated as small: the
    measure is published and FO analyses state simulator costs; what may be absent is the
    FrodoKEM-specific evaluation, and this session could not open the primary text to check.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  honest_prior_of_survival: >-
    By part. (i) That the transcription decomposes the chain hop by hop rather than delivering
    only the final inequality: 0.5. This is the binding risk and it is a scoping decision inside
    BATCH-001 that nobody has made yet.
    (ii) That the four nulls pass and the instrument is admissible: 0.75.
    (iii) That the primary text ALREADY states t_B, collapsing claim (B) to arithmetic on a
