    - >-
      IDEA-20260816-72e5e5 certifies the evaluation pipeline as an instrument using unstructured
      FrodoKEM as a free control. That is about the pipeline reading a bound correctly; a fully
      certified pipeline reports the same uncharged store.
    - >-
      GOAL-MLKEM-004 charges memory in sieve cost models. That is memory of an ATTACK. This
      record charges memory of a REDUCTION. The borrowing of the accounting standard is
      declared; the object differs and the conclusion is about a proof, not an attack cost.
    - >-
      Bhattacharyya (eprint 2020/075) is NOT a record this is discriminated from - it is the
      INCUMBENT, and after repair this record is positioned downstream of it: it asks whether
      that published technique reaches the SALTED FO transform, which postdates it. If a
      reviewer finds that question already answered in print, the record collapses to the
