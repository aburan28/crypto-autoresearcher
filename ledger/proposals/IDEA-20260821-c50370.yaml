  interpretation_limits:
    - >-
      A reduction's cost is a property of a PROOF. It is not an attack, not a weakness, not
      evidence about LWE, and not a reason to change a parameter. RQ-FRODO-a2dbe2.constraints[3]
      binds absolutely.
    - >-
      An expensive reduction does not make a scheme less secure; and because the theorem's
      quantifier is EXISTS B, a memory-tight B elsewhere in the literature discharges the
