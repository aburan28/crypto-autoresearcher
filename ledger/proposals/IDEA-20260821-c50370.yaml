idea:
  id: IDEA-20260821-c50370
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    THE MEMORY COORDINATE OF THE FrodoKEM ROM REDUCTION (narrowed after red-team refutation of
    the time and work-factor claims): a concrete security statement bounds the reduction's
    advantage and, per the transcribed text, its running time - but not its STORE. Transcribe
    the FrodoKEM/SFO ROM simulator, determine whether the primary text bounds m_B at all, and
    determine whether the PUBLISHED memory-tight FO reduction technique (Bhattacharyya, PKC
    2020) extends to the SALTED FO transform, which postdates it.
  class: representation
  claim: >-
    (A) WITHDRAWN. The original claim (A) asserted that published KEM accounting projects the
    reduction's (advantage, time, memory) triple onto the advantage alone. An independent
    red-team screen of this lane quotes eprint 2025/1861 Section C.1.1 as interpreting
    "b bits of classical security" as a bound of t/2^b on the advantage of a uniform t-gate
    classical adversary - i.e. an advantage-per-time (work-factor) measure - and as converting
    queries to gates via q_RO < t*2^-18. If that quotation is correct, the premise of (A) is
    false for this very paper and the claim is withdrawn rather than softened. This agent could
    not open the primary text (see repair_provenance), so the withdrawal is recorded as made on
    the screen's authority; it is a WEAKENING and asserts no new fact.
    (B) WITHDRAWN. The original claim (B) asserted that the reduction's running time
    t_B = t_A + f(q_D, q_G)*c_enc, with f of order q_D*q_G, is charged nowhere. The same screen
    quotes eprint 2025/1861 Theorem 1 ("The total running time of B is about that of A plus the
    time needed to simulate the random oracles"), quotes Section C.1.1 as DISCLOSING the
    omission ("We ignore the overhead of running the reduction of Theorem 1, including the cost
    of simulating random oracles"), and quotes Glabush-Hovelmanns-Stebila as stating
    Time(B) = Time(A) + O(q_D). A disclosed omission is not an unstated ceiling, and a linear
    O(q_D) overhead is not an order-a+b term. Claim (B), the phrase "silently assumes", and the
    "order a + b" time exponent are all withdrawn.
    (C) RETAINED AND NARROWED - THE ONLY SURVIVING POSITIVE CLAIM. The transcribed statement
    bounds t_B and does not bound m_B. The classical FO/SFO ROM simulator answers decapsulation
    queries by consulting a record of the adversary's oracle queries, so the ARCHETYPAL
    implementation of it holds Theta(q_RO) records. The claim under test is documentary and
    narrow: at each of Frodo-640/976/1344, the transcribed primary text states no bound on the
    reduction's memory, and the store of the simulator AS DESCRIBED THERE grows with q_RO.
    (D) THE DISCRIMINATING EXTENSION, WHICH IS WHAT MAKES (C) WORTH RUNNING. Memory-tightness is
    a published research programme, not a gap this record discovered: Auerbach et al. (CRYPTO
    2017) introduced it, and Bhattacharyya (PKC 2020, eprint 2020/075, abstract read this
    session) proves "memory-tight reductions for different variants of Fujisaki-Okamoto
    Transformation", analysing the Hofheinz-Hovelmanns-Kiltz modular transforms, withstanding
    correctness errors, and "applicable to several lattice-based KEM candidates". FrodoKEM's
    SALTED FO transform is new in 2025 and postdates that work. So the genuinely open question
    is a two-sided one: does the published RO-simulation technique that makes FO reductions
    memory-tight extend to SFO, where the simulator must additionally handle a per-ciphertext
    salt that is not derived from the message? If YES, the memory coordinate is closable and
    claim (C) is a statement about one transcribed proof and nothing more - a clean negative.
    If NO, and an obstruction can be named, that obstruction is a property of the SFO transform
    and is the reportable result.
    (E) WHAT IS NOT CLAIMED. No attack. No break. No assertion that FrodoKEM is insecure or that
    any parameter should change. No assertion that a memory-expensive reduction is a weakness: a
    reduction's cost is a property of a PROOF. No claim of conceptual novelty over the
    memory-tightness literature, which is the incumbent and is cited.
  mechanism: >-
    STAGE 0 (GATE, inherited and REPAIRED): requires the GOAL-FRODO-002 BATCH-001 transcription
    of eprint 2025/1861 Theorem 1 and its game chain, including what the text says about the
    SIMULATOR. The inherited numeric gate is repaired in this revision - see the
    baseline_embedding block - because the figures 149.8 / 212.6 / 266.8 are NOT outputs of any
    FO/SFO bound. STAGE 1: transcribe the simulator's data structure verbatim - what it stores,
    keyed by what, and whether the text bounds its size. Record quoted text or a recorded
    absence with the search terms that established it. STAGE 2: build the resource vector per
    game hop as (delta log2 Adv, delta log2 t, delta log2 m) and compose it under the CORRECTED
    composition law (log-sum-exp; see H1), reporting the composed log2 m_B as a function of the
    adversary's query counts. STAGE 3: memory ceiling. Solve m_B(q_RO) = M_phys for a declared
    ladder of physical memory budgets, each stated as an assumption, and report the q_RO at
    which the simulator's store exceeds each. Report as a REGION BOUNDARY OF ONE READING of the
    theorem, explicitly not a mathematical restriction on it. STAGE 4 (THE DISCRIMINATOR): read
    Bhattacharyya's RO-simulation technique and attempt to instantiate it on the transcribed SFO
    chain hop by hop. Emit either a memory-tight SFO simulator sketch with its per-hop store, or
    the FIRST HOP at which the technique fails together with the reason (the salt is sampled by
    the encapsulator and is not a function of the message, so a PRF-regenerated transcript may
    not reproduce it - this is the specific obstruction to look for, and it may not survive
    contact with the text). STAGE 5: controls, below, all in the same invocation.
