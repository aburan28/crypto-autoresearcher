idea:
  id: IDEA-20260922-f37254
  question_id: RQ-BINSTD-b6f698
  added: '2026-09-22'
  status: proposed
  approved_by: null
  title: >-
    THE REDUCTION POLYNOMIAL IS A REPRESENTATION, NOT BACKGROUND: NIST's OWN
    FIPS 186-4 SPLIT -- TRINOMIAL AT m=233,409, PENTANOMIAL AT m=163,283,571,
    every K/B pair sharing the SAME reduction polynomial at its own m -- is
    an R1 basis axis this lane has never tested, orthogonal to every curve-
    coefficient (a,b) axis IDEA-20260922-1a081a and IDEA-20260922-8ac1ea
    already study. Since the two bases model the SAME abstract field and,
    via an explicit field isomorphism, the SAME abstract curve, the question
    is not "does the group get easier" -- it cannot, an isomorphism is exact
    -- but whether this program's OWN algorithm-measured decomposition cost
    (SAT conflicts, first-fall degree under a fixed monomial order) is
    basis-invariant, a coordinate-dependent question a certified-inert
    outcome closes honestly.
  class: representation
  claim: >-
    R1 representation: the choice of degree-m irreducible defining polynomial
    f for F_{2^m} (equivalently, the polynomial basis {1, alpha, ..., alpha^{
    m-1}} it fixes) -- NOT the curve coefficients a, b (1a081a's and 8ac1ea's
    axis) and NOT the Groebner monomial order (the axis of the general-lane
    IDEA-20260815-ad4b55). Operation set Sigma: translation by factor-base
    elements, unchanged -- Class I, PARTIAL-ACTION, the same Sigma every
    filed index-calculus line in this lane uses. The attack stage this
    record's outcome bears on is POINT DECOMPOSITION (the per-instance
    search cost and the first-fall degree that gates Assumption 1), not
    relation yield or linear algebra.

    (R1) THE VERIFIED FACT. This session's own hex decoding of
    analysis/binstd-curve-audit/binary-curve-params.txt (arithmetic shown,
    not recalled) gives, for the five FIPS binary field polynomials -- and
    every curve at a given m, K and B alike, shares the identical polynomial
    (confirmed byte-for-byte for sect163k1/sect163r2, and for each other
    pair): m=163: x^163+x^7+x^6+x^3+1 (5 terms, "ppBasis" in OpenSSL's
    label); m=233: x^233+x^74+1 (3 terms, "tpBasis"); m=283:
    x^283+x^12+x^7+x^5+1 (5 terms); m=409: x^409+x^87+1 (3 terms); m=571:
    x^571+x^10+x^5+x^2+1 (5 terms). NIST split the five FIPS degrees into a
    trinomial pair (233, 409) and a pentanomial triple (163, 283, 571). This
    is a FIELD-level fact, orthogonal to and untouched by every K/B
    coefficient distinction the two sibling records study, since the SAME
    polynomial serves both curves at a given m.

    (R2) WHY THIS IS NOT A CHANGE OF COORDINATES, AND WHY IT ALSO IS NOT A
    HARDNESS CLAIM. Two models of F_{2^n} defined by different irreducible
    polynomials are related by an explicit field isomorphism phi, and any
    such phi is an F_2-ALGEBRA isomorphism: phi(x+y) = phi(x)+phi(y) and
    phi(xy) = phi(x)phi(y) exactly. Transporting a curve E_{a,b} and a target
    R through phi gives an ISOMORPHIC curve and an ISOMORPHIC decomposition
    IDEAL -- so no group-theoretic hardness statement can differ between the
    two representations, and this record makes none. What phi does NOT
    preserve is the PRACTICAL cost as measured by a fixed pipeline: SAT
    conflict counts (IDEA-20260915-0d8e90's c*2^{ml} law) and Groebner
    degree-of-regularity under a fixed monomial order both depend on how the
    generators are WRITTEN, not only on the ideal's abstract invariants --
    exactly the phenomenon IDEA-20260830-ad0be4 already established for this
    program's own systems ("the solving degree is not an ideal invariant")
    and that RQ-SEMBIN-9fa4ba independently names as a live confound ("the
    low-degree basis induces a variable ordering, and a Groebner engine is
    sensitive to ordering").

    (R3) TWO NAMED OUTCOMES, BOTH LEGITIMATE. (I1) INERT: the measured
    conflict count / first-fall degree, transported through phi between a
    trinomial-basis model and a pentanomial-basis model of the SAME toy
    field and the SAME curve, agrees within run-to-run noise at every tested
    n -- a CERTIFIED INERTNESS result closing this axis for this program's
    own pipeline, exactly the outcome the brief names as legitimate. (I2)
    REPRESENTATION-DEPENDENT: the measured quantity differs beyond noise at
    one or more n -- a scope limit on EVERY filed first-fall-degree or
    conflict-count law in this lane (Semaev's Table 3, Nagao's Theorem 1 as
    costed by IDEA-20260913-41c4f0, 0d8e90's own c) that does not disclose
    which basis it was measured in, since none of them currently do.

    (R4) EXTERNAL MOTIVATION, HEDGED. This program's own literature entry
    KN-LIT-6733 (Oliveira-Lopez-Rodriguez-Henriquez, provenance kb, flagged
    "not verified here" by its own record) reports a "redundant trinomial
    strategy" adopted specifically for Koblitz-curve field reduction speed --
    external, independent evidence that reduction-polynomial sparsity is
    already known to matter for FIELD ARITHMETIC constants in this exact
    curve family; whether it ALSO moves the decomposition-search cost this
    program measures is what this record tests, not something KN-LIT-6733
    itself claims. Separately, NIST's own documented rationale for choosing
    pentanomial at m=163,283,571 -- that no suitable irreducible trinomial
    exists at those degrees (a consequence of Swan's theorem on trinomial
    reducibility over GF(2)) -- is RECALLED here, not verified this session,
    and is used only as background motivation; the record's own Step 0
    (below) supplies the toy-scale analogue by direct enumeration rather
    than relying on the recalled fact.
  mechanism: >-
    OBJECT FRAME, PAIR NOT PROJECTION. Representation: R1, the choice of
    defining polynomial f (equivalently the polynomial basis it fixes) for
    F_{2^n} -- one of RQ-ECDLP-623a32's own named R1 sub-classes ("redundant"
    representations are explicitly listed there, and KN-LIT-6733's
    "redundant trinomial" is precisely that sub-class in the wild).
    Operation set Sigma: translation by factor-base elements, unchanged.
    TRICHOTOMY (docs/object-frame-ideation.md): the tracked quantity here --
    the algorithm-measured conflict count / first-fall degree -- is placed
    in the COORDINATE-DEPENDENT class, explicitly named in that document as
    "a function of the representation, not of the group element." This is
    the correct class because (R2) above already rules out PARTIAL-ACTION
    (the ideal itself, hence its abstract hardness, IS invariant under phi,
    so there is no new lossy propagation to claim) and rules out BRANCHING
    (nothing here is probabilistic in the way a random-walk collision is);
    what remains, and what this record actually tests, is whether the
    MEASURED quantity is purely a representation artifact or whether it
    tracks something Sigma-relevant.

    LOSSY-PROJECTION TEST, STATED HONESTLY. This record does NOT claim to
    have found a new lossy tracked object surviving Sigma. It states the
    test's converse use, which the object-frame instructions explicitly
    permit: for a candidate placed in the coordinate-dependent class, the
    test IS the measurement -- if the quantity is genuinely representation-
    dependent (outcome I2), that is direct proof it was never tracking a
    Sigma-invariant fact in the first place, for EVERY law that reports it
    without a basis; if it is not (outcome I1), the axis is closed with a
    certificate, which is the other legitimate outcome the brief and
    docs/inventor-protocol.md section 4 both name.

    THE ONE OPEN NUMBER, PRICED: the field-isomorphism transport cost. To
    even POSE this comparison fairly, an explicit F_2-algebra isomorphism
    phi: F_f -> F_g between the two models of F_{2^n} must be constructed --
    standard, via a common root of f in the splitting field of g (or Rabin's
    algorithm at this toy scale), costing O(n^2) field operations as a
    one-time setup, charged here and never treated as free. The SAME
    construction is shared with IDEA-20260922-2a3771's H2, and the two
    records' minimal tests reuse one instrument.
  novelty_status: unverified
  origin:
    kind: idea-generator lane B (FIPS 186-4 binary curves), batch of 2026-09-22
    date: '2026-09-22'
    scope: >-
      Executable at toy binary curves n <= 41 only, where BOTH a trinomial
      and a pentanomial (or denser) irreducible polynomial of the same
      degree can be enumerated and an explicit isomorphism constructed. No
      run at m >= 131; the deployed FIPS polynomials appear only as the
      VERIFIED fact motivating the toy design (R1 above), never as an
      execution target.
    overlap_review: >-
      NEAREST FILED NEIGHBOURS AND WHAT IS ADDED. (1) IDEA-20260922-1a081a
      and (2) IDEA-20260922-8ac1ea both hold the field/basis fixed and vary
      the curve coefficients (a, b) or the resolution of Assumption 1; this
      record holds the CURVE fixed (up to an explicit isomorphism) and
      varies the BASIS -- the orthogonal arm neither sibling's design can
      reach, since both fix f throughout (8ac1ea's own assumptions block
      states "the descent generator must accept an arbitrary F_2-basis...
      the vendored Weil_descent.sage's monomial-basis restriction is the
      same implementation gap," flagging exactly the tooling limitation this
      record's minimal test must also clear, but neither sibling proposes
      to exploit that generality for a basis COMPARISON). (3)
      IDEA-20260815-ad4b55 (general Semaev lane, not curve-population-
      indexed) measures spread across Groebner monomial ORDERS on a FIXED
      system; this record measures spread across the underlying FIELD-
      DEFINING polynomial itself, a different and prior axis -- changing f
      changes what multiplication AND squaring mean in coordinates, before
      any monomial order is even chosen for the resulting system, whereas
      ad4b55's axis is purely about how the SAME system's terms are
      ordered for elimination. (4) IDEA-20260815-b751cf (general lane)
      compares curve MODELS (Weierstrass/Edwards/Montgomery/Hessian) of the
      same curve over a FIXED field/basis; this record fixes the model
      (the standard binary y^2+xy=x^3+ax^2+b form every FIPS curve uses)
      and varies the field's OWN representation instead -- the same genus
      of question (is a measured degree/cost an invariant or an artifact),
      applied to a third, previously untested axis. (5)
      IDEA-20260830-ad0be4 established, for a different source of
      non-invariance (degeneracy arguments), that "solving degree is not an
      ideal invariant" -- cited here as the rigorous grounding for why this
      record's question is genuinely open rather than settled by trivial
      linear algebra. (6) RQ-SEMBIN-9fa4ba's own named confound (variable
      ordering induced by a low-degree basis, its Table 1 starred rows
      showing a 2.4x measured effect at n=17 the paper attributes to
      "simpler" Groebner input without isolating the cause) is the closest
      thing in the corpus to this record's actual question, but it compares
      a LOW-DEGREE V (a factor-base subspace choice) against a random V of
      the same dimension on ONE field -- a factor-base axis, not a
      field-DEFINING-polynomial axis; this record is the missing control
      that isolates whether THAT 2.4x effect (or any part of it) is
      actually a reduction-polynomial artifact rather than a factor-base
      one. Grep of ledger/proposals and knowledge/ for "trinomial" and
      "pentanomial" found zero hits in ledger/proposals (this axis has never
      been proposed in this program) and two literature entries
      (KN-LIT-6733, cited above; KN-LIT-4fe9d2, which uses "linearized
      trinomial" in an unrelated quasi-subfield-polynomial sense and is not
      cited here as on-point).
