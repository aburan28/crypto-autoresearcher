  citation_note: >-
    No web search this session. NIST's own stated rationale (no irreducible
    trinomial exists at m=163,283,571, via Swan's theorem) is RECALLED and
    explicitly not verified; nothing in this record's own claims depends on
    that rationale being correct, only on the VERIFIED hex-decoded fact that
    the polynomials differ in sparsity, which this record derived itself.
  assumptions:
    - >-
      DECLARED COMPONENT: F2 (factor-base decomposition), as the question
      requires; no new factor base, no KN-OPEN-020 escape claimed.
    - >-
      "Trinomial" and "pentanomial" as used here mean exactly what NIST's
      basis-type field records ("tpBasis", "ppBasis" in the OpenSSL dump)
      denote -- both are POLYNOMIAL bases in the standard sense; neither
      involves a normal basis, which is the distinct axis studied by
      IDEA-20260922-2a3771's H2 and explicitly NOT this record's subject.
    - >-
      The comparison requires the two candidate defining polynomials at a
      given toy n to both be genuinely irreducible over F_2; this is checked
      by direct primality-style testing (e.g. gcd(x^{2^n}-x, f) = f) before
      any curve or solver step, at negligible cost.
  proof_search_map:
    bottleneck: >-
      No filed record in this program's binary index-calculus lane discloses
      which reduction polynomial its measured conflict counts or first-fall
      degrees were computed under, and none has tested whether that choice
      matters. RQ-SEMBIN-9fa4ba names variable ordering as an open confound
      on a DIFFERENT axis (factor-base subspace choice); this record supplies
      the missing control that isolates the field-polynomial axis.
    baseline_embedding:
      parameter_slice: >-
        n such that BOTH a trinomial and a pentanomial irreducible
        polynomial exist (to be determined by Step 0's own enumeration,
        arithmetic only): the matched-pair regime where a genuine
        apples-to-apples comparison is possible without also crossing the
        "no trinomial exists" boundary NIST's own choice is built on.
      reproduction_check: >-
        Reproduce the Trimoska n=17 fixture (already the reproduction gate
        for both sibling records: #E=131174, 204/238-point factor bases,
        rho at 227/55) in BOTH bases via the constructed phi, confirming
        identical curve invariants (order, cofactor) transport correctly
        before any solver cost is compared. A pipeline that cannot reproduce
        this fixture in the SECOND basis has not implemented phi correctly.
    observation_collision:
      observable: >-
        the pair (WDSat conflict count under IDEA-20260915-0d8e90's law,
        Macaulay-rank first-fall degree per IDEA-20260922-8ac1ea's (M3)
        instrument), measured on the SAME transported instance in each of
        the two bases.
      distinct_preimage_search: >-
        A measured difference has at least three distinct preimages: (i)
        genuine algebra-level sparsity effect (the descended system's
        generators are literally sparser/denser depending on f's term
        count, changing the Macaulay matrix's own structure -- (I2)
        properly read); (ii) a SOLVER variable-ordering artifact induced by
        which basis vector the encoder happens to number first (the
        confound RQ-SEMBIN-9fa4ba names), separable by re-running with a
        FIXED canonical variable order imposed identically in both bases;
        (iii) an implementation bug in phi's transport (separable by the
        arithmetic self-check phi(x)*phi(y) == phi(x*y) on random test
        pairs, run before any solver step). The design reports all three
        checks so a raw difference is never misattributed.
    constructive_transforms:
      - transform: coordinate_dependent_audit
        proposed_object: >-
          the pipeline's own reported conflict-count / first-fall-degree
          figures, re-presented as a FUNCTION OF BASIS rather than as a
          single number per (n, m, l) -- exposing an implicit assumption
          every filed law in this lane currently carries silently.
        predicted_gain: >-
          either certifies the axis inert (a genuine closure, cheap to
          state and reuse) or names exactly which filed laws need a
          basis-disclosure amendment, which is a concrete, actionable
          finding either way.
    quantifier_order: >-
      (I1) is a FOR-EVERY statement over the tested toy instances: for every
      matched pair and every tested n, the measured quantity agrees within
      noise -- falsified by a single exhibited counterexample. (I2) is the
      negation, an EXISTS statement -- established by a single reproducible
      out-of-noise measurement, with the ideal-invariance fact (R2) standing
      regardless of which holds, since (R2) is about the abstract ideal, not
      about any specific algorithm's measured trajectory through it.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On toy curves at n in [the matched-pair set Step 0 identifies], the
        WDSat conflict count and Macaulay first-fall degree, transported via
        an explicit, arithmetic-verified field isomorphism between a
        trinomial-basis and a pentanomial-basis model of the same field and
        the same curve, are [identical within noise / differ by (measured
        factor)] -- with the variable-ordering and phi-correctness controls
        both passed." Conditional on the toy scale and this program's own
        solver pipeline; silent on m >= 131; makes no claim about the
        abstract hardness of any curve, which (R2) already fixes as
        invariant.
      nearby_object_control: >-
        an n where NO irreducible trinomial exists at all (Step 0's own
        enumeration will locate one if the toy range contains it, mirroring
        m=163/283/571's situation exactly) -- forcing a pentanomial-vs-
        denser-pentanomial comparison instead, which tests whether the
        EFFECT (if any) is really about trinomial-vs-not or about sparsity
        as a continuous quantity (3 vs 5 vs 7 terms).
    proof_obligations:
      - claim: phi is verified a genuine field isomorphism by direct arithmetic check before any solver run.
        responsibility: correctness
      - claim: Curve invariants (order, cofactor) are confirmed identical in both bases after transport.
        responsibility: correctness
      - claim: Variable-ordering is controlled separately from sparsity via a fixed canonical numbering.
        responsibility: confound
      - claim: The matched-pair existence check (Step 0) is exhaustive over the tested n, not sampled.
        responsibility: correctness
      - claim: No claim about any deployed curve's security at any outcome.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: >-
        squaring/Frobenius structure-matrix Hamming weight (number of
        nonzero terms needed to express x -> x^2 in each basis), a pure
        arithmetic quantity requiring no solver
      direction: lower
      minimum_effect: >-
        strictly lower in the trinomial basis than the pentanomial basis at
        every matched n, by a factor tied directly to the term-count ratio
        (3 vs 5, or the actual sparsity Step 0 finds) -- this is the cheap,
        near-certain P2 result that motivates running the expensive P1
    - metric: >-
        WDSat conflict count ratio (trinomial-basis instance / pentanomial-
        basis instance of the isomorphic problem), matched V and target set
      direction: lower
      minimum_effect: >-
        EITHER within the identity-shape noise floor (outcome I1, no
        surprise given (R2)) OR outside it by a reproducible, out-of-noise
        margin at more than one tested n (outcome I2) -- these are the two
        non-overlapping bands the design is built to separate
    - metric: Macaulay first-fall degree, same matched pairs
      direction: higher
      minimum_effect: >-
        identical (a zero-variance prediction under I1, refuted by a single
        differing degree at any tested n)
    - metric: >-
        phi's own arithmetic self-check, phi(x)*phi(y) vs phi(x*y) on random
        test pairs
      direction: higher
      minimum_effect: exact equality on every tested pair, or the instrument is invalid
  minimal_test:
    design: >-
      Step 0 (arithmetic, zero solver): for n in {17, 19, 23, 29, 31, 37, 41}
      (prime, matching the lane's own population), brute-force enumerate
      irreducible trinomials x^n+x^k+1 over F_2 (k = 1..n-1) and separately
      an irreducible pentanomial (or, if none is found small, the sparsest
      available denser polynomial) of the same degree; this determines,
      per n, whether a matched trinomial/pentanomial PAIR exists at all --
      the toy-scale analogue of NIST's own situation at m=163,283,571.
      Step 0b: compute the squaring-matrix Hamming weight in each basis
      found (P2, pure arithmetic). Step 1: for each n with a matched pair,
      construct the explicit field isomorphism phi and verify it
      arithmetically (P4). Step 2: transport ONE fixed toy curve (a=b=1, the
      Trimoska-style Koblitz analogue used as this lane's own reproduction
      fixture) and a matched factor base V through phi; verify curve
      invariants transport correctly (baseline_embedding's reproduction
      check). Step 3: run the decomposition pipeline (WDSat + the Macaulay
      rank instrument, both already installed per 8ac1ea's tooling) in each
      basis on matched target sets; report conflict counts and first-fall
      degrees, WITH and WITHOUT a fixed canonical variable order imposed
      identically, separating the sparsity effect from the ordering
      confound. Step 4: repeat on an n with NO trinomial at all (if Step 0
      finds one in range), as the nearby-object control.
      OUTCOMES. (A) I1 across all tested pairs: this axis is CERTIFIED
      INERT for this program's own pipeline -- a cheap, reusable closure,
      and every filed law in this lane may cite it without a basis
      disclosure going forward. (B) I2, with the effect surviving the
      fixed-order control: a genuine algebra-level sparsity effect on
      solving cost, meaning every filed first-fall-degree or conflict-count
      figure in this lane needs its basis stated to be comparable across
      records -- a scope limit worth having, in the same register as
      8ac1ea's own strongest outcome (C). (C) I2, but the effect DISAPPEARS
      under the fixed-order control: the apparent basis effect was actually
      a variable-ordering artifact, directly relevant to (and a partial
      resolution of) RQ-SEMBIN-9fa4ba's own open 2.4x confound.
    controls:
      - >-
        IDENTITY: same basis, same instance, different seed -- the noise
        floor against which any cross-basis difference is read.
      - >-
        FIXED-ORDER CONTROL: both bases solved with an IDENTICAL canonical
        variable numbering imposed after transport, separating sparsity
        from ordering.
      - >-
        NEARBY OBJECT (no-trinomial n): forces a pentanomial-vs-denser
        comparison, testing whether the effect (if any) tracks term count
        continuously or is specifically about trinomial-vs-not.
      - >-
        ARITHMETIC SELF-CHECK: phi(x)*phi(y) == phi(x*y) on >= 100 random
        pairs before any solver run is trusted.
      - >-
        REPRODUCTION: the n=17 fixture's curve invariants (#E, factor-base
        counts, rho figures) reproduced in BOTH bases via phi.
    required_metrics:
      - per n -- existence of a matched trinomial/pentanomial pair (Step 0)
      - per basis -- squaring-matrix Hamming weight (P2)
      - per matched pair -- conflict count and first-fall degree, with and without fixed ordering
      - phi's arithmetic self-check pass rate
      - curve-invariant transport check (order, cofactor) in both bases
  falsification_conditions:
    - >-
      phi failing its arithmetic self-check on any tested pair invalidates
      the instrument for that pair, an implementation bug, not a finding.
    - >-
      Curve invariants NOT matching after transport falsifies the transport
      implementation, not (R2)'s mathematical content.
    - >-
      A measured conflict-count or first-fall-degree difference that
      SURVIVES the fixed-order control at more than one tested n falsifies
      I1 and establishes I2 as this record's finding.
    - >-
      A predicted squaring-matrix Hamming-weight difference (P2) that fails
      to appear would falsify the record's own arithmetic and must be
      located before any solver step is trusted -- this is the cheapest
      possible check and should never fail if Step 0 is implemented
      correctly.
  confounders:
    - >-
      VARIABLE-ORDERING CONFOUND (RQ-SEMBIN-9fa4ba's own named item),
      controlled for directly by the fixed-order arm of Step 3.
    - >-
      SOLVER PREPROCESSING EATING THE SPARSITY, the same confound
      8ac1ea's design names for its (a,b) factorial; controlled by running
      with preprocessing disabled as a secondary arm.
    - >-
      SMALL n NOISE: at the toy scale, matrix and factor-base sizes are
      small enough that a single instance's idiosyncrasy could masquerade
      as a basis effect; matched-target and multiple-n replication address
      this, matching the corpus's own two-n design convention.
    - >-
      CONFLATION WITH THE NORMAL-BASIS AXIS. This record studies ONLY
      polynomial-basis sparsity (trinomial vs pentanomial); it explicitly
      does NOT test normal-basis representations, which is
      IDEA-20260922-2a3771's separate H2 subject, sharing only the phi
      transport machinery.
  interpretation_limits:
    - >-
      Scoped to the tested toy n and this program's own solver pipeline
      (WDSat, the Macaulay rank instrument). Nothing transfers to m >= 163
      without a stated extrapolation assumption, and no claim about any
      deployed curve's security follows from either outcome.
    - >-
      The abstract hardness of the DLP itself is provably unaffected at
      every outcome, by (R2); only the MEASURED, algorithm-specific cost is
      in question here, and the record says so throughout.
    - >-
      NIST's own rationale for choosing pentanomial at m=163,283,571 (Swan's
      theorem, no suitable trinomial exists) is recalled, not verified; the
      record's Step 0 supplies an independently computed toy-scale analogue
      and does not depend on the recalled fact being correct.
    - >-
      The deployed single-basis-per-degree fact (verified this session from
      a secondary source) needs re-derivation from FIPS 186-4 at claim
      strength.
  heuristic_assumptions:
    - id: HRP-1
      statement: >-
        (IDEAL INVARIANCE UNDER BASIS TRANSPORT) The descended decomposition
        ideal for a curve E and target R, transported via the explicit field
        isomorphism phi between two models of F_{2^n}, is isomorphic AS AN
        IDEAL to the original -- same Hilbert function, same TRUE (Nagao
        Definition-5) first-fall degree -- regardless of which of the two
        bases is used.
      rigorous_support: >-
        RIGOROUS PART: phi is a ring isomorphism by construction (both f and
        g define the same abstract field), and ring isomorphisms transport
        ideals to isomorphic ideals with identical Hilbert functions --
        genuinely rigorous, no heuristic content in this clause alone.
        HEURISTIC PART: whether THIS PROGRAM'S OWN descent-generation
        tooling (vendored, monomial-basis-restricted per 8ac1ea's own
        assumptions block) actually implements a faithful transport is an
        IMPLEMENTATION fact, validated directly by Step 1's arithmetic
        self-check rather than assumed. CLASSICAL ANALOGUE IMITATED:
        invariance of Hilbert functions under a change of coordinates --
        the same principle IDEA-20260815-b751cf applies to curve MODELS,
        applied here to the field's OWN defining polynomial instead.
      validation_plan: >-
        WHAT TO SAMPLE: every matched trinomial/pentanomial pair Step 0
        locates among n in {17,...,41}; the arithmetic self-check
        phi(x)*phi(y) = phi(x*y) on >= 100 random pairs per n is a
        deterministic, exhaustive-in-spirit check, not a statistical
        estimate, so there is no distributional tail to report -- a single
        failure is definitive. TRANSFER ASSUMPTION, STATED: HRP-1's
        rigorous clause holds at every scale by general algebra and needs no
        extrapolation; only the practical-cost outcomes (I1/I2) are
        toy-scale findings not transferred to m >= 163 without a further
        assumption.
    - id: HRP-2
      statement: >-
        (PRACTICAL SOLVING COST IS NOT GUARANTEED BASIS-INVARIANT) The
        SAT-conflict count and the fixed-monomial-order Groebner
        degree-of-regularity, as actually computed by this program's
        pipeline, are NOT guaranteed to equal across phi-isomorphic
        representations, because both instruments are sensitive to the
        sparsity and ordering of the generators AS WRITTEN, which the
        reduction polynomial directly determines.
      rigorous_support: >-
        RIGOROUS PART: cites IDEA-20260830-ad0be4's already-established,
        general finding that solving degree is not an ideal invariant --
        the SAME underlying phenomenon (term-order and generator-sparsity
        sensitivity), here transplanted from that record's degeneracy-
        argument source to a reduction-polynomial source. HEURISTIC PART:
        whether the EFFECT SIZE at this specific axis is large enough to
        matter (a few percent, matching RQ-SEMBIN-9fa4ba's own 2.4x figure
        at a different axis, or negligible) is exactly what Step 3 measures.
        CLASSICAL ANALOGUE IMITATED: Groebner basis complexity's well-
        documented sensitivity to monomial order (DRL versus lex can move
        F4 cost by orders of magnitude for the identical ideal) -- HRP-2
        predicts the SAME kind of phenomenon, at comparable potential
        magnitude if present, transplanted from "choice of monomial order"
        to "choice of defining polynomial," a mechanistically adjacent but
        formally distinct source of the same non-invariance.
      validation_plan: >-
        WHAT TO SAMPLE: the complete Step 3 measurement across every
        matched pair Step 0 locates, WITH and WITHOUT the fixed-order
        control, giving a direct separation between "sparsity effect" and
        "ordering effect" rather than a pooled estimate. PREDICTED
        DISTRIBUTION: bimodal, not continuous -- either the fixed-order
        control eliminates the difference (I2 was really an ordering
        artifact, matching RQ-SEMBIN-9fa4ba's open confound) or it does not
        (I2 is a genuine sparsity effect). TAIL CHECK: not a statistical
        tail in the corpus's usual sense (small, exact toy instances); the
        check is whether the fixed-order and free-order arms AGREE with
        each other within noise or diverge, which is itself the result.
        TRANSFER ASSUMPTION, STATED: none of this is extrapolated to
        m >= 163; a deployed-scale statement about basis dependence would
        require a further, currently unstated assumption about how the
        effect (if any) scales with n.
  heuristic_note: >-
    HRP-1 is close to rigorous and is included mainly so the record's
    boundary between "provably invariant" (the abstract ideal) and
    "empirically open" (the measured pipeline cost) is stated precisely, not
