  heuristic_assumptions:
    - id: HA-1
      statement: >-
        For an ordinary F_p-isogeny class C of size h with D fundamental, the
        Cayley graph of Cl(O) on the ideals above the k smallest split primes
        (k = O(log p), norms ell = O(log^2 p)) has spectral gap bounded below by
        an absolute constant, so a random walk of length O(log p) lands within
        statistical distance 1/poly(p) of uniform on C, and the expected number of
        steps before a walk first meets a fixed subset of density d = L/h is
        Theta(1/d) = Theta(h/L), uniformly in L for L >= 1.
      rigorous_support: >-
        The mixing half is the GRH-conditional Jao-Miller-Venkatesan expander
        statement cited as T5 in DECOMPOSITION.md section 3 (cited there, not
        proved). The hitting half is rigorous GIVEN the gap: for a reversible
        chain with spectral gap bounded away from zero, the expected hitting time
        of a set of stationary measure d is Theta(1/d). That inference is standard
        and is already used inside this corpus (IDEA-20260805-de1490 states
        "the hitting time of a set of density d is Theta(1/d) -- standard, and
        checkable directly on these graphs by computing the exact hitting time").
      distribution_imitated: >-
        The geometric law for first entry of an i.i.d. uniform sequence into a
        set of density d -- i.e. the assumption is that the walk behaves like
        uniform sampling with replacement after mixing, which is the same
        idealisation the birthday and claw bounds in this campaign already use.
      validation_plan: >-
        SAMPLE: fully enumerated ordinary classes with D fundamental at
        p in {2^16, 2^20, 2^24}; h measured, not assumed. SHORTCUT THAT MAKES
        SAMPLING FEASIBLE: at these sizes the whole class and its Cayley graph fit
        in memory, so the mean hitting time can be computed EXACTLY by a linear
        solve on the transition matrix as well as sampled -- both numbers
        reported, which converts this from a fit into a check. COMPARISON
        DISTRIBUTION: geometric(L/h); report the empirical CDF against it and a
        Kolmogorov-Smirnov statistic. TAIL CHECKS: the observed 99th percentile
        against the geometric prediction (h/L)*ln(100), and the observed maximum
        against (h/L)*ln(n_samples). MATCHED NULLS: random 2k-regular graph on h
        vertices (must agree) and a cycle on h vertices (must disagree
        dramatically). TRANSFER ASSUMPTION, STATED: agreement at 2^16-2^24 does
        NOT establish the constant at p = 2^256, where h ~ 2^128 and the class
        cannot be enumerated; the transfer is an assumption and is labelled one.
    - id: HA-2
      statement: >-
        For ordinary traces t with |t| < 2*sqrt(p) bounded away from the Hasse
        endpoints and D = t^2 - 4p fundamental, the class number satisfies
        h = h(D) = |D|^{1/2 + o(1)} = N^{1/2 + o(1)}, so the exponent gamma in
        h = N^{1/2+gamma} is o(1).
      rigorous_support: >-
        Siegel's theorem gives h(D) >> |D|^{1/2 - epsilon} for every epsilon > 0,
        and the class-number formula with the trivial bound on L(1, chi) gives
        h(D) << |D|^{1/2} log|D|. |D| = 4p - t^2 = Theta(p) = Theta(N) away from
        the endpoints. [recall-confident, standard analytic number theory, NOT
        re-verified this session.] THE HONEST WEAKNESS IS EFFECTIVITY: Siegel's
        lower bound is INEFFECTIVE -- no computable constant is known -- so the
        criticality statement of claim (F) cannot be made effective, and at any
        concrete p the class size must be COMPUTED, not bounded. This is disclosed
        rather than buried in the o(1).
      distribution_imitated: >-
        None; this is a bound, not a distributional heuristic. It is listed as a
        numbered assumption because the record's central inequality is an exponent
        comparison in which h's exponent appears, and an exponent statement resting
        on an ineffective bound must be named.
      validation_plan: >-
        SAMPLE: compute h(D) exactly for 10^4 ordinary (p, t) pairs at
        20-32 bits with D fundamental, and regress log h against log|D|. COMPARISON:
        slope 1/2, with the residual spread reported as the empirical size of the
        o(1) at that scale. TAIL CHECKS: the smallest observed h/|D|^{1/2} and the
        largest, against the log|D| upper bound and against the Littlewood-type
        extremes under GRH. TRANSFER: none claimed; the point of the exercise is
        to MEASURE the o(1), so that claim (F)'s "critical size" is reported with
        its concrete slack rather than as an equality.
    - id: HA-3
      statement: >-
        The per-step cost of one ell-isogeny in the walk, INCLUDING kernel
        construction and evaluation on two points, is Otilde(sqrt(ell)) field
        operations for ell in a fixed CSIDH-style prime set with
        ell = O(log^2 p), and no modular-polynomial root-finding at large ell
        appears anywhere in the online loop.
      rigorous_support: >-
        sqrt-elu gives Otilde(sqrt(ell)) evaluation; the kernel point is obtained
        by scalar multiplication by (p+1)/ell (or the eigenvalue-restricted
        analogue in the ordinary case) at Otilde(log p) cost. [recall-confident,
        NOT re-verified.] THIS ASSUMPTION IS WHERE a127ab's CONCRETE FAILURE
        LIVED: it priced path-finding with ell = O(log^2 p) ~ 2^{16} and an
        O(ell^3) construction and got 2^{112} at p = 2^{256}. LWA's walk uses only
        small fixed ell in the forward direction, which is exactly why the
        concrete gate is expected to behave differently -- and "expected" is the
        right word until the Stage 3 table is computed.
      distribution_imitated: none; this is an implementation cost model.
      validation_plan: >-
        SAMPLE: instrument a Velu step at toy scale with an explicit
        field-operation counter (the counter IDEA-20260807-d7a5d4 specifies) and
        fit cost against ell for ell up to a few hundred. COMPARISON: the
        Otilde(sqrt(ell)) and Otilde(ell) models, both reported. TAIL CHECK: the
        largest ell in the set, where the asymptotic model is weakest. TRANSFER:
        the fitted constants are for the toy field size and are extrapolated to
        2^{256} only by the field-multiplication cost ratio, which is stated as an
        extrapolation.

  proof_search_map:
    bottleneck: >-
      The addressing step -- connecting an advice string built on E_0 to a
      challenge on an unknown E. Every prior L13 record either assumes the path is
      given (a2fb45, ea3915) or pays vectorization for it (a127ab). Removing that
      step's cost is the only thing this record does, and if the removal fails the
      record has no content.
    baseline_embedding:
      parameter_slice: >-
        h = 1 (a class with one member, or equivalently L = h = 1 with E = E_0
        always). LWA must degenerate EXACTLY to the CGK/Bernstein-Lange
        fixed-group scheme: T_addr = 0, L = 1, S = S_DL, T = T_DL.
      reproduction_check: >-
        Symbolic: substitute h = 1 into (C) and confirm L = h/T <= 1 and
        S = S_DL(1 + o(1)). Fixture: the L = h identity arm of the minimal test
        must measure hitting time exactly 0. A pipeline that reports nonzero
        addressing cost at L = h is charging its own overhead and every cell is
        inflated.
    observation_collision:
      observable: >-
        "The measured mean hitting time equals h/L", used as the certificate that
        addressing is free.
      distinct_preimage_search: >-
        REQUIRED AND IT SUCCEEDS, WHICH IS WHY NULL OBJECT 1 IS BLOCKING. A random
        2k-regular graph on h vertices produces the SAME observable for reasons
        having nothing to do with Cl(O), isogenies, or arithmetic. So the
        observable does NOT identify class structure and must never be reported as
        evidence of it. The disambiguation is the opposite of the usual one: here
        agreement with the random-graph null is the DESIRED outcome, because the
        record's thesis is that the class behaves generically. The collision is
        therefore not a falsifier of this record -- it is this record's claim. The
        genuine falsifier is the CYCLE arm: an instrument that cannot separate the
        expander from the cycle has measured nothing at all.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace "find the isogeny from the challenge curve to the reference
          curve" (a vectorization, hard) by "collide the challenge's forward walk
          with a precomputed landmark set" (a hitting-set problem, easy), moving
          the problem from the inverse to the forward direction of the group
          action.
        predicted_gain: >-
          Addressing cost drops from sqrt(h) = N^{1/4} with a large-ell per-step
          constant, to h/L = N^{1/2-tau} with a small-ell per-step constant, and
          becomes free of charge against the advice budget at every point of the
          frontier.
      - transform: boundary_lift
        proposed_object: >-
          Enlarge the certificate family from "advice valid for one specified
          curve" to "advice valid for a uniformly random member of the class",
          and prove the frontier does not move.
        predicted_gain: >-
          A strictly larger family at the same (S, T), i.e. an inward improvement
          in the model dimension rather than in the cost -- which is the honest
          shape of this result and the reason it is a non-separation rather than a
          speedup.
    quantifier_order: >-
      INTENDED, WRITTEN OUT. UPPER BOUND: FORALL p, FORALL ordinary t with D
      fundamental, FORALL tau in (0, 1/2], EXISTS an advice string of
      S = N^{1-2tau+o(1)} bits (depending on (p,t) only) such that FORALL E in C
      and FORALL instances (P, Q) on E, the online algorithm outputs k in
      N^{tau+o(1)} steps with probability 1 - o(1) over its own coins. Note the
      quantifier that matters: the advice is chosen BEFORE E, and E is quantified
      universally, not merely on average -- the construction delivers this because
      the hitting-time bound holds from every start.
      LOWER BOUND: FORALL algorithms (S, T, epsilon) for ACP, S*T^2 =
      Omega~(epsilon*N). Here epsilon is over the random E AND the random
      instance, so the bound is an AVERAGE-CASE statement over the class, which is
      the weaker and therefore safer direction to assert.
      THE DANGEROUS SLIP, NOT CLAIMED: "for every E there EXISTS advice" -- true
      trivially and worthless, since it permits h separate strings. The whole
      content is that ONE string precedes ALL E.
    method_ceiling:
      strongest_certifiable_claim: >-
        "The achievable (S, T) region of the adaptive class-structured
        preprocessing problem equals that of the fixed-group problem up to
        N^{o(1)}, in the RAM model, for classes with fundamental discriminant and
        GRH-conditional rapid mixing." It can NEVER certify anything about a
        non-group-level functional, about full cost, about non-fundamental D, or
        about quantum adversaries.
      nearby_object_control: >-
        THE OBJECT WHERE THE ARGUMENT MUST FAIL, AND IT IS BLOCKING: an ensemble
        of h curves over DIFFERENT base fields all with the same prime order N
        (constructible by CM methods at toy scale). That ensemble has the same
        "h groups of order N" shape and NO cheap identification map, so LWA's
        step 5 has nothing to walk on and part (D)'s reduction has no walk either.
        If the argument appears to apply there, it is not using isogenies at all
        and is void. This control is filed as its own record,
        IDEA-20260811-73e9a5, precisely so that it is measured rather than
        asserted.
    proof_obligations:
      - claim: Transport along the concatenated path preserves k and the order of P.
        responsibility: correctness
      - claim: The landmark record costs Otilde(log p) bits, the same as a DL entry.
        responsibility: size
      - claim: Expected addressing time is Theta(h/L) steps.
        responsibility: runtime
      - claim: L = h/T <= S_DL = N/T^2 for all T <= N^{1/2} given h = N^{1/2+o(1)}.
        responsibility: size
      - claim: The reduction of (D) reproduces the ACP challenge distribution.
        responsibility: correctness
      - claim: The scheme degenerates to CGK at h = 1.
        responsibility: baseline
      - claim: The argument fails on the same-N-different-p ensemble.
        responsibility: scope
      - claim: Success probability over the class is 1 - o(1) from EVERY start, not on average.
        responsibility: success_probability

  reachability_gate: >-
    T5 INSTANTIATED, AND THIS RECORD'S ONLY REASON TO EXIST IS THAT IT PASSES THE
    GATE ON THE CHEAP SIDE. The construction uses the RANDOM-transport direction
    exclusively: forward walks with small ell, never a path to a specified curve.
    The SPECIFIED-transport direction appears nowhere in the online phase, and
    appears in the offline phase only as walks the preprocessor itself performed
    and recorded, which is not a search. Consequently the gate does not bind, and
    a127ab's concrete 2^{112} figure -- which came from claw-finding with
    ell ~ 2^{16} under an O(ell^3) model -- does not apply to this construction.
    THE GATE'S OTHER EDGE, RECORDED HONESTLY: the same cheap direction is what
    makes the lower bound of (D) go through. So passing the gate is precisely
    what forbids the separation. There is no configuration of T5 in which this
    lane yields an attack: if random transport is cheap, the lower bound
    transfers; if it is expensive, the construction dies and a127ab's tax returns.
    Both branches close the lane, which is the same robustness structure a2fb45
    identified for the single-instance case, now established for the adaptive one.

  target_complexity:
    time_exponent: >-
      Online T = N^{tau+o(1)} for any tau in (0, 1/2], with the standard operating
      point tau = 1/3 at S = N^{1/3}. This is the CGK/Bernstein-Lange exponent
      REACHED IN A LARGER MODEL, not improved: the exponent is unchanged and no
      exponent moves. Against the campaign's attack baseline (parallel rho at
      0.886*sqrt(N)), online time is lower and total charged cost is not, because
      the advice is not free -- see sota_delta.
    memory_exponent: >-
      Advice S = N^{1-2*tau+o(1)} bits, of which the landmark component is
      N^{1/2-tau+o(1)} bits, i.e. a vanishing fraction for tau < 1/2. At
      tau = 1/3: S = N^{1/3}, landmarks N^{1/6} -- one sixth of the exponent, and
      that number is the concrete content of "free".
    best_known: >-
      Fixed-group preprocessing: S*T^2 = Omega~(N) (Corrigan-Gibbs--Kogan,
      KN-LIT-013, KN-TECH-005), achieved at S = T = N^{1/3} (Bernstein-Lange,
      relayed via KN-TECH-005 and a127ab; NOT re-verified this session).
      No-advice: parallel rho 0.886*sqrt(N) with O(1) memory (KN-TECH-001,
      KN-TECH-006), automorphism-discounted by at most sqrt(6) (KN-TECH-018).
      BSGS sqrt(N)/sqrt(N), full cost N^{2/3+o(1)} (KN-TECH-031, KN-TECH-035).
      Multi-target rho sqrt(M*N) (Kuhn-Struik, via IDEA-20260807-406fef).
      Adaptive class-amortised: NOTHING PUBLISHED IS KNOWN TO THIS SESSION, which
      is why the record exists and why its novelty is unverified rather than
      claimed.
    hidden_overhead: >-
      The o(1) hides: (i) the GRH-conditional mixing constant, which JMV004
      scouting inside this program found VACUOUS at 2^{256} for small statistical
      distance -- a superpolynomial-looking concrete cost inside a benign exponent,
      and it applies to HA-1 here exactly as it applied to a127ab's H1;
      (ii) the ineffectivity of Siegel's bound in HA-2, so the criticality claim
      has no computable constant; (iii) polylog factors in the per-step isogeny
      cost; (iv) the assumption that the CGK-frontier algorithm itself is
      instantiable at every tau and not only at tau = 1/3, which the corpus
      records as reported rather than verified.
    tradeoff_note: >-
      The scheme is a genuine two-parameter tradeoff: (S_DL, T) on the CGK curve
      and (L, T_addr) on the hyperbola L*T_addr = h. The record's content is that
      the second hyperbola lies UNDER the first at every point of the first, so
      the composite frontier is the CGK frontier itself. Parallelisation: the
      addressing walks parallelise perfectly across processors with no
      communication (each processor walks independently until it hits a
      landmark), so a P-processor implementation has addressing wall-clock
      Theta(h/(L*P)); the DL phase inherits whatever parallel position the
      underlying CGK algorithm has. Under Wiener full cost the h/L random probes
      into an L-entry table are NOT free and the position changes -- charged in
      IDEA-20260811-735c6b, not here.

  sota_delta: >-
    ZERO against every attack baseline, and the record claims no speedup. Stated
    quantitatively as the batch requires: online time at the tau = 1/3 operating
    point is N^{1/3} against rho's 0.886*N^{1/2}, a ratio of N^{-1/6} -- but that
    comparison is already available for a FIXED curve from Bernstein-Lange/CGK and
    is not produced by anything in this record; the class contributes a factor of
    exactly N^{o(1)} to it, which is the honest number. Against the campaign's own
    prior best in this lane: a127ab achieves the frontier for M SPECIFIED curves
    and prices the adaptive case at p^{1/4} asymptotically / 2^{112} concretely;
    this record achieves it for a RANDOM UNSEEN curve at additive advice cost
    N^{1/2-tau}, i.e. it removes an N^{1/4} online term and replaces it with an
    N^{1/6} advice term at tau = 1/3. That is a real delta AGAINST A PRIOR
    PROPOSAL IN THIS CAMPAIGN and exactly zero delta against any published attack.
  dominated_by: >-
    Checked row by row against the frontier this program maintains, across time,
    memory and data/queries.
    AS AN ATTACK, DOMINATED BY: parallel rho with distinguished points,
    0.886*sqrt(N) group operations at O(1) memory (KN-TECH-001, KN-TECH-006) --
    dominates on memory and on full cost and is the campaign's declared baseline;
    the automorphism-discounted variant at 0.886*sqrt(N/r), r <= 3 (KN-TECH-018);
    BSGS at sqrt(N)/sqrt(N) and N^{2/3+o(1)} full cost (KN-TECH-031, KN-TECH-035)
    -- dominates on determinism; Kuhn-Struik multi-target rho at sqrt(M*N)
    (IDEA-20260807-406fef) for M targets; and, on the preprocessing axis itself,
    the fixed-group Bernstein-Lange/CGK scheme, which achieves the same (S, T)
    with a strictly simpler algorithm whenever the target curve is known in
    advance. This record is dominated by that last row on implementation
    complexity and ties it on every cost axis, which is the point.
    AS A MODEL RESULT, dominated by nothing known to this session -- but that
    statement is worth exactly as much as the novelty screen behind it, and the
    screen could not reach external literature (see novelty_screen), so it is
    recorded as unverified rather than as a claim of priority.

  estimated_cost:
    implementation: >-
      medium. Needs a class enumerator and a Velu evaluator, i.e. exactly the
      harness/transport.py that IDEA-20260807-d7a5d4 specifies and that the
      harness does not yet contain. The measurement itself (hitting times on an
      explicit graph) is low; the isogeny infrastructure is the cost, and it is
      shared with the whole lane.
    compute: >-
      low. Stage 0 and Stage 3 are zero compute. Stage 1 is order of minutes on
      one core once the class is enumerated. Stage 2 is order of one CPU-hour.
  recommended_priority: high

  honest_prior_of_survival: >-
    0.90 that the frontier inequality of (C) survives review as an elementary
    exponent computation once the bit accounting is written out (the risk is in
    the landmark record size, not in the algebra). 0.80 that the reduction of (D)
    survives -- the risk is the statistical-distance bookkeeping between the ACP
    challenge distribution and the walk's endpoint distribution, which is exactly
    where a lower-bound reduction usually breaks. 0.75 that the toy hitting-time
    measurement returns Theta(h/L) and separates from the cycle null at
    p = 2^16-2^24. 0.35 that the construction is NOT already in the literature in
    some form (landmark/hitting-set advice for group actions is a natural idea and
    web checking was unavailable). 0.02 that anything here ever bears on an
    attack, which is the correct number given that the record's own conclusion is
    a non-separation. Ranked HIGH nonetheless because it is the cheapest available
    resolution of the lane's declared open case, it needs no cryptographic-scale
    compute, and its most likely outcome -- a clean citable negative with an exact
    model and a matching bound -- is the batch's stated best case (b).

