  title: >-
    LANDMARK-WALK ADVICE CLOSES THE ADAPTIVE CASE THAT IDEA-20260807-a127ab LEFT
    OPEN, AND CLOSES IT AS A NON-SEPARATION -- one advice string serves a
    UNIFORMLY RANDOM, PREVIOUSLY UNSEEN member of an F_p-isogeny class at exactly
    the Corrigan-Gibbs--Kogan operating point of the fixed-curve problem, because
    the addressing step never solves a vectorization at all (it random-walks into
    a stored landmark set of size L at hitting cost Theta(h/L)), and the landmark
    budget L = h/T is DOMINATED BY the DL advice budget S = N/T^2 at every point
    of the frontier by the elementary inequality 1/2 - tau <= 1 - 2*tau for
    tau <= 1/2 -- an inequality that is tight exactly because h = N^{1/2+o(1)},
    so the isogeny class sits AT the critical class size where adaptive
    amortisation is free and not one exponent beyond it; and the same cheap
    random transport that makes the construction work is what carries the CGK
    lower bound back into the model, so the class provably buys nothing

  class: algorithm

  claim: >-
    (A) THE MODEL, DEFINED BEFORE ANY CLAIM, BECAUSE THE WHOLE RESULT IS A
    STATEMENT ABOUT WHICH MODEL YOU ARE IN.
    Fix p, an ordinary trace t with D = t^2 - 4p FUNDAMENTAL (scope limit S1
    below), so the set C of F_p-isomorphism classes of curves with trace t is a
    single Cl(O)-torsor of size h = h(D), and every member has the same group
    order and the same prime subgroup order N. Define the ADAPTIVE
    CLASS-STRUCTURED PREPROCESSING PROBLEM ACP(p, t):
      OFFLINE. An unbounded-time preprocessor sees (p, t) -- hence the whole
        class -- and emits an advice string of S bits.
      ONLINE. A uniformly random E drawn from C, a generator P of the
        order-N subgroup of E(F_p), and Q = [k]P are given. The online algorithm
        gets (E, P, Q) and the advice, runs for T steps, and must output k.
    ACP differs from the Corrigan-Gibbs--Kogan (CGK) fixed-group preprocessing
    problem (KN-LIT-013, KN-TECH-005) in exactly one respect -- the group handed
    to the online phase is drawn at random from h efficiently-interrelated
    encodings rather than fixed in advance -- and that difference is precisely
    what IDEA-20260807-a127ab named as the case its reachability gate leaves
    binding ("leaves it binding only against an adaptive adversary who learns the
    target curve online"). This record settles that case.

    (B) THE CONSTRUCTION -- LANDMARK-WALK ADVICE (LWA). [open], elementary given
    T5.
      OFFLINE, given a target online budget T:
        1. Fix a reference curve E_0 in C.
        2. Build any CGK/Bernstein-Lange-type advice A_DL for the fixed group
           (E_0, P_0) at operating point (S_DL, T), with S_DL * T^2 = N.
        3. Perform L independent random walks from E_0 in the Cayley graph of
           Cl(O) on the GRH-small prime ideals of norm ell = O(log^2 p), each of
           length m = O(log p) so that its endpoint is within statistical
           distance 1/poly of uniform on C (this is exactly T5's CHEAP
           direction). Store the LANDMARK TABLE
              Lm = { (j(E_i), w_i) : i = 1..L },
           where w_i is the walk word, which is an explicit isogeny path from
           E_0 to E_i of length m. Each entry costs O(m log ell + log p)
           = Otilde(log p) bits, the same per-entry bit cost as one DL table
           entry.
        4. Advice = A_DL || Lm, of total size S = S_DL + L entries.
      ONLINE, on input (E, P, Q):
        5. Walk from E in the same Cayley graph, carrying P and Q forward
           through each ell-isogeny by Velu/sqrt-elu evaluation. After each step
           test the current j-invariant against the hash set { j(E_i) }.
        6. On a hit at E_i, concatenate the walk taken with the reverse of the
           stored w_i to obtain an explicit isogeny path from E to E_0, and push
           P, Q along it. By T1 the transported instance (E_0, P', Q') has THE
           SAME k, and P' has order N because every step degree ell is a small
           prime and gcd(ell, N) = 1. [fact]
        7. Run the fixed-group online algorithm on (E_0, P', Q') with A_DL,
           correcting for the fact that P' need not equal P_0 by one DL of P'
           against P_0 -- which is the same advice-assisted call, so the online
           cost is at most 2T.
      THE ADDRESSING STEP NEVER SOLVES A VECTORIZATION. It never computes an
      isogeny between two SPECIFIED curves; it uses only forward random walks,
      i.e. only the direction T5 says is cheap. This is the mechanism that
      dissolves the tension the axis poses rather than paying it.

    (C) THE COST, CHARGED END TO END, IN THE RAM MODEL (the full-cost audit is
    handed to IDEA-20260811-735c6b and is NOT silently assumed away here).
      Addressing time. The landmark set has density d = L/h in C. On a rapid
      mixer the expected hitting time of a set of density d is Theta(1/d)
      (HA-1), so
          T_addr = Theta(h / L) isogeny steps,
      each step costing Otilde(ell) = polylog(p) field operations for
      ell = O(log^2 p) with sqrt-elu, plus one hash-set probe.
      Advice size. S = S_DL + L entries, each Otilde(log p) bits.
      Requirement. T_addr <= T forces  L >= h / T.
      THE INEQUALITY THAT IS THE RESULT. Write T = N^tau. The CGK frontier fixes
      S_DL = N^{1-2*tau}. The landmark requirement is L = N^{1/2 - tau}, using
      h = N^{1/2+o(1)} (HA-2). Then
          L <= S_DL   <=>   1/2 - tau <= 1 - 2*tau   <=>   tau <= 1/2,
      which holds at EVERY point of the frontier, with EQUALITY exactly at
      tau = 1/2 (the no-advice corner). [fact, elementary]
      CONSEQUENCE. S = S_DL * (1 + N^{tau - 1/2 + o(1)}) = Theta(S_DL) for
      tau < 1/2. The landmark table is asymptotically free everywhere on the
      frontier, and the adaptive problem ACP is solvable at (S, T) =
      (N^{1-2*tau+o(1)}, N^{tau+o(1)}) for every tau in (0, 1/2].

    (D) THE MATCHING LOWER BOUND, WHICH USES THE SAME CHEAP DIRECTION AND IS THE
    REASON THE CONSTRUCTION CANNOT BE PUSHED FURTHER. [fact, given KN-LIT-013]
      Let ALG be any ACP algorithm with parameters (S, T, epsilon). Build a
      FIXED-GROUP CGK algorithm for (E_0, P_0): hardwire the same advice (legal,
      the preprocessor is non-uniform and knows (p,t)); on input (E_0, P_0, Q_0),
      run one random walk of length m from E_0, carrying P_0 and Q_0, landing on
      a curve E that is within 1/poly of uniform on C; feed (E, P, Q) to ALG;
      output its answer, which is the same k by T1. Overhead Otilde(1) steps.
      Hence any ACP algorithm yields a CGK algorithm with the same S and
      T + Otilde(1), so
          S * T^2 = Omega~(epsilon * N)
      holds in ACP verbatim. TOGETHER WITH (C) THIS IS TIGHT: the achievable
      (S,T) region of the ADAPTIVE class-structured problem EQUALS that of the
      fixed-group problem, up to N^{o(1)}.

    (E) THE SENTENCE THIS RECORD EXISTS TO WRITE. The asymmetry of T5 -- random
    transport cheap, specified transport hard -- is the only structural feature
    the isogeny class contributes to a preprocessing model, and it is
    EXACTLY SELF-CANCELLING: its cheap half is what lets the construction reach
    an unseen member for free, and the same cheap half is what carries the
    generic lower bound into the model. A separation would require a class in
    which random transport is cheap and the generic reduction of (D)
    nevertheless fails, and (D) shows no such class exists as long as the walk
    mixes. THE CLASS BUYS ROBUSTNESS OF THE ADVICE (one string valid for all h
    curves at once, at zero asymptotic cost) AND NOT ONE BIT OR ONE OPERATION OF
    ADVANTAGE.

    (F) THE CRITICALITY OBSERVATION, STATED SEPARATELY BECAUSE IT IS THE PART
    THAT IS NOT AUTOMATIC. Suppose the class had size h = N^{1/2 + gamma}. Then
    the landmark requirement becomes L = N^{1/2 + gamma - tau} and L <= S_DL
    holds only for tau <= 1/2 - gamma: for gamma > 0 the TOP of the frontier
    (short online time bought with little advice... i.e. tau near 1/2) breaks and
    the adaptive scheme pays a genuine addressing tax there. Because
    h = |D|^{1/2+o(1)} and |D| = |t^2 - 4p| is Theta(p) = Theta(N) for every
    ordinary trace bounded away from the Hasse endpoints, gamma = o(1) always.
    THE ISOGENY CLASS SITS AT THE CRITICAL SIZE, and not by design. This is a
    quotable fact about the object, it is checkable in one line, and it is the
    kind of coincidence that would have been reported as a mechanism if the
    inequality had gone the other way.

  resource_label: >-
    R8 primary (multi-instance / preprocessing structure -- the model itself is
    the resource), R4 secondary (the isogeny graph used as an ADDRESSING
    structure for advice, not as a source of congruences). No new taxonomy entry
    is needed. NOTE ON THE ADMISSIBILITY FILTER: steps 5-7 do apply isogenies to
    points of G, which is the pattern the filter closes -- and that is exactly
    why the record's verdict is a NON-separation. The filter is not evaded here;
    it is confirmed with an explicit constructive upper bound and a matching
    lower bound, which is strictly more than the filter alone gives.

  admissibility: inadmissible_generic_group

  admissibility_argument: >-
    Derived, not asserted. Part (D) exhibits a simulation in the direction that
    matters: an adversary against the adaptive class problem is convertible into
    an adversary against a single fixed group at Otilde(1) overhead, using only
    the cheap direction of T5. Everything the class contributes is therefore
    generic-group information plus a relabelling, which is H-ENDO-001's
    one-curve statement lifted to h curves and is consistent with
    KN-FIND-b7e091. The record is filed nonetheless because the CONSTRUCTIVE half
    (B)-(C) is not implied by the filter: the filter says the class cannot help,
    it does not say the class costs nothing, and a127ab's open adaptive case was
    exactly the possibility that it costs p^{1/4}. Showing the cost is zero is a
    positive statement about the model with a negative consequence for the attack.

  object_first_candidate:
    tracked_object: >-
      THE POSITION OF THE CURVE IN THE Cl(O)-TORSOR, i.e. the class-group
      address a with E = [a] E_0, tracked as the online algorithm walks -- and,
      dually, the ADVICE'S REACH, the subset of C from which the stored advice is
      usable within a given online budget.
    lossiness: >-
      GENUINELY LOSSY. The projection E |-> (its torsor position) discards the
      Weierstrass coefficients, the x-coordinate field data, every curve model,
      the factor-base geometry, and all point-level information. What is retained
      is one element of a group of size h ~ p^{1/2}, against a curve description
      of Theta(log p) bits and a point set of size N -- so this is not a change
      of coordinates by any reading. Contrast the protocol's worked negative
      example (Delta, Pi) in docs/inventor-protocol.md section 2, from which the
      unordered pair is recoverable: here NOTHING about the curve equation is
      recoverable from the address without solving a class-polynomial evaluation,
      and nothing about the points is recoverable at all.
    propagation: >-
      LOSSY-PROJECTION TEST, RUN AND PASSED, AND THE PASS IS EXACT. The target's
      operation is "take an ell-isogeny step". The address propagates
      deterministically under it -- a step by the ideal l multiplies the address
      by [l] -- and the discarded data (curve equation, points) is discarded
      COMPATIBLY, because the next address does not depend on it. So the retained
      part is a genuine one-step-computable dynamical variable, which is the
      condition the test demands.
    propagation_asymmetry: >-
      THE ONE PROPERTY THAT MAKES THE OBJECT INTERESTING RATHER THAN ROUTINE, AND
      IT IS THE AXIS'S CRUX RESTATED AS A PROPERTY OF THE OBJECT: the address is
      cheap to propagate FORWARD from a known start (each step is a multiplication
      in Cl(O) you performed yourself) and expensive to RECOVER for a curve handed
      to you (that is vectorization, sqrt(h) = p^{1/4} classically, T5). The
      object is a ONE-WAY dynamical variable. LWA is the observation that a
      preprocessing algorithm never needs to recover it -- it only needs to
      COLLIDE with a stored value of it, and collision is a forward-only
      operation.
    survival_score: >-
      Survives every horizontal isogeny in the class, unboundedly. Dies at (i)
      any step of degree sharing a factor with N (never happens for small-ell
      walks), (ii) non-fundamental D, where the torsor fragments into volcano
      levels and horizontal walks no longer reach all of C (scope limit S1),
      (iii) any question about the curve equation or the x-line, where the
      projection has already thrown the answer away -- which is exactly why this
      object says nothing about lane L1 and must not be read as doing so.

  mechanism: >-
    The advice is a table on ONE curve; the challenge is on ANOTHER, unknown at
    preprocessing time. There are exactly three ways to connect them and the
    record's content is that the third is free.
      ROUTE 1 -- ADDRESS THE CHALLENGE. Solve vectorization for E against E_0.
        Cost sqrt(h) = p^{1/4} classically (T5), with a concrete per-step
        blow-up that a127ab reports as 2^{112} at p = 2^{256} under a
        conservative O(ell^3) model. Asymptotically fine (1/4 < 1/3), concretely
        broken.
      ROUTE 2 -- STORE THE WHOLE CLASS. Advice contains all h addresses;
        addressing is O(1) online. Costs S >= h = N^{1/2} advice, which is on the
        frontier only at T = N^{1/4}, and is useless at larger T.
      ROUTE 3 -- LANDMARK COLLISION (this record). Store L << h landmarks with
        their paths; walk forward from the challenge until you collide with one.
        Cost Theta(h/L) forward steps and L entries of advice. This is a
        MEET-IN-THE-MIDDLE in which the preprocessor pays for one half in advance
        and the online phase pays the other, which is the standard shape of a
        time-memory tradeoff and is why it interpolates smoothly.
    Route 3 dominates Route 1 whenever L > h/sqrt(h) = sqrt(h) = N^{1/4}, and
    dominates Route 2 whenever T > 1. The frontier inequality of (C) says Route 3
    is always affordable out of the advice budget the DL table already needed.
    The per-step cost is the second half of why Route 3 beats Route 1
    concretely: Route 1 needs claw-finding over the class, which a127ab prices
    with ell = O(log^2 p) ~ 2^{16} and an O(ell^3) construction; Route 3 uses only
    a FIXED small prime set (CSIDH-style ell <= a few hundred) in the forward
    direction, so its per-step cost is Otilde(1) field operations with no
    modular-polynomial root-finding at large ell anywhere in the loop.

  why_not_a_renamed_known_approach: >-
    Nearest known objects, each named with the difference.
    (1) Bernstein-Lange / Mihailescu preprocessing for a FIXED group and the CGK
      frontier (KN-LIT-013, KN-TECH-005). Those are one group; the model here is
      h groups with a random challenge among them, and the question is whether
      the advice reaches an unseen one. LWA reduces to them at h = 1.
    (2) IDEA-20260807-a127ab. Same lane, and it is the direct ancestor: it
      transports a table across the class and prices path-finding at p^{1/4} via
      claw-finding, explicitly leaving the ADAPTIVE model as the case where its
      gate binds. LWA replaces claw-finding with a hitting-set collision, so it
      solves no vectorization, uses only small-ell forward steps, and closes the
      case a127ab left open. It also gives the matching LOWER bound, which
      a127ab does not attempt.
    (3) Rainbow tables / Hellman tradeoffs. Those invert a random function; here
      the stored objects are landmarks in a TORSOR and the online phase is a
      random walk with a mixing guarantee, not a chain reconstruction. The
      resemblance is real and is why the prior-art risk is nonzero and declared.
    (4) Distinguished-point stores in parallel collision search (KN-TECH-006).
      A DP store is a set of walk endpoints in a POINT group used for collision
      detection; a landmark set is a set of CURVES used for advice addressing.
      The bookkeeping rhymes; the objects and the models differ.
    (5) The van Oorschot-Wiener / vOW preprocessing lore for group actions --
      this record's part (B) step 3 is, extracted, a preprocessing algorithm for
      vectorization, and that extraction is filed SEPARATELY as
      IDEA-20260811-68fa90 rather than smuggled in here.

  predictions:
    - observable: hitting-time distribution of a landmark set in a fully enumerated toy class
      metric: >-
        empirical mean number of ell-isogeny steps from a uniformly random start
        until the walk first meets a landmark set of size L, in a fully
        enumerated ordinary class of size h at p in {2^16, 2^20, 2^24}
      direction: different
      minimum_effect: >-
        Predicted mean h/L and predicted distribution geometric with parameter
        L/h, for L/h across at least a decade. A measured mean exceeding 3*h/L at
        any tested (h, L) falsifies HA-1 at that scale and reinstates an
        addressing tax; a measured mean below h/3L means the landmark walks were
        not independent of the challenge walk and the instrument is wrong.
    - observable: the frontier inequality itself
      metric: >-
        max over tau in (0, 1/2] of (log_N L(tau) - log_N S_DL(tau)) computed
        symbolically with h set to the MEASURED class size of each toy class
      direction: lower
      minimum_effect: >-
        Must be <= 0 for every tau, i.e. the landmark budget never exceeds the DL
        budget. A positive value at any tau in the toy regime is the honest
        report that the o(1) in h = N^{1/2+o(1)} is doing real work at that scale,
        and it must be reported as a scale artifact rather than as a refutation
        of the asymptotic statement.
    - observable: reachable fraction of the class by horizontal walks
      metric: >-
        fraction of the enumerated class visited by a single walk of 100*h steps,
        reported separately for D fundamental and D non-fundamental
      direction: different
      minimum_effect: >-
        1.00 for D fundamental (scope S1). Strictly less than 1 for D
        non-fundamental confirms the volcano-level obstruction and bounds how far
        scope S1 can be relaxed. This is the arm that decides whether the result
        is about a generic class or only about a fundamental-discriminant one.
    - observable: transport correctness
      metric: >-
        fraction of transported instances on which the recovered k equals the
        planted k, over all landmark hits
      direction: higher
      minimum_effect: >-
        Exactly 1.000. This is T1 and is not in doubt; a single failure is an
        implementation fault and voids every other number in the run.

  minimal_test:
    design: >-
      STAGE 0 -- ZERO COMPUTE, AND IT IS THE CHEAPEST DISCRIMINATOR IN THE WHOLE
      BATCH. Two derivations on paper, each of which can kill the record on its
      own: (i) the inequality 1/2 - tau <= 1 - 2*tau for tau <= 1/2, with the
      landmark bit-cost and the DL-entry bit-cost written in the SAME units so
      that the polylog factors are seen to cancel rather than assumed to; (ii)
      the reduction of part (D), written out with the walk length and the
      statistical distance explicit. If (ii) is wrong the record claims a
      separation it has not earned; if (i) is wrong the construction is not free
      and a127ab's tax returns. Neither costs a CPU-second.
      STAGE 1 -- MINUTES, AND IT IS THE ONLY MEASUREMENT REQUIRED. On a single
      fully enumerated ordinary class with D fundamental at p ~ 2^16: enumerate
      C, build the Cayley graph on the 4-6 smallest split primes, choose L
      landmarks uniformly, and measure the hitting-time distribution from 10^4
      random starts, for L/h in {1/2, 1/8, 1/32, 1/128}. Compare against
      geometric(L/h). Run the two null arms below on the SAME code path.
      STAGE 2 -- LOW HOURS, OPTIONAL AND NOT REQUIRED FOR THE CLAIM. Repeat at
      p ~ 2^20 and 2^24 to see the o(1) shrink, and record the measured h against
      N^{1/2}.
      STAGE 3 -- ZERO COMPUTE. Write the crypto-scale table: for
      p = 2^256, tabulate (tau, S_DL, L, T_addr, T_DL) in field operations at
      tau in {1/3, 3/8, 5/12, 1/2}, including the per-step constant for
      sqrt-elu at ell <= 400, so that the concrete gate can be judged the way
      a127ab judged its own and NOT only asymptotically.
    controls:
      - >-
        NULL OBJECT 1 (MATCHED-SHAPE NULL, BLOCKING): repeat the identical
        hitting-time measurement on a RANDOM 2k-regular graph on h vertices with
        the same h, same degree, same L, same start distribution, same estimator.
        Prediction: statistically indistinguishable from the class graph. If the
        class graph is SLOWER than the random-graph null, T5's mixing claim is
        not being met at this scale and the construction's cost model is wrong;
        if the class graph is FASTER, the estimator is reading class structure it
        should not be able to see and the instrument is suspect.
      - >-
        NULL OBJECT 2 (NEGATIVE CONTROL, BLOCKING): the same measurement on a
        CYCLE of length h with the same L landmarks -- a graph with no spectral
        gap. Prediction: hitting time Theta(h^2/L^2)-ish, i.e. dramatically
        larger. The instrument MUST distinguish arms 1 and 2. An instrument that
        reports h/L on a cycle is measuring its own estimator and every number it
        produced is void.
      - >-
        PLANTED-SIGNAL ARM: insert one landmark at a curve KNOWN to be d steps
        from the start; the measured hitting time from that start must be <= d.
        Two-directional control per RQ-INSTR-f8faa0.
      - >-
        IDENTITY ARM: L = h (every curve a landmark). Measured hitting time must
        be exactly 0 steps. A nonzero value is pure instrument overhead and must
        be subtracted from every other cell.
    required_metrics:
      - mean and full empirical CDF of hitting time, per (h, L), per arm
      - measured class size h against N^{1/2} for each tested class
      - the symbolic max over tau of log_N(L) - log_N(S_DL) at the measured h
      - reachable fraction of C under horizontal walks, per discriminant type
      - transported-instance correctness rate (must be 1.000)
      - field-operation counts per isogeny step, so Stage 3's table is not invented

  controls:
    - >-
      Matched random-regular-graph null (NULL OBJECT 1) -- the primary null, and
      it is what makes a measured h/L mean readable as mixing rather than as
      arithmetic.
    - >-
      Cycle-graph negative control (NULL OBJECT 2) -- the instrument must fail to
      report h/L here.
    - >-
      Planted-landmark positive control.
    - >-
      L = h identity arm for overhead subtraction.
    - >-
      Non-fundamental-discriminant arm as the scope control for S1.

  confounders:
    - >-
      TOY CLASSES HAVE TINY h. At p = 2^16, h is of order 100, so h/L spans barely
      a decade and the o(1) in h = N^{1/2+o(1)} is enormous. Every exponent
      statement in this record is ASYMPTOTIC and the toy measurement tests only
      the hitting-time law, never the exponent inequality. Reporting a toy fit as
      evidence for the exponent would be the exact error this confounder exists to
      forbid.
    - >-
      UNIT MIXING. T_DL is counted in group operations on E_0; T_addr in isogeny
      steps; S in bits. The frontier inequality is only meaningful because the
      per-entry bit cost of a landmark and of a DL entry are both Otilde(log p).
      Any implementation whose landmark record is larger than Otilde(log p) bits
      (for instance one storing full curve equations plus kernel polynomials)
      breaks the cancellation and must be re-derived, not waved through.
    - >-
      WALK-LENGTH ACCOUNTING. Testing the landmark set at EVERY step (as in B.5)
      gives hitting time Theta(h/L) STEPS; testing only at the end of independent
      length-m walks gives Theta(h/L) WALKS, an m = O(log p) factor worse. The
      two are conflated easily and the record uses the first; any measurement must
      declare which it implements.
    - >-
      THE HASH-SET PROBE IS A MEMORY ACCESS. Theta(h/L) probes into an L-entry
      table are free in the RAM model and are not free under Wiener full cost.
      This record is explicitly RAM-model and hands the charge to
      IDEA-20260811-735c6b rather than pretending it does not exist.
    - >-
      CLASS ENUMERATION ORDER. If landmarks are chosen by enumeration order
      rather than uniformly, they may cluster in the Cayley graph and the hitting
      time will beat h/L for a reason that has nothing to do with mixing. Landmark
      selection must be uniform and the selection seed recorded.

  falsification_conditions:
    - >-
      The reduction of part (D) is wrong -- for instance if the walk from E_0
      cannot be shown to land within 1/poly of uniform, so the ACP challenge
      distribution is not reproduced. Then the lower bound does not transfer, the
      record's central non-separation claim collapses, and ACP becomes a genuinely
      open model in which a separation is not excluded. THIS IS THE MOST
      INFORMATIVE POSSIBLE FAILURE and it is checkable on paper.
    - >-
      The frontier inequality fails once landmark and DL entries are charged in
      honest bits -- e.g. if a usable landmark record needs omega(log p) bits.
      Then addressing is not free and the adaptive tax returns, with a crossover
      that must be computed rather than asserted.
    - >-
      Measured hitting time is not Theta(h/L) on the class graph while the
      random-regular null does show Theta(h/L). T5's mixing is then not delivering
      at the tested scale, HA-1 is falsified there, and the construction's cost
      model must be rebuilt on measured mixing rather than on the GRH statement.
    - >-
      Horizontal walks fail to cover C even for D fundamental. The torsor
      assumption is wrong and scope S1 is not the right scope.
    - >-
      Someone exhibits a class-structured preprocessing algorithm below
      S*T^2 = N. Then (D) has an error, and finding it is worth more than this
      record.

  interpretation_limits:
    - >-
      TOY SCALE ONLY for every measured quantity; claim_tier toy. No statement
      about any deployed curve.
    - >-
      THIS IS NOT AN ATTACK AND IMPROVES NO ATTACK. It reaches the published CGK
      frontier and never goes below it. sota_delta is exactly zero.
    - >-
      RAM MODEL ONLY. The advice is charged in bits and probes are charged at
      O(1). Under full cost (KN-TECH-035) the conclusion is expected to be WORSE
      for the preprocessing side, not better; that audit is a separate record.
    - >-
      SCOPE S1: D = t^2 - 4p fundamental, so C is one Cl(O)-torsor. For
      non-fundamental D the class is a volcano and horizontal walks do not reach
      all of it; the construction then needs vertical steps and the cost model
      must be redone. Not assumed away, not solved here.
