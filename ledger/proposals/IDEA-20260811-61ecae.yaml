  assumptions:
    - >-
      E ordinary over F_p, p > 3, D = t^2 - 4p fundamental (scope S1), and N the
      large prime factor of #E(F_p) with N > 4*sqrt(p) so that the order-N
      subgroup is unique.
    - >-
      T1 (transport) as stated in DECOMPOSITION.md section 3, which is elementary
      and is the only unqualified mathematical claim that document asserts.
    - >-
      Deuring/Waterhouse: the set of F_p-isomorphism classes with trace t is a
      Cl(O)-torsor for O = Z[pi] = O_K under S1. [recall-confident, standard, not
      re-verified this session]
    - >-
      CGK's S*T^2 = Omega~(epsilon*N) for prime-order generic groups with
      preprocessing, and its tightness (KN-LIT-013, relayed at KN-TECH-005; the
      corpus entry itself records that the full paper was not read).
    - >-
      Velu / sqrt-elu evaluation of an ell-isogeny on a point at Otilde(sqrt(ell))
      to Otilde(ell) field operations. [recall-confident, not re-verified]
    - >-
      WEB VERIFICATION WAS UNAVAILABLE THIS SESSION. Both WebSearch and WebFetch
      returned a backend model error on every attempt, so no external citation in
