      the path GIVEN, and its OPEN-3 explicitly leaves non-negligible transport
      cost unsettled. This record is about ONE advice string reaching MANY curves,
      not about which curve to preprocess on; its lower bound is a distributional
      reduction rather than a pointwise simulation; and it retires OPEN-3 for the
      small-ell walk regime by exhibiting a transport route whose cost is
      Otilde(1) per step. It does not touch a2fb45's OPEN-1 (non-group-level
      functionals) and must not be read as doing so.
    - >-
      IDEA-20260807-ea3915 -- defines an M-GROUP preprocessing model over M
      INDEPENDENT encodings, conjectures S*T^2 = Omega~(eps*M*N) there, and shows
      the class achieves N(1+o(1)) for all M, giving a factor-M separation whose
      content is "these encodings are efficiently isomorphic". That model's M
      encodings are handed to the algorithm together and the identification is
      free. This record's model hands the algorithm ONE randomly chosen encoding
      and charges the identification, which is the case ea3915's framing cannot
      express. The two conclusions are consistent and this one is strictly more
      conservative: ea3915 reports a factor-M win in a resource, this reports zero
      win once the identification is charged.
    - >-
      IDEA-20260807-406fef -- fixes the correct MULTI-TARGET baseline
      (Kuhn-Struik sqrt(M*N), Yun's tight generic Theta(sqrt(M*N))) and computes a
      preprocessing-times-multi-target frontier at M^{1/2}*N^{1/3} time and
      M*N^{1/3} memory, concluding the class contributes nothing. That is M
      targets; this is one target on an unknown curve. Its conclusion and this
      record's agree and neither is used to support the other.
    - >-
      IDEA-20260807-e0ddc6 -- the transport COMPATIBILITY dichotomy (advice
      survives transport iff its value depends on the pairing, not the encoding).
      That classifies WHICH advice transports; this record takes the transporting
      case (a known-log table, e0ddc6's 100% class) as given and asks what it
      costs to FIND the transport. Orthogonal questions, and e0ddc6 is a
      prerequisite for this record rather than an alternative to it.
    - >-
      IDEA-20260807-0e8977 -- the transport null battery, whose null is a randomly
      relabelled table of identical size and whose acceptance criterion is
      retention affine in the mixing fraction alpha. That instruments RETENTION;
      this record instruments HITTING TIME, a quantity 0e8977 does not measure,
      and takes its own nulls (random regular graph, cycle) from a different
      family. If both run, 0e8977 validates the transport step and this validates
      the addressing step.
    - >-
      IDEA-20260807-15b468 -- distinguished-point predicate invariance under the
      automorphism quotient (lane L6). Same word "distinguished", entirely
      different object: a predicate on POINTS of one curve, versus a stored set of
      CURVES. Read in full during screening to confirm non-overlap.
    - >-
      IDEA-20260805-de1490 / IDEA-20260806-9c2f80 -- hitting time of a density-d
      set on isogeny graphs, in a supersingular descent context under other goals.
      This record CITES their Theta(1/d) statement as in-corpus support for HA-1
      and claims no rediscovery of it; what is new here is the use of that
      quantity as an ADVICE-ADDRESSING cost inside a preprocessing frontier.
    - >-
      H-ENDO-001 and KN-FIND-b7e091 -- the admissibility filter and the
      generic-group closure at exponent 1/2. This record neither retests nor
      re-litigates either; part (D) is consistent with both and part (E) says so
      explicitly.

