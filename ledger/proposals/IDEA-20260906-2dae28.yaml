    "title": "Frobenius-module-aware selection of typed factor bases",
    "class": "algorithm",
    "claim": "R3 representation at the extension-field descended-system stage. Typed submodule selection can improve the fully charged finite cost over the best single invariant base by >=20%, while reproducing the primary paper's conditional cost formulas only when their exact hypotheses hold. No n² relation-search gain is assumed.",
    "mechanism": "Object: a typed factor-base module cover and the actual reduced relation-row space. Operation set Sigma: apply Frobenius, rewrite point orbits with their known scalar action, and add a row only through exact modular rank accounting. Trichotomy: coordinate-dependent; this is a solver/representation object, not a lossy quotient under the full group translation action. Discarded information: point-orbit labels are quotiented, but each relation retains its scalar weights and target coefficient; Frobenius multiples may become dependent after this quotient. For n prime to char(F_q), factor T^n-1 to enumerate admissible invariant coordinate subspaces. Form a small set-cover optimization over distinct candidate bases, minimizing charged decomposition work plus the larger union's linear algebra cost. Do not equate coordinate-subspace dimension, number of conjugate identities and independent logarithm rows. In a prime-order subgroup, pi acts as a scalar mu; after reduction an orbit of a known row can collapse to scalar multiples, and the algorithm must detect this.",
