# IDEA-20261004-25eeb0
# Wider window-table count. Proposal only. Not approved.
idea:
  id: IDEA-20261004-25eeb0
  question_id: RQ-ECDLP-002
  added: '2026-10-04'
  status: proposed
  approved_by: null
  title: >-
    A width-20 window table stores 524288 entries and a width-19 table stores 262144
  class: representation
  claim: >-
    A window of width 20 stores 524288 precomputed entries. A window of
    width 19 stores 262144. Five hundred twenty-four thousand two hundred
    eighty-eight exceeds two hundred sixty-two thousand one hundred
    forty-four by 262144. The product of the two table sizes is
    137438953472. Their sum is 786432. The gap is a table size, not an
    ECDLP exponent.
  mechanism: >-
    OBJECT FRAME. The object is the precomputed table. The operation
    set is reading one entry during a recoding. Two to the power
    19 is 524288. Two to the power 18 is 262144. Two width-19 tables both
    store 262144, so that gap is 0 and their product is 68719476736. No
    curve point is added.
  novelty_status: unverified
  citations:
    - ref: RQ-ECDLP-002
      provenance: internal
      claim: >-
        The question asks for a checkable route toward an attack-cost change.
      verified_by: coordinator session 2026-10-04, question file present
    - ref: KR-RHO-ea34b8
      provenance: internal
      claim: >-
        Precomputation-table bounds are a different scale from these two sizes.
      verified_by: coordinator session 2026-10-04, frontier row on disk
  assumptions:
    - The two widths are frozen before the powers are taken.
    - No curve point is added.
  proof_search_map:
    bottleneck: The table-size gap 262144.
    baseline_embedding:
      parameter_slice: The widths 20 and 19 and the sizes 524288 and 262144.
      reproduction_check: >-
        Two readers must agree that 2 to the power 19 is 524288 and that
        2 to the power 18 is 262144.
    observation_collision:
      observable: The table-size gap and the product.
      distinct_preimage_search: >-
        Reporting both tables as size 262144 drops the gap. Two width-19
        tables make that gap 0.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The width-19 table.
        predicted_gain: Two hundred sixty-two thousand one hundred forty-four fewer stored entries. No exponent.
    quantifier_order: >-
      The widths are fixed before the sizes.
    method_ceiling:
      strongest_certifiable_claim: >-
        The table sizes 524288 and 262144. Not a scalar multiplication.
      nearby_object_control: >-
        Two width-19 tables. Both store 262144, and the gap is 0.
    proof_obligations:
      - claim: The width-20 table stores 524288 entries.
        responsibility: size
      - claim: The width-19 table stores 262144 entries.
        responsibility: size
      - claim: The gap is not an exponent.
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: table_gap
      direction: different
      minimum_effect: Five hundred twenty-four thousand two hundred eighty-eight exceeds two hundred sixty-two thousand one hundred forty-four by 262144.
  minimal_test:
    design: >-
      Compute 2 to the power 19 and 2 to the power 18. Do not add a
      curve point.
    controls:
      - Two width-19 tables, whose size gap is 0.
      - An independent count.
    required_metrics:
      - both table sizes
      - the gap
      - the product
  falsification_conditions:
    - The width-20 table size is not 524288.
    - The product of the two sizes is not 137438953472.
  confounders:
    - A width-19 table of size 262144 is a different window from a width-18 table of size 131072.
  interpretation_limits:
    - A table size is not a walk length.
    - No transfer to a cryptographic scalar.
    - This is not the table-size pair 262144 and 131072.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The frozen width-20 table has size 2 to the power 19, and the
        frozen width-19 table has size 2 to the power 18.
      rigorous_support: >-
        No scalar-multiplication theorem is claimed. The count is
        a reading of two powers of 2.
      validation_plan: >-
        Two independent powers. A mismatch voids the gap.
  target_complexity:
    time_exponent: No exponent claimed.
    memory_exponent: Five hundred twenty-four thousand two hundred eighty-eight stored entries versus two hundred sixty-two thousand one hundred forty-four, a constant factor.
    best_known: Generic rho at exponent 1/2. This idea does not compete.
    hidden_overhead: Recoding cost is not counted.
    tradeoff_note: A larger table can shorten digits and does not by itself shorten a walk.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: low
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-ea34b8
      - KR-RHO-53c89f
      - KR-RHO-13bf67
      - KR-RHO-38be82
      - KR-RHO-cb1c58
    nearest:
      - ref: KR-RHO-ea34b8
        provenance: internal
        relation: adjacent
        delta: >-
          That row bounds precomputation tables at cryptographic
          size. This record counts table sizes 524288 and 262144 and claims
          no precomputation attack.
  dominated_by: >-
    No attack is claimed. Rho dominates any attack reading of a table size.
  sota_delta:
    time: zero attack delta
    memory: a constant factor of 524288 versus 262144
    data_queries: Two frozen widths.
  amazon_bedrock: NOT SELECTED, NOT CONFIGURED, NOT PROBED, NOT CONTACTED, NOT USED.
