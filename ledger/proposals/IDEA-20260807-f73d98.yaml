  question_id: RQ-CRYPTO-001
  added: '2026-08-07'
  title: 'TWENTY-TWO research questions and eleven of the fourteen never-launched goals are blocked
    by a constraint of the form ''no experiment may be designed until primary sources are filed'',
    on a premise that is DATED, UNTESTED SINCE, AND PARTLY FALSE: FIPS 203/204/205 and arXiv PDFs
    download in full from this environment today'
  class: tooling
  claim: '22 of 52 RQ records carry a constraint of the form ''Every per-scheme technical claim
    in this record is sourced from secondary reporting ... No experiment may be designed until
    the relevant primary sources are read and filed as KN-LIT entries'': RQ-ECDSA-87625f, RQ-ECTD-001,
    RQ-FAEST-001, RQ-FHE-001, RQ-FNDSA-001, RQ-FRODO-3260cc, RQ-HAWK-001, RQ-HQC-001, RQ-MAYO-001,
    RQ-MCE-e65b3c, RQ-MLDSA-001, RQ-MLDSA-ffa0f5, RQ-MLKEM-003, RQ-MQOM-001, RQ-QRUOV-001, RQ-RSA-afe33c,
    RQ-SDITH-001, RQ-SLHDSA-001, RQ-SNOVA-001, RQ-SQISIGN-001, RQ-SQISIGN-39f231, RQ-UOV-001.
    Eleven of the fourteen draft goals name that gate in next_action as the reason they have not
    opened -- GOAL-FRODO-001 says ''THE SOURCE GATE IS SHUT AND MUST BE OPENED FIRST''. PUBLICATION-CANDIDATES.md
    (2026-08-02) states the premise: ''no primary source is reachable from this environment (eprint.iacr.org,
    csrc.nist.gov, arxiv.org all blocked)''. MEASURED BY THE SESSION THAT FILED THIS RECORD, 2026-08-07,
    FROM THIS ENVIRONMENT: nvlpubs.nist.gov serves FIPS 203, 204 and 205 as complete valid PDFs
    (1,252,341 / 3,291,746 / 1,055,752 bytes); csrc.nist.gov returns 200; an arXiv PDF returns
    200 and 706,116 bytes of valid PDF; an eprint ABSTRACT page returns 200 with correct title,
    authors and abstract; and only the eprint /NNNN.pdf endpoint returns 403, whose body is a
    Cloudflare interactive JS challenge -- NOT a network-policy block. GOAL-MLDSA-002 is blocked
    on acquiring FIPS 204 and GOAL-SLHDSA-001 on FIPS 205; both download today. The gate is not
    a fact about the world; it is an inherited premise nobody re-measures.'
  mechanism: 'Build a PER-SOURCE, DATED REACHABILITY PROBE and make it a recorded artifact rather
    than a belief. For each source class the program depends on -- nvlpubs.nist.gov, csrc.nist.gov,
    arxiv.org (abs and pdf), eprint.iacr.org (abs and pdf), Crossref, DBLP, raw.githubusercontent.com
    -- record on each run: the URL class, the HTTP status, the returned content type and size,
    whether the body is the artifact or a challenge/error page, and the date. Emit it as a small
    committed record that any goal''s source gate can cite instead of quoting a 2026-08-02 sentence.
    Then, for the goals whose named sources are NIST standards or arXiv-hosted, OPEN THE GATE:
    acquire, file with provenance level, and transcribe. The gate itself stays -- designing experiments
    on secondhand figures is the right prohibition; what changes is that it closes and opens on
    a measurement rather than on inheritance.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - A grep of ledger/proposals for reachability, source-gate and retrieval framing returns no
      record proposing a reachability probe; the concept appears only as prose inside goal and
      question records.
    - The gathers are careful and dated (GATHER-20260803 records DBLP as unreachable with the
      routes tried, and no entry claims DBLP verification), which is exactly the discipline this
      record generalizes -- the gather pipeline reaches eprint listings and the arXiv API successfully,
      so the blocked thing is FULL PRIMARY TEXT from one host, not 'sources'.
    - KN-OPEN-3f7a21 records that 7457 of 7666 literature entries claim citation_verified against
      a source the program believed unreachable; a working probe is a precondition for resolving
      it.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS: any research claim. This is harness work whose
      entire content is a measurement about the environment.'
    tracked_object: The per-source retrievability verdict as a dated tuple (host, URL class, status,
      content type, size, artifact-or-challenge).
    one_step_propagation_rule: Each probe run appends one dated tuple per source class; a gate
      cites the latest tuple rather than a sentence.
    newness_score: Zero as mathematics. It converts a load-bearing premise from inherited belief
      into a dated measurement, and it currently unblocks named goals.
  lossy_projection_identifiability_audit:
    projection: the network environment -> a table of per-source verdicts.
    what_is_discarded: Everything about why a source is or is not reachable.
    is_it_only_a_change_of_coordinates: 'NO -- the table does not currently exist in any form,
      and the belief it replaces is both undated and partly wrong. Honest caveat: a probe result
      is valid only on its date and for the routes tried, and the record must say so on every
      row, exactly as GATHER-20260803 does for DBLP.'
    mirror_failure_check: 'CHECKED. The probe must be able to report BOTH reachable and unreachable.
      It does: as measured, NIST and arXiv are reachable and the eprint PDF endpoint is not, so
      both verdicts are already forced on the first run.'
  null_object_control:
    primary_null: A DELIBERATELY UNREACHABLE HOST (a non-existent domain) must report unreachable,
      and a KNOWN-GOOD host must report reachable. A probe that reports everything reachable is
      a control that cannot fail, which is precisely the failure mode that produced the current
      situation in the other direction.
    secondary_nulls:
    - 'CHALLENGE-DETECTION GATE: the probe must distinguish an HTTP 200 serving a bot-challenge
      page from an HTTP 200 serving the artifact. The eprint PDF case shows why: the naive reading
      of a status code would have been wrong in both directions at different times.'
    - 'ARTIFACT VALIDATION: a retrieved PDF must be validated as a PDF, not counted by status
      code.'
  assumptions: []
  predictions:
  - metric: number of the 22 gated questions whose named primary sources are retrievable today
    direction: higher
    minimum_effect: At least three (FIPS 203, 204, 205 are measured retrievable), which is already
      more than zero.
  minimal_test:
    design: Implement the probe over the seven source classes with the challenge-detection and
      artifact-validation gates and the two forced-value hosts; run it; commit the dated table;
      then, for each of the 22 gated questions, record which of its named sources the table says
      are retrievable, and open the gate where they are.
    controls:
    - non-existent host forced-unreachable
    - known-good host forced-reachable
    - challenge-detection gate
    - PDF artifact validation
    required_metrics:
    - per-source dated verdict tuple
    - per-gated-question retrievable-source count
    - list of questions whose gate can open today
  falsification_conditions:
  - 'Every named source is unreachable: the gate is correct as inherited and the record''s premise
    is wrong -- which would be a clean negative and would at least make the premise dated.'
  - 'The probe cannot distinguish a challenge page from an artifact: the instrument is unusable
    and must be repaired before any gate cites it.'
  - 'Sources are reachable and the gates open: eleven draft goals lose their stated blocker, which
    is the expected outcome for at least the NIST-sourced ones.'
  confounders:
  - Reachability is per-date and per-route; a verdict quoted without its date repeats the current
    error in the opposite direction.
  - A retrievable PDF is not a read paper; opening the gate creates transcription work, it does
    not discharge it.
  - Different tools traverse the proxy differently -- a status observed through one client does
    not guarantee another behaves the same, and the probe should record the client.
  interpretation_limits:
  - This is infrastructure. It supports no mathematical claim and no security claim.
  - Opening a question's source gate is a Coordinator act; this record supplies the measurement
    the act would rest on.
  - Nothing here weakens the prohibition on designing experiments from secondhand figures. It
    makes the prohibition's trigger measurable.
  heuristic_assumptions:
  - id: HEUR-SRC-1
    statement: Retrievability measured on one date is a usable basis for opening a gate that will
      be acted on over the following days.
    rigorous_support: None; Cloudflare posture and proxy policy both change without notice.
    validation_plan: Re-run the probe at the start of any batch that depends on it, and record
      the run in the batch.
