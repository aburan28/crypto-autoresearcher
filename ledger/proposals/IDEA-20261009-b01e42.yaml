    observation_collision:
      observable: rank through a prescribed fibre vs chi
      distinct_preimage_search: |-
        constant-j and supersingular surfaces reach the bound geometrically; they must be flagged so a high rank is not credited to the prescribed-fibre construction
    constructive_transforms:
