      responsibility: correctness
    - claim: |-
        prescribed fibre is isomorphic to E over F_p, not merely over the closure (twist class)
      responsibility: scope
  predictions:
  - metric: fraction_of_random_constrained_surfaces_with_rank_le_1
    direction: higher
    minimum_effect: '> 0.99 at chi <= 3 and every p'
  - metric: density_of_j_invariants_of_Fp_rational_fibres_on_high_rank_surfaces
