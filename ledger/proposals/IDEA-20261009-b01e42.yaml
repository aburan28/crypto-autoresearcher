      1. p in {2^8, 2^12, 2^16}; chi in {1, 2, 3}. Rank via the zeta function of S (point counts over F_{p^k}, k <= 10) and Shioda-Tate, with Tate's conjecture known for elliptic surfaces; exact generators by section search where feasible.
      2. (a) 10^3 random constrained surfaces per (p, chi).
      3. (b) enumerate fibres of Ulmer y^2 + xy = x^3 - t^d, Shioda Fermat-quotient surfaces, and their quadratic twists by polynomials f(t); record realized (j, twist class) pairs.
      4. (c) targeted search: twist by (t - t_0) g(t), vary g to hit the target twist class, measure the rank change.
    controls:
