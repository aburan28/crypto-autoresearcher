        quadratic twist by (t - t_0) g(t) of an Ulmer/Shioda surface to move the twist class at t_0
      predicted_gain: rank change measured; prediction is loss, not gain
    quantifier_order: |-
      for all tested chi <= 3 and p, and all tested constructions, there exists no surface with a prescribed generic ordinary fibre and rank >= 12 chi - 4 - O(1)
    method_ceiling:
