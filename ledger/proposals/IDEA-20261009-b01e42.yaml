  - |-
    (b) a high-rank family whose F_p-rational fibres realise a density of j-invariants above 12 chi / p, or a twist construction that hits random targets with the right twist class for more than O(1) targets.
  - |-
    (c) ALIVE: a construction reaching rank >= 12 chi - 4 - O(1) through a prescribed generic ordinary fibre at the tested p.
