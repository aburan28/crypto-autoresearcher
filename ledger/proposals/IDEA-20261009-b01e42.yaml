  title: |-
    Can a prescribed ordinary E/F_p be a fibre of a high-rank elliptic surface over F_p(t)?
  class: mechanism
  claim: |-
    (a) random A, B of degrees <= 4 chi, 6 chi constrained through E at t_0 have rank 0 or 1 with probability > 0.99 for chi <= 3; (b) for Shioda / Ulmer-type surfaces the j-invariants of F_p-rational fibres have density <= 12 chi / p, and matching a random target j with the correct twist class fails for all but O(1) targets; (c) no tested construction reaches r >= (12 chi - 4)/2 through a prescribed generic ordinary fibre. Alive if some family reaches r >= 12 chi - 4 - O(1) through a prescribed generic ordinary fibre.
  mechanism: |-
    MW rank over F_p(t) is unbounded (Shioda, Ulmer) and bounded above by 12 chi - 4 (Shioda-Tate with b_2 = 12 chi - 2). The known high-rank surfaces are isotrivial or j-special. A function-field lift of E needs S -> P^1 with S_{t_0} isomorphic to E and rank r about log p / log m.
  novelty_status: unverified
  citations:
  - ref: Shioda 1986 and 1990 Mordell-Weil lattices
    source_text: Shioda 1986 and 1990 Mordell-Weil lattices
    provenance: recalled
    claim: Mordell-Weil lattices and rank bounds for elliptic surfaces
    verified_by: null
