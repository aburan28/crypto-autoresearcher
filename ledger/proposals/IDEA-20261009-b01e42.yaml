  assumptions:
  - |-
    Batch claim boundary: Every experiment is a bounded mathematical measurement on synthetic or known-answer instances at small p. No private-key recovery, no attack on deployed curves or keys. A working toy-p prototype is "finite control", never "subexponential ECDLP". Theorem-closed items can produce receipts, never results.
  proof_search_map:
    not_applicable_reason: null
    bottleneck: |-
      realising a prescribed ordinary E/F_p as a fibre of a surface whose rank over F_p(t) is near the Shioda-Tate bound; known unbounded-rank families (Ulmer, Shioda) fix j or are isotrivial
    baseline_embedding:
      parameter_slice: |-
        chi = 1, deg a <= 4, deg b <= 6: the program's XEDN surfaces (KN-FIND-004/005/010/011), rank from section search
      reproduction_check: |-
