idea:
  id: IDEA-20260828-a435cc
  question_id: RQ-DREG-001
  added: '2026-08-28'
  title: >-
    Operationalize H-DREG-001's own "bootstrap CIs... and a prediction
    interval at n=30" requirement with a formal multi-model comparison
    (bounded / linear / power-law / saturating) on the FOUR already-committed
    D5 deficit points (n=12:1322, n=15:1862, n=17:1823, n=18:1999,
    plus n=21:2724 per H-DREG-5a3ac1), executable today at zero new compute
  class: measurement
  claim: >-
    A formal, pre-registered multi-model comparison (bounded/saturating,
    linear, power-law) applied to the four-to-five already-committed D5
    deficit points (n=12,15,17,18[,21]) produces a rigorous CI on the growth
    exponent, a model-selection verdict among candidate functional forms,
    and a genuine out-of-sample prediction interval at n=30 -- deliverables
    RQ-DREG-001's own decision_target and H-DREG-001's own predictions
    already require but that no committed record yet supplies.
  mechanism: >-
    RQ-DREG-001's decision_target requires "bootstrap CIs on both arms and a
    stated prediction interval at n=30"; H-DREG-001's own predictions require
    a CI on the deficit's growth exponent that "excludes 1 from below" for a
    departure verdict. Neither of these is itself a method -- they are
    requirements stated without a procedure. Standard nonlinear regression
    plus AIC/BIC model comparison and bootstrap resampling, applied directly
    to the already-committed sequence (which is explicitly noted elsewhere,
    per the lane-contract's own series and IDEA-20260805-2dc8de's title, to
    be non-monotonic: 1322, 1862, 1823, 1999, ...), supplies exactly that
    procedure at zero new compute, using only numbers this program already
    has. The mechanism is purely statistical: candidate functional forms
    (bounded-asymptote vs linear vs power-law) make different, checkable
    out-of-sample predictions when fit on a subset of the committed points
    and evaluated against the held-out remainder, which is what discriminates
    them.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-28'
    corpus_paths_grepped: [ledger/proposals (RQ-DREG-001 subset)]
    grep_results:
      - "IDEA-20260805-2dc8de's title states the raw deficit 'does not even
         grow monotonically' and argues about WHICH decision variable
         (normalized vs raw) to use -- a different question (choice of
         metric) from this idea's question (given a chosen metric, what is
         the rigorous CI/prediction-interval procedure). Not read in full
         this session; flagged as the nearest neighbor and the discriminating
         experiment (does 2dc8de's normalization choice change which model
         wins the comparison?) is named explicitly as this idea's own
         stage 1 deliverable."
      - "H-DREG-001 itself states the growth-exponent CI requirement as a
         PREDICTION, not a method; no proposal supplies the method."
    conclusion: >-
      Standard technique (bootstrap, AIC/BIC model comparison) not previously
      proposed in this specific application within the RQ-DREG-001 set, as
      far as this grep found; classified unverified pending a full read of
      2dc8de (not performed this session due to budget) to rule out overlap
      more strongly.
  citations: []
  assumptions:
    - "The 4-5 committed D5 deficit points (n=12,15,17,18[,21]) are each single-seed or low-replicate measurements (per the lane-contract's own >=3-seed requirement for FUTURE rungs) -- this idea's bootstrap must therefore resample over what replicate structure actually exists in the committed records, and report honestly if that structure is too thin (e.g. n=1 seed per point) to support anything beyond a qualitative model comparison."
  predictions:
    - metric: "AIC/BIC-preferred model among {bounded-asymptote, linear, power-law n^alpha} fit to the committed D5 deficit sequence"
      direction: different
      minimum_effect: >-
        A model selection with a reported delta-AIC (or equivalent) gap of
        at least 2 between the best and second-best model is a genuine
        discrimination; a gap under 2 across all models is reported as
        UNINFORMATIVE at current data volume (5 points), which is itself the
        useful, honest finding this program's own H-DREG-001 needs before
        trusting any growth-exponent claim.
    - metric: "bootstrap CI on the power-law exponent alpha (deficit ~ n^alpha), replicate-structure permitting"
      direction: different
      minimum_effect: "CI reported whether or not it excludes 1; H-DREG-001's own falsification condition (excludes 1 from below) is evaluated directly against this CI, not asserted."
    - metric: "prediction interval for deficit(n=30) under the AIC-preferred model"
      direction: different
      minimum_effect: "a stated, frozen interval width; whether it is wide enough to be uninformative is reported honestly, not narrated toward either arm of H-DREG-001."
  minimal_test:
    design: >-
      Pure statistics on already-committed numbers: extract every committed
      (n, D5 deficit, replicate count) triple from the cited evidence records
      (EV-DREG-*, the lane-contract's own series, H-DREG-152cff/5a3ac1's
      cited reconstructions); fit candidate models via standard nonlinear
      least squares / GLM; compute AIC/BIC; bootstrap over available
      replicates (or, if replicates are too thin, over a residual-resampling
      scheme, explicitly flagged as a weaker substitute); report the CI and
      prediction interval. No new run, no new rank, no Sage dependency.
    controls:
      - "Held-out validation: fit using only n in {12,15,17}, predict n=18 and n=21, compare to the committed values -- a real, pre-registered leave-future-out test using data this program already has."
      - "Null-arm parallel: repeat the identical procedure on whatever null-arm deficit series is committed (if any exists in comparable volume), since RQ-DREG-001's decision_target requires CIs 'on both arms.'"
    required_metrics: ["AIC/BIC table across candidate models", "bootstrap CI on growth exponent", "leave-future-out prediction error at n=18,21", "prediction interval at n=30"]
  falsification_conditions:
    - "The leave-future-out control (fit on n<=17, predict n=18/21) misses badly (e.g. outside a 90% interval): the candidate model family itself is inadequate and must be reported as such, not silently re-fit on all data."
    - "All candidate models are statistically indistinguishable (delta-AIC < 2): the committed data volume (4-5 points) is simply insufficient for ANY growth-law conclusion, which directly informs whether pursuing the n=15+ memory wall (to add data points) is worth the infrastructure cost -- a genuinely decision-relevant negative for the goal's own 'retry / reconsider frontier / pause' choice."
  confounders:
    - "The committed points are not uniformly replicated (some single-seed, per lane-contract's own note that only FUTURE rungs require >=3 seeds) -- treating them as equally precise would understate the true CI width; this must be disclosed and, where possible, corrected via known per-point seed counts rather than assumed uniform."
    - "n=17's value (1823, per the lane-contract's committed series) is reported LOWER than n=15's (1862) -- if this is itself an artifact of a DIFFERENT null convention or partition than the other points (cf. H-DREG-5a3ac1's finding that two different null conventions differ by 7,110 at one cell), the model comparison could be fitting convention noise rather than genuine growth; stage 0 of the minimal test must verify convention-consistency across all cited points before fitting anything."
  interpretation_limits:
    - "This is a STATISTICAL procedure, not a new measurement; it cannot supply a new completion-criterion rung and does not touch H-DREG-001's status (Coordinator authority only)."
    - "With only 4-5 points, even a rigorous procedure may be able to do no more than report 'uninformative' -- that is a valid, useful, and cheap outcome, not a failure of the idea."
  heuristic_assumptions:
    - id: HEUR-DREG-GROWTHLAW-1
      statement: >-
        The committed D5 deficit sequence across n is drawn from a smooth
        (or asymptotically smooth) underlying growth process, so that
        standard nonlinear regression and AIC/BIC model comparison are
        appropriate tools, imitating the classical use of these tools for
        small-sample growth-curve discrimination.
      rigorous_support: >-
        Standard statistical practice; the heuristic content is entirely in
        whether 4-5 points (of possibly inconsistent replicate depth and
        possibly inconsistent null convention, per the confounders above)
        are enough to trust ANY such fit -- which is exactly what the
        leave-future-out control and the delta-AIC reporting are designed to
        expose rather than paper over.
      validation_plan: >-
        The leave-future-out control (fit on n<=17, predict n=18 and n=21)
        IS the validation: if it fails, the heuristic is reported as
        unsupported at current data volume, full stop, before any n=30
        prediction interval is presented as meaningful.
  target_complexity:
    time_exponent: "n/a (statistical procedure on already-committed data, not an algorithmic claim about d_reg itself)"
    memory_exponent: "n/a"
    best_known: "n/a"
    hidden_overhead: "n/a"
    tradeoff_note: "n/a"
  dominated_by: "n/a (no result claimed; a statistical-rigor contribution to interpreting already-committed measurements)"
  sota_delta: "ZERO on any ECDLP axis; not applicable to d_reg complexity claims at all."
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium

