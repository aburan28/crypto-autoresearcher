idea:
  id: IDEA-20260930-14c753
  question_id: RQ-CERTBIN-836ce2
  added: '2026-09-30'
  status: proposed
  approved_by: null
  title: >-
    The four-target union column is the rare-event linearization, and it
    is not a batch discrete-logarithm speedup
  class: control
  claim: >-
    Representation class R1 of RQ-ECDLP-623a32 (x-coordinate). The attack
    stage is relation collection's success probability on L targets, with
    every membership test charged. This record cannot change the time
    exponent. It is the control that kills a hopeful reading of the
    audit's four-target column.

    Let p <= min(1, C(B+m-1, m)/r). For L independent uniform targets,
    P(at least one hit) = 1 - (1-p)^L, which is at most min(1, L*p), and
    equals L*p only in the limit p -> 0. The archived four-target unions
    are exactly that limit: 4 * 2.5453522044710297e-18 =
    1.0181408817884119e-17 and 4 * 8.564834857521739e-18 =
    3.4259339430086955e-17, matching the printed four-target figures.
    The same arithmetic at the degree-83 1% row is already a different
    number: 1 - (1-0.01)^4 = 0.03940, not 0.04. At p = 1/2 the linearization
    L*p = 2 is impossible, and the union probability is 1 - 2^{-L}.

    A hit among L uniform targets is not a solution of L chosen targets.
    The expected number of membership tests until each of L chosen
    targets has been hit is at least L/p >= L*r/C. Multi-target rho costs
    Theta(sqrt(L*r/m)) group operations on a Koblitz curve. The membership
    method beats that only when (L*r/C) * T_test is smaller, where T_test
    is the number of group additions charged to one membership decision.
    With T_test equal to 1 the inequality can hold for large L at the 1%
    row. With T_test equal to the complementary half-fold enumeration of
    IDEA-20260930-77ec1c it does not hold at the audit rows. The hopeful
    reading drops T_test. This control charges it.

    The nearby object on which "union = L * one-target ceiling" is known
    false is any cell with p >= 1/5. The nearby object on which "union
    coverage 1 solves the batch" is known false is a cell whose image is
    the whole subgroup: every target hits and the discrete logs are still
    unknown.
  mechanism: >-
    OBJECT FRAME. Representation: R1, x-coordinates, used only to build
    the sumset whose indicator is scored. Operation set Sigma: independent
    draws of L targets under the uniform law, plus one charged membership
    query per target. Sigma is not the translation action. Trichotomy:
    branching (IDEA-20260806-c5d183). Each target is a branching event of
    success at most p. The union count does not propagate under
    translation of a single target.

    LOSSY-PROJECTION TEST, against Sigma. The projection keeps the number
    of hits among L targets and discards which targets hit and their
    discrete logs. The discard is compatible with Sigma because the union
    probability is a function of the hit bits alone. It is lossy for
    L > 1: many L-tuples share a hit count. Keeping the logs would be a
    different problem (the batch discrete logarithm), and that is the
    reading this projection refuses. A projection that loses nothing
    would be the list of targets, which is not the audit column.

    OPEN NUMBER. (L_loss, b) in the sense of IDEA-20260802-002: L_loss is
    the identity of the hit target, discarded by the union count, and b
    is the mean fiber C/|image| of one target. The toy test measures the
    union frequency, which is the observable, and charges T_test in
    additions. The factor base is the bounded-degree subspace of
    KN-OPEN-020, a component. F2 is the family. What is added is the
    charged comparison of 1-(1-p)^L with L*p and with multi-target rho.
    F1 is not the lens: rho appears only as the reference cost.

    TWO READINGS. E-RARE: at a cell with p <= 1/50 and L = 4, the measured
    union frequency matches 1-(1-p)^L to sampling error, and the charged
    addition count to hit every one of L chosen targets exceeds the
    Frobenius-rho iteration count for those L targets. Then the
    four-target column is a rare-event identity and not a speedup.
    E-BATCH: the charged addition count is smaller than that rho count.
    Then a membership method at that toy size beats multi-target rho on
    additions, and the "cannot change the exponent" sentence is false at
    that cell. The pre-registered prediction is E-RARE. E-BATCH is a
    result if it happens, not a failure to hide.

    This does not restate IDEA-20260926-20ba8f, which prices a shared
    relation matrix against the preprocessing frontier S*T^2 = N when a
    decomposition oracle already exists. Here no relation matrix exists
    whenever p is small, because collisions are not the same event as
    coverage. The regime is the audit's p ~ 10^{-18} and the toy p in
    {1/50, 1/2}, not the cap locus.
  novelty_status: unverified
  citations:
    - ref: IDEA-20260926-20ba8f
      provenance: internal
      claim: >-
        Multi-target amortization of a built relation matrix, L^{-1}
        against rho's L^{-1/2}. This record is the opposite regime: no
        matrix, rare coverage, charged membership tests.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: IDEA-20260930-77ec1c
      provenance: internal
      claim: >-
        T_test for a generic claw is the complementary half-fold size.
        This record uses that cost as the charged test and does not
        restate the memory ratios.
      verified_by: idea-generator session 2026-09-30, author of both records
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        The subspace base is the scoped bounded-degree class, a component.
      verified_by: idea-generator session 2026-09-30, file read
    - ref: "Kuhn and Struik, multi-target discrete log (recalled; not opened)"
      provenance: recalled
      claim: >-
        L discrete logs in one group cost about sqrt(2*L*r) group
        operations in total rather than L*sqrt(r), up to the automorphism
        savings already in Frobenius rho. Hedge: recalled. The comparison
        in this record uses that shape and charges T_test explicitly so
        a missing factor cannot look like a win.
      verified_by: null
  assumptions:
    - >-
      Targets under the uniform law are independent draws. A shared walk
      that reuses distinguished points is KR-RHO-46c2c6 and is not this
      experiment.
    - >-
      T_test is the number of group additions the chosen membership
      procedure performs, including misses. A unit-cost test is reported
      as a separate column and is not the headline.
  proof_search_map:
    bottleneck: >-
      The reading of the four-target union as linear batch coverage. The
      identity 1-(1-p)^L is not a step of an algorithm. Charging T_test
      is the step whose omission creates the hopeful reading.
    baseline_embedding:
      parameter_slice: >-
        The archived equalities 4 * one-target ceiling = four-target
        union, at both m = 83 seeds, checked to the printed digits in
        this session by multiplying the one-target ceilings.
      reproduction_check: >-
        Recompute 4 * C/r and 1-(1-C/r)^4 at those two cells before the
        toy run. They must match the rare-event form. A mismatch means
        the archived column is not this identity and the control stops.
    observation_collision:
      observable: union hit frequency of L uniform targets, and additions charged until all L chosen targets hit
      distinct_preimage_search: >-
        Two L-tuples with the same hit count and different hit sets.
        The test records one such pair if it occurs, as a witness that
        the union projection is lossy. Absence in a small sample is not
        a failure.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          The fiber of the union-count projection, plus the charged
          addition total as a second observable the union count discards.
        predicted_gain: >-
          Kills the uncharged linearization. No exponent gain is predicted.
    quantifier_order: >-
      FOR ALL p in (0, 1] and all integers L >= 1: 1-(1-p)^L <= min(1, L*p),
      with equality to L*p only in the limit p -> 0. Separately, at the
      toy cells, the prediction is that charged additions exceed the
      Frobenius-rho iteration estimate. The second sentence is a
      measurement; the first is an identity.
    method_ceiling:
      strongest_certifiable_claim: >-
        At the toy cells, either the charged membership method beats the
        rho iteration estimate or it does not. Beating it at n = 19 with
        an enumerable sumset does not transfer to m = 83, where the
        half-fold table does not fit the same enumeration.
      nearby_object_control: >-
        The p = 1/2 cell, where L*p exceeds 1 and "union = L * ceiling"
        is false. An instrument that still reports a factor L there has
        proved too much. The full-image cell, if B is large enough that
        the image equals the subgroup, is the object on which coverage 1
        coexists with unknown logarithms: union frequency 1 and rank of
        the empty relation list equal to 0.
    proof_obligations:
      - claim: 1-(1-p)^L <= min(1, L*p) for p in [0, 1]
        responsibility: correctness
      - claim: the archived four-target figures match 4 times the one-target ceilings in the rare-event limit
        responsibility: baseline
      - claim: expected tests for L chosen targets are at least L/p
        responsibility: runtime
      - claim: comparison with rho is valid only with T_test charged
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: union_frequency_minus_one_minus_one_minus_p_to_the_L
      direction: lower
      minimum_effect: absolute deviation below 0.05 at L = 4 for both p = 1/50 and p = 1/2; a deviation above 0.15 voids the draw or the image
    - metric: linearization_error_at_p_one_half
      direction: higher
      minimum_effect: L*p - (1-(1-p)^L) >= 1 at L = 4, p = 1/2; a measured union near 2 is an instrument failure
    - metric: charged_additions_over_rho_iteration_estimate
      direction: higher
      minimum_effect: ratio > 1 at both toy cells under charged T_test; ratio < 1 is E-BATCH and is reported as a lead only at that cell
  minimal_test:
    design: >-
      E_0 over F_{2^19}, m = 3. Two cells: B chosen so C(B+2, 3)/r is
      about 1/50, and B chosen so the ratio is about 1/2, each enumerable
      in at most 10^7 additions. Enumerate the image once per cell. Draw
      100 independent batches of L = 4 uniform targets and 20 batches of
      L = 32. Score union frequency. For one batch of L = 4 chosen
      targets, run the half-fold membership test of
      IDEA-20260930-77ec1c, charge every addition, and divide by the
      Frobenius-rho estimate sqrt(pi * r / (4 * 19)) * sqrt(L). Also
      report the uncharged column T_test = 1, labelled as uncharged.
      Do not use a composite-degree field. Do not quote an n = 53 wall
      ratio. Do not solve a discrete logarithm.
    controls:
      - The p = 1/2 cell, where the factor-of-L reading is known false
      - A full-image check when the larger cell's image equals the subgroup: union 1 with relation-rank 0
      - An uncharged T_test = 1 column, reported and not used as the headline
    required_metrics:
      - p_hat = |image|/r, union frequency at L = 4 and L = 32, and 1-(1-p_hat)^L
      - charged additions, rho iteration estimate, and their ratio
      - the uncharged ratio, labelled uncharged
  falsification_conditions:
    - >-
      At p about 1/2 the measured union frequency is within 0.1 of L*p
      for L = 4: the instrument does not implement a probability in
      [0, 1], and no cell is read.
    - >-
      At p about 1/50 the union frequency differs from 1-(1-p)^L by more
      than 0.15: the image census and the draws disagree, and the cell
      is redrawn once.
    - >-
      The charged ratio is below 1 at either cell: E-RARE is false there.
      Report the cell, the ratio, and the addition total. Do not call it
      an ECC2K-130 result and do not drop T_test after seeing the sign.
    - >-
      The charged ratio is above 1 at both cells: the four-target column,
      once tests are charged, is not a batch speedup at n = 19. That is
      the predicted negative, and it is the result the control exists to
      obtain.
  confounders:
    - >-
      Dependence among the L targets (a walk that carries state) changes
      the union law. Draws are independent.
    - >-
      Using the group order 4*r instead of r inflates the denominator by
      4. The test uses the prime-subgroup order.
    - >-
      Stopping at the first hit among L targets answers "some target",
      not "each chosen target". The headline metric is the latter.
  interpretation_limits:
    - >-
      KN-OPEN-020: no new factor base. The subspace is a component.
    - >-
      A charged ratio below 1 is evidence only at n = 19 for that B and
      m. It does not transfer to m = 83, where T_test is the half-fold
      size in IDEA-20260930-77ec1c and is not enumerable.
    - >-
      The rare-event identity does transfer, because it is combinatorial
      and was checked against the archived ceilings. Transfer of the
      identity is not transfer of a speedup.
    - >-
      Full-cost S stays null. This record does not produce a scalar.
    - >-
      KR-RHO-46c2c6 already prices distinguished-point reuse across
      targets. This control does not propose a better batch rho.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Uniform independent targets hit the exact image with probability
        p = |image|/r, so a batch of L targets has union probability
        1-(1-p)^L. The sumset of a subspace factor base does not push
        this probability up to min(1, L*C/r) once L*p is no longer small.
      rigorous_support: >-
        For independent Bernoulli trials the union probability is exactly
        1-(1-p)^L. That identity is the rigorous half. The imitation is
        the claim that subspace sums behave like independent hits at rate
        |image|/r rather than like a structured set that covers a positive
        fraction of every L-batch. Independence of draws is part of the
        experiment, not a theorem about the curve.
      validation_plan: >-
        Sample 100 batches of L = 4 and 20 batches of L = 32 at n = 19,
        m = 3, at the two cells p about 1/50 and p about 1/2, after the
        image is enumerated exactly (at most 10^7 additions). Compare the
        empirical union frequency to 1-(1-p)^L. Tail check: the number of
        batches of L = 4 that are empty, at p = 1/50, against the binomial
        prediction (1-p)^{4}; a relative error above 50 percent on 100
        batches is a tail failure. Parameters: n = 19, computed r, both
        values of B, L in {4, 32}. No transfer of the frequency to m = 83.
        The algebraic identity at the archived ceilings is checked by
        multiplication and does not need a sample.
  target_complexity:
    time_exponent: >-
      Unchanged 1/2 for L chosen targets, once T_test is the half-fold
      enumeration. The uncharged column T_test = 1 can look like a
      smaller exponent and is not a complexity claim. Predicted charged
      outcome does not beat sqrt(L*r/m).
    memory_exponent: >-
      The enumerated image at the toy cell, at most 10^7 points. Not a
      proposed attack memory.
    best_known: >-
      Multi-target Frobenius rho, Theta(sqrt(L*r/m)) iterations, which
      specializes at L = 1 to sqrt(pi*r/(4*m)). ECC2K-130 at L = 1 is
      about 2^60.9 iterations. Kuhn-Struik batching is included in the
      square root, not beaten by an uncharged union bound.
    hidden_overhead: >-
      T_test is explicit. Setting it to 1 is the overhead the hopeful
      reading hides, and this record refuses that hiding. No o(1) term.
    tradeoff_note: >-
      Not a new time-memory curve. The claw tradeoff is
      IDEA-20260930-77ec1c. Parallel independent batches do not turn
      1-(1-p)^L into a sub-square-root algorithm for chosen targets.
      Dominated by multi-target rho on time and queries whenever the
      charged ratio is above 1, which is the prediction.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
      - KR-RHO-46c2c6
      - KR-RHO-037e22
      - KR-RHO-13bf67
      - KR-RHO-6239aa
      - KR-IC-5a43e5
      - KR-IC-1fcdbc
      - KR-IC-46d822
    nearest:
      - ref: KR-RHO-46c2c6
        provenance: internal
        relation: adjacent
        delta: >-
          That row says a batch speedup over per-target rho is the
          sqrt(L*r) effect unless it beats sqrt(L*r). This record does
          not propose a batch speedup. It charges the audit's four-target
          union against that bound. Quantitative check already done:
          the archived union equals 4 times the one-target ceiling, which
          is the p -> 0 limit and not sqrt(L). Map row read; Kuhn-Struik
          was not opened.
      - ref: KR-RHO-037e22
        provenance: internal
        relation: adjacent
        delta: >-
          The reference cost is Frobenius-class rho, extended to L
          targets by the square root. Delta: T_test is charged in
          additions. No reduction in the 1/2 exponent is claimed.
      - ref: KR-IC-1fcdbc
        provenance: internal
        relation: orthogonal
        delta: >-
          Summation attacks measured slower than rho are a different
          statement. This control does not re-measure those solvers and
          does not use their wall-clock ratios.
    searched:
      corpus_grep:
        - "ledger/proposals and knowledge/ for four-target union, M83_M3, 2.54535220e-18 (no ledger match; the figures are in the handoff)"
        - "IDEA-20260926-20ba8f read as the nearest multi-target index-calculus pricing"
      web: []
      blocked:
        - "Kuhn-Struik not opened; provenance recalled. novelty_status unverified."
