idea:
  id: IDEA-20260805-4d31bc
  question_id: RQ-ICEX-001
  added: '2026-08-05'
  title: >-
    Report the crossover order, not the exponent: log ell* is the
    unit-invariant observable that actually answers "does index calculus beat
    rho", it is a ratio of regression coefficients whose honest interval is a
    Fieller set, and that set is forced to be UNBOUNDED in 95 per cent of
    replications exactly when the two slopes are indistinguishable -- which is
    the outcome an exponent CI silently converts into a false verdict
  class: measurement

  claim: >-
    GOAL-ICEX-001 asks whether charged toy index calculus beats matched rho, and
    instruments that question as "does the CI of alpha exclude 1/2". Even after
    the estimator is repaired to a ladder slope (IDEA-20260805-c8524f) and the
    threshold to a matched baseline (IDEA-20260805-c06631), alpha remains the
    wrong observable for the DECISION, for a reason independent of both: an
    exponent comparison answers "does IC eventually win" while the program needs
    "does IC win at a size anyone cares about". Those differ by everything. If
    a_IC < a_rho by 0.001, IC wins -- at ell* around 2^{1000}. The proposal is
    to make the CROSSOVER GROUP ORDER the reported quantity:
      log ell* = (log A_IC - log A_rho) / (a_rho - a_IC),
    estimated from one joint regression of log C on log ell with an arm
    indicator, log C = b0 + b1*I{IC} + b2*L + b3*I{IC}*L, giving
    log ell* = -b1 / b3. Three properties are derivable before any run.
    (1) UNIT INVARIANCE. Rescaling the cost unit, C -> lambda C, adds
    log(lambda) to BOTH intercepts, so b1 = log A_IC - log A_rho is unchanged
    and b3 is unchanged. ell* is exactly unit-invariant, which alpha is not.
    (2) THE INTERVAL IS A FIELLER SET AND IT MUST BE ALLOWED TO BE UNBOUNDED.
    log ell* is a ratio of two jointly normal coefficient estimates. The
    100(1-eps) per cent Fieller set is the solution of the quadratic
      (b3^2 - t^2 V33) x^2 + 2(b1 b3 - t^2 V13) x + (b1^2 - t^2 V11) <= 0
    in x = log ell*, whose leading coefficient is positive if and only if the
    slope difference b3 is itself significant at level eps. FORCED CONSEQUENCE,
    exact and pre-registrable: when the true slopes are EQUAL (b3 = 0), the set
    is bounded with probability exactly eps -- 5 per cent at eps = 0.05 -- so
    THE CORRECT PROCEDURE REFUSES TO NAME A CROSSOVER 95 PER CENT OF THE TIME.
    A delta-method interval, SE(x) ~ |x| sqrt(V11/b1^2 + V33/b3^2 - 2V13/(b1 b3)),
    returns a finite interval 100 per cent of the time in the same situation.
    The gap between 0.05 and 1.00 is a forced value that separates an honest
    estimator from a dishonest one at zero mathematical risk, testable by Monte
    Carlo in seconds, and it is the whole reason to prefer the ratio framing
    over the exponent framing rather than a reason to avoid it.
    (3) EXTRAPOLATION IS VISIBLE INSTEAD OF HIDDEN. The ladder spans
    n in [8, 16]. A point estimate log ell* = 40 is an extrapolation by a factor
    of 3 beyond the data and its Fieller set will be enormous; an alpha CI at
    n = 12 hides that fact behind a tight-looking number. Reporting
    log ell* / n_max as a mandatory companion converts an invisible
    extrapolation into a printed ratio.
    NO ATTACK IS PROPOSED, NO EXPONENT IS MOVED, AND NO IC MEASUREMENT IS
    REQUESTED. The synthetic arms below stand in for IC; the only real arms are
    generic baselines the protocol already mandates.

  object_first_candidate:
    tracked_object: >-
      The INTERSECTION POINT of two charged cost curves in the (log ell, log C)
      plane -- a single scalar log ell*, followed as a derived functional of the
      joint fit rather than of either arm separately. The exponent framing
      tracks a slope; the dominance framing tracks a sign at one point; this
      tracks where the sign changes. All three are functions of the same fit,
      and the third is the one the goal's decision is actually about.
    established_families_off_limits: >-
      Off-limits as the primary lens: Semaev decomposition and summation
      polynomials, Groebner and solving-degree instrumentation, factor-base
      geometry, descent, endomorphism and isogeny leverage, xedni and lifting,
      incidence and sum-product bounds, spectral framings, multi-target
      amortization. No cryptanalytic mechanism is proposed. The only family used
      is regression-based cost comparison, and it is the instrument being
      designed rather than a tool being applied.
    newness_score: >-
      Crossover analysis is standard practice in algorithm engineering and
      Fieller's construction is a 1950s statistical device; neither is claimed
      as new mathematics. What is not in this corpus is either object: a grep
      of the ledger and coordination trees for a crossover-order estimator, a
      ratio-of-coefficients interval, or a Fieller set found nothing, and
      EV-ICEX-001 records that no ICEX measurement has ever run. The angle
      brief's F1 table records the lane's standing disagreements as being about
      exponents and speedup factors (1.5-1.7x vs 1.72*1.36^{m-2} vs (m+1)/2 vs
      22-150x) -- four incompatible ANSWERS to a question that nobody framed as
      a crossover, which is the framing under which "constant 1.6x" and
      "geometric in m" are not even comparable claims.
    testability_score: >-
      Very high and entirely free of cryptography. The forced 0.05-vs-1.00
      coverage contrast is a Monte Carlo over synthetic normal data, seconds in
      pure Python. The unit-invariance property is an identity. The only real
      data needed is the matched rho and BSGS ladder, which is already required
      by CTRL-MATCHED-RHO / CTRL-MATCHED-BSGS and runs in minutes.
    survival_score: >-
      The object survives as long as a two-parameter power law is an adequate
      model for both arms. It DISSOLVES the moment the IC arm is genuinely
      subexponential rather than polynomial -- and that dissolution is itself
      informative and is designed into the record rather than hidden: a
      subexponential arm has no constant slope, so the fitted b3 drifts with the
      ladder window, and the sub-ladder refit diagnostic detects it.

  mechanism: >-
    DERIVED IN THIS RECORD. The Fieller construction is RECALLED-UNVERIFIED as
    an attribution (Fieller, 1954, NOT READ, no citation asserted) and is
    RE-DERIVED below from first principles so that no external authority is
    load-bearing.

    THE FIT. Pool the two arms' ladder data. With L = log ell and I the IC
    indicator, fit by ordinary least squares
      log C = b0 + b1 I + b2 L + b3 (I L) + error.
    Then log A_rho = b0, a_rho = b2, log A_IC = b0 + b1, a_IC = b2 + b3. The
    two curves meet where b1 + b3 L = 0, i.e.
      x* := log ell* = -b1 / b3.
    IC is cheaper above ell* iff b3 < 0 (its slope is lower); if b3 >= 0 there
    is no crossover in the direction of interest and the honest output is
    "none", not a number.

    (1) UNIT INVARIANCE, PROVED. Replace C by lambda C in BOTH arms (the same
    unit is used for both by the protocol's comparability policy). Then
    log C -> log C + log lambda, which changes b0 to b0 + log lambda and leaves
    b1, b2, b3 untouched, since the columns I, L, IL are orthogonal to the
    intercept shift in the sense that the shift is absorbed entirely by b0.
    Hence x* = -b1/b3 is invariant. By contrast alpha = log C / log ell picks up
    log(lambda)/log(ell) (IDEA-20260805-c8524f, mechanism 1). This is the
    precise sense in which the crossover is a better observable, and it is an
    identity rather than a preference.

    (2) THE INTERVAL. b = (b0,b1,b2,b3) is (approximately) normal with
    covariance V = sigma^2 (X'X)^{-1}. For a candidate value x, the event
    "the crossover is at x" is the linear hypothesis b1 + x b3 = 0. So a
    (1-eps) confidence SET for x* is, exactly,
      S = { x : (b1 + x b3)^2 <= t^2 * Var(b1 + x b3) }
        = { x : (b1 + x b3)^2 <= t^2 (V11 + 2x V13 + x^2 V33) },
    with t = t_{1-eps/2, df}. Expanding gives the quadratic
      (b3^2 - t^2 V33) x^2 + 2 (b1 b3 - t^2 V13) x + (b1^2 - t^2 V11) <= 0.
    This is EXACT (it inverts a family of exact linear-hypothesis tests) rather
    than a first-order approximation. Its shape is governed by the leading
    coefficient:
      b3^2 - t^2 V33 > 0  <=>  |b3| / SE(b3) > t  <=>  the slope difference is
      significant at level eps.
    If significant, S is a bounded interval. If not, the parabola opens
    downward or degenerates and S is the COMPLEMENT of a bounded interval, or
    all of R -- i.e. the data cannot bound the crossover, which is the truth.
    FORCED VALUE, exact: under the null b3 = 0, P(S bounded) = P(reject
    H0: b3 = 0 at level eps) = eps. At eps = 0.05 the honest procedure names a
    finite crossover in 5 per cent of replications and refuses in 95 per cent.
    The delta-method alternative, SE(x*) = |x*| * sqrt(V11/b1^2 + V33/b3^2
    - 2 V13/(b1 b3)), is finite whenever b3 != 0, hence with probability 1, and
    it is TIGHTEST exactly when b3 is smallest -- the reverse of the correct
    behaviour. That inversion is the structural tell: the reported precision of
    a delta-method crossover INCREASES as the evidence for a crossover
    DECREASES.

    (3) THE EXTRAPOLATION LEDGER. Define r := x* / n_max, with n_max = 16 the
    top of the sealed ladder. The estimate is an interpolation for r <= 1 and an
    extrapolation by factor r otherwise. A pre-registered honesty rule: report
    r with every crossover; refuse narration beyond r = 2 and report the Fieller
    set's intersection with [0, 2 n_max] alongside the full set. This costs
    nothing and makes the difference between "IC overtakes rho at 20 bits" and
    "IC overtakes rho at 2^{400}" a printed number instead of an unstated
    assumption.

    (4) WHY THIS IS THE DECISION-RELEVANT OBJECT, STATED WITHOUT OVERCLAIM. The
    exponent question and the crossover question have different answers in a
    region that matters: any b3 < 0, however small, makes the exponent answer
    "IC wins" while the crossover answer may be "at 2^{1000}, which is not a
    fact about cryptography". Symmetrically, a large negative b1 with b3 = 0
    means IC is uniformly cheaper by a constant factor at every tested size --
    a genuine, reportable, purely-constant win that the exponent framing scores
    as no result at all. Both regimes are reachable at toy scale and neither is
    expressible in the frozen artifact's vocabulary.

    (5) WHAT THIS DOES NOT REPAIR. x* inherits every defect of the underlying
    fit: if the arms are not power laws over the window, b3 is a local artifact
    and so is x*. The sub-ladder refit diagnostic ({8,10,12} vs {10,12,16}) is
    therefore mandatory and its spread is reported as the model-adequacy
    statistic. And x* says nothing about which coordinate is being crossed:
    it must be computed per coordinate against the per-coordinate matched
    baseline of IDEA-20260805-c06631, or it inherits that proposal's defect.

  novelty_status: unverified

  literature_context:
    - >-
      coordination/goals/GOAL-ICEX-001/batches/BATCH-001/tasks/TASK-20260731-021/
      ic_exponent_protocol.yaml -- READ IN FULL THIS SESSION. Contains no
      crossover estimator, no ratio interval, and no extrapolation ledger; its
      only decision statistic is advantage_predicate_toy's
      primary_CI_entirely_below_1_2. fixture_ladder seals four ell, which is the
      minimum a joint fit needs and is recorded here as a constraint rather than
      a comfort.
    - >-
      Fieller's theorem for the confidence set of a ratio of normal means --
      RECALLED-UNVERIFIED. Attributed from memory to Fieller (1954); THE SOURCE
      WAS NOT READ AND NO CITATION IS ASSERTED. The construction used above was
      re-derived in this record by inverting the exact linear-hypothesis test,
      so nothing depends on the attribution being right. Confirming or
      correcting the attribution is a declared stage of the paired experiment.
    - >-
      This session's angle brief, F1 table, records four live and mutually
      incompatible speedup claims in the adjacent Semaev/BKK lane:
      KN-FIND-8f2c90 (1.5-1.7x constant, m=2 only), KN-FIND-2a8b7e
      (1.72*1.36^{m-2}, geometric), KN-FIND-c7d31e ((m+1)/2, linear),
      EV-SEMAEV-6ef060 (22-150x) against EV-SEMAEV-95eebe (3-5x). NONE OF THESE
      RECORDS WAS READ THIS SESSION -- the disagreement is RELAYED from the
      brief. It is cited only as motivation for the framing point (a constant
      factor, a geometric factor and an exponent are not comparable claims and a
      crossover order is one quantity that all three would have had to commit
      to), and no position on the disagreement is taken here.
    - >-
      ledger/proposals/IDEA-20260805-c8524f.yaml and
      ledger/proposals/IDEA-20260805-c06631.yaml -- WRITTEN IN THIS SESSION,
      same author, and therefore NOT independent corroboration. This proposal
      presupposes the ladder-slope repair from the first and the per-coordinate
      baseline from the second; if either is wrong this one inherits the error.
      Stated here so a reviewer does not mistake three records for three
      witnesses.

  lossy_projection_identifiability_audit:
    projection: >-
      The joint fit (b0, b1, b2, b3) with its covariance --> the single scalar
      x* = -b1/b3, plus its Fieller set.
    what_is_discarded: >-
      The absolute cost level (b0), the common growth rate (b2), and the
      separate identities of the constant advantage and the slope advantage.
      Two arm-pairs with utterly different costs and different exponents can
      share a crossover order.
    why_genuinely_lossy: >-
      Genuinely lossy: the fibre over a given x* is the two-parameter family
      {(b1, b3) : b1 = -x* b3}, a line through the origin in the (b1, b3) plane,
      crossed with all of (b0, b2). The projection retains the ratio and
      discards the scale, which is precisely the information a decision about
      "at what size" does not need and a decision about "by how much" does.
    why_compatible_with_the_operations: >-
      Compatible with the operations that matter here: x* is equivariant under
      the one transformation the measurement is exposed to (unit rescaling), on
      which it is exactly invariant, and it composes correctly under
      coordinatewise comparison because it is computed per coordinate.
    is_it_only_a_change_of_coordinates: >-
      NO, and BOTH failure modes were checked. It is not the
      (Delta, Pi) = (x XOR y, x*y) failure -- (b1, b3) is NOT recoverable from
      x*, so information is genuinely discarded, and the discarded part (the
      magnitude of the advantage) must be reported separately, which the design
      requires as a companion. It is not the mirror, constant-projection failure
      either: x* varies across instances by construction, and the CHECK
      PERFORMED for this was to ask whether x* has spread across the
      pre-registered synthetic arm grid. It does -- the grid's arms give x*
      ranging from finite-and-inside-the-ladder to undefined -- so the
      comparator's spread is nonzero, which is exactly the condition
      IDEA-20260805-e805b6 and KN-TECH-1a5b7e identify as the thing a lossy
      projection must have and the determinant-ideal object lacked. The
      residual risk is the opposite one, that x* is TOO variable to estimate,
      and that is what the Fieller set is for.

  assumptions:
    - >-
      That both arms' charged costs are adequately power-law over the sealed
      window. FALSE IN PRINCIPLE for a genuinely subexponential IC arm, and
      recorded as the proposal's structural limit rather than a technicality:
      what the fit then estimates is a local effective exponent, x* is a local
      crossover, and both must be labelled local. The sub-ladder refit is the
      detector and its spread is a mandatory reported number.
    - >-
      That the two arms are measured in the SAME unit and under the same counter
      conventions. Guaranteed by the protocol's own comparability_policy, and
      violated the moment a cross-domain comparison is attempted -- which that
      policy already forbids. If the units differ, unit invariance fails and the
      crossover is meaningless; that is a hard precondition, not a caveat.

  proof_search_map_note: >-
    Carried by the paired hypothesis H-ICEX-4ccbaa, which covers this proposal
    together with IDEA-20260805-c8524f and IDEA-20260805-c06631. The
    quantifier-order audit there is the load-bearing one for this record: the
    claim is EXISTS one estimator FORALL arm-pairs, not FORALL arm-pairs EXISTS
    an estimator.

  predictions:
    - metric: >-
        Fraction of Monte Carlo replications in which the Fieller set is
        BOUNDED, under a synthetic arm pair with EQUAL true slopes
        (b3 = 0), 10000 replications at eps = 0.05, ladder n in {8,10,12,16},
        3 replicas, noise sigma matched to the measured rho spread
      direction: lower
      minimum_effect: >-
        FORCED 0.050, with a binomial 95 per cent band [0.0457, 0.0543] at
        10000 draws. Derived before the run from P(S bounded) = P(reject
        H0: b3 = 0) = eps. A measured fraction outside that band falsifies the
        derivation of the Fieller set as implemented.
    - metric: >-
        Fraction of the SAME replications in which a delta-method interval is
        finite
      direction: higher
      minimum_effect: >-
        FORCED 1.000 (finite whenever b3 != 0, which holds with probability 1).
        The pre-registered contrast is 0.05 versus 1.00. Any outcome in which
        the two procedures agree at b3 = 0 refutes the central claim of this
        proposal.
    - metric: >-
        Coverage of the true log ell* by the Fieller set, under a synthetic pair
        with b3 = -0.10 and a true crossover at x* = 20 (outside the ladder),
        10000 replications
      direction: different
      minimum_effect: >-
        FORCED 0.95 +/- 0.01. The delta-method interval's coverage is predicted
        to fall BELOW 0.90 in the same configuration because the ratio's
        distribution is skewed when the denominator is weakly determined; the
        prediction is a direction and a threshold, not a fitted value, and the
        measured delta-method coverage is reported whatever it is.
    - metric: >-
        Unit-invariance check: |x*(C in nanoseconds) - x*(C in seconds)| on the
        identical fitted data
      direction: lower
      minimum_effect: >-
        EXACTLY 0 to floating-point tolerance 1e-9, while the corresponding
        alpha at n = 12 moves by 2.4914 (IDEA-20260805-c8524f). If x* moves at
        all, the invariance proof is wrong and the proposal collapses.
    - metric: >-
        Sub-ladder slope spread |b3({8,10,12}) - b3({10,12,16})| on the real
        matched rho-versus-BSGS pair (two arms of KNOWN equal exponent 1/2)
      direction: lower
      minimum_effect: >-
        Below 0.05. Both arms have true slope exactly 1/2, so the true b3 is 0
        and a large sub-ladder spread would mean the ladder cannot support a
        slope difference at all -- which would be a decisive negative about the
        ladder and is the single most useful thing the real-data stage can
        return.

  minimal_test:
    design: >-
      Three stages, cheapest-first. STAGE 0 (zero compute, one page): re-derive
      the Fieller quadratic by inverting the linear-hypothesis test, confirm the
      leading-coefficient criterion, and confirm unit invariance symbolically.
      If the leading-coefficient criterion is not equivalent to the significance
      of b3, the account is wrong and the line stops here at zero cost.
      STAGE 1 (seconds, pure Python, normal random variates only): the Monte
      Carlo above -- the 0.05-versus-1.00 contrast, the coverage comparison, and
      the b3 = 0 null. No cryptography of any kind. STAGE 2 (minutes, pure
      Python): the same estimator applied to the REAL matched rho-versus-BSGS
      ladder, two arms of known equal exponent, reporting the Fieller set, the
      sub-ladder spread, and the extrapolation ratio r.
    controls:
      - >-
        NULL OBJECT (same shape, forced value pre-derived, CAN FAIL) -- the
        synthetic arm pair with b3 = 0 exactly. FORCED: bounded-set fraction
        0.050 in [0.0457, 0.0543]. This null can genuinely fail in either
        direction: a fraction near 0 would mean the set is never bounded and the
        estimator is useless; a fraction near 1 would mean it behaves like the
        delta method and the proposal's whole rationale evaporates.
      - >-
        POSITIVE CONTROL (if it does not fire, NO negative may be reported) --
        a synthetic pair with a LARGE, well-determined slope difference
        b3 = -0.30 and true x* = 12, inside the ladder. FORCED: the Fieller set
        is bounded in at least 99 per cent of replications, contains 12 in
        95 +/- 1 per cent, and has median half-width below 3. If the estimator
        cannot name a crossover that is large, inside the data, and
        well-determined, the implementation is broken and nothing negative about
        any alternative may be concluded.
      - >-
        GRADED CONTROL, 5 INTERIOR POINTS, MONOTONICITY REPORTED --
        b3 in {0, -0.05, -0.10, -0.20, -0.40} at fixed b1. FORCED: the
        bounded-set fraction is MONOTONE INCREASING in |b3| and passes through
        0.05 at b3 = 0; the median Fieller half-width is MONOTONE DECREASING;
        and the delta-method half-width moves the WRONG WAY at the small-|b3|
        end. A non-monotone response localises the defect in the implementation
        rather than in the estimator and the account must be revised.
      - >-
        NEARBY-OBJECT CONTROL (real data, the closest object where the
        hoped-for conclusion fails) -- matched rho versus matched BSGS. Their
        true exponents are IDENTICAL (both 1/2), so the correct output is
        "no crossover determinable", i.e. an unbounded set, even though their
        constants differ (1.2533 vs 1.5) and a naive reading of the cost curves
        would suggest rho is uniformly better. A procedure that reports a
        confident finite crossover for this pair has manufactured a result from
        a constant-factor difference, which is exactly the failure the proposal
        exists to prevent.
      - >-
        ARCHIVE CHECK (zero compute). Prior crossover-order estimates in this
        corpus: NOT FOUND. EV-ICEX-001 records no ICEX measurement of any kind.
        Recorded as unavailable rather than as a passed check.
      - >-
        VERDICT-ON-THE-NULL-FIRST. The b3 = 0 arm is fully analysed and its
        bounded-set fraction written down before any nonzero-b3 configuration is
        looked at.

  falsification_conditions:
    - >-
      The bounded-set fraction under b3 = 0 is outside [0.0457, 0.0543]. The
      derivation or the implementation is wrong; the line stops until it is
      repaired.
    - >-
      x* is NOT unit-invariant in the implementation. The invariance proof is
      wrong and the proposal's central advantage over alpha is void.
    - >-
      The positive control fails (no bounded set at b3 = -0.30). Implementation
      defect; NOTHING NEGATIVE MAY BE REPORTED (AGENTS.md rule 5).
    - >-
      The Fieller and delta-method procedures agree at every point of the
      graded ladder. The proposal contributes nothing beyond notation and should
      be recorded as such rather than defended.
    - >-
      The real rho-versus-BSGS pair returns a confidently bounded crossover.
      Since the true slopes are equal, this would mean the ladder's noise
      structure violates the normality the Fieller construction assumes, and the
      correct deliverable becomes a statement about the ladder rather than about
      the estimator.

  confounders:
    - >-
      NORMALITY. The Fieller set inverts a t-test and inherits its assumptions.
      Charged costs are log-normal-ish at best; the rho step count is Rayleigh,
      whose log is left-skewed (derived in IDEA-20260805-c8524f: Var(ln X) =
      pi^2/24). The Monte Carlo stage therefore uses BOTH normal errors and
      resampled real rho residuals, and reports coverage separately for each. A
      coverage gap between them is a finding about the ladder, not a defect of
      the estimator.
    - >-
      THE RATIO IS UNDEFINED AT b3 = 0 AND THE POINT ESTIMATE IS UNSTABLE NEAR
      IT. This is not a bug to be smoothed away; it is the estimator correctly
      reporting that the question has no answer. The design forbids reporting a
      point estimate without its set.
    - >-
      MODEL MISSPECIFICATION DOMINATES SAMPLING ERROR AT FOUR CELLS. With four
      distinct ell, a curvature term is nearly unidentifiable from a slope
      difference. The sub-ladder spread is the only available diagnostic and it
      is weak; the record must not present x* as robust on a four-point ladder,
      and the honest framing throughout is "this is the estimator to use IF a
      ladder is run", not "this ladder settles it".
    - >-
      AUTHOR CORRELATION. This record and its two siblings were written in one
      session by one agent and share assumptions. They are three applications of
      one idea (the observable is wrong), not three independent findings.
    - >-
      SCOPE. No SDEG, MONO, or RELN feed is consumed; no C_IC is assembled; no
      IC arm is run. The IC arm is synthetic throughout, which is what keeps the
      package outside the ICEX measurement ban of DEC-20260731-015 /
      EV-ICEX-001.

  interpretation_limits:
    - >-
      A confirming outcome establishes properties of an ESTIMATOR on synthetic
      and generic-baseline data. It establishes nothing about index calculus,
      moves no exponent, and does not advance or close KN-OPEN-001. It licenses
      no status change to any record; a protocol amendment would be a new
      Coordinator record under a new id.
    - >-
      Toy tier and unraisable. The real arms are 8-16 bit generic baselines.
      The Fieller derivation is scale-free mathematics, but a derivation is not
      evidence and the distinction travels with every citation.
    - >-
      The proposal explicitly does NOT claim that reporting ell* would make IC
      look better or worse. Its expected effect is to convert some verdicts into
      "not determinable", which is a LOSS of apparent information and is the
      point. A reviewer should treat any narrative in which this change makes
      the program's results look stronger as a warning sign.
    - >-
      The four incompatible speedup claims cited as motivation are RELAYED from
      this session's angle brief and were not read. No position is taken on
      them and none of them is scored by this proposal.

  heuristic_assumptions:
    - id: HEUR-ICEX-X1
      statement: >-
        The OLS coefficient vector (b0, b1, b2, b3) is approximately jointly
        normal with covariance sigma^2 (X'X)^{-1} at the sealed ladder's sample
        size (4 cells x 2 arms x 3 replicas = 24 points, 20 residual d.o.f.).
      random_model_justification: >-
        Exact if the log-cost errors are i.i.d. normal; asymptotically valid
        otherwise. NOT ASSUMED SAFE: the rho step count is Rayleigh, so
        log-costs are skewed, and at 3 replicas per cell the central limit
        theorem has little to work with. This is the load-bearing distributional
        assumption of the whole proposal and it is named as such.
      validation_plan: >-
        The Monte Carlo is run twice, once with normal errors and once with
        errors resampled from the MEASURED rho log-residuals, and the two
        coverages are reported side by side. If they differ materially, the
        deliverable is the size of the difference, not a recommendation.
    - id: HEUR-ICEX-X2
      statement: >-
        Both arms follow C = A ell^a over the sealed window with a single a per
        arm.
      random_model_justification: >-
        Provable for rho and BSGS (both are Theta(sqrt(ell)) by construction),
        and FALSE IN PRINCIPLE for a subexponential IC arm. The proposal is
        therefore exactly valid on its controls and approximate on its target,
        which is the reverse of the usual situation and is stated rather than
        glossed.
      validation_plan: >-
        Sub-ladder refit spread reported as a mandatory model-adequacy number
        on every fit, real or synthetic.

  target_complexity:
    time_exponent: >-
      n/a. NO EXPONENT IS MOVED AND NO ALGORITHM IS PROPOSED. The proposal
      changes what a comparison reports, not what any algorithm costs. It is
      recorded here explicitly because the target-result profile biases toward
      exponent-moving work and this proposal is honestly not that; its
      justification is that it gates every exponent claim the goal can make.
    memory_exponent: n/a -- no algorithm proposed.
    best_known: >-
      Unchanged: Pollard rho at 0.886 sqrt(N) group operations (this program's
      convention, KN-TECH-035).
    hidden_overhead: >-
      n/a. The proposal's own cost is one page of derivation and a few minutes
      of Monte Carlo.
    tradeoff_note: >-
      The crossover order IS the natural place to state a time-memory tradeoff:
      one x* per coordinate, so a mechanism that wins on operations at 2^{60}
      and loses on memory at every size is described by two numbers instead of
      being averaged into one verdict.

  dominated_by: >-
    n/a (no result claimed). FRONTIER ROWS CHECKED so the null is not the
    unchecked kind: (i) time -- Pollard rho 0.886 sqrt(N), BSGS sqrt(N)
    processor steps; unaffected. (ii) memory -- rho O(1) or 2^theta, BSGS
    sqrt(N); unaffected. (iii) data/queries -- no oracle model, no queries, no
    preprocessing. (iv) full cost -- KN-TECH-035's N^{2/3+o(1)} for BSGS;
    unaffected. No algorithm is proposed, so no Pareto point is claimed and none
    can be dominated. On the METHODOLOGICAL question, the incumbent is the
    frozen alpha predicate; a grep of ledger/ and coordination/ for a crossover
    estimator, a ratio interval, or a Fieller construction returned nothing, and
    absence of a search result is not evidence that none exists.
  sota_delta: >-
    No attack; measurement contribution only. Quantitatively the proposal claims
    exactly one pre-registered contrast: under equal true slopes, an honest
    crossover procedure names a finite crossover in 0.05 of replications while
    the naive one names it in 1.00, a 20-fold difference in false-precision
    rate; and x* is exactly unit-invariant where alpha shifts by 2.4914 at
    n = 12 under an ns-to-s relabelling. Neither number, and no crossover
    estimator, exists in this corpus today.

  estimated_cost:
    implementation: low
    compute: very low
  recommended_priority: medium
  honest_prior_of_survival: >-
    0.80 that the derived properties hold as stated in the implementation. It is
    that high because the unit-invariance argument is an identity, the Fieller
    quadratic is derived here rather than cited, and the 0.05 forced value
    follows from the definition of a test's size rather than from any model of
    cost. It is not higher because HEUR-ICEX-X1 (joint normality at 3 replicas
    with Rayleigh-driven skew) is genuinely doubtful, because a four-cell ladder
    may be too short for the sub-ladder diagnostic to have any power, and
    because there is a real chance the whole framing is judged out of scope for
    a goal whose next_action is about consuming feeds -- in which case the
    record's honest value is as a filed successor rather than as a run. The
    probability that the smallest deliverable lands -- the zero-compute
    derivation that the honest interval must be allowed to be unbounded, and
    that the frozen artifact has no such provision -- is about 0.95.
