idea:
  id: IDEA-20260731-007
  question_id: RQ-ECDLP-002
  title: Degree-split Semaev claw — meet-in-the-middle smoothness splitting of the summation-polynomial
    membership search
  class: algorithm
  claim: For prime-field Semaev index calculus at arity m>=4 with factor-base size B=N^beta, the decomposition
    search for a random target T can be rewritten as a claw between two half-arity maps of degrees D1,D2
    with D1*D2 bounded by the Semaev resultant degree D(m), and under the named Dickman-style smoothness
    heuristic HEUR-DS-1 the expected number of group-operation equivalents per usable relation is O~(B^{m/2}
    * u^{-u}) rather than O~(B^{m-1}) naive enumeration of (m-1)-tuples, where u = log D / log B. Assembling
    with the free-oracle LA floor of IDEA-20260727-003, the claimed end-to-end time exponent is max(beta*m/2
    * (1 - Theta((log u)/u)), omega_LA * beta, beta) with beta>=1/m. For the parameter point m=5, beta=1/5,
    omega_LA=2 this predicts E ≈ max(0.5*(1-o(1)), 0.4, 0.2) which is STILL at least ~1/2 against matched
    rho unless HEUR-DS-1 yields a superpolynomial smoothness gain that survives the null-object control.
    The decisive prediction is therefore not an immediate sub-birthday break, but a measurable per-relation
    cost ratio R = cost_split / cost_naive strictly below 0.5 on toy instances with B>=64 and surviving
    the random polynomial null object; if R stays near 1, the claw rewrite is only notational and the
    lane adds no charged saving.
  mechanism: A Semaev summation polynomial S_m encodes the condition that m points on E sum to a target.
    Membership search is usually (m-1)-fold enumeration into a Groebner or resultant engine. The degree-split
    rewrite factors the search into two enumerations of size about B^{ceil(m/2)} and B^{floor(m/2)}, stores
    one side keyed by an intermediate invariant (codomain of a partial summation map), and looks for claws
    — the Wesolowski-style bottleneck conversion from a single hard search into a smoothness/collision
    problem. HEUR-DS-1 asserts that intermediate degrees behave like random integers of their size for
    Dickman smoothness, justifying early abort when partial sums land outside a smooth ideal class. This
    is an algorithm claim about charged decomposition cost, not a re-measurement of displacement rank.
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-07-31'
    corpus_paths_grepped:
    - ledger/proposals
    - knowledge/INDEX.md
    - knowledge/techniques
    grep_results:
    - No ledger proposal titled degree-split Semaev claw or smoothness-split membership; IDEA-20260727-007
      covers arity-five amortized alpha, not MITM claw rewriting.
    - Wesolowski p^{1/3} exemplar is isogeny-path, not Semaev; analogy is methodological only.
    literature_verified: []
    conclusion: Methodological adaptation of MITM/smoothness splitting to Semaev membership; novelty_status
      remains unverified pending literature deep-read of Semaev MITM prior art.
  assumptions:
  - Toy prime-field curves with prime-order subgroups; no live keys.
  - Factor base is a frozen deterministic subset of E(F_p) of size B.
  - HEUR-DS-1 holds at the tested toy sizes or the experiment reports its failure explicitly.
  predictions:
  - metric: per_relation_cost_ratio_R
    direction: lower
    minimum_effect: R = cost_split/cost_naive < 0.5 at B>=64 on at least two bit sizes, with null-object
      R_null >= 0.9
  - metric: assembled_exponent_proxy_E
    direction: different
    minimum_effect: E remains >= 0.45 vs 0.886 sqrt(N) matched rho unless HEUR-DS-1 superpolynomial gain
      appears; a claimed E<0.45 without surviving null object is a packaging failure
  minimal_test:
    design: On 16-, 20-, and 24-bit prime-order subgroups, freeze B in {64,128,256} and m in {4,5}. Implement
      naive (m-1)-tuple membership and the degree-split claw membership with identical Groebner backend
      and calibration. Collect >=200 successful relations per method or hit a wall-clock stop. Report
      R, yield, and assembled E. Run the identical claw machinery on random multihomogeneous systems of
      matched degree as null object.
    controls:
    - Matched Pollard rho with negation and matched BSGS on the same instances.
    - Null-object random polynomial systems of matched multidegree (inventor-protocol controls-before-belief).
    - 'Rank control: usable relations require eventual matrix rank B-1 or are labeled incomplete.'
    - Certificate control for any recovered discrete log in end-to-end arms.
    required_metrics:
    - R and R_null with bootstrap CIs
    - per-attempt and yield-charged costs
    - assembled E vs matched rho
    - peak memory of claw table
  falsification_conditions:
  - 'R >= 0.9 at all tested (B,m) with successful relation harvest: claw rewrite adds no charged saving;
    idea weakened/rejected_scoped to tested parameters.'
  - 'R_null < 0.5 whenever R < 0.5: apparent gain is an artifact of the engine, not Semaev structure.'
  - 'Implementation cannot harvest 200 relations on either method within budget: infrastructure inconclusive,
    not mathematical negative.'
  confounders:
  - Toy B makes table memory dominate; report memory separately from asymptotic claim.
  - Groebner calibration can fake R; require identical backend and calibration-perturbation ±10x.
  interpretation_limits:
  - Toy-scale only; success of R<0.5 is not crypto-scale validation of HEUR-DS-1.
  - Even optimistic HEUR-DS-1 does not by itself clear the LA floor at m<=4 (IDEA-20260727-003).
  heuristic_assumptions:
  - id: HEUR-DS-1
    statement: Intermediate degrees arising from half-arity Semaev partial maps on uniform random targets
      behave, for smoothness purposes, like uniform random integers of the same bitlength, so the probability
      an intermediate is B-smooth is within a constant factor of Dickman rho(u) with u=log D/log B.
    rigorous_support: Canfield–Erdős–Pomerance / Dickman–de Bruijn for integer smoothness; no theorem
      currently transfers this to Semaev intermediate ideals over F_p.
    validation_plan: Sample >=10^5 intermediate degrees at each toy size; compare empirical CDF to Dickman
      rho(u); report KS distance and smoothest-sample tail. Label toy-scale. Crypto-size sampling is out
      of scope for the minimal test and would require a separate correspondence experiment (see IDEA-20260731-009).
  target_complexity:
    time_exponent: max(beta*m/2*(1-o(1)), omega_LA*beta) under HEUR-DS-1; optimistic m=5,beta=1/5 still
      ~1/2
    memory_exponent: beta*m/2 for the claw table (same order as half-enumeration)
    best_known: Pollard rho ~0.886 N^{1/2} group ops (generic); Semaev IC typically worse on prime fields
    hidden_overhead: o(1) hides Dickman u^{-u} factors, Groebner poly(D) factors, and hash constants;
      none are proved negligible at crypto size
    tradeoff_note: Claw table can be reduced by van Oorschot–Wiener-style distinguished points at the
      cost of more time; parallelization is near-linear in table build
  dominated_by: Pollard rho on prime-field ECDLP for end-to-end exponent unless HEUR-DS-1 yields a verified
    superpolynomial gain that also clears the LA floor; IDEA-20260727-003 dominates any m<=4 parameterization
    on free-oracle grounds alone
  sota_delta: No claimed unconditional exponent move below 1/2. Conditional delta is a reduction of charged
    decomposition cost by factor ~B^{m/2}/poly toward half-enumeration; end-to-end still expected >= rho
    unless further structure appears.
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
