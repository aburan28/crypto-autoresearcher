idea:
  id: IDEA-20260816-8c5f12
  question_id: RQ-UOV-001
  added: '2026-08-16'
  title: 'Key recovery is not a point, it is a curve: measure solving degree and solver cost against
    the number of oil vectors already known, from zero to the full oil dimension, on toy UOV keys
    and on a random system with an identically planted partial solution, and report the whole gradient.'
  class: measurement
  claim: '(A) Every cost figure in this bucket is a single number: the cost of recovering the oil
    space from nothing. But reconciliation-style methods proceed vector by vector, so the real object
    is a function C(j), the cost of the remaining problem once j oil vectors are known, for j from
    0 to o. Nobody in this repository has measured that function for any multivariate scheme, and
    its SHAPE decides things a single endpoint cannot: a convex C(j) means the first vector is the
    whole problem, a concave one means the difficulty is spread, and a step means there is a critical
    j where the problem changes character. (B) The claim under test is that C(j) is strictly decreasing
    and that the decrease is superlinear in the exponent, specifically that the first-fall degree
    of the residual system falls by at least one for every c additional known vectors with c small,
    and that the entire curve is reproduced by a random quadratic system with an identically planted
    j-dimensional partial solution once one is corrected for equation count. That second half is the
    real content: if the null reproduces the curve, the gradient is a property of having partial information
    about any quadratic system, not a property of UOV structure. (C) The deliverable either way is
    the measured curve with intervals and its null-arm twin, which is directly usable as the missing
    input to any partial-knowledge or hybrid cost model in this bucket. (D) NOT CLAIMED: no attack,
    no exponent for any deployed parameter set, no claim that partial oil knowledge is obtainable,
    and no security consequence. The curve is measured on planted instances where j vectors are GIVEN;
    how an attacker would obtain them is outside the scope entirely and is not speculated about.'
  mechanism: STAGE 1, instance construction. Generate a toy UOV key with a planted oil space O of
    dimension o. For each j in 0..o-1, reveal a uniformly random j-dimensional subspace of O to the
    solver by adjoining the corresponding linear constraints to the key-recovery system. STAGE 2,
    residual system. The residual system is the same derived system with those constraints imposed,
    and its equation and variable counts are exact functions of j that are computed and recorded before
    any solve. STAGE 3, measurement. For each j, compute the Macaulay rank profile of the residual
    system, its first-fall degree, and the field-operation count of a bounded solve. STAGE 4, the
    null twin. Build a uniformly random quadratic system with the same equation and variable counts
    as the residual system at each j, with a planted solution point so that solvability is guaranteed,
    and run the identical measurement. This null is not a random system of the ORIGINAL shape; it
    is matched to the residual shape at every j, which is what makes it able to absorb the trivial
    part of the effect. STAGE 5, decomposition. Report the measured curve, the null curve, and their
    difference. The difference is the part of the gradient attributable to UOV structure rather than
    to shrinking system size, and it is the number the whole experiment exists to produce.
  novelty_status: unverified
  novelty_screen:
    method: Read RQ-UOV-001 and H-UOV-4d1377 in full for the intersection-system framing and its semi-regularity
      prediction. Read the titles of every multivariate-slice proposal returned by grep -rilE 'mayo|snova|oil.and.vinegar|QR-UOV|whipping'
      over ledger/proposals/. Greped ledger/proposals/ for 'reconciliation' and read the returned
      multivariate-slice titles (IDEA-20260805-ca92fd, IDEA-20260813-16d752, IDEA-20260808-e820d2,
      IDEA-20260805-977e16, IDEA-20260805-8d9ac0).
    results: IDEA-20260805-ca92fd derives the intersection-attack system from the oil space and measures
      its solving degree against a planted-solution null - the closest record, and it measures at
      j = 0 only. H-UOV-4d1377 pre-registers first-fall degrees for the k = 2 intersection system
      at seven toy cells, again at j = 0. IDEA-20260808-f0dd08 studies which intersection order k
      binds via a ratio inequality, which is a different axis (how many public maps are combined)
      from partial knowledge. IDEA-20260808-778f82 decomposes the oil-vector SEARCH and closes a meet-in-the-middle
      route, which concerns finding one vector rather than the cost of the remainder once vectors
      are known. No record measures cost as a function of known-vector count.
    verdict: 'UNVERIFIED. Nothing is asserted about published literature; reconciliation-style vector-by-vector
      recovery is a known family and a partial-knowledge cost curve may well appear somewhere unreadable
      from here. Assembled from known parts: the derived system is IDEA-20260805-ca92fd''s and H-UOV-4d1377''s;
      Macaulay profiling is the program''s existing d_reg lineage; planted-solution nulls are used
      throughout. Claimed new relative to the in-repo corpus only: making the number of known oil
      vectors an independent variable, and matching the null to the RESIDUAL shape at each j so that
      shrinking-system effects are subtracted rather than reported as structure.'
  object_first_candidate:
    tracked_object: The residual key-recovery problem after j oil vectors are revealed, tracked through
      the pair (first-fall degree of the residual system, field operations to solve it), as j runs
      from 0 to o.
    lossiness: 'Lossy. From the residual problem - a full polynomial system with its ideal, its syzygies
      and its solution variety - we retain two numbers per j. Discarded: which j-dimensional subspace
      was revealed, the solution set''s geometry, and the entire syzygy module. This is compatible
      with the tracked operation because revealing one more vector acts on the retained pair through
      the residual system''s shape and its rank profile, both of which are determined without reference
      to the discarded structure. It is not a change of coordinates: two numbers cannot rebuild a
      system. The honest caveat: WHICH subspace is revealed may matter, and the experiment measures
      the dispersion across random choices rather than assuming it does not.'
    propagation: 'One step is revealing one additional oil vector. Propagation rule: each revealed
      vector imposes n linear constraints on the unknown, reducing the residual variable count by
      the oil dimension''s worth and adding derived equations from the polar-form orthogonality relations.
      Both counts are exact functions of j computed in advance, so the predicted movement of the semi-regular
      first-fall degree is computable in closed form and the measurement is a test against that prediction
      rather than an exploration.'
    survival_score: The object survives across the whole range j = 0..o by construction, which is
      o+1 steps. It dissolves at j = o where the problem is solved and the cost is zero by definition;
      the interesting statement is where the curve's difference from the null becomes indistinguishable
      from zero, which the experiment locates.
  null_object_control: The null object is a uniformly random quadratic system over F_q with exactly
    the residual system's equation and variable counts at each j, carrying a planted solution so that
    it is solvable, run through the identical measurement code in the same invocation and interleaved.
    For the signal arm to mean anything, the null curve must be nonflat - it will fall simply because
    the system shrinks - and the reportable quantity is the DIFFERENCE between the two curves. If
    that difference is zero within intervals at every j, the gradient is entirely a shrinking-system
    effect and the deliverable is exactly that controlled null, which is a usable result rather than
    a failure.
  discriminated_from:
  - 'IDEA-20260805-ca92fd (derive and measure the intersection system''s solving degree against a
    planted-solution null): measures at zero partial knowledge only; this proposal''s j = 0 point
    is that measurement and its value is entirely in j > 0.'
  - 'H-UOV-4d1377 (semi-regularity of the k = 2 intersection system at seven cells): supplies pre-registered
    j = 0 first-fall degrees used here as an instrument anchor, and makes no partial-knowledge statement.'
  - 'IDEA-20260808-f0dd08 (which intersection order k binds, via n/o < 2 + (k-1)/2): varies how many
    public maps are combined; this varies how much of the secret is known, an orthogonal axis.'
  - 'IDEA-20260808-778f82 (meet-in-the-middle claw decomposition of the oil-vector search, closed
    by an inequality): concerns the cost of finding a first vector; this concerns the cost of the
    remainder after vectors are given, and the two are complementary rather than overlapping.'
  - 'Standard reconciliation-attack complexity formulas: the AVOID list for this bucket forbids re-deriving
    them, and this proposal does not - it measures a curve those formulas do not report and uses none
    of them as a claim.'
  assumptions:
  - Revealing a random j-dimensional subspace of O is a faithful model of partial oil knowledge for
    the purpose of measuring residual cost; whether an attacker could obtain such knowledge is explicitly
    out of scope.
  - The residual system's equation and variable counts are exactly as derived, which is checked mechanically
    before every solve.
  - First-fall degree from a truncated Macaulay matrix is a usable difficulty proxy at these sizes,
    with solver cost measured alongside as a cross-check.
  - Field-operation counts are a fair cost measure across arms because both arms use the same instrumented
    routine.
  - Toy parameters admit the full curve without the degree cap binding at small j, which the pilot
    checks.
  predictions:
  - metric: first-fall degree of the residual system, as j increases
    direction: lower
    minimum_effect: 1
  - metric: difference between the signal-arm curve and the shape-matched null curve, at j = 1
    direction: different
    minimum_effect: no pre-commitment; the sign and size of this difference is the experiment's whole
      question and pre-committing would be inventing a mechanism. It is reported with a 30-instance
      interval either way
  - metric: dispersion of measured cost across different random choices of the revealed subspace at
      fixed j
    direction: different
    minimum_effect: predicted small relative to the between-j movement; if dispersion exceeds the
      j-to-j step, the curve is not well defined and that is the finding
  - metric: signal-arm curve at j = 0 versus the pre-registered value in H-UOV-4d1377
    direction: different
    minimum_effect: 'forced: must agree at the shared cells, else the instrument is void'
  minimal_test:
    design: One cell, full curve. Take q = 16, v = 6, m = 5, so n = 11 and o = m = 5, a cell adjacent
      to those already pre-registered in H-UOV-4d1377 so that the j = 0 point can be checked against
      an independently derived value. For each j in 0..4, generate 30 keys, reveal a uniformly random
      j-dimensional subspace of the planted oil space, build the residual system, record its exact
      equation and variable counts, compute the Macaulay rank profile to a pre-fixed degree cap, extract
      the first-fall degree, and run a bounded solve counting field operations. In the same invocation
      and interleaved, build for each j a uniform random quadratic system with the identical equation
      and variable counts and a planted solution, and measure it identically. The output is two curves
      of five points each with 30-instance intervals, and their pointwise difference. That difference
      is the discriminating quantity and it exists after a single cell.
    controls:
    - Shape-matched random null at every j, interleaved in the same invocation, which is the arm that
      absorbs the shrinking-system effect.
    - 'Subspace-choice control: at fixed j, repeat with 30 distinct random revealed subspaces to measure
      dispersion, so a curve is not read off a single lucky choice.'
    - j = 0 anchor against the independently pre-registered first-fall degrees of H-UOV-4d1377 at
      shared cells.
    - j = o degenerate control, where the problem is solved and the measured residual cost must be
      zero, catching bookkeeping errors in the constraint imposition.
    - 'Wrong-subspace negative control: reveal a random j-dimensional subspace NOT inside O and confirm
      the residual system becomes inconsistent or its solution set empty, proving the constraints
      are actually being imposed.'
    required_metrics:
    - first-fall degree of the residual system per (j, instance)
    - exact residual equation and variable counts per j
    - field operations to bounded solve per (j, instance)
    - pointwise difference between signal and shape-matched null curves with intervals
    - dispersion across revealed-subspace choices at fixed j
    - degree-cap hit rate per j, reported as a bound and never as evidence
  falsification_conditions:
  - The j = 0 point disagrees with the independently pre-registered value at a shared cell, voiding
    the instrument.
  - The signal and shape-matched null curves coincide within intervals at every j, falsifying the
    structure-attributable gradient claim and recording a controlled null.
  - First-fall degree is non-monotone in j beyond the measured dispersion, refuting the stated propagation
    rule.
  - Dispersion across revealed-subspace choices exceeds the j-to-j step, meaning C(j) is not a well-defined
    function at these parameters.
  - The wrong-subspace negative control produces a consistent residual system, meaning constraints
    are not being imposed as intended.
  confounders:
  - Shrinking system size producing the entire gradient, which is precisely what the shape-matched
    null is for and is the single most likely confound.
  - Degree-cap truncation biting harder at small j than at large j, manufacturing a spurious slope;
    mitigated by reporting cap-hit rates per j and by treating any capped cell as a bound.
  - Solver implementation details favouring the more constrained systems; mitigated by counting field
    operations with one instrumented routine shared by both arms.
  - The revealed subspace being drawn non-uniformly, correlating with easy instances; mitigated by
    the dispersion control and by recording every seed.
  - Reading the curve as a statement about attainable partial knowledge, which the scope explicitly
    excludes.
  interpretation_limits:
  - The curve describes the residual problem when j oil vectors are GIVEN; it says nothing about whether
    partial oil knowledge can be obtained by any means.
  - All numbers are for one solver lineage at toy parameters and do not transfer to deployed UOV parameter
    sets.
  - A structure-attributable difference, if measured, is a difference in a difficulty proxy at toy
    scale and is not an attack cost or an exponent.
  target_complexity:
    time_exponent: No attack exponent is claimed. The experiment's own cost is o+1 Macaulay computations
      per instance at a capped degree, times 30 instances, times two arms.
    memory_exponent: No attack memory exponent is claimed. Peak memory is one Macaulay matrix at the
      degree cap for the j = 0 system, which is the largest of the run.
    best_known: 'The incumbent is the in-repo j = 0 measurement lineage: IDEA-20260805-ca92fd''s solving-degree
      measurement and H-UOV-4d1377''s pre-registered first-fall degrees. On the attack side, RQ-UOV-001
      names the intersection-attack family as the baseline; this proposal makes no attack claim and
      therefore competes with neither.'
    hidden_overhead: 'The lower-order term that matters is the degree cap: whichever j has the largest
      residual system dominates the cost and, if capped, silently flattens the curve at exactly the
      point that carries the information. The human overhead is building the constraint-imposition
      code so that the residual counts are provably right, since an off-by-one there moves the whole
      curve and looks like a finding.'
  dominated_by: n/a (no result claimed). Checked against every frontier row named in RQ-UOV-001 -
    intersection attack, Kipnis-Shamir, reconciliation, and the compressed-key variants - on time,
    memory and data axes; none is comparable, because a partial-knowledge difficulty curve on planted
    toy instances is not a point on any attack cost frontier.
  sota_delta: no attack; conceptual/measurement contribution only. The quantitative deliverable is
    a five-point difficulty curve with 30-instance intervals, its shape-matched null twin, and their
    pointwise difference with the same intervals.
  estimated_cost:
    implementation: medium
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'Part A (the residual problem is well defined and C(j) is measurable with
    small dispersion): 0.8, since the construction is mechanical and the dispersion control will expose
    it if not. Part B, first half (C(j) strictly decreasing): 0.9, close to forced, because revealing
    constraints cannot make a system harder. Part B, second half (the shape-matched null does NOT
    reproduce the curve, so some of the gradient is structure): 0.35, deliberately low - my honest
    expectation is that most of the gradient is shrinking-system effect, and the controlled null is
    the likely and still valuable outcome. Part C (the curve is directly reusable as an input to partial-knowledge
    cost models): 0.5, contingent on the dispersion being small enough for the curve to mean anything
    at a single j.'
