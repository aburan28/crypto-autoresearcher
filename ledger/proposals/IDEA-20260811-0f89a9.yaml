idea:
  id: IDEA-20260811-0f89a9
  question_id: RQ-MSI-f760b2
  added: '2026-08-11'
  title: >-
    THE MSI LATTICE IS NOT A LATTICE, IT IS A HECKE MODULE, AND THAT COLLAPSES
    THE DECODING DIMENSION FROM n TO max_f 2 deg K_f: because Hecke compatibility
    forces ker(A) to be Hecke-stable, the decoding problem splits over newform
    eigencomponents of dimension often 2 or 4, where Babai's exponential-in-
    dimension loss 2^{-n/2} degenerates to a CONSTANT -- so the polynomial-time
    decodable radius improves from 2^{-n/2} lambda_1 to Theta(1 / (c_max sqrt(n)))
    lambda_1, an EXPONENTIAL widening whose entire price is the congruence
    number c_f measuring the integrality defect of the splitting; and the attack
    comes with its own countermeasure, since choosing l to DIVIDE the congruence
    number destroys the splitting over Z_l, which makes the mechanism
    two-directionally testable at levels this program can compute today
  class: representation

  claim: >-
    (A) THE STRUCTURAL INPUT, TAKEN FROM A SIBLING RECORD RATHER THAN ASSUMED.
    IDEA-20260811-531f0b claim (C) establishes, in two lines, that Hecke
    compatibility read as an intertwining A T_q = T_q* A yields the adversary NO
    additional constraints -- and that its real content is that ker(A) is stable
    under every T_q, i.e. THE MSI LATTICE IS A MODULE OVER THE HECKE ALGEBRA T.
    That record explicitly declines to exploit the fact and hands it here. This
    record exploits it.

    (B) THE MECHANISM, IN FOUR STEPS. Let M = H_1(X_0(N), C, Z), L = ker(A),
    n = rank M, and let T act on both. Over Q_l the cuspidal part decomposes into
    newform Galois-orbit eigencomponents,
        M cusp tensor Q_l  =  direct sum over f of  M_f,
    with dim M_f = 2 deg K_f (the plus and minus parts of one orbit), K_f the
    coefficient field of f, plus a boundary/Eisenstein part of rank c - 1
    handled separately. Write e_f for the idempotent projector onto M_f.
      STEP 1 (PROJECT). Given the BDD instance x_0 + L with unknown short x, apply
      e_f to obtain a BDD instance in the component lattice
      L_f = e_f(L) of dimension d_f = 2 deg K_f, with error e_f(x).
      STEP 2 (DECODE SMALL). Decode each component by Babai after LLL, or by
      exhaustive enumeration when d_f <= 4. THE CRITICAL POINT IS THAT BABAI'S
      APPROXIMATION LOSS IS 2^{d_f/2}, NOT 2^{n/2}. At d_f = 2 that loss is a
      factor 2. The exponential-in-dimension penalty that makes global decoding
      hard simply is not present in a two-dimensional lattice.
      STEP 3 (PAY THE INTEGRALITY DEFECT). e_f is NOT integral: its denominators
      divide the congruence number c_f of f at level N. So the projected error is
      inflated, ||e_f(x)|| <= c_f ||x|| = c_f S in the operator-norm bound. THE
      ENTIRE COST OF THE METHOD IS THIS ONE NUMBER, AND IT IS COMPUTABLE.
      STEP 4 (RECOMBINE). If each component decodes uniquely, x is recovered by
      inverting the decomposition and rounding, using integrality of x to clear
      the denominators. If some components return candidate lists of sizes N_f,
      recombination is a claw problem: split the components into two halves,
      enumerate partial recombinations on each side, and collide on integrality
      of the sum together with A x = v -- a meet-in-the-middle at cost and memory
      sqrt(prod_f N_f) rather than the naive product.

    (C) THE COMPLEXITY CLAIM, STATED AS AN IMPROVEMENT IN THE DECODABLE RADIUS
    RATHER THAN IN THE TIME. Global LLL plus Babai decodes in polynomial time
    when S <= 2^{-n/2} lambda_1(L) -- an EXPONENTIALLY SMALL fraction of the first
    minimum. The eigencomponent method decodes in polynomial time when, for
    every f,
        c_f S  <=  (1/2) 2^{-d_f/2} lambda_1(L_f),
    i.e., under the balance heuristic HEUR-MSI-E2 that
    lambda_1(L_f) = Theta(sqrt(d_f / n) lambda_1(L)), when
        S  <=  Theta( 1 / (c_max sqrt(n)) ) * lambda_1(L)   for bounded d_f.
    THE POLYNOMIAL-TIME DECODABLE RADIUS THEREFORE IMPROVES BY A FACTOR OF ORDER
    2^{n/2} / (c_max sqrt(n)). If congruence numbers grow polynomially in N -- the
    behaviour the modular degree is expected to have (HEUR-MSI-E1) -- then
    c_max = poly(n) and the improvement is exponential in n. THIS IS AN
    EXPONENT-LEVEL STATEMENT ABOUT WHICH INSTANCES ARE EASY, NOT A CONSTANT-FACTOR
    SPEEDUP, AND IT IS THE ONLY RECORD IN THIS PORTFOLIO THAT CLAIMS ONE.

    (D) WHY THE CLAIM IS NOT OBVIOUSLY TRUE, STATED BEFORE ANYONE ELSE SAYS IT.
    Three things can defeat it and each is measurable.
      (D1) A SHORT VECTOR IN ONE COMPONENT. lambda_1(L_f) can be far below the
      balance prediction if L happens to contain a short vector supported in a
      single eigencomponent -- and a Hecke module is exactly the kind of lattice
      where that could happen systematically. Then that component's decoding
      radius collapses and the method fails there while succeeding elsewhere.
      HEUR-MSI-E2 IS THE ASSUMPTION MOST LIKELY TO BREAK AND THE MEASUREMENT IS
      DESIGNED AROUND IT.
      (D2) LARGE CONGRUENCE NUMBERS. If c_f grows exponentially in N the method is
      dead. This is a computable number and Stage 2 computes it directly rather
      than citing a conjecture.
      (D3) l DIVIDING THE CONGRUENCE NUMBER. Then e_f is not defined over Z_l at
      all, the components merge modulo l, the mod-l Hecke eigensystems coincide,
      rank(A mod l) drops below d, and the splitting is unavailable. THIS IS NOT
      A DEFECT OF THE RECORD, IT IS ITS SHARPEST PREDICTION.

    (E) THE TWO-DIRECTIONAL ARITHMETIC PREDICTION, WHICH NO GENERIC LATTICE
    REASONING WOULD MAKE, AND WHICH IS CHEAP. Mazur's theory of the Eisenstein
    ideal gives, for N prime, a canonical congruence modulus: the Hecke algebra
    of level N and weight 2 has T / I isomorphic to Z / n_0 with n_0 the numerator
    of (N - 1)/12, and for a prime l dividing n_0 there are congruences
    a_q = q + 1 mod l between a cuspidal eigenform and the Eisenstein series.
    RECALLED, NOT READ IN THIS SESSION, AND FLAGGED AS A STAGE 0 OBLIGATION --
    but it is verifiable at toy N in seconds by computing Hecke eigensystems mod
    l. It supplies a NAMED LIST OF BAD PRIMES per level: N = 11 gives n_0 = 5, so
    l = 5; N = 17 gives n_0 = 4, so l = 2; N = 19 gives n_0 = 3, so l = 3;
    N = 37 gives n_0 = 3, so l = 3. PREDICTION: the eigencomponent method SUCCEEDS
    at (N, l) with l not dividing the relevant congruence modulus and FAILS,
    degrading exactly to the global LLL baseline, at (N, l) with l dividing it.
    A METHOD THAT SUCCEEDS OR FAILS AT BOTH IS NOT USING THE ARITHMETIC AND ITS
    APPARENT GAIN IS AN ARTIFACT OF DIMENSION COUNTING.

    (F) THE CONSTRUCTIVE COROLLARY, WHICH IS THE DEFENDER'S SIDE AND MAKES THE
    RECORD USEFUL EITHER WAY. If (E) holds, then any MSI-based construction has a
    free and cheap hardening: CHOOSE l TO DIVIDE THE CONGRUENCE MODULUS AT LEVEL
    N. That is an arithmetic parameter condition, checkable in polynomial time,
    that removes an exponential class of easy instances. A mechanism that yields
    a specific countermeasure rather than a vague warning is a mechanism that has
    said something.

    (G) THE TWO EXPLANATIONS THIS DISCRIMINATES BETWEEN. EXPLANATION 1: MSI's
    difficulty is generic lattice difficulty at dimension n, and the Hecke
    structure is decorative -- then the eigencomponent method performs no better
    than global LLL at matched gap, and the random-lattice null of
    IDEA-20260811-4a55dd is the correct model. EXPLANATION 2: MSI's difficulty is
    modulated by arithmetic, and the effective dimension is max_f d_f rather than
    n -- then the method's decodable radius exceeds global LLL's by orders of
    magnitude at exactly the (N, l) cells where l does not divide the congruence
    modulus. The two predictions differ by an exponential factor and by a
    pattern of successes and failures indexed by an arithmetic condition. There
    is no shared outcome.

  mechanism: >-
    STAGE 0 (ZERO COMPUTE, HARD GATE, NOT PERFORMED IN THIS SESSION): confirm
    from the paper body that Hecke compatibility is an intertwining, so that
    ker(A) really is a Hecke submodule; confirm the shortness norm, since the
    operator-norm inflation bound in step 3 is norm-dependent; and verify the
    Eisenstein-ideal statement of claim (E) against a source rather than from
    recall. Both web tools failed in this session and no local PDF exists in this
    worktree, so all three remain open.

    STAGE 1 (LEVELS WITH A NON-TRIVIAL SPLITTING): using the workbench of
    IDEA-20260811-626f00, enumerate levels N in the computable range and record
    per level: the newform orbit decomposition, the degrees deg K_f, the
    component dimensions d_f = 2 deg K_f, the number of orbits, and the
    Eisenstein modulus n_0. IDENTIFY THE SMALLEST LEVELS WITH AT LEAST TWO
    CUSPIDAL ORBITS, since at one orbit the splitting is trivial and the record
    has nothing to test. N = 37 is recalled as having two rational newforms and is
    the natural first non-trivial cell; THIS IS RECALLED, NOT VERIFIED, and
    Stage 1 verifies it in seconds.

    STAGE 2 (THE CONGRUENCE NUMBERS, MEASURED NOT CITED): compute c_f directly for
    every orbit at every level in the grid, and fit log c_max against log N. THIS
    IS THE RECORD'S LOAD-BEARING NUMBER AND IT IS COMPUTED, NOT CONJECTURED. Also
    record which primes divide each c_f, producing the bad-prime list per level
    that claim (E) predicts.

    STAGE 3 (COMPONENT GEOMETRY): for every cell, compute L = ker(A) from the
    workbench's surrogate or actual encoder, verify Hecke-stability of L exactly
    (T_q L contained in L, an exact integer matrix containment check, not a
    statistic), split into L_f, and measure lambda_1(L_f) exactly by SVP at
    d_f <= 20 alongside lambda_1(L). REPORT THE BALANCE RATIO
    lambda_1(L_f) / (sqrt(d_f/n) lambda_1(L)) PER COMPONENT, which is
    HEUR-MSI-E2 under direct test and is where failure mode (D1) would appear.

    STAGE 4 (RUN BOTH ATTACKS AT MATCHED GAP): for each cell, run (i) global LLL
    plus Babai and (ii) the eigencomponent method, on IDENTICAL instances, and
    measure the largest S at which each achieves 50 percent exact recovery. The
    reported quantity is the RATIO OF DECODABLE RADII, which claim (C) predicts
    to be of order 2^{n/2} / (c_max sqrt(n)).

    STAGE 5 (THE ARITHMETIC ARM, WHICH IS THE DISCRIMINATOR): repeat Stage 4 at
    matched (N, S) for l dividing the congruence modulus and for l not dividing
    it, with at least three levels and three primes each. Also record
    rank(A mod l) per cell, predicted to drop exactly at the bad primes.

    STAGE 6 (THE CLAW ARM, ONLY IF COMPONENTS DO NOT DECODE UNIQUELY): implement
    the two-half meet-in-the-middle recombination of step 4, measure prod_f N_f
    and the achieved cost, and compare against both the naive product and the
    global BKZ cost at the same cell. Report which wins and at what n the
    crossover sits.

    STAGE 7 (ZERO COMPUTE): the countermeasure statement of claim (F), with the
    exact parameter condition and its verification cost.

  novelty_status: unverified

  novelty_screen:
    method: >-
      Corpus screen as in IDEA-20260811-4a55dd, extended with searches for
      "eigenform", "congruence number", "modular degree", "Eisenstein ideal",
      "module lattice", "ideal lattice" across knowledge/ and ledger/.
    results: >-
      Nothing in ledger/ or in knowledge/techniques, findings or open-problems
      concerns modular symbols, Hecke modules, congruence numbers or
      eigencomponent decoding. The corpus contains adjacent number-theoretic
      literature entries only, at confidence "reported" from a bulk seeding pass.
      THE GENERAL IDEA THAT EXTRA ALGEBRAIC STRUCTURE ON A LATTICE CAN BE
      EXPLOITED IS NOT NEW AND IS NOT CLAIMED AS NEW -- it is the standing theme
      of ideal- and module-lattice cryptanalysis. WHAT IS PROPOSED AS NEW TO THIS
      PROGRAM is the specific application to a Hecke module arising from MSI,
      with the congruence number identified as the exact price and the
      Eisenstein-ideal bad primes identified as the exact failure set.
    verdict: >-
      UNVERIFIED, and this record is the one in the portfolio where an external
      check matters most, because the mechanism is close enough to known
      module-lattice cryptanalysis that prior art is plausible. This session
      could not run that check -- both web tools failed with a backend model
      error. A reviewer must search the lattice-cryptanalysis literature for
      eigenspace or idempotent-projection decoding attacks before this record is
      cited as original, and the RECALLED Eisenstein-ideal statement must be
      verified against Mazur's paper rather than against memory.

  object_first_candidate:
    tracked_object: >-
      THE PROJECTION OF THE HOMOLOGY CLASS TO A SINGLE HECKE EIGENCOMPONENT,
      e_f(x) in M_f, together with the integrality defect c_f of the projector.
      One component, not all of them -- and the distinction is the whole
      inventor-protocol content of this record.
    lossiness: >-
      THE LOSSY-PROJECTION TEST IS APPLIED HONESTLY AND ITS UNFAVOURABLE HALF IS
      STATED FIRST. TRACKING ALL COMPONENTS JOINTLY LOSES NOTHING OVER Q_l AND IS
      THEREFORE A CHANGE OF COORDINATES, NOT A NEW OBJECT -- exactly the failure
      docs/inventor-protocol.md section 2 warns about, and exactly what the
      (Delta, Pi) example in that section illustrates. The object that PASSES the
      test is the SINGLE-COMPONENT projection e_f(x), which genuinely discards
      every other component; and the discard is compatible with the target's
      operations because the Hecke algebra preserves each component by definition
      of isotypic decomposition, and because addition of classes is preserved by
      a linear projector. So e_f(x) propagates deterministically under both
      operations the problem supports.
      AND HERE IS THE POINT THAT MAKES THE RECORD MORE THAN A BASIS CHANGE: the
      coordinate change is NOT INTEGRAL. Its denominators are the congruence
      numbers, and the information lost in passing from Z to Z[1/c_f] is
      precisely what the attack must pay for. THE RECORD'S SUBJECT IS THAT
      INTEGRALITY DEFECT, WHICH IS A GENUINE ARITHMETIC QUANTITY AND NOT A
      COORDINATE ARTIFACT -- it is zero for a generic lattice with no module
      structure, and it is the reason the attack is neither trivial nor vacuous.
    propagation: >-
      One step = applying T_q. Then e_f(T_q x) = a_q(f) e_f(x) -- the component
      is an eigenvector and propagates by multiplication by a single algebraic
      number. THAT IS THE CLEANEST ONE-STEP PROPAGATION RULE AVAILABLE ON THIS
      OBJECT and it is exact, computable, and requires no knowledge of x.
    survival_score: >-
      SURVIVES: every Hecke operation, every addition, and every truncation to
      l^m with l not dividing c_f. DIES at three named places, all measurable:
      (i) l dividing c_f, where the projector leaves Z_l and the components merge
      mod l; (ii) a component containing a short vector of L, where the local
      decoding radius collapses; (iii) large deg K_f, where d_f grows and Babai's
      2^{d_f/2} loss returns. All three are the record's own predicted failure
      modes and all three are Stage 2 or Stage 3 measurements.

  null_object_control: >-
    NULL 1 (RANDOM LATTICE WITH NO MODULE STRUCTURE): a random q-ary lattice of
    matched rank and determinant, artificially split into blocks of the same
    dimensions d_f by a random rational projector of matched denominator size.
    THE EIGENCOMPONENT METHOD MUST FAIL ON IT AT THE SAME S WHERE IT SUCCEEDS ON
    THE REAL LATTICE. If it succeeds on both, the gain comes from the dimension
    split alone and has nothing to do with Hecke structure -- and since a random
    lattice does not split, that outcome would mean the implementation is
    decoding by some other route and the run is void.
    NULL 2 (RANDOM PROJECTOR ON THE REAL LATTICE): keep L but replace e_f by a
    random rational projector onto a subspace of the same dimension with the same
    denominator. Must fail. This isolates the eigen-structure from the dimension.
    NULL 3 (SHUFFLED COMPONENT ASSIGNMENT): permute which decoded component
    answer is recombined into which slot. Recovery must collapse to zero.
    DECAY CONTROL, AND IT IS ARITHMETIC RATHER THAN STATISTICAL: the parameter
    that must destroy the method is l dividing the congruence modulus. Success
    must drop to the global-LLL baseline exactly there and nowhere else. A method
    whose success is flat across good and bad primes is not using the arithmetic,
    whatever its raw numbers, and its gain must be attributed to dimension
    counting instead.

  discriminated_from:
    - >-
      H-MOD-e9d87e (zero-bit closure). NOT CAUGHT, and the separation here is the
      sharpest in the portfolio because both records concern group actions on
      modular objects. H-MOD-e9d87e's F2 says every DIAMOND-INVARIANT function of
      a SINGLE point of a SINGLE X_1(N) fibre is constant, because the diamond
      action of (Z/N)^*/{+-1} is free and transitive on that fibre. THIS RECORD
      USES HECKE-EQUIVARIANT, NOT HECKE-INVARIANT, DATA: e_f(x) is not invariant
      under T_q, it is an EIGENVECTOR, scaling by a_q(f). The closure's engine is
      that invariants of a free transitive action carry no information; an
      eigenvector of a non-free, non-transitive action on a rank-n module is a
      different animal entirely, and the eigenvalue a_q(f) is exactly the
      information the diamond quotient does not have. There is also no X_1(N),
      no fibre, no rational ECDLP instance, and no scalar k anywhere in this
      record.
    - >-
      DEC-20260810-2c7e3c (closed CM canonical-lift lane). NOT THAT LANE. Nothing
      is lifted to characteristic zero except the modular curve, which lives over
      Z by construction; no point of any ECDLP instance is lifted; no canonical
      height, Mordell-Weil lattice or regulator appears. The lattice decoded here
      is the kernel of a map on the homology of X_0(N), and its short vectors are
      short modular symbols, not points of small height. The CM in the record is
      an ORIENTATION in characteristic p. Stated explicitly because the decision
      requires it.
    - >-
      KN-TECH-3b593f (genus-1 boundary). No prime-field ECDLP claim; no tractable
      subgroup; no Kani embedding; no torsion advice of any kind.
    - >-
      Known ideal- and module-lattice cryptanalysis. NOT DISCLAIMED, DECLARED:
      the strategy of exploiting extra algebraic structure on a lattice to reduce
      an effective dimension or to attack a subfield is a known family, and this
      record's mechanism is recognisably a member of it. THE CLAIMED INCREMENT IS
      THE SPECIFIC INSTANCE -- Hecke eigencomponents of a modular symbol module,
      congruence numbers as the exact price, Eisenstein primes as the exact
      failure set, and the resulting parameter countermeasure. Whether even that
      is new is UNCHECKED, and the novelty screen says so.
    - >-
      IDEA-20260811-4a55dd. That record's random-lattice null is precisely
      EXPLANATION 1 of claim (G); this record is EXPLANATION 2. They are designed
      to be adjudicated against each other on the same instances, and this record
      loses cleanly if the null matches.

  assumptions:
    - >-
      Hecke compatibility is an intertwining, so ker(A) is Hecke-stable. NOT
      VERIFIED. Stage 3 checks the containment T_q L in L exactly rather than
      assuming it, which is a total check at zero statistical risk.
    - >-
      The relative homology decomposes as cuspidal eigencomponents plus a
      boundary part of rank c - 1, with dim M_f = 2 deg K_f for the plus and
      minus parts of a newform orbit. STANDARD MODULAR SYMBOLS THEORY, RECALLED
      AND NOT RE-READ; verified exactly at toy N by the workbench's Hecke
      characteristic-polynomial gate.
    - >-
      Mazur's Eisenstein ideal statement for prime N -- T / I isomorphic to
      Z / numerator((N - 1)/12), with congruences a_q = q + 1 mod l for l
      dividing that numerator. RECALLED, NOT READ. It supplies claim (E)'s bad
      prime list and is a Stage 0 obligation; it is also checkable directly at
      toy N in seconds, which is how Stage 1 will actually settle it.
    - >-
      Babai's nearest plane on an LLL-reduced basis of a d_f-dimensional lattice
      decodes when the error is below 2^{-d_f/2} lambda_1. STANDARD, RECALLED.
      The whole mechanism rests on the exponent being d_f rather than n.
    - >-
      Congruence numbers are computable at the tested levels. True in practice
      for the levels in the grid, and Stage 2 computes them rather than citing
      them.

  proof_search_map:
    bottleneck: >-
      THE COMPONENT DECODING RADIUS lambda_1(L_f) DIVIDED BY THE INFLATED ERROR
      c_f S. Every other step is standard linear algebra. If that ratio exceeds
      2^{d_f/2} the method is polynomial and the exponential widening of claim
      (C) is real; if it does not, the method collapses to the claw arm of
      Stage 6, whose exponent may or may not beat BKZ. NOTHING ELSE IN THE RECORD
      CARRIES THE VERDICT, and both quantities in the ratio are directly
      measurable.
    baseline_embedding:
      parameter_slice: >-
        A LEVEL WITH EXACTLY ONE CUSPIDAL ORBIT SPANNING THE WHOLE CUSPIDAL
        SPACE, where the splitting is trivial and L_f = L. There the
        eigencomponent method IS global LLL plus Babai, by construction, and its
        measured decodable radius must equal the global method's exactly. THIS IS
        AN EXACT PARAMETER SLICE, NOT A VISUAL SIMILARITY OF CURVES.
      reproduction_check: >-
        Frozen fixture at N = 11 (genus 1, one orbit, d = 1): both methods must
        return byte-identical outputs on identical instances at every S in the
        sweep. A discrepancy means the eigencomponent implementation differs from
        the global one for reasons other than the splitting, and every gain
        measured at larger N would then be uninterpretable.
    observation_collision:
      observable: >-
        The tuple of decoded component answers, before recombination.
      distinct_preimage_search: >-
        SEARCH FOR TWO DISTINCT SHORT CLASSES WITH THE SAME COMPONENT TUPLE. If
        the decomposition is faithful over Q_l no such pair exists in principle;
        but over Z_l WITH l DIVIDING A CONGRUENCE NUMBER the components merge and
        collisions become possible -- WHICH IS EXACTLY FAILURE MODE (D3), FOUND
        CONSTRUCTIVELY RATHER THAN ARGUED. The search is therefore not a threat
        to the record but its predicted arithmetic signature, and its outcome
        must be reported per prime, with the colliding pairs recorded verbatim.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Move the decoding problem from the rank-n integral module M to the
          direct sum of low-dimensional eigencomponent lattices over Z[1/c_f].
          ENCODING: the idempotents e_f, computed from Hecke characteristic
          polynomials. COMPLETENESS: every short class projects. SOUNDNESS: a
          recombined candidate is verified against A x = v and against
          integrality before acceptance, so no wrong answer can pass. TRANSFER:
          exact away from primes dividing c_f, and NOT DEFINED at those primes,
          which is the record's own predicted failure set. COST LOSS: a factor
          c_f in the decodable radius, measured per component and never averaged.
        predicted_gain: >-
          Polynomial-time decoding at radius Theta(1/(c_max sqrt(n))) lambda_1
          in place of 2^{-n/2} lambda_1 -- exponential widening of the easy
          region at unchanged asymptotic time.
      - transform: stronger_invariant
        proposed_object: >-
          Track not the class but the pair (component projection, eigenvalue
          action), i.e. preserve the T-module structure through the recursion
          instead of collapsing to a vector at each step.
        predicted_gain: >-
          It is precisely this extra preserved state that survives the
          projection and makes step 2 low-dimensional; collapsing to a plain
          vector loses it and returns the problem to dimension n.
      - transform: observable_fiber
        proposed_object: >-
          Hold the component tuple fixed and vary the class over the fibre of the
          mod-l merged decomposition at a congruence prime; find an intrinsic
          invariant separating them.
        predicted_gain: >-
          If none exists, the countermeasure of claim (F) is sound and the
          program can recommend it; if one exists, the countermeasure fails and
          the attack extends to congruence primes, which is a strictly stronger
          result.
    quantifier_order: >-
      THE CLAIM, EXPLICITLY: THERE EXISTS a polynomial-time algorithm B such that
      FOR ALL levels N, FOR ALL primes l not dividing max_f c_f, FOR ALL m, and
      FOR ALL instances with S <= Theta(1/(c_max sqrt(n))) lambda_1(L), B returns
      the short representative. THE TRAPS, BOTH NAMED. (i) B must not be allowed
      to depend on the instance -- it depends only on (N, l, m), which are public,
      and the run record must show B compiled once per cell. (ii) THE ORDER OF l
      AND N MATTERS AND IS THE RECORD'S OWN LIMITATION: the quantifier is "for
      all l not dividing c_max at level N", so l is chosen AFTER N, and a
      construction that fixes l first and then chooses N adversarially may sit
      permanently in the bad set. That is the countermeasure of claim (F), stated
      as a quantifier fact rather than as an afterthought.
    method_ceiling:
      strongest_certifiable_claim: >-
        At most: "at the tested (N, l, m, S) cells, the eigencomponent method's
        measured 50-percent decodable radius exceeds global LLL plus Babai's by
        the measured factor, and the two agree at congruence primes." IT CAN
        NEVER CERTIFY the asymptotic widening of claim (C), which is an argument
        resting on HEUR-MSI-E1 and HEUR-MSI-E2, and it can never certify anything
        about MSI's hardness -- an attack that succeeds bounds hardness above and
        an attack that fails bounds nothing.
      nearby_object_control: >-
        THE NEARBY OBJECT WHERE THE CONCLUSION MUST FAIL IS A LEVEL AND PRIME
        WITH l DIVIDING THE CONGRUENCE MODULUS -- N = 11 with l = 5, N = 19 with
        l = 3, N = 37 with l = 3 if the recalled Eisenstein moduli survive
        Stage 1. The identical code must fail there and succeed at neighbouring
        primes of the same size. A METHOD THAT CANNOT DISTINGUISH THAT PAIR HAS
        NOT IDENTIFIED THE LOAD-BEARING STRUCTURE, and the record commits in
        advance to reporting that verdict about itself.
    proof_obligations:
      - claim: A T_q = T_q* A implies T_q ker(A) contained in ker(A).
        responsibility: correctness
      - claim: the cuspidal part splits with dim M_f = 2 deg K_f.
        responsibility: baseline
      - claim: denominators of e_f divide the congruence number c_f.
        responsibility: size
      - claim: Babai decodes a d_f-dimensional component when the error is below 2^{-d_f/2} lambda_1.
        responsibility: correctness
      - claim: lambda_1(L_f) is Theta(sqrt(d_f/n) lambda_1(L)) under HEUR-MSI-E2.
        responsibility: size
      - claim: the recombined candidate is verified against A x = v and integrality.
        responsibility: correctness
      - claim: total cost is poly(n, m log l) in the unique-decoding regime and sqrt(prod N_f) in the claw regime.
        responsibility: runtime
      - claim: the method fails exactly at primes dividing the congruence modulus.
        responsibility: success_probability
      - claim: every measured gain is scoped to the tested cells.
        responsibility: scope

  predictions:
    - metric: >-
        exact Hecke-stability check -- number of (q, basis vector) pairs at which
        T_q applied to a basis of L leaves L
      direction: lower
      minimum_effect: >-
        FORCED EXACTLY 0 if the intertwining holds. A nonzero count refutes the
        record's structural input and the line halts pending re-derivation.
    - metric: >-
        fitted exponent in log c_max against log N over the level grid
      direction: different
      minimum_effect: >-
        Predicted BOUNDED, i.e. polynomial growth with a fitted exponent in a
        stated range, consistent with the expected polynomial growth of modular
        degrees. An exponent that grows with the range, or evidence of
        exponential growth, kills the mechanism outright at (D2) and that is a
        clean, cheap negative worth having on its own.
    - metric: >-
        balance ratio lambda_1(L_f) / (sqrt(d_f/n) lambda_1(L)) per component
      direction: different
      minimum_effect: >-
        Predicted within a factor 2 of 1 for a majority of components. A
        systematically small ratio in some components is failure mode (D1) and
        localises exactly which eigencomponents carry the lattice's short
        vectors -- which would itself be a new structural fact about Hecke module
        lattices and worth its own record.
    - metric: >-
        ratio of 50-percent decodable radii, eigencomponent method over global
        LLL plus Babai, at matched instances
      direction: higher
      minimum_effect: >-
        Predicted GREATER THAN 1 and GROWING WITH n at good primes. A ratio at or
        below 1 refutes claim (C) at the tested parameters. THE MINIMUM
        INTERESTING EFFECT IS A RATIO EXCEEDING 4 AT n >= 20 AND GROWING; below
        that, the measurement cannot distinguish the mechanism from
        implementation noise at toy dimension, and the record says so rather than
        reporting a weak trend as a result.
    - metric: >-
        the same ratio at primes DIVIDING the congruence modulus
      direction: lower
      minimum_effect: >-
        PREDICTED EXACTLY 1 -- no gain, degrading precisely to the global
        baseline. THIS IS THE RECORD'S CENTRAL DISCRIMINATOR AND IT IS
        TWO-DIRECTIONAL: gain at good primes AND no gain at bad primes are both
        required. Either half alone is uninformative.
    - metric: >-
        rank(A mod l) at bad primes against d
      direction: lower
      minimum_effect: >-
        Predicted STRICTLY LESS than d at primes dividing the congruence modulus
        and equal to d elsewhere. This is a pure linear-algebra check costing
        seconds and it tests the arithmetic mechanism independently of any
        attack.
    - metric: >-
        random-projector and random-lattice null gains
      direction: lower
      minimum_effect: >-
        PREDICTED 1, i.e. no gain. Any gain on a null means the measured
        advantage comes from dimension splitting rather than from Hecke
        structure, and the record's headline must then be restated as a fact
        about block-structured lattices.

  minimal_test:
    design: >-
      THE CHEAPEST DECISIVE SUBSET IS STAGES 1, 2 AND THE rank(A mod l) ARM,
      WHICH TOGETHER COST MINUTES AND REQUIRE NO ATTACK CODE AT ALL: enumerate
      orbits and degrees, compute congruence numbers and their prime divisors,
      compute rank(A mod l) across good and bad primes, and check whether the
      rank drops exactly at the predicted primes. If it does not, the arithmetic
      mechanism is absent and Stages 3 to 6 need not be built. If it does, the
      attack arm is justified and is built next.
      FULL DESIGN: Stage 0 gate; Stage 1 orbit census over N up to a few hundred;
      Stage 2 congruence numbers with the growth fit; Stage 3 exact
      Hecke-stability and component geometry with SVP ground truth at d_f <= 20;
      Stage 4 matched-instance radius comparison; Stage 5 the good-prime versus
      bad-prime arm; Stage 6 the claw arm if needed; Stage 7 the countermeasure
      statement.
    controls:
      - One-orbit level (N = 11) where both methods must be byte-identical.
      - Random lattice with an artificial block split (must show no gain).
      - Random rational projector of matched denominator (must show no gain).
      - Shuffled component assignment (recovery must collapse).
      - Bad-prime arm, where the gain must vanish.
      - Exact SVP ground truth for every lambda_1 at d_f <= 20 and n <= 40.
      - Verification of every recombined candidate against A x = v and integrality.
    required_metrics:
      - Hecke-stability violation count, forced 0.
      - Orbit census, deg K_f, d_f, orbit count per level.
      - c_f per orbit, its prime divisors, and the log-log growth fit.
      - lambda_1(L), lambda_1(L_f), and the balance ratio per component.
      - 50-percent decodable radius for both methods per cell, and their ratio.
      - The same ratio split by good versus bad primes.
      - rank(A mod l) per cell against d.
      - Null gains for all three nulls.
      - Claw-arm candidate counts N_f, achieved cost, and BKZ comparison.

  falsification_conditions:
    - >-
      Exact Hecke-stability fails. ker(A) is not a Hecke submodule, the record's
      structural input is wrong, and everything downstream halts.
    - >-
      Congruence numbers grow exponentially in N. Failure mode (D2); the
      mechanism is dead and the negative is cheap, clean and worth recording.
    - >-
      The decodable-radius ratio is at or below 1 at good primes. Claim (C) is
      refuted at the tested parameters and Explanation 1 of claim (G) is adopted.
    - >-
      The ratio is equally large at bad primes. The method is not using the
      arithmetic; its gain is a dimension-splitting artifact and the headline
      must be restated accordingly. THIS IS THE FAILURE THE RECORD MOST EXPECTS
      TO HAVE TO REPORT ABOUT ITSELF.
    - >-
      A null shows the same gain. Same disposition, more severe: the run is void.
    - >-
      The one-orbit fixture shows the two methods differing. Implementation
      divergence; no gain measured anywhere may be attributed to the splitting.
    - >-
      Stage 1 finds the recalled Eisenstein moduli are wrong. The bad-prime list
      is wrong; the discriminator must be rebuilt on measured congruence-number
      divisors, which Stage 2 supplies independently, before any arm is run.

  confounders:
    - >-
      TOY DIMENSION. At n <= 40 the exponential 2^{n/2} versus polynomial
      c_max sqrt(n) distinction is barely visible, because both methods succeed on
      almost everything. The measurable quantity is the RATIO OF RADII AND ITS
      TREND IN n, and a single-cell gain proves nothing. This is the record's
      largest methodological risk and it is why the minimum interesting effect is
      stated as a growing ratio rather than as any gain at all.
    - >-
      OPERATOR NORM VERSUS THE ACTUAL INFLATION. ||e_f(x)|| <= c_f ||x|| is a
      worst-case bound; the typical inflation may be far smaller, which would
      make the method BETTER than claimed. The measured inflation must be
      reported alongside the bound, and the claim must not silently switch
      between them.
    - >-
      SMALL LEVELS HAVE ONE ORBIT. Most of the hand-verifiable grid is
      degenerate for this record, and a census that fails to reach multi-orbit
      levels can produce a confident-looking null that means only that the
      splitting was never exercised.
    - >-
      CONGRUENCE NUMBER VERSUS MODULAR DEGREE. The two are equal for many
      elliptic curves but not in general, and the recalled growth expectations
      attach to the modular degree. Which quantity bounds the projector's
      denominators must be settled in Stage 0 or derived, not assumed.
    - >-
      THE BOUNDARY PART. The Eisenstein/boundary summand of relative homology is
      not a newform component and needs its own treatment; ignoring it silently
      would corrupt every recombination and could produce apparent failures that
      have nothing to do with the mechanism.
    - >-
      SURROGATE ENCODER. If Stage 3 runs on IDEA-20260811-626f00's surrogate arm,
      every number is labelled `surrogate` and measures Hecke modules at level N
      rather than MSI. That is still worth having, and it must not be relabelled
      later.

  interpretation_limits:
    - >-
      A SUCCESSFUL ATTACK BOUNDS HARDNESS ABOVE; A FAILED ONE BOUNDS NOTHING.
      RQ-MSI-f760b2 constraint 1 is honoured and the forbidden reading is
      pre-registered.
    - >-
      The asymptotic claim of (C) is an ARGUMENT conditional on HEUR-MSI-E1 and
      HEUR-MSI-E2, not a measurement, and no toy run can validate it. Every
      statement of it must carry both heuristic names, exactly as Theorem 1.1 of
      the exemplar carries Heuristic 1.
    - >-
      Everything about the paper's map is inferred from the abstract; the body
      was not read because this session's web tools failed and no local PDF
      exists in this worktree.
    - >-
      The Eisenstein-ideal statement is RECALLED and unverified; the bad-prime
      list may be wrong, and Stage 2's measured congruence-number divisors are
      the independent route that does not depend on it.
    - >-
      No claim about prime-field ECDLP is made or reachable.
    - >-
      This record does not claim novelty against the external module-lattice
      cryptanalysis literature, which was not searched.

  heuristic_assumptions:
    - id: HEUR-MSI-E1
      statement: >-
        FOR ALL levels N in a stated range and FOR ALL newform Galois orbits f of
        weight 2 and level N, the congruence number c_f satisfies
        log c_f = O(log N) uniformly, i.e. c_f = N^{O(1)}; equivalently
        c_max(N) = max_f c_f is polynomially bounded in N.
      rigorous_support: >-
        The rigorous ingredient is that c_f divides a determinant of a
        Hecke-pairing matrix with entries bounded by Deligne's bound
        |a_q| <= 2 sqrt(q), giving an UNCONDITIONAL but very weak bound
        exponential in the dimension -- which is precisely why this is filed as a
        heuristic. The classical statement being imitated is the expected
        polynomial growth of the modular degree of an elliptic curve in its
        conductor, of order N^{7/6+o(1)} in the standard expectation. RECALLED,
        NOT READ IN THIS SESSION, and NOT used as a bound anywhere -- Stage 2
        computes c_f directly and the fit replaces the citation.
      falsification_condition: >-
        A fitted log-log slope that grows with the level range rather than
        stabilising, or any observed c_f exceeding N^4 in the grid.
      validation_plan: >-
        SAMPLE: every newform orbit at every level N up to the largest the
        workbench reaches, targeting at least 10^3 orbits over at least 300
        levels -- congruence numbers are a standard modular-symbols computation
        and are seconds each at these levels. SHORTCUT USED TO REACH SCALE: the
        Hecke-pairing determinant rather than any analytic route. COMPARISON
        DISTRIBUTION: fit log c_f against log N and report the slope with
        confidence interval; separately plot the empirical distribution of
        c_f / N^{7/6} against the constant it should approach if the expected
        growth holds. TAIL CHECK: report the 20 largest c_f in the grid and their
        levels, since it is the LARGEST congruence number at a level, not the
        typical one, that sets c_max and therefore the attack's radius. TRANSFER
        ASSUMPTION, STATED: that a slope fitted below N of a few hundred persists
        at cryptographic N of several thousand. NOTHING PROVES THIS; it is an
        extrapolation and it is the assumption a reviewer should attack first.
    - id: HEUR-MSI-E2
      statement: >-
        FOR ALL levels and all newform components f at the tested parameters, the
        eigencomponent lattice L_f = e_f(L) satisfies
        lambda_1(L_f) = Theta(sqrt(d_f / n) lambda_1(L)) with absolute implied
        constants -- that is, the Hecke splitting is BALANCED and no component
        carries a disproportionately short vector of L.
      rigorous_support: >-
        The rigorous ingredient is exact multiplicativity of the determinant over
        an ORTHOGONAL direct sum, which would give det(L)= prod_f det(L_f) and
        hence the stated balance under the Gaussian heuristic applied to each
        component. The classical statement being imitated is the Gaussian
        heuristic itself. THE ASSUMPTION IS THAT THE HECKE EIGENSPACE SPLITTING IS
        NEAR-ORTHOGONAL IN THE SHORTNESS NORM, WITH THE DEFECT CONTROLLED BY THE
        CONGRUENCE NUMBER -- AND THIS IS THE RECORD'S WEAKEST LINK, because a
        Hecke module is exactly the sort of lattice where a single eigencomponent
        could systematically hold the short vectors.
      falsification_condition: >-
        Balance ratios below 1/4 or above 4 in a substantial minority of
        components, or a ratio that trends systematically with d_f or with the
        eigenvalue field degree.
      validation_plan: >-
        SAMPLE: every component of every cell with d_f <= 20 and n <= 40, exact
        SVP for both lambda_1(L_f) and lambda_1(L) -- of order 10^3 components,
        seconds to minutes each. COMPARISON DISTRIBUTION: the balance ratio
        against 1, and separately the empirical distribution of
        det(L_f)^{1/d_f} against det(L)^{1/n} which tests the near-orthogonality
        directly and independently of any minimum. TAIL CHECK: report the 20
        components with the SMALLEST balance ratio and state their level, orbit
        and coefficient-field degree, since it is the smallest component minimum
        that caps the attack's radius and a single bad component defeats the
        whole method at that level. TRANSFER ASSUMPTION, STATED: none is offered
        beyond the measured grid; if the smallest ratios trend downward with n
        the mechanism degrades and the record must be superseded rather than
        extrapolated.
    - id: HEUR-MSI-E3
      statement: >-
        FOR ALL components in the claw regime, the number of candidate short
        vectors returned per component equals the Gaussian-heuristic count of
        lattice points of L_f within radius c_f S, so that the meet-in-the-middle
        cost is sqrt(prod_f N_f) with N_f given by that count.
      rigorous_support: >-
        The rigorous ingredient is the ball-volume count for a lattice, exact in
        expectation over random lattices by Siegel's mean value theorem. The
        classical statement imitated is the standard Gaussian-heuristic lattice
        point count used to size enumeration. Applied here to a NON-random,
        module-structured lattice, which is exactly the uniformity that
        HEUR-MSI-E2 also assumes and which the same measurement tests.
      falsification_condition: >-
        Measured candidate counts differing from the predicted count by more than
        a factor 4 in a majority of components.
      validation_plan: >-
        SAMPLE: exhaustive enumeration of all short vectors in every component
        with d_f <= 12, over every cell that reaches the claw regime -- exact
        integer counts, no estimation. COMPARISON: the ball-volume prediction with
        its constant. TAIL CHECK: the 20 components with the largest counts, since
        the product is dominated by them and one heavy component sets the whole
        claw cost. TRANSFER: none offered beyond d_f <= 12.

  target_complexity:
    time_exponent: >-
      UNIQUE-DECODING REGIME, conditional on HEUR-MSI-E1 and HEUR-MSI-E2:
      poly(n, m log l), i.e. NO exponential factor, valid whenever
      S <= Theta(1 / (c_max sqrt(n))) lambda_1(L) with c_max polynomial in n.
      CLAW REGIME, conditional additionally on HEUR-MSI-E3: time and memory
      sqrt(prod_f N_f), against the naive prod_f N_f. THE CLAIM IS NOT A TIME
      SPEEDUP AT FIXED INSTANCE BUT AN EXPONENTIAL WIDENING OF THE
      POLYNOMIAL-TIME-DECODABLE REGION: the decodable radius moves from
      2^{-n/2} lambda_1 to Theta(1/(c_max sqrt(n))) lambda_1, a factor of order
      2^{n/2} / (c_max sqrt(n)). Stated this way because "faster" without a
      quantified region would be exactly the vague claim the contract forbids.
    memory_exponent: >-
      poly(n, m log l) in the unique-decoding regime -- negligible, and notably
      BETTER than the p^{1/3+o(1)} isogeny algorithm whose memory equals its
      time. sqrt(prod_f N_f) in the claw regime, i.e. memory equal to time, the
      standard claw-finding position; van Oorschot-Wiener interpolation applies
      there and is stated below.
    best_known: >-
      FOR THE MSI DECODING PROBLEM: global LLL plus Babai, polynomial time at
      radius 2^{-n/2} lambda_1, and BKZ-beta at 2^{Theta(beta)} for
      delta_beta^{-n} lambda_1 -- both as set out in IDEA-20260811-4a55dd, which
      is the record this one must beat and is the matched baseline in Stage 4.
      FOR MSI ITSELF: no published cryptanalysis is known to this program. FOR THE
      ADJACENT ISOGENY PROBLEMS: p^{1/2}(log p)^{O(1)} unconditional and
      p^{1/3+o(1)} conditional on Wesolowski's Heuristic 1 -- NOT comparable,
      because the exponent here is in n and not in p, and the record does not
      pretend otherwise.
    hidden_overhead: >-
      The poly hides c_max, which is polynomial only under HEUR-MSI-E1 and is
      measured rather than bounded; it hides the cost of computing the
      idempotents e_f, which requires the Hecke characteristic polynomials and is
      O(n^3) or so per level but is a ONE-TIME public precomputation; and it
      hides the boundary/Eisenstein summand's separate treatment. The claim's
      Theta constants in the decodable radius are NOT computed and are measured
      only at toy dimension, so no concrete parameter conclusion may be drawn
      from them.
    tradeoff_note: >-
      In the claw regime the standard van Oorschot-Wiener interpolation applies:
      with memory w below sqrt(prod N_f), time is sqrt((prod N_f)^3 / w)-shaped
      and parallelises near-linearly. The record's PREFERRED operating point is
      the unique-decoding regime, which is memory-cheap, and the claw arm exists
      only to characterise what happens when HEUR-MSI-E2 fails in a minority of
      components. THE ATTACK AND THE PORTFOLIO'S OTHER ATTACKS SIT ON DIFFERENT
      COST SURFACES AND A DESIGNER MUST COST BOTH, WHICH IS THE SAME WARNING
      IDEA-20260811-55932a's ceiling table carries.

  dominated_by: >-
    CHECKED ROW BY ROW ACROSS TIME, MEMORY AND DATA, INCLUDING THE ROW THIS
    RECORD IS TRYING TO BEAT. On the MSI decoding problem the incumbent is global
    LLL plus Babai at radius 2^{-n/2} lambda_1 with BKZ above it
    (IDEA-20260811-4a55dd): THIS RECORD IS NOT DOMINATED BY IT IN THE
    UNIQUE-DECODING REGIME IF HEUR-MSI-E1 AND HEUR-MSI-E2 HOLD, since it decodes
    at an exponentially larger radius at the same polynomial cost and the same
    negligible memory -- AND IT IS DOMINATED BY IT EVERYWHERE ELSE, in particular
    at every prime dividing a congruence number, where it degrades exactly to the
    baseline, and in the claw regime whenever sqrt(prod N_f) exceeds BKZ's
    2^{Theta(n/log n)}. On the ISOGENY problems it is dominated outright by every
    row -- Delfs-Galbraith p^{1/2}(log p)^{O(1)}, Wesolowski p^{1/3+o(1)}
    conditional, meet-in-the-middle vectorization at sqrt(h(O)), Kuperberg
    quantumly -- because it solves none of them and produces no isogeny path. NOT
    null, and the one non-dominated cell is stated with both its heuristics
    attached and its failure set named.
  sota_delta: >-
    AGAINST THE MSI-DECODING BASELINE, CONDITIONAL ON HEUR-MSI-E1 AND
    HEUR-MSI-E2: the polynomial-time decodable radius improves from
    2^{-n/2} lambda_1(L) to Theta(1/(c_max sqrt(n))) lambda_1(L), a ratio of
    order 2^{n/2} / (c_max sqrt(n)) -- exponential in n when c_max is polynomial,
    at unchanged polynomial time and unchanged negligible memory. AGAINST THE
    SAME BASELINE AT PRIMES DIVIDING A CONGRUENCE NUMBER: zero, exactly, by the
    record's own prediction. AGAINST EVERY ISOGENY BASELINE: zero, no path is
    produced. FURTHER QUANTITATIVE CONTENT INDEPENDENT OF WHETHER THE ATTACK
    WORKS: the first measured congruence-number growth fit and eigencomponent
    balance data for modular symbol lattices in this program, and a concrete
    polynomial-time-checkable parameter countermeasure (choose l dividing the
    congruence modulus) that would remove the easy class if the mechanism is
    real.

  constraint_compliance:
    hardness_unverified: >-
      Constraint 1 honoured: the record states in method_ceiling and in
      interpretation_limits that a successful attack bounds hardness above and a
      failed one bounds nothing, and pre-registers the forbidden reading.
    not_ecdlp_route: >-
      Constraint 2 honoured: no prime-field ECDLP claim, no tractable subgroup,
      no Kani embedding, no torsion advice; the exponent claimed is in n and
      concerns a lattice, and the target problem is isogeny-side.
    not_canonical_lift: >-
      Constraint 3 honoured explicitly in discriminated_from item 2: nothing is
      lifted, the short vectors are short modular symbols rather than points of
      small canonical height, and no Mordell-Weil lattice or regulator appears.
    not_h_mod_closure: >-
      Constraint 4 honoured with the portfolio's sharpest separation, in
      discriminated_from item 1: the closure concerns INVARIANTS of a free
      transitive diamond action on a single X_1(N) fibre, while this record uses
      EIGENVECTORS of a non-free, non-transitive Hecke action on a rank-n module,
      and the eigenvalue a_q(f) is precisely the datum the diamond quotient does
      not carry.
    lit_entry_corrected: >-
      Constraint 5 honoured: the published abstract from RQ-MSI-f760b2 is used,
      KN-LIT-1662's summary line is not, and both the unread body and the
      recalled Eisenstein-ideal statement are recorded as Stage 0 obligations
      with an independent measured route (Stage 2) that does not depend on
      either.

  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: medium

  honest_prior_of_survival: >-
    0.9 that ker(A) is Hecke-stable if the intertwining reading is right, since
    it is immediate. 0.75 that congruence numbers grow polynomially in the tested
    range, since that is the expected behaviour of modular degrees. 0.4 that
    HEUR-MSI-E2 holds well enough for the unique-decoding regime to be reached at
    a majority of components -- this is the weak link and the honest expectation
    is partial success with a minority of bad components, which is exactly the
    claw arm. 0.55 that the good-prime versus bad-prime discriminator shows the
    predicted asymmetry, which is the single result that would make the mechanism
    real rather than a dimension-counting artifact. 0.35 that the measured
    decodable-radius ratio grows with n over the toy range clearly enough to be
    reportable at all, since toy dimension is the record's principal enemy. 0.3
    that some version of this attack already exists in the module-lattice
    literature, unchecked because this session had no working web tool. THE
    RECORD IS THE PORTFOLIO'S ONLY EXPONENT CLAIM AND ALSO ITS MOST LIKELY TO
    FAIL, WHICH IS WHY ITS CHEAPEST ARM -- the rank(A mod l) drop at bad primes,
    minutes of compute, no attack code -- IS SPECIFIED AS A STANDALONE TEST.

