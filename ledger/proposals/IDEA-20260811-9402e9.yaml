idea:
  id: IDEA-20260811-9402e9
  added: '2026-08-11'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-RAYCL-3985f4
  goal_id: GOAL-ENDO-001
  batch_id: BATCH-aeeb17
  claim_tier: toy
  title: >-
    THE HARD GATE IS NEITHER HARD NOR A GATE, AND THE [open] OBLIGATION IS A
    THREE-LINE THEOREM. The counting identity #X_m = #Cl_m(O) that
    IDEA-20260811-319a07 designates its hard gate is an A PRIORI DOUBLE COUNT:
    both sides evaluate to h(O) * #(O/m)^* / #image(O^* -> (O/m)^*) by
    independent elementary arguments that never mention the action, so the
    identity holds whether or not the action is simply transitive and cannot
    falsify it. It is a textbook observation collision -- one observable, two
    ground-truth hypotheses -- and running it as the gate would buy a confirming
    measurement with prior probability near 1 and zero discriminating power.
    Meanwhile the thing the seed carries as [open] -- simple transitivity -- is
    provable in three lines for O maximal (transitivity from simple
    transitivity of Cl(O) on curves plus surjectivity of (O/m)^* onto the
    fibre; freeness then from the count). This record supplies the derivation,
    replaces the vacuous gate with the ORBIT-AND-STABILIZER test that actually
    discriminates, and states exactly what each outcome would mean
  class: control

  claim: >-
    (A) THE CLAIM IN ONE SENTENCE. The seed's designated falsifier is
    unfalsifiable-in-practice and its designated open problem is closed;
    swapping the two is the cheapest correction available to RQ-RAYCL-3985f4,
    and it costs zero compute to state and minutes to check.

    (B) THE DOUBLE COUNT, WRITTEN OUT. Notation as in IDEA-20260811-319a07:
    E/F_p ordinary, O = End_{F_p}(E) MAXIMAL, m = (pi - 1)O,
    X_m = {(E', P')}/iso with P' an O-module generator of E'[m].
      LEFT SIDE. By the Deuring/Waterhouse correspondence the class contains
      exactly h(O) curves with End = O up to F_p-isomorphism
      [recall-confident, NOT re-verified this session]. For each such E', by
      Lenstra E'(F_p) ~= O/m as an O-module [recall-confident, relayed by the
      seed, NOT re-verified], so its O-module generators are exactly the classes
      in (O/m)^*, of which there are #(O/m)^*. Two pairs (E', P') and (E', P'')
      are F_p-isomorphic exactly when P'' = zeta * P' for zeta in
      Aut_{F_p}(E') = O^*, and that action on generators is FREE unless
      zeta = 1 mod m. Therefore
        #X_m = h(O) * #(O/m)^* / #image(O^* -> (O/m)^*).
      RIGHT SIDE. Cl_m(O) = I(m)/P_{m,1} sits in the elementary exact sequence
        O^* -> (O/m)^* -> Cl_m(O) -> Cl(O) -> 1,
      whose exactness is pure ideal arithmetic (every class contains an ideal
      coprime to m; the kernel of Cl_m -> Cl is P_m/P_{m,1} ~= (O/m)^*/im(O^*)),
      so
        #Cl_m(O) = h(O) * #(O/m)^* / #image(O^* -> (O/m)^*).
      THE TWO SIDES ARE THE SAME EXPRESSION, TERM BY TERM. Neither derivation
      mentions the action of Cl_m(O) on X_m. Hence:
        THEOREM (deflation of the gate). For O maximal, #X_m = #Cl_m(O) holds
        unconditionally, independently of whether the Cl_m(O)-action on X_m is
        transitive, free, or even well defined.
      COROLLARY. The identity cannot falsify simple transitivity. Its only
      possible failure mode is an implementation defect -- which is exactly what
      the seed itself says a mismatch would mean ("an implementation bug until
      independently replicated"), and which is a description of a REGRESSION
      TEST, not of a gate.
      WHY THE COINCIDENCE IS NOT A COINCIDENCE: the two counts share the same
      three ingredients (h(O), #(O/m)^*, the unit image) because both are
      computing the size of a Cl(O)-equivariant (O/m)^*-bundle over the class --
      one on the geometric side, one on the ideal side. Cardinality is a
      TOO-COARSE observable to see the difference between "there is a bundle"
      and "the bundle is a torsor".

    (C) THE [open] OBLIGATION, DISCHARGED. The seed carries "the action of
    Cl_m(O) on X_m is simply transitive" as [open], responsibility feasibility,
    tested by the counting identity. For O MAXIMAL it is a short argument and
    this record states it in full so a reviewer can attack it:
      STEP 1 (the action is well defined). For an ideal a coprime to m, the
      isogeny phi_a : E' -> E'/E'[a] restricts to E'[m] with kernel
      E'[a] intersect E'[m] = E'[a + m] = E'[O] = 0, and both m-torsion groups
      have order Norm(m), so phi_a : E'[m] -> (E'/E'[a])[m] is an O-module
      ISOMORPHISM and carries generators to generators. For alpha = 1 mod m the
      isogeny phi_{(alpha)} is alpha itself, acting on E'[m] as multiplication
      by alpha mod m = 1, hence trivially. So P_{m,1} acts trivially and
      Cl_m(O) = I(m)/P_{m,1} acts.
      STEP 2 (transitivity). Given (E_1, P_1), (E_2, P_2) in X_m: Cl(O) acts
      simply transitively on the h(O) curves, so pick a coprime to m with
      [a] E_1 = E_2. Then phi_a(P_1) is a generator of E_2[m], as is P_2, so
      phi_a(P_1) = u * P_2 for a unique u in (O/m)^* (uniqueness because both
      are generators of a cyclic O-module). Pick beta in O with
      beta = u^{-1} mod m; since u^{-1} is a unit mod m, (beta) is coprime to m,
      and (beta) acts on the fibre by multiplication by beta mod m = u^{-1}.
      Hence [(beta)] [a] * (E_1, P_1) = (E_2, P_2). TRANSITIVE.
      STEP 3 (freeness). A transitive action of a finite group G on a finite set
      X with #G = #X has trivial stabilizers, because #X = #G/#Stab. The
      cardinality identity of (B) supplies #G = #X. Hence FREE, hence SIMPLY
      TRANSITIVE.
      STATUS OF THIS DERIVATION. It is a `derivation` artifact under
      docs/claims-and-verification.md -- a checkable argument, never "proved" --
      and it leans on two [recall-confident] relayed facts (Lenstra; the
      Deuring/Waterhouse count) that could NOT be re-verified this session
      because literature access is down. Its scope is O MAXIMAL. For non-maximal
      O the ideal theory needs proper ideals and coprimality to the conductor,
      m = (pi - 1) may fail to be coprime to the conductor, and STEP 2's choice
      of a coprime representative can fail; that case remains genuinely open and
      is NOT covered.
      NOTE THE LOGICAL SHAPE: the counting identity is USED in STEP 3, as an
      INPUT to the proof of freeness. A quantity used as a premise cannot
      simultaneously serve as an independent test of the conclusion. That is the
      cleanest statement of why the seed's gate is circular as designed.

    (D) THE TEST THAT ACTUALLY DISCRIMINATES, AT THE SAME COST.
      ORBIT-AND-STABILIZER TEST. On a toy class with h(O) small enough that X_m
      is fully enumerable:
        (i) Build X_m explicitly: enumerate the h(O) curves with End = O, and
            for each, enumerate the O-module generators of E'(F_p) up to the
            Aut action.
        (ii) Pick a base pair x_0. Compute the ORBIT of x_0 under a generating
            set of Cl_m(O) -- the classes of the split primes of small norm
            together with the kernel elements coming from (O/m)^* -- by
            breadth-first search under the two one-step propagations (apply
            phi_l; multiply the point by u).
        (iii) MEASURE #orbit(x_0) and compare to #X_m. Transitivity holds iff
            they are equal.
        (iv) MEASURE the stabilizer: the set of group elements mapping x_0 to
            itself, obtained as the kernel of the orbit map. Freeness holds iff
            it is trivial.
      This is the same order of implementation effort as the counting identity,
      uses the same objects, and has REAL discriminating power because the orbit
      size can genuinely differ from #X_m while the cardinalities of the two
      sides still agree.
      THREE OUTCOMES, PRE-DECLARED:
        OUTCOME 1 (predicted). Orbit = X_m and stabilizer trivial on every
          tested class. Simple transitivity confirmed as implemented; part (C)'s
          derivation is corroborated; the seed's [open] obligation is discharged
          for O maximal at toy scale and the question may proceed to the cost
          questions (IDEA-20260811-25ad05, -34a6d8, -9bc805).
        OUTCOME 2. Orbit strictly smaller than X_m with the cardinality identity
          STILL HOLDING. Then the action is not transitive, the seed's torsor
          claim is false as implemented, and -- crucially -- the seed's own gate
          would have PASSED on that very instance. This outcome is the direct
          demonstration that the gate is vacuous, and it is why the test is
          worth running even under Outcome 1's high prior.
        OUTCOME 3. Cardinality identity itself fails. Then, per (B), an
          implementation defect exists in one of the enumerations (or O is not
          maximal, or E'(F_p) is not O-cyclic on some curve, or the
          unit-image count is wrong at D_0 = -3, -4). This is a bug report, not
          a mathematical finding, and it must be replicated independently before
          any record mentions it.

    (E) WHAT THIS RECORD DOES NOT DO. It does not dispute the seed's exact
      sequence, its reduction, or its coordinate obstruction. It does not
      weaken the seed -- it STRENGTHENS its algebra (turning [open] into a
      derivation) while removing its experimental content, and that combination
      is exactly the T1 shape RQ-RAYCL-3985f4 anticipates: correct and
      contentless. It says nothing about cost; the cost questions are elsewhere.
      It also does not claim that the counting identity is worthless: it is a
      perfectly good REGRESSION FIXTURE for the enumeration code, and this record
      recommends retaining it under that label.

  resource_label: >-
    R3 (End(E) as a ring; the ideal m; the finite ring O/m; the ray class group)
    and R4 (the class-group action lifted to pairs). The record consumes these
    only to audit a proposed test.
  admissibility: admissible
  admissibility_argument: >-
    No endomorphism is applied to a point of G as a mechanism. The one-step
    propagation "multiply the point by u in (O/m)^*" appears inside the ORBIT
    TEST as an instrument operation on a fully enumerated toy set, not as a
    proposed attack step, and its effect is exactly the scalar collapse
    H-ENDO-001 records -- which is why the fibre is a (O/m)^*-torsor and why the
    test works. H-ENDO-001 is not retested. KN-FIND-b7e091 is untouched.

  object_first_candidate:
    established_families_declared_off_limits: >-
      Declared off-limits as the PRIMARY lens per docs/inventor-protocol.md
      section 1: the connecting ideal class; the kernel ideal of <Q>; the scalar
      lambda on G; cost functionals as class functions; the generic-group
      transcript; and the ray-class coordinate (the seed's object), which this
      record audits rather than adopts. KN-OPEN-019 is unwritten, so this list
      is a sketch, not a taxonomy.
    tracked_object: >-
      THE ORBIT-AND-STABILIZER PAIR (#orbit(x_0), #Stab(x_0)) of a base element
      under the acting group, followed as the generating set is enlarged. Not
      the coordinate, not the cardinality -- the pair that decides whether a
      cardinality coincidence is a torsor.
    lossiness: >-
      GENUINELY LOSSY. The projection sends the entire enumerated set X_m with
      its full action table (a #Cl_m x #X_m incidence structure) to two
      integers. Everything about WHICH elements are hit and by what is
      discarded; only the size of the reachable set and the size of the
      redundancy survive. It is discarded COMPATIBLY with the operations because
      orbit sizes multiply correctly under enlargement of the generating set and
      the stabilizer is a subgroup, so one-step propagation (add a generator;
      recompute the orbit closure) is defined and deterministic on the pair
      alone. Nothing about the action table is recoverable from the pair, so
      this is not a change of coordinates. Contrast the CARDINALITY alone, which
      is a projection so lossy it retains nothing about the action at all --
      that is the failure mode this record names, and it is the opposite error
      from a projection that loses nothing.
    propagation: >-
      One step, defined and measurable: adjoin one generator (a split prime
      class, or a kernel element u), recompute the orbit closure by BFS, and
      record the new pair. The sequence of pairs as generators are added is
      itself the measurement, and it distinguishes "the group does not act
      transitively" from "our generating set is too small" -- a distinction the
      cardinality observable cannot make.
    survival_score: >-
      Survives every class small enough to enumerate, and the enumeration bound
      is the only limit. DISSOLVES when h(O) * #(O/m)^* exceeds the enumeration
      budget -- i.e. for p beyond about 24-28 bits, since #X_m ~ h * #E ~ p^{3/2}
      -- and when O is non-maximal or E'[m] is not O-cyclic, where X_m is not
      what the seed defines. Those are the declared boundaries.

  mechanism: >-
    STEP 1 (zero compute). Write out the double count of part (B) and the
    derivation of part (C). This alone settles the record's central claim: the
    gate is a priori and the obligation is dischargeable.

    STEP 2 (zero compute). State the logical circularity explicitly -- the
    counting identity is a PREMISE of the freeness step, hence cannot be its
    test -- and record it as an observation collision under
    docs/inventor-protocol.md section 8 audit 2.

    STEP 3 (toy compute, minutes). Implement the enumeration of X_m and the
    independent computation of #Cl_m(O), and RUN the counting identity anyway,
    relabelled as a REGRESSION FIXTURE for the enumeration code. Its value is
    that it catches enumeration bugs, and it must be reported as such rather
    than as evidence about the action.

    STEP 4 (toy compute, minutes). Implement and run the orbit-and-stabilizer
    test of part (D) on every toy class in the ladder, recording the pair after
    each generator is adjoined.

    STEP 5 (toy compute, minutes). Run the same instrument on the NULL OBJECT
    (a deliberately broken action) and on the PLANTED NON-TRANSITIVE control, to
    demonstrate the instrument can see non-transitivity at all.

    STEP 6 (zero compute). Record the non-maximal-order case as genuinely open,
    with the two specific failure points named (proper ideals; coprimality of
    m to the conductor), so the next session does not re-derive the boundary.

  why_not_a_renamed_known_approach: >-
    The mathematics is entirely classical and NONE is claimed as new:
    orbit-stabilizer, the elementary exact sequence for generalised ideal class
    groups, Deuring/Waterhouse, and Lenstra's CM structure theorem. What is new
    against THIS corpus is the AUDIT: nobody has observed that the seed's
    designated hard gate evaluates to the same expression on both sides by
    arguments that never mention the action, nobody has discharged the seed's
    [open] obligation, and nobody has proposed the orbit test as its
    replacement. IDEA-20260811-40c0b5 performs a structurally similar audit --
    it replaces four model-restricted closures with a two-number comparison --
    and this record is in that lineage while auditing a TEST rather than a
    CLOSURE.

  proof_search_map:
    bottleneck: >-
      Whether the Cl_m(O)-action on X_m is simply transitive. Everything the
      seed builds on top of it (the coordinate, the reduction, the exact
      sequence as a reduction diagram) presumes it. Removing the uncertainty is
      the whole content of this record; nothing else here is load-bearing.
    baseline_embedding:
      parameter_slice: >-
        Set m = (1). Then X_m is the set of curves, Cl_m = Cl(O), the counting
        identity becomes h = h, and the orbit test becomes the classical
        statement that Cl(O) acts simply transitively on the class -- the
        corpus's pre-existing baseline, reproduced exactly rather than
        approximately. Second boundary: h(O) = 1. Then X_m is a single fibre,
        Cl_m = (O/m)^*/im(O^*), and the orbit test must confirm the fibre is a
        (O/m)^*-torsor, which is elementary module theory. Both boundaries are
        exact parameter slices, not resemblances.
      reproduction_check: >-
        Frozen fixture: at m = (1) the enumerator must return exactly h(O)
        elements and the orbit test must return orbit = h(O), stabilizer
        trivial. At h(O) = 1 it must return #(O/m)^*/#im(O^*). Both are
        independently computable from the discriminant, so the fixture is
        checkable without trusting the pipeline.
    observation_collision:
      observable: >-
        THE CARDINALITY PAIR (#X_m, #Cl_m(O)) -- which is the seed's gate.
      distinct_preimage_search: >-
        REQUIRED, AND IT SUCCEEDS, WHICH IS THIS RECORD'S CENTRAL FINDING. Two
        distinct ground-truth situations produce the identical observable: (i)
        the Cl_m(O)-action is simply transitive; (ii) the action is not
        transitive (say the orbit of x_0 has index 2) while both cardinalities
        remain h * #(O/m)^*/#im(O^*), since neither cardinality derivation
        refers to the action at all. The observable therefore does not separate
        the hypotheses, and by audit 2 of docs/inventor-protocol.md section 8 it
        is a direct falsifier of the gate's identifiability. The ADDITIONAL
        CONDITION that separates them is the orbit size, which is exactly the
        replacement test proposed in part (D). A concrete family where the
        cardinalities move together and the action does not: D_0 = -3 and -4,
        where #O^* is 6 and 4 and BOTH sides change by the same factor -- a
        demonstration that the observable is insensitive by construction.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Replace the cardinality (which is constant across both hypotheses,
          hence does not survive the discrimination) by the orbit-and-stabilizer
          pair, which does. Required maps recorded: strong state -> target
          property is "orbit = X_m and stabilizer trivial iff simply
          transitive"; one-step preservation is orbit closure under adjoining a
          generator; initialisation is the choice of base pair x_0.
        predicted_gain: >-
          None as an attack. The gain is discriminating power: a test whose
          prior probability of passing is near 1 for reasons unrelated to the
          hypothesis is replaced by one whose outcomes are separated by the
          hypothesis.
      - transform: representation_reduction
        proposed_object: >-
          The three-line derivation of part (C), with separate obligations:
          well-definedness (STEP 1), completeness/transitivity (STEP 2),
          soundness/freeness (STEP 3, which consumes the cardinality identity as
          a premise), and scope (O maximal only).
        predicted_gain: >-
          Converts an [open] feasibility obligation into a checkable derivation
          with a named scope boundary, which is strictly more useful than a
          numerical test that could not have decided it either way.
    quantifier_order: >-
      ASSERTED (the deflation): FORALL p > 3, FORALL ordinary E/F_p with
      End_{F_p}(E) = O MAXIMAL and E'(F_p) O-cyclic for every E' in the class:
      #X_m = #Cl_m(O), and this holds INDEPENDENTLY of any property of the
      action. Hence THERE EXISTS NO instance on which the identity distinguishes
      the transitive from the non-transitive hypothesis.
      ASSERTED (the derivation): FORALL such (p, E, O), the Cl_m(O)-action on
      X_m is simply transitive, by parts (C) STEP 1-3.
      NOT ASSERTED: anything for O non-maximal, where both statements are open
      and the record says so; that the orbit test cannot fail (it can, and
      Outcome 2 states what that would mean); that this bears on cost in any
      direction.
      NOTE: the derivation is uniform in the instance and constructs the
      connecting class explicitly, so it is a FORALL-instance THERE-EXISTS-a-
      uniform-procedure statement, not the void per-instance form.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For O maximal, the Cl_m(O)-action on X_m is simply transitive, and the
        cardinality identity is a consequence of the same three ingredients on
        both sides rather than a test of the action." It can NEVER certify
        anything about non-maximal orders, about supersingular curves, about
        cost, or about whether the torsor is useful.
      nearby_object_control: >-
        THE NON-MAXIMAL ORDER, and it is the object on which the desired
        conclusion genuinely fails or at least is not established: there
        m = (pi - 1) can share factors with the conductor, proper ideals are
        needed, and STEP 2's coprime representative may not exist. The method
        must REPORT that it does not apply rather than silently producing a
        number -- and an implementation that returns "simply transitive" for a
        non-maximal instance is identifying the wrong structure. A second
        nearby object: a deliberately BROKEN action (the planted non-transitive
        control), where the cardinalities still match and only the orbit test
        can tell.
    proof_obligations:
      - claim: >-
          The class contains exactly h(O) curves with End = O up to
          F_p-isomorphism.
        responsibility: baseline
        status: >-
          '[recall-confident, NOT re-verified this session]
          Deuring/Waterhouse/Kohel; literature access unavailable.'
      - claim: E'(F_p) ~= O/m as an O-module for every such E'.
        responsibility: correctness
        status: >-
          '[recall-confident, NOT re-verified this session] Lenstra 1996,
          relayed via IDEA-20260811-319a07.'
      - claim: >-
          Generators of the cyclic O-module O/m are exactly the classes in
          (O/m)^*, and Aut acts on them freely unless a unit is 1 mod m.
        responsibility: correctness
      - claim: >-
          O^* -> (O/m)^* -> Cl_m(O) -> Cl(O) -> 1 is exact, by elementary ideal
          arithmetic, and #Cl_m = h * #(O/m)^*/#im(O^*).
        responsibility: correctness
        status: >-
          The seed marks this [recall-confident] as class field theory. This
          record notes it is NOT class field theory: it is the elementary
          computation P_m/P_{m,1} ~= (O/m)^*/im(O^*) plus the standard fact that
          every ideal class contains a representative coprime to m. Recorded as
          a downgrade in dependency, and still NOT re-verified externally.
      - claim: >-
          phi_a restricted to E'[m] is an O-module isomorphism for a coprime to
          m.
        responsibility: correctness
      - claim: >-
          A transitive action of G on X with #G = #X is free.
        responsibility: correctness
      - claim: >-
          The cardinality identity is used as a PREMISE in the freeness step,
          hence cannot serve as an independent test of simple transitivity.
        responsibility: strictness

  predictions:
    - metric: >-
        #orbit(x_0) / #X_m under a generating set consisting of all split primes
        of norm below 100 together with a generating set of (O/m)^*, on fully
        enumerated toy classes
      direction: higher
      minimum_effect: >-
        exactly 1.000 on 100 percent of tested classes with O maximal. A value
        strictly below 1 on any class -- while the cardinality identity still
        holds -- is Outcome 2 and is the record's most consequential result: it
        would show the seed's gate passing on an instance where its claim is
        false, and would halt the ray-class line for a rebuild of the diagram.
    - metric: >-
        #Stab(x_0), the number of group elements fixing the base pair
      direction: lower
      minimum_effect: >-
        exactly 1 on 100 percent of tested classes with O maximal. Any nontrivial
        stabilizer contradicts freeness and, given transitivity, contradicts the
        cardinality identity -- so it would indicate an implementation defect
        before it indicated mathematics, and must be replicated independently.
    - metric: >-
        agreement of the counting identity #X_m = h * #(O/m)^*/#im(O^*), run as
        a REGRESSION FIXTURE rather than as a gate
      direction: different
      minimum_effect: >-
        exact equality on 100 percent of tested classes, INCLUDING on the
        planted non-transitive control where the action is deliberately broken.
        Equality on the broken control is the positive demonstration that the
        identity is action-blind; failure to hold there would refute this
        record's central deflation.
    - metric: >-
        the sequence of #orbit(x_0) values as generators are adjoined one at a
        time
      direction: higher
      minimum_effect: >-
        monotonically non-decreasing and reaching #X_m before the generating set
        is exhausted. A sequence that plateaus strictly below #X_m distinguishes
        "generating set too small" from "action not transitive" only if the set
        is known to generate Cl_m(O); the record therefore requires the
        generating set be certified against an independently computed
        #Cl_m(O) structure, and reports the plateau as inconclusive otherwise.

  minimal_test:
    design: >-
      STAGE 0 (ZERO COMPUTE, AND IT IS THE ENTIRE CENTRAL CLAIM). Write out the
      double count of part (B) and check by hand that both sides are the same
      expression. If a reviewer shows the two derivations differ -- e.g. that
      #X_m is NOT h * #(O/m)^*/#im(O^*) for some structural reason the record
      missed -- then the gate is not vacuous, this record is refuted at zero
      cost, and the seed's design stands. One page of algebra decides it.
      STAGE 1 (minutes). Toy ordinary curves at 12-20 bits with O maximal
      (f = 1), h(O) in [4, 40], and #X_m = h * #(O/m)^*/#im(O^*) small enough to
      enumerate (target below 10^6 elements; note #X_m ~ h * #E(F_p) grows like
      p^{3/2}, so p must stay small -- this is the binding budget constraint and
      it is stated up front).
      STAGE 2 (minutes). Enumerate X_m; compute #Cl_m(O) independently; run the
      counting identity as a REGRESSION FIXTURE.
      STAGE 3 (minutes). Run the orbit-and-stabilizer test, recording the pair
      after each adjoined generator.
      STAGE 4 (minutes). Run both the null object and the planted
      non-transitive control.
      Total: minutes to a low CPU-hour with a CAS doing binary-quadratic-form
      arithmetic and isogeny walks at toy size. No solver, no certificate, no
      new infrastructure, zero runs at any cryptographic parameter.
    controls:
      - >-
        PLANTED NON-TRANSITIVE CONTROL (mandatory, and it is the control the
        seed's design lacks): construct a SYNTHETIC action of a group of order
        #Cl_m on a set of size #X_m that is deliberately NOT transitive -- e.g.
        two orbits of equal size under an index-2 subgroup acting on each. The
        counting identity MUST still pass there (that is the record's
        prediction 3) and the orbit test MUST fail there. An orbit test that
        passes on the broken control is blind and the whole run set is INVALID
        rather than negative.
      - >-
        NULL OBJECT (matched, mandatory): m = (1). X_m becomes the curve set,
        Cl_m becomes Cl(O), and both tests must degenerate to the classical
        simply-transitive statement with orbit = h and stabilizer 1.
      - >-
        Two independent constructions of O/m -- from the binary quadratic form
        and from the explicit Z-basis {1, theta} with pi = A + B*theta -- must
        agree elementwise, so a ring-arithmetic bug cannot masquerade as a
        structural finding.
      - >-
        UNIT CONTROL: instances with D_0 = -3 and -4 (where #O^* is 6 and 4) are
        run and reported SEPARATELY, never pooled, and are used deliberately as
        the demonstration that both sides of the identity move together.
      - >-
        SUPERSINGULAR REFUSAL: one supersingular instance, where O is not
        commutative; the pipeline must refuse rather than emit a number.
      - >-
        NON-MAXIMAL REFUSAL: one instance with conductor f_E > 1; the pipeline
        must report "out of scope" rather than returning a transitivity verdict.
    required_metrics:
      - '#X_m by enumeration, and #Cl_m(O) from the exact sequence, per class'
      - '#orbit(x_0) and #Stab(x_0) per class, and the orbit sequence per adjoined generator'
      - the same three quantities on the planted non-transitive control
      - the same on the m = (1) null
      - per-instance h(O), |D|, conductor f, #O^*, #(O/m)^*, cofactor c

  controls:
    - >-
      PLANTED NON-TRANSITIVE CONTROL: as above. This is the two-directional
      control the deliverable requires, and it is the one that makes the
      deflation demonstrable rather than merely argued.
    - >-
      NULL OBJECT: m = (1), as above.
    - >-
      DECAY PARAMETER: h(O). As h -> 1 the quotient part of the exact sequence
      becomes trivial and X_m collapses to one fibre; the orbit test must still
      return orbit = #(O/m)^*/#im(O^*) and stabilizer 1. A verdict that changes
      character at h = 1 means the curve and point halves are not cleanly
      separated in the implementation.
    - >-
      A second decay parameter: Norm(m). Shrinking m toward (1) must shrink the
      fibre monotonically to a point. A fibre size that does not decay is the
      canonical artifact tell of docs/inventor-protocol.md section 3.

  confounders:
    - >-
      NON-MAXIMAL ORDERS. Part (C) is scoped to O maximal. For f_E > 1 proper
      ideals are needed and m may fail to be coprime to the conductor; the
      derivation is NOT claimed there and the pipeline must refuse.
    - >-
      O-CYCLICITY. If E'(F_p) is not O-cyclic for some curve in the class, the
      generator count per curve is not #(O/m)^* and the left side of the double
      count changes. Checked per curve, never assumed -- and note that under
      Lenstra's theorem it cannot fail, so a failure is a bug report about the
      implementation of the theorem, not about the theorem.
    - >-
      UNITS AT D_0 = -3, -4. Both sides of the identity change by the same
      factor, which is exactly why those instances are the sharpest
      demonstration of action-blindness and why they must be reported
      separately rather than pooled.
    - >-
      GENERATING SET ADEQUACY. An orbit smaller than X_m proves
      non-transitivity only if the generating set provably generates Cl_m(O). If
      it does not, the correct verdict is INCONCLUSIVE, not "non-transitive".
      This is the single largest interpretation hazard in the replacement test
      and it is stated before the measurement.
    - >-
      ENUMERATION BUDGET. #X_m ~ h * #E(F_p) ~ p^{3/2}, so full enumeration is
      confined to very small p. Every conclusion is scoped to that range and no
      extrapolation is offered.

  falsification_conditions:
    - >-
      A reviewer shows the two cardinality derivations of part (B) are NOT the
      same expression -- i.e. that #X_m is not h * #(O/m)^*/#im(O^*) for a
      structural reason. Then the seed's gate is genuinely discriminating, this
      record's central claim is false, and it is superseded at zero compute cost.
    - >-
      The orbit test returns orbit strictly below #X_m with a certified
      generating set, on any class with O maximal. Then simple transitivity is
      false as implemented, part (C)'s derivation has an error, and the
      ray-class line halts for a rebuild of the diagram.
    - >-
      The counting identity FAILS on the planted non-transitive control. Then
      the identity is not action-blind after all and the deflation is wrong.
    - >-
      The orbit test PASSES on the planted non-transitive control. Instrument
      blind; run set INVALID rather than negative.
    - >-
      The m = (1) null does not degenerate as specified. Pipeline defect; every
      measurement VOID.

  interpretation_limits:
    - >-
      THIS IS NOT AN ATTACK AND CONTAINS NO ALGORITHM. It audits a test and
      discharges an obligation; it moves no cost in any direction.
    - >-
      Part (C) is a `derivation` artifact under docs/claims-and-verification.md
      -- a checkable argument, never "proved" -- and it rests on two
      [recall-confident] relayed facts that could NOT be re-verified this
      session because WebSearch and WebFetch failed on every call and the
      crypto-kb index is empty. Every downstream use inherits that status.
    - >-
      Scoped to O MAXIMAL, ordinary, over F_p, with E'(F_p) O-cyclic, and to
      classes small enough to enumerate fully (p up to about 20 bits, since
      #X_m ~ p^{3/2}). Nothing is claimed for non-maximal orders, supersingular
      curves, extension fields, or any deployed curve.
    - >-
      Discharging the [open] obligation makes the seed's algebra STRONGER and
      its experiment WEAKER. Both halves must be reported together; quoting
      either alone misrepresents the record.
    - >-
      This record does not reopen RQ-CLGP-b99df5 and files no edit to
      DECOMPOSITION.md. Any consequence for L10's obstruction text is
      Coordinator work.

  assumptions:
    - >-
      A1. E ordinary over F_p, p > 3, End_{F_p}(E) = O MAXIMAL, N prime with
      N || #E(F_p). Checked per instance.
    - >-
      A2. '[recall-confident, NOT re-verified this session] Lenstra 1996, CM
      structure of E(F_p), relayed via IDEA-20260811-319a07.'
    - >-
      A3. '[recall-confident, NOT re-verified this session]
      Deuring/Waterhouse/Kohel: the class contains h(O) curves with End = O up
      to F_p-isomorphism, and Cl(O) acts simply transitively on them.'
    - >-
      A4. The exact sequence O^* -> (O/m)^* -> Cl_m -> Cl -> 1 is elementary
      ideal arithmetic rather than class field theory -- a downgrade of the
      seed''s stated dependency, still NOT externally re-verified.

  heuristic_assumptions:
    - id: HA-1
      statement: >-
        NOT A HEURISTIC -- RECORDED SO NO CONDITIONALITY IS IMPORTED. Every
        claim in this record is exact finite algebra: two cardinality
        computations, an orbit-stabilizer argument, and a finite enumeration.
        There is no distributional assumption anywhere, no smoothness input, no
        mixing assumption, and no asymptotic claim. In particular the derivation
        of part (C) is unconditional given A2-A4.
      rigorous_support: >-
        Finite group actions (orbit-stabilizer), elementary ideal arithmetic in
        an imaginary quadratic order, and the two relayed structure theorems
        A2-A3, whose status is [recall-confident] rather than heuristic -- an
        unverified citation is a different defect from an unproved distribution
        and the record does not conflate them.
      validation_plan: >-
        The counting identity (prediction 3) and the orbit test (predictions
        1-2) ARE the validation: all are exact and computable on fully
        enumerated toy classes, so the algebra is checkable rather than sampled.
        Sampled parameters recorded explicitly: p at 12-20 bits, h(O) in
        [4, 40], #X_m below 10^6, D_0 = -3 and -4 reported separately. TRANSFER
        ASSUMPTION, STATED: none is made -- no quantity here is extrapolated
        beyond the enumerated range, because every claim is an identity rather
        than an estimate.
      tail_checks: >-
        Not applicable (no distribution). The analogues are the planted
        non-transitive control (which must break the orbit test while passing
        the counting identity) and the D_0 = -3, -4 instances (where both sides
        of the identity must move together by the same factor).
    - id: HA-2
      statement: >-
        For the ORBIT TEST ONLY, and it is a genuine assumption: the chosen
        generating set -- the classes of split primes of norm below 100
        together with a generating set of (O/m)^* -- generates Cl_m(O). This
        imitates the standard assumption that small split primes generate the
        class group, which is Bach's GRH bound (primes below 6 (log |D|)^2
        generate Cl(O)) extended to the ray class group; the extension is NOT
        established here and is treated as an assumption to be CERTIFIED per
        instance rather than believed.
      rigorous_support: >-
        Pairs the GRH-conditional Bach bound for Cl(O) with the elementary fact
        that (O/m)^* surjects onto the kernel of Cl_m -> Cl, so a generating set
        of the kernel plus a generating set of the quotient generates the
        extension. The gap is only in whether the small-prime set generates the
        QUOTIENT, which is Bach's statement.
      validation_plan: >-
        Certified rather than sampled: for each toy class, compute the subgroup
        of Cl_m(O) generated by the chosen set (by enumerating its closure) and
        compare its order against the independently computed
        #Cl_m = h * #(O/m)^*/#im(O^*). If they differ, the generating set is
        inadequate and every orbit verdict on that class is reported as
        INCONCLUSIVE rather than negative. Record the norm bound used, the
        number of generators, and the certified subgroup index per class.
      tail_checks: >-
        Record the largest norm bound needed across the ladder and compare it
        against 6 (log |D|)^2. A class needing a materially larger bound is
        flagged as an outlier and reported, since it would indicate the
        small-prime generation heuristic is weaker for ray class groups than for
        class groups -- itself a recordable observation about the extension.

  reachability_gate: >-
    T5 STATUS: NOT BINDING, BUT PRESENT IN A NEW FORM. Reaching a specified
    curve is not required -- the orbit test walks the WHOLE set by BFS rather
    than aiming at a target, so random reachability suffices and specified
    reachability never arises. What does bind is the enumeration budget
    (#X_m ~ p^{3/2}), which is a memory constraint rather than a reachability
    one and is stated as the binding limit in the minimal test.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED AND NONE MOVES. ECDLP remains at p^{1/2}
      (0.886*sqrt(N)). The exponents this record states are INSTRUMENT costs,
      not attack costs: enumerating X_m costs Theta(h * #(O/m)^*) =
      Theta(p^{3/2}) time and memory, and the orbit BFS costs the same up to the
      number of generators. Those numbers are far ABOVE the rho baseline and are
      the reason the test is confined to toy scale -- an important honesty item,
      since a reader might otherwise mistake a torsor enumeration for an attack
      component.
    memory_exponent: >-
      Theta(p^{3/2}) for the full enumeration of X_m -- the binding constraint,
      and worse than BSGS's sqrt(N). O(log p) for the derivation, which is
      scale-free.
    best_known: >-
      Parallel Pollard rho with distinguished points at 0.886*sqrt(N) group
      operations and O(1) memory (KN-TECH-001, KN-TECH-006); BSGS at sqrt(N)
      time and memory (KN-TECH-031); automorphism-discounted rho at
      0.886*sqrt(N/|Aut|) (KN-TECH-018), sqrt(6) being calibration and never an
      exponent. None is changed by this record.
    hidden_overhead: >-
      Nothing hides in an o(1) because no asymptotic algorithm is proposed. What
      IS disclosed: the enumeration cost p^{3/2} makes this test structurally
      toy-only, and no amount of engineering changes that; and the derivation
      presumes O maximal and known D, the latter requiring the subexponential
      factorisation of t^2 - 4p at crypto scale.
    tradeoff_note: >-
      Not applicable as an attack. For the record: the enumeration is a pure
      memory-bound computation with no time-memory tradeoff available (the set
      must be materialised to compute an orbit closure exactly), which is
      precisely why the record recommends the orbit test only at the scale where
      the set fits, and recommends the counting identity be retained as a cheap
      regression fixture at every scale where the set does not.

  sota_delta: >-
    Zero. 0.886*sqrt(N) before, 0.886*sqrt(N) after, O(1) memory in both cases.
    The delta is methodological and negative: it removes a designated hard gate
    that could not have discriminated, supplies the derivation that closes the
    seed's [open] obligation for O maximal, names the exact scope where the
    obligation stays open (non-maximal orders), and installs the replacement
    test together with the planted control that makes the replacement
    demonstrable rather than merely argued.
  dominated_by: >-
    CHECKED ACROSS TIME, MEMORY AND DATA/QUERIES against every row of the
    prime-field frontier this campaign recognises: parallel rho with
    distinguished points (0.886*sqrt(N), O(1) memory, KN-TECH-001/006);
    automorphism-discounted rho (KN-TECH-018); BSGS (sqrt(N) time and memory,
    KN-TECH-031); Pollard kangaroo on an interval of width W (about 2*sqrt(W));
    van Oorschot-Wiener at sqrt(N^3/w) with memory w. This record mounts no
    attack; its own instrument costs p^{3/2} in time AND memory, so it is
    dominated by every row on both axes by a wide margin, and it consumes no
    oracle queries. dominated_by is NOT null.

  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.93 that the double count of part (B) survives review as written -- the
    two derivations are short and share their ingredients transparently, and the
    residual risk is an isomorphism-counting subtlety at D_0 = -3, -4 or a
    twist-counting error in the h(O) statement. 0.88 that the derivation of part
    (C) survives, the residual risk being STEP 2's choice of a coprime ideal
    representative in a class when m has large norm. 0.90 that the orbit test
    returns orbit = X_m with trivial stabilizer on every maximal-order toy
    class. 0.60 that the generating-set adequacy assumption (HA-2) certifies on
    every class without enlarging the norm bound. Below 0.05 that Outcome 2
    occurs -- and it is the outcome that would matter most, which is why the
    planted non-transitive control exists.

  p2_p3_flags: >-
    P2: NOT ADJACENT. No factor base, phi-stable or otherwise, appears anywhere.
    H-STR-002 and DEFER-BATCH009-001 are untouched in both directions. The
    small-prime generating set of HA-2 is a GENERATING SET for a group action,
    not a factor base for a relation search, and no relation is collected.
    P3: NOT TRIGGERING AND NOT ADJACENT. The only exponents stated are 1/2 (the
    unchanged rho baseline) and 3/2 (the instrument's own enumeration cost,
    which is worse than every baseline). No candidate appears that could exceed
    the automorphism-discounted rho baseline, and sqrt(6) is not invoked.

