idea:
  id: IDEA-20260905-df7df5
  title: Exact lumpability as a sufficient condition for transcript simulation
  class: mechanism
  claim: A finite-state quotient of a signer model admits an exact public simulator whenever all hidden states in
    each quotient fiber induce identical probabilities on every public transition; the smallest failed equality
    localizes a structural simulation obligation.
  mechanism: Let K be a rational stochastic kernel and pi the projection to public states. Strong lumpability requires
    sum_{z:pi(z)=b} K(x,z) to be independent of x in each fiber pi(x)=a. Under that condition the quotient kernel
    is well-defined and propagates public distributions without hidden-state information. The proposal asks for
    a proof certificate of these equalities at source-defined abstraction boundaries, including success and retry
    states. It distinguishes a genuine quotient from a simulator that accidentally receives hidden advice. The object
    can discard most internal state while preserving exactly the operation needed for public evolution.
