  citation_note: >-
    crypto-kb empty this session; Grep plus WebFetch/WebSearch. The R4
    constants are the corpus note's reported figures; every exponent and
    threshold above is hand-derived from binomial entropy and labelled.

  assumptions:
    - Advice depends on (G, P) and the public parameters (m, w) only; it never sees Q.
    - The online walk's jump is a function of the current group element only, so that walks merge after a collision; a jump depending on the walker's private offset is a list method and is charged as the R3 row.
    - S counts entries; bits per entry are reported, and a truncated-key entry is never counted as fewer entries.
    - P is charged in group additions, including over-generation for Bernstein-Lange selection; precomputation is never free in the reported points even though the model allows it.
    - Toy scale only; m in {20, 24} for the exact sumset arm, {24, 28, 32} for the table arm.

  proof_search_map:
    bottleneck: >-
      Whether a hash-realisable jump-sum set J_T exists with |W + J_T| far below
      the random-set value at the same |J_T| -- the single property whose
      presence would let translation-walk advice beat the split row.
    baseline_embedding:
      parameter_slice: >-
        W replaced by the whole interval [0, 2^m) must reproduce R4's law
        (S T^2 about c 2^m with the reported constants within a factor 2);
        tame starts drawn from W with jumps {1, ..., 16} must land on the R3
        line S T about |W| mu; sigma = 0 must reproduce the advice-free rows.
      reproduction_check: >-
        Frozen fixture before any W measurement: at m = 24 build BL interval
        tables at S in {2^6, 2^8} and measure T and epsilon on 200 uniform
        targets in [0, 2^24); the product S T^2 / 2^24 must lie within a
        factor 2 of the value implied by KN-LIT-3060's 1.93 and 1.21 figures.
    observation_collision:
      observable: The pair (|J_T|, |W + J_T|) and the ratio rho against W'.
      distinct_preimage_search: >-
        REQUIRED. Two jump families with equal |J_T| but different structure
        (single bits versus r-adding random jumps) must be compared at equal
        T; and W must be compared with W' (random, same size) and with the
        planted structured class W_ap (an arithmetic progression of the same
        size, a known approximate group) on which rho MUST be large. A method
        that reports the same rho on W_ap and W' has not identified the
        load-bearing structure.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: The preprocessing frontier of the low-weight DLP reduced to the sumset size |W + J_T| through the BL region law.
        predicted_gain: A single exact integer per (Sigma, T) decides whether the frontier can move.
      - transform: specialization_pack
        proposed_object: The exponent table sigma -> tau for R3, R4 and LB with the alpha thresholds 0.110 and 0.174.
        predicted_gain: Locates where the gap is an exponent (alpha < 0.11, every sigma) and where it is only between R4 and LB.
    quantifier_order: >-
      EXACT: FOR the declared cells, jump families, walk seeds and T values,
      |W + J_T| and |W' + J_T| are as counted (bitmaps, no sampling of W).
      HEURISTIC: FOR ALL translation-walk advice, achievable (S, T, epsilon)
      obey S T^2 ~ c epsilon |R_T| (H1). OBLIGATION: FOR ALL generic algorithms
      with advice, S T^2 = Omega~(epsilon |W|) for targets uniform on W
      (P-CGK-W). No claim is made for advice that is not walk-based.
    method_ceiling:
      strongest_certifiable_claim: >-
        "For the tested jump families and sizes the structural ratio rho is as
        measured; under H1 translation-walk advice is confined to the
        min(R3, R4) envelope on this ladder." It cannot certify anything about
        list-based advice beyond R3, nested or representation-based advice, or
        the exponent at cryptographic m.
      nearby_object_control: >-
        W_ap, an arithmetic progression of the same size as W: an approximate
        group, so |W_ap + J_T| stays near |W_ap| for jumps of the progression's
        step, rho is large, and BL advice reaches S T^2 ~ |W_ap| -- the
        conclusion of E1 FAILS there by construction.
    proof_obligations:
      - claim: R3 row -- S <= 2 m C(b, w1), T <= 2 m C(m - b, w - w1), epsilon = 1 by the cyclic-window argument; S T <= 4 m^2 C(m, w).
        responsibility: size
      - claim: Exponent table and thresholds (H(alpha) = 1/2 at alpha about 0.110; H(alpha) = 2/3 at alpha about 0.174).
        responsibility: baseline
      - claim: P-CGK-W -- the preprocessing floor for targets uniform on W, adapted from KN-LIT-013; until discharged LB is labelled conjectural.
        responsibility: correctness
      - claim: Region-law bookkeeping reproduces R4 on the interval and the R3 line for small jumps (both slices measured).
        responsibility: runtime
      - claim: Every solved target carries a certificate re-verified independently with a popcount check; advice and online costs are counted by one frozen counter.
        responsibility: interface
      - claim: Nothing is claimed for non-walk advice, for cryptographic m, or for RQ-ECDLP-78dbc5's uniform-target constant.
        responsibility: scope
    not_applicable_reason: null

  null_object_control: >-
    NULL-1 (RANDOM RELABELLING, BLOCKING): W' uniform random subset of
    [0, 2^m) with |W'| = |W| (five seeds); every sumset count and every table
    measurement repeated on W'. The split row R3 cannot even be built for W'
    (no window structure), which is the expected structure dependence; the
    deficit Def(W', Sigma, T) is the reference for rho. NULL-2 (APPROXIMATE
    GROUP, positive control): W_ap of the same size; rho must be large there.
    DECAY TEST: W_q replaces a fraction q of W by random elements,
    q in {0, 0.25, 0.5, 0.75, 1}; any rho above 1 at q = 0 must decay
    monotonically to 1 at q = 1; an excess flat in q is an artifact
    (docs/inventor-protocol.md section 3) and voids that jump family.

  predictions:
    - metric: M1 -- interval slice, S T^2 / 2^m for BL interval tables at m = 24
      direction: different
      minimum_effect: Within a factor 2 of the value implied by KN-LIT-3060; otherwise the table instrument is wrong and nothing else is read.
    - metric: M2 -- rho = Def(W) / Def(W') per jump family, T in {2^4, 2^6, 2^8, 2^10, 2^12}, cells (m, w) in {(20, 2), (20, 3), (20, 5), (24, 3), (24, 4), (24, 6)}
      direction: different
      minimum_effect: >-
        E1 iff rho <= 2 for every family at every T >= 2^6 with no upward trend
        in T; E2 iff some family reaches rho >= 8 at T = 2^{10} and rho(2^{12})
        > rho(2^{10}) at two or more cells. Between, INCONCLUSIVE.
    - metric: M3 -- rho on W_ap (positive control)
      direction: higher
      minimum_effect: rho >= 8 at T = 2^{10} for the progression-step jump family; failure voids the arm.
    - metric: M4 -- measured (S, T, epsilon, P) points of R3 and R4 at m in {24, 28, 32}, w with alpha in {1/8, 3/16, 1/4}
      direction: different
      minimum_effect: Each point within a factor 4 of its closed-form row (poly(m) and constants included); the measured crossover between R3 and R4 at S = T reported against the predicted alpha about 0.174 (finite-m shift expected and stated).
    - metric: M5 -- best walk-advice point at each cell versus min(R3, R4)
      direction: lower
      minimum_effect: Measured only if M2 returns E2; a point below the envelope by a factor >= 4 at two m values is the lead.

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): closed-form R0/R3/R4/LB table per cell
      and the alpha thresholds; hashed.
      STAGE 1 (the discriminator, exact integer work, minutes): for m in
      {20, 24} and the six cells of M2, compute W exactly; for each jump family
      -- (J-a) r-adding with r = 16 and jumps uniform in [1, 2^{m/3 + 1}],
      (J-b) signed single bits +-2^i, (J-c) exchanges 2^a - 2^b, (J-d) unit
      scale {1, ..., 16} -- run 10 hash-driven walks per T (keyed hash of the
      Z/l element, seeds recorded) on (Z/l, +) with l the least prime above
      2^{m + 2}, collect J_T, and count |X + J_T| by a bitmap over
      [-2^{m+2}, 2^{m+2}] for X in {W, W' (five seeds), W_ap, W_q}. Output
      Def, rho, the decay curves. No group element is needed beyond the walk
      itself.
      STAGE 2 (hours; run in full only for the frontier rows, and for walk
      advice only if Stage 1 returns E2): on (Z/l, +), R3 tables for b on a
      grid giving sigma in {0.1, 0.2, 0.3} and R4 tables built per
      KN-LIT-3060 (over-generation and most-popular selection) at
      S in {2^{m/4}, 2^{m/3}}; 30 planted targets per point, certified;
      (P, S, T, epsilon) recorded with U in {1, 16} (advice shared across the
      batch, P amortised, per-target T reported); one cell repeated on a
      self-generated prime-order toy curve.
      OUTCOME TABLE. E1 (rho <= 2, flat in T, controls pass): record the
      obstruction quantity rho with its values and scope, the frontier
      min(R3, R4) as measured, and the exponent gap at alpha < 0.11 as an open
      problem; forward guidance to list-based and nested advice. E2: design a
      W-adapted advice table for the winning family and measure it against the
      envelope (M5). ARTIFACT: W_ap not detected, decay flat, or M1 outside
      its band -> void.
      FALSIFICATION THRESHOLDS, FIXED NOW: E1 falsified by rho >= 8 at
      T = 2^{10} rising with T at two cells; E2 falsified by rho <= 2 for all
      families at all T >= 2^6.
    controls:
      - NULL-1 random relabelling W' of equal size, five seeds (blocking).
      - NULL-2 arithmetic progression W_ap of equal size, where rho must be large (blocking positive control).
      - DECAY ladder W_q (blocking for any rho > 1).
      - Interval slice reproducing KN-LIT-3060's reported constants within a factor 2 (blocking for Stage 2).
      - Advice-free rows (kangaroo, Coppersmith MITM) on the same Stage-2 instances with their own storage traces.
      - Elliptic consistency arm at one cell.
    required_metrics:
      - per (cell, family, T, seed) the integers |J_T|, |W + J_T|, |W' + J_T|, |W_ap + J_T|, Def and rho
      - decay curves rho(q)
      - per Stage-2 point P, S (entries and bits), T, epsilon with its confidence interval, U, certificate counts
      - the closed-form row values beside every measured point
      - sha256 of the Stage-0 table and of every count file

  falsification_conditions:
    - 'F1. M1 outside its factor-2 band: table instrument wrong; Stage 2 void.'
    - 'F2. rho >= 8 at T = 2^10 and rising at two cells, with W_ap, NULL-1 and decay passing: E1 falsified (favourable branch).'
    - 'F3. rho <= 2 for every family at every T >= 2^6: E2 falsified; E1 recorded with the measured rho as the obstruction value.'
    - 'F4. W_ap shows rho near 1, or a rho excess does not decay in q: instrument or family void.'
    - 'F5. A Stage-2 R3 or R4 point more than a factor 4 from its formula: the row formula, not the region law, is re-derived first.'
    - 'F6. Budget exhaustion or crash: infrastructure outcome under AGENTS.md rule 3.'

  confounders:
    - At m = 20 to 24 the poly(m) factors of R3 (2 m windows, two weights) are comparable to the exponent differences; Stage 2 compares with the closed form including those factors.
    - Bitmap counting of W + J_T is exact but J_T depends on the hash seed; ten seeds per point and the spread are reported.
    - BL selection constants depend on over-generation; the interval slice pins them before W is measured.
    - Negative jumps (J-b, J-c) make the region two-sided; the bitmap covers the full range and wrap modulo l is excluded by l > 2^{m+2}.
    - P-CGK-W is unproved; LB is labelled conjectural wherever it is used.

  interpretation_limits:
    - Claim tier toy; m <= 32.
    - E1 is scoped to translation-walk advice with the tested jump families; it does not close list-based, nested or representation-based advice, nor the RQ.
    - The exponent thresholds 0.110 and 0.174 are asymptotic statements from the row formulas; the measured crossover at toy m is reported separately.
    - Nothing here changes RQ-ECDLP-78dbc5's uniform-target constant.
    - No experiment, hypothesis, approval or status change is created by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (BL region law.) For translation-walk advice with distinguished-point
        density theta and online walks of length T over region R_T, the
        achievable points satisfy S T^2 = c epsilon |R_T| (1 + o(1)) with c
        within a factor 4 of the full-group Bernstein-Lange constant.
      rigorous_support: >-
        Imitates the random-mapping coverage argument behind KN-LIT-3060 and
        the matching CGK bound (KN-LIT-013), both stated for uniform targets in
        a group of order N; here N is replaced by the region the online walk
        can occupy. No theorem is claimed.
      validation_plan: >-
        SAMPLE: the interval slice (R = [0, 2^m)) and the small-jump W slice
        (R about |W| T mu) at m = 24, 30 targets per point; COMPARE measured
        S T^2 with c |R_T|; TAIL: report the worst point per slice. TRANSFER:
        none beyond m = 32.
    - id: H2
      statement: >-
        (Realisable jump sums are generic.) For jump rules depending only on the
        current group element, J_T is distributed like the partial sums of an
        i.i.d. jump sequence from Sigma, so |X + J_T| depends on X only through
        |X| and the representation function of X - X on J_T - J_T.
      rigorous_support: >-
        A keyed hash of the group element imitates an i.i.d. choice (the
        random-oracle walk model of KR-RHO-93979e's references); the sumset
        identity |X + J| = |X| |J| - (overlaps) with overlaps counted by
        r_{X - X}(j - j') is exact.
      validation_plan: >-
        SAMPLE ten keyed hashes per (family, T); COMPARE the measured |J_T| and
        the overlap counts with the i.i.d. partial-sum prediction computed by
        Monte Carlo on the integers alone (no group); TAIL: the largest
        deviation across seeds.

  target_complexity:
    time_exponent: >-
      NO ALGORITHM CLAIMED. Frontier (exponents of m): R3 tau = H(alpha) -
      sigma; R4 tau = (1 - sigma)/2; LB (conjectural adaptation) tau >=
      (H(alpha) - sigma)/2. For alpha < 0.110 the open gap is a factor 2 in the
      online exponent at every table size; at sigma = 0 it is the RQ target
      itself.
    memory_exponent: S = 2^{sigma m} advice entries by construction; online memory O(1) words plus the walk state.
    best_known: >-
      Advice-free: Coppersmith / Stinson sqrt(C(m, w)) time and storage
      (recalled); Esser-May polynomial memory as reported (KN-LIT-4794);
      kangaroo 2^{m/2 + 1}. With advice: R3 (this record's construction from
      the recalled splitting argument) and R4 (KN-LIT-3060 reported constants).
    hidden_overhead: >-
      R3 carries 2 m^2 window factors; R4 carries Bernstein-Lange's selection
      constants and P about 1.2 S T; probes are uncharged in the addition count
      and reported beside it. No superpolynomial term is hidden.
    tradeoff_note: >-
      The record IS a time-memory-precomputation tradeoff map; U targets share
      advice so P amortises over U, while per-target T is unchanged (no batch
      effect beyond KR-RHO-46c2c6 is claimed). Online walks parallelise
      linearly.

