  question_id: RQ-LHW-1877bb
  related_question_ids: [RQ-ECDLP-78dbc5]
  goal_id: null
  goal_id_note: >-
    RQ-LHW-1877bb carries goal_ids [] at filing time. Left null deliberately.
  added: '2026-10-01'
  status: proposed
  approved_by: null
  title: >-
    THE LOW-WEIGHT DLP WITH PREPROCESSING, FULLY CHARGED IN (P, S, T, epsilon,
    U): RQ-LHW-1877bb is the S = poly corner of a two-parameter frontier whose
    two incumbent rows -- Coppersmith-split advice tables at S T = |W| m^{O(1)}
    and Bernstein-Lange interval tables at S T^2 = c 2^m -- leave an exponent
    gap to the adapted generic floor S T^2 >= epsilon |W| at EVERY table size
    when the weight ratio alpha is below about 0.11; a walk-region law
    S T^2 ~ |W + J_T| reproduces both rows, so translation-walk advice can close
    the gap only if some hash-realisable jump-sum set J_T has a sumset with
    W(m, w) far smaller than a random set of the same size does -- the deficit
    ratio measured exactly against that random-set null
  class: measurement

  claim: >-
    SETTING. Generic prime-order group, Q = [x]P with x in W(m, w), 2^m < n,
    alpha = w/m, H the binary entropy. Preprocessing model (KN-LIT-013,
    KR-RHO-ea34b8): an offline phase of P group additions emits S words of
    advice about (G, P) only; the online phase uses T group additions per target
    and succeeds with probability epsilon; U targets may share one advice
    string. Group additions are the cost unit; probes and storage are reported
    separately; S counts stored entries (group element or truncated key plus a
    logarithm) and their bits are reported beside.

    LANE FRAME. Memory-heavy baseline without advice: Coppersmith / Stinson
    split at sqrt(C(m, w)) m^{O(1)} time and storage (recalled; KN-LIT-2177,
    KN-LIT-2135). Low-memory prior: Esser-May as reported (KN-LIT-4794);
    kangaroo 2 * 2^{m/2}. Obstruction: no cheap well-mixing map from W(m, w) to
    itself; blind translations leave W. THIS RECORD asks whether advice -- free
    offline work -- escapes that obstruction, and states the question as one
    measurable quantity.

    (A) THE FRONTIER ROWS (formulas; constants where the row reports them).
    R0, no advice: kangaroo 2 * 2^{m/2} (KR-RHO-898783); single-level half-split
    walk about |W|^{3/4} 2^{-w/4} (IDEA-20260906-ab08cb, heuristic); Esser-May
    as reported. R3, SPLIT ADVICE: for window length b and w1 in {floor(w b /
    m), ceil(w b / m)}, store ([a]P, a) for every a of weight w1 supported in
    each of the m cyclic windows of length b (S = 2 m C(b, w1) entries,
    P = O(S) additions by Gray-code enumeration); online, for each window
    enumerate the complementary weight-(w - w1) parts c and look up
    Q - [c]P (T <= 2 m C(m - b, w - w1)); epsilon = 1 because the window count
    of ones moves by at most one per shift and averages w b / m (Coppersmith's
    argument, recalled). Since C(b, w1) C(m - b, w - w1) <= C(m, w),
    S T <= 4 m^2 |W|. R4, INTERVAL ADVICE: Bernstein-Lange tables for an
    interval of order L = 2^m, reported 1.93 L^{1/3} online with a table of
    L^{1/3} entries after 1.21 L^{2/3} precomputation (KN-LIT-3060), scaling as
    S T^2 = c L along the table-size axis. LB: the generic preprocessing floor
    S T^2 = Omega~(epsilon N) is proved for uniform targets in a group of order
    N (KN-LIT-013); its adaptation S T^2 = Omega~(epsilon |W|) for targets
    uniform on W is proof obligation P-CGK-W, not assumed.

    (B) EXPONENT TABLE (hand-derived from the formulas; sigma = log2 S / m,
    tau = log2 T / m). R3: tau = H(alpha) - sigma. R4: tau = (1 - sigma)/2.
    LB: tau >= (H(alpha) - sigma)/2. R4 beats R3 iff sigma < 2 H(alpha) - 1;
    so for alpha below about 0.110 (H(0.11) = 0.4999) R3 is the better row at
    every sigma and sits a FACTOR 2 IN THE EXPONENT above LB:
    tau_R3 - tau_LB = (H(alpha) - sigma)/2. At the balanced point S = T, R3
    gives H(alpha)/2 and R4 gives 1/3, crossing at H(alpha) = 2/3, alpha about
    0.174 (H(0.174) = 0.6668, hand-computed). At sigma -> 0 the frontier is the
    advice-free one and LB reads tau >= H(alpha)/2: the RQ's own target.

    (C) WALK-REGION LAW (heuristic H1). For advice built from hash-driven
    translation walks (the Bernstein-Lange family: y -> y + [s(h(y))]P with
    jumps from a set Sigma, distinguished points stored with their logs) and
    online walks of length T started from Q + [d]P for known re-randomisers d
    in D0, the achievable points satisfy S T^2 ~ c epsilon |R|, where
    R = W + D0 + J_T and J_T is the set of jump sums the online walk realises
    within T steps. With R the whole interval this is R4; with tame starts in W
    and unit-scale jumps it is the line S T ~ |W| mu (mu the mean jump), i.e.
    R3's line. The law is the familiar 'online walk must land on precomputed
    trails spread over R' bookkeeping, not a theorem.

    (D) THE ONE QUANTITY. Advice of this family can move below the R3 / R4
    envelope only if |W + J_T| is much smaller than |W| |J_T| for a REALISABLE
    J_T -- one generated by a jump rule that depends on the group element only
    (merging after a collision requires it). Define the deficit
    Def(X, Sigma, T) = |X| |J_T| / |X + J_T| >= 1 and the structural ratio
    rho = Def(W, Sigma, T) / Def(W', Sigma, T) against a random set W' of the
    same size. Structured jump sets show W has additive structure (W + W(m, j)
    lies inside weights up to w + j plus carries), but those sets are realised
    only by enumeration, which is the split row itself; hash-driven partial
    sums are not. Single-bit jumps overlap W with its translate by a fraction
    about alpha (1 - alpha) per step (hand-derived: y in W with bit i set and
    bit i + 1 clear maps into W under + 2^i), which predicts a bounded rho.

    THE TWO EXPLANATIONS. E1 (NO ESCAPE): for every realisable jump family
    tested, rho <= 2 at T >= 2^6 and does not grow with T; advice built from
    translation walks inherits the LHW obstruction, the frontier is
    min(R3, R4) and the exponent gap to LB at alpha < 0.11 stands as an open
    problem with a named, measured obstruction. E2 (STRUCTURED GROWTH
    DEFICIT): some realisable family gives rho >= 8 at T = 2^{10} and rising
    with T; a W-adapted advice table could then beat R3 at some sigma, which is
    an exponent-level lead in the preprocessing model and, at sigma -> 0, bears
    on the RQ target directly.

  mechanism: >-
    OBJECT FRAME. Tracked object: the walk region R_T = W + D0 + J_T, a lossy
    projection of the online walk's trajectory (it forgets the order and
    multiplicity of visits and the hash path, keeping only the set of exponent
    offsets the walk can occupy relative to x). Representation: exponent
    offsets carried beside group elements. Operation set Sigma = {translation
    by a jump chosen as a function of the current group element}. LOSSY-
    PROJECTION TEST against Sigma: R_{T+1} = R_T union (R_T + s) for the jump s
    taken, so the region propagates deterministically given the jump sequence;
    it discards the trajectory order, which BL coverage does not need; it is
    genuinely lossy (|J_T| <= T while the trajectory carries T group
    elements). TRICHOTOMY: partial-action object -- translation by the chosen
    jumps acts, translation by arbitrary elements does not keep R small
    (c5d183); the price is |R_T|, measured exactly as a sumset. WHY THE LAW
    REPRODUCES BOTH ROWS: BL's argument is that an online walk of T steps
    meets precomputed trails covering a fraction P / |R| of the region at each
    step, so T = |R| / P, and storing one point per trail of length about T
    gives S = P / T, hence S T^2 = |R|. For the interval, |R| = 2^m. For W with
    small jumps, |R| is about |W| T mu and the law collapses to S T = |W| mu,
    the split line. The only way to reach S T^2 ~ |W| is |R| ~ |W|, i.e.
    W + J_T no bigger than W up to poly(m): an approximate-group property W
    lacks unless the hash-driven jump sums are special. The record measures
    exactly that.
    OFF-LIMITS AS PRIMARY LENS: hash-iterated single-level walks without advice
    (IDEA-20260906-ab08cb), nested replay (IDEA-20260906-3493fe), exchange walks
    (IDEA-20260906-7d5c16), carry mixtures (IDEA-20260906-c37df9); the
    full-group table constant work of RQ-ECDLP-78dbc5 (nine proposals, five
    hypotheses), which this record does not touch.

