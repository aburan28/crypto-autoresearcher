idea:
  id: IDEA-20260816-49b818
  question_id: RQ-NTRU-9015ee
  added: '2026-08-16'
  title: Build a block-circulant family that interpolates continuously from matrix NTRU to ring NTRU
    at fixed dimension, determinant and secret norm, with the orbit rank as the only moving part,
    and measure the structure discount as a function of that rank rather than as a yes-or-no
  class: mechanism
  claim: '(A) The question of what ring structure buys is usually posed as a comparison of two points,
    structured and unstructured. A comparison of two points cannot yield a growth direction, which
    is exactly what KN-OPEN-026 Q2 asks for. The proposal is to replace the two points with a family.
    Let n = r m and build the NTRU-style lattice over the ring Z[x]/(x^r - 1) with module rank m:
    the secret is an m by m matrix over that ring, the public key is its quotient, and the lattice
    has dimension 2n, determinant q^n and a planted sublattice of rank n generated by m independent
    objects each carrying an orbit of size r. At r = 1 this is matrix NTRU with no ring structure
    at all; at r = n and m = 1 it is ordinary ring NTRU; the divisors of n in between give a ladder.

    (B) The claim is that dimension, determinant, modulus, planted rank and total secret Frobenius
    norm are all held exactly fixed across the ladder by construction, so r is the only moving variable,
    and any monotone quantity measured across the ladder is attributable to orbit rank alone. The
    r = 1 rung IS the matched unstructured control, executed in the same invocation as every other
    rung by the same code, which is the strongest form of the control-executability requirement.

    (C) The measured discount is reported in two commensurable ways: the orbit correlation log-determinant
    from the companion entry, which needs no reduction, and the reduction budget required to recover
    the plant at fixed success probability, which does. The deliverable is the discount as a function
    of log r with its shape, extensive, saturating or flat, and the two measures reported side by
    side so that the cheap predictor can be scored against the expensive observable.

    (D) What is NOT claimed: no attack and no security consequence; the reduction arm runs at toy
    dimensions only and a recovered plant there is a fact about a small lattice. It is not claimed
    that the interpolation is the only one possible or that r is a canonical measure of structure.
    It is not claimed that the two measures will agree; scoring them against each other is the point,
    and disagreement is the more informative outcome.'
  mechanism: 'Stage 1, construction: implement the block-circulant family and prove by exact computation,
    not by argument, that dimension, determinant, planted rank and total Frobenius norm agree across
    all rungs. This is checked by the matching certificate from the companion tooling entry, so the
    family''s central premise is gated rather than asserted.

    Stage 2, cheap measure: compute the planted sublattice''s normalised correlation log-determinant
    at each rung. Because the plant is n vectors in every rung, the quantity is directly comparable
    across r, and its r-dependence is the zero-compute discount curve.

    Stage 3, expensive measure: at toy dimensions, run reduction at increasing block size until the
    plant is recovered, with recovery certified independently, and record the smallest budget achieving
    a fixed success probability per rung. Non-recovery within the cap is recorded as non-recovery,
    never as evidence about hardness.

    Stage 4, shape: fit the discount against log r with extensive, saturating and flat forms and report
    the preferred shape with its uncertainty, which is the direct KN-OPEN-026 Q2 deliverable, restricted
    honestly to this family and these dimensions.

    Stage 5, scoring: correlate the cheap and expensive measures across rungs. A high rank correlation
    promotes the cheap measure to a usable predictor within this family; a low one is a measured obstruction
    saying the correlation determinant does not see what reduction sees, with a number attached.

    Refutation that matters: a flat discount across the entire ladder, which would say that at fixed
    dimension, determinant, plant rank and norm, orbit structure contributes nothing measurable by
    either instrument in this range.'
  novelty_status: unverified
  novelty_screen:
    method: Read all nine RQ-NTRU-9015ee proposals, with IDEA-20260809-2866e0 read closely since it
      covers module and matrix NTRU. Read KN-OPEN-026 in full, in particular Q2 on whether the discount
      grows with dimension. grep -ril 'module', 'matrix NTRU', 'block circulant', 'rank', 'interpolate'
      over ledger/proposals/ and ledger/hypotheses/. Checked the blacklist item requiring that a module
      or ring structure discount be measured with a growth direction rather than framed as does structure
      help.
    results: IDEA-20260809-2866e0 asks where the fatigue point goes for module and matrix NTRU, treating
      them as separate objects to be located rather than as rungs of an interpolation with everything
      else held fixed. IDEA-20260809-2b4624 varies the secret distribution. KN-OPEN-026's Q2 is explicitly
      unanswered and its three relayed mechanisms are all cost-model figures. The blacklist forbids
      framing this as does structure help, which is why the deliverable here is a curve in log r with
      a fitted shape and not a comparison of two arms. No proposal found that constructs a family
      with orbit rank as the sole independent variable at fixed dimension, determinant, plant rank
      and norm.
    verdict: 'UNVERIFIED. Nothing asserted about external literature; module NTRU over a small ring
      is a standard construction and its use as an interpolation may well be known. What is claimed
      new relative to this repository is the use of that family as a controlled ladder whose r = 1
      rung is itself the matched unstructured control executed in the same invocation, the gating
      of the family''s matching by an explicit certificate, and the side-by-side scoring of a zero-compute
      discount measure against a reduction-budget measure across the same ladder. Assembled from known
      parts: module NTRU, the correlation log-determinant, and the matching certificate.'
  object_first_candidate:
    tracked_object: The pair (normalised correlation log-determinant of the planted sublattice, minimum
      reduction budget for certified recovery at fixed success probability), indexed by orbit rank
      r along the divisor ladder of n at fixed everything else.
    lossiness: Lossy on both coordinates. The correlation determinant discards norms, directions and
      the ambient lattice as in the companion entry. The budget coordinate discards everything about
      how recovery happened, retaining one integer. Together they discard the secret, the basis, and
      all geometry except one scalar each. The retained parts propagate compatibly with the operation
      of stepping r along the divisor ladder, because the construction guarantees that dimension,
      determinant, plant rank and norm are unchanged, so nothing discarded differs between rungs in
      a way that could explain a change. That guarantee is what makes the projection safe, and it
      is checked rather than assumed, by the matching certificate.
    propagation: One step of the target operation is a move along the divisor ladder, r -> r' with
      m adjusted so that r m stays n. Under it the plant's generating set is reorganised from m orbits
      of size r into m' orbits of size r', with the same total number of vectors and the same total
      norm. The correlation matrix's block structure changes from m blocks of size r to m' of size
      r', which is an explicit and computable change, and the prediction is that the correlation determinant
      is monotone in r because larger orbits are more internally correlated. The budget coordinate
      has no such derivation and is measured.
    survival_score: 'The cheap coordinate survives to any n with many divisors, so the ladder is as
      long as the arithmetic of n allows: n = 24 gives eight rungs, n = 36 gives nine. The expensive
      coordinate survives only to lattice dimensions where certified recovery is affordable at several
      budgets, which bounds the reduction arm to roughly 2n = 48 to 96 depending on the reduction
      implementation available. Concretely: the discount curve is computable at n = 360 with two dozen
      rungs for free; it is measurable against reduction at n = 24 to 48 only.'
  null_object_control: 'The r = 1 rung is the matched unstructured control and is a rung of the ladder
    itself, so signal and control are produced by identical code in the same invocation with no possibility
    of a construction discrepancy. In addition, a shuffled-plant null: take a rung with r > 1 and
    replace its orbit-structured plant by an independent plant of the same rank and matched total
    norm, which should reproduce the r = 1 correlation determinant; if it does not, the ladder''s
    rungs differ in something besides orbit rank and the whole attribution fails. For any claim of
    a discount, the curve must be monotone in r and must return to the r = 1 value under shuffling.'
  discriminated_from:
  - IDEA-20260809-2866e0 locates the fatigue point for module and matrix NTRU as separate constructions;
    this entry never locates a fatigue point and instead holds q fixed while sweeping orbit rank,
    so the two are orthogonal experiments on the same family.
  - The companion correlation-determinant entry in this batch sweeps n at fixed structure; this one
    sweeps structure at fixed n, and the two together separate dimension growth from structure growth,
    which is exactly KN-OPEN-026's Q2 versus Q1 distinction.
  - IDEA-20260809-2b4624 varies the secret distribution; here the distribution is fixed and the norm
    matched exactly across rungs, so distribution cannot explain any observed curve.
  - A comparison of ring NTRU against matrix NTRU as two arms is the framing the blacklist rejects;
    the content here is the intermediate rungs and the fitted shape, which two arms cannot produce.
  - KN-OPEN-026's relayed mechanisms are hybrid-attack cost-model figures in bits; the discount measured
    here is a covolume quantity and a reduction budget, and the contract states that neither is convertible
    into those bits.
  assumptions:
  - The block-circulant construction genuinely holds determinant fixed at q^n across rungs, which
    is checked exactly rather than assumed and would invalidate the ladder if it failed.
  - Total Frobenius norm can be matched across rungs to a tight tolerance by rejection sampling, at
    an acceptable rejection rate that is measured.
  - A reduction implementation with a known-answer control is available for the expensive coordinate;
    if not, the entry still delivers the cheap coordinate and says so rather than substituting an
    estimate.
  - n with many divisors, 24 or 36, is representative enough for a shape fit, which is a real limitation
    since prime-degree rings have no ladder at all and are excluded by construction.
  predictions:
  - metric: normalised correlation log-determinant of the plant as a function of log r, at fixed n
    direction: higher
    minimum_effect: monotone increasing in r, with no numeric slope pre-committed because no prior
      measurement exists to anchor one
  - metric: shuffled-plant null's correlation determinant at a rung with r > 1, compared to the r
      = 1 rung
    direction: different
    minimum_effect: forced to agree within the Monte-Carlo standard error; disagreement invalidates
      the ladder's attribution
  - metric: minimum certified-recovery reduction budget as a function of log r
    direction: lower
    minimum_effect: no pre-commitment; this is the quantity the entry exists to measure and inventing
      a slope would defeat it
  - metric: rank correlation between the cheap and expensive coordinates across rungs
    direction: higher
    minimum_effect: 0.5
  minimal_test:
    design: 'Fix n = 24, giving rungs r in {1, 2, 3, 4, 6, 8, 12, 24}, lattice dimension 48, ternary
      secrets with total Frobenius norm matched across rungs by rejection to within 0.5 percent. In
      one invocation, generate 200 instances per rung, gate the family on the matching certificate
      confirming equal dimension, determinant, plant rank and norm, and compute the correlation log-determinant
      per instance. Run the shuffled-plant null at r = 24 and require it to return the r = 1 value.
      Then, budget permitting, run the reduction arm: at each rung, increase block size until certified
      recovery reaches 50 percent success over 40 instances, recording the budget, with non-recovery
      within the cap recorded as non-recovery. Report both coordinates against log r with CIs, fit
      the three shapes to the cheap coordinate, and report the rank correlation between coordinates.
      The r = 1 rung carries the entire control burden and is produced by the same code as every other
      rung.'
    controls:
    - The r = 1 rung as the matched unstructured control, executed in the same invocation by identical
      code.
    - Shuffled-plant null at high r, required to return the r = 1 correlation value.
    - Matching certificate gate on dimension, determinant, plant rank and total norm across all rungs,
      aborting the run on failure.
    - Certified recovery in the reduction arm, with the certificate re-verified independently of the
      reduction code.
    - Rejection-rate reporting for the norm matching, since a very low acceptance rate would mean
      the rungs carry different effective secret distributions.
    required_metrics:
    - correlation log-determinant per instance and rung
    - fitted shape of the discount in log r with AIC weights
    - minimum reduction budget for 50 percent certified recovery per rung
    - shuffled-null agreement with the r = 1 rung
    - matching certificate results across rungs
    - rank correlation between cheap and expensive coordinates
  falsification_conditions:
  - The discount curve is flat across the whole ladder within CIs, a clean negative saying orbit rank
    contributes nothing measurable at fixed dimension, determinant, plant rank and norm in this range.
  - The curve is non-monotone in r, falsifying the propagation prediction and requiring a mechanism
    that the entry does not have.
  - The shuffled-plant null does not return the r = 1 value, meaning rungs differ in something besides
    orbit rank and the attribution fails.
  - The matching certificate fails at any rung, invalidating the ladder.
  - The rank correlation between cheap and expensive coordinates is below 0.5, which does not invalidate
    either measure but records the cheap one as not predictive of the expensive one within this family,
    a usable measured obstruction.
  - Recovery does not reach 50 percent at any budget within the cap at any rung, in which case the
    expensive coordinate is unmeasured and is reported as a budget outcome, never as evidence about
    hardness.
  confounders:
  - Norm matching by rejection can distort the secret distribution differently at different r, since
    the number of independent objects differs; the rejection rates per rung must be reported and compared.
  - The ring Z[x]/(x^r - 1) has the all-ones element for every r, whose contribution to the correlation
    determinant scales differently with r than the generic spectrum does, and must be reported both
    included and excluded.
  - The reduction arm's success probability depends on the implementation's randomisation, so the
    same seed schedule must be used across rungs.
  - Divisor ladders are not uniformly spaced in log r, so a shape fit is unevenly weighted; this is
    stated and the fit is reported with the weighting made explicit.
  interpretation_limits:
  - The discount is measured within one constructed family and at fixed dimension; it does not transfer
    to other structured lattice families and no such transfer is offered.
  - Neither coordinate converts into bits of security, and comparison with the cost-model figures
    relayed in KN-OPEN-026 is explicitly refused as incommensurable.
  - The reduction arm's toy dimensions carry no implication for any parameter of interest.
  target_complexity:
    time_exponent: No attack exponent claimed. The cheap coordinate costs O(n^3) exact-integer operations
      per instance; the expensive coordinate's cost is whatever the reduction implementation takes
      at dimension 48 and is capped.
    memory_exponent: No attack memory exponent claimed; memory is O(n^2) exact integers for the cheap
      coordinate and that of one reduction for the expensive one.
    best_known: There is no in-repository measured structure discount with a growth direction; KN-OPEN-026
      records that the question is open and that the available figures are relayed, model-relative
      and unverified here. That absence is the incumbent.
    hidden_overhead: The construction hides its difficulty in holding determinant and norm exactly
      fixed while r changes, which is where a naive implementation would silently break the ladder;
      the matching certificate exists to catch precisely that. The expensive coordinate hides a dependence
      on a reduction implementation this environment may not have.
  dominated_by: 'n/a (no attack result claimed). Frontier check: no time, memory or data frontier
    row is contested, since no attack quantity is produced. Within this repository, IDEA-20260809-2866e0
    addresses adjacent ground with a different measurement and neither dominates the other; the cost-model
    figures relayed in KN-OPEN-026 are in incommensurable units and cannot dominate or be dominated
    here.'
  sota_delta: 'No attack; measurement contribution only. Quantitatively the delta is a curve where
    the repository currently has no point: a discount as a function of orbit rank with a fitted shape,
    at fixed dimension, determinant, plant rank and norm.'
  estimated_cost:
    implementation: high
    compute: medium
  recommended_priority: high
  honest_prior_of_survival: 'That the block-circulant ladder can be built with determinant, dimension,
    plant rank and norm exactly matched and passes the certificate: 0.7, with the main risk in the
    determinant bookkeeping for non-invertible blocks. That the correlation log-determinant is monotone
    in r: 0.6, since the mechanism is plausible but the all-ones element could break monotonicity
    at small r. That the shuffled null returns the r = 1 value: 0.8. That the reduction arm completes
    at all in this environment: 0.5, dependent on implementation availability. That the cheap and
    expensive coordinates correlate above 0.5 across rungs: 0.35, the weakest link and the most valuable
    measurement in the entry. Joint prior for the complete two-coordinate curve: about 0.15; for the
    cheap curve plus its nulls alone, about 0.5.'
