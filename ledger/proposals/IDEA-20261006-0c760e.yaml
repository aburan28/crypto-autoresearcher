idea:
  id: IDEA-20261006-0c760e
  question_id: RQ-SSI-001
  added: '2026-10-06'
  status: proposed
  approved_by: null
  proposed_by: idea-generator
  title: >-
    Capped j-return lengths of the rational degree-3 and degree-5
    actions on y^2 = x^3 + x over F_59 are unequal.
  class: measurement
  claim: >-
    Let p = 59 and let E0 be y^2 = x^3 + x over F_59. For ℓ in {3, 5},
    if E(F_59) has a unique subgroup of order ℓ, let one step be Vélu's
    quotient by that subgroup, and let the tracked value be the
    j-invariant of the quotient. Let o_ℓ be the least k in 1..16 such
    that the k-fold step returns j(E0), or 17 if no such k exists.
    The claim is o_3 ≠ o_5. This is one comparison of two integers on
    the base curve of the commutative class-group action. It is not a
    hidden-shift attack, it does not recover an ideal class, and the
    exponent delta against the opened CSIDH costs is 0.
  mechanism: >-
    Agreement, o_3 = o_5, means these two rational prime-degree actions
    are indistinguishable by capped j-return on this curve, including
    the case where both hit the sentinel 17. Disagreement means the
    capped j-orbits separate ℓ = 3 from ℓ = 5 at p = 59. Either
    outcome is a toy gate on the surviving commutative action. Neither
    outcome changes the subexponential classical vectorization cost or
    the quantum cost 2^{O(sqrt(log p))} stated in the opened CSIDH note.
    OBJECT FRAME. Representation: the j-invariant of the short-Weierstrass
    quotient, a curve invariant. Operation set Sigma: the cyclic
    semigroup generated by Vélu quotient by the unique rational subgroup
    of one prime order ℓ in {3, 5}. Sigma is not translation on a
    prime-order subgroup of E(F_p). TRICHOTOMY: partial-action. Reason:
    each step uses only that one rational subgroup, and point translation
    is not an operation of Sigma. LOSSY-PROJECTION TEST against Sigma.
    Discarded: the Weierstrass coefficients, so in particular the
    quadratic-twist bit, together with the kernel polynomial and the
    intermediate j values. Retained: one integer o_ℓ. Twists share a
    j-invariant, and distinct coefficient orbits can share one return
    length, so the projection is lossy. A projection that kept the
    Montgomery coefficient would be a change of coordinates.
  novelty_status: unverified
  citations:
    - ref: KN-TECH-027
      provenance: internal
      claim: >-
        The opened note states that the class group of an imaginary
        quadratic order acts on supersingular curves over F_p by a
        commutative group action, that classical vectorization is
        subexponential in log p, and that the quantum cost is
        2^{O(sqrt(log p))}. It does not state return lengths at p = 59.
      verified_by: idea-generator, this session, via knowledge/techniques/KN-TECH-027.md
    - ref: KN-OPEN-014
      provenance: internal
      claim: >-
        The opened note says the asymptotic quantum bound for CSIDH is
        settled and that the concrete constants and memory tradeoffs
        are not. This idea does not estimate those constants.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-014.md
    - ref: KN-OPEN-013
      provenance: internal
      claim: >-
        The opened note records no sub-p^{1/4} generic path-finding
        attack and treats the commutative action as a different
        survivor. This idea does not search for a path.
      verified_by: idea-generator, this session, via knowledge/open-problems/KN-OPEN-013.md
  assumptions:
    - p = 59 is prime and 59 ≡ 3 (mod 4). The test checks both.
    - Supersingularity of E0 over F_59 is the equality #E0(F_59) = 60. If it fails, the instance is missing.
    - For each ℓ in {3, 5} the test uses a kernel only when E(F_59) has exactly one subgroup of order ℓ. Any other count makes that step undefined.
    - Quotient curves are compared by j-invariant in F_59, not by F_59-isomorphism.
  predictions:
    - metric: absolute difference |o_3 - o_5|
      direction: different
      minimum_effect: 1
  minimal_test:
    design: >-
      Confirm p = 59 and #E0(F_59) = 60 for E0: y^2 = x^3 + x.
      Enumerate E0(F_59). For ℓ = 3 and ℓ = 5 separately, walk at most
      16 steps. On the current curve, list subgroups of order ℓ inside
      the rational points. If the list has length 1, replace the curve
      by Vélu's quotient and record j. Stop that walk when j equals
      j(E0) or when 16 steps are done. Set o_ℓ to the returning k, or
      to 17. Do not compute a class group, a class number, or a
      hidden shift.
    controls:
      - #E0(F_59) = 60, and every intermediate quotient also has p + 1 rational points.
      - Each used kernel is the unique rational subgroup of order ℓ. A count other than 1 aborts that walk as undefined.
      - One step followed by the dual isogeny returns the starting j. A failure means the Vélu step is invalid.
      - The ordinary control is the first a in 1..20 for which y^2 = x^3 + x + a over F_59 has trace not divisible by 59. That curve is not walked.
    required_metrics:
      - point_count_E0
      - rational_subgroup_count_3
      - rational_subgroup_count_5
      - o_3
      - o_5
      - ordinary_control_a
  falsification_conditions:
    - o_3 equals o_5, including the pair (17, 17).
    - #E0(F_59) is not 60, so the walk is not run.
    - For either ℓ the rational subgroup count is not 1, so o_ℓ is undefined.
    - A dual step fails to restore the starting j.
  confounders:
    - Quadratic twists share j. A j-return can be shorter than a return of F_59-isomorphism classes. The metric is the j-return on purpose.
    - The sentinel 17 collapses every orbit longer than 16 into one value. A shared 17 falsifies the inequality inside the cap and does not assert that two class orders are equal.
    - Extra endomorphisms at j = 1728 can make the first step a loop. That sets the corresponding o_ℓ to 1 and is a real outcome, not a discarded sample.
  interpretation_limits:
    - The sample is one prime and two primes ℓ. No transfer to CSIDH-512 or to any larger prime is claimed.
    - Equality inside the cap removes this separation at p = 59. It does not change the quantum cost.
    - Inequality is two integers. It is not an algorithm that recovers a secret ideal.
    - Exponent delta against the opened costs in KN-TECH-027 is 0. Toy-only, as RQ-SSI-001 requires at this size.
    - No torsion-point images are published or used. This is not a Kani embedding.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p = 59 only, the capped j-return o_ℓ imitates the order of
        one ideal class above ℓ in the class-group action, cut off at
        16. The imitation is not a theorem. Twists identified by j may
        make o_ℓ a proper divisor of that order. The sample is one
        curve and two primes ℓ. No transfer to another prime is claimed.
      rigorous_support: >-
        KN-TECH-027, opened, states that the class group acts freely
        and transitively on a suitable set of supersingular curves
        over F_p. The suitable set is not identified with j-invariants
        in that note. The test uses the observed j sequence.
      validation_plan: >-
        Compute o_3 and o_5 once, at p = 59, with the cap 16. The
        consistency checks are the point count p + 1 on every
        quotient, uniqueness of the rational kernel, and dual
        restoration of j. Sample size one has no tail. No second
        prime is drawn.
  target_complexity:
    time_exponent: >-
      At most 32 Vélu quotients of degree 3 or 5 on curves over a
      59-element field, plus one enumeration of E0(F_59). Polynomial
      in the fixed p. No subexponential vectorization is run.
    memory_exponent: >-
      One curve and one j per step. Memory is O(1) field elements at
      p = 59.
    best_known: >-
      KN-TECH-027, opened note: classical vectorization subexponential
      in log p, and quantum cost 2^{O(sqrt(log p))}. Those are the
      baselines not claimed.
    hidden_overhead: >-
      No o(1) term. The cap k ≤ 16 and the prime p = 59 are explicit.
      The output is two integers in 1..17.
    tradeoff_note: >-
      No time-memory tradeoff and no quantum query model. One walk
      pair at one prime.
