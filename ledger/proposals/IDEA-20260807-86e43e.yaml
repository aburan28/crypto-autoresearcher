idea:
  id: IDEA-20260807-86e43e
  question_id: RQ-SQISIGN-39f231
  added: '2026-08-07'
  title: SQIsign -- the only isogeny-based NIST Round-3 candidate -- has two draft goals that
    never launched, three contracts stuck at review_required and zero evidence, while the program
    already publishes a 'SQIsign NIST-I' figure that GOAL-SSI-001's own next_action admits is
    mislabelled
  class: measurement
  claim: 'GOAL-SQISIGN-001 and GOAL-SQISIGN-002 are both status: draft with current_batch_id null,
    dispatch_queue_path null, latest_verified_commit null and active_hypothesis_ids empty. Their
    questions have zero evidence records and three contracts (EXP-SQISIGN-1177f2, EXP-SQISIGN-7a48bb,
    EXP-SQISIGN-e10747) sit at review_required with zero runs. Meanwhile EV-SSI-59f7a2 and DEC-20260805-596d71
    assert 2^{120-123} AES-equivalent for ''SQIsign NIST-I'', ''5-8 bits below the 128-bit NIST-I
    target'', and GOAL-SSI-001''s own next_action lists as a correction STILL OWED that EV-SSI-59f7a2
    ''labels a OneEnd cost as a SQIsign security figure without carrying SC-1/SC-3''. So the program''s
    only committed SQIsign security statement comes from a goal that does not own SQIsign, and
    every goal that does own it has never run. GOAL-SQISIGN-002''s non_duplication block additionally
    records that the reported Round-3 higher-dimensional redesign ''may have moved the object''
    GOAL-SQISIGN-001 targets -- logged and never acted on.'
  mechanism: 'Launch as a pure READING task with no compute: build the itemized inventory of every
    curve, torsion basis and point image a Round-3 verifier receives; separate internally-computed
    higher-dimensional data from PUBLISHED data; and state whether the Kani template''s missing
    ingredient is structural or parametric. That inventory is simultaneously (a) the prerequisite
    for deciding whether GOAL-SQISIGN-001''s transcript object still exists under the Round-3
    design, and (b) what would let the 2^{120-123} figure be correctly relabelled as a OneEnd
    cost rather than a scheme security level.'
  novelty_status: unverified
  novelty_screen:
    screened_on: '2026-08-07'
    grep_results:
    - No committed record contains a Round-3 published-data inventory; RQ-SQISIGN-39f231 records
      that this program has read NO Round-3 specification.
    - GOAL-SSI-001's objective targets the hard problem (OneEnd/EndRing/CGL/CSIDH), not a scheme;
      GOAL-SQISIGN-002's non_duplication block confirms the split.
    conclusion: Screened against ledger/proposals, ledger/hypotheses and knowledge/; external
      novelty UNVERIFIED and not claimed.
  object_first_candidate:
    established_families_off_limits: 'OFF-LIMITS as the primary lens: endomorphism-ring hardness,
      which GOAL-SSI-001 owns. The object is the VERIFIER''S INPUT.'
    tracked_object: 'The per-signature and per-key published-data inventory: each curve, torsion
      basis and point image, tagged published or internal.'
    one_step_propagation_rule: Each protocol message adds items to the inventory; the adversary's
      knowledge is the union.
    newness_score: Nil as mathematics. It is the prerequisite inventory two draft goals are both
      downstream of and neither has produced.
  lossy_projection_identifiability_audit:
    projection: the protocol -> the set of objects the verifier receives.
    what_is_discarded: Everything the signer computes but does not send -- which is exactly the
      distinction that decides whether the Kani template applies.
    is_it_only_a_change_of_coordinates: NO. The published/internal split is the whole content,
      and it is not recoverable from the protocol description without care -- which is why the
      record exists.
    mirror_failure_check: CHECKED. The inventory must not mark everything published; the secret
      ideal is internal by construction, so at least one item is forced to each side.
  null_object_control:
    primary_null: 'AGAINST BROKEN SIDH: run the identical inventory procedure on SIDH, where the
      answer is known (torsion images at known degree ARE published and ARE fatal). The procedure
      must reproduce that. A procedure that cannot recover the known case cannot be trusted on
      the unknown one.'
    secondary_nulls:
    - 'FORCED INTERNAL: the secret ideal must be marked internal.'
    - 'SOURCE-BLOCKED DISCIPLINE: any item that cannot be established from the specification is
      marked, never inferred.'
  assumptions: []
  predictions:
  - metric: number of published items that carry degree AND image information together
    direction: different
    minimum_effect: Zero such items means the Kani template's ingredient is structurally absent;
      any nonzero count is the parametric case and must be costed.
  minimal_test:
    design: Acquire the Round-3 specification and the primary higher-dimensional design papers;
      file them as KN-LIT entries with provenance levels and extraction damage marked; produce
      the itemized inventory with the published/internal tag per item; run the SIDH null.
    controls:
    - SIDH known-answer null
    - forced-internal secret ideal
    - SOURCE-BLOCKED discipline
    required_metrics:
    - itemized inventory with tags
    - count of degree+image items
    - structural-versus-parametric verdict on the missing ingredient
  falsification_conditions:
  - 'The inventory shows no published degree+image pairing: the missing ingredient is STRUCTURAL,
    SQIsign is not a Kani-template target, and GOAL-SQISIGN-002''s question is answered negatively
    at zero compute.'
  - 'A pairing exists: the ingredient is parametric and the cost of exploiting it must be worked,
    which is a materially different research program.'
  - 'The specification is unobtainable: recorded SOURCE-BLOCKED, and the two draft goals stay
    blocked for a stated and dated reason rather than by inertia.'
  confounders:
  - Round-3 redesigns move fast; an inventory is dated and must say so.
  - Secondhand descriptions of the higher-dimensional design are unreliable; only the specification
    counts.
  - '''Published'' must mean published to the verifier, not published in the paper.'
  interpretation_limits:
  - An inventory is not a security claim.
  - Nothing here re-labels EV-SSI-59f7a2; that correction is a Coordinator act and this record
    supplies its input.
  heuristic_assumptions:
  - id: HEUR-SQI-1
    statement: The verifier's input set is fully determined by the specification text.
    rigorous_support: None; implementations can publish more than the spec requires.
    validation_plan: Cross-check against a reference implementation if one is retrievable, and
      mark the gap otherwise.
  target_complexity:
    time_exponent: n/a -- inventory
    memory_exponent: n/a
    best_known: The published SQIsign security analysis, unread by this program
    hidden_overhead: n/a
    tradeoff_note: No attack proposed.
  dominated_by: n/a (no attack claimed)
  sota_delta: ZERO. Puts a scheme-level record behind the only isogeny candidate still in NIST
    Round 3, discharges a correction GOAL-SSI-001 has queued and not made, and resolves whether
    one of the two draft goals targets a superseded design before any compute is spent.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 0.7 that the Round-3 specification is retrievable (arXiv and NIST
    retrieve as measured 2026-08-07; eprint PDFs return a Cloudflare challenge). 0.9, conditional
    on that, that the inventory is producible. 0.6 that the missing ingredient turns out structural,
    which would answer GOAL-SQISIGN-002 negatively at zero compute -- the cheapest possible outcome
    for the program and a legitimate one.
