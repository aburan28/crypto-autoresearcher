idea:
  id: IDEA-20260905-3e4bf0
  title: Exceptional trace-function strata pulled back through elliptic addition
  class: mechanism
  claim: 'A trace-function predicate pulled back along x:E->P1 may have relation correlations governed by a small
    exceptional locus in the addition correspondence. Conjecture: after proving a transfer lemma from multiplicative
    bilinear trace estimates to this correspondence, generic correlations admit a conductor-explicit bound and any
    surviving exceptional stratum has an explicit geometric description.'
  mechanism: The recent Fouvry–Kowalski–Michel–Sawin work supplies robust stratification ideas for certain bilinear
    trace-function kernels. Its hypotheses concern specific sheaves and multiplicative/monomial arguments, so they
    do not directly apply to x(P+Q). The proposed ingredient search is to replace their parameter space by the addition
    surface and classify when two pulled-back sheaves share constituents. Such sharing could be a positive resource
    for a relation predicate; absence could bound only that predicate family. The sought object is a correspondence-dependent
    sheaf invariant with charged conductor growth, not an assertion of equidistribution from a title.
  question_id: RQ-CRYPTO-001
  question_ids:
  - RQ-CRYPTO-001
  - RQ-ECDLP-002
  goal_ids:
  - GOAL-CRYPTO-001
  - GOAL-ECDLP-001
  - GOAL-ICEX-001
  - GOAL-PATH-001
  goal_applicability:
    GOAL-CRYPTO-001: Scouts a non-generic structural ingredient capable of changing the relation bottleneck if a
      new transfer lemma exists.
    GOAL-ECDLP-001: Creates a falsifiable proof architecture with an opened primary ingredient and explicit generic-model
      boundary.
    GOAL-ICEX-001: Could bound a relation-supply term or expose an exceptional locus; no complete index-calculus
      cost is claimed.
    GOAL-PATH-001: Names the missing geometric transfer and conductor bound before any scaling work.
