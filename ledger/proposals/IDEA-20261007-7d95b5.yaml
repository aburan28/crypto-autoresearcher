idea:
  id: IDEA-20261007-7d95b5
  question_id: RQ-FROB-7d8dd4
  added: '2026-10-07'
  status: proposed
  approved_by: null
  title: >-
    Monomial count of the cyclic average of the 3-point summation
    polynomial on y^2 = x^3 + x + 1 over F_37
  class: mechanism
  claim: >-
    On E: y^2 = x^3 + x + 1 over F_37, let f in F_37[x1,x2,x3] be a
    primitive of the ideal of x-coordinates of affine triples with
    P+Q+R equal to infinity, built as the resultant that eliminates
    the chord slope, and made monic in x3. Let sigma cycle the three
    variables and let g = f + sigma(f) + sigma^2(f). Let M(f) and
    M(g) be the numbers of monomials with nonzero coefficient. The
    claim is M(g) <= M(f)/2. The representation is the polynomial,
    not a point walk. The discrete-log time exponent stays 1/2 and
    the delta versus Pollard rho is 0.
  mechanism: >-
    Averaging over the cyclic group generated by a variable rotation
    is the Reynolds operator for that action. If the summation
    polynomial carries more than the trivial symmetry, the average
    drops at least half the monomials. If it is already symmetric, or
    if the orbits of monomials are mostly size 1, the average keeps
    more than half. The operation set is the cyclic permutation of
    the three variables. No factor base is stored and no Groebner
    basis is computed.
  novelty_status: unverified
  citations:
    - ref: KR-IC-46d822
      provenance: internal
      claim: Gaudry decomposition uses summation polynomials. This proposal counts monomials of one average and does not claim his exponent.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-46d822.yaml
    - ref: KR-IC-b0fcda
      provenance: internal
      claim: A Frobenius-invariant factor base saves up to a factor n. This proposal does not build that factor base. It scores one polynomial average.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-b0fcda.yaml
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: The generic bound is on the order of the square root. This proposal does not undercut it.
      verified_by: coordinator, 2026-10-07, opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
  predictions:
    - metric: M(g) compared with M(f)/2
      direction: lower
      minimum_effect: M(g) is at most half M(f)
  minimal_test:
    design: >-
      Recheck that 4+27 is 31 mod 37, not 0. Build f by eliminating
      the slope of the chord through two points and imposing that the
      third intersection has x-coordinate x3. Reduce by the curve
      equation. Count monomials of f and of g. A second build must
      reproduce both counts. No discrete log is attempted.
    controls:
      - A zero discriminant voids the run.
      - Degree of f in x3 other than 2 voids the run. The classical shape is quadratic in each variable.
      - The second build must match the first coefficient-wise.
      - M(f) = 0 voids the run.
    required_metrics:
      - M(f)
      - M(g)
      - the degree of f in x3
      - the discriminant residue
  falsification_conditions:
    - The instrument checks pass and M(g) > M(f)/2.
    - The second build disagrees. That is instrument_failure, not the negative.
  confounders:
    - A non-monic representative can split one monomial into several. The monic-in-x3 rule is fixed before the count.
    - Working over the integers and reducing mod 37 can cancel a coefficient. The count is after reduction. Cancellation is part of the measurement, not a reason to change the threshold.
  interpretation_limits:
    - One polynomial over F_37. No transfer to a larger field.
    - A halved monomial count is not a drop in solving degree and is not an exponent change.
    - The discrete-log exponent stays 1/2 whether or not the inequality holds.
  heuristic_assumptions:
    - id: H1
      statement: >-
        The cyclic average retains at most half the monomials of f.
        This imitates a group average that kills non-invariant
        monomials when orbits have size 3. Orbits of size 1 survive.
        The fraction that survive is not proved for this polynomial.
      rigorous_support: >-
        The operator g = f + sigma(f) + sigma^2(f) is the sum over the
        cyclic group of order 3. A monomial fixed by no nontrivial
        power is sent to an orbit sum. No opened theorem bounds M(g)
        by M(f)/2 for this curve.
      validation_plan: >-
        Count both integers on this one polynomial. Tail check: report
        the number of monomials of f that are fixed by sigma. If
        M(g) <= M(f)/2 and the fixed monomials already exceed M(f)/2,
        the killing reading is inconsistent with the count and is
        recorded beside it. The tail does not replace the threshold.
  target_complexity:
    time_exponent: "1/2"
    memory_exponent: "1/2 is unchanged; the polynomial is stored once"
    best_known: >-
      Pollard rho at exponent 1/2 (KR-RHO-13bf67) and Gaudry
      Õ(q^{2-2/n}) (KR-IC-46d822). Neither is replaced.
    hidden_overhead: No o(1) term is claimed.
    tradeoff_note: >-
      The discrete-log time exponent stays 1/2 and the delta versus
      Pollard rho is 0.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    Checked KR-RHO-13bf67, KR-IC-46d822, KR-IC-b0fcda, and
    KR-RHO-755e35, each opened on 2026-10-07. None states this
    monomial comparison. The exponent claimed here is 1/2.
  sota_delta: >-
    The discrete-log time exponent stays 1/2 and the delta versus
    Pollard rho is 0. The pre-registered gap is M(g) <= M(f)/2, a
    factor of at least 2 on one polynomial.
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
