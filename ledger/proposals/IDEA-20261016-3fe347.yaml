idea:
  id: IDEA-20261016-3fe347
  question_id: RQ-XEDN-3bfe2e
  added: '2026-10-16'
  title: >-
    Silent opposite-sign cells are doubles of tiny points: P=2S, x(S)=s^2-w+cs,
    B=x(S)x(S+T), and the silent |B|-prime family is S=(+-1,c)
  class: mechanism
  claim: >-
    Setting of bf8f49 (hypotheses (i) B not in +-Q*^2, (ii) D non-square),
    integral cell P=(s^2,sw), Q=(-t^2,tz), P -> -P so that f_-=A+2s^2-2w=c^2
    (the silent event), c in Z>0. (G1) The halves of P are S and S+T with
    x(S)=s^2-w+cs, x(S+T)=s^2-w-cs, y(S)=+-c*x(S), all integral, so B=x(S)x(S+T)
    and A=c^2-x(S)-x(S+T). (G2) If |B| is prime then {x(S),x(S+T)}={+-1,+-B}:
    A+B=c^2-1 (S=(1,+-c)) or A-B=c^2+1 (S=(-1,+-c)); c=1 is S4 of 6ad2a5.
    Conversely such data give a silent cell with s=(1-B)/(2c) (needs 2c | B-1).
    (G3) On these families Q=(-t^2,tz) exists iff (z-ct)(z+ct)=-(t^2-1)(t^2-B)
    (first family -(t^2+1)(t^2+B)); t=1 is Q=S. (G4) Residues: the second family
    needs c^2=-18 mod p, impossible at p=31 (13 is a non-residue), possible at
    43, 59, 83, 353; the first needs c=+-4. So the silent part of the
    H-XEDN-0ea2b6 slice is a 2-parameter family of curves with an integral
    point at x=+-1. Hand-verified fixture: (A,B)=(5,3), S=(-1,1), P=2S=(1,3),
    Q=3S=(-4,2): f_-=1, f_+=13=D, 3P=2Q, dependent and not a doubling.
  mechanism: >-
    Descent: P=phihat(R), R=(f_-,-2sf_-); f_-=c^2 gives R=phi(S) with
    x^2+(A-c^2)x+B=0, discriminant 4s^2c^2 (uses f_+=2A+4s^2-c^2); roots
    (c^2-A+-2sc)/2, product B. Hand-checked on y^2=x^3+3x (S=(3,6)) and
    y^2=x(x^2-x-3) (S=(4,6)). PAIR: representation = the half S (smaller
    height); operation set = [2] on E(Q), inverted on 2E(Q). TRICHOTOMY:
    partial-action. LOSSY-PROJECTION TEST: S determines P and loses only E[2],
    so this exposes smaller data rather than projecting; the content is G1's
    factorisation of B.
  novelty_status: unverified
