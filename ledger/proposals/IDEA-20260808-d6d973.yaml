  proof_search_map:
    bottleneck: '"Per-variable degree of the decomposition system, which sets any small-root
      solver''s reach."'
    baseline_embedding:
      parameter_slice: '"S = {} reproduces the standard Semaev system exactly."'
      reproduction_check: '"Symbolic degree check at m = 3,4,5 against 4, 8, 16."'
    observation_collision:
      observable: '"The pair (max per-variable degree, yield factor)."'
      distinct_preimage_search: Two distinct trees with the same (degree, yield) pair would
        show the pair is not a complete invariant of the tree; search over all binary trees
        on m <= 6 leaves.
    constructive_transforms:
    - transform: telescoping_potential
      proposed_object: '"Phi(tree) = log_p(yield factor) + log_2(max per-variable degree)."'
      predicted_gain: '"Phi is claimed near-constant along the family; a tree with strictly
        smaller Phi is the target."'
    quantifier_order: 'FOR ALL m, FOR ALL binary addition trees T on m leaves, FOR ALL windowing
      patterns S subset I(T): yield(T,S) = C(B+m-1,m)/N * (B''/p)^{|S|} * (1+o(1)) AND maxdeg(T,S)
      = 2^{h(T,S)} where h is the largest eliminated subtree height.'
    method_ceiling:
      strongest_certifiable_claim: '"A trade law for this family; never a lower bound on all
        solvers."'
      nearby_object_control: 'Genus-2 index calculus, where the analogous tree has degree
        growth but the base field is smaller: the same law holds and yet index calculus wins
        there, which shows the law alone does not close prime fields — the missing factor
        is the subfield.'
    proof_obligations:
    - claim: '"yield factor is exactly (B''/p)^{|S|} up to equidistribution error"'
      responsibility: success_probability
    - claim: '"maxdeg = 2^{h}"'
      responsibility: size
    - claim: '"both extremes violate the C_LA <= N^{1/2} budget or the reach budget"'
