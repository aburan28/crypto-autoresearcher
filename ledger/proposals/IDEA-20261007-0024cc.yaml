claim: >-
  For the exact public-walk endpoint-preimage RWER syntax, ordinary inversion
  success alone provides no positive lower bound on extraction of non-scalar
  independent loops or a saturated complete End(E) basis; the minimal
  selected-message mask adapter also lacks a correctness-preserving
