idea:
  id: IDEA-20260828-ba8e6f
  question_id: RQ-MDFIVE-6870c1
  added: '2026-08-28'
  title: >-
    MD4/MD5's shared Round-3 function H(x,y,z)=x XOR y XOR z is exactly
    GF(2)-linear: predict and test an exact zero-Boolean-condition collapse
    at Round 3, as a pre-execution correctness control on IDEA-20260828-12ce12
    and IDEA-20260828-400967's closed-form differential instruments
  class: mechanism
  claim: >-
    (A) RFC 1321 sec 3.4 defines MD5's four round functions F(x,y,z)=(x AND
    y) OR (NOT x AND z), G(x,y,z)=(x AND z) OR (y AND NOT z), H(x,y,z)=x XOR y
    XOR z, I(x,y,z)=y XOR (x OR NOT z); RFC 1320 sec 3.3 defines MD4's three
    round functions with the IDENTICAL H used in MD4's own Round 3. H is an
    EXACT GF(2)-LINEAR function of its three inputs: for any fixed
    (x,y,z,a,b,c), H(x XOR a, y XOR b, z XOR c) = H(x,y,z) XOR a XOR b XOR c,
    an unconditional algebraic identity checkable by direct enumeration of
    all bit patterns, not a heuristic. F, G and I do NOT commute with XOR in
    this way for generic (a,b,c) -- each is a genuinely nonlinear
    "selection"-type function imposing real, value-dependent bit-conditions
    on an XOR-difference path.
    (B) The claim under test: in ANY closed-form Boolean-function-only
    truncated-differential model of the kind IDEA-20260828-12ce12 and
    IDEA-20260828-400967 both build (their STAGE 1 "bitwise
    truncated-differential propagation table for each function"), the
    MARGINAL sufficient-condition count attributable to the Boolean-function
    component alone (holding the modular-ADD component aside) at MD5's Round
    3 (steps 33-48) and at MD4's own Round 3 (steps 33-48, MD4's final round)
    is EXACTLY ZERO for every declared input/message difference -- an exact,
    algebraically forced prediction about the SHAPE of c_total(r) across
    rounds, not a directional guess.
    (C) This is a discriminating, near-zero-cost CONTROL on 12ce12/400967's
    not-yet-executed instruments: if their closed-form derivation, decomposed
    per round, does NOT reproduce this exact zero at Round 3, that is a
    correctness defect in the derivation (a STOP, per this goal's own PO
    discipline), not a finding about MD5. If it DOES reproduce the zero, this
    supplies the first purely symbolic, a-priori-derived correctness anchor
    either sibling instrument would have, since neither instrument's own
    proof_obligations currently decompose c_total by round or single out any
    one function for exact-value verification.
    (D) EXPLICITLY NOT CLAIMED: that Round 3 contributes zero TOTAL
    conditions (the ADD/rotation component remains and is out of scope here
    -- that is IDEA-20260828-163513); no claim about attack feasibility,
    collision/preimage cost, or the quarantined path; no claim about rounds'
    relative importance beyond the Boolean-function axis specifically.
  mechanism: >-
    STAGE 1 (symbolic, milliseconds): from the pinned RFC 1321 and RFC 1320
    texts already committed in this goal, derive by exhaustive enumeration
    over all bit assignments that H commutes with XOR exactly (H(x XOR
    a,...) = H(x,...) XOR a XOR b XOR c for every (x,y,z,a,b,c)), and,
    contrastingly, that F, G and I each fail to commute with XOR for at
    least one sampled tuple -- establishing the load-bearing CONTRAST rather
    than a property shared by all four functions. STAGE 2 implements a
    minimal per-step Boolean-function condition-count routine for F, G, H, I
    in isolation and confirms it returns exactly 0 for H at every sampled
    input/message difference and step, nonzero for F, G, I under the
    identical differences. STAGE 3, if IDEA-20260828-12ce12's instrument has
    been executed, cross-checks its per-round breakdown's Round-3 marginal
    Boolean-condition figure against this proposal's independently derived
    zero; if 12ce12 has not yet run, this proposal executes its own minimal,
    scope-restricted reimplementation so the control does not block on a
    sibling proposal's schedule.
  novelty_status: unverified
  citations:
    - ref: "RFC 1321 (MD5), pinned at coordination/goals/GOAL-MD5-001/batches/BATCH-1f30fe/inputs/rfc1321-md5.txt, sha256 284a79d148400d9cd2a423211d1103b5cef0fb9256a4cbe6d7ebe5197c3149dd"
      provenance: internal
      claim: F/G/H/I bitwise definitions.
      verified_by: "already pinned and validated in this goal; reused, not re-fetched"
    - ref: "RFC 1320 (MD4), pinned at coordination/goals/GOAL-MD5-001/batches/BATCH-af29f6/inputs/rfc1320-md4.txt, sha256 f727b15e...2421c7"
      provenance: internal
      claim: "MD4's F/G/H definitions, identical H to MD5's."
      verified_by: "already pinned and validated in this goal"
    - ref: IDEA-20260828-12ce12
      provenance: internal
      claim: >-
        The closed-form Boolean-function-only DDT instrument this proposal is
        a pre-execution correctness control on.
      verified_by: "idea-generator subagent (read in full during idea generation, this session)"
    - ref: IDEA-20260828-400967
      provenance: internal
      claim: Sibling density-measurement instrument using the same closed-form DDT.
      verified_by: "idea-generator subagent (read in full during idea generation, this session)"
    - ref: IDEA-20260816-585c93
      provenance: internal
      claim: >-
        Per-step F_t/C_t accounting this record is discriminated from: 585c93
        tracks message-word freedom, never the Boolean function's algebraic
        linearity.
      verified_by: "idea-generator subagent (read in full during idea generation)"
    - ref: IDEA-20260816-3e6af3
      provenance: internal
      claim: >-
        Condition-counting calibration via brute-force enumeration on a toy
        ARX primitive; discriminated from this record, which derives an exact
        algebraic zero rather than measuring an aggregate error factor.
      verified_by: "idea-generator subagent (read in full during idea generation)"
  assumptions:
    - "The pinned RFC transcriptions of F, G, H, I are correct; re-verified here as a proof obligation, not assumed from memory."
    - "Modular-ADD and rotation contributions to condition count are explicitly out of scope for this record and are not conflated with the Boolean-function-only claim."
  proof_search_map:
    bottleneck: >-
      Which Boolean function (F, G, H, or I) is used at a given step; H's
      exact linearity is the decision-changing structural fact.
    baseline_embedding:
      parameter_slice: >-
        Any step whose macro is HH (MD5 Round 3) or MD4's own H-round; an
        exact instance of the general commutes-with-XOR claim.
      reproduction_check: >-
        Direct exhaustive enumeration over all bit patterns of
        H(x,y,z) XOR H(x XOR a,y XOR b,z XOR c) XOR a XOR b XOR c == 0
        for all sampled (x,y,z,a,b,c); a frozen, symbolic, always-reproducible check.
    observation_collision:
      observable: "Per-step marginal Boolean-function-only condition count."
      distinct_preimage_search: >-
        Could some non-H function accidentally show zero conditions for a
        SPECIAL input difference? Checked and rejected in general (F/G/I do
        not commute with XOR for generic (a,b,c)); measure-zero
        special-difference cases where one particular condition happens to
        be trivially satisfied are disclosed, not hidden, and do not affect
        the exact-zero-for-ALL-differences claim about H specifically.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace generic per-round Boolean-condition enumeration with an
          exact 0 for any H-round and a real computation only for F/G/I
          rounds -- a genuine, checkable compute saving for 12ce12/400967's
          own instrument.
        predicted_gain: >-
          Exact, not modeled: zero condition-count contribution from H at
          every declared difference, versus nonzero for F/G/I under the same
          differences.
    quantifier_order: >-
      FOR ALL 32-bit x,y,z,a,b,c and FOR ALL bit positions,
      H(x XOR a, y XOR b, z XOR c) = H(x,y,z) XOR a XOR b XOR c -- a
      universal, unconditional, exactly-verifiable algebraic identity, not an
      existential or per-instance claim.
    method_ceiling:
      strongest_certifiable_claim: >-
        The Boolean-function component of Round 3's differential condition
        count is exactly zero for both primitives, for any declared input
        difference. Nothing about the ADD/rotation component; nothing about
        achievable attack cost.
      nearby_object_control: >-
        The identical commutes-with-XOR check applied to F, G, and I (STAGE
        1) is the required nearby object where the conclusion is known to
        fail -- confirming the check is not vacuously true of every Boolean
        function of this arity.
    proof_obligations:
      - claim: "H commutes with XOR exactly, on exhaustive enumeration over sampled bit patterns."
        responsibility: correctness
      - claim: "F, G, I each fail to commute with XOR for at least one sampled (a,b,c)."
        responsibility: baseline
      - claim: "The per-step condition-count routine reports 0 for H and nonzero for F/G/I under identical input differences."
        responsibility: correctness
      - claim: "Every result is scoped to the Boolean-function component only; ADD/rotation conditions are explicitly excluded."
        responsibility: scope
    not_applicable_reason: null
  predictions:
    - metric: "Boolean-function-only marginal condition count at Round 3 (MD4 and MD5), any sampled input difference"
      direction: lower
      minimum_effect: "forced value 0 (exact)"
    - metric: "same quantity at Rounds 1, 2, and 4 (F, G, I respectively)"
      direction: higher
      minimum_effect: "strictly greater than 0 for at least one sampled nonzero input difference per round"
    - metric: "IDEA-20260828-12ce12's own per-round breakdown (if executed) reproduction of the Round-3 zero"
      direction: different
      minimum_effect: "exact match required; any nonzero value is a reportable defect in that instrument, not in H's algebra"
  minimal_test:
    design: >-
      Implement the four commutes-with-XOR truth-table checks exhaustively
      (milliseconds); implement the minimal per-step Boolean-condition-count
      routine; run it over MD5's four round boundaries and MD4's three round
      boundaries for at least 20 sampled input/message differences; report
      the per-round marginal count.
    controls:
      - "Synthetic function set where H is replaced by a function of matched algebraic degree that is genuinely nonlinear -- must NOT show the zero (positive control on the detector)."
      - "Cross-check against IDEA-20260828-12ce12's instrument if it has been executed."
      - "MD4 vs MD5 paired computation (both share the identical H at their respective Round 3)."
    required_metrics: ["per-bit truth-table commutation result for F/G/H/I", "per-round marginal Boolean-condition count, both primitives", "synthetic-nonlinear-H control result"]
  falsification_conditions:
    - "H fails to commute with XOR on any sampled bit position (algebraically impossible given the RFC formula; would indicate a transcription error, not a finding about MD5)."
    - "Round 3's measured marginal Boolean-condition count is nonzero under the implemented routine -- falsifies the routine, not H's algebra."
    - "F, G, or I also shows an exact zero-condition count under the identical test -- undermines the claimed contrast and must be reported as a genuine surprise, not suppressed."
    - "The synthetic-nonlinear-H control also reports zero -- invalidates the detector."
  confounders:
    - "Conflating Boolean-function conditions with ADD-carry conditions -- explicitly separated; ADD-only is IDEA-20260828-163513."
    - "Message-schedule effects (word availability) mistaken for function effects -- separated by holding the schedule fixed and swapping only the function symbol in the synthetic control."
  interpretation_limits:
    - "Says nothing about total per-round condition count; ADD/rotation conditions remain uncounted here."
    - "Says nothing about attack feasibility, collision/preimage cost, or the quarantined path."
    - "Scoped strictly to the Boolean-function component as an exact algebraic fact."
  heuristic_assumptions:
    - id: H1
      statement: >-
        The Boolean-function component, not the ADD component, is expected
        to dominate empirically measured condition counts specifically for
        F/G/I-using rounds (not for the H-round, where it is exactly zero by
        proof).
      rigorous_support: >-
        No classical distribution theorem underlies this half (unlike H's
        linearity, which is proved outright); it is a structural conjecture
        about relative magnitude, imitating no specific theorem.
      validation_plan: >-
        Reuse IDEA-20260816-3e6af3's 16-bit toy-ARX enumeration harness (or
        IDEA-20260828-163513's carry-aware model, if executed) to compare
        measured true condition burden for F/G/I-only synthetic steps against
        H-only synthetic steps at matched sample size (>=1000 paths per
        function), reporting the ratio rather than assuming it.
  target_complexity:
    time_exponent: >-
      No attack exponent is claimed. The deliverable is an exact per-round
      integer (Boolean-function-only condition count), zero or nonzero by
      round.
    memory_exponent: "Negligible -- a truth table and a small per-round tally."
    best_known: >-
      IDEA-20260828-12ce12/400967's undecomposed c_total(r)/density curves,
      which aggregate the Boolean-function and ADD components together with
      no per-round or per-function breakdown and no exact-value correctness
      anchor.
    hidden_overhead: >-
      The ADD/rotation component of Round 3's condition count is NOT zero and
      is not addressed here (IDEA-20260828-163513's job); reporting this
      record's zero without that caveat would understate Round 3's true cost.
    tradeoff_note: "Not applicable -- a symbolic decomposition, not a resource tradeoff."
  dominated_by: >-
    n/a (no result claimed). Checked against the UNVERIFIED 2^123.4 preimage
    figure, the seconds-scale collision figure, and the birthday-enumeration
    cost anchor (EV-MDFIVE-f3e1ca O-2). This proposal occupies no time/memory
    axis on any of them.
  sota_delta: >-
