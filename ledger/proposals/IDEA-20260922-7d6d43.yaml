  assumptions:
    - >-
      The illustrative cost surface (total ~ 2^l . binom(nvar, D)^omega, l ~ 48,
      nvar ~ t.l ~ 576 at t = 12) is a stand-in for EXP-SEMBIN's exact block_n4w
      model. The QUANTITATIVE D* (12-20) is model-dependent and must be recomputed
      inside the exact model; the QUALITATIVE cliff (margin huge at D = 4, gone by
      the low-to-mid teens) is what the record claims and is robust across omega.
    - >-
      rho at 571 is 2^{285.5} with the Koblitz sqrt(m) saving folded in for K-571
      (EXP-SEMBIN-992e73's rho column); B-571 (non-Koblitz) rho is a touch higher
      and moves the cliff negligibly.
    - >-
      "Solving degree" means the TRUE first-fall / degree of regularity governing
      the Macaulay matrix size, not the fake d'_F computed modulo the field
      equations. The whole record turns on that distinction (KN-FIND-936151).
    - >-
      t = m* = 12 and l ~ m/t ~ 48 at 571, from EXP-SEMBIN-992e73's m* column and
      the standard sizing; a different productive (t, l) shifts nvar and hence the
      numeric D* but not the existence of the cliff.

  proof_search_map:
    bottleneck: >-
      The 571 margin's sign is set by one number, the true solving degree of the
      m = 12 descended summation system, and that number has never been measured
      above n = 21 and no longer has a universal upper-bound justification. Pinning
      the margin's dependence on it, and naming the extrapolation that decides it,
      is the bottleneck this map removes -- before any solver runs at 571.
    baseline_embedding:
      parameter_slice: >-
        EXP-SEMBIN-992e73's 571 row: log2 cost 186.31, log2 rho 285.5, margin
        -99.19, under Assumption 1. The sensitivity surface must reproduce this row
        at D_solve = 4 within the model's own conventions before its off-D behaviour
        is trusted.
      reproduction_check: >-
        Recompute the illustrative surface at D = 4 (this session: log2 total ~ 112
        at omega = 2) and reconcile the gap to EXP-SEMBIN's 186.31 as the 5! and
        stage/cofactor multipliers that the illustrative model omits; the RECONCILED
        model must return -99 at D = 4, and only then is its D* read off. A reviewer
        redoes the binom(576, D) ladder (this session's numbers: log2 per-solve
        34.7, 49.8, 64.2 at D = 2, 3, 4; margin crosses zero near D = 20 at
        omega = 2).
    observation_collision:
      observable: >-
        sign(margin_571) as a function of (D_solve, omega): a single bit that is
        negative (index calculus wins) below the cliff and positive above it.
      distinct_preimage_search: >-
        Many (D_solve, omega) pairs give the same sign; the informative locus is the
        zero set D*(omega). The dangerous collision is reading a FAKE d'_F <= 4 as
        the D_solve that feeds the surface -- exactly the KN-FIND-936151 error -- so
        the observable must be fed the TRUE degree only, which is why the U-4
        discharge is in the deciding measurement.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: >-
          The surface cost_571(D_solve, omega) with the zero locus D*(omega) marked,
          plus the toy-ladder D_solve(m) extrapolation to m = 571 laid over it.
        predicted_gain: >-
          Turns "is 571 a target" from a one-bit conditional claim into a decision
          with a named, measurable input and a stated cliff edge.
      - transform: telescoping_potential
        proposed_object: >-
          Feed the measured D_solve(m) law back into GOAL-SEMBIN-fcb7a2's
          Proposition 5 audit as the true-vs-fake calibration it lacks above n = 21.
        predicted_gain: >-
          One measurement serves both the 571 decision and the Nagao audit.
    quantifier_order: >-
      EXISTS a threshold D*(omega) in the low-to-mid teens such that FORALL true
      solving degrees D_solve > D*, the 571 index-calculus cost exceeds rho (index
      calculus loses); and the sub-rho margin holds only if the true D_solve for the
      m = 12 system stays below D*. The threshold is a property of the cost surface
      (computed); which side D_solve falls on is the empirical question (measured,
      per instance, extrapolated). These must not be conflated: the cliff is
      derived, the crossing is measured.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under any linear-algebra exponent omega in [2, 3], the FIPS-571 Semaev
        index-calculus margin over rho is positive (index calculus wins) at true
        solving degree 4 and negative by true solving degree ~ 12-20; the margin's
        sign is therefore decided by whether the true solving degree of the m = 12
        descended system extrapolates below that threshold." Certifies nothing about
        what the true solving degree actually is (that is the deferred measurement),
        nothing about curves other than 571, and nothing under Assumption 1 taken as
        given -- the point of the record is that it may not be.
      nearby_object_control: >-
        PROVES-TOO-MUCH at 283: run the same surface at m = 283, t = 9, l ~ 31,
        nvar ~ 279, against rho 2^{141.5}. EXP-SEMBIN puts 283 at +6.1 (rho wins) at
        D = 4 already, so the surface must return a POSITIVE margin at 283 for
        D = 4; if the illustrative model instead makes 283 win at D = 4 it has
        proved too much and its constant is miscalibrated against EXP-SEMBIN. NULL
        OBJECT: a random (non-summation) polynomial system of the same nvar and
        degree profile, whose solving degree should track the generic
        degree-of-regularity, as the control that the measured D_solve(m) is a
        property of the summation structure and not of system size alone.
    proof_obligations:
      - claim: >-
          571 is the unique cell below rho across all three families under the
          coherent baseline.
        responsibility: baseline
      - claim: >-
          The 571 margin depends on the true solving degree through
          ~ omega . log2 binom(nvar, D_solve), giving a cliff at D* ~ 12-20.
        responsibility: runtime
      - claim: >-
          Assumption 1's universal justification is removed by KN-FIND-936151 and
          the d_F4 <= 4 claim is per-instance and unverified above n = 21.
        responsibility: feasibility
      - claim: >-
          The deciding measurement uses the TRUE (U-4-discharged) solving degree,
          not the fake d'_F.
        responsibility: correctness
      - claim: >-
          The illustrative surface must be reconciled to EXP-SEMBIN's -99 at D = 4
          before its D* is quoted.
        responsibility: baseline

  predictions:
    - metric: >-
        number of FIPS/Certicom/Oakley cells below rho under the coherent baseline
        (EXP-SEMBIN-992e73 + H-SEMBIN-97ea23)
      direction: lower
      minimum_effect: >-
        EXACTLY ONE (B-571/K-571). If a second cell is below the coherent baseline,
        claim (A)'s "one live cell" is wrong.
    - metric: >-
        true solving degree D* at which the illustrative 571 margin crosses zero,
        omega in {2, 2.37, 3}
      direction: different
      minimum_effect: >-
        D* in the low-to-mid teens (this session: ~20, ~16, ~12). A D* in the
        hundreds would mean no realistic solving degree flips the sign and the
        margin is robust; a D* below ~6 would mean even Assumption-1 degrees are
        borderline. The claim is the mid-teens cliff.
    - metric: >-
        true (U-4-discharged) solving degree D_solve(m) of the m-shape Weil-descent
        summation system, toy ladder, extrapolated to m = 571
      direction: different
      minimum_effect: >-
        DISCRIMINATING: extrapolated D_solve < D* (E1, 571 is a real target) versus
        extrapolated D_solve > D* (E2, the margin is a fake-degree artifact and the
        lane closes at its one open cell). Either outcome is decisive; this is the
        measurement the whole record selects for.

  minimal_test:
    design: >-
      NO SOLVER for parts 1-2. PART 1 (this machine, seconds, DONE this session):
      compute the illustrative surface cost_571(D_solve, omega) and locate D*;
      confirm the mid-teens cliff and the -173/-75/+6 margins at D = 4/12/20
      (omega = 2). PART 2 (this machine): reconcile the illustrative model to
      EXP-SEMBIN's -99 at D = 4 by inserting the 5!, stage and cofactor multipliers,
      and recompute D* in the reconciled model; run the 283 proves-too-much control
      (must return rho-wins at D = 4). PART 3 (deferred to an engine-equipped
      executor, reusing GOAL-SEMBIN-fcb7a2's instrument, NOT editing its contract):
      measure the true, U-4-discharged solving degree of the m-shape summation
      system across the largest toy m the engine reaches, fit D_solve(m), and
      extrapolate to 571 with a stated confidence band; classify E1 vs E2. This
      machine (4 core, 6 GB) does PART 1 and PART 2 immediately; PART 3 needs a
      Groebner/XL engine over F_2 with first-fall-degree instrumentation, which this
      machine lacks and GOAL-SEMBIN owns.
    controls:
      - >-
        Coherent-baseline control: 571's status must be read against
        H-SEMBIN-97ea23's baseline, not the naive 2^{n/2}, so that 409 correctly
        drops out and only 571 remains.
      - >-
        283 proves-too-much control: the reconciled surface must place 283 on the
        rho-wins side at D = 4 (EXP-SEMBIN: +6.1), pinning the model constant.
      - >-
        True-vs-fake control: the deciding measurement reports the fake d'_F AND the
        U-4-discharged true degree side by side (GOAL-SEMBIN-fcb7a2's protocol), so
        a low fake degree cannot be smuggled in as D_solve.
      - >-
        Null-system control: a random polynomial system of matched nvar and degree
        profile, to show the measured D_solve(m) tracks summation structure, not
        size.
    required_metrics:
      - the surface cost_571(D_solve, omega) and its zero locus D*(omega)
      - reconciled-model margin at D = 4 (must equal -99) and its D*
      - (deferred) true U-4-discharged D_solve(m) fit and its extrapolation to 571
      - (deferred) fake d'_F at each toy m, reported alongside

  falsification_conditions:
    - >-
      A second family cell is below rho under the coherent baseline: claim (A) is
      false and "index calculus at larger sizes" is not a one-cell question.
    - >-
      The reconciled 571 surface has D* in the hundreds (no realistic solving degree
      flips the sign): the cliff claim (C) is false and the margin is robust to the
      solving degree -- which would strengthen 571 as a target, the opposite of the
      record's suspicion, and a legitimate outcome.
    - >-
      The extrapolated true solving degree lands unambiguously below D* (E1): the
      margin is real and the record's suspicion that -99 is a fake-degree artifact
      is wrong.
    - >-
      The reconciled model cannot reproduce EXP-SEMBIN's -99 at D = 4: the
      illustrative surface is not a valid stand-in and the D* numbers are withdrawn
      until the exact block_n4w model is used.

  confounders:
    - >-
      Feeding the fake d'_F into the surface as if it were the true solving degree
      -- the exact KN-FIND-936151 error. The deciding measurement forbids it by
      requiring the U-4 discharge.
    - >-
      Baseline substitution: comparing against the naive 2^{n/2} instead of the
      coherent baseline would resurrect 409 as a false second live cell.
    - >-
      Model-constant miscalibration: the illustrative surface omits the 5!, stage
      and cofactor multipliers; quoting its raw D* before reconciliation would
      misstate the cliff edge.
    - >-
      Extrapolation risk: a D_solve(m) fit from small toy m carries a wide band at
      m = 571; the record demands the band be stated and the E1/E2 call be made
      relative to it, not to a point extrapolation.

  interpretation_limits:
    - >-
      A cost-model analysis plus a measurement design, unreviewed. Parts 1-2 are
      arithmetic; the decisive Part 3 (true solving degree at scale) is deferred and
      is the only part that can move the E1/E2 verdict.
    - >-
      No exponent is claimed as MOVED. The record does not assert index calculus
      beats rho at 571; it asserts the claim that it does is one measurement away
      from decision and currently rests on a falsified universal assumption.
    - >-
      Scoped to Semaev's model as audited by EXP-SEMBIN-992e73. A different
      decomposition method (a genuinely lower true solving degree, a different
      factor-base shape) would need its own surface; this record prices the method
      the program has actually costed.
    - >-
      571 is a deployed parameter; nothing here breaks it. E2 would REASSURE (571
      safe against this method); E1 would raise a target worth independent
      review-breakthrough scrutiny before any stronger statement.

  heuristic_assumptions:
    - id: H1
      statement: >-
        The per-decomposition solving cost of the m = 12 Weil-descent summation
        system scales as binom(nvar, D_solve)^omega with nvar ~ t.l ~ 576 the
        Boolean unknown count, D_solve the true solving degree, and omega in [2, 3]
        the sparse-linear-algebra exponent; the total index-calculus cost is
        2^l times this, l ~ 48.
      rigorous_support: >-
        The standard XL/Groebner cost model: solving a zero-dimensional Boolean
        system at degree D costs (Macaulay matrix dimension)^omega and the dimension
        is Theta(binom(nvar, D)); block Wiedemann gives omega -> 2 for sparse
        systems and dense elimination omega -> 3 (or 2.37 with fast matrix
        multiplication). This is the model behind EXP-SEMBIN's block_n4w cost up to
        the reconciliation constants.
      validation_plan: >-
        PART 2 reconciliation: reproduce EXP-SEMBIN's -99 at D = 4 by inserting the
        stage/5!/cofactor constants, and cross-check the 283 and 409 rows land on
        the correct side of rho at D = 4. Confirms the surface constant before D* is
        quoted. Pure arithmetic, this machine.
    - id: H2
      statement: >-
        The true solving degree D_solve(m) of the summation system grows at most
        sublinearly in m if Assumption 1 is essentially right, and at least linearly
        if the fake-degree bound is masking real growth; the toy-ladder trend
        distinguishes these regimes and extrapolates across the low-teens threshold
        D* at m = 571.
      rigorous_support: >-
        Semaev/Nagao Assumption 1 asserts a bounded (degree-4 at p = 2) first-fall
        degree; KN-FIND-936151 shows the fake-degree route to that bound is not
        valid universally, so the true D_solve(m) is an open empirical trend, and a
        degree that is constant vs one that grows is a qualitative dichotomy a small
        ladder can resolve. This mirrors the degree-of-regularity growth laws for
        generic systems (the Bardet-Faugere-Salvy asymptotics) as the comparison
        distribution.
      validation_plan: >-
        PART 3 (deferred): measure true U-4-discharged D_solve at m across the
        engine's reach, fit constant-vs-linear-vs-sublinear, and report the
        extrapolated D_solve(571) with a band; compare the growth against the
        generic degree-of-regularity null (H2's comparison distribution) to confirm
        any bounded behaviour is a property of the summation structure. Tail check:
        push m as high as the engine allows and watch whether the fit's residuals
        grow, the signature of a masked super-linear term.

  target_complexity:
    time_exponent: >-
      No exponent moved; the record prices an existing method. Under Assumption 1
      (D_solve = 4) the 571 index-calculus time is ~ 2^{186} (EXP-SEMBIN), below rho
      2^{285.5}; the record's content is that this exponent is a steep function of
      the true solving degree and reverts to >= rho once D_solve exceeds ~ 12-20.
    memory_exponent: >-
      The Macaulay matrix at degree D_solve has ~ binom(nvar, D_solve) rows, so
      memory ~ 2^{log2 binom(576, D_solve)}: ~2^{35} at D = 4 but ~2^{122} at
      D = 20 -- the memory blows through any realistic budget well before the time
      cliff, an independent reason the high-D regime is not merely slower but
      infeasible. This is the honest memory disclosure the target profile requires.
    best_known: >-
      Parallel Pollard rho at 571: 2^{285.5} (K-571, sqrt(m) Koblitz saving folded
      in; B-571 slightly higher), from EXP-SEMBIN-992e73's rho column. That is the
      frontier the 571 index-calculus cell claims to beat, conditionally.
    hidden_overhead: >-
      The 2^{186} figure hides Assumption 1 entirely -- it is the D_solve = 4 corner
      of the surface. The o(1)-style hidden cost here is not asymptotic slack but a
      concrete unverified integer (the true solving degree), which the record
      surfaces rather than absorbs.
    tradeoff_note: >-
