idea:
  id: IDEA-20260922-7d6d43
  question_id: RQ-NISTBIN-06157b
  added: '2026-09-22'
  proposed_by: idea-generator
  status: proposed
  title: >-
    THE ENTIRE "INDEX CALCULUS AT LARGER SIZES" QUESTION REDUCES TO ONE CELL,
    B-571/K-571, AND THAT CELL SITS ON THE WRONG SIDE OF A CLIFF: EXP-SEMBIN-992e73
    finds 571 is the only listed curve where Semaev's model puts index calculus
    below rho at all (margin about -99 bits), and 409 loses under the coherent
    baseline, and every Certicom degree loses -- so across all three sibling
    families 571 is the single live cell. But that -99 rests entirely on Assumption
    1 (d_F4 <= 4), whose universal justification the program falsified in
    KN-FIND-936151 (Nagao's d_F <= d'_F is not a theorem, so the fake first-fall
    degree may not be cited as bounding the true one), and an illustrative XL cost
    surface computed this session shows the margin flips to rho-wins once the
    effective solving degree exceeds D* ~ 12 to 20 (robust across linear-algebra
    exponent omega in {2, 2.37, 3}). The margin is 2^{99} at D = 4 and gone by
    D ~ 16. The idea is to replace the point estimate with the two-parameter
    sensitivity surface cost_571(D_solve, omega) and to name the deciding
    measurement: the per-instance, U-4-discharged solving degree of the m = 12
    Weil-descent summation system, extrapolated from the toy ladder, not the fake
    degree.
  class: measurement

  mechanism: >-
    OBJECT FRAME. This record introduces NO new object: it re-prices the existing
    Class I, partial-action object of Semaev/Gaudry-Diem index calculus -- the
    subspace factor base B_V = {P : x(P) in V}, V an F_2-subspace of dimension
    l ~ m/t, and the Weil-descended summation system S_{t+1} over F_(2^m). Because
    no new projection is proposed, the lossy-projection test is inherited from the
    index-calculus frame (IDEA-20260806-c5d183, Class I) and not re-run; the
    representation is R3 of RQ-ECDLP-623a32 (Weil restriction), and the attack stage
    whose charged cost this record analyses is RELATION DECOMPOSITION -- specifically
    the solving degree of the descended polynomial system, the exponent that
    Assumption 1 pins and that KN-FIND-936151 unpinned.
    FACTOR-BASE ESCAPE (KN-OPEN-020). Unchanged: B_V is the
    implicit-membership-cheap subspace with the O(m^2) linear membership test. This
    record charges no new membership cost; it charges the SOLVING cost of the
    decomposition system as a function of the solving degree, which is where the
    571 margin lives or dies.
    WHAT THE RECORD ADDS TO EXP-SEMBIN-992e73. That experiment produced a POINT
    estimate of the 571 margin under one fixed model (stage-1 only, t = m,
    block_n4w solving cost, cofactor charged), conditional on Assumption 1, and
    flagged the assumption. This record (i) composes it with KN-FIND-936151 to state
    that the assumption's UNIVERSAL justification is gone and the d_F4 <= 4 claim is
    now per-instance and unverified above n = 21; (ii) replaces the point estimate
    with a SENSITIVITY SURFACE over the two parameters that actually control the
    margin -- the effective solving degree D_solve and the linear-algebra exponent
    omega -- and locates the sign-flip; and (iii) names the single measurement that
    decides the cell: the per-instance, U-4-discharged TRUE solving degree at the
    m = 12 shape, extrapolated from a toy ladder, never the fake d'_F.
    THE CLIFF, computed this session as an illustrative XL model and to be
    reconciled with EXP-SEMBIN's exact block_n4w model. Total index-calculus cost
    ~ 2^l . binom(nvar, D_solve)^omega with l ~ 48, nvar ~ t.l ~ 576, against the
    571 rho column 2^{285.5}. Margin (index calculus minus rho, negative = index
    calculus wins): -173 at D = 4, -75 at D = 12, and it CROSSES ZERO at
    D* ~ 20 (omega = 2), ~16 (omega = 2.37), ~12 (omega = 3). So the -99 headline
    is an artifact of D = 4; a true solving degree anywhere north of the low teens
    erases it. The exact D* depends on the precise model, but the existence of a
    cliff in the low-to-mid teens is robust across omega.

  claim: >-
    (A) ONE LIVE CELL. Across RQ-OAKLEY (subfield family), RQ-CERTBIN (six prime
    degrees, all lose to rho by 20-56 bits, EXP-SEMBIN-992e73) and RQ-NISTBIN, the
    only curve at which the program's own Semaev-model audit puts index calculus
    below rho under a baseline the program accepts is B-571/K-571; 409 falls below
    only the naive 2^{n/2} baseline and loses under the coherent baseline
    (H-SEMBIN-97ea23: crossover 460 sparse / 520 dense, both above 409); 283 is the
    closest LOSING degree at +6.1 bits. "Index calculus at larger sizes" is
    therefore, on the program's current evidence, the question of one cell.
    (B) THE MARGIN IS ASSUMPTION-BOUND. The -99 bit margin at 571 is conditional on
    Assumption 1 (d_F4 <= 4), checked in this program only at n <= 21. Its universal
    justification -- Nagao's Lemma 4 d_F <= d'_F used to let a measured fake degree
    bound the true one -- is FALSE as a universal statement (KN-FIND-936151 /
    EV-SEMBIN-1ca3c8), recoverable only per instance by U-4 bookkeeping. So the
    margin rests on an unverified, no-longer-universally-supported per-instance
    claim about a system 550 bits above where the program has checked it.
    (C) THE CLIFF. On an illustrative XL surface (computed this session; to be
    reconciled with the exact block_n4w model), the 571 margin is a steep function
    of the effective solving degree D_solve: log2 total cost ~ l + omega .
    log2 binom(nvar, D_solve) with l ~ 48, nvar ~ 576. It crosses the rho line
    2^{285.5} at D* ~ 12-20 for omega in {2, 2.37, 3}. Equivalently: the entire
    2^{99} advantage is spent by the time the true solving degree reaches the low-to-
    mid teens, a degree far below the descended system's Macaulay bound and entirely
    plausible for a true (not fake) first-fall degree at m = 12.
    (D) THE DECIDING MEASUREMENT, AND ITS TWO OUTCOMES. Measure the TRUE solving
    degree of the m = 12 Weil-descent summation system on a subspace factor base,
    per-instance and U-4-discharged per KN-FIND-936151, at the largest toy m an
    engine can reach, and extrapolate the D_solve(m) trend to m = 571.
      E1 (D_solve stays low / grows sublinearly and extrapolates below D*): the
      571 margin is real and B-571/K-571 is a genuine index-calculus target below
      rho -- the program's one exponent-relevant larger-size result.
      E2 (D_solve grows and extrapolates above D*): the -99 margin is an artifact
      of the fake-degree Assumption 1, 571 loses to rho like every other listed
      curve, and the "index calculus at larger sizes" lane is closed at the one
      cell that looked open -- a named, measured obstruction (the true solving
      degree exceeds D*) with the resource_check below.
    RESOURCE_CHECK (inventor protocol): a true solving degree that GROWS with m --
    the obstruction that would close E2 -- is exactly the density defect that the
    quasi-subfield-polynomial and Frobenius lines already read as closing their own
    routes; read as an asset, a measured D_solve(m) law is the first cross-family
    calibration of the true-vs-fake gap at scale and feeds GOAL-SEMBIN-fcb7a2's
    Proposition 5 audit directly.

  novelty_status: unverified

