  assumptions:
    - p is drawn with the subgroup prime filter, so d | p-1 and the chosen L divide p-1. Characters are evaluated by exponentiation; no discrete logarithm is used anywhere.
    - Stage B runs only if Stage A shows an excess. Stage A alone is a complete, reportable null.
    - Toy scale, 12..28 bits (Stage A reads the h=2 table; the 32-bit table is also affordable).
  proof_search_map:
    bottleneck: target selection, i.e. whether any cheap x-feature predicts decomposability over a structured base beyond chance
    baseline_embedding:
      parameter_slice: chi trivial (L = 1)
      reproduction_check: Lambda is identically the normalised count, and the lift is identically 1 by KN-FIND-007. This is a frozen fixture.
    observation_collision:
      observable: Lambda_chi per arm and rung
      distinct_preimage_search: >-
        The same base under chi(x(P)*x(Q)) (field product; maximal bias) versus
        chi(x(P+Q)) (group sum; predicted null) share every input except the operation.
        A method unable to separate them measures the wrong operation. The random base
        under both is the second pair.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: fixed base and fixed character, varying the operation from field product to group sum
        predicted_gain: isolates coupling to the group law from structure of the base itself
    quantifier_order: 'THERE EXISTS L and an x-defined base family {F_N} such that FOR ALL N in range, max over chi of order L of Lambda_chi(F_N) exceeds the random band by a factor growing as N^gamma. chi may depend on N (L | p-1); the selection null covers the max over chi.'
    method_ceiling:
      strongest_certifiable_claim: a measured Lambda band with its slope over a frozen character family, arms and range. It cannot rule out characters or bases outside the family.
      nearby_object_control: the field-product operation on the same base (bias present by construction), and complete sums over E x E at p ~ 2^12 (all N^2 ~ 1.7e7 pairs), where the Deligne-type bound predicts |S|/N^2 = O(1/N)
    proof_obligations:
      - claim: Lambda equals a reduction over the committed table's keys (no new enumeration)
        responsibility: interface
      - claim: the lift bound via INV-3pp is reported next to every Lambda
        responsibility: scope
      - claim: the selection null (max over the character family on random bases) is calibrated
        responsibility: success_probability
    not_applicable_reason: null
  predictions:
    - metric: Lambda_chi(field product chi(x(P)x(Q))), chi trivial on mu_d, coset arm
      direction: higher
      minimum_effect: equal to sqrt(2*binom(|F|,2)) (maximal) - instrument check
    - metric: max over chi of Lambda_chi(x(P+-Q)) for subgroup, dickson and small_x arms minus the random-base selection null
      direction: different
      minimum_effect: 'Null: within the 99% selection band at every rung. Alive: above the band at the two largest rungs with slope > 0 in log N.'
    - metric: complete-sum control |sum over E x E of chi(x(P+Q))|/N^2 at p ~ 2^12
      direction: lower
      minimum_effect: '<= 10/N'
    - metric: Stage B S_3 per relation, filtered vs unfiltered, m=3 mitm (only if Stage A is alive)
      direction: lower
      minimum_effect: 'ratio <= 0.9 net of filter cost (one exponentiation per candidate)'
  minimal_test:
    design: >-
      STAGE A.
      - Grid: 12..28 bits; 5 curves with --subgroup-prime; arms subgroup, dickson (the
        builder from IDEA-20260928-4e2be7), small_x, random (3 seeds); m = 3 default |F|.
      - Build the h=2 table (existing tails.py) and read Lambda_chi for every chi of
        order L | p-1, L <= 12, with a vectorised pow over the uint32 key array.
      - Compute the field-product control, and the complete-sum control at 12 bits.
      - Selection null: for each arm/rung, the same max-over-chi statistic on 100 random
        bases.
      - Report Delta_2 (pair dispersion) and the INV-3pp bound alongside.
      STAGE B (conditional).
      - Split curves into train and test halves. Choose (chi, class) on train. On the
        test curves, run the mitm solver m=3 with a target filter (skip R unless
        chi(x(R)) is in the class) versus unfiltered, on the same targets.
      - Report per-target S_3, S_3 per relation, filter operations, the advice size S
        next to online T, and the rho walk.
    controls:
      - matched random bases (selection null band)
      - field-product operation on the same base (positive control)
      - complete-sum control at 12 bits (theorem-regime anchor)
      - trivial-character slice (lift exactly 1)
      - Pollard rho walk (Stage B cost control)
    required_metrics:
      - Lambda_chi per chi, arm, rung; selection-null quantiles
      - Delta_2 and INV-3pp bound per arm/rung
      - Stage B S_3 per relation filtered vs unfiltered, filter cost
  falsification_conditions:
    - The field-product control is not maximal. The instrument is broken.
    - The complete-sum control exceeds 10/N at 12 bits. The character evaluation or the divisor argument is wrong.
    - All x-defined arms fall inside the selection band at every rung. Lead 1's tower quotient and lead 3's aligned predicates are CLOSED for the tested family and range. This is the expected result.
    - An arm is above the band with a positive slope, and Stage B nets <= 0.9 S_3 per relation. A live non-generic filter.
  confounders:
    - Selection bias of the max over about 20 characters. The random-base selection null is blocking.
    - For small d the table is small and Lambda is noisy. Rungs with binom(|F|,2) < 500 are pooled by a frozen rule.
    - Alignment by construction for chi trivial on mu_d. These are reported separately from generic chi.
  interpretation_limits:
    - Measures a bias, not an attack; any lift is capped by INV-3pp and by the filter density 1/L.
    - Frozen character family, three structured arms, m = 3, 12..28 bits.
    - KN-OPEN-020 class - target-dependent plus implicit membership.
  heuristic_assumptions:
    - id: H1
      statement: For x-defined bases with |F| << sqrt(p), Lambda_chi(x(P+-Q)) is distributed as for a random base (a sum of about 2*binom(|F|,2) unit-modulus terms with square-root cancellation).
      rigorous_support: >-
        Proven for complete sums via the divisor argument above plus Deligne-type bounds
        (recalled). Imitated: square-root cancellation for incomplete sums over
        subgroup-defined sets. Unproven below d ~ sqrt(p*L).
      validation_plan: 'Per rung, compare the Lambda distribution over chi and curves to the random-base Lambda distribution by KS at 1%; tail: the max Lambda vs the selection-null 99th percentile; transfer: none.'
  target_complexity:
    time_exponent: 'No algorithm unless alive; if lift rho ~ N^delta then total (1+beta-delta)/2 after rebalancing; a constant lift moves nothing.'
    memory_exponent: unchanged from mitm (N^{h/m}); the filter is O(1)
    best_known: Pollard rho 0.886*sqrt(N), O(1) memory
    hidden_overhead: the filter costs one exponentiation per candidate target plus a 1/L density penalty; rho <= L by conservation on the cell
    tradeoff_note: a pure time-for-time filter, embarrassingly parallel
