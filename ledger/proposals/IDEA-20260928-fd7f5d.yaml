  title: >-
    The incomplete-sum regime of Hom(E,G_m) = 0. Do multiplicative characters that are
    CONSTANT on a coset (or Dickson) base bias the characters of x(P+-Q) for P, Q in the
    base when d << sqrt(p)? If they do, the bias is a representation-decidable target
    filter and a table-key bias with a non-generic lift. This is the one place where
    lead 1's tower quotient is lossy AND could couple to the group law.
  class: measurement
  claim: >-
    R1 representation; the stage is relation decomposition (target selection).
    KN-OPEN-020 classes: target-dependent description (targets filtered by chi(x(R))) plus
    implicit membership (the base and the filter are tested by one exponentiation each).

    Quantity. For the coset base F = x^{-1}(g*mu_d), take every character chi of
    F_p^* of order L | (p-1), L in {2,3,4,5,6,8,12}, including those trivial on mu_d.
    Define
      Lambda_chi(F) = |sum over unordered {P,Q} in F, P != +-Q, of
                       [chi(x(P+Q)) + chi(x(P-Q))]| / sqrt(2*binom(|F|,2)).
    This is exactly a reduction over the h=2 table's x array: the random-walk
    normalisation gives Lambda ~ O(1) under the null.

    The claim is that Lambda_chi for x-defined bases lies inside the random-base band at
    every rung (NULL), against the alternative Lambda_chi ~ |F|^gamma, gamma > 0 (ALIVE).
    A sustained bias gives a target filter with lift rho ~ N^delta:
    - sigma_eff = sigma_MITM - m*delta/(m-1) on the search, at unchanged table
      precomputation;
    - after rebalancing, total exponent (1+beta-delta)/2 (the IDEA-20260928-ce3ab0
      form).
    It is bounded above by the m-fold dispersion through H-RELN-41562a INV-3pp, so
    Lambda and Delta are measured on the same run.
  mechanism: >-
    OBJECT FRAME.
    - Representation: R1 - the class of x(.) in F_p^*/H_L (index-L subgroup), a
      coordinate function computed by one exponentiation.
    - Operation set Sigma: none needs to propagate. The feature is re-evaluated on each
      fresh target; the relevant operation is "select target".
    - Trichotomy: COORDINATE-DEPENDENT. The object is a function of the x-coordinate
      representation, not of the group element's logarithm.

    LOSSY-PROJECTION TEST. The projection x -> x^{(p-1)/L} discards everything but L
    classes, so it is lossy (N -> L). Compatibility follows the pushforward argument of
    IDEA-20260830-c5c614: the partition cell totals determine the relations per solve
    under target selection.

    WHY THIS AND NOT THE CHAIN. Lead 1's chain y_1 = x^{d_1}, y_{i+1} = y_i^{d_{i+1}}
    is a LOSSLESS re-presentation of the same zero-dimensional ideal: the y's are
    functions of x, and the quotient algebra is the same. It fails the test and is
    closed. The lossy part of the tower is the quotient class, i.e. this object.

    WHY A BIAS IS PREDICTED ABSENT, AND WHERE THE PREDICTION IS UNPROVEN.
    - On E x E, the functions x(P), x(Q), x(P+Q) have divisors supported on distinct
      prime divisors ({P = +-P0}, {P = O}, {P+Q = +-P0}, ...). So
      x(P)^a * x(Q)^b * x(P+Q)^c is an n-th power only if n | a, b, c. That is the
      concrete form of Hom(E, G_m) = 0.
    - Complete mixed character sums therefore cancel to O(p) against a main term p^2
      (Deligne-type, recalled).
    - Restricting to F turns the sum incomplete. Expanding the base indicator over the
      (p-1)/d characters gives an error term C*p against a main term |F|^2/L, which is
      useful only for d >> sqrt(p*L).
    - The IC regime d ~ N^{1/m} is below that, so there is no theorem there. That gap is
      the measurement.
    - Nearby positive: the same base with the FIELD product chi(x(P)*x(Q)) is maximally
      biased when chi is trivial on mu_d. The instrument must see that.
  novelty_status: adaptation
