idea:
  id: IDEA-20261006-124240
  title: >-
    Zero count of the second x-difference along translation by one
    rational point of order 5
  class: control
  claim: >-
    Let E be y^2 = x^3 + 5x + 7. Let p be the smallest prime with
    17 ≤ p ≤ 180 such that E over F_p is nonsingular and has an
    F_p-rational point T of order exactly 5. For an affine point P
    outside <T> such that P+T and P-T are affine, let
    δ(P) = x(P+T) + x(P-T) - 2 x(P) in F_p. The number of such P with
    δ(P) = 0 is at least 1. The statistic is point-dependent, read by
    the chord-and-tangent law from public P and public T, with no
    discrete logarithm. It is not a collision of three-element
    successive-difference multisets on an order-3 coset, and it does
    not change exponent 1/2.
  mechanism: >-
    OBJECT FRAME. Representation R1: the single field element δ(P)
    along the partial action of translation by one frozen point T of
    order 5. Operation set Sigma is {translation by T, translation by
    -T}, so <Sigma> has order 5 and is not the full translation
    action. Trichotomy: partial-action. LOSSY-PROJECTION TEST against
    Sigma. δ discards y and replaces the two translates by one linear
    combination of x-coordinates. The open number is how many P land
    at 0. A zero count of zeros means this second difference misses
    the diagonal on this curve. A positive count means it hits. Off-limits
    families F1–F7 are not the lens. No factor base is proposed. This
    is not the order-3 successive-difference multiset, not a
    division-polynomial root census, and not a kernel-size count.
  novelty_status: unverified
  status: proposed
  added: '2026-10-06'
  proposed_by: idea-generator
  approved_by: null
  question_id: RQ-TORS-8c7b79
  citations:
    - ref: KR-IC-955fd6
      provenance: internal
      claim: >-
        Small-order torsion already shrinks symmetrised decomposition.
        This idea builds no summation system and uses order 5 only as
        the step of δ.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-955fd6.yaml
        on 2026-10-06
    - ref: KR-IC-5a43e5
      provenance: internal
      claim: >-
        Semaev polynomials vanish on x-coordinates that sum to the
        identity. δ is one second difference, not a summation
        polynomial.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/index-calculus/KR-IC-5a43e5.yaml
        on 2026-10-06
    - ref: KR-RHO-13bf67
      provenance: internal
      claim: >-
        Generic discrete log remains Omega(sqrt(N)). A hit count for δ
        does not change that exponent.
      verified_by: >-
        design session opened knowledge/frontiers/ecdlp/generic-rho/KR-RHO-13bf67.yaml
        on 2026-10-06
    - ref: KN-OPEN-020
      provenance: internal
      claim: >-
        The universal factor-base no-go is open. This idea declares no
        factor base.
      verified_by: >-
        design session opened knowledge/open-problems/KN-OPEN-020.md
        on 2026-10-06
    - ref: division polynomial ψ_5
      provenance: recalled
      claim: >-
        Pointer only, for how a reviewer might recognise an order-5
        point. The test checks 5T = O and kT ≠ O for k = 1, 2, 3, 4
        by the group law, not by an unread formula.
      verified_by: null
  assumptions:
    - >-
      T is the first affine point in increasing x then increasing y
      for which the group law gives order exactly 5.
    - >-
      Points with P+T or P-T at infinity are omitted from the zero
      count, not scored as zeros.
    - >-
      The equation is frozen. If no prime in the interval has a
      rational point of order 5, the equation is not replaced.
  proof_search_map:
    bottleneck: >-
      Whether δ vanishes at least once outside <T>. The count is the
      whole claim. Removing a vanishing point would leave a nowhere-zero
      second difference on this curve, not a faster discrete log.
    baseline_embedding:
      parameter_slice: >-
        Generic exponent 1/2 from KR-RHO-13bf67. This control does not
        run rho.
      reproduction_check: >-
        Check 5T = O and kT ≠ O for k = 1, 2, 3, 4 before any δ is
        formed, and check that each scored P, P+T, and P-T lie on the
        curve.
    observation_collision:
      observable: the value δ(P) in F_p
      distinct_preimage_search: >-
        Search for one P outside <T> with δ(P) = 0. Absence of such a
        P, after a complete scan, is the falsifier.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: the second x-difference along translation by T
        predicted_gain: >-
          A zero count. Zero is a miss. At least one is a hit. Neither
          moves an exponent.
    quantifier_order: >-
      There exists a smallest prime p with 17 ≤ p ≤ 180 such that E
      has a rational point T of order 5, and for that p there exists
      an affine P outside <T> with δ(P) = 0.
    method_ceiling:
      strongest_certifiable_claim: >-
        One toy zero count on one curve and one prime. No statement
        about a secret scalar.
      nearby_object_control: >-
        Four hundred shuffles of affine x-coordinates on the same
        point indices. The group-law zero count is not read as special
        when it lies in the central 90 percent of those shuffles.
    proof_obligations:
      - claim: Order exactly 5 is checked by the group law before δ is formed.
        responsibility: correctness
      - claim: A zero count does not change exponent 1/2.
        responsibility: scope
    not_applicable_reason: >-
      This is a control on one second difference, not a theorem, bound,
      certificate, reduction, or closure.
  predictions:
    - metric: number of scored P with δ(P) = 0
      direction: higher
      minimum_effect: at least 1
    - metric: fraction of scored P with δ(P) = 0
      direction: higher
      minimum_effect: strictly above 0 when the zero count is at least 1
  minimal_test:
    design: >-
      Increase p through primes from 17 to 180. Skip singular fibres of
      y^2 = x^3 + 5x + 7. Search for T of order exactly 5 by the group
      law. On the first success, evaluate δ on every eligible affine P
      and count zeros. Stop at that p. If no p works, record a failed
      premise and do not substitute another equation.
    controls:
      - Group-law control. 5T = O and kT ≠ O for k = 1, 2, 3, 4.
      - On-curve control. Each scored P, P+T, and P-T satisfies the equation.
      - Shuffled-x null. 400 shuffles of affine x-coordinates, same point indices, zero counts recorded.
      - A prime in the scan with no rational order-5 point is not scored.
    required_metrics:
      - p
      - x(T) and y(T)
      - number of scored P
      - zero count
      - median and the central-90 bounds of the 400 shuffle zero counts
  falsification_conditions:
    - The zero count on the real curve is 0.
    - No prime p with 17 ≤ p ≤ 180 supplies a rational point of order exactly 5.
    - A reported zero has P, P+T, or P-T off the curve, so δ was miscomputed.
  confounders:
    - >-
      A linear form in three x-coordinates can vanish for birthday
      reasons. The shuffle null is required before a positive count is
      read as group-law structure.
    - The first success can be an unusually small group. The scope is that one p.
    - >-
      If several order-5 points exist, the test freezes the first in
      lexicographic x, then least nonnegative y, and does not switch.
  interpretation_limits:
    - The statistic does not determine a secret scalar.
    - Evidence would be claim_tier toy and would stop at the first eligible p.
    - Not a factor base and not a summation polynomial.
    - >-
      This is not the claim that successive x-difference multisets on
      order-3 cosets collide.
  heuristic_assumptions:
    - id: H1
      statement: >-
        On a fixed index set of n scored points, a uniform shuffle of
        affine x-coordinates produces zero counts of the same linear
        form whose mean imitates n/p, the chance a uniform field
        element is 0. This is a finite-field uniform model at the
        selected p, not a model of large-p torsion.
      rigorous_support: >-
        Uniform draw on a finite field. No Weil estimate is used.
        KR-IC-5a43e5, opened in this session, is a vanishing criterion
        for summation polynomials and is not a distribution for δ.
      validation_plan: >-
        Draw 400 x-shuffles at the selected p. Compare the sample mean
        of zero counts with n/p in exact rationals. Flag the group-law
        count as outside the shuffle law only when it falls outside the
        central 90 percent of those 400 counts. Otherwise the score is
        the raw zero count, with no structural reading.
  target_complexity:
    time_exponent: unchanged p^{1/2}
    memory_exponent: >-
      unchanged O(1) for rho; the measurement stores O(p) points with p at most 180
    best_known: >-
      Pollard rho Theta(sqrt(N)), KR-RHO-13bf67. Torsion symmetries in
      decomposition are the separate constant in KR-IC-955fd6 and are
      not this quantity.
    hidden_overhead: none; no new algorithm
    tradeoff_note: >-
      No tradeoff. Evaluating δ at one point costs two additions.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
  dominated_by: >-
    No opened row dominates this zero count. Rows opened and not
