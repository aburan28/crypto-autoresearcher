    index calculus), KR-RHO-13bf67 (matching exponent baseline).
  sota_delta: >-
    Zero change to exponent 1/2. The new quantity is the number of
    affine P outside <T> with δ(P) = 0, on the first prime p in
    [17, 180] where y^2 = x^3 + 5x + 7 has a rational point of order
    5, or a failed premise if no such p exists.
