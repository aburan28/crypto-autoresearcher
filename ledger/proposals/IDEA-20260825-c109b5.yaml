  batch: EC-STRUCTURE-20260825
  cluster: 'C3-factor-base: what ''algebraically described'' actually bounds'
  title: ARE THE BEZOUT NO-GO AND THE DL-CIRCULARITY OBSTRUCTION THE SAME BARRIER? compare the largest
    algebraic factor base for which the Weil bound gives a nonvacuous yield statement against the largest
    one Bezout permits -- if they meet, the program has ONE frontier and every future proposal can be
    placed on one side of a single line
  class: audit
  claim_ceiling: unverified_zero_run_structural_proposal_only_no_experiment_no_implementation_no_status_change_no_novelty_conclusion
  status: proposed
  novelty_status: unverified
  novelty_note: Both obstructions are already recorded here. The proposed contribution is the comparison,
    which no record makes, and the resulting single-line description of the frontier if the comparison
    closes.
  claim:
    semantic_part: The DL-circularity obstruction bites only for factor bases that are NOT algebraic in
      the point coordinates; for algebraic bases the yield is a point count on a variety and is Weil-computable.
      Bezout caps algebraic bases at O(description degree). If the largest Weil-tractable base coincides
      with the largest Bezout-permitted one, the two recorded obstructions are one frontier seen from
      two sides.
    evaluator_part: 'Unestablished: whether the two bounds actually coincide, are merely comparable, or
      leave a genuine gap. A gap would be the interesting outcome and would name the exact family living
      in it.'
    end_to_end_ecdlp_claim: false
    breakthrough_claim: false
  mechanism:
  - 'Write the Weil-tractable side: for an algebraic factor base F given by a locus of degree d, express
    the m-fold decomposition count as a point count on the intersection of the Semaev hypersurface with
    F^m and state the Weil error term and the main term, identifying the d at which the error swamps the
    main term.'
  - 'Write the Bezout side: the bound on |F| in terms of d already recorded in this ledger.'
  - Compare the two as functions of d and of B = |F|, and report whether the 'Weil-nonvacuous' region
    and the 'Bezout-permitted' region coincide, nest, or leave a gap.
  - If a gap exists, characterize the family in it explicitly -- it would be the one algebraic family
    for which yield is neither bounded by Bezout nor computable by Weil, and would deserve its own lane.
  lossy_projection_test:
    tracked_object: the pair (description degree, base size) of a factor base
    what_is_discarded: the base's identity
    propagation: not propagated; this is a static comparison of two bounds
    verdict: N/A -- an audit of two existing bounds, not a new tracked object.
  predictions:
  - id: P1
    status: unestablished
    statement: The Weil error term swamps the main term at exactly the description degree where Bezout
      caps the base size.
  - id: P2
    status: unestablished
    statement: No algebraic factor base is simultaneously Bezout-permitted and Weil-intractable.
  minimal_discriminating_test:
    status: specified_not_run
    test: Symbolic derivation of both boundaries as functions of d, with a toy-scale numerical check that
      the Weil error term behaves as derived for at least three explicit loci.
    pass: The two boundaries coincide to leading order and the numerical check matches the derivation.
    fail: A demonstrated gap, with an explicit locus inside it, redirects the lane and is the more valuable
      outcome.
  controls:
  - A locus where the yield is exactly computable by direct enumeration, to validate the Weil main-term
    derivation independently of the bound.
  - The interval factor base, which is non-algebraic, as the boundary case that must fall outside the
    Weil-tractable region.
  confounders:
  - Weil bounds require the relevant variety to be absolutely irreducible of known dimension; a locus
    violating that gives a vacuous 'obstruction' for the wrong reason.
  - '''Nonvacuous'' needs a threshold: main term exceeding error term by a stated factor, fixed in advance.'
  - Comparing a bound on |F| with a bound on yield conflates two quantities unless the translation is
    written explicitly.
  falsification:
    semantic: An explicit Bezout-permitted, Weil-intractable locus falsifies P2.
    evaluator: An error in the error-term derivation scopes out that boundary only.
    not_falsification: Failure to derive one boundary; the audit then reports one side and says so.
  why_this_is_not_a_variant: IDEA-20260727-006 asks about the equidistribution-resolution gap in terms
    of factor-base SIZE. This record asks the different question of whether the two SEPARATE obstruction
    records describe one frontier, which is a statement about the ledger's model of the problem rather
    than about any one bound.
