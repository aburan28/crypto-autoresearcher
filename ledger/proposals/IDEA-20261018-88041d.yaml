idea:
  id: IDEA-20261018-88041d
  title: Large-memory run of the Weil-descent degree cells (4,6) and the l>=7 slope cells
  class: measurement
  question_id: RQ-DREG-bd6c86
  area: DREG
  goal_ids:
  - GOAL-DREG-001
  status: proposed
  proposed_by: idea-generator (Sonnet subagent logging the missed items of the 2026-10-18 index-calculus
    review)
  added: '2026-10-18'
  claim: At the cell (m,l)=(4,6) the solving degree of the Weil-descended Semaev system stays at 5, and
    at the slope cells m=3 l=8 and m=4 l=7 it rises by at most one degree per step, so the optimistic
    ECC2K-130 m=4 row (degree 5 held to n=131, +10.32 bits over rho) survives. The competing reading,
    degree follows l, prices the same target at about +112 bits.
  mechanism: 'The dense MutantXL closure and msolve already passed their positive controls (closure refutes
    2-3 degrees below XL on 20/20 cells; m=4 flat at 4 through N=42; m=3 rises above 4 at l=7 on 8/8 draws).
    Two survivors remain, ''rise at l=7'' and ''rise once m*l >= 21'', and (4,6) separates them. Only
    memory is missing: (4,6) at degree 5 needs about 70 GB dense (N=40), the sparse closure built 2026-10-17
    is too slow, and every run since 2026-10-14 had 3-15 GB.'
  novelty_status: unverified
  regime: binary, E/F_{2^n} Weil descent (ECC2K-130 m=4); exponent-level; 256-512 GB host, about one week
  citations:
  - ref: crypto:research/ic_leads_review_20261018/README.md 3.1, 3.5, fig. 1-2, 4 row 1
    provenance: internal
    claim: Source of the opportunity, the measured figures quoted here and the cost estimate; desk review,
      no new measurement, costs are the reviewer's estimates.
    verified_by: idea-generator
  - ref: crypto:research/dreg_closure_driver_20261016/RESULTS.md
    provenance: internal
    claim: (4,6) needs about 70 GB dense at degree 5; the deciding cell.
    verified_by: idea-generator
  - ref: crypto:research/dreg_closure_mutantxl_20261016/RESULTS.md; crypto:research/dreg_closure_scale_20261016/RESULTS.md;
      crypto:research/dreg_closure_specialise_20261017/RESULTS.md
    provenance: internal
    claim: Closure refutation on 20/20 cells; m=4 plateau at 4; m=3 rise at l=7.
    verified_by: idea-generator
  - ref: crypto:research/notes/ecc2k130/RESEARCH_ECC2K130_DESCENT_DEGREE.md
    provenance: internal
    claim: 'Points 6-8: m=4 price rows by degree assumption, +10.32 bits optimistic.'
    verified_by: idea-generator
  - ref: crypto:research/ic_next10_20261014/06-equivariant-f4-m4/README.md
    provenance: internal
    claim: Equivariant F4 / m=4 degree cells measured so far.
    verified_by: idea-generator
  prior_art:
    frontier_map: knowledge/frontiers/ecdlp
    rows_checked:
    - KR-IC-fbdb61
    - KR-IC-0d2021
    - KR-IC-f5c584
    - KR-IC-955fd6
    - KR-IC-889857
    nearest:
    - ref: KR-IC-fbdb61
      provenance: internal
      relation: special_case
      delta: Measures solving-degree cells of Weil-descended systems that the last-fall-degree theory
        bounds; runs three named cells on a host with the memory the earlier runs lacked; no new mechanism.
    searched:
      note: Positioned against the cited review and the records it names. The frontier map was not rendered
        or matched in this logging pass; the Coordinator should run tools/build_frontier_map.py --match
        before ranking. A missing row is not evidence of novelty.
  assumptions:
  - The dense closure is run unchanged from the controlled instrument; only the memory cap changes.
  - Cells are sampled from the frozen draw protocol of the driver; no cell is chosen after seeing a degree.
  predictions:
  - metric: solving_degree_(4,6)
    direction: different
    minimum_effect: Reported as an exact integer with refutation certificate at degree d-1; prediction
      is 5.
  - metric: solving_degree_slope_m3_l8_and_m4_l7
    direction: lower
    minimum_effect: Increase of at most 1 per l step past the rise; a slope of 2 or more per step refutes
      'degree 5 holds'.
  - metric: ecc2k130_m4_row_bits_over_rho
    direction: different
    minimum_effect: 'Row is re-derived from the measured degrees: +10.32 if degree 5 holds to n=131, toward
      +112 if degree follows l.'
  minimal_test:
    design: On one 256-512 GB node run, with the frozen driver and the same draw protocol, the dense MutantXL
      closure at (4,6), then m=3 l=8 and m=4 l=7, with msolve as the cross-check where it fits. Each cell
      reuses the positive control (known-degree cell) before and after. Record exact degree, refutation
      certificate, peak RSS, counted column touches, and the three-point verdict.
    controls:
    - known-degree positive control cell run before and after on the same node
    - support-matched random system at each cell (null degree)
    - msolve cross-check on cells where it fits
    - A/A repeat of one cell on the same node
    required_metrics:
    - exact degree with refutation certificate
    - peak RSS
    - column touches
    - wall and CPU (reported, not the unit)
    - which survivor ('l=7' or 'm*l>=21') is excluded
  falsification_conditions:
  - Degree at (4,6) >= 6, or a slope >= 2 per l step past the rise, refutes 'degree 5 holds' and prices
    ECC2K-130 m=4 nowhere near +10.32 bits.
  - Degree at (4,6) equal to 4 excludes 'rise once m*l >= 21' and keeps 'rise at l=7'.
  - A cell that exceeds the node's memory is censored, not evidence for either reading.
  confounders:
  - unconverted column-touch units (see the K idea)
  - draw-to-draw variance of the degree
  - closure vs msolve disagreement
  - memory cap shared with other jobs
  interpretation_limits:
  - Three cells do not prove degree 5 to n=131; they bound the extrapolation.
  - No claim about a deployed curve; a degree is not an attack cost until K is measured.
  heuristic_assumptions:
  - id: H1
    statement: The solving degree of the descended system at fixed (m,l) is independent of the field size
      n once n exceeds the cell's variable count.
    rigorous_support: Flat m=4 degree through N=42 and the 8/8 m=3 draws.
    validation_plan: Run two N values per cell where memory allows; compare degree equality.
  target_complexity:
    time_exponent: Decides between a binary-field m=4 exponent consistent with the +10.32-bit row and
      one near +112 bits at ECC2K-130. No new algorithm; the exponent in question is that of the existing
      descent.
    memory_exponent: Dense closure about 70 GB at (4,6) degree 5 (N=40); larger for l>=7 cells.
    best_known: Matched generic rho, r^0.5 group operations; the index-calculus baseline is Table A/B
      of crypto:docs/ic/LEADERBOARD.md (5.23x to 21x matched rho on Koblitz, 5.47x to 13.5x on prime fields).
      Report this row's gap to matched rho (and to Bernstein-Lange where setup is excluded) as distance
      remaining.
    hidden_overhead: Every phase, cold, is charged; unpriced native work is priced at 0, 0.1 and 1 GAE
      per operation (AGENTS.md 5a) wherever two arms are ranked.
    tradeoff_note: Not applicable beyond the stated resource envelope.
  estimated_cost:
    implementation: low (instruments exist)
    compute: high (one 256-512 GB node, about one week; reviewer estimate)
  recommended_priority: high
  dominated_by: No attack result; the item is an unrun measurement or an unpaid baseline debt.
  sota_delta: None measured. This is the largest single missed opportunity in the review; it answers an
    exponent-level question, it does not itself lower any cost.
