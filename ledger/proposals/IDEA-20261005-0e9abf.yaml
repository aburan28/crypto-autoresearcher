idea:
  id: IDEA-20261005-0e9abf
  question_id: RQ-MLKEM-003
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: Bit gap that dies on plain LWE is the isometry discount
  class: control
  claim: >-
    At n=64, a cost gap of at least 2 bits between an isometry-folded
    sparse-secret Ring-LWE instance (Hamming weight 8, ring Z[x]/(x^64+1),
    q=3329) and the same samples with coefficient isometries not folded, and a
    residual gap under 1 bit on unstructured LWE of dimension 64 with the same
    weight and q, is an isometry attribution at this toy point. A gap that
    remains at least 2 bits on the plain LWE cell is not an isometry discount.
    A separation that appears only at approximation factor exp(sqrt(64)) ≈ 2981
    on a cyclotomic ideal lattice is not this line. The reported 15-bit and
    2–3-bit figures are not re-derived, this record claims no bit-security
    improvement, and it does not claim Ring-LWE is broken.
  mechanism: >-
    The tracked object is the orbit of the public matrix under coefficient
    isometries of the ring (toy stand-in: the automorphisms x |-> x^r for r
    odd, which is unverified against KN-LIT-7663 because that file was not
    opened). Folding the orbit amortises preprocessing across derived
    instances. Removing the isometry — plain LWE of the same dimension, or the
    same ring samples with orbits not merged — drops that amortisation, so a
    gap that survives the removal was never an isometry discount. The
    class-group object is different: a log-unit certificate whose published
    approximation factor is exp(O~(sqrt(n))). A gap that shows up only in that
    band is the class-group line. The projection is lossy: the orbit index
    discards which isometry representative was written down, and it propagates
    under the coefficient action only while that action is present.
  novelty_status: unverified
  citations:
    - ref: KN-OPEN-026
      provenance: internal
      claim: >-
        The entry reports, and does not verify, coefficient-isometry gaps of
        up to 15 bits on sparse-secret RLWE and 2–3 bits on Kyber/ML-KEM,
        relayed from abstracts. No paper was read in full and no lattice
        experiment was run by this program. Read from
        knowledge/open-problems/KN-OPEN-026.md.
      verified_by: knowledge/open-problems/KN-OPEN-026.md
    - ref: KN-LIT-7663
      provenance: recalled
      claim: >-
        Named by KN-OPEN-026 as the coefficient-isometry source of those bit
        figures. This session did not open the literature file. The figures
        stay reports.
      verified_by: null
    - ref: RQ-MLKEM-003
      provenance: internal
      claim: >-
        The question's own target is core-SVP versus a memory-charged sieve at
        ML-KEM dimensions, toy-tier only, with no claim about a standardized
        parameter set. Read from ledger/questions/RQ-MLKEM-003.yaml. This
        control does not answer that sieve question.
      verified_by: ledger/questions/RQ-MLKEM-003.yaml
  assumptions:
    - >-
      The 15-bit and 2–3-bit figures are reports in KN-OPEN-026. They are not
      verified costs and are not a target this test must reproduce.
    - >-
      The toy symmetry toggled is the ring automorphism group of x^64+1
      (x |-> x^r, r odd). If KN-LIT-7663 uses a different coefficient isometry,
      a negative result here does not touch that paper.
    - q=3329 and n=64 are a toy pair. They are not FIPS 203 parameters.
    - >-
      Bit gaps are differences of a single stated cost model. Cross-model
      comparison is out of scope.
  predictions:
    - metric: isometry_bit_gap
      direction: higher
      minimum_effect: >-
        At least 2 bits on sparse-secret Ring-LWE, n=64, weight 8,
        Z[x]/(x^64+1), q=3329, with coefficient isometries folded, minus the
        unfolded cost of the same samples. Under 1 bit on plain LWE of
        dimension 64, same weight and q.
    - metric: ideal_cell_bit_gap_at_polynomial_factor
      direction: lower
      minimum_effect: >-
        Under 1 bit on the degree-64 cyclotomic ideal cell at approximation
        factors below exp(sqrt(64))/2 ≈ 1490. A separation that appears only
        at approximation factor at least exp(sqrt(64)) ≈ 2981 is not counted
        as an isometry gap.
  minimal_test:
    design: >-
      Three cells. (S) Sparse-secret Ring-LWE, n=64, secret Hamming weight 8,
      q=3329, ring Z[x]/(x^64+1). Compute the hybrid or BKZ cost in one fixed
      model with automorphism orbits folded and with orbits not folded; the
      difference is the bit gap. (U) Unstructured LWE, dimension 64, weight 8,
      q=3329, same sample count, same cost model; there is no ring
      automorphism to fold. (I) Cyclotomic ideal lattice of degree 64 in
      Z[x]/(x^64+1), no Ring-LWE samples. Run only the log-unit / class-group
      side and record the approximation factor of any returned vector against
      exp(sqrt(64)) ≈ 2981. Do not convert that factor into a bit discount.
    controls:
      - Plain LWE, same dimension, weight, q, and cost model.
      - The same Ring-LWE samples with isometries not folded.
      - Degree-64 ideal lattice scored by approximation factor, not by bits.
    required_metrics:
      - isometry_bit_gap on S and on U, in bits, from one named cost model
      - model identifier and the exact cost expression used
      - approximation factor on I, and whether it meets exp(sqrt(64)) ≈ 2981
      - log_unit_certificate on I, S, and U
  falsification_conditions:
    - >-
      The plain LWE gap is at least 2 bits. Whatever moved is not an isometry
      discount.
    - >-
      The folded-minus-unfolded gap on the sparse Ring-LWE cell is under 1 bit.
      This toy design does not see an isometry discount. That does not confirm
      or refute the reported 15-bit figure.
    - >-
      The ideal cell shows a gap of at least 2 bits at an approximation factor
      below exp(sqrt(64))/2, in the same cost model, with no coefficient orbit
      being folded. The lines are not separated by this test.
    - >-
      The only separation on the ideal cell is an approximation factor at
      least exp(sqrt(64)) ≈ 2981, and that separation is reported as a 2–15
      bit isometry discount. That mis-labels the class-group line.
  confounders:
    - >-
      KN-OPEN-026 says the reported figures are model-relative. A gap that
      changes when the cost model changes is a model gap.
    - Estimator spread larger than 2 bits makes the 2-bit minimum effect unreadable. That cell is then inconclusive.
    - Weight 8 at n=64 is a sparse regime. A uniform-secret gap of 2–3 bits is not what this minimum effect asserts.
    - Toggling x |-> x^r may not be the isometry in the unread source.
  interpretation_limits:
    - >-
      No bit-security improvement is claimed. A measured toy gap is not a
      discount for any deployed parameter set and is not a statement about
      FIPS 203 or ML-KEM categories.
    - Does not claim Ring-LWE is broken.
    - >-
      RQ-MLKEM-003 asks a core-SVP versus memory-charged sieve question and
      withholds experiment design until primary sources are filed as KN-LIT.
      This record is an attribution control for the reported isometry gaps. It
      does not answer the sieve question, and it is not that filed experiment.
    - >-
      The 15-bit and 2–3-bit numbers stay reports. Reproducing either number
      is not a success condition.
    - >-
      A dense-sublattice transition that tracks q/(0.004*n^2.484) is the NTRU
      line. A log-unit certificate at exp(O~(sqrt(n))) is the class-group line.
  heuristic_assumptions:
    - id: H1
      statement: >-
        Coefficient isometries are reported to leave a cost gap of up to 15
        bits on sparse-secret Ring-LWE and 2–3 bits on Kyber/ML-KEM. Both
        figures are reported, not re-derived. A gap that is still present on
        unstructured LWE of the same dimension is not that discount. A gap that
        appears only at approximation factor exp(O~(sqrt(n))) is not that
        discount.
      rigorous_support: >-
        KN-OPEN-026 reports those two ranges and attributes the isometry
        mechanism to KN-LIT-7663. This session opened KN-OPEN-026 and did not
        open KN-LIT-7663. No proof of either bit figure is claimed.
      validation_plan: >-
        Toy measurement at n=64, q=3329, secret weight 8, ring
        Z[x]/(x^64+1), one named cost model, folded versus not folded.
        Plain LWE control: dimension 64, same weight and q. Ideal control:
        degree 64, approximation factor compared with exp(sqrt(64)) ≈ 2981.
        Do not refit the 15-bit or 2–3-bit reports.
  target_complexity:
    time_exponent: >-
      BKZ / core-SVP time at block size β, the baseline this proposal does not
      beat. The proposal measures a discriminator and does not move the
      exponent.
    memory_exponent: >-
      Sieve memory of that same BKZ / core-SVP baseline. This proposal does
      not move it.
    best_known: >-
      BKZ / core-SVP for ML-KEM-shaped module lattices. Reported
      coefficient-isometry gaps of 2–3 bits (Kyber/ML-KEM) and up to 15 bits
      (sparse-secret RLWE) are reports, not verified improvements
      (KN-OPEN-026).
    hidden_overhead: >-
      Core-SVP omits memory-access and lower-order terms by convention. This
      proposal does not estimate those terms and does not turn a bit gap into
      an exponent change.
    tradeoff_note: >-
      No time-memory tradeoff is proposed. A gap that survives on plain LWE is
      not an isometry discount. A gap that appears only at approximation factor
      exp(O~(sqrt(n))) is the class-group line.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: medium
  prior_art:
    frontier_map: not_applicable
    not_applicable_reason: >-
      Not an ECDLP frontier row. The line was read from
      knowledge/open-problems/KN-OPEN-026.md.
    nearest:
      - ref: KN-OPEN-026
        provenance: internal
        relation: adjacent
        delta: >-
          Quantitative separator is the reported gap of up to 15 bits
          (sparse-secret RLWE) and 2–3 bits (Kyber/ML-KEM). This control asks
          whether a toy gap of at least 2 bits vanishes on plain LWE of the
          same dimension. It does not enlarge either reported figure.
  dominated_by: >-
    Baseline named: BKZ / core-SVP cost for an ML-KEM-shaped module lattice,
    not beaten. n/a (no attack result claimed)
  sota_delta: >-
    Not an attack claim and not a bit-security improvement. Numeric separator:
    the reported gap of up to 15 bits on sparse-secret RLWE and 2–3 bits on
    Kyber/ML-KEM (KN-OPEN-026 reporting KN-LIT-7663; figures not re-derived).
    A gap that remains on plain LWE of the same dimension falls outside this
    separator.
