    baseline_embedding:
      parameter_slice: |-
        r = 1: the EDS rank of apparition, known to be ECDLP-equivalent (Lauter-Stange, recalled)
      reproduction_check: rank-1 arm must reproduce ord(P) as the period
    observation_collision:
