  title: Hidden kernel lattice via elliptic nets, and the elliptic-sieve null test
  class: measurement
  claim: |-
    (i) the zero set of W mod p in a box is exactly a lattice of index |<P_1..P_r>| (Lauter-Stange); (ii) the yield of B-smooth W(v) matches a Dickman-type prediction from height growth; (iii) membership in Lambda_p is statistically independent of B-smoothness of W(v) and of membership in every Lambda_q (mutual information about 0). Alive only if (iii) fails.
  mechanism: |-
    With lifted generators Ptilde_1..Ptilde_r, v is in Lambda = ker(Z^r -> E(F_p)) iff the rank-r elliptic net value W(v) = 0 mod p. For a small prime q, W(v) = 0 mod q is periodic with lattice Lambda_q (computable by small DLPs), so smooth-denominator points can be sieved. The question is whether sieveable small-q structure carries any information about Lambda_p. In NFS the big prime never needs sieving because the two sides are linked by a ring map; here there is one side and Lambda_p is the unknown.
  novelty_status: unverified
  citations:
