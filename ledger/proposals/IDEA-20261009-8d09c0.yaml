      random lattice of the same index (same statistics expected); rank-1 case reduces to the EDS rank of apparition (known)
    required_metrics:
    - index of reconstructed Lambda_p vs subgroup order
    - sieve yield ratio observed / predicted
    - mutual information (bits)
    - net evaluation cost vs box size
    stopping_rule: 3 ranks x 4 p-sizes x 3 curves
    replication:
