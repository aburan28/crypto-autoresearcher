  minimal_test:
    design: |-
      1. Implement rank-r elliptic nets (Stange's recurrences) over Q for r in {2, 3, 4} with generators of height <= 10; p in 2^20 .. 2^32; q <= 2^10.
      2. Enumerate v with |v_i| <= 30; compute W(v) exactly and mod p, mod q.
      3. (i) reconstruct Lambda_p by HNF of the zero set and check its index; (ii) compare sieve yield with prediction; (iii) chi-squared and mutual-information tests on (Lambda_p membership, smoothness, Lambda_q membership for 20 primes q).
    controls:
