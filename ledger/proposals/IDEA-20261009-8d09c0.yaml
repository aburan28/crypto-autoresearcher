  falsification_conditions:
  - (i) the zero set of W mod p in the box is not a lattice of index |<P_1..P_r>|.
  - |-
    (ii) smooth yield departs from the Dickman-type prediction by more than 20% with the random-lattice control matching it.
  - |-
    (iii) ALIVE condition: positive mutual information between Lambda_p membership and (smoothness, Lambda_q membership), reproduced across >= 3 p-sizes with the random-lattice control at 0. A single toy-p signal is a finite control (claim boundary).
  confounders:
  - |-
    Net values grow like exp(height x |v|^2); exact computation bounds the box; mod-p values are used for membership and exact values only for smoothness.
  - |-
    Plug-in mutual-information estimators are biased upward at small samples; the random-lattice control measures the bias.
  interpretation_limits:
