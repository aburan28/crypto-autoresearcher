  assumptions:
    - >-
      Both statements - the salted multi-target bound and whatever statement covers the
      ephemeral variant - are transcribed from primary text with quantifier order recorded,
      before this record is executed.
    - >-
      The FrodoKEM/eFrodoKEM pair really is a salt ablation with the rest held fixed. lenSE also
      changes (halved, per the fetched I-D reading), which STAGE 5 exists to detect; if further
      differences appear the pair is not a clean ablation and no attribution to the salt is
      permitted.
    - >-
      The dominant multi-target term is monotone in the composed variable over the evaluated
      range, so a residual is a bound rather than a direction-free factor.
    - >-
      The published figures quoted identically for FrodoKEM and eFrodoKEM are taken as printed
      and are not re-derived here. They are beyond-core-SVP cryptanalysis outputs, so their
      identity across the two variants is expected rather than surprising - the LWE instance is
      the same - and this record no longer treats it as a puzzle for the reproduction gate.
    - >-
      Nothing here re-estimates LWE hardness or the decryption failure rate; both enter as given
      symbols (GOAL-FRODO-002.non_duplication).
    - >-
      Draft revisions are live. Every clause is bound to a revision number and a retrieval
      timestamp, and a later revision that harmonizes the two clauses would answer D1/D2 by
      itself.
  proof_search_map:
    bottleneck: >-
      The composition step in which a deployment-level usage restriction is used to instantiate
      a variable of a security bound - and, after repair, the prior step in which a reader
      decides WHICH published rendering of that restriction they are composing. It is the only
      place in the chain where a document written for implementers meets a quantifier written
      for a theorem, and it is now known to have two candidate inputs rather than one.
    baseline_embedding:
      parameter_slice: >-
        n_u = 1. At a single public key the aggregate and per-key readings coincide exactly and
        the residual must be 1 under both, and both clauses must agree. That is the old-method
        boundary: the single-target statement everyone agrees on. Any formalization that does
        not return residual 1 at n_u = 1 is wrong before it is applied.
      reproduction_check: >-
        Symbolic: evaluate the composed expression at n_u = 1 and check it reduces to the
        transcribed single-target statement term for term, as a frozen fixture.
        NUMERIC GATE REPAIRED AT 2026-08-24, and this is BLOCKING-1 in this record. The
        inherited gate formerly read 'reproduce 149.8 / 212.6 / 266.8 at the published inputs'.
        THAT GATE IS WITHDRAWN AS A CATEGORY ERROR: the CFRG security-considerations draft,
        re-read verbatim this session, attributes those three figures to the 'beyond-core-SVP'
        methodology, i.e. to LWE cryptanalysis of the FrodoKEM instances, so they are not
        outputs of any FO/SFO bound and a pipeline that reproduced them from the transcribed
        bound would be wrong. REPLACEMENT, TWO ARMS: (i) the transcribed bound, evaluated at the
        paper's own stated inputs, must reproduce the paper's own stated IND-CCA (ROM) figure
        per parameter set - THE NUMERIC TARGET IS LEFT DELIBERATELY UNFILLED, because it is a
        required BATCH-001 transcription output and this agent has not read the table the
        red-team screen cites it from; (ii) 149.8 / 212.6 / 266.8 enter as GIVEN INPUT SYMBOLS
        with their beyond-core-SVP provenance recorded, and re-deriving them is forbidden by
        GOAL-FRODO-002.non_duplication. COORDINATOR NOTE, not an action by this agent:
        GOAL-FRODO-002.completion_criteria[1] carries the same ambiguity.
    observation_collision:
      observable: >-
        The residual factor emitted by STAGE 2.
      distinct_preimage_search: >-
        Search for two DIFFERENT restriction/bound pairs with the same residual but opposite
        security readings - the obvious candidate pair being (per-key cap, aggregate-consuming
        term) and (global cap, aggregate-consuming term with an extra per-key factor already
        inside it). If both emit a factor in n_u, the residual is not identifying and must be
        reported together with the binder triple that produced it, never alone. ADDED AT REPAIR:
        the two published clauses are themselves a live collision candidate, since a faithful
        normalization might map both to the same triple while a reader following one rather than
        the other inherits different obligations - which is exactly the D1/D2 distinction and
        why NULL-4 must show the modality coordinate moving while the residual does not.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the full quantifier PREFIX and the deontic MODALITY rather than the final scalar
          bound, because the triple is what survives composition across documents while the
          scalar does not.
        predicted_gain: >-
          Makes the composition step decidable mechanically instead of by reading comprehension,
          makes a mis-scoped restriction visible as a type error, and makes a divergence between
          two renderings of one number visible as a difference in a tracked coordinate rather
          than as an impression. No exponent is claimed.
      - transform: representation_reduction
        proposed_object: >-
          Move both clauses and the bound into a model where the hypothesis is an exact
          condition - prefix containment - rather than an inequality between numbers.
        predicted_gain: >-
          Encoding, completeness and soundness obligations become separable and each can fail
          visibly; the cost-loss obligation is the residual itself.
    quantifier_order: >-
      Written out, the two candidate readings of the BOUND are:
      E2 (per key): FORALL public keys pk, FORALL adversaries A, [ n_c(pk) <= 2^8 ] IMPLIES
      Adv(A, pk) <= f(n_c(pk), ...).
      E1 (aggregate): FORALL adversaries A, FORALL families {pk_u}_{u in [n_u]},
      Adv(A, {pk_u}) <= f(sum_u n_c(pk_u), ...).
      Per the red-team screen the transcribed bounds are of the E1 shape, so this is recorded as
      a pre-declared expectation rather than an open question.
      Written out, the two candidate readings of the CLAUSE are:
      C1 (I-D, selection): FORALL applications app, [ expected n_c(app) < 2^8 ] IMPLIES
      variant(app) = ephemeral - a constraint on a deployment decision, conditioned on an
      EXPECTATION.
      C2 (security considerations, prohibition): FORALL keys pk with variant(pk) = ephemeral,
      NOT [ n_c(pk) >= 2^8 ] - a constraint on an ACTUAL count.
      The audit is whether C1 and C2 normalize to the same triple, and what each composes to
      against an E1-shaped bound. The witness-dependence question is explicit: under E1 the
      adversary's success may depend on the whole family, and neither C1 nor C2 constrains a
      family-dependent witness.
    method_ceiling:
      strongest_certifiable_claim: >-
        'As transcribed, clause C1 binds symbol X under prefix P with modality M1, clause C2
        binds symbol X* under prefix P* with modality M2, the published bound consumes symbol Y
        under prefix Q, and composing each clause with the bound requires operators R1 and R2
        respectively.' That is all. The method can NEVER certify that an adversary exists, that
        any user count is reachable, that eFrodoKEM is broken, that 2^8 should be a different
        number, or that either draft is defective. It also cannot certify that a later revision
        does not harmonize the clauses.
      nearby_object_control: >-
        SALTED FrodoKEM, where the published claim is TIGHT multi-target security - the closest
        object on which the hoped-for conclusion must FAIL. If the method reports the same
        residual on the salted arm, it has not identified the load-bearing structure and its
        ephemeral-arm output means nothing. This is NULL-1, and it is both the nearby-object
        control and the ablation comparator. NOTE THE ASYMMETRY DISCLOSED AT REPAIR: per the
        screen the SFO term still carries n_u * n_c^2, so the salted arm's residual is expected
        to be SUPPRESSED by 2^-lensalt rather than to be exactly 1, and the control's pass
        condition is stated in that form so it cannot be satisfied trivially.
    proof_obligations:
      - claim: Both clauses and the bound are transcribed with quantifier prefixes and modalities as printed.
        responsibility: interface
      - claim: The composition reduces to the single-target statement at n_u = 1.
        responsibility: baseline
      - claim: >-
          The residual is a valid bound, i.e. the composed term is monotone in the composed
          variable over the evaluated range.
        responsibility: correctness
      - claim: The salted arm returns a residual separated from the ephemeral arm's by at least the salt factor.
        responsibility: strictness
      - claim: The residual is invariant under a modality-only restatement while the modality coordinate moves.
        responsibility: correctness
      - claim: The bit-security movement as a function of n_u is computed in exact or interval arithmetic.
        responsibility: correctness
      - claim: No statement about attacker reachability of any user count is made anywhere in the deliverable.
        responsibility: scope
  predictions:
    - metric: >-
        binary verdict D1 or D2: whether the I-D variant-selection clause and the
        security-considerations prohibition clause normalize to the same
        (symbol, prefix, modality) triple under the declared normalization
      direction: different
      minimum_effect: >-
        a verdict with both normalized triples printed and the normalization rules stated in
        advance. D1 closes the question; D2 requires the two residuals to be reported separately
        with the document each belongs to. THIS IS THE HEADLINE METRIC AFTER REPAIR
    - metric: >-
        residual factor emitted by composing each clause into the transcribed multi-target term
      direction: different
      minimum_effect: >-
        the admissible answers are residual 1 (the clause composes) or a non-trivial residual in
        the user count n_u. DECLARED IN ADVANCE AS LARGELY FORCED: per the red-team screen the
        transcribed terms consume the aggregate, so a residual in n_u is the EXPECTED value and
        its appearance confirms a transcription rather than discovering a mis-scoping. Any third
        answer means the formalization is wrong, not that the world is complicated
    - metric: >-
        residual factor on the SALTED arm (NULL-1)
      direction: lower
      minimum_effect: >-
        strictly smaller than the ephemeral arm's residual by at least the salt factor
        2^-lensalt. Equality voids the run
    - metric: >-
        NULL-4 modality control: change in the residual, and change in the reported modality
        coordinate, under a modality-only restatement
      direction: different
      minimum_effect: >-
        residual change exactly 0 AND modality coordinate change non-zero. Either failing voids
        the D1/D2 comparison
    - metric: >-
        value of n_u at which the residual costs 1, 8, 32 and 62 bits at n_c = 2^8, per
        parameter set, in interval arithmetic, computed once per surviving reading
      direction: different
      minimum_effect: >-
        report all four crossings with intervals for each reading; if a residual is 1 the answer
        is 'no crossing exists', which is a complete answer
    - metric: >-
        number of differences between FrodoKEM and eFrodoKEM found in primary text beyond the
        salt (STAGE 5 cleanliness check)
      direction: different
      minimum_effect: >-
        report the count. The fetched I-D reading already indicates at least one (lenSE halved);
        more than one difference in a term the residual depends on means the pair is not a clean
        ablation and attribution to the salt is withdrawn
  minimal_test:
    design: >-
      PAPER-AND-ARITHMETIC, no simulation, executable in an afternoon once the transcription
      exists. (1) Write the three binder triples - I-D clause, security-considerations clause,
      bound term - from primary text, with the normalization rules declared BEFORE reading.
      (2) Run NULL-3, NULL-2 and NULL-4 first, in that order, and abort if any fails; NULL-2's
      expected outcome (residual 1) and NULL-4's expected outcome (residual unchanged, modality
      changed) are derived and frozen before they are run. (3) Emit the D1/D2 verdict. (4)
      Attempt the composition on the ephemeral arm for each surviving clause reading and emit
      the residual symbolically, alongside the pre-declared forced expectation so the two can be
      compared. (5) Run NULL-1, the salted arm, on the identical code path in the same
      invocation. (6) Only if NULL-1 and the ephemeral arm separate by at least the salt factor,
      evaluate the residual over a declared ladder of n_u at n_c = 2^8, per parameter set, in
      interval arithmetic, and report the four crossings per reading. THIS DISCRIMINATES because
      D1 and D2 are read off two texts this agent has already located, predict different
      deliverables from the same input, and can each come out; and because NULL-1 and NULL-4
      force the procedure to demonstrate it responds to the salt and not to the modality.
      Budget: minutes of compute; the cost is careful reading.
    controls:
      - NULL-1 salted arm, same invocation, same code path - the arm the ablation is about.
      - NULL-2 synthetic global-binder restatement of the same number; must return residual 1.
      - NULL-3 restriction on an unconsumed symbol; must return 'does not compose'.
      - >-
        NULL-4 modality-only restatement; residual must be bitwise unchanged and the modality
        coordinate must move.
      - >-
        n_u = 1 baseline embedding; the composed expression must reduce to the single-target
        statement under both clause readings.
      - >-
        Repaired inherited gate, reduction arm only, with the numeric target taken from the
        BATCH-001 transcription of the paper's own IND-CCA (ROM) figures and NOT from
        149.8 / 212.6 / 266.8.
      - >-
        Mutation control: perturb one exponent in the transcribed multi-target term and confirm
        the residual evaluation registers it.
      - >-
        STAGE 5 ablation-cleanliness check on lenSE, so a salt attribution is not carrying a
        second edit.
    required_metrics:
      - the three binder triples as transcribed, verbatim, with document, revision and location
      - the declared normalization rules, recorded before reading
      - the D1/D2 verdict with both normalized triples printed
      - the symbolic residual per clause reading for the ephemeral arm and for the salted arm
      - residual at n_u = 1 for every arm and reading (must be 1)
      - the pre-declared forced expectation alongside every emitted residual
      - bit-security movement versus n_u at n_c = 2^8 per parameter set, with intervals
      - the four crossing values of n_u per reading, or an explicit 'no crossing exists'
      - list of primary-text differences between the two variants, with locations
  falsification_conditions:
    - >-
      D1: the two clauses normalize to the same binder triple. The re-scoped claim is refuted,
      the delegation is faithful, there is one residual rather than two, and the record closes
      the cross-document question with a positive finding for the documents. This outcome is
      worth as much as the other and must not be downgraded in the write-up.
    - >-
      The composition type-checks with residual 1 on the ephemeral arm, contradicting the
      pre-declared forced expectation. Either the screen's quotations are wrong or the
      transcription differs from them; either way the discrepancy is the deliverable and the
      record stops until it is resolved against primary text.
    - >-
      NULL-1 returns a residual not separated from the ephemeral arm's by at least the salt
      factor: the procedure is reading its own formalization, not the ablation, and no
      ephemeral-arm number is reportable.
    - >-
      NULL-2 does not return residual 1: the procedure cannot recognize a correctly scoped
      restriction and every 'does not compose' verdict it emits is suspect.
    - >-
      NULL-3 returns a numeric residual for a symbol the term does not consume: the procedure
      composes anything with anything.
    - >-
      NULL-4 moves the residual, or fails to move the modality coordinate: the D1/D2 comparison
      is void because the instrument either mixes the deontic coordinate into the arithmetic or
      cannot see it at all.
    - >-
      The composed expression does not reduce to the transcribed single-target statement at
      n_u = 1: the formalization is wrong and nothing downstream is admissible.
    - >-
      A current draft revision harmonizes the two clauses, or the primary text states the
      ephemeral guarantee only in the single-target setting with an explicit multi-target
      disclaimer. Then the divergence is absent or the guarantee is ABSENT BY DECLARATION rather
      than mis-quantified - a different and cleaner finding, reported instead.
    - >-
      More than one substantive difference between the variants touches the residual, so the
      pair is not a clean ablation.
  confounders:
    - >-
      Transcription fidelity is everything here. A quantifier prefix or a modality recorded
      loosely produces a verdict that is an artifact of the transcriber. Two independent
      transcriptions of each clause are the mitigation, and disagreement between them is a
      result. This applies with extra force because both clause quotations currently in this
      record were returned by a fetching model rather than read from a full-text search.
    - >-
      NORMALIZATION IS WHERE D2 CAN BE MANUFACTURED. 'Expected count' versus 'actual count' and
      'MUST be used' versus 'must not be used' can be argued into or out of equivalence by
      choosing the normalization rules after seeing the clauses. The rules must be declared in
      writing before the clauses are formalized, and the record must report what a reasonable
      alternative normalization would have returned.
    - >-
      The lenSE change makes the ablation impure; STAGE 5 exists for it, and if it touches the
      residual no salt attribution is permitted.
    - >-
      The published bound may be stated for a generic transform with variables named differently
      from FrodoKEM's parameters, so 'the same symbol' is a cross-document mapping judgement
      that can be made wrongly in either direction.
    - >-
      Document boundary: the 2^8 clause lives in drafts, not in the paper that carries the
      theorem. A mismatch may reflect the DOCUMENT BOUNDARY rather than the mathematics - and if
      so, that boundary is itself the finding and must be reported as such rather than as a
      proof defect.
    - >-
      Publication drift: both drafts are live and a later revision can change or harmonize a
      clause. Every quoted triple carries a revision number and a retrieval timestamp.
    - >-
      The attractive answer (a residual in the user count) is now also the PRE-DECLARED EXPECTED
      answer, which removes its evidential value entirely. The forced-value derivation in the
      null block exists so that confirming it is never written up as a discovery.
  interpretation_limits:
    - >-
      A residual is a statement about composing two published statements. It is NOT an attack,
      NOT a break, NOT evidence that eFrodoKEM is insecure, and NOT a recommendation that any
      parameter or clause change. RQ-FRODO-a2dbe2.constraints[3] binds this record absolutely.
    - >-
      A divergence between two draft renderings of one number is a documentary observation about
      two Internet-Drafts at stated revisions. It is not a defect claim, and drafts are revised
      routinely.
    - >-
      No claim is made that any deployment reaches any user count. Reachability is
      IDEA-20260821-c05d5f's question and is deliberately not answered here.
    - >-
      The published multi-target attack is cited, not reproduced. This record charges no
      adversary and computes no attack cost.
    - >-
      Claim tier SPLIT: crypto tier for 'these statements, as transcribed, compose with residual
      R', because that is finite symbolic work over stated text; nothing above toy tier for any
      security reading.
    - >-
      Everything is scoped to the exact statements transcribed, the exact document revisions
      retrieved, and the exact parameter sets evaluated.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Triple sufficiency.) FOR ALL pairs (restriction, bound term) arising in this audit, the
        type-correctness of substituting the restriction into the term is determined by the
        quantifier prefixes alone, independently of the numeric values and coefficients; and the
        deontic modality, while not affecting type-correctness, is recoverable from the clause
        text uniquely enough that two readers assign the same value.
      rigorous_support: >-
        The rigorous fact the first half imitates is ordinary first-order substitution: a
        universally quantified hypothesis instantiates a variable only within its scope, and
        instantiating outside the scope requires an explicit sum or maximum over the free index.
        That much is a theorem of the logic. What is HEURISTIC is that the informal English of a
        standardization clause maps onto a first-order prefix at all, uniquely and without loss,
        and that the modality is unambiguous - security clauses are written for implementers,
        not for a proof assistant, and the two clauses at issue here condition on an EXPECTED
        quantity and an ACTUAL one respectively, which no RFC-2119 keyword distinguishes.
      validation_plan: >-
        Sample the mapping rather than assume it: take a declared set of at least 12 numeric
        usage clauses from FO-based KEM standardization documents already reachable (the two
        CFRG FrodoKEM drafts, the LAMPS profile, and the ML-KEM census's 24 rows, which are
        committed internal artifacts with clause text quoted), have the triple extracted
        independently twice, and report the DISAGREEMENT RATE separately for the prefix
        coordinate and for the modality coordinate. Predicted distribution: if the mapping is
        well defined, disagreements concentrate in clauses using SHOULD, a rate, or an
        expectation rather than a count - and should be near zero on clauses using an explicit
        count with a named scope and an RFC-2119 keyword. Tail check: the single most ambiguous
        clause in the sample must be exhibited with both readings and their different residuals,
        so the worst case is visible rather than averaged away. The two FrodoKEM clauses at
        issue are themselves a natural tail candidate and must be included. Transfer assumption
        stated: ML-KEM clause language is assumed representative of FrodoKEM clause language,
        and it may not be.
    - id: H2
      statement: >-
        (Monotone composition.) FOR EACH parameter set and FOR EACH evaluated range, the
        transcribed multi-target term is non-decreasing in the aggregate target count, so the
        residual, once emitted, is a valid upper-bound factor rather than a direction-free
        multiplier.
      rigorous_support: >-
        Terms of the shape (number of targets) x (probability per target) and terms of the shape
        q/|M| are monotone in the target and query counts by inspection; that is the rigorous
        half. The heuristic half is that EVERY term of the transcribed bound has one of those
        shapes, which cannot be known before the bound is read - and per the red-team screen the
        FrodoKEM bound additionally carries a Renyi-divergence factor exp(s*D_alpha)^(1-1/alpha)
        that is neither, so this assumption is at live risk and the term-by-term check below is
        not a formality.
      validation_plan: >-
        After transcription, check monotonicity term by term symbolically, and numerically at
        the endpoints and three interior points of every evaluated ladder, in interval
        arithmetic. Any factor that is not a monomial-like function of the counts - the
        divergence factor above being the named candidate - is reported explicitly, and if a
        non-monotone term exists the residual is downgraded from a bound to a described factor
        and said so in the headline. Record the sampled ladder and the precision.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and no algorithm is proposed. What is quantified is a
      PROOF-SIDE exponent: if the composition leaves a residual in the user count, that residual
      contributes log2 n_u bits of movement in the transcribed bound at n_c = 2^8, and the
      deliverable is that function together with the four crossings, computed once per surviving
      clause reading. If a reading composes cleanly the movement is identically zero for it. The
      record's own cost is symbolic manipulation plus a few hundred interval evaluations -
      seconds of single-core compute after the reading is done.
    memory_exponent: >-
      No attack memory exponent. Artifact storage is a table of residual evaluations, kilobytes.
    best_known: >-
      For the salted transform the incumbent is the Glabush-Hovelmanns-Stebila published tight
      multi-target ROM reduction and its quantitative statement that salting recovers 62 bits at
      the 128-bit level (abstract read; the theorem unread by this session). For the EPHEMERAL
      variant the red-team screen reports that FrodoKEM Section C.1.2 and eprint 2025/343
      Eq. (1) between them already state the multi-target degradation in terms of n_u and n_c,
      so the previous revision's claim that 'this session found no published multi-target
      statement at all' is WITHDRAWN as very likely wrong - it meant only 'none in the sources
      this session could open', and the screen indicates such statements exist.
    hidden_overhead: >-
      Hidden in the phrase 'as transcribed' is the entire fidelity of a human or model reading a
      standardization document, which no interval arithmetic downstream can repair. Hidden in
      'the same symbol' is a cross-document identification judgement. Hidden in the declared
      normalization is the ability to manufacture or dissolve the D1/D2 verdict at will, which
      is why the rules must be frozen in writing first. All three are disclosed as confounders
      rather than absorbed, and H1's two disagreement rates are the only quantitative handle.
    tradeoff_note: >-
      Not applicable: no search, no memory-bound computation, no parallelism. The relevant
      tradeoff is between formalization strictness and the number of clauses that can be
      audited, reported as the H1 disagreement rates versus sample size.
  dominated_by: >-
    n/a (no attack, cost or complexity result is claimed, so no Pareto row across time, memory
    and data/queries applies; 'null' would be a fabrication under AGENTS.md rule 5). Checked
    against the cost-bearing rows reachable this session: the Glabush-Hovelmanns-Stebila
    multi-target attack (feasible at circa 2^64 challenge ciphertexts; 62 bits recovered by
    salting) is the relevant published frontier row for the SALTED question and DOMINATES any
    attempt by this record to say something new about salted FrodoKEM's multi-target security -
    which is why the salted arm is used only as a control. ADDED AT REPAIR: on the
    ephemeral-variant composition question the previous revision recorded 'no frontier row
    located'; the red-team screen indicates that eprint 2025/343 Eq. (1) and eprint 2025/1861
    Section C.1.2 both state the multi-target degradation in n_u and n_c and therefore DOMINATE
    the aggregate-versus-per-key question outright. What remains undominated as far as this
    session could check is the cross-document clause comparison, which is documentary rather
    than cryptanalytic and has no frontier row of any kind.
  sota_delta: >-
    No attack; composition-audit contribution only, and smaller after repair than originally
    stated. Repository-relative, measured: the repository contains ZERO records mentioning
    eFrodoKEM (2 grep matches repo-wide, both in the lane's own RQ and GOAL framing records),
    zero transcribed binder prefixes, and no filed entry for either the multi-target KEM
    analysis or the FrodoKEM paper. The delta is therefore the first treatment of the
    FrodoKEM/eFrodoKEM pair as an ablation in this program and the first residual computation.
    Externally the delta is now confined to the cross-document clause comparison: the
    aggregate-versus-per-key question is, per the red-team screen, settled in two primary texts,
    and this record no longer claims it. The two clauses this agent read - a variant-SELECTION
    MUST conditioned on an EXPECTED count, and a usage MUST NOT on an ACTUAL count, the second
    attributed to the document that states the first - are, as far as this session could check,
    not compared anywhere in the corpus or in the retrieved literature.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: medium
