      salt'; 'draft-longa-cfrg-frodokem status 2026 FrodoKEM ISO standardization deployment
      TLS'. ACQUISITION FAILURES, recorded as such and NOT as evidence:
      https://eprint.iacr.org/2025/1861.pdf and
      https://d1kjwivbowugqa.cloudfront.net/files/research/papers/EPRINT-GlaHovSte25.pdf both
      returned unreadable compressed-stream extractions, so THIS SESSION HAS NOT READ EITHER
