    results: >-
      Inside the repository the eFrodoKEM object is entirely untouched (2 matches, both in the
      lane's own framing records). Of the eight existing lane proposals, IDEA-20260816-32c366
      is the only one about salting, and it is a SIMULATION at toy digest widths of 20-32 bits
      that explicitly disclaims any statement about FrodoKEM's salt, about reachability, and
      about what the 2025 revision does - it was written in a session with no external
      literature access. IDEA-20260816-9bec34 proposes a quantifier-order LINTER for reduction
      statements, calibrated on deliberately mis-ordered statements; that is a general tool,
      and this record is a specific question the tool would be the natural instrument for -
      the relationship is instrument-to-target, not duplicate-to-duplicate, and the record
      names 9bec34 as the preferred implementation route. IDEA-20260816-d270bc's dominant-term
      label field supplies which term to compose against. Outside the repository the situation
      changed materially this session: Glabush-Hövelmanns-Stebila (IACR CiC 3(1), 4 May 2026)
      state in their abstract that attacks on standards-track FO KEMs with 128-bit message
      spaces (naming FrodoKEM-640) 'become feasible if the adversary is given many challenge
      ciphertexts (say, 2^64)', that salting recovers 62 bits at the 128-bit level, and -
      decisively for this record - that before their work 'there has been no proof showing
      that salting provides multi-ciphertext security'. So the salted arm's guarantee is
      recent and published; the ephemeral arm DELETES the salt and replaces it with a per-key
