  assumptions:
    - >-
      Both statements - the salted multi-target bound and whatever statement covers the
      ephemeral variant - are transcribed from primary text with quantifier order recorded,
      before this record is executed.
    - >-
      The FrodoKEM/eFrodoKEM pair really is a salt ablation with the rest held fixed. The
      seedSE length also changes, which STAGE 5 exists to detect; if further differences
      appear the pair is not a clean ablation and no attribution to the salt is permitted.
    - >-
      The dominant multi-target term is monotone in the composed variable over the evaluated
      range, so a residual is a bound rather than a direction-free factor.
    - >-
      The published figures quoted identically for FrodoKEM and eFrodoKEM are taken as printed
      and are not re-derived here; explaining WHY two different security statements carry the
      same figure is a question this record raises and hands to the baseline-reproduction gate,
      not one it answers.
    - >-
      Nothing here re-estimates LWE hardness or the decryption failure rate; both enter as
      given symbols (GOAL-FRODO-002.non_duplication).
  proof_search_map:
    bottleneck: >-
      The composition step in which a deployment-level usage restriction is used to instantiate
      a variable of a security bound. Removing the mismatch at that step - either by showing
      there is none, or by naming the residual - changes what the eFrodoKEM guarantee says,
      and it is the only step in the chain where a document written for implementers meets a
      quantifier written for a theorem.
    baseline_embedding:
      parameter_slice: >-
        U = 1. At a single public key the two explanations E1 and E2 coincide exactly and the
        residual must be 1 under both. That is the old-method boundary: the single-target
        statement everyone agrees on. Any formalization that does not return residual 1 at
        U = 1 is wrong before it is applied.
      reproduction_check: >-
        Symbolic: evaluate the composed expression at U = 1 and check it reduces to the
        transcribed single-target statement term for term, as a frozen fixture. Plus the
        inherited numeric gate: reproduce 149.8 / 212.6 / 266.8 at the published inputs.
    observation_collision:
      observable: >-
        The residual factor emitted by STAGE 2.
      distinct_preimage_search: >-
        Search for two DIFFERENT restriction/bound pairs with the same residual but opposite
        security readings - the obvious candidate pair being (per-key cap, aggregate-consuming
        term) and (global cap, aggregate-consuming term with an extra per-key factor already
        inside it). If both emit factor U, the residual is not identifying and must be reported
        together with the prefix pair that produced it, never alone. This is a live risk and is
        why NULL-3 exists.
    constructive_transforms:
      - transform: stronger_invariant
        proposed_object: >-
          Track the full quantifier PREFIX rather than the final scalar bound - i.e. preserve
          more state than the conclusion needs, because the prefix is what survives composition
          across documents while the scalar does not.
        predicted_gain: >-
          Makes the composition step decidable mechanically instead of by reading comprehension,
          and makes a mis-scoped restriction visible as a type error rather than as a subtle
          numeric discrepancy. No exponent is claimed.
      - transform: representation_reduction
        proposed_object: >-
          Move both statements into a model where the hypothesis is an exact condition -
          prefix containment - rather than an inequality between numbers.
        predicted_gain: >-
          Encoding, completeness and soundness obligations become separable and each can fail
          visibly; the cost-loss obligation is the residual itself.
    quantifier_order: >-
      Written out, the two candidate readings are:
      E2 (per key): FORALL public keys pk, FORALL adversaries A, [ C_pk <= 2^8 ] IMPLIES
      Adv(A, pk) <= f(C_pk, ...).
      E1 (aggregate): FORALL adversaries A, FORALL families {pk_u}_{u in [U]},
      Adv(A, {pk_u}) <= f(sum_u C_u, ...).
      The eFrodoKEM restriction as retrieved is quantified as in E2 - 'a single public key'.
      The audit is whether the bound it is meant to satisfy is stated as in E2 or as in E1.
      The witness-dependence question is explicit: in E1 the adversary's success may depend on
      the whole family, and a per-key hypothesis does not constrain a family-dependent witness.
    method_ceiling:
      strongest_certifiable_claim: >-
        'As transcribed, the published usage restriction binds symbol X under prefix P, the
        published bound consumes symbol Y under prefix Q, and composing them requires the
        operator R.' That is all. The method can NEVER certify that an adversary exists, that
        any U is reachable, that eFrodoKEM is broken, or that 2^8 should be a different number.
        It also cannot certify that the primary text does not settle the composition elsewhere
        in prose the transcription missed.
      nearby_object_control: >-
        SALTED FrodoKEM, where the published claim is TIGHT multi-target security - the closest
        object on which the hoped-for conclusion must FAIL. If the method reports the same
        residual on the salted arm, it has not identified the load-bearing structure and its
        ephemeral-arm output means nothing. This is NULL-1, and it is both the nearby-object
        control and the ablation comparator.
    proof_obligations:
      - claim: Both statements are transcribed with quantifier prefixes as printed.
        responsibility: interface
      - claim: The composition reduces to the single-target statement at U = 1.
        responsibility: baseline
      - claim: The residual is a valid bound, i.e. the composed term is monotone in the composed variable over the evaluated range.
        responsibility: correctness
      - claim: The salted arm returns a different residual from the ephemeral arm.
        responsibility: strictness
      - claim: The bit-security movement as a function of U is computed in exact or interval arithmetic.
        responsibility: correctness
      - claim: No statement about attacker reachability of any U is made anywhere in the deliverable.
        responsibility: scope
  predictions:
    - metric: >-
        residual factor emitted by the composition of the eFrodoKEM per-key restriction into
        the transcribed unsalted multi-target term
      direction: different
      minimum_effect: >-
        the two admissible answers are 'residual 1' (E2, the restriction composes) and 'a
        non-trivial residual in U' (E1, it does not). Any third answer means the formalization
        is wrong, not that the world is complicated.
    - metric: >-
        residual factor on the SALTED arm (NULL-1)
      direction: lower
      minimum_effect: >-
        strictly smaller than the ephemeral arm's residual, or suppressed by the
        salt-collision factor. Equality voids the run.
    - metric: >-
        value of U at which the residual costs 1, 8, 32 and 62 bits at C = 2^8, per parameter
        set, in interval arithmetic
      direction: different
      minimum_effect: >-
        report all four crossings with intervals; if the residual is 1 the answer is 'no
        crossing exists', which is a complete answer
    - metric: >-
        number of differences between FrodoKEM and eFrodoKEM found in primary text beyond the
        salt (STAGE 5 cleanliness check)
      direction: different
      minimum_effect: >-
        report the count; more than one difference in a term the residual depends on means the
        pair is not a clean ablation and attribution to the salt is withdrawn
    - metric: >-
        whether the published bit figures for FrodoKEM-N and eFrodoKEM-N differ at all in
        primary text
      direction: different
      minimum_effect: >-
        the retrieved CFRG rendering quotes them as identical for '(e)FrodoKEM-N'. If primary
        text confirms identity, that is a fact requiring an explanation and it is reported as
        an open question, not as a defect
  minimal_test:
    design: >-
      PAPER-AND-ARITHMETIC, no simulation, executable in an afternoon once the transcription
      exists. (1) Write the two binder prefixes from the transcription. (2) Run NULL-3 and
      NULL-2 first, in that order, and abort if either fails - NULL-2 is the sensitivity
      demonstration and its expected outcome (residual 1) is derived and frozen before it is
      run. (3) Attempt the composition on the ephemeral arm and emit the residual
      symbolically. (4) Run NULL-1, the salted arm, on the identical code path in the same
      invocation. (5) Only if NULL-1 and the ephemeral arm DIFFER, evaluate the residual over
      a declared ladder of U at C = 2^8, per parameter set, in interval arithmetic, and report
      the four crossings. THIS DISCRIMINATES because E1 and E2 predict different residuals
      from the same input and the difference is a symbolic fact readable off the transcribed
      bound, not a statistical one; and because NULL-1 forces the procedure to demonstrate it
      responds to the salt rather than to the shape of the formalization. Budget: minutes of
      compute; the cost is careful reading.
    controls:
      - NULL-1 salted arm, same invocation, same code path - the arm the ablation is about.
      - NULL-2 synthetic global-binder restatement of the same number; must return residual 1.
      - NULL-3 restriction on an unconsumed symbol; must return 'does not compose'.
      - U = 1 baseline embedding; the composed expression must reduce to the single-target statement.
      - Inherited gating baseline reproduction of the three published bit figures.
      - >-
        Mutation control: perturb one exponent in the transcribed multi-target term and confirm
        the residual evaluation registers it.
      - >-
        STAGE 5 ablation-cleanliness check on seedSE length, so a salt attribution is not
        carrying a second edit.
    required_metrics:
      - the two binder prefixes as transcribed, verbatim, with the primary-text location
      - the symbolic residual for the ephemeral arm and for the salted arm
      - residual at U = 1 for both arms (must be 1)
      - bit-security movement versus U at C = 2^8 per parameter set, with intervals
      - the four crossing values of U, or an explicit 'no crossing exists'
      - list of primary-text differences between the two variants, with locations
  falsification_conditions:
    - >-
      The composition type-checks with residual 1 on the ephemeral arm. The claim is refuted:
      the per-key cap binds exactly the variable the bound consumes, eFrodoKEM's restriction is
      correctly quantified, and the record closes the question with a positive finding for
      FrodoKEM. This outcome is worth as much as the other and must not be downgraded in the
      write-up.
    - >-
      NULL-1 returns the same residual on the salted arm: the procedure is reading its own
      formalization, not the ablation, and no ephemeral-arm number is reportable.
    - >-
      NULL-2 does not return residual 1: the procedure cannot recognize a correctly scoped
      restriction and every 'does not compose' verdict it emits is suspect.
    - >-
      NULL-3 returns a numeric residual for a symbol the term does not consume: the procedure
      composes anything with anything.
    - >-
      The composed expression does not reduce to the transcribed single-target statement at
      U = 1: the formalization is wrong and nothing downstream is admissible.
    - >-
      The primary text turns out to state the ephemeral guarantee only in the single-target
      setting, with an explicit disclaimer about multi-target usage. Then there is no
      mis-scoping and no residual: the guarantee is ABSENT BY DECLARATION rather than
      mis-quantified, which is a different and cleaner finding, and the record reports that
      instead.
    - >-
      More than one substantive difference between the variants touches the residual, so the
      pair is not a clean ablation.
  confounders:
    - >-
      Transcription fidelity is everything here. A quantifier prefix recorded loosely produces
      a residual that is an artifact of the transcriber. Two independent transcriptions of the
      same statement are the mitigation, and disagreement between them is a result.
    - >-
      The seedSE length change makes the ablation impure; STAGE 5 exists for it, and if it
      touches the residual no salt attribution is permitted.
    - >-
      The published bound may be stated for a generic transform with variables named
      differently from FrodoKEM's parameters, so 'the same symbol' is a mapping judgement that
      can be made wrongly in either direction.
    - >-
      The 2^8 clause lives in a security-considerations draft, not necessarily in the
      specification that carries the theorem. Composing a clause from document A with a
      theorem from document B can produce a mismatch that reflects the DOCUMENT BOUNDARY
      rather than the mathematics - and if so, that boundary is itself the finding and must be
      reported as such rather than as a proof defect.
    - >-
      Publication drift: both drafts are live and a later revision can change the clause.
      Every quoted prefix carries a retrieval timestamp.
    - >-
      The attractive answer (E1, a residual in U) is also the answer a careless formalization
      produces by default, because 'per key' is syntactically inner. NULL-2 is the specific
      guard against that and must be run first.
  interpretation_limits:
    - >-
      A residual is a statement about composing two published statements. It is NOT an attack,
      NOT a break, NOT evidence that eFrodoKEM is insecure, and NOT a recommendation that any
      parameter or clause change. RQ-FRODO-a2dbe2.constraints[3] binds this record absolutely.
    - >-
      No claim is made that any deployment reaches any value of U. Reachability is
      IDEA-20260821-c05d5f's question and is deliberately not answered here.
    - >-
      The published multi-target attack is cited, not reproduced. This record charges no
      adversary and computes no attack cost.
    - >-
      Claim tier SPLIT: crypto tier for 'these two statements, as transcribed, compose with
      residual R', because that is finite symbolic work over stated text; nothing above toy
      tier for any security reading.
    - >-
      Everything is scoped to the exact statements transcribed, the exact document revisions
      retrieved, and the exact parameter sets evaluated.
  heuristic_assumptions:
    - id: H1
      statement: >-
        (Prefix sufficiency.) FOR ALL pairs (restriction, bound term) arising in this audit,
        the type-correctness of substituting the restriction into the term is determined by
        the quantifier prefixes alone, independently of the numeric values and coefficients.
      rigorous_support: >-
        The rigorous fact it imitates is ordinary first-order substitution: a universally
        quantified hypothesis instantiates a variable only within its scope, and instantiating
        outside the scope requires an explicit sum or maximum over the free index. That much
        is a theorem of the logic. What is HEURISTIC is that the informal English of a
        standardization clause maps onto a first-order prefix at all, uniquely and without
        loss - security clauses are written for implementers, not for a proof assistant.
      validation_plan: >-
        Sample the mapping rather than assume it: take a declared set of at least 12 numeric
        usage clauses from FO-based KEM standardization documents already reachable (the CFRG
        FrodoKEM drafts, the LAMPS profile, and the ML-KEM census's 24 rows, which are already
        committed internal artifacts with their clause text quoted), have the prefix extracted
        independently twice, and report the DISAGREEMENT RATE. Predicted distribution: if the
        mapping is well defined, disagreements should be concentrated in clauses using SHOULD
        or a rate rather than a count - the P3/P4 classes of IDEA-20260821-c05d5f - and should
        be near zero on clauses using an explicit count with a named scope. Tail check: the
        single most ambiguous clause in the sample must be exhibited, with both readings and
        their different residuals, so the worst case is visible rather than averaged away.
        Transfer assumption stated: ML-KEM clause language is assumed representative of
        FrodoKEM clause language, and it may not be.
    - id: H2
      statement: >-
        (Monotone composition.) FOR EACH parameter set and FOR EACH evaluated range, the
        transcribed multi-target term is non-decreasing in the aggregate target count, so the
        residual, once emitted, is a valid upper-bound factor rather than a direction-free
        multiplier.
      rigorous_support: >-
        Terms of the shape (number of targets) x (probability per target) and terms of the
        shape q/|M| are monotone in the target and query counts by inspection; that is the
        rigorous half. The heuristic half is that EVERY term of the transcribed bound has one
        of those shapes, which cannot be known before the bound is read.
      validation_plan: >-
        After transcription, check monotonicity term by term symbolically, and numerically at
        the endpoints and three interior points of every evaluated ladder, in interval
        arithmetic. Report any non-monotone term explicitly and, if one exists, downgrade the
        residual from a bound to a described factor and say so in the headline. Record the
        sampled ladder and precision.
  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED and no algorithm is proposed. What is quantified is a
      PROOF-SIDE exponent: if the answer is E1, the residual contributes log2 U bits of
      movement in the transcribed bound at C = 2^8, and the deliverable is that function
      together with the four crossings. If the answer is E2 the movement is identically zero.
      The record's own cost is symbolic manipulation plus a few hundred interval evaluations -
      seconds of single-core compute after the reading is done.
    memory_exponent: >-
      No attack memory exponent. Artifact storage is a table of residual evaluations, kilobytes.
    best_known: >-
      For the salted transform the incumbent is Glabush-Hövelmanns-Stebila's published tight
      multi-target ROM reduction and its quantitative statement that salting recovers 62 bits
      at the 128-bit level (abstract read; the theorem is unread by this session). For the
      EPHEMERAL variant this session found no published multi-target statement at all, which
      is exactly the gap the record targets - and 'found none' here means 'none in the sources
      this session could open', not 'none exists'.
    hidden_overhead: >-
      Hidden in the phrase 'as transcribed' is the entire fidelity of a human or model reading
      a standardization document, which no interval arithmetic downstream can repair. Hidden in
      'the same symbol' is a cross-document identification judgement. Both are disclosed as
      confounders rather than absorbed, and H1's disagreement-rate measurement is the only
      quantitative handle on either.
    tradeoff_note: >-
      Not applicable: no search, no memory-bound computation, no parallelism. The relevant
      tradeoff is between formalization strictness and the number of clauses that can be
      audited, and it is reported as the H1 disagreement rate versus sample size.
  dominated_by: >-
    n/a (no attack, cost or complexity result is claimed, so no Pareto row across time, memory
    and data/queries applies; 'null' would be a fabrication under AGENTS.md rule 5). Checked
    against the cost-bearing rows reachable this session: the Glabush-Hövelmanns-Stebila
    multi-target attack (feasible at circa 2^64 challenge ciphertexts; 62 bits recovered by
    salting) is the relevant published frontier row for the SALTED question and it DOMINATES
    any attempt by this record to say something new about salted FrodoKEM's multi-target
    security - which is why the salted arm is used only as a control and never as a
    contribution. On the ephemeral-variant composition question this session located no
    frontier row to compare against.
  sota_delta: >-
    No attack; composition-audit contribution only. Quantitatively: the repository contains
    ZERO records mentioning eFrodoKEM (measured: 2 grep matches repo-wide, both in the lane's
    own RQ and GOAL framing records), zero transcribed binder prefixes, and no filed entry for
    the published multi-target KEM analysis. The delta is therefore the first treatment of the
    FrodoKEM/eFrodoKEM pair as an ablation and the first residual computation, against an
    external baseline in which the salted case is already settled and the ephemeral case was
    not located.
  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high
  honest_prior_of_survival: >-
    By part. (i) That the transcription records quantifier prefixes precisely enough to
    compose: 0.6 - this is the single most fragile input and BATCH-001 has not run.
    (ii) That NULL-1, NULL-2 and NULL-3 all pass and the instrument is admissible: 0.7.
    (iii) That the ephemeral arm's residual is non-trivial (E1 rather than E2): 0.45. I
    deliberately put this below even odds. The FO message-space search is a per-public-key
    predicate at the encryption step, so the pooling gain across users is not free, and the
    authors who wrote both the SFO paper and the FrodoKEM specification are the same people
    who would have thought about exactly this. The honest expectation is that the primary text
    settles it.
    (iv) That, whichever way it goes, the record produces a defensible symbolic statement plus
    the U-ladder or an explicit 'no crossing exists': 0.85.
    (v) That the finding, if E1, survives independent Validator and Red Team review as a
    statement about a proof and is not overread as a security claim by anyone downstream: 0.6,
    and this is the risk the interpretation_limits block exists to manage.
