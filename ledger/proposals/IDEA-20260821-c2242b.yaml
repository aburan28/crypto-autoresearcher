idea:
  id: IDEA-20260821-c2242b
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    THE 2^8 CLAUSE EXISTS TWICE, IN TWO NORMATIVE SHAPES, AND ONE DOCUMENT ATTRIBUTES TO THE
    OTHER A SENTENCE IT DOES NOT CONTAIN (re-scoped after red-team refutation of the original
    E1/E2 discriminator): the FrodoKEM I-D states a variant-SELECTION rule conditioned on an
    EXPECTED per-key ciphertext count, the CFRG security-considerations draft states a usage
    PROHIBITION on the ACTUAL per-key count and cites the I-D for it - so audit which
    (symbol, quantifier prefix, modality) triple each clause really binds, and compose each
    against a multi-target bound whose dominant term is reported to consume the AGGREGATE
    user-times-ciphertext count.
  class: control
  claim: >-
    (A) THE PAIR, RETAINED. FrodoKEM and eFrodoKEM share one PKE, one FO skeleton and one
    parameter table, and differ by two edits: the ephemeral variant DISCARDS THE SALT and adds a
    numeric usage restriction. A fetched rendering of draft-longa-cfrg-frodokem-01 reports
    lensalt = 0 for all three ephemeral parameter sets against 256/384/512 for the standard
    sets, and lenSE halved (128/192/256 against 256/384/512). That is a matched ablation with
    the confounders held fixed by construction, published by the same authors in one document
    family, and this lane has not used it.
    (B) THE OBJECT, SHARPENED. The tracked object is the BINDER TRIPLE of a numeric restriction:
    (symbol bounded, quantifier prefix, deontic modality), tracked alongside the same triple for
    every variable the bound's dominant multi-target term consumes. The modality is added at
    repair and is load-bearing, because the two published renderings of the same number differ
    in it.
    (C) WITHDRAWN AS THE HEADLINE DISCRIMINATOR. The original claim asked which of two
    explanations the published bound instantiates - E1, the dominant multi-target term consumes
    an AGGREGATE target count, or E2, it consumes a per-key count - and asserted that nobody in
    this program knew. An independent red-team screen reports that both primary texts settle it:
    Glabush-Hovelmanns-Stebila (eprint 2025/343, NOT eprint 2025/1861, which the original record
    named in error) Eq. (1) and Eq. (2) are quoted as carrying n_u * n_c and n_u * n_c^2 terms,
    and FrodoKEM Section C.1.2 is quoted as carrying n_c*(n_c-1)*n_u/(|M| * 2^lensalt) with
    delta(n_u) <= delta(1)*n_u. If those quotations hold, the answer is E1 with residual n_u,
    against this record's own stated prior of 0.45, and E1/E2 is a TRANSCRIPTION CHECK with a
    pre-declared expected value, not a discriminator. It is demoted accordingly and its expected
    value is written down before the run so it can never be reported as a discovery.
    (D) THE REPLACEMENT CLAIM, VERIFIED IN PART BY THIS AGENT AND FALSIFIABLE IN BOTH
    DIRECTIONS. Two retrieved documents state the same number 2^8 with different binder triples.
    draft-longa-cfrg-frodokem-01 (fetched and read 2026-08-24) states a variant-SELECTION rule:
    "the use of standard FrodoKEM is recommended for applications in which the number of
    ciphertexts produced for a single public key is expected to be equal or greater than 2^8.
    Ephemeral FrodoKEM MUST be used for applications in which that same figure is expected to be
    smaller than 2^8." draft-longa-cfrg-frodokem-security-considerations-00 Section 1.1 (fetched
    and read 2026-08-24) states a usage PROHIBITION and attributes it to the first document:
    "As stated in [I-D.FrodoKEM], ephemeral FrodoKEM must not be used in applications in which a
    single public key may produce 2^8 ciphertexts or more." These are not the same statement.
    The first conditions on an EXPECTED figure and constrains WHICH VARIANT to deploy; the
    second constrains what a deployed key MAY PRODUCE. A deployment whose actual count exceeds
    its expectation violates the second and not the first. THE CLAIM UNDER TEST, with two
    mutually exclusive answers: D1, FAITHFUL - the two clauses reduce to the same
    (symbol, prefix, modality) triple under a declared normalization, the delegation is
    faithful, and there is exactly one residual to compute; D2, DIVERGENT - they do not, the
    delegation misattributes, and the residual a deployer inherits depends on which document
    they read. Both answers are readable off the two texts plus the transcribed bound, and both
    are reportable.
    (E) WHAT IS NOT CLAIMED. No attack, no break, no assertion that eFrodoKEM is insecure, no
    assertion that 2^8 is the wrong number, no assertion that any deployment reaches any user
    count, and no assertion that either draft is defective as a standards document - drafts are
    drafts and prose is normalized by editors. If the answer is D2 the deliverable is a
    documentary divergence plus the residual each reading implies, which is a statement about
    two documents and a proof, never about an attacker
    (RQ-FRODO-a2dbe2.constraints[3]). If the answer is D1 the deliverable is a clean negative
    that closes the question, and that outcome is worth the same as the other.
  mechanism: >-
    STAGE 0 (GATE, inherited and REPAIRED): requires the GOAL-FRODO-002 BATCH-001 transcription
    of BOTH statements - the salted FrodoKEM multi-target bound and whatever statement covers
    the ephemeral variant - with quantifier order recorded. The inherited numeric gate is
    repaired in this revision; see baseline_embedding. STAGE 1, FORMALIZE THE THREE SIDES AS
    BINDER TRIPLES. Write each numeric restriction as (symbol bounded, quantifier prefix, deontic
    modality) - once for the I-D clause, once for the security-considerations clause - and each
    bound term as (symbols consumed, quantifier prefix). The triples are the object; the values
    are set aside. Record for each clause whether it conditions on an EXPECTED quantity or on an
    ACTUAL one, because that distinction is what separates D1 from D2. STAGE 2, ATTEMPT THE
    COMPOSITION MECHANICALLY, TWICE - once per clause. Substituting a restriction into a bound
    is type-correct iff the restriction's prefix is at least as outer as the consumed variable's
    prefix. If it is strictly inner, the substitution requires an intervening summation or
    maximization, and THAT MISSING OPERATOR IS THE RESIDUAL - not an error term but a named
    function of the variables the restriction does not bind. Emit it symbolically for each
    clause and compare the two. STAGE 3, EVALUATE THE RESIDUAL(S). With each residual named,
    compute the bit-security movement as a function of the user count n_u at n_c = 2^8, per
    parameter set, in exact or interval arithmetic, and report the n_u at which the movement
    reaches 1, 8, 32 and 62 bits - 62 because it is the published figure for what salting
    recovers at the 128-bit level, so the ladder is anchored to a published quantity rather than
    a round number this program picked. STAGE 4, THE ABLATION READ. Run the identical STAGE 1-3
    procedure on SALTED FrodoKEM, where the published claim is TIGHT multi-target security. The
    salted arm must return residual 1 or a residual suppressed by 2^-lensalt; if it returns the
    same residual as the ephemeral arm, the procedure is detecting its own formalization and not
    the ablation, and no ephemeral-arm result is reportable. STAGE 5, DIRECTION CHECK. eFrodoKEM
    also halves lenSE. If the residual moves when only the salt is deleted and does not move
    when only the seed length changes, the ablation isolates the salt; if both move it, the pair
    is not a clean ablation and the record must say so and stop attributing.
  novelty_status: unverified
  novelty_screen:
    method: >-
      ORIGINAL SCREEN (2026-08-21). THE crypto-kb MCP RETRIEVAL INDEX WAS UNAVAILABLE
      (in-memory Qdrant, answers nothing), so no `kb` provenance appears. Instrument: Grep tool
      (ripgrep), the pre-extracted lane inventory, WebSearch/WebFetch.
      Grep 'eFrodoKEM|ephemeral variant' over the repository root -> 2 files, BOTH the lane's
      own RQ-FRODO-a2dbe2.yaml and GOAL-FRODO-002.yaml. NO PROPOSAL, HYPOTHESIS, EXPERIMENT,
      EVIDENCE OR KNOWLEDGE RECORD IN THIS REPOSITORY MENTIONS eFrodoKEM AT ALL. That single
      count is the load-bearing novelty fact for this record.
      Grep 'FrodoKEM|Frodo-640|eFrodoKEM' in knowledge/ -> 7 files, none stating a FrodoKEM
