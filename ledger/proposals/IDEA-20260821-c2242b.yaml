idea:
  id: IDEA-20260821-c2242b
  question_id: RQ-FRODO-a2dbe2
  added: '2026-08-21'
  title: >-
    eFrodoKEM is FrodoKEM with the salt DELETED and a numeric usage cap ADDED, i.e. a matched
    ablation pair the standard itself ships - so use it as one: check whether the cap's binder
    ('a single public key may produce 2^8 ciphertexts or more') quantifies the same variable
    the unsalted multi-target bound consumes, or a strictly smaller one, and report the
    residual factor that composition leaves behind.
  class: control
  claim: >-
    (A) THE PAIR. FrodoKEM and eFrodoKEM share one PKE, one FO skeleton and one parameter
    table. They differ in exactly two edits: the ephemeral variant DISCARDS THE SALT, and it
    adds a numeric usage restriction. That is a matched ablation with the confounders held
    fixed by construction, published by the same authors in the same document - the rarest
    kind of control, and this lane has not used it. (B) THE OBJECT. The tracked object is the
    BINDER SCOPE of a numeric restriction: not the number, but the quantifier prefix the
    number sits under, paired with the quantifier prefix of the variable the bound's dominant
    multi-target term consumes. (C) THE CLAIM, FALSIFIABLE IN BOTH DIRECTIONS. The retrieved
    eFrodoKEM restriction is quantified PER PUBLIC KEY (verbatim: 'ephemeral FrodoKEM must
    not be used in applications in which a single public key may produce 2^8 ciphertexts or
    more'). The published multi-target attack that motivates salting is parameterized by the
    number of CHALLENGE CIPHERTEXTS the adversary is given across one or many public keys
    (Glabush-Hövelmanns-Stebila: feasible at circa 2^64). The claim under test is a
    composition question with two mutually exclusive answers. E1, AGGREGATE: the unsalted
    bound's dominant multi-target term is a function of the total target count T = sum over
    users of C_u, because the FO derandomization makes the precomputed hash G(m)
    public-key-independent and one table amortizes over all targets; then a per-key cap of
    2^8 does NOT cap T, the composition leaves a residual factor U (the number of public
    keys), and the restriction is quantified in a strictly smaller place than the bound
    consumes. E2, PER KEY: the checkable predicate Enc(pk, m; G(m)) = c* must be recomputed
    per public key, so the pooling gain across users is charged and the dominant term is a
    function of C alone; then the per-key cap is quantified exactly where the bound consumes
    it, the composition type-checks with residual 1, and eFrodoKEM's restriction is correctly
    placed. THE POINT IS THAT NOBODY IN THIS PROGRAM KNOWS WHICH, and the answer is READ OFF
    THE PUBLISHED BOUND rather than argued. (D) WHAT IS NOT CLAIMED. No attack, no break, no
    assertion that eFrodoKEM is insecure, no assertion that 2^8 is the wrong number, and no
    claim that any deployment reaches any U. If the answer is E1 the deliverable is a
    RESIDUAL FACTOR and the value of U at which the residual costs a stated number of bits -
    a statement about a proof's composition, never about an attacker
    (RQ-FRODO-a2dbe2.constraints[3]). If the answer is E2 the deliverable is a clean negative
    that closes the question, and that outcome is worth the same as the other.
  mechanism: >-
    STAGE 0 (GATE, inherited): requires the GOAL-FRODO-002 BATCH-001 transcription of BOTH
    statements - the salted FrodoKEM multi-target bound and whatever statement covers the
    ephemeral variant - with quantifier order recorded, which is the one thing BATCH-001 is
    explicitly chartered to record. STAGE 1, FORMALIZE THE TWO SIDES AS BINDER PREFIXES.
    Write each numeric restriction as (symbol bounded, quantifier prefix, value) and each
    bound term as (symbols consumed, quantifier prefix). The prefixes are the object; the
    values are set aside. STAGE 2, ATTEMPT THE COMPOSITION MECHANICALLY. Substituting a
    restriction into a bound is type-correct iff the restriction's prefix is at least as
    outer as the consumed variable's prefix. If it is strictly inner, the substitution
    requires an intervening summation or maximization, and THAT MISSING OPERATOR IS THE
    RESIDUAL - it is not an error term, it is a named function of the variables the
    restriction does not bind. Emit it symbolically. STAGE 3, EVALUATE THE RESIDUAL. With the
    residual named, compute the bit-security movement as a function of U at C = 2^8, per
    parameter set, in exact or interval arithmetic, and report the U at which the movement
    reaches 1, 8, 32 and 62 bits - 62 chosen because it is the published figure for what
    salting recovers at the 128-bit level, so the ladder is anchored to a published quantity
    rather than to a round number this program picked. STAGE 4, THE ABLATION READ. Run the
    identical STAGE 1-3 procedure on SALTED FrodoKEM, where the published claim is TIGHT
    multi-target security. The salted arm must return residual 1 (or a residual suppressed by
    2^{-len_salt}); if it returns the same residual as the ephemeral arm, the procedure is
    detecting its own formalization and not the ablation, and no ephemeral-arm result is
    reportable. STAGE 5, DIRECTION CHECK. eFrodoKEM also shortens seedSE to len_sec. If the
    residual moves when only the salt is deleted and does not move when only the seed length
    changes, the ablation is isolating the salt; if both move it, the pair is not a clean
    ablation and the record must say so and stop attributing.
  novelty_status: unverified
  novelty_screen:
