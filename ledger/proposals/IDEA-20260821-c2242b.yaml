      consumes.
    verdict: >-
      ADAPTATION. The multi-target weakness of unsalted FO at 128-bit message spaces is
      PUBLISHED and is cited, not rediscovered; the salted fix is published; the eFrodoKEM
      2^8 restriction is published. What this record contributes is the COMPOSITION AUDIT
      between two published statements that were not written to be composed - a per-key
      usage clause and a bound whose consumed variable may be an aggregate - together with
      the observation that the FrodoKEM/eFrodoKEM pair is a matched ablation of the salt
      shipped inside one standard. It is entirely possible that the primary text already
      settles this in one sentence this session could not read, in which case the honest
      outcome is 'already answered upstream', and the record says so in advance rather than
      claiming novelty it cannot check.
      LABEL FORCED TO `unverified` BY RULE, NOT BY DOUBT: this record rests on citation(s) marked
      provenance `recalled`, and AGENTS.md rule 9 -- enforced by tools/validate_ledger.py
      check_citations -- requires novelty_status `unverified` until such a source is actually read.
      The crypto-kb retrieval index answers nothing this session (in-memory Qdrant), so no record in
      this batch may assert a checked literature negative. The substantive assessment above is
      unchanged.
  object_first_candidate:
    tracked_object: >-
      The BINDER SCOPE of a numeric restriction: the pair (symbol bounded, quantifier prefix
      the bound sits under), tracked alongside the same pair for every variable the bound's
      dominant term consumes. What is followed through the computation is a quantifier
      prefix, not a number.
    lossiness: >-
      GENUINELY LOSSY. The projection keeps (symbol, prefix) and discards the VALUE and the
      COEFFICIENT: the eFrodoKEM cap of 2^8 and a hypothetical cap of 2^40 project to the same
      object, and so do two bound terms with wildly different constants. It is therefore not a
      change of coordinates - the number cannot be reconstructed from the prefix, and two
      systems with identical prefix structure can differ by 32 bits of security. The discard
      is COMPATIBLE with the operation the target performs, which is substitution of a
      restriction into an inequality: substitution is type-correct or not as a function of the
      prefixes ALONE, and when it is not, the operator required to repair it (a sum or a max
      over the unbound index) is likewise determined by the prefixes alone. The retained part
      therefore propagates deterministically through the composition step even though the
      numbers are gone. This is the exact contrast with the worked failure in
      docs/inventor-protocol.md section 2: (Delta, Pi) loses nothing because the pair is
      invertible; a quantifier prefix loses the entire numeric content and is not invertible.
    propagation: >-
      One step is one composition attempt. The law: prefix(restriction) at least as outer as
      prefix(consumed variable) yields residual 1; strictly inner yields residual = the
      missing operator over the indices the restriction does not bind, emitted symbolically
      (here, a factor or sum over U). Deterministic, mechanical, and checkable by hand on a
      single sheet.
    survival_score: >-
      Survives exactly as far as the bound is MONOTONE in the composed variable, which for the
      multi-target term is expected but must be verified rather than assumed; at a term that
      is non-monotone the residual is no longer a bound and the object dissolves. It also
      dissolves at any hop whose simulator does something not expressible as a function of the
      quantified variables (rewinding, non-uniform advice). The record's deliverable includes
      naming the first hop at which it dissolves - which is a reusable fact about the proof
      independent of the answer to E1/E2.
  null_object_control: >-
    THE ABLATION'S OWN NULL, and it can fail. NULL-1, THE SALTED ARM: run the identical
    STAGE 1-3 composition on salted FrodoKEM, whose published claim is TIGHT multi-target
    security. Because the salt is what the ephemeral variant removes, the salted arm is the
    arm the null is about (KN-TECH-1a5b7e obligation 3: the comparator must be the arm the
    null is about, named before the run). It must return residual 1 or a residual suppressed
    by the salt-collision factor. If it returns the SAME residual as the ephemeral arm, the
    procedure is reading its own formalization rather than the ablation and NO EPHEMERAL-ARM
    NUMBER IS REPORTABLE. NULL-2, A SYNTHETIC RESTRICTION WITH A KNOWN-CORRECT BINDER:
    restate the eFrodoKEM clause with 'across all public keys' inserted, changing only the
    prefix and not the number, and require the procedure to report residual 1. This is the
    sensitivity demonstration: it exhibits the statistic MOVING when the object is removed,
    with the comparator named and the expected value derived before the run. NULL-3, A
    RESTRICTION ON THE WRONG SYMBOL: bind 2^8 to a symbol the dominant term does not consume
    at all and require the procedure to report 'restriction does not compose - unrelated
    symbol' rather than residual 1 or a numeric residual. FORCED-VALUE DERIVATION, run before
    any data (KN-TECH-1a5b7e obligation 4): if the procedure were simply reporting 'per-key
    clauses always leave residual U', it would return the same answer on NULL-1, which is
    exactly what NULL-1 is constructed to detect - so the contrast is not forced. CAN THIS
    NULL FAIL: yes, on three independent routes, and each failure voids a different part.
  discriminated_from:
    - >-
      IDEA-20260816-32c366 measures salting as a hash-input partition by simulating a
      multi-target search at toy digest widths and fitting a target-hit growth exponent. It is
      a combinatorial simulation with no scheme in it, it names no document, and it explicitly
      declines to say anything about FrodoKEM's salt or about eFrodoKEM. This record reads two
      published statements and composes their quantifiers; it runs no search and produces no
      growth exponent. They are also complementary in a specific way worth recording: 32c366
      would empirically approximate a quantity that Glabush-Hövelmanns-Stebila now prove, and
      that external result should be filed before 32c366 is executed.
    - >-
      IDEA-20260816-9bec34 builds a general executable quantifier-order linter calibrated on
      deliberately mis-ordered statements. That is the INSTRUMENT; this is a TARGET, with a
      specific pair of statements, a specific expected residual, and a specific numeric ladder
      anchored to the published 62-bit figure. If 9bec34 is built, this record should be run
      on it rather than reimplemented.
    - >-
      IDEA-20260816-583998 converts the ROM-to-QROM gap into an integer exponent vector for
      ONE transform. This record compares TWO TRANSFORM VARIANTS within one model, and the
      difference it measures is a missing quantifier rather than a changed exponent. A record
      that found the eFrodoKEM residual would still not know the ROM-QROM gap, and vice versa.
    - >-
      IDEA-20260816-adf2a2 contrasts implicit and explicit rejection as two different
      functions by building both decapsulators and enumerating malformed-ciphertext classes.
      That is an operational contrast between two DECAPSULATION procedures; this is a symbolic
      contrast between two SECURITY STATEMENTS, and neither variant here changes the rejection
      mechanism.
    - >-
      IDEA-20260816-8596af enumerates constants and absorbed inequalities forgiven along a
      chain of game hops and multiplies them into an amnesty figure. A residual left by a
      mis-scoped quantifier is not a forgiven constant: it is a factor that was never in the
      chain, because the restriction it comes from lives in a deployment document rather than
      in the proof. 8596af would not find it by construction.
    - >-
      IDEA-20260821-c05d5f (this batch) asks whether a numeric bound for a variable EXISTS in
      any document. This record takes a bound that demonstrably exists and asks whether it is
      attached to the right quantifier. The two are sequential: c05d5f's class P2 is this
      record's precondition.
