      Grep 'Glabush|Hovelmanns|Stebila|salted Fujisaki|SFO transform' over the repo -> 42 files;
      the only salted-FO mention in knowledge/ is KN-LIT-b9e1a8, the HQC specification entry.
      READ IN FULL: the lane inventory, RQ-FRODO-a2dbe2, GOAL-FRODO-002, IDEA-20260816-b336a3,
      docs/inventor-protocol.md, docs/target-result-profile.md,
      knowledge/techniques/KN-TECH-1a5b7e.md, the GOAL-MLKEM-005 census.md.
      ACQUISITION FAILURES then recorded: https://eprint.iacr.org/2025/1861.pdf and the
      Glabush-Hovelmanns-Stebila preprint PDF both returned unreadable compressed-stream
      extractions.
      REPAIR-SESSION SCREEN (2026-08-24), by the repairing idea-generator, and the reason this
      record was re-scoped. WebFetch of
      https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-01 SUCCEEDED and returned
      the variant-selection clause and the ephemeral parameter differences quoted in citations;
      WebFetch of https://datatracker.ietf.org/doc/html/draft-longa-cfrg-frodokem-security-considerations/
      SUCCEEDED and returned the prohibition clause and the beyond-core-SVP sentence verbatim.
      COMPARING THOSE TWO FETCHES IS WHAT PRODUCED THIS RECORD'S NEW HEADLINE.
      WebFetch of https://eprint.iacr.org/2025/1861 and https://cic.iacr.org/p/2/3/25 returned
      title, authors and abstract only, with no security table; https://cic.iacr.org/p/2/3/25/pdf
      again returned undecodable compressed stream data; https://cic.iacr.org/p/2/3/25/html
      returned HTTP 404; the saved PDF could not be rendered locally (pdftoppm absent, no shell).
      A CORRECTED IDENTIFIER, recorded because the original record had it wrong: the
      Glabush-Hovelmanns-Stebila multi-target preprint is eprint 2025/343; eprint 2025/1861 is
      the FrodoKEM paper. This agent did not open either PDF, so every Eq. (1)/(2)/(3) and
      Section C.1.2 statement in this record is attributed to the red-team screen and NOT to a
      reading.
    results: >-
      Inside the repository the eFrodoKEM object is entirely untouched (2 matches, both in the
      lane's own framing records). Of the eight existing lane proposals, IDEA-20260816-32c366 is
      the only one about salting and is a SIMULATION at toy digest widths of 20-32 bits that
      explicitly disclaims any statement about FrodoKEM's salt, about reachability, and about
      the 2025 revision. IDEA-20260816-9bec34 proposes a quantifier-order LINTER; the
      relationship is instrument-to-target, and this record names 9bec34 as the preferred
      implementation route. IDEA-20260816-d270bc's dominant-term label supplies which term to
      compose against.
      OUTSIDE THE REPOSITORY, AND THIS IS THE MATERIAL CHANGE AT REPAIR: the original
      discriminating question appears to be settled in primary text this session still cannot
      open. The red-team screen quotes eprint 2025/343 Eq. (1) as (2*q_RO*(n_u*n_c) +
      n_u*n_c^2)/|M| for the unsalted FO term and Eq. (2) as n_u*n_c^2/(|M|*2^lensalt) +
      2*t*q_RO/|M| for the SFO term, and FrodoKEM Section C.1.2 as
      O((q_RO*exp(s*D_alpha)+1)*delta(n_u) + n_c*(n_c-1)*n_u/(|M|*2^lensalt)) with
      delta(n_u) <= delta(1)*n_u - all of which consume the AGGREGATE n_u * n_c while the
      eFrodoKEM clause binds n_c per key. The screen also reports FrodoKEM Remark 1 confirming
      verbatim that removing the salt from the SFO transform yields the FO transform used in
      eFrodoKEM, which UN-VOIDS this record's STAGE 4 and STAGE 5 premise. Independently of the
      screen, this agent's own fetch of draft-longa-cfrg-frodokem-01 confirms the ablation
      documentarily (lensalt = 0 for the ephemeral sets, lenSE halved).
      What the screen does NOT settle, and what this record is re-scoped onto, is the
      cross-document clause comparison, which this agent verified by reading both drafts.
    verdict: >-
      ADAPTATION, and after repair a NARROWER one than originally written. The multi-target
      weakness of unsalted FO at 128-bit message spaces is PUBLISHED and cited, not
      rediscovered; the salted fix is published; the eFrodoKEM restriction is published; and the
      aggregate-versus-per-key question that was this record's headline is, per the red-team
      screen, answered in two primary texts. What remains as a contribution is (i) the
      cross-document audit of one number stated twice with two different binder triples, one of
      which is attributed to a document that states the other, and (ii) the residual computation
      that follows from whichever reading a deployer inherits. It is entirely possible that the
      primary text or a later draft revision settles even that in one sentence, in which case
      the honest outcome is 'already answered upstream'.
      LABEL FORCED TO `unverified` BY RULE, NOT BY DOUBT: this record rests on citation(s) marked
      provenance `recalled`, and on quotations from primary texts that no idea-generator session
      has read; AGENTS.md rule 9 -- enforced by tools/validate_ledger.py check_citations --
      requires novelty_status `unverified` until such a source is actually read. The crypto-kb
      retrieval index answers nothing this session (in-memory Qdrant), so no record in this batch
      may assert a checked literature negative.
  object_first_candidate:
    tracked_object: >-
      The BINDER TRIPLE of a numeric restriction - (symbol bounded, quantifier prefix the bound
      sits under, deontic modality of the clause: MUST, MUST NOT, RECOMMENDED, informative) -
      tracked alongside the pair (symbol, prefix) for every variable the bound's dominant term
      consumes. What is followed through the computation is a quantifier prefix and a modality,
      not a number. The modality coordinate is ADDED AT REPAIR because the two published
      renderings of 2^8 differ precisely there.
    lossiness: >-
      GENUINELY LOSSY. The projection keeps (symbol, prefix, modality) and discards the VALUE
      and the COEFFICIENT: the eFrodoKEM cap of 2^8 and a hypothetical cap of 2^40 project to
      the same object, as do two bound terms with wildly different constants. It is therefore
      not a change of coordinates - the number cannot be reconstructed from the triple, and two
      systems with identical triple structure can differ by 32 bits of security. The discard is
      COMPATIBLE with the operation the target performs, which is substitution of a restriction
      into an inequality: substitution is type-correct or not as a function of the prefixes
      ALONE, and when it is not, the operator required to repair it (a sum or max over the
      unbound index) is likewise determined by the prefixes alone. The retained part therefore
      propagates deterministically through the composition step even though the numbers are
      gone. The modality does not affect type-correctness; it is retained because it determines
      WHOSE composition applies - it selects which clause a deployer is bound by - and it is
      reported alongside rather than folded into the residual. This is the exact contrast with
      the worked failure in docs/inventor-protocol.md section 2: (Delta, Pi) loses nothing
      because the pair is invertible; a binder triple loses the entire numeric content.
    propagation: >-
      One step is one composition attempt. The law: prefix(restriction) at least as outer as
      prefix(consumed variable) yields residual 1; strictly inner yields residual = the missing
      operator over the indices the restriction does not bind, emitted symbolically (here, a sum
      or factor over the user count n_u). Deterministic, mechanical, checkable by hand on a
      single sheet. Two clauses, two independent applications of the same law, two residuals to
      compare.
    survival_score: >-
      Survives exactly as far as the bound is MONOTONE in the composed variable, which for the
      multi-target term is expected but must be verified rather than assumed; at a non-monotone
      term the residual is no longer a bound and the object dissolves. It also dissolves at any
      hop whose simulator does something not expressible as a function of the quantified
      variables. The deliverable includes naming the first place it dissolves, which is a
      reusable fact independent of the D1/D2 answer.
  null_object_control: >-
    THE ABLATION'S OWN NULL, and it can fail. NULL-1, THE SALTED ARM: run the identical
    STAGE 1-3 composition on salted FrodoKEM, whose published claim is TIGHT multi-target
    security. Because the salt is what the ephemeral variant removes, the salted arm is the arm
    the null is about (KN-TECH-1a5b7e obligation 3: the comparator must be the arm the null is
    about, named before the run). It must return residual 1 or a residual suppressed by the
    salt-collision factor 2^-lensalt. If it returns the SAME residual as the ephemeral arm, the
    procedure is reading its own formalization rather than the ablation and NO EPHEMERAL-ARM
    NUMBER IS REPORTABLE. NULL-2, A SYNTHETIC RESTRICTION WITH A KNOWN-CORRECT BINDER: restate
    the clause with 'across all public keys' inserted, changing only the prefix and not the
    number or the modality, and require the procedure to report residual 1. This is the
    sensitivity demonstration: the statistic must MOVE when the object is removed, with the
    comparator named and the expected value derived before the run. NULL-3, A RESTRICTION ON THE
    WRONG SYMBOL: bind 2^8 to a symbol the dominant term does not consume at all and require
    'restriction does not compose - unrelated symbol' rather than residual 1 or a numeric
    residual. NULL-4, ADDED AT REPAIR, THE MODALITY-INVARIANCE CONTROL: restate the SAME clause
    with the modality changed from MUST NOT to RECOMMENDED, holding symbol, prefix and number
    fixed. The RESIDUAL must be bitwise unchanged - modality does not affect type-correctness -
    while the reported modality coordinate must change. If the residual moves, the procedure is
    mixing the deontic coordinate into the arithmetic and the D1/D2 comparison is void; if the
    modality coordinate does not move, the instrument cannot see the very distinction the record
    was re-scoped onto.
    FORCED-VALUE DERIVATION, run before any data (KN-TECH-1a5b7e obligation 4), TWO PARTS.
    (i) DECLARED FORCED, so it can never be reported as a finding: per the red-team screen the
    transcribed multi-target terms consume the aggregate n_u * n_c while the eFrodoKEM clause
    binds n_c per key, so the ephemeral arm's residual is EXPECTED to be a factor in n_u before
    any run. If the run returns that, it has confirmed a transcription, not discovered a
    mis-scoping. (ii) NOT FORCED: whether the two published clauses reduce to the same binder
    triple, and whether the salted arm separates. Both can come out either way.
    CAN THIS NULL FAIL: yes, on four independent routes, and each failure voids a different part.
  discriminated_from:
    - >-
      IDEA-20260816-32c366 measures salting as a hash-input partition by simulating a
      multi-target search at toy digest widths and fitting a target-hit growth exponent. It is a
      combinatorial simulation with no scheme in it, names no document, and explicitly declines
      to say anything about FrodoKEM's salt or eFrodoKEM. This record reads published statements
      and composes their quantifiers; it runs no search and produces no growth exponent. They
      are complementary: 32c366 would empirically approximate a quantity that eprint 2025/343
      now proves, and that external result should be filed before 32c366 is executed.
    - >-
      IDEA-20260816-9bec34 builds a general executable quantifier-order linter calibrated on
      deliberately mis-ordered statements. That is the INSTRUMENT; this is a TARGET, with a
      specific pair of clauses, a specific expected residual and a numeric ladder anchored to
      the published 62-bit figure. If 9bec34 is built, this record should be run on it rather
      than reimplemented.
    - >-
      IDEA-20260816-583998 converts the ROM-to-QROM gap into an integer exponent vector for ONE
      transform. This record compares TWO TRANSFORM VARIANTS within one model, and what it
      measures is a missing quantifier rather than a changed exponent.
    - >-
      IDEA-20260816-adf2a2 contrasts implicit and explicit rejection as two different functions
      by building both decapsulators. That is an operational contrast between two DECAPSULATION
      procedures; this is a symbolic contrast between two SECURITY STATEMENTS and two CLAUSES,
      and neither variant here changes the rejection mechanism.
    - >-
      IDEA-20260816-8596af enumerates constants and absorbed inequalities forgiven along a chain
      of game hops. A residual left by a mis-scoped quantifier is not a forgiven constant: it is
      a factor that was never in the chain, because the restriction it comes from lives in a
      deployment document rather than in the proof.
    - >-
      IDEA-20260821-c05d5f (same batch) asks whether a numeric bound for a variable EXISTS in
      any document, and after its own repair it carries the same two clauses as the seeded first
      row of its census. THE OVERLAP IS NOW REAL AND IS DECLARED: c05d5f classifies the clauses
      (does a number exist, and under what kind of authority); this record composes them against
      the bound and emits the residual. They must be executed as one task or explicitly
      sequenced, and the coordinator should treat them as coupled rather than independent.
    - >-
      IDEA-20260821-c50370 (same batch) concerns the reduction's own resources. This record
      concerns the inputs to the bound and the documents that constrain them.
