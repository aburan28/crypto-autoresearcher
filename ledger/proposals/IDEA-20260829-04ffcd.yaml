  assumptions:
    - >-
      The SelfTargetMSIS solution has the three-block structure with the three
      bounds stated, i.e. the challenge block is genuinely part of the short
      vector rather than a separate object. If FIPS 204's formulation places
      c outside the lattice, CONV-2 reduces to a two-block rescaling with
      weight ratio 2.674 : 1 and Delta log2 det drops from 6167.7 to 1452.7
      bits at ML-DSA-44, i.e. +0.630 rather than +2.677 bits per dimension.
      BOTH VARIANTS ARE TO BE COMPUTED AND REPORTED, so the record does not
      depend on which formulation the primary text uses.
    - >-
      A pinned estimator and cost model are inherited, not invented, and the
      SAME one is used for every row, since the deliverable is a difference
      and not an absolute.
    - >-
      Sieve memory is charged identically in every row; a Delta beta that
      exists only when one row is memory-free is not reported.
  proof_search_map:
    bottleneck: >-
      The single step where a vector of three bounds is replaced by its
      maximum before entering the root-Hermite criterion. Removing that step
      changes the estimated block size and nothing else.
    baseline_embedding:
      parameter_slice: >-
        Unit weights, w = (1, 1, 1), which is exactly CONV-1 and is the
        incumbent's boundary case of CONV-2.
      reproduction_check: >-
        Symbolic first: with w = 1 the rescaled basis IS the original basis
        and the determinant term vanishes identically, so CONV-2's formula
        must reduce to CONV-1's on paper before either is evaluated. Numeric
        second: the implemented pipeline must return bit-identical beta for
        w = 1. A frozen fixture records both.
    observation_collision:
      observable: "beta, and the derived classical core-SVP bit count, per convention per category."
      distinct_preimage_search: >-
        Two distinct bound vectors with the same maximum -- for instance
        (350209, 350209, 350209) and (130993, 350209, 1) -- give the SAME
        CONV-1 observable and, if the claim holds, different CONV-2
        observables. That is the collision, it is constructed rather than
        hunted, and its existence is a direct falsifier of CONV-1's
        identifiability: one number is standing for two genuinely different
        problems. The additional condition that separates them is precisely
        the weight vector, which is why the deliverable reports it.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          The rescaled lattice T(LAMBDA) with T = diag(zeta / bound_i), in
          which the admissible set is an exact cube and the isotropic
          machinery every estimator implements is applicable without
          mis-specification.
        predicted_gain: >-
          Delta(log2 det / dim) of +2.677 / +1.817 / +1.465 bits, converting
          to a strictly positive Delta beta. Predicted magnitude: tens of beta
          at ML-DSA-44 given that the ratio driving the criterion moves by
          more than 2.6 bits per dimension. Direction is DEFENDER-favourable;
          the record must not be read as an attack.
      - transform: observable_fiber
        proposed_object: >-
          Hold beta fixed and vary the bound vector within a fixed maximum;
          the fibre of the CONV-1 observable is a whole simplex of genuinely
          different problems, and the intrinsic invariant separating them is
          the weighted determinant. This is the algebraic content of the
          claim and it is checked on paper before any run.
        predicted_gain: >-
          Establishes that CONV-1 is non-identifying, independently of how
          large Delta beta turns out to be. Even a small Delta beta leaves the
          non-identifiability standing as a scoped methodological finding.
    quantifier_order: >-
      FOR EACH FIPS 204 category k and FOR EACH of the three named conventions
      C, THERE EXISTS a computed beta(k, C) under ONE pinned estimator, and
      the claim is about the DIFFERENCES beta(k, CONV-2) - beta(k, CONV-1) and
      beta(k, CONV-3) - beta(k, CONV-1). It is NOT a claim that CONV-2 is the
      uniquely correct convention for every lattice problem, and it is NOT a
      claim that holds for estimators other than the pinned one.
    method_ceiling:
      strongest_certifiable_claim: >-
        "Under estimator E and cost model M, the SelfTargetMSIS lattice arm at
        ML-DSA-k is beta_1 under the max-bound cube, beta_2 under the
        anisotropic box, and beta_3 with the challenge block counted by
        cardinality; the differences are D2 and D3 in block size and B2 and B3
        in classical core-SVP bits; measured at dimension 90-200 the predicted
        difference appeared as a ratio of R against the baseline." The method
        cannot certify which convention a third party's published number used
        unless stage 1 reads it, and cannot certify anything about MLWE.
      nearby_object_control: >-
        A three-block instance with bounds (350209, 350209, 350209) -- same
        maximum, same dimension, same modulus, isotropic. The desired
        conclusion (a positive Delta beta) MUST fail there. A method that
        reports a positive Delta beta on that object has not identified
        anisotropy as the load-bearing structure and is measuring its own
        arithmetic. This is stage 3(iii) and it is the sharpest control in the
        record.
    proof_obligations:
      - claim: "With unit weights CONV-2 reduces symbolically and numerically to CONV-1."
        responsibility: baseline
      - claim: "Delta(log2 det) equals the sum over blocks of dim_i * log2 w_i, exactly."
        responsibility: size
      - claim: "The rescaled instance's solution set is exactly the image under T of the original solution set."
        responsibility: correctness
      - claim: "Delta beta is zero on the isotropic nearby object."
        responsibility: strictness
      - claim: "Sieve memory is charged identically across all rows."
        responsibility: memory
      - claim: "The estimator branch used for each row is named, and the q-ary branch is not applied to a non-q-ary rescaled lattice."
        responsibility: interface
      - claim: "The measured Delta beta at dimension 90-200 is reported as a ratio against the measured CONV-1 baseline, not as an extrapolation."
        responsibility: feasibility
      - claim: "No claim is made about which convention the published FIPS 204 number used until stage 1 reads the primary text."
        responsibility: scope
  predictions:
    - metric: "Delta beta = beta(CONV-2) - beta(CONV-1) at ML-DSA-44/65/87, one pinned estimator, memory charged identically"
      direction: higher
      minimum_effect: >-
        Predicted strictly positive at all three, and at least 20 in block
        size at ML-DSA-44 given a 2.677-bit-per-dimension shift in
        log2 det / dim. Delta beta below 5 at every category is the
        informative negative: the max-bound convention is tight and the lane
        closes with a number.
    - metric: "argmin over {MLWE, MSIS, SelfTargetMSIS} per category, before and after CONV-2"
      direction: different
      minimum_effect: >-
        A change of argmin at ANY category is the high-information outcome and
        is the direct answer to RQ-MLDSA-001's decision target. No change
        anywhere means the binding assumption is robust to the convention,
        which is itself a reportable calibration result.
    - metric: "Delta(log2 det / dim) recomputed in-harness"
      direction: different
      minimum_effect: "must reproduce +2.677 / +1.817 / +1.465 to within 0.01 bits, or the recalled parameter table or the block dimensions are wrong"
    - metric: "sqrt(m) * zeta / q per category"
      direction: different
      minimum_effect: >-
        must reproduce 2.006 / 4.79 / 5.88 to within 1 percent; if ML-DSA-44's
        value crosses below 1 under any admissible reading of m, the estimator
        branch flips and the branch difference must be reported alongside
        Delta beta
    - metric: "NULL: Delta beta on the isotropic synthetic instance"
      direction: lower
      minimum_effect: "must be exactly zero; any non-zero value voids every FIPS 204 row"
    - metric: "Measured Delta beta at dimension 90-200 versus predicted"
      direction: different
      minimum_effect: >-
        agreement within 15 percent of the predicted ratio. A measured
        Delta beta of the wrong SIGN falsifies the whole record and is the
        outcome that would most change this program's view of its own
        estimator.
  minimal_test:
    design: >-
      Stages 1 through 4 are the minimal test and cost hours, not days: a
      primary-text read plus closed-form arithmetic plus a handful of
      estimator invocations. THIS DISCRIMINATES for four independent reasons.
      (i) Stage 1 has a binary answer that can close the record outright.
      (ii) The unit-weight control has a value FORCED to bit-identity, so a
      failure is unambiguous. (iii) The isotropic nearby object has a
      Delta beta forced to zero, so a positive result there is unambiguous
      instrument error. (iv) Delta beta has a PREDICTED SIGN, so a negative
      Delta beta is a clean falsification rather than a shrug. Stage 5, the
      measured run at dimension 90-200, is a separate and larger increment
      (single workstation, hours to a day with fplll) and is what turns a
      convention argument into an observation; it should be scheduled only
      after stages 1-4 return a non-zero Delta beta.
    controls:
      - "UNIT-WEIGHT: w = (1,1,1) reproduces CONV-1 bit-identically, symbolically first and numerically second."
      - "ISOTROPIC NULL: bounds (350209, 350209, 350209); Delta beta forced to zero."
      - "SCALE INVARIANCE: common rescaling of all bounds and q leaves beta unchanged."
      - "MONOTONICITY: Delta beta monotone as w_c sweeps 1 to zeta on a log grid."
      - "BRANCH DISCLOSURE: the estimator branch is named per row and the q-ary branch is never applied to the rescaled non-q-ary lattice."
      - "TWO-BLOCK VARIANT: the same table computed with the challenge block excluded from the lattice, so the record survives either FIPS 204 formulation."
    required_metrics:
      - "per-block bounds and weights, exact integers, per category, both the three-block and two-block variants"
      - "Delta(log2 det) and Delta(log2 det / dim), exact"
      - "beta and classical core-SVP bits under CONV-1, CONV-2, CONV-3, per category, memory charged"
      - "argmin over the three assumptions per category, before and after"
      - "sqrt(m) * zeta / q and the estimator branch used, per row"
      - "unit-weight, isotropic-null, scale-invariance and monotonicity control outcomes"
      - "measured beta at dimension 90-200 under both bases, with the measured ratio against the predicted one"
      - "which convention the primary text uses, quoted, with page or section reference"
  falsification_conditions:
    - "Stage 1 finds the published estimate already applies per-block rescaling: Delta beta is zero by construction, the lane closes with a citation, and only clause (E) survives as a deliverable."
    - "The unit-weight control does not reproduce CONV-1 bit-identically: the rescaled pipeline is a different pipeline and no row is reportable."
    - "The isotropic null shows a non-zero Delta beta: the measurement is arithmetic artefact and every FIPS 204 row is void."
    - "Delta beta is below 5 in block size at all three categories: the max-bound cube is a tight convention for these particular bound vectors, and that is a positive calibration result for FIPS 204 recorded as such."
    - "Delta beta has the opposite sign to the prediction: the argument in clause (C) about the direction of the determinant shift is wrong and must be re-derived before anything is claimed."
    - "The measured dimension-90-200 Delta beta disagrees with the predicted one by more than 15 percent: the closed-form prediction is not tracking the reduction's behaviour and the FIPS 204 rows must be reported as unvalidated arithmetic."
    - "CONV-3 disagrees with IDEA-20260805-5194f9's min-of-arms by more than the instrument's resolution: the disagreement is a finding about the cost model and is routed to that record's lane, not claimed here."
  confounders:
    - "The estimator's q-ary branch is inapplicable to the rescaled lattice, and at ML-DSA-44 the instance sits a factor 2.006 from the branch boundary, so the branch choice can dominate Delta beta. This is the single largest threat and stage 4 exists for it; it must be reported as a competing explanation, not netted out."
    - "IDEA-20260808-63427b's pool and direction corrections push beta the other way. Any run applying both must report the two components separately; a net near zero is not evidence that either component is zero."
    - "The recalled FIPS 204 parameter table. Every number in clause (B) is downstream of it."
    - "Whether c belongs to the lattice at all. The two-block variant is computed precisely so the record does not depend on that reading."
    - "591f9d's documented 355-in-beta instrument discrepancy. Reporting a DIFFERENCE under one pinned instrument is the mitigation, but if the discrepancy reflects two genuinely different criteria rather than a bug, a difference computed under the wrong one is still wrong. Stage 2 must state which criterion it uses."
    - "The challenge block's true constraint is a cardinality, not a box, so CONV-2 overstates the challenge block's freedom and CONV-2's Delta beta is a LOWER bound on the correct correction. CONV-3 exists to bracket it."
  interpretation_limits:
    - "No attack, no forgery, no break. The predicted direction makes ML-DSA look STRONGER on the lattice arm, not weaker."
    - "Everything is scoped to one pinned estimator and one cost model. A Delta beta that vanishes under a different estimator is a statement about estimators and must be reported as one."
    - "The dimension-90-200 measurement is toy tier per RQ-MLDSA-001's claim_tier_ceiling and supports the FIPS 204 rows only through a stated transfer assumption."
    - "A change of argmin is a change in what the ESTIMATE says binds. It is not evidence that any assumption is broken, and it must never be phrased as such."
  heuristic_assumptions:
    - id: H1
      statement: >-
        For a lattice basis rescaled by T = diag(w) with block weights spanning
        a ratio up to 2^18.5, BKZ-beta output follows the same root-Hermite
        law delta(beta) as for an unrescaled lattice of the same dimension and
        the same rescaled determinant, uniformly for beta in [40, 200] and
        dimension in [90, 200]. Equivalently: the estimator's isotropic model
        is a function of (dimension, determinant, target length) alone and is
        invariant under which diagonal map produced that determinant.
      rigorous_support: >-
        Rigorous ingredient: T is an invertible linear map, so T(LAMBDA) is a
        genuine lattice with det = det(LAMBDA) * PROD w_i, exactly, and the
        solution sets correspond bijectively. Nothing about the correspondence
        is heuristic. The classical statement imitated is the standard
        root-Hermite-factor model of BKZ output, under which delta depends on
        beta and dimension alone -- the same model used for every core-SVP
        figure in this ledger and in the FIPS 204 lineage. The heuristic is
        exactly the claim that this model is blind to anisotropy of the
        generating map, which is plausible but is a MODEL claim, not a
        theorem, and is precisely what a very lopsided weight vector could
        break.
      validation_plan: >-
        At dimensions 90, 120, 160 and 200, generate 100 instances per cell
        with the ML-DSA-44 block structure and weight ratios, reduce with
        fplll at beta in {40, 50, 60, 70, 80}, and record the achieved
        root-Hermite factor of the OUTPUT basis for the rescaled lattice
        against the unrescaled one at matched (dimension, determinant).
        Compare the empirical delta against the standard prediction and
        report the residual. TAIL CHECK: report the WORST instance's delta,
        not the mean, and separately report instances where the rescaled
        basis' output profile is visibly non-GSA (a staircase profile is the
        expected failure mode when weights are extreme, because the heavily
        upweighted block's vectors are excluded from early insertion). Sweep
        the weight ratio through 2^0, 2^4, 2^8, 2^12, 2^18.5 to find where, if
        anywhere, the invariance breaks, and REPORT THAT BREAKPOINT -- it is
        the most valuable single number this validation can produce, because
        it bounds how far rescaling can be trusted for any lattice problem
        this program estimates. Sampled parameters recorded per cell.
        TRANSFER ASSUMPTION: dimension 200 to 2304 and beta 80 to several
        hundred, both stated as extrapolations with fitted intervals.
    - id: H2
      statement: >-
        Conditioned on a BKZ-beta-reduced basis of the rescaled lattice, the
        probability that a returned vector of the target euclidean length
        simultaneously satisfies all three ORIGINAL per-block infinity bounds
        is within a factor 2 of the probability that it satisfies the single
        rescaled cube bound zeta in every coordinate, uniformly over the three
        FIPS 204 bound vectors.
      rigorous_support: >-
        Rigorous ingredient: the two events are IDENTICAL as sets, by the
        bijection under T, so the probabilities are equal exactly and the
        factor-2 slack is entirely about the estimator's coordinate model.
        The classical statement imitated is the i.i.d.-Gaussian coordinate
        model the fetched lattice-estimator documentation states it uses below
        the q-ary threshold. THE HONEST WEAKNESS: that i.i.d. model is applied
        to coordinates that, after rescaling, have wildly different scales,
        and IDEA-20260808-63427b is already interrogating the same model from
        the other side. If 63427b finds the coordinate model fails, H2 fails
        with it, and this record must say so rather than claiming an
        independent basis.
      validation_plan: >-
        On the same reduced bases as H1, measure directly the empirical
        fraction of pool vectors of a given euclidean length that satisfy the
        three original per-block bounds, and compare against the fraction
        satisfying the rescaled cube. Report the empirical ratio and its CDF
        across instances. TAIL CHECK on the 100 vectors closest to the bound,
        which are the ones that decide success. NULL: the same measurement on
        uniformly random directions of the same length, which must give the
        same ratio, since the set identity is exact and any deviation is
        measuring the reduction's bias rather than the geometry. Sampled
        parameters recorded. TRANSFER ASSUMPTION: none beyond H1's dimension
        extrapolation, since the set identity is exact at every dimension.
  target_complexity:
    time_exponent: >-
      No new algorithm and therefore no new exponent; the target is a
      CORRECTION to an existing exponent. Incumbent for the SelfTargetMSIS
      lattice arm: 2^(0.292 beta_1 + o(beta)) with beta_1 computed under the
      max-bound cube. Proposed: 2^(0.292 beta_2 + o(beta)) with
      beta_2 = beta_1 + Delta beta, Delta beta predicted strictly positive and
      at least 20 at ML-DSA-44, i.e. at least 5.8 classical core-SVP bits
      MORE cost than the incumbent figure. The record therefore proposes a
      correction that RAISES the attack exponent; it is not an attack and must
      never be indexed as one.
    memory_exponent: >-
      2^(0.2075 beta) in every row, charged identically; the correction moves
      memory in the same direction as time and by the same beta, so no row
      gains a memory advantage from the convention change. Under CONV-3 the
      challenge block's cardinality is counted as a search cost with
      negligible memory, which is why CONV-3's memory row differs and must be
      shown separately.
    best_known: >-
      The published SelfTargetMSIS and MSIS lattice-arm block sizes in the
      FIPS 204 lineage, computed under a single scalar infinity bound, with
      the caveat that this program's own instrument currently disagrees with
      a recalled published value by about 355 in beta (IDEA-20260805-591f9d),
      which is why the deliverable is a difference under one instrument.
    hidden_overhead: >-
      Two disclosures. First, the o(beta) is the usual sieve overhead and is
      charged identically in every row, so it cancels in Delta beta but not in
      any absolute figure quoted from this record. Second, and this is the one
      that could invalidate the arithmetic rather than merely blur it, the
      estimator's q-ary branch cannot be applied to a rescaled lattice, and
      ML-DSA-44 sits a factor 2.006 from that branch boundary -- so the
      incumbent number and the corrected number may be computed by two
      different analyses, and a difference between two analyses is not a
      correction. Stage 4 must resolve this or the record reports the branch
      ambiguity as its dominant uncertainty.
    tradeoff_note: >-
      No claw structure and no new time-memory tradeoff of this record's own.
      The relevant tradeoff is the EXISTING one between the lattice arm and
      the hash arm, which IDEA-20260805-5194f9 and IDEA-20260808-c1abd1 own;
      this record changes one endpoint of it and its deliverable must state
      the recomputed crossover so those records can be updated rather than
      silently contradicted. Parallelization position is unchanged: sieving
      parallelizes as before, and the convention change touches neither.
  dominated_by: >-
    n/a (no attack or algorithmic result is claimed; the predicted direction
    is defender-favourable). Frontier rows checked before writing this, on
    time, memory and data axes for the SelfTargetMSIS forgery problem at
    FIPS 204 parameters: (i) the published lattice arm under CONV-1 -- this
    record CORRECTS it rather than competing with it, so domination is not
    the right relation; (ii) the hash arm at |B_tau| = 2^192.760 / 2^225.345 /
    2^257.015 (5194f9), negligible memory, no data -- dominates the lattice
    arm on memory at every category and would dominate on time too if
    Delta beta is large, which is exactly the reordering this record predicts
    and reports; (iii) the claw interpolation max(C_reduce, |B_tau|) proposed
    in c1abd1, which if correct dominates both endpoints on time and is the
    row this record's corrected lattice value feeds into; (iv) the
    depth-capped quantum rows of fe3cee, which sit on a different resource
    axis (circuit depth) and are recomputed rather than dominated; (v)
    signature-transcript attacks (4d4e5f and the RQ-MLDSA-ffa0f5 t0 lane),
    which consume data this adversary does not have. No row on that frontier
    reports a per-block-rescaled lattice value, so none dominates this
    measurement of it.
  sota_delta: >-
    Quantitatively: Delta beta and its classical core-SVP bit value per
    category under CONV-2 and CONV-3, against an incumbent whose value for
    those differences is not "small" but UNCOMPUTED. Predicted magnitude at
    ML-DSA-44 is at least 20 in block size, at least 5.8 core-SVP bits, in the
    defender's favour. The reordering delta, if any, is reported as the change
    in argmin over the three assumptions, per category, which is the quantity
    RQ-MLDSA-001 actually asks for. The smallest Delta beta this record would
    treat as a finding rather than instrument noise is 5 in block size.
