idea:
  id: IDEA-20260829-04ffcd
  question_id: RQ-MLDSA-001
  goal_id: GOAL-MLDSA-001
  added: '2026-08-29'
  proposed_by: idea-generator
  status: proposed
  title: >-
    SelfTargetMSIS is a BOX problem with three wildly different side lengths
    (130993, 350209, 1 at ML-DSA-44) but is estimated as a CUBE of side
    zeta = max of the three. Rescale each block by its own bound -- the
    standard anisotropic embedding -- and the lattice determinant rises by
    2.677 bits per dimension at ML-DSA-44, which moves the estimate in the
    direction that makes the LATTICE arm stronger and the HASH arm bind
    sooner. Report Delta beta under three named conventions, and note that
    ML-DSA-44 sits within a factor 2.006 of the estimator's own q-ary regime
    boundary, where the rescaling trick and the q-ary branch are mutually
    incompatible.
  class: representation
  claim: >-
    (A) THE OBJECT, AND WHY THE SCALAR zeta IS A LOSSY PROJECTION OF IT. An
    admissible SelfTargetMSIS solution is a triple of blocks with three
    SEPARATE infinity-norm constraints, not one. Using RECALLED FIPS 204
    parameters and this ledger's own decomposition (IDEA-20260805-591f9d):
    the z-block occupies 256 l coordinates and is bounded by
    gamma1 - beta - 1; the rounding/compression block occupies 256 k
    coordinates and is bounded by 2 gamma2 + 1 + 2^(d-1) tau; the challenge
    block occupies 256 coordinates and is bounded by 1, because c lies in
    B_tau and has entries in {-1, 0, +1}. The published lattice-arm estimate
    -- and, per a WebSearch synthesis of the Dilithium specification, the
    specification's own analysis, which states an infinity-norm bound
    "B = max(2 gamma1, 4 gamma2 + 2, 2^(d+1))" -- replaces that BOX by the
    CUBE of side zeta = the maximum of the three. The scalar zeta is a
    projection of the bound VECTOR, and it is lossy in the direction that
    matters: it admits vectors that are not admissible solutions at all
    (a challenge block with entries of size 350209 is not in B_tau).
    (B) SCOUT ARITHMETIC, EXACT INTEGER, COMPUTED THIS SESSION OUTSIDE THE
    HARNESS AND FLAGGED FOR RE-RUN IN-HARNESS BEFORE CITATION. Let
    w_i = zeta / bound_i be the per-block rescaling weight and let
    T = diag(w) be the anisotropic map, under which every block's bound
    becomes exactly zeta and the constraint set becomes a genuine cube.
    T multiplies the lattice determinant by the product of the weights.
    ML-DSA-44: bounds (130993, 350209, 1) over (1024, 1024, 256)
    coordinates, dimension 2304; log2 w = (1.4187, 0, 18.4180);
    Delta log2 det = 1024*1.4187 + 256*18.4180 = 6167.7 bits, i.e.
    Delta(log2 det / dim) = +2.677 bits per dimension.
    ML-DSA-65: bounds (524091, 724481, 1) over (1280, 1536, 256),
    dimension 3072; Delta log2 det = 1280*0.4670 + 256*19.4665 = 5581.2,
    i.e. +1.817 bits per dimension.
    ML-DSA-87: bounds (524167, 769537, 1) over (1792, 2048, 256),
    dimension 4096; Delta log2 det = 1792*0.5541 + 256*19.5537 = 5998.7,
    i.e. +1.465 bits per dimension.
    (C) THE DIRECTION OF THE ERROR, WHICH IS THE PART THAT MATTERS FOR
    RQ-MLDSA-001's DECISION TARGET. Under T the required solution length is
    unchanged in the rescaled coordinates (every block bound is now zeta) but
    det^(1/dim) has RISEN by 2.677 / 1.817 / 1.465 bits. The ratio that drives
    every root-Hermite criterion -- required length over det^(1/dim) -- therefore
    FALLS by that many bits, so the rescaled instance is estimated HARDER. THE
    CLAIM IS THAT Delta beta = beta_rescaled - beta_maxbound IS STRICTLY
    POSITIVE AT ALL THREE CATEGORIES, i.e. the incumbent convention
    UNDERSTATES the lattice arm's cost. That has a consequence the two-arm
    literature in this ledger has never had to face: IDEA-20260805-5194f9
    reports the hash arm at log2 |B_tau| = 192.760 / 225.345 / 257.015 and
    compares it against a lattice arm computed under the max-bound cube. If
    the lattice arm is understated, the crossover moves TOWARD the hash arm,
    and at whichever category the two arms are closest the ARGMIN CAN CHANGE.
    Which assumption binds is exactly what this question exists to decide.
    (D) THE THIRD CONVENTION, STATED SO THE RECORD IS NOT NAIVE. The box model
    is itself lossy for the challenge block, whose true constraint is not
    |c_i| <= 1 but "c has exactly tau nonzero entries, all in {-1, +1}" --
    a set of size |B_tau| = 2^192.760, versus 3^256 = 2^405.8 for the ternary
    cube. So there are three conventions, not two, and the honest deliverable
    is all three rows:
    CONV-1 max-bound cube of side zeta (incumbent);
    CONV-2 anisotropic box, weights zeta/bound_i (this record's proposal);
    CONV-3 anisotropic box on the z and rounding blocks, with the challenge
    block replaced by its exact cardinality |B_tau| as a counting constraint.
    CONV-3 is where this record MEETS the two-arm literature rather than
    duplicating it: 5194f9 and IDEA-20260808-c1abd1 both treat |B_tau| as a
    SEPARATE arm to be min-ed or interpolated against the lattice arm; CONV-3
    puts it INSIDE the lattice arm as a constraint on one block. Those are
    different accountings of the same fact and the gap between them is
    measurable.
    (E) THE REGIME-BOUNDARY OBSERVATION, WHICH IS AN INDEPENDENT AND CHEAPER
    FINDING. The public lattice-estimator's SIS module documentation, FETCHED
    AND READ THIS SESSION, states that for infinity-norm bounds it uses two
    different analyses according to whether sqrt(m) * length_bound is below or
    above q: below, it "simulate[s] the cost of generating many short vectors
    and treat[s] each coordinate of the vector as an i.i.d Gaussian random
    variable"; above, it "explicitly account[s] for the q-ary structure of the
    lattice", with q-vector coordinates uniform and only the middle region
    Gaussian. It also states that "lattice attack estimation is only available
    for euclidean (2) and infinity (oo) norms" -- there is NO per-block or
    weighted option. SCOUT: sqrt(2304) * 350209 = 2^24.003 against
    q = 2^22.999, a ratio of 2.006 at ML-DSA-44 (4.79 at -65, 5.88 at -87).
    ML-DSA-44 therefore sits a factor of two above the branch boundary, and
    the branch it lands in is decided by a quantity nobody in this program has
    ever computed. Worse and sharper: T(LAMBDA) IS NOT A q-ARY LATTICE, so the
    q-ary branch cannot be applied to the rescaled instance at all. THE
    RESCALING TRICK AND THE ESTIMATOR'S q-ARY BRANCH ARE MUTUALLY
    INCOMPATIBLE at exactly the parameters where ML-DSA-44 lives, and that
    incompatibility is a methodological finding independent of whether
    Delta beta turns out large or small.
    (F) WHAT IS NOT CLAIMED. No attack, no forgery, no new algorithm, no
    exponent improvement over any published attack. The claim is that one
    published number is computed under a convention whose error has a sign and
    a size, both computable without lattice software, and that the sign points
    the way that changes which assumption binds.
  mechanism: >-
    STAGE 0, THE LOSSY-PROJECTION TEST, RUN BEFORE ANY COMPUTE AND STATED
    AGAINST ITSELF. The map T = diag(w) is INVERTIBLE, so as a map on
    instances it is a change of coordinates and loses nothing. THAT IS NOT THE
    TRACKED OBJECT. The tracked object is the BOUND VECTOR
    (bound_z, bound_r, bound_c), and the incumbent convention's projection of
    it to the scalar zeta = max is what is lossy. That projection discards the
    two smaller bounds, and it discards them INCOMPATIBLY with the target's
    operations: the verifier enforces all three bounds separately, so a vector
    admitted by the cube can fail verification, whereas the lattice reduction
    the estimate models is indifferent to which of the three it violates. A
    projection that loses information the target's own predicate still uses is
    exactly a mis-specified estimate, and the size of the mis-specification is
    what stages 2 and 3 measure. Record this argument in the deliverable; it
    costs no compute and it is the whole justification for the work.
    STAGE 1, PRIMARY-TEXT GATE. Read FIPS 204 and the Dilithium specification
    and determine, from the text and not from a search summary, WHICH
    convention the published SelfTargetMSIS and MSIS lattice-arm numbers were
    computed under. THIS STAGE CAN CLOSE THE RECORD: if the specification
    already applies per-block rescaling, Delta beta is zero by construction,
    the lane closes with a citation, and the only surviving deliverable is
    clause (E). Report that outcome as a clean negative, not as a failure.
    STAGE 2, RECOMPUTE THE THREE CONVENTIONS. Under one pinned estimator and
    one pinned cost model, with sieve memory charged identically in every row,
    compute beta and classical core-SVP bits for CONV-1, CONV-2 and CONV-3 at
    all three categories, for both the MSIS arm and the SelfTargetMSIS arm.
    Report Delta beta (CONV-2 minus CONV-1) and (CONV-3 minus CONV-1).
    STAGE 3, THE FORCED CONTROLS. (i) UNIT-WEIGHT CONTROL: set all weights to
    1; CONV-2 must reproduce CONV-1 EXACTLY, to the estimator's own numerical
    precision, not approximately. A discrepancy means the rescaled pipeline is
    not the same pipeline. (ii) SCALE-INVARIANCE CONTROL: multiply every bound
    and the modulus by a common factor; beta must not move. (iii) SYNTHETIC
    ISOTROPIC INSTANCE: an instance whose three bounds are equal by
    construction; CONV-1 and CONV-2 must agree, and the measured Delta beta
    must be zero there, isolating anisotropy as the mechanism rather than the
    arithmetic. (iv) MONOTONICITY: sweep the challenge-block weight w_c from 1
    up to zeta on a log grid; Delta beta must be monotone in w_c, and a
    non-monotone curve is an instrument fault.
    STAGE 4, THE REGIME FORK. Compute sqrt(m) * zeta against q per category
    under both conventions and report which estimator branch each row lands
    in. Where the rescaled instance is non-q-ary, report that the q-ary branch
    is INAPPLICABLE and state which branch was used and why, rather than
    letting a tool choose silently. If the two branches disagree by more than
    the reported Delta beta at ML-DSA-44, the branch choice, not the
    anisotropy, is the dominant uncertainty and the record says so.
    STAGE 5, MEASURED VALIDATION AT REDUCED DIMENSION, WHICH IS THE PART THAT
    MAKES THIS MORE THAN ARITHMETIC. At dimensions 90 to 200 with the same
    three-block anisotropic structure and the same bound RATIOS as FIPS 204
    (2.674 : 1 : 350209 at the -44 ratio), actually run BKZ and measure the
    smallest block size at which a vector satisfying the ORIGINAL per-block
    bounds is found, under both the CONV-1 basis and the CONV-2 basis.
    Compare the measured Delta beta against the predicted one. This is the
    step the inventor protocol's validation ladder says is most often skipped,
    and it is what converts a convention argument into an observation.
  novelty_status: unverified
  novelty_screen:
    corpus: >-
      Read this session: all 15 prior RQ-MLDSA-001 titles, and in full or
      substantial part IDEA-20260801-008, -20260805-591f9d, -20260808-5a748c,
      -20260808-63427b, -20260808-c1abd1, -20260821-4c0246, -20260821-5535fe,
      -20260821-5bbea6, -20260828-9643b1, -20260828-fe3cee, plus RQ-MLDSA-001
      and RQ-MLDSA-ffa0f5 in full. IDEA-20260805-591f9d decomposes zeta into
      its three additive terms and prices the compression term, but it feeds
      the SCALAR zeta into a single root-Hermite criterion
      (min_m delta(b)^m q^(nk/m) <= zeta) and never varies the bound per
      block; its object is the SUM zeta, this record's is the VECTOR of
      bounds. IDEA-20260808-63427b models the l-infinity/l-2 conversion and
      the sieve pool's direction distribution -- a statement about the
      ATTACKER's output vectors under a fixed single bound, orthogonal to a
      statement about the CONSTRAINT SET's shape; the two corrections compose
      and neither subsumes the other, which the record must state when both
      are applied. IDEA-20260805-5194f9 and IDEA-20260808-c1abd1 treat
      |B_tau| as a separate arm; CONV-3 is where this record touches them and
      the discriminated_from block says exactly how. No record in the corpus
      contains the words rescal-, weight-, anisotropic, or per-block bound in
      an ML-DSA lattice-estimate context.
    web: >-
      One WebFetch this session (2026-08-29) of the public lattice-estimator's
      SIS-lattice documentation page, read in full, which confirms a single
      scalar length_bound, exactly two supported norms, no per-block or
      weighting option, and the two-branch infinity-norm analysis split at
      sqrt(m) * length_bound versus q. One WebSearch surfaced a synthesis of
      the Dilithium specification stating the single max-form infinity bound;
      the specification PDF itself was NOT fetched, which is why stage 1 is a
      primary-text gate that can close the record.
    verdict: >-
      UNVERIFIED. Anisotropic rescaling for heterogeneous bounds is standard
      practice in lattice estimation generally, so the technique is KNOWN;
      what is not established, in the corpus or in anything read this session,
      is whether it is applied to ML-DSA's SelfTargetMSIS block structure in
      the published estimate, and what Delta beta is at FIPS 204 parameters.
      Because the load-bearing question is settled by a primary text nobody
      here has read, the honest label is unverified and stage 1 is the gate.
  object_first_candidate:
    tracked_object: >-
      The BOUND VECTOR (bound_z, bound_r, bound_c) of an admissible
      SelfTargetMSIS solution, followed from the FIPS 204 verification
      predicate, through the choice of lattice basis, into the root-Hermite
      criterion, and out as a block size -- as a vector at every step, never
      collapsed to its maximum.
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) the two-arm min and any
      interpolation between lattice cost and |B_tau| (5194f9, c1abd1, fe3cee);
      (2) the sieve pool's direction statistics and l-infinity/l-2 conversion
      (63427b); (3) CRT-coordinate projections (5535fe); (4) fault-derived
      constraints (818196, 6e79b4); (5) reduction-loss transcription (9643b1);
      (6) t0 pricing (5a748c). This record's lens is the SHAPE of the
      admissible set.
    genuinely_new_or_repackaging: >-
      The technique is a repackaging of a standard lattice-estimation move.
      What is not a repackaging is the target: nobody in this corpus has
      applied it to SelfTargetMSIS's three-block structure, and the
      incompatibility with the estimator's q-ary branch at ML-DSA-44's exact
      position (factor 2.006) is, as far as this session could check, unstated
      anywhere.
    concretely_testable: >-
      Yes, and cheaply. One-step propagation is one multiplication of a basis
      by a diagonal matrix, whose effect on log det is exact integer
      arithmetic. The measurable is beta, and stage 5 measures it rather than
      predicting it.
    survival_score: >-
      The object survives to the point where the challenge block's true
      constraint stops being a box, i.e. it survives CONV-1 to CONV-2 exactly
      and dissolves at CONV-3, where a cardinality replaces a norm. Reporting
      exactly where it dissolves, and by how many bits the three conventions
      differ, is the deliverable.
  null_object_control: >-
    Stage 3(iii): a synthetic instance whose three block bounds are equal by
    construction, same dimension and same modulus. CONV-1 and CONV-2 must give
    identical beta and Delta beta must be exactly zero. Any non-zero Delta beta
    on the isotropic null means the pipeline is measuring its own arithmetic
    and every FIPS 204 row is void. Stage 3(i), the unit-weight control, is the
    degenerate form of the same check on the real instance.
  discriminated_from:
    - >-
      IDEA-20260805-591f9d owns the DECOMPOSITION of zeta into signature,
      rounding and compression terms and the price of the compression term. It
      treats zeta as a scalar input to a single criterion and its deliverable
      is an attribution table plus a convention reconciliation. This record
      does not re-derive zeta and does not re-attribute it; it asks what
      happens when the bound is not collapsed to a scalar at all. If 591f9d's
      convention reconciliation lands first, this record inherits its pinned
      instrument rather than competing with it.
    - >-
      IDEA-20260808-63427b corrects the l-infinity cost of a vector the sieve
      RETURNS, using its direction distribution and the pool minimum. This
      record corrects the SHAPE OF THE SET the returned vector must land in.
      The two corrections have opposite signs -- 63427b's favours the
      attacker, this record's favours the defender -- and they compose. Any
      run that applies both must report the net and the two components
      separately, and neither record may claim the other's term.
    - >-
      IDEA-20260805-5194f9 and IDEA-20260808-c1abd1 treat |B_tau| as an arm
      external to the lattice. CONV-3 folds it in as a block constraint. These
      are two accountings of one fact and they must agree; if CONV-3's
      SelfTargetMSIS cost and 5194f9's min-of-arms disagree by more than the
      instrument's resolution, that disagreement is itself a finding about the
      cost model and is routed back to 5194f9's lane rather than claimed here.
    - >-
      IDEA-20260828-fe3cee completes a MAXDEPTH table across the two arms.
      This record changes the VALUE of the lattice arm that fe3cee's table
      takes as input. They compose in one direction only: fe3cee's table
      should be recomputed if Delta beta is material, and this record must say
      so rather than silently invalidating a sibling record.
  citations:
    - ref: "Lattice Estimator documentation, SIS Lattice Attacks page (lattice-estimator.readthedocs.io/en/latest/algorithms/sis-lattice.html)"
      provenance: retrieved
      claim: >-
        Estimation is available only for euclidean (2) and infinity (oo)
        norms, with a single scalar length_bound and no per-block,
        heterogeneous, or weighted option. For infinity-norm bounds two
        distinct analyses are used: when sqrt(m) * length_bound is below q the
        estimator simulates generating many short vectors and treats each
        coordinate as an i.i.d. Gaussian random variable; when it is at or
        above q the estimator explicitly accounts for the q-ary structure,
        with q-vector coordinates uniform and only the middle basis region
        Gaussian. For euclidean bounds the reduction shape model does not
        matter, since the block size follows directly from the length bound.
      verified_by: "idea-generator subagent, WebFetch, 2026-08-29: page fetched and read this session; quotations above are from the fetched text. Full page read, not header-only."
    - ref: "CRYSTALS-Dilithium Algorithm Specifications and Supporting Documentation (pq-crystals.org)"
      provenance: recalled
