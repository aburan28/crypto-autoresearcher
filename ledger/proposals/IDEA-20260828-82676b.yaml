idea:
  id: IDEA-20260828-82676b
  title: >-
    Baseline-reproduction gate for a 5-round AES "multiple-of" quartet
    congruence under an exchange-diagonal related-differential construction,
    independently re-derived (not copied) from the 2026/1039 and 2026/1286
    ePrint abstracts, gated by a random-permutation null before any positive
    claim.
  class: control
  claim: >-
    (1) BASELINE FIXTURE. For AES-128 reduced to 4 rounds, with plaintexts
    fixed outside a single active diagonal D_in = {0,5,10,15} and quartets
    built by exchanging the two diagonal values between the pair (the
    ASIACRYPT-2019 exchange construction this program already implements for
    IDEA-20260807-4ee607), the number of "balanced" quartets (all four
    ciphertexts sharing a fixed inactive byte set after round 4) satisfies
    N_q = 8*B for every key and every choice of the fixed diagonal values,
    B a non-negative integer (Grassi's 4-round multiple-of-8 property,
    RECALLED-UNVERIFIED from memory as the c=3, r=0 case of the general form
    N_q = 2^(2-n_z)*(2^w)^(n_z)*A + 8*B reported, without independent
    verification of that exact formula, at eprint.iacr.org/2026/1286).
    This record treats the fixture as UNVERIFIED-BY-THIS-PROGRAM until
    reproduced locally and requires bit-for-bit reproduction before any
    5-round claim is trusted. (2) THE OPEN QUESTION. Extending the SAME
    exchange-diagonal quartet construction by one round using a
    related-differential modification INDEPENDENTLY RE-DERIVED in this
    record's minimal_test (not transcribed from the unread 2026 PDFs, whose
    exact quartet definition this session could not extract from the fetched
    content), does an analogous congruence N_q(5-round) ≡ r (mod 2^c),
    c >= 1, survive (i) across >= 30 independent keys and (ii) against a
    matched random-permutation control at the SAME data cost? TWO POSSIBLE
    OUTCOMES, both reportable: a survived congruence is a certified
    reduced-round distinguisher matching RQ-AES-001's decision target
    (subject to the false-positive-rate discipline of
    docs/claims-and-verification.md); a congruence that appears in the
    honest re-derivation attempt but vanishes under the random-permutation
    null, or that fails to reproduce across keys, is a clean negative that
    scopes THIS SPECIFIC re-derivation as not carrying the extension --
    which is a different, weaker claim than "the papers are wrong", stated
    explicitly as such.
  mechanism: >-
    The multiple-of property is a divisibility fact about the SIZE of a
    balanced-quartet fibre, not about any single trail: SubBytes acts
    bijectively per byte and ShiftRows permutes positions, so the diagonal
    exchange operation commutes with both, and the quartet's four
    ciphertexts fall into orbits under a group of order 8 generated by the
    two exchanges and the trivial swap; Burnside/orbit-counting on that
    group forces the balanced-quartet count to be a multiple of 8 whenever
    the "balanced" predicate is itself invariant under the group action --
    this is why the property survives to the exact round at which the
    invariance breaks (empirically round 4 for the plain construction) and
    is exactly the mechanism the 2026 papers report extending by one round
    using an additional differential relation between plaintext pairs. The
    OBJECT tracked here is the ORBIT-COUNT RESIDUE of the balanced-quartet
    predicate under the exchange group -- a lossy projection of the full
    quartet transcript that discards which specific quartet is balanced and
    keeps only the count modulo a fixed power of 2. It is genuinely lossy
    (many quartet sets share one residue) and the discarded part
    (individual quartet identity) is discarded compatibly with the group
    action, since the predicate's group-invariance is what makes the
    residue well-defined independent of labelling -- this is the
    lossy-projection test from docs/inventor-protocol.md section 2, applied
    before any compute is spent. Nearest known method: the exchange
    construction itself (established, already instantiated in
    IDEA-20260807-4ee607's harness) and Grassi's multiple-of-8 property
    (established, recalled_unverified); this record adds nothing to either
    as a MECHANISM and instead performs the missing local BASELINE
    REPRODUCTION that IDEA-20260805-5b8f95 identifies this program as
    currently lacking, plus an honest, clearly-labelled independent
    extension attempt.
  novelty_status: unverified
  citations:
    - ref: "eprint.iacr.org/2026/1039 (Yan, Tan, Qi, 'Related-Differential Distinguishers on up to 7 Rounds of AES')"
      provenance: retrieved
      claim: >-
        First sub-codebook secret-key distinguisher for 7-round AES (2^252
        quartets); a 5-round result at 2^27.2/2^28.05 (CP) and
        2^23.32/2^23.54 (ACP) data/time combining one-round byte-wise
        related differentials with a 4-round zero-difference property.
      verified_by: "idea-generator subagent, WebSearch/WebFetch retrieval, 2026-08-28 (abstract-level summary only, not full primary text)"
    - ref: "eprint.iacr.org/2026/1286 ('Multiple-of Property for Related-Differential Distinguishers on 5-Round AES')"
      provenance: retrieved
      claim: >-
        N_q = 2^(2-n_z)*(2^w)^(n_z)*A + 8*B for a 5-round related-differential
        quartet count, verified by the authors on small-AES (w=4) and
        standard AES (w=8).
      verified_by: "idea-generator subagent, WebSearch/WebFetch retrieval, 2026-08-28 (abstract-level summary only, not full primary text)"
    - ref: "Grassi, 'Mixture Differential Cryptanalysis' / multiple-of-8 property for 4-round AES (title recalled)"
      provenance: recalled
      claim: 4-round AES balanced-quartet count is always a multiple of 8.
      verified_by: null
    - ref: IDEA-20260807-4ee607
      provenance: internal
      claim: >-
        This program's own harness for the exchange-diagonal quartet
        construction and its fibre-histogram instrumentation, reused here as
        infrastructure rather than as the tracked object.
      verified_by: "idea-generator subagent (read ledger/proposals/IDEA-20260807-4ee607.yaml in full during idea generation)"
  assumptions:
    - The pinned FIPS-197 harness is ground truth for encryption at 4 and 5 rounds.
    - IDEA-20260807-4ee607's exchange-quartet construction code (or an
      independently re-implemented equivalent) is available or cheaply
      rebuildable in this session's budget.
    - The exact quartet definition in the 2026 papers is NOT assumed known;
      the 5-round extension attempted here is this record's own, clearly
      labelled as independent and possibly different from the papers' actual
      construction.
  proof_search_map:
    not_applicable_reason: >-
      Not proof-oriented. This is an empirical baseline-reproduction and
      extension-search control. The applicable cheap audits are discharged
      inline: baseline reproduction IS the record's first gate (4-round
      multiple-of-8, hand-known); the observation collision is the random-
      permutation null (does the SAME residue appear on the null object,
      which would mean the instrument reads group symmetry rather than AES
      structure); there is no quantifier-order claim beyond "for all sampled
      keys"; the method ceiling is a distinguisher, never a key recovery.
  predictions:
    - metric: balanced-quartet count mod 8 at 4 rounds, AES-128
      direction: different
      minimum_effect: exact equality to 0 mod 8 for every one of >= 20 sampled keys (fixture; any nonzero residue falsifies the harness)
    - metric: balanced/matched-predicate quartet count mod 2^c at 5 rounds (this record's own re-derived predicate), AES-128
      direction: different
      minimum_effect: a fixed nonzero residue reproducing across >= 30 independent keys with zero exceptions
    - metric: same statistic computed on a keyed random permutation of the same block size and data cost
      direction: different
      minimum_effect: no fixed residue (distribution consistent with a uniform count at the sampled data volume); a match to the AES residue falsifies the positive claim
    - metric: data cost at which any surviving 5-round congruence becomes measurable
      direction: lower
      minimum_effect: <= 2^30 chosen plaintexts total (within the 4-core/15GB/no-GPU envelope at AES-NI throughput)
  minimal_test:
    design: >-
      (1) Rebuild or reuse the exchange-diagonal quartet generator; reproduce
      the 4-round multiple-of-8 fixture over >= 20 random keys, exact
      arithmetic, no sampling. (2) From FIRST PRINCIPLES (not the unread
      PDFs), attempt the natural one-round extension: apply the exchange
      operation to TWO diagonals related by one extra round of forward
      diffusion (a "related-differential" step defined explicitly in the
      record's own working notes before any code is written), and compute
      the balanced-quartet count mod small powers of 2 at 5 rounds over
      >= 30 keys, each with >= 2^20 quartets. (3) Repeat step 2 on a
      keyed random permutation of the same block size, same data volume,
      same key count. (4) Compare distributions; report the residue and its
      reproduction rate under both.
    controls:
      - 4-round fixture must reproduce before any 5-round claim is trusted.
      - Random-permutation null at identical data cost and quartet count.
      - Independent re-implementation of the quartet generator by a second code path, checked against the first on a handful of fixed keys.
    required_metrics: [balanced-quartet residue at 4R, balanced-quartet residue distribution at 5R, same on the null, data cost, wall-clock cost]
  falsification_conditions:
    - 4-round fixture does not reproduce exactly (nonzero residue mod 8 on any sampled key) -- harness defect, stop before 5-round work.
    - A 5-round residue is found but reproduces identically on the random-permutation null at the same data cost -- the instrument is not reading AES structure.
    - No fixed residue survives across keys at 5 rounds under this record's own re-derived predicate -- a clean, honestly-scoped negative about THIS re-derivation, not about the unread papers' actual construction.
  confounders:
    - This record's own extension attempt may differ from the papers' actual (unread) construction; a negative result here does not refute the papers, and a positive result may not match their exact stated complexity.
    - Small-sample residues at 5 rounds can appear to "survive" a handful of keys by chance; the >= 30-key requirement and the null control exist specifically to guard against this.
    - Exchange-diagonal machinery inherited from IDEA-20260807-4ee607 must be independently re-verified rather than trusted, since that record's own conclusion was a closed negative for a DIFFERENT statistic (per-S-box fibre coincidence, not quartet-count congruence).
  interpretation_limits: >-
    Reduced-round only (4 and 5 rounds), RQ-AES-001 ceiling. A surviving
    congruence is a distinguisher candidate, not a key-recovery claim, and
    any positive result still requires the certificate/false-positive-rate
    discipline of docs/claims-and-verification.md before promotion. The
    2026 papers are cited at retrieved-but-unverified provenance; this
    record's positive or negative outcome is scoped to its OWN
    independently re-derived construction, not to theirs.
  heuristic_assumptions:
    - id: HA-1
      statement: >-
        The balanced-quartet predicate under the exchange-diagonal group
        action at 5 rounds is invariant under the same order-8 group that
        makes the 4-round property hold, so IF a congruence exists it is a
        multiple of 8 (or a divisor structure compatible with that group),
        not an arbitrary residue.
      rigorous_support: >-
        The 4-round case's group-invariance is a proven orbit-counting fact
        (Burnside's lemma applied to the exchange group of order 8 acting on
        quartets); whether the SAME invariance survives one more round of
        diffusion for the modified predicate is exactly what this record
        tests, not assumed.
      validation_plan: >-
        Toy-scale first: on a 4-bit-cell small-AES analogue (w=4, matching
        the 2026/1286 paper's own small-AES verification scale), exhaustively
        enumerate all quartets for >= 1000 keys at the 5-cell-analogue round
        count and check the group-invariance of the predicate directly by
        orbit inspection, before trusting the same claim at w=8. Report the
        fraction of predicate values that are NOT constant on orbits, which
        would directly falsify HA-1.
  target_complexity:
    time_exponent: >-
      No attack proposed. If a 5-round distinguisher congruence is confirmed,
      its data/time cost is a DIRECT MEASUREMENT (<= 2^30 chosen plaintexts
      total across keys in this design), not an asymptotic claim -- this is a
      toy/medium-tier reduced-round result per docs/claims-and-verification.md,
      explicitly not compared to any exponent.
    memory_exponent: negligible (quartet counters and small arrays; well under 1 GB).
    best_known: >-
      No baseline for a reduced-round AES distinguisher exists anywhere in
      this repository's frontier ledger (knowledge/frontiers/symmetric-
      cryptanalysis.yaml admits only full-round AES rows); the retrieved-
      but-unverified 2026/1039 abstract reports 2^27.2/2^28.05 (CP) at 5
      rounds as the external target this record is honestly unable to cite
      as authoritative pending primary-text verification.
    hidden_overhead: not applicable; no asymptotic form is claimed.
    tradeoff_note: not applicable; distinguisher only, no time-memory tradeoff proposed.
  dominated_by: >-
    If reproduced, this record's 5-round result (if any) is dominated by the
    2026/1039 result on the data axis by construction, since that paper's
    exact (unread) construction is presumably tuned and this record's is an
    independent honest re-derivation; the comparison cannot be made precise
    without primary-text verification, which is named as the explicit next
    step. If no congruence survives, dominated_by is n/a (no result claimed).
    Checked against all 12 filed RQ-AES-001 proposals; none establishes a
    local reduced-round baseline or tests a quartet-count congruence.
  sota_delta: >-
    Zero delta claimed until reproduction succeeds. The deliverable this
    session proposes is closing the gap IDEA-20260805-5b8f95 named: this
    program currently has NO locally-verified reduced-round AES distinguisher
    baseline at any round count, and this is the cheapest available first step
    toward one.
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
