idea:
  id: IDEA-20260808-5158fa
  added: '2026-08-08'
  proposed_by: idea-generator
  status: proposed
  question_id: RQ-CANL-63098f
  goal_id: GOAL-ENDO-001
  title: 'The CM class-field route to ECDLP dies at a single computable equality, not at a
    cost estimate: because the ECDLP modulus is n = (N, pi - 1) we have pi = 1 mod n, so Frobenius
    at p is TRIVIAL in Gal(K_n / H_O) and p splits completely in the ray class field - hence
    reduction mod p collapses the entire (O/n)^*/{+-1} torsor, killing not only the full Artin
    descent but every small-l quotient character, including the k mod l partial- information
    variants nobody has priced'
  class: mechanism
  claim: "(A) THE SETUP, EXACT. E/F_p ordinary, End_{F_p}(E) = O in K = Q(sqrt(D_0)), N prime\
    \ with N || #E(F_p) and N coprime to the conductor f_E. Since #E(F_p) = Norm(pi - 1) and\
    \ N divides it, the ideal n := (N, pi - 1) of O has norm N, and G = E(F_p)[N] = E[n].\
    \ E has a CM lift Etilde with End(Etilde) = O over the ring class field H_O, and prime-to-p\
    \ torsion reduces isomorphically, so P, Q lift to Ptilde, Qtilde in Etilde[n] with Qtilde\
    \ = [k] Ptilde. The main theorem of complex multiplication gives H_O( h(Etilde[n]) ) =\
    \ K_n, the ray class field of conductor n over K, with Gal(K_n / H_O) = (O/n)^* / image(O^*)\
    \ = F_N^* / {+-1}, acting on Etilde[n] by multiplication. So there is a UNIQUE sigma_k\
    \ in Gal(K_n / H_O) with sigma_k( h(Ptilde) ) = h(Qtilde), and k is exactly the label\
    \ of sigma_k. Computing sigma_k would solve ECDLP. (B) THE OBSTRUCTION, AS AN EQUALITY.\
    \ Let p_K be a prime of K above p. Since E is ordinary, p splits in K and p_K = (pi) is\
    \ PRINCIPAL, generated by the Frobenius pi in O. Under the Artin map, the image of a principal\
    \ prime (alpha) in Gal(K_n / H_O) = (O/n)^*/{+-1} is the class of alpha mod n. But by\
    \ construction n = (N, pi - 1), so\n                        pi = 1  (mod n).\nTherefore\
    \ the Artin symbol of p_K is TRIVIAL in Gal(K_n / H_O): p splits completely in K_n / H_O,\
    \ and every prime of K_n above p has residue field equal to that of H_O, which is F_p\
    \ because j(E) lies in F_p. (C) WHAT THAT KILLS, AND IT IS A WHOLE FAMILY AT ONCE. Reduction\
    \ modulo a prime above p sends all N-1 conjugates of h(Ptilde) into F_p. The decomposition\
    \ group at p inside Gal(K_n / H_O) is trivial, so NO Frobenius-, splitting-, residue-degree-\
    \ or ramification-derived invariant of the extension distinguishes sigma_k from the identity.\
    \ In particular, for EVERY prime l dividing N - 1, the degree-l subextension L_l of K_n\
    \ / H_O - whose Galois group is the order-l quotient character chi_l of F_N^*/{+-1}, and\
    \ whose evaluation would give log_g(k) mod l, i.e. genuine Pohlig-Hellman information\
    \ about k - is also split completely at p and is equally invisible. If such a chi_l were\
    \ computable for all small l | N - 1 and N - 1 were smooth, ECDLP would fall outright;\
    \ this record shows the whole ladder collapses for one reason. (D) THE ONLY ESCAPES, NAMED.\
    \ (i) Compute in K_n itself: degree h(O) * (N-1)/w over K, i.e. about p^{3/2}, strictly\
    \ worse than rho. (ii) Compute p-adically: K_n tensor Q_p is a product of copies of Q_p\
    \ precisely because p splits completely, so p-adic precision buys nothing beyond the residue\
    \ field, and one is thrown back on lifting the POINT (lane L9), whose cost is the recorded\
    \ Xedni height obstruction. (iii) Use Frobenius at an AUXILIARY prime q != p: this is\
    \ not computable from (E, P, Q) over F_p, since it would require knowing the reduction\
    \ of Ptilde at q. The record closes (i) and (ii) on cost and (iii) on availability."
  mechanism: "The ideal n is not an arbitrary modulus: it is defined by the very congruence\
    \ pi = 1 that makes G rational over F_p. Rationality of the ECDLP subgroup and triviality\
    \ of the local Artin symbol at p are the same statement read in two languages. That is\
    \ why the class-field route cannot work: >-\n  the class field theory that would label\
    \ k is exactly the theory that\nrecords how the torsion fails to be rational, and here\
    \ it is rational by hypothesis. Reduction is a bijection on the fibre but destroys the\
    \ torsor structure, because a torsor under a group whose decomposition group is trivial\
    \ has all its points over the base residue field."
  why_not_a_renamed_known_approach: 'Nearest known approach: ECDLP-IDEA-018 "CM ray-class
    Artin descent" (present in ideas/rejected/ in this repository), which proposes exactly
    the attack in (A) and states its "likely fatal obstruction" as a COST estimate: "the ray
    field generated by N-torsion normally has degree and invariant height at least on the
    order of N ... the Artin label can simply re-encode x in a class group of comparable hardness".
    That is a difficulty, not an obstruction, and it leaves open every partial-information
    variant. This record replaces the cost estimate with a computable equality (pi = 1 mod
    n hence the local symbol is trivial), and uses it to close the small-l quotient characters
    that a cost estimate cannot reach. Nearest second: IDEA-20260806-0c9de1 identifies ECDLP
    with the diamond-operator torsor of X_1(N) -> X_0(N) and closes it with three forced values
    in characteristic p; this record is the CHARACTERISTIC-ZERO / CM version of the same torsor,
    and its obstruction (trivial decomposition group at p) is a different statement that 0c9de1
    does not make and could not, since 0c9de1 never lifts.'
  predictions:
  - observable: splitting behaviour of p in the ray class field
    metric: 'for toy CM curves with small |D_0| and small prime N | #E(F_p), the residue degree
      f(P | p) and ramification index e(P | p) of every prime P of K_n above p, computed in
      a number-field system'
    predicted: 'f = e = 1 for every such prime, in 100% of samples; equivalently the number
      of primes of K_n above each prime of H_O above p equals [K_n : H_O] = (N-1)/2. A single
      sample with f > 1 falsifies (B)'
  - observable: separation power of every small-l quotient character
    metric: for each prime l | N - 1, the number of distinct values taken by the reduction
      mod p of the L_l-conjugates of the Weber value h(Ptilde), over the (N-1)/2 conjugates
    predicted: 'exactly 1 distinct value per fibre, for every l: the character is constant
      after reduction. Any l giving >= 2 distinct values reopens the route and is a major
      positive result'
  - observable: cost of the only surviving escape
    metric: 'degree [K_n : Q] = 2 * h(O) * (N-1)/w'
    predicted: of order p^{3/2} for crypto-sized parameters, i.e. strictly worse than the
      sqrt(N) baseline by a factor of about p; stated as arithmetic, not as a measurement
  minimal_test: 'Toy, and purely in a number-field system. Choose D_0 in {-3, -4, -7, -8,
    -11} (class number 1, so H_O = K and the computation is small), and search small primes
    p with an ordinary curve E/F_p having a prime N in {5, 7, 11, 13, 17} dividing #E(F_p).
    For each: construct n = (N, pi - 1), build K_n as the ray class field of K of conductor
    n, and factor p in K_n. Record (e, f, number of primes). Then, independently, verify pi
    = 1 mod n directly by ideal arithmetic. Twenty instances suffice to make a counterexample-free
    prediction meaningful, and one counterexample settles it the other way. No curve arithmetic,
    no solver, no certificate needed.'
  controls:
  - 'NEGATIVE CONTROL (the instrument must be able to see non-splitting): repeat the computation
    with the modulus n replaced by an unrelated degree-1 prime m of O of norm M with M NOT
    dividing #E(F_p). Then pi is not 1 mod m in general and p must NOT split completely in
    K_m. If the computation reports complete splitting there too, the instrument is broken,
    not the mathematics.'
  - 'SUPERSINGULAR CONTROL: run one supersingular instance, where p does not split in K and
    the derivation does not apply. The prediction must fail there, confirming the argument
    uses ordinarity essentially.'
  - Two independent constructions of K_n (ray class field by class field theory, and by adjoining
    Weber-function values of n-torsion of a CM curve) must agree on the splitting data.
  confounders:
  - Small N makes (N-1)/2 tiny, so "one distinct value per fibre" is easy to achieve by accident.
    The negative control with modulus m is what distinguishes the effect from smallness.
  - Class number 1 collapses H_O to K, which is convenient but removes the ring-class layer;
    at least three instances should use |D_0| with h > 1 to confirm the argument does not
    depend on h = 1.
  - Weber function normalisation differs at j = 0 and j = 1728 (extra units); those instances
    must be reported separately, not pooled.
  falsification_conditions:
  - 'Any instance where p does not split completely in K_n / H_O: the equality in (B) is wrong,
    and the entire closure fails.'
  - 'Any small-l quotient character whose reduction takes more than one value on a fibre:
    the partial-information route is alive and this record is wrong on the part that matters
    most.'
  - "A construction of the Artin symbol that does not factor through reduction mod p and is\
    \ nevertheless computable from (E, P, Q) over F_p alone: >-\n  this would evade the argument\
    \ rather than contradict it, and the\nrecord explicitly invites it as the forward direction."
  interpretation_limits: This closes a FAMILY of attacks, not a problem. It says nothing about
    supersingular curves, nothing about extension fields, and nothing about routes that do
    not pass through class field theory of K. It is a derivation, not a proof in the sense
    of docs/claims-and-verification.md, and the toy computation validates the derivation at
    small N only. The statement "if such characters existed and N-1 were smooth, ECDLP would
    fall" is a conditional whose antecedent this record argues is false; it is not a claim
    that any deployed curve is at risk.
  assumptions:
  - 'E ordinary over F_p; N prime, N || #E(F_p), gcd(N, f_E) = 1.'
  - 'Main theorem of complex multiplication: the ray class field K_n is generated over the
    ring class field by Weber-function values of n-torsion of a CM curve, with Gal(K_n/H_O)
    = (O/n)^*/image(O^*) acting by multiplication [recall-confident; standard CM theory, NOT
    re-verified].'
  - Good ordinary reduction lifts prime-to-p torsion isomorphically (Serre-Tate / Deuring)
    [recall-confident].
  - The Artin symbol of a principal prime (alpha) coprime to n maps to the class of alpha
    in (O/n)^*/image(O^*) [recall-confident].
  heuristic_assumptions:
  - id: HA-1
    statement: None of the load-bearing steps is heuristic. (B) and (C) are derivations from
      stated theorems; no distributional assumption is made anywhere in the closure.
    rigorous_ingredient: Explicit reciprocity for the Artin map on principal primes, plus
      the defining identity n = (N, pi - 1).
    distribution_imitated: not_applicable
    validation_route: 'The minimal test IS the validation: the prediction f = e = 1 is exact
      and computable, so the derivation is checkable rather than sampled.'
    tail_checks: Not applicable (no distribution). The analogue is the negative control with
      an unrelated modulus, which must exhibit the opposite behaviour.
  - id: HA-2
    statement: 'For the FORWARD-GUIDANCE half only: it is assumed, not proved, that no invariant
      of the CM lift that fails to factor through reduction mod p is computable in polynomial
      time from (E, P, Q). This assumption is NOT used in the closure; it bounds only the
      claim''s optimism about escapes.'
    rigorous_ingredient: The recorded Xedni obstruction (lifted points have canonical height
      of order N; Jacobson-Koblitz-Silverman-Stein-Teske as cited in DECOMPOSITION.md L9)
      [corpus].
    distribution_imitated: Height distribution of lifted points, the same quantity lane L9
      already measures.
    validation_route: Deferred to lane L9's own height measurement; this record does not re-open
      it.
    tail_checks: deferred to L9.
  target_complexity:
    time_exponent: No improvement claimed; the record forecloses a route that, had it worked,
      would have given L_p(1/2) or better via index calculus in the ray class group, against
      the standing p^{1/2}. The foreclosed prize is therefore an exponent move, which is why
      the closure is worth recording.
    memory_exponent: Not applicable to the closure. The foreclosed route's memory would have
      been the ray-class factor base, L_p(1/2).
    best_known_baseline: Pollard rho, 0.886 sqrt(N) time and O(1) memory (KN-TECH-001/006).
    hidden_overhead_disclosure: The escape route (i) costs at least the degree of K_n, about
      p^{3/2}, which is stated exactly and hides nothing.
    time_memory_tradeoff: not applicable to a closure.
  sota_delta: 'Zero speedup. The delta is epistemic: it converts a rejected idea whose stated
    obstruction was a cost guess into a closure with a computable equality, and it extends
    the closure to the partial-information (k mod l) variants that the cost guess never covered.'
  dominated_by: 'n/a (no attack result claimed). The foreclosed route, had it existed, would
    have dominated rho; as it does not, nothing on the frontier moves. Frontier rows checked:
    rho 0.886 sqrt(N) / O(1) memory; BSGS sqrt(N) / sqrt(N); automorphism-discounted rho 0.886
    sqrt(N/r); van Oorschot-Wiener sqrt(N^3/w) / memory w. None is approached.'
  estimated_cost: "Implementation: >-\n  medium (needs a computer-algebra system that constructs\n\
    ray class fields; no bespoke code). Compute: low (small N, small |D_0|)."
  recommended_priority: high
  honest_prior_of_survival: 0.9 that the splitting prediction verifies exactly - the derivation
    is short and each step cites a standard theorem. 0.05 that a small-l character survives
    reduction (this is the outcome that would matter and the author believes it is excluded
    by the same equality). The value of the record is mostly in permanently closing a family
    that keeps being re-proposed.
  novelty_status: unverified
  novelty_screen: 'Same corpus screen as E3-01, plus: full read of ideas/rejected/ECDLP-IDEA-018_cm_ray_class_artin_descent_hypothesis.md;
    grep of ledger/proposals for "ray class|Weber|X_1(N)|diamond|Siegel unit|elliptic unit"
    (11 files, all inspected in context); full read of the relevant sections of IDEA-20260806-0c9de1.
    WEB SEARCH UNAVAILABLE; the external CM literature cited in ECDLP-IDEA-018 (Koo-Shin-Yoon;
    Jung-Koo-Shin; Schertz) was NOT verified this session and is repeated only as a pointer.'
  discriminated_from: 'ECDLP-IDEA-018 (rejected): same route, different disposition - a computable
    equality replacing a cost guess, plus the small-l quotient ladder which 018 never states.
    IDEA-20260806-0c9de1: the same torsor in characteristic p, closed by freeness of the diamond
    action; this record works on the CM lift and closes by triviality of the decomposition
    group at p, which is a strictly different obstruction and applies to a route 0c9de1 cannot
    see. IDEA-20260807-44ba75 / -13c821 / -cfe576 (L9 canonical-lift records): those concern
    heights and the lift of POINTS; this record concerns the Galois action on already-lifted
    torsion and does not use heights at all.'
