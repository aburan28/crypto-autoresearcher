  assumptions:
    - Odd n prime; q chosen per cell so that the lattice gate's condition for the intended switch-2 arm holds (q is 1 mod n for d = 1) and is recorded; cells with q not 1 mod n run switch 2 off or with d = e.
    - Toy scale q^n between 2^16 and 2^40; matched N within one bit; matched |F_V| exactly; same m, solver and budget on both arms.
    - Deployed Koblitz curves are never instances; all curves self-generated with the recipe recorded.
    - Reported literature constants are treated as reported until reproduced on this instrument.

  proof_search_map:
    bottleneck: >-
      The identity cell (k, u) = (1, 0): if the object and null pipelines
      do not charge identically there, every ratio downstream is
      uninterpretable. Secondly the lattice gate's claim that no pi-stable
      d = 1 non-subfield V exists unless q is 1 mod n.
    baseline_embedding:
      parameter_slice: (k, u) = (1, 0) is the null pipeline run on the object; d = 1, m = n is Gaudry's slice; d = 1, m = n - 1 is Joux-Vitse's slice.
      reproduction_check: >-
        Frozen fixture at n = 3, q = 2^5 and q = 31 (31 is 1 mod 3, 32 is
        2 mod 3, so the two fixtures sit on opposite sides of the gate);
        exhaustive check that the pi-stable subspaces of F_{q^3} are
        exactly those predicted from the factorisation of T^3 - 1; exact
        enumeration of decompositions for 20 targets cross-checked against
        the solver's count.
    observation_collision:
      observable: Per-stage charged cost ratios object/null at each (k, u), and the decomposition-probability and solving-degree ratios.
      distinct_preimage_search: >-
        A null curve with a different cofactor could shift factor-base
        density and mimic a relation-stage gain; density is charged as its
        own stage. A solver that exploits the object's shifted-copies
        sparsity could produce a solving-time ratio below 1 without a
        degree change; wall time and d_reg are reported separately and a
        second solver is run at one cell.
    constructive_transforms:
      - transform: specialization_pack
        proposed_object: The per-stage charge table with the two switches as factors and the identity cell as the zero of the measure.
        predicted_gain: Constants n, n, n^2, 1, 1 and sqrt(n) per stage, each measured as a ratio with its spread.
    quantifier_order: >-
      FOR ALL cells (q, n, d, m) in the ladder, FOR ALL (k, u) admissible at
      that cell, the ratio of each stage's charged cost between the object
      and the matched null equals the pre-registered constant within the
      declared tolerance; the decomposition-probability and solving-degree
      ratios equal 1. Empirical, toy-tier, no transfer.
    method_ceiling:
      strongest_certifiable_claim: >-
        'On the tested subfield curves and plain Gaudry / Joux-Vitse
        pipelines, the Frobenius gain factors into the two switches with
        the stated constants and touches neither decomposition probability
        nor solving degree, and the fully charged pipeline sits at
        (measured ratio) times Frobenius-class rho at each cell.' It
        certifies nothing about other factor bases (in particular not the
        trace-zero base of IDEA-20260906-a77711 arm B), nothing at
        cryptographic size, nothing about q = 2 with large n.
      nearby_object_control: >-
        Where the conclusion fails by construction: (i) q not 1 mod n with
        d = 1, where switch 2 cannot be turned on and the LA gain is 1;
        (ii) V = F_q, where no relation exists at all; (iii) the null
        object, where both switches are identically off. All reported.
    proof_obligations:
      - claim: Lattice gate (submodules of a cyclic F_q[T]-module and the factorisation of T^n - 1).
        responsibility: correctness
      - claim: Switch 1 linearity of conjugate relations in the same unknowns.
        responsibility: correctness
      - claim: Identity cell charges equal within noise.
        responsibility: baseline
      - claim: Per-stage constants as pre-registered.
        responsibility: runtime
      - claim: Rho class canonicalisation is a bijection on classes and costs O(n) per step.
        responsibility: interface
      - claim: All numbers scoped to the ladder, solver and budget.
        responsibility: scope
    not_applicable_reason: null

  object_first_candidate:
    tracked_object: >-
      The orbit-indexed relation matrix (rows are relations, columns are
      Frobenius orbits of factor-base points) together with the pi-stable
      subspace lattice of F_{q^n}.
    established_families_off_limits: >-
      Off-limits as the primary lens: invariant-ring rewriting of the
      decomposition system (IDEA-20260906-a77711 arm A owns it); the
      trace-zero variety (arm B); GHS descent; tau-adic expansions.
    lossiness: >-
      GENUINELY LOSSY: the projection from a relation over points to a
      relation over orbits forgets which conjugate each summand is (n to
      1 per summand) and keeps only the orbit index and the power of mu;
      it propagates deterministically under the operation set {pi, negation,
      translation by factor-base points} because all three preserve the
      orbit decomposition of the unknown space. Trichotomy: partial-action
      (translation by non-factor-base points is not tracked). Priced by
      canonicalisation: O(n) per point (minimum over the orbit).
    propagation: Exact under the named operation set; the relation matrix is a linear image of the point-indexed one.
    survival_score: >-
      Survives every subfield curve; yields only constants, which is the
      predicted content; dies as a lens once the factor base is not a
      union of orbits (u must be 0).

  null_object_control: >-
    NULL OBJECT, BLOCKING, MATCHED (RQ constraint 1): E'/F_{q^n} with
    j(E') generating F_{q^n}, prime-order subgroup with N' within one bit
    of N, identical |F_V|, m, solver and budget; the same code with the
    orbit bookkeeping running (on E' every orbit has size 1, and the code
    must report k = 1 and u irrelevant). DECAY KNOBS: k in {1, ..., n}
    (relations kept per solve) with predicted solve count |F_V|/(k n^u);
    u in {0, 1} where the lattice gate permits; the identity cell (1, 0)
    must equal the null within the run-to-run spread; a stage ratio flat
    in k is the artifact tell. PLANTED CONTROL: V = F_q, predicted zero
    relations; and a deliberately non-stable V at u = 1, which must be
    refused by the gate, not silently run.

  discriminated_from:
    - >-
      IDEA-20260906-a77711 -- NEAREST RECORD (same session). It proposes
      the mechanism (free-action closure of the symmetry lens and the
      trace-zero variety as the exponent lever). EXACT DELTA: this record
      runs no invariant rewriting and no trace-zero base; it charges the
      PLAIN pipeline stage by stage with the two switches separated by an
      identity cell, under both matching conventions, and supplies RQ
      decision (a); a77711 supplies decision (b)'s mechanism arm.
    - >-
      eprint 2020/1315 -- NEAREST PRIOR ART. Frobenius-invariant factor
      bases, 1/n and n^2, experiments on solving cost. DELTA: matched
      non-subfield null at every cell, Frobenius-class rho row, the
      identity cell, the explicit convention split that decides whether
      the reported 1/n is a matched-size or matched-unknown figure.
    - >-
      IDEA-20260807-45a69f. Prime-field orbit bases reduce to BSGS. DELTA:
      on a subfield curve the base is cut out by a linear condition, so
      the orbit trick does not cancel; this record measures exactly what
      it buys and gates it by the lattice.
    - >-
      GHS (KN-LIT-007, 090, 6987, 449). Comparison row at n in {3, 5, 7}
      only, genus recorded; not an arm.
    - >-
      RQ-PFDR-ae2fba, RQ-SBRG-f31cb2, RQ-ECTD-001 exclude descent and
      subfield structure by scope; nothing here transfers to them.

  predictions:
    - metric: C0 -- identity cell (1, 0), object/null ratio of every stage's charged cost
      direction: different
      minimum_effect: PREDICTED 1 within twice the run-to-run spread on every stage; otherwise the instrument is void.
    - metric: C1 -- lattice gate check, the set of pi-stable subspace dimensions of F_{q^n} found by exhaustive search at n = 3, q in {2^5, 31} and n = 5, q in {2^4, 11}
      direction: different
      minimum_effect: FORCED equality with the set predicted from the factorisation of T^n - 1 over F_q.
    - metric: C2 -- decomposition probability per target and d_reg per system, object/null ratio at every (k, u)
      direction: different
      minimum_effect: PREDICTED 1 for the probability within 3 standard errors over at least 400 targets per cell, and identical d_reg; a replicated ratio outside that is handed to a77711 arm A.
    - metric: C3 -- relations per successful solve, object
      direction: higher
      minimum_effect: FORCED, exactly k after certificate verification of every conjugate relation.
    - metric: C4 -- solves needed to reach full rank, object/null ratio at (n, 1) under matched |F_V|
      direction: lower
      minimum_effect: Between 1/(2 n^2) and 2/n^2; under matched unknowns, the ratio and the decomposition-probability change are both reported and the convention that yields about 1/n is named.
    - metric: C5 -- linear algebra wall time and operation count, object/null ratio at u = 1
      direction: lower
      minimum_effect: Between 1/(4 n^2) and 4/n^2 (sparse Wiedemann or Lanczos scales with dimension squared times row weight; the band absorbs constants).
    - metric: C6 -- Frobenius-class rho on object divided by negation rho on null, group operations, 20 instances per cell
      direction: lower
      minimum_effect: Between 0.7/sqrt(n) and 1.4/sqrt(n).
    - metric: C7 -- fully charged index calculus divided by Frobenius-class rho on the object, per cell
      direction: different
      minimum_effect: Reported with no threshold; any cell below 1 triggers replication and independent review (RQ decision target b).

  minimal_test:
    design: >-
      STAGE 0 (zero compute, HARD GATE): derive the lattice gate and
      verify C1 by exhaustive enumeration of pi-stable subspaces at the
      four small cells. STAGE 1 (minutes): build the ladder, object curves
      with (a, b) in F_q, null curves by the recipe; exact point counts;
      matched N and |F_V|; record q mod n per cell. STAGE 2 (hour): the
      identity cell C0 at n = 3, q = 2^5 and q = 31, object and null, the
      full pipeline with certificates, 5 repetitions each. STAGE 3 (hours):
      the (k, u) grid at n = 3 and n = 5, d = 1 with m = n and m = n - 1,
      q chosen on both sides of the gate; every stage charged; C2-C5.
      STAGE 4 (hours): rho rows C6 and the ratio C7 on every cell; GHS row
      where applicable. STAGE 5: pre-registered thresholds. CHEAPEST VALID
      DISCRIMINATOR: Stage 0 plus Stage 2 -- if the identity cell fails
      nothing else is meaningful, and if it holds, one (n, 1) cell at
      n = 3, q = 31 decides C2 and C4 in under an hour.
    controls:
      - Matched non-subfield null at every cell (blocking).
      - Identity cell (1, 0) and the k, u decay grid (blocking).
      - Planted V = F_q (zero relations) and a non-stable V at u = 1 (must be refused).
      - Frobenius-class rho with negation on the object and negation-only rho on the null (mandatory baseline).
      - GHS row at n in {3, 5, 7} where KN-LIT-449's condition holds, genus recorded.
      - Certificates on every relation (group identity) and every solve ([x]P = Q), re-verified by the run wrapper.
    required_metrics:
      - per-stage charged operations and wall time for factor-base construction, decomposition attempts (failed and successful), orbit expansion, linear algebra, descent, verification, both arms, every (k, u)
      - decomposition probability per target with standard error, d_ff and d_reg per system with the solver named
      - unknown count, relations collected, rank, solves needed, both conventions
      - rho group operations per instance with mean and standard error, class canonicalisation cost per step
      - the pi-stable subspace lattice per (q, n) and q mod n
      - sha256 of curves, factor bases, targets, seeds

  falsification_conditions:
    - F1. C0 fails. Instrument void; nothing read.
    - F2. C1 fails. The lattice gate as stated is wrong; the record is superseded.
    - F3. C2 shows a replicated ratio different from 1 on the object and not on the null. The Frobenius touches the single-target system; handed to a77711 arm A as a live symmetry lens.
    - F4. C4 or C5 outside their bands at (n, 1) with C0 and C3 holding. The unknown-reduction accounting is wrong; the measured constant replaces the predicted one and the convention question is re-opened.
    - F5. C6 outside its band. Rho-class implementation fault; no C7 may be read.

  confounders:
    - CHARACTERISTIC 2 adds 2-torsion symmetries; object and null share the characteristic and the primary ladder is odd characteristic.
    - COFACTOR DENSITY differs between arms; charged as its own stage.
    - SOLVER SPARSITY HEURISTICS may lower object solve times without a degree change; d_reg and wall time reported separately, second solver at one cell.
    - SMALL q AT n = 5 makes |F_V| = q tiny and the linear algebra trivial, so C5 is only read where the LA stage exceeds one second on the null.
    - MATCHING CONVENTION is itself a confounder for the literature comparison; both are reported.

  interpretation_limits:
    - Toy tier (claim_tier toy) at q^n between 2^16 and 2^40; no transfer.
    - A control record; it mounts no attack and moves no exponent; its positive deliverable is a table of constants with the convention named.
    - Nothing bears on deployed Koblitz curves, prime-field curves, or GOAL-ECDLP-001.
    - No experiment, hypothesis, approval, status transition or run is created by this record.

  heuristic_assumptions:
    - id: H1
      statement: >-
        PLAIN DECOMPOSITION PROBABILITY. A uniformly random target in G is a
        sum of m factor-base points of F_V (d = 1) with probability about
        |F_V|^m / (m! N) at m = n, and about that times 1/q at m = n - 1.
      rigorous_support: >-
        Gaudry's and Joux-Vitse's heuristics (recalled), imitating the
        count of solutions of a zero-dimensional system of expected size 1
        (or 1/q); rigorous only as the mean via conservation (KN-FIND-007
        style counting, internal).
      validation_plan: >-
        Exact enumeration at n = 3, q up to 2^7, of decompositions for 400
        targets per cell, both arms; compare to the formula; tail check on
        the maximum multiplicity; the ratio between arms is the quantity
        that matters and is reported with its standard error.
    - id: H2
      statement: >-
        ORBIT SIZE. Every point of a pi-stable F_V outside E(F_q) has a
        Frobenius orbit of size exactly n.
      rigorous_support: Exact (n prime, pi^n trivial on E(F_{q^n}), pi nontrivial on any point not in E(F_q)); listed so that its count is verified, not assumed.
      validation_plan: Exhaustive orbit count on every factor base built; any orbit of size other than 1 or n voids the cell.
    - id: H3
      statement: >-
        RHO CLASS COUNT. Frobenius-class rho with negation behaves as rho
        on N/(2n) classes with expected sqrt(pi N/(4n)) steps.
      rigorous_support: Recalled analyses (Wiener-Zuccherato; Gallant-Lambert-Vanstone) of rho on equivalence classes, imitating the birthday bound on the class set; fruitless cycles handled by the standard escape.
      validation_plan: 20 instances per cell at each toy N; compare the mean to sqrt(pi N/(4n)); tail check on the maximum.

  target_complexity:
    time_exponent: >-
      NO EXPONENT CLAIM. Relation collection on the plain d = 1 pipeline
      stays at Gaudry's q^(2 - 2/n + o(1)) class (reported) with the
      constants n^u k^(-1) on solves; rho stays at N^(1/2) with 1/sqrt(n).
    memory_exponent: About |F_V|/n^u for the linear algebra; O(1) for rho.
    best_known: >-
      Frobenius-class rho with negation at sqrt(pi N/(4n)); eprint
      2020/1315's Frobenius-invariant index calculus with 1/n and n^2
      (reported); GHS where applicable.
    hidden_overhead: >-
      All of it in n: the summation polynomial size 2^O(n^2), the m!
      solves per relation, and the Groebner cost's dependence on q that
      H1-H3 of a77711 and RQ-DREG-001 show is not flat at toy scale.
    tradeoff_note: Relation collection parallelises; rho parallelises with O(1) memory and dominates whenever n is not fixed and small.

  dominated_by: >-
    Checked row by row on the extension-field frontier: (1) Frobenius-
    class parallel rho with negation dominates on memory at every cell and
    on time at every toy cell where index calculus has not crossed over;
    (2) eprint 2020/1315's Frobenius-invariant index calculus is the same
