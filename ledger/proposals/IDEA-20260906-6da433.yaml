idea:
  id: IDEA-20260906-6da433
  question_id: RQ-FROB-7d8dd4
  goal_id: null
  added: '2026-09-06'
  title: >-
    STAGE-CHARGED FROBENIUS ACCOUNTING ON THE PLAIN GAUDRY PIPELINE WITH
    TWO SWITCHES AND A LATTICE GATE. The Frobenius gain of a subfield curve
    factors EXACTLY into two independent switches, orbit multiplication
    (k conjugate relations per solve, k in 1..n) and orbit indexing of
    unknowns (available only when the factor base is pi-stable), and the
    pi-stable factor bases are exactly the submodules of the cyclic
    F_q[T]/(T^n - 1)-module F_{q^n}, so a pi-stable one-dimensional
    non-subfield V exists if and only if q is 1 mod n. With both switches
    off the object pipeline is the null pipeline and must charge
    identically; with both on the predicted constants are n on relations
    per solve, n on unknowns, n^2 on linear algebra and 1 on decomposition
    probability and solving degree, against sqrt(n) on Frobenius-class rho.
    The record pre-registers both matching conventions (matched factor-base
    size, matched unknown count) because eprint 2020/1315's abstract reports
    1/n on polynomial systems where this record's matched-size accounting
    predicts n^2, and the instrument reports which convention the
    literature figure belongs to
  class: control

  claim: >-
    SETTING as in IDEA-20260906-a77711 (E/F_q, n odd prime, G of prime
    order N not in a proper subfield, pi acting on G as mu of order n).
    Plain pipeline: factor base F_V = {P with x(P) in V}, V an
    F_q-subspace of F_{q^n} of dimension d, decomposition into m summands
    via S_{m+1} and Weil descent (Gaudry d = 1, m = n; Joux-Vitse d = 1,
    m = n - 1), unknowns the logs of F_V, sparse linear algebra, descent
    of the target.

    LATTICE GATE (exact, zero compute). Frobenius pi acts F_q-linearly on
    F_{q^n} with minimal polynomial T^n - 1 and F_{q^n} is a cyclic
    F_q[T]-module (normal basis theorem), so its pi-stable subspaces are in
    bijection with the monic divisors of T^n - 1 over F_q. For n prime,
    (T^n - 1)/(T - 1) is the product of (n - 1)/e distinct irreducibles of
    degree e = ord_n(q). Hence a pi-stable V of dimension d exists if and
    only if d = a + b e with a in {0, 1} and 0 <= b <= (n - 1)/e. In
    particular a pi-stable one-dimensional V other than F_q exists iff
    e = 1 iff q is 1 mod n; a pi-stable two-dimensional V exists iff
    q is +-1 mod n; and F_q itself is useless because G meets E(F_q)
    only in O (no target in G decomposes over E(F_q) for n odd).

    SWITCH 1, ORBIT MULTIPLICATION (any V). A relation R = sum P_i
    conjugates to R^(pi^j) = sum P_i^(pi^j) with log P_i^(pi^j) = mu^j
    log P_i, linear in the SAME unknowns whether or not P_i^(pi^j) lies
    in F_V. So one solve yields up to n relations; the knob k in 1..n is
    how many are kept.

    SWITCH 2, ORBIT INDEXING (pi-stable V only). When F_V is pi-stable its
    q^d points fall into orbits of size n (except the F_q-rational ones),
    and one unknown per orbit suffices; the knob u in {0, 1} is whether
    unknowns are indexed by orbits.

    PREDICTED CONSTANTS, PRE-REGISTERED, at matched factor-base size |F_V|
    and matched m and N against the null object E'/F_{q^n}. Decomposition
    probability per target and solving degree per system: ratio 1 (the
    Frobenius does not enter a single-target system; IDEA-20260906-a77711
    Lemma A1-A2). Relations per successful solve: k. Unknowns: |F_V| at
    u = 0, |F_V|/n at u = 1. Solves needed: |F_V|/k at u = 0, |F_V|/(nk) at
    u = 1. Linear algebra cost ratio: 1 at u = 0, 1/n^2 at u = 1 (sparse
    dimension squared). Frobenius-class rho on the object against
    negation-only rho on the null: 1/sqrt(n) in expectation. At (k, u) =
    (1, 0) the object and null pipelines are the same program and every
    stage must charge identically within noise. At (k, u) = (n, 1) the
    relation-collection stage gains n^2 under matched base size, and the
    total pipeline gains between n and n^2 depending on which stage
    dominates at the cell.

    THE LITERATURE DISCREPANCY THE INSTRUMENT RESOLVES. eprint 2020/1315
    (abstract, retrieved) states that a reduction of the number of
    polynomial systems by 1/n 'is the best one could hope for' and that
    linear algebra gains n^2. Under this record's matched-size accounting
    the solve count gains n^2 with both switches on; under matched
    UNKNOWN count (null base of size |F_V|/n, whose decomposition
    probability is lower by about n^m) the comparison is different again.
    The record therefore reports every stage under BOTH conventions and
    states which one reproduces the reported 1/n; the abstract does not
    say which convention it uses and the full text was not read.

    WHAT EACH OUTCOME MEANS. (a) All predicted ratios hold, including the
    ratio-1 rows for decomposition probability and solving degree, and
    the (1, 0) identity: the Frobenius gain on the plain pipeline is a
    product of constants, RQ decision (a), recorded as a controlled
    result with the constants and the convention named. (b) The
    decomposition-probability or solving-degree ratio differs from 1 on
    the object, replicated, and not on the null: something beyond the two
    switches is present and it is handed to IDEA-20260906-a77711's arm A
    for mechanism. (c) The (1, 0) identity fails: the instrument is
    broken and nothing is read.

  mechanism: >-
    Switch 1 is the linearity of logarithms under an endomorphism that
    acts as a scalar on G; it needs nothing from the factor base. Switch 2
    is a change of basis of the unknown space, from points to orbits,
    which is only well defined when the factor base is a union of orbits,
    and the lattice gate says when that can happen for a subspace-cut
    base: the pi-stable subspaces are the submodules of a cyclic module,
    which are read off the factorisation of T^n - 1, and that
    factorisation is controlled by ord_n(q). Neither switch touches the
    polynomial system of one target, which is why the decomposition
    probability and the solving degree are predicted at ratio 1. The
    rho baseline gains sqrt(n) because the class size under negation and
    Frobenius is 2n (canonicalisation by the minimum over 2n conjugates
    of a coordinate encoding), and rho's cost scales as the square root
    of the number of classes.

  novelty_status: unverified

  novelty_screen:
    method: >-
      THE crypto-kb INDEX WAS EMPTY THIS SESSION (':memory:'); search_
      knowledge was NOT called. Screening by the same reads as
      IDEA-20260906-a77711 (RQ-FROB-7d8dd4, KN-LIT-010/007/090/6987/449/
      1402/3685, RQ-PFDR-ae2fba, RQ-SBRG-f31cb2, RQ-ECTD-001, the claim
      section of IDEA-20260807-45a69f, ripgrep over ledger/proposals for
      Frobenius and subfield terms), plus the abstract page of eprint
      2020/1315 opened with WebFetch. Full text not read.
    results: >-
      2020/1315 constructs Frobenius-invariant factor bases with the 1/n
      and n^2 factors and studies solving costs experimentally; the
      lattice gate here is elementary module theory the paper very likely
      contains in some form ('we show how to choose factor bases to
      achieve this'). No ledger record charges the plain pipeline stage by
      stage on a subfield curve against a matched non-subfield null with
      Frobenius-class rho, or separates the two switches with an identity
      cell.
    verdict: >-
      UNVERIFIED. The constants are known (reported); the lattice gate is
      classical algebra; the contribution claimed is the instrument
      design (two switches, identity cell, both conventions, rho classes)
      required by the RQ's decision target (a). A referee reading
      2020/1315 in full may find the instrument largely present there,
      in which case this record is a replication design.

