  title: >-
    A short-Weierstrass equation has degree 3 and a line has degree 1
  class: representation
  claim: >-
    A short-Weierstrass equation has degree 3. A line has degree 1.
    Three exceeds one by 2. The product of the two degrees is 3.
    Their sum is 4. The gap is an equation degree, not an ECDLP
    exponent.
  mechanism: >-
    OBJECT FRAME. The object is the pair of equations. The operation
    set is intersection of the line with the cubic. This record
    counts those two degrees and does not form an eliminant. It
    does not build a chord matrix. Two lines both have degree 1,
    so that gap is 0.
  novelty_status: unverified
