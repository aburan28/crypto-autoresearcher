    "title": "Separator interpolants as a two-free-block finite-field propagator",
    "class": "algorithm",
    "claim": "R3 representation at the decomposition/relation stage. A reusable low-degree separator polynomial can refute a positive fraction of two-free-block rectangles for less work than enumerating one block. Require total per-target cost below half the (m-1)-block-loop/root-finding baseline, with no excluded true decomposition.",
    "mechanism": "Object: a small family of certified separator polynomials with rectangle exclusion witnesses. Operation set Sigma: restrict assigned blocks, evaluate separator consequences on two remaining block domains, split only surviving rectangles. Trichotomy: branching; this is a solver/representation object, not a lossy quotient under the full group translation action. Discarded information: a two-block domain is summarized by which certified consequences can vanish; ambiguous rectangles branch and retain witnesses. For m=3 prime-field digit systems, eliminate internal chain variables locally to obtain h(u,v) in the elimination ideal, with a multiplier identity bounded at a declared construction degree E. Use subproduct evaluation on digit-domain rectangles and exact gcd/resultant tests to certify empty rectangles. D, the output degree, is distinct from E, the cost of producing h. A low-degree output with an expensive E buys nothing.",
