idea:
  id: IDEA-20260816-6a7fa4
  question_id: RQ-ALPF-001
  added: '2026-08-16'
  title: 'The ALPF lane measured an algebraic degree and never checked whether that degree predicts
    the thing it stands in for: on the same toy instances, actually solve for a decomposition and
    verify its certificate, then report how often an early-fall cell yields a certified decomposition
    compared with a quiet cell.'
  class: control
  claim: '(A) EV-ALPF-001 states plainly that certificates were not re-verified and that claim_tier
    toy is a hard ceiling. Every ALPF verdict is a statement about d_ff versus D_reg_pred -- an algebraic
    degree standing in for the solvability of a decomposition system. The step from ''the first fall
    is early'' to ''a decomposition is found'' is the entire reason the degree is measured, and it
    has never been checked in this lane. (B) The claim is that at the archived toy sizes the endpoint
    is directly reachable: with |FB| = 5 or 20 and a 13-bit prime, the decomposition system can be
    settled by exhaustive enumeration over factor-base tuples, and any solution found yields a certificate
    that harness/semaev.py''s verify_decomposition_certificate accepts or rejects. So proxy and endpoint
    can both be measured on the same instance in one invocation, and their association is a 2x2 table
    with a prevalence attached. (C) The claim is further that the association will be weak or absent
    for the pullback representations, because the archived EXP-ALPF-007 table shows pullback rows
    with d_ff = 1 and D_reg = 1 -- degrees so collapsed the verdict has no room to discriminate --
    while the descent obstruction recorded in H-ALPF-017 and the SCOPED_NEGATIVE of EXP-ALPF-009 (''d_FB
    fixed, D_reg fixed, BUT descent blocked'') are exactly cases where the degrees looked acceptable
    and the endpoint was unreachable. If degree and certificate are unassociated, the screen measures
    something real about polynomial systems that is not the thing the campaign needs. (D) NOT CLAIMED:
    that any decomposition is efficient; that exhaustive enumeration is an attack; that d_ff is a
    bad proxy in general; that any archived verdict is wrong. Enumerating tuples at 13 bits costs
    far more than the instance is worth and is used purely as ground truth for an instrument check.'
  mechanism: 'STAGE 1: build toy instances with harness/toycurve.py and factor bases with harness/semaev.py
    build_factor_base. STAGE 2: for each instance and representation, meter d_ff with the shared pure-Python
    Macaulay meter and record the verdict exactly as the screen does. STAGE 3: independently and in
    the same invocation, determine ground truth by direct enumeration -- run over factor-base tuples
    of the stated arity, test the Semaev relation with s3_eval or the s4 expression, and where a relation
    holds assemble a decomposition certificate and pass it to verify_decomposition_certificate. This
    endpoint is obtained without using the degree at all. STAGE 4: cross-tabulate verdict against
    certified-decomposition-found, per representation, giving sensitivity and specificity of the degree
    proxy against the endpoint. STAGE 5: report the association with a Fisher exact test per representation
    and pooled, and report separately the prevalence -- the rate at which a uniformly random target
    admits a certified decomposition over the given base -- since sensitivity and specificity are
    meaningless without it. STAGE 6: print every discordant instance in full: fired without certificate,
    and certificate without fire. Refutation: if verdict and certificate are independent at every
    representation, the proxy is uninformative about the endpoint at these sizes, which is a cheap,
    strong, measured obstruction redirecting the lane toward endpoint-level screening.'
  novelty_status: unverified
  novelty_screen:
    method: grep -ril 'ALPF' ledger/proposals/ ; grep -rn 'verify_decomposition_certificate|_find_decomposition|measure_s3_decomposition'
      harness/semaev.py ; read ledger/evidence/EV-ALPF-001.yaml boundaries block, ledger/hypotheses/H-ALPF-017.yaml,
      the EXP-ALPF-009 and EXP-ALPF-007 observation lines in EV-ALPF-001, experiments/EXP-ALPF-007/analysis.md
      pullback degree table, docs/inventor-protocol.md section 6.
    results: Zero proposals reference ALPF. harness/semaev.py already exposes measure_s3_decomposition
      (line 92), _find_decomposition (line 147) and verify_decomposition_certificate (line 174), so
      the endpoint machinery exists in this repository and is entirely unused by the ALPF lane, whose
      packages were archived without re-execution. EV-ALPF-001's boundaries block states 'Historical
      import; certificates not re-verified' and 'claim_tier toy is a hard ceiling for this evidence
      record'. H-ALPF-017 records that all four structural fixed-degree candidates have provable algebraic
      obstructions blocking auto-descent into the prime-order subgroup, and EV-ALPF-001's EXP-ALPF-009
      observation reads 'SCOPED_NEGATIVE -- d_FB fixed, D_reg fixed, BUT descent blocked' -- precisely
      a committed case of proxy-endpoint dissociation, recorded once as an anecdote and never as a
      rate. IDEA-20260815-f9e978 (P(decomp) as a distribution) is the nearest proposal-corpus relative
      and concerns the decomposition probability itself, not its association with a degree proxy.
    verdict: 'UNVERIFIED. No literature claim in either direction. Assembled from known parts: the
      certificate machinery already in harness/semaev.py, the archived degree verdicts, and elementary
      2x2 diagnostic-accuracy statistics. Claimed new relative to this repository: (i) measuring the
      PROXY-TO-ENDPOINT association within one invocation on the same instances, which no ALPF record
      does and which the import explicitly forgoes; (ii) reporting sensitivity and specificity of
      d_ff against a verified decomposition rather than treating d_ff as the result; (iii) generalising
      the single committed anecdote in EXP-ALPF-009 into a measured association with a prevalence
      attached. Distinct from IDEA-20260815-f9e978, which studies the endpoint''s own distribution
      with no proxy in the design.'
  object_first_candidate:
    tracked_object: The pair (screen verdict, certified decomposition exists) on one instance -- the
      proxy and its endpoint carried together through the same pipeline, so their association rather
      than either alone is the object.
    lossiness: 'Genuinely lossy on both components. The verdict discards everything except a rank-deficit
      indicator; the certificate discards everything about HOW the decomposition was found and retains
      only that a verified relation exists among named factor-base elements. Both projections are
      compatible with the operation of interest -- deciding whether this instance decomposes over
      this factor base -- because both are functions of the instance and the base alone. Non-injectivity
      is severe on both sides, and the content lives entirely in the joint distribution. Stated honestly:
      the certificate component is close to a complete answer for the instance, so what is lost there
      is the search process, not the mathematical content.'
    propagation: One step of the target operation is the addition of one element to the factor base.
      On the verdict component this changes the degree profile and hence D_reg_pred, moving the fire
      threshold in a way the archived tables already display, since the |FB| = 4 and |FB| = 5 rows
      differ. On the certificate component it monotonically increases the chance a certified decomposition
      exists, since a larger base can only add relations. The two components therefore move in a predictable
      relative direction under this step, and any instance where enlarging the base creates a certificate
      while flipping the verdict from fire to quiet is a printable, direct falsifier of the proxy's
      monotone reading.
    survival_score: 'The pair survives while exhaustive tuple enumeration is affordable: at |FB| =
      5 arity 3 that is 10 tuples per target, at |FB| = 20 arity 3 it is 1140, both trivial. The binding
      limit is the field size, since the decomposition existence rate falls and the enumeration cost
      rises together; the structure dissolves as affordable ground truth somewhere around 21 to 25
      bits at these base sizes, and the experiment therefore caps the endpoint arm at 17 bits and
      says so rather than discovering it mid-run.'
  null_object_control: 'The null object is a target point drawn uniformly at random from the group,
    with no planted decomposition, whose decomposability over the given base is whatever the base
    rate happens to be. The IDENTICAL proxy metering and the IDENTICAL exhaustive enumeration run
    on it in the same invocation. For the association to mean anything the null arm must establish
    the PREVALENCE, because sensitivity and specificity are uninterpretable without it and a proxy
    can look excellent purely by matching a prevalence near 0 or near 1. A second null is a scrambled-verdict
    control: the same instances with verdicts permuted, which must show no association, confirming
    the Fisher test is calibrated on this design and this sparsity.'
  discriminated_from:
  - EV-ALPF-001's EXP-ALPF-009 observation ('d_FB fixed, D_reg fixed, BUT descent blocked') is one
    anecdote of proxy-endpoint dissociation in one construction. This measures the association systematically
    across representations with a prevalence and a test, turning that anecdote into a rate.
  - IDEA-20260815-f9e978 treats P(decomp) as a distribution rather than a scalar and studies the endpoint
    alone. This entry's endpoint arm yields such a rate as a by-product, but its object is the JOINT
    distribution with the screen verdict, which f9e978 does not consider.
  - The planted-positive control entry in this same batch constructs decompositions so they exist
    by fiat. This entry does the opposite, leaving decomposition existence to chance and measuring
    the base rate, which is why the two are complementary and why both are needed to interpret either.
  - 'IDEA-20260815-fa56e7 (relation-collection duplicate accounting) concerns accounting inside relation
    collection. No relation collection is run here: one decomposition per target is sought and certified,
    and there is no linear algebra stage at all.'
  - H-ALPF-017's descent obstruction is a structural algebraic argument about fixed-degree membership
    conditions. This entry measures an empirical association and neither re-derives nor contests that
    argument; it cites it as the reason to expect dissociation for those constructions.
  assumptions:
  - harness/semaev.py's verify_decomposition_certificate is a correct and independent verifier, so
    a passing certificate is genuine ground truth.
  - Exhaustive tuple enumeration is affordable at |FB| up to about 20 with arity 3, which it is at
    these sizes.
  - A target with no certified decomposition at the stated arity genuinely has none; partial enumeration
    is reported as partial and its endpoint recorded as unknown rather than negative.
  - Proxy and endpoint run on the identical instance object in one process, so no instance mismatch
    can occur.
  - The prevalence at some tested factor-base size lies strictly between 0 and 1; if not, the arm
    is resized and the change is reported as a design change.
  predictions:
  - metric: prevalence of certified decompositions for random targets at |FB| = 5, arity 3, 13-bit
      prime
    direction: different
    minimum_effect: 'refuse to pre-commit a value: the prevalence is a function of |FB| and the group
      order that this arm exists to measure, and guessing it would defeat the purpose'
  - metric: Fisher exact association between fire verdict and certificate existence, pooled
    direction: different
    minimum_effect: 0
  - metric: association for the pullback representation
    direction: lower
    minimum_effect: 'forced: predicted indistinguishable from independence, since the archived pullback
      rows show d_ff = D_reg = 1, a collapsed degree that cannot discriminate'
  - metric: scrambled-verdict control association
    direction: lower
    minimum_effect: 0.05
  - metric: certificate verification pass rate on candidates produced by the enumerator
    direction: higher
    minimum_effect: 1.0
  minimal_test:
    design: 'One prime, two representations, one factor-base size, 100 random targets. At a 13-bit
      prime with |FB| = 5, draw 100 uniformly random target points. For each, in one process: build
      the x-ring baseline and e-ring representations, meter d_ff and record the verdict; then enumerate
      all C(5,3) = 10 factor-base triples with sign variants, test the Semaev relation, and where
      one holds assemble a certificate and verify it. Cross-tabulate. In the same invocation run the
      scrambled-verdict control. The discriminating outputs are the prevalence and one 2x2 table per
      representation. If prevalence is near 0 at |FB| = 5, enlarge the base to 20 and repeat -- 1140
      triples per target, still trivial -- and report the enlargement as a design change. Minutes
      of compute, and it settles whether the verdict has any association at all with the endpoint
      it stands in for.'
    controls:
    - Uniformly random targets with no planted decomposition, establishing the prevalence in the same
      invocation.
    - Scrambled-verdict control on the same instances, which must show no association.
    - Certificate verification by harness/semaev.py's independent verifier rather than by the enumerator
      that produced the candidate.
    - 'Enumeration-completeness assertion: tuples tested reported against the combinatorial total
      for the stated arity, per instance.'
    - Factor-base-size contrast at |FB| = 5 and |FB| = 20, so prevalence and association are each
      measured at two prevalences.
    - Representation contrast including at least one pullback representation, whose collapsed degrees
      predict null association.
    required_metrics:
    - prevalence of certified decomposition per (prime, |FB|)
    - 2x2 table of verdict against certificate existence, per representation
    - Fisher exact p-value and odds ratio per representation and pooled
    - sensitivity and specificity of the verdict against the certificate endpoint
    - tuples enumerated versus combinatorial total per instance
    - full list of discordant instances (fired without certificate; certificate without fire)
    - certificate verification pass rate on candidates
  falsification_conditions:
  - Verdict and certificate independent at every representation, establishing the degree proxy as
    uninformative about the endpoint at these sizes -- a usable measured obstruction.
  - Prevalence of 0 or 1 at every tested factor-base size, making the association untestable and requiring
    a resize rather than a report.
  - The scrambled-verdict control showing association, indicating the test is mis-calibrated on this
    design.
  - Any candidate failing verify_decomposition_certificate, indicating the enumerator produces invalid
    relations and voiding the endpoint arm.
  - Enumeration incomplete on more than 5 percent of instances, whose endpoints are then unknown rather
    than negative.
  - The pullback representation showing strong association, falsifying the collapsed-degree prediction
    in claim (C).
  confounders:
  - Prevalence depends jointly on |FB|, arity and group order, so an association measured at one prevalence
    need not hold at another; the two-|FB| contrast bounds this only crudely.
  - Verdict and endpoint both depend on the factor base, so part of any association is shared dependence
    on |FB| rather than proxy validity.
  - Exhaustive enumeration at small |FB| gives a low prevalence, pushing the 2x2 table into a sparse
    regime where Fisher is exact but underpowered.
  - Sign and ordering conventions in the Semaev relation can cause a genuine decomposition to be missed,
    manufacturing false negatives on the endpoint arm.
  - At 13 bits the group is small enough that random targets may decompose for degenerate reasons
    unrelated to factor-base structure.
  interpretation_limits:
  - Certified decompositions here are found by exhaustive enumeration whose cost exceeds any interest;
    a certificate is ground truth about the instance and is not a solving result, and citing it as
    one would be fabrication.
  - Sensitivity and specificity are conditional on the measured prevalence and do not transfer to
    a different prevalence regime.
  - The result is scoped to these primes, factor-base sizes, arities and representations, with no
    transfer to medium or cryptographic scale.
  - A null association scopes what a degree verdict licenses; it does not show the degree measurement
    was wrong, and the archived degree observations remain valid measurements of what they measured.
  target_complexity:
    time_exponent: No attack exponent is claimed. The endpoint arm costs C(|FB|, arity) Semaev evaluations
      per target, exhaustive by design and deliberately worse than any real method; it is ground truth,
      not an algorithm.
    memory_exponent: No attack memory exponent is claimed. The endpoint arm holds one tuple at a time;
      the proxy arm's memory is the Macaulay matrix as elsewhere.
    best_known: The incumbent inside this lane is the degree proxy itself, used as the campaign's
      endpoint with certificates explicitly not re-verified (EV-ALPF-001 boundaries). No association
      between the proxy and a verified decomposition is recorded anywhere in the repository. The underlying-problem
      incumbent, Pollard rho at roughly sqrt(n) group operations, is untouched and is vastly cheaper
      than the exhaustive ground truth used here.
    hidden_overhead: 'Sign and ordering conventions of the Semaev relation are where silent false
      negatives live, and getting them wrong produces a clean-looking null association for a trivial
      reason; the human cost is validating the enumerator against known-good decompositions before
      any negative is trusted. Lower-order term: tuning prevalence by enlarging the factor base changes
      what the association means and must be reported as a design change, not a parameter tweak.'
  dominated_by: 'n/a (no attack result claimed). Pareto check performed across time, memory and data/queries:
    the exhaustive endpoint enumeration is strictly dominated on every axis by Pollard rho at these
    sizes -- rho needs roughly 2^6 to 2^8 group operations at 13 bits, the enumeration needs C(|FB|,3)
    Semaev evaluations plus the metering -- and it is used precisely because it is ground truth rather
    than competitive. No frontier row is approached and none is claimed.'
  sota_delta: 'No attack; control and instrument-validity contribution only. Quantitatively: the incumbent
    state is zero certificate verifications in the entire ALPF lane, as EV-ALPF-001 states; this yields
    verified certificate status on 400 instances across two factor-base sizes and four representations,
    with a prevalence, 2x2 tables, sensitivity, specificity and a Fisher exact test. Zero change to
    any ECDLP time or memory exponent, and the enumeration used is deliberately slower than the incumbent.'
  estimated_cost:
    implementation: medium
    compute: low
  recommended_priority: high
  honest_prior_of_survival: 'That the endpoint arm runs and certificates verify: 0.8, since harness/semaev.py
    already exposes verify_decomposition_certificate and _find_decomposition. That a workable prevalence
    strictly between 0.1 and 0.9 is reachable by choosing |FB|: 0.7 -- it may require a base larger
    than 5, and the entry says so in advance. That a nonzero association appears for the algebraically
    sensible representations: 0.45, deliberately not high, because EXP-ALPF-009''s committed observation
    is exactly a dissociation. That the pullback representation shows null association as predicted:
    0.7, motivated directly by its collapsed d_ff = D_reg = 1 rows. That the entry produces a usable
    number regardless of direction: 0.85, since a null association is the more informative outcome
    and redirects the lane toward endpoint-level screening.'
