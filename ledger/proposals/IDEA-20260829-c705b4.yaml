idea:
  id: IDEA-20260829-c705b4
  question_id: RQ-ECQ-80f23c
  goal_id: GOAL-ECQ-e72c0b
  goal_id_note: >-
    ROUTING ONLY. Naming a goal is not a dispatch and authorizes no run. This
    record proposes building the instrument GOAL-ECQ-e72c0b's completion
    criterion 3 demands; it does not claim the criterion, and the goal's pause
    conditions stand unchanged.

  title: >-
    Every rank lower bound in this repository rests on a FLOATING eigenvalue.
    Track the exact F2 matrix of reductions instead, and measure the good-prime
    budget N*(r) and its coupling to coefficient size

  class: tooling

  claim: >-
    THE OBSERVATION FIRST, BECAUSE IT IS A FACT ABOUT COMMITTED RECORDS AND NOT A
    HYPOTHESIS. Every unconditional rank lower bound this program has ever
    published is carried by the nonsingularity of a Neron-Tate height regulator
    computed in FLOATING POINT: EV-ECQ-0d142e OBS-3 reports a 12x12 regulator of
    about 5.833522605e9 with least eigenvalue about 0.3462, OBS-4 reports 137
    such judgements at 38 and 115 digits, and UC-1 records an UNEXPLAINED uniform
    17th-significant-digit divergence between two internally stable regulator
    computations whose obvious cause was tested and FALSIFIED. GOAL-ECQ-e72c0b
    completion criterion 3 does not accept that: it demands an unconditional,
    machine-checkable certificate publishing the exact character basis or basis
    bindings, good primes and preconditions, point and torsion rows, an EXACT F2
    MATRIX, its rank, the torsion-row rank, any halving witnesses, and the proof
    that matrixRank minus torsionRank equal to 32 implies independence. THE
    CLAIM UNDER TEST IS THAT THIS INSTRUMENT IS BOTH SOUND AND CHEAP, AND THE
    QUANTITY IS THE PRIME BUDGET. Define N*(E, S) = the least number of good
    primes, taken in increasing order from a frozen deterministic list, for which
    the F2 matrix whose rows are the images of the point set S together with the
    torsion generators under the reduction maps into E(F_p)/2E(F_p) attains rank
    equal to |S| + dim_F2 E(Q)[2]. THE CLAIM: (i) N*(E, S) is at most 4|S| for
    every test object, so the budget is LINEAR in the rank and not worse; and
    (ii) the wall clock to compute the certificate is DECOUPLED from the curve's
    coefficient size, with Spearman correlation between log of the absolute a6
    and certification wall clock at most 0.2 in absolute value - against the
    +0.765 that EV-ECQ-0d142e OBS-6 measures for 2-descent timeouts. TWO READINGS
    ARE PRE-DECLARED. IF both hold, then unconditional independence certification
    is an exact-integer, coefficient-size-blind, linear-cost operation, every
    rank lower bound in this repository can be re-issued with a FLOAT-free trust
    surface, GOAL-ECQ-e72c0b criterion 3 is instrumentally solved before any
    rank-32 curve exists, and the campaign's sole remaining bottleneck is
    PRODUCING points - which is what IDEA-20260829-4bbd2a and
    IDEA-20260829-07fd5f are for. IF N* grows faster than linearly, or the matrix
    rank SATURATES below |S| on a set of points known to be independent, or the
    cost is coupled to coefficient size, then criterion 3 is itself a barrier at
    record scale and this program's route to any rank-32 claim has an unmeasured
    obstruction in its final step.

  mechanism: >-
    Reduction modulo a prime of good reduction is a group homomorphism from E(Q)
    to E(F_p), so it induces a map from E(Q)/2E(Q) to E(F_p)/2E(F_p), and the
    target is an F2-vector space of dimension at most 2 computable by exact
    integer arithmetic once the 2-part of the group order of E(F_p) is known.
    Stack those maps over a list of good primes and every point of the input set
    becomes a row of an exact F2 matrix. The soundness argument is two lines and
    needs no hypothesis: suppose a_1 P_1 + ... + a_r P_r is a torsion point with
    integers a_i not all zero, and take the relation primitive. Reducing the
    relation modulo 2 gives an F2 relation among the rows modulo the torsion rows
    unless every a_i is even, and every a_i even contradicts primitivity. So
    matrixRank minus torsionRank is an UNCONDITIONAL lower bound for the rank of
    the group generated by the P_i modulo torsion. NOTHING FLOATS ANYWHERE: the
    coordinates are exact rationals, the reduction is one modular inversion, the
    group order of E(F_p) is an exact integer, and the rank is F2 linear algebra.
    THE COST PROFILE IS THE OPPOSITE OF EVERYTHING THIS PROGRAM HAS MEASURED. The
    2-descent instrument's cost is driven by the specialised coefficient size -
    Spearman +0.765 to timeout, 84 of 140 attempted descents censored, 31 of 31
    upper-bound descents timing out at a4 of order 1e19, while the current record
    curve carries a4 of about 1e66 and a6 of about 1e100 - because descent must
    work in a number field whose discriminant is of the size of the curve's own
    discriminant, and because PARI's route to the class and unit groups of that
    field is, as IDEA-20260829-c7472b's live audit observes, the bnf family. The
    character route never forms that field. Its dependence on the coefficient
    size is one modular reduction of a 100-digit integer per point per prime,
    which is polylogarithmic, so the instrument's cost should be essentially FLAT
    in the very variable that governs everything else. That flatness is a
    falsifiable engineering prediction with a mechanistic reason, and it is the
    second half of the claim precisely because it is the half that can fail
    quietly - an implementation that computes the group order of E(F_p) by a
    method sensitive to the input size, or that recomputes a minimal model per
    prime, would leak the coupling back in.

  tracked_object:
    object: >-
      The EXACT F2 MATRIX of reductions - rows indexed by the exhibited points
      and the torsion generators, columns indexed by the F2-coordinates of
      E(F_p)/2E(F_p) over a frozen deterministic list of good primes - projected
      onto its rank. NOT the points, NOT the heights, NOT the regulator, NOT the
      curve, NOT the Selmer group.
    lossy_projection_test: >-
      PASSES, and the loss is total and one-directional. The projection sends a
      set of rational points with 100-digit coordinates on a curve with 100-digit
      coefficients to a bit matrix with a few hundred entries. From that matrix
      one cannot recover a point, cannot recover a coordinate, cannot recover the
      curve, cannot compute a height, cannot decide whether the rank is EXACTLY
      anything, and cannot recover which prime gave which column beyond the
      declared bindings. It is NOT a change of coordinates on the point set: the
      reduction map into E(F_p)/2E(F_p) has an enormous kernel by construction,
      since it annihilates 2E(Q) and everything congruent to it. What is
      discarded is discarded COMPATIBLY with the operations the target performs,
      and the compatibility is exactly group-homomorphism functoriality: adding
      two points adds their rows, negating a point leaves its row unchanged,
      doubling a point sends its row to zero, and adjoining a further prime
      appends columns without disturbing existing ones. Every one of those is a
      deterministic one-step propagation of the retained data alone, and the
      third one - doubling kills the row - is precisely the lossiness that makes
      the object work and that forces the halving witnesses into the certificate.
    what_the_loss_buys: >-
      A trust surface containing only exhibited arithmetic and one cited
      elementary theorem. No floating point, no class group, no unproven
      hypothesis, no call to the producer's own engine. That is the certificate
      GOAL-ECQ-e72c0b criterion 3 specifies and that
      docs/claims-and-verification.md wants a wrapper to re-verify independently.
    what_the_loss_costs: >-
      The matrix rank is a LOWER bound and can be strictly smaller than the true
      rank of the exhibited subgroup - if the chosen primes are unlucky, or if
      some point is 2-divisible in E(Q), its row is zero and the certificate
      undercounts. So a small matrix rank NEVER means the points are dependent.
      The instrument can also never give an upper bound, never certify an exact
      rank, and never find a point.

  novelty_status: unverified
  novelty_note: >-
    THE METHOD IS PUBLISHED AND IS NOT CLAIMED AS NEW; it is recalled in this
    program's own records as the "Cremona-Brumer style quadratic-character"
    independence test, and GOAL-ECQ-e72c0b already carries a retrieved public
    SOURCE REFERENCE for a third-party implementation of it
    (github.com/icarm/elliptic-rank, commit
    4c9ef36265c3cbc10f5da84fcade3f4bbe6854cc, path src/verify.ts, blob
    fb8f79be01a19e69e7e9b69642822205e1163ec0), verified by the coordinator. WHAT
    IS NEW IS INTERNAL AND MEASURABLE. A corpus grep this session over
    ledger/proposals/, ledger/ideas/ and knowledge/findings/ for "character",
    "F2 matrix", "Cremona", "Brumer", "saturation" and "independence certificate"
    found the method NAMED in three places and IMPLEMENTED in none:
    GOAL-ECQ-e72c0b criterion 3 specifies the certificate; IDEA-20260829-07fd5f
    cites it as `recalled` and explicitly declares it NOT load-bearing for its
    own claim; IDEA-20260829-c7472b classifies trust surfaces and flags a
    floating computation as a distinct kind of accepted fact. No record measures
    the prime budget, no record measures the cost coupling, and no rank in this
    repository has ever been certified by anything but a floating eigenvalue.
    Classified as an adaptation - a known technique in a setting where this
    program has only ever used the other one - and NOT as known, because the two
    quantities claimed here, N*(r) at most 4r and Spearman at most 0.2, are not
    something this session verified anyone has measured. External literature was
    NOT searched for this specific question this session. `unverified` is the
    required label.

