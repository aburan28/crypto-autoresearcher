    - metric: >-
        halving_witness_rate -- the fraction of committed exhibited points whose
        row is zero over the frozen prime list and which therefore require a
        halving witness or a prime-list extension
      direction: lower
      minimum_effect: >-
        reported, not thresholded. A rate above 0.1 would mean 2-divisibility is
        a routine obstacle at this program's scale and the certificate needs a
        saturation step, which is a real and unbudgeted cost.

  minimal_test:
    design: >-
      STEP 0 (capability and cost model, about 2 h). Measure the cost of the
      2-part of the group order of E(F_p) over the declared prime range on curves
      of coefficient size 1e18, 1e26, 1e66 and 1e100. Freeze the prime list rule,
      the precondition set, and the certificate serialisation format. No
      mathematics is claimed here.
      STEP 1 (known-answer gate, about 1 CPU-hour). Run on the five objects of
      known answer from EV-ECQ-0d142e OBS-8 and require the exact expected
      outputs. STOP CONDITION.
      STEP 2 (budget curve, about 3 CPU-hours). Run on the 137 committed fibres
      with |S| from 8 to 12, the two certified rank-13 Mestre curves, the rank-30
      fixture and the curve-302 31-point witness. Record N*, the wall clock, the
      matrix, the prime bindings and the torsion certificate for each. Fit N*
      against |S| and report the coupling Spearman.
      STEP 3 (controls, about 1 CPU-hour). Run the dependent-support control, the
      P-and-2P control, the empty support, and the torsion-only support on a
      positive-rank curve; run the corrupted-curve control with a6 shifted by 1
      and require the on-curve pre-check to reject every point.
      STEP 4 (independent re-verification, about 1 CPU-hour). Hand the published
      certificate artifacts to a second implementation sharing no code with the
      producer and require it to re-derive every matrix rank from the artifact
      alone, without re-running any point search and without contacting the
      third-party verifier.
      STEP 5 (the reissue, about 1 CPU-hour). Report how many of the 137
      committed lower bounds can be re-issued float-free, and publish the
      per-object trust-surface classification in the vocabulary of
      IDEA-20260829-c7472b.
    controls:
      - >-
        FIVE OBJECTS OF KNOWN ANSWER, reused verbatim from EV-ECQ-0d142e OBS-8 so
        that the new instrument is held to the standard the old one passed.
      - >-
        DEPENDENT-SUPPORT CONTROL: a support with a deliberate Z-relation among
        non-torsion points. Expected output 1, not 3 - the exact failure mode
        that killed the producer's first independence criterion.
      - >-
        HALVING CONTROL: a support containing P and 2P. The row of 2P must be
        zero and the certificate must emit a halving witness rather than silently
        reporting a smaller rank.
      - >-
        PROVES-TOO-MUCH: perturb a6 by 1 and rerun. Every point must fail the
        exact on-curve pre-check; a certificate produced on a curve the points do
        not lie on is the worst possible failure and must be impossible by
        construction.
      - >-
        PRIME-LIST-INDEPENDENCE: rerun with a second frozen prime list, primes in
        decreasing order from a declared bound. N* may differ; the final matrix
        rank may not. A differing rank means the instrument is prime-list
        dependent in a way the certificate must disclose.
      - >-
        CROSS-INSTRUMENT AGREEMENT: on the 137 fibres, the exact route's output
        must never EXCEED the committed floating route's rank, and every
        disagreement in either direction is reported individually.
      - >-
        THIRD-PARTY NON-USE: the ICARM verifier is not executed and its source is
        not read during implementation, and the task receipt records that.
    required_metrics:
      - the frozen prime list rule, the precondition set, and the certificate format
      - per object -- N*, matrix rank, torsion-row rank, dim E(Q)[2], and the exact matrix
      - per object -- wall clock and peak RSS, and the coefficient size as log of the absolute a6
      - fitted N* against |S| with confidence interval, and the coupling Spearman with its n
      - outputs on all five known-answer objects and on all four controls
      - count of the 137 fibres re-issued float-free, with the per-object trust-surface labels
      - the halving-witness rate and every halving witness exhibited
      - independent re-verification pass and fail counts from the artifact alone

  falsification_conditions:
    - >-
      If the instrument returns anything other than the five expected values on
      the five objects of known answer, it is not sound as implemented and no
      budget number may be reported.
    - >-
      If any object requires more than 20|S| good primes to attain full expected
      rank, the linear-budget claim is falsified and certification has a budget
      problem of its own at this program's scale.
    - >-
      If the coupling Spearman exceeds 0.4 in absolute value, the decoupling
      claim is falsified as implemented and the instrument inherits the same
      coefficient-size pathology as descent.
    - >-
      If the exact route returns a rank strictly ABOVE the committed floating
      rank on any of the 137 fibres, one of the two is wrong; the conflict is the
      reportable result and no histogram may be re-issued until it is resolved.
    - >-
      If the matrix rank on the curve-302 witness comes back below 31, that is a
      DISCREPANCY WITH A THIRD PARTY'S VERIFIER, reported as such with the prime
      list and the matrix, and never as a statement about that curve's rank.
    - >-
      A point-counting routine that does not complete, an OOM, or a timeout is an
      OPERATIONAL condition under AGENTS.md rule 3, reported as an instrument
      limit, and never as evidence that points are dependent.

  confounders:
    - >-
      GREEDY PRIME SELECTION IS THE CONFOUND THAT WOULD MANUFACTURE THE ENTIRE
      BUDGET RESULT. Choosing primes after seeing which ones raise the rank makes
      N* arbitrarily small and meaningless. Controlled by freezing the prime list
      rule and its ordering before any object is opened, publishing it in the
      certificate, and rerunning under a second frozen rule.
    - >-
      2-DIVISIBILITY AND SATURATION. If an exhibited point is 2 times another
      rational point, its row vanishes and the rank undercounts. The direction is
      conservative for a lower bound but it inflates N* and can make the budget
      look worse than it is. Controlled by the P-and-2P control, by reporting the
      halving-witness rate, and by never treating a zero row as dependence.
    - >-
      IMPLEMENTATION LEAKAGE OF COEFFICIENT SIZE. Recomputing a minimal model per
      prime, or reducing an unreduced rational coordinate repeatedly, would
      reintroduce a size dependence and quietly reproduce descent's pathology
      under a new name. Controlled by the coupling Spearman being a PREDICTION
      with a threshold rather than a diagnostic.
    - >-
      TORSION MISDETERMINATION. A wrong torsion-row rank shifts every reported
      rank by a constant. Controlled by determining the torsion subgroup exactly
      with exhibited generators, cross-checked against group orders at several
      primes, and by reporting dim E(Q)[2] separately in every row of the results.
    - >-
      CIRCULARITY WITH THE THIRD-PARTY VERIFIER. Reading or running
      github.com/icarm/elliptic-rank's src/verify.ts during implementation would
      make the curve-302 agreement a tautology. Controlled by an explicit
      non-use declaration recorded in the task receipt.

  interpretation_limits:
    - >-
      THIS EXHIBITS NO CURVE AND FINDS NO POINT. It certifies points it is given.
      Even total success leaves rank 32 over Q exactly as far away as before, and
      changes only the trust surface and the cost of the final step.
    - >-
      A MATRIX RANK IS A LOWER BOUND, NEVER AN EXACT RANK AND NEVER AN UPPER
      BOUND. A small output never means the points are dependent.
    - >-
      Reproducing 31 on the curve-302 witness would be an independent
      re-verification of ANOTHER GROUP'S claimed witness. Rank at least 31 over Q
      is a live claimed record held by others and is not this program's to
      restate as its own result.
    - >-
      IDEA-20260829-c7472b's GRH observation is an OPEN AUDIT, not a settled
      defect. Nothing here asserts that EV-ECQ-0d142e's "exactly 12" is wrong;
      what this record does is remove the FLOAT from the LOWER-bound half, which
      is a different and smaller thing than settling the upper-bound half.
    - >-
      Scoped to the declared object set, the two frozen prime lists, the declared
      precondition set, and the software stack actually used.

  heuristic_assumptions:
    - id: H1
      statement: >-
        (LINEAR PRIME BUDGET.) For an exhibited independent set S of size r on a
        curve E and the frozen increasing list of good primes, the F2 matrix
        built from the first n primes attains rank r + dim E(Q)[2] for some
        n at most 4r, and the fitted relation N* = c*r + d has c at most 4 over
        the declared range 1 to 31 in r.
      rigorous_support: >-
        RIGOROUS PART: the matrix rank is a rank, so it is non-decreasing in n and
        bounded by r + dim E(Q)[2]; each prime contributes at most 2 columns, so
        n at least (r + dim E(Q)[2])/2 is a hard lower bound and the budget
        cannot be sublinear. There is no probabilistic content in any single
        computation. DISTRIBUTION IMITATED: the classical coupon-collector and
        random-F2-matrix picture in which a matrix over F2 with r columns and
        r + k independent-looking rows has full rank with probability tending to
        1 - 2^{-k}, which is the same shape of argument used for the rank of
        random sparse F2 systems. The heuristic content is exactly that the rows
        coming from distinct primes behave like independent random vectors, which
        is a Chebotarev-flavoured expectation and is NOT proved here.
      validation_plan: >-
        Sample: every object in the declared set - 137 committed fibres at r from
        8 to 12, two rank-13 Mestre curves, the rank-30 fixture, the 31-point
        curve-302 witness, plus small-r controls at r = 1 and r = 2 - giving at
        least 140 measurements of N* spanning r from 1 to 31. Shortcut making
        this feasible: every point set is already committed under a content hash,
        so no search is needed to obtain ground truth, and the reduction of a
        100-digit coordinate modulo a small prime costs one modular inversion.
        Compare: the empirical N*(r) against the fitted linear law and against
        the hard lower bound (r + dim E(Q)[2])/2; report the empirical
        distribution of the number of EXTRA primes beyond that bound and compare
        it to the 1 - 2^{-k} random-matrix prediction. Tail check: the LARGEST r
        is where the assumption must hold if it is to matter, so report N* at
        r = 30 and r = 31 individually against the fit, and report the single
        worst object. TRANSFER ASSUMPTION, STATED: r at most 31 is exactly the
        range of interest and nothing here is extrapolated beyond it; but the
        objects at r = 30 and 31 are OTHER PEOPLE'S curves and are two data
        points, not a sample.
    - id: H2
      statement: >-
        (COST DECOUPLING FROM COEFFICIENT SIZE.) The wall clock of the
        certificate computation grows polylogarithmically in the bit-size of the
        curve's coefficients and of the point coordinates, and linearly in the
        number of primes and points, so the Spearman correlation between
        log of the absolute a6 and certification wall clock over the declared
        object set is at most 0.2 in absolute value.
      rigorous_support: >-
        RIGOROUS PART: the only place the coefficient size enters is one modular
        reduction and one modular inversion per point per prime, which is
        polylogarithmic in the bit-size; the group order of E(F_p) does not
        depend on the size of the lift at all. So the correlation should be
        essentially zero BY CONSTRUCTION, and any nonzero value indicates an
        implementation that is re-deriving something size-dependent. DISTRIBUTION
        IMITATED: none is needed - this is a falsifiable engineering prediction
        with a mechanistic reason, stated as an assumption only because the
        implementation does not yet exist. It is included precisely because the
        OPPOSITE correlation, +0.765, is the single best-measured fact about this
        program's existing instrument.
      validation_plan: >-
        Sample: the full declared object set, whose log of the absolute a6 spans
        from about 26 to about 230 natural-log units, covering the rank-12
        fibre's a6 of about 1.41e26, the Mestre curves' a6 of about 1e28, and
        curve 302's a6 of about 5.6e100. Compare: measured Spearman against the
        predicted 0 and against the +0.765 exhibited by 2-descent on this
        repository's own data. Tail check: the ten objects with the largest
        coefficients must not be over-represented among the ten slowest
        certifications; report the overlap count against the 1-in-10 expected by
        chance. If the correlation exceeds 0.4 the implementation is leaking and
        no budget number is interpreted until it is fixed. TRANSFER ASSUMPTION,
        STATED: decoupling measured up to 100 decimal digits of a6 says nothing
        about 1000 digits, and nothing about a certificate that also had to
        SEARCH for the points.

  target_complexity:
    time_exponent: >-
      NO CRYPTOGRAPHIC EXPONENT IS CLAIMED OR MOVED. The exponent moved is the
      certification step's dependence on the two variables the campaign actually
      faces. CURRENT, MEASURED: 2-descent certification cost is driven by
      specialised coefficient size at Spearman +0.765 to timeout, with 84 of 140
      attempted descents censored at an 8 s alarm and 31 of 31 upper-bound
      descents timing out at a4 of order 1e19; the floating regulator alternative
      costs O(r^2) canonical heights at 115 digits on 100-digit coefficients and
      carries an unexplained 17th-digit divergence. TARGET: O(N* times r) modular
      reductions plus N* group-order computations, with N* = O(r), giving
      O(r^2) exact integer operations of polylogarithmic bit-cost - LINEAR in the
      rank per prime and POLYLOGARITHMIC in the coefficient size, to be MEASURED
      and not asserted.
    memory_exponent: >-
      O(N* times r) bits for the matrix - kilobytes at r = 31 - plus the point
      coordinates. Negligible against the 1.22 GB peak RSS the predecessor
      campaign measured. Peak RSS is measured, not asserted.
    best_known: >-
      IN THIS REPOSITORY: no exact independence certificate of any kind exists;
      all 137 plus 156 plus 9 committed rank lower bounds rest on a floating
      regulator eigenvalue, and GOAL-ECQ-e72c0b criterion 9 forbids exactly that
      as proof. EXTERNALLY: the method is classical and a third-party
      implementation is referenced in this program's own goal record
      (icarm/elliptic-rank src/verify.ts at commit 4c9ef362), which this design
      does not use. Nothing algorithmically new is claimed.
    hidden_overhead: >-
      Three disclosures. (1) The certificate is a LOWER bound instrument, so its
      best possible outcome is a cheaper and cleaner version of what this program
      already claims - it cannot raise a rank by one point. (2) Saturation is
      unbudgeted: a 2-divisible exhibited point needs a halving witness, and
      producing one may require a search this record does not cost. (3) The
      linear budget is a random-matrix expectation, and the two objects at r = 30
      and r = 31 that matter most are two data points belonging to other people.
    tradeoff_note: >-
      Not a time-memory problem at any scale reached here. The real trade is
      PRIME COUNT against CERTIFICATE SIZE: more primes make full rank more
      likely and make the published artifact larger, and the artifact is what an
      independent verifier must re-check, so it is bounded deliberately.
      Trivially parallel over primes and over objects; the campaign runs at
      max_concurrent 1, so every wall clock reported is a single-core number.

  dominated_by: >-
    FRONTIER ROWS CHECKED THIS SESSION ACROSS TIME, MEMORY AND DATA. (1) THE
    THIRD-PARTY VERIFIER DOMINATES ON EXISTENCE: icarm/elliptic-rank already
    implements this method, it is referenced in this program's own goal record
    with a commit and a blob hash, and it has already verified the 31-point
    witness. This program would be building an independent second implementation,
    which is worth doing precisely because independence is the point, but no
    algorithmic novelty is claimed. (2) PARI ellrank DOMINATES ON INFORMATION
    wherever it terminates, since it returns an upper bound this instrument can
    never give; it is dominated here on coefficient size and, per the open audit
    IDEA-20260829-c7472b, possibly on unconditionality. (3) The floating
    regulator DOMINATES ON IMPLEMENTATION COST - it already exists and has run
    137 times - and is dominated on trust surface, being exactly the thing
    GOAL-ECQ-e72c0b criterion 9 refuses. (4) IDEA-20260829-4bbd2a and
    IDEA-20260829-07fd5f DOMINATE ON CONSEQUENCE, because they produce points and
    this does not; they are complementary rather than competing, and a batch
    running one of them plus this one would have both halves of a pipeline. (5)
    IDEA-20260829-c7472b DOMINATES ON DIAGNOSIS - it classifies the whole trust
    surface including the upper-bound half - and is dominated here on remedy,
    since it audits and this builds. On the axis this record competes on - an
    independent, exact, float-free, coefficient-size-blind lower-bound
    certificate for point sets this program already holds - no row in this
    repository dominates it, because no row exists.
  sota_delta: >-
    QUANTITATIVELY. Delta on rank over Q: EXACTLY ZERO, and structurally so - the
    instrument certifies points it is given. Delta on the world record: ZERO.
    WHAT MOVES IS THE TRUST SURFACE AND THE COST OF THE FINAL STEP. Current: 137
    committed rank lower bounds, every one resting on a floating eigenvalue
    (least eigenvalue about 0.3462 on the headline curve) from a computation with
    an unexplained 17th-significant-digit divergence between two internally
    stable implementations, and zero of them admissible under
    GOAL-ECQ-e72c0b criterion 9 as written. After: a pre-declared target of at
    least 130 of 137 re-issued with a trust surface containing only exhibited
    arithmetic and one elementary cited theorem, plus a measured prime budget
    N*(r) with a fitted slope and a measured cost coupling to report against the
    +0.765 that governs the incumbent instrument. Estimated cost roughly
    9 CPU-hours plus a medium implementation, against a predecessor campaign
    total of 1,993.0 s of compute.

  estimated_cost:
    implementation: medium
    compute: low
    basis: >-
      Implementation is one reduction routine, one point-counting call per prime,
      one F2 rank over a tiny matrix, an exact torsion determination, a
      certificate serialiser, and an independent re-verifier - all elementary,
      none requiring a new mathematical idea or an external system. The declared
      non-use of the third-party verifier is a process constraint, not a cost.
      Compute is roughly 9 CPU-hours across six steps, dominated by STEP 2, with
      peak RSS negligible. STEP 1 is a known-answer stop-gate that can kill a
      broken implementation for the price of one CPU-hour.

  recommended_priority: high

