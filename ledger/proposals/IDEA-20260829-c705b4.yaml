  assumptions:
    - >-
      The exhibited point sets used as inputs are the committed ones: the 20
      points of the rank-12 fibre, the 137 fibres of certified_curves.json (sha256
      a342ff9c...d15aee), the Alpoge-Howell rank-30 fixture used as
      RUN-ECRANK-e1e30e-003's control object, and the 31 points of the frozen
      curve-302 snapshot. Every point is re-verified on its exact curve in exact
      rational arithmetic before any matrix is built, and a failure there is an
      input defect, not a result.
    - >-
      Computing the 2-part of the group order of E(F_p) for p in the declared
      range is affordable by point counting at the sizes actually used. This is a
      capability assumption and is measured in step 0, not assumed in the report.
    - >-
      The third-party verifier at github.com/icarm/elliptic-rank is NOT executed
      and NOT read as an implementation guide, so that this program's
      implementation is independent of it and a comparison of outputs on the
      frozen snapshot is a genuine cross-check rather than a tautology.

  proof_search_map:
    bottleneck: >-
      The final step of any rank claim: converting a set of exhibited points into
      an unconditional, machine-checkable independence certificate. Today this
      program performs that step in floating point, and GOAL-ECQ-e72c0b criterion
      9 explicitly forbids a floating regulator or determinant as proof of the
      rank lower bound - so on the goal's own terms this program currently has NO
      admissible certificate for any rank it has ever reported, at any rank.
      Removing this step means an exact-integer certificate whose cost is
      measured rather than assumed.
    baseline_embedding:
      parameter_slice: >-
        The floating regulator route, on the SAME point sets. It is not a
        different experiment: for every object, both instruments are run on the
        identical exhibited support and their outputs are compared as integers.
        The exact parameter slice where the two must agree is the set of five
        objects of known answer that EV-ECQ-0d142e OBS-8 already used - the
        rank-30 fixture, the conductor-37 rank-1 curve with 18 supplied points,
        the empty support, the torsion-only support on a positive-rank curve, and
        the linearly dependent non-torsion support.
      reproduction_check: >-
        Frozen fixture. The new instrument must return exactly 30 on the rank-30
        fixture, exactly 1 on the conductor-37 curve with 18 supplied points,
        0 on the empty support, 0 on the torsion-only support, and 1 and not 3 on
        the dependent non-torsion support. Separately it must reproduce the
        committed 137-fibre histogram (8 x93, 9 x14, 10 x17, 11 x12, 12 x1) with
        no rank BELOW the committed value on any fibre. Any disagreement halts
        the experiment; a rank ABOVE the committed value on a fibre is reported
        as a discrepancy and investigated, never absorbed.
    observation_collision:
      observable: >-
        The integer matrixRank minus torsionRank over the frozen prime list.
      distinct_preimage_search: >-
        A COLLISION EXISTS AND IT IS THE INSTRUMENT'S DEFINING LIMITATION. The
        observable takes the same value for (a) a point set of true rank exactly
        that value and (b) a point set of LARGER true rank whose extra generators
        happen to be 2-divisible in E(Q) or to have zero image at every prime on
        the frozen list. Both give the same matrix rank. The direction is
        one-sided and benign - the instrument can only UNDERCOUNT - which is why
        it is admissible as a lower-bound certificate and why a small output may
        never be read as dependence. The separation condition is the halving
        witness: for any point whose row is zero, the certificate must either
        exhibit a rational halving, proving the row SHOULD be zero, or extend the
        prime list. A second collision worth stating: two different frozen prime
        lists can give different matrix ranks on the same support, so the prime
        list is part of the certificate and is frozen and published, never
        re-drawn after seeing the answer.
    constructive_transforms:
      - transform: representation_reduction
        proposed_object: >-
          Replace the analytic model, a real symmetric Gram matrix of canonical
          heights whose nonsingularity is judged by an eigenvalue threshold, by
          the arithmetic model, an F2 matrix of reductions whose rank is an exact
          finite computation.
        predicted_gain: >-
          The certificate's trust surface loses its FLOAT entry entirely, the
          cost decouples from coefficient size, and the output becomes
          re-verifiable by a wrapper in exact integers, which is what
          docs/claims-and-verification.md asks of a solution certificate.
      - transform: stronger_invariant
        proposed_object: >-
          Carry the whole F2 matrix and the prime bindings rather than the single
          integer "rank", because the matrix is what a second implementation
          re-checks and the integer is what a reader would have to trust.
        predicted_gain: >-
          Independent re-verification becomes possible from the published
          artifact alone, without re-running any search.
      - transform: specialization_pack
        proposed_object: >-
          A resource measure counting good primes consumed per unit of certified
          rank, charged over the disjoint blocks of the frozen prime list.
        predicted_gain: >-
          N*(r) as a measured function with a fit, rather than "certification is
          not the bottleneck" as an assertion carried by a `recalled` citation.
    quantifier_order: >-
      FROZEN BEFORE ANY OBJECT IS OPENED. FOR ALL test objects (E, S) in the
      declared set, with the prime list P frozen as the increasing list of primes
      of good reduction for E starting from 5 and the precondition set frozen,
      THERE EXISTS an integer N*(E, S) at most 4|S| such that the F2 matrix built
      from the first N*(E, S) primes of P has rank equal to |S| + dim E(Q)[2].
      Note the order: N* is allowed to depend on the object - it is the thing
      being measured - but the PRIME LIST and its ordering are NOT allowed to
      depend on the object beyond the good-reduction condition, and in particular
      no prime may be selected after seeing that it raises the rank. A design
      that greedily chose primes would be fitting the certificate to the answer
      and would measure nothing.
    method_ceiling:
      strongest_certifiable_claim: >-
        "These |S| exhibited points on this exact curve are Z-linearly
        independent modulo torsion, by an exact F2 computation over this
        published prime list, with this torsion certificate." That is a rank
        LOWER bound with a float-free trust surface. It is NEVER an exact rank,
        NEVER an upper bound, NEVER a statement that a larger point set does not
        exist, and it exhibits no point - it certifies points it is GIVEN and
        finds none.
      nearby_object_control: >-
        The closest object where the desired conclusion must FAIL: a support
        containing a deliberate Z-relation among non-torsion points, which
        EV-ECQ-0d142e OBS-8 records the validator constructing and on which the
        old instrument returned 1 and not 3. The new instrument must also return
        1. A second nearby control where it must fail differently: a support
        containing a point P together with 2P, where the row of 2P is zero by
        construction, so the matrix rank undercounts by design and the
        certificate must emit a halving witness rather than a rank.
    proof_obligations:
      - claim: matrixRank minus torsionRank is an unconditional lower bound for the rank modulo torsion.
        responsibility: correctness
      - claim: No step of the certificate uses floating point, a class group, or an unproven hypothesis.
        responsibility: correctness
      - claim: The instrument returns the known value on all five objects of known answer, never more.
        responsibility: baseline
      - claim: E(Q) torsion is determined exactly, with generators, for every object certified.
        responsibility: interface
      - claim: N* is at most 4|S| on the declared set, with the prime list frozen in advance.
        responsibility: size
      - claim: Certification wall clock is decoupled from log of the absolute a6 at Spearman at most 0.2.
        responsibility: runtime
      - claim: The published artifact is re-verifiable by an implementation sharing no code with the producer.
        responsibility: interface
    not_applicable_reason: null

