idea:
  id: IDEA-20261005-a5cf85
  question_id: RQ-HAWK-001
  added: '2026-10-05'
  status: proposed
  approved_by: null
  title: Toy free rank of the norm-one unit log image in one maximal order of B_{3,∞}
  class: control
  claim: >-
    At the prime p=3, for one maximal order O in the definite quaternion
    algebra B_{3,∞} (ramified exactly at 3 and ∞), let O^1 be the norm-one
    units {u in O^× : nrd(u)=1}. Define r as the Z-rank of the free part of
    the abelianization (O^1)/[O^1,O^1]. A completed listing decides exactly
    one of two readings: r>=1, so a Dirichlet-style log embedding O^1 → R^r
    has image a free abelian lattice of rank r and stage-2 decoding has a
    lattice object at this toy; or r=0, so every homomorphism from O^1 into
    a Euclidean space has image {0} and the log image is torsion. The rings
    are different from the commutative cyclotomic log-unit lattice in
    KN-TECH-046. This claim is the toy fork only. It does not claim HAWK key
    recovery. The Eurocrypt 2025 rank-2 module-LIP to nrd-PIP reduction stays
    unchecked.
  mechanism: >-
    A Dirichlet log lands in some R^d. That target is abelian and
    torsion-free, so the homomorphism kills [O^1,O^1] and all torsion, and
    the largest rank of a discrete log image equals r. The projection
    O^1 → (O^1)^{ab}/torsion is lossy whenever the commutator subgroup or
    the torsion is nontrivial; the discarded part cannot appear in any
    lattice in R^d, and the retained part is exactly the lattice a
    stage-2 decoder would have to decode. Multiplication on the retained
    free part becomes addition after the log. If r>=1 the retained part is
    a positive-rank lattice. If r=0 the retained part is the identity in
    every log target, so there is no lattice. Non-commutativity is the
    reason the object is an abelianization rank rather than a Dirichlet
    rank r1+r2-1 of a number field. O is a maximal order in B_{3,∞}. The
    cyclotomic integers underlying KN-TECH-046 are a different ring, and
    this meter is not applied to them.
  novelty_status: unverified
