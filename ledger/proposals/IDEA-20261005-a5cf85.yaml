    - ref: "Vigneras, Arithmetique des algebres de quaternions; Voight, Quaternion Algebras; Borel-Harish-Chandra finiteness for anisotropic arithmetic groups"
      provenance: recalled
      claim: >-
        Recalled pointer that an order in a quaternion algebra ramified
