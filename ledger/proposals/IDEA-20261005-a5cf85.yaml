      verified_by: null
  assumptions:
    - >-
      The algebra handed to the computer-algebra system is B_{3,∞} only
      if that system reports ramification exactly at {3, ∞}. A recalled
      model is (-1,-3)/Q; the ramification print is the gate, and the
      model is not assumed correct in advance.
    - >-
      r is the rank of a lattice in a Euclidean space. A non-abelian word
      metric on a finite subgroup of the norm-one sphere is outside this
      reading.
    - >-
      One maximal order at p=3 is the whole sample. No transfer to other
      primes, to other conjugacy classes, or to HAWK-512 or HAWK-1024
      is assumed.
    - >-
      The Eurocrypt 2025 rank-2 module-LIP to nrd-PIP reduction is
      unchecked. HAWK key recovery is unclaimed.
    - >-
      KN-TECH-046 stays a different ring. A commutative unit rank used
      as a meter check is a check of the rank function, not a reading
      of O^1.
  predictions:
    - metric: free_Z_rank_r of (O^1 abelianization modulo torsion) at p=3
      direction: different
      minimum_effect: >-
        The completed toy returns either r=0 or r>=1, and those two
        integers differ by at least 1.
    - metric: finiteness_bit of O^1 under a Gram-matrix norm bound
      direction: different
      minimum_effect: >-
        The same run reports whether the norm-one shell is a finite
        list. Paired with r, the lattice reading is the pair
        (finite, r=0) or the pair (any finiteness bit, r>=1).
  minimal_test:
    design: >-
      In a computer-algebra system, construct a quaternion algebra over Q
      aimed at discriminant 3 and print its ramified places. Continue
      only if the set is exactly {3, ∞}. Compute one maximal order O and
      the Gram matrix G of its reduced norm on a Z-basis. Enumerate the
      shell Q(x)=1 by a box bound taken from the smallest eigenvalue of
      G; do not hard-code the bound. Set O^1 to the elements that lie in
      O and have nrd exactly 1, re-checked multiplicatively. From the
      multiplication table, compute the relation matrix of the
      abelianization and its free rank r by Smith normal form. Report
      the pair (shell finite or not, r). If the system cannot finish a
      proven bound, record infrastructure and leave both readings open.
    controls:
      - >-
        Ramification gate: any algebra whose printed ramification is not
        exactly {3, ∞} is discarded before a rank is reported.
      - >-
        Membership gate: every listed unit is re-tested for membership
        in O and for nrd exactly 1. Report |nrd=1| and |nrd=±1|
        separately.
      - >-
        Meter controls on different rings, neither of them O and neither
        of them the cyclotomic log-unit lattice of KN-TECH-046: the same
        free-rank function returns 0 on {±1} and 1 on Z[√2]^× modulo
        torsion. A quaternion result is reported only if both meter
        checks match those integers.
    required_metrics:
      - ramified_places
      - gram_bound_used
      - cardinality_nrd_eq_1
      - cardinality_nrd_eq_pm_1
      - shell_finite_bit
      - free_Z_rank_r
      - meter_rank_units_of_Z
      - meter_rank_units_of_Z_adjoin_sqrt2
  falsification_conditions:
    - >-
      Ramification exactly {3, ∞}, enumeration completed inside the Gram
      bound, and r>=1: the reading "no log-lattice at this toy" is false.
    - >-
      Ramification exactly {3, ∞}, shell finite, and r=0: the reading
      "a free abelian log-lattice of rank >=1 exists at this toy" is false.
    - >-
      A crash, a timeout, an unproven bound, or a wrong ramification
      set decides neither reading.
    - >-
      Either toy outcome leaves HAWK key recovery unclaimed and leaves
      the Eurocrypt 2025 reduction unchecked. r>=1 does not supply a
      decoder. r=0 does not prove short-generator hardness.
  confounders:
    - >-
      p=3 may be atypical among ramified primes. The toy reading is
      about this order at this prime.
    - >-
      An incomplete search can look like r=0. Only a finished Gram bound
      supports the torsion reading.
    - >-
      An infinite group with torsion abelianization would show r=0 while
      the shell is infinite. Report that pair as its own outcome. Do not
      label it finite.
    - >-
      A second maximal order, or a non-maximal order, can differ. The
      sample is the single maximal order the system returns.
    - >-
      Treating O^× (nrd=±1) as O^1 moves the counted set. The separate
      cardinalities are there to catch that.
  interpretation_limits:
    - >-
      Scope is one maximal order in B_{3,∞}. No statement about HAWK-512,
      HAWK-1024, or any other prime.
    - >-
      No exponent against HAWK parameters is stated. The g>=2 heuristic
      polynomial-time report stays a recalled relay. The g=1 stage-2
      question stays open outside this toy.
    - >-
      The Eurocrypt 2025 rank-2 module-LIP to nrd-PIP reduction is not
      checked.
    - >-
      KN-TECH-046 is a different ring. Agreement or disagreement with a
      cyclotomic unit rank is not evidence about O^1.
    - >-
      A finite non-abelian subgroup of the norm-one sphere can be a
      decoding obstacle of another kind. This idea measures only the
      free rank of the abelian log image.
  heuristic_assumptions:
    - id: H1
      statement: >-
        At p=3, once ramification is exactly {3, ∞}, the reduced norm is
        a positive definite quaternary form, and the set of basis
        coefficient vectors with Q(x)=1 is finite and equal to the set
        found by searching the box cut out by the smallest eigenvalue of
        the Gram matrix. No smoothness law and no transfer to any larger
        prime is assumed.
      rigorous_support: >-
        Structural fact imitated, not opened: ramification at infinity
        makes B⊗R the Hamilton quaternions, so the reduced norm is
        positive definite, and an arithmetic subgroup of an anisotropic
        group is finite (Borel-Harish-Chandra, recalled). The classical
        distribution theorem imitated is that finiteness statement. It
        is not a Dickman-de Bruijn or Canfield-Erdős-Pomerance law.
        Recalled support does not discharge H1.
      validation_plan: >-
        Sampled parameter is p=3 only (bit length 2). Compare two
        independent listings of the same shell: the Gram-bound search,
        and a second implementation or a second basis of the same order.
        The predicted match is exact equality of the two sets and of r,
        not an empirical CDF. Tail check: none; the shell Q(x)=1 is fully
        listed or the run is infrastructure. No extrapolation to HAWK
        parameters.
  target_complexity:
    time_exponent: >-
      Polynomial in the bit length of the named prime p=3 (bit length 2).
      No time exponent against HAWK parameters is claimed.
    memory_exponent: >-
      Polynomial in the bit length of p=3. No memory exponent against
      HAWK parameters is claimed.
    best_known: >-
      Opened baselines: g>=2 PIP in M_g(O) is a recalled report of
      heuristic expected polynomial time; g=1 stage-2 unit-lattice
      structure is unknown in KN-OPEN-024 and KN-TECH-081. This toy
      does not improve either baseline.
    hidden_overhead: >-
      None claimed. No o(1) term against HAWK, and no cofactor against
      the g>=2 report, is stated.
    tradeoff_note: >-
      Single enumeration at fixed p=3. No time-memory tradeoff and no
      parallel speedup against HAWK is claimed.
