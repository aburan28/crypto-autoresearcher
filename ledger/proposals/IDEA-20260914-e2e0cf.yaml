  assumptions:
    - Public self-generated toy instances only; no deployed Koblitz or sect-family curve is ever an instance.
    - p does not divide n, so that x^n - 1 is squarefree and the submodule lattice is the divisor lattice.
    - Exact integer and rational arithmetic throughout; no floating point in any reported quantity.
    - >-
      The cost ratio is the COMBINATORIAL half of relation collection only. Per-trial
      polynomial-solving cost is deliberately outside the object and is never
      folded in.

  predictions:
    - metric: >-
        within-cell improvement factor I = cost_ratio(coarsest single-slot
        partition) / min over achievable partitions of cost_ratio, exact rational
      direction: higher
      minimum_effect: >-
        I >= 4 in the maximally split cell, and I at least 4x larger there than
        in the cell whose x^n - 1 has no non-trivial factorisation
    - metric: achievable slot-dimension multisets per cell
      direction: different
      minimum_effect: >-
        Exactly enumerated and exactly matching the divisor lattice of x^n - 1;
        any mismatch falsifies the module description outright
    - metric: direct sum of non-trivial factor kernels versus ker Tr
      direction: different
      minimum_effect: set equality and dimension n-1 in every completed cell, or the prediction fails

  minimal_test:
    design: >-
      A three-cell ladder at fixed n = 5 and fixed total non-trivial dimension
      4, varying ONLY the factorisation type of x^n - 1: q = 11 (splits into
      five linear factors), q = 19 (x^5-1 = (x-1)*f1*f2 with deg f_i = 2), and
      q = 13 (x^5-1 = (x-1)*f with f irreducible of degree 4, i.e. no
      non-trivial lattice). One optional extension cell at q = 13, n = 7 (three
      irreducible quadratics). Exhaustive tuple-sum enumeration; no sampling.
    execution_status: design_only_not_approved_in_this_record
    controls:
      - kind: baseline
        design: the coarsest partition m = 1 at dim n-1 reproduces the single-invariant-base pipeline
      - kind: matched_dimension_non_stable
        design: an F_q-subspace of matched dimension that is NOT pi-stable, isolating stability from dimension
      - kind: matched_cardinality_random
        design: seeded random negation-closed point sets of matched cardinality, isolating linear structure from cardinality
      - kind: matched_null_curve
        design: a curve over F_{q^n} with j not in F_q, matched size and slot cardinalities, no subfield Frobenius
      - kind: known_false
        design: a repeated subspace across two slots is not a partition and must be refused, not credited as m = 2
    budget:
      proposed_only: true
      maximum_runs: 0
      note: This record approves nothing and runs nothing.

  falsification_conditions:
    - The exactly enumerated achievable slot-dimension multisets disagree with the divisor lattice of x^n - 1.
    - The direct sum of non-trivial factor kernels is not equal to ker Tr in some completed cell.
    - Cost ratio varies by less than a factor 2 across all achievable partitions at fixed total dimension, in every completed cell.
    - The matched controls show a spread in cost ratio at least as large as the object arm's.

  confounders:
    - >-
      Total slot dimension is the obvious confound for slot count; the design
      holds it fixed at n-1 and varies only the partition.
    - >-
      Cofactor and subgroup-order differences between cells make cross-cell
      absolute ratios incomparable; only the dimensionless within-cell
      improvement factor may be compared across cells.
    - >-
      Field size differs between q = 11, 13 and 19 at n = 5; this is unavoidable
      because the factorisation type is a property of q mod n, and it is the
      reason the primary comparison is within-cell.
    - >-
      U counted under the Frobenius-plus-negation quotient is not comparable to
      U counted under negation only; arms that lack Frobenius have no
      Frobenius quotient and must be compared in the negation-only presentation.

  interpretation_limits:
    - >-
      No attack, no speedup, no security consequence, no exponent claim, and no
      statement about any deployed curve. A design axis that moves a
      combinatorial ratio at toy scale is not an algorithmic improvement.
    - >-
      Ranking slot counts by SOLVE cost additionally needs d_reg, which is
      contested (KN-OPEN-d218ec, Semaev Assumption 1, Nagao's fake-versus-true
      first fall degree in KN-LIT-71b758). This proposal measures the
      combinatorial half only and must never be read as a solve-cost ranking.
    - >-
      Published prior art reports that index calculus on subfield curves gains
      more from subfield structure than rho does and still loses outright at
      deployed sizes; nothing proposed here contradicts that, and any successor
      that appears to must be treated as an error until independently reviewed.
    - Toy claim tier only. Negative evidence would close only the exact tested cells.

  dominated_by:
    status: unresolved
    frontier_checked:
      - The m = 1 single-invariant-base configuration inside each cell
      - EXP-FROB-b8cf21's cover/Delta_rank diagnostic on the same lattice
      - KN-LIT-796's reported 1/n relation and n^2 linear-algebra factors
    missing_comparisons:
      - Frobenius-and-negation-class Pollard rho at the same instances
      - GHS / Weil descent where applicable per curve
      - Any per-trial solving cost at all
    reason: >-
      No measured outcome exists and the algebraic half of the cost is outside
      the object. Setting this to null would be a fabrication under AGENTS.md
      rule 9.

  sota_delta:
    established_time_exponent_gain: 0
    established_memory_exponent_gain: 0
    established_data_query_gain: 0
    conditional_target: >-
      A within-cell improvement factor of at least 4 in the combinatorial cost
      ratio, which is log2(4) = 2 bits of finite combinatorial work and changes
      no asymptotic exponent whatsoever.
    comparison_scope: Three toy cells at n = 5 plus one extension cell at n = 7; global frontier unresolved.

  inference:
    requested_policy: coordinator-orchestration-code
    reasoning_effort: high
    runtime: claude_code
    resolved_model_id: null
    model_verified: false
    fallback_used: false
    degraded_requirements: []
    provenance_note: >-
