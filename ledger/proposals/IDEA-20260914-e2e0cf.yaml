idea:
  id: IDEA-20260914-e2e0cf
  title: >-
    Direct-sum partition sweep of the Frobenius-stable factor-base lattice:
    slot count m against unknowns U and decomposition yield p_m
  class: algorithm
  recorded_at: '2026-09-14'
  question_id: RQ-FROB-7d8dd4
  question_ids: [RQ-FROB-7d8dd4]
  goal_ids: []
  status: proposed
  proposed_by: coordinator

  provenance_note: >-
    DISCLOSED DEVIATION FROM THE NORMAL IDEATION PATH. This proposal was NOT
    produced by the idea-generator. All five proposals under RQ-FROB-7d8dd4
    (IDEA-20260906-a77711, -6da433, -a538a8, -5d2fd9, -2dae28) are already
    consumed by hypotheses H-FROB-73df22, H-FROB-17c272, H-FROB-2d6ccb,
    H-FROB-24f425 and H-FROB-824aa8 respectively, so no open proposal existed
    when /design-experiment was invoked on the RESEARCH QUESTION rather than on
    a proposal. Under the AGENTS.md standing user authorization (2026-09-06)
    the Coordinator selects ranked work and completes its contract; minting the
    candidate itself is recorded here rather than hidden, because the usual
    independence between proposer and approver is absent for this record and a
    reviewer must know that. This record is a design candidate, not evidence,
    and creating it asserts nothing.

  claim: >-
    For E/F_q attacked over F_{q^n} with p not dividing n, the number of
    Frobenius-stable factor-base SLOTS m is an independent design axis that has
    never been swept in this program, and sweeping it moves the combinatorial
    relation-collection cost ratio (U + 1 + extra)/p_m by a large, measurable
    factor at fixed total slot dimension. Because the achievable slot dimensions
    are exactly the sums of degrees of the irreducible factors of x^n - 1 over
    F_q, the factorization type of x^n - 1 CONSTRAINS which slot configurations
    exist at all: a cell in which x^n - 1 = (x-1)*f with f irreducible of degree
    n-1 admits no balanced multi-slot configuration, while a cell in which
    x^n - 1 splits admits many. This is a claim about factor-base DESIGN under a
    frozen combinatorial cost model. It is NOT an attack, NOT a speedup, and NOT
    a security consequence for any curve.

  mechanism: >-
    OBJECT. F_{q^n} carried as an F_q[x]-module by x . u = u^q. With p not
    dividing n, x^n - 1 is squarefree (its derivative n*x^{n-1} is a unit times
    x^{n-1} and shares no root with it), so the module is semisimple and its
    submodules are exactly the kernels ker g(pi) for monic g dividing x^n - 1,
    with dim_{F_q} ker g(pi) = deg g. The Frobenius-stable F_q-subspaces of the
    x-coordinate space are therefore in bijection with the divisor lattice of
    x^n - 1. Writing x^n - 1 = (x-1) * f_1 * ... * f_s over F_q, ANY partition of
    {f_1,...,f_s} into m groups J_1,...,J_m yields a direct sum
    V_1 + ... + V_m with V_j = ker (prod_{f in J_j} f)(pi) and
    sum_j dim V_j = n - 1 (excluding (x-1)) or n (including it).
    OPERATION. Take the typed factor base B = union_j B_j with
    B_j = {Q in <G> \ {O} : x(Q) in V_j} and the typed decomposition
    R = Q_1 + ... + Q_m with exactly one Q_j from each B_j. Then the slot count
    m is simultaneously the decomposition arity and the number of summand types.
    TRADE. Finer partitions shrink every |B_j| and therefore shrink the unknown
    count U (the number of signed Frobenius orbit columns) while also shrinking
    the number prod_j |B_j| of admissible tuples and hence the yield p_m.
    Coarser partitions do the opposite. The quantity that decides the trade is
    the ratio the sibling implementation already names and minimises exactly,
    (U + 1 + extra)/p_m. NO EXPERIMENT IN THIS PROGRAM SWEEPS m.
    STRUCTURAL PREDICTION TO BE RE-DERIVED, NOT ASSERTED. The F_q-linear trace
    Tr_{F_{q^n}/F_q}(u) = u + u^q + ... + u^{q^{n-1}} is the linearised
    polynomial h(pi) with h(x) = 1 + x + ... + x^{n-1} = (x^n - 1)/(x - 1).
    Since x^n - 1 is squarefree, every irreducible factor other than (x-1)
    divides h, so each such ker f_j(pi) should sit inside ker Tr, and the
    dimensions should force the direct sum of ALL non-trivial factor kernels to
    equal ker Tr exactly, of dimension n-1. If that holds, a trace-zero
    x-coordinate condition costs nothing on top of Frobenius stability - it is
    implied by it - rather than being a separate intersection. THIS IS A
    PREDICTION OF THE HYPOTHESIS AND MUST BE VERIFIED EXACTLY INSIDE THE
    PROTOCOL BEFORE IT IS RELIED ON ANYWHERE.
    SCOPE GUARD THAT MUST TRAVEL WITH THE CLAIM. The subspace here lives in the
    COORDINATE field F_{q^n}; "trace zero" means x(Q) in ker Tr. That is NOT the
    trace-zero subvariety T_n = ker(Tr : E(F_{q^n}) -> E(F_q)) of the GROUP,
    which is the object of H-FROB-73df22. Conflating the coordinate trace with
    the group trace is the standard error in this area and is forbidden in every
    record descending from this one.

  novelty_status: unverified
  novelty_screen:
    nearest_internal_record: IDEA-20260906-2dae28 / H-FROB-824aa8 / EXP-FROB-b8cf21
    precise_difference: >-
      EXP-FROB-b8cf21 enumerates COVERS (arbitrary unions of up to three
      candidate bases, deliberately including overlapping and identical ones)
      and measures Delta_rank, a row-span diagnostic at fixed union columns. It
      does not require a direct sum, does not vary the decomposition arity, and
      measures neither yield nor the cost ratio. The present proposal fixes the
      union to a genuine DIRECT SUM given by a partition of the factor set,
      makes the slot count m the independent variable, and measures
      (U + 1 + extra)/p_m. The two are complementary diagnostics on the same
      lattice, and the present one deliberately holds total dimension fixed at
      n-1 so that m varies alone.
    method: >-
      Direct read of ledger/questions/RQ-FROB-7d8dd4.yaml, all five FROB
      proposals and hypotheses, experiments/EXP-FROB-b8cf21/specification.yaml
      and its completed run metrics, knowledge/literature/KN-LIT-796.md,
      knowledge/techniques/KN-TECH-b18366.md and
      knowledge/open-problems/KN-OPEN-d218ec.md. search_knowledge was NOT used
      by this session; absence of a retrieval result is in any case not evidence
      that something was not tried (AGENTS.md "Knowledge retrieval policy").
    unresolved: >-
      Global novelty is unresolved. KN-LIT-796 (Galbraith-Granger-Merz-Petit,
      ePrint 2020/1315) is the obvious prior art for typed and invariant factor
      bases on subfield curves and may already contain a slot-count analysis;
      this program has read its abstract and pages 8-10 only. No novelty claim
      is made and none may be inferred.

