        The surviving q-ary head size n_q(beta) on ML-KEM-shaped bases follows
        the pinned BKZ simulator's Z-shape prediction to within 2 coordinates
        at d in {256, 512}, and the same simulator's n_q at the FIPS shapes is
        the correct transfer of the admissibility gate.
      rigorous_support: >-
        Rigorous ingredient: on the unreduced basis n_q = m exactly, and BKZ
        can only consume q-vectors by inserting shorter vectors, so n_q is
        non-increasing along a tour sequence. The classical statement
        imitated is the BKZ simulator's Z-shape model (KN-LIT-101, KN-TECH-041),
        validated by its authors at block size >= 50.
