        per error and compares their marginal and pairwise joint distributions
        against uniform by Kolmogorov-Smirnov and by the wrap-rate identity
        (wrap rate must equal |delta_i| coordinate-wise). TAIL CHECK: the
        coordinates with the smallest ||b*_i|| are the ones where equidistribution
