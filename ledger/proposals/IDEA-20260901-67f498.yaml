idea:
  id: IDEA-20260901-67f498
  question_id: RQ-MLKEM-001
  goal_id: GOAL-MLKEM-005
  goal_id_note: >-
    Filed under RQ-MLKEM-001's active goal because it runs on that goal's own
    committed apparatus (BKZ-reduced ML-KEM-shaped q-ary bases with CBD targets,
    rt_ctrl_1 v2, d in {256, 512}) at zero marginal reduction cost, and because
    it is the admissibility gate for the meet-in-the-middle rows of
    IDEA-20260901-7eb9e1. Its object is not the goal's best-of-M pair; the
    Coordinator may file it under goal_id null without changing anything below.
  added: '2026-09-01'
  proposed_by: idea-generator
  status: proposed
  title: >-
    EVERY HYBRID ENGINE CHEAPER THAN PLAIN ENUMERATION SPLITS THE GUESS AND
    NEEDS NEAREST-PLANE TO BE ADDITIVE OVER THE SPLIT, AND ADDITIVITY FAILS
    COORDINATE BY COORDINATE WITH PROBABILITY |e*_i| / ||b*_i||. Measure the
    wrap-exposure profile delta_i = |e*_i| / ||b*_i|| of real CBD residual
    errors on real BKZ-reduced ML-KEM-shaped bases -- the goal's own d = 256/512
    bases, no new reduction -- together with the surviving q-ary head n_q(beta),
    and derive the matching-bit budget B(beta) and the split-survival exponent
    E_S(beta) that decide, per guess block g, whether the meet-in-the-middle
    (c = lg w / 2) and representation-technique (c = 0.36) engines are
    admissible at ML-KEM shapes at all. Predicted: admissible while the
    matched set fits inside the q-ary head, and collapsing within a few
    coordinates of leaving it.
  class: measurement
  claim: >-
    (A) THE ALGEBRAIC FACT, EXACT. Babai nearest-plane on a basis B with
    Gram-Schmidt vectors b*_i maps a target t to the unique lattice vector v
    with t - v in the centred fundamental parallelepiped P(B*) = { sum c_i b*_i :
    c_i in [-1/2, 1/2) }. It is NOT additive: for a split t = t_1 + t_2 with
    reduced representatives r_1 = t_1 - NP(t_1), r_2 = t_2 - NP(t_2) in P(B*),
    NP(t_1) + NP(t_2) = NP(t) if and only if r_1 + r_2 lies in P(B*), i.e. no
    Gram-Schmidt coordinate wraps. For the true residual t = v + e with e in
    P(B*) and a far half-target t_1 whose coordinates c_{1,i} are uniform on
    [-1/2, 1/2) (the standard model for a target at distance much larger than
    the covering radius), the wrap probability in coordinate i is exactly
    |delta_i| with delta_i = e*_i / ||b*_i||, and the split survives with
    probability prod_{i in S} (1 - |delta_i|) over the matched coordinate set S.
    This is the collision probability of the Howgrave-Graham hybrid that
    Wunderer's analysis models (both RECALLED, neither read this session); the
    exact per-coordinate form is elementary and no novelty is claimed for it.
    (B) THE OBJECT. The wrap-exposure profile (delta_i)_{i = 1..d} of a CBD
    residual error on a BKZ-beta-reduced ML-KEM-shaped q-ary basis, and its two
    functionals: the split-survival exponent E_S(beta) = - sum_{i in S} log2
    (1 - |delta_i|) and the matching-bit budget B(beta) = sum_{i in S} log2
    ( ||b*_i|| / (2 sd(e*_i)) ), the number of bits by which a half-target's
    rounded coordinates on S can be distinguished. An engine with per-coordinate
    guessing exponent c on a block of g coordinates builds lists of size
    2^(c g / 2) each (meet-in-the-middle) or 2^(c g) (representation lists), and
    is ADMISSIBLE at (g, beta) iff (i) B(beta) >= the list-size bits, so that
    false matches are rare, and (ii) E_S(beta) <= log2 R, where R is the number
    of representations the engine can afford to lose (R = 1 for plain
    meet-in-the-middle, so E_S must be below about 1 bit; R = the
    representation surplus for the Glaser-May engine, about 1.97 bits per
    coordinate for CBD(2) written as a difference of two binary vectors,
    computed this session from the coefficient-wise representation counts
    6/4/4/1/1 on values 0/+-1/+-2 weighted by CBD(2)'s law).
    (C) THE ML-KEM-SPECIFIC PREDICTION, WHICH IS WHY THE MEASUREMENT IS CHEAP
    AND THE EXPECTED VERDICT IS STATED IN ADVANCE. The q-ary embedding's basis
    has a HEAD of n_q(beta) Gram-Schmidt vectors that progressive BKZ has not
    yet touched, with ||b*_i|| = q exactly; on those coordinates the true
    residual's delta_i = e_i / q is at most eta/q = 6e-4 for CBD(2), so a
    matched set S inside the head has E_S <= n_q * 8.7e-4 bits and
    B(beta) >= n_q * log2(q / (2 sigma)) = n_q * 10.7 bits at sigma = 1. A
    list of 2^80 entries needs only 8 head coordinates. PREDICTION: at the
    hybrid's operating block size, the split is admissible with survival
    above 0.9 whenever n_q(beta*) >= 12, and the admissibility boundary is the
    beta at which progressive BKZ consumes the head to below the list's
    matching requirement -- at which point S must move into the GSA middle,
    where delta_i ~ sigma / ||b*_i|| is O(1/10) to O(1) and E_S grows by
    0.1-1.4 bits per coordinate, collapsing survival within a handful of
    coordinates. n_q(beta) is therefore the gate quantity, and it is the same
    integer catalogue M1-1 wants for an unrelated reason (the estimator's
    sample-count optimum).
    (D) WHAT IS DECIDED. If (C) holds, the c < lg w engines of
    IDEA-20260901-7eb9e1 are admissible at every guess block the head can serve,
    and the only thing that stops them is memory charging (that record's
    Row C/D), which is RQ-MLKEM-003's question, not this one's. If (C) fails --
    the head is gone at beta*(g), or the measured delta_i on the head are not
    e_i/q because the embedding order or the reduction has rotated the head --
    then c cannot be lowered below lg w at ML-KEM shapes and the hybrid lane
    is bounded by the memory-free enumeration row alone. Either outcome is a
    number: the largest g at which E_S(beta*(g)) <= 1 bit.
    (E) NOT CLAIMED. No attack, no key recovery, no statement about any FIPS
    203 parameter set. All measurements are at d in {256, 512} (toy tier, q a
    12-bit prime) and the FIPS-shape readout, if any, is a model statement
    carrying the n_q(beta) transfer assumption.
  mechanism: >-
    STAGE 0, THE LOSSY-PROJECTION TEST. The underlying state is (reduced basis
    B, residual error e, the two half-targets and their nearest-plane
    transcripts). The tracked object is the profile (delta_i)_i, a vector of
    d real numbers in [-1/2, 1/2), further coarsened to two scalars per matched
    set S. It discards the basis (only the GS norms enter, and only through
    ratios), the error's ambient coordinates, and every half-target; it retains
    exactly what the wrap event depends on. The discard is compatible with the
    operation: additivity of nearest-plane over a split is a statement about
    delta_i alone (clause A), and the fibre over a profile is the whole family
    of (basis, error) pairs with those GS-coordinate ratios, none of which
    changes the survival probability. It is not a change of coordinates -- the
    basis is not recoverable from d ratios -- and it is deliberately
    FRAME-DEPENDENT, because the algorithm is: EV-MLKEM-94c773's refusal of a
    frame statistic as a STRUCTURAL adjudicator (catalogue OL-6) does not
    apply to an observable that IS the algorithm's own success condition, and
    this record uses it for nothing else.
    STAGE 1, ZERO-COMPUTE DERIVATIONS. (a) The wrap law of clause (A) with the
    uniform-representative model, and its exact finite-alphabet form for a
    CBD residual (e*_i is a signed sum of CBD coordinates against GS
    directions, not Gaussian). (b) The representation surplus per coordinate
    for CBD(2) and CBD(3) written as differences of eta binary vectors, exact
    rationals. (c) The matching-bit budget formula and the list-size
    requirement per engine. (d) The GSA/Z-shape prediction of n_q(beta) from
    the pinned BKZ simulator at d in {256, 512} and at the FIPS shapes.
    STAGE 2, MEASURE ON THE GOAL'S OWN BASES (no new reduction). For every
    archived BKZ-reduced basis of GOAL-MLKEM-005's rt_ctrl_1 v2 apparatus
    (d = 256 at beta in {40, 55, 70}; d = 512 as available), and for 1000 fresh
    CBD residual errors per basis: compute the GS coordinates e*_i, the profile
    delta_i, n_q, E_S and B for S = the head and for S = the head plus the
    next k middle coordinates, k in {0, 4, 8, 16, 32}. Then RUN THE ACTUAL SPLIT:
    draw 200 random half-target pairs per error, apply nearest-plane to each
    half, and record whether the sum equals NP(t); compare the empirical
    survival rate against prod (1 - |delta_i|) per matched set. This is the
    measurement and it is O(d^2) per trial in numpy.
    STAGE 3, THE FORCED CONTROLS. (i) UNREDUCED BASIS: n_q = m exactly and
    delta_i = e_i / q exactly on the head, so E_S and B are closed-form and
    the empirical survival must equal prod (1 - |e_i|/q) to sampling error --
    a gate with no free parameter. (ii) ORTHOGONAL LATTICE (scaled Z^d): all
    ||b*_i|| equal, delta_i = e_i / c, survival = prod (1 - |e_i|/c) exactly;
    any deviation is a bookkeeping defect. (iii) GAUSSIAN-SYNTHETIC GSA
    PROFILE: a basis constructed to have exactly a GSA profile with Gaussian
    e*_i; the model's own world, where E_S(model) = -(sum over S of
    E log2(1 - |delta_i|)) is computable and must be reproduced. (iv) PROVES
    TOO MUCH: an LLL-only basis, where the GSA is known to fail (KN-TECH-041)
    and the head is largest; the pipeline must report a LARGER budget B and
    a SMALLER exposure on the head than at beta = 40 -- if it reports the
    same numbers for LLL and BKZ-40 it is blind to the reduction. (v) DECAY:
    as beta increases the head n_q must shrink monotonically and E_S over a
    fixed-size S that starts in the head must rise once S leaves it; a
    quantity that does not move with beta is the artifact tell.
    STAGE 4, THE READOUT. Tabulate, per (d, beta), the largest guess block g
    each engine can serve (list-size bits <= B(beta), E_S <= log2 R), and hand
    the admissibility boundary to IDEA-20260901-7eb9e1's Row C/D as a
    constraint on g*, with the n_q(beta) transfer to FIPS shapes stated as a
    simulator-based extrapolation carrying no claim tier.
  novelty_status: unverified
  novelty_screen:
    corpus: >-
      Read this session as for IDEA-20260901-7eb9e1. Specific to this record:
      H-MLKEM-7d9bcc (statement lines 16-145), IDEA-20260805-3d71ca (grep),
      catalogue M1-1 (n_q, n_1 segment-boundary integers), M1-2 (best-of-R over
      bases), EV-MLKEM-94c773 as cited in catalogue OL-6, IDEA-20260828-55a0de
      in full (Wunderer MITM sweep, which consumes a collision probability it
      does not measure), IDEA-20260813-17acdf in full. No record in the corpus
      measures a Gram-Schmidt coordinate ratio profile, a split-survival
      probability, or a matching-bit budget; the words "nearest-plane" and
      "Babai" occur in ledger/proposals only in RSA/Coppersmith records and in
      55a0de/17acdf as unmeasured cost-model inputs.
    web: >-
      No web query specific to this record succeeded; the Howgrave-Graham
      2007 and Wunderer 2016 references are RECALLED and their exact
      collision-probability formulas were not checked against the sources.
      The elementary wrap law in clause (A) was derived this session and is
      not attributed.
    verdict: >-
      UNVERIFIED. The wrap law is elementary and its use in hybrid MITM
      analyses is certainly known (Howgrave-Graham; Wunderer). What this
      session could not find in the corpus or check externally is a MEASURED
      exposure profile on real BKZ-reduced q-ary bases with the q-ary-head
      mechanism made explicit as the admissibility gate. The honest label is
      unverified; the record's value does not depend on the law being new,
      only on the profile being unmeasured, which the corpus grep supports.
  object_first_candidate:
    tracked_object: >-
      The wrap-exposure profile delta_i = e*_i / ||b*_i|| of a CBD residual on
      a BKZ-reduced ML-KEM-shaped basis, followed from (basis, error) through
      the Gram-Schmidt decomposition to two scalars per matched set: the
      survival exponent E_S and the matching budget B.
    established_families_off_limits: >-
      Off-limits as the primary lens: (1) the projected-error NORM ratio and
      its Beta law (GOAL-MLKEM-005, H-MLKEM-7d9bcc); (2) the scalar
      root-Hermite factor and profile slope (f7c912, M1-2); (3) frame
      statistics used as structural adjudicators (P3, EV-MLKEM-94c773); (4)
      dual-attack score geometry; (5) the MITM cost formulas as consumed by
      55a0de. This record's lens is the ALGORITHMIC success condition of a
      split decode, coordinate by coordinate.
    genuinely_new_or_repackaging: >-
      The law is a repackaging of known hybrid-MITM analysis. The measurement
      is not: no committed record has looked at the head/middle split of the
      exposure on a real reduced q-ary basis, and the identification of
      n_q(beta) as the gate quantity for every sub-enumeration engine at
      ML-KEM shapes is, as far as this session could check, unstated anywhere
      in the corpus.
    concretely_testable: >-
      Yes, and nearly free: one Gram-Schmidt decomposition per archived basis,
      then O(d^2) per trial; the actual split is run rather than modelled, so
      the law is checked against the algorithm on every trial.
    survival_score: >-
      The object survives as long as nearest-plane is the decoder. It
      dissolves for decoders that are not coordinate-wise (e.g. a sieve-based
      CVP or the "fast slicer" batch-CVP of ePrint 2025/1910, logged in the
      staging note), for which additivity is a different question. It also
      dissolves once the matched set must leave the q-ary head, which is the
      boundary the record measures rather than assumes.
  null_object_control: >-
    THE UNREDUCED-BASIS NULL (Stage 3(i)): the identical pipeline on the
    unreduced q-ary basis, where every quantity is closed-form, must return
    E_S = -sum log2(1 - |e_i|/q) and survival = prod (1 - |e_i|/q) to sampling
    error. THE ORTHOGONAL-LATTICE NULL (Stage 3(ii)): same with all GS norms
    equal. Both are known-answer gates with no free parameter. THE
    GAUSSIAN-SYNTHETIC GSA NULL (Stage 3(iii)) is the model's own world and
    tests that the instrument reproduces the model where the model is true by
    construction. The artifact tell is Stage 3(v): the head n_q must shrink
    with beta and the exposure over a fixed S must rise once S leaves the
    head; an exposure that does not change with beta is an artifact.
  discriminated_from:
    - >-
      H-MLKEM-7d9bcc / IDEA-20260805-3d71ca track R = ||pi_{d-beta}(e)||^2 /
      ||e||^2, the NORM of the projection onto the tail block, rotation-
      invariant within the block and capped in its use by log2 M. This record
      tracks the COORDINATE-WISE ratios e*_i/||b*_i|| over the head and middle,
      whose sum of logs is a survival probability, not a norm quantile. Same
      apparatus, disjoint functionals: a basis and error with identical R can
      have arbitrarily different exposure profiles by rotating e within the
      tail block, which is the observation-collision this record's object
      resolves and the goal's does not need to.
    - >-
      Catalogue M1-1 (uncommitted) tracks the pair (n_q, n_1) as the input to
      the estimator's sample-count optimum. This record consumes n_q as a
      GATE on split admissibility, adds the exposure profile and the actual
      split trial, and predicts a consequence (an admissibility boundary in
      beta) that M1-1 does not consider. If M1-1 is dispatched first its
      n_q(beta) measurement is reused verbatim.
    - >-
      IDEA-20260828-55a0de sweeps the Wunderer MITM cost formula at FIPS
      parameters; the collision probability inside that formula is a model
      input it never measures. This record measures the object that
      probability is a model of, on real bases, and reports whether the model
      holds on the head, in the middle, and at the boundary. 55a0de's H1
      (representation-technique success probability) is the heuristic this
      record's Stage 2 validates or falsifies at reduced dimension.
    - >-
      IDEA-20260901-7eb9e1 measures the reduction-side constant K with correct
      guesses supplied and no split. This record measures the GUESSING-side
      admissibility of the engines with c < lg w. The product K/(K + c) needs
      both; neither computes the other's quantity.
    - >-
      Catalogue M1-4 / IDEA-20260805-2b94fe concern replacing the Euclidean
      norm by the CBD log-likelihood in scoring; this record uses nearest-plane
      unchanged and asks about additivity, not about the metric.
  citations:
    - ref: "N. Howgrave-Graham, A Hybrid Lattice-Reduction and Meet-in-the-Middle Attack Against NTRU, CRYPTO 2007"
      provenance: recalled
      claim: >-
        The MITM hybrid decodes half-guesses separately with nearest-plane and
        matches on rounded coordinates; its success depends on nearest-plane
        being additive over the split, with a per-coordinate wrap analysis.
      verified_by: null
    - ref: "T. Wunderer, A detailed analysis of the hybrid lattice-reduction and meet-in-the-middle attack, J. Math. Cryptol.; IACR ePrint 2016/733"
      provenance: recalled
      claim: >-
        A corrected cost analysis of the hybrid including the collision
        probability of the split as a function of the reduced basis' GS
        norms and the error distribution; existence confirmed by
        IDEA-20260828-55a0de via WebSearch, content not fetched by either
        session.
      verified_by: null
    - ref: "T. Glaser, A. May, How to Enumerate LWE Keys as Narrow as in Kyber/Dilithium, CANS 2023; IACR ePrint 2022/1337"
      provenance: recalled
      claim: >-
        Representation-technique enumeration of CBD keys at heuristic
        2^(0.36 N) time and memory for eta = 2; supplies the R (representation
        surplus) whose log must exceed E_S for that engine to survive a split.
      verified_by: null
    - ref: "KN-TECH-041 (this corpus): GSA, head/tail deviations, LLL bases violate the GSA"
      provenance: kb
      claim: >-
        The GSA is a simplification whose head and tail deviations are known
        and whose failure on LLL bases is stated by its author; the basis for
        the proves-too-much control (Stage 3(iv)).
      verified_by: "idea-generator subagent, 2026-09-01: read in full."
    - ref: "H-MLKEM-7d9bcc and the rt_ctrl_1 v2 apparatus (GOAL-MLKEM-005, DEC-20260826-9d7d93, EV-MLKEM-09d715)"
      provenance: internal
      claim: >-
        A committed, content-bound instrument producing BKZ-reduced
        ML-KEM-shaped q-ary bases at d = 256 (beta up to 70) and d = 512 with
        CBD targets, journalled per tour; the archived bases are the input to
        Stage 2 and no new reduction is needed.
      verified_by: "idea-generator subagent, 2026-09-01: H-MLKEM-7d9bcc statement lines 16-145 and GOAL-MLKEM-005 current_batch_state and next_action read; the archived basis files themselves were not opened."
  assumptions:
    - >-
      A1. The far-half-target coordinates are uniform on [-1/2, 1/2) in GS
      units, so the wrap probability is exactly |delta_i|. This is the
      standard model for targets far from the lattice and Stage 2 tests it by
      running the split rather than trusting it.
    - >-
      A2. GOAL-MLKEM-005's archived bases are retrievable with their GS data
      or can be re-derived from the committed seeds and strategies file; if
      not, Stage 2 pays one reduction per cell at d = 256 (minutes to hours
      each per that goal's committed timings) and the record's cost rises
      from low to medium.
    - >-
      A3. The matching in an actual MITM engine is on rounded GS coordinates
      of the head; if an engine matches on a different projection, B(beta) is
      recomputed for that projection and the record's gate is re-derived,
      not abandoned.
  proof_search_map:
    bottleneck: >-
      Whether the matched set can stay inside the q-ary head at the hybrid's
      operating block size. If yes, E_S is negligible and c can be lowered;
      if no, survival collapses and c = lg w is the only admissible engine.
    baseline_embedding:
      parameter_slice: >-
        The unreduced basis (beta = 2), where n_q = m and every quantity is
        closed-form; and the plain (unsplit) nearest-plane, where survival is
        1 by definition.
      reproduction_check: >-
        Symbolic: on the unreduced basis delta_i = e_i/q and survival =
        prod (1 - |e_i|/q); numeric: the pipeline must return those values on
        20/20 seeds to sampling error before any reduced basis is read.
    observation_collision:
      observable: "E_S and B per (basis, matched set), and the empirical split survival rate."
      distinct_preimage_search: >-
        Two bases with the same GS-norm profile but different GS FRAMES give
        the same B and, for a fixed error, different exposure profiles; two
        errors with the same norm give different profiles. The observable is
        therefore per (basis, error) and is reported as a distribution over
        errors per basis, never as a basis-only number. The separating
        condition is the empirical survival rate, which is measured per pair.
    constructive_transforms:
      - transform: observable_fiber
        proposed_object: >-
          Hold the GS-norm profile fixed and vary the frame (the same lattice
          under different reduced bases from different seeds); the exposure
          profile's dispersion across the fibre is the frame-sensitivity of
          the gate.
        predicted_gain: >-
          Establishes whether the admissibility boundary is a property of
          (d, beta) or of the particular reduction, which decides whether it
          can be transferred to FIPS shapes through a simulator at all.
      - transform: boundary_lift
        proposed_object: >-
          Extend the matched set from the head into the middle one coordinate
          at a time and record E_S; the boundary at which E_S crosses 1 bit is
          the strict inward limit of the split.
        predicted_gain: "A measured admissibility boundary in coordinates, per (d, beta)."
    quantifier_order: >-
      FOR EACH archived (d, beta) basis and FOR EACH matched set S in the
      declared family, THERE EXISTS a measured distribution over 1000 CBD
      errors of (E_S, B) and an empirical survival rate over 200 splits per
      error. The CLAIM is that on S inside the head the survival exceeds 0.9
      at every basis, and that the boundary in |S| is monotone in beta. It is
      NOT a claim about FIPS shapes except through the simulator-based
      n_q(beta) extrapolation, stated as such.
    method_ceiling:
      strongest_certifiable_claim: >-
        "On the tested (d, beta) bases, nearest-plane is additive over a
        random split on the q-ary head with probability p_head (interval),
        the matching budget of the head is B_head bits, and the largest guess
        block each engine can serve is g_max(engine, d, beta)." It cannot
        certify anything about a decoder other than nearest-plane, and cannot
        certify the FIPS-shape head size except as a simulator readout.
      nearby_object_control: >-
        A basis in which the head has been DELIBERATELY consumed (run BKZ
        with a schedule that touches the q-vectors first, or randomise the
        basis by a unimodular transform before reduction so no q-vector
        survives): the desired conclusion (cheap admissibility) must FAIL
        there, with E_S on any |S| = 8 set exceeding 1 bit. A pipeline that
        reports cheap admissibility on a headless basis has not identified
        the head as the load-bearing structure.
    proof_obligations:
      - claim: "Unreduced-basis and orthogonal-lattice nulls reproduce their closed forms."
        responsibility: baseline
      - claim: "The empirical split survival equals prod (1 - |delta_i|) within sampling error on every matched set."
        responsibility: correctness
      - claim: "E_S over a fixed S rises once S leaves the head, and n_q falls with beta."
        responsibility: strictness
      - claim: "The headless nearby object fails admissibility."
        responsibility: scope
      - claim: "B(beta) is computed for the projection the engine actually matches on."
        responsibility: interface
  predictions:
    - metric: "Empirical split survival on S = head, per archived basis, 1000 errors x 200 splits"
      direction: higher
      minimum_effect: "above 0.9 at every d = 256 basis with beta <= 70 and n_q >= 12; below 0.5 on the headless nearby object."
    - metric: "Ratio of empirical survival to prod (1 - |delta_i|) on every matched set"
      direction: different
      minimum_effect: "within 5 percent; a systematic departure means assumption A1 fails on these bases and the law must be replaced by the measured curve."
    - metric: "n_q(beta) on the archived bases versus the pinned BKZ simulator's prediction"
      direction: different
      minimum_effect: "agreement within 2 coordinates; larger disagreement is the informative negative and is what M1-1 would also want."
    - metric: "E_S per added middle coordinate once S leaves the head, at beta = 55 and 70"
      direction: higher
      minimum_effect: "between 0.1 and 1.4 bits per coordinate; below 0.05 means the middle is as good as the head and the head mechanism is not load-bearing."
    - metric: "g_max per engine per (d, beta) from the two admissibility inequalities"
      direction: different
      minimum_effect: "reported as a table; the pre-registered expectation is that g_max for c = lg w / 2 exceeds the g* of IDEA-20260901-7eb9e1's Row C at every tested beta, i.e. admissibility is not the binding constraint and memory is."
  minimal_test:
    design: >-
      Stages 1-3 on the d = 256 archived bases only: one GS decomposition per
      basis, 1000 errors, 200 splits per error, plus the four nulls and the
      headless nearby object (one extra reduction at d = 256). Hours on one
      workstation, numpy only. This discriminates because the null gates have
      closed-form answers, the head prediction has a forced direction and a
      pre-registered threshold (0.9), and the headless control must fail.
      d = 512 bases are added only if archived with GS data; no new d = 512
      reduction is proposed (GOAL-MLKEM-005's own next_action refuses one
      until its instrument pass is archived).
    controls:
      - "UNREDUCED-BASIS NULL: closed-form E_S, B and survival."
      - "ORTHOGONAL-LATTICE NULL: all GS norms equal."
      - "GAUSSIAN-SYNTHETIC GSA NULL: the model's own world."
      - "PROVES TOO MUCH: LLL-only basis must show a larger head budget than BKZ-40."
      - "HEADLESS NEARBY OBJECT: admissibility must fail."
      - "DECAY: n_q falls with beta; exposure over a fixed S rises once S leaves the head."
    required_metrics:
