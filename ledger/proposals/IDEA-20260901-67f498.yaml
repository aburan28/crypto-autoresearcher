        Measure n_q on every archived basis and compare with the simulator run
        on the same starting profile (this is catalogue M1-1's gate, reused);
        report the signed discrepancy per beta and its trend in d. TRANSFER
        ASSUMPTION: d = 512 to 1537-2561 and beta = 70 to 400-900, stated as an
        extrapolation of a simulator, not of a measurement.
  target_complexity:
    time_exponent: >-
      No new algorithm and no new exponent; the record produces an
      ADMISSIBILITY GATE for the c < lg w rows of IDEA-20260901-7eb9e1, whose
      exponents are stated there. If admissible, those rows' time exponents
      stand as stated in that record (e.g. 2^177.9 at ML-KEM-768 for
      c = lg w / 2 under K = 0.0478, uncharged); if not, the lane's exponent is
      the memory-free enumeration row's.
    memory_exponent: >-
      The gate does not change any memory figure; the engines it admits carry
      memory 2^(c g), equal to time at balance, and are reversed by the
      T * M^(1/3) charge per IDEA-20260901-7eb9e1 Row C/D. The record notes,
      without claiming, that a head-matched MITM has memory-access locality no
      better than a sieve's, so no locality credit is available.
    best_known: >-
      The same frontier as IDEA-20260901-7eb9e1: primal_bdd / RC.MATZOV
      (EV-MLKEM-020) and the uncomputed estimator primal_hybrid; no committed
      record measures split survival.
    hidden_overhead: >-
      The matching step's false-match rate is bounded by 2^(list bits - B),
      charged as retries; the record reports B so that the overhead is a
      number, not an assumption. The half-target model (H1) can fail near the
      lattice and the record measures that regime rather than assuming it away.
    tradeoff_note: >-
      None of its own; it constrains where on IDEA-20260901-7eb9e1's g-curve the
      MITM engines may sit. Parallelisation is unaffected.
