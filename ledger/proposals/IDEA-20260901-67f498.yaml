    - id: H1
      statement: >-
        For a half-target at distance at least 10 covering radii from the
        lattice, the Gram-Schmidt coordinates of its nearest-plane residual are
        uniform on [-1/2, 1/2) and independent across coordinates, uniformly
        over the BKZ-reduced ML-KEM-shaped bases at d in {256, 512} and
