idea:
  id: IDEA-20260815-0676d4
  question_id: RQ-PAIR-f2e31f
  added: '2026-08-15'
  title: >-
    PAIRING-BASED PROTOCOLS ASSUME THE THREE GROUPS HAVE MATCHED SECURITY
    AND exTNFS MOVED ONLY ONE OF THEM: measure the resulting imbalance
    across deployed curves
  class: measurement

  claim: >-
    A pairing gives three groups: two elliptic-curve groups and a target
    field group. Parameters were chosen so all three offer matched security.
    exTNFS attacks the target field only, so the balance is broken and the
    curves are over-provisioned on two axes and under-provisioned on one.
    Measuring the imbalance per deployed curve says how much curve size is
    being wasted and how much security is actually available.

  mechanism: >-
    For each deployed pairing-friendly curve, compute the best attack cost
    against each of the three groups under one cost model with memory
    charged. Report the minimum across groups as the effective security and
    the spread as the imbalance.

  novelty_status: adaptation

  novelty_screen:
    method: >-
      Read of GOAL-PAIR-001; grep 'pairing-friendly' (46), 'target field',
      'embedding degree', 'balanced security'.
    results: >-
      exTNFS effects on target fields are represented; no record computes
      the three-group imbalance per deployed curve under one cost model.
    verdict: >-
      ADAPTATION. The imbalance is understood in the pairing literature;
      the contribution is a per-curve computation in this program's
      charged framework.

  object_first_candidate:
    tracked_object: >-
      THE THREE-GROUP SECURITY VECTOR of each deployed curve, and the
      imbalance across it.
    lossiness: >-
      Quoting one security level projects the vector onto its intended
      common value, which exTNFS broke.
    propagation: >-
      Not applicable; no tracked object propagating under a group law is
      proposed.
    survival_score: >-
      Survives while attack costs are computable for all three groups; the
      target-field cost depends on the exTNFS instantiation and inherits
      its uncertainty.

  null_object_control: >-
    NULL 1 -- a curve chosen before exTNFS with its originally claimed
    balanced level, which must show the imbalance the attack introduced.
    NULL 2 -- the elliptic-curve groups, whose security must be unaffected
    by exTNFS; a computation showing otherwise is misapplying the attack.

  discriminated_from:
    - >-
        The exTNFS memory-charging record in this series, which recomputes
        the target-field cost; this consumes that output and places it
        against the two curve groups.
    - >-
        The subgroup-membership record in this series, which concerns
        implementation behaviour rather than parameter balance.

  assumptions:
    - >-
        Attack costs are computable for all three groups under one cost
        model, which requires the exTNFS instantiation from the companion
        record.
    - >-
        The two elliptic-curve groups are attacked only generically, which
        holds unless a curve has special structure and must be checked
        rather than assumed.

  predictions:
    - metric: >-
        pre-exTNFS curve control
      direction: different
      minimum_effect: >-
        FORCED to show the imbalance the attack introduced.
    - metric: >-
        elliptic-curve group invariance
      direction: different
      minimum_effect: >-
        FORCED unaffected by exTNFS; otherwise the attack is being
        misapplied.
    - metric: >-
        security vector and imbalance per deployed curve
      direction: different
      minimum_effect: >-
        The measurement; the minimum across groups is the effective
        security and the spread is wasted provisioning.
    - metric: >-
        curve size implied by rebalancing
      direction: different
      minimum_effect: >-
        Directly actionable: it says what parameters would restore
        balance under the current attack landscape.

  minimal_test:
    design: >-
      Two deployed curves, all three groups, both nulls, consuming the
      companion record's exTNFS cost.
    controls:
      - >-
          Pre-exTNFS balanced-curve control.
      - >-
          Elliptic-curve group invariance check.
      - >-
          One cost model applied to all three groups, with memory
          charged uniformly.
      - >-
          Special curve structure checked rather than assumed absent.
    required_metrics:
      - >-
          Security level per group per curve.
      - >-
          Imbalance spread per curve.
      - >-
          Effective security as the minimum across groups.
      - >-
          Rebalanced parameters implied.

  falsification_conditions:
    - >-
        A null misbehaves. The attack is being misapplied to a group it
        does not reach.
    - >-
        The imbalance is small. Deployed curves remain near-balanced under
        charged memory, which would be a reassuring outcome and worth
        recording.
    - >-
        The imbalance is large. Deployed curves are substantially over-
        provisioned on the curve groups and their effective security is
        set by the target field, which is directly relevant to parameter
        selection.
    - >-
        The target-field cost is too uncertain to compute. The imbalance
        cannot be quantified and the record must say so rather than pick a
        point estimate.

  confounders:
    - >-
        INHERITED exTNFS UNCERTAINTY: the target-field cost carries the
        polynomial-selection and memory-model uncertainty of its source
        record, and the imbalance is no firmer than that.
    - >-
        SPECIAL CURVE STRUCTURE: a curve with an efficiently computable
        endomorphism has a small generic-attack discount, which must be
        applied rather than ignored when computing the curve groups'
        levels.

  interpretation_limits:
    - >-
        Computes security levels under stated cost models; mounts no
        attack.
    - >-
        Scoped to the tested curves and the inherited exTNFS
        instantiation.
    - >-
        Rebalanced parameters are an implication of the computation, not a
        recommendation.

  heuristic_assumptions:
    - id: HEUR-PAIR-BAL-1
      statement: >-
        The two elliptic-curve groups of a deployed pairing-friendly
        curve are attacked only by generic methods, so exTNFS changes
        only the target-field level.
      rigorous_support: >-
        Rigorous ingredient: exTNFS attacks discrete logarithms in the
        target finite field and has no analogue on the curve groups,
        which is what the attack's own scope establishes. THE GAP:
        pairing-friendly curves are constructed rather than random and
        often carry an efficiently computable endomorphism, which gives
        a small generic-attack discount on the curve groups -- so
        'unaffected' is not quite 'unchanged' and the discount must be
        applied.
      falsification_condition: >-
        A deployed curve whose curve-group security is materially below
        the generic bound for its group order.
      validation_plan: >-
        SAMPLE: both curve groups of every tested curve, with any
        endomorphism discount computed explicitly. TAIL CHECK: curves
        with the largest endomorphism discount. TRANSFER: none; the
        computation binds the tested curves.

  target_complexity:
    time_exponent: >-
      NO ATTACK EXPONENT IS CLAIMED; this record proposes no algorithm for
      any hard problem. Symbolic computation under stated cost models.
    memory_exponent: >-
      Negligible.
    best_known: >-
      Incumbents are the published exTNFS analyses and the generic bounds
      for the curve groups; both are used and neither is improved.
    hidden_overhead: >-
      The target-field cost's uncertainty propagates directly into the
      imbalance and is the dominant hidden term.
    tradeoff_note: >-
      A balanced curve wastes nothing and is only as strong as its weakest
      group; the imbalance measures how far deployed curves have drifted
      from that.

  dominated_by: >-
    CHECKED ACROSS EVERY AXIS. As an attack: n/a (no result claimed); no
    ECDLP frontier row applies. As security analysis: dominated by the
    published exTNFS and pairing literature. As a per-curve three-group
    imbalance computation in this framework: none exists here. Not null on
    any axis.
  sota_delta: >-
    No attack, no exponent. Content delivered: the three-group security
    vector of deployed pairing-friendly curves under one charged cost model,
    the imbalance exTNFS introduced, and the rebalanced parameters that
    imbalance implies.

  estimated_cost:
    implementation: low
    compute: low
  recommended_priority: high

  honest_prior_of_survival: >-
    0.7 that the companion record's exTNFS cost is available and usable. 0.9
    that the curve-group levels compute cleanly with the endomorphism
    discount. 0.7 that the imbalance is large, since that is what exTNFS's
    effect on target fields implies and the interest is in the magnitude.

  status: proposed
  proposed_by: claude-code-session
  proposed_at: '2026-08-15'
