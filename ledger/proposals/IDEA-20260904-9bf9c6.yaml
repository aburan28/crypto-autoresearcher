idea:
  id: IDEA-20260904-9bf9c6
  question_id: RQ-SSI-001
  goal_id: GOAL-SSI-001
  handoff_id: TASK-20260904-9a7471
  added: '2026-09-04'

  title: >-
    ONEEND IS POLYNOMIAL-TIME ON THE F_p-RATIONAL LOCUS AND CSIDH IS STILL NOT
    BROKEN, SO COROLLARY 1.2'S CASCADE CANNOT BE UNIFORM IN THE RETURNED
    ENDOMORPHISM: an explicit family where delta_E = 1, Algorithm 2 succeeds at
    the first entry of its own table, and the free non-scalar endomorphism is
    Frobenius -- which generates a RANK-2 ring and can never generate End(E) --
    forcing the OneEnd-to-EndRing reduction to carry an unstated precondition,
    an unstated number k of independent calls, and an unstated saturation step
    whose cost is an INDEX whose largest prime factor nobody in this program has
    measured

  class: control

  claim: >-
    STATED FIRST. Nothing here claims an error in any published theorem. The
    expected outcome is that the published reduction has a precondition that is
    perfectly satisfied by the p^{1/3} algorithm's randomised output and is
    simply not visible in the one-line corollary this program quotes. The
    deliverable is that precondition, written down, with the number of calls and
    the saturation cost measured -- because every security figure this program
    publishes for SQIsign and the CGL hash travels through that corollary, and
    the program has quoted it about a dozen times without ever stating what it
    requires.

    (A) THE WITNESS, AND IT IS AIRTIGHT AND FREE. Let E/F_{p^2} be supersingular
    with j(E) in F_p. Then E is defined over F_p up to twist, so the Frobenius
    conjugate E^{(p)} is isomorphic to E and the IDENTITY is a separable isogeny
    E -> E^{(p)}: delta_E = 1. Consequently Algorithm 2 of the frozen source
    succeeds on the FIRST entry of its own table for any B whatsoever -- the pair
    ((E, id), (E^{(p)}, id)) is a matching entry by construction -- and returns
    phi = id, so Frob o phi = Frob is the output of OneEnd. Frobenius has reduced
    norm p and reduced trace 0, satisfies pi^2 = -p, and is NOT in Z. So:
        ONEEND RESTRICTED TO THE F_p-RATIONAL LOCUS IS SOLVED IN O(log p) BIT
        OPERATIONS, WITH NO SEARCH, NO SMOOTHNESS, AND NO HEURISTIC.
    Membership in the locus is decided by one field-membership test on j.

    (B) THE TENSION. Corollary 1.2 states that, assuming Heuristic 1, EndRing is
    solvable in p^{1/3+o(1)} by "applying the computational reductions [35,
    Theorem 1] and [35, Proposition 8.5]" to Theorem 1.1's OneEnd algorithm. If
    that reduction were a black box making ONE call to a OneEnd solver on the
    GIVEN curve, then on the locus it would inherit the polynomial cost of (A)
    and EndRing would be polynomial there. It is not: computing End(E) for an
    F_p-rational supersingular curve is the second phase of Delfs-Galbraith and
    is believed to cost Otilde(p^{1/4}), and if it were polynomial then CSIDH,
    (qt-)Pegasis and PQarrots would be broken outright by route 2 of
    IDEA-20260904-6e8793. THEY ARE NOT BROKEN. So at least one of the following
    is true, and the audit's job is to say which:
      (D1) The reduction needs SEVERAL endomorphisms, not one, and they must
           generate a rank-4 order. Frobenius alone generates Z[pi], of rank 2,
           and a OneEnd oracle queried repeatedly on the SAME locus curve returns
           the SAME Frobenius every time. The reduction must therefore query
           re-randomised curves, and its cost is the GENERIC OneEnd cost, not the
           cost on the input.
      (D2) The reduction imposes a condition on the returned alpha -- on
           disc(Z[alpha]), on its primitivity, on its being "generic" -- that
           Frobenius fails.
      (D3) The folklore that EndRing on the locus costs p^{1/4} is wrong.
    (D1) and (D2) are both benign for the published theorem and both are
    PRECONDITIONS THIS PROGRAM HAS NEVER RECORDED. (D3) would be a major
    correction. The dichotomy is forced: the three cannot all be false.

    (C) THE QUANTITY THE AUDIT ACTUALLY PRODUCES, WHICH IS NOT A VERDICT.
    Suppose (D1). Then the true cost of Corollary 1.2 is k(p) * p^{1/3+o(1)}
    where k(p) is the number of independent OneEnd outputs needed, plus the cost
    of turning the generated order into the MAXIMAL one. Generically two
    trace-zero endomorphisms alpha_1, alpha_2 already give rank 4 via
    {1, alpha_1, alpha_2, alpha_1 alpha_2}, so k = 2 is plausible for RANK. But
    rank is not maximality: the generated order sits inside End(E) with an INDEX,
    and Algorithm 3's outputs are alpha = omega-hat o Frob o phi o omega with
    reduced norm (deg omega)^2 * p * delta, so the generated order's discriminant
    is a product of large integers and the index is generically LARGE. Turning a
    full-rank suborder into the maximal order is, in the classical algorithms
    this session can recall, an operation that involves the index's prime
    factorisation -- and FACTORING AN INTEGER OF THAT SIZE IS SUBEXPONENTIAL, NOT
    POLYNOMIAL. Either the published reduction avoids that (which is exactly the
    kind of thing [35] would have had to do to be a PPT reduction, and is
    probably its main technical content), or the cascade carries a subexponential
    term. THE AUDIT'S OUTPUT IS THE MEASURED DISTRIBUTION OF THAT INDEX AND OF
    ITS LARGEST PRIME FACTOR, which is a number every later reader can reuse
    whichever way the audit comes out.

    (D) WHY THIS IS A CONTROL AND NOT A COMPLAINT. The measurement has a matched
    null that decides between two competing explanations of any observed
    smallness of the index: either (i) the algorithm's outputs are special --
    they are pullbacks through a walk of a Frobenius composition and might
    systematically generate a larger order than random elements of the same norm
    would -- or (ii) they are generic, and the index behaves exactly as for
    random trace-zero vectors of matched norm in the Gross lattice. The null arm
    is that random-vector ensemble. Only (i) would make the cascade cheaper than
    the generic bookkeeping suggests, and only the null can tell them apart.

    (E) NOT CLAIMED. No error in [35]. No error in Corollary 1.2. No claim that
    the cascade is more expensive than advertised -- the record's own prior is
    that (D1) and (D2) hold and the published theorem is fine. What is claimed is
    that this program quotes a cascade whose preconditions it has never written
    down, that an explicit witness family makes those preconditions necessary,
    and that the two numbers that price the cascade (k and the index's largest
    prime factor) are measurable at toy scale in an afternoon.

  mechanism: >-
    TRACKED OBJECT: the ORDER GENERATED BY THE ORACLE'S OUTPUTS -- the Z-algebra
    O_k = Z<alpha_1, ..., alpha_k> generated by k successive OneEnd answers on
    one curve -- carried as the pair (rank, index in End(E)) as k grows.

    LOSSY-PROJECTION TEST (algebraic, zero compute). The projection sends a list
    of k endomorphisms, each a rank-4-lattice vector with its own degree,
    factorisation and isogeny path, to two integers: the rank of the generated
    order and its index in the maximal one. It is drastically lossy -- neither
    the endomorphisms nor even their degrees are recoverable from the pair -- and
    what it discards is discarded COMPATIBLY with the operation the reduction
    applies, namely adjoining a further generator: adjoining alpha_{k+1} can only
    raise the rank and can only DIVIDE the index, so the retained pair propagates
    deterministically and MONOTONICALLY under the reduction's own step. That
    monotonicity is what makes the object measurable as a trajectory rather than
    as a snapshot, and it is the reason this is an object rather than a
    re-coordinatisation: the list of endomorphisms itself carries everything and
    tells you nothing about when the reduction terminates; the pair (rank, index)
    is exactly the termination condition.

    THE MEASUREMENT, STATED SO IT CAN BE PRICED. At toy primes where End(E) is
    known exactly on the quaternion side, for each supersingular vertex:
      R1. Run Algorithm 3's output map k times independently -- or, since the
          toy graphs are fully enumerable, SIMULATE its output distribution
          exactly by drawing a random non-backtracking walk omega of the
          prescribed length, computing the minimal conjugate isogeny at the
          endpoint, and pulling back. Record each alpha_i and its reduced norm.
      R2. Compute rank(O_k) and index [End(E) : O_k] for k = 1, 2, 3, ....
      R3. Record the index's full factorisation and its largest prime factor.
      R4. Repeat with the NULL ensemble: alpha_i drawn uniformly from trace-zero
          vectors of End(E) with matched reduced norm.
      R5. Separately, verify (A) directly: for every locus vertex, check
          delta_E = 1 and that Algorithm 2's table match is the trivial one.

